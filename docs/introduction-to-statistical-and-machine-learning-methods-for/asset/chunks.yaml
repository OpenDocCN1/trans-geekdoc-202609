- fmt: '

    Principal components are weighted linear combinations of the predictor variables
    where the weights are chosen to account for the largest amount of variation in
    the data. Total variation, in this case, is the sum of the sample variances of
    the predictor variables. The principal components are numbered according to how
    much variation in the data is accounted for. Since the principal components are
    orthogonal to each other, each principal component accounts for a unique portion
    of the variation in the data.


    ### Figure 2.9: Feature Extraction


    ![image](Images/f0029-01.jpg)


    Principal components analysis can be used for dimension reduction since usually
    only the first few principal components explain enough of the proportion of the
    total variation in the data. For example, if the data scientists have 1,000 variables
    but the first 10 principal components explain 95% of the variation in the data,
    then only the first 10 principal components would be used in the model. It reduces
    the high dimensionality in the input space, the original variables, and creates
    more informative variables for the model.


    [Figure 2.10](#Chapter02.xhtml#ch02fig10) graphically illustrates principal component
    analysis. The first principal component (`PC1`) is constructed in such a way that
    it captures as much of the variation in the input variables set as possible. Then
    the second principal component (`PC2`) is orthogonal to `PC1` and captures as
    much as possible of the variation in the input data not captured by `PC1`. The
    third component follows the same rule and the process keeps going.


    # Text Mining


    Text parsing processes textual data into a term-by-document frequency matrix.
    Transformations such as singular value decomposition (`SVD`) alter this matrix
    into a data set that is suitable for predictive modeling purposes. `SVD` is simply
    a matrix decomposition method. When it is used on a document by term matrix, a
    set of predictor variables is produced that contains information about what is
    written in the text. The set of coefficients that are produced can be used to
    derive concepts or topics from the document collection. For example, the documents
    could be Call Center dialogues and the terms could be angry, frustrated, upset,
    dislike, dissatisfied, and so on. The coefficients can be used to create variables
    that represent the strength of the term in the document. Variables that show the
    strength of terms associated with unhappy customers should be useful predictors
    in a churn model.


    ### Figure 2.10: Principal Component Analysis


    ![image](Images/f0030-01.jpg)


    ### Figure 2.11: Text Mining


    ![image](Images/f0030-02.jpg)


    # Variable Clustering


    Variable clustering finds groups of variables that are as correlated as possible
    among themselves and as uncorrelated as possible with variables in other clusters.
    This is used as a dimension reduction technique as the data scientists would choose
    one variable from each cluster based on subject-matter knowledge. The data scientists
    could also choose a representative variable from each cluster based on the correlation
    with its own cluster and the correlation with the other clusters.


    # Autoencoder


    Autoencoder data transformation is an algorithm that aims to transform the predictor
    variables into derived variables with the least amount of distortion. In other
    words, it attempts to discover structure within the data to develop a compressed
    representation of the original variable. The first step is encoding where the
    algorithm efficiently compresses the data. The second step is decoding where the
    algorithm tries to reconstruct the original data. The decoder is used to train
    the encoder.


    If the predictor variables were independent of each other, the encoding step would
    produce derived inputs with very limited value. However, if some sort of structure
    exists in the data such as correlated predictor variables, then the encoding step
    would produce derived inputs that reconstruct the predictor variable without holding
    on to the redundancies within that variable.


    Autoencoder data transformation can be used for dimension reduction just like
    principal components analysis. Whereas principal components analysis attempts
    to discover linear relationships in the data, the derived variables from autoencoders
    can discover nonlinear relationships. Furthermore, whereas principal components
    are uncorrelated, the derived variables from autoencoders might have correlations
    since autoencoding strives for accurate reconstruction of the variable.


    ### Figure 2.12: Variable Clustering


    ![image](Images/f0031-01.jpg)


    ### Figure 2.13: Autoencoder Data Transformation


    ![image](Images/f0032-01.jpg)


    # Feature Selection


    Data scientists usually deal with hundreds of predictor variables. This limits
    the ability to explore and model the relationships among the variables since as
    the dimensions increase, the data becomes sparse. The large number of predictor
    variables leads to the curse of dimensionality, which means the complexity of
    the data set increases rapidly with the increased number of variables. The bottom
    line is the amount of data a data scientist needs increases exponentially as the
    number of variables increase.


    The remedy to the curse of dimensionality is feature selection, also known as
    dimension reduction. In other words, data scientists want to eliminate irrelevant
    and redundant variables without inadvertently eliminating important ones. Some
    of the dimension reduction methods are correlation analysis, regression analysis,
    and variable clustering.


    When features are created, a common recommendation is to eliminate the original
    variables that were used to construct the features because the features and the
    original variables will probably be redundant. For example, if the log of age
    is created, the original age variable is eliminated. However, another point of
    view is to keep all the variables for the dimension reduction techniques and see
    which ones survive to the final model. In this way, data scientists see whether
    age or the log of age survives to the final model.


    Redundancy among predictor variables is an unsupervised concept since it does
    not involve the target variable. On the other hand, the relevancy of a variable
    considers the relationship between the predictor variable and the target variable.
    In high-dimensional data sets, identifying irrelevant variables is more difficult
    than identifying redundant variables. A good strategy is to first reduce redundancy
    and then tackle irrelevancy in a lower dimension space.


    ### Figure 2.14: Variable Selection


    ![image](Images/f0033-01.jpg)


    A redundant variable does not give any new information that was not already explained
    by other variables. For example, knowing the value of input household income usually
    is a good indication of home value. As one value increases, the other value also
    increases.


    An irrelevant variable does not provide information about the target. For example,
    if the target is whether you gave to a charitable organization, predictions change
    with the predictor variable response to previous solicitations, but not with the
    predictor variable show size.


    [Figure 2.14](#Chapter02.xhtml#ch02fig14) shows a data set with numerous variables
    such as the original variables, derived variables, transformed variables, variables
    obtained from text mining, variables obtained from principal components analysis,
    variables obtained from autoencoder data transformation, and the variables obtained
    from social network analysis. The goal is to reduce the number of variables down
    to a reasonable number while still maintaining a high predictive accuracy for
    the model. It should be noted that social network analysis is discussed in a later
    chapter.


    # Model Selection

    '
