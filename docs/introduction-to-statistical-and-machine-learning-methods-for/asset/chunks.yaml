    A recurrent business problem in many industries is recommending the right product
    or service to the right customer. Imagine an online sports retail company that
    sells many different products for several types of sports. For example, the sports
    might include soccer, baseball, basketball, and cycling, and the products might
    include clothes and equipment.


    Figure 5.5: Matrix Factorization to Estimate the Missing Values


    ![image](Images/f0070-01.jpg)


    Imagine also that this company has a reward program that incentivizes customers
    to sign in when shopping or browsing. When customers sign-in, they can be identified,
    and all transactions over time can be matched. Customers are asked to rate the
    products that they purchased after a certain period, allowing them to experiment
    with the product and then provide a more accurate rating.


    A recurrent promotion can identify customers who purchased similar products and
    have similar ratings. This combination of customers and items creates a huge matrix.
    A factorization machine model estimates all missing ratings, considering customers
    who do not have the rated products. A reasonable scenario considers customers
    who did purchase a product but did not rate it. A target marketing campaign selects
    all products with high estimated ratings for customers. Each customer receives
    a promotion for each one of the products with high estimated ratings. Before launching
    the campaign, a filter is applied to remove all items already purchased by the
    customers. As customers can purchase products and not rate them, an estimated
    rating is computed for those customers. By removing the products already purchased
    by the customer, the company can avoid sending out messages and promotions about
    products the customers already have.


    # Ensemble Models


    Ensemble models create new models by combining the predictions from multiple models
    consisting of different modeling techniques or different modeling structures (multiple
    neural networks with different numbers of hidden layers and hidden units). The
    combined model is then used to score new data. For binary targets, data scientists
    can take the mean of the posterior probabilities as the final predicted probability.
    Another approach is to derive a decision (for each observation scored in the model,
    if the posterior probability is greater than 50% then class 1, otherwise class
    0) and see how many models predict a 1 versus a 0. Then take a plurality vote
    of the predicted class. For continuous targets, the usual approach is to make
    the final estimation as the mean of the estimations for each model in the ensemble
    structure.


    Figure 5.6: Ensemble Models


    ![image](Images/f0071-01.jpg)


    The commonly observed advantage of ensemble models is that the combined model
    is usually better than the individual models that compose it. “Better” has two
    meanings—better in terms of generalization because the final model accounts for
    relationships discovered from distinct models. The combination of these models
    can better account for the variability of future data than an individual model.
    The ensemble model can also be better in terms of accuracy. The overall estimation
    can present less error than individual models, or the overall decision can present
    less misclassification error than individual models. It is important to notice
    that the ensemble model can be more accurate than the individual models if the
    individual models disagree with one another. Data scientists should always compare
    the model performance of the ensemble model with the individual models and evaluate
    when to deploy the ensemble model or one of the individual models from the ensemble
    structure.


    When we think about the benefits of ensembles of decision trees such as random
    forests and gradient boosting, we notice the same benefits of ensemble models.
    These models can have low bias and low variance and be more robust to overfitting.
    The ensemble model can generalize better to future data. And the ensemble model
    can be more accurate. However, like gradient boosting and forest models, ensemble
    models lack interpretable parameter estimates. Therefore, if understanding the
    relationships between the input variables and the target is a priority, ensemble
    models are not useful. The ensemble models might also be slow in scoring new observations
    since many models are in production.


    If the relationships between the input variables and the target are accurately
    captured by a single model, the ensemble approach offers no benefit. First, ensemble
    models are more computationally expensive since several models are being fitted
    and the results are averaged. Second, the ensemble model cannot be interpreted.
    This is particularly important if the single model is an interpretable model like
    a regression or a decision tree.


    # Use Case Study: Churn Model for Telecommunications


    An example of where ensemble models might be especially useful is in churn in
    telecommunications. Telecommunications companies usually have millions of customers,
    and customers might present several distinct types of behavior of usage, payment,
    and even making churn. Eventually, a single model would not be able to capture
    all of these different relationships between the input variable and the target
    for subgroups of customers. Of course, one option to mitigate this is to first
    create a customer segmentation (clustering) and then create one churn model for
    each cluster. However, even inside the same cluster, we can observe different
    customer behaviors. An ensemble model can work well in capturing all these different
    behaviors and correlating them to the target, in this case the churn event.


    Even though we have the ensemble model as the final model, we also have the individual
    models that contributed to the ensemble approach. As mentioned before, the ensemble
    model lacks interpretability. However, data scientists can use the ensemble model
    as the decision in a retention campaign (offer something to the customer or not)
    and can also use some of the individual models (the one with the highest predictive
    probability) to eventually explain the result or a characteristic associated to
    the churn event. Data scientists need to understand that business departments
    require more than just a probability. They also want to understand the reasons
    customers are making churn, the reasons customers are not going to pay their bills,
    and the reasons customers are going to purchase a product. All these reasons help
    business departments create the marketing campaigns, the offerings, the marketing
    messages, and the channels to contact the customers. A minimum of interpretability
    is needed to support a full business action. Therefore, the combination of the
    ensemble model to select the customers and the individual models to interpret
    the results can extract most of the benefits from analytical models.


    A churn model quite often uses all the information about the customer, considering
    the time frame perspective. How the customers are changing their behavior right
    before the churn, and how these characteristics are correlated to the target,
    or in this case the churn event. As shown in [Figure 5.7](#Chapter05.xhtml#ch05fig7),
    common input variables in churn models include:


    *   Demographic variables: customer characteristics such as age, gender, and education

    *   Usage variables: how much usage of products and services and indicators over
    time to characterize the trends of usage

    *   Product/service portfolio: what bundles and packages the customer has and
    for how long

    *   Revenue behavior: how much revenue the customer generates, for how long, and
    indicators over time to characterize trends about the average revenue per user

    *   Payment behavior: how many defaults the customer has had in the past and the
    length of the delay

    *   Contract information: how much time before the contract ends

