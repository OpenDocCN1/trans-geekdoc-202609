    ![image](Images/f0057-01.jpg)


    Neural networks predict cases using a mathematical equation involving the values
    of the input variables. The inputs in the input layer are weighted and linearly
    combined through hidden units or neurons in the hidden layer. The hidden units
    include a link function, called an activation function in neural networks, to
    scale the outputs. The result is compared to the observed values in the target
    layer, the residual is computed, and the weights are re-estimated.


    The output from a neural network with one hidden layer is a weighted linear combination
    of the mathematical functions generated by the hidden units. The weights and biases
    give these functions their flexibility. Changing the orientation and steepness
    of these functions, and then combining them, enables the neural network to fit
    any target.


    After the prediction formula is generated, obtaining a prediction is simply a
    matter of plugging the predictor variable values into the hidden unit expressions.
    In the same way as regression models, data scientists obtain the prediction estimates
    using the appropriate link function in the prediction equation.


    Neural networks are universal approximators that can model any relationship between
    the predictor variables and the target. Given the unlimited flexibility of neural
    networks, they are robust to outliers.


    Most predictor variable and target relationships can be modeled with one to two
    hidden layers. However, the number of hidden units required is a more subjective
    question to answer. If the neural network has too many hidden units, it will model
    random variation as well as the desired pattern. If the neural network has too
    few hidden units, it will fail to capture the underlying signal. Therefore, specifying
    the correct number of hidden units involves some trial and error. Data scientists
    can determine the appropriate number of hidden units by using the goodness-of-fit
    statistic on the validation data set. For example, they can fit several models
    with a different number of hidden units and choose the model with the lowest goodness-of-fit
    statistic on the validation data set.


    Finding reasonable values for the weights is done by least squares estimation
    for interval-valued targets and maximum likelihood for categorical targets. The
    search of the weights involves an optimization process, which applies an error
    function, or objective function, to update the previous weights at each iteration.
    When the target variable is binary, the main neural network regression equation
    receives the same logit link function featured in logistic regression.


    Complex optimization algorithms are a critical part of neural network modeling.
    The method of stopped training starts with a randomly generated set of initial
    weights. Training proceeds by updating the weights in a manner that improves the
    value of the selected fit statistic. Each iteration in the optimization process
    is treated as a separate model. The iteration with the best value (smaller for
    some statistics, larger for others) of the selected fit statistic on the validation
    data set is chosen as the final model. To avoid overfitting, a method called weight
    decay is applied during the search for the right set of weights. It is observed
    that every time the shape of the activation function gets too steep, the neural
    network overfits. What causes the shape of the activation function to get too
    steep is the weights growing too large. The weight decay method penalizes the
    weights when they grow too large by applying regularization. There are mainly
    two types of regularizations: Lasso or `L1` (penalizes the absolute value of the
    weight) and Ridge or `L2` (penalizes the square of the weight). Another important
    parameter is the learning rate, which controls how quickly training occurs by
    updating the set of weights in each iteration.


    Neural networks are one of the fastest scoring nonlinear models as they can efficiently
    score large volumes of data. For example, neural networks are used by banks to
    assess all their credit card transactions for potential fraud patterns. Neural
    networks also are commonly used to provide real-time evaluation and monitoring
    of stock and futures movements.


    Neural networks are most appropriate for pure prediction tasks since it is difficult
    to decipher how the predictor variables affect the target. This is bad for regulated
    markets such as credit scoring in banks since it will be difficult to explain
    how the predictor variables affected the predicted target value. One solution
    is to use decision trees to interpret the neural network’s predictions. Simply
    define the target as the values of the predictions from the neural network. Notice
    that the decision tree is not explaining the neural network model, but instead
    it is explaining the results provided by the neural network by predicting its
    outcomes. In terms of business actions, it can suffice to understand the pattern
    behind the prediction. In regulatory terms, this approach probably will not suffice.


    Another solution is to use model interpretability plots. One example of a model
    interpretability plot is the partial dependence plot that reveals how the target
    prediction changes as the values of the inputs are changed. These approaches do
    not make neural networks directly interpretable, but they allow data scientists
    to gain insight into them.


    Although neural networks are one of the fastest scoring nonlinear models, they
    take a lot of time when fitting, or training, the model. This is especially true
    as the number of hidden units and layers increase.


    Although neural networks have unlimited flexibility, they sometimes do not perform
    as well as simpler models such as linear regression. This situation occurs when
    the signal to noise ratio is low.


    When there is a strong pattern, called the signal, relative to the amount of variation,
    called the noise, the signal to noise ratio is high. In this situation, neural
    networks usually outperform simpler models such as linear regression. However,
    when there is a weak pattern relative to the noise, then the signal to noise ratio
    is low. The linear regression and neural network models might offer a comparable
    fit to the data as shown in [Figure 4.5](#Chapter04.xhtml#ch04fig5). Therefore,
    there would be no advantage to using the neural network model in this situation.


    ## Use Case: Bad Debt


    One of the major problems in telecommunications is bad debt, whether it is unintentional
    or intentional. There are many reasons for a customer to have unintentional bad
    debt, like unemployment, unexpected expenditures, and so on. There are also many
    ways companies can handle this bad debt: renegotiating the debt, partially collecting
    the debt, or partially suspending the services. For intentional bad debt, there
    is nothing to do, unless it can be prevented. In certain markets, like many in
    South America, there is also an aggravating circumstance. Companies providing
    utility services pay sales taxes to the government when they issue the bill. When
    those customers do not pay their bills, the utility companies do not get the revenue
    associated with the invoices, but even worse, they do not get back the taxes already
    paid to the government. It is a double loss.


    Figure 4.5: Signal-noise Ratio Effect in Neural Networks


    ![image](Images/f0060-01.jpg)

    '
