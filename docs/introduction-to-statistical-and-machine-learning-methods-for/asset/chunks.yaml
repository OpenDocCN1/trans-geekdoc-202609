    # 总结


    本章介绍了一些用于监督建模的机器学习算法，例如集成树（森林和梯度提升）和人工神经网络。文中描述了可能受益于使用机器学习监督模型的情况、使用机器学习监督模型的一些优点，以及一些缺点。


    # 第 5 章：监督模型的高级主题


    ## 概述


    在本章中，你将学习机器学习的高级主题。本章重点关注支持向量机和因子分解机等机器学习模型，以及集成模型和两阶段模型。


    本章的主要目标是：


    * 描述机器学习和人工智能与数据科学领域的关系。

    * 识别可能受益于使用支持向量机和因子分解机等机器学习监督模型的情况。

    * 描述依赖机器学习和人工智能的不同类型的监督模型，以及可能使用它们的情况。

    * 描述基于集成和两阶段模型开发监督模型的不同类型高级方法。

    * 理解何时使用集成模型和两阶段模型等高级机器学习模型方法来解决业务问题。

    * 解释依赖机器学习和人工智能的支持向量机和因子分解机等高级监督模型的结果。

    * 解释在解决现实问题中使用集成模型和两阶段模型等高级监督方法的结果。


    ## 高级机器学习模型和方法


    第 5 章 涵盖了两种高级机器学习模型和两种训练监督模型的高级方法。我们将讨论的机器学习模型包括：


    * 支持向量机：在 SAS 中实现的此模型目前可以处理二分类和连续目标。

    * 因子分解机：该模型是线性模型的扩展，它可以处理连续目标。


    我们将讨论的高级方法包括：


    * 集成模型：该模型结合多个模型来预测目标值。目标可以是连续的，也可以是离散的。

    * 两阶段模型：该模型允许对离散目标和连续目标进行建模。模型首先预测二分类响应，如果预测为 1，则模型预测连续响应。


    ### 支持向量机


    支持向量机是用于解决现实问题的最新的机器学习模型之一。`SVM` 创建于 90 年代，是一种用于分类类别或连续目标的稳健模型。与神经网络一样，这些模型倾向于成为黑箱，但它们非常灵活。支持向量机会自动发现输入变量与目标之间的任何关系。数据科学家在拟合模型之前，不需要指定函数形式或输入与目标之间的关系。


    '
- fmt: '

    Support vector machines were originally developed for pure classification tasks
    to solve pattern recognition problems. In other words, the model makes decision
    predictions instead of ranks or estimates. In that way, the `SVM` separates the
    outcomes of a binary target into two classes, for example, squares and circles.
    Support vector machines can now be used for regression tasks as well. In the simple
    example shown in [Figure 5.1](#Chapter05.xhtml#ch05fig1), the goal is to classify
    dark squares versus light circles. There are many classification rules or “regression
    lines” that can be used to separate the square and circle cases. In fact, if the
    data is linearly separable, as shown in the figure, there are a limitless number
    of solutions, or lines, to separate squares and circles or any cases in a binary
    target. Is there an optimal solution considering all possible lines that split
    the squares and circles? Given two input variables, the `SVM` is a line. Given
    three input variables, the support vector is a plane. With more than three input
    variables, the support vector is a hyperplane.


    For mathematical convenience, the binary target is defined by values `+1` and
    `-1`, rather than the usual `1` and `0` in logistic regression. Because the linear
    separator equals `0`, classification is determined by a point falling on the positive
    or negative side of the line. In other words, if the outcome is positive, then
    the case fits to one class. If the outcome is negative, then the case fits to
    the other class.


    This is a quite simple linear problem to start with. Finding the best solution
    to a linear classification problem is an optimization problem. The `SVM` gets
    more complicated when the problem is not linearly separable. In [Figure 5.1](#Chapter05.xhtml#ch05fig1),
    think of the vector `W` as the mechanism that affects the slope of `H` (the optimal
    line that correctly classifies the observations).


    The formula for `H` is shown below. The bias parameter `b` is the measure of offset
    of the separating line from the origin, or the plane in three dimensions or hyperplane
    in higher dimensions. The quantity `〈w, x〉` is the dot product between the vectors
    `w` and `x`. A dot product is a way to multiply vectors that result in a scalar,
    or a single number, as the answer. It is an element-by-element multiplication
    and then a sum across the products. The algorithm of support vector machines selects
    values for `w` and `b` that define the optimal line that correctly classifies
    the cases.


    ```

    H = {〈w, x〉 + b = 0}

    ```


    How are the values of `w` and `b` chosen? Support vector machines try to find
    the decision boundary that maximizes the margin. Margins are the perpendicular
    distances between the line `H` and the shapes closest to the line. The `SVM` is
    trying to find the hyperplane that maximizes the margin with the condition that
    both classes are correctly classified.


    The properties of the hyperplane that maximizes the margin are described by the
    support vectors, also called carrying vectors. These are the points closest to
    the hyperplane and they determine the location of the hyperplane. In other words,
    they determine the location of `H`. Because the hyperplane depends only on data
    points and not predictor variables, the curse of dimensionality is minimized.
    In [Figure 5.2](#Chapter05.xhtml#ch05fig2), only five data points are the support
    vectors that are used to determine the location of the hyperplane, which is based
    on the parameters of `w` and `b`.


    Figure 5.1: Linear Separation in Support Vector Machines Training


    ![image](Images/f0065-01.jpg)


    Figure 5.2: Carrying Vectors in Support Vector Machines


    ![image](Images/f0066-01.jpg)


    In most realistic scenarios, not only are the data not linearly separable, but
    a classifier defined by a hyperplane would make too many mistakes to be a viable
    solution. In that case, one solution would be to apply a polynomial transformation
    so that the input data would be projected into higher dimensions and then find
    the maximum margin hyperplane in this higher dimension. For example, the data
    might not be linearly separable in two dimensions, but it can be separable in
    three or more dimensions. This can be generalized to higher dimensions. It might
    be the case that is it not possible to find a hyperplane to linearly separate
    the classes considering a particular input data, but we could find a hyperplane
    in a higher dimension that splits the input data when it is set in a higher dimensionality.


    The dot product to transform the support vectors in a higher dimensionality, such
    as polynomials, can be extremely computationally intensive. To mitigate this drawback,
    the algorithm to calculate the support vectors uses a kernel function, such as
    a polynomial kernel of degree two or three, to compute the dot product of the
    two vectors that is much less computationally intensive. Using the polynomial
    kernel function instead of using the computationally intensive dot product is
    known as a kernel trick.


    One of the strengths of `SVM` is that data scientists do not need to specify the
    functional form or know the type of the relationship between the input variables
    and the target. Since there is no functional form, `SVM` are robust to outliers
    in the input space. They are also highly effective classifiers when the data points
    are separable in the input space. Furthermore, `SVM` are less affected by the
    curse of dimensionality because it is less affected by the number of predictor
    variables compared to other models. The hyperplane depends only on data points
    and not predictor variables.


    One of the weaknesses of `SVM` is that the model itself is a black box with no
    interpretable parameter estimates or rules and thresholds. Support vector machines
    work very similarly to neural networks and tree-based ensemble models like random
    forest and gradient boosting when the subject is interpreting the results. In
    regulated markets where the relationships between the predictor variables and
    the target are important to understand the outcomes, and mostly to explain the
    results, `SVM` would have limited usefulness. As was mentioned before in neural
    network models, a surrogate model, such as a regression or a decision tree, can
    be used to explain the outcomes from a `SVM`. However, by using a surrogate model
    the data scientists are not explaining the models but instead they are interpreting
    the results in terms of the business actions. Some regulators might not accept
    this approach.


    Figure 5.3: Increasing Dimensionality to Find a Hyperplane to Linearly Separate
    Classes


    ![image](Images/f0067-01.jpg)


    Use Case: Fraud in Prepaid Subscribers


    Support vector machines are useful in pure prediction tasks such as fraud detection.
    In these cases, a full interpretation of the model outcomes is not necessary,
    and the main interest is in the classification results or the model decisions.
    A scenario like this is when a telecommunications company creates a marketing
    promotion to boost new cell phone operations. The promotion gave subscribers prepaid
    telephone minutes to make calls at the same amount as the minutes received from
    any telephone.

