  trans: "\n\n模型性能可能会受到许多情况的影响，如数据质量问题、部署时间或简单的性能退化。数据质量问题通常与用于训练和当前用于评分的数据的变化或偏移有关。数据的变化可能会实质性影响模型性能。这些变化可能发生在数据源、输入变量或数据转换任务中。\n\
    \n## 部署时间\n\n部署时间在两种主要情况下会影响模型性能。第一种情况是，从模型开发到模型部署的整个过程中数据发生了显著变化，正如欺诈检测建模中所描述的那。第二种是行动时机。某些业务目标对时间非常敏感，必须在非常特定的时间范围内采取行动。如果未在该时间范围内采取行动，目标将失去意义，模型运行也可能是低效的。例如，在催收过程中，公司采取的每一步或每个行动都与一个时间范围相关。如果模型在这一时间范围之外部署，该目标对该模型将不再有效，那么模型将完全毫无用处。\n\
    \n## 退化\n\n任何模型都会发生退化。然而，及时捕捉退化发生的时间，对于公司从已部署的分析模型中获得最大收益至关重要。它允许公司快速为衰减模型评估替代方案，无论是重新训练还是更换。监控还允许公司提高当前模型的性能。想象一种情况：模型需要在特定的时间范围内部署以支持某项活动。数据科学家开发了模型，但他们认为通过使用项目开始时未考虑的新数据可以增强模型。数据科学家可以部署当前模型，同时随着新数据整合到数据源，继续进行新模型的增强工作。一旦这个新模型拟合，就可以将其移动到生产环境并与当前模型并行运行，以实时评估性能。如果新模型提供了更好的结果，只要\
    \ `ModelOps` 基础设施得到了有效集成，就可以轻松地替换当前模型。\n\nModelOps 的巨大优势在于，它让公司能够在分析旅程中蓬勃发展。这些模型的预测能力，结合大数据的可用性和不断增长的计算能力，继续是智能组织竞争优势的来源，无论行业大小如何。ModelOps\
    \ 允许这些精明的公司以有效的方式采用整个分析生命周期，改进流程的每一步，从模型开发到模型部署，再到性能监控和模型更换。ModelOps 允许公司扩展其分析工作，赋予他们真正的竞争优势，并从数据科学计划中提取最大的价值。\n\
    \n## 总结\n\n本章涵盖了分析生命周期的重要方面，重点关注模型训练、模型评估和部署。模型评估是分析生命周期中的关键一步，因为根据业务问题、可解释性需求、可说明性必要性以及训练或评分的速度等许多因素，评估最佳模型有许多视角。最后，一旦选择了最佳模型，我们就会进入了对公司最重要的阶段：模型部署。部署是公司在其运营过程中通过使用分析获得主要收益的时候。活动、决策、价格和组合包都基于模型结果的事实、数字和洞察，而不再基于猜测或感觉。企业正在拥抱分析并做出数据驱动的决策。\n\
    \n监控生产环境中的所有模型对支持所有业务行动也至关重要。模型会随时间推漂移，客户也会改变行为，从而改变描述这些行为的数据，进而影响模型。监控生产环境中的模型允许公司识别模型何时未达到预期并对其进行更新。这种更新可能是简单的重新训练，也可能是整个模型的重新开发。重要的是，低性能模型需要被替换。这个拼图的最后一块是模型运行化。模型可能以多种方式被使用：作为报告、简单的输出，或者在复杂的应用程序中（无论是嵌入到事务系统中，还是在特定的应用程序中）。模型运行化是分析生命周期中的积极组成部分，需要良好的考虑。\n\
    \n## 目录\n\n1. 关于本书\n2. 关于作者\n3. 致谢\n4. 前序\n5. 第一章：数据科学引论\n    - 1. 章节概述\n    -\
    \ 2. 数据科学\n        - 1. 数学与统计\n        - 2. 计算机科学\n        - 3. 领域知识\n       \
    \ - 4. 沟通与可视化\n        - 5. 硬技能与软技能\n    - 3. 数据应用\n    - 4. 数据科学生命周期与成熟度框架\n\
    \        - 1. 理解问题\n        - 2. 收集数据\n        - 3. 探索数据\n        - 4. 数据处理\n\
    \        - 5. 提供答案\n    - 5. 数据科学中的高级分析\n    - 6. 数据科学实例\n        - 1. 客户体验\n\
    \        - 2. 收入优化\n        - 3. 网络分析\n        - 4. 数据变现\n    - 7. 总结\n    - 8.\
    \ 延伸阅读\n6. 第二章：数据探索与准备\n    - 1. 章节概述\n    - 2. 数据探索引论\n        - 1. 非线性\n   \
    \     - 2. 高基数\n        - 3. 非结构化数据\n        - 4. 稀疏数据\n        - 5. 异常值\n   \
    \     - 6. 缩放错误的输入变量\n    - 3. 数据准备引论\n        - 1. 代表性采样\n        - 2. 基于事件的采样\n\
    \        - 3. 分区\n        - 4. 填充\n        - 5. 替换\n        - 6. 转换\n        -\
    \ 7. 特征提取\n        - 8. 特征选择\n    - 4. 模型选择\n        - 1. 模型泛化\n        - 2. 偏差-方差权衡\n\
    \    - 5. 总结\n\n"
