    \ process. Campaigns, decisions, prices, and bundles are based on facts, numbers,\
    \ and insight from model results, no longer from guessing or feelings. The business\
    \ is embracing analytics and is making data-driven decisions.\n\nMonitoring all\
    \ models in production is also crucial to support all business actions properly.\
    \ Models drift over time, and customers change their behaviors, which modifies\
    \ the data that describes these behaviors, which affects the models deployed.\
    \ Monitoring the models running in production allows the company to identify when\
    \ the model is not performing as expected and then update it. This update might\
    \ be a simple retraining or an entire model development. It does not matter. The\
    \ important thing is that a low-performance model needs to be replaced.\n\nOne\
    \ last piece of this puzzle is model operationalization. The model might be used\
    \ in diverse ways: as a report, a simple output, or in a complex application,\
    \ either embedded into transactional systems or within a specific app built for\
    \ it. Model operationalization is an active part of the analytical model life\
    \ cycle and needs to be considered as well.\n\n## Contents\n\n1.  [About This\
    \ Book](#AboutThisBook.xhtml#fm01)\n\n2.  [About These Authors](#AbouttheAuthor.xhtml#fm02)\n\
