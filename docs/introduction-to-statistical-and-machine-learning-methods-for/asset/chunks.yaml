    例如，如果一组客户表现出对产品和服务的使用率高、收入高且没有付款延迟，那么让这些客户满意是符合公司利益的。可以针对这些客户开展忠诚度促销活动，以确保他们继续消费公司的产品和服务。其他一些客户可能表现出不同的行为，使用率和产生的收入平均，但完全没有付款延迟。这些客户可能代表了客户群大部分。尽管他们不是高收入产生者，但由于他们不延迟并持续使用产品和服务，他们可以被认为是公司现金流的巨大贡献者。应该对他们进行有效监控并尽可能保留。


    图 6.8：用于客户分的 K-means 聚类


    ![image](img/f0089-01.jpg)


    然而，如果另一组客户出现频繁付款延迟，最终平均账单很高，那么密切监控这些客户符合公司利益，因为他们存在违约风险并会影响公司运营。每个聚类（或客户组）都拥有一组特征，将它们归为同一组。这些信息可以有效利用，在更具体的活动中更好地对客户群进行定位。


    ## 自组织映射


    自组织映射（`SOM`）算法是一种结合了聚类技术的主要目标和投影算法以降低维度的方法。它不仅可以用于将观测值分配到聚类中，还可以用于将多维数据投影到二维特征图上，其中输入变量之间的几何关系表示观测值之间的相似性。


    自组织映射也是大型复杂数据集的非常有用的数据挖掘和可视化工具。由于它们将多维输入空间（多个输入变量）表示为二维矩阵（代表聚类的晶格矩阵），因此可以用于将观测值绘制在二维图表中。这使得更容易评估数据集中所有观测值的输入变量的分布。


    `SOM` 是一种使用无监督学习训练的人工神经网络。它们不同于我们在第 4 章中描述的、基于目标训练的神经网络模型。`SOM` 算法是一种基于竞争学习（competitive
    learning）进行训练的神经网络。这一思想最初由 C. von der Malsburg 于 1973 年引入，随后由 T. Kohonen 在 1982
    年进行开发和完善。将其想象为一个具有按行列排列的单计算层神经元的神经网络。每个神经元都包含一个带有输入变量值和网格中几何位置的权重向量。此外，每个神经元与输入层全连接。该模型创建了一个映射（或低维矩阵），包含输入空间的离散化表示。传统的监督神经网络是基于误差函数训练的。在聚类这一视角下，无监督神经网络是基于邻域函数训练的，以保留输入变量的属性。这就是分配给自组织映射的竞争学习。


    低维矩阵需要提前设置，类似于 `k-means 聚类` 中的 `k`。这为竞争学习创建了映射。例如，定义一个二维矩阵来表示输入数据集中的所有观测值和所有输入变量。将此过程考虑为降维，因为你可能将数千行（观测值）和数百列（输入）映射到一个较小的矩阵，可能只有三行三列（九个单元格或九组或九类）。映射用随机权重初始化，这些权重代表输入空间。也就是说，映射中的每个单元格都有初始权重来表示观测输入。


    比较神经元的响应。然后从矩阵中选出获胜的神经元。


    图 6.9：Kohonen 自组织映射


    ![image](img/f0091-01.jpg)


    自组织算法的下一步是从训练数据集中随机选择一个输入向量。检查每个神经元以确定哪些权重与输入向量最相似。用于确定最相似神经元的算法是欧几里得距离计算。获胜节点被称为最佳匹配单元（`BMU`）。离
    `BMU` 最近的神经元被称为邻居。每次为模型训练获取观测值时，都会与映射中的所有单元格进行比较。在图 6.9 的示例中，我们有九个单元格要比较。输入向量与所有单元格中的权重进行比较。然后观测值分配给映射中最近的单元格。递归过程确保模型在训练过程中获取了每个观测值，以比较输入向量与单元格的权重。


    图 6.10：基于观测值相似性的权重调整


    ![image](img/f0091-02.jpg)


    图 6.11：基于权重调整的映射重构


    ![image](img/f0092-01.jpg)


    选定的神经元与其邻域一起被激活。


    `SOM` 网格中 `BMU` 及其接近神经元的权重向输入向量调整。这种权重更新的效果是让 `BMU` 和邻居更靠近输入向量。


    总结，一旦观测值被分配给特定的单元格，所有邻居单元格都会进行调整以考虑邻居的权重。这使得相似的观测落在相同的聚类中，并使得相似的聚类相互靠近。这个过程持续进行直到训练样本中的所有观测值都被用于模型训练，映射中的所有单元格都根据观测分配进行了权重调整。


    自适应过程改变所有权重以更接近输入信号。


    对训练数据集中的所有观测值重复此过程，扭曲神经元的初始排列。结果是符合输入数据的神经元排列。需要注意的是，网格的几何形状没有改变，只是网格发生了变形。这种对权重的交互比较和调整代表了竞争学习并创建了自组织映射，根据输入观测创建了聚类的良好表示。


    自组织映射算法具有以下步骤：


    1. 随机初始化所有权重。

    2. 选择输入向量 `x = [x1, x2, x3, …, xi]`，其中 `xi` 是输入变量。

    3. 将 `x` 与每个神经元 `j` 的 `wj` 进行比较，以确定获胜神经元。

    4. 更新获胜神经元使其变得更像 `x`，同时更新获胜者的邻居。

    5. 调整参数：学习率和邻域函数。

    6. 从步骤 2 重复，直到映射收敛，这意味着权重没有发生明显变化，或者已经通过了预定义的训练周期。


    自组织映射的优势之一是该算法尝试映射权重以符合输入数据，其主要目标是以更简单、更易理解的形式表示多维数据。这使得更容易可视化和理解输入数据的分布。


    另一个益处是，自组织映射可以作为降低输入数据维度的技术。最终的聚类网格更容易观察数据中的相似性。

