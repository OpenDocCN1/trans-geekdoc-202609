    ## Gradient Boosting


    Decision trees are particularly good models, easy to implement, fast to train,
    and easy to interpret, but they are unstable. In some cases, a change in the class
    label of one case could result in a completely different structure for the tree,
    even though it has nearly the same accuracy. This can be problematic when deploying
    decision trees to support business actions. Even though the overall accuracy can
    remain similar when the final structure of the decision tree changes, the set
    of rules based on thresholds will be different because they are based on the tree
    structure. This might impact the business campaign because it is based on that
    set of rules.


    The decision tree’s instability results from the considerable number of univariate
    splits and fragmentation of the data. At each split, there are typically many
    splits on the same predictor variable or different predictor variables that give
    similar performance. For example, suppose `age` is split at `45` since it is the
    most significant split with the predictor variable and the target. However, other
    splits at `38` or `47` might be almost as significant. A slight change in the
    data can easily result in an effect that can cascade and create a different tree.
    A change in the input data can result in a split at `38` years old. Even more
    problematic, the change in the input data can result in another input variable
    being more significant to the target such as `income`. Then, instead of splitting
    the input data based on `age`, the decision tree starts splitting the input space
    based on `income`. The final tree structure will be quite different, and therefore,
    the set of rules and thresholds will also be different.


    Several methods have been used to take advantage of this decision tree instability
    to create models that are more powerful, especially in terms of generalizing the
    final predictive model. One of the most popular methods is to create an ensemble
    of decision trees.


    An ensemble model is the combination of multiple models. The combinations can
    be formed in these ways:


    * voting on the classifications

    * using weighted voting, where some models have more weight

    * averaging (weighted or unweighted) the predicted values


    There are two types of ensemble of trees: `random forests` and `gradient boosting`
    models.


    ## Random Forest


    In a random forest model, the training data for each decision tree is sampled
    with replacement from all observations. There are no assumptions for the relationships
    between the inputs and the target. The random forest model is based on multiple
    independent decision tree models.


