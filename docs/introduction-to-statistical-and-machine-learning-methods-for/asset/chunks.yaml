    Imputation


    The standard approach for handling missing values in most modeling approaches
    is complete-case analysis, where only those observations without any missing values
    are used in the training process. That means any observation with a missing value
    in any of the input variables used to train the model is eliminated from the training
    process. The problem is even a small number of missing values can cause an enormous
    loss of data in high dimensions. Imagine an input data set with 300 variables.
    If one customer has a single missing value in any of these 300 variables, he or
    she is discarded from the training data set. Reducing the training data because
    of missing values is one problem. The other problem is to score a model when some
    values are missing in the future data. Imagine a predictive model in production
    scoring customers that are likely to make churn or not. One of the input variables
    is age. In the future data, if the customer being scored has no age value, the
    model cannot score this customer. For example, in logistic regression, the model
    cannot multiply the coefficient by a missing value. When data scientists score
    new customers, customers with missing values will have a missing predictive score
    such as a probability of having the event. In other words, data scientists cannot
    generate predictions for customers with missing values in the predictor variables.
    Therefore, some type of missing value imputation is necessary.


    Imputation is a common process to avoid missing values in observations used during
    training, validation, test, and deployment processes. Imputation means filling
    in the missing values with a reasonable value. Many methods were developed for
    imputing missing values such as mean, median, mode, and midrange imputation. These
    values are based on the distribution of the predictor variable.


    Figure 2.4: Missing Values and Imputation


    ![image](Images/f0026-01.jpg)


    For example, recall the previous example of the customer with the age missing
    in the training data set. The mean of the age considering all customers in the
    training data set is used for that customer. Data scientists can also create missing
    indicator variables that are binary variables that indicate whether the predictor
    variable value is missing or known for that observation. These variables can be
    used to capture the relationship between the response variable and the missingness
    of the predictor. For example, maybe customers with missing incomes have a strong
    relationship with fraudulent transactions. If a very large percentage of values
    is missing, then the predictor variable might be better handled by omitting it
    from the analysis and using the missing indicator variable only.


    Figure 2.5: Imputation and Missing Values Indicator


    ![image](Images/f0026-02.jpg)


    There are other methods to handle missing values like binning the variable into
    groups and having one group represent all the missing values. The predictor variable
    would then be treated as a categorical variable in the analysis. Another very
    efficient method, probably the most accurate approach to handle missing values,
    is to estimate the missing value based on the other inputs. The data scientist
    would use another predictive model to estimate the missing values before estimating
    the target. For example, imagine two customers have the salary missing in the
    data set. Imputation by mean would add the same salary for both customers. However,
    let’s assume the first customer is 50 years old, director of a company, and owns
    a home valued at about one million dollars. The second customer is 20 years old,
    still attending college, and is not a homeowner. These two customers should have
    very different salaries. However, the imputation by mean would impute the exact
    same value for both. An imputation model, like a decision tree, would potentially
    impute very different values for each one of them, as the estimation of the missing
    salary would be based on the rest of the input variables.


    Replacement


    In some situations, the data has erroneous values that need to be replaced. For
    example, suppose the customers in a financial institution data set must be at
    least 18 years of age. If the data shows customers younger than 18, one remedy
    is to replace those values with 18. Another remedy is to treat these values as
    missing and impute the values based on the other predictor variables values in
    the data, as described in the imputation section. If the percentage of errors
    in a variable is too high, the data scientists can decide to discard this variable
    from the analysis.


    Transformation


    Transformation of the input variables is a common data preparation task. These
    transformations can be a reasonable method to improve the fit of the model. Data
    scientists can take a mathematical transformation to create a more symmetric distribution
    that should reduce the effect of outliers or heavy tails in the original variables’
    distribution. Data scientists can also standardize variables to be in the same
    scale and range. For example, age and salary can be in the same range such as
    a scale from 0 to 1, making sure they both equally contribute to the fit of the
    model. Variable transformations can also help the model capture nonlinear relationships
    between the inputs and target.


    Figure 2.6: Mean Imputation Technique


    ![image](Images/f0027-01.jpg)


    Figure 2.7: Replacement Approach


    ![image](Images/f0028-01.jpg)


    Another transformation is to bin the input variable values and treat it as a categorical
    variable. This can also reduce the effect of outliers and account for the nonlinear
    relationship between the target and the input variable. Imagine a data set where
    most of the customers have a very similar salary, let’s say, a low salary, some
