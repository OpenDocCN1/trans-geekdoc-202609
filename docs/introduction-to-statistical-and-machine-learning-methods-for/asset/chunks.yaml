    ## 模型部署\n###  模型\n### \n### 模型运行\n## 总结\n\n# 关于本书\n\n## 本书涵盖了什么？\n本书介绍了数据科学项目中使用的统计和机器学习方法，重点关注其解决业务问题的适用性。书中未介绍软件，数学细节保持在最低。书中描述了与分析生命周期所有阶段相关的任务，包括数据准备与数据探索、特征工程与选择、考虑监督和无监督技术的分析建模，以及模型评估与部署。它描述了相关技术并提供了真实的案例研究来说明这些技术。\n\
    \n## 这本书适合你吗？\n本书的读者是数据科学家、数据分析师、数据工程师、业务分析师、市场分析师或计算机科学家。然而，任何想要学习更多数据科学知识的人都能从本书中受益。\n\
