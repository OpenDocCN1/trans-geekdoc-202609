    在此阶段也可以检测出离群值，数据科学家必须决定这些数据点是错误的，还是描述了异常情况。有时，发现离群值可能代表了某个业务问题的解决方案。离群值可以描述事务系统中的问题，促使公司改进数据质量工作；它也可能代表一种异常——一个非常特殊且出乎意料的正确值。这种离群值可以凸显潜在的欺诈事件、机械故障或财务操作中的违约。某些技术可以减少离群值在预测模型中的影响，也有其他技术可以从训练和验证过程中消除离群值。


    ### 比例不的输入变量


    最后，数据科学家应该检查预测变量的度量。在某些建模情况下，将变量重新缩放到相同的尺度上可能会是有益的。对于某些模型，不同的尺度可能不会成为大问题，例如回归模型或基于树的模型。但对于神经网络等复杂模型，不同的尺度可能会导致模型在考虑和解释不同输入时产生偏差。薪资可能比年龄更重要，仅仅是因为它的尺度更大。因此，让所有输入变量处于相同的尺度上（`-1`
    到 `1` 或 `0` 到 `1`）对神经网络非常有益。


    数据探索的一个重要目标是理解基于分析报告解决业务问题时所使用的所有可能的数据源和预测变量。可以使用无监督模型（如聚类或分割）、监督模型（如回归和神经网络），甚至是基于半监督的模型（如文本分析、优化和网络分析）。至关重要的是，探索数据和分析变量的过程可能不仅在此过程中解决了业务问题，还能就某几个主题提出宝贵的业务见解。


    # 数据准备简介


    在数据准备阶段，数据科学家需要访问公司内部所有可用的数据源来解决业务问题。某些数据源存在于外部或由第三方公司提供，这些公司可以增加并丰富公司关于业务问题的信息。数据源可以是客户信息、账单信息和交易信息。一个常见问题是，数据通常每个客户包含多行，例如在数据仓库或数据市中。因此，必须合并所有数据以获得单一的客户版本。


    与数据准备相关的任务包括：


    *   代表性采样

    *   基于事件的采样

    *   数据分区

    *   缺失值填充

    *   替换错误的变量值

    *   变量转换

    *   特征选择


    ## 代表性采样


    如果数据源包含许多客户，数据科学家可能想对客户进行采样。在计算机极速的时代，这似乎意义微乎其微。然而，模型拟合过程仅在漫长、枯燥且易错的数据准备过程完成后才会。采样是为了数据效率，因为数据准备通常倾向于使用较小的样本量。将数据分成多个样本使数据科学家能够评估模型对未来数据的预测泛化能力，正如我们将在数据分区中看到的那样。


    图 2.1: 采样数据


    ![image](img/f0023-01.jpg)


    ### 基于事件的采样


    在许多业务情况下，我们试图建模的目标是稀缺的。例如，电信运营商的流失率可能在 `2%` 到 `5%` 之间。预测稀有事件的一种常见策略是基于包含所有事件的样本建立模型，然后合并一个包含所有非事件的样本。某些业务目标值可能与感兴趣的事件或业务目标没有关系。例如，稀有事件可能是流失事件，即客户决定离开公司或产品或服务。非事件是客户没有流失，且客户仍在公司内，消费并使用某些产品和服务。新样本可能具有
    `50%` 的事件率，而不是原始的 `2%` 到 `5%` 事件率。


    基于事件采样的优势是，数据科学家平均可以用较少的总案例数获得预测能力相近的模型。这种采样策略之所以有效，是因为具有分类结果的数据集中的信息量并不取决于数据集中的观测总数，而是取决于最稀有结果类别中的观测数量（通常是事件的数量）。这种采样方法允许模型同时捕获输入与感兴趣事件之间的关系，以及输入与非事件之间的关系。如果你在训练数据集中只有非事件，或者至少绝大多数是非事件，模型倾向于轻易地只捕获输入与非事件之间的关系。即使模型预测没有流失，该模型在
    `99%` 的情况下也是正确的。对于该模型来说，这 `99%` 的分类率是一个非常好的分类率，但公司将错过所有事件。


    图 2.2: 基于事件的采样


    ![image](img/f0024-01.jpg)


    ## 分区


    分析模型倾向于非常快地学习并高效地捕捉输入变量与目标之间的关系。问题是它们可能会学得太多。模型可以几乎完美地捕捉输入与目标之间的相关性，但仅限于其训练的时间段。随着数据随时间变化，模型应该尽可能地泛化，以适应不同时间段数据的变异性。当模型在训练期间具有高预测准确性但对未来数据不是时，被称为模型过拟合数据。


    修正过拟合的最简单策略是隔离部分数据用于评估或验证。模型拟合到数据的一部分（称为`训练数据集`），并在数据的另一部分（称为`验证数据集`）上评估性能。当使用验证数据来比较、选择和修改模型时，且所选模型在与用于比较的相同数据上进行评估时，过拟合原理仍然适用。在这种情况下，应该使用`测试数据集`进行最终评估。


    在存在时间组件的情况下，`测试数据集`可以从不同的时间收集。这会进一步泛化模型，因为模型无论如何都将在不同的时间段部署到生产环境中。这意味着模型是根据目标已知的事件训练的。一旦选择了最佳模型，它将被部署到生产环境中预测目标未知的未来事件。模型需要对新数据进行良好的泛化，以考虑数据随时间变化的变异性。通过随时间变化的数据进行测试，有助于数据科学家选择最准确的模型，还能选择泛化能力最好的模型。例如，在从`1
    月`到`6 月`收集的数据上拟合的模型可能无法很好地泛化到从`7 月`到`12 月`收集的数据上。

