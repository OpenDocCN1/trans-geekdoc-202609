    and broadband implies mobile line. The support as expected is the same, 2/5 for
    both. However, the confidence is different: 2/4 for the first rule and 2/3 for
    the second one. The difference is how many times broadband and mobile lines occur
    individually considering all the transactions.


    4.  Streaming content and mobile line imply data package, with a support of 1/5
    and a confidence of 1/3. Here it is important to notice that the size of the rules
    can vary. We might find rules with multiple items on the left side of the rule
    (antecedent) and multiple items on the right side of the rule (consequent).


