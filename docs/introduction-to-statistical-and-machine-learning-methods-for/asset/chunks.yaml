    Therefore, it is important to have all input variables in the same scale. For
    example, considering all salaries in a data set, we might observe a range from
    `$10K` to `$1,000K`。 Looking at the age, we might observe a range from 21 to 79.
    Not only is the variation in salary greater than age, but also the scale of salary
    is much greater than age. A good approach is to standardize all input variables
    before using them in clustering so that the salary varies from 0 to 1 and the
    age varies from 0 to 1 as well. By doing this, we are giving the same chance for
    each variable to discriminate the observations into distinct groups.


    Figure 6.1: Clustering Method to Group by Similar Observations


    ![image](Images/f0081-01.jpg)


    It is also recommended to use only the relevant information about the customers
    that is pertinent to the business. For many companies, it is common to maintain
    a lot of information about the customers and much of it is external and not very
    related to the business itself.


    Categorical variables can be used if they are dummy coded. However, if these variables
    have many levels, the dummy code generates a substantial number of new variables
    that are not useful for the clustering technique. As stated before, clustering
    is typically done on few numeric inputs. Too many variables reduce the overall
    variability of the data and make it hard for the clustering algorithm to capture
    the similarity among the observations. Finally, it is good to have independent
    variables assigned to the clustering process. Different input variables containing
    the same level of information about the observations increases the dimensionality
    of the input space and reduces the overall variability.


    In summary, some important requirements for clustering are:


    * Scale or normalize all attributes.

    * Consider relevant attributes on the business goal.

    * Do not have too many levels in the categorical attributes.

    * Have an interval level of measurement for the attributes (dummy code the categorical
    attributes).

    * Do not have too many attributes.

    * Use only independent attributes.


    In this chapter, we will learn about the following clustering methods:


    * Hierarchical clustering creates clusters that are hierarchically nested within
    clusters at earlier iterations. Agglomerative clustering starts with one cluster
    per point, and repeatedly merges nearby clusters.

    * Centroid-based clustering divides a data set into clusters by trying to minimize
    some specified error function. `K-means` clustering starts with `k` clusters and
    assigns the data points to the nearest center. The algorithm shifts centroids
    and points over time until no more moves are taken.

    * Self-organizing maps assign observations to clusters based on the similarities
    of their attributes. Self-organizing maps (`SOMs`) are neural networks that provide
    a topological mapping from the input space to the clusters. Every observation
    assigned affects the cluster.


    # Hierarchical Clustering


    Hierarchical clustering is a recursive sequence of partitions in the data set
    of observations. If the data is hierarchically structured, the clustering can
    be used to generate topic hierarchies. For example, web directories provide a
    hierarchical classification of documents. Data scientists can restrict the search
    for documents to only a subset of web pages related to the topic.


    The hierarchical clustering algorithms creates a hierarchical structure of clusters,
    where each level defines a partition of the data set. Hierarchical clustering
    comes in two forms: agglomerative, which combines the cases iteratively, and divisive,
    which divides the cases iteratively.


    Figure 6.2: Hierarchical Clustering


    ![image](Images/f0083-01.jpg)


    ## Agglomerative


    1. Assign each observation to its own cluster.

    2. Merge the two clusters that are most similar.

    3. Repeat step 2 until there is only a single cluster.


    ## Divisive


    1. Assign all the observations to a single cluster.

    2. Partition the observations that are least similar into two clusters.

    3. Repeat step 2 until there is only a single observation in each cluster.


    Figure 6.3: Agglomerative Algorithm


    ![image](Images/f0083-02.jpg)


    Figure 6.4: Divisive Algorithm


    ![image](Images/f0084-01.jpg)


    The hierarchical cluster structure is represented by a graph called the dendrogram.
    A dendrogram is a structured graph showing the sequence of divisions in the original
    data set performed by the hierarchical clustering algorithm. (See [Figure 6.5](#Chapter06.xhtml#ch06fig5).)
    The forks represent all the fusions or joining of groups along the clustering
    process and help data scientists to determine whether there is a natural clustering
    set throughout that iterative sequence that better groups observations together.
    In a vertical dendrogram, the fusion level is represented as the height of the
    fork from the horizontal axis. Short fusion levels indicate fusions of similar
    clusters. Long fusion levels indicate fusions among heterogeneous clusters, or
    groups of observations that should not be joined.


    Choosing the right number of clusters is not an easy task and depends on the business
    requirements. There are a few techniques to evaluate and estimate a suitable number
    for the clusters, including the gap statistic method and domain knowledge. Most
    techniques investigate statistical analysis to evaluate the level of variability
    within and without the clusters. The gap statistic method works by evaluating
    the intra-cluster variation for different values of clusters with their expected
    values under the assumption of uniformly distributed data. The second and the
    best approach in most cases is domain knowledge. Subject matter experts can work
    along data scientists to understand the business requirements, the purpose of
    the clustering, the practical actions to be taken based on the clustering results
    and together estimate the right number of groups to support a specific demand.
    Imagine a company trying to run different campaigns based on different customer
    behaviors. Even if the gap statistic method tells us that the best number of clusters
    is 17, it is difficult for the marketing and sales departments to create 17 different
    campaigns, 17 different promotions, 17 different scripts in the call center, and
    so on. A business decision can be to establish that four or five clusters suffice
    for this business purpose.


    Figure 6.5: Dendogram


    ![image](Images/f0085-01.jpg)


    There are three main advantages to using hierarchical clustering.


    * Hierarchical clustering is easy to implement and visually interpretable.

    * The dendrogram produced is very useful in understanding the sequence of the
    hierarchical clustering algorithm and helping the data scientists in selecting
    the right number of clusters.

    * Data scientists do not need to specify the number of clusters required for the
    algorithm. They can interactively investigate the best number of clusters looking
    at the dendrogram, evaluating the variability explained at each level, and comparing
    it to the business requirements.


    The weaknesses of hierarchical clustering are:


    * Hierarchical methods do not scale well to large data sets. Most hierarchical
    methods increase in processing time as a function of the square, or even the cube,
    of the number of observations. As the number of variables added to the algorithm
    increases, the time to run the clustering method also increases. If the data scientist
    tries to keep the input set small, eventually there is not rich enough information
    to cluster observations into meaningful groups.


    * Previous merges or divisions are irrevocable. For example, if two observations
    are clustered in step 1, the algorithm cannot undo that connection even if it
    turned out to be a poor one at the end. Other methods can recursively search for
    a better distribution, even in further steps.


    * Data scientists cannot score new observations using hierarchical clustering.
    The algorithm is mainly used for descriptive purposes.

