    companies need to pay taxes when they issue a customer bill, sometimes around
    33%. If customers do not pay their bills, the company cannot recoup the taxes.
    This is the risk of the business. However, some of the bad debt is fraud. What
    if the company identifies the fraud before issuing the bill? The damage by the
    fraud is already done. But the company can at least avoid the taxes. The predictive
    model evaluates all bills before issuing them. Every bill has an associated likelihood
    identifying the risk of that bill associated with fraud or not. Considering the
    top 5% of the bills with higher predictive probability, the overall accuracy is
    92%. That means, the model can lead to a wrong decision in 8% of the cases. Considering
    an average bill of USD 41 and a population of possible intentional bad dept (on
