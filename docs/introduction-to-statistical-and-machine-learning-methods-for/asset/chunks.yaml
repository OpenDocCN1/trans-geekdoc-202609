    Finally, again for both link analysis and path analysis, when rare events are
    the target, these techniques might not be the best ones. Very often these techniques
    highlight cases and transactions based on frequency and recency, and rare events
    might be missed in the analysis.


    ### Use Case Study: Online Experience


    Path analysis can be used to investigate and understand customer behavior on a
    retail website. Data scientists can examine the customers surfing on the website,
    the sequence of the visits, the time spent on the web pages, the links clicked,
    and so on. Data scientists can then evaluate when customers are searching for
    specific products and services, when they are checking for product availability,
    and when they are comparing plans, offerings, and prices. The goal of the analysis
    is to detect bottlenecks, drop-offs, and effective conversions when customers
    reach the check-out and purchase the products. If the data scientists see a significant
    decrease from the product information pages to the check-out purchase page, it
    could be indicative of some problems with the product information page, the price,
    availability, quality, or even the possible methods of payment available. Data
    scientists then can analyze these results with the business department and figure
    out solutions to address the drop in customers navigating from the product information
    page to the check-out.


    ### Text Analytics


    Text is a type of unstructured data that can be extremely useful in data science
    applications. Data scientists use text analytics to analyze text data, extract
    relevant information, and turn raw data into business insights or even into new
    variables to be used in supervised or unsupervised models. Text analytics can
    be used to create a set of predictor variables that contain information about
    what is written in the text. It can also be used to cluster the topics that are
    mentioned in the documents.


    One of the main advantages of text analytics is the ability to make sense of unstructured
    information. With the growth of unstructured data, particularly digital data,
    the importance of text analytics continuously increases. By applying text analytics
    on a set of documents, data scientists search and evaluate terms contained in
    these documents and create new features that can be used in other analytical models,
    like clustering or classification. Text analytics is a key field in data science
    with many techniques and tools, all designed to extract information from raw text
    data.


    #### Figure 7.6: Word Cloud


    ![image](Images/f0113-01.jpg)


    Unstructured and semi-structured text content within organizations is growing
    at an unprecedented rate from applications, records, and business processes to
    external documents, web pages, blogs, forums, and so on. Unstructured text refers
    to plain text documents. Semi-structured text refers to text that has been augmented
    with tags, such as the text in web pages formatted as `HTML` files. These files
    have special tags to format the content in a singular way. If documents are preprocessed
    with tagging to include specific information, this might facilitate efficient
    information retrieval. `XML` (extensible Markup Language) and `JSON` (JavaScript
    Object Notation) represent two common languages that accommodate the encoding
    of attributes within a document. Many organizations store and manage this information
    based on data type by manually source tagging the content.


    The amount of unstructured text data is massive, particularly in the digital world.
    To process all this information, a sequence of tasks with specific goals should
    be put in place. Each step handles a specific technique to prepare the data to
    be analyzed, to select the parts of the text that will be analyzed, and to analyze
    the text. For example, text parsing processes the textual data into a term-by-document
    frequency matrix. This step is very computationally intensive. The text filter
    removes all parts of speech that do not contribute to the identification of anything
    semantic in the document. For example, all articles as `a`, `an`, and `the` can
    be removed from documents prior to analysis with a filter. Text topics and text
    clusters aim to cluster the documents into groups based on similarity. The major
    difference between topics and clusters is the relationship between the documents
    and the groups. One document can belong to multiple topics, for example, sports
    and journalism. One topic comprises multiple documents. However, one document
    can belong to one single cluster (either sports or journalism). One cluster comprises
    multiple documents also. The coefficients created during the topic and cluster
    identification can be used to classify new documents. These new documents are
    classified based on the similarity to the documents already fit into topics and
    clusters.


    Text analytics is a vigorous field of research with many applications. Text analytics
    outcomes can be added to traditional analytical modeling to better solve a business
    problem. Text analytics outcomes often include relevant textual data to help data
    scientists find solutions for business problems, whether shedding light to a problem
    or producing new variables to better explain the problem.


    ### Natural Language Processing (NLP)


    `NLP` is a concept intrinsically correlated to text analytics. `NLP` can be used
    as a solution in some applications like Siri or Alexa or as a technique within
    text analytics software. In text analytics software, most of the tasks used to
    produce a text analytics solution rely on `NLP`. The primary role of `NLP` is
    to efficiently parse the document collection. Parsing creates the term table that
    is used when deriving topics or clusters. It is also used in sentiment analysis
    to understand positive, negative, and neutral levels of interactions. `NLP` is
    used to identify multiple categories in the document collection. Each row of the
    term table includes the term itself, the role of the term (the part of the speech
    or concept associated to the term), statistics related to the term (the frequency
    of occurrence of this term in the document collection), and stemming information
    (for example, `run=running=runs=ran`).


    One of the biggest challenges with `NLP` is word sense disambiguation. Textbooks
    often use the word “train” to illustrate `NLP` challenges. “train” and its variants
    can be a noun, verb, or adjective. When “train” is used in the context of a locomotive,
    it is a noun (the Amtrak train from San Diego arrived on time). When “train” is
    used relative to education, it can be a noun (data science training), it can be
    a verb (train the student), or it can be an adjective (a training exercise). When
    an `NLP` algorithm encounters the word “train,” it must resolve any ambiguities
    based on the proper part of speech. The relevance of the word “train” in the text
    analysis can be evaluated on `NLP` tools like the term maps. The term table tells
    you that train appears in the document collection as a noun. The term map shows
    related terms, which helps you decide how train is used.

    '
