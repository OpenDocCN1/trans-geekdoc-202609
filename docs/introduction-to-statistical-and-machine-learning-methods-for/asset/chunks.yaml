- fmt: "\nModel performance can be affected by many circumstances like data quality\
    \ issues, time to deployment, or simply degradation. Data quality issues are mostly\
    \ associated with changes or shifts in the data that were used to train and currently\
    \ used to score. Changes in the data might affect substantially the model’s performance.\
    \ These changes might occur in the data sources, in the input variables, or in\
    \ the data transformation tasks, among others.\n\n## Time to Deployment\n\nTime\
    \ to deployment can affect the model’s performance in two main situations. The\
    \ first one is when the data changes significantly throughout the process from\
    \ model development to model deployment, as described in the fraud detection modeling.\
    \ The second one is the time to action. Some business targets are very time sensitive,\
    \ and the action needs to be taken in a very specific time frame. If the action\
    \ is not taken in that time frame, the target loses its meaning and the model\
    \ might run ineffectively. For example, in the collections process, every step\
    \ or action the company takes is associated to a time frame. If the model is deployed\
    \ out of this time frame, the target is no longer valid for that model, and then\
    \ the model is completely useless.\n\n## Degradation\n\nDegradation is going to\
    \ happen to any model. However, promptly capturing when this degradation happens\
    \ can make the entire difference for the company in getting the most out of the\
    \ analytical models deployed. It allows the company to quickly evaluate alternatives\
    \ for the decayed model, either retraining or replacement. Monitoring also allows\
    \ companies to improve a current model’s performance. Imagine a situation where\
    \ a model needs to be deployed in a specific time frame to support a campaign.\
    \ The data scientist developed the model, but they believe that the model can\
    \ be enhanced by using new data not considered at the beginning of the project.\
    \ The data scientist can deploy the current model as they keep working on the\
    \ enhancement of the new model as new data is incorporated to the data source.\
    \ Once this new model is fit, it can be moved to production and run in parallel\
    \ to the current model to evaluate performance in real time. If the new model\
    \ provides better results, it can replace the current model easily if the `ModelOps`\
    \ infrastructure is effectively integrated.\n\nThe great benefit of ModelOps is\
    \ that it allows companies to thrive in their analytical journeys. The predictive\
    \ power of these models, in combination with the availability of big data and\
    \ increasing computational power, continues to be a source of competitive advantage\
    \ for smart organizations, no matter the industry, no matter the size. ModelOps\
    \ allows these smart companies to embrace the entire analytical life cycle in\
    \ an effective manner, improving each step of the process, from model development\
    \ to model deployment, passing through performance monitoring and model replacement.\
    \ ModelOps allows companies to scale their analytical efforts, giving them a real\
    \ competitive advantage and extracting the most value from data science initiatives.\n\
    \n## Summary\n\nThis chapter covered important aspects of the analytical life\
    \ cycle, focusing on model training, model assessment, and deployment. Model evaluation\
    \ is a crucial step in the analytical life cycle because there are many perspectives\
    \ on how to evaluate the best model depending on the business problem, the need\
    \ for interpretability, the necessity for explicability, and the speed of training\
    \ or scoring, among many others. Finally, once the best model is selected, then\
    \ we come to the most important stage for the company: model deployment. Deployment\
    \ is when the company gains the major benefits of using analytics in its operational\
    \ process. Campaigns, decisions, prices, and bundles are based on facts, numbers,\
    \ and insight from model results, no longer from guessing or feelings. The business\
    \ is embracing analytics and is making data-driven decisions.\n\nMonitoring all\
    \ models in production is also crucial to support all business actions. Models\
    \ drift over time, and customers change their behaviors, which modifies the data\
    \ that describes these behaviors, which affects the models. Monitoring the models\
    \ in production allows the company to identify when the model is not performing\
    \ as expected and then update it. This update might be a simple retraining or\
    \ an entire model development. The important thing is that a low-performance model\
    \ needs to be replaced. One last piece of this puzzle is model operationalization.\
    \ The model might be used in diverse ways: as a report, a simple output, or in\
    \ a complex application, either embedded into transactional systems or within\
    \ a specific app for it. Model operationalization is an active part of the analytical\
    \ life cycle and needs to be considered well.\n\n## Contents\n\n1. [About This\
    \ Book](#AboutBook.xhtml#fm01)\n2. [About Authors](#AboutAuthor.xhtml#fm02)\n\
