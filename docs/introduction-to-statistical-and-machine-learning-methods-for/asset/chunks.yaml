    have fewer connections, but they are strong ones and most likely to especially
    important people. The taxi driver would have a degree centrality higher than the
    account executive, and the account executive would have an influence centrality
    higher than the taxi driver. First-order influence centrality can be used to understand
    the impact of a business event that requires strong relationships between the
    members, such as churn or product adoption.


    Second-order influence centrality represents the indirect influence of the node.
    It measures how many friends a node’s friends have. It is the friends of the friends.
    It helps to illustrate how many nodes can be indirectly influenced by that node.
    Second-order influence centrality considers the weights of the nodes and the weights
    of the links adjacent to a node, as well as the weight of the links to the adjacent
    nodes connected to that node. In other words, the importance of my friends and
    the strength of my connections to my friends and the strength of the connections
    from my friends to their friends. For example, in a cell phone network, a subscriber
    might not have important friends and connections, but their friends might have
    important friends with good connections. Their first-order influence centrality
    might be low, but certainly the second-order influence centrality will be high.
    The second-order influence centrality captures this dynamic. In terms of business
    applications, a node with a high value of second-order influence might indicate
    that the individual is a suitable candidate to spread an important message for
    the company.


    Betweenness


    Betweenness centrality accounts for how many times a node takes the shortest path
    within the network. The shortest path is the shortest way to get to one point
    in the network from another. “Shortest” might have different connotations such
    as distance, importance, cost, and so on. In optimization, we usually try to minimize
    the cost, the time, or the distance. In this way, the shortest path from node
    A to node E would be the one costing less, or taking less time, or traveling the
    shortest distance.


    Suppose that to reach to E from node A, a message needs to pass through other
    nodes. Let’s assume the possible paths are A→B→E and A→C→D→E. This concept is
    especially important in optimization. For the first path, suppose that the distance
    between A and B is 10 units, and the cost to take this path is 25 units. The distance
    between B and E is 5, and the cost is 10. The total distance is 15, and the total
    cost is 35. For the second path, the distance between A and C is 5 units, and
    the cost is 5 units. The distance between C and D is 5 units, and the cost is
    5 units. Finally, the distance between D and E is 10 units, and the cost is 10
    units. The shortest path between A and E in terms of distance is going through
    B (15 units of distance against 20 through C and D). However, the shortest path
    between A and E in terms of cost is going through C and D (20 units against 35
    through B). B partakes a shortest path if the constraint is the distance. C and
    D partake a shortest path if the constraint is the cost.'
