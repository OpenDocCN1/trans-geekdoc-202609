    用于评估监督模型的拟合统计量实际上取决于模型的类型。如果监督模型是分类模型且目标是类别变量，则结果是一个决策。那么，用于评估不同模型结果的拟合统计量可以是`accuracy`（准确率）、`misclassification`（误分类）、`profit`（利润）或`loss`（损失）。在新数据上误分类最低的模型为冠军模型。如果监督模型是排名模型，输出值的重要性小于这些值的顺序，则结果是一个排名。那么，用于评估不同模型结果的拟合统计量可以是`ROC
    index`（ROC 指数）或`Gini coefficient`（Gini 系数）。冠军模型是在新数据上泛化排名最好或 ROC 指数最高的模型。最后，如果监督模型是估计模型，目标是连续变量，则结果是一个估计值。那么，用于评估不同模型结果的拟合统计量可以是`average
    square error`（均方误差）、`root mean square error`（均方根误差）、`Schwartz`、`Bayesian` 或 `Akaike
    information criterion`（赤池信息量准则），或任何基于似然函数的统计量。在新数据上误差函数最低的模型为冠军模型。


    图 9.2：预测类型与拟合统计量


    ![image](img/f0138-01.jpg)


    ## 数据拆分


    在特定时间范围内针对特定数据集训练的模型，其目的是为了识别输入变量与目标变量之间的相关性。该模型将应用于新数据或未来数据，以支持公司发起的业务行动。例如，一家公司正面临流失率上升的问题。数据科学团队可以收集过去关于流失事件的数据，并训练监督模型来理解并识别与流失相关的因素。哪类客户更容易流失？在分析流失时，哪些客户的特征更相关？


    一旦训练了一组模型，数据科学家就需要评估这些模型以选择最佳的一个——即他们部署到生产环境中以支持留存活动模型。然而，该留存活动将在未来的时间段运行。用于训练模型的变量是相同的，但它们的值不同。时间已经过去，这些值可能已经发生了。模型评分的数据与训练数据不同。为了评估模型是否可能在这些数据上失败，数据科学家将根据与训练模型不同的数据集来评估模型。这是为了“模拟”真实世界的场景，即冠军模型对不同于训练数据的数据进行评分。在训练期间用于评估最佳模型的这种不同数据可以是两个不同的数据集，称为`validation
    data`（验证集）和`test data`（测试集）。最佳模型是在验证集和测试集上表现最好的模型，而不是训练集。数据科学家可以使用模型在验证集、测试集上的结果，或者是在验证和测试数据集上的平均结果来选择冠军模型。当此冠军模型部署到生产环境中支持活动时，数据科学家可以预期模型将表现良好，因为他们使用了不同的数据集来训练和选择冠军模型，选择了泛化能力最好的模型。在某些情况下，测试数据可以是跨时间样本，以考虑未来的事件时间段，从而模拟模型对新或未来的观测值进行评分时会发生什么。


    图 9.3：模型泛化：训练、验证与测试


    ![image](img/f0139-01.jpg)


    ## K 折交叉验证


    将数据拆分为训练集、验证集和测试集（测试集并非真正强制，取决于业务需求和法规）是在将监督模型投入生产环境之前进行训练和泛化的非常有效的方法。数据拆分是一种简单但昂贵的技术。当数据集太小时，由于训练集和验证集之间的高变异性，性能衡量标准可能是不可靠的。缓解这种小数据集问题的良好方法是交叉验证。


    图 9.4：交叉验证


    ![image](img/f0140-01.jpg)


    K 折交叉验证将原始数据集打乱分为训练部分和验证部分。可以为这种打乱定义多次运行，或者确定多个折将原始数据集拆分为训练部分和验证部分。例如，在四折交叉验证中，数据被分成四个等份。第一次训练基于原始数据集的三四分之一数据（折
    `A`、`B` 和 `C`），验证基于最后四分之一（折 `D`）。下一次运行使用折 `A`、`B` 和 `D` 进行训练，并基于 `C` 进行验证。该过程持续持续，直到所有折都已用于训练和验证步骤。然后对这四次评估取平均值。通过这种方式，所有数据都被用于训练和验证。


    交叉验证中最佳模型有两种选择。第一种是每一步考虑一个单一模型。例如，在第一步中根据折 `A`、`B` 和 `C` 训练模型，并根据折 `D` 进行验证。然后将该模型应用于所有其他步骤（即其他三次打乱）。在所有折或所有步骤中表现最好的模型就是冠军。一些数据科学家使用整个数据集来拟合冠军模型，但使用交叉验证的结果作为评估统计量。


    第二方法是集成模型。对于每一步，都像前面描述的第一种方法一样训练模型，例如，在 `A`、`B` 和 `C` 上训练并在 `D` 上验证。在第二步中训练另一个模型，在
    `A`、`B` 和 `D` 上训练并在 `C` 上验证，以此此类推。在这种情况下，训练了四个模型：每个交叉验证的运行对应一个模型。由于结果经过了平均处理，因此这些模型是集成模型。最终模型是交叉验证期间训练的所有四个模型的集成模型。


    ## 拟合优统计量


    评估模型性能的方法取决于目标变量的尺度。如果目标变量是类别变量，那么一些常用方法包括分类表、ROC 曲线、增益图（gains）和提升图（lift charts）。可以使用几种拟合优统计量来评估模型的性能。最常见的拟合优统计量是误分类错误率和信息准则，如
    `AIC`（赤池信息量准则）和 `SBC`（施瓦茨贝叶斯信息准则）。


    如果目标变量是连续的，按分位数绘制观测平均值与预测平均值的图将很有用。拟合优统计量通常基于某些误差函数，如 `average squared error`（均方误差）、`root
    mean square error`（均方根误差）、`log error`（对数误差）和 `adjusted R-square`（调整 R 系数）。


    图 9.5：混淆矩阵


    ![image](img/f0141-01.jpg)


    ## 混淆矩阵


    当目标是二分类变量时，监督分类模型最常用的评估工具之一是`confusion matrix`（混淆矩阵）。混淆矩阵是实际观测类别与预测类的交叉表。它量化了监督模型正确分类或误分类事件的情况。对于混淆矩阵，感兴趣的事件通常称为正样本，无论该事件是有利的（如欺诈、流失或违约）还是有利的（如购买、获取、交叉销售或升级销售）。非事件被称为负样本。


