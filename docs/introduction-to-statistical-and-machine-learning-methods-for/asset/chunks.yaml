    If the case is predicted to be positive (1) and it is observed to be positive
    (1), then this case is a true-positive (TP). If the case is predicted to be positive
    (1) and it is observed to be negative (0), then this case is a false-positive
    (FP). If the case is predicted to be negative (0) and it is observed to be positive
    (1), then this case is a false-negative (FN). Finally, if the case is predicted
    to be negative (0) and it is observed to be negative (0), then this case is a
    true-negative (TN).


    All the cases are allocated to classes based on cutoff values of the predicted
    probability. The steps include the following:


    1. Estimate the predicted probability of class `1` for each case.

    2. Choose a cutoff probability (often the event proportion in the sample).

    3. Assign the cases to class `1` if their estimated predicted probability exceeds
    the cutoff. Otherwise, assign the cases to class `0`.


    Based on the decision (according to the predicted probability cutoff), the simplest
    performance statistic from the classification table is accuracy. Accuracy can
    be calculated as the following equation:


    $ACC = \\frac{TP + TN}{TP + FP + FN + TN}$


    The error rate, also called the misclassification rate, is the complement of the
    accuracy rate:


    $ERR = 1 - ACC = \\frac{FP + FN}{TP + FP + FN + TN}$


    Different cutoffs can produce different allocations for the decision class and
    then different classification table values. A change in the cutoff value produces
    different performance statistics like accuracy or misclassification. Depending
    on the event distribution, increasing the cutoff might increase or decrease the
    accuracy and decrease or increase the error. A general recommendation for a cutoff
    is the proportion of events in the training data set. This information is extremely
    sensitive particularly when classifying rare events. For example, assume that
    a data scientist is training a model to detect fraud. In most cases, fraud is
    a rare event. Let us say that for this specific case, fraud represents `1%` of
    all the transactions. If the final model says that there is no fraud ever (that
    is, predicts all cases as nonfraud), the model is correct in `99%` of the cases,
    and its overall accuracy would be `99%`. A model performance with `1%` of misclassification
    can be considered as a wonderful performance. However, the company would miss
    all the fraud cases.


    Because of that, there are two specialized measures to evaluate the performance
    of a supervised classification model. The first one is sensitivity, also known
    as recall or the true-positive rate, which can be calculated based on the following
    equation:


    $Sensitivity = Recall = TPR = \\frac{TP}{P} + \\frac{TP}{TP + FN}$


    The second specialized measure is specificity, also known as selectivity or the
    true-negative rate. Specificity is the proportion of nonevents that were predicted
    to have a nonevent response. It can be calculated as the complement of the sensitivity,
    based on the following equation:


    $Specificity = Selectivity = TNR = \\frac{TN}{N} = \\frac{TN}{TN + FP}$


    The context of the problem determines which of these measures should be the primary
    concern of a data scientist. For example, in a retention campaign, the data scientist
    should be concerned about the false-negative rate (`FNR` or `FN/FN+TP`). The false-negative
    cases (`FN`) would give the number of customers not contacted during a retention
    campaign that would be lost. The false-positive cases (`FP`) would not be the
    worst case. The company would be contacting customers who are not willing to make
    churn, and they would eventually receive an incentive to stay. That would work
    as a marketing or relationship campaign. However, losing customers because they
    were not identified as churners during a retention campaign would be bad.


    On the other hand, in a fraud detection application, data scientists should be
    more concerned with the false-positive rate (`FPR`). The false-positive cases
    (`FP`) would give us the number of good customers who were identified as possible
    fraudsters. Of course, the false-negative cases (`FN`) would also be bad. They
    would represent the number of possible fraudsters not identified by the model.
    These fraudsters would not be identified as committing fraud events against the
    company. However, the false-positive cases might represent good customers being
    blocked or having their services cancelled by mistake. The negative impact of
    the false-positive cases might be higher than the fraud itself in terms of the
    company’s image, or good customers suing the company, or influential customers
    spreading a bad message about the company’s services.


    ## ROC Curve


    Another common method to evaluate a model’s performance for classification models
    is the Receiver Operating Characteristic (ROC) curve. The ROC curve is a graphical
    display that gives a measure of the predictive accuracy of a supervised classification
    model with a binary response. The ROC curve displays the sensitivity or the true-positive
    rate against 1-specificity or the false-positive rate. The ROC curve displays
    this relationship based on a range of different cutoffs.


    The extremes `(0,0)` and `(1,1)` represent cutoffs of `1.0` and `0.0`, respectively.
    If a data scientist uses the rule that all observations with a predicted probability
    of `1` are classified as events, none of the event observations are correctly
    classified, but all the nonevent observations are correctly classified (sensitivity=0,
    specificity=1). If a data scientist uses a rule that all observations with a predicted
    probability of `0` or higher are classified as events, all the events are correctly
    classified, but none of the nonevents are correctly classified (sensitivity=1,
    specificity=0). The horizontal axis is the false-positive rate, or `1–specificity`,
    so the ROC curve starts at point `(0,0)`, and the vertical axis is the true-positive
    rate, or the sensitivity, so the ROC curve ends at point `(1,1)`.


    For a supervised classification model with high predictive accuracy, the ROC curve
    rises quickly (sensitivity increases rapidly, specificity stays at 1). In such
    cases, the area under the curve is large. In contrast, the ROC curve rises slowly
    and has a smaller area under the curve for supervised classification models with
    low predictive accuracy. The area under the curve is not affected by the cutoffs
    the way that misclassification and accuracy are.


    An ROC curve that rises at `45°` is a poor model. It represents a random allocation
    of cases to the classes and is the ROC curve for the baseline model.


    Figure 9.6: ROC Curve


    ![image](Images/f0143-01.jpg)


    ## Cumulative Percentile Hits Chart


    The depth of a classification rule is the total proportion of cases that were
    allocated to class `1`. The cumulative percentile hits chart displays the positive
    predicted value and depth considering the overall population. (See [Figure 9.7](#Chapter09.xhtml#ch09fig7).)
    For example, assuming a `5%` response rate for a sales campaign, at `5%` of the
    population, we can expect to observe a `5%` response rate. At `10%` of the population,
    we can expect to observe the same `5%` response rate and so on.

