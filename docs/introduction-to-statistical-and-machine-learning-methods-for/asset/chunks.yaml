    Expected Confidence and Lift Measures


    Support and confidence are good measures to evaluate the strength and relevance
    of the association rules discovered. Support informs how frequently the items
    in the rules occur together out of all transactions in the database, and confidence
    informs how frequently some items in the rules occur together once a subset of
    them occurs.


    Because confidence is asymmetric, which means that item A implying item B is different
    from item B implying item A, it is important to know whether a specific item is
    really causing the occurrence of another item. Some items might be extremely popular
    in the database, and it is difficult to evaluate if this item would occur in the
    transactions because of itself or because of the occurrence of the other items.


    To address this issue, other measures to evaluate association rules can be used.
    Expected confidence and lift are two of them. The expected confidence of the rule
    A => B is estimated by the following equation:


    $\\frac{transactions\\ containing\\ B}{all\\ transactions}$


    The expected confidence is the confidence that would be expected if the rule A
    => B is false. For example, if A and B are unrelated, we can expect that the confidence
    of item A implies item B would be based on the relative proportion of the item
    B from all the transactions. If the expected confidence of item B (occurrence
    of item B from all transactions) is greater than the confidence of item A implies
    item B (occurrence of items A and B out of all transactions with item A), then
    we can assume that item A does not imply item B. Item B would occur many times
    no matter the number of times item A occurs.


    The second measure to evaluate the strength and importance of the association
    rules is the lift. Lift is associated with both confidence and expected confidence
    measures. The lift of the rule A => B is the confidence of the rule divided by
    the expected confidence. The lift of rule A => B is calculated by the following
    equation:


    $\\frac{confidence\\ of\\ A = > B}{expected\\ confidence\\ of\\ A = > B}$


    The lift can be interpreted as a general measure of association between the two
    item sets in the association rule. In practical terms, the lift can assume values
    greater than 1, less than 1, or equal to 1. Values greater than 1 indicate positive
    correlation, which means the item A really implies the item B. Values equal to
    1 indicate zero correlation, which means items A and B would occur independently.
    Values less than 1 indicate negative correlation, which means item A does not
    imply item B, or item B would occur regardless the occurrence of item A. Notice
    that lift is symmetric. That is, the lift of the rule A => B is the same as the
    lift of the rule B => A.


    Association Rules Analysis Evaluation


    Association rules analysis is especially useful in marketing and managing product
    portfolios in addition to market basket analysis applications. However, the interpretation
    of the implication in association rules analysis can be a bit risky. High confidence
    and support do not exactly imply cause and effect. Customers do not purchase butter
    just because they purchased bread. They purchase both butter and bread together.
    Furthermore, the rule might not be necessarily interesting. For example, customers
    acquiring debit cards are also acquiring credit cards. In this scenario, it is
    a prerequisite for the financial institution that customers need to have the debit
    card first to have the credit card. That would be a strong rule with high value
    support and confidence, but it would be useless since it is a business rule, not
    an insightful association rule. Furthermore, the two items occurring together
    out of all the transactions might not even be correlated. Data scientists need
    to always work together with the business departments to interpret the results
    of unsupervised models like association rules analysis.


    Consider another example of the association rule Mobile => Broadband in [Figure
    7.2](#Chapter07.xhtml#ch07fig2). This rule has 50% support (5,000 mobile and broadband
    purchases together / 10,000 transactions). This rule has 83% confidence (5,000
    mobile and broadband purchases together / 6,000 mobiles). Based on these two measures,
    this might be considered a strong and relevant rule. Half of the transactions
    have this set of items, and the confidence of purchasing a broadband after purchasing
    a mobile line is about 83% of the time. If the two products are independent, then
    knowing that a customer has purchased a mobile line does not help in knowing whether
    that customer has purchased broadband or not.'
