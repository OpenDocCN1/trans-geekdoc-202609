    一个特别用的子图是触达网络（reach）或自我网络（ego subnetwork）。触达网络是指考虑了与节点子之间双向连接的所有节点。例如，从一个较小的节点集合开始——假设是影响影响力的节点，我们可以称之为
    `leaders`（领导者）——触达网络算法会在单次定向连接中搜索所有与 `leaders` 连接的节点，并创建该自我网络。触达网络的主要业务解释是：寻找所有通过初始线索可以触达的客户的方法。从
    1,000 个 `leaders` 开始，他们可以触达多少客户并为公司传播信息？


    ## 通分量 (Connected Components)


    连通分量对于寻找相互连接的节点组也极其有用，即使到达组内的其他成员可能需要多步连接。在连通分量中，所有节点都可以通过单步定向步骤、连接或通过其他节点经过多个步骤相互触达。


    ## 双连通分量 (Biconnected Components)


    双连通分量的概念非常简单。它是一个连通分量，如果移除一个节点，它就会被分成两个或多个连通分量。例如，想象一组人，无论到达其他人需要多少步，他们都是相互连接的。换句话说，就是我的朋友的重要性以及我的朋友与其朋友之间连接的强度。这个节点被称为
    `articulation point`（割点）或 `bridge`（桥）。它在网络中的作用尤为重要。


    ## 网络指标 (Network Metrics)


    第二组任务被用于计算网络指标。网络指标用于描述网络拓扑及其特征。它被用于理解网络中每个节点的作用及其重要性。也用于理解链接以及信息如何在整个网络中流。。有很多网络指标需要计算。


    中心性（Centrality）衡量量化了网络中节点和链接的重要性。每个中心性度量都有不同的解释。其中某些可能与特定行业和目标应用更相关。这些指标用于对网络中的单个节点和链接进行排序。


    ### 度 (Degree)


    `Degree centrality`（度中心性）计算节点拥有的连接数量。它不考虑连接的强度或其他节点的重要性。在定向网络中，这种中心性度量还考虑连接的方向，将入连接数记为
    `degree-in`（入度），将出连接数记为 `degree-out`（出度）。`degree` 是 `degree-in` 和 `degree-out`
    的总和。


    ### 影响 (Influence)


    `First-order influence centrality`（一阶影响中心性）描述了有多少其他节点直接连接到特定节点。这通常被理解为节点有多少朋友或连接，并表明该节点对网络内其他节点施加影响的。然而，如果网络中的节点是有权重的，一阶影响中心性会考虑每个节点的权重以及与节点相邻的每个链接的权重。这不仅取决于你有多少连接，还取决于连接的强度以及你所关联的人的重要性。有时，连接的总数没有连接的重要性相关。例如，在通信网络中，一个出租车司机可能有很多连接，但所有连接都非常微弱。一个
    `account executive`（客户经理）可能连接较少，但这些是强力连接，且很可能是特别重要的人。出租司机的 `degree centrality`
    会高于 `account executive`，而 `account executive` 的 `influence centrality` 会高于出租车司机。`First-order
    influence centrality` 可用于理解成员之间需要强关系的业务事件的影响，例如客户流失或产品采用。


    `Second-order influence centrality`（二阶影响中心性）代表节点的间接影响。它衡量一个节点的朋友有多少朋友——即朋友的朋友。它有助于说明有多少节点可以受到该节点的间接影响。二阶影响中心性考虑了节点权重、节点相邻链接的权重，以及指向相邻节点链接的权重。例如，在手机网络中，订阅者可能没有重要的朋友和连接，但他们的朋友可能有重要的朋友和良好的连接。他们的
    `first-order influence centrality` 可能较低，但 `second-order influence centrality`
    将会很高。二阶影响中心性捕捉了这种动态。在业务应用方面，二阶影响值高的节点可能表明该个人是传播公司信息的候选人。


    ### 中介性 (Betweenness)


    `Betweenness centrality`（中介中心性）计算节点出现在网络中最短路径的次数。最短路径是从网络中一点到另点的最短方式。“最短”可能有不同的含义，如距离、重要性、成本等。在优化中，我们通常试图最小化成本、时间或距离。这样，从节点
    A 到节点 E 的最短路径就是成本最低、耗时最短或距离最短短的路径。


    假设从节点 A 到节点 E 需要通过其他节点。假设可能的路径为 `A→B→E` 和 `A→C→D→E`。这个概念在优化中尤为重要。对于第一条路径，假设 `A`
    和 `B` 之间的距离为 10 单位，采取该路径的成本为 25 单位。`B` 和 `E` 之间的距离为 5，成本为 10。总距离为 15，总成本为 35。对于第二条路径，`A`
    和 `C` 之间的距离为 5 单位，成本为 5 单位。`C` 和 `D` 之间的距离为 5 单位，成本为 5 单位。最后，`D` 和 `E` 之间的距离为
    10 单位，成本为 10 单位。

