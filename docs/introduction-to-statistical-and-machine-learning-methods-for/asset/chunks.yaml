    with a very flexible addition. This addition enables a trained neural network
    to model any association between the input variables and the target. Flexibility
    comes at a price because of the lack of interpretability and the lack of a built-in
    method for selecting useful inputs.


    The neural network model is arranged in layers. The first layer is called in the
    input layer, consisting of the input variables. The second layer is called the
    hidden layer, consisting of the hidden units or neurons. It is possible to have
    multiple hidden layers with multiple hidden units in each hidden layer. The final
    layer is the target layer, consisting of the response or target.


    Figure 4.4: Neural Network Diagram'
