    数据科学工作的回报来自于数据被组织、清洗和安排以供分析的时刻。第一批可视化、特征工程、建模——这些正是让数据科学成为一项如此有成就感的工作。与几乎任何其他职业相比，数据科学家可以提出一个接一个的问题，而答案又会引出后续的问题。从一天到另一天，你的工作可能完全不同。你不能告诉数据该说什么——如果你有倾听的工具和好奇心，数据自然会向你倾诉。


    本书（及其配套课程）提供了一个进行项目工作的框架，即分析生命周期。分析生命周期承认并涵盖了数据科学团队的所有成员——IT 部门、计算机工程师、统计学家和执行利益相关者，并明确了工作和责任在数据科学项目的整个生命周期是如何划分的。本书的重点在于理解——理解数据、理解模型以及已部署模型的结果。你可以说，这本书的理想读者是“公民数据科学家”（使用高纳的术语）或统计业务分析师。这本书并不是教你如何编写脚本来提取每小时的数据、如何如何在云托管提供商上启动虚拟机，或如何对你的应用程序进行容器化。单凭这本书并不能让你成为世界级的数据科学家。然而，它做的是将数据科学零散的线条进行组织，使得你的项目是可管理的，你的结果是可解释的。朋友们，这正是任何高效数据和分析专业人士的核心。


    Catherine Truxillo，博士

    高级分析教育总监

    SAS

