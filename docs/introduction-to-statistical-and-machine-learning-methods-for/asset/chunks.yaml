    # 第 8 章：无监督模型的高级主题


    ## 章节概述


    在本章中，你将学习网络分析和网络优化。无监督建模始于第 6 章，当时我们涵盖了不同的聚类技术。我们看到了聚类对于根据相似性度量（例如消费行为）将客户细分为不同组别的重要性。


    在第 7 章中，我们涵盖了几种技术，使用关联规则和序列关联规则在交易中寻找模式，以识别一起购买的物品或按特定顺序购买的物品。此外，在第 7 章中，我们涵盖了一种极其流行的数据科学技术——文本分析。我们看到了文本分析如何将非结构化数据转化为洞察，以解决业务问题或为机器学习模型提供新特征。我们还展示了在文本数据日益增加的数字世界中，文本分析是多么重要。


    现在在第 8 章中，我们将通过一些理解实体之间关系的非常关键的技术，完成关于无监督模型的主题。这里的关系指的是实体、交易、通话、电子邮件、短信、推荐和支付（在许多其他类型中）之间任何类型的关系。实体可以是任何动作的主体，如人、手机、保单持有人、银行账户、计算机等。分配给网络分析和网络优化的算法帮助我们发现这些关系的模式。


    本章的主要目标如下：


    * 理解与网络分析相关的概念，以及在何时应用网络分析来解决业务问题。

    * 理解与网络优化相关的概念，以及何时应用网络优化来解决业务问题。

    * 使用所描述的网络分析或网络优化技术之一描述一种统计无监督模型。

    * 从业务目标的角度解释网络分析或网络优化模型的结果。


    ## 网络分析


    网络分析是对节点之间关系和流的映射和测量。网络中的节点可以是人、群体、公司或企业、文档、交易、计算机等。链路可以是节点之间任何类型的关系或流。网络分析使我们能够识别并理解网络中某些节点的重要性，或者网络中某些链路的重要性，并还可以识别整个网络中的子网络或聚类。


    公司使用网络分析来处理相关的业务事件，如流失、欺诈和选址，此外还涉及与增加销售、产品采用和服务消费相关的策略。


    政府使用网络分析来打击恐怖主义、洗钱以及税收或医疗保健领域的欺诈，等许多其他应用。


    '
- fmt: '

    A common example of network analysis is social network analysis, which is the
    process of investigating social structures. Examples of social structures commonly
    visualized through social network analysis are social media networks, information
    circulation, friendship networks, and disease transmission. In this type of network,
    a person can be a node and the link can be a connection between them (a like,
    a tag, a message, etc.).


    Network analysis allows organizations to better understand the relationship between
    any type of entities. For example, [Figure 8.1](#Chapter08.xhtml#ch08fig1) shows
    how employees communicate internally by email. Based on the frequency and recency
    of their emails to each other, employees can be grouped into distinct communities,
    represented here by distinct color shades.


    Networks can be directed or undirected. In a directed network, each link has a
    direction that defines how the information flows over that link to connect the
    nodes. In an undirected network, each link has no direction, and the flow can
    be in either direction. For example, communication messages are a directed network
    where customer A calls customer B. The direction of the link describes the connection
    and therefore the type of the relationship. The authorship network is an undirected
    network. You write a paper with two or three other colleagues and then you are
    all co-authors. There is no direction on this type of relation. As you write more
    papers with someone, your relationship gets stronger as you might share more connections.


    Networks can also be weighted or unweighted. Common link weights in the transportation
    industry are driving distance (or driving time) from one node to another node.
    In communications, the type and frequency of the connection can constitute the
    weight. For example, subscriber A calls subscriber B 20 times and sends 30 text
    messages and 5 multimedia messages. The sum of these connections can define the
    link weight between subscribers A and B. If calls, text messages, and multimedia
    messages have different importance values for the company, the weighted sum (based
    on importance) of these connections can define the link weight. Nodes can also
    have weights to describe their importance within the network. For example, consider
    paper references in a co-authorship network, an author might be especially important
    by the number of papers written and/or by the number of references. If as an author,
    your paper is referred by a low weighted author (few papers and no references),
    your importance does not grow that much. However, if your paper is referred by
    an authority in the field with high weight (lots of papers and papers references),
    your importance increases substantially.


    Figure 8.1: A Social Network


    ![image](Images/f0119-01.jpg)


    In [Figure 8.2](#Chapter08.xhtml#ch08fig2), nodes can represent employees (circles),
    and links can represent connections (arrows). The connections can be done through
    emails. The relationship between employees can be weighted, according to the number
    of times they communicate to each other. The size of the arrows represents the
    frequency of emails.


    Figure 8.2: Types of Networks


    ![image](Images/f0120-01.jpg)


    Traditional methods of data analysis usually consider individual attributes from
    all the observations. However, network analysis considers both the individual
    attributes and the relationships among the individuals. In fact, the relationships
    among the individuals within the network are usually more important than the individual
    attributes. Understanding the relationships in the network can enable companies
    to predict new business events and focus on customer relationship management.


    Data scientists can extract mathematical properties from networks like the average
    distances between the nodes or the strength of the relationships or the subgroups
    within the whole network. All this information can help data scientists characterize
    complex networks and extract useful knowledge from it to solve business problems.


    Although the use of graphs to describe the characteristics and structure of the
    network and their components such as nodes and links is straightforward and intuitive,
    larger networks with many nodes and links become more difficult to visualize.
    The network algorithms become even more important in this type of scenario, but
    the outcomes and the visual analysis can be more difficult to interpret. For example,
    a graph illustrating the network in a telecommunications company can have millions
    of nodes and hundreds of millions of links. Visually interpreting this network
    would be a challenging task. However, the network algorithms can easily find communities
    within that network and based on network measures identify the leaders in each
    community. These results can be used in product adoption campaigns, targeting
    the leaders to spread the message throughout their communities.


    The amount of data used to describe a network can be huge. To understand the network
    and its structure, or the pattern of the relationships, or even the members’ behavior,
    effective data preparation is required. Very often, during the data preparation
    phase, the data scientist communicates with the business departments the type
    of network that will be built, the elements that will be used to describe the
    nodes and links, and the methods to weight nodes and links based on the business
    information available. This information, particularly about the weight nodes and
    links, is essential to compute the network metrics and derive subnetworks from
    the main network.


    Once the data preparation is finished and the network is built based on the information
    available for nodes and links, a set of tasks can be performed to understand the
    network and describe its characteristics. In network analysis, two main groups
    of tasks can be performed, the subgraph analysis, where diverse types of subnetworks
    are detected, and the network metrics calculation, where a set of measures is
    computed to describe nodes and links within the network or the subnetworks identified.


    ## Network Subgraphs


    From the subgraph’s detection, the most common tasks are community detection,
    k-core decomposition, reach networks, connected components, and biconnected components.


    ### Community Detection


    Community detection recursively identifies subgraphs (community is defined as
    a unique group of nodes) within the network based on the strength of the relationships
    between the nodes. The main rule is that the average link weight inside the communities
    should be greater than the average link weight between the communities. The simple
    interpretation of this rule is that the community detection algorithm aims to
    get together nodes that are more related to each within communities.


    ### K-core Decomposition


    Core decomposition can be an alternative for community detection in some network
    scenarios. Core decomposition searches for groups of nodes with the same interconnectivity.
    The method is nested. The most cohesive group, let us say core 5, comprises all
    nodes with at least five connections. The second most cohesive core, let us say
    core 4, comprises all nodes with at least four connections. `core 4` then also
    comprises all nodes in `core 5`. Cores `3`, `2`, and `1` follow the same process.
    The idea of the nodes in the cohesive cores is that these nodes can establish
    a consistent flow of information throughout the network.


    ### Reach Networks

