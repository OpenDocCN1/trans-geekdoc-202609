- fmt: '

    # How can the trained models be used and deployed in production in the appropriate
    time frame to support the required business actions?


    For example, can the trained model support a campaign that targets customers with
    the highest probabilities of churn and offer them incentives to keep them using
    and consuming the company’s products and services? Can the trained model support
    a fraud detection process in real time to identify possible fraudulent business
    transactions? The model’s results might be very accurate, but to benefit the organization,
    the model should be deployed in an appropriate time frame. For example, in cybersecurity,
    if the model does not generate real-time alerts in a way that fraud analysts can
    take immediate actions, then the model might be useless, since digital attacks
    must be identified within seconds, not weeks or months.


    Once an answer is provided, it might generate more questions regarding the business
    problem. Therefore, the data science lifecycle is cyclical as the process is repeated
    until the business problem is solved.


    ## The Data Science Approach


    The entire analytical process and the data science approach can be viewed as a
    dynamically evolving flow as shown in [Figure 1.4](#Chapter01.xhtml#ch01fig4).
    In data science, the more complex the analytical task, the more value added to
    the business. For example, a simple query report can add value to the business
    by simply illustrating the relationships in the data, showing what happened in
    the past. It is very much descriptive in the sense that nothing can be done to
    change that historical event. However, awareness is the first step to understand
    the business problem and aim for an analytical solution.


    Data exploration analyses can add further value to the business with more complex
    queries to the data. Multi-dimensional queries can help business analysts to not
    only understand what happened, but why it happened in that way. Analyzing the
    historical data under multiple dimensions at the same time can answer many questions
    about the business, the market, and the scenarios. Data mining, analytics, or
    data science, regardless of the name, it is a further step to gain knowledge about
    the business. Some analytical models explain what is going on right now. Unsupervised
    models such as clustering, segmentation, association analysis, path analysis,
    and link analysis help business analysts understand what exactly happens in a
    very short time frame and allow companies to deploy business actions to take advantage
    of this knowledge. Furthermore, supervised models can learn from past events and
    predict and estimate future occurrences. Data science in this phase is basically
    trying to know what will happen in the future. This is very similar to econometric
    and forecast models trying to foresee what will happen soon with a business event.


    ## Optimization


    The final stage in the evolving analytical process is optimization. Optimization
    algorithms add more business value by showing what specific offer to make each
    customer. Optimization models consider an objective function (what to solve),
    a limited set of resources (how to solve), and a set of constraints (solve it
    at what price). An organization might have several models in production to classify
    customers in multiple aspects, for example, the likelihood to make churn, the
    probability to not pay, etc. A combination of all these scores can be used to
    optimize campaigns and offerings. For example, the churn model predicts who is
    the customer most likely to make churn. However, not all customers have the same
    value to the business. Some might be insolvent. Some might not generate any profit.
    Some can be very valuable. The optimization process shows what incentives to offer
    to certain customers to maximize the profit in a specific campaign.


    Figure 1.4: Model’s Evolution in Advanced Analytics


    ![image](Images/f0012-01.jpg)


    ## Advanced Analytics in Data Science


    Data science and advanced analytics comprise more than simply statistical analysis
    and mathematical models. The field encompasses machine learning, forecasting,
    text analytics, and optimization. Data scientists must use all these techniques
    to solve business problems. In several business scenarios, a combination of some
    of these models are required to propose a feasible solution to a specific problem.


    ### Machine Learning Model Types


    There are basically two types of machine learning models: supervised learning
    (when the response variable (also known as the target) is known and used in the
    model) and unsupervised learning (when the target is unknown or not used in the
    model). The input variables (also called features in the machine learning field
    or the independent attributes in the statistical field) contain information about
    the customers, who they are, how they consume the product or service, how they
    pay for it, for how long they are customers, from where they came from, where
    they went to, among many other descriptive information.


    The target is the business event of interest, for example, when a customer makes
    churn, purchases a product, makes a payment, or simply uses a credit card or makes
    a phone call. This event is called a target because this is the event the model
    will try to predict, classify, or estimate. This is what the company wants to
    know. (A target is also called a label in the machine learning field or dependent
    attribute in the statistical field.) Unsupervised models do not require the target.
    These models are used to generate insights about the data, or market, or customers,
    to evaluate possible trends or to better understand some specific business scenarios.
    These models do not aim to classify, predict, or estimate a business event in
    the future.


    As shown in [Table 1.1](#Chapter01.xhtml#ch01tab1), regression, decision tree,
    random forest, gradient boosting, neural network, and support vector machine are
    examples of supervised models. Clustering, association rules, sequence association
    rules, path analysis, and link analysis are examples of unsupervised models. There
    is a variation of these types of models called semi-supervised models. Semi-supervised
    models involve a small amount of data where the target is known and a large amount
    of data where the target is unknown. There are also models associated with reinforcement
    learning, where the algorithm is trained by using a system to reward the step
    when the model goes in the right direction and to punish the step when the model
    goes in the wrong direction. Semi-supervised models are becoming more prevalent
    and are often implemented in artificial intelligence applications. For example,
    reinforcement learning can be used to train a model to learn and take actions
    in self-driving cars. During the training, if the car drives safely in the road,
    the learning step is rewarded because it is going in the right direction. On the
    other hand, if the car drives off the road, the learning step is punished because
    the training is going in the wrong direction.


    As statistical models try to approximate reality through mathematical formalized
    methods making predictions about future events, machine learning automates some
    of the most important steps in analytical models, the learning process. Machine
    learning models automatically improve the learning steps based on the input data
    and the objective function.


    | Table 1.1: Machine Learning Models |


    | --- |


    | Supervised Models || Unsupervised Models |

    | Regression || Clustering |

    | Decision Tree || Association Rules |

    | Random Forest || Sequence Association Rules |

    | Gradient Boosting || Path Analysis |

    | Neural Networks || Link Analysis |

    | Support Vector Machine ||  |

