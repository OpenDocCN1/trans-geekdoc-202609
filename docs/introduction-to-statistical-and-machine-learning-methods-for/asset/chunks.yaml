    # 第 1 章：数据科学简介


    ## 章节概述


    本章介绍了数据科学的核心概念，数据科学是一个涉及计算机科学、数学、统计学、领域知识和交流的科学领域。本章的主要目标是：


    *   解释与数据科学领域最重要的任务和角色。

    *   解释如何应用数据科学来解决问题并改进业务运营。

    *   将数据科学描述为不同学科的结合，例如计算机科学、数学和统计、领域知识和交流。

    *   描述与数学和统计相关的技能，以及它们在通过分析建模解决业务问题中所起的作用。

    *   描述与计算机科学相关的技能，以及它们通过支持分析模型的有效训练和部署来解决业务问题所起的作用。

    *   描述与领域知识相关的技能，以及它们通过为数据、模型以及战术和运营行动增加价值来解决业务问题所起的作用。

    *   描述与交流和可视化相关的技能，以及它们通过描述和解释解决方案、模型结果和可能的运营行动来解决业务问题所起的作用。


    ## 数据科学


    数据科学并不是单一的学科。它包含一系列不同的专业领域和技能，将它们结合起来解决问题并改进和优化流程。在所需的若干技能中，最重要的是数学和统计、计算机科学和领域知识。


    数据科学家需要数学和统计来理解业务场景中产生的数据，对这些数据进行建模以获得洞察，或对未来事件进行分类或估计。数学和统计还需要评估开发的模型，评估它们与问题的匹配程度，以及如何使用它们来解决或改进特定的流程。


    `图 1.1` 中的信息图涉及三个主要领域：数学和统计、计算机科学和领域知识。在接下来的章节，我们将更深入地讨论这些领域，以及交流、可视化和硬软技能等其他重要领域。


    ### 图 1.1：数据科学中的专业领域


    ![image](img/f0002-01.jpg)


    这三个主要领域的交叉点也非常重要。机器学习是数学、统计和计算机科学交叉的领域。机器学习是人工智能的一个分支，其理念是系统可以从数据中学习、识别模式、识别行为并在最少人工干预的情况下做出决策。它是一种数据分析方法，可以实现数据准备、特征工程、模型训练并最终的模型部署。机器学习允许数据科学家实现非常复杂的模型，例如神经网络或支持向量机，以及简单模型的集成，如决策树、梯度提升和随机森林。这些复杂模型可以捕捉输入（自变量）与目标（因变量）之间非常不寻的关系。


    数学、统计和领域知识的交叉点是研究领域。研究技能使数据科学家能够在模型构建中应用新技术。这种组合允许开发出更复杂的模型，这些模型更准确且对函数形式的依赖较小。研究技能可以加速开发过程，特别是当对目标分布以及自因变量之间关系所需的假设较少时。


    数据科学中的软件技能通常是指计算机科学与领域知识的交叉。软件技能（如对开源语言和其他世界级软件语言的熟悉）有助于数据科学家创建新模型。计算机科学技能、软件技能和领域知识的结合有助于数据科学家解决业务问题或改进特定的业务流程。


    ## 数学与统计


    数据科学家需要具备强大的数学和统计技能来理解可用数据、准备训练模型所需的数据、在训练和验证分析模型时部署多种方法、评估模型结果，并最终解释和解读模型的结果。例如，数据科学家需要理解问题，解释目标的变异性，并进行对照测试以评估参数值对目标值变化的影响。


    数据科学家需要数学和统计技能来总结数据以描述过去发生的事件（称为描述性统计）。这些技能被用于从样本结果将其推广到更大的总体中（称为推断统计）。数据科学家还需要这些技能来拟合已知响应变量的模型，并在此基础上训练模型以进行分类、预测或估计未来结果（称为监督建模）。这些预测性建模技能是数据科学中应用最广泛的技能之一。


    当业务条件不需要特定事件，且没有过往行为来驱动监督模型的训练时，就需要数学和统计。学习过程基于在数据集中发现原先未知的模式（称为无监督建模）。此时没有目标变量，主要目标是提出一些洞察，以帮助公司理解客户和业务场景。


    '
- fmt: '

    # Mathematics and Statistics


    Data scientists need mathematics and statistics in the field of optimization.
    This refers to models aiming to find an optimal solution for a problem when constraints
    and resources exist. An objective function describes the possible solution, which
    involves the use of limited resources according to some constraints. Mathematics
    and statistics are also needed in the field of forecasting that is comprised of
    models to estimate future values in time series data. Based on past values over
    time, sales, or consumption, it is possible to estimate the future values according
    to the past behavior. Finally, mathematics and statistics are needed in the field
    of econometrics that applies statistical models to economic data, usually panel
    data or longitudinal data, to highlight empirical outcomes to economic relationships.
    These models are used to evaluate and develop econometric methods.


    Mathematics and statistics are needed in the field of text mining. This is a very
    important field of analytics, particularly nowadays, because most of the data
    available is unstructured. Imagine all the social media applications, media content,
    books, articles, and news. There is a huge amount of information in unstructured,
    formatted data. Analyzing this type of data allows data scientists to infer correlations
    about topics, identify possible clusters of contents, search specific terms, and
    much more. Recognizing the sentiments of customers through text data on social
    media is a very hot topic called sentiment analysis.


    # Computer Science


    The volume of available data today is unprecedented. And most important, the more
    information about a problem or scenario that is used, the more likely a good model
    is produced. Due to this data volume, data scientists do not develop models by
    hand. They need to have computer science skills to develop code, extract, prepare,
    transform, merge and store data, assess model results, and deploy models in production.
    All these steps are performed in digital environments. For example, with a tremendous
    increase in popularity, cloud-based computing is often used to capture data, create
    models, and deploy them into production environments.


    At some point, data scientists need to know how to create and deploy models into
    the cloud and use containers or other technologies to allow them to port models
    to places where they are needed. Think about image recognition models using traffic
    cameras. It is not possible to capture the data and stream it from the camera
    to a central repository, train a model, and send it back to the camera to score
    an image. There are thousands of images being captured every second, and this
    data transfer would make the solution infeasible. The solution is to train the
    model based on a sample of data and export the model to the device itself, the
    camera. As the camera captures the images, the model scores and recognizes the
    image in real time. All these technologies are important to solve the problem.
    It is much more than just the analytical models, but it involves a series of processes
    to capture and process data, train models, generalize solutions, and deploy the
    results where they need to be. Image recognition models show the usefulness of
    containers, which packages up software code and all its dependencies so that the
    application runs quickly and reliably from one computing environment to another.


    With today’s challenges, data scientists need to have strong computer science
    skills to deploy the model in different environments, by using distinct frameworks,
    languages, and storage. Sometimes it is necessary to create programs to capture
    data or even to expose outcomes. Programming and scripting languages are very
    important to accomplish these steps. There are several packages that enable data
    scientists to train supervised and unsupervised models, create forecasting and
    optimization models, or perform text analytics. New machine learning solutions
    to develop very complex models are created and released frequently, and to be
    up to date with new technologies, data scientists need to understand and use these
    all these new solutions.


    Software to collect, prepare, and cleanse data are also very important. Any model
    is just a mapping of the input data and the event to be analyzed, classified,
    predicted, or estimated. If the data is poor quality or has a lot of inconsistences,
    the model will map this, and the outcomes will be inaccurate. Huge amounts of
    data should be stored in efficient repositories. Databases are needed to accomplish
    that, and data scientists are required to understand how the databases work. To
    process massive amounts of data, distributed environments are required. Often,
    data scientists need to understand how these massive parallel processing engines
    work. In addition to databases, there are lots of new structures of repositories
    to perform analytics.


    In summary, there are too many skills to be learned and mastered. Much more than
    one human being can handle. Therefore, in most of the cases, data scientists will
    need to partner with someone else to perform all the activities needed to create
    analytical models, such as data engineers, application developers, database administrators,
    infrastructure engineers, and domain knowledge experts.


    # Domain Knowledge


    One of the most critical skills data scientists need is domain knowledge. Yes,
    human beings are still important. It is important to understand the problem and
    evaluate what is necessary to solve it. It is important to understand how to link
    the model results to a practical action. The analytical model gives a direction.
    How to use the results to really solve the problem, based on a series of information,
    policies, regulations, impacts, and so on, is the key factor to success. Another
    key factor in creating analytical models is awareness of the business problem
    and how it affects companies, communities, people, and governments. Knowing the
    business scenario helps data scientists create new input variables, transform
    or combine original ones, and select and discard important or useless information.


    A good example of domain knowledge is in the telecommunications field. Data scientists
    need to know what type of data are available, how transaction systems are implemented,
    what billing system is used, and how data from the call centers are collected.


    In addition to the domain knowledge, which allows data scientists to improve model
    development by incorporating business concepts, data scientists must be curious
    and try out multiple approaches to solve business problems. They need to be proactive
    in anticipating business issues and propose analytical solutions. There are situations
    where business issues are not clear, but improvements can be made. Data scientists
    need to be innovative to design and implement different approaches to solve problems.
    Creativity and innovation include combining distinct analytical models together
    to raise insights and to enrich the data analyses.

    '
