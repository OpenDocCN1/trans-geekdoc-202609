- fmt: '

    In general, the predictions from logistic regression can be rankings, decisions,
    or estimates. Analysts can rank the posterior probabilities to assess observations
    to decide what actions to take. For example, in a collection campaign, the customers
    can be contacted based on the rank of the posterior probability. Higher posterior
    probabilities mean that customers are more likely to pay their bills. To get a
    decision, you need a threshold. The easiest way to get a meaningful threshold
    is to convert the prediction ranking to a prediction estimate. You can obtain
    a prediction estimate using a straightforward transformation of the logit score,
    the logistic function. The logistic function is the inverse of the logit function.
    You can obtain the logistic function by solving the logit equation for `p`. The
    threshold can be the value for a random event, for example, `0.5` or `50%`. For
    example, the odds to flip a coin and get a tail or a head is 50-50. If the posterior
    probability is greater than `0.5`, then the decision is that the observation likely
    has the event of interest. For example, all customers with the posterior probability
    greater than `0.5` are likely to pay their bills. All customers with a posterior
    probability less than or equal to `0.5` are likely to not pay their bills.


    The parameter estimates in a logistic regression are commonly obtained by the
    method of maximum likelihood estimation. These estimates can be used in the logit
    and logistic equations to obtain predictions.


    If the target variable is dichotomous (two categories), the appropriate logistic
    regression model is binary logistic regression. If there are more than two categories
    (levels) within the target variable, then there are two possible logistic regression
    models:


    *   If the target variable is nominal, the appropriate model is nominal logistic
    regression.

    *   If the target variable is ordinal (rankings), the appropriate model is ordinal
    logistic regression.


    The binary logistic regression model assumes that the logit of the posterior probability
    is a linear combination of the predictor variables. The parameters `β0`, `β1`,...`βk`
    are unknown constants that must be estimated from the data (`k` is the number
    of predictor variables).


    The strengths of the logistic regression model are similar to the linear model.
    First, the model is quite simple to implement since it is only a linear equation.
    Second, the coefficients from the model are easily interpretable as the effect
    on the logit given a one-unit increase in the predictor variable controlling for
    the other predictor variables. When the parameter estimates are exponentiated,
    odds ratios are obtained that show the strength of the relationship between the
    predictor variables and the target. Furthermore, the predicted values have a nice
    probabilistic interpretation. Third, in most cases, the results of the model can
    be obtained quickly. Fourth, new observations can be scored quickly.


    The drawbacks of logistic regression are like linear regression in that a high
    degree of collinearity among the predictors will cause model instability. Furthermore,
    if there are nonlinear relationships between the predictor variables and the target,
    data scientists will have to add higher order terms or variable transformations
    to properly model these relationships. Finally, logistic regression models can
    be affected by outliers that can change the model results and lead to poor predictive
    performance.


    ## Use Case: Collecting Predictive Model


    An example of a business problem that can be addressed using logistic regression
    is the probability of debt repayment. The main goal of the model is to rank insolvent
    customers based on the probability of paying off their unpaid bills. The results
    of the model can be used to target the insolvent customers who are more likely
    to pay off their debt. The input variables in the data are:


    *   Demographic information

    *   Frequency of payment

    *   Age of customer

    *   Product

    *   Credit history

    *   Service

    *   Amount

    *   Day

    *   Payment type

    *   Delinquent

    *   Debt to income

    *   Debt to ratio

    *   Unpaid bills


    The target variable is: Whether the customer has paid.


    ## Decision Tree


    Decision trees are statistical models designed for supervised prediction. Supervised
    prediction encompasses predictive modeling, pattern recognition, discriminant
    analysis, multivariate function estimation, and supervised learning. A decision
    tree includes the following components:


    *   An internal node is a test on an attribute.

    *   A branch represents an outcome of the test, such as `color=purple`.

    *   A leaf node represents a class label or class label distribution.

    *   At each node, one attribute is chosen to split the training data into distinct
    classes as much possible.

    *   A new instance is classified by following a path to a leaf.


    The model is called a decision tree because the model can be represented in a
    tree-like structure. A decision tree is read from the top down starting at the
    root node. Each internal node represents a split based on the values of the inputs.
    The inputs can appear in any number of splits throughout the tree. Cases move
    down the branch that contains its input value. In a binary tree with interval
    inputs, each internal node is a simple inequality. A case moves left if the inequality
    is true and right otherwise. The terminal nodes of the tree are called leaves.
    The leaves represent the predicted target. All cases reaching a leaf are given
    the same predicted value. The leaves give the predicted class as well as the probability
    of class membership.


    Decision trees can also have multi-way splits where the values of the inputs are
    partitioned into disjoint ranges.


    When the target is categorical, the model is called a classification tree. A classification
    tree can be thought of as defining several multivariate step functions. Each function
    corresponds to the posterior probability of a target class. When the target is
    continuous, the model is a regression tree. The leaves give the predicted value
    of the target. All cases that reach a leaf are assigned the same predicted value.
    Cases are scored using prediction rules. These prediction rules define the regions
    of the input space in which the predictions are made. Each prediction rule tries
    to make the region of the input space purer with regard to the target response
    value.


    To illustrate decision trees using business data, a generic data set containing
    information about payment is used with a binary target of default. For simplicity,
    the input variables are:


    *   Previous delay: the number of previous delays since the time analyzed.

    *   Over billing: the billing amount difference, or the billing amount divided
    by average billing amount.

