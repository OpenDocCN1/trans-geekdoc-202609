    Data scientists should be able to build statistical and machine learning flows
    to access the available data, prepare the data for supervised and unsupervised
    modeling, fit different types of analytical models to solve the business problems,
    evaluate models according to the business requirements, and deploy the champion
    model (the chosen model based on some criteria) and challenger models (models
    that are trained differently such as using different algorithms) in production
    to support the planned business actions. All analytical models are trained based
    on data sets that, considering a specific time frame, describe the market scenario
    and the business problem. The models learn from the input variables and create
    a generalized map to the target, establishing relationships between the input
    variables and the target. This map describes the past behavior associated with
    the target in a specific point in time. As time goes by, customer behavior might
    change and thus the data that describes that pattern. When this happens, the current
    model in production drifts because it is based on a past customer behavior that
    no longer exists. That model needs to be retrained or a new model needs to be
    developed. This is a very important cycle in analytics, and the field of machine
    learning can contribute greatly with models that automatically retrain or learn
    from experience.


    There is a great debate about when and how to use machine learning models and
    statistical models. Usually, machine learning models can be more accurate and
    perform better in production to support business actions. As a caveat, most of
    the machine learning models are not easy to interpret or explain. On the other
    hand, statistical models can generalize better estimations for future events.
    They are often simpler and easier to interpret and explain. In some industries,
    usually the strictest regulated ones, an interpretable model is mandatory. Statistical
    models also make the inputs and their effects on the prediction easier to explain,
    allowing the business departments to design campaigns and promotions more geared
    to the customers’ behaviors.


    ## Statistical Analysis

    Statistical analysis is the science of collecting, exploring, and presenting large
    amounts of data to discover underlying patterns, behaviors, and trends. Organizations
    use statistics and data analysis every day to make informed business decisions.
    As more data are collected every day and the infrastructure to store and process
    all this data gets cheaper, more data analyses are performed to drive business
    decisions.


    Statistical analysis includes descriptive statistics, where models summarize the
    available data to describe past events or previous scenarios. Another statistical
    analysis field is inferential statistics, where models take the results of a sample
    and generalize and extrapolate them to a larger population. Another field in statistical
    analysis is predictive modeling, in which models provide an estimate about the
    likelihood of a future outcome. This outcome can be a binary target, a multinomial
    target, or a continuous target.


    - A binary target is assigned to a classification model, like yes or no.

    - A multinomial target is assigned to a type of classification, but for multiple
    classes, like high, medium, and low.

    - A continuous target is assigned to an estimation, where the event can be any
    continuous values, like the loss in a fraud event or the amount of purchase.


    For example, a credit score model can be used to determine whether a customer
    will make a future payment on time or not. The credit score model can also classify
    the range of the risk, such as high risk to default, medium risk to default or
    low risk to default. The credit score model can finally estimate the value associated
    to the default.


    Finally, there is the field of prescriptive statistics, where models quantify
    the effect of future decisions. This area simulates and evaluates several possible
    courses of action and allows companies to assess different possible outcomes based
    on these actions. It is like a what-if type of analysis.


    ## Forecasting

    Forecasting describes an observed time series to understand the underlying causes
    of changes and to predict future values. It involves assumptions about the form
    of the data and decomposes time series data into multiple components.


    Auto-regressive integrated moving average (ARIMA) models are forecasting models
    where the predictions are based on a linear combination of past values, past errors,
    and current and past values of other time series. Another type of forecasting
    model is the causal model, which forecasts time series data that are influenced
    by causal factors such as calendar events to describe possible seasonality. Finally,
    there are modern and complex forecasting models that incorporate time series data
    whose level, trend, or seasonal components vary with time. They might include
    hierarchical segments of time series and recurrent neural networks to account
    for stationary and nonstationary data.


    ## Text Analytics

    Text analytics is a field associated with uncovering insights from text data,
    usually combining the power of natural language processing, machine learning,
    and linguistic rules. Data scientists can use text analytics to analyze unstructured
    text, extract relevant information, and transform it into useful business intelligence.


    For example, data scientists can use information retrieval to find topics of an
    unstructured document, such as using a search engine to find specific information.
    Sentiment analysis is another field in text analytics and very useful in business.
    Sentiment analysis determines levels of agreement from unstructured data associating
    the overall information as a positive, negative, or neutral sentiment. Data scientists
    also use text analytics for topics discovery and clustering, where topics or clusters
    are revealed from various text documents based on the similarity that they have
    between them.


    Finally, text categorization is a technique where a text analytics model labels
    natural language texts with relevant categories from a predefined set. Domain
    experts and linguistics interact in this field to create and evaluate the categories.


    ## Survival Analysis

    Survival analysis is a class of statistical methods for which the outcome variable
    of interest is the time until an event occurs. Time is measured from when an individual
    first becomes a customer until the event occurs or until the end of the observation
    interval (the individual then becomes censored). In survival analysis, the basis
    of the analysis is tenure, or the time at risk for the event. Therefore, it is
    not just whether the event occurred, but when it occurred.


    The goal in survival analysis is to model the distribution of time until an event.
    The job of the data scientist is to identify the variables that are associated
    with the time until an event and to predict the time until an event for new or
    existing customers. Survival analysis can be used in customer retention applications
    where the outcome is the time until the cancellation of all products and services.
    Another example is credit risk management applications where the outcome is the
    time until a loan defaults.


    ## Optimization

    The last topic in the advanced analytics framework is optimization. Mathematical
    optimization is a major component in operations research, industrial engineering,
    and management science. An optimization model searches for an optimal solution,
    which considers a set of pre-determined constraints and a limited set of resources.

