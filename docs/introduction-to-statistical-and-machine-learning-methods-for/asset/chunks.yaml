- fmt: "\nOnce a reasonable number of variables have been selected, data scientists\
    \ usually have several choices of models to choose based on their complexity.\
    \ A common pitfall is to overfit the data in which the model is too complex. An\
    \ overly complex model might be too sensitive to the noise in the data and not\
    \ generalize well to new data. An example is a model with many unnecessary higher\
    \ order terms such as `age*age` and `income*income`. However, using too simple\
    \ a model can lead to underfitting where the true features are ignored.\n\n# Model\
    \ Generalization\n\nTypically, model performance follows a straightforward trend.\
    \ As the complexity of the model increases and more terms are added to the model,\
    \ or more interactions in the training process, the fit on the training data set\
    \ generally improves as well. Some of this increase is attributable to the model\
    \ capturing relevant trends in the data, sometimes very specific correlations\
    \ between the inputs and the target. However, some of the increase might be due\
    \ to overfitting the training data as the model might be reacting to random noise.\
    \ That will work well for the training data set but not for the validation data\
    \ set or even for the test data set. And probably not for future data. Therefore,\
    \ the model fit on the validation data for models of varying complexity is also\
    \ examined.\n\nThe typical behavior of the model fit on the validation data is\
    \ an increase in model fit as the complexity increases, followed by a plateau,\
    \ followed by a decline in performance. This decline is due to overfitting. Consequently,\
    \ a common recommendation is to select a model that is associated with the complexity\
    \ that has the highest validation fit statistic. A recommended practice is to\
    \ select the simplest model with the best performance. That means select the model\
    \ with the best performance under the validation data, but the simplest model\
    \ possible. If the assessment error plot shows a plateau in the error for the\
    \ validation data set, then select the simplest model at the beginning of the\
    \ plateau. Simpler models tend to generalize better. Complex models tend to be\
    \ affected by change in the input data because their structure is more complex.\n\
    \n## Figure 2.15: Fit Versus Complexity\n\n![image](Images/f0034-01.jpg)\n\n#\
    \ Bias–Variance Tradeoff\n\nThe goal of the data scientist is to fit a model with\
    \ low bias and low variance. Bias is the difference between the average prediction\
    \ of the model and the correct value that we are trying to predict while variance\
    \ is the variability of model prediction for a given data point. A model with\
    \ high bias misses the important relationships between the predictor variables\
    \ and the target. This is an example of underfitting. However, a model with high\
    \ variance models the random noise in the data. This is an example of overfitting.\
    \ The bias-variance tradeoff is where the data scientists choose a model that\
    \ accurately depicts the relationships in the data, but also chooses a model that\
    \ generalizes well to new data.\n\nEvaluating the model on the data the model\
    \ was fit on usually leads to an optimistically biased assessment. For example,\
    \ a model might be fit on one set of data, the training data set, and the accuracy\
    \ of the model was estimated at 70%. However, when the model was applied to a\
    \ new data set, the validation data set, the accuracy was estimated at 47%. Why\
    \ the large difference in accuracy percentages? This is an example of overfitting\
    \ where the model was overly sensitive to peculiarities in the training data set\
    \ and the model did not generalize well to the validation data set.\n\n# Summary\n\
    \nThis chapter introduced the main concepts of data exploration, how data exploration\
    \ is a key stage for any data science project, and how it can address many business\
    \ issues as a result of reviewing and exploring the information needed to solve\
    \ a business problem through an analytical model. Data scientists need to understand\
    \ how important data exploration is in reviewing the information needed to create\
    \ analytical models to solve business problems. Data exploration tasks help companies\
    \ fix data quality issues and transform raw data into relevant business information.\n\
    \nThis chapter introduced specific concepts about data preparation. Concepts about\
    \ how to merge data from different sources to create a more comprehensive view\
    \ about the customers and the business problems were covered. Different methods\
    \ of sampling, techniques for data partitioning, different approaches to transform\
    \ the original input data into relevant information to enhance supervised and\
    \ unsupervised models, and techniques to create new features from the original\
    \ data to improve model results were covered. The chapter concluded by discussing\
    \ some statistical measures to select the inputs used in the models and how to\
    \ select the model that generalizes well to new data.\n\n# Chapter 3: Supervised\
    \ Models – Statistical Approach\n\n## Chapter Overview\n\nIn this chapter, you\
    \ will learn about supervised modeling. The term supervised refers to observations\
    \ or cases where the target is known. Based on the known events, a model is trained\
    \ to capture the relationship between the inputs and the target. There are several\
    \ techniques and algorithms used in supervised modeling, including statistical\
    \ models and machine learning models. [Chapter 3](#Chapter03.xhtml#ch03) covers\
    \ the statistical models, including linear and logistic regression models and\
    \ decision trees. [Chapter 4](#Chapter04.xhtml#ch04) covers the machine learning\
    \ models.\n\nThe main goals of this chapter include:\n\n*   Explain the purpose\
    \ of using statistical supervised models, focusing on linear regression, logistic\
    \ regression, and decision trees.\n*   Describe several types of supervised models,\
    \ the distinct techniques, or algorithms to be used, and the circumstances under\
    \ which one of them might be used to solve a business problem.\n*   Interpret\
    \ the results of the supervised models. Linear regression, logistic regression,\
    \ and decision tree models are all interpretable. This interpretability can be\
    \ used to drive business actions based on the models results.\n\n## Classification\
    \ and Estimation\n\nClassification and estimation are common types of predictive\
    \ models. Classification assumes that the target is a class variable. The target\
    \ can be a binary class, 0 or 1, yes or no, or it can be a multinomial class,\
    \ like 1, 2, 3, 4, and 5, or low, medium, and high. For example, is this business\
    \ event a fraudulent transaction (yes or no)? Estimation assumes that the target\
    \ is a continuous number. The target can take any value in the range of negative\
    \ infinity to positive infinity.\n\nBoth predictive models, classification and\
    \ estimation, require the following:\n\n*   Observations/cases/instances:\n  \
    \  *   A real case comprising a set of attributes that describe the observation.\n\
    *   Inputs/attributes/variables:\n    *   The measures of the observation, or\
    \ its attributes. It can be demographic information about the customer, such as\
    \ age, salary, and marital status.\n*   Target/class/label:\n    *   A tag or\
    \ label for each observation. Default or no default is an example.\n\nThe data\
    \ used to train a supervised machine learning model consists of a set of cases\
    \ or observations that happened in the past, which means the value of the target\
    \ is known. The main idea is to find relationships between the predictor variables\
    \ and the target. For example, looking at all churn cases that happened in the\
    \ past six months, what input variables can explain whether the event of churn\
    \ and non-churn occurred? If a model can be trained based on past cases and find\
    \ what input variables can explain the churn and the non-churn, then this model\
    \ can be used to predict cases of churn in the future.\n"
