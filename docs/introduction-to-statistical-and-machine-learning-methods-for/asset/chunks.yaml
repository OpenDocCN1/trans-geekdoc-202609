  raw: 'One of the benefits of link analysis is to produce visualizations as outcomes.
    These visualization outputs are often very intuitive and extremely easy to understand.
    Data scientists can easily identify customer behavior associated with business
    events and discover fraudulent activity within large transaction data sets.


    [Figure 7.4](#Chapter07.xhtml#ch07fig4) shows a network represented by nodes (circles)
    and links (connections between circles). Nodes can describe cell phones and links
    can describe calls. Varied sizes for the nodes can represent ARPU (Average Revenue
    Per User). Different shades of color for the nodes can represent distinct communities
    within the network (the way cell phones are grouped together based on the frequency
    and duration of their calls to each other).


    Even though the link analysis can be used in large data sets, its outcomes can
    be better visualized when the network is not too large. It is common to filter
    out uninteresting transactions and relationships from the output so that data
    scientists can focus on associations with a specific business purpose. In this
    way, the outcome from link analysis can work best in situations where there is
    a limited number of transactions or relationships. Its visualizations begin to
    deteriorate with many transactions because the graph becomes too populated and
    then the visual analysis becomes harder to interpret.


    Figure 7.4: Link Analysis


    ![image](Images/f0109-01.jpg)


    Use Case: Product Relationships


    Link analysis is widely used in the retail and communications industries. The
    essential variables are the customer identification number and the items purchased.
    Unlike association rules analysis, the transactions in link analysis do not need
    to be in the same data set or under the same transactional identification. The
    transactions do not need to even be in the same time frame. Any relationship between
    customers and items purchased can be used to create the network to describe the
    relationships between customers and products.


    Data scientists can choose to see which customers have bought a specific product
    and service or what products and services a specific customer has bought. For
    example, consider content in streaming television services. A network of movies
    and customers are easily created based on the transactions of what movies were
    watched by which customers. Another important network would be the relationships
    of movies based on the common customers. For example, customers A, B, and C watched
    movies 1 and 2. There is then a relationship between movies 1 and 2 with a strength
    of 3 (3 customers watched them). Customers D and E watched movies 3 and 4. There
    is then a relationship between movies 3 and 4 with strength of 2. An exceptionally
    large network can be created considering a big data set of movies and customers.
    However, even in a large network, it would be easier to highlight strong relationships
    between movies watched by common customers and then use these strong relationships
    to recommend new movies to customers.


    Path Analysis


    Path analysis evaluates a chain of consecutive events that a given user or entity
    performs during a specific time frame. This is not the same statistical “path
    analysis” that Sewall Wright developed in 1921 that is a precursor to structural
    equation modeling. It is a way to understand users’ behavior to gain actionable
    insights into the data that accounts for temporal events. For example, in the
    online retail industry, path analysis can be a key data science technique to understand
    the consumer’s behaviors when purchasing over time. If a retailer sells products
    online, that company wants to convert as many visitors to a completed purchase
    as possible. Data scientists can use path analysis to determine what features
    of the website encourage customers to navigate until the check-out. They can also
    look for big drops in the navigation, associated to paths or features on the website
    that lose or confuse potential customers.


    Data scientists can use path analysis to examine the customer experience with
    online games. For example, if a large amount of time is spent around the menu
    page, there might be a problem with the user experience or the structure of the
    website in terms of the information provided. By following the customer path,
    data scientists can detect problems in the website flow and adjust the website
    structure as needed.


    Data scientists can also use path analysis to customize an e-commerce shopping
    experience. Analogous to the link analysis, the temporal relationships between
    customers and products are identified by the path analysis and can be used to
    recommend products and services to customers based on the similarity of the relationships
    found. Customers purchased products over time, and these products are related
    based on the customers. Customers who purchased some specific products can receive
    recommendations to buy strongly related products in the future.


    There are many path analysis applications in fraud detection and cyber security.
    The sequence of steps performed by the fraudsters before committing the fraud
    is crucial to understand the modus operandi in fraud events. The frequency and
    recency of some of the steps in that sequence can be used to alert breaches in
    the customer’s behavior when consuming products or services and making some transactions.


    Finally, path analysis can help solve performance issues on a server. Data scientists
    can examine a path and realize that its site freezes up after a certain string
    of events. The error can then be documented and fixed.


    As in link analysis, one of the greatest strengths of path analysis is the output.
    The graphs produced as the results of the path analysis are extremely easy to
    interpret and understand. The graph is a visual portrayal of every event performed
    during a time frame and can be used to analyze, investigate, and understand customer
    behavior or the pattern in sequences of events. Data scientists can identify problems
    in the sequence of events by analyzing the path and the progression of events
    leading to the problem.


    Path analysis describes what customers consume over time. For example, in [Figure
    7.5](#Chapter07.xhtml#ch07fig5), most of customers first purchase a device, then
    they acquire an internet fiber connection, then multiple network devices (to create
    a mesh network at home for example), then online content, then streaming packages,
    and so on. This analysis allows companies to anticipate customers’ needs and boost
    cascade sales.


    However, just as in link analysis, one of the problems with the path analysis
    outcomes is that the diagrams cannot handle many activities. If the data scientists
    are using web log data for example, the data sets could be huge because of the
    massive amounts of traffic to a website and the amount of information stored in
    each record. Records with missing Internet Protocol (IP) addresses and changes
    to website content cause messy data. Finally, path analysis does not explain why
    customers do what they do. In some analyses, data scientists might not be interested
    in why some events happen, but when they happen. However, in other analyses, why
    the event occurred could be important, in addition to when the event occurred
    or what event occurred. For example, data scientists might see a big drop-off
    from the product web page to the purchase product page, but more work needs to
    be done to find out why the customers are not purchasing the product.


    Figure 7.5: Path Analysis


    ![image](Images/f0111-01.jpg)


    For both link and path analysis, when many transactions are involved, an extensive
    data preparation process might be required. For example, when data scientists
    are investigating money laundering, the number of entities can be huge as well
    as the number of transactions. The time frame is usually extensive too, implicating
    that even more data needs to be analyzed.'
