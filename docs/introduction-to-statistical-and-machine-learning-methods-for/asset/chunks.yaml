    # Chapter 6: Unsupervised Models—Structured Data


    ## Chapter Overview


    In this chapter, we look at unsupervised models. Unsupervised models are characterized
    by not having a target. As we learned in [Chapters 3](#Chapter03.xhtml#ch03),
    [4](#Chapter04.xhtml#ch04), and [5](#Chapter05.xhtml#ch05), supervised models
    consider past events, or historical information, and a target, an outcome of interest
    that we previously know the results. Unsupervised models, on the other hand, have
    no target. The main goal is to find insights or to understand trends based on
    explanatory variables and past data. Past data can be assigned to past events,
    but those events will not be used as a target to train a model.


    Examples of unsupervised models are clustering, association rules, link analysis,
    path analysis, network analysis, and text mining. This chapter addresses clustering,
    a method to group observations based on the similarity among observations. [Chapter
    7](#Chapter07.xhtml#ch07) covers association rules. Methods to understand events
    that take place together include market basket analysis; sequence analysis to
    identify sequences of steps that commonly occur; link analysis to identify events
    that are somehow correlated to each other; and text analytics, to analyze text,
    or natural language, and extract themes, topics, and insights from it. Finally,
    [Chapter 8](#Chapter08.xhtml#ch08) covers network analysis and network optimization.
    These techniques analyze connected events or entities and use algorithms to understand
    and optimize networks.


    In this chapter, we discuss three types of clustering techniques: hierarchical,
    centroid (also known as partitioning), and self-organizing maps (which is a model-based
    approach to clustering). The best use of these techniques depends on the business
    goals and what needs to be achieved by the model and how the results are used
    in terms of business actions.


    The main goals of this chapter are to do the following:


    * Explain the purpose of using statistical unsupervised models.

    * Understand the concepts associated with clustering.

    * Describe diverse types of statistical unsupervised models and the circumstances
    under which they might be used.

    * Describe the steps required to train an unsupervised model using the clustering
    methods described.

    * Interpret the results of a clustering model in terms of business goals.


    ## Clustering


    Unsupervised models do not have a target variable. Therefore, the aim is to search
    for an unknown pattern in the data set. When a target is not present in a data
    set, the algorithm used to build analytical models is called unsupervised. A common
    type of unsupervised model is clustering, which attempts to group observations
    or cases within a data set based on the similarities of the input variables.


    Data scientists can use unsupervised models in many business applications, including:


    * **Data reduction** is a method to explore patterns in the data set to create
    a more compact representation of the original information. This is different from
    most clustering techniques, which seek to group observations. Instead, these methods
    seek to reduce variables. Though vastly broader in scope, data reduction includes
    analytic methods such as variable clustering. These variable clusters explain
    a high percentage of the variability of all original attributes comprised in the
    cluster. Data scientists can then either use the variable clusters instead of
    all original variables or select a best representative variable from each variable
    cluster.

    * **Anomaly detection** is a novelty detection method to seek unique or previously
    unobserved data patterns. These methods find applications in business, science,
    and engineering. Business applications include fraud detection, warranty claims
    analysis, and general business process monitoring. Small clusters or quite diverse
    groups can be considered as an anomaly and be further investigated by analysts
    seeking unexpected events or transactions.

    * **Profiling** is widely used in cluster analysis. The idea is to create rules
    that isolate clusters or segments, often based on demographic or behavioral measurements.
    Data scientists might develop profiles of a customer database to describe the
    consumers of a company’s products and services.


    The main objective of most clustering methods is to partition the data into groups
    so that the observations within each group are as similar as possible to each
    other. The groupings created from the clustering algorithms are also known as
    clusters or segments. The process to create the groups or segments is a training
    process. The algorithm can be applied to other data sets to classify new cases.
    This process is like supervised model scoring. Suppose that a cluster is created
    based on a set of rules and thresholds upon the input variables. If a new observation
    follows the same rules and thresholds, we can consider this new case as part of
    that cluster.


    The purpose of clustering is often descriptive. For example, segmenting existing
    customers into groups and associating a distinct profile with each group might
    help future marketing strategies and campaign actions. Clustering is also useful
    as a pre-step for predictive modeling. For example, customers can be clustered
    into more homogenous groups based on their behavior in using products and services.
    Then, a predictive model can be trained upon each cluster to predict whether customers
    make churn or not. Suppose that in a communications company, there are many diverse
    types of customers, based on the products that they purchase and how they consume
    these services. However, all of them are susceptible to make churn. As they have
    quite different behaviors, a single model can be difficult to capture the relationship
    between the input variables and the target. However, if we create groups of customers
    with more similar behaviors, a model for each group captures these relationships.


    Clustering is typically done on numeric variables. If there are categorical variables,
    which is very understandable, they must be represented numerically. Sometimes,
    a data scientist creates their own dummy codes to represent categories. A dummy
    code means coding a categorical variable into dichotomous variables such as binary
    0-1 variables. For example, suppose an input variable has three classes, A, B,
    and C. The dummy code method creates three variables to represent A as 0 or 1,
    B as 0 or 1, and C as 0 or 1. While some like the flexibility of creating their
    own dummy codes, most statistical software can perform this task.


    [Figure 6.1](#Chapter06.xhtml#ch06fig1) shows a data set that contains only two
    numeric variables: salary and age. These variables are used to create clusters.
    It seems we can find three distinct groups of observations, or cases, based on
    the cluster demographics. In other words, if we plot all cases based on their
    salary and age, we can visually identify that there are three distinct groups
    of customers.


    Clustering methods are highly dependent on units of measurement. In general, variables
    with large variances tend to have more influence on cluster formation than variables
    with small variances. For example, in a clustering based on salary and age, we
    can assume that the variation in all salaries can be greater than the variation
    in all ages.

