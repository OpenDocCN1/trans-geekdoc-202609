    # 第 2 章：数据探索与准备


    ## 章节概述

    本章介绍了数据探索的核心概念，展示了数据探索为何任何数据科学项目的关键阶段，并说明了如何通过审查和探索解决业务问题所需的信息，从而解决许多业务问题。除了数据探索外，本章还介绍了与数据准备相关的许多任务，特别关注了分析建模的前期准备步骤。在数据准备过程中，可能会出现许多数据问题。你可能需要修复数据质量问题、转换原始信息，并填补和替换原始值以适应分析模型。这是任何数据科学项目中的至关重要的一步。


    本章还介绍了了来自不同来源的数据合并概念，以便对业务问题建立更全面的视图，考虑了客户行为、产品和服务交易、营销场景、画像等。通常，不同的信息存储在多个系统中，将它们合并并匹配是数据准备中的一项重大挑战。你还将学习这些任务如何实质地改进结果。


    本章的主要目标是：

    * 解释如何审查数据集，以确定是否包含了解决业务问题所需的信息，以及这些信息是否格式正确以便用于分析模型来解决问题。

    * 解释如何进行分布和基数分析，以确定数据的呈现方式，以及为了数据科学项目和分析模型需要对数据进行哪些修正。

    * 解释如何处理用于训练解决业务问题的分析模型的数据中的非线性、稀疏性和离群值。

    * 解释如何准备和使用非结构化数据来改进分析模型解决业务问题的能力。非结构化数据可以直接用于解决业务问题，也可以在解决业务问题时作为新特征引入分析模型。

    * 解释不同的数据采样方法。描述在何时需要每种采样方法以及它们对分析建模阶段的益处。

    * 解释数据划分的方法、不同类型的划分，以及划分数据以使分析模型泛化到生产环境的原因。

    * 解释如何转换原始输入数据以改进分析建模的结果。

    * 解释如何从原始输入数据中创建新特征以改进分析建模的结果。

    * 解释如何选择一个对新数据泛化能力良好的模型。


    ## 数据探索引言

    分析建模过程的首要步骤之一是数据探索。这一步是数据科学家熟悉其解决任何业务问题所需的数据。数据科学家需要完成许多任务，不仅是为了理解描述他们试图解决的业务问题的数据，更是为了从分析模型的角度准备这些数据以解决问题。


    与数据探索相关的任务包括管理以下内容：

    * 非线性

    * 高基数

    * 非结构化数据

    * 稀疏数据

    * 离群值

    * 比例不正确的输入变量


    ### 非线性

    数据探索可以说明预测变量与结果之间的非线性关联。非线性关联的一个例子是预测变量与结果之间的二次关系。在这种情况下，数据科学家必须修改模型以考虑这种二次关系。


    非线性要求数据科学家探索不同的模型，以解释预测变量与目标之间复杂的关系。这里可以使用如基于树的模型和神经网络等通用近似器模型。


    ### 高基数

    某些变量可能具有高基数，即分类变量具有许多水平。如邮政编码或产品代码可能具有高基数。高基数在回归或神经网络等分析模型中可能会产生问题，因为为每个水平都会创建一个参数。


    假设你正试图寻找薪资（目标）与工作年限之间的线性关联。你有两个参数：一个截距参数和一个工作年限参数。如果加入年龄，你现在就有三个参数。然而，如果加入教育背景（高中及以下、高中学历等），你可能会增加更多参数。


    ### 非结构化数据

    使用非结构化数据（如文本数据、网络数据、图像、音频和视频）可能有助于解释业务问题，或者简单地对于数据科学家建模的结果数据具有更强的预测能力。例如，在流失分析中，检查叫中心数据并识别不满意的客户可能会为流失提供良好的预测指标。这些数据通常是文本格式或音频格式。客户之间的关系，以及产品/服务与客户之间的关系可能具有巨大的预测价值，因为它们描述了消费和使用行为与某些特定业务事件（如流失、欺诈或购买）的相关性。这些类型的数据应该被准备好并用于分析模型中，要么直接解决业务问题，要么作为新特征添加以提高模型性能和解释性。


    ### 稀疏数据

    数据科学家还会遇到稀疏数据，即数据中的事件极少，大多数发生情况是缺失或不完整的。一个例子是在线零售公司的评分系统。并不是所有购买公司产品的客户都会对产品评分。相反，并不是所有产品都经过客户评分。当合并所有产品和所有客户评分时，生成的矩阵是非常稀疏的。这为大多数模型捕捉输入与目标之间的关系带来了严重问题。问题之一是没有足够的数据来估计客户与产品之间的交互。


    有一种专门针对此类问题的模型。分解机模型通过矩阵分解绕过稀疏矩阵的问题。这种技术通常是有效的，因为它使数据科学家能够发现客户与产品交互背后的潜在特征。因此，即使矩阵中
    99% 的单元格是空的，分解机模型也能预测客户对产品的评分。


    ### 离群值


