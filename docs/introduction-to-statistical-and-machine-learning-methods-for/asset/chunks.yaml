    支持向量机最初是为了纯分类任务而开发的，用于解决模式识别问题。换句话说，模型做出的是决策预测，而不是排序或估计。通过这种方式，`SVM` 将二分类目标的结果分为两类，例如正方形和圆形。现在，支持向量机也可以用于回归任务。在图
    5.1 所示的简单示例中，目标是将深色正方形与浅色圆形进行分类。有许多分类规则或“回归线”可以用于区分正方形和圆形情况。事实上，如果数据是线性可分的（如图所示），那么有无限数量解决方案或直线，可以区分正方形、圆形或二分类目标中的任何情况。在考虑所有可能的分割正方形和圆形的直线时，是否存在一个最优解？给定两个输入变量，`SVM`是一条直线；给定三个输入变量，支持向量是一个平面；当输入变量超过三个个时，支持向量是一个超平面。


    为了数学上的方便，二分类目标被定义为值 `+1` 和 `-1`，而不是逻辑回归中常用的 `1` 和 `0`。因为线性分割器等于 `0`，所以分类取决于点落在线的正侧还是负侧。换句话说，如果结果为正，则该案例属于其中一类；如果结果为负，则该案例属于另一类。


    这是一个作为开始的非常简单的线性问题。寻找线性分类问题的最佳解是一个优化问题。当问题不是线性可分时，`SVM` 会变得复杂。在图 5.1 中，将向量 `W`
    视为影响 `H` 斜率（能够正确分类观测值的最优直线）的机制。


    `H` 的公式如下所示。偏置参数 `b` 是衡量分割线离原点（或三维空间中的平面或高维空间的超平面）偏移量的。数量 `〈w, x〉` 是向量 `w` 和 `x`
    之间的点积。点积是一种相乘向量的方法，产生标量（即单个数字）作为答案。它是逐元素的相乘，然后对这些乘积求和。支持向量机算法选择 `w` 和 `b` 的值，以定义正确分类案例的最优直线。


    ```

    H = {〈w, x〉 + b = 0}

    ```


    `w` 和 `b` 的值是如何选择的？支持向量机试图找到最大化间隔的决策边界。间隔是直线 `H` 与离直线最近的形状之间的垂直距离。`SVM` 试图寻找在两类都被正确分类的条件下，间隔最大的超平面。


    这种最大化间隔的超平面的属性由支持向量（也称为载向量）描述。这些点是距离超平面最近的点，它们决定了超平面的位置。换句话说，它们决定了 `H` 的位置。因为超平面仅取决于数据点而非预测变量，所以维度诅咒被降到了。在图
    5.2 中，只有五个数据点是用于确定超平面位置的支持向量，基于参数 `w` 和 `b`。


    图 5.1：支持向量机训练中的线性分割


    ![image](img/f0065-01.jpg)


    图 5.2：支持向量机中的载向量


    ![image](img/f0066-01.jpg)


    在大多数现实场景中，数据不仅不是线性可分的，而且由超平面定义的分类器会犯太多错误，导致无法成为可行的解决方案。在这种情况下，一种解决方案是应用多项式变换，将输入数据投影到更高维度，然后在高维度中寻找最大间隔超平面。例如，数据在二维空间中可能不是线性可分的，但在三维或更多维度中是可分的。这可以推广到更高维。可能是考虑到特定的输入数据，无法找到一个线性分割类别的超平面，但当将输入数据设置为更高维度时，我们可以在更高维度找到一个分割输入数据的超平面。


    在更高维度中转换支持向量（如多项式）的点积计算可能极其耗费资源。为了缓解这一缺点，计算支持向量的算法使用核函数（例如二阶或三次的多项式核）来计算两个向量的点积，这的计算强度要小得多。使用多项式核函数代替使用计算密集型点积被称为“核技巧”。


    `SVM` 的优势之一是数据科学家不需要指定函数形式，或知道输入变量与目标之间关系的类型。由于没有函数形式，`SVM` 对输入空间中的异常值具有稳健性。当数据点在输入空间中可分时，它们也是非常有效的分类器。此外，`SVM`
    受维度诅咒的影响较小，因为与其他模型相比，它受预测变量数量的影响较小。超平面取决于数据点而非预测变量。


    `SVM` 的缺点之一是模型本身是一个黑箱，没有可解释的参数估计或规则和阈值。在解释结果方面，支持向量机与神经网络以及随机森林、提升等基于树的集成模型非常相似。在预测变量与目标之间的关系对于理解结果（尤其是解释结果）至重要的监管市场中，`SVM`
    的用处有限。正如之前在神经网络模型中提到的，代理模型（如回归或决策树）可以用于解释 `SVM` 的结果。然而，通过使用代理模型，数据科学家并不是在解释模型，而是从业务行动的角度来解释结果。某些监管机构可能不会接受这种方法。


    图 5.3：增加维度以找到线性分割类别的超平面


    ![image](img/f0067-01.jpg)


    用例：预付费用户的欺诈


    支持向量机适用于纯预测任务，例如欺诈检测。在这些情况下，不需要对模型结果进行完全解释，主要的兴趣在于分类结果或模型决策。这样的场景是电信公司创建了一项营销活动以促进新的手机业务。该活动向订阅者提供了预付费电话分钟，其拨打时长与从任何电话接收的分钟相同。

