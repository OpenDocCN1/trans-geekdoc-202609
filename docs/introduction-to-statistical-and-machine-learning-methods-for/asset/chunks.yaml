    ## 第 7 章：无监督模型——半结构化数据


    ### 章节概述


    在本章中，我们将继续学习无监督模型，即没有目标值的模型。这种类型的模型旨在更好地理解数据中的模式并对其产生见解。它被用于突出客户行为、交易模式或关系模式，以及项目之间的关联性。它经常应用于结构化数据（如交易数据）和非结构化数据（如文本数据）。


    在本章中，我们将专门学习关联规则分析，这是一种被应用于购物篮分析应用的方法。我们还将学习路径分析，这是一种理解在时间轴上沿步骤或步骤序列发生的事件的方法；以及链路分析，这是一种理解在不考虑时间轴的情况下，事件之间如何相互关联的方法。最后，我们将学习文本分析，这是一种分析文本并从中提取见解和知识的技术。


    本章的主要目标如下：


    * 解释并应用关联规则分析以创建购物篮分析。

    * 解释并应用路径分析以从时间轴的角度解决业务问题。

    * 解释并应用链路分析以解决事件可能相互关联的业务问题。

    * 解释并应用文本挖掘模型以解决可用非结构化文本数据的业务问题。

    * 描述如关联规则之类的无监督模型。

    * 解释各种无监督模型的结果。


    ### 关联规则分析


    关联规则分析是一种发现数据集中共同发生的事件、元素或项目的方法。如果可用时间戳信息，则关联规则分析将转变为序列关联分析，其中事件发生的顺序是相关的。关联规则分析或序列关联规则分析旨在寻找数据库项目之间有趣的关系。这些关系被描述为蕴含规则或暗示其他项目的项目。例如，在超市的销售点系统中，关联规则分析可能会发现一个蕴含规则如
    `{wine, cheese => bread}`。该规则意味着客户同时购买葡萄酒、奶士和面包，或者更具体地说，如果客户购买了葡萄酒和奶士，他们也会购买面包。由于关联规则分析方法没有考虑时间，发现的规则是对称的，这意味着葡萄酒和奶士暗示面包，而面包也暗示葡萄酒和奶士。数据科学家需要分析所有这些规则，以识别出最适合用于提高销售额的规则。有一些统计指标可以评估规则的重要性，数据科学家应该结合业务知识来使用它们。


    #### 购物篮分析


    关联规则分析经常被应用于分配购物篮分析的项目中。购物篮分析用于分析交易数据流，寻找出现频率比预期更高的项目组合。数据科学家可以此作为一种技术来识别所购项目的有趣组合，并使用这些规则来提高销售额。同一规则中的项目更有可能被一起购买，并且可以在活动期间优惠提供，或在超市中放在一起。


    购物篮分析应用于许多行业以解决多个业务问题。某些项目组合可能非常直观。例如，购买面包的客户也会购买黄油。某些规则可能没那么直观，但会被用于提高销售额。例如，购买移动设备数据包的客户也会消费点播流媒体内容。


    序列分析是关联规则分析的扩展，当交易数据中有时间维度时适用。通过这种方式，检查交易数据是否存在出现频率比预期更高的项目序列。在序列分析中，事件的顺序非常重要。客户在特定时间范围内购买的项目序列就是一个例子。序列规则中的项目是按顺序购买的，可以在销售活动期间一起提供或按特定顺序提供。序列分析还可以揭示时间轴上发生的交易问题。例如，欺诈者在网络攻击中执行的步骤，或用户在浏览网站时遇到的问题。下一节将详细讨论序列分析。


    #### 置信度和支持度度量


    在最简单的关联规则分析场景中，数据由两个变量组成：交易和项目。对于每笔交易都有一个项目列表。通常，交易是单次客户购买，项目是被购买的东西。关联规则是形式为
    `(项目集 A) => (项目集 B)` 的陈述。换，关联规则是一种说明当 A 发生时，B 以特定概率发生的模式。


    关联分析的目标是确定一组项目之间所有关联规则的强度。关联的强度通过规则的支持度和置信度来衡量。规则 `A =>B` 的支持度是两个项目共同发生的概率。规则
    `A => B` 的支持度通过以下公式估计：


    $\frac{transactions\ containing\ A\ and\ B}{all\ transactions}$


