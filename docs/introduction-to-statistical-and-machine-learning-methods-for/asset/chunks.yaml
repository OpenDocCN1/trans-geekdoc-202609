  trans: '

    如果案例被预测为正性 (1)且观测为正性 (1)，则该案例为真阳性 (TP)。如果案例被预测为正性 (1)且观测为负性 (0)，则该案例为假阳性 (FP)。如果案例被预测为负性
    (0)且观测为正性 (1)，则该案例为假阴性 (FN)。最后，如果案例被预测为负性 (0)且观测为负性 (0)，则该案例为真阴性 (TN)。


    所有案例都根据预测概率的阈值分配到类别中。步骤包括：


    1. 估计每个案例属于类别 `1` 的预测概率。

    2. 选择阈值概率（通常是样本中的比例）。

    3. 如果预测概率超过阈值，将案例分配给类别 `1`；否则，将案例分配给类别 `0`。


    根据决策（预测概率阈值），分类表中简单的统计量是准确率。准确率可以通过以下公式计算：


    $ACC = \frac{TP + TN}{TP + FP + FN + TN}$


    错误率（也称为分类率）是准确率的补数：


    $ERR = 1 - ACC = \frac{FP + FN}{TP + FP + TN}$


    不同的阈值会产生不同的决策分配以及不同的分类表值。根据事件的分布，增加阈值可能会增加准确率或减少错误率。阈值的通用建议是事件在数据集中的比例。这一信息在分类稀有事件时极其敏感。例如，假设一名数据科学家正在训练一个检测欺诈的模型。在大多数情况下，欺诈是一种稀有事件。假设在这个案例中，欺诈占所有交易的
    `1%`。如果最终模型说没有欺诈（即将所有案例预测为非欺诈），则模型在 `99%` 的案例上是正确的，整体准确率将为 `99%`。具有 `1%`分类错误的模型性能可以认为是良好的。然而，公司将漏掉所有的欺诈案例。


    因此，有两个特殊指标来评估监督分类模型的性能。第一个是灵敏度，也称为召回率或真阳性率，可以通过以下公式计算：


    $Sensitivity = Recall = TPR = \frac{TP}{TP + FN}$


    第二个特殊指标是特异性，也称为选择率或真阴性率。特异性是预测为非事件响应的非事件比例。它可以根据以下公式计算为灵敏度的补数：


    $Specificity = Selectivity = TNR = \frac{TN}{N} = \frac{TN}{TN + FP}$


    问题的背景决定了数据科学家应该主要关注这些指标中的哪一个。例如，在留存活动中，数据科学家应该关注假阴性率 (`FNR` 或 `FN/TP`）。假阴性案例 (`FN`)
    代表在留存活动期间未联系而流的客户数量。假阳性案例 (`FP`) 不是最糟糕的情况。公司联系了不会流失的客户，他们最终会收到留激励。这可以作为营销或关系活动。然而，在留存活动中因未识别识别为流失者而失去客户是不好的。


    另一方面，在欺诈检测应用中，数据科学家应该更关注假阳性率 (`FPR`）。假阳性案例 (`FP`) 是我们误识别为可能的欺诈者的良好客户数量。当然，假阴性案例
    (`FN`) 也是糟糕的。它们代表模型未识别出的可能的欺诈者。这些欺诈者不会被识别为对公司实施欺诈行为。然而，假阳性案例可能代表良好客户被误封或服务被取消。从公司形象、良好客户起诉公司或影响客户传播关于公司服务的负面信息来看，假阳性案例的负面影响可能比欺诈本身更高。


    ## ROC 曲线


    评估分类模型性能的另一种常用方法是接收者工作特征（ROC）曲线。ROC 曲线是一种图形化显示，提供了对具有二分类响应的监督分类模型预测准确性的衡量。ROC
    曲线显示了灵敏度（真阳性率）与 1-特异性（假阳性率）的关系。ROC 曲线根据一系列不同的阈值显示这种关系。


    极值 `(0,0)` 和 `(1,1)` 分别代表 `1.0` 和 `0.0` 的阈值。如果数据科学家使用所有预测概率为 `1` 的观测值都分类为事件的规则，则没有事件观测被正确分类，但所有的非事件观测都被正确分类（灵敏度=0，特异性=1）。如果数据科学家使用所有预测概率为
    `0` 或更高的观测值都分类为事件的规则，则所有事件都被正确分类，但没有非事件被正确分类（灵敏度=1，特异性=0）。横轴是假阳性率，即 `1-特异性`，因此
    ROC 曲线从点 `(0,0)` 开始；纵轴是真阳性率，即灵敏度，因此 ROC 曲线在点 `(1,1)` 结束。


    对于预测准确率高的监督分类模型，ROC 曲线迅速上升（灵敏度迅速增加，特异性保持在 1）。在这种情况下，曲线下的面积较大。相比之下，预测准确率低的监督分类模型的
    ROC 曲线上升缓慢，曲线下的面积较小。曲线下的面积不像分类率和准确率那样受阈值的影响。


    以 `45°` 角上升的 ROC 曲线是一个糟糕的模型。它代表了案例到类别的随机分配，是基准模型的 ROC 曲线。


    图 9.6: ROC 曲线


    ![image](img/f0143-01.jpg)

