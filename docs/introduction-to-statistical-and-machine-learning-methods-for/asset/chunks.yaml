    # Chapter 2: Data Exploration and Preparation


    ## Chapter Overview

    This chapter introduces the main concepts of data exploration, shows how data
    exploration is a key stage for any data science project, and shows how it can
    address many business issues as a result of reviewing and exploring the information
    needed to solve a business problem. In addition to data exploration, this chapter
    introduces the many tasks associated with data preparation, particularly focusing
    on pre-steps for analytical modeling. During the data preparation process, many
    data issues can arise. You might need to fix data quality issues, transform the
    raw information, and impute and replace original values to fit analytical models.
    This is an essential step in any data science project.


    This chapter also introduces concepts about merging data from different sources
    to create a more comprehensive view about the business problems, considering customer
    behavior, product and service transactions, marketing scenarios, profiles, and
    so on. Usually, different information resides in multiple systems, and merging
    and matching them together is a great challenge in data preparation. You will
    also learn how these tasks can substantially improve results.


    The main goals of this chapter are:

    * Explain how to review data sets to determine whether the information needed
    to address the business problem is included and properly formatted to be used
    in analytical models to solve the problem.

    * Explain how to perform distribution and cardinality analyses to determine how
    the data is presented and what needs to be done to correct the data for data science
    projects and analytical models.

    * Explain how to handle non-linearities, sparseness, and outliers in the data
    used to train analytical models to solve business problems.

    * Explain how to prepare and use unstructured data to improve analytical models
    in solving business problems. Unstructured data can be used directly in solving
    the business problems or can be used as new features in analytical models when
    solving business problems.

    * Explain different methods of sampling data. Describe when each method of sampling
    is required and the benefits to the analytical modeling stage.

    * Explain the method of partitioning data, the distinct types of partitioning,
    and the reason for partitioning data to generalize analytical models for production.

    * Explain how to transform the original input data to improve the results in analytical
    modeling.

    * Explain how to create new features from the original input data to improve the
    results in analytical modeling.

    * Explain how to select a model that generalizes well to new data.


    ## Introduction to Data Exploration

    One of the first steps in the analytical modeling process is data exploration.
    This step is where data scientists get to know the data that they will use to
    solve any business problem. There are many tasks that data scientists go through
    not just to understand the data that describes the business problem that they
    are trying to solve, but also to prepare that data to solve those problems in
    terms of analytical models.


    Tasks associated with data exploration include managing the following:

    * Nonlinearity

    * High cardinality

    * Unstructured data

    * Sparse data

    * Outliers

    * Mis-scaled input variables


    ### Nonlinearity

    Data exploration can illustrate nonlinear associations between the predictor variable
    and the outcome. An example of a nonlinear association is a quadratic relationship
    between the predictor variable and the outcome. In this situation, the data scientists
    must modify the model to consider the quadratic relationship.


    Nonlinearity demands that data scientists explore different models to account
    for the complex relationships between the predictor variables and the target.
    Universal approximator models such as tree-based models and neural networks can
    be used here.


    ### High Cardinality

    Some variables might have high cardinality where categorical variables have numerous
    levels. Variables such as ZIP codes or product codes might have high cardinality.
    The high cardinality can be very problematic in analytical models like regression
    or neural networks because for each level it creates a parameter.


    Suppose you are trying to find a linear association between salary (the target)
    and years of experience. You have two parameters, an intercept parameter, and
    the parameter for years of experience. If age is added, you now have three parameters.
    However, if educational background is added (less than high school, high school
    degree, and so on) you might add parameters.


    ### Unstructured Data

    Using unstructured data such as textual data, network data, images, audio, and
    video might help explain the business problem or simply hold a greater predictive
    power in relation to the outcome data scientists are modeling. For example, in
    a churn analysis, examining call center data and identifying unhappy customers
    might lead to good predictors for churn. This data is usually in textual format
    or audio format. How customers relate to each other and how products and services
    are related to the customers can hold a great predictive value because they describe
    consuming and usage behavior and its correlation to some specific business events,
    such as churn, fraud, or purchase. These types of data should be prepared and
    used in analytical models either to solve the business problems directly or to
    add new features for improving model performance and interpretability.


    ### Sparse Data

    Data scientists also encounter sparse data where there are very few events in
    the data and most of the occurrences are missing or incomplete. An example is
    a rating system for an online retail company. Not all customers who purchase a
    company’s products rate the product. Conversely, not all products are rated by
    the customers. When combining all products and all customer ratings, the matrix
    generated is very sparse. It creates a serious problem for most models in capturing
    the relationship between the inputs and the target. One problem is that there
    is not enough data to estimate the interactions between the customers and the
    products.


    There is a model tailored for this type of problem. Factorization machine models
    circumvent the problem of sparse matrices by using matrix factorization. This
    technique is usually effective because it enables the data scientist to discover
    the latent features underlying the interactions between customers and products.
    Therefore, factorization machine models can predict customer ratings on products
    even when 99% of the cells in the matrix are empty.


