    29 位属于同一运营商（即同一家公司——而非竞争对手）。一旦他们决定离开，其他同伴也会随之决定离开。平均而言，这些客户中的每一个都能影响其 0.87% 的同伴。另一方面，影响力型客户平均连接到
    55 位其他订阅者，其中 45 位属于同一运营商。平均而言，这些影响力型客户中的每一个都能影响其关系中的 5.94%。当他们决定流失时，这种影响力大约是普通客户的七倍。这些数据将向公司展示出优先接触影响力型客户或采取更具攻性的留存营销活动的重要性。


