    ## Network Optimization


    Another type of analysis of network or graph structure is network optimization.
    Network optimization considers a set of optimization techniques used to evaluate
    graph structures, identify subgraphs, evaluate network performance, and search
    for optimal solutions in network topologies. For example, data scientists can
    use network optimization to study the traffic flows within geographic areas. In
    such studies, the nodes are the geographic locations, and the links are the people
    traveling between these locations. The weight of the locations could be the population,
    and the weight of the link could be number of people traveling. This information
    can be truly relevant in helping government agencies plan public transportation
    systems, road networks, and emergency evacuation plans, among many other applications.
    Health agencies can also use this set of techniques to study the vectors of infectious
    diseases. Communications and utility companies can use these graph data and algorithms
    to better plan their physical distribution networks and forecast the usage. Financial
    institutions can use network optimization to fight against money laundering, and
    governments can use it to understand the major mechanisms of corruption. There
    is an endless number of applications that can be deployed by using network analysis
    and network optimization. The important concept of network science is that everything
    is connected and somehow can be elaborated as a network problem.


    ## Network Algorithms


    Network optimization considers graph theory and optimization algorithms that can
    augment and generalize mathematical optimization approaches. Many practical applications
    of optimization depend on an underlying network. For example, retailers face the
    problem of shipping goods from warehouses to stores in a distribution network
    to satisfy demand at minimum cost. Commuters choose routes in a road network to
    travel from home to work in the shortest amount of time or traveling the smallest
    distance. Financial institutions search for sequences and paths that can be associated
    with illicit transactions.


    ## Figure 8.5: Network Optimization: Traveling Salesman Problem – Optimal Tour


    ![image](Images/f0128-01.jpg)


    The following network algorithms aim to identify subgraphs within the entire network
    or the best way to perform some activity considering the network structure.


    ### Clique


    A clique is a subgraph that is a complete graph. Every node in a clique is connected
    to every other node in that clique. It is a sequence of nodes such that, from
    each of the nodes within the graph, there is a link to the next node in the sequence.
    Finding cliques in graphs has applications in many industries such as bioinformatics,
    social networks, electrical engineering, and chemistry. A trivial example of a
    clique within a network is a group of nodes that are connected to each other.
    For example, subscriber A is connected to B, C, and D. Subscriber B is also connected
    to C and D, and subscribers C and D are connected. Links in a clique would be
    like this: `A−B`, `A−C`, `A−D`, `B−C`, `B−D`, `C−D`. Cliques can be quite useful
    in finding some groups of interest within a network.


    ### Cycle


    A path in a graph is a sequence of nodes such that, from each of the nodes within
    the graph, there is a link to the next node in the sequence. A cycle is a path
    in which the start node is the same as the end node. The method is aimed at directed
    graphs. For undirected graphs, each link represents two directed links. A trivial
    cycle is `A→B→C→A`.


    ### Linear Assignment


    A linear assignment problem is a fundamental problem in combinatorial optimization
    that involves assigning workers to tasks at minimal costs. In graph theory, the
    linear assignment is like finding minimum weight matching in a weighted bipartite
    graph. A bipartite graph is a graph where nodes can be divided into two disjointed
    sets `S` and `T` (workers and tasks) such that every link connects a node in `S`
    to a node in `T`. For example, a relay swimming team has 4 swimmers with respective
    best times for the different styles: butterfly, breaststroke, backstroke, and
    freestyle. Forming the best team is not just a matter of getting the fastest swimmer
    in each style, but to combine the swimmers to minimize the overall time.


    ### Minimum-cost Network


    Minimum-cost network flow is a fundamental problem in network analysis that involves
    sending flow over a network at minimal cost. Minimal cost here is the objective
    function. The objective function can also be a minimal time or a maximal quantity.
    It depends on the problem data scientists are studying. The network is created
    based on the links or connecting nodes. Nodes can be, for example, warehouses
    and stores. Links can be roads. Each link in the network has an associated cost.
    It can also have an associated minimum and a maximum capacity.


    For example, to flow products between warehouses and stores, some roads might
    have a maximum capacity of goods to be transported. Some roads might have a toll,
    which represent the cost. If transporting through a third-party company, a minimum
    number of trips might be required. The stores have demands and the warehouses
    have supply capacities. The decision variables define the amount of flow to be
    sent between the nodes or the products to be transported between the warehouses
    and the stores. This problem can be modeled as a linear problem, and the goal
    is to optimize the number of goods to be flowed at the minimum cost.


    ### Minimum Spanning Tree


    The minimum spanning tree problem is aimed at identifying the minimum number of
    nodes that connect the entire network. Consider a general network. This network
    has multiple nodes and links. There is a reachability assigned to this network
    considering all the connections between the nodes through the available links.
    The minimum spanning algorithm aims to find the minimum set of links that keep
    the same reachability of the original network. In other words, this minimum set
    of links allows the origin nodes to reach the same destination nodes by using
    this small new set of connections. A single graph can have many different spanning
    trees.

