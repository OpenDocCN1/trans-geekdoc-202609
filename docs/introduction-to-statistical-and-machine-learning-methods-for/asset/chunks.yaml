    Estimates of the unknown parameters β0 and β1 are obtained interactively by the
    method of ordinary least squares. This method provides the estimates by determining
    the line that minimizes the sum of the squared vertical distances between the
    observations and the fitted line. In other words, the fitted or regression line
    is as close as possible to all the data points.


    In a linear regression, the estimation for the target variable is formed from
    a simple linear combination of the inputs. The intercept is the average value
    of the target when the predictor values are zero, and the remaining parameter
    estimates determine the slope between each input and the target. The prediction
    estimates can be viewed as a linear approximation to the expected value of a target
    conditioned on observed input values.


    One of the greatest strengths of the linear regression model is its simplicity,
    for both implementing and interpreting. Linear regression is quite simple to implement
    since it is only a linear equation. The coefficients from the model are easily
    interpretable as the effect on the target given a one-unit increase in the predictor
    variable controlling for the other predictor variables. In most cases, the results
    of the model can be obtained quickly, and new observations can be scored quickly.
    In other words, predictions on new cases can be easily obtained by plugging in
    the new values of the predictor variables.


    The drawbacks of the linear regression model are the models are limited to normally
    distributed residuals, which are the observed values minus the predicted values.
    If the residuals show a non-normal distribution such as a skewed distribution,
    then a generalized linear regression model might be helpful.


    Another drawback is that a high degree of collinearity among the predictors can
    cause model instability. The instability of the coefficients might not lead to
    a simple model that identifies the predictor variables that are the best predictors
    of the target. Therefore, data scientists should reduce redundancy first if they
    want to use linear regression models.


    If there are non-linear relationships between the predictor variables and the
    target, data scientists will have to add higher order terms to properly model
    these relationships or perform variable transformations. Finding the appropriate
    higher order terms or variable transformations can be time-consuming and cumbersome.


    Finally, linear regression models can be affected by outliers that can change
    the model results and lead to poor predictive performance.


    Use Case: Customer Value


    An example of a business problem that can be addressed using linear regression
    is predicting the amount of earned revenue by customer. The results of the model
    can drive sales campaigns to push customers with low earned revenue but a high
    predicted level of spending. On the other hand, the model can indicate customers
    who are close to the possible maximal earned revenue and then they can be removed
    from non-critical sales campaigns, avoiding eventual attrition to them. There
    is no reason to add to some sales campaign customers who have reached the possible
    maximal earned revenue. By removing them from the non-critical campaigns, the
    company can reduce the operational cost to contact those customers and can also
    avoid inundating good customers with unnecessary marketing advertisements.


    The input variables or predictors in the data are:


    *   Demographic information about the customers


    *   Product usage information such as frequency, recency, number of products,
    value per product, total value, revenue by product, total revenue, amount of usage
    per product, and total usage


    *   Payment type, day, frequency of payment, amount paid, and so on


    *   Payment delay information


    *   Other products, bundles and services consumed (not in the campaign)


    *   Aging of the customer in the company/product/service


    *   Others


    The target variable is:


    *   Maximal earned revenue by customer


    Logistic Regression


    Logistic regressions are closely related to linear regressions. In logistic regression,
    the expected value of the target is transformed by a link function to restrict
    its value to the unit interval. In this way, model predictions can be viewed as
    primary outcome probabilities between 0 and 1. A linear combination of the inputs
    generates a logit score, or the log of the odds of the primary outcome, in contrast
    to linear regression, which estimates the value of the target. The range of logit
    scores is from negative infinity to positive infinity. For binary prediction,
    any monotonic function that maps the unit interval to the real number line can
    be considered as a link. The logit link function is one of the most common. Its
    popularity is due, in part, to the interpretability of the model.


    For example, if you want to use logistic regression for classification of a binary
    target, you would want to restrict the range of the output to be between 0 and
    1. The logit link function transforms the continuous logit scores into probabilities
    between 0 and 1. The continuous logit scores, or the logit of p̂, is given by
    the log of the odds, which is the log of the probability of the event divided
    by the probability of the non-event. This logit transformation transforms the
    probability scale to the real line of negative infinity to positive infinity.
    Therefore, the logit can be modeled with a linear combination since linear combinations
    can take on any value.


    The logistic model is particularly easy to interpret because each predictor variable
    affects the logit linearly. The coefficients are the slopes. Exponentiating each
    parameter estimate gives the odds ratios, which compares the odds of the event
    in one group to the odds of the event in another group.


    The odds ratio shows the strength of the association between the predictor variable
    and the target variable. If the odds ratio is 1, then there is no association
    between the predictor variable and the target. If the odds ratio is greater than
    1, then the group in the numerator has higher odds of having the event. If the
    odds ratio is between 0 and 1, then the group in the denominator has higher odds
    of having the event. For example, an odds ratio of 3 indicates that the odds of
    getting the event for the group in the numerator are three times that for the
    group in the denominator. The group in the numerator and denominator is based
    on the coding of the input variable. For example, if the parameter estimate for
    the input variable age is 0.97, then the exponent is 2.66. That means, for a one
    unit increase in age, the odds are increased by 166% ((2.66 - 1)\*100).'
