    The reward of data science work comes when the data are organized, cleaned, and
    arranged for analysis. That first batch of visualizations, the feature engineering,
    the modeling—that is what makes data science such rewarding work. More than almost
    any other career, data scientists get to ask question after question, the answers
    leading to subsequent questions. From one day to another, your work can be completely
    different. You don’t get to tell the data what to say—the data will speak to you,
    if you have the tools and curiosity to listen.


    This book (and its accompanying course) provide a framework for doing project
    work, the analytics lifecycle. The analytics lifecycle acknowledges and addresses
    all members of the data science team—IT, computer engineers, statisticians, and
    executive stakeholders—and makes clear how the work and responsibilities are divided
    through the entire lifecycle of a data science project. The emphasis of this book
    is on making sense—of data, of models, and of results from deployed models. You
    might say that the ideal audience for this book is a Citizen Data Scientist (to
    use Gartner’s term) or a statistical business analyst. This is not a book that
    teaches about writing scripts to pull hourly data, or how to stand up a virtual
    machine on a cloud hosting provider, or how to containerize your apps. This book
    alone will not turn you into a world-class data scientist. What it does, however,
    is take the loose ends of data science and organize them in a way that your project
    is manageable, and your results are explainable. And that, friends, is the core
    of any effective data and analytics professional.


    Catherine Truxillo, PhD

    Director, Advanced Analytics Education

    SAS

    February 2021


    # Chapter 1: Introduction to Data Science


    ## Chapter Overview


    This chapter introduces the main concepts of data science, a scientific field
    involving computer science, mathematics, statistics, domain knowledge, and communication.
    These are the main goals of this chapter:


    *   Explain the most important tasks and roles associated with the data science
    field.

    *   Explain how to apply data science to solve problems and improve business operations.

    *   Describe data science as a combination of different disciplines, such as computer
    science, mathematics and statistics, domain knowledge, and communications.

    *   Describe the skills related to mathematics and statistics and the role that
    they play in solving business problems through analytical modeling.

    *   Describe the skills related to computer science and the role that they play
    in solving business problems by supporting analytical models to be trained and
    deployed effectively.

    *   Describe the skills related to domain knowledge and the role that they play
    in solving business problems by adding value to data, models, and tactical and
    operational actions.

    *   Describe the skills related to communication and visualization and the role
    that they play in solving business problems by describing and explaining the solutions,
    model outcomes, and possible operational actions.


    ## Data Science


    Data science is not a single discipline. It comprises a series of different fields
    of expertise and skills, combining them to solve problems and to improve and optimize
    processes. Among several skills needed, the most important are mathematics and
    statistics, computer science, and domain knowledge.


    Data scientists need mathematics and statistics to understand the data generated
    in the business scenario, to model this data to gain insights, or to classify
    or estimate future events. Mathematics and statistics are also needed to evaluate
    the models developed and assess how they fit to the problem and how they can be
    used to solve or improve a specific process.


    The infographic in `[Figure 1.1](#Chapter01.xhtml#ch01fig1)` refers to three main
    areas: mathematics and statistics, computer science, and domain knowledge. In
    the next sections, we will discuss these areas more in depth as well as other
    important areas such as communication, visualization, and hard and soft skills.


    ### Figure 1.1: Expertise Areas in Data Science


    ![image](Images/f0002-01.jpg)


    The intersection of each of the three main areas is also very important. Machine
    learning is the field intersecting mathematics, statistics, and computer science.
    Machine learning is a branch of artificial intelligence based on the idea that
    systems can learn from data, identify patterns, recognize behaviors, and make
    decisions with minimal human intervention. It is a method of data analysis that
    automates data preparation, feature engineering, model training, and eventually
    model deployment. Machine learning allows data scientists to implement very complex
    models, such as neural networks or support vector machines, and an ensemble of
    simple models like decision trees, gradient boosting, and random forests. These
    complex models can capture very unusual relationships between the inputs (independent
    variables) and the target (dependent variable).


    The intersection of mathematics, statistics, and domain knowledge is the research
    field. Research skills enable data scientists to apply new techniques in model
    building. This combination allows the development of very complex models that
    are more accurate and less dependent on the functional form. Research skills can
    speed up the development process especially when fewer assumptions are needed
    about the distribution of the target and the relationship of independent and dependent
    variables.


    Software skills in data science usually refer to the intersection of computer
    science and domain knowledge. Software skills such as familiarity of open-source
    languages and other world-class software languages help data scientists create
    new models. The combination of computer science skills, software skills, and domain
    knowledge can help data scientists solve the business problem or improve a specific
    business process.


    ## Mathematics and Statistics


    Data scientists need to have strong mathematics and statistics skills to understand
    the data available, prepare the data needed to train a model, deploy multiple
    approaches in training and validating the analytical model, assess the model’s
    results, and finally explain and interpret the model’s outcomes. For example,
    data scientists need to understand the problem, explain the variability of the
    target, and conduct controlled tests to evaluate the effect of the values of parameters
    on the variation of the target values.


    Data scientists need mathematics and statistical skills to summarize data to describe
    past events (known as descriptive statistics). These skills are needed to take
    the results of a sample and generalize them to a larger population (known as inferential
    statistics). Data scientists also need these skills to fit models where the response
    variable is known, and based on that, train a model to classify, predict, or estimate
    future outcomes (known as supervised modeling). These predictive modeling skills
    are some of the most widely used skills in data science.


    Mathematics and statistics are needed when the business conditions don’t require
    a specific event, and there is no past behavior to drive the training of a supervised
    model. The learning process is based on discovering previously unknown patterns
    in the data set (known as unsupervised modeling). There is no target variable
    and the main goal is to raise some insights to help companies understand customers
    and business scenarios.

