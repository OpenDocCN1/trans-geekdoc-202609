    When data scientists compare the model’s performance with the random event, they
    can observe how well the models perform. For example, in [Figure 9.8](#Chapter09.xhtml#ch09fig8),
    ranking the population based on the predicted probability of the event, or in
    our case here, to purchase the product offered during the sales campaign, we can
    observe that at the top 5% of the population, the response rate reaches 21%. A
    simple comparison in terms of model performance would be like this: if there is
    no model, a sales campaign would randomly select 5% of the population to offer
    a specific product. This 5% of the population could be based on a limited budget
    to run the campaign. Based on the average response rate for this campaign, the
    company could expect a response rate at 5%. In other words, just 5% of the customers
    contacted would purchase the product offered. By using the supervised classification
    model and contacting only 5% of the total population, the same campaign would
    target the top 5% of the customers in terms of the predicted probability, or the
    customers more likely to purchase that product. By using the model, the company
    would observe a response rate of 21%, or 21% of the customers contacted with the
    offer would purchase the product.


    The data scientist could show that the model is four times better than the random
    event. In other words, the supervised classification model could increase the
    response rate for this sales campaign by four times.


    Figure 9.7: Percentage Cumulative Hits – Random Events


    ![image](Images/f0144-01.jpg)


    Figure 9.8: Percentage Cumulative Hits - Model versus Random Events


    ![image](Images/f0145-01.jpg)


    ### Lift Chart


    The lift is calculated as the positive predicted value over the overall response
    rate. So, for a given depth, there are more responders targeted by the model than
    by random chance. The graph shows that at the fifth percentile the lift is 4.2
    (21% of responders by using the model divided by the 5% of responders by not using
    the model) (random event).


    Figure 9.9: Lift Chart


    ![image](Images/f0145-02.jpg)


    Lift charts are widely used in database marketing to decide how deep in a customer
    population the company should go for a campaign. The simplest way to construct
    a lift curve is to sort and bin the predicted posterior probabilities. The lift
    chart can be augmented with revenue and cost information.


    The lift chart can also be used to evaluate and select the model to be deployed
    in supporting a specific campaign. For example, if a company has a limited budget
    for a sales campaign and can contact only 20% of the total population, then the
    data scientist can select the model that performs best for the top 20% of the
    population based on the predicted probability for the target (purchase the product)
    instead of selecting the model that performs best considering the entire population.


    ### Model Evaluation


    Data scientists are recommended to try multiple models and consider different
    methods and distinct algorithms. All the techniques are data-dependent, and trying
    different techniques, multiple modeling approaches, and data preparation approaches
    are always helpful. Depending on the data variability and the relationship between
    the input variables and the target, a regression might fit better than a neural
    network. Often, if the relationship between the inputs and the target is simple,
    a regression model, a decision tree, and a support vector machine can fit properly
    and end up as the best model. In these cases, there is no reason to have a complex
    model like a neural network or an ensemble model like a forest or gradient boosting
    model if a simple and interpretable model like a regression model and a decision
    tree can be used. However, when the relationship between the inputs and the target
    is complex, more complex models like neural network and ensemble of trees usually
    fit better. The drawback is the lack of interpretability.


    ### Performance


    Data scientists always evaluate the models to select and to put in production
    according to multiple dimensions. The first dimension is performance. Performance
    can be measured by using different fit statistics, and it relies on the type of
    the target. The target might be a class, which implies a decision, a ranking,
    or an estimation. Each one of these types of targets can be evaluated by different
    fit statistics.


    Data scientists can work with the business department to understand what fit statistics
    are most relevant to the business. For example, the most important fit statistic
    might be the overall accuracy. In that case, the data scientist can select the
    model with the minimum misclassification error. The business event can be extremely
    sensitive, like fraud, and the false-positive can represent a huge risk for the
    business. The data scientist can then evaluate the best model based on the minimum
    false-positive rate. Some other business events like churn might be impacted by
    the false-negative rate, which misses the customers who are likely to make churn.
    Finally, the model can be evaluated by looking at the accuracy on a specific percentile
    of the population. A marketing campaign might be targeting only a small percentage
    of the population. The data scientist can evaluate the champion model based on
    the performance of the models just on the top percentile associated with the campaign.


    ### Time to Train Model


    The second dimension that a data scientist can use to evaluate models is time
    to train the model. For example, in fraud, the model might drift early and should
    be trained – or retrained – quite often. Based on that, the time to train the
    model is crucial. In credit risk, the model needs to score in real time when the
    customer applies for a loan. In some projects, the scoring should be embedded
    in the transactional system. The model should be converted into a set of rules
    or into an equation. Models like decision tree and regression are good candidates
    for this type of translation. Sometimes the model scoring is consumed by another
    application as an application programming interface (`API). The model selected
    as a champion should provide this type of access. All these types of evaluation
    go far beyond just the accuracy of the models.


    ### Interpretability


    Interpretability is also a crucial measure for some business events. Particularly
    in credit scoring, the company might be requested to provide an explanation about
    the models results, such as the reason a customer had a loan denied. For these
    cases, interpretability is an essential measure to evaluate the champion model
    that will be put into production.


    ### Generalizability


    Generalization is also very important to evaluate the models that are going to
    be deployed. Based on that, the candidate models can be assessed based on an honest
    test, an out-of-time data set. Sometimes the data scientist needs to evaluate
    the best model based on a combination of some of the characteristics listed above.


    ### Model Deployment


    The analytical life cycle comprises the model development (including the training
    of multiple and different models), the model comparison (considering the evaluation
    of different models based on the business needs), the model selection (taking
    into account the business requirements – speed, interpretation, etc.) and the
    model deployment (considering how the model needs to be put in production – batch,
    real time, `API`, etc.).


    Figure 9.10: Analytical Modeling Life Cycle


    ![image](Images/f0147-01.jpg)


    ### Challenger Models

