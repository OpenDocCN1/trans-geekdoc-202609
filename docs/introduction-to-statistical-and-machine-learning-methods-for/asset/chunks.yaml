  trans: '

    每一个参与最短路径的节点都在某种程度上控制着网络内部的信息流。通过的最短路径越多，对信息流的控制力就越大。这类节点在网络中充当守门人。中介中心性（Betweenness
    centrality）计算节点参与最短路径的数量，因此决定了它能多程度上控制信息流。社交网络中的约束通常是关系的强度。因此，这是一个极大化问题。链接权重之和越高越好。因此，中介中心性越高，节点对网络内部信息流的控制越强。


    ## 接近性


    接近性（Closeness centrality）考虑节点到网络（或子网络）中其他节点的平均最短路径。最短路径的概念与中介中心性的描述相同。如果一个节点到网络（或其子网络）中所有其他节点的平均最短路径值较小，意味着该节点接近所有其他节点。与中介中心性类似，约束是链接权重，这是一个极大化问题。连接越强越好。这种计算可以理解为最长路径，因为这里的相关性是基于关系的强度。基于此，接近性越高，节点与其网络中其他节点就越近。


    接近性的业务概念被分配为节点在整个网络传播某些信息的速度。它就像是一个八卦传播。具有高接近中心性的节点比其他节点更快地在整个网络中传播消息。这些信息可以用于目标客户以传播新产品信息。他们将在产品采纳活动中成为目标对象。就像度中心性需要入度和出度标记来指示有向网络中的入连接和出连接一样，当网络是有向的时，这些标记也用于接近中心性的衡量。因此，对于有向网络，我们计算
    `closeness-in` 和 `closeness-out`。整体接近性是 `closeness-in` 和 `closeness-out` 的总和。


    ## 中枢与权威


    中枢和权威中心性（Hub and authority centrality）最初用于对网页进行排名。如果某些网页指向许多重要网页，那么它们就是重要的，这些网页被称为中枢（hubs）。其他网页因为被许多重要网页指向而也是重要的，这些网页被称为权威（author）。同样的概念可以扩展到任何类型的网络，通过与其他重要节点之间的出站或入站连接数量来排名或衡量节点的重要性。由于入站和出站连接的区别，中枢和权威仅针对有向网络计算。一个良好的中枢节点是指向许多良好权威节点的节点，一个良好的权威节点是被许多良好中枢节点指向的节点。


    这个概念在应用于合著网络时很容易理解。一篇引用了许多良好权威论文的论文具有较高的中枢得分（hub score），而被许多其他高影响力论文引用的论文具有较高的权威得分（authority
    score）。我们也可以将权威得分视为某些主题领域的专家。许多人咨询他们并参考他们。正如我们所说的，他们就是权威。当我们考虑到机场时，中枢得分的概念也容易理解。美国达美航空的中枢是亚特兰大。大多数飞往国际或长途目的地的航班都是从亚特兰大出发的。


    ## 特征向量


    特征向量中心性（Eigenvector centrality）考虑相邻节点连接的重要性或强度。然而，它并没有等等对待所有邻居。使用特征向量中心性，指向重要节点的连接对节点中心性得分的贡献比指向不重要节点的连接更多。特征向量衡量节点在网络内部的重要性。所有节点的相对得分根据其连接计算，同时考虑了关系的频率和强度。特征向量被分配给递归算法，该算法通过考虑网络内所有节点和所有连接的重要性来计算节点节点的重要性。


    ## PageRank


    PageRank 中心性以 Google 联合创始人 Larry Page 命名，最初提出用于搜索引擎中的网页排名应用。`PageRank` 算法模拟了马尔可夫过程的平稳分布，假设每个节点都是网页，每个链接都是从一个页面到另一个页面的超链接。网页浏览器可能会在每个页面上选择随机链接，可能会以某种概率跳转到整个网络上的随机页面。在
    PageRank 中心性中，如果一个特别重要的节点包含许多出站链接，那么被该重要节点指向的影响会被稀释。例如，如果一个特别重要的网页包含大量的 `URL`（统一资源定位符）链接，那么每个出站网页的背书价值就没像同一个重要网页仅指向少数选定的
    `URL` 链接时那么大。


    PageRank 中心性与其他中心性衡量之间的主要区别之一是，节点的重要性可以根据相邻节点出站链接的数量而变化。换句话说，当被其他重要节点指向时，该节点的重要性中隐含了排他性元素。由于相邻节点入站和出站链接的区别，PageRank
    中心性仅针对有向网络计算。


    ## 用例：通过社交网络分析减少电信行业流失


    一家电信公司拥有关于客户通过通话、短信和多媒体消息等多种关系何时相互连接的信息。该公司还知道客户之间连接的频率和新鲜性。基于这些信息，该电信公司可以使用连接数据构建客户网络。在
    във网络（图 8.3`）中，客户是节点，他们的连接是链接。节点的权重基于其人均收入（ARPU）。链接的权重基于其连接的加权和，考虑了通话（包括频率和时长）、短信（频率）和多媒体消息（频率和大小）的不同权重或取值。


    该用例网络分析的主要目标是检测整个网络中的社区，并根据识别出的社区计算网络指标。网络指标经过标准化和汇总，以创建一个单一的中心性。每个社区中中心性最高的节点是领导者。可以根据这些领导者发起留存活动，以避免他们的流失，并假设避免了他们的流失，公司也就避免了他们同伴的流失。

