- fmt: '

    Every node partaking a shortest path somehow controls the information flow within
    the network. The shortest paths taken equals more control over the information
    flow. These types of nodes work as gatekeepers within the network. Betweenness
    centrality counts the number of shortest paths a node partakes, and hence, how
    much it can control the information flow. The constraint in social network is
    usually the strength of the relationship. So, it is a maximization problem. The
    higher the sum of the link weights, the better. Therefore, the higher the betweenness
    centrality, the more the node controls the information flow within the network.


    ## Closeness


    Closeness centrality accounts for the average shortest path from a node to the
    rest of the nodes within the network (or subnetwork). The concept of shortest
    path is the same as described to the betweenness centrality. If a node has a small
    measure for the average shortest path to all other nodes in the network (or in
    its subnetwork), it means that this node is close to every other node. Analogous
    to the betweenness centrality, the constraint is the link weight, and it is a
    maximization problem. The stronger the connections, the better. This calculation
    can be understood as the longest path because the relevance here is based on the
    strength of the relationships. Based on that, the higher the closeness the closer
    the node is to the others in its network.


    The business concept of the closeness centrality is assigned to the speed a node
    can spread some information throughout the network. It is the gossip person. A
    node with high closeness centrality can spread a message throughout the network
    faster than other nodes. This information can be used to target customers to spread
    out a message about a new product. They would be targeted in a product adoption
    campaign. Like degree centrality where in- and out- designations are required
    to indicate incoming and outgoing connections in directed networks, those designations
    are also used in closeness centrality measures when the network is directed. Then,
    for directed networks we calculate `closeness-in` and `closeness-out`. The overall
    closeness is the sum of `closeness-in` and `closeness-out`.


    ## Hub and Authority


    Hub and authority centrality were originally developed to rank the importance
    of web pages. Certain web pages are important if they point to many important
    pages. These web pages are called hubs. Other web pages are important because
    they are pointed to by many important web pages. These web pages are called authorities.
    The same concept can be extended to any type of network to rank or measure the
    importance of the node by the number of outgoing or incoming connections from
    and to other important nodes. Because of the distinction between incoming and
    outgoing connections, hub and authority are computed just for directed networks.
    A good hub node is the one that points to many good authority nodes, and a good
    authority node is the one that is pointed to by many good hub nodes.


    This concept is easily understandable when applied to a co-authorship network.
    A paper that cites many good authority papers has a high hub score, and a paper
    that is referenced by many other influential papers has a high authority score.
    We can also think about the authority score as a person who is the expert in some
    subject matter. Lots of people consult and refer to them. They are an authority,
    as we say. The concept of hub score can be easily understandable when we think
    about airports. The hub of Delta Air Lines in the United States is Atlanta. Most
    of the flights to international or long-haul destinations depart from Atlanta.


    ## Eigenvector


    Eigenvector centrality considers the importance or strength of the connections
    of the adjacent nodes. However, it does not weigh all the neighbors equally. Using
    eigenvector centrality, connections to more important nodes contribute more to
    a node’s centrality score than connections to less important nodes. An eigenvector
    measures the importance of a node inside the network. Relative scores for all
    nodes are computed based on their connections, considering both the frequency
    and strength of the relationship. The eigenvector is assigned to a recursive algorithm
    that calculates the importance of a node, considering the importance of all nodes
    and all connections within the network.


    ## PageRank


    PageRank centrality, named after Google’s cofounder Larry Page, was originally
    proposed for the application of ranking web pages in a search engine. The `PageRank`
    algorithm models the stationary distribution of a Markov process, assuming that
    each node is a web page, and each link is a hyperlink from one page to another.
    A web surfer might choose a random link on every page or might jump to a random
    page on the whole web with some probability. In PageRank centrality, being pointed
    to by a particularly important node is buffered if that important node contains
    many outbound links. For example, if an especially important web page contains
    an exceptionally large number of `URL` (Uniform Resource Locator) links, the endorsement
    value for each outbound web page does not carry as much value compared to the
    same important web page pointing to only a few selected `URL` links.


    One of the main differences that distinguishes PageRank centrality from other
    centrality measures is that the importance of the node can vary based on the number
    of outbound links an adjacent node has. In other words, there is an element of
    exclusivity implied in the importance of that node when pointed to by other important
    nodes. Because the distinction of the inbound and outbound links to the adjacent
    nodes, the PageRank centrality is computed just for directed networks.


    ## Use Case: Social Network Analysis to Reduce Churn in Telecommunications


    A telecommunications company has information about when customers get connected
    to each other through several types of relations like calls, text messages, and
    multimedia messages. This company also knows the frequency and recency of customers’
    connections to each other. Based on that information, this telecommunications
    company can use the connected data to build a network of customers. In this network
    (`[Figure 8.3](#Chapter08.xhtml#ch08fig3)`), the customers are the nodes, and
    their connections are the links. The weights of the nodes are based on their average
    revenue per user (ARPU). The weights of the links are based on the weighted sum
    of their connections, considering different weights or values for calls (including
    frequency and duration), text messages (frequency), and multimedia messages (frequency
    and size).


    The main goal of the network analysis for this case is to detect communities within
    the entire network and compute the network metrics based on the communities identified.
    The network metrics are standardized and summarized to create a single centrality.
    The node(s) with the highest centrality within each community are the leader(s).
    A retention campaign can be launched based on these leaders to avoid their churn
    and assuming that avoiding their churn the company is avoiding their peers’ churn
    as well.

    '
