    The expected confidence if the two accounts were independent is 85% (8,500 broadband
    purchases / 10,000 transactions). The lift is `0.83/0.85` or `0.98`. Because the
    lift is less than 1, the association rule is not useful. It means that customers
    would purchase broadband anyway, no matter if they bought the mobile line or not.
    Furthermore, those without a mobile line are even more likely to have broadband
    (3500 broadband purchases without mobile / 4000 mobiles), with confidence of 87.5%.
    Based on that, mobile and broadband are negatively correlated as shown in [Figure
    7.2](#Chapter07.xhtml#ch07fig2).


    ### Figure 7.2: Association Rules Evaluation


    ![image](Images/f0104-01.jpg)


    A particularly critical point in any data analysis is that the data is not generated
    to meet the objectives of the analysis. The data is generated to meet the needs
    of the business goals. Data scientists must determine whether the data, as it
    exists, has the capacity to meet the objectives of the analysis and then accomplish
    the business goals. Quantifying relationships among items occurring together would
    be useless if very few transactions involve multiple items. If a database does
    not have enough data about relationships among items, for example, by not having
    enough baskets with not enough items within the baskets, data scientists will
    not be able to find any meaningful rules to see when items are purchased together
    or to see when customers purchasing some items imply purchasing others. Therefore,
    it is important that data scientists do some initial examination of the data before
    attempting to do market basket analysis. In general, this initial examination
    is required before attempting any analytical model, either supervised or unsupervised.
    It is important to know that the data required to create models are available,
    meet the business goals, and are enough to model the problem.


    #### Association Rules Analysis Overview


    One strength of association rules analysis is that it is easy to implement and
    interpret the results. Association rules can also search through exceptionally
    large data sets of random data to identify diverse types of patterns. It is a
    technique ideal for categorical data.


    One weakness is that many items can lead to exceptionally large rule sets that
    are difficult to comprehend and manage. Some filtering might be required to generate
    a reasonable number of rules. Ranking the rules based on the measures can be useful
    as well, for example, when selecting the top rules based on `lift` and `support`.


    The problem is when a minimum level of support is used to filter the association
    rules. The assumption is that all the items have similar frequencies or are of
    the same nature, or both. In many situations, some items appear frequently in
    the data and others rarely appear. If the frequencies of the items vary to a large
    degree, then rare items might be left out of the association rules if the minimum
    support level is set too high. Sometimes the rare items are the most valuable
    items in the database. On the other hand, if the minimum support level is set
    too low, the number of association rules discovered might become unmanageable.


    Finally, if there are many items, it is difficult to determine the right number
    of items. Supermarkets and grocery stores might have thousands of items. The number
    of association rules might be exceptionally large, and the rules might be extremely
    complex. Filters in the measures of the rules and data categorization might be
    useful in searching for affinity patterns among the items.


    ### Use Case: Product Acquisition


    Market basket analysis can be used to identify what products and services are
    purchased together. After these association rules are established, data scientists
    can recommend products and services to customers based on what products are usually
    purchased together.


    For example, a telecommunications provider can offer a set of products and services,
    such as streaming content, data packages, fixed and mobile lines, broadband, fiber,
    and on-demand services like security and tech support. This provider can search
    associations among products and services through customer purchase history information:
    what phone and internet services they purchased, what streaming and digital content
    they used, what contract they have, what method of payment they used, and what
    on-demand services they consume, among others.


    The resulting association rules can identify opportunities in cross-selling and
    up-selling campaigns. Quite often, companies encourage their customers to spend
    or consume more by recommending related products that complement what is being
    bought already. These recommendations can be based on the association rules. For
    example, customers who purchase streaming movie content, plus have month-to-month
    contracts, have multiple lines, and purchase fiber. Based on this association
    rule, this provider can offer fiber to all customers who have that set of products,
    streaming movies, month-to-month, and multiple lines. They are more likely to
    purchase fiber than the other customers who have not purchased these products
    already. Another association rule could be customers who purchased broadband,
    have a two-year contract, bought tech support, and online security on-demand services.
    Finally, a third association rule could be customers who have purchased online
    backup also purchased tech support and streaming content.


    As you can notice, the size of the association rule can vary on both sides, on
    the left side (antecedent) and on the right side (consequent). The left and right
    sides of the rules are used to identify patterns when customers purchase and consume
    products and services. The left side of the rule is used to identify the customers
    who will be added to the cross-sell and up-sell campaigns.


    ### Sequence Analysis


    Sequence analysis or sequence association rules analysis is an extension of the
    association rules analysis or market basket analysis. This extension in the technique
    includes a time dimension to the analysis. The addition of time restricts the
    possible associations because it is now based on the time sequence. In this way,
    historical transaction data are examined for sequences of items that occur more
    commonly than expected. Data scientists might use sequence analysis to identify
    patterns in purchasing or consuming, or even to detect problems in events based
    on time.


    An easy comparison between these two techniques (association analysis and sequence
    analysis) and the data required to perform those different analyses is supermarkets.
    Imagine you are shopping at a grocery store. You walk throughout the aisles and
    grab the products that you want and put them in the shopping cart. Once you finish,
    you go to the cashier. You need to remove the products from the shopping cart
    and arrange them before starting the scanning. Perhaps as you organize them you
    set them based on categories, weight, or refrigeration need, and so on. You finish
    your check-out and leave. The grocery store now knows what you purchased and can
    match that to what other customers bought. But this grocery store does not know
    the order you selected your products. It does not know what you purchased first,
    what was more important, and what you purchased last, as consequence of previous
    products. However, knowing what customers purchase together is already a big deal.
    This grocery store can run an extremely useful analysis based on association rules
    to better understand what products are purchased together and boost sales by displaying
    products together or defining combined sets of products with discounts.

