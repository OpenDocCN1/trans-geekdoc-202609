  \ Basic 编程：从入门到精通》、《Java 动画与游戏编程》、《面向高中/职高及学生的 C# 编程》、《面向学生和研究人员的 MATLAB》、《JavaScript\
  \ 图形学：快速学习系列》、《JavaScript 图像处理方法：从入门到精通》、《Java GUI 案例研究：AWT 与 Swing》、《CSS 与 JavaScript\
