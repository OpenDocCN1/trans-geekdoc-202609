  \ Machine_Learning 类\n\n创建一个名为 `machine_learning.py` 的新 Python 文件。在其中创建一个名为 `Machine_Learning`\
  \ 的类。它是机器学习工作流的一部分，负责训练和评估各种分类模型。让我们分解其主要组件和职责：\n\n*   **导入**：该类导入机器学习任务所需的各种库和模块。这些包括用于数据预处理、模型选择、评估指标和特定机器学习算法的库。\n\
  *   **初始化**：类的构造函数将 `Process_Data` 类的一个实例初始化为 `self.obj_data`。`Process_Data` 类包含用于数据预处理和特征工程的方法。\n\
  \n###### machine_learning.py\n\n```python\nimport numpy as np\nfrom imblearn.over_sampling\
  \ import SMOTE\nfrom sklearn.model_selection import train_test_split, RandomizedSearchCV,\
  \ GridSearchCV, StratifiedKFold\nfrom sklearn.preprocessing import StandardScaler\n\
  import joblib\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.metrics\
