  \ support\n 0 0.95 0.92 0.93 382\n 1 0.92 0.95 0.94 381\n accuracy 0.93 763\n macro\
  \ avg 0.94 0.93 0.93 763\n weighted avg 0.94 0.93 0.93 763\n```\n\n让我们详细分析一下性能指标及其含义：\n\
  \n*   **准确率**：准确率衡量模型预测的整体正确性。它计算为正确预测的实例数与总实例数的比率。对于“梯度提升”分类器，其准确率约为 93.45%。这意味着模型做出的预测中约有\
  \ 93.45% 是正确的。\n*   **召回率**：召回率，也称为灵敏度或真正例率，衡量模型正确识别正例（本例中为类别 1）的能力。它计算为真正例（正确识别的类别\
  \ 1 实例）与实际类别 1 实例总数的比率。本例中，类别 1 的召回率约为 95%，表明模型在识别类别 1 实例方面非常有效。\n*   **精确率**：精确率衡量模型在所有预测为正例的实例中正确分类正例的能力。它计算为真正例与预测为正例的实例总数的比率。本例中，类别\
  \ 1 的精确率约为 92%，表明当模型预测某实例为类别 1 时，其正确率约为 92%。\n*   **F1 分数**：F1 分数是精确率和召回率的调和平均数。它在精确率和召回率之间提供平衡，在处理不平衡数据集时尤为有用。类别\
  \ 1 的 F1 分数约为 93.44%，在精确率和召回率之间取得了良好的平衡。\n*   **分类报告**：分类报告提供了每个类别（类别 0 和类别 1）的精确率、召回率和\
  \ F1 分数的详细细分。它使我们能够单独查看模型在两个类别上的表现。\n\n####### 结论\n\n“梯度提升”分类器在该数据集上表现优异。它达到了 93.45%\
  \ 的高准确率，表明具有很强的整体预测性能。模型还展示了极佳的类别 1 实例识别能力，召回率为 95%，精确率为 92%。这意味着它能有效捕获并正确分类正例，同时将假阳性降至最低。\n\
  \n总之，“梯度提升”分类器是针对给定数据集的一个稳健且准确的模型，在精确率和召回率之间实现了良好的权衡，适用于各种分类任务。\n\n###### 极端梯度提升分类器与网格搜索\n\
  \n在 `Machine_Learning` 类中，定义一个名为 `extreme_gradient_boosting()` 的新方法，如下所示：\n\n```python\n\
  def extreme_gradient_boosting(self, name, X_train, X_test, y_train, y_test):\n \
  \   # Define the parameter grid for the grid search\n    param_grid = {\n      \
  \  'n_estimators': [100, 200, 300],\n        'max_depth': [10, 20, 30],\n      \
  \  'learning_rate': [0.01, 0.1, 0.2],\n        'subsample': [0.6, 0.8, 1.0],\n \
  \       'colsample_bytree': [0.6, 0.8, 1.0],\n    }\n\n    # Initialize the XGBoost\
  \ classifier\n    xgb = XGBClassifier(random_state=2021, use_label_encoder=False,\
  \ eval_metric='mlogloss')\n\n    # Create GridSearchCV with the XGBoost classifier\
  \ and the parameter grid\n    grid_search = GridSearchCV(xgb, param_grid, cv=3,\
  \ scoring='accuracy', n_jobs=-1)\n\n    # Train and perform grid search\n    grid_search.fit(X_train,\
  \ y_train)\n\n    # Get the best XGBoost classifier model from the grid search\n\
  \    best_model = grid_search.best_estimator_\n\n    # Saves model\n    joblib.dump(best_model,\
  \ 'XGB_Model.pkl')\n\n    # Print the best hyperparameters found\n    print(f\"\
  Best Hyperparameters for XGB:\")\n    print(grid_search.best_params_)\n\n    return\
  \ best_model\n```\n\n`extreme_gradient_boosting()` 方法实现了极端梯度提升 (XGBoost) 分类器。让我们逐步分解该方法：\n\
  \n####### 1. 参数网格\n\n它定义了一个参数网格，指定了网格搜索期间要搜索的超参数值范围。超参数包括：\n\n*   `n_estimators`：提升轮数（基学习器的数量）。\n\
  *   `max_depth`：集成中每棵树的最大深度。\n*   `learning_rate`：步长收缩，用于防止过拟合。\n*   `subsample`：用于拟合树的样本比例。\n\
  *   `colsample_bytree`：用于拟合树的特征比例。\n\n####### 2. 初始化 XGBoost 分类器\n\n它使用特定设置初始化 XGBoost\
  \ 分类器 (`XGBClassifier`)：\n\n*   `random_state`：设置随机种子以保证可复现性。\n*   `use_label_encoder`：禁用标签编码器以防止警告（XGBoost\
  \ 通常期望标签编码为整数）。\n*   `eval_metric`：指定评估指标为 \"mlogloss\"，通常用于多分类问题。\n\n####### 3.\
  \ GridSearchCV\n\n它创建一个 `GridSearchCV` 对象，该对象将执行带有交叉验证的网格搜索。网格搜索旨在根据准确率作为评分指标找到最佳的超参数组合。交叉验证\
  \ (`cv`) 参数设置为 3，表示 3 折交叉验证。\n\n####### 4. 训练并执行网格搜索\n\n使用提供的超参数网格训练并评估 XGBoost\
  \ 分类器。网格搜索尝试各种超参数组合，并使用交叉验证在训练数据上评估模型的准确率。\n\n####### 5. 最佳模型选择\n\n网格搜索完成后，根据交叉验证期间获得最高准确率的超参数，选择最佳的\
  \ XGBoost 分类器模型。\n\n####### 6. 模型保存\n\n使用 `joblib` 库将最佳模型保存到名为 `XGB_Model.pkl` 的文件中。这使您可以在未来的会话中重用训练好的模型，而无需重新训练。\n\
  \n####### 7. 打印最佳超参数\n\n该方法打印网格搜索期间找到的最佳超参数。这些超参数代表了在训练数据上获得最高准确率的配置。\n\n\n\n\n\
  ####### 概述\n\n`extreme_gradient_boosting()` 方法使用带有交叉验证的网格搜索，对 XGBoost 分类器执行超参数调优。它有助于确定分类器的最佳超参数，并将最佳模型保存以供后续使用。此过程旨在提高模型在给定数据集上的预测性能。\n\
  \n####### `Machine_Learning` 类中的 `implement_XGB()` 方法\n\n在 `Machine_Learning` 类中，定义一个名为\
  \ `implement_XGB()` 的新方法：\n\n```python\ndef implement_XGB(self, chosen, X_train,\
  \ X_test, y_train, y_test):\n    file_path = os.getcwd() + \"/XGB_Model.pkl\"\n\
  \    if os.path.exists(file_path):\n        model = joblib.load('XGB_Model.pkl')\n\
  \        y_pred = self.run_model(chosen, model, X_train, X_test, y_train, y_test,\
  \ proba=True)\n    else:\n        model = self.extreme_gradient_boosting(chosen,\
  \ X_train, X_test, y_train, y_test)\n        y_pred = self.run_model(chosen, model,\
  \ X_train, X_test, y_train, y_test, proba=True)\n\n    # Saves result into excel\
  \ file\n    self.obj_data.save_result(y_test, y_pred, \"results_XGB.csv\")\n   \
  \ print(\"Training Extreme Gradient Boosting done...\")\n    return model, y_pred\n\
  ```\n\n`implement_XGB()` 方法负责实现极端梯度提升（XGBoost）分类器并执行各种操作。以下是该方法的逐步分解：\n\n1.  **文件路径检查**：检查当前工作目录中是否存在名为\
  \ `XGB_Model.pkl` 的文件。该文件通常用于存储预训练的 XGBoost 模型以供复用。\n2.  **条件执行**：\n    *   **若\
  \ `XGB_Model.pkl` 文件存在**：意味着有预训练的 XGBoost 模型可用。此时使用 `joblib.load` 从文件加载预训练模型。\n\
  \    *   **若文件不存在**：意味着没有可用的预训练模型，因此使用 `extreme_gradient_boosting()` 方法训练一个新的 XGBoost\
  \ 模型。\n3.  **模型训练与预测**：无论使用预训练模型还是训练新模型，均调用 `run_model()` 方法对测试数据进行预测。参数 `proba=True`\
  \ 表示模型应返回概率估计。\n4.  **结果保存**：使用 `obj_data.save_result()` 方法将模型预测的结果（真实标签和预测标签）保存到名为\
  \ `results_XGB.csv` 的 Excel 文件中。该文件通常包含评估指标和其他相关信息。\n5.  **打印状态消息**：打印一条消息，指示 XGBoost\
  \ 模型训练已完成。\n6.  **返回模型与预测**：返回训练好的 XGBoost 模型及其在测试数据上的预测结果。\n\n**总结**：`implement_XGB`\
  \ 方法作为训练和使用 XGBoost 分类器的封装。它首先检查预训练模型是否存在，若可用则加载；否则通过超参数调优训练新模型。在对测试数据进行预测后，它保存结果并返回模型和预测值，以供进一步分析或使用。\n\
