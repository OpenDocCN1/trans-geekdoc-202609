  \ 方法用于准备机器学习所需的数据，包括加载或生成训练集和测试集。以下是该方法功能的详细说明：\n\n######### 1. 检查现有数据文件\n\n该方法首先检查数据文件（`X_train.pkl`、`X_test.pkl`、`y_train.pkl`\
  \ 和 `y_test.pkl`）是否已存在于当前工作目录中。这些文件通常存储预处理和分割后的数据，以避免重复的数据预处理。\n\n######### 2. 文件存在性检查\n\
  \n*   如果数据文件存在（`os.path.exists(file_path)` 为 `True`），则使用 `Machine_Learning` 类的 `load_files()`\
  \ 方法加载训练集和测试集。\n*   如果数据文件不存在，则执行以下数据准备步骤。\n\n######### 3. 数据过采样与分割（如果文件不存在）\n\n\
  *   如果数据文件不存在，该方法调用 `Machine_Learning` 类的 `oversampling_splitting()` 方法。该方法执行以下步骤：\n\
  \    *   应用合成少数类过采样技术（SMOTE）处理类别不平衡，生成合成样本以平衡类别。\n    *   按 8:2 的比例将数据分割为训练集和测试集。\n\
  \    *   对特征应用标准化缩放，确保它们具有相似的尺度。\n\n######### 4. 加载文件并启用下拉框\n\n*   数据准备完成后，使用 `load_files`\
  \ 方法加载训练集和测试集。\n*   将两个下拉框（`combo4` 和 `combo5`）的状态设置为 `'normal'`，启用用户交互。\n*   最后，禁用\
  \ `button2` 以防止进一步的数据分割，因为数据已准备就绪。\n\n总的来说，`train_ML()` 方法确保机器学习任务所需的训练集和测试集可用。如果数据文件已存在则加载它们；如果不存在则生成并保存它们，随后启用特定下拉框的交互并禁用进一步的数据分割，以保持机器学习的数据一致性。\n\
  \n接下来，在 `Main_Class` 中定义一个名为 `choose_combobox4()` 的新方法，如下所示：\n\n```\ndef choose_combobox4(self,\
  \ event):\n    chosen = self.obj_window.combo4.get()\n    self.obj_plot.choose_plot_ML(self.root,\
