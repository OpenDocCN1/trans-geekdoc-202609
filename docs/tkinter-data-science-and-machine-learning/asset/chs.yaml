  \ F1-Score。\n\n综上所述，`Logistic Regression` 模型在预测客户响应性方面似乎是有效的，在精确率和召回率之间取得了良好的平衡，并提供了较高的整体准确率。然而，在实际场景中评估模型性能时，必须考虑具体的业务需求以及假阳性和假阴性的后果。\n\
  \n###### Random Forest Classifier and Grid Search\n\n在 `Machine_Learning` 类中，定义一个名为\
  \ `random_forest()` 的新方法，如下所示：\n\n```python\ndef random_forest(self, name, X_train,\
  \ X_test, y_train, y_test):\n    # Random Forest Classifier \n    # Define the parameter\
  \ grid for the grid search\n    param_grid = {\n        'n_estimators': [100, 200,\
  \ 300],\n        'max_depth': [10, 20, 30, 40, 50],\n        'min_samples_split':\
  \ [2, 5, 10],\n        'min_samples_leaf': [1, 2, 4]\n    }\n    # Initialize the\
  \ RandomForestClassifier model\n    rf = RandomForestClassifier(random_state=2021)\n\
  \    # Create GridSearchCV with the RandomForestClassifier model and the parameter\
  \ grid\n    grid_search = GridSearchCV(rf, param_grid, cv=3, scoring='accuracy',\
  \ n_jobs=-1)\n    # Train and perform grid search\n    grid_search.fit(X_train,\
  \ y_train)\n    # Get the best RandomForestClassifier model from the grid search\n\
  \    best_model = grid_search.best_estimator_\n    # Saves model\n    joblib.dump(best_model,\
  \ 'RF_Model.pkl') \n    # Print the best hyperparameters found\n    print(f\"Best\
  \ Hyperparameters for RF:\")\n    print(grid_search.best_params_) \n    return best_model\n\
  ```\n\n代码中的 `random_forest()` 函数负责训练 `Random Forest Classifier` 并使用网格搜索优化其超参数。以下是该函数功能的分步解释：\n\
  \n1.  **参数网格定义**：定义了一个参数网格（`param_grid`），包含 `Random Forest Classifier` 的各种超参数。这些超参数包括：\n\
  \    *   `n_estimators`：森林中树的数量。\n    *   `max_depth`：每棵树的最大深度。\n    *   `min_samples_split`：分割内部节点所需的最小样本数。\n\
  \    *   `min_samples_leaf`：叶子节点所需的最小样本数。\n2.  **模型初始化**：使用指定的随机种子初始化 `Random Forest\
  \ Classifier`（`rf`），以保证可复现性。\n3.  **网格搜索**：创建 `GridSearchCV` 对象（`grid_search`），接收\
  \ `rf` 模型和 `param_grid`。它执行带有交叉验证（3 折交叉验证）的网格搜索，以找到使准确率得分最大化的最佳超参数组合。\n4.  **网格搜索训练**：将\
  \ `grid_search` 对象拟合到训练数据（`X_train` 和 `y_train`）上，以寻找最佳超参数。\n5.  **最佳模型选择**：网格搜索完成后，根据交叉验证期间产生最高准确率的超参数，检索最佳\
  \ `Random Forest` 模型（`best_model`）。\n6.  **模型保存**：使用 `joblib` 库将 `best_model` 保存到名为\
  \ `RF_Model.pkl` 的文件中。这允许稍后检索和使用训练好的模型，而无需重新训练。\n7.  **打印最佳超参数**：打印网格搜索过程中找到的最佳超参数以供参考。\n\
  \n总之，该函数通过在预定义的参数空间上进行网格搜索，自动化了 `Random Forest Classifier` 的超参数调优过程，最终根据指定的超参数返回表现最佳的模型。该优化模型可用于对新数据进行预测。\n\
  \n---\n\n在 `Machine_Learning` 类中，定义一个名为 `implement_RF()` 的新方法，如下所示：\n\n```python\n\
  def implement_RF(self, chosen, X_train, X_test, y_train, y_test):\n    file_path\
  \ = os.getcwd()+\"/RF_Model.pkl\"\n    if os.path.exists(file_path):\n        model\
  \ = joblib.load('RF_Model.pkl')\n        y_pred = self.run_model(chosen, model,\
  \ X_train, X_test, y_train, y_test, proba=True) \n    else:\n        model = self.random_forest(chosen,\
  \ X_train, X_test, y_train, y_test)\n        y_pred = self.run_model(chosen, model,\
  \ X_train, X_test, y_train, y_test, proba=True)\n    # Saves result into excel file\n\
  \    self.obj_data.save_result(y_test, y_pred, \"results_RF.csv\")\n    print(\"\
  Training Random Forest done...\")\n    return model, y_pred\n```\n\n代码中的 `implement_RF()`\
  \ 函数负责为选定任务实现和训练 `Random Forest Classifier`。以下是该函数功能的分步解释：\n\n1.  **检查预训练模型**：首先检查文件系统中是否存在预训练的\
  \ `Random Forest` 模型（`RF_Model.pkl`）。如果找到预训练模型，则从文件加载该模型。此步骤旨在避免在模型已训练并保存的情况下重复训练。\n\
  2.  **模型训练**：如果未找到预训练模型，则调用 `random_forest` 函数执行训练。`random_forest` 函数使用网格搜索训练 `Random\
  \ Forest Classifier` 以优化超参数。\n3.  **预测**：加载预训练模型或训练新模型后，使用训练好的模型对测试数据（`X_test`）进行预测。\n\
  4.  **保存结果**：使用 `save_result` 函数将真实标签（`y_test`）和预测标签（`y_pred`）保存到名为 `results_RF.csv`\
  \ 的 Excel 文件中。该文件可用于模型性能的进一步分析和评估。\n5.  **打印状态**：打印一条消息，指示 `Random Forest` 模型的训练已完成。\n\
  6.  **返回模型和预测结果**：最后，返回训练好的 `Random Forest` 模型和预测标签（`y_pred`），以供潜在的进一步分析或使用。\n\n\
  总之，该函数处理 `Random Forest Classifier` 的训练、预测和结果存储，确保仅在没有可用预训练模型时才进行训练。这允许高效地复用模型和跟踪结果。\n\
  \n---\n\n将以下代码添加到 `Helper_Plot` 类中 `choose_plot_ML()` 方法的末尾：\n\n```python\nif chosen\
  \ == \"Random Forest\":\n    best_model, y_pred = self.obj_ml.implement_RF(chosen,\
  \ X_train, X_test, y_train, y_test)\n    # Plots confusion matrix and ROC\n    self.plot_cm_roc(best_model,\
  \ X_test, y_test, y_pred, chosen, figure1, canvas1)\n    # Plots true values versus\
  \ predicted values diagram and learning curve\n    self.plot_real_pred_val_learning_curve(best_model,\
  \ X_train, y_train, \n                                           X_test, y_test,\
  \ y_pred, chosen, figure2, canvas2)\n    # Shows table of result\n    df_lr = self.obj_data.read_dataset(\"\
  results_RF.csv\")\n    self.shows_table(root, df_lr, 450, 750, \"Y_test and Y_pred\
  \ of Random Forest\")\n```\n\n\n\n\n\n####### 代码实现与评估：随机森林分类器\n\n该代码用于实现和评估机器学习模型，具体为随机森林分类器。以下是代码块功能的说明：\n\
  \n######## 1. 模型实现\n代码块检查所选模型是否为 \"Random Forest\"。如果是，则通过调用 `obj_ml` 对象（机器学习类的实例）的\
  \ `implement_RF()` 方法来实现和训练随机森林模型。\n\n######## 2. 模型评估\n实现并训练随机森林模型后，分三步评估模型性能：\n\
  \n######### 2.1 混淆矩阵与 ROC 曲线\n调用 `plot_cm_roc()` 方法生成并显示模型在测试数据上的预测混淆矩阵和 ROC 曲线。这些可视化有助于评估模型的分类性能。\n\
