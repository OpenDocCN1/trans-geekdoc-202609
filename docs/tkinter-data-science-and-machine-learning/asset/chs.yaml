  ```\n\n######### 绘制真实值与预测值对比图及学习曲线\n\n```python\ndef plot_real_pred_val_learning_curve(self,\
  \ model, X_train, y_train, X_test, y_test, ypred, name, figure, canvas):\n    figure.clear()\n\
  \n    # 绘制真实值与预测值对比图\n    plot1 = figure.add_subplot(2, 1, 1)\n    acc = accuracy_score(y_test,\
  \ ypred)\n    plot1.scatter(range(len(ypred)), ypred, color=\"blue\", lw=3, label=\"\
  Predicted\")\n    plot1.scatter(range(len(y_test)), y_test, color=\"red\", label=\"\
  Actual\")\n    plot1.set_title(\"Predicted Values vs True Values of \" + name, fontsize=12)\n\
  \    plot1.set_xlabel(\"Accuracy: \" + str(round((acc * 100), 3)) + \"%\")\n   \
  \ plot1.legend()\n    plot1.grid(True, alpha=0.75, lw=1, ls='-.')\n\n    # 绘制学习曲线\n\
  \    train_sizes = np.linspace(.1, 1.0, 5)\n    train_sizes, train_scores, test_scores,\
  \ fit_times, _ = learning_curve(\n        model, X_train, y_train, cv=None, n_jobs=None,\
  \ train_sizes=train_sizes, return_times=True\n    )\n    train_scores_mean = np.mean(train_scores,\
  \ axis=1)\n    train_scores_std = np.std(train_scores, axis=1)\n    test_scores_mean\
  \ = np.mean(test_scores, axis=1)\n    test_scores_std = np.std(test_scores, axis=1)\n\
  \n    plot2 = figure.add_subplot(2, 1, 2)\n    plot2.fill_between(train_sizes, train_scores_mean\
  \ - train_scores_std,\n                       train_scores_mean + train_scores_std,\
  \ alpha=0.1, color=\"r\")\n    plot2.fill_between(train_sizes, test_scores_mean\
  \ - test_scores_std,\n                       test_scores_mean + test_scores_std,\
  \ alpha=0.1, color=\"g\")\n    plot2.plot(train_sizes, train_scores_mean, 'o-',\
  \ color=\"r\", label=\"Training score\")\n    plot2.plot(train_sizes, test_scores_mean,\
  \ 'o-', color=\"g\", label=\"Cross-validation score\")\n    plot2.legend(loc=\"\
  best\")\n    plot2.set_title(\"Learning curve of \" + name, fontsize=12)\n    plot2.set_xlabel(\"\
  fit_times\")\n    plot2.set_ylabel(\"Score\")\n    plot2.grid(True, alpha=0.75,\
  \ lw=1, ls='-.')\n\n    figure.tight_layout()\n    canvas.draw()\n```\n\n#########\
