  \ canvas2)\n    # 显示结果表格\n    df_lr = self.obj_data.read_dataset(\"results_ADA.csv\"\
  )\n    self.shows_table(root, df_lr, 450, 750, \"Y_test and Y_pred of AdaBoost Classifier\"\
  )\n```\n\n在这段代码中，程序检查所选的机器学习算法是否为 \"AdaBoost\"。如果确实是 AdaBoost，代码将执行以下步骤。首先，它从文件加载预训练的\
  \ AdaBoost 分类器模型，如果模型文件不存在则训练一个新模型。该训练好的模型用于对测试数据集进行预测，并存储生成的预测结果（`y_pred`）。接下来，代码生成各种可视化图表和报告以进行模型评估。它创建混淆矩阵和\
  \ ROC 曲线，展示模型的分类性能。此外，它还绘制真实值与预测值对比图以及学习曲线，以分析模型随时间变化的行为和性能。\n\n此外，代码从先前保存的名为 `results_ADA.csv`\
  \ 的 Excel 文件中读取结果，该文件包含与 AdaBoost 分类器性能相关的关键指标和统计数据。然后，它以表格形式在图形用户界面（GUI）中显示这些结果，增强了用户解读和分析分类器有效性的能力。总体而言，这部分代码简化了\
  \ AdaBoost 分类器的实现、评估和可视化流程，为明智决策提供了有价值的性能洞察。\n\n运行 `main_class.py`。接下来，点击 **SPLIT\
