  \ y)\n    return model\n\ndef predict_model(self, model, X, proba=False):\n    if\
  \ not proba:\n        y_pred = model.predict(X)\n    else:\n        y_pred_proba\
  \ = model.predict_proba(X)\n        y_pred = np.argmax(y_pred_proba, axis=1)\n \
  \   return y_pred\n```\n\n`Machine_Learning` 类中的 `train_model()` 和 `predict_model()`\
  \ 方法分别负责训练机器学习模型和使用该训练好的模型进行预测。以下是各方法的解释：\n\n####### 1. `train_model(self, model,\
  \ X, y)`\n\n该方法接受三个参数：\n\n*   `model`：待训练的机器学习模型。\n*   `X`：用于训练的特征矩阵（输入数据）。\n* \
  \  `y`：用于训练的目标标签。\n\n在方法内部，对提供的 `model` 调用 `fit` 函数，并传入输入特征矩阵 `X` 和目标标签 `y`。此步骤在提供的训练数据上训练机器学习模型。\n\
  \n最后，将训练好的模型作为方法的输出返回。\n\n####### 2. `predict_model(self, model, X, proba=False)`\n\
  \n该方法接受三个参数：\n\n*   `model`：用于预测的已训练机器学习模型。\n*   `X`：待预测的特征矩阵（输入数据）。\n*   `proba`（可选，默认为\
  \ `False`）：一个布尔标志，指示是返回类别概率 (`True`) 还是类别标签 (`False`) 作为预测结果。\n\n*   如果 `proba`\
  \ 为 `False`，该方法使用模型的 `predict` 函数基于输入特征 `X` 进行类别标签预测。预测的类别标签存储在 `y_pred` 变量中。\n\
  *   如果 `proba` 为 `True`，该方法使用模型的 `predict_proba` 函数获取每个类别的概率。然后选择概率最高的类别作为预测的类别标签，并将其存储在\
  \ `y_pred` 变量中。\n\n预测的类别标签（或概率）作为方法的输出返回。\n\n这些方法具有通用性，可用于各种机器学习模型以执行分类等任务。它们提供了一种一致的方式来训练模型和进行预测，使得在不同模型间切换并评估其性能变得更加容易。\n\
  \n###### 运行模型\n\n在 `Machine_Learning` 类中，定义一个名为 `run_model()` 的新方法，如下所示：\n\n```python\n\
  def run_model(self, name, model, X_train, X_test, y_train, y_test, proba=False):\n\
  \    y_pred = self.predict_model(model, X_test, proba)\n    accuracy = accuracy_score(y_test,\
  \ y_pred)\n    recall = recall_score(y_test, y_pred, average='weighted')\n    precision\
  \ = precision_score(y_test, y_pred, average='weighted')\n    f1 = f1_score(y_test,\
  \ y_pred, average='weighted')\n    print(name)\n    print('accuracy: ', accuracy)\n\
  \    print('recall: ', recall)\n    print('precision: ', precision)\n    print('f1:\
  \ ', f1)\n    print(classification_report(y_test, y_pred))\n    return y_pred\n\
  ```\n\n`Machine_Learning` 类中的 `run_model()` 方法负责在测试数据集上运行训练好的机器学习模型并评估其性能。以下是该方法的解释：\n\
  \n######## `run_model(self, name, model, X_train, X_test, y_train, y_test, proba=False)`\n\
  \n该方法接受多个参数：\n\n*   `name`：一个字符串，代表被评估模型的名称或标识符。\n*   `model`：待评估的已训练机器学习模型。\n*\
  \   `X_train`：训练数据的特征矩阵。\n*   `X_test`：测试数据的特征矩阵。\n*   `y_train`：训练数据的目标标签。\n* \
  \  `y_test`：测试数据的目标标签。\n*   `proba`（可选，默认为 `False`）：一个布尔标志，指示是返回类别概率 (`True`) 还是类别标签\
  \ (`False`) 作为预测结果。\n\n在方法内部，调用 `predict_model()` 方法以获取模型在测试数据 `X_test` 上的预测结果。\n\
  \n根据预测标签和真实标签 (`y_test`) 计算多个评估指标。这些指标包括：\n\n*   **准确率**：正确预测标签的比例。\n*   **召回率**：各类别召回率的加权平均。\n\
  *   **精确率**：各类别精确率的加权平均。\n*   **F1 分数**：各类别 F1 分数的加权平均。\n\n随后，该方法打印模型名称及计算出的指标，以提供其性能的概览。\n\
  \n最后，该方法返回预测标签 (`y_pred`)。这可用于进一步的分析或可视化。\n\n`run_model()` 方法作为一种标准化方式，用于在同一数据集上评估和比较不同的机器学习模型，从而更容易评估其在给定任务中的有效性。\n\
  \n####### 绘制混淆矩阵与 ROC 曲线\n\n在 `Helper_Plot` 类中，定义一个名为 `plot_cm_roc()` 的新方法，如下所示：\n\
  \n```python\ndef plot_cm_roc(self, model, X_test, y_test, ypred, name, figure, canvas):\n\
  \    figure.clear()\n    # Plots confusion matrix\n    plot1 = figure.add_subplot(2,\
  \ 1, 1)\n    cm = confusion_matrix(y_test, ypred)\n    sns.heatmap(cm, annot=True,\
  \ linewidth=3, linecolor='red', fmt='g', cmap=\"Greens\", annot_kws={\"size\": 14},\
  \ ax=plot1)\n    plot1.set_title('Confusion Matrix' + \" of \" + name, fontsize=12)\n\
  \    plot1.set_xlabel('Y predict', fontsize=10)\n    plot1.set_ylabel('Y test',\
  \ fontsize=10)\n    plot1.xaxis.set_ticklabels(['Responsive', 'Not Responsive'],\
  \ fontsize=10)\n    plot1.yaxis.set_ticklabels(['Responsive', 'Not Responsive'],\
  \ fontsize=10)\n\n    # Plots ROC\n    plot2 = figure.add_subplot(2, 1, 2)\n   \
  \ Y_pred_prob = model.predict_proba(X_test)\n    Y_pred_prob = Y_pred_prob[:, 1]\n\
  \    fpr, tpr, thresholds = roc_curve(y_test, Y_pred_prob)\n```\n\n\n\n\n\n#######\
  \ 绘制混淆矩阵与 ROC 曲线\n\n```python\nplot2.plot([0, 1], [0, 1], color='navy', linestyle='--',\
  \ linewidth=3)\nplot2.plot(fpr, tpr, color='red', linewidth=3)\nplot2.set_xlabel('False\
  \ Positive Rate', fontsize=10)\nplot2.set_ylabel('True Positive Rate', fontsize=10)\n\
  plot2.set_title('ROC Curve of ' + name, fontsize=12)\nplot2.grid(True)\nfigure.tight_layout()\n\
  canvas.draw()\n```\n\n`Helper_Plot` 类中的 `plot_cm_roc()` 方法负责绘制模型评估的两个关键可视化图表：混淆矩阵和接收者操作特征（ROC）曲线。以下是该方法的说明：\n\
  \n######## 方法签名\n\n```python\nplot_cm_roc(self, model, X_test, y_test, ypred, name,\
  \ figure, canvas)\n```\n\n此方法接受以下参数：\n\n*   `model`：待评估的已训练机器学习模型。\n*   `X_test`：测试数据的特征矩阵。\n\
  *   `y_test`：测试数据的目标标签。\n*   `ypred`：模型在测试数据上获得的预测标签。\n*   `name`：表示被评估模型名称或标识符的字符串。\n\
  *   `figure`：用于绘制可视化图表的 Matplotlib `figure` 对象。\n*   `canvas`：与该 figure 关联的 Matplotlib\
  \ `canvas` 对象。\n\n######## 执行流程\n\n1.  **创建子图**：在指定的 `figure` 中创建两个子图，并排显示混淆矩阵和\
  \ ROC 曲线。\n2.  **绘制混淆矩阵**：使用 `seaborn` 绘制混淆矩阵（`cm`）的热力图。热力图包含每个单元格的数值标注，颜色映射设为 \"\
  Greens\"。同时添加坐标轴标签和刻度标签以提高清晰度。混淆矩阵提供了模型分类性能的洞察。\n3.  **绘制 ROC 曲线**：使用 `roc_curve`\
  \ 函数计算假阳性率（FPR）和真阳性率（TPR），并在第二个子图上绘制 ROC 曲线。对角虚线代表随机猜测，红线代表模型的 ROC 曲线。ROC 曲线下面积（AUC）是评估模型判别能力的常用指标。\n\
  4.  **渲染输出**：生成的混淆矩阵和 ROC 曲线显示在指定的 `figure` 中。调用 `canvas.draw()` 函数以渲染并更新关联画布中的图表。\n\
  \n该方法提供了模型性能的综合可视化总结，便于通过混淆矩阵评估分类准确性，通过 ROC 曲线评估类别判别能力。\n\n---\n\n######### 绘制真实值与预测值对比图及学习曲线\n\
  \n在 `Helper_Plot` 类中，定义一个名为 `plot_real_pred_val_learning_curve()` 的新方法，如下所示：\n\n\
  ```python\n####### Plots true values versus predicted values diagram and learning\
  \ curve\ndef plot_real_pred_val_learning_curve(self, model, X_train, y_train, X_test,\
  \ y_test, ypred, name, figure, canvas):\n    figure.clear()\n\n    # Plots true\
  \ values versus predicted values diagram\n    plot1 = figure.add_subplot(2, 1, 1)\n\
  \    acc = accuracy_score(y_test, ypred)\n    plot1.scatter(range(len(ypred)), ypred,\
  \ color=\"blue\", lw=3, label=\"Predicted\")\n    plot1.scatter(range(len(y_test)),\
  \ y_test, color=\"red\", label=\"Actual\")\n    plot1.set_title(\"Predicted Values\
  \ vs True Values of \" + name, fontsize=12)\n    plot1.set_xlabel(\"Accuracy: \"\
  \ + str(round((acc * 100), 3)) + \"%\")\n    plot1.legend()\n    plot1.grid(True,\
  \ alpha=0.75, lw=1, ls='-.')\n\n    # Plots learning curve\n    train_sizes = np.linspace(.1,\
  \ 1.0, 5)\n    train_sizes, train_scores, test_scores, fit_times, _ = learning_curve(\n\
  \        model, X_train, y_train, cv=None, n_jobs=None, train_sizes=train_sizes,\
  \ return_times=True\n    )\n    train_scores_mean = np.mean(train_scores, axis=1)\n\
  \    train_scores_std = np.std(train_scores, axis=1)\n    test_scores_mean = np.mean(test_scores,\
  \ axis=1)\n    test_scores_std = np.std(test_scores, axis=1)\n\n    plot2 = figure.add_subplot(2,\
  \ 1, 2)\n    plot2.fill_between(train_sizes, train_scores_mean - train_scores_std,\n\
  \                       train_scores_mean + train_scores_std, alpha=0.1, color=\"\
  r\")\n    plot2.fill_between(train_sizes, test_scores_mean - test_scores_std,\n\
  \                       test_scores_mean + test_scores_std, alpha=0.1, color=\"\
  g\")\n    plot2.plot(train_sizes, train_scores_mean, 'o-', color=\"r\", label=\"\
  Training score\")\n    plot2.plot(train_sizes, test_scores_mean, 'o-', color=\"\
  g\", label=\"Cross-validation score\")\n    plot2.legend(loc=\"best\")\n    plot2.set_title(\"\
  Learning curve of \" + name, fontsize=12)\n    plot2.set_xlabel(\"fit_times\")\n\
  \    plot2.set_ylabel(\"Score\")\n    plot2.grid(True, alpha=0.75, lw=1, ls='-.')\n\
  \n    figure.tight_layout()\n    canvas.draw()\n```\n\n`Helper_Plot` 类中的 `plot_real_pred_val_learning_curve()`\
  \ 方法负责绘制两个可视化图表：真实值与预测值对比图和学习曲线。以下是该方法的说明：\n\n######## 方法签名\n\n```python\nplot_real_pred_val_learning_curve(self,\
  \ model, X_train, y_train, X_test, y_test, ypred, name, figure, canvas)\n```\n\n\
  此方法接受以下参数：\n\n*   `model`：待评估的已训练机器学习模型。\n*   `X_train`：训练数据的特征矩阵。\n*   `y_train`：训练数据的目标标签。\n\
  *   `X_test`：测试数据的特征矩阵。\n*   `y_test`：测试数据的目标标签。\n*   `ypred`：模型在测试数据上获得的预测标签。\n\
  *   `name`：表示被评估模型名称或标识符的字符串。\n*   `figure`：用于绘制可视化图表的 Matplotlib `figure` 对象。\n\
  *   `canvas`：与该 figure 关联的 Matplotlib `canvas` 对象。\n\n######## 执行流程\n\n1.  **创建子图**：在指定的\
  \ `figure` 中创建两个子图（垂直排列），分别显示真实值与预测值对比图和学习曲线。\n2.  **绘制真实值与预测值对比图**：计算模型预测的准确率并将其添加到图表标题中。分别绘制预测值（蓝色）和实际值（红色）的散点图。图例指明哪些点代表预测值和实际值。该图表有助于直观展示模型预测与实际值的对齐情况。\n\
  3.  **绘制学习曲线**：使用 `learning_curve()` 函数计算不同训练集大小下的训练分数和交叉验证分数。绘制学习曲线，包含表示分数标准差的阴影区域。学习曲线有助于随着训练集大小的增加，评估模型在偏差和方差方面的表现。\n\
  4.  **渲染输出**：生成的对比图和学习曲线显示在指定的 `figure` 中。调用 `canvas.draw()` 函数以渲染并更新关联画布中的图表。\n\
  \n这些可视化图表提供了双重洞察：通过真实值与预测值对比图了解模型的预测性能，通过学习曲线了解模型的泛化能力。\n\n---\n\n###### 逻辑回归分类器与网格搜索\n\
  \n在 `Machine_Learning` 类中，定义一个名为 `logistic_regression()` 的新方法，如下所示：\n\n```python\n\
  def logistic_regression(self, name, X_train, X_test, y_train, y_test):\n    # Logistic\
  \ Regression Classifier\n    # Define the parameter grid for the grid search\n \
  \   param_grid = {\n        'C': [0.01, 0.1, 1, 10],\n        'penalty': ['none',\
  \ 'l2'],\n        'solver': ['newton-cg', 'lbfgs', 'liblinear', 'saga'],\n    }\n\
  \n    # Initialize the Logistic Regression model\n    logreg = LogisticRegression(max_iter=5000,\
  \ random_state=2021)\n\n    # Create GridSearchCV with the Logistic Regression model\
  \ and the parameter grid\n    grid_search = GridSearchCV(logreg, param_grid, cv=3,\
  \ scoring='accuracy', n_jobs=-1)\n\n    # Train and perform grid search\n    grid_search.fit(X_train,\
  \ y_train)\n```\n\n\n\n\n\n####### 从网格搜索获取最佳逻辑回归模型\n\n```python\nbest_model = grid_search.best_estimator_\n\
  ```\n\n########## 保存模型\n\n```python\njoblib.dump(best_model, 'LR_Model.pkl')\n```\n\
  \n########## 打印找到的最佳超参数\n\n```python\nprint(f\"Best Hyperparameters for LR:\")\n\
  print(grid_search.best_params_)\n```\n\n```python\nreturn best_model\n```\n\n`Machine_Learning`\
  \ 类中的 `logistic_regression()` 方法负责通过网格搜索进行超参数调优来训练逻辑回归分类器。以下是该方法的分步解释：\n\n#######\
  \ 1. 方法参数\n\n*   `name`：表示正在训练的模型名称或标识符的字符串（例如 \"Logistic Regression\"）。\n*   `X_train`：训练数据的特征矩阵。\n\
  *   `X_test`：测试数据的特征矩阵。\n*   `y_train`：训练数据的目标标签。\n*   `y_test`：测试数据的目标标签。\n\n########\
  \ 2. 用于超参数调优的网格搜索\n\n定义了一个参数网格 (`param_grid`)，指定了逻辑回归分类器的一系列超参数。这包括正则化强度 (`C`)、惩罚类型\
  \ (`penalty`) 和求解器方法 (`solver`) 的不同值。\n\n######## 3. 逻辑回归模型初始化\n\n使用一些配置初始化了一个逻辑回归分类器\
  \ (`logreg`)，包括最大迭代次数和随机种子。`max_iter` 参数设置为 5000 以确保求解器收敛，`random_state` 设置为 2021\
  \ 以保证可复现性。\n\n######## 4. 交叉验证网格搜索\n\n使用 `GridSearchCV` 执行带有交叉验证的网格搜索。它接收初始化的逻辑回归模型\
  \ (`logreg`)、参数网格 (`param_grid`)、交叉验证折数 (`cv=3`)、评分指标 (`scoring='accuracy'`) 以及并行化搜索的选项\
  \ (`n_jobs=-1`)。\n\n######## 5. 训练与模型选择\n\n使用训练数据 (`X_train`, `y_train`) 调用网格搜索对象\
  \ (`grid_search`) 的 `fit()` 方法，以训练具有不同超参数组合的多个逻辑回归模型。\n\n####### 6. 最佳模型选择\n\n使用\
  \ `grid_search.best_estimator_` 获取具有最优超参数的表现最佳的逻辑回归模型。\n\n####### 7. 模型保存\n\n使用\
  \ `joblib.dump` 方法将表现最佳的逻辑回归模型保存到名为 `LR_Model.pkl` 的 pickle 文件中。这使得模型可以在以后重复使用，而无需重新训练。\n\
  \n######## 8. 打印最佳超参数\n\n该方法打印在逻辑回归分类器的网格搜索过程中找到的最佳超参数。\n\n######## 9. 返回值\n\n表现最佳的逻辑回归模型作为该方法的输出返回。\n\
  \n总的来说，该方法自动化了逻辑回归分类器的超参数调优过程，确保模型使用网格搜索期间找到的最佳超参数进行训练。\n\n然后，在 `Machine_Learning`\
  \ 类中，定义一个名为 `implement_LR()` 的新方法，如下所示：\n\n```python\ndef implement_LR(self, chosen,\
  \ X_train, X_test, y_train, y_test):\n    file_path = os.getcwd() + \"/LR_Model.pkl\"\
  \n    if os.path.exists(file_path):\n        model = joblib.load('LR_Model.pkl')\n\
  \        y_pred = self.run_model(chosen, model, X_train, X_test, y_train, y_test,\
  \ proba=True)\n    else:\n        model = self.logistic_regression(chosen, X_train,\
  \ X_test, y_train, y_test)\n        y_pred = self.run_model(chosen, model, X_train,\
  \ X_test, y_train, y_test, proba=True)\n    # 将结果保存到 excel 文件\n    self.obj_data.save_result(y_test,\
  \ y_pred, \"results_LR.csv\")\n    print(\"Training Logistic Regression done...\"\
  )\n    return model, y_pred\n```\n\n`Machine_Learning` 类中的 `implement_LR()` 方法负责为给定数据集和选定类别（目标变量）实现逻辑回归分类器。以下是该方法的分步解释：\n\
  \n####### 1. 方法参数\n\n*   `chosen`：表示选定类别或目标变量的字符串。\n*   `X_train`：训练数据的特征矩阵。\n*\
  \   `X_test`：测试数据的特征矩阵。\n*   `y_train`：训练数据的目标标签。\n*   `y_test`：测试数据的目标标签。\n\n#######\
  \ 2. 检查预训练模型\n\n该方法通过构建 `LR_Model.pkl` 的文件路径并使用 `os.path.exists(file_path)`，检查当前工作目录中是否存在预训练的逻辑回归模型。\n\
  \n######### 3. 模型加载或训练\n\n*   如果存在预训练模型，则使用 `joblib.load('LR_Model.pkl')` 加载它。否则，调用\
  \ `logistic_regression` 方法通过超参数调优训练一个新的逻辑回归模型。\n*   无论模型是被加载还是被训练，都将存储在 `model`\
  \ 变量中。\n\n####### 4. 模型评估与预测\n\n*   调用 `run_model()` 方法在测试数据 (`X_test`, `y_test`)\
  \ 上评估模型性能。`proba` 参数设置为 `True`，表示应计算类别预测的概率分数。\n*   预测的类别概率或标签存储在 `y_pred` 变量中。\n\
  \n####### 5. 保存模型结果\n\n该方法使用 `Process_Data` 类 (`self.obj_data`) 的 `save_result()`\
  \ 方法将模型结果（包括实际标签和预测标签）保存到名为 `results_LR.csv` 的 Excel 文件中。\n\n######### 6. 打印状态\n\
  \n打印一条消息以指示逻辑回归模型的训练或加载已完成。\n\n####### 7. 返回值\n\n训练或加载的逻辑回归模型 (`model`) 和预测的类别概率或标签\
  \ (`y_pred`) 作为输出返回。\n\n总的来说，此方法允许您根据选定类别加载预训练的逻辑回归模型或训练一个新模型，然后在测试数据上评估其性能，同时保存结果以供进一步分析。\n\
  \n然后，在 `Helper_Plot` 类中，定义一个名为 `choose_plot_ML()` 的新方法，如下所示：\n\n```python\ndef choose_plot_ML(self,\
