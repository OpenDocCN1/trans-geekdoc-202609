  \n######## 显示可视化结果\n\n所选机器学习算法生成的可视化图表和表格将显示在 Tkinter 根窗口（`root`）中，供用户交互。\n\n总的来说，该方法提供了一种模块化且有条理的方式来选择机器学习算法、训练或加载模型，并根据所选算法显示相关的可视化图表和结果表格。这有助于在分析机器学习模型性能时保持清晰且易于使用。\n\
  \n接着，在 `Main_Class` 中定义一个名为 `train_ML()` 的新方法，如下所示：\n\n```\ndef train_ML(self):\n\
