  \ AdaBoost Classifier and Grid Search\n\n在 `Machine_Learning` 类中，定义一个名为 `adaboost_classifier()`\
  \ 的新方法，如下所示：\n\n```python\ndef adaboost_classifier(self, name, X_train, X_test,\
  \ y_train, y_test):\n    # Define the parameter grid for the grid search\n    param_grid\
  \ = {\n        'n_estimators': [50, 100, 150],\n        'learning_rate': [0.01,\
  \ 0.1, 0.2],\n    }\n\n    # Initialize the AdaBoost classifier\n    adaboost =\
  \ AdaBoostClassifier(random_state=2021)\n\n    # Create GridSearchCV with the AdaBoost\
  \ classifier and the parameter grid\n    grid_search = GridSearchCV(adaboost, param_grid,\
  \ cv=3, scoring='accuracy', n_jobs=-1)\n```\n\n\n\n\n\n########## 训练并执行网格搜索\n\n\
  ```python\ngrid_search.fit(X_train, y_train)\n\n####### 从网格搜索中获取最佳 AdaBoost 分类器模型\n\
  best_model = grid_search.best_estimator_\n\n########## 保存模型\njoblib.dump(best_model,\
  \ 'ADA_Model.pkl')\n\n########## 打印找到的最佳超参数\nprint(f\"Best Hyperparameters for AdaBoost:\"\
  )\nprint(grid_search.best_params_)\n\nreturn best_model\n```\n\n该代码定义了一个函数 `adaboost_classifier()`，用于设置\
  \ AdaBoost 分类器模型并使用网格搜索进行超参数调优。以下是代码各部分的解释：\n\n####### 1. 参数网格定义\n\n*   `param_grid`\
  \ 是一个字典，定义了要调优的超参数以及网格搜索期间要考虑的取值范围。\n*   它包含两个超参数：\n    *   `n_estimators`：集成中要训练的弱学习器（基础估计器）的数量。\n\
  \    *   `learning_rate`：每个弱学习器对最终预测的贡献权重。\n\n####### 2. AdaBoost 分类器初始化\n\n使用 `random_state=2021`\
  \ 初始化一个 AdaBoost 分类器。该分类器是一种集成学习方法，通过组合多个弱学习器来创建一个强分类器。\n\n####### 3. 网格搜索设置\n\n\
  使用 `GridSearchCV` 设置网格搜索。它接收 AdaBoost 分类器、参数网格（`param_grid`）和其他配置：\n\n*   `cv=3`：在网格搜索期间执行\
  \ 3 折交叉验证。\n*   `scoring='accuracy'`：使用准确率作为评估模型性能的评分指标。\n*   `n_jobs=-1`：利用所有可用的\
  \ CPU 核心进行并行处理。\n\n####### 4. 网格搜索训练\n\n*   `grid_search` 对象在提供的训练数据（`X_train` 和\
  \ `y_train`）上进行训练。\n*   它对超参数网格进行穷举搜索，使用不同的超参数组合拟合 AdaBoost 分类器，并通过交叉验证评估其性能。\n\n\
  ####### 5. 最佳模型选择\n\n网格搜索完成后，根据交叉验证期间产生最高准确率的超参数组合，选择表现最佳的 AdaBoost 分类器模型。\n\n#######\
  \ 6. 模型保存\n\n使用 `joblib.dump` 将最佳模型保存到名为 `ADA_Model.pkl` 的文件中，以供将来使用。\n\n#######\
  \ 7. 打印超参数\n\n该函数打印网格搜索期间找到的最佳超参数。\n\n该函数的目的是自动化 AdaBoost 分类器的超参数调优过程。它帮助你找到在训练数据上最大化模型准确率的最佳超参数组合。然后可以使用最佳模型对新数据进行预测。\n\
  \n然后，在 `Machine_Learning` 类中，定义一个名为 `implement_ADA()` 的新方法：\n\n```python\ndef implement_ADA(self,\
  \ chosen, X_train, X_test, y_train, y_test):\n    file_path = os.getcwd() + \"/ADA_Model.pkl\"\
  \n    if os.path.exists(file_path):\n        model = joblib.load('ADA_Model.pkl')\n\
  \        y_pred = self.run_model(chosen, model, X_train, X_test, y_train, y_test,\
  \ proba=True)\n    else:\n        model = self.adaboost_classifier(chosen, X_train,\
  \ X_test, y_train, y_test)\n        y_pred = self.run_model(chosen, model, X_train,\
  \ X_test, y_train, y_test, proba=True)\n\n    # 将结果保存到 Excel 文件\n    self.obj_data.save_result(y_test,\
  \ y_pred, \"results_ADA.csv\")\n    print(\"Training AdaBoost done...\")\n    return\
  \ model, y_pred\n```\n\n该代码定义了一个函数 `implement_ADA()`，用于实现针对二分类问题的 AdaBoost 分类器。以下是代码功能的细分说明：\n\
  \n####### 1. 模型加载或训练\n\n*   该函数首先检查当前工作目录下是否存在名为 `ADA_Model.pkl` 的已保存 AdaBoost 分类器模型文件。\n\
  *   如果模型文件存在，则使用 `joblib.load` 加载该模型。这样做是为了避免在模型已经过训练并保存的情况下重复训练。\n*   如果模型文件不存在，则调用\
  \ `adaboost_classifier()` 函数训练一个新的 AdaBoost 分类器。该函数使用网格搜索进行超参数调优，并返回训练好的最佳模型。\n\n\
  ####### 2. 模型预测\n\n无论模型是加载的还是新训练的，该函数都使用获得的 AdaBoost 分类器模型对提供的测试数据（`X_test`）进行预测。\n\
  \n####### 3. 结果保存\n\n预测标签（`y_pred`）连同真实标签（`y_test`）一起，使用 `obj_data` 对象的 `save_result`\
  \ 方法保存到名为 `results_ADA.csv` 的 Excel 文件中。该文件包含用于模型评估的指标和结果。\n\n####### 4. 打印进度\n\n\
  该函数打印 \"Training AdaBoost done...\" 以指示模型已加载或训练完成，且预测已完成。\n\n####### 5. 返回模型和预测结果\n\
  \n该函数返回 AdaBoost 分类器模型和预测标签（`y_pred`），以供进一步分析或使用。\n\n该函数本质上封装了加载预训练 AdaBoost 模型（如果可用）或训练新模型、在测试数据上进行预测以及保存结果的过程。它为重用已训练模型提供了灵活性，并避免了在模型已在之前的运行中训练并保存时的冗余训练。\n\
  \n然后，在 `Helper_Plot` 类中，将此代码添加到 `choose_plot_ML()` 方法的末尾：\n\n```python\nif chosen\
  \ == \"AdaBoost\":\n    best_model, y_pred = self.obj_ml.implement_ADA(chosen, X_train,\
  \ X_test, y_train, y_test)\n    # 绘制混淆矩阵和 ROC 曲线\n    self.plot_cm_roc(best_model,\
  \ X_test, y_test, y_pred, chosen, figure1, canvas1)\n    # 绘制真实值与预测值对比图及学习曲线\n \
  \   self.plot_real_pred_val_learning_curve(best_model, X_train, y_train,\n     \
