  results_LR.csv\")\n        self.shows_table(root, df_lr, 450, 750, \"Y_test and\
  \ Y_pred of Logistic Regression\")\n```\n\n`choose_plot_ML()` 方法负责选择并显示与所选机器学习算法相关的特定图表和可视化。以下是该方法工作原理的细分：\n\
  \n####### 1. 方法参数\n\n*   `root`：将在其中显示图表和表格的 Tkinter 根窗口。\n*   `chosen`：表示所选机器学习算法的字符串。\n\
