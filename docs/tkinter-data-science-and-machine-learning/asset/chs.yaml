  \ 提取分类与数值特征\n\n###### `extract_cat_num_cols()` 方法\n\n代码在 `Process_Data` 类中定义了 `extract_cat_num_cols()`\
  \ 方法，用于将 DataFrame 的列分离为分类列列表和数值列列表。\n\n```python\ndef extract_cat_num_cols(self,\
  \ df):\n    # Extracts categorical and numerical columns in dummy dataset\n    cat_cols\
  \ = [col for col in df.columns if\n                (df[col].dtype == 'object') or\
  \ (df[col].dtype.name == 'category')]\n\n    num_cols = [col for col in df.columns\
  \ if\n                (df[col].dtype != 'object') and (df[col].dtype.name != 'category')]\n\
  \n    return cat_cols, num_cols\n```\n\n###### 方法解析\n\n1.  **方法定义**：\n    `def extract_cat_num_cols(self,\
  \ df):` 接收 `self` 和 `df`（Pandas DataFrame）两个参数。\n\n2.  **提取分类列**：\n    列表推导式遍历 `df.columns`，若列的\
  \ `dtype` 为 `'object'` 或 `dtype.name` 为 `'category'`，则判定为分类列，加入 `cat_cols`。\n\n\
  3.  **提取数值列**：\n    列表推导式遍历 `df.columns`，若列的 `dtype` 不为 `'object'` 且 `dtype.name`\
  \ 不为 `'category'`，则判定为数值列，加入 `num_cols`。\n\n4.  **返回结果**：\n    `return cat_cols,\
  \ num_cols`：返回分类列名列表和数值列名列表。\n\n> 该方法可快速按数据类型分离列，便于后续对分类特征编码、数值特征缩放等差异化预处理。\n\n\
  ---\n\n##### 分类特征编码\n\n###### `encode_categorical_feats()` 方法\n\n`Process_Data`\
  \ 类中的 `encode_categorical_feats()` 方法使用标签编码（Label Encoding）对 DataFrame 的分类特征进行编码。\n\
  \n```python\ndef encode_categorical_feats(self, df, cat_cols):\n    # Encodes categorical\
  \ features in original dataset\n    print(f'Features that needs to be Label Encoded:\
  \ \\n{cat_cols}')\n\n    for c in cat_cols:\n        lbl = LabelEncoder()\n    \
  \    lbl.fit(list(df[c].astype(str).values))\n        df[c] = lbl.transform(list(df[c].astype(str).values))\n\
  \n    print('Label Encoding done..')\n    return df\n```\n\n###### 方法解析\n\n1.  **方法定义**：\n\
  \    `def encode_categorical_feats(self, df, cat_cols):` 接收 `self`、`df`（DataFrame）和\
  \ `cat_cols`（待编码分类列名列表）。\n\n2.  **打印待编码特征**：\n    `print(f'Features that needs to\
  \ be Label Encoded: \\n{cat_cols}')` 输出即将编码的特征名。\n\n3.  **标签编码循环**：\n    遍历 `cat_cols`\
  \ 中的每一列 `c`：\n    *   `lbl = LabelEncoder()`：实例化 `LabelEncoder`，该预处理器为每个类别分配唯一整数。\n\
  \    *   `lbl.fit(list(df[c].astype(str).values))`：将列值转为字符串后拟合编码器。\n    *   `df[c]\
  \ = lbl.transform(list(df[c].astype(str).values))`：将列值转换为对应的整数标签。\n\n4.  **打印完成确认**：\n\
  \    `print('Label Encoding done..')` 提示编码完成。\n\n5.  **返回编码后 DataFrame**：\n    `return\
  \ df`：返回完成标签编码的 DataFrame。\n\n\n\n\n##### 标签编码\n\n标签编码是一种常用技术，用于将分类数据转换为机器学习算法可处理的数值格式。每个类别被分配一个唯一的整数标签。值得注意的是，标签编码可能会在类别之间引入序数关系，这可能并不适用于所有分类特征。在某些情况下，根据数据性质和所用的机器学习模型，可能更倾向于使用独热编码或其他编码方法。\n\
  \n##### 提取输入和输出变量\n\n在 `Process_Data` 类中，代码中的 `extract_input_output_vars()` 方法负责从\
  \ Pandas DataFrame 中提取输入变量（特征）和输出变量（目标）。\n\n```\ndef extract_input_output_vars(self,\
  \ df):\n    # Extracts output and input variables\n    y = df['Response'].values\
  \  # Target for the model\n    X = df.drop(['Dt_Customer', 'Year_Birth', 'Response'],\
  \ axis=1)\n    return X, y\n```\n\n让我们分解一下该方法的工作原理：\n\n###### 1. 方法定义\n\n`def extract_input_output_vars(self,\
  \ df):` 这是一个方法定义，接受两个参数：`self`，即类实例的引用；`df`，即包含数据集的 Pandas DataFrame。\n\n######\
  \ 2. 提取输出变量\n\n`y = df['Response'].values`：此行从 DataFrame `df` 中提取输出变量，通常称为目标变量。它假设\
  \ DataFrame 中的目标变量名为 \"Response\"。`.values` 属性将目标列转换为 NumPy 数组，这通常用作机器学习模型的目标。\n\
  \n###### 3. 提取输入变量\n\n`X = df.drop(['Dt_Customer', 'Year_Birth', 'Response'], axis=1)`：此行从\
  \ DataFrame `df` 中提取输入变量（特征）。它从 DataFrame 中删除三列：\"Dt_Customer\"、\"Year_Birth\" 和\
  \ \"Response\"。这些列从输入特征中移除，剩余的列作为输入变量。\n\n###### 4. 返回提取的变量\n\n*   `return X, y`：最后，该方法返回两个变量：\n\
  \    *   `X`：包含机器学习模型的输入变量（特征）。\n    *   `y`：包含模型旨在预测的输出变量（目标）。\n\n该方法旨在促进机器学习任务的数据准备。它将特征（输入变量）与目标变量分离，使数据更易于与各种机器学习算法配合使用。通常，在监督学习中，`X`\
  \ 代表自变量，`y` 代表模型将要预测的因变量。\n\n##### 基于随机森林分类器的特征重要性\n\n在 `Process_Data` 类中，代码中的 `feat_importance_rf()`\
  \ 方法负责使用随机森林分类器计算并返回特征重要性。\n\n```\ndef feat_importance_rf(self, X, y):\n    names\
  \ = X.columns\n    rf = RandomForestClassifier()\n    rf.fit(X, y)\n    result_rf\
  \ = pd.DataFrame()\n    result_rf['Features'] = X.columns\n    result_rf['Values']\
  \ = rf.feature_importances_\n    result_rf.sort_values('Values', inplace=True, ascending=False)\n\
  \    return result_rf\n```\n\n让我们分解一下该方法的工作原理：\n\n###### 1. 方法定义\n\n`def feat_importance_rf(self,\
  \ X, y):` 这是一个方法定义，接受三个参数：`self`，即类实例的引用；`X`，即包含输入特征的 Pandas DataFrame；`y`，即包含目标变量的\
  \ NumPy 数组。\n\n###### 2. 提取特征名称\n\n`names = X.columns`：此行从 DataFrame `X` 中提取输入特征的名称（列），并将其存储在\
  \ `names` 变量中。这些特征名称将用于标记特征重要性。\n\n###### 3. 随机森林分类器\n\n`rf = RandomForestClassifier()`：创建了一个\
  \ `RandomForestClassifier` 实例。随机森林分类器是一种机器学习模型，以其通过分析每个特征对模型预测的贡献程度来评估特征重要性的能力而闻名。\n\
  \n###### 4. 拟合模型\n\n`rf.fit(X, y)`：随机森林分类器在输入特征（`X`）和目标变量（`y`）上进行拟合。这意味着模型在提供的数据上进行训练。\n\
  \n###### 5. 创建结果 DataFrame\n\n*   `result_rf = pd.DataFrame()`：创建一个名为 `result_rf`\
  \ 的空 Pandas DataFrame，用于存储特征重要性。\n*   `result_rf['Features'] = X.columns`：在 `result_rf`\
  \ DataFrame 中创建一个名为 \"Features\" 的列，并用输入特征的名称填充。\n*   `result_rf['Values'] = rf.feature_importances_`：创建另一个名为\
  \ \"Values\" 的列，并用随机森林分类器计算出的特征重要性填充。这些值代表每个特征对模型预测的贡献程度。\n\n###### 6. 对特征重要性进行排序\n\
  \n`result_rf.sort_values('Values', inplace=True, ascending=False)`：`result_rf` DataFrame\
  \ 根据特征重要性按降序排序。这意味着最重要的特征将出现在 DataFrame 的顶部。\n\n###### 7. 返回结果 DataFrame\n\n`return\
  \ result_rf`：最后，该方法返回 `result_rf` DataFrame，其中包含特征名称及其由随机森林分类器计算出的相应重要性。\n\n此方法有助于识别哪些特征对模型预测影响最大，这对于特征选择和理解预测模型中各种因素的重要性非常有价值。\n\
  \n##### 基于极端随机树分类器的特征重要性\n\n在 `Process_Data` 类中，代码中的 `feat_importance_et()` 方法负责使用极端随机树分类器计算并返回特征重要性。该方法可用于在构建机器学习模型时理解数据集中不同特征的重要性。\n\
  \n```\ndef feat_importance_et(self, X, y):\n    model = ExtraTreesClassifier()\n\
  \    model.fit(X, y)\n    result_et = pd.DataFrame()\n    result_et['Features']\
  \ = X.columns\n    result_et['Values'] = model.feature_importances_\n    result_et.sort_values('Values',\
  \ inplace=True, ascending=False)\n    return result_et\n```\n\n让我们讨论一下该方法的工作原理：\n\
  \n###### 1. 方法定义\n\n`def feat_importance_et(self, X, y):` 该方法定义用于使用极端随机树分类器计算特征重要性。它接受三个参数：`self`，指代类的实例；`X`，包含输入特征的\
  \ Pandas DataFrame；`y`，包含目标变量（标签或类别）的 NumPy 数组。\n\n###### 2. 创建极端随机树分类器\n\n`model\
  \ = ExtraTreesClassifier()`：创建一个 `ExtraTreesClassifier` 实例。该分类器用于特征选择和分类任务。它是一种类似于随机森林的集成学习方法，但在构建和选择决策树的方式上有一些差异。\n\
  \n###### 3. 拟合模型\n\n`model.fit(X, y)`：极端随机树分类器在输入特征 `X` 和目标变量 `y` 上进行拟合。此步骤涉及在提供的数据上训练分类器，以学习特征与目标变量之间的模式和关系。\n\
  \n###### 4. 创建结果 DataFrame\n\n*   `result_et = pd.DataFrame()`：创建一个名为 `result_et`\
  \ 的空 Pandas DataFrame，用于存储特征重要性。\n*   `result_et['Features'] = X.columns`：向 `result_et`\
  \ DataFrame 添加一个名为 \"Features\" 的列，其中包含输入特征的名称。\n*   `result_et['Values'] = model.feature_importances_`：向\
  \ `result_et` DataFrame 添加另一个名为 \"Values\" 的列，其中包含由极端随机树分类器计算出的特征重要性。这些重要性代表每个特征对模型预测性能的贡献程度。\n\
  \n###### 5. 对特征重要性进行排序\n\n\n\n\nresult\\_et.sort\\_values('Values', inplace=True,\
  \ ascending=False)：`result_et` DataFrame 根据 \"Values\" 列按降序排序。这意味着最重要的特征将出现在 DataFrame\
  \ 的顶部。\n\n1.  返回结果 DataFrame：\n\n`return result_et`：最后，该方法返回 `result_et` DataFrame，其中包含特征名称及其由极端随机树分类器计算出的相应重要性。\n\
  \n该方法计算的特征重要性可用于特征选择、降维，以及深入了解哪些特征在使用机器学习模型进行预测时最具影响力。\n\n##### 使用递归特征消除 (RFE) 计算特征重要性\n\
  \n在 `Process_Data` 类中，代码中的 `feat_importance_rfe()` 方法负责使用逻辑回归模型通过递归特征消除 (RFE) 计算并返回特征排名。\n\
  \n```\ndef feat_importance_rfe(self, X, y):\n\n    model = LogisticRegression()\n\
  \n    #Creates the RFE model\n\n    rfe = RFE(model)\n\n    rfe = rfe.fit(X, y)\n\
  \n    result_lg = pd.DataFrame()\n\n    result_lg['Features'] = X.columns\n\n  \
  \  result_lg['Ranking'] = rfe.ranking_\n\n    result_lg.sort_values('Ranking', inplace=True\
  \ , ascending = False)\n\n    return result_lg\n```\n\n让我们分解一下该方法的工作原理：\n\n1.  方法定义：\n\
  \n`def feat_importance_rfe(self, X, y):` 这是一个方法定义，接受三个参数：`self`（类实例的引用）、`X`（包含输入特征的\
  \ Pandas DataFrame）和 `y`（包含目标变量的 NumPy 数组）。\n\n1.  创建逻辑回归模型：\n\n`model = LogisticRegression():`\
  \ 创建一个 `LogisticRegression` 分类器实例。逻辑回归被用作 RFE 过程中特征排名的基础模型。RFE 技术旨在通过迭代地使用不同特征子集训练模型来选择最重要的特征。\n\
  \n1.  创建 RFE 模型：\n\n`rfe = RFE(model):` 创建一个递归特征消除 (RFE) 技术的实例，以 `LogisticRegression`\
  \ 模型作为其基础估计器。RFE 通过递归地移除最不重要的特征来执行特征选择。\n\n1.  拟合 RFE 模型：\n\n`rfe = rfe.fit(X, y):`\
  \ 使用输入特征 `X` 和目标变量 `y` 拟合 RFE 模型。在此过程中，RFE 迭代地使用不同的特征子集训练逻辑回归模型，并根据特征的重要性为每个特征分配排名。\n\
  \n1.  创建结果 DataFrame：\n\n*   `result_lg = pd.DataFrame():` 创建一个名为 `result_lg` 的空\
  \ Pandas DataFrame，用于存储特征排名。\n\n*   `result_lg['Features'] = X.columns:` 向 `result_lg`\
  \ DataFrame 添加一个名为 \"Features\" 的列，包含输入特征的名称。\n\n*   `result_lg['Ranking'] = rfe.ranking_:`\
  \ 向 `result_lg` DataFrame 添加另一个名为 \"Ranking\" 的列，包含 RFE 过程分配的特征排名。**排名值越低表示特征越重要**。\n\
  \n1.  对特征排名进行排序：\n\n`result_lg.sort_values('Ranking', inplace=True, ascending=False):`\
  \ `result_lg` DataFrame 根据 \"Ranking\" 列按降序排序。这意味着排名较低（更重要）的特征将出现在 DataFrame 的顶部。\n\
  \n1.  返回结果 DataFrame：\n\n`return result_lg:` 最后，该方法返回 `result_lg` DataFrame，其中包含基于\
  \ RFE 过程的特征名称及其相应排名。\n\nRFE 技术用于特征选择，有助于识别给定机器学习任务中最重要的特征。在本例中，排名指示了使用逻辑回归模型进行预测时每个特征的相对重要性。\n\
  \n##### 保存预测结果\n\n在 `Process_Data` 类中，代码中的 `save_result()` 方法负责将预测任务的结果保存到 CSV 文件中。该方法接收实际目标值\
  \ (`y_test`)、预测值 (`y_pred`) 和文件名 (`fname`) 作为输入，然后将结果保存到 CSV 文件中。\n\n```\ndef save_result(self,\
  \ y_test, y_pred, fname):\n\n    # Convert y_test and y_pred to pandas Series for\
  \ easier handling\n\n    y_test_series = pd.Series(y_test)\n\n    y_pred_series\
  \ = pd.Series(y_pred)\n\n    # Calculate y_result_series\n\n    y_result_series\
  \ = pd.Series(y_pred - y_test == 0)\n\n    y_result_series = y_result_series.map({True:\
  \ 'True', False: 'False'})\n\n    # Create a DataFrame to hold y_test, y_pred, and\
  \ y_result\n\n    data = pd.DataFrame({'y_test': y_test_series, 'y_pred': y_pred_series,\
  \ 'result': y_result_series})\n\n    # Save the DataFrame to a CSV file\n\n    data.to_csv(fname,\
  \ index=False)\n```\n\n以下是该方法工作原理的分解：\n\n1.  方法定义：\n\n`def save_result(self, y_test,\
  \ y_pred, fname):` 这是一个方法定义，接受四个参数：`self`（指代类的实例）、`y_test`（包含实际目标值的 NumPy 数组或 Pandas\
  \ Series）、`y_pred`（包含预测值的 NumPy 数组或 Pandas Series）和 `fname`（表示用于保存结果的文件名的字符串）。\n\
  \n1.  转换为 Pandas Series：\n\n*   `y_test_series = pd.Series(y_test):` `y_test` 数组被转换为名为\
  \ `y_test_series` 的 Pandas Series。这种转换使其更易于操作并与其他 Series 结合。\n\n*   `y_pred_series\
  \ = pd.Series(y_pred):` 同样，`y_pred` 数组被转换为名为 `y_pred_series` 的 Pandas Series。\n\n\
  1.  计算结果 Series：\n\n*   `y_result_series = pd.Series(y_pred - y_test == 0):` 此行计算一个名为\
  \ `y_result_series` 的结果 Series。它逐元素比较预测值 (`y_pred`) 与实际值 (`y_test`) 并检查它们是否相等。结果是一个布尔\
  \ Series，其中 `True` 表示预测正确，`False` 表示预测错误。\n\n*   `y_result_series = y_result_series.map({True:\
  \ 'True', False: 'False'}):` `y_result_series` 中的布尔值被映射为字符串 'True' 和 'False'，使其更具可读性。\n\
  \n1.  创建结果 DataFrame：\n\n`data = pd.DataFrame({'y_test': y_test_series, 'y_pred':\
  \ y_pred_series, 'result': y_result_series}):` 创建一个名为 `data` 的 Pandas DataFrame，用于容纳三列：'y_test'（包含实际目标值）、'y_pred'（包含预测值）和\
  \ 'result'（基于预测正确性包含 'True' 或 'False'）。该 DataFrame 将实际值和预测值与结果结合在一起。\n\n1.  将 DataFrame\
  \ 保存为 CSV：\n\n`data.to_csv(fname, index=False):` `data` DataFrame 被保存为由 `fname`\
  \ 参数指定名称的 CSV 文件。`index=False` 参数确保 DataFrame 索引不保存在 CSV 文件中。\n\n总之，该方法接收实际值和预测值，计算每个预测是否正确，并将该信息连同原始值一起存储在\
  \ CSV 文件中，以便进一步分析和报告。这有助于评估机器学习模型的性能并比较实际结果与预测结果。\n\n#### Helper_Plot 类\n\n创建一个名为\
