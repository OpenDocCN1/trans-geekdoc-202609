  \ self.obj_window.figure2,\n                                 self.obj_window.canvas2)\n\
  ```\n\n`choose_combobox4` 方法负责处理应用程序图形用户界面（GUI）中第四个下拉框（`combo4`）的用户交互。当从 `combo4`\
  \ 中选择某一项时，会触发此方法。以下是其目的和功能的解释：\n\n######## 1. 事件绑定\n\n该方法通过 `bind` 方法绑定到 `combo4`\
  \ 的 `<<ComboboxSelected>>` 事件。这意味着每当用户从 `combo4` 选择一项时，该方法都会自动执行以响应该事件。\n\n########\
  \ 2. 事件处理\n\n当从 `combo4` 选择一项时，`event` 参数包含事件信息，尽管该方法中未使用它。\n\n######## 3. 获取选定选项\n\
  \n该方法使用 `get` 方法从 `combo4` 检索选定的选项。该选项存储在 `chosen` 变量中，代表用户的选择。\n\n######## 4. 调用\
  \ `choose_plot_ML()` 方法\n\n将选定的选项连同其他必要数据（训练/测试数据集、图形对象、画布对象）作为参数传递给 `obj_plot`\
  \ 对象的 `choose_plot_ML()` 方法。该方法负责根据用户的选择显示特定的机器学习相关图表和结果。\n\n总之，`choose_combobox4()`\
  \ 方法是一个响应 `combo4` 用户选择的回调函数。它获取用户的选择并触发相应的操作，以根据该选择显示机器学习相关的图表和结果。\n\n最后，将以下代码添加到\
  \ `Main_Class` 中 `binds_event()` 方法的末尾：\n\n```\n###### Binds button2 to train_ML()\
  \ function\nself.obj_window.button2.config(command=self.train_ML)\n###### Binds\
  \ combobox4 to a function\nself.obj_window.combo4.bind(\"<<ComboboxSelected>>\"\
  , self.choose_combobox4)\n```\n\n这些代码行负责为应用程序中 GUI 元素的用户交互设置事件绑定：\n\n1.  **将按钮绑定到函数**：\n\
  \    `self.obj_window.button2.config(command=self.train_ML)` 将 `button2` 的 `command`\
  \ 属性绑定到 `train_ML` 函数。这意味着当用户点击 `button2` 时，将执行 `train_ML` 函数。\n\n2.  **将下拉框绑定到函数**：\n\
  \    `self.obj_window.combo4.bind(\"<<ComboboxSelected>>\", self.choose_combobox4)`\
  \ 将 `combo4` 的 `<<ComboboxSelected>>` 事件绑定到 `choose_combobox4` 函数。当用户从 `combo4`\
  \ 选择一项时，将调用 `choose_combobox4` 函数来处理该事件。\n\n总之，这些代码建立了事件绑定，以确保在用户操作时执行指定的函数。点击 `button2`\
  \ 时将调用 `train_ML()`，从 `combo4` 选择项目时将调用 `choose_combobox4()` 处理事件，使应用程序能够响应用户交互。\n\
  \n运行 `main_class.py`。接着，点击 **SPLIT DATA** 按钮。然后，选择 **Logistic Regression** 查看使用\
