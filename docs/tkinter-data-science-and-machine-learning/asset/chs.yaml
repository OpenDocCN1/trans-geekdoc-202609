  \ import classification_report, f1_score, plot_confusion_matrix\nfrom sklearn.ensemble\
  \ import RandomForestClassifier\nfrom sklearn.neighbors import KNeighborsClassifier\n\
  from sklearn.tree import DecisionTreeClassifier\nfrom sklearn.ensemble import AdaBoostClassifier,\
  \ GradientBoostingClassifier\nfrom xgboost import XGBClassifier\nfrom sklearn.neural_network\
  \ import MLPClassifier\nfrom sklearn.svm import SVC\nimport os\nimport joblib\n\
  import pandas as pd\nfrom process_data import Process_Data\n\nclass Machine_Learning:\n\
  \    def __init__(self):\n        self.obj_data = Process_Data()\n```\n\n######\
  \ 过采样与数据分割\n\n在 `Machine_Learning` 类中，定义一个名为 `oversampling_splitting()` 的新方法，如下所示：\n\
  \n```python\ndef oversampling_splitting(self, X, y):\n    sm = SMOTE(random_state=42)\n\
  \    X, y = sm.fit_resample(X, y.ravel())\n    # Splits the data into training and\
  \ testing\n    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2,\
  \ random_state=2021, stratify=y)\n    # Use Standard Scaler\n    scaler = StandardScaler()\n\
  \    X_train_stand = scaler.fit_transform(X_train)\n    X_test_stand = scaler.transform(X_test)\n\
  \    # Saves into pkl files\n    joblib.dump(X_train_stand, 'X_train.pkl')\n   \
  \ joblib.dump(X_test_stand, 'X_test.pkl')\n    joblib.dump(y_train, 'y_train.pkl')\n\
  \    joblib.dump(y_test, 'y_test.pkl')\n```\n\n`oversampling_splitting()` 方法在 `Machine_Learning`\
  \ 类中执行以下任务：\n\n1.  **过采样**：它使用合成少数类过采样技术 (`SMOTE`) 来解决类别不平衡问题。`SMOTE` 生成少数类的合成样本以平衡类别分布。这是为了防止模型偏向多数类。生成的过采样数据集存储在\
  \ `X` 和 `y` 中。\n2.  **训练-测试分割**：过采样后，该方法使用 `sklearn.model_selection` 中的 `train_test_split`\
  \ 将数据集分割为训练集和测试集。`test_size` 参数控制分配给测试集的数据比例（在本例中为 20% 的数据），`stratify=y` 确保训练集和测试集中的类别分布得以保留。\n\
  3.  **特征缩放**：它使用 `sklearn.preprocessing` 中的 `StandardScaler` 对训练集和测试集中的特征进行缩放。特征缩放对于确保所有特征具有相同的尺度至关重要，这可以提高许多机器学习算法的性能。\n\
  4.  **保存数据**：最后，该方法将缩放后的训练和测试数据以及相应的标签（`y_train` 和 `y_test`）保存到单独的 pickle (`.pkl`)\
  \ 文件中。这些文件可用于将来训练和评估机器学习模型，而无需再次执行数据预处理。\n\n\n\n\n\n###### 总体概述\n\n`oversampling_splitting()`\
  \ 方法通过解决类别不平衡问题、将数据拆分为训练集和测试集、执行特征缩放以及保存预处理后的数据以供后续使用，来为机器学习准备数据。这是机器学习工作流程中的关键步骤，旨在确保模型在合适的数据上进行训练，并能轻松复用于预测。\n\
  \n###### 加载文件\n\n在 `Machine_Learning` 类中，定义一个名为 `loading_files()` 的新方法，如下所示：\n\n\
  ```python\ndef load_files(self):\n    X_train = joblib.load('X_train.pkl')\n   \
  \ X_test = joblib.load('X_test.pkl')\n    y_train = joblib.load('y_train.pkl')\n\
  \    y_test = joblib.load('y_test.pkl')\n    return X_train, X_test, y_train, y_test\n\
  ```\n\n`Machine_Learning` 类中的 `load_files()` 方法负责从先前使用 `oversampling_splitting`\
  \ 方法保存的 pickle (pkl) 文件中加载预处理后的训练和测试数据。以下是该方法的功能：\n\n####### 1. 加载数据\n\n它使用 `joblib.load`\
  \ 函数加载以下数据文件：\n\n*   `X_train.pkl`：该文件包含训练数据集经过预处理和缩放后的特征 (`X`)。\n*   `X_test.pkl`：该文件包含测试数据集经过预处理和缩放后的特征\
  \ (`X`)。\n*   `y_train.pkl`：该文件包含与训练数据集对应的标签 (`y`)。\n*   `y_test.pkl`：该文件包含与测试数据集对应的标签\
  \ (`y`)。\n\n####### 2. 返回数据\n\n加载这些文件后，该方法返回四个变量：\n\n*   `X_train`：训练数据集经过预处理和缩放后的特征。\n\
  *   `X_test`：测试数据集经过预处理和缩放后的特征。\n*   `y_train`：与训练数据集对应的标签。\n*   `y_test`：与测试数据集对应的标签。\n\
  \n该方法的目的是提供一种便捷的方式来访问预处理后的数据，随后可用于训练和评估机器学习模型，而无需再次执行数据预处理。将数据加载和预处理与建模过程分离，使得维护和复用机器学习流水线变得更加容易。\n\
