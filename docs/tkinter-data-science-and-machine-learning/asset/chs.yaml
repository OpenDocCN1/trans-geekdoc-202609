  import os\nimport joblib\nimport pandas as pd\nfrom process_data import Process_Data\n\
  ```\n\n####### 类 `Machine_Learning`\n\n######## `__init__(self)`\n初始化 `Process_Data`\
  \ 对象。\n\n```python\ndef __init__(self):\n    self.obj_data = Process_Data()\n```\n\
  \n######## `oversampling_splitting(self, X, y)`\n使用 `SMOTE` 过采样，划分训练/测试集，标准化并保存为\
  \ `.pkl` 文件。\n\n```python\ndef oversampling_splitting(self, X, y):\n    sm = SMOTE(random_state=42)\n\
  \    X, y = sm.fit_resample(X, y.ravel())\n    # Splits the data into training and\
  \ testing\n    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2,\
  \ random_state=2021, stratify=y)\n    # Use Standard Scaler\n    scaler = StandardScaler()\n\
  \    X_train_stand = scaler.fit_transform(X_train)\n    X_test_stand = scaler.transform(X_test)\n\
  \    # Saves into pkl files\n    joblib.dump(X_train_stand, 'X_train.pkl')\n   \
  \ joblib.dump(X_test_stand, 'X_test.pkl')\n    joblib.dump(y_train, 'y_train.pkl')\n\
  \    joblib.dump(y_test, 'y_test.pkl')\n```\n\n######## `load_files(self)`\n加载之前保存的\
  \ `.pkl` 文件。\n\n```python\ndef load_files(self):\n    X_train = joblib.load('X_train.pkl')\n\
  \    X_test = joblib.load('X_test.pkl')\n    y_train = joblib.load('y_train.pkl')\n\
  \    y_test = joblib.load('y_test.pkl')\n    return X_train, X_test, y_train, y_test\n\
  ```\n\n######## `choose_feats_boundary(self, X, y)`\n根据列索引 `feat_boundary` 选择特征子集，划分数据集并缓存。\n\
  \n```python\ndef choose_feats_boundary(self, X, y):\n    file_path = os.getcwd()\n\
  \    X_train_feat_path = os.path.join(file_path, 'X_train_feat.pkl')\n    X_test_feat_path\
  \ = os.path.join(file_path, 'X_test_feat.pkl')\n    y_train_feat_path = os.path.join(file_path,\
  \ 'y_train_feat.pkl')\n    y_test_feat_path = os.path.join(file_path, 'y_test_feat.pkl')\n\
  \n    if os.path.exists(X_train_feat_path):\n        X_train_feat = joblib.load(X_train_feat_path)\n\
  \        X_test_feat = joblib.load(X_test_feat_path)\n        y_train_feat = joblib.load(y_train_feat_path)\n\
  \        y_test_feat = joblib.load(y_test_feat_path)\n    else:\n        # Make\
  \ sure feat_boundary contains valid column indices from your X array\n        feat_boundary\
  \ = [1, 2]  # actual indices\n        if all(idx < X.shape[1] for idx in feat_boundary):\n\
  \            X_feature = X[:, feat_boundary]\n            X_train_feat, X_test_feat,\
  \ y_train_feat, y_test_feat = train_test_split(\n                X_feature, y, test_size=0.2,\
  \ random_state=2021, stratify=y\n            )\n            # Saves into pkl files\n\
  \            joblib.dump(X_train_feat, X_train_feat_path)\n            joblib.dump(X_test_feat,\
  \ X_test_feat_path)\n            joblib.dump(y_train_feat, y_train_feat_path)\n\
  \            joblib.dump(y_test_feat, y_test_feat_path)\n        else:\n       \
  \     raise ValueError(\"Indices in feat_boundary exceed the number of columns in\
  \ X array\")\n    return X_train_feat, X_test_feat, y_train_feat, y_test_feat\n\
  ```\n\n######## `train_model(self, model, X, y)`\n通用模型训练方法。\n\n```python\ndef train_model(self,\
  \ model, X, y):\n    model.fit(X, y)\n    return model\n```\n\n######## `predict_model(self,\
  \ model, X, proba=False)`\n模型预测，支持概率输出模式。\n\n```python\ndef predict_model(self,\
  \ model, X, proba=False):\n    if ~proba:\n        y_pred = model.predict(X)\n \
  \   else:\n        y_pred_proba = model.predict_proba(X)\n        y_pred = np.argmax(y_pred_proba,\
  \ axis=1)\n    return y_pred\n```\n\n######## `run_model(self, name, model, X_train,\
  \ X_test, y_train, y_test, proba=False)`\n运行模型评估，打印准确率、召回率、精确率、F1 值及分类报告。\n\n```python\n\
  def run_model(self, name, model, X_train, X_test, y_train, y_test, proba=False):\n\
  \    y_pred = self.predict_model(model, X_test, proba)\n    accuracy = accuracy_score(y_test,\
  \ y_pred)\n    recall = recall_score(y_test, y_pred, average='weighted')\n    precision\
  \ = precision_score(y_test, y_pred, average='weighted')\n    f1 = f1_score(y_test,\
  \ y_pred, average='weighted')\n    print(name)\n    print('accuracy: ', accuracy)\n\
  \    print('recall: ', recall)\n    print('precision: ', precision)\n    print('f1:\
  \ ', f1)\n    print(classification_report(y_test, y_pred))\n    return y_pred\n\
