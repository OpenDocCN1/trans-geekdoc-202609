  \ == 0][feat].plot(ax=plot1, kind='hist', bins=num_bins, edgecolor='black', color=colors[0])`：此行创建\
  \ \"Not Responsive\" 类别的直方图。它筛选 DataFrame 以仅选择 `Response` 为 0 的行，并使用指定的箱数 (`num_bins`)\
  \ 绘制指定特征 (`feat`) 的直方图。设置了边缘颜色和颜色等自定义选项。\n*   对于 \"Responsive\" 类别（`Response` 为\
  \ 1），在下部子图 (`plot2`) 中重复相同步骤创建直方图。\n\n###### 4. 自定义\n\n*   为两个子图设置标题、x 轴标签和 y 轴标签，为直方图提供上下文。\n\
  *   在每个直方图条形的顶部添加注释，以显示每个箱中的数据点计数。\n\n###### 5. 紧凑布局和绘制\n\n*   `figure.tight_layout()`：此行确保子图在图形内整齐排列。\n\
  *   `canvas.draw()`：此行在画布上绘制子图，使其在 Matplotlib 图形中可见。\n\n\n\n\n\n##### 绘制堆叠柱状图\n\n\
  在 `Helper_Plot` 类中，`put_label_stacked_bar()` 和 `dist_one_vs_another_plot()` 方法用于创建堆叠柱状图，以可视化两个分类变量之间的关系。\n\
  \n该代码旨在使用 Python 的 Tkinter 库创建一个图形用户界面（GUI）应用程序，用于数据科学背景下的数据分析和可视化。该应用程序旨在协助用户加载、探索和分析数据集，执行数据预处理任务，并生成各种数据可视化图表。\n\
  \n```python\n###### Puts label inside stacked bar\ndef put_label_stacked_bar(self,\
  \ ax, fontsize):\n    # patches is everything inside of the chart\n    for rect\
  \ in ax.patches:\n        # Find where everything is located\n        height = rect.get_height()\n\
  \        width = rect.get_width()\n        x = rect.get_x()\n        y = rect.get_y()\n\
  \n        # The height of the bar is the data value and can be used as the label\n\
  \        label_text = f'{height:.0f}'\n\n        # ax.text(x, y, text)\n       \
  \ label_x = x + width / 2\n        label_y = y + height / 2\n\n        # plots only\
  \ when height is greater than specified value\n        if height > 0:\n        \
  \    ax.text(label_x, label_y, label_text, \\\n                    ha='center',\
  \ va='center', \\\n                    weight=\"bold\", fontsize=fontsize)\n\n######\
  \ Plots one variable against another variable\ndef dist_one_vs_another_plot(self,\
  \ df, cat1, cat2, figure, canvas, title):\n    figure.clear()\n    plot1 = figure.add_subplot(1,\
  \ 1, 1)\n    group_by_stat = df.groupby([cat1, cat2]).size()\n    colors = sns.color_palette(\"\
  Set2\", len(df[cat1].unique()))\n    stacked_data = group_by_stat.unstack()\n  \
  \  group_by_stat.unstack().plot(kind='bar', stacked=True, ax=plot1, grid=True, color=colors)\n\
  \n    plot1.set_title(title, fontsize=12)\n    plot1.set_ylabel('Number of Cases',\
  \ fontsize=10)\n    plot1.set_xlabel(cat1, fontsize=10)\n\n    self.put_label_stacked_bar(plot1,\
  \ 7)\n\n    # Set font for tick labels\n    plot1.tick_params(axis='both', which='major',\
  \ labelsize=8)\n    plot1.tick_params(axis='both', which='minor', labelsize=8)\n\
  \    plot1.legend(fontsize=8)\n\n    figure.tight_layout()\n    canvas.draw()\n\
  ```\n\n让我们分解一下这些方法的工作原理：\n\n####### 1. `put_label_stacked_bar` 方法\n\n此方法负责在堆叠柱状图的每个柱子内部添加标签。\n\
  \n*   `ax`：此参数表示绘制堆叠柱状图的 `Axes` 对象（子图）。\n*   `fontsize`：此参数指定标签的字体大小。\n\n方法工作流程如下：\n\
  \n*   它遍历堆叠柱状图中的每个柱子（矩形）。\n*   对于每个柱子，它检索其位置、高度、宽度和坐标信息。\n*   柱子的高度（数据值）被用作标签文本。\n\
  *   标签的位置（`label_x` 和 `label_y`）计算为柱子的中心。\n*   仅当柱子的高度大于指定值（0）时，才会在柱子内部放置标签（确保小柱子不会因标签而显得杂乱）。\n\
  \n####### 2. `dist_one_vs_another_plot()` 方法\n\n此方法创建一个堆叠柱状图，以可视化一个分类变量相对于另一个分类变量的分布。该图表表示两个分类变量每种组合的案例数量。\n\
  \n*   `df`：此参数是一个包含待可视化数据的 Pandas `DataFrame`。\n*   `cat1`：此参数是一个字符串，代表第一个分类变量。\n\
  *   `cat2`：此参数是一个字符串，代表第二个分类变量。\n*   `figure`：此参数是一个 Matplotlib `Figure` 对象，堆叠柱状图将在其中创建。\n\
  *   `canvas`：此参数是一个 Matplotlib `FigureCanvasTkAgg` 对象，用于绘制图表。\n*   `title`：此参数是一个字符串，指定图表的标题。\n\
  \n方法工作流程如下：\n\n*   它首先清除 Matplotlib 图形中的任何先前内容。\n*   它在图形中创建一个单一的子图（`plot1`）来显示堆叠柱状图。\n\
  *   数据按两个分类变量（`cat1` 和 `cat2`）分组，并计算每组的大小。\n*   为 `cat1` 中的每个类别定义颜色。\n*   然后对数据进行取消堆叠，并创建一个堆叠柱状图，柱子代表\
  \ `cat1` 和 `cat2` 每种组合的案例数量。\n*   使用 `put_label_stacked_bar` 方法在每个柱子内部添加标签。\n* \
  \  图表通过标题、轴标签、图例、网格和刻度标签字体进行自定义。\n*   最后，图表绘制在画布上，并确保子图在图形内整齐排列。\n\n总之，这些方法帮助您使用堆叠柱状图可视化分类变量之间的分布和关系，并确保标签放置在柱子内部以提高可读性。\n\
  \n##### 箱线图可视化\n\n在 `Helper_Plot` 类中，`box_plot()` 方法旨在创建数据集的箱线图可视化，显示由两个分类变量（`x`\
  \ 和 `hue`）指定的不同类别或组别的数值变量（`y`）的分布。这种类型的图表对于跨不同类别可视化数值变量的分布、识别每个类别内的潜在异常值或变化非常有用。\n\
  \n```python\ndef box_plot(self, df, x, y, hue, figure, canvas, title):\n    figure.clear()\n\
  \    plot1 = figure.add_subplot(1, 1, 1)\n\n    # Creates boxplot of Num_TotalPurchases\
  \ versus Num_Dependants\n    sns.boxplot(data=df, x=x, y=y, hue=hue, ax=plot1)\n\
  \n    plot1.set_title(title, fontsize=14)\n    plot1.set_xlabel(x, fontsize=10)\n\
  \    plot1.set_ylabel(y, fontsize=10)\n\n    figure.tight_layout()\n    canvas.draw()\n\
  ```\n\n以下是该方法参数和功能的解释：\n\n*   `df`：包含待可视化数据的数据集（`DataFrame`）。\n*   `x`：第一个分类变量的名称，它决定了箱线图\
  \ x 轴上的组别或类别。\n*   `y`：将使用箱线图可视化其分布的数值变量的名称。该变量的分布将使用箱体和须线表示。\n*   `hue`：第二个分类变量的名称（可选）。如果指定，它决定了箱线图的颜色编码，允许您区分由\
  \ `x` 定义的主要类别内的组别。当您想要可视化第三个分类维度时，这非常有用。\n*   `figure`：将在其中创建箱线图的 Matplotlib `figure`\
  \ 对象。在创建新的箱线图之前，应清除 figure 对象，以避免与之前的可视化重叠。\n*   `canvas`：与 figure 关联的 Matplotlib\
  \ 画布。此画布用于显示更新后的图表。\n*   `title`：箱线图的标题，显示在可视化图表上方。\n\n`box_plot` 方法的主要步骤和功能如下：\n\
  \n1.  它清除 Matplotlib 图形中的任何现有内容，为新的箱线图做准备。\n2.  它使用 `figure.add_subplot(1, 1, 1)`\
  \ 在图形中创建一个子图。\n3.  它使用 Seaborn 的 `sns.boxplot` 函数生成箱线图。箱线图显示由 `x` 定义的每个类别的 `y` 变量分布，如果指定了\
  \ `hue`，则进一步按其区分。\n4.  它根据提供的参数（`title`、`x` 和 `y`）设置箱线图的标题、x 轴标签和 y 轴标签。\n\n\n\n\
  \n\n###### 5. 最后，它收紧图形中绘图的布局，确保绘图元素不重叠，然后更新画布以显示新的箱线图。\n\n总之，`box_plot()` 方法允许用户可视化一个数值变量在由一个或两个分类变量定义的不同类别或组中的分布。生成的箱线图提供了关于每个类别内数据的中心趋势、离散程度和潜在异常值的见解，使其成为探索性数据分析的宝贵工具。\n\
  \n##### 婚姻状况分布\n\n在 `Helper_Plot` 类中，`choose_plot()` 方法专注于根据用户从下拉菜单或输入框中选择的内容（`chosen`）来选择并显示特定类型的图表。\n\
  \n```python\ndef choose_plot(self, df1, df2, chosen, figure1, canvas1, figure2,\
  \ canvas2):\n    print(chosen)\n    if chosen == \"Marital Status\":\n        self.plot_piechart(df2,\
  \ \"Marital_Status\", figure1, canvas1)\n```\n\n以下是该方法参数和功能的说明：\n\n*   `df1` 和 `df2`：这些是代表不同数据子集的\
  \ DataFrame。其中 `df2` 是 `df1` 的修改版或分类版，可用于特定类型的可视化。\n*   `chosen`：此参数代表用户的选择，通常来自下拉菜单或输入控件。它决定了根据用户的选择生成哪种类型的图表。\n\
  *   `figure1` 和 `canvas1`：这些是 Matplotlib 的图形和画布对象，第一种类型的图表将在此创建并显示。\n*   `figure2`\
  \ 和 `canvas2`：与 `figure1` 和 `canvas1` 类似，这些对象用于显示可能与第一个图表一同展示的另一种类型的图表。\n\n这段代码的作用如下：\n\
  \n1.  它检查 `chosen` 参数的值，以确定其是否与特定选项匹配，本例中为 \"Marital Status\"。\n2.  如果用户选择了 \"Marital\
  \ Status\"，它将使用特定参数调用 `plot_piechart()` 方法：\n    *   `df2`：包含与婚姻状况相关数据的 DataFrame。\n\
  \    *   `\"Marital_Status\"`：这是 `df2` 中将用于创建饼图的变量（列）名。\n    *   `figure1` 和 `canvas1`：这些是将显示饼图的\
  \ Matplotlib 图形和画布对象。\n3.  `plot_piechart()` 方法预期将根据 `df2` 中的数据创建并显示婚姻状况分布的饼图。\n\
  \n总之，`choose_plot()` 方法负责根据用户的选择（`chosen`）确定要显示的图表类型。如果用户选择 \"Marital Status\"，它将触发使用\
  \ `df2` 中数据创建的婚姻状况分布饼图的生成。这种方法允许根据用户输入动态生成图表。\n\n##### 修改 Main_Class 类\n\n######\
  \ `main_class.py`\n\n```python\nimport os\nimport tkinter as tk\nfrom tkinter import\
  \ *\nfrom design_window import Design_Window\nfrom process_data import Process_Data\n\
  from helper_plot import Helper_Plot\n\nclass Main_Class:\n    def __init__(self,\
  \ root):\n        self.initialize()\n\n    def initialize(self):\n        self.root\
  \ = root\n        width = 1500\n        height = 750\n        self.root.geometry(f\"\
  {width}x{height}\")\n        self.root.title(\"TKINTER AND DATA SCIENCE\")\n   \
  \     \n        # Creates necessary objects\n        self.obj_window = Design_Window()\n\
  \        self.obj_data = Process_Data()\n        self.obj_plot = Helper_Plot()\n\
  \        \n        # Places widgets in root\n        self.obj_window.add_widgets(self.root)\n\
  \        \n        # Reads dataset\n        self.df = self.obj_data.preprocess()\n\
  \        \n        # Categorize dataset\n        self.df_dummy = self.obj_data.categorize(self.df)\n\
  \        \n        # Extracts input and output variables\n        self.cat_cols,\
  \ self.num_cols = self.obj_data.extract_cat_num_cols(self.df)\n        self.df_final\
  \ = self.obj_data.encode_categorical_feats(self.df, self.cat_cols)\n        self.X,\
  \ self.y = self.obj_data.extract_input_output_vars(self.df_final)\n        \n  \
  \      # Binds event\n        self.binds_event()\n        \n        # Initially\
  \ turns off combo4 and combo5 before data splitting is done\n        self.obj_window.combo4['state']\
  \ = 'disabled'\n        self.obj_window.combo5['state'] = 'disabled'\n\n    def\
  \ binds_event(self):\n        # Binds button1 to shows_table() function\n      \
  \  # Shows table if user clicks LOAD DATASET\n        self.obj_window.button1.config(command=lambda:\
  \ self.obj_plot.shows_table(self.root, self.df, 1400, 600, \"Dataset\"))\n     \
  \   \n        # Binds listbox to a function\n        self.obj_window.listbox.bind(\"\
  <<ListboxSelect>>\", self.choose_list_widget)\n\n    def choose_list_widget(self,\
  \ event):\n        chosen = self.obj_window.listbox.get(self.obj_window.listbox.curselection())\n\
  \        print(chosen)\n        self.obj_plot.choose_plot(self.df, self.df_dummy,\
  \ chosen,\n                                  self.obj_window.figure1, self.obj_window.canvas1,\n\
  \                                  self.obj_window.figure2, self.obj_window.canvas2)\n\
  \nif __name__ == \"__main__\":\n    root = tk.Tk()\n    app = Main_Class(root)\n\
  \    root.mainloop()\n```\n\n这行代码将事件处理函数绑定到 `Listbox` 控件的 `<<ListboxSelect>>` 事件。\n\
  \n```python\n####### Binds listbox to a function\nself.obj_window.listbox.bind(\"\
  <<ListboxSelect>>\", self.choose_list_widget)\n```\n\n其作用如下：\n\n1.  `self.obj_window.listbox`：指的是\
  \ `obj_window` 对象（`Design_Window` 类的实例）中创建的 `Listbox` 控件。\n2.  `.bind(\"<<ListboxSelect>>\"\
  , self.choose_list_widget)`：这是绑定语句。\n3.  `\"<<ListboxSelect>>\"`：这是被绑定函数的事件。当 `Listbox`\
  \ 中的项目被选中时，会触发此事件。\n4.  `self.choose_list_widget`：这是当 `<<ListboxSelect>>` 事件发生时将要执行的函数（事件处理程序）。在本例中，它是\
  \ `Main_Class` 类的 `choose_list_widget` 方法。\n\n当用户通过点击在 `Listbox` 中选择一个项目时，会触发 `<<ListboxSelect>>`\
  \ 事件。当此事件发生时，将执行 `choose_list_widget` 方法（`self.choose_list_widget`）。这允许你定义当用户从 `Listbox`\
  \ 选择项目时应发生的特定动作或行为。\n\n然后，在 `Main_Class` 中添加一个名为 `choose_list_widget()` 的新方法。它是一个事件处理程序，当\
  \ `<<ListboxSelect>>` 事件发生时执行，即当用户在 `Listbox` 控件中选择一个项目时。\n\n```python\ndef choose_list_widget(self,\
  \ event):\n    chosen = self.obj_window.listbox.get(self.obj_window.listbox.curselection())\n\
  \    print(chosen)\n    self.obj_plot.choose_plot(self.df, self.df_dummy, chosen,\n\
  \                              self.obj_window.figure1, self.obj_window.canvas1,\n\
  \                              self.obj_window.figure2, self.obj_window.canvas2)\n\
  ```\n\n以下是该函数功能的细分：\n\n1.  `chosen = self.obj_window.listbox.get(self.obj_window.listbox.curselection())`：此行使用\
  \ `curselection()` 方法从 `Listbox` 控件（`self.obj_window.listbox`）检索当前选中的项目。它将选中的项目赋值给\
  \ `chosen` 变量。由于 `Listbox` 可以支持多选（如果配置为如此），`chosen` 将包含选中项目的列表。\n2.  `print(chosen)`：此行仅将选中的项目打印到控制台。这是用于调试或信息目的，帮助你查看用户选择了什么。\n\
  3.  `self.obj_plot.choose_plot(...)`：此行调用 `self.obj_plot` 对象（`Helper_Plot` 类的实例）的\
  \ `choose_plot()` 方法。它向该方法传递几个参数：\n    *   `self.df`：包含数据的主 DataFrame。\n    *  \
  \ `self.df_dummy`：另一个 DataFrame，是主 DataFrame 的修改版本，用于可视化目的。\n    *   `chosen`：`Listbox`\
  \ 中选中的项目，代表用户的选择。\n    *   `self.obj_window.figure1` 和 `self.obj_window.canvas1`：用于在用户界面中显示图表的对象。\n\
  \    *   `self.obj_window.figure2` 和 `self.obj_window.canvas2`：用于显示图表的附加对象。\n\n\n\
  \n\n根据选定的项目（`chosen`），`choose_plot()` 方法会使用提供的数据和 UI 元素生成并显示特定类型的数据可视化。\n\n总之，`choose_list_widget()`\
  \ 函数充当了用户在 Listbox 中的选择与应用程序中特定数据可视化生成之间的桥梁。它允许用户以交互方式选择他们想要查看的可视化类型。\n\n然后，运行 `main_class.py`。在列表控件中选择**婚姻状况**，即可查看数据集中婚姻状况的分布，如图\
