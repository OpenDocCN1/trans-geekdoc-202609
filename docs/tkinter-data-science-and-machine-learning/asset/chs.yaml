  \n---\n\n###### K-近邻分类器与网格搜索\n\n在 `Machine_Learning` 类中，定义一个名为 `knearest_neighbors()`\
  \ 的新方法，如下所示：\n\n```python\ndef knearest_neighbors(self, name, X_train, X_test, y_train,\
  \ y_test):\n    # KNN Classifier\n    # Define the parameter grid for the grid search\n\
  \    param_grid = {\n        'n_neighbors': list(range(2, 10))\n    }\n\n    # Initialize\
  \ the KNN Classifier\n    knn = KNeighborsClassifier()\n\n    # Create GridSearchCV\
  \ with the KNN model and the parameter grid\n    grid_search = GridSearchCV(knn,\
  \ param_grid, cv=3, scoring='accuracy', n_jobs=-1)\n\n    # Train and perform grid\
  \ search\n    grid_search.fit(X_train, y_train)\n\n    # Get the best KNN model\
  \ from the grid search\n    best_model = grid_search.best_estimator_\n\n    # Saves\
