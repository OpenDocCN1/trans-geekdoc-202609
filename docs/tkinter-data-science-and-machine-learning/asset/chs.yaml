  \ `figure2` 关联的 Matplotlib 画布对象。\n\n####### 2. 基于所选算法的条件块\n\n该方法检查 `chosen` 变量的值以确定选择了哪种机器学习算法。\n\
  \n####### 3. 逻辑回归（所选算法）\n\n\n\n\n如果选择的算法是“Logistic Regression”，则会调用 `Machine_Learning`\
