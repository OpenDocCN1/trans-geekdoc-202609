  \n![Image](img/image28.png)\n\n**图 26** 分类肉类产品购买金额与分类近期度的分布\n\n##### 绘制相关性矩阵\n\n\
  在 `Helper_Plot` 类中添加一个名为 `plot_corr_mat()` 的新方法：\n\n```python\ndef plot_corr_mat(self,\
  \ df, figure, canvas):\n    figure.clear()\n    plot1 = figure.add_subplot(1, 1,\
  \ 1)\n    categorical_columns = df.select_dtypes(include=['object', 'category']).columns\n\
  \    df_removed = df.drop(columns=categorical_columns)\n    corrdata = df_removed.corr()\n\
  \    annot_kws = {\"size\": 5}\n    sns.heatmap(corrdata, ax=plot1, lw=1, annot=True,\
  \ cmap=\"Reds\", annot_kws=annot_kws)\n    plot1.set_title('Correlation Matrix',\
  \ fontweight=\"bold\", fontsize=14)\n    # Set font for x and y labels\n    plot1.set_xlabel('Features',\
  \ fontweight=\"bold\", fontsize=12)\n    plot1.set_ylabel('Features', fontweight=\"\
  bold\", fontsize=12)\n    # Set font for tick labels\n    plot1.tick_params(axis='both',\
  \ which='major', labelsize=5)\n    plot1.tick_params(axis='both', which='minor',\
  \ labelsize=5)\n    figure.tight_layout()\n    canvas.draw()\n```\n\n该代码生成相关性矩阵热力图，以可视化数据集中数值特征之间的关系。以下是代码步骤：\n\
  \n###### 1. 清除现有绘图\n\n函数首先清除指定图形上的任何现有内容，以确保为新绘图提供一个干净的画布。\n\n###### 2. 创建子图\n\n\
  使用 `figure.add_subplot(1, 1, 1)` 向图形添加一个子图。这在 1x1 网格中为相关性矩阵热力图创建了一个单独的子图。\n\n######\
  \ 3. 选择分类列\n\n代码使用 `df.select_dtypes(include=['object', 'category']).columns` 识别并选择\
  \ DataFrame 中的分类列。这些分类列将从相关性矩阵计算中排除，因为它们不是数值型的。\n\n###### 4. 移除分类列\n\n使用 `df.drop(columns=categorical_columns)`\
  \ 从 DataFrame 中移除选定的分类列。这将创建一个仅包含数值特征的新 DataFrame (`df_removed`)。\n\n###### 5. 计算相关性矩阵\n\
  \n代码使用 `corrdata = df_removed.corr()` 计算 `df_removed` 中数值特征的相关性矩阵。该矩阵包含所有数值特征之间的成对相关性。\n\
  \n###### 6. 自定义热力图\n\n*   `annot_kws` 是一个字典，用于指定热力图上注释的其他属性。在本例中，它将注释文本大小设置为 5。\n\
  *   `sns.heatmap()` 用于创建热力图，并将其绘制在先前创建的子图上 (`ax=plot1`)。\n*   `annot=True` 参数确保在热力图上显示相关性数值。\n\
  *   `cmap` 参数指定热力图的颜色映射，本例中使用 \"Reds\"。\n*   `annot_kws` 字典被传递以自定义注释属性。\n\n######\
  \ 7. 设置标题和标签\n\n*   绘图标题设置为 'Correlation Matrix'，并指定了字体属性。\n*   x 轴和 y 轴的标签设置了字体属性，以表明两轴代表相同的特征集。\n\
  \n###### 8. 调整刻度标签\n\n绘图坐标轴上主刻度和次刻度的标签字体大小均调整为 5。\n\n###### 9. 紧凑布局\n\n调用 `figure.tight_layout()`\
  \ 以确保绘图布局调整得当，适配图形区域。\n\n###### 10. 绘制图形\n\n最后，调用 `canvas.draw()` 在用户界面的画布上渲染并显示相关性矩阵热力图。\n\
  \n然后，将此代码添加到 `Main_Class` 中 `binds_event()` 方法的末尾：\n\n```python\n##### Binds combobox2\
  \ to a function\nself.obj_window.combo2.bind(\"<<ComboboxSelected>>\", self.choose_combobox2)\n\
  ```\n\n这行代码将一个函数绑定到图形用户界面 (GUI) 应用程序中特定 Combobox（下拉框）控件的事件，通常使用 Python 的 `tkinter`\
  \ 库创建。\n\n以下是该行代码的解释：\n\n*   `self.obj_window.combo2`：这部分代码引用了 `obj_window` 对象的一部分\
  \ Combobox 控件 (`combo2`)，该对象似乎是自定义窗口设计类的一个实例。此 Combobox 控件用于显示用户可选择的选项列表。\n*   `.bind(\"\
  <<ComboboxSelected>>\", self.choose_combobox2)`：这部分代码使用 `bind` 方法将一个函数 (`self.choose_combobox2`)\
  \ 与在 Combobox 中选择项目时生成的事件关联起来。所绑定的事件是 `<<ComboboxSelected>>`，这是 `tkinter` 中预定义的事件，当用户从\
  \ Combobox 下拉列表中选择一个项目时触发。\n*   `self.choose_combobox2`：这是发生事件（在 Combobox 中选择项目）时将要执行的函数。该函数似乎负责处理用户的选择，并根据所选项目执行特定操作。\n\
  \n总之，这行代码为 GUI 应用程序中的第二个 Combobox (`combo2`) 设置了事件处理机制。当用户从此 Combobox 选择一个项目时，将调用\
  \ `self.choose_combobox2` 函数以响应用户的选择，可能通过更新 GUI 或根据所选项目执行其他相关操作。\n\n接下来，在 `Main_Class`\
  \ 中添加一个名为 `choose_combobox2()` 的新方法：\n\n```python\ndef choose_combobox2(self, event):\n\
