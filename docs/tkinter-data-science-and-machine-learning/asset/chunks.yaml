    _curve(self, model, X\\_train, y\\_train, X\\_test, y\\_test, ypred, name, figure,\
    \ canvas):\n\n figure.clear() \n\n #Plots true values versus predicted values\
    \ diagram\n\n plot1 \\= figure.add\\_subplot(2,1,1) \n\n acc\\=accuracy\\_score(y\\\
    _test, ypred)\n\n plot1.scatter(range(len(ypred)),ypred,color\\=\"blue\", lw\\\
    =3,label\\=\"Predicted\")\n\n plot1.scatter(range(len(y\\_test)), \n\n y\\_test,color\\\
    =\"red\",label\\=\"Actual\")\n\n plot1.set\\_title(\"Predicted Values vs True\
    \ Values of \" + name, fontsize\\=12)\n\n plot1.set\\_xlabel(\"Accuracy: \" +\
    \ str(round((acc\\*100),3)) + \"%\")\n\n plot1.legend()\n\n plot1.grid(True, alpha\\\
    =0.75, lw\\=1, ls\\='-.')\n\n #Plots learning curve\n\n train\\_sizes\\=np.linspace(.1,\
