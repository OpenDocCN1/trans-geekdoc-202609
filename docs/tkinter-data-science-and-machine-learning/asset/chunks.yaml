- raw: "Histograms are valuable tools for visualizing the distribution and relationships\
    \ between variables. In this specific context, this visualization enables a quick\
    \ assessment of whether customers who spend more on meat products tend to have\
    \ more recent interactions or whether there are noticeable patterns in spending\
    \ behavior concerning recency. It also allows for the identification of any concentration\
    \ of cases within specific combinations of spending categories and recency intervals.\
    \ By creating this histogram, one can gain insights into customer preferences\
    \ and spending habits relative to the recency of their interactions, which can\
    \ be valuable for marketing strategies and business decision-making.\n\n![Image](images/image28.png)\n\
    \n**Figure 26** distribution of categorized amount of meat products purchased\
    \ versus categorized recency\n\nPlotting Correlation Matrix\n\nAdd a new method\
    \ named plot\\_corr\\_mat() in Helper\\_Plot class: \n\n def plot\\_corr\\_mat(self,\
    \ df, figure, canvas):\n\n figure.clear() \n\n plot1 \\= figure.add\\_subplot(1,1,1)\
    \ \n\n categorical\\_columns \\= df.select\\_dtypes(include\\=\\['object', 'category'\\\
    ]).columns \n\n df\\_removed \\= df.drop(columns\\=categorical\\_columns) \n\n\
    \ corrdata \\= df\\_removed.corr()\n\n annot\\_kws \\= {\"size\": 5}\n\n sns.heatmap(corrdata,\
    \ ax \\= plot1, lw\\=1, annot\\=True, cmap\\=\"Reds\", annot\\_kws\\=annot\\_kws)\n\
    \n plot1.set\\_title('Correlation Matrix', fontweight \\=\"bold\",fontsize\\=14)\n\
    \n \\# Set font for x and y labels\n\n plot1.set\\_xlabel('Features', fontweight\\\
    =\"bold\", fontsize\\=12)\n\n plot1.set\\_ylabel('Features', fontweight\\=\"bold\"\
    , fontsize\\=12)\n\n \\# Set font for tick labels\n\n plot1.tick\\_params(axis\\\
    ='both', which\\='major', labelsize\\=5)\n\n plot1.tick\\_params(axis\\='both',\
    \ which\\='minor', labelsize\\=5)\n\n figure.tight\\_layout()\n\n canvas.draw()\n\
    \nThe code generates a correlation matrix heatmap to visualize the relationships\
    \ between numerical features in a dataset. Here are the steps of the code:\n\n\
    1.  Clear Existing Plot:\n\nThe function begins by clearing any existing content\
    \ on the specified figure to ensure a clean canvas for the new plot.\n\n1.  Create\
    \ a Subplot:\n\nA subplot is added to the figure using figure.add\\_subplot(1,\
    \ 1, 1). This creates a single subplot in a 1x1 grid for the correlation matrix\
    \ heatmap.\n\n1.  Select Categorical Columns:\n\nThe code identifies and selects\
    \ the categorical columns in the DataFrame using df.select\\_dtypes(include=\\\
    ['object', 'category'\\]).columns. These categorical columns are excluded from\
    \ the correlation matrix calculation as they are not numerical.\n\n1.  Remove\
    \ Categorical Columns:\n\nThe selected categorical columns are removed from the\
    \ DataFrame using df.drop(columns=categorical\\_columns). This creates a new DataFrame\
    \ (df\\_removed) containing only numerical features.\n\n1.  Calculate Correlation\
    \ Matrix:\n\nThe code calculates the correlation matrix for the numerical features\
    \ in df\\_removed using corrdata = df\\_removed.corr(). This matrix contains pairwise\
    \ correlations between all numerical features.\n\n1.  Customize Heatmap:\n\n*\
    \   annot\\_kws is a dictionary specifying additional attributes for the annotations\
    \ on the heatmap. In this case, it sets the annotation text size to 5.\n\n*  \
    \ sns.heatmap() is used to create the heatmap, and it is plotted on the previously\
    \ created subplot (ax=plot1).\n\n*   The annot=True argument ensures that the\
    \ correlation values are displayed on the heatmap.\n\n*   The cmap argument specifies\
    \ the color map for the heatmap, and in this case, \"Reds\" is used.\n\n*   The\
    \ annot\\_kws dictionary is passed to customize annotation attributes.\n\n1. \
    \ Set Titles and Labels:\n\n*   The title of the plot is set to 'Correlation Matrix'\
    \ with specified font properties.\n\n*   Labels for the x and y axes are set with\
    \ font properties to indicate that the features represent the same set of features\
    \ on both axes.\n\n1.  Adjust Tick Labels:\n\nThe tick labels for both major and\
    \ minor ticks on the plot's axes are adjusted to have a font size of 5.\n\n1.\
    \  Tight Layout:\n\nfigure.tight\\_layout() is called to ensure that the plot\
    \ layout is adjusted to fit properly within the figure.\n\n1.  Draw the Plot:\n\
    \nFinally, canvas.draw() is called to render and display the correlation matrix\
    \ heatmap on the canvas within the user interface.\n\nThen, add this code to the\
    \ end of binds\\_event() method in Main\\_Class:\n\n \\# Binds combobox2 to a\
    \ function\n\n self.obj\\_window.combo2.bind(\"<<ComboboxSelected>>\", self.choose\\\
    _combobox2)\n\nThis line of code binds a function to an event for a specific Combobox\
    \ (dropdown) widget in a graphical user interface (GUI) application, typically\
    \ created using the tkinter library in Python.\n\nHere's an explanation of this\
    \ line of code:\n\n*   self.obj\\_window.combo2: This part of the code references\
    \ a Combobox widget (combo2) that is part of the obj\\_window object, which appears\
    \ to be an instance of a custom window design class. This Combobox widget is used\
    \ to display a list of options that the user can choose from.\n\n*   .bind(\"\
    <<ComboboxSelected>>\", self.choose\\_combobox2): This part of the code uses the\
    \ bind method to associate a function (self.choose\\_combobox2) with the event\
    \ generated when an item is selected in the Combobox. The event being bound to\
    \ is \"<<ComboboxSelected>>\", which is a predefined event in tkinter that is\
    \ triggered when the user selects an item from the Combobox dropdown list.\n\n\
    *   self.choose\\_combobox2: This is the function that will be executed when the\
    \ event (item selection in the Combobox) occurs. It appears that this function\
    \ is responsible for handling the user's choice and performing specific actions\
    \ based on the selected item.\n\nIn summary, this line of code sets up an event-handler\
    \ mechanism for the second Combobox (combo2) in the GUI application. When the\
    \ user selects an item from this Combobox, the self.choose\\_combobox2 function\
    \ will be called to respond to the user's selection, possibly by updating the\
    \ GUI or performing other relevant actions based on the selected item.\n\nNext,\
    \ add a new method named choose\\_combobox2() in Main\\_Class:\n\n def choose\\\
    _combobox2(self, event):\n\n chosen \\= self.obj\\_window.combo2.get()\n\n self.obj\\\
    _plot.choose\\_plot\\_more(self.df\\_final, chosen, \n\n self.X, self.y,\n\n self.obj\\\
    _window.figure1, \n\n self.obj\\_window.canvas1, self.obj\\_window.figure2, \n\
    \n self.obj\\_window.canvas2)\n\nThis code defines a function named choose\\_combobox2()\
    \ that serves as an event handler for a Combobox (combo2) in a graphical user\
    \ interface (GUI) application, created using the tkinter library in Python. Here's\
    \ an explanation of what this function does:\n\n1.  event: This function takes\
    \ an event parameter, which represents the event that triggered the function's\
    \ execution. In this case, the event is the selection of an item in combo2.\n\n\
    2.  chosen = self.obj\\_window.combo2.get(): Within the function, it retrieves\
    \ the currently selected item from combo2 using the get() method. This selected\
    \ item is stored in the chosen variable.\n\n3.  self.obj\\_plot.choose\\_plot\\\
    _more(...): This line of code calls a method named choose\\_plot\\_more on an\
    \ instance of the obj\\_plot object. It passes several arguments to this method,\
    \ including:\n\n*   self.df\\_final: The dataset, which is expected to be a Pandas\
    \ DataFrame.\n\n*   chosen: The selected item from combo2.\n\n*   self.X and self.y:\
    \ Input and output variables used for data plotting or analysis.\n\n*   self.obj\\\
    _window.figure1, self.obj\\_window.canvas1, self.obj\\_window.figure2, self.obj\\\
    _window.canvas2: These appear to be graphical components (e.g., Matplotlib figures\
    \ and canvases) associated with the GUI.\n\nThe choose\\_plot\\_more() method\
    \ in obj\\_plot is expected to handle the selected item and possibly generate\
    \ plots, display data, or perform other relevant actions based on the user's choice.\
