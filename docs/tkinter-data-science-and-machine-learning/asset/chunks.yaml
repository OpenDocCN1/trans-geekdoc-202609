    \ `Listbox` 中选择一个项目时，会触发 `<<ListboxSelect>>` 事件。当此事件发生时，将执行 `choose_list_widget`\
    \ 方法（`self.choose_list_widget`）。这允许你定义当用户从 `Listbox` 选择项目时应发生的特定动作或行为。\n\n然后，在\
