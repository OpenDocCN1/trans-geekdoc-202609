    \ 创建一个 `LogisticRegression` 分类器实例。逻辑回归被用作 RFE 过程中特征排名的基础模型。RFE 技术旨在通过迭代地使用不同特征子集训练模型来选择最重要的特征。\n\
    \n1.  创建 RFE 模型：\n\n`rfe = RFE(model):` 创建一个递归特征消除 (RFE) 技术的实例，以 `LogisticRegression`\
    \ 模型作为其基础估计器。RFE 通过递归地移除最不重要的特征来执行特征选择。\n\n1.  拟合 RFE 模型：\n\n`rfe = rfe.fit(X,\
    \ y):` 使用输入特征 `X` 和目标变量 `y` 拟合 RFE 模型。在此过程中，RFE 迭代地使用不同的特征子集训练逻辑回归模型，并根据特征的重要性为每个特征分配排名。\n\
    \n1.  创建结果 DataFrame：\n\n*   `result_lg = pd.DataFrame():` 创建一个名为 `result_lg`\
    \ 的空 Pandas DataFrame，用于存储特征排名。\n\n*   `result_lg['Features'] = X.columns:` 向\
    \ `result_lg` DataFrame 添加一个名为 \"Features\" 的列，包含输入特征的名称。\n\n*   `result_lg['Ranking']\
    \ = rfe.ranking_:` 向 `result_lg` DataFrame 添加另一个名为 \"Ranking\" 的列，包含 RFE 过程分配的特征排名。**排名值越低表示特征越重要**。\n\
