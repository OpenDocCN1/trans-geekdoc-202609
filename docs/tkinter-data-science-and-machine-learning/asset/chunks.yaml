  trans: "\n\n# 总体概述\n\n`oversampling_splitting()` 方法通过解决类别不平衡问题、将数据拆分为训练集和测试集、执行特征缩放以及保存预处理后的数据以供后续使用，来为机器学习准备数据。这是机器学习工作流程中的关键步骤，旨在确保模型在合适的数据上进行训练，并能轻松复用于预测。\n\
    \n# 加载文件\n\n在 `Machine_Learning` 类中，定义一个名为 `loading_files()` 的新方法，如下所示：\n\n```python\n\
    def load_files(self):\n    X_train = joblib.load('X_train.pkl')\n    X_test =\
    \ joblib.load('X_test.pkl')\n    y_train = joblib.load('y_train.pkl')\n    y_test\
    \ = joblib.load('y_test.pkl')\n    return X_train, X_test, y_train, y_test\n```\n\
    \n`Machine_Learning` 类中的 `load_files()` 方法负责从先前使用 `oversampling_splitting` 方法保存的\
    \ pickle (pkl) 文件中加载预处理后的训练和测试数据。以下是该方法的功能：\n\n## 1. 加载数据\n\n它使用 `joblib.load`\
    \ 函数加载以下数据文件：\n\n*   `X_train.pkl`：该文件包含训练数据集经过预处理和缩放后的特征 (`X`)。\n*   `X_test.pkl`：该文件包含测试数据集经过预处理和缩放后的特征\
    \ (`X`)。\n*   `y_train.pkl`：该文件包含与训练数据集对应的标签 (`y`)。\n*   `y_test.pkl`：该文件包含与测试数据集对应的标签\
    \ (`y`)。\n\n## 2. 返回数据\n\n加载这些文件后，该方法返回四个变量：\n\n*   `X_train`：训练数据集经过预处理和缩放后的特征。\n\
    *   `X_test`：测试数据集经过预处理和缩放后的特征。\n*   `y_train`：与训练数据集对应的标签。\n*   `y_test`：与测试数据集对应的标签。\n\
    \n该方法的目的是提供一种便捷的方式来访问预处理后的数据，随后可用于训练和评估机器学习模型，而无需再次执行数据预处理。将数据加载和预处理与建模过程分离，使得维护和复用机器学习流水线变得更加容易。\n\
    \n# 训练模型与预测结果\n\n在 `Machine_Learning` 类中，定义两个名为 `train_model()` 和 `predict_model()`\
    \ 的新方法，如下所示：\n\n```python\ndef train_model(self, model, X, y):\n    model.fit(X,\
    \ y)\n    return model\n\ndef predict_model(self, model, X, proba=False):\n  \
    \  if not proba:\n        y_pred = model.predict(X)\n    else:\n        y_pred_proba\
    \ = model.predict_proba(X)\n        y_pred = np.argmax(y_pred_proba, axis=1)\n\
    \    return y_pred\n```\n\n`Machine_Learning` 类中的 `train_model()` 和 `predict_model()`\
    \ 方法分别负责训练机器学习模型和使用该训练好的模型进行预测。以下是各方法的解释：\n\n## 1. `train_model(self, model, X,\
    \ y)`\n\n该方法接受三个参数：\n\n*   `model`：待训练的机器学习模型。\n*   `X`：用于训练的特征矩阵（输入数据）。\n*  \
    \ `y`：用于训练的目标标签。\n\n在方法内部，对提供的 `model` 调用 `fit` 函数，并传入输入特征矩阵 `X` 和目标标签 `y`。此步骤在提供的训练数据上训练机器学习模型。\n\
    \n最后，将训练好的模型作为方法的输出返回。\n\n## 2. `predict_model(self, model, X, proba=False)`\n\
    \n该方法接受三个参数：\n\n*   `model`：用于预测的已训练机器学习模型。\n*   `X`：待预测的特征矩阵（输入数据）。\n*   `proba`（可选，默认为\
    \ `False`）：一个布尔标志，指示是返回类别概率 (`True`) 还是类别标签 (`False`) 作为预测结果。\n\n*   如果 `proba`\
    \ 为 `False`，该方法使用模型的 `predict` 函数基于输入特征 `X` 进行类别标签预测。预测的类别标签存储在 `y_pred` 变量中。\n\
    *   如果 `proba` 为 `True`，该方法使用模型的 `predict_proba` 函数获取每个类别的概率。然后选择概率最高的类别作为预测的类别标签，并将其存储在\
    \ `y_pred` 变量中。\n\n预测的类别标签（或概率）作为方法的输出返回。\n\n这些方法具有通用性，可用于各种机器学习模型以执行分类等任务。它们提供了一种一致的方式来训练模型和进行预测，使得在不同模型间切换并评估其性能变得更加容易。\n\
    \n# 运行模型\n\n在 `Machine_Learning` 类中，定义一个名为 `run_model()` 的新方法，如下所示：\n\n```python\n\
    def run_model(self, name, model, X_train, X_test, y_train, y_test, proba=False):\n\
