    \  **特征分类**：\n    使用 `pd.cut()` 函数对 `df_dummy` 中的各数值特征进行分箱。每个特征基于预定义的区间（bins）进行分类，分类后的值存回\
    \ `df_dummy`。\n\n4.  **特征分类详情**：\n    每个特征被划分为特定的区间并分配标签。例如 `Income` 特征分为 `'0-20k'`,\
    \ `'20k-30k'` 等标签（注：代码中未显示 Income 处理，文本仅作示例说明）。\n\n5.  **返回结果**：\n    `return\
    \ df_dummy`：返回包含分类数据的 DataFrame。\n\n> 该方法适用于将数值特征转换为带有业务含义标签的分类特征，便于后续分组分析、聚合、可视化等操作。\n\
    \n---\n\n## 提取分类与数值特征\n\n### `extract_cat_num_cols()` 方法\n\n代码在 `Process_Data`\
    \ 类中定义了 `extract_cat_num_cols()` 方法，用于将 DataFrame 的列分离为分类列列表和数值列列表。\n\n```python\n\
    def extract_cat_num_cols(self, df):\n    # Extracts categorical and numerical\
    \ columns in dummy dataset\n    cat_cols = [col for col in df.columns if\n   \
    \             (df[col].dtype == 'object') or (df[col].dtype.name == 'category')]\n\
    \n    num_cols = [col for col in df.columns if\n                (df[col].dtype\
    \ != 'object') and (df[col].dtype.name != 'category')]\n\n    return cat_cols,\
    \ num_cols\n```\n\n### 方法解析\n\n1.  **方法定义**：\n    `def extract_cat_num_cols(self,\
    \ df):` 接收 `self` 和 `df`（Pandas DataFrame）两个参数。\n\n2.  **提取分类列**：\n    列表推导式遍历\
    \ `df.columns`，若列的 `dtype` 为 `'object'` 或 `dtype.name` 为 `'category'`，则判定为分类列，加入\
    \ `cat_cols`。\n\n3.  **提取数值列**：\n    列表推导式遍历 `df.columns`，若列的 `dtype` 不为 `'object'`\
    \ 且 `dtype.name` 不为 `'category'`，则判定为数值列，加入 `num_cols`。\n\n4.  **返回结果**：\n   \
    \ `return cat_cols, num_cols`：返回分类列名列表和数值列名列表。\n\n> 该方法可快速按数据类型分离列，便于后续对分类特征编码、数值特征缩放等差异化预处理。\n\
    \n---\n\n## 分类特征编码\n\n### `encode_categorical_feats()` 方法\n\n`Process_Data` 类中的\
    \ `encode_categorical_feats()` 方法使用标签编码（Label Encoding）对 DataFrame 的分类特征进行编码。\n\
    \n```python\ndef encode_categorical_feats(self, df, cat_cols):\n    # Encodes\
    \ categorical features in original dataset\n    print(f'Features that needs to\
    \ be Label Encoded: \\n{cat_cols}')\n\n    for c in cat_cols:\n        lbl = LabelEncoder()\n\
    \        lbl.fit(list(df[c].astype(str).values))\n        df[c] = lbl.transform(list(df[c].astype(str).values))\n\
    \n    print('Label Encoding done..')\n    return df\n```\n\n### 方法解析\n\n1.  **方法定义**：\n\
    \    `def encode_categorical_feats(self, df, cat_cols):` 接收 `self`、`df`（DataFrame）和\
    \ `cat_cols`（待编码分类列名列表）。\n\n2.  **打印待编码特征**：\n    `print(f'Features that needs\
    \ to be Label Encoded: \\n{cat_cols}')` 输出即将编码的特征名。\n\n3.  **标签编码循环**：\n    遍历\
    \ `cat_cols` 中的每一列 `c`：\n    *   `lbl = LabelEncoder()`：实例化 `LabelEncoder`，该预处理器为每个类别分配唯一整数。\n\
    \    *   `lbl.fit(list(df[c].astype(str).values))`：将列值转为字符串后拟合编码器。\n    *   `df[c]\
    \ = lbl.transform(list(df[c].astype(str).values))`：将列值转换为对应的整数标签。\n\n4.  **打印完成确认**：\n\
    \    `print('Label Encoding done..')` 提示编码完成。\n\n5.  **返回编码后 DataFrame**：\n  \
    \  `return df`：返回完成标签编码的 DataFrame。\n\n"
