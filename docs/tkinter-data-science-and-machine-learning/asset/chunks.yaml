    \ 91.87% 样本的类别标签。\n*   **召回率**：两个类别的召回率均约为 91.87%。该指标衡量模型正确识别正样本（类别 1）和负样本（类别\
    \ 0）的能力。高召回率表明模型有效捕捉了真正例，同时将假负例最小化。\n*   **精确率**：类别 0 的精确率约为 91.92%，类别 1 约为 91.91%。精确率衡量预测为正例的样本中真正例的比例。高精确率表明模型预测为正类时，大多是正确的。\n\
