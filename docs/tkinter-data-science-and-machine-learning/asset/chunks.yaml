    \ `best_estimator_` 获取最佳模型。\n\n### 1.5 模型持久化与结果输出\n\n```python\njoblib.dump(best_model,\
    \ 'GB_Model.pkl')\nprint(f\"Best Hyperparameters for GB:\")\nprint(grid_search.best_params_)\n\
    ```\n\n将最佳模型保存为 `GB_Model.pkl`，并打印最佳超参数。\n\n> **说明**：此代码属于机器学习工作流的一部分，用于训练和调优梯度提升分类器。\n\
    \n---\n\n## 2. `implement_GB` 方法\n\n```python\ndef implement_GB(self, chosen,\
    \ X_train, X_test, y_train, y_test):\n    file_path = os.getcwd() + \"/GB_Model.pkl\"\
    \n    if os.path.exists(file_path):\n        model = joblib.load('GB_Model.pkl')\n\
    \        y_pred = self.run_model(chosen, model, X_train, X_test, y_train, y_test,\
    \ proba=True)\n    else:\n        model = self.gradient_boosting(chosen, X_train,\
    \ X_test, y_train, y_test)\n        y_pred = self.run_model(chosen, model, X_train,\
    \ X_test, y_train, y_test, proba=True)\n    # Saves result into excel file\n \
    \   self.obj_data.save_result(y_test, y_pred, \"results_GB.csv\")\n    print(\"\
    Training Gradient Boosting done...\")\n    return model, y_pred\n```\n\n### 2.1\
    \ 功能概述\n\n`implement_GB()` 是机器学习工作流中的核心方法，负责实现和评估梯度提升分类器（GB）。它支持**模型复用**（加载预训练模型）与**从头训练**两种模式。\n\
    \n### 2.2 参数说明\n\n*   `chosen`：字符串，分类器标识符（预期为 \"Gradient Boosting\"）。\n*   `X_train`,\
    \ `X_test`：训练/测试特征集。\n*   `y_train`, `y_test`：训练/测试标签集。\n\n### 2.3 执行流程\n\n####\
    \ 步骤 1：检查预训练模型\n构建路径 `file_path = os.getcwd() + \"/GB_Model.pkl\"`，通过 `os.path.exists(file_path)`\
    \ 判断模型文件是否存在。\n\n#### 步骤 2：加载预训练模型（若存在）\n```python\nmodel = joblib.load('GB_Model.pkl')\n\
    y_pred = self.run_model(chosen, model, X_train, X_test, y_train, y_test, proba=True)\n\
    ```\n调用 `joblib.load` 加载模型，随后调用 `self.run_model`（`proba=True` 表示返回概率分数）进行预测。\n\
    \n#### 步骤 3：从头训练新模型（若不存在）\n```python\nmodel = self.gradient_boosting(chosen, X_train,\
    \ X_test, y_train, y_test)\ny_pred = self.run_model(chosen, model, X_train, X_test,\
    \ y_train, y_test, proba=True)\n```\n调用 `self.gradient_boosting` 完成超参数调优与训练，再进行预测。\n\
    \n#### 步骤 4：保存预测结果\n```python\nself.obj_data.save_result(y_test, y_pred, \"results_GB.csv\"\
    )\n```\n将真实标签 `y_test` 与预测标签 `y_pred` 保存至 `results_GB.csv`。\n\n#### 步骤 5：输出完成信息并返回\n\
    打印 `\"Training Gradient Boosting done...\"`，返回元组 `(model, y_pred)` 供后续分析使用。\n\n\
    ---\n\n## 3. `Helper_Plot.choose_plot_ML` 方法扩展\n\n在 `Helper_Plot` 类的 `choose_plot_ML()`\
    \ 方法末尾追加以下代码：\n\n```python\nif chosen == \"Gradient Boosting\":\n    best_model,\
    \ y_pred = self.obj_ml.implement_GB(chosen, X_train, X_test, y_train, y_test)\n\
    \    # Plots confusion matrix and ROC\n    self.plot_cm_roc(best_model, X_test,\
    \ y_test, y_pred, chosen, figure1, canvas1)\n    # Plots true values versus predicted\
    \ values diagram and learning curve\n    self.plot_real_pred_val_learning_curve(best_model,\
    \ X_train, y_train,\n                                           X_test, y_test,\
    \ y_pred, chosen, figure2, canvas2)\n    # Shows table of result\n    df_lr =\
    \ self.obj_data.read_dataset(\"results_GB.csv\")\n    self.shows_table(root, df_lr,\
    \ 450, 750, \"Y_test and Y_pred of Gradient Boosting\")\n```\n\n### 3.1 触发条件\n\
    当用户选择的分类器 `chosen` 为 `\"Gradient Boosting\"` 时执行。\n\n### 3.2 核心功能\n\n1.  **模型实现与预测**\
    \  \n    调用 `self.obj_ml.implement_GB(...)` 获取训练好的 `best_model` 与预测结果 `y_pred`。\n\
    \n2.  **可视化绘制**  \n    *   `self.plot_cm_roc(...)`：绘制混淆矩阵与 ROC 曲线。\n    *   `self.plot_real_pred_val_learning_curve(...)`：绘制真实值与预测值对比图及学习曲线。\n\
    \n3.  **结果表格展示**  \n    *   通过 `self.obj_data.read_dataset(\"results_GB.csv\"\
    )` 读取预测结果数据。\n    *   调用 `self.shows_table(...)` 在 GUI 界面（`root`）指定位置（450, 750）显示标题为\
    \ `\"Y_test and Y_pred of Gradient Boosting\"` 的结果表格。\n\n"
