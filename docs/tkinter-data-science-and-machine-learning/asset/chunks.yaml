- raw: "5.  Finally, it tightens the layout of the plot within the figure, ensuring\
    \ that the plot elements do not overlap, and then updates the canvas to display\
    \ the new box plot.\n\nIn summary, the box\\_plot() method allows users to visualize\
    \ the distribution of a numerical variable across different categories or groups\
    \ defined by one or two categorical variables. The resulting box plot provides\
    \ insights into the central tendency, spread, and potential outliers of the data\
    \ within each category, making it a valuable tool for exploratory data analysis.\n\
    \nDistribution of Marital Status\n\nIn Helper\\_Plot class, the choose\\_plot()\
    \ method focuses on choosing and displaying a specific type of plot based on the\
    \ user's selection (chosen) from a dropdown or input.\n\n def choose\\_plot(self,\
    \ df1, df2, chosen, figure1, canvas1, figure2, canvas2):\n\n print(chosen)\n\n\
    \ if chosen \\== \"Marital Status\":\n\n self.plot\\_piechart(df2, \"Marital\\\
    _Status\", figure1, canvas1)\n\nHere's an explanation of the method's parameters\
    \ and functionality:\n\n*   df1 and df2: These are DataFrames representing different\
    \ subsets of the data. It's that df2 is a modified or categorized version of df1,\
    \ which may be used for specific types of visualizations.\n\n*   chosen: This\
    \ parameter represents the user's choice or selection, typically from a dropdown\
    \ or input widget. It determines which type of plot to generate based on the user's\
    \ selection.\n\n*   figure1 and canvas1: These are Matplotlib figure and canvas\
    \ objects where the first type of plot will be created and displayed.\n\n*   figure2\
    \ and canvas2: Similar to figure1 and canvas1, these objects are used for a different\
    \ type of plot that may be displayed alongside the first plot.\n\nHere's what\
    \ this code does:\n\n1.  It checks the value of the chosen parameter to determine\
    \ if it matches a specific option, in this case, \"Marital Status.\"\n\n2.  If\
    \ the user has selected \"Marital Status,\" it calls the plot\\_piechart() method\
    \ with specific arguments:\n\n*   df2: This DataFrame contains data related to\
    \ marital status.\n\n*   \"Marital\\_Status\": This is the name of the variable\
    \ (column) within df2 that will be used to create the pie chart.\n\n*   figure1\
    \ and canvas1: These are the Matplotlib figure and canvas objects where the pie\
    \ chart will be displayed.\n\n1.  The plot\\_piechart() method is expected to\
    \ create and display a pie chart showing the distribution of marital status based\
    \ on the data in df2. \n\nIn summary, the choose\\_plot() method is responsible\
    \ for determining the type of plot to display based on the user's selection (chosen).\
    \ If the user chooses \"Marital Status,\" it triggers the creation of a pie chart\
    \ showing the distribution of marital status using data from df2. This approach\
    \ allows for dynamic plot generation based on user input.\n\nThen, modify Main\\\
    _Class class as follows:\n\n#main\\_class.py\n\nimport os\n\nimport tkinter as\
    \ tk\n\nfrom tkinter import \\*\n\nfrom design\\_window import Design\\_Window\n\
    \nfrom process\\_data import Process\\_Data\n\nfrom helper\\_plot import Helper\\\
    _Plot\n\nclass Main\\_Class:\n\n def \\_\\_init\\_\\_(self, root):\n\n self.initialize()\n\
    \n def initialize(self):\n\n self.root \\= root\n\n width \\= 1500\n\n height\
    \ \\= 750\n\n self.root.geometry(f\"{width}x{height}\")\n\n self.root.title(\"\
    TKINTER AND DATA SCIENCE\")\n\n #Creates necessary objects\n\n self.obj\\_window\
    \ \\= Design\\_Window()\n\n self.obj\\_data \\= Process\\_Data()\n\n self.obj\\\
    _plot \\= Helper\\_Plot()\n\n #Places widgets in root\n\n self.obj\\_window.add\\\
    _widgets(self.root) \n\n #Reads dataset\n\n self.df \\= self.obj\\_data.preprocess()\n\
    \n #Categorize dataset\n\n self.df\\_dummy \\= self.obj\\_data.categorize(self.df)\n\
    \n #Extracts input and output variables\n\n self.cat\\_cols, self.num\\_cols \\\
    = self.obj\\_data.extract\\_cat\\_num\\_cols(self.df)\n\n self.df\\_final \\=\
    \ self.obj\\_data.encode\\_categorical\\_feats(self.df, self.cat\\_cols)\n\n self.X,\
    \ self.y \\= self.obj\\_data.extract\\_input\\_output\\_vars(self.df\\_final)\
    \ \n\n #Binds event\n\n self.binds\\_event() \n\n #Initially turns off combo4\
    \ and combo5 before data splitting is done\n\n self.obj\\_window.combo4\\['state'\\\
    ] \\= 'disabled'\n\n self.obj\\_window.combo5\\['state'\\] \\= 'disabled'\n\n\
    \ def binds\\_event(self):\n\n #Binds button1 to shows\\_table() function\n\n\
    \ #Shows table if user clicks LOAD DATASET \n\n self.obj\\_window.button1.config(command\
    \ \\= lambda:self.obj\\_plot.shows\\_table(self.root, self.df, 1400, 600, \"Dataset\"\
    )) \n\n #Binds listbox to a function\n\n self.obj\\_window.listbox.bind(\"<<ListboxSelect>>\"\
    , self.choose\\_list\\_widget)\n\n def choose\\_list\\_widget(self, event):\n\n\
    \ chosen \\= self.obj\\_window.listbox.get(self.obj\\_window.listbox.curselection())\n\
    \n print(chosen)\n\n self.obj\\_plot.choose\\_plot(self.df, self.df\\_dummy, chosen,\
    \ \n\n self.obj\\_window.figure1, self.obj\\_window.canvas1, \n\n self.obj\\_window.figure2,\
    \ self.obj\\_window.canvas2)\n\nif \\_\\_name\\_\\_ \\== \"\\_\\_main\\_\\_\"\
    :\n\n root \\= tk.Tk()\n\n app \\= Main\\_Class(root)\n\n root.mainloop()\n\n\
    This line of code is binding an event handler function to the <<ListboxSelect>>\
