    \ 方法负责通过网格搜索进行超参数调优来训练逻辑回归分类器。以下是该方法的分步解释：\n\n## 1. 方法参数\n\n*   `name`：表示正在训练的模型名称或标识符的字符串（例如\
    \ \"Logistic Regression\"）。\n*   `X_train`：训练数据的特征矩阵。\n*   `X_test`：测试数据的特征矩阵。\n\
    *   `y_train`：训练数据的目标标签。\n*   `y_test`：测试数据的目标标签。\n\n## 2. 用于超参数调优的网格搜索\n\n定义了一个参数网格\
    \ (`param_grid`)，指定了逻辑回归分类器的一系列超参数。这包括正则化强度 (`C`)、惩罚类型 (`penalty`) 和求解器方法 (`solver`)\
    \ 的不同值。\n\n## 3. 逻辑回归模型初始化\n\n使用一些配置初始化了一个逻辑回归分类器 (`logreg`)，包括最大迭代次数和随机种子。`max_iter`\
    \ 参数设置为 5000 以确保求解器收敛，`random_state` 设置为 2021 以保证可复现性。\n\n## 4. 交叉验证网格搜索\n\n使用\
    \ `GridSearchCV` 执行带有交叉验证的网格搜索。它接收初始化的逻辑回归模型 (`logreg`)、参数网格 (`param_grid`)、交叉验证折数\
    \ (`cv=3`)、评分指标 (`scoring='accuracy'`) 以及并行化搜索的选项 (`n_jobs=-1`)。\n\n## 5. 训练与模型选择\n\
    \n使用训练数据 (`X_train`, `y_train`) 调用网格搜索对象 (`grid_search`) 的 `fit()` 方法，以训练具有不同超参数组合的多个逻辑回归模型。\n\
    \n## 6. 最佳模型选择\n\n使用 `grid_search.best_estimator_` 获取具有最优超参数的表现最佳的逻辑回归模型。\n\n\
    ## 7. 模型保存\n\n使用 `joblib.dump` 方法将表现最佳的逻辑回归模型保存到名为 `LR_Model.pkl` 的 pickle 文件中。这使得模型可以在以后重复使用，而无需重新训练。\n\
    \n## 8. 打印最佳超参数\n\n该方法打印在逻辑回归分类器的网格搜索过程中找到的最佳超参数。\n\n## 9. 返回值\n\n表现最佳的逻辑回归模型作为该方法的输出返回。\n\
    \n总的来说，该方法自动化了逻辑回归分类器的超参数调优过程，确保模型使用网格搜索期间找到的最佳超参数进行训练。\n\n然后，在 `Machine_Learning`\
    \ 类中，定义一个名为 `implement_LR()` 的新方法，如下所示：\n\n```python\ndef implement_LR(self, chosen,\
    \ X_train, X_test, y_train, y_test):\n    file_path = os.getcwd() + \"/LR_Model.pkl\"\
    \n    if os.path.exists(file_path):\n        model = joblib.load('LR_Model.pkl')\n\
    \        y_pred = self.run_model(chosen, model, X_train, X_test, y_train, y_test,\
    \ proba=True)\n    else:\n        model = self.logistic_regression(chosen, X_train,\
    \ X_test, y_train, y_test)\n        y_pred = self.run_model(chosen, model, X_train,\
    \ X_test, y_train, y_test, proba=True)\n    # 将结果保存到 excel 文件\n    self.obj_data.save_result(y_test,\
    \ y_pred, \"results_LR.csv\")\n    print(\"Training Logistic Regression done...\"\
    )\n    return model, y_pred\n```\n\n`Machine_Learning` 类中的 `implement_LR()` 方法负责为给定数据集和选定类别（目标变量）实现逻辑回归分类器。以下是该方法的分步解释：\n\
    \n## 1. 方法参数\n\n*   `chosen`：表示选定类别或目标变量的字符串。\n*   `X_train`：训练数据的特征矩阵。\n*   `X_test`：测试数据的特征矩阵。\n\
    *   `y_train`：训练数据的目标标签。\n*   `y_test`：测试数据的目标标签。\n\n## 2. 检查预训练模型\n\n该方法通过构建\
    \ `LR_Model.pkl` 的文件路径并使用 `os.path.exists(file_path)`，检查当前工作目录中是否存在预训练的逻辑回归模型。\n\
    \n## 3. 模型加载或训练\n\n*   如果存在预训练模型，则使用 `joblib.load('LR_Model.pkl')` 加载它。否则，调用 `logistic_regression`\
    \ 方法通过超参数调优训练一个新的逻辑回归模型。\n*   无论模型是被加载还是被训练，都将存储在 `model` 变量中。\n\n## 4. 模型评估与预测\n\
    \n*   调用 `run_model()` 方法在测试数据 (`X_test`, `y_test`) 上评估模型性能。`proba` 参数设置为 `True`，表示应计算类别预测的概率分数。\n\
    *   预测的类别概率或标签存储在 `y_pred` 变量中。\n\n## 5. 保存模型结果\n\n该方法使用 `Process_Data` 类 (`self.obj_data`)\
    \ 的 `save_result()` 方法将模型结果（包括实际标签和预测标签）保存到名为 `results_LR.csv` 的 Excel 文件中。\n\n\
    ## 6. 打印状态\n\n打印一条消息以指示逻辑回归模型的训练或加载已完成。\n\n## 7. 返回值\n\n训练或加载的逻辑回归模型 (`model`)\
    \ 和预测的类别概率或标签 (`y_pred`) 作为输出返回。\n\n总的来说，此方法允许您根据选定类别加载预训练的逻辑回归模型或训练一个新模型，然后在测试数据上评估其性能，同时保存结果以供进一步分析。\n\
    \n然后，在 `Helper_Plot` 类中，定义一个名为 `choose_plot_ML()` 的新方法，如下所示：\n\n```python\ndef\
    \ choose_plot_ML(self, root, chosen, X_train, X_test, y_train, y_test, figure1,\
    \ canvas1, figure2, canvas2):\n    if chosen == \"Logistic Regression\":\n   \
    \     best_model, y_pred = self.obj_ml.implement_LR(chosen, X_train, X_test, y_train,\
    \ y_test)\n        # 绘制混淆矩阵和 ROC\n        self.plot_cm_roc(best_model, X_test,\
    \ y_test, y_pred, chosen, figure1, canvas1)\n        # 绘制真实值与预测值对比图和学习曲线\n   \
    \     self.plot_real_pred_val_learning_curve(best_model, X_train, y_train,\n \
    \                                              X_test, y_test, y_pred, chosen,\
    \ figure2, canvas2)\n        # 显示结果表格\n        df_lr = self.obj_data.read_dataset(\"\
    results_LR.csv\")\n        self.shows_table(root, df_lr, 450, 750, \"Y_test and\
    \ Y_pred of Logistic Regression\")\n```\n\n`choose_plot_ML()` 方法负责选择并显示与所选机器学习算法相关的特定图表和可视化。以下是该方法工作原理的细分：\n\
    \n## 1. 方法参数\n\n*   `root`：将在其中显示图表和表格的 Tkinter 根窗口。\n*   `chosen`：表示所选机器学习算法的字符串。\n\
    *   `X_train`：训练数据的特征矩阵。\n*   `X_test`：测试数据的特征矩阵。\n*   `y_train`：训练数据的目标标签。\n\
    *   `y_test`：测试数据的目标标签。\n*   `figure1`：用于第一组图表的 Matplotlib 图形对象。\n*   `canvas1`：与\
    \ `figure1` 关联的 Matplotlib 画布对象。\n*   `figure2`：用于第二组图表的 Matplotlib 图形对象。\n* \
    \  `canvas2`：与 `figure2` 关联的 Matplotlib 画布对象。\n\n## 2. 基于所选算法的条件块\n\n该方法检查 `chosen`\
    \ 变量的值以确定选择了哪种机器学习算法。\n\n## 3. 逻辑回归（所选算法）\n\n"
