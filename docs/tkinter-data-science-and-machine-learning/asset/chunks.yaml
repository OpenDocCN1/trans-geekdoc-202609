    \ 类作为创建可视化和以图形形式处理数据的实用工具。它与其他类和方法结合使用，用于分析和可视化各种数据科学和机器学习任务的数据。\n\n# 显示表格\n\n\
    在 `Helper_Plot` 类中，代码中的 `shows_table()` 方法负责使用 Tkinter 在新窗口中将 Pandas DataFrame\
