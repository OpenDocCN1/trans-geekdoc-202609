- raw: "*   Recall: The recall score, which measures the model's ability to correctly\
    \ identify positive samples (responsiveness), is also approximately 92.40%. This\
    \ indicates that the model effectively identified about 92.40% of the responsive\
    \ customers.\n\n*   Precision: The precision score, which measures the model's\
    \ ability to avoid false positives, is approximately 92.74%. This suggests that\
    \ when the model predicts a customer as responsive, it is correct about 92.74%\
    \ of the time.\n\n*   F1-Score: The F1-score, which is the harmonic mean of precision\
    \ and recall, is approximately 92.38%. It provides a balance between precision\
    \ and recall, indicating the overall effectiveness of the model.\n\n*   Support:\
    \ The support values represent the number of samples in each class. In this case,\
    \ there are 382 samples in class 0 and 381 samples in class 1.\n\nThe classification\
    \ report provides a detailed breakdown of these metrics for both class 0 and class\
    \ 1. For class 0, the model has a slightly lower recall (0.88), indicating that\
    \ it is slightly less effective at identifying non-responsive customers. However,\
    \ for class 1, the recall is high (0.97), indicating strong performance in identifying\
    \ responsive customers. Overall, the model performs well with balanced precision\
    \ and recall, resulting in a high F1-score.\n\nIn conclusion, the Logistic Regression\
    \ model appears to be effective in predicting customer responsiveness, achieving\
    \ a good balance between precision and recall, and providing high overall accuracy.\
    \ However, it's essential to consider the specific business requirements and the\
    \ consequences of false positives and false negatives when evaluating the model's\
    \ performance in a real-world context.\n\nRandom Forest Classifier and Grid Search\n\
    \nIn Machine\\_Learning class, define a new method named random\\_forest() as\
    \ follows:\n\n def random\\_forest(self, name, X\\_train, X\\_test, y\\_train,\
    \ y\\_test):\n\n #Random Forest Classifier \n\n \\# Define the parameter grid\
    \ for the grid search\n\n param\\_grid \\= {\n\n 'n\\_estimators': \\[100, 200,\
    \ 300\\],\n\n 'max\\_depth': \\[10, 20, 30, 40, 50\\],\n\n 'min\\_samples\\_split':\
    \ \\[2, 5, 10\\],\n\n 'min\\_samples\\_leaf': \\[1, 2, 4\\]\n\n }\n\n \\# Initialize\
    \ the RandomForestClassifier model\n\n rf \\= RandomForestClassifier(random\\\
    _state\\=2021)\n\n \\# Create GridSearchCV with the RandomForestClassifier model\
    \ and the parameter grid\n\n grid\\_search \\= GridSearchCV(rf, param\\_grid,\
    \ cv\\=3, scoring\\='accuracy', n\\_jobs\\=-1)\n\n \\# Train and perform grid\
    \ search\n\n grid\\_search.fit(X\\_train, y\\_train)\n\n \\# Get the best RandomForestClassifier\
    \ model from the grid search\n\n best\\_model \\= grid\\_search.best\\_estimator\\\
    _\n\n #Saves model\n\n joblib.dump(best\\_model, 'RF\\_Model.pkl') \n\n \\# Print\
    \ the best hyperparameters found\n\n print(f\"Best Hyperparameters for RF:\")\n\
    \n print(grid\\_search.best\\_params\\_) \n\n return best\\_model\n\nThe random\\\
    _forest() function in the code is responsible for training a Random Forest Classifier\
    \ and optimizing its hyperparameters using grid search. Here's a step-by-step\
    \ explanation of what this function does:\n\n1.  Parameter Grid Definition: It\
    \ defines a parameter grid (param\\_grid) that contains various hyperparameters\
    \ for the Random Forest Classifier. These hyperparameters include:\n\n*   n\\\
    _estimators: The number of trees in the forest.\n\n*   max\\_depth: The maximum\
    \ depth of each tree.\n\n*   min\\_samples\\_split: The minimum number of samples\
    \ required to split an internal node.\n\n*   min\\_samples\\_leaf: The minimum\
    \ number of samples required to be at a leaf node.\n\n1.  Model Initialization:\
    \ It initializes a Random Forest Classifier (rf) with a specified random seed\
    \ for reproducibility.\n\n2.  Grid Search: It creates a GridSearchCV object (grid\\\
    _search) that takes the rf model and the param\\_grid. It performs a grid search\
    \ with cross-validation (3-fold cross-validation) to find the best combination\
    \ of hyperparameters that maximizes the accuracy score.\n\n3.  Grid Search Training:\
    \ It fits the grid\\_search object to the training data (X\\_train and y\\_train)\
    \ to find the best hyperparameters.\n\n4.  Best Model Selection: After the grid\
    \ search, it retrieves the best Random Forest model (best\\_model) based on the\
    \ hyperparameters that yielded the highest accuracy during cross-validation.\n\
    \n5.  Model Saving: It saves the best\\_model to a file named 'RF\\_Model.pkl'\
    \ using the joblib library. This allows for later retrieval and use of the trained\
    \ model without retraining.\n\n6.  Print Best Hyperparameters: It prints the best\
    \ hyperparameters found during the grid search for reference.\n\nIn summary, this\
    \ function automates the process of hyperparameter tuning for a Random Forest\
    \ Classifier by conducting a grid search over a predefined parameter space, ultimately\
    \ returning the best-performing model based on the specified hyperparameters.\
    \ This optimized model can then be used for making predictions on new data.\n\n\
    Then, in Machine\\_Learning class, define a new method named implement\\_RF()\
    \ as follows:\n\n def implement\\_RF(self, chosen, X\\_train, X\\_test, y\\_train,\
    \ y\\_test):\n\n file\\_path \\= os.getcwd()+\"/RF\\_Model.pkl\"\n\n if os.path.exists(file\\\
    _path):\n\n model \\= joblib.load('RF\\_Model.pkl')\n\n y\\_pred \\= self.run\\\
    _model(chosen, model, X\\_train, X\\_test, y\\_train, y\\_test, proba\\=True)\
    \ \n\n else:\n\n model \\= self.random\\_forest(chosen, X\\_train, X\\_test, y\\\
    _train, y\\_test)\n\n y\\_pred \\= self.run\\_model(chosen, model, X\\_train,\
    \ X\\_test, y\\_train, y\\_test, proba\\=True)\n\n #Saves result into excel file\n\
    \n self.obj\\_data.save\\_result(y\\_test, y\\_pred, \"results\\_RF.csv\")\n\n\
    \ print(\"Training Random Forest done...\")\n\n return model, y\\_pred\n\nThe\
    \ implement\\_RF() function in the code is responsible for implementing and training\
    \ a Random Forest Classifier for a chosen task. Here's a step-by-step explanation\
    \ of what this function does:\n\n1.  Checking for Pretrained Model: It first checks\
    \ if a pretrained Random Forest model exists in the file system (RF\\_Model.pkl).\
    \ If a pretrained model is found, it loads the model from the file. This step\
    \ is intended to avoid retraining the model if it has already been trained and\
    \ saved.\n\n2.  Model Training: If no pretrained model is found, it calls the\
    \ random\\_forest function to perform the training. The random\\_forest function\
    \ trains a Random Forest Classifier using grid search to optimize hyperparameters.\n\
    \n3.  Predictions: After either loading a pretrained model or training a new one,\
    \ it uses the trained model to make predictions on the test data (X\\_test).\n\
    \n4.  Saving Results: It saves the true labels (y\\_test) and the predicted labels\
    \ (y\\_pred) into an Excel file named 'results\\_RF.csv' using the save\\_result\
    \ function. This file can be used for further analysis and evaluation of the model's\
    \ performance.\n\n5.  Printing Status: It prints a message to indicate that the\
    \ training of the Random Forest model is complete.\n\n6.  Returning Model and\
    \ Predictions: Finally, it returns both the trained Random Forest model and the\
    \ predicted labels (y\\_pred) for potential further analysis or use.\n\nIn summary,\
    \ this function handles the training, prediction, and result storage for a Random\
    \ Forest Classifier, ensuring that the model is only trained if no pretrained\
    \ model is available. This allows for efficient model reuse and results tracking.\n\
    \nAdd this code to the end of choose\\_plot\\_ML() method in Helper\\_Plot class:\n\
    \n if chosen \\== \"Random Forest\":\n\n best\\_model, y\\_pred \\= self.obj\\\
    _ml.implement\\_RF(chosen, X\\_train, X\\_test, y\\_train, y\\_test)\n\n #Plots\
    \ confusion matrix and ROC\n\n self.plot\\_cm\\_roc(best\\_model, X\\_test, y\\\
