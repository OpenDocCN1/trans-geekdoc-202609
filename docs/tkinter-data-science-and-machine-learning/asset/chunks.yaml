    \ `canvas` 对象。\n\n### 执行流程\n\n1.  **创建子图**：在指定的 `figure` 中创建两个子图，并排显示混淆矩阵和 ROC\
    \ 曲线。\n2.  **绘制混淆矩阵**：使用 `seaborn` 绘制混淆矩阵（`cm`）的热力图。热力图包含每个单元格的数值标注，颜色映射设为 \"\
    Greens\"。同时添加坐标轴标签和刻度标签以提高清晰度。混淆矩阵提供了模型分类性能的洞察。\n3.  **绘制 ROC 曲线**：使用 `roc_curve`\
    \ 函数计算假阳性率（FPR）和真阳性率（TPR），并在第二个子图上绘制 ROC 曲线。对角虚线代表随机猜测，红线代表模型的 ROC 曲线。ROC 曲线下面积（AUC）是评估模型判别能力的常用指标。\n\
    4.  **渲染输出**：生成的混淆矩阵和 ROC 曲线显示在指定的 `figure` 中。调用 `canvas.draw()` 函数以渲染并更新关联画布中的图表。\n\
    \n该方法提供了模型性能的综合可视化总结，便于通过混淆矩阵评估分类准确性，通过 ROC 曲线评估类别判别能力。\n\n---\n\n## 绘制真实值与预测值对比图及学习曲线\n\
    \n在 `Helper_Plot` 类中，定义一个名为 `plot_real_pred_val_learning_curve()` 的新方法，如下所示：\n\
    \n```python\n# Plots true values versus predicted values diagram and learning\
    \ curve\ndef plot_real_pred_val_learning_curve(self, model, X_train, y_train,\
    \ X_test, y_test, ypred, name, figure, canvas):\n    figure.clear()\n\n    # Plots\
    \ true values versus predicted values diagram\n    plot1 = figure.add_subplot(2,\
    \ 1, 1)\n    acc = accuracy_score(y_test, ypred)\n    plot1.scatter(range(len(ypred)),\
    \ ypred, color=\"blue\", lw=3, label=\"Predicted\")\n    plot1.scatter(range(len(y_test)),\
    \ y_test, color=\"red\", label=\"Actual\")\n    plot1.set_title(\"Predicted Values\
    \ vs True Values of \" + name, fontsize=12)\n    plot1.set_xlabel(\"Accuracy:\
    \ \" + str(round((acc * 100), 3)) + \"%\")\n    plot1.legend()\n    plot1.grid(True,\
    \ alpha=0.75, lw=1, ls='-.')\n\n    # Plots learning curve\n    train_sizes =\
    \ np.linspace(.1, 1.0, 5)\n    train_sizes, train_scores, test_scores, fit_times,\
    \ _ = learning_curve(\n        model, X_train, y_train, cv=None, n_jobs=None,\
    \ train_sizes=train_sizes, return_times=True\n    )\n    train_scores_mean = np.mean(train_scores,\
    \ axis=1)\n    train_scores_std = np.std(train_scores, axis=1)\n    test_scores_mean\
    \ = np.mean(test_scores, axis=1)\n    test_scores_std = np.std(test_scores, axis=1)\n\
    \n    plot2 = figure.add_subplot(2, 1, 2)\n    plot2.fill_between(train_sizes,\
    \ train_scores_mean - train_scores_std,\n                       train_scores_mean\
    \ + train_scores_std, alpha=0.1, color=\"r\")\n    plot2.fill_between(train_sizes,\
    \ test_scores_mean - test_scores_std,\n                       test_scores_mean\
    \ + test_scores_std, alpha=0.1, color=\"g\")\n    plot2.plot(train_sizes, train_scores_mean,\
    \ 'o-', color=\"r\", label=\"Training score\")\n    plot2.plot(train_sizes, test_scores_mean,\
    \ 'o-', color=\"g\", label=\"Cross-validation score\")\n    plot2.legend(loc=\"\
    best\")\n    plot2.set_title(\"Learning curve of \" + name, fontsize=12)\n   \
    \ plot2.set_xlabel(\"fit_times\")\n    plot2.set_ylabel(\"Score\")\n    plot2.grid(True,\
    \ alpha=0.75, lw=1, ls='-.')\n\n    figure.tight_layout()\n    canvas.draw()\n\
    ```\n\n`Helper_Plot` 类中的 `plot_real_pred_val_learning_curve()` 方法负责绘制两个可视化图表：真实值与预测值对比图和学习曲线。以下是该方法的说明：\n\
