    \ 窗口添加按钮。\n*   它接受两个参数：`self`（对 `Design_Window` 类实例的引用）和 `root`（将添加按钮的 `tkinter`\
    \ 主窗口）。\n\n### 添加按钮\n\n在此方法中使用 `tk.Button(root, height=2, width=30, text=\"BUTTON_TEXT\"\
    )` 添加了两个按钮，其中：\n\n*   `root` 是将放置按钮的 `tkinter` 窗口。\n*   `height=2` 将按钮的高度（以文本行数为单位）设置为\
