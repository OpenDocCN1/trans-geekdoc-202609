- raw: "Plotting Pie Chart and Bar Chart\n\nIn Helper\\_Plot class, the plot\\_piechart()\
    \ method defined in the code is responsible for creating a pie chart and a corresponding\
    \ bar plot as subplots within a single Matplotlib figure. \n\n \\# Defines function\
    \ to create pie chart and bar plot as subplots \n\n def plot\\_piechart(self,\
    \ df, var, figure, canvas, title\\=''):\n\n figure.clear()\n\n \\# Pie Chart (left\
    \ subplot)\n\n plot1 \\= figure.add\\_subplot(2,1,1) \n\n label\\_list \\= list(df\\\
    [var\\].value\\_counts().index)\n\n colors \\= sns.color\\_palette(\"deep\", len(label\\\
    _list)) \n\n \\_, \\_, autopcts \\= plot1.pie(df\\[var\\].value\\_counts(), autopct\\\
    =\"%1.1f%%\", colors\\=colors,\n\n startangle\\=30, labels\\=label\\_list,\n\n\
    \ wedgeprops\\={\"linewidth\": 2, \"edgecolor\": \"white\"}, \\# Add white edge\n\
    \n shadow\\=True, textprops\\={'fontsize': 7})\n\n plot1.set\\_title(\"Distribution\
    \ of \" + var + \" variable \" + title, fontsize\\=10)\n\n \\# Bar Plot (right\
    \ subplot)\n\n plot2 \\= figure.add\\_subplot(2,1,2)\n\n ax \\= df\\[var\\].value\\\
    _counts().plot(kind\\=\"barh\", color\\=colors, alpha\\=0.8, ax \\= plot2) \n\n\
    \ for i, j in enumerate(df\\[var\\].value\\_counts().values):\n\n ax.text(.7,\
    \ i, j, weight\\=\"bold\", fontsize\\=7)\n\n plot2.set\\_title(\"Count of \" +\
    \ var + \" cases \" + title, fontsize\\=10)\n\n figure.tight\\_layout()\n\n canvas.draw()\n\
    \nLet's break down how this method works:\n\n1.  Method Definition:\n\ndef plot\\\
    _piechart(self, df, var, figure, canvas, title=''): This is a method definition\
    \ that takes several parameters:\n\n*   self: This refers to the instance of the\
    \ class.\n\n*   df: This is a Pandas DataFrame containing the data to be visualized.\n\
    \n*   var: This is a string representing the variable/column in the DataFrame\
    \ that you want to visualize.\n\n*   figure: This is a Matplotlib Figure object\
    \ where the subplots will be created.\n\n*   canvas: This is a Matplotlib FigureCanvasTkAgg\
    \ object that will be used to draw the subplots.\n\n*   title='': This is an optional\
    \ string representing a title for the plots.\n\n1.  Clearing the Figure:\n\nfigure.clear():\
    \ This line clears any previous content in the Matplotlib figure. It ensures that\
    \ the new pie chart and bar plot will be drawn on a blank canvas.\n\n1.  Pie Chart\
    \ (Left Subplot):\n\n*   plot1 = figure.add\\_subplot(2,1,1): This line creates\
    \ the left subplot for the pie chart within the figure. The add\\_subplot function\
    \ is used to specify the subplot's position in a 2x1 grid (2 rows and 1 column\
    \ of subplots).\n\n*   The pie chart is created using Matplotlib's pie function.\
    \ It displays the distribution of values in the specified column (var) of the\
    \ DataFrame df. Various parameters are set to customize the pie chart, such as\
    \ labels, colors, autopct (percentage labels), and more.\n\n*   plot1.set\\_title(\"\
    Distribution of \" + var + \" variable \" + title, fontsize=10): This line sets\
    \ the title for the pie chart subplot. The title includes the variable name (var)\
    \ and an optional title provided as a parameter.\n\n1.  Bar Plot (Right Subplot):\n\
    \n*   plot2 = figure.add\\_subplot(2,1,2): This line creates the right subplot\
    \ for the bar plot within the figure. Similar to the pie chart, it is positioned\
    \ in the second row of the 2x1 grid.\n\n*   The bar plot is created using Matplotlib's\
    \ barh function. It displays the count of each unique value in the specified column\
    \ (var) of the DataFrame df.\n\n*   Labels and annotations are added to the bars\
    \ to display the counts.\n\n*   plot2.set\\_title(\"Count of \" + var + \" cases\
    \ \" + title, fontsize=10): This line sets the title for the bar plot subplot.\
    \ The title includes the variable name (var) and an optional title provided as\
    \ a parameter.\n\n1.  Tight Layout and Drawing:\n\n*   figure.tight\\_layout():\
    \ This line ensures that the subplots are arranged neatly within the figure.\n\
    \n*   canvas.draw(): This line draws the subplots on the canvas, making them visible\
    \ in the Matplotlib figure.\n\nIn summary, the plot\\_piechart() method allows\
    \ you to create a pie chart and a bar plot as subplots within a Matplotlib figure,\
    \ providing a visual representation of the distribution and counts of values in\
    \ a specified DataFrame column. The optional title parameter allows you to add\
    \ a title to the plots.\n\nPair of Histogram Plots\n\nIn Helper\\_Plot class,\
    \ the another\\_versus\\_response() method defined in the code is responsible\
    \ for creating a pair of histogram plots as subplots within a single Matplotlib\
    \ figure. These histograms represent the distribution of a numerical feature (feat)\
    \ for two different response classes (0 and 1, representing \"Not Responsive\"\
    \ and \"Responsive,\" respectively).\n\n def another\\_versus\\_response(self,\
    \ df, feat, num\\_bins, figure, canvas):\n\n figure.clear()\n\n plot1 \\= figure.add\\\
    _subplot(2,1,1)\n\n colors \\= sns.color\\_palette(\"Set2\")\n\n df\\[df\\['Response'\\\
    ] \\== 0\\]\\[feat\\].plot(ax\\=plot1, kind\\='hist', bins\\=num\\_bins, edgecolor\\\
    ='black', color\\=colors\\[0\\])\n\n plot1.set\\_title('Not Responsive', fontsize\\\
    =15)\n\n plot1.set\\_xlabel(feat, fontsize\\=10)\n\n plot1.set\\_ylabel('Count',\
    \ fontsize\\=10)\n\n data1 \\= \\[\\]\n\n for p in plot1.patches:\n\n x \\= p.get\\\
    _x() + p.get\\_width() / 2.\n\n y \\= p.get\\_height()\n\n plot1.annotate(format(y,\
    \ '.0f'), (x, y), ha\\='center',\n\n va\\='center', xytext\\=(0, 10),\n\n weight\\\
    =\"bold\", fontsize\\=7, textcoords\\='offset points')\n\n data1.append(\\[x,\
    \ y\\])\n\n plot2 \\= figure.add\\_subplot(2,1,2)\n\n df\\[df\\['Response'\\]\
    \ \\== 1\\]\\[feat\\].plot(ax\\=plot2, kind\\='hist', bins\\=num\\_bins, edgecolor\\\
    ='black', color\\=colors\\[1\\])\n\n plot2.set\\_title('Responsive', fontsize\\\
    =15)\n\n plot2.set\\_xlabel(feat, fontsize\\=10)\n\n plot2.set\\_ylabel('Count',\
    \ fontsize\\=10)\n\n data2 \\= \\[\\]\n\n for p in plot2.patches:\n\n x \\= p.get\\\
    _x() + p.get\\_width() / 2.\n\n y \\= p.get\\_height()\n\n plot2.annotate(format(y,\
    \ '.0f'), (x, y), ha\\='center',\n\n va\\='center', xytext\\=(0, 10),\n\n weight\\\
    =\"bold\", fontsize\\=7, textcoords\\='offset points')\n\n data2.append(\\[x,\
    \ y\\])\n\n figure.tight\\_layout()\n\n canvas.draw()\n\nLet's break down how\
    \ this method works:\n\n1.  Method Definition:\n\ndef another\\_versus\\_response(self,\
    \ df, feat, num\\_bins, figure, canvas): This is a method definition that takes\
    \ several parameters:\n\n*   self: This refers to the instance of the class.\n\
    \n*   df: This is a Pandas DataFrame containing the data to be visualized.\n\n\
    *   feat: This is a string representing the numerical feature/column in the DataFrame\
    \ that you want to visualize.\n\n*   num\\_bins: This is an integer specifying\
    \ the number of bins or intervals for the histogram.\n\n*   figure: This is a\
    \ Matplotlib Figure object where the subplots will be created.\n\n*   canvas:\
    \ This is a Matplotlib FigureCanvasTkAgg object that will be used to draw the\
    \ subplots.\n\n1.  Clearing the Figure:\n\nfigure.clear(): This line clears any\
    \ previous content in the Matplotlib figure. It ensures that the new histograms\
    \ will be drawn on a blank canvas.\n\n1.  Histogram Plots for \"Not Responsive\"\
    \ and \"Responsive\":\n\n*   plot1 = figure.add\\_subplot(2,1,1): This line creates\
    \ the upper subplot for the histogram representing the \"Not Responsive\" class\
    \ within the figure. The add\\_subplot function is used to specify the subplot's\
    \ position in a 2x1 grid (2 rows and 1 column of subplots).\n\n*   colors = sns.color\\\
    _palette(\"Set2\"): This line defines a color palette (Set2) for the histograms.\n\
    \n*   df\\[df\\['Response'\\] == 0\\]\\[feat\\].plot(ax=plot1, kind='hist', bins=num\\\
    _bins, edgecolor='black', color=colors\\[0\\]): This line creates a histogram\
    \ for the \"Not Responsive\" class. It filters the DataFrame to select only rows\
    \ where Response is 0 and plots the histogram of the specified feature (feat)\
    \ with the specified number of bins (num\\_bins). Customization options such as\
    \ edge color and color are set.\n\n*   The same steps are repeated to create a\
    \ histogram for the \"Responsive\" class (Response is 1) in the lower subplot\
    \ (plot2).\n\n1.  Customization:\n\n*   Titles, x-axis labels, and y-axis labels\
    \ are set for both subplots to provide context to the histograms.\n\n*   Annotations\
    \ are added to the top of each histogram bar to display the count of data points\
    \ in each bin.\n\n1.  Tight Layout and Drawing:"
