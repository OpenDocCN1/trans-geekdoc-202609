    \ of artificial neural network used for classification tasks.\n\n3.  Grid Search:\
    \ You create a GridSearchCV object named grid\\_search, which will perform an\
    \ exhaustive search over the hyperparameter grid defined earlier. Grid search\
    \ is used to find the best combination of hyperparameters for the MLP model.\n\
