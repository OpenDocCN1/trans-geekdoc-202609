  fmt: "\n# 结论\n\nExtreme Gradient Boosting (XGBoost) 分类器在给定数据集上表现良好，在两个类别上均实现了高准确率、召回率、精确率和\
    \ F1 分数。这些指标表明该模型能有效区分两个类别并做出准确预测。平衡的 F1 分数表明该模型适用于精确率和召回率均至关重要的任务，例如类别不平衡的二分类问题。\n\
    \n# 多层感知机分类器与网格搜索\n\n在 `Machine_Learning` 类中，定义一个名为 `multi_layer_perceptron()`\
    \ 的新方法，如下所示：\n\n```python\ndef multi_layer_perceptron(self, name, X_train, X_test,\
    \ y_train, y_test):\n    # Define the parameter grid for the grid search\n   \
    \ param_grid = {\n        'hidden_layer_sizes': [(50,), (100,), (50, 50), (100,\
    \ 50), (100, 100)],\n        'activation': ['logistic', 'relu'],\n        'solver':\
    \ ['adam', 'sgd'],\n        'alpha': [0.0001, 0.001, 0.01],\n        'learning_rate':\
    \ ['constant', 'invscaling', 'adaptive'],\n    }\n\n    # Initialize the MLP Classifier\n\
    \    mlp = MLPClassifier(random_state=2021)\n\n    # Create GridSearchCV with\
    \ the MLP Classifier and the parameter grid\n    grid_search = GridSearchCV(mlp,\
    \ param_grid, cv=3, scoring='accuracy', n_jobs=-1)\n\n    # Train and perform\
    \ grid search\n    grid_search.fit(X_train, y_train)\n\n    # Get the best MLP\
    \ Classifier model from the grid search\n    best_model = grid_search.best_estimator_\n\
    \n    # Saves model\n    joblib.dump(best_model, 'MLP_Model.pkl')\n\n    # Print\
    \ the best hyperparameters found\n    print(f\"Best Hyperparameters for MLP:\"\
    )\n    print(grid_search.best_params_)\n\n    return best_model\n```\n\n`multi_layer_perceptron()`\
    \ 函数是用于训练和评估多层感知机 (MLP) 分类器的机器学习流水线的一部分。以下是该函数关键组件的细分：\n\n1.  **参数网格**：你定义了一个包含用于调优\
    \ MLP 模型的各种超参数的参数网格 `param_grid`。这些超参数包括神经网络架构（隐藏层大小）、激活函数、优化算法、正则化强度 (`alpha`)\
    \ 和学习率调度。\n2.  **MLP 分类器初始化**：你使用固定的随机种子 (`random_state=2021`) 初始化一个 MLP 分类器实例。MLP\
    \ 分类器是一种用于分类任务的人工神经网络。\n3.  **网格搜索**：你创建一个名为 `grid_search` 的 `GridSearchCV` 对象，它将对前面定义的超参数网格进行详尽搜索。网格搜索用于为\
    \ MLP 模型找到最佳的超参数组合。\n4.  **训练与网格搜索**：你使用 `GridSearchCV` 对象在训练数据 (`X_train`, `y_train`)\
    \ 上拟合（训练）MLP 模型。这将使用不同的超参数组合训练多个 MLP 模型，并使用交叉验证 (`cv=3`) 评估其性能。\n5.  **最佳模型选择**：网格搜索完成后，你使用\
    \ `grid_search.best_estimator_` 从搜索结果中获得最佳 MLP 模型。\n6.  **模型保存**：如果需要，你可以使用 `joblib`\
