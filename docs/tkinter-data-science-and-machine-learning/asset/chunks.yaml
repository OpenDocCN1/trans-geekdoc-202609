  fmt: "\n如果选择的算法是“Logistic Regression”，则会调用 `Machine_Learning` 类的 `implement_LR`\
    \ 方法，根据模型文件是否存在来加载预训练模型或训练新模型。\n\n针对 Logistic Regression 执行以下可视化和操作：\n\n*   使用\
