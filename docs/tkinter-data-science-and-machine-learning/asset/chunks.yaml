    \n2.  **可视化绘制**  \n    *   `self.plot_cm_roc(...)`：绘制混淆矩阵与 ROC 曲线。\n    *   `self.plot_real_pred_val_learning_curve(...)`：绘制真实值与预测值对比图及学习曲线。\n\
