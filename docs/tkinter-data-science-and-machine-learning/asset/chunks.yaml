    \ 列，具有类似的内边距和对齐设置。\n\n一旦创建并放置，这些按钮将作为交互元素出现在 `tkinter` 窗口中。用户可以点击它们以触发与每个按钮关联的特定操作。按钮分别标记为\
    \ \"LOAD DATASET\" 和 \"SPLIT DATA\"，表明它们在 GUI 应用程序中的功能。\n\n## 添加标签\n\n代码在 `Design_Window`\
    \ 类中定义了一个名为 `add_labels()` 的方法，它是 `tkinter` GUI 应用程序的一部分。此方法负责向 GUI 窗口添加标签（文本标签）。\n\
    \n```python\ndef add_labels(self, root):\n    # 添加标签\n    self.label1 = tk.Label(root,\
