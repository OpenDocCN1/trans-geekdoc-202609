    \ and ensures that the subplots are arranged neatly within the figure.\n\nIn summary,\
    \ these methods help you visualize the distribution and relationships between\
    \ categorical variables using stacked bar charts, and they ensure that labels\
    \ are placed inside the bars for better readability.\n\nBox Plot Visualization\n\
    \nIn Helper\\_Plot class, the box\\_plot() method is designed to create a box\
    \ plot visualization of the dataset, showing the distribution of a numerical variable\
    \ (y) for different categories or groups specified by two categorical variables\
    \ (x and hue). This type of plot is useful for visualizing the distribution of\
