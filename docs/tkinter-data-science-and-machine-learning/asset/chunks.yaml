- raw: "In summary, this function automates the process of hyperparameter tuning for\
    \ a KNN classifier using grid search. It finds the best set of hyperparameters\
    \ for the KNN model and saves the optimized model for later use. This is a common\
    \ practice in machine learning to ensure that the model performs optimally on\
    \ the given dataset.\n\nThen, in Machine\\_Learning class, define a new method\
    \ named implement\\_KNN():\n\n def implement\\_KNN(self, chosen, X\\_train, X\\\
    _test, y\\_train, y\\_test):\n\n file\\_path \\= os.getcwd()+\"/KNN\\_Model.pkl\"\
    \n\n if os.path.exists(file\\_path):\n\n model \\= joblib.load('KNN\\_Model.pkl')\n\
    \n y\\_pred \\= self.run\\_model(chosen, model, X\\_train, X\\_test, y\\_train,\
    \ y\\_test, proba\\=True) \n\n else:\n\n model \\= self.knearest\\_neigbors(chosen,\
    \ X\\_train, X\\_test, y\\_train, y\\_test)\n\n y\\_pred \\= self.run\\_model(chosen,\
    \ model, X\\_train, X\\_test, y\\_train, y\\_test, proba\\=True)\n\n #Saves result\
    \ into excel file\n\n self.obj\\_data.save\\_result(y\\_test, y\\_pred, \"results\\\
    _KNN.csv\")\n\n print(\"Training KNN done...\")\n\n return model, y\\_pred\n\n\
    The code defines a function called implement\\_KNN() that is responsible for implementing\
    \ and training a K-Nearest Neighbors (KNN) classifier, as well as saving and evaluating\
    \ the results. Here's an explanation of the code:\n\n1.  Function Definition:\
    \ This function, named implement\\_KNN, takes several parameters:\n\n*   chosen:\
    \ A string representing the name or identifier of the chosen model (in this case,\
    \ \"K-Nearest Neighbors\").\n\n*   X\\_train: The feature matrix of the training\
    \ data.\n\n*   X\\_test: The feature matrix of the testing data.\n\n*   y\\_train:\
    \ The target labels of the training data.\n\n*   y\\_test: The target labels of\
    \ the testing data.\n\n1.  File Path Check: It checks whether a file named 'KNN\\\
    _Model.pkl' exists in the current working directory (os.getcwd()). This file is\
    \ used to store the trained KNN model.\n\n2.  Model Loading or Training: If the\
    \ 'KNN\\_Model.pkl' file exists, it means that a trained KNN model is available,\
    \ so the code loads this model using joblib.load. If the file doesn't exist, it\
    \ indicates that the model needs to be trained. In this case, the code calls the\
    \ knearest\\_neigbors() function to train and optimize the KNN model.\n\n3.  Model\
    \ Prediction: After loading or training the KNN model, the function calls the\
    \ run\\_model function to make predictions on the test data (X\\_test) using the\
    \ model. The proba parameter is set to True, indicating that the function should\
    \ return predicted probabilities.\n\n4.  Result Saving: The actual target labels\
    \ (y\\_test) and the predicted labels/probabilities (y\\_pred) are used to save\
    \ the results into an Excel file named 'results\\_KNN.csv' using the save\\_result\
    \ function provided by obj\\_data. This file typically contains the model's predictions\
    \ and the ground truth labels for later analysis.\n\n5.  Print Status: A message\
    \ is printed to the console to indicate that the training or loading of the KNN\
    \ model is complete.\n\nIn summary, this function serves as a unified interface\
    \ for implementing the KNN model. It checks if a trained model is available, loads\
    \ it if found, and otherwise trains a new model. After making predictions, it\
    \ saves the results to an Excel file and provides a status message. This approach\
    \ allows for the reuse of pre-trained models and simplifies the process of running\
    \ and evaluating the KNN classifier.\n\nThen, in Helper\\_Plot class, add this\
    \ code to the end of choose\\_plot\\_ML() method:\n\n if chosen \\== \"K-Nearest\
