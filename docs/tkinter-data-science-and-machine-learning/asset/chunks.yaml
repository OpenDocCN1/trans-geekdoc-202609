    \ 列等于 0（表示无响应）的行，然后调用 `self.obj_plot` 对象的 `plot_piechart()` 方法。它传入筛选后的 DataFrame，特别是\
    \ \"Education\" 列，连同 UI 元素（`figure1` 和 `canvas1`），以及一个额外的标题扩展 \" with Response\
    \ 0\"。因此，当选择 \"Education with Response 0\" 时，它会动态生成一个饼图，表示无响应客户中受教育程度的分布，允许用户以可视化方式探索数据集中无响应客户的教育背景。此交互功能有助于分析未对营销活动做出响应的客户特征，如图\
    \ 7 所示。\n\n![Image](img/image9.png)\n\n**图 7** 响应为 0 的受教育程度分布\n\n## 响应为 1 的受教育程度分布\n\
    \n将此代码添加到 `Helper_Plot` 类中 `choose_plot()` 方法的末尾：\n\n```\nelif chosen == \"Education\
    \ with Response 1\":\n    self.plot_piechart(df2[df2.Response==1], \"Education\"\
    , figure2, canvas2, \" with Response 1\")\n```\n\n在该代码中，当用户从 Listbox 中选择 \"Education\
    \ with Response 1\" 时，会触发 `choose_list_widget()` 函数的执行。在此函数中，有一个条件分支检查所选选项是否为\
    \ \"Education with Response 1\"。如果满足此条件，它会筛选 DataFrame `df2` 以仅包含 \"Response\"\
    \ 列等于 1（表示有响应）的行，然后调用 `self.obj_plot` 对象的 `plot_piechart()` 方法。它传入筛选后的 DataFrame，特别是\
    \ \"Education\" 列，连同 UI 元素（`figure2` 和 `canvas2`），以及一个额外的标题扩展 \" with Response\
    \ 1\"。因此，当选择 \"Education with Response 1\" 时，它会动态生成一个饼图，表示有响应客户中受教育程度的分布，允许用户以可视化方式探索数据集中有响应客户的教育背景。此交互功能有助于分析对营销活动做出积极响应的客户特征，如图\
    \ 8 所示。\n\n![Image](img/image10.png)\n\n**图 8** 响应为 1 的受教育程度分布\n\n## 响应为 0 和 1\
    \ 的国家分布\n\n将此代码添加到 `Helper_Plot` 类中 `choose_plot()` 方法的末尾：\n\n```\nelif chosen\
    \ == \"Country with Response 0\":\n    self.plot_piechart(df2[df2.Response==0],\
    \ \"Country\", figure1, canvas1, \" with Response 0\")\n\nelif chosen == \"Country\
    \ with Response 1\":\n    self.plot_piechart(df2[df2.Response==1], \"Country\"\
    , figure2, canvas2, \" with Response 1\")\n```\n"
