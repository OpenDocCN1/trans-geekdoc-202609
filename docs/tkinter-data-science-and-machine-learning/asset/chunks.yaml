- raw: "*   figure.tight\\_layout(): This line ensures that the subplots are arranged\
    \ neatly within the figure.\n\n*   canvas.draw(): This line draws the subplots\
    \ on the canvas, making them visible in the Matplotlib figure.\n\nIn summary,\
    \ the another\\_versus\\_response() method allows you to create a pair of histogram\
    \ plots within a Matplotlib figure. These histograms visualize the distribution\
    \ of a specified numerical feature (feat) for two different response classes (0\
    \ and 1). The histograms provide insights into how the feature's distribution\
    \ differs between the two classes.\n\nPlotting Stacked Bar Chart\n\nIn Helper\\\
    _Plot class, the put\\_label\\_stacked\\_bar() and dist\\_one\\_vs\\_another\\\
    _plot() methods defined in the code are used to create a stacked bar chart for\
    \ visualizing the relationship between two categorical variables.\n\nThe purpose\
    \ of the code is to create a graphical user interface (GUI) application using\
    \ Python's Tkinter library for data analysis and visualization in the context\
    \ of data science. The application is designed to assist users in loading, exploring,\
    \ and analyzing datasets, performing data preprocessing tasks, and generating\
    \ various data visualizations.\n\n #Puts label inside stacked bar\n\n def put\\\
    _label\\_stacked\\_bar(self, ax,fontsize):\n\n #patches is everything inside of\
    \ the chart\n\n for rect in ax.patches:\n\n \\# Find where everything is located\n\
    \n height \\= rect.get\\_height()\n\n width \\= rect.get\\_width()\n\n x \\= rect.get\\\
    _x()\n\n y \\= rect.get\\_y()\n\n \\# The height of the bar is the data value\
    \ and can be used as the label\n\n label\\_text \\= f'{height:.0f}' \n\n \\# ax.text(x,\
    \ y, text)\n\n label\\_x \\= x + width / 2\n\n label\\_y \\= y + height / 2\n\n\
    \ \\# plots only when height is greater than specified value\n\n if height \\\
    > 0:\n\n ax.text(label\\_x, label\\_y, label\\_text, \\\\\n\n ha\\='center', va\\\
    ='center', \\\\\n\n weight \\= \"bold\",fontsize\\=fontsize)\n\n #Plots one variable\
    \ against another variable\n\n def dist\\_one\\_vs\\_another\\_plot(self, df,\
    \ cat1, cat2, figure, canvas, title):\n\n figure.clear()\n\n plot1 \\= figure.add\\\
    _subplot(1,1,1)\n\n group\\_by\\_stat \\= df.groupby(\\[cat1, cat2\\]).size()\n\
    \n colors \\= sns.color\\_palette(\"Set2\", len(df\\[cat1\\].unique()))\n\n stacked\\\
    _data \\= group\\_by\\_stat.unstack()\n\n group\\_by\\_stat.unstack().plot(kind\\\
    ='bar', stacked\\=True, ax\\=plot1, grid\\=True, color\\=colors)\n\n plot1.set\\\
    _title(title, fontsize\\=12)\n\n plot1.set\\_ylabel('Number of Cases', fontsize\\\
    =10)\n\n plot1.set\\_xlabel(cat1, fontsize\\=10)\n\n self.put\\_label\\_stacked\\\
    _bar(plot1,7)\n\n \\# Set font for tick labels\n\n plot1.tick\\_params(axis\\\
    ='both', which\\='major', labelsize\\=8)\n\n plot1.tick\\_params(axis\\='both',\
    \ which\\='minor', labelsize\\=8) \n\n plot1.legend(fontsize\\=8) \n\n figure.tight\\\
    _layout()\n\n canvas.draw()\n\nLet's break down how these methods work:\n\n1.\
    \  put\\_label\\_stacked\\_bar Method:\n\nThis method is responsible for adding\
    \ labels inside each bar of a stacked bar chart.\n\n*   ax: This parameter represents\
    \ the Axes object (subplot) where the stacked bar chart is plotted.\n\n*   fontsize:\
    \ This parameter specifies the font size for the labels.\n\n1.  Here's how the\
    \ method works:\n\n*   It iterates through each bar (rectangle) in the stacked\
    \ bar chart.\n\n*   For each bar, it retrieves information about its position,\
    \ height, width, and coordinates.\n\n*   The height of the bar (data value) is\
    \ used as the label text.\n\n*   The label's position (label\\_x and label\\_y)\
    \ is calculated as the center of the bar.\n\n*   Labels are placed inside the\
    \ bars only if the bar's height is greater than a specified value (ensuring that\
    \ small bars don't get cluttered with labels).\n\n1.  dist\\_one\\_vs\\_another\\\
    _plot() Method:\n\nThis method creates a stacked bar chart to visualize the distribution\
    \ of one categorical variable against another categorical variable. The chart\
    \ represents the number of cases for each combination of the two categorical variables.\n\
    \n*   df: This parameter is a Pandas DataFrame containing the data to be visualized.\n\
