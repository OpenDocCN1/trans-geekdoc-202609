    \ 事件发生时执行，即当用户在 `Listbox` 控件中选择一个项目时。\n\n```python\ndef choose_list_widget(self,\
    \ event):\n    chosen = self.obj_window.listbox.get(self.obj_window.listbox.curselection())\n\
    \    print(chosen)\n    self.obj_plot.choose_plot(self.df, self.df_dummy, chosen,\n\
    \                              self.obj_window.figure1, self.obj_window.canvas1,\n\
    \                              self.obj_window.figure2, self.obj_window.canvas2)\n\
    ```\n\n以下是该函数功能的细分：\n\n1.  `chosen = self.obj_window.listbox.get(self.obj_window.listbox.curselection())`：此行使用\
    \ `curselection()` 方法从 `Listbox` 控件（`self.obj_window.listbox`）检索当前选中的项目。它将选中的项目赋值给\
    \ `chosen` 变量。由于 `Listbox` 可以支持多选（如果配置为如此），`chosen` 将包含选中项目的列表。\n2.  `print(chosen)`：此行仅将选中的项目打印到控制台。这是用于调试或信息目的，帮助你查看用户选择了什么。\n\
    3.  `self.obj_plot.choose_plot(...)`：此行调用 `self.obj_plot` 对象（`Helper_Plot` 类的实例）的\
