    \   # ax.text(x, y, text)\n        label_x = x + width / 2\n        label_y =\
    \ y + height / 2\n\n        # plots only when height is greater than specified\
    \ value\n        if height > 0:\n            ax.text(label_x, label_y, label_text,\
    \ \\\n                    ha='center', va='center', \\\n                    weight=\"\
    bold\", fontsize=fontsize)\n\n# Plots one variable against another variable\n\
    def dist_one_vs_another_plot(self, df, cat1, cat2, figure, canvas, title):\n \
    \   figure.clear()\n    plot1 = figure.add_subplot(1, 1, 1)\n    group_by_stat\
