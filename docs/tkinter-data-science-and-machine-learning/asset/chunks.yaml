    \ y_train_feat_path)\n            joblib.dump(y_test_feat, y_test_feat_path)\n\
    \        else:\n            raise ValueError(\"Indices in feat_boundary exceed\
    \ the number of columns in X array\")\n    return X_train_feat, X_test_feat, y_train_feat,\
    \ y_test_feat\n```\n\n#### `train_model(self, model, X, y)`\n通用模型训练方法。\n\n```python\n\
    def train_model(self, model, X, y):\n    model.fit(X, y)\n    return model\n```\n\
    \n#### `predict_model(self, model, X, proba=False)`\n模型预测，支持概率输出模式。\n\n```python\n\
    def predict_model(self, model, X, proba=False):\n    if ~proba:\n        y_pred\
    \ = model.predict(X)\n    else:\n        y_pred_proba = model.predict_proba(X)\n\
    \        y_pred = np.argmax(y_pred_proba, axis=1)\n    return y_pred\n```\n\n\
    #### `run_model(self, name, model, X_train, X_test, y_train, y_test, proba=False)`\n\
    运行模型评估，打印准确率、召回率、精确率、F1 值及分类报告。\n\n```python\ndef run_model(self, name, model,\
    \ X_train, X_test, y_train, y_test, proba=False):\n    y_pred = self.predict_model(model,\
    \ X_test, proba)\n    accuracy = accuracy_score(y_test, y_pred)\n    recall =\
    \ recall_score(y_test, y_pred, average='weighted')\n    precision = precision_score(y_test,\
    \ y_pred, average='weighted')\n    f1 = f1_score(y_test, y_pred, average='weighted')\n\
    \    print(name)\n    print('accuracy: ', accuracy)\n    print('recall: ', recall)\n\
    \    print('precision: ', precision)\n    print('f1: ', f1)\n    print(classification_report(y_test,\
    \ y_pred))\n    return y_pred\n```\n\n#### `logistic_regression(self, name, X_train,\
    \ X_test, y_train, y_test)`\n逻辑回归模型训练，使用 `GridSearchCV` 进行超参数调优。\n\n```python\n\
    def logistic_regression(self, name, X_train, X_test, y_train, y_test):\n    #\
    \ Logistic Regression Classifier\n    # Define the parameter grid for the grid\
    \ search\n    param_grid = {\n        'C': [0.01, 0.1, 1, 10],\n        'penalty':\
    \ ['none', 'l2'],\n        'solver': ['newton-cg', 'lbfgs', 'liblinear', 'saga'],\n\
    \    }\n    # Initialize the Logistic Regression model\n    logreg = LogisticRegression(max_iter=5000,\
    \ random_state=2021)\n    # Create GridSearchCV with the Logistic Regression model\
    \ and the parameter grid\n    grid_search = GridSearchCV(logreg, param_grid, cv=3,\
    \ scoring='accuracy', n_jobs=-1)\n    # Train and perform grid search\n    grid_search.fit(X_train,\
    \ y_train)\n    # Get the best Logistic Regression model from the grid search\n\
    \    best_model = grid_search.best_estimator_\n    # Saves model\n    joblib.dump(best_model,\
    \ 'LR_Model.pkl')\n    # Print the best hyperparameters found\n    print(f\"Best\
    \ Hyperparameters for LR:\")\n    print(grid_search.best_params_)\n    return\
    \ best_model\n```\n\n#### `implement_LR(self, chosen, X_train, X_test, y_train,\
    \ y_test)`\n加载或训练逻辑回归模型并评估，保存结果。\n\n```python\ndef implement_LR(self, chosen,\
    \ X_train, X_test, y_train, y_test):\n    file_path = os.getcwd() + \"/LR_Model.pkl\"\
    \n    if os.path.exists(file_path):\n        model = joblib.load('LR_Model.pkl')\n\
    \        y_pred = self.run_model(chosen, model, X_train, X_test, y_train, y_test,\
    \ proba=True)\n    else:\n        model = self.logistic_regression(chosen, X_train,\
    \ X_test, y_train, y_test)\n        y_pred = self.run_model(chosen, model, X_train,\
    \ X_test, y_train, y_test, proba=True)\n    # Saves result into excel file\n \
    \   self.obj_data.save_result(y_test, y_pred, \"results_LR.csv\")\n    print(\"\
    Training Logistic Regression done...\")\n    return model, y_pred\n```\n\n####\
