- pgno: 151
  md: '# Running Convolution-Only Networks by using FPGA Deployment


    To understand and debug convolutional networks, running and visualizing data is
    a useful tool.This example shows how to deploy, run, and debug a convolution-only
    network by using FPGA deployment.


    # Prerequisites


    +   - Xilinx Zynq ZCU102 Evaluation Kit

    - Deep Learning HDL Toolbox™ Support Package for Xilinx FPGA and SoC

    - Deep Learning HDL Toolbox™

    - Deep Learning HDL Toolbox™ Model for Resnet-50


    # Resnet-50 Network


    Resnet-50 is a convolutional neural network that is 50 layers deep. This pretrained
    network can classify images into 1000 object categories (such as keyboard, mouse,
    pencil, and more).The network has learned rich feature representations for a wide
    range of images. The network has an image input size of 224-by-224.


    # Load Resnet-50 Network


    Load the Resnet-50 network.

    ```matlab

    net = resnet50;

    ```


    To visualize the structure of the Resnet-50 network, at the MATLAB command prompt,
    enter:


    analyzeNetwork(rnet)


    # Create Subset of Resnet-50 Network


    To examine the outputs of the max_pooling2_1 layer, create this network which
    is a subset of the Resnet-50 network:


    ```

    matlab

    layers = rnet.Layers(1:5);

    outLayer = regressionLayer(''Name'', ''output'');

    layers(end+1) = outLayer;

    ```

    ```


    ```

    matlab

    snet = assembleNetwork(layers);

    ```

    ```


    # Create Target Object


    ```

    matlab

    %hdldsetuppath(''ToolName'', ''Xilinx Vivado'', ''ToolPath'', ''D:/share/apps/HDLTools/Vivado/2019/

    target = dhld.Target(''Xilinx'', ''Interface'', ''Ethernet'');

    ```

    ```'
  merge: -1
  img_proc: true
