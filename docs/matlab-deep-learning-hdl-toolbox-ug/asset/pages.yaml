  md: '# Vehicle Detection Using DAG Network Based YOLO v2 Deployed to FPGA


    Now, use resnet18 to load a pretrained ResNet-18 model.


    ```

    featureExtractionNetwork = resnet18;

    ```


    Select res4b_relu'' as the feature extraction layer to replace the layers after
    ''res4b_relu'' with the detection subnet. This feature extraction layer outputs
    maps that are downsampled by a factor of 16. This amount of downsampling is a
    trade-off between spatial resolution and the strength of the extracted features,
    as features extracted further down the network encode stronger image features
    at the cost of spatial resolution. Choosing the optimal feature extraction layer
    requires empirical analysis.


    ```

    featureLayer = res4b_relu;

    ```


    Create the YOLO v2 object detection network.


    ```

    lgraph = yolov2Layers(inputSize,numClasses,anchorBoxes,featureExtractionNetwork,featureLayer);

    ```


    You can visualize the network using analyzeNetwork or Deep Network Designer from
    Deep Learning Toolbox.


    If more control is required over the YOLO v2 architecture, use Deep Network Designer
    to design the YOLO v2 detection network manually. For more information, see Design
    a YOLO v2 Detection Network (Computer Vision Toolbox).


    # Data Augmentation


    Data augmentation is used to improve network accuracy by randomly transforming
    the original data during training. By using data augmentation you can add more
    variety to the data without actually having to increase the number of labeled
    samples.


    Use transform to augment the data by randomly flipping the image and associated
    box labels. Note that data augmentation is not applied to the test and validation
    data. Ideally, test and validation data should be representative of the original
    data and is left unmodified for unbiased evaluation.


    ```

    augmentedTrainingData = transform(trainingData,@yolo_augmentData);

    ```


    # Preprocess Training Data and Train YOLO v2 Object Detector


    Preprocess the augmented data, and the validation data to prepare for training.


    ```

    preprocessedTrainingData = transform(augmentedTrainingData,@(data)yolo_preprocessData(data,input

    ```


    Use trainingOptions to specify network training options. Set ''ValidationData''
    to the ''CheckpointPath'' to a temporary location. This enables the saving of
    partially trained detectors during the training process. If training is interrupted,
    such as by a power outage or system failure, you can resume training from the
    saved checkpoint.


    ```

    options = trainingOptions(''sgdm'',...

    ''MiniBatchSize'', 16,...

    ''InitialLearnRate'',le-3,...

    ''MaxEpochs'',20,...

    ''CheckpointPath'', tempdir,...

    ''Shuffle'', ''never'');

    ```


    Use trainYOLOv2ObjectDetector function to train YOLO v2 object detector.


