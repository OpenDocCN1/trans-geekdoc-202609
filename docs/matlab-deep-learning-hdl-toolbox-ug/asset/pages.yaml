- pgno: 29
  md: '# Profile Inference Run


    View the network prediction and performance data for the layers, convolution module
    and fully connected modules by our pretrained series network. The example shows
    how to retrieve the prediction and profiler results for the ResNet-18 network.


    +   1 Create an object of class Workflow using the dhdl.Workflow class.

    2 Set a pretrained deep learning network and bitstream for the workflow object.

    3 Create an object of class dhdl.Target and specify the target vector and interface.

    4 To deploy the network on a specified target FPGA board, call the deploy method
    for the workflow object.

    5 Call the predict function for the workflow object. Provide an array of images
    as the InputImageParameter. Provide arguments to turn on the profiler.


    The labels classifying the images are stored in a structure struct and displayed
    on the screen. The performance parameters of speed and latency are returned in
    a structure struct.


    Use this image to run the code:


    ![](img/747bfd4f288a7e0917a1f27637cc5c2d_29_0.png)


    ```

    snet = resnet18;

    ht = dhdl.Target(''Xilinx'', ''Interface'', ''Ethernet'');

    hw = dhdl.Workflow(''Net'', snet, ''Bitstream'', ''zcu102_single'', ''Target'',ht);

    hw.deploy;

    image = read(''zebra.jpg'');

    inputImg = resize(image, [224, 224]);nimshow(inputImg);

    [prediction, speed] = nw.predict(single(inputImg), ''Profile'', ''on'');

    val, idx = max(prediction);

    snet.Layers(end).ClassNames(idx)

    ```


