- pgno: 89
  md: '# 10 Featured Examples


    ![](img/747bfd4f288a7e0917a1f27637cc5c2d_89_0.png)


    # ## Create Target Object


    Create a target object that has a custom name for your target device and an interface
    to connect your target device to the host computer. Interface options are JTAG
    and Ethernet. To use the Xilinx Vivado tool, set the Xilinx™ Vivado™ Design Suite
    2019.2.


    ```

    % dlhsetlooppath(''ToolName'', ''Xilinx Vivado'', ''ToolPath'', ''C:Xilinx\Vivado\2019.2\bin'')

    ```


    To the target object, enter:


    ```

    hTarget = dlhl.Target(''Xilinx'', ''Interface'', ''Ethernet'');

    ```


    # ## Create Workflow Object


    Create an object of the dlhl.Workflow class. When you create the object, specify
    the network and the bitstream name. Make sure that the bitstream name matches
    the data type and the FPGA board that you are targeting. In this example the target
    FPGA board is the Xilinx ZCU102 SOC board. The bitstream uses a single data type.


    ```

