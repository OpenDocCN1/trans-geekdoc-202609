  md: '# Code Generation and Deployment


    To generated code for and deploy your quantized deep learning network, create
    an object of class dhlfl.Workflow. Use this object to accomplish tasks such as:


    +   * Compile and deploy the quantized deep learning network on a target FPGA
    or SoC board using the deploy function.

    * Estimate the speed of the quantized deep learning network in terms of number
    of frames per second by using the estimate function.

    * Execute the deployed quantized deep learning network and predict the classification
    of input images by using the predict function.

    * Calculate the speed and profile of the deployed quantized deep learning network
    by using the predict function. Set the Profile parameter to on.


    This figure illustrates the workflow to deploy your quantized deep learning network
    to the FPGA boards.'
