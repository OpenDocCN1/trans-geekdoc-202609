- pgno: 9
  md: '# Introduction to Deep Learning


    Deep learning is a branch of machine learning that teaches computers to do what
    comes naturally to humans: learn from experience. The learning algorithms use
    computational methods to “lern” [sic] to “lern” information directly from data
    without relying on a predetermined equation as model. Deep learning uses neural
    networks to learn useful representations of data directly from images. It is a
    specialized form of machine learning that can be used for applications such as
    classifying images, detecting objects, recognizing speech, and describing the
    content. The relevant features are automatically extracted from the images. The
    deep learning algorithms can be applied to supervised and unsupervised learning.
    These deep algorithms scale with data, that is, the performance of the network
    improves with size of data.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Training Process


    You can train deep learning networks for classification tasks by using methods
    such as training from scratch, or by transfer learning, or by feature extraction.


    # Training from Scratch


    Training a deep learning neural network from scratch requires a large amount of
    labeled data.To create the network architecture by using Neural Network Toolbox",
    you can use the built-in layers, define yours, or import layers from Caffe models.
    The neural network is then trained by using the large amounts of labeled data.
    Use trained network for predicting or classifying the unlabeled data. These networks
    can take few days or couple of weeks to train. Therefore, it is not a commonly
    used method for training networks.


    ![](img/747bfd4f288a7e0917a1f27637cc5c2d_10_0.png)


    ![](img/747bfd4f288a7e0917a1f27637cc5c2d_10_1.png)


    For more information, see “Get Started with Transfer Learning”.


    # Transfer Learning


    Transfer learning is used for cases where there is lack of labeled data, are used
    for this approach. The parameters of pretrained networks are modified to fit the
    unlabeled data. Therefore, transfer learning is used for transferring knowledge
    across various tasks. You can train or modify these networks faster so it is the
    most widely used transfer approach for deep learning applications.


    ![](img/747bfd4f288a7e0917a1f27637cc5c2d_10_2.png)


    For more information, see “Get Started with Transfer Learning”.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Feature Extraction


    Layers in deep learning networks are trained for extracting features from the
    input data. This approach uses the network as a feature extractor. The features
    extracted after the training process can be put into various machine learning
    models such as Support Vector Machines (SVM).'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# # Convolutional Neural Networks


    Convolutional neural networks (CNNs) are one of the most commonly used deep learning
    networks. They are feedforward artificial neural networks inspired by the animal''s
    visual cortex. These networks are designed for data with spatial and temporal
    information. Therefore, convolutional neural networks are widely used in image
    and video recognition, speech recognition, and natural language processing. The
    architecture of convolution neural network consists of various layers which convert
    the raw input pixels into a class score.


    ![](img/747bfd4f288a7e0917a1f27637cc5c2d_12_0.png)


    For more details, see “Learn About Convolutional Neural Networks”.


    You can train CNNs from scratch, by transfer learning, or by feature extraction.
    You can use the trained network for classification or regression applications.


    For more details on training CNNs, see “Pretrained Deep Neural Networks”.


    For more details on deep learning, training process, and CNNs, see Deep Learning
    Onramp.'
  merge: -1
