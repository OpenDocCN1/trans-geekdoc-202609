- pgno: 251
  md: '# Quantization of Deep Neural Networks


    In digital hardware, numbers are stored in binary words. A binary word is a fixed-length
    sequence of bits (1s and 0s). The data type defines how hardware components or
    software functions interpret this sequence of 1s and 0s. Numbers are represented
    as either scaled integer (usually referred to as fixed-point) or floating-point
    data types.


    Most pretrained neural networks and neural networks trained using Deep Learning
    Toolbox™ use single-precision floating point data types. Even small neural networks
    require a considerable amount of memory, and require hardware that can perform
    floating-point arithmetic. These restrictions can inhibit deployment of deep learning
    capabilities to low-power microcontrollers and FPGAs.


    Using the Deep Learning Model Quantization Library support package, you can quantize
    a network to use 8-bit scaled integer data types.


    Quantization of a neural network requires a GPU, Interface for Deep Learning Libraries
    support package, and the Deep Learning Toolbox Model Quantization Library support
    package. Using a GPU requires CUDA® enabled NVIDIA® GPU with compute capability
    6.1, 6.3 or higher.


    # Precision and Range


    Scaled 8-bit integer data types have limited precision and range when compared
    to single-precision floating point data types. There are several numerical considerations
    when casting from a larger floating-point data type to a smaller type of fixed
    length.


    +   - Precision loss: Precision loss is a rounding error. When precision loss
    occurs, the value is rounded to the nearest number that is representable by the
    data type. In the case of a tie it rounds:

    - Positive numbers to the closest representable value in the direction of positive
    infinity.

    - Negative numbers to the closest representable value in the direction of negative
    infinity.

    - Underflow: Underflow is a type of precision loss. Underflows occur when the
    value is smaller than the smallest representable by the data type. When this occurs,
    the value saturates to zero.

    - Overflow: When a value is larger than the largest value that a data type can
    represent, an overflow occurs. When an overflow occurs, the value saturates to
    the largest value representable by the data type.


    # Histograms of Dynamic Ranges


    Use the Deep Network Quantizer to collect and visualize the dynamic ranges of
    the weights and biases of the convolution layers and fully connected layers of
    a network, and the activations of all layers in the network. The app assigns a
    8-bit integer data type for the weights, biases, and activations of the convolution
    layers of the network. The app displays a histogram of the dynamic range for each
    of these parameters. The following steps describe how these histograms are produced.


    +   - Consider the following values logged for a parameter while exercising a
    network.'
