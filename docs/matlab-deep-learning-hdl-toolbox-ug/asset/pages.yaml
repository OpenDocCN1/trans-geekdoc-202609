  md: '# Run a Deep Learning Network on FPGA with Live Camera Input


    ![](img/747bfd4f288a7e0917a1f27637cc5c2d_142_0.png)


    The objective of this system is to receive the live camera input through the HDMI
    input of the FMC daughter card on the ZCU102 board. You design the preprocessing
    logic in Simulink® to select and resize the region of interest (ROI). You then
    transmit the processed image frame to the deep learning processor IP core to run
    image classification by using a deep learning network.


    # Select and Resize the Region of Interest


    Model the preprocessing logic to process the live camera input for the deep learning
    network and send the video frame to external DDR memory on the FPGA board. This
    logic is modelled in the DDR subsystem:


    +   - Image frame selection logic allows you to use your cursor to choose an ROI
    from the incoming camera frame. The selected ROI is the input to the deep learning
    network.

    - Image resizing logic that resizes the ROI to match the input image size of the
    deep learning network.

    - AXI4 Master interface logic that sends the resized image frame to the external
    DDR memory, where the deep learning processor IP core reads the input. To model
    this, see “Model Design for AXI4 Master Interface Generation” (HDL Coder).


    This figure shows the Simulink® model for the preprocessing logic DUT.


