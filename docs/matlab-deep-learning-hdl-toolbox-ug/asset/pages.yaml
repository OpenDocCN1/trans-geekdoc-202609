  md: "# Custom Deep Learning Processor Generation to Meet Performance Requirements\n\
    \nThis example shows how to create a custom processor configuration and estimate\
    \ the performance of a pretrained series network. You can then modify parameters\
    \ of the custom processor configuration and re-estimate the performance. Once\
    \ you have achieved your performance requirements you can generate a custom bitstream\
    \ by using the custom processor configuration.\n\n# Load Pretrained Series Network\n\
    \nTo load the pretrained series network LogoNet, enter:\n\n```\nsnet = getLogoNetwork();\n\
    ```\n\n# Create Custom Processor Configuration\n\nTo create a custom configuration,\
    \ use the dhdll.ProcessorConfig object. For more information, use dhdll.ProcessorConfig\
    \ to learn about modifiable parameters of the processor configuration, use getModuleProperty\
    \ and setModuleProperty.\n\n```\nhPC = dhdll.ProcessorConfig;\nhPC.TargetFrequency\
    \ = 220;\nhPC = \n```\n\n```\nhPC = \nProcessing Module \"conv\"\nConvThreadNumber:\
    \ 16\nInputMemorySize: [227 227 3]]\nOutputMemorySize: [227 227 3]]\nFeatureSizeLimit:\
    \ 2048\nKernelDataType: 'single'\n\nProcessing Module \"fc\"\nFcThreadNumber:\
    \ 4\nInputMemorySize: 25088\nOutputMemorySize: 4096\nKernelDataType: 'single'\n\
    \nProcessing Module \"adder\"\nInputMemorySize: 40\nOutputMemorySize: 40\nKernelDataType:\
    \ 'single'\n```\n\n```\nSystem Level Properties\nTargetFormat: 'Xilinx Zynq UltraScale+\
    \ MPSoC ZCU102 Evaluation\nTargetFrequency: 220\nSynthesisTool: 'Xilinx Vivado'\n\
    ReferenceDesign: 'AXI-Stream DDR Memory Access : 3-AXIM'\nSynthesisToolFamily:\
    \ 'Zynq UltraScale+'nSynthesisToolDeviceName: 'xczu9eg-ffvb1156-2-e'\nSynthesisToolPackageName:\
    \ ''\nSynthesisToolSpeedValue: ''\n```"
