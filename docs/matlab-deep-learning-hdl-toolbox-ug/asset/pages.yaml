  md: '# Logo Recognition Network


    This example shows how to create, compile, and deploy a dhldl.Workflow that has
    Logo Recognition Network as the network object using the Deep Learning HDL™ Support
    Package for Xilinx FPGA and SoC. Use MATLAB® to retrieve the prediction results
    from the target device.


    # The Logo Recognition Network


    Logos assist users in brand identification and recognition. Many companies incorporate
    their logos in advertising, documentation materials, and promotions. The logo
    recognition network (logonet) was developed in MATLAB® and can recognize 32 logos
    under various lighting conditions and camera motions. Because this network focuses
    only on recognition, you can use it in applications where localization is not
    required.


    # Prerequisites


    +   - Xilinx ZCU102 SoC development kit

    - Deep Learning HDL Toolbox™ Support Package for Xilinx FPGA and SoC

    - Deep Learning Toolbox™

    - Deep Learning HDL Toolbox™


