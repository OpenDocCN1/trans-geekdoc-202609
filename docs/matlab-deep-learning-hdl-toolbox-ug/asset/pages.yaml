- pgno: 179
  md: "# Deploy Quantized Network Example\n\nThis example shows how to train, compile,\
    \ and deploy a dldl.Workflow object that has quantized Alexnet as the network\
    \ by using the Deep Learning Toolbox™ Support Package for Xinx FPGA and SoC. Quantization\
    \ helps reduce the memory requirement of a deep neural network by quantifying\
    \ weights, biases and activations of network layers to 8-bit scaled integer data\
    \ types. Use MATLAB™ to retrieve the prediction results from the target device.\n\
    \n# Required Products\n\nFor this example, you need:\n\n+   * Deep Learning Toolbox\
    \ ™\n* Deep Learning HDL Toolbox ™\n* Deep Learning Model Quantization Library\n\
    * Deep Learning HDL Toolbox Support Package for Xinx FPGA and SoC\n* MATLAB Coder\
    \ Interface for Deep Learning Libraries.\n\n# Load Pretrained Series Network\n\
    \nTo load the pretrained series network AlexNet,\n\n```\nsnet = alexnet;\n```\n\
    \nTo view the layers of the pretrained series network, enter:\n\n```\nanalyzeNetwork(snet);\n\
    ```\n\nThe first layer, the image input layer, requires input images of size 227-by-227-by-3,\
    \ where 3 is the number of color channels.\n\n```\ninputSize = snet.Layers(1).InputSize;\n\
    inputSize = 1x3\n227 227 3\n```\n\n# Define Training and Validation Data Sets\n\
    \nThis example uses the logos dataset. The set consists of 320 images. Create\
    \ an augmentedImageDatastore to use for training and validation.\n\n```\ncurDir\
    \ = pwd;\nnewDir = fullfile(matlabroot,'examples','deeplearning_shared','data','logos\
    \ dataset.zip');\ncopyfile(newDir,curDir,'f');\nunzip('logos_dataset.zip');\n\n\
    ```\n\n```\nimds = imageDatastore('logos dataset', ...\n    'IncludeSubFolders',true,\n\
    \    'LabelSource','foldnames');\n\n[imdsTrain,imdsValidation] = splitEach(imds,'randomized');\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 180
  md: "# Replace Final Layers\n\nThe last three layers of the pretrained network are\
    \ configured for 1000 classes. These three layers must be fine-tuned for the new\
    \ classification problem. Extract all the last layers, except the last three,\
    \ from the pretrained network.\n\n```\nlayersTransfer = snet.Layers(1:end-3);\n\
    ```\n\nTransfer the layers to the new classification task by replacing the last\
    \ three layers with a fully connected layer, a softmax layer, and a classification\
    \ output layer. Set the fully connected layer to have the same size as the number\
    \ of classes in the data.\n\n```\nnumClasses = numel(categories(indsTrain.Labels));\n\
    ```\n\n```\nnumClasses = 32\nlayers = [\n    layersTransfer\n    fullyConnectedLayer(numClasses,'WeightLearnRateFactor',20,'BiasLearnRateFactor',20)\n\
    \    softmaxLayer\n    classificationLayer];\n```\n\n# Train Network\n\nThe network\
    \ requires input images of size 227-by-227-by-3, but the images in the image datastore\
    \ have different sizes. Use an augmented datastore to automatically resize the\
    \ training images. Specify additional augmentation operations to perform on the\
    \ training images, such as randomly flipping the images along the vertical axis\
    \ and translating them up to 30 pixels horizontally and vertically. Data augmentation\
    \ helps prevent the network from overfitting and extracting details of the training\
    \ images.\n\n```\npixelRange = [-30 30];\nimageAugmenter = imageDataAugmenter(\n\
    \    RandReflection,'true',\n    RandXdTranslation',pixelRange,\n    RandYTranslation',pixelRange);\n\
    imgdsTrain = augmentedImageDataStore(inputSize(1:2),imgdsTrain,\n    'DataAugmentation',imageAugmenter);\n\
    ```\n\nTo automatically resize the images without performing further data augmentation,\
    \ use an augmented image datastore without specifying any additional preprocessing\
    \ operations.\n\n```\nimgdsValidation = augmentedImageDataStore(inputSize(1.2),imgdsValidation);\n\
    ```\n\nSpecify the training options. For transfer learning, keep the features\
    \ from the early layers of the pretrained network (the transferred layers). To\
    \ slow down learning in the transferred layers, set the initial learning rate\
    \ to a small value. Specify the mini-batch size and validation data. The software\
    \ validates the network every Validation iterations during training.\n\n```\n\
    options = trainingOptions('sgd',\n    'MinBatchSize',10,\n    'MaxEpochs',6,\n\
    \    'InitialLearnRate',1e-4,\n    'Shuffle','every-epoch', ...);\n```"
  merge: -1
  img_proc: true
- pgno: 181
  md: "# Featured Examples\n\n'ValidationData',augdimsValidation, ...\n'ValidationFrequency',3,\
    \ ...\n'Verbose',false, ...\n'Plots','training_progress');\n\nThe train network\
    \ that consists of the transferred and new layers. By default, trainNetwork uses\
    \ a GPU if one is available (requires Parallel Computing Toolbox™ and a supported\
    \ GPU device). For more information, see \"GPU Support by Release\" (Parallel\
    \ Computing Toolbox). Otherwise, the network uses a CPU (requires MATLAB Code\
    \ Interface for Deep Libraries™). You can also specify the execution environment\
    \ by using the 'ExecutionEnvironment' name-value of trainingOptions.\n\nnetTransfer\
    \ = trainNetwork(augmLTrain,Layers,options);\n\n![](img/747bfd4f288a7e0917a1f27637cc5c2d_181_0.png)\n\
    \n| Results | |\n|---|---|\n| Validation accuracy | 99.62% |\n| Training finished\
    \ | Reached final iteration |\n| Start time | 17-Dec-2020 11:01:47 |\n| Duration\
    \ | 2 min 02 sec |\n| Training Cycle | |\n| Epoch | 6 of 6 |\n| Iterations per\
    \ epoch | 22 |\n| Maximum iterations | 22 |\n| Validation | |\n| Iterations |\
    \ 9 iterations |\n| Other information | |\n| Hardware resource | Single GPU |\n\
    | Learning rate | 0.0091 |\n\n# Create dquantizer Object\n\nCreate a dquantizer\
    \ object and specify the network to quantize. Specify the execution environment\
    \ as FPGA.\n\n```\ndlQuantObj = dquantizer(netTransfer, 'ExecutionEnvironment',\
    \ 'FPGA');\n```\n\n# Calibrated Network Quant\n\nThe dquantizer object uses calibration\
    \ data to collect dynamic ranges for the learnable parameters of the convolution\
    \ and fully connected layers of the network.\n\nFor best quantization, the calibration\
    \ data must be a representative of all inputs predicted by the LogoNet network.\
    \ Expedite the calibration process by reducing the calibration data set to 20\
    \ images.\n\n```\nimageData = imageDatastore(fullfile(curDir, 'logos dataset'),\
    \ ... \n'IncludeSubfolders',true, 'FileExtensions', '.JPG', 'LabelSource', 'foldern');\n\
    ```"
