- pgno: 235
  md: '# Classify ECG Signals Using DAG Network Deployed To FPGA


    This example shows how to classify human electrocardiogram (ECG) signals by deploying
    a trained directed acyclic graph (DAG) network.


    Training a deep CNN from scratch is computationally expensive and requires a large
    amount of training data. In various applications, a sufficient amount of training
    data is not available, and synthesizing new realistic data is not feasible. In
    many cases, leveraging existing networks that have been trained on large data
    sets for similar tasks is desirable. Leveraging of existing neural networks is
    transfer learning. In this example we adapt two CNNs, GoogLeNet and Squeezenet,
    pretrained for image recognition to classify ECG waveforms from a frequency-time
    representation.


    GoogLeNet and Squeezenet are deep CNNs designed to classify signals in 1000 categories.
    We reuse the network architecture of the CNN to classify ECG signals from images
    from the CWT of the time series data. The data used in this example are publicly
    available from PhysioNet.


    # Data Description


    In this example, we use ECG data obtained from three groups of people: persons
    with cardiac arrhythmia (ARR), persons with congestive heart failure (CHF), and
    persons with normal sinus rhythms (NSR). In total we use 162 ECG records from
    three PhysioNet databases: MIT-BIH Arrhythmia Database[3], MIT-BIH Normal Rhythm
    Database [3], and the BDMC Heart Failure Database [1][]. Specifically, 96 recordings
    from persons with arrhythmia, 30 recordings from persons with congestive heart
    failure, and 36 recordings from persons with normal sinus rhythms. The goal is
    to train a classifier to distinguish between ARR, CHF, and NSR.


    # Download Data


    The first step is to download the data from the GitHub repository. To download
    the data from the website, click Clone or download and select Download ZIP. Save
    the file physionet_ECG_data_master.zip in a folder where have write permission.
    The instructions for this example assume you have downloaded to your temporary
    directory, tempdir, in MATLAB. Modify if you choose to download the data in different
    folder from tempdir. If you are familiar with Git, you can download the latest
    version of the tools (git) and obtain the data from a system command prompt using
    clone https://github.com/mathworks/physionet_ECG_data/


    After downloading the data from GitHub, unzip the file in your temporary directory.

    unzip(fullfile(tempdir, ''physionet_ECG_data_master.zip''), tempdir)


    Unzipping creates the folder physionet-ECG_data_master in your temporary directory.
    The folder contains the file README.md and ECGData.zip. The ECGData.zip file contains


    +   - ECGData.mat

    - Modified physionet_data.txt

    - License.txt


    ECGdata holds the data used in this example. The file, Modified_physionet_data.txt,
    is required by PhysioNet''s copying policy and provides the source attentions
    for the data as well as a description of the preprocessing steps applied to each
    ECG recording.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Classify ECG Signals Using DAG Network Deployed To FPGA


    Unzip ECGData.zip in physionet-ECG data-master. Load the data file into your MATLAB
    workspace.


    ```

    unzip(fullfile(tempdir, ''physionet ECG data-master'',''ECGData.zip''),..)

    fullfile(tempdir, ''physionet ECG data-master''))

    load(fullfile(tempdir, ''physionet ECG data-master'',''ECGData.mat''))

    ```


    ECGData is a structure array with two fields: Data and Labels. The Data field
    is a 162-65536 matrix where each row is an ECG recording sampled at 128 herz.
    Labels are for each row of Data. The three diagnostic categories are: ''ARR'',
    ''CHF'', ''NSR''.


    To store the preprocessed data of each category, create an ECG data directory
    dataDir inside tempdir. Then create subdirectories in ''data'' named after each
    ECG category. The helper function helperCreateECGdirectories does this. helperCreateECGdirectories
    accepts ECGData, the name of an ECG data directory, and the name of a parent directory
    as input arguments. You can replace tempdir with another directory where you have
    permission. You can find the source code for this helper function in the Supporting
    Functions section at the end of this example.


    ```

    %parentDir = tempdir;

    parentDir = pwd;

    dataDir = ''data'';

    helperCreateECGdirectories(ECGData,parentDir,dataDir)

    ```


    Plot a representative of each ECG category. The helper function helperPlotReps
    accepts ECGData as input. You can find the source code for this helper function
    in the Supporting Functions section at the end of this example.


    ```

    helperPlotReps(ECGData)

    ```'
