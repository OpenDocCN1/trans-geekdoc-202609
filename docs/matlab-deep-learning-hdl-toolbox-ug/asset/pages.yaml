  md: '# Accelerate Prototyping Workflow for Large Networks by using Ethernet


    # Accelerate Prototyping Workflow for Large Networks by using Ethernet


    This example shows how to deploy a deep learning network and obtain prediction
    results using the Ethernet connection to your target device. You can significantly
    speed up the deployment and prediction times for large deep learning networks
    using Ethernet JTAG. This example shows the workflow on a ZCU102 SoC board. The
    example also works on the other boards supported by Deep Learning HDL Toolbox.
    See "Supported Networks, Layers, Boards, and Tools" on page 7-2.


    # Prerequisites


    +   * Xilinx ZCU102 SoC development kit. For help with board setup, "Guided SD
    Card Set Up" (Deep Learning HDL Support Package for Xilinx FPGA and SoC Devices).

    * Deep Learning HDL Toolbox™ Support Package for Xilinx FPGA and SoC

    * Deep Learning HDL Toolbox™

    * Deep Learning Toolbox™ Model for AlexNet Network


    # Introduction


    Deep Learning HDL Toolbox establishes a connection between the host computer and
    FPGA to prototype deep learning networks on hardware. This connection is used
    to deploy deep learning networks and run predictions. The connection provides
    two services:


    +   * Programming the bitstream onto the FPGA

    * Communicating with the design running on FPGA from MATLAB


    There are two hardware interfaces for establishing a connection between the host
    computer and FPGA board: JTAG and Ethernet.


    # JTAG Interface


    The JTAG interface, programs the bitstream onto the FPGA over JTAG. The bitstream
    is not persistent through power cycles. You must reprogram the bitstream each
    time the FPGA is turned on.


    MATLAB uses JTAG to control an AXI Master IP in the FPGA design, to communicate
    with the design running on the FPGA. You can use the AXI Master IP to read and
    write memory locations in the onboard memory and deep learning processor.


    This figure shows the high-level architecture of the JTAG interface.


    ![](img/747bfd4f288a7e0917a1f27637cc5c2d_156_0.png)


    10-77'
