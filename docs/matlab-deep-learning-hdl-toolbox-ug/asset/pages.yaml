- pgno: 213
  md: '# Customize Bitstream Configuration to Meet Resource Use Requirements


    The user wants to deploy a digit recognition network with a target performance
    of 500 frames per second (FPS) to a Xilinx ZUCU102 ZU4CG device. The target device
    resource counts are:


    +   - Digital signal processor (DSP) slice count - 240

    - Block random access memory (BRAM) count -128


    The reference (shipping) zcu102_int8 bitstream configuration is for a Xilinx ZCU102
    ZU9EG device. The default board resource counts are:


    +   - Digital signal processor (DSP) slice count - 2520

    - Block random access memory (BRAM) count -9128


    The default board counts exceed the user resource budget and is on the higher
    end of the cost spectrum. You can achieve target performance and resource use
    budget by quantizing the deep learning network and customizing the default bitstream
    configuration.


    In this example create a custom bitstream configuration to match your resource
    budget and performance requirements.


    # Prerequisites


    +   - Deep Learning HDL Toolbox™ Support Package for Xilinx FPGA and SoC

    - Deep Learning Toolbox™

    - Deep Learning HDL Toolbox ™

    - Deep Learning Toolbox Model Quantization Library


    # Load Pretrained Network


    To load the pretrained series network, that has been trained on the Modified National
    Institute Standards of Technology (MNIST) database, enter:


    ```

    snet = getDigitsNetwork;

    ```


    # Quantize Network


    To quantify the MNIST based network, enter:


    ```

    dquantObj = dquantizer(snet, ''ExecutionEnvironment'', ''FPGA'');

    Image = imageDatastore(''five_28_28.png'', ''Labels'', ''five'');

    dquantObj.calibrate(Image)

    ```


