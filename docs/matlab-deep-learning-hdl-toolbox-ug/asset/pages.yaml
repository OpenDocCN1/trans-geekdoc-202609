- pgno: 218
  md: '# Image Classification Using DAG Network Deployed to FPGA


    This example shows how to train, compile, and deploy a dhldl.Workflow object as
    the network object by using the Deep Learning HDL Toolbox™ Support Package for
    Xilinx FPGA and SoC. Use MATLAB®ae to retrieve the prediction results from the
    target device.


    # Required Products


    For this example, you need:


    +   - Deep Learning Toolbox ™

    - Deep Learning HDL Toolbox ™

    - Deep Learning Toolbox Model for ResNet-18 Network

    - Deep Learning HDL Toolbox Support Package for Xilinx FPGA and SoC Devices

    - Image Processing Toolbox ™


    # Load Pretrained Series Network


    To load the pretrained series network ResNet-18, enter:


    ```

    snet = resnet18;

    ```


    To view the layers of the pretrained series network, enter:


    ```

    analyzeNetwork(snet);

    ```


    The first layer, the image input, requires input images of size 227-by-227-by-3,
    where 3 is the number of color channels.


    # Define Training and Validation Data Sets


    This example uses the MathWorks MerchData set. This is a small data set containing
    75 images of MathWorks merchandise, belonging to five different classes (cap,
    cube, playing cards, screwdriver, and torch).


    ```

    curDir = pwd;

    unzip(''MerchData.zip'');

    imds = imageDatastore(''MerchData'',

    ''IncludeSubfolders'',true,

    ''LabelSource'',''foldernames'');

    [imds.train,imdsValidation] = splitEachLabel(imds,0.7,''randomized'');

    ```


    # Replace Final Layers


    The fully connected network and classification layer of the pretrained network
    are configured for 1000 classes. These two layers fc1000 and ClassificationLayer_predictions
    in ResNet-18 contain information on how to combine the features that the network
    extracts class probabilities and predicted labels. These two layers must be fine-tuned
    for the new classification problem. Extract all the layers, except the last two,
    from the pretrained network.


    ```

    lgraph = layerGraph(snet)

    lgraph = LayerGraph with properties;

    ```'
  merge: -1
  img_proc: true
