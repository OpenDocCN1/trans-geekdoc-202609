- pgno: 269
  md: '# Deep Learning Processor IP Core


    The generated deep learning (DL) processor IP core is a standard AXI interface
    IP core that contains:


    +   - AXI slave interface to program the DL processor IP core.

    - AXI master interfaces to access the external memory of the target board.


    To generate the DL processor IP core, use the HDL Coder™ IP generation workflow.
    The generated IP core contains a standard set of registers and the generated IP
    core report. For more information, see “Deep Learning Processor Register Map”
    on page 12-9


    The DL processor IP core reads inputs from the external memory and sends outputs
    to the external memory. The external memory buffer allocation is calculated by
    the compiler based on the network size and your hardware design. For more information,
    see “Use Compiler Output for System Integration” on page 12-3.


    The input and output data stored in the external memory in a predefined format.
    For more information, see “External Memory Data Format” on page 12-6.


    # See Also


    # More About


    +   - “Custom IP Generation” (HDL Coder)

    - “Use Compiler Output for System Integration” on page 12-3

    - “External Memory Data Format” on page 12-6

    - “Deep Learning Processor Register Map” on page 12-9'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# Use Compiler Output for System Integration


    The compile method:


    +   - Generates the external memory address map.

    - Optimizes networks for deployment.

    - Splits networks into legs for deployment.


    To integrate the generated deep learning processor IP core into your system reference
    design, the compile method outputs.


    # External Memory Address Map


    When you create a dhlwl Workflow object and use the compile method, the compile
    method generates these address offsets based on the deep learning network and
    target board: Use the address map to:


    +   - Load the network inputs.

    - Load the deep learning processor IP instructions.

    - Load the network weights and biases.

    - Retrieve the output results.


    The compile method generates these address offsets:


    +   - InputDataOffset — Address offset where the input images are loaded.

    - OutputResultOffset — Output results are written starting at this address offset.

    - SchedulerDataOffset — Address offset where the scheduler runtime activation
    is written. The runtime activation deates includes information such as hand off
    between the different deep learning processor kernels, instructions for the deep
    learning processor kernels, and on.

    - SystemBufferOffset — Do not use the memory address starting at this offset and
    ending at the start of the InstructionDataOffset.

    - InstructionDataOffset — All layer configuration (LC) instructions are written
    starting at this address offset.

    - ConvWeightDataOffset — All conv processing modules are written starting at this
    address offset.

    - FCWeightDataOffset — All fully connected (FC) processing modules are written
    starting at this address offset.

    - EndOffset — DDR memory offset for generated deep learning processor IP.


    The example displays the external memory map generated for the ResNet-18 recognition
    network that uses the zcu102_single bitstream. See, "Compile dagnet network object.".


    # Compiler Optimizations


    The compile function optimizes networks for deployment by identifying network
    layers that you can execute in a single operation on hardware and then fuse together.
    The compile function performs these layer fusions and optimizations:'
  merge: -1
  img_proc: true
