    \ It may change or be removed in a future release.\n\nfolderLabels = unique(ECGData.Labels);\n\
    for k=1:3\n  ecType = folderLabels(k);\n  ind = find(ismember(ECGData.Labels,ecType));\n\
    \  subplot(3,1,k)\n  plot(ECGData.Data(ind(1),1:1000));\n  grid on\n  title(ecType)\n\
    end\n```\n\nhelperCreateRGBfromTF uses cwtfilterbank(Wavelet Toolbox) to obtain\
    \ the continuous wavelet transform of the ECG signals and generates the scalograms\
    \ from the wavelet coefficients. The helper resizes the scalograms and writes\
    \ them to jpeg images.\n\n```\nfunction helperCreateRGBfromTF(ECGData,parentFolder,childFolder)\n\
    % This function is only intended to support the ECGAndDeepLearningExample.\n%\
    \ It may change or be removed in a future release.\n\nimageRoot = fullfile(parentFolder,childFolder);\n\
    data = ECGData.Data;\nlabels = ECGData.Labels;\n\n[-,signlength] = size(data);\n\
    \nfb = cwtfilterbank('SignalLength',signLength,'VoicesPerOctave',12);\nfor ii\
    \ = 1:r\n  cfs = abs(fb.data(ii,:));\n  im = ind2rgb(imuint8(rescale(cfs)),jet(128));\n\
    \  imgLoc = fullfile(imageRoot,char(labels(ii)));\n  imFileName = strcat(char(labels(ii)),'_',num2str(ii),'.jpg');\n\
    \  imwrite(imresize(im,[224 224]),fullfile(imgLoc,imFileName));\nend\n```"
