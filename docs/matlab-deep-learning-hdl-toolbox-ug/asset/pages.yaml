  md: "# Get Started with Deep Learning FPGA Deployment on Intel Arria 10 SoC\n\n\
    This example shows how to create, compile, and deploy a dhldl.Workflow object\
    \ that has a handwritten character detection series network object using the Deep\
    \ Learning HDL Toolbox Support Package for Intel FPGA and SoC. Use MATLAB® to\
    \ retrieve the prediction results from the target device.\n\n# Prerequisites\n\
    \n+   - Intel Arria™ 10 SoC development kit\n- Deep Learning HDL Toolbox™ Support\
    \ Package for Intel FPGA and SoC\n- Deep Learning HDL Toolbox™\n- Deep Learning\
    \ Toolbox™\n\n# Load the Pretrained SeriesNetwork\n\nTo load the pretrained series\
    \ network, that has been trained on the Modified National Institute Standards\
    \ of Technology (MNIST) database, enter:\n\n```\nsnet = getDigitsNetwork();\n\
    ```\n\nTo view the layers of the pretrained series network, enter:\n\n```\nanalyzeNetwork(snet)\n\
    ```\n\n# Create Target Object\n\nCreate a target object with a custom name for\
    \ your target device and an interface to connect your target device to the host\
    \ computer. Interface uses JTAG and Ethernet. To use JTAG, install Intel Quartus™\
    \ Prime Standard Edition 18.1. Set the path to your installed Intel Quartus Prime\
    \ executable if it is not already set. For example, to set the toolpath:\n\n```\n\
    % hsettoolpath('TargetName', 'Altera Quartus II', 'ToolPath', 'C:\\altera\\18.1\\\
    quartus\\bin64');\nhTarget = dlhl.Target('Intel')\nhTarget =\n    Target with\
    \ properties:\n    Vendor: 'Intel'\n    Interface: JTAG\n```\n\n# Create Workflow\
    \ Object\n\nCreate an object of the dhldl.Workflow class. When you create the\
    \ object, specify the network and the bitstream. Save the pretrained MNIST neural\
    \ network, snet, as the network. Make sure that the bitstream name matches the\
    \ data type and the FPGA board you are targeting. In this example, the target\
    \ FPGA is the Intel Arria 10 SoC and the bitstream uses a single data type.\n\n\
    ```\nhW = dhldl.Workflow('network', 'Bitstream', 'arrival1@soc_single', 'Target',hTarget)\n\
    ```"
  merge: -1
  img_proc: true
