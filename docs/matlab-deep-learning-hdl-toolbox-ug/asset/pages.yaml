- pgno: 182
  md: "imageData reduced = imageData.subset(1:20);\ndlQuantObj.calibrate(imageData_reduced)\n\
    \n# Create Target Object\n\nCreate a target object with a custom name for your\
    \ target device and to connect to your\ntarget device to the host connector: Interface\
    \ supports JTAG and Ethernet. To use JTAG, install\nXilinx™ Vivado™ Design Suite\
    \ 2020.1. To set the Xilinx Vivado toolpath:\n\n```\n% hsetuptoolpath('ToolName',\
    \ 'Xilinx Vivado', 'ToolPath', 'C:\\Xilinx\\Vivado\\2020.1\\bin\\vivado.')\n```\n\
    \nTo create the target object, enter:\n\n```\nhTarget = dhldl.Target('Xilinx','Interface','Ethernet');\n\
    ```\n\nAlternatively, you can use the JTAG interface.\n\n```\n% hTarget = dhldl.Target('Xilinx',\
    \ 'Interface', 'JAG');\n```\n\n# Create Workflow Object\n\nCreate an object of\
    \ the dhldl.workflow class. When you create the class, an instance of\ndligquantizer\
    \ object, the bitstream name, and target information are specified. Specify\n\
    dlQuantObj as network. Make sure that the bitstream name matches the data type\
    \ and the\nFPGA board that you are targeting. In this example, the target FPGA\
    \ board is the Xilinx ZCU102 SOC\nboard and the bitstream uses int8 data type.\n\
    \n```\nhW = dhldl.Workflow('Network', dlQuantObj, 'Bitstream', 'zcu102 int8',\
