- pgno: 61
  md: '# Custom Processor Configuration Workflow


    Estimate the performance and resource utilization of your custom processor configuration
    by experimenting with the settings of the deep learning processor convolution
    and fully connected modules. For more information about the deep learning processor,
    see “Deep Learning Processor Architecture” on page 2-2. For information about
    the convolution and fully connected module parameters, see “Properties”.


    After configuring your custom deep learning processor you can build and generate
    a custom bitstream and custom deep learning processor IP core. For more information
    about the custom deep learning processor IP core, see “Deep Learning Processor
    IP Core” on page 12-2.


    The image shows the workflow to customize your deep learning processor, estimate
    the custom deep learning performance and resource utilization, and build and generate
    your custom deep learning processor IP core and bitstream.


    ```

    Create a ProcessorConfig object

    hPC = dhdli.ProcessorConfig()

    ```


    ```

    Create a workflow object using ProcessorConfig object

    hW = dhdli.Workflow(''Network'',snet,ProcessorConfig,hPC)

    ```


    ```

    Build and generate code for custom

    processor

    dhdli.buildProcessor(hPC)

    ```


    ```

    Estimate the workflow object performance

    hW.estimate(''Performance'')

    ```


    # See Also


    estimatePerformance | estimateResources | dhdli.ProcessorConfig | getModuleProperty
    | setModuleProperty


    # More About


    +   - “Deep Learning Processor Architecture” on page 2-2

    - “Estimate Performance of Deep Learning Network” on page 8-3

    - “Estimate Resource Utilization for Custom Processor Configuration” on page 8-9'
  merge: -1
  img_proc: true
- pgno: 62
  md: "# Estimate Performance of Deep Learning Network\n\nTo reduce the time required\
    \ to design a custom deep learning network that meets performance requirements,\
    \ before deploying the network, analyze layer latencies. Compare deep learning\
    \ network performances on custom bitstream processor comparisons to performances\
    \ on reference (shipping) bitstream processor configurations.\n\nTo learn how\
    \ to use the information in the table data from the estimatePerformance function\
    \ to calculate your network performance, see \"Profile Inference Run\" on page\
    \ 5-4.\n\n# Estimate Performance of Custom Deep Learning Network for Custom Processor\
    \ Configuration\n\nThis example shows how to calculate the performance of a deep\
    \ learning network for a custom processor configuration.\n\n+   1 Create a file\
    \ in your working folder called getLogonNetwork.m. In the file, enter:\n```matlab\n\
