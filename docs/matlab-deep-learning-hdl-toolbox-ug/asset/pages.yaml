- pgno: 276
  md: '# Deep Learning Processor Map


    # # Deep Learning Processor Map


    During custom processor generation, AXI registers are created to enable MATLAB
    or other master devices to control and progress the deep learning (DL) processor
    core.


    The DL processor IP core is generated using HDL Coder IP core generation workflow.
    The generated IP core contains a standard set of registers. For more information,
    see "Custom IP Generation" (HDL Coder).


    For the list of register offsets, see the Register Address Mapping table in the
    generated deep learning (DL) processor core.


    ![](img/747bfd4f288a7e0917a1f27637cc5c2d_276_0.png)


    The image contains all the AXI registers created during IP core generation.


    ![](img/747bfd4f288a7e0917a1f27637cc5c2d_276_1.png)


    2-9'
