- pgno: 74
  md: '# Effects of Custom Deep Learning Processor Parameters on Performance and Resource
    Utilization


    Analyze how deep learning processor parameters affect deep learning network performance
    and bitstream resource utilization. Identify parameters that help improve performance
    and reduce resource utilization.


    This table lists the deep learning processor parameters and their effects on performance
    and resource utilization.


    | Deep Learning Processor Parameter | Deep Learning Processor Module | Parameter
    Action | Effect on Performance | Effect on Resource Utilization |

    |---|---|---|---|---||

    | "TargetFrequency" | Base module | Increase target frequency. | Improves performance.
    | Marginal increase in lookup table (LUT) utilization. |

    | "ConvThreadNumber" | conv | Increase thread number. | Improves performance.
    | Increases resource utilization. |

    | "InputMemorySize" | conv | Increase input memory size. | Improves performance.
    | Increases RAM (BRAM) resource utilization. |

    | "OutputMemorySize" | conv | Increase output memory size. | Improves performance.
    | Increases block RAM (BRAM) resource utilization. |

    | "FeatureLimit" | conv | Increase size limit. | Improves performance on networks
    with layers that have a large number of features. | Increases block RAM (BRAM)
    resource utilization. |

    | "KernelDataType" | conv | Change data type to int8. | Improves performance.
    There could be a drop in accuracy. | Reduces resource utilization. |

    | "FCThreadNumber" | fc | Increase thread number. | Improves performance. | Increases
    resource utilization. |

    | "InputMemorySize" | fc | Increase input memory size. | Improves performance.
    | Increases Block RAM (BRAM) resource utilization. |

    | "OutputMemorySize" | fc | Increase output memory size. | Improves performance.
    | Increases Block RAM (BRAM) resource utilization. |'
