- pgno: 168
  md: "Now, use alexnet to load a pretrained AlexNet model.\n\n```\nfeatureExtractionNetwork\
    \ = alexnet\n```\n\n```\nfeatureExtractionNetwork = \nSeriesNetwork with properties:\n\
    Layers: [25x1 nnet.cnn.layer]\nInputNames: {'data'}\nOutputNames: {'output'}\n\
    ```\n\nSelect 'relu5' as the feature extraction layer to replace the layers after\
    \ relu5 with the detection subsnetwork. This feature layer outputs feature maps\
    \ that are downsampled by a factor of 16. This downsampling is a good trade-off\
    \ between spatial resolution and the strength of the extracted features, as features\
    \ extracted further down the network encode stronger image features at cost of\
    \ spatial resolution. Choosing the optimal feature extraction layer requires empirical\
    \ analysis.\n\n```\nfeatureLayer = 'relu5'\n```\n\nCreate the YOLO v2 object detection\
    \ network.\n\n```\nlgraph = yolov2Layers(inputSize,numClasses,anchorBoxes,featureExtractionNetwork,featureLayer);\n\
    ```\n\nYou can visualize the network using analyzeNetwork or Deep Network Designer\
    \ from Deep Learning Toolbox.\n\nIf more control is required over the YOLO v2\
    \ architecture, use Deep Network Designer to design the YOLO v2 detection network\
    \ manually. For more information, see Design a YOLO v2 Detection Network (Computer\
    \ Vision Toolbox).\n\n# Data Augmentation\n\nData augmentation is used to improve\
    \ accuracy by randomly transforming the original data during training. By using\
    \ data augmentation you can add more variety to the training data without actually\
    \ having to increase the number of labeled training samples.\n\nUse transform\
    \ to augment the training data by randomly flipping the image and associated box\
    \ labels horizontally. Note that data augmentation is not applied to the test\
    \ and validation data. Ideally, test and validation data should be representative\
    \ of the original data and is unmodified for unbiased evaluation.\n\n```\naugmentedTrainingData\
    \ = transform(trainingData,@yolo_augmentedData);\n```\n\n# Preprocessing Training\
    \ Data and Training YOLO v2 Object Detector\n\nPreprocess the augmented training\
    \ data, and the validation data to prepare for training.\npreprocessedTrainingData\
    \ = transform(augmentedTrainingData,@data)yolo_preprocessData(data,input\n\nUse\
    \ trainingOptions to specify network training options. Set 'ValidationData' to\
    \ the preprocessed validation data. Set 'CheckpointPath' to a temporary location.\
    \ This enables the saving of partially trained detectors during the training process.\
    \ If training is interrupted, such as by a power outage or system failure, you\
    \ can resume training from the saved checkpoint.\n\n```\noptions = trainingOptions('sgdm',\
    \ ...\n'MiniBatchSize', 16, ...\n```"
