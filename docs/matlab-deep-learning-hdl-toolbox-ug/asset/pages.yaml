- pgno: 141
  md: '# Run a Deep Learning Network on FPGA with Live Camera Input


    This example shows how to model preprocessing logic that receives a live camera
    input. You implement it on a Zynq® Ultrascale+ MPSoC ZCU102 board by using a custom
    video reference design that has an integrated deep learning processor IP core
    for object classification. This example uses HDL Coder™ HW/SW co-design workflow.
    For this example, you need:


    +   - Deep Learning HDL Toolbox™

    - Deep Learning HDL Toolbox Support Package for Xilinx FPGA and SoC Devices

    - Deep Learning HDL Toolbox™

    - HDL Coder™

    - Simulink™


    # Introduction


    In this example, you:


    +   1. Model the preprocessing logic that processes the live camera input for
    the deep learning processor IP core. The processed video frame is sent to the
    external DDR memory on the board.

    2. Simulate the model in Simulink® to verify the algorithm functionality.

    3. Implement the preprocessing logic on a ZCU102 board by using a custom video
    reference design which includes the generated deep learning processor IP core.

    4. Individually validate the deep learning processor on the FPGA board.

    5. Individually validate the deep learning processor IP core functionality by
    using the Deep Learning HDL Toolbox™ prototyping workflow.

    6. Deploy and validate the entire system on a ZCU102 board.


    This figure is a high-level architectural diagram of the system. The result of
    the deep learning network prediction is sent to the ARM processor. The ARM processor
    annotates the deep learning network prediction onto the output video frame.'
  merge: -1
  img_proc: true
