- pgno: 204
  md: '# Vehicle Detection DAG Network Based YOLO v2 Deployed to FPGA


    This example shows how to train and deploy a you only once (YOLO) v2 object detector.


    Deep learning is a powerful machine learning technique that you can use to train
    robust object detectors. Several techniques for object detection exist, including
    Faster R-CNN and you only once (YOLO) v2. This example trains a YOLO v2 vehicle
    detector using the


    trainYOLOv2objectDetector function.


    # Load Dataset


    This example uses a small vehicle dataset that contains 295 images. Many of these
    images come from the Caltech Cars 1999 and 2001 datasets, available at the Computational
    Vision website, created by Pietro Perona and with permission. Each image contains
    one or two labeled instances of a vehicle. A small dataset is useful for exploring
    the YOLO v2 training, but in practice, more labeled images are needed to train
    a robust detector. Unzip the vehicle ground truth data.


    ```

    unzip DatasetImages.zip

    data = load(''vehicleGroundTruth.mat'');

    vehicleDataset = data.vehicleDataset;

    ```


    The vehicle data is stored in a two-column table, where the first column contains
    the image file paths and the second column contains the vehicle bounding boxes.


    ```

    % Add the fullpath to the local data folder.

    vehicleDataset.imageFilename = fullfile(pwd,vehicleDataset.imageFilename);

    ```


    Split the dataset into training and test sets. Select 60% of the data for training
    and the rest for the trained detector.


    ```

    rng(0);

    shuffledIndices = randperm(height(vehicleDataset));

    idx = floor(0.6 * length(shuffledIndices));

    trainingDataTb = vehicleDataset(shuffledIndices(1:idx));

    testDataTb = vehicleDataset(shuffledIndices(idx+1:end));

    ```


    Use imageastore and labelastore to create datastores for loading the image and
    label data during training and evaluation.


    ```

    mdsTrain = imageastore(trainingDataTb(:,,''imageFilename''));

    bldsTrain = labelastore(trainingDataTb(:,''vehicle''));

    mdsTest = imageastore(testDataTb(:,,''imageFilename''));

    bldsTest = labelastore(testDataTb(:,''vehicle''));

    ```


    Combine image and label datastores.


    ```

    trainingData = combine(mdsTrain,bldsTrain);

    testData = combine(mdsTest,bldsTest);

    ```


    # Create a YOLO v2 Object Detection Network


    A YOLO v2 object detection network is composed of two subnetworks. followed by
    a detection network. The feature extraction network is typically a pretrained
    CNN (for'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# 10 Featured Examples


    details, we Pretrained Deep Neural Networks). This example uses ResNet-18 for
    feature extraction. You can also use other pretrained networks such as MobileNet
    v2 or ResNet-50 depending on application requirements. The detection sub-network
    is a small CNN compared to the feature extraction and is composed of a few convolutional
    layers and layers specific for YOLO v2.


    Use the yolov2Layers function to create a YOLO v2 object detection network automatically
    given a pretrained ResNet-18 feature extraction network. yolov2Layers requires
    you to specify several inputs that parameterize a YOLO v2 network:


    +   - Network input size

    - Anchor boxes

    - Feature extraction network


    First, specify the network input size and the number of classes. When choosing
    the network input size, consider the minimum size required by the network itself,
    the size of the training images, and the computational cost incurred by processing
    data at the selected size. When feasible, choose a network input size that is
    close to the size of the training images and larger than the input size required
    for the network. To reduce the computational cost of running the example, specify
    a network input size of [224 224 3], which is the minimum size required to run
    the network.


    ```

    inputSize = {224 224 3};

    ```


    Define the number of object classes to detect.

    numClasses = width(vehicleDataset)-1;


    Note that the training images used in this example are bigger than 224-by-224
    and vary in size, so you must resize the images in a preprocessing step prior
    to training.


    Next, estimateAnchorBoxes to estimate anchor boxes based on the size of objects
    in the training data. To account for the resizing of the priors prior to training,
    resize the training data for estimating anchor boxes. Use transform to preprocess
    the training data, then define the number of anchor boxes and estimate the anchor
    boxes. Resize the training data to the input image size of the network using the
    function ypreprocessData.


    ```

    trainingDataForEstimation = transform(trainingData,@data)yolo_preprocessData(data,inputSize);

    Anchors = 7;

    meanIoU = estimateAnchorBoxes(trainingDataForEstimation,numAnchors)

    ```


    ```

    anchorBoxes = 7x2


    145 126

    91 86

