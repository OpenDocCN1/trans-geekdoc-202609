- pgno: 103
  md: "# Defect Detection\n\nThis example shows how to deploy a custom trained series\
    \ network to detect defects in objects such as hexagon nuts. The custom networks\
    \ were trained by using transfer learning. Transfer learning is commonly used\
    \ in deep learning applications. You can take a pretrained network and use it\
    \ as a starting point to learn a new task. Fine-tuning a network with transfer\
    \ learning is usually much faster and easier than training a network with randomly\
    \ initialized weights from scratch. You can quickly transfer learned features\
    \ to a new task with a smaller number of training signals. This example uses two\
    \ series networks trainedDefNet.mat and trainedBlemDefNet.mat.\n\n# Prerequisites\n\
    \n+   * Xilinx ZCU102 SoC development kit\n* Deep Learning HDL Toolbox™ Support\
    \ Package for Xilinx FPGA and SoC\n* Deep Learning Toolbox™\n* Deep Learning HDL\
    \ Toolbox™\n\n# Load Pretrained Networks\n\nTo download and load the custom pretrained\
    \ series networks trainedDefNet and trainedBlemDefNet, enter:\n\n```\nif -isfile('trainedDefNet.mat')\n\
    \ url = 'https://www.mathworks.com/supportfiles/dlhdl/trainedDefNet.mat';\n websave('trainedDefNet.mat',url);\n\
    end\nnet1 = load('trainedDefNet.mat');\nsnet_defnet = net1.custom_alexnet\n```\n\
    \nsnet_defnet =\nSeriesNetwork with properties:\n\n```\nLayers: {25x1 nnet.cnn.layer.Layer}\n\
    InputNames: {'data'}\nOutputNames: {'output'}\n```\n\nAnalyze snet_defnet layers.\n\
    \n```\nanalyzeNetwork(snet_defnet)\n```"
