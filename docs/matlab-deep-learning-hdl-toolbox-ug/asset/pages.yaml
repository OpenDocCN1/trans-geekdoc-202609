- pgno: 77
  md: '# Generate Custom Bitstream


    To generate a custom bitstream to deploy a deep learning network to your target
    device, use the dhldl.ProcessorConfig object.


    +   1. Create a dhldl.ProcessorConfig object.


    +   hPC = dhldl.ProcessorConfig;

    2. Setup the path to your design tool. For example, set the path to the Vivado®
    design tool, enter:

    dissetuppath(''Toolname'',''Xilinx Vivado'',''ToolPath'',''C:\Xilinx\Vivado\2019.2\bin\vivado.bat'');

    3. Generate the custom bitstream.


    +   dhldl.buildProcessor(hPC);

    4. After the bitstream is completed, you can locate the bitstream file at cwd\dhldl_prj\vivado_ip.prj\runs\impl_1\
    where cwd is your current working directory. The name of the bitstream file is
    system_top_wrapper.bit. The associated system_wrapper.mat file is located in the
    top level of the cwd.


    To use the generated bitstream for the supported Xilinx boards, you should copy
    the system_top_wrapper.bit and system_top_wrapper.mat files to the same folder.


