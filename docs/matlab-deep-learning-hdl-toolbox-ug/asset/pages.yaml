- pgno: 162
  md: '# Create Series Network for Quantization


    This example shows how to fine-tune a pretrained AlexNet convolutional neural
    network to perform classification on a new collection of images.


    AlexNet has been trained on over a million images and can classify images into
    1000 object categories (such as keyboard, coffee mug, pencil, and many animals).
    The network has learned feature representations for a wide range of images. The
    network takes an image as input and outputs a label for the image together with
    the probabilities for each of the object categories.


    Transfer learning is commonly used in deep learning applications. You can take
    a pretrained network and use it as a starting point to learn a new task. Fine-tuning
    with transfer learning is much faster and easier than training a network with
    randomly initialized weights from scratch. You can quickly transfer learned features
    to a new task using a small number of training images.


    # Load Training Data


    Unzip and load the new images as an image datastore. imageDatastore automatically
    labels the images based on folder names and stores the data as an ImageDatastore.
    An image datastore enables you to store large image data, data that does not fit
    in memory, and efficiently reads data of images during training of a convolutional
    network.


    ```

    unzip(''logos dataset.zip'');

    ```


    ```

    imds = imageDatastore(''logos dataset'', ...n''IncludeSource'',true, ...n''LabelSource'',
    ''foldernames'');

    ```


    Divide the data into training and validation data sets. Use 70% of the images
    for training and 30% for validation. splitEachLabel splits the images datastore
    into two new datastores.


    ```

    [imdsTrain,imdsValidation] = splitEachLabel(imds,0.7,''randomized'');

    ```


    # Load Pretrained Network


    Load the pretrained AlexNet network. If Deep Learning Toolbox Model for AlexNet
    Network is not installed, the software provides a download link. AlexNet is trained
    on over one million images and can classify images into 1000 object categories,
    such as keyboard, mouse, pencil, and many animals. As a result, the model has
    learned feature representations for a wide range of images.


    ```

    snet = alexnet;

    ```


    Use analyzeNetwork to display an interactive visualization of the network architecture
    and detailed information about the network layers.


    ```

    analyzeNetwork(snet)

    ```'
  merge: -1
  img_proc: true
