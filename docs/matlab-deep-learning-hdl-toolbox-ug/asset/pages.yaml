    # Prepare Data for SqueezeNet


    The RGB images have dimensions appropriate for the GoogleNet architecture. Create
    augmented image datastores that automatically resize the existing RGB images for
    the SqueezeNet architecture. For more information, see augmentedImageDatastore.


    augimsTrain = augmentedImageDatastore({227 227},imgsTrain);

    augimsValidation = augmentedImageDatastore({227 227},imgsValidation);


    # Set Training Options and Train SqueezeNet


    Create a set of training options to use SqueezeNet. Set the random to the default
    value and train the network. The training process usually takes 1-5 minutes on
    a desktop CPU.


    ```

    ilr = 3e-4;

    miniBatchSize = 10;

    maxEpochs = 15;

    valFreq = floor(numel(augimsTrain.Files)/miniBatchSize);\opts = trainingOptions(''sgdm'',

    ```


