- pgno: 157
  md: "# Ethernet Interface\n\nThe Ethernet interface leverages the ARM processor\
    \ to send and receive information from the design running on the FPGA. The ARM\
    \ processor runs on a Linux operating system. You can use the Linux operating\
    \ system services to interact with the FPGA. When using the Ethernet interface,\
    \ the bitstream is downloaded to the SD card. The bitstream is persistent through\
    \ power cycles and is reprogrammed each time the FPGA is turned on. The ARM processor\
    \ is configured with the correct device tree when the bitstream is programmed.\n\
    \nTo communicate with the design running on the FPGA, MATLAB leverages the Ethernet\
    \ connection between the host computer and ARM processor. The ARM processor runs\
    \ a LIBIIO service, which communicates with a datamover IP in the FPGA design.\
    \ The datamover IP is useful for data transfers between the host computer and\
    \ FPGA, which is useful for prototyping deep learning networks that would have\
    \ long transfer times over JTAG. The ARM processor generates the read and write\
    \ transactions to access memory locations in both the onboard memory and\n\nThe\
    \ figure below shows the high-level architecture of the Ethernet interface.\n\n\
    ![](img/747bfd4f288a7e0917a1f27637cc5c2d_157_0.png)\n\n# Load and Compile Deep\
    \ Learning Network\n\nThis example uses the pretrained network alexnet. The network\
    \ is a larger network that has significant improvement in transfer time when deploying\
    \ it to the FPGA using Ethernet. To load alexnet, run the command:\n\n```\nsnet\
    \ = alexnet;\n```\n\nTo view the layers of the network enter:\n\nanalyzeNetwork(snet);\n\
    \ The Saved network contains 25 layers including input, convolution, ReLU, cross\
    \ channel normalization; % max pool, fully connected, and the softmax output layers."
