    This image is the input image format after zero padding.


    ![](img/747bfd4f288a7e0917a1f27637cc5c2d_274_1.png)


    The image shows the example external memory data format for the input matrix after
    the zero padding. A, B, and C are the three features of the input image and G
    is the zero-padded data to make the image Z value four, which is a multiple of
    N.


    | DDR Results | DDR External Memory |

    |---|---|

    | A | B | C | D | E | F | G |

    | Padded Data |


    If your deep learning processor consists of only a convolution (conv) the output
    external data is, which means it possibly contains padded data if your output
    Z value is not a multiple of the N value. The padded data is removed when you
    use the d1hd1 workflow. If you do not use the d1hd1 workflow and directly read
    the output from the external memory, remove the padded data.


    # Fully Connected External Memory Data Format


    If your deep learning network consists of both the convolution (conv) and fully
    connected (fc) layers, the output of the deep learning (DL) processor follows
    the fc module external memory data format.


    The image shows the example external memory output data format for a fully connected
    output feature size of six. In the image, A, B, C, D, E, and F are the output
    features of the image.


    ![](img/747bfd4f288a7e0917a1f27637cc5c2d_274_2.png)


