  md: '# Evaluate Performance of Deep Learning Network on Custom Processor Configuration


    Benchmark the performance of a deep learning network on a custom bitstream configuration
    by comparing it to the performance on a reference (shipping) bitstream configuration.
    Use the comparison results to adjust your deep learning processor parameters to
    achieve optimum performance.


    In this example compare the performance of the ResNet-18 on the zcu102 single
    bitstream configuration to the default custom bitstream configuration.


    # Prerequisites


    +   * Deep Learning Toolbox™ Support Package for Xilinx FPGA and SoC

    * Deep Learning Toolbox™

    * Deep Learning HDL Toolbox™

    * Deep Learning Toolbox Model for ResNet-18 Network


    # Load Pretrained Network


    Load the pretrained network.


    ```

    snet = resnet18;

    ```


    # Retrieve zcu102_single bitstream Configuration


    To retrieve zcu102_single bitstream configuration, use the dhdl.ProcessorConfig
    object. For more information, use dhdl.ProcessorConfig. Learn to adjust modifiable
    parameters of the processor configuration, use getModuleProperty and setModule.


    ```

    hPC_shipping = dhdl.ProcessorConfig(''Bitstream'', ''zcu102_single'')

    ```


