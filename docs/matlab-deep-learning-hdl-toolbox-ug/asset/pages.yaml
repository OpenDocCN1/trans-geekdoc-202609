  md: '# Deep Learning on FPGA Solution and Workflows


    The figure illustrates the MATLAB solution for implementing deep learning on FPGA.


    ![](img/747bfd4f288a7e0917a1f27637cc5c2d_23_0.png)


    The FPGA deep learning solution provides an end to end solution that allows you
    to estimate, compile, profile and debug your custom pretrained series network.
    You can also generate a custom deep learning processor IP. The estimator is used
    for estimating the performance of the deep learning framework in terms of speed.
    The compiler converts the pretrained deep learning network for the current application
    for deploying it on the intended target FPGA boards.


    To learn more about the deep learning processor IP, see "Deep Learning Processor
    IP Core" on page 12-2.


    FPGAs provide advantages, such as :


    +   - High performance

    - Flexible interfacing

    - Data parallelism

    - Model parallelism

    - Pipeline parallelism


