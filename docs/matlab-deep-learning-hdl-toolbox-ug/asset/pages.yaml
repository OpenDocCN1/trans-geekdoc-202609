- pgno: 237
  md: "# 10 Featured Examples\n\n![](img/747bfd4f288a7e0917a1f27637cc5c2d_237_0.png)\n\
    \n# ### Create Time-Frequency Representations\n\nAfter making the folders, create\
    \ time-frequency representations of the ECG signals. These representations are\
    \ called scalograms. A scalogram is the absolute value of the CWT coefficients\
    \ of a signal.\n\nTo create the scalograms, precompute a CWT filter bank. Precomputing\
    \ the CWT filter bank is the preferred method when using the CWT of many signals\
    \ using the same parameters.\n\nBefore generating the scalograms, examine one\
    \ of them. Create a CWT filter bank using cfilterbank for a signal with 1000 samples.\
    \ Use the filter bank to take the CWT of the first 1000 samples of the signal\
    \ and obtain the scalogram from the coefficients.\n\n```\nFs = 120;\nfb = cfilterbank('Signallength',1000,...\n\
    \    'SamplingFrequency',Fs,...\n    'VoicesPerOctave',12);\nsig = ECGData.Data(1:1000);\n\
    [cfs,frq] = wt(fb,sig);\nt = (0:999)/Fs;figure;pcolor(t,frq,abs(cfs))\nset(gca,'yscale','log');shading,interp;axis\
    \ tight\ntitle('Scalogram');xlabel('Time (s)');ylabel('Frequency (Hz)')\n```\n\
    \n10-158"
  merge: -1
  img_proc: true
- pgno: 238
  md: "![](img/747bfd4f288a7e0917a1f27637cc5c2d_238_0.png)\n\nUse the helper function\
    \ helperCreateRGBfromTF to create the scalograms as RGB images and write them\
    \ to the appropriate subdirectory in dataDir. The source code for this helper\
    \ function is in the Supporting Functions at the end of this example. To be compatible\
    \ with the GoogLeNet architecture, each RGB image is an array of size 224-by-224-by3.\n\
    \nhelperCreateRGBfromTF(ECListData,parentDir,dataDir)...\n\n# Divide into Training\
    \ and Validation Data\n\nLoad the scalogram as an image datastore. The imageDatastore\
    \ function automatically labels the images by folder names and stores the data\
    \ as an imageDatastore object. An image datastore enables you to store large image,\
    \ including data that does not fit in memory, and efficiently reads batches of\
    \ images during training of a CNN.\n\n```\nallImages = imageDatastore(fullfile(parentDir,dataDir),..\n\
    \    'IncludeSubfolders',true,\n    'LabelSource','foldernames');\n```\n\nRandomly\
    \ divide the images into two groups, one for training and the other for validation.\
    \ Use 80% of the images for training, and the remainder for validation. For purposes\
    \ reproducibility, we set the random seed to the default value.\n\n```\nrng default\n\
