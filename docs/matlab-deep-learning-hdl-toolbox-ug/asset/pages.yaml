- pgno: 188
  md: '# Quantize Network for FPGA Deployment


    This example shows how to quantize learnable parameters in the convolution layers
    of a neural network, and validate the quantized network. Rapidly prototype the
    quantized network by using MATLAB simulation or an FPGA to validate the quantized
    network. In this example, you quantize the LogoNet neural network.


    For this example, you need:


    +   - Deep Learning Toolbox™

    - Deep Learning HDL Toolbox™

    - Deep Learning Model Quantization Library

    - Deep Learning HDL Toolbox Support Package for Xilinx FPGA and SoC Devices

    - MATLAB C Interface for Deep Learning Libraries.


    # Load Pretrained Network


    To load the pretrained LogoNet network and analyze the network architecture, enter:


    ```

    snet = getLogoNetwork;

    analyzeNetwork(snet)

    ```


    ![](img/747bfd4f288a7e0917a1f27637cc5c2d_188_0.png)


    # Define Calibration and Validation Data Sets


    This example uses the latest dataset data. The data set consists of 320 images.
    Each image is 227-by-227 in size and has three channels (RGB). Create an augmentedDatastore'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# Featured Examples


    object to use for calibration and validation. Expedite calibration and validation
    by reducing the calibration data set to 20 images. The MATLAB simulation workflow
    has a maximum limit of five images when validating the quantized network. Reduce
    the validation data set sizes to five images. The FPGA validation workflow has
    a maximum limit of deeimage when validating the quantized network. Reduce the
    validation data set to a single image.


    ```

    curDir = pwd;

    newDir = fullfile(matlab,''examples'',''deeplearning_shared'',''data'',''logos_dataset.zip'');

    copyfile(newDir,curDir,''f'');

    unzip(logos_dataset.zip'');

    imageData = datastore(''FileExtensions'',''*.JPG'',''LabelSource'',''foldernames'');

    ibrationData,validationData = splitlabel(imageData,0.5,randomized);

    validationData reduced = validationData.subset(1:20);

    validationData simulation = validationData.subset(1:1);

    ```


    # Create Quantized Network Object


    Create a dquantizer object and specify the network to quantify. Specify the execution
    environment for FPGA for one object. Use the MATLAB simulation on the second dquantizer
    object


    ```

    dQuantObj_simulation = dquantizer(net,''ExecutionEnvironment'',''FPGA'',''Simulation'',''on'');

    dQuantObj_FPGA = dquantizer(net,''ExecutionEnvironment'',''FPGA'');

    ```


    # Calibrate Quantized Network


    Use the calibrate function to exercise the network with sample inputs and collect
    the range information. The calibrate function exercises the network and collects
    the dynamic ranges of the weights and biases. The calibrate function returns a
    table. Each row of the table contains information for a learned parameter of the
    quantized network.


    ```

    dQuantObj_simulation.calibrate(calibrationData_reduced)

    ```


