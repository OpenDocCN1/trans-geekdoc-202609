- pgno: 136
  md: '# Authoring a Reference Design for Live Camera Integration with Deep Learning
    Processor IP Core


    This example shows how to create an HDL Coder™ reference design that contains
    a generated deep learning processor IP core. The reference design receives a live
    camera input and uses a deployed series network to classify the objects in the
    camera input. This figure is a high-level architectural diagram that shows the
    reference design that will be implemented on the Xilinx™ Zynq™ Ultrascale+ (TM)
    MPSoC ZCU102 Evaluation Kit.


    ![](img/747bfd4f288a7e0917a1f27637cc5c2d_136_0.png)


    The user IP core block:


    +   - Extracts the region of interest (ROI) based on ROI dimensions from the processing
    system (ARM).

    - Performs downsampling on the input image.

    - Zero-centers the input image.

    - Transfers the preprocessed image to the external DDR memory.

    - Triggers the deep learning processor IP core.

    - Notifies the PS(ARM) processor.


    The deep learning processor IP core accesses the preprocessed inputs, performs
    the object classification and loads the output results back into the external
    DDR memory.


    The PS (ARM):


    +   - Takes the ROI dimensions and passes them to the user IP core.

    - Performs post-processing on the image data.

    - Annotates the object classification results from the deep learning processor
    IP core on the output video frame.'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'You can also use MATLAB® to retrieve the classification results and verify
    the generated deep learning processor IP core. The DUT for this reference design
    is the preprocessing algorithm (User IP Core). You can design the preprocessing
    DUT algorithm in Simulink®, generate the DUT IP core, and integrate the generated
    DUT IP core into the larger system that contains the deep learning processor IP
    core. To learn how to generate the DUT IP core, see “Run a Deep Learning Network
    on FPGA with Live Camera” on page 10-2.


    # Generate Deep Learning Processor IP Core


    Follow these steps to configure and generate the deep learning processor IP core
    into the reference design.


    +   1. Create a custom deep learning processor configuration.

    hPC = dlhd.dlhdProcessorConfig


    To learn more about the deep learning processor architecture, see “Deep Learning
    Processor Architecture” on page 2-2. To get information about the custom processor
    configuration parameters and modifying the parameters, see getModuleProperty and
    setModuleProperty.


    +   2. Generate the Deep Learning Processor IP core.


    To learn how to generate the custom deep learning processor IP, see “Generate
    Custom Processor IP” on page 9-4. The deep learning processor IP core is generated
    by using the HDL Coder™ IP generation workflow. For more information, see “Custom
    IP Generation” (HDL Coder).


    dlhd.buildProcessor(hPC)


    The generated IP core files are located at cwd\dlhd_prj\ipcore. cwd is the current
    working directory. The ipcore folder contains an HTML report located at cwd\dlhd_prj\ipcore\DUT_ip_v1@.doc.'
