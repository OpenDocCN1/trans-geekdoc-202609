  md: "# 10 Featured Examples\n\n![](img/747bfd4f288a7e0917a1f27637cc5c2d_113_0.png)\n\
    \n# Quantize and Deploy trainedBlemNet Network\n\nThe trainedBlemNet network improves\
    \ performance to 45 frames per second. The target performance of the deployed\
    \ network is 100 frames per second while staying within the target resource utilization\
    \ budget. The resource utilization budget takes into consideration parameters\
    \ such as memory size, board IO, and so on. Increasing the resource utilization\
    \ could mean choosing a larger board which could cost more. Increase deployed\
    \ network performance and stay within resource utilization budget by quantizing\
    \ the network. To quantize and deploy the trainedBlemNet:\n\n+   - Load the dataset\
    \ as an imageastore. The imageData labels images based on folder names and stores\
    \ the data. Divide the data into calibration and validation sets. Use 50% of the\
    \ images for calibration and 50% of the images for validation. Expedite the calibration\
    \ and validation process by using a subset of the calibration and validation image\
    \ sets.\n\n```\nif -isfile 'dataset.zip'\n  url = 'https://www.mathworks.com/supportfiles/dlhdl/dataset.zip';\n\
    \  websave('dataset.zip',url)\nend\nunzip('dataset.zip')\nimageData = imageDatastorefullfile('dataset',\n\
    \    'IncludeFolders',true, 'FileExtensions',''.PNG', 'LabelSource','foldernames'),\n\
    [calibrationData, validationData] = splitLabel(imageData, 0.5, 'randomized');\n\
    calibrationData_reduced = calibrationData.subset(1:20);\nvalidationData_reduced\
    \ = validationData.subset(1:1);\n```\n\n+   - Create a quantized network using\
    \ the dlquantizer object. Set the target execution environment to FPGA.\n\ndlQuantObj\
    \ = dlquantizer(snet_blemdenet, 'ExecutionEnvironment', 'FPGA')\n\n10-34"
