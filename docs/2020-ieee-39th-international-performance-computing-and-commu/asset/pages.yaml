  md: '# # When is Enough? “Just Enough” Decision Making with Recurrent Neural Networks
    for Radio Frequency Machine Learning


    Morgan Moore¹, William H. Clark IV², R. Michael Buehrer, PhD³, and William C.
    Headley, PhD⁴

    ²Ted and Karn Hume Home Center for National Security and Technology, Virginia
    Tech

    ³Bradley Department of Electrical and Computer Engineering, Virginia Tech


    *Abstract—Prior work has demonstrated that recurrent network architectures show
    promising improvements over other machine learning architectures when processing
    temporally related inputs, such as communication signals. Additionally, recurrent
    neural networks typically process data on a sequence rather than a single point.
    In this work, we investigate the use of “just enough” decision making for inferences
    based on a limited number of recurrent signals. Since some applications require
    reliable decisions quickly, particularly in applications such as electronic warfare
    and dynamic spectrum, we evaluate the validity of this concept, four approaches
    to making “just enough” decisions are considered in this work and each assesses
    the feasibility for wireless communication machine learning.


    **Index Terms**—radio frequency, spectrum sensing, modulation classification,
    recurrent neural networks


    # ## I. INTRODUCTION


    Although the use of RNNs in these applications has shown to improve performance
    over Convolutional Neural Network (CNN) architectures, there are tradeoffs. If
    inputs are processed sequentially rather than in a large


    RNNs are typically slow to train and evaluate [8]. To leverage the benefits of
    both approaches, and reduce respective drawbacks, hybrid networks like WaveNet
    [9] and FastWaveNet [10] have been developed that use dilation to minimize RNN
    while reducing training and evaluation time. Other researchers have also focused
    on minimizing complexity for resource constrained devices [11].


    In addition to time, RNNs can also suffer from long latency. In many spectrum
    applications, decisions need to be made as quickly as possible. For example, in
    electronic warfare where milliseconds may be vital. This work introduces a concept
    to reduce the inference times of RNNs dynamically using “just enough” inference
    to make reliable decisions.


    # ## II. METHODOLOGY


    RFML-based networks are typically trained with signal consisting of a pre-defined
    number of samples or symbols and the output is given after all inputs have been
    processed. To control the slow training and evaluation times, shorter signal lengths
    can be used. However, it is observed that longer lengths are necessary when differentiating
    different signal types such as 16-QAM and QPSK for signal types. This is true
    in both RFML-based and non-RFML spectrum sensing applications [12]. Figure 1 shows
    an example of the output of a trained RNN (details of which will be discussed
    in Section III) for four types with an SNR of 0 dB. The x-axis represents the
    current input and the y-axis represents the prediction. While the signal is recognized
    almost immediately, the 16-QAM signal is initially misidentified as Q4-QAM and
    does not consistently produce the correct answer until just later (and even when
    with less confidence).


    In symbol-by-symbol implementations, RNNs can process more or less symbols than
    they were trained on. In the case of Figure 1, for example, the network was trained
    with a signal length of 1024 symbols, but which clearly does not


