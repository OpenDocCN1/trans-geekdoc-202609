    In the following, results presented in Figure 2 and Table III are discussed of
    the considered "just" decision techniques.


    # A. Subset


    The SUB technique gives the most control over the number of input, as shown in
    the line of Figure 2(a). The major drawback of this technique is that it does
    not leverage any information on the output of the network, which is inherently
    inflexible. This results in a significant performance loss for lower values of
    duration, a 200 model as similar to the original when processed BPSK signals.
    However, for 64-QAM signals, performance decreased by 11 percent and for 16-QAM,
    it decreased by 17 percent. These mirror the example illustrated in Figure 1 and
    show the need for flexibility. The SUB technique is not analogue to processing
    on a smaller signal length, which results in sending the same number of samples
    for every signal type. Future work will focus on reducing a smaller signal length
    and then evaluating for a larger duration using the techniques defined in this
    paper.


    # B. Threshold


    The THR technique overall performed poorly. While it processed significantly less
    of the input samples (less than 10 percent), the accuracy for each model was considerably


    lower than its original. A deeper understanding of the softmax layer and classification
    networks is useful to understand why this is. The softmax layer has values of
    each output up to one, similar to a softmax probability distribution. Thus, the
    softmax value is often, perhaps used, as a measure of the network''s confidence
    in it. By logic, when an RNN processes the first input of a signal each softmax
    value should be approximately equal (around 0.2). In practice, one will have a
    significantly higher softmax value than the others, even for the first few samples
    when the RNNs are not as stable.


    If softmax was a true measure of the network, then the THR technique would work
    well very. However, instead the technique causes to make a decrease before it
    has increase. Figure 2(b) shows that the average PC of the THR technique was low,
    as did increase in the value of threshold, the network processed less than 10
    percent of the signal and had an average PC of only 0.54.


    # C. Above Threshold


    As a combination of the two techniques, the SAT performed very well. It avoided
    the issues of the previous two techniques by setting at least a number of input
    and incorporating information on the RNN. This technique was able to achieve the
    balance between the two without making a loss of 20 to 40 percent of the input
    samples. The overall combination for each model is shown in Table III. The combinations
    resulting in the best performance while minimizing the input samples used to a
    duration of around 0.5 and a higher threshold of 0.3 or 0.9. With combinations
    with lower values and higher values of duration achieved acceptable performance,
    but a larger percentage of the signal.


    # D. Delta Threshold


    Similar to the SAT technique, the DL technique avoids the pitfalls of the SUB
    and THR techniques. However, the DL technique was designed to achieve the accuracy
    of the original model while processing an average of 35 to 45 percent of the input
    samples. Figure 2(d) shows that with a smaller duration resulting in a larger
    percentage of the input processed. However, there is not a significant difference
    between the different-threshold values while there is a large gap in the PSP with
    lower values of duration. To achieve the performance of the original model, each
    delta-threshold needed a duration of around 0.4. The DL technique had overall
    well performance and as least dependency on the user-defined variables. While
