    # B. Threshold Technique


    The second technique, which will be referred to as the threshold (THR) technique,
    processes the input using the softmax of the output user-defined value simply
    threshold. For example, if the value of threshold is 0.9, then the classifier
    acts as a softmax for any given class order.


    # C. Sub-above-Threshold Technique


    The third technique will be referred to as the subset above (SAT) technique and
    is a combination of the two techniques. More specifically, this technique requires
    the softmax of a class to exceed a user-defined value, termed threshold, for a
    certain number of consecutive inputs, termed duration. For example, if the value
    of threshold is 0.9 and duration 100, then the softmax of the first class must
    exceed 0.9 for 100 consecutive steps or the RNN will determine the output.


    of processing new input is contained in the decision. Figure 1(a) shows that for
    a more simple input, (BPSK) the RNN reaches a decision almost immediately. Figure
    1(b) shows that for a more complex input, (16Q) the RNN will not make a proper
    decision. It is clear from these, that "just decision" is not feasible by visual
    inspection, technique by which to determine the stopping conditions which are
    necessary for real-world applications. In this work, candidate techniques are
    investigated in order to determine these stopping conditions, but not without
    an exhaustive solution for this proposed concept. Each candidate technique is
    a post-training technique that utilizes the softmax of the RNN. No changes were
    necessary to the architecture or training of the RNN. There are two important
    considerations to be made when investigating these techniques. First, is that
    the considered technique can be implemented in the model without needing to change
    the model'' architecture or processing. Secondly, and most importantly, the chosen
    techniques must be calculated by the runtime evaluation of the RNN. If a technique
    takes longer than to execute, then it can''t keep up with the RNN execution, thus
    rendering the technique impractical for "just enough".


    # D. Delta Threshold


    The fourth technique, which will be referred to as delta-threshold (DEL), is designed
    to lock stability or zero slope in the softmax value. The delta technique allows
    the softmax to remain within a user-defined value, DEL, for the number of consecutive
    steps that the network needs to have high confidence in this decision, but where
    new information processing will not change the network''s decision. It depends
    on two user-defined variables: delta-threshold which determines the amount between
    outputs that is tolerated and duration, the number of consecutive inputs for which
    the change must be below the delta-threshold. The change is first compared with
    the current input and the first input in the series and is the change between
    consecutive inputs. For example, if duration is 100, and the first in the softmax
    is 0.9, then the output of the RNN will not stay between 0.8 and 1 for 100 symbols.
    In such case, if the output will drop from 0.9 to 0.8 the counter will reset.
    The network will only make its decision if both these conditions are true for
    100 consecutive steps.


    # A. Subset Technique


    The first technique, and most simple, is referred to here as the subset (SUB)
    technique. As the names imply, this technique processes a user-defined subset
    of the original signal. More specifically, the amount of input processed before
    making its decision is determined by the user-defined duration. For example, a
    training signal length of 1024 symbols and a duration of 100, the network will
    always process only the first 9.7 percent of the signal and stop. While this approach
    is not to a realistic technique, it is as baseline for comparative purposes.


    # V. ANALYSIS


    Of each candidate technique, two metrics are used to evaluate the performance
    and processing of the RNNs. The first metric is the RNN''s average PCC, which
    is simply the number of the correct signal predicted by the total number of symbols
    evaluated. The second metric is the portion of the total input processed (PSP)
    before the RNN made its decision.


    Each technique is evaluated in Section IV and then compared in III when it does
    not leverage any of the model''s candidate techniques. To determine the tradeoff
    between PCC and PSP, a range of values for threshold, delta-threshold, and


