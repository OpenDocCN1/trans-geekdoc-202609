    Given the observed performance of the considered RNN architectures, the aim of
    this paper is to develop the concept of "just enough" decision making that allows
    for using simpler signals when processing longer observations than during training
    for more complex signals, the latter of is investigation in future work. More,
    this paper investigates by which the network determines what point it has confidence
    in despite noisy inputs.


    The scope of this paper is for an RFML-Based Automatic Modulation Classification
    (AMC), but can be generalized to other types of interest, such as those discussed
    in Section III. The considered AMC and its representative RNNs are presented.
    In IV, the "just enough" decisions investigated are introduced and their comparative
    performance is presented in Section V. Finally which is concluded and work is
    suggested in Section VI.


    # III. SYSTEM MODEL


    In order to generalize the takeaways of the concept introduced within this work,
    a total of five different RNN AMCs were trained and evaluated. While Long-Short
    Term Memory (LSTM) and Gated Recurrent Unit (GRU) based RNNs have been used widespread
    in RFML applications, both architectures are considered.


    # A. RNN Training and Evaluation Data


    To facilitate training, synthetic (i/Q) symbols were generated for modulation
    schemes, BPSK, QPSK, 16-QAM, and QAM. A fixed signal length of 1024 symbols were
    used for all generated data. Symbols were pulse shaped with a root-raised cosine
    filter using a roll-off rate of 0.5 and an over-sampling rate of 4 samples per
    symbol. The pulse-sampled samples were fed through an AWGN channel with a variable
    SNR from 0 to 10. The received symbols were then demodulated and a match was filtered.
    Each RNN was trained on 8000 examples per SNR per, for a total of 80 per class,
    and tested on a separately generated dataset of 100 examples per SNR per, for
    a total of 1,100 per.


    # B. Model Architecture


    The basic architecture for each model is shown in Table I and II we were trained
    using the PyTorch library. As can be, to generalize the takeaways of this work
    RNN architectures, details were chosen for the number of recurrent layers, the
    hidden size of the layers, the size of the linear layers, dropout regularization
    for all models. Table II shows the average probability of correct classification
