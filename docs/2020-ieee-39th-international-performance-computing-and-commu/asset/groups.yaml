    ## IV. “恰好”决策技术


    “恰好”决策的概念基于这样一个想法：RNN 可以通过停止处理新输入来更高效地做出决策。输出的 softmax 用户定义的值。例如，如果阈值为 0.9，则分类器在任何类别顺序上操作。


    ### B. 阈值技术


    第二种技术将被称为阈值 (THR) 技术，它使用 softmax 处理输入。


    ### C. 超过阈值技术


    第三种技术将被称为子集超过-阈值 (SAT) 技术，它是前两种技术的结合。更具体地说，该技术要求类别的 softmax 超过一个用户定义的值，称为“阈值”
    (threshold)，持续一定数量的输入，称为“持续时间” (duration)。例如，如果阈值为 0.9 且持续时间为 100，那么第一个类的 softmax
    必须在连续 100 步内超过 0.9，否则 RNN 将无法确定输出。图 1(a) 显示对于简单的输入 (BPSK)，RNN 几乎立即做出决策。图 1(b)
    显示对于复杂的输入 (16Q)，RNN 将无法做出正确的决策。从这些可以明显看出，“恰好”决策通过视觉检查是不可行的，需要一种确定现实应用所需的停止条件的技术。在这工作中，研究了候选技术以确定这些停止条件，但尚未为该建议的概念提供详尽解决方案。每个候选技术都是利用
    RNN softmax 的后训练技术。不需要对 RNN 的架构或训练进行更改。


    ### D. 差阈值


    第四种技术被称为差阈值 (DEL)，旨在锁定 softmax 值的稳定性或零斜。差技术允许 softmax 在用户定义的值 DEL 内持续若干连续步，使网络对该决策具有高置信度，但新信息的处理不会改变网络的决策。它取决于两个用户定义的变量：决定容忍输出之间差值的差阈值，以及变化必须低于差阈值的连续输入数量（持续时间）。变化首先与当前输入和序列中的第一个输入进行比较，即连续输入之间的变化。例如，如果持续时间为
    100，且第一个 softmax 为 0.9，那么 RNN 的输出将会在 100 个符号内保持在 0.8 到 1 之间。在这种情况下，如果输出从 0.9 跳到
    0.8，计数器将重置。只有当这两个条件连续 100 步均成立时，网络才会做出决策。


    ### A. 子集技术


    第一种也是简单的技术在这里被称为子集 (SUB) 技术。正如名称所示，该技术处理原始信号的用户定义的子集。更具体地说，在做出决策之前处理的输入量由用户定义的持续时间决定。例如，训练信号长度为
    1024 个符号且持续时间为 100，网络将始终处理前 9.7% 的信号并停止。虽然这种方法不是现实的技术，但可以作为比较的基准。


