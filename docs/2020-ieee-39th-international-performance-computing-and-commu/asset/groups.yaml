    # C. Sub-above-Threshold Technique


    The third technique will be referred to as the subset above (SAT) technique and
    is a combination of the two techniques. More specifically, this technique requires
    the softmax of a class to exceed a user-defined value, termed threshold, for a
    certain number of consecutive inputs, termed duration. For example, if the value
    of threshold is 0.9 and duration 100, then the softmax of the first class must
    exceed 0.9 for 100 consecutive steps or the RNN will determine the output.


