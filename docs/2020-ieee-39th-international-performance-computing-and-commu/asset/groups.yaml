    PC 较低，随着阈值值的增加也是如此，网络处理的信号小于信号的 10%，且平均 PC 仅为 0.54。


    ## C. 阈值之上 (Above Threshold)


    作为两种技术的结合，SAT 表现非常好。它通过设置至少数量的输入并结合关于 RNN 的信息，避免了前两种技术的问题。该技术能够在不损失 20% 到 40%
    输入样本的情况下实现两者之间的平衡。每个模型的整体组合如 III 所示。将输入样本减少到约 0.5 左右的时长和 0.3 或 0.9 的较高阈值是产生最佳性能的组合。使用较低和较高值时长的组合也实现了可接受的性能，但信号百分比更大。


    ## D. 差值阈值 (Delta Threshold)


    与 SAT 技术类似，DL 技术规避了 SUB 和 THR 技术的陷阱。然而，DL 技术的设计目标是在处理平均 35% 到 45% 输入样本的同时达到原始模型的准确率。图
    2(d) 显示，较短的时长导致处理的输入百分比更大。然而，不同阈值值之间没有显著差异，但在时长值较低时，PSP 存在巨大差距。为了达到原始模型的性能，每个差值阈值都需要
    0.4 左右的时长。DL 技术整体性能良好，且对用户定义变量的依赖最少。虽然变量的初始选择导致了很大的波动，但 DEL 技术的平均 PCC 很少低于 80%。由于
    SNR 引起的变化不那么明显，但仍表现出明显的趋势。SAT 技术在 10 dB SNR 下处理的输入比例为 23%，在 0 dB SNR 下处理的比例更多，而
    DEL 技术处理了 30%。SAT 和 DEL 技术在较低 SNR 和高阶调制方案下都处理了大部分符号。


    ## E. 灵活性研究


