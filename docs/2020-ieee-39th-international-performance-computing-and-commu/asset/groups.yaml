    # 何时才足够？用于射频机器学习的循环神经网络“恰好”决策方法


    Morgan Moore¹, William H. Clark IV², R. Michael Buehrer, PhD³, and William C.
    Headley, PhD⁴

    ²弗吉尼亚理工大学国家安全与技术 Ted and Karn Hume 归属中心

    ³弗吉尼亚理工大学 Bradley 电气与计算机工程系


    *摘要——此前的工作表明，在处理与时间相关的输入（如通信信号）时，循环网络架构相比其他机器学习架构显示出极具前景的改进。此外，循环神经网络通常对序列处理数据而非单个点。在这项工作中，我们研究了基于有限数量循环信号进行推理的“恰好”决策方法。由于某些应用需要快速做出可靠决策，特别是在电子战和动态频谱等应用中，我们评估了这一概念的有效性。本工作考虑了四种做出“恰好”决策的方法，并评估了它们在无线通信机器学习中的可行性。*


    **索引术语**——射频，频谱感知，调制分类，循环神经网络


    ## I. 引言


    尽管在这些应用中中使用 RNN 已证明其性能优于卷积神经网络（CNN）架构，但仍存在权衡。如果输入是按顺序处理而非大批量处理，RNN 的训练和评估速度通常很慢
    [8]。为了利用两种方法的优点并减少各自的缺点，已经开发了如 WaveNet [9] 和 FastWaveNet [10] 等混合网络，这些网络使用空洞卷积来最小化
    RNN 的同时缩短训练和评估时间。其他研究人员还关注于降低资源限制设备的复杂度 [11]。


    除了时间之外，RNN 还会受到长延迟的影响。在许多频谱应用中，需要尽可能快地做出决策。例如在电子战中，毫秒级可能至关重要。这项工作引入了一种概念，通过使用“恰好”推理动态减少
    RNN 的推理时间，以做出可靠决策。


    ## II. 方法论


    基于 RFML 的网络通常由预定义数量样本或符号的信号进行训练，并在所有输入处理完成后给出输出。为了控制缓慢的训练和评估时间，可以使用较短的信号长度。然而观察到，在区分不同的信号类型（如
    16-QAM 和 QPSK）时，较长的长度是必要的。这在基于 RFML 和非 RFML 的频谱感知应用中都是如此 [12]。图 1 显示了训练后的 RNN
    在 SNR 为 0 dB 时对四种类型信号的输出示例（细节将在第三节中讨论）。x 轴代表当前输入，y 轴代表预测。虽然信号几乎立即识别，但 16-QAM 信号最初被误识别为
    Q4-QAM，并且直到稍后（即使在置信度较低时）才一致地产生正确答案。


    在逐符号的实现中，RNN 处理的符号可能多于或少于其训练时的数量。以图 1 为例，网络使用长度为 1024 个符号的信号进行训练，但显然在做出置信输出之前不需要处理整个网络。在
    BPSK 情况下，在处理少于 10% 的输入符号后就识别出了正确符号。在 16-QAM 情况下，在处理了 80% 的输入符号后识别出正确符号。


    M 的工作得到了弗吉尼亚理工大学 Bradley 电气与计算机工程系 Bradley Masters 学金的支持。


    ![](img/e97a64f448734b462a96945624422824_1_0.png)


    图 1 通过表 II 中的 Model 1 处理的 2 dB 信号的 softmax 输出。输出显示未包含任何“恰好”决策。相反，决策是在最后一个接收到的符号被处理后根据最高输出做出的，这里是在
    1024 个输入符号之后。在 (a) 中，网络在处理少于 10% 的输入符号后收敛到 BPSK 答案。在 (b) 中，网络在处理了 80% 的输入符号后才收敛到
    16-QAM 答案。


    考虑到考虑的 RNN 架构性能，本文的目标是开发一种“恰好”决策的概念，允许在处理更复杂的信号时使用更长的信号。此外，本文研究了网络在尽管存在噪声输入的情况下确定其置信点的机制。


    本文的范围是基于 RFML 的自动分类 (AMC)，但可以推广到其他感兴趣类型，如第三节所述。所考虑的 AMC 及其代表性 RNN 在第四节中给出，“恰好”决策进行了调查并在第五节给出了比较性能。最后在第六节得出结论。


    ## III. 系统模型


    为了推广这项工作中引入的概念，我们训练并评估了五种不同的 AMC。基于长短期记忆 (LSTM) 和门控循环单元 (GRU) 的 RNN 被广泛应用于 RFML
    应用，两种架构均被考虑。


    ### A. RNN 训练与评估


