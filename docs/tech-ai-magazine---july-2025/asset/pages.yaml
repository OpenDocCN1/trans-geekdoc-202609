  md: '# # o3-pro


    Version of o3 with more compute for better responses


    The o-series of models are trained with reinforcement learning to think before
    they answer and perform complex reasoning. The o3-pro model uses more compute
    to think harder and provide consistently better answers. o3-pro is available in
    the Responses API only to enable support for multi-turn model interactions before
    responding to API requests, and other advanced API features in the future. Since
    o3-pro is designed to tackle tough problems, some requests may take several minutes
    to finish. To avoid timeouts, try using background mode.


    +   - 200,000 context window

    +   - 100,000 max output tokens

    +   - Jun 01, 2024 knowledge cutoff

    +   - Reasoning token support


    # ## The New Champion''s Performance


    What makes o3 Pro High''s victory particularly impressive isn''t just its marginal
    lead it''s the exceptional balance it maintains across all cognitive domains.
    The model achieved an outstanding 94.67 in reasoning tasks, demonstrating near-perfect
    logical problem-solving capabilities that mirror human-level analytical thinking.
    In coding environments, it secured a solid 76.78 average, while mathematical problem-solving
    yielded an impressive 84.75 score.


    Perhaps most remarkably, o3 Pro High excelled in instruction following tasks with
    an 85.87 average, showcasing superior comprehension of user intent and contextual
    nuance. This combination of raw intelligence and practical usability represents
    the pinnacle of current AI development.


    # ## The Anatomy of Excellence


    o3 Pro High''s leadership position is built on consistency, precision, and remarkable
    balance, a rare combination that sets it apart in a landscape where most models
    excel in specific areas at the expense of others.


