  mdcn: "\n\n## AI 旅行伙伴：规划下一次冒险的提示词\n\n利用 AI，将您的旅行规划从令人不知所措变得轻松自如。这 5 个专家精心设计的提示词，可将任何\
    \ AI 助手变成您的私人旅行管家，处理从隐藏景点发现到应急准备的各项事务。无论您是计划 500 美元的东南亚冒险，还是奢华的欧洲度假，这些提示词都能在几秒钟内提供个性化、可操作的建议。\n\
    \n![](img/e32591b2b2e7d31a7d021e1ef3c31ee9_29_0.png)\n\n### 1. 目的地发现\n\n提示词：“我正在寻找一个\
    \ [目的地类型，例如‘海滩度假’、‘冒险山地徒步’、‘文化沉浸式城市短途旅行’]，位于 [地区/大洲，如果已知，例如‘东南亚’、‘欧洲’、‘南美洲’]。我将在\
    \ [月份/季节] 旅行，我的预算是 [预算范围，例如‘中档’、‘奢华’、‘经济实惠’]。请推荐 3–5 个选项，附简要描述，并说明为什么它们可能合适？”\n\
    \n响应：\n\n“我正在寻找一个 [目的地类型，例如‘海滩度假’、‘冒险山地徒步’、‘文化沉浸式城市短途旅行’]，位于 [地区/大洲，如果已知，例如‘东南亚’、‘欧洲’、‘南美洲’]。我将在\
    \ [月份/季节] 旅行，我的预算是 [预算范围，例如‘中档’、‘奢华’、‘经济实惠’]。请推荐 3–5 个选项，附简要描述，并说明为什么它们可能合适？”\n\
    \n以下是东南亚适合夏季旅行、清凉避暑的经济实惠、注重自然且文化丰富的目的地：\n\n#### 1. 越南大叻\n\n为何适合：\n\n- 因海拔约 1,500\
    \ 米而气候凉爽——是逃离东南亚热带炎热的清新之选。\n- 四周环绕着松林、瀑布、湖泊和花园。\n- 拥有丰富的法国殖民风格与越南建筑、艺术咖啡馆以及独特的当地文化。\n\
    \n预算提示：青年旅社每晚从 5–10 美元起，食物便宜又美味。\n\n#### 2. 老挝琅勃拉邦\n\n为何适合：\n\n- 列入世界遗产名录的小镇，拥有佛教寺庙、僧侣早间仪式以及宁静的湄公河风情。\n\
    - 四周环绕着翠绿的山脉、瀑布（如宽西瀑布）和自然徒步路线。\n- 法国-印度支那遗产与悠闲的老挝文化交融。\n\n预算提示：民宿每晚从 10 美元起，还有出色的街头美食市场。\n\
    \n#### 3. 越南沙巴\n\n为何适合：\n\n- 位于黄连山山脉，即使在夏季气温也较凉爽。\n- 因梯田、少数民族村落（苗族、瑶族）和徒步旅行而闻名。\n\
    - 通过民宿进行真实的文化交流。\n\n预算提示：与当地导游和民宿一起进行多日徒步旅行非常实惠。\n\n#### 摘要表：\n\n| 地点 | 自然亮点 |\
    \ 文化元素 | 夏季平均气温 | 预算得分 |\n|---|---|---|---|---|\n| 越南大叻 | 瀑布，松林 | 法国殖民风格 + 越南\
    \ | 15–23°C | ★★★☆☆ |\n| 老挝琅勃拉邦 | 瀑布，河流，山脉 | 佛教 + 法老融合 | 20–28°C | ★★★☆☆ |\n|\
    \ 越南沙巴 | 梯田，徒步路线 | 少数民族村落与市场 | 14–22°C | ★★★☆☆ |\n\n如果您想要行程单、签证信息，或想了解哪种体验（例如灵修、徒步、美食导向），请告知我！\n\
