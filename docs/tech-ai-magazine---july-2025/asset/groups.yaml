    # # 3. Transportation – Budget-Friendly, Efficient, and Scenic


    +   - AUse open-tour buses (e.g., The Sinh Tourist) for cheap north-to-south travel.

    +   - Domestic flights: book early on Bamboo Airways or VietJet.

    +   - In cities: use Grab (motorbike taxi is cheapest).


    Examples:


    +   - Hanoi to Sapa sleeper bus: ~$12

    +   - Da Nang to Hoi An: public bus ~$1

    +   - Hoi An to Ho Chi Minh flight: ~$35-50 (book 2+ weeks in advance)


    # # 4. Activities – Prioritize Nature, Culture, and Self-Guided Fun


    +   - Mix free activities (hikes, beach days, temples) with select guided experiences.

    +   - Look for group tours instead of private ones (e.g., Ha Long Bay day trips).

    +   - DIY walking or cycling tours with offline maps (Maps.me or Google Offline).


    Examples:


    +   - Ha Giang Loop: ~$70-100 for 3 days with meals + motorbike guide

    +   - Free walking tours in Hanoi, Hoi An (tip-based)

    +   - Marble Mountains entry: ~$1-2

    +   - Ba Na Hills: only if budget allows (~$35 entry)


    # # 5. Bonus Cost-Savers & Travel Hacks


    +   - Buy a local SIM card (~$5-7 for 15GB+).

    +   - Bring a refillable water bottle (refill stations are common).

    +   - Use ATMs that don’t charge high withdrawal fees (TPBank, MB Bank).

    +   - Haggle politely in markets (but not restaurants).

    +   - Travel with a buddy to split room and taxi costs.


