- pgno: 95
  md: 'to its members because of its role in mitigating the effects of COVID-19. The
    we.trade platform ensures that members have been properly vetted by their bank,
    the BPU instrument can mitigate the payment risk to sellers associated especially
    with new buyers, BPU Financing can overcome constraints on liquidity for sellers,
    and these factors can encourage sellers to be flexible in the terms they offer
    to buyers.


    With traditional channels of communication and processes disrupted, the benefits
    of digital operations rapidly became apparent. David McLoughlin, Head of Commercialisation
    at we.trade in the first year of the COVID-19 epidemic, said that COVID-19, rather
    than inhibiting the move towards digital transformation, was in fact acting as
    a “catalyst” for it: “with COVID-19, the digitisation of trade and trade finance
    is now no longer a luxury, but a must” [37]. This finding was confirmed during
    interviews with we.trade banks, buyers, and sellers, in which it was suggested
    that even conservative companies traditionally resistant to change were becoming
    willing to move to a digital platform.


    Meanwhile, SMEs in certain countries and industries have been receiving various
    forms of government financial support. It was mentioned by we.trade member banks
    in interviews that as such support concludes, the need for products such as we.trade’s
    BPU and BPU Financing would become still greater.


    # 3.7 Challenges


    As a digital platform, we.trade must ensure that its ecosystem includes at least
    enough banks, buyers, and sellers, and generates at least enough transactions,
    to make the network viable in terms of the level of usefulness and value it provides
    its members. Only with such viability can the other important aspects of network
    effectiveness—such as the number, frequency, and size of connections, engagements,
    and relationships with existing and/or new partners—be meaningful.


    In May 2020, the general manager of the we.trade JV gave a target of 25,000 users
    and 2.5 million transactions within three to four years [30]. With the volumes
    at the end of 2021 reported earlier in this chapter representing but a small fraction
    of these figures, it is not yet certain that we.trade can accumulate the needed
    scale. Without this, buyers and sellers may gravitate towards other digital solutions,
    and the banks may invest in those other business priorities which are in competition
    for management attention and resources.


    The typical barriers to diffusion of blockchain solutions such as lack of knowledge
    and expertise [38] appear to be less of an obstacle in the case of we.trade, where
    the solution is promoted by the banks of the target users, that is, the buyers
    and sellers. So what challenges are constraining the growth of the we.trade platform?'
