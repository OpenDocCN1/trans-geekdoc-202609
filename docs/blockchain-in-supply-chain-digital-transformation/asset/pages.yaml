    # 5.6 The Use of Blockchain For Traceability


    There are a lot of cases that show provenance and traceability of food is a real
    issue in China. Past scandals, such as the one related to kids’ milk [35], highlight
    how food security is a highly important issue in China. Consumers often do not
    trust the quality and provenance of products.


    Chinese authorities regularly strengthen the regulation to cope with the problem.
    In December 2021, GACC issued two regulations (Decree 248 and Decree 249) relating
    to imported food, and affecting overseas food manufacturers, processors, and storage
    facilities.¹⁰ With effect from January 1, 2022, the new regulations provide for
    stricter measures regarding Labelling and Packaging, and Supply Chain Safety Trackability.
    Regarding the latter, foreign food producers are now required to establish a complete
    and traceable food safety and sanitation control system that ensures products
    to be exported are produced, processed, and stored in compliance with Chinese
    laws and regulations (Decree 249, art. 44.)¹¹


