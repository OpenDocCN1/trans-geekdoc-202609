- pgno: 69
  md: 'The use of Blockchain can facilitate compliance to traceability requirements
    from the authorities. Jonathan Horyn explained, “Blockchain would guarantee the
    reliability and transparency of information provided”. Thus, in 2020, the Guangzhou
    Municipality’s Market Supervision Bureau launched an agricultural product traceability
    platform based on blockchain to avoid food safety breaches. The solution enables
    consumers to view traceability information stored on the blockchain.12


    Several companies operating in China have now developed a blockchain-enabled solution
    to reassure end-consumers about the quality and provenance of their food products.
    In 2019, Bright Food, China’s second-largest food manufacturer, began to track
    its dairy products using VeChain. Consumers can trace the provenance of the milk
    by scanning the QR code on the products. The scan provides information on not
    only the product’s route to shops but also the source of the milk and the type
    of farm environment conditions it was produced under.13 Previously, Walmart China
    had also launched a blockchain food traceability system in the country.14 In 2021,
    Australasian Food adopted a blockchain-backed solution to enhance authentication
    and tracking of beef imported from Australia.15


    The promulgation of new GACC regulations illustrates that safety throughout the
    whole food supply chain, from farms to tables, is becoming a high priority of
    the Chinese authorities and an essential part of the China food regulation enforcement.
    Beyond specific measures related to Covid 19, China’s food import regulation is
    becoming increasingly complex. As, Igal Chreky commented, “The time given by the
    authorities to the companies to comply with new regulations is extremely short”.
    For example, GACC issued its Public Notice 2021 number 103 on December 14, 2021,
    and requested foreign companies to comply by January 1, 2022, when Decrees 248
    and 249 took effect.16 In that respect, the flexibility of Foodgates’ information
    system structure and its blockchain-agnostic nature are an advantage. Should China
    authorities require to receive current regulatory information throughout a blockchain
    system, Foodgates would immediately be ready to comply.'
