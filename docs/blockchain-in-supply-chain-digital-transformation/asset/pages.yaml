    determined by a smart contract. Thus, when the buyer arranges a BPU, the seller
    is guaranteed to receive payment once the settlement conditions are met. In return
    for this lower risk, the seller may grant the buyer preferential terms, such as
    longer payment terms, which would in turn help their cash flow.


    The BPU is the we.trade extension of the Bank Payment Obligation (BPO) standard
    for the exchange of electronic documentation which was introduced by the International
    Chamber of Commerce in 2013 [23], with we.trade introducing the capability of
    automated settlement of the payment process enabled via smart contract.


    **BPU Financing:** If the seller requires additional cash flow support within
    the period before receiving the payment from the buyer, the seller can apply to
    their bank for financing, using the BPU as a negotiable instrument.


    **Auto-Settlement:** If a smart contract determines that a predefined settlement
    condition has been met (e.g., the goods have been delivered), then the buyer’s
    bank will process the payment to the seller’s bank. This payment may be fully
    automated if agreed in advance by all parties.


    The trade finance process on we.trade is highly automated and is based upon event
    triggers controlled by smart contracts. Upon any of the steps in the we.trade
    process occurring, a notification is sent to each involved party in real time,
    and the data is written to the we.trade blockchain.


