    # **4.6 Blockchain in Industrial Supply Chains**


    Blockchain technology is a logical solution to many industries’ supply chain issues.
    The healthcare industry is starting to move to Blockchain databases where transparency
    and traceability are important. Tracking active pharmaceutical ingredients during
