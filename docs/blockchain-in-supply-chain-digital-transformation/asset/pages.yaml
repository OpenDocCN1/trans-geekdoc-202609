  md: '+   2. The chapter proposes new attack strategies on the Protocol layer including
    the Nonce Attack (Section 4.1) and Difficulty Recalibration Attack (Section 4.1).

    +   3. We propose and appraise the possibility of an Extortion Attack on the Consensus
    Layer of the network (Section 4.2).

    +   4. We introduce novel Denial of Service attack vectors for an Irrational Attacker
    on the Network Layer of Bitcoin (Section 4.3).

    +   5. Provided a wealthy attacker; we model the feasibility of an Economic attack
    on the Bitcoin network by modelling artificially fabricated panic selling and
    a novel Griefer attack (Section 4.4).


    # 2. Background


    In this section, we first probe the structure of a blockchain followed by how
    Bitcoin implements a blockchain data-structure on peer-to-peer distributed systems.
    We also list the prominent attacks on the Proof-of-Work (PoW) based blockchains.


    # 2.1 Structure of Bitcoin


    The term Blockchain is often used as an umbrella term to refer to the broad field
    of Distributed Ledger Technology [33]. The term Blockchain was first used by the
    creator of Bitcoin Satoshi Nakamoto in a GitHub commit to note the data structure
    used by Bitcoin [49]. Bitcoin uses a cryptographically linked structure of blocks
    that accommodate transactions. Each new block of the transaction is connected
    to the previous block cryptographically developing a chain of blocks. The participants
    of the bitcoin network are tasked with the accordance on a single view of this
    append-only structure. To accomplish this consistency of data in an unconstrained
    distributed environment, Bitcoin utilizes a peer-to-peer distributed system with
    cleaver Proof-of-Work based incentive mechanism. The implementational details
    of such a system are beyond the scope of this chapter.


    We cohere to the structure proposed by [25], in which the authors identify three
    abstract technical components to describe the complex functioning of the bitcoin
    network. These components are the consensus protocol, the communication network,
    and the transactions (including scripts). The consensus protocol is used to elect
    a leader via a race over the solution of a mathematically hard computational problem.
    The communication network component enables the participants (also referred to
    as Nodes) to exchange messages concerning new transactions or blocks on the network
    amongst other protocol level messages. The third component identified by [25]
    is the transactions component; in this'
