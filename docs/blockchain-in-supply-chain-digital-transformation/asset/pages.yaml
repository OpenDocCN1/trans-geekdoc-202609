- pgno: 132
  md: 'network of publications. Bibliometric analysis is a form of quantitative analysis
    used to evaluate scientific publications. This approach simplifies authorship
    and keyword analysis by focusing on many factors such as authorship and keywords
    and terms [24]. Bibliometric analysis aids in the holistic comprehension of a
    study topic, as well as the mapping of its borders, in addition to the discovery
    of significant authors and new research avenues [25]. It further facilitates the
    comprehension of research activities’ qualities, organization, and patterns [26].


    This approach has previously been used frequently by many authors in a number
    of disciplines. From the accounting domain [27], mapped the present level of knowledge
    regarding blockchain technology in the accounting area, as well as identifying
    issues and problems for future research. Their focus was primarily identifying
    the important research destinations at the interface of blockchain and accounting.
    In higher education [28], examined the most common applications of blockchain
    technology in higher education in order to add to the body of knowledge in this
    sector. As a result, they were able to identify three strategies for advancing
    this field of study, engineering education, blockchain, and artificial intelligence.
    The overlap of blockchain and the internet of things was surveyed by [29], where
    they identified rapidly growing interest in this research area since 2017, further
    identifying computer science, telecommunications, engineering and communications
    as the most examined research areas. The application of blockchain technology
    in the food and agriculture sector was investigated by [30]. They found increasing
    publications from 2019 showing that traceability, supply chain, IoT, smart contract,
    and food safety are the top keywords that have occurred most frequently in this
    domain. From these keywords, three key research clusters emerged; the traceability
    system, the technological issues of blockchain, and the research development and
    benefits of the blockchain. Bibliometric analysis of blockchain and smart contracts
    was conducted by [31]. The research found that there were six leading streams
    that are currently appearing in literature; basic research on blockchain and smart
    contracts, applications of smart contracts to the internet of things, how public
