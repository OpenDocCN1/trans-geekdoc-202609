    # 3.2 Permissioned Blockchain as the latest generation of IOS


    As explained in Section 3.1, IOS are the systems enabling transactions across
    organizations. Permissioned Blockchain enables transactions to be kept in blocks
    and shared between pre-approved participants. Therefore, it processes the characteristic
    of IOS in terms of facilitating the creation, storage, transformation, and transmission
    of information [13]. In addition, IOS are used for orchestrating business processes
    across trading partners. Implementing Permissioned Blockchain is the deployment
    of the technology for digitizing business processes whether it is exploitative
    or exploratory [19]. Hence, it also serves the purpose of IOS in terms of process
    orchestration. However, there is a key feature of Blockchain not found in previous
    IOS which is the distributed trust without relying on a trusted intermediary to
    validate transactions. Transaction data are recorded in the blocks after being
    validated by the corresponding Blockchain network node operators in a decentralized
    model. Therefore, Permissioned Blockchain can be perceived as the latest IOS.
    It improves the collaboration between trading partners as well as the efficiency
    and visibility of transactions between them [20].


    There are two adoption approaches to deploy Permissioned Blockchain as IOS. They
    support the “hub-and-spoke” model and the “peer-to-peer” model in IOS introduced
    in Section 3.1.


    For the “hub-and-spoke” model, the organization is to operate all the Permissioned
    Blockchain network nodes for centralizing the decentralized. Some researchers
    called this a Private Blockchain. The second model is to implement through a Blockchain
    Industry Consortium as “peer-to-'
