  md: '**Blockchain Industry Consortium:** A business model for players from the same
    industry ecosystem to adopt permissioned blockchain collectively to operate the
    blockchain governance. They also enjoy the benefits of sharing the cost and risk
    and reaching to the critical mass quicker.


    **TOE Framework:** A theory studying determinants of innovation adoption by enterprise.
    Determinants are categorized into technological, organizational, and environmental.


