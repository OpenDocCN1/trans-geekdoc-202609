  md: '**Table 3.** Innovation assimilation framework [19].


    | Stage | Description |

    |---|---|

    | **Initiation** | A match is found for a technological innovation and its application
    in an organization. |

    | **Adoption** | A decision is reached to invest resources to adopt the technological
    innovation. |

    | **Adaptation** | The technological innovation is developed, installed, and maintained.
    Organizational members are trained to use the new technological innovation. |

    | **Acceptance** | Organizational members are induced to use the technological
    innovation which is now being used within the company. |

    | **Routinization** | The use of the technological innovation is encouraged as
    a normal activity and organizational structures are altered to accommodate the
    technological innovation. It is no longer seen as something out of the ordinary.
    |

    | **Infusion** | The technological innovation is used in an elaborate and sophisticated
    manner. Infusion is categorized in several ways:


    • **Extended use:** using more features of the technological innovation.


    • **Integrative use:** using the technological innovation to create new workflow
    linkages among tasks.


    • **Emergent use:** using the technological innovation to perform tasks not previously
    considered possible. |


    (e.g., adaptation, acceptance, routinization, and infusion). The infusion stage
    comprises several different facets of technology innovation infusion.


    When investigating assimilation stages, a salient consideration is the degree
    to which we may expect an adopting organization’s progression through the assimilation
    stages to be linear. However, extant research has demonstrated that progression
    may be non-linear. For instance, [20] argues that a sequential model is more likely
    to emerge for ‘off-the-shelf’ technologies in comparison to ‘bespoke’ technological
    innovations. Further, [20] suggests that an unfreeze (e.g., initiation, adoption,
    stages) and unfreeze (e.g., acceptance, routinization, and infusion stages) sequential
    pattern is likely to emerge. This view, however, has received criticism for failing
    to consider the degree to which feedback is incorporated into the stages [22].
    This six-stage assimilation framework has been used in previous studies that examine
    technological adoption in supply chains [e.g., 23,24,25]. We also believe it would
    also be an appropriate lens with which to examine the benefits and challenges
    associated with the adoption of blockchain technology in a supply chain performance
    management system context. Although much recent research on technology assimilation
    has been conducted, the lines of enquiry have focused on the early stages of adoption.
    As evidence of this unbalanced attention, an analysis was conducted of all technology
    assimilation supply chain related research'
