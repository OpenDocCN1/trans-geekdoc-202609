    # 6.2 Senior IT Executives Insights on Permission Blockchain Adoption Determinants


    *Perceived Benefits are important but Top Management Support sometimes is even
    more important as a determinant*


    Perceived Benefits are one of the most important determinants for any corporate
    purchase decision as mentioned in previous innovation adoption literature [30,43].
    During the executive interviews, almost all executives agreed that Perceived Benefits
    should be a factor to examine as an adoption determinant but not necessarily the
    most important factor at all times. One individual adopter commented that Perceived
    Benefits are important when the cost and benefits are more quantifiable. That
    will be in at or beyond the growth stage in the typical product life cycle when
    there are references that can be drawn from other organizations’ adoption. However,
    it is not in the development or introduction stage of Permissioned Blockchain.
    During the early stages of the lifecycle, adopters may just want to be an innovator
    to be the “first mover” before seeing concrete benefits [37].


    Therefore, Top Management Support is a crucial adoption determinant of Permissioned
    Blockchain during the early stages when the benefits are uncertain, and the risk
    of failure is high. According to the individual adopter from the transportation
    industry interviewed, he would not proceed to adopt Permissioned Blockchain if
    he has not gotten the commitment from his top management in terms of endorsing
    its strategic importance to the whole organization, investing in the resources
    to adopt, and willing to take risks for failure. His viewpoint was echoed by other
    adopters and also non-adopters. One non-adopter, also from the transportation
    industry, commented that a key reason for his non-adoption is his top management
    placed higher priorities on an optimal service operation and do not want to take
    the risk of adopting Permissioned Blockchain in its supply chain processes. His
    top management’s fear is if the suppliers cannot comply'
