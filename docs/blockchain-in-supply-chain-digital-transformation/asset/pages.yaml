    # 4.7 Network Layer Attack


    Information system security is often evaluated based on the CIA triad model (Confidentiality,
    Integrity, and Availability) [11]. The desired security properties include confidentiality,
    i.e., the data processed or transmitted from the information system should not
    be exposed to unauthorized actors. The confidentiality in Bitcoin in ensured by
    the use of known secure cryptographic algorithms such as Elliptic-curve cryptography
    [2]. Another curial security property is the integrity of the data, i.e., the
    data transmitted or stored in the information system should not be altered and
    reminded in the intended form. This property is especially important in reference
