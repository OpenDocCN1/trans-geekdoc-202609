- pgno: 97
  md: '# 4. Conclusions


    we.trade is an efficient, transparent, and secure digital platform that transforms
    the trade finance cycle for open account trade. The we.trade platform is enabled
    by a blockchain-driven governance structure of administrative, infrastructure,
    and application level mechanisms so as to coordinate and safeguard transactions
    which have traditionally been regulated manually via written contracts and social
    structures.


    When the buyer and seller define their transaction on we.trade, they include the
    data set needed for generation of the relevant smart contracts, such as the goods/services
    description, pricing, delivery terms, payment terms, and the settlement conditions.
    The smart contracts then automatically process and enforce the parameters of the
    trade upon encountering the specified event triggers. Thus, the buyers, sellers,
    and their banks now place system-level trust [41] in the we.trade platform, replacing
    the need for trust in specific contracts or individuals.


    This is a practical example of recent theoretical views of blockchain as a “new
    institutional technology that makes possible new types of contracts and organizations”
    [42] by possessing in itself the capability for the autonomous execution and enforcement
    of agreements between parties [43].


    With the we.trade platform enabled by blockchain, its members can optimize their
    inter-organizational processes. This allows participating banks to create opportunities
    for enhancing competitive advantage via new and efficient revenue-generating services
    for the open account trade, while buyers and sellers can enhance their prospective
    competitive advantages because of their improved liquidity, reduced levels of
    risk, and greater efficiency in their trade processes. The digital transformation
    delivered by the we.trade platform has also helped to alleviate several of the
    serious barriers posed to trade by the COVID-19 epidemic. The major challenge
    now facing we.trade is to ensure that it reaches a viable scale of membership
    and transactions.


