  md: '# 1


    # A Smart Cities Blockchain Research Agenda


    # A Bibliometric and Network Analysis Literature Review From 2016 to September
    2021


    *Trevor Clohessy*


    # 1. Introduction


    Blockchain is a foundational technology comprising decentralised distributed digital
    ledgers which record the provenance of both digital and physical assets [1]. Each
    participant in a supply chain possesses the same digital ledger on which transactions
    are only approved when consensus is reached amongst all the participants [2].
    The terms and conditions of these transactions are executed through smart digital
    contracts which are essential to the process [2]. Blockchain enables these transactions
    without the need for a recognised trusted central authority to overview the process.
    For example, blockchain’s first use case was Bitcoin, a cryptocurrency which came
    to prominence in 2008 upon the release of its white paper by Satoshi Nakamoto
    [3]. Bitcoin involves the selling and purchasing of digital coins without the
    need for a central authority (e.g., central bank) which are used to monitor traditional
    fiat currencies. The disintermediation of a central trusted authority is only
    made possible by the cryptographic and immutable security protocols enabled by
    blockchain technologies. Since'
  merge: -1
  img_proc: true
- pgno: 8
  md: '2008, blockchain has been adopted by a multitude of industries including the
    pharmaceutical industry, the diamond industry, the financial industry, the health
    care industry, the military industry, etc. The reasoning for adopting blockchain
    technologies is underpinned by its unique features which differentiate the technology
    from other technologies [1]. These features included access privileges, transparency,
    immutability, smart contracts, decentralised consensus, and distributed trust.


    Blockchain is an evolving technology which has been touted as essential to the
    secure operation of smart city informational technology (IT) deployments [4,5].
    According to [6] a smart city embodies a city where “investments in human and
    social capital, transport and modern IT infrastructure fuel sustainable economic
    growth and a high quality of life, with a wise management of natural resources
    through participatory government”. Essentially, smart cities incorporate the use
    of smart technologies which enable them to become more liveable, sustainable,
    and responsive to the increasing economic and social requirements of its citizens
    [7]. For example [7], propose a smart city government cloud platform called G-Cloud
    which could be used to roll out smart government services across enterprises,
    consumers, business, and government services (Figure 1). To create this platform
    governments would have to invest in a technology stack which would encompass cloud
    computing, internet of things (IoT) technologies, sensors, real-time data analytics
    capturing, monitoring, and analysing capabilities, and artificial intelligence.
    The data generated by the smart technology stack from transactions and processes
    would then have to be secured. It has been argued that blockchain


    ![](img/fdc6464c91fc66462db3b9c6fded9a71_8_0.png)


    Figure 1. Smart city services platform enabled by a smart technology stack [7].'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'represents a technology that could excel at performing this function in terms
    of resiliency against security threats; scalability; fault tolerance and reliability;
    secure communication; and fast and efficient smart city operations [8]. Consequently,
    since 2016 academic research has begun to investigate how blockchain can be used
    in smart city contexts [9,10].


    Discussions pertaining to emerging research contexts such as blockchain and smart
    cities can benefit from a comprehensive analysis of the extant literature in the
    area using bibliometric techniques to provide a holistic conceptualisation for
    academics and researchers. Furthermore, this mapping of the extant literature
    will enable researchers to identify avenues which are ripe for further investigation.
    Therefore, this study is centred around the following research questions (RQs):


    RQ1: What are the most prominent research papers in the field of blockchain in
    smart cities?


    RQ2: What are avenues for future research in the context of blockchain and smart
    city research?


    The remainder of this paper is structured as follows. Section 2 provides an overview
    of the research methodology used to conduct the bibliometric analysis and the
    databases analysed. Section 3 delineates the results of the bibliometric analysis.
    Section 4 delineates the results of the study’s citation network analysis while
    Section 5 presents a roadmap for future blockchain smart city research. The study
    concludes in section 6 with a summary of the research contributions.


    # 2. Research Methodology


    The following section details the research methodology that was executed to conduct
    the bibliometric analysis. While the terms “Smart City” and “Smart Cities” has
    a lineage dating back to the 60s [7], the terms “Blockchain”, “Smart Contract”,
    and “Distributed Ledger Technology” have only really come to prominence from an
    academic literature perspective since 2016. Consequently, our research focused
    on the time frame which spanned the years 2016–2021. For example, Figure 2 illustrates
    the proliferation of blockchain literature in a smart city context in the Web
    of Science database from January 2016 to August 2021.


    # 2.1 Literature Review Strategy


    The term “blockchain” is often used interchangeability with the words “distributed
    ledger technology” or “smart contracts”. As a result, we extended our search criteria
    to include these terms. Additionally, during the initial data collection process,
    it was noted that the term “blockchain”'
  merge: -1
  img_proc: true
- pgno: 10
  md: '![](img/fdc6464c91fc66462db3b9c6fded9a71_10_0.png)


    Figure 2. Smart city blockchain literature proliferation since 2016.


    is sometimes spelled as “block chain”. We revised our search strategy to include
    this keyword. Consequently, the following four different literature search combinations
    were used in conjunction with title, abstract, and keywords:


    +   1. Smart City OR Smart Cities AND blockchain;

    +   2. Smart City OR Smart Cities AND block chain;

    +   3. Smart City OR Smart Cities AND distributed ledger technology;

    +   4. Smart City OR Smart Cities AND smart contract


    Table 1 provides an overview of the databases that were used to search for the
    4 search terms combination scenarios outlined above. As can be seen, 10 databases
    were selected to search for these different combination scenarios rather than
    focusing on one specific database. This strategy is in line with previous studies
    [11,12] which use multiple databases for bibliometric analysis due to the concentration
    of blockchain research being dispersed across different academic and research
    domains.


    # 2.2 Preliminary Findings


    Figure 3 highlights the initial results for our defined search terms within the
    title, abstract and/or keywords search criteria across the 10 databases. As can
    be seen, Google Scholar and Web of Science contributed to 64.85% of our search
    results. SSRN, Emerald Insight and Taylor and Francis were relatively inefficient
    contributing a cumulative total of 1%. An initial Google Scholar search produced
    over +17,000 results. The advanced search function was used to narrow the results
    down to the findings depicted in Table 1.'
