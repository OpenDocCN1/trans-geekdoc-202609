  md: '# 2


    # Breaking Bitcoin at any Cost


    # Irrational Attacks on Proof-of-Work Blockchain


    *Ashish Rajendra Sai*


    # 1. Introduction


    The unrest caused by the 2009 economic crisis is thought to have influenced the
    launch of Bitcoin, the first decentralized digital currency [24]. Bitcoin proposes
    a method of value transfer without the use of a trusted third party in an untrustworthy
    environment [12]. Bitcoin accomplishes this by employing a peer-to-peer network
    that maintains a global ledger of all transactions. A consensus algorithm is used
    to reach an agreement on the ledger’s view of the data, in which the majority
    of network participants agree on a single view of the data.


    The novel contribution of Bitcoin in the field of digital currencies is the application
    of a clever incentive mechanism for participants of the network. The participants
    of the Bitcoin network are anticipated to solve a computationally expensive trivial
    mathematical problem. The first participant to solve the mathematical problem
    acquires a reward for the computational cycles spent on the solution. This numerical
    solution is frequently referred to as Proof-of-Work. The reward mechanism serves
    as an incentive for honest behavior in the network. Dishonest behavior is disincentivized
    in the form of lost rewards if half of the network dissents with the attackers’
    view of the data. It is presupposed based on the economic barriers that half of
    the network participants are honest.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'Bitcoin’s underlying technology Blockchain has seen numerous applications including
    supply chain. The utility of Blockchain in the supply chain relies on the secure
    operation of the underlying consensus mechanism.


    Because the financial asset is entangled in the consensus, it is assumed that
    an attacker would try to maximize the profit from the attack. This assumption
    of a rational miner is employed by numerous Bitcoin security evaluation frameworks
    [32], [15], [35], [18], [14], [41], [31]. We believe that the assumption may limit
    the applicability of current attacking strategies that do not account for extreme
    scenarios in which the adversary is unconcerned about any financial gain or loss
    incurred during the attack.


    In this chapter, we aim to model an irrational attacker. We describe the irrationality
    as the intent of harming the network, notwithstanding the cost (remunerative or
    reputational). The chapter intends to answer the following research question:


    *What attack strategies could an irrational attacker use to put the bitcoin network
    in jeopardy?*


    To answer the research questions, we devise four dimensions that an irrational
    attack can deploy attack vectors on to exploit the network. The design of Bitcoin
    determines the choice of these dimensions. The bitcoin core protocol is an implementation
    guideline for the participants of the network. These guidelines are realized in
    the core client, which is deployed over a peer-to-peer network of participants.
    We describe the implementation of guideline oriented attack vectors as Protocol
    Layer Attacks. The protocol by its design induces a race condition for the proof-of-work
    in the network to establish consensus on the view of the data.


    The attack vectors associated with the race conditions are defined as Consensus
    Layer Attacks. The consensus pivots copiously on the transmission of information
    between the participants of the network. The attack vectors that strive to exploit
    the transmission of information are categorized as Network Layer Attacks.


    The classifications listed above are imperative for accurate computational execution
    of the implementation guidelines, but one riveting factor that affects the network
    is the economics involved in the incentives for the participation. We categorize
    attacks on the incentives as Economic Layer Attacks. We can recapitulate the attacks
    modelled in this chapter in four categories: Protocol, Consensus, Network, and
    Economic layer attacks. The chapter makes the following contributions:


    +   1. A novel investigation of attack vectors for an irrational attacker on the
    Bitcoin network (Section 3).'
  merge: -1
