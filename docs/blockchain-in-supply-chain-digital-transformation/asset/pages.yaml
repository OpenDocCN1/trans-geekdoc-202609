  md: '# 4


    # Transforming Trade Finance via Blockchain


    # The We.Trade Platform


    *David Petersen*


    # 1. Introduction


    Of the many sectors of supply chain management which offer the potential for digital
    transformation via blockchain technology, trade finance represents one of the
    most tangible and the most valuable use cases. Theory and anecdotal evidence suggest
    that blockchain has the potential to transform key elements of the trade finance
    sector, addressing needs for more transparent and reliable processes, greater
    control over risks, and for the robustness of processes in the face of supply
    chain disruptions such as COVID-19.


    This chapter examines these transformative capabilities of blockchain through
    their real-world application in the we.trade digital platform for trade finance.
    Specifically, this case study of we.trade will assess how the use of blockchain
    can enable the members of a digital platform to optimize their inter-organizational
    processes, and as a result, generate competitive advantages.'
