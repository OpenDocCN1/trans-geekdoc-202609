    # Research Direction #1: Government Services


    From a citizen perspective, blockchain and distributed ledger technologies have
    the potential for global governments to roll out citizen-centric services which
    are reliable, secure, private, and trustful [27,28]. Blockchain can overcome existing
    paper laden processes which are time consuming, costly, and inefficient. Academic
    degrees, occupational licenses, employee IDs, and other identification credentials
    are easier to deal with when they’re digital. However, this extremely personal
    data must be kept hidden and safe. There is now empirical evidence and ongoing
    global use cases to highlight how blockchain is being used by governments, corporations,
    and educational institutions to allow a secure and trustworthy infrastructure
    and improve services. Covid19 has accelerated governmental digital transformation.
    Take for instance the introduction of Covid19 tracking and tracing applications
    and digital vaccination certificates. There is now an opportunity to investigate
    how blockchain can be used to secure government centric-services as highlighted
    previously in Figure 1. From an industry perspective, blockchain possesses the
    potential to transform how governments formulate strategies with regards to smart
    health, smart energy, smart mobility, smart voting, smart education, and smart
    logistics. For example, from a healthcare perspective, blockchain and DLT can
    assist healthcare practitioners facilitate: the safe transfer of patient medical
    records, the managing of drug supply chain logistics, and the secure'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'storage and transfer of patient medical records. From a voting perspective
    blockchain technologies may be used to overcome concerns with traditional electronic
    voting, making it more cost-effective, reliable, and secure [29]. Additionally,
    from a smart mobility perspective, blockchain technology can be used for exchanging
    data for automobiles, such as ride-sharing, car sharing, or self-driving cars
    [30]. Research exploring how blockchain can assist governments across various
    smart public service sectors merits further scrutiny and debate by researchers
    in terms of the possible negative consequences of blockchain with regards to the
    immutability of citizen records and the potential for privacy violations [31].


    # Research Direction #2: Sustainability


    Smart city definitions vary but two concepts which remain core to each definition
    is the concept of sustainability [32] and how technology can be used to enhance
    sustainability from socio-technical and socio-economic perspectives (Bosch, 2019).
    For example, [33] define a smart city as “a loosely connected set of confluences
    between data, digital technologies, and urban sites and processes”, which can
    be catalysed by a “digitally enabled data-driven, continually sensed, responsive
    and integrated urban environment”. There are ongoing global efforts to explore
    how blockchain can facilitate smart city sustainability agendas. Future research
    can investigate how smart cities can use blockchain to develop their sustainability
    strategies in line with global climate change and sustainability action plans.
    For example, research which investigates how smart cities can construct secure
    and shared digital ledgers for real-time data management in transportation, energy,
    and utilities would be welcome. Ultimately, blockchain technology’s application
    might assist smart cities in streamlining their interactions with citizens, reducing
    individual and collective resource usage, and sharing public data with approved
    third parties. Blockchain can also assist citizens to reduce, metricise and analyse
    their individual carbon footprints and assist with the dematerialization of industrial
    supply chains [34].


    # Research Direction #3: Blockchain Assimilation


    While this research has identified that blockchain smart city research is increasing,
    it has also identified that the research area is at an embryonic stage. Consequently,
