    Following the 2008 global financial crisis, strict regulations put tremendous
    pressure on financial institutions that led to the use of regulatory technology
    (RegTech) to ease the compliance process [1]. With the more recent introduction
    of regulatory policies related to customer due diligence, requiring companies
    to “know their customers” as part of the anti-money laundering environment, blockchain
    technology appeared as a RegTech with the capability to affect potential improvements
    in the process and ease the compliance burden [30]. Beyond this case, blockchain
    technology is increasingly considered as a solution to support regulatory compliance
    [17]. However, research to date on regulations largely focuses on analysing government
    decisions rather than enforcement [16]. In this chapter, we study the potential
    of a blockchain-based RegTech system for food safety enforcement and import in
    China.


    The case studied is the business-to-business (B2B) food platform ‘Foodgates’ that
    markets French food products to Chinese buyers. Foodgates opens the opportunity
    for small producers in France to export their products to Chinese consumers by
    connecting them to potential buyers and managing the whole process of transportation
    door-to-door. Their motto, “Because it’s complicated to export to China”, highlights
    the acute challenges experienced by small businesses in complying with China’s
    food import regulations. Benefiting from its in-between position, Foodgates collects
    all relevant product information that is required to satisfy China’s regulations.
    Additional information is collected during the transportation process that is
    also managed by Foodgates. Information is safely stored on a blockchain which
    facilitates the compliance process. However, the substantial paperwork load required
    by the customs and other regulatory administrations in China still prevents the
    optimal use of blockchain as a regulatory technology. Despite this situation,
    blockchain has been embraced by the central authorities in China as a strategic
    technology to develop e-government nationwide. This decision paves the way for
    wider adoption of blockchain to deal with all government services including customs
    and import procedures. In this chapter, we provide a detailed case of how blockchain
    can support product safety enforcement.


    # 2. Food Safety Regulation in China


    # 2.1 Internal and External Factors


    Since 1949, the food regulation system in China has been continuously adjusted
    to the circumstances and challenges (for more details on the'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'regulatory evolution see [16],[18],[29]). In recent years, food safety regulation
    in China has been driven by both the global regulation convergence and internal
    food safety problems. The globalisation of the economy has resulted in a global
    regulation movement pushing trade partners to harmonise their regulations. That
    convergence has greatly influenced China’s regulatory measures especially for
    the deemed non-strategic industries [9]. In particular, international food safety
    standards have greatly influenced China’s policies over the past twenty years.
    For instance, a key motivation was the repeated occurrence of safety issues related
    to China’s food exports in the late 1990s that were putting the country’s role
    as a food exporter in jeopardy [7].


    China has also witnessed severe food scandals over the past two decades that have
    made necessary a strengthened regulatory regime for domestic production [22,35].
    It is worth noticing that the food regulation has been enforced with a higher
    degree of compliance for exported products than for local production consumed
    within the country [7,9]. The full compliance for export food products meets international
    standards such as the ISO and Codex. This more stringent enforcement policy applies
    also to imported food and, in that respect, the General Administration of Customs
    (GACC) has strengthened its inspection procedures at all ports of entry in the
    country following 2018 regulations [9].


    # 2.2 From Food Hygiene to Food Safety Regulation


    The implementation in June 2009 of the first Food Safety Law translates China’s
    decision to recognise food safety as a public health priority [29]. As explained
    by Liu, Mutukumira and Chen [29], the establishment of the Food Safety Committee
    the following year confirms the government’s priority change from food hygiene
    to food safety (see Appendix B). The objective is to create a unified and centralised
    governance mechanism able to ensure food safety from “farm to table” which was
    reinforced further by the 2018 reform that instituted the State Administration
    as the top body for food safety enforcement and regulation [18]. Even if food
    safety and its regulation are a global challenge, the situation in some developed
    countries like United States, members of the European Union and Japan seem to
    be more adequate than in China [18]. Nevertheless, the Chinese government has
    reformed its system several times and improved drastically its effectiveness over
    the past decade.


    The more stringent regulation toward imported food responds to the increasing
    inflow of foreign food products. This increase reflects the need of China for
    some products that are not currently produced in the country, or at least not
    in sufficient quantity or with adequate quality [24]. Besides, local food incidents
    have increased the attractiveness for imported goods as consumers want safer products
    [26]. In addition, the'
  merge: -1
