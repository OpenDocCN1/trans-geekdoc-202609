  md: '# 5. Adoption Determinants of Permissioned Blockchain as IOS


    # 5.1 Conceptual Model of Permissioned Blockchain Adoption


    As Permissioned Blockchain is a crucial IOS for supply chain digital transformation,
    it is important to understand what factors determine the adoption of Permissioned
    Blockchain as mentioned in Section 2.3. It is useful to understand these determinants
    through a relevant conceptual model.


    The Technological, Organizational, and Environmental (TOE) framework is used to
    assess innovation adoption at the organizational level [28]. It is a model that
    can be applied to understand the adoption determinants of technologies at the
    organizational level such as EDI, e-Business Applications, ERP systems, and e-Supply
    Chain Management Systems, etc. [11,29,30]. It is, therefore, appropriate to apply
    the TOE Framework as a conceptual model for understanding the adoption determinants
    of Permissioned Blockchain.


    In the TOE Framework, all external factors are categorized under the Environmental
    context. This chapter suggests separating inter-organizational related determinants
    from the Environmental context. This is because inter-organizational factors are
    distinctive for Permissioned Blockchain as IOS. Inter-organizational factors involving
    parties have a direct relationship with the adopting organization such as the
    trading partners and the industry consortium. These parties are involved in the
    end-to-end inter-organizational business processes. Parties indirectly related
    to the organization such as competition and government policies should still be
    categorized as environmental factors. A literature review identified 65 possible
    determinants identified. Six of these most significant one identified will be
    discussed in Section 5.2. A conceptual model of Permissioned Blockchain adoption
    is developed and presented in the below figure.


    # 5.2 Adoption Determinants of Permissioned Blockchain as IOS


    As shown in the above figure, this conceptual model referenced the TOE Framework
    but with an inter-organizational dimension added. Six determinants categorized
    into the four contexts were identified for Permissioned Blockchain adoption and
    ascertained by 10 senior IT executives interviewed. They are discussed in the
    below section.'
