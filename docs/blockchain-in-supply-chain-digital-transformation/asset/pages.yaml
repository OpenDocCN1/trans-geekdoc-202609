    # 5.2.1 Technological Context


    # Perceived Benefits


    Perceived Benefits are the advantages an organization expects to receive [31].
    They include both direct benefits such as revenue improvement and cost reduction,
    as well as indirect benefits such as improvement in operational efficiency, customer
    relationship, competitiveness, and corporate image [11,32,33]. While actual benefits
    are important for adopting an innovation, Perceived Benefits are more relevant
    for Permissioned Blockchain adoption decision because the decision is based on
    the benefits expected whereas the actual benefits can only be obtained after the
    adoption. Perceived Benefits were considered as determinants in Blockchain adoption
    research based on TOE [34, 35].


    # Technology Maturity


    Technology Maturity refers to the extent of the functional characteristics of
    a technology being proven by other adopters [36]. Lee et al. (2017) identified
    three parameters to evaluate Technology Maturity. They are if it has been adopted
    successfully by other adopters; the benefits expected are demonstrated, and the
    weaknesses or issues are known and addressed. The more successful adoptions of
    the technology, the higher is its maturity. Technology Maturity is important for
    Permissioned Blockchain adoption as the adoption is a corporate decision. Organizations
    always observe the'
