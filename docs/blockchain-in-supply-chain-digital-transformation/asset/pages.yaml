  md: 'Due to its promising features and performance in trustless contexts, BT is
    being hailed as a game-changing invention. It''s a time-stamped set of entries
    saved on a decentralized DL system. There is no central command and control authority,
    and each node maintains its own digital ledger. All BC records are publicly verifiable
    and accessible to any node in the network. Following successful transaction validation
    via a consensus method, a block is formed and appended chronologically. Each block
    is linked to the preceding one by a unique cryptographic hash, making it unchangeable
    in nature.


    By using a consensus process, the public ledger is updated and synced across all
    nodes. For transaction validation, the consensus process assures that all participating
    nodes agree. “Proof of Work” (PoW), “Proof of Stake” (PoS), “Proof of Authority”
    (PoA), and “Delegated Proof of Stake” (DPoS) are some of the consensus techniques
    available. The consensus technique is chosen based on the needs of the network;
    nonetheless, PoW is considered to be more secure than alternative consensus algorithms.


    In BC, there are two options. The first is permissionless BC, in which nodes may
    join the network without requiring any permission, also known as public BC. The
    second method is a permissioned BC, sometimes known as a private BC, in which
    access control is used to limit the number of nodes that may participate. Only
    the authorized nodes in a private BC may read and write data.


    With the help of an immutable record, cryptocurrency, as well as smart contract
    deployment, BC has enabled a unique platform enabling safe energy transactions
    without trustworthy actors in a dispersed network [55]. For transaction validation,
    block creation, and hash chain building over the blocks, the agents use a consensus
    protocol [56].


    However, in classic BC applications, such as bitcoin, the commonly utilized proof-of-work
    consensus system consumes a lot of energy and has delayed transaction confirmation
    [36]. As a result, it cannot be modified on the permissioned energy BC. As a result,
    resolving the security issues associated with EV charging in South Carolina remains
    an open and critical topic.


    In an SC made up of networked smart houses, Liang et al. suggested an effective
    service finding technique for protecting privacy [57]. Zhang et al. analyzed common
    SG incentive schemes and used a theoretical contract approach to investigate the
    “cloud-based” “vehicle-to-vehicle” (V2V) ET procedure [58]. Tushar et al. investigated
    an inducement game-based method for dispersed renewable EM in SC to enhance the
    operator’s gain and reduce overall cost in ET [59].'
