- pgno: 96
  md: 'As a multi-sided platform in which all participants must be members, we.trade
    is more susceptible to the network effect than are other platforms which do not
    require this (such as the Marco Polo platform). It can be said that we.trade has
    been suffering from the ‘the-chicken-and-the-egg’ dilemma:- buyers want sellers
    to be in place, and sellers want buyers to be in place, before either will agree
    to join the platform.


    The country in which we.trade has the highest level of coverage of the trade sector
    is the Czech Republic. Whilst other countries have only one or two member banks
    each on the we.trade platform (and with these accounting for a minority of total
    trade in each country), the Czech Republic has three banks (ČSOB, Komerční Banka
    and Česká Spořitelna) which together serve approximately 80% of Czech companies
    engaging in trade [26]. This high level of coverage allows we.trade in the Czech
    Republic to perform even domestic trades. It will be instructive to trace the
    future development of we.trade in the Czech Republic in order to determine to
    what extent the number of banks and the trade coverage should be expanded in all
    markets. It should be noted that the banks in different markets will have varying
    reactions to the addition of national competitors to the we.trade platform.


    While the onboarding process for new buyers and sellers to join we.trade is relatively
    fast, especially for the banks’ existing customers, the onboarding process for
    new member banks is resource-intensive, involving numerous internal and external
    processes. Banks are by nature relatively conservative and understandably careful
    with their processes and must assign resources between many competing projects.
    These factors—the costs of affiliation as described by Loux et al. [39]—may represent
    a deterrent to new banks joining the we.trade platform.


    In interviews, bank executives have acknowledged that adoption time is especially
    slow in the case of disruptive technologies. One bank representative stated that
    to convince the relationship managers in his own bank (who would propose we.trade
    to the bank’s customers) of the value of the platform was a major challenge in
    itself. The significant effort required to on-board new banks onto we.trade (said
    in interviews conducted with bank executives to take at least one year, and up
    two years in the case of Akbank of Turkey) may then represent a significant constraining
    factor for the growth of we.trade.


    A constraint affecting growth in the number of buyers and sellers may be the difficulty
    of expanding the scope of we.trade beyond Europe. While member buyers and sellers
    have expressed in the press and in interviews the desire to transact with partners
    in Asia and South America [40], we.trade has not yet published a timeline for
    the implementation of the complex process and governance changes needed to achieve
    this.'
