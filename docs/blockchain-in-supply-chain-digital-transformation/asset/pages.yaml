    # Assimilation of the Blockchain


    # Exploring the Impact of Blockchain Technology on Supply Chain Management


    *Trevor Clohessy*


    # 1. Introduction


    Blockchain is a method of storing data in such a manner that it is difficult or
    impossible to alter, hack, or defraud it. A blockchain is a digital log of transactions
    that is copied and distributed throughout the blockchain’s complete network of
    computer systems. Blockchain technology is also referred to as distributed ledger
    technology (DLT). The blockchain was initially published in 2008 when people were
    first introduced to Bitcoin, a prominent cryptocurrency established by an unnamed
    inventor, or group of inventors, known as Satoshi Nakamoto; as a result, Nakamoto
    is also acknowledged as the blockchain’s creator. The voyage of blockchain, on
    the other hand, can be traced back to 1982 when Berkeley programmer David Chum
    created Blind Signature technology, an untraceable payment method that divorced
    a person’s identity from their transaction. Currently, blockchain is being used
    as a foundational technology across a range of industries. The primary use cases
    currently for blockchain technologies include cryptocurrency payments, tracking
    items along supply chains, non-fungible tokens (NFTs) and copyright management.
    Supply chains represent a natural setting for blockchain deployments and digital
    supply chain transformation. For instance, from a financial services perspective,
    the maturation of blockchain technologies, which'
