    # 4. Adoption Models of Permissioned Blockchain


    Permissioned Blockchains bring additional value to business-to-business processes
    including supply chain digitization over the previous IOS. It is therefore essential
    to understand its adoption. For instance, how it is adopted and what drives adoption.
    There are two models to adopt Permissioned Blockchain as mentioned in Section
    3.2. The first model is for an organization to adopt it individually. The second
    one is to adopt it collaboratively with other industry players in the form of
    an industry consortium. To understand corporate’s considerations in Permissioned
    Blockchain adoption, a round of executive interviews with senior IT executives
    was conducted in Hong Kong to draw their insights. The interviews confirmed the
    existence of both forms of adoption. A discussion on the insights is provided
