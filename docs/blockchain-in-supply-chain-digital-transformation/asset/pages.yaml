    # 3. Traceability Defined


    The simplest definition of traceability is knowing where a product came from.
    Of course, it’s a little more complicated than this simple definition. Dr. Joseph
    Juran was an important figure in the development of modern quality and defined
    traceability as the “ability to trace the history, application, or location of
    an entity by means of recorded identifications” [11]. He simplified many concepts
    without losing the precision of the statement. There are, however, missing elements
    of this definition. For instance, while you can know the history of a product
    (or entity as he refers to it) this definition doesn’t infer that you also know
    the history of the components and materials that make up that final product. Another
    component that isn’t clear from this definition is knowing where a product went
    after production.


    For example, if there is a bad batch of bread, there is a need to know where the
    yeast and the flower came from. This is needed to identify if there are other
    lots of bread produced from a bad batch of yeast. The manufacturer would also
    need to know which stores bought the suspect bread to pull it from the shelves
    (if needed). The history of the product at various steps of production as well
    as the history of the product through distribution must both be included in the
    definition.


    ISO 8402:1994 is titled as *Quality management and quality assurance—Vocabulary*
    and defines traceability as, “The ability to trace the history, application or
    location of an entity by means of recorded identifications” [12]. This is an older
    standard that has since been withdrawn and was replaced with ISO 9000:2000 which
    has undergone further revisions. The most recent edition (2015) defines traceability
    a little more specifically as “the ability to trace the history, application,
    use and location of an item or its characteristics through recorded identification
    data” [13].


    GS1 is a not-for-profit that creates standards for business communication. The
    bar code system is one of their standards. GS1 has created a traceability standard.
    The GS1 standard is an attempt to standardize the minimum requirements for traceability
    systems [14]. GS1 Global Traceability Standard uses the ISO 9000:2000 definition
    but expands it as, “The ability to track forward the movement through specified
    stage(s) of the extended supply chain and trace backward the history, application
    or location of that which is under consideration” [14].


    The GS1 definition does a good job of what Bechine, Cimino, Marcelloni and Tomasi
    clarified in their definition of breaking traceability into track'
  merge: -1
  img_proc: true
