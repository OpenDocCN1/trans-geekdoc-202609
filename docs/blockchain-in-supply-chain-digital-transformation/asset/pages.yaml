  md: 'on the network. Once on the network, the node has full permissions to read,
    transact, and create blocks. In a permissioned blockchain, someone with a way
    to access the network must receive permission from the “owner” of the blockchain
    network to have access to the network. The network “owner” can set permissions
    on who can read information on the blockchain, who can transact on the blockchain,
    and who can write new blocks to the chain [7]. In a public blockchain the nodes
    existing on the chain are anonymous. In a private blockchain, all the nodes represent
    identifiable members [8]. In this instance it would be members of the supply chain.
    As many companies often buy from competitors, these kinds of privacy matters come
    into consideration.


    Permissioned blockchains are perfectly applicable to companies who would not want
    all their supply chain transactions available to everyone. A supplier of mangoes
    to Wal-Mart would not want their competitors to see prices or payment terms, for
    example. By having permissioned rather than public blockchains, there are some
    immediate benefits, but also some immediate questions.


    The benefits of a permissioned blockchain network are in the control over who
    can see, transact, and create on the blockchain. There is an added layer of security
    by requiring permission to be on the blockchain network. Other benefits include
    increased performance of the network since the transactions are directed to one
    type of transaction [9]. Additional performance improvement is gained by not having
    to do full proof of work but rather proof of stake.


    Proof of work asks that every node on the network try to hash the block and the
    first that accomplishes it is given a reward in the form of bitcoin or some other
    cryptocurrency. Proof of stake assigns one node to solve the hash. The node is
    assigned by the system and other nodes can later verify the solution to reach
    consensus. The node that is assigned to solve the hash is incentivized to perform
    the work by receiving a transaction fee [10]. If this is done by the owner of
    the blockchain, they can not only avoid transaction fees to banks but collect
    fees for themselves.


    Along with these benefits come some questions about the security of fewer nodes
    and reducing the proof of work requirement. The security question can be debated
    on the technical side, but it is argued that it is more secure because not only
    is the hash computation still completed and verified, but it is done by only those
    with permissioned access to the blockchain [9].


