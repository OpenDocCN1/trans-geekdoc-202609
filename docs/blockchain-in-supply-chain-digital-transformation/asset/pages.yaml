    # 3.2 Trade Finance on we.trade


    While a large number of digital platforms have been created to address the needs
    of the trade finance sector, these differ in their approaches. As of 2021 for
    example, Contour and Komgo focus on the letter of credit process, Marco Polo on
    corporate finance, and eTradeConnect upon documentation flows [23].


    The we.trade platform is directed to open account trade. While we.trade does not
    exclusively target SMEs, given the limited resources of this type of organization,
    the SME has the greatest need for trade finance solutions in open account trade.
    The major steps of this process when conducted on we.trade [24] are summarized
    in Figure 2.


    While the standard trading steps of purchase order creation (step 1), seller shipment
    (step 3), and buyer receiving (step 4) certainly exist in this process, the unique
    aspects of we.trade can be seen in the steps for the optional new banking products
    of Bank Payment Undertaking (BPU) (step 2) and BPU Financing (step 5), and the
    auto-settlement via smart contract of the payment to be made by the buyer’s bank
    (step 6). These key elements on the we.trade process for trade finance are further
    described below [25].


    **Bank Payment Undertaking (BPU):** Typically, at the seller’s request, the buyer
    can apply for a BPU from their bank, and if their bank accepts, then that bank
    will guarantee to make the required payment directly to the seller’s bank, upon
    the satisfaction of the settlement conditions as'
