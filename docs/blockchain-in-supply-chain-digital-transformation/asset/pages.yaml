    # 4.5 Protocol Layer Attacks


    # 4.5.1 Nonce Attack


    Every block in the bitcoin’s blockchain contains a 32-bit field called Nonce.
    The value of this field is varied by the miners to find the hash of the block
    that fulfils the target requirement of the network. This calculation is performed
    by specialized mining equipment. The successful calculation may result in a reward.
    Even though the irrational attackers’ aim is not to attain higher profit, but
    if the attacker can gain a profit greater than the hashing power proportion, it
    may impact the profit of others. We observe that the honest portion of the network
    is probabilistic able to mine the following BTC as a reward:


    Reward_Honest = B_r * (100 − α)/100 (1)


    If the attacker can successfully mine more blocks without increasing the α, it
    may reduce the value of Reward_Honest. The loss in the reward due to the attacker’s
    ability to mine more blocks without a significant increase in α causes harm to
    honest participants. The proposed nonce attack is an attempt to exploit this in
    order to cause harm to the network.


    We speculate that due to the endianness of the mining hardware, one type of hardware
    may favor finding odd values of nonce than even. If the attacker can establish
    a pattern of nonce value, it may significantly impact the attackers’ possibility
    of finding the actual value of nonce, thus attaining a higher reward leading to
    the loss of others. **Attack Strategy:**


    +   - Step 1: Retrieve historical nonce data from all blocks on the blockchain.

    +   - Step 2: Observe the odd and even ratio of nonce over time to devise a new
    mining strategy to maximize the chances of mining the next block. The attacker
    may also examine other patterns with a nonce to observe any other numerical biases
    induced by the hardware used.

    +   - Step 3: Test the new mining strategy in a private bitcoin deployment to
    observe any improvements.

    +   - Step 4: Based on the results from Step 3, the attacker may alter the strategy
    devised in Step 2.'
