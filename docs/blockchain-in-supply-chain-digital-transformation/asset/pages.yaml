    # 2.2 The Impact of Blockchain Technology on Supply Chain Management


    Prior to discussing the impact of blockchain technology on supply chain management,
    it is important to first define the term supply chain management. According to
    Mentzer et al., [8] supply chain management (SCM) is the “systematic, strategic
    coordination of the traditional business functions and the tactics across these
    business functions within a supply chain, for the purpose of improving the long-term
    performance of the individual companies and the supply chain as a whole”. SCM
    aims to create an efficient and coordinated supply chain via the development of
    internal and external linkages [9]. Achieving this objective is largely dependent
    on how effectively organizations use their technological resources and technological
    capabilities [10,11]. While extant research has focused on how traditional technologies
