    # 4. Network Analysis of Citations


    The next phase of this research incorporated a network analysis of citations for
    our collated research papers. A network analysis of journal citations can be used
    to study the various relationships between authors, journals, and research fields
    in a transparent and purposeful manner [20]. Furthermore, a network analysis of
    citations has become standard practice in research scholarship [21]. There are
    a number of research tools which can be used to conduct network citation analysis,
    and example of these include: Gephi, CiteSpace, Pajek and VOSviewer. For this
    study, VOSviewer was used to analyse our bibliographic datasets. VOSviewer is
    a software tool which can be used for visualising and creating bibliometric networks
    (e.g., journals, researchers, and publications). VOSviewer enables researchers
    to build networks based on specific permutations including citations, co-citation,
    co-authorship, and bibliographic coupling. In each instance,'
  merge: -1
  img_proc: true
