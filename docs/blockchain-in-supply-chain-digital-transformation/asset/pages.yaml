  md: '# ### 3.2 Blockchain-based Classification


    BC networks are classified in various ways in the current literature [13]. These
    categories are defined based on the degree of network centralization, network
    administration, and permissions as (i) “public”, (ii) “private”, and (iii) consortium
    “federated”.


    Public BC is open to the public, and anybody may access data, submit transactions,
    and “mine” it. As a new user or node miner, anybody could join a public BC (permissionless).
    Moreover, all parties are capable of carrying out activities like trades and contracts.
    As a result, the public BC is seen as a totally decentralized presence, as no
    entity has to influence over it. Bitcoin and Ethereum, as we all know, are examples
    of public BCs [36,60].


    In private BC, the write right is controlled by an organization or institution,
    and nodes participating in it will be severely limited. In private BCs, that,
    like consortium BCs, are categorized under the permissioned BC. It’s common to
    provide a whitelist of allowed users with certain capabilities and rights over
    network operations. Private BC networks can avoid costly PoW techniques since
    the possibility of Sybil attacks is practically non-existent [62].


    A consortium BC is a cross between public and private BCs [62]. In consortium
    BC, numerous organizations or institutions collaborate on administration. It’s
    worth noting that, unlike the public BC, only the organizations that are part
    of it have access to data. A wider range of disincentive-based consensus techniques
    might be utilized.


    Even though it provides similar scalability and privacy protection to private
    BC, the main difference is that instead of a single entity, a group of nodes known
    as leader nodes is selected to verify transaction processes. This enables for
    a decentralized design in which leader nodes can grant other users authorization.
    Table 2 summarizes the major attributes of each BC network in terms of competence,
    ownership, management of shared information security and consensus mechanisms.


    # ### 3.3 Blockchain-based Implementation in Supply Chain Management


    The integration and coordination of SC functions can be improved with BC. Multiple
    SC stakeholders can deal with one another without the need for a middleman owing
    to the BC. As a result, it appears to be best used when there is an issue that
    affects numerous parties, and each of these parties may gain from solving the
    problem. This shared value stimulates involvement and facilitates cooperative
    behavior among participants. Competing organizations can also join the same network
    thanks to BT.'
