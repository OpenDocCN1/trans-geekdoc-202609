    # 3. Permissioned Blockchain as Inter-Organizational Systems


    # 3.1 What is Inter-organizational Systems


    As mentioned earlier, IOS refer to computer systems deployed by two or more organizations
    together to exchange information across the organizational boundaries [12,13].
    Organizations use IOS to share information, exchange data, and orchestrate business
    processes for collaborating with trading partners on mission-critical business
    tasks [14]. IOS have strong relevance for supply chain digital transformation
    as they are tools to integrate the systems of supply chain participants such as
    buyers, sellers, as well as logistics, and financial service providers for executing
    and monitoring the supply chain. [14].


    The deployment of IOS can be bi-lateral in the form of “peer-to-peer” or multi-lateral
    in the form of “one-to-many” or “many-to-many.” However, the most effective implementation
    strategy is “one-to-many”, or called the “hub-and-spoke” model, which is for one
    “hub” which'
