- pgno: 45
  md: '# 5. Conclusion


    The security provisions of Bitcoin have been subjected to academic scrutiny since
    its conception in 2009. Numerous research articles have investigated the security
    characteristics of decentralized cryptocurrency. Due to the economics involved
    in the cryptocurrencies, numerous of these articles assume a rationale attacker
    with the scheme to maximize the profit. This conjecture omits the possibility
    of an irrational attacker with the purpose of harming the cryptocurrency irrespective
    of the cost.


    This chapter presents various novel attack vectors that an irrational attacker
    may exploit to jeopardize the bitcoin network. The paper manifests attacks on
    four facets: Consensus layer attacks, Network layer attacks, Protocol layer attacks,
    and Economic attacks. By modelling an irrational attacker, we can investigate
    the plausibility of a potential large-scale organizational or governmental attack
    on the Bitcoin network.


    We have identified nonce and difficulty recalibration attacks as two potential
    sources of irrational attacks on the protocol layer. Both of these strategies
    have not yet been seen as an attack vector. Both of the attacks seem theoretically
    viable however it would be worthwhile to explore these attack vectors as these
    can likely be fixed by a protocol level fix.


    Another type of attack that we have identified relies on the consensus protocol
    of the network. Other attacks that can induce instability in the network include
    network and economic attacks. For instance, panic selling can induce a drop in
    the exchange rate of Bitcoin that could potentially impact the profitability of
    operating in the network.


    # 5.1 Future Work


    The purpose of this chapter is to illustrate the possibility of irrational attacks
    on Bitcoin and other cryptocurrencies. We believe that these strategies need to
    be examined further to rule out any potential threat these attack strategies may
    pose to the network.


    We intend on constructing an experimental setup to test the feasibility of these
    attack vectors. Specifically, examining the possibility of economic attacks using
    reinforcement learning may allow us to understand the economic dynamics present
    in the crypto-economies.


    # Glossary


    Bribery attack is an attack in which the attacker intends to double spend a transaction
    t_d by incentivizing other miners to favor the fork that includes the conflicting
    transaction.. 7'
