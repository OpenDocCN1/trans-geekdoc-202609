    # Blockchain-Based Energy Efficient Supply Chain Management


    Bavly Hanna,* Guandong Xu, Xianzhi Wang and Jahangir Hossain


    # 1. Introduction


    The Energy Internet (EI) is “a network that merges power technology, electrical
    technology, information technology, and intelligent management technology” [1].
    The conventional energy market trading (ET) mechanism and technical framework
    were created with a centralized power supply. However, as the modern “energy system”
    development progresses, there is a growing tendency to elucidate the power retail
    market and persuade distributed renewable energy (RE) to compete in the market.


    The state of blockchain technology (BT) is currently evolving day after day, and
    “distributed ledger” (DL) technology and “smart contract technology” are increasingly
    being implemented [2]. Distributed energy and microgrid (MG), are all examples
    of distributed trading “rules”, “algorithms”, and “processes”. They are built
    to give fundamental technological alternatives for ET in the current scenario,
    and technical outlines for EI trading systems for the market relied upon BT are
    presented.


    With the benefits it offers, BT has a chance to become one of the most essential
    digitalization tools in the energy business. BT can serve as a control mechanism
    with the rise of distributed energy systems and the demand for green energy. The
    Blockchain’s (BC) distributed structure makes it perfectly compatible with smart
    grids (SG) and MGs,'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'also crucial components of the energy sector’s future [3]. Many scholars and
    practitioners are interested in the structure of distributed energy systems [4].


    The supply chain (SC) and BC technologies are natural matches [5]. To begin with,
    the BC’s structure is a type of time-series data which may hold information, similar
    to the way items circulate in a SC. Second, the information’s relatively low frequency
    changes in the SC overcomes the processing speed limitations of existing BT.


    Each transaction on the BC, including “transaction parties”, “transaction time”,
    and “transaction content”, will be recorded on a block and kept on each node’s
    DL, ensuring the information’s integrity, dependability, and transparency. According
    to Abeyratne and Monfared, DL technology offers the possibility to minimize delay
    in transactions, operational risk, turbulence in the process, liquidity needs,
    and others across a range of financial market use cases [6].


    Energy management (EM) has emerged as a critical tool for achieving both economic
    and environmental goals in a win-win situation. EM minimizes the company’s energy
    expenditures, resulting in a drop in production. It also contributes to environmental
    well-being by developing innovative, low-polluting technology. Firm and SC sustainability
    can thus be addressed by deploying a well-designed EM system [7].


    Concerns about the impact on the global environment and problems with energy security
    have heightened the importance of energy efficiency (EE) in recent years. Since
    energy is used in a variety of industrial processes and at various levels of the
    SC, implementing EE measures is a difficult undertaking. EE adoption necessitates
    a complete EM programme at both the individual company and SC levels.


    The goal of EM is to manage and optimize the usage of energy in various corporate
    activities. It may be characterized as the wise use of energy resources to maximize
    earnings, reduce expenses, and maintain a long-term growth trajectory [8]. Traditionally,
    EM has been researched at the corporate level. When EM principles are scaled up
    to the SC level, they must be implemented on the shop floor, in the company, and
    at many other phases of the SC, such as transportation.


    The rest of the book chapter is designed as follows: Section 2 is a literature
    review about SC-based EM and BC-based EM. Section 3 reports the characteristics,
    types, classification, and implementation of BC in supply chain management. This
    is followed by a discussion of the BC applications, advantages, and challenges
    of EM in Section 4 and conclusions in Section 5.'
