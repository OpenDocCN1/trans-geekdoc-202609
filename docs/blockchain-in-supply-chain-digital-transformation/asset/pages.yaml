    5. Field activity and modification control: records of field installation, service,
    post-delivery changes, etc. This data is added to existing records after manufacture.
    If a complex or safety critical piece of equipment is changed out, this information
    becomes important. This is highly important in the aerospace industry. For example,
    records that the person who installed a critical component on an aircraft was
    a qualified technician is important. Records that they properly tested the installation,
    etc., are also critical to retain.


    This data can be gathered and stored in many ways. Bar codes, Radio Frequency
    Identification (RFID) tags, and human readable are some of the more common ways
