    Radio Frequency Identification (RFID) tags [22]. These methods do a good job of
    improving the current systems. However, these improvements do not fundamentally
    change the processes. Improvements are needed where the system needs exceed the
    current processes. There are five common types of issues that are experienced
    in traceability systems. The issues experience in traceability systems fit into
    the following categories:


