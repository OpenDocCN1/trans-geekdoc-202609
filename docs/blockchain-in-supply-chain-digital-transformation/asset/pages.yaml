- pgno: 117
  md: 'adoption of other organizations as a reference for their adoption decision
    [37]. This can also be observed from the executives we interviewed.


    # 5.2.2 Organizational Context


    # Top Management Support


    Top Management Support refers to the commitments of the top management in adopting
    the innovation. The top management has to demonstrate its commitment by including
    the innovation in its corporate strategy, also investing resources, taking risks,
    as well as acting as the role model of adoption [38]. For the adoption of Permissioned
    Blockchain as IOS, top management support also includes the top management’s drive
    to incorporate it into the inter-organizational business processes [30]. Top management
    Support is crucial for Permissioned Blockchain adoption, especially in its initial
    phase. It is because the benefits and risks are unclear during this stage so it
    would be challenging to justify adoption purely based on the estimation of costs
    & benefits. It takes the top management to make the adoption decision in front
    of the uncertainties. Top management support is also crucial in determining the
    adoption model.


    # 5.2.3 Inter-organizational Context


    # Trading Partner Readiness


    Trading Partners refer to the suppliers, buyers, and logistics or financial service
    providers in the supply chain of the organization that intends to adopt Permissioned
    Blockchain [16]. Trading Partner Readiness is important because the success of
    IOS adoption relies on if the organizations and their trading partners are well
    prepared [31]. The IOS and the related inter-organizational business processes
    cannot be executed if the trading partners are not ready. Hence, it is a boundary
    condition for adoption [39].


    There are two aspects of trading partner readiness including both technical and
    business [40]. Technical readiness is if a trading partner’s IT systems are prepared
    to integrate and transact with the adopter’s Permissioned Blockchain platform.
    Business readiness is if a trading partner is prepared to make changes in its
    business processes aligning with the processes of the adopter after Permissioned
    Blockchain is adopted.


    # Perceived Advantages of the Blockchain Industry Consortium


    As explained in Section 4.2.1, Blockchain Industry Consortium is a collaborative
    adoption model of Permissioned Blockchain including organizations in the same
    industry [26]. Blockchain Industry Consortium is relevant for Permissioned Blockchain
    adoption because the pre-approval participants in the consortium are required
    to share the ledger'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'and to operate the Blockchain network’s governance model on consensus mechanism
    and code changes [26]. In addition, there are perceived advantages of Blockchain
    Industry Consortium which drive and expedite adoption. Those perceived advantages
    include minimizing the adoption cost and risk, improving operation efficiency,
    and accererating the speed to get to the critical mass. These cannot be achieved
    by individual-firm adoption [23].


    # 5.2.4 Environmental Context


    # Competition Intensity


    Competition Intensity is the severity of competition in the industry in which
    the organization operates [41]. Adopting innovation has always been a strategy
    that organizations use to improve market competitiveness [42]. From a Permissioned
    Blockchain perspective, it supports new business models and enables business processes
    can be digitized. These improve an organization’s efficiency and cost-effectiveness
    which are important to compete in a competitive market. In addition, organizations
    are motivated to adopt innovation that their competitors have adopted [16]. Hence,
    Competition Intensity has been considered as an adoption determinant for Blockchain
    including Permissioned Blockchain [35].


    # 6. Insights on Permissioned Blockchain Adoption


    # 6.1 Background of Executive Interviews


    Intending to ascertain the determinants listed in Section 5, we interviewed 10
    senior IT executives in Hong Kong with good knowledge of Permissioned Blockchain.
    They came from different industries including Finance & Banking, Transportation,
    Public Utilities, Information Technology, to Retail that can provide broad perspectives.


    IT executives were interviewed because they are the earliest ones in their organizations
    to explore innovations and evaluate the viability of adoption. They are also technically
    savvy to understand Permissioned Blockchain and able to provide professional insights.


    Hong Kong-based executives were selected because Blockchain technology has been
    growing rapidly in Hong Kong. According to a report from the Financial Services
    and Treasury Bureau of the Hong Kong Government, there were 57 Fintech firms established
    in Hong Kong in 2019. 45% of them are developing Blockchain applications for large
    businesses.¹⁴'
