  md: 'Once the issues of traditional traceability systems were shown to be overcome
    by blockchain traceability systems, there comes the issue of implementing blockchain
    in the supply chain. Implementing blockchain has many issues. Four were identified
    by Rapalis and Hossain as; Lack of standardized format, Differences in accuracy,
    Lack of integration and transparency, Data issues such as trust, privacy, security,
    and reliability [35].


    While Biggs, Hinish, Natale, and Patronick have other implementation challenges
    that include uncertain government regulatory status, large energy consumption,
    cross industry integration, black markets [36].


    All these issues are overcome in different ways. Some are issues that exist within
    the supply chain regardless of the use of blockchain, while others are uncertainty
    or perception issues. The perception issues are of public blockchain rather than
    the private blockchains that are to be used within supply chains.


    This thorough look at product traceability in the supply chain shows that blockchain
    can solve many, if not all, of the issues with traditional systems. The use case
    of blockchain in the supply chain is feasible. The technology is a natural fit
    for traceability systems across multiple entities. Additionally, traceability
    has a positive social impact. As social issues become more important to consumers,
    measures like the Higgs index may play a more important role in consumer choices
    that the marriage of traceability with blockchain in the supply chain can satisfy.
    Enjoy the next loaf of bread being assured that blockchain can support the supply
    chain in maintaining product traceability.


    # Glossary


    **Product Traceability**—Using recorded data to know how a product was produced,
    where it was produced, where the constituent components came from, where the product
    went after it was produced, and processing information about the product.


    **Product Provenance**—Similar to product traceability and often used interchangeably.
    Provenance is only looking in one direction in the supply chain to determine a
    product’s origin.


    **Gartner Hype Cycle**—Gartner is a research and advisory company that produced
    graphic representation of technologies life cycle from inception to maturity.


    **Higgs index**—A standardized measurement of value chain sustainability using
    5 core tools.


    **Track**—Following a product’s data trail downstream in the supply chain.


    **Trace**—Following a product’s data trail upstream in the supply chain.'
