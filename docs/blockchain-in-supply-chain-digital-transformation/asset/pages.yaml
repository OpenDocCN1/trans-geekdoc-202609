  md: '# Preface


    Blockchain is assisting enterprises in digitally transforming their supply chain
    management activities. Supply chain management (SCM) is defined as the “systematic,
    strategic coordination of the traditional business functions and the tactics across
    these business functions within a supply chain, for the purpose of improving the
    long-term performance of the individual companies and the supply chain as a whole”.¹
    SCM aims to create an efficient and coordinated supply chain via the development
    of internal and external linkages. Achieving this objective is largely dependent
    on how effectively organizations use their technological resources and technological
    capabilities. While extant research has focused on how traditional technologies
    such as cloud computing, Radio Frequency Identification (RFID), Internet of Things
    (IoT), tracking technologies, and so on have impacted SCM business practices,
    new technological developments are emerging such as blockchain and distributed
    ledger technologies (DLT) that are enabling new and innovative SCM business practices.
    Anecdotal evidence suggests that blockchain and DLT can lead to SCM benefits such
    as supply chain visibility, operational efficiency, supply chain traceability,
    supply chain resilience, and data security. Empirical evidence pertaining to how
    blockchain and DLT are achieving these benefits is scarce. Furthermore, it has
    been proposed that blockchain and DLT could limit the impacts of global supply
    chain disruptions such as Covid19. This book shares lessons learned from blockchain
    supply chain implementations across a range of industries. Given its scope, it
    is primarily intended for academics, students, researchers, and, practitioners
    who want to learn more about how blockchain can digitally transform supply chains.


    ¹ Mentzer, J.T., DeWitt, W., Keebler, J.S., Min, S., Nix, N.W., Smith, C.D. and
    Zacharia, Z.G., 2001. Defining supply chain management. Journal of Business logistics,
    22(2): 1–25.'
  merge: -1
  img_proc: true
