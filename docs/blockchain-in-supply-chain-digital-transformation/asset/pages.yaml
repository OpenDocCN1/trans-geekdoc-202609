    in Chinese Yuan to the Chinese subsidiaries of Carrefour and Auchan.


    The set-up of all these services was overseen by ASI Group F&B department and
    involved a team in China with Hebe Liu and another team in France led by Mathieu
    Borgé. In order to cope with the important flow of transactions and to support
