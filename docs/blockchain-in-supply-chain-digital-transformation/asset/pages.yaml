    # 5. Conclusion


    The benefits of BC applications are progressively becoming apparent in the sectors
    of new energy trade, financial services, and energy SCM. BT appears to be a viable
    alternative for the development of RE [14]. Furthermore, while developed nations
    dominate fundamental energy BC research due to their mastery of more sophisticated
    BT, poorer countries are increasingly key players in the global energy BC research
    system. In terms of publications, China has considerably overtaken the developed
    nations led by the United States, implying that developing countries may soon
    overtake developed countries to dominate global energy BC research [113].


    The world’s energy BC use cases are more prevalent in industrialized countries.
    This is due to the fact that industrialized nations have relatively full energy
    infrastructures, such as distributed power grids (MGs), which make energy BCs
    a viable application environment [114]. The majority of home power supply facilities
    in developing nations led by China are centralized energy supply systems. This
    is the polar opposite of BT’s decentralized properties, and it stymies the technology’s
    continued development and deployment in the energy sector.


    As a result, underdeveloped nations will have a significant issue in establishing
    energy BCs in the future: how to swiftly create a comprehensive distributed power
    grid. This directly decides whether developing nations can transform their energy
    BC research advantages into practical energy BC applications and subsequently
    support RE development to improve the energy structure.'
