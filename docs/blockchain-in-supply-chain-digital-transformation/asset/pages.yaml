  md: 'chain practices. Digitally enabled supply chains have talent requirements that
    can be quite different from those of conventional supply chains. At least some
    supply-chain managers will need to be able to translate their business needs into
    relevant digital applications. One key question for managers is can we attract,
    develop, and retain the “digital native” talent needed to run and transform the
    supply chain


    # 5.5 Vision


    The biggest problems, though, have to do with governance. Any controversy that
    you read about today is going to revolve around these governance issues. This
    new community is in its infancy. Unlike the Internet, which has a sophisticated
    governance ecosystem, the whole world of blockchain and digital currencies is
    the Wild West. An effective transformation depends on a creative, forward-looking
    concept for the future supply chain. This means thinking about the outlook for
    the company, amid the pressures and trends that influence its competitive situation,
    as well as the changing expectations of its customers. Ultimately, the supply-chain
    vision should be aligned with the company’s strategic goals. While the need for
    such alignment has always existed, what’s new is that both the strategic goals
    and the vision now must account for the pressures and opportunities that companies
    face in an increasingly digitized economy.


    # 5.6 Integration


    Blockchain solutions require significant changes to—or complete replacement of—existing
    systems. Organisations need to develop a long-term plan to identify transition
    requirements for systems required to support blockchain adoption. The integration
    processes need to be clearly defined and well understood by everyone who is involved
    in them. This may be needed to ensure the architecture, operating model, and business
    strategy operate and scale across current established open standards (e.g., ISO
    20022, BIAN7) and connect to next-generation third parties such as digital currency
    marketplaces.


    # 5.7 Culture


    Blockchain represents a significant shift to a decentralized network, which requires
    the buy in of its users and operators. Does the organisation’s culture and organizational
    model encourage experimentation, innovation, and continual improvement? If not,
    then change managers can use theories to help socialize the idea of implementing
    blockchain and collaborate with stakeholders prior to implementation to minimize
    excessive cost or adoption risks.'
