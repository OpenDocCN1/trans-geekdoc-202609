    # Glossary


    **Permissionless Blockchain:** Also named as public blockchain. It is the type
    of blockchain open for anyone with anonymity of each’s identify to participate.


    **Permissioned Blockchain:** It is the type of blockchain only be accessed by
    pre-approved participants. It includes both federated/consortium blockchain and
    private blockchain.


    **Inter-organizational Systems:** Information systems used by organizations and
    their business partners for exchanging business transaction data and orchestrating
    business processes.'
