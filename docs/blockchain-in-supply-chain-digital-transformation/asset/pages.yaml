    For *buyer and seller*, the ultimate objective is to enable the transfer of the
    product’s title by executing what has been agreed and stated in the Smart Contract.
    By doing so, intermediates and their effort to perform the collection, validation,
    and reconciliation of the trade information can be eliminated. Transfer of title
    is executed once the transaction data stored in the Permissioned Blockchain fulfills
    the trade conditions stated in the Smart Contract. It will take time to make this
    automation happen as significant system and business process changes are required.
    Even before that, it is useful for the inclusion of production-related data to
    be stored in Permissioned Blockchain to ensure the product authenticity and quality
    of the product, as well as the condition in manufacturing or assembling, are accurately
    & completely recorded. This is especially important for luxury goods or food products.
    The latest example is the new requirement of proof of the origin by the US Customs
    for importing cotton and cotton fashion items into the US.⁷ It is also crucial
    to ensure counterfeiting can be prevented for critical products such as PPE used
