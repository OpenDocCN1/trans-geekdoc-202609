  md: '# 8


    # Benefits and Barriers to Blockchain Adoption in Industry 4.0 and the Circular
    Economy


    Garry Lohan


    # 1. Introduction


    There is little doubt that emerging technologies in supply chains, across industries,
    will continue to help organisations better fulfil their customers’ needs and improve
    the overall traceability and accountability of their upstream suppliers. Blockchain
    Technology (BCT) in particular, is touted as a potential solution to many of the
    issues currently faced by organisations where traceability and accountability
    is paramount. BCT not only promises to be a solution to external upstream supply
    issues but also for similar issues faced by internal value supply chains. Blockchain
    is a distributed ledger technology whereby transparency and immutability are inbuilt
    into the supply chain process. Once a product or service is entered into the chain
    the actors in the process can be sure the data is trustworthy. This issue with
    trust in supply chain is of utmost importance to most industries and of critical
    importance to several industries such as healthcare, military and the food industry.
    Implementing blockchain into supply chains is a decision that individual actors
    cannot make in isolation. There must be a minimum of two actors to create any
    block in the chain and usually transforming legacy supply chain processes involves
    a'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'strategic internal organisational and cross-organisational decision as the
    use of blockchain involves a change in process and workflow that is often met
    with organisational resistance to the detriment of the overall strategy.


    Efforts to streamline any new implementation process can be aided by theories
    that outline behavioural concerns. As with any new technology, acceptance criteria
    are guided by the end-goal of getting actors to use the new technology. New technology
    acceptance models such as the technology acceptance model (TAM), the resource-based
    view of the firm (RBV) or the Business Model may be of use to implementation managers
    who can use lessons learned from these theories to help plan and implement the
    transformation. While there are alternatives and BCT is not always the answer,
    it does present promising opportunities for improvement across the supply chain.
    Using blockchain in the supply chain has the potential to improve supply chain
    transparency and traceability as well as reduce administrative costs and as Industry
    4.0 (I4.0) ramps up automation and streamlining of processes BTC is well positioned
    to become a major mechanism through which organisations can economically achieve
    their specified objectives within the framework of what is often termed the new
    Circular Economy of the 21st century.


    # 2. Technology Transformation Acceptance


    Industry 4.0 adoption in supply chain management for the circular economy implies
    a disruptive change in the business model. Implementing technologies such as BCT
    requires a change management program for most organisations and the change management
    literature has long highlighted the issues with new processes and ways of working.
    Socio-economic challenges in adopting technological innovations are also well
    documented. For example, [1] suggest the adoption of I4.0 in supply chain is a
    digital transformation process that may take years to get accepted by stakeholders.
    [2] argue that the product, process, market, and environment all present major
    barriers that need to be overcome. There are also other challenges faced with
    implementing a blockchain database. Organisational challenges revolving around
    legal and regulatory frameworks, environmental challenges around energy consumption,
    social challenges such as a lack of required technical skill or even cultural
    challenges in moving from a centralised to decentralised network which will require
    the buy-in of its users and operators. These, coupled with the technological challenges
    of integrating, scaling, replacing or complementing legacy systems, the availability
    of supporting infrastructure, the cyber-security concerns of control, security,
    and privacy and throughput and latency issues which currently limit the potential
    to conduct large data analytics in real time—show that blockchain adoption is
    still in its early days and it'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'is useful to further understand how this new technology is being used and whether
    its potential is being fully realised.


    Many theoretical perspectives have been developed to help understand how users
    of a new technology make decisions to use this new technology. These theories
    or frameworks can provide tools and guidance to understand success or failure
    in implementation processes of new IT applications. As with any theory, they have
    evolved over time and as newer technologies become mainstream, the theories are
    continuously expanded and adapted as and when or if required. In this section,
    we look at some examples of theories which may prove useful in understanding the
    Blockchain environment. This is by no means an overarching list of frameworks
    available, but it does provide us with some guidance when considering a blockchain
    implementation into a supply chain. The theories proposed are the:


    +   - Technology Acceptance Model (TAM) [3]

    +   - Dynamic Capabilities Model [4]

    +   - Business Model [5]

    +   - Unified Theory of Acceptance and Use of Technology (UTAUT) [6]


    # Table 1. Theoretical Frameworks.


    | Theory | Main Independent Construct(s) | Main Dependent Construct(s) |

    |---|---|---|

    | TAM | Perceived usefulness<br>Perceived ease of use | Behavioural intention
    to use<br>System usage |

    | Dynamic Capabilities | Capabilities<br>Absorptive capacity<br>Environmental
    turbulence<br>Agility | Sustainable competitive advantage |

    | The Business Model | Value proposition<br>Target customer segment<br>Core competency<br>The
    competitive positioning<br>The economic model<br>The investment model | Decision
    making levels |

    | Unified Theory of Acceptance and Use of Technology | Gender<br>Age, Voluntariness<br>Experience
    | Performance expectancy<br>Effort expectancy<br>Social influence<br>Facilitating
    conditions |

    | The Resource-Based View of the Firm | Assets, capabilities, resources | Competitive
    advantage<br>Organizational performance |

    | Diffusion of Innovations Theory | Compatibility of technology<br>Complexity
    of technology<br>Relative advantage | Implementation success<br>Technology adoption
    |'
  merge: -1
  img_proc: true
- pgno: 170
  md: '+   - Resource-Based View of the Firm [7]

    +   - Diffusion of Innovations Theory (DOI) [8]


    The Technology Acceptance Model (TAM) in particular, has received widespread use
    within academia and industry and is the most frequently used among all other theories
    [9]. Results from TAM studies are not always consistent however and for this reason,
    plus the fact that end user acceptance issues may not be the main barrier to blockchain
    adoption, the following theories are positioned as complementary to TAM for studying
    stages of the transformation process.


    # 2.1 The Technology Acceptance Model


    TAM theory is based on principles adopted from [10] in psychology, which show
    how to measure the behaviour-relevant components of attitudes and specify how
    external stimuli are causally linked to beliefs, attitudes and behaviour. The
    theoretical model on which TAM is based is the Theory of Reasoned Action (TRA),
    a general model which is concerned with individuals’ intended behaviours. According
    to TRA an individual’s performance is determined by the individual’s attitude
    and subjective norms concerning the behaviour in question. In addition, an individual’s
    beliefs and motivation interact with existing behaviour. With the information
    technology (IT) age of the 1990s, TRA proved too general, and TAM was developed
    specifically to predict individual adoption and use of new ITs. It posits that
    individuals’ behavioural intention to use a new system is determined by two beliefs:
    perceived usefulness, defined as the extent to which a person believes that using
    an IT will enhance his or her job performance and perceived ease of use, defined
    as the degree to which a person believes that using an IT will be free of effort.
    It further theorizes that the effect of external variables (e.g., design characteristics)
    on behavioural intention will be mediated by perceived usefulness and perceived
    ease of use. TAM has received widespread acclaim and is said to consistently explain
    over 40% of variance of an individuals’ intention to use an IT and actual usage.
    However, TAM assumes that when someone forms an intention to act, that they will
    be free to act without limitation. In practice constraints such as limited ability,
    time, environmental or organisational limits, and unconscious habits will limit
    the freedom to act so TAM practitioners often compensate for this by introducing
    additional or alternative belief factors, and/or by examining antecedents and
    moderators of perceived usefulness and perceived ease of use [11].


    # 2.2 The Unified Theory of Acceptance and Use of Technology


    The unified theory of acceptance and use of technology (UTAUT) was first developed
    by [6] and builds upon elements of eight other models'
  merge: -1
  img_proc: true
- pgno: 171
  md: '(theory of reasoned action, the technology acceptance model, the motivational
    model, the theory of planned behaviour, a model combining the technology acceptance
    model and the theory of planned behaviour, the model of PC utilization, the innovation
    diffusion theory, and the social cognitive theory). The basic model for assessing
    information technology acceptance defines the use of a system (a) by the intentions
    to, and (b) by the individual reactions on, using it. According to its authors,
    UTAUT provides a useful tool for managers needing to assess the likelihood of
    success for new technology introductions and helps understand the drivers of acceptance
    in order to proactively design interventions. In UTAUT, there are four constructs
    that play a significant role as direct determinants of user acceptance and usage
    behaviour: Performance Expectancy, Effort Expectancy, Social Influence, Facilitating
    Conditions; and four moderators: Gender, Age, Voluntariness, Experience.


    # 2.3 The Business Model


    The Business Model proposed by [5] outlines 6 core decision variables, namely
    the value proposition, the target customer segment, the core competency, the competitive
    positioning, the economic model and the investment model. These decision variables
    are the inputs to increasingly specific levels of decision-making such as the
    overarching rules level decisions to foundation and proprietary decisions. By
    using the Business Model, digital transformation stakeholders can assess, plan
    and monitor BCT adoption within supply chains and focus resources on areas identified
    as weak by the model assessment.


    # 2.4 Dynamic Capabilities


    Teece et al. [4] define dynamic capabilities as the ability to integrate, build,
    and reconfigure internal and external competencies to address rapidly changing
    environments. Building, integrating or configuring Blockchain databases as part
    of a supply chain transformation can be measured as a dynamic capability. One
    main argument of this theory is that even if resources do not directly lead the
    firm to a position of superior sustained competitive advantage, they may nonetheless
    be critical to the firm’s longer-term competitiveness in unstable environments
    if they help it to develop, add, integrate, and release other key resources over
    time.


    # 2.5 Resourced-based View of the Firm


    The resource-based view (RBV) argues that firms possess resources, a subset of
    which enable them to achieve competitive advantage, and a subset of those that
    lead to superior long-term performance. Resources that are valuable and rare can
    lead to the creation of competitive advantage. That'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'advantage can be sustained over longer time periods to the extent that the
    firm is able to protect against resource imitation, transfer, or substitution.
    In general, empirical studies using the theory have strongly supported the resource-based
    view.


    # 2.6 Diffusion of Innovations Theory


    The Diffusion of Innovations Theory (DOI) sees innovations as being communicated
    through certain channels over time and within a particular social system [8].
    Individuals are seen as possessing different degrees of willingness to adopt innovations
    and thus it is generally observed that the portion of the population adopting
    an innovation is approximately normally distributed over time. Breaking this normal
    distribution into segments leads to the segregation of individuals into the following
    five categories of individual innovativeness (from earliest to latest adopters):
    innovators, early adopters, early majority, late majority, laggards. Members of
    each category typically possess certain distinguishing characteristics. The actual
    rate of adoption is governed by both the rate at which an innovation takes off
    and the rate of later growth. Low-cost innovations may have a rapid take-off while
    innovations whose value increases with widespread adoption (network effects) may
    have faster late-stage growth. Innovation adoption rates can, however, be impacted
    by other phenomena. For instance, the adaptation of technology to individual needs
    can change the nature of the innovation over time. In addition, an innovation
    can impact the adoption rate of an existing innovation and path dependence may
    lock potentially inferior technologies in place. Research using DOI has consistently
    found that technical compatibility, technical complexity, and relative advantage
    (perceived need) are important antecedents to the adoption of innovations.


    # 3. Supply-Chain Transformation in Industry 4.0 and the Circular Economy


    # 3.1 Industry 4.0


    According to [12] Industry 4.0 represents the fourth industrial revolution after
    the mechanization, electrification and computerization of production environments.
    The manufacturing industry in particular; is set to be completely revolutionised
    by the increase in automation and digitisation of the industrial shop floor. The
    concern that streamlined robots all talking to each other via central distributed
    and coordinated main frames would oust the regular line worker hasn’t come to
    pass. Organisations leading the way in automation and robotics such as Tesla are
    also major employers and believe that robotics and automation can be powerful
    tools only'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'when they are properly designed, applied and implemented plus used to supplement
    rather than replace human skills, knowledge and intuition. This proof of complementary
    existence highlights the positives of having a blockchain mechanism supporting
    such production environments. This is important because I4.0 technology may affect
    the manufacturing industry in a similar way the smartphone technology did for
    the consumer world by broad behavioural and social changes.


    The reason the manufacturing industry is so important is that the digital supply
    chain models used in modern manufacturing plants are conceptually the same for
    in-house supply chain as for a broader supply chain that include outside actors.
    Most organisations adhere to a broader quality framework such as ISO 9001 which
    will guide their supply chain requirements and the requirements of those seeking
    to play a role in that supply chain. The benefits of Digital supply chain (DSC)
    include cost-effectiveness of services and value-creating activities that are
    advantageous to many actors in the ecosystem, including firms and their suppliers,
    employees and customers. Digitization has touched upon all aspects of businesses,
    including supply chain and operating models. Today, technologies such as RFID,
    GPS, and sensors have enabled organizations to transform their existing hybrid
    (combination of paper-based and IT-supported processes) supply chain structures
    into more flexible, open, agile, and collaborative digital models. Unlike hybrid
    supply chain models, which have resulted in rigid organizational structures, inaccessible
    data, and fragmented relationships with partners, digital supply chains enable
    business process automation, organizational flexibility, and digital management
    of corporate assets. In order to reap maximum benefits from digital supply chain
    models, it is important that companies internalize it as an integral part of the
    overall business model and organizational structure. Localized disconnected initiatives,
    and silo-based operations pose a serious threat to competitiveness in an increasingly
    digital world. A holistic approach to digital transformation of supply chain,
    starting with a digital strategy and a digital operating model will set the direction
    for integrated execution.


    # 3.2 The Circular Economy


    In March 2020 the European Commission published the new circular economy action
    plan.¹ This plan, presented under the European Green Deal and in line with a new
    industrial strategy, focuses on proposals for a more sustainable, waste conscious
    and consumer empowered environment. The European Parliament defines the circular
    economy to


    ¹ New_circular_economy_action_plan.pdf (europa.eu).'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'be a “model of production and consumption, which involves sharing, leasing,
    reusing, repairing, refurbishing and recycling existing materials and products
    as long as possible”. The circular economy and the push towards sustainability
    and consumer empowerment in general will increase the demand for Blockchain databases
    along certain supply chain lines and within certain industrial segments. The circular
    economy plan specifically mentions Blockchain and argues that by building on the
    single market and the potential of digital technologies, the circular economy
    can strengthen the EU’s industrial base and foster business creation and entrepreneurship
    among small to medium enterprises. By using Blockchain technologies the collaboration
    and sharing of massive amounts of non-personal data called for in the plan can
    be realised. Indeed, the plan calls for innovative models powered by digital technologies,
    such as the internet of things, big data, blockchain and artificial intelligence
    and states that this digital transformation will not only accelerate circularity
    but also the dematerialisation of the economy and make Europe less dependent on
    primary materials.


    As traditional supply chains are still in the process of evolving from paper-based
    labelling systems and documentation; the challenge for many organisations is how
    to transfer to digital supply chains—the awareness of the benefits and the desire
    to change is often there but the know-how is lacking. In larger organisations
    the organisational structure is often characterised by functional and geographic
    silos which do not share information openly.


    # 3.3 Industry 4.0 and CE barriers for Supply Chain Performance


    Technology related to I4.0, like the cyber-physical system, IoT, Bigdata, etc.,
    have the capabilities to stay connected and provide critical information throughout
    the life cycle of products [13]. The convergence of CE and technologies as a smart-circular
    strategy may reduce the implementation gap of CE through smart remanufacturing,
    smart reuse, smart recycling, and smart maintenance. [14] reported that the adoption
    of I4.0 for sustainable supply chain poses organizational, strategic, technological,
    ethical and legal threats and highlighted 18 critical barriers faced by the sustainable
    manufacturing sector citing the lack of global standards and data sharing protocols,
    lack of government support and policies, and financial constraints as the most
    significant issues restricting the acceptance of I4.0. [15] highlighted the cultural,
    technological, market and regulatory challenges obstructing I4.0 adoption. [16]
    pointed out the challenges encountered by industries to achieve I4.0 while fulfilling
    the objectives of environmental protection. Their study emphasized the importance
    of technology integration to enable the capabilities of reuse, remanufacturing
    and recycling. Barriers were highlighted in terms of the cultural aspect, the'
