- pgno: 196
  md: 'challenging to imitate by rival organizations. Additionally, this stage is
    characterized by the fact that the technology is deeply rooted in all the core
    functionalities of the organization and are essential to the day to day running
    of supply chain operations. Finally, it was interesting to note that all the blockchain
    supply chain management benefits that were identified from the literature in Table
    2 were also identified in our analysis of Case A’s operations. For example, from
    a supply chain resilience perspective Case A’s advanced blockchain analytics platform
    can predict shifts in cryptocurrency market dynamics in real time, via DeFi Oracles,
    to protect their customer staking investments.


    # 5. Conclusion


    The popularity of blockchain technologies has been increasing over the last 5
    years across industries. However, the manner in which blockchain technologies
    are used and mature within an organization is under researched. From a theoretical
    perspective, this study provides four contributions. First, this study is one
    of the first undertaken to explore blockchain supply chain adoption through an
    innovation assimilation perspective. Second, it is also one of the first to conceptualize
    the assimilation processes, by focusing on the latter stages of assimilation,
    (e.g., acceptance, routinization, and infusion). Our analysis of Case A’s use
    of blockchain technology has not only highlighted how blockchain assimilates within
    their supply chain processes but it also enabled us to extend the assimilation
    concept to include two new infusion stages from the perspective of blockchain
    adoption. Next, this extended assimilation lens which has been developed in this
    study can be used as constructs for quantitatively examining blockchain technology
    supply chain assimilation in a more in-depth fashion in either the DeFi industry
    or across other industries. Finally, our analysis of the supply chain literature
    has identified for main supply chain benefits associated with adopting blockchain
    technologies: supply chain visibility, operational efficiency, supply chain traceability,
    supply chain resilience, and data security. As stated earlier, most of the studies
    which we analyzed were theoretically based. Consequently, our study has confirmed
    these benefits using an assimilation framework lens.


    Our study also has implications for practitioners. The extended blockchain adoption
    assimilation stage framework and Case A’s use of blockchain technologies can help
    organizations to comprehend how blockchain technologies are adopted and mature
    within an organization to realize benefits that were previously not thought possible.
    There are limitations that must be acknowledged in this study. The findings are
    based on a single case study. Consequently, there are issues regarding'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'the generalizability of the findings. Second, Case A operated in the DeFi industry
    and as a result their operations are unique to this specific industry which has
    implications for external validity. However, in-depth analyses of a single case
    study do not necessarily have to provide wholesale generalizability but instead
    can provide rich detail and serve as a basis for highlighting how theoretical
    concepts and frameworks can be applied which served the objectives of this study
    [29].


    Finally, there are a number of avenues which are ripe for further investigation.
    First, future research could examine the barriers which manifested from adopting
    blockchain technologies for organizations during the latter stages of assimilation.
    This would then allow researchers to uncover how organizations overcame these
    barriers and answer such questions as “What workarounds did they use to facilitate
    the blockchain adoption process?” Next, this study only looked at the later stages
    of assimilation. Further research could examine the earlier stages of assimilation
    (e.g., initiation, adoption, adaption). Insights pertaining to how organizations
    arrive at their decisions to choose to adopt blockchain technologies, deploy and
    maintain blockchain technologies, educate employees how to use blockchain technologies
    on a day-to-day basis and recruit blockchain competent employees, at a time where
    there is a global skills shortage of these skilled employees, would be welcomed.
    Finally, further studies could use the extended assimilation framework developed
    in this study to examine other contexts or industries in which blockchain technology
    is adopted. Further, it would be interesting to explore cases where the adoption
    of blockchain technologies failed. This would provide explanations of what contributed
    to the project’s failure and shine a light on the lessons that can be learned
    from those projects [30].


