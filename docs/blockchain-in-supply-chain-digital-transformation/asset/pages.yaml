- pgno: 70
  md: '# 5.7 Traceability at the Core of China Food Regulation


    China food regulation is becoming more and more complex and strict. The new regulations
    implemented on January 1, 2022, by the GACC are in line with China’s updated Food
    Safety Law that highlights this complexity. In application of Decree 248, all
    food-producing companies looking to export into China must register with the GACC
    on a new online platform.¹⁷ This platform called China Import Food Enterprises
    Registration¹⁸ is part of China E-port data centre. The objective is to collect
    information before products are exported to China and to qualify foreign producers.
    Decree 249 focuses on food import safety measures and provide GACC with additional
    enforcement power to take restriction measures against foreign entities which
    have violated food safety regulations.¹⁹ The food safety audit system and traceability
    required by Decree 249 for overseas exporters and food producers is consistent
    with the latest amendment of China Food Safety Law in 2021. Regulations increase
    the pressure on foreign actors in an attempt to prevent unsafe products from entering
    the Chinese market and to be able to quickly react through product recall in case
    of problems. The traceability before products’ arrival in China and after customs
    clearance up to consumers’ table constitutes from now on the core of China food
    safety enforcement.


    We have seen in 5.6 that the Foodgates platform is able to collect an extended
    traceability flow of information and store it on several blockchains, including
    BSN, and then make it available to a third party. Thus, the Foodgates platform
    facilitates China food regulation compliance by providing food safety traceability
    and speeds up customs clearance process as the pre-declaration can be established
    by the customs broker early in the process. Besides, the scope of traceability
    flow of information can be customised to match legal requirements in China. Nevertheless,
    at this stage, blockchain data are not directly transmitted from Foodgates platform
    to Chinese Customs. Some recent projects in China that use blockchain-enabled
    solutions for cross-border customs clearance make plausible the adoption of blockchain
    by the customs department on a larger scale.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# 5.8 Adoption of Blockchain for Customs Clearance


    Powerbridge Technologies, a China-based technology company specialised in cross-border
    trade, made public in June 2019 that, as part of the National Customs Cross Border
    Technology Innovation Initiatives, its Powerbridge Blockchain Cross Border Compliance
    Platform was adopted by Nanning Customs.20 Nanning is the capital city of Guangxi
    province that is located in the south-west of China and shares a nearly 500-mile
    border with neighbouring Vietnam. Nanning Customs directly manages 26 cross border
    ports.21 The objectives were to facilitate customs clearance for cross-border
    transactions and to improve communication and interoperability between ports and
    province government authorities.


    In October 2019, Chinese authorities officially announced that a blockchain-enabled
    solution was to be used for cross-border customs clearance in Hangzhou, Zhejiang
    province.22 Hangzhou has developed strong logistics and e-commerce industries
    and deals with more than $37.4 billion of imports and exports annually. Customs
    authorities claim that the average time for import clearance has been reduced
    by 85%, from 191 hours to 27 hours, while the export process takes only 12 minutes.23


    Interestingly, the State Administration of Foreign Exchange (SAFE), a regulator
    in Chinese Central Government, announced in November 2019 the expansion of its
    programme launched in March 2019 aiming at using blockchain to support trans-border
    transactions.24 This government decision was echoed in 2020 by the launch of BSN
    blockchain platform. In July 2020, two sub-ecosystems, BSN China for Chinese based
    projects and BSN International open to any foreign project, were created.25 The
    government’s apparent objective is to not only to make BSN the standard for blockchain
    operations in China, but also worldwide through hubs in Hong Kong and Macau [40].
    The great emphasis placed by the government on blockchain development lays the
    foundation for a large adoption in all state and provincial administrations. This
    strategic move and the creation of BSN are changing the blockchain landscape in
    China. This new legal and technical framework will greatly promote public and
    private initiatives. A generalisation of BSN-based e-government applications will


