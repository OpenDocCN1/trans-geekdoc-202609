    # 5. Smart City Blockchain Research Agenda


    Our study has highlighted how blockchain research has been explored in various
    smart city contexts from IoT, security, privacy, mobility, energy, and public
    services. In terms of research question 2, Figure 10 illustrates the various research
    categories which this study has identified as areas for future research based
    on our bibliometric and co-citation network analysis of the blockchain and smart
    city research. We will now discuss these future research areas in turn.'
