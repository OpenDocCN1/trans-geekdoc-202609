    # 3. we.trade—A Blockchain Trade Finance Platform


    # 3.1 Development


    The origins of we.trade date from 2015, when the then-head of trade finance at
    Belgian bank KBC, Hubert Benoot, upon being introduced to blockchain technology
    by the KBC IT department, recalled an event from two to three years before that.
    At a round table held for SME customers, a potato farmer had been asked why he
    didn’t export his produce outside of Belgium. The farmer had responded that it
    was too risky: when he didn’t know a potential new customer, how could he trust
    that partner, and how could he be sure that he would get paid? [17,18].


    Benoit connected the need for providing trust throughout the trade process with
    the new blockchain technology, and the journey was begun. Several European banks
    were approached with a suggestion of collaboration, and a digital platform was
    envisioned as an end-to-end ecosystem to connect buyers, sellers, and service
    providers (especially the banks involved, but also including insurers, logistics
    organizations, and other entities). The platform would simplify the trading process,
    reduce risk by integrating participants and automating transactions, and enable
    the banks to offer any required financial services [19].


    From the perspective of the banks, we.trade would allow them to sell new financial
    products to the previously under-serviced market of companies engaged in open-account
    trading, without compromising their existing profitable letter of credit business.
    It has been estimated by'
