    # 8. Conclusion


    Bread makers no longer live in fear of pillory or hurdle for underweight loaves.
    However, the loaves still need to meet regulatory standards, and having a traceability
    system is necessary for this purpose.


    Initially blockchain technology was used for Bitcoin and other cryptocurrencies.
    In recent years organizations have explored other use cases for the technology.
    Blockchain is a new tool that holds a lot of promise as a developing field. Traceability
    is a new use case for this technology and companies are investing heavily in development.


    Investment is ongoing as companies work to develop blockchain technology. One
    of the main goals of the technology is disintermediation. By removing the banks
    and brokers from the payment process in the supply chain, transactional costs
    can be eliminated. By eliminating the supply chain transactional costs, the benefits
    can be monetarily beneficial. Use cases of blockchain are being explored. One
    of the identified advantages of blockchain beyond disintermediation is to incorporate
    traceability. This immutable database of provenance makes traceability a natural
    fit with blockchain technology. This research looked at the use of blockchain
    technology in supply chain traceability.


    After defining traceability to include track and trace, it was shown how there
    is a natural fit to use blockchain in the supply chain. Disintermediation is the
    impetus for supply chain transactions. Another necessary thing in supply chain
    transactions is product traceability. Since these traceability transactions can
    be included in the blocks of a blockchain, it becomes a natural fit.


    Even though it is a fit within the structure of the blockchain, a traceability
    system must satisfy the five fundamental elements of a traceability system (Lot
    integrity control, Processing control, Build control, Inspection and test, Field
    activity and modification control).


    It was shown that not only does blockchain satisfy the fundamental elements of
    a traceability system, but it also satisfies the four pillars of a traceability
    system (Product identification, Data to trace, Product routing, Traceability tools).


    From this it is easy to believe that using blockchain in the supply chain can
    satisfy the traceability requirements. Beyond being able to satisfy the fundamental
    elements of a traceability system and the four pillars of a functional traceability
    system, blockchain also eliminates many of the issues that plague traditional
    traceability systems (real time information, availability, long term storage,
    security, accuracy).'
