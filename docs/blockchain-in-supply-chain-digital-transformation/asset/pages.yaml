    to the blockchain.


    # 5. Applications of Traceability Data


    Having identified that traceability information is needed throughout the supply
    chain and that there are different elements of traceability data needed, the next
    question is when should the information be gathered and maintained? Traceability
    data need to be gathered and maintained when products are not identical such as
    different production lots or dates [16]. Töyrälä has identified 4 applications
    of traceability data.


    +   1. Material flow management applications—where physically is a product. This
    applies primarily to shipping/logistics companies. It is not uncommon for consumers
    to want to track a package until it is delivered. This also applies to knowing
    product specific information. If a bread company is receiving a batch of yeast,
    what temperature was the yeast held at during shipment? This may require sensors
    and data collection devices but is an important source of data for food manufacturers.

    +   2. Legal verification applications—Warranty, fraud, proof of origin, and proof
    of quality fall within the legal applications for traceability. These applications
    are necessary for the protection of both consumers and producers. When a consumer
    claims that a loaf of bread is moldy,'
