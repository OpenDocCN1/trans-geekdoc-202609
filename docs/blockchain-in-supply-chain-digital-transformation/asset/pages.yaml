  md: 'transfers underutilised [4]. The publication of the Nakamoto article was serendipitous
    as it appeared at a time when trust in financial institutions had hit rock bottom
    caused by the advent of the 2008 financial crisis [5, p.11]. What followed was
    the operationalisation of the concept under the auspices of Bitcoin. A number
    of other networks have been created since, termed cryptocurrencies, describing
    ‘mediums of exchange that uses cryptography to secure transactions-as against
    those systems where the transactions are channeled through a centralized trusted
    entity’ [6, p.9]. There are now thousands of cryptocurrencies in existence with
    a market capitalisation of over 500 billion US dollars [7]. This new medium of
    exchange has implications for the traditional roles of intermediaries and institutions,
    possibly rendering them obsolete or, at the very least, reengineered. Purported
    changes include the restructuring of economic, financial, legal and governance
    systems [8].


    Blockchain is a tamper proof distributed ledger technology (DLT) which is not
    susceptible to easy change. Its operation occurs in a shared environment where
    all the transactions are validated by users and are traceable [2]. This is done
    without a centralised intermediary. Users in the environment modify the ledger
    by executing pieces of code known as smart contracts. The smart contracts are
    then approved and ordered into a linked chain of blocks, (hence blockchain), distributed
    across multiple peers (i.e., users), ensuring the immutability of the data [9].
    Blockchain technology appears deeply complex but can be understood by breaking
    it down to its’ constituent parts. From a high level perspective, distributed
    ledger technology makes use of existing computer science mechanisms (e.g., private
    key storage), cryptographic algorithms (e.g., Hashing and asymmetric key cryptography),
    and record keeping concepts [3]. Private key storage refers to a form of cryptography
    that allows access to a digital asset, e.g., a cryptocurrency. Private keys are
    usually stored using a piece of software known as a wallet. This is a crucial
    aspect of Blockchain technology as the digital asset is associated with the key.
    If the key is lost or stolen then the digital asset is also lost as it is computationally
    impractical to regenerate the same key [3]. Hashing is a function that meets the
    encryption mandate required to solve a blockchain computation. Users can take
    input data, of almost any size, hash the data and obtain the same result thereby
    proving there was no change in the data. The security advantage of this method
    is that even the smallest change in the data will generate a different output
    [3]. Asymmetric key cryptography refers to public key cryptography. Both private
    keys (discussed above) and public keys are utilised and are mathematically related
    to each other. This function is in essence the trust feature in-built into blockchain.
    The user’s wallet public key acts as the address which is visible to everyone
    while private keys are secret and used to digitally sign transactions. The asymmetric'
