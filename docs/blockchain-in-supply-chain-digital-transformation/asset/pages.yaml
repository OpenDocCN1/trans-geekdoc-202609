    as they would for any new and innovative solution.


    # 4. Building the Case for BCT Introduction


    Each year organizations are faced with huge holes in their profits due to counterfeit
    goods. According to a study by the OECD, imports of counterfeit and pirated goods
    are worth nearly half a trillion dollars a year, or around 2.5% of global imports.
    Hoping to improve transparency, traceability and immutability in supply chains
    and to preserve data integrity is of paramount concern with 81 of the world’s
    top 100 public companies by market capitalization using BCT, 27 of them having
    a fully functioning live product, according to blockchain research firm Blockdata.
    Another study by MarketsandMarkets estimates that the global blockchain supply
    chain market will exceed $3.3 billion by 2023 and Gartner forecasts that the business
    value generated by blockchain reach $176 billion by 2025 and $3.1 trillion by
    2030. Despite the obvious advantages BCT brings in terms of and the predicted
    future growth of the technology [21], show that present blockchain technology-enabled
    supply chain system (BCTeSCS) efforts are more-oriented toward improving operational-level
    capabilities (information sharing and coordination capabilities) than strategic-level
    capabilities (integration and collaboration capabilities). These operational'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'and strategic-level capabilities alongside BCTeSCS deliver several supply chains
    performance outcomes such as quality compliance and improvement, process improvement,
    flexibility, reduced cost and reduced process time. However, outcomes may vary
    by industry type based on their uncertainties and given the nascent state of BCT,
    accessibility to primary data about ongoing BCTeSCS efforts is limited.


    # 4.1 How the Blockchain Works


    The blockchain is a distributed database or a giant, global spreadsheet that runs
    on millions and millions of distributed computers. Anyone with internet access
    can view and change the underlying code. It’s a true peer to peer network and
    doesn’t require intermediaries to authenticate or to settle transactions, instead
    it uses state-of-the-art cryptography to record structured information in a global
    distributed database. Blockchain has since its inception become trusted as an
    immutable, unhackable distributed database of digital assets.


    # 4.2 What are the Benefits of Blockchain in Supply Chain Management?


    Given the desire of organisations to have enhanced transparency and accurate asset
    tracking capabilities, BCT coupled with the ability to program business logic
    using smart contracts provides a suitable mechanism to enhance their supply chain
    efficacy. Current issues with supply chain operations such as mislabeling, illegal
    sourcing, counterfeiting, etc., are easily addressed by the implementation of
    public, private, or hybrid blockchains that will bring traceability, transparency,
    and accountability to the movement of goods and commodities. The technology can
    be applied to logistics to make business processes more efficient and to cut costs
    from supply chain infrastructure. In the future and with the Internet of Things
    capabilities, organisations such as banks won’t be able to settle trillions of
    real-time transactions between things and a blockchain-settlement system will
    be needed underneath—something which is likely to factor strongly in the future
    use and development of BTC databases.


    The benefits of Blockchain Technology in Supply Chain Management include:


    +   - Products are tracked accurately

    +   - Tampering with products is not possible

    +   - Improved transparency between supply chain stakeholders

    +   - Ability to isolate problems and solve them

    +   - End consumers don’t have to deal with a counterfeit assets'
  merge: -1
  img_proc: true
