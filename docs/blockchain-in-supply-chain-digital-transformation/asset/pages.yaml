  md: 'created applications to take advantage of data generated by ERP systems. Those
    applications largely focused on improvements in three areas: streamlining transactional
    activities such as those involved in end-to-end planning, supporting major operations
    such as warehouse management, and sharpening the analysis on which decisions are
