    # 6. Conclusion


    This study illustrates the outcome of a descriptive and bibliometric analysis
    of a total of 670 articles on blockchain, supply chain and adoption emanating
    from two of the largest academic publishing databases, Scopus, and Web of Science.
    This study was conducted using Microsoft Power BI and VOSviewer. The results indicate
    that research at the nexus of blockchain, supply chain and adoption is still at
    an early stage but is steadily increasing. The majority of research is published
    as journal articles or conference papers. The fields/disciplines in which this
    research has been published most frequently are business, management, computer
    science, engineering, and decision science. The bibliometric analysis highlighted
    keywords and terms that occur frequently together in literature. The visualisations
    emphasised the avenues of research that are currently being pursued on these topics
    and also highlighted neglected research areas. We suggest further research at
    frequent intervals to track the research evolution of this topic. Other publications
    have examined blockchain in supply chain utilising bibliometric analysis. This
    is the first publication to examine blockchain adoption in supply chain by employing
    bibliometric analysis. These are the key contributions of this research. The limitations
    of this research are clear. As the data was extracted from two academic databases
    the results only cover the range and scope of journals contained within these,
    excluding a number of other platforms.'
