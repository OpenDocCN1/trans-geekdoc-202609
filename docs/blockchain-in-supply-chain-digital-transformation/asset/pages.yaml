    Carrefour and Auchan in China.

    +   3. **Transportation:** Carrefour and Auchan needed a service provider for
    their private labels to coordinate the delivery from several warehouses in France
    and organise shipments to China. Transportation was mostly carriage by sea. The
    service also covered the customs clearance and delivery to Carrefour and Auchan’s
    warehouses in China.

