    # ### 3. Bibliometric Analysis Results


    To answer research questions 1 and 2, a bibliometric analysis of the extant blockchain
    and smart city academic literature was conducted. Bibliometric approaches, often
    known as “Bibliometric Analysis”, have become a well-established and important
    element of research assessment methodology, particularly in scientific and practical
    domains [16]. According to [17] ”this type of analysis is based on the identification
    of the corpus of literature, i.e., publications in their broadest sense, within
    a given subject area”. Blockchain research in a smart city context has achieved
    sufficient maturity to allow a bibliometric analysis of the extant research literature.
    A wide range of quantitative statical tools are now available to conduct bibliometric
    analyses. For this research, manual quantitative methods of analysis were used
    in conjunction with software such as Publish or Perish [18] and VOSviewer (described
    later). Publish or Perish is a software tool that sources and analyses scholarly
    citations. It obtains citations from Google Scholar, analyses them, and generates
    a set of citation analysis metrics. The citation results can be extracted to other
    software programmes or saved as a text file for future analysis. The following
    sections provide an overview of the results from our analysis using the aforementioned
    software tools.


    # ### 3.1 Keyword Statistics


    Researchers catalog their research articles by assigning them specific keywords.
    They are the terms used by researchers to describe the issue and reflect the major
    elements of their study topic. The keyword statistics procedure was carried out
    manually as part of the data gathering process to highlight the most frequently
    used phrases/words in the research title and keyword section. We gathered a total
    of 3309 keywords from our final 905 sources. Table 2 lists the most popular keyword
    terms. Additionally, Table 3 outlines the top ranking title keywords contained
    within those final set of 905 papers. Juxtaposing the two tables, it can be seen
    that “Blockchain/Blockchain Technology” is ranked as the number one most ranked
    keyword and title keyword. The second most ranked keyword is “Smart City”, and
    the second most ranked title keyword is “Smart Cities”. As these terms were used
    in our keyword search string'
