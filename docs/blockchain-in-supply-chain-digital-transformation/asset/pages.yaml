    (Section 6).


    # 2. Permissioned Blockchain


    # 2.1 What is Permissioned Blockchain


    Blockchain is defined as “a cryptographic, or encoded ledger—a database of transactions
    in the form of blocks arranged in a chain. These are validated by multiple users
    through consensus mechanism (such as proof-of-work in Bitcoin mining) shared across
    a public or private network.”1 It is a decentralized ledger with transaction data
    encrypted and validated through mutual consensus of participants. Blockchain is
    characterized by its nature of decentralization, persistency, anonymity, and audibility
    [2]. The advantage it offers to users in validating transactions without relying
    on any trusted intermediator does not exist in previous technologies. With this
    advantage, Permissioned Blockchain can be applied in many aspects of businesses.
    It is forecasted by the World Economic Forum that approximately 10% of global
    GDP will be stored in Blockchain technology by 2027.2


    Blockchain can be categorized into Permissionless Blockchain and Permissioned
    Blockchain [3]. Permissionless Blockchain are also called Public Blockchain. It
    is open for the participation of anyone with the anonymity of his/her identity.
    Permissioned Blockchain, on the other hand, can only be accessed by pre-approved
    participants. The sharing of transaction data is controlled among the participants
    and is suitable for mission-critical business transactions [4]. It is divided
    into Federated/ Consortium and Private Blockchain by some researchers [5,6]. To
    enable the execution and completion of business transactions, Permissioned Blockchain
    makes use of distributed Ledger technology (DLT), Smart Contract, and Decentralized
    Applications (DApp) [7]. There is a wide range of business use cases based on
    Permissioned Blockchain across different industries. Examples include tracking
    items across the supply chain with multiple handlers for anti-counterfeiting and
    status monitoring, exchange of patient information in the healthcare system, exchange
    of information'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'in financial products from application through approval to a settlement which
    is also categorized as Decentralized Finance (DeFi) [8].


    # 2.2 Technical Differences between Permissionless Blockchain and Permissioned
    Blockchain


    There are several key differences between Permissionless Blockchain (Public) and
    Permissioned Blockchain (Federated or Private) from technology’s perspective.
    They can be observed in the below table.


    As indicated in Table 1, there are 5 core differences between Permissionless and
    Permissioned Blockchains in terms of the condition of participation, access control,
    identification of participants, consensus mechanism, and the control of the source
    code.


    From the perspective of participation, access control, and identity, Permissionless
    Blockchain is open for anyone to participate as a node or a “miner” to validate
    transactions and compete for reward in terms of a crypto coin in return. Anyone
    can read and write transaction data into the block after being validated. The
    participant’s identity is pseudonymous and cannot be identified as it just comes
    from a dynamic IP address. On the other hand, participants of Permissioned Blockchain
    are by invitation only and must be pre-approved. They can be organizations with
    common interests or purposes. For example, they may all come from the same industry
    or the same business ecosystem. As such, the read and


    Table 1. Comparison between Public Blockchain and Permissioned Blockchain


    |  | Public | Permissioned |

    |---|---|---|

    | Participation | Anyone can participate | By invitation only, vetted either by
    a central authority, consensus, or other criteria |

    | Access Control | Anyone can read and anyone can write (subject to validation)
    | Read and write access may be restricted to protect the privacy of data |

    | Identity | Pseudonymous | Participants identified, preferably strongly |

    | Consensus | Typically requires a majority of validator nodes | Maybe done by
    a smaller set of nodes, such as stakeholders and/or knowledge-holders |

    | Control of Code | Anyone can make changes, but a majority of nodes decide which
    to keep | Mayabe centralized or controlled by a consortium |


    Source: McBeath B (2018), Blockchain, Identity, and CSR in 2018³'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'write authority of participants are also restricted by the operators of the
    network nodes which could be an individual organization or a group of organizations
    in the form of a consortium.


    In addition, a major feature of Blockchain is the consensus mechanism. Consensus
    is the process by which participants on the Blockchain peer network agree on confirming
    transactions [9]. These are the rules and techniques for the participants to reach
    a consensus on the realness of transactions. For Permissionless Blockchain, the
    consensus is Proof-based such as the Proof-of-Work protocol. Participants join
    Permissionless Blockchain as Blockchain network node operators. They must solve
    a difficult cryptographic question to prove their trustworthiness which some people
    called “mining” before they can add new blocks to the chain. The consensus is
    based on the “right answer” that came up by over 50% of the participants despite
    the reward only going to the participant who took the shortest time to answer.
    Likewise, the majority of the participants can vote and decide on change or enhancement
    in the source code of the Blockchain. This governance of the source code can be
    achieved through a decentralized autonomous organization (DAO) which is voted
    by the participants [10].


    As the participation of Permissioned Blockchain is by invitation only, it is a
    closed user community with all known participants. Validating nodes in Permissioned
    Blockchain do not need to prove their trustworthiness as they are pre-qualified.
    Therefore, these known participants engage in Fault-Tolerant Consensus to ensure
    the consistency of all replicated copies of the ledger under their management.
    Fault-Tolerant Consensus can be based on a variety of consensuses such as Proof-of-Authority,
    PBFT, or other distributed consensus protocols [9]. It is performed by the participants
    who are also the stakeholders of the Blockchain network. Likewise, the control
    of code changes is owned by the stakeholders.


    # 2.3 Different Business Models of Permissionless and Permissioned Blockchain


    Permissionless and Permissioned Blockchains have different technical characteristics
    as mentioned in Section 2.2. These differences boil down to the key question of
    what business models they are supporting. This question is important because a
    mismatch between the Blockchain technologies and the business models leads to
