    # 5.4 The Added Value of Blockchain


    # Foodgates platform’s information system


    Foodgates platform is a business application. Jonathan Horyn stressed that the
    “Foodgates platform is a proprietary platform developed for specific needs that
    is operated single-handedly and is autonomous from the use of blockchain”. The
    Foodgates platform is primarily a B2B marketplace for F&B Asia professionals to
