  md: 'through the assimilation stages to be linear. However, extant research has
    demonstrated that progression may be non-linear. For instance, [37] argue that
    a sequential model is more likely to emerge for ‘off-the-shelf’ technologies in
    comparison to ‘bespoke’ technological innovations. Further, [37] suggest that
    an unfreeze (e.g., initiation, adoption, stages) and unfreeze (e.g., acceptance,
    routinisation, and infusion stages) sequential pattern is likely to emerge.


    This six-stage assimilation framework has been used in previous studies that examine
    technological adoption [39]. We also believe it would also be an appropriate lens
    with which to examine the benefits and challenges associated with the adoption
    of blockchain technology in smart city contexts. Of particular interest would
    be future research relating to the infusion assimilation stage which could be
    sued to identify the “emergent use” cases for blockchain in smart city contexts.


    # Research Direction #4: Technology Stack


    This study identified that blockchain is not used in isolation in smart city contexts.
    The technology is used in fusion with other technologies such as cloud computing,
    artificial intelligence, fog computing, sensor based IoT, drone technologies,
    ubiquitous technologies and so on. This study argues that future blockchain research
    should focus on how blockchain technologies can be deployed in smart city contexts
    using a concept we refer to as the technology stack. A technology stack encompasses
    the overall technology infrastructure and data ecosystem that is constructed when
    deploying smart technology applications. This study argues that blockchain technology
    and DLT can serve as the foundational layer which provides security, immutability,
    privacy and trust for the technologies and data which are built/deployed on it.
    For example, [40] explored how DLT can be deployed in a medical supply chain using
    IoT sensor, business intelligence and cloud based technologies to create vigilant
    information based systems. This multi-layer technology stack can be used to enable
    organisations to make quick decisions in real-time in dynamic supply chain environments.
    It can also assist with the prevention of counterfeit medications. Furthermore,
    “the application of smart technology stacks which are underpinned by blockchain
    and DLT can equip smart city decision-makers with the data need for the planning,
    development and maintenance of smart city services, resources, and infrastructure
    in real-time.'
