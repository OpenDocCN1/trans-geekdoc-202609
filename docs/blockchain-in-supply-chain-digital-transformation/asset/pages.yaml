  md: 'and trace [15]. Tracking is following a product downstream in the supply chain
    and tracing is following a product upstream in the supply chain.


    While there is still debate about the exact definition of the term and what data
    should be included, the concept is well understood [16,17]. Both the history of
    the product throughout the supply chain as well as the history of the product
    through distribution must be included in the definition.


    Another aspect of traceability data is that it includes production information.
    For example, the bread manufacturer will likely have data for each batch of bread.
    This data will include cooking temperature and time, the specific oven used, the
    date it was baked, etc. The types of data that are retained are sometimes regulatory
    (the company is required to collect and keep) and other times it is optional.
    Many authors have rightly pointed out that traceability data is not just within
    a single company but extends to the entire supply chain [18,19,20,21]. This means
    that not only is the tracking and tracing data important for the supply chain,
    but also the data about production is important at each step in the supply chain.


    # 4. Elements of Traceability


    Within the context of track and trace, the elements of traceability can be broken
    down even further. Caplan provides five necessary elements of an effective traceability
    system [18].


    +   1. Lot integrity control: Lot and part identification. This is data that manufacturers
    retain on the history of production. When an item is produced, on which machine,
    which shift, etc.

    +   2. Processing control: Unique identification of each item or group of items
    (lot) and process data. This information is more detailed data about production.
    It goes beyond when an item was produced and includes data about the processing
    itself. For example, a loaf of bread being baked in an oven could have data retained
    about the oven temperature and the time the item was in the oven. Any other processing
    data would fit into this category.

    +   3. Build control: data showing which items were combined to make the product
    and the process data when it was built at each step of the process. Data here
    would include things such as which lot of yeast was combined with which lot of
    flour to make which lot of bread.

    +   4. Inspection and test: records of test, rework, and other off standard work
    on a product. If a product has a test required or performed, then that data would
    be of this category. A loaf of bread might require that some of the flour is tested
    for coarseness during processing. The results of these kinds of tests and inspections
    would be retained here.'
