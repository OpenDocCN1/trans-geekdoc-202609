    the origin of the shipment. In addition, the adoption of Permissioned Blockchain
    may include the adoption of the Internet of Things (IoT) to create the digital
    twin for the product. This can provide dynamic monitoring of products’ condition
    during in-transit.


    For *Transport & Customs related stakeholders*, Permissioned Blockchain can capture
