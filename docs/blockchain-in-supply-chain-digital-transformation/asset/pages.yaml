- pgno: 33
  md: '# 2.2.3 Selfish Mining


    In Selfish mining [41], the attacker aims to augment an unfair share of reward
    by causing harm to the other participants of the network. The attacker achieves
    this by mining on a private chain and publishing the private chain strategically
    to ensure the loss of the reward for other participants. The attacker does this
    with the anticipation that other participants will join the attackers’ coalition.


    The attackers’ success probability is profoundly reliant on the direct network
    connection that the attacker has [41]. It is reported that network connectivity
    may be a decisive factor. Other attacks that exploit the network connectivity
    include the Eclipse Attack [34].


    # 2.2.4 Eclipse Attack


    In an Eclipse mining [26], the attacker partitions the victim from the rest of
    the network. The view of the data that the victim sees is a monopolized version
    of the actual data based on the will of the attacker. The attacker in this attack
    manipulates all the incoming and outgoing network connections of the victim. The
    attacker can exploit the eclipse miners computational power for their benefit.


    These types of attacks aim to accomplish monetary gain by economically harming
    other entities (e.g., lost block reward). The economic attacks on the bitcoin
    network may prove to be most likely as the reliance on monetary value for security
    is a significant limitation. Some other attacks that exploit the economic properties
    of bitcoin include Whale Transaction [38] to reduce the growth rate of the network
    by promoting more forks.


    # 2.2.5 Whale Transaction


    A Whale transaction is defined as a transaction with very high monetary value
    as the transaction fee, which may promote forks in the network [38], [48]. All
    the miners are incentivized to include the whale transaction in their block to
    receive the significantly high transaction fee in their block. This race to include
    the whale transaction in the block limits the chain growth rate as most miners
    are indulged in the race to win the transaction fee reward.


    In this attack, the authors introduced the idea of miners favoring a chain fork
    based on incentives. Another attack that exploits the same economic gain incentive
    is a Bribery attack [28].


    # 2.2.6 Bribery Attack


    In a Bribery attack [28], the attacker intends to double spend a transaction t_d
    by incentivizing other miners to favor the fork that includes the conflicting'
