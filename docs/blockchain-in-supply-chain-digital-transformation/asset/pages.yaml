    # Non-adoption is due to the lack of adoption determinants


    There were three non-adopters we interviewed. All of them agreed that their non-adoption
    was due to the lack of certain adoption determinants. The CIO of a retail group
    advised that he had not identified use cases that demonstrated benefits significant
    enough to justify the investment. There was also no relevant blockchain industry
    consortium in the industry his company operates. He has been explored with other
    industry players the idea of forming an industry consortium, but it was not successful.
    Hence, he was still in a status quo position.


    The CIO of the public utility company cited similar reasons. He has been observing
    Permissioned Blockchain adoption in the energy industry but still not able to
    identify the one which he expected can bring sufficient benefits to justify. The
    public utility company offers services to a large community of customers. The
    most important consideration for them is to ensure the quality and stability of
    their services to meet the public’s expectations. On the other hand, they have
    not seen an urgent need for adopting innovation aggressively for a competitive
    reason as there were few competitors in their sector. From these two perspectives,
    they were taking a conservative approach in their Permissioned Blockchain adoption
    strategy. The CIO also did not consider Permissioned Blockchain technology mature
    enough as there was a lack of proven success in adopting Permissioned Blockchain
    in his sector to serve a large user community. The CIO also did not see all the
    trading partners were ready as mentioned above in the point regarding trading
    partner readiness.


    Another non-adopter, the CIO of the transportation company, agreed that the lack
    of readiness of all trading partners is a key inhibitor for them to adopt Permissioned
    Blockchain in their supply chain. Similar to his counterpart in the utility business,
    he saw the top management’s focus as the safety and stability of services. Adopting
    Permissioned Blockchain is not a key priority of the top management. Rather their
    top management felt that it was more practical to adopt technologies for improving
    cost efficiency directly such as Robotic Process Automation (RPA).


