- pgno: 72
  md: 'certainly be extended to the Chinese Customs process. Then, blockchain-enabled
    information systems will be able to cover not only the traceability requirements
    but also the customs clearance.


    # 6. Conclusion


    The study of Foodgates has illustrated that a blockchain-enabled information system
    can support food exporters to comply with China food import regulations, either
    directly by providing a certified tracking of product safety, or indirectly by
    facilitating the customs clearance process. Greater transparency, instantaneous
    access to data, and certification of documents make blockchain a RegTech that
    simplifies companies’ compliance with regulations related to import process and
    supports food safety enforcement.


    Foodgates’ information system can easily be adjusted to changes in regulations
    and incorporate more information and documents. This flexibility is important
    as the food safety regulatory framework needs to adapt to new risk situations
    and the time to comply with new regulations tends to be short. Besides, the system
    provides a certified traceability record which is now part of food safety regulation
    requirements in China. In that respect, Foodgates information system serves the
    interest of foreign food exporters as well as China policy aiming at ensuring
    the provision of transparent information to consumers.


    With the launch of BSN blockchain, the Central government has been able to push
    further a blockchain adoption strategy for the government sector. In addition,
    some provinces have started to adopt blockchain for cross-border transactions
    clearance. Results show that the clearance process is faster. Besides, blockchain-enabled
    systems make information and data administration more cost-efficient. Once data
    are stored on the blockchain, reconciliation of information is no longer required,
    storage is fully digitised and accessibility to immutable data is permanent. The
    generalisation of blockchain adoption to enforce food safety regulation seems
    ineluctable.'
