- pgno: 175
  md: 'economic aspect, and the technological and legal aspects. [17] identified the
    I4.0 barriers against CE adoption through discussion with experts and literature
    review. Their analysis indicates that “process digitalization,” “infrastructure
    standardization” and “semantic interoperability” are the dominating barriers that
    can impact the integration of I4.0. Sharma et al. [18] propose that the execution
