    blockchain system via BlockFlow technology, a solution developed by Younicorns.
    BlockFlow enables an interconnection with a large number of blockchains, among
    others VeChain and BSN. Thus, Foodgates is blockchain agnostic, as it is compatible
    with many types of blockchain. As described by Jonathan Horyn, “BlockFlow transforms
    any business process into a blockchain-enabled traceability system”.'
