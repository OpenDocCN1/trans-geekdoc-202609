    # 5.2 Improvement


    Digital technology can make customer experiences better by giving supply-chain
    managers more control and providing customers with unprecedented transparency:
    for example, track-and-trace systems that send detailed updates about orders throughout
    the lead time would be very welcome in many instances. Through innovative and
    continuous improvements, a digital supply chain can help a company strengthen
    its business model (for example, by expanding into new market segments) and collaborate
    more effectively with both customers and suppliers (for example, by basing decisions
    on information that is automatically pulled from upstream customers’ or downstream
    suppliers’ ERP systems).


    # 5.3 Control


    While solutions exist, including private or permissioned blockchain and strong
    encryption, there are still cybersecurity breach concerns that need to be addressed
    before the general public will entrust sensitive data to a blockchain solution.
    Furthermore, businesses can maintain more control over outsourced contract manufacturing.
    Blockchain provides all parties within a respective supply chain with access to
    the same information, potentially reducing communication or transfer data errors.
    Less time can be spent validating data and more can be spent on delivering goods
    and services—either improving quality, reducing cost, or both.


    # 5.4 Support


    Radiofrequency identification (RFID), 2D barcode, and near field communication
    (NFC) are used today to link to physical product. However, to ensure the flow
    of information, all steps of the supply chain and all products will have to be
    tagged digitally, requiring an overhaul in supply'
