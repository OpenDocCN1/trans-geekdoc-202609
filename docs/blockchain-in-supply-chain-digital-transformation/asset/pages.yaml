  md: 'the adoption of information technology at the firm level are clearly understood.
    Many theories have been posited in the past, however, the majority view the issue
    of technology adoption occurs at the individual level of analysis. The two dominant
    theories of information technology adoption emanating from information systems
    discipline that employ a firm level of analysis, are the diffusion of innovation
    theory and the technology, organisation, and environment framework. The diffusion
    of innovation (DOI) theory, posited by Rogers, describes how, and why the rate
    at which new ideas and technology spread through culture at both individual and
    firm level. Organisational innovativeness is determined by individual characteristics,
    such as attitude towards change, internal characteristics of the organisational
    structure, such as complexity and interconnectedness, and finally the external
    characteristics of the organisation such as system openness [19]. The technology,
    organisation and environment (TOE) model was first developed in 1990 by [20].
    It pinpoints three distinct areas of an organisations context that affects the
    process of adoption and implementation of a technological innovation: the technological
    context, organisational context and environmental context [19]. The technological
    context refers to both the internal and external technologies pertinent to the
    firm. From a more specific perspective, the technological context incorporates
    factors such as complexity, relative advantage, privacy, security, and compatibility.
    These factors have been shown previously to affect existing or potential information
    technology adoptions [19,21,22]. An abstract view of the organisational context
    describes the firm by examining its scope, size, and managerial structure. More
    specific considerations include; top management support, prior IT experience,
    innovativeness, information intensity, and organisational readiness [19,21,23].
    The environmental context refers to the wider area in which a company operates
    its business, i.e., the industry, its competitors and relationships with government
    including regulations [19,21].


