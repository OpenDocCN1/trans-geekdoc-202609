  img_proc: true
- pgno: 34
  md: 'transaction. Combining a whale transaction to favor the fork that includes
    a conflicting transaction may allow for a successful double spend attack.


    The attacks listed above are some of the most prominently reported attacks on
    the Bitcoin network in the literature. These attacks assume that the attacker
    seeks to attain a monetary gain by performing the attack. This assumption may
    seem reasonable as the cost involved in the successful execution of any of these
    attacks is high. However, we argue that if a large-scale organization is motivated
    to compromise the network, they may not be incentivized by the possible gain from
    the attack. In this chapter, we identify more attack vectors in the architectural
    layers identified above for an irrational attacker. The following section provides
    an overview of the study design.


    # 3. Study Design


    As the Bitcoins network is appreciably intricate, an exhaustive search of all
    possible attack strategies is considered injudicious. We abstain from the exhaustive
    search by conducting a review of the architectural layers (Section 2) from the
    attackers’ perspective. The review results in a list of potential attacks. We
    adhere to the reflective action science research method [3]. We do not validate
    if the attacks are realistic, practical or feasible, we leave this up to future
    research.


    The reflective action science approach details a five-phase cyclic process [7],
    [1] consisting of Diagnosis, Action planning, Action taking, Evaluating, and Specifying
    Learning. In the following section, we will review the action plan in detail.


    Prior to the initialization of reflective action research, a research environment
    must be established. In our case, the research environment is the aforementioned
    four-layered architecture. After the establishment of the research environment,
    the cyclic process is initiated with the diagnosis of the problem with the information
    system.


    In the diagnosis phase, we aim to identify the possible attack strategies for
    the irrational attacker. In line with the current research in action science,
    the diagnosis entails self-interpretation of the problem, not by reduction and
    simplification, but preferably in a holistic fashion [7]. The diagnosis also assists
    us in the development of certain theoretical assumptions about the characteristics
    of the problem [9].


    The diagnosis is followed by action planning phase in which researchers and practitioners
    collaborate to determine the methods of validation of previously identified problems.
    For this study, the action planning phase involves the identification of evaluation
    techniques for the identified problems. Theoretical frameworks traditionally drive
    these methods.'
