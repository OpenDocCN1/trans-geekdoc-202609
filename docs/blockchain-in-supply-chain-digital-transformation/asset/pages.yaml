  md: '![](img/fdc6464c91fc66462db3b9c6fded9a71_35_0.png)


    Figure 1. Action research plan.


    In the next phase known as Action Taking, the identified methods of validations
    are implemented. After the action implementation phase, the results are evaluated
    by the researchers and practitioners in the Evaluation phase. The evaluation phase
