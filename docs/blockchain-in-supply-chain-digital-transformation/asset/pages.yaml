  md: 'peer.” It is also called Consortium Blockchain. These two models will be explained
    in more detail in Section 4.


    # 3.3 Permissioned Blockchain as IOS for Supply Chain Digital Transformation


    An end-to-end supply chain involves activities in planning, making, buying, moving,
    and selling of products across different stakeholders. Each of them contributes
    transaction data to the chain. In return, they consume the transaction data for
    their business purposes. Stakeholders in the supply chain can be described in
    three groups:


    +   1. *Buyer and Seller*: to buy/sell products. The exchange of title of the
    product is based on evidence of the product’s authenticity, as well as of the
    fulfillment of trading conditions. This evidence includes information transactions
    such as purchase orders, advanced ship notices, receiving advice, invoice, remittance
    advice, etc.

    +   2. *Logistics Services Providers*: to move the product from the origin to
    the destination. They include warehousing operators, truckers, freight forwarders,
    sea or air carriers, and customs service providers. Each of them contributes and
    consumes shipment status transaction data while delivering supply chain logistics
    services.

    +   3. *Financial Services Providers*: to provide financial services for facilitating
    trade transactions. They are banks or factoring service providers.


    Traditionally, information created in the activities of the three groups of stakeholders
    is provided either in unstructured formats (e.g., paper, email, email attachment,
    fax, etc.) or structured formats (e.g., EDI, XML, etc.). It is possible to validate
    bilaterally transaction data either manually or digitally by using IOS. The validation
    will be less easy if the transaction data involves, or passes through, more than
    2 parties. An outsourcing service provider can provide syntax-level data validation,
    but it is the data creator’s database to provide the true original data.


    ![](img/fdc6464c91fc66462db3b9c6fded9a71_108_0.png)


    Figure 2. Stakeholders in the supply chain.'
