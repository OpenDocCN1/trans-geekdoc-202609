    +   - Buyer’s bank and the buyer’s bank account

    +   - Seller’s bank and the seller’s bank account

    +   - Delivery terms

    +   - Payment terms

    +   - Settlement conditions

    +   - Expiry date


    Where a bank financing product is selected, it will also contain this information:


    +   - the goods or services involved

    +   - the country of origin of any goods involved

    +   - the price information (unit price, tax rate and quantity) of the goods or
    services


    Smart contracts are indeed the core component of the we.trade platform, facilitating
    the automation of transaction processing and enforcement, and making possible
    the enhancements to competitive advantage that buyers, sellers, and banks can
    derive from participation in the we.trade platform.


    # 3.5 we.trade Enabled Competitive Advantage


    What are these prospective enhancements to competitive advantage for members?


    According to interviews and media articles, feedback from buyers and sellers on
    the use of we.trade has been positive, with the value derived from membership
    in the platform found to be greater than expected. This value primarily results
    from the ability of we.trade to facilitate improved liquidity while reducing risk
    and enabling gains in efficiency, transparency, and security. These benefits as
    reported by buyers and sellers and their banks are further described in Table
    4 [19,26–30,34–36].'
