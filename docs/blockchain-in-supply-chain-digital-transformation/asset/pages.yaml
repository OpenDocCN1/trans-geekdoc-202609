    # 2. Blockchain


    Blockchain was originally designed for the cryptocurrency of bitcoin. Since the
    initial inception of the technology, it has been applied to many other uses. Initially
    the uses have been transactional. Since blockchain can be applied to any type
    of transaction, this opens the possibilities for many other blockchain applications.
    In the past few years, the supply chain has been advocated as a use case for blockchain
    [2].


    Purchasing goods normally involves the exchange of currency. In modern supply
    chains this involves a third party such as a bank or broker. Satoshi Nakamoto’s
    2008 paper first proposed a distributed ledger eliminating the need for a trusted
    third-party payment system [3]. The idea allows for peer-to-peer payments using
    a digital currency across a public ledger system. This public ledger system is
    solved in blocks making it almost impossible to forge. These blocks could not
    be altered but only added to, which created a chain of these blocks. Thus, it
    was titled blockchain.


    Before discussing how blockchain can be applied to product traceability we need
    to understand the basics of how blockchain works. Most readers of this text will
    be familiar with the basic representation of the blockchain where each block has
    the hash, timestamp, the transactional data, and other information.


    In the visual representation of Figure 1 there is a section in each block for
    “other information”. This other information is where product traceability data
    can be reposited.


    This illustration shows the basic concepts of blockchain technology. The blockchain
    works well to eliminate the need for a trusted third party for ensuring transactions.
    The blockchain concept can also be applied to supply chain transactions.


    Remember that supply chain transactions traditionally require a third party to
    facilitate the payments. This third party would normally be a bank. A bank would
    have a record of funds available. When a transaction comes through for funds to
    be paid to a supplier, a bank would process the transaction to the supplier. This
    process naturally would incur a fee that is paid to the bank for performing the
    transaction. It is these seemingly small transaction fees that add up to large
    amounts of money when hundreds, thousands, or tens of thousands of transactions
    are processed by companies.'
