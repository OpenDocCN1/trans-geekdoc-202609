- pgno: 203
  md: '# 2. Literature Review


    BC is attracting the attention of a wide range of sectors. This increased interest
    is that BT allows apps that previously relied on a trusted middleman to run without
    it. Nowadays, they could operate without a verification method and yet achieve
    the same degree of usefulness and dependability. This was not possible previous
    to the BC’s formation. Trustless networks arose as a result of the use of BT.
    This is possible since BC networks let users to share data without trusting other
    users [9].


    Due to the absence of intermediaries, user transactions rise at a quicker rate.
    Furthermore, the BC’s use of encryption assures that the data is safe [10]. BC
    is a massive accounting ledger that keeps track of all user transactions. As a
    result, Internet of Things (IoT) academics and developers are looking for solutions
    to connect IoT with BC.


    For enterprises that deal with the transfer of products between parties, the SC
    is nowadays a critical area. The problem with this sector is that it is so large
    that it can cause delays and defaults in products delivery, among other issues.
    Furthermore, huge distributors require a large number of employees to meet all
    of the expectations of merchants. Consequently, this could result in severe order
    processing delays and an increased risk of orders being lost [10].


    To meet this problem, businesses have automated all of their processes. As a result,
    the number of enterprises and distributors in the SC has increased significantly.
    Nevertheless, as the amount of digital data rises and Internet companies develop,
    so does the potential of cyber-attacks on their databases. Hackers may want to
    change, steal, or remove information [11].


    # 2.1 Related Literature on Supply Chain-based Energy

    Management


    Traditional SC transactions may be transformed into safer, legitimate, and digitally
    controlled and encrypted blocks with less chance of data tampering using BT. Manupati,
    et al. designed a “consortium BC” structure for a multi-echelon SC network. A
    consortium BC is a semi-private BC network administered by numerous SC actors
    who collaborate on a shared platform [12].


    Because all transaction data is safeguarded within the consortium framework, the
    entire environment is shielded from external dangers. Specialized smart contracts
    may be created to enforce the defined standards and codes of practice, making
    BCT easier to adopt in green SC'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'management (SCM). These smart contracts automatically evaluate new transactions
    against specified criteria, and all SC actors follow the smart contractual agreements
    [13].


    For example, smart contracts can include emission or other product quality determinate
    threshold limitations. If a transaction exceeds the limit, the smart contract
    will flag the transaction and alert the responsible parties. SC managers can quickly
    identify pain areas and change systems to address emissions and product quality
    concerns. As a result of BT, trust is transferred from human agents to computer
    codes and smart contracts for transaction verification [14].


    Researchers have begun to investigate the implications of BCT in the context of
    green SCM in recent years. Zhao et al. started the study on BCT applications in
    sustainable water management and addressed the problems and future research possibilities
    of BCT in sustainable SCs [15].


    The possible uses of BC in the energy market are vast. They might have a considerable
    influence on both procedures and platforms [16]. For example, BC can lower costs
    and enable new business models and marketplaces, better manage grid complexity,
    data security, and ownership, and involve prosumers in the energy market as a
    facilitator for developing energy communities by lowering costs and enabling new
    business models and marketplaces [17].


    BC can improve the energy market system’s transparency and trust, ensure responsibility
    while adhering to privacy regulations, improve direct peer-to-peer (P2P) ET to
    ensure the smooth operation of the electricity grid. Also, BC provides a framework
    for more effective utility billing procedures and transactive energy operations,
    as well as better handling demand response [18].


    BT could be applied to issue certificates of origin, such as the production of
    green energy and RE sources [19], to construct P2P energy transactions schemes
    [20], and to set up EM schemes for EV [21]. It is also worth noting that BC is
    seen as a decarbonization facilitator, allowing the energy sector to shift toward
    more decentralized energy sources [22].


    As the popularity of BC-related technologies grows, so does the demand for energy
