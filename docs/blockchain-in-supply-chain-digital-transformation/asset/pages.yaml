    # 4.2.2 Adopting through Blockchain Industry Consortium


    The adoption of Permissioned Blockchain through the Industry Consortium enables
    an organization to digitize its inter-organizational business processes through
    participating in one or more Blockchain Industry Consortium. Distributed Trust,
    in addition to the immutability and integrity of data in the record of transactions,
    is crucial in this model. It is because these participants, despite being pre-approved
    and jointly executing the consortium governance, are competitors with each other
    in the same industry, and therefore the level of trust is low.


    The implementation of Permissioned Blockchain in the form of Industry Consortium
    adopts the “peer-to-peer” model mentioned in Section 3.2. An example of an Industry
    Consortium model is referred to as a Contour. This consortium consists of 9 global
    banks aiming to digitize the Letter of Credit process using Permissioned Blockchain.12
    In international trade, a bank can in one instance issue Letters of Credit but
    in an other instance act as an endorsing bank for other transactions. It provides
    data to another bank in one transaction and receives data in another transaction.
    Therefore, it makes good sense for a peer-to-peer business model in the Industry
    Consortium. Another example is TradeLens which was set up by Maersk and joined
    by 4 other leading ocean carriers as a Blockchain Industry Consortium targeting
    the ocean transportation-based supply chain.13 The consortium serves a supply
    chain ecosystem consisting of ocean carriers, container terminals, inter-modal
    providers, container depots, and customs authorities. Likewise, a carrier in an
    ocean alliance provides data to another carrier in the same alliance on one shipment,
    it receives data on another shipment.'
