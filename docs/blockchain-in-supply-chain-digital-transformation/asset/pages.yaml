  md: '# 4.1 Individual-firm Adoption of Permissioned Blockchain


    Individual-firm adoption of Permissioned blockchain simplest model of adoption
    [22]. The way it works is for an organization to manage the ledger and operate
    all the Blockchain network nodes by itself. The organization is the trusted party
    of the ledger. One may argue that if individual-firm adoption model complies with
    the decentralized principle of Blockchain because the technology is decentralized
    but the control of the ledger is not [7]. Nevertheless, other characteristics
    of Permissioned Blockchain in terms of immutability and integrity of data in the
    record of transactions are what individual adopters see of high value to their
    business [9].


    Individual-firm adoption of Permissioned Blockchain as IOS is possible as long
    as the implementing organization has the cooperation and in many cases influence
    or control, of its trading partners. For instance, it may be a strategic buyer,
    supplier, or service provider to its trading partners. In this case, this is the
    “hub-and-spoke” model mentioned in Section 3.2.


    This model is relevant for supply chain digital transformation in two areas. The
    first one is in the order management process between buyer and seller. Permissioned
    Blockchain can be used by buyers or sellers to ensure product authenticity, to
    keep track of order fulfillment status, and eventually automate the change of
    product’s title by executing the smart contract. The second one is for the organization
    to facilitate the transactions across its trading partners with information supplemented
    by the logistics and financing service providers. For example, the organization
    may work with a warehouse operator and a logistics service provider. Goods are
    to be shipped in/out of the warehouse by the logistics service provider. Hence,
    the organization as a shipper must have accurate shipment status from the warehouse
    and the logistics service provider for inventory management. Permissioned Blockchain
    can be adopted for this purpose. The limitation of individual-firm adoption is
    the inability to extend the verification of transaction data beyond the direct
    trading partners in the blockchain network.


    # 4.2 Adoption through joining Blockchain Industry Consortium


    # 4.2.1 What is a Blockchain Industry Consortium


    A Blockchain Industry Consortium is a business model for industry players, particularly
    the market leaders in the industry, to get together for adopting an innovation
    collaboratively. An example is the consortium-based “industry exchanges” formulated
    in 2000–2001 to facilitate supply chain integration across trading partners [23].
    There were at least eighteen of them at one time in industries such as transportation,
    retail, automobile, electronics, healthcare, and others. Some are still existed
    today such as the'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'Global Healthcare Exchange, e2Open, Covisint (acquired by Opentext), Elemica,
    etc. Another type of consortium is to promote the adoption of technology standards
    across the industry. An example is RosettaNet which included a group of semi-conductor
    and hi-tech manufacturing companies to develop and promote a business-to-business
    standard called RosettaNet Implementation Framework (RNIF) aiming at replacing
    the use of Electronic Data Interchange (EDI) in their supply chain ecosystem [24].


    A key objective of forming a Blockchain Industry Consortium is for the participants
    to adopt Permissioned Blockchain collectively for minimizing costs & risks as
    well as reaching the critical mass in the industry quickly [25]. They may subsequently
    work on the standards of Blockchain Network integration for interoperability.
    Moreover, they have an additional role which is to share the ledger and control
    the governance of the Blockchain network in terms of the consensus mechanism and
    code changes. Furlonger and Kandaswamy (2019) defined Blockchain Consortium as


    > “A blockchain consortium is a group of companies joining forces to foster cooperation
    by sharing a ledger and by defining standards and a governance model to create
    a digital ecosystem to reduce operational risk, minimize costs or enhance customer
    service” [26].


    There are different categories of Blockchain Consortium which can broadly be divided
    into Technology-centric or Business/Industry-centric. Technology-centric Consortium
    has an interest in adopting the technology, sharing knowledge and best practices,
    promoting technology standards, as well as influencing the future development
    of the technology. For example, Hyperledger, Enterprise Ethereum Alliance, and
    R3 are examples of Technology-centric Consortiums.


    Business/Industry-centric Blockchain Consortium, or what we called Blockchain
    Industry Consortium, is formed by the industry players for adopting Permissioned
    Blockchain collaboratively. The objective of forming Blockchain Industry Consortium
    is to solve problems that impact the industry and can only be addressed at the
    industry’s level. Participants in the Blockchain Industry Consortium are from
    the industry ecosystem horizontally and vertically. Horizontal participants are
    providing similar products or services in the same industry, so literally, they
    are competitors. However, they are co-operating in the consortium for mutual benefits.
    This co-existence of both competition and co-operation inter-organizational relationship
    is defined as “co-opetition” [27]. Such “co-opetition” is unique in the Blockchain
    Industry Consortium. Whether the industry players can strike a good balance between
    co-operation and competition in the consortium has a profound impact on the success
    of the consortium.'
