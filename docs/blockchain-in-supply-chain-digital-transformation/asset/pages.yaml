    potentials for supply chain sustainability; its adoption triggers and barriers;
    and its role in supporting supply chain agility, trust, protection of intellectual
    property, and food/perishable supply chains’ [34, p.1].


    # 3. Methodology


    VOSviewer (https://www.vosviewer.com/) is a computer program developed by [35],
    and used primarily for building and viewing bibliographic maps. It has two key
    features that are useful to academics seeking to visualise relationships in bibliographic
    data—maps of authors or journals can be created based on co-citation data and/or
    maps of'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'keywords based on co-occurrence data [35]. Bibliometric networks have been
    extensively studied for decades within the field of bibliometrics. However, one
    area that has been neglected somewhat is that of methodology, i.e., the actual
    construction of bibliographic networks. The central problem with bibliographic
    construction of maps is the assignment of co-authored publications to individual
    authors [36]. The common approach is what is known as the full counting method
    where a publication has been co-authored by three researchers, for example, and
    each author has been assigned a weight of one. The key advantage of VOSviewer
    is the employment of what is known as fractional counting. This method applied
    to the preceding example would assign each author a fractional weight of 1/3.
    Thus, the total weighting of one is distributed across the individual co-authorship
    links equally. VOSviewer software works best when used to build bibliographic
    networks based on data obtained from Web of Science and Scopus [36]. This is the
    approach taken for this research as it is deemed a more accurate representation
    of the bibliographic networks. Web of Science is the oldest citation database
    in existence covering citation and bibliographic data beginning in 1900. Scopus
    covers a wider range of journals but is limited to articles published after 1995
    [37]. This does not pose an issue for this research as the oldest article emanating
    from the literature review is Satoshi Nakamotos’ article describing Bitcoin from
    2008. Furthermore, the overwhelming majority of articles found in this review
    are post 2018. VOSviewer offers three different types of visualisations; Network,
    Overlay and Density visualisations. A sample of each will now be presented based
    on the search string—“blockchain” AND “supply chain” AND “adoption”. This search
    string was chosen as it produced the largest result, thus making it the most appropriate
    example to visualise. This resulted in 307 records from Web of Science by searching
    all fields and 363 from Scopus by searching title, abstract and keywords. The
    different approaches were chosen to expand the Web of Science results and narrow
    the Scopus results. This was justified as the Scopus results for the all fields
    search resulted in a large quantity of irrelevant papers that did not address
    the chosen topics directly. The outcome of the descriptive and bibliometric analysis
    is presented below.


