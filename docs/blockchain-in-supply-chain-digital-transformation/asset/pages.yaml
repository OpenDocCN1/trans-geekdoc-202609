    # 3.6 The Impact of COVID-19


    The COVID-19 pandemic seriously impacted world trade, both operationally via border
    closures and quarantines, and financially through potential debt defaults and
    difficulties in receiving credit and insurance. A vicious circle began in which
    ever worsening company results made it ever harder for companies to be granted
    that credit and insurance. Many buyers and sellers were forced to find new trading
    partners, a task made even more difficult and risky by the restrictions on travel.
    With business processes in flux, new dangers arose from fraud.


    Interviews with we.trade banks, buyers, and sellers suggest that the digital transformation
    enabled by we.trade became even more valuable'
