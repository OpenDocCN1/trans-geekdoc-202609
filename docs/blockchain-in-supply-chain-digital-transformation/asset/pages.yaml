  md: '# 5


    # Investigating the Role of Permissioned Blockchains as Inter-Organizational Systems
    for Enabling Supply Chain Digital Transformation


    *Leo Yeung*


    # 1. Introduction


    Blockchain was first introduced in Satoshi Nakamoto’s white paper, “Bitcoin: A
    Peer-to-Peer Electronic Cash System” in 2008 [1]. While many people understood
    Blockchain as cryptocurrencies such as Bitcoin and Ethereum during the early stage
    of its development, the last few years have seen its adoption in business-to-business
    transactions. It slowly has become a digital technology that changes how business
    transactions are conducted between organizations and their trading partners with
    in trustless ecosystemst. However, some non-technology savvy executives do not
    fully understand blockchain technology. Hence, the adoption of Blockchain in business,
    including supply chain digital transformation, has been detrimentally impacted.'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'Blockchain can be categorized as being Permissionless (e.g., Bitcoin) and Permissioned.
    Permissioned Blockchain including Federated/ Consortium and Private Blockchain,
    can only be accessed by pre-approved participants. The sharing of transaction
    data is controlled among the participants. Therefore, it is suitable for mission-critical
    business transactions including those for supply chain digital transformation.
    Permissioned Blockchains are the latest generation of Inter-organizational Systems
    (IOS). It is equipped with the characteristics of IOS but evolved into a decentralized
    model without the need for a trusted intermediator.


    From an adoption perspective, it is important to understand the characteristics
    of Permissioned Blockchain, the business models which support its, as well as
    its industrial applications. Moreover, it is also crucial to understand what drives
    the adoption of Permissioned Blockchain technologies. This chapter aims to enhance
    understanding in this specific area.


    This chapter introduces Permissioned Blockchain as one of the two categories of
    Blockchain. Unlike Permissionless Blockchains which operate via a decentralized
    business-to-consumer or consumer-to-consumer model, Permissioned Blockchains are
    a decentralized business-to-business model which enables supply chain digital
    transformation. The next section of this chapter defines what Permissioned Blockchains
    are; explains how the concept differs from Permissionless Blockchains; and why
    it is important to differentiate Permissionless and Permissioned Blockchains.
    IOS are information systems used by organizations and their business partners
    for exchanging business transaction data and orchestrating business processes
    with each other. IOS is important for supply chain digitization because a supply
    chain ecosystem consists of lots of trading partners transacting supply chain
    data with each other. Blockchain on the one hand enables these transactions. On
    the other hand, it allows the ledger of the data to be kept in a decentralized
    model without relying on a trusted intermediator. Therefore, Permissioned Blockchain
    is considered the latest generation of IOS. The third section of this chapter
    explains what IOS is; why Permissioned Blockchains are the latest generation of
    IOS; and how it is adopted for supply chain digital transformation. Permissioned
    Blockchain is viewed as the new generation of IOS and its success depends on an
    organizations’ willingness and ability to adopt. It is therefore important to
    understand Permissioned Blockchain from an adoption perspective. Section 4 introduces
    two specific Permissioned Blockchain adoption models. The first one focuses on
    individual-firm adoption and the second one focuses on adoption through a Blockchain
    Industry Consortium model. Section 5 lists the determinants of Permissioned Blockchain
    adoption. Six factors are identified and categorized into the Technological, Organizational,
    Inter-organizational, and Environmental'
