    # 1. Introduction


    Food safety is a major area of concern for all countries and its regulation is
    beneficial to international trade [37]. With the globalization of trade, food
    supply chains have become more diverse and complex, necessitating tighter food
    safety regulatory frameworks [5]. Countries’ regulators are often brought into
    action when food safety incidents occur which then leads to stricter regulations
    [8,45]. The Chinese government has gradually strengthened its legal provision
    with respect to food import over the past seventy years (see Appendix A). In recent
    years, the implementation of a more stringent regulatory framework was influenced
    by both domestic incidents [35], and the internationalisation of regulation [9].
    Moving from a food hygiene to food safety regulation environment, the central
