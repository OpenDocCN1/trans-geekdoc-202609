  md: 'evolution of living standards enables a larger part of the population to purchase
    such imported food products that become part of higher-class consumption habits
    [15]. All of this contributes to make China one of the world’s largest food importers
    [9]. Therefore, it is important to analyse how the food safety regulation impacts
    food imports in China.


    # 2.3 Impact on Food Import in China


    Over the last decade, the Chinese government has deployed some highly deterrent
    measures to reduce the risk of food incidents to consumers. This tighter regulation
    applies also to the import of foreign food products. In March 2021, the U.S. Department
    of Agriculture published a report on “China’s Refusals of Food Imports” [15].
    It appears that, even though the food imports’ average rate of refusal by Chinese
    authorities was only 1 percent over the period from 2006 to 2019, compliance with
    the current regulatory system remains challenging. Although limited in percentage,
    the refusal decisions affect thousands of shipments.


    The latest regulation reform focused on improving product traceability supported
    by labelling and country of origin certification requirements for imported food
    [26]. Documentation, record-keeping, and tracking are also among the requirements
    imposed on imported foods and represent a significant reason for lack of compliance
    or violation of the regulation that leads to import refusal [15]. Food exporters
    to China need support to ease the regulation compliance burden and applying blockchain
    could provide a solution.


    # 3. Blockchain-Based Food Safety Compliance System


    # 3.1 Blockchain Technology as a Regulatory Technology


    Following Beck, Avital, Rossi and Thatcher [4], blockchain technology’s key features
    are a cryptographically secured distributed ledger and a consensus mechanism that
    rules the transaction validation process. The ledger records chronologically the
    consensually validated transactions and is securely distributed to all blockchain
    participants [36]. As a ledger’s data are accessible by all participants, the
    system is transparent [19]. In addition, data are protected by cryptography and
    thus are immutable which makes their records trustworthy [3]. In substance, the
    blockchain system delivers trustworthy and verifiable records directly to participants
    without the involvement of any third party trusted entities [11].


    RegTech was originally designed to simplify and facilitate companies’ compliance
    with regulations, in particular in the aftermath of the 2008 global financial
    crisis [1]. RegTech is defined by De Filippi and Hassan [12, p.15] as “technology
    that can be used both to define and incorporate legal or contractual provisions
    into code, and to enforce them irrespective'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'of whether or not there subsists an underlying legal rule”. More recently,
    RegTech has been integrated into a reconceptualised regulatory regime with the
    purpose of providing a higher level of service. This application is driven by
    governmental institutions such as the Bank of England that recently tested the
    use of new digital technologies (distributed ledger technology, artificial intelligence,
    and machine learning) to facilitate compliance by making regulations clearer and
    providing regulators with real time information [31]. To date, most RegTech applications
    of blockchain have been made in the financial sector [17,34]. In this chapter,
    we consider the potential application of a RegTech system based on blockchain
    technology that facilitates food safety enforcement.


    # 3.2 Applications of Blockchain for Food Safety


    Food safety is a public health concern and the prerogative of the governments
    that act as regulators. Rules and regulations must be complied with by all actors
    aiming at selling, importing, or exporting products in a particular territory.
    In this chapter, we look specifically at the food safety enforcement for foreign
    exporters aiming at exporting goods to China.


    Blockchain is seen as a promising technology whose properties can bring transparency
    and enhance efficiency in a business environment [25]. In particular, blockchain
    technology creates a trusting environment among supply chain participants that
    facilitates information sharing, avoids reconciliations and therefore enhances
    process efficiency [27]. The trust in the ledger replaces the need for intermediaries.
    Blockchain works as a solution to enable transparent tracking of information throughout
    an economically, socially, and environmentally complex supply chain environment
    [38,44].


    Based on these key properties, some researchers describe blockchain as a recordkeeping
    technology [28]. This aspect is instrumental in the use of blockchain for provenance.
    The data immutability not only provides a tamper-proof record of archived information,
    but also a trace of who validated the record and when it was done. This is particularly
    important for record authenticity, which is instrumental in regulation compliance.
    For example, information about provenance, certification of origin and quality
    labels are required by the Chinese authorities for imported food. By providing
    a transparent and immutable record, blockchain can facilitate inspections [14].
    Blockchain can also increase trust in food safety by providing transparency and
    reducing the severity of security issues [37]. In summary, the technology can
    support food safety from “farm to table” [42]. Nevertheless, the actual use of
    blockchain for facilitating product safety enforcement also depends on the current
    blockchain environment in China.'
