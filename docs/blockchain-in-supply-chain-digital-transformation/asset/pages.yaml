    # 4. Results


    In the context of Case A’s blockchain supply chain, Table 5 summarizes the later
    innovation assimilation stage framework elements of acceptance, routinization,
    and infusion. We have extended the infusion stage to include two further dimensions
    based on the analysis of the data: diffused use


    Table 5. The assimilation stages of blockchain supply chain adoption.


    | Assimilation stages | Supply chain adoption assimilation |

    |---|---|

    | Acceptance | A commitment to using blockchain technology was made in 2016 as
    a black-box technology or in some bespoke manner |

    | Routinization | A proof-of-concept project in 2016 paved the way for a full
    roll out of Case A’s node infrastructural outsourcing project. Following the roll
    out of blockchain training workshops and educational initiatives this strategy
    was embraced by all of Case A’s supply chain stakeholders. |

    | Infusion | Blockchain technology was not only used routinely but was also used
    in a comprehensive and sophisticated manner, which is highlighted by the following
    aspects:

    - **Extended use:** Case A’s initial use case was providing node infrastructure
    for customers. Their strategy extended to DeFi products and services such as staking
    and yield management services.

    - **Integrative use:** Case A created a nuanced data analytics platform which
    not only enabled customers to get real-time data insights from their blockchain
    supply chain processes but also enabled Case A to analyze their supply chain stakeholder’s
    data to provide better services.

    - **Emergent use:** As blockchain technology matured the company started providing
    DeFi services which were not in their original strategic scope.

    - **Diffused use:** As Case A’s supply chain stakeholders’ numbers started to
    increase so too did its customer requirements from educational and tailored data
    insights perspectives. Consequently, the company started to implement additional
    features to their data analytics platform. They also started to cater for individual
    enterprise customer bespoke blockchain technology requirements.

    - **Entrenched use:** Case A’s use of blockchain node infrastructural technology
    is embedded deep into the core functionalities of the organization. |'
