  md: '+   - Enhanced produced verification and authentication

    +   - Business process improvements and cost reductions


    # 4.3 Assessing the Supply Chain


    Creating a vision for the supply chain provides a company with reference points
    for the transformation process and is informed by a comprehensive assessment of
    the supply chain’s business and technical requirements and current capabilities.
    As blockchain gains momentum, companies should keep observing the players in their
    industry who have begun experimenting with blockchain. Blockchain benefits greatly
    from network effect; once a critical mass gathers in a supply chain, it is easier
    for others to jump on board and achieve the benefits. Companies could pay attention
    to other stakeholders in their supply chain and competitors for indication of
    timing to develop a blockchain prototype. In assessing supply chain suitability,
    it must be remembered that supply chains contain complex networks of suppliers,
    manufacturers, distributors, retailers, auditors, and consumers. A blockchain’s
    shared IT infrastructure would streamline workflows for all parties, no matter
    the size of the business network. Additionally, a shared infrastructure would
    provide auditors with greater visibility into participants’ activities along the
    value chain. The main benefit of blockchain technology in supply chains for many
    organisations is the trust that’s embedded in the system. In life-critical industries
    this can be a game changer. Blockchain has the potential to drive cost-saving
    efficiencies and to enhance the consumer experience through traceability, transparency,
    and tradability.


    # 4.4 Horizontal or Vertical Supply Chain Actors


    Each company’s transformation approach will need to reflect its circumstances,
    difficulties, opportunities, and goals. Decisions must be made on access rights
    to private blockchains, e.g., most businesses use both horizontal and vertical
    integration, choosing the one that is most appropriate for them at set times.
    Whether to include and/or incorporate suppliers and distributers and to what level
    are all internal decisions that need to be made by the project champion.


    # 4.5 How Supply-Chain Capabilities and Technologies have Evolved


    The low rate of supply-chain digitization has much to do with the capabilities
    of the technologies that companies have had available until recently. Supply-chain
    management was one of the first business functions to undergo substantial technology
    upgrades, as developers'
