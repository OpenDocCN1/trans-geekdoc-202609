  md: '# 2. Background


    # 2.1 Trade Finance


    It is estimated that up to 80%, or approximately USD 16 trillion, of merchandise
    trade, depends upon trade finance in some form [1]. Buyers and sellers may use
    a wide range of instruments and terms to facilitate trade, including loans, guarantees,
    and the factoring or financing of receivables and inventories. They may engage
    various intermediaries such as banks, financial institutions and service providers
    to do so [1].


    Trade can typically be categorized as being either documentary (via letters of
    credit), or open account (payment after delivery), in nature. Although the letter
    of credit instrument provides greater control over the process, these are costly
    and time consuming to execute. For this reason, open account trade has been growing
    at a faster rate worldwide [1]. However, the use of open account trade makes more
    challenging the optimization of cash flow and the mitigation of the risk of payment
    not being received and strains the resources of small-and-medium-sized enterprises
    (SMEs) in particular. Combined with the lack of visibility and the possibility
    of fraud due to paper-based processes, and the varying degrees of trust present
    between trading partners, there is a great need for reliable trade and trade finance
    processes.


    Gaining access to trade finance can be a major issue at any time for SMEs, with
    approximately 65 million SMEs being credit constrained and rejection rates for
    credit applications running at 40% [2]. In times of international crisis, such
    as the COVID-19 pandemic, the need for trade finance can become critical. Due
    to the greater perceived risks, the availability of credit is reduced while the
    cost of credit increases. In particular, less open account credit is forthcoming
    from trading partners and less financing available from financial intermediaries
    [3], while the necessary trade credit insurance coverage becomes more expensive
    and more difficult to secure [4].


    # 2.2 Blockchain in a Business Context


    Blockchain technology is comprised of several unique components, and the most
    important of these from a business perspective maybe its decentralized design,
    the enhanced security it provides, and the ‘smart contracts’ that it enables.
    Blockchain allows transactions to be submitted and validated by appointed nodes
    across a distributed database and network. New data is appended to previous data
    such that the chain of data is practically immutable (that is, any attempted tampering
    would be detected), and all data is secured via encryption [5,6]. Smart contracts'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'can automate the processing of transactions upon being triggered by predefined
    criteria.


    The vast majority of business blockchains are permissioned (that is, private)
    in nature. In this design, an authority representing the group or consortium which
    operates the blockchain will control which entities can join, transact, and endorse
    (that is, validate) transactions on the blockchain. Typically, this will include
    digital management of the identity of the members, and off-blockchain contracts
    detailing rights and responsibilities. This is very different from those permissionless
    (that is, public) blockchains such as Bitcoin, where is no central controlling
    body and where the network manages itself independently. While the nodes allowed
    to submit transactions and those responsible for endorsing transactions on a permissioned
    blockchain are appointed by the controlling authority, on a permissionless blockchain
    any node can submit transactions and any node can endorse the transaction if it
    ‘wins’ the right to do so (for example, by ‘mining’ on Bitcoin).


    # 2.3 Business Networks as Digital Platforms


    A digital platform can be thought of as a two-sided or multi-sided market which
    electronically connects buyers and sellers and intermediaries within a network
    [7]. As the number of buyers and sellers on the platform increases, the ecosystem
    grows in usefulness and value for its members. This is the network effect [8],
    which represents a virtuous circle of ever-extending mutual benefits for members
    [9].


    Digitization enables processes to be performed independent of location, removes
    the need for the holding of physical assets, and allows the creation of a powerful
    platform ecosystem within which supplementary service providers can participate
    and add value [10,11]. Digital platforms can therefore provide a structure through
    which participants can seek to optimize their inter-organizational connections.


    With the relational view of Dyer and Singh [12] this can be taken further. The
    relational view—rather than focus on industry forces [13], or on firm-specific
    factors [14,15]—extends the area of analysis into the business networks within
    which the organization participates, and suggests that optimizing their inter-organizational
    processes can represent a method by which organizations can generate competitive
    advantages.


    # 2.4 Blockchain Enabled Digital Platforms


    How can a blockchain enabled digital platform achieve the objective of optimizing
    inter-organizational processes and generating competitive'
