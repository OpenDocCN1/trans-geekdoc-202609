    businessmen, requesting the Chinese government to establish a consulate in Philippine
    (Wickberg 1965). Compared to the interests of Chinese businessmen in the Philippines
    the Chinese government was more concerned about the funding for establishing a
    consulate. The newly appointed ambassador to the United States, Spanish, and Peru,
    Zhang Yinhuan (张荫桓), met with representatives of the Philippine Chinese Charitable
    Association Inc. in Hong Kong. He felt that they never forget their longing for
