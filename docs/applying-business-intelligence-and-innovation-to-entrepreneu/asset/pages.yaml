  md: 'cultural background, derived from the wudhu (ablution) ritual mentioned in
    the Quran and the use of a steam room for baths by the Turkish, called the Turkish
    hammam. Therefore, Islamic hammams were generally built adjacent to the mosque
    in the medieval period. The Islamic hammam was also evolving as a gathering place
    for religious scholars, travellers, former detainees, and sick people hoping to
    recover from their illnesses; they came to perform ritual cleansing and to get
    closer to Allah ﷺ. Hammam is the embryo of spas these days. (Aaland, 1978).


    Hammam had such complex sanitation and drainage, completed with fresh water supplies
    (even though it was more comprehensive than the famous Roman public baths), contributing
    to public health (Pormann & Savage-Smith, 2007). The staff of the public baths
