    # DISCUSSION AND CONCLUSION


    Initial analysis of this study shows that transformational Leadership is not significant,
    and transactional leadership style is partially significant in sustainability.
    Even if the studies have shown that transformational and transactional leadership
    approaches positively impact the environmental aspects of firms (Changar & Atan,
    2021; Tanveer et al., 2021), our results differ from the literature.


    According to a study conducted by Kafetzopoulos and Gotzamani in 2022, there is
    a significant correlation between transactional leadership and sustainable organizational
    performance. While the study does not specify the exact environmental factors
    involved, it suggests that transactional leadership can have a positive effect
    on sustainability outcomes. In contrast, leaders who focus on environmental transformation
    can indirectly influence their organizations, as noted by Robertson and Carleton
    in 2018. Moreover, one study found that the degree of influence of transformational
    leadership on employees’ sustainable performance depends on organizational members’
    citizenship behavior. This research supports this study’s results that in the
    textile sector in Turkey, transformational leaders have a harmonious passion for
    the environment; however, influencing employees’ voluntary pro-environmental behavior
    could not be changed easily.


