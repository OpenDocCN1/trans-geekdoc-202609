- pgno: 156
  md: 'Popovic highlight the critical role of organizational and managerial requirements
    in the success of adopting business intelligence.(Skyrius, 2021, p. 213)


    Celina Olszak suggests that analyzing and discussing the concept of business intelligence
    should be done from two fundamental perspectives: the technical perspective and
    the managerial perspective. The technical view, being the older of the two, considers
    business intelligence as an integrated set of tools, technologies, and software
    used to collect heterogeneous data from various sources, integrating, analyzing,
    and sharing it. The managerial view focuses on the crucial importance of information
    and knowledge as strategic resources for enterprise management. Data analysis
    not only allows for faster decision-making but also contributes to discovering
    valuable opportunities for future business success and sustaining profit achievement.
    (Olszak, 2020, pp. 38, 39) Sharda, Delen, and Turban argue that before adopting
    and designing a business intelligence system for the enterprise, top management
    should consider it as a tool that will fundamentally change the entire management
    approach. The reasons for investing in business intelligence should align with
    the enterprise’s strategy. It should be considered a means to improve the efficiency
    and effectiveness of operations and activities. Planning for adoption is essential,
    involving the identification of organizational skills available to achieve business
    intelligence goals and a pre-assessment of the prevailing organizational culture’s
    willingness to undergo appropriate changes. Integration between the business intelligence
    system and the enterprise’s adopted information technology systems is also essential.
    (Sharda, Delen, & Turban, 2018, p. 20)


    In fact, most executive managers link their decisions to allocate a budget for
    investing in business intelligence to the economic return expected over a specific
    time period following the adoption process. This economic return is strongly related
    to business processes that will improve their performance, known implicitly as
    Business Intelligence Opportunities (BIOS). BIOS are systematic approaches to
    identify optimal ways to use business intelligence to increase revenue, reduce
    costs, or both. These economic justifications depend on the business processes
    practiced and provide the economic basis for how a business intelligence system
    can create value for the enterprise. For example, the total investment amount,
    the time required to reach the break-even point, the nature and amount of risk
    associated with this investment, and the most critical factor, the factors and
    requirements for success and the extent to which the enterprise’s management can
    fulfill them. (Williams, 2016, pp. 69, 70)


    In the past, simultaneous with the emergence and initial use of business intelligence,
    it was believed that the top management’s support for the idea of the enterprise
    adopting business intelligence systems was almost the only condition for the success
    of this initiative. However, successive radical transformations in the working
    environment of enterprises have imposed the inevitability of adopting'
