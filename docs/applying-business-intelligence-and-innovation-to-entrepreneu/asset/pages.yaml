  md: '# About the Contributors


    **Kannapat Kankaew** is currently an Assistant Professor at Burapha University
    International College. He received Doctor of Public Administration majoring in
    Human Resources Management. Before his 12 years as an academic professional, he
    worked in the aviation industry for over 10 years. He has published and participated
    in International Conferences reputed journals. He also published chapters in edited
    books, being a books editor, and examiner for Ph.D. and Master students in both
    national and international institutions. And he was dedicated as an editorial
    board, associate editor, and reviewer for various domestic and international journals.


    **Parinya Nakpathom** is Dean of Burapha University International College and
    Instructor of Holistic Health and Wellness Management. He earned Bachelor’s Degree
    in Arts (Thai) from Burapha University in 2005, followed by a Master’s Degree
    in International Hospitality and Hotel Management from the University of Western
    Sydney, Australia in 2008. In 2018, He has completed his Doctoral Degree in Management
    from Silpakorn University, Thailand. Since 2012, he has been contributing to academia
    as a lecturer at Burapha University International College. In 2021, he was appointed
    as an assistant Professor in Business Administration. His research interests encompass
    Tourist, Hospitality, Service, and Tourist attraction. Over the years, he has
    had the privilege of being a guest speaker more than 100 times in public organizations,
    private companies, and universities, both in Thailand and abroad.


    **Krittipat Pitchayadejanant** is a lecturer in Logistics Management, Burapha
    University International College. His research interests are in business data
    analysis, especially advanced statistical analysis applied to hospitality and
    tourism, logistics management, and marketing. He teaches in Operational Research
    in Logistics management, Multivariate Analysis and Business Data Analysis.'
