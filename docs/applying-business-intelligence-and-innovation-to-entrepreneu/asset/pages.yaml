- pgno: 296
  md: '# INTRODUCTION


    The rapid development of health tourism has been seen to have created a “health
    and prevention boom era” predicted to be a “new economic power” (Sigrist, 2006).
    Health tourism has become one of the fastest growing industries in the world,
    despite the desire to improve the quality of life, health, as well as healing
    and relaxation, which has been the primary motivation of tourists since long ago
    (Kim et al., 2015). Health tourism combines two things, namely health and tourism,
    and the involvement of these two things makes health tourism a promising tourism
    niche. On the other hand, Muslim medical tourism is generally done by people who
    are sick and need treatment to regain their health (curative) (Smith & Puczkó,
    2014). Medical care is available in health tourism, such as surgery or other specialist
    interventions, while wellness tourism provides pilgrimages, meditation, spas,
    and others (Smith & Puczkó, 2017).


    Increased public awareness of the health aspects is responsibly responded to by
    the increasingly diverse commoditisation of medicines, medicals, and treatments
    worldwide, forming a “false trap” for those who worry excessively about their
    health. The negative impact of this is the emergence of massive exploration of
    businesspersons over the naturally unlimited human desire for health. This desire
    must be encouraged to change into a necessity, not essential, artificial, and
    even pragmatic.


    Take an example of the high obsession with cosmetic surgery. The merely profit-oriented
    advertisements put by beauty clinics and surgical hospitals have made patients
    from the country and abroad take long trips to reconstruct their faces and bodies
    in the clinics. This has turned into the psychosocial disease of society where
    people become preoccupied with what they perceive as defects in their body or
    face or even when the physical anomalies are only slightly; the fears become real
    and exaggerated and encourage a solid need to perform cosmetic surgery constantly
    with the never-ending search for satisfaction. This psychological disorder is
    called Body Dysmorphic Disorder, and even cosmetic surgery has become a social
    and cultural phenomenon (Kim, 2009; Heyes, 2009).


    Then, it is pretty often that patients also end up with various controversial,
    circumvention, and illegal treatments that disregard morality and even religious
    beliefs. A variety of other treatment methods evidences this as a trend in the
    world, like “vampire facelift,” “sex change tourism,” “sex tourism,” “suicide
    tourism,” “nude tourism,” “abortion tourism,” “vasectomy and tubectomy,” “transplant
    tourism,” “fertility tourism,” “surrogacy tourism,” and so forth which use human
    organs and blood and hazardous chemicals for aesthetic and medical businesses.


    Correspondingly, Cohen (1998) asserts that mass tourism hurts the religiosity
    or level of spirituality of people who live in tourist destinations and events
    for tourists it-self; the impact is increasing secularisation, weakening compliance
    toward religion'
  merge: -1
  img_proc: true
