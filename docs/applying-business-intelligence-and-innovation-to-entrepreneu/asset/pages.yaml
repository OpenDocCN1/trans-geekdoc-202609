- pgno: 278
  md: 'Association. The British government is also actively negotiating with other
    private chambers of commerce in its home state to ensure the maximization of ‘public
    interest’. On the contrary, China is not only unable to safeguard the basic sovereignty
    interests of the state on its territory but also unable to safeguard the interests
    of Chinese businessmen in Southeast Asia. For example, the Philippine Chinese
    Charitable Association Inc., a Chinese business association in the Philippines,
    actively sought help from the Chinese government in the face of the Spanish-American
    War, hoping to gain national support, but still had to rely on its own self-supporting.


    Why did Chinese and British private business groups receive different feedback
    from the state on similar interest demands at the same time? Why is there such
    a huge difference in the attitude of the Chinese government and the British government
    towards domestic business groups? This article will use this as the starting point
    for discussion.


    # RESEARCH HYPOTHESIS & THEORY


    Throughout the international environment of the 19th century, whether it was the
    British Chamber of Commerce in China or the commercial activities of Chinese businessmen
    in Southeast Asia, they were all spontaneous commercial organizations among the
    people. They are a part of society exercising civil rights, and they are also
    pioneers of the state’s interests overseas. To explain the relationship between
    the interaction between the state and society and “private business organizations”,
    this article will be revised based on Habermas’ theory of the “public sphere”
    as the framework. Habermas believes that the Public sphere is such a platform.
    A part of the public sphere consists of various dialogues. Every dialogue between
    actors promotes their aggregation into a public group, and at this point, a portion
    of the Public sphere is formed.


    When actors (including the state) engage in dialogue and interaction regarding
    their interests, issues related to private interests become public issues, resulting
    in an interactive field that affects the relationships and cognition between actors.
    The public sphere is a field of mediation between the state and society, in which
    the state and society will engage in a game of “publicity” and “public principles”
    to reach a consensus (Habermas 1999). Although Habermas well explains the process
    of the game between the state and society, his insufficient explanation is that
    if there is an interactive platform between the state and society, there should
    be no (too many) contradictions in the interaction between the state and society.
    However, the fact is that some countries do not have a “public sphere” in their
    interaction with society; Some countries and societies may have a ‘public sphere’,
    but this may not necessarily have a ‘consensus’.'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'Regarding the relationship between the “public sphere” and “consensus”, Habermas
    well explains the formation of consensus between the state and society. A ‘consensus’
    will be formed, which represents the’ trust ’relationship between the state and
    society. Consensus, as a state of mutual trust, can help civil society trust the
    behavior of the central government representing the state, Cancelling obstacles
    in governing society. At the same time, the ‘Public sphere’ is also a type of
    ‘rites of institution’. The “recognition ceremony” is a way of reproducing social
    rules to achieve the effect of the state’s authority over social construction.
    The “recognition ceremony” not only occurs in various units authorized by the
    state (such as schools) but also in the feedback of society on the legitimacy
    of the state (central government). (For example, regular elections held in democratic
    countries are a recognition ceremony aimed at reproducing the legitimacy of the
    state.) Therefore, we can say that the “public sphere” is crucial for the interaction
    between society and the state (Bourdieu, 2023a; 2023b).


    The significance of the “public sphere” also illustrates the logic of interaction
    between the state and society. Although the state has absolute control over society,
    society follows two patterns of feedback towards the state. One is ‘Conformism
    logic ’; Logical obedience “means that society and the state form a common logical
    category, thereby achieving mutual spiritual identity. In short, society’s rule
    over the state is a “trust” attitude. The second type is “moral obedience”: “moral
    obedience” refers to ethical participation in a shared domain of shared value.
    In other words, society’s rule over the state is a ‘submissive’ attitude. Ethical
    value sharing means that society follows the norms set by the state (Bourdieu,
    2023a).


    From the above examination of the relationship between “consensus” and “public
    sphere”, we can observe that in modern countries, society always relies on the
    recognition of its rights by the state. Therefore, we will use the variables of
    “Public sphere” and “social dependence on the state” to explore the causal mechanism
    of the interaction between the state and society.


    **Assumption 1:** When a state’s Public sphere exists and society has a high degree
    of dependence on the state (obedience and trust coexist), it indicates a positive
    interaction between the state and society. In this situation, the state will support
    society and develop colonial organizations.


    **Assumption 2:** When a state’s Public sphere exists, and the degree of social
    dependence on the state is low (obedience and trust only exist on one side). It
    indicates that the state and society have only reached a partial consensus, but
    adhere to the principle of mutual interaction.


    **Assumption 3:** When a state’s public sphere does not exist, but the degree
    of social dependence on the state is high (obedience and trust coexist), it indicates
    that the state directly governs society, but the society lacks autonomy.'
