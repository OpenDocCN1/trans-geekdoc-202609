  md: 'government supported the demands of the Shanghai branch and promoted the issue
    of Canceling likin into the negotiation of the Renewed Treaty of Commerce and
    Navigation between Britain and China.


    In terms of diplomacy, the Shanghai Branch of the China Association required that
    tariff increases must be based on Cancellation. To obtain the Boxer Indemnity
    (庚子赔款) as soon as possible, Germany, Russia, France, and other countries proposed
    increasing import tariffs on China to 10% (Liu & Liu 1984). This move would increase
    the cost of the Shanghai Branch’s trade with China. After learning about it, the
    Shanghai branch called the London headquarters of the Chinese Association to oppose
    any tariff increase without any return (Dudgeon 1902b). If commercial benefits
    such as canceling likin could be transferred, the Shanghai branch was willing
    to bear the burden of tariff increases. It was difficult for individual units
    to obtain public power. But when many individual units acted together, it was
    possible to compete with public actors. The Shanghai branch, through the London
    headquarters of the China Association, liaised with many British chambers of commerce
    engaged in trade with China to jointly exert pressure on the British government
    to influence government decision-making. The Chinese Association had extensively
    sought support from the Bristol Chamber of Commerce, Leeds Chamber of Commerce,
    and Liverpool Chamber of Commerce for the proposal of Canceling likin and increasing
    tariffs (Spear 1901; Calvert 1901; Barker 1901). Under pressure from the British
    business communities, the British government representative stated at the negotiation
    of the Boxer Protocol that if the tariff was raised to more than 10%, the Chinese
    government should cancel likin and give other commercial concessions (Wang 1985).
    The issue which support by the British government for the Shanghai branch had
    also been recognized by the major powers. But at this moment, the focus of the
    negotiation was the aftermath of the Boxer Rebellion(义和团运动). The issue of canceling
    likin and increasing tariffs was scheduled to be carried out in the negotiation
    of the Renewed Treaty of Commerce and Navigation with China.


