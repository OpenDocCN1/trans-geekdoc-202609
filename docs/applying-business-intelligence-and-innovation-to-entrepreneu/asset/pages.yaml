    As an inevitable result of the radical changes that have affected the working
    environment of organizations, mentioned at the beginning of this chapter, organizational
    structures have shifted from hierarchical functional structures, which rely on
    precise work division, detailed specialization, and vertical organization as fundamental
    principles, to horizontal structures. These structures are centered around processes
    as their primary mode of operation. One of the main reasons for this transformation
    is an attempt to create greater value for consumers. Initially, organizations
    tried to improve the quality of their products and achieve faster responsiveness
    to market demands. They built an administrative and organizational model for their
    activities, illustrated in Figure (5).


    In reality, organizations adopted this structure in the form of a cross-functional
    process due to the problems and drawbacks experienced by functional organizational
    structures. These drawbacks included slow responsiveness to market requirements,
    low levels of product and service quality, and cost inflation. The organization’s
    management attempted to improve internal coordination between multiple departmental
    and functional activities that contribute to the same process. For example, Figure
    (5) illustrates the innovation and product development process. Initially, individuals
    responsible for consumer and market studies identify consumer


