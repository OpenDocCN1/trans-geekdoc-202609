    # Chapter 1

    The Systematic Literature Review on Business Intelligence Towards

    Entrepreneurial Orientation of Ventures ................................... 1


    +   Jinumoni Nazir, Sikkim University, India

    +   Pradip Kumar Das, Sikkim University, India


    Business intelligence has been a recent information tool which was introduced
    in the entrepreneurship world. The present study is an extensive systematic literature
    review based on PRISMA framework which aims to explore the influence of business
    intelligence (BI) on the entrepreneurial orientation (EO) among the ventures.
    Four journal databases have been used, namely Emerald, JStor, ScienceDirect, and
    EBSCOhost to gather the articles for the study. “Business intelligence” and “Entrepreneurial
    orientation” were the keywords used to identify studies from the journal databases.
    23 articles were finalised for the study after going through the identification,
    screening and included process which comes under the PRISMA (preferred reporting
    items for systematic reviews and meta-analyses) framework. It has been found that
    very little research has been done in this field. So, this systematic literature
    review will give an insight into the possible gaps that can be covered by the
    upcoming researchers in this field.


    # Chapter 2

    Role of Technology Business Incubator in Enhancing Entrepreneurship

    Ecosystem .................................... 21


    +   Satya Ranjan Acharya, Entrepreneurship Development Institute of

    +   India, India

    +   Yamini Chandra, Entrepreneurship Development Institute of India, India


    This chapter examines the role of technology business incubators (TBIs) in improving'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'the effectiveness, viability, and overall development of startups. The chapter
    attempts to establish a connection between the support offered by these TBIs and
    its effects on the overall operational effectiveness of these startups by referring
    to various available relevant literature. Further, the chapter investigates the
    assistance offered by these TBIs as well as the challenges encountered throughout
    the process from the ideation and commercialization of funded ideas. Through the
    empirical analysis of Gujarat''s entrepreneurial ecosystem, a comprehensive framework
    is given that can be used to improve the existing support system.


    # Chapter 3


    # Blockchain and Entrepreneurship ............................ 35


    +   - Kande Archana, Malla Reddy College of Engineering, India

    +   - Aarti Gloth, Malla Reddy College of Engineering, India


    Blockchain technology has emerged as a disruptive force with the potential to
    reshape entrepreneurship and business ventures across various industries. Its
    decentralized, immutable ledger system offers a foundation for innovative solutions,
    fostering transparency, security, and efficiency. Entrepreneurs are harnessing
    blockchain for a myriad of applications, from supply chain management to tokenized
    assets and decentralized finance (DeFi). This chapter delves into the symbiotic
    relationship between blockchain and entrepreneurship, exploring the transformative
    role of blockchain in startups, raising capital through initial coin offerings
    (ICOs), and streamlining processes through smart contracts. As this decentralized
    ledger technology continues to evolve, entrepreneurs face not only opportunities
    for innovation but also regulatory and scalability challenges. A comprehensive
    understanding of blockchain''s impact on entrepreneurship is crucial for navigating
    this evolving landscape, fostering new business models, and realizing the full
    potential of blockchain technology.


    # Chapter 4


    # Introduction to Operation and Supply Chain Management for Entrepreneurship 52


    +   - Ali Said Jaboor, Dhofar University, Oman

    +   - Ali Mohsin Ba Awain, University of Technology and Applied Science, Oman

    +   - Khairul Anuar Mohd Ali, National University of Malaysia, Malaysia

    +   - Al Montaser Mohammed, Zarqa University, Jordan


    This chapter explores the main objectives of supply chain management and operations
    management, highlighting their importance for the success and endurance of entrepreneurial
    ventures. It delves into how good management of these areas may increase competitiveness,
    achieve efficiency and cost-effectiveness, and guarantee customer satisfaction.
    The importance of operations and supply chain management in fostering business
    growth and sustainability is emphasized. Addedly, the chapter'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'highlights upcoming trends and changing problems, pushing entrepreneurs to
    adopt best practices and methods to manage their supply chains and operations
    for long-term success.


    # Chapter 5

    Neuromarketing as a Digital Marketing Strategy to Unravel the Evolution of Marketing
    Communication ...........81

    *Kavindu Millagala, Australian Management School, Sri Lanka*

    *Nandana Gunasinghe, Rajarata University of Sri Lanka, Sri Lanka*


    This chapter examines the pivotal role of neuromarketing as a digital marketing
    strategy in deciphering the dynamic evolution of marketing communication. Rooted
    in neuroscience and psychology, neuromarketing employs advanced neuroscientific
    tools to unveil subconscious consumer responses. In the context of the digital
    revolution, this chapter elucidates how neuromarketing seamlessly integrates with
    evolving marketing communication channels, emphasizing personalization and emotional
    engagement. The authors explore the significance of personalized content in cultivating
    consumer trust and loyalty and discuss the emergence of neuroanalytics as a metric
    for evaluating campaign success in the digital sphere. Ethical considerations
    surrounding the responsible use of neurodata are addressed, highlighting the need
    for industry guidelines. This chapter posits neuromarketing as a transformative
    force, guiding businesses toward a nuanced understanding of consumer behaviour
    in the ever-changing landscape of digital marketing.


    # Chapter 6

    Fintech Startups and Cryptocurrency in Business: Revolutionizing Entrepreneurship
    ............106

    *Muhammad Usman Tariq, Abu Dhabi University, UAE & University of Glasgow, Glasgow,
    UK*


    This book chapter explains the significant influence of cryptocurrencies and fintech
    startups on business models and entrepreneurship by examining their revolutionary
    junction. The chapter thoroughly examines fintech''s birth and development, charting
    its disruptive path inside the conventional financial services industry. It simultaneously
    explores the history of cryptocurrencies, revealing the blockchain''s technical
    foundations and growing popularity in the corporate community. The story highlights
    the explosive rise of fintech companies and identifies its driving forces, including
    changes in consumer preferences, legislative changes, and technology breakthroughs.
    The chapter''s main focus is how companies embrace cryptocurrencies, use them
    for transactions, hold ICOs to raise money, and add them to investment portfolios.
    The chapter also discusses technological difficulties and regulatory issues when
    merging fintech and cryptocurrency solutions.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Chapter 7

    Requirements of Adopting SMEs for Business Intelligence Systems: A Field Study
    in the Industrial Zone of Setif in Algeria....................................................................125

    *Hichem Mezhoud, Mila University Center, Algeria*


    In this chapter, the authors will discuss the requirements for small and medium-sized
    enterprises (SMEs) to adopt business intelligence systems and make them more competitive.
    Currently, communication technologies are evolving rapidly and continuously. Companies
    are adopting modern methods and tools to ensure their survival and gain a sustainable
    competitive advantage. This necessitates keeping pace with developments that affect
    the business sector, including the emergence of business intelligence systems,
    which are among the latest and most important cost management tools. These systems
    involve shaping big data, creating mechanisms for collecting it accurately and
    efficiently, analyzing it, and innovating methods to process its understanding.
    The resulting information is used to make various decisions within the company.
    This chapter will address and analyze various technical, human, and organizational
    requirements for SMEs located in the industrial region of Setif, Algeria, to adopt
    business intelligence systems.


    # Chapter 8

    Design Thinking and Creativity in Entrepreneurial Innovation............................................155

    *Mustafa Kayyali, HE Higher Education Ranking, Syria*


    This study explores the pivotal role of design thinking and creativity in the
    realm of entrepreneurial innovation. The need for innovative ways to problem-solving
    and idea production is becoming more and more obvious as the entrepreneurial landscape
    changes. Iterative and human-centered design thinking provides entrepreneurs with
    a special framework for navigating the challenges of innovation. This study explores
    the interplay between design thinking and creativity, illuminating how these ideas
    merge to promote entrepreneurial success. Through a comprehensive analysis of
    case studies and empirical evidence, this study demonstrates the multifaceted
    impact of design thinking and creativity on fostering innovation in entrepreneurial
    ventures. The findings underscore the significance of cultivating a creative mindset
    and embracing design thinking principles as catalysts for entrepreneurial innovation
    in today’s dynamic business environment.


    # Chapter 9

    Business Intelligence and Innovation Moderating Roles on Entrepreneurship and
    Management Using Champiopreneurship Approach ........................................171

    *Harry Orugba Ovorhare, University of Port Harcourt, Nigeria*


    The study explored business intelligence and innovation moderating roles on entrepreneurship
    and management using champiopreneurship approach. The'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'dimensions of business intelligence capture were competitive intelligence (CI)
    and decision support system (DSS). The innovation was focused on selected simplex
    innovation (product, process, service, technology, among others) and complex innovation
    (sustainable, transformational and systematic). The study orchestrates championpreneurship
    approach as entrepreneurs with championship characteristics and management acumen
    on entrepreneurial opportunities. This poses that entrepreneurship is a viable
    concept for enterprise to achieve their vision, mission, dreams, and entrepreneurial
    journey. In conclusion, the synchronization of entrepreneurship and management
    boosts the tendency of prospective and potential entrepreneurs to be equipped
    with spirit of championpreneurship by the intensive application of business intelligence
    and innovation.


    # Chapter 10

    Impact of Board of Directors Composition, Activity, and Compensation on

    the ESG Performance in an International Context....................................224

    Tijani Amara, Higher Institute of Business Administration, University of

    Gafsa, Tunisia

    Ali Ahmadi, Higher Institute of Business Administration, University of

    Gafsa, Tunisia


    A growing body of research suggests that the Board of Directors Composition, Activity,
    and Compensation can influence its environmental, social, and governance (ESG).
    This chapter seeks to fill this gap in the literature by testing the impact of
    board size, board meetings, women on the board, executive compensation, and ESG
    controversies on ESG performance. Using one of the largest datasets to date, consisting
    of an unbalanced panel dataset consisting of 31040 firm-year observations from
    5500 listed firms, covering a period of 16 years (2002–2017) from 60 countries
    around the world, these findings are fivefold. First, these results suggest that
    board size is positively associated with ESG performance. Second, the authors
    show that the number of meeting of the board per year is positively related to
    the environmental, social and governance score. Third, the main empirical evidence
    shows that the relationship between women on the board of directors and a firm’s
    ESG performance is a strongly significant. Fourth, these results reveal that executive
    compensation has a positive effect only for some geographic areas. Fifth, there
    is a negative link between ESG performance and ESG controversies.


    # Chapter 11

    Sustainability in Transformational and Transactional Leadership: Turkish

    Textile Industry Example....................................................................241

    Korhan Arun, Namık Kemal Üniversitesi, Turkey


    The relationship between leadership and sustainability in organizations is a topic
    of significant interest, focusing on the impact of transformational and transactional'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'leadership styles on organizational sustainability. This study emphasized the
    importance of transformational and transactional leadership in driving sustainable
    practices and outcomes, addressing the gap between leadership styles and sustainability.
    Path analysis results show that transformational and transactional leadership
    styles significantly influence sustainability. However, interestingly, transformational
    leadership decreases sustainability expenditures, and both leadership styles increase
    nitrogen emissions. The relationship between transformational leadership and negative
    outcomes for sustainability needs to be directly addressed in the available literature.
    In the textile industry in developing countries, both transformational and transactional
    leadership and environmental sustainability have negative correlations, and transformational
    leaders may decrease environmental expenditures.


    # Chapter 12

    A Study on the Interaction Between Civil Business Groups and the State

    From the Perspective of Public Sphere Theory: A Comparison Between the Shanghai....................................................................................258


    Wei Yao, Nanjing University, China

    Yuhong Li, Nanjing University, China

    Tingxuan Liu, Nanjing University, China


    This chapter attempts to use public sphere theory as a starting point to compare
    the behavior of the British government in protecting the interests of British
    business in China in the 19th century with the Chinese government''s neglect of
    the interests of Chinese business in the Philippines. This chapter uses the Shanghai
    Branch of the China Association and Philippine Chinese Charitable Association
    Inc. as representatives of private business groups in the UK and China. For the
    UK, due to the public sphere of competition with the central government within
    the UK, private business groups must consult with relevant private business groups
    when implementing any economic foreign policy. This process promotes consensus
    between the British government and society and promotes the British government''s
    determination to maintain British business in China. However, for China, due to
    the absence of a public sphere where the central government interacts with society,
    even though Chinese private business groups have huge interests overseas, the
    state and society have always been unable to form a positive interaction. At the
    same time, this situation also results in Chinese businesses in the Philippines
    having to rely on their abilities to maintain their local interests.


    # Chapter 13

    Going Back to Basics as an Innovative Way Forward on Muslim Health Tourism: Keep
    Sharia in the Loop....................................................................................277


    Aniesa Samira Bafadhal, University of Brawijaya, Indonesia'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'The fast growth of health tourism has been attributed to creating a health
    and prevention boom era expected to usher in new economic power. Offering a different
    approach derived from the Sharia, Muslim health tourism poses a proximity between
    religion, tourism, and health. Amid the urgency to understand Muslim tourists
    as a potential market with such unique characteristics and specific needs, it
    is unfortunate that no model describes the decision-making behaviour when selecting
    a Muslim-friendly health destination. As a result, the author suggests a Muslim
    health tourist behaviour model. This study also highlighted Sharia salons and
    spas as one of the forms of Muslim health tourism business. It''s becoming increasingly
    clear that for the Muslim health tourism business to truly understand its market,
    going back to basics is the most innovative approach.


