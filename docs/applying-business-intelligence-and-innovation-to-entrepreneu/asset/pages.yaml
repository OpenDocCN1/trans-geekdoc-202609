    much more frequently (Corvello et al., 2022). With the advent of digitization,
    business executives are encouraged to use a huge amount of data to align their
    operations and generate innovative products to cater to their customers (Saleem
    et al., 2020). A new venture’s creation and the development of its launch are
    impacted by enabling technologies, such as artificial intelligence and big data
    (Oukil, 2011). Businesses have to work hard to get the data they need to make
    better decisions in a highly competitive, dynamic, and unstable market. Due to
    the availability of more data via electronic channels for communication, processing,
    and acquisition, business intelligence (BI) has gained popularity. This data may
    serve as the foundation for intelligence techniques (Caseiro & Coelho, 2018).
    Strategic orientations of global market organisations are linked to knowledge
