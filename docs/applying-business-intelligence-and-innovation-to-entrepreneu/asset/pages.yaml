    # RESULT


    # Shanghai Branch of the China Association


    # Proposal of the Issue of Canceling Likin and Rising Tariff: Positive Interaction
    Between the Shanghai Branch of the China Association and the British Government


    In terms of economy, the Shanghai branch requested abolishing the likin barriers.
    To solve the financial crisis caused by the suppression of the Taiping Rebellion
    (太平天国运动), the Chinese government established likin barriers, which were similar
    to donation but could be implemented for a long time (Luo 2010). From then on,
    indiscriminate collection of likin, and extortion by officials seriously hindered
    the smooth flow of goods throughout the state. To further develop trade with China,
    British businessmen in China were eager to abolish likin barriers. They seek support
    from the British government. After the Boxer Rebellion (义和团运动), the British Consulate-General
    in Shanghai consulted with the Chamber of Commerce on the negotiations between
    British and China. The Shanghai branch strongly demanded to abolish likin barriers
    (Dudgeon 1901). Faced with the global decline of the British Empire, responding
    to the United States’ demand for an “open door “, the British'
