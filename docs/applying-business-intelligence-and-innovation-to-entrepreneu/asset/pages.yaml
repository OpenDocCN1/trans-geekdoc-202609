  md: '# # Definition Of Business Intelligence in Industrial Small and Medium Sized
    Enterprises


    In our search for the conceptual roots of the term Business Intelligence, we found
    the first definition of H.P Luhn in 1958 where he defined it as the ability to
    understand the interrelationships among presented facts and how they lead to directing
    work towards desired goals. In the business field, Business Intelligence is an
    automatic system created and developed to disseminate information across various
    departments and parts of the organizational structure (Grossmann & Rinderle-ma,
    2015, p. 1). Laura Zapata-Cantú, Teresa Treviño, and Flor Morton see Business
    Intelligence as referring to a wide range of methodologies, processes, infrastructures,
    architectures, and technologies that work together to provide solutions for managers
    to make sound and quick decisions. Eventually, it relies on the real-time analysis
    and aggregation of data, transforming it into useful information (Zapata-Cantu,
    Trevino, & Morton, 2020, p. 15). It is also know as a comprehensive concept for
    data structuring, analysis tools and software which is embedded in a specific
    way to enable entrprise managers for intrantical reach of data and information
    simoltanously. Therefore, decision maker can have crystal clear visions for a
    sane administrative decision (Sharda, Delen, & Turban, 2018, p. 16). Business
    Intelligence comprises different activities, analysis means, works, and the necessary
    techniques to transform data into useful information, which in turn becoms knowledge.
    Thus, this knowledge is used in the enterprise to find plans which lead eventually
    to the adoption of operational and managerial procedures economic profits. (Loshin,
    2013, p. 7)


    Accordingly, Business Intelligence is a large structure of computerized media
    devices, means, technologies, computer software, and infrastructures. These elements
    are integrated according to a specific configuration, aligning with the activities
    and operations of the organization and its managerial levels and adopted organizational
    structure. The main purpose is to obtain vast data, in various forms and from
