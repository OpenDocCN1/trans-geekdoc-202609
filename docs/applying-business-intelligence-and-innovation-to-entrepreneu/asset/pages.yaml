  md: '# A. BCG Matrix Analysis


    The prolific strategic firms in the USA came up with a tactical model to manage
    the product portfolio of enterprise. The tactical model is known as Boston Consulting
    Group (BCG) Matrix. BCG''s founder, Bruce Henderson, popularized the concept in
    his essay _The Product Portfolio_, in 1970. The champion entrepreneur BCG''s Alan
    Zakon created a trophy in this plight. While Reeves & Moose (2023) breathe a fresh
    breathe on the matrix in collaboration with the team.


    The matrix is a simplex graphical instrumental tools use to cross-examine and
    evaluate the product portfolio of the different enterprise product and services
    the firm is willing to offer for sales in the competitive parity. This is expressed
    in simplex form called the strategic business units (SBU) in synchronization of
    the market share and business growth of the enterprise. It shows relatively how
    the market share expands or contrasts in alignment with the business growth rate.
    It is perceived by the management as two dimensional analyses among the market
    share and business growth of the SBU''s (Strategic Business Unit).


    The expression can be seen as stated beneath as stipulated per annum comparison
    of base and preceding.


    ```

    Relative Market Share = Strategic Business Unit (SBU) Sales leading in the competitive
    parity.

    Market Growth Rate = Industry sales per annum now - Industry sales per annum last
    year.

    ```


    The BCG matrix has four compartment cells which can easily be understood in the
    horizontal axis expression and vertical axis expression with the strategic business
    unit (SBU).


    The four compartment cells of the BCG matrix are the Stars, Cash Cows, Question
    Marks and Dogs as illustrated in Figure 3.


