  md: 'and belief, as well as waning of the sanctity of holy places, rituals, and
    customs. If this continues, tourism can be a coherent process against religiosity.
    Joyce (2001) calls this phenomenon the myth of morality. In the view of the myth
    of morality, there is no relationship between business and morality, and it is
    a mistake if business activity is run under morality and ethics. The famous phrase
    “business is business” or “it is not personal, it is strictly business” in business
