- pgno: 14
  md: '# Preface


    In the dynamic landscape of today’s global economy, the integration of technology,
    business intelligence, and innovation has become pivotal for entrepreneurs seeking
    to navigate and thrive in the ever-evolving business environment. As the world
    witnesses a digital revolution, marked by the widespread application of artificial
    intelligence and the continuous emergence of smart technologies, entrepreneurs
    find themselves at the forefront of transformative change.


    This edited reference book, Applying Business Intelligence and Innovation to Entrepreneurship,
    is a collaborative effort by Kannapat Kankaew, Parinya Nakpathom, Alhuda Chnitphattana,
    Krittipat Pitchayadejanant, and Siwaporn Kunnapapdeelert, along with various authors
    from around the world. It is designed to provide insights into the intricate interplay
    between technology, business intelligence, and innovation in entrepreneurship
    across diverse sectors.


    In this era of the innovation economy, where technological advancements propel
    commerce forward, entrepreneurs play a vital role in shaping and redefining industries.
    From agricultural products to fast-moving consumer goods, from the hospitality
    industry to cultural and indigenous products, entrepreneurship is a catalyst for
    creativity and circular economies within communities and societies.


    This book delves into the multifaceted realm of entrepreneurial business management,
    emphasizing the symbiotic relationship between technology and business intelligence.
    It explores how entrepreneurs can leverage digitalization for sustainability,
    innovation, and a competitive edge in various sectors. Notably, the book addresses
    the challenges faced by entrepreneurs in today’s dynamic business environment
    and provides valuable insights into successful business strategies.


    Our aim is to cater to a diverse audience, including academicians, researchers,
    undergraduate/postgraduate/doctoral students, and professionals in both private
    and public enterprises. The content covers a spectrum of topics, ranging from
    traditional entrepreneurship and management to cutting-edge areas like Fintech
    startups, cryptocurrency in business, community startups, and the integration
    of local wisdom into innovative practices.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'The recommended topics span the breadth of entrepreneurship, including the
    adoption of business intelligence by small and medium enterprises, innovation
    in social enterprise management, the dynamics of the hospitality and tourism industry,
    and the influence of digital marketing and marketing communication. Additionally,
    the book explores emerging trends such as delivery services, operation and supply
    chain management, data science for business, blockchain in entrepreneurship, technology
    management, and sustainable innovation.


    In this book, the chapters unfold a comprehensive exploration of the dynamic interplay
    between technology, business intelligence, and innovation in the entrepreneurial
    landscape. From a systematic literature review on the influence of business intelligence
    on entrepreneurial orientation to an in-depth analysis of the role of technology
    business incubators in startup development, each chapter offers valuable insights
    and practical perspectives. The disruptive force of blockchain technology, the
    pivotal role of supply chain and operations management, the transformative impact
    of Neuromarketing in the digital era, and the revolutionary influence of cryptocurrencies
