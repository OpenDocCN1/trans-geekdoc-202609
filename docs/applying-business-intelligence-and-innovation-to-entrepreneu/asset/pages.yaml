    visual attention allows marketers to optimize website layouts, ensuring that crucial
    information and CTAs are strategically positioned for maximum visibility (Holmqvist
    et al., 2011).


    Moreover, eye-tracking offers insights into the user experience of online advertisements.
    By tracking gaze patterns during ad viewing, researchers can identify which elements
