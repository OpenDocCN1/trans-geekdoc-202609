    # BASIC CONCEPTS OF BUSINESS INTELLIGENCE IN INDUSTRIAL SMAL AND MEDUIM SIZED
    ENTERPRISES


    The current business environment is characterized by its complexity and instability.
    To achieve a quick response to consumer demands, economic institutions face the
    inevitability of using information technology and various decision support systems.
    This necessitates acquiring technological communication tools and methods to gather
    a variety of data from different sources, analyze it, and transform it into new
    and useful knowledge for decision-making processes. Business Intelligence (BI)
    systems play a crucial role in this regard, serving as a set of practices, methods,
    tools, and applications that assist enterprise management in collecting, integrating,
    analyzing, and presenting data in an understandable and usable format, enhancing
    overall performance and decision-making (Olszak, 2020, p. 35). Therefore, BI includes
    practices and tools such as data warehousing, data mining, and reporting and querying
    tools contribute to informed decision-making (Deepmala, Anurag, Amizan, & S.B,
    2023, pp.32,33). Therefore, Lila Rao-Graham, Maurice McNaughton, and GunjanMansingh
    argue that a business intelligence system provides small and medium-sized industrial
    enterprises with high organizational flexibility, in addition to their inherent
    organizational flexibility, derived from their small size. These enterprises completely
    lack the formal and bureaucratic organizational structures that largely constrain
    large enterprises. (Rao-Graham, McNaughton, & Mansingh, 2020, p. 4)


    # Conditions and Reasons for the Emergence of Business Intelligence in Industrial
    Small and Medium Sized Enterprises


    The deep economic and technological transformations that have occurred in the
    industrial business environment since the early 21st century have significantly
    reshaped internal production activities. Globalization, technological advancements,
    and changes in communication, data storage, and information management have shifted
    industrial enterprises from traditional hierarchical models to horizontal structures
    focused on process-oriented organization. This shift is part of the reengineering
    philosophy introduced by James Chenpey and Michael Hammer, emphasizing process-centric
    organizations. In response to external pressures, businesses must adapt rapidly
    by engaging in continuous development and innovation activities,'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'necessitating strategic, tactical, and operational decisions to maintain flexibility
    (Skyrius, 2021, p. 7).


    Currently, businesses rely heavily on data and information, leading to informational
    chaos and noise due to the increasing volume and flow of data. The inconsistency
    and incompleteness of data used by decision-makers create uncertainty and reliance
    on diverse assumptions. To address this, successful companies establish specialized
    organizational units focusing on data collection and analysis, leading to the
    development of BI and Business Analytics (BA) fields. As a results, these fields
    concentrate on extracting useful data and information through the innovation of
    specialized software (Olszak, 2020, p. 3).


    As a result of disruptive digital technologies, including the emergence of cloud
    computing, mobile computing, big data analytics, advances in machine learning
    and artificial intelligence, and increased reliance on social media, small and
    medium-sized industrial enterprises are compelled to rely on Information Technology
    and Communication (ITC) to adapt to current environmental conditions. There is
    a widespread belief among many researchers that information and communication
    technology plays a pivotal role in helping small and medium-sized industrial enterprises
    improve their operational performance and enhance their competitiveness. (Rao-Graham,
    McNaughton, & Mansingh, 2020, pp. 9, 10, 11)


    # Historical Evolution of Business Intelligence


    The term Business Intelligence was coined by the Gartner Group in the mid-1990s,
    but its historical roots trace back to Management Information Systems (MIS) in
    the 1970s and Executive Information Systems (EIS) in the 1980s. These systems
    improved computerized management support, with MIS offering static two-dimensional
    reports, and EIS introducing dynamic multidimensional reports and trend analysis.
    In the 1990s, BI emerged, providing executives with all the information they needed
    (Sharda, Delen, & Turban, 2018, p. 16). Celina Olszak identifies three generations
    of BI systems: BI 1.0, BI 2.0, and BI 3.0. BI 1.0, which emerged in the 1970s
    and 1980s, and was closely tied to MIS, EIS, and Decision Support Systems (DSS).
    BI 2.0, which emerged from 1990 to 2005, had witnessed a continuous development
    in advanced data warehouses, OLAP techniques, and data extraction methods. It
    enabled enterprises to highlight their work online, aligning with market requirements.
    The latest generation, BI 3.0, introduced proactive solutions available to a large
    number of individuals within the enterprise, which was integrated with enterprise
    operations and offering cloud-based BI services (Olszak, 2020, pp. 42, 43).


    The adoption of decision-making computing in enterprises began in the 1970s, experiencing
    five key stages to the present day.'
