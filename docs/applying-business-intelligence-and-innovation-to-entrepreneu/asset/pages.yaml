    # # Advances in Business Strategy and Competitive Advantage (ABSCA) Book Series


    ISSN:2327-3429

    EISSN:2327-3437


    Editor-in-Chief: Patricia Ordóñez de Pablos, Universidad de Oviedo,

    Spain


    # ## MISSION


    Business entities are constantly seeking new ways through which to gain advantage
    over their competitors and strengthen their position within the business environment.
    With competition at an all-time high due to technological advancements allowing
    for competition on a global scale, firms continue to seek new ways through which
    to improve and strengthen their business processes, procedures, and profitability.


    The Advances in Business Strategy and Competitive Advantage (ABSCA) Book Series
    is a timely series responding to the high demand for state-of-the-art research
    on how business strategies are created, implemented and re-designed to meet the
    demands of globalized competitive markets. With a focus on local and global challenges,
    business opportunities and the needs of society, the ABSCA encourages scientific
    discourse on doing business and managing information technologies for the creation
    of sustainable competitive advantage.


    # ## COVERAGE


    +   - Core Competencies

    +   - Strategic Management

    +   - Customer-Orientation Strategy

    +   - Value Chain

    +   - Outsourcing

    +   - Tacit Knowledge

    +   - Co-operative Strategies

    +   - Entrepreneurship & Innovation

    +   - Value Creation

    +   - Globalization


