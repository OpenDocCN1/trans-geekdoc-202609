    # Organizational Requirements Associated With Establishing an Operational Business
    Intelligence System


    When adopting a business intelligence system, it will necessarily include all
    operational activities and processes and all managerial levels of the organization,
    including suppliers, customers, and public data for citizens outside the organizational
    structure but in continuous relation with it. (Howson, Successful Business Intelligence:
    unlock the value of BI and big data, 2014, p. 4) In line with this approach, the
    operational system of the organization consists of a set of internal activities
    and processes that transform available resources into products and services directed
    to the market. At each step of these processes, users enter a set of data into
    the operating systems, which are then captured and used in the business intelligence
    system. Operational systems, also known as transaction processing systems or source
    systems and also referred to as Enterprise Resource Planning (ERP) systems, are
    the main source of quantitative data related to the organization. Various activities
    are practiced, involving the input of a considerable amount of data into these
    systems, covering many areas, such as:


    +   - Manufacturing system: Entering a specific product production order into
    the manufacturing system, recording the quantity and quality of raw materials
    used, etc.


    +   - Sales system: Entering customer purchase orders, along with all details.


    +   - Supply Chain System: Executing orders once the product is available and
    entering shipping details.


    +   - Accounting system: Recording all cash and financial transactions, such as
    customer invoices, etc. (Howson, Successful Business Intelligence: Secrets to
    making BI a killer app, 2008, p. 22)'
