    # Philippine Chinese Charitable Association Inc.


    # The Issue of Establishing a Consulate of China in the Philippines: The Informal
    Colonialism of the Philippine Chinese Charitable Association Inc.


    In terms of economy, the Philippine Chinese Charitable Association Inc. requested
    the Chinese government to establish a consulate to promote the development of
    Chinese business in the Philippines and protect industrial security. During the
    Spanish rule, colonizers formulated various harsh regulations restricting overseas
    Chinese (You 1957). Industry tax and store tax were imposed to restrict overseas
    Chinese business (Huang & He 2009). Faced with such unfair treatment, the Philippine
    Chinese Charitable Association Inc. turned its attention to its home state. They
    attempted to seek support from the Chinese government.


