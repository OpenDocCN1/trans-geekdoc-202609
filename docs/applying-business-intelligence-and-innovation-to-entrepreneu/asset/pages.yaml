  md: 'knowledge. It is anticipated to result from lower levels of outsourcing technologies
    when choosing sales and marketing initiatives that focus on technology-related
    goods and services (Koza et al., 1998; Koza & Lewin, 1998; Lavie & Rosenkopf,
    2006). Marketing-related activities are frequently left out and unreliable (such
    as product performance information and expected benefits), leaving outsourcing
    to at least sales and marketing activities for products and services that contain
    high levels of technical knowledge and uncertainty. Because market outsourcing
    and sales are frequently less susceptible to the degree of exploration activity,
    we anticipate that improved levels of technical exploration activity will have
    a major negative impact on R&D outsourcing.


    The performance measurement tool concept – “startup cockpit” introduced by Ripsas,
    Shaper, and Toger, (2018) focused on indicators such as customer service, financial
    vision, and procedure. These three indicators are relevant while investigating
    startup efficiency. Further indicators such as economic survival and profitability
    are believed to be assessed while evaluating financial forecasts. Liquidity, burn
    rate, margin analysis, and return on investment are further sub-layers of performance
    evaluation. From investors’ perspective, client acquisition expenses, customer
    lifetime value, and learning curve can be other indicators.


    As a startup expands, making decisions need more information. It is therefore
    frequently stated that startups should specialize in fields that are thought to
    be of utmost relevance to spend time and resources effectively and efficiently.
    Startups are therefore expected to perform better in areas that management deems
    more crucial and less significant.


    # Sustainability


    Now when it comes to assessing the sustainability aspect of the startups, researchers
    have suggested evaluating the implementation phases. Building, measuring, and
    learning were the initial three stages as stated by Eric Ries, (2016). Successful
    startups complete the business iteration loop model in the early stages until
    training and insights from client feedback offer sufficient proof that the business
    model is successful and pertinent (Ries, 2016; Ries & Euchner, 2013; Ripsas et
    al., 2018a, 2018b; Ripsas & Hentschel, 2017)


    Croll and Yoskovitz (2017),identified five basic categories that can be investigated
    when assessing the sustainability of startups, these include adherence, empathy,
    average customer experiences, vitality of product/service, and income generated.
    Empathy is the stage at which the needs of actual customers that cannot be satisfied
    are recognized. The most important aspect is when a startup learns how to address
    its demands and retain clients. Customers will promote a product or service to
    others if they are happy with the response. This is frequently the initial phase
