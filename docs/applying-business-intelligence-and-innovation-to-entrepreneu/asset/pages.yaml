    rate of innovation by supporting entrepreneurs in overcoming their youth and young
    challenges, in addition to the diversity of perspectives and evolution of the
    models and services supplied (Dettwiler et al., 2006; Mireftekhari, 2017; Schwartz,
    2013). Monitoring new technological developments has a significant impact and
    may help support long-term knowledge and uncertainties expected as a result of
