  md: '# # Chapter 9


    # Business Intelligence and Innovation Moderating Roles on Entrepreneurship and
    Management Using Champiopreneurship Approach


    **Harry Orugba Ovarhe**

    https://orcid.org/0000-0002-3631-498X

    University of Port Harcourt, Nigeria


    # ## ABSTRACT


    The study explored business intelligence and innovation moderating roles on entrepreneurship
    and management using champiopreneurship approach. The dimensions of business intelligence
    capture were competitive intelligence (CI) and decision support system (DSS).
    The innovation was focused on selected simplex innovation (product, process, service,
    technology, among others) and complex innovation (sustainable, transformational
    and systematic). The study orchestrates champiopreneurship approach as entrepreneurs
    with championship characteristics and management acumen on entrepreneurial opportunities.
    This poses that entrepreneurship is a viable concept for enterprise to achieve
    their vision, mission, dreams, and entrepreneurial journey. In conclusion, the
    synchronization of entrepreneurship and management boosts the tendency of prospective
    and potential entrepreneurs to be equipped with spirit of champiopreneurship by
    the intensive application of business intelligence and innovation.


    DOI: 10.4018/979-8-3693-1846-1.ch009'
