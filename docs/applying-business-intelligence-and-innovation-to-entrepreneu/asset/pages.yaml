  md: '# Chapter 11 Sustainability in Transformational and Transactional Leadership:
    Turkish Textile Industry Example


    Korhan Arun https://orcid.org/0000-0001-7494-9591 Namık Kemal Üniversitesi, Turkey


    # ABSTRACT


    The relationship between leadership and sustainability in organizations is a topic
    of significant interest, focusing on the impact of transformational and transactional
    leadership styles on organizational sustainability. This study emphasized the
    importance of transformational and transactional leadership in driving sustainable
    practices and outcomes, addressing the gap between leadership styles and sustainability.
    Path analysis results show that transformational and transactional leadership
    styles significantly influence sustainability. However, interestingly, transformational
    leadership decreases sustainability expenditures, and both leadership styles increase
    nitrogen emissions. The relationship between transformational leadership and negative
    outcomes for sustainability needs to be directly addressed in the available literature.
    In the textile industry in developing countries, both transformational and transactional
    leadership and environmental sustainability have negative correlations, and transformational
    leaders may decrease environmental expenditures.'
