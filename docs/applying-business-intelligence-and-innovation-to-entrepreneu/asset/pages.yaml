- pgno: 265
  md: 'Environmental protection expenditure by domains, 2013-2021, is gathered from
    TurkStat, Environmental Protection Expenditure Statistics, 2021, from TUIK (Turkish
    Statistical Institute) (TUIK, 2023a). A leadership survey is gathered from the
    highest manager of each textile company from the Thrace region in Turkey. The
    textile industry has the fourth highest share by sales value of the four highest
    industries in Turkey (TUIK, 2023b).


    Due to its strategic location at the crossroads of several regions, including
    the Middle East, Asia, North Africa, Eastern Europe, and Russia, the Turkish textile
    industry is significant (Kaya et al., 2019). The industry primarily focuses on
    labor and exports, with small and medium-sized businesses making up more than
    90% of the sector (SMEs)(Divrik & Baykal, 2023). However, the sector needs help
    with environmental sustainability, energy management, nitrogen emissions, energy
    consumption, and pricing. However, the sector needs help concerning environmental
    sustainability, energy management, and nitrogen emissions, as well as energy consumption
    and pricing (Alkaya & Demirer, 2015; Divrik & Baykal, 2023; Hasanbeigi & Price,
    2012). Despite experiencing periods of recession, the Turkish textile industry’s
    economic significance is seen in its contribution to the country’s economy (Bilgin
    et al., 2011; Duran & Temiz Dinç, 2016). Global occurrences like the COVID-19
    epidemic have also affected the sector, causing changes in manufacturing and economic
    problems (Sutrisno, 2022). Analysis has been done on the sector’s development,
    productivity, and competitiveness, which reflects how dynamic the Turkish textile
    industry is (Başkol, 2018; Karabag et al., 2014) (Karabag et al., 2013; Başkol,
    2018; Alvan & Ghosh, 2010). In addition, research and concern have focused on
    the industry’s effects on the environment, waste management, and energy conservation,
    underscoring the necessity of sustainable practices and technological developments
    (Gümüş & Akbal, 2011; Qingfen et al., 2023; Tunc et al., 2016). The textile industry’s
    importance to the Turkish economy and beyond is further highlighted by its position
    in trade, intra-industry dynamics, and effects on other sectors like tourism and
    agriculture (Jain, 2022; Permata Sari et al., 2019; Tokel et al., 2022).


    Moreover, the Thrace Region is the locomotive region of our country’s textile
    and textile product manufacturing, mainly concentrated in the city of Tekirdağ.
    According to the 2018 SSI database, 488 businesses in the Thrace Region are active
    in the textiles industry, and 56,799 people are employed within the industry (Invest
    in Trakya-Tekirdağ, Edirne Kırklareli, 2023). The online survey was sent to 472
    textile manufacturing firms; 341 returned, but 322 were found suitable for the
    analysis. Turkish validated scale by Demir and Okan (2008) of transformational
    and transactional leadership survey is used for the research. In this version
    of the scale, transformational leadership has 12 questions, and transactional
    Leadership has 10 questions. Transformational Leadership has sub-dimensions: idealized
    influence'
