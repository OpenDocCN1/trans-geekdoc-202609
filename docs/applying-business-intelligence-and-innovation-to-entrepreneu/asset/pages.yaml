    # 2.1. Type of Entrepreneurs


    Entrepreneur is an individual who has a role of an industrialist and forms an
    organization for the commercial use. Entrepreneurs and intrapreneurs are change
    agent which transformative innovation instinct that focuses on client demand while
    creating basic alternative sources to meet their supply. Entrepreneurs are wired
    to invent and create customer/client satisfaction. There are several different
    types of entrepreneurs. Some of these types include digital entrepreneurs, home-based
    entrepreneurs, serial entrepreneurs, therapeutic entrepreneurs, cyber entrepreneurs,
    lean entrepreneurs, agile entrepreneurs, traditional entrepreneurs, social entrepreneurs,
    and corporate entrepreneurs (Ovharhe & Chukwemeaka, 2023). But, in operations
    the following beneath will be discussed as types of entrepreneurs.


    # 2.1.1. Types of Entrepreneurs in the Enterprise


    The Geek (2023) community stretches tentative types of entrepreneurs in the enterprise
    as discussed below.


    +   1. Innovative Entrepreneur: These are the ones who invent the new ideas, new
    products, new production methods or processes, discover potential markets and
    reorganize the enterprise’s structure. They are the industry leader that contributes
    significantly towards the economic development of the country. The innovative
    entrepreneurs have an unusual foresight to recognize the demand for goods and
    services. They are always ready to take a risk because they enjoy'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'the excitement of a challenge, and every challenge has some risk associated
    with it (Manohar et al., 2023)


    +   2. **Imitating Entrepreneurs:** The imitating entrepreneurs are those who
    immediately copy the new inventions made by the innovative entrepreneurs. These
    do not make any innovations by themselves; they just imitate the technology, processes,
    methods pioneered by others. These entrepreneurs are found in the places where
    there is a lack of resources or industrial base due to which no new innovations
    could be made. Thus, they are suitable for the underdeveloped regions where they
    can imitate the combinations of inventions already well established in the developed
    regions, in order to bring a boom in their industry.


    +   3. **Fabian Entrepreneurs:** Mediocrity and skeptics are the order of this
    entrepreneur status. They are very mild and careful; do not want to be seen making
    mistakes. At first they are not initiative and innovation, but spend time to study
    the trend of motion on event before they strike their actions in the business
    place. They follow the success rate of others in the invention and change transformation
    before they operate theirs. They strongly believe in concept testing and test
    marketing of their product or services and were very sure of the success and survival
    rate before they lunch attack on the market (Ratten, 2023).


    +   4. **Drone Entrepreneurs:** These are more mediocrity entrepreneurs that do
    not want to adopt and implement change in the business environment because of
    their conservative nature. They strongly choreograph the rhythm of ‘whatever will
    be, will be’ in their business because they are afraid to make loss. Also A.B.
    Akpan of Ahmadu Bello University (ABU) propagates the competitive parity as supported
    by Ovharhe (2021, 2022) entrepreneurship form of Enterprise. These are discussed
    below; viz:


    +   5. **Nichers:** These are entrepreneurs with passion but do not have the required
    resources or managerial acumen to capture the market. But, they decided to start
    from a very low scale in the business ladder trying to wait for the appropriate
    opportunity to grow. You see them starting with road side business before owing
    a business platform.


    +   6. **Followers:** They are very strong and ready to climb to the business
    top at any given opportunity. They may be looking for connections on the business
    climax and political structure. They are always scanning in the business environment
    for any slight opportunity to lunch their attack. Their target in not the market
    nichers’ rather the challengers and leaders on top the ladder in the business
    environment. They are not satisfied with where they are, but any mistake by those
    at the top, they will take over.'
