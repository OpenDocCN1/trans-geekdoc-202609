    # ABSTRACT


    Business intelligence has been a recent information tool which was introduced
    in

    the entrepreneurship world. The present study is an extensive systematic literature

    review based on PRISMA framework which aims to explore the influence of business

    intelligence (BI) on the entrepreneurial orientation (EO) among the ventures.

    Four journal databases have been used, namely Emerald, JStor, ScienceDirect,

    and EBSCOhost to gather the articles for the study. “Business intelligence” and

    “Entrepreneurial orientation” were the keywords used to identify studies from
    the

    journal databases. 23 articles were finalised for the study after going through
    the

    identification, screening and included process which comes under the PRISMA

    (preferred reporting items for systematic reviews and meta-analyses) framework.
    It

    has been found that very little research has been done in this field. So, this
    systematic

    literature review will give an insight into the possible gaps that can be covered
    by

    the upcoming researchers in this field.


