    From the above illustration in the diagram the explanation of the concept is discussed.


    +   1. Stars: Stars represent business units among the enterprise portfolio that
    have rapid growth rate and cash generating income stream with large market share
    in a fast growing business environment. They are high perceived products in the
    port folio which generate cash with fast growth rate with the relative market
    share. Though, because of the fast growth in the industry, stars product requires
    flow of huge investment to sustain the business unit. Overhead and'
