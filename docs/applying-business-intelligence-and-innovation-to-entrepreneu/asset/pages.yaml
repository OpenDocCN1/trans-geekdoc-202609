    During the 1990s, precisely in 1993, James Champy and Michael Hammer attempted
    to introduce the concept of Reengineering. They defined it as follows: Radical
    rethinking and radical redesign of the organizational structure of the enterprise
    and its operational processes to achieve significant improvements in performance
    and increase efficiency by reducing production costs, improving quality, satisfying
    consumers more, reducing response time to their desires, and enjoying greater
    flexibility towards external changes, as well as raising the level of coordination
    and integration for its activities and practices. (Hammer & Champy, 1993, pp.
    41-45)


    The main goal behind reengineering is to transform the organizational structure
    of the enterprise from a functional to a process-centered organization, based
    on the belief that the latter is the most evolved form of organization and is
    more in line with external environmental conditions. This involves a radical departure
    from functions and departments, replacing them with a set of horizontal business
    processes formed by individuals with multiple functional specialties, namely:


    +   • **Product Design and Workshop System Design Process:** This process includes
    all activities related to the development of new products. Due to the significant
    link between product design and the design of the workshop system, all these activities
    fall under one process, which is the process of designing new products and the
    workshop system.


    +   • **Enterprise Resource Management Process:** This encompasses all activities
    related to obtaining capital resources, human resources, and managing the technology
    within the organization.


    +   • **Product Supply Process:** This process includes a set of activities related
    to obtaining raw materials and various supplies used as inputs for the production
    system, culminating in the delivery of products and services to customers.'
