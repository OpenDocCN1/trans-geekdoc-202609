    # ## 7. CONCLUSION


    Entrepreneurship is the engine house of any merchandising activities and propeller
    of any nation''s economic growth and development. Entrepreneurs determine the
    flow of new blood stream in any enterprise. Whereas, management is the coordinating
    force that binds all the activities to ensure there is effectiveness and efficiency.
    This means the managerial strategies will be able to fine-tune the plans, organizing,
    directing, motivating and control of the input resource and projected output to
    work in achievable concept.


    Every entrepreneurs need to learn how to navigate with potentials and capabilities
    on the right track where there are valuable treasures of business opportunities.
    The right track is the valuable path on the vision and mission to thread on which
    can accomplish the entrepreneurial journey and dreams. This will enable the entrepreneur
    to experience new enterprise creation successfully through the application of
    business intelligence (competitive intelligence, decision support system), creativity
    and innovation.


    The business intelligence was adopted to enhance the return on asset (ROA), return
    on investment) ROI, return on capital employed (ROCE) and return on equity (ROE).
    The business intelligence is anchored with strategic intelligence, tactical intelligence,
    operational intelligence and decision support system that give the enterprise
    competitive advantage and championship edge in the market structure. However,
    the enterprise growth and development cannot be achieved without these concepts
    that give new blood life stream flow in the enterprise that is fathom as creativity,
    innovation and entrepreneurship opportunities. This is the store house of idea
    generation, networking and brain storming that enables entrepreneurship to be
    on the leading edge rather that bleeding edge over the artificial intelligence
    science, data virtualization, machine learning and big data emergence.


    Entrepreneurship opportunities, creativity and innovation are fruition to the
    management of any enterprise in the short-term and long-term in her merchandising
    activities. With the application of entrepreneurship innovation skills, the managerial
    policy, decision making and budgetary control implementation, the enterprise will
    experience business excellence in sustainability, survival and success. This calls
    for championreneurship approach which possesses ability, capability and capacity
    to control turbulence, post-pandemic and competitive parity in the business world.
    Championreneurship is the key to enterprise growth and development.'
