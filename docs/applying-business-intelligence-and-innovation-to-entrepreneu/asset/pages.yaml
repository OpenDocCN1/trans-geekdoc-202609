- pgno: 290
  md: 'became a colonial organization of the British government. The British government
    developed imperialism. When the Shanghai branch only obeyed but did not trust
    the British government, the British government reached a partial consensus with
    the Shanghai branch to promote mercantilism.


    When the public sphere didn''t exist, the Philippine Chinese Charitable Association
    Inc. and the Chinese government couldn''t engage in positive interaction around
    public issues. When Philippine Chinese Charitable Association Inc. obeyed and
    trusted the Chinese government, Philippine Chinese Charitable Association Inc.
    could only use the submission of petitions and private meetings with Chinese officials
    to make interest demands to the Chinese government without affecting its decision-making.
    Philippine Chinese Charitable Association Inc. had become an informal colonialism
    of the Chinese government. When the Philippine Chinese Charitable Association
    Inc. obeyed but did not trust the Chinese government, it didn''t seek support
    from the Chinese government, instead taking private measures to solve its problems.
    We believe that the presence or absence of the public sphere will affect the interaction
    and outcomes between overseas private business groups and their home states.


    # CONCLUSION


    By comparing the interaction between the Shanghai branch and the British government,
    as well as between the Philippine Chinese Charitable Association Inc. and the
    Chinese government, we find that the presence or absence of the public sphere
    has a significant impact on the interaction between the overseas private business
    group and the home state. It is precisely because of a public sphere between the
    Shanghai branch and the British government that they can establish public issues,
    using media opinions, and gatherings to promote the development of public affairs.
    On the other hand, due to the absence of a public sphere between the Philippine
    Chinese Charitable Association Inc. and the Chinese government, they were unable
    to establish public issues. There was no space for discussion and coordination.
    Therefore, the public sphere is where overseas private business groups can interact
    positively with their home state. In the public sphere, the two can exchange their
    demands, and ultimately reach partial consensus through compromise, promoting
    common development.


