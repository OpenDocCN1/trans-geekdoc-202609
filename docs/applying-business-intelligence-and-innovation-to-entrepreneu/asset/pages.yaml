  md: '# Figure 1. The successive stages of computing adoption and the emergence of
    business intelligence and analytics


    Source: (Sharda, Delen, & Turban, 2018, p. 13)


    ![](img/fe9d44dcd53963bacf41604c5dc22e8b_149_0.png)


    As shown in figure (1), we can say that Business Intelligence (BI) systems have
    emerged and evolved through five chronological stages since the early seventies
    of the twentieth century, with the emergence of Decision Support Systems. The
    seventies were characterized by relying on Management Information Systems (MIS)
    in decision-making. This involved preparing reports concerning various operational,
    organizational, and strategic variables over past time periods. The executive
    management relied on these reports for making future decisions. Additionally,
    Operations Research and Expert Systems techniques were used to solve complex problems
    faced by enterprise management. The second stage extended through the eighties
    and witnessed significant changes in how enterprise management obtained data related
    to its activities and fields. Traditional systems used to capture data from various
    units, such as marketing, accounting, and manufacturing, were integrated into
    a unified system at the enterprise level, known as Enterprise Resource Planning
    (ERP). During this stage, Relational Database Management Systems (RDBMS) were
    also introduced to improve data capture, storage, and computerized access. In
    the nineties, due to the need for more diverse reports for top management, Executive
    Information Systems (EISs) and Decision Support Systems (DSSs) were introduced.
    These systems were specifically designed for executive managers to meet their
    decision-making needs. They included visual information dashboards with performance
    metrics and essential indicators, relying on data warehouses to facilitate and
    expedite decision-making (Sharda, Delen, & Turban, 2018, pp. 13, 14, 15).'
