    # DISCUSSION


    From the interactions between the two overseas private business groups and their
    home states, we can find four forms of interaction that correspond to different
    results. When the public sphere existed, the Shanghai branch and the British government
    could engage in positive interaction around public issues. The Shanghai branch
    influences the decisions made by the British government through collective pressure,
    newspaper opinion, rallies, and voting. When the Shanghai branch obeyed and trusted
    the British government, the British government supported it. The Shanghai branch'
