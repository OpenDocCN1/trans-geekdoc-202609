  md: '# Figure 1. Path model analysis of the hypothesis model by structural equation
    modeling


    ![](img/fe9d44dcd53963bacf41604c5dc22e8b_267_0.png)


    Structural Equation Modeling (SEM) holds significant importance in social sciences
    research because it analyzes complex relationships among observed and latent variables.
    The substantive use of SEM in psychology and social sciences highlights its growing
    importance in empirical research (Anderson & Gerbing, 1988). Moreover, SEM emerged
    as a key statistical tool in social sciences and medical research, indicating
    its widespread adoption for improved analysis (Shaheen et al., 2017). Moreover,
    recent research highlights the wide usage of SEM in social sciences research,
    particularly in attitudes, behavior, and performance measurement (Al-Qadasi et
    al., 2021; Ehidiamen et al., 2023). Some authors also discussed the methodological
    advancements and guidelines for using SEM, such as the updated guidelines for
    using PLS path modeling in new technology (Ali et al., 2018; Hair, 2017; Henseler
    et al., 2016). These methodological advancements contribute to refining and standardizing
    SEM practices in social sciences research. Thus, the application of SEM in exploring
    and validating performance measurement domains and modeling predictors of environmental
    sustainability by forming path analysis demonstrates its versatility and relevance
    in this research.


    Table 2 shows the path model results and other statistics. According to path coefficients,
    Table 2, only transactional Leadership is effective on the environmental protection
    expenditure. The path coefficient is 0.127, which proposes that there is a positive
    relationship between transactional Leadership and environmental protection expenditures.
    Interestingly, in the textile sector, transformational Leadership is not significantly
    effective on sustainability (p values are greater than 0.005).'
