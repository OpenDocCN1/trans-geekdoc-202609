    # # REQUIREMENTS FOR SMALL AND MEDIUM-SIZED INDUSTRIAL ENTERPRISES TO ADOPT BUSINESS
    INTELLIGENCE SYSTEMS


    Most managers and business leaders have specific and precise management and operational
    goals, along with constrained performance rates that must be achieved within programmed
    periods. Therefore, attempting to convince them of the idea of investing in business
    intelligence systems is fundamentally related to the real benefit that these systems
    will provide in various areas. This includes increasing revenue, reducing costs,
    improving profitability, enhancing customer relationships, increasing supply chain
    flexibility, improving productivity rates, enhancing customer services, and improving
    competitive positioning.(Williams, 2016, pp. 162, 163) The adoption of a business
    intelligence system is, thus, associated with a set of adoption requirements that
    must be met to ensure the desired benefit. These requirements ultimately lead
    to integrating business intelligence with the strategy, plans, and business practices
    of small and medium-sized industrial enterprises. More specifically, business
    intelligence systems and various Information and Communication Technologies (ICT)
    should play an innovative role by integrating them into all business processes
    of the enterprise to improve performance, rather than merely managing the costs
    of these technological systems and considering them as tracking only business
    operations. (Gendron, 2013, pp. 6, 7)


    Many researchers believe that the success factors of adopting business intelligence
    systems are not limited to technological factors alone. Numerous other factors
    are of great importance. For example, Presthus believes that business intelligence
    is a socio-technical system where technical aspects are equal to human aspects.
    Yoon, Ghosh, and Jeong also emphasize the crucial importance of human aspects
    in adopting business intelligence systems, as they ensure positive social impact
    by creating a suitable learning environment. Researchers such as Yeon, Coronios,
    and'
