  md: 'Figure (7) provides a detailed view of all technical aspects of the Business
    Intelligence system. These can be categorized into four groups:


    +   * **Data Warehouse:** a technology through which data obtained from various
    sources is integrated.


    +   * **Data Extraction and Transmission Tools:** primarily responsible for transferring
    data from various sources, including transactional systems and the internet, to
    the enterprise’s data warehouse.


    +   * **Data Analysis and Exploration Tools:** enables end-users to access and
    comprehensively analyze data, as well as extract insights.


    +   * **Data Visualization:** encompasses a set of applications and tools responsible
    for presenting data and information transparently, facilitating access for end-users.
    (Olsztak, 2020, pp. 45, 46)


    # # Human Requirements for Adopting Business Intelligence


    The human requirements for Business Intelligence encompass a diverse set of skills
    that should be possessed by business analysts, the individuals forming the technical
    team responsible for designing and operating the enterprise’s Business Intelligence
    system. Small and medium-sized industrial enterprises often face limitations in
    having individuals with high-level technical skills due to their limited human
    resources. Additionally, Business Intelligence, business analysis, and data analysis
    are considered highly specialized and precise fields, making training individuals
    in these areas a significant challenge for management.


    Bert Brijds identifies five types of skills that should be present in a business
    analyst:


    +   * **Data Knowledge:** Business analysts should master linking data quality
    to master data management, starting from data profiling to analyzing data proportions.
    This requires in-depth knowledge of processes responsible for creating, using,
    or modifying data.


    +   * **Application Knowledge:** involves proficiency in working with Business
    Intelligence applications capturing real events and transactions within the organization,
    such as invoices, purchase and sales orders, etc. Familiarity with Customer Relationship
    Management (CRM), Enterprise Resource Planning (ERP), sales channels, and Online
    Analytical Processing (OLAP) is crucial as they are primary data sources.


    +   * **Process Knowledge:** acquiring knowledge related to the nature of the
    organization’s processes is one of the most critical skills for business analysts.
    Understanding business processes is vital as they are significant sources of data.'
