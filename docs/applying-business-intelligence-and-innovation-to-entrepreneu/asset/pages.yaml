  md: '# Effects of Transactional Leadership on Environmental Sustainability


    Transactional leadership has been the subject of extensive research concerning
    its impact on organizational performance and employee behavior. The findings of
    Kafetzopoulos and Gotzamani (2022) indicate that this leadership style has a positive
    influence on talent work motivation and performance. However, Khan and Jantan
    (2022) discovered that transactional leadership has adverse effects on innovative
    work behavior. Moreover, Chuan''s (2022) research revealed that the use of this
    leadership style results in negative consequences for non-financial performance
    in the multi-level marketing industry. These studies emphasize the importance
    of considering the pros and cons of transactional leadership carefully.Additionally,
    Tanveer et al.Tanveer et al. (2021) explored the impact of environmental sustainability
    and financial resource utilization on firms'' financial performance, indicating
    the mediating role of leadership styles, including transactional leadership. Additionally,
    some authors discovered that transactional leadership enhanced the link between
    stress and unfavourable conduct, lessening the environment''s impact on workplaces
    (Yao et al., 2014).


    The references provided in this chapter collectively suggest that the effects
    of transactional leadership on environmental sustainability and organizational
    performance are complex, with both positive and negative impacts. The influence
    of transactional leadership on employee behavior, talent motivation, and organizational
    performance varies across different contexts and industries.


    **H2:** Transactional leadership increases environmental sustainability in organizations.
    More clearly, TL increases environmental protection expenditures and decreases
    Production-based nitrogen emissions in organizations.


    # METHODOLOGY


    # Sample and Measures


    To measure these relationships, the structural equation model is used for the
    path model of hypotheses. Production-based nitrogen emissions (kg/capita) data
    was gathered from the Sustainable Development Report 2023 (www.sdgindex.org).
    Reactive nitrogen is released while manufacturing goods imported or used locally.
    Reactive nitrogen is associated with emissions to the atmosphere of ammonia, nitrogen
    oxides, nitrous oxide, and reactive nitrogen that may be exported to aquatic environments.
    These pollutants can harm human health and the environment (Sustainable et al.,
    2023).'
