    # RESEARCH METHODODLGY


    Through a “PRISMA 2020” systematic review of existing literature, this study aims
    to identify how business intelligence can be influencing entrepreneurial orientation
    among the ventures that need to be addressed for future research agendas.


    # Identification


    In order to identify the resources, the first stage entails filtering out journals
    from the various databases, such as Science Direct, Emerald Insight, Ebscohost,
    and JStor, since they are some of the main chosen databases for evaluation and
    financing in Indian social science research. Utilizing keywords such as “Business
    Intelligence” AND “Entrepreneurship Orientation” will allow to search the four
    database journals for the resource. This study includes only English-language
    research papers, review articles, early-cite publications, and peer-reviewed articles
    that were published between 2010 and 2023.


    # Screening


    In order to find relevant articles, keywords are used to search for resources.
    The screening process led to the retrieval of 306 articles (59 from Science Direct,
    235 from Emerald Insight, 4 from EBSCOhost, and 8 from JStor). A duplicate article
    was identified during the compilation process and removed. 37 articles were sorted
    after reading the abstracts and the titles, and 269 were discarded. There were
    13 articles that had no full-text available, as well.


    # Included


    The titles of the papers were screened before moving on to the abstracts as part
    of the selection process. Articles were chosen in the next phase according to
    the research question. Nevertheless, the research did not include any papers whose
