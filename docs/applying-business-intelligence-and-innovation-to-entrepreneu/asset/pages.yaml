    # Organizational Requirements for Adopting Business Intelligence


    According to the literature of management science and as per the thinker Peter
    Drucker, organization is considered the second stage of practice within the framework
    of any managerial process, following planning. Organizing is, therefore, an activity
    that involves designing the organizational structure, in addition to achieving
    coordination and harmony among its various parts and separate administrative units.
    This is to make the organization fully adaptable to the continuous changes occurring
    in its environment, providing it with organizational agility. Consequently, organizational
    requirements refer to the compatibility, harmony, and coordination that must be
    achieved between business intelligence as a system and the organizational structure
    of the entire institution. This ensures the smooth flow and proper distribution
    of data and information. Managers and executives must real, useful, detailed,
    and timely information concerning all practiced activities and external environmental
    conditions to achieve high performance and organizational efficiency. Thus, the
    operational business intelligence system is integrated with the overall operational
    system of the organization. (Howson, Successful Business Intelligence: Secrets
    of making BI a killer app, 2008, p. 23) Among the prominent reasons leading to
    the emergence of these organizational requirements are the modern organizational
    structures adopted by industrial enterprises, known as flat structures, horizontal
    structures, or structures centered around operations. Additionally, the new distribution
    of decision-making authority, by enabling individuals responsible for business
    operations to make various decisions, played a crucial role. (Olszak, 2020, p.
    3) The urgent transformations in the work environment, the emergence of the digital
    economy, and competition based on quality and innovative competition played a
    decisive role in the need for enterprises to achieve high levels of internal coordination.
