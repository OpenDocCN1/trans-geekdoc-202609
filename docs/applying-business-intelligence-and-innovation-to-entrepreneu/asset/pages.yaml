    # CHALLENGES OF BUSINESS INTELLIGENCE SUCCESS


    Over the past two decades, the success of adopting economic enterprises in general,
    and small and medium-sized industrial enterprises in particular, faces many challenges
    related to the ambiguity that characterizes business intelligence systems in the
    ability to enhance the performance of various operational processes and other
    administrative aspects. The most important challenges are highlighted within the
    following points:


    +   - The urgent need for enterprise managers to deal with business intelligence
    as more than just a provider of reports related to the operational activities
    of the enterprise.

    +   - The necessity to adapt the components and parts of Information and Communication
    Technology (ICT) with business intelligence systems, so that the latter can operate
    more efficiently and effectively.

    +   - The absence of a clear strategy and sound plans to integrate business intelligence
    systems with the operations of the enterprise, especially operational processes
    is affected by the sudden changes in the external environment. (Williams, 2016,
    p. 161)

    +   - The lack of sufficient maturity of Information and Communication Technology
    (ICT) assets available in the enterprise, which does not allow them to adopt business
    intelligence systems in a way that supports business processes. This challenge
    necessitates improving the management and governance processes of information
    and communication technology.

    +   - The lack of a precise and logical understanding by the management of the
    enterprise of how to deploy information and communication technology and business
    intelligence systems in the value creation process. (Gendron, 2013, pp. 5, 6)

    +   - The limited financial capabilities that characterize small and medium-sized
    industrial enterprises, which may hinder their ability to allocate appropriate
    budgets to meet investment requirements in the field of business intelligence.

    +   - The low maturity level of Information and Communication Technology (ICT)
    systems in small and medium-sized industrial enterprises poses a significant challenge
    to these enterprises in adopting business intelligence.'
