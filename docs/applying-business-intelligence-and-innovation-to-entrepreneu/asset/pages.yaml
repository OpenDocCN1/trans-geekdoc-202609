    with its field of activity. This data is then organized, analyzed, processed,
    and transformed into useful information in the management process and the making
    of correct decisions, thus creating knowledge. The following sequential stages
    are followed:


    +   * Data collection and integration from various available sources, relying
    on ETL, data warehouses, and databases.

    +   * Data analysis, organization, information production, and the preparation
