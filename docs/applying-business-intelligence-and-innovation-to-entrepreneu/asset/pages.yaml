    Analysing Sustainable Business Operations (SBO), which combines business management
    and sustainable business management, is yet another method of evaluating the sustainability
    of startups. SBO specifically examines how elements such as opportunities, environmental
    conditions, and economic progress are taken care of (Belz & Binder, 2017).SBO
    specifically evaluates social responsibility, economic performance, and environmental
    protection (Kuckertz & Wagner, 2010) and further accepts a public responsibility
    that involves environmental and social entrepreneurs since it provides continual
    care.


    # SCIENCE, TECHNOLOGY, INNOVATION, AND ENTREPRENEURSHIP POLICY FRAMEWORKS


    The activities of its stakeholders are directed by specific policy support in
    order to create an environment that can promote innovations. The push toward technology-driven
    activities has been the focus of worldwide science, technology, and innovation
    policy in the previous two decades due to the rise in the number of technology
    entrepreneurs. The bulk of policy tools attempts to lower regulatory barriers
    to entrepreneurship due to the high risk involved and the longer gestation period
    in the technology-driven entrepreneurial process. It entails aiding in the form
    of improved access to money, information, and training while fostering an entrepreneurial
    culture. The support systems and fresh stakeholders that are available to technology-driven
    entrepreneurs have changed the entrepreneurial environment. The regional economies
    have been more significantly impacted by technological entrepreneurship Global
    Startup Ecosystem Report (2023). Due to this, regional economic strategies have
    been altered to incorporate entrepreneurial activities.


    Adding the entrepreneurial economy model to the current science, technology, and
    innovation policies will cause volatility. Innovation is required in the setting
    of competitive dynamics in place of assurance and customization is required in
    place of expertise. The science, technology, and innovation policies, up until
    recently, were centered on the work being done in the specialist fields. However,
    as the economy shifts toward unpredictability, the entrepreneurial stakeholders
    must adapt and customize in order to master the art of flexibility (Nicotra et
    al., 2018; Romano et al., 2014). Interventions in policy must be adjusted with
    the necessary indicators.


    It is also important to focus on specific initiatives that can support technology
    entrepreneurs by developing a structure of hand-holding support throughout various
    phases of venture growth over an extended period. In order to do this, relevant'
