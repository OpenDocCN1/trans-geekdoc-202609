  md: '# 3. CONCEPT OF BUSINESS INTELLIGENCE


    The fundamental aim of business intelligence is to actualize precise, accurate
    and confident decision making. This is while authors argue that business intelligence
    is correlated to competitive intelligence and decision support system because
    the large amount of accurate data that has become more accessible allows business
    intelligence to synchronize (Huang, Savita & Zhong-jie, 2022).


    Business intelligence combines analytic, data mining, data visualization, data
    tools, data infrastructure and best practices to help management and entrepreneurs
    makes more data-driven decision in the short-term and long-term (Horn, 2023).
    Business intelligence is also software that suggests business data and presents
    it in user-friendly views such as report, dashboard, chat, graph, metrics and
    framework. However, business intelligence could be well analyzed in entrepreneurship
    by integrating it with competitive intelligence and decision support system (Zhou,
    San, Liu & Kozyrkov, 2023).


    Holori, Ahmadi, Khanmohammadi, Ranjbar and Kordlouie (2023) averred that business
    intelligence is a fundamental tool that assist management to evaluated business
    information on return on investment, return on equity, return on asset, return
    on capital employed, net present value, cost-benefit analysis and break-even analysis.
    By using the Structural Equation Model, business intelligence could yield tremendous
    output that boost enterprise performance in the small medium enterprise, large
    corporation, multinationals and conglomerates. Entrepreneur decision making should
    be authenticated and optimistic with the intervention of business intelligence.


    The model (Figure 2) illustrated and diagrammatized the business intelligence
    and innovation moderating role on entrepreneurship and management explanatory
    paradigm in the discussion.


    # 3.1. Competitive Intelligence


    Competitive intelligence can be diagrammatized with the phrase ‘know your enemy’
    (Baskin, 2023). Competitive intelligence is not only utilized in profit-for-making
    business is also adopted by the military (for defense intelligence), medical personnel
    (for diagnostics, clinical findings and result analytic and information storage),
    institution (for tracking bench marking growth and comparative analysis on activity
    based trend) (Cekuls, 2022). This is the essence it is also regarded as corporate
    intelligence because of the aid to generate data, environmental scanning, scientific
    systematic investigation of facts and speed in decision making (Taranu, 2023;
    Cloutier, 2013).'
  merge: -1
  img_proc: true
