    For the treatment to prevent physical and social illnesses, Islamic civilisation
    built various public health services. The Islamic hammam was the first public
    bathhouse in the Muslim world. There were two types of hammam in the Middle Ages,
    for men and women. Hammam was first introduced in Syria during the era of the
    Umayyad Caliphate in the 6th century, during the Roman period. During the Umayyad
    period (661-750 AD), public baths, called Islamic hammams, proliferated in the
