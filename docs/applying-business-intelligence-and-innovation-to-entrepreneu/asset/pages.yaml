  md: '# # HYPOTHESES DEVELOPMENT


    # # Proxies of Environmental Sustainability in Organizations: Sustainability Expenditures
    and Measurement of Nitrogen Emissions


    Wang et al. (2022) considered the yearly increase in environmental protection
    spending as a proxy variable for environmental protection investment, indicating
    a potential link between education and environmentally friendly behaviors among
    CEOs. Moreover, Lu et al. (2020) highlighted the significance of leveraging the
    synergistic effect of environmental protection investment and technological innovation
    to promote corporate performance, underscoring the strategic implications of integrating
    environmental protection expenditure with innovation efforts.


    Yang et al. (2020) found that organizational management has a significant positive
    impact on enterprise environmental protection investment and financial performance,
    emphasizing the importance of leadership in driving environmental protection expenditure.


    The production-based nitrogen emissions of the textile industry have a significant
    impact on environmental sustainability. This sector faces considerable challenges
    due to the substantial emissions of sulfur dioxide and nitrogen oxide during the
    production phases. These emissions can have negative effects on air quality, climate
    change, and human health. Therefore, it is essential to address these issues and
    work towards sustainable and eco-friendly production methods in the textile industry.Guo
    et al. (2023) emphasize the environmental significance of nitrogen emissions in
    textile manufacturing. Knowledge-based nitrogen management is crucial in mitigating
    greenhouse gas emissions and reactive nitrogen pollution. Xia et al. (2017) found
    the significance of this approach for environmental sustainability in agricultural
    systems. This understanding can be applied to the textile sector, as effective
    nitrogen control can help lessen negative environmental effects (Qian and colleagues.
    Qian et al. (2020) examined how textile products affected the environment and
    stressed the need to evaluate and account for the chemical footprint—including
    nitrogen emissions—during the production phase of the textile life cycle.


    # ## Effects of Transformational Leadership on Environmental Sustainability


    The role of leadership in promoting sustainability extends beyond the internal
    organizational environment. It has been suggested that leadership support can
    compensate for a lack of clear sustainability goals and direction, emphasizing
    the crucial role of leadership in driving sustainability strategies (Wolf, 2011).
    In sustainable'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'competitive advantage, good leadership and effective strategy implementation
    have been proposed as key factors that can lead corporate environmental activities
    to sustainable competitive advantage (Amoako, 2019).


    Suphattanakul (2017) identified the impact of transformational leadership on organizational
    performance and its role in creating strategic organizational change, emphasizing
    its relevance for strategic implementation. Additionally, Schlosser and Volkova
    (2022) emphasized the alignment of transformational leadership with the greater
    good, indicating its potential to drive strategic leadership practices that deliver
    shared value. Transformational leadership has the potential to influence strategic
    outcomes within firms, and transformational leadership also influences the environmental
    sustainability outcomes of the firms.


    Transformational leadership is in the figure gathered under the so-called four
    I''s. These five I''s (Idealized Influence (II), Inspirational Motivation (IM),
    Intellectual Stimulation (IS), and Individual Attention (IO)) in transformational
    leadership are effective in environmental sustainability.


    Idealized Influence (II) (Attribution and behavior) contains charisma or idealized
    influence. Idealized Influence, a key component of transformational leadership,
    has significantly influenced environmental sustainability within organizations
    (Singh et al., 2020). Furthermore, Zong-Bo et al. (2020) emphasized the role of
    environmentally specific transformational leaders in acting as role models for
    employees by demonstrating environmental sustainability ideas and encouraging
    environmentally friendly actions, which aligns with the concept of idealized influence
    (Li et al., 2020). As a result, leadership support by transformational leaders,
    including actively demonstrating the importance of sustainability by managers-attribution,
    impacts pro-environmental behavior in the workplace, indicating the potential
    influence of idealized influence on promoting environmental sustainability (Wesselink
    et al., 2017).


    The relationship between Inspirational Motivation (IM) and environmental sustainability
    has been a topic of interest in the literature. Xenikou and Simosi (2006) emphasized
    the indirect positive impact of transformational leadership on performance, suggesting
    its potential influence on environmental sustainability through IM. Additionally,
    some writers proposed that environmental innovation indirectly impacts sustainable
    leadership on environmental performance, suggesting the potential contribution
    of IM to the promotion of environmental innovation and, by extension, sustainability
    (Cho & Kao, 2022; Iqbal et al., 2021). Additionally, they discovered that transformational
    leadership has a strong positive impact on organizational commitment, which may
    use IM to support environmental sustainability (Cho & Kao, 2022). Furthermore,
    Erat et al. (2020) emphasized the connection between sustainable organizational
    identity and transformational leadership, suggesting that IM may impact forming
    organizational values that align with sustainability.'
