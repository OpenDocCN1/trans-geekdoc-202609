    # CHAPTER BACKGROUND


    Field experiments have shown that small and medium-sized industrial enterprises
    tend to use various technologies encompassed within BI, seeking to acquire a level
    of flexibility towards market requirements and to respond to continuous changes
    in their external business environment. The use of these technologies enables
    them to have organizational capabilities that lead to a constant sensing of available
    opportunities and threats. Consequently, they have begun to support the idea of
    acquiring and exploiting data and information assets (internal and external) as
    factors that effectively contribute to creating and strengthening competitive
    advantages in a sustainable manner. (Rao-Graham, McNaughton, & Mansingh, 2020,
    p. XIII) As is known, small and medium-sized industrial enterprises possess a
    nature characterized by agility and mobility, primarily resulting from the simplicity
    of their organizational structure due to their small size. This makes it easier
    for them to adopt process-centered organization, which is more adaptable to external
    environmental conditions over time. Additionally, small and medium-sized industrial
    enterprises mostly adopt one of three types of manufacturing systems: the job
    shop, the flow shop, and the Cellular shop. These manufacturing systems endow
    them with many characteristics associated with the strategic triangle: low cost,
    high quality, and timeliness. For example, the job shop, due to its technical
    characteristics and structural composition, enables small and medium-sized industrial
    enterprises to easily and quickly modify and change the type, number, and characteristics
    of their products, thus giving them an extremely organizational agility and the
    ability to'
