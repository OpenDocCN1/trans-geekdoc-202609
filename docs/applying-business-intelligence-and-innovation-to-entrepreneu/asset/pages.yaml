- pgno: 242
  md: '# Chapter 10


    # Impact of Board of Directors Composition, Activity, and Compensation on the
    ESG Performance in an International Context


    Tijani Amara

    Higher Institute of Business Administration, University of Gafsa, Tunisia


    Ali Ahmadi

    https://orcid.org/0000-0002-2170-941X

    Higher Institute of Business Administration, University of Gafsa, Tunisia


    # ABSTRACT


    A growing body of research suggests that the Board of Directors Composition, Activity,
    and Compensation can influence its environmental, social, and governance (ESG).
    This chapter seeks to fill this gap in the literature by testing the impact of
    board size, board meetings, women on the board, executive compensation, and ESG
    controversies on ESG performance. Using one of the largest datasets to date, consisting
    of an unbalanced panel dataset consisting of 31040 firm-year observations from
    5500 listed firms, covering a period of 16 years (2002–2017) from 60 countries
    around the world, these findings are fivefold. First, these results suggest that
    board size is positively associated with ESG performance. Second, the authors
    show that the number of meeting of the board per year is positively related to
    the environmental, social and governance score. Third, the main empirical evidence
    shows that the relationship between women on the board of directors and a firm’s
    ESG performance is a strongly significant. Fourth, these results reveal that executive
    compensation has a positive effect only for some geographic areas. Fifth, there
    is a negative link between ESG performance and ESG controversies.


    DOI: 10.4018/979-8-3693-1846-1.ch010'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# # INTRODUCTION


    A company''s performance essentially depends on the board of directors (Merendino,
    & Melville, 2019), given that they are responsible for approving and overseeing
    the implementation of strategic goals, the system of governance and creating company
    culture (Castellanos, & George, 2020). A successful board of director will also
    make an emphasis on business ethics and corporate responsibility (Qa''dan,& Suwaidan,
    2019). An increasing amount of research finds a strong positive relationship between
    a firm''s sustainability performance and profitability: companies with high sustainability
    ratings significantly out perform their counterparts both in terms of stock market
    value and accounting performance (Birindelli et al., 2018). In other terms, adopting
    environmental, social and governance (ESG) best practices leads to a long-term
    competitive advantage.


    Based on these considerations, this study aims to identify the characteristics
    of the board of directors, which raise environmental social governance performance.
    More specifically, according to the existing literature (Qa''dan,& Suwaidan, 2019;
    Xie et al., 2019; Arayssi et al., 2020; Armstrong, 2020; Harjoto, & Wang, 2020)
    our analysis examines the impact of a board''s characteristics (gender diversity,
    size, activity, compensation and ESG controversies) on ESG performance in a sample
    of 31.040 observations from 60 countries from 2002 to 2017. Our focus on this
    sample allows for a more homogeneous reference population and is important because
    these high number a firms present one of the main economic drivers in their economies
    which can enhance the transition towards a more inclusive and sustainable economy
    Rajesh, (2020). To proxy a firm''s sustainability performance, we use Thomson
    Reuters'' ESG Asset4 score, a broad and verified measure of CSR performance adopted
    by scholars both for financial (Hübel, & Scholz, 2020; Kiriu, & Nozaki, 2020)
    and non-financial firms (Jackson et al., 2020; Beretta et al., 2020; Hedqvist,
    & Larsson, 2020; Jahmane, & Gaies, 2020; Arayssi et al., 2020).


    Our main empirical evidence shows that there is a non-linear relationship between
    women on the board of directors and a firm''s ESG performance. This study contributes
    both to academic literature and to firm practices in several aspects. Indeed,
    current literature on the topic (relationship between board composition and ESG
    performance) primarily concentrates on non-financial firms (Qa''dan, & Suwaidan,
    2019; Arayssi, et al., 2020; Wong et al., 2020, Plastun et al., 2020; Alessandrini,
    & Jondeau, 2020; Ng et al., 2020).


    The remainder of the paper is organized as follows. Section 2 presents the literature
    review and the research hypotheses. Section 3 discusses the research method, including
    the sampling procedure, the measurement of dependent and independent variables
    and the methodology used. Section 4 shows and discusses the results, and finally,
    Section 5 presents the conclusions.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# LITERATURE REVIEW AND HYPOTHESES DEVELOPMENT


    The variables most widely used in the literature to describe the impact of corporate
    governance on ESG performance are related to board size, board gender diversity,
    the number of board meetings per year, board compensation, and the score of ESG
    controversies. In the sub-sections below, we develop our hypotheses for each of
    these characteristics of corporate governance.


    # Board Size


    Board size has mostly been studied as to its relationship to firm performance.
    Empirical studies can be classified into two categories: a first stream of research
    is in favour of smaller boards, whereas a second school of thought advocates larger
    boards. Since the firms in our sample are listed, and are therefore large and
    complex financial institutions that work in a context of intense regulation, we
    expect that larger boards will be more efficient, especially in terms of workload
    and responsibility allocation, and of greater diversity in terms of stakeholder
    representation, when improving ESG performance (Albitar et al., 2020; Zubeltzu-Jaka
    et al., 2020; Arayssi et al., 2020). Our hypothesis agrees with the findings of
    previous studies that show a positive relationship between board size and the
    breadth of sustainability practices (Baraiabar-Diez, & Odriozola, 2019; Harjoto,
    & Wang, 2020; Albitar et al., 2020). Based on the previous considerations, the
    following hypothesis is proposed for testing:


    **Hypothesis 1.** *Board size affects positively the ESG performance.*


    # Board Meetings


    For the number of board meetings per year, which is usually used as a proxy for
    the level of board activity and board diligence (Baraiabar-Diez, & Odriozola,
    2019; Bravo, & Reguera-Alvarado, 2019), there is also no consensus about impact
    on non-financial performance. Since the firms in our sample work in a dynamic
    business environment, which requires increased meeting frequency to ensure legitimacy,
    legitimacy theory provides the basis for proposing a positive relationship between
    board meeting frequency and ESG performance. Our hypothesis aligns with the studies
    that find a positive relationship between the number of board meetings and sustainability
    practices (Ismail, et al., 2019; Bravo, & Reguera-Alvarado, 2019; García Martín,
    & Herrero, 2020). Based on the previous considerations, the following hypothesis
    is tested:


    **Hypothesis 2.** *The number of board meetings affects positively the ESG performance.*'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# Women on the Board


    Interpretations of the relationship between women on the board and ESG performance
    are connected to the various features of the women themselves. There seems to
    be a general consensus in the literature regarding the positive impact of female
    directors on sustainability performance. More in detail, women on boards positively
    impact the firm’s charitable contributions (Bettinelli et al., 2019; Furlotti
    et al., 2019; Abd Rahman et al., 2019), apprehension for climate change (Birindelli,
    et al., 2019) and reputation-based CSR measures (Ajaz, et al., 2020). Similarly,
    many studies find that board gender diversity increases the extent of social and
    environmental reporting and decreases environmental lawsuits (Yuan et al., 2019;
    Peng, 2020). A likely explanation of these inconsistent results could be the presence
    of a non-linear relationship between board gender diversity and social and environmental
    performance. Based on their findings, some studies such those of (Birindelli et
    al., 2019; Furlotti et al., 2019; Ajaz et al., 2020; Peng, 2020) point out that
    a high level of presence of women on the board improve the ESG performance. In
    consideration of this evidence, we advance the following hypothesis:


    *Hypothesis 3. I high level of gender diversity affects positively the ESG performance*


    # Executive Compensation


    The provision of ESG based sustainable compensation policy is likely to play a
    critical role in motivating corporate executives to undertake carbon initiatives,
    which can in turn enhance both organizational legitimacy and market value. As
    part of sustainable corporate strategies, corporations are increasingly using
    sustainable compensation policy to motivate executives to pursue social and environmental
    projects. Empirically, Baraiabar-Diez et al., (2019); Eklund, (2019); Haque, &
    Ntim., (2020) find that sustainable compensation schemes improve the ESG performance.
    We argue, therefore, that in the presence of a sustainable compensation policy,
    the board of directors and the compensation committee of the board might be in
    a better position to evaluate the environmental, social and governance attributes
    of a firm to design a more effective which may enhance corporate carbon performance.
    Therefore, any symbolic ESG compensation policy, without requiring explicit guidelines
    and mandatory emission reduction targets, might enhance process-oriented ESG performance
    of the firm (Westling, & Mazhari, 2019; Baraiabar-Diez et al., 2019). Thus, we
    advance the following hypothesis:


    **Hypothesis 4.:** Executive compensation affects positively the ESG performance'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# ESG Controversies


    ESG score is traditionally seen as a tool to influence stakeholders. The topic
    of the ESG controversies related to environmental, social and governance issues
    was investigated in the literature because of the assumed negative impact that
    the ESG problems or weaknesses may have on the corporate financial results and
    the need to deal with them (Iamandi et al., 2018; Markopoulos et al., 2020; Li
    et al., 2020). The more a company is seen as virtuous, the more likely it is to
    be appreciated by consumers, employees, and investors. Most importantly, when
    such virtues are disclosed by external sources such as the media, they build both
    reputation and credibility (Javedt et al., 2020). The ESG controversies are usually
    based on public or media disclosure of ESG-related corporate scandals, Utz, (2019);
    Aouadi, & Marsat, (2018) interestingly found a negative impact of ESG controversies
    over the firm ESG performance. Taking as a whole, one could expect the following
    hypothesis.


    **Hypothesis 5.: ESG controversies have a negative impact ESG performance**


    # RESEARCH METHODOLOGY


    # Sample Selection and Data Sources


    Our initial sample was based on the availability of ESG data in the Thomson Reuters
    Asset4 database and Thomson Reuters Eikon. We started with all the available sample
    of 35000 firm-year observations from nonfinancial firms listed on the main stock
    exchanges of 60 countries included in the panel A of table 1. We then removed
    4960 observations with missing firm-level data relating to the dependent or independent
    variables used in our explanatory models. Our final sample is based on an unbalanced
    panel dataset consisting of 31040 firm-year observations from 5500 listed firms,
    covering a period of 16 years (2002–2017). Table1 shows the annual- and country-wise
    distribution of the sample. We used the Asset4 dataset and the Thomson Reuters
    Eikon to collect ESG score and corporate governance data. The ASSET4 database
    from Thomson Reuters is utilized in our research because it is readily available
    for many investors and scholars.


    # Dependent Variable


    To test our hypotheses, we used data on ESG performance (ESG SCORE) from Asset4.
    This score is based on three dimensions: environmental, social and corporate governance.
    ESG performance measures a company’s capacity to reduce environmental emissions,
    to efficiently use natural resources in the production'
