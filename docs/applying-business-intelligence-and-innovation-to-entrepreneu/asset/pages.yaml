    # CONCLUSION


    The absence of knowledge about universal criteria that make systematic reviews
    reproducible and sufficiently scientifically shown is often evident. The PRISMA
    framework provides a recognised, peer-reviewed method based on a best-practice
    checklist. 23 articles are extensively reviewed by the authors out of 306 articles.
    Only 8 studies (which makes 57% of the total) are done in Asian countries (which
    is highest among all the continents). It is relatively new in the literature of
    business and management to discuss entrepreneurial orientation and business intelligence
    and thus only a few articles have been shortlisted in this study. Also, year wise
    the rate of article publication is slow according to the trending line.


    In the information systems sector, BI is a developing area that focuses on developing
    and using information technologies. It has been observed that not much study has
    been done on the influence of BI on EO. Although related studies have been identified
    based on this topic like big data analytics, strategic intelligence, business
    analytics, market intelligence and their impact on entrepreneurship or small business
    enterprise or any business. These are either the components of BI or are related
    to it directly or indirectly. The use of BI tools for entrepreneurial activities
    can enhance an organizations competitiveness which can have impacts, on the nations
    position, in the market. BI has a major impact on entrepreneurship via thinking,
    decision-making, and influencing possibilities. Universities, software development
    firms, and entrepreneurs are all impacted by the practice-based, evolutionary
    digital revolution in entrepreneurship. Innovation development, skills upgrading,
    and data-driven orientation may be strategically integrated to foster innovation
    and take advantage of technological opportunities. By expediting the processes
    of data gathering, analysis, and decision-making, digitization enhances business
    intelligence. EO is taking calculated risks and being creative in order to effect
    change within the firm or industry. BI and EO have a big impact on each other,
