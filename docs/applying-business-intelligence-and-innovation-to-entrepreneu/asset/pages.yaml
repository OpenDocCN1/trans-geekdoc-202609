  md: 'processes and to support the research and development of eco-efficient products
    and services. Social performance measures a company’s capacity to generate trust
    and loyalty in its workforce, to respect the fundamental conventions on human
    rights, to be a good citizen, to protect public health, to respect business ethics
    and to create value-added products and services.


    Following the literature Dalal & Thaker, (2019); Eliwa et al., (2019); Lopez de
    Silanes et al., (2019) our study measures the level of ESG performance by calculating
    the arithmetic mean of the three scores: social, environmental and corporate governance.
    The overall ESG SCORE is expressed as a percentage ranging from 0 to 100 percent.
    In an attempt to capture the impact of board characteristics on ESG performance
    with time for the effects to appear and lessen endogeneity problems, governance
    variables of any year are related to the ESG measure of the following year.


    # Independent Variables


    The independent variables included in our econometric models are the board size,
    the share of women on the board of directors, executive compensation, number of
    board meetings per year and the ESG controversies score.


    The next section will test the hypotheses regarding the effect of the board characteristics
    on the ESG SCORE, using panel data analysis. We estimate the following models
    to measure the relationship between ESG performance and independent variables:


