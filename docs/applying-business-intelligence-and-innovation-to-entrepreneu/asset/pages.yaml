    # CONCLUSION


    Based on prior literature demonstrating that boards play a key monitoring role
    in financial institutions, this study investigates the relationship between board
    composition (size, activity, gender diversity and compensation) and sustainability
    performance in a large sample of 31040 observations for 5500 listed firms for
    the period 2002–2016.


    Main findings reveal that size, activity, gender diversity and compensation are
    positively impacts a firm''s ESG performance for all models regression for the
    whole the sample full set either for each geographic area. For this reason, we
    support the critical perspective that emphasizes board characteristics, such as
    board size, number of meetings, share of women in the board and executive compensation
    are very important to enhancing a firm''s ESG performance. The empirical results
    of this research present a significant effect of ESG controversies on the ESG
    performance. This shows that the importance of this variable on ESG performance
    would be even more pronounced if the region were to implement stronger corporate
    governance measures. Since this variable is significant in forming a good reputation
    and encouraging the firm to be more involved in societal, environmental and governance
    activities and performance, firms should strive to increase their ESG score.


    This study has important implications, especially for managers and regulators.
    From a managerial point of view, our work suggests that managers and CEOs should
    pay more attention to the number of meetings per year, the board size and gender
    diversity of their boardrooms. To enhance sustainability performance, it is important'
