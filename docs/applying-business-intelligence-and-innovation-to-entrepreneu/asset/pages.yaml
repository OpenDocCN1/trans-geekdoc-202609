  md: 'Intellectual Stimulation (IS) means that the manager stimulates employees to
    become more creative and innovative through, among other things, linguistic guidelines.
    The intricate and diverse topic of the relationship between individual creativity
    and environmental sustainability has attracted interest from a wide range of academic
    fields. Awan et al. (2019) emphasized the critical role of creativity in addressing
    environmental sustainability, particularly in the context of green innovation.
    They offer a broadly applicable paradigm that illustrates how creativity fosters
    green innovation and can positively impact sustainability. This suggests that
    individual creativity, when integrated into organizational practices, can contribute
    significantly to environmental sustainability (Souto, 2022). Additionally, Moraru
    (2021) (Moraru, 2021) highlights the potential link between individual creativity
    and environmental sustainability, suggesting that creativity can be linked to
    environmental and economic sustainability and the dimensions of social and human
    sustainability. In conclusion, Intellectual Stimulation (IS) can positively impact
    environmental sustainability, highlighting the potential of individual creativity
    as a driver for sustainable development.


    Individual Attention (IO) is about individual attention and seeing the employees.
    Transformational leaders focus on employees'' needs for growth and development
    by acting as mentors or coaches. In that sense, mentorship plays a crucial role
    in fostering environmental sustainability within organizations. Reddy et al. (2021)
    emphasized the importance of peer-to-peer or collaborative mentorship relationships
    in promoting sustainable practices among employees. Similarly, Erhabr (2018) underscores
    the integral role of mentorship programs in developing effective environmental
    leaders, indicating the potential of mentorship in cultivating individuals who
    can drive sustainability initiatives within organizations. These references collectively
    suggest that mentorship, particularly in peer-to-peer or collaborative relationships,
    is instrumental in influencing employee adoption of sustainability practices.


    Furthermore, the literature in this chapter suggests that transformational leadership
    can indirectly affect organizational performance through various mediating variables.
    For example, Çop and friends (2021) emphasized that transformational leaders provide
    environmentally sustainable results by engaging employees in both the organization''s
    activities and the environment. Moreover, Suliman et al. (2023) found that transformational
    leadership increases the total environmental sustainability performance of the
    organizations; however, they did not specify the environmental performance indicators.


    **H1:** Transformational leadership increases environmental sustainability in
    organizations. More clearly, TL increases environmental protection expenditures
    and decreases Production-based nitrogen emissions in organizations.'
