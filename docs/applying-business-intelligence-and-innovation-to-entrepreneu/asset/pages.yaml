    # THE CONNECTION BETWEEN BUSINESS INTELLIGENCE (BI) AND ENTREPRENEURIAL ORIENTATION
    (EO)


    Since entrepreneurial orientation and business intelligence are relatively new
    topics in the academic arena, there aren’t many empirical studies that demonstrate
    their direct correlation. A study (Caseiro & Coelho, 2018) explored among various
    firms located in different European countries and stated that how business intelligence
    (BI), entrepreneurial orientation (EO), and startup competitiveness are related
    to one another. It does this by looking at how EO influences BI’s impact on startup
    competitiveness as well as how BI directly influences it. Because business intelligence
    entails using information to make better decisions, which can affect a firm’s
    entrepreneurial orientation, the study predicts a favourable association between
    EO and BI. The competitiveness of a business, which is impacted by EO, might benefit
    from BI techniques and attributes. It is recommended that practitioners increase
    the knowledge of how business intelligence (BI) affects organisational elements
    and think about including BI methods into startup training and information sessions.
    As a result, the indirect correlation between these variables can be shown because
    no more research has been conducted on the direct relationship between EO and
    BI, only other features or sub-themes like big data analysis, business analysis,
    big'
