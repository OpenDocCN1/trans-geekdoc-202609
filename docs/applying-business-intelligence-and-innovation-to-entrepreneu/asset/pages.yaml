    As it is known, the large enterprise differs significantly from the small and
    medium-sized enterprise in terms of its organizational structure, financial and
    human resources, expertise levels, and production and technological capabilities.
    Consequently, the factors influencing the definition and adoption of Business
    Intelligence (BI) systems in SMEs differ radically from those in large enterprises.
    Therefore, it is crucial to establish a specific conceptual framework for BI,
    accurately encompassing the key factors driving the definition and adoption of
    BI in SMEs.


    In Algeria, an industrial SME is defined as an economic entity with a workforce
    ranging from 01 to 250 employees and an annual turnover not exceeding four (04)
    billion Algerian dinars or a total annual turnover of one (01) billion dinars,
    meeting the conditions of independence, and engaging in productive activities
    by transforming raw materials and supplies into semi-finished or finished products.
    (People’s Democratic Republic of Algeria, 2017, p. 5) According to this definition,
    the characteristics of industrial SMEs in Algeria do not differ globally due to
    the convergence of classification criteria, including the number of employees,
    annual turnover, and conditions of independency. Unlike large enterprises, which
    largely rely on extensive capital, technological resources, and human capital,
    SMEs are quite the opposite. Their owners, managers, and employees typically possess
    low levels of awareness and training in effectively utilizing information and
    communication technology (ICT), which is a fundamental pillar in defining and
    adopting BI systems and activating their role in value creation and overall performance
    improvement. Additionally, their ability to finance IT and BI projects is limited
    due to financial constraints.


    Another key factor in defining BI systems suitable for industrial SMEs is the
    low levels of organizational and human knowledge, which determine their ability
    to collect, integrate, analyze, and organize necessary data and information. Furthermore,
    their capacity to design and manage operational processes horizontally and correctly
    integrate them with BI systems to effectively improve value creation is crucial.


    Figure (2) illustrates the different factors associated with the conceptual aspect
    of BI systems, aligned with the nature and characteristics of SMEs.


    The definition of BI as a large structure consisting of devices, tools, techniques,
    computer programs, and the infrastructure of computer-mediated communication is
    determined by specific maturity levels in the practices of managing SMEs for ICT.
    These practices are the cornerstone for the efficient integration and operation
    of these technical elements. Moreover, the technical skills of individuals responsible
    for ICT and BI systems design and operation are also crucial in defining BI for
    SMEs. This ensures the acquisition, analysis, and transformation of various data
    sources'
