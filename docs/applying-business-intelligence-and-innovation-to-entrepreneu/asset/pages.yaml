  md: '# MUSLIM HEALTH TOURISM


    Competition often makes Muslim businesses overspend and overreact to innovate
    new products or services to attract customers. Sometimes, pursuing profits without
    thinking about the hereafter can be overboard, making them lose their true value
    because they are similar or no different from conventional businesses. At the
    same time, a competitive advantage sets a company apart from its competitors in
    the eyes of its consumers.


    People often mistake innovation for something so mind-blowing that it will change
    the way business is run or to make cutting-edge and sophisticated products. However,
    this process can be something simple. Please do not rule out something that seems
    too easy or miss an opportunity right before us while we search for the next big
    thing. After all, innovation is ultimately about giving your customers what they
    need.


    Islam does not disregard innovation. Some terms refer to innovation in Islam.
    Islah, tajdid and ijtihad are good innovations, while bidaah is an innovation
    in religion that can be good or bad. In line with that, before the Muslim health
    tourism business can return to accomplishment and compliance in its fundamental
    framework, it can return outside the market competition arena. It requires a back-to-basics
    approach to innovation, where Muslim health tourism businesses return to focusing
    on perfecting the fundamental areas of their frameworks, i.e. Sharia as Islamic
    law.


    As an example of the application of innovation by returning to Sharia as a basis,
    there is the current development of Muslim health applications and devices, both
    medical and wellness, so there is a need for medical devices to be Halal certified,
    as in research by Sarisae et al. (2023).


    When Islamic values are applied to tourism, there should not be any elements of
    disobedience to Allah ﷻ (The most glorified, the most-highest), even at the level
    of ideas and concepts up to the implementation. However, in Muslim-majority countries
    where religion focuses more on life, spirituality is not seen as an “optional
    extra” (Smith & Puchkó, 2013). The term “Muslim” refers to people who follow Islam.
    Etymologically, Muslim refers to a form of subject or doer of the deeds of Islam,
    and its definition depends on the understanding of Islam itself. Islam is derived
    from the word “Al-Slim” from the Arabic word which means peaceful, happy, obedient,
    and surrender to Allah ﷻ (Pal, 2011).


    Unfortunately, the growing health tourism is seen following secularism’s building
    block and negatively impacts health tourism sustainability. If Muslims continue
    being involved in it, it will become a drawback. This is because, from the beginning
    until now, Islam does not separate religion and world affairs. These two are interrelated
    in Islam. Islam does not accept secularism, which separates religion from worldly
    affairs. Muslim health tourism emerges as a positive alternative to'
