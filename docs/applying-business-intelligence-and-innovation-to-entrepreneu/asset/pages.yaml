    Entrepreneurship has been seen as a generic term which the definition is a matter
    of serious debate because of its blanket nature which enveloped and encompasses
    human endeavour of sustainability, survival and success. The term entrepreneurship
    has capture a lot of interest in various field like management science, social
    science, law, politics, engineering, human resource, health, philosophy among
    others, there remain holism of how the concept should be define (Ratten, 2023).


    Seth (2023) fathoms that Howard Stevenson, known as “the godfather of entrepreneurship
    studies” at Harvard Business School (HBS), has defined it as the “pursuit of opportunity
    beyond resources controlled.” HBS professor Tom Eisenmann elaborates, “beyond
    resources controlled’ implies resource constraints. The Stanford Center for Professional
    Development at Stanford University offers a somewhat simpler definition: At its
    most basic level, entrepreneurship refers to an individual or a small group of
    partners who strike out on an original path to create a new business. An aspiring
    entrepreneur actively seeks a particular business venture and it is the entrepreneur
    who assumes the greatest amount of risk associated with the project. As such,
    this entrepreneur also stands to benefit most if the project is a success.


    Every entrepreneurs need to learn how to navigate with potentials and capabilities
