- pgno: 90
  md: '**Sustainable and Ethical Practices;** In an era where sustainability and ethical
    considerations are fundamental, in business practices, the implications of OSCM
    extend into responsibility. Entrepreneurs who embrace ethical practices in their
    supply chains not meet the expectations of socially conscious consumers but also
    foster long-term trust and reputation, for their brands. The connection between
    these practices and corporate social responsibility (CSR) theories as ethical
    supply chain management frameworks is supported by scientific research (Mani et
    al., 2020). CSR theories emphasize the significance of businesses contributing
    to societal well-being beyond profit making (Brin & Nehme 2019). By implementing
    practices in operations and supply chain management that consider social impacts
    entrepreneurs position themselves as responsible corporate citizens. Ethical supply
    chain management frameworks, such as the UN Global Compact offer guidance to businesses
    in ensuring practices throughout their supply chains. Entrepreneurs who incorporate
    these frameworks into their strategies contribute to ethical entrepreneurship.


    **Data-Driven Decision-Making:** Furthermore, the implications of operations and
    supply chain management extend to data-driven decision-making for entrepreneurs.
    By leveraging advancements and utilizing data analytics within their supply chains
    entrepreneurs gain insights. This scientific relationship aligns with the principles
    of data-driven decision-making, which emphasize using data and analytics to inform
    choices. From a perspective integrating data analytics into operations and supply
    chain management resonates with business intelligence principles and decision
    support systems. Business intelligence utilizes data analysis tools to provide
    insights, for decision making whereas decision support systems (Nikiforova et
    al., 2022).


