  img_proc: true
- pgno: 277
  md: 'implementing any economic foreign policy. This process promotes consensus between
    the British government and society and promotes the British government''s determination
    to maintain British business in China. However, for China, due to the absence
    of a public sphere where the central government interacts with society, even though
    Chinese private business groups have huge interests overseas, the state and society
    have always been unable to form a positive interaction. At the same time, this
    situation also results in Chinese businesses in the Philippines having to rely
    on their abilities to maintain their local interests.


    # INTRODUCTION


    For a long time, the interaction between the state and society has been a concern
    of most scholars, and the political decisions or foreign policies made by the
    central government as a representative of the state have more or less influenced
    the interests of different groups in society. Especially in the economic aspect,
    whether the state takes into account the interests of private business groups
    in the “public interest” is the key to positive interaction. Generally speaking,
    ‘public interest’ is considered a national interest. If a state wants to effectively
    mobilize its members of society, it must have the ability to take into account
    the “public interest” of the majority of its members. According to Mike Feintuck’s
    discussion of “public interest”, it can be found that “public interest” roughly
    has three functions. The first function, public interest, is as a means of legitimizing
    intervention in private behavior. To shape citizens who are highly bound to their
    relationships, the state will attempt to change their living conditions to possess
    the core values of the state. The second type of governance and function, “public
    interest”, is the function of the “arena”, that is, the ability of the “public
    interest” represented by national interests. In other words, to what extent do
    national interests represent the ‘public’? The third function is whether social
    actors can consciously represent the “public interest” and interact with the state
    (Feintuck, 2014). However, if we consider private business groups as a part of
    society. So why do some countries strongly support this group, so that the interests
    of the state and society are effectively bound together? However, in some countries,
    conflicts between the state and society arise due to differences in their interests
    and private business groups.


    During the period from the 19th century to the early 20th century, as one of the
    most important countries in the world at that time, Britain not only could safeguard
    national interests overseas but also greatly protected the interests of British
    business in China. For example, when discussing the issue of raising tariffs on
    China with the Chinese government, the British government not only solicited opinions
    from British business organizations in China, such as the Shanghai Branch of the
    China'
