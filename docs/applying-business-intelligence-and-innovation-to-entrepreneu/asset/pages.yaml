  md: '# MUSLIM HEALTH TOURIST BEHAVIOUR MODEL


    Muslim health tourism behavior model is a reasonably straightforward means of
    identifying the level of Muslim tourist commitment towards selecting and purchasing
    a product or service for health tourism both for the purposes of preventing disease
    (Muslim wellness tourism) and treating disease (Muslim medical tourism). making
    this model more specific and different from other types of halal tourism. Amid
    the urgency to understand Muslim health tourists as a potential market with such
    unique characteristics, terms, and specific needs, it is unfortunate that we have
    not developed a unique model that describes the decision-making behaviour of Muslim
    health tourists regarding choosing a Muslim-friendly health destination. Therefore,
    the author proposes a “Muslim Health Tourist Behavior Model,” shown in Figure
    1. The model shows three main things underlying the behaviour of Muslim health
    tourists. The three are the testament of the Prophet Muhammad ﷺ (Hadith narrated
    At-Tirmidzi). As part of worship, Allah ﷻ commands healthy travel to increase
    the balance in the vertical relationship (humans and Allah ﷻ), the horizontal
    relationship (humans to humans), and the diagonal (humans and nature).


    The three relationships consist of the following. First, it is called Habluminaallah
    (God-driven). The significant driving force is (a) religious piety (Taqwa), (b)
    religious obedience (Taat), and (c) piousness (Saleh), each of which is of different
    levels. These are the main drivers of Muslims to choose Muslim-friendly health
    travel over conventional health travel or even controversial one, as to maintain
    the relationship with Allah ﷻ. Second, it is called Habluminnannas (socio-driven).
    These factors contribute to human relationships, including (a) stimuli of Muslim-friendly
    strategic marketing, such as product quality, promotion, price, location, image,
    halal and sharia compliance services, and so forth; (b) Muslim community references
    which refer to recommendation from the Muslim community that may include nuclear
    family, peers, community, scholars and even the government—as the duty of all
    Muslims are Amar makruf nahi munker (enjoying the good and forbid the evil); and
    (c) the motive of Muamalah transactions (business) for health purposes also affect
    the behavior of Muslims. Third, it is known as habluminal’alam (environment-driven),
    which refers to the relationship between humans and nature, i.e., the location
    and the destination of health tourism. The things to consider include (a) the
    merits of a health destination, in which the more efficacious treatment or prevention
    of disease in that destination, the more encouraging it is for tourists to visit;
    (b) Muslim-friendly health destination also plays an essential, in which the better
    the facility accommodates the needs of Muslim tourists, the more encouraging it
    is for Muslim tourists to choose.'
