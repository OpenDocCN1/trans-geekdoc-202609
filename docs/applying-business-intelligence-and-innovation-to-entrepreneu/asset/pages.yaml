  md: '# 2. ENTREPRENEURSHIP AND MANAGEMENT


    Prima facie in the 18th century the Irish economist, Richard Cantillon dive into
    the term “entrepreneur”. Cantillon sees an entrepreneur as the person who buys
    factors services at certain prices with a view to selling its product at uncertain
    prices. But, Joseph Schumpeter deemed to be the father of entrepreneurship as
    argued by most scholars, came up with a paradigm shift with theories and concept
    to develop a modern features and attributes. Schumpeter averred that entrepreneurship
    is a process of creation of both intangible and tangible resource to generate
    wealth. His emphasizes was on the word ‘creation’. This is while the creative
    ability of every entrepreneur is to innovate, brain storm, invent and network
    from the past to the presence and future. This means entrepreneurs are creator
    of resources to satisfied human livelihood in the short-term and long-term. Being
    a creator makes entrepreneurs to becomes a ‘Champion’


    In 2024 Eric Beato from Babson College, the renowned Entrepreneurship Institute
    with championopreneurship trait, laid emphasis on resilience and allship interface
    with championopreneur and leaders on applying business intelligence, creativity
    and innovation to achieve enterprise excellence. Breato (2024) and Ovharhe (2024)
    inclined that these factorial elements are expected to augment vital proceedings
    in empowering, proliferating and advancing infant-childhood, women and youth entrepreneurs
    beyond now and SDG towards championopreneurship. But, for entrepreneurs to be
    experience on sustainability, survival and success in the enterprise, there ought
    to be completive edge, business intelligence and competitive advantage. For these
    to be achieved certain planning, organizing, directing, motivating, staffing and
    control measures need to be in place. This will enable the entrepreneur to set
    metrics on targeted goals, strategies, policy, procedure, budget, implementation,
    monitoring and feedback.


    This led to the synchronization between entrepreneurship and management, just
    as Schumpeter rings the bell of Entrepreneurship, Peter F. Drucker augment management
    with philosophies, theories and new terminologies even different from the founding
    fathers (i.e. Fredrick Taylor, Frank & Lillian Gilbert, Henry Gantt, Henry Fayol,
    Max Weber among others (Showkat, 2022). In this tail of these, Drucker opined
    management as means of delegating responsibility and fiduciary functions (Druker,
    1963).


    The word ‘entrepreneur’ is coined from the French word entreprendre. It means
    ‘to undertake’. Thus, entrepreneur is the person who undertakes the risk. This
    represents that actual characteristic of entrepreneur as been a risk bearer. In
    the same vein the term is still believes to be go or enter (Entre), between (Prendre).
    This portrays entrepreneurs as a change agent, problem solver and decision maker.
    Truly, entrepreneurs are problem solvers by taking risk in between chaos, troubles,
    needs,'
  merge: -1
  img_proc: true
