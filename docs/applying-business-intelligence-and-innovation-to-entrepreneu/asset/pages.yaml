  md: '# 1. OVERVIEW


    Entrepreneurship is the engine house of any merchandising activities and propeller
    of any nation’s economic growth and development. Entrepreneurs determine the flow
    of new blood stream in any enterprise. While management is the coordinating force
    that binds all the activities to ensure there is effectiveness and efficiency
    to achieve the corporate goals. This means the managerial strategies will be able
    to fine-tune the plans, organizing, directing, motivating and control of the input
    resource and projected output to work its achievable concept. Unlike entrepreneurship,
    management exists in form of pyramid on three levels, such the strategic management
    (top management), tactical management (middle management) and operational management
    (lower management). The top management deals with long-term activities: [i.e.
    Director General (DG), Chief Executive Officer (CEO), Managing Director (MD) and
    General Management (GM)]. The middle management entails the intermediate and functional
    departmental activities: i.e. marketing manager, production manager, finance manager,
    logistic manager, sales and distribution management, personnel manager and lot
    more functional managerial level (Coursera, 2023). The operational management
    is the short-term level management that deals with daily activities. They are
    the supervisors and foremen in the enterprise which augment job and task functions.
    They are the power house of the enterprise that executes responsibilities of the
    workforce. In accounting, they are the book keeping, cashier, in marketing they
    are in charge of brand, label, pricing, advertisement. Otherwise, entrepreneurship
    is the propeller of innovation, skills, risk culture passion, vision, dreams and
    journey of the enterprise (Ovharhe, 2023a). Entrepreneur uses intrapreneurs to
    breed fresh thinking and idea to expand, extend, build and develop the business
    enterprise.


    Micheal Dermer in 2023 stresses on the origin of the term ‘Entrepreneur’ emanates
    from the French word, “entreprendre” which means to start executing a generally
    long or complex task. In English, we translate it as “to undertake”. The French
    word comes from Latin (in, en, + prendre) which means to take (Dermer, 2023).
    French and English people use the same word to name the “entrepreneur.” In French,
    the word “entrepreneur” stems from the Latin word inter prehendere, which corresponds
    to the verb entreprendre in French and means “to grab” or “to take control.” During
    the Middle Age, the verb entreprendre in France used to mean “to take challenges
    and control with the mindset of achieving targeted goals, hence French word entreprendre
    could be analyzed as entre-predre. Thus; entre =go; while, predre =between. In
    the broad equation terms, entrepreneurs are individuals that have the ability,
    capability, competence, acumen and skills to go-between where there are needs
    and locked business opportunities with the aid to unveil it for benefits and satisfaction.
    Entrepreneurs have the potentials to develop risk culture with knowledge and talent
    to go between chaotic channel by creating possible remedies'
