    +   3. Impoverished Management (1,1): This pattern of leadership is the unexpected
    in any workplace because it ruins the entire enterprise from the roof to the foundation.
    It poses negation attributes in all ramifications because the concern for people
    is very poor and the concern for productivity is much obscured. It is a type of
    leadership style which occurs where there are high needs for distributive or decentralized
    forms on management. The task, responsibility and job function is specified to
    certain work scope without much interference from the centre. This can occurs
    in holdings and subsidiaries, religious organizations and large conglomerate with
    multi-nationals. This is good for leader where they may be community disturbance,
    turbulence, hazards, pandemic and inconsistency in exchange rate, inflation rate
    and interest rate (Helmold, 2021; Ovharhe et al., 2021). This kind of leadership
    style does not follow the steam of any entrepreneurship pattern, talk less of
    champiopreneurship.'
