    ### Step Three: Model Training


    Prior to actually training your model, you need to split your data. The standard
    practice is to put 80% of your dataset into a training dataset and 20% into a
    test dataset.


    Linear model selection


    As you see in the preceding chart, when lot size increases, home values increase
    too. This relationship is simple enough that a linear model can be used to represent
    this relationship.


    A linear model across a single input variable can be represented as a line. It
    becomes a plane for two variables, and then a hyperplane for more than two variables.
    The intuition, as a line with a constant slope, doesn''t change.


    Using a Python library


    The Python scikit-learn library has tools that can handle the implementation of
    the model training algorithm for you.


    ### Step Four: Evaluation


    One of the most common evaluation metrics in a regression scenario is called root
    mean square or RMS. The math is beyond the scope of this lesson, but RMS can be
    thought of roughly as the "average error” across your test dataset, so you want
    this value to be low.


    ![](Images/image00094.jpeg)


    In the following chart, you can see where the data points are in relation to the
    blue line. You want the data points to be as close to the "average" line as possible,
    which would mean less net error.


    You compute the root mean square between your model’s prediction for a data point
    in your test dataset and the true value from your data. This actual calculation
    is beyond the scope of this lesson, but it''s good to understand the process at
    a high level.


    ![](Images/image00095.jpeg)


    Interpreting Results


    In general, as your model improves, you see a better RMS result. You may still
    not be confident about whether the specific value you’ve computed is good or bad.


    Many machine learning engineers manually count how many predictions were off by
    a threshold (for example, $50,000 in this house pricing problem) to help determine
    and verify the model''s accuracy.


    ### Step Five: Inference: Try out your model


    Now you are ready to put your model into action. As you can see in the following
    image, this means seeing how well it predicts with new data not seen during model
    training.


    ![](Images/image00096.jpeg)


    Terminology


    *   Continuous: Floating-point values with an infinite range of possible values.
    The opposite of categorical or discrete values, which take on a limited number
    of possible values.


    *   Hyperplane: A mathematical term for a surface that contains more than two
    planes.


    *   Plane: A mathematical term for a flat surface (like a piece of paper) on which
    two points can be joined by a straight line.


    *   Regression: A common task in supervised machine learning.


    Additional reading


    The Machine Learning Mastery blog is a fantastic resource for learning more about
    machine learning. The following example blog posts dive deeper into training regression-based
    machine learning models.


    *   How to Develop Ridge Regression Models in Python offers another approach to
    solving the problem in the example from this lesson.


    *   Regression is a popular machine learning task, and you can use several different
    model evaluation metrics with it.


    ## Example Two: Book Genre Exploration


    In this video, you saw how the machine learning process can be applied to an unsupervised
    machine learning task that uses book description text to identify different micro-genres.


    ### Step One: Define the Problem


    ![](Images/image00097.jpeg)


    Find clusters of similar books based on the presence of common words in the book
    descriptions.


    You do editorial work for a book recommendation company, and you want to write
    an article on the largest book trends of the year. You believe that a trend called
    "micro-genres" exists, and you have confidence that you can use the book description
    text to identify these micro-genres.


    By using an unsupervised machine learning technique called clustering, you can
    test your hypothesis that the book description text can be used to identify these
    "hidden" micro-genres.


    Earlier in this lesson, you were introduced to the idea of unsupervised learning.
    This machine learning task is especially useful when your data is not labeled.


    ![](Images/image00098.jpeg)


    ### Step Two: Build your Dataset


    To test the hypothesis, you gather book description text for 800 romance books
    published in the current year.


    Data exploration, cleaning and preprocessing


    For this project, you believe capitalization and verb tense will not matter, and
    therefore you remove capitals and convert all verbs to the same tense using a
    Python library built for processing human language. You also remove punctuation
    and words you don’t think have useful meaning, like ''a'' and ''the''. The machine
    learning community refers to these words as stop words.


    Before you can train the model, you need to do some data preprocessing, called
    data vectorization, to convert text into numbers.


    You transform this book description text into what is called a bag of wordsrepresentation
    shown in the following image so that it is understandable by machine learning
    models.


    How the bag of words representation works is beyond the scope of this course.
    If you are interested in learning more, see the Additional Reading section at
    the bottom of the section.


    ![](Images/image00099.jpeg)


    ### Step Three: Train the Model


    Now you are ready to train your model.


    You pick a common cluster-finding model called k-means. In this model, you can
    change a model parameter, k, to be equal to how many clusters the model will try
    to find in your dataset.


    Your data is unlabeled: you don''t how many microgenres might exist. So you train
    your model multiple times using different values for k each time.


    What does this even mean? In the following graphs, you can see examples of when
    k=2 and when k=3.


    ![](Images/image00100.jpeg)


    During the model evaluation phase, you plan on using a metric to find which value
    for k is most appropriate.


    ### Step Four: Model Evaluation


    In machine learning, numerous statistical metrics or methods are available to
    evaluate a model. In this use case, the silhouette coefficient is a good choice.
    This metric describes how well your data was clustered by the model. To find the
    optimal number of clusters, you plot the silhouette coefficient as shown in the
    following image below. You find the optimal value is when k=19.


    ![](Images/image00101.jpeg)


    Often, machine learning practitioners do a manual evaluation of the model''s findings.


    You find one cluster that contains a large collection of books you can categorize
    as “paranormal teen romance.” This trend is known in your industry, and therefore
    you feel somewhat confident in your machine learning approach. You don’t know
    if every cluster is going to be as cohesive as this, but you decide to use this
    model to see if you can find anything interesting about which to write an article.'
