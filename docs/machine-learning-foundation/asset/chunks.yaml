- raw: "### Step Five: Inference (Use the Model)\n\nAs you inspect the different clusters\
    \ found when k=19, you find a surprisingly large cluster of books. Here's an example\
    \ from fictionalized cluster #7.\n\n![](Images/image00102.jpeg)\n\nAs you inspect\
    \ the preceding table, you can see that most of these text snippets are indicating\
    \ that the characters are in some kind of long-distance relationship. You see\
    \ a few other self-consistent clusters and feel you now have enough useful data\
    \ to begin writing an article on unexpected modern romance microgenres.\n\nTerminology\n\
    \n*   Bag of words: A technique used to extract features from the text. It counts\
    \ how many times a word appears in a document (corpus), and then transforms that\
    \ information into a dataset.\n\n*   Data vectorization: A process that converts\
    \ non-numeric data into a numerical format so that it can be used by a machine\
    \ learning model.\n\n*   Silhouette coefficient: A score from -1 to 1 describing\
    \ the clusters found during modeling. A score near zero indicates overlapping\
    \ clusters, and scores less than zero indicate data points assigned to incorrect\
    \ clusters. A score approaching 1 indicates successful identification of discrete\
    \ non-overlapping clusters.\n\n*   Stop words: A list of words removed by natural\
    \ language processing tools when building your dataset. There is no single universal\
    \ list of stop words used by all-natural language processing tools.\n\nAdditional\
    \ reading\n\nMachine Learning Mastery is a great resource for finding examples\
    \ of machine learning projects.\n\nThe How to Develop a Deep Learning Bag-of-Words\
    \ Model for Sentiment Analysis (Text Classification) blog post provides an example\
    \ using a bag of words–based approach pair with a deep learning model.\n\n## Example\
    \ Three: Spill Detection from Video\n\nIn the previous two examples, we used classical\
    \ methods like linear models and k-means to solve machine learning tasks. In this\
    \ example, we’ll use a more modern model type.\n\nNote: This example uses a neural\
    \ network. The algorithm for how a neural network works is beyond the scope of\
    \ this lesson. However, there is still value in seeing how machine learning applies\
    \ in this case.\n\n### Step One: Defining the Problem\n\nImagine you run a company\
    \ that offers specialized on-site janitorial services. A client, an industrial\
    \ chemical plant, requires a fast response for spills and other health hazards.\
    \ You realize if you could automatically detect spills using the plant's surveillance\
    \ system, you could mobilize your janitorial team faster.\n\nMachine learning\
    \ could be a valuable tool to solve this problem.\n\n![](Images/image00103.jpeg)\n\
    \n### Step Two: Model Training (and selection)\n\nThis task is a supervised classification\
    \ task, as shown in the following image. As shown in the image above, your goal\
    \ will be to predict if each image belongs to one of the following classes:\n\n\
    *   Contains spill\n\n*   Does not contain spill\n\n![](Images/image00104.jpeg)\n\
    \nStep Two: Building a Dataset\n\n*   Collecting \n\n    *   Using historical\
    \ data, as well as safely staged spills, you quickly build a collection of images\
    \ that contain both spills and non-spills in multiple lighting conditions and\
    \ environments.\n\n*   Exploring and cleaning \n\n    *   You go through all the\
    \ photos to ensure the spill is clearly in the shot. There are Python tools and\
    \ other techniques available to improve image quality, which you can use later\
    \ if you determine a need to iterate.\n\n*   Data vectorization (converting to\
    \ numbers) \n\n    *   Many models require numerical data, so all your image data\
    \ needs to be transformed into a numerical format. Python tools can help you do\
    \ this automatically.\n\n    *   In the following image, you can see how each\
    \ pixel in the image on the left can be represented in the image on the right\
    \ by a number between 0 and 1, with 0 being completely black and 1 being completely\
    \ white.\n\n![](Images/image00105.jpeg)\n\nSplit the data\n\n*   You split your\
    \ image data into a training dataset and a test dataset.\n\n### Step Three: Model\
    \ Training\n\nTraditionally, solving this problem would require hand-engineering\
    \ features on top of the underlying pixels (for example, locations of prominent\
    \ edges and corners in the image), and then training a model on these features.\n\
    \nToday, deep neural networks are the most common tool used for solving this kind\
    \ of problem. Many deep neural network models are structured to learn the features\
    \ on top of the underlying pixels so you don’t have to learn them. You’ll have\
    \ a chance to take a deeper look at this in the next lesson, so we’ll keep things\
    \ high-level for now.\n\nCNN (convolutional neural network)\n\nNeural networks\
    \ are beyond the scope of this lesson, but you can think of them as a collection\
    \ of very simple models connected together. These simple models are called neurons,\
    \ and the connections between these models are trainable model parameters called\
    \ weights.\n\nConvolutional neural networks are a special type of neural network\
    \ particularly good at processing images.\n\n### Step Four: Model Evaluation\n\
    \nAs you saw in the last example, there are many different statistical metrics\
    \ you can use to evaluate your model. As you gain more experience in machine learning,\
    \ you will learn how to research which metrics can help you evaluate your model\
    \ most effectively. Here's a list of common metrics:\n\n| Accuracy || False positive\
    \ rate || Precision |\n\n| --- | --- | --- |\n\n| Confusion matrix || False negative\
    \ rate || Recall |\n\n| F1 Score || Log Loss || ROC curve |\n\n|   || Negative\
    \ predictive value || Specificity |\n\nIn cases such as this, accuracy might not\
    \ be the best evaluation mechanism.\n\nWhy not? You realize the model will see\
    \ the 'Does not contain spill' class almost all the time, so any model that just\
    \ predicts “no-spill” most of the time will seem pretty accurate.\n\nWhat you\
    \ really care about is an evaluation tool that rarely misses a real spill.\n\n\
    After doing some internet sleuthing, you realize this is a common problem and\
    \ that Precision and Recall will be effective. You can think of precision as answering\
    \ the question, \"Of all predictions of a spill, how many were right?\" and recall\
    \ as answering the question, \"Of all actual spills, how many did we detect?\"\
    \n\nManual evaluation plays an important role. You are unsure if your staged spills\
    \ are sufficiently realistic compared to actual spills. To get a better sense\
    \ how well your model performs with actual spills, you find additional examples\
    \ from historical records. This allows you to confirm that your model is performing\
    \ satisfactorily.\n\n### Step Five: Model Inference\n\nThe model can be deployed\
    \ on a system that enables you to run machine learning workloads such as AWS Panorama.\n\
    \nThankfully, most of the time, the results will be from the class 'Does not contain\
    \ spill.\n\n![](Images/image00106.jpeg)\n\nBut, when the class 'Contains spill'\
    \ is detected, a simple paging system could alert the team to respond.\n\n![](Images/image00107.jpeg)\n\
    \nTerminology\n\nConvolutional neural networks(CNN) are a special type of neural\
    \ network particularly good at processing images.\n\nNeural networks: a collection\
    \ of very simple models connected together.\n\n*   These simple models are called\
    \ neurons\n\n*   the connections between these models are trainable model parameters\
    \ called weights.\n\nAdditional reading\n\nAs you continue your machine learning\
    \ journey, you will start to recognize problems that are excellent candidates\
    \ for machine learning.\n\nThe AWS Machine Learning Blog is a great resource for\
    \ finding more examples of machine learning projects.\n\n*   In the Protecting\
    \ people from hazardous areas through virtual boundaries with Computer Vision\
    \ blog post, you can see a more detailed example of the deep learning process\
    \ described in this lesson.\n\n# Lesson Review\n\nCongratulations on making it\
    \ through the lesson. Let's review what you learning"
  fmt: "\n### Step Five: Inference (Use the Model)\n\nAs you inspect the different\
    \ clusters found when `k=19`, you find a surprisingly large cluster of books.\
    \ Here's an example from fictionalized cluster #7.\n\n![](Images/image00102.jpeg)\n\
    \nAs you inspect the preceding table, you can see that most of these text snippets\
    \ are indicating that the characters are in some kind of long-distance relationship.\
    \ You see a few other self-consistent clusters and feel you now have enough useful\
    \ data to begin writing an article on unexpected modern romance microgenres.\n\
    \n#### Terminology\n\n*   **Bag of words**: A technique used to extract features\
    \ from the text. It counts how many times a word appears in a document (corpus),\
    \ and then transforms that information into a dataset.\n*   **Data vectorization**:\
    \ A process that converts non-numeric data into a numerical format so that it\
    \ can be used by a machine learning model.\n*   **Silhouette coefficient**: A\
    \ score from -1 to 1 describing the clusters found during modeling. A score near\
    \ zero indicates overlapping clusters, and scores less than zero indicate data\
    \ points assigned to incorrect clusters. A score approaching 1 indicates successful\
    \ identification of discrete non-overlapping clusters.\n*   **Stop words**: A\
    \ list of words removed by natural language processing tools when building your\
    \ dataset. There is no single universal list of stop words used by all-natural\
    \ language processing tools.\n\n#### Additional reading\n\nMachine Learning Mastery\
    \ is a great resource for finding examples of machine learning projects.\n\nThe\
    \ *How to Develop a Deep Learning Bag-of-Words Model for Sentiment Analysis (Text\
    \ Classification)* blog post provides an example using a bag of words–based approach\
    \ pair with a deep learning model.\n\n## Example Three: Spill Detection from Video\n\
    \nIn the previous two examples, we used classical methods like linear models and\
    \ k-means to solve machine learning tasks. In this example, we’ll use a more modern\
    \ model type.\n\n> **Note**: This example uses a neural network. The algorithm\
    \ for how a neural network works is beyond the scope of this lesson. However,\
    \ there is still value in seeing how machine learning applies in this case.\n\n\
    ### Step One: Defining the Problem\n\nImagine you run a company that offers specialized\
    \ on-site janitorial services. A client, an industrial chemical plant, requires\
    \ a fast response for spills and other health hazards. You realize if you could\
    \ automatically detect spills using the plant's surveillance system, you could\
    \ mobilize your janitorial team faster.\n\nMachine learning could be a valuable\
    \ tool to solve this problem.\n\n![](Images/image00103.jpeg)\n\n### Step Two:\
    \ Model Training (and selection)\n\nThis task is a supervised classification task,\
    \ as shown in the following image. As shown in the image above, your goal will\
    \ be to predict if each image belongs to one of the following classes:\n\n*  \
    \ Contains spill\n*   Does not contain spill\n\n![](Images/image00104.jpeg)\n\n\
    #### Step Two: Building a Dataset\n\n*   **Collecting**\n    *   Using historical\
    \ data, as well as safely staged spills, you quickly build a collection of images\
    \ that contain both spills and non-spills in multiple lighting conditions and\
    \ environments.\n*   **Exploring and cleaning**\n    *   You go through all the\
    \ photos to ensure the spill is clearly in the shot. There are Python tools and\
    \ other techniques available to improve image quality, which you can use later\
    \ if you determine a need to iterate.\n*   **Data vectorization (converting to\
    \ numbers)**\n    *   Many models require numerical data, so all your image data\
    \ needs to be transformed into a numerical format. Python tools can help you do\
    \ this automatically.\n    *   In the following image, you can see how each pixel\
    \ in the image on the left can be represented in the image on the right by a number\
    \ between 0 and 1, with 0 being completely black and 1 being completely white.\n\
    \n![](Images/image00105.jpeg)\n\n*   **Split the data**\n    *   You split your\
    \ image data into a training dataset and a test dataset.\n\n### Step Three: Model\
    \ Training\n\nTraditionally, solving this problem would require hand-engineering\
    \ features on top of the underlying pixels (for example, locations of prominent\
    \ edges and corners in the image), and then training a model on these features.\n\
    \nToday, deep neural networks are the most common tool used for solving this kind\
    \ of problem. Many deep neural network models are structured to learn the features\
    \ on top of the underlying pixels so you don’t have to learn them. You’ll have\
    \ a chance to take a deeper look at this in the next lesson, so we’ll keep things\
    \ high-level for now.\n\n#### CNN (convolutional neural network)\n\nNeural networks\
    \ are beyond the scope of this lesson, but you can think of them as a collection\
    \ of very simple models connected together. These simple models are called neurons,\
    \ and the connections between these models are trainable model parameters called\
    \ weights.\n\nConvolutional neural networks are a special type of neural network\
    \ particularly good at processing images.\n\n### Step Four: Model Evaluation\n\
    \nAs you saw in the last example, there are many different statistical metrics\
    \ you can use to evaluate your model. As you gain more experience in machine learning,\
    \ you will learn how to research which metrics can help you evaluate your model\
    \ most effectively. Here's a list of common metrics:\n\n| Accuracy | False positive\
    \ rate | Precision |\n| :--- | :--- | :--- |\n| Confusion matrix | False negative\
    \ rate | Recall |\n| F1 Score | Log Loss | ROC curve |\n|  | Negative predictive\
    \ value | Specificity |\n\nIn cases such as this, accuracy might not be the best\
    \ evaluation mechanism.\n\nWhy not? You realize the model will see the 'Does not\
    \ contain spill' class almost all the time, so any model that just predicts “no-spill”\
    \ most of the time will seem pretty accurate.\n\nWhat you really care about is\
    \ an evaluation tool that rarely misses a real spill.\n\nAfter doing some internet\
    \ sleuthing, you realize this is a common problem and that Precision and Recall\
    \ will be effective. You can think of precision as answering the question, \"\
    Of all predictions of a spill, how many were right?\" and recall as answering\
    \ the question, \"Of all actual spills, how many did we detect?\"\n\nManual evaluation\
    \ plays an important role. You are unsure if your staged spills are sufficiently\
    \ realistic compared to actual spills. To get a better sense how well your model\
    \ performs with actual spills, you find additional examples from historical records.\
    \ This allows you to confirm that your model is performing satisfactorily.\n\n\
    ### Step Five: Model Inference\n\nThe model can be deployed on a system that enables\
    \ you to run machine learning workloads such as `AWS Panorama`.\n\nThankfully,\
    \ most of the time, the results will be from the class 'Does not contain spill'.\n\
    \n![](Images/image00106.jpeg)\n\nBut, when the class 'Contains spill' is detected,\
    \ a simple paging system could alert the team to respond.\n\n![](Images/image00107.jpeg)\n\
    \n#### Terminology\n\n**Convolutional neural networks (CNN)** are a special type\
    \ of neural network particularly good at processing images.\n\n**Neural networks**:\
    \ a collection of very simple models connected together.\n\n*   These simple models\
    \ are called neurons\n*   The connections between these models are trainable model\
    \ parameters called weights.\n\n#### Additional reading\n\nAs you continue your\
    \ machine learning journey, you will start to recognize problems that are excellent\
    \ candidates for machine learning.\n\nThe AWS Machine Learning Blog is a great\
    \ resource for finding more examples of machine learning projects.\n\n*   In the\
    \ *Protecting people from hazardous areas through virtual boundaries with Computer\
    \ Vision* blog post, you can see a more detailed example of the deep learning\
    \ process described in this lesson.\n\n# Lesson Review\n\nCongratulations on making\
    \ it through the lesson. Let's review what you learning\n"
  trans: "\n\n### 第五步：推理（使用模型）\n\n当你检查 `k=19` 时发现的不同簇时，你发现了一个令人惊讶的大型图书簇。以下是虚构簇 #7\
    \ 的一个示例。\n\n![](img/image00102.jpeg)\n\n当你检查上表时，可以看到这些文本片段大多表明角色处于某种异地恋中。你还看到了其他几个自洽的簇，并觉得现在拥有了足够的有用数据，可以开始撰写一篇关于意想不到的现代言情微流派的文章。\n\
    \n#### 术语\n\n*   **词袋**：一种用于从文本中提取特征的技术。它统计单词在文档（语料库）中出现的次数，然后将该信息转换为数据集。\n* \
    \  **数据向量化**：一种将非数值数据转换为数值格式的过程，以便机器学习模型使用。\n*   **轮廓系数**：一个从 -1 到 1 的分数，用于描述建模过程中发现的簇。接近零的分数表示簇重叠，小于零的分数表示数据点被分配到了错误的簇。接近\
    \ 1 的分数表示成功识别出了离散的非重叠簇。\n*   **停用词**：自然语言处理工具在构建数据集时移除的一组单词。没有一份被所有自然语言处理工具通用的通用停用词列表。\n\
    \n#### 扩展阅读\n\nMachine Learning Mastery 是一个寻找机器学习项目示例的绝佳资源。\n\n博文 *How to Develop\
    \ a Deep Learning Bag-of-Words Model for Sentiment Analysis (Text Classification)*\
    \ 提供了一个将基于词袋的方法与深度学习模型相结合的示例。\n\n## 示例三：从视频中检测溢出\n\n在前两个示例中，我们使用了线性模型和 k-means\
    \ 等经典方法来解决机器学习任务。在本示例中，我们将使用一种更现代的模型类型。\n\n> **注意**：本示例使用神经网络。神经网络的工作算法超出了本课程的范围。不过，了解机器学习如何应用于这种情况仍然很有价值。\n\
    \n### 第一步：定义问题\n\n想象你经营一家提供专业现场清洁服务的公司。一位客户——一家工业化工厂——需要对溢出物和其他健康隐患做出快速反应。你意识到，如果能利用工厂的监控系统自动检测溢出物，就能更快地调动清洁团队。\n\
    \n机器学习可能是解决此问题的宝贵工具。\n\n![](img/image00103.jpeg)\n\n### 第二步：模型训练（与选择）\n\n此任务是一项监督分类任务，如下图所示。如上图所示，你的目标将是预测每张图像属于以下哪个类别：\n\
    \n*   包含溢出物\n*   不包含溢出物\n\n![](img/image00104.jpeg)\n\n#### 第二步：构建数据集\n\n*   **收集**\n\
    \    *   利用历史数据以及安全模拟的溢出场景，你快速建立了一个包含多种光照条件和环境下的溢出与非溢出图像的集合。\n*   **探索与清洗**\n\
    \    *   你浏览所有照片，确保溢出物清晰地在镜头内。有可用的 Python 工具和其他技术来提高图像质量，如果你确定需要迭代，稍后可以使用它们。\n\
    *   **数据向量化（转换为数字）**\n    *   许多模型需要数值数据，因此你所有的图像数据都需要转换为数值格式。Python 工具可以帮助你自动完成此操作。\n\
    \    *   在下图中，你可以看到左侧图像中的每个像素如何用右侧图像中 0 到 1 之间的数字表示，其中 0 代表完全黑色，1 代表完全白色。\n\n\
    ![](img/image00105.jpeg)\n\n*   **划分数据**\n    *   你将图像数据划分为训练数据集和测试数据集。\n\n###\
    \ 第三步：模型训练\n\n传统上，解决此问题需要在底层像素之上手工设计特征（例如，图像中显著边缘和角点的位置），然后在这些特征上训练模型。\n\n如今，深度神经网络是解决此类问题最常用的工具。许多深度神经网络模型的结构旨在学习底层像素之上的特征，因此你无需手工设计它们。你将有机会在下一课中深入了解这一点，因此我们目前保持在高层级。\n\
    \n#### CNN（卷积神经网络）\n\n神经网络超出了本课程的范围，但你可以将它们视为一组连接在一起的非常简单的模型。这些简单的模型称为神经元，这些模型之间的连接是称为权重的可训练模型参数。\n\
    \n卷积神经网络是一种特殊类型的神经网络，特别擅长处理图像。\n\n### 第四步：模型评估\n\n正如你在上一个示例中所见，有许多不同的统计指标可用于评估模型。随着你在机器学习方面积累更多经验，你将学会如何研究哪些指标能帮助你最有效地评估模型。以下是常用指标列表：\n\
    \n| 准确率 | 假阳性率 | 精确率 |\n| :--- | :--- | :--- |\n| 混淆矩阵 | 假阴性率 | 召回率 |\n| F1 分数\
    \ | 对数损失 | ROC 曲线 |\n|  | 负预测值 | 特异性 |\n\n在本例这种情况下，准确率可能不是最佳的评估机制。\n\n为什么？你意识到模型几乎一直会看到“不包含溢出物”这一类别，因此任何大部分时间只预测“无溢出”的模型看起来准确率都会很高。\n\
    \n你真正关心的是一种极少漏报真实溢出的评估工具。\n\n经过一些网络搜索，你意识到这是一个常见问题，且精确率和召回率将会有效。你可以把精确率理解为回答“在所有溢出预测中，有多少是正确的？”，把召回率理解为回答“在所有实际溢出中，我们检测到了多少？”。\n\
    \n人工评估发挥着重要作用。你不确定模拟溢出与实际溢出相比是否足够真实。为了更好地了解模型在实际溢出上的表现，你从历史记录中寻找更多示例。这使你能够确认模型表现令人满意。\n\
    \n### 第五步：模型推理\n\n该模型可以部署在支持运行机器学习工作负载的系统上，例如 `AWS Panorama`。\n\n值得庆幸的是，大多数时候，结果将来自“不包含溢出物”类别。\n\
    \n![](img/image00106.jpeg)\n\n但当检测到“包含溢出物”类别时，简单的寻呼系统就能提醒团队做出响应。\n\n![](img/image00107.jpeg)\n\
    \n#### 术语\n\n**卷积神经网络 (CNN)** 是一种特殊类型的神经网络，特别擅长处理图像。\n\n**神经网络**：一组连接在一起的非常简单的模型。\n\
    \n*   这些简单的模型称为神经元\n*   这些模型之间的连接是称为权重的可训练模型参数。\n\n#### 扩展阅读\n\n随着你机器学习旅程的继续，你将开始识别出非常适合机器学习的问题。\n\
    \nAWS 机器学习博客是寻找更多机器学习项目示例的绝佳资源。\n\n*   在博文 *Protecting people from hazardous areas\
    \ through virtual boundaries with Computer Vision* 中，你可以看到本课程中描述的深度学习过程的更详细示例。\n\
    \n# 课程回顾\n\n恭喜你完成了本课程。让我们回顾一下你所学到的内容\n\n"
