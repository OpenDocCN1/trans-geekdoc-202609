    \ the scenes to see what is really happening. We also broke down the different\
    \ steps or tasks involved in machine learning.\n\n*   We looked at three machine\
    \ learning examples to demonstrate how each works to solve real-world situations.\
    \ \n\n    *   A supervised learning task in which you used machine learning to\
    \ predict housing prices for homes in your neighborhood, based on the lot size\
    \ and the number of bedrooms.\n\n    *   An unsupervised learning task in which\
    \ you used machine learning to find interesting collections of books in a book\
    \ dataset, based on the descriptive words in the book description text.\n\n  \
