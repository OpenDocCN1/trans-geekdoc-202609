- raw: "*   First, you start with a block of raw clay. At this stage, the clay can\
    \ be molded into many different forms and be used to serve many different purposes.\
    \ You decide to use this lump of clay to make a teapot.\n\n*   So how do you create\
    \ this teapot? You inspect and analyze the raw clay and decide how to change it\
    \ to make it look more like the teapot you have in mind.\n\n*   Next, you mold\
    \ the clay to make it look more like the teapot that is your goal.\n\nCongratulations!\
    \ You've completed your teapot. You've inspected the materials, evaluated how\
    \ to change them to reach your goal, and made the changes, and the teapot is now\
    \ ready for your enjoyment.\n\n### What are machine learning models?\n\nA machine\
    \ learning model, like a piece of clay, can be molded into many different forms\
    \ and serve many different purposes. A more technical definition would be that\
    \ a machine learning model is a block of code or framework that can be modified\
    \ to solve different but related problems based on the data provided.\n\nImportant\n\
    \nA model is an extremely generic program (or block of code), made specific by\
    \ the data used to train it. It is used to solve different problems.\n\nExample\
    \ 1\n\nImagine you own a snow cone cart, and you have some data about the average\
    \ number of snow cones sold per day based on the high temperature. You want to\
    \ better understand this relationship to make sure you have enough inventory on\
    \ hand for those high sales days.\n\n![](Images/image00076.jpeg)\n\nIn the graph\
    \ above, you can see one example of a model, a linear regression model (indicated\
    \ by the solid line). You can see that, based on the data provided, the model\
    \ predicts that as the high temperate for the day increases so do the average\
    \ number of snow cones sold. Sweet!\n\nExample 2\n\nLet's look at a different\
    \ example that uses the same linear regression model, but with different data\
    \ and to answer completely different questions.\n\nImagine that you work in higher\
    \ education and you want to better understand the relationship between the cost\
    \ of enrollment and the number of students attending college. In this example,\
    \ our model predicts that as the cost of tuition increases the number of people\
    \ attending college is likely to decrease.\n\n![](Images/image00077.jpeg)\n\n\
    Using the same linear regression model (indicated by the solid line), you can\
    \ see that the number of people attending college does go down as the cost increases.\n\
    \nBoth examples showcase that a model is a generic program made specific by the\
    \ data used to train it.\n\n### Model Training\n\nHow are model training algorithms\
    \ used to train a model?\n\nIn the preceding section, we talked about two key\
    \ pieces of information: a model and data. In this section, we show you how those\
    \ two pieces of information are used to create a trained model. This process is\
    \ called model training.\n\nModel training algorithms work through an interactive\
    \ process\n\nLet's revisit our clay teapot analogy. We've gotten our piece of\
    \ clay, and now we want to make a teapot. Let's look at the algorithm for molding\
    \ clay and how it resembles a machine learning algorithm:\n\n*   Think about the\
    \ changes that need to be made. The first thing you would do is inspect the raw\
    \ clay and think about what changes can be made to make it look more like a teapot.\
    \ Similarly, a model training algorithm uses the model to process data and then\
    \ compares the results against some end goal, such as our clay teapot.\n\n*  \
    \ Make those changes. Now, you mold the clay to make it look more like a teapot.\
    \ Similarly, a model training algorithm gently nudges specific parts of the model\
    \ in a direction that brings the model closer to achieving the goal.\n\n*   Repeat.\
    \ By iterating over these steps over and over, you get closer and closer to what\
    \ you want until you determine that you’re close enough that you can stop.\n\n\
    ![](Images/image00078.jpeg)\n\nModel Inference: Using Your Trained Model\n\nNow\
    \ you have our completed teapot. You inspected the clay, evaluated the changes\
    \ that needed to be made, and made them, and now the teapot is ready for you to\
    \ use. Enjoy your tea!\n\nSo what does this mean from a machine learning perspective?\
    \ We are ready to use the model inference algorithm to generate predictions using\
    \ the trained model. This process is often referred to as model inference.\n\n\
    ![](Images/image00079.jpeg)\n\nQuiz\n\nWhich of the following are the primary\
    \ components used in machine learning? (Select Multiple Boxes)\n\n1.  A model\
    \ integrity algorithm\n\n2.  A machine learning model\n\n3.  A model training\
    \ algorithm\n\n4.  A preparation algorithm\n\n5.  A model inference algorithm\n\
    \nThink back to the clay teapot analogy. Is it true or false that you always need\
    \ to have an idea of what your’re making when you are handling your raw block\
    \ of clay?\n\n1.  True\n\n2.  False\n\nAns: B\n\nTerminology\n\nA model is an\
    \ extremely generic program, made specific by the data used to train it.\n\nModel\
    \ training algorithms work through an interactive process where the current model\
    \ iteration is analyzed to determine what changes can be made to get closer to\
    \ the goal. Those changes are made and the iteration continues until the model\
    \ is evaluated to meet the goals.\n\nModel inference is when the trained model\
    \ is used to generate predictions.\n\n# CHAPTER TWO\n\n## Introduction to the\
    \ Five Machine Learning Steps\n\nMajor Steps in the Machine Learning Process\n\
    \nIn the preceding diagram, you can see an outline of the major steps of the machine\
    \ learning process. Regardless of the specific model or training algorithm used,\
    \ machine learning practitioners practice a common workflow to accomplish machine\
    \ learning tasks.\n\nThese steps are iterative. In practice, that means that at\
    \ each step along the process, you review how the process is going. Are things\
    \ operating as you expected? If not, go back and revisit your current step or\
    \ previous steps to try and identify the breakdown.\n\n![](Images/image00080.jpeg)\n\
    \nThe rest of this book is designed around these very important steps. Check through\
    \ them again here and get ready to dive deep into each of them.\n\n*   Step One:\
    \ Define the problem\n\n*   Step Two: Build the dataset\n\n*   Step Three: Train\
    \ the model\n\n*   Step Four: Evaluate the model\n\n*   Step Five: Inference (Use\
    \ the model)\n\n## Step One: Define the Problem.\n\nHow do You Start a Machine\
    \ Learning Task?\n\n*   Define a very specific task.\n\n*   Think back to the\
    \ snow cone sales example. Now imagine that you own a frozen treats store and\
    \ you sell snow cones along with many other products. You wonder, \"‘How do I\
    \ increase sales?\" It's a valid question, but it's the opposite of a very specific\
    \ task. The following examples demonstrate how a machine learning practitioner\
    \ might attempt to answer that question. \n\n    *   “Does adding a $1.00 charge\
    \ for sprinkles on a hot fudge sundae increase the sales of hot fudge sundaes?”\n\
    \n    *   “Does adding a $0.50 charge for organic flavors in your snow cone increase\
    \ the sales of snow cones?”\n\n*   Identify the machine learning task we might\
    \ use to solve this problem.\n\n*   This helps you better understand the data\
    \ you need for a project.\n\nWhat is a Machine Learning Task?\n\nAll model training\
    \ algorithms, and the models themselves, take data as their input. Their outputs\
    \ can be very different and are classified into a few different groups based on\
    \ the task they are designed to solve. Often, we use the kind of data required\
    \ to train a model as part of defining a machine-learning task.\n\nIn this lesson,\
    \ we will focus on two common machine-learning tasks:\n\n*   Supervised learning\n\
    \n*   Unsupervised learning\n\nSupervised and Unsupervised Learning\n\nThe presence\
    \ or absence of labelling in your data is often used to identify a machine learning\
    \ task.\n\n![](Images/image00081.jpeg)\n\nSupervised tasks\n\nA task is supervised\
    \ if you are using labeled data. We use the term labeled to refer to data that\
    \ already contains the solutions, called labels.\n\nFor example: Predicting the\
    \ number of snow cones sold based on the temperatures is an example of supervised\
    \ learning.\n\n![](Images/image00082.jpeg)"
