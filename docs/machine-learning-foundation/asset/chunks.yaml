- raw: "*   FFNN: The most straightforward way of structuring a neural network, the\
    \ Feed Forward Neural Network (FFNN) structures neurons in a series of layers,\
    \ with each neuron in a layer containing weights to all neurons in the previous\
    \ layer.\n\n*   CNN: Convolutional Neural Networks (CNN) represent nested filters\
    \ over grid-organized data. They are by far the most commonly used type of model\
    \ when processing images.\n\n*   RNN/LSTM: Recurrent Neural Networks (RNN) and\
    \ the related Long Short-Term Memory (LSTM) model types are structured to effectively\
    \ represent for loops in traditional computing, collecting state while iterating\
    \ over some object. They can be used for processing sequences of data.\n\n*  \
    \ Transformer: A more modern replacement for RNN/LSTMs, the transformer architecture\
    \ enables training over larger datasets involving sequences of data.\n\nMachine\
    \ Learning Using Python Libraries\n\nFor more classical models (linear, tree-based)\
    \ as well as a set of common ML-related tools, take a look at scikit-learn. The\
    \ web documentation for this library is also organized for those getting familiar\
    \ with space and can be a great place to get familiar with some extremely useful\
    \ tools and techniques.\n\nFor deep learning, mxnet, tensorflow, andpytorch are\
    \ the three most common libraries. For the purposes of the majority of machine\
    \ learning needs, each of these is feature-paired and equivalent.\n\nTerminology\n\
    \nHyperparameters are settings on the model which are not changed during training\
    \ but can affect how quickly or how reliably the model trains, such as the number\
    \ of clusters the model should identify.\n\nA loss function is used to codify\
    \ the model’s distance from this goal\n\nTraining dataset: The data on which the\
    \ model will be trained. Most of your data will be here.\n\nTest dataset: The\
    \ data withheld from the model during training, which is used to test how well\
    \ your model will generalize to new data.\n\nModel parameters are settings or\
    \ configurations the training algorithm can update to change how the model behaves.\n\
    \nAdditional reading\n\n*   The Wikipedia entry on the bias-variance trade-off\
    \ can help you understand more about this common machine learning concept.\n\n\
    *   In this AWS Machine Learning blog post, you can see how to train a machine-learning\
    \ algorithm to predict the impact of weather on air quality using Amazon SageMaker.\n\
    \n## Step Four: Model Evaluation\n\nAfter you have collected your data and trained\
    \ a model, you can start to evaluate how well your model is performing. The metrics\
    \ used for evaluation are likely to be very specific to the problem you have defined.\
    \ As you grow in your understanding of machine learning, you will be able to explore\
    \ a wide variety of metrics that can enable you to evaluate effectively.\n\nUsing\
    \ Model Accuracy\n\nModel accuracy is a fairly common evaluation metric. Accuracy\
    \ is the fraction of predictions a model gets right.\n\nHere's an example:\n\n\
    ![](Images/image00087.jpeg)\n\nImagine that you built a model to identify a flower\
    \ as one of two common species based on measurable details like petal length.\
    \ You want to know how often your model predicts the correct species. This would\
    \ require you to look at your model's accuracy.\n\nExtended Learning\n\nThis information\
    \ hasn't been covered in the above video but is provided for the advanced reader.\n\
    \nUsing Log Loss\n\nLog loss seeks to calculate how uncertain your model is about\
    \ the predictions it is generating. In this context, uncertainty refers to how\
    \ likely a model thinks the predictions being generated are to be correct.\n\n\
    ![](Images/image00088.jpeg)\n\nFor example, let's say you're trying to predict\
    \ how likely a customer is to buy either a jacket or t-shirt.\n\nLog loss could\
    \ be used to understand your model's uncertainty about a given prediction. In\
    \ a single instance, your model could predict with 5% certainty that a customer\
