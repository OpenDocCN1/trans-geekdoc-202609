- raw: 'In the preceding graph, the data contains both a temperature and the number
    of snow cones sold. Both components are used to generate the linear regression
    shown on the graph. Our goal was to predict the number of snow cones sold, and
    we feed that value into the model. We are providing the model with labeled data
    and therefore, we are performing a supervised machine learning task.


    Unsupervised tasks


    A task is considered to be unsupervised if you are using unlabeled data. This
    means you don''t need to provide the model with any kind of label or solution
    while the model is being trained.


    Let''s take a look at unlabeled data.


    ![](Images/image00083.jpeg)


    *   Take a look at the preceding picture. Did you notice the tree in the picture?
    What you just did, when you noticed the object in the picture and identified it
    as a tree, is called labeling the picture. Unlike you, a computer just sees that
    image as a matrix of pixels of varying intensity.


    *   Since this image does not have the labeling in its original data, it is considered
    unlabeled.


    How do we classify tasks when we don''t have a label?


    Unsupervised learning involves using data that doesn''t have a label. One common
    task is called clustering. Clustering helps to determine if there are any naturally
    occurring groupings in the data.


    Let''s look at an example of how clustering in unlabeled data works.


    Identifying book micro-genres with unsupervised learning


    Imagine that you work for a company that recommends books to readers.


    The assumption: You are fairly confident that micro-genres exist, and that there
    is one called Teen Vampire Romance. Because you don’t know which micro-genres
    exist, you can''t use supervised learning techniques.


    This is where the unsupervised learning clustering technique might be able to
    detect some groupings in the data. The words and phrases used in the book description
    might provide some guidance on a book''s micro-genre.


    ![](Images/image00084.jpeg)


    Initially, we divided tasks based on the presence or absence of labeled data while
    training our model. Often, tasks are further defined by the type of label which
    is present.


    In supervised learning, there are two main identifiers you will see in machine
    learning:


    *   A categorical label has a discrete set of possible values. In a machine learning
    problem in which you want to identify the type of flower based on a picture, you
    would train your model using images that have been labeled with the categories
    of flower you would want to identify. Furthermore, when you work with categorical
    labels, you often carry out classification tasks\*, which are part of the supervised
    learning family.


    *   A continuous (regression) label does not have a discrete set of possible values,
    which often means you are working with numerical data. In the snow cone sales
    example, we are trying to predict the number\* of snow cones sold. Here, our label
    is a number that could, in theory, be any value.


    In unsupervised learning, clustering is just one example. There are many other
    options, such as deep learning.


    Quiz


    Match the task with it’s corresponding data type


    1.  Supervised learning


    2.  Unsupervised learning


    | Data Used || Machine learning task |


    | --- | --- |


    | Labeled data ||   |


    | Unlabeled data ||   |


    Terminology


    *   Clustering. Unsupervised learning task that helps to determine if there are
    any naturally occurring groupings in the data.


    *   A categorical label has a discrete set of possible values, such as "is a cat"
    and "is not a cat."


    *   A continuous (regression) label does not have a discrete set of possible values,
    which means possibly an unlimited number of possibilities.


    *   Discrete: A term taken from statistics referring to an outcome taking on only
    a finite number of values (such as days of the week).


    *   A label refers to data that already contains the solution.


    *   Using unlabeled data means you don''t need to provide the model with any kind
    of label or solution while the model is being trained.


    Additional Reading


    *   The AWS Machine Learning blog is a great resource for learning more about
    projects in machine learning.


    *   You can use Amazon SageMaker to calculate new stats in Major League Baseball.


    *   You can also find an article on Flagging suspicious healthcare claims with
    Amazon SageMaker on the AWS Machine Learning blog.


    *   What kinds of questions and problems are good for machine learning?


    Quiz: Define the Problem


    1.  Which of the following problem statements fit the definition of a regression-based
    task?


    1.  I want to detect when my cat jumps on the dinner table, so I set up a camera
    and write a program to determine if my cat is in the frame or is not in the frame.


    2.  I want to determine the expected reading time for online news articles, so
    I collect data on my reading time for a week and write a browser plugin to use
    that data to predict the reading time for new articles.


    3.  I believe my customers fall into one of many customer segments, but I don’t
    know what those segments are in advance. After asking for permission, I collect
    a bunch of data on their actions when they use my product and try to determine
    if there are any collections of users that behave in similar ways


    4.  I work for a show company and want to provide a service to help parents predict
    their children’s shoe sizes for any particular age. Within this system, I represent
    shoe size as a continuum of values and then round to the nearest shoe size.


    Answer: B, D


    2.  As a machine learning practitioner, you’re working with stakeholders on music
    streaming app. Your supervisor asks, “How can we increase the average number of
    minutes a customer spends listening on our app”?


    This is a broad question (too broad) with many different potential factors affecting
    how long a customer might spend listening to music.


    How might you change the scope or redefine the question to be better suited, and
    more concise, for a machine learning task?


    1.  Will changing the frequency of when we start playing ad affect how long a
    customer listens to music on our service.


    2.  Will creating customer playlist encourage customers to listen to music longer?


    3.  Will creating artist interviews about their songs increase how long our customers
    spend listening to music?


    Answer: All of the Above


    ## Step Two: Build a Dataset


    The next step in the machine learning process is to build a dataset that can be
    used to solve your machine learning-based problem. Understanding the data needed
    helps you select better models and algorithms so you can build more effective
    solutions.


    The most important step of the machine learning process


    Working with data is perhaps the most overlooked—yet most important—step of the
    machine learning process. In 2017, an O’Reilly study showed that machine learning
    practitioners spend 80% of their time working with their data.


    The Four Aspects of Working with Data


    ![](Images/image00085.jpeg)


    You can take an entire class just on working with, understanding, and processing
    data for machine learning applications. Good, high-quality data is essential for
    any kind of machine learning project. Let''s explore some of the common aspects
    of working with data.


    Data collection


    Data collection can be as straightforward as running the appropriate SQL queries
    or as complicated as building custom web scraper applications to collect data
    for your project. You might even have to run a model over your data to generate
    needed labels. Here is the fundamental question:


    Does the data you''ve collected match the machine learning task and problem you
    have defined?


    Data inspection


    The quality of your data will ultimately be the largest factor that affects how
    well you can expect your model to perform. As you inspect your data, look for:


    *   Outliers


    *   Missing or incomplete values


    *   Data that needs to be transformed or preprocessed so it''s in the correct
    format to be used by your model


