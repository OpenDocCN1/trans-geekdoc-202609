    \nIntroduction\n\nWelcome to introduction to machining learning.\n\nMachine learning\
    \ is creating rapid and exciting changes across all levels of society. \n\n* \
    \  It is the engine behind the recent advancements in industries such as autonomous\
    \ vehicles.\n\n*   It allows for more accurate and rapid translation of the text\
    \ into hundreds of languages.\n\n*   It powers the AI assistants you might find\
    \ in your home.\n\n*   It can help improve worker safety.\n\n*   It can speed\
    \ up drug design\n\nMachine learning is a complex subject area. Our goal in this\
    \ lesson is to introduce you to some of the most common terms and ideas used in\
    \ machine learning. I will then walk you through the different steps involved\
    \ in machine learning and finish with a series of examples that use machine learning\
    \ to solve real-world situations.\n\nOutline\n\nThis lesson is divided into the\
    \ following sections:\n\n*   First, we'll discuss what machine learning is, common\
    \ terminology, and common components involved in creating a machine learning project.\n\
    \n*   Next, we'll step into the shoes of a machine learning practitioner. Machine\
    \ learning involves using trained models to generate predictions and detect patterns\
    \ from data. To understand the process, we'll break down the different steps involved\
    \ and examine a common process that applies to the majority of machine learning\
    \ projects.\n\n*   Finally, we'll take you through three examples using the steps\
    \ we described to solve real-life scenarios that might be faced by machine learning\
    \ practitioners.\n\nSection Objective\n\nBy the end of this section, you can do\
    \ the following:\n\n*   Differentiate between supervised and unsupervised learning\n\
    \n*   Identify problems that can be solved with machine learning concepts\n\n\
    *   Describe commonly used algorithm including login regression, linear regression,\
    \ and k-means\n\n*   Describe how model training and testing works\n\n*   Evaluate\
    \ the performance of a machine learning model using metrics.\n\n# CHAPTER ONE\n\
    \n## What is Machine Learning\n\nMachine learning (ML) is a modern software development\
    \ technique and a type of artificial intelligence (AI) that enables computers\
    \ to solve problems by using examples of real-world data. It allows computers\
    \ to automatically learn and improve from experience without being explicitly\
    \ programmed to do so.\n\nSummary\n\nMachine learning is part of the broader field\
    \ of artificial intelligence. This field is concerned with the capability of machines\
    \ to perform activities using human-like intelligence. Within machine learning\
    \ there are several different kinds of tasks or techniques:\n\n*   Supervised\
    \ learning, is a type of machine learning technique in which every training sample\
    \ from the dataset has a corresponding label or output value associated with it.\
    \ As a result, the algorithm learns to predict labels or output values. You can\
    \ use supervised learning to do things like, predict the selling price of a house,\
    \ or classify objects in an image. We will learn more about supervised learning\
    \ in this lesson.  \n\n    ![](Images/image00071.jpeg) \n\n*   In unsupervised\
    \ learning, there are no labels for the training data. The algorithm tried to\
    \ learn underlying patterns or distributions that govern the data. We will explore\
    \ this in-depth in this lesson.  \n\n    ![](Images/image00072.jpeg) \n\n*   In\
    \ reinforcement learning, the algorithm figures out which actions to take in a\
    \ situation to maximize a reward (in the form of a number) on the way to reaching\
    \ a specific goal. This is a completely different approach than supervised and\
    \ unsupervised learning. We will dive deep into this in the next lesson.  \n\n\
    \    ![](Images/image00073.jpeg) \n\nDifferent between machine learning and traditional\
    \ programming-based approaches\n\n![](Images/image00074.jpeg)\n\nIn traditional\
    \ problem-solving with software, a person analyzes a problem and engineers a solution\
    \ in code to solve that problem. For many real-world problems, this process can\
    \ be laborious (or even impossible) because a correct solution would need to consider\
    \ a vast number of edge cases.\n\nImagine, for example, the challenging task of\
    \ writing a program that can detect if a cat is present in an image. Solving this\
    \ in the traditional way would require careful attention to details like varying\
    \ lighting conditions, different types of cats, and various poses a cat might\
    \ be in.\n\nIn machine learning, the problem solver abstracts away part of their\
    \ solution as a flexible component called a model, and uses a special program\
    \ called a model training algorithm to adjust that model to real-world data. The\
    \ result is a trained model which can be used to predict outcomes that are not\
    \ part of the data set used to train it.\n\nIn a way, machine learning automates\
    \ some of the statistical reasoning and pattern-matching the problem solver would\
    \ traditionally do.\n\nThe overall goal is to use a model created by a model training\
    \ algorithm to generate predictions or find patterns in data that can be used\
    \ to solve a problem.\n\nUnderstanding Terminology\n\n![](Images/image00075.jpeg)\n\
    \nMachine learning is a new field created at the intersection of statistics, applied\
    \ math, and computer science. Because of the rapid and recent growth of machine\
    \ learning, each of these fields might use slightly different formal definitions\
    \ of the same terms.\n\nTerminology\n\nMachine learning, or ML, is a modern software\
    \ development technique that enables computers to solve problems by using examples\
    \ of real-world data.\n\nIn supervised learning, every training sample from the\
    \ dataset has a corresponding label or output value associated with it. As a result,\
    \ the algorithm learns to predict labels or output values.\n\nIn reinforcement\
    \ learning, the algorithm figures out which actions to take in a situation to\
    \ maximize a reward (in the form of a number) on the way to reaching a specific\
    \ goal.\n\nIn unsupervised learning, there are no labels for the training data.\
    \ A machine learning algorithm tries to learn the underlying patterns or distributions\
    \ that govern the data.\n\n## Components of Machine Learning\n\n### Models\n\n\
    In machine learning, all tasks are resolved with three primary components, namely:\n\
    \n*   A machine learning model\n\n*   A model training algorithm\n\n*   A model\
    \ inference algorithm\n\n### Clay Analogy for Machine Learning\n\nYou can understand\
    \ the relationships between these components by imagining the stages of crafting\
    \ a teapot from a lump of clay."
