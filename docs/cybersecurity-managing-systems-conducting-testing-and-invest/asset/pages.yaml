- pgno: 35
  md: '# Antipattern: Policy-Driven Security Certifications Do Not

    Address the Threat


    The gold standard of professional security certifications is the Certified Information

    System Security Professional (CISSP). It is an entirely paper-based qualification,

    requiring a great deal of memorization in 10 diverse security domains, such

    as physical security, communications security, and systems security. CISSP is

    required by the U.S. Department of Defense (DoD) for both management and

    technical security workers, and demanded in the job market. Anecdotally, the

    presumed goal of this certification is to produce security profession-

    als who can communicate effectively with upper management, but what does

    they have to do with combating cyber threats?


    This paradox was addressed by the Center for Strategic and International

    Studies (CSIS), which released a Presidential commission report: A Human

    Crisis in Cybersecurity (July, 2010). The report states clearly that “the"

    current professional certification regime is not merely inadequate; it creates

    dangerously false sense of “security” with an overemphasis on security compli-

    an on paper versus combating threats.


    Many people in the cybersecurity community view this as controver-

    ial because their careers, reputations, and credentials are invested in security

    compliance policies and procedures. This is the industry that drives A&A, risk

    management, security controls compliance, and other long-intensive security

    activities. Unfortunately, for most professionals, it is much easier to turn a
    highly

    technical person into a policy person, whereas it is very difficult (or impossible)

    to turn a policy person into a highly technical one. It is a one-way street.


    # Refactored Solution: Security Training Roadmap


    This entire book is aimed at providing a refactored solution to the previous

    antipattern. What are the essential education requirements that will enable

    security personnel to adequately defend enterprises from cyber attack? I attempt

    to answer that question for the industry readers and two- to four-year college

    students and professionals. Because there are 25 million business establishments

    in the U.S., a great number of trained professionals will be needed to defend

    these businesses'' networks, systems, applications, and data.


    Aside from the material presented in this book, how else might you acquire the

    necessary cyber defense skills? One approach is through professional training

    hands-on skills, for example, at SANS Institute and a handful of other places.


    SANS Institute offers a master-level degree and a Cyber Guardian certification,

    which both require numerous SANS certifications to achieve. These programs'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Chapter 1 | Executive Summary


    are elite and require exceptional student performance. It is hard to imagine that
    sufficient numbers of people could complete such a rigorous program.


    The following are some suggestions for a practical SANS training regime for a
    network defender. The corresponding certifications are implicit in the list. the
    baseline assumption is that you have a technology background and are not a complete
    beginner. The chapters in parentheses indicate where the materials occur in this:


    +   - SANS SEC 401 Security Essentials: Networking (Chapter 6); network administration
    (Chapters 4 and 5)


    +   - SANS SEC 504 Hacker Techniques, Exploits, and Incident Handling: Intrusion
    detection (Chapter 9); and security testing (Chapters 6, 7, and 8)


    +   - SANS SEC 560 Penetration Testing and Advanced Ethical Hacking: Pen testing
    (Chapter 8)


    +   - SANS SEC 503 Intrusion Detection In-Depth: Network sensors, intrusion detection/analysis
    (Chapter 9)


    If you work for, or contract with, the U.S. federal government, another curriculum
    is available from the Defense Cyber Center (DC3) near Baltimore. DC3''s Defense
    Cybersecurity Training Academy (DCITA) is tuition free. The suggested curriculum
    at DC3 includes the following:


    +   - Computer Incident Responders Course (Chapters 6 through 9)


    +   - Network Exploitation Techniques (Chapter 8)


    +   - Network Monitoring Course (first part of Chapter 9)


    +   - Advanced Log Analysis (remainder of Chapter 9)


    +   - Live Network Investigations (summarized in Chapter 9)


    In addition, this book also includes essentials of network programming in Chapter
    6. These topics are covered partially by SANS SEC 560 and DC3 courses, such as
    Advanced Log Analysis.


    The preceding information defines roadmaps for computer network defense training,
    a role that is Blue Team. A different cybersecurity role, Red Team, takes an offensive
    posture. Red Teams are expert penetration testers who attack and exploit networks,
    servers, and devices. In addition to the Blue Team curriculum already discussed
    (excluding SANS 503), the following additional SANS courses are for Red Team members:


    +   - SANS SEC 542 Web App Pen Testing and Ethical Hacking (Chapter 8)


    +   - SANS SEC 617 Wireless Ethical Hacking and Pen Testing (Chapter 8)


    +   - SANS SEC 660 Advanced Penetration Testing'
