    # Enumeration and Hash Grabbing on Linux


    Usernames and group memberships are readily accessible to Linux and Unix users
    from the /etc/password file. Harvesting usernames is as simple as this:


    ```

    # cut -d: -f1 /etc/passwd

    ```


    Password hashes are stored in the /etc/shadow file. This file is only readable
    by the root user and the shadow group. As root user, you can harvest hashes like
    this:


    ```

    # grep -v ''x:'' /etc/shadow -v '':1:'' | cut -d: -f2

    ```


    You use the grep command to filter out strings for nonpassword bearing service
    accounts, and then you cut the second field bearing the ASCII characters for the
    encrypted password hashes.


    There are additional authentication mechanisms on Windows and Linux, such as Pretty
    Good Privacy (PGP) keyrings, Public Key Infrastructures (PKI), and LANMAN hashes
    on older Windows systems. Additional techniques for enumerating users, as such
    queries to SMTP servers, are supported in BackTrack with commands such as smpasswd.
    Exploiting alternative authentication techniques are covered in the Pen Test Framework,
    which you can find at http://vulnerabilityassessment.co.uk.


    You now move on to obtaining valid credentials. For example, according to the
    Pen Testing Framework (PTF), a utility program installed with John the Ripper,
    unshadow, extracts Linux password hashes for direct input to the cracking tool.


    # Password Cracking


    You can obtain passwords using both online and offline methods. Online, you send
    password guesses to login challenges using dictionary attacks, brute force attacks,
    and fuzzing. A dictionary attack performs password guessing from a list of common
    passwords. In a brute force attack, you generate passwords'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'from scratch. In fuzzing, you modify known words and dictionary words with
    random changes, common variations, and extensions. Offline attacks can use CPU-intensive
    methods, including dictionaries, brute force, and specialized algorithms to test
    and crack passwords. This section presents common approaches and discusses password
    cracking tradeoffs considered by pen testers.


    In Chapter 5 you programmed an online password-dictionary attack at the Windows
    command line, which is suitable for remote attacks from a raw shell. A plethora
    of password dictionaries and dictionary generators are freely available from Internet
    sites such as PTF.


    You can view password policies on Windows with these commands:


    +   - Local Windows policies: C:\> net accounts

    - Windows domain password policies: C:\> net accounts /domain


    These policies tell you the minimum password length, lockout threshold, and lockout
    observation window. Many, most users, only conform to the minimal policy. If the
    minimum is eight characters, most passwords are exactly eight characters; if the
    minimum is one special character, most passwords have exactly one; and so forth.
    You can economize the password search of your tools to exploit these policy-driven
    weaknesses.


    If you use an online password attack, you must avoid lockout by sending no more
    than the threshold of guesses within each observation period. For online password
    attacks, use the Linux sleep command or a Windows timeout command to slow down
    login attempts and avoid account lockout:


    +   - Linux script sleep an hour: sleep 60m

    - Windows script sleep an hour: timeout /t 3600


    By default, most Linux systems do not have password policies, other than root
    accounts; this can be a major advantage for attackers. You can configure an optional
    module called Pluggable Authentication Module (PAM) to establish password policies,
    including account lockout.


    +   - Free tools for online password attacks include THC-Hydra, Medusa, and Brutus
    (available from PTF). Several password cracking tools have online attack capabilities.


    Offline password cracking has many advantages over online attacks. By many orders
    of magnitude, more password guesses can be attempted in a fixed timeframe offline.
    Some popular password cracking tools include John the Ripper and the Cain & Abel.
    The remainder of this section gives an overview of some tools and tradeoffs for
    pen testers; Part III delves into the cryptographic details. These tools are also
    available from PTF.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# Chapter 8 ■ Penetration Testing 181


    # John the Ripper


    John the Ripper supports password cracking based on brute force, dictionary, fuzzing,
    and custom code. John the Ripper fuzzes based upon the username and the GECOS
    blob, a random bit pattern on Linux associated with each user.


    John the Ripper cracks virtually all password types, including Linux salted hashes,
    except for Windows LANMAN v2 hashes. There are a number speedup options, including
    recompilation for different CPUs and distributed parallel extensions by third
    parties. You can find more information at http://www.openid.com/john.


    # Rainbow Tables


    Rainbow table techniques are highly efficient algorithms for cracking complex
    passwords. Instead of redoing all hash computations for every password crack,
    rainbow tables precompute hashes into long rainbow chains of alternating hashes
    and passwords, reduced from hashes.


    For a specific password policy (for example, eight characters, one number, one
    special character), rainbow chains cover the entire password space (all possible
    passwords). The chains are circular; start with a hash anywhere, and you will
    find the password.


    Rainbow table crackers first locate the correct chain by matching the hash and
    then compute and reduce hashes until the hash rematches. Some popular sources
    of rainbow table data and associated password crackers include the following:


    +   - The Schmo Group: http://rainbowtables.shmoo

    - RainbowCrack Project: http://project-rainbowcrack.com

    - Ophcrack: http://jaselec.epfl.ch/-oechslin/projects/ophcrack


    +   - Cain & Abel password cracker and tool suite, covered in the next section


    > NOTE Rainbow table algorithms have the enviable property of Order(1) complexity.
    In other words, search time is equal for all hash-password pairs.


    Rainbow tables are highly effective for complex password policies, but are unwieldy
    for seeded hashes, like on Linux, because new rainbow tables require significant
    computing effort for each seed value. Rainbow tables require tremendous storage
    capacity to create, and they can recover.


    # Cain & Abel


    Cain & Abel cracks passwords from all Windows formats, popular network devices,
    and databases using multiple techniques, such as brute force, dictionary,'
  merge: -1
  img_proc: true
