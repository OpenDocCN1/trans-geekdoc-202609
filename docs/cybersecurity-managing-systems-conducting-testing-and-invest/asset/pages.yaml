- pgno: 28
  md: '# CHAPTER

    1

    Executive Summary


    Effective cybersecurity is a critical capability for the defense and preservation
    of civil society. Cyber crime is one of the world''s largest and fastest-growing
    categories of crime. Cyber criminals are responsible for more than $1 trillion
    USD in stolen funds and other assets, with crime in some segments growing 300
    percent per year. Cyber espionage is epidemic and pervasive; even the world''s
    smartest companies and government institutions have terabytes of intellectual
    property and financial assets being lost annually via the Internet. Concealed
    malicious actors even threaten our electrical power grids, global financial systems,
    air traffic control systems, telecommunications systems, healthcare systems, and
    nuclear power plants.


    Chances are good that your current organization is being attacked right now: cyber
    criminals, civilian/military cyber warriors, and global competitors are deeply
    entrenched in your network. If you have information worth stealing, it is likely
    that the attackers are on your internal network, exfiltrating data from your end
    users, and controlling key administrative nodes. If organizations don''t change
    the way they are defending themselves, personal identifying information, bank
    account and credit card numbers, and intellectual property that defines competitive
    advantage will continue to be stolen.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Part I Cyber Security Concepts


    The threat is to all civil society. If cyber attackers scrambled all the data
    on Wall Street and Bond Street, wiping out all investments and retirement accounts
    based on the U.S. and U.K., the consequences are unthinkable. (And this scenario
    is a real possibility.) The goal of this book is to lay the foundation for solving
    this critical problem in earnest.


    U.S. government policy experts are quite concerned about the strategic gap in
    cyber skills, claiming that in 2008 the U.S. had only 1,000 world-class cyber
    experts but would require 20,000 to 30,000 to adequately handle hyperspace offense
    and defense. I believe that estimate is quite low. There are 25,000,000 business
    establishments that need cyber defenses in the U.S. alone, according to the census
    bureau. Certainly, hundreds of thousands of technologists with the kinds of skills
    and education presented in this book will be needed to fully defend civil society.


    # Why Start with Antipatterns?


    To successfully make a change, the first step is to admit you have a problem.
    The civilized world is in a dire predicament regarding cyber threats. Solving
    cybersecurity issues requires radical new ways of thinking, and paradoxically,
    a return to first principles and common sense—in other words, ruthless pragmatism.


    Antipatterns employ psychological frameworks for solving problems whose causes
    involve habitual mistakes. Antipatterns require a mind shift from the dispassionate
    mindsets of mathematics and engineering into the judgmental milieu of enterprise
    architecture and organizational change.


    > NOTE Some people have criticized antipatterns as being anti-intellectual. Antipatterns
    are a way of thinking clearly about habitual causes, serious problems, and effective
    solutions.


    Antipatterns have been summarized by the quip, “Technology is not the problem...people
    are the problem.” But, changing people’s minds is very difficult. So, you need
    powerful psychology to do that.


    > NOTE The classic paradigm of organizational change is: You send your people
    out on a rickety bridge toward a pot of gold and start a fire behind them so they
    can never go back to old ways.


    Antipatterns have ancient roots in governance, law enforcement, religion, and
    public administration. In a perverse sense, antipatterns are an adult form'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Chapter 1 = Executive Summary


    of name-calling used to control society. We invent pejorative names and make public
    examples of misants to prevent other people from misbehaving.


    For the sake of clear definition, here are a few examples of modern-day social
    antipatterns used in general society: liberal (lily), racist (bigot), terrorist
    (violent extremist), convict (felon, violent offender), street criminal (thug,
    gang banger), drug addict (junkie), corrupt politician (crook), and all terms
    for criminals. Words have baggage. Even the term hacker has antipattern connotations.


    Although this book does not emphasize the name-calling aspect of antipatterns,
    the goal is the same: to clearly articulate mistakes (in IT) and rapidly translate
    the discussion toward pragmatic solutions.


    In this chapter, a basic form of antipattern is introduced. Basic antipatterns
    include two parts: (1) a description of the antipattern problem, and (2) a description
    of an improved solution, called a refactored solution. In some cases in this chapter,
    I present the antipattern without the refactored solution. Chapter 2 introduces
    the full antipattern template.


    # Security Architecture


    The cybersecurity crisis is a fundamental failure of architecture. Many of the
    networked technologies we depend upon have no effective security whatsoever. (See
    the "Networks Always Play by the Rules" antipattern in Chapter 2). The architecture
    of the Internet and the vast majority of deployed software create significant
    opportunities for malicious exploitation.


    It is worth stating that if infrastructure and software technologies were engineered
    properly, they would be built to withstand known and manage unknown risks, and
    they would be significantly more secure than current-day technologies.


    Chapter 3 introduces the Zachman Framework for Enterprise Architecture and applies
    it to securing enterprises. The Zachman Framework is a powerful intellectual tool
    that enables complex organizations to describe themselves, including their mission,
    business, and information technology (IT) assets. With this self-knowledge comes
    awareness of risks and mitigations, and ways of engineering security into solutions
    from inception. The Zachman Framework serves as an overarching structure that
    organizes the problem-solving patterns catalog in Chapter 3.


    The following sections begin the discussion of cybersecurity antipatterns, including
    some of the most significant cybersecurity challenges, including education. Antipatterns
    can be construed as cynical depictions of the current state of practice. Negativity
    and cynicism is not the goal; there are many solutions and patterns for success.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Antpattern: Signature-Based Malware Detection versus Polymorphic Threats


    The conventional wisdom is that all systems with up-to-date antivirus signatures
    will be safe. However, many popular antivirus solutions are nearly obsolete, with
    many missing the majority of new malware. Current signature-based antivirus engines
    miss 30 percent to 70 percent of malicious code, and nearly 100 percent of zero
    day infections, which, by definition, are unreported exploits.


    Malicious growth is exploding from 5 new ones per day in 2000 to 1,500 per day
    in 2007 and more than 15,000 per day in 2009, according to Symantec (from a 2010
    conference briefing on reputational anti-malware), which is an average of 200
    percent to 300 percent cumulative growth per year. Malware variability has grown
    so rapidly that signature-based detection is rapidly becoming obsolete.


    > Each security industry vendor has its own sensor network for gathering and monitoring
    malware. Kaspersky Labs has seen flat growth in malware signatures since 2008,
    while other vendors employ exponential growth. Somewhere in the middle lies the
    truth.


    The proliferation of malware signatures is exploding primarily due to polymorphic
    malware techniques. For example, hash functions used by signature-based detectors
    yield very different values with only slight changes to a malicious file. Changing
    a single string in the file is sufficient to trigger a false negative. Other polymorphic
    techniques include varying character encodings, encryption, and random values
    in the files.


    One interesting application from VirusTotal.com runs more than 30 antivirus programs
    on each file that any Internet user can submit. You can just how haphazard antivirus
    tests are.


    # Refactored Solution: Reputational-, Behavioral-, and Entropy-Based Malware Detection


    Vendors are developing innovative techniques that can detect zero day and polymorphic
    malware. Several promising approaches for the future include:


    +   - Symantec is harnessing a 100M+ global customer base to identify potential
    malware signatures. The technique, called reputation-based signatures, is able
    to identify 240 million new malware signatures by comparing binaries across systems
    for anomalous variations.


    +   - FireEye has created a behavioral intrusion detection system (IDS) that uses
    elements of honeypots and forensics to automatically identify malicious'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Chapter 1 ■ Executive Summary


    content as it flows across corporate networks. Behavioral IDS techniques simulate
    the execution of sniffed content in a virtual machine, which observes resulting
    configuration changes, such as changes in registry settings, services, and the
    file system. There are other emerging antivirus products, for example, from ThreatFire.


    +   - An emerging field of research called entropy-based malware detection looks
    for mathematical similarity to known malware signatures. Hash functions that are
    used by most antivirus programs detect subtle differences between a file and its
    known hash. Minor changes to a file, such as modification of strings or encodings
    can cause a hash to fail. Entropy-based matching uses mathematical functions that
    measure similarity rather than differences. If a suspicious file nearly matches
    the same entropy as malware, there is a high likelihood that the malware is present.


    # Antipattern: Document-Driven Certification and Accreditation


    Some of the most flag antipattern involve the IT security industry itself. Assessment
    and Authorization (A&A), formerly called Certification and Accreditation (C&A),
    has attracted much public criticism because it has a reputation as a paper-driven
    process that does not secure systems from real threats. See Chapter 7 for more
    information about C&A and A&A.


    A&A is the process of assuring the information security of systems before they
    are deployed. Certification is an assessment and testing phase that identifies
    and confirms vulnerabilities. Accreditation is an executive approval process that
    accepts risks discovered during certification.


    Precertification is often an arduous process of security documentation and reviews.
    In many organizations, certification is problematic. Often testing is waived or
    done very superficially with policy scanners that check registry and configuration
    settings.


    In the more rigorous process of penetration testing (pen testing), vulnerabilities
    are thoroughly explored with state of the art tools, followed by actual exploitation
    and malicious user tests where unauthorized accesses are the goal.


    Although A&A is formalized in government organizations, it is also widely practiced
    in industry. For example, payment card industry (PCI) standards require businesses
    that process credit cards (in other words, virtually all retail companies), to
    conduct penetration tests and other formal assessments.


    Refactored solutions for this antipattern can be derived from the practical security
    testing and investigation techniques presented in this book.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Antipattern: Proliferating IA Standards with No Proven Benefits


    National Institute of Standards and Technology (NIST) is a U.S. government organization
    with dozens of IT security publications. NIST’s latest 800 series of publications
    are considered the new state-of-the-art gold standard for formalizing IT security
    controls and managing risk.


    There are literally hundreds of NIST publications pertaining to computer security.
    Some of the key NIST publications include the:


    +   - NIST SP 800-39: Defines integrated enterprise-wide risk management processes
    across entire portfolios of systems and business activities

    - NIST SP 800-37: Defines the process for lifecycle risk management

    - NIST SP 800-30: Defines how to conduct a risk assessment for a single system

    - NIST SP 800-53: Contains the standard catalog of security controls. These controls
    are requirements that address all aspects of information security

    - NIST SP 800-53A: Defines how to implement security controls, including test,
    interview, and review procedures


    There is a comparison to these documents: the U.S. Committee on National Security
    Systems (CNSS) Instruction No. 1253, which profiles the use of NIST security controls
    for national security applications. This publication also contains values for
    parameters in NIST SP 800-53.


    The problem with these guidelines and controls is that they are too voluminous
    to be applied in practice without extensive automation. A typical list of NIST
    security controls contains more than 600 requirements for each system. With current
    technology, the vast majority of those should be evaluated manually. Development
    schedules, commercial competition, and means simply do allow for the meticulous
    security audits implied by these huge lists. It will take many years to transition
    the government and commercial tools to the new NIST standards.


    On the other hand, to date, a reasonable level of automation has been achieved
    for pre-existing requirements, evaluated by the DISA.mil and ONL.mil policy test
    suites. Commercial versions of these tests are available from Application Security
    Inc. and eyefe Digital Security. It will take many years to transition the government
    and commercial tools to the new NIST standards.


    An open question remains, however: After going through all the trouble to achieve
    security compliance, was the effort worthwhile? The systems actually more secure
    compared to currently emerging threats? Standards are not changing at the same
    rate that the security threats are evolving and morphing'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Chapter 1 | Executive Summary


    into new attack vectors. There is an excruciating obvious mismatch between the
    world of highly innovative malware and the stodgy world of never-changing standards.


    A dramatic visual example of this antipattern is the security policy landscape
    for the Global Information Grid (Figure 1-1).


    ![](img/58b756e5b149184e369c845a987fc3a2_34_0.png)


    **Figure 1-1:** Global Information Grid Policy Landscape


    The diagram is as unintelligible as it looks, even if you could read it. See the
    original at http://iac.dtic.mil/siac/download/ia_polychartart.pdf


    The diagram lists more than 200 separate policies and standards documents, grouped
    into 17 categories. There is no way that anyone could understand all this complexity,
    much less, apply it to every system in the enterprise.


    This is an obvious lack of common sense, and completely contrary to the pragmatic
    way of solving problems presented in this book. A key of this antipattern is that
    many individuals equate complexity with quality. If we have so many policies and
    standards from NIST and the rest of the government, it must be very good? Right?
    How could it be any other way?


    SANS Institute, a leading provider of hands-on cybertraining, has suggested publicly
    that the paper-compliance-driven security regimes should be replaced by hands-on
    technical security expertise. So the refactored solution for this antipattern
    is revealed through techniques described in Chapters 4 through 9 of this book.'
  merge: -1
