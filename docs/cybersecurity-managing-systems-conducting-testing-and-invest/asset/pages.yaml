  md: '# Chapter 4 Network Administration for Security Professionals 83


    +   - Service management

    - wmic, taskkill: Process management

    - net user: Management user accounts


    # Linux


    Gnome and KDE desktops provide access to system management controls via GUI tools;
    however, the command-line tools are much more portable and standardized across
    Linux releases. Later sections in this chapter cover the use of several key commands.
    A small sample of the major system management commands includes the following:


    +   - netstat: List active network connections and net services

    - dmesg: Check system messages

    - df: Check disk space

    - ps, kill: Process management

    - Mount, amount, fdisk: Manage disks

    - useradd, usermod, userdel, passwd: Manage user accounts


    # VMware


    The ESXi vSphere console provides many system management controls. Click in the
    left navigation to select the overall appliance (for user account management and
    overall settings) or an individual VM, and right-click and choose Edit to modify
    its settings. VMware Workstation menus provide similar management functionality
    for individual VMs.


    # Other OSes


    Solaris system management commands are similar to Linux, but the command-line
    syntax and options can vary significantly. Use man pages and online examples to
    clarify.


    # Managing Remote Login


    Remote login is a necessity for network administrators and many security professionals.
    Rack-mounted machines and VMs on shared infrastructures do not have dedicated
    consoles; so, remote login or KVM are your only options. Security testing and
    remote system administration (for example, in a cloud hosting facility) are increasingly
    commonplace.'
