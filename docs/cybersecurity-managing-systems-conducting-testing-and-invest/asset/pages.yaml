  img_proc: true
- pgno: 270
  md: '# Chapter 12 Large Enterprise Cybersecurity: Data Centers and Clouds 245


    There are several ways attackers might coax someone into viewing a bad-web page:


    +   - Sending a malicious web link as spam to millions of e-mail accounts

