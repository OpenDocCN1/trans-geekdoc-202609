    # Network Programming: Windows Command-Line Interface (CLI)


    A Windows Command-Line Interface (CLI or cmd.exe) terminal window can be opened
    from the Accessories folder or by entering cmd in the Run command box within the
    Start Menu.

    Instead of embedding the path for the command-line interpreter (as you would with
    bash or Python), Windows files indicate their executable purpose with the file
    extension: .bat for command-line scripts, .exe for executable, and .py for python.
    You can invoke these using the script name without the extension. By default,
    the current directory is in the execution path.


    > TIP Avoid giving your scripts the names as known system commands; for example,
    do not create a script named ping.bat.


    Just like bash, the Windows command line has pipes and standard I/O, for example:

    C:> type list.txt | sort /r >> sorted.txt & dir /b /s & type sorted.txt

    These commands list list.txt to the sort command, which sorts in reverse order
    (/r), and appends the result to the file sorted.txt; then the dir command makes
    a directory listing, which is brief (/b) and shows full paths (/s), and finally
    the sorted file is sent to output.


    Windows has two command separators: & and &&. & is sequential execution, when
    the previous command completes. && is sequential execution only if the previous
    command completes successfully, for example:


    ```

    C:> net use \10.10.100.100 password /u:testeruser && echo SUCCESS & net use \10.10.100.100
    /del

    ```


    The command remotely logs in to the tester account with the indicated password
    on host 10.10.100.100. If the login is successful, the echo command announces
    success and then drops the connection (net use /del).'
