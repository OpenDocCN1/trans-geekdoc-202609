  md: '# Chapter 7 ■ Reconnaissance, Vulnerability Assessment, and Cyber Testing 145


    Google searches comprise up to 10 keywords along with Boolean operators and advanced
    search operators. The Boolean operators are AND, OR, (not), and plus (+). The
    must (+) operator forces use of a search term; which is useful Google ignores
    some words (for example, a, an, the, of, and, or, is with). Google is not case
    sensitive except for the Boolean operators AND and OR. You can use (-) to exclude
    specific keywords, phrases, or operator clauses. Tilde (-) searches for the keyword
    and its synonyms. You can use parentheses for grouping expressions.


    Use quotation marks to match an entire phrase. Inside quotations, you can use
