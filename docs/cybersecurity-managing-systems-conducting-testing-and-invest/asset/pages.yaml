- pgno: 87
  md: 'manipulating disks and files give you the flexibility to move software and
    data and create custom configurations to serve your organization’s needs. Finally,
    creating multi-boot partitioned disks enables you to consolidate security tools
    and applications, as well as providing other benefits (see Chapter 5).


    The primary platforms covered in this chapter include Windows, Linux, and VMware.
    VMware is commercial virtual machine (VM) software, which enables you to create
    new machines with will to use for testing or user/server provisioning. Some VMware
    virtual machine platforms include VMware Player, VMware Workstation, and ESXi.
    VMware Player is a freeware download for running VMs. VMware Workstation and ESXi
    (a VM infrastructure operating system [OS]) can create and reconfigure VMs, and
    both are available in evaluation and licensed versions. This chapter addresses
    Solaris and miscellaneous platforms as needed, based upon experience managing
    heterogeneous network environments.


    The following sections delve into hands-on network administration. I wrote them
    with the assumption that you are following along with your Windows and Linux machines
    to try out each command and view the results for your environment. The next chapter
    applies nearly all these skills in a challenging task: customizing the BackTrack
    penetration testing tool suite.


    # Managing Administrator and Root Accounts


    As a network administrator, you are granted a privileged user account on many
    networked systems and devices. Privileged or administrative accounts can exercise
    unlimited authority on your systems and networks. Some best practices for managing
    privileged accounts include:


    +   - All users, including network administrators, should normally use unprivileged,
    nonadministrative accounts.


    +   - Administrative operations should be effectively separated from other user
    activities.


    For example, e-mail and Internet browsing should not be performed using administrative
    accounts or while managing devices/services remotely. Careful use of legitimate
    websites to perform software updates and upgrades is acceptable. These policies
    are essential for network security for the following reasons:


    +   - Logged in with a privileged account, a user receives an unexpected but authentic-looking
    e-mail and opens its attachment, which installs a rootkit. rootkit is malicious
    software that takes complete control of an account for a remote attacker. By compromising
    a privileged account, the entire system (and possibly the entire local area network
    [LAN]), all its accounts, computing power, and data are compromised.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Chapter 4 ■ Network Administration for Security Professionals 63


    +   - A network administrator, logged in as root superuser, visits a drive-by
    malware website; a rootkit is installed unknowingly. Now the attackers have administrative
    privileges on the network.


    +   - A network administrator has web browser windows open for managing Cisco
    routers, Oracle databases, and the company’s website. Over the lunch hour, the
    administrator does some Personal Internet browsing and stumbles upon a website
    that performs a cross-site scripting (XSS) attack. XSS attacks involve running
    malicious scripts inside the administrator’s browser; the scripts have all the
    authority of the network administrator in all open browser windows and tabs.


    If users had proper security policies, only individual, nonprivileged accounts—rather
    than entire systems, networks, and remote devices—would be compromised. Example
    nightmare scenarios of XSS attacks include an administrator’s browser remotely
    managing an electric power grid, air traffic control system, life-critical hospital
    systems, manufacturing controls, banking systems, or military weapons systems.
    Common sense dictates that these systems must be rigorously protected or completely
    separated from the Internet. See the Webify antipattern in Chapter 2.


    It is common practice to never use the default administrative accounts and set
    them up as honeypots, create new administrator (or root/su access) accounts and
    audit the default ones so you can see who is attempting to use them


    This section covers methods of temporary access to privileged accounts. For administering
    accounts see the “Managing User Administration” section later in the chapter.


    # Windows


    Windows accounts are assigned either administrative or normal user privileges.
    You can log out as a normal user and log in as an administrative user to gain
    administrative privileges. You can then repeat the process in reverse to return
    to a normal account.


    On newer Windows systems, you can switch user accounts and gain temporary administrative
    privileges through User Account Control (UAC). UAC was first introduced in Windows
    Vista and Windows Server 2008. When you attempt a privileged operation, UAC challenges
    you for an administrative account password if you are logged into a system with
    a nonadministrative account and attempt to do something on the system that requires
    an elevated level of permissions.


    By default, windows command shells are nonprivileged. To create a privileged shell,
    choose Start ➞ All Programs ➞ Accessories and then right-click Cmd (command shell)
    and select Run as Administrator.'
