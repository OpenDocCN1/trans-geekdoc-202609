- pgno: 333
  md: '# Glossary


    Boundary Protection Monitoring and control of communications at the external boundary
    of an information system to prevent and detect malicious and other unauthorized
    communications through the use of boundary protection devices (e.g., proxies,
    gateways, routers, firewalls, guards, and encrypted tunnels).


    Boundary Protection Device A device with appropriate mechanisms that: (i) facilitates
    the adjudication of different interconnected system security policies (e.g., controlling
    the flow of information into or out of an interconnected system); and/or (ii)
    provides information system-protection.


    Chief Information Security Officer Official responsible for carrying out the Chief
    Information Officer responsibilities serving as the Chief Information Officer''s
    primary liaison to the enterprise''s authorizing officers, information systems,
    and information security officers.


    Common Control A security control that is inherited by one or more organizational
    systems.


    Compensating Controls The management, operational, and technical controls (i.e.,
    safeguards or countermeasures) employed by an organization in lieu of the recommended
    controls in the baselines described in NIST Special Publication 800-53 and CNSS
    Instruction 1253, that provide equivalent or comparable protection for an information
    system.


    Confidentiality Preserving authorized restrictions on information access and disclosure,
    including means for protecting personal privacy and proprietary information.


    Configuration Control Process for controlling modifications to hardware, software,
    and documentation to protect the information system against improper modifications
    before, during, and after system implementation.


    Controlled Area Any area or space for which the organization has confidence that
    the physical and procedural protections provided are sufficient to meet the requirements
    established for protecting the information and/or information system.


    Countermeasures Actions, devices, procedures, techniques, or other measures that
    reduce the vulnerability of an information system. Synonymous with security controls
    and safeguards.


    Defense in Depth Information security strategy integrating people, technology,
    and operations capabilities to establish variable barriers across multiple layers
    and missions of the organization.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# Glossary 309


    External Information System An information system or component of an information
    system that is outside of the authorization boundary established by the organization
    and for which the organization typically has no direct control over the application
    of required security controls or the assessment of security control effectiveness.


    External Network A network not controlled by the organization.


    Failover The capability to switch over automatically (typically without human
    intervention or warning) to a redundant or standby information system upon the
    failure or abnormal termination of the previously active system.


    Guard A mechanism limiting the exchange of information between information systems
    or subsystems.


    Hybrid Security Control A security control that is implemented in an information
    system in part as a common control and in part as a system-specific control.


    Identity-Based Access Control Access control based on the identity of the user
    (typically relayed as a characteristic of the process acting on behalf of that
    user) where access authorizations to specific objects are assigned based on user
    identity.


    Incident An occurrence that actually or potentially jeopardizes the confidentiality,
    integrity, or availability of an information system; or the information system
    processes, stores, or transmits; or that constitutes a violation or imminent threat
    of violation of security policies, security procedures, or acceptable use policies.


    Industrial Control System An information system used to control processes such
    as manufacturing, product handling, production, and distribution. Industrial control
    systems include supervisory control and data acquisition (SCADA) systems used
    to control geographically dispersed assets, as well as distributed control systems
    (DCSs) and smaller control systems using programmable logic controllers to control
    localized processes.


    Information Owner Official with statutory or operational authority for establishing
    the controls for its generation, collection, processing, dissemination, and disposal.


    Information Security The protection of information and information systems from
    unauthorized access, use, disclosure, disruption, modification, or destruction
    in order to provide confidentiality, integrity, and availability.


    Information Security Policy Aggregate of directives, regulations, rules, and practices
    that prescribes how an organization manages, protects, and distributes information.'
