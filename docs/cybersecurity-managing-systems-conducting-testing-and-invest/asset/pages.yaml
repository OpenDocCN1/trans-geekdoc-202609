- pgno: 65
  md: '# 40 Part I | Cyber Network Security Concepts


    The Zachman Framework further slices and dices complexity into rows. The rows
    represent a general overview of the human roles. The hierarchy of every complex
    enterprise has: executives, business management, architects, engineers, technicians,
    and users. Each of these roles can ask the same six questions; hence six cells
    per row.


    Each row-column intersection in the Zachman Framework is a cell to be populated
    with models and specifications, which are representations of the enterprise. Everyone
    has their own specifications. A populated row represents the enterprise architecture
    from row-wise perspective.


    # Primitive Models versus Composite Models


    A primitive model is one that only includes entities from a single column. Row
    1 contains lists of primitives from each column. Row 2 has hierarchies built from
    those lists (refer to Figure 3-1).


    Keeping the columns separate in our models has many advantages. It makes the framework
    conceptually simple; the model based upon the Zachman Framework can also be simple;
    because the columns are independent, you can populate them in parallel. Primitive
    models are relatively stable and slow-changing.


    For example, consider the information models in Column 1 of Figure 3-1; our models
    can include a list of data entities (Row 1), a data hierarchy (Row 2), a conceptual
    schema (Row 3), a logical schema (Row 4), and a physical schema (Row 5), and record
    instances (Row 6). Certainly, Row 6 changes constantly in the implementation,
    but the other cells would be relatively stable. How often do you change the physical
    schema requiring software re-engineering? Probably not that often, in most enterprises.


    Composite models combine primitives from multiple columns. An example is a matrix
    that shows relationships between primitives, such as processes data. With that
    matrix you can answer the question, "Which processes use which data?" Composite
    models are necessary for assessing impacts between columns (such as what data
    is manipulated by which processes) and for describing implementations.


    # How Does the Zachman Framework Help with Cybersecurity?


    Within the voluminous page count of the NIST Special Publications (SP) are some
    useful ideas. NIST SP 800-39 recommends the establishment of an organization-wide
    risk management activity. This activity is responsible for the enterprise’s risk
    executive (function).'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# Chapter 3 = Enterprise Security Using the Zachman Framework


    The risk executive is a key stakeholder in enterprise investment decisions, in
    particular information technology (IT) investments. The risk executive is not
    part of the IT shop but provides a business management perspective on risk (Row
    2). The Zachman Framework empowers the risk executive to have visibility in the
    enterprise in the context of making wise decisions in order to manage the enterprise-s
    security risks.


    The risk executive ensures that from inception, every decision leading to an IT
    project and an IT system will consider security risk from day one. Security requirements
    (that is, controls) will be factored into the system design, up-front, and just
    like all other requirements.


    In effect, systems will be developed with visible security requirements. This
    is a dramatic change from today''s business-as-usual. What happens in practice
    (at least in most organizations) is that security is first considered when cybersecurity
    certification testers arrive (refer to the “No Time for Security” antipattern
    in Chapter 2). There is a mad scramble to issue developers their own accounts,
    replacing a shared administrative office, and other last-minute hoc measures to
    manage the organization''s security posture. Because the security situation is
    so profoundly broken, certification testers are often drawn helping the developers
    re-engineer their systems to be secure. Unfortunately, this happens frequently.


    The Zachman Framework can change all this. Every organization should have an Enterprise
    Architecture (EA), a blueprint for change. The risk executive uses the EA to assess
    risks, levy security requirements, and ensure continuous monitoring of implementation.


    One of the first actions that the risk executive takes is to establish an “auditor”
    user role in the architecture of every system. The auditor is a read-only user
    role that auditors from the Office of Inspector General (or equivalent organization)
    can use to reveal waste, fraud, and abuse. In the commercial world, these auditors
    are implementing the Sarbanes-Oxley Act, through a framework such as Control Objectives
    for Information and Related Technologies (COBIT). Similarly, security auditors
    can use the auditor role to ensure continuous monitoring of the systems and adequate
    levels of confidentiality, integrity, and availability.


    # Everyone Has Their Specifications


    Zachman Framework is the Periodic Table of enterprise models. It is a scientific
    abstraction that helps you manage the real world. The true value of the Zachman
    Framework is the realization that everyone has their own models. If the models
    are not meeting your needs or you don''t know how to organize them, you can reorganize
    them using the Zachman Framework. The models should answer all the important questions
    from your perspective.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Part I - Cyber Network Security Concepts


    You can use the Zachman Framework from any perspective as your baseline framework
    to take inventories of things and concepts; organize and define them; and inter-relate
    them to assess effects, find commonalities, and understand structure.


    If you have no better way of describing and understanding your world, the Zachman
    Framework is a fruitful starting point for documenting it, and that''s architecture
    regardless of the level you find yourself in. After understand your architecture,
    you are in a feasible position to change it.


    Imagine you are a government IT security professional, and you have a framework
    that''s very effective for you. You probably have a System Security Plan, a Plan
    of Actions and Milestones, a Certification Test Report, and an Accreditation Letter.
    These are the items you need to answer all the important questions from your perspective.
    It also means you have a documented architecture—a blueprint for change.


    # The Goldmine Is in Row 2


    Row 1 of the Zachman Framework contains exhaustive lists of enterprise things,
    which are not inherently useful by themselves, but when they''re turned into hierarchies
    in Row 2, you can visualize your enterprise and navigate to clusters of commonality.
    Every type of data your enterprise manages, every role in the enterprise, and
    every system. Seeing this kind of information helps business management (which
    is the Row 2 perspective) make informed recommendations for executive decisions.
    Because Row 2 models help people visualize the enterprise, you now have a new
    basis for fact-decision-making. For the first time, you see the enterprise game
    board and can make agile decisions based upon your newfound knowledge.


    # Frameworks for Row 3


    Row 3 of the Zachman Framework, which is the architect''s perspective, you must
    ask, “Do we know how to describe our enterprise and its systems?” If you can’t
    answer that question, you proceed further through the Zachman Framework and populate
    the six cells on Row 3 with architecture models. The matrices, relating entities
    in different columns, then become your viewpoint correspondences.


    Many organizations, however, do have clue about their choice of frameworks for
    Row 3 models. People in the U.S. Department of Defense (DoD) choose the DoD Architecture
    Framework (DoDAF), an ever-expanding amalgam of viewpoints and model types. People
    in commercial industry might choose The Open Group Architecture Framework (TOGAF),
    which contains expansive descriptions of design methods. People in the North Atlantic
    Treaty Organization (NATO)'
