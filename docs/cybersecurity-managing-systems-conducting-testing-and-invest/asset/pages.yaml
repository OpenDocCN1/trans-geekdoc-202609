- pgno: 41
  md: '# Antipattern Concept


    Design forces are the competing concerns, priorities, and technical factors that
    influence the choice of solutions. In antipatterns there are two solutions: the
    antipattern solution and the refactored solution.


    An antipattern solution represents a commonplace dysfunctional situation or configuration.
    The antipattern solution may be the result of multiple choices over an extended
    system lifecycle, or it may have evolved inadvertently. Every solution or design
    choice yields benefits and consequences.


    The refactored solution results from a reconsideration of the design forces and
    the selection of a more effective solution (see Figure 2-1). The refactored solution
    yields benefits that outweigh its consequences. There may also be related solutions
    or variations that also resolve the design forces beneficially.


    ![](img/58b756e5b149184e369c845a987fc3a2_41_0.png)


    Figure 2-1: Antipattern concept


    # Forces in Cyber Antipatterns


    The major types of forces in antipatterns include primal, horizontal, and vertical
    forces. Primal forces are pervasive design forces present in almost every design
    decision. Horizontal forces are forces that can apply in all domains. Vertical
    forces are domain or system specific design forces.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Chapter 2 * The Problems: Cyber Antipatterns 17


    The primal design forces in the cybersecurity domain include:


    +   - Management of functionality

    - Management of confidentiality

    - Management of integrity

    - Management of availability


    You probably recognize this formulation as the famous Confidentiality, Integrity,
    and Availability (CIA) from IT security. The functionality design force is added
    because it drives the other forces. Systems are granted accreditation with respect
    to a defined level of functionality. Functionality is tested and verified by the
    developers prior to security testing.


    **NOTE** In iterative software projects (particularly agile scrum projects) where
    frequent release of functionality occurs, security testing can be integrated into
    each iteration (or sprint). Each iteration delivers new functionality in the system''s
    production (released) configuration. Ordinary software testing is also iterative
    and must precede security testing so that any changes are included in the security
    test results. A key advantage to this best practice is the early and continuous
    integration of security requirements into the development process.


    *Confidentiality* is the protection of information on the system. In most current
    systems, the information is the primary resource being secured and the sensitivity
    of the information defines the level of risk and security priority for each system
    or database element.


    *Integrity* is protection of the coherence of the data and system metadata (for
    example, configuration). The significant threat of damage to data can be very
    costly to remedi. This threat affects even the most sensitive systems that have
    very limited connectivity to external networks because data, e-mail, and removable
    media with malware can migrate to those systems through normal and erroneous operations.


    *Availability* is the continuous readiness of the system to execute its functionality
    in response to users and other systems'' requests, and the ability to continually
    access its data. Availability is an aspect of the more general concept of Quality
    of Service (QOS). QoS is a service-level requirement for the system, such as guarantees
    of throughput bandwidth or user request response time.


    To ensure the security of a system, testing is a necessary evil. A test is a pair
    of two things, such as a security specification and a system implementation. As
    a result, requirements for functionality, confidentiality, integrity, and availability
    should be clearly identified in the system documentation.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Cyber Antipattern Templates


    The antipattern templates discussed in this chapter are used throughout the book
    to organize pattern documentation. It is useful to understand how these templates
    work and what the fields mean so that you can get the most benefit from them.


    The two templates include the micro-antipatern template and the full cyber antipattern
    template. You use the micro-template for simpler patterns in which detailed explanation
    is not necessary. You use the full template for the more complex and more important
    antipatterns, providing a much more complete coverage of the problem and the solution.


    It is not my intent to use these templates throughout the book. The way this book
    is organized, Chapters 1 and 2 focus on the negative aspects of the antipatterns,
    and Chapters 3 through 14 focus on solutions, except for the antipatterns catalog
    in Chapter 12.


    # Micro-Antipattern Templates


    The micro-antipatern template was used in Chapter 1. It is a flexible and informal
    way to present antipatterns. The components of a micro-antipattern template are:


    +   - **Name**: The name of the micro-antipattern is usually a pejorative term,
    suggesting the negative consequences of the antipattern''s presence.


    +   - **Antipattern Problem**: The problem section summarizes the micro-antipattern''s
    symptoms, consequences, and characterization.


    +   - **Refactored Solution**: The solution section summarizes alternative ways
    to resolve the antipattern design with improved benefits.


    > **NOTE** Design pattern practitioners adopted an engineer''s perspective about
    solutions chose to be nonjudgmental in patterns discourse. The antipatcommunity
    chose a more architectural philosophy that embraces concepts of good design and
    bad design. This judgmental approach is a natural fit for cybersecurity which
    vulnerabilities and security gaps are examples of bad solutions and appropriately
    hardened systems are generally good solutions.


    Because the micro-antipatern template is so simple, it can be presented without
    the formality of templates at all. That is the approach employed in Chapter 1.
    A somewhat more structured template appears in Chapter 12.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# Full Cyber Antipattern Template


    The full cyber antipattern template has two main parts: a header and a body. The
    header gives a quick sense of the antipattern and the solution, inviting the reader
    to dive deeper. The body sections contain the pattern details.


    The full cyber antipattern template is used in Chapter 2. It allows for a more
    structured and comprehensive definition with additional antipattern attributes
    defined in this chapter. Many of the attributes are considered optional, depending
    on the particulars of the antipattern concerned. The heading fields in the full
    cyber antipattern template are


    +   **Antipattern Name:** The name is a unique pejorative noun phrase. The intent
    is to make this antipattern a well-known phenomenon, easily recognizable, with
    an organizational reputation as an important security gap.


    +   **Also Known As:** Many antipatterns are known by various names across different
    organizations. Some known names or analogous names from different domains are
    listed here. A given organization might adopt a name from this list if their members
    find it suitable.


    +   **Refactored Solutions:** One or more names of alternative solutions are listed
    here. The purpose is to give the reader a sense of the direction that this pattern
    write-up is heading towards and promote a common terminology for the solution
    identity associated with the antipattern.


    +   **Unbalanced Primal Forces:** This field lists the primal design forces that
    are poorly resolved by this antipattern.


    +   **Anecdotal Evidence:** These are some quips that characterize this antipattern.
    These phrases are sometimes heard when the antipattern is present and in the early
    recognition of it.


    The body fields in the full cyber antipattern template are


    +   **Background:** This optional field provides contextual explanations that
    are potentially useful or of general interest but are not central to the antipattern
    and its refactored solution.


    +   **Antipattern Solution:** This field defines the antipattern solution through
    diagrams, explanations, examples, and discussions of design forces. The antipattern
    solution is a commonly occurring situation or configuration with significant security
    implications, such as risks, threats, and vulnerabilities.


    +   **Causes, Symptoms, and Consequences:** This bulleted section lists the typical
    causes, common symptoms, and resulting consequences of the antipattern solution.
    The intent is to make it easier to recognize the antipattern and understand how
    and why its replacement is necessary.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Part I Cyber Network Security Concepts


    +   - Known Exceptions: If there are some situations where the antipatten solution
    might be desirable, this section identifies them. For example, if the consequences
    are acceptable in a context or if replacement is not worthwhile.


    +   - Refactored Solution and Examples: This field defines the refactored solution.
    The refactored solution is proposed as an alternative to the antipattern solution.
    Refactoring is a process of replacing or reworking a given solution into an alternative
    solution. The new solution resolves the design forces differently, particularly
    providing a more effective solution that resolves design forces more satisfactorily.


    +   - Related Solutions: If there are other potential solutions to the antipatten,
    they are identified in this section. Often there are different approaches to resolving
    the same problem that don''t conveniently fall under the umbrella of the chosen
    refactored solution.


    # Cybersecurity Antipattern Catalog


    Chapter 1 introduces the concept of antipatterns as a way to motivate organizational
    and behavioral changes. I presented the following general antipatterns, along
    with potential solutions:


    +   - Signature-Based Malware Detection Versus Polymorphic Threats


    +   - Document-Driven Certification and Accreditation


    +   - Proliferating IA Standards with No Proven Benefits


    +   - Policy-Driven Security Certifications Do Not Address the Threat


    At a high level, this chapter continues this discussion of antipatterns, cyber
    mistakes, and bad security habits with these prevalent antipatterns:


    +   - Can''t Patch Dumb


    +   - Unpatched Applications


    +   - Never Read the Logs


    +   - Networks Always Play by the Rules


    +   - Hard on the Outside, Gooey in the Middle


    +   - Webify Everything


    +   - No Time for Security


    The antipatterns are intended to be light reading to raise awareness of major
    security gaps created by current practitioners develop and manage systems and
    networks. Part II of this book delves into the details of discovering and resolving
    these other cybersecurity antipatterns.'
  merge: -1
