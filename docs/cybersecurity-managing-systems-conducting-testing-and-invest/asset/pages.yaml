    # The snortcap Script


    The snortcap script analyzes the nighttime packet capture for IDS alerts and generates
    a text log and a binary log of the alerting packets, as follows:


    ```

    #!/bin/bash

    # Add a parameter like ./snortcap keep -- in order to append to logs

    # By default, daytime logs are deleted to conserve space

    if [ $1 -eq "" ]; then rm /root/alert/snort.log.*; fi

    /usr/local/bin/snort -A full -c /etc/snort.conf -r /root/

    NIGHT.cap -l /root

    ```


    To use the snortcap script execute the command # ./snortcap.

    The snortcap script uses the same technique as daycap to determine if the current
    log file will be removed or appended. Then Snort is in offline mode on OVERNIGHT.cap
    (-r option) with the alert and snort.log#### saved to /root (-l option). Of course,
    you can copy and modify this script to make it adapt to new purposes, as is the
    case with all the scripts.


    IDS alerts from snortcap are multiple records with a blank line between. This
    alert was generated by an end-user host and directed to an external-third party
    port: 80


    ```

    [**] [119:15:1] OVERSIZE REQUEST-URI DIRECTORY [**]

    [Priority: 3]

    11/01-09:44:21.433002 10.10.1.2:5611 -> 64.94.107.30:80

    TCP TLL:64 TOS:00 ID:34850 IpLen:20 DgmLen:1098 DF

    *** Seq:0xE409DEF Ack:0xC141DDB4 Win:0xC2C10 TcpLen: 20

    ```


    Note the structure of the alert. The first line is a general header, for all alerts
    of this type. The second line is priority; the third line contains the timestamp,
    source IP:port#, and destination IP:port# in order. The log analysis will select
    and dissect these lines and fields.


    # The headcap Script


    The next step is to get a list of the summary alert headers with the headcap script.


    ```

    #!/bin/bash

    gawk ''{FS="\n";RS="\n\n"; print $1}'' alert

    ```


    The headcap script shows a very important gawk design pattern. The gawk script
    ''{FS="\n";RS="\n\n"}'' changes the field separator (FS) to newline'
