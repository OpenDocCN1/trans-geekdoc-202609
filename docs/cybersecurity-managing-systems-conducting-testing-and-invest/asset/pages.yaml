    Companies such as Yahoo!, Google, and Amazon.com are leasing their infrastructure
    clouds on the Internet. Private infrastructure clouds are being built in data
    centers; virtualization is now a key cloud technology. For example, a data center
    containing hundreds of pedestal servers could be replaced by a virtual-ized cloud
    of a handful of racks.


    # How Do Clouds Form? How Do Clouds Work?


    Clouds can save costs through economies of scale, consolidation, and higher computer
    utilization. Typically systems are designed for peak processor utiliza-tion, and
    only achieve 2 to 3 percent utilization on average. In a cloud solution, 60 percent
    utilization is achievable.'
