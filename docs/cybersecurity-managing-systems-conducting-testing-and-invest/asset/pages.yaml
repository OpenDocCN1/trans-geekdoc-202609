  md: '# 262 Part III · Cyber Network Application Domains


    User Base

    Orgs A to Z


    ![](img/58b756e5b149184e369c845a987fc3a2_287_0.png)


    Figure 12-1: A cloud ecosystem


    Although computation and data clouds are special purpose, infrastructure clouds
    are used for all purposes, such as application hosting. Infrastructure clouds
    have provisioning systems that support instantaneous creation of new virtual processes
    and storage, even fully loaded with applications. As an out-sourced service, clouds
    support multiple tenant organizations (multitenancy), and virtual isolation between
