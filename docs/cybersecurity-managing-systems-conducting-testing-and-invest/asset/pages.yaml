- pgno: 218
  md: '# Chapter 9 Cyber Network Defense Using Advanced Log Analysis 193


    logs for your analysis needs. (OpenOffice Calc could be another spreadsheet option
    for Linux and Unix users.)


    Tools such as Sawmill and Tshark, the command-line version of Wireshark, are useful
    for reformatting packet captures to prepare data for further evaluation. Sawmill
    also allows for corrections of time codes.


    # Evaluation


    The evaluation phase includes two types of text: text log analysis and binary
    log analysis. You use tcpdump to bridge the two worlds by converting captured
    packets into human-readable outputs. Using the run command on Windows, you use
    EVENTWR.exe to review logs from Windows services and application events. A binary
    version of grep is ngrep, which is useful for searching for hex or ASCII strings
    in binary data. Wireshark is a graphical user interface (GUI) tool for inspecting
    network packets, and network conversations. Both Wireshark and tcpdump have extensive
    searching capabilities. For very large logs, tcpdump is the tool of choice if
    Wireshark cannot handle the file. A find-and-replace text translator, is useful
    for log analysis in conjunction with Gawk.


    > NOTE ngrep will take regular expression search patterns like Gawk does. The
    script for alertcap in the Text Log Analysis section for techniques to add command-line
    arguments to search patterns and code-word searches.


    To extract files from network traffic there are two methods: automatic and manual
    data carving. You use Netminer for automatic data carving. Netminer analyzes a
    packet capture and pulls as many files, such as documents and images, out of the
    data as it can find. However, automatic data carving is not always 100 percent
    effective. You perform manual data carving with a binary editor such as Hexedit.
    Patterns for file headers and trailers are found in the data, and then the data
    is trimmed to recover the original file. You can upload that file to an antivirus
    scanner, such as VirusTotal (found at www.virustotal.com), to check for malicious
    content.


    The next section covers the first phase of the method: observation through network
    monitoring and network sensors.


    # Continuous Cyber Investigation Strategy


    The following sections present an approach for network defense. The process described
    is a baseline approach that should be improved over time as your understanding
    of your networks evolves. The process will make you familiar with your networks,
    so that over time you can spot anomalies quickly and easily.'
