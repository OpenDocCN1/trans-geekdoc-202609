  img_proc: true
- pgno: 156
  md: '# Chapter 6 Protocol Analysis and Network Programming 131


    It is useful to know a few command-line shortcuts. The keyboard''s up arrow reenters
    the previous command. Press the arrow repeatedly to see previous commands. You
    can edit a command by using the left and right arrows to navigate. You can use
    the delete and backspace keys to remove characters and then type new content.
    The terminal has an Edit menu with a Copy to Clipboard. Highlight the mouse and
    select Edit. To paste a command, click the cursor at the command prompt and then
    press Shift-Insert. Shift-Insert and Copy are useful for moving scripts and data
    into one of the command-line environment to text editors and browsers. There is
    a built-in text editor (edit command), which is convenient for creating scripts.


    # Windows Command Line: Network Programming Using For /L


    Windows has two major types of loop commands: for /L and for /F. The former work
    like bash for loops, and the latter operates more like bash while loops.


    You can write a ping sweeper script in a single command line like this:


    ```

    C:\> /L %h in (2, 1, 255) do ping -n 1 10.10.100.\h

    ```


    The variable %h has a start value of 2, a step increment of 1, and an upper limit
    of 255. The script sends a single ping (-n 1) to 10.10.100.2 and all IP addresses
    up to 10.10.100.255, and it reports the results to standard output.


    Additional commands could be added to this script using pipe, &, and && command
    sequence separators. For example, you can clean up the output considerably like
    this:


    ```

    C:\> /L %h in (2, 1, 255) do ping -n 1 10.10.100.\h | find "byte*" >nul && echo
    Host at 10.10.100.\h

    ```


    This script uses the find command (like grep on Linux) to filter the output to
    successful pings. The find command''s output is shunted to the trash (/null),
    and when find is successful (&), the echo command reports the successfully pinged
    host. You also cleaned up the output by using the sign (@) before the ping, to
    suppress the command-line echoing.


    NOTE The trash folder is commonly called the bucket.


    TIP Examine successful versus unsuccessful outputs to find unique strings you
    can match upon success or failure.'
