- pgno: 294
  md: '# CHAPTER

    13


    # Healthcare Information

    Technology Security


    Information technology (IT) is transforming the delivery of healthcare. The adoption
    of Electronic Health Records (EHR) is transforming U.S. healthcare from a paper-driven
    system to a new era where health information can be instantly transmitted and
    shared. Overall, requirements for health information are that it must be kept
    confidential, have high integrity, be life-critically accurate, and always be
    available every time and every place it''s needed. Other purposes of health IT
    data include improving healthcare quality, reducing costs, and increasing population
    health, which is otherwise known as the three-way goal.


    More than other domains, healthcare data is controlled by many legal and regulatory
    constraints. In 2009, the American Recovery and Reinforcement Act (ARRA) became
    the first federal data law, and it applies only to healthcare data. If a removable
    storage or mobile device containing unencrypted data is misplaced, lost, or stolen,
    a data loss is assumed (worst case scenario) and requirements for notifying subscribers
    are invoked by legal mandate. Stories about data loss are constantly in the news;
    all it takes one tablet or laptop for data to be compromised.


    Privacy is a key requirement within healthcare information technologies and it
    has a narrower meaning than cybersecurity. In healthcare, privacy emphasizes the
    confidentiality aspect appears where in other IT realms, privacy includes integrity
    and availability as core requirements.'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# HIPAA


    1996, the Health Insurance Portability and Accountability Act (HIPAA) was passed.
    It is a broad and clear enough legal mandate to unify federal and state laws into
    one legal framework, using the legal principal of federal precedence over state
    laws. HIPAA''s strong privacy protections define the baseline requirement for
    privacy when state requirements do not exceed HIPAA. HIPAA protections were strengthened
    in ARRA to include data loss notification.


    HIPAA regulates Protected Health Information (PHI), which includes all health
    information for a patient regardless of format. There are 18 HIPAA PHI data elements:
    name, locations, dates, phones/fax, e-addresses, Social Security numbers, medical
    record numbers, insurance plan numbers, accounts, licenses, vehicle numbers, IPs
    addresses, biometrics, portraits, and other identifying information. Note that
    the identified PHI elements are focused on identifying specific people. When PHI
    is combined with any other healthcare information, it becomes PHI.


    Security training of all staff is an essential component of implementing HIPAA-compliance
    policies. See Chapter 10 for examples of Internet safety training. Because data
    loss risks include lawsuits, fines, and market impacts, such as insurance risks,
    stock valuations, costs, and public confidence in the institution, the implementation
    of HIPAA requirements involves all staff, necessitating more rigorous legal, regulatory,
    policy, and business process training.


    Health IT security should be audited according to industry standards, such as
    the Center for Internet Security (CIS) benchmarks and security controls, for example,
    the top 20 critical security controls covered in Chapter 12. Healthcare governance
    boards should be actively involved in the oversight and enforcement of audit findings.


    # Healthcare Risk Assessment


    HIPAA requires risk analysis, risk management, and security evaluation. A risk
    analysis is a formal process that identifies threats and vulnerabilities, and
    assesses their likelihood and impact.(See Chapter 12.) Risk management is the
    implementation of the mitigations of the risk analysis—in other words, securing
    the systems according to the risks. Security evaluation is a regularly scheduled
    re-assessment of the security controls, security implementations, and human security
    processes.


    Risk assessment and security improvement should be continuous. Metrics, such as
    the number of records or computers lost over time should be tracked to identify
    where improvements are needed.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# Chapter 13 - Healthcare Information Technology Security 271


    Risk management is formally required by HIPAA for healthcare information security
    (see Chapter 12). However, it is only one of many factors that include business
    needs, resources, technology, and strategic plans. In addition to the healthcare
    organizational strategic plan and IT strategic plan, there should also be an IT
    security plan that captures risk management analysis, security controls, and ongoing
    implementation and operations plans.


    Perimeter security is insufficient in the healthcare domain given the large number
    of people, roles, and locations involved in providing care and the massive quantities
    of sensitive information to be managed. Network engineers should establish protected
    zones of trust within the network perimeter that limit access to need-to-know.
    Need-to-know is a key security principle meaning that individuals only have access
    to the sensitive information that they have access to, in order to perform their
    roles. See the “Hard on the Outside, Gooey in the Middle” antipattern in Chapter
    2 for an example of the risks involved.


    People are the biggest risk in information security. See the “Social Engineering”
    section in Chapter 12). Clinicians are busy people that work around impediments
    to deliver quality healthcare services. It is commonplace in healthcare environments
    for many people share the same password and always leave the system logged in.
    Historically, who is logged in and keying in information, such as service invoices,
    is not known. So, security processes must be seamless and transparent to healthcare
    providers, or they will work around them.


    Organizational units within healthcare enterprises have their own PHI data and
    systems. Small systems can grow organically into mission critical systems which
    should then have formal security controls. Data losses can have criminal and substantial
    financial consequences, such as incident response costs, government fines, insurance
    for PHI owners, and lawsuits.


    The HIPAA security rules cover data loss and business associate relationships
    and responsibilities. Business associates must be fully informed about HIPAA responsibilities,
    including contractual consequences in case of a breach.


    Other government regulations applicable to healthcare providers include the payment
    card identity (PCI) security rules (which mandate penetration testing), Federal
    security rules, Federal identity theft rules, and Sarbanes-Oxley auditing rules.


    # Healthcare Records Management


    The electronic health record systems contain massive quantities of information.
    This sensitive information must travel to the multiple sites of care; via laptops
    and even mobile devices such as tablets, which are increasingly used by healthcare
    professionals. This situation raises significant security issues due to the human
    user risks and mobile data risks.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# 272 Part III Cyber Network Application Domains


    Healthcare organizations need to rigorously design their records retention policies
    to keep storage costs reasonable. Both legal records retention policies and storage
    hierarchy (for example, disk and offline storage) must be considered.


    Before HIPAA, the laws governing health data privacy were a confusing mix of federal
    and state legislation. By setting a higher bar for health privacy, HIPAA took
    precedence over existing federal laws, as well as constitutional precedence over
    state restrictions, unless state legislation is more rigorous.


    Most health records have varying records retention requirements ranging from 7
    to 10 years, but both vital and surgical records must be retained indefinitely.
    These long timeframes pose challenges for storage technology selection. For example,
    will CD-ROM and CD readers be around in 10 to 20 years?


    # Healthcare IT and the Judicial Process


    More than a million patients are the victims of private health information loss
    in the U.S. each year. Healthcare information information contains a superset
    of sensitive information compared to other institutions of society. Detailed identities,
    vital records (for example, birth certificates), financial account information,
    and credit card data are all linked to personal health information. Vital records,
    Social Security numbers, and credit card data are key targets of identity theft.
    When identity thieves steal healthcare information, they often create healthcare
    data integrity issues by mixing data into multiple people into the record.


    A key data management requirement involves supporting frequent medical court cases
    with electronic discovery (e-discovery). Efficient design of e-discovery and records
    retention processes is essential to be able to provide medical legal professionals
    in healthcare organizations, who respond to the courts, with rigorously prepared
    factual evidence and expert testimony.


    E-mail, which is e-discoverable, is a significant source of legal risk for healthcare
    organizations because e-mail messages are persistent records of conversations
    that the users considered private at the time.


    Court cases can affect retention policies on specific records. In the case of
    a litigation hold, the records lifecycle must be suspended. Policies, procedures,
    IT, and cybersecurity solutions must be designed and enforced that address all
    of these risks and requirements.


    # Data Loss


    Traditionally, data loss prevention was focused at finding all restricted data
    on servers and encrypting it. The data prevention problem is shifting dramatically
    toward mobile devices (laptops, tablets, personal digital assistants, and smartphones),
    which, even if encrypted, could still provide user interface access to the data.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# Chapter 13 ■ Healthcare Information Technology Security


    Many of these devices are also on the Internet, creating a risk of cyber attack
    and data exfiltration. The healthcare workforce is increasingly mobile and teleworking,
    as personnel focused on computer tasks and field services can now work from home
    or on-site with patients.


    Encryption is essential on all mobile devices and storage media (thund drives,
    CDs, DVDs, removable hard drives, and tape backups). After data transfers, the
    mobile storage media should be rigorously erased, destroyed, or stored securely.


    Clear policies and procedures for data transfers between organizations and between
    storage media should be established. Business associate relationships should be
    explicitly formed, documented, and assured according to HIPAA and other applicable
    rules.


    Social networking and online data-sharing services pose new risks because users
    believe they can control data stored outside the organizational boundary and control
    securely.


    Healthcare organizations need to monitor their data in motion to detect these
    types of data loss (data being moved outside organizational control). As healthcare
    data is increasingly online, and healthcare systems are interconnected, there
    is a need to migrate data where and when it is needed. Instructors such as the
    Nationwide Health Information Network (NWhIN) in the U.S. enable the transmission
    of healthcare information across the Internet.


    # Managing Logs in Healthcare Organizations


    Healthcare organizations should create detailed logs of application, system, and
    network events and data transfers. Clock synchronization across devices is necessary
    to merge the logs into chronologies or time sequences of events.


    Tools should be available to consolidate and analyze application, system, and
    network logs. Logs should be moved off individual systems and devices and centralized
    to avoid the possibilities of log deletion and tampering.


    Key events to be logged include logins, login attempts, application events, access
    files, and all types of system and security events.


    Log event capture should be too noisy requiring tremendous amounts of storage,
    and might overwhelm the log analysts with unnecessary data clutter. Storing audit
    logs on removable write-once-read-many media (for example, CD-ROM, DVD-R, DVD+R)
    has the advantages of storage scalability and tamper-proofing the data. Storage
    scalability is an essential requirement due to the massive amounts of log data
    generated—thousands of events per month. Tamper proofing may be necessary because
    the logs could be used as courtroom evidence.


    In the logs, it is important to record what event occurred, where it occurred
    (may involve source and destination), what information was involved, and whose
    security credentials were responsible. The key requirement of nonrepudiation'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'states that it should not be possible for a user to provably deny that a loggable
    event occurred with their credentials. For example, if a healthcare worker accesses
    restricted data for which they have no need to know (e.g., the Vice President''s
    healthcare record), the fact of their access should not be deniable. Centralizing
    and protecting audit logs from overwrite are important steps toward nonrepudiation.


    Audit logs are used for routine monitoring and investigations that may lead to
    court cases. As such, you should handle the audit logs with a formally documented
    chain of custody and proper forensic procedures. For example, a standard forensic
    technique is to create a write-once-read-many snapshot of a system before it is
    analyzed, so that it can be proven that the forensic process itself has not been
    tampered with the data—for example, that no evidence has been planted during the
    forensic process.


    Healthcare organizations should establish centralized logging servers with time
    synchronization across the enterprise''s systems and log normalization and standardization
    to allow for correlation and investigation of distributed events. The time synchronization
    and log centralization requirements extend to desktop computing, medical systems,
    network devices, and mobile devices. For processing and analyzing logs, see Chapter
    9 for coverage of advanced log analysis and network investigations.


    # Authentication and Access Control


    Enterprise role-based access control (RBAC) is typically not flexible enough to
    support healthcare processes because users, such as medical providers, change
    roles depending upon which processes they engage in. For example, a professor
    at a medical school could have the roles of doctor, researcher, executive administrator,
    teacher, and patient. If the healthcare access management infrastructure is tied
    to specific applications, roles can be established in those application environments
    appropriate to the process needs.


    Not long ago, it was typical for healthcare providers to share accounts and stay
    logged in continuously. As more and more healthcare information is moved from
    paper to online, data has become critical; the need for data integrity has evolved
    to that a shared account scheme is no longer workable; users must have unique
    identities and individualized privileges with fine-grain audit logging of events
    that access and modify data.


    Similarly, password-based authentication is being replaced by more secure multifactor
    identification, in which additional physical security tokens or biometrics are
    also integrated into the user identification process. See Chapter 10 on end-user
    security for best practices in password choice, and Chapter 8 on password attacks
    and cracking algorithms.'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'There is a careful balancing act in organizations between usability and security.
    These tradeoffs become crucial when considering the needs of logging into multiple
    applications and the need to update passwords regularly, so that compromised passwords
    are retired, whether compromised by key logging malware, spear-phishing schemes,
    shoulder surfing, or other means. A single sign-on solution (SSO) allows for the
    consolidation of password accesses. SSO also increases the threat from compromised
    passwords because more systems are accessible with fewer passwords, so basic password
    policies become more important, such as password expiration and password complexity.


    As healthcare systems increasingly online and more interoperable across organizational
    boundaries (for example, health information exchanges) there is a need for federated
    identity management systems, which enable trust relationships to transcend the
    enterprise. This introduces a new set of distributed security technologies such
    as digital signatures, certificate authorities (CA), and a public key infrastructure
    (PKI). Digital signatures are a mechanism for assuring the authenticity of documents.
    In a PKI environment, a CA is a trusted source of information regarding the authenticity
    of websites and other online services.


    # Summary


    Putting personal information in computer systems means that it can be shared instantly,
    but it also means that data spillage incidents happen more frequently. Healthcare
    information is particularly sensitive, so a framework of laws (including HIPAA
    and ARRA) was established to protect this information. The consequences of the
    laws include monetary fines and notification requirements for any form of data
    loss, such as network intrusions, lost laptops, and missing backup tapes.


    The general approach for healthcare information systems starts with risk assessment
    planning. The biggest risks are due to the numerous people who require access
    to the information, including healthcare workers, insurance firms, and even medical
    researchers, who can receive de-identified information to perform studies such
    as population-based health research. There are legal requirements leading to technical
    requirements governing risk assessment, data loss, event logging, authentication,
    and access control. As healthcare information technology matures, significant
    infrastructures will be required to manage identity, encryption, and trust.


    Chapter 14, the final chapter of the book, delves into another domain of cybersecurity,
    including an introduction to the cyber warfare, and the very challenging topic
    of cyber deterrence (convincing or forcing the cyber warriors to refrain from
    conducting cyber attacks).'
  merge: -1
  img_proc: true
