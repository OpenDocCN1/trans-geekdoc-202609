  md: '# Chapter 14 | Cyber Warfare: An Architecture for Deterrence


    ![](img/58b756e5b149184e369c845a987fc3a2_320_0.png)


    Figure 14-6: Conceptual architecture for rapid attribution


    An attribution engine could reason using the knowledge base, if it''s given information
    about an incident, including matching addresses from a blacklist database, confirming
    information using data from other knowledge sources, and returning results with
    an evidence-chain to human analysts.


    Using address spoofing, the attacker can obscure or even falsely assign attribution.
    Kugler (2009) claims that for major cyber attacks, the attacker may claim attribution
    or attribution can be strategically inferred. However, the opposite of the scenario
    presented in the Cyber Shockwave simulation (refer to the “Cyber Deterrence Challenges”
    earlier in this chapter). Technical spoof detection approaches exist to protect
    Domain Name System (DNS) servers and wireless networks—for example, comparing
    sequence numbers with previously sent packets or embedding cookies in the request
    data (Guo, Chen, & Chieuh, 2005). For your solution, you might consider the use
    and patterns of spoofing to be part of the overall signature that helps identify
