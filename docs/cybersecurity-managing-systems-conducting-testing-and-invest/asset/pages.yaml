    # Introduction to Cyber Network Defense


    When I implemented network sensors and intrusion detection systems (IDS)

    on a new network, I was surprised to discover nearly 1,000 IDS alerts per day

    end-user machine. Although many of these alerts were probably false posi-

    tives, Snort claimed that the end-user boxes were spewing malware signatures,

    o-operation (NOOP) sleds, and other suspicious packets. Our owned machines\were
    generating virtually all the bad packets and sending them to external hosts

    via port 80. These same machines were mostly alert-free all night, but as soon

    as users arrived, alerts started beaconing from inside the network and were

    ent out to various IPs. Some IPs resolved to customer tracking companies like

    Omniture, AudienceScience, Quantcast, DoubleClick, and ValueClick.


    > NOTE NOOP sleds, a repeated sequence of more than a hex value 90 bytes,

    is common in image files, but the vast majority of these alerts were packets sent
    from

    inside the network to external servers, not likely to be image uploads.


    A quick Internet search revealed what these companies do: operate software

    t tracks customer behavior on the Internet. For example, Quantcast claims

    to determine a user''s age, and income level based on the websites the per-

    son visits. I found indications that the spyware was exfiltrating a

    more information than that, as user identities, search terms, and data from

    other web tabs. On the network, I noticed beaconing alerts from every end-user

    machine, especially when users were actively surfing the web. Browser-based

    spyware uses state-of-the-art data and script encodings of the same kind that

    malware uses for concealment, and when was causing alerts.


    Some companies use the euphemistic term adware for this type of intrusive

    collection of browser data. This clearly rises to the level of spyware. It is
    not

    detected by antivirus, anti-spyware, or even the browser unless you have the

    security settings to disable scripts and third-party cookies.


    Such spyware scripts are embedded in legitimate web pages and advertise-

    ers numerous websites, large and small. In many ways, browser-based

    spyware behaves similar to malware, such as applying encodings for obfus-

    cation, sending botnet-like beacons, and exploiting the browser weaknesses'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Chapter 9 Cyber Network Defense Using Advanced Log Analysis 191


    through scripting. The spyware appears to beacon just as the user loads or reloads
    a web page. Obviously, intrusive collection of user and browser data is inappropriate
    for the workplace because the data could contain proprietary or protected information.


    In the remaining sections, I discuss effective solutions for fighting this type
    of spyware to give you a solid introduction to detection and eradication of such
    threats. In particular, refer to the “Continuous Cyber Investigation Strategy”
    section.


    # General Methods and Tools for Cyber Investigations


    The process for defending your networks is called cyber investigation. You use
    investigative techniques to discover suspicious behavior on networks and then
    analyze the results in detail to determine all attributes of the incidents and
    the appropriate means for remediation. This section provides an overview of the
    tools and process; subsequent sections provide full command-line details.


    The cyber investigative method is based upon the scientific method. Its goal is
    to keep your research focused. The cyber investigative method keeps you on track
    identifying active threats and discovering proof sources. Many kinds of attacks
    and suspicious packets are on your network today. Evidence of these suspicious
    activities is located in various system logs and network sensor logs. Additional
    sensors and more comprehensive logging are definitely needed to make your cybersecurity
    environment more effective.


    In cyber investigation, log evidence combined with additional sensor data, which
    give indications and warnings of suspicious activities, comprise your observations.
    Based upon these observations, you will form one or more hypotheses to predictions
    about related suspicious events and their attributes, for example:


    +   - Likely times the events occurs

    - Likely hosts where the events occur

    - Likely domains involved in the event

    - Likely users triggering the event

    - Likely techniques characterizing the event, e.g., beaconing


    Predictions guide the analysis and sensor data to validate or invalidate your
    predictions, and then you repeat the method if the results lead you to form new
    hypotheses. The method concludes with reporting, which is when you recommend network
    changes and other eradication steps.'
  merge: -1
  img_proc: true
