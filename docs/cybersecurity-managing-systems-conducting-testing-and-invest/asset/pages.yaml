    remote ports. The example uses defaults for the other values except the targets,
    which enables you to choose the target OS; the default is not desirable. Show
    the options again to verify the settings (use show options). The save command
    stores the current settings to a configuration file in the home directory: ~/.msf3/config.
    The save command retains your settings if you restart Metasploit. Avoid using'
