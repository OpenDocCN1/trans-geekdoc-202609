- pgno: 136
  md: '# Chapter 5 ■ Customizing BackTrack and Security Tools 111


    # Alternative Pen Test Architectures


    A popular approach for cyber test suites is to configure all test hosts as VMs.
    A native operating system running VMware Player or Workstation runs Linux, and
    Windows test machines are used for multiple tests. Tools that run in each OS environment
    are installed on a master copy of each VM and activated on the test machine, if
    needed.


    Key advantages of this architecture include fast switching between Linux and Windows,
    and the ability to revert the test VM to snapshot, creating a sanitized test image
    without data from other tests.


    All cyber test architectures have licensing issues for the operating systems and
    tools. The next section covers the issues related to security tools.


    # Licensing Challenges for Network Administrators


    BackTrack customization enables you to add commercial security tools on both Linux
    and Windows. The desire to use the latest exploits and thorough vulnerability
    testing are strong motivations to purchase best-in-class tools for your security
    test suite.


    In general, vendor licensing schemes for software create on-going challenges for
    network administrators. When frequent transactions are required to obtain updates
    or allocate licenses, and each vendor does license differently, the situation
    is complex to manage. The following sections describe some of the licensing schemes
    currently in the market today.


    # Perpetual License


    This traditional licensing scheme, which implies permanent ownership, is going
    by the wayside, at least for security tools. As discussed in this chapter, security
    test disks (virtual machines) are re-imaged frequently—in fact, they’re re-imaged
    between every test engagement. Instead of a permanent installation, licenses must
    be frequently verified after re-imaging.


    # Annual License


    Security professionals need frequent updates and upgrades of their tools. Frequent
    vendor license transactions are needed by network administrators, who are called
    on to install, migrate, and reinstall software continually. Vendors leverage these
    needs to mandate annual license renewal. Examples of this general class include
    Core IMPACT, HP WebInspect, and Immunity Canvas.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# Part II Cyber Network Security Hands-On


    > **NOTE** For example, to move an IMPACT license, you must deactivate from the
    menus, or uninstall IMPACT on an Internet-connected machine. Telephone and e-mail
    support are another option.


    # Time Limited per Instance License


    Every test activity requires a separate license transaction. Licenses are purchased
    in pools, and every target instance (for example, database instance) that is tested
    consumes a separate license, which expires in a short period (such as 45 days).
    An example tool of this general class is AppDetective from AppSecInc.


    # Time Hold Renewal License


    A license and a node is locked to a machine. Because security testers are constantly
    replacing, updating, and re-imaging disks, the license must be re-installed for
    every test project. There is a waiting period for renewing and re-installing licenses
    (for example, 2 weeks between re-installs). The agreements expire annually. An
    example tool of this general class is Tenable Nessus.


    # Summary


    In this chapter I covered security tools'' customization, a useful skill in any
    cybersecurity organization. The chapter starts by introducing BackTrack (a free
    suite of hundreds of security tools) and explaining options for installation.
    BackTrack Linux can run off a memory stick, a bootable DVD, a VM, and natively
    on a hard disk. The VM option is explained in its own section.


    Security tools are frequently updated by the developers to keep abreast of the
    latest exploit codes and other developments. This is a technique to update security
    tools on BackTrack from the command line; this also updates the operating system.
    FastTrack program is a tool that supports updates to other security tools.


    Most security testers need both Windows and Linux-based tools. Many tools run
    in only one of those environments. One way to have Windows in your security toolkit
    is to install it in a VM running on BackTrack. You can also run BackTrack as a
    VM on another operating system.


    Performance is an issue when using VMs or bootable DVDs. Dramatic speedsups up
    to 200 times were observed for native operating system installations. For creating
    custom security test disks with multiple native operating systems, the disk partitioning
    process is explained for multi-boot disks.'
