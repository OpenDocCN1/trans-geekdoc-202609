    > NOTE You can find an excellent cheat sheet for system log analysis at www.securitywarriorconsulting.com/security-incident-log-review-checklist.html.


    # Intrusion Discovery on Windows


    SANS Institute has posted additional intrusion discovery guidance in the form
    of a cheat sheet at www.sans.org/score/checklists/ID_Windows.pdf. These Windows
    command lines reveal information about various telltale signs of intrusion, such
    as


    +   * Unusual processes and services: Discover processes and services that may
    have been installed by attackers. Requires baseline knowledge of the expected
    processes and services.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# Chapter 9 Cyber Network Defense Using Advanced Log Analysis 215


    +   - Unusual files and registry keys: Discover changes in disk usage and unexpected
    keys malicious code upon system startup. System changes are possible due to malicious
    activity.


    +   - Unusual network activity: Check network configurations, connections, and
    network traffic.


    +   - Unusual scheduled tasks: Check the scheduled tasks and autostart lists for
    anomalous entries.


    +   - Unusual accounts: Check the user account list for unexpected entries.


    +   - Unusual log entries: Check the event logs for anomalies, such as user account
    creation, failed logins, unnecessary services, and insecure configurations.


    # Summary


    This chapter presented baseline techniques for defending Internet-connected networks,
    selected from cyber investigation phases and post-incident response. Computer
    network defense processes and tools should be improved continuously to keep pace
    with emergent threats and innovation.


    The chapter starts with an overview of cyber network defense with a focus on spyware
    scripting in web pages. I introduce cyber investigation methods along with the
    tools used for advanced log analysis.


    A strategy for continuous cyber investigations is covered, and then I provide
    a specific process for cyber investigation starting with the investigations platform
    setup.


    Network monitoring, a key element of cyber investigations, is covered at a hands-on
    level, introducing keys and setup instructions for scheduling network sniffing.


    Log analysis is introduced with a plethora of log analysis scripts based primarily
    the GNU awk (awk) command-line program, a power filtering and string manipulation
    tool.


    I cover binary analysis, the other major kind of advanced log analysis, with advanced
    filtering commands for the Wireshark network capture tool. I then give a detailed
    explanation of spyware embedded in web page scripts.


    I address some lessons learned for reporting and taking action with the human
    element of cyber investigations.


    I explain the elimination of cyber threats, in particular, Internet spyware in
    hands-on detail.


    Finally, beyond log analysis, I provide an overview of additional intrusion discovery
    techniques on Windows systems.'
  merge: -1
  img_proc: true
