    # Never Read the Logs


    **Antipattern Name:** Never Read the Logs


    **Also Known As:** Guys Watching Big Network Displays Miss Everything, Insider
    Threat, Advanced Persistent Threat (APT), Network Operations Center (NOC)


    **Refactored Solution:** Advanced Log Analysis


    **Unbalanced Primal Forces:** Management of confidentiality


    **Anecdotal Evidence:** Nick Leeston at Barings Bank, Wikileaks, Aurora Intrusions


    # Antipattern Solution


    Network operating centers (NOC) are facilities with large colorful displays of
    system and network status. System, network, and security devices send messages
    about events (audit logs) to centralized management applications, which test for
    alarm conditions and generate the big displays.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Part I Cyber Network Security Concepts


    The alerting rules are usually set to eliminate false positive alarms. For example,
    Intrusion Detection System (IDS) rules and Intrusion Prevention Systems (IPS)
    that cause false alarms are disabled. Frequently logged events, such as configuration
    changes on end-user systems are not alerted.


    All this is fine and, assuming that it actually works, but those colorful displays
    give a false sense of security. Is logging really working? Often when you look
    at the logs you find that it is not. Disabled IDS alerting rules introduce vulnerabilities
    for attackers to evade detection. Are security devices working? If there is an
    insider threat or Advanced Persistent Threat (APT) making massive data transfers
    at unusual times for unauthorized purposes, would anyone notice?


    # Causes, Symptoms, and Consequences


    The causes, symptoms, and consequences of this antipattern include


    +   - Nobody responsible for reading network, system, and security logs.

    - No health and status monitoring of syslog events.

    - No alarm rules for Windows configurations.

    - New IDS yields numerous alerts.

    - Many IDS rules disabled.


    # Refactored Solution and Examples


    Reading the logs is an essential periodic activity; without it, you miss a lot
    of unusual, suspicious, and erroneous activity on your networks. Depending on
    the criticality of the applications, it might be necessary to review the logs
    daily or multiple times throughout the day.


    Review the system event logs, system logs, network device logs, and IDS/IPS logs
    regularly. Do not always depend on the versions in the centralized log manager,
    but periodically audit the local logs and make sure that they are accurately reflected
    in the central logs.


    Chapter 9 examines advanced log analysis and presents a set of custom scripts
    to aid in log reduction.


    # Networks Always Play by the Rules


    Antipattern Name: Networks Always Play by the Rules

    Also Known As: Trust All Servers, Trust All Clients, Do You Believe in Magic?'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Chapter 2: The Problems: Cyber Antipatterns


    Refactored Names: System Hardening, State-of-the-Art Wireless Security Protocols


    Unbalanced Primal Forces: Management of confidentiality and integrity


    Anecdotal Evidence: In wireless, the access point with the strongest signal is
    the one that user devices trust, even if it''s malicious.


    # Antipattern Solution


    The Internet was not designed with security in mind; neither were many wireless
    technologies. For example, both Wi-Fi enabled laptops and Global System for Mobile
    Communications (GSM) cell phones accept any base station that knows the respective
    protocols. There is a free security tool called Karma that can turn any Wi-Fi
    enabled laptop into an imposter wireless access point. Described as Internet in
    a box, Karma fools other laptops into sharing their cookies for major websites
    and other purposes.


    Yersinia is a security research tool that generates network layer 2 attacks, the
    data link layer. Protocols on this layer generally do not authenticate other systems,
    meaning whatever frames they are sent are accepted as valid and acted upon. This
    is the general vulnerability responsible for ARP cache poisoning (corrupting machine
    and Internet addresses). Yersinia can perform host spoofing and monkey-in-the-middle
    attacks on additional protocols including Dynamic Host Configuration Protocol
    (DHCP), which is responsible for assigning Internet Protocol addresses to machines.


    Many of the security issues on the Internet are due to software assuming that
    all others are playing by the rules; for example, assuming that other programs
    follow all of the Internet Requests for Comments standards specifications and
    always exchange reasonable parameters. Cyber exploit code and malware exploit
    these design assumptions by deliberately breaking the rules and catching the off
    guard, causing the targeted software to perform operations it was not designed
    to do and on behalf of the attacker.


    # Causes, Symptoms, and Consequences


    The causes, symptoms, and consequences of this antipattern include


    +   - Lack of server authentication (HTTP, Wi-Fi, GSM, DNS, SMTP)


    +   - Lack of client authentication (HTTP, HTTPS)


    +   - Not monitoring networks for malformed protocols and packets'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Refactored Solution and Examples


    There are many inherent weaknesses in Internet technologies that you cannot mitigate.
    What can you do is use cybersecurity best practices to make your systems hard
    targets. For example, harden system configurations according to best-practice
    guidelines. The most advanced, updated solutions for antivirus, anti-spyware,
    IDS, IPS, and Host-Based Security System (HBSS). Configure systems such as Wi-Fi-enabled
    laptops to require host authentication. Engineer security into the system from
    the beginning of the development lifecycle.


    > TIP The Center for Internet Security publishes a set of security configuration
    benchmarks that combine best-in-class inputs from vendors and third-party sources.
    You can find it at http://cisecurity.org.


    # Related Solutions


    Some authorities have argued for a fundamental rethinking of the Internet with
    much stronger support for delegation of trust and attribution of user actions.
    Part III presents some approaches for achieving much greater online security.


    # Hard on the Outside, Gooey in the Middle


    Antipattern Name: Hard on the Outside, Gooey in the Middle

    Also Known As: Tootsie Pop, Defense in Depth, Perimeter Security, Protect Everything
    from All Threats

    Refactored Solution Names: HBSS, Network Enclaves

    Unbalanced Primal Forces: Management of confidentiality

    Anecdotal Evidence: "Each user''s browser is sending thousands of spyware- beacons
    every day!"; Advanced Persistent Threat; "Our networks are totally secure; we
    have a firewall."


    # Antipattern Solution


    Traditional network architectures include three major domains: the Internet boundary
    (or DMZ), the data center Storage Area Network (SAN), and the rest of the network
    (intranet). Between the DMZ and intranet, there are network security devices,
    including a firewall and possibly an IDS/IPS. Network security is concentrated
    at the firewall, and firewalls are assumed to protect the entire network.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Chapter 2 ■ The Problems: Cyber Antipatterns


    In theory, firewalls protect the network by hiding the internal IP addresses through
    network address translation (NAT) and blocking incoming packet traffic on denied
    port numbers. In practice, most traffic is concentrated on very few outgoing ports:53,
    80, and 443. These correspond to Domain Name System, HTTP, and HTTPS protocols,
    which are the core protocols of the World Wide Web. These outgoing ports are open
    on virtually all their code to take advantage of these ubiquitously open ports.
    Malware and spyware are well aware of this fact, and craft code and browser-based
    spyware send beaconing packets from infected machines inside the firewall to port
    80 on external control servers. To the firewall, these packets appear to be ordinary
    web traffic.


    > NOTE Packets destined for third-party servers are beacons. Most beacons are
    directed at port 80 and pose as ordinary web traffic. Beacons are one of the key
    reasons why network log analysis is essential. Beacons emanating from your network
    to third-party servers should be investigated. Chapter 9 covers network monitoring
    and investigations.


    In-drive-malware, attackers take advantage of the fact that most Internet browsers
    are configured to execute scripted code by default. If your browser encounters
    a malware-infected site, attacker code is executed on your system. Drive-malware
    sites are widespread on the Internet. For example, there are more than 9,000 sites
    that distribute free antivirus protection, which is really malware in disguise.
    One malware variety, ransomware, locks up your system and demands payment.


    Inside the firewall, there are few protections on intranets. However, the greatest
    threat of all, the insider threat, is inside the firewall. Insider are most dangerous
    because they have legitimate network credentials, and they know about the most
    valuable information.


    External threats penetrate networks and get inside the firewall, often through
    stealth mechanisms. In a common APT scenario, specific employees are studied using
    their online information, such as Facebook pages, LinkedIn profiles, and other
    public data. In phishing attacks, targeted e-mails are crafted with malware attachments.
    Preying on the gullibility and curiosity of people, the malware is opened and
    the system infected with, for example, a key logger. The key logger sends keystroke
    data back to the attacker on port 80, quickly gaining the user''s login credentials,
    and eventually a system administrator''s credentials when they log in to perform
    maintenance. With administrative credentials, the malware can be propagated to
    many other machines inside the firewall. In effect, the entire intranet is owned
    by the attacker.


    > NOTE In hacker slang, the affected network is "pwn3d."'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Part I | Cyber Network Security Concepts


    # Causes, Symptoms, and Consequences


    The causes, symptoms and consequences of this antipattern include


    +   - No protected network enclaves inside the firewall on the intranet

    - No HBSS

    - No configuration monitoring

    - Other cyber antipatterns such as Never Read the Logs


    # Known Exceptions


    For small networks, of perhaps fewer than 50 users, a traditional network architecture
    might be workable. However, additional measures, such as system hardening and
    HBSS, should be implemented.


    # Refactored Solution and Examples


    For larger networks, with extensive information assets, intranet security should
    be carefully designed. What are the most critical information assets in the enterprise?
    These deserve additional protection, such as a separate firewalled network enclave,
    with IDS/IPS network monitoring. Security should be focused on the assets most
    deserving of additional safeguards.


    State-of-the-art security solutions include continuous configuration monitoring.
    There are tools (such as Tripwire) that monitor changes to system files (files
    such as the kernel and dynamic link libraries). Other tools encapsulate both file
    system changes and Application Program Interface (API) calls, preventing malicious
    actions, such as McAfee HBSS. Some tools perform periodic security vulnerability
    and configuration testing, such as Retina from eEye, Nessus from Tenable, and
    NExpose from Rapid7.


    > NOTE In practice, these tools are difficult to configure properly. For example,
    if you monitor the Windows registry for changes, alerts are generated for innocuous
