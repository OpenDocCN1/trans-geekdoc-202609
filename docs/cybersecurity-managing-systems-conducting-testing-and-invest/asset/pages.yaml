- pgno: 92
  md: '# Re-Imaging Operating Systems


    In any network or security shop, rebuilding systems is a way of life. People rebuild
    systems to recycle hardware or after a system failure. People also rebuild a system
    if it is seriously contaminated by malware, such as a rootkit. If systems are
    networked at a hacker convention or cybersecurity class, a rebuild is strongly
    recommended.


    # Windows


    As a product of Microsoft, Windows is a licensed software package that must be
    purchased and installed legally. Ideally, you retain the original manufacturer
    installation disks that come with the system purchase. The original disks help
    you avoid a key headache: Microsoft Activation.


    If you install from a non-manufacturer source, Microsoft requires that you activate
    your system. You can perform the activation via the Internet or a phone call to
    Microsoft''s interactive voice response (IVR) system. One-off Windows purchases
    allow one activation per license key. Other ways to buy Windows may give a fixed
    number of activations, such as 10 from the same license key from Microsoft Action
    Pack Provider Subscription (MAPS) or Microsoft Developer Network (MSDN) Subscription.
    If activation is required, you see on-screen instructions after rebooting.


    The following is a typical re-imaging sequence for the Windows OS:


    +   1. Obtain the installation disks for Windows. Each network shop should retain
    a set of master re-imaging disks from each system purchase.


    +   2. Verify that the system is not connected to the network. You will secure
    the system before you allow it on the production network.


    +   3. Power on the machine and open the CD/DVD drive door. Insert the first Windows
    install disk. Reboot or power down and restart. The first screen is the hardware
    boot screen (sometimes called the BIOS screen). Options will be offered for accessing
    the Boot Device Menu (usually F9 or F12). If the system does not automatically
    boot off the Boot/DVD then recycle the power and access the Boot Device Menu.
    In the Boot Device Menu, select CD/DVD using the arrow keys and then press Enter.


    +   4. Follow the on-screen instructions for installation. It is usually better
    to set the Administrator password after Windows boots because it is easy to get
    an inaccurate password at this stage of the installation, and that would require
    you to completely redo the installation process.


    +   5. Insert a DVD containing device drivers for this system. Driver disks are
    provided with the hardware. Alternatively, you can download updated'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'drivers from the manufacturer’s website, burn to disk, and load offline. Make
    sure that you install drivers for all of the major devices: display, keyboard,
    mouse, network, sound, CD/DVD, USB, and miscellaneous, depending upon what hardware
    and drivers are available.


    6. The next three sections continue the installation instructions, explaining
    how to download patches, burn CDs, transfer files, secure the network with anti-malware
    tools, and install applications.


    # Linux


    The two largest Linux families are descendants of Debian and Red Hat, commonly
    called distributions or distros. There are also optional desktops for Linux variants,
    some of the most popular being KDE and Gnome. GUI applications are specialized
    for each desktop. Here are various sites where you can download popular Linux
    distributions for free:


    +   - backtrack-linux.org: BackTrack/Ubuntu/KDE is a Debian Linux distribution
    with an entire suite of penetration test tools preinstalled. Read Chapter 5,Security
    Tool Customization on Windows and BackTrack Linux,” to find out more about BackTrack
    customization.


    +   - ubuntu.com/: Ubuntu is a very popular OS, primarily for its command-line
    application interface, the apt-get command. An expanding open source community
    is creating numerous Ubuntu applications. Ubuntu installs Gnome desktop by default.


    +   - opensuse.org/en/: openSUSE is the open source version of Novell’s SU Linux.
    It is Red Hat derived and features optional KDE and Gnome desktops (or shells)
    configured by the installer. openSUSE includes a large number of pre-installed
    applications.


    +   -centos.org/: CentOS is descended from the Red Hat source code and runs Gnome
    desktop by default. CentOS bills itself as an enterprise OS. The optional Yum
    extender is a GUI tool that manages updates and application installations.


    +   - fedoraproject.org/en/get-fedora: Fedora is an open source version of Red
    Hat Enterprise Linux, and it runs Gnome desktop.


    > NOTE Check the list of more than 600 Linux distributions at http://en.wikipedia.org/wiki/List_of_Linux_distributions.
    Some names are quite surprising, such as Bhuddabuntal!


    Linux installation procedures are similar in sequence to Windows re-imaging (described
    earlier in this chapter). Depending on the packages you choose,'
  merge: -1
