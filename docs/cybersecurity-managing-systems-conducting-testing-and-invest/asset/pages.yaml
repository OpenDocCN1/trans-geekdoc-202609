- pgno: 79
  md: '# Nominal Group Technique


    Also Known As: Spit Wads (a fun variation)


    Problem Solving Type: Divergent Thinking, Information Sharing, and then Convergent
    Thinking


    Process Roles: Facilitator, Flipchart Recorder


    Content Roles: The Team


    Communication Techniques: Silent writing, group notes, group definitions, straw
    poll


    Range of Durations: 1/4 hour to 1/2 hour


    # Background


    The widely used meeting procedure called nominal group technique (published in
    1975) is only slightly varied by collecting the ideas anonymously and redistributing
    them instead of having each person read or her idea in a round robin.


    # Preparation


    The facilitator and business owner prepare a seed question that is written on
    a clipart. The facilitator brings slips of paper, spare pens, and wastebasket
    (or similar container).


    # Procedure


    The facilitator explains the technique and distributes slips of paper.


    The group silently writes to the question for a set period, typically 5 or 10
    minutes.


    The facilitator directs the group to crumple their ideas and throw them into the
    wastebasket, which the facilitator playfully catches and tries to make a game
    of it.


    The facilitator then redistributes the slips of paper randomly, and the papers
    are read aloud round robin. As the papers are read, they are recorded on the flipchart
    by the facilitator or someone in the recorder role. The ideas are then numbered.


    The facilitator asks people to define the ideas, and asks if there are any duplicates
    that should be combined.


    The final step is to take a straw poll. Have people pick the best two or three
    ideas and the facilitator calls for the votes and records the results.


    Review and conduct a focused discussion of the priorities generated.


    The discussion could then transition to action planning.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Chapter 3 | Enterprise Security Using the Zachman Framework 55


    # Minipatterns for Problem Solving Meetings


    These minipatterns are additional techniques to round out your meeting facilitation
    skills. Techniques such as breakouts and the idea parking lot are classic approaches
    for conducting effective meetings.


    # Get Organized


    If you have no agenda, brainstorm these two questions on a flipchart:


    +   - Why are we here?

    - What outcomes do we want?


    # Breakouts


    Meetings are least productive when only one person talks and everyone else does
    nothing but listen and take notes. In general, people''s creativity is inhibited
    in groups larger than five. The facilitator can ask that the group form small
    discussions to address a particular question, and then have them report their
    conclusions by subgroup. Another approach is to quickly generate a list of topics
    or concerns (brainstorming or brain writing) and then have each breakout take
    one problem to solve as a subgroup before debriefing the general session.


    # Flipcharts


    Unlike a computer or a whiteboard, flipcharts give a group unlimited space for
    creativity. When a page of a flipchart is filled, it is moved and taped to a nearby
    wall. Flipcharts are group notes; people do not need to be taking their own notes;
    they can have their heads up and be fully engaged in the meeting. Flipcharts are
    also highly portable, unlike whiteboards.


    # Time Management


    If you plan an agenda, plan the time of each meeting topic, and stick to it. Or
    ask the group if they want to extend the time. Assign a time keeper to remind
    the group. Make sure there is a highly visible clock in the meeting room. Time
    consciousness keeps people focused on problem solving.


    # Ground Rules


    Have some ground rules for each meeting so that distractions are minimized, and
    the group doesn''t waste time.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Part I Cyber Network Security Concepts


    # Parking Lot


    Post a separate clipart to chart ideas that are outside the meeting''s purpose.
    Revisit these ideas at the end of the meeting and decide as a group how they should
    be addressed.


    # Other Problem-Solving Catalogs


    General problem solving and business meeting facilitation are similar disciplines,
    and they share common catalogs of techniques. Perhaps the most widely used and
    respected catalog of techniques is Techniques of Structured Problem Solving by
    Arthur Vanundy (Springer, 1988, ISBN 978-0-442-28847-1).


    New techniques are constantly being developed. Beyond problem solving there a
    new generation of techniques based upon possibility thinking. More than 60 possibility-thinking
    methods have been published (Holman & Devane, 2007). Using techniques such as
    The Circle Way, The World Cafe, Open Space, and Appreciative Inquiry, groups are
    encouraged to explore new possibilities based on organizational strengths rather
    than dwelling on problems and weaknesses.


    # Summary


    Architecture is the design of a complex structure that enables change and reuse.
    Enterprise architecture is the architecture of an enterprise; solution architecture
    is the architecture of a system. The ability to change rapidly and confidently
    is a key to enterprise success. Incorporating cybersecurity requirements in the
    enterprise change process assures that changes result in secure systems and a
    secure enterprise.


    The Zachary Framework is a baseline reference model for enterprise architecture.
    It has six columns corresponding to different types of entities, e.g. materials,
    processes, locations, roles, events, and motivations. It has six rows, corresponding
    to different perspectives: execution, management, architect, engineer, technician,
    and the enterprise.


    The Zachary Framework is intended to be populated with primitive entities, in
    other words, entities which only address one of the basic interrogatives (questions),
    that is, what, how, where, who, when, and why. We can enumerate the 36 primitive
    models corresponding to the cells in the framework. Composite models contain combinations
    of different types of primitives. There are infinite varieties of composite models.
    The most basic are matrices that show interaction between two categories of primitives.'
  merge: -1
  img_proc: true
