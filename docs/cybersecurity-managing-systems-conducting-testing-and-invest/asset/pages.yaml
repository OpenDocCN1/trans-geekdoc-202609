  md: '# Part II - Cyber Network Security Hands-On


    +   3. From the pull-down menu select Powered-On Machine and then select the Remote
    Machine radio button.


    +   4. Enter a target IP address and login credentials.


    +   5. Select the OS family.


    +   6. Set up and run the SSH service on the target machine.


    +   7. Select VMware Infrastructure and Virtual Machine as the destination.


    +   8. Enter the VM name and then click Finish.


    This conversion might take many hours; do not perform any operations on the source
    machine during the conversion, or the file system might be inconsistent. Migrating
    a machine from a VMware Player image to ESXi is very similar. Select the Source
    pull-down to a VMware Workstation or Other VMware Virtual machine and browse to
    a VMware Player image on the local Windows machine.


    When I attempted to perform this conversion in the opposite direction (from ESXi
    to VMware Player), I encountered consistent failures. After much trial and error,
    I developed this arcane approach that produced reliable conversions:


    +   1. Log in to ESXi with vSphere Client.


    +   2. Select File Export OVA Template.


    +   3. Select Physical Media (OVA) in the pull-down menu. The system will run
    for several hours and produce a large file locally.


    +   4. Copy the Open Virtual Appliance (OVA) to an external disk and delete it
    locally.


    +   5. Verify that the local machine has more than twice the disk space needed
    to store the OVA.


    +   6. Create a directory for the new VM on the external drive.


    +   7. Start VMware Standalone Converter.


    +   8. Connect to the local server.


    +   9. Click the Login button.


    +   10. Click the Convert Machine button.


    +   11. Set the pull-down menu to Virtual Appliance.


    +   12. Browse and select the OVA file.


    +   13. Specify that the VM file system will be partitioned into 2GB files.


    +   14. Set the destination type to VMware Workstation or Other VMware Virtual
    Machine in the pull-down menu.


    +   15. Select the VMware Player version in the new pull-down menu.


    +   16. Name the VM and browse to the new external drive folder.


