- pgno: 275
  md: '# # Unpatched Systems (Critical Controls 4 & 5)


    Each new operating system vulnerability announcement creates an opportunity for
    attackers to discover lax organizations that are not updating systems in a timely
    manner. Though most enterprises have addressed this problem with automatic updates
    and patch management, there are many who have not, and they remain perpetually
    at risk of attack. Operating system attacks are more threatening than application
    attacks because of the increased level of system control and privileged access
    in system software.


    # ## Quick Hits and Solutions


    Critical Control 4 enables the discovery of unpatched systems through test scans
    of both vulnerability issues and configuration policy checks.

    Critical Control 5 helps protect unpatched systems by detecting and stopping malware
    from running, even if vulnerabilities or misconfigurations exist. You should update
    anti-malware tools very frequently, and you should configure systems not to execute
    auto-runs on removable media.


    # ## Related Antipatterns


    See “Scanning Enterprise IP Address Range (Critical Control 1)” earlier in this
    chapter.


    # ## Relevant NIST Controls


    For more information, consult NIST Special Publication 800-53 for detailed requirements,
    including the following controls: RA-3, RA-5, SC-18, SC-26, SI-3.


    # ## Lack of Security Improvement (Critical Controls 4, 5, 11, & 20)


    The security landscape is constantly changing. Enterprises must not only defend
    themselves, but should also be actively testing and improving their security posture
    to keep up with the rising level of threat. If an enterprise falls behind industry
    norms of security practices, it becomes an increasingly vulnerable and attractive
    target compared to peer organizations because it offers easier opportunities for
    attackers to compromise systems, gain access, and achieve their nefarious goals.


    # ## Quick Hits and Solutions


    Critical Controls 4 and 20 are testing regimes that will regularly reveal the
    need for security improvements. Using Control 4 on at least a weekly basis will
    uncover the gaps between current configurations and patches and the expected up-to-date
    hardening. Control 20, penetration testing, is used less frequently'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Chapter 12 | Large Enterprise Cybersecurity: Data Centers and Clouds 251


    but is significantly more flexible in the types of tests that can be conducted.
    Enterprises can challenge themselves through penetration testing to discover security
    gaps. See more about vulnerability and configuration policy scanning in Chapter
    7 and penetration testing in Chapter 8.


    Critical Control 5''s basic requirements keep malware defenses updated. But this
    is not sufficient; the enterprise should also be evaluating and implementing advanced
    measures to keep pace with the cutting edge of cyber defense—technologies such
    as behavioral detection/prevention, flow analysis, reputation-based signature
    analysis, and many more that are yet to be discovered and incorporated into the
    enterprise security.


    Critical Control 11 recommends a continuous process of minimizing open ports,
    filtering unnecessary protocols, and turning off unnecessary services. As hardware
    is added, replaced, and reconfigured you must revisit this control to ensure that
    the attack surface is proactively minimized.


    # Related Antipterns


    See “No Time for Security” in Chapter 2.


    # Relevant NIST Controls


    For more information, consult NIST Special Publication 800-53 for detailed requirements,
    including the following controls: CA-2, CA-7, CM-6, RA-3, RA-5, SA-12, SC-7, SC-18,
    SC-26, SI-3.


    # Vulnerable Web Applications and Databases

    (Critical Controls 6 & 20)


    When they exploit web applications and databases, attackers can exfiltrate data,
    corrupt data, plant malware, and penetrate systems. Attackers can plant code,
    such as cross-site scripting, which can gain control of transactions in other
    browser windows. See the discussion of web applications, databases, SQL injection,
    and cross-site scripting in Chapter 8.


    Web applications and associated databases are directly exposed to the Internet
    threat environment; their security, patching, configurations, and programming
    must be hardened rigorously. However many web applications are readily custom
    coded with technologies such as ASP.NET, Java Server Pages, and PHP. These custom-coded
    applications can have latent vulnerabilities not discovered by ordinary software
    testing.


    In particular, testing of all input fields for buffer overflow conditions and
    SQL injection characters is essential to secure the application. Application configurations
    of the web server, server-side programming environment, and database should also
    be tightly locked down.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# Quick Hits and Solutions


    Critical Control 6 for Application Software Security recommends the use of a web
    application firewall (WAF), which is a flow analysis anti-malware filtering technology
    that can stop many common forms of web and database attacks. Web application vulnerability
    scanners are useful tools for rapidly running hundreds of automated tests. Of
    course, with most other tools, the test signatures must be updated with the vulnerability
    checks and/or exploits to ensure valid test results.


    Penetration testers (Critical Control 20) also commonly use these tools to discover
    vulnerabilities for exploitation


    # Related Antipat


    See “Webify Everything” in Chapter 2.


    # Relevant NIST Controls


    For information, consult NIST Special Publication 800-53 for detailed requirements,
    including the following controls: CA-2, CA-7, CM-7, RA-3, RA-5, SA-3, SA-4, SA-8,
    SA-12, SI-10.


    # Wireless Vulnerability (Critical Control 7)


    Wireless devices communicate on the open airwaves. The wireless telephone and
    Wi-Fi protocols enable attackers to readily spoof phone towers and wireless access
    points, enabling them to take control of wireless devices, exploit them, and control
    them. When these devices are connected to corporate networks, they become severe
    threats to the enterprise, compromised internal machines, which attackers can
    use to pivot throughout internal networks.


    Additional vulnerabilities include rogue wireless access points (WAP). Easily
    implemented with cheap consumer hardware, employees often set these up for convenience.
    Rogue WAPs provide new external connections to internal networks that may be unsecured
    and difficult to detect.


    # Quick Hits and Solutions


    Wireless Device Control (Critical Control 7) recommends that all wireless devices
