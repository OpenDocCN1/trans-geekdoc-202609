- pgno: 121
  md: '# 96 Part II Cyber Network Security Hands-On


    Communications on VLAN interfaces are denied by default, so access rules must
    be established to enable communications. The following commands configure access
    rules for a straightforward network:


    ```

    $ enable

    Password:

    # show run

    # config t

    (config)# access-list in2out extended permit tcp 10.10.100.0

    255.255.255.0 any eq http

    (config)# access-list in2out extended permit tcp 10.10.100.0

    255.255.255.0 any eq https

    (config)# access-list in2out extended permit tcp 10.10.100.0

    255.255.255.0 any eq domain

    (config)# access-list in2out extended permit udp 10.10.100.0

    255.255.255.0 any eq domain

    (config)# access-group in2out in int inside

    (config)# access-list out2in extended permit host 192.168.10.101

    10.10.100.0 255.255.255.0 eq ssh

    (config)# access-group out2in in int outside

    (config)# we mem

    (config)# exit

    # show run

    # exit

    ```


    An access list (in2out) is defined with rules allowing internal hosts (10.10.100.0/24)
    to communicate using HTTP, HTTPS, and DNS protocols with any address. The access-list
    defines the rules, and the access-group assigns the rules to the interface "inside."
    An external-maintenance IP address (192.168.10.101) is allowed to connect to any
    host outside the network using SSH. That rule is applied to the interface "outside."


    Cisco has a particularly useful command-line interface. You may type a question
    mark, at any point in any command. The Cisco console displays all the available
    options for the next argument, and retypes your partial command at the next prompt.
    You can incrementally build complex commands this way, by inserting ? for each
    argument. Upstream arguments affect downstream options. For example, choosing
    the IP protocol simplifies your options to TCP and UDP protocols, which feature
    ports and services. See Chapter 6 for protocol explanations.


    The firewall can be set up to shun or block specific external IP addresses. To
    set up a shun of an outside host and remove it, use these commands:


    ```

    (config)# shun 64.94.107.0

    (config)# no shun 64.94.107.0

    ```


    You can block an address range using the 0 as a wildcard. Search the firewall
    command reference for additional operations. Make sure that the commands apply
    to your specific firewall model number, as commands vary significantly even within
    one series of devices.'
  merge: -1
  img_proc: true
