  md: '# 158 Part II Cyber Network Security Hands-On


    **NOTE** Nessus is an intuitive tool for. For more details consult the Nessus
    User Guide at www.nessus.org/documentation.


    On Linux, you can run amap for system and service fingerprinting like this:


    ```

    # nmap -oM netmap.txt 192.168.10.1-255

    # amap -i netmap.txt -bqv -

    ```


    This is an efficient way to run amap and amap together. First nmap runs a broad
    sweep, scanning the entire subset with pings, and scanning the top 1000 ports
    on each found. The amap command outputs a special file format, readable by amap
    as netmap.txt, in this case. The amap command reads the IP addresses and port
    numbers from netmap.txt. The amap command reports service banners (-b) and fingerprint
    results verbomely (-v) while being quiet (-q) about closed ports. The -H option
    avoids potentially harmful amap probes.


    **NOTE** Using amap is one approach of banner grabbing. Chapter 6 uses netcat
    to program a banner grabbing at the Linux command line.


