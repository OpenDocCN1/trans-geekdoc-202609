    - Using web browsers with malicious site filtering.

    - Using a framework such as Enhanced Mitigation Experience Toolkit (EMET) for
    all Internet-facing applications on Windows systems. EMET uses mechanisms such
    as Data Execution Prevention (DEP) and Address Space Layout Randomization (ASLR)
    to harden the runtime environment, preventing many kinds of attacks.

    - Using search engines that perform malware scanning and rating for each website.

    - Using a security plug-in, such as No Script, which gives you awareness and control
    over which code end users allow to run.

    - Configuring web application firewall (WAF) and host-based security (HBS) for
    additional protections, such as advanced filtering, intrusion detection, or protection.

    - Using black lists of blocked websites.

    - Using white lists of approved websites.


    Following Critical Control 2, you can establish software asset management, looking
    for any installed programs that are not authorized, including malicious code.
    You can also implement strict change controls that limit the introduction of unauthorized
    programs.


    Following Critical Control 3, you harden the hardware and software security configurations
    of all your machines, the security settings in browsers, the'
