    # Poor Incident Response — APT (Critical Control 18)


    Incident response is a core process for maintaining the security requirements
    of confidentiality, integrity, and availability. The Information Technology and
    Infrastructure Library (ITIL), a set of best practices for IT and data center
    operations, defines incident handling to include security, help desk/trouble ticketing,
    and handling other forms of health and status alerts.


    Enterprises with poor incident handling may never realize they are being attacked
    persistently. Typically they finally realize that they have been attacked after
    the attackers are inside their networks for six to eight months. At that point
    the enterprise has no way of discovering how the attack started because the relevant
    event logs have been discarded before. With massive compromise of the network
    already done and multiple administrative accounts owned by the attackers (including
    those with legitimate credentials stolen from valid users), it can be extremely
    difficult to eradicate the threat.


    # Quick Hits and Solutions


    Critical Control 18 recommends several best practices for improving the maturity
    and effectiveness of enterprise incident response:


    +   - Documenting the incident response procedures

    - Assuring accountability of individuals to incident response roles

    - Establishing operational deadlines for incident detection and handling

    - Notifying the appropriate CERT according to laws and regulations

    - Keeping a contact list of all points of contact potentially involved in an incident
    response

    - Inviting all personnel to report anomalies

    - Conducting training exercises to update staff knowledge about current threats
    and responses'
