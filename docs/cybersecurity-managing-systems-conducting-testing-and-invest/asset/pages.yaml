    Key Logs (versions.1,.2,.3 are chronological):

    * syslog*: system events

    * secure*: security events (not enabled on all Linux)

    * messages*: general and application events

    * auth.log*: authentication events

    * kern.log*: kernel events

    * demsg*: device events

    * dpkg*: installer events

    * samba/smbd and *: CIFS/SMB file sharing events

