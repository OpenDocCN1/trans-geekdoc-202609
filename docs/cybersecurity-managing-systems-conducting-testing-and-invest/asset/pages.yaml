    to log in using a dictionary of common passwords. In password cracking, we have
    the password hashes and can spend nearly unlimited time and space to discover
    the clear text password. If the password length is known from password policies
    (most users choose the minimum length), a powerful technique called rainbow tables
    can crack the password, even those passwords using extended character sets.


