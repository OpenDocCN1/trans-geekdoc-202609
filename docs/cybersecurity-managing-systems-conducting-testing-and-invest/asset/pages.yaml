  md: "# 212 Part II Cyber Network Security Hands-On\n\nYou can obtain an adware blocking\
    \ host list (hosts.zip) at www.mvps.org. Follow the instructions on the website\
    \ to install the hosts file. Instruct multiple administrators to install this\
    \ file on every machine on your network.\n\nNOTE There are consequences to installing\
    \ the hosts file on the network. Certain ads will not display on commercial websites.\
    \ Some applications with built-in adware transmissions will not function properly.\
    \ Consult online postings or the support contact to determine which adware domains\
    \ are required, and remove the necessary blocks.\n\nSpyware and APT threats are\
    \ constantly evolving. There will always be a gap between the IDS/IPS technologies\
    \ and the emerging threat. The last line of defense is the network defenders and\
    \ cyber investigators who can improve methods constantly in response to learned\
    \ lessons.\n\nNOTE All defenses, especially IDS/IPS, should be updated frequently\
    \ to narrow the gap between your defense and attackers' technologies.\n\nYou should\
    \ investigate all alerting IPs to gains clues about suspected malicious intent\
    \ of suspicious beacons and other packets, especially for unresolved domains.\n\
    \nFor confirmed malicious IPs, you institute network defenses at the firewall.\
    \ The command syntax varies considerably between firewall models. Supposing you\
    \ have a 5000 Cisco ASA Firewall, the following console sequence sets up IP blocking:\n\
    \n```\n$ enable\nPassword:\n# config t\n(config)# object-group network Blocked_IPs\n\
    (config-network)# network-object 64.94.107.0 255.255.255.0\n(config-network)#\
    \ network-object 66.235.147.0 255.255.255.0\n  -repeat for all alerting IPs->\n\
    (config-network)# exit\n(config)# access-list in2out2 extended deny any object-group\
    \ Blocked_IPs\n(config)# access-list in2out2 extended permit ip any any\n(config)#\
    \ access-group in2out2 int any inside\n(config)# show config\n(config)# show mem\n\
    (config)# exit\n# exit\n```\n\nThese Cisco commands begin with enable, which enters\
    \ the shell into privileged mode. The config t command elevates the shell to configuration\
    \ mode. In this mode, you define an object group Blocked_IPs. You block a range\
    \ of"
  merge: -1
  img_proc: true
- pgno: 238
  md: '# Chapter 9 - Cyber Network Defense Using Advanced Log Analysis 213


    IPs by wildcard, as in 64.94.1070, which blocks the /22 subnet.

    Rules with more specific IP addresses take precedence; the final access list of
    rules enables all other inside-to-outside communications that are not already
    blocked. The access-group command alerts the rules to interface index.


    Repeat the network-object command for many address ranges as needed. Exit returns
    us to configuration mode. The access-list command sets the firewall to block the
    inside firewall port (inside_access_in) by denying all IP packets from any IP
    address to the IP addresses in the object-group Blocked_IPs.


    Another access-list command permits all other ip traffic from any address to any
    address. To finalize, write (wr mem) the new firewall configuration to the persistent
    memory. The entire sequence blocks any internal network host from sending any
    IP packets through the firewall to any address range on the block list.


    As you conduct further investigations, additional malicious IPs will be discovered
    and confirmed. The following command sequence extends the blocked IP list:


    ```

    $ enable

    Password:

    # config t

    (config)# object-group network Blocked_IPs

    (config-network)# network-object 63.215.202.0 255.255.255.0

    (config-network)# network-object 216.34.207.0 255.255.255.0

    <repeat for additional IPs>

    (config-network)# exit

    (config)# show object-group Blocked_IPs

    (config)# show access-list in2out2

    (config)# no access-list in2out2 line 3

    (config)# access-list in2out2 extended deny any object-group Blocked_IPs

    (config)# show config

    (config)# wr mem

    (config)# exit

    # exit

    ```


    The object-group command extends the block list. The show object-group command
    displays the extended block line numbers of each firewall rule; you locate the
    rule denying Blocked_IPs. You use no access-list to remove the out-of-date firewall
    rule (for Blocked IPs), then you reassert the blocks with the access-list command.

    Additional eradication actions include examining other logs, performing forensic
    analyses, removing malware, and—worst case—rebuilding systems from trusted images.
    Antivirus (AV) logs reveal malware activity on the hosts. Access the logs from
    the AV application, look for virus alerts, and check the update status of the
    engine and AV rules.'
  merge: -1
  img_proc: true
