- pgno: 219
  md: '# Part II Cyber Network Security Hands-On


    > **NOTE** Incident response is performed in addition to the recommendations herein.
    This is a Tier 3 support activity.


    The strategies underlying this network defense process include:


    +   - Full packet capture overnight: Advanced persistent threats (APTs) from overseas
    actors are most likely to occur at night. Consequently, a full packet capture
    during this time is recommended so that you can investigate all network activity.
    When users are absent, the network and machines are relatively quiet, and few
    false positive alerts occur. You can observe more subtle activities at these times.


    +   - Investigation of all suspicious systems and external IPs causing alerts:
    By understanding the potential motivations of the external IP alerts, you can
    discover the malicious alerts on your networks and eradicate their activities
    (that is, spyware, malware, APT).


    +   - Capture of IDS alerts and alert packets during work hours: During the daytime,
    users are active on the network, an internal network might generate many alarms.
    It''s recommended that you capture all IDS alerts and the alert packets during
    these hours. You could implement a full packet capture if continuous investigation
    requires one.


