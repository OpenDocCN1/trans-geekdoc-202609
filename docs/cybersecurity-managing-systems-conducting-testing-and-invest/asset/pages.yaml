- pgno: 363
  md: '# Your organization is probably under attack right now.


    # What are you doing about it?


    Cyber crime is perhaps the fastest-growing crime category, increasing by as much
    as 300 percent each year. Your organization is undoubtedly under attack at this
    very moment.


    This book looks at security systematically. Beginning with the use of antipatterns
    and moving through improvements in security architecture, customizing tools, effective
    pen testing, and network monitoring, it demonstrates how to build security into
    your systems. Whether you''re dealing with a small business or a major enterprise,
    you''ll learn how to create and maintain cybersecurity that works.


    +   * Examine a range of common antipatterns and their refactored solutions

    * Ensure protection of Linux as well as Windows environments

    * Learn specific tools and protocols for securing healthcare IT

    * Use the exercises at the end of each chapter to improve your understanding

    * Educate your staff with a cybersecurity course built on this guide

    * Learn how to create, and migrate virtual machines for testing

    * Understand how cloud computing protects enterprise security

    * Customize BackTrack test disks with advanced tools

    * Dive deeper into intense topics such as advanced Wireshark/tcpdump filtering,
    Windows/Linux/Python networking, and invoking automated Metasploit attacks from
    operating system command line and scripts


    Visit www.wiley.com/go/cybersecurity for a custom course syllabus, PowerPoint
    slides, and test bank, as well as downloadable custom scripts for Log Analysis


    **Thomas J. Mowray, PhD**, holds gold-level certification from the SANS Institute
    in network penetration and ethical hacking. Dr. Mowray, who has earned a doctorate
    in computer science, has co-authored five other professional books, including
    Wiley''s bestseller Antipterns: Refactoring Software, Architectures, and Projects
    in Crisis. After finding the Northrop Cyber Warfare Community of Practice, Dr.
    Mowray joined the Certification and Accreditation Team (an elite cybersecurity
    test group) as their network administrator, security tools customizer, and hands-on
    penetration tester. At the time of writing, Dr. Mowray is the Chief Enterprise
    Architect of the Ohio State University.


    Visit us at wiley.com


