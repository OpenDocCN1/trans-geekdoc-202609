  md: 'Information Security Program Plan Formal document that provides an overview
    of the security requirements for an organization-wide information security program
    and describes the program management controls and common controls in place or
    planned for meeting those requirements.


    Information System Security Officer Individual with assigned responsibility for
    maintaining the appropriate operational security posture for an information system
    or program.


    Integrity Guarding against improper information modification or destruction, and
    includes ensuring information nonrepudiation and authenticity.


    Internal Network A network where: (i) the establishment, maintenance, and provisioning
    of security controls are under the direct control of organizational employees
    or contractors; or (ii) cryptographic encapsulation or similar security technology
    implemented between organization-controlled endpoints, provides the same effect
    (at least with regard to confidentiality and integrity). An internal network is
    typically organization-owned, yet may be organization-controlled while not being
    organization-owned.


    Low Impact System An information system in which confidentiality, integrity, and
    availability are assigned an impact value of low.


    Malware Software or firmware intended to perform an unauthorized process that
    will have adverse impact on the confidentiality, integrity, or availability of
    an information system. A virus, worm, Trojan horse, or other code-based entity
    that infects a host. Spyware and some forms of adware are also examples of malicious
    code.


    Management Controls The security controls (i.e., safeguards or countermeasures)
    for an information system that focus on the management of risk and the management
    of information system security.


    Media Physical devices or writing surfaces including, but not limited to, magnetic
    tapes, optical disks, magnetic disks, Large-Scale Integration (LSI) memory chips,
    and printouts (but not including display media) onto which information is recorded,
    stored, or printed within an information system.


    Mobile Code Technologies Software technologies that provide the mechanisms for
    the production and use of mobile code (e.g., Java, JavaScript, ActiveX, VScript).


    Moderate Impact System An information system in which at least one security objective
    (i.e., confidentiality, integrity, or availability) is assigned a potential impact
    value of moderate, and no security objective is assigned a FIPS 199 potential
    impact value of high.'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# Glossary 311


    Multifactor Authentication using two or more factors to achieve authentication.
    Factors include: (i) something you know (e.g., password/PIN); (ii) something you
    have (e.g., cryptographic identification device, token); or (iii) something you
    are (e.g., biometric).


    Network Information system(s) implemented with a collection of interconnected
    components, Such components may include routers, hubs, cabling, telecommunications
    controllers, key distribution centers, and technical control devices.


    Nonreudiation Protection against an individual falsely denying having performed
    a particular action. Provides the capability to determine whether a given individual
    took a particular action as creating information, sending a message, approving
    information, and receiving a message.


    Operational Controls The security controls (i.e., safeguards or measures) for
    an information system that are primarily implemented and executed by people (as
    opposed to systems).


    Organizational User An organizational employee or an individual organization deems
    to have equivalent status of an employee (e.g., contractor, guest researcher,
    individual detailed from another organization, individual from allied nation).


    Penetration Testing A test methodology in which assessors, typically working under
    specific constraints, attempt to circumvent or defeat the security features of
    an information system.


    Plan of Action and Milestones A document that identifies tasks needing to be accomplished.
    It details resources required to accomplish the elements of the plan, any milestones
    in meeting the tasks, and scheduled completion dates for the milestones.


    Potential Impact The loss of confidentiality, integrity, or availability could
    be expected to have: (i) a limited adverse effect (FIPS 199 low); (ii) a serious
    adverse effect (FIPS 199 moderate); or (iii) a severe or catastrophic adverse
    effect (FIPS 199 high) on organizational operations, assets, or individuals.


    Privacy Impact Assessment An analysis of how information is handled: (i) to ensure
    handling conforms to applicable legal, regulatory, and policy requirements regarding
    privacy; (ii) to determine the risks and effects of collecting, maintaining, and
    disseminating information in identifiable form in an electronic information system;
    and (iii) to examine and evaluate protections and alternative processes for handling
    information to mitigate potential privacy risks.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '# Glossary


    **Privileged Account** An information system account with authorizations of a
    privileged user.


    **Privileged Command** A human-initiated command executed on an information system
    involving the control, monitoring, or administration of the system including security
    functions and associated security-relevant information.


    **Reciprocity** Mutual agreement among participating organizations to accept each
    other''s security assessments in order to reuse information resources and/or to
    accept each other''s assessed security posture in order to share information.


    **Red Team Exercise** An exercise, reflecting real-world conditions, that is conducted
    as a simulated adversarial attempt to compromise organizational missions and/or
    business processes to provide a comprehensive assessment of the security capability
    of the information system and organization.


    **Remote Access** Access to an organizational information system by a user (or
    a process acting on behalf of a user) communicating through an external network
    (e.g., the Internet).


    **Removable Media** Portable electronic storage media such as magnetic, optical,
    and solid state devices, which can be inserted and removed from a computing device,
    and that is used to store text, video, audio, and image information. Examples
    include hard disks, floppy disks, zip drives, compact disks, thumb drives, pen
    drives, and similar USB storage devices.


    **Risk** A measure of the extent to which an entity is threatened by a potential
    circumstance or event, and typically a function of: (i) the adverse impacts that
    would arise if the circumstance or event occurs; and (ii) the likelihood of occurrence.
    Information system-related security risks are those risks that arise from the
    loss of confidentiality, integrity, or availability of information or information
    systems and reflect the potential adverse impacts to organizational operations
    (including mission, functions, image, or reputation), organizational assets, individuals,
    other organizations, or national interests.


    **Risk Assessment** The process of identifying risks to organizational operations
    (including mission, functions, image, reputation), organizational assets, individuals,
    other organizations, and the Nation, resulting from the operation of an information
    system. Part of risk management, it incorporates threat and vulnerability analyses,
    and considers mitigations provided by security controls planned or in place. Synonymous
    with risk analysis.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# Risk Management


    The process of managing risks to organizational operations (including mission,
    functions, image, reputation), organizational assets, individuals, other organizations,
    and the Nation, resulting from the operation of an information system, and includes:
    (i) the completion of a risk assessment; (ii) the implementation of a risk mitigation
    strategy; and (iii) implementation of techniques and procedures for the continuous
    monitoring of the security state of the system.


    # Role-Based Access Control


    Access control based on user roles (i.e., a collection of authorizations a user
    receives based on an explicit or implicit assumption of a given role). Role permissions
    may be inherited through a role hierarchy and typically reflect the permissions
    needed to perform defined functions within an organization. A given role may apply
    to a single individual or to several individuals.


    # Safeguards


    Protective measures prescribed to meet the security requirements (i.e., confidentiality,
    integrity, and availability) specified for an information system. Safeguards may
    include security features, management constraints, personnel security, and security
    of physical structures, areas, and devices. Synonymous with security controls
    and countermeasures.


    # Sanitization


    A general term referring to the actions taken to render data unrecoverable by
    both ordinary and, for some forms of sanitization, extraordinary means.


    # Security Attribute


    An abstraction representing the basic properties or characteristics of an entity
    with respect to safeguarding information; typically associated with internal data
    structures (e.g., records, buffers, files) within the information system and used
    to enable the implementation of access control and flow control policies, reflect
    special dissemination, handling or distribution instructions, or support other
    aspects of the information security policy.


    # Security Control Assessment


    The testing and/or evaluation of the management, operational, and technical security
    controls in an information system to determine the extent to which the controls
    are implemented correctly, operating as intended, and producing the desired outcome
    with respect to meeting the security requirements for the system.


    # Security Control Baseline


    The set of minimum security controls defined for a low-impact, moderate-impact,
    or high-impact information system.


    # Security Control Enhancements


    Statements of security capability to: (i) build in addition, but related, functionality
    to a security control; and/or (ii) increase the strength of the control.'
  merge: -1
  img_proc: true
- pgno: 339
  md: 'Security Control Inheritance A situation in which an information system or
    application receives protection from security controls (or portions of security
    controls) that are developed, implemented, assessed, authorized, and monitored
    by entities other than those responsible for the system or application; entities
    either internal or external to the organization where the system or application
    resides. See Common Control.


    Security Controls The management, operational, and technical controls (i.e., safeguards
    or countermeasures) prescribed for an information system to protect the confidentiality,
    integrity, and availability of the system and its information.


    Security Domain A domain that implements a security policy and is administered
    by a single authority.


    Security Impact Analysis The analysis conducted by an organizational official
    to determine the extent to which changes to the information system have affected
    the security state of the system.


    Security Objective Confidentiality, integrity, or availability.


    Security Relevant Information Any information within the information system that
    can potentially impact the operation of security functions in a manner that could
    result in failure to enforce the system security policy or maintain isolation
    of code and data.


    Spam The abuse of electronic messaging systems to indiscriminately send unsolicited
    bulk messages.


    Spyware Software that is secretly or surreptitiously installed into an information
    system to gather information on individuals or organizations without their knowledge;
    a type of malicious code.


    System Security Plan Formal document that provides an overview of the security
    requirements for an information system and describes the security controls in
    place or planned for meeting those requirements.


    Tailoring The process by which a security control baseline is modified based on:
    (i) the application of scoping guidance; (ii) the specification of compensating
    security controls, if needed; and (iii) the specification of organization-defined
    parameters in the security controls via explicit assignment and selection statements.


    Technical Controls The security controls (i.e., safeguards or countermeasures)
    for an information system that are primarily implemented and executed by the information
    system through mechanisms contained in the hardware, software, or firmware components
    of the system.'
  merge: -1
  img_proc: true
- pgno: 340
  md: 'Threat Any circumstance or event with the potential to adversely impact organizational
    operations (including mission, functions, image, or reputation), organizational
    assets, individuals, other organizations, or the Nation through an information
    system via unauthorized access, destruction, modification of information, and/or
    denial of service.


    Threat Assessment Formal description and evaluation of threat to an information
    system.


    Threat Source The intent and method targeted at the intentional exploitation of
    a vulnerability or a situation and method that may accidentally trigger a vulnerability.
    Synonymous with threat agent.


    Trusted Path A mechanism by which a user (through an input device) can communicate
    directly with the security functions of the information system with the necessary
    confidence to support the system security policy. This mechanism can only be activated
    by the user or the security functions of the information system and cannot be
    imitated by untrusted software.


    Vulnerability Weakness in an information system, system security procedures, internal
    controls, or implementation that could be exploited or triggered by a threat source.


    Vulnerability Assessment Formal description and evaluation of the vulnerabilities
    in an information system.'
  merge: -1
  img_proc: true
