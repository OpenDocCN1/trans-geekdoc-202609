- pgno: 20
  md: '# # Introduction


    This book will teach you the concepts, skills, and tools you need to survive and
    thrive in today''s threat-ridden and target-rich cyber environment.


    # ## Who This Book Is For


    The book is written for several core audiences:


    +   - Cybersecurity graduate and undergraduate students learning curriculum in
    network security

    "- Cybersecurity practitioners expanding their expertise in deep skills as advanced
    log analysis and network programming

    "- Enterprise architects and information technology (IT) professionals seek to
    deepen their practical knowledge of cybersecurity


    # ## What This Book Covers


    Instead of the usual textbook formalities, this book focuses on practical, useful
    real-world skills for the protection of networks, systems, and data against innovative
    cyber threats.


    This book is written to provide practical, advanced, undergraduate-level network
    security expertise. U.S. requirements for this level of expertise are clearly
    articulated by academic and industry members of CyberWatchCenter.org, one of the
    organizations in charge of the U.S. Comprehensive National Cyber Security'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Introduction


    Initiative (CNCI) #8 on cybersecurity education. The table of contents in this
    book derives from the consensus of the cyber industry and two- and four-year college
    cyber faculty.


    # How This Book Is Structured


    This book is organized in parts:


    +   - Part I: Cyber Network Security Concepts

    - Part II: Cyber Network Security Hands-On

    - Part III: Cyber Network Application Domains


    Part I is a conceptual discourse. From the executive perspective, Chapter 1 introduces
    you to the cybersecurity domain and some of its key challenges—in particular,
    educating a new generation of hands-on cybersecurity professionals.


    From the business management perspective, Chapter 2 uses antipatterns to explain
    the most common mistakes and bad habits in computer security today. Antipatterns
    are fun to read and discuss because they highlight the most of the most ridiculous
    and naive things people do that reveal significant security gaps. If you avoid
    the worst antipatterns, your situation will dramatically improve. This is especially
    true of cybersecurity. The choice of cyber antipatterns in the chapter is derived
    from an assessment of the most critical cyber antipatterns in current organizations,
    networks, and systems.


    Chapter 3 introduces the Zachary Framework and articulates a vision for resolving
    cybersecurity issues by transforming enterprises. Enterprises that have self-knowledge(that
    is, enterprise architecture) are able to change and respond with agility to cybersecurity
    challenges. Future organizations must adopt this vision for competitive business
    reasons as well as cybersecurity reasons.


    Part II is almost entirely a hands-on tutorial for cybersecurity techniques, including
    assignments using cyber labs from Syracuse University''s SEED: A Suite of Instructional
    Laboratories for Computer Security Education. The material in the chapters progresses
    from a more basic to a very advanced hands-on introduction to enterprise network
    security. I review networking essentials, practical skills in network administration,
    review network security programming, and then explain network penetration, Google
    hacks, BackTrack customization, vulnerability testing, and the certification testing
    process.


    The final chapter in this part is a real-world introduction to network defense,
    explaining the scripts and procedures for conducting network investigations and
    advanced log analysis.


    Part III covers several important security application domains, such as small
    businesses, data centers, clouds, and healthcare IT.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Throughout the book are hands-on exercises with online software resources called
    SEED Labs. Developing Instructional Laboratories for Computer Security Education.
    These are the invention of Professor Kevin Du from Syracuse University, who had
    the foresight to create hands-on coursework independent of any single textbook.
    An instructor manual is available from Professor Du containing exemplary exercise
    solutions. In addition, you can find instructor ancillaries available for this
    book, including a course syllabus, a test bank, and PowerPoint slides for each
    chapter.


    In profound ways, this is day zero in cybersecurity. The entire regime of paper-driven
    compliance, policy-driven certifications, and signature-based defenses has failed
    miserably (i.e., indicative of antipatterns). This book offers practical ways
    to approach cyber defenses, which leverage ongoing innovations in intrusion detection/prevention
    and malware defense. My vision is that this book sets a new level of expectations
    for advanced education in network security and plays a role in turning the tide
    against cyber criminals and cyber warriors attacking our society.


    # How This Book Came About


    I was a successful enterprise architect, but always wanted to add cybersecurity
    to my bag of tricks. I decided to make a radical change by transitioning to hands-on
    cybersecurity testing. I earned a SANS Institute GPEN certification (and then
    GPEN Gold) performing security research which allowed me, with encouragement from
    the SANS Institute''s Alan Paller, to jump right over the heads of a lot of CISSPs
    into several exciting security roles. I enthusiastically took on rudimentary tasks
    such as software installation, virtual machine migration, and administering networks,
    as well as, advanced tasks such as toolkit customization and hands-on IT certification
    testing. What I discovered was an eye opener.


    I wrote everything useful that I learned and added more content to complete a
    body of knowledge, with a specific mind in: resolving the U.S. crisis in cybersecurity
    by providing an essential, but missing, educational tool. People with the skills
    contained in this book can be valuable members of any cybersecurity team, from
    the most rudimentary and useful skills to some of the most advanced.


    # What You Need to Use This Book


    To run the Linux-based tools and scripts, download a recent release of BackTrack
    Linux from http://www.backtrack-linux.org/. Current releases of Windows should
    be able to run the Windows Command Line scripts and commands in Chapters 4 and
    6.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'The source code for the samples is available for download from the Wrox website
    at:


    www.wiley.com/go/cybersecurity


    # Conventions


    To help you get the most from the text and keep track of what''s happening, we''ve
    used a number of conventions throughout the book.


    > **WARNING** Warnings hold important, not-to-be-forgotten information that is
    directly relevant to the surrounding text.


    > **NOTE** Notes indicates notes, tips, hints, tricks, or asides to the current
    discussion.


    As for styles in the text:


    +   - highlight new terms and important words when I introduce them.

    - I show keyboard strokes like this: Ctrl+A.

    - I show file names, URLs, and code within the text like so: `persistence.properties`.

    - I present code as a monospont type with no highlighting for most code examples.


    ```

    I use a monospont type with no highlighting for most code examples.

    ```


    # Source Code


    As you work through the examples in this book, you may choose either to type in
    all the code manually, or to use the source code files that accompany the book.
    The source code from Chapter 9 is available for download at www.wrox.com. Specifically
    for this book, the code download is on the Download Code tab at:


    ```

    www.wiley.com/go/cybersecurity

    ```


    You can also search for the book at www.wrox.com by ISBN (ISBN for this book is
    978-1-118-69711-5) to find the code. And a complete list of code downloads for
    all current Wrox books is available at www.wrox.com/dynamic/books/download.aspx.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Introduction


    Most of the code on www.wrox.com is compressed in a .ZIP, .RAR archive, or similar
