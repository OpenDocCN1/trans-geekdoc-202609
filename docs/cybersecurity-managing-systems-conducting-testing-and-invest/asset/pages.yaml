  md: '# Chapter 14 - Cyber Warfare: An Architecture for Deterrence 283


    # Cyber Deterrence Challenges


    Defining a solution architecture for cyber deterrence is difficult due to technical,
    legal, and strategic factors, including:


    +   - The inherent difficulty of assigning attribution on the Internet (and the
    hiding of attribution or misdirecting attribution to other parties).

    - The unpredictability of the effects of cyber attacks.

    - The potential for damage due to counter-retaliation.

    - The fact that states, non-state actors, and individuals are at a peer level,
    capable of waging cyber attacks with readily available attack tools—for example,
    third parties joining the fray is a common occurrence during publicized Internet
    attacks (Libicki, 2009).


    There is no directly applicable legal framework for a basis for cyber war. The
    nearest analogy is the real-world Law of War, which comprises international treaties
    going back hundreds of years. One of the most applicable treaties is the Charter
    of the United Nations (UN), signed in 1945, which differentiates between legal
    and illegal acts of war. The Charter sanctions self-defense against use of force
    by states that threaten territorial integrity or political independence. The UN
    defines the scope of armed attacks as “invasion or attack, bombardment, blockade”
    of ports or coasts, and attacks on land, sea, or air forces of another state”
    (Beidman, 2009). If the effects of a cyber attack could be shown as equivalent
    to one of these real-world acts of war, then a CNA response could be legally justified.


    However, physical damage is a possible but unlikely cyber attack outcome. A cyber
    attack that scrambles the records of major financial institutions in New York
    City would be devastating to the U.S. and the world economy, but it would impact
    no physical damage, thus not constituting an act of war. More likely are cyber
    attacks such as those suffered in Estonia and Georgia, which deeply disrupted
    communications and systems through denial of service.


    No fatalities have been directly attributable to cyber attacks. However, fatalities
    are possible, as demonstrated by a simulated cyber attack on the Washington DC
    subway system, which led to dozens of simulated fatalities (Beidman, 2009). In
    that case, Schmitt Analysis technique was applied, leading to the conclusion that
    it was indeed an “armed attack.” However, this attack was judged less significant
    than an attack by humans onsite in this case the attackers were remote.


    Schmitt Analysis is a method for deciding if a cyber attack meets the criterion
    of the UN Charter for acts of war (Beidman, 2009). A key weakness of Schmitt Analysis
    is its heavy reliance on physical damage, injuries, and fatalities as key criteria.'
