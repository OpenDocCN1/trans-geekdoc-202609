- pgno: 310
  md: '# Chapter 14 Cyber Warfare: An Architecture for Deterrence 285


    Governments must act to manage these threats to protect their own societies and
    the global economy, which is increasingly dependent on the Internet.


    The conclusion from Cyber Shockwave and other evidence is that an effective cyber
    deterrence strategy and architecture are not feasible given current U.S. and international
    legal and policy frameworks. In order for this discussion to proceed, we must
    make some enabling assumptions about future legal and treaty frameworks.


    The following list of assumptions is driven by technical research as shown in
    Figure 14-1. The research premise is that we can solve cyber deterrence challenges
    technically (see the "Reference Model, "Solution Architecture," and "Architectural
    Prototypes sections shown later in this chapter), but a caveat that we need to
    have a legal justification where none exists today. As a result, this section
    answers the following question: If we must do what we propose technically, what
    legal justification do we need in terms of treaties and laws?


    This section is not a formal legal analysis. However, discussion is possible using
    the reasonable-person standard of common sense. Eventually, legalities can be
    resolved by diplomats, legislators, and advisors. This discussion also assumes
    that our cyber operation is explicitly military in nature.


    +   - Suppose there be future national laws and international treaties governing
    the conduct of cyber war and cyber operations. We will call the members in future
    treaties "signatories".


    +   - Future national laws will allow legal conduct of cyber operations against
    perceived enemy states and non-state actors.


    +   - Future international treaties will allow legal conduct of cyber operations
    traversing signatories'' networks. The treaties should not mandate the disclosure
    of the cyber operations. as sub rosa retaliation and implicit deterrence in the
    next section.


    > Sub rosa means that the action is conducted covertly.


    +   - Servers involved in cyber attacks may be owned and operated by unaware third
    parties. Future treaties and laws should allow that servers used in cyber attacks
    or illegal activities can be exploited for monitoring purposes by signatory states,
    a critical provision for resolving attribution. If these servers are determined
    to be non-life critical (that is, not to healthcare delivery or power infrastructure),
    defensive CNA can be legally conducted to these machines and networks in response
    to an attack (including the use of the machines as a counter-attacking force).


    +   - Treaties should define the criteria for state-attribution of an attack,
    and how-establishment of attack (such as the location of attack servers within
    national boundaries) can be addressed diplomatically, militarily, and legally.'
