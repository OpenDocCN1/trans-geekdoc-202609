- pgno: 153
  md: 'Because you know the active hosts on your network from the previous ping sweep,
    you can focus your scan where it will be most productive. If you store the last
    IP digit, line-by-line, in a file called hosts, a script like this iterates through
    the hosts, reconstructing the full IP addresses. This example is an introduction
    to the bash command.


    ```

    while read n; do echo 10.10.100.$n; done < hosts

    ```


    The while statement is performing I/O (read) from a standard input file (< hosts)
    line-by-line, the variable n becomes each last IP digit, and is typed to standard
    output by the echo command.


    Replacing the echo command with the nmap scan, you can scan all the active hosts
    for OS, services, and versions like this:


    ```

    while read n; do nmap -O -sV --top-ports 9 10.10.100.$n; done < hosts

    ```


    The output is a bit hard to read, so you can add some more lines and links like
    this:


    ```

    while read n; do echo -e "\nSCANNING 10.10.100.$n"; nmap -O -sV --topports 9 --reason
    10.10.100.$n; done < hosts

    ```


    The echo command sends a blank line with the -e option (enable escapes) and \n
    (newline) in the expression. Backslash (\) is the escape character. The quoted
    expression for echo evaluates to newline, text (SCANNING), and IP address. Here
    you use nmap --reason option, which provides a more descriptive output, especially
    in case of no response by the host to probe packets.


    Finally, you can package this script in a file with your username and make it
    a reusable tool in our cybersecurity arsenal, like this:


    ```

    #!/bin/bash

    trap bashtrap INT

    bashtrap() { echo "Bashtrap!''; exit; }

    if [ $# -eq 0 ]; then network="10.10.100"; else network=$1; fi

    while read n; do echo -e "\nSCANNING $network.$n"; nmap -O -sV --topports 9 --reason
    $network.$n; done < hosts

    ```


    Chapter 7 introduces many nmap features.


    # Bash Banner Grabbing


    Banner grabbing is another scanning technique, which can be very revealing. A
    banner is the first response a service makes after a TCP connection is made to
    an open port. For example, if you connect to SSH, FTP, or Telnet, the service
    responds with a short welcome message and asks for your username. In your case,
    the service describes itself—for example, the web server, OS, and version numbers
    for HTTP. To grab a banner using netcat, use the following:


    ```

    # nc -n -v -wl 10.10.100.100 22

    ```'
