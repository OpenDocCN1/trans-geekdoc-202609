- pgno: 7
  md: '# About the Technical Editor


    Rob Shimonski is a highly experienced technologist and business leader with more
    than 20 years of real-world experience in the field. Rob started his professional
    career in the military and is now focused primarily on healthcare. Rob has worked
    for countless companies, including Microsoft, Cisco, and the National Security
    Agency. As a security expert, Rob has been entrenched in the cyber-world for two
    decades and has lived through the technical evolution of the “war.” Rob is also
    a best-selling author and editor with more than 15 years’ experience developing,
    producing, and distributing print media in the form of books, magazines, and periodicals.
    To date, Rob has successfully helped create more than 100 books that are currently
    in circulation.'
