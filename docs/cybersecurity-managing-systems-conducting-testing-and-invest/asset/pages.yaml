- pgno: 128
  md: '# # CHAPTER 5

    # Customizing BackTrack and Security Tools


    BackTrack is a custom operating system for security testing built upon Ubuntu
    and the KDE desktop. Chapter 8 explains how to apply BackTrack as a penetration
    testing platform, and Chapter 9 discusses how to use it as a network sensor and
    log analysis platform.


    BackTrack is a free Linux distribution that includes hundreds of free security
    testing tools. You can use BackTrack in its default configuration; however, there
    are many additional capabilities and tools which you can add through security
    tool customizations.


    Many important security testing tools only run on Windows environments. You need
    to find a way to provide Windows as a test platform accessory to BackTrack. There
    are also tools with commercial or other restrictive licensing schemes that are
    not included on BackTrack, but they are useful in your testing environment.


    You can put your network administration know-how to good use supporting other
    security professionals with their testing needs. BackTrack comes in two downloadable
    forms: the bootable International Standards Organization (ISO) image and the VMware
    image. It is also possible to create a hard-disk version of BackTrack from the
    ISO. You utilize both these forms in the customization process.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# Creating and Running BackTrack Images


    BackTrack is an open source Linux distribution available as an ISO CD image and
    as a virtual machine (VM). There are multiple releases available online, as BackTrack
    3, 4, r-1, r-2, and beyond. This chapter refers to the current release as btN-rm.iso
    (the ISO image) and btN-rm-vm.bz2 (the VM tar ball).


    You can download the BackTrack images from www.backtrack-linux.org/downloads/.
    Because these files are multiple gigabytes, direct download might be a lengthy
    and error-prone process. An alternative is to download using a peer-to-peer file
    sharing application such as BitTorrent (at www.bittrent.com/). At any given time,
    there might be several dozen peers online that can send small pieces of the target
    file asynchronously in randomized order. The torrent process is also lengthy,
    but it''s more reliable than direct download. It is a good idea to verify the
    integrity and originality of the BackTrack image using the hash provided on the
    BackTrack Linux site.


    > NOTE By default, the file sharing program on your machine becomes part of the
    peer network and begins sharing pieces of the file with other file users.


    Use a disk burning program as Brasero or MagicISO to burn the BackTrack ISO to
    a DVD. Test the new DVD by booting up BackTrack on a test system. Insert the DVD
    into the disk drive, invoke the Boot Device Menu, and select from CD/DVD.


    > TIP You can freely download Brasero from http://projects.gnome.org/brasero/.
    You can purchase and download MagicISO at www.magiciso.com/


    In recent versions of BackTrack, there is somewhat dangerous icon on the desktop
    that contains the ubiquity --desktop %k gtk_ui script. Double-click, the Ubuntu
    install GUI runs, enabling you to install BackTrack to the hard disk. If that
    is your intention, follow the on-screen directions to resize a BackTrack partition.
    When making multi-partition drives, you usually install Windows first and then
    resize the partitions to install BackTrack.


    BackTrack ISO operating system (OS) uses a random access memory (RAM) disk, a
    file system that allocates portions of the RAM for any changes to the file system
    on the DVD. A minimum RAM size of 4GB is recommended.


    Because 4GB is also the maximum for a 32-bit address space, further expansion
    (PAE) kernel, a Linux kernel that supports a 36-bit address space (64GB maximum).
    The PAE kernel is, however, incompatible with some software packages; for example,
    I was unable to run VMware Player on my BackTrack PAE. Eventually BackTrack will
    adopt 64-bit Ubuntu to avoid these incompatibilities.

    Wie'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Chapter 5 Customizing BackTrack and Security Tools 105


    The BackTrack VM image, bTN-rM-vm.tar.bz2, can be unpacked with the tar command
    (see “Installing Applications and Archiving” in Chapter 4). Download and install
    the VMware Player from www.vmware.com. Start VMware Player from a menu command
    or double-clicking the desktop icon and then opening an existing machine in the
    folder where you unpacked the BackTrack VM.


    > TIP Choose a stable version of VMware Player, such as a major generation prior
    to the current release. In general, wait until the second incremental release
    of a software package (such as 9.2) before you upgrade.


    # Customizing BackTrack with VM


    A key difference between the BackTrack ISO DVD and the BackTrack VM is that the
    VM has persistence. Changes you make in the VM environment survive reboot, but
    the ISO always comes in the the same state. You can customize BackTrack images
    if you can modify BackTrack and make a new ISO image.


    Fortunately, the website www.offensive-security.com provides a BackTrack customization
    script bTN-customize.sh and online tutorials on various BackTrack procedures (visit
    www.backtrack-linux.org/tutorials/). What this chapter explains how individual
    procedures can be applied to support security testers, with explanations, pitfalls,
    and tradeoffs.


    With the VMware Player version of BackTrack, perform network setup and sftp or
    Common Internet File System (CIFS) to load the bTN-rm.iso file and the bTN-customize.sh
    script into the BackTrack VM (see “Setting Up Networks and Moving Data Systems
    on Networks”) Create a directory /root/BUILD, move the files there, and change
    directory to BUILD. Invoke the customization script ./bTN-customize.sh.


    If you examine this, there are three phases. The first phase unpacks the BackTrack
    ISO and creates a complete file system under /root/BUILD/edit. In the second phase,
    the chroot command creates a command-line shell that is inside the scope of the
    new file system. The shell returns to the user, who virtually sees the file root
    “/” at /root/BUILD/edit. The third phase generates the new ISO image.


    > TIP You might need to modify the BackTrack filenames or rename the files accordingly.


    At this point it is customary to update and upgrade Ubuntu, as well as perform
    FastTrack updates of the pen test tools (see the next section of this chapter).
    You can make additional customizations, such as using apt-get to install various
    tools or manually installing *.deb images using dpkg.'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'When the customizations are complete, the exit command returns control to the
    btN-customize script for the third and final phase. In this phase, the virtual
    BackTrack file system is remapped to generate a new ISO in the /root/BUILD directory:
    btN-rm-modified.iso. Move this file to a system disk burner, and burn the image
    to a DVD. Boot off the DVD to verify your work.


    Back in the BackTrack VM, notice that the unpacked BackTrack file system is still
    present. You can revisit this for further customizations without unpacking the
    ISO. For future customizations, you can comment the first and middle phases of
    the btN-customize.sh script, and then chroot manually to the /root/BUILD/edit
    directory. You can have multiple shells using chroot to manage complex customizations.
    Run the btN-customize.sh script from the BUILD directory to repack the BackTrack
    ISO.


    # Updating and Upgrading BackTrack and Pen Test Tools


    It is important for a pen tester to keep his or her systems and test tools up
    to date. BackTrack offers preinstalled commands and applications to assist you.
    The updateBT.sh script performs this automatically:


    ```

    #!/bin/bash

    apt-get update

    apt-get upgrade

    apt-get update

    apt-get dist-update

    apt-get clean

    cd /pentest/exploits/fasttrack

    python fast-track.py -i; sudo -s

    ```


    The apt-update command gathers version information about installed and available
    Ubuntu packages. The apt-get upgrade and dist-upgrade install new packages. Use
    apt-get clean to remove temporary files. The fast-track.py script updates individual
    pen test tools; it pops up an interactive shell with update options. The sequence
    for the recommended options is FastTrack updates (1), update everything (12),
    main menu (13), and exit (11).


    # Adding Windows to BackTrack with VMware


    One method of adding Windows to a BackTrack OS is to run it as a VM. In an earlier
    section of the chapter, you installed a VM to customize BackTrack. Now you can
    perform the VMware Player installation inside your virtual file system with a
    chroot shell. Then you need to create a Windows VM in the virtual file system..'
  merge: -1
