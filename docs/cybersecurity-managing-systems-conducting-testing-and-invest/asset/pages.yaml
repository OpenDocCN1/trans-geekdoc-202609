    # Customizing System Management Controls and Settings


    This section is a general introduction to system management controls. Subsequent
    sections cover specific uses of these controls.


    # Windows


    There are several ways to access the system management controls in Windows:


    +   - Control Panel''s Administrative Tools folder

    - My Computer (right-click and select Manage)

    - Run command


    Select Start Run with the string mm to open an Microsoft Management Console (MMC).
    The last method of the three bullets above yields the most console options. Use
    File (formerly Console) Add/Remove Snap-in. Select a management function and click
    OK.


    Options include management of devices, disks, events, services, users, group policy
    objects, and others. Some of the command-line tools for network administration
    include the following:


    +   - netstat, nbtstat, netsh: Network status and settings

    - net use, wmic: Remote access and remote management'
