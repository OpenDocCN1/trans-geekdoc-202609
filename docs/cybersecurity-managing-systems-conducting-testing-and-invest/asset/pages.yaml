    PM-6, SA-1, SA-6, SA-7, SI-7.


    # Unpatched Applications in Large Enterprises

    (Critical Controls 2 & 4)


    While operating system patching and upgrading is reasonably responsive to new
    announced vulnerabilities, application-level vulnerabilities due to out-of-date
    patching remains a significant vulnerability. A key part of this problem is that
    application software is often made by different open source development groups
    and vendors, compared to the base operating systems, leading to different patching
    policies, procedures, schedules, and technologies, which are difficult to manage
    in complex enterprises.


    To a certain extent, this is a problem caused by security and software industries.
    Software developers plan to announce vulnerabilities when the repairs are available
    in form of patches. Other security researchers, independent of software development
    groups, are also discovering vulnerabilities. Many of the ethical researchers
    will give the software developers advanced warning before going public with their
    findings. However, there is competitive pressure to be the first to publish; and
    so this collaboration is informal, voluntary, and imperfect.


    Meanwhile malicious code developers are given significant clues about what to
    attack through frequent vulnerability announcements made by the U.S. Computer
    Emergency Response Team, software developers releasing patches, and many other
    sources in the security industry. When security researchers release an exploit
    their vulnerability announcement, they have done all the homework for the attackers.
    Patch Tuesday is followed by Exploit Wednesday, when attackers have a field exploiting
    systems and applications that have not had the patches applied in a timely manner.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# Chapter 12 Large Enterprise Cybersecurity: Data Centers and Clouds 247


    # Quick Hits and Solutions


    According to Critical Control 2, enterprises should identify approved software,
    including versions and builds. You should frequently run automated integrity checking
    to verify that the applications are not modified from the approved patched baseline.
    Whenever unapproved software is detected, the configuration scanning tool should
    generate an alert. You should establish rigorous change control processes.


    According to Critical Control 4, you should run vulnerability and configuration
    (policy) scans on all systems at least once a week, see Chapter 7, “Reconnaissance,
    Vulnerability Assessment, and Cyber Testing,” for the discussion of scanning techniques
    and tools. You should add the scanner alert logs to the body of evidence that
    you review regularly. The security team should be well informed about security
    alerts, such as CERT’s Current Activity notices.


    See the original documentation for additional steps and requirements.


    # Related Antipatterns


    See “Unpatched Applications” in Chapter 2.


    # Relevant NIST Controls


    For more information, consult NIST Special Publication 800-53 for detailed requirements,
    including the following controls: CM-1, CM-2, CM-3, CM-5, CM-7, CM-8, CM-9, PM-5,
    PM-6, SA-6, SA-7.


    # Internal Pivot from Compromised Machines (Critical Controls 2 & 10)


    After a vulnerable machine has been compromised and escalated with administrative
    privileges, attackers have many options to expand their presence in the enterprise.
    They can create new accounts, establish back doors (new methods of access), install
    software, and use their internal network foothold to attack and compromise additional
    machines. Many of these techniques are discussed toward the end of Chapter 8,
    “Penetration Testing.” Chapter 6, “Protocol Analysis and Network Programming,”
    covers network programming techniques that can be used in a raw shell inside a
    compromised machine to scan internal networks, such as ping sweeping, port scanning,
    and banner grabbing.'
