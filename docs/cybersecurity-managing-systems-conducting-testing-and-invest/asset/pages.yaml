  md: '# Chapter 14 | Cyber Warfare: An Architecture for Deterrence 305


    A reference architecture is proposed (refer to Figure 14-4), and it identifies
    the essential functions of cyber deterrence capabilities. The scope of cyber deterrence
    architecture is large and the requirements are numerous, as indicated by the reference
    model in Figure 14-4. Because covering all of those areas would require another
    book-length project, detailing each of the capability areas is beyond the scope
    of this book. So, the chapter continues focusing on the parallel scanning function.


    One of most important challenges is determining attack attribution within milliseconds.
    A solution architecture that leverages a priori knowledge requires that details
    about potential attackers be gathered beforehand. This should include detailed
    intelligence about the top 1,000 or so botnets, although the potential threat
    is likely an order of magnitude larger. Network sensors should be placed where
    attribution can be rapidly confirmed. A flexible architecture involving a blackboard
    and diverse knowledge sources could aggregate the required information and rapidly
    analyze it for cyber decision support.


    Multithreading is a programming technique with useful applications in penetration
    testing. The prototype measured speed of more than 40 times, comparing multithreaded
    Python scans to serial-loop scans programmed in shell scripts such as ping


    Hands-on programming and benchmarking are shown in the “Architectural Prototypes”
    section. This research grounded the concepts in reality, and resolved major architectural
    unknowns. The botnet prototypes reveal strengths and weaknesses of multithreading
    and distributed processing, with important architectural insights for future military
    botnets.


