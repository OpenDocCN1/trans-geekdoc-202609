- pgno: 202
  md: '# Chapter 8 Penetration Testing 177


    In Paros, you can copy, paste, or modify any information you choose because you
    click Continue to go to the next message. Web cookies and many other attributes
    are plainly visible, copyable, and alterable.


    Paros enables you to visualize how web attacks work. Suppose a user has logged
    into her banking website and then opens a new tab. In a Cross-Site Request Forgery
    (XSRF), the user then opens a malicious website, where the browser opens a URL
    bearing a transaction to the banking website. The bank receives the request directly
    from the user''s browser and executes the transaction.


    In both XSRF and cross-site scripting (XSS), the malicious website might just
    be an innocent site that allows malicious content to be posted, as an Internet
    bulletin board, group-e mail archive, blog comments, or malware hidden in third-party
    advertisements (also known as malvertisements); see Chapter 10.


    An XSS works the same way, except the malicious data is a script instead of a
    URL. The XSS code running in the browser can do whatsoever with the user''s credentials
    in any browser tab or window. For example, it can steal cookies, perform transactions,
    scrape browser pages, access history, and manipulate administrative websites where
    the user is logged in or has browser-stored credentials.


