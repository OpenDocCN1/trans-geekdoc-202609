- pgno: 311
  md: 'Certain cyber operations should probably be restricted by treaty. For example,
    the use of third-party hosts (machines not involved in cyber crimes or cyber attacks)
    to conduct defensive CNA should probably be prohibited.


    The differentiation between military and nonmilitary is a key tenant of the legal
    (defensive) conduct of warfare. A legitimate military force always wears uniforms
    with insignia; otherwise, a nonuniformed fighting force could be considered unlawful
    combatants and potential war criminals. This concept could be emulated in cyberspace
    by a treaty provision such as signatories shall use readily attributable network
    assets to conduct military cyber operations—that is, the Internet Protocol (IP)
    addresses and domains shall be readily traceable to military government sources
    through common Internet services such as whois.


    NOTE Nonmilitary uses of cyber warfare are not addressed here; it is beyond the
    scope of this chapter.


    For purposes of law enforcement and cyber defense, there should be allowed official
    investigations of illegal and potentially hostile (in other words, cyber war and
    cyber terror) activities on third-party servers.


    For major cyber attacks, attribution can very likely be determined or strategically
    inferred. International cooperation, diplomacy, and law enforcement should eliminate
    many of the criminal and independent threats. As Kugler states, that leaves the
    remaining threats to be peer-level state actors, rogue states, and terrorists.
    Deterrence of each potential adversary should be handled in a tailored response
    (Kugler, 2009).


    With these assumed treaties and laws in place, cyber retaliation (defensive CNA)
    would be considered fair play treaty-proscribed conditions. We have also allowed
    the use of both implicit and explicit cyber deterrence policies, and substantial
    leeway in terms of the public disclosure of cyber operations. The next section
    applies these legal assumptions to the strategy of cyber deterrence.


    # Cyber Deterrence Strategy


