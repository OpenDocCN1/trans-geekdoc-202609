- pgno: 148
  md: '# Chapter 6 = Protocol Analysis and Network Programming 123


    TCP is a connection-oriented protocol and uses a three-way handshake to establish
    connections:


    +   - A packet with only a SYN flag is a connection request.


    +   - An SYN-ACK packet is a successful response (as shown).


    +   - The ACK flag sets the connection acknowledgement.


    TCP connections are used by application-level protocols, which add their own header
    and payload to the TCP stack. The TCP flags for normal processing include the
    following:


    +   - Synchronize (SYN): Request a new connection and synchronize sequence numbers.
    See ECE and ACK flags.


    +   - Acknowledgement (ACK): Indicates receipt of a packet and supplies a new
    Acknowledgement Number. SYN+ACK is used for the second packet in a three-way handshake.
    Normally, each data packet is sent in numbered sequence, with a numbered ACK response.


    +   - Finalize (FIN): The connection can close because there is no more data to
    send.


    +   - Reset (RST): If an error occurs, the reset flag is set. The connection is
    closed forcibly or refused.


    A primitive Quality of Service (QoS) mechanism in TCP is controlled by the following
    flags. These flags only imply a best effort at controlling timeliness and throughput:


    +   - Explicit Congestion Echo (ECE): Notifies the receiver of network congestion.
    If SYN is also set, ECE indicates that the sender has congestion control capability.


    +   - Congestion Windows Reduced (CWR): Recipient of an ECE packet acknowledges
    that it has reducing flow rate.


    +   - Push (PSH): Request to forward data to the Application Layer on the recipient
    immediately, rather than reassemble packet fragments in Layer 4.


    +   - Urgent (URG): Urgent handling of this packet by the network is requested.
    The TCP header''s Urgent Pointer is a count of the urgent bytes in the TCP data
    payload field.


    > NOTE TCP does not implement any QoS guarantees for timeliness, but does guarantee
    end-to-end data integrity.


    Window size is the maximum bytes that can be buffered by the sender for future
    packets. The TCP checksum verifies the integrity of both the header and the payload.'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'The past few sections covered how security professionals interpret packets
    from the network for the most important Layer 1 through 4 protocols. The next
    sections introduce network programming using the Linux Bash shell and the Windows
    command shell. These skills will be useful for all hands-on security operations.


    # SEED LABS


    The SEED labs for this section include Tasks 3, 4, 5, and 7 of the Attacks on
    TCP/IP Protocols (TCP/IP Attack Lab) under the Vulnerability and Attack Labs category.
    This lab explains exploitable weaknesses of TCP protocols. You can access the
    SEED labs at www.cis.syr.edu/-wedu/seed/all_labs.html.


    # Network Programming: Bash


    The major command shells for Linux and Unix include the C shell (csh); Bourne
    shell (sh), which is the default on many Unix operating systems; and the Bash
    shell (bash), which is the default on many Linux operating systems. This chapter
    uses the Bash shell and points out any major differences with Unix. Bash is available
    on Linux and Unix systems, but it is not always the default. Your default shell
    is listed on your account line in /etc/passwd. Modify your line using the path
    returned by this command:


    ```

    # which-bash

    ```


    > NOTE The examples in this book, which are based on BackTrack, assume that your
    Bash shell is at /bin/bash.


    You can write a single-line bash script directly on the command line. A multiline
    bash script is stored in a text file for invocation from the command line. Every
    bash script and bash command has standard input, standard output, and standard
    error. A command can send from its standard output to another''s standard input
    using a pipe, as in this script:


    ```

    # cat /tmp/alertIPs | sort uniq -c | sort -nr

    ```


    This single line pipes a file (cat), sorts an IP list (sort), eliminates duplicates
    (uniq -c), and sorts the results in reverse (-r) numerical (-n) order. Chapter
    9 runs these many times for log analysis.

    A script can output to a file at the end of a command line in the following examples:


    ```

    # sort /tmp/alertIPs | uniq -c | sort -nr >> NewFile.txt

    # sort /tmp/alertIPs | uniq -c | sort -nr >> AppendedFile.txt

    # sort /tmp/alertIPs | uniq -c | sort -nr | tee NewFile.txt

    ```


    * Note'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# Chapter 6 = Protocol Analysis and Network Programming 125


    The first creates a new file or replaces one of the same name. The >> appends
    to a file. The first two shows no output to the user. The tee command shows output
    to the user and creates or replaces the file; this is useful for monitoring the
    progress of a script while saving the output.


    Another separator, the semicolon (;), denotes a sequence of commands. For example:


    ```

    # echo Hello Universe! > /tmp/tmp; cd /tmp; ls; cat tmp; rm tmp; ls

    # cd -

    ```


    These commands are executed one after the other, including create a file /tmp/tmp,
    change directory to /tmp (cd), type file (cat), remove the file (rm), directory
    listing, and change to your home directory (cd -).


    Redirection of input and output (I/O) can be accomplished with the notation for
    standard input (< or 0), standard output (> or 1>), and standard error (2>). For
    example, to redirect standard error to standard output and append to a single
    file:


    ```

    # mount error >> log.txt 2>&1

    ```


    Similarly, standard input can be redirected from a file:


    ```

    # sort | uniq -c | sort -nr < /tmp/alertIPs

    ```


    or


    ```

    # sort | uniq -c | sort -nr 0 < /tmp/alertIPs

    ```


    You will use I/O redirections in sophisticated ways for pen testing with netcat,
    a powerful tool for relating network traffic from the Linux and Windows command
    line (see Chapter 8).


    # Bash for Basic Network Programming


    Suppose you want to find active hosts on a /24 subnet, the host could be at any
    address between 10.10.100.1 and 10.10.100.254. First, you need to generate all
    the numbers 1 to 254. The seq command runs on Linux and Solaris systems:


    ```

    # seq 1 254

    ```


    You can transform this sequence into a command-like argument using any of the
    following syntaxes:


    ```

    # echo "seq 1 254"

    # echo \$(seq 1 254)

    # echo {1..254}          but not on Solaris

    ```


    There are several types of quotes. Back quotes ('''') evaluate the expression
    before the main command is executed. Single quotes('''') yield a literal expression
    (no evaluation at all), and double quotes("") allow evaluation of expressions
    and script parameters $1, $2, $3, which are covered later.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# 126 Part II Cyber Network Security Hands-On


    The ping command is your network probe. By default, ping runs in an infinite loop
    on Linux, and four times on Windows. Because you are doing many pings, you want
    the script to run fast without waiting long for non-response. The following ping
    command suffices:


    ```

    # ping -c1 -w2 10.10.100.100

    ```


    ping sends one time (-c1) and waits 2 seconds (-w2) for a response. You can use
    a bash for loop to iterate:


    ```

    # for i in `echo {1..254}`; do ping -c1 -w2 10.10.100.$i; done

    ```


    The variable i is given each successive value 1..254; the ping is executed; and
    the output is sent to the command-line terminal. Because this is a single-line
    command, it can be used on a remote machine that you have exploited and created
    a command shell during a pen test.


    # Bash Network Sweep: Packaging a Script


    Instead of retyping the for every time you want to ping sweep, you can package
    this useful operation as a script. The convention is to indicate the shell type
    on the first line; bash shell (sh), bash, Python, and Perl are options (the which
    command).


    For example, create the following text file "sweep" and then use chmod +x to make
