- pgno: 38
  md: '# Chapter 1 ■ Executive Summary 13


    The following is a recommended list of specialized skills that should be available
    on-demand in IT security shops:


    +   - Network Device Specialist: Vendor-certified specialist with deep knowledge
    for debugging and configuring the network devices in your shop—for example, routers
    and firewalls. Applicable certifications are from CISCO, Novell, and other networking
    vendors.


    +   - Operating System Security Specialist: Specialist in configuring and hardening
    the security of each operating system in your environment. Applicable certifications
    and training from Microsoft, Oracle (Sun), Tresys Technology (Linux), Red Hat
    (Red Hat Linux), Novell (SUSE Linux), eEye Digital Security, and other operating
    system (OS) developers and specialists.


    +   - Database Security Specialist: Specialist in configuring of specific database
    database types in your environment. Applicable certifications and training from
    Oracle, Sybase, Application Security Inc., Well House (open source), and other
    database specialists.


    +   - Systems Forensic Specialist: Specialist in in-depth analysis of systems,
    creating chains of evidence, and other forensic investigation techniques. Applicable
    training from Defense Cyber Crime Center, SANS Institute, Guidance Software, Access
    Data, and other forensic specialists.


    +   - Reverse Engineering Malware Specialist: Researcher who captures malware
    and analyzes its characteristic with the goal of permanent eradication from your
    networks. Applicable education and training from SANS Institute, Invisible Things
    Lab, Black Hat courses, and other security researchers.


    # Summary


    This chapter introduces a new way of thinking about computer security through
    a high-level discussion of antipatterns, which are habitual mistakes made in the
    IT security industry. It provides a stark assessment of the current state of cyber
    threats and defenses, so that you can have a clear understanding of the growth
    and significance of cybersecurity threats.


    The chapter discusses key concepts from antipatterns and security architecture
    and presents some high profile antipatterns along with their refactored solutions.
    The chapter’s concluding solution is an in-depth discussion of cybersecurity learning
    opportunities.


    The next chapter introduces a techno-political framework (an expanded antipatterns
    catalog) that can foster organizational change for improved cyber defenses.'
