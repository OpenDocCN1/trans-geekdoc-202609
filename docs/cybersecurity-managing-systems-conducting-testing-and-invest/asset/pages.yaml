- pgno: 58
  md: '# Chapter 2 * The Problems: Cyber Antipatterns 33


    # Background


    Security is usually the final consideration in the development of a system. Sometimes
    security is left out altogether in the rush to get products out the door.


    # Antipattern Solution


    Developers of software projects, and now also widget developers, often wait until
    the end of the development lifecycle to address security. Near the date that the
    enterprise release process will test security vulnerabilities, managers and developers
    begin a madcap cover-up process to obscure inherently insecure software, user
    account, and configuration practices. When confronted, developers can claim ignorance;
    they are not security experts after all.


    # Causes, Symptoms, and Consequences


    The causes, symptoms, and consequences of this antipattern include


    +   - Security was never part of the requirements.


    +   - Saving on development costs and time at the expense of security.


    +   - Project is behind schedule.


    +   - Shared administrator accounts.


    +   - Not training the developers to be security aware.


    # Known Exceptions


    If the software is out-of-the-box, it is already near the end of the development
    cycle and can be configured for security just prior to deployment. However, you
    are taking it on faith that the original software developers accounted for security
    and built in appropriate configuration settings.


    # Refactored Solution and Examples


    Security risks and requirements should be analyzed early in the development cycle
    at the same time as functional requirements. This is not as difficult or expensive
    as it sounds. Business stakeholders should categorize the system, such as: confidentiality
    high, integrity medium, and availability medium (see NIST SP 800-30, -37, -53
    or CNSSI 1253). You can select the baseline security requirements rather mechanically
    using these profiles and the NIST 800-53 controls catalog. This delivers a set
    of security requirements close to the desired set, which you tailor to your specific
    situation during development. The security requirements should be given first
    class status in the overall requirements set.


    ![](img/58b756e5b149184e369c845a987fc3a2_58_0.png)'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Related Solutions


    You can select security and audit controls using the Committee on Sponsoring Organizations
    (COSO) and Control Objectives for Information and Related Technology (COBIT) frameworks
    for commercial systems and to satisfy Sarbanes Oxley requirements.


    # Summary


    This chapter covers the core antipatterns for cybersecurity. An antipattern is
    a bad practice that is widely in evidence. Antipatterns make you aware of mistakes
    and give those practices a bad name.


    The chapter starts with an explanation of antipatterns. A pattern resolves design
    forces and yields benefits. Antipatterns resolve design forces and generate mostly
    consequences, i.e., negative impact. The primal forces, forces which are always
    present, are functionality, confidentiality, integrity, and availability.


    Alternative antipatterns are introduced; these structure the antipattern with
    distinct explanations. The antipatterns in this chapter use the full template.


    The antipattern catalog contains seven major antipatterns, in addition to the
    micro-antipatterns from Chapter 1. Chapter 12 contains yet another antipattern
    catalog related to the Top 20 Critical Controls.


    Can''t Patch Dump is an antipattern about human vulnerabilities. Chapter 10 resolves
    this antipattern with end-user security education.


    Unpatched Applications is a classic computer security vulnerability that persists
    in many organizations. Chapters 10, 11, and 12 cover best practices for application
    updating, and Chapter 5 covers updates to security tools.


    Networks Always Play by the Rule is an antipattern about extreme vulnerabilities
    in core networking technology, especially wireless protocols, which readily allow
    spoofing of wireless base stations by attackers.


    Crunchy on the Outside Gooey in the Middle is an antipattern about poor network
    engineering practices. This antipattern is revisited in Chapter 12 for the security
    control Secure Network Engineering.


    Webify is an antipattern about the poorly thought-out practice of putting infrastructure
    and application control panels in Internet browsers. If the administrator also
    browses to a malicious website, attackers can gain control of the control panel
    through cross-site scripting.


    Finally, No Time for Security, is a very common antipattern. One keeps security
    professionals well employed. It is typical for network and application developers
    to put no thought into security until cyber security testers arrive. Invariably,
    there is a mad scramble to secure the systems, after they are already built.'
  merge: -1
  img_proc: true
