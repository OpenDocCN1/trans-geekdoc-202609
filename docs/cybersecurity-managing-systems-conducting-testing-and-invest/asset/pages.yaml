    The command-line version of Wireshark on Windows is called treshark.exe. It converts
    files from multiple packet capture formats into the standard libcap format used
    by Snort, tcpdump, and other applications, like this:


    ```

    C:\> treshark.exe -r input.binary -w output.cap -F libpcap

    ```


    Data carving tools like Netminer can recover files sent over the network automatically.
    It is also possible to carve data manually.


    > TIP Make sure that the full packet capture with tcpdump is set to snap length
    -80 to recover all the bytes.


    # Data Carving


    Data carving is the process of extracting file information from a stream of network
    data. File signatures are binary patterns that occur at the beginning, and sometimes
    at the end, of files. When files are sent in unencrypted packets, these signatures
    become embedded patterns, but usually not at the beginning of the packet content.
    You can find an authoritative list of file signatures from www.garykessler.net/file_sigs.html.


    In the Wireshark Filter box, use Frame Contents to discover file signatures. PE
    and MZ are common ASCII header sequences to look for Windows executables. Right-click
    the packet and invoke the Follow TCP Stream command. Extract the file content
    using a hex editor (hexedid) by deleting bytes preceding the file header. Search
    for a file end signature (if available), or another file header to delete bytes
    from the end of the file.


    Submit suspicious binaries to https://www.virustotal.com to determine if it contains
    malicious code. Virustotal runs antivirus scans from more than 30 vendors on your
    uploaded file and reports the results.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# Advanced tcpdump Filtering and Techniques


    Wireshark and tcpdump are similar in capability and often interchangeable. The
    snort.log#### files should always be small enough to work with Wireshark; however,
    some full packet captures can exceed Wireshark''s capabilities. The workaround
    is using tcpdump to filter packet captures and create text logs.


    You use tcpdump to convert binary packet captures to human-readable text. A useful
    example of this


    ```

    # tcpdump -nnxttt -r OVERNIGHT.cap | tee output.txt

    ```


    The -nn option suppresses Domain Name System (DNS) name translations. The -x option
    generates hex and ASCII packet representations. The -tttt option adds full year-date
    to each packet header in the output. The optional tcp command saves the text to
    output.txt and also displays the text on standard output for immediate user reader.
    Add pipe to less ( less ) if you are searching for something in the output.


    Having much of the same functionality as Wireshark filtering, tcpdump filters
    for TCP packets to or from an IP address with the following command line. The
    result is saved as binary packets, which you could view and analyze within Wireshark.


    ```

    # tcpdump -r input.cap -w output.cap host 10.10.100.100 and tcp

    ```


    The examples in Table 9-2 parallel the previous filters given for Wireshark.


    Table 9-2: Advanced tcpdump Filtering


    | FILTER/SEARCH OPERATION | EXAMPLE TCPDUMP COMMAND-LINE FILTERS |

    | --- | --- |

    | Show packets from specific protocols | ip<br> ip6 or icmp<br> tcp and udp<br>
    not arp (exclude arp) |

    | Search for specific IP addresses, including sources (src) and destinations (dst)
    | host 10.10.100.100<br> host 1.2.3.4 or host 5.6.7.8<br> "host 1.2.3.4 and (udp
    or tcp)" (grouping)<br> src host 10.10.100.100 and tcp<br> dst host 10.10.100.100
    and udp<br> net 10.10.100.0/24 (entire subnet)<br> host 66ff:ab79:::5c8 (IPv6)
    |'
