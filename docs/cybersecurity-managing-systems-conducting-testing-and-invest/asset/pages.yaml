- pgno: 46
  md: '# Chapter 2 ■ The Problems: Cyber Antipatterns 21


    # # Can''t Patch Dumb


    Antipattern Name: Can''t Patch Dumb


    Also Known As: Social Engineering, Phishing, Spam, Spyware, Drive-by Malware,
    Ransom-Ware, Autoplay Attacks


    Refactored Solution: Security Awareness


    Unbalanced Primal Forces: Confidentiality (for example, divulging private information),
    integrity (for example, rootkits)


    # ## Antipattern Solution


    The end''s lack of security awareness puts his personal information and the organization''s
    competitiveness at risk. Social engineering—the art of extracting sensitive information
    from people—exploits a human''s inherent tendency to help other people. Unaware
    users are easily fooled into opening malicious e-mail attachments, responding
    to spam offers, and downloading spyware, ransomware-ware, and malicious websites.


    The spyware problem is much more widespread than people realize because it involves
    not just spyware applications, but also spyware that is running in browsers that
    is served up knowingly by Top 100 websites such as ESPN.com and Disney.com. There
    are thousands of web-tracking companies making money spying on your web activities
    and vacuuming information from all your browser tabs.


    About 9,000 malicious websites offer free antivirus solutions. When you install
    these applications, what you get instead is a threat and a warning to pay the
    vendor or your computer becomes unusable


    Drive-by malware are computer infections that are loaded automatically when you
    visit a malicious website. Some of these sites are from legitimate businesses
    that have been hacked and exploited to download malware. Legitimate websites can
    also spread malware from their advertisements, which are controlled by third parties.


    Autoplay infections result when malware is introduced by a user from a Universal
    Serial Bus (USB) memory stick, often in violation of organizational policies.
    By default, Microsoft Windows autoplays programs on memory sticks whenever one
    is inserted. Memory sticks with autoplay infections are distributed accidentally
    by legitimate companies at trade shows. They have propagated viruses from educational
    networks to home networks, and were used to spread malware attacks such as Stuxnet.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'The antipattern occurs when organizations do not take adequate precautions
    to keep their end users from inadvertently compromising their systems or divulging
    information to strangers.


    # SECURITY AWARENESS CAN BE A GAME


    With the Microsoft Security Development Lifecycle (MSDL), Microsoft includes a
    free educational game called Elevation of Privilege (EOP). Players play role attackers
    and pose mutual threats, such as denial of service, spoofing, data spills, and
    EOP. The game teaches security terminology and is an entrée to threat modeling,
    which is the core concept of MSDL. For more information and to download, visit
    www.microsoft.com/security/sdl/eop.aspx.


    # Causes, Symptoms, and Consequences


    Causes and symptoms of this antipattern are a lack of a recurring security training
    program for all end users, including a test assessment.


    # Refactored Solution and Examples


    Security awareness training should be mandatory for every person in an organization.
    Training should be completed before a person is given computer access, and then
    the organization should conduct annual refresher courses. The courses should include
    training on social engineering skills as well as Internet safety. The training
    should articulate the organization''s policies on what information can be divulged
    to which groups of customers or co-workers.


    An online program with integrated testing is ideal and ensures that the required
    skills are acquired. Test answers can be used for accountability, proving that
    particular policies were known by specific individuals.


    # Related Solutions


    End users should have website advisors installed, perhaps as part of the antivirus
    suite. Users should take even further precautions, such as using Google to reach
    websites. Google constantly scans the Internet for malware. Before a user clicks
    through to a suspected malicious site, Google gives a warning message on the search
    page, and presents a challenge page to further persuade the user to avoid the
    website.


    Solutions such as the Firefox extension NoScript are all-or-nothing to effectively
    dissuade users from unsafe surfing behaviors. NoScript stops web scripts by default,
    requiring user permission to enable them on each webpage.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Chapter 2 ■ The Problems: Cyber Antipatterns


    After some experience, many users will enable scripts we everywhere, or at least
    on many Top 100 websites where the biggest spyware threats reside. See Chapter
    9 for some more effective ways of stopping malware and spyware.


    Chapter 10 addresses end-user security awareness, including the use of NoScript
    and many other end-user security techniques.


    # Unpatched Applications


    +   Antipattern Name: Unpatched Applications

    Also Known As: Vendor-Specific Updates, Default Configuration

    Refactored Solution: Patch Management

    Unbalanced Primal Forces: Management of integrity


    Anecdotal Evidence: "Most new attacks are going after the applications, not the
    operating systems."


    # Background


    According to software testing expert Boris Bezier, vendors release new software
    at the earliest point when the telephone and other support costs will not erase
    profits. U.S. telephone support is approximately $40 per call, and outsourced
    telephone support is approximately $15 per call. For example, early versions of
    Windows were released with about 25,000 known defects.


    Patches are updates that repair known defects. All defects are potential security
    issues, given the likelihood that a defect in one part of the software could affect
    any other part of the system. Many of the defects in patch updates are security
    related, either discovered by the vendor, external security researchers, or from
    malware caught in the wild.


    The worst case of this antipattern is when systems with default configurations
    are put on production networks. This applies at the operating system level, as
    well as to the installed applications. Often, applications are deployed with helper
    systems, such as backup servers and staging machines in default configurations,
    because all of the security focus is on the production systems. Without patching
    and security hardening, over time, publicly announced vulnerabilities and published
    exploits proliferate, making the systems increasingly insecure.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Antipattern Solution


    According to SANS Institute''s 2010 list of top security vulnerabilities, unpatched
    applications are one of the biggest security risks. Add-on applications such as
    QuickTime for Windows, Acrobat, Chrome, and many others are frequent sources of
    security warnings from the United States Computer Emergency Readiness Team (US-CERT).
    Vendors try to release patches at the same time that the defects are announced.


    The lag between the patch release and the installed update creates a vulnerability
    for attackers. Announcement of the vulnerability and the binary patch gives attackers
    clues about how to exploit the weakness. Eventually, security researchers may
    release the exploit publicly.


    SANS found that enterprises are very effective at keeping operating system patches
    current, but they are ineffective at keeping application patches up to date.


    # Causes, Symptoms, and Consequences


    The causes, symptoms, and consequences of this antipattern include


    +   - Automatic update disabled on any application where it''s active

    - Never visit vendor websites to search for updates

    - No inventory of applications and vendors

    - No update maintenance schedule

    - Not reviewing the US-CERT bulletins

    - No governance of application versions


    # Known Exceptions


    If software product support has expired (as it has for early versions of Windows)
    and there are no further vendor updates, migration to a supported version is strongly
    recommended. Each organization should maintain a list of approved standard versions
    of all software applications. Some vendors, will continue to support the product
    with security patches for an additional fee.


    # Refactored Solution and Examples


    A first step toward managing your patches is obtaining an inventory of systems
    and installed software packages. On small networks, you can enable automatic updates
    on Windows and applications such as Acrobat and Firefox. For other applications,
    such as video drivers, you might have to update from the vendor''s website.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Chapter 2 * The Problems: Cyber Antipatterns


    Keep an eye on the US-CERT bulletins. If there are serious vulnerabilities announced
    for your applications, follow the Patch Available links and install the patches.
    In some environments, sophisticated users can maintain their own systems in this
    manner.


    For larger networks, patch management tools can maintain hundreds or thousands
    of machines with minimal effort. Some best-in-class vendors of these technologies
    include Landesk, BMC, Altiris, and HP.


    For even greater assurance, many shops are adopting vulnerability scanning tools,
    such as Retina by eEye, Nessus from Tenable, and Nexpose from Rapid7. Tools are
