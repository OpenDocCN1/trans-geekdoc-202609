  md: '# Chapter 6 - Protocol Analysis and Network Programming 127


    In this script, $1 substitutes the value Parm1, $2 is arg2, and $5 is 10.10.100.

    The expression $0 is ./myscript.sh, and $# is equivalent to $1 $2 $3 $4 $5.

    The expression $# yields the number of command-line parameters, 1 ... N.

    You can apply this to your your ping sweep to substitute the IP address with a

    parameter:


    ```

    #!/bin/bash

    trap bashtrap INT

    bashtrap() { echo "Bashtrap Punt"; exit; }

    for i in $(echo "1.254"\); do ping -c1 -w2 $1.$i; done

    ```


    Parameter $1 supplies the IP prefix in 192.168.10. Suppose that most of the

    time you are scanning 10.10.100, but you also want the flexibility of using an
    IP

    parameter. You can make this conditional using a bash if statement:


    ```

    #!/bin/bash

    trap bashtrap INT

    bashtrap() { echo "Bashtrap Punt"; exit; }

    if [ $# -eq 0 ]; then

    network="10.10.100"; else

    network=$1

    fi

    for i in $(echo "1.254"\); do ping -c1 -w2 $network.$i; done

    ```


    The if statement tests the number parameters ($#); if there are no parameters,
    in your original sweep script, the default is 10.10.100. A variable

    network is assigned this value. Otherwise, network becomes the value of the

    first parameter ($1) and is used in the ping to form the IP address ($network.$i).


    > TIP Use # man test to discover many other comparison operators.


    The output is cluttered; Chapter 9 explains convenient techniques of

    filtering output using gawk and sed.


    # Bash Network Scanning Using While


    Ping only reveals the presence of a responsive host. If ICMP is blocked then

    host might be available but not returning messages. Suppose you want to

    get more information such as OS type, open service ports, and service version

    numbers. Frankly, there is a powerful network scanning tool available called

    nmap. An nmap command follows the desired information:


    ```

    # nmap -O -sV --top-ports 9 10.10.100.10

    ```


    The -O option scans for OS type; -sV checks for service versions on option

    ports; --top-ports 9 scans the top nine most likely ports to be open, based

    on a widespread survey of the Internet, and 10.10.100.10 is the remote host

    address to scan.'
