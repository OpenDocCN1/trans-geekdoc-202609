    # The orgcap Script


    Before analyzing the detail IP file for alerting domains, take a look at a somewhat
    simpler version that scans for domains from all alerting hosts.


    The orgcap script extracts external IPs and resolves domain names for all hosts/in
    an entire file:


    ```

    #!/bin/bash

    cat alert | gawk ''BEGIN {FS="\n";RS="\n\n"} {print $3}'' | gawk ''{print $4;
    print $2}'' | gawk -V|| ''{print $1}'' | gawk ''//192.168.1/'' | gawk ''!/10.10.1/''
    | gawk ''[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+ | sort | uniq > /tmp/alertIPs

    ```


    ```

    while read ip; do whois $ip | gawk ''/OrgName/ {print $2}''; echo $ip; done <
    /tmp/alertIPs

    ```


    To use the orgcap script, execute the command ./orgcap.


    The orgcap script selects the third line of each alert—the line that contains
    IP addresses (with the first gawk). The second gawk selects both source (print
    $2) and destination (print $4) IP addresses from the second and fourth fields
    respectively.


    Instead of using {print $4, $2}, you use {print $4; print $2} to put each IP:port
    on a separate line


    The third gawk splits off and discards the port numbers. The fourth and fifth
    gawk eliminates internal IP addresses; you are only interested in external domains.
    The sixth gawk eliminates superfluous lines, and the sort | uniq eliminates all
    duplicates. The resulting external IP list is stored in /tmp/alertIPs.


    The last command line is a bash loop. The alert IPs are standard input. Each IP
    is resolved using the whois command.


    For any domains that are not properly resolved (anonymous domains), run whois
    manually over the IP, or browse to http://whois.arin.net to resolve the name.
    For example:


    ```

    # whois 10.10.100.100

    ```'
