    # SEED LABS


    The SEED labs for this section include the DNS Pharming Attack Lab under the Vulnerability
    and Attack category. This lab explains exploitable weaknesses of DNS protocols.
    You can access the SEED labs at www.cis.syr.edu/-wedu/seed/_labs.html.


    # Network and Port Scanning


    Scanning usually occurs after you have narrowed your focus to a specific set of
    IP addresses or a client-validated address range. A basic scan of a network range
    is invoked like this:


    ```

    # nmap -A 10.10.100.1-254

    ```


    In this case, nmap is invoked with the all (-A) option, which performs a full
    battery of scans for ports, services, and operating system (OS) fingerprints.
    This scan gives you a reasonable mapping of a subnet, and it is sometimes the
    first scan in a network test. This scan runs through 10.10.100.1 and all addresses
    through 10.10.100.254. 10.10.100.255 because these typically denote the entire
    subnet and the broadcast IP address respectively.


    By default, nmap scans the 100 most likely ports, based on an extensive Internet
    survey. As a security tester, you are interested in finding services on any port.
    For example, ordinary services or a malicious back-door listener could be anywhere
    in the port range. You can scan all ports on a particular host like this:


    ```

    # nmap -A --reason -vvv -PN 10.10.100.100 -p0-65536

    ```'
