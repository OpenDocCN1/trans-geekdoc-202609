  img_proc: true
- pgno: 309
  md: '# Part III Cyber Network Application Domains


    The Council of Europe''s Convention on Cybercrime addresses cyber criminality
    but does not address cyber war by states and non-state actors. About 40 developed
    nations including the U.S., Canada, South Africa, Japan, and various countries
    of Eurasia have signed or ratified the convention. Many countries with noncoincident
    associations with malware and cyber attacks (such as Russia, China, and Brazil)
    are not signatories. The treaty leaves standard definitions of cybercrime and
    leaves it to each individual country to define laws and penalties, which vary
    wildly.


    In a televised exercise called Cyber Shockwave (Bipartisan Policy Center, 2010),
    the lack of policy and legal frameworks was dramatically played out in a simulated
    cyber war attack on the U.S. national infrastructure. The players in the simulation
    experienced former federal executives who had played similar roles in prior U.S.
    administrations. News coverage of the event was widespread, and sources are listed
    on the Bipartisan Policy Center website. Here are a few examples with important
    observations of the event:


    +   **National Public reported:** "The general consensus of the panel today was
    that we are not prepared to deal with these kinds of attacks," said Eileen McMenamin,
    vice president of communications at the Bipartisan Policy Center.\Whether these
    threats come from individual hackers, state organizations or terrorist groups,
    they are very real and something we really need to be prepared for" (Baschuk,
    2010).

    **TechEYE.net reported:** Senior officials said that legislation was needed to
    provide for defense against a cyber attack, while private organizations were totally
    unprepared for such a scene to be played out in reality (TechEYE.net, 2010).

    **AOLnews.com reported:** The intelligence community might be able to track down
    the attacks to a specific country or even pinpoint servers, but figuring out precisely
    what person or group is behind the attack may be impossible.\ "Without attribution,
    we can''t go to the issue of retaliation" ... a participant stated.


    # Legal and Treaty Assumptions


    Due to the magnitude of cyber threats, there is an urgent need for countries to
    make headway on laws and treaties addressing cyber warfare. There are more than
    2,000 active botnets on the Chinese Internet alone, and possibly an order of magnitude
    more botnets globally (Zhuge, Holz, Han, Song & Zou, 2007). Even a modest botnet
    of 1,000 hosts could take down almost any business website or government Internet
    portal with a denial of service attack. Each botnet owner is capable of significant
    acts of cyber crime and cyber war.'
