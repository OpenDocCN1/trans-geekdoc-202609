  md: '# 132 Part II Cyber Network Security Hands-On


    To convert this script to a batch file, you need to change the variable names
    from %h (single to double percent), and save the script to sweep.bat. You can
    add a parameter for the address prefix by creating a new environment variable
    using the set command. The resulting script is the following:


    ```

    set network=$%

    /L %%h in (2, 1, 255) do ping -n 1 %%network%%%%h | find "byte=" > .nul && echo
    Host at %%network%%%%h

    ```


    Invoke this script like so:


    ```

    $C:\> sweep 192.168.10

    ```


    The set command creates the Windows environment variable network; its value is
    set to the first command-line parameter, as 192.168.10 in the example invocation.
    The value of network is retrieved later using the syntax %%network%%. The loop
    variable uses the %%h notation as described.


    # Windows Command Line: Password Attack For /F


    In this section, you develop a bash script that performs a brute password attack
    on Windows. In a brute force attack, a script makes repeated login attempts, differing
    between commonplace passwords from a listed password dictionary. Password dictionaries
    and dictionary generators are easily found through Internet searches, from sites
    like darknet.org (http://tiny.com/b7a9iq).


    > TIP You never know where a displayed URL will take you based on the hyperlink
    text. Compare the underlying hyperlink. Tiny URLs are even more obscure. Add an
    = as shown and tiny.com reveals the underlying link. As a further precaution,
    use a search engine that works (like Google) or an antivirus safe-browser feature.


    If you have a password list in pass.txt, a simple for loop iterates through the
    passwords looks like this:


    ```

    C:\> for /F %%p in (pass.txt) do @echo %%p

    ```


    This for /F loop reads the file pass.txt line and echoes each line to standard
    output.


    Applying the previous use example, the following script performs password-guessing:


    ```

    C:\> for /F %%p in (pass.txt) do not use \\10.10.100 %%p /u:tester && echo PASS%%p
    and not use \\10.10.100 /del

    ```


    This script iterates through the password dictionary, trying to remotely log in
    with net use; when successful it echoes the password and deletes the connection.'
