  md: '# CHAPTER 3


    # Enterprise Security Using the Zachman Framework


    This chapter is a self-contained introduction to enterprise architecture, beginning
    with the basic question "What is architecture?" Next the chapter introduces the
    Zachman Framework, the most famous conceptual standard for enterprise architecture.
    The chapter concludes with a patterns catalog for enterprise architecture problem
    solving.


    # What Is Architecture? Why Do We Need It?


    For thousands of years, humankind has used architecture to create and reuse buildings.
    The architecture is the core description of a building. The architecture describes
    the building''s structure and all of the building''s systems.


    When the architecture reflects optimal and effective design, you can make changes
    to a building with confidence. By knowing the architecture, you know if you can
    knock down a wall, drill a hole, or put in a new window without causing some catastrophe,
    such as collapsing the roof, bursting a water pipe, or severing an electrical
    wire.


    If you don''t know the architecture, or it is flawed or ineffective, making changes
    to a building is difficult. If you make changes by trial and error, you might
    knock down a wall that is a load-bearing wall, which will collapse part of the
    building.


    One alternative is to reverse engineer the building and re-create the architecture.
    But, reverse engineering is time consuming and expensive. You are much'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Part I Cyber Network Security Concepts


    better if your original architecture is optimally designed and kept up to date
    and at the ready for the next time you need to make changes to the building.


    System architecture is similar. It represents the design elements of a computer
    system. Like walls support the roof of a building, some of these elements should
    support system security requirements. Ideally, security should be designed and
    built into the architecture of a system from inception.


    # Enterprises are Complex and Changing


    Consider the United States Capitol in Washington, DC. This is an immense legislative
    building of a very complex enterprise, the U.S. federal government. Consider the
    complexity of this building and all other Federal buildings. Then consider the
    furniture inside, which is movable; the equipment, as copy machines and telephones;
    and finally the computers that are changing in real time as systems are upgraded,
    relocated, and updated.


    Finally there are the people, with their churning organization structure, personal
    relationships, roles, responsibilities, knowledge, skills, and abilities. The
    people not only include politicians, government employees, and contractors, but
    also the external people and organizations who interact with the federal government,
    including more than 300 million citizens.


    The federal government is an organization undergoing massive changes driven by
    aggressive legislative deadlines and other environmental forces. Because the government
    needs to change, they need an enterprise architecture. Every agency has dozens
    of architects maintaining their enterprise architecture, and dozens more designing
    their solution architectures (of systems). They have a difficult task, but one
    that must be done to enable the government''s need to change.


    The U.S. Capitol is one complex building in a very complex dynamic enterprise.
    To represent (or model) this complexity in a meaningful way, you need an enterprise
    architecture framework to guide your analysis. The Zachman Framework is a widely
    used intellectual standard used to analyze and represent enterprise architectures.


    # The Zachman Framework for Enterprise Architecture


    The Zachman Framework, invented by John A. Zachman, is an intellectual tool for
    describing enterprises. Because enterprises are inherently complex, you need a
    powerful framework to describe them—a framework that divides and conquers complexity.


    The Zachman Framework (see Figure 3-1) slices and dices complexity into rows and
    columns. The columns are the six basic questions you could ask about any subject.
    These interrogatives include: What? How? Where? Who? When? Why? These are the
    same questions journalists ask to write newspaper stories. When a journalist has
    answered these six questions, he or she can claim to have a complete story.'
  merge: -1
  img_proc: true
