- pgno: 186
  md: '# Chapter 7 = Reconnaissance, Vulnerability Assessment, and Cyber Testing 161


    (POAM), and any prior BOE reviews. The server IP addresses, OSes, and applications
    that reside on them are needed to define the Security Assessment Plan (SAP).


    CTPs (Functional and Certification Test Plans) are prepared by the test client
    to self-test their system. CTP tests are often executed during cyber testing with
    independent observation by the security assessors (test team).


    The SAP defines the scope of the test, the approaches, the specific tests to be
    conducted, and the tools used. Prepared by the test team, the SAP should address
    requirements in the Security Controls Compliance Matrix (SCCM).


    The SAP can almost entirely boilerplate. It is a good idea to include what is
    out-of-scope, as well as the project risks. Project risks are situations that
    could result in the project going overtime, over budget, or deliver less than
    the expected quality. Project risk mitigations are the backup plans that clearly
    accountability, in case the risks become realized). The SAP part that changes
    are the specific tests to be run on the OSes and applications identified in the
    checklist. The SAP and Rules of Engagement (ROE) should be approved with signature
    by a client executive, indicating an acceptance of enterprise risks due to testing.


    The ROE defines what kinds of testing are allowed, roles, responsibilities, and
    how the testers and client communicate—for example, daily teleconference. ROE
    is the legal authority to conduct the test. It identifies people by name with
    their contact information. For example, it is rare but possible that social engineering
    testing is permitted in most environments. Operational environments may exclude
    pen testing because there is high risk of system and service crashes. Permissions
    for policy scans and vulnerability probes are usually allowed. The ROE defines
    which parts of the test are announced and which parts are conducted without advance
    warning to the network and system managers. The organization’s behavior can vary
    dramatically by the types of tests.


    The test results are the outputs from the test tools. The test results are analyzed
    by testers to create the Security Assessment Report (SAR). The SAR provides summary
    and detail views of the test findings and recommendations. A finding is a conclusion
    based on evidence. Category I vulnerabilities are automatic findings, unless they
    are found to be false positives. Make sure that every finding appears reasonable
    based upon available evidence. Testers must review the findings with the client
    before finalizing them. False positives and unacceptable recommendations are readily
    revealed by doing so. In some cases, the client will want to make some immediate
    fixes to address serious problems. Fixes should not occur during testing; changes
    can lead to inconsistent or incorrect test results, and introduce new vulnerabilities.


    The Plan of Action and Milestones (POAM) is the client''s plan to mitigate high-impact,
    repairable findings. The POAM is based upon the SAP, selecting between recommended
    fixes for each finding. The POAM includes a schedule for deploying the fixes.'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'The Initial Authority to Test (IATT) is a document signed by the CISO or executive
    author. As part of the enterprise change control process, IATT gives permission
    for the test client to connect a new system to the production network. Limitations
    of what the system is allowed to do, what kind of data is permitted, the scope
    of the test user community, the goals of the test, and the duration of the test
    should be spelled out.


    The Authority to Operate (ATO) is permission to operate the system in a production
    mode. The ATO is signed by the CISO or executive authorization officer, and should
    identify the POAM conditions and ATO duration.


    # Summary


    This chapter covers how to conduct tests and the early phases of testing, which
    focus on information gathering.


    Different forms of cybersecurity testing include the body of evidence (BOE) review,
    penetration tests, vulnerability assessments, security controls audits, software
    injections, and iterative-incremental testing. These tests run the gamut from
    review of documentation to full-spectrum, hands-on testing procedures.


    The cybersecurity testing methodology, also known as white hacking, follows a
    logical sequence of steps which parallel what black hackers would do to discover,
    penetrate, and exploit systems and their data. The early steps, are generally
    not considered invasive, are detailed in this chapter. Chapter 8 covers the invasive
    procedures which are generally illegal without written authorization from the
    target organization.


    The first step, reconnaissance, comprises remote information discovery across
    the Internet. Advanced Google searches, also called Google hacks, can be used
    to uncover a plethora of security information from the Internet. These techniques
    are also useful, in general, by power users for Internet research.


    Beyond Google hacks and GHDB, discovery tools such as the command tools: nslookup,
    whois, dig, and host retrieve information about Internet domains and IP addresses.
    Similar capabilities are provided by websites and online Internet authorities.
    The Way Back Machine is a website that archives Internet pages. I also cover command-line
    scripting techniques for domain name harvesting.


    The section on network and port scanning covers advanced uses of nmap, a powerful
    network scanner. nmap performs simple searches for machines and open ports as
    well as sophisticated scans that resemble network vulnerability tests. I also
    cover packet spoofing techniques which can reveal additional information about
    networks through observation by Wireshark and tcpdump.


    Policy scanning includes testing of systems configurations for insecure settings
    and installed programs. These are tests usually executed locally from'
