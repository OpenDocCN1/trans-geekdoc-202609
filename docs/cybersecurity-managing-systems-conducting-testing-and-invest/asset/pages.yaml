- pgno: 116
  md: '# Chapter 4 ■ Network Administration for Security Professionals 91


    # Windows File Sharing


    To enable Windows File Sharing, create a new folder on the C drive. Right-click
    the folder and select Properties. Go to the Sharing tab and click the Share button.
    n Security tab, enable the users and permissions for the users and groups desired.


    Suppose you give full control to MyUser for the folder MyShare on host 10.10.100.10.
    To exchange data from a remote system (10.10.100.20), open a folder and replace
    the address bar content with \\10.10.100.10\MyShare (and then press Enter). A
    username/password challenge dialog displays; fill it in and click OK. Now the
    share will be open. On each machine, you can drag files into the MyShare folder
    and access them on the other system.


    To add Linux and Unix systems to the Windows share, perform the following commands:


    ```

    # mkdir /mnt/MyShare

    # mount -t cifs //10.10.100.10/MyShare /mnt/MyShare -o user=MyUser

    ```


    The mount type -t cifs is for Common Internet File System (CIFS), which supports
    the Microsoft Server Message Block (SMB) protocol. This is a Universal Naming
    Convention file pathname.


    # Secure File Transfer Protocol (SFTP)


    SFTP runs over SSH, providing an encrypted channel for transfers. Windows SSH
    and SFTP are not enabled by default, but they are readily enabled in Linux (see
    the “Managing Remote Login” section earlier in this chapter). For example, log
    using SFTP to a machine at 10.10.10.10 as MyUser, and then transfer a file using
    the following commands:


    ```

    #sftp MyUser@10.10.10.10

    Password:

    MyUser@host-$ pwd

    MyUser@host-$ ls

    MyUser@host-$ get fileNeed.txt

    ```


    SFTP has many common OS commands available in remote versions: pwd, ls, cd, get,
    and put. SFTP also has commands that work in the local context: 1pwd (local working
    directory), 1ls (local directory listing), and 1cd (local directory change).


    # VMWare


    VMs are networked devices just like any other. Use the normal OS commands for
    moving data, as discussed here.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Other Techniques


    Secure copy is another SSH-based remote copying protocol. You can use it to copy
    between all manner of Windows and Linux systems if SSH and secure copy (SCP) protocols
    are enabled. The following example copies a remote file using scp:


    ```

    # scp MyUser@10.10.10.10:/home/MyUser/fileTocopy.txt .

    ```


    # Converting Text Files Between OSes


    There are minor differences in text file formats between operating systems for
    Windows, Unix/Linux, and Apple Mac OS, in particular how the end of text lines
    are represented.


    For text files, Windows uses the carriage return line feed (CR LF) for each line
    and Linux uses the LF terminator. The commands on a Linux system to convert these
    formats include


    ```

    # dos2unix file.txt

    # unix2dos file.txt

    ```


    Macintosh uses the CR terminator at the end of lines. There are downloadable commands
    for Linux such as mac2unix, to facilitate this conversion.


    # Making Backup Disks


    There are a wide range of freeway and commercial packages that perform hard disk-to-hard
    disk copying. You may need to copy disks for backup purposes or for cloning various
    security testing suites.


    I have tried a number of packages with mixed results. The package EASESUS Disk
    Copy has worked. You can download it from www.easeus.com/disk-copy/. Then burn
    a bootable ISO CD-R (See the "Burning and Copying CDs and DVDs" section).


    The destination disk must be as large or larger than the source disk. To back
    or clone a hard disk, insert the EUS ISO into a CD drive and shut down the system
    (completely power off). Attach the source and destination disks to the system.
    The destination disk should be in a disk enclosure, whereas the source disk could
    be internal or in an enclosure. Internal is preferred because it will be easier
    to distinguish the source from the destination.


    > WARNING The destination disk will be completely copied over and all data lost.
    It is critical to know which disk is which. Power on the machine, go into the
    Boot Device Menu, select CD/DVD drive, and confirm.'
  merge: -1
