- pgno: 181
  md: 'Known vulnerabilities are made public through a number of online catalogs.
    Some of the most popular include MITRE''s Common Vulnerabilities and Exposures
    (CVE) and Microsoft''s Security Advisories and Bulletins. The test reports of
    policy scanners and vulnerability probes will be rife with citations from CVE
    and MS bulletins. You will see these citations in pen testing tools, such as Metasploit.


    For example, Microsoft Security Advisory 972890 identifies a vulnerability for
    remote code execution using ActiveX. This advisory cites MITRE CVE-2008-015 for
    video ActiveX control vulnerability and MS09-32, a security bulletin. Microsoft
    Security Bulletins are identified by year of issuance (MS09 = 2009) and serial
    number (32). Bulletins are released publicly with OS patches on Patch Tuesdays.


    +   There are other ways you can get vulnerability announcements. Sign up for
    the U.S. Computer Emergency Readiness Team (CERT) vulnerability notices for all
    OSes and applications at www.us-cert.gov/ncas. Oracle Critical Patch Updates several
    times per year on Patch Tuesday, the second Tuesday of each month. SAP makes patched
    information available to its customer base. The Apache source community solicits
    patches patches from the general public, publishes patches online by version,
    and has an e-mail list for security announcements.


    The interplay between the software vendors, the security researchers, and the
    malicious attackers is informative. Sometimes researchers will discover a flaw
    before the attackers do, but usually attackers find zero-day flaws and exploit
    them in the wilds of the Internet.


    By unwanted convention, researchers and other security professionals isolate new
    flaws and report them quietly to the vendors. Many researchers will attach a deadline,
    as such, "We urge you to repair this flaw and make a patch available before we
    announce the flaw publicly in two months." To add to the sense of urgency, the
    researchers may also develop exploit code for release too. Immediately after the
    patch release (on Patch Tuesday) and announcement, there is a rush by the attacker
    community to find and launch attacks against unpatched systems, a milky phenomenon
    called Exploit Wednesday.


    Vulnerability probes are a different class of tools than policy scanners. In general,
    policy scanners are run by friendly insiders who harmlessly scan system and application
    settings with minimal possibility of collateral damage. Vulnerability probes are
    aggressive tests that actively scan the presence of CVEs, missing MS patches,
    and other known vulnerabilities by performing in-depth packet scans and observing
    the responses.


    Many of the packets they generate are malformed or violate protocols in other
    ways. Some systems and services can crash as a result. This possibility should
    be clearly identified in the Rules of Engagement, a legal agreement between the
    testers and the test client.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# Chapter 7 Reconnaissance, Vulnerability Assessment, and Cyber Testing 157


