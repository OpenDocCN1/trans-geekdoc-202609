- pgno: 244
  md: '# Cybersecurity for End Users, Social Media, and Virtual Worlds


    This chapter covers some essentials for end-user cyber education. Many of these
    items are security basics that all end users should master. End users are the
    weakest link and greatest vulnerability in our cybersecurity defenses. Through
    end-user education, you can attempt to patch that weakness, but to err is human,
    and you should never expect exemplary security behavior from all end users all
    of the time. End-user security awareness and security training are some of the
    most important steps that any enterprise can take to secure client-side computing.


    # Doing Ego Search


    What information about you is readily available on the Internet? Is there sufficient
    information to enable identity theft? Those are questions that you as as an end
    user should resolve right away.


    Perform multiple Internet searches, called an ego search, using all variations
    of your name, street address, phone number, and e-mail. You will probably be surprised
    at what you find. An ego search helps you find out if there is information posted
    about you that could be used to commit identity theft or could damage your reputation.


    Cybersecurity training for end users is frequently called Internet safety. If
    there is too much information about you on the Internet, you have a safety'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'problem. When you find information about yourself on a particular website,
    you can e-mail the website administrator and ask for your information to be taken
    off. If a website point-of-contact is not readily available, you can find it by
    searching at www.whois.net.


    Failing that, there are online firms that provide Internet reputation management
    services, such as www.removeyourname.com/. For example, you can use a company
    that specializes in Internet reputation management to bury negative information
    about deeply into the search results of popular Internet search engines.


    +   TIP Other websites with helpful Internet safety advice include:

    ://www.wiredsafafety.org/ and www.staysafeonline.org.


    # Protecting Laptops, PCs, and Mobile Devices


    Your devices can be at risk of physical or electronic attack—such as theft, vandalism,
    or hacking—even in securely located locations. Insider threats mean that people
    within your security perimeter with legitimate access to your systems could become
    attackers. What can you do?


    For starters, adopt good basic security habits. Whenever you step away from your
    computer, lock the screen. On Microsoft systems, you can press the Windows button
    and the L key. On the Mac operating system, press Control-Shift-Eject. When you
    return the mouse to mouse wake up your machine and type your password to unlock
    your screen.


    Laptop computers are designed to be portable. Virtually all laptops have a physical
    security port, which is a small hole in the exterior case that can be used to
    attach your laptop to a piece of furniture or the building using a laptop security
    cable lock. You should definitely have a laptop security cable; use whenever you
    go mobile, such as when you attend classroom sessions and external meetings. It''s
    a good idea to use the laptop cable continuously, even in your secure office area.


    When you lose your mobile device, you might be losing all of your data. This is
    a problem for you, personally, because of the prevalence of identity theft, but
    there is a much larger problem if your mobile device carries restricted data,
    such as the Social Security numbers of healthcare patients or employees. Loss
    of that data may have legal and economic consequences for you as well as others.
    If you lose data, your firm is mandated to publicly announce the data loss and
    inform your customers (see Chapter 13). As a result of the publicity, there will
    be a loss of goodwill and reputation for your firm. Firms which spill data are
    often liable for identity theft insurance and identity protection services for
    their customers.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Chapter 10 = Cybersecurity for End Users, Social Media, and Virtual Worlds
    221


    Your laptop and other mobile devices are commodities that are easily converted
    to cash via pawn shops, eBay, and Craig''s List, to name a few. Unfortunately,
    the incentives to steal are great, and theft is commonplace. When you lose a wireless
    device and suspect theft, it is a good idea to contact your wireless provider
    immediately and have the device blocked. Blocking the device can increase the
    likelihood of its return because it''s more difficult for the thief to demonstrate
    (to a black-market buyer) that the device is working properly. Also, change the
    passwords for any installed apps—for example, e-mail accounts, video subscriptions,
    and social networks. Your wireless provider can later unlock your device, if you
    recover it.


    There are additional options for protecting your mobile devices, some of which
    require advanced arrangements. You can subscribe to services that will continuously
    back up your device and wipe it upon your request; check insurance and security
    providers such as Asurion (www.asurion.com). There are also apps that can assist
    you in finding your lost phone.


    Basically, do not lose control of your laptop, tablet, or phone in public spaces.
    If there is restricted data on your laptop or devices, it should be encrypted.
    That''s usually the responsibility of your firm, but it''s also your responsibility
    to inform them about the existence of the restricted data and the potential risks.
    If restricted data is removed by removable media (such as thumb drives), the media
    should also be encrypted. Special hardware-encrypted thumb drives are available
    for this purpose.


    Other basic advice for laptop and PC users is to shut down your end-user workstation
    overnight and on weekends. Choose to hibernate or completely shut down, forcing
    a reboot the next time you use the computer. Do not simply sleep the operating
    system; when it''s asleep, your system is still active on the network. There are
    several reasons to shut down your system regularly:


    +   - Rebooting involves various diagnostic tests, which can repair minor problems
    with your system.


    +   - Many software packages have memory leaks, which accumulate over time; memory
    leaks might eventually cause your memory to freeze or crash. Regular rebooting
    helps manage this problem.


    +   - Internet attacks are known to increase when security defenses are likely
    to be less vigilant, for example late on a Friday afternoon. Legitimate websites
    can often become malicious through maladvertising (see the “Guarding against Drive-By-Malware”
    section later in this chapter).


    +   - If your organization is undergoing a serious prolonged attack, called an
    Advanced Persistent Threat, attackers operate during nonwork hours due to time
    differences. Your idle machine could become part of a botnet or other nefarious
    overnight activities.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '+   - It is common practice in various countries, especially at small businesses,
    to physically unplug all equipment overnight and on weekends, thus insulating
    your equipment even from problems on the electrical grid, such as lightning strikes.


    +   - One of the best things you can do is to always make sure that you back up
    your devices so do not lose your data. You should perform an inventory of your
    data so you can remove it from your device if you are not using it; if you lose
    your device, you limit the risk.


    # # Staying Current with Anti-Malware and Software Updates


    Your computer''s first line of defense is anti-malware. The functions of anti-malware
    are expanding, but at least they include antivirus, anti-spyware, firewall, and
    malicious website protection (for example, black listing). Those are all very
    important, but they are an incomplete solution for today''s escalating threats.


    > > NOTE Blacklisting is the practice of preventing access to specific Internet
    domains, for example, known malware or spyware sites.


    You should always perform a manual update right after you install new software;
    software right out of the box or downloaded is likely to be seriously out of date.
    You should enable automatic updates for antivirus and anti-malware. Updates are
    released almost every week. For the first week or two after a new installation,
    verify that auto-updating is working; open the anti-malware application and console
    to check that the most recent update has changed recently. Some packages require
    the anti-malware application to be running in order to receive updates. Make sure
    to renew your anti-malware license when your subscription expires. In theory,
    virtually all software contains latent defects; a complex application might have
    thousands. With the correct input values, many defects can be stimulated to cause
    application failure (such as a freeze or crash), and in some cases, the software
    failure can lead to illegitimate system access. Malicious programmers and security
    researchers are constantly hunting for latent defects and the input values that
    trigger the defect, also as the *exploit*. Eventually, the software manufacturer
    becomes aware of the defect and issues a software patch. The patch might correct
    the defect, or it might simply block its exploitation.


    The bottom line is that you should regularly patch operating systems and software
    applications. Configure the system and application settings for automatic updates.
    Regularly, check to see that the operating system and applications have up-to-date
    patches. It''s very possible that your system might have been offline when a patch
    was issued, and you missed it.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# Chapter 10 = Cybersecurity for End Users, Social Media, and Virtual Worlds
    223


    First Tuesday of the month is Patch Tuesday. This is the day that Microsoft and
    many other software vendors issue patches. This is especially important to make
    sure your systems and applications are updated on Patch Tuesday because Cyber
    Attack Wednesday follows Patch Tuesday. On Cyber Attack Wednesday (and the next
    several days), attackers prey heavily on unpatched systems. See Chapter 11 for
    more guidance.


    # Managing Passwords


    Password selection is an important topic in end-user security. There are several
    do''s and don''ts. Don''t use words from the dictionary, pet names, family names,
    or names from your hobbies. For many people, those kinds of details are easily
    obtained from social networks, public records, and the Internet. (Refer to the
    "Doing an Ego Search" earlier in this chapter to understand more about how this
    information is obtained.) Don''t use the same password for every account.


    Most of us have dozens of accounts. You should use different passwords for different
    levels of security. Bank and retirement account passwords should be different
    and more complex than passwords for work accounts, social network accounts, and
    free accounts on websites or in virtual worlds.


    Longer passwords and passwords that use an expanded character set are generally
    better. Choosing nondictictary words and combining upper- and lowercase letters,
    numbers, and special characters, or at least slows down, external types of attacks,
    such as brute force (see Chapter 6).


    Internal types of attacks, after system penetration, by cracking the encrypted
    password hashes stored in system tables. Some hash credentials passed across networks
    as well, for example in an authentication transaction. If the password is known
    by the attackers, their work is simplified. For example, if all passwords are
    the same length with a known character set then the attacker can use a powerful
    cracking attack called rainbow tables (see Chapter 8). Rainbow tables can overcome
    the use of expanded character sets. Longer, different length passwords require
    different sets of rainbow tables, which is one reason why long passwords are recommended.


    A useful technique for picking passwords is to choose a short sentence, also called
    a passphrase and abbreviate words from that sentence. For example, I found this
    on the Internet, "91% of dogs are diagnosed with dental disease before age 3,"
    which could be shortened to the passphrase 91%DaWDD<A3. That password is 13 characters
    long and uses a combination of upper- and lowercase letters, numbers, and special
    characters.


    Another password problem is that many software applications and hardware devices
    come with default passwords. Numerous default passwords are public knowledge.
    See Chapter 11 for guidance about default passwords.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# Guarding Against Drive-By Malware


    Drive-by malware is a rapidly growing form of attack. When your Internet browser
    reaches a web page, the web page automatically runs scripts, such as JavaScript,
    Visual Basic Script, and Java. If a malicious attacker is successful in posting
    scripts on the page, the malware scripts are invoked whenever you visit the page,
    which is known as drive-by malware.


    Drive-by malware can take several forms:


    +   It can be on web pages that are controlled by malicious parties. You might
    arrive at them from a link in an e-mail, document, or search engine.


    +   It can take the form of malvertisements, which are web ads that become malicious;
    they often appear on legitimate websites. Malvertisements increase dramatically
    late on Friday afternoons and weekends when the legitimate websites are least
    responsive to security incidents.


    +   It can appear on bulletin boards and comment lists when posted by malicious
    users.


    There is ample support for limiting the damage of drive-by malware running in
    your Internet browser. The following are some actions you can take to help your
    system:


    +   Raise the browser security level in your Internet browser preferences.


    +   In your browser, disable pop-up windows and regularly delete browser history,
    download file list, cookies and cache, so that data cannot be exploited by malware
    (for example, by impersonating you on a website with a cookie). Alternatively,
    some Internet browsers support private browsing, which restricts the collection
    of history and cookies. Invoke private browsing in Internet Explorer and Mozilla
    Firefox using Ctrl+Shift+P.


    +   Use anti-malware with black list filtering: Norton, McAfee, and Trend Micro
    all support this feature.


    +   Use a browser with black list filtering built-in. Mozilla Firefox and Google
    Chrome both use the Google Safe Browsing filter.


    +   Locate websites through a search engine (such as Google) that filters out
    malicious sites, or use the Google safe browsing tool to investigate these sites
    safely based upon their reputations.


    +   To use the safe browsing tool, paste the following into your address bar:

    http://www.google.com/safebrowsing/diagnostic?site=


    +   Then paste the URL of the website you''re checking after site.


    It is possible to stop drive-by malware entirely by preventing scripts from running
    in your Internet browser. Of course, disabling all scripts will cause'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Chapter 10 = Cybersecurity for End Users, Social Media, and Virtual Worlds
    225


    many websites not to load properly or otherwise malfunction. There is a browser
    plugin for Mozilla Firefox that allows you to selectively enable scripts. It is
    called NoScript and is available for free from https://noscript.net. NoScript
    automatically blocks Adobe Flash, JavaScript, and Java. With the NoScript pull-down
    menu, you can selectively enable scripts from known domains.


    For example, on www.cnn.com I found scripts from all of the following domains:
    cnn.com, revsci.net, turner.com, dl-rms.com, optimizing.com, and insightexpressi.com.
    These scripts may be attempting to send information about your system, browser,
    history, downloads, and other information back to servers (including Internet
    spyware companies) that are separate from CNN''s server. NoScript blocked them
    all automatically. You can then selectively allow scripts only from cnn.com and
    get served only the cnn.com scripts and content without risk of malisements and
    exfiltration by third-party spyware.


    NoScript can prevent useful scripts from running when you want them, too. In that
    case, you could selectively enable some of the script domains from the Options
    button, or alternatively enable all this page to make all scripts active until
    you navigate elsewhere on the Internet.


    # Staying Safe with E-mail


    Malicious e-mail attachments have consistently been a favored attack vector for
    hackers. Through e-mail attachments, nearly any PC application can be accessed
    and compromised. For example, vulnerabilities in Microsoft Office applications,
    Adobe Acrobat, and Apple QuickTime Microsoft is beginning to address this situation
    in the newer releases of Office, but it will be some time before the older releases
    are no longer used.


    E-mail account hijacking is increasingly common. Through malware techniques, such
    as cross-site request forgery, attackers are able to control your logged-in e-mail
    account from scripts running in a different tab or window of your Internet browser.
    This type of attack often sends spam e-mails with malicious attachments to your
    entire contact list. If you see very generic e-mail from a legitimate friend that
    makes little sense, beware of the attachment.


    One way to check the attachment is to use an online virus scanner, such as www.virustotal.com,
    which scans files with 30 antivirus engines.


    Another way that e-mail can be harmful is when the e-mail directs to a web page
    containing drive-by-malware (covered in the previous section).


    Be wary of unexpected e-mail attachments from strangers, attachments that are
    unexpected, or attachments from known persons that are in suspicious messages
    (messages that contain misspellings, grammatical errors, or factual inaccuracies).
    E-mail message senders can be spoofed (faked). The same advice applies to web
    links used under similar circumstances.'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'Make sure your e-mail service provides antivirus checking before it downloads
    the messages. Many corporate e-mail systems have virus scanning builtinto their
    e-mail infrastructure. Internet-based e-mail services should indicate that they
    are explicitly scanning for malware. You should use e-mail services that use encrypted
    connections, such as Gmail. Unencrypted connections are vulnerable to man-in-the-middle
    and other attacks.


    Do not open spam messages. If you open them and your e-mail service is set up
    to display HTML, the spammer''s servers will be notified that you opened the e-mail.
    If your e-mail service also runs scripts, it''s possible that you could be attacked
    with drive-by-malware when you open the message. Instead of opening a suspicious
    message, use the spam reporting button of your e-mail service.


    Phishing is an e-fraud intended to lure you into infecting your system with malware
    and/or fool you into volunteering sensitive information for the purpose of stealing
    your identity. Beware of seemingly legitimate emails that direct you to urgently
    volunteer sensitive information. Check the URLs very carefully before you click
    (hover your mouse and look at the browser status bar at the bottom) and after
    you click the URL (in the top address bar). Make that check especially when conducting
    sensitive transactions such as using your password to log in, making purchases,
    and performing other financial transactions.


    Social engineering is the human intelligence gathering of information by using
    a false pretext, such as pretending to be a legitimate customer, a company representative,
    or a law enforcement officer. Many successful cyber attacks include some element
    of social engineering. Remember, do not give away privacy or security information
    on the web, via e-mail, or to unknown phone callers or visitors. For example,
    verify the corporate affiliation of callers who request your credit card or other
    restricted information, just as they would request them back on a toll-free number
    that you can verify independently as belonging to the organization claimed.


    # Secure Banking and Buying Online


    Financial transactions with banks are especially high risk transactions on the
    Internet. The banking industry recommends that businesses use a separate single-purpose
    computer to conduct such transactions. That''s not realistic for end users, but
    there are precautions you can take.


    Ideally, use a separate Internet browser to access logged in accounts individually,
    particularly banking, securities trading, and purchasing accounts. Avoid browsing
    to websites on the other tabs and windows while you''re logged to the bank. The
    other open websites can launch attacks, such as a cross-site request forgery,
    on your logged-in website because running scripts have full access to all data
    and messaging in your Internet browser.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# Chapter 10 Cybersecurity for End Users, Social Media, and Virtual Worlds
    227


    Check the URL carefully before entering, private information or processing transactions.
    Make sure that the browser is using Secure Socket Layer (SSL) communications (you
    should see https:// in the address bar or a status bar—it varies by browser).
    On a secure site, click the lock icon to view its security certificate, which
    is an assurance of the identity of the website. Examine this information to verify
    that it is indeed who you intended to do business with. Be cautious if the certificate
    is not up to date, invalid, or otherwise not in order.


    Do not conduct financial transactions on public Wi-Fi networks. Wi-Fi networks
    are highly insecure; free wireless security tools, such as Karma, can spoof any
    site on the Internet and gather information; this wireless spoofing is called
    "the Internet in a box."


    # Understanding Scareware and Ransomware


    Scareware and ransomware are very common Internet scams that are often launched
    from legitimate websites through malvertisements. Advertisements on websites are
    digital content provided by third parties. The barriers are very low for attackers
    (such as for-profit criminal enterprises) to rent ad space and serve malicious
    scripts, especially when network defenses are expected to be weakened, as seen
    after normal business hours.


    Typical forms of scareware entice you to click malicious pop-up windows and install
    free antivirus protection (that is, feature-rich malware) or divulge restricted
    information. Do not click pop up ads claiming to be anti-malware vendors or law
    enforcement agencies. Examples include ads that say, "Your system is infected,"
    or "FBI: Your system was used for illegal activities." At that point it is best
    to close the Internet browser entirely from the task bar; do not click the pop-up
    window, not even the close button which triggers scripts that attack your machine.


    Ransomware is aggressive scareware that takes control of your system and demands
    payment for you to regain control. Ransomware is a serious malware infection.
    If you cannot remove it with antivirus scans or even a system recovery rollback,
    it is appropriate to seek professional computer repair assistance.


    # Is Your Machine pwned?


    The term pwned is hacker terminology indicating that the defenses of a target
    machine have been penetrated. One major goal of cyber criminals is to pown as
    many machines as possible, and then use them to exfiltrate information (such as
    credit card accounts and passwords), as well as enlist your machine to participate'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'in botnets. Botnets are large collections of pwned computers that can be used
    for sending e-mails and for distributed denial of service attacks (DDoS). DDoS
    attacks are very crude, but effective. In them, a massive flow of network packets
    are aimed at an Internet target, such as the home page of a large bank, taking
    the bank’s business offline for hours at a time. Even the most sophisticated businesses
    are vulnerable to such simple attacks.


    There are several ways to discover whether your machine is pwned. If cyber criminals
    have taken your credentials and published them online, there are services that
    scan for that data and can offer you an indication, your compromised identity,
    such as https://pwnlist.com.


    Attackers can attempt to hide their presence on your machine by installing a rootkit.
    A rootkit is software that can hide its presence by compromising the operating
    system of your machine (another layer of your system). For example, a rootkit
    will prevent you or your anti-malware from discovering malicious files or activities
    on your computer.


    Even so, there is a reasonable chance that the deception is imperfect and leaves
    some telltale signs that can be detected. So, a thorough antivirus scan is recommended,
    periodically. To go further, Microsoft releases the Malicious Software Removal
    Tool for Windows on the first Tuesday of every month (that is, Patch Tuesday).
    The tool is auto-run as part of the scheduled monthly updates. This tool is easily
    located with an Internet search on www.microsoft.com. Download and run it any
    time you want to have a thorough test.


    # Being Careful with Social Media


    Social media are pervasive in modern society. In addition to the major services
    (Facebook, LinkedIn, Twitter) there are thousands of alternative services. The
    purpose of social media is to share information about yourself (what you know)
    and connect with other people. Sharing information about yourself is an important
    potential vulnerability when using these sites.


    By default, social media shares information, to anyone willing to visit your space.
    Sharing information about your friends, family, pets, and hobbies can give clues
    to malicious entities. For example, you are supplying clues about potential passwords
    you might use. The personal information you reveal might contain answers to common
    security questions that are part of the alternative method of login authentication.
    You might inadvertently release information that could harm your employer, such
    as showing pictures of your friends at work with clear images of company badges
    used to access the premises.


    Many social media sites support security settings. You can choose to limit online
    information just to your friends or contacts. In that case, it is important to
    be very selective about who you friend. Strategy does not fit everyone’s purpose,
    however. For example, if you are a recruiter, advertiser, or publicist,'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# Chapter 10 ■ Cybersecurity for End Users, Social Media, and Virtual Worlds
    229


    you will probably want to maximize your connections. In that case, you should
    be extra careful about revealing personal information online. It is useful to
    know the privacy policy of your social media, and to tailor the security settings
    to your needs.


    Use of social media is an essential part of most people''s professional lives.
    Services such as LinkedIn are essential for making business contacts, recruiting,
    and keeping current with commutions in your profession.


    # Staying Safe in Virtual Worlds


    Virtual worlds such as Second Life, World of Warcraft, and the numerous OpenSim
    worlds allow us to meet and interact with other users in real time from any-where
    on Earth. These worlds are largely anonymous. You do not know who the other users
    are or where they are unless they choose to disclose that information, but even
    that could be a misrepresentation.


    Virtual worlds often have avatars, simulated bodies generated with computer graphics.
    Second Life and OpenSim support user-generated content: Avatars, virtual buildings,
    and the entire environment can be customized by users. User-generated content
    includes scripting for interactivity.


    Virtual worlds are also used for business—and example professional meetings, conferences,
    and are also attractive online communities for sharing special interests, such
    as music, poetry, many other fine arts, and role playing. In the latter cases,
    the purpose of virtual worlds is entertainment (having fun).


    Virtual worlds posing security issues. It is possible to lock down virtual regions,
    and access to a tightknit circle of friends, but most virtual communities and
    venues are public access. Because everyone is anonymous by default, malicious
    users (griefers) can take on new identities and easily penetrate virtual communities.


    Griefers are users whose objective is to disrupt the fun of other people. Griefers
    can attack other users'' avatars and virtual buildings in multiple ways, such
    as using scripting. For example, scripts can generate large numbers of objects
    or particles; scripts can make annoying noises and objects that follow avatars;
    scripts can apply forces from virtual physics and push (orbit) avatars great great
    distances. Users can block the griefer''s avatar, or eject the griefer from a
    region, but they can always come back with a different avatar.


    User-generated content is intellectual property, such as the work of a virtual
    artist. CopyBot is a Second Life script designed to produce backups of user content.
    CopyBot has been used maliciously to steal the intellectual property of other
    users. Second Life chose to address the CopyBot issue not by blocking the script,
    but by making its malicious use a violation of the Terms of Service, the rules
    that govern the acceptable behavior of users.


    ![](img/58b756e5b149184e369c845a987fc3a2_254_0.png)'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'User privacy is an important issue in virtual worlds, and the Terms of Service
    contain privacy policies. The Second Life Terms of Service state that Linden Lab
    (the company that owns Second Life) will not "give your personal information to
    third parties except to operate, improve and protect the Service." In other words,
    personal information can be shared with other companies for a wide range of Linden
    Lab prerogatives.


    At one point in their history, Linden Lab adopted Google search, and along with
    it, Google''s user tracking technologies. Now, many essential features of Second
    Life will not operate without enabling exfiltration of user information from users''
    computers to some of these URLs:


    +   - googlesyndication.com

    - google-analytics.com

    - adwords.google.com

    - adverts.google.com

    - goeadservices.com


    See Chapter 9 for a technical explanation of adware and spyware. Credit card identity
    theft is a growing trend concerning the virtual world of Second Life (SL). SL
    users can log into several places, including Virtual World viewers, http://secondlife.com,
    the SL marketplace, SL JIRA bug reporting system, and SL forums. Users are increasingly
    drawn to phishing websites with URLs that might look like http://secondlife.secl.
    The phishing websites gather login credentials; attackers can log in to http://secondlife.com
    and retrieve credit card details if the SL user is a verified user, meaning that
    credit card information is on file. Because of this danger, it is very important
    to check URLs carefully before logging into any website with SL credentials.


    # Summary


    This chapter covers end-user security including basic hands-on steps that you
    can take to be a safer user on the Internet. First, doing an ego search to reveal
    what is known about you. Second, physically securing and maintaining your systems
    and mobile devices is essential. Third, anti-malware; making sure it is running
    and up to date, including automatic updates.


    Suggestions are made about making your passwords less vulnerable. Drive-by malware
    is a rapidly emerging threat that can even appear on legitimate websites as malvertisements,
    since ad content is provided by third parties.


    E-mail and social engineering present additional major vulnerabilities. End user
    awareness of these forms of attacks is a critical key to network defense.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# Chapter 10 = Cybersecurity for End Users, Social Media, and Virtual Worlds


    Be especially careful when banking or buying. At a minimum, use a separate Internet
    browser with no other tabs or windows open. Scareware and ransomware are threats
    that can appear when Internet browsing, e-mailing, or using other Internet connections.


    When your machine is attacked and successfully penetrated, the attackers may install
    persistent malware, called a rootkit, which can conceal it presence from you and
    your anti-malware.


    Social media broadcasts your vulnerabilities and expands your attack surface.
    Tidbits of information about you can be used by attackers to guess passwords or
    attack you with social engineering such as phishing and spear phishing. Be careful
    what you share with the whole world online and use appropriate security settings.


    Virtual worlds allow us to travel virtually to real and imaginary places, as well
    as meet and interact with people from all over the world. Attackers, called griefers,
    will threaten your avatar from time to time, especially if you are in a public
    area with scripts enabled, such as sandboxes. Take care in how you configure your
    defenses, such as blocking adware and beacons with the hosts'' file, because adverse
    is being built into applications such as Second Life''s new viewers. SL users
    should also be beware of phishing websites which may steal their login credentials,
    which may result in credit card theft.


    # Assignments


    +   1. Why are end users the most significant vulnerability in cybersecurity?

    2. If your e-mail is configured to display web code and images, why is that a
    potential vulnerability? What kind of information leakages and attacks might you
    be subjected to?

    3. Why is it important to update your passwords periodically, especially if your
    anti-malware detected an attack?

    4. Why are banking transactions especially vulnerable to attack, to the extent
    that the banking industry recommends using a separate computer for these transactions?
    What can you do on your computers to increase security of banking transactions?

    5. What is the connection between social media and protecting your other computer
    accounts? What kinds of information should you avoid sharing on social media,
    to address these vulnerabilities?'
