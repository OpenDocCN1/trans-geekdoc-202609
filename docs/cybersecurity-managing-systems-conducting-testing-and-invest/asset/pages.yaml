  md: '# 122 Part II Cyber Network Security Hands-On


    ![](img/58b756e5b149184e369c845a987fc3a2_147_0.png)


    Figure 6-5: UDP header


    UDP is a connectionless protocol. Each packet is sent without regard for its successful
    arrival. UDP packets can be lost or duplicated, or they can arrive out of order.
    These errors are acceptable in applications such as audio/video streaming.


    # TCP Header


    TCP also rides atop IP at Layer 4 and adds source and destination ports; in Figure
    6-6 the source port is 443 and the destination port is 2524. TCP has sequence
    numbers and acknowledgement numbers to guarantee orderly assembly of packet streams
    (929826 and 208163 respectively). There are eight TCP flags; in this case ACK
    flag is set, indicating that this is an acknowledgement packet.


    ![](img/58b756e5b149184e369c845a987fc3a2_147_1.png)


    Figure 6-6: TCP header'
