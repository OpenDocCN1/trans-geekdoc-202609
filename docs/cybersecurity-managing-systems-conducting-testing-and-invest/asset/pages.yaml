    # Reporting Cyber Investigations


    You should frequently conduct discovery and investigation of alerting network
    events—daily if possible. The rank ordering of alerts by the host enables you
    to focus your efforts where the most activity is. In the environment used for
    the examples, an unpatched host generates over 1,000 alerts per day, whereas a
    hard-ened host typically generates fewer than 100 false positives. In a well-managed'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Chapter 9 - Cyber Network Defense Using Advanced Log Analysis 211


    environment, where all hosts are hardened, suspicious activity is easily detected.
    New, unpatched hosts on the network become obvious.


    When informed of unusual network activity, users will want to see proof and pose
    many questions. You can anticipate this through effective reporting.


    You must approach users diplomatically, in a nonjudgmental manner. For example,
    if you inform an IT security professional that his machine is compromised, he
    will probably react strongly to such news. Rather, let a user know that there
    is unusual activity coming from their machine, and work together with the user
    to discover the cause. Make sure you gather and transfer all available data relating
    to the alleged incident.


    > **NOTE** Early in the learning curve I encountered ferocious push back from
    security professionals.


    I developed a reporting template that walks through the suggested cyber investigation
    steps. The template.txt file contains sections for recording each observation,
    and expandable space for inserting details, such as sample alerts and packet content
    in ASCII, along with analysis. The report, in combination with the detail files
    from alertcap, should be sufficient as proof source and basis for the user''s
    own research and eradication.


    You may also share reports with a group to keep administrators and users informed
    about current threats and network vulnerabilities requiring mitigation.


    # Elimination of Cyber Threats


    The eradication phase involves blocking or removing malware. This section covers
    some specific tactical actions you can take. The "Continuous Cyber Investigation
    Strategy" section earlier in the chapter for more general maneuvers.


    One of the most important eradication measures you can take is to block adware
    and spyware at the host level. All networked systems have a file listing hosts.
    This is a first lookup of a domain before DNS is queried remotely. By mapping
    adverse hosts to localhost (127...0.1), beacon packets are blocked and never reach
    the network. For example, the following entries in the hosts will effectively
    block most Quantcast beacons:


    ```

    127.0.0.1 ak.quantcast.com

    127.0.0.1 widget.quantcast.com

    127.0.0.1 quantserve.com

    127.0.0.1 edge.quantserve.com

    127.0.0.1 flash.quantserve.com

    127.0.0.1 pixel.quantserve.com

    127.0.0.1 secure.quantserve.com

    ```'
  merge: -1
  img_proc: true
