  md: '# Chapter 9 - Cyber Network Defense Using Advanced Log Analysis 199


    # The daycap script


    To begin the IDS in real time, you use the following daycap script:


    ```

    #!/bin/bash


    # Add a parameter like ./daycap keep -- in order to append to logs

    # By default, daytime logs are deleted to conserve space

    if [ $1 -eq "" ]; then rm /tmp/alert /tmp/snort.log; fi

    /usr/local/bin/snort -A full -c /etc/snort.conf -1 /tmp

    ```


    To use this script, execute a command as # ./daycap.

    Snort automatically appends its output to the /tmp/alert file unless you remove
    it. The first. script tests the user''s intention to append and invokes snort,
    indicating -A full for fully detailed alerting, -c for the path to the snort conf.file,
    and -1 to identify the log file.


    To monitor the IDS activity, you can watch the IDS alert file using the following
    command:


    ```

    # tail -f /tmp/alert


    #!/bin/bash


    ps aux | grep tcpdump | grep -v grep | awk ''{print $2}'' > /tmp/

    tcpdumpPID

    kill "cat /tmp/tcpdumpPID"

    ps aux | grep snort | grep -v grep | awk ''{print $2}'' > /tmp/tcpdumpPID

    kill "cat /tmp/tcpdumpPID"

    ```


    The killcap script uses all process listing command, ps, and grep to find processes
    running tcpdump. Eliminate the current command from the list with grep -v grep.
    Then use awk to extract the second field because the default field separator is
    space. By examining the ps aux output, you see that the second field is the process
    ID number, which is stored in the file /tmp/tcpdumpPID. The kill command is given
    the process ID by executing "cat /tmp/tcpdumpPID" on the command line. The killcap
    script executes the same procedure for removing any Snort processes. You will
    see many sophisticated examples of grep as you move into advanced log analysis.


    The full packet capture is started automatically with the sniff.cron table:


    ```

    0 18 * * 1,2,3,4,5 /root/killcap >> /tmp/error 2>&1

    0 19 * * 1,2,3,4,5 /usr/bin/tcpdump -s0 -nnXtt -i eth0 - /root/

    OVERNIGHT.cap >> /tmp/error 2>&1

    0 7 * * * 1,2,3,4,5 /root/killcap >> /tmp/error 2>&1

    ```


    The sniff.cron table shows that at 18:00 (6:00 pm) on Monday Friday (1,2,3,4,5),
    run killcap and append any output (2>&1) to /tmp/error. Then at 7:00 am, start
    a full packet capture using tcpdump interface -i eth0, and store the packet size
    snap length (-s0), on local network with the packets in /root/OVERNIGHT.cap. The
    option -nnXtt is redundant in this case,'
