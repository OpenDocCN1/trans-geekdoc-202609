- pgno: 288
  md: '# Chapter 12 — Large Enterprise Cybersecurity: Data Centers and Clouds 263


    In Figure 12-1, legacy data moves into the cloud, consolidating from heterogeneous
    systems into a homogenous infrastructure with shared vulnerabilities.

    Legacy systems can be integrated into the cloud, and data and services are provided
    transparently to users. Legacy systems also migrate to the cloud and then are
    decommissioned, saving support costs.


    Provisioning is the ability of clouds to allocate processor, network, and storage
    resources instantly. Provisioning in clouds makes it easier and faster to realize
    IT changes, such as new support for missions, business operations, and new IT
    initiatives.


    Publication of widgets and cloud services provides access across the user base.
    Migrating from a thick legacy application with a handful of users to a browser-based
    application enables access to the entire networked user base. Similarly, consolidating
    data and functionality from multiple systems with parochial interfaces to a common
    cloud-based solution simplifies and focuses the target of potential threats.


    As illustrated, there are shifting system owners, operations and maintenance (O&M)
    managers, data custodians, and scope of user accesses across the Cloud Ecosystem.
    Data traditionally owned and controlled by organizations A, B, and C is now managed
    by cloud organizations G, H, and I, and is potentially accessible to organizations
    A through Z. Access to legacy systems owned by organizations D, E, and F is now
    managed by cloud organizations G, H, and I and is also exposed to organizations
    through Z.


    This book assumes that the legacy owners are different from the cloud developers
    whose expertise is cloud technology. You will discover that even minor modifications
    to security controls as you cross these organizational boundaries can have a dramatic
    security effect.


    # Stovepipe Widgets in the Cloud


    Cloud computing technologies comprise generic development platforms and programming
    environments. Beyond basic standards (for example, XML), few application-level
    standards exist for cloud data exchange, metadata definitions, and application-level
    protocols. This is particularly true for new adopters of cloud technologies.


    As a result, widgets are being developed to work with specific data and indexes,
    but they don’t interoperate with other widgets. Today’s widgets are analogous
    to stovepipe systems—isolated islands of automation. Because widget developers
    are building their technology stacks from “bare metal,” they must reprogram necessary
    functionality (such as security functions) or omit it altogether for expediency.


    These problems are spreading throughout many enterprises, where widgets are rapidly
    proliferating.'
