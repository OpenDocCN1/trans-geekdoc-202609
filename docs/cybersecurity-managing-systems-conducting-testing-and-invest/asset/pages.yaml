    # Summary


    This book concludes with this chapter, a research discussion about cyber warfare
    and cyber deterrence. Cyber warfare is one of the most active areas of defense
    innovation. It is generally believed that hundreds of nation states are engaged
    in the practice. Cyber warfare levels the playing field between countries with
    significant investments in hardware (i.e., the United States), and countries with
    much more modest investments. Starting a cyber warfare program only requires a
    few smart citizens, an Internet connection, and a few computers, an investment
    well within reach of practically every country on Earth. Attack tools are disseminated
    freely on the Internet as security testing software, such as the ones discussed
    in Chapters 5 through 8.


    There is an urgent need for new treaties addressing cyber war issues. A useful
    precedent is the Council of Europe’s Convention on Cybercrime and this chapter
    covered some of the recommended treaty provisions that would enable effective
    cyber operations.


    Cyber deterrence is a challenging problem at all levels including strategic, operational,
    and technical. It is a relatively unexplored domain with huge uncertainties such
    as the yet nonexistent legal basis for cyber war.


    Cyber deterrence is a theoretical proposition that countries can develop the intelligence
    resources and technical capabilities to determine the source of nation-state cyber
    threats and effectively prevent them from being deployed. Extending research from
    the RAND Corporation, this chapter defines a conceptual architecture for a cyber
    deterrence capability. The challenges to successful implementation are numerous,
    ranging from weaknesses in the legal frameworks to inherent weaknesses in foundational
    Internet technologies. Assumptions are identified for resolving some aspects of
    these weaknesses.'
