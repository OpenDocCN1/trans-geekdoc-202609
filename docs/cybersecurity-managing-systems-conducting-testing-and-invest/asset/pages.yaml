- pgno: 192
  md: '# Chapter 8 ■ Penetration Testing 167


    Web applications are vulnerable to a number of input injection attacks including
    injection commands, meta-characters, pathnames, and Structured Query Language
    (SQL) queries. Client-server and desktop applications are similarly vulnerable,
    and they can even be exposed to the malicious potential of the Internet, for example,
    through e-mail attachments and direct Internet interfaces.


    # Command Injection Attacks


    Command injection attacks are attempts to execute system commands, fooling a program
    to execute attacker commands. Input data contains calls, such as exec(`command
    line>`) and system(`command line>`), depending on programming languages.


    Meta-characters (that are, keyboard special characters) are inserted into all
    forms of injection attacks to confuse or disrupt programs. Command lines and meta-character
    attacks can be inserted into intercepted web cookies as forms of cookie poisoning.
    Pathname injection or directory traversal attacks are meta-character attacks intended
    to expose data and command environments outside the application''s intended scope.


    # SQL Injection Attacks


    SQL injection is an attempt to add SQL commands to an input string using meta-characters.
    SQL injection can expose significant sensitive data and damage database integrity.


    Injection attacks leave multiple trails of log evidence. For example, web server
    logs, which record input strings, can be searched for meta-characters, system
    commands, pathnames, and SQL query statements. Injection attacks generate application
    errors. Check event logs, database logs, and application logs for their presence
    and sources. If unauthorized access is suspected, initiate full packet captures
    to analyze exploit code and the activities of follow-on terminal sessions. Check
    IDS logs for alerts detecting injection attacks or related activity. See Chapter
    9 to read about log file locations and analysis techniques.


    Now that you have an overview of some of the most common cyber attacks, it''s
    time to move on to applying these techniques with details of pen test methods.
    Read more about other major types of attacks in the “Final Malicious Phases” section
    later in this chapter.


    # Network Penetration


    The mainly free tool for pen testing is Metasploit because it has the largest
    collection of system exploits, which is code that gains access to systems without
    using credentials. Metasploit has several user interfaces: a graphical user'
