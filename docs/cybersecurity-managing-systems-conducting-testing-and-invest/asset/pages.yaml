- pgno: 203
  md: '# Enumeration and Hash Grabbing on Windows


    such as usernames and password hashes. In the next section you use password-cracking
    techniques to convert hashes into passwords. E-mail addresses often


    Usernames are available from a variety of sources. E-mail addresses often contain
    login usernames, and with simple Internet searches and Google hacks, you can retrieve
    addresses from web pages, social networks (Facebook, MySpace), bulletin boards,
    and blog posts. See the "Reconnaissance" section in Chapter 7 for additional Google
    hacks and search techniques.


    BackTrack includes a Python program called theHarvester that gathers e-mail addresses.
    You run it like this:


    ```

    # /pentest/enumeration/google/theHarvester

    # ./theHarvester.py -d cnn.com -b pgp

    ```


    E-mail address searches on PGP (Pretty Good Privacy), Google, and MSN are supported
    by theHarvester. It is interesting to analyze theHarvester Python code and other
    programs that directly search the Internet and services, such as Simple Network
    Mail Protocol (SNMP) and Domain Name System (DNS). Many enumeration and hash grabbing
    techniques are operating-system specific.


    Unless ordinary users are locked down, any Windows account can enumerate usernames
    by visiting the C:\Users directory and reading the folder names. Usernames are
    also displayed on the login screen, in the Security tab box for files, and in
    privileged Computer Management screens, such as User Accounts.


    > NOTE Start All Programs Accessories Remote Desktop Connection to bring up the
    login screen of any Windows system without using credentials to harvest at least
    one username.


    > NOTE Older Windows systems use C:\Documents and Settings rather than C:\Users.
    Locking the C: drive for ordinary users helps to harden the system but requires
    additional Help Desk support for all system changes.


    Windows stores password hashes in the Security Accounts Manager (SAM) file at
    %systemroot%\System32\config\SAM. The SAM file and its Registry folders are not
    directly accessible while Windows is running. Utility tools such as fgdump and
    other pwdump tools can extract SAM data at run time with administrative privileges.
    The Meter Priv module can also extract information from an administrative process:


    ```

    meterpreter> use priv

    meterpreter> hashdump

    ```'
