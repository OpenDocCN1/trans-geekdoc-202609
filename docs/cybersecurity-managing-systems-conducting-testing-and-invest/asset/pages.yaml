    To make this code run cross-platform, all platform dependencies were migrated
    to the Server.py-side code, including the scan command code. Any platform-specific
    post-processing of the results could be performed as well. Note that this architecture
    code is in contrast to the approach taken by the APT, whose bot code is often
    only stubs, devoid of command code (Rafferty, 2010). The APT bots load command
    code when needed and delete it, making it more difficult for defenders to analyze
    bot capabilities.


    The code as shown is fairly unstable, but sufficient for architectural benchmarking
    purposes. To make this code production-ready, a throttling mechanism is needed,
    as well as explicit handling of failures. In experiments when each was used more
    than N commands in rapid succession, Master.py began throwing exceptions, indicating
    that the connection was refused. The fast threaded code in Master.py was overrunning
    Python remote procedure call infrastructure with too many queued commands. The
    value of N varied significantly between systems, from 8 to 50 queued XMLRPC requests.
    Five operating system variants were tested, of the same type. When fewer commands
    were queued, the invocations were relatively stable. Ideally, the botnet architecture
    should avoid this effect entirely.


    In general, any distributed processing program can experience communication errors
    and remote system failures. As in Google''s map reduce framework, the master should
    keep track of unresponsive tasks and reissue tasks to alternative systems as needed
    (Dean & Ghemawat, 2004). The strengths and weaknesses of this distributed scanning
    prototype give you the architectural insight to build a reliable implementation
    of a military botnet. However, developing and releasing that code into the public
    domain would be problematic for obvious reasons.


