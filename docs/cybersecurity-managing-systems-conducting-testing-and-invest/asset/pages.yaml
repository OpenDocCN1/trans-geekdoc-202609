    # Formatting Disks


    Hard disk formats apply to only one disk partition at a time, and a hard disk
    can have multiple partitions. This section explains how to build disks with a
    single partition. Chapter 5 covers how to make multipartition disks.


    A large number of disk formats are available, but in practice only a handful are
    used. Possibly the useful format is New Technology File System (NTFS), which can
    be mounted on both Windows and Linux systems (See the "Mounting Disks" section
    earlier in this chapter). EXT2 is the default format for Linux and is also widely
    used.


    # Windows


    Formating a Windows disk enables it for storage and retrieval. A standard Windows
    format is the New Technology File System (NTFS).


    To create an NTFS-formatted disk partition by default on newer Windows systems,
    first connect a new disk to your Windows system using USB.


    +   1. To format the disk, bring up the Disk Management snap-in (using Start Control
    Panel Administrative Tools Computer Management, and in the left tree browser select
    Disk Management).

    2. Locate the disk you intend to format toward the bottom of the screen. Right-click
    it and select Initialize.

    3. Right-click and select Format.'
