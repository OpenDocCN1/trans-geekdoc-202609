- pgno: 56
  md: '# Chapter 2 The Problems: Cyber Antipatterns


    # Unbalanced Primal Forces: Management of integrity and availability


    Anecdotal Evidence: "Why the hell would they put the electrical power grid on
    the Internet?”


    # Background


    In computer technology’s crawl-run evolution, it’s become very trendy to eliminate
    installed applications entirely and rely on web-based interfaces for everything.
    For the sake of convenience and ease of provisioning, users decreasingly have
    to install applications anymore All the headaches of managing applications are
    conveniently delegated to some remote entity providing software as a service.


    # Antipattern Solution


    The "webify everything" mindset defies common sense when it proliferates web interfaces
    for critical infrastructure. Does it make sense to proliferate easily maintained
    and massively replicable remote interfaces to control electric power plants and
    core network devices? The so-called "Smart Grid" does webify its control devices
    and screens, and many providers of network devices webify their control interfaces.


    The problem is compounded by the common malware technique called cross-scripting
    (XSS). What Internet browsers do is execute remote code in the form of HTML, JavaScript,
    and other static and dynamic notations. Hypertext Markup Language (HTML) can no
    longer be considered a benign static notation. The introduction of HTML 5.0 exacerbates
    security issues by adding facilities for remote code execution and read-write
    access to local-browser client disks.


    When remote code executes in an Internet browser, it has complete access to all
    the open browser windows, all their data, and allied implied authorities. XSS
    attacks combined with webified remote infrastructure control is a recipe for disaster.
    Whenever remote administrative interfaces are logged in and the user surfs to
    unrivalled Internet sites, there is a distinct possibility that XSS attacks gain
    control of highly valued infrastructure targets.


    Supervisory Control and Data Acquisition (SCADA) systems are the core control
    systems of machines, utilities, and manufacturing infrastructure. The Stuxnet
    worm—which proliferated widely in the Middle East and Asia but only targeted specific
    SCADA devices—proved that attacks on SCADA systems are more than theoretical.


    In theory, due to the ambitions and capabilities of cyber warriors in dozens of
    countries, there are rootkits, back doors, and logic bombs infecting much of our
    modern infrastructure, power plants, public works, financial systems, defense
    systems, and possibly air traffic control systems.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Part I Cyber Network Security Concepts


    # Causes, Symptoms, and Consequences


    The causes, symptoms and consequences of this antipattern include


    +   - Web browsers are a user interface platform for applications, called thin
    clients. Thin clients are used ubiquitously and are convenient for system administrators
    because there is no client software installation or client software updates.

    - Users are in the habit of opening multiple browser tabs and connecting with
    multiple websites. Websites with malicious content are a significant and prevalent
    threat. Malicious content (such as malware scripts) can be embedded in the site
    or served through advertisements supplied by third parties.


    # Refactored Solution and Examples


    Software Private Networks (VPNs) provide out-of-band separation of communications
    across public networks. This means that interception of packets using technologies
    like network sniffers is essentially prevented. VPNs are a widely deployed technology;
    one wonders why VPNs aren''t used universally. For example, providers that send
    unencrypted e-mails across the Internet are inviting exploitation of the data
    and possible future attacks.


    # Related Solutions


    To prevent XSS and other attacks, the American Banker’s Association recommends
    using a dedicated, physically separate computer for all financial transactions.
    Although this seems like an extreme solution, it''s a realistic response to the
    threats. Chances are that a hardened, well-patched computer, which is only used
    to connect to trusted financial sites, is much less likely to be compromised by
    malware than a computer that is exposed to general Internet surfing.


    # No Time for Security


    Antipattern Name: No Time for Security

    Also Known As: Add Security Last, Blame Security for Schedule Slippage,

    Deliver It Now!


    Refactored Solution Names: Security Requirements Are Real Requirements, Cyber
    Risk Management


    Unbalanced Primal Foces: Management of confidentiality, integrity, and availability


    Anecdotal Evidence: "Wait until it’s time to test the system, and then worry about
    security."'
  merge: -1
