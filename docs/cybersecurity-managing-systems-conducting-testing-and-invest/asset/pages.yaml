  md: '# Chapter 9 Cyber Network Defense Using Advanced Log Analysis 197


    **NOTE** Remember, the best way to use this information is to try these scripts
    by setting up your own network sensor to get a sense of the results for your environment.


    # Network Monitoring


    Network monitoring is continuous surveillance of a local area network (LAN) or
    other subnet. Monitoring is conducted at several levels. Full packet capture is
    a complete history of network transactions. Intrusion detection captures only
    alert attributes and alert packets.


    There are a wide variety of commercial, government, and Internet shareware options
    for network monitoring. Because this book takes a shareware approach, I use BackTrack/Ubuntu
    as examples for the operating environment and Snort for the IDS.


    For simplicity, this section assumes a single network sensor in the environment.
    In practice, you might need several network sensors at various nodes, and at least
    one at the boundary firewall to monitor Internet-to-intranet traffic. Based on
    your risk analysis and risk management strategy, you may also need sensors on
    subnets hosting critical data and systems.


    **NOTE** BASE is a network status dashboard built into BackTrack. BASE enables
    you to collect alerts from multiple Snort IDS sensors into a central database
    and aggregate dashboard. To start BASE in BackTrack, select K menu Services Snort
    Setup Initialize Snort. BASE is adequate for incident handlers, but it does not
    support advanced log analysis.


    An essential first step is to set up a Switched Port Analyzer (SPAN) on the firewall.
    This means you will mirror all firewall traffic to a designated port for your
    network sensor, so that no packets are missed.


    **NOTE** Not all network devices support SPAN ports (which mirror network traffic);
    however many routers, switches, and a few firewalls do. Assuming a Cisco ASA 5000
    series firewall and a Windows XP laptop, the laptop serial port is connected to
    the firewall-wall console via a Cisco console cable.


    **NOTE** The term "port" is used in several ways in this section. In discussions
    of firewalls and consoles, "port" refers to a hardware cable connection. The hardware
    ports are numbered on the firewall box. The other uses of "port" refer to Transmission
    Control Protocol (TCP) or User Datagram Protocol (UDP) protocol ports.'
