  md: '# IP Header


    Figure-6-3 shows a Layer 3 header for an IP packet containing a DNS query.


    ![](img/58b756e5b149184e369c845a987fc3a2_145_0.png)


    Figure-6-3: IP packet header


    The attributes are easily interpreted. On the top line, the source and destination
    IP addresses are shown. This IP packet is version 4 with header length 20 and
    total packet length 60 bytes. The Don''t Fragment flag indicates that this packet
    will not be split. A More Fragment Flag would mean that there is additional data
    in subsequent packets.


    The time to live (TTL) allows this packet to be routed no more than 64 times (64
    hops through routers). TTL is decremented for each hop. The protocol in the payload
    is UDP, indicating the type of the next header. The IP checksum verifies the integrity
    of only the header data. Note that the IP header is highlighted in the data pane.


    # ICMP Header


    ICMP packets are network error messages and pings. In this case, a DNS response
    generates a port and destination unreachable error message (see Figure 6-4).'
