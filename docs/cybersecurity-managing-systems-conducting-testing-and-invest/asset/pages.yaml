- pgno: 258
  md: '# CHAPTER

    11


    # Cybersecurity Essentials for

    Small Business


    There are about 25 million business entities in the United States. The vast majority
    are small businesses; small enterprises without specialized knowledge about network
    administration and security. Small enterprises, such as nonprofits and home businesses,
    are especially vulnerable to cyber threats, in many cases, because they use equipment
    and software right out-of-the-box, which means the machines are in insecure unpatched
    states with default passwords intact. Agencies (such as the United States Secret
    Service) charged with protecting small businesses are struggling to cope with
    escalating cyber threats.


    Because these businesses are small, they probably do not have cybersecurity experts
    on staff. But by adopting essential cybersecurity practices, small businesses
    can reduce vulnerabilities dramatically.


    Why are systems and networks vulnerable to cyber attack? Small businesses are
    on the Internet and exposed to numerous threats. A typical unprotected system
    will only survive four minutes browsing the Internet before it is attacked. Weaknesses
    in systems, software, and end user''s lack of cyber awareness can make businesses
    very vulnerable to attack.


    In this chapter I offer some essential advice for small businesses, drawing from
    the most feasible and effective professional best practices for organizations
    of all sizes. I assume the use of Windows systems to keep the rhetoric simple,
    but Apple Macs have similar vulnerabilities. A final section of the chapter covers
    the variations needed to manage security on the Mac operating system (OS).'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# Install Anti-Malware Protection


    As the basic precaution, small businesses should install antivirus protection
    and enable a Windows firewall. Make sure virus definitions are up to date and
    that the auto-update is on. It''s also a good idea to check later to make sure
    the auto-update is working.


    Antivirus packages such as McAfee, Norton, and Trend Micro have safe Internet
    browsers that protect against drive-by malware, which are attacks from a web page
    or online advertisement. See Chapter 10 for more about malvertisement and drive-by-malware.


    In general, avoid free antivirus protection. There are more than 9,000 free antivirus
    websites that are malicious—their products contain malware, ransomware, or scareware.
    Small businesses do best to buy a paid anti-malware subscription from a leading
    vendor such as McAfee, Symantec, or Trend Micro because those packages offer integrated
    protections such as antivirus, anti-spyware, and Internet browser from malicious
    websites.


    > NOTE Anti-spyware combats installed spyware, but there is still another form,
    Internet-based spyware, which is stopped through other techniques. See Chapter
    9 for Internet spyware blocking techniques.


    # Update Operating Systems


    It is important to keep your operating system updated; it is the core of your
    system, and its compromise is the objective of many malware attacks. Operating
    systems comprise extensive and very complex software. Software is hand-crafted
    by humans and contains latent defects. It is not uncommon for a major operating
    system to be released with more than 10,000 known critical defects, never mind
    the unknown latent defects. These defects are targets of opportunity for malicious
    entities. Each software defect can, in theory, be exploited to make the system
    fail, given the proper input values. Malicious software, in the form of exploits,
    attempts to invoke that system failure in a way that grants unauthorized access.


    It is recommended that you use automatic updates of Windows. However, you can
    perform manual updates on Windows from the Start menu: Start Programs Windows
    Update. Recheck this on occasion to make sure that auto-update is working. Normally,
    Windows auto-updates every Patch Tuesday, which is the first Tuesday of every
    month.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# Chapter 11 | Cybersecurity Essentials for Small Business 235


    # Update Applications


    Applications, just like operating systems, are complex pieces of software with
    numerous latent defects. Even if operating systems are regularly protected with
    patch updates, the application layer is a remaining target of opportunity. Updating
    applications from numerous vendors is not automatic nor easy, but it is very necessary
    to secure systems.


    Many applications are able to auto-update or notify users when update, but those
    features might not be enabled, and it''s worth making sure they update whenever
    appropriate. Some applications do not notify or update automatically unless they
    are running, even if they have been configured to auto-update.


    Likely, Microsoft Office applications are updated right along with Windows on
    Patch Tuesday. You can double-check the update status on Patch Tuesday through
    the Start menu: Start -> Windows Update. If the auto-update was successful, Windows
    Update should not request additional updates.


    For non-Microsoft applications, check the Help menu or download and re-install
    the newest version. Here are a few examples of applications that are important
    to keep updated and to check for:


    +   - Adobe Acrobat open the application and use the Help menu: Help -> Check
    for Updates.


    +   - For Apple QuickTime and iTunes, use Start Programs -> Apple Software Update.


    +   - With Java and Flash, install the newest versions from Oracle.com and Adobe.


    +   - If you need more help, use your favorite Internet search tool—for example,
    search site:oracle.com update java. There is abundant online help for most questions
    and problems.


    # Change Default Passwords


    Default accounts and passwords are installed on most hardware devices and software
    applications. These default passwords are available to the public and to malicious
    entities. There are a number of websites that share default passwords, such as:
    www.cirt.net/passwords. It is important for every small business to check default
    password lists for all of their hardware and software assets. Neglecting to secure
    default passwords is a widespread failing of small businesses in securing their
    systems.


    Some basic steps for securing default accounts and passwords include:


    +   - Disabling default user accounts on operating systems.


    +   - Changing the default passwords on databases that have default administrator—for
    example, MySQL, SQL Server, and Oracle. Make sure to choose a secure alternative.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '+   - Checking for default passwords in networked applications, such as point
    of sale (POS) systems. In addition to checking the default passwords list, call
    vendor technical support and get advice on securing the applications.


    +   - Creating an inventory list of the devices and systematically securing the
    default passwords for networking devices that have default accounts and passwords—such
    as routers, firewalls, wireless access points, and telephone switches.


    +   - Creating an additional administrative account, if possible, with a separate
    well-chosen password when securing default passwords. This account is a backup
    plan to access the device or software in case there is a problem accessing the
    default account.


    +   - Recording the new secure passwords in a system administration notebook (offline)
    and physically securing the notebook, such as keeping it in a safe that only a
    few trusted individuals can access.


    #  Educate Your End Users


    Small businesses should educate all staff about Internet safety. There are many
    good online resources for educating your end users. For example, the free course
    at www.gcflearnfree.org/internetsafety contains interactive lessons. Also read
    Chapter 10 for this book''s version of end-user cybersecurity education.


    #  Small Enterprise System Administration


