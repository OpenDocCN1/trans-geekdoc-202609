    # Using SQL Injection and Cross-Site Techniques to Perform Web Application and
    Database Attacks


    Chapter 7 covers vulnerability probes by Nikto and WebInspect. Nessus can also
    return vulnerability information when the scan policy is configured for websites.
    You can attempt to exploit these vulnerabilities using tools such as Metasploit
    and IMPACT. Alternatively, you can try some manual techniques for exploiting web
    forms using SQL and other forms of injection.


    SQL injection vulnerabilities arise when input from web forms are added to database
    queries without proper input validation. Suppose a web form is evaluating the
    following:


    ```

    SELECT * FROM Faculty Id=<user input>''

    ```


    The first step is to try any kind of query—'' OR ''1''=''. One more of these will
    generate a SQL query error, if it displays onscreen will indicate the database
    (DB) type. For example, an error such as ORA-00016 is from an Oracle database,
    whereas the MySQL error indicates Incorrect Syntax. You can try to retrieve all
    rows of the database table with a tautology (a statement that is always true)
    in query, such as


    ```

    User input: false'' OR ''true'' = ''true

    ```


    ```

    Which completes the query: SELECT * FROM Faculty Where Id='' false OR ''true''
    = ''true''

    ```


    Because this clause is always, the query matches all rows of the database and
    may display them onscreen. If this tautology syntax is not effective (because
    you are just guessing the SQL during a test), you can try using different kinds
    of query or expressions like the following:


    +   - false'') OR ''true'' = ''true''; -- - is a SQL comment, ends statement

    - false'') OR ''true'' = ''true''; -- -

    - OR ''true'' = ''true'' --


    > **NOTE** SQL command terminators by database make. See the online developer
    documentation.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# 176 Part II - Cyber Network Security Hands-On


    Techniques for injecting multiple queries include using an SQL statement separator
    (;) or the UNION operator. For example:


    ```

    User input: 0; select * from Student where 0=0; --

    ```


    Which completes the query: SELECT * FROM Faculty WHERE Id=''0'';

    SELECT * FROM Student WHERE 0=0; --


    The preceding example, if successful, returns the entire Student table. An example
    with the UNION operator is the following:


    ```

    User input: 0 UNION SELECT * FROM Student where 0=0 --

    ```


    Which completes the query:

    SELECT * FROM Faculty WHERE Id=''0'' UNION * FROM Student

    WHERE 0=0; --


    A successful UNION clause merges results from the two tables into the query result;
    the SELECT clauses must have the same number of columns and data types.


    > NOTE The number of columns and types can be artificially extended like so:

    select *, 1, ''Two'', 3.0, ''Four''


    The previous two examples show injected SQL statements able to execute any query—that
    is, the second SELECT statements. With that ability, you could retrieve a DB schema,
    DB accounts, password hashes (for cracking), and user privileges. In addition,
    you could access local files and inject command-line system cells. Database-specific
    examples of these types of queries appear in the SQL Injection Cheat Sheets at
    http://pentestmonkey.net.


