- pgno: 190
  md: '# CHAPTER

    8


    # Penetration Testing


    Gaining unauthorized system access, controlling systems without authorization,
    and exfiltrating data are inherently illegal in most jurisdictions. These crimes
    are analogous to burglary and robbery. Security testing is a professional service
    that sometimes mimics malicious attackers (also called white hat hacking), in
    particular during penetration testing (also called pen testing).


    To protect yourself from legal consequences as you test systems, you must have
    clear authorization to conduct testing—a legal agreement, called Rules of Engagement
    (ROE), signed by you (the tester) and the client executives. Lawyers for both
    organizations should be involved. If test packets traverse other networks in other
    countries, you must consider the laws of all jurisdictions traversed.


    In Chapter 7 I cover reconnaissance, network/port scanning, policy scanning, fingerprinting,
    and vulnerability probes. I continue to cover the phases of ethical hacking in
    this chapter continuing with network penetration, Wide Web attacks, database attacks,
    user enumeration, password cracking, and privilege escalation. The final malicious
    phases are rarely conducted as part of pen testing, but they are very commonplace
    in the wilds of the Internet; these phases include back doors, rootkits, exfiltration,
    and abuse. To start, you need an understanding of the types of cyber attacks.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Forms of Cyber Attacks


    Cyber-attack techniques are widely discussed and defined on the Internet, with
    more than a million pages covering buffer overflow, SQL injection, and other common
    cyber-attack methods. This section briefly discusses major cyber attacks and discusses
    the resulting log evidence of cyber attacks. Network defenders, red team attackers,
    and other pen testers care about how attack activities are observed. Most of the
    activities in the last chapter, and virtually all of it this one, will cause trails
    of log evidence on systems and network devices.


    # Buffer Overflows


    One example of a common cyber attack is a buffer overflow that writes attack code
    data and programs in the target machine, which causes its execution. An oversized
    input argument puts attack code into executable areas on the target machine. Techniques
    such as a string of CPU no-operations (that is, NOOP sled) increase the likelihood
    that the target will execute the attack code.


    > NOTE Common buffer overflow patterns are hex 90 repeated for NOOP sled and ASCII
    A repeated for SMB attacks.


    The likely evidence that a buffer overflow has occurred is system logs and network
    sensor logs. Buffer overflows are discovered in operating system (OS) logs as
    panic and error messages. Intrusion Detection System (IDS) logs detect and clearly
    indicate buffer overflow alerts. Ideally, you should investigate all alerting
    Internet Protocol (IP) addresses, and you should eliminate false positives to
    reveal suspicious activity. See Chapter 9 for information about cyber investigative
    techniques.


    The objective of attackers is to get the target machine to execute their code.
    Web browsers are early targets because they continually render Hypertext Markup
    Language (HTML) and execute embedded scripts. Scripts are everywhere on intranet
    pages and the web—Internet browsing would be quite dull without scriptable content.
    Drive-by malware attacks browsers when a user visits malicious pages; this may
    occur on legitimate sites if they''ve been compromised by an attacker.


