- pgno: 317
  md: 'automated scans on particular hosts and ports using widely available tools
    is not difficult. I have created more than a dozen of these simple scripts for
    a custom pen test toolkit, using Linux/Unix Bash shell and common pen tools including
    amap, nmap, nlookup, and netcat. Unfortunately, even simple scans on a local subnet,
    such as ping sweeps, can take nearly a whole second per host, including operating
    system overhead (see the "Performance Benchmarks" section later in this chapter).
    Obviously, that would violate the timeliness requirement.


    To accelerate scanning, scans could be distributed across a botnet by parallel
    processing techniques, such as map-reduce, the parallel architecture used by Google
    (Dean & Ghemawat, 2004). For example, you could use a custom host list to parcel
    out distributed scans (map phase), and aggregate results back to a command server
    (reduce phase). For this book, I programmed a simple botnet as an architectural
    prototype in Python. The botnet performs parallel and distributed scanning. Annotated
    source code and performance measures appear in the "Architectural Prototypes"
    section later in this chapter. Other than useful architectural insights for military
    bots, the key result of the prototype work was the discovery that ordinary scan
    scripts (for, ping sweeps) can be accelerated by 40 times faster using multithreaded
    parallel Python.


    If it is not used for other purposes, a military botnet hosted on government computers
    could be concealed until it is activated for an attack. Attribution for this type
    of bot would be relatively easy to determine because it would emanate from IP
    addresses of government installations, all owned by the same government. In this
    case, clear attribution has deterrence advantages for both offensive (inhibiting
    state actors from attacking) and defensive (clear association with counter-retaliation).
    Constructing the database of domains and IP addresses for rapid attribution could
    be readily gleaned from public domain reconnaissance, such as Google hacking,
    whois lookups, and nslookup records.


    For more typical botnets, the requirement to assign attribution within milliseconds
    is particularly challenging (McConnell, 2010). Attribution on the Internet, in
    general, is a hard problem, irrespective of the timeliness requirement. This chapter
    envisions mechanisms for timely attribution as a top architectural priority.


    One solution is to reinvent the problem. Reengineering the Internet to support
    attribution, geo-location, intelligence, and impact analysis was proposed by McConnell,
    but is probably a solution that is decades away (McConnell, 2010). There is also
    significant pushback to this idea based upon privacy concerns. This book assumes
    that the cyber deterrence architecture will be deployed in an environment comprising
    current Internet technologies.


    First, you''ll need a definition of a typical attack architecture before you read
