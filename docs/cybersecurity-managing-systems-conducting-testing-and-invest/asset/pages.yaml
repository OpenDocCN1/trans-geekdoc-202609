  md: '# Chapter 7 Reconnaissance, Vulnerability Assessment, and Cyber Testing 159


    Nikto performs a battery of probes seeking common web server vulnerabilities,
    such as common gateway interface (CGI) and other files with known defects. It
    does not check for application flaws, such as SQL injection. Nikto uses the -c
    option to scan all potential directories for flaws and misconfigurations, and
    the -h option to specify the host''s web server IP address.


    A popular commercial vulnerability probe is Hewlett Packard''s WebInspect, which
    runs on Windows. It is an intuitive and highly automated tool that performs more
