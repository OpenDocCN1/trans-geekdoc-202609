- pgno: 94
  md: '# Chapter 4 = Network Administration for Security Professionals 69


    only the first two disks may be required for Red Hat Enterprise installation,
    or perhaps all six disks, as expected. Ubuntu, running as an ISO DVD can install
    itself onto a hard disk through a command like the following:


    ```

    # ubiquity --desktop tk gtk_ui

    ```


    This command launches a graphical installer GUI, which includes various installation
    options such as selecting and resizing of disk partitions.


    # VMware


    VMware Player cannot install new VMs, but VMware Workstation and ESXi can. It''s
    easier to install a new VM with VMware Workstation because it works locally on
    your PC desktop. Use Workstation to create a new VM and connect to the hardware
    CD/DVD on the host device. Insert the CD and install exactly the way you would
    install a physical machine. In Workstation choose VM: Install VMware tools to
    get VM-specific drivers into the OS for networking and other functions.


    # Other OSes


    Solaris installation works somewhat differently than other OSes, in that it enables
    you to perform network setup during the installation procedure. This requires
    more information upfront from local network administrators. It is a good idea
    to use these installation options, as manual setup requires significant research.


    # Burning and Copying CDs and DVDs


    One of the easiest ways to transfer data is with external media, such as CDs and
    DVDs. Knowing how to burn disks on several platforms makes it possible to perform
    many other network operations. For example, you need to burn CDs when you re-image
    systems because you need to install system patches and antivirus protection without
    connecting the vulnerable system to the Internet.


    There are many other ways to transfer information, such as through removable disks,
    the file transfer protocol command, and memory sticks. Note that memory sticks
    are banned in most government organizations and from many corporate networks because
    of the autoplay vulnerability (by default, Windows systems automatically run scripts
    on memory sticks, and serious virus incidents have been spread this way.


    You can make several types of burns. CD-Rs have 700MB capacity and are inexpensive.
    DVDs have 4GB capacity and are considerably more expensive. The savings are significant
    if you buy disks in bulk quantities.'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'Treat CDs and DVDs with respect because they are easily scratched or soiled
    and rendered unusable. CD-R grooves are about 1.6 micrometers (um) wide, and DVD
    grooves are about .74 um. A human hair is about 80 um wide. That means scratches
    or debris on a disk that is only 2 percent the width of a human hair causes data
    loss. Always keep blank disks on a covered plastic spindle. Written disks should
    be stored in a paper/plastic sleeve or CD wallet.


    Regular data disks CD-R and DVD store files. A completely different format called
    ISO disk is also common for making bootable CD or DVD operating systems. For example,
    my reference BackTrack software is an ISO, as is other security test test suites
    such as Helix and Caine. In Chapter 5, you find out how to customize BackTrack
    ISOs.


    # Windows


    Various versions of Windows have built-in CD-burning software.


    +   1. On newer Windows systems, insert a blank CD or DVD.

    2. Shortly, an autoplay dialog should display and ask you if you want to burn
    audio files or data files. Choose data.

    3. Now browse your folder and right-click on each file. Choose Send to DVD/CD-RW.

    4. To finalize a CD-R disk, open My Computer, right-click, and then choose Close
    Session. Note that CD-R is a unique format that requires a finalization phase,
    usually closed session.


    Another option on Windows is the program Magic ISO, which has a limited version
    available as shareware. Magic ISO can make data disks as well as bootable ISO
    disks from images. Use Mode 1 ISO format for bootable data disks, mode 2/XA for
    video disks. The pay version of Magic ISO is required to burn large DVDs, such
    as BackTrack.


    # Linux


    Instead of using the built-in command CD/DVD software, try a convenient open source
    GUI called Brasero. On Red Hat Linux variants (such as RHEL, CentOS, and Fedora),
    you can use Yum extender to download and install Brasero. To install Brasero on
    Ubuntu, use the following command:


    ```

    # apt-get install brasero

    ```


    Brasero is very intuitive. Insert a blank disk. Choose the type of burn (copy
    disk, data disk, or ISO burn), confirm the disk selections, and launch.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Chapter 4 Network Administration for Security Professionals 71


    # VMware


    VMware Player, a CD/DVD drive can be connected to a VM using Device (Device Name).
    Connect Then use the OS installation instructions provided earlier for the type
    of VM operating system, such as Windows autoplay when you insert a blank disk.


    To install ESXI client software, point your Internet browser at the IP address
    of the ESXI server. The ESXI home page includes instructions for downloading the
    vSphere client. Install as directed and have your current network administrator
    an ESXI account. With your VM running in your vSphere console, insert a disc into
    the disk drive on the ESXI server hardware (or external burner), and then access
    the disc as appropriate for the operating system of the VM—for example, using
    Windows autoplay.


    When creating a new VM, there is an option for the machine to save its simulated
    data disk in 4GB partitions. Choose this option because it enables you to relocate
    VMs by burning them to data DVDs.


    # Installing System Protection / Anti-Malware


    An unprotected system directly exposed to the Internet has a life expectancy of
    about 10 minutes. That is the principle behind passive honeypots, where machines
    are purposefully exposed to the Internet in order to capture malware.


    Antivirus is the most obvious protection that you should install, enable, and
    set for automatic updating (or at least semi-automatic updating). But there are
    several other important protections, and the range of protections needed is constantly
    rising as threats escalate. Because perimeter security is insufficient to combat
    current and future threats, the trend in protection is toward host-based security
    (HBS), which provides a full array of network defenses on each machine.


    The security industry has not settled on the full scope of HBS, and actually implements
    its principles poorly. No one company or open source project makes all the prerequisite
    pieces. In most environments, you will have to use a hodge-podge of unintegrated
    "stovepipe" security solutions.


    HBS can be implemented with a combination of location protections and services
    and enterprise services that manage local configurations and services. For example,
    an enterprise antivirus solution can update malware signature databases on machines
    throughout the network. A full-scope HBS would include technologies such as


    +   - Antivirus

    - Anti-spyware

    - Firewall'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Part II Cyber Network Security Hands-On


    +   - Intrusion detection

    - Intrusion prevention

    - Blacklisting

    - Real-time integrity checking

    - Periodic policy scanning

    - Rootkit detection

    - Patch management


    **NOTE** mvps.org hosts file can be used to block spy-spyware domains as described
    in Chapter 9. Blacklisting can also be done on a country-by-country basis; check
    out www.countryipblocks.net/. Another approach (one I don''t particularly favor)
    is whitelisting, which limits access to IPs on an approved list. Some solution
    providers include McAfee, Corectrace, Savant, and Bit 9.


    Antivirus protection scans for malicious files. There are several types of scans:
    on-demand, scheduled, and continuous. On-demand and scheduled scans start at a
    discrete time and continue until all requested files are scanned. Continuous scans
    are performed in real-time as files are added or modified. Continuous scanning
    should also monitor volatile memory for malware; penetration test tools like Meterpreter
    require no file system footprint (see Chapter 8).


    Traditional antivirus recognizes malware through signatures, usually by matching
    the hash function of files with a known malware database. These databases must
    be updated frequently to catch the latest malware. It is recommended that you
    configure for automatic updating. The more innovative antivirus engines use behavioral
    malware detection, where the effect of a candidate file on a system is assessed
    either directly or through a virtual machine. Behavioral malware detection can
    discover zero day threats and targeted threats.


    **NOTE** Some targeted malware is crafted for customers of specific corporations
    and might never be included in general antivirus products.


    Anti-spyware searches for suspicious applications that might be collecting data
    without the users'' knowledge. Spyware applications are often installed covertly,
    as the user is surfing a website.


    Both antivirus and anti-spyware programs either quarantine or remove the malicious
    file. A quarantined file is temporarily disabled, usually by moving it to a sandboxed
    directory. An administrator may restore it.


    A host-based firewall defends which ports are open and closed, as well as applications
    are allowed to communicate on or over the network. An Intrusion Detection System
    (IDS) scans network traffic for potentially malicious packets and sends alerts
    the packet to log files. An Intrusion Prevention'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Chapter 4 Network Administration for Security Professionals


    System (IPS) can dynamically block network traffic based on alerts. A blacklist
    is a list of blocked domains, IPs, or IP address blocks. The blacklist prevents
    these IPSs from communicating outbound or inbound traffic (or both).


    A real-time integrity check monitors OS files for changes and alerts when it detects
    potentially malicious changes. A periodic policy scan checks the settings of registry
    keys, Group Policy objects, services, and applications, alerting when it detects
    variation from accepted standards for secure systems.


    Recommended configurations for OS and application security hardening (called benchmarks)
    are available from manufacturers, the government, and other sources. Perhaps the
    best OS and application benchmarks are available from the Center for Internet
    Security, which consolidates more than 50 best-practices benchmarks from multiple
    sources. You can find it at www.cisecurity.org.


    > TIP Government-developed security benchmarks are available to the public at
    www.nsa.gov/ia/guidance/


    Rootkit detection is a scan that detects serious malicious system infections,
    which might evade other defenses by cloaking their activities from normal observations—for
    example, directory listings.


    > NOTE The Microsoft Malicious Software Removal Tool is an example of a rootkit
    detector. As part of the Patch Tuesday automatic system update, this tool is updated
    and runs monthly. However, it is not an ideal architecture for detection because
    it runs on the OS, and malware may manipulate the OS to hide itself. A more effective
    rootkit detector runs independently of the local OS, from a bootable ISO disk.


    Patch management ensures that the OS and applications have the latest developer-recommended
    updates. Although OS patching is reasonably prompt in most organizations and homes,
    application patching remains a major vulnerability. Microsoft initiated a ritual
    monthly update called Patch Tuesday. It is the second Tuesday of each month and
    coincides with patch updates from many vendors.


    > WARNING Release of patches gives significant clues to malicious users, who rush
    to attack unpatched systems on Exploit Wednesday, the day after Patch Tuesday,
    when many vendors release patches.


    The following sections focus on free anti-malware packages popular with the cybersecurity
    community. Be very cautious about your choice of free antivirus programs because
    there are thousands of packages available on the Internet that actually contain
    malware and ransomware. You can find a comparison of antivirus engines on www.virustotal.com.
    That website allows you to submit candidate malware and discover which engines
    alert for malware. Surprisingly, most of the freeware antivirus software covered
    here compares well with commercial solutions.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Part II Cyber Network Security Hands-On


    > **TIP** Vet the software you find on the Internet through trusted distribution
    sites, such as at www.cnet.com, http://sourceforge.net and www.virustotal.com,
    but be aware that these sites are not foolproof.


    # Windows


    Some of the antivirus packages for Windows are available from www.avast .com,
    www.clam.net, http://free.avg.com, and www.malwarebytes.org. Some free anti-spyware
    packages are available from http://superantispyware.com and http://lavasoft.com
    (Ad-Aware). Free rootkit detection tools are available from www.safer-networking.org
    (Spybot S&D) and www.microsoft.com (Malicious Software Removal Tool).


    As a first step, always update your antivirus databases to the latest releases,
    even if they''re newly installed, and enable automatic updates.


    # Linux


    The anti-malware market for Linux is considerably smaller than Windows; hence
    there are offerings of both free and pay solutions. Some of the free antivirus
    packages for Linux are available from www.clam.net and free-.avg.com. Linux packages
    in general are less turnkey than Windows. For example, you can install Clamav
    on Ubuntu with the following command:


    ```

    # apt-get install clamav

    ```


    Similarly on Red Hat Linux, you can search and install Clamav using Yum extender.
    To update the Clamav antivirus signature databases twice a day, use the following
    command:


    ```

    # freshclam -d -c 2

    ```


    The freshclam command does an immediate update if invoked with no arguments. To
    run a Clamav scan on the entire file system, use the following:


    ```

    # clamscan -r /

    ```


    You can substitute a directory path to scan a subset of the file system. Learn
    how to automate Clamav scans by using the Cron examples in Chapter 9.

    The best way to verify an ISO or downloaded data is to run a hash against it.
    A hash is the output of a program that calculates a unique digital value for a
    block of program or data. Even a single bit change can significantly change hash
    values.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# Chapter 4 Network Administration for Security Professionals 75


    # VMware


    VMware infrastructure, which in the ESXi release contains no other OS code, generally
    requires no anti-malware on its own. However, the guest VM operating systems require
    the same protection that you would afford any OS.


    # SEED LABS


    The SEED labs for this section include the Linux Capability Exploration Lab under
    the Exploration Labs category. This lab explains principles of Linux security,
    such as Role-Based Access Controls. Access the SEED labs at http://www.cis.sys/edu-/wed/seed/all_labs.html.


    # Setting Up Networks


    Successfully getting a system communicating on a network is a basic competency
    of network administration and hands-on cybersecurity. There are two major variations
    for getting network connectivity: static IP and dynamic IP. The choice is based
    on convention for your LAN. Dynamic IPs require a Dynamic Host Configuration Protocol
    (DHCP) server to issue new IP addresses. Static IPs are assigned by network administrators
    and are manually configured.


    The two major IP versions are IPv4 and IPv6. IPv4 uses 32-bit addresses, denoted
    by four-bit numbers, called dotted decimals, such as 64.107.115. IPv6 addresses
    are 64 bit and denoted by eight sixteen-bit hex numbers separated by colons. A
    single string of zeros in an IPv6 address can be abbreviated, for example:


    ```

    2a1b9ce:0:0:0:0:0:d:1 is equivalent to 2a1b9ce::d1.

    ```


    A block of addresses is Classless Inter-Domain Routing (CIDR) notation. A CIDR
    for an 8-bit (256 IP address) range is 24 = 32-8 (IPv4), or for a 48-bit range
    it is 80 = (128-48). For example, a CIDR for an 8-bit block of 256 addresses is
    denoted as 10.10.10.0/24, and a 48-bit block of 248 addresses is denoted as 55aaaa::/3f.


    Each NIC has a unique (MAC) address assigned by the manufacturer. The first set
    of numbers indicates the hardware manufacturer. The IP address is the unique network-wide
    logical number of the machine. Most wide area networks (WANs) and LANs use network
    translation (NAT), which creates a virtual address space, isolated from the Internet.
    In IPv4, the prefix 192.168 and 10.10 are assigned to NAT addresses. An entire
    NAT subnet is exposed to the Internet as a single or block of publicly assigned
    IP addresses, as managed by a firewall or Internet router. NAT is completely transparent
    to individual machines.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# Part II Cyber Network Security Hands-On


    The DHCP server can set up all the network settings automatically through network
    discovery; it essentially broadcasts messages to the host to establish connectivity
    (See DHCP in Chapter 6). Otherwise, you can establish a static IP manually.


    Static network connections require a handful of IP address, subnet mask, and default
    gateway—to be able to communicate on an IP network. You can also add a name server
    for name resolution if you are using Windows Internet Name Service (WINS) or Domain
    Name System (DNS). Obtain all of these values from a network administrator. The
    subnet mask indicates the address range of the subnet where the machine is connected.
    Its value is the inverse of a CIDR, in IPv4 or IPv6 notation. For example, the
    mask for a /24 subnet is 255.255.255.0 or in IPv6 it is fffff:ffff:ffff:ffff:ff0


    > **NOTE** A security test, limited to a single subnet, could manage without a
    name gateway by using hardware (MAC) addresses or the Address Resolution Protocol
    (ARP) to discover MAC addresses.


    Name servers use DNS Internet standards. DNS servers translate Internet domain
    names into IP addresses and vice versa. For example, one of the DNS results for
    Google.com is 74.125.229.20. DNS can also translate between local machine names
    and IP addresses.


    The default gateway is the IP address of the network router managing this subnet.
    All traffic destined to go outside the subnet must pass through the gateway. The
    name server is the preferred DNS server.


    # Windows


    The network initialization procedure for newer Windows systems includes:


    +   1. Select Start $\leftrightarrow$ Control Panel Network Status and Tasks and
    then click Manage Network Connections in the left navigation bar. (Older Windows
    OS enable you to access the network connections window directly by clicking on
    the network icon in the task tray).

    2. Double-click the Local Area Network icon and then click the Properties button.

    3. Select IPv4 or IPv6 protocol and click the Properties button.

    4. Choose either static IP or automatic (DHCP) and then choose static or dynamic
    DNS.

    5. For static IP, fill in the IP address, subnet mask, default gateway, and (if
    static DNS) the preferred DNS server(s).

    6. Click the OK button twice and then click the Close button to confirm the settings.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Chapter 4 Network Administration for Security Professionals 77


    Use command-line options for managing network connections include ipconfig, ping,
    nslookup and netstat. Immediately after IP setup, use ipconfig to confirm the
    IP address and the default gateway at the Windows command line. Invoke the command-line
    tool with the following menu command: Start ↘ Accessories ↘ Command Prompt. Ping
    the gateway to confirm connectivity, for example:


    ```

    C:\> ping 10.10.100.1

    ```


    Failures at these early network stages are common. As a general rule, always check
    your hardware connections first. Is your network cable plugged in? Do lights on
    the network devices indicate normal activity, compared to known good connections?
    Double-check your settings with ipconfig. Try ping another host. To go back to
    the network configuration dialog and doublecheck Try changing one at a time and
    retesting, such as a single setting, IP number, or hardware component. Prove what
    works and what does not and isolate the error and fix it. For example, try a different
    machine on the same cable to prove that nothing upstream of the NIC is at fault.


    Use nslookup on a well-known domain to confirm connectivity to the name server,
    for example:


    ```

    C:\> nslookup google.com

    ```


    If this fails, try ping the name server''s IP address and then recheck the network
    settings. Use a systematic debugging approach as described earlier. As a final
    test, retrieve a web page using the browser. When this works, you are successful!
    The machine is communicating with the LAN and the Internet.


    # Linux


    For dynamic IP (DHCP), use the ifup command to automatically configure network
    settings:


    ```

    #ifup eth0

    ```


    The effect of this command is controlled by /etc/network/interfaces, with an entry
    such as


    ```

    auto eth0

    iface eth0 inet dhcp

    ```


    Set up a static network with the command-line commands ifconfig and route, as
    well as the file /etc/resolv.conf. For example, as a first step, configure a DNS
    name server at 10.10.100.100


    ```

    # echo "nameserver 10.10.100.100" >> /etc/resolv.conf

    ```


    Set up the static IP address and subnet mask as follows:


    ```

    # ifconfig eth0 10.10.100.10/24

    ```'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'Note the use of /24 CIDR notation. Then set up the gateway like this:

    # route add default gw 10.10.100.1


    Verify both settings with the ifconfig and route status commands:

    # ifconfig

    # route


    As on Windows, ping and nslookup to verify network setup, and use a systematic
    debugging approach. You can use wget as an alternative to the browser to verify
    Internet connectivity. The wget command retrieves a web page and saves it to a
    local file, index.html, as shown in the following example:

    # wget google.com


    # VMware


    As I explained in the re-imaging section, VMware Tools contains necessary drivers
    and must be installed for networking to function. Select VMware Tools to install
    it.

    VMware has three networking modes:


    +   - Bridged mode is equivalent to putting the guest VM on the local subnet.
    It must have its IP address within the local CIDR. The network setup for the guest
    OS is just like Windows, Linux, and OSes.

    - VMware NAT creates a virtual switch between the VM host and the VM guest. VMware
    selects an alternative NAT address range and assigns an address to the VM guest.

    - Host-only mode restricts the guest networking to the local host.


    Set the mode using Device Network Connections in VMware Player. Networking VMs
    have posed many unexpected problems in my practical experience. For example, after
    getting a Solaris VM networked on ESXi box without too much effort, I migrated
    the same VM to another ESXi box and hit a brick wall; nothing worked. After numerous
    debugging trials and Internet research, I began to light the day and developed
    the following approach to networking a Solaris VM running on ESXi. This is a distillation
    of several of the approaches found on the Internet, none of which yielded the
    complete answer as shown here:


    +   1. Install VMware tools on the running Solaris VM.

    # shutdown -g 0 -y (immediate shutdown)

    2. In vSphere Client, right-click Solaris VM Power Off.

    3. Right-click VM Edit Settings.

    4. On the Hardware tab, click the Add button.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Chapter 4 Network Administration for Security Professionals 79


    5. Select Ethernet Adapter.

    6. Configure the adapter for vmxnet3 driver.

    7. Click the OK buttons twice to confirm.

    8. Right-click Solaris VM Power On.

    9. After reboot, log in to the Solaris VM.

    10. In the terminal, use su to become root.


    The following sequence of commands, typed into the Solaris shell of a virtual
    machine, will configure networking:


    ```

    #ifconfig vmxnet3so plumb

    #ifconfig e1000g0 unplug

    #mv /etc/hostname.e1000g0 /etc/hostname.vmxnet3so

    #reboot


    #ifconfig vmxnet3so 10.10.10.100 mask 255.255.255.0 up

    #route add default 10.10.10.1

    #echo "nameserver 10.10.10.100" >> /etc/resolv.conf

    ```


    Note that there are idiosyncrasies used here from both Solaris and VMware that
    don''t appear in other OSes that you must master and combine to develop a solution
    like this. But after you have a working solution documented, repeat-it is fast
    and de recommend.


    > TIP I recommend that you take care to shut down your VM OSes properly. Windows
    VMs are especially prone to break otherwise. Also, I strongly suggest that you
    do not configure hardware and other VM machine settings on Windows VMs after the
    OS is activated. Changes may result in another Microsoft activation challenge.


    In general, use the systematic debugging approach explained in the “Windows” section
    to resolve such challenges on your own networks. Always document your answers
    so that you can repeat the solution without repeating all the hard-won research.


    # Other OSes


    Installed physically (not VM), Solaris uses somewhat different command-line syntax
    for Linux. The command sequence for a static IP on Solaris interface e1000g0 is
    the following:


    ```

    # echo "nameserver 10.10.10.100" >> /etc/resolv.conf

    #ifconfig e1000g0 10.10.10.10 mask 255.255.255.0 up

    #route add default 10.10.10.1

    #ifconfig -

    ```


    The final command verifies the setup status.'
