- pgno: 283
  md: '# Quick Hits and Solutions


    A best practice risk assessment approach is defined by NIST Special Publication
    800-30 (NIST 2012). The following is adapted from the publication and summarizes
    the risk assessment process for ready assimilation. The process consists of a
    number of logical steps:


    +   1. System Characterization: The enterprise must understand all the systems
    and their information contents, starting with the systems and data with the largest
    potential impact. Define categories of systems and devices, rather than addressing
    each entity individually.


    +   2. Threat Identification: Brainstorm all potential threats, such as weather,
    insider threats, equipment loss, and hacking. Appendices D and E of NIST 800-30
    is a useful listing of potential threat sources and threat events.


    +   3. Vulnerability Identification: Brainstorm the potential vulnerabilities
    for the enterprise. Identify sensitive information in each category of systems
    and devices. Vulnerability analysis should include human factors as well as technical
    vulnerabilities, such as those identified by testing in Chapter 7. Appendix F
    of NIST 800-30 is a starting point for potential vulnerabilities.


    +   4. Control Analysis: Analyze security requirements for their adequacy. Best
    practices would start with the list of the 20 Critical Controls and then consider
    requirements unique to this enterprise and how different sets of controls may
    be needed for different categories of systems and devices.


    +   5. Likelihood Determination: For each threat, estimate the likelihood of its
    happening to your enterprise.


    +   6. Impact Analysis: For each threat, determine the seriousness of impact that
    should exploit a vulnerability.


    +   7. Risk Determination: Combine the likelihood and impact determinations to
    assess the overall risk to the enterprise.


    +   8. Control Recommendations: Revisit the controls and devise plans for implementation
    based on the risk priorities that each control mitigates.


    # Related Antipatterns


    See the next section, “Data Loss via Undetected Exfiltration (Critical Control
    17).",'
