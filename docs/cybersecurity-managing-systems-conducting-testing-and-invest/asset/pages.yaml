- pgno: 68
  md: '# Chapter 3 = Enterprise Security Using the Zachman Framework


    would choose the British Ministry of Defense Architecture Framework (MoDAF). These
    are some of the most widely used frameworks, but there are many more.


    The Row 3 frameworks generate mostly composite models which contain independent
    viewpoints. The Institute of Electrical and Electronics Engineers (IEEE) has captured
    this formally in the standard IEEE-1471 Recommended Practice for Architecture
    Description of Software-Intensive Systems.


    From an international perspective, this is a standard and universally applicable
    Row 3 framework. This framework is jointly standardized by the International Telecommunications
    Union (ITU—that is, the telephone industry) and the International Standards Organization.
    It is the Reference Model for Open Distributed Processing (RM-ODP).


    RM-ODP and the industry consortia driving its usage, the Telecommunication Information
    Networking Architecture Consortium (TINA-C), are the reasons you can make a phone
    call from New York to New Zealand through dozens of telephone systems, made by
    different vendors. The telephone systems are interoperable because RM-ODP constraints
    are legally enforceable. This is a framework you should seriously consider using
    for your Row 3 architect perspective.


    # Architectural Problem Solving Patterns


    People have been applying the Zachman Framework pervasively since its public release
    two decades ago. An early method, documented by Stephen Spewak in the classic
    book Enterprise Architecture Planning (Wiley Publishing, 1993, ISBN 978-047-1-59985-2),
    explained how to populate the first few rows with models. It was a laborious process,
    easily taking six months or more, and the business benefits of doing the exercise
    were not exactly clear, but the customer''s sweat equity could create a psychological
    buy in.


    Twenty years have passed and the techniques have evolved through thousands of
    engagements. The key techniques are as follows:


    +   Business Question Analysis: Gather knowledge from enterprise subject matter
    experts (SMEs—for example


    +   Document Mining: Obtain as much enterprise documentation as possible. Choose
    a column and go through each document finding examples. Keep a list of what you
    found, the enterprises'' text defining it, and the document and page number where
    it can be found (for traceability). Completing document mining for all the interrogatives
    will populate Row 1.'
