    how cyber deterrence strategies and policies would operate in practice. Fortunately,
    RAND Corporation researcher Martin Libicki (2009) has conducted the needed policy
    and strategy analysis, and RAND has granted permission to use some of his key
    figures in this chapter to help explain the concepts. Libicki developed'
