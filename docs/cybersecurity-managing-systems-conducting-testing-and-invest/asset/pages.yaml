  md: '# Chapter 9 = Cyber Network Defense Using Advanced Log Analysis 201


    You can use Snort and tcpdump to convert binary packet logs into text logs for
    further analysis. See the "Binary Log Analysis" section for tcpdump techniques.

    nYou can use Snort directly on the command line, or you can access it through
