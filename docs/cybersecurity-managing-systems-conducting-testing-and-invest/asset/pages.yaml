- pgno: 89
  md: '# Linux and Unix


    The administrative account in Linux and Unix is username root. From a nonprofit
    account, Linux users can switch to root with the superuser command, su -, which
    challenges you for the root password. The dash (-) also means adopt the root''s
    environment variables and home directory. Use the exit command to de-escalate
    back to the user account. Use the superuser command to log into other accounts,
    such as su - myaccount.


    # VMware


    Of the three VMware platforms covered in this chapter, only ESXi has administrative
    accounts, whereas VMware Player and VMware Workstation are single-user desktop
    applications without user authentication.


    ESXi is a sparse operating system, whose entire purpose is to administer virtual
    machines. It does not have Internet browsers or other user applications. As such,
    it makes sense for all network administrators to use privileged accounts on this
    operating system.


    # Installing Hardware


    Computer hardware is generally not OS specific, although some platforms are unable
    to boot certain OSes. The basic components for desktop systems are pedestal (processor,
    memory, and peripherals), display/monitor, keyboard, pointing device, uninterruptible
    power supply (UPS) systems, and cables for all of the components plus a network
    cable. Some systems are more bundled, such as laptops and Apple Macs, which bundle
    everything except the wireless mouse and wireless keyboard.


    For pointing devices and keyboards, the standard connector is the Universal Serial
    Bus (USB), except that the obsolete IBM PS2 connectors are still use in some shops.
    Wired network CAT 5 cables use RJ-45 connectors. Although there are dozens of
    competing standards for fiber optic cables. Each shop must adopt one of the standards
    compatible with the Network Interface Card (NIC) and network switch components.


    Computer monitors usually conform to one of the prevalent standards: Video Graphics
    Adapter (VGA) or Digital Video Interface (DVI). Some monitors have both types
    of connectors and support switching between pedestals.


    The standard power cable is called the pigtail and conforms to each country''s
    electrical standards. Usually, there are separate pigtails for the monitor and
    the pedestal.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Chapter 4 = Network Administration for Security Professionals 65


    You should consult your manufacturer''s instructions for specifics about setting
    up your system, a typical hardware setup sequence for a desktop pedestal includes
    the following:


    +   1. Position the components on the top of the desk. Optionally, if the system
    has a separate floor pedestal then it is placed underneath the desk along with
    the UPS, with the backside and connector ports facing the installer.

    2. Connect the monitor pigtail and display cable and secure the thumbscrews, if
    any.

    3. Feed the monitor, mouse, and keyboard cables through a desktop opening, or
    around the back/side.

    4. Connect the network, monitor, mouse, and display cables to the pedestal.

    5. For a new UPS, you may need to connect the battery by removing a panel and
    an instructions sticker and then fastening an internal plug.

    6. Connect the pigtail to the pedestal and then connect it to the UPS. Connect
    the UPS to the electrical outlet. Turn on the UPS. Double-check all cable connections.

    7. Always verify your work. Make no assumptions. Turn on the computer; verify
    that the monitor displays the boot sequence on the screen. If an operating system
    is installed, continue booting to check keyboard, mouse, and network functionality.
    Alternatively you can test the system using bootable CD/DVD test tools, such as
    BackTrack, Caine, or Helix.


    For server rooms, rack-mounted systems generally come without monitors or keyboards.
    A single user interface (UI) can serve an entire rack using a Keyboard Mouse Video
    (KVM) switch. A rack console is typically 1 U and mounted on movable rails with
    an integrated trackball (rather than mouse), keyboard, and display. KVM switches
    use standard connectors for the server and console cables, and some KVM use adapters
    and proprietary connectors on the KVM end.


    You can convert pedestals to rack-mounted servers. The following is a typical
    installation sequence for a sliding-rails rack:


    +   1. Unpack the server and its components, such as server rails and cables.

    2. Affix the server rails to the 19" Some rails require screws, and some are screwless
    (spring loaded). A rack with square hole brackets may require special fasteners
    (nuts) with clips to affix to the rack bracket.


