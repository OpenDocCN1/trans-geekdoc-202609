  md: '# Deterministic Models of Performance


    Scanning performance needs to be modeled with a set of deterministic equations
    for time estimation.


    Suppose there are N scans to be performed, each scan takes t(i) time, and there
    are associated overheads h(j). In these models h(j) are assumed constant, but
    in reality they vary with factors as network utilization, memory utilization,
    process thrashing, and other factors. These other factors need to be managed and
    throttled in production implementations.


    # Serial Scan


    In the prototype, the performance of Unix/Linux Bash shell scripts and Python
    serial scans is virtually identical.


    ```

    T(s) = sum(t(i)) from i=1..N + N*h(s) +h(r)

    ```


    h(s) is per scan overhead and h(r) is final reporting overhead.


    # Parallel (Threaded) Scan


    This models the threaded scan code shown in Thread.py.


    ```

    T(p) = max(t(i)) from i=1..N + N*h(p) +h(r)

    ```


    h(p) is per threaded scan overhead. Note how the serial equation is Order(N),
    scaling with the number of scans; and the parallel equation is Order(l), or constant
    time depending only upon the longest task (in theory, assuming unlimited threads).
    The “Performance Benchmarks” subsection covers the thrashing effects of threading.


    # Distributed Serial Scan


    This models the botnet implemented with Server.py and Master.py.


    ```

    T(ds) = max(sum(t(i)) from i=k*m+1..(k+1)*m + m*h(s)) from i= L..N + (N/m)*h(d)
    +h(r)

    ```


    where m is the number of scans per batch bot, k is the scan batch size, and h(d)
    is per batch overhead—for example, distributed messaging, application code, input/output
    (IO), and operating system. The equation is proportional to Order(N/m).


    # Distributed Parallel (Threaded) Scan


    This is a theoretical botnet we have not implemented, but may represent one of
    the best architectural choices by moving the threading to the bots and using master
    code that throttles and manages failures.


    ```

    T(dp) = max(t(i)+m*h(p)) + (N/m)*h(d) +h(r)

    ```'
