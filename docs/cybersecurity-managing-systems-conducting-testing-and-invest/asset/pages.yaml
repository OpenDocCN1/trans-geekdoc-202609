- pgno: 105
  md: '# Installing Applications and Archiving


    Application installation procedures are dependent on the OS type. If an installer
    GUI is available, onscreen instructions provide the procedures for most applications.
    Before installation, it might be necessary to unpack an archived folder; common
    archive procedures are covered in this section.


    # Windows


    Archiving tools are built into Windows OS, and you can access them using the context
    menu.


    +   1. Right-click and choose Send To -> Compressed Folder to compress to .zip
    format.

    2. To unpack a zipped file, double-click to open it, press Ctrl+A to select all,
    and then navigate to the desired folder and press Ctrl+V to paste the files in
    the new location.

    nBefore you install an application, check to see if an older version is already
    installed and uninstall it.

    1. First look in Start -> All Programs under the developer name (for example,
    Apple or Microsoft) to see if there is an uninstaller script.

    2. With the Control Panel set to Windows Classic View, select Start -> Control
    Panel Add/Remove Programs.

    3. Find the program in the list and double-click it; then click the Uninstall
    button. Follow the onscreen instructions to uninstall the program.


    Download the application from a legitimate source or insert the install disk.

    1. If the disk autoplays then select Start -> Computer and double-click the disk.

    2. Search the disk for a Setup.exe script or equivalent. Double-click Setup.exe
    or another installer script and follow the onscreen instructions to complete the
    installation. In general, choose the default installation settings.


    Microsoft Office, Core Impact, and applications from many other vendors require
    activation after installation, similar to the procedure for activating Windows.
    Use the provided license key when challenged for the activation codes.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Chapter 4 Network Administration for Security Professionals 81


    # Linux


    Applications are often downloaded in archive formats. Some common archive formats
    include tar file (*.tar), tar ball (*.tar.gz), and zip file (*.zip). The unpack
    pack command lines for these formats are as follows:


    ```

    File List: # ls -hal

    Tar File: # tar -xvf tarfile.tar

    Tar Ball: # tar -xvzf tarball.gz

    Zip File: # unzip zipfile.zip

    ```


    The command-line options include -x for extract, -f for file, -v for verbose mode,
    and -z to allow gzip/unzip transparently. To compress, use the -c or -cz followed
    by a list of files, for example the wildcard *.


    Manual installation of Linux applications can depend on the Linux family. For
    Debian Linux variants (such as Ubuntu), use the Debian package manager command,
    dpkg, to install .deb binaries. For Red Hat variants use the Red Package manager
    command, rpm, to install .rpm binaries. Download the installer file from a legitimate
    source and the command line to install, as shown in the following examples:


    +   - Debian: # dpkg application.deb

    - Red Hat: # rpm application.rpm


    If an automatic install tool is available it''s preferable to use it rather than
    performing manual installation. For example, on Ubuntu use the apt-get command,
    and on Red Hat variants use Yum Extender. The apt-get command and Yum automatically
    manage the installation of older versions and reinstallation of applications.


    Consult the manual pages (the man command) to discover the options for commands
    on your specific Linux/Unix distribution. You can also perform keyword searches
    of the pages using the apropos command.


    Some applications require the development of unique installation procedures. You
    can package these as scripts to avoid reinvention. For example, the commercial
    testing tool, Canvas, has an installer script inside its tar ball, which means
    that you must unpack the archive and extract the installer script in order to
    run the installer (on the packed archive). It is enough of a process to warrant
    a reusable script. The resulting custom installer script includes the following:


    ```

    #!/bin/bash

    cd /opt/immunityinc

    rm -rf CANVAS*

    mv /root/CANVAS*

    tar -xvf CANVAS*

    mv /opt/immunityinc/CANVAS*.tar.gz /tmp/CANVAS.tar.gz

    cd /opt/immunityinc/CANVAS*/installCANVAS

    ./install.sh

    ```'
  merge: -1
  img_proc: true
