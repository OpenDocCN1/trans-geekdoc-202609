- pgno: 179
  md: '# Part II * Cyber Network Security Hands-On


    > NOTE A more thorough listing of programs includes a search of all attached disks
    for all executables and batch files. On Linux, use


    ```

    # ls -aRF / grep \* | sort | uniq.

    ```


    Manually scan the package, services, and processes for policy compliance. For
    example, are the updated versions of applications listed? Are there unauthorized
    software programs, such as computer games? Are there unnecessary services such
    as FTP and Telnet? Are potentially dangerous security testing tools, such as Metasploit,
    Nmap, Netcat (nc or n.exe), or others?


    The configuration of security-related settings and policies is a revealing source
    of vulnerabilities. Security benchmarks are best practices for hardening the settings
    and policies of systems and applications—for example, from the Center for Internet
    Security at www.cisecurity.org. Benchmarks are used by developers and network
    administrators to establish secure configuration baselines. Security recommend
    benchmarks as part of the mitigation of discovered vulnerabilities.


    Security controls are sets of general requirements for secure configurations.
    Unlike benchmarks, controls are not specific to individual OSes and applications.
    The authoritative set of IT security controls is NIST 800-53, a policy document
    applicable to all U.S. government systems and available for application to any
    system by the general public.


    NIST 800-53 lists about 700 control requirements. Not every control is applicable
    to every system. To use NIST 800-53, the controls must be profiled—that is, an
    applicable subset of the requirements is selected.


    For example, the Committee on National Security Systems (CNSS) has profiled NIST
    800-53 for defense applications. Its Security Categorization and Control Selection
    for National Security Systems (CNSSI 1253) contains a list of all NIST 800-53
    controls and profiles of these controls for various classes of defense applications.


    The result is that even after profiling, there are still odd NIST 800-53 requirements
    to satisfy. For system testing, manual assessment of hundreds of NIST controls
    is not feasible. To turn around results within a reasonable time and amount of
    effort, automation is required.


    > NOTE At the time of writing, there is tremendous upheaval in the security policy
    world as shops begin to mandate NIST controls; however, because automation is
    not mature, full policy implementation will have to wait for automation to catch
    up.


    Popular U.S. government policy scanners include the following:


    +   - Defense Information Systems Agency (DISA) System Readiness Review (SRR)
    tools


    +   - Office of Naval Intelligence''s WASSP (Windows) and SECSCAN (Solaris)'
