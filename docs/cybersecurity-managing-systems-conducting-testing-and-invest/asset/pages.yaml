- pgno: 266
  md: '# Large Enterprise Cybersecurity: Data Centers and Clouds


    Large enterprises differ dramatically from small businesses, primarily in complexity
    and the pace of change. Large numbers of computing devices and large numbers of
    people interacting, both internally and externally, mean that there are constant
    changes, such as people joining and leaving, devices being continuously added,
    replaced, updated, and failing. Secure transactions and data sets can have number
    in the millions.


    Some of security principles for large enterprises are the same as they are for
    smaller organizations, but the scale and complexity, the heightened exposure,
    both inside and outside, result in security needs that are much more formalized
    and automated. For example, an announcement of new vulnerabilities means that
    large enterprises have very significant new exposures, and must rush to implement
    patches and repairs.


    With the economy of scale of large enterprises, it makes sense to colocate information
    technology (IT) resources in data centers, which offer the highest qualities of
    service, such as reliable power, cooling, automated backup, virtualization, automatic
    provisioning, and automated security services. Private clouds of virtualized computing
    resources are the state-of-the-art solutions for addressing scalability, reliability,
    and enterprise agility. Similarly, public clouds are placing these economies of
    scale within reach of businesses of all sizes. These market changes are changing
    the security landscape.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# Critical Security Controls


    This chapter addresses the most significant security needs of large enterprises
    in the form of critical security controls. Afterward, I discuss some of the unique
    considerations for cloud-based security solutions.


    Security controls are available as catalogs of requirements that articulate security
    needs. For the purpose of discussion in this chapter, the word "control" will
    be used as a synonym of "formal requirement". NIST has compiled an exhaustive
    list of controls in Special Publication 800-53. Revision 3 lists 205 primary controls,
    many of which are quite detailed and have optional paragraphs. With so many controls
    and optional requirements, where does one begin to address the most important
    security needs of large enterprises?


    Fortunately, experts from government and industry formed a consensus on the top
    20 Critical Security Controls (Center for Strategic and International Studies
    [CSIS], 2012). This group included experts from top cybersecurity organizations,
    with commercial pen testing firms. Other members of the group include


    +   * SANS Institute

    * National Security Agency

    * U.S. Cyber Command

    * McAfee

    * U.S. Department of Defense

    * Lockheed Martin


    One of the most valuable aspects is that these controls are based upon the actual
    threats experienced by large enterprises. Organizations such as the U.S. State
    Department and Idaho National Laboratories (SCADA R&D) have carefully compared
    these controls with actual security incidents and have validated the controls''
    effectiveness. The 20 Critical Security Controls are the following:


    +   1. Inventory of Authorized and Unauthorized Devices

    2. Inventory of Authorized and Unauthorized Software

    3. Secure Configurations for Hardware and Software on Mobile Devices, Laptops,
    Workstations, and Servers

    4. Continuous Vulnerability Assessment and Remediation

    5. Malware Defenses

    6. Application Software Security

    7. Wireless Device Control

    8. Data Recovery Capability'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# Chapter 12 Large Enterprise Cybersecurity: Data Centers and Clouds 243


    +   9. Security Skills Assessment and Appropriate Training to Fill Gaps

    10. Secure Configurations for Network Devices, such as Firewalls, Routers, and
    Switches

    11. Limitation and Control of Network Ports, Protocols, and Services

    12. Controlled Use of Administrative Privileges

    13. Boundary Defense

    14. Maintenance, Monitoring, and Analysis of Audit Logs

    15. Controlled Access Based on the Need to Know

    16. Account Monitoring and Control

    17. Data Loss Prevention

    18. Incident Response and Management

    19. Secure Network Engineering

    20. Penetration Tests and Red Team Exercises


    The next section introduces the critical-antipattern catalog of security threats.
    You will see how each threat works and then consider how the security controls
    can mitigate the risk and reduce the vulnerability. A discussion of the security
    solutions focuses on the quick hits, but for a thorough understanding of each
    control, consult the original source document at www.sans.org/critical-security-controls/
    (CSIS, 2012). The quick hits are a section of the antipattern catalog used in
    this chapter. Quick hits are easy remedies that can be rapidly implemented.


    # Scanning Enterprise IP Address Range (Critical Control 1)


    Most large enterprises have blocks of Internet Protocol (IP) addresses where their
    machines reside on the Internet. This is public information shared by the Internet
    registration authorities. Attackers are known to continually scan these address
    ranges anticipating that new systems will eventually come online.


    It’s possible that a new system suddenly appearing is not patched hardened. It
    might not have malware defenses. For example, the new system could be a laptop
    or PC that is rarely used, with seriously out-of-date defenses. That is then attacked
    with malware, and if the attack is successful, the attacker has gained a foothold
    inside the enterprise’s infrastructure. This happens often enough to make this
    attack strategy serious to large enterprises. To find out what happens next, see
    the “Pivot from DMZ to Internal Systems (Critical Controls 13 & 19)” mini-antipattern
    later in this chapter. This attack can also occur on internal networks from compromised
    machines; see the “Internal Pivot from Compromised Machines (Critical Controls
    2 & 10).”'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# Quick Hits and Solutions


    Network management is a technology for automating the inventory control of networked
    devices. Asset management tools can scan networks and build an automated inventory.
    One of the shortcomings is that the lists of IPs discovered are surprisingly lengthy,
    and it is difficult in practice to determine the mapping from the network addresses
    to the physical devices. Assets should be identified in an enterprise Configuration
    Management Database (CMDB), which is integrated with the Network Operating Centers
    (NOC) trouble-ticketing and incident-handling tools.


    You should use asset management to monitor for new systems or rarely used systems,
    and generate security alerts upon discovery. According to Critical Control 1,
    there are a number of ways to discover and register network assets:


    +   - Active scanning of IP address ranges

    - Passive sensing of network activities and IP or Media Access Control (MAC) addresses

    - Monitoring logs of Dynamic Host Configuration Protocol (DHCP) events

    - Performing asset tracking and registration as part of acquisition procedure


    In large enterprises, new systems should be de-malware protected and patched before
    going into Internet demilitarized zones (DMZ) or onto production networks.


    # Related Antipatterns


    See “Unpatched Applications” in Chapter 2 and “Unpatched Applications in Large
    Enterprises (Critical Controls 2 & 4)” in this chapter.


    # Relevant NIST Controls


    For more information, consult NIST Special Publication 800-53 for detailed requirements
    including the following controls: CM-8, PM-5, PM-6.


    # Drive-By Malware (Critical Controls 2 & 3)


    The tactical objective of online attackers is to get your systems to run their
    malicious programs. As Internet browsers roam online, they continually run Flash,
    JavaScript, Java, and other online programs. Attackers exploit this behavior through
    drive-by-malware. Attackers can set up a website and draw (or hope to draw) you
    to it; as soon as your browser arrives, the attack can be launched. Their malicious
    code running in your browser has privileges to access data from other open pages.
    Spyware programs routinely exploit this vulnerability to exfiltrate data.'
