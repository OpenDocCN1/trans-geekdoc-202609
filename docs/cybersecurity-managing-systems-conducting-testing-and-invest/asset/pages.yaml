  md: '# Part III Cyber Network Application Domains


    It is quite useful to have the decision calculus structured in this manner. The
    attribution values could be generated by automated tools, validated by human analysts,
    and plugged into such a table for policymaker decision-support. On the other hand,
    the cold calculus of war should not be an easy decision as the potential for mistakenly
    creating new enemies and other consequences should be carefully balanced.


    Based on timing constraints, attribution estimates will probably be made automatically.
    In the following quote, former Federal executive McConnell (2010) describes the
    requirement:


    > We need to develop an early-warning system to monitor cyberspace, identify intrusions,
    and locates the source of attacks with a trail of evidence that can support diplomatic,
    military and legal options - and we must be able to do this in milliseconds. (McConnell,
    2010)


    The implications of a cyber deterrence strategy must be considered in terms of
    an architectural reference model.


    # Reference Model


    This chapter presents an architectural design perspective for cyber deterrence,
    implying that the scope of the solution will be outlined as well as some of the
    key requirements and design concepts without over-constraining the engineering
    of a future implementation.


    To define scope, you can envision a cyber deterrence architecture with the required
    capabilities in Figure 14-4. A key requirement is that this architecture must
    provide a range of response options (Kugler, 2009).


    | Surveillance | | Penetration |

    |---|---|---|---|

    | Honeets | Forensics | Reconnaissance | Scanning |

    | Attribution | Monitoring | Vulnerability Analysis | Exploitation |

    | Data Fusion | Metamodel | Parallel Scanning | Botnet Installation |

    | Adapters | Knowledge Sources | DDOS | Botnet Operations |

    | Integration | | Advanced |


    **Figure 14-4:** Cyber deterrence reference architecture'
