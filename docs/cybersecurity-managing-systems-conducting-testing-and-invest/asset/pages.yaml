    # Python Programming: Accelerated Network Scanning


    In this section I provide a brief introduction to Python, an interpreted scripting
    language, which you use to accelerate network scanning. Python is a lower level
    language than bash or Windows scripting, meaning that you can do much more fine
    grain operations and data structures. Time overhead for executing statements in
    Python is improved, and the code has the advantage of portability; it can run
    easily on Windows and Linux.


    You will encounter a few classes or programming languages. You have seen the command-line
    languages for Windows and Linux. The next class is comprised of interpreter-based
    scripting languages, such as Perl, Ruby, and Python. The third class is comprised
    of systems programming languages as Java and C++.


    > NOTE Scripting languages can be compiled for speed and are not always used with
    a command-line interpreter.


    Those that defy easy classification in these terms are JavaScript (Internet browser
    code), Java Server Pages (JSP), Active Server Pages (ASP), and Visual Basic (which
    is built into most Windows desktop applications). JSP and ASP are web-enabled,
    server-side executable versions of Java and Visual Basic (VBScript language).'
