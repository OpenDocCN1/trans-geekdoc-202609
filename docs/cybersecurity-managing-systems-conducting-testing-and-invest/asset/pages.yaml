- pgno: 109
  md: '# 84 II Cyber Network Security Hands-On


    There are two major variations of remote login: desktop login and command-line
    login. Remote desktop login displays the GUI remotely, enabling mouse-driven operations.
    In full-screen mode, the user experience is nearly identical to a local login.
    Command-line login only displays the command shell.


    # Windows


    Select Start ⌥ Accessories and look for a Remote Desktop Connection application.
    (It''s in the System subfolder on some Windows machines.) Invoke this application,
    set the IP address, and click Connect. A login screen displays; log in normally.


    From Linux, you can log in to Windows using the rdesktop command-line option with
    windows as its argument. Both of these remote methods use the Remote Desktop Protocol
    (RDP), port 3389, by default. Another protocol for remote desktop login is Virtual
    Network Computing (VNC) using alternative client software.


    # Linux


    Linux can support remote desktop login using RDP and VNC. Protocols for command-line
    login include the encrypted Secure Shell (SSH) and unencrypted telnet. The SSH
    service is enabled by default on Red Linux variants. BackTrack Ubuntu, SSH is
    set up from the GUI:


    +   1. K ⌥ Services �⌥ Setup SSHD

    2. K ⌥ Services �⌥ Start SSHD


    SSH is also the protocol that enables Secure File Transfer protocol (SFTP) file
    transfers. To use SSH and SFTP services remotely from Linux, use the following-command:


    ```

    # ssh MyUsername@10.10.10.100

    ```


    Then use normal Linux commands to administer the remote system.


    # VMware


    Log in a shared VMware infrastructure for access to VM desktop consoles.


    +   1. For ESXi from a Windows system, use Start ⌥ All Programs �⌥ VMware �⌥ vSphere
    Client.


    +   2. Enter the IP address of ESXi, username, password, and then click Connect.


    +   3. In the navigation, expand the folder labeled with the IP address. Click
    to select a VM and then click the Console tab. If necessary, right-click the VM
    in the navigation and select Power ⌥ Power On.'
  merge: -1
