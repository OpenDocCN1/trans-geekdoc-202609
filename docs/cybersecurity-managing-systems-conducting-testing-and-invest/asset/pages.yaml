- pgno: 302
  md: '# Cyber Warfare:

    An Architecture for Deterrence


    **NOTE** You can also find the content of this chapter at the SANS Institute InfoSec
    Reading Room as the "Solution Architecture for Cyber Deterrence" paper (http://www.sans.org/reading-room/whitepapers/legal/solution-architecture-cyber-deterrence-333348).


    For a government cyber deterrence strategy to be effective, it must have network
    penetration tools as well as tools for distributed denial of service (DDoS), parallel
    scanning, reconnaissance, surveillance, and other capabilities. Most importantly,
    it must be able to assess cyber-attack attribution rapidly and with certainty.
    This chapter furthers the definition of cyber-deterrence architectures and evaluates
    elements of future architectures in a penetration testing environment.


    I leverage available policy research to conduct a line-of-sight analysis from
    strategic goals to pen testing source code, filling in important architectural
    gaps. I also discuss policy implications of the proposed technical solutions.
    Lastly, I assess cyber-deterrence capabilities at strategic and technical levels,
    envision technologies that provide components of the solution, and document the
    results as conceptual architecture with research prototypes.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# Introduction to Cyber Deterrence


    The mission of cyber deterrence is been enough to prevent an enemy from conducting
    future attacks by changing their minds, attacking their technology, or by more
    palpable means. This definition is derived from influential policy papers including
    those written by Libicki (2009), Beidman (2009), Alexander (2007), and Kugler
    (2009). The goal of cyber deterrence is to deny "freedom of action in cyberspace"
    (Alexander, 2007). In response to a cyber attack, retaliation is possible, but
    it is not limited to the cyber domain. For example, in the late 1990s the Russian
    government declared that it could respond to a cyber attack with any of its strategic
    weapons, including nuclear weapons (Libicki, 2009). McAfee estimates that about
    120 countries are using the Internet for state-sponsored information operations,
    primarily espionage (McAfee, 2009).


    > NOTE The definition of deterrence has been enough to encompass the variety of
    primary policy sources. For example, "palpable means" may include confiscation,
    incarceration, casualty, or destruction.


    # Cyber Warfare


    Perhaps the most famous international cyber war started April 27, 2007, when Estonia
    was hit by a three-week, nationwide cyber attack (Beidleman, 2009). In the preceding
    years, Estonia sponsored national initiatives to become the world''s most high-tech
    society and had become deeply dependent on the Internet. Almost all government
    services were delivered electronically and cash purchases at retail points-of-sale
    had been replaced with Internet transactions. When the country was bombarded with
    distributed denial of service (DDOS) attacks like ping floods, the economy was
    virtually shut down for weeks. These attacks are believed to be related to a political
    incident involving the relocation of a statue of Lenin. Several years later only
    one man has been convicted and there is no credible evidence of Russian government
    involvement.


    Similarly, a cyber war waged against Georgia during a real-world military conflict
    in August 2008 shut down most of the country''s communications systems (Beidleman,
    2009). This example is more typical of strategic uses of cyber war. An in-depth
    study of the People''s Republic of China''s cyber doctrine found that their primary
    use of cyber warfare is the temporary disruption of systems and communications
    to delay military retaliation (Krekel, Bakos, & Barnett, 2009). For example, China
    to launch its long-anticipated invasion of Taiwan, focused cyber attacks on key
    United States military nodes would likely be to delay U.S. military response (according
    to Krekel et. al., 2009), until after the conquest becomes a fact accompli.


    What is happening "in the wild" on the Internet today is largely uncontrolled
    and deeply intrusive, but does it rise to the level of war? "Cold" war, certain,'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# Chapter 14 - Cyber Warfare: An Architecture for Deterrence


    but rarely is it "hot", except in cases such as Estonia and Georgia. In this chapter
    I make a clear distinction between cyber crime and cyber war that echoes the distinction
    between peace-time rules of engagement and war-time rules of engagement. To this
    end, cyber war engages the active-duty military of a nation state in the aggressive
    defense of its territory, citizens and resources. In contrast, cyber crime is
    believed to be conducted by private organizations seeking profit. In some nations,
    such as Russia and China, the distinction between government and nongovernment
    entities is less clear; nongovernment entities (for example, private hackers and
    criminal enterprises) can and will get involved in cyber warfare activities, especially
    during a major conflict.


    # Comprehensive National Cybersecurity Initiative


    The U.S. has recently released a summary of its national cyber strategy: the Comprehensive
    National Cybersecurity Initiative (CNCI) (Executive Office of the President, 2010).
    The CNCI includes 14 diverse initiatives, such as defense of government networks,
    research and development (R&D) coordination, and situational awareness with connections
    between cyber operations centers. One of the initiatives addresses cyber deterrence:


    +   Initiative #10. Define and develop deterrence strategies and programs. Our
    Nation''s senior policymakers must think through the long-range strategic options
    available to the United States in a world that depends on assuring the use of
    cyberspace. To date, the U.S. Government has been implementing traditional approaches
    to the cybersecurity problem—and these measures have not achieved the level of
    security needed. This Initiative is aimed at building an approach to cyber defense
    that detects interference and attack in cyberspace by improving warning capabilities,
    articulating roles for private sector and international partners, and developing
    appropriate responses by both state and non-state actors (Executive Office of
    the President, 2010).


    News coverage of the release of this CNCI summary document revealed that cyber
    deterrence is still in the very early planning stages. A former U.S. official
    stated that work on cyber deterrence and computer network attacks is incomplete
    because decision-making criteria have not been developed. A cyber deterrence decision
    calculus that might fill this role is discussed in the "Cyber Deterrence Strategy."


    Acquisition of military cyber warfare capabilities is escalating and increasingly
    powerful. For example, as openly declared in their press, the People''s Republic
    of China organizes forces of cyber warriors that "have an all-conquering offensive
    technology" (Alexander, 2007).


    The U.S. is actively establishing cyber commands with defensive and offensive
    cyber missions in anticipation of a joint-services cyber force: the U.S. Cyber
    Command. Recently the U.S. government declared operational three'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# Part III # Cyber Network Application Domains


    component cyber forces: the Marine Force Cyber Command, the 24th Air Force, and
    the Navy''s U.S. Fleet Cyber Command/U.S. 10th Fleet. According to the public
    FY2010 budget justification, the Department of Defense (DoD) is spending $30 million
    per year on cyber warfare R&D, the immense strategic importance of cyberspace
    for social stability and the world economy should merit a budget allocation orders-of-magnitude
    greater.


    > NOTE The United States is used here as a representative of nations defending
    against cyber attack for many reasons: my perspective, abundant open source information,
    and U. national security goals that represent the world''s interests (see Figure
    14-1).


    Military doctrine (Doc, 2006b) defines three major areas of Computer Network Operations
    (CNO): computer network defense (CND), computer network attack (CNA), and computer
    network exploitation (CNE). It is expected that the majority of information technology
    (IT) security investment will be earmarked for improving and maintaining network
    defenses. However, as the CNCI indicates, CND efforts to date are grossly inadequate.
    Even the most advanced high-tech organizations are frequently penetrated and exploited
    by Advanced Persistent Threats (APT) (Rafferty, 2010). Strong CNA and CNE capabilities
    must be developed as key elements of a comprehensive defense posture that includes
    deterrence.


    The elements of cyber deterrence should be explored, and important strategic considerations
    taken into account, including legal frameworks authorizing CNA and CNE for defensive
    operations. If defensive cyber attacks are conducted, could they be legalized?
    How could it be conducted in an effective and efficient manner?


    # Methodology and Assumptions


    Network penetration technologies and military botnets are tools for connecting
    them, but technical research cannot have effect without connecting them to legal
    and international realities. How could you operate a military botnet or use your
    pen testing skills to fight cyber enemies lawfully? Certain elements are assumed
    immutable, including National Security Goals (NSG), strategic functions, and technical
    functions (see Figure 14-1). The NSGs are taken directly from a standard military
    textbook (Karger, 2006); the strategic functions are based on a paper by RAND
    policy expert (Libicki, 2009), and the technical functions are based on course
    material from the SANS Institute, real-world pen testing experience, and hands-on
    work with other toolkits such as BackTrack.


    The variable elements in Figure 14-1 are presented in sections later in the chapter.
    Solution Architecture for Cyber Deterrence is scoped in the following section.
    Elements of it are detailed in subsequent sections. In order to legally do what
    needs to be done technically, I make some suggestions for enabling treaties and
    legislation.'
