    # Collecting User Identities with Enumeration and Hash Grabbing


    Obtaining user credentials for access to systems plays a very significant role
    in pen testing. After one user credential is obtained, it is very likely to grant
    access to multiple systems and application accounts. Legitimate login credentials
    seldom trigger alerts. You can leverage user credentials to gather more data,'
