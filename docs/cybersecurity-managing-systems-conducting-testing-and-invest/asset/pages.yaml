    # Managing User Administration


    User administration includes creating and deleting accounts and their attributes
    such as passwords, administrative privileges, and group membership.


    # Windows


    User administration is most easily done through the Windows GUI.


    +   - On newer Windows systems, double-click User Accounts in the Control Panel.

    - On Windows Server, access the management console (right-click and select Manage
    on My Appliance), click Local Users and Groups, and then double-click Users.


    At this point, as an administrative user, you can manage user accounts: create
    accounts, delete accounts, set up group membership, assign administrative privileges,
    change account names, and change passwords.


    Security testers want to know the command-line equivalents for operations because
    remote access to a compromised machine is most likely to be at the command line.
    Table 4-1 shows some command-line examples for user management.


    Table 4-1: Windows Command-Line Options for User Management


    | WINDOWS COMMAND | COMMENT |

    |---|---|

    | C:\Users> net user | User list |

    | C:\Users> net user MyNewAccount pazzword /add | Create account |

    | C:\Users> net localgroup | Group list |

    | C:\Users> net localgroup Administrators | Users in group |

    | C:\Users> net localgroup Guest MyNewAccount | Add user to group |

    | C:\Users> net user MyNewAccount/del | Delete user |'
