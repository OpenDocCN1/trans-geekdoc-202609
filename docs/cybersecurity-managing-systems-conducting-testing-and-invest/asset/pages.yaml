  md: '# Chapter 7 = Reconnaissance, Vulnerability Assessment, and Cyber Testing 155


    > NOTE Versions of these scans are available to the general public in commercial
    products, such as Retina and AppDetective.


    All of these tools work similarly. The tool is loaded on the target machine and
    run with an administrative account. SECSCN, WASSP, and DISA SRRs for OSes are
    really that simple. SRRs for databases also require a database administrative
    account. The results are generated as a set of reports, with findings categorized
    by level of severity, such as Category I for the most severe vulnerabilities.

    in general, all Category I findings should be mitigated. A Plan of Actions and
    Milestones (POAM) is created by the test client as their mitigation approach and
    schedule. The POAM is a key input for the accredor''s decision to accept repairable
    vulnerabilities for a fixed timeframe.


    > NOTE Mitigated fixed or repaired. Remediated is a synonym of mitigated.


    In releasing their automated policy tools, DISA also specifies a set of requirements
    for manual verification, called the Security Technical Implementation Guides (STIG).
    STIGs are the non-automated portions of the DISA benchmarks; however, automated
    assessment of STIGs is available in commercial policy scanners.

    Some state-of-the-art commercial policy scanners include Eye’ye Retina and Application
    Security Inc.’s AppDetective. Retina is a popular policy scanner for OSes, and
    AppDetective is its counterpart for databases. In these tools, for the DISA profile,
    both SRRs and STIGs are conducted. Scan reporting, explanations, and mitigation
    recommendations are somewhat more useful from the commercial technologies, which
    is why many organizations, including U.S. government agencies, are adopting these
    technologies enterprise-wide.

    These commercial tools have the advantage of testing remotely across a network.
    Using these tools and others, best-practice organizations are running frequent
    automatic policy scans and logging the results. Depending upon the frequency,
    any machine out of policy compliance will be detected promptly for expedited mitigation.


    # Vulnerability Probes and Fingerprinting


    Some vulnerabilities in systems are unknown, whereas others are public and cataloged.
    Unknown vulnerabilities or latent software defects are exploited by zero-day attacks.
    Ordinary defenses will be totally unprepared; however, zero-day attacks can be
    detected and blocked by behavioral anti-malware technologies, such as IDS and
    host-based security (HBS).'
