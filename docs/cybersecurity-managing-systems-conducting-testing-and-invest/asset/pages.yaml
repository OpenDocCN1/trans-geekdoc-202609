    Common network devices are modems, firewalls, routers, and switches.\ems connect
    an internal network to telecommunications networks, such as

    Digital Subscriber Line (DSL), T1, E1, T2, and E2 telecommunications provider

    services.


    Firewalls are network boundary devices enforcing rules for separation between

    internal and external network communications.


    Routers interconnect network segments by routing and switching data using

    Internet Protocol (IP) addresses. Routers also translate IP

    addresses and Media Access Control (MAC) addresses within network segments.

    Each interface card (NIC) has a unique hardware (MAC) address.


    For Ethernet, a network segment is considered a broadcast (one sends and

    all receive) between computers, which NICs operate according to the

    Carrier Sense Multiple Access/Collision Detection (CSMA/CD) algorithm.


    The terms network segment, subnet, and LAN are used interchangeably.

    The terms used in this book are consistent with cybersecurity industry prac-

    tices. Similarly, the terms computer, machine, server, host, and box can be used

    interchangeably. You need to know this to communicate with other industry

    professionals.


    Network switches are repeat devices that extend network segments by

    mirror all broadcast signals to additional cable connections.'
