  md: '# Part II Cyber Network Security Hands-On


    Figure 9-1 shows the major tools applied at each step in the method. This example
    largely uses open source and freep tools; these are also tools of choice for professional
    investigators. These tools are available from the following sources:


    +   - Snort is available from www.snort.org/start/download.

    - Excel and EVENTVWR are available commercially from Microsoft.

    - Most of the other tools are available from either the Pen Testing Framework
    or on a BackTrack Linux release.


    ![](img/58b756e5b149184e369c845a987fc3a2_217_0.png)


    # Observation


    Observation tools include IDS and sniffers. Snort is a state-of-the-art IDS with
    extensive rulesets. The tcpdump tool is a network sniffer. These tools complement
    each other: Snort can analyze tcpdump packet captures after the fact to generate
    alerts. In this way, the Snort alerts and tcpdump packets will be synchronized
    in time, and you can go back and forth between the two by matching timestamps.


    # Hypothesis


    The hypothesis phase starts with Gawk or Excel analysis of the IDS alerts. Gawk
    is a powerful text processing utility for the Unix/Linux command line. It is the
    GNU version of Unix Awk, which supports additional features and runs cross platform.
    Gawk enables you to search, filter, slice, and format large text'
  merge: -1
