  md: 'the record separator (RS) to blank line. Then, `print $1` outputs only the
    first

    field of each record, in this case the first record line.


    You reuse headcap to get a grand total number of alerts:


    ```

    # ./headcap | wc

    ```


    The wc command is word count, and the first number it outputs is the number

    of lines, or in this case the number of alerts (plus minus 1).


    # The statcap Script


    To create a histogram, count the frequency of each type of event.

    The statcap script performs this task and sorts the result, so that the most numer-

    nous events are listed first. You can determine the most numerous alerts

    with the statcap script:


    ```

    #!/bin/bash

    gawk ''BEGIN {FS="\\n\\n";RS="\\n\\n"} {print $1} alert | gawk ''/\\*\\*\\*\/''
    | sort | uniq -c | sort -rn''

    ```


    To use the statcap script, execute the command # ./statcap.

    The statcap script reuses the multiline log analysis pattern with GS and RS.

    The statcap script extracts the first line of each alert with `print $1`, and

    second gawk eliminates all spurious (nonalert header) lines. Shorter header lines

    always start and end with the string `[*]`. You must backslash (\ to escape all

    t characters because these are gawk metacharacters, which have special

    meanings in gawk scripts. Only lines containing the pattern `/\\*\\*\\*/` are

    matched and passed to output.


    What follows is a very useful sequence of commands that you often type

    direct on the command line: sort | uniq -c | sort -rn, which counts the

    umber of repeat occurrences and ranks them in order. The first sort groups

    duplicate lines together. Then uniq -c counts the number of duplicates and then

    eliminates them, prepending the count in text. sort -rn command orders

    t lines numerically by count (-n option) and then reverses the sort order (-r

    option) to give us highest frequency first.


    # The hostcap Script


    You determine how many alerts each internal host is generating with the

    hostcap script:


    ```

    #!/bin/bash

    alert | gawk ''{FS="\\n";RS="\\n"} /TCP/; print $3}'' | gawk ''{print

    $2\}'' | gawk -F\: ''{print $1\}'' | gawk ''/[0-9\\.].*/'' | sort | uniq -c

    sort -rn

    ```'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# Chapter 9  Cyber Network Defense Using Advanced Log Analysis 203


    To use the hostcap script, execute the command # /hostcap.

    The hostcap script filters for the third line (print $3) of each alert while matching
    lines with the /TCP/ pattern for TCP packets. The next gawk grabs the second field
    on the line (space separated), which is the source IP:port of the packet. The
    next gawk separates the colon (:) as the field separator (-F\); and selects the
    first field (print $3), which is the IP address without port number. The next
    gawk eliminates spurious lines that are not likely IP numbers using a pattern
    for one or more numbers and periods: ''/[0-9.]+/ Finally you see the sort | uniq
    | sort pattern, which counts and ranks the results.


    > NOTE This is an inexact of valid IP number, but it''s sufficient for your purposes
    because very spurious lines were observed in the data sets. A more accurate IPv4
    match might be ''/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/'', but this would still incorrectly
    match examples as 1234.10.10.100. The plus one or more repeats;

    * zero or more repeats.


    Multiple character separators are also permitted. Use the escape backslash \ for
    special characters.


    # The altercap Script


    To investigate suspicious hosts, you can use the alertcap script, which creates
    two output files for a given IP address—one showing the alert headers and the
    other showing the full alert details:


    ```

    #!/bin/bash

    echo $1 > /tmp/impaddr

    IP=$1

    IPpat=''s/\\/\\\\\\\\/g'' /tmp/impaddr''

    gawk ''BEGIN {FS=\"n\n\\n";RS=\"n\n\\n""} $IPpat/ {print \$1} alert \

    summary$IP.txt''

    gawk ''BEGIN {FS=\"n\n\\n";RS=\"n\n\\n""} $IPpat/ {print \$0,\n\n\\n"} alert \

    detail$IP.txt''

    ```


    To use the alertcap script, execute a command such as the following, where the
    IP address indicates the machine you are investigating:


    ```

    # ./alertcap 10.10.100.100

    ```


    The alertcap script saves the command-line parameter to a file and then morphs
    the IP into an escaped form that is useful inside gawk scripts using the sed command.
    The first gawk command matches the IP with the entire record (/IPpat/) and outputs
    only the header line (print $1) to summary$IP.txt. The second gawk command performs
    the same match, but outputs the entire alert record to detail$IP.txt.'
  merge: -1
  img_proc: true
