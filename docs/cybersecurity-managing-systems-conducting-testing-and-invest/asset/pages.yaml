  md: '# About the Author


    Thomas J. Mowbray, PhD, SANS GPEN Gold is the Chief Enterprise Architect of The
    Ohio State University. In addition, he is a


    +   - Zachman Certified Enterprise Architect

    - FEAC Institute Certified Enterprise Architect

    - HIMSS Certified Professional in Healthcare Information Management Systems

    - Former Network Penetration Tester, Cyber Toolsmith & Cyber Lab Manager

    - Founder of the Northrup Grumman / TASC Cyber Warfare Community of Interest

    - SANS Certified Network Penetration Tester (GPEN) with vetted Gold Paper Research


    He has coauthored two books: AntiPatterns: Refactoring Software, Architectures,
    and Projects in Crisis (1998 John Wiley & Sons, ISBN 978-047-1-19713-3) and Software
    Architecti Bootcamp (2003 Prentice Hall, ISBN 978-0-13-14227-9). He is also the
    Associate Editor of the Journal of Enterprise Architecture. You can connect with
    Dr. Mowbray on LinkedIn.'
