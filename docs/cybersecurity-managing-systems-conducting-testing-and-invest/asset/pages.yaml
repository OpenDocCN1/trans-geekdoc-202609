- pgno: 119
  md: '# Part II - Cyber Network Security Hands-On


    # Linux


    Use the fdisk command to format disks. By default, disk device names will be sda,
    sdb, sdc, and so on, and the file system link will be located in /dev. Insert
    a new disk drive in an enclosure and connect the drive via USB to the Linux system.
    The following commands, mostly to prompts in fdisk, create an EXT2 single partition
    spanning the entire disk:


    ```

    # fdisk -l               - locate new disk /dev/sda

    # fdisk /dev/sda      - enter commands to create disk table

    # fdisk: m

    # fdisk: o               - create new partition table in RAM

    # fdisk: n               - new partition creation

    # fdisk: p               - partition choice

    # fdisk: l               - choose first partition (sda)

    # fdisk: <Enter>         - default: 1 cylinder is 1

    # fdisk: <Enter>         - default: Last cylinder

    # fdisk: p               - print partition table

    # fdisk: w               - write table to disk and exit

    # mkfs -V /dev/sda      - format the data partition

    # mkdir /mnt/sda      - create mount directory

    # mount /dev/sda /mnt/sda  - mount disk to test it

    ```


    Always test your work. Create a text file on the new disk partition in /mnt/sda
    directory. Close and reopen the file to verify its integrity.


    This simple formatted disk is suitable for data storage, data transfer, and backup.
    You can use it to expand hard disk capacity, and the only limit is budget for
    new disks. Security testers or your network administrators perform this partitioning
    procedure for almost every test.


    The fdisk command will be one of the major tools discussed in Chapter 5 in which
    you discover how to set up multiple partitions with heterogeneous formats. An
    alternative command for formatting disks is grub.


    # Configuring Firewalls


    Firewall setup is usually delegated to specialists with vendor certifications.
    However, it is useful for you to expose yourself to how firewall configuration
    is performed, which is similar to network switch configuration. From time to time
    network administrators and other security professionals will be called upon to
    verify firewall configurations.


    This example is for configuring a Cisco ASA 5000 series firewall. A Windows host
    is used as the console terminal. Connect directly to the firewall using the Cisco
    console rollover cable if the Windows system has a serial port. Otherwise, use
    a USB to serial patch cable attached to the console cable.'
