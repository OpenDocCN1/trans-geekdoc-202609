    # Test Planning and Reporting


    Except for a few elite security research shops, most security testing is done
    within very limited timeframes, from a few days to an entire month, including
    preparation and reporting. Whenever you''re operating with limited resources,
    it is wise to plan ahead.


    A project is a limited engagement with defined outcomes. In a given IT security
    shop, test projects often repeat similar activities. For example, you may be in
    a shop that performs policy scanning exclusively, or you could be in a specialized
    organization that performs scanning, probing, and pen tests.


    Security testing is part of an overall system development lifecycle. Cybersecurity
    concerns should be an integral part of the development from inception. In early
    phases and during development, an Information Security Systems Engineer (ASSE)
    is the cyber subject matter expert (SME) for the project, making detailed requirements
    and implementation recommendations. Prior to deployment, an Assessment and Authorization
    (A&A) activity occurs, which formerly was called Certification & Accreditation.
    The security assessors perform the testing activities. The assessors make recommendations
    to the executive authorization officer, who accepts the outstanding risks for
    the enterprise. In most organizations, the authorizing officer is the Chief Information
    Security Officer (CISO) or the equivalent. The assessors are part of the CISO''s
    shop. There are many other middle managers involved in both the CISO''s and test
    client''s organizations.


    > NOTE A&A replaced C&A in the NIST 800 series Special Publications.


    The following discussion of test plans, reports, and documentation is based upon
    best practices and NIST 800 series guidance. These concepts are standard procedure
    in many government and commercial shops. Best practices include several important
    planning and reporting documents that should be added to the body of evidence
    (BOE) review:


    +   - Risk Analysis (RA)

    - Test Preparation Checklist ("test prep checklist") or simply "checklist"

    - Functional and Certification Test Plans (CTP)'
