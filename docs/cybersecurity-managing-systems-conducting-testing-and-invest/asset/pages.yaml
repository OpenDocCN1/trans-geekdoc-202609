- pgno: 113
  md: '# Linux


    Many Linux services follow a common convention. There is a configuration file
    in a subdirectory of /etc that stores service settings. Service daemons are either
    known shell commands or the executable invoked from the /etc/init.d directory.


    For example, the Common Unix Printing System (CUPS) is a client-side service that
    manages print jobs. Use apt-get install cups to download, install, and upgrade
    CUPS on Ubuntu. You must modify the following lines in /etc/cups/cupsd.conf as
    shown:


    ```

    system group root

    ...

    <Location /admin>

    Allow from 127.0.0.1

    </Location>

    ```


    This commonplace syntax starts the CUPS service:


    +   # /etc/init.d/cups start


    Finally, access the CUPS service administration from the web browser at http://localhost:631/admin.
    A user account must be set up to log into CUPS. When a printer is found on the
    network and set as default, printing is enabled in multiple Linux applications.


    To fix a common networking problem that returns the SIOCDADRT error on Ubuntu,
    invoke:


    +   # /etc/init.d/networking restart


    Red Hat variants substitute the "service" command. For example, to stop and restart
    the Fedora firewall, use these commands:


    +   # service iptables stop

    # service iptables start


    The service commands vary between services of OS variants. Use netstat with grep
    to check the status of networked services.


    > Ubuntu firewall configuration uses the ufw command, for example, ufw disable,
    to turn it off. For more options use ufw on Ubuntu/BackTrack or do an Internet
    search for "ufw firewall setup."


    # Other OSes


    Keeping DNS services up to date is an important network administration task. The
    default Solaris DNS service maintains two files with paths such as


    ```

    /var/named/var/named/named.10.10.100.1

    /var/named/var/named/named.ourdomain

    ```'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Chapter 4 - Network Administration for Security Professionals 89


    The first file maintains the mapping from IP address to hostname, with entries
    such as


    ```

    NS dnhostname.ourdomain

    1 PTR gatewayhost.ourdomain

    10 PTR targetthost.ourdomain

    ```


    To register a new host, add a line in this same format to the file, and increment
    the serial number:


    ```

    123400800; serial

    ```


    You must also modify the other file; it contains lines such as:


    ```

    NS dnhostname.ourdomain

    Gatewayhost A 10.10.100.1

    Targethost A 10.10.100.10

    ```


    Add a new line in the same format and use the incremented serial number from the
    other file. Finally, the named daemon must be bounced, which means stopped and
    restarted. You accomplish this with a command such as


    ```

    # kill -HUP $ (pgrep named)

    ```


    the pgrep returns the process ID number of the name daemon. The syntax $( executes
    the enclosed command to produce an argument value before the kill command is executed.
    In this case, you use the kill command to convey a signal. the -HUP parameter
    means virtual hang up; it is a signal to the named daemon to read its configuration
    files.


    # Mounting Disks


    Network administration and security testing uses external hard disks extensively
    for building systems, running tools, and storing/moving data. Predominant hard
    disk standards are Integrated Drive Electronics (IDE) and Serial Advanced Technology
    Attachment (SATA).


    Both standards are available in various physical sizes and capacities; the 3.5”
    size is common for laptop internal drives and external use. Disk controllers for
    internal drives use IDE or SATA interfaces directly. External drives use a hard
    disk enclosure with a USB connection.


    # Windows


    Windows supports only two disk formats by default: NTFS and FAT32. Disks automount
    in Windows shortly after you attach the USB. Look in My Computer to see if the
    disk is mounted. Double-click to test it.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# Part II Cyber Network Security Hands-On


    To diagnose, format, and manage disks, open the Disk Management console (right-click
    Computer Manage and then click Disk Management). Disks that are mounted and unmounted
    are displayed along with known disk attributes.


    # Linux


    Linux supports an array of disk formats, including Windows formats. By default,
    Linux disk partitions are EXT2 or EXT3 format. For formats other than these, you
    usually need to specify the format.


    Put the disk in an enclosure (a special used to connect the disk to USB) and connect
    the USB to the Linux machine. This will cause several device events that are logged
    to the /var/log/messages file. You could use the dmesg or tail -f to view this
    file, but the fdisk -l command gives you a more effective summary of attached
    devices. With fdisk you can see all the attached devices and their partitions.
    This does not always work smoothly, and you might need to reattach the USB cable
    until the system recognizes the device.


    You need to make a directory that will be your mount point and perform the mount
    command. The sequence for mounting an EXT2 partition at sdal, and then unmounting
    it is the following:


    ```

    # fdisk -l

    # mkdir /mnt/sdal

    # mount /dev/sdal /sdal

    ...


    #umount /mnt/sdal

    ```


    Alternatively, the df command can be used for mounting and unmounting on Linux.


    To mount Windows disks, add a command-line option to mount for NTFS (-t ntfs-3g)
    and FAT32 (-t vfat). In some cases the -o force option also be needed.


    # VMware


    When using VMware Player or Workstation, attach the USB disk and then use the
    device menu to connect to the disk. The normal mounting procedure for the guest
    OS should follow.


    # Moving Data Between Systems on Networks


    The major techniques for moving files include Windows file sharing and SFTP. Windows
    file sharing can move data between Windows systems as well as Linux and Unix systems.'
