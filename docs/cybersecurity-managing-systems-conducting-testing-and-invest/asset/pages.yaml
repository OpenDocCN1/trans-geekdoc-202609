    # Additional Network Administration Knowledge


    Network administration is an expansive field of expertise. Whenever you are

    working with novel activities or unfamiliar technologies, such as installing and

    managing new OSes, devices, configuration, or services, and transferring data

    with new environments, you must add to your store of knowledge.


    Most challenges can be resolved in less than a day with a systematic approach

    and teamwork. In security testing, the perspective of other people is invaluable

    and inherently creative, especially when you become too close to a problem.


    The Internet is a great resource for network administrators. Your answers

    are most likely out somewhere; however, most answers are intermixed

    with a lot of unetted advice. By trial and error, you discover the truth for

    environment. The truth is what works.


    As you try each suggested option, you gain understanding of the problem

    and terminology. By the third or fourth try, you understand enough to come-

    ner alternatives and develop your own solutions. You learn the wisdom of

    separating good and bad advice. Always document the good. In a sense, this is

    the of this chapter: a quest of never-ending discovery to solve network

    administration challenges.


    This book covers many other additional network administration areas.

    Example, 5 covers using VMs to customize ISO images. Chapter 9

    covers setting up regularly scheduled cron jobs to run scripts and programs

    automatically. Configuring firewalls to block IP addresses is also in Chapter
    9.


    # Summary


    This chapter introduces network administration fundamentals on Windows,

    Linux, SunOS, and Cisco IOS. These basic skills are essential in any cybersecurity-

    rity, but they are also very useful, in general, in any information

    technology (IT) organization. Security professionals who do testing must be

    able to set up their own machines, install their own software, and configure

    for network communications.


    ![](img/58b756e5b149184e369c845a987fc3a2_124_0.png)'
