    his RAND theories under the sponsorship of the U.S. Air Force (USAF) in 2009,
    at the same time the USAF was standing up their own cyber force, the 24th Air
    Force. Given the timing, Libicki''s theories have become very influential and
    representative of the state of the art of cyber defense strategy.


    Figure 14-2 is Libicki''s concept for how to respond to a cyber attack. Note that
    his RAND manuscript, Cyberdeterrence and Cyberwar (2009, ISBN 978-0-8330-4734-2),
    includes hundreds of pages of possible actions and potential reactions, detailing
    strategic tradeoffs in cyber war. In this model, Libicki uses the term rosa to
    indicate that the retaliatory cyber attack is intentionally not publicized. To
    be a deterrent, the original attacker must draw the conclusion that the counter
    attack is connected to the original attack. A key goal of cyber deterrence is
    changing the potential attackers'' mindset, forcing them to reconsider the benefits
    and consequences of conducting an attack. That said, I not cover the diplomatic,
    kinetic military, and public relations approaches in this chapter—only cyber-related
    aspects of deterrence.


    In an interesting case study, the DOD conducted a cyber attack on a Saudi website
    of recruiting and planning insurg warfare in Iraq (Nakashima, 2010). The recruiting
    website was actually sponsored by the Saudi government and another U.S. agency
    to collect information about extremists. DOD action took a task force of major
    U.S. agencies concerned, but not unanimously. The resulting attack “inadvertently
    disrupted more than 300 servers in Saudi Arabia, Germany, and Texas”” (Nakashima,
    2010). Diplomatic consequences included expressions of frustration by Saudi and
    German governments.


    First, as shown in Figure 14-2, there is a situational awareness (or surveillance)
    activity that detects cyber war incidents. Second, the defenders must decide if
    the event is an actual attack, versus some other type of incident such an unrelated
    hardware failure. Third, a causal analysis determines if the motivations for attack
    are consistent with a state actor. Fourth, the defenders must determine the level
    of public awareness of the attack. For example, a greater public awareness, as
    a widespread communications or power failure (as simulated in Cyber Shockwave),
    could make the existence of an explicit response more urgent to policymakers.
    Fifth, state or non-state attribution is assessed. Providing attack attribution
    is one of the most technically and strategically difficult steps in the process,
    and should figure prominently in our solution architecture. Sixth, the strength
    of the case for public attribution is assessed. Seventh, methods of retaliation
    are considered. Note that cyber retaliation is only one of many possible methods.
    For example, diplomatic gestures, law enforcement, economic sanctions, and kinetic
    attacks are other possibilities. It is interesting to contrast Libicki''s prescriptive
    approach to cyber deterrence with the policy-driven approach offered by Kugler,
    who places emphasis on thresholds and control of escalation. Cyber attacks can
    be characterized by severity, and a strategic calculus can be defined based upon
    a ladder of escalation, with escalating severity of responses at each level. Kugler
