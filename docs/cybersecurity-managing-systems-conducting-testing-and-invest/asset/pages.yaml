    # Data Loss via Undetected Exfiltration (Critical Control 17)


    Data continually moves in and out of enterprises on mobile devices and networks.
    Data losses are very commonplace, and they''re especially apparent with new public
    disclosure that compels enterprises to announce the incidents to their customers.
    An enterprise needs to have strong data loss policies, particularly regarding
    mobile devices. Enterprises should be actively seeking information, such as personal
    health information (PHI), and implementing encryption schemes wherever such information
    is found.


    Enterprises also need to monitor data in motion, and actively detect PHI and other
    sensitive information as it moves between systems and out onto the Internet, actively
    intervening if such information is ever transmitted in an unencrypted state.


    # Quick Hits and Solutions


    According to Critical Control 17, Data Loss Prevention, one of the most effective
    ways to protect against data loss is by encrypting the storage on mobile devices:
    laptops, thumb drives, removable discs, and tapes. In addition, sensitive data
    anywhere in the enterprise should be encrypted. This applies to data at rest as
    well as data in motion on networks. More sophisticated capabilities include filtering,
    alerting, and preventing sensitive data from transfer when detected unencrypted
    data on networks, and scanning online storage to find such unencrypted online
    data. Advanced practices include detecting unauthorized encrypted external connections
    and blocking known exfiltration IP addresses and URLs with black lists.


    # Related Antipterns


    Related antipterns appearing in other chapters in this book include the following:


    +   - Data Alteration and Destruction (Critical Controls 15 & 17): In addition
    to data loss, data can be corrupted, perhaps in ways that are not easy to detect.
    These changes could potentially wreak havoc on a business, such as a bank, through
    unauthorized transfers, creation, or erasure of financial assets.'
