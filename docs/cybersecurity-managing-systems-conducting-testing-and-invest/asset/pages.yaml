- pgno: 307
  md: 'Cyber deterrence and related hard problems are solvable with current technologies,
    assuming the following:


    +   - Enating treaties, laws, and policies are enacted to make cyber deterrence
    legal and diplomatically workable (See the "Legal and Treaty Assumptions") section
    later in this chapter.


    NOTE One of the major NSG goals is maintenance of US diplomatic alliances. Actions
    such as cyber retaliation directed at foreign assets could easily lead to diplomatic
    fallout. Future treaties should address these inevitabilities.


    +   - Sufficient a priori knowledge of cyber attackers is collected to rapidly
    assign attribution and plan counter attacks in most instances.


    There is no point in redoing the outstanding work of professional researchers
    in cyber deterrence. To avoid getting bogged down in policy debates, assume the
    results of their work and build on their achievements "Legal and Treaty Assumptions"
    and "Cyber Deterrence Strategy". Many relevant points of their research are summarized
    in other parts of this chapter.


    This chapter follows a systematic approach beginning with a broad survey to define
    requirements and selecting a handful of areas for hands-on experimentation. The
    major steps include


    +   1. Literature Search: Review cyber deterrence papers and compile bibliography.


    +   2. Characterize “the deterrence problem” and the focus/scope.


    +   3. Define solution reference model: Block diagram that reveals the major deterrence
    capabilities and scope of the solution.


    +   4. Select key areas and conduct technical analysis: Cyber deterrence is an
    expansive domain that could require many volumes to cover completely. This chapter
    focuses on one of the most-critical requirements for cyber deterrence: determining
    attack attribution within milliseconds. It also dives into a technology of particular
    interest for penetration testers, parallel and distributed scanning, with source
    code examples and performance benchmarks.


    Over the past two years, many discussions and hands-on pen testing experiences
    have contributed to this chapter. A cyber warfare reading group was established
