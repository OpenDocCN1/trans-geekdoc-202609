- pgno: 176
  md: '# Chapter 7 = Reconnaissance, Vulnerability Assessment, and Cyber Testing 151


    The command nmap -A performs a fully battery of scans. The --reason gives you
    a clearer output explanation, especially when ports are closed or unresponsive.
    The -vvv option requests output that is very-very-very verbose and detailed. The
    -FN option performs the scan even if the host is unresponsive to the initial ping
    packet; by default, nmap would not perform the scan without a ping response. All
    port numbers from 0 through 65536, in the 16-bit port range, are scanned. For
    more options, see Fyodor''s latest man page for nmap at http://nmap.org/book/man.html.


    The nmap -A is a more intense and time-consuming scan, so you focus on a specific
    host (10.10.100.100). In a typical vulnerability assessment, all hosts of interest
    would be scanned in this way; however, if you are to scan a large number of hosts,
    you could select a representative sample of hosts to thoroughly scan.


    A number of factors can prevent your scans from working, giving you erroneous
    false positives or false negatives. If you are scanning servers from a remote
    machine on the Internet, consider what might interfere with your scan. First,
    your own machine should not have a host-based firewall. The test machine should
    be a hardened box, but most security testers operate without firewalls or antivirus
    because they may interfere.


    > A false positive is when you detect something (alarm, service, vulnerability),
    which is not really true. A false negative is when you miss detecting something.
    False negatives are unacceptable and should be minimized. False positives in your
    raw test-results are normal and should be weeded out in your reporting process.


    > Testing without a firewall or antivirus protection is called "hacking naked"
    in the security community. "Hack naked" is the catch phrase of Paul Asadoorian
    of www.pauldot.com.


    Secondly, your own network connections could interfere—for network firewalls and
    intrusion prevention systems. They should be configured to allow test traffic.
    The same comment applies to your Internet Service Provider (ISP), who might have
    network protections that affect your tests. There should be open disclosure to
    the ISP and an agreement that testing through your net-works will be allowed.


    The remote ISP is another possible source of interference. You should contact
    the remote ISP prior to testing to make similar arrangements. This might involve
    reconfiguring firewalls to allow test packets on particular ports. Similarly,
    the target network may have protections that should be disabled or reconfigured
    during testing.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# 152 Part II Cyber Network Security Hands-On


    A number of workarounds to these obstacles exist. An onsite test, where the test
    machine is on the client''s subnet will eliminate most interference. If onsite
    testing is not possible, a network tunnel can be configured to simulate a local
    presence on the client subnet from a remote box. Many organizations already have
    a Virtual Private Network (VPN) tunnel established for remote access. There are
    also open source options—for example, the tunnel command on BackTrack. The VPN
    connections are called out-of-band transmissions, providing logical isolation
    from the network at Layer 2. Because both headers and data are encrypted, VPN
    messages are neither recognizable as packets, nor readily interpreted.


    On some networks, primarily data centers, are hardened to accept packets only
    from known hosts. Determine the trusted addresses by questioning the client''s
    technical staff. In this case, a test machine cannot directly elicit responses
    from target hosts. You can generate target responses by sending spoofed packets—packets
    from the test machine that pretend to be from the IP address of a known, trusted
    host.


    The nmap command has a spoofing option (for example, -S 10.100.100.10). When spoofing,
    nmap uses the usual array of packets, but because the target responses are directed
    at another machine, nmap does not receive any useful data. nmap generates packets
    in a random order (by default), it will be difficult to interpret the results,
    if you could sense the packets.


    A better solution is to use another command to generate packets in a predictive
    way, so that you can more easily interpret the results with a network sniffer,
    as as Wireshark or tcpdump.


    For a target machine 10.100.100.5 and a spoofed source 10.100.100.99, set up a
    sniffer to capture the packets, like this:


    ```

    # tcpdump -w capture.cap host 10.100.100.99 and host 10.100.100.5

    ```


    The sniffer tcpdump senses the packets with traffic only between the target and
    the spoofed machine to the file capture.cap. Next, you see spoofed TCP packets
    with the SYN flag set; if the port is open, the target senses a three-way handshake
    initiation and responds with an ACK packet. You can generate the SYN packets using
    the hping3 command, as follows:


    ```

    # hping3 -S --all -spoof 10.100.100.99 10.100.100.5

    ```


    The hping3 command sends SYN packets (option -s) to all ports (-scan all) from
    the spoof address to the target. Use Ctrl+C to terminate tcpdump. You can analyze
    the packets in Wireshark. On BackTrack, click K Internet Wireshark and then select
    File Open and select the capture.cap file. Look particularly at the responses
    from the target machine; an ACK packet indicates an open port. Chapter 9 explains
    how to filter packets in Wireshark results to zoom in response packets.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# Chapter 7 = Reconnaissance, Vulnerability Assessment, and Cyber Testing 153


    An alternative method of spoofing involves capturing a candidate packet, modifying
    the packet, and sending it back over the network. For spoofing purposes, you can
    obtain IP and MAC addresses on the Windows and Linux command lines with the arp
    -a command. Using tcpdump as previous for network sniffing, Wireshark can analyze
    a capture filepacket.cap—and edit it by launching hexedit from the Linux command
    line. The modified packet can be sent to the network with a Linux command like
    the following:


    ```

    file2cable -i eth0 -f packet.cap

    ```


    > NOTE A Windows version of Hextedit is available at www.hexedit.com.


    # SEED LABS


    The SEED labs for this section are the Packet Sniffing & Spoofing Lab and the
    Linux Virtual Private Network Lab. These are under the Exploration Labs and the
    Design/Implementation Labs categories, respectively. You can access the SEED labs
    at www.cis.syr.edu/wedu/seed/all _labs.html.


    # Policy Scanning


    When policy scanning, you are considered a blue team tester (that is, a friendly)
    and are customarily granted administrative privileges on the test machines. One
    straightforward way to check policies is to determine the installed packages.
    For example, on Debian Linux systems the command


    ```

    # dpkg --list

    ```


    returns a list of installed packages. On Red Hat Linux systems, variants of these
    commands list installed packages:


    ```

    # rpm -qa

    ```


    or


    ```

    # yum list installed

    ```


    The comparable command on Solaris is pkginfo. On Windows, you can list most normally
    installed programs with


    ```

    C:\> dir /s "C:\ Files" > installed.txt

    ```


    Other Windows views can reveal installed packages on the Add/Remove Programs dialog
    box; installed services on the Services management dialog box; and running processes
    with the Task Manager (Ctrl+Alt+Del). On all Linux/Unix systems the process list
    is accessible with the ps aux command.'
