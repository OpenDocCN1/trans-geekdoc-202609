  md: '# # Protocol Analysis and

    Network Programming


    Networking, network administration, and programming are considered the three essential
    prerequisites to becoming a hands-on-cybersecurity professional. In this chapter
    I cover networking and programming which are necessary to know for vulnerability
    assessment (Chapter 7), pen testing (Chapter 8), network defense, and cyber investigations
    (Chapter 9).


    Chapters 4 and 5 cover practical network setup and getting operating systems (OSes)
    and virtual machines (VMs) up and running on the network. This chapter takes a
    close look at major network protocols and deep dives into network programming
    using command-line scripting languages. Surprisingly, you do not need much networking
    theory to empower you to set networks, only the practical aspects of how IPv4
    and IPv6 networks operate.


    As hands-on security professionals, however, you need to know more about protocols
    and how they operate that you can use network analysis tools to inspect traffic.


    Malware is software. In order to analyze it you need to understand programming.
    Security testing and analysis requires repetitive operations, with an ability
    to program command-line scripts (scripting) makes faster and less tedious. Pen
    operate on remote machines at raw-shell command lines; they need to be fluent
    in command-line scripting to create useful tools from scratch.


    After introducing networking theory, I will delve into how security professionals
    interpret network packets covering the major protocols used in practice. Then
    I introduce Linux/Unix Bash shell programming through useful examples, including'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'network scanning and local attacks, and cover the Windows command line, by
    scripting comparable examples of command-line scripts, including remote pass-word
    attacks. Finally, I introduce Python programming and useful techniques for dramatically
    accelerating network performance.


    # ## Networking Theory and Practice


    In theory, networks operate according to the International Standards Organization
    (ISO) Open Systems Interconnect (OSI), also called the 7 Layer model. OSI is a
    separation of functions into layers, so that the complexity of distributed computing
    can be intellectually divided and conquered.


    In OSI, each system has a bidirectional network stack, translating Layer 7 Application
    messages down, layer by layer, to Layer 1 Physical messages on the network. Each
    layer has various protocols that package message data with protocol header information.
    In theory, each network packet would have a message payload and seven protocol
    headers. The seven headers are stripped off by the networking stack of the recipient
    system.


    > NOTE OSI was published in 1984. In the 1990s, the ISO community discovered that
    OSI was incomplete. Very significant architectural issues plagued Layer 7 Applications,
    as frequent network and system failures in any distributed system with numerous
    components (for example, the Internet). Instead, ISO adopted architectural viewpoints
    in the Reference Model of Open Distributed Processing (RM-ODP). RM-ODP is the
    key standard of TINAC; thus architecturally, RM-ODP makes global telephone systems
    interoperable, enabling us to all call the world to foreign countries.


    Due to the predominance of Internet technologies, virtually all networks operate
    with only four network layers and an application layer. These layers are implemented
    by widely used protocols and include the following:


    +   **Physical Layer (Layer 1):** Communicates physical (electro/optical) messages
    across network media (for example, wire or optical fiber). Network hubs are Layer
    1 devices that simply mirror messages to other devices on the same subset.


    +   **Data Link Layer (Layer 2):** Communicates logical messages that use hardware
    media access control (MAC) addresses across a single subset. A Layer 2 message
    is called a frame. Network bridges are Layer 2 devices that connect network segments
    by broadcasting frames and keeping track of MAC addresses.


    +   **Network Layer (Layer 3):** Communicates logical messages using IP addresses
    across multiple network segments.


    +   **Transport Layer (Layer 4):** Communicates messages across logical sessions
    and connections between hosts.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# Frequently Encountered Network Protocols


    The most frequent Layers 1 through 4 protocols you will encounter as a security
    professional include the the following:


    +   - IEEE 802.3 Ethernet protocol

    - IEEE 802.11 wireless protocols (commercially known as Wi-Fi)

    - Address Resolution Protocol (ARP)

    - IP Version 4 (IPv4)

    - IP Version 6 (IPv6)

    - Internet Control Message Protocol (ICMP)

    - User Datagram Protocol (UDP)

    - Transmission Control Protocol (TCP)


    > NOTE IEEE stands for Institute of Electrical and Electronics Engineers. It''s
    an ISO accredited standards organization.


    As in OSI, the higher layer protocols incorporate protocols at all lower layers.
    The IEEE standards define Ethernet and wireless Layer 1 and 2 protocols. Address
    resolution protocol translates IP addresses into MAC addresses, mapping Layer
    3 to Layer 2.

    IPv4 and IPv6 are Layer 3 protocols, which are in the stack of all higher level
    protocols. ICMP is a Layer 3 protocol that conveys IP error messages and ping
    scans, which are possible indicators of suspicious activity.

    UDP is a Layer 4 protocol that—even though it is unreliable—is used for important
    application services, such as domain name service (DNS), IP Television (IPTV),
    and Voice Over IP (VOIP).


    > NOTE Informally, some people call UDP the "useless damn protocol" because it
    provides reliability guarantees.


    TCP is the most important Layer 4 protocol that provides reliable message transport.
    TCP is the basis for most application layer protocols such as SSH, DNS, DHCP,
    HTTP, SSL, SMTP, BGP, and SNMP. The use of Secure Shell (SSH), DNS, and Dynamic
    Host Control Protocol (DHCP) is covered in Chapter 4. The following is an overview
    of the other application layer protocols:


    +   - HTTP (HyperText Transfer Protocol): The universally adopted Wide Web protocol

    - SSL (Secure Socket Layer): The protocol that encrypts HTTP traffic

    - SMTP (Simple Mail Transfer Protocol): The protocol widely used for e-mail'
