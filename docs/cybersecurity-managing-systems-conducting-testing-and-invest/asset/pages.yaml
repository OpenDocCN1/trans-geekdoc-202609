    # Cloud Security


    Cloud computing presents significant challenges for cybersecurity. Cloud applications
    (so-called widgets) are much more than web pages, but they fall short of being
    systems. Typically just a few lines of browser-based JavaScript calling remote
    web services, these widgets can be developed and deployed in a few hours. Widgets
    fall between the cracks of security governance and IT release processes, and proliferate
    across intranets and outsourced clouds supporting today’s enterprises.


    Clouds are massive pools of computing and storage resources. Computing power comprises
    both physical processors and virtualized (or software emulated) machines. In Figure
    12-1, three broad categories of clouds are proposed:


    +   - Computation clouds

    - Data clouds

    - Infrastructure clouds


    Computation clouds harness the power of parallel processing to dramatically compress
    transaction time. For example, Google’s famous Map-Reduce Algorithm enables you
    to perform searches of the entire Internet in a few seconds. The algorithm divides
    and conquers by repeatedly partitioning the search problem and spawning remote
    parallel tasks and then reassembling the results.


    Data clouds provide network attached storage (NAS) and storage area network (SAN)
    services for today’s rapidly expanding storage needs. According to USC’s Martin
    Hilbert, data storage is expanding four times faster than the world economy, and
    processing power is nine times faster.'
  merge: -1
  img_proc: true
