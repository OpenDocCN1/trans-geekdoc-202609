- pgno: 289
  md: '# Special Security Implications


    As your enterprise enters the cloud, data and processing migrate across physical,
    virtual, and organizational boundaries. Security problems arise as architecture
    and assumptions change. Security measures which worked pre-cloud have to be rethought.
    Early cloud security warnings (for example, NIST 800-144) are now observed in
    practice (NIST 2011b).


    Cloud developers are under intense pressure from mission and business stakeholders
    to accelerate deployment. Mission and business innovation relies heavily on IT
    changes. In the frenzy to get IT into the cloud, security is often the last consideration.


    The following sections discuss key security risks and issues experienced by enterprises
    associated with cloud adoption and governance.


    # Consolidation into Clouds Can Magnify Risks


    Cloud computing initiatives expand access to consolidated stores of sensitive
    data and critical services; potentially magnifying the effect of insider threats,
    cyber espionage, and cyber attacks. Clouds replace mature technologies and are
    frequently less secured than systems that are formally tested, released, security
    assessed, and authorized.


    Consolidation increases dependencies on cloud services. If the cloud is attacked
    or data integrity is lost, the effect to the organization is amplified. Consolidated
    data makes cloud solutions more attractive targets for threats.


    As with most new technologies, controls are seldom put in place to limit these
    effects. For example, current widgets generally don''t enforce limits on the volume
    of data extracted, which creates a major vulnerability that insider threats could
    exploit.


    # Clouds Require Stronger Trust Relationships


    Clouds transfer data custody and software control from systems to cloud applications
    (services) and between organizations. There are new trust relationships required
    between the original organization and the cloud organization and their respective
    applications.


    Cloud services provide new user portals to access data and indirectly access legacy
    applications. This implies that the cloud service becomes responsible for authentication,
    authorization, and access control. The cloud is responsible for exercising delegated
    user authorities for access to legacy data, fresh data sources, cloud services,
    and legacy applications.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# Chapter 12 » Large Enterprise Cybersecurity: Data Centers and Clouds 265


    # Clouds Change Security Assumptions


    Major assumptions change while morphing into the cloud, migrating data and functionality,
    and exposing data to the network.


    A more subtle change occurs because the cloud engages new developer organizations
    and presents new user interfaces to an expanded user base. Vital assumptions for
    the legacy system; such compliance with the Health Insurance Portability and Accountability
    Act (HIPAA) and the healthcare data privacy, are not likely to be regarded seriously
    by third-party cloud developers, who may not be legally liable.


    Subtle nuances in definitions of security access controls are inevitable as organizations
    migrate to the cloud. Who is allowed to see this data? Exactly how are they authenticated
    and authorized? How are access constraints combined in a consolidated application?
    What can users and cloud services do with the data? How are intellectual property
    rights enforced?


    The correct answers to these questions are very important to the original data
    owners. For cloud developers, critical controls are easily misinterpreted. The
    next section offers a dramatic example: cloud indexing.


    # Cloud Indexing Changes Security Semantics


    Cloud developers generate indexes of data that clouds access, including data inside
    the cloud and from legacy systems. Indexes make it possible for the cloud to accelerate
    searching with structured data fields and unstructured full word indexes. Indexes
    are examples of metadata—data within a system that describes the system.


    Migrating security-related metadata to widgets is a source of errors. In many
    legacy systems, security metadata is implicit. The system is accessible to a controlled
    set of users who all have data access privileges. How does one migrate implicit
    legacy assumptions to the cloud? Poorly.


    In the migration to the cloud, developers may omit security metadata, or implement
    it in unexpected ways, breaking vital security assumptions that existed in the
    original data. Indexing, although necessary for searching, is an area of security
    problems in cloud services.


    # Cloud Mashups Increase Data Sensitivity


    Cloud services aggregate data sources transparently, leading to unexpected mashups
    or mixtures of data sources. When you assemble collections of data, more complete
    views of the enterprise and its data are formed. Assembled data mosaics can become
    sensitive in their own right.'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'For example, a mosaic of IT job openings is useful to competitors and cyber
    attackers because it reveals the specific technologies used by the organization.
    This is a difficult problem to mitigate automatically, but the risks of such exposures
    should be assessed.


    Explicit security metadata is another problem area. The likelihood is slim that
    cloud developers understand legacy metadata and how to use it. Multiply that by
    several consolidated applications, and you can see how errors are inevitable.


    # Cloud Security Technology Maturity


    Many application domains, such as governments, have extensive security requirements
    which are gradually supported by new technologies. For example, clouds host virtual
    servers, virtual networks, and virtual data traffic invisible to security devices
    on physical networks.


    Cloud rely heavily upon mobile code, introducing novel risks. Best practices for
    signing widgets and mobile code with mutual authentication are available, but
    are rarely implemented in practice.


    Recent news announced malware in smart-phone apps; many of these devices are unprotected
    by anti-malware. Smartphones, tablets, and others are extensions of enterprise
    systems and cloud ecosystems. Even though industrial-grade security is critical
    to enterprise systems, rapid deployment, rather than security, is the priority
    for new cloud apps.


    # New Governance and Quality Assurance for Cloud Computing


    In many enterprises, cloud computing is on networks, growing exponentially, and
    bypassing essential procedures for production software release, network change
    control, and security assessment and authorization.


    Cloud computing decentralizes and accelerates software development, leading to
    the unanticipated rogue widgets and threats. Because widgets are new and don''t
    fit policy norms, cloud developers deploy developmental code on production networks
    with impunity.


    IT and security governance must play catch-up to cloud technologies that are taking
    over enterprise processing and storage. Given the security risks and issues outlined
    in this chapter, the current situation is unsustainable.


    Cloud governance measures include inter-organizational agreements, addressing
    heightening requirements for trust relationships, cloud service-level agreements,
    and agreements that manage multiorganizational network incident response.'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Chapter 12 ■ Large Enterprise Cybersecurity: Data Centers and Clouds 267


    Governance should oversee cloud connections to new organizations; especially direct
    cloud-to-cloud service connections, which can rapidly move data. As inter-cloud
    networking expands, security risks risks multiply. More data and services are
    online, exposed to more and more users and threats.


    To be effective, cloud governance must regulate widget publication in enterprises.
    Similar to Apple and Android app stores, publication via widget Enterprise Marketplaces
    (EMP) should satisfy some basic requirements.


    EMPs should conduct quality assurance (QA) processes for widget compliance with
    enterprise widget standards (look and feel, interoperability, capacity, testing),
    security assessment/authorization, network change control, and enterprise architecture.


    Widgets arrive with a simple business case—that is, Cost Benefits Analysis (CBA)—and
    a security risk analysis. The risk analysis assesses the mission, business, and
    IT risks and effects of deploying the new software and data to the cloud.


    The EMP should be the most convenient place for users to obtain widgets and for
    developers to disseminate them. QA processes ensure EMP-certified widgets deliver
    quality to users.


    # Summary


    This chapter covers security issues and requirements from the perspective of large
    enterprises and cloud developers. The chapter begins by introducing the SANS Top
    20 Critical Controls, which are an experience-based set of security requirements.
    Experts from defense, civilian government, penetration test firms, and hands-on
    training institutes assembled, documented, and validated that these are the most
    critical requirements you need to implement to defend your enterprise.


    I presented these controls through discussion of antipattern case studies that
    represent the major vulnerabilities and attack vectors proliferating in large
    enterprises.


    For many enterprises, clouds are an emerging technology; however, their technology
    and security track records are short-lived. The upside of cloud technology includes
    the construction of private clouds—such as computation, data, and infrastructure
    clouds in enterprises—and the development of advanced algorithms and innovative
    technologies, which can be used to accelerate applications and searches.


    Unfortunately, cloud technology inherently breaks down barriers and brings data
    and processes together that were never intended to collide. In addition, publicclouds
    on the Internet may even be located or maintained from overseas creating critical
    new security challenges. These challenges motivate new governance and quality
    assurance approaches.'
