    This chapter on penetration testing covers security testing techniques, which
    should only be conducted with the complete signed authorization of a formal Rules
    of Engagement (ROE) agreement. The ROE should clearly enumerate what is allowed
    and what is not allowed in the testing.


    I begin with an overview of different forms of cyber attack and how they are detected.
    Subsequent sections address those topics with a hands-on level of'
