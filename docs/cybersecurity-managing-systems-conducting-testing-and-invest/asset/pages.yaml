  md: '# Chapter 4 Network Administration for Security Professionals


    From the Users & Groups tab you can also right-click to edit or remove accounts.

    This works similarly on the Groups subtab.


    # Managing Services


    A service is a long-running process that is waiting for a packet, message, event,
    or application programming interface (API) call to provide functionality.Well-known
    services include DNS, e-mail (SMTP, POP), databases, printing, firewalls, SSH,
    file transfer protocols (SFTP, TFTP), and web servers (HTML, SSL). SSL is a protocol
    that is not exclusive to web servers. Services management is the administration
    of the service status (start, stop, and restart) and settings/configuration.


    # Windows


    Open the Service Console using Start ⏎ and typing the string services.msc.\Installed
    services are listed with their statuses and attributes. The major controls, such
    as stop and start, are available from the context menu (right-click a service).
    Double-click a service to view and edit its properties. From the command prompt
    use netstat and nbtstat to check service status. Use netsh to manage and configure
    services.


    > NOTE These commands are useful for security testers. Obtain Windows command
    documentation through an Internet search such as "site:technet.microsoft.com nbtstat
    keyword string.


    Generally, services are created as part of an application install. For example,
    a new Windows Server installation, insert the Windows installer disk and access
    Add/Remove Windows components using Autoron dialog (or use Start ⏎ Control Panel
    ⏎ Add/Remove Windows Programs and then click Add Windows Components). Check the
    box next to Application Server and click Install and Finish.


    > TIP Before you try this, check to see if your Internet Information Service (IIS)
    is already running by putting a Windows server address in a web browser bar.


    To verify the installation, create a simple HTML page using Notepad. For example:


    ```

    <html><title>Our Home Page</title>

    <body><h1>Welcome Home!</h1></body></html>

    ```


    Save the file as type All Files with a name like .html in C:\inetpub\wwwroot and
    then put the IP address of the server in a web browser address bar and press Enter.
    Check the Services Console for a Started service: World Wide Web Publishing Service.'
  merge: -1
