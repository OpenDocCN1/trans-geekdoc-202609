  md: '# Chapter 9 = Cyber Network Defense Using Advanced Log Analysis 205


    # The iporgcap Script


    To find the alerting external IPs and their domains for a specific host, you can
    use the iporgcap script, a specialization of orgcap that only searches the alerts
    for a host IP:


    ```

    #!/bin/bash

    cat "echo detail$1.txt*" | awk BEGIN {FS="\n";RS="\n\n"} (print \

    $3'') | awk ''{print $4 $2}'' | awk -F: ''{print $1}'' | awk \

    "!/192.\168.\1./" | awk ''!/10.10.1./ | awk ''/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+''
    | sort uniq > /tmp/alertIPs

    while read ip; do echo $ip | grep ''/OrgName/ -F: ''{print $2}'' | echo \

    "$ip"; done < /tmp/alertIPs

    ```


    Use the iporgcap script like this: # /iporgcap 10.100.100.

    Please refer to the previous description of orgcap for an explanation of the iporgcap
    scripts. The only change is the input data, which comes from the detail<IP>.txt
    file.


    # The archcap Script


    Finally, to clean up, use the archcap script to rename and archive the alert file
    and the package cache:


    ```

    #!/bin/bash

    date | awk ''{print $2,$3,$6}'' | sed ''s/ /-/g'' > /tmp/today

    mv alert.cat .cat /tmp/today

    mv OVERNIGHT.cap full-*cat /tmp/today.cap

    mv snort.log.* snort-*cat /tmp/today.cap

    ```


    Use archcap like this: # ./archcap.

    The archcap script starts by reformatting the date string, using awk to select
    the month, day, and year (print $2,$3,$6), and then using the sed command to insert
    hyphens and store the MM-DD-YYYY date in /tmp/today. Archive the other files by
    appending the date to their filenames.


    Repeat these procedures from the top for the daytime alerts by copying the daytime
    alert file to the /root directory:


    ```

    #cp /tmp/alert *

    ```


    After that, your analysis is complete. You have the option of archiving the daytime
    alerts and snort.log.#### to a unique filename.


    Finally, check the disk space utilization (using the df command) and remove unnecessary
    large files.'
