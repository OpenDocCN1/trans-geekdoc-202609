- pgno: 316
  md: '# Chapter 14 ¤ Cyber Warfare: An Architecture for Deterrence 291


    Figure 14-4 identifies four capabilities groupings, including surveillance, penetration,
    integration, and advanced capabilities. The surveillance capabilities ensure that
    the defenders are aware of potential cyber attackers, their capabilities and their
    actions. Penetration capabilities could be used for CNE, in order to understand
    potential or actual attackers, and investigate attribution and certain forms of
    CNA. Integration capabilities allow human and automated knowledge sources to collaborate
    to build an understanding of the computer network environment, such as populating
    a knowledge base about potential attackers to accelerate the assignment of attribution.
    The advanced capabilities include the management of military botnets and parallel
    scanning.


    Numerous freeware, shareware, and commercial technologies implement capabilities
    from the reference model—for example, the open source IDS honeynet for distributed
    network surveillance (http://ids.subnet.nl). It is beyond the scope of this book
    to address all of these areas in depth. However, the next section describes some
    solution architecture concepts for key aspects of this reference model. In particular,
    it focuses on the attribution problem and parallel scanning.


    # Solution Architecture


    Certain aspects of this architecture are more interesting and challenging than
    others. To be true to architectural principles, you should consider a few of the
    more challenging aspects, and lay others aside for engineering analysis or future
    research.


    One of the capabilities that could be engineered is military botnets. In Armed
    Forces Journal a vision for a military botnet was proposed that would reside on
    existing hosts (for example, administrative workstations) distributed worldwide
    on military installations (Williamson III, 2008). It is unnecessary to use rootkits
    for this botnet because the software is installed overtly. The botnet would need
    a resilient command and control infrastructure but does not need to be stealth
    as seen in bots in the wild. A peer-to-peer communication mechanism, as used by
    the majority of the Storm worms, is particularly resilient and difficult to hijack
    (Holz, Steiner, Dahl, Biersack, & Freiling, 2008). The tradeoff is that peer-to-peer
    command and control (C2) is indirect and might not be as timely as required. A
    direct C2 botnet communication structure (possibly using broadcast packets) for
    speed, paired with a redundant peer-to-peer mechanism, could provide the advantages
    of both approaches.


    A military botnet could be used for scanning. As a potential attacker, knowing
    that an easily attributable government is actively scanning your Internet assets
    might have a deterrent effect. Alternatively, active scanning might force more
    stealth or have diplomatic consequences. Scripting'
