    > NOTE Terminology for these documents varies between shops, and some shops put
    rules of engagement (ROE) into a Security Assessment Plan (SAP). The terminology
    used here conforms with NIST 800-37, which is appropriate and common terminology
    for security professionals.


    All of these documents should be prepared as templates because there is a lot
    of overlap in content. Evolution of the templates is a form of process improvement
    for enterprise cybersecurity.


    > NOTE Boilerplate is common terminology for text that is reused many times. The
    term derives from the manufacturer''s tag that traditionally appears on furnaces,
    hot water heaters, and other types of boilers.


    Risk analysis assigns the ratings of low, medium, and high to threats and vulnerabilities
    to the enterprise and the system based on likelihoods and impacts. Ratings are
    aggregated into an overall categorization of the system requirements into low,
    medium, and high for confidentiality, integrity, and availability (CIA). These
    categories determine the initial security control requirements for the system
    that will be indicated from control lists such as NIST 800-53.


    Risk analysis should be performed at system development inception and at the completion
    of A&A testing. The risk analysis at inception determines the security control
    requirements for the system architects and developers. Vulnerabilities discovered
    during cyber testing are added to the final risk analysis. The Risk Analysis (RA)
    template, to be filled in the Information Security Systems Engineer (ISSE), should
    distinguish initial and final risk analyses. Once approved, the ISSE creates the
    Security Controls Compliance Matrix (SCCM), and adds these security requirements
    to all other system requirements.


    The Test Preparation Checklist is a form that the test client is asked to fill
    in. It contains essential information for preparing the test plan. For example,
    the checklist requests that essential documents be supplied in an up-to-date form,
    such as: System Security Plan (SSP), the previous Plan of Action and Milestones'
