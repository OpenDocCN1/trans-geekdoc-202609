    # Social Engineering (Critical Controls 9, 12, & 16)


    People without security awareness are readily manipulated to disclose sensitive
    information and grant accesses requested by attackers through deception. Some
    classic social engineering schemes include the following:


    +   - Phishing: Sending spam e-mail or spoofing an identity to entice users to
    disclose information, open a malicious attachment, or visit a drive-bymalware
    site.

    - Pretexting: Setting up a fictitious situation that fools a user or caller-taker
    into disclosing information and performing actions for the attacker. For example,
    a social engineer who calls a helpdesk can often readily obtain passwords for
    legitimate accounts by requesting a password reset and spoofing the legitimate
    user.

    - USB Attacks: Memory sticks can contain malware that runs the autoplay feature,
    enabled by default on most personal computers. A social engineering attack (or
    test) attempts to entice a user to install the malware in a business PC.


