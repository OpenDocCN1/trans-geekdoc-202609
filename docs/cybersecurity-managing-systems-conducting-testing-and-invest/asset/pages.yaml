  md: '# Part III - Cyber Network Application Domains


    Assigning and proving attribution of a cyber incident under the fact without prior
    knowledge of the attacker is probably infeasible, given the timeliness requirement.
    A typical solution approach, borrowed from artificial intelligence research, is
    to increase the level of a priori knowledge (what your system knows before problem
    solving starts) until the problem is solvable by automation. Suppose that have
    collected knowledge about the most likely potential attackers. There are numerous
    attributes that would be useful. Categories of these attributes include personal
    attributes, organizational attributes, and systems attributes. To assign attribution
    would need specific knowledge of the attackers'' botnet, as attacker IP addresses,
    control server domain names, server IPv''s, a large sample of bot IP addresses,
    protocols used, encoding schemes, and other indicators.


    If one of the nodes are defending against a DDoS attack, you could correlate bot
    IP addresses with known attackers, and under ideal conditions, your surveillance
    network could monitor (or sniff) control messages and perhaps even capture some
    control commands from attacker systems. In that case, attribution would be assured.
    Note that the surveillance network would have to be somewhere on the network routes
    of the attacker and control servers. Ideally, the attack servers and/or the bot
    control servers are monitored directly, perhaps through exploitation and installation
    of a rootkit (which would be allowed under the assumed legal framework outlined
    the "Legal and Treaty Assumptions" earlier in this chapter). The attackers'' hosts
    are also places to mount a counter-attack. A database of attackers affiliated
    with each botnet could be used to quickly determine the likely attack organization.
    Monitors on the attack or control servers could then confirm the attribution and
    later used as part of a retaliatory response.


    What if the attack and control servers are hardened and cannot be exploited externally?ially
    generated e-mails with malicious attachments could be employed. This method of
    exploitation has proven effective in all manner of high-tech organizations by
    Advanced Persistent Threats (Rafferty, 2010; Information Warfare Monitor, 2009).
    A number of rootkits are publicly available security researchers such as the Hacker
    Defender, Immunity''s Rootkit, and these three rootkits: LRK, Universal RootKit,
    and AFX Windows Rootkit (Skoudis, 2004).


    Figure 14-6 is a conceptual solution architecture for rapid attribution. At the
    core is a blackboard knowledge base which is populated by various knowledge sources.
    For example, a parallel scanning tool could analyze and collect network and server
    information automatically. Various sensors, such as honeynets, bots, and human-supplied
