    # Advanced Wireshark Filters


    Using Wireshark to examine full packet captures often requires filtering packets,
    creating specific views of the packets of interest. Just under the Wireshark button
    bar is the Filter field. Table 9-1 contains some useful examples for using the
    Filter field to select packets (comments in italics). Use the Apply button to
    filter and the Clear button to reset.


    **Table 9-1:** Advanced Wireshark Filtering


