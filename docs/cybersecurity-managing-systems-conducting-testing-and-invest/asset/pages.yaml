    # Converting and Migrating VMs


    Moving and copying VMs between environments is a frequent network administration
    task. The task is easier if the VM was created with its file split into 2GB or
    smaller files—files that are small enough to fit on a data DVD. With the VM on
    DVD, simply copy the files to the destination system and use VMware Player or
    Workstation to run the VM. An external USB drive can transfer VMs with larger
    files (the “Mounting Disks” and “Moving Data between Systems on Networks” sections
    earlier in this chapter).


    > Make sure that your network has licensing rights to copy VM OSes and onboard
    applications. Vendor reactivations are usually required.


    There are several other cases of VM conversion and migration including the following:


    +   - Converting a running machine to an ESXi machine

    - Converting and migrating a VMware Player machine onto an ESXi infrastructure

    - Converting and migrating a VM on ESXi to a VMware Player image


    The first two operations use the vSphere Standalone Converter application. To
    convert a running machine into a VMware player image, do the following:


    +   1. Start VMware Standalone Converter application.


    > On Windows, the VMware Converter Server and Converter Agent are Windows services,
    created when Converter was installed. Verify that they are started.


    +   2. Click the Convert Machine button.'
