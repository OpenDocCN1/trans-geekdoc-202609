  md: 'Vulnerability testing and penetration testing are complementary techniques.
    Vulnerability testing is the more comprehensive of the two. In vulnerability testing
    you are searching for all potential weaknesses. In penetration testing, you perform
    vulnerability testing and then you actually exploit discovered weaknesses. The
    actual exploitation is not a comprehensive test; it is a dramatic demonstration
    of the potential harm due to latent vulnerabilities.


    > NOTE A threat is anything that can convert a potential risk into a realized
    security issue. For example, a threat can be an attacker, a self-replicating malware
    worm, an intense storm, a malicious insider, and so forth.


    Because you cannot completely eliminate all cyber risks, you must understand and
    prioritize risks in your risk assessment. In a certification test plan you address
    the vulnerabilities for the highest priority risks.


    The certification test asserts the truth about vulnerabilities to the greatest
    extent possible. In particular, you want to know the severity of system vulnerabilities
    and the mitigation steps needed to harden the system. When the risks, vulnerabilities,
    and mitigation steps are known, an executive authority can decide to accept the
    risks and their mitigation plans, which is called accreditation.


    A number of approaches are available for system security certification. When applied
    with regularity, these are all forms of information assurance (IA). The following
    sections describe some of the major types of system security certification.


    > NOTE IA is commonly used as a synonym for information technology (IT) security.
    The term assurance denotes a regular or continuous assurance in a changing environment.


    # Body of Evidence (BOE) Review


    A body of evidence (BOE) review is a complete set of system and security documentation
    available for certification. The BOE review should contain sufficient information
    to perform a credible security certification. A BOE review typically includes
    the following:


    +   - Concept of operations (CONOPS)

    - Risk assessment (RA)

    - System security plan (SSP)

    - Security assessment plan (SAP)

    - Security assessment report (SAR)

    - Signed accreditation documents'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Chapter 7 Reconnaissance, Vulnerability Assessment, and Cyber Testing 141


    A BOE review can stand on its own as a certification task; however, the BOE review
    is always performed as part of other forms of certification, such as pen tests.
    Certain vulnerabilities can be discovered from the BOE review, and others need
    to understand the system (from the BOE) in order to run effective tests.


    # Penetration Tests


    In a penetration test, systems are attacked by white-hat hackers (pen testers)
    to evaluate defenses and prove the existence of vulnerabilities. Pen tests are
    required by best practices, such as the payment card industry (PCI) and data security
    standard (DSS). Best practice is to conduct a pen test with a vulnerability-assessment
    and BOE review.


    # Vulnerability Assessment


    In a vulnerability assessment, systems, policies, and procedures are evaluated
    for any weaknesses. Systems are probed locally or remotely. For example, registry
    keys, group policy objects, patch levels, default settings, and external ports/protocols
    are assessed. Vulnerability assessment is designed to discover all possible security
    weaknesses, whereas pen testing can succeed by discovering only one system weakness.
    Best practice is to conduct a vulnerability assessment with a BOE review and then
    test if the system owners allow it.


    # Security Controls Audit


    During security controls audit, formal assessments are made of the organization,
    security policies, systems, and operational implementation of policies. An audit
    can include other forms of certification, such as vulnerability testing and penetration
    testing. Security controls audits are conducted within formal audit frameworks
    such as Control Objectives for Information Technology (COBIT) and the NIST 800
    series standards. Vulnerability assessments and controls audits have similar goals,
    but they are conducted by different disciplines. Vulnerability assessments are
    performed by security testers with IA test methodologies, whereas controls audits
    are completed by auditors within formal controls frameworks. The next section
    covers IA test methodologies.


    # Software Inspection


    Software inspection applies to any phase of system development. Because security
    issues are primarily caused by software defects, software inspection is one of
    the most effective techniques for the elimination of vulnerabilities. An inspection
    team is formed, and samples of the source code and documentation'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'are parsed out. Each page is examined carefully for defects. The team reviews
    the findings, which notes any defects throughout the code and documentation. Inspection
    is an in-depth investigative procedure; but it is usually not comprehensive; it
    is based on a sampling of the code or documentation. Reviews, in contrast, involve
    informal oversight and are usually intended to be somewhat comprehensive, but
    because they are often not systematic, reviews are prone to missing important
    latent defects in design and implementation. Testing, on the other hand, is intended
    to review the actual properties of the implementation, which might vary significantly
    from the appearance of the code and documentation.


    +   Early elimination of defects is the most cost effective best practice.


    +   Software Inspection (Addison Wesley, 1994, ISBN 978-0-201-63181-4) by Tom
    Gilb, and D. Graham defines best practices for software inspection. It is widely
    agreed that software inspection works.


    # Iterative/Incremental Testing


    Security testing begins early in system development and focuses on portions of
    the system as they are stabilized. Security testing can synchronize with agile
    methods or other iterative development processes. The security team can also contribute
    security engineering to the development. With iterative/incremental testing, the
    security of a system is baked-in correctly during development, rather than being
    handled as an afterthought. Previous approaches to certification assume formal
    documentation and/or deployed systems. This naturally delays security concerns
    to the end of system development, after it is too late or too expensive to do
    security correctly (see the No Time for Security antipattern Chapter 2).


    # Understanding the Cybersecurity Testing Methodology


    Cybersecurity is awash in methodologies, many tied to professional certifications.
    An informal method for security testing follows the phases typically used by malicious
    attackers. In the case of cybersecurity, you use any of the following techniques
    to conduct ethical hacking, which is a professional service that helps clients
    to strengthen their IT defenses. Note that these ethical hacking steps are not
    always followed in the same order and might involve some iteration as well.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# Chapter 7 Reconnaissance, Vulnerability Assessment, and Cyber Testing


    Each step generates useful information about the target systems that support the
    successful execution of subsequent steps.


    +   1. Reconnaissance: Testers perform general research, such as Internet searches,
    to reveal information to attackers, such as equipment types (often listed in job
    ads), uniform resource locators (URLs), usernames, domain names, IP addresses,
    e-mail addresses, and vulnerable servers (for example, from Google hacks).


    +   2. Network and Port Scanning: Testers use network scanning tools (primarily
    nmap) to discover active hosts, their open ports, and likely network services.


    +   3. Policy Scanning: Testers conduct policy scans, comparing system and application
    configurations with best practice benchmarks for security hardening.


    +   4. Vulnerability Probes and Fingerprinting: Testers use vulnerability scanners
    to perform local and network probes, such as Nessus, nmap, and OpenVas, to discover
    potential vulnerabilities.


    +   5. Penetration: Testers gain access to systems, networks, websites, databases,
    and wireless systems to be able to execute commands and attack code inside the
    systems. Some key tools for penetration include metasploit, CORE Import, and Canvas.


    +   6. Enumeration and Cracking: This steps involves harvesting user lists and
    using sniffing, brute-force, and decryption techniques to gain access credentials.


    +   7. Escalation: The tester obtains administrative privileges on systems.


    +   8. Backdoors and Rootkits: This process involves establishing permanent access
    and control of a system while staying hiding from the system''s owners.


    +   9. Exfiltration and Abuse: The ultimate goal of the process when performed
    by hackers is to transmit information and damage systems for a variety of malicious
    motivations.


    The preceding ethical hacking steps are a general approach to penetration testing
    that is widely applied in practice. Many testing organizations stop at step 4
    (vulnerability assessment) for various reasons, such as the subsequent steps have
    serious potential to damage systems, and the subsequent steps are'
