  md: '# Distributed ledger technologies


    More than 1,500 altcoins have been created and launched on the Internet until
    now, and the new ones can show up at any time. However, many older cryptocurrencies
    are no longer present on the market. Currently, some of the altcoins with the
    largest market capitalizations are Ether (ETH), Cardano (ADA), Ripple (XRP), Litecoin
    (LTC), Zcash (ZEC), Dash (DASH), and Monero (XMR).


    LTC, often mentioned as the silver to BTC''s gold, is very similar to BTC in terms
    of functionality. The main differences are the average time needed for block solving
    of 150 s (four times shorter than the BTC''s 10 min), the total amount of coins
    that can be mined (84 million LTC compared to 21 billion BTC), and the applied
    PoW algorithm – LTC runs. This sequential function involves SHA-256 [13] computations
    of hash but requires more memory than the BTC''s hash computations (known as double
    hash or hash-hash algorithm).


    ETH is a bit more specific since it is not a digital currency – it, is not meant
    to be for online payment of goods and services as the incentive mechanism to power
    the Ethereum blockchain.(token) of the Ethereum network, in other words, ETH is
    the native digital currency of the Ethereum network, designed for various decentralized
    applications using smart contracts (see Section 2). With the public Ethereum network''s
    mining process, about every 12–15 s, a new block is verified, and the reward for
    that is 5 ETH. The PoW algorithm (called ethash) requires more memory than the
    one in BTC. Also, for running various DApps, universal computing hardware is needed
    (like CPUs), so the expensive ASIC chips specialized in BTC mining, are not suitable
    for Ethereum mining.


    The Ethereum DLT was the pioneer of the second generation of blockchain systems.
    Unlike Bitcoin, they are capable of smart contracts and decentralized applications.
    For a long time, Ethereum has been the only viable choice for DL platform selection
    for DApps. The possible alternatives were immature or lacking DL ecosystems (see
    Section 2.7.1). The Ethereum technology is implemented in a large public network,
    with important crypto-market capitalization. In addition, the Ethereum system(see
    Section 2.7.1.1) provides community support, development tools, and libraries.
    Alternatives to PoW consensus have been supported in the Ethereum clients before,
    and one can use in private or consortium networks. The Ethereum Foundation also
    marked a clear migration path from the PoW consensus in the public network to
    the PoS. The Ethereum technology is, therefore, always an option for most advanced
    DApp designs. For the same reasons, many examples in this book refer to the Ethereum
    network, nodes, and applications.


    Nevertheless, other viable DLTs and ecosystems are emerging. Some of them are
    presented in Section 2.7.1. They might differ from Ethereum in some of the approaches
    taken but share many of the common principles related to DL networks, performance,
    decentralized applications, and security, covered in Sections 2 and 3.'
