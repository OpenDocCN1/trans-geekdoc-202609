    famous if some conditions are satisfied. The $i$-th witness, $W_{n,i}$, of round
    $n$ will be famous or not up to the witnesses from upper rounds, $n+1$ and $n+2$
    (in most cases). Firstly, each witness, $W_{n+1,i}$, from round $n+1$ gives his
    virtual vote or the answer is "Yes" if he can see $W_{n,i}$ (strongly seen is
    not mandatory) or the answer "No" in the opposite case. Next, votes are counted
    by witnesses from round $n$ to $n+2$.


