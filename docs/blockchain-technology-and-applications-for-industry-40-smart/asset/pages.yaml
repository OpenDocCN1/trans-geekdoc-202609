    and quality of service.


    Mobile networks:


    +   - Network control: private – by the mobile operator; permitted – only the
    mobile operator manager manages and controls the network.

    - Service access: public – anyone can become a mobile network user. The access
    is non-discriminatory, even though it is not free.

    - Service access permission: permitted – if a user has a subscription, then there
    is, post-paid plan.

    - Service access permission: permissionless – if a user has no subscription, pre-paid.


    Open public WLAN:


    +   - Network control: private – by the WLAN provider; permitted – the provider
    usually restricts access to the WLAN management system.

    - Service access: public.

    - Service access permission: permissionless – no user credentials are needed.


    Airport public WLAN:


    +   - Network control: private – by the WLAN provider, permitted.

    - Service access: public – anyone can register and then use the service.

    - Service access permission: permitted – users need some prior registration, for
