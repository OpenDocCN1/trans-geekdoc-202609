    Most of the DL smart contract execution environments, including Ethereum, Hashgraph,
    and BTC, follow state machine replication on the order-execute principle. The
    consensus mechanism of these DLTs assures a clear order of the smart contract-invoking
    transactions before their execution. The ordered transactions are executed sequentially
    on all peers, reflecting the common change of the ledger/smart contract state.
    For this to happen, the execution of smart contracts (processing of all'
