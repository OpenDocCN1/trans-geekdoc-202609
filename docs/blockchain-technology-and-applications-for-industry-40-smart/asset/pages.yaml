    \ them are to be involved in different kinds of money transactions and micropayments.\
    \ Therefore, there appeared a need for providing a universal platform that would\
    \ support a huge number of transactions efficiently. This support should be better\
    \ than what the existing blockchain platforms provide. A solution that should\
    \ obtain key support to the IoT is offered by the IOTA project [14]. It is a new\
    \ distributed ledger technology significantly different than the blockchain. IOTA\
    \ is based on a specific DAG structure known as tangle.\n\nThe IOTA project began\
    \ in 2015, intending to provide a more suitable cryptocurrency for payments (transactions)\
    \ between billions of IoT devices and obtain a reliable platform for many other\
    \ applications, which might include M2M communication between those devices. As\
    \ such, the implementation of the IOTA protocol had to be cheap, fast, and scalable,\
    \ which was the key explanation for developing the tangle, instead of using already\
    \ mature blockchain technology. The rapid growth of IOTA significantly increased\
    \ the demand for micropayments between IoT devices. At first, the BTC did not\
    \ prove to be a good choice for these transactions. The first is the relatively\
    \ high fees as the amounts of money included in transactions with micropayments,\
    \ and the other reason is the roles of participants.. some miners verify transactions\
    \ and \"normal users\" who issue transactions in the BTC society; here, miners\
    \ may be issuers. With this ambiguity, the probability of possible conflicts stays\
