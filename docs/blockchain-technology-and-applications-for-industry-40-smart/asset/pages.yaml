- pgno: 165
  md: Swether is a prototype of an end-to-end solution based on an Ethereum controlled
    IoT electric switch and meter [78]. This DApp comprises the hardware and software
    for the IoT device, smart contract, and Ethereum-compliant Web applications for
    the use and control of the system. The Swether device can be built into, for example,
    an electric car charging station and acts as an independent BC entity, reporting
    the measurement status to the chain. The smart contract in the DApp tracks the
    availability of charging stations, enables booking a charging station for a selected
    period, and handles the charging payments. The smart contract allows additional
    payment and workflow features, such as escrow (to increase the security of involved
    stakeholders), bidding (to select automatically among the different available
    energy providers), and a system of loyalty tokens for the clients (additional
    incentives for service use).
