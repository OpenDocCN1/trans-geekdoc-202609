- pgno: 35
  md: '# 14 1 Distributed ledger technologies


    verified. The other one will be rejected as invalid. Such a confirmation mechanism
    through which the BTC manages the double-spending problem is enabled by a chronologically
    ordered, time-stamped transaction ledger, that is, by the blockchain.


    The other incorporated in the BTC is the use of PoW as a probabilistic solution
    to the class of failures known as the Byzantine Generals Problem [6], which is
    a generalized version of the Two Generals'' Problem. It can be said that the BTC
    P2P network as a distributed system is Byzantine fault-tolerant (BFT).


    The Byzantine Generals Problem can be presented, in a nutshell, the situation
    in which many generals (each with his army) have to reach a consensus about the
    time of the attack in the forthcoming battle against the surrounded enemy. If
    they don''t attack all simultaneously, but if a few generals the order for attack
    and other generals do not, the enemy will overcome the armies that have attacked,
    gain strategic advantage, and eventually win the battle. Generals communicate
    to one another via messengers, that is, each general forwards a message to the
    nearest generals, depending on their spatial positions on terrain. The initial
    message with the information on the time of the attack is sent from the chief
    general to the few generals and relayed to the others. The problem occurs if some
    of the generals (the traitors) alter the message and forward it to others. This
    will lead to an unsynchronized attack and, eventually, to defeat in the battle.
    Since loyal generals do not know who the possible traitors are, they must create
    a communication protocol and the decision rules. They must ensure that, in a situation
    where some generals have received two or more messages with different times of
    attack, only the right message is accepted by all, and the false ones are rejected.
    It is shown [7] that this problem can only be solved if the number of traitorous
    generals does not exceed one-third of all generals.


    When talking about the Byzantine Generals Problem in the context of distributed
    systems (such as the B2P network), this problem concerns the corrupted components
    of the system having the symptoms that prevent other system''s components from
    reaching an agreement among them (i.e., consensus). Such an agreement is needed
    for the correct operation of the system. Byzantine fault assumes any fault that
    causes a component to present different symptoms to parts of the system. A Byzantine
    fault tolerance (BFT) system can accomplish its correct functioning if there are
    not too many faulty components, that is, if, at most, one-third of all components
    are faulty. BFT systems often include PoW as the mechanism to combat false information
    from corrupted components.


    If we want to translate the Byzantine Generals Problem into a BTC environment,
    we can have a situation with a solved candidate block. Having found the solution,
    the miner adds the block to the blockchain (say, the n-th block) and broadcasts
    it to other nodes. Then, other nodes check the received blockchain with the added
    n-th block. Having done it and confirming the nonce, each miner adds this new
    block to the top of its copy of the blockchain. When the other miners continue
    adding'
