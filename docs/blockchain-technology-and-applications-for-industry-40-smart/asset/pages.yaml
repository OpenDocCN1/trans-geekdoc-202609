    # ### 3.3.3.1 Authorization models


    The possible access control models differ in many aspects, including granularity,
    flexibility, centralization, and interoperability. They are, therefore, not equally
    appropriate for implementation in IoT systems. In Sections 3.3.1 and 3.2.2, we
    highlight some possible approaches for identifying and authenticating IoT devices
    with DLT. Nevertheless, the decentralized approach is nearly one option and device
    identification can be managed in the traditional (centralized) way. Similarly,
    access control can utilize centralized or decentralized approaches.


    Identity-based access control (IBAC) is a type of security that focuses on access
    to digital information or services based on the authenticated identity of an entity.
    Discretionary access control (DAC) considers the authenticated identity and the
    groups to which they belong. In DAC, subjects can transfer access controls among
    each other. Therefore, the name is discretionary. IBAC and DAC become unsuitable
    for IoT because it is almost impossible to manage the access control lists for
    every entity in the system.


    On the other hand, in mandatory access control (MAC), the security policy is centrally
    controlled by a security policy administrator. Users cannot override or modify
    this policy – mandatory. A risk with MAC is high centralization and a single-point
    failure in the controller. IoT devices at diverse locations or with different
    functions may belong to various management organizations. This imposes another
    relevant problem for the centralized access control model, which does not fit
    IoT systems.


    We can simultaneously implement MAC and DAC, where DAC refers to one category
    of access controls that can transfer among each other. MAC refers to the second
    category of access controls that imposes constraints upon the first.


    Role-based access control (RBAC) employs pre-defined rules that carry a specific
    set of privileges. It can enforce MAC and DAC access control models too. Despite'
