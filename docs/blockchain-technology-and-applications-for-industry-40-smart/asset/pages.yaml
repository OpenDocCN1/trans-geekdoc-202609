  md: '# 2.4.1 Virtual machine


    The execution environment for the smart contract code can be compared to a virtual
    machine, which is provided by the DL network. In fact, in Ethereum, this environment
    is called the Ethereum Virtual Machine (EVM).


    Different virtual machines exist for the currently available DLTs. EVM is the
    most popular ones. Some of the non-Ethereum DLTs adopted the EVM, too, having
    completely different ledger and consensus technologies from Ethereum. For example,
    Hedera provides an adaptation of EVM implementation for the Hedera Smart Contract
    Service. Sawtooth,^{10} one of many Hyperledger projects, with its built-in Hyperledger
    Burrow.^{11} can facilitate the reuse of smart contracts in the EVM for Hyperledger.
    not using the same smart contract programming language and relying on a familiar
    smart contract execution environment can also be very favorable for the developer.
    They can rely on their preceding software and security engineering experience
    and reuse their existing codebase, making the development faster and more secure.


    Other virtual machines take different approaches and use different smart contract
    programming languages. The smart contract in Corda, for example, is written using
    Kotlin, a programming language from JetBrains that targets the Java Virtual Machine
    (JVM) and JavaScript. The virtual machine for contract execution and validation
    is augmented and radically restrictive version of the JVM, which enforces security
    requirements and deterministic execution. Smart contracts in EOS run WebAssembly,
    meaning that a wide variety of languages is supported. The chaincode in Hyperledger
    can be written in any programming language and is executed in containers. Currently,
    Golang, JavaScript (in NodeJS), and Java chaincode are supported. With the provided
    support for EVM, Hyperledger can also run Solidity smart contracts.


    The distribution of a DL system does not scale the performance of a VM. Each node
    in the DL network executes the smart contract execution. This ensures the consensus
    and, thus, trust in the results of the smart contract execution. All DL nodes
    repeat the same operation coded in a smart contract, and thus run the same copy
    of the virtual machine. Smart contract processing capabilities of the whole network,
    therefore, remain limited to the capabilities of a particular node.


