    # 3.3.2 OAuth authorization architecture


    The OAuth 2.0 [53] is a commonly applied authorization framework, which introduces
    an authorization layer and separates the role of the client from the resource
    owner. This standardized protocol provide specific authorization flows (Fig.3.4)
    for web or desktop applications, mobile devices, applications, or IoT, and simplifies
    the overall authorization architecture and client development. In OAuth, the client
    requests access to resources controlled by the resource owner and hosted by the
    resource server, and is issued a set of credentials different from those of the
    resource owner.


    Instead of using the resource owner''s credentials to access protected resources,
    the client obtains an access token – a string denoting a specific scope, lifetime,
    and other attributes. Access tokens are issued to third-party clients by an authorization
    server with the approval of the resource owner. OAuth does not pass authentication
    data between clients and resource providers, but instead acts as an authorization
    token. The client uses the access token to access the protected resources hosted
    by the resource server. However, [54] showed to run all OAuth logic in a resource-constrained
    device might be impossible because of its high communication and computation overheads.


