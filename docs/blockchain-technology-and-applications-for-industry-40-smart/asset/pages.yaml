    # 3.3 Authentication and authorization


    Authentication and authorization are two fundamental steps in any ICT system to
    manage access by various entities such as the users, devices, and services. They
    are based on unique entity identifiers, sets of mechanisms to authenticate the
    identity of a particular entity, and rules to authorize the collection of predefined
    rights and services in the system.


    In the IoT, the common identification, authentication, and authorization approaches
    need to be adapted to avoid single-point failures in complex and large-scale IoT
    network infrastructures and simplify enrollment and authentication for constrained,
    unmanned devices.


    Blockchain technologies can contribute to device identification, for example,
    by granting blockchain addresses to devices for authentication and authorization.
    Based on smart contract capabilities in the blockchain, the latter verifies their
    identity and grants the appropriate rights. An additional benefit of the blockchain-based
    approach is the transparent and immutable history of authentication and authorization
    actions.


