    In public networks, access to the network services is permissionless. This means
    that a new network user (usually a person) does not have to possess any dedicated
    rights to create new accounts, build and submit transactions, or even add new
    nodes to the network, including mining nodes. The participant remains anonymous
    and identified only by his randomly created DL network addresses. The relation
    between the real users and the DL addresses does not have to be disclosed to participate
    in the network or utilize its services.


    In a permissioned system, users are authorized to access the network services
    or participate in the network control. There are several benefits of permitting
    in DL. Permissioned network control can enable better network performance and
    is easier to manage. A permissioned network does not require a cryptocurrency
    to incentivize the mining process, which positively affects transaction costs.
    All these benefits of permitted network control reflect in the network services
    provided to the user. Besides, permissioned DL systems can facilitate compliance
    with regulations like GDPR.


