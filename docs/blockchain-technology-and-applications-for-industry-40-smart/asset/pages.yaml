  md: '# 4.3 Smart energy 143


    tracks the production of renewable energy from its origin in real-time and prevents
    double-counting.


    Energy Origin70 is a web platform built on top of low-energy Blockchain technology.
    It records the generation and consumption of green energy, calculates the volumes
    of energy exchanged between the renewable assets and customers'', the impact of
    avoided CO2, and registers this information in tamper-proof certificates for transparency.


    The Greene71 offers several decentralized applications for the energy sector,
    including green credits and carbon credits for green energy producers. The certificate
    determines the energy source, and corresponding carbon credits. For trading, consumers
    can collect carbon credits in the marketplace.


    The Universal Protocol (UP) Alliance created the world''s first transferable token
    on a public blockchain – UPO272. The UPO2 tokens represent a measured amount of
    carbon dioxide. They can be bought and held as or burned to offset a company''s
    or an individual''s carbon footprint. Underlying REDD + carbon credits back the
    token, and blockchain technology is a way to prevent double counting (or double-spending)
    of carbon credits.


    # 4.3.4. Energy metering, billing, and network data management


    A prerequisite for many Internet Energy applications is the integration of smart
    meters and blockchain platforms. Smart consumption meters are part of advanced
    metering infrastructure, which is readily deployed in modern energy grids. AMI
    measures, collects, and analyzes energy usage. A smart meter has a two-way communication
    channel, usually assured by power-line communications (PLC), or mobile (e.g.,
    LTE/5 G), or low-power mobile (e.g., NB-IoT), or long-range WAN networks (e.g.,
    LoRaWAN). Apart from consumption reading, AMI may support demand-side optimization
    or outage management. Smart meters generally do not have unique decentralized
    identifiers and are simple transaction issuers (Section 3.5.2). Instead, all blockchain
    functions are provided by AMI gateways or even by the backend blockchain. This
    enables the use of the installed infrastructure, but BC identification at the
    level of individual meters could yield a far more accurate, verifiable, and efficient
    process. An early demonstration was Bankymood prepaid smart meter. It was a Bitcoin-based
    billing system for smart meters that operated in partnership with the crowdfunding
    platform, Sizuso. Donors transfer cryptocurrency to third-world schools equipped
    with a smart meter to provide energy directly to the school of their choice.


