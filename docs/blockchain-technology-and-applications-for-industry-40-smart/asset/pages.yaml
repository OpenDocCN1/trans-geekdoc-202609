  md: '# 4 Selected use cases


    These days, cryptocurrencies are certainly the most popular use cases of distributed
    ledger technologies, with Bitcoin as the first one that made a breakthrough in
    this area. Over the years, in its initial design, blockchain technology was used
    in several applications in both financial and non-financial domains where, in
    the past, third party entities for transactions'' verification and protection
    was necessary.


    In addition to blockchain, the smart contracts application (invented in 1994)
    for the automatic execution of contracts between involved parties was enforced
    by computer protocols. And yet, smart contracts did not come into use until blockchain
    technology enabled their easy registration, verification, and execution, that
    is, until programmable payments became a reality. Now, smart contracts, supported
    by blockchain or other distributed ledger technologies (e.g., hashgraph), that
    pay payments are triggered when the preprogrammed conditions of the contract agreements
    are met, represent the cutting edge of the cryptocurrency world. The combination
    of smart contracts and distributed ledger technology enables many decentralized
    applications, while Bitcoin and other cryptocurrencies make up only a small part
    of the DLT ecosystem.


    Generally speaking, a smart contract is the computer code whose execution anything
    that has value (money, shares, property, content, etc.). It is a self-operating
    program running on a DLT platform (e.g., on the Ethereum blockchain) that executes
    automatically when specific conditions are met. Due to the execution on a DLT
    platform, a smart contract runs exactly as programmed (according to the agreed
    contract terms), that is, there is no chance of it being changed, interrupted,
    censored, or interfered by any third party.


    Regarding physical hardware, the smart contract code is executed on every network
    of the platform. In the case of a blockchain-supported smart contract, the execution
    of the smart contract code is part of the definition of the state transition function
    within the block validation algorithm. For example, if a transaction is part of
    a block that is to be validated, the code assigned to that transaction will be
    executed on all nodes, validating the given block.


    Smart contracts can be used in many cases, that is, they can replace arrangements
    in which some assets must be transferred only when certain conditions are met.
    These require lawyers (for contract creation) and banks (for providing escrow
