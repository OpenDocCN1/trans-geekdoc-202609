    # 4.3.2.1 Requirements for distributed ledger technologies


    Several distinguishing aspects of smart grids affect the role and adoption of
    distributed ledger technology for the decentralized Energy Internet. Despite the
    successful introduction of ICT in the SG, grid systems remain relatively close
    and centralized with regard to ownership and governance. However, this concept
    is gradually changing. Nevertheless, (smart) grid remains a critical infrastructure.
    It is mostly regulated and is characterized by an immense business perspective
    and possible financial implications. At the time, it presents a highly distributed
    and heterogeneous system, especially in the customer domain. It is characterized
    by a large and dispersed customer base and by the various technologies for the
    communication connectivity needed for the communication flows of smart grid applications.
    Incessant connectivity of customer devices, for example, smart meters, cannot
    always be assumed. A blockchain architecture for the smart grid must, therefore,
    be able to balance the availability and consistency of data in network partitions
    are caused, due to a temporary loss of communication connectivity. Such an architecture
    can, further, be hierarchical to match the hierarchical structure of the grid
    itself. The hierarchical structure of the blockchain data is also beneficial to
    limit the scope of data generated in various segments of the smart grid, for performance
    and privacy. Therefore, the DL networks for the Energy Internet are often implemented
    as hybrid blockchain networks or specialized public/consortium networks.


