    Through the combination of open (permissionless) consensus and closed (permissioned)
    governance, the Hedera hashgraph platform aims to build more public trust than
    an entirely closed system, which is the key factor for cryptocurrency to achieve
    global acceptance. The open consensus model assumes a process where nodes join
    the network and (in the way explained earlier) reach the transaction timestamp
    consensus, that is, consensus in the order of transactions. In order to ensure
    transparency, this enables the possibility of anonymous individuals joining the
