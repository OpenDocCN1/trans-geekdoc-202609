    software engineering techniques specific to the smart contract environment, code
    reviews and verification (Section 2.4.3.2 for smart contract programming). Active
    measures occur during smart contract execution and refer to smart contract and
    access control, active monitoring of the incoming smart contract transactions,
    and authorizing their actions.


