  md: '# 1 Distributed ledger technologies


    Distributed Ledger Technologies (DLTs) enable an innovative special form of electronic
    data processing and its memorizing. As the main part, a distributed ledger is
    a decentralized database that allows all the members of a concerned network to
    read and write data in it. Unlike centralized databases, no central instance allowing
    data writing and reading is needed here. Instead of having a centralized control,
    any network member can add data anytime, after which a process of data aktualization
    follows. Each network member is provided with the newest up-to-date state of a
    database.


    DLTs reduce the cost of trust and revolutionize transactions between individuals,
    companies, and governments and minimize successful frauds, error possible, and
    paper-intensive processes, they are considered a progressive technology of the
    future. They can have a crucial impact on society in every respect, especially
    in machine-to-machine (M2M) communications, one of basic technologies for the
    Internet of Things (IoT). Beside providing security, privacy, and decentralized
    operation, DLTs stand for reliable, autonomous, and trusted IoT platforms now
    and in the future.


    DLT follows a new data recording, sharing, and synchronizing across multiple ledgers
    (data stores). A distributed ledger (DL) is a database that is independently created,
    maintained, and updated by each node (or participant) in a large network. The
    records of a distributed ledger are shared and synchronized between nodes across
    the network. This happens without the help of any central authority. Consequently,
    each network node has its ledger copy, identical to others. Every time the ledger
    has to be updated with the new record(s), reaching a consensus results in getting
    identical copies on all nodes. This synchronization process is very fast, so that
    changes in a node''s ledger are copied onto the ledgers of other nodes in just
    a few seconds (or perhaps minutes).


    Cryptographic signatures are used to secure access to the ledger''s content, so
    that all data is accurate and safe. In many cases, to secure in a cyberattack,
    an attacker has to target most DLT copies simultaneously. Besides, if one or few
    copies are corrupted, the system as a whole will not be compromised.


    Any node may create a data block with which the actual will be updated. Then,
    the information (created block) is broadcast across the network, after which other
    nodes check its validity through a consensus mechanism, which is, pre-defined
    validation method. After the community (i.e., a valid majority of network nodes)
    has added a new block, each node, that is, participant, adds it to its copy of
    the ledger.


    As for consensus mechanisms, there are several of them, such as a Proof of Work
    (PoW), Proof of Stake (PoS), Proof of Space (PoSpace), and so on. PoW can be the
    solution to a mathematical problem or puzzle or a suitable hash value found through
    the iterative execution of the hash function.'
