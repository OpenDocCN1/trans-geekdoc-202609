    # 3.1.2 Availability


    Distributed ledger network attacks are usually the basis for further attacks that
    impact integrity. They target the governance or operation of a DL network, with
    the objective of taking control of most nodes and thus, the ledger (e.g., 51%
    attack). Network attacks might also try to partition the DL network into separate
    and inconsistent partitions or isolate a selected node from the remaining trusted
    nodes (Eclipse attack, Sybil).


    This is then followed by presenting the node under attack with a deceptive state
    of the ledger, often by manipulating the node''s time perception under attack
    (e.g., Timejacking, Delay attack).


    Mining nodes and consensus mechanisms are vulnerable too. A mining node can be
    dishonest and selfishly withhold some of the already mined blocks (e.g., Selfish
    mining, Block withholding). In this manner, miners attempt to increase their share
    of the reward. Effective countermeasures include the application of block timers
    or increasing the randomness of the miner pool assignments.'
