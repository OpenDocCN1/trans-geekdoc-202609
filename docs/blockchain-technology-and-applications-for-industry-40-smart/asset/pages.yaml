    could be performing the validation of each other''s actions, locations, poses.
    For example, in a swarm (i.e., in a team of agents/robot) by its general job,
    agents periodically send (to the blockchain P2P network) actual information from
    their motion sensors about their positions (and/or poses) and the positions of
    other agents in the swarm. With the blockchain''s consensus mechanism, a consensus
    about the actual positions of all agents can be achieved. In this way, the hacked
    robots (even the robots injected by an intruder) which misbehave intentionally
    could be identified, since they need some pieces of information that are in conflict
    with the consensus.


    +   5. Distributed decision making by a time-limited voting

    Implementation of different smart contracts on the blockchain can enable a complex
    behavior of a MARS-like time-limited voting or voting delegation, namely, certain
    actions (formulated in bytecode) can be proposed by a group of smart-contract
    agents, while another group of agents can vote for them. The result is an action
    scenario gathered through the collaboration of multiple agents, which can then
    be stored in the blockchain and distributed to the concerned agents/robots (see
    Fig. 4.1), and finally executed.


    +   6. Authentication/suitability check

    Complex MARS systems tend to be as efficient as possible. There might arise situations
    when some agents/robots use a shared physical resource but do not trust each other
    (as they may possess a certain level of artificial intelligence), which may cause
    undesirable consequences. Such situations may be resolved through appropriate
    decentralized applications based on blockchain, which involves methods for agents''
    authentication or checking agents'' suitability. The mistrust among robots is
    erased, and possible conflicts are avoided.


