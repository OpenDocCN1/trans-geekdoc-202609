    BTC''s market value has reached peaks so far. On the other hand, this increase
    in value motivated many attackers to hack or manipulate the BTC system, and a
    similar situation arose with a few other cryptocurrencies. Among many network-based
    types of attacks, two might disrupt the operation of the BTC network— partition
    attack and Delay Attack. Both attacks exploit weaknesses of the Border Gateway
    Protocol (BGP) – not confuse with the Byzantine Generals Problem – a broadly used
    routing by the routers over the Internet.


    These and other networkbased attacks are possible since the BTC network is highly
    centralized, as seen from the Internet routing perspective, namely the most significant
    Tier-1 Internet providers can intercept more than 60% of connections in the BTC
    network [10]. Apart from that, more than 60% of all nodes are concentrated in
    five countries, led by the USA with around one-quarter of all nodes. On the other
    hand, mining power is concentrated in only one – Chinese mining pools control
    approximately 80% of total hash power. The largest mining pools are located in
    China, which mines approximately 70% of all BTCs [11]. As a result, the centralization
    of mining power in a single country is one of the biggest issues for the BTC community,
    at the moment.


    The precondition of a partition attack is the isolation of a group of victim nodes
    from the BTC nodes. In this way, the BTC network is split into two parts by the
    attacker(the smaller and the bigger), with no communication between them. Consequently,
    the block is solved in both parts, and then each solved block is broadcast within
    its part. When the attacker stops the attack and establishes the communication
    between these parts, all blocks mined within the smaller part (with less mining
    power) will be discarded, as will all the transactions and the miners'' revenue.


    The Delay Attack effectively slows down the propagation of blocks towards a victim.
    The main goal is to keep the victim uninformed about a new block for almost 20
    min. Unlike a partition attack where the victim''s connection is voided, in a
    delay attack, the attacker conducts a Man-in-the-Middle attack between a victim
    and its peer node, modifying BTC messages from the victim. Due to the manipulation,
    a victim node (i.e., the miner) gets a different piece of information from the
    requested as, that is, what it did not know for – after mining, a new block somewhere
    in the network, the new block''s hash is announced and propagated through the
    network, reaching the victim node via its peer and via the attacker who intercepts
