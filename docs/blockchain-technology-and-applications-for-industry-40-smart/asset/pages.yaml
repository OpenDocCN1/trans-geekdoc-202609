  md: '# 4.3.1 Smart grid conceptual model


    services. However, the practical application of DLTs in a smart grid infrastructure
    is far from being straightforward.


    The electric grid is a hierarchically structured system. The structure results
    from the geographical disposition of the grid segments into seven domains and
    affects the roles of the actors involved in the grid operation. A systematic smart
    grid architectural model [77] helps achieve interoperability across technical
    domains and different stakeholders of the massively scaled, distributed SG system.
    A service-oriented approach was taken regarding cross-business impacts. The model
    provides the stakeholders a common understanding of the elements that make up
    the smart grid and provides guidance for the implementation architecture. In the
    smart grid conceptual model, NIST viewed as a part of the architectural model,
    divided the smart grid into seven domains, as shown in Fig. 4.2. Each domain encompasses
    smart grid conceptual roles and services.


    The customer domain refers to the end-users of electricity, which may generate,
    store, and manage energy. Usually, three customer types are discussed, each with
    its sub-domain: home, commercial/building, and industrial. In the markets domain,
    there are the operators and participants in electricity markets, and in the provider
    domain, the organizations provide services to electrical customers and utilities.
    The operations refer to managers of the movement of electricity. In the generation
    domain are the generators of electricity, including traditional generation sources
    and distributed energy are the carriers of bulk electricity over long distances,
    and in the distribution domain are the distributors of electricity to and from
    customers. Generation, transmission and distribution domains also may store electricity.


    The three customer sub-domains—the home, the commercial/building, and the industrial,
    differ in energy needs and distribution scale. Actors in the customer domain provide
    customers with the electrical flows. Apart from that, they provide the information
    flow between the customer domain and other domains. The boundaries of the customer
    domain are usually the utility meter or the home gateway (also referred to as
    the energy service interface, ESI). The gateway interconnects the outbound and
    the inbound communications; it may communicate with other domains via the advanced
    metering infrastructure (AMI) or the Internet. It faces facility-based systems,
    such as a home or building automation system. The customer domain directly interacts
    with the distribution, operations, markets, and service provider domains.'
