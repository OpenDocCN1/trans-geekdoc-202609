  md: '# 50 2 Decentralized applications


    are prominent examples of public DL networks, for example, Bitcoin and Ethereum.


    A private DL network is distributed, but the governance of the nodes and network
    is centralized to a single system proprietor. It, therefore, does not provide
    any decentralized trust. Limited or unlimited user service access cannot compensate
    for this lack of decentralization. Sometimes, the privately controlled networks
    tend to be presented as public, primarily to gain the trust in the cryptocurrencies
    they provide. In the current version 1.0 of the IOTA network, for example, they
    only become genuinely when the network Coordinator node confirms them. All coordinator
    nodes are operated and controlled by the IOTA Foundation, which has, in the past,
    already utilized this to modify the transaction ledger.


    In a private DL, we can apply the same technology and even the same initial setting
    as a private network. For example, we can use the same network software (e.g.,
    the Geth client for Ethereum), select the same consensus algorithm, and apply
    the same chain generation settings as in the private mainnet. We would probably
    have a much lower number of nodes in our network, but the operation of both networks
    would be very similar. There would be of, a difference in the chain data, but
    this would be due to different service usage patterns and different network operations.
    The key difference between the public and private network would thus be in their
    governance, apart from the use of course.


    Nevertheless, in private DL networks, we usually do not try to mimic the existent
    ones. Instead, we apply different chain generation settings or even changed DL
    protocols to improve network performance, vastly. The key benefit of a private
    DL network is that we can trim it for performance.


    The challenge of centralized governance in public networks can, to a large extent,
    be limited in the consortium DL networks. Here, the network control is still not
    public, but it is also not limited to a single central entity. Usually, a consortium
    of partners is built, having a common objective – for example, a DApp that connects
    distributed energy resources producers, who do not necessarily trust each other
    are interested in collaboration. Every consortium partner can set up nodes and
    participate in consensus decisions, the control is now, to some extent, decentralized.
    It is still not as decentralized as in the public networks, but this might not
    even be needed. In a consortium network, we do not have anonymous participants
    in the network, so the outlaw can be penalized in other ways, for example, with
    exclusion from the partnership or with legal measures. Consortium-based DL network
