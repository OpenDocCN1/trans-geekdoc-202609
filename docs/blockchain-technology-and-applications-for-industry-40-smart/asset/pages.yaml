- pgno: 12
  md: '# List of notions


    Ledger


    A book, a list, or other collection of financial accounts and/ornttransactions.


    51% Attack


    A potential attack on a blockchain network, where a single entityorganization
    is able to control the majority of the hash power,potentially causing a network
    disruption. In such a scenario, the attacker would have enough mining power to
    intentionally exclude or modify the ordering of transactions.


    6-blocks Confirmation


    A period of time (commonly around 60 min) necessary for addingnew blocks behind
    a solved block that contains some transaction. After this period, the transaction
    is considered confirmed because creating a new version of the blockchain that
    will not contain a given transaction becomes too difficult, because too expensive
    in computing power.


    Altcoins

    Artificial Neural

    Networks


    A computing system is based on a collection of connected unitsor called artificial
    neurons, which loosely model theneurons in a biological brain.


    Bitcoin


    The most popular cryptocurrency, running on a blockchaincreated in January 2009
    by an unknown person under thepseudonym Satoshi Nakamoto.


    Bitcoin/Digital Wallet


    A software program for holding and trading Bitcoins which uses to access the person’sprivate
    key (secret number) publicBitcoin address (an identifier of 26–35 alphanumericcharacters)
    and transaction signatures that need to be securelystored; the Bitcoin wallet
    comes in many forms – the four maintypes are desktop, mobile web, and hardware.


    Blockchain


    A distributed ledger consists of a series of transactionswhereeach block (except
    the first and the last) is linked with theprevious and next block by means of
    cryptography, making wayan unbreakable chain of blockchains.


    Blockchain Fork


    A situation within the community (of nodes/members ofablock P2P network) that
    occurs when the network existstwo or more versions of the blockchain (i.e., different
    nodesmayhave different versions of the file which contains blockchaindata


    Blockchain Mining


    A peer-to-peer process aimed to secure and verifytransactions of given cryptocurrency
    (such as Bitcoin).


    Border Gateway

    Protocol


    Protocol for routing of IP packets (routing protocol); it is astandardized exterior
    gateway protocol designed to exchangerouting and reachability information among
    autonomous systemsont the Internet.


    Branch Tip


    A tip that represents the last individual transaction in a branchtip bundle (see
    IOTA bundle).'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# List of notions


    Byzantine Fault Tolerant System A system that is tolerant (i.e., resistant) to
    Byzantine Generals Problem; in the strict sense, a BFT system is capable of functioning
    properly as long as the number of corrupted elements is less than or equal to
    two-thirds of the overall number of elements.


    Byzantine Generals Problem A class of failures where some of the components/elements
    of a system may be corrupted in the sense that the symptoms (appearance, behavior)
    that prevent other system''s components from reaching agreement (i.e., consensus)
    among themselves.


    Car-to-Car Communication Communication that takes place between vehicles with
    the aim of sharing information that can be used for traffic control or to warn
    drivers of dangers.


    Consensus mechanism A mechanism (set of rules and protocols) that ensures that
    all participants dispose duplicate copies of the distributed database files (i.e.,
    of the distributed ledger).


    Coordinator (in the context of Tangle) A mechanism implemented by IOTA Foundation
    with the aim to protect against vulnerabilities double-spending (as Tangle is
    not fully developed, the overall number of nodes and hash power in the IOTA network
    are relatively low); the Coordinator mechanism assumes the assurance of a milestone
    transaction every minutes.


    Cryptocurrency A digital currency in encryption techniques are used to regulate
    the generation of units and verify the transfer of funds, operating independently
    of a central authority, i.e., of a central bank; most of the cryptocurrencies
    are based on blockchain technology.


    Cumulative Weight A metric using the Random Walk algorithm for tip selection in
    the Tangle; the cumulative weight of a transaction in the Tangle is the total
    number (plus 1) of all transactions which come after, and at the same time, approved
    that transaction directly or indirectly.


    Decentralized Application A computer application that runs on a decentralized
    computing system. Daps have been popularized by distributed ledger technologies
    such as the Ethereum blockchain; Smart contracts are a key part of Daps.


    Delay Attack The Bitcoin''s P2P network that exploits weaknesses of Border Gateway
    Protocol (similarly as partition attack); in Delay Attack, the propagation of
    blocks towards a victim is effectively slowed down, that is; the main goal is
    to keep the victim uninformed about a new block for almost 20 min, which is achieved
    through a Man-in-the-Middle attack where attacker modifies messages from victim
    to the victim''s peer node; as the victim inquiring messages are wrong (due to
    modifications performed by an attacker), the victim node is unable to get from
    the network the freshest solved block (in order to add it on its copy of the blockchain);
    the victim wastes its computing power and time, instead of using it for solving
    the next block; consequently, the victim loses its possible earnings.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# List of notices — XV


    # Denial of Service Attacks


    Cyber-attack that makes unavailable a host (computer, machine, network resource)
    connected to the Internet; typically accomplished by flooding the targeted host
    with excessive requests with the aim to overload the system and prevent legitimate
    requests from being fulfilled.


    # Difficulty


    The algorithm implemented within Bitcoin blockchain that regulates the level of
    difficulty for solving the PoW task (block solving), that in average, the frequency
    of block solving is one every 10 minutes (i.e., 2016 solved blocks for 14 days);
    as a parameter, it is defined as Difficulty = 1/target\_value, showing how many
    times it is more difficult to find a 256-bit long hash below current target value
    (determined by parameter\_value) to find a hash below a 256-bit reference value
    (determined by parameter\_target\_value) which has 22 leading zeros.


    # Difficulty Target


    Name of a 32-bit field in header that contains parameter\_value represented via
    24-bit mantissa and 8-bit exponent; content of this field in hexadecimal is known
    as bits.


    # Digital Twin


    A digital replica of potential and actual assets (physical twin), processes, places,
    systems, and devices that can be used for various purposes.


    # Directed Acyclic Graph


    A finite directed graph with no directed cycles.


    # Distributed Ledger


    A consensus of replicated, shared, and synchronized digital data geographically
    across multiple sites, countries, or institutions.


    # Double Hash (or Hash-hash)


    Generally, double hashing is a computer programming technique to resolve hash
    collisions by a secondary hash of the key as an offset when a collision occurs;
    in the Bitcoin blockchain, double-hashing is realized through double use of SHA-256
    hashing function, that is, f(x) = sha256(sha256).


    # Double Spending Problem


    A potential flaw in a digital cash scheme where the same single digital token
    can be spent more than once; if two transactions (one of is tricky) are sent into
    the network using the same private key of a fraudulent sender (a buyer in two
    different transactions), but sent to different receiving addresses (sellers in
    different transactions); as two transactions propagate through the network, one
    part of the network will accept one transaction and the other part another.


    # Ethash


    A PoW mining algorithm implemented by the Ethereum network and Ethereum-based
    cryptocurrencies; it Ethash is a hash function that belongs to the same (Keccak)
    family of hash functions, but differs from SHA-3; Ethash was developed with a
    strong focus on protection from Application Specific Integrated Circuits miners,
    who were primarily mining Bitcoins.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# List of notions


    Native (cryptocurrency) of the Ethereum blockchain; initially, Ether was not seen
    as a common currency with the main purpose as a means of paying goods and services
    online, but as an incentive mechanism to power the Ethereum blockchain.


    Ether


    A decentralized open-source blockchain that features smart contract functionality
    (a project started in 2013 and led by Vitalik Buterin). It is the second-largest
    cryptocurrency platform by market capitalization (behind Bitcoin).


    Ethereum Blockchain


    A data structure created by a node in the hashgraph P2P network at the moment
    of receiving/synchronization message from another (sending) node; it contains
    a payload (information about new transactions and other gossips among nodes by
    sending from the previously received gossip/sync messages) and two hash values
    that refer to two previous events self-parent and other-parent event.


    Event (in the context of hashgraph)


    A witness of a round is elected as the famous for that round, in a virtual voting
    procedure performed by the witnesses of two (or more) rulers; it is the witness
    that most nodes have learned of fairly after it was created.


    Famous Witness (in the context of hashgraph)


    A government-issued currency that is not backed by a commodity such as gold.


    Fiat currency/Fiat money


    The first transaction in the Tangle/IOTA which was created the whole amount of
    IOTA tokens.


    Genesis/Genesis Event


    A procedure or process of P2P communication based on the way epidemics spread;
    used by some distributed systems to ensure that data is shared to all members
    of a group; in some ad-networks, gossip protocol assumes that members forward
    received data to their neighbors.


    Gossip Protocol


    A block in the hashgraph, after which were six or more new blocks, it is considered
    that blockchain forks cannot exist in the blockchain area before the guaranteed
    block.


    Guaranteed (or Secured) Block


    The number of hashes per second a computing device is capable of executing.


    Hash Rate/Power


    A numeric value of a fixed length that uniquely identifies (a portion) of data,
    derived as the result of a hash function applied to the data; as the Bitcoin blockchain
    uses a hash-hash algorithm, i.e., the SHA-256 function implemented over input
    data (of a transaction block), a hash value (of the header of the block in the
    blockchain) written in the block header (of an actual block) is 256 bits long.


    Hash Value


    A permitted ledger/platform developed by Leemon Baird (in 2016) and supported
    by Hedera hashgraph LLC applies the hashgraph algorithm - a new gossip protocol
    (logically based on a DAG) that enables a fully Byzantine fault-tolerant consensus
    mechanism; besides native cryptocurrency (the Hedera token), the platform is designed
    to provide other services such as file storage and smart contracts, i.e., the
    development of permissionless decentralized applications.


    Hashgraph'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# List of notions — XVII


    Hedera Hashgraph Council


    Governing body aiming at supporting the evolution of a stable and decentralized
    public ledger infrastructure based on the Hashgraph consensus algorithm.


    Hedera Hashgraph LLC


    A company that launched the Hashgraph project; provides a public ledger platform
    for the project''s support.


    Hidden Tip


    A tip that is not seen by a node due to the propagating delay in the IOTA network.


    Industry 4.0


    A term used as a meaning for the fourth industrial revolution; as it is not yet
    defined, it rather defines a set of emerging technologies and tools with a potential
    to drastically improve manufacturing processes; it also refers to the synergy
    between traditional industrial processes and digitalization, whereby the achieved
    manufacturing solutions are performed through the intelligent networking of machines
    and processes in the industry with the help of information and communication technology.


    Input Transaction (in a bundle)


    An individual transaction (in a bundle) with the Value that contains a negative
    value, meaning that the account specified by the field Address is charged with
    the amount of IOTAs specified in the Value field.


    Internet of Things


    A system of interrelated computing devices, mechanical and digital machines provided
    with unique identifiers and the ability to transfer data over a network without
    requiring human-to-human or human-to-computer interaction.


    IOTA Bundle


    A set of several consecutive individual transactions that represent one transaction
    in Tangle, whereby each individual transaction in a bundle directly approves the
    previous individual transaction, and all together approve the same trunk tip –
    the last transaction in another (previous) bundle called trunk tip, also individual
    transaction in a bundle, first transaction in a bundle, besides trunk tip, also
    approves the branch tip – the last individual transaction in another (previous)
    bundle called branch tip.


    Lazy Tip


    A tip, i.e., an older transaction in the Tangle selected for approval (by the
    newest transaction), which had already been approved by other transactions that
    come after.


    LIDAR


    A method for measuring distances (ranging) by illuminating the target with light
    and measuring the reflection with a sensor. A blockchain-based cryptocurrency
    and launched by Charlie Lee in 2011; it differs from Bitcoin in aspects like faster
    block generation rate and use of script algorithm as PoW, which requires much
    more memory than Bitcoin’s hash-hash PoW algorithm; Litecoin is mentioned as the
    silver to Bitcoin’s gold.


    Litecoin


    Direct communication between devices using any communications channel, including
    wired and wireless.


    Machine to Machine Communication'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# List of notions


    +   Man-in-the-Middle Attack


    An attack where the attacker secretly relays and possibly alters the communications
    between two parties who believe that they are directly communicating with each
    other.


    +   Master Shard


    Entity (of the Hedera platform) that controls the allocation of nodes to different
    shards.


    +   Merkle Tree


    A hash-based data structure with which each leaf node is a hash generalization
    of the hash list of data, and each non-leaf node is a hash of data; Merkle trees
    have a branching factor of 2, meaning that each node has up to 2 children.


    +   Meta Transaction (in a bundle)


    An individual transaction (in a bundle) value written in the field Value, meta
    transactions are used as extensions of input transactions, usually having the
    tail parts of the input transactions'' signatures.


    +   Milestone (in the context of)


    A transaction in the Tangle issued by the IOTA Foundation as a guarantee that
    all transactions approved directly or indirectly by this transaction are immediately
    considered as part of the consensus.


    +   Miner


    A participant/node in the PPP network involved in the blockchain mining process,
    in which miners try to solve a computationally intensive task (typically a mathematical
    problem or puzzle) in order to gain the opportunity to add a new block of transactions
    to the blockchain, and as a reward, to earn an amount of cryptocurrency (defined
    by the applied algorithm), as well as to get the transaction''s fee.


    +   Mining Pool


    A joint group of cryptocurrency miners who combine their computational resources
    over a network to solve a PoW task and add a block of transactions to the blockchain;
    if the pool does the PoW successfully, it is rewarded with cryptocurrency tokens;
    the reward is divided among the miners according to the proportion of each miner''s
    processing power relative to the work done.


    +   Multi-homing


    The practice of connecting a host or computer network to more than one network.
    Most commonly, it is to increase reliability or performance.


    +   Node


    A participant in the PPP network of a particular blockchain on which is the blockchain''s
    native coin/cryptography or decentralization platform.


    +   Nonce


    Abbreviation for the number only used that blockchain miners are solving, i.e.,
    for search, before adding a new block to the blockchain; it is a 32-bit value
    in the header of a transaction block (of the Bitcoin blockchain) which meets the
    difficulty level restrictions in the sense that the 256-bit hash value of the
    block header (with the nonce) is small enough, i.e., that has a required number
