    # 1.2.2 Vulnerabilities of the BTC and issues handling


    Even before the BTC, there have been attempts to create sustainable digital money.
    All the attempts failed because there are no reliable mechanisms to prevent scenarios
    in which transactions are copied and spent (i.e., realized) twice. It is good
    to know that the BTC successfully solves this double-spending problem through
    the blockchain concept with PoW, where each transaction is time-stamped.


    A double-spending problem appears if two transactions (one of which is tricky)
    are sent into the network using the same private key (of a fraudulent sender)
    to receiving different addresses. These two transactions propagate through the
    network, one part of the network will accept one transaction and the other part,
    another. The defense mechanism inherent in the BTC blockchain is that only the
