    then, as a new block is (probably) solved and added to the blockchain. In this
    way, the victim wastes its computing power and time instead of solving the next
    block. The possible profit is lost as well.


    Various measures can be used to combat or prevent both partition and Delay Attacks.
    They may include multi-homing [10] of a mining pool (to prevent Delay Attack),
    various filtering techniques applied by Internet service providers (against partition
    attack), BGP traffic monitoring, or upgrades of the BGP protocol (on appropriate
    routes) with security patches.


    Numerous threats to different entities of the BTC system can also appear, might
    cause problems if not treated properly. Without going into details, let us name
    some of them: threat vulnerability of digital wallets, Sybil attack [12] through
    creation of pseudo-identities of nodes), Denial of Service (DoS) attacks, energy
    consumption, tracing a coin''s history (connecting identity to address), clock
    drift on a victim node (time jacking), illegal content in the blockchain, and
    so on.


    # 1.2.3 Alternative platforms and cryptocurrencies based on blockchain


    In the previous sections, the focus was on the BTC as the oldest and most prominent
    cryptocurrency. Besides, it served as a suitable example to explain the blockchain
    concept and mechanisms such as DL, PoW, community consensus, trustless truth,
    or incentive mechanism.


    The success of the BTC paved the way for many alternate cryptocurrencies, known
    as altcoins. Hundreds of altcoins, many are based on the same framework as the
    BTC, that is, they include P2P network, blockchain, and a mining process with
    a kind of PoW to verify transactions on the web. On the other hand, altcoins differ
    among themselves and differ from the BTC in many ways – such as in PoW algorithms,
    procedural variations, different ways of spending energy for block mining, or
    the improvements taken for achieving better anonymity of users. After the BTC,
    the new alternate cryptocurrencies that emerged were created with the main goal
    of replacing the BTC, or at least, repeat its success. Many altcoins are targeting
    the perceived constraints and shortcomings of the BTC and aim to achieve a few
    competitive advantages.'
