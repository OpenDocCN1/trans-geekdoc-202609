    and reduces the transaction costs.


    # 3.5 Integration schemes of internet of things and the distributed ledger


    Embedded IoT devices are often characterized by low power consumption for prolonged
    battery autonomy and are prone to stringent production cost containment because
    of their mass scale. This limits the computation and storage capabilities of IoT
    devices and their cryptographic capabilities. For energy efficiency in IoT, WAN
    (e.g., LoRaWAN, NB-IoT) or PAN (e.g., Bluetooth), wireless communication technologies
    are optimized for low power operation. IoT devices are, however, not used as full
    nodes, because the computation and communication overheads do not justify the
    potential benefits or because full blockchain is simply impossible to be implemented
    in a constrained device [47].


    The processing power of a constrained device limits the use of advanced encryption
    protocols and limits the blockchain functions that a constrained device can execute.
    Limited storage makes it impossible to keep the entire chain data or even all
    block headers in an IoT device.


    The communication traffic of a blockchain network node consists of continuous
    traffic for synchronization with the blockchain network and a sporadic traffic
    due to transaction submission and event notification. The continuous traffic results
    from the DL network operation and is not affected by the DApp design and implementation.
    The only way to alleviate continuous traffic from the IoT device is to withdraw
    blockchain synchronization protocols and allocate them to a capable gateway. The
    sporadic traffic is application dependent and can be, at least to some extent,
    limited by appropriate DApp workflow design. It occurs only when the device-machine
    interface (MI) submits a new transaction to the network for confirmation or a
    device receives an event notification for MI applications in the device, to react
    to state changes in smart contracts.


    Limited user interactions with IoT devices, for example, in unmanned devices without
    user interfaces, inhibit flexible and secure management of blockchain credentials
    needed for security and identification. This impacts device enrolment and authentication
    procedures.'
