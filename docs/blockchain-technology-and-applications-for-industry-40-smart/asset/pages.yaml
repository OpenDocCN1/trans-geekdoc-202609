  md: '# 62 — 2 Decentralized applications


    chain solutions are a very novel research area. They not only contribute to the
    scalability of DL networks but are also crucial for DL interoperability.


    # 2.3.3.1 Sharding


    Sharding is an on-chain method, where the DL network topology is divided into
    several smaller networks, called shards. Each shard contains a part of the network
    nodes. Different shards process transactions in the network. This reduces the
    number of transactions that have to be processed by each node has two positive
    consequences:


    +   - State sharding — nodes keep only data of their shard. This reduces the nodes''
    system requirements and reduces the bootstrap time.


    +   - Transaction sharding — transactions are distributed among different shards;
    they can be processed and verified in parallel. This increases the throughput
    of the entire network. A reduced number of nodes in a shard accelerates the block
    propagation, too.


    But such a chain of network topology has several difficulties. For the performance
    increase with sharding, we sacrifice decentralization and thus the trust in the
    system. Distribution is also reduced, so common DL security risks (51% attack)
    become emphasized. Another problem is that transactions originating in one and
    destined to another shard. These cross-shard transactions are more difficult to
    propagate between the shards. Therefore, the efficiency of sharing is strongly
    dependent on the statistical properties of the transactions and, thus, on a particular
    use case.


    A modified sharding approach consists of the main chain (network) and multiple
    shards. Each shard periodically commits its state to the main chain. In this way,
    the trust in the shard data can be verified. The cross-shard transactions are
    processed via the main chain. The efficiency of this approach suffers enormously,
    if the number of cross-shard transactions increases and the main network becomes
    a bottleneck.


    Research on sharding investigates how to allocate nodes into shards efficiently
    and how to protect decentralization and security. Most of the sharding development
    and implementation focus on DL networks, often, those with Pow consensus. In private
    or consortium networks, performance is increased, instead, by trimming the main
    network operation.


    # 2.3.3.2 Off-chain state channels


    State channels are a complementary off-chain method that temporarily off-loads
    the transactions between two DL accounts from the DL network into a dedicated
    channel. State channels are also known as payment channels, if the transactions
    predominantly exchange value between accounts and not tokens or smart contracts
    calls.'
