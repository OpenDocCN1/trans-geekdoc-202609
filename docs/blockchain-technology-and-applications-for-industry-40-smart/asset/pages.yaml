    # 3.5.1 Distributed ledger networks for internet of things


    Distributed ledger networks are discussed in detail in Section 2.3. In IoT, we
    try to attain performance, scalability, network costs, and privacy. The requirement
    by IoT devices on a DL network need be different from that of the DeFi application.
    Such divergent application aspects need to be combined in the same decentralized
    application, both the public and consortium networks (Section 2.3,3.3) can be
    applied and cross-chained (Section 2.3.3.3). In public networks, other consensus
    algorithms from PoW can be used as PoS or PoA (Section 3.2.1) to reduce transaction
    costs and improve performance. In private or consortium networks for IoT, a simplified
    version of the PoW consensus can be found. However, this reduces the decentralization
    and the inherent trust. Some of the distributed ledger technologies try to combine
