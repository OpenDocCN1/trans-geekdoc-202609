    # 2.3.2 Network performance


    It is challenging to address DL performance systematically and in an ordinary
    way because it intertwines many divergent technologies, network implementation,
    performance criteria, or use-related expectations.


    Transaction throughput (number of transactions per second, tps) and transaction
    confirmation latency (delay) are the two most straightforward performance metrics.
    However, it is difficult to compare these two metrics among different DLTs or
    networks. Transaction throughput and latency of current DL systems cannot be compared
    to the figures of the centralized or distributed database services [22]. Often,
    much of the bad user experience can be related to misconceived or insufficient
    understanding of the underlying technology, or inappropriately chosen cases for
    the DLT. Beside, it is impossible and unfair to judge the performance of a DLT
    based on (only) one network implementation. For example, the Ethereum technology
    performance cannot be estimated only on the quantitative experience (measure-ments),
    for example, the Ethereum maine. The same technology (software) can be implemented
    in a private or consortium network. Different network sizes or settings ensure
    dramatically different performance in terms of throughput and latency. This is
    true for all DLT architectures, where different deployments are allowed.


    It is often hard to obtain relevant and comparable performance results. Theoretical
    but realistic performance stress tests in public networks are difficult to execute,
    for example, due to transaction costs. Analyses of smaller private networks with
    the same DLT cannot fully mimic large distributed networks. Furthermore, some
    DLT and network providers are approaching performance aspects of their systems
    systematically and backed by research (Hyperledger Fabric [23]) and tools (Caliper)
    (Fig. 2.4). Others provide and detailed statistics about the network (see Section
    2.6.4). Some merely present impressive figures that cannot be replicated and lack
    transaction methodology.


    Apart from transaction throughput and latency, several other metrics become important
    with real-world network deployments and DApps. These include DL network energy
    consumption, resource requirements put on nodes (e.g., storage for the chain data)
    and off-chain clients (e.g., transaction generation-related encryption in constrained
    IoT devices), or transaction costs.'
