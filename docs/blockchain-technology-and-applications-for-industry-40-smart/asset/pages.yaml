- pgno: 23
  md: '# 1 Distributed ledger technologies


    A consensus accomplished by PoS is a process in which a new block is validated
    only by the participants having enough stakes, that is, by the rich members. They
    have many native tokens (cryptocurrency) of a concrete DL on their accounts. The
    PoS concept is based on the idea that the trustworthiness in the network (and
    in value of token) decreases if everyone perform block validations, and consequently
    increases the possibility of validation of illegitimate blocks. Hence, the only
    way of keeping the system''s trust is by leaving the block validation to the members
    who might lose much money acting in irresponsible ways. Regarding energy consumption,
    PoS is faster and more efficient than PoW (but less proven).


    In the PoSpace concept, the available space (memory) on hard disks of the miners''
    computers is the resource used for mining (instead of computational power used
    with PoW). It is also called Proof of Capacity (PoC). Compared to PoW, this concept
    also saves time and energy. PoSpace is a good solution for anti-spam measures
    and the prevention of DoS attacks. It could also be useful in preventing the centralization
    of mining power in pools.


    There are two types of DLs: public and private, depending on the peer-to-peer
    (P2P) network rely by certain entities, there are also two types of DL: permissionless
    and permissioned. In a permissionless DL, each node of the network has the full
    and freshest copy of the complete ledger. Every ledger update (addition of a new
    block) is communicated to all nodes in the network, which then collectively validate
    the validation, a new block is added to each node''s copy of the ledger. Data
    consistency across the network is assured in that way. This means that a permissionless
    DL is fully democratic and with no central control, provided each participant
    follows the predefined rules. In a permissioned DL, however, a central entity
    grants the permissions to nodes for accessing the network and making changes to
    the ledger. At the same time, the central entity can also verify the identity
    of the participants who try to access the network.


    As there are number of DLT applications that boost autonomous driving, this chapter
    will consider basic DL architectures and their properties and use cases of these
    technologies in the concept of autonomous vehicles.


    Three basic DLT architectures will be considered for comparing DLT characters
    in the remaining part of the paper: chain or list, Directed Acyclic Graph (DAG)
    as a tangle, and as a tree. A typical representative of the chain or list is a
    blockchain, which is the basis for the oldest and most widely used cryptocurrency
    – the Bitcoin (BTC), invented in 2008 by Satoshi Nakamoto [1]. DAG is a finite
    graph with no directed cycles and consists of many finite vertices and edges.
    Each edge is directed from one vertex to another but with no loops. Tangle is
    a basis for IOTA, a cryptocurrency that is one of the main concerns of the BTC,
    especially in the field of M2M communications. IOTA was founded in 2015 by David
    Onstebo, Sergey Ivancheco, Dominik Schiener, and Sergei Popov [2] and has worked
    formally as IOTA Foundation since 2017. DAG as a tree is the newest DLT architecture,
    which'
