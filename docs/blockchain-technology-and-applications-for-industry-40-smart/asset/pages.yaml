- pgno: 61
  md: '# 1 Distributed ledger technologies


    which is explained in Section 1. When a node joins the network, it must declare
    accounts that it can control, while the amount of cryptocurrency in those accounts
    is used as the stake that weights the node''s votes in the hashgraph virtual voting
    algorithm. As mentioned, each node is paid by Hedera on a daily basis (for serving
    as a node) – the payments are proportional to its stake, so the stake of a node
    is earning interest.


    The voting in the virtual voting algorithm is relatively easy to implement – it
    can be done through a simple redefinition of the notions of the majority, supermajority,
    and the median value. Instead of at least 2/3 of the number of nodes in the community,
    the term supermajority now represents a group of nodes whose stakes in the sum
    have at least 2/3 of the total amount of money on the accounts of all nodes in
    the community. Similarly, the term majority is redefined, and now means more than
    50% of the total amount of stakes. The median of the timestamps in a set S events
    becomes the weighted median, which can be considered as the median value of the
    enlarged set, $Enlarged$ of the timestamps, where each timestamp $t_i$ from $S$
    is, represented by $n_i$ copies of itself, such that $n_i$ is equal to the stake
    of the node that has created the event with timestamp $t_i$.


    The new meaning of supermajority implicitly changes the definition of seeing events
    in the Hashgraph. Together with the new meaning of the median (i.e., weighted
    median), it influences the order of the consensus transactions, so that the wealthier
    (the more trusted) nodes have more power to reach the consensus as some group
    of new nodes with insincere intentions.


    Besides the described mechanisms incorporated in the Hashgraph, such as the fee
    and payment model aimed at incentivizing node operators to participate, or the
    PoS model for inhibition of Sybil attacks and other malicious behaviors, Hedera
    introduces the codasharding architecture to ensure future scalability of the platform,
    which is also necessary for the success of a public permissionless ledger. This
    comes from the separation of governance from consensus. As the network is expected
    to expand over time to millions of nodes (all voting on distributed consensus),
    the sharding architecture enables continuous platform decentralization.


    In its initial phase, the Hedera network will certainly have a relatively small
    number of nodes belonging to a single shard (partition, group). With the expected
    increase of their number in the network, nodes will be grouped in different shards.
    The entity in charge of allocating nodes to shards is called the master shard,
    which randomly assigns new nodes to different shards, once a day. At the same
    time, the master shard moves nodes between shards to ensure that the total amount
    of cryptocurrency staked in a shard is large enough and that no node in a shard
    owns a large fraction of that amount. All nodes in a shard establish consensus
    on the transactions they collected from their clients and gossiped among themselves,
    that is, they share the state of their client''s accounts, which is a subset of
    the state of the entire ledger.'
