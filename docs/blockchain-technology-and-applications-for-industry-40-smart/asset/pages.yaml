  md: '# 1 Distributed ledger technologies


    Hashgraph Council (HHC) is a governing body aiming at supporting the evolution
    of a stable and decentralized ledger infrastructure based on the hashgraph consensus
    algorithm. HHC will follow the rules to ensure that no single member or a small
    group of members will have control over the body as a whole. On behalf of the
    council, the elected Governing Board will establish the council membership policy,
    regulate the network rules and token issuance, and approve changes to the platform
    codebase. The governance rules foster the philosophy of decentralization and prevent
    the concentration of power over the process of reaching consensus on the transaction
    order. Such a governing model will eliminate the risk of ledger splitting, guarantee
    the codebase integrity, and provide open access to the protected core. Protected
    core ensures that the hashgraph algorithm is not license-free. Specifically, the
    intellectual property rights in the algorithm are held by Swirls, Inc. (the company
    founded by the inventors of the algorithm). At the same time, the HHC has a license
    from Swirls to use it for the Hedera public platform. On the other hand, neither
    license nor Hedera''s approval will be required to use the Hedera hashgraph platform
    or software that uses the platform services. In contrast, the applications built
    upon the platform can be open source or proprietary.


    Properties necessary for the broad adoption of a DL platform are trust and stability.
    Hedera''s governance model (with its governing rules) and the implemented strong
    security mechanisms are the key factors for a stable platform that creates trust.
    Apart from that, the HHC''s policies and structure are intended to guarantee a
    wide and fair distribution of native cryptocurrency of the Hedera DL platform
    and to ensure a full network nodes'' application. As a result, the nodes will
    be compensated for the services in maintaining the Hashgraph platform through
    the specially designed incentive model. And consequently, at the same time, the
    new nodes (i.e., new node operators) will be able to join the network.


    The entire system of payments (incentives) and fees introduced by Hedera significantly
    differs from the incentive mechanism of the BTC (or other altcoins), where clients
    (i.e., digital wallets) pay a fee for each verified transaction. At the same time,
    nodes earn money through mining if they are successful in solving the PoW tasks.
    As explained, the Hashgraph is not based on PoW, so there is no mining that would
    motivate nodes to perform transaction verification. Instead, Hedgraph''s paying
    model is based on three types of fees to nodes or to Hedera paid by clients, and
    two types of payments Hedera pays to nodes or governing members:


    +   Node fee – a client pays this fee to a node for a provided service. Suppose
    the client wants to transfer cryptocurrency from one to another''s account. In
    the case, he contacts a node that submits the transaction to the network (on the
    client''s behalf), that is, the node puts that transaction into the next event
    it creates and gossips it to a neighbor node to be put into consensus through
    the hashgraph consensus mechanism. Node fee is not determined in advance, but
    it is negotiated between node and client.'
