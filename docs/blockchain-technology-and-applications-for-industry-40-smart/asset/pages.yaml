    # 3.1.1 Confidentiality and privacy


    A shared ledger is a common truth that assures trust in the distributed ledger
    technology system. In public blockchain networks, access to the ledger is not
    at all limited. Anyone can access, read, and redistribute the content of the ledger,
    including all transactions. Everyone can analyze every detail of each past transaction
    in a blockchain network. In public networks, users do not have to present any
    personal identity to create a new blockchain account. This keeps them as persons,
    but the account activities, including the cryptocurrency balance, are public.
    Public DLT networks are,pseudo-anonymous. Frequently, for regulatory reasons,
    personal identity must be verified when users create an account in crypto exchanges.
    This links their personal identity to their public blockchain accounts and discards
    their anonymity and privacy.


    In permitted networks, only the authenticated nodes have access to the ledger.
    Access to the ledger is not public, but is limited to known network participants.
    This is very favorable for business-related blockchain systems, for example, industrial
    IoT, smart grid, etc. Apart from this, there is usually no other ledger access
    control. Permissioned networks enhance the privacy of interactions by excluding
    anonymous public, but still do not enable confidentiality and privacy that are
    known in a traditional online application.


