    # 1.2.1 Proof of concept of work


    The answer to the previous questions and to how new BTCCs are issued can be found
    in the applied concept, PoW. The PoW concept is used for maintaining blockchain
    (DL) consistent, strong and unbreakable, which are key factors that create trustworthiness
    of the whole system and consensus in the community about the real value of cryptocurrency.


    The concept of PoW is not new. It has been used in computer networks with client-server
    mechanisms as a measure to discourage Denial of Service (DoS) attacks and other
    abuses as spam. The main property of PoW is its asymmetry – a client''s relatively
    hard work compared to the ease with which the result can be checked by a server.
    In the case of a blockchain, the result of the very difficult job of finding a
    valid nonce-hash pair by a successful miner (i.e., mining pool) is easily verified
    by other nodes.


    It has already been mentioned that the trustworthiness of the blockchain also
    contributes to the decentralization of the blockchain. Let us remember that the
    blockchain, as a DL of transactions blocks is realized using nodes, that the computers
    connected to the BTC P2P network. BTC full nodes are the computers running the
    BTC Core client with the complete blockchain. A transaction is a process of sending
    BTCs from the BTC wallet (i.e., address) of a sender to the BTC wallet of a person
    who receives money. Money senders broadcast transactions to the network. Full
    nodes validate transactions and relay to other nodes by broadcasting messages
    across the network. Within this decentralized infrastructure (P2P network), a
    set of miners collect transaction records, verify that each transaction is correct
    and not in conflict with previous transactions. They also check that the sender
    (whose identity is hidden behind an address) does not move more BTCs than is contained
    in the address (passing through the entire blockchain) and perform other functions.


    Each miner independently collects valid transactions and aggregates them into
    a candidate block. Then, a miner attempts to solve his candidate block through
    the PoW, that is, through the process of finding a valid hash (as described in
    Section 1.2). The first miner who successfully solves a candidate block broadcasts
    his solution to the network (including other miners) to be added to the blockchain.
    The key thing is here that the new block will be added to the blockchain only
    if more than 50% of miners say it has been solved correctly. And before saying
    that, miners have to make their calculations on the solved block, comparing their
    results to the solution that was broadcast. Two different candidate blocks may
    be solved at about the same time. In that situation, two solutions will propagate
    through the network (this situation is'
