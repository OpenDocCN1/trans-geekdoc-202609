    # 3.1 Distributed ledgers for IoT security


    Distributed ledger technology and blockchains, to a great degree, rely on advanced
    cybersecurity mechanisms and uniquely combine them to assure the trust expected
    from DLT systems. However, DLT does not improve all aspects of confidentiality,
    integrity, and availability of DL networks, systems, and applications. It does
    not come without its security risks (Table 3.1).


    Confidentiality is not the key feature that DLT was designed for. Sharing a common
    decentralized ledger among all network participants is essential to build decentralized
    trust. Unless very specific mechanisms and DL network architectures are applied,
    DL and network users are at most pseudo-anonymous.


    Integrity is a security feature that DLT invented for. It refers to the immutability
    of transactions, tamper-proof deployment, and execution of smart contract code.
    However, these features open new privacy and security risks, leading to unprecedented
    legal or ethical issues in the use of DLT applications and systems.


    Availability of a system to improve if the system is distributed and decentralized.
    Despite no single central point to be attacked in a DL network, DLT systems are
    not immune to denial of service or other attacks that impact availability. The
    attacks target the DL network services, consensus processes, or decentralized
    applications. The denial might affect only selected network nodes or network participants.
    Besides the DL network, there are few decentralized entities in the system that
