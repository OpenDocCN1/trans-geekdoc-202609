    # 3.4 Monetization


    Distributed ledger technology can successfully keep trusted records of monetary
    transactions. If this distributed ledger technology is integrated with IoT, it
    enables development of new business models. IoT ecosystems are extremely heterogeneous
    in their applications, technologies and involved stakeholders. A decentralized
    ecosystem business model, for example, in a smart city, can prioritize the overall
    benefits of the entire community and the greater ecosystem objectives, of maximizing
    fragmented values as the profit of the involved individual participants [58].


    The IoT business market is multi-faceted. Different entities in the ecosystem
    can serve multiple sides of the market and play various roles in the business
    model. Multi-faced roles of the participants not only affect the business model,
    they directly improve authentication and authorization in the system, supported
    by the decentralized approaches. Refer Section 3.3. In an illustrative example
    in Section 3.6, we demonstrate, to some extent, with a multi-faceted environment.
    For example, each autonomous machine can act as a service provider or a service
    consumer.


    Several vendors are involved in IoT ecosystem provisioning, including software
    and hardware vendors, communication and information service providers, and solution
    providers. They need compensation for their investments in IoT infrastructures,
    as well as for service provisioning. Monetization of data plays a key role in
    the IoT ecosystem, data ownership usually accompanied by rich contextual information,
    which can be monetized. However, this requires efficient and granular control
    over data. Two business models are prominent in data monetization. First, where
    the data owner offers their data in exchange for services provided by a third-party
    provider, and second, where the owner pays to keep his data protected while using
    the same services.'
