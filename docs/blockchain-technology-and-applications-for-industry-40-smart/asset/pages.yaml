    enable the integration of IoT devices. Apart from the blockchain network, the
    EW-DOS delivers several sets of SDKs for integration and application development.
    The EW Flex enables grid operators to integrate distributed energy resources (DERs)
    into energy markets and demand flexibility in programs. The EW Origin supports
