    of various entities, that is, network nodes and IoT devices. IoT devices usually
    act as issuers or requesters. The full or light nodes are not IoT end-devices
    but dedicated entities that provide blockchain capabilities. We can split blockchain
    functions (e.g., chain synchronization, event filtering, transaction creation,
    validation, or key-store management) between the IoT devices, device gateways,
    and full blockchain network nodes. Then, we adapt the off-chain logic to IoT device,
    accordingly [25]. A common approach is that the IoT device only creates and signs
    its transactions; the gateway performs all other blockchain operations and manages
    the entire communication with the blockchain network. Even a less demanding option
    is an IoT device without any capabilities, and a gateway, which runs all blockchain
    functions, including transaction creation and signing.


    An IoT device that is a transaction issuer is capable of building and signing
    a valid blockchain transaction. The issuer has a valid blockchain identity. It
    needs access to the key-store to properly sign the issued transaction. Access
    to the key store requires reliable authentication in the device and can impose
    hardware security risks. After a transaction is built, it is submitted to the
    blockchain network via API in one of the network nodes.'
