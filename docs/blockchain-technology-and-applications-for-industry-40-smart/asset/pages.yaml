    or breached


    +   - Privity – minimizing the vulnerability to third parties and excluding them
    from the knowledge and control over the content and performance of the contract
    (privacy and confidentiality)


    +   - Enforceability – minimizing the effort for enforcement, including self-enforcing
    protocols


    Szabo weant many of the findings, which several years later, implemented his ideas
