    # 2.6.3 Name services


    Given the immutable nature of blockchain technologies, accounts, data, and code
    cannot be changed or deleted. This means that whenever developers want to update
    a smart contract on a blockchain or a site hosted on Ethereum Swarm, they have
    to create a new one, which, of course, has a unique identifier that, is the Ethereum
    address. On the user side, the latest versions of a website or smart contract
    need to be always available at the same name, and this is preferred to be humanreadable.
    Traditional systems use DNS to solve this issue, binding human- names to IP addresses
    and simplifying back-end migrations, load balancing, and geographical optimizations.


    Ethereum Name Service (ENS) fulfills many of the equivalent needs present in the
    Ethereum ecosystem. It binds human-readable names to hashes Ethereum and Swarm
    file identifiers. ENS is a system of smart contracts, each responsible for its
    own domain. Several top-level smart contracts in the system (as for .eth and )
    that master smart contracts are registered as resolvers. A resolver could be registered
    with the .eth top-level smart contract with the name ethereum.eth, so any queries
    for it would go to the .eth smart contract and then get directed to the ethereum.eth
    smart contract. This can be arbitrarily chained for ENS names like wallet.ethereum.eth.
    All interactions with the top-level domains in ENS are done strictly through the
    smart contracts and the methods they provide. This provides a high degree of transparency
    and trust. A .eth domain in 2021 was 5 USD in ETH per year for 5-character names
    and 160 USD for 4-character names, and 640 USD for 3-character names.


    The process of registering a name on ENS takes five days and requires time-sensitive
    transactions. When we want to register a name, a public auction is opened instead
    of the name itself simply being hashed, so only people who know the name can participate
    in the auction. The auction lasts for 72 h and is followed by a reveal phase in
    which bidders must reveal their bids. They winner may pay an amount equivalent
    to the second-highest bid on top of their bid to get the name. Losers get their
    bids back.


