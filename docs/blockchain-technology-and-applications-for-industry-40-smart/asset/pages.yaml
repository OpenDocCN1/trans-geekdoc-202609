  md: '# 2.4.4.2.3 Example of modularized smart contract architecture for DApps


    Modular smart architecture requires a set of smart contracts to work together
    as the on-chain part of a decentralized application. Therefore, the security and
    access policy for the contract methods has to be carefully designed and planned.
    It makes sense to have a dedicated smart contract that handles access control
    and interaction permissions for all smart contracts in a decentralized application.
    This means that all security is centralized and offers a better overview than
    having access and security policies defined in every smart contract in the multi-contract
    architecture.


    We can now separate the service-specific and service-agnostic functions into separate
    modules. Service-agnostic modules provide key functionalities required in any
    multi-contract solution. A directory module can serve as the access point, which
    is the only interface for the external users. It reuses the dissemination of the
    addresses in other smart contract modules. If one of the contracts in the deployed
    system is upgraded and replaced, the directory reflects this change and transparently
    directs the remaining contracts to the updated address. An administration provides
    common access control for all the smart contracts and methods in the solution.


    Service-specific modules depend on the DApp objective and provide unique functions
    for service operation, for example, in the management of distributed energy resources
    (Section 4.3.3.1) or car reservation (Section 4.2.2), or decentralized collaboration
    between robots (Section 3.6).


    Auxiliary modules provide additional functions relevant to service provisioning.
    However, their functions, as loyalty tokens, asset tokenization, escrow service,
    or value collection, are common and relevant for other application verticals,
    too. Auxiliary modules can be provided system-wide and reused in various decentralized
    applications.


    Modular architecture with a separate access administration module allows us to
    the definition of various tenants. Although they all interact with multiple modules
    using the interface smart contract, they are only allowed to call some methods,
    while the other methods are restricted. Typically, the tenants in a decentralized
    application would be, for example, application owners, administrators, service
    providers, and service users.


