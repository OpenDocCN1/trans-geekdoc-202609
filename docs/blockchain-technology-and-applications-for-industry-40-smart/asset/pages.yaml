    is implemented in a network node, and interconnected nodes build the network.
    There can be many different networks based on the same DLT. Figure 2.2 shows that
    the DL operation is a set of application layer protocols that resides on a traditional
    TCP/IP stack and builds upon overlay. Communication topology is found in, for
    example, peer-to-peer (P2P) content distribution systems. For example, some of
    the communication principles in Ethereum have been directly adopted from the existing
    P2P systems. Unlike in the client-server communication topology, there are no
    central entities in a distributed DL network. All nodes/clients have equal roles
    in providing communication capabilities. Peer nodes make the topology resilient
    and scalable. A node is thus a piece of software. Other denominations for a node
