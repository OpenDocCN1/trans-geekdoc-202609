    # 2.6.1 DL-based storage


    The core application of blockchain technologies, a distributed ledger, is just
    distributed, safe, and trustworthy data storage. As we discussed, this has many
    different users in a variety of applications. However, many other applications
    require bulk data storage or file storage. This data cannot be written directly
    to the blockchain because it would greatly inflate the size of the ledger itself,
    hurting the performance of the chain in the long term.


    There are several distributed blockchain-based storage solutions available, with
    its characteristics [43]. Some core concepts are shared between them. These concepts
    storage methods, replication, and incentives for hosts. Data is stored in a very
    similar way. Each file is split into small pieces called shards. Each shard is
    encrypted before being stored on a machine that is part of the storage network
    (not the actual blockchain network). Only the locations and hashes of these shards
    are then stored on the blockchain network. Having relatively small and uniform
    pieces of data also helps improve storage and transmission efficiency. The machines
    that these shards are stored on eventually have many shards of data of identical
    size.


    Another shared concept is data replication. The data needs to be protected in
    the case of network failures. All shards need to be replicated across several
    machines. The exact number of replicas varies, but 3 is, generally, the minimum
    used. Since the shards do not have an easily identifiable connection between them,
    there must be a mechanism to ensure that the data is sufficiently replicated across
    the network.


    In cloud storage infrastructure, files are stored with a company that can charge
    for the services provided. Public distributed systems are composed of many different
    hosts and no single entity to carry out actions like issuing invoices. Therefore,
    each distributed data storage system needs to have a way of rewarding the hosts
    of files. This varies from technology to technology, but some examples reward
    the owners with tokens or cryptocurrency that have value or give them more power
    to vote on the system.


    Swarm is Ethereum''s answer to blockchain-based storage and is designed to work
    in the Web3 ecosystem. Shards (called chunks in Swarm) of files are stored across
    multiple Swarm nodes, with a manifest stored in the main Ethereum blockchain


