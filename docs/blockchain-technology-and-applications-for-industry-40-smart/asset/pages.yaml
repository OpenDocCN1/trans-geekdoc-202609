    Hashgraph [3] is a new DAG-based consensus alternative to the blockchain. Simply
    put, a DAG is a finite directed graph without loops between any two elements.
    In graph theory, a graph is a structure consisting of a set of points (vertices,
    elements, squares) where any two points can be in relation, that is, connected
    by a line (edge, arc). A directed graph means that each line between points is
    directed, that has an arrow. Thus, a DAG can be considered to be a finite set
    of points connected by arrows, so there is no way to start at any point X and
    follow a sequence of arrows that loops back to X again, that there are no directed
    cycles. A DAG can have a tree topology (as a special case), but generally, DAGs
    have no regular topology. Blockchain could be considered as the simplest DAG with
    points (blocks) connected in a chain, that is, where each point (except the first
    and the last) has one predecessor (parent) and one successor (child).


