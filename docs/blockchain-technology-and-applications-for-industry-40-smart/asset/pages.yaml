    \ amount being sent.\n\nAn inter-shard message is also created and put in the\
    \ outgoing queue for the shard $\beta$. Subsequently, at one moment, node, X,\
    \ from the shard $\\alpha$ will check that queue, and seeing that it is not empty,\
    \ X will send this inter-shard message (which contains transaction $C_a \to C_b$)\
    \ together with other transactions (actions from the shard $\\alpha$ to $\beta$,\
    \ if any) to a randomly chosen node, Y, in the shard $\beta$. When Y receives\
    \ the list of messages and submits it to the nodes in the shard $\beta$ through\
    \ gossip. When a transaction, $C_a \to C_b$ reaches consensus in the shard $\b\
    eta$ (and if the sequence number of the assigned inter-shard message is correct),\
    \ the effect of the transaction will be applied on all nodes in $\beta$, and the\
    \ account balance of $C_b$ will be increased by the amount being sent.\n\nThe\
    \ positive effects of the sharding architecture can be seen from the above described\
    \ (and simplified) example of the communication between shards in a situation\
    \ when the number of nodes in the network is very large. The number of gossips\
    \ in the entire network would be many times greater without it, consensus and\
    \ transactions delay would be much longer, and the nodes' ledger files would be\
