    There are two key trust models available to verify and validate the external data.
    In the centralized oracle trust model, only one node is used by the oracle solution
    to get data into a smart contract. Therefore, this node needs to be trusted. This
    model is appropriate for data in the external world that cannot be independently
    validated by multiple distributed parties, for instance, because the data has
    restricted access or transient sensor data. Examples of centralized validations
    in oracles are, authenticity proofs (TLSNotary) for software oracles and trusted
    execution environments (TEE) for hardware oracles. The alternative is the decentralized
    oracle trust model. Here, the methods such as decentralized reputation, voting,
    or consensus-based decisions ensure a common agreement about the external data
    source. Both models are used in practical oracle implementations to distinguish
    the features of various external sources.


    In any case, oracles are off-chain architecture components that could be points
    of failure in whole blockchain-based systems. Even if the DL network and the on-chain
    smart contract application are highly reliable and trustworthy, there is a risk
    of oracles providing corrupt, malicious, or inaccurate data. Oracle security is,
    therefore, an emerging research area. Several oracle solutions have been proposed
    and implemented.'
