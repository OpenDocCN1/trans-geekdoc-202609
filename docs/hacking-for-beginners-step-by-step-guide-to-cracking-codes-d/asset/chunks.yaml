    more interaction possibilities with the honeyp. For this reason, one can collect
    and exploit more information about the attacker. The increased interaction level
    also makes handling and installation more difficult. This class of honeypots has
    its complexity between the low and high-interaction honeypots. The disadvantage
    of the increased interaction, however, is that it also increases the security
    risk. The reason for this is that with the increase in the level of interaction,
    the attacker is presented with an almost real system. If the attacker hacks the
    honeypot, the system can be used to attack other systems. The advantage of this
    class is that you can gather much information about the attacker.


    ### High-Interaction Honeypots


    High-interaction honeypots have the highest complexity and represent a real system
    with many real-world applications. This makes it possible to collect a great deal
    of information during seizure. It not only gathers information about the timing
    of an attack but also provides information about the abilities and methods of
    the attacker. As the security risk increases as the level of interaction increases,
    the risk associated with this class is very high. The reason for this is that
    an attacker who has invaded the honeypot can attack other systems and cause immense
    damage. It takes a lot of prior knowledge to operate such honeypot, as both the
    installation and operation are much more complex.


    ## Benefits of Honeypots


    A first advantage that honeypots face over security techniques is their ease of
    use. While other techniques need to be very familiar with the subject in order
    to be able to work with it, a honeypot is sufficient to install and make some
    modifications if necessary. This makes handling much easier than other techniques.
    Naturally, as mentioned in the previous chapter, it requires more knowledge. However,
    initially, a simple honeypot can run without much knowledge. This gives everyone
    the opportunity to engage with honeypots and observe attackers. This is not the
    case with other techniques. The next big benefit of honeypots is the amount of
    data collected. Because of the other techniques, an immense amount of data is
    collected. The problem here, however, is their recovery. Many of the data collected
    are not meaningful and therefore unnecessary for analysis. Nevertheless, security
    techniques have to tell in advance which data are important and which are unimportant.
    This leads to a greatly reduced volume of data which does not affect the system
    functions. Evaluating the analysis reveals potential errors within security techniques.
    Such information can then be used to develop protection further. The third big
    advantage is the lower hardware requirement. Since the majority of security programs
    have the problem of having to cope with the ever-increasing speed of traffic on
    the Internet with more and more data, correspondingly high demands are placed
    on the hardware. The advantage of honeypots is that they need fewer resources
    because they only have to react when they are actually addressed. As a first example,
    I''d like to introduce a rather simple honeypot called `Back Officer Friendly`.
    The second example will be a more complex honeypot called `honeyd`. As the last
    application, we will then turn to honeynets.


    ## Disadvantages of Honeypots


    The first big drawback honeypots have is the risk they bring with them. A risk
    exists because if an attacker has invaded a honeypot, it can be used to then attack
    other attack systems. The risk and associated damage depend on the interaction
    level of the honeypot. As described in the last chapter, the more the honeypot
    can do, the bigger the danger. The next problem, and thus another disadvantage
    of honeypots, is that a honey pot does not observe what is happening around it,
    but only what affects itself. As a result, even though there is an attack on the
    network, the honeypot does not react because it is not itself attacked. Honeypots
    actually react only when they become the target of the attack. Another major disadvantage
    results from the identification of a system as Honeypot. This can lead to an attacker
    bypassing the honeypot in the future and focusing on other systems. In addition,
    it can happen that an attacker deliberately uses his knowledge of the existence
    of a honeypot to access other systems. For example, an attacker can bombard a
    honeypot with attacks and distract the user to such an extent that he can attack
    other systems unhindered. In the research honeypots already mentioned, identification
    can lead to serious errors. This is due to the fact that an attacker can deliberately
    leave behind false information about himself and his methods during an attack.
    But as conclusions are drawn from this information through analysis, this leads
    to wrong conclusions. This poses a massive problem if these failures find their
    way into the security software of the next version. This way, it can be manipulated,
    and instead of protecting the systems, new ones can be created.


    ## Examples of Honeypots


    The functioning of honeypots has now been explained in detail, so it is time to
    look at some practical examples. Of course, there are a large number of honeypots
    in use today. Therefore, in the following three different honeypots are presented,
    on the basis of which one can see well the different application possibilities.


    ### Back Officer Friendly


    The first example I would like to introduce is a rather simple honeypot called
    `Back Officer Friendly` ( `BOF` for short). This is one of the simplest honeypots
    available and can be classified in the class of low-interaction honeypots. `BOF`
    can be used well as a production honeypot and is not suitable as a research honeypot.
