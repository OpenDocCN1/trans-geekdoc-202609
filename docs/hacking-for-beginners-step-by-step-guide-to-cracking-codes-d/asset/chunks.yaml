    # 分片处理


    该技术检查了分片 IP 数据包的重组。特别是，这里观察了重叠分片的重组。被动操作系统指纹识别是所述操作系统指纹识别的一种变体，它不主动发送包，而是观察传入的数据包。攻击者可以通过连接服务器、向服务器发送请求并检查服务器发送的数据包来使用被动操作系统指纹识别。由于
    `TCP / IP` 实现不同，对以下字段的观察和分析可以识别操作系统 [PeCh04]:


    * `TTL` 初始值 (8 位) (`IP header`)

    * `Window size` (16 位) (`TCP header`)

    * `Maximum segment size` (16 位) (`TCP header`)

    * `Don ''t fragment` 标志 (1 位) (`IP header`)

    * `sackOK` 选项 (1 位) (`TCP header`)

    * `nop` 选项 (1 位) (`IP header`)

    * `Window Scaling Option` (8 位) (`TCP header`)

    * `Start packet size` (16 位) (`TCP header`)


    这些字段共同构成了一个 67 位的签名，并与数据库进行比较。由于只检查了传入的数据包，因此对源主的检查是不而易见的。


    ## 混合形式


    某些技术既是被动的（与目标没有直接交互），也是主动的启示（通过与目标直接交互），被分配给目标，或同时在启示和攻击中使用。在这些混合形式中，最为人知的是社会工程。


    ## 社会工程


    社会工程是一门操纵人类为了符合攻击者的利益而行动艺术。[PeCh04]。它通常用于：


    * 获取对受保护资源的物理访问权限

    * 获取远程访问权限

    * 访问受保护的信息

    * 违反其他安全控制措施


    如果使用社会工程直接与（例如）目标公司的员工进行交互以获取信息，则可以被归类为主动启示。如果攻击者不与员工直接交互，而是偷听（例如两名员工之间的对话），则应被归类为被动启示。社会工程可以用于。


    # 第 3 章 – 应对措施


    在本节中，我们将讨论针对上述方法的某些应对措施。首先介绍一些通用应对措施，然后介绍针对被动启示、主动启示和社会工程的特殊技术。


    噬 通用应对措施包括适用的安全策略、删除软件等标准文件，以及更改默认设置（如用户名和密码）。教育用户使用安全密码、处理敏感信息以及定期更新软件也是绝对必要的。


    ### 被动启示/足指纹识别


    作为针对互联网研究和 Google 黑客攻击的应对措施，建议检查自己的网站并删除不需要的发布信息。如果无法做到，隐藏目录至关重要。通过创建一个包含针对各种爬虫控制语句的
    `robots.txt`，可以影响搜索引擎的行为。在 HTML 头部中指定 `META` 标签允许爬虫索引搜索引擎缓存中找到的页面。使用 `htaccess`
    设置密码保护区域也有助于对爬虫隐藏。可以通过 Google 搜索查询检查页面是否受到了足够的保护。另一方面，攻击者也会使用的 `WHOIS` 和 `DNS`
    数据库查询是无法防止的。这是因为 `WHOIS` 条目是法律要求的，而 `DNS` 条目是调用域名所需的。因此，这些信息是公开的，而且由于查询是针对“第三方”管理的数据库，对于潜在攻击者来说，并不清楚是谁请求了这些条目。


    ### 主动启示/指纹识别


    无法防止对系统的端口扫描，但可以确保没有不必要的端口处于状态。如果定期分析服务器日志，就可以及早发现端口扫描以及由此产生的攻击准备。如果检测到此类捕获准备，有助于恢复你自己的安全预防措施。另一种主动方案是有意地打开错误的端口以欺骗潜在的攻击者。操作系统指纹识别无法防止，但可以通过服务器日志检测到。作为
    `Nmap` 的一种主动应对措施是 `IP Personality`，一个内核模块，它可以通过更改 `TCP header` 中的标志位来模拟不同的系统。


    '
- fmt: '

    # Chapter 4 – Web Hacking, XSS, and SQL Injection


    Over the past decade, the World Wide Web has expanded rapidly and is still evolving
    today. Traditional systems are being replaced by dynamic, browsable applications
    that are hosted on web servers and access the vast database. The continued implementation
    of the broadband Internet has paved the way for multimedia enhancements. And the
    dramatic evolution of wireless technologies today offers WWW a chance to reach
    anywhere. Undoubtedly, the benefits of the World Wide Web are to overcome spatial
    and temporal limits. Today, we can order from the comfort of your home a new phone
    that has just been produced in Japan, order it through the web, or apply for a
    job remotely in South America with one click.


    In business, the Web is being exploited more and more, as it makes access to customers
    and opportunities much easier. The bank services are now online. Shopping goes
    on the net with fast and easy payment by credit cards. And more and more e-business
    companies are born. But for any web-based application that goes online, and any
    e-business that powers up a rack of servers, malicious hackers with appropriate
    attack techniques are also available. While people are coming to terms with new
    technologies and making their network, web servers with firewalls, and defense
    systems more secure, the attackers have also become smarter so they can break
    these systems and firewalls. The continued rapid growth of web technologies also
    leaves many security gaps. In this book, as we mentioned before, the well-known
    web-application-hacking techniques are presented, and avoidance methods are shown.
    First, let us discuss an overview of web application architecture.


    ## Web Application Architecture


    Traditional HTML pages are static, that is, they will eventually be generated
    and will be available in that form on the Web server through the `URL` of the
    page. Of course, it is also desirable to have an HTML page dynamically generated,
    for example, to influence recent page data of the caller. Dynamic web pages are
    generated by a web application at runtime.


    Web applications generally differ in client-side and server-side web applications.


    **Client-side web applications** are run on client machines. The known technologies
    for such web applications are `JavaScript`, `VBScript`, `Flash`, `Applet`.


    **Server-side web applications** are executed on the server, often used for the
    dynamic generation of data, e.g., from a database. The well-known technologies
    for server-side web applications are `Common Gateway Interface (CGI)`, `Server
    APIs`, and scripting languages such as `ASP`, `PHP`, `JSP`.


    A common dynamic web system consists of 4 components:

    1. The web client (often a browser)

    2. The front-end web server

    3. The server applications

    4. The server database


    The front-end web server acts as an interface for interfacing with the outside
    world, getting input from the web client via `HTML` forms and `HTTP`, and returns
    an output generated by the application in the form of `HTML` pages. The server
    application works with the database to perform transactions. Each component of
    the web system has its own specific vulnerabilities.


    Here is a short overview of the basic types of attacks on each component:

    - **Web client**: execute active content, client software vulnerability exploits,
    cross-site scripting (`XSS`).

    - **Web server**: server software security vulnerabilities exploitation.

    - **Web application**: an attack against authentication, authorization, input
    validation.

    - **Database**: execute privileged commands through database query, manipulate
    queries (`SQL Injection`) to get excessive record.


    Of these, `XSS` and `SQL Injection` have been selected as web-based tools.


    ## XSS


    Cross-site scripting (`XSS`)


    Cross-site scripting (`XSS`) exploits a vulnerability in a web application that
    allows an attacker to inject malicious scripts into web pages viewed by other
    users. The easiest way to test `XSS` is to type the following:

    ```html

    <script>alert(document.cookie)</script>

    ```

    Depending on location (client-side or server-side) and duration (permanent or
    non-permanent), cross-site scripting attacks are divided into types.


    ### Type 0

    In `XSS`, the malicious script is embedded in the URL. For example, this could
    be a link like:

    `http://www.example.com/search.cgi?query=<script>alert(document.cookie)</script>`


    Example scenario:

    1. Alice often visits a Web site A that contains `XSS` security holes.

    2. Alice clicks on the link

    3. The malicious script opens an HTML page on Alice''s computer

    4. This HTML page is is executed on Alice''s computer with its privilege rights.


    ### Type 1

    In this type, the manipulated script is on the server-side and not permanent.
    There is no problem with the subsequent execution of the script. For example,
    a search function on the server that gets the search term as input without filtering
    and outputs something like this:

    The one you searched for: "search term" is `<script>alert(document.cookie)</script>`


    Example scenario:

    1. Tom creates a manipulated URL to site A and sends it to Alice.

    2. Alice visits the manipulated URL

    3. The embedded script in the URL will be executed in Alice''s browser as if it
    came directly from web page A.


    ### Type 2

    With `XSS` Type 2, the manipulated script code is permanently written to a web
    page. It is the most dangerous form since it affects many users. This type 2 works
    similarly like Type 1, only that the output persistently stays on the page.


    Example:

    1. Website A, again containing `XSS` security holes, allows users to post news
    or other content.

    2. Tom posts a message on this website:

    "A really good website! <script>alert(document.cookie)</script>”

    3. When looking at the news, the script code is run on user machines and therefore
    can steal cookies, other things without his knowledge to Tom.

