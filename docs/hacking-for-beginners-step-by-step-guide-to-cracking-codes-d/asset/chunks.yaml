    # Chapter 1 – Types of Attackers


    As attackers differ in their motivation and technical capabilities, different
    types of attackers attack different types of systems and have different attacking
    intentions. According to Roge, attackers can be divided into seven types. These
    will be briefly presented below.


    ### Newbie

    Members of this group are mostly new to hacking and have only basic computer and
    network security skills. Therefore, they use preprogrammed software tool kits
    for their attacks. These software tool kits are widely used on the internet and
    easy to find. Their attacks are therefore limited to systems for which already
    existing tool kits exist.


    ### Cyber Punks

    Cyberpunks possess advanced software, programming, and system knowledge. They
    are quite criminal in their intentions. Cyberpunks attack web servers to redesign
    web pages (defacing) and are often active in spam and credit card fraud.


    ### Internals

    The Internals group consists of former and dissatisfied employees. They are usually
    technically savvy and can make attacks based on their former or current job functions
    and responsibilities. Their attacks are directed against their former or current
    employers since they can use their knowledge of the systems there.


    ### Coders

    This group has the extensive technical knowledge and is able to exploit security
    vulnerabilities and so-called program exploits.


    ### Old Guard Hackers

    This group does not necessarily pursue criminal intentions but is guided by the
    hacker ethic of the first hacker generation. According to [Raym03], hacking ethics
    is defined as the belief that information should be freely available, and the
    belief that attacks on computer systems are ethical. It is, therefore, considered
    ethical as long as no criminal intentions are being pursued, but rather the onslaught
    of fun and exploration enjoyment. Legally, attacks on computer systems are ethically
    unjustifiable and thus punishable.


    ### Professional Criminals and Cyber Terrorists

    These groups consist of professional criminals and former secretaries who are
    well trained and equipped. They mainly engage in the field of industrial espionage
    and its targets are thus networks. Little is known about this group, and they
    are considered very dangerous.


    ## Enlightenment

    Despite the differences in target selection, technical capabilities, and motivation
    for attacks, all types of attackers need detailed knowledge of the target system
    prior to an attack. Thus, prior to each attack, clarification must be provided,
    and information must be collected. The techniques used in the explanation are
    presented in the following section.


    ## Explanation

    Aufklarung means that the information gathering and evaluation is under attack
    in the context of the topic of the seminar. For an attacker, it is necessary to
    select a target before the actual attack and to scout it out. A first impression
    of the target and the subsystems used, i.e., the individual computers, is made
    by an attacker using passive elucidation. After evaluating this information, he
    usually finds a system that he now investigates in more detail to find vulnerabilities.
    With the help of active enlightenment, it is now possible to more accurately profile
    such concrete goals and adapt them to the software used. Aufklarung is used in
    a hacker attack so in order to increase the chances of success of the attack.

