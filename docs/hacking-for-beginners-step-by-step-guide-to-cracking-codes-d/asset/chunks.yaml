    of an attack, also collects very little information about the attacker and his
    methods. Before the functionality is explained in more detail, a few words about
    `BOF`. `BOF`, which was initially conceived as a honeypot, was actually developed
    as a measure against attack. Marcus Ranum developed `BOF` in 1998, his goal was
    to create software that would uncover the activities of this. `BOF` was, therefore,
    such a great danger because an attacker could penetrate it without attracting
    attention. The procedure `BOF` can be described as follows: the program can listen
    up to seven different ports of a system. If an attempt is made to establish a
    connection to one of these ports, `BOF` actually establishes a complete TCP connection
    at the same time, recording the attempt and triggering an alarm. `BOF` then terminates
    the connection immediately after setup. Although `BOF` has very limited functionality,
    it is well suited to detect attacks on a system and find a good way of security.


