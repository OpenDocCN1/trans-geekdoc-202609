    # Chapter 8 – Functionality of the Email System


    Sending spam is closely related to how the e-mail system works. This will be explained
    below.


    ## SMTP

    The current e-mail system is based on the `SMTP` standard specified in 1982 [Post82]
    and updated in 2001 by `ESES` [Klen01]. He is like the internet itself – decentralized
    and specifies the transmission of e-mail messages from one server to another.
    The servicing service on the server is called a mail transfer agent (`MTA`) and
    is responsible for accepting and processing the messages. If he receives a message
    addressed to a recipient within his own domain, he places it in the mailbox of
    the corresponding user. Otherwise, he sends it via `SMTP` to the appropriate e-mail
    server, which he determines via the `DNS`. Listing 1 shows message transmission
    via `SMTP`.


    ### Listing 1: SMTP Dialog

    ```

    220 s omehost. net ESMTP Exim 4. 6 3 # 1 Mon, 26 Nov 2 0 0 7 2 3: 1 0: 2 1 +0100
    HELO anotherhost. net 250 somehost.net Hello localhost [1 2 7. 0. 0. 1 ] MAIL
    FROM: Bill < bill @ Microsoft.com > 250 OK RCPT TO Richard @ somehost.net 250
    Accepted 250 accepts DATA 354 Entermessage, endingwith ". "On aline by itself
    From Steve < steve @ Microsoft.com > To: Richard@somehost. net Subject: L i nux
    v iolates our IP Hello, nothing unusual to say, 250 OK id = 1IwmAg - 0008ED -
    LA QUIT 221 somehost.net closing connection

    ```


    In the early days of the Internet, e-mails for delivery were simply handed over
    to the local `MTA`, which was a standard feature of the then-popular `UNIX` systems.
    Nowadays, the e-mail client (also known as the mail user agent, `MUA`) usually
    sends outgoing e-mails to the e-mail server of the provider, which then makes
    the further transmission. It also uses the `SMTP` protocol, but in the enhanced
    version `ESMP`, which allows password authentication. This use of the `SMTP` protocol
    for two different applications - end-user message submission (" submission ")
    and email transfer between `MTAs` (" transfer ") - makes the configuration of
    `MTAs` complicated and error-prone. Therefore, with the Message Submission specification
    [GeKl98], there is a suggestion to separate message persistence by the end-user
    by using a different `TCP` port and some protocol extensions.


    ## Relaying

    Relaying refers to the acceptance and forwarding of messages via `SMTP`. In the
    past, it was customary for `MTAs` to accept arbitrary messages and pass them on
    if necessary. This configuration is called `Open Relay`. As it is later implemented,
    this encourages the sending of spam, so that this practice has largely been abandoned.
    Nowadays, `MTAs` usually only accept e-mails addressed to their own domain, unless
    the sender authenticates with a password. The transmission of messages to third-party
    servers plays a role in failover security. If an e-mail server can not be reached,
    the message can be forwarded to a " mail exchanger" (`MX`, specified in the `DNS`),
    which caches it and delivers it if the responsible server is available again.


    ## Authenticity of Messages

    An email is technically just a piece of text, consisting of a header (`Header`)
    and a message part (`Body`). The header contains meta-information such as sender,
    receiver, transmission time, and operator. The message part contains the message
    itself. However, the header only serves as additional information for the recipient.
    When sending via the `SMTP` protocol, the sender and recipient are specified explicitly.
    This information is known as `Envelope Information` and is not visible to the
    recipient of the message. They may differ from the information in the message
    header. (See also Listing 1) Thus, the envelope information includes all e-mail
    addresses to which the message is actually sent. In the header, on the other hand,
    some of these addresses may be in the " to " field (receiver), others in the "
    CC " field (copy) and not at all (blind copy, `BCC`). The header information can,
    therefore, contain any values, in particular, incorrect sender addresses. Also,
    the envelope details are generally not checked during shipping. In particular,
    a verification of the sender address by the receiving server is not possible,
    since the `SMTP` standard does not prescribe which servers should be allowed to
    send e-mails for a domain. The authenticity of e-mail messages is therefore not
    guaranteed by the e-mail system.


    ## Delivery Error

    In principle, an `MTA` is responsible for a message, if it has accepted it. If
    he can not deliver a message, he sends back a bounce message to the sender stating
    the reasons for the failed delivery. For example, possible reasons may be that
    the mailbox on the destination host does not exist or is full. If it is a temporary
    error, such as the destination host is unreachable, it tries to deliver the message
    in the long term.


    # Chapter 9 – Causes


    In the following, different causes are pointed out, which favor the dispatch of
    spam or make it possible in the first place.


    ## Low Shipping Costs

    The shipping costs for spam are very low, as only a computer within an internet
    connection is necessary. This makes the sending of spam messages only attractive
    since due to the low shipping costs only a very small proportion of the recipient
    must respond to the message in order to make a profit.


    ## Open Relays

    Open relays make it easy to send messages in bulk, as spammers have to send messages
    with very many recipients only once, and the open relay then handles the further
    transmission. In addition, open relays enable spammers to send spam messages,
    even if their own addresses have already been included in blacklists. Open relays
    may also involuntarily result from incorrect configuration of the `MTA`.


    ## Zombie Computers

    Zombie computers are computer systems used by internet users, who were brought
    under foreign control by a Trojan horse and form so-called botnets in large numbers.
    (see other seminar paper). These are often misused for spamming without the knowledge
    of the owners. Symantec security software company monitored over 5 million bot-infected
    computers over a 6-month period. [Corp07] In addition to sending messages directly
    through `SMTP`, some trojans also try to exclude credentials to the email provider''s
    server and use them to send messages after authentication.


    ## Authenticity Not Verifiable

    Since the authenticity of a message and the correctness of the sender''s information
    cannot be checked without further technical measures, such as electronic signatures,
    a distinction between spam and regular messages is difficult. The fact that spam
    e-mails have to be sorted out and deleted manually is the main cause of the costs
    incurred by the recipient.


    ## No Uniform Handling Against Spammers

    Due to the international nature of the Internet and the lack of a uniform legal
    basis, there is no uniform approach against spammers. While some countries now
    have anti-spam laws in place, others have no legal basis for persecuting spammers.


    ## Shipping

    Since one or more servers can always be located on the basis of their `IP` address
    and can be taken off the net by public authorities, the transmission of spam messages
    is usually carried out by external computers. While the former was often open
    relay, today it is almost exclusively botnets, the merger of many zombie computers.
    Another way that spam is sent is the misuse of e-mail forms on web pages (e-mail
    injection). Spammers try to inject additional headers and in the worst case can
    send emails of any content to any recipient. [Brau05]

