  trans: '


    # 结论


    感谢你读完《新手黑客教程》，希望这本书能为你提供丰富的信息，并为你提供实现任何目标所需的所有工具。总而言之，Web 应用程序总是包含经常被黑客利用的安全漏洞。在本文中，我们详细研究了
    `XSS`、`SQL injection` 和 `phishing` 这三种黑客技术。任何系统中存在此类漏洞的人都必须考虑到这些漏洞也会被发现并利用。在大多数情况下，你必须在安全性和便利性之间进行权衡。更高的安全性通常意味着便利性的降低，反之亦然。


    ## 攻击期间的检测


    要检测此类攻击，可以监控网络是否存在大量的 `arp-replys`。此外，还可以参考 `arp-requests` 与 `arp-replys` 之间的关系。如果响应的数量超过请求的数量，则可能存在
    ARP 欺骗攻击。请参考 [CaGo03]。


    ### 如果攻击成功


    如果攻击成功，本质上有两种检测可能：


    1. **监控 ARP 表**：通过如 `arpwatch` 等特殊软件，你可以检测 `MAC table` 的变化并触发警报。

    2. **延迟监控**：除了上述从中心点测量单个计算机反应时间的可能性外，两台计算机的同步攻击以及相关的延迟网络流量分流，也会导致受害计算机之间数据包的传输时间增加。如果参与者监控其通信伙伴的响应时间，他可能会怀疑流量通过第三台计算机进行了重定向。


    最后，如果你觉得这本书在任何方面都有帮助，我们将非常感谢你在 Amazon 上的评价！


    '
