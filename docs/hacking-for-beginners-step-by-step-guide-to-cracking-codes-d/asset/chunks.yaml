    # 第 6 章 – 钓鱼


    ## 什么是钓鱼？

    钓鱼是一种自动化的身份盗用行为。它通过向接收者发送伪造邮件，试图诱骗他们分享私人信息，如信用卡号或银行账户密码。最重要的是，发送至虚假网站的邮件会诱导他们输入隐私数据。为了获得信任，该网站必须与钓鱼者模仿的原站非常相似。“Phishing”一词显然是“password
    fishing”（密码钓鱼）的变体，因为钓鱼者抛出“鱼钩”，希望有几个受害者上钩。


    ## 工作原理与钓鱼方法

    尽管钓鱼的大概念是让受害者进入虚假网站，但有几种技术使这一想法变为现实。目前介绍了三种最广为人的方法：冒装、转发和弹出窗口。


    *   **冒装（Impersonation）**：是最简单且最流行的钓鱼方法 `[LiVi02]`，其通过一个精心设计的虚假页面让受害者访问。虚假网站包含真实网站的图像，这些图像并不一定复制到钓鱼服务器，只需从原始网站备份即可。如果受害者在输入框中输入数据并点击
    `Submit`，该数据将通过 `Script Handling` 脚本发送给输入框中的钓鱼者。该方法的重要部分是编写一封带有虚假页面链接的钓鱼邮件。此类邮件看起来像下方的邮件：关键受害者的邮件语言具有攻击性。虚假页面应与原始页面相同，因此你无法立即看出它们的不同。例如：原始：`http://www.securitybank.com/bank/cgi/show?id=45`
    虚假：`http://www.securitybank.net/bank/service/show?prameters=1`


    *   **转发（Forwarding）**：是一种钓鱼技术，利用邮件获取私人数据，然后引导受害者进入真实网站。这种钓鱼风格在 eBay、PayPal、Amazon
    等公司非常流行……它们经常向客户发送邮件分享优惠和新服务。通过这种技术，登录字段（或特定输入字段）会被嵌入邮件中。当受害者输入数据并点击 `Submit`
    时，他们会被带到真实页面，但他们的数据会被发送给钓鱼者。此类邮件看起来如下：登录脚本实际上与 `Impersonation Script` 相似，只是在将受害者数据发送给钓鱼者后，登录脚本会带你进入真实网站。受害者更容易被这种技术欺骗，因为没有显示虚假
    URL。很难发现该 HTML 邮件来自另一个网站。


    *   **弹出窗口攻击（Popup Attack）**：是一种在将受害者重定向到真实网页期间，为钓鱼服务器打开弹出窗口的技术。弹出窗口的 HTML 代码可以如下制作：

    ```html

    <BODY bgColor = #ffffff onload = "window.open (''phish.html '',''popup '','' ''top
    = 150, left = 250, width = 250, height = 200, toolbar = no, location = no, scrollbars
    = no, resizable = yes '' ) </BODY>

    ```

    如果受害者点击邮件中的链接，虚假页面会立即变成真实页面。页面会被重定向并打开带有输入字段的弹出窗口，所有输入的内容将发送给钓鱼者。然而，这种技术在今天很少见，因为大多数浏览器都使用了弹出窗口拦截。


    ## 保护

    由于钓鱼邮件始终包含 HTML 表示，且转发技术仍然涉及脚本，通过关闭邮件程序的 HTML 显示和脚本，可以禁用虚假的 HTML、链接和脚本。所有邮件都将以纯文本形式显示以防范钓鱼。使用钓鱼保护系统，将邮件头与最新的钓鱼者列表进行比较，并检查链接，无论它们是否真实显示。永远不要打开未知来源发送的邮件。安装反垃圾邮件系统来过滤垃圾。


    # 第 7 章 – 垃圾邮件

    随着互联网的快速传播以及电子邮件在商业和个人领域的激增，发送不受愿的批量邮件（通常称为垃圾邮件）也变成了一个巨大问题。本报告论文展示了电子邮件系统的哪些基本功能实现了垃圾邮件发送，以及发送者是如何操作的。此外，还介绍了防止发送垃圾邮件的各种方法以及解决当前电子邮件系统问题的努力。


    ## 定义

    垃圾邮件最广泛使用的国际术语是 `Unsolicited Bulk E-mail (UBE)` —— 德语为“不受愿或未请求的批量邮件”。除了电子邮件垃圾邮件外，其他媒体中也有垃圾邮件，例如即时通讯系统中的垃圾信息、书籍和博客中的评论垃圾邮件，以及通过自动拨打磁带录音公告的电话垃圾邮件。本文专门关注
    UBE 意义上的电子邮件垃圾邮件。“Spam”一词最初源于 Hormel 食品公司的垃圾产品 `SPAM – 调味猪肉和火腿肉`。该产品自 1936 年以来可用，在
    1970 年被英国喜剧剧《蒙提派森的飞行马团》的一个短剧中采用，它作为菜单上每道菜的一部分出现，并受到一组唱歌的维京人的大声支持。`[Merr04]`，`[Pyth70]`。该词在短剧中出现了
    132 多次，这解释了它与电子邮件垃圾邮件的联系。


    ## 引言

    虽然垃圾邮件在几年前才出现，但今天如果没有大规模的反垃圾邮件措施，使用电子邮件几乎是不可能的。尽管不受愿的邮件问题已在 1975 年被 `Postel[75]`
    意识到，并在 1982 年被 `Denning[82]` 意识到，但在当时实践中并不重要。1994 年 4 月 12 日，向成上万个新闻组发送信息是第一个重大商业新闻
    `[Camp94]`。1997 年，垃圾邮件问题在官方网上得到了关注：美国贸易委员会处理了这一问题，并建立了一个反腐工作组 `[Comm97]`。在过去的几年里，垃圾邮件发送激增，到
    2005 年占总邮件流量的 80%-85% `[Group96]`。遗憾的是，尽管反垃圾取得了进展，比盖茨的说法并未证实：“两年后垃圾邮件将得到解决。我承诺一个没有垃圾邮件的世界。”（微软
    CEO 比盖茨，2004 年 1 月）


    ## 类型

    垃圾邮件可以分为几类。`[Lab06]`，`[Mars]`

    *   成人垃圾邮件：例如促销壮阳药物、色情优惠或约会服务

    *   金融要约：例如贷款、影响股价的广告或据称的中奖利润

    *   旨在获取在线服务身份信息的虚假信息


