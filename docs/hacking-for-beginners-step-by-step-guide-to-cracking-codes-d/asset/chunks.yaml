    # 第 13 章 – 僵尸网络 (Botnets)


    僵尸网络是许多互联网威胁（如垃圾邮件和拒绝服务）的基础。本节通过介绍僵尸网络的基本元素、特征，概述了僵尸网络的工作原理。文中还解释了开启、分析和停止生产性僵尸网络的不同方法。


    ## 引言


    互联网的稳步增长伴随着犯罪和破坏性能量的增加，范围从纯粹的破坏性破坏到有组织犯罪。僵尸网络这一为人知但鲜少探索的领域是许多关键恶意机制的起点，例如垃圾邮件、分布式拒绝服务（`DDoS`）和数据间谍活动。文顿·策夫在
    2007 年世界经济论坛上提出，所有连接互联网的 PC 都是恶意僵尸网络的一部分 `[Foru07]`。尽管如此，之前的安全相关方法侧重于预防、过滤和规避僵尸网络引起的攻击。只有少数方法直接处理僵尸网络的基础和运行机制。


    ## 僵尸网络 – 定义与界定


    僵尸网络是一组在用户不知情的情况下被恶意软件感染并由单个人远程控制的独立计算机系统。受感染的终端系统被称为 `zombie`（僵尸）或 `bot`，较少情况下称为
    `drone`（无人）。远程控制僵尸网络的个人被称为 `botmaster`（主）。`C & C` 通道（命令与控制）已成为称为主与僵尸网络之间通信信道的术语
    `[RZMT06]`。主与 bot 通过 `C & C` 通道进行的 1:n 通信是僵尸网络的基本特征。此外，“僵尸网络”仅指那些旨在执行有害和犯罪行为的结构。毕竟，僵尸网络只是一个可以但并不一定造成伤害的工具。具有性质的结构（例如“Folding@home”或“Mersenne
    Prime Search”）是和平且有意义的服务，不被归类为僵尸网络。


    今天发现的恶意 bot 演变自 20 世纪 90 年代初经典的 `IRC` bot。`Eggdrop` 是最早支持 `IRC` 用户的 bot 之一，它通过执行数据库查询或提供帮助等功能来服务。基于
    `Eggdrop` 的模块化，开发出了第一批可以用于实现恶意意图的 bot 程序。然而，最初的攻击局限于 `IRC` 领域的 `DoS`，例如通过自动“洪水攻击”。这些
    bot 时间的推移而演变，但保留了 `egg-drop` 的模块化和对 `IRC` 的控制 `[CoJM06]`。同时，僵尸网络被用于纯粹的破坏（“脚本小子”）以及商业欺诈、勒索、垃圾邮件和钓鱼攻击
    `[CoJM06]`。它还识别出一个紧密合作开发和完善恶意软件的社区。如果 bot 的源代码公开可用，它们会以特定场景伪名的形式显示出大量的用户签名。代码经常被重用；源代码包含指明原始代码的注释。通常，这些是预存在的恶意软件，如计算机病毒、蠕虫或木马。


    ## 常见的僵尸网络系统


    对现有 bot 进行分类非常困难。现有的 Bot 软件经常被重写多次、扩展和修改；有时已知的 bot 变体达 4,000 个（`SDBot` 和 `Agobot`）。以下是最广受关注和目前流行的
    bot 组列表：


    ### Agobot/Phatbot/Forbot/XtremBot

    几乎所有常见 bot 的核心都是 `Agobot`，它于 2004 年首次发布，其程序员在同年被捕。该 bot 用 `C++` 编写，提供模块化和抽象的软件架构。源代码在
    `GPL` 下发布，尽管没有中央参考源。`Agobot` 在过去几年里进行了多次扩展，目前的源码包（包含所有模块、扩展、附加工具和替代实现）大小约为 140
    MB。`Agobot` 使用 `libpcap` `[BHKW05]` 监听网络流量，并支持 `PCRE`（Perl 兼容正则表达式）和 `NTFS ADS`（备用数据流）以及经典
    rootkit 功能。新版本能够通过检测调试器和虚拟机（如 `SoftICE` 或 `VMware`）来防止读取 `C & C` 参数 `[BHKW05]`。`Agobot`
    使用 `SSL` 对 `C & C` 通信进行加密，并提供用于感染 Linux 系统的特殊版本 `[CoJM06]`。


    ### SDBot/RBot/RBot-GR

    `SDBot` 及其衍生版本用 `C` 编写并在 `GPL` 下发布。源代码短小且简洁，尽管缺乏抽象且没有模块化支持。基础系统中未实现破坏函数，仅提供处理
    `C & C` 命令的基础功能。添加恶意功能只需对源代码进行极小的修改。`SDBot` 除了 Windows 操作系统和点对点软件的漏洞外，还利用其他恶意软件留下的后进行主要感染
    `[CoJM06]`。已知有超过 4,000 种变体。随后重构的源码可以推断出 100 多名程序员的身份。


    ### Storm Worm/CME-711/Troj.Dorf/Win32.Nuwar

    Storm 僵尸网络估计占有 100 万个受感染系统，是观测以来最大的僵尸网络。与之相关的 bot 软件 `CME-711` 的构造研究较少，无法明确分配源代码。该电力僵尸网络在
    2007 年负责了各种 `DDoS` 攻击，引起了媒体的关注。


    ### Clickbot

    Clickbot 是一种商业上可用但非法且有害的僵尸网络系统。2006 年 5 月发现了一个占有 10 万个 bot 的僵尸网络。Google 投入大量精力分析该僵尸网络，以便能够有效过滤点击。bot
    作为 `BHO`（浏览器辅助对象）在“Internet Explorer”中实现作为 `C & C` 通道。bot 的传播通过“社交工程”和利用“Internet
    Explorer”的安全漏洞进行。通过 `PHP` 编写的去中心化管理系统进行了管理 `[DaSt07]`。


    ## 运行


    bot 系统的生命周期可以分为几个阶段。进入受害者系统（初级感染）、加载实际 bot 软件（二级感染）、通过 `C & C` 通道与主建立联系，随后执行命令。


    ## 进入受害者系统


    在僵尸网络环境中，获取新的受害者系统不受控制，通常由主指示现有 bot 寻找并感染受害者系统。僵尸网络的传播机制是网络流量（由恶意软件引起）的主要原因之一，主要位于端口
    `445/TCP`、`139/TCP`、`137/UDP` 和 `135/TCP`。根据 Honeynet 项目，测量的网络流量中 80% 由这些端口引起
    `[BHKW05]`。连接到这些端口的常见来源也是 Windows 操作系统的漏洞、点对点程序和电子邮件客户端。此外，可以观察到 bot 利用其他恶意软件的功能将其安装到受害者系统
    `[CoJM06]`。除了利用漏洞，“社交工程”方法也被用于导出。通常，受感染系统立即执行下载。下载的 URL 直接或间接地地在二进制文件中给出。常用协议包括简单的文件传输协议（`TFTP`）、文件传输协议（`FTP`,
    `[PoRe85]`）、超文本传输协议（`HTTP`, `[FGMF99]`）或发送 IRC 用户的 `CSend`。后者在 `IRC` 作为 `C & C`
    通道的范围内特别有用。用于感染系统的软件通常没有参与僵尸网络的功能 `[RZMT06]`。下载后，二进制文件在操作系统中注册并在系统启动时自动启动。现有 bot
    作为这些二进制文件的服务器 `[RZMT06]`；在某些情况下，被破坏的服务器或免费空间提供者也被滥用 `[BHKW05]`。`Agobot` 包含了初级感染后可以远程导出的少数所谓的“命令”。这些命令仅涵盖了通过
    `IRC` 通信和下载附加组件。因此，任何破坏函数必须由二级二进制包添加。名为 `Phatbot` 的 `Agobot` 开发也提供了初级感染后导出 `DDoS`
    攻击和数据窃取的功能。因此，二进制文件可以预配置为执行有害活动，无需 `C & C` 通道的命令。


    ## C & C 通道


    多种协议用于 `C & C` 通道来控制 bot。`IRC` 协议被广泛建立。点对点系统的泛滥也可以包含聊天形式的自由定义指令，使得 `e2k`、`Gnutella`
    或 `FastTrack` 等协议流行。bot 程序的模块化结构允许访问不同的协议。2003 年的 `SDbot` 不仅可以使用 `IRC`，还可以使用已建立的点对点协议作为
    `C & C` 通道 `[CoJM06]`。


    ### IRC


    尽管近期有所发展，通过 `IRC` 通信仍然是最广泛使用的通信信道。这得于协议的灵活性以及用于编写恶意软件的免费实现。在典型场景中，主在服务器上运行 `IRC`
    通道，bot 自动连接到该服务器。`IRC` 通道大多受密码保护。用户名、密码、通道名和服务器地址永久集成到二进制恶意软件中。大多数情况下，使用动态 URI
    在需要时更改服务器。要成功连接到 `IRC` 通道，需要根据特殊算法形成用户名，以及通过 `IRC` 特有的 `PASS` 命令正确传输密码 `[RZMT06]`。`IRC`
    协议不提供任何加密，因此所有访问数据都可以从网络嗅探中获取。身份验证成功后，`IRC` 服务器分别向 bot 信息 `RPL_ISUPPORT`、`RPL_MOTDSTART`、`RPL_MOTD`、`RPL_ENDOFMOTD`
    和 `ERR_NOMOTD` `[OiRe93]`。`RPL_MOTD` 可以在 bot 进入通道之前向其传输命令。例如，可以指定新的通道名或替代服务器。bot
    在进入 `RPL_TOPIC` 后解析并执行命令。`RPL_TOPIC` 遵循由方法名和参数组成的简单语法。`RPL_TOPIC` 的形状为 `.advscan
    lsass 200 5 -r -s` 指令 bot 继续传播自身。在 90 年代初，公共 `IRC` 通道被用作 `C & C` 通道。对于公共 `IRC`
    服务器，这种滥用是一个巨大的安全风险。然而，现代观测显示，僵尸网络几乎使用修改过的 `IRC` 服务器。修改过的僵尸网络通常不遵循 `RFC1459` 指定的属性。僵尸网络中的
    bot 数量是不可访问的，作为规则，通过 `JOIN`、`PART` 和 `QUIT` 消息输出。性能通过省略 `RPL_ISUPPORT`、`USERS`
    等消息实现 `[OiRe93]`。应用层或 `TCP` 上的攻击落后 `[Netw07]`。因此，`DDoS` 是僵尸网络带来的首要威胁。只有僵尸网络（占比
    64%）发送垃圾邮件 `[Netw07]`。这通常通过受感染系统上的 `SOCKS v4/v5` 代理 `[LGLK96]`（在 `[BHKW05]`）的
    `IRC` 通道。


    ### P2P


    使用点对点网络作为 `C & C` 通道，与经典的 `IRC` 通道方法不同，追求去中心化策略。`P2P` 系统上的通信通常不会被中断或被破坏。从主的视角来看，其缺点是流量的不确定性和缺乏控制。对于
    `P2P` 系统，已经有机制可以匿名化流量 `[CoJM06]`。`P2P` 作为 `C & C` 通道在文献中较少讨论。


    ### HTTP


    特别是针对 `WWW` 上有害操作（如点击广告、操纵赌场和网页游戏）的 bot 使用 `HTTP` 作为 `C & C` 通道。例如 `Clickmaster`
    和 `Clickbot.A` `[DaSt07]`。它们通常是 Internet Explorer 的 `BHO`（浏览器辅助对象）。通过与浏览器集成，`BHOs`
    即可访问 `WWW` 资源。


    ### 确定性通信


    遵循现有完全集中 `P2P` 系统的示例，bot 之间也可能在不使用所有协议的情况下进行去中心化的通信。在这种情况下，bot 可以主动扫描其网络中的额外成员，并向发现的成员发送加密消息。延迟非常高。这种系统尚未在生产形式中被观测到
    `[CoJM06]`。


    ### 命令翻译


    主向单个 bot 命令发生在无法用通用术语指定的语法中。关于它们的形状无法做出概括。流行的 `Agobot` 使用以下语法：

    ```

    .<command_class> <subcommand> <parameter>

    ```

    这是命令顺序：

    ```

    .ddos.syn 129.13.182.1 21 200

    ```

    bot 对卡尔斯鲁厄大学的 Web 服务器进行 200 秒的 `DoS` 攻击。


    ## 应用与命令类


    僵尸网络首先是用于执行潜在犯罪和有害行为的基础工具。简而言之，应该按照频率顺序考虑各种危害潜力：


    ### DDoS


    “分布式拒绝服务”是僵尸网络带来的最常见威胁。根据 `[Netw07]` 的调查，71% 的观测到的僵尸网络处于 `DoS` 攻击中。在这种情况下，主命令所有
    bot 向定义目标发送大量的网络流量。受攻击的服务器由于请求过多无法正常提供服务。调查显示，目前僵尸网络的大多数攻击通过 `UDP` 进行。应用层或 `TCP`
    上的攻击落后于 `[Netw07]`。因此，`DDoS` 是僵尸网络带来的首要威胁。


    ### 垃圾邮件


    64% 的所有观测到的僵尸网络发送垃圾邮件 `[Netw07]`。这通常通过受感染系统上的 `SOCKS v4/v5` 代理 `[LGLK96]`（在 `[BHKW05]`）工作。`Agobot`
    还能构建思科系统的通用路由封装（`HLFT94`）隧道，这使得封装邮件协议变得变得容易 `[CoJM06]`。34% 的所有观测到的僵尸网络能够提供这样的开放代理来发送垃圾邮件和其他活动
    `[Netw07]`。


    ### 数据窃取


    某些 bot 能够像经典木马一样从受害者系统汇总信息并将其发送给主。这些特别是是存储在系统上的电子邮件地址、密码和其他身份数据（占僵尸网络的 16% `[Netw07]`）。此外，僵尸网络还提供了各种钓鱼元素（占所有僵尸网络的
    37%）。


    ### 其他


    由于僵尸网络具有来自互联网服务提供商（ISP）池的不同 IP 地址，僵尸网络越来越多被用于商业欺诈。这里主要的提供者是广告提供商（如 Google AdSense
    `[DaSt07]`）。


    ## 跟踪僵尸网络


    ### 病毒扫描器


    对受害者系统进行病毒扫描器的识别与用于其他恶意软件的跟踪策略相同。所有商业病毒扫描器都能检测并删除已知软件。这种方法将不再进一步讨论。


    ### 蜜罐与恶意软件收集


    控制受害者系统并分析恶意软件在广义上指的是恶意软件收集。在两种方法中，隔离僵尸网络对于 `C & C` 通道都是重要的；这通过监听受感染系统产生的网络流量完成，特别是由于
    `IRC` 登录参数 `[BHKW05]`。


    ### 无人机


    模拟僵尸网络行为的软件被称为 drone。


    ### 基于 IRC 的僵尸网络检测


    通过过滤器可以发现大量的 `C & C` 通道。一种简单的方法是监控 TCP 端口 `6667` 的流量。另一种方法是搜索 `IRC` 通信中的模式。通常情况下，bot
    在很长时间后才会快速响应主的命令。这种类型的 bot 通常成功发现了僵尸网络但具有高错误率 `Raci04`。然而，通过 `IRC` 通信的僵尸网络的特征是明显的
    `[CoJM06]`。


    ### 组合与数据挖掘


    所有已知的用于检测僵尸网络的系统都存在高失败率。要么小类僵尸网络可以被检测，要么密度非常低。新方法建议对僵尸网络的属性进行分析。特征包括对未使用的 TCP
    端口增加扫描、对缓存的分析以及对二进制文件的分析。这些方法的组合可以用于全面 `[CoJM06]`。


    ## 分析僵尸网络大小因素


    尽管过去包含 80,000 到 140,000 个 bot 的僵尸网络被归类为危险，近年来的报告警告包含几百个 bot 的僵尸网络 `[Netw07]`。因此，活跃
    bot 的估计是评估僵尸网络危险潜力的重要特征。开发小型僵尸网络有几个原因：首先，小僵尸网络更容易被强效的安全软件检测，不像大型僵尸网络那样。此外，移动宽带连接也消除了获取多个
    bot 的需求。在平均 1Mbps 的有线互联网连接下，只需要几百个 bot 达到 OC3 (155Mbps) 链路的容量。因此，攻击者的有效 `DDoS`
    攻击对于少于 200 个 bot 已经是可能的。然而，僵尸网络大小的评估仍然当前研究的一个争议性。Dagon 等人调查了所谓的 350,000 个活跃 bot
    的僵尸网络 `[DaZL06]`。Rajab 认为规模小于 1,000 个 bot 的僵尸网络具有潜在危险 `[RZMT06]`。大小是最特征，但对于如何定义这种规模存在通用分歧。确定大部分僵尸网络的一个问题是活跃
    bot 和被 bot 之间的区别。活跃 bot 通常占总数的 5-10% `[Netw07]`。僵尸网络的大小参数与所使用的测量方法、相关的副作用以及上下文直接相关。此外，僵尸网络的大小并没有说明僵尸网络带来的危险。此外，被
    和活跃 bot 的划分没有明确定义，在现有测量方法中难以访问。因此，文献中建立了两种定义。僵尸网络的足迹表示在特定时间点僵尸网络的潜在总量（`Gesamtrobe`）。所有配置为加入观测到的僵尸网络的受感染系统将被计算。该参数提供了关于信息网络分布率以及传播机制有效性的信息。僵尸网络的足迹是随时间变化的，取决于受影响系统的每日传播和对策措施
    `[RZMT07]`。足迹的替代术语是被 和活跃 bot 的数量。第二种定义提供了活跃人口（生存人口）的指示。该参数描述了特定时间通过 `C & C` 通道检索的可用
    bot 数量。因此，僵尸网络不再可控。从攻击的角度来看，这种中心化部署导致低延迟。遵循现有完全集中 `P2P` 系统的示例，也可能在不使用所有协议的情况下在
    bot 之间进行去中心化的通信。在这种情况下，bot 可以主动扫描其网络中的额外成员，并向发现的成员发送加密消息。延迟非常高。这种系统尚未在生产形式中被观测到
    `[CoJM06]`。


