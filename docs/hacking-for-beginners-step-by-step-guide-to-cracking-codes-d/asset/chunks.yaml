    # 第 2 章 – 被动侦察与足迹追踪


    被动侦察/足迹追踪类别包括可以在不直接与目标系统交互的情况下收集目标信息的技术。通过使用“第三方”源获取信息，攻击者不会在目标系统上留下任何痕迹，例如以服务器日志条目中的
    IP 地址的形式存在。足迹追踪的可能性包括但不限于查看公司网站、可能使用代理来伪装自己的身份和 IP 地址。


    ## 通用搜索

    通过搜索引擎、网页或新闻进行通用搜索，可以找到关于目的地的通用信息。


    ## 重要信息

    目标系统使用的技术可以用于研究职位空缺，因为对网络专员的需求可以推断出所使用的产品。对于攻击者来说，检查员工的个人网页（如果有）并收集即时通讯软件用户名、电子邮件地址和电话号码可能也很重要。通常情况下，关于目标的任何信息在攻击时都是有用的，因此，至少在侦察阶段，这些信息是重要的并且应该被收集。


    ## Google Hacking

    Google Hacking（谷歌黑客攻击）是一种利用搜索引擎的所谓“高级”操作符在网络上寻找攻击者可以利用进行攻击的信息的技术。这种技术可以用于查找搜索引擎网页爬虫索引的
    Web 服务器上的所有文件和信息。这些包括服务器的目录列表、使用的服务器软件的确切版本、公司内网的信息或员工的个人信息。因此，由于 Google Hacking
    的利用，私密或安全敏感信息在服务器上被意外泄露，搜索引擎爬虫索引了这些信息，导致攻击者通过搜索查询即可获取它们。


    其他可能的 Google Hacking 查询还包括公司的域名、安全漏洞及相关的漏洞、匹配特定漏洞的目标、用户名、密码或源代码。以下操作符代表了 Google
    Hacking 搜索中使用的部分操作符：


    - `intitle:`将结果限制为标题中包含紧随其表达式的文档。

    - `inurl:`将结果限制为 URL 中包含紧随其表达式的文档。

    - `filetype:`将结果限制为具有相应文件扩展名的文档。此外，必须指定指定的搜索词 `ff`。

    - `site:`将结果限制在指定域内的文档。


    这些操作符现在可以几乎任何方式组合成搜索查询，并可以“调出”大量与安全相关的数据。例如，这里有一个 Google Hacking 数据库 [Long07]
    的搜索查询，该数据库记录了许多网络安全领域的 Google 请求。


    ### 侦察

    如果服务器权限设置不当且 Google 爬虫可以读取 `/etc/password` 文件夹的内容，攻击者可以使用此搜索查找密码文件。攻击者随后可以尝试通过字典攻击破解找到的密码文件（这些文件通常是加密的），并使用解密后的密码访问发现的系统。攻击者的另一种可能是将密后的“密码”添加到他的字典中以便进一步攻击。


    ### DNS

    域名系统（DNS）是一个层次化的、分布式的数据库，为域名分配一个或多个 IP 地址。通常，此 IP 地址对用户是隐藏，但可以进行显式查询，从而作为关于组织
    IP 地址范围的进一步搜索或 WHOIS 查询的起点。[Mock87]


    ### WHOIS 查询

    `NICNAME/WHOIS` 协议用于查询提供注册域名和 IP 地址目录的分布式数据库。最初，标准 [HaSF85] 仅在一个中央服务器上提供一个中央数据库，因为所有域名都由网络信息中心集中管理。随着互联网的增长，该标准进行了更新并切换到分布式数据库系统。[Daig04]。各种顶级域的管理也已交给了几个注册商，每个注册商都维护自己的
    WHOIS 数据库。可以使用不同的工具或 Web 界面进行 WHOIS 查询。


    DENIC（德国网络信息中心）负责分配和管理 `.de` 域名，其数据库为域名 WHOIS 查询提供以下信息 [DENI07]:


    - **Holder**（所有者）：这是域名的所有者，是 DENIC 的签约方。

    - **Admin**（管理员）：这是由域名所有者指定的管理员联系人，负责对域名做出决策。

    - **Tech**（技术支持）：这是域名的技术维护者，对于租用 Web 空间的个人是如此。

    - **Zone**（区域）：管理员是注册域名的技术维护者，负责域名的可用性。对于个人来说，这通常是相同的 Tech 的提供者。

    - **Name**（名称）：组织、邮政编码、国家以及时间戳。可选的 Holder 和 Admin 始终有 Tech 和 Zone、电话号码和电子邮件地址。此外，域名截止日期和至少两个名称服务器会显示。攻击者现在可以使用指定的名称服务器作为起点进行搜索。关于管理员联系人的详细信息可以被社会工程学使用，如果执行以
    IP 地址为参数的 WHOIS 查询，将输出 IP 地址范围，这对于被动侦察非常有用，因为可以检查响应外部的活跃系统。


    ## 主动侦察

    主动侦察是指直接与目标系统交互以收集更多目标系统信息的技术。包括通过端口扫描发现服务器上的开放端口，以及通过操作系统指纹识别操作系统。这些技术应用在被动侦察之后。发现的系统信息可以实现更有效的攻击。


    ### Ping 扫描（Ping Sweeps）

    网络扫描通过发现开启并响应 ping 请求的活跃系统。ping 过程本身使用互联网控制消息协议（ICMP）实现，并发送 ICMP 请求包。如果系统是活跃的，它会响应
    ICMP Echo 包。可以进一步调查 IP 地址范围。


    ### 端口扫描

    如果攻击者发现了活跃系统，可以执行端口扫描以寻找开放端口。开放端口是等待传入连接并接受连接的端口。端口扫描向端口发送 TCP 或 UDP 包并关闭端口的状态。根据设置某些标志的响应如下
    [Info8b]:


    - **TCP Connect Scan**（连接扫描）：该扫描与目标端口建立三次握手（`SYN`、`SYN/ACK`、`ACK`）TCP 连接。如果成功，可以推断该端口上运行着服务并接受连接。

    - **TCP SYN Scan**（SYN 扫描）：在这里没有建立连接，仅向目标端口发送 `SYN` 包。如果系统响应 `SYN/ACK`，则该端口是开放的。由于没有建立连接，此扫描不会在服务器日志中显示为连接或连接尝试。攻击者的
    IP 地址将不会被检测。

    - **TCP FIN Scan, TCP Xmas Scan, TCP Zero Scan**：这些扫描设置 `FIN`、`URG` 和 `PSH` 或无标志。如果端口是关闭，会收到
    `RST` 响应；开放端口忽略这些包且不响应。

    - **UDP scan**（UDP 扫描）：向目标端口发送空 UDP 包。如果答案是 ICMP 端口不可，则端口已关闭；如果没有收到答案，也将视为关闭。使用系统的开放端口，攻击者可以识别接受连接的运行应用程序。通过这些信息，攻击者可以看到系统正在执行的功能，例如对于
    Web 服务器，端口 `80` 通常用于 HTTP；对于邮件服务器，端口 `25` 和 `587` 用于 SMTP。有了这些知识，攻击者可以决定是否选择此服务器作为目标，并针对现有应用程序调整其攻击。


    ### 操作系统指纹识别

    通过操作系统指纹识别向目标发送带有特定标志的 TCP/IP 包并分析答案，从而通过与数据库对比得出所使用的操作系统。数据库包含了实验发现的不同操作系统对这些
    TCP/IP 包的响应。操作系统指纹利用 TCP/IP 栈签名——不同操作系统之间不同的 TCP/IP 实现。系统可以通过创建“指纹”来响应一系列请求。用于指纹识别的请求类型可以根据使用的包类型进行分类：


    - **TCP Requests**：这些请求使用 TCP 包。包包含不同的标志，并分析目标系统对这些标志的反应。

    - **FIN sample**：向开放端口发送一个设置了 `FIN` 标志的包。正确的答案是不响应，但许多实现会回传 `RST`。FIN 探测类似于 TCP
    FIN 扫描，但假设只有关闭的端口返回 `RST`。因此，只有在安全确定请求端口由于其他扫描而开放的情况下，FIN 采样才提供关于实现的信息。

    - **TCP ISN Sampling**：在这里尝试确定 TCP 实现的初始序列数以进行绑定请求。取决于操作系统，将使用不同的方法方法较旧的 Unix
    系统以 64k 为增量增加，较新的系统随机增加，Linux 系统选择随机数，而微软使用一种时间相关的方法，ISN 在每个时间单位内增加固定量。

    - **TCP Timestamp**：在这里检查 TCP 时间戳选项（一个带有发送者当前时间的字段）。某些实现不支持该选项，而另一些则按固定时间增加该值。

    - **TCP Options**：在这里，发送的包使用了某些选项。根据答案中是否包含这些选项，可以看到支持哪些选项。

    - **TCP Initial Window**：TCP 初始窗口会检查返回包的窗口大小。

    - **ACK Value**：响应 `FIN/URG/PSH` 时设置 `ACK` 标志，确认号字段包含根据实现而不同的数字。大多数系统会将接收到的包的初始序列数加
    1。


    '
