  trans: "\n\n# 保护\n\n网站运营者永远不要信任用户输入。所有输入的输入值都必须经过检查和过滤。你应该定义精确的输入表，并仅允许此类输入。\n\n\
    XSS 攻击实际上是在 `< script >` 标签和 `< / script >` 标签（或 `< object>`, `< applet>`, `<\
    \ embeded >`）之间嵌入经过操纵的脚本代码。如果删除了这些标签，恶意脚本代码将不再执行。你可以通过字符串替换来过滤这些标签，例如使用以下 PHP\
    \ 代码：\n\n```php\nfunction filter ($ input) {\n  $ input = ereg_replace (\"<script>\"\
    , \"\", $input);\n  $ input = ereg_replace (\"</ script>\", \"\", $input);\n \
    \ $input = ereg_replace (\"<object>\", \"\", $input);\n  $input = ereg_replace\
    \ (\"</ objectt>\", \"\", $input);\n  $input = ereg_replace (\"<apllet>\", \"\"\
    , $input);\n  $input = ereg_replace (\"</ applet>\", \"\", $input);\n  $input\
    \ = ereg_replace (\"<embeded>\", \"\", $input);\n  $input = ereg_replace (\"</\
    \ embeded>\", \"\", $input);\n  return $input;\n}\n```\n\n这移除了所有带有危险标签的条目，例如上面的窃取\
    \ Cookie。过滤后的脚本代码看起来像这样：`alert (document.cookie);`。当然，它不再有危害了！\n\n在某些情况下，输入应该原样清晰地打印。你可以通过转义用户输入来实现，即将所有特殊字符替换为它们在\
    \ HTML 中的对应项——所谓的转义序列。这些转义序列是一系列表示特殊字符的普通字符序列。例如，字符串 `< script >` 将显示为普通字符串 `<\
    \ script >`，浏览器稍后将其显示为字符串 `< script >`，这不再被识别为标签。\n\n特殊字符的转换可以使用 `htmlentities\
    \ ()` 函数实现。\n\n```php\nfunction escaping ($ input) {\n  $ input = htmlentities\
    \ ($input);\n  return $input;\n}\n```\n\n这种方法处理 XSS 的简单且安全的方法。尽管如此，它有一个很大的缺点：所有特殊字符以及所有标签都被阻止了。当然，用户无法使用\
    \ HTML 标签来格式化他们的文本。\n\n通过关闭浏览器中的 ActiveScripting，你可以防止客户端的 XSS - 没有任何操纵的脚本代码在客户端执行。尽管如此，这无法帮助纯\
    \ HTML 注入（例如使用 `< iframe >` 标签……），但它不像真实的 XSS 那样危险。它在任何情况下无法从客户端窃取 Cookie。\n\n\
    # 第 5 章 – SQL 注入\n\n## 什么是 SQL 注入？\nSQL 注入是对应用程序中的事务 SQL 查询进行操纵，以引发意外反应。[ScSh02]\
    \ 通常，Web 应用为用户提供了与数据库通信的接口，当 Web 应用没有妥善过滤用户输入时，此时会出现安全漏洞，黑客可以使用 `SQL` 命令向数据库发送数据、破坏数据，甚至入侵底层系统。\n\
    \n## 功能与 SQL 注入类型\n根据攻击方式，SQL 注入通常分为三个主要类：SQL 操纵、代码注入、函数调用注入。将在后续章节中通过示例进行解释。\n\
    \n### 1. SQL 操纵\n是指正常运行的数据库查询受到 SQL 语句的影响。通常情况下，攻击者被插入到数据库返回的 SQL 语句的 `where`\
    \ 子句中。因此，操纵 `where` 子句可以改变整个 SQL 语句。\n\n### 2 网页 URL\n`http://www.nosecurity.com/mypage.asp?user=hacker&pass=\
    \ 'hack '` 变成了 Web 应用查询数据库的 SQL 语句：`Select * from table where login = 'hacker\
    \ ' and password = 'hack '`。在执行此查询后，如果表中存在这样的用户和密码，用户将成功登录。现在密码被赋值为 `' or 1 =\
    \ 1 -`。Web 应用的 SQL 语句如下：`Select * from table where login = 'hacker ' and password\
    \ = ' ' or 1 = 1-`。只要存在用户 hacker，就会登录，无论密码是什么。\n\n以下是表单字段中的典型输入，用于判断带有 SQL 注入漏洞的应用程序是否脆弱：\n\
    - 删除数据库表：`'; drop table users--`\n- 关闭数据库：`'; shutdown--`\n- 无需密码验证：`no matter\
    \ 'or ' a '= ' a '`\n- 仅通过用户名验证：`admin ' -`\n\n双连字符 (` -`）将后续所有数据转换为注释。因此，其他条件可以忽略不计。\n\
    \n### 3. 代码注入\n是指在命令流中注入新的 SQL 命令的过程。如果每个数据库查询支持多个 SQL 命令，那么这种类型的攻击将特别危险。请考虑一个使用\
    \ IIS、ASP 和 MSSQL 构建的示例：\n\n"
