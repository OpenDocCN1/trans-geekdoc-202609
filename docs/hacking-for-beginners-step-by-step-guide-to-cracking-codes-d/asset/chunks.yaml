    ## Introduction

    Congratulations on purchasing `Hacking For Beginners` and thank you for doing
    so. There are plenty of books on this subject on the market, thanks again for
    choosing this one! Every effort was made to ensure it is full of as much useful
    information as possible. Please enjoy!


    ## How Are Victims Found? Fingerprinting, Google Hacking, and Co.

    In front of a hacker attack on a system, it is common practice for an attacker
    to engage in education and to inform himself about the target system, if it is
    already known. This allows the attack to be tailored to the target and aligned
    with any weak points that may be present in order to be effective at all costs.
    Depending on the target and motivation of the attackers, various types of systems
    are attacked. The spectrum of these target systems ranges from unsuspecting surfers
    across web pages and servers to corporations and governments.


    The enlightenment phase - the phase before the actual attack in which a system
    is scouted out - can be subdivided into passive recognition and active enlightenment.
    By passive elucidation, we mean the gathering of information without direct contact
    with the target system. On the other hand, active enlightenment attempts to gather
    information through direct interaction with the target system.


    In passive enlightenment, foot-printing, attackers seek information about the
    entire target system. So it is trying to create a rough "footprint." The information
    you are looking for, for example, the hardware used, IP address ranges, IP addresses
    of individual computers or information about a company''s employees. Active enlightenment
    or fingerprinting attempts to profile individual components of a system. Thus,
    individual computers are scouted to find vulnerabilities such as open ports. The
    attackers thus create a "fingerprint " of individual system components and thus
    try to discover potential entry gates.


    The aim of this book is to introduce the techniques used in preparation for the
    preparations and to point out appropriate countermeasures. For this purpose, first,
    the various types of attackers and their motivation for attack and potential target
    selection are introduced. Subsequently, the phase of clarification with the techniques
    used in passive and active elucidation is presented in detail. Finally, countermeasures
    are shown, addressing both general measures and those specifically tailored to
    the clarification techniques presented here.

