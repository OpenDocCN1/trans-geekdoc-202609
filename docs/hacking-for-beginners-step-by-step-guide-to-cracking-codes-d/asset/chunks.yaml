    # 第 14 章 – 嗅探与欺骗：针对数据链路层的攻击


    本节的目的是说明“嗅探”（sniffing）和“欺骗”（spoofing）方法的关键特征，以及它们与针对第 2 层和第 3 层网络协议攻击的相关性。它还描述了检测此类攻击的方法以及网络管理员可能采取的防御措施。这将使用户能够更好地保护自己免受此类攻击及可能的损害。


    ## 引言


    计算机网络常用的通信模型是 ISO/OSI 分层模型，这是一种用于异构计算机网络的分层通信模型 [Tane03]。每一层都隐藏了所有下层的信息，并为上层提供一个定义良好的接口，该接口为网络通信提供了方法。如果该模型中的某一层被攻破，上层的完整性也会会受到影响。攻击低层数据传输的可能性是多样的，而且有时并不非常复杂。为了能够表示这些攻击并解释可能的防御措施，我们首先简要回顾了
    `ISO/OSI` 模型的结构。此外，还将解释最重要协议的功能，以及分层通信模型的根本缺陷。随后，给出了“嗅探”和“欺骗”的术语。然后，我们描述了攻击者可以用来破坏网络系统安全的特定方法；之后，解释了使用录制数据可以使用哪些后续方法。最后，我们讨论了其他基于嗅探和欺骗技术的进一步方法。


    ## ISO/OSI 模型中的第 1 到 4 层


    为了让执行在不同计算机系统上的两个应用程序之间能够通信，需要许多不同的硬件和软件组件。特别是网络适配器、驱动程序、软件库和应用程序的一部分是必需的。从通过解码和转发信号进行物理信号传输到应用层，可以识别出一个分层通信过程，即
    `OSI` 模型。该模型通过描述各个层，对它们功能的各个组件及其任务进行了分类。某某层的组件通常访问下层提供的服务和方法来完成其任务，反之也为下一层的组件提供各种服务。每一层都在下一层之前隐藏其实现细节，同时可以透明地与远程计算机系统上的对应部分与底层进行通信。因此，在不同系统的两个相同层之间存在虚拟的水平通信，即不同系统上相同组件之间的数据交换；而实际通信与下层之间是垂直的。只有在信号传输的最低水平上才会发生真实的物理水平通信。这种统一建模使得即使在异构环境中（即涉及各种传输技术、操作系统和应用程序）也能进行通信。如果将发送者和接收者视为应用程序，那么第
    1-4 层至关重要，因为数据的分布、交换和物理传输就发生在这里。第 5-7 层在发送者和接收者自身的计算机系统内部发挥作用。由于未解释的电信号具有高度复杂性，第
    1 层并不代表实际的起点。从第 2 层开始，数据已经以数字形式存在，可以被程序和用户读取、评估，甚至可能被修改。因此，即使攻击者访问了第 1 层数据（即接收电或光信号），它也必须通过解码传输到第
    2 层才能进行分析


    ## 各协议的功能


    这里给的功能描述仅限于协议的安全相关方面，并不声称完整。更详细的描述可以在参考文献中找到。


    ### 第 2 层：CSMA/CD (以太网)


    `Ethernet` 协议的基本思想是所有连接订阅者对公共链路进行持续监控。为了避免冲突，只有在没有其他站正在传输时才传输数据。然而，由于信号传播速度有限，如果两个订阅者同时开始传输，就会发生冲突。`Ethernet`
    协议现在是计算机网络的准标准，但在电信领域以及照明技术领域也变得流行。`Ethernet` 协议中最常见的拓扑结构是总线系统和星型网络。对于现代 `Ethernet`
    网络，需要具有八对扭绞和屏蔽线的双绞电缆。根据速度的不同，仅使用四对中的两对。


    ### 第 2 层：令牌环 (Token Ring)


    在 `token-ring` 协议中，一次只有一个用户有权以虚拟令牌的形式发送数据，从而避免冲突。每个参与者都有一个前驱（从其那里接收令牌）和一个后继（将令牌传递给后继）。如果需要传输数据，参与者将数据附加到令牌上并将其标记为“忙”。如果令牌到达接收者处，接收者将获取数据并以相同的方式向发送者发送确认。所述原理产生了闭环拓扑结构。


    ### 第 3 层：IP


    `Internet Protocol` (`IP`) 为网络提供了跨多个站的媒介。这允许多个网络连接，并在未连接到公共介质的计算机之间发送数据包。`Internet
    Protocol` 第 4 版使用 32 位长的 IP 地址，通常由四个十进制字节表示，例如 `194.25.2.129`。然而，`Internet Protocol`
    第 6 版使用 128 位长的地址，其表示法与 MAC 地址相似，例如 `2001:6f8:915:0230:feb9:742b`。两个版本的共同点是，除了
    IP 地址外，网络掩码通过将 IP 地址分为网络部分和计算机部分来确定目标计算机是否可访问。如果本地无法访问计算机，通常会选择一个后续计算机并将包转发到那里。这一过程被称为“路由”。


    ### 第 2 层：ARP


    在 `Address Resolution Protocol` (`ARP`) 的帮助下，`Internet Protocol` (`IP addresses`)
    的地址被转换为硬件地址（也称为 `MAC addresses`）。`MAC addresses` 长度为 48 位，以十六进制形式表示（例如 `00:0c:29:4f:8b:ac`）。网络中的每个参与者都以表格形式存储
    IP 地址到 MAC 地址的映射。如果本地无法访问计算机，通常会选择一个后续计算机并将包转发给它。在 Linux 计算机上可以使用 `arp` 命令查看当前的
    MAC 表。例如，条目如下：`computer (192.168.1.1) at 00:0c:29:4f:8b:ac`。在这里你可以看到计算机（“computer”）、IP
    地址和相应的 MAC 地址。此外，通过哪个网络适配器可以到达计算机（这里是“eth0”）。`ARP` 由此建立了第 2 层和第 3 层之间的连接。这是一个非常简单的无状态协议，只有两个数据单元：`arp-request`
    和 `arp-reply`。为了确定关联订阅者的 MAC 地址（例如 `192.168.1.1`），会生成 `arp-request` 包并发送到所有连接到公共介质的站。目标
    IP 地址站会将 MAC 地址存入自己的 MAC 表，并发送包含自身 MAC 和 IP 地址的包。这允许发送者正确地找到其他包。


    ### 第 3 层：ICMP


    `Internet Control Message Protocol` (`ICMP`) 用于在网络中的通信伙伴之间交换控制信息。在这些协议中，数据单元有“echo-request”和“echo-reply”。通过
    `echo-request` 包，一个参与者向另一个人请求 `echo-reply` 响应。这通常会有回答，使得 `ICMP` 成为参与者可用性的常用检查。此外，可以测量响应发生之前的时间，从而获得通信伙伴反应的大致估计，即所谓的“延迟”。为了发送和接收此类包，可以使用每个操作系统都提供的
    `ping` 程序。


    ### 第 4 层：DNS


    `Domain Name System` (`DNS`) 提供了将计算机主机名（例如 `www.google.com`）翻译为 IP 地址的方法。它节省了用户在浏览器等程序中输入
    IP 地址的麻烦，并已成为该功能的标准。此外，如果配置当，可以使用 DNS 服务器将 IP 地址“反向”为主机名，例如反向 DNS。在计算机网络中，此服务通常由一个或多个
    DNS 服务器提供。


    ### 第 4 层：DHCP


    `Dynamic Host Protocol` (`DHCP`) 处理连接站的动态自动配置。它为参与者提供参与网络通信所需的信息。这通常包括 IP 地址、网络掩码、默认网关和一个或多个服务器。`DHCP`
    可能的应用是网络计算机系统的简化自动配置。


    ## 分层通信模型的根本缺陷


    分层通信始终将一个定义明确的功能封装在下一层。使用下层服务的进程依赖于它来执行工作。通常情况下，如果某点的通信被攻破，数据和内容（包括上层的控制信息）也会受到影响。如果上层传输的内容未加密或采取其他安全措施，可靠的通信将不再可能。因此显显然，整个系统永远没有单个组件更安全。对底层之一的攻击是一个严重威胁。


    ## 嗅探


    在网络安全背景下，`sniffing` 指监听数据。因此，它是对网络安全的被动攻击，因为攻击者通常不向网络发送数据。相反，他将尝试通过收集和读取秘密（如用户名和密码以及机制）来获取更多信息。由于其被动性，嗅探攻击很难检测。如果攻击者自己发送数据以获取网络流量，他就会暴露。此外，在某些情况下，可以尝试让治疗者暴露。


    嗅探的目的并不总是造成损害、忽略信息或绕过安全。相反，嗅探可以帮助监控网络并及时检测故障、攻击和其他中断。


    ## 欺骗


    在网络和计算机安全背景下，`spoofing` 指伪造外部身份。`spoofing` 可以发生在 `ISO/OSI` 模型的每一层。与嗅探攻击不同，层的攻破并不会自动阻止发生的通信：IP
    包中的伪造发送者地址并不会导致错误的发送者地址。在本文中，`spoofing` 只被视为对底层以及那里如 `ARP` 和 `IP` 等协议的攻击。


    ### 欺骗的积极方面


    通过嗅探，也有不影响系统安全的应用案例：

    - 在设置了所谓虚拟主机（VirtualHosts）的 Web 服务器上，欺骗为其提供数据的域 Web 服务器身份。

    - 在故障转移场景中，MAC 地址的欺骗提供了一种可能性，在主计算机故障时，让客户端在察觉的情况下执行其服务。


    ## 方法与途径


    以下描述了常见的底层组件以及它们的漏洞、原因和可能的防御措施。通常，嗅探和欺骗攻击之间没有明确的区别；两种技术经常被同时使用，特别是当数据需要被重定向以便随后读取时。此外，通过嗅探身份信息（如密码和用户名），你也可以通过欺骗攻击获取地址。


    ### 电缆与集线器


    如果网络中的所有站都通过电缆连接，那么每个参与者都会接收所有包。当站通过集线器连接时也是如此。各个站的网络适配器知道自己的 MAC 地址并过滤指向它们的数据包。


    ### 示例


    以下是一个在网络接口上读取的 `ARP` 流量示例输出。你可以看到两个实体：具有 IP 地址的参与者尝试确定具有 IP 地址的节点的 MAC 地址。在这里他发送
    `arp-request` 包。正如左侧列所示，对这种请求的响应在极短时间内完成。


    ```

    1.0.0 ARP request 192.168.1.1 has 00:0c:29:4f:8b:ac

    2.0.0 ARP reply 192.168.1.1 is at 00:50:56:c0:00:ae

    ```


    等待，提供的文本在十六进制块中包含乱码（可能是由于 OCR/复制粘贴错误）。我将保持所提供的结构。


    在多用户系统中，无论使用何种传输技术，都可以监控其他用户的网络流量，只要你有读取网络适配器数据包的必要权限。在 Linux 系统中，只有 `root` 用户授权此操作。非特权用户接收到的错误信息是：`socket:
    Operation not permitted`


    ### 无线网络


    除了以太网，无线网络（WLAN）在第 2 层的行为就像所有涉及的站通过公共电缆连接一样。毕竟，每个参与者都可以通过天线接收所有数据流量。再次，可以使用杂散模式的网络适配器读取其他参与者的包。与有线网络不同，无线网络经常使用加密传输数据的方法。攻击者必须已经是加密网络的一部分。


    ### 窃听


    获取网络包的另一种方法是字面上对你具有物理访问权的任何有线网络进行“接入”。这一过程被称为窃听或分路；使用的设备被称为 TAP 设备。最构可能的 TAP 设备由一个网络适配器组成，其接收线连接到要监控的电缆传输线上。然而，当前的以太网传输器会定期发送信号以检查对方是否仍在响应。由于电缆的单侧连接，这种检查会失败，你必须依靠带有
    AUI 收发器的旧卡。由于这种方法更多像是一种“黑客行为”而非可靠的方法，购买专业的 TAP 设备会更好。这些设备透明地转发网络流量，但提供了向连接的订阅者发送副本的机会。现代交换机也有为了监控目的而复制单个端口上所有流量的能力。


    ### TAP 设备的优点


    这种 TAP 设备的优势是它只被动工作。如果你用它来调查网络攻击和故障，由于其被动性，它只有几个缺点，因此只能被破坏。攻击者无法获取有关系统存在或状态的信息。另一方面，如果攻击者成功在网络上安装了
    TAP 设备，通过流量分析进行追踪是非常的。


    ## 检测可能性


    取决于攻击者的行为范围，有方法可以在网络上跟踪嗅探器。然而，对于这些大多数可能性，攻击者的防御措施有时出现在攻击者和防御者之间。


    - **名称服务器请求**：目前的嗅探程序（如 `tcpdump`）提供了使用反向 DNS 功能显示主机名而非 IP 地址的能力，从而增加了输出的可读性。可以在名称服务器上检测到大量的
    DNS 查询。如果你额外配置一个具有网络空间之外 IP 地址的网络节点并让它自动生成网络流量，你可以在名称服务器上检测到对其 IP 地址的请求，并得出你正在使用嗅探器的结论。

    - **延迟**：通过测量响应发生之前的时间，从而获得通信伙伴反应的大致估计，即所谓的“延迟”。为了发送和接收此类包，可以使用每个操作系统都提供的 `ping`
    程序。

    - **故障**：通常，如果某点的通信被攻破，数据和内容（包括上层的控制信息）也会受到影响。如果上层传输的内容未加密或采取其他安全措施，可靠的通信将不再可能。因此显然，整个系统永远没有单个组件更安全。对底层之一的攻击是一个严重威胁。

    - **MAC 地址欺骗**：攻击者通过在自己的 MAC 表中存入错误的 MAC 地址来实现。

    - **ARP 请求**：由于其被动性，嗅探攻击很难检测。如果攻击者自己发送数据以获取网络流量，他就会暴露。此外，在某些情况下，可以尝试让治疗者（此处可能应为译者）暴露。

    - **路由**：如果本地无法访问计算机，通常会选择一个后续计算机并将包转发到那里。

    - **ARP 请求**：会生成 `arp-request` 包。

    - **ARP 回复**：通常会有回答。


