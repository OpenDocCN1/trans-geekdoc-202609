    \ of the owners. Symantec security software company monitored over 5 million bot-infected\
    \ computers over a 6-month period. \\[Corp07\\] In addition to sending messages\
    \ directly through SMTP, some trojans also try to exclude credentials to the email\
    \ provider's server and use them to send messages after authentication. Authenticity\
    \ Not Verifiable Since the authenticity of a message and the correctness of the\
    \ sender's information cannot be checked without further technical measures, such\
    \ as electronic signatures, a distinction between spam and regular messages is\
    \ difficult. The fact that spam e-mails have to be sorted out and deleted manually\
    \ is the main cause of the costs incurred by the recipient. No Uniform Handling\
    \ Against Spammers Due to the international nature of the Internet and the lack\
    \ of a uniform legal basis, there is no uniform approach against spammers. While\
    \ some countries now have anti-spam laws in place, others have no legal basis\
    \ for persecuting spammers. Shipping Since one or more servers can always be located\
    \ on the basis of their IP address and can be taken off the net by public authorities,\
    \ the transmission of spam messages is usually carried out by external computers.\
    \ While the former was often  open relay, today it is almost exclusively botnets,\
    \ the merger of many zombie computers. Another way that spam is sent is the misuse\
    \ of e-mail forms on web pages (e-mail injection). Spammers try to inject additional\
    \ headers and in the worst case can send emails of any content to any recipient.\
    \ \\[Brau05\\] "
