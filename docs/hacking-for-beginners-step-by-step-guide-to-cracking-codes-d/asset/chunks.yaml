    # 第 10 章 – 垃圾邮件、钓鱼攻击：应对措施


    应对措施可以分为在现有系统内运行的操作以及试图弥补邮件系统弱点的操作。为了避免对预期的邮件流量产生干扰，使用列出的程序配合常规通信伙伴的名单来排除来自他们的消息是有意义的。预设方法通常在邮件服务器上使用，但某些也可以在邮件客户端中实现。


    ## 垃圾邮件处理

    以下许多方法试图将垃圾邮件与合法邮件区分开来。本节解释了如何处理被分类为垃圾邮件的消息。


    ### 拒绝 (Reject)

    拒绝分类为垃圾邮件的消息的优点是它们不会给邮件系统和终端用户带来负担。缺点是误分类的消息无法到达接收者。实现这一点有两种方法：


    *   **接受消息并稍后标记及创建退回邮件（bounce message）**：优点是技术上先接受消息稍后进行垃圾邮件分类更容易。然而，由于退回邮件是发送到（通常是虚假的）发送者地址，这种方法会导致无关方承受巨大的负荷，因此不适用。

    *   **在 SMTP 对话期间拒绝消息（见列表 2）**：这种方法要求发送端在传输过程中进行垃圾邮件检查，因此对技术要求更高。直接拒绝也可以导致邮件地址从垃圾邮件发送者列表中删除，因为显然无法送达给他们。如果是合法消息，发送者将获知问题，发送被拒绝接收的
    `MTA` 会生成一条退回邮件。


    ### 删除 (Delete)

    静默删除消息的益处与拒绝消息相同。然而，如果是一封合法消息，发送者必须假设消息已成功送达，而接收者却从未收到。这就是为什么在实践中静默丢弃消息是没有意义的，特别是由于其实现上更简单之外，它与在
    `SMTP time` 拒绝消息相比没有任何优势。


    ### 标记 (Mark)

    最常见的方法是标记问题消息并将其移动到自己的垃圾邮件文件夹中，以便接收者检查分类结果并删除消息。这种方法的优点是误分类的消息仍然到达接收者。但在实践中，出现了一个问题：收到了大量垃圾邮件，用户经常在不看消息内容的情况下清空垃圾邮件文件夹。那么效果与静默删除相同，即比拒绝消息更糟糕。


    通常会将多种程序结合。因此，在一个误报率很低的分类方法中，可以直接拒绝消息，而仅在不那么明确的方法中进行标记。这结合了两种方法的方法的优点。


    ## 内部的措施

    本节介绍了一些可以在现有邮件系统内部使用的反垃圾邮件措施。


    ### 黑名单 (Blacklists)

    在接收消息时，会对发送者的 IP 地址进行扫描或查询。最常见的类型是过去发送过垃圾邮件的服务器的黑名单（通常是开放中继服务器）。还有违反 `SMTP` 标准的服务器黑名单和拨号地址列表。发送垃圾邮件服务器的黑名单通常用于直接拒绝来自这些服务器的消息。这反过来给服务器运营商施加压力，使其控制通过其服务器投递的消息。使用黑名单非常有效，通常误报率较低。然而，黑名单中总是存在运营商误伤目标的陷阱。因此，自
    2005 年 8 月以来，所有的 `.de` 域名都列在运营商 `RFC-Ignorant.org` 的列表中。这些黑名单条目可以手动或自动添加，例如通过蜜罐技术（honeypots）。


    ### 灰名单 (Greylisting)

    灰名单是黑名单的一种弱形式。邮件在第一次尝试投递时会被之前未知的发送者拒绝，并缓存在灰名单中，但在稍后的第二次尝试中会被接受，并将发送者保存为已知。该方法基于
    `SMTP` 标准，即当目标主机报告临时错误时，以不断增加的间隔重新投递邮件。发送垃圾邮件通常会跳过这第二次尝试。代价是收到新通信伙伴的第一条消息会有延迟，但该过程非常有效。作者在自己的服务器上观察到，灰名单中的消息只有少于
    1/3 被再次投递。通常，该过程会与不遵守 `SMTP` 标准或在投递尝试中使用切换服务器的大型提供者的邮件服务器名单结合使用。


    ### 哈希列表 (Hashlists)

    除了黑名单外，还有存储垃圾邮件本身哈希值的列表。对于大量提交垃圾邮件的订阅者，“新的”垃圾邮件会被及时投递，并由请求此类列表的邮件服务器进行适当处理。例如“分布式校验和和清理中心”（`DCC`，`[Soft]`）。


    ### 垃圾邮件过滤器 (Spam filter)

    垃圾邮件过滤器根据内容对消息进行分类，通常使用评分标准的组合：


    *   通常使用一组固定规则，这些规则包含经常出现在垃圾邮件中的加权标签，例如过度使用大写字母、图像与文本的高比例，或潜在推销工具的伪装名称。通过结合大量的规则，识别率非常高，但规则必须始终更新，因为垃圾邮件发送者会刻意保护其消息免受已知垃圾邮件过滤器的检测。

    *   学习方法（如 `贝叶斯 过滤器 [AKCP + 00]`）基于用户反馈。在此过程中，用户将分类错误的消息（包括误报（正常邮件）和未识别的垃圾邮件）传回过滤器，过滤器会逐渐适应。贝叶斯评分可以存储在通用数据库或个人数据库中。这种方法的巨大优点是，与固定规则不同，它能够适应个人。


    因此，在一个误报率很低的分类方法中，可以直接拒绝消息，而仅在不那么明确的方法中进行标记。这结合了两种方法的优点。作者在自己的服务器上观察到，灰名单中的消息只有少于
    1/3 被再次投递。通常，该过程会与不遵守 `SMTP` 标准或在投递尝试中使用切换服务器的大型提供者的邮件服务器名单结合使用。


    病毒扫描

    垃圾邮件过滤器根据内容对消息进行分类，通常使用评分标准的组合：…… [由于逻辑原因省略] ……扫描器检测消息中包含的病毒。对于合法消息，检测率很高，且误报率较低。


    ### 系统改进

    以下反垃圾邮件措施试图解决问题。


    #### 通过拨号地址

    通过拨号的投递可能会被破解。


    #### 发送者

    为了防止伪造发送者并确保发送者的真实性，开发了多种方法。发送策略框架（`SPF`）指定了哪些主机可以发送。


    ```

    列表 4：somehost.net 条目示例

    somehost.net IN TXT "v=spf 1 -all"

    ```


    #### 递费用

    有一些解决廉价邮件投递问题的想法。销售将通过支付极小金额或解决数学题而变得昂贵。


    '
