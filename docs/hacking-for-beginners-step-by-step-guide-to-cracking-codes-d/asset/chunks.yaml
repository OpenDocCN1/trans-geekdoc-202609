    for Estimating The Botnet Big Different ways of determining these variables are
    the subject of research: Infiltration Infiltration is a collection of techniques
    in which the observer connects himself to the C & C channel to read Botmaster
    commands. This technique also makes it possible to identify the target of a dDoS
    attack even before it actually starts. Specialized tools for this task exist only
    for the IRC protocol as a C & C channel and allow the observer to be slipped into
    a botnet as a drone. "IRC Tracker" \[RZMT06\] created using the IRC access data
    that are extracted from the binary file of the primary infection, connects to
    the C & C-channel. The software claims to have high computing power and high bandwidth.
    In particular, because the source code of Agobot and SDBot is freely accessible,
    IRC Tracker also offers a simulation of the condition-dependent answers of regular
    bots. He is also able to offer a SOCKS v4 proxy. "Drone" provides a clear architecture
    to adapt the software to a modified IRCd \[BHKW05\]. Both software creates log
    files of all commands in the IRC chat. When calculating the actual population,
    it is not enough to pay the number of unique user IDs. In observations of several
    botnets, a ratio between the unique user name of the bot and  the clear IP address
    of the bot could be determined on the average 1: 3 \[RZMT07\]. This ratio is primarily
    due to the multithreading capability of the Bot software. Agobot and derivatives
    provide a clone function that generates as many instances of the bot software
    on the victim system. Thus, it is possible for the botmaster to generate multiple
    bot instances for a single botnet, but also to integrate a victim system into
    multiple botnets. Thus, the botnets are usually not disjoint \[RZMT07\]. Occasionally
    it was observed how botmasters exchange bots or " steal " each other \[BHKW05\].
    The parameter of the population must therefore also be based on an estimate if
    there are accurate and complete log files of the C & C channel. DNS Forwarding
    Dagon et al. developed an alternative method based on the manipulation of the
    DNS entry of the IRC server \[DaZL06\]. This method is applicable if the access
    data within the binary file on the victim system is not in the form of fixed IP
    addresses but as a dynamic domain name. By changing the DNS entry of the C & C
    channel from an authorized site, the connection of the bots can be redirected
    to a separate server. This own server accepts all TCP connections and logs the
    IP addresses. This method only allows the parameter of the footprint to be determined
    with precision and without any estimation. Information about the active population
    cannot be given . However, a botmaster can easily detect the redirection of the
    DNS entry and use the update function of the bots that are still under its control
    to restructure the botnet \[RZMT07\]. The method of DNS forwarding serves only
    to determine the size of the footprint. Information about the botnet''s activities,
    especially transient and future dDoS attacks, cannot be collected. Analysis of
    DNS Caches Information from the botnet itself is not always possible due to the
    increased volume of modified IRCd and the switch to alternative and largely unexplored
    C & C channels. Nevertheless, external data not coming from the immediate environment
    of the botnet can be used to derive information about its characteristics. One
    way to do this is to parse cache data from a DNS server \[RZMT06\]. A bot will,
    under normal circumstances, perform a DNS query to join the C & C channel. This
    query is independent of the protocol of the C & C channel. For analysis, the target
    address to be interrogated is extracted from a captured binary file of the Botsoftware.
    At regular intervals, with multiple DNS servers, the resource may be checked for
    presence in the DNS cache. A cache hit implies that at least one bot in the TTL
    interval of the DNS cache has attempted to log in to the C & C channel. So, the
    size of the footprint can be appreciated. Derivatives of population size are not
    possible. In order to make  a reliable estimate possible, it is necessary to query
    a large number of DNS servers. Challenge of Botnet Destruction Stopping recognized
    and analyzed botnets are generally difficult, and it''s only a little researched.
    In individual cases, it could be observed that hostile Botmaster itself based
    on overcoming traditional security mechanisms, can also be used to stop malicious
    botnets. In the case of a central C & C channel, disabling the central site is
    a secure way to destroy the botnet. Immediate termination of all addresses known
    to the botnet by C & C parameters leads to an immediate stop of the entire botnet.
    In practice, this is possible through the police seizure of servers. Alternative
    and long-term options are unknown. '
