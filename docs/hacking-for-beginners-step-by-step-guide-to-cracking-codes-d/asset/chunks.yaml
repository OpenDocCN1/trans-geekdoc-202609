    # Chapter 14 – Sniffing and Spoofing: Attack on Layer 2


    The purpose of this section is to illustrate the key characteristics of the methods
    "sniffing" and "spoofing" and their relevance to attacks on layer 2 and 3 network
    protocols. It also describes ways of detecting such attacks and possible countermeasures
    by a network administrator. This should enable users to protect themselves from
    such attacks and possible damage better.


    ## Introduction


    The common model of communication in computer networks is the ISO/OSI layer model,
    a hierarchical communication model for heterogeneous computer networks \[Tane03\].
    Each of the layers conceals all underlying layers and provides the upper one with
    a well-defined interface, which provides methods for network communication. If
    one of the layers in this model can be compromised, the integrity of the overlying
    layers is also affected. The possibilities of attacking data transmission on the
    lower layers are manifold and sometimes not very complex. In order to be able
    to represent them and to explain possible countermeasures, we first briefly review
    the structure of the `ISO/OSI` model. In addition, the functioning of the most
    important protocols will be explained, as well as the fundamental weaknesses of
    hierarchical communication models. Subsequently, the terms "sniffing" and "spoofing"
    are stated. Then, we describe the specific methods that attackers can use to compromise
    the security of network systems; after which, it is explained which continuative
    approaches are possible using the recorded data. Finally, we discuss further approaches
    that are based on sniffing and spoofing techniques.


    ## Layer 1 to 4 in the ISO/OSI model To enable communication between two applications
    executing on different computer systems, a number of different hardware and software
    components are required. In particular, network adapters, drivers, software libraries,
    and parts of the applications pay for themselves. Starting with the physical signal
    transmission via the decoding and forwarding of the signals up to the application,
    a hierarchical communication process can be identified, which is the `OSI` model.
    This model describes the individual layers by which the various components of
    their functionality and their tasks are classified. Components of a layer typically
    access the services and methods provided by the underlying layer to accomplish
    their task, and in turn, provide various services to the components of the next
    layer. Each of the layers hides their implementation details before the next layer,
    and at the same time can transparently communicate the underlying layer with its
    counterpart on a remote computer system. Thus, between two equal layers on different
    systems, there is virtual horizontal communication, i.e., data exchange between
    like components on different systems, whereas where the actual communication is
    vertical with the underlying layer. Only at the lowest level of signal transmission
    does real physical horizontal communication occur. This unified modeling enables
    communication even in heterogeneous environment exercises, i.e., involving various
    transmission technologies, operating systems, and applications. If one identifies
    the transmitter and receiver as an application, then the layers 1-4 are of prime
    importance, since here, the distribution, switching, and the physical transfer
    of data takes place. The layers 5-7 play a role within the computer system of
    transmitter and receiver itself. Due to the high complexity of uninterpreted electrical
    signals, the 1st layer does not represent a practical starting point. From layer
    2, the data are already available in digital form and can be read and evaluated
    by programs and users and possibly even modified. So even if an attacker accesses
    Layer 1 data, that is, when receiving electrical or optical signals, it must first
    be transmitted to layer 2 by decoding to allow for analysis


    ## Functioning of the Individual Protocols


    The description of functionality given here is limited to the security-relevant
    aspects of the protocols and does not claim to be complete. More detailed descriptions
    can be found in the individual sources.


    ### Layer 2: CSMA/CD (Ethernet)


    The basic idea underlying the `Ethernet` protocol is constant monitoring of the
    common line by all connected subscribers. In order to avoid a collision, data
    is only transmitted if no other station is transmitting. Due to the finite speed
    of propagation of signals, however, a collision can occur if two subscribers start
    transmitting at the same time. The `Ethernet` protocol is today the quasi-standard
    for computer networks, but it is also becoming popular in the field of telecommunications
    as well as in lighting technology. The most common topologies in the `Ethernet`
    protocol are bus systems and star-shaped networks. For modern `Ethernet` networks,
    twisted pair cables with eight pairs of twisted and shielded wires are required.
    Depending on speed, only two of the four pairs are used.


    ### Layer 2: Token Ring


    In the `token-ring` protocol, only one user at a time has the right to send in
    the form of a virtual token, thereby avoiding collisions. Each participant has
    a predecessor from whom he receives the token and a successor to whom he passes
    the token. If data is to be transferred, the participant attaches the data to
    the token and marks it as "busy." If the token arrives at the receiver, it picks
    up the data and sends a confirmation to the sender in the same way. The described
    principle produces a closed ring topology.


    ### Layer 3: IP


    The `Internet Protocol` (`IP`) provides networks with mediation over several stations.
    This allows multiple networks to be connected and packets to be sent between computers
    that are not connected to a common medium. Version 4 of the `Internet Protocol`
    uses 32-bit long IP addresses, usually represented by four decimal octets, e.g.,
    `194.25.2.129`. Version 6 of the `Internet Protocol`, however, uses 128-bit long
    addresses whose notation the MAC addresses are similar, e.g., `2001:6f8:915:0230:feb9:742b`.
    Common to both protocol versions is that in addition to the IP address, a network
    mask determines whether a target computer can be reached by splitting the IP address
    from the network part and computer part. If a computer cannot be reached locally,
    a subsequent computer is usually selected, and the packet is forwarded to it.
    This decision process is called "routing."


    ### Layer 2: ARP


    With the help of the `Address Resolution Protocol` (`ARP`), addresses of the `Internet
    Protocol` (`IP addresses`) are translated into hardware addresses (also known
    as Media Access Control or `MAC addresses`). `MAC addresses` are 48 bits long
    and are in hexadecimal form (e.g., `00:30:1B:74:2B`). Each participant in the
    network stores the mapping of IP addresses to MAC addresses in tabular form in
    a so-called MAC table. The current MAC table can be viewed on Linux computers
    with the `arp` command. For example, an entry has the following form: `computer.ea
    (192.168.1.14) to 00:30:1B:74:2B [eth0]`. Here you can see the computer name ("computer.ea"),
    the IP address and the corresponding MAC address. In addition, it is saved via
    which network adapter the computer can be reached (here: "eth0"). `ARP` thus establishes
    the connection between layers 2 and 3. This is a very simple, stateless protocol
    in which only two possible data units exist: `arp-request` and `arp-reply`. In
    order to determine the MAC address of the associated subscriber for an IP address
    (e.g., `192.168.1.14`), an `arp-request` packet is generated and sent to all stations
    which are connected to the common medium. The station with the searched IP address
    then takes the sender''s MAC address into its own MAC table and sends a packet
    to the sender that contains both its own MAC and IP address. This allows the sender
    to correctly address other packets for the same IP address.


    ### Layer 3: ICMP


    The `Internet Control Message Protocol` (`ICMP`) is used to exchange control information
    between the communication partners in the network. Among the best-known protocol,
    data units are "echo-request" and "echo-reply." With an `echo-request` packet,
    one participant asks another person for an `echo-reply` response. This will usually
    answer, making `ICMP` the most common review of the accessibility of participants.
    In addition, one can measure the time that elapses before the response occurs
    and thus obtain an approximate estimate of the reaction time of the communication
    partner, the so-called latency. To send and receive such packages, the program
    `ping` can be used, which is available on every operating system.


    ### Layer 4: DNS


    The `Domain Name System` (`DNS`) provides methods by which the hostname of a computer
    (e.g., `www.google.com`) is translated into its IP address. It saves the user
    the trouble of entering IP addresses in programs such as browsers and has established
    itself as the standard for this functionality. In addition, if properly configured,
    `DNS` servers can be used to "rollback" IP addresses into hostnames, for example,
    to make log files of a service that is readable, called "reverse DNS." In a computer
    network, this service is usually provided by one or more DNS servers.


    ### Layer 4: DHCP


    The `Dynamic Host Protocol` (`DHCP`) handles the dynamic and automatic configuration
    of connected stations. It provides participants with all the information they
    need to participate in ongoing network communication. This usually includes an
    IP address, the network mask, the default gateway, and one or more name servers.
    Possible applications for `DHCP` are above the simplified and automatic configuration
    of computer systems in networks.


    ## Fundamental Weaknesses of Hierarchical Communication Models


    Hierarchical communication always encapsulates a sharply defined functionality
    in the next layer. A process that uses a service of the next lower relies on it
    to do its job. As a rule, if a communication at a certain point is compromised,
    then data and content, also control information of higher layers, are also affected.
    If the content transmitted on the higher layers is not encrypted or otherwise
    secured against manipulation, reliable communication is no longer possible. It
    is thus obvious that the overall system is never safer than individual subcomponents.
    An attack on one of the lower levels is a serious threat.


    ## Sniffing


    In the context of network security, `sniffing` refers to the listening of data.
    It, therefore, represents a passive attack on the security of a network because
    the attacker usually does not send data to the network. Instead, he will try to
    gather more information by collecting and reading secrets that are helpful such
    as usernames and passwords, as well as mechanisms. Through his passivity, attack
    by sniffing is very difficult to detect. If the attacker sends data himself to
    gain access to network traffic, he can betray himself. Also, in some cases, one
    can try to make a healer betray himself.


    Sniffing does not always have the purpose of causing harm, omitting information,
    or circumventing security. Instead, sniffing can help monitor a network and detect
    malfunctions, attacks, and other disruptions in a good time.


    ## Spoofing


    In the context of network and computer security, `spoofing` refers to the swapping
    of a foreign identity. `Spoofing` can take place at every level of the `ISO/OSI`
    model. In contrast to sniffer attacks, the compromise of a layer does not automatically
    prevent the communication that occurs: a fake sender address in an IP packet does
    not necessarily lead to a wrong sender address. In this paper, `spoofing` is only
    considered as an attack on lower layers and the protocols there such as `ARP`
    and `IP`.


    ### Positive Aspects of Spoofing


    With sniffing, there are also application cases that do not affect the security
    of a system pay: own- Web servers on which so-called VirtualHosts are set up,
    spoofing the identity of the webserver for whose domain they are delivering data.

    - In failover scenarios, the spoofing of a MAC address offers the possibility,
    in the event of failure of the main computer, having its services performed by
    the clients unnoticed by a replacement computer.


    ## Methods and Approaches


    The following describes the common infrastructure components, as well as their
    vulnerabilities, causes, and possible countermeasures. Often, there is no clear
    distinction between attacking and spoofing attacks; often, both techniques are
    used simultaneously. This is especially the case when data has to be redirected
    in order to be able to read it afterward. In addition, by sniffing at identities,
    such as password and usernames, you can also get addresses which you then accept
    in a spoofing attack in order to further extend an attack.


    ### Cables and Hubs


    If all stations of a network are connected by a cable, then each participant receives
    all packets. This is also the case when the stations are connected by a central
    hub. The network adapters of the individual stations know their own MAC address
    and filter the stream of data packets for those that are addressed to them.


    ### Example


    The following is an example output of the `ARP` traffic that was read on a network
    interface. You can see two things: participant with the IP address .1 attempts
    to determine the MAC address of the nodes with the IP addresses .12 and .222.
    Hereby he sends `arp-request` packages. As can be seen from the time indicated
    in the left column, the response to such a request is made in a very short time.


    ```

    13:37:43.365944 arp who -has 192.168.1.222 tell 192.168.1.1

    13:37:43.366207 arp reply 192.168.1.222 is - at 00:0b:82:05:3f:b7

    13:37:44.586755 arp who -has 192.168.1.12 tell 192.168.1.1

    13:37:44.586892 arp reply 192.168.1.12 is - at 00:11:24:88:02:f0

    ```


    A second example is a package from the login process at `ftp.kernel`. The left-hand
    column indicates the position of the data in the data packet, followed by hexadecimal
    representation of the data. In the right-hand column, the data is displayed as
    readable characters, long as they are each a displayable character. You can see
    password that the user has specified.


    ```

    0x00000005d7ce8e500301bb9742b08004510c0a80b40006451ac0a8010e

    ```


    Wait, the text provided contains garbled characters in the hex block (likely due
    to OCR/copy-paste errors in the source). I will maintain the structure provided.


    On multi-user systems, regardless of the transmission technique used, it is possible
    to monitor the network traffic of the other users, provided that one has the necessary
    rights to read the data packets from the network card. On Linux systems, only
    the user `root` is authorized for this. Unprivileged users receive an error message:
    `socket: Operation not permitted`.


    ### Wireless Networks


    In addition to Ethernet, wireless networks (`WLAN`) on on layer 2 behave as if
    all the stations involved were connected via a common cable. After all, each participant
    can receive all data traffic with one antenna. Again, you can use a network card
    with promiscuous mode switched on to read incoming packets from other participants.
    Unlike wired networks, wireless networks often use methods to encrypt the transmitted
    data transparently. An attacker for functioning surveillance must already be part
    of the encrypted network.


    ### Wiretapping


    Another way to get network packets is to literally "tap" any wired network to
    which you have physical access. This process is called wiretapping or tapping;
    the device used is called a `TAP` device. The simplest conceivable `TAP` device
    consists of a network adapter whose receive lines are connected to the transmission
    lines of the cable that is to be monitored. However, current Ethernet transmitters
    send a signal at regular intervals to check if the other party is still answering.
    By the one-sided connection of the cables, such a check fails, and you have to
    rely on an antiquated card to use with AUI transceiver. Since this method is more
    of a "hack" than a reliable method of analysis, it is ister to buy a professional
    `TAP` device. These forward network traffic transparently, but provide the opportunity
    to send a copy to a connected subscriber. Modern switches also have the ability
    to replicate all traffic on individual ports for monitoring purposes.


    ### Advantages of a TAP device


    The advantage of such a `TAP` device is that it works only passively. If you use
    it to investigate a network for attacks and dysfunctions, it has only a few points
    due to its passivity and can therefore only be badly compromised. An attacker
    cannot obtain information about the existence or state of the system. On the other
    hand, if an attacker succeeds in installing a `TAP` device on a network, it is
    very difficult to trace through traffic analysis.


    ## Detection Possibilities


    Depending on the scope of the attacker''s actions, there are ways to track a sniffer
    on the network. For most of these possibilities, however, there are countermeasures
    of attackers that sometimes comes between attackers and defenders.


    - **Name server requests**: Current sniffing programs (such as `tcpdump`) provide
    the ability to display hostnames instead of IP addresses using reverse DNS functionality,
    thereby increasing the readability of the output. The high number of DNS queries
    for this can be detected on the name server. If you additionally configure a network
    node with an IP address outside the network space and let it automatically generate
    network traffic, you can detect a request for its IP address on the name server
    and conclude that you are using a sniffer.

    - **Latency of the attacker**: If a sniffing program is installed on a computer
    system, this will possibly respond slowly to requests from the network by analyzing
    the network traffic and associated effort. By measuring the response time of the
    connected subscribers from a single computer, e.g., using `ICMP` protocol, one
    can conclude from a correlation of network load and latency of the subscriber
    to the use of a sniffer.

    - **Faulty Software**: In case of errors in implementation of drivers and network
    stacks, you can partially exploit them to see if host is promiscuous. For example,
    if you send an `ICMP echo-request` with the IP address of the computer and a MAC
    address that differs from its own into the network, the computer replied and you
    could conclude that the card was operated in promiscuous mode.

    - **Switches**: All the problems described above occur because each connected
    computer can receive all the data in a network, and the filtering of the data
    is done by the network adapters. This makes it very easy for an attacker to access
    the data shared by other participants. way out of this dilemma seems to offer
    switches. Essentially, they behave like hubs with knowing which computer is connected
    to which of their ports. Thus, in addition to `arp-request` packets, only a packet
    that is also intended for it is forwarded to a computer. For this purpose, a switch
    has a table in which each port is stored, which MAC addresses can be reached via
    this port. A typical example of such a table is 8192 entries for switches with
    16 ports, but the size varies between different manufacturers and models.


    ## Cache Poisoning and ARP Spoofing


    Assuming the switch works properly, eliminates the ability to read data that is
    not sent to one''s address. Therefore it is necessary for an attacker that all
    packages, which are to be read, are addressed to himself/herself. The MAC address
    of the destination computer for a particular IP address is stored by each subscriber
    in a local MAC table. One attack on which the MAC table of a remote computer is
    deliberately infected with false information is called cache poisoning attack.
    To preach to the rest of the network that a IP address can be reached under its
    own MAC address, there are two possibilities:


    - **Answering foreign requests**: Whenever a computer in the network asks for
    the destination IP address, the attacker responds with his MAC address. This must
    happen so quickly that the valid answer of the rightful owner of the IP address
    is rejected. Due to this condition of a very fast response, such an attack is
    very difficult to carry out. In addition, the `ARP` protocol has a vulnerability
    that does not require timely responses to `arp-request` packets.

    - **The vulnerability in the ARP protocol**: In order to simplify the administration
    of networks, it is possible for subscribers to send their MAC address proactively
    in the network and for all connected computers to update their MAC table. This
    procedure is called `gratious ARP`, and it finds application for example in mobile
    network devices that can thus redirect certain data to a proxy in the old network
    when moving from one network to another, without interfering with existing connections.
    An attacker would now miss such a packet, and so his victim would first take the
    wrong MAC address into their MAC table and then address Ethernet packets to the
    attacker. This retransmits its MAC address at regular intervals so that the entry
    in the victim''s MAC table is always up-to-date and the victim himself will not
    make a request to the network. The ARP package used here is a usual `arp-reply`,
    which prevents gratious ARP only from stateful packet filters. A detailed description
    of opportunities and a program to inspect this provides the program `arpspoof`
    from the `dsniff` package \[Song\]..


    ## Mac Address Flooding


    Another vulnerability of the switches is their finite MAC tables. If a switch
    does not find an entry in its MAC table for a MAC address, it will transfer the
    packet to all connected stations. Then he analyzes the answers and learns which
    port the addressee can reach. If the MAC table of the switch is already full,
    old entries are overwritten and overwritten by the new entry. An attacker can
    receive data that is not intended for him if he succeeds and then, override the
    MAC tables of the switch with incorrect information. He achieves this by sending
    a large number of packets to the switch, which he himself answers. One program
    that can do this job is `macof`, which is also in the `dsniff` package \[song\]..

