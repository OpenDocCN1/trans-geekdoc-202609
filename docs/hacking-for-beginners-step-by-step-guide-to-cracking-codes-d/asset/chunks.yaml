    establishes a complete TCP connection, at the same time recording the attempt
    to set up the connection and triggering an alarm to alert the user. Then BOF breaks
    off the connection immediately. As can easily be seen, BOF can gather very little
    information because the program immediately terminates the connection immediately
    after setup. Although BOF has very limited functionality, the program is well
    suited to detect attacks on a system and thus to find a good way of failing security.
    In this way, companies can also be made aware that there is a security risk and
    thus, awareness of the need for security measures. Honeyd Honeyd was developed
    by Niels Provos and published in 2002. This program is an open-source system intended
    for Unix systems. The fact that the program is free of charge and therefore not
    only easy to download by anyone, but also that every access to the source code
    has immense advantages. It can be developed very quickly because everyone can
    work on the code. Thus, the program offers the possibility to integrate new functions
    or to fix errors. Despite its extensions, Honeyd can still be assigned to low-interaction
    honeypots, as it is relatively easy to use. Furthermore, Honeyd is designed as
    a production honeypot but is also suitable in parts as a research honeypot. The
    possibility  of using it as a research honeypot is because Honeyd makes certain
    applications useful for research purposes. The peculiarities underlying this program,
    on the one hand, are that it can monitor every possible TCP port. Honeyd does
    not register the activities on its own ports but assumes the identity of an IP
    address behind which no real system is located. Thus, in the case of an attack,
    it can simulate the addressed system and, as this replicated system, interact
    with the attacker to gain information therefrom. But Honeyd can simulate not only
    one but extremely many systems. And this is exactly the second special feature
    that Honeyd offers. Since Honeyd only simulates a system in a network when there
    is no real system behind it, the question arises of where the information is obtained
    from. It must therefore first be clarified behind which IP address a real system
    stands and behind which not. If there is no real system behind an IP address and
    this is addressed, then it is assumed that this is an attack and Honeyd intervenes.
    There are two ways of detecting non-existent systems. The first is when a network
    or part of the network is not even used. Then there is no real IP behind any IP
    address, and Honeyd uses a procedure called blackholing. This method offers the
    ability to listen to whole blocks instead of individual IP addresses, saving a
    lot of time and complexity. The second option, which is used much more frequently,
    is used when both real and non-existent systems co-exist in a network. In order
    to  find out the IP addresses in such a network where there is no real system
    behind it, the address resolution protocol, ARP for short, is used. This protocol
    makes it possible to determine the MAC address (Media Access Control) behind the
    IP address. If this MAC address does not exist, there is no system. This allows
    you to quickly and easily separate the two traps. If you try to connect to a port
    that does not have a real system behind it, Honeyd pretends to be one instead
    and interacts with the attacker according to the system. Honeynets The last example
    that I would like to introduce at this point is the most important and powerful
    thing. The concept of Honeynets was first introduced in 1999 as part of a paper
    titled "To Build a Honeypot." For the first time, it was the idea to use a normal
    network as it happens in every company as a honeypot. When the Honeynet Project
    was founded in 2000, the honeynets took on the central role in the investigation
    of cyber attackers. The project used Honeynets to gather information about attackers
    and their methods. The result of their work is a series of papers that later appeared
    as a book entitled "Know Your Enemy" in a collected form. The honeynets can be
    clearly assigned to the high-interaction honeypots because there are no restrictions
    in connection with the interaction between honeynet and attacker. The idea of
    a  honeynet is to build a normal real network, as is customary in business. This
    network is followed by a barrier called Honeywall. Then it''s easy to see what''s
    going on because otherwise, this physical network serves no other purpose within
    the network architecture. The design of the network and the individual applications
    on the systems are completely freely selectable and make the Honeynet extremely
    flexible. So honeynets are set to take the concept of honeypots to a higher level,
    but the underlying idea is the same. These honeynets are seen as an evolution
    of honeypots. Honeynets can thus be used both as a producer and as a research
    honeypot. The decision to use a honeynet as a production honeypot has the reason
    that a honeynet can deal very well with known as well as unknown attack patterns
    and thus detect attacks that would otherwise remain undetected. As a result, excesses
    can be detected and reported with a high degree of probability, which in turn
    provides the company with good protection. However, a honeynet is rarely used
    as a production honeypot because it is simply too complex, expensive, and expensive.
    However, good application possibilities are available to Honeynet as a research
    honeypot. This is mainly because they can gather a great deal of information during
    an attack. These not only consist of data about the attacker himself but also
    about the methods and tools he uses. The advantage of a  honeynet is that an attacker
    does not even notice that he has invaded a honeynet. Because it''s built just
    like any other network, the attacker simply does not recognize the difference.
    Once it has penetrated into a honeynet, it stores all the action and functionality
    of the tools used without the attacker noticing. This makes the use of honeynets
    so effective. The valuable information can be used to carry out very good analyzes,
    with which trends and patterns can be found. Thus it is even possible to make
    predictions about attack behavior or to warn against attack at an early stage.
    In addition, honeynets can be used to test new security techniques. The only thing
    you have to do is install the new security method on a honeynet and see if it
    can be broken in case of an attack. Future of Honeypots Although honeypots have
    been on the market for quite some time, the acceptance is not very big. One of
    the underlying problems is that you still do not agree on how to define a honeypot.
    Since companies do not know exactly what benefit they can expect from the use
    of a honeypot, they do not deal with it at all. Therefore, the most important
    task is to work out the strongest of the honeypots, so that companies recognize
    the advantage of honeypots and use them in their favor. As a result, acceptance
    will certainly increase, and the benefits of further development by security experts
    will rise sharply, which in turn favors the development of honeypots . Unfortunately,
    the lack of unity over the definition is not the only problem of Ho-neypots. Another
    disadvantage is the still relatively heavy operation. Today''s honeypots, and
    especially research honeypots, usually have an unmanageable operating surface,
    making the operation of such a honeypot very difficult and complex. Difficult
    handling also automatically results in greater error liability due to misadjustment
    by the user. Furthermore, with a honeypot, it is not yet possible to communicate
    with other security techniques. If there is an attack on a honeypot, it detects
    and registers it, but the information is not forwarded to other security programs.
    Through a corresponding interaction between Honeypot and security techniques,
    further attacks could be avoided quickly and without much effort. In the future,
    these problems could be eliminated by further development of Honeypot. One prediction,
    which is also presented in the book by Lance Spitzner, is that honey-pots and
    especially research honeypots still have a lot of potentials. With the development
    so far, only approaches to future applications have been made. A possible use
    of honeypots could be to detect patterns at attacks. Thus, by analyzing the collected
    information, possible patterns could be identified to warn against attackers at
    an early stage. Another application is the specialization for attackers who are
    looking for highly sensitive data. A possible goal is also that honeypots no longer
    work on their own, but cooperation between several honeypots distributed around
    the world are closed. The  advantage is that the data collected by each honeypot
    are analyzed together to make it much more accurate. As a result, there are better
    protection mechanisms. '
  toc: []
  trans: '


    # 第 12 章 – 蜜罐（Honeypots）


    这项工作是关于“蜜罐”这一概念的。在过程中，我将首先讨论蜜罐到底是什么，并尝试给出一个恰的定义。之后，我将解释蜜罐可以提供哪些服务，哪些不能提供。在此背景下，我将介绍不同类型蜜罐之间的第一个区别。然后，我解释了它们是如何不断发展的。第三部分将处理蜜罐的类别划分以及每个类别的特征。之后，我将强调使用蜜罐的优缺点，并详细地描述一些蜜罐的示例。


    当互联网在 1970 年左右首次投入运行时，人们完全不知道它会向何种方向发展。但随着互联网的引入，人们发现了许多意想不到的可能。今天，没有互联网的生活是不可想象的。你可以与世界各地的人交流、交换数据，以及更多。由于互联网的巨大增长，新的技术正在不断被尝试和开发，以扩展这种媒介的应用范围。与此同时，作为一种简单的通信媒介，互联网已成为私人网络和业务网络共同发展的平台。如今，除了聊天室或电子邮件等私人通信外，银行转账或在线订单等业务交易，以及适当的在线注册和注销也成为可能。


    但互联网也带来了许多危险。巨大的增长伴随着对互联网上海量数据流日益增多的的攻击。因此，对数据保护的需求显著增加。这里形成了一场攻击者与互联网安全专家之间的真实竞逐。攻击者总是试图寻找新的方法和手段来获取重要数据，而安全专家则通过开发保护机制来反击。尽管如此，总会有新的方法出现，因此在未来研究新的安全技术也至关重要。蜜罐就是这里重要的辅助。这就是为什么我将在下文中介绍这些内容。


    ## 什么是蜜罐？——蜜罐的定义


    在接下来的章节解释蜜罐的属性之前，首先必须找到蜜罐的一个合适定义，以便确切知道蜜罐是什么以及它们能做什么。从系统角度来说，蜜罐是作为攻击者的“诱饵”的系统。在网络内部，它们不提供有意义的服务，因此不会从系统内部直接访问，所以任何尝试联系它们的行为都会导致攻击者无法获取系统配置。


    寻找一个清晰的定义并不容易，因为有很多种。之所以有这么多不同的定义，是因为蜜罐可以应用于许多不同的互联网应用。与互联网上的许多其他安全技术不同，它们不是针对特定问题的，而是试图覆盖尽可能宽的带宽范围。例如，防火墙的设计是为了防止攻击者访问系统。相比之下，蜜罐不仅尝试检测未经授权的系统访问，还尝试检测木马、蠕虫和其他攻击。在这一过程中，蜜罐只收集与计算机攻击直接相关的的数据，并在必要时对其进行评估。因此，蜜罐在攻击及其方法论方面处理的是较少但高度相关的数据，而防火墙和防病毒软件等其他程序则需要处理海量数据，因为它们持续地控制整个数据流，以与已知模式进行匹配，或监控所有程序对系统资源的访问权限。


    在 Lance Spitzner 的著作《蜜罐：追踪黑客》（Honeypots Tracking Hackers）中，可以找到一个很好且在我看来非常好的定义。在书中，蜜罐被定义为：蜜罐是一种价值在于被攻击或被破坏的安全资源，而这正是蜜罐与其他安全技术的区别。人们希望通过对蜜罐进行攻击，来学习关于攻击本身以及攻击者自身的新知识。


    ## 蜜罐的可能用途


    例如，它们可以检测并分析蠕虫攻击，或者可以在早期识别并指出未经授权的系统访问。尽管应用程序可能的用途如此迥异，蜜罐本身也大不同。你可以大致将蜜罐分为两类：生产蜜罐和研究蜜罐。


    **生产蜜罐**（Production honeypots）主要用于公司和私营部门。使用这种蜜罐，通常只能确定攻击的存在。然而这也有优点，即这些蜜罐更容易处理。


    **研究蜜罐**（Research honeypots）顾其实名，用于研究目的。使用这类蜜罐不仅可以检测攻击，还能收集并评估大量关于攻击及其攻击者的信息。这是为了获得对攻击者方法和工具的新见解。这些发现随后被用于开发新的安全技术，以在未来更好地保护系统。蜜罐比生产蜜罐复杂得多且难以使用。


    除了蜜罐的类型区分外，还可以对所有蜜罐进行分类。总共有三类：低交互、中交互和高交互蜜罐。分类取决于攻击者与蜜罐有多少种交互可能性。将在稍后的章节中对每个类别给出更详细的解释。


    ## 蜜罐的历史


    在对蜜罐定义和首次介绍之后，现在是时候看看它的起源了。蜜罐的概念已经存在了一段时间。然而，蜜罐的概念当时还未以目前的名称为人知。直到最近，蜜罐的概念才真正流行起来。


    1990 年，关于这个主题有两个不同的出版物。第一本是 Clifford Stoll 写的一本名为《金丝雀》（The Cuckoo''s Egg）的书。Clifford
    Stoll 当时正在处理计算机系统，他发现攻击者利用了该系统的数据。但他没有抑制这种行为，而是决定让攻击者继续并进行观察。这给了他收集大量关于攻击者的机会。他
    观察的系统在当时意义上尚未被称为蜜罐，它是一个具有敏感数据的系统。但这正是蜜罐的早期意义。然而，通过这本书，蜜罐的早期方法和想法才广为人知。


    第二次发布来自 Bill Cheswick。这是一篇名为《与黑客诱导、持续并研究的夜晚》（An Evening with a Cracker Which Is
    Lured, Endured, and Studied）的论文，描述了一个专门设计用来被攻击的系统。Stoll 的书也描述了攻击者如何尝试访问他的系统。蜜罐历史上下一个重要的日期是
    1997 年。那一年发布了首个欺骗工具包（DTK），由 Fred Cohen 编写。该蜜罐的主要目的是收集有关攻击者的活动并迷惑他们。在接下来，作为 DTK
    的扩展，开发了另一个名为 `CyberCop` 的蜜罐产品。第一个特点是 `CyberCop` 不在 Unix 上运行，而是在 Windows 上。第二个重要的是
    `CyberCop` 可以运行各种系统。尽管该产品具有许多优点且易于使用，但它在市场上从未真正成功过。


    1998 年，由 Marty Roesch 开发了一个名为 `NetFacade` 的程序。它能够模拟七种不同的应用程序，允许了许多系统。尽管该程序并不广为人知，但它对蜜罐的开发有很多好处。同年开发了
    `BackFence`，该程序将在后续章节中进一步阐述，它是易于使用的，尽管其功能有限。第一次出现了蜜罐概念 `Honey`，它允许在没有太多知识的情况下进行下载和应用。


    1999 年，最后，蜜罐项目（Honeynet Project）成立了。该项目由志愿者安全专家组成，专注于蜜罐的使用。这些将在后续章节解释。自 2000 年以来，由于攻击的快速增加，蜜罐被使用得越来越多，得益于其良好的结果，并在对抗攻击中变得日益被接受。


    ## 蜜罐的分类


    在蜜罐的定义中，已经简要介绍了两种蜜罐。这两种类型是生产蜜罐和研究蜜罐。首先，生产蜜罐用于检测和指示入侵，以便在必要使用适当的安全技术进行对抗。另一方面，研究蜜罐不仅用于检测和对抗攻击，还用于了解攻击者及其方法。此外，蜜罐还可以分为三个类别。这些是低交互、中交互和高交互蜜罐。蜜罐的分类顾其实名，取决于与蜜罐交互的强度。通过蜜罐的分类，人们还有在它们之间进行比较。比较选项也有助于选择哪种类型的蜜罐。然而，人们必须清楚用蜜罐做什么。例如，如果你只想检测和监控对系统的未经授权访问，那么低交互蜜罐就足够了。另一方面，如果你想了解一些关于攻击者方法，就必须选择高交互复杂的蜜罐。然而，在选择蜜罐时，应该注意与蜜罐交互的机会越多，安全风险越大。将在后续章节中更详细地描述蜜罐类的不同表达式和属性。


    ### 低交互蜜罐


    低交互蜜罐的特点是功能更受限制。因此，它们也有易于使用的优点。例如，该类的蜜罐可以用来确定入侵何时发生。此外，人们可以确定攻击者的 IP 地址、端口和攻击目标。然而，低交互蜜罐不提供更多功能。因此，人们获得的关于攻击和攻击者的信息相当少。由于这种“简单性”，该类的蜜罐易于安装，而且非常易于使用。用户界面通常非常直观且易于理解。当然，这些蜜罐的功能限制也很大程度上限制了潜在攻击者可能与系统进行的交互。这具有优点，即安全风险较低，因为攻击者没有机会攻击和接管重要系统。低交互蜜罐主要用于私人用途。


    ### 中交互蜜罐


    中交互蜜罐类具有更多功能，因此与蜜罐提供了更多的交互可能。由于这个原因，人们可以收集并利用更多攻击者的信息。交互水平的增加也使得处理和安装更加困难。这类蜜罐的复杂性处于低交互和高交互蜜罐之间。然而，交互增加的缺点是也增加了安全风险。这是因为随着交互水平的提高，攻击者面对的是一个几乎真实的系统。如果攻击者破解了蜜罐，该系统就可以被用来攻击其他系统。该类的优点是你可以收集更多关于攻击者的信息。


    ### 高交互蜜罐


    高交互蜜罐具有最高的复杂性，并代表了许多真实的应用程序。这使得在入侵期间收集大量信息成为可能。它不仅收集攻击攻击的信息，还提供有关攻击者能力的信息。随着交互水平的增加，该类的安全风险非常高。这是因为入侵蜜罐的攻击者可以攻击其他系统并造成巨大损害。操作这种蜜罐需要大量的知识，因为安装和操作都复杂得多。


    ## 蜜罐的优点


    蜜罐相对于安全技术面临的第一个优点是它们的易用性。为了能够使用它，需要非常熟悉该主题，蜜罐足以安装并进行某些修改。这使得处理比其他技术容易得多。正如在前文中提到的，它需要更多知识。然而，最初一个简单的蜜罐可以在不需要知识的情况下运行。这给了大家与蜜罐交互并观察攻击者的机会。蜜罐的另一个大益处是它们收集的数据量。由于其他技术，收集了大量数据。在这里的问题是它们的恢复。许多收集的数据是没有意义的，因此对于分析是不必要的。尽管如此，安全技术必须告知哪些数据是重要的，哪些是不重要的。这导致了大大减少的数据量，不会影响系统。分析揭示了安全技术中的潜在错误。第三大优点是硬件要求。由于互联网流量日益增加，对硬件有着相应的要求。蜜罐的优点是它们需要的资源更少，因为它们只有在被实际访问时反应。作为第一个示例，我想介绍一个名为
    `Back Officer Friendly` 的简单蜜罐。第二个示例将是一个名为 `honeyd` 的更复杂的蜜罐。作为最后一个应用，我们将转向蜜罐（注：原文此处为
    `turn to honeynets` 疑似笔误，此处根据语境保持逻辑处理）。


    ## 蜜罐的缺点


    蜜罐的第一个大缺点是它们带来的风险。这种风险存在，如果攻击者入侵了蜜罐，它就可以被用来攻击其他系统。风险和损害取决于蜜罐的交互水平。正如在最后一章所述，蜜罐做得越多，危险就越大。下一个问题，也是蜜罐的另一个缺点，蜜罐不观察周围发生的事情，只影响它自己。因此，即使网络上有攻击，蜜罐也没有反应，因为它本身没有被攻击。蜜罐只有在成为攻击目标时才会反应。另一个主要缺点来自于将系统识别为蜜罐。这可能导致攻击者在未来绕过蜜罐并专注于其他系统。此外，攻击者可能会故意利用蜜罐的存在知识来访问其他系统。例如，攻击者可以用攻击轰炸蜜罐并分散用户的注意力，直到他可以无阻地攻击其他系统。在已经提到的研究蜜罐中，识别会导致错误。这是由于攻击者可以在攻击期间故意留下关于自己和方法的虚假信息。但当通过这些信息得出结论时，会导致错误的结论。如果这些失败进入了下一个版本的安全软件，就会产生巨大的问题。这种方式，它可以被操纵，并且不是保护系统，而是创建新的。


    ## 蜜罐示例


    蜜罐的功能现在已经详细解释，是时候看一些实际示例了。当然，今天有很多蜜罐在使用。因此，接下来介绍了三种不同的蜜罐，基于此可以很好看到不同的应用可能性。


    ### Back Officer Friendly


    我想介绍的第一个示例是名为 `Back Officer Friendly` 的简单蜜罐（简称 `BOF`）。这是目前最简单的蜜罐之一，可以归类为低交互蜜罐。`BOF`
    可以很好地用作生产蜜罐，但不适合作为研究蜜罐。原因是该程序的功能非常有限，而且在攻击情况下，也收集很少关于攻击者及其方法的信息。在详细解释功能之前，关于 `BOF`
