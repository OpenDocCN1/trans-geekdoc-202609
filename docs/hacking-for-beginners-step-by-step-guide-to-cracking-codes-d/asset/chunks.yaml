    approaches focus on preventing, filtering, and averting the attacks caused by
    botnets. Only a few approaches deal directly with the basis and functioning of
    the botnets . Botnets – Definition and Delimitation A botnet is a group of individual
    computer systems that have been infected with malware without the user''s knowledge
    and remotely controlled by a single individual. The infected end system is called
    zombie or bot, more rarely drone. The individual remotely controlling the botnet
    is called a botmaster. The C & C channel (Command and Control) has become established
    as the term for the communication channel between Botmaster and botnet \[RZMT06\].
    A 1: n communication between Botmaster and Bots over a C & C channel is the basic
    defining feature of a botnet. In addition, " botnets " are only those structures
    whose intended purpose is to carry out harmful and criminal acts. After all, botnets
    are just a tool that can, but does not have to, do harm. Structures of a similar
    nature, such as " Folding@home " or "Mersenne Prime Search," are peaceful and
    meaningful services that are not classified as botnets. The evil bots to be found
    today evolved from the classic IRC bots of the early 1990s. Eggdrop was one of
    the first such bots to support the IRC user in chat by performing functions such
    as database queries or offering help. Based on the modularity of Eggdrop, first
    bot programs were developed that could be used to implement evil intentions. However,
    the first attacks are  limited to DoS in the IRC sector, for example, through
    automated " flooding." These bots have evolved over time, but the modularity of
    egg-drop and control over IRC have been retained \[CoJM06\]. In the meantime,
    botnets are being used for pure vandalism ( " script kiddie ") as well as for
    commercial fraud, extortion, spam, and phishing \[CoJM06\]. It also identifies
    a community that works closely together to develop and develop malware. If the
    source code of the bots is publicly available, they show a large number of user
    signatures in the form of scene-specific pseudonyms. Code is often reused; the
    source code contains comments that specify the original source code source. Often,
    these are pre-existing malicious software such as computer viruses, worms, or
    Trojans. Common Botnet Systems The classification of the existing bots is difficult.
    Existing Bot software is often rewritten several times, expanded and modified;
    sometimes up to 4,000 versions of a bot variant are known (SDBot and Agobot).
    Here is a selection of the most widely-received and currently popular bot groups
    listed: Agobot/Phatbot/Forbot/XtremBot The core of almost all common bots is Agobot,
    first released in 2004, and its programmer was arrested in the same year. The
    bot is written in C ++ and offers a modular and abstract  software architecture.
    The source code is released under the GPL, although no central reference source
    is available. Agobot has been expanded several times over the years, with the
    current source code package, with all modules, extensions, additional tools, and
    alternative implementations, having a size of around 140 MB. Agobot uses libpcap
