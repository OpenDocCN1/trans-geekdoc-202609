- fmt: "\n# Protection\n\nWebsite operators should never trust user input. All incoming\
    \ input values must be viewed and filtered. You should define an input table exactly\
    \ and only allow such input. \n\nXSS attack actually embeds a manipulated script\
    \ code between ` < script >` tag and `< / script >` tag (or `< object>`, `< applet>`,\
    \ `< embeded >`). If these tags are removed, the malicious script code is no longer\
    \ executable. You can filter these tags by typing through, for example, the following\
    \ PHP code:\n\n```php\nfunction filter ($ input) {\n  $ input = ereg_replace (\"\
    <script>\", \"\", $input);\n  $input = ereg_replace (\"</ script>\", \"\", $input);\n\
    \  $input = ereg_replace (\"<object>\", \"\", $input);\n  $input = ereg_replace\
    \ (\"</ objectt>\", \"\", $input);\n  $input = ereg_replace (\"<apllet>\", \"\"\
    , $input);\n  $input = ereg_replace (\"</ applet>\", \"\", $input);\n  $input\
    \ = ereg_replace (\"<embeded>\", \"\", $input);\n  $input = ereg_replace (\"</\
    \ embeded>\", \"\", $input);\n  return $input;\n}\n```\n\nThis removes all entries\
    \ with dangerous tags, e.g., the above cookie stealing. Script code looks like\
    \ this after filtering: `alert (document.cookie);`. It is, of course, no longer\
    \ harmful!\n\nIn some cases, the input should be clearly printed unchanged. You\
    \ can do that by entering the user escapes, that is, all special characters are\
    \ with replaced their equivalent in HTML- the so-called escape sequences. These\
    \ escape sequences are a sequence of normal characters that represent their special\
    \ characters. For example, the string `< script >` will appear as a normal string\
    \ `< script >` . displayed later as a string `< script >` by the browser, which\
    \ is recognized as no more tag.\n\nThe conversion of special characters can be\
    \ realized with the function `htmlentities ()`.\n\n```php\nfunction escaping ($\
    \ input) {\n  $ input = htmlentities ($input);\n  return $input;\n}\n```\n\nThis\
    \ method is a simple and secure way to deal with XSS. Nevertheless, there is a\
    \ big disadvantage that all special characters and thus, all tags are blocked.\
    \ Users can, of course, not use HTML tags to format their text.\n\nBy turning\
    \ off ActiveScripting in the browser, you can protect against XSS on the client-side\
    \ - no manipulated script code is executed on the client-side. Nevertheless, this\
    \ does not help with pure HTML injection (e.g., with `< iframe >` tag ...), but\
    \ it is not dangerous like real XSS. It cannot steal cookies from clients under\
    \ any circumstances.\n\n# Chapter 5 – SQL Injection\n\n## What is SQL injection?\n\
    An SQL injection is the manipulation of transaction SQL queries into an application\
    \ to provoke an unforeseen reaction. [ScSh02] Typically, web applications provide\
    \ an interface for users to communicate with the database, At this point, there\
    \ are security gaps when web applications do not properly filter user input, so\
    \ hackers can use the `SQL` commands to send data to the database, destroy data,\
    \ or even invade underlying systems.\n\n## Functionality and SQL injection types\n\
    Depending on attacks, there are generally three main categories of SQL injection\
    \ subdivided: SQL manipulation, code injection, function call injection. These\
    \ will be explained in the following sections with examples.\n\n### 1. SQL Manipulation\n\
    Is a process where normal running database queries are affected by SQL statements.\
    \ The general case, the attacker, is inserted into the information of the `where`\
    \ clause of an SQL statement returned by the database. Thus, manipulating the\
    \ `where` clause can change the entire SQL statement.\n\n### 2. URL of a web page\n\
    `http://www.nosecurity.com/mypage.asp?user=hacker&pass= 'hack '` becomes the SQL\
    \ statement of the web application for the database query: `Select * from table\
    \ where login = 'hacker ' and password = 'hack '`. After the execution of this\
    \ query, if there are such user and password in the table, the user is logged\
    \ in successfully. Now the password is assigned as `' or 1 = 1 -`. The SQL statement\
    \ of the web application looks like this: `Select * from table where login = 'hacker\
    \ ' and password = ' ' or 1 = 1- comment`. Login occurs whenever there is a user\
    \ hacker, regardless of the password.\n\nHere are the typical inputs in form fields\
    \ to determine if an application with SQL injection is vulnerable:\n- Discard\
    \ database table: `'; drop table users--`\n- Shutdown Database: `'; shutdown--`\n\
    - Authentication without password: `no matter 'or ' a '= ' a '`\n- Authentication\
    \ only with username: `admin ' -`\n\nThe double hyphen (` -`) converts all data\
    \ into comments. Thus all other conditions are negligible.\n\n### 3. Code Injection\n\
    is a process of injecting new SQL commands into a stream of commands. This type\
    \ of attack is especially dangerous if multiple SQL commands are supported per\
    \ database query. Consider an example made with IIS, ASP, and MSSQL:\n"
