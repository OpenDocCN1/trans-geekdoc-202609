    # Chapter 11 – Legislation


    ### USA

    In the US, the `CAN-SPAM Act` (Controlling the Assault of Non-Solicited Pornography
    and Marketing Act of 2003, `[Cong03]`) came into force in December 2003 and resulted
    in a series of convictions, including prison sentences.


    ### Europe

    In the EU, the term for spam is "unsolicited commercial email" (UCE) and thus
    excludes non-commercial spam messages. On October 31, 2003, an EU directive came
    into effect on data protection in force `[Unio02]` which stipulates that email
    advertising may only be sent with the prior consent of the addressee, provided
    that it does not serve to maintain an existing customer relationship. It also
    prohibits prefixed "sender" and "illegal" addresses as spammers use them frequently.


    However, the directive is not itself a law, but must first be transposed into
    concrete laws by the Member States. In Germany, this was done by the `Telemediengesetz`
    (TMG) of 2007. It provides for fines of up to `EUR 50,000` for sending spam messages.
    However, spam is also explicitly mentioned in the "Law against Unfair Competition"
    (UGW), updated on April 1, 2004. However, this only provides the recipient with
    a legal handle through the detour of consumer protection associations. Unlike
    in the US, spam is treated in Germany only in civil law but not in criminal law.


    ### Judgments

    The following judgments illustrate the difference between the extra criminal prosecution
    in the US and civil law in Europe.


    * **USA, November 2004**: Jeremy Jaynes is sentenced to 9 years in prison under
    Virginia law. `[Brie06]`.

    * **USA, September 2006**: Daniel Lin is being fined `$ 10,000` and imprisoned
    for three years under the `CAN-SPAM Act`. `[Kuri04]`.

    * **The Netherlands, early 2007**: A Dutchman is fined `€ 75,000` for sending
    spam messages. `[Kuri07]`.


    ### Outlook

    By combating open relays and sending emails from dial-up addresses using blacklists,
    email has been put in a more orderly manner in recent years. More advanced technical
    countermeasures have been countered with clever tricks from spam senders, but
    have nonetheless led to a decrease in the burden on the end-user. However, new
    standards, such as the `DKIM` signature procedure, which is becoming more and
    more widespread, suggesting that the elimination of the weaknesses of the on-the-counter
    email system will drastically make spam shipping more difficult in the future.

    '
