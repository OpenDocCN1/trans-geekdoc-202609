    the The MAC addresses are similar, e.g. 2001: 6f8: 915: 0: 230: 1b ff: feb9: 742b.
    Common to both protocol versions is that in addition to the IP address, a network
    mask determines whether a target computer can be reached in the local network
    by  splitting the IP address from the left into a network part and a computer
    part. If a computer cannot be reached locally, a subsequent computer is usually
    selected, and the packet is forwarded to it. This decision process is called "routing."
    \[Post81b, DeHi98\] ·            Layer 2: ARP    With the help of the Address
    Resolution Protocol (ARP), addresses of the Internet protocol (IP addresses) are
    translated into hardware addresses (also known as Media Access Control or MAC
    addresses). MAC addresses are 48 bits long and are in hexadecimal form (e.g.,
    00: 30: 1B: B9: 74: 2B). Each participant in the network stores the mapping of
    IP addresses to MAC addresses in tabular form in a so-called MAC table. The current
    MAC table can be viewed on Linux computers with the "arp" command. For example,
    an entry has the following form: computer.ea (1 9 2, 1 6 8, 1, 1 4) to 0 0: 3
    0: 1 B: B9: 7 4: 2 B \[ether\] eth0 Here you can see the computer name ( " computer.ea
    "), the IP address and the corresponding MAC address. In addition, it is saved
    via which network adapter the computer can be reached (here: "eth0 ") . ARP thus
    establishes the connection between layers 2 and 3. This is a very simple, stateless
    protocol in which only two possible data units exist: “arp-request” and “arp-reply”.
    In order to determine the MAC address of the associated subscriber for an IP address
    (e.g., 192.168.1.14), an arp-request packet is generated and sent to all stations
    which are connected to the common medium. The station with the searched IP address
    then takes the sender''s MAC address into its own MAC table and sends a packet
    to the sender that contains both its own MAC and IP address. This allows the sender
    to correctly address other packets for the same IP address \[Plum82\]. ·           
    Layer 3: ICMP    The Internet Control Message Protocol is used to exchange control
    information between the communication partners in the network. Among the best-known
    protocol, data units are "echo-request" and "echo-reply." With an echo-request
    packet, one participant asks another person for an echo-reply response. This will
    usually answer, making ICMP the most common review of the accessibility of participants.
    In addition, one can measure the time that elapses before the response occurs
    and thus obtain an approximate estimate of the reaction time of the communication
    partner, the so-called latency. To send and receive such packages, the program
    ping can be used, which is available on every operating system. \[Post81a\] ·
                Layer 4: DNS    The Domain Name System provides methods by which the
    hostname of a computer (e.g., www.google.com) is translated into its IP address
    (es). It saves the user the trouble of entering IP addresses in programs such
    as browsers and has established itself as the standard for this functionality.
    In addition, if properly configured, DNS servers can be used to "rollback" IP
    addresses into hostnames, for example, to make log files of a service that is
    more readable, called "reverse DNS." In a computer network, this service is usually
    provided by one or more DNS servers \[Mock87\]. ·            Layer 4: DHCP   
    The Dynamic Host Configuration Protocol (DHCP) handles the dynamic and automatic
    configuration of connected stations. It provides participants with all the information
    they need to participate in ongoing network communication. This usually includes
    an IP address, the network mask, the default gateway, and one or more name servers
    within the network. Possible applications for DHCP are above all the simplified
    and automatic configuration of computer systems in networks \[Drom97\] . Fundamental
    Weaknesses of Hierarchical Communication Models Hierarchical communication always
    encapsulates a sharply defined functionality in the next lower layer. A process
    that uses a service of the next lower tier relies on it to do its job correctly.
    As a rule, he is unable to see the underlying layers. If a communication at a
    certain point is compromised, then data and content, but also control information
    of higher layers, are also affected. If the content transmitted on the higher
    layers is not encrypted or otherwise secured against manipulation and unintended
    insight, reliable communication is no longer possible. It is thus obvious that
    the overall system is never safer than the individual subcomponents. An attack
    on one of the lower levels is a serious threat. Sniffing In the context of network
    security, sniffing refers to the listening of data \[Russ02\]. It, therefore,
    represents a passive attack on the security of a network because the attacker
    usually does not send data to the network. Instead, he will try to gather more
    information by collecting information and reading secrets that are helpful. These
    can be credentials such as usernames  and passwords, as well as knowledge-based
    protocols and mechanisms. Through his passivity, attack by sniffing is very difficult
    to detect. If the attacker sends data himself to gain access to network traffic,
    he can betray himself. Also, in some cases, one can try to make a co-healer betray
    himself. Snatching as a Protective Measure Sniffing does not always have the purpose
    of causing harm, omitting information, or circumventing security mechanisms. Instead,
    sniffing can help monitor a network and detect malfunctions, attacks, and other
    disruptions in a good time. Spoofing In the context of network and computer security,
    spoofing refers to the swapping of a foreign identity (\[Russ02\].) Spoofing can
    take place at every level of the ISO / OSI communication model. In contrast to
    sniffer attacks, the compromise of a layer does not automatically prevent the
    communication that occurs: a fake sender address in an IP packet does not necessarily
    lead to a wrong sender address of an email. In this paper, spoofing is only considered
    as an attack on lower layers and the protocols there such as ARP and IP . Positive
    Aspects of Spoofing As with Sniffing, there are also application spoofing cases
    that do not affect the security of a system. To the application areas pay, for
    example: • Web servers on which so-called VirtualHosts are set up, spoofing the
    identity of the webserver for whose domain they are delivering data    • In failover
    scenarios, the spoofing of a MAC address offers the possibility, in the event
    of failure of the main computer, of having its services performed by the clients
    unnoticed by a replacement computer. Methods and Approaches The following describes
    the common infrastructure components, as well as their vulnerabilities, causes,
    and possible countermeasures. Often, there is no clear distinction between attacking
    and spoofing attacks; often, both techniques are used simultaneously. This is
    especially the case when data has to be redirected in order to be able to read
    it afterward. In addition, by sniffing at information about identities, such as
    password and usernames, you can also get addresses, which you then accept in a
    spoofing attack in order to further extend an attack . Cables and Hubs If all
    stations of a network are connected by a cable, then each participant receives
    all packets. This is also the case when the stations are connected by a central
    hub. The network adapters of the individual stations know their own MAC address
    and filter the stream of data packets for those that are addressed to them. Example
    The following is an example output of the ARP traffic that was read on a network
    interface. You can see two things: The participant with the IP address .1 attempts
    to determine the MAC address of the nodes with the IP addresses .12 and .222.
    Hereby he sends arp-request packages. As can be seen from the time indicated in
    the left column, the response to such a request is made in a very short time.
    13: 37: 43.365944​ arp who - has​ 192.168.1.222 ​ tell              192.168.1.1
    13: 37: 43.366207​ arp reply​ 1 9 2. 1 6 8. 1 . 2 2 2 is - at 0 0: 0 b: 8 2: 0
    5: 3 f: b7 13: 37: 44.586755​ arp​ who - has​ 192.168.1.12 ​ tell​ 192.168.1.1
    13: 37: 44.586892​ arp​ reply​ 1 9 2. 1 6 8. 1 . 1 2 is - at 0 0: 1 1: 2 4: 8
    8: 0 2: f 0 A second example is a package from the login process at the FTP server
    ftp.kernel.org. The left-hand column indicates the position of the data in the
    data packet, followed by the hexadecimal representation of the data. In the right-hand
    column, the data is displayed as readable characters, as long as they are each
    a displayable character. You can see the password that the user has specified.
    0x0 0 0 0:​ 0005​ 5 d7c e 8 e 5 0 0 3 0 1 bb9 742 b 0 8 0 0 4 5 1 0              ..\]
    | ..              , 0.              , t +. .E. 0x0 0 1 0:​ 004 e​ a80b 4 0 0 0​
    4006​ 451 a​ c 0 a 8​ 010 e              cc 9 8              .N. .. @. @ E              .......
    0x0 0 2 0:​ bf 2 5​ cb 2 1​ 0015​ 4 c 9 8​ db79 1 7 4 5 e 8 from 8 0 1 8              !.%.
    ..              L. ,              y. E. , , , 0x0 0 3 0:​ 002 e​ 80 d2​ 0000​
    0101​ 080 a​ 0 d21​ 7 b6d​ 0 cf 9              ......              ....              ,
    ! { m. , 0x0 0 4 0:​ cca 8​ 5041​ 5353​ 2070​ 6173​ 7377​ 6 f 7 2​ 6440              ,
    , PASSPORT . password @ 0x0 0 5 0:​ 646 f​ 6 d61​ 696 e​ 2 e 6 3​ 6 f 6 d​ 0d0a​
                                 domain. com. , On multi-user systems, regardless
    of the transmission technique used, it is possible to monitor the network traffic
    of the other users, provided that one has the necessary rights to read the data
    packets from the network card. On Linux systems, only the user root is authorized
    for this. Unprivileged users receive an error message: “socket: Operation not
    permitted”. Wireless Network s In addition to Ethernet, wireless networks (WLAN)
    on layer 2 behave as if all the stations involved were connected via a common
    cable. After all, each participant can receive all data traffic with one antenna.
    Again, you can use a network card with promiscuous mode switched on to read incoming
    packets from other participants. Unlike wired networks, wireless networks often
    use methods to encrypt the transmitted data transparently. An attacker for functioning
    surveillance must already be part of the encrypted network. Wiretapping Another
    way to get network packets is to literally " tap " any wired network to which
    you have physical access. This process is called wiretapping or tapping \[Grah00\];
    The device used is called a TAP device. The simplest conceivable TAP device consists
    of a network adapter whose receive lines are connected to the transmission lines
    of the cable that is to be monitored. However, current Ethernet transmitters send
    a signal at regular intervals to check if the other party is still answering.
    By the one-sided connection of the cables, such a check fails, and you have to
    rely on an antiquated card to use with AUI transceiver. Since this method is more
    of a " hack " than a reliable method of analysis, it is better to buy a professional
    TAP device. These forward network  traffic transparently, but provide the opportunity
    to send a copy to a connected subscriber. Modern switches also have the ability
    to replicate all traffic on individual ports for monitoring purposes \[3Com\].
    Advantages of a TAP device The advantage of such a TAP device is that it works
    only passively. If you use it to investigate a network for attacks and dysfunctions,
    it has only a few seizure points due to its passivity and can therefore only be
    very badly compromised. An attacker cannot obtain information about the existence
    or state of the system. On the other hand, if an attacker succeeds in installing
    a TAP device on a network, it is very difficult to trace through network traffic
    analysis. Detection Possibilities Depending on the scope of the attacker''s actions,
    there are no or several ways to track a sniffer on the network. For most of these
    possibilities, however, there are countermeasures of the attackers, so that it
    sometimes comes to a kind of Wettrusten between attackers and defenders. ·          
    Name server requests: Current sniffer programs (such as tcpdump) provide the ability
    to display hostnames instead of IP addresses using reverse DNS functionality,
    thereby increasing the readability of the output. The high number of DNS queries
    required for this can be detected  on the name server. If you additionally configure
    a network node with an IP address outside the network address space and if you
    let it automatically generate network traffic, you can detect a request for its
    IP address on the name server and conclude that you are using a sniffer program
    (\[ Grah00\].    ·           The latency of the attacker: If a sniffing program
    is installed on a computer system, this will possibly respond more slowly to requests
    from the network by analyzing the network traffic and the associated computational
    effort. By measuring the response time of the connected subscribers from a single
    computer, e.g., using the IMCP protocol, one can conclude from a correlation of
    network load and latency of a subscriber to the use of a sniffer program \[Russ02\].
    ·           Faulty Software: In case of errors in the implementation of drivers
    and network stacks, you can partially exploit them to see if a host is promiscuous.
    For example, \[Russ02\], page 398f, describes the case of an Ethernet driver.
    In this case, the verification of the MAC address was waived if the card was operated
    in promiscuous mode. If you send an ICMP echo-request with the IP address of the
    computer and a MAC address that differs from its own, into the network, the computer
    replied  with an echo-reply, and you could conclude that the network card was
    operated in promiscuous mode. Switches All the problems described above occur
    because each connected computer can receive all the data in a network, and the
    filtering of the data is done by the network adapters. This makes it very easy
    for an attacker to access the data shared by other participants. A way out of
    this dilemma seems to offer switches. Essentially, they behave like hubs with
    the difference of knowing which computer is connected to which of their ports.
    Thus, in addition to arp-request packets, only a packet that is also intended
    for it is forwarded to a computer. For this purpose, a switch has a table in which
    each port is stored, which MAC addresses can be reached via this port. A typical
    example of such a table is 2 13 = 8192 entries for switches with 16 ports, but
    the size varies between different manufacturers and models. Cache Poisoning and
    ARP Spoofing Assuming the switch works properly, it eliminates the ability to
    read data that is not sent to one''s own address. Therefore it is necessary for
    an attacker, that all packages, which are to be read, are addressed to himself/herself.
    The MAC address of the destination computer for a particular IP address is stored
    by each subscriber in a local MAC address  table. One attack on which the MAC
    table of a remote computer is deliberately infected with false information is
    called a cache poisoning attack. To preach to the rest of the network that a foreign
    IP address can be reached under its own MAC address, there are two possibilities:
    ·           Answering foreign requests: Whenever a computer in the network asks
    for the destination IP address, the attacker responds with his MAC address. This
    must happen so quickly that the valid answer of the rightful owner of the IP address
    is rejected. Due to this condition of a very fast response, such an attack is
    very difficult to carry out. In addition, the ARP protocol has a vulnerability
    that does not require timely responses to arp-request packets.    ·          
    The vulnerability in the ARP protocol: In order to simplify the administration
    of networks, it is possible for subscribers to send their MAC address proactively
    in the network and for all connected computers to update their MAC table. This
    procedure is called gratious ARP, and it finds application for example in mobile
    network devices that can thus redirect certain data to a proxy in the old network
    when moving from one network to another, without interfering with existing connections.
    An attacker would now miss such a packet, and so his victim would first take the
    wrong MAC address into their MAC table and then address Ethernet packets to the
    attacker.  This retransmits its MAC address at regular intervals so that the entry
    in the victim''s MAC table is always up-to-date and the victim himself will not
    make a request to the network. The ARP package used here is a usual arp-reply,
    which prevents gratious ARP only from stateful packet filters. A detailed description
    of MOG opportunities and a program to Inspect this provides the program arpspoof
    from the dsni ff package \[Song\]. Mac Address Flooding Another vulnerability
    of the switches is their finite MAC tables. If a switch does not find an entry
    in its MAC table for a MAC address, it will transfer the packet to all connected
    stations. Then he analyzes the answers and learns which port the addressee can
    reach. If the MAC table of the switch is already full, old entries are overwritten
    and overwritten by the new entry. An attacker can receive data that is not intended
    for him if he succeeds and then, override the MAC tables of the switch with incorrect
    information. He achieves this by sending a large number of packets to the switch,
    which he himself answers. Due to different sender MAC addresses, the switch''s
    MAC table will eventually be overridden, and valid entries will be overwritten.
    Thereafter, the switch will also forward packets from other subscribers looking
    for their MAC address to the attacker. One program that can do this job is macof,
    which is also in the dsni ff package \[song\] . Detection Capabilities: ARPwatch
    and ARP Traffic Analysis If the attacker attacks both ends of a connection simultaneously,
    he can reroute all network traffic between the two victims via his own computer.
    Thus, he can easily listen to and perform special types of continuation attacks.
    In addition to the previously described ways to detect such a listener, both the
    attack and the subsequent redirection of network traffic offer further aspects
    from which one can identify the attack. Above all, the increased and unusual ARP
    traffic during the attack phase is analyzed here and serves as an indication of
    such an attack. '
