    # Chapter 13 – Botnets


    The phenomenon of botnets is the basis for a multitude of Internet threats such
    as spam and denial-of-service. This section provides an overview of how botnets
    work by presenting the basic elements and features of a botnet and its features.
    Different methods for opening, analyzing, and stopping productive botnets are
    explained.


    ## Introduction


    The steady growth of the Internet is accompanied by an increase in criminal and
    destructive energies, ranging from purely destructive vandalism to organized crime.
    The well-known but little explored field of botnets is the starting point of many
    critical malicious mechanisms such as spam, Distributed Denial of Service (`DDoS`),
    and data espionage. Vinton Cerf proposed at the World Economic Forum in 2007 that
    all PCs connected to the Internet are part of a malicious botnet `[Foru07]`. Nevertheless,
    the previous safety-related approaches focus on preventing, filtering, and averting
    the attacks caused by botnets. Only a few approaches deal directly with the basis
    and functioning of the botnets.


    ## Botnets – Definition and Delimitation


    A botnet is a group of individual computer systems that have been infected with
    malware without the user''s knowledge and remotely controlled by a single individual.
    The infected end system is called `zombie` or `bot`, more rarely `drone`. The
    individual remotely controlling the botnet is called a `botmaster`. The `C & C`
    channel (Command and Control) has become established as the term for the communication
    channel between Botmaster and botnet `[RZMT06]`. A 1: n communication between
    Botmaster and Bots over a `C & C` channel is the basic defining feature of a botnet.
    In addition, "botnets" are only those structures whose intended purpose is to
    carry out harmful and criminal acts. After all, botnets are just a tool that can,
    but does not have to, do harm. Structures of a similar nature, such as "Folding@home"
    or "Mersenne Prime Search," are peaceful and meaningful services that are not
    classified as botnets.


    The evil bots to be found today evolved from the classic `IRC` bots of the early
    1990s. `Eggdrop` was one of the first such bots to support the `IRC` user in chat
    by performing functions such as database queries or offering help. Based on the
    modularity of `Eggdrop`, first bot programs were developed that could be used
    to implement evil intentions. However, the first attacks are limited to `DoS`
    in the `IRC` sector, for example, through automated "flooding." These bots have
    evolved over time, but the modularity of `egg-drop` and control over `IRC` have
    been retained `[CoJM06]`. In the meantime, botnets are being used for pure vandalism
    ("script kiddie") as well as for commercial fraud, extortion, spam, and phishing
    `[CoJM06]`. It also identifies a community that works closely together to develop
    and develop malware. If the source code of the bots is publicly available, they
    show a large number of user signatures in the form of scene-specific pseudonyms.
    Code is often reused; the source code contains comments that specify the original
    source code. Often, these are pre-existing malicious software such as computer
    viruses, worms, or Trojans.


    ## Common Botnet Systems


    The classification of the existing bots is difficult. Existing Bot software is
    often rewritten several times, expanded and modified; sometimes up to 4,000 versions
    of a bot variant are known (`SDBot` and `Agobot`). Here is a selection of the
    most widely-received and currently popular bot groups listed:


    ### Agobot/Phatbot/Forbot/XtremBot

    The core of almost all common bots is `Agobot`, first released in 2004, and its
    programmer was arrested in the same year. The bot is written in `C++` and offers
    a modular and abstract software architecture. The source code is released under
    the `GPL`, although no central reference source is available. `Agobot` has been
    expanded several times over the years, with the current source code package, with
    all modules, extensions, additional tools, and alternative implementations, having
    a size of around 140 MB. `Agobot` uses `libpcap` `[BHKW05]` to listen for network
    traffic and provides support for `PCRE` (Perl Compatible Regular Expressions)
    and `NTFS ADS` (Alternate Data Streams) as well as functions of a classic rootkit.
    New versions are able to prevent the reading of `C & C` parameters by detecting
    debuggers and virtual machines such as `SoftICE` or `VMware` `[BHKW05]`. `Agobot`
    provides encryption of `C & C` communication with `SSL` and is available in a
    special version for infecting Linux systems `[CoJM06]`.


    ### SDBot/RBot/RBot-GR

    `SDBot` and derivatives are written in `C` and published under the `GPL`. The
    source code is small and concise, albeit with little abstraction and no modularity
    support. Damage functions are not implemented in the basic system, only basic
    functions for processing the `C & C` commands are available. The addition of malicious
    functions requires only minimal modification of the source code. `SDBot` also
    uses backgrounds left behind by other malware for primary infection, in addition
    to vulnerabilities in Windows operating systems and peer-to-peer software `[CoJM06]`.
    More than 4,000 variations are known. The meanwhile reworked source code allows
    conclusions to be drawn to the authorship of more than 100 programmers.


    ### Storm Worm/CME-711/Troj.Dorf/Win32.Nuwar

    With a footprint of an estimated 1 million infected systems, the Storm botnet
    is the largest ever observed. The anatomy of the associated bots software `CME-711`
    is little researched, unambiguously assignable source codes are not openly accessible.
    The electricity botnet was responsible during 2007 for various `DDoS` attacks
    of commercial interest, which were reported in the trade media.


    ### Clickbot

    A clickbot is or was a commercially available or rentable yet illegal and harmful
    botnet system. The botnet with a footprint of 100,000 bots was discovered in May
    2006. Google invested considerable effort in analyzing the botnet in order to
    be able to use an effective filter for click simulation. The bot was as `BHO`
    (Browser Helper Object) for "Microsoft Explorer" implemented, as C & C channel
    served `HTTP`. The dissemination of the Bot software took place by means of "Social
    Engineering" and by exploiting security gaps in the software "Microsoft Explorer."
    The administration took place via decentralized administration system written
    in `PHP` with `MySQL` as a backend. The source code of administration system could
    be confiscated and was published `[DaSt07]`.


    ## Operation


    The lifecycle of a bot system can be divided into several phases and roles. After
    importing into victim system (primary infection), the actual bot software (secondary
    infection) is reloaded, after which contact is made to the Botmaster via `C &
    C` channel, whose commands are then implemented.


    ## Intake into Victim System


    The acquisition of new victim systems is not uncontrolled in the environment of
    botnets as with conventional viruses. As a rule, existing bots are instructed
    by botmaster to locate and infect victim systems. It exploits security gaps in
    the victim''s system. The distribution mechanism of botnets is one of the main
    causes of background noise (network traffic caused by malware scanners) on the
    Internet, which is mainly at ports `445/TCP`, `139/TCP`, `137/UDP`, and `135/TCP`.
    According to the Honeynet Project, 80% of the measured passive network traffic
    is accounted for by average connection for these ports `[BHKW05]`. Connected to
    this are known vulnerabilities of operating system Windows NT to XP. Common sources
    of attack are also security vulnerabilities in network games, peer-to-peer programs,
    and email clients. In addition, it can be observed that bots exploit functions
    of other malware in order to install themselves on the victim system `[CoJM06]`.
    In addition to the exploitation of security gaps, methods of "social engineering"
    are used as well as the order for export. Typically, an infected system executes
    a download immediately. The URL of the download is given either directly or indirectly
    in the binary file of the primary infection. Common protocols include Trivial
    File Transfer Protocol (`TFTP`), File Transfer Protocol (`FTP`, `[PoRe85]`), Hypertext
    Transfer Protocol (`HTTP`, `[FGMF99]`) or `CSend`, a protocol for sending files
    IRC users. The latter is particularly useful in the context of `IRC` as a `C &
    C` channel. The software used to infect the system usually does not have functionality
    for participation in botnet `[RZMT06]`. After downloading, the downloaded binary
    file is executed and registered in the operating system so that is automatically
    started at system startup. Typically, existing bots serve as servers for these
    binary files `[RZMT06]`; in some cases compromised web servers or free providers
    of web space are also abused in other ways `[BHKW05]`. `Agobot` contains, for
    example, after the primary infection, only a few so-called "Commands," which it
    can export remotely. These only cover the areas of communication via `IRC` and
    the downloading of additional components. Thus any damage function must be added
    afterward by the secondary binary package. The development of `Agobot`, known
    as `Phatbot`, also offers after the primary infection functions for exports of
    `DDoS` attacks and data theft. The binary file can thus be preconfigured to execute
    harmful activities without the need for a control command from `C & C` channel.


    ## C & C channel


    Various protocols are used as the `C & C` channel to control the bots. Widely
    established is the `IRC` protocol. The proliferation of peer-to-peer systems,
    which can also contain freely definable instructions in the form of chat specifications,
    also makes protocols such as `e2k`, `Gnutella`, or `FastTrack` popular. Occasionally
    the modular structure of the bot programs allows access to a variety of different
    protocols. The 2003 `SDbot` was able to use not only `IRC` but also established
    peer-to-peer protocols as `C & C` channel `[CoJM06]`.


    ### IRC


    Despite recent developments, communication via `IRC` is the most widely used communication
    channel. This is facilitated by the flexibility of the protocol and the availability
    of free implementations that can be used to program the malware. In the typical
    scenario, the botmaster operates an `IRC` channel on a server to which the bots
    connect automatically. The `IRC` channel is mostly password protected. Username,
    password, channel name, and address of the server are permanently integrated into
    the binary malware. In most cases, dynamic URIs are used to change the server
    when needed. To successfully connect to the `IRC` channel, a username formed according
    to a special algorithm, as well as the correct transmission of the password via
    the `IRC`-specific `PASS` command `[RZMT06]`. The `IRC` protocol does not provide
    any encryption, so all access data can be obtained from other network sniffing.
    After successful authentication, the `IRC` server sends the messages to the bot
    `RPL_ISUPPORT`, `RPL_MOTDSTART`, `RPL_MOTD`, `RPL_ENDOFMOTD`, and `ERR_NOMOTD`
    `[OiRe93]`, respectively. `RPL_MOTD` can already transmit commands to the bot
    without this one entering the channel. For example, a new channel name or an alternative
    server can be specified. The bot parses after entering `RPL_TOPIC` and executes
    the command immediately. `RPL_TOPIC` follows in the common bots a simple syntax
    consisting of a method name and parameters. An `RPL_TOPIC` of shape `.advscan
    lsass 200 5 0 -r -s` instructs the bots, for example, to continue to spread themselves
    through the `LSASS` security gap by searching for threads with a delay of 5 seconds
    without time limit (0) for vulnerable victims `[BHKW05]`.


    At the beginning of the 1990s, public `IRC` channels were used as the `C & C`
    channel. For the administrators of public `IRC` servers, abuse of this kind was
    a significant security risk. The use of filters and other analytical methods was
    widespread. However, modern observations show that current botnets use almost
    individually modified `IRC` server. This modified `IRC` typically do not adhere
    to the properties specified in `RFC1459`. To make the number of bots in botnet
    inaccessible to drones, as a rule, no user list is output, as required in the
    specification of `IRC` protocol. This performance is achieved by omitting broadcast
    messages for `JOIN`, `PART` and `QUIT`. In addition, mandatory messages `LUSERS`
    and `RPL_ISUPPORT` according to the specification `[OiRe93]` are not implemented
    in order to make the external analysis of `C & C` channel more difficult. Recent
    observations also show that current botnets introduce additional encryption and
    security mechanisms, so `IRC` channel only serves as a tunnel `[Netw07]`. The
    control of botnet via `IRC` channel is a central type of communication. If this
    central interface is compromised, the botnet no longer commandable. From the point
    of view of attack, this central deployment results in low latency of communication.
    The Botmaster has control over `IRC` server, which is not the case with decentralized
    approach `[CoJM06]`.


    ### P2P


    The use of peer-to-peer networks as `C & C` channel, in contrast to the classical
    approach of `IRC` channel, pursues a decentralized strategy. The communication
    over `P2P` systems is generally not to interrupted or compromised even with great
    effort. Tracking traffic is complex. The disadvantages of Botmaster''s view are
    the indeterministic nature of channel and lack of control. For `P2P` systems,
    there are already mechanisms for anonymizing the traffic that can be used by the
    Botmaster `[CoJM06]`. `P2P` systems as `C & C` channel are poorly discussed in
    the literature.


    ### HTTP


    In particular, bots optimized for exporting harmful actions on the `WWW` (such
    as clicks on commercial ads, manipulation of Internet casinos and web games) use
    `HTTP` as `C & C` channel. Examples are `Clickmaster` and `Clickbot.A` `[DaSt07]`.
    They are usually as `BHO` (Browser Helper Objects) of the software "Microsoft
    Explorer implemented." By integrating with the web browser, `BHOs` have access
    to `WWW` resources without much effort.


    ### Deterministic Communication


    Following the example of existing fully centralized `P2P` systems, it would also
    be possible to have completely decentralized communication between the bots that
    take place without the use of all protocols. In this scenario, a bot could actively
    scan for additional members of its network and send encrypted messages to those
    found bots. The latency is very high. A system of this kind could not yet be observed
    in the productive form `[CoJM06]`.


    ### Command Translation


    The transmission of Botmaster commands to the individual bots takes place in a
    syntax that cannot be specified in general terms. General statements about their
    shape cannot be made. The popular `Agobot` uses the syntax form:

    ```

    . <command_class> <subcommand> <parameter>

    ```

    That''s the order of the command.

    ```

    .ddos.syn 129.13.182.1 21 200

    ```

    Bots attack the University of Karlsruhe web server on Port 21 for 200 seconds
    with `DoS` attacks.


    ## Application And Command Classes


    Botnets are first and foremost, a tool that can be used as a basis for executing
    potentially criminal and harmful actions. Briefly, the various hazard potentials
    should be considered in the order of their frequency:


    ### DDoS


    The "Distributed Denial Of Service" is the most common threat posed by botnets.
    According to surveys by `[Netw07]`, 71% of all observed botnets are in `DoS` attacks.
    In this case, a botmaster commands all bots to send excessive network traffic
    to a defined destination. The attacked server is unable to properly service its
    services due to a large number of requests. Investigations show that the majority
    of attacks from botnets are currently over `UDP`. The attacks at the application
    layer or at `TCP` are lagging behind `[Netw07]`. `DDoS` is thus the primary threat
    posed by botnets and only botnets.


    ### Spamming


    64% of all observed botnets send email spam `[Netw07]`. This usually works over
    a `SOCKS v4/v5` proxy `[LGLK96]` on the compromised system `[BHKW05]`. `Agobot`
    is also capable of building a Cisco Systems'' Generic Routing Encapsulation (`HLFT94`)
    tunnel, which makes it easy to encapsulate email protocols `[CoJM06]`. 34% of
    all observed botnets were able to provide such open proxies for sending spam email
    and other activities `[Netw07]`.


    ### Data Theft


    Some bots are able to aggregate information from the victim''s system like classic
    Trojan horses and send it to the botmaster. These are, in particular, email addresses
    stored on the system, passwords, and other identity data (16% of botnets `[Netw07]`).
    In addition, botnets provide various elements for phishing (37% of all botnets).


    ### Miscellaneous


    Because botnets have a variety of different IP addresses from the regular Internet
    Service Provider (ISP) pool, botnets are increasingly being used for commercial
    fraud. The main providers here are providers of online advertising (such as Google
    AdSense `[DaSt07]`). In this case, the bots generate virtual clicks on advertisements
    of online vendors, online games, and more Internet casinos are also finding this
    type of fraud `[Netw07]`.


    ## Tracking Botnets


    ### Virus Scanner


    Recognition of bot software on victim system follows the same strategies that
    are used for other malware. All commercial virus scanners are able to detect and
    delete known software. This method will not be discussed further.


    ### Honeypots and Malware-Collection


    A controlled install potentially victim systems and analyzing the infection occurs
    in the broadest sense as malware. Malware collection generally refers to the isolation
    of malware. In both approaches, it is important to isolate the `C & C` channel;
    if necessary, with the necessary parameters for login and communication. This
    is done either by listening to the network traffic generated by an infected system
    or by analyzing binary file. In particular, since the log via `IRC` generally
    takes place without encryption, the login parameters are generally easy to win
    `BHKW05]`.


    ### Drones


    Controllable software that simulates the behavior of bots in botnet to aggregate
    information is called a drone. That drone software is used to analyze the size
    of botnets.


    ### IRC-Based Detection of Botnets


    By using filters, potential `IRC` `C & C` channels can be found. A simple method
    is to filter network traffic on TCP port `6667` for known botnet commands. Another
    method is and to search for characteristic patterns in `IRC` communication. As
    a rule, bots are "dumb" for a long time, then respond quickly and in large numbers
    to a command from botmaster. These answers of this type are generally successful
    in finding botnets but suffer from high error rate `[Raci04]`. However, general
    characteristics of botnet communication via `IRC` are apparent `[CoJM06]`.


    ### Combinations and Data Mining


    All hitherto known systems for the detection of botnets suffer from high failure
    rate. Either a small class of botnets can be detected a priori or the detection
    density is very low. New approaches suggest a combination of different approaches.
    Existing data can be analyzed for characteristic properties and characteristics
    of botnet. Features include the increased volume of scanning of unused TCP ports,
    the reading out and analysis of DNS caches as well as the analysis of sent binary
    files. A combination of these methods can be used for comprehensive `[CoJM06]`.


    ## Analysis Factor Botnet Size


    Whereas botnets containing between 80,000 and 140,000 bots were classified as
    dangerous in the past, reports in recent years have warned against botnets containing
    a few hundred bots `[Netw07]`. The large botnets in the form of estimate of the
    average active bots are therefore, an important characteristic in order to assess
    the danger potential of messenger network. The development of smaller botnets
    has several reasons. First, small botnets are more likely to be detected by robust
    security software than they would with large botnets. Small botnets, therefore,
    have a higher market value in the impacting scene and can be easily leased or
    sold `[CoJM06]`. The move to broadband connections for home PCs also eliminates
    the need to acquire several bots. With an average wired Internet connection at
    about 1Mbps upload speed, only few hundred bots are needed to reach the capacity
    of an OC3 (155Mbps) link. An attacker''s effective `DDoS` attack is thus already
    possible with fewer than 200 bots. Nevertheless, the evaluation of botnet size
    remains a controversial subject of current research. Dagon et al. investigated
    the botnets of an alleged large number of 350 000 active bots `[DaZL06]`. Rajab
    considers botnets with a size of fewer than 1,000 bots to be potentially dangerous
    `[RZMT06]`.


    The size of botnet is the most important characteristic feature, but there is
    general disagreement about how to define this greatness. One problem with determining
    largely observed botnets is the distinction between active and passive bots. Active
    bots usually account for only 5-10% of the total number of bots `[RZMT07]`. The
    parameter of the size of the botnet is always directly related to the measuring
    method used, the related side effects, and context. In addition, the size of botnet
    does not make any statement about the danger posed by the botnet. Moreover, the
    division into passive and active bots is not clearly defined and is difficult
    to access in the established measuring methods. Therefore, two definitions have
    been established in the literature. The footprint of a botnet indicates the potential
    `Gesamtrobe` of a botnet at a given time point. All infected systems whose bot
    software is configured to join the observed botnet will be paid. This parameter
    provides information about the distribution rate of the messenger network and
    about the effectivity of the dissemination mechanism. The footprint of a botnet
    is time-variable and depends on the daily spread and countermeasures used by the
    affected systems `[RZMT07]`. An alternative term for the footprint is the number
    of passive and active bots. The second definition gives an indication of the active
    population (live population). This parameter describes the number of directly
    available bots that can be retrieved at a given time via the `C & C` channel.
    Thus, the botnet no longer commandable. From the point of view of attack, this
    central deployment results in low latency. Following the example of existing fully
    centralized `P2P` systems, it would also be possible to have completely decentralized
    communication between the bots that take place without the use of all protocols.
    In this scenario, a bot could actively scan for additional members of its network
    and send encrypted messages to those found. The latency is very high. A system
    of this kind could not yet be observed in the productive form `[CoJM06]`.


    ## Methods for Estimating the Botnet


    Following the example of existing fully centralized `P2P` systems, it would also
    be possible to have completely decentralized communication between the bots that
    take place without the use of all protocols. In this scenario, a bot could actively
    scan for additional members of its network and send encrypted messages to those
    found. The latency is very high. A system of this kind could not yet be observed
    in the productive form `[CoJM06]`. (Note: This section repeated in source text).

