    # Chapter 6 – Phishing


    ## What is Phishing?

    Phishing is an automated identity theft. This sends the fake emails to recipients
    trying to trick that recipient into sharing their private information such as
    credit card numbers or password bank accounts. Most of all, emails sent to a fake
    website make them enter private data. In order to gain confidence, this website
    must be similar to the original site that the Phishers imitate. The word phishing
    is obviously a variation of ''password fishing '', in that the phishers put the
    ''hook '' out with the hope that a few victims will bite it.


    ## Functioning and Phishing Method

    Although the general idea for Phishing is to inflict the victims on the fake side,
    there are several techniques that make the idea a reality. The three best-known
    methods are now presented: Impersonation, Forwarding, and Popups.


    *   **Impersonation**: is the simplest and most popular phishing method `[LiVi02]`,
    with which is a fully crafted fake page for victims to visit. The fake website
    contains images from the real website, which do not necessarily have to be copied
    to the phishing server but simply backed up from the original website. If the
    victim types his/her data into the input field and clicks `Submit`, that data
    will be sent to phishers in the input field through the `Script Handling` script.
    An important part of the method is to write the phishing email with a link to
    the fake page. Such an email looks like the underlying mail: The language in the
    email of the key victim is to attack. The fake page should be the same as the
    original page, so you can not immediately tell that they are different. For example:
    Original: `http://www.securitybank.com/bank/cgi/show?id=45` Fake: `http://www.securitybank.net/bank/service/show?prameters=1`


    *   **Forwarding**: is a phishing technique that uses an email to get the private
    data and then leads the victim to the real website. This phishing style is popular
    with eBay, PayPal, Amazon ... often emailing their customers to share benefits
    and new services. With this technique, the login field (or specific input field)
    will be embedded in the email. When victims type in their data and click `Submit`,
    they are taken to the real page, but their data is sent to Phishers. Such emails
    look like the ones from below: The login script is actually similar to `Impersonation
    Script`, just after sending victim data to phishers, the login script will take
    you to the real website. Victims are more easily cheated with this technique because
    the fake URL is not displayed. It is difficult to discover that the HTML email
    comes from another website.


    *   **Popup Attack**: is a technique by opening a pop-up window for the phishing
    server during the redirection of the victim to the real web page. HTML code for
    the pop-up window is easily made as below:

    ```html

    <BODY bgColor = #ffffff onload = "window.open (''phish.html '',''popup '','' ''top
    = 150, left = 250, width = 250, height = 200, toolbar = no, location = no, scrollbars
    = no, resizable = yes '' ) </BODY>

    ```

    If victims follow the link in the email, the fake page becomes the real one right
    away. The page is redirected and opens a pop-up window with input fields into
    which all typed input will be sent to the phisher. However, this technique is
    rarely seen today because pop-up blockers are used in most browsers.


    ## Protection

    Since the phishing emails always contain HTML representation and the forwarding
    technique still script, by turning off HTML presentation and script of the email
    program who disable the fake HTML, links, and scripts. All emails are then displayed
    with plain text to protect against phishing. Use a phishing protection system
    that compares e-mail headers with the latest phis-her-list of lyrics and reviews
    the links, whether or not they are really displayed. Never open emails sent by
    unknown sources. Install an anti-spam system to filter spams.


    # Chapter 7 – Spam

    With the rapid spread of the Internet and the proliferation of e-mail in the business
    and personal realm, sending unwanted bulk e-mail, commonly known as spam, has
    also become a massive problem. This seminar paper shows which basic features of
    the e-mail system enable the sending of spam and how senders do it. Furthermore,
    various methods are presented to prevent the sending of spam messages and efforts
    to solve the problems of the present e-mail system.


    ## Definition

    The most widely used international term for spam is `Unsolicited Bulk E-mail (UBE)`
    —to German unwanted or unsolicited bulk e-mails. In addition to e-mail spam, there
    are also spam in other media such as instant messaging systems, commentary spam
    in gas books and weblogs and telephone spam through automated calls with tape
    announcements. This work focuses exclusively on e-mail spam in the sense of UBE.
    The term spam derives originally from the spammed product `SPAM – Spiced Pork
    And Meat/Ham` from Hormel Foods Corporation. The product, which has been available
    since 1936, was taken up in 1970 in a sketch of the English comedy series " Monty
    Pythons '' Flying Circus ", which appears as part of every dish on a menu and
    is loudly supported by a group of singing Vikings. `[Merr04]`, `[Pyth70]`. The
    word appears more than 132 times in the sketch, which explains the association
    with e-mail spam.


    ## Introduction

    While spam messages were just a few years ago, using e-mail today is virtually
    impossible without massive anti-spam measures. Although the problem of unwanted
    e-mail messages was already recognized in 1975 by `Postel[75]` and 1982 by `Denning[82]`,
    in practice, it did not matter at that time. Sending messages to thousands of
    newsgroups on April 12, 1994, promoting a green card lottery was the first major
    commercial news story `[Camp94]`. In 1997, the spam problem was also recognized
    on the official site: the US Trade Commission dealt with this issue and set up
    a working group for combating corruption `[Comm97]`. In the past few years, spam
    shipments have risen sharply and accounted for approximately 80-85% of e-mail
    traffic by the end of 2005 `[Group96]`. Unfortunately, despite much progress in
    spam-fighting, the following statement by Bill Gates has not been confirmed: "Two
    years from now, spam wants to be solved. I promise a spam-free world by 2006."
    (Microsoft CEO Bill Gates, Jan 2004 )


    ## Types

    Spam messages can be divided into different categories. `[Lab06]`, `[Mars]`

    *   Adult spam: such as the promotion of potency increasing drugs, pornographic
    offers or dating services

    *   Financial offers: such as loans, advertising for shares to influence the price
    or alleged profits in lotteries

    *   False messages intended to obtain authentication information for online services


    ## Disguise

    With the emergence of spam filters, senders are trying to get the actual content
    of the Disguise messages. This ranges from simple text changes like `V14gra` or
    `\| | 4grA` up to the dispatch of pictures, PDF and audio files since these are
    more difficult to analyze.


    ## Bounces

    Bounces (see Section 2.5) are not spamming messages per se, but they occur as
    a result of undeliverable messages with faked sender details. This information
    about the failed delivery to the supposed sender is sometimes harder today than
    the spam itself since there are few countermeasures


    ## Damage

    A large amount of spam that is being sent today causes additional network traffic,
    computational effort, memory requirements, and working hours, both by e-mail users
    and administrators. Table 1 shows by means of a sample calculation which enormous
    damage is caused by spam and how few recipients have to react to a spam message
    so that the sender makes a profit.


    ## Origin

    According to statistics from the Spamhaus project `[Proj07]`, most of the spam
    is sent from the US. The US is followed by China, Russia, the United Kingdom,
    and fifth place in Germany.

