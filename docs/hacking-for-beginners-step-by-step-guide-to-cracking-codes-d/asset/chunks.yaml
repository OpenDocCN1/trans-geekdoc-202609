    # 第 8 章 – 电子邮件系统的功能


    发送垃圾邮件与电子邮件系统的工作原理密切相关。下文将对此进行解释。


    ## SMTP

    当前的电子邮件系统基于 1982 年指定的 [Post82] 以及在 2001 年由 `ESES` [Klen01] 更新的 `SMTP` 标准。它就像互联网本身——去中心化，并规定了邮件从一个服务器到另一个服务器的传输。服务器上的服务程序被称为邮件传输代理（`MTA`），负责接收和处理消息。如果它收到的邮件发送给本域域内的接收者，它将其放入对应用户的信箱中。否则，它将通过
    `SMTP` 将邮件发送到相应的电子邮件服务器，该服务器是通过 `DNS` 确。列表 1 显示了通过 `SMTP` 传输的消息。


    ### 列表 1：SMTP 对话

    ```

    220 s omehost. net ESMTP Exim 4. 6 3 # 1 Mon, 26 Nov 2 0 0 7 2 3: 1 0: 2 1 +0100
    HELO anotherhost. net 250 somehost.net Hello localhost [1 2 7. 0. 0. 1 ] MAIL
    FROM: Bill < bill @ Microsoft.com > 250 OK RCPT TO Richard @ somehost.net 250
    Accepted 250 accepts DATA 354 Entermessage, endingwith ". "On aline by itself
    From Steve < steve @ Microsoft.com > To: Richard@somehost. net Subject: L i nux
    v iolates our IP Hello, nothing unusual to say, 250 OK id = 1IwmAg - 0008ED -
    LA QUIT 221 somehost.net closing connection

    ```


    在互联网早期，邮件的交付只需交给本地 `MTA`，这是当时流行的 `UNIX` 系统的标准功能。如今，电子邮件客户端（也称为邮件用户代理，`MUA`）通常将发送邮件发送到提供商的电子邮件服务器，再由其进行进一步传输。它同样使用
    `SMTP` 协议，但是允许密码的增强版本 `ESMP`。将 `SMTP` 协议用于两种不同的应用程序——终端用户消息提交（"submission"）和 `MTA`
    之间的邮件传输（"transfer"）——使得 `MTA` 的配置变得复杂且易错。因此，根据消息提交规范 [GeKl98]，建议通过不同的 `TCP` 端口和一些协议扩展来将终端用户的消息持久化分离。


    ## 中继 (Relaying)

    中继是指通过 `SMTP` 接受和转发消息。过去，`MTA` 习惯于接受任意消息并在必要时转发。这种配置被称为开放中继（Open Relay）。随着后续实施，这导致了垃圾邮件的发送，因此这种做法在很大程度上被放弃了。现在，`MTA`
    通常只接受指向自己域的邮件，除非发送者通过密码验证。向第三方服务器传输消息在故障转移安全方面起着作用。如果无法到达电子邮件服务器，消息可以转发到“邮件交换器”（`MX`，在
    `DNS` 中指定），它会被缓存并在负责服务器再次可用时进行投递。


    ## 消息的真实性

    技术上，电子邮件只是一段文本，由头部（`Header`）和消息部分（`Body`）组成。头部包含元信息，如发送者、接收者、传输时间和操作员。消息部分包含消息本身。然而，头部仅作为接收者的额外信息。当通过
    `SMTP` 协议发送时，会显式指定发送者和接收者。这些信息被称为信封信息（Envelope Information），消息接收者是不可见的。它们可能与消息头部中的信息不同（另见列表
    1）。因此，信封信息包含了消息实际发送的所有电子邮件地址。而在头部中，这些地址的某些可能在“to”字段（接收者），另一些在“CC”字段（抄送），另一些完全不在（密抄，`BCC`）。因此，头部信息可能包含任何值，特别是是错误的发送者地址。此外，信封详细信息在传输过程中通常不会经过检查。特别是接收服务器无法对发送者地址验证，因为
    `SMTP` 标准并未规定允许哪些服务器为某个域发送邮件。因此，电子邮件消息的真实性并不由电子邮件系统保证。


    ## 交付错误

    原则上，如果 `MTA` 接受了消息，它就对该消息负责。如果它无法交付消息，它会向发送者发回退信邮件（bounce message），说明交付失败的原因。例如，可能由于目标主机上的信箱不存在或已满。如果是临时错误（例如目标主机无法访问），它会尝试长期投递消息。


    # 第 9 章 – 原因


    下文指出了有利于发送垃圾邮件或从根本上使其成为可能的不同原因。


    ## 低廉的发送成本

    垃圾邮件的发送成本非常低，因为只需要一台连接到互联网的计算机。这使得发送垃圾邮件变得具有吸引力，因为由于发送成本低，只需要极小比例的接收者对消息做出就能盈利。


    ## 开放中继 (Open Relays)

    开放中继使得批量发送消息变得容易，因为垃圾邮件者只需要发送一次带有大量接收者的消息，然后由开放中继处理后续传输。此外，开放中继允许垃圾邮件发送者发送垃圾邮件，即使自己的地址已经被加入黑名单。开放中继也可能由于
    `MTA` 配置错误而意外产生。


    ## 僵尸电脑 (Zombie Computers)

    僵尸电脑是互联网用户使用的计算机系统，它们被木马受到外国控制并形成了大量的所谓的僵尸网络（botnets）（见其他语义论文）。这些电脑经常在所有者不知情的情况下被用于发送垃圾邮件。赛门信安全公司在
    6 个月内监控了超过 500 万台被僵尸网络感染的计算机。[Corp07]。除了直接通过 `SMTP` 发送消息外，某些木马还会尝试获取电子邮件提供商服务器的凭据，并在验证后使用它们发送消息。


    ## 真实性无法验证

    由于在没有进一步技术措施（如电子签名）的情况下无法检查消息的真实性和者信息的正确性，因此很难区分垃圾邮件和普通消息。垃圾邮件必须手动筛选和删除这一事实是接收者产生成本的主要原因。


    ## 缺乏针对垃圾邮件者的统一处理机制

    由于互联网的国际性质以及缺乏统一的法律依据，针对垃圾邮件者没有统一的方法。虽然一些国家现在制定了反垃圾邮件法，但另一些国家没有起诉垃圾邮件者的法律依据。


    ## 发送 (Shipping)

    由于总是根据 `IP` 地址定位一个或多个服务器，并由公共部门将其下线，垃圾邮件的传输通常由外部计算机执行。以前通常是开放中继，而现在几乎完全是僵尸网络。


    '
