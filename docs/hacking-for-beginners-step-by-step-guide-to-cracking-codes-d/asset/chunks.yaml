- fmt: "\n# Chapter 2 – Passive Enlightenment and Foot-printing\n\nIncluded in the\
    \ passive enlightenment/foot-printing category are techniques that can be used\
    \ to gather information about a goal without interacting directly with the target\
    \ system. By using \"third\" sources for obtaining information, no traces of the\
    \ attacker will be left on the target system, for example in the form of IP addresses\
    \ in server log entries. The possibilities of foot-printing include, among other\
    \ things, examining the company website, possibly using a proxy to disguise your\
    \ own identity and IP address.\n\n## General Search\nGeneral information about\
    \ a destination can be found with a general search using search engines, web pages\
    \ or news.\n\n## Important Information\nThe technology used in the target system\
    \ can be used to study vacancies, as the requirements for network specialists\
    \ can be used to refer to the products used. For an attacker, it may also be important\
    \ to examine the personal web pages of employees (if any) and collect instant\
    \ messaging usernames, email addresses, and phone numbers. In general, any information\
    \ about the target can be useful at attack time, and therefore, at least in the\
    \ phase of enlightenment, is important and should be collected. \n\n## Google\
    \ Hacking\nGoogle hacking is a technique that uses the so-called \"advanced\"\
    \ operators of search engines to find information on the web that an attacker\
    \ can exploit for an attack. This technique can be used to find all the files\
    \ and information that reside on a web server indexed by search engine web crawlers.\
    \ These include directory lists of servers, the exact version of the server software\
    \ used, information about a company's intranet, or personal information about\
    \ employees. So, as Google Hacking exploits, private or security-sensitive information\
    \ have been inadvertently compromised on servers, and search engine crawlers have\
    \ indexed that information, leaving them with a search query.\n\nOther possible\
    \ Google Hacking queries include a company's domains, security vulnerabilities,\
    \ and associated exploits, targets that match specific exploits, usernames, passwords,\
    \ or source code. The following operators represent a selection of operators used\
    \ in Google Hacking searches:\n\n- `intitle:` restricts the results to documents\
    \ containing the directly following expression in the title\n- `inurl:` constrain\
    \ the results to documents containing the directly following expression in the\
    \ URL\n- `filetype:` limits the results to documents with the corresponding file\
    \ extension. In addition, a desired search term `ff` must be specified.\n- `site:`\
    \ restrict the results to documents in the specified domain\n\nThese operators\
    \ can now be combined in almost any way to search queries and can 'bring up' a\
    \ lot of security-relevant data. As an example, here is a search query from the\
    \ Google Hacking database [Long07], in which many Google requests from the network\
    \ security area are recorded.\n\n### Enlightenment\nIf the permissions on the\
    \ server are not set correctly and the Google crawlers can read the contents of\
    \ the `/etc/password` folder, an attacker can use this search to find password\
    \ files. The attacker can then attempt to decrypt the found password files, which\
    \ are usually encrypted, by means of a dictionary attack, and access the discovered\
    \ system with the decrypted passwords. Another possibility for the attacker is\
    \ to add the decrypted \"password\" to his dictionary for further attack.\n\n\
    ### DNS\nThe Domain Name System is a hierarchical, distributed database that assigns\
    \ one or more IP addresses to a domain name. Normally, this IP address is hidden\
    \ from the user, but it can be explicitly queried and thus used as a starting\
    \ point for further searches regarding the IP address range of an organization\
    \ or for WHOIS queries. [Mock87]\n\n### WHOIS queries\nThe `NICNAME/WHOIS` protocol\
    \ is used to query distributed databases that provide a directory of registered\
    \ domains and IP addresses. Originally, the standard [HaSF85] provided only one\
    \ central database on one central server, as all domains were managed centrally\
    \ by the Network Information Center. As the Internet grew, the standard was updated\
    \ and switched to a distributed database system. [Daig04] The administration of\
    \ the various top-level domains has also been transferred to several registrars,\
    \ each of which maintains its own WHOIS database. WHOIS queries are possible with\
    \ different tools or via web interfaces.\n\nThe DENIC (German Network Information\
    \ Center) is responsible for assigning and administering `.de` domains, whose\
    \ database provides the following information for a WHOIS query of a domain [DENI07]:\n\
    \n- **Holder**: This is the domain owner who is the contracting party of DENIC\
    \ and has material to this domain.\n- **Admin**: This is the administrative contact\
    \ named by the domain owner and obliged to DENIC to make decisions on the domain.\
    \ This is important if the domain owner is not a person but a company or organization.\n\
    - **Tech**: This is the technical maintainer of the domain, in private individuals\
    \ with rented webspace. These providers rent webspace and operate name-servers\
    \ for domains stored on their webspace, which would be a great expense for private\
    \ individuals.\n- **Zone**: The administrator is the technical maintainer of the\
    \ registered name servers of the domain, which is responsible for the accessibility\
    \ of the name. For private individuals, this is usually the same provider that\
    \ is also Tech.\n- **Name**: Organization, address, postal code, country, and\
    \ timestamp changes. Optionally for Holder and Admin but always Tech and Zone,\
    \ phone numbers, faxes, and email addresses are displayed. Furthermore, technical\
    \ information such as the expiration date of the domain and at least two name\
    \ servers are issued for each domain. The attacker can now use the specified name\
    \ servers as a starting point for intensive searches. The contact details for\
    \ the admin can be used by social engineering (Section 3.3.1), and the expiration\
    \ date of the domain is important. If a WHOIS query with an IP address as parameter\
    \ is executed, the database of the responsible RIR is queried and information\
    \ about the holder of the IP address and range is output. This information is\
    \ very useful for active enlightenment, as certain IP addresses can be examined\
    \ for active systems, i.e. connected computers that respond from outside.\n\n\
    ## Active Enlightenment\nActive enlightenment refers to techniques that interact\
    \ directly with the target system to gather more information about the target\
    \ system. Examples include port scanning to find open ports on a server, and OS\
    \ fingerprinting to identify the operating system of the server. These techniques\
    \ are applied after passive enlightenment. The then-found information about the\
    \ systems makes possible better adapted and potentially successful attacks.\n\n\
    ### Ping Sweeps\nNetwork sweeps such as computers that are turned on and respond\
    \ to a ping request—are active systems that can be found in a network by ping\
    \ sweeps. The ping process itself is implemented using Internet Control Message\
    \ Protocol (ICMP) and sends out ICMP request packets. If a system is active, it\
    \ responds with an ICMP Echo Reply packet. The IP address area can be further\
    \ investigated.\n\n### Port Scanning\nIf an attacker has found active systems,\
    \ he can perform one port scan with the aim of finding open ports. Open ports\
    \ are ports where applications wait for incoming connections and accept connections.\
    \ A port scanner sends TCP or UDP packets to a port range and closes the status\
    \ of those ports. Responses with certain flags set are standardized according\
    \ to [Info8b]:\n\n- **TCP Connect Scan**: This scan establishes a TCP connection\
    \ with 3-way handshake (`SYN`, `SYN/ACK`, `ACK`) to the destination port. If successful,\
    \ it can be deduced that a service is running on this port and accepts connections.\n\
    - **TCP SYN Scan**: Here, no connection is established, but only an `SYN` package\
    \ sent to the destination port. If the system responds with `SYN/ACK`, this port\
    \ is open. If `RST/ACK` comes back, the system will not listen to this port. Because\
    \ no connection is established, this scan does not appear as a connection or connection\
    \ attempt in the server logs. This leaves the IP address of the attacker and the\
    \ scan undetected.\n- **TCP FIN Scan, TCP Xmas Scan, TCP Zero Scan**: These scans\
    \ set `FIN`, `URG` and `PSH` or no flags. If the ports are closed, an `RST` is\
    \ received as response; open ports ignore these packets and do not respond.\n\
    - **UDP scan**: An empty UDP packet is sent to the destination port. If the answer\
    \ is ICMP port unreachable, the port is closed; if no answer is received, it will\
    \ be closed. Using the open ports of a system, an attacker can identify running\
    \ applications that accept connections. With this information, the attacker can\
    \ see what function the system is doing, ie for a web server, port `80` is usually\
    \ for HTTP and for a mail server, ports `25` and `587` for SMTP. With this knowledge,\
    \ the attacker can decide if he chooses this server as the target, and adapt his\
    \ attack to the existing applications.\n\n### OS Fingerprinting\nWith OS fingerprinting,\
    \ TCP/IP packets with specific flags are sent to a destination and the answers\
    \ are analyzed, so that the operating system used can be concluded by comparing\
    \ them with a database. The database contains the responses from different operating\
    \ systems to these TCP/IP packets that were discovered experimentally. OS fingerprinting\
    \ leverages the TCP/IP stack signature—TCP/IP implementation that differs from\
    \ OS to OS. A system can respond to a series of requests by creating a \"fingerprint.\"\
    \ The request types used for fingerprinting can be broken down according to the\
    \ package types used:\n\n- **TCP Requests**: These requests use TCP packets. The\
    \ packages contain different flags and the reactions of the target system to these\
    \ flags are analyzed.\n- **FIN sample**: A packet with a set `FIN` flag is sent\
    \ to an open port. The correct answer would be not to respond, but many implementations\
    \ send an `RST` back. FIN Probe is similar to TCP FIN Scan but assumes that only\
    \ closed ports return an `RST`. So the FIN sample only provides information about\
    \ an implementation if it is safe to say that the requested port is open due to\
    \ another scan.\n- **TCP ISN Sampling**: Here the initial sequence number of the\
    \ TCP implementation is tried to determine a binding request. Depending on the\
    \ operating system, different methods will be used. Older Unix systems increase\
    \ in 64k increments, newer ones increase randomly, Linux systems choose random\
    \ numbers, and Microsoft uses a time-dependent method in which the ISN increments\
    \ by a fixed amount in each unit of time.\n- **TCP Timestamp**: Here, the value\
    \ of the TCP timestamp option, a field with the current time of the sender, is\
    \ examined. Some implementations do not support the option, while others increase\
    \ the value at fixed time.\n- **TCP Options**: Here, certain options are used\
    \ in the sent packages. Depending on whether these are included in the answer,\
    \ you can see which options are supported.\n- **TCP Initial Window**: TCP Initial\
    \ Window checks the window size of returned packets.\n- **ACK Value**: The `ACK`\
    \ flag is set in response to a `FIN/URG/PSH` and the acknowledgment number field\
    \ contains a different number depending on implementation. Most systems increase\
    \ the Initial Sequence Number (ISN) of the received packet by 1.\n"
