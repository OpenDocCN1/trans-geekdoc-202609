    # Chapter 12 – Honeypots


    This work is about the concept of honeypots. In the process, I will first discuss
    what honeypots are about and try to find an appropriate definition. Afterward,
    I will explain which services Honeypots can provide and which not. In this context,
    the first distinction among the different types of honeypots is introduced. Then
    I explained how their development went on. The third section will then deal with
    the classification of honeypots into classes and the characteristics of each class.
    After that, I will highlight the pros and cons of using honeypots and then describe
    some examples of honeypots in more detail.


    When the Internet was put into operation for the first time around 1970, one had
    no idea what development it would take. But with the introduction of the Internet,
    people have been able to find unexpected possibilities. Today, life without the
    Internet is unimaginable. You can communicate with people from all over the world,
    exchange data, and much more. Due to the enormous growth of the Internet, new
    technologies are being tried and developed over and over again to expand the application
    spectrum of this medium. In the meantime, the simple communication medium internet
    has become a platform on which both private and business networks are developing.
    Nowadays, in addition to private communication such as in chat rooms or via email,
    business transactions such as bank transfers or online orders, as well as proper
    online registration and deregistration are made possible.


    But the Internet also carries many dangers. The gigantic growth is accompanied
    by an ever-increasing number of attacks on the huge data streams on the Internet.
    Therefore, the need for data protection has grown significantly. Here a real race
    between the attackers and the security experts of the Internet has developed.
    The attackers are always trying to find new ways and means to access important
    data, which security experts counteract with the development of protective mechanisms.
    Nevertheless, there are always new approaches, and therefore, it is enormously
    important to research new safety technologies in the future as well. An important
    aid here is honeypots. That is why I will deal with these in the following.


    ## What Are Honeypots? – Definition of a Honeypot


    Before the properties of the honeypots are explained in the following sections,
    first of all, a suitable definition of a honeypot has to be found in order to
    know exactly what honeypots are and what they can do. Systemically, honeypots
    are systems that act as bait for attackers. Within the network, they do not provide
    meaningful services and are therefore not addressed directly from within the system,
    so any attempt to contact them will result in an attacker not knowing the system
    configuration.


    The search for a clear definition is not easy, because there are a lot of them.
    The reason why there are so many different definitions is that honeypots can be
    applied to many different types of Internet applications. Unlike many other security
    techniques on the Internet, they are not geared to a particular problem but try
    to cover the widest possible range of bandwidth. For example, a firewall is designed
    to prevent attackers from accessing a system. In contrast, honeypots try to detect
    not only unauthorized system access but also Trojans, worms, and other attacks.
    In doing so, a honeypot only collects relevant data that is directly related to
    the attack on the computer and evaluates it if necessary. Thus, a honeypot deals
    with relatively few but highly relevant data in terms of attack and its methodology,
    while other programs such as firewalls and antivirus programs are dealing with
    a huge flood of data as they continuously control the entire data stream to match
    it with known patterns or to monitor the access permissions of all programs to
    the system resources.


    A good and, in my opinion, very good definition can be found in the book "Honeypots
    Tracking Hackers" by Lance Spitzner. There, a honeypot is defined as follows:
    A honeypot is a security resource whose value is to be attacked or compromised
    And this is precisely the difference between honeypots and other security techniques.
    One wants to have an attack on a honeypot to learn something new about the attack
    and the attacker himself.


    ## Number of Possible Uses of Honeypots


    For example, they can detect and analyze a worm attack, or they can recognize
    and point out unauthorized system access at an early stage. As different as the
    possible uses of an application are so different are the honeypots themselves.
    You can roughly differentiate between two types of honeypots. There are production
    and research honeypots.


    **Production honeypots** are mainly used in companies and in the private sector.
    With this honeypot type, attacks can usually only be determined. However, this
    also has the advantage that these honeypots are much easier to handle.


    **Research honeypots**, as the name implies, are used for research purposes. With
    honeypots of this type, attacks are not only detected, but also much information
    about the attack and its attacker is collected and evaluated. This is to gain
    new insights into the methods and tools of attackers. These are then used to develop
    new security techniques to protect systems in the future better. Honeypots are
    much more complex and difficult to use than the production honeypots.


    In addition to the type distinction of honeypots, one can classify all honeypots.
    There are a total of three different classes, low-, medium-, and high-interaction
    honeypots. Classification takes place depending on how many interaction possibilities
    an attacker has with a honeypot. A more detailed explanation of each class will
    be given in a later section.


    ## History of Honeypots


    After the definition and first introduction to honeypots, it will now be time
    to take a look at the genesis. The idea of a honeypot is already a bit longer.
    However, the concept of honeypots was not yet known under its current name. Only
    recently has the concept of honeypots really prevailed.


    In 1990, two different publications were made on this topic. The first was a book
    by Clifford Stoll entitled "The Cuckoo''s Egg." Clifford Stoll was working with
    computer systems at that time and found that an attacker had resorted to the data
    of this system. But instead of suppressing this, he decided to let the attacker
    go on and observe him. This gave him the opportunity to gather much information
    about him. The system on which Stoll watched was not yet a honeypot in the current
    sense. It was instead a real system with sensitive data. However, with this book,
    the first approaches and ideas of today''s honeypots are well recognized.


    The second release came from Bill Cheswick. This was a paper titled "An Evening
    with a Cracker Which Is Lured, Endured, and Studied." which describes a system
    specially designed to be attacked. Stoll''s book also describes how an attacker
    tried to access his system and what he could learn from it. The next most important
    date in the history of honeypots is the year 1997. That year saw the release of
    the first Deception Toolkit (`DTK`) and was written by Fred Cohen. The program
    for operating a honey-pot was primarily intended to collect information about
    attackers'' activities and to confuse them. In the following year, as an extension
    to `DTK`, another honeypot product called `CyberCop` was developed. When used,
    `CyberCop` offered the user two important features. The first was that the program
    did not run on Unix but on Windows. The second and much more important was that
    `CyberCop` could run many systems of various kinds. For example, it was possible
    to replicate Solaris and NT at the same time. This greatly increased the chance
    of attack. Despite all the benefits and ease of use of this product, it has never
    really successful in the marketplace.


    In 1998, a program called `NetFacade` was developed by Marty Roesch. It was able
    to simulate up seven different types of applications, allowing for many systems.
    Although the program was not well known, it had a lot of benefits for the development
    of honeypots. `BackFence` was developed in the same year. This program, which
    will be further elaborated in a later section, was simple to use and, despite
    its limited functionality, allowed a wide audience to truly deal with the honeypot
    concept for the first time. `Honey` was free of charge and very easy to install.
    This allowed it to be downloaded and applied without much knowledge.


    In 1999, finally, the Honeynet Project was founded. The team of this project,
    which consisted of volunteer security experts, focused on the use of honeynets.
    These too will be explained in a later section. Due to the rapid increase in attacks
    by worms since 2000, Honeypots have been used more and more, thanks to their good
    results, and have become increasingly accepted as a tool in the fight against
    attacks on the Internet.


    ## Classification of Honeypots


    In connection with the definition of a honeypot, the two types of honeypots have
    already been briefly introduced. These two types were the production and research
    honeypots. Above all, production honeypots are used to detect and indicate seizures
    so that, if necessary, they can be counteracted with the appropriate security
    techniques. Research honeypots, on the other hand, are not only used to detect
    attacks and counteract attacks but also to learn about the attackers and their
    methods. In addition, there are three more different categories in which honeypots
    can be classified. These are the low-interaction, the medium-interaction, and
    the high-interaction honeypots. The classification of the honeypots depends, as
    the name suggests, on the intensity of the interaction that can be done with a
    honeyp. By the classification of Honeypots, one also has the possibility to compare
    them among themselves. The comparison option also helps in deciding which type
    of honeypot to choose. However, one has to be clear about what to do with the
    honeypot. For example, if you want to detect and monitor only unauthorized over-grips
    on a system, then a honeypot with a low interaction is sufficient. On the other
    hand, if one wants to know something about the methods of the attackers, one has
    to decide on a complex honeypot with high interactivity. However, when selecting
    the honeypot, it should be noted that the more opportunities for interaction with
    a honeypot, the greater the security risk. The different expressions and properties
    of the honeypot classes are described in more detail in the following sections.


    ### Low Interaction Honeypots


    Low-interaction honeypots are characterized by having a more restricted functionality.
    As a result, they also have the advantage of ease of use. For example, a honeypot
    of this class can be used to determine when a seizure occurred. In addition, one
    can determine the IP address and the port of the attacker and the target of the
    attack. However, low-interaction honeypots do not offer much more functionality.
    Therefore, the information one obtains about the attack and the attacker is rather
    small. Due to this "simplicity," the honeypots of this class are easy to install
    and above all, very easy to use. The user interface is usually over-the-top and
    easy to understand. Of course, the limited functionality of these honeypots also
    greatly restricts the interaction that a potential attacker may have with the
    system. This has the advantage that the security risk is very low since the attacker
    is given no opportunity to attack and take over important systems. The low-interaction
    honeypots are mainly used in private use.


    ### Medium Interaction Honeypots


