    # 第 4 章 – Web 攻击、XSS 与 SQL 注入


    在过去的十年里，万维网迅速扩张，并且至今仍在演变。传统系统正在被动态的、可浏览的应用程序取代，这些程序托管在 Web 服务器上并访问巨大的数据库。宽带网络的持续实施为多媒体增强铺平了道路。而如今无线技术的剧烈演变为
    WWW 提供了到达任何地方的机会。毫无疑问，万维网的优势在于克服了空间时间的限制。今天，我们可以舒适地坐在家里订购一台刚刚在日本生产的新手机，通过网络订购，或者点击一下就远程申请南美的一份工作。


    在商业领域，Web 被利用得越来越频繁，因为它让接触客户和机会变得更加容易。银行服务现在已经在线。购物在网上进行，通过信用卡进行快速方便的支付。越来越多的电子商务公司应运而生。但对于任何在线的
    Web 应用程序以及任何运行在服务器群上的电子商务，拥有适当攻击技术的恶意黑客也无处不在。当人们正在适应新技术并构建网络、使带有防火墙的 Web 服务器和防御系统更加安全时，攻击者也变得更加聪明，他们可以破解这些系统和防火墙。Web
    技术的快速增长也留下了许多安全漏洞。正如我们之前提到的，本书介绍了广为人知的 Web 应用程序攻击技术，并展示了规避方法。首先，让我们概述一下 Web 应用程序架构。


    ## Web 应用程序架构


    传统的 HTML 页面是静态的，也就是说，它们最终会被生成，并通过页面的 `URL` 以这种形式存在于 Web 服务器上。当然，动态生成 HTML 页面也是理想的，例如为了影响调用者的近期页面数据。动态
    页面是由 Web 应用程序在运行时生成的。


    Web 应用程序通常分为客户端 Web 应用程序和服务器 Web 应用程序。


    **客户端 Web 应用程序**运行在客户端机器上。此类应用程序的已知技术有 `JavaScript`、`VBScript`、`Flash``Applet`。


    **服务端 Web 应用程序**在服务器上执行，通常用于动态生成数据（例如从数据库）。服务端 Web 应用程序的已知技术有 `Common Gateway
    Interface (CGI)`、`Server APIs` 以及 `ASP`、`PHP`、`JSP` 等脚本语言。


    一个常见的动态 Web 系统由 4 个组件组成：

    1. Web 客户端（通常是浏览器）

    2. 前端 Web 服务器

    3. 服务端应用程序

    4. 服务端数据库


    前端 Web 服务器充当与外部交互的接口，通过 `HTML` 表单和 `HTTP` 获取 Web 客户端的输入，并以 `HTML` 页面的形式返回应用程序生成的输出。服务端应用程序与数据库配合执行事务。Web
    系统的每个组件都有特定的漏洞。


    以下是针对每个组件的基本攻击类型简述：

    - **Web 客户端**：执行活动内容、客户端软件漏洞利用、跨站脚本 (`XSS`)。

    - **Web 服务器**：服务器软件安全漏洞利用。

    - **Web 应用程序**：针对身份验证、授权、输入验证的攻击。

    - **数据库**：通过数据库查询执行特权命令、操纵查询 (`SQL Injection`) 以获取过多记录。


    在这些中，`XSS` 和 `SQL Injection` 被选为基于 Web 工具。


    ## XSS


    跨站脚本 (`XSS`)


    跨站脚本 (`XSS`) 利用 Web 应用程序中的漏洞，允许攻击者将恶意脚本注入到其他用户查看的网页中。测试 `XSS` 的简单方法是输入以下内容：

    ```html

    <script>alert(document.cookie)</script>

    ```

    根据位置（客户端或服务端）和持续时间（永久或非永久），跨站脚本攻击分为几种类型。


    ### 类型 0

    在 `XSS` 中，恶意脚本被嵌入在 URL 中。例如，这可能是一个这样的链接：

    `http://www.example.com/search.cgi?query=<script>alert(document.cookie)</script>`


    场景：

    1. Alice 经常访问包含 `XSS` 安全漏洞的 A 网站。

    2. Alice 点击链接。

    3. 恶意脚本在 Alice 的计算机上打开一个 HTML 页面。

    4. 该 HTML 页面在 Alice 的计算机上以其权限身份执行。


    ### 类型 1

    在这种类型中，被操纵的脚本位于服务端且不是永久的。后续执行脚本没有问题。例如，服务器上的搜索功能在获取搜索词作为输入时未进行过滤，并输出如下内容：

    你搜索的：“search term”是 `<script>alert(document.cookie)</script>`


    场景：

    1. Tom 创建了一了一个被操纵的 A 站 URL 并发送给 Alice。

    2. Alice 访问了该操纵后的 URL。

    3. URL 中嵌入的脚本将在 Alice 的浏览器中执行，就像直接来自 Web 页面 一样。


    ### 类型 2

    在 `XSS` 类型 2 中，被操纵的脚本代码被永久写入网页。这是最危险的形式，因为它影响许多用户。这种类型 2 的工作方式与类型 1 类似，只是输出持久地留在页面上。


    示例：

    1. 再次包含 `XSS` 安全漏洞的 A 网站允许用户发布新闻或其他内容。

    2. Tom 在该网站上发布了一条消息：

    “一个非常好的网站！<script>alert(document.cookie)</script>”

    3. 当用户查看新闻时，脚本代码在用户机器上运行，因此可以在 Tom 不知情的情况下窃取 cookie 等其他内容。


