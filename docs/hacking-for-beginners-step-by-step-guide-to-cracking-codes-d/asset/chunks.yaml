    # Chapter 10 – Spam, Phishing: Countermeasures


    Countermeasures can be subdivided into actions that work within the existing system
    and actions that try to remedy the weaknesses of the email system. In order to
    avoid interference with the desired email traffic, it makes sense to use the listed
    procedures with whitelists of regular communication partners to exclude messages
    from them. The pre-set methods are often used on the email server, but some can
    also be implemented in the email clients.


    ## Treatment of Spam

    Many of the following methods attempt to distinguish spam messages from legitimate
    emails. This section explains how to handle spam-classified messages.


    ### Reject

    The disadvantage of rejecting messages classified as spam is that they do not
    burden the email system and the end-user. The downside is that misclassified messages
    do not reach the recipient. There are two ways to do this:


    *   **Accepting the message and later bugging and creating a bounce message**:
    The advantage is that it is technically easier to first accept the message and
    then later spam classification. However, because the bounce messages are sent
    to the, in most cases, fake, sender addresses, this method leads to massive loading
    of the uninvolved and is therefore unsuitable.

    *   **Rejecting the message during the SMTP dialog (see Listing 2)**: This method
    requires spam checking during transmission by the broadcaster and is therefore
    technically more demanding. Direct rejection can also cause the email address
    to be removed from the list of spammers, as they obviously cannot be delivered
    to them. If it is a legitimate message, the sender learns of the problem that
    sending `MTA` that was refused acceptance generates a bounce message.


    ### Delete

    Silently deleting messages has the same benefit as rejecting messages. However,
    if it is a legitimate message, the sender must assume that the message has been
    successfully delivered while the recipient never receives it. That''s why quietly
    dropping messages in practice does not make sense, especially since, in addition
    to the technically simpler implementation, it offers no advantages over rejecting
    the `SMTP time`.


    ### Mark

    The most common approach is to mark the message in question and move it to its
    own spam folder so that the recipient can check the classification and then delete
    the messages. This has the advantage that misclassified messages still arrive
    at the receiver. In practice, however, the problem arises that a lot of spam messages
    are received and the user often empties the spam folder without looking through
    the messages. Then the effect is the same as silent deletion, i.e., worse than
    rejecting messages.


    Often several procedures are combined. Thus, in a classification method that has
    little false-positives, messages can be rejected directly and only flagged in
    less-explicit methods. This combines the advantages of both approaches.


    ## Measures within the System

    This section introduces some anti-spam measures that can be used within the existing
    email system.


    ### Blacklists

    Blacklists are scanned or queried upon receipt of a message for the IP address
    of the sender. The most common types are blacklists from servers that have sent
    spam in the past, often open relays. There are also blacklists of servers that
    violate the `SMTP` standard and lists of dial-up addresses. Blacklists of spam-sending
    servers are commonly used to reject messages from these servers directly. This,
    in turn, puts pressure on server operators to control the delivery of messages
    through their servers. The use of blacklists is very effective and generally has
    a low false-positive rate. However, there are always traps in which blacklist
    operators overshoot targets. Thus since August 05, all `.de` domains are listed
    in the list of the operator `RFC-Ignorant.org`. Entries to these blacklists can
    be made either manually or automatically, for example through honeypots.


    ### Greylisting

    Greylisting is a weak form of blacklisting. An email is rejected by a previously
    unknown sender at the first delivery attempt and cached in the greylist, but accepted
    in a second later attempt and the sender is saved as known. The method is based
    on the `SMTP` standard to re-deliver an email at ever-increasing intervals when
    the destination host reports a temporary error. Sending spam messages often saves
    this second attempt. The price is a late delivery of the first news of a new communication
    partner, but the process is very effective. On its own servers, the author has
    observed that less than 1/3 of the news on the greylist was delivered again. Usually,
    the process is combined with a whitelist of email servers from large providers
    who do not adhere to the `SMTP` standard or use changing servers in the delivery
    attempts.


    ### Hashlists

    In addition to blacklists, there are also lists that store hashes of spam messages
    themselves. For a large mass of subscribers submitting spam messages, "new" spam
    messages are delivered promptly and can be treated appropriately by email servers
    requesting this list. An example is the "distributed checksum clearinghouse" (`DCC`,
    `[Soft]`).


    ### Spam filter

    Spam filters classify messages based on their content, often using a combination
    of rating criteria:


    *   Frequently, a fixed set of rules is used that contains weighted labels that
    often appear in spam messages, such as excessive use of capital letters, a high
    ratio of images to text, or disguised names of potential enhancers. By combining
    a great many rules, the recognition rate is quite good, but the rules must always
    be kept up to date since spam senders deliberately protect their messages against
    detection by the well-known spam filters.

    *   Learning methods, such as `Bayesian Filter [AKCP + 00]`, are based on user
    feedback. In doing so, the user transfers incorrectly classified messages - both
    false positive (ham) and unrecognized spam - back to the filter, which gradually
    adapts itself. Bayesian ratings can be stored either in a general or personal
    database. The great advantage of this method is that, unlike fixed rules, it adapts
    to the individual.


    Thus, in a classification method that has little false-positives, messages can
    be rejected directly and only flagged in less-explicit methods. This combines
    the advantages of both approaches. On its own servers, the author has observed
    that less than 1/3 of the news on the greylist was delivered again. Usually, the
    process is combined with a whitelist of email servers from large providers who
    do not adhere to the `SMTP` standard or use changing servers in the delivery attempts.


    Virus Scanner

    Spam filters classify messages based on their content, often using a combination
    of rating criteria: ... [content omitted for brevity as per core logic] ... scanners
    detect viruses contained in messages. Given a legitimate message, the detection
    rate is high, and the false-positive rate is low.


    ### System Improvement

    The following anti-spam measures try to fix the problems.


    #### Via Dial-Up Addresses

    Shipments through dial-up can be compromised.


    #### Sender

    In order to prevent arbitrary sender and thus to ensure the authenticity of the
    sender, several methods have been developed. The Sender Policy Framework (`SPF`)
    specifies which hosts can send.


    ```

    Listing 4: Example of an entry somehost.net IN TXT "v=spf 1 -all"

    ```


    The `SPF` method allows the publicizing of a policy, whether a domain must be
    signed for all sent, and thus allows - the direct rejection of messages that violate
    this. In addition, the signature of the message can ensure that it has not been
    changed. The process is already being used by Gmail, Yahoo, and some others. Similar
    methods are Sender ID and DomainKeys, the forerunner of DKIM.


    The `DKIM` method uses public-key cryptography. The message, including header,
    is signed with a private key and can be opened and verified with a public key.
    The public key is usually provided via a DNS record.


    ```

    Listing 5: Example of a DKIM signature in the email header

    DKIM-Signature: a=rsa-sha1; q=dns; d=example.com; i=user@eng.example.com; s=jun2005.tight;
    c=relaxed/simple; t=1117574938; x=111806938; h=from:to:subject:date; b=dzdVyOfAKCdLXdJOc9G2q8LoXSlEniSavyyuU4zGeeruD00lszZVoG4ZHRNiYzR

    ```


    #### Delivery Charges

    There are ideas to solve the problem of cheap email delivery. The sale should
    become more expensive either through the payment of very small amounts or the
    solving of arithmetic tasks.

