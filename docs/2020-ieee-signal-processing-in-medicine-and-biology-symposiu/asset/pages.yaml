    While the amplitude-based physical analysis was demonstrated in the hydrogel-based
    pH sensing, acoustic features can be extracted from the received signals. Thus,
    for speech recognition, we envision our model will extract frequency, phase, energy,
    and entropy features, as shown in the block diagram [1]. The first training dataset
    will be segmented by small moving frames. Each segment will be sequentially analyzed
    by a Fast Fourier transformation. Then, phase and power spectrum can be extracted
    from the processed signal. Notably, we will further process these features and
    compute a more localized view, such as its entropy and amplitude spectrum, as
    entropy and its ratio; and crest frequency, continuity, and duration [7]. Once
    all the features are extracted, we can implement machine learning algorithms such
    as linear regression, support vector machine, or random forest on the training
    dataset values. In the future, more complex and advanced models such as a convolutional
    neural network (CNN), deep neural networks will be employed to enhance accuracy
    performance [8]. The size of the training dataset can be determined by the validation
    accuracy after the training and evaluation of the ML model. Typically, pH measurements
    have measurement error within 0.1 to 0.1 pH, depending on the quality of the device
    and the measurement procedure. Therefore, we plan to provide training data for
    which the accuracy will be on with parameters. After training, the machine learning
    model will be tested using ultrasonic waves (e.g., unknown pH). The hydrogel can
    be adapted for different pH ranges, for example, pH 3.5, 7.5 to 8 and lower (e.g.,
    pH of 2 in the stomach) or higher (e.g. pH of 7.0-8.5 in the intestine) depending
    on the region in the body [10]. We will result be compared with capability using
    different performance indicators, such as mean absolute error (MAE), mean square
    error (MSE), Pearson correlation coefficient (Pearson''s R), and coefficient of
    determination (R).


    In summary, we reported a new wireless sensing technique using smart hydrogel
    material. We analyzed the proposed sensing scheme using a traditional method,
    acknowledge the need for machine learning to reveal features that could be hidden
    within the ultrasonic waves.


