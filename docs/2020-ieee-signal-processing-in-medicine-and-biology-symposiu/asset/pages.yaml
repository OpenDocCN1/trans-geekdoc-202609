  md: '# # Ultrasound-Mediated Chemical Sensing Using Titanium Dioxide (TiO2) Nanoparticles-Embedded
    Hydrogel with Possibilities of Performance Enhancement Using Machine Learning


    S. Islam, Mark, R. Campbell and A. Kim


    Department of Computer and Engineering, Temple University, Philadelphia, Pennsylvania,
    USA (sayamoun, mark, recbecca, albertkim)@temple.edu


    # I. Introduction


    +   - In-situ chemical sensing, such as temperature, pH, or a specific molecule,
    is important in environmental and healthcare monitoring.

    - The principle of chemical sensing usually involves receptor, transducer, and
    complex readout circuit.

    - The receiver is usually consumable, and the transducer requires frequent calibration
    due to the accumulation of chemical species.

    - We propose ultrasonic sensing mechanism that minimizes unwanted shortcomings
    (Figure 1).

    - Non-consumable hydrogel with titanium dioxide

    - Ultrasound reads the volume change; thus, nowadays is not necessary.


    ![](img/cb7ec08c19c0ac96725c21dd279fe864_3_0.png)


    # II. Experiment Setup


    +   - Different pH solutions (pH = 3, 4.4, 5, 6, 7, 7.4) were prepared in water
    tank (Figure 3).

    - TiO2-nanoparticle embedded hydrogel were soaked for 40 minutes to ensure baseline
    for each pH level.

    - A 6 mm x 1 mm piezoelectric transducer (PZT-5) was used as an ultrasonic transducer.

    - A fiber-optic hydro (FOH64, Precision Acoustic) was placed on the other side
    to capture the ultrasonic waves.

    - A short burst wave (10 pulse at 7.0 MHz with 1 kHz frequency) was transmitted
    through the hydrogel.


    ![](img/cb7ec08c19c0ac96725c21dd279fe864_3_1.png)


    # VI. Results


    # I. Swelling Test Results


    ![](img/cb7ec08c19c0ac96725c21dd279fe864_3_2.png)


    +   - For 0, 2, and 5 wt% TiO2, loaded hydrogel:

    - Swelling ratio: 0.84, 0.81, 0.76 mm/mm

    - Max swelling ratio: 2.3, 2.07, and 1.74 mm/mm

    - Maximum swelling ratio was 11.39% for 2.5 wt% and by 26% for 5 wt% TiO2 loaded
    hydrogel.


    # II. Ultrasonic Test Results


    ![](img/cb7ec08c19c0ac96725c21dd279fe864_3_3.png)


    +   - Improved linearity in pH sensing (R'' = 0.72 for 0 wt% and R'' = 0.95 for
    both 2.5, 5 wt% TiO2 loaded hydrogel).

    - Rate of change in acoustic intensities of 150 mV/cm² for 2.5 wt., and 188 mV/cm²
    for 5 wt% TiO2, loaded hydrogel.


    # II. Methodology


    +   - Sensing elements: An ultrasonic transducer, TiO2-embedded hydrogel, an ultrasonic
    receiver.

    - Sensing mechanism: Hydrogel swells at high frequencies at low pH. By transmitting
    ultrasonic waves through the hydrogel, the temporal and spectral scale change.

    - Data processing: Ultrasonic waves are captured and analyzed to extract the pH
    information of the method.


    # III. Data Processing


    +   - We investigated the acoustic intensity in of amplitude change.

    - Features such as peak-peak, peak-spectrum, entropy, FFT, and power spectrum,
    can be used to train machine learning algorithms for machine learning integration
    (Figure 4).


    ![](img/cb7ec08c19c0ac96725c21dd279fe864_3_4.png)


    # IV. Fabrication


    ![](img/cb7ec08c19c0ac96725c21dd279fe864_3_5.png)


    # VII. Conclusion


    +   - A new chemical sensing method based on smart hydrogel.

    - The sensor is non-consumable and does not require calibration due to the reversible
    swelling of hydrogel and the use of ultrasonic receiver.

    - Preliminary dataset was obtained for machine learning enabled sensing for more
    accurate and robust monitoring


    # VIII. Acknowledgments'
