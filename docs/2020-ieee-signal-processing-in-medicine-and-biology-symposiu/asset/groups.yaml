    # Ultrasound-Mediated Chemical Sensing Using Titanium Diode (TiO₂) Nanoparticles-Embedded
    Hydrogel with Possibilities of Performance Enhancement Using Machine Learning


    S. Islam, M. Park, R. Campbell and A. Kim

    [sayemul, moonpark, rebecca, albertkim]@email.com


    **Introduction:** In chemical sensing, such as temperature, pH, or a specific
    molecule, is important in healthcare and environmental monitoring [1]. The principle
    of chemical sensing usually involves multiple elements, including receptor, transducer,
    and a complex readout. The receptor selectively detects chemical information,
    which is then translated into electrical signals by the transducer. However, the
    receptor is usually consumable, and the transducer requires frequent calibration
    due to the accumulation of chemical species (e.g., protein, biofilm). Recently,
    hydrogel-based sensing mechanisms based on the incorporation of micro/nanoparticles
    onto the polymeric network of hydrogels have been reported [2]. For instance,
    Holt et al. demonstrated crystalline particles within the polymeric hydrogel allowed
    the change of color in response to glucose [3]. Another effort by our group was
    embedding silica beads in a pH-sensitive hydrogel, which can be interrogated by
    ultrasonic imaging [4].


    In this paper, we present a new wireless pH sensing technique using the ultrasound
    through titanium dioxide (TiO₂) nanoparticle-embedded hydrogels. Fig. 1 illustrates
    the principle of the proposed chemical sensing system. The sensing system consists
    of an ultrasonic transmitter/receiver pair and TiO-embedded hydrogel that is implanted
    under the skin (or any other body that requires pH monitoring). Filling hydrogel
    with TiO₂ nanoparticles enhances the ultrasonic wave scattering, which eliminates
    the readouts, such as the ultrasonic imaging system. Its physical behavior is
    depending on the thickness of the hydrogel. The transmitted signals are collected,
    with design of feature extraction for machine learning implementation. We seek
    to interpret pH information from ultrasonic waves with minimal effects to reduce
    friction and noise using this method. Regardless of having many scopes, machine
    learning enabled direct pH measurement schemes were not reported in the present.
    The current state of the art sensors (with accuracy errors within 0.1 to 0.01
    pH, therefore, our aim in this is to achieve even lower error rate using machine
    learning.


    Method: In order to verify the effectiveness of the concept, we prepared a hydrogel
    that absorbs water molecules depending on pH levels of the media; we tested it
    at high pH and shrunken at low pH [5]. We created a disc-shaped hydrogel, whose
    size was 20 mm in diameter and 3 mm in thickness. During hydrogel synthesis, TiO₂
    nanoparticles (21 mm, Sigma-Aldrich) were mixed into the polymer solution. The
    prepared hydrogel was tested in media at different pH levels (pH = 3, 4.4, 5.7,
    6.2, 7.4). For a composite sample (swelling or shrinking), the hydrogel change
    in size for each pH level for at least 15 minutes is taken. We designed an experimental
    setup. We used a piezoelectric transducer (36 × 36 × 1 mm; PZT-5H, Piezo Inc.)
    to apply ultrasonic waves into the medium. The prepared hydrogel was placed approximately
    6 cm away from the ultrasonic transmitter. A short burst (10 pulses at 7.0 MHz)
    was delivered to the hydrogel embedded at


    ![](img/cb7ec08c19c0ac96725c21dd279fe864_0_0.png)


    ![](img/cb7ec08c19c0ac96725c21dd279fe864_0_1.png)'
  - '[PAGE 1]


    S. Islam et al.; Ultrasound-Mediated Chemical Sensing using Titanium Dioxide (TiO2)
    Nanoparticles-Embedded Hydrogels with Possibilities of Performance Enhancement
    Using Imaging Page 2 of 3


    MHz with 1 kHz frequency was transmitted through the body to reach the TiO2-hydrogel.
    A fiber-optic hydrophone (FOH64) was used as an ultrasonic receiver. It captured
    the ultrasonic wave at 10 cm from the ultrasonic transducer (or 4 cm from the
    hydrogel). The data acquisition was done using an oscilloscope (MSO3024T, Keysight)
    connected to the hydrophone. The signal was captured for an average of 4.6 µs
    duration at a 5 GHz sampling rate.


    # Results and Discussion: The results presented in this paper were collected and
    structured for a future machine learning interrogation. The received ultrasonic
    wave was a one-dimensional discrete-time signal that had a different characteristic
    depending on the thickness of the transmitted and received wave (shown in Fig.
    3a and Fig. 3b). The received signal showed a rising then falling trend in its
    amplitude. A minimum of 10 input burst pulses was required to reduce the characteristic
    ultrasonic waves to the change in hydrogel thickness in the environmental pH.
    More than 10 pulses was not required as it would induce repetitive waveforms which
    do not carry any significance in terms of amplitude or frequency change. After
    8 pulses, the ultrasonic waves gradually decayed until the supply energy was consumed.
    The received signal could be segmented visually indicating more information than
    the change in amplitude. The change in frequency was analyzed during the feature
    extraction of the machine learning process; however, they are not visually obvious
    and can be detected using a precision measurement method (as an oscilloscope).


    ![](img/cb7ec08c19c0ac96725c21dd279fe864_1_0.png)


    For comparison purposes, we used three concentrations of TiO2 (0, 2.5, and 5 wt%)
    in the experiment. The changes in ultrasonic waves due to these hydrogels in different
    pH levels were characterized. First, the volume of transmission to the TiO; embedded
    hydrogel was characterized; Fig. 3(c) shows the pictures of swelled hydrogels
    at different pH. The maximum swelling ratio of hydrogel was 2.3, 2.1, and 1 for
    0, 2.5, and 5 wt% TiO2 concentration, respectively. Filling the TiO nanoparticles
    impeded the hydrogel interrogation in terms of sensing linearity and higher sensitivity,
    as shown in Fig. 3d). Due to the characteristic impedance of the hydrogel (1.5
    Mrays) and water (1.8 Mrays), there were not sufficient reflections, except at
    the boundary where random reflections occurred. This led to unexpected responses
    when the pristine hydrogel (TiO) was in the path of the ultrasonic waves. When
    TiO nanoparticles were loaded in the hydrogel; the overall acoustic impedance
    became 6.61 Mrays (@ 5 wt%, pH =7), which could reflect ultrasonic waves unless
    the transmission intensity as the hydrogel shrinks or expands (R² = 0.94). The
    rates of changes in ultrasonic intensities were 1.38, 1.50, and 1.8 mW/cm²pH for
    0, 2.5, and 5 wt% of TiO2 in the hydrogel, respectively (Fig. 3(e)).


    ![](img/cb7ec08c19c0ac96725c21dd279fe864_1_1.png)


    IEEE SPMSE 2020


