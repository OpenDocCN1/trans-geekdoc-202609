    # 基于二氧化钛 (TiO₂)纳米颗粒嵌入水凝胶的声波介导化学传感及利用机器学习增强性能的可能性


    S. Islam, M. Park, R. Campbell 和 A. Kim

    [sayemul, moonpark, rebecca, albertkim]@email.com


    **引言：** 在化学传感中，温度、pH 或特定分子检测对于医疗保健和环境监测至关重要 [1]。化学传感的原理通常涉及多个元素，包括受体、换能器和复杂的读取单元。受体选择性地检测化学信息，然后由换能器转换为电信号。然而，受体通常是消耗性的，而且由于化学物种（如蛋白质、生物膜）的累积，换能器需要频繁校准。最近，已有研究报道了基于将微/纳米颗粒整合到水凝胶聚合物网络中的水凝胶基传感机制
    [2]。例如，Holt 等人证明了聚合物水凝胶内的晶体颗粒能够对葡萄糖的变化颜色响应 [3]。我们小组的另一项工作是将硅胶珠嵌入 pH 敏感水凝胶中，可以通过声波成像进行检测
    [4]。


    在本文中，我们提出了一种利用通过二氧化钛 (TiO₂)纳米颗粒嵌入水凝胶的声波无线 pH 传感技术。图 1 展示了所提化学传感系统的原理。该传感系统由一对声波发射器/接收器和植入皮肤下（或任何需要监测
    pH 的身体部位）的 TiO 嵌入水凝胶组成。在水凝胶中填充 TiO₂ 纳米颗粒可以增强声波散射，从而消除如声波成像系统等读取误差。其物理行为取决于水凝胶的厚度。传输的信号被收集，并设计了用于机器学习实施的特征提取。我们寻求通过这种方法，在对摩擦和噪声影响最小化的情况下，从声波中解释
    pH 信息。尽管有许多领域，但目前尚未报道基于机器学习支持的直接 pH 测量方案。目前的先进传感器的精度误差在 0.1 到 0.01 pH 之间，因此，我们的目标是使用机器学习实现更低的误差率。


    方法：为了验证该概念的有效性，我们制备了一种能根据介质 pH 水平吸收水分子的水凝胶；我们测试了它在高 pH 下膨胀，在低 pH 下收缩 [5]。我们创建了一个圆盘水凝胶，直径为
    20 mm，厚度为 3 mm。在水凝胶合成过程中，将 TiO₂ 纳米颗粒（21 mm，Sigma-Aldrich）混合到聚合物溶液中。制备的水凝胶在不同 pH
    水值的介质（pH = 3, 4.4, 5.7, 6.2, 7.4）中进行了测试。对于复合样品（膨胀或收缩），记录水凝胶在每个 pH 水平下至少 15 分钟的尺寸变化。我们设计了一个实验装置。我们使用压电换能器（36
    × 36 × 1 mm；PZT-5H, Piezo Inc.）向介质发射声波。制备的水凝胶位于声波发射器约 6 cm 处。一个短脉冲（7.0 MHz 下的
    10 个脉冲）传输到嵌入在体体内的水凝胶中。频率为 1 kHz，通过身体到达 TiO2-水凝胶。使用光纤水听器（FOH64）作为声波接收器。它在距离声波换能器
    10 cm（或距离水凝胶 4 cm）处捕获声波。数据采集使用连接到水听器的数字示波器（MSO3024T, Keysight）完成。信号在 5 GHz 采样率下捕获，平均持续
    4.6 µs。


    结果与讨论：本文提出的结果已为未来的机器学习检测进行了收集和结构化处理。接收到的声波是一维离散时间信号，其特征取决于传输和接收波的厚度（如图 3a 和图 3b
    所示）。接收到的信号在振幅上出先上升后下降的趋势。至少需要 10 个输入脉冲才能将环境中的特征声波还原为水凝胶厚度的变化。不需要超过 10 个脉冲，因为这将引起在振幅或频率方面没有任何意义的重复波形。8
    个脉冲后，声波逐渐衰减直到能量被耗尽。接收到的信号可以进行视觉分割，表明其不仅是振幅的变化。在机器学习过程的特征提取期间分析了频率的变化；然而，它们在视觉上并不明显，但可以使用精密方法（如示波器）检测。


    为了比较目的，我们使用了三种浓度的 TiO₂（0%, 2.5%, 5%）嵌入水凝胶。制备的水凝胶在不同 pH 水平下进行了测试。对于复合样品，记录每个 pH
    水平下至少 15 分钟的水凝胶尺寸变化。我们设计了一个实验装置。我们使用压电换能器（36 × 36 × 1 mm；PZT-5H, Piezo Inc.）向介质发射声波。制备的水凝胶位于声波发射器约
    6 cm 处。

