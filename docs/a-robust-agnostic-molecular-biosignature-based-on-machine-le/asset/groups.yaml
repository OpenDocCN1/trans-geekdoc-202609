    ## Implications


    Prospects for Analyzing Samples of Uncertain Biogenicity. Our method can potentially
    be used to resolve the biogenicity of data already in hand. An important example
    is the 3.5 Ga Apex chert from the Pilbara Craton in Western Australia, whose purported
    biogenicity has evoked significant debate (50, 51). In addition, samples measured
    by the Pyr-GC-MS instruments on the Mars Viking lander and the Curiosity rover
    (34, 43, 52) deserve new evaluation. While our method must first be calibrated
    to the specific thermal ramping and maximum temperature conditions of those instruments,
    these and other machine-learning methods hold promise for the evaluation of the
    biogenicity of samples of extraterrestrial provenance before they are returned
    to Earth (53). Of special interest in this regard is the possible role of environmental
    chemicals, such as perchlorate on Mars (54), as well as radiation-altered molecular
    suites (55), which might significantly influence the properties of the resulting
    molecular mixtures.


    ### Rules of Biochemistry


    The identified systematic differences among the molecular distributions in abiotic
    and biotic samples suggest that biochemistry is intrinsically different from abiotic
    organic chemistry. Our working hypothesis is that biomolecules, unlike those in
    abiotic molecular suites (for example in a carbonaceous meteorite), are selected
    for function. That difference results in biomolecules that are more limited in
    number, and perhaps in some instances more complex in structure (30, 31), than
    organic molecules in abiotic suites. A deeper examination of the specific constellation
    of attributes identified in this study is a next step in testing this hypothesis.
    Despite the observation that taphonomic processes inevitably lead to loss of information
    (56–58), our method is able to distinguish ancient, geologically processed biotic
    samples from abiotic organics, while possibly providing a qualitative metric for
    degree of taphonomic degradation. In this regard, it is important to note that
    abiotic molecular systems are not intrinsically simple. For example, the suites
    of molecules extracted from the Murchison carbonaceous chondrite are remarkably
    complex in both their structural diversity and numerosity (59). There likely exist
    aspects of molecular complexity that differentiate living and nonliving systems,
    as explored by Cronin and coworkers (30, 31). However, the diagnostic high-dimensional
    differences between abiotic and biotic molecular distributions we document here
    do not lie in the complexity or diversity of individual analytes but rather in
    their relational properties.


    ### Our Proposed Biosignature is Agnostic


    An important finding of this study is that abiotic, living, and taphonomic suites
    of organic molecules display well-defined clusters in their high-dimensional space,
    as illustrated in Fig. 2. At the same time, large “volumes” of this attribute
    space are unpopulated by either abiotic suites or terrestrial life. This topology
    suggests the possibility that an alien biochemistry might be recognized by forming
    its own attribute cluster in a different region of Fig. 2—a cluster that reflects
    the essential role in selection for function in biotic systems, albeit with potentially
    very different suites of functional molecules. Abiotic systems tend to cluster
    in a very narrow region of this phase space, which could in principle allow for
    easy identification of anomalous signals that are dissimilar to abiotic geochemical
    systems or known terrestrial life.


    ## Methods


    ### Sample Characterization


    We assembled 134 carbon-bearing samples from varied abiotic and biotic, and sometimes
    ambiguous, sources. A list of these samples and their attributes is provided in
    SI Appendix, Table S1.


    ### Analytical Methods


    Pyr-GC-EI-MS analyses were performed with a CDS 1000 pyrolyzer (CDS Analytical,
    Inc., Oxford, PA) interfaced with a Hewlett-Packard 6890 series gas chromatograph
    interfaced with an Agilent 5972 quadrupole mass spectrometer. An Agilent 30 m
    5% phenylpolymethylsiloxane column was used for chromatographic separation. The
    GC oven temperature was programmed to hold at 50 °C for 1 min, then increase from
    50 °C to 300 °C at a rate of 5 °C min−1, and then to remain at 300 °C for 15 min.
    Helium (UHP 5.5 grade) was used as the carrier gas, operating in constant flow
    mode. Approximately 1 mg samples were loaded into preashed quartz tubes (precombusted
    under air at 550 °C for 3 h), which were then inserted into the platinum filament-coil
    of the pyrolyzer. Subsequently, the pyrolyzer was inserted into the helium-filled
    interface and flash pyrolyzed (ramp rate 500 °C s−1) to 610 °C and held for 10
    s. The pyrolsates were immediately swept onto the GC column by the He gas and
    analyzed. The source was operated in electron ionization (EI) mode with 70 eV
    ionization energy at 250 °C. The mass selective detector scan rate was 0.80 s/decade
    over a range of m/z 50 to 700, with an interscan delay of 0.20 s.


    In many Pyr-GC-EI-MS applications, the data output is compared to EI-MS libraries
    to identify specific molecular compounds. Available EI-MS libraries may comprehensively
    cover the compounds present in common terrestrial samples seeking to find “analytes
    of interest” (e.g., drugs, steroids, and pesticides). Estimates of organic isomerism,
    however, that predict the majority of possible stable low molecular weight organics
    are “yet unknown or unsynthesized compounds” (60, 61). Using our methodology,
    precise compound identification is useful but not necessary: Rather, relational
    aspects of chromatographic and mass peaks are of interest. This approach underscores
    this method’s utility for detecting alien biology, which also aligns with earlier
    concepts of relational biology (32, 62).


    We did not collect MS data for the first 2 min after injection to avoid overloading
    the detector with small volatiles such as CO2 and H2O. In addition, since many
    of the samples were curated independently and displayed signals from C16 (palmitic)
    and C18 (stearic fatty acids which are common components of fingerprints and “slip
    agents” added to plastic sample bags to keep them from sticking together, we excluded
    the regions of the chromatograms after the region where these common contaminants
    elute. Note, however, there is still a contribution to the examined chromatographic
    complexity from derivatives of such compounds (for example, straight and branched
    long-chain alkanes, alkenes, and rearranged aldehyde and ketone derivatives of
    these species that contribute to the precutoff region’s molecular complexity.
    We found that there was little signal beyond m/z 200; thus, the region considered
    in the computational methods was limited from 2 to 35 min and m/z 50 to 200. Each
    sample was reduced to a two-dimensional matrix with 489,240 elements representing
    signal intensities as a function of mass and retention time, although many of
    the intensity values were zero (Fig. 1).


    ### Machine-Learning Analysis


    We trained machine-learning models using three-dimensional chromatographic retention
    time/mass-to-charge ratio/intensity data from each sample. The data generated
    and analyzed in this manuscript can be found on the Open Science Framework repository
    titled “A robust molecular biosignature based on machine learning” (https://doi.org/10.17605/OSF.IO/EMBH8).
    The code for the paper can be found at https://github.com/ghystad/Machine-learning_and_preprocessing_Pyr_GSMS_data/tree/master.
    All data, code, and materials used in the analysis are available to any researcher
    for purposes of reproducing or extending the analysis. Licenses for the data and
    code usage and relevant attribution information will be updated on the respective
    repositories.


    Here, peak intensity was normalized on a scale from 0 to 1, while time and mass/charge
    were analyzed as collected in 3,240 scan time steps (with each scan representing
    3 s) and one m/z increments over the range from m/z 50 to 200, respectively. Our
    machine-learning strategy allows identification of diagnostic sets of attributes
    of retention time and m/z values that highlight differences between abiotic and
    biotic samples. Our nested CV methods overcome the concern of overfitting to the
    training data. We also plan to improve upon the generalization of our model in
    future work by focusing on Monte Carlo simulations, adding more samples to the
    training and test sets, and monitoring the change in test and training errors.


    ### Preprocessing


    The 134 analyzed samples included 59 of biotic origin and 75 of abiotic origin.
    Each sample was represented as a two-dimensional matrix, where the rows and columns
    represent the scan numbers and m/z ratios, respectively, and the entries are the
    corresponding intensities. For each sample and m/z value, we performed the preprocessing
    steps in the chromatographic direction, stabilized the variance of the intensity
    values by taking the square root, smoothed the values by taking the moving average
    of its current and its immediate five nearest observations on each side, and subtracted
    the baseline, where the baseline estimation was based on the Statistics-sensitive
    Non-Linear Iterative Peak-clipping algorithm (63), using the R-library, MALDiquant
    (64).


    Intensity values were normalized via min–max normalization (65), followed by peak
    detection in the chromatographic direction for each m/z ratio. Peaks were detected
    as local maxima above 4× signal to noise ratio, where the noise was estimated
    by calculating the median absolute deviation using the R-library, MALDiquant (64).
    After eliminating near-zero variance and strongly correlated features using the
    R-library caret (66), the data were reduced to 8,149 features, which are the detected
    combination of scan number and m/z values. These 134 Pyr-GC-MS data files are
    available at https://osf.io/emb8/?view_only=89695d388b484af28dae80ce4de3b33c (DOI:
    10.17605/OSF.IO/EMBH8).

