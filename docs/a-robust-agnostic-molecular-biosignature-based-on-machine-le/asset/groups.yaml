    We used a robust, space flight-ready analytical method—pyrolysis gas chromatography
    coupled to electron impact ionization mass spectrometry (Pyr-GC-EI-MS)—for molecular
    analyses of varied complex organic mixtures (complex in terms of the number of
    components in the mixture, not necessarily in terms of the structural complexity
    of the individual molecules). We couple these measurements with mathematical modeling
    and machine learning to characterize the distribution of organic molecular mixtures
    from other worlds or early Earth, including molecules from carbonaceous meteorites,
    organic residues from paleozoic fossils, or carbon-bearing black cherts from Earth’s
    Archean Eon. This approach demonstrates robust, reproducible, and unambiguous
    differences in the distributions of organic molecules derived from living vs.
    nonliving systems. At a deeper level, we speculate that the evolution of biological
    mechanisms to manufacture functional molecules may be fundamentally different
    from undirected synthesis in abiotic systems—a motivation for developing biosignatures
    that might reveal underlying rules of biochemistry.


    # The Nature of Biosignatures


    A biosignature in the context of astrobiology is any substance or phenomenon that
    provides diagnostic evidence of past or present life (7–12). Biosignatures can
    range across both temporal and spatial reference frames and may take the form
    of individual (bio)markers or relational aspects among multiple measurable phenomena.
    Of special importance in the context of the search for life on other worlds is
    the concept of “agnostic biosignatures,” which are attributes of a system that
    point to a biosphere, but that are not idiosyncratic properties resulting from
    the biochemistry of familiar terrestrial organisms (8, 13).


    Various biosignatures have been proposed (11). Easily recognized biosignatures
    include body fossils and other biologically deposited objects at scales from microns
    to kilometers, such as shells, teeth, and bones, but also microbial mats, tracks
    and trails, colonial structures such as stromatolites and reefs, concretions,
    and cells preserved in fine-grained rock (14, 15). Chemical and isotopic biosignatures
    have been invoked in numerous terrestrial samples, with distinctive distributions
    of carbon, nitrogen, sulfur, and/or iron isotopes receiving special attention
    (e.g., refs. 16 and 17). In this context, molecular biosignatures hold special
    promise.


    In some instances, prior researchers have proposed the presence of a specific
    molecule or group of molecules as a plausible biosignature (18); for example,
    specific genetic polymers such as DNA (19), lipids (20), or certain collections
    of homochiral molecules (21). Similarly, various atmospheric molecules that purportedly
    result mainly from metabolic processes have also been cited as possible biosignatures
    (22, 23).


    A complementary strategy for identifying agnostic biosignatures is to examine
    collective attributes of multiple sample components, including minerals and molecules.
    For example, distributions of minerals on Earth, as represented by network analysis
    (24) and statistical analyses of mineral diversity and distribution (25), have
    been suggested to reflect the influence of the biosphere. Likewise, Wong and coworkers
    (26) have applied network analysis to atmospheric reaction networks to identify
    patterns that differentiate living and nonliving worlds. Recent efforts to identify
    collective molecular biosignatures have also focused on the distribution of


    monomer abundances (27), the topologies of organic molecular reaction networks
    (28), and relative distributions and abundances of unassigned features in complex
    mass spectra (29). Cronin and colleagues have also recently explored the molecular
    complexity of sample components as a potential biosignature (30, 31). We here
    propose a complementarity strategy based on machine-learning analysis of the higher-dimensional
    relationships in suites of molecules as analyzed by Pyr-GC-EI-MS, which is currently
    deployed as an analytical technique on various Solar System exploration missions
    (32–38).


    # Abiotic/Biotic Discrimination


    Our method for molecular biosignature detection involved three steps:


    +   (1) Collection of 134 diverse carbon-bearing samples (SI Appendix, Table S1).
    Abiotic samples include natural molecular suites from carbonaceous meteorites,
    as well as laboratory synthesis experiments and a number of pure synthetic chemicals,
    which serve as an important baseline of molecular complexity. Modern biotic samples
    were obtained from varied organisms, and a range of taphonomic samples such as
    fossil leaves and wood, fossil fuels (coal, petroleum, asphalt, and oil shales),
    and more ancient carbon-bearing sediments.


    +   (2) Subjecting each sample to Pyr-GC-EI-MS (SI Appendix and Analytical Methods).
    Pyr-GC-EI-MS has already been adapted for spaceflight missions (32–38) and enables
    rapid organic sample introduction from mineral matrices directly to a GC instrument
    with little to no sample preparation. Because pyrolysis products rapidly combine
    to generate compounds not present in the original sample, the datasets generated
    are highly complex and do not map 1:1 to the original components of the sample.
    This aspect of Pyr-GC-EI-MS analysis motivates the machine learning approach that
    we employ below.


    +   (3) Training random forest machine-learning models using three-dimensional
    chromatographic retention time/mass to charge ratio/intensity data from each sample
    analysis (SI Appendix and Machine-Learning Methods). In this work, chromatographic
    retention time is also called scan number, as we measure when a particular feature
    arises in the analysis. In this Pyr-GC-EI-MS workflow, volatile compounds generated
    by pyrolysis are separated by GC and further subjected to EI-MS, which provides
    significant structural information based on fragmentation patterns (39), especially
    when these data can be compared with EI-MS libraries (40).


    After evaluating Pyr-GC-EI-MS features in all 134 samples, the random forest model
    correctly predicted the biogenicity of samples with ~90% accuracy. Thus, the generalized
    testing error using nested cross-validation (CV) was 10.4% with an area under
    the receiver operating characteristic curve of 91.2%.


