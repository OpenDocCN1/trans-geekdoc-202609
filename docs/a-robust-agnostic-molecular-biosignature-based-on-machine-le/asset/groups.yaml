    ## 基于机器学习的强健、非特异性分子生物标志物


    H. James Cleaves II[a,b,c], Grethe Hystad[d], Anirudh Prabhu[d], Michael L. Wong[a,d],
    George D. Cody[a], Sophia Economou[f], and Robert M. Hazen[a,1]


    Edited by 罗杰·萨蒙斯，麻省理工学院，剑桥，马萨诸塞州；收到 2023 年 4 月 29 日；接受 2023 年 7 月 17 日


    寻找确定性生物标志物（即过去或现在生命的明确标志）是古生物学和天体生物学的核心目标。我们使用热解-气相色谱-质谱联用法分析化学性质迥异的样本，包括活细胞、经地质过程处理的化石有机物、富碳陨石以及实验室合成的有机化合物和混合物。每个样本的数据被用作机器学习方法的训练和测试子集，从而得到一个能够以约
    90% 的准确率鉴定当代及经地质过程处理的古代样本生物源性的模型。这些机器学习方法不依赖于精确的化合物鉴定：相反，色谱峰和质谱峰的关系特征提供了所需信息，这凸显了该方法在检测外星生物学方面的实用性。


    生物标志物 | 有机化学 | 机器学习 | 塔富学 | 富碳陨石


    生命的化学与无生命世界的化学之间是否存在根本性的差异？是否存在影响生物分子多样性和分布的“生命化学规律”？我们能否推导出这些规则，并利用它们来指导我们对生命起源的建模或在其他世界检测微妙生命迹象的工作？在这里，我们报告的研究基于这样一个假设：生物化学中根深蒂固的方面与非生物化学在根本上有所不同。与非生物系统中的分子不同，生命的有机分子构建块已被选择用于其功能，包括存储和复制信息的能力、从环境中高效采集能量和物质的能力、构建和维护自身结构的能力、控制其环境的能力以及更多（1,
    2）。合成此类生物分子需要能量和信息——在竞争激烈的达尔文世界中，这些是宝贵的商品。预计生物系统中有机分子的多样性和分布与非生物过程产生的有机分子组合会有所不同（尽管差异可能很微妙）。功能的进化选择应导致生物分子频率分布与纯粹非生物过程中出现的分布不同，在这些过程中，此类随附过程不会发生或运行。


    这一现象已经显而易见：富碳陨石、前生物模拟实验、有机地质聚合物（例如煤、石油、角蠕石）以及生物体本身中发现的分子集合，都可以通过多种方式加以区分，例如，通过氨基酸等成分的类型、碳同位素组成和/或手性（3）。从热力学角度来看，将物理过程与功的执行和能量耗散高效耦合（这也导致构建能够自发自组装以执行相同功能的化合物）可能需要一定的结构凝聚力，例如，形成一个集流管（如蒸汽机或内燃机）或细胞，以协同地聚焦所讨论的功（4）。这些耦合过程将行星能量流与其产生的有机分子联系起来。因此，所产生的分子保留了关于制造它们的过程的信息。


    哪些分子组合能够实现开放式进化？地球生物学已经进化出多种方式来耦合功和系统产生的结构，从而产生可识别的核心细胞基序，例如与 ATP 产生耦合的化学渗透（5），这进一步与胞质内能量产生耦合。因此，此类细胞反应网络可能是普遍生命的指示器，因为细胞是使功能得以以可遗传方式执行的物质的基本组织方面。其他世界上的生物系统可能不会产生与现代地球生物学中发现的相同或甚至大致相似的有机分子组合。相反，我们认为，即使是可能与地球生物化学有显著差异的外星生物化学系统，也会显示出与背景非生物合成过程不同的分子频率分布（6）。例如，任何世界上的生命都可能表现出相对于非生物合成，向生产少量高功能化合物的系统性偏倚，这可能代表由系统性反馈催化产生的生物系统的一种潜在普遍特征。我们建议，利用我们的技术可以检测和量化生物和非生物分子组合之间的这类差异。


    ## 意义


    我们在天体生物学最重要的问题之一方面取得了重大进展——开发了一种简单、可靠且实用的方法，用于确定行星样本（包括其他世界以及地球上最早生命痕迹）中有机材料的生物源性。我们开发了一种强健的方法，将广泛的地球和外地球富碳材料的热解
    GC-MS 测量与基于机器学习的分类相结合，以实现非生物起源样本与生物标本（包括高度降解的、源于生物的古代样本）之间约 90% 的准确率区分。这种区分指向了反映生物分子功能选择达尔文式命令的底层“生物化学规律”。


