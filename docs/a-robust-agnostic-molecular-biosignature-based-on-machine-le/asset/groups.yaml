    ## 意义


    分析不确定生物性样品的前景。我们的方法可能可用于确定手头数据的生物性。一个重要例子是西澳大利亚 Pilbara 克拉通中的 3.5 Ga Apex 燧石，其所谓的生物性引发了重大争议（50,
    51）。此外，火星 Viking 着陆器和 Curiosity 漫游者上的 Pyr-GC-MS 仪器测量的样品（34, 43, 52）值得重新评估。虽然我们的方法必须首先针对这些仪器的特定热升温和最大温度条件进行校准，但这些及其他机器学习方法有望在地球外来源样品返回地球之前评估其生物性（53）。在这方面特别感兴趣的是环境化学品（例如火星上的高氯酸盐（54））以及辐射改变的分子组（55）的可能作用，它们可能显著影响所得分子混合物的性质。


    ### 生物化学规则


    非生物和生物样品中分子分布所识别的系统性差异表明，生物化学与非生物有机化学本质上不同。我们的工作假设是，与非生物分子组（例如碳质陨石中的分子）不同，生物分子是为功能而被选择的。这种差异导致生物分子的数量更有限，并且在某些情况下结构可能更复杂（30,
    31），比非生物组中的有机分子更甚。对本研究中识别的特定属性星座进行更深入的检验，是检验这一假设的下一步。尽管观察到埋藏过程不可避免地导致信息丢失（56–58），但我们的方法能够区分古老的、经地质过程处理的生物样品与非生物有机物，同时可能为埋藏降解程度提供定量指标。在此方面，重要的是要注意，非生物分子系统本身并不简单。例如，从
    Murchison 碳质球粒陨石中提取的分子组在其结构多样性和数量上都显得非常复杂（59）。很可能存在区分生物与非生物系统的分子复杂性方面，如 Cronin
    及其同事所探讨的（30, 31）。然而，我们在此记录的非生物与生物分子分布之间的诊断高维差异，不在于单个分析物的复杂性或多样性，而在于它们的关系性质。


    ### 我们提出的生物标志物具有不可知性


    本研究的一个重要发现是，非生物、活体和埋藏的有机分子组在其高维空间中表现出明确定义的簇，如图 2 所示。与此同时，该属性空间的大体积“空域”既未被非生物组也未被陆地生命所占据。这种拓扑结构暗示，外星生物化学可能通过在图
    2 的不同区域形成其自身的属性簇而被识别——该簇反映了生物系统中为功能选择的基本作用，尽管功能分子组可能截然不同。非生物系统倾向于在此相空间的非常狭窄区域内聚集，从原则上讲，这可能允许轻松识别与非生物地球化学系统或已知陆地生命不相似的异常信号。


    ## 方法


    ### 样品表征


    我们从各种非生物和生物（有时含糊）的来源中收集了 134 个含碳样品。这些样品及其属性列表载于 SI 附录，表 S1。


    ### 分析方法


    Pyr-GC-EI-MS 分析使用 CDS 1000 热解仪（CDS Analytical, Inc., Oxford, PA）进行，该热解仪与 Hewlett-Packard
    6890 系列气相色谱仪相连，并进一步与 Agilent 5972 四极杆质谱仪相连。使用 Agilent 30 m 5% 苯基聚甲基硅氧烷柱进行色谱分离。GC
    柱箱温度程序设定为在 50 °C 处保持 1 min，然后以 5 °C min−1 的速率升温至 300 °C，并在 300 °C 处保持 15 min。氦气（UHP
    5.5 级）用作载气，恒定流量模式运行。约 1 mg 样品被加载到预灰化石英管中（在空气中于 550 °C 下预燃 3 h），然后插入热解仪的铂丝线圈中。随后，将热解仪插入充满氦气的接口，并进行闪速热解（升温速率
    500 °C s−1）至 610 °C 并保持 10 s。热解产物立即被 He 气体扫入 GC 柱并进行分析。离子源在电子电离（EI）模式下运行，电离能为
    70 eV，温度为 250 °C。质谱选择性探测器扫描速率为 0.80 s/decade，范围为 m/z 50 至 700，扫描间延迟为 0.20 s。


    在许多 Pyr-GC-EI-MS 应用中，数据输出会与 EI-MS 库进行比较，以鉴定特定分子化合物。可用的 EI-MS 库可能全面覆盖普通陆地样品中存在的化合物，以寻找“感兴趣的分析物”（例如，药物、类固醇和农药）。然而，预测大多数可能稳定低分子量有机物的有机异构性估计认为，这些化合物是“尚未知晓或未合成的化合物”（60,
    61）。使用我们的方法，精确的化合物鉴定有用但不是必要的：相反，色谱和质谱峰的关系性质是感兴趣的。这种方法强调了该方法在检测外星生物方面的实用性，这也与早期的关系生物学概念相一致（32,
    62）。


    注射后前 2 min 未采集 MS 数据，以避免因 CO2 和 H2O 等小分子挥发物过载探测器。此外，由于许多样品是独立整理的，并且显示出来自 C16（棕榈酸）和
    C18（硬脂酸，这些是指纹中常见的成分，也被添加到塑料样品袋中的“滑动剂”以防止袋子粘在一起）的信号，因此我们排除了色谱图中这些常见污染物洗脱区域之后的区域。然而请注意，此类化合物的衍生物（例如，直链和支链长链烷烃、烯烃，以及这些物质的重排醛和酮衍生物）仍会对所检查的色谱复杂性做出贡献，这些衍生物有助于截止前区域的分子复杂性。我们发现
    m/z 200 之后几乎没有信号；因此，计算方法中考虑的区域限制为 2 至 35 min 和 m/z 50 至 200。每个样品被归约为一个包含 489,240
    个元素的二维矩阵，表示作为质量和保留时间函数的信号强度，尽管许多强度值为零（图 1）。


    ### 机器学习分析


    我们使用每个样品的三维色谱保留时间/质量电荷比/强度数据训练了机器学习模型。本手稿中生成和分析的数据可在 Open Science Framework 仓库中找到，标题为“基于机器学习的稳健分子生物标志物”（https://doi.org/10.17605/OSF.IO/EMBH8）。论文的代码可在
    https://github.com/ghystad/Machine-learning_and_preprocessing_Pyr_GSMS_data/tree/master
    找到。分析中使用的所有数据、代码和材料均可供任何研究人员用于复制或扩展分析。数据和代码使用的许可证及相关归属信息将在各自的仓库中更新。


    在此，峰强度在 0 到 1 的范围内归一化，而时间和质量/电荷比分别按采集的 3,240 个扫描时间步长（每个扫描代表 3 s）和 1 m/z 的增量进行分析，范围为
    m/z 50 至 200。我们的机器学习策略允许鉴定保留时间和 m/z 值的诊断属性集，以突出非生物和生物样品之间的差异。我们的嵌套 CV 方法克服了对训练数据过拟合的问题。我们还计划在未来工作中通过聚焦蒙特卡洛模拟、向训练集和测试集添加更多样品以及监测测试和训练误差的变化，来改进模型的泛化能力。


    ### 预处理


    分析的 134 个样品包括 59 个生物来源样品和 75 个非生物来源样品。每个样品表示为一个二维矩阵，其中行和列分别表示扫描编号和 m/z 比值，条目为相应的强度。对于每个样品和
    m/z 值，我们在色谱方向上执行预处理步骤，通过取平方根来稳定强度值的方差，通过取当前值及其两侧最近五个观测值的移动平均来平滑这些值，并减去基线，基线估计基于对统计敏感的非线性迭代峰削算法（63），使用
    R 库 MALDiquant（64）。


    强度值通过 min-max 归一化（65）进行归一化，然后对每个 m/z 比值在色谱方向上进行峰检测。峰被检测为高于 4× 信噪比的局部极大值，噪声通过使用
    R 库 MALDiquant（64）计算中位数绝对偏差来估计。在使用 R 库 caret（66）消除近零方差和强相关特征后，数据被归约为 8,149 个特征，即检测到的扫描编号和
    m/z 值的组合。这 134 个 Pyr-GC-MS 数据文件可在 https://osf.io/emb8/?view_only=89695d388b484af28dae80ce4de3b33c
    (DOI: 10.17605/OSF.IO/EMBH8) 上找到。


