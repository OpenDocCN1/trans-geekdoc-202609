    # A robust, agnostic molecular biosignature based on machine learning


    H. James Cleaves II<sup>a,b,c</sup>, Grethe Hystad<sup>d</sup>, Anirudh Prabhu<sup>d</sup>,
    Michael L. Wong<sup>a,d</sup>, George D. Cody<sup>a</sup>, Sophia Economou<sup>f</sup>,
    and Robert M. Hazen<sup>a,1</sup>


    Edited by Roger Summons, Massachusetts Institute of Technology, Cambridge, MA;
    received April 29, 2023; accepted July 17, 2023


    The search for definitive biosignatures—unambiguous markers of past or present
    life—is a central goal of paleobiology and astrobiology. We used pyrolysis–gas
    chromatography coupled to mass spectrometry to analyze chemically disparate samples,
    including living cells, geologically processed fossil organic material, carbon-rich
    meteorites, and laboratory-synthesized organic compounds and mixtures. Data from
    each sample were employed as training and test subsets for machine-learning methods,
    which resulted in a model that can identify the biogenicity of both contemporary
    and ancient geologically processed samples with ~90% accuracy. These machine-learning
    methods do not rely on precise compound identification: Rather, the relational
    aspects of chromatographic and mass peaks provide the needed information, which
    underscores this method’s utility for detecting alien biology.


    biosignatures | organic chemistry | machine learning | taphonomy | carbonaceous
    meteorites


    Is there something fundamentally different about the chemistry of life compared
    to the chemistry of the inanimate world? Are there “chemical rules of life” that
    influence the diversity and distribution of biomolecules? Can we deduce those
    rules and use them to guide our efforts to model life’s origins or to detect subtle
    signs of life on other worlds? Here, we report research predicated on the hypothesis
    that deeply rooted aspects of biochemistry differ fundamentally from abiotic chemistry.
    Unlike molecules in nonliving systems, life’s organic molecular building blocks
    have been selected for their function, including their ability to store and replicate
    information, efficiently gather energy and material from the environment, build
    and maintain their own structures, control their environments, and more (1, 2).
    Synthesizing such biomolecules requires energy and information—precious commodities
    in a competitive Darwinian world. The diversity and distribution of organic molecules
    in living systems are expected to be different (though perhaps subtly so) from
    organic molecular suites produced by abiotic processes. The evolutionary selection
    for function should lead to different frequency distributions of biotic molecules
    compared to what emerges from purely abiotic processes in which such entailed
    processes do not arise or operate.


    This phenomenon is already evident: The sets of molecules found in carbonaceous
    meteorites, prebiotic simulation experiments, organic geopolymers (e.g., coal,
    oil, kerogen), and organisms themselves can all be distinguished in various ways,
    for example, via type, carbon isotope composition, and/or chirality of components
    such as amino acids (3). In terms of thermodynamics, the efficient coupling of
    physical processes to the performance of work and energy dissipation, which also
    results in the construction of compounds that spontaneously self-assemble to perform
    the same function, likely requires some structural cohesion, e.g., the formation
    of a manifold (like a steam or combustion engine), or a cell) that concertedly
    focuses the work in question (4). These coupling processes connect planetary energy
    flow to the organic molecules it produces. Consequently, the resulting molecules
    retain information about the processes that made them.


    Which suites of molecules enable open-ended evolution? Terrestrial biology has
    evolved several ways to couple work and system-produced structure, resulting in
    recognizable core cellular motifs, for example chemiosmosis coupled to ATP production
    (5), which is further coupled to cycosolic energy production. Such cellular reaction
    networks may thus be indicators of life in general, in that cells are the fundamental
    organizing aspects of physical material that enable work to be done in a heritable
    manner. Biological systems on other worlds might not produce identical, or even
    broadly similar, suites of organic molecules to those found in modern terrestrial
    biology. Rather, we suggest that even alien biochemical systems that might differ
    significantly from Earth’s biochemistry would still display molecular frequency
    distributions that are distinct from those of background abiotic synthetic processes
    (6). For example, it is plausible that life on any world will display a systematic


    # Significance


    We report a significant advance to one of the most important problems in astrobiology—the
    development of a simple, reliable, and practical method for determining the biogenicity
    of organic materials in planetary samples, both on other worlds and for the earliest
    traces of life on Earth. We have developed a robust method that combines pyrolysis
    GC-MS measurements of a wide variety of terrestrial and extraterrestrial carbonaceous
    materials with machine-learning-based classification to achieve ~90% accuracy
    in the differentiation between samples of abiotic origins vs. biotic specimens,
    including highly-degraded, ancient, biologically-derived samples. Such discrimination
    points to underlying “rules of biochemistry” that reflect the Darwinian imperative
    of biomolecular selection for function.


