    我们使用了一种强健的、适用于太空飞行的分析方法——热解气相色谱与电子击打电离质谱耦合（Pyr-GC-EI-MS）——来对多种复杂有机混合物进行分子分析（复杂性指混合物中的组分数量，而不一定是单个分子的结构复杂性）。我们将这些测量与数学建模和机器学习相结合，以表征来自其他世界或早期地球的有机分子混合物的分布，包括来自富碳陨石、古生代化石有机残留物或地球古元古代含碳黑燧石的分子。该方法揭示了源自生物系统与非生物系统的有机分子分布中强健、可重复且明确的差异。在更深层次上，我们推测，生物机制制造功能分子的进化可能与非生物系统中的无定向合成有根本不同——这是开发可能揭示生物化学底层规则的生物标志物的动力。


    ## 生物标志物的本质


    在天体生物学背景下，生物标志物是任何能提供过去或现在生命诊断证据的物质或现象（7–12）。生物标志物可以跨越时间和空间参考框架，并可能采取个别（生物）标志物或多种可测量现象之间关系特征的形式。在寻找其他世界生命的背景下，“非特异性生物标志物”的概念尤为重要，它是指系统指向生物圈的属性，但并非源自熟悉地球生物体生物化学的独特属性（8,
    13）。


    已提出各种生物标志物（11）。易于识别的生物标志物包括体化石以及从微米到千米尺度的其他生物沉积物，如贝壳、牙齿和骨骼，还包括微生物垫、足迹和痕迹、如层状礁石和珊瑚礁等群体结构、结核以及保存在细粒岩石中的细胞（14,
    15）。化学和同位素生物标志物已被用于众多地球样品，碳、氮、硫和/或铁同位素的独特分布受到特别关注（例如，参考文献 16 和 17）。在这一背景下，分子生物标志物具有特殊的前景。


    在某些情况下，先前的研究人员提出特定分子或分子组作为合理的生物标志物（18）；例如，特定的遗传聚合物，如 DNA（19）、脂质（20）或某些手性同型分子集合（21）。同样，据称主要由代谢过程产生的各种大气分子也被引用为可能的生物标志物（22,
    23）。


    识别非特异性生物标志物的互补策略是检查多个样本成分（包括矿物和分子）的集体属性。例如，地球上的矿物分布，如网络分析（24）和矿物多样性及分布的统计分析（25）所表示，已被认为反映了生物圈的影响。同样，Wong
    及其同事（26）将网络分析应用于大气反应网络，以识别区分生物世界和非生物世界的模式。最近识别集体分子生物标志物的努力还关注单体丰度分布（27）、有机分子反应网络的拓扑结构（28）以及复杂质谱中未分配特征的相对分布和丰度（29）。Cronin
    及其同事还最近探索了样本成分的分子复杂性作为潜在生物标志物（30, 31）。我们在这里提出了一种基于机器学习分析 Pyr-GC-EI-MS 所分析的分子组中更高维度关系的互补策略，Pyr-GC-EI-MS
    目前已作为各种太阳系探索任务中的分析技术部署（32–38）。


    ## 非生物/生物鉴别


    我们的分子生物标志物检测方法包括三个步骤：


    - (1) 收集 134 种多样化的含碳样本（SI 附录，表 S1）。非生物样本包括来自富碳陨石的天然分子组，以及实验室合成实验和若干纯合成化学品，这些作为分子复杂性的重要基线。现代生物样本从各种生物体中获得，还包括一系列塔富学样本，如化石树叶和木材、化石燃料（煤、石油、沥青和油页岩）以及更古老的含碳沉积物。


    - (2) 将每个样本送入 Pyr-GC-EI-MS 分析（SI 附录和分析方法）。Pyr-GC-EI-MS 已被改编用于太空飞行任务（32–38），能够将有机样本直接从矿物基质快速引入
    GC 仪器，几乎不需要样本前处理。因为热解产物会迅速结合生成原始样本中不存在的化合物，因此生成的数据集高度复杂，不能与样本的原始成分 1:1 对应。Pyr-GC-EI-MS
    分析的这一特点激励了我们下面采用的机器学习方法。


    - (3) 使用每个样本分析的三维色谱保留时间/荷质比/强度数据训练随机森林机器学习模型（SI 附录和机器学习方法）。在本工作中，色谱保留时间也称为扫描编号，因为我们测量特定特征在分析中出现的时间。在这个
    Pyr-GC-EI-MS 工作流程中，热解产生的挥发性化合物由 GC 分离，然后进一步接受 EI-MS 分析，这基于碎片化模式提供重要的结构信息（39），尤其是当这些数据可以与
    EI-MS 库进行比较时（40）。


    在对所有 134 个样本中的 Pyr-GC-EI-MS 特征进行评估后，随机森林模型以约 90% 的准确率正确预测了样本的生物源性。因此，使用嵌套交叉验证（CV）的泛化测试误差为
    10.4%，受试者工作特征曲线下面积为 91.2%。


    基于主成分分析（PCA）图的基尼分割指数，选出了 20 个最重要的特征——该指数提供了方差的度量，突出显示决策树中随机选择的元素被错误分类的频率（41）。基尼分割指数得分最高的特征是预测区分最相关的变量。虽然所选属性集的影响尚未完全阐明，但来自样本子集的数据的求和三维表示（例如，富碳陨石样本与微生物群落（分别为图
    1 A 和 B））明显表明非生物样本和生物样本中分子分布存在显著差异。图 2 显示


