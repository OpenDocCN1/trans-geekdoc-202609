    ## Discussion


    We analyzed collective molecular distributions from varied abiotic, biological,
    and taphonomically altered biological mixtures of organic molecules to demonstrate
    clear differences between suites of organic molecules synthesized by life vs.
    those produced abiotically. Importantly, we find that signs of biogenicity are
    preserved despite extensive organic maturation, in some instances over periods
    of hundreds of millions of years.


    What molecular characteristics might contribute to the observed differences among
    abiotic, modern living, and taphonomically altered specimens? We explored the
    products of a variety of abiotic reactions that combine the diversity-generating
    properties of sugar degradation (e.g., the formose reaction) with the diversity-generating
    propensity of amines in combination with carbohydrates, such as Maillard reactions
    of diverse amino acids with glucose (42). Organic molecular suites derived from
    carbonaceous meteorites have been suggested to be derived from formose-like chemistry
    (43). Formose and Maillard reactions are known to produce significant amounts
    of diverse polar hetero-atom-containing products such as pyrazines, furans, and
    diketopiperazines (44)— compounds that are not typically well preserved in the
    geological record (45). Their detection can thus be considered as a marker for
    the recent abundance of sugars and amines, which could be derived from formose-like
    chemistry or from biological processes.


    Biochemistry also encompasses a wide variety of disparate chemistries in contemporary
    organisms (46). Regardless of the diversity of chemical processes that might enable
    life, the abundant coexistence of water-soluble and water-insoluble organic species
    appears to be one of life’s hallmarks. A significant fraction by dry weight of
    most terrestrial organisms is composed of sugar-derived compounds, including cellulose,
    glycogen, chitin, and ribose and deoxyribose in nucleic acids (47). These species
    produce characteristic pyrolysis products (including furans and pyrans), plus
    a peptidic fraction that produces other distinctive pyrolysis products (including
    pyrazines and Maillard-like cross products with the sugar-derived pyrolysis product
    pool). Accordingly, we suggest that the coexistence of molecules of diverse polarity
    in detectable quantities points to the existence of recent life or more generally
    the functional structural organization of cells.


    Most preserved biological geocarbon is composed of breakdown products of cell
    membrane and cell wall material, for example, in the form of petroleum and coal
    (48). Petroleum is generally thought to derive from thermal degradation of type
    I kerogen that arises from the algal biopolymers. Coal is mostly derived from
    the ligno-cellulosic biopolymers of plant vascular tissue; high-volatile bituminous
    coals have been transformed during diagenesis such that no molecular signatures
    of either lignin or cellulose remain. These degraded molecular suites tend to
    be derived from materials of lower water solubility—molecules that point to cellular
    origins.


    The systematic differences between abiotic and biologically derived materials
    suggest possible underlying reasons for the robust discriminators we find using
    Pyr-GC-EI-MS data. Chromatographic retention time on any given solid GC support
    can be related via a Kovats index, which helps to normalize compound volatility
    and polarity with retention time (49). Thus, material derived from cells will
    have a nonpolar component derived from cell membrane/wall material that elutes
    late chromatographically, as well as a polar cytoplasmic component that elutes
    early (depending on the chromatographic matrix). Samples exhibiting both types
    of chromatographically-behaving materials are typically derived from cells, which
    produce both polar and nonpolar compounds in a coordinated manner. In contrast,
    abiotic diversity-generating reactions that produce both polar and nonpolar compounds
    do so in an uncoordinated fashion such that there will be a skewed balance between
    the two types of materials. It is unlikely that both polar and nonpolar compounds
    would occur in comparable ratios because no known abiotic processes produce balanced
    amounts of nonpolar products in the absence of polar organics. As an example,
    while nonpolar, heteroatom-poor material is a common convergence point for aged
    organic matter from meteorites, such material is easily distinguishable from aged
    biological deposits such as coal and petroleum because these types of materials
    preserve observable polar molecular irregularities, such as even-odd disparities
    in fatty acids and other hydrocarbons. Even-odd disparities in alkanes and fatty
    acids tend to disappear as oil matures through diagenetic “smoothing.” Consequently,
    even-odd characteristics provide a measure of an oil sample’s age.


