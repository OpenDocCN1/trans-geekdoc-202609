    ### 模型选择


    在我们探索的各种分类方法中，随机森林方法在准确区分生物样本和非生物样本方面迅速取得了最佳效果，因此被用于训练最终模型。随机森林方法是一种集成分类方法，它构建一组去相关的决策树（67）。可能存在更好的方法，我们正在探索其他方法的相对优势，以供未来的出版物参考。我们使用了R库mlr3中的随机森林模型（68）。


    Machine_learning_and_preprocessing_pyr_GSMS_data/tree/master (71). 用于分析的所有数据、代码和材料均可供任何研究人员用于复制或扩展分析。数据和代码使用的许可证以及相关的归属信息可在各自的仓库中获得。


    ### 模型验证


    我们为训练好的机器学习模型采用了两种验证策略。首先，数据使用分层随机采样分为95个样本的训练集和39个样本的测试集，模型在训练集上使用10倍交叉验证进行参数调优后进行了测试。最终训练好的随机森林模型随后被应用于预测测试数据的生物或非生物来源。其次，我们对所有134个样本使用了嵌套交叉验证（69），以获得机器学习方法预测性能的无偏估计。嵌套交叉验证在内层循环中使用10倍交叉验证，在外层循环中使用五倍交叉验证。算法在使用随机搜索进行20次评估后终止。


    ## 致谢


    我们感谢Stuart Bartlett、Carol Cleland以及两位匿名审稿人对本文早期版本进行的宝贵讨论和详细评审。我们还感谢编辑Roger Summons对手稿的细心耐心处理。我们特别感谢John
    Saul捐赠了本研究中使用的80个样本。分子生物标志物的研究得到了John Templeton Foundation Grant 61783的支持。NASA
    Astrobiology Institute ENIGMA团队（grant 80NSSC18M0093）还提供了额外支持。此处表达的任何意见、发现或建议均为作者本人观点，不一定反映NASA的观点。


    ## 数据、材料和软件可用性


    本手稿中生成和分析的数据[Pyr-GC-MS数据文件（134个文件）]可在Open Science Framework仓库中找到，标题为“基于机器学习的强健分子生物标志物”（70）。本论文的代码可在
    https://github.com/ghystad/ 上找到。


