    # Implications


    Prospects for Analyzing Samples of Uncertain Biogenicity. Our method can potentially
    be used to resolve the biogenicity of data already in hand. An important example
    is the 3.5 Ga Apex chert from the Pilbara Craton in Western Australia, whose purported
    biogenicity has evoked significant debate (50, 51). In addition, samples measured
    by the Pyr-GC-MS instruments on the Mars Viking lander and the Curiosity rover
    (34, 43, 52) deserve new


    evaluation. While our method must first be calibrated to the specific thermal
    ramping and maximum temperature conditions of those instruments, these and other
    machine-learning methods hold promise for the evaluation of the biogenicity of
    samples of extraterrestrial provenance before they are returned to Earth (53).
    Of special interest in this regard is the possible role of environmental chemicals,
    such as perchlorate on Mars (54), as well as radiation-altered molecular suites
    (55), which might significantly influence the properties of the resulting molecular
    mixtures.'
