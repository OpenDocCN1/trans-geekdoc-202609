    ### Model Choice


    Of the various classification methods we explored, the random forest method quickly
    yielded the best results in terms of accurately distinguishing biotic from abiotic
    samples and thus was used to train the final model. The random forest method is
    an ensemble classification method that constructs a collection of decorrelated
    decision trees (67). There may be better methods and we are exploring the relative
    benefits of other methods for future publications. We used the random forest model
    from the R-library mlr3 (68).


    Machine_learning_and_preprocessing_pyr_GSMS_data/tree/master (71). All data, code,
    and materials used in the analysis are available to any researcher for purposes
    of reproducing or extending the analysis. Licenses for the data and code usage
    and relevant attribution information are available on the respective repositories.


    ### Model Validation


    We used two validation strategies for the trained machine-learning model. First,
    the data were split into a training set of 95 samples and a test set of 39 samples
    using stratified random sampling, where the model was tested with parameter tuning
    on the training set using 10-fold CV. The final trained random forest model was
    subsequently applied to predict the biotic or abiotic origin of the test data.
    Second, we used nested CV (69) on all 134 samples to gain an unbiased estimate
    of the predictive performance of the machine learning method. The nested CV used
    10-fold CV in the inner loop and five-fold CV in the outer loop. The algorithm
    was terminated after 20 evaluations using random search.


