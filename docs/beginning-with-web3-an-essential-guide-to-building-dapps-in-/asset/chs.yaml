  \n## 重点回顾\n\n本章深入概述了以太坊区块链、其架构、核心概念以及在实现去中心化应用中的作用。一些关键要点包括：\n\n* 以太坊是一个去中心化的开源区块链平台，运行着智能合约并驱动着活跃的去中心化应用（dApps）生态系统。其原生货币是\
