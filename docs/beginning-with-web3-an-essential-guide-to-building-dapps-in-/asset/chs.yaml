  \ () => new HDWalletProvider(mnemonic, \"https://optimism-mainnet.infura.io/v3/YOUR_INFURA_PROJECT_ID\"\
  ),\n      network_id: 10, // Optimism 的网络 id\n      chain_id: 10, // Optimism 的链\
  \ id\n      gas: 8500000, // Gas 限制\n      gasPrice: 15000000, // Gas 价格\n     \
  \ timeoutBlocks: 200, // 超时区块\n      skipDryRun: true // 迁移前跳过空运行\n    }\n  },\n\
  \  // 其他配置...};\n```\n\n请参考 `https://gist.github.com/njwardhan/57025dbd8a87f4784a2ceef789cd01ef`\
  \ 获取针对不同测试网络和主网的 Optimism `Truffle Config` 最新更新。\n\n## ZK Rollups：增强的隐私与性能\n\nZK\
