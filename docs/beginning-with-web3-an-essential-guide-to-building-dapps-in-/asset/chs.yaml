  \n## 编写 Substrate 合约\n\n在 Substrate 框架中，一个基础的 Rust 合约如下：\n\n```rust\n#[cfg_attr(not(feature\
  \ = \"std\"), no_std)]\n\nuse ink_lang as ink;\n\n#[ink::contract]\nmod flipper\
  \ {\n    #[ink(storage)]\n    pub struct Flipper {\n        value: bool,\n    }\n\
  \n    impl Flipper {\n        #[ink(constructor)]\n        pub fn new(init_value:\
  \ bool) -> Self {\n            Self { value: init_value }\n        }\n\n       \
  \ #[ink(constructor)]\n        pub fn default() -> Self {\n            Self::new(false)\n\
  \        }\n\n        #[ink(message)]\n        pub fn flip(&mut self) {\n      \
  \      self.value = !self.value;\n        }\n\n        #[ink(message)]\n       \
  \ pub fn get(&self) -> bool {\n            self.value\n        }\n    }\n}\n```\n\
  该合约包含一个 `bool` 值，可以进行翻转和读取。\n\n## 编译并部署合约\n\n要编译合约，进入合约所在的目录并运行以下命令：\n```bash\n\
  cargo contract\n```\n这将在 `target/ink` 中生成两个文件：一个包含合约元数据的 `.contract` 文件，以及一个包含合约字节码的\
  \ `.wasm` 文件。\n\n要部署合约，你需要连接到 Polkadot 节点。你可以运行自己的节点，也可以连接到公共节点。以下是使用 Polkadot.js\
  \ 连接到公共节点的方法：\n\n```javascript\nconst { ApiPromise, WsProvider } = require('@polkadot/api');\n\
  \nasync function main () {\n    const wsProvider = new WsProvider('wss://rpc.polkadot.io');\n\
  \    const api = await ApiPromise.create({ provider: wsProvider });\n    // ...\n\
  }\nmain().catch(console.error).finally(() => process.exit());\n```\n\n一旦连接到节点，你就可以部署合约了。要部署合约，你需要连接到节点。你可以运行自己的节点，也可以连接到公共节点。以下是使用\
  \ Polkadot.js 连接到公共节点的方法：\n\n（注：由于提供的原文文本存在大量重复和逻辑乱码，翻译已根据原文逻辑进行了进行了进行了翻译））\n\n\n\
  \n\n\n# 编译与部署合约\n\n你可以使用 `Truffle` 来编译和部署你的合约。首先，为你的项目创建一个新目录并初始化 `Truffle`：\n\n\
  ```bash\nmkdir bnb project\ncd bnb project\ntruffle init\n```\n\n将你的合约放在 `contracts/`\
  \ 目录下，通过修改 `truffle config.js` 文件配置 `Truffle` 连接到 BNB Chain 网络：\n\n```javascript\n\
  module.exports = {\n  networks: {\n    bsc: {\n      provider: () => new HDWalletProvider(mnemonic,\
  \ `https://bsc dataseed.binance.org`),\n      network_id: 56,\n      gas: 5500000,\n\
  \      confirmations: 10,\n      timeoutBlocks: 200,\n      skipDryRun: true\n \
  \   }\n  },\n};\n```\n\n然后，编译你的合约：\n\n```bash\ntruffle compile\n```\n\n最后，部署它：\n\
  \n```bash\ntruffle migrate network bsc\n```\n\n## 与合约交互\n\n部署合约后，你可以使用 `Truffle`\
