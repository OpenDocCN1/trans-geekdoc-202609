  * 正在开发如层 2 和分片等扩展解决方案，以增加以太坊的交易吞吐量，支持全球范围的采用。\n* 以太坊拥有透明的、社区驱动的治理模型，该模型利用改进提案、公共讨论和跨利益相关者之间的共识建立。\n\
  * 为了在以太坊上进行构建，开发者可以使用 `web3.js` 和 `ethers.js` 等工具与网络交互，执行部署和调用智能合约的任务。\n\n## 问题\n\
