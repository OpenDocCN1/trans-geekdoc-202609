  \n## 关键词\n\n- `Truffle`: 一个用于以太坊智能合约的流行开发框架。\n- `Hardhat`:一个专注于任务自动化和扩展性的以太坊开发环境。\n\
  - Web3 开发：诸如 `Remix`、`Etherlime` 和 `Embark` 等其他平台。\n- 智能合约编写：使用 `Solidity` 或 `Vyper`\
  \ 等语言编写代码的过程。\n- 智能合约编译：将合约代码转换为以太坊虚拟机字节码的过程。\n- 智能合约部署：将编译后的字节码发送到以太坊网络的行为。\n-\
  \ `Ganache`:开发者可以用于测试和实验的个人区块链。\n- 模拟交易：使用 `Ganache` 等工具模拟真实世界的交易。\n- `Infura`:一个托管的以太坊节点，允许开发者在无需建立自己的节点的情况下运行应用。\n\
  - `Infura setup`：创建 `Infura` 账户、设置项目并获取 API 密钥的过程。\n- `Infura integration`：配置你的去中心化应用或开发框架以使用\
  \ `Infura` 作为其节点的过程。\n- 智能合约安全：确保合约安全的最佳实践，例如彻底测试和遵循设计原则。\n- Gas 优化：减少智能合约函数 Gas\
  \ 成本的技术。\n- 用户友好 dApp：构建易用且易理解的应用原则和实践。\n- `Chainlink VRF`:Chainlink 预言机提供的功能，允许智能合约访问可验证的随机数。\n\
  - 以太坊命名服务 (ENS)：基于以太坊的去中心化命名系统，允许为资源分配人类可读的名称。\n- ENS 集：将 ENS 功能整合到你的 dApp 中的过程，可能包括名称解析为地址。\n\
  - 自定义 ENS 注册表：允许你在 `Truffle` 配置中使用自定义 ENS 注册表的高级功能。\n- 自动 ENS 注册表部署：`Truffle` 的一项功能，当无法连接到现有\
  \ ENS 注册表时，会自动部署新的 ENS 注册表。\n- `Truffle 配置`：根据特定项目需求设置和自定义框架的过程，包括启用 ENS 等功能。\n\n\
  \n\n\n在本章中，我们将探索去中心化金融（DeFi）和非同质化代币（NFTs）的世界，这两个重塑 Web3 生态系统格局的动态领域。从基础开始，我们将探索\
