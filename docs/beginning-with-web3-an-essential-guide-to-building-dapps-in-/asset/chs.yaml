  \n```javascript\nconst contract = await SimpleStorage.deployed();\nawait contract.set(123);\n\
  const data = await contract.get();\nconsole.log(data.toNumber());\n```\n\n## 探索\
  \ Layer 2 解决方案\n\n本节将深入探讨 Layer 2 Rollup 解决方案，即乐观汇总（Optimistic Rollups）和 知识证明汇总（ZK\
  \ Rollups），它们旨在增强以太坊的可扩展性并降低交易费用。我们将讨论这些 rollup 解决方案的运作机制、它们提供的优势，以及在这些平台上部署 dApps\
  \ 的流程。\n\n## 乐观汇总：可扩展性与可负担性\n\n乐观汇总是一种领先的 Layer 2 解决方案，为以太坊网络提供了显著提升的交易吞吐量和更低的成本。本节将深入探讨乐观汇总的架构，讨论它们如何实现可扩展性和可负担性，并为开发者提供在该平台上部署和与\
  \ dApps 交互的指南。\n\n### 理解乐观汇总\n\n乐观汇总是一种扩展方案，它在侧链上执行交易，然后定期将侧链的状态提交到以太坊主网。它们继承了主网的安全性，同时提供了更快、更廉价的交易。\n\
  \n名称中的“乐观”部分源于协议处理欺诈的策略。它假设所有交易都是有效的。如果检测到欺诈交易，任何人都可以通过提供相反证明来对其进行挑战。如果挑战成功，欺诈交易将被回滚。\n\
  \n### 实现可扩展性与可负担性\n\n乐观汇总的可扩展性和可负担性源于两个主要因素：\n\n*   **批处理**：乐观汇总在侧链上执行交易，并在提交到以太坊主网之前将多个交易打包在一起。这显著减少了与单笔交易相关的\
  \ gas 费用，使其更具成本效益。\n*   **链下计算**：乐观汇总不是在链上执行所有计算（因此不需要为每个计算步骤支付 gas 费用），而是在链外执行大部分计算，仅在链上发布最少必要的数据。这允许进行更复杂的计算，而不会显著增加成本。\n\
  \n### 在乐观汇总上部署和交互 dApps\n\n得益于 `EVM` 兼容性，在乐观汇总上部署和交互 dApps 与在以太坊和 BNB 上操作类似。唯一的区别在于部署。\n\
  \n要部署合约，首先配置 `Truffle` 连接到网络 ID 等于 `10` 的乐观以太坊网络，并将 provider 为 Optimism 网络：\n\n\
  ```javascript\nconst HDWalletProvider = require('@truffle/hdwallet-provider');\n\
