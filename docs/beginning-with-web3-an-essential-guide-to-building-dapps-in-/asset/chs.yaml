  20. 去中心化、民主化的 AI 访问将如何改变社会？\n\n## 关键词\n\n- `ChatGPT`: 生成式预训练 Transformer (GPT) 语言模型的一种变体，专门针对在对话语境中生成类人回答进行了微调。\n\
  - `Conversational AI`: 人工智能的一个分支，侧重于创建能够以自然对话方式理解、处理和响应人类语言的系统。\n- `Natural Language\
  \ Processing`: 计算机科学和人工智能的一个领域，涉及计算机与人类（自然）语言之间的交互，使计算机能够理解、解释和生成人类语言。\n- `Decentralized\
  \ applications`: 运行去中心化网络（通常是区块链）上运行，而不是托管在中央服务器上。\n- `Web3`: 第三代互联网服务和应用程序，专注于利用去中心化区块链和加密货币技术。\n\
  - `Blockchain`: 一种去中心化的分布式账本技术，在多台计算机上记录交易以确保安全和不可篡性。\n- `Decentralization`: 将功能、权力、人员或事物从中心位置或权威分散出去的过程。\n\
  - `Smart contracts`: 自执行合约，买卖双方之间的协议条款直接写在代码中，主要用于区块链技术。\n\n\n\n\n- **API 集成**:\
  \ API integration：通过应用程序接口 (`APIs`) 使不同的软件系统或组件能够能够通信并协同工作的过程。\n- **用户体验**: User\
  \ experience：个人使用产品（如网站或计算机应用程序）的整体体验，特别是使用的易用性或愉悦程度。\n- **非同质化代币**: Non-fungible\
  \ tokens：代表特定物品或资产的所有权或真实性证明的数字标记，通常用于数字艺术，存储在区块链上。\n- **去中心化金融**: Decentralized\
  \ finance：构建在区块链技术上的金融服务，包括贷款、借贷和交易，在没有中央金融中介的情况下运行。\n- **自动化交易**: Automated trading：使用计算机算法管理交易决策并执行交易，通常用于股票、外汇和加密货币市场。\n\
  - **风险评估**: Risk assessment：对风险进行识别、评估和排序，随后通过协调且经济的资源应用，最大限度地减少、控制和监控不幸事件发生的概率或影响。\n\
  - **透明度**: Transparency：易于观察、理解或检测的特性；在商业和技术领域，它通常指的是开放、沟通和问责制。\n- **问责制**: Accountability：个人或组织对其活动负责、承担责任并以透明方式披露结果的义务。\n\
  - **联邦学习**: Federated learning：一种机器学习方法，在持有本地数据样本的多个去中心化设备或服务器上训练算法，而不进行数据交换。\n\
  - **私有 AI**: Private AI：优先考虑并结合保护隐私的方法（如差异隐私）以保护个人数据的人工智能技术。\n- **去中心化自治组织**: Decentralized\
  \ autonomous organizations：成员拥有的没有中心领导的社区，通常由智能合约和集体决策过程治理，主要运行在区块链网络上。\n- **负责任的\
  \ AI**: Responsible AI：以良好的意图设计、开发和部署 AI 的实践，确保其透明、公平、符合伦理且可问责。\n\n### 加入我们书籍的 Discord\
