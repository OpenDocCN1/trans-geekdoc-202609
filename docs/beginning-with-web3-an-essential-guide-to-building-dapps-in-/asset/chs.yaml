  \ 标准之间有什么区别？\n\n11. 你能解释创建自己的 NFT 的过程吗？\n\n12. DeFi 有哪些现实应用？\n\n13. NFT 在游戏和房地产等领域是如何被使用的？\n\
  \n14. DeFi 和 NFT 有哪些未来趋势？\n\n15. 如何将现实世界资产代币化用于 DeFi 和 NFT？\n\n16. 可操作性（interoperability）在\
  \ DeFi 未来中扮演什么角色？\n\n17. 监管可能会如何影响 DeFi 和 NFT 的增长？\n\n18. 什么是 `Layer 2` 解决方案，为什么它们对\
  \ DeFi 和 NFT 的未来非常重要？\n\n19. 部分所有权（fractional ownership）在 NFT 背景下是如何工作的？\n\n20.\
  \ NFT 可能会在虚拟现实环境中如何使用？\n\n## Keywords\n\n- **去中心化金融 (DeFi)**：一种构建在区块链网络上的金融应用生态系统，没有中央中间者。\n\
  - **非同质化代币 (NFTs)**：由区块链技术支持的独特数字资产，代表对某特定物品的所有权。\n- **智能合约**：区块链上的自执行代码，在满足预设条件时运行。\n\
  - **流动性池**：锁定在智能合约中的代币池，用于为去中心化交易所提供流动性。\n- **收益耕矿**：通过为 DeFi 协议提供加密流动性来获得奖励。\n\
  - `Aave`：一种 DeFi 贷协议，用户可以在其中贷借加密货币资产。\n- `Uniswap`：一种使用自动做市商模型和流动性池的去中心化交易所协议。\n\
  - `ERC-721`：一种以太坊代币标准，用于代表收藏品等独特的、非同质化的数字资产。\n- `ERC-1155`：一种以太坊代币标准，可以在同一个合约中同时代表同质化和非同质化代币。\n\
  \n\n\n此外，中链（Relay Chain）还促进了跨链互操作。在单链生态系统中，资产和信息往往会被隔离在各个网络内部，导致在不同的区块链之间移动资产或数据非常麻烦。中链通过提供一个框架，让这些区块链能够无缝通信，解决了这个问题。这是通过跨链消息传递（XCMP）和链间通信（ICMP）等机制实现的，这些机制允许平行链以一种*无信任*的方式交换消息和价值；这些消息可以是代币转移、智能合约或任何其他数据。\n\
  \n中链的共识通过一种名为提名权益证明（Nominated NPoS）的机制实现，这是典型权益证明模型的变体。`NPoS` 在验证者之外引入了提名者（nominators）的概念。在这个系统中，验证者在维护网络安全和完整方面仍然发挥着至关重要的作用，但他们得到了提名者的支持。提名者是利益相关者，他们不是自己验证交易，而是将自己的质押委托给受信任的验证者。通过这样做，他们可以共享这些验证者获得的奖励，但也分担了风险，包括其质押代币可能被削减（对恶意行为的惩罚）。该系统试图保护网络，任何试图颠覆系统的尝试在经济上都是受到抑制的。\n\
  \n## 平行链 (Parachains)\n\n平行链是特定于应用程序的区块链，它们接入中链以利用其安全性和共识机制。平行链的独特之处在于它们的主权。它们可以拥有自己的代币、治理模型和功能。平行链并行运行，同时处理多个交易和活动。它们以独立的能力运行，并针对特定的用用例进行了优化。\n\
  \n平行链的自主性允许开发者构建专门的区块链，而无需受于通用网络中常见的限制。然而，尽管具有独立性，但平行链并不是孤立的。通过中链的基础设施，它们与其他平行链甚至外部网络通信。这是通过\
  \ `XCMP` 实现的，该协议促进了 Polkadot 网络不同链之间消息和价值的无缝传输。\n\n成为平行链的过程涉及参与平行链插位拍卖，在拍卖中各种项目竞标以在指定时间内获取网络上的插位。一旦他们赢得插位，就会将代币质押到网络中，并本质上在此期间成为\
  \ Polkadot 生态系统的一部分。\n\n## 桥接 (Bridges)\n\n桥接是 Polkadot 生态系统中无名的英雄。它们作为 Polkadot\
  \ 与以太坊和比特币等外部区块链之间的连接组织。虽然中链和平行链侧重于在 Polkadot 内部创建一个优化的、可操作的生态系统，但桥接将这种互操作性扩展到了外部网络。本质上，桥接是唯一目的是将\
  \ Polkadot 与其他生态系统连接起来的专用区块链。\n\n桥接的运行方式是拥有一套自己的验证者，他们负责在 Polkadot 网络和外部链之间中继消息。例如，比特币桥将由验证者负责确保任何发往\
  \ Polkadot 网络的比特币交易都是有效的。一旦确认，这些交易将被中继到 Polkadot 网络，在那里它们可以像源自那里一样被处理。换句话说，桥接为资产和信息在\
  \ Polkadot 和其他区块链之间的流动创建了通道，扩展了网络的范围和用途。\n\n## 高扩展性 (High scalability)\n\nPolkadot\
  \ 的架构实现了高扩展性。每个平行链独立地处理交易和状态，允许许多链并行处理交易。这种并行处理极大增强了网络的整体容量。\n\n## 互操作性 (Interoperability)\n\
  \n互操作性是 Polkadot 的核心特性。网络的中链、平行链和桥接共同工作，允许所有类型的数据和资产在不同区块链之间传输，确保 Polkadot 可以与其他区块链互操作。\n\
  \n## 币安智能链 (Binance Smart Chain)\n\nBNB Chain（以前被称为币安智能链 (BSC)）为开发和部署去中心化应用程序（dApps）提供了一个高效且具有效益的环境。通过其双链架构，该平台在维持能够执行智能合约的高性能网络的同时，促进了资产的无缝转移。由于其较短的区块时间和较低的交易费用而被广泛采用。\n\
  \n### BNB Chain 的架构\n\nBNB Chain 与币安链并肩运行，形成了一个双链系统。每条链在生态系统中都有其独特的用途：\n\n*   币安链\
  \ (Binance Chain)：币安链是原始链，专为简单的传输操作设计，特别是在 Binance DEX 上进行交易。它提供高速度和低延迟但不但不复杂的计算，因此不适用于\
  \ dApps。\n*   BNB Chain：另一方面，BNB Chain 通过实现以太坊虚拟机（`EVM`）扩展了原始币安链的功能。这允许开发者使用 Solidity\
  \ 创建智能合约并构建 dApps，同时从币安链提供的高速交易和低费用中受益。\n*   速度和低费用：BNB Chain 拥有约 3 秒的区块时间，比许多其他区块链要快得多。网络速度使其成为高吞吐量\
  \ dApps 的极佳选择。\n\n此外，与其他智能合约平台相比，BNB Chain 的交易费用异常低，使其对开发者和用户来说都是非常有吸引力的平台。\n\n\
  ### 与 BNB Chain 交互\n\n要与 BNB Chain 交互，我们可以使用币安智能链 Web3 者以及熟悉的工具如 `Truffle` 和 `Remix`。\n\
  \n要部署此合约，首先配置 `Truffle` 以连接到 BNB Chain 网络：\n\n```javascript\n// truffle config.js\n\
  \nmodule.exports = {\n  networks: {\n    bsc: {\n      provider: () => new HDWalletProvider(mnemonic,\
  \ `https://bsc dataseed1.binance.org`),\n      network_id: 56,\n      gas: 5500000,\n\
  \      confirmations: 10,\n      timeoutBlocks: 200,\n      skipDryRun: true\n \
  \   },\n  },\n};\n```\n\n然后，你可以使用命令 `truffle migrate network bsc` 部署合约。\n\n## 以太坊替代方案对比\n\
  \n本小节提供了以太坊替代方案的对比，重点关注它们的优点、缺点和独特卖点。这帮助开发者在选择构建 dApps 的平台时理解需要考虑的权衡。\n\n### Solana\n\
  \nSolana 在区块链领域代表了一种独特且创新的方法，主要通过实现一种名为历史证明量证明（Proof of History）的新颖共识机制。\n\n\n\n\
  \n除了 PoH 之外，Solana 还整合了其他技术优化。这些创新协同工作，增强了网络效率，进一步提升了其处理海量交易的能力。这种速度与高吞吐量的结合使得 Solana\
  \ 成为目前最快的区块链之一，这对于要求快速交易时间的应用（如去中心化金融（DeFi）平台、游戏和高频交易系统）来说是一个关键优势。\n\nSolana 的另一个显著特点是其极低的交易成本。Solana\
  \ 网络上的交易费用通常仅为美分的一角，这一率远低于许多其他主流区块链平台。这种效益对开发者和用户来说都非常有吸引力，因为它使得高频、低成本交易成为可能，为区块链应用开启了广泛的可能性。\n\
  \n然而，Solana 的架构确实存在某些挑战和缺点。一个核心关注点是它的中心化程度。与其他一些区块链相比，Solana 被认为更加中心化，这一因素源于其对基础设施的要求，例如为了有效参与网络需要高端硬件。对于将去中心化视为核心原则的区块链社区纯主义者来说，这种中心化可能是一个争议点。\n\
  \n此外，Solana 曾经历过不稳定的时期。这些停机和网络拥塞的情况引发了人们对网络在压力下可靠性和扩展性的担忧。虽然这些问题在快速发展的区块链技术世界中并不罕见，但它们凸显了持续开发和优化以确保稳定性和可靠性的重要性，特别是随着平台的增长以及吸引更多用户和应用。\n\
  \n## Polygon\n\nPolygon 是一种层 2 解决方案，为构建兼容以太坊的侧链提供了框架。这种架构在增强扩展性的同时，受益于以太坊稳健的安全模型。Polygon\
  \ 架构的一个关键方面是它能够与以太坊的安全模型保持强有联系。以太坊以其稳健且经过测试的安全机制而闻名，提供了一种保证和信任。通过与以太坊的安全协议对齐，Polygon\
  \ 继承了这些特性，对于寻求安全区块链环境的开发者和用户来说这是一个巨大的优势。\n\n在交易费用方面，与许多其他区块链平台相比，Polygon 提供了一个更经济的选择。交易成本的降低是其层\
  \ 2 身份的结果，这从以太坊主链卸载了大量的交易处理。然而，需要注意的是，尽管 Polygon 提供了较低的费用，但它并非完全独立于以太坊的 Gas 费用运行。由于\
  \ Polygon 的侧链最终会与以太坊主网交互（特别是对于某些类型的交易或安全过程），以太坊的 Gas 费用会间接影响使用 Polygon 的整体效益。\n\n\
  因此，虽然 Polygon 显著增强了扩展性并为 dApp 提供了一个成本效益的环境，但其性能和成本效率仍部分取决于以太坊网络的动态，特别是关于 Gas 价格。尽管如此，对于希望在快速发展的区块链技术格局中平衡扩展性、安全性和成本的开发者来说，Polygon\
  \ 仍然是一个极具吸引力的解决方案。\n\n## Polkadot\n\n正如前面的章节所述，Polkadot 的架构将专门的平行链（parachains）连接到中心中链，实现了互操作性和定制化。其创新的异构多链设计支持多种用例，但复杂的系统可能会给初接触该平台的开发者带来挑战。\n\
  \n## NEAR\n\nNEAR 协议以其独特的方法在区块链生态系统中脱颖而出，其核心是基于分片的权益证明证明（PoS）模型。该模型对于定义 NEAR 作为区块链平台的能力和吸引力至关重要。分片是将网络划分为若干较小部分（或分片），每个分片都能独立地处理交易和智能合约。这种分工显著增强了网络的整体容量，允许同时处理更多交易，从而提高了吞吐量。\n\
  \nNEAR 协议的核心关注点是可用性和用户体验，这些领域通常被认为是区块链技术采用的瓶颈。NEAR 的目标是简化开发者和终端用户与区块链技术的交互。这种以用户为中心的方法体现在平台的各个方面，从更平滑的交易流程到更直观的开发环境。通过降低准入门槛，NEAR\
  \ 试图将区块链技术的吸引力扩大到传统技术型受众之外。\n\n在交易速度和成本方面，NEAR 提供了一个极具吸引力的主张。该平台旨在促进低费用的快速交易，这种组合在区块链领域是备受青的。这使其对于希望在没有高交易成本负担的情况下构建可扩展去中心化应用的开发者来说是一个非常有力的平台。\n\
  \n然而，NEAR 面临的挑战之一是其开发者社区规模。与以太坊等成熟的平台相比，NEAR 是一个相对新的平台，其开发者生态系统较小。社区规模的差异可能导致在 NEAR\
  \ 上工作的开发者获得的资源和支持较少。较大的开发者社区（如以太坊）意味着更丰富的共享知识、工具、库和同行支持池，这可以显著简化开发过程。\n\n虽然较小的社区在资源和支持方面可能存在某些局限，但重要的是，区块链生态系统是动态且不断演变的。随着\
  \ NEAR 的持续增长以及其功能和优势被更广泛地认可，其开发者社区可能会扩大，带来更多资源和协作机会。\n\n## Cosmos\n\nCosmos 通过其相互连接但独立的区块链架构在区块链领域提出了一种独特的方法，这种架构通常被称为“区块链的互联网”。这种设计由\
  \ `Tendermint Byzantine Fault Tolerance (BFT)` 支撑，这种共识算法是实现 Cosmos 网络互操作性和效率的关键枢纽。\n\
  \n`Tendermint BFT` 是作为 Cosmos 整个生态系统的基础共识机制。它为高性能、快速终局性和安全性而设计，这些对于去中心化网络的有效运行至关重要。这种共识模型特别值得关注的是，它能够支持广泛的区块链应用，同时对去中心化网络中可能发生的各种故障和攻击保持稳健性。\n\
  \nCosmos 的标志是它强调各个区块链的互操作性和主权。Cosmos 网络中的每条区块链都独立运行，拥有自己的治理、代币和功能。这种独立性允许每个区块链进行高度定制和灵活化处理，以满足特定的需求和用例。`Inter-Blockchain\
  \ Communication (IBC)` 协议使这些不同的区块链能够无缝地通信和交易。这种互操作性是区块链领域的一项进展，因为它允许价值和信息跨越以前孤立的网络进行传输。\n\
  \n\n\n\n然而，Cosmos 中各个区块链的主权也伴随着权衡。与那些由单一区块链支撑整个网络的生态系统不同，Cosmos 缺乏一个由原生代币驱动的统一网络。这种缺乏单一主链的情况意味着，虽然各个区块链享有自主权，但它们无法从统一网络可能提供的集体力量中获益。对于某些用例，特别是那些依赖网络效应和大型统一区块链整合安全性的场景，这可能是一个缺点。\n\
  \nCosmos 生态系统中的应用链（appchains）概念代表了区块链技术领域的一个重大且创新的发展。应用链，或称为特定应用程序的区块链，是为特定应用程序或用例定制的区块链。这种方法与旨在支持各种应用程序和智能合约的通用型区块链形成对比。由于其基础原理和技术基础设施，应用链理念在\
  \ Cosmos 生态系统中引起了共鸣。\n\n在 Cosmos 中，每条区块链都独立运行，但可以通过 `IBC` 协议与其他区块链进行互操作。这种架构是应用链开发和部署的理想选择，因为它允许每条应用链专注于其特定的应用需求，同时能够与\
  \ Cosmos 网络内的其他区块链进行通信和交易。\n\n应用链之所以成为 Cosmos 生态系统的有力补充，有以下几个原因：\n\n*   **定制化与优化**：应用链可以针对其特定用例进行高度优化。这意味着底层的共识机制、治理模型和事务处理能力可以定制以适应特定应用程序的需求，无论它是\
  \ DeFi 平台、游戏应用还是供应链管理系统。这种定制化确保了区块链能够为其预期用途高效地运行。\n*   **可扩展性与性能**：通过专注于单一应用程序，应用链可以避免影响通用区块链的拥堵和扩展性问题。这种专业化允许更高效地处理交易并可能具有更高的吞吐量，这对于需要快速可靠处理的应用至关重要。\n\
  *   **主权与灵活性**：Cosmos 生态系统中的应用链拥有高度的主权。它们可以拥有自己的代币、治理模型甚至是独特的质押机制。这种独立性对于想要完全控制其区块链环境（包括如何维护和升级）的开发者和组织来说非常有吸引力。\n\
  *   **互操作性**：尽管具有独立性，但应用链受益于 Cosmos 的 `IBC`，使其能够与网络中的其他区块链无缝交互。这种互操作性是一个关键优势，因为它允许应用链与更广泛的生态系统交换信息和价值，增强了它们的实用性和集成潜力。\n\
  *   **降低开发者复杂性**：开发者可以专注于构建和优化他们的应用程序，而无需担心与广泛其他应用程序兼容的额外复杂性。这种关注可以带来更健壮、设计更好的应用程序，因为开发者可以将精力投入到特定功能和性能优化上。\n\
  *   **社区与生态系统增长**：应用链的引入可以吸引各种开发者和用户加入 Cosmos 生态系统。每条应用链都可以带来自己的社区，为 Cosmos 网络的整体增长和活力做出贡献。\n\
  \n## Algorand\n\nAlgorand 是一个值得关注的区块链平台，其特征是通过实现**纯权益证明（PPoS）**共识机制而脱颖而出。这种方法是 Algorand\
  \ 设计哲学和功能的核心。在 `PPoS` 系统中，验证者被随机且秘密地选择以参与共识过程，他们被选中的概率与其在网络原生代币 `ALGO` 中的质押大小成正比。这种模型确保了验证者选择过程更加公平和去中心化，与传统的权益证明系统形成对比，在后者质押越多的人影响力越大。\n\
  \nAlgorand `PPoS` 机制的一个关键特性是其对安全和效率的强调。通过减少少数大利益持有者的权力集中，Algorand 旨在避免诸如“无权益风险（nothing\
  \ at stake）”等问题。此外，`PPoS` 系统使 Algorand 能够实现高吞吐量和快速终性，使其成为需要快速可靠交易处理的各种应用的平台。\n\n\
  Algorand 的理论基础是该平台的另一个重要方面。Algorand 由由图灵奖得主计算机科学家 Silvio Micali 领导的学术和研究人员团队开发，其设计基于严谨的学术研究和原则。这种强大的理论支撑提升了平台的健壮性和可扩展性，使其在许多项目优先考虑快速部署而非基础严谨性的领域中脱颖而出。\n\
  \n但是，然而，尽管具有这些优势，Algorand 在开发者活动和平台成熟度方面面临着挑战。到目前，与以太坊等成熟区块链相比，它的开发者生态系统较为有限。这种局限性可能会影响希望在\
  \ Algorand 平台上构建的开发者的资源、工具和社区支持的可用性。活力且活跃的开发者社区通常是区块链生态系统创新和增长的关键驱动力，因为它促进了多样化应用程序的创建，并为问题解决和开发营造协作环境。\n\
  \n此外，Algorand 在区块链领域的相对新颖性意味着它仍处于成熟过程中。与其他有更多时间开发和完善其生态系统的区块链相比，Algorand 可能缺乏开发者和用户期待某些功能或集成。平台成熟度对于寻求构建和部署应用程序的开发者和组织来说是一个重要的考虑因素，因为它影响平台的稳定性、功能集和整体生态系统的健康。\n\
  \n## Aptos\n\nAptos 是一个新兴的层 1 区块链平台，因专注于提供高速性能、可扩展性和模块化框架而受到关注。Aptos 包含的设计和技术创新代表了区块链领域的一种新方法，特别是在解决现有平台面临的一些关键挑战方面。\n\
  \nAptos 的核心功能之一是使用**并行执行**。这项技术允许区块链同时处理多个交易，而不是使用许多其他区块链使用的顺序执行模型。并行执行显著增强了事务吞吐量，这对于旨在支持大规模和高频应用的区块链平台来说是一个关键因素。通过增加在给定时间内可以处理的交易数量，Aptos\
  \ 旨在缓解区块链网络中常见的瓶颈和拥堵问题。\n\n除了并行执行外，Aptos 还采用了 BFT 共识机制。BFT 机制以其稳健的安全性著称，即使网络中的某些节点表现恶意或被破坏，它也能有效运行。这种程度的安全性对于维护区块链的完整性和信誉至关重要，使其成为广泛应用程序的可靠平台。\n\
  \n\n\n\nAptos 的模块化设计是另一个值得关注的。这种方法允许更大的灵活性和易于升级，因为区块链的不同组件可以独立地进行开发和改进。这种设计有助于创新，并能够更灵活地适应区块链领域不断变化的需求和新兴技术。\n\
  \n然而，作为区块链领域一个相对较新的入者，Aptos 面临着与 `Ethereum` 或 `Binance Smart Chain` 等更成熟平台相比的生态系统规模较小的挑战。一个稳健且活跃的生态系统对于区块链平台的增长和采用至关重要，因为它不仅包含了开发者和用户，还包含了广泛的应用程序、工具、服务社区支持。生态系统的规模和活力会显著影响开发者构建有效应用程序的能力以及用户在平台上的体验。\n\
  \n## Sui\n\nSui 代表了区块链技术的一项显著进展，它引入了一种创新的架构，将基于 DAG 的 `Narwhal` 和 `Tusk` 内存池与高效的\
  \ `BFT` 共识机制相结合。这种组合旨在高效地处理复杂交易，特别是涉及共享对象（shared objects）的交易，这些交易在许多 dApp 中非常常见。\n\
  \n`Narwhal` 和 `Tusk` 协议在 Sui 的设计中起着至关重要的作用。`Narwhal` 作为内存池协议，负责管理待处理交易池。它使用有向无环图（`DAG`）结构，擅长高效处理海量交易。而\
  \ `Tusk` 则是一种高效的 `BFT` 共识协议，确保了交易的安全性和完整性。\n\nSui 的架构结构独特，可以处理两种类型的交易：简单交易和涉及共享对象的更复杂的交易。对于简单交易，它利用了拜庭一致广播（Byzantine\
  \ Consistent Broadcast）机制，该机制为速度和效率而设计。然而，对于涉及共享对象的交易（这些交易更复杂，需要在网络节点之间进行更高水平的协调），Sui\
  \ 采用了更为精密的方法。双协议系统允许 Sui 根据交易的性质优化其性能，同时确保速度和安全性。\n\n然而，这种架构的复杂性也带来了某些挑战。一个明显的缺点是开发团队需要维护的代码库规模增大。较大的代码库会导致更高的维护成本、更复杂的调试过程，以及潜在的开发周期变慢。这一方面在区块链领域尤为重要，因为创新速度和快速解决安全问题的能力至关重要。\n\
  \nSui 方法的另一个担忧是涉及共享对象的交易达到最终确定性（finality）所需的时间。由于 `Sui` 网络客户端在提交共识协议之前需要额外的开销，这些交易可能需要更长（大约\
  \ 2-3 秒）才能达到最终确认。在区块链应用中，交易速度可能是关键因素，这种延迟虽然看似很小，但可能是重大的，特别是对于需要实时或近实时处理的应用程序而言。\n\
  \n此外，作为一个相对较且未经证明的平台，Sui 面临着社区较小的挑战。在竞争激烈的区块链领域，建立和培养活力的社区对于其长期生存和成功至关重要。\n\n表 9.1\
  \ 列出了以太坊替代链及其相关的共识算法以及它们的优缺点：\n\n| 区块链 | 共识 | 优点 | 缺点 |\n| --- | --- | --- | ---\
  \ |\n| Solana | 历史证明 | 极高的速度和吞吐量，低费用 | 去中心化程度较低，稳定性担忧 |\n| Polygon | 具有 `Ethereum`\
  \ 安全性的 PoS 侧链 | 利用了 `Ethereum` | |\n| Polkadot | 提名权益证明 | | |\n| NEAR | 分片 PoS |\
  \ | |\n| Cosmos | Tendermint BFT | | |\n| Algorand | 纯 PoS | | |\n| Aptos | `HotStuff`\
  \ | | |\n| Sui | `Narwhal` 和 `Tusk` DAG 内存池 | | |\n\n\n\n\n\n```javascript\nmain().catch(console.error).finally(()\
  \ => process.exit());\n```\n\n要测试此脚本，你需要按照以下步骤操作：\n\n1. 初始化一个新的 Node.js 项目：为你的项目创建一个新目录并进入该目录。\n\
  \   在终端中运行 `npm init -y` 来初始化一个新的 Node.js 项目。这将创建一个 `package.json` 文件。\n\n2. 安装所需的依赖项：运行\
  \ `npm install @polkadot/api` 来安装 `@polkadot/api` 包。该包允许你与 Polkadot 网络进行交互。\n\n\
  3. 创建脚本：创建一个新的 JavaScript 文件（例如，在第 1 步创建的项目根 目录下创建一个名为 `polkadot_connect.js` 的文件），然后将上述脚本粘贴到该文件中。\n\
