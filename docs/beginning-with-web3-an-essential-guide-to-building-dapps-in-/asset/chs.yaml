  \n# 第 6 章 去中心化存储简介\n\n## 引言\n\n在本章中，我们将探索去中心化存储系统领域，特别关注星际文件系统（IPFS）和 Filecoin。我们将探索支撑\
  \ IPFS 的基础原理和架构，研究其在数据存储和检索方面的创新方法。我们还提供了一份关于如何设置 `IPFS` 节点、向网络添加文件以及使用内容标识符（CID）获取数据的实用指南。接下来，我们将关注\
  \ Filecoin，这是一种以去中心化方式激励数据存储的网络，并将讨论其协议、其在促进去中心化存储方面的作用，以及它与 `IPFS` 的协同作用。最后，我们将讨论去中心化系统中数据可用性和隐私性的关键方面，阐明数据复制技术、用于数据隐私的加密以及确保数据完整性和可用性的方法。通过本章，我们旨在让读者全面理解去中心化存储系统及其彻底改变数字世界中存储和访问数据方式的潜力。\n\
  \n## 结构\n\n本章涵盖了以下主题：\n\n*   `IPFS` 简介\n*   设置并与 `IPFS` \n*   以去中心化的方式存储和检索数据\n\
  *   理解 `Filecoin`\n*   确保数据可用性和隐私\n*   在 `Filecoin` 本地节点中存储文件\n\n## 目标\n\n通过本章，读者将对\
  \ `IPFS` 及其原理有全面的理解。他们将探索该协议的架构，其旨在提供永久且去中心化的数据存储和共享方法。读者将学习如何与 `IPFS` 节点交互，包括向网络添加文件和使用内容标识符检索数据。\n\
  \n读者将接触 `Filecoin` —— 一个激励存储的去中心化存储网络，并理解它与 `IPFS` 的关系。他们将探索 `Filecoin` 协议的核心概念，包括存储矿、交易（deals）和存储证明。\n\
  \n本章还讨论了去中心化存储系统中的数据隐私措施，特别关注加密的作用。读者将学习去中心化存储系统中用于确保数据可用性的数据复制技术。\n\n最后，本章提供了一份关于使用\
  \ `Truffle` 在本地 `Filecoin` 节点上保存文件的实用指南。它概述了创建项目、配置 `Truffle`、添加图像、安装依赖、启动本地端点以及将文件保存到\
  \ `Filecoin` 的步骤。在本章结束时，读者将对去中心化存储系统及其改变我们存储和访问数据方式的潜力有稳健的理解。\n\n## IPFS 简介\n\n\
  本节介绍了星际文件系统（`IPFS`），这是一种旨在创建永久且去中心化的数据存储和共享方法的协议。你将理解支撑 `IPFS` 的原理、其架构以及内容寻址数据存储的概念。\n\
  \n### IPFS 的原理\n\n本节涵盖了支撑 `IPFS` 的原理、其架构以及内容寻址数据存储的概念。\n\n#### 去中心化\n\n`IPFS` 的首要原则是去中心化。与依赖中心化服务器的传统系统不同，去中心化消除了单点故障，增强了健壮性，并为所有用户提供了平等的机会。\n\
  \n#### 内容寻址\n\n然而，`IPFS` 采用了内容寻址。每个文件及其其中所有的区块都被赋予一个唯一的哈希值。不同用户存储的相同文件具有相同的哈希值，因此只需要存储一次。\n\
  \n#### 点对点网络\n\n`IPFS` 的第三个原理是使用点对点（`P2P`）网络。`IPFS` 运行在 `P2P` 网络，允许用户之间直接共享数据。当用户请求文件时，`IPFS`\
  \ 网络会找到存储该内容的最近节点，从而减少延迟和带宽消耗。`IPFS` 的这种 P2P 特性还培养了用户之间的社区感。\n\n#### 原理的汇聚\n\n这三项原理——去中心化、内容寻址和点对点网络协同工作，定义了\
  \ `IPFS` 的独特属性。它们共同构建了一个极具韧性且高效的文件系统。\n\n### IPFS 架构\n\n在本节中，我们将深入研究 `IPFS` 的架构。我们将剖析系统的主要组件——对象、文件、命名和路由，并理解这些元素如何协调工作以实现真正的去中心化分布式文件系统。\n\
  \n#### 对象\n\n`IPFS` 架构根本上构建在对象概念之上。在这种背景下，一个对象包含数据块和一组指向其他对象的链接。每个对象都有一个唯一标识符，它是该对象内容的加密哈希值。这种由唯一哈希标识的相互链接的对象系统形成了\
  \ `IPFS` 数据模型的基础，也称为 Merkle 直接无环图（DAG）。\n\n#### 文件\n\n\n\n\n\nIPFS 中的文件仅仅是包含数据的对象。大文件被分成更小的数据块，每个数据块都被存储为一个独立的对象。然后，一个父对象将所有这些数据块链接在一起，从而保留文件结构。这种划分和链接策略实现了高效的数据管理和检索，特别是对于大文件，因为如果只需要文件的部分内容，就不需要下载整个文件。\n\
  \n## 命名 (#toc.xhtml#za178)\n\nIPFS 中的命名通过一个名为星际命名系统（IPNS）的系统进行。该系统允许对数据进行可变引用。虽然\
  \ IPFS 的内容寻址特性为每个文件提供了唯一且不可变的哈希值，但通常需要在保持引用一致性的同时更新文件。IPNS 通过创建一个指向文件不可变哈希值的独立、**可变**哈希值来实现这一点。当文件被更新时，IPNS\
  \ 哈希值保持不变，但它现在指向了文件的新版本。\n\n## 路由 (#toc.xhtml#za179)\n\nIPFS 中的路由由分布式哈希表（`DHT`）处理。在这个系统中，网络中的每个节点都持有关于某些对象以及哪些节点正在存储这些对象的信息。当用户需要特定文件时，他们可以查询网络，`DHT`\
  \ 将引导他们找到持有该文件的最近节点。该系统确保了即使在大规模分布式网络中，也能实现高效的数据发现和检索。\n\n## 统一组件 (#toc.xhtml#za180)\n\
  \nIPFS 的架构是这些组件复杂但高效的组合。对象构成了数据的基本单元，通过链接形成文件。IPNS 为这些对象提供了可变引用，允许在更新后仍保持文件引用的一致性。最后，`DHT`\
  \ 促进了高效路由以定位和检索数据。这些组件同步工作，构成了 IPFS 系统的核心，实现了一个去中心化、分布式且高效的文件系统。\n\n总而言之，IPFS 架构凭借其独特的组件及其相互作用，为去中心化和分布式文件系统提供了蓝图。理解这一架构及其底层机制，对于欣赏\
  \ IPFS 为数字时代数据存储和共享带来的创新和潜力至关重要。\n\n## 内容寻址数据存储 (#toc.xhtml#zs86)\n\n本节深入探讨了内容寻址数据存储的概念，这是\
  \ IPFS 的核心特征。在这里，访问文件是基于其内容而非位置的，这种转变为更高效的数据检索和跨网络的最冗余铺平了道路。\n\n### 理解内容寻址存储 (#toc.xhtml#za181)\n\
  \n传统的存储系统严重依赖基于位置的寻址，数据通过其在服务器上的特定位置进行识别和访问。然而，IPFS 提出了内容寻址存储的范式转变。在这个系统中，访问文件和数据不是根据它们存储的位置，而是根据它们包含的内容。每个文件或数据块都被分配了一个唯一的加密哈希值，该哈希完全取决于其内容。此哈希作为数据的地址，有助于数据存储和检索的完全不同的方法。\n\
  \n### 内容寻址的优处 (#toc.xhtml#za182)\n\n内容寻址带来了几个显著优势。首先，它促进了数据完整性。由于哈希是从内容生成的，数据的任何更改都会导致不同的哈希。此功能允许用户验证其所检索数据的完整性。\n\
  \n其次，内容寻址有助于存储和带宽的高效利用。\n\n### 内容寻址存储 (#toc.xhtml#za183)\n\n在 IPFS 的背景下，内容寻址存储是一个基本原则。当你使用\
  \ IPFS 时，你需要它来完成安装。\n\n## 设置并与 IPFS 交互 (#toc.xhtml#zh62)\n\n本节提供了设置和与 IPFS 交互的实用指南。你将学习如何在你的机器上安装\
  \ IPFS。\n\n## 安装 IPFS 节点 (#toc.xhtml#zs87)\n\n本节为你提供安装 IPFS 的指令。\n\n### 前提条件 (#toc.xhtml#za184)\n\
  \n在继续安装之前，请确保你的系统符合以下条件：\n\n- 操作系统：IPFS 可以安装在 Linux、MacOS 和 Windows。\n- 软件：确保你的机器上安装了最新版本的\
  \ Go。\n\n### 下载并安装 IPFS (#toc.xhtml#za185)\n\n按照给步骤进行安装：\n\n1. 打开终端窗口。执行以下命令下载 IPFS\
  \ 分发：\n\n```bash\nwget https://dist.ipfs.io/ipfs/v0.9.1/ipfs_v0.9.1_linux_amd64.tar.gz\n\
  ```\n此命令下载适用于 Linux 的 IPFS 分发。如果你使用的是不同的操作系统，请将 linux 替换为 darwin（MacOS）或 windows。\n\
  \n2. 使用以下命令解压 tar 包：\n\n```bash\ntar xvfz ipfs_v0.9.1_linux_amd64.tar.gz\n```\n\n\
  3. 进入解压 tar 包后创建目录：\n\n```bash\ncd ipfs\n```\n\n4. 使用安装脚本安装 IPFS：\n\n```bash\nsudo\
  \ bash install.sh\n```\n\n5. 通过运行以下命令验证安装：\n\n```bash\nipfs version\n```\n\n###\
  \ 初始化 IPFS 节点 (#toc.xhtml#za186)\n\n安装 IPFS 后，你需要初始化你的 IPFS 节点。你可以通过运行以下命令来实现：\n\
  \n```bash\nipfs init\n```\n此命令将为你的节点生成一个唯一的对等身份（peer identity）并设置必要的配置文件。对等身份是一个在\
  \ IPFS 网络上唯一标识你的节点的哈希值。\n\n### 启动 IPFS 节点 (#toc.xhtml#za187)\n\n最后，你可以通过运行以下命令启动\
  \ IPFS 节点：\n\n```bash\nipfs daemon\n```\n`daemon` 命令启动 IPFS 节点并将其连接到网络。运行此命令后，你的\
  \ IPFS 节点将开始运行并准备好与 IPFS 网络进行交互。\n\n## 将文件添加到网络 (#toc.xhtml#zs88)\n\n在本节中，我们将详细介绍将文件添加到\
  \ IPFS 网络的过程。通过遵循这些步骤，你将学习如何为存储准备数据、为你的文件生成唯一的内容标识符，并让你的数据对整个 IPFS 网络可用。\n\n\n\n\
  \n\n在将文件添加到 IPFS 网络之前，确保你的数据处于正确的格式至关重要。IPFS 可以处理任何类型的文件，无论是文本文件、图像还是视频。为了本指南的演示，我们假设你有一个名为\
  \ `example.txt` 的文本文件，并想将其添加到 IPFS 网络。\n\n## 将文件添加到 IPFS\n\n要将文件添加到 IPFS，请使用 `ipfs\
  \ add` 命令并在其后输入你的文件名。以下是操作方法：\n\n1. 打开终端窗口（terminal window）。\n\n使用 `cd` 命令导航到包含该文件的目录。例如，如果你的文件在\
  \ `Documents`（文档）目录中，你将使用以下命令：\n```\ncd Documents\n```\n\n2. 使用 `ipfs add` 命令将文件添加到\
  \ IPFS：\n```\nipfs add example.txt\n```\n当你运行此命令时，IPFS 将显示一个作为该文件内容标识符的哈希，以及一条确认文件已添加的消息。\n\
  \n## 将文件广播到网络\n\n将文件添加到 IPFS 之后，该内容仅在你的本地节点上可用。要让整个 IPFS 网络都能访问它，你需要确保你的 IPFS 节点已在线。如果你的节点尚未运行，请使用\
  \ `ipfs daemon` 命令启动它：\n```\nipfs daemon\n```\n一旦你的节点上线，IPFS 网络中的其他节点就可以使用其内容标识符来检索你的文件。\n\
  \n总结来说，将文件添加到 IPFS 网络涉及准备数据、使用 `ipfs add` 命令将文件添加到 IPFS，以及确保你的 IPFS 节点已在线。通过遵循这些步骤，你可以让你的数据在整个\
  \ IPFS 网络中可用。在下一个小节中，你将学习如何使用内容标识符从 IPFS 网络中检索数据。\n\n## 使用内容标识符检索数据\n\n本小节提供了关于如何使用内容标识符从\
  \ IPFS 网络中检索数据的详细说明。在本指南结束时，你将掌握 IPFS 上数据交互的基础知识。\n\n### 理解内容标识符\n\n在 IPFS 中，添加到网络的每个文件或数据段都与一个独特的内容标识符关联，该标识符是文件内容的加密哈希。此标识符充当文件在\
  \ IPFS 网络中的地址。要从 IPFS 检索文件，你需要知道它的内容标识符。\n\n### 检索文件\n\n要从 IPFS 网络中检索文件，你可以使用 `ipfs\
  \ get` 命令并在其后输入文件的内容标识符。以下是操作方法：\n\n1. 打开终端窗口。\n\n使用 `ipfs get` 命令加上内容标识符来检索文件。例如，要检索内容标识符为\
  \ `QmXnnyufdzAWL5CqZ2RnSNgPbvCc1ALT73s6epPrRnZ1Xy` 的文件，你需要使用以下命令：\n```\nipfs get\
  \ QmXnnyufdzAWL5CqZ2RnSNgPbvCc1ALT73s6epPrRnZ1Xy\n```\n当你运行此命令时，IPFS 将下载与指定内容标识符关联的文件，并将其保存到当前工作目录中。下载的文件名将与内容标识符匹配。\n\
  \n如果你想为下载的文件指定不同的文件名，可以使用 `o`（或 `output`）选项加上所需的文件名。例如，要下载文件并命名为 `example.txt`，你将使用以下命令：\n\
  ```\nipfs get QmXn...73s6epPrRnZ1Xy o example.txt\n```\n总结来说，从 IPFS 网络检索数据就像使用适当的内容标识符运行\
  \ `ipfs get` 命令一样简单。这种数据检索的便利性是 IPFS 内容寻址存储模型的众多优势之一。在下一章中，我们将探索与与 IPFS 网络交互相关的更多高级主题。\n\
  \n## 以去中心化的方式存储和检索数据\n\n本节涵盖了 IPFS 等去中心化系统中数据存储和检索的工作原理。你将理解数据分布的协议、内容标识符在检索中的作用，以及如何实现冗余。\n\
  \n### 数据分布协议\n\n本小节详细查看了支撑 IPFS 数据分布的协议。它重点关注了节点（peers）在托管和传播数据方面所起的重要作用，并说明了这些协议如何促进跨网络的高性且高效的数据分布。\n\
  \n#### 节点的作用\n\n在 IPFS 中，每个运行 IPFS 节点的节点都成为网络中的一个节点。这些节点是 IPFS 节点的基础构建模块，它们共同托管和共享数据。当一个节点将文件添加到\
  \ IPFS 时，文件会被分成更小的块，每个块都托管在该节点上。然后，该节点将成为网络其他部分这些块的提供者（provider）。\n\n#### BitSwap\
  \ 协议\n\nIPFS 数据分布的主要协议是 BitSwap。BitSwap 的灵感源自 BitTorrent，是一种块交换协议，规定了节点如何请求、接收和发送块。当一个节点想要检索文件时，它会针对文件的块发送\
  \ BitSwap 请求。这些请求会发送给所有连接的节点。如果连接的节点拥有请求的块，它会将块传回。通过 BitSwap，IPFS 实现了跨网络的高效数据分布。\n\
  \n#### 分布式哈希表\n\nIPFS 数据分布的另一个关键组件是分布式哈希表（DHT）。DHT 是一个去中心化的目录，节点可以在其中存储和检索关于谁拥有数据的信息。当一个节点将文件添加到\
  \ IPFS 时，它会向网络（通过 DHT）宣布它正在托管该文件的块。当另一个节点想要检索文件时，它查询 DHT 以找到哪些节点正在托管该文件的块。因此，DHT\
  \ 在连接 IPFS 网络中的数据请求者和提供者方面起着至关重要的作用。\n\n#### 确保高效的数据分布\n\n节点、BitSwap 和 DHT 的结合确保了\
  \ IPFS 弹性且高效的数据分布。节点托管并提供文件块，BitSwap 管理节点之间的块交换，而 DHT 帮助节点找到数据的位置。这三者协同工作，在网络中分布数据，使得\
  \ IPFS 成为一个健壮、去中心化且高效的数据存储系统。\n\n\n\n\n\n当用户想要从 IPFS 网络检索文件时，他们需要该文件的内容标识符（CID）。在收到检索请求后，IPFS\
  \ 使用该标识符在整个网络中查找文件的区块（blocks）。这一过程是位置无关的（location agnostic）。区块存储在何处并不重要，重要的是内容标识符。\n\
  \n由于不同用户存储的相同文件具有相同的标识符，IPFS 可以从拥有这些区块的最近节点检索文件，从而缩短数据检索时间并提高效率。\n\n## 内容标识符在检索中的优势\n\
  \n在数据检索中使用内容标识符具有多项优势。首先，它确保了数据的完整性。由于标识符是由文件内容生成的，用户可以根据标识符对检索到的数据进行验证以确认其完整性。\n\
  \n其次，它实现了去重。由于不同用户存储的相同文件具有相同的标识符，网络只需要存储文件的一个副本，从而节省了存储空间。\n\n最后，它允许位置无关的访问。用户可以从网络的任何地方检索数据，使得系统对网络变化和故障具有高度的韧性。\n\
  \n总之，内容标识符在 IPFS 的数据检索中起着至关重要的作用。它们确保了数据完整性，实现了去重，并允许高效、位置无关的数据访问。这种独特的数据检索方式是 IPFS\
  \ 网络力量和灵活性的关键方面。下一小节将深入探讨 IPFS 如何实现冗余，以确保数据的可用性和韧性。\n\n## 在去中心化网络中实现冗余\n\n本节讨论了\
  \ IPFS 如何在其去中心化网络中实现冗余。它强调了冗余对于数据可用性的意义，并探索了 IPFS 用于在多个节点之间复制数据的机制。\n\n### 冗余的重要性\n\
  \n冗余是指存储数据的多个副本的做法，以确保在出现潜在节点故障或网络问题时数据仍然可用。在像 IPFS 这样的去中心化网络中，冗余尤为重要。由于数据分布在节点网络中，数据的可用性取决于这些节点的可靠性。如果某个节点离线或出现问题，如果没有足够的冗余，它托管的数据可能会变得不可用。\n\
  \n### IPFS 中的数据复制\n\nIPFS 采用了多种策略来实现冗余并确保数据可用性。当一个文件被添加到 IPFS 网络时，它会被分成更小的区块，每个区块都有唯一的内容标识符。这些区块存储在添加文件的节点上。当另一个节点检索该文件时，它也会存储一份区块的副本，从而创建数据的冗余副本。\n\
  \n### 用于持久存储的固定（Pinning）\n\n为了确保重要数据在网络中可用，IPFS 使用了一种名为“固定”（pinning）的概念。固定是指用户指示其\
  \ IPFS 节点保留特定的文件或区块，使其即使在例行的垃圾回收过程中也不会被移除。当一个文件被固定时，它以及它引用的所有区块都会由节点持久地存储，从而确保它们在网络中的持续可用。\n\
  \n### 通过复制和固定实现冗余\n\n通过数据区块的复制和重要文件的固定，IPFS 在其网络中实现了高度的冗余。这种冗余确保了即使某些节点离线或出现问题，数据仍然保持可用。它也有益于\
  \ IPFS 网络的健壮性和韧性，使其一个可靠的去中心化数据存储和检索系统。\n\n总而言之，IPFS 中的冗余通过数据复制和固定实现，确保了数据的可用性和网络韧性。这些机制是\
  \ IPFS 网络运行的基础，并突出了去中心化数据存储系统的稳健性。随着我们继续探索 IPFS 的功能和优势，后续章节将提供对更高级概念和特征的更深入理解。\n\
  \n## 理解 Filecoin\n\n本节介绍了 Filecoin，这是一种去中心化存储网络，奖励存储他人文件的参与者。你将学习 Filecoin 协议、它在激励去中心化存储方面的作用以及它与\
  \ IPFS 的关系。\n\n### Filecoin 协议简介\n\n本节提供了 Filecoin 协议的概述，阐明了存储矿工（storage miners）、交易（deals）和存储证明（proofs\
  \ of storage）等概念。该该为为 coin 网络奠定了基础，规定了文件如何被存储、检索和激励。\n\n### 存储矿工\n\nFilecoin 协议的核心是存储矿工。这些承诺为网络提供存储的网络参与者。他们负责存储文件并产生存储证明。作为服务的回报，他们从付费存储数据的客户端那里获得\
  \ Filecoins，或者作为网络的区块奖励。\n\n## 交易\n\n在 Filecoin 中，当客户端想要存储一个文件时，他们与存储矿工达成一项交易（deal）。这项交易规定了存储条款，例如存储时长、要存储的数据量以及客户端支付给矿工的价格。一旦双方对交易达成一致，存储矿工就会存储客户端的数据并承诺在约定的时间内保留它。\n\
  \n### 存储证明\n\n存储矿工需要定期向网络提供存储证明，以证明他们忠实地存储了客户端的数据。这些证明有两种形式：复制证明（`PoRep`）和时空证明（`PoSt`）。\n\
  \n复制证明旨在确保存储矿工确实为客户端的数据分配了唯一的物理存储，而不是参与女巫攻击（sybil attacks）——在攻击中，矿工只需伪装存储了多个数据副本而实际上并没有。本质上，`PoRep`\
  \ 提供了加密证明，证明数据已被矿工唯一地复制并存储。这对于随时间维护数据冗性和可靠性至关重要。它还确保了网络的去中心化是真实的，而不是由少数假装成许多人的节点所维持的假象。`PoRep`\
  \ 过程涉及矿工对客户端数据编码、创建一个唯一的副本并生成可以被网络验证的证明。该证明作为矿工确实为数据分配了空间的承诺。\n\n另一方面，时空证明旨在验证存储矿工在特定时间段内维护了客户端的数据。虽然\
  \ `PoRep` 可以显示数据在最初被存储了，但它不能保证数据在存储合同期内会被安全保留。`PoSt` 填补了这一空白，要求矿工提供持续证明，证明他们仍在存储客户端的数据。在不同的间隔期间，矿工必须生成并提交新的证明，以显示数据仍在其存储中。这确保了矿工在通过初始\
  \ `PoRep` 验证后简单的删除数据。`PoSt` 过程通常涉及生成随机挑战，然后根据此挑战和存储的数据创建证明，随后由网络进行验证。\n\n\n\n\n\
  两种证明方法都采用了复杂的加密算法来确保其准确性和可靠性。例如，零知识简洁非交互式知识论证（`zk-SNARKs`）通常被用于使验证过程更加高效。这些证明的使用不仅是技术要求，也是业务上的必然选择。为了让企业信任诸如\
  \ `Filecoin` 这样的去中心化存储解决方案，需要一种稳健的机制来确保存储承诺得到履行。如果没有这些证明，去中心化存储的信任基石将会崩塌，使得几乎无法吸引对数据存储和安全有严苛要求的企业级客户。\n\
  \n从技术角度来看，实现这些证明涉及一系列定义良好的步骤。对于 `PoRep`，在接收到客户端数据后，矿工将通过类似 `Merkle tree encoding`\
  \ 的过程创建一个唯一的副本。随后将将生成一个加密证明，该证明通常基于 `Merkle tree` 的叶子节点，并可以提交到网络进行验证。对于 `PoSt`，网络会定期发布挑战挑战。矿工必须读取存储数据的特定部分，并根据这些读取内容和挑战生成新的证明。然后将该证明提交到网络进行验证。生成或验证这些证明的任何失败都可能导致矿工受到处罚，甚至被踢出网络。\n\
  \n因此，`Proof of Replication` 和 `Proof of Spacetime` 是 `Filecoin` 等去中心化存储网络安全与信任的基石。它们提供了严格的验证机制，这对于去中心化数据存储的技术和业务方面都至关重要。通过确保矿工对其存储承诺负责，这些证明维护了网络的完整性，从而使其成为关注数据安全的企业和个人的既可行又可靠的选择。\n\
  \n### 激励去中心化存储\n\n本小节深入探讨了 `Filecoin` 如何激励去中心化存储。它研究了 `FIL` 代币在补偿存储提供者方面的关键性作用，并讨论了去中心化网络中数据存储的经济动态。\n\
  \n#### FIL 代币的作用\n\n`FIL` 代币是 `Filecoin` 网络的原生加密货币。它们在激励网络存储方面起着至关的作用。存储矿工通过为客户端提供存储空间和服务来获得\
  \ `FIL` 代币。\n\n存储矿工获得 `FIL` 代币主要有两种方式：\n\n* 存储交易：客户端用 `FIL` 代币支付给矿工以存储其数据。价格在存储交易中约定，存储交易概述了存储协议的条款。\n\
  * 区块奖励：存储矿工还可以区块奖励获得 `FIL` 代币。在 `Filecoin` 网络中，矿工根据其存储能力被选中在区块链中创建新区块，存储能力是衡量他们为网络提供的存储数量的指标。当存储矿工被选中创建新区块时，他们将获得\
  \ `FIL` 代币作为奖励。\n\n#### 去中心化存储的经济学\n\n`Filecoin` 的经济模型旨在激励尽可能多的者为网络贡献存储。矿工提供的存储越多（达成的交易越多），他们获得\
  \ `FIL` 代币的机会就越高，无论是来自客户还是作为区块奖励。\n\n这创造了一个良性循环：随着越来越多的矿工加入网络赚取 `FIL` 代币，网络中的可用存储量就会增加。这种供应的增加可能会导致更具竞争力的价格，吸引更多客户加入网络，并鼓励现有客户存储更多数据。随着对存储的需求增加，`FIL`\
  \ 代币的价值也可能上升，进一步激励矿工。\n\n#### 平衡供需\n\n`Filecoin` 的经济模型还包括平衡存储供需的机制。例如，存储矿工必须质押一定数量的\
  \ `FIL` 代币来提供存储。这一要求确保了矿工在忠实存储数据方面有利益相关，因为如果未能履行存储承诺，他们将失去质押物。\n\n总之，`Filecoin`\
  \ 通过使用 `FIL` 代币和精心设计的经济模型来激励去中心化存储。通过用 `FIL` 代币奖励存储矿工并利用市场动态平衡供需，`Filecoin` 鼓励人们广泛参与网络，从而构建起一个健健且去中心化的存储生态系统。在下一个小节中，我们将研究\
  \ `Filecoin` 如何互补 `IPFS` 并增强去中心化网络的能力。\n\n### Filecoin 与 IPFS 的关系\n\n本小节阐明了 `Filecoin`\
  \ 与 `IPFS` 之间的关系。它强调了这两个项目虽然在功能上不同，但它们互为补充，为去中心化数据存储和检索提供了全面的解决方案。\n\n#### 互补的角色\n\
  \n`IPFS` 和 `Filecoin` 在去中心化网络中扮演着不同但互补的角色。`IPFS` 提供了一种数据去中心化和分布式存储及检索的协议，使互联网更快、更安全、更开放。而\
  \ `Filecoin` 则为去中心化存储提供激励层，激励个人和组织向网络贡献存储。\n\n#### IPFS 与 Filecoin 的集成\n\n`IPFS`\
  \ 和 `Filecoin` 可以无缝集成，提供一种稳健且有激励的去中心化存储解决方案。当文件被添加到 `IPFS` 时，它可以存储在网络中，但对其长期性没有任何保证。然而，当该文件存储在\
  \ `Filecoin` 中时，会与矿工达成交易，矿工承诺在获得报酬后存储一段时间。这种集成允许用户从 `IPFS` 的去中心化特性中受益，同时利用 `Filecoin`\
  \ 提供的激励和存储保证。\n\n#### 对去中心化网络的共同贡献\n\n`IPFS` 和 `Filecoin` 共同对去中心化网络的愿景做出了巨大贡献。`IPFS`\
  \ 的内容寻址模型和分布式架构消除了对中央服务器的需求，并允许以点点的方式进行存储和检索。`Filecoin` 通过激励存储增强了这一系统，从而确保价值数据随时间的可靠存储。它们共同提供了一个以去中心化方式存储和检索数据的强大平台。\n\
  \n结论，尽管 `IPFS` 和 `Filecoin` 是两个不同的项目，但它们关系密切且深度互补。它们协作为去中心化数据存储和检索提供了完整的解决方案。通过它们的集成，它们确保了去中心化网络不仅可行，而且高效、可靠且具有激励。\n\
  \n## 确保数据可用性和隐私\n\n本节讨论了在去中心化存储系统中如何维护数据可用性和隐私。它涵盖了数据复制技术、加密等隐私措施以及验证数据完整性和可用性的方法。\n\
  \n### 数据复制技术\n\n\n\n\n\n数据复制是将数据复制并存储在跨网络中多个位置的过程。在去中心化存储系统中，复制是一项确保数据可用性和容错性的关键技术。通过维护同一份数据的多个副本，系统可以保证即使存储数据的某些节点变得无法访问或故障，也能确保对数据的访问。\n\
  \n## IPFS 中的复制\n\n在 `IPFS` 网络中，数据复制随着节点检索数据而自然发生。当一个节点从网络中检索文件时，它会保留该文件块的副本。如果之后有另一个节点请求同一个文件，则该文件的块可以从原始源或任何已检索并存储了该文件的节点提供服务。这种方法结合\
  \ `IPFS` 的内容寻址特性，确保了相同的数据可以由多个节点提供，增强了数据的可用性。\n\n## Filecoin 中的复制\n\n在 `Filecoin`\
  \ 网络中，复制是交易达成过程的一部分。当客户端与存储矿工达成交易以存储文件时，存储矿工承诺在一段时间内存储该文件。客户端可以选择与多个存储矿工进行交易，导致文件的多个副本被存储在网络的不同部分。这种冗余确保了即使某些存储矿工离线或失败，文件仍然保持可用。\n\
  \n### 冗余与数据可用性\n\n通过数据复制实现的冗余，是确保去中心化存储系统数据可用性的关键策略。通过在各个节点上维护数据的多个副本，这些系统即使在面对节点故障或网络分区时，也能提供可靠的数据访问。\n\
  \n## 数据隐私与加密\n\n本小节讨论了去中心化存储系统中数据隐私的关键方面。它强调了加密在保护数据以及在分布式和去中心化背景下维护隐私方面的作用。\n\n\
  ### 数据隐私的必要性\n\n在任何数据存储系统中，存储数据的隐私都是首要考虑的问题。这在去中心化存储系统中尤为真实，因为数据分布在对等节点网络中。如果没有足够的隐私措施，敏感数据可能会被未经授权的对等节点访问。这需要使用强大的数据隐私措施，而加密是实现这一点的关键工具。\n\
  \n### 加密的作用\n\n加密将数据转换为只有拥有正确解密密钥的人才能读取的格式。它是维护数据隐私和防止未经授权访问数据的强大工具。在去中心化存储系统的背景下，加密可以用于确保存储在网络上的数据只能由授权个人访问。\n\
  \n### 客户端加密\n\n在 `IPFS` 和 `Filecoin` 中，一种常用的隐私措施是客户端加密。在将文件添加到网络之前，用户可以在其本地机器上对文件进行加密。该加密文件随后被添加到网络中，只有拥有解密密钥的用户才能解密并访问原始文件。这种方法确保了即使网络中的对等节点可以访问文件的块，如果没有解密密钥，他们无法理解文件的内容。\n\
  \n### 加密与去中心化存储\n\n加密的使用增强了去中心化存储系统的隐私性和安全性。通过在将文件添加到网络之前对其进行加密，用户可以确保即使数据存储在公共或半公共网络上，也能保持私密和安全。\n\
  \n## 验证数据完整性和可用性\n\n本小节探索了用于验证去中心化存储系统中数据完整性和可用性的方法。它阐明了加密哈希、复制证明（Proofs of Replication）以及检索证明（Proofs\
  \ of Retrieval）在确保数据随时间推保持完整且可访问的作用。\n\n### 使用加密哈希确保数据完整性\n\n在数据存储上下文中，完整性指的是数据在其整个生命周期内的准确性和一致性。在\
  \ `IPFS` 和 `Filecoin` 等去中心化存储系统中，数据完整性通过使用加密哈希来确保。当文件被添加到网络时，会生成文件内容的加密哈希。该哈希充当内容的标识符和文件的文件的校验和。文件内容的任何更改都会导致不同的哈希，允许用户通过将检索数据的哈希与其预期的哈希进行比较，轻松验证检索数据的完整性。\n\
  \n### 复制证明与检索证明\n\n除了加密哈希，`Filecoin` 网络还使用两种重要的证明来验证数据完整性和可用性：复制证明（PoRep）和时空证明（PoSt）。\n\
  \n复制证明（Proof of Replication）证明存储矿工创建了文件的唯一物理副本。当存储矿工承诺存储一个文件时，它会生成一个 `PoRep` 并将其提交到网络。该证明确保存储矿工不仅是声称存储了数据，而且确实为其分配了唯一的存储空间。\n\
  \n另一方面，时空证明（Proof of Spacetime）证明存储矿工在特定期间存储了客户端的数据。网络会定期挑战存储矿工为其存储的文件提供 `PoSt`。该证明确保了数据随时间推移保持可用且不变。\n\
  \n### 验证数据完整性和可用性\n\n通过使用加密哈希和证明，去中心化存储系统可以验证数据的完整性和可用性。用户可以信任即使在这些系统的去中心化和分布式环境中，其数据也会随时间保持完整且可访问。\n\
  \n结论是验证数据完整性和可用性对于去中心化存储系统至关重要。通过使用加密哈希和如 `PoRep` 和 `PoSt` 等证明，这些系统可以确保数据未被更改且可访问，从而增强去中心化存储的可靠性和信任度。\n\
  \n## 在 Filecoin 本地节点中存储文件\n\n本节提供了使用 `Filecoin` 本地节点存储文件的分步指南。\n\n在开始之前，请注意本指南假设你具有\
  \ JavaScript 和 Solidity 的基础知识，并对区块链和智能合约有了解。\n\n1. 首先，为你的项目创建一个新目录，然后进入该目录：\n\n\
  ```\nmkdir filecoin project\ncd filecoin project\n```\n\n2. 我们将使用以太坊开发环境 `Truffle`\
  \ 创建并部署我们的合约。\n\n3. 如果你还没有安装 `Truffle`，请全局安装它：\n\n```\nnpm install -g truffle\n\
  ```\n\n4. 现在，初始化一个新的 Truffle 项目：\n\n```\ntruffle init\n```\n\n5. 接下来，向项目添加一个图像文件。你可以将其命名为\
  \ `image.png` 并放在项目根目录下。\n\n6. 在此项目中，我们将使用 `@openzeppelin/contracts` 库用于 `ERC721`（以太坊上的非同质代币标准）以及\
  \ `ipfs http client` 与 IPFS 交互。使用以下命令安装这些依赖：\n\n```\nnpm install @openzeppelin/contracts\
  \ ipfs http client\n```\n\n在将文件保存到 `Filecoin` 之前，你需要启动本地节点。在本指南中，我们将使用 `Ganache`\
  \ 作为本地以太坊网络，以及本地 IPFS 守护进程。\n\n7. 如果你没有安装 `Ganache`，请全局安装它：\n\n```\nnpm install\
  \ -g ganache cli\n```\n\n8. 然后，启动 `Ganache`：\n\n```\nganache cli\n```\n\n9. `Ganache`\
  \ 将启动一个本地以太坊区块链。记下 RPC 服务器 URL（例如 `http://localhost:8545`）。\n\n10. 打开一个新的终端窗口并启动\
  \ `IPFS` 守护进程：\n\n```\nipfs daemon\n```\n\n\n\n\n\n## 11. 现在，你已经运行了本地端点，可以将文件保存到\
  \ Filecoin 了。\n\n## 12. 首先，编写一个脚本将你的文件添加到 IPFS 并返回其内容标识符（CID）。这需要 `ipfs http client`\
  \ 库：\n\n```javascript\nconst ipfsClient = require('ipfs http client')\n\nasync function\
  \ run() {\n  const ipfs = ipfsClient('http://localhost:5001') // replace with your\
  \ IPFS API address\n  const { cid } = await ipfs.add(fs.readFileSync('image.png'))\n\
  \  console.log(cid.toString())\n}\n\nrun().catch(console.error)\n```\n\n## 13. 你可以使用\
  \ Node.js 运行此脚本：\n\n```bash\nnode add-to-ipfs.js\n```\n\n## 14. 这将输出你文件的 `CID`，你可以用它从任何\
  \ `IPFS` 节点检索文件。\n\n## 15. 接下来，编写一个 `Truffle` 脚本来铸造 `ERC721` 代币，并将其令牌 URI 设置为该文件的\
  \ IPFS URL。这需要 `@openzeppelin/contracts` 库：\n\n```javascript\nconst { ethers } =\
  \ require(\"ethers\");\nconst { MintableERC721Token } = require(\"@openzeppelin/contracts/token/ERC721/ERC721Mintable.sol\"\
  );\n\nasync function main() {\n  const [deployer] = await ethers.getSigners();\n\
  \n  console.log(\n    \"Minting token with IPFS hash to the deployer account:\"\
  ,\n    deployer.address\n  );\n\n  const Token = await ethers.getContractFactory(\"\
  MintableERC721Token\");\n  const token = await Token.deploy();\n  await token.deployed();\n\
  \n  console.log(\"MintableERC721Token deployed to:\", token.address);\n\n  const\
  \ tx = await token.mint(deployer.address, \"ipfs://<your ipfs hash>\");\n  await\
  \ tx.wait();\n\n  console.log(\"Minted token with IPFS hash to the deployer account.\"\
  );\n}\n\nmain()\n  .then(() => process.exit(0))\n  .catch((error) => {\n    console.error(error);\n\
  \    process.exit(1);\n  });\n```\n\n## 16. 将 `<your ipfs hash>` 替换为你文件的 `CID`。你可以使用\
  \ `Truffle` 运行此脚本：\n\n```bash\ntruffle exec mint token.js network ganache\n```\n\
  \n现在，你通过铸造一个指向 IPFS 上文件位置的 `ERC721` 代币，在 `Filecoin` 上保存了一个文件。你可以在 `Ethereum` 账户之间传输此代币，以转移文件的所有权。\n\
  \n## Arweave\n\nArweave 成为区块链和 `Web3` 开发领域的一个创新平台，特别是对于那些寻求可靠去中心化数据存储解决方案的人来说。它通过引入被称为\
  \ `Blockweave` 的新概念，从根本上偏离了传统的区块链模型。这项技术能够以低成本且高效的方式存储大量数据，这对于需要数据的应用程序来说是一个至关重要的优势。\n\
  \n\n\n\n\n11. 什么是 Filecoin？它与 IPFS 有什么关系？\n12. 在 Filecoin 的背景下，什么是存储矿工、交易（deals）和存储证明？\n\
  13. Filecoin 如何激励去中心化存储？\n14. `FIL` 币在 Filecoin 网络中扮演什么角色？\n15. Filecoin 如何平衡存储的供需？\n\
  16. 有了哪些措施来确保去中心化存储系统中的数据隐私？\n17. 去中心化存储系统如何使用加密来保护数据并维护隐私？\n18. 数据复制如何确保去中心化存储系统中数据的可用性？\n\
  19. 密码学哈希在确保数据完整性方面起什么作用？\n20. 什么是复制证明和检索证明？它们在 Filecoin 中如何使用？\n21. 如何在本地 Filecoin\
  \ 节点上保存文件？\n22. 为 Filecoin 项目配置 `Truffle` 的步骤有哪些？\n23. 如何在 Filecoin 项目中添加并保存图像？\n\
  24. 如何在去中心化存储系统中验证数据的完整性和可用性？\n25. IPFS 和 Filecoin 的整合如何为去中心化存储提供全面的解决方案？\n\n##\
  \ 关键词\n\n* 跨际文件系统 (`IPFS`)：一种旨在创建永久且去中心化的数据存储和共享方法的协议。\n* 去中心化：`IPFS` 的核心原则，消除了对中央服务器的需求，允许以点对点的方式进行数据存储和检索。\n\
  * 内容寻址：一种根据内容而非位置来访问文件的系统，有助于实现跨网络的高效数据检索和冗余。\n* IPFS 架构：`IPFS` 的结构，包括其关键组件，如对象、文件、命名和路由。\n\
  * IPFS 节点：连接到 `IPFS` 网络的设备，可以向网络添加文件、检索数据并存储来自其他节点的数据。\n* 内容标识符（CID）：IPFS 中文件或数据块的唯一密码学哈希，允许直接访问数据。\n\
  * 数据分发协议：`IPFS` 中规定节点间如何共享数据的规则，实现了跨网络韧性且高效的数据分布。\n* Filecoin：一种去中心化的存储网络，通过奖励参与者\
  \ `Filecoin` 币来激励数据存储。\n* 存储矿工：Filecoin 网络中的参与者，通过为客户端提供存储来赚取 `Filecoins`。\n* 交易（Deals）：客户端与存储矿工在\
  \ Filecoin 中达成的协议，规定了存储条款。\n* 存储证明：存储矿工在 Filecoin 中提供的证明，用于证明他们忠实地存储了客户端的数据。\n*\
  \ 数据复制：存储数据多个副本的过程，以确保在网络中的可用性，即使面临潜在的节点故障或网络问题也是如此。\n* 冗余：维护同一数据的多个副本以确保其可用性的做法，是去中心化存储系统中的关键策略。\n\
  * 数据隐私：去中心化存储系统中采取的保护用户数据的措施，包括加密的使用。\n* 加密：将数据转换为只有拥有正确解密的人才能读取的格式的过程。\n* 密码学哈希：用于确保\
  \ `IPFS` 和 Filecoin 中的数据完整性。它们允许用户通过比较数据哈希与其预期哈希值来验证所检索数据的完整性。\n* 复制证明 (`PoRep`)：Filecoin\
  \ 中的证明，证明存储矿工为客户端的数据分配了唯一的物理存储空间。\n* 时空证明 (`PoSt`)：Filecoin 中的证明，证明存储矿工在特定时期内存储了客户端的数据。\n\
  * `FIL` 币：Filecoin 网络的原生加密货币，用于激励存储。\n* `Truffle`：一个以以太坊开发环境、测试框架和资产流水线，使得构建、部署和测试智能合约变得更容易。\n\
