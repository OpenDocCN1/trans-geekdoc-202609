  \n轻量节点为希望与以太坊网络交互但没有资源运行全节点的个人或服务提供了一个更易存储的选项。例如，手机钱包是轻量节点的一种类型。\n\n示例：运行轻量节点的手机钱包由于存储限制，不会下载整个以太坊区块链。相反，当进行交易时，钱包会向全节点请求必要的信息以验证交易。\n\
  \n## 账户\n\n账户是以太坊生态系统中的基础构建模块，作为各种网络操作的交易枢纽。它们不仅仅传统的数字钱包；它们是被赋予了复杂能力的独特实体。理解以太坊上的这些账户揭示了该平台多方面且动态的本质。\n\
  \n外部账户 (`EOAs`) 和合约账户构成了以太坊账户的两大类，每个账户都具有独特的特征和功能，驱动着以太坊网络内的各种活动。\n\n外部账户，顾其名，通过私钥受个人或组织的直接控制。这些私钥类似于加密密码，赋予账户所有者管理其账户和发起交易的专有权利。将\
  \ EOA 想象成邮箱：就像需要钥匙来打开邮箱并访问其内容一样，访问 EOA 并执行交易也需要私钥。\n\n让我们用以太坊用户 Alice 的例子来说明这一点。Alice\
  \ 创建了一个由 20 字节地址表示的 EOA，该地址是以太坊网络中的唯一标识符。此类地址的示例为 `0x3236D7aE3966f7598B5c71f877B152998b4619ee`。这个地址类似于电子邮件地址，使其易于识别和与其账户交互。拥有与其\
  \ EOA 关联私钥的 Alice 现在可以向其他账户发送 Ether（以太坊的原生加密货币）、支付交易费用或与智能合约交互。\n\n在实际场景中，Alice\
  \ 可能会决定向 Bob 发送 `1 ETH`。Alice 的账户 nonce（计数器，用于确保每笔交易只能被处理一次）会增加 1。这有助于防止重放攻击，即同一交易可能被多次广播。发送者随后使用其私钥对交易进行签名，作为数字签名的形式，在交易广播之前对其进行认证。另一方面，合约账户与\
  \ `EOAs` 的区别在于，它们由代码管理，而不是由私钥。\n\n## 交易\n\n交易是以太坊操作不可或缺的一部分，是存储从一个账户发送到另一个账户的消息签名数据包。它们包含了各种元数据，包括接收者地址、传输的\
  \ Ether 数量（如果有）、最大费用以及可选的附加数据。\n\n当交易形成时，发送者的账户 nonce（计数器，用于确保每笔交易只能被处理一次）会增加 1。这有助于防止重放攻击，即同一交易可能被多次广播。发送者随后使用其私钥对交易进行签名，作为数字签名的形式，在交易广播到网络之前对其进行认证。\n\
  \n网络中的节点会验证并传播这些交易，矿工会选取它们包含到新区块中。这种复杂的相互作用说明了以太坊网络内部稳健的安全机制，确保了每笔交易的完整性和真实性。\n\n\
  考虑一个以太坊用户，假设 John，他想向 Jane 发送 `3 ETH`。例如，John 的以太坊账户地址可能是 `0xA1B2C3D4E5F6G7H8I9J0K1L2M3N4O5P6Q7R8S9T0`，而\
  \ Jane 的可能是 `0xZ9Y8X7W6V5U4T3S2R1Q0P1O2N3M4L5K6J7I8H9G0`。\n\n\n\n\n\n在以太坊及许多其他区块链平台的语文中，`nonce`\
  \ 是一个使用一次并在每次后续操作中都会递增的数字。它是区块链安全性和共识协议的核心组件。特别对于以太坊而言，每个账户都有一个 `nonce` 值，用于跟踪从该账户发送的交易次数。每个新账户的\
  \ `nonce` 都从零开始。当发送第一笔交易时，`nonce` 增加到一，之后每笔交易都会继续加一。这一特性对于防止重放攻击至关重要，攻击者可能会试图重复或复制某笔交易。\n\
  \n考虑这个例子：Alice 拥有一个以太坊账户，向 Bob 发送了 1 ETH。在创建此交易时，Alice 当前的 `nonce`（假设为 15）将被包含在交易详情中。一旦交易被矿矿并包含以太坊区块链，Alice\
  \ 的账户 `nonce` 就会变为 16。\n\n现在，如果恶意者试图重新广播同一笔交易，欺骗网络从 Alice 的账户向 Bob 发送另一个 1 ETH，网络将拒绝它。这是因为重播交易中的\
  \ `nonce` (15) 小于 Alice 当前的 `nonce` (16)。通过这种方式，`nonce` 在维护以太坊网络交易的完整性和安全性方面发挥着关键作用。\n\
  \n一旦交易详情编译完成，John 用他的私钥对该交易进行签名，提供一个唯一的标识符以确认他确实是交易的发起者。这包数据（即签名交易）随后被广播到以太坊网络。\n\
  \n以太坊网络上的节点接收此交易，通过检查 John 的数字签名来验证其真实性，并在网络中传播。随后，该交易会被矿工获取，矿工通过解决复杂的数学问题来验证并将该交易包含以太坊区块链的一个新区块中。整个过程确保了\
  \ John 的 3 ETH 安全且不可争议地到达 Jane 手中。\n\n本质上，以太坊上的交易不仅仅是简单的价值转移。它们构成了网络交互的骨干，实现了复杂智能合约的执行并为去中心化应用提供了动力。通过确保这些交易是安全、真实且不可复制的，以太坊保证了其平台活动的完整性，从\
  \ John 到 Jane 的简单价值转账，到涉及多个合约账户的复杂交互均如此。\n\n### 区块 (Blocks)\n\n以太坊区块链从根本上是一个顺序的区块链，每个区块都容纳了关于交易、合约、余额和网络状态的丰富信息。这些区块由两个部分组成：区块头部和交易列表。\n\
  \n区块头部包含关键的元数据，包括前一个区块的哈希值（形成链）、时间戳、区块高度、工作量证明算法的难度、矿工地址、一个 `nonce`（随机数）以及所有交易的\
  \ Merkle 树根等其他数据。区块的第二部分是交易列表，记录了所有已验证并包含在该区块中的交易。\n\n为了说明这一点，想象一下以太坊区块链中的第 #10,000\
  \ 号区块。它的区块头部包含了第 #9,999 号区块的哈希值，将其安全地与链中的前一个区块相连。该哈希值是唯一的，即使发生最微小的更改，它也会发生剧烈变化，从而使篡改无处遁形。头部还包含第\
  \ #10,000 号区块被挖矿的具体时间戳、矿工地址以及所有交易的 Merkle 树根。\n\n头部还包含第 #10,000 号区块被挖矿的具体时间戳、矿工地址以及所有交易的\
  \ Merkle 树根。（注：根据指令保留了原文中的重复文本）。\n\n让我们用一个具体的例子来说明：假设 Alice 想要向 Bob 发送 1 ETH。这笔简单交易的基础\
  \ Gas 成本为 21,000 gas 单元。随后，Alice 指定了 Gas 价格，例如 50 Gwei（1 Gwei 等于以太坊的十分之一）。因此，交易的总成本将是\
  \ `21,000 * 50 = 1,050,000 Gwei` 或 `0.00105 ETH`。除了她发送的 1 ETH 外，该金额还将从她的账户中扣除。\n\
  \n### Gas (燃料)\n\n在以太坊中，“Gas”一术语指的是执行操作（如处理交易或执行智能合约）所需的计算量。每个单独的操作或计算步骤都有分配的 Gas\
  \ 成本，反映了其复杂性和所需的资源。\n\n为了计算交易的总 Gas 成本，以太坊将使用的 Gas（即所有单独操作的 Gas 成本之和）乘以 Gas 价格，Gas\
  \ 价格由发送者以每个单位以太坊的形式指定。通过这种方式，确定了发送者需要支付的总交易费用。\n\n此外，Gas 在以太坊生态系统中起到两个关键作用：\n\n\
  - 它缓解了合约执行期间无限循环的风险。例如，如果智能合约由于编程错误包含了无限循环，可能会消耗无限计算资源。通过将每次计算操作与 Gas 成本关联起来，以太坊确保每笔交易或智能合约的执行都受到有限计算限制，从而保护网络。\n\
  - 它激励矿工（工作量证明系统）或验证者（权益证明系统）优先处理交易。他们将获得包含在其挖掘或验证区块中的交易的费用。\n\n此外，在设置交易时，用户指定 Gas\
  \ 限额 (Gas Limit) 和 Gas 价格。Gas 限额是他们愿意为该交易花费的最大 Gas 量。如果交易所需的 Gas 少于限额，剩余部分将退还。\n\
  \n\n\n\n本质上，Gas（燃料费）是一种对以太坊网络上的计算任务进行衡量、限制和分配成本的关键性机制。它有助于维护网络的安全、公平性和效率，同时赋予用户根据其需求对交易进行优先级排序的灵活性。\n\
  \n## EIP 和 EIP-1559 对 GAS 的影响\n\n以太坊改进建议（`EIPs`）是重要的文档，包含了对以太坊协议拟议更改的技术规范和原理。它们是讨论并就以太坊网络所需的本质更新和升级达成标准的平台。\n\
  \n`EIPs` 在驱动以太坊生态系统的演进中起着至关重要的作用。它们充当桥梁，协调开发者、用户、矿工和其他利益相关者关于实施改进和新的共识。一旦一个 `EIP`\
  \ 经过广泛讨论、测试并接受，它将成为网络更新的一部分，通常在网络硬叉期间部署。\n\n其中一个对以太坊交易费用机制产生深远影响的 `EIP` 是 `EIP-1559`，它于\
  \ 2021 年 8 月实施。\n\n在深入研究 `EIP-1559` 之前，用户在发送交易时指定 `gas price` 和 `gas limit`，本质上决定了他们愿意支付的金额以及其交易可以消耗的最大计算资源。矿工会优先处理\
  \ `gas prices` 较高的交易，这导致了寻求更快交易速度的用户之间爆发了竞价大战。\n\n`EIP-1559` 旨在解决 `gas prices` 的不可预测性和波动性，以及需求高峰期间的网络拥堵问题。该\
  \ `EIP` 引入了交易的标准 `base fee`（基础费用），它会根据网络活动自动调整。\n\n在这个新的模型中，每个区块都有一个 `target gas\
  \ usage`（目标 Gas 使用量）。`base fee` 会上升或下降以匹配这一目标，从而根据实际网络状况而非用户出价来设置 `gas price`。在\
  \ `base fee` 之上，用户仍然可以设置 `priority fee`（优先级费用），作为给矿工的小费，激励他们优先处理用户的交易。\n\n此外，`EIP-1559`\
  \ 通过销毁 `base fee` 为以太坊引入了通缩机制，每每笔交易都会有效地从供应量中移除部分 `Ether`。这种机制旨在平衡由挖矿奖励引起的通胀。\n\n\
  通过 `EIP-1559`，以太坊的 `gas prices` 变得更具预测性。`base fee` 的自动调整平滑了对网络拥堵的反应，减少了突然 `gas price\
  \ spikes` 的概率，并提升了用户体验和成本效益。\n\n然而需要注意的是，尽管 `EIP-1559` 改进了交易费的可预测性并引入了通缩机制，但它并没有解决以太坊的可扩展性问题。在网络使用率高时，交易费用可能大幅攀升，交易可能因为区块大小限制而失败。因此，像\
  \ `layer 2 Rollups` 和分片等额外的扩展性解决方案对于以太坊的未来仍然至关重要。\n\n## Ether \n\n`Ether` 是以太坊网络的原生加密货币，在促进和激励平台上的活动方面起着至关重要的作用。它是用户之间交换的媒介，是以太坊共识机制中矿工或验证者的激励措施，也是执行智能合约和进行交易的燃料。\n\
  \n让我们深入探讨这些方面以更好地理解 `Ether`，并结合实际示例、技术细节甚至代码段进行说明。\n\n### Ether 作为交换媒介\n\n作为以太坊的原生货币，`Ether`\
  \ 可以在账户之间传输，以换取商品、服务或其他加密货币。这使得它类似于以太坊生态系统传统法币。这里是一个简单的交易示例，Alice 向 Bob 发送了 `1 ETH`：\n\
  \n```json\n{\n  \"nonce\": 9,\n  \"to\": \"0xPublicKeyHash\", // Bob 的地址\n  \"value\"\
  : \"1000000000000000000\", // 1 ETH，转换为 Wei\n  \"gasPrice\": \"2000000000\", //\
  \ 单位为 Wei (20 Gwei)\n}\n```\n\n\n\n作为以太坊生态系统的命脉，Ether 的重要已超过了其作为简单加密货币的角色。它是一种实用代币，用于驱动智能合约、激励网络参与者，并维护平台的安全性和去中心化。此外，随着之前讨论过的如\
  \ `EIP-1559`（通过销毁部分交易手续费）和 `Ethereum 2.0`（从高能耗挖矿转向质押）等升级，Ether 的机制持续演进，确保了其在不断扩张的去中心化世界中具有持续的影响力和实用性。\n\
  \n## 共识算法\n\n共识算法对于维护区块链网络的完整性和安全性至关重要。它们确保参与网络的所有节点或计算机对交易的有效性和顺序达成共识。尽管网络是分布式且去中心化的，但这创造了单一的真理来源。\n\
  \n以太坊最初采用了名为 `Ethash` 的工作量证明（PoW）共识机制。然而，由于可扩展性和环境问题的考虑，以太坊决定转型为权益证明（PoS）共识机制，这一事件被称为“合并”（The\
  \ Merge），并于 2022 年 9 月发生。这一重大升级是 `Ethereum 2.0` 计划的一部分，旨在更高效地扩展网络，同时大幅降低能源消耗。\n\n\
  在本节中，让我们探索这两种共识算法及其工作原理、差异，以及从 PoW 到 PoS 的转型对以太坊性能和生态系统的影响。\n\n### 工作量证明与 Ethash\n\
  \n在 PoW 共识算法下，矿工竞争解决计算密集型的密码学难题，这一过程通常被称为挖矿。第一个解决谜题的矿工有权向区块链添加一个新区块，并获得区块奖励（新铸的\
  \ Ether）和交易手续费作为激励。\n\nPoW 机制为以太坊提供了稳健的安全保障，因为要更改已记录的交易需要攻击者控制总哈算力的 51%，考虑到所需的庞大计算资源，这在实践中几乎是不可能的。\n\
  \n`Ethash` 是以太坊使用的 PoW 算法，它的设计目标是“内存硬型”（memory-hard），以防止使用应用专用集成电路（`ASICs`）——即设计用于更高效挖矿的硬件设备。其目标是通过让挖矿使得图形处理器（`GPUs`）等通用硬件能够参与，从而实现公平竞争，而不是允许\
  \ `ASICs` 占据主。\n\n然而，PoW 机制因其高能耗和有限的可扩展性而受到批评。解决谜题和向链添加区块的计算竞赛需要大量的电力，导致了人们对此类操作环境影响的担忧。\n\
  \n此外，PoW 每次只允许挖掘一个区块，这限制了交易吞吐量，并在需求高峰期间增加了交易成本。\n\n### 合并：转向权益证明\n\n意识到这些挑战后，以太坊社区和开发者提出了一项升级，以从\
  \ PoW 转型为 PoS 共识算法。这一转型是 `Ethereum 2.0` 升级的重要组成部分，并在“合并”中得以实现。\n\nPoS 共识算法的工作方式与\
  \ PoW 完全不同。我们不再拥有矿工，而是验证者，他们锁定一定数量的 Ether 作为质押。然后，验证者根据其质押和其他因素被选中来创建新区块并验证交易。\n\
  \n在 `Ethereum 2.0` 中，PoS 机制运行在信标链（`beacon chain`）上，这是一条与原始以太坊 PoW 链并行的 PoS 区块链。验证者通过在现有的以太坊区块链的存款合约中锁定\
  \ `32 ETH` 来参与。这 `32 ETH` 代表了他们的质押，如果他们尝试验证欺诈交易，质押可能会被罚没（部分或全部没收）。\n\n验证者根据考虑验证者质押及其参与时间的随机过程被选中提议区块。被选中的验证者提出的区块，其他验证者进行证明（attest）。当区块接收到足够满足特定网络规则的证明时，该区块被认为完成。\n\
  \n转向 PoS 有几个重大影响：\n\n*   改进的扩展扩展性：PoS 允许引入分片链（`shard chains`），即与以太坊主链（现在称为 `beacon\
  \ chain`）并行运行的较小链。这增加了每秒可以处理的交易数量，极大地提高了可扩展性。\n*   更低的能耗：与 PoW 不同，PoS 不需要高能耗的挖矿。这使得以太坊变得更加环保，符合全球可持续发展目标。\n\
  *   提高的安全性：PoS 在经济上保护了网络免受 51% 攻击。攻击者需要拥有并质押至少 51% 的 Ether 总供应量，这极是不可能的且在经济上是不理性的，因为攻击者在以太坊生态系统的成功中拥有巨大的利益。\n\
  \n以太坊从 PoW 到 PoS 共识算法的转型代表了区块链进化的一个重要里程碑。它不仅解决了与环境可持续相关的担忧，还增强了网络的可扩展性，为更复杂、资源密集型应用程序提供了可能。\n\
  \n尽管有了这些进步，转型并非没有挑战，包括技术复杂性和网络参与者需要适应新机制。然而，以太坊稳健的社区以及对更高效、可扩展且可持续的区块链网络的承诺支撑了其持续的进步和创新。\n\
  \n转向 PoS 也表明了区块链领域更广泛的趋势，反映了人们对比传统 PoW 系统更可持续、更可扩展的替代方案日益增长兴趣。随着以太坊继续完善其 PoS 机制和其他二层解决方案，它为下一代区块链技术铺路。\n\
  \n## 智能合约\n\n智能合约通过为业务、金融和技术的各个方面引入自动化、无信任执行和确定性结果，重新定义了数字交易和协议的格局。这些自执行的脚本主要位于以太坊平台上，使得创建去中心化应用、代币、去中心化自治组织（`DAOs`）等变得不仅是可能的，而且变得日益常见。\n\
  \n在本节中，我们将重点介绍智能合约的核心概念、其工作原理、用途以及它们对多个领域的潜在影响。我们将探索它们在以太坊平台上的起源、与 `EVM` 的联系，以及它们如何成为构建各个领域创新解决方案的关键工具。\n\
  \n### 定义智能合约\n\n智能合约是一种在满足特定条件时自动执行的计算机程序。这些脚本允许在不需要第三方、中央机构、法律系统或外部执行机制的情况下进行可靠的交易。通过智能合约进行的交易是可追踪的、不可逆的，并且由于区块链网络中的所有节点必须验证它们，因此消除了操纵的风险。\n\
  \n智能合约的概念由计算机科学家和密码学家尼克·萨博（Nick Szabo）于 1994 年提出。然而，其实际应用直到区块链技术的出现，特别是在以太坊，它提供了一个创建和执行智能合约的平台。\n\
  \n### 以太坊与智能合约\n\n\n\n\n以太坊（Ethereum）是一个去中心化的开源区块链平台，以开创使用智能合约实现可编程交易的概念而闻名。它引入了\
  \ `EVM`，这是一个执行环境，使得这些合约可以在任何计算机上被读取和执行，从而促进了以太坊“世界计算机”的愿景。\n\n智能合约存储在太坊区块链的特定地址上，类似于普通的\
  \ `EOAs`。然而，与 `EOAs` 不同，它们包含代码并且可以拥有 Ether（以太坊网络上的原生加密货币）。它们通过创建并广播带有合约代码的交易被部署到以太坊上。\n\
  \n当智能合约被交易触发时，它会运行其代码以执行各种功能。这可能是可能是简单的操作，例如将 Ether 从一个账户转移到另一个账户；也可以是复杂的流程，例如管理去中心化交易所的逻辑或在\
  \ `DAO` 中投票。\n\n### 智能合约的语言：Solidity\n\n虽然智能合约可以使用多种语言编写（如 `Vyper` 和 `Yul`），但 `Solidity`\
  \ 是以太坊上编写智能合约最流行的语言。`Solidity` 是一种专为 `EVM` 设计的静态类型编程语言。它的语法与 `JavaScript` 类似，使得开发者相对容易学习并从中编写合约。\n\
  \n一个 `Solidity` 智能合约通常包含变量声明、函数和数据结构。每个合约可以包含状态变量声明、函数、函数修饰符、事件、`struct` 类型和 `enum`\
  \ 类型。此外，合约可以继承自其他合约，从而产生类似于面向对象编程中的层级关系。\n\n以下是一个用 `Solidity` 编写的简单智能合约示例：\n\n```javascript\n\
  // SPDX-License-Identifier: MIT\n\npragma solidity ⁰.8.7;\n\ncontract SimpleStorage\
  \ {\n    uint256 public num;\n    // 设置 'num' 值的函数\n    function setNum(uint256\
  \ _num) public {\n        num = _num;\n    }\n    // 获取 'num' 当前值的函数\n    function\
  \ getNum() public view returns (uint256) {\n        return num;\n    }\n}\n```\n\
  \n在此合约中，`num` 是存储在区块链上的一个状态变量。`setNum` 函数允许任何人设置 `num` 的值，而 `getNum` 函数允许任何人检索 `num`\
  \ 的当前值。\n\n当 `setNum` 函数被调用时，它会修改合约的状态。此更改会被记录在区块链上，更新后的状态将一直保留，直到下一个修改状态的函数被调用。\n\
  \n### 智能合约用例\n\n以太坊的智能合约推动了多个领域创新应用的爆发。\n\n在深入研究用例之前，我们需要定义以下概念：\n\n*   去中心化金融 (DeFi)：`DeFi`\
  \ 指运行在区块链上的金融服务。这些金融服务不受传统金融机构的控制。相反，它们使用智能合约来自动执行交易并执行协议。\n*   代币 (Tokens)：在区块链和加密货币的语境下，代币是数字资产或价值单位。它们可以代表各种事物，例如项目股权（证券型代币）、特定生态系统内的交换介质（实用型代币），甚至是房地产等现实世界资产（资产抵押型代币）。\n\
  *   去中心化自治组织 (DAOs)：`DAOs` 是运行在区块链技术上的组织结构。\n*   区块链中的身份系统：区块链上的身份系统是指在数字、去中心化环境中验证和管理身份的解决方案。\n\
  *   区块链中的验证系统：区块链中的验证系统是确保交易、数据或身份的有效性和完整性的机制。\n\n一些关键用例包括：\n\n*   去中心化金融 (DeFi)：智能合约作为\
  \ `DeFi` 应用的骨干，提供借贷、收益耕矿、去中心化交易所、衍生品等服务。由智能合约驱动的 `DeFi` 示例包括 `Uniswap`、`Aave` 和\
  \ `Compound`。\n*   代币：以太坊的 `ERC-20` 和 `ERC-721` 标准通过智能合约实现，分别实现了同质化代币（如稳定币）和 NFT\
  \ 的创建。代币用于数字收藏品、游戏资产以及在区块链上代表现实资产。\n*   去中心化自治组织 (DAOs)：`DAOs` 是由代码而非人员或中央权威运行的组织。它们使用智能合约处理逻辑、管理资源并执行规则。\n\
  *   身份与验证系统：智能合约可创建自主身份系统，允许用户控制自己的在线身份和个人数据。\n\n### 智能合约的未来\n\n虽然智能合约的普及带来了许多创新解决方案，但它们的潜力远未耗尽。在未来，它们通过自动化流程、消除中间环节和提供透明度，可能会彻底改变供应链管理、房地产、法律系统等领域。\n\
  \n例如，在供应链管理中，智能合约可以在货物到达目的地后自动向供应商执行支付。同样，在房地产领域，智能合约可以在收到资金后转移所有权。\n\n然而，智能合约的增长和采用也带来了挑战，包括安全问题、监管问题以及标准化的需求。智能合约的漏洞可能导致重大损失，正如臭名昭昭的\
  \ `DAO` 黑客攻击和 `Parity Wallet` 事件所示。因此，对智能合约进行严格测试、形式化验证和审计至关重要。\n\n此外，全球的监管机构仍在努力如何从法律角度对待数字资产和智能合约。这导致了不断演变的法律法规碎片化。\n\
  \n### 以太坊虚拟机\n\n以太坊虚拟机 (`EVM`) 是以太坊中智能合约的运行环境。它提供了执行智能合约所需的工具和资源，每个合约都是 `EVM` 的一个实例。理解以太坊虚拟机的操作机制需要理解它在以太坊生态系统中的地位、架构，以及与以太坊原生语言\
  \ `Solidity` 和字节码之间的关系。\n\n\n\n\nEVM 维护着一个调用栈用于管理合约调用。这与现代编程语言维护的调用栈非常相似。每当 EVM\
  \ 程序需要调用函数时（无论是在同一个合约中还是在不同的合约中），它都会在调用栈上推入一个帧（frame），执行函数，然后从栈中弹出该帧。\n\n## 以太坊生态系统与\
  \ EVM 的地位\n\n要理解 EVM 的重要性，必须首先理解以太坊的目标。以太坊被开发为一个 dApps 的平台——这些应用运行在计算机的 P2P 网络上，而不是单台计算机上。以太坊在区块链世界的重大突破是允许开发者创建智能合约，这些合约在满足特定条件时会自动执行交易。\n\
  \nEVM 是这些智能合约产生生命的地方。每个以太坊节点都运行在 EVM 上，以维护整个区块链的共识。没有了 EVM，就没有标准程序来执行脚本，这会导致以太坊网络变得混乱且不安全。它确保了以太坊网络中的每个节点都能相同的结果，并维护了区块链的安全稳健性。\n\
  \n## 以太坊虚拟机的架构\n\nEVM 是一个执行字节码的基于栈的虚拟机。基于栈意味着它遵循“后进先出”（LIFO）结构，执行从最后一个存储的项开始。EVM\
  \ 在沙箱环境中运行，该术语指的是一个运行应用程序的受控、隔离空间。它通过将进程彼此相互隔离，并与系统宿主（host）隔离开来，从而保护系统免受潜在恶意操作的影响。\n\
  \n在执行期间，EVM 无法访问网络、系统文件系统或其他进程。因此，它是运行不可信代码的安全环境，同时避免了对宿主系统或以太坊网络造成损害。\n\n### 从\
  \ Solidity 到字节码：执行路径\n\n以太坊中的智能合约通常用 Solidity 编写，这是一种专门为以太坊设计的高层语言，尽管也可以使用 Vyper\
  \ 等其他语言。然而，EVM 并不执行 Solidity 代码。它要求代码被编译为字节码，字节码是机器可以读取并执行的一系列操作码（opcodes）。\n\n\
  操作码（或操作代码）代表了由 CPU 处理的最低级别指令。它们通常以十六进制形式表示。例如，加法的操作码为 `01`，而减法的操作码为 `02`。\n\n在智能合约执行期间，EVM\
  \ 解码并执行由这些操作指定的的操作。这些操作范围从算术运算到与以太坊网络本身更复杂的交互。\n\n将高层 Solidity 程序转换为字节码的过程是通过编译器完成的。以太坊生态系统中最常用的是\
  \ Solidity 编译器，或 `solc`。\n\n### Gas 与以太坊虚拟机\n\n正如之前讨论的，EVM 的一个重要方面是 Gas（燃料）的概念。EVM\
  \ 中的每项操作都需要一定量的 Gas，并用 Ether（以太币）支付。这是计算量的衡量。更复杂的操作需要更多的 Gas，以确保操作的其计算成本得到合理的补偿。\n\
  \n### EVM 与合约的交互\n\n以太坊交易会触发账户之间的消息。如果接收账户是合约，它将激活合约代码。随后 EVM 将执行合约代码，直到执行完成或 Gas\
  \ 耗尽。代码执行可能会导致以太坊状态的变化，例如价值转账或数据存储。\n\n### EVM 在以太坊互操作性和未来中的角色\n\n以太坊虚拟机的设计具有在以太坊网络之外产生深远影响的潜力。EVM\
  \ 操作协议的标准化为其在非以太坊区块链上的实现开启了大门。这允许其他区块链可能执行以太坊的 dApps 和智能合约，促进了跨链协作和创新。\n\n在以太坊的未来，EVM\
  \ 继续发挥着关键作用。随着以太坊从 PoW 共识机制转向带有以太坊 2.0 的 PoS 机制，EVM 仍然处于以太坊计算和智能合约执行的核心。\n\n理解以太坊虚拟机有助于理解区块链的运作方式。从其在以太坊网络中的地位到执行智能合约的核心作用，EVM\
  \ 无疑是区块链的基石，不仅维护了区块链的网络，还为跨链协作和创新开辟了道路。\n\n## 去中心化应用\n\n去中心化应用（通常缩写 dApps）代表了区块链技术的创新用途，它们在区块链上自主运行。与运行在中心化服务器上的传统应用程序不同，dApps\
  \ 运行在网络上，使其避免了单点故障。\n\n为了理解 dApps，想象一下我们现在熟悉的互联网。我们使用的几乎每个在线服务（如社交媒体平台或在线银行）都是由一个存储用户机构机构。然而，这些机构实际上控制着你的数据并根据其意愿使用它，这引发了对隐私和所有权的担忧。dApps\
  \ 通过赋予用户数据控制权来解决这些问题。\n\ndApps 开发在以太坊等区块链平台上。以太坊区块链设计用于存储复杂的数据结构并在满足条件时执行智能合约。这允许开发者构建不仅仅是地址之间的简单交易。\n\
  \n一个 dApp 通常包括前端用户界面和后端智能合约。前端可以使用任何语言编写网页界面，但后端代码——智能合约——是 dApps 的独特之处。这种智能合约通常用\
  \ Solidity 编写用于以太坊 dApps，以去中心化的方式运行在区块链上。\n\ndApp 可能提供金融服务（如贷款或质押）、玩家拥有资产的游戏、去中心化交易所、创建和交易\
  \ NFT 的平台，甚至是一个去中心化的 Twitter。\n\n例如，考虑 DeFi 应用（去中心化金融）。与由中央机构管理的传统银行不同，DeFi 应用运行在区块链的智能合约。这些智能合约可以在区块链上直接执行贷款、借贷或赚利等操作，消除了对中间环节的需求。\n\
  \n由于以太坊网络的共享基础设施，dApps 还可以相互相互的操作。这形成了一个可以利用彼此和服务功能的去中心化应用生态系统。这在区块链领域通常被称为可组合性（composability），并导致了各种复杂\
  \ dApp 的产生。\n\n尽管人们对 dApps 存在巨大的期待，但重要的是，它们仍然是一项相对较的技术。因此，它们面临着包括可扩展性问题、不可预测的交易费用和智能合约漏洞在内的挑战。此外，由于没有治理这些应用程序的权威，恢复丢失或被盗的资产可能是困难的。\n\
  \n\n\n\n\n展望未来，以太坊 2.0 的发展、`Layer 2` 网络等扩展解决方案的引入，以及对智能合约安全和 `gas optimization`\
  \ 的持续研究，有助于解决一些现有挑战。\n\n这些进步可能会进一步推动 dApps 的采用，并带来一个更加去中心化的互联网，让用户对在线交互拥有更大的控制权、隐私性和安全性。这使得区块链技术的不断演进，dApps\
  \ 的未来成为一个非常值得关注的领域。\n\n### 代币 (Tokens)\n\n以太坊区块链上的代币是数字资产，可以被设计用于代表各种有形和无形物品，从商品到忠诚度积分，甚至是其他加密货币！以太坊协议的灵活性允许开发者使用智能合约创建具有各种功能的代币。\n\
  \n以太坊上最常见的代币类型是 `ERC-20`，代表以太坊请求意见 20。20 代表唯一的提案 ID 数字。`ERC-20` 代币是一种用于同质化代币的标准，意味着具有相同价值和特征的代币，类似于标准货币。\n\
  \n`ERC-20` 标准概述了六个主要函数：\n\n- `totalSupply`：此函数允许 `ERC-20` 代币实例计算并返回流通中代币的总量。\n-\
  \ `balanceOf`：此函数允许智能合约存储并返回所提供地址的余额。\n- `transfer`：此函数允许将一定数量的代币直接从所有者（调用函数的人）转移另一个地址。\n\
  - `transferFrom`、`approve` 和 `allowance`：这三个函数共同工作，允许特定的支出者从所有者的账户中提取资金，金额最高为特定数量。\n\
  \n以流行的稳定币 `Tether (USDT)` 为例。Tether 代币作为 `ERC-20` 代币发行，代表对发行者底层美元储备的索赔权。因此，每个 `USDT`\
  \ 代币充了数字美元。\n\n代币还为去中心化金融（DeFi）的概念铺平了道路，这是一种基于区块链构建的金融系统。`DeFi` 项目通常涉及用于各种目的的代币，例如提供流动性、赚利或治理投票。\n\
  \n虽然 `ERC-20` 标准可能是最为人知的，但以太坊上还有其他代币标准。例如，`ERC-721` 设计用于创建 `NFTs`。与同质化的 `ERC-20`\
  \ 代币不同，每个 `ERC-721` 代币都是唯一的，可以证明对资产的所有权。\n\n`CryptoKitties` 是一种基于区块链的虚拟游戏，允许玩家领养、养和交易虚拟猫，它是\
  \ `ERC-721` 代币的流行例子。每只猫都是一个 `ERC-721` 代币，具有使其与众独特的特征（`Cattributes`）。\n\n代币代表了区块链和加密货币世界的重大发展，因为它们能够实现广泛的应用和用例。从\
  \ `DeFi` 到数字艺术，代币拓宽了以太坊等区块链平台可能性的范围。\n\n### 预言机 (Oracles)\n\n预言机是区块链生态系统中的关键组件，特别是在太坊网络的智能合约领域。它们弥补了链上和链外环境之间的差距，为智能合约提供了与原生区块链之外的真实世界数据交互的方法。\n\
  \n想象智能合约是一个运行在自包含的、隔离系统上的计算机程序，无法访问外部世界。这就是预言机的用武之地：它们提供了智能合约有效运行所需的数据。从技术角度来说，预言机是由第三方服务提供的数据馈，它将外部数据带入区块链。\n\
  \n为了理解预言机的重要性，让我们考虑几个例子：\n\n- 保险：假设有一家保险公司使用智能合约根据航班状态或延迟信息自动理赔。\n- 去中心化金融 (DeFi)：`DeFi`\
  \ 协议需要各种加密资产的实时信息以维护贷款、借贷或自动交易。预言机在链外提供这些数据。\n\n预言机面临的一个关键挑战是其中心化本质；如果它们交付错误的数据，可能会成为故障点。这被称为预言机问题。已经提出并实施了多种解决方案来缓解这个问题，例如使用去中心化预言机并采用加密方法验证数据。Chainlink\
  \ 是一个提供去中心化预言机服务的知名项目。\n\n### 以太坊的可扩展性\n\n随着以太坊越来越受欢迎并采用，对扩展性的需求成为一个关键问题。以太坊的基础层（`Layer\
  \ 1`）在交易吞吐量、延迟和成本方面具有固有的局限性，使其支持大规模高频率应用面临挑战。作为回应，`Layer 2` 扩展解决方案和分片技术运而生，旨在显著增加网络的处理能力。\n\
  \n### Layer 2 扩展\n\n以太坊的 `Layer 2` 扩展解决方案代表了一套重要且创新的技术，旨在显著增加网络的处理能力。它们旨在解决以太坊基础层（`Layer\
  \ 1`）的固有局限性。Layer 2 解决方案通过在链外执行大多数操作，并在绝对必要时（通常通过批量交易）与主链交互来实现扩展。\n\n\n\n\n\n* \
  \  **状态通道 (State channels)**：状态通道将交易完全放在链外，仅以太坊主链用于通道的初始创建和最终关闭。参与者随后可以自由进行交易，无需支付\
  \ Gas 费用或等待区块确认。这种解决方案对于在固定参与者之间需要大量交易的应用特别有用，例如支付网络或多人游戏。\n\n*   **Plasma**：Plasma\
  \ 是一个构建与以太坊主链连接的子区块链的框架。本质上，Plasma 允许创建处理特定任务或智能合约的微区块链，并将结果定期批量处理并提交回以太坊主链。每个 Plasma\
  \ 链独立运行，从而增强了可扩展性。\n\n*   **Rollups (汇总)**：Rollups 是一种在链外执行交易并将交易数据发布在链上的第 2 层解决方案。主要有两种类型：乐观汇总\
  \ (Optimistic rollups) 和零知识汇总 (ZK-Rollups)。乐观汇总依赖于博弈论和挑战期来确保安全性。相比之下，zk-Rollups\
  \ 使用零知识证明来证明交易的有效性。这两种解决方案都能显著提高可扩展性，但在复杂性和支持的应用类型方面有所不同。\n\n*   **Validium**：Validium\
  \ 与 zk-Rollups 类似，但它不是将所有交易数据发布在链上，而是将其存储在链外。Validium 解决方案使用零知识证明验证交易，仅在链上发布证明，从而减少了链数据量。\n\
  \n这些第 2 层解决方案虽然方法各不相同，但都致力于解决以太坊的可扩展性问题。每种解决方案对某些应用比其他应用更有效，其选择取决于应用程序的具体需求。然而，最终目标仍然相同——让以太坊能够以更快、更低的成本处理更多交易，释放以太坊托管真正世界级去中心化应用的潜力。\n\
  \n## 分片 (Sharding)\n\n分片代表了以太坊的一种扩展解决方案。分片传统上用于数据库以提高效率，将数据分成更小的碎片（shard），每个碎片由不同的服务器管理。应用于区块链技术，分片为最紧迫的问题之一——可扩展性提供了解决方案。\n\
  \n在区块链中，网络中的每个节点必须验证并记录账本中的每笔交易。虽然这确保了高安全数据完整性，但是以速度和效率为代价的。随着网络增长，在每个节点上存储和处理每笔交易的负担导致了拥堵、交易时间变慢以及费用增加。\n\
  \n以太坊的分片方法涉及将网络分成 64 个较小的、互连的区块链，称为“分片”。每个分片处理网络部分交易负载，允许同时处理多笔交易。这种并行处理增加了网络的交易能力。\n\
  \n在分片的以太坊网络中，验证者被随机分配到特定的分片，在其中他们验证所有交易的子集。结果然后记录在分片各自的链上。这种方法允许实现高得的吞吐量——随着新分片的加入，可以同时处理更多的交易。\n\
  \n分片的一个主要担忧是分片间的通信，因为分片之间需要相互作用以维护整个网络的功能。以太坊通过引入“跨链” (crosslinks) 来解决这一挑战，跨链是以太坊主链中对分片链的引用。这些跨链实现了分片之间的通信并确保了它们的正确执行。\n\
  \n关于分片的另一个担忧是它可能会稀释网络的安全性。以太坊计划通过将验证者随机分配到不同的分片来克服这一点，使得恶意行为者难以预测并针对特定的分片。由于几乎不可能破坏所有分片，整个网络的安全性也得到了维护。\n\
  \n## 治理与开发 (Governance and development)\n\n以太坊已经成长为一个突破性的数字平台，支持去中心化应用和加密资产，并由其原生货币\
  \ Ether 提供支撑。以太坊的开发和治理由几个关键组织和流程提供支持，每个组织都有独特的角色和目标。这些实体在一个很大程度上基于开源模型的框架内运行，使以太坊生态系统能够去中心化和协作的方式演进。\n\
  \n以太坊生态系统中的主要组织之一是以太坊基金会 (Ethereum Foundation)。这个非营利实体为以太坊的研究开发提供必要的支持。以太坊基金会由研究人员和开发者组成，他们由基金会资助致力于平台的核心技术和基础设施。该组织致力于维护和增强以太坊，推动升级，并确保平台的安全性和稳定性。它在平台的标准化工作和培养以太坊社区方面也发挥着关键作用。\n\
  \n以太坊生态系统中的一个重要流程是以太坊改进提案 (Ethereum Improvement Proposals)，通常称为 `EIPs`。`EIPs` 是规定以太坊协议潜在变更的标准。这些提案在被接受或拒绝之前，会经过指定的编辑人员和更广泛以太坊社区的彻底审查。`EIPs`\
  \ 是以太坊治理模型的关键部分，因为它们允许系统化和结构化地引入平台的增强或修复。任何人都可以提出 `EIP`，然后对其进行公开透明的讨论，这使其成为一个民主且包容的过程。\n\
  \n以太坊治理和开发结构的另一个重要部分是 `AllCoreDevs Calls`。这些每两周一次的公开会议讨论了协议的更改，包括通过 `EIPs` 提出的提议。`AllCoreDevs\
  \ Calls` 为以太坊平台的技术事务提供了对话和决策场所。参与者包括负责在不同以太坊客户端中实现更改的客户端开发者，以及以太坊生态系统的其他成员。这些会议体现了开放辩论和讨论的精神，这对于像以太坊这样的去中心化生态系统至关重要。\n\
  \n以太坊社区大会 (`EthCC`) 是一项年度活动，为以太坊社区的聚集提供平台。该会议在巴黎举行，聚集了来自全球的构建者、用户、研究人员和开发者。它是知识共享、人脉建立和协作的场所。`EthCC`\
  \ 促进了思想的交流、项目的更新以及对以太坊未来的讨论。它是一个至关重要的活动，有助于保持社区的信息畅通参与，并推动平台的开发。\n\n以太坊猫牧羊人 (Ethereum\
  \ Cat Herders) 是一个社区项目管理小组，以太坊的开发中起着重要作用。该小组有助于协调和跟踪以太坊生态系统中进行的各项倡议和项目。他们确保不同的项目和团队能够高效工作，并确保朝着正确的方向进展。他们的角色对于确保平台的平稳持续开发至关重要。\n\
  \n\n\n\n\nEthereum Magicians 是一个公共论坛，为讨论以太坊路线图和变更提供平台。该论坛让更广泛的社区能够对以太坊的发展方向提供投入。它鼓励对以太坊的术、潜在升级和未来方向等各个方面进行开放对话和辩论。通过促进此类讨论，Ethereum\
  \ Magicians 为该平台动态化和由社区驱动的发展过程做了巨大贡献。\n\n以太坊的开发和治理过程在很大程度上遵循开源模型。这意味着任何人都可以通过 `EIPs`\
  \ 提出改进建议，并且所有的讨论和决策过程都是透明的。协议的重大更改需要开发者、矿工或质押者、节点运营商以及更广泛的以太坊社区的同。这种基于共识的方法在像以太坊这样的去中心化生态系统中至关重要，因为在那里，没有单一实体有权单方面实施更改。\n\
  \n这种协作式的开发和治理方法允许以太坊以一种去中心化且负责的方式不断进化。它确保了对平台的更改是民主过程的结果，反映了社区的集体智慧。然而，这种过程可能比较缓慢，并引发争议性的辩论，因为不同的利益相关者对拟议的更改可能持有不同的观点。这与具有自上而下层级的公司形成了鲜明对比，后者的决策速度很快，但通常没有同等水平的社区投入。\n\
  \n尽管存在这些挑战，开放协作的治理方法与以太坊推崇的去中心化、透明性和包容性原则完美融合。它让以太坊能够进化并适应不断的变化和用户需求，同时也培养了一个活力且参与度高的社区。以太坊治理模型证明在管理和开发复杂且快速发展的去中心化平台方面是有效的。\n\
  \n本质上，以太坊的治理和开发涉及关键组织和过程的，它们在透明、协作和社区参与的框架内共同工作。这些实体和过程在塑造以太坊的进化以及确保其保持稳健、安全和创新的平台方面发挥着至关重要的作用。以太坊开发和治理中遵循的开源和基于共识的模型已被证明是有效的，并与其去中心化和社区参与的理念高度契合。虽然这种模型面临挑战（例如决策速度较慢和潜在的分歧），但它也有自己的优势，包括促进创新、适应能力和强烈的社区感。\n\
  \n## 与以太坊网络交互\n\n作为区块链开发者，你可能熟悉 `ethers.js` 和 `Web3.js`，这是两个重要的节点包，用于与智能合约交互以及在兼容以太坊的区块链上处理交易。在本节中，我们将探索这两个库之间的区别以及它们是如何与以太坊网络交互的。\n\
  \n#### 前提条件\n\n在深入比较之前，必须具备以下前提条件：\n\n*   了解 JavaScript 和 `Node.js` 知识。\n*   对智能合约、`web3`\
  \ 和区块链技术有基本理解。\n\n### 理解库\n\n在软件开发的背景下，库是一组预先封装的可重用代码，提供特定的功能或一组密切相关的函数。使用库允许开发者通过引入现有代码而不是从零开始构建一切，从而节省时间和精精力。\n\
  \n想象你正在盖一栋房子，厨房需要一个炉灶。与其自己设计并建造炉灶，不如买一个预制的炉灶更有意义。同样，库就像是预制的组件，可以添加到你的程序中以执行特定任务。\n\
  \n### Ethers.js\n\n`ethers.js` 是一个强大的库，旨在与以太坊区块链及其生态系统进行交互。它最初是为了配合 `ethers.io`\
  \ 使用而创建，随着时间的推移，已进化成为更通用、多功能的库。\n\n#### Ethers.js 的核心特性\n\n以下是 Ethers.js 的核心特性：\n\
  \n*   在你的客户端应用程序中安全地管理私钥。\n*   为各种客户端（如 `Geth`、`Parity` 和众筹）导入和导出 JSON 钱包。\n*  \
  \ 支持多语言的 `BIP 39` 助记词（备份词）和 HD 钱包。\n*   使用元类从任何合约 `ABI`（包括 `ABIv2` 和人类可读的 `ABI`）创建\
  \ JavaScript 对象。\n*   通过 `JSON-RPC`、`INFURA`、`Etherscan`、`Alchemy`、`Cloudflare`\
  \ 或 `MetaMask` 等各种协议连接到以太坊节点。\n*   将以太坊命名服务 (`ENS`) 名称视为一级公民，可以用任何接受地址的地方。\n*  \
  \ 体积小且文档齐全。\n*   完全支持 TypeScript，拥有定义文件和完整的 TypeScript 源码。\n*   基于 MIT 许可证发布，允许免费使用和修改。\n\
  \n### Web3.js\n\n`Web3.js` 系列库的集合，方便开发者使用 `HTTP`、`IPC` 或 `WebSocket` 协议与远程或本地以太坊节点进行交互。它能够创建与以太坊区块链通信的网站或客户端。一些常见任务包括在用户之间传输以、从智能合约中查询数据以及部署智能合约。\n\
  \n### Ethers.js 和 Web3.js 的区别\n\n`Ethers.js` 和 `Web3.js` 之间的主要区别在于它们的 API 设计和使用模式：\n\
  \n*   `Web3.js`：提供一个单一的、实例化的 `web3` 对象，包含与区块链交互的方法。它将 `provider`（连接到以太坊网络的连接）和 `signer`（拥有访问私钥以对交易签名的权限）都封装在同一个对象中。\n\
  *   `Ethers.js`：将 API 拆分为两个独立的角色：`provider`（代表到以太坊网络的匿名连接）和 `signer`（持有私钥并可以签名交易）。这种关注点的分离为开发者在与区块链交互时提供了更大的灵活性。\n\
  \n### 示例比较\n\n以下是一些示例，用于突显在去中心化应用 (dApp) 中使用这两个库执行常用功能时的差异：\n\n*   使用 MetaMask 钱包创建\
  \ provider：\n\nWeb3.js:\n```javascript\nconst web3 = new Web3(Web3.givenProvider);\n\
  ```\n\nEthers.js:\n```javascript\nconst provider = new ethers.providers.Web3Provider(window.ethereum);\n\
  ```\n\n*   获取账户余额：\n\nWeb3.js:\n```javascript\nconst balance = await web3.eth.getBalance(\"\
  0x0\");\n```\n\nEthers.js（支持 ENS!）：\n```javascript\nconst balance = await provider.getBalance(\"\
  ethers.eth\");\n```\n\n*   实例化合约：\n\nWeb3.js:\n```javascript\nconst myContract =\
  \ new web3.eth.Contract(ABI, contractAddress);\n```\n\nEthers.js:\n```javascript\n\
  const myContract = new ethers.Contract(contractAddress, ABI, provider.getSigner());\n\
  ```\n\n*   调用合约方法：\n\nWeb3.js:\n```javascript\nconst balance = await myContract.methods.balanceOf(\"\
  0x0\").call();\n```\n\nEthers.js:\n```javascript\nconst balance = await myContract.balanceOf(\"\
  ethers.eth\");\n```\n\n## 结论\n\n本章讨论了以太坊如何成为最活跃的公共区块链，支持如 DeFi、NFT、代币、身份平台、去中心化交易所、预测市场等等去中心化应用。截至\
  \ 2023 年，其市值超过 2000 亿美元，已成为处于主导地位的智能合约平台。\n\n\n\n\n本章讨论了以太坊自 2013 年作为一个宏伟愿景的起源，以太坊已成功转向权益证明（proof-of-stake）共识模型，为扩展和实现其作为全球计算基础设施的任务奠定了基础。分片（sharding）和层\
  \ 2（layer 2）的持续工作将使以太坊支持下一个十亿用户，并开启 Web3 时代。\n\n随着社区的持续发展、构建者和用户快速增长的生态系统以及越来越多的企业采用，以太坊有望在未来十年内使用量和价值上实现强劲增长。以太坊开创的透明去中心化治理模型，将是在项目不断成熟过程中，应对该期间出现的挑战与机遇的关键。\n\
