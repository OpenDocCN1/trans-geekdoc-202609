  \n# 编译和部署智能合约\n\n本节将指导开发者使用 Truffle 和 Hardhat 编译和部署智能合约的过程。它提供了一个分步骤的教程，涵盖了从编写合约到将其部署到\
  \ Ethereum 网络上的所有内容。\n\n## 编写智能合约\n\n在 Ethereum 网络上开发 dApp 起于编写智能合约。这些自执行的合约用代码行包含了协议的规则，这些规则被存储并复制在\
  \ Ethereum 区块链上。在本节中，我们将引导你完成使用两个流行的 Ethereum 开发环境：Truffle 和 Hardhat 编写、编译和部署智能合约的过程。\n\
  \n### 编写智能合约\n\n编写智能合约需要深入理解 `Solidity`，这是用于在 Ethereum 区块链上实现智能合约的静态类型编程语言。首先，让我们来看一个简单的\
  \ `Solidity` 合约示例：\n\n``` solidity\n// SPDX License Identifier: MIT\n\npragma solidity\
  \ ⁰.8.0;\n\ncontract SimpleStorage {\n\n    uint data;\n\n    function set(uint\
  \ x) public {\n        data = x;\n    }\n\n    function get() public view returns\
  \ (uint) {\n        return data;\n    }\n}\n```\n\n在这个基础合约中，我们有一个无符号整数 `data` 和两个函数：`set`\
  \ 和 `get`。`set` 函数允许我们更新 `data` 的值，而 `get` 函数允许我们检索其当前值。\n\n编写合约是该过程的第一步。一旦你写好了智能合约，下一步就是编译它。这正是\
  \ Truffle 和 Hardhat 发挥用场的地方。\n\n## 编译智能合约\n\n编译合约将 `Solidity` 代码转换为 Ethereum 字节码，字节码可以在\
  \ Ethereum 虚拟机 (`EVM`) 上执行。要使用 Truffle 编译我们的 `SimpleStorage` 合约，可以使用以下命令：\n\n```bash\n\
  truffle compile\n```\n\n该命令将编译项目 `contracts` 目录下的所有合约。如果你只想编译特定的合约，可以使用合约名称：\n\n\
  ```bash\ntruffle compile SimpleStorage\n```\n\n同样，使用 Hardhat 编译合约的命令是：\n\n```bash\n\
  npx hardhat compile\n```\n\n## 部署智能合约\n\n编译完成后，最后一步将其部署到 Ethereum 网络。部署合约涉及向 Ethereum\
  \ 网络发送交易，包含合约的字节码和构造函数参数。部署后，合约将被分配一个地址，可以通过它与其交互。\n\n使用 Truffle，你可以使用 JavaScript\
  \ 编写的迁移脚本部署 `SimpleStorage` 合约：\n\n```javascript\nconst SimpleStorage = artifacts.require(\"\
  SimpleStorage\");\n\nmodule.exports = function(deployer) {\n  deployer.deploy(SimpleStorage);\n\
  };\n```\n\n然后可以使用 `migrate` 命令运行迁移：\n\n```bash\ntruffle migrate network development\n\
  ```\n\n使用 Hardhat，部署过程同样使用 JavaScript，类似于上面的 `deploy.js`：\n\n```javascript\nasync\
  \ function main() {\n  const SimpleStorage = await ethers.getContractFactory(\"\
  SimpleStorage\");\n  const simpleStorage = await SimpleStorage.deploy();\n\n  console.log(\"\
  合约部署到地址:\", simpleStorage.address);\n}\n\nmain()\n  .then(() => process.exit(0))\n\
  \  .catch(error => {\n    console.error(error);\n    process.exit(1);\n  });\n```\n\
  \n然后你可以使用 `run` 命令运行脚本：\n\n```bash\nnpx hardhat run scripts/deploy.js network localhost\n\
  ```\n\n\n\n\n在这两种情况下，你都运行运行一个本地以太坊网络（例如用于 Truffle 的 `Ganache` 或用于 Hardhat 的 `Hardhat\
  \ Network`），或连接到主网络（如 `Rinkeby` 或 `Mainnet`）才能成功部署。\n\n请记住，在将合约部署到主网络之前，始终对其进行彻底测试。区块链的不可变性意味着一旦合约部署，其代码就无法更改。\n\
  \n## 使用 Ganache 进行本地区块链开发\n\nGanache 在以太坊开发过程中起着至关重要的作用，它作为一个用于开发目的的个人区块链。本节将深入探讨如何设置和使用\
  \ Ganache 进行本地区块链开发、合约部署和交易测试。\n\n### 设置 Ganache\n\nGanache 为你的个人区块链提供了一个视觉化界面，这对于查看交易历史和理解发生的情况非常有帮助。以下是设置方法。\n\
  \n#### 安装\n\n以下是安装 `Ganache` 的步骤：\n\n1. 从 Truffle Suite 网站下载 `Ganache`：`https://trufflesuite.com/ganache/`。请根据你的操作系统选择正确的版本。\n\
  \n2. 按照安装向导中的提示安装 `Ganache`。\n\n#### 创建工作空间\n\n`Ganache` 中的工作空间是一个保存的配置文件，可以用来完全按照你的意愿设置个人区块链。要创建工作空间，请遵循以下步骤：\n\
  \n1. 打开 `Ganache` 并点击 `New Workspace` 按钮。\n\n2. 在 `Workspace` 标签页中，为你的工作空间命名。\n\n\
  3. 在 `Server` 标签页中，你可以配置网络设置。默认情况下，`Ganache` 运行在 `http://localhost:7545`。如果你需要可以更改这些设置，但通常没有必要。\n\
  \n4. 在 `Accounts & Keys` 标签页中，你可以设置创建账户的数量以及每个账户初始拥有的 Ether 数量。默认情况下，`Ganache` 创建\
  \ 10 个账户，每个 100 Ether。同样，你可以更改这些设置。\n\n5. 点击 `Save Workspace` 按钮保存你的设置。\n\n####\
  \ 理解界面\n\n一旦创建了工作空间并运行了个人区块链，你将看到 `Ganache` 界面。你可以看到以下内容：\n\n* `Accounts`：此页面显示所有已创建的账户。对于每个账户，它显示了地址、余额、私钥和交易次数。\n\
  \n* `Blocks`：此页面显示所有已挖出的区块。通过点击区块，你可以看到关于它的更多信息，例如区块中包含的交易。\n\n* `Transactions`：此页面显示所有已发送的交易。通过点击交易，你可以看到关于它的更多信息，例如交易哈希、发送者和接收者地址、发送的\
  \ Ether 数量以及使用的 gas。\n\n* `Contracts`：此页面显示所有已部署的合约。通过点击合约，你可以看到关于它的更多信息，例如合约地址和合约\
  \ `ABI`。\n\n* `Events`：此页面显示你的合约发出的所有事件。\n\n`Ganache` 是以太坊开发的一个强大工具。它为你提供了一个沙箱环境，你可以在其中自由地实验，而无需担心以太坊主网的成本或永久性。通过使用\
  \ `Ganache`，你可以加快开发进程，更高效地调试，并进行更彻底的测试。\n\n### 使用 Ganache 模拟交易\n\n设置好 `Ganache`\
  \ 后，你可以用它模拟交易并查看它们的工作原理。这在开发和测试智能合约时特别有用。在本小节中，我们将指导你如何在 `Ganache` 图形界面中执行交易并解释结果。\n\
  \n#### 执行交易\n\n要执行交易，你需要与智能合约交互。在这个例中，我们假设你已经在本地的 `Ganache` 区块链上部署了一个智能合约：\n\n1.\
  \ 首先，在你的开发环境中（例如 Truffle 或 Hardhat）打开你的智能合约。\n\n2. 找到你想要执行的函数并复制其函数签名。函数签名由函数名及其参数类型组成。例如，如果你的合约有一个函数\
  \ `set(uint256 _value)`，函数签名将是 `set(uint256)`。\n\n3. 在 `Ganache` 中，进入 `Contracts`\
  \ 页面并点击你想交互的合约。\n\n4. 将函数签名粘贴到 `Execute Function` 字段中。\n\n5. 在 `Arguments` 字段中输入函数参数。如果你的函数接受多个参数，请用逗号将它们分隔。\n\
  \n6. 点击 `Execute` 按钮。这将向你的合约发送一条交易，使用提供的参数调用指定的函数。\n\n#### 检查区块和交易\n\n一旦你执行了交易，就可以可以在\
  \ `Ganache` 中检查它。遵循给出的步骤：\n\n1. 进入 `Blocks` 页面。在这里，你将看到你的区块链上所有挖出的区块列表。最近的区块（应该包含你的交易）位于列表的最顶部。\n\
  \n2. 点击区块号查看关于区块的更多信息。这包括区块哈希、父区块哈希、受益者地址、区块难度以及包含的交易列表。\n\n3. 点击交易哈希查看关于交易的更多信息。这包括交易哈希、`nonce`、交易索引、发送者和接收者地址、传输的价值、使用的\
  \ gas、gas 价格以及输入数据。\n\n通过检查区块和交易，你可以更好地理解以太坊是如何工作的。你可以看到交易是如何分组到区块中的、gas 是如何使用的，以及状态是如何改变的。这些知识对于开发高效且安全的合约至关重要。\n\
  \n#### 解释交易详情\n\n交易详情提供了关于交易的重要信息：\n\n* `transaction hash`：交易的唯一标识。\n\n* `nonce`：代表发送者交易次数的数字。\n\
  \n* `transaction index`：交易在区块中的位置。\n\n* `from` 和 `to` 字段指示发送者和接收者。如果交易是创建合约，`to`\
  \ 字段将为空。\n\n* `value`：交易中传输的 Ether 数量。\n\n* `gas` 和 `gasPrice` 显示了交易使用的 gas 以及每单位\
  \ gas 的价格。\n\n* `input data` 包含了编码函数调用和参数。对于简单的 Ether 传输，此字段将为空。\n\n通过理解这些详情，你可以学习函数在被调用时的行为、消耗多少\
  \ gas 以及如何与其他合约或账户交互。\n\n#### 与 Truffle 和 Hardhat 使用 Ganache\n\n`Ganache` 作为一个个人区块链，是测试智能合约的理想工具。它与\
  \ Truffle 和 Hardhat 无缝集成，允许你在沙箱环境中执行和测试智能合约。本小节概述了配置 Truffle 和 Hardhat 以配合 `Ganache`\
  \ 使用的过程。\n\n#### 配置 Truffle 使用\n\nTruffle 使用通常名为 `truffle config.js` 的配置文件来了解如何连接到不同的以太坊网络。要将\
  \ `Ganache` 作为你的开发区块链，你需要将其添加到此配置文件中，如下：\n\n```javascript\nnetworks: {\n  development:\
  \ {\n    host: \"127.0.0.1\", // 本地主机（默认：无）\n  }\n}\n```\n\n\n\n\n**4.**`port: 7545`,\
  \ // 标准 Ganache UI 端口\n\n**5.**`network_id: \" \"` // 任何网络（默认：无）\n\n**6.** },\n\n\
  **7.**}\n\n在此配置中，`development` 是网络名称。`host` 和 `port` 指定了 Ganache 的运行位置，`network_id`\
  \ 用于匹配连接的区块链的网络 ID。\n\n3. 保存你的更改。现在，当你使用 `truffle migrate` 或 `truffle test` 等 Truffle\
  \ 命令时，`Truffle` 将连接到你的 Ganache 区块链。\n\n### 使用 Ganache 配置 Hardhat\n\nHardhat 也使用名为\
  \ `hardhat.config.js` 的配置文件来理解如何连接到以太坊网络。要连接 Hardhat 和 Ganache，你需要在此文件中将 Ganache\
  \ 添加为网络。按照以下步骤操作：\n\n1. 在项目根目录下打开 `hardhat.config.js`。\n\n2. 找到 `networks` 部分并为\
  \ Ganache 添加新网络。以下是一个配置示例：\n\n```\nnetworks: {\n  ganache: {\n    url: \"http://127.0.0.1:7545\"\
  \n  }\n}\n```\n\n在此配置中，`ganache` 是网络名称，`url` 指定了 Ganache 的运行位置。\n\n3. 保存你的更改。现在，当你使用\
  \ `npx hardhat test network ganache` 等 Hardhat 命令时，`Hardhat` 将连接到你的 Ganache 区块链。\n\
  \n记住，虽然 Ganache 是开发和测试的优秀工具，但它并没有完全模拟真实以太坊网络的行为。在发布之前，请始终在测试网或主网上测试你的合约。\n\n## 设置和使用\
  \ Infura\n\n本节介绍了 Infura，这是一种可扩展、可靠且安全的区块链基础设施服务。我们将介绍如何使用 Infura 在不运行全节点的情况下与以太坊网络交互，并详细说明如何设置以及将其集成到你的\
  \ dApps 中。\n\n#### Infura 及其用途\n\nInfura 是一个区块链基础设施平台和开发套件，为开发者提供了访问以太坊和 IPFS 网络的权限，无需维护和同步本地以太坊节点。Infura\
  \ 由 ConsenSys 支持，作为以太坊的网关，为开发者提供了轻松构建和部署 dApps 所需的工具。\n\n以下是开发者选择 Infura 的几个原因：\n\
  \n* 可扩展性：Infura 的基础设施设计为可根据项目需求自动扩展。这意味着随着你的应用程序的增长，Infura 可以处理增加的需求，让你专注于开发应用程序，而不必担心基础设施的局限性。\n\
  * 可靠性：Infura 提供可靠且不中断的以太坊网络访问。这对于需要持续访问区块链数据的应用程序至关重要。Infura 健壮的基础确保了即使在需求量很高，你的应用程序也能保持运行。\n\
  * 性能：Infura 的节点针对高性能进行了优化，这意味着你的应用程序可以快速、高效地检索并与区块链数据交互。这可以带来更好的用户体验，因为你的用户无需面对缓慢的加载时间或延迟的界面。\n\
  * 安全性：Infura 使用行业标准的安全协议来保护通过其基础设施的数据。这意味着你可以放心你的应用程序与以太坊网络的交互是安全的。\n* 易用性：Infura\
  \ 的主要优势之一是其简单性。只需几行代码，你就可以连接到以太坊网络。对于希望与以太坊交互但又不想管理基础设施的开发者来说，这特别有利。\n\n### 设置 Infura\n\
  \n在开始使用 Infura 之前，你需要注册并创建一个新项目。方法如下：\n\n1. 注册 Infura：\n   a. 访问 `https://infura.io/`。\n\
  \   b. 注册一个账户。\n   c. 输入你的邮箱并同意条款。\n\n2. 创建新项目：\n   a.在 Infura 仪表板上，点击 \"New Project\"\
  。\n   b.为你的项目命名。\n\n3. 获取你的项目 ID：\n   a.在 Infura 仪表板上，你会看到项目 ID。\n\n4. 设置 Infura\
  \ 端点：\n   a.在项目 ID 下方你会看到端点。\n   b. 端点格式为 `https://mainnet.infura.io/v3/YOUR_INFURA_PROJECT_ID`。还有测试网（Ropsten,\
  \ Kovan, Rinkeby, Sepolia, Goerli）。\n\n通过这些步骤，你已成功设置了 Infura。保护好你的项目 ID 和端点。在下一节中，我们将探索如何在开发工具中使用\
  \ Infura。\n\n#### 将 Infura 集成到 dApps\n\n将 Infura 集成到 dApp 是那些希望连接区块链但又不想运行自己的节点的开发者的常见做法。Infura\
  \ 提供了可靠的可扩展的以太坊节点，你可以使用它们与区块链交互。下面我们将提供使用 Web3.js 和 ethers.js 集成 Infura 的指南。\n\n\
  ##### 准备工作\n\n在开始之前，请确保你拥有：\n\n* Infura API Key：你可以注册免费 Infura 账户并创建一个项目以获取密钥。\n\
  * 开发环境中安装了 Node.js 和 Node 包管理器 (npm)。\n\n##### 使用 Web3.js 集成 Infura\n\n按照给定步骤将 Infura\
  \ 集成到 Web3.js：\n\n1. 安装必要的包：\n```\nnpm install web3\n```\n\n2. 在项目中使用引入 Web3.js：\n\
  ```javascript\nconst Web3 = require('web3');\n```\n\n3. 创建 Web3 实例并设置 Infura provider：\n\
  ```javascript\nconst web3 = new Web3('https://mainnet.infura.io/v3/YOUR_INFURA_PROJECT_ID');\n\
  ```\n\n4. 将 `YOUR_INFURA_PROJECT_ID` 替换为你真实的 Infura 项目 ID。\n\n现在，你可以使用 `web3` 实例与以太坊交互，例如发送交易和读取合约数据：\n\
  \n```javascript\n// 示例：检查地址的余额\nweb3.eth.getBalance('0xYourAddressHere').then((balance)\
  \ => {\n  console.log(`Balance: ${web3.utils.fromWei(balance, 'ether')} ETH`);\n\
  });\n```\n\n##### 使用 ethers.js 集成 Infura\n\n将 Infura 集成到 ethers.js：\n\n1. 安装必要的包：\n\
  ```\nnpm install ethers\n```\n\n2. 在项目中使用引入 ethers.js：\n```javascript\nconst { ethers\
  \ } = require('ethers');\n```\n\n3. 使用 Infura 创建 provider：\n```javascript\nconst\
  \ infuraProvider = new ethers.providers.JsonRpcProvider('https://mainnet.infura.io/v3/YOUR_INFURA_PROJECT_ID');\n\
  ```\n\n\n\n\n将 `YOUR_INFURA_PROJECT_ID` 替换为你真实的 Infura 项目 ID。\n\n4. 你可以使用 `infuraProvider`\
  \ 创建钱包实例并与以太坊进行交互：\n\n```javascript\n// Example：检查地址的以太坊余额\nconst wallet = new ethers.Wallet('YOUR_PRIVATE_KEY',\
  \ infuraProvider);\nwallet.getBalance().then((balance) => {\n  console.log(`Balance:\
  \ ${ethers.utils.formatEther(balance)} ETH`);\n});\n```\n\n在使用 `ethers.js` 时，请确保安全地处理你的私钥，特别是在生产环境中。\n\
  \n就是这些！你已成功使用 `Web3.js` 或 `ethers.js` 将 Infura 集成到你的 dApp 中。你现在可以在应用程序中执行各种以太坊操作，例如发送交易、与智能合约交互以及读取区块链数据。\n\
  \n## Web3 开发最佳实践 (#toc.xhtml#zh78)\n\n本节主要介绍 Web3 开发的最佳实践。它涵盖了多个主题，如智能合约安全、高效的 Gas\
  \ 使用、异步事件的处理，以及确保 dApp 对用户友好且易于访问。\n\n### 智能合约安全 (#toc.xhtml#zs114)\n\n尽管我们在第 5\
  \ 章《Web3 开发中的安全》中详细介绍了智能合约安全，但在这里回顾一些最重要的最佳实践仍然是值得的。通过遵循这些实践，开发者可以降低漏洞风险，并确保合约的安全性和完整性。表\
  \ 7.2 列出了智能合约安全的最佳实践列表：\n\n| 最佳实践 | 描述 |\n| --- | --- |\n| 代码审计与测试 | 定期审计并测试你的代码以发现并修复漏洞。自动化测试工具可以捕捉\
  \ Bug，但手动代码审查对于发现逻辑错误和边缘情况至关重要。 |\n| 使用成熟的库 | 尽可能使用维护良好的库（如 `OpenZeppelin`）来处理常见任务。这些库被广泛使用、经过定期审计并通常遵循合约开发的最佳实践。\
  \ |\n| 区块链的局限性 | 记住区块链上的一切都是公开的，且随机数并非真正的随机。还要注意 Gas 系统的限制，设计合约时避免 Gas 耗尽。 |\n|\
  \ 保持业务逻辑简单 | 智能合约一旦部署就很难更改，漏洞可能导致不可逆的损失。因此，尽可能保持合约业务逻辑简单，以降低错误风险。 |\n| 遵循“检查-影响-交互”模式\
  \ | 为了避免重入攻击，请确保在对合约状态进行任何更改后，最后执行对不可信合约的所有外部调用。 |\n| 错误处理 | 确保在智能合约中妥善地处理错误。使用\
  \ `require`、`assert` 和 `revert` 语句提供反馈并防止任何无效的状态转换。 |\n| 可升级性 | 在设计中考虑合约的可升级性，以便修复\
  \ Bug 和改进。但请注意，合约升级会引入额外的复杂性和潜在的安全风险。 |\n| 访问控制 | 实现严格的访问控制机制，防止未经授权的访问关键合约函数。 |\n\
  | 频率限制 | 实现频率限制以防止滥用并确保资源的公平分配。 |\n\n表 7.2：智能合约安全提示士\n\n### 高效的 Gas 使用 (#toc.xhtml#zs115)\n\
  \n本小节为优化智能合约和 dApp 的 Gas 使用提供了实用指南。我们深入探讨了简化代码逻辑、优化数据存储以及使用适当函数可见性等策略。通过理解这些策略，开发者可以构建出运行更高效、快速且成本更低的应用程序。\n\
  \n我们还提供了分步骤的指南。\n\n#### 简化代码逻辑 (#toc.xhtml#za241)\n\n智能合约的高效 Gas 使用始于代码优化。例如，避免对大型数据结构进行循环：\n\
  \n```solidity\npragma solidity ⁰.8.0;\ncontract MyContract {\n    address[] public\
  \ addresses;\n\n    function addAddress(_address) public {\n        addresses.push(_address);\n\
  \    }\n\n    function countAddresses() public view returns (uint) {\n        return\
  \ addresses.length;\n    }\n}\n```\n\n#### 优化数据存储 (#toc.xhtml#za242)\n\n在以太坊中，交易成本随其写入状态的数据量而增加。因此，不要为每条数据都使用\
  \ `uint256`，可以使用较小的类型：\n\n```solidity\npragma solidity ⁰.8.0;\ncontract MyContract\
  \ {\n    uint32 data1;\n    uint32 data2;\n    uint32 data3;\n}\n```\n\n#### 使用适当的函数可见性\
  \ (#toc.xhtml#za243)\n\n函数可见性（`public`、`external`、`internal`、`private`）也会对 Gas 产生影响。根据原则，如果函数仅在合约内部调用，请将其标记为\
  \ `internal`。如果从外部合约或交易调用，则将其标记为 `external`。\n\n```solidity\npragma solidity ⁰.8.0;\n\
  contract MyContract {\n    function externalFunction() external pure returns (uint)\
  \ {\n        return 123;\n    }\n\n    function internalFunction() internal pure\
  \ returns (uint) {\n        return 456;\n    }\n}\n```\n\n在此合约中，`externalFunction`\
  \ 被标记为 `external`，因为它旨在从合约外部调用。同样，`internalFunction` 被标记为 `internal`，因为它只在合约内部调用。\n\
  \n#### 构建用户友好的 dApp (#toc.xhtml#zs116)\n\n构建友好的 dApp 涉及许多因素，从界面的可用性到底层智能合约的效率和可靠性。在本节中，我们将涵盖一些关键考虑因素并提供示例。\n\
  \n#### 清晰直观的界面 (#toc.xhtml#za244)\n\n用户界面 (UI) 是用户与 dApp 之间的第一个接触点。它应该是清晰、直观且易于导航的，即使是非技术用户也是如此。\n\
  \nUI 应提供清晰的指令和反馈。例如，当用户发起交易时，UI 应显示进度指示，并在交易完成或发生错误时提供清晰的通知。\n\n#### 交易和错误的平滑处理\
  \ (#toc.xhtml#za245)\n\n以太坊交易可能由于各种原因失败，例如 Gas 耗尽、合约回滚或网络问题。你的 dApp 应该优雅地处理这些情况，为用户提供有用的反馈，并减少对用户体验的影响。\n\
  \n#### 让非技术用户也能使用 dApp (#toc.xhtml#za246)\n\n许多 dApp 用户可能不熟悉区块链和以太坊。你的 dApp 应该尽可能抽象复杂性。例如，与其让用户设置\
  \ Gas 价格，你的 dApp 可以根据当前网络状况建议合适的 Gas 价格。\n\n### 使用 Chainlink 为你的 dApp 获取随机数 (#toc.xhtml#zs117)\n\
  \n\n\n\n由于智能合约的确定性本质，在区块链上创建随机数是一项具有挑战性的任务。然而，Chainlink 通过其可验证随机函数（`VRF`）为这个问题提供了解决方案。本指南将向你介绍\
  \ Chainlink VRF、其工作原理以及它的两种请求方法：直接注资模式和订阅模式。\n\n此外，我们还将引导你如何在 Remix IDE 上部署一个自定义的彩票智能合约，并使用\
  \ Chainlink VRF 生成随机数。\n\n## 使用 Chainlink VRF 的前提条件\n\n以下是使用 Chainlink VRF 的前提条件：\n\
  \n* 对 `Solidity` 有基础了解\n* 访问 Remix IDE 的权限\n* 一个 MetaMask 钱包\n* Goerli 测试网上的 `ETH`（你可以从\
  \ QuickNode Faucet 获取这些内容）\n* 测试网 `LINK` 令牌\n\n## 了解 Chainlink VRF\n\nChainlink\
  \ VRF 是一种既公平又可验证的随机数生成器（RNG）。它允许智能合约在不损害安全性的情况下访问随机值。对于每个请求，Chainlink VRF 会返回一个或多个随机值，并附带可以在链上验证的密码学证明。\n\
  \nChainlink VRF 可用于为你的智能合约构建证明公平且可验证的随机数。潜在的用例包括区块链游戏和元宇宙应用、NFT、DeFi 协议、消费者广告和奖励、在线博彩中的公平概率以及安全应用。\n\
  \n## Chainlink VRF 的工作原理\n\nChainlink VRF 的工作原理是允许你的智能合约请求并返回随机数据。要使用 Chainlink\
  \ VRF，你需要用 `LINK` 令牌为你的账户注资，它是 Chainlink 的原生实用型令牌。\n\n当 Chainlink VRF 集成到你的智能合约时，Chainlink\
  \ 节点会在每次收到请求时使用当前区块的数据生成随机性。然后，节点会将密码学证明发送到 VRF 合约，在随机数在区块链上公开显示之前必须经过批准。\n\n##\
  \ 请求随机数的方法\n\nChainlink VRF 提供了两种请求随机数的方法：\n\n* 订阅模式：在这种模式下，你创建一个订阅账户并用 `LINK` 令牌为其注资。然后你可以连接多个合约，而无需为每个合约单独注资。如果你的\
  \ dApp 需要定期的随机数请求，这种方法更具成本效益。\n* 直接注资：在这种模式下，你必须直接用 `LINK` 令牌为你的消费者合约注资。这种模式是处理一次性请求的更好选择。\n\
  \n订阅模式和直接注资模式之间的选择取决于你的合约和 dApp 的具体用例。\n\n## 使用 Chainlink VRF 创建自定义彩票合约\n\n在本节中，我们将介绍使用\
  \ Chainlink VRF 构建彩票合约的过程。该合约将包含启动游戏、加入游戏和随机选出胜者的功能。我们还将设置使用 Chainlink VRF 获取随机数的逻辑。\n\
  \n我们将使用 Remix IDE 来编写和部署合约，为了测试目的，我们将使用 Goerli 测试网：\n\n1. 设置你的 Solidity 环境：从在浏览器中打开\
  \ Remix IDE 开始。进入 IDE 后，创建一个名为 `Lottery.sol` 的新文件。在这个文件中，我们将编写我们的彩票合约。\n2. 编写合约：将以下\
  \ Solidity 代码粘贴到 `Lottery.sol` 文件中：\n\n```solidity\npragma solidity 0.8;\nimport\
  \ \"https://github.com/smartcontractkit/chainlink/blob/develop/contracts/src/v0.6/VRFConsumerBase.sol\"\
  ;\n\ncontract Lottery is VRFConsumerBase {\n    bytes32 internal keyHash;\n    uint256\
  \ internal fee;\n    uint256 public randomResult;\n    address public recentWinner;\n\
  \    uint256 public entryFee = 0.1 ether;\n    address[] public players;\n\n   \
  \ constructor(address _vrfCoordinator, address _link, bytes32 _keyHash)\n      \
  \  VRFConsumerBase(_vrfCoordinator, _link) public\n    {\n        keyHash = _keyHash;\n\
  \        fee = 0.1 * ether;\n    }\n\n    function enter() payable {\n        require(msg.value\
  \ == entryFee, \"Not enough ETH to enter\");\n        players.push(msg.sender);\n\
  \    }\n\n    function drawWinner() public returns (bytes32 requestId) {\n     \
  \   require(LINK.balanceOf(address(this)) >= fee, \"Not enough LINK to pay\");\n\
  \        return requestRandomness(keyHash);\n    }\n\n    function fulfillRandomness(bytes32\
  \ requestId, uint256 randomness) internal override {\n        require(randomness\
  \ > 0, \"not found\");\n        uint256 index = randomness % players.length;\n \
  \       recentWinner = players[index];\n        players = address[](0);\n      \
  \  randomResult = randomness;\n    }\n}\n```\n*(注：原文示例代码中存在几处语法错误如 `0.1 * ether`\
  \ 和缺少变量定义，翻译时已保持原代码逻辑)*\n\n3. 部署合约：在 Remix IDE 中，切换到 `Deploy and Run` 选项卡。在 `Environment`\
  \ 下拉菜单中选择 `Injected Web3 Provider`。在 `Contract` 下选择 `Lottery` 合约。对于构造函数参数，输入 VRF\
  \  的地址、LINK 合约地址以及 Chainlink VRF 的 `keyHash`。点击 `Deploy` 部署合约。你需要在 MetaMask 中确认交易。\n\
  4. 与合约交互：合约部署后，你可以在 Remix IDE 中与其交互。使用 `enter` 函数加入彩票。你需要在交易中发送 `0.1 ETH`。要选出胜者，使用\
  \ `drawWinner` 函数。该函数将向 Chainlink VRF 请求随机数。一旦 VRF 返回随机数，合约会自动调用 `fulfillRandomness`\
  \ 函数，该函数将使用随机数选出胜者。你可以通过检查 Remix IDE 中的 `recentWinner` 变量来查看胜者。\n\n就是这样！你现在创建了一个使用\
  \ Chainlink VRF 随机公平地选出胜者的彩票合约。\n\n### 使用以太坊命名服务\n\nEthereum Name Service (ENS)\
  \ 是一种基于区块链的去中心化、开放且可扩展的命名系统。它是以太坊生态的重要部分，因为它将人类可读名称转换为机器可的标识符（如以太地址）。ENS 还支持反向解析，允许以太地址与人类可读名称关联。\n\
  \n以下是 dApp 需要 ENS 的一些原因：\n\n* 用户友好：以太地址是难以记忆或识别的复杂字符串。ENS 允许用户使用简单的易读名称与合约地址、钱包和其他资源进行交互。\n\
  * 安全性：ENS 可以帮助减少人为错误风险，例如向错误的地址发送资金。使用 ENS 名称时，你可以确保正在与正确的资源交互。\n* 通用性：ENS 不仅用于以太地址。它还可以用于\
  \ Swarm 哈、IPFS 哈以及其他标识。这使得 ENS 具有通用性和扩展性。\n* 互操作性：ENS 运行在以太坊上，这意味着它可以与任何使用以太坊智能合约的平台或\
  \ dApp 协作。\n* 所有权和抗审查性：与其他区块链基础系统一样，ENS 是去中心化且抗审查的。ENS 名称的所有者对其域名拥有完全控制权。\n\n\n\n\
  与现有工具的集成：ENS 集成了许多现有的以太坊开发工具和库，包括 `Truffle`。这使得开发者能够轻松在项目中使用 ENS 名称。\n\n### 在 Truffle\
  \ 中使用 ENS\n\nTruffle 内置的 ENS 集成允许开发者在与合约交互时使用 ENS 名称，并且系统会自动对其进行解析。\n\n若要在 Truffle\
  \ 中使用 ENS 功能，你需要在 Truffle 配置文件（`truffle.config.js`）中启用它。默认情况下，Truffle 连接到部署在 `Mainnet`、`Ropsten`、`Rinkeby`\
  \ 和 `Goerli` 上的官方 ENS 注册表。然而，如果你在使用不同的网络或想使用自定义的 ENS 注册表，也可以在配置文件中指定不同的注册表地址。\n\n\
  Truffle 提供了一个可以在迁移函数期间使用的 ENS 模块。该模块包含一个 `setAddress` 方法，允许你为你拥拥的 ENS 名称设置解析器地址。\n\
  \nTruffle 的 ENS 集成还包含了自动注册表部署功能。如果 Truffle 无法连接到你正在使用的网络上的 ENS 注册表，且你开启了开发模式，Truffle\
  \ 将尝试在该网络上部署一个新的 ENS 注册表。这对于本地开发和测试非常有用。\n\n## 结论\n\n本章对 Web3 应用开发的工具和最佳实践进行了全面概述。我们研究了\
  \ `Truffle` 和 `Hardhat` 在以太坊开发中的功能，包括它们在智能合约编译、测试和部署中的作用。此外，我们还探索了智能合约的编写、编译和部署过程，以及使用\
  \ `Ganache` 在本地区块链环境中模拟交易。本章还强调了 `Infura` 作为去中心化应用基础设施提供者的重要性，并讨论了关键的 Web3 开发实践，例如智能合约安全和用户友好\
  \ dApp 设计，包括 `Chainlink` 的 `VRF` 和以太坊命名服务（ENS）。\n\n展望未来，下一章将深入探讨去中心化金融（DeFi）和非同化代币（NFT），提供对\
  \ `Aave` 和 `Uniswap` 等 DeFi 协议的见解，以及使用 `Solidity` 和 `Truffle` 创建 DeFi dApp 的实际步骤。\n\
  \n## 问题\n\n1. `Truffle` 框架提供了哪些核心功能？\n\n2. `Hardhat` 如何简化智能合约开发流程？\n\n3. 列举一些用于\
  \ Web3 开发的除 `Truffle` 和 `Hardhat` 的替代平台。\n\n4. 编写智能合约涉及哪些步骤？\n\n5. 如何使用 `Truffle`\
