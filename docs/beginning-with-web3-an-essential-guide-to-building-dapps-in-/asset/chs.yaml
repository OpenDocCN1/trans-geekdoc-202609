  \n## 结论\n此部分提供了测试的总结。\n\n\n\n\n\n每个 NFT 都拥有一组独特的属性，这些属性在代币铸造（mint）时定义。这些属性可能包括有关艺术作品的元数据、数字宠物的特殊特征，或者虚拟世界中某块土地的坐标。NFT\
  \ 的元数据通常存储在 `JSON` 文件中，包含名称、描述、图像以及 NFT 的其他自定义特征等属性。\n\n区分 NFT 与其他代币（如 `ERC20`）的关键特征是**唯一性**的概念。每个\
  \ NFT 都有唯一的标识符（`tokenID`），并可以具有不同的元数据，这使其与任何其他代币都不同。这与 `ERC20` 代币形成对比，每一个代币与其他任何代币都是相同的；它们是同质化的。\n\
  \n## 为什么唯一性如此重要\n\nNFT 的唯一性是赋予其价值的源。就像画作或收藏卡一样，NFT 的价值通常源于稀稀性和唯一性。例如，在数字艺术领域，NFT\
  \ 代表了一份安全存储在区块链上的数字所有权证书。这允许艺术家以数字形式出售他们的作品，买家也可以证明他们拥有某件独特的艺术品。\n\n此外，NFT 的独特属性为新类型的应用开启了可能。这包括虚拟房地产，其中每个\
  \ NFT 代表一块独特的土地；像 `CryptoPunks` 和 `CryptoKitties` 这样的加密收藏品，每个 NFT 具有不同的视觉特征；以及像\
  \ `Axie Infinity` 这样的边玩边赚区块链游戏，每个 NFT 代表一个具有特定属性和价值的独特游戏生物。\n\n## NFT 的历史\n\nNFT\
  \ 的历程始于区块链技术的引入，这是加密货币的底层技术。NFT 的第一个著名案例是 2012-2013 年 `Bitcoin` 区块链上的 `Colored Coins`\
  \ 项目。然而，NFT 的真正潜力随着 `Ethereum` 区块链的出现开始实现，该区块链引入了 `ERC-721` 标准，这是一种用于发行和管理非同质化资产的协议。\n\
  \n第一个主流 NFT 项目 `CryptoKitties` 于 2017 年发布，允许玩家购买、收藏、繁育和出售虚拟猫。`CryptoKitties` 变得极其流行，引起了人们对\
  \ NFT 概念的关注。该游戏展示了 NFT 代表独特数字物品的潜力，并为不同领域的各种应用打开了大门。\n\n## NFT 作为一种广泛关注的话题的兴起\n\n\
  NFT 因几个原因进入了视野：\n\n*   **数字艺术与所有权**：NFT 解决了数字艺术领域的一个根本问题——缺乏所有权和原创性。通过 NFT，数字艺术家可以铸造独特的代币来代表他们的艺术，为维护所有权和来源提供了新途径。\n\
  *   **创作者的变现**：艺术家和创作者发现 NFT 是将其作品变现的新颖方式。区块链的透明度和智能合约的自动化允许艺术家在 NFT 的后续销售中直接并持续地获得版税。\n\
  *   **稀缺性和可收藏性**：稀缺性概念是收藏品市场的关键驱动力，通过 NFT 很好地转化到了数字领域。限量版 NFT 备受追捧，为收藏家创造了繁荣的市场。\n\
  *   **公众兴趣与高额交易**：高额 NFT 交易（例如 Beeple 的作品以 6900 万美元售出）引起了公众关注。名人的背书和参与进一步燃起了人们对\
  \ NFT 领域的兴趣和好奇。\n*   **金融投机**：某些 NFT 价值的快速上涨吸引了投资者和投机者，他们希望从这一新的数字资产类别中获利。\n\n##\
  \ NFT 的影响\n\nNFT 的影响是多方面且深远的：\n\n*   **变革艺术界**：NFT 通过让数字艺术家获得认可并为其作品获得公平报酬实现了艺术民主化。这种转变也引入了新的挑战，例如区块链技术对环境的影响以及关于数字艺术长期价值的问题。\n\
  *   **各行业的创新**：除了艺术之外，NFT 在音乐、游戏、房地产等领域也找到了应用。它们重新定义了这些领域的所有权、真实性和价值交换。\n*   **经济影响**：NFT\
  \ 市场为数字商品创造了新的经济，导致了新市场、平台和投资策略的出现。它还引发了关于投资数字资产财务稳定可持续性的讨论。\n*   **法律与伦理考量**：NFT\
  \ 引发了关于知识产权、版权法以及数字资产代币化伦理影响的问题。这些讨论正在进行中，对 NFT 的未来发展至关重要。\n*   **社会文化影响**：NFT 通过在数字空间中实现新的表达和互动形式，影响了社会和文化动态。它们还引发了关于数字时代艺术和所有权价值及意义的辩论。\n\
  *   **技术进步**：NFT 的流行促进了区块链技术、智能合约和数字安全的创新，推动了这些领域的进步。\n\n## 使用 ERC 721 和 ERC 1155\
  \ 创建你自己的 NFT\n\n本节深入探讨了用于 NFT 创建的太坊代币标准：`ERC 721` 和 `ERC 1155`。我们将介绍使用这些标准开发自己的\
  \ NFT 的过程，并解释它们之间的独特特征和区别。\n\n### 理解 ERC 721\n\n`ERC 721` 是 NFT 的标准接口，这意味着 `ERC\
  \ 721` 代币仅仅是以太坊代币的一个子集。为了符合 `ERC 721` 标准，开发者需要在其智能合约中整合一组特定的函数，这些函数在高级别允许执行以下操作：\n\
  \n*   检查代币的总供应量。\n*   检查任何账户的代币余额。\n*   在任何两个账户之间传输代币（如果已批准）。\n*   批准第三方操作程序在任何两个账户之间传输代币。\n\
  \n#### ERC 721 的著名用例\n\n`ERC 721` 代币第一个也是最著名的用途之一是 `CryptoKitties`。`CryptoKitties`\
  \ 于 2017 年 11 月发布，是一款基于区块链的虚拟游戏，允许玩家领养、养育和交易虚拟猫。每个 `CryptoKitty` 都是 `ERC 721` 代币，这意味着它是独特的且由玩家所有的。该游戏曾一度流行到导致以太坊网络拥堵。\n\
  \n`ERC 721` 代币的另一个显著用途是 `Decentraland`，这是一个由以太坊驱动的虚拟现实平台。在 `Decentraland` 中，用户可以购买土地，土地以\
  \ `ERC 721` 代币的形式表示。该令牌提供了所有权证明，并允许用户在土地上进行。\n\n`ERC 721` 代币还用于真实世界资产（如房地产和艺术）。例如，Beeple\
  \ 的名为 `Everydays: The First 5000 Days` 的项目被代币化为 `ERC 721` 并以超过 6900 万美元。\n\n`ERC\
  \ 721` 代币为数字所有权和贸易开启了广泛的可能性。它们对于数字艺术和虚拟商品的兴起至关重要，并可能随着领域的演变继续处于前沿。\n\n### 探索 ERC\
  \ 1155\n\n`ERC 1155` 是一种多代币标准，设计上比 `ERC721` 更具活性且高效。它由 `Enjin` 团队开发，允许在同一个合约中创建同质化（类似货币）和非同质化（独特）代币。\n\
  \n\n\n\n\n`ERC 1155` 的独特之处在于它在交易执行和数据存储方面实现了极高的效率。对于 `ERC 20` 和 `ERC 721`，每一种新类型的代币都必须部署一个新的合约，这既耗时又昂贵。然而，通过\
  \ `ERC 1155`，一个合约就可以产生无限种类型的代币。\n\n以下是 `ERC-1155` 的其他特性：\n\n- 批量操作效率：`ERC-1155`\
  \ 允许批量铸造和转账，减少了处理多个代币所需的交易次数。\n- Gas 费用效率：批量操作以及在单个合约中管理多种类型代币的能力可以降低 Gas 费用。\n\
  - **半同质化**：`ERC-1155` 代币的也可以是半同质的（semi-fungible），根据其使用场景，一个代币可以同时作为同质代币和非同质代币。\n\
  \n以下是一个使用 `OpenZeppelin` 库编写 `ERC 1155` 合约的简单示例：\n\n```solidity\n// SPDX-License-Identifier:\
  \ MIT\npragma solidity ⁰.8.0;\n\nimport \"@openzeppelin/contracts/token/ERC1155/ERC1155.sol\"\
  ;\nimport \"@openzeppelin/contracts/access/Ownable.sol\";\n\ncontract MyERC1155Token\
  \ is ERC1155, Ownable {\n    constructor() ERC1155(\"https://myapi.com/api/token/\"\
  ) {}\n\n    function mint(address account, uint256 id, uint256 amount, bytes memory\
  \ data)\n    public\n    onlyOwner\n    {\n        _mint(account, id, amount, data);\n\
  \    }\n\n    function mintBatch(address to, uint256[] memory ids, uint256[] memory\
  \ amounts, bytes memory data)\n    public\n    onlyOwner\n    {\n        _mintBatch(to,\
  \ ids, amounts, data);\n    }\n}\n```\n\n该合约使用了 `OpenZeppelin` 的 `ERC1155` 实现，这是实现\
  \ `ERC 1155` 代币的一种安全且标准的方法。它导入了 `Ownable` 用于所有权管理。\n\n此外，该合约具有以下逻辑：\n\n- **构造函数**：使用基础\
  \ URI 初始化合约。该 URI 是所有代币 URI 的前缀，通常指向一个可以访问每个代币 ID 元数据的服务器。\n- **铸造函数**：\n    - `mint`：允许合约所有者向指定地址铸造特定\
  \ `id` 的新代币。`amount` 参数决定了铸造多少个该 `id` 的代币，`data` 可用于传递额外信息。\n    - `mintBatch`：与\
  \ `mint` ，但允许在单次交易中铸造多种类型的代币。它接受 `ids` 和 `amounts` 数组。\n\n## ERC 1155 的著名用途\n\n\
  `ERC 1155` 代币最著名的用途之一是 `Enjin Platform`。`Enjin` 是一个允许游戏开发者将加密资产集成到游戏和应用中的项目。`Enjin`\
  \ 团队开发了 `ERC 1155` 标准以实现更高效的创建、分发和交易。\n\n另一个例子是 `Sandbox`，这是一个玩家可以在其中构建、拥有并将其体验货币化的虚拟世界。`Sandbox`\
  \ 使用 `1155` 代币代表土地区块和游戏内物品。\n\n## 创建你自己的 NFT\n\n让我们浏览类似于 Kitties 风格创建 NFT 的简化版本：\n\
  \n```solidity\n// SPDX-License-Identifier: MIT\npragma solidity ⁰.6.0;\n\nimport\
  \ \"@openzeppelin/contracts/token/ERC1155/ERC1155.sol\";\n\ncontract Kitties is\
  \ ERC1155 {\n    uint256 public tokenCounter;\n    address[] public kitties;\n\n\
  \    constructor() ERC1155(\"Kitties\") {\n        tokenCounter = 0;\n    }\n\n\
  \    function safeMint(address to, uint256 id, uint256 amount, bytes memory data)\
  \ public {\n        _mint(to, id, amount, data);\n        kitties.push(to);\n  \
  \      tokenCounter += 1;\n    }\n\n    function getKitty(uint256 id) public view\
  \ returns (uint256) {\n        return id;\n    }\n}\n```\n\n## DeFi 和 NFT 的实际应用\n\
  \n本章的最后一节探讨了 DeFi 和 NFT 的实际应用。它讨论了这些技术如何改变行业，带来新的业务模式。\n\n### 现实世界中的 DeFi\n\n本小节探讨了\
  \ DeFi 的现实世界应用。它讨论了涵盖借贷、保险、资产管理的各种用例。\n\n#### 借贷\n\nDeFi 借贷平台提供了用户可以申请的贷款，无需中间人或机构的参与。使用智能合约，这些平台可以自动化借贷过程，提供了一种比传统贷款服务更具开放性、互操作性和可编程性的替代。\n\
  \n例如，`Aave` 和 `Compound` 等平台允许用户贷入和借各种加密货币。用户可以通过借出资金来赚利，借款人可以抵押其加密资产来贷款。\n\n####\
  \ 稳定币\n\n稳定币是 DeFi 生态系统中不可或缺的一部分。正如其名，稳定币是为了减少价格波动的加密货币。这通常通过将稳定币挂钩到储备资产或资产篮来实现。\n\
  \n`Tether (USDT)` 和 `USD Coin (USDC)` 是挂钩美元的稳定币示例。它们由发行机构储备的美元 1:1 支持。相比之下，`Dai`\
  \ 是一种软挂钩美元的去中心化稳定币，通过 `MakerDAO` DeFi 协议生成。\n\n\n\n\n\n去中心化交易所（DEXs）是 DeFi 的关键组成部分，使用户能够直接从钱包交易资产。`Uniswap`、`SushiSwap`\
  \ 和 `Balancer` 等 DEX 因其其许可且无需许可的性质，以及通过提供流动性获取费用和奖励的能力而获得了广泛关注。\n\n与中心化交易所不同，DEX\
  \ 不需要中间人来执行交易。相反，它们使用智能合约来自动化交易过程。这不仅使过程更加高效，还降低了因交易所黑客导致的盗风险。\n\n### 收益耕作与流动性挖掘\n\
  \n收益耕作（Yield farming）也称为流动性挖掘，是一种利用加密货币持有产生奖励的方法。简单来说，这意味着锁定加密货币并获得奖励。它涉及通过智能合约系统贷出加密货币，允许他人借用。\n\
  \n作为服务的回报，流动性提供者从底层 DeFi 平台获得费用。这些奖励可以作为利润来源，而且通常远高于传统的银行利率。`Yearn.Finance` 等平台实现了收益耕作过程的自动化，在最有利的贷款平台之间转移资金。\n\
  \n### 保险\n\n保险是 DeFi 生态系统的另一个新兴领域。`Nexus Mutual` 和 `Cover Protocol` 等平台允许用户为智能合约、钱包和稳定币锚定购买保险。这保护\
  \ DeFi 用户免受因黑客、漏洞和其他不可预见事件导致的财务损失风险。\n\n智能合约保险在 DeFi 空间尤为重要，因为智能合约通常是不可逆的，并且持有大量价值。如果智能合约因代码漏洞被利用，用户可能会丢失他们投资的所有资金。\n\
  \n### 资产管理\n\n去中心化资产管理平台为传统投资基金提供了替代方案，允许任何人创建、管理和投资去中心化基金。这些平台使用智能合约创建可以管理和投资池化资产的去中心化组织，使投资基金更加透明、互操作性且高效。\n\
  \n其中一个平台是 `Set Protocol`，它允许用户创建、管理和交易代币化资产篮。这些资产组合可以构建为根据不同的策略自动重新平衡，例如遵循特定的 DeFi\
  \ 指数或自动从不同的 DeFi 协议中收获收益。\n\n### 数字艺术之外的 NFT\n\n虽然数字一直是 NFT 的主要焦点，但它们的用途远超这一领域。NFT\
  \ 为各种数字资产的代币化和所有权证明提供了一种独特的方式，在多个领域开启了广泛的可能。\n\n#### 游戏\n\n游戏行业是 NFT 的重要采用者。`CryptoKitties`、`Axie\
  \ Infinity` 和 `Decentraland` 等游戏为玩家提供了其游戏内资产的真实所有权。\n\n在 `Axie Infinity` 中，每个 `Axie`\
  \ 都是具有不同属性的 NFT。玩家可以繁殖、战斗和交易 `Axies`，每个 `Axie` 的所有权都在 `Ethereum` 区块链上追踪。\n\n同样，在虚拟世界\
  \ `Decentraland` 中，土地块以 NFT 的形式表示。每块土地都是独特的，拥有自己的坐标和特征，且每块土地的所有权都在 `Ethereum` 区块链上追踪。\n\
  \n#### 房地产\n\n虚拟房地产是 NFT 空间内一个快速增长的市场。`Cryptovoxels` 和 `Decentraland` 等平台允许用户购买、拥有和开发虚拟土地，每块土地都以\
  \ NFT 的形式表示。\n\n在现实世界中，将房地产资产作为 NFT 代币化也可能彻底改变房地产行业，通过减少对中间人的需求、提高流动性并使碎片化所有权成为可能。\n\
  \n#### 知识产权\n\nNFT 在管理知识产权方面也有潜在的用例。例如，音乐家可以将他们的音乐作为 NFT 代币化，使他们能够直接向粉丝出售音乐并保留更多收益。\n\
  \n此外，NFT 还可以为追踪知识产权的所有权和许可提供解决方案。例如，设计师可以将某个设计代币化为 NFT，然后将其许可给他人使用。\n\n#### 收藏品和纪念品\n\
  \nNFT 最早的用途之一是数字收藏品，如 `CryptoKitties`。今天，存在各种数字收藏品，从体育交易卡到虚拟宠物。\n\n例如，`NBA Top Shot`\
  \ 提供了官方授权的 NBA 收藏级高光包。每个高光都被代币化为 NFT，可以在 `NBA Top Shot` 市场上进行购买、出售和交易。\n\n#### 域名\n\
  \n域名是另一种可以被代币化为 NFT 的数字资产。例如，`Ethereum Name Service` (`ENS`）允许用户购买 `.eth` 域名，这些域名在\
  \ `Ethereum` 区块链上被代币化为 NFT。\n\n### DeFi 和 NFT 的未来趋势\n\n随着我们继续探索区块链技术的潜力，预计 DeFi\
  \ 和 NFT 领域将为各行业带来重大变化。接部分涉及涉及可能塑造 DeFi 和 NFT 未来的潜在趋势。\n\n#### 现实世界资产代币化\n\n现实世界资产的代币化可能会继续成为\
  \ DeFi 和 NFT 领域的一大重要趋势。代币化是指将对资产的权利转换为区块链上的数字代币的过程。这可能包括房地产、艺术品甚至公司股票等资产。代币化具有提供更大流动性、提高交易效率和开启新投资机会的潜力。\n\
  \n#### 互操作性\n\n互操作性，或者说不同区块链网络相互作用的能力，将继续是 DeFi 空间的一个关键趋势。像 `Polkadot` 和 `Cosmos`\
  \ 等跨链技术旨在实现价值和数据在不同区块链网络之间的传输，扩展 DeFi 应用的潜在范围和影响。\n\n#### 监管\n\n随着 DeFi 和 NFT 的持续增长，我们预计会看到监管关注的增加。全球政府开始更多关注区块链领域，预计看到出台相关法规以保护消费者并防止非法活动。\n\
  \n#### Layer 2 解决方案和可扩展性\n\n随着 DeFi 和 NFT 的普及持续增长，对快速、低成本交易的需求也随之增加。大多数 DeFi 和 NFT\
  \ 项目的 `Ethereum` 面临高交易费用和网络拥堵的问题。作为回应，Layer 2 解决方案（构建在区块链之上的二级协议）正在开发中，以增加网络的可扩展性。这些解决方案的示例包括\
  \ `Optimistic Rollups` 和 `ZK Rollups`。\n\n#### 碎片化所有权\n\n碎片化所有权允许昂贵或高价值的 NFT 分为更小、更容易负担的部分，可能会变得更加流行。这使得更多人能够投资高价值\
  \ NFT，例如昂贵的数字艺术品。\n\n#### 虚拟现实中的 NFT\n\n随着虚拟现实（VR）技术的进步，预计将看到更多 NFT 的整合。像 `Decentraland`\
  \ 这样的虚拟世界可能会变得常见，虚拟房地产和物品将以 NFT 的形式表示。这些虚拟世界为人们与 NFT 交互提供了新方式，并为创作者变现作品提供了途径。\n\n\
  ## 结论\n\n\n\n\n在本章中，我们探索了 DeFi 和 NFT 的基础知识，包括核心概念、现实应用和未来趋势。我们涵盖了如 `Aave` 和 `Uniswap`\
  \ 等 DeFi 协议，以及收益耕矿（yield farming）激励机制。我们还构建了一个简单的 DeFi dApp 以学习智能合约的部署。对于 NFT，我们学习了\
  \ `ERC721` 等代币标准以及数字艺术之外的用例。在应用方面，我们看到了 DeFi 如何驱动贷款、保险、资产管理等领域，而 NFT 则在游戏、房地产、知识产权（IP）及其他领域掀起波潮。随着资产代币化、`Layer\
  \ 2` 解决方案以及虚拟现实（VR）的到来，两者的未来都是光明的。在我们结束对 DeFi 和 NFT 的深度探讨之际，下一章将把范围扩展到区块链协议和 `layer\
  \ 2` 解决方案，引导读者在这个日益互联的格局中部署以太坊之外的 dApps。\n\n## Questions\n\n1. 什么是去中心化金融（DeFi）？\n\
