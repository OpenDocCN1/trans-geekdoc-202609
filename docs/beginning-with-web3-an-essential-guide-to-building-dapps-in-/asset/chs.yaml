  \ `EVM` 链。\n\n他的重点是 `DeFi`，因为他认为构建就是未来。\n\n# 致谢\n\n衷心感谢我的家人、朋友和同事一直以来的支持与鼓励。感谢感谢评审员和编辑对本书提供的宝贵反馈和贡献。\n\
