  \ 10` 的核心作者。\n\nKen Huang 曾受邀在加利福尼亚大学伯克利分校、斯坦福大学、北京大学、清华大学、上海交通大学、中国太平洋保险和世界银行等机构提供演讲和咨询服务。\n\
