  \ Smart Chain` (`BnB Chain`)：一个以速度快和低交易费用闻名的区块链平台。\n* `Substrate` 框架：用于构建区块链的模块化框架，主要与\
  \ `Polkadot` 相关。\n* `Ethereum virtual machine` (`EVM`)：在 `Ethereum` 上执行智能合约的运行时环境。\n\
  * `Consensus mechanism`（共识机制）：用于对区块链状态达成一致的过程。\n* `Layer 2` 解决方案：旨在不改变基础层的情况下增加区块链交易容量的技术。\n\
  * `optimistic rollups`：一种 `Layer 2` 扩展解决方案，通过在链外执行大多数交易并假设其正确性来增加吞吐量。\n* `ZK Rollups`：一种使用零知识证明将多次转移合并为单次交易的\
  \ `Layer 2` 扩展解决方案。\n* `Multi-chain Deployment`（多链部署）：同时在多个区块链上部署去中心化应用。\n* `Blockchain\
  \ interoperability`（区块链互操作性）：不同区块链平台无缝通信和交互的能力。\n* `Cross-chain communication`（跨链通信）：不同区块链之间的信息传递。\n\
  * `atomic swaps`（原子交换）：在没有中介的情况下进行不同加密货币之间的去中心化交换。\n* `Bridges`（桥）：允许在两个不同区块链之间移动资产的协议或智能合约。\n\
  * `Federated pegs`（联邦锚定）：通常涉及一组验证者，负责监督链与链之间的资产转移。\n* `DeFi`（去中心化金融）：基于区块链技术的金融应用。\n\
  * `Hash Timocked Contracts` (`HTLCs`)（哈时间锁定合约）：一种用于 `atomic swaps` 的智能合约。\n* `Collateralized\
  \ systems`（抵押系统）：使用抵押资产的系统。\n* `Governance`（治理）：去中心化系统中决策的过程和机制。\n* `Smart contract`（智能合约）：直接写入代码的协议条款。\n\
