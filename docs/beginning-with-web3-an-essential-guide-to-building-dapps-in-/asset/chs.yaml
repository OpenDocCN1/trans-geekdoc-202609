  \n# 第 2 章 理解以太坊\n\n## 引言\n\n以太坊已成为最具变革性且应用广泛的区块链平台之一，引领了从去中心化金融（DeFi）到非同质化代币（NFT）的应用时代。然而，理解以太坊的复杂性和内部机制需要深入研究其架构组件。本章将作为以太坊区块链基础概念和机制的全面指南。\n\
  \n本章讨论了以太坊的起源和演变，强调了关键里程碑，如发布、向以太坊 2.0 转型以及最近的合并（Merge）。深入介绍了节点、账户、交易和以太坊虚拟机（EVM）等架构组件，解释了它们如何关联。我们将探索智能合约，详细介绍其脚本、在去中心化金融、代币等方面的应用。解释虚拟机执行智能合约的作用，以及\
  \ `gas` 费用模型和互操作性。应用层涵盖了去中心化应用（dApps）及相关概念。分析了二层和分片等扩展解决方案，以及以太坊的治理。本章最后解释了如何使用\
  \ `web3.js` 和 `ethers.js` 与以太坊交互以开发应用程序。\n\n通过涵盖以太坊的起源、架构、应用和未来演进，本章为理解以太坊生态系统提供了全面的知识。介绍的概念为读者提供了推理以太坊能力和可能的思维模型。无论你是区块链爱好者还是未来的去中心化应用开发者，这一基础都将阐以便太坊在引领区块链技术和智能合约驱动的\
  \ Web3 变革中的深刻影响。\n\n## Structure\n\n* 以太坊区块链概述\n* 以太坊关键架构概念\n* 去中心化应用\n* 以太坊区块链的扩展性\n\
  * 治理与开发\n* 如何与以太坊网络交互\n\n\n\n本章将帮助读者理解以太坊的起源、核心架构及其动力。他们将能够掌握以太坊的关键组件，如账户、交易、Gas（燃料费）以及以太坊虚拟机（EVM）。读者将理解智能合约（包括\
  \ `Solidity`），并区分工作量证明（PoW）和权益证明（PoS）共识机制的区别。本章还涵盖了以太坊的治理模型、DeFi、NFTs 和 DAO 等应用，以及扩展性解决方案（分片、Layer\
  \ 2）。文中阐明了 Gas 概念的重要性以太币（Ether）的作用。读者将学习如何利用 `web3.js` 和 `ethers.js` 与以太坊进行交互，并评估以太坊与其他区块链相比的优缺点。\n\
  \n## 以太坊区块链概览\n\n以太坊是一个开源、去中心化的区块链平台，运行智能合约。以太坊由维塔利克·布特林（Vitalik Buterin）于 2013\
  \ 年首次提出，现已成为最活跃的区块链，在其之上构建了超过 3000 个去中心化应用程序（dApps）。\n\n以太坊的原生加密货币被称为 `ether`（`ETH`）。它既是网络上的交易媒介，也是不同应用程序之间的价值单位。截至\
  \ 2023 年，以太坊的市值超过 2000 亿美元，成为仅次比特币的第二大加密货币。\n\n以太坊的核心提供了一个名为以太坊虚拟机（EVM）的去中心化虚拟机，它可以执行脚本并运行\
  \ dApps。该项目引入了通过智能合约进行开发的理念——即存储在区块链上的代码段和协议。智能合约允许开发者在以太坊之上构建和部署去中心化应用，提供比单纯价值转移更复杂的功能。\n\
  \n以太坊的发展经历了几个阶段，从 2015 年的 Frontier（前沿版，测试阶段）开始，随后是 Homestead（家园版）、Metropolis（都市版）和\
  \ Serenity（宁静版）。以太坊在演进过程中经历了多次硬分叉，包括 2016 年臭名昭著的 DAO 黑客攻击后的 DAO 分叉。最近，以太坊于 2022\
  \ 年 9 月完成了其最大的升级，被称为“合并”（The Merge），将网络从工作量证明转变为权益证明共识。\n\n本章提供了以太坊核心概念、词汇以及构成生态系统的组件的概览。\n\
  \n### 以太坊历史\n\n以太坊自诞生以来的演变是一段标志着重大技术进步、社区增长以及全球金融格局变化的变的历程。让我们深入探讨这一革命性区块链项目历史中的关键里程碑。\n\
  \n2013 年，维塔利克·布特林在一份白皮书中首次提出了以太坊的想法。这份具有开创意义的文件勾勒了一个具有内置图灵完备编程语言的区块链平台愿景。布特林的提案旨在扩展区块链技术的能力，使其不再仅仅是交易媒介，而是设想一个开发者可以在其中构建去中心化应用的平台。\n\
  \n次年，即 2014 年，以太坊基金会成立，领导该项目的开发。为了资助该项目，启动了平台原生加密货币 `Ether` 的众筹。众筹活动受到了广泛的热烈响应，募集了\
  \ 1800 万美元，为以太坊的发展奠定了基础。\n\n2015 年，以太坊的初始测试网版本 Frontier 发布。这标志着以太坊发展的重要一步，为开发者提供了一个实验和精炼其去中心化应用的平台。此外，启动了\
  \ Olympic 测试网试验，以鼓励对以太坊系统进行测试并识别漏洞。\n\n2016 年见证了以太坊第一个正式版本 Homestead 的发布。这意味着该平台开始被主流接纳。然而，这一年也被臭名昭著的\
  \ DAO 黑客攻击蒙阴，当时有 500 万美元被盗。这一史无未有的事件导致了以太坊的硬分叉，这是其历史上的重要时刻。\n\n2017 年，Metropolis\
  \ 分叉分两部分发布：Byzantium（拜占庭）和 Constantinople（君士坦丁）。这次升级旨在为以太坊向权益证明共识机制过渡做准备，标志着其发展的重大转变。这一年也见证了\
  \ `Ether` 价格飙升。\n\n2018 年，以太坊基金会宣布了 1 亿美元的资助计划，以支持生态系统的发展。同年，Plasma 白皮书发布，概述了层 2\
  \ 扩展解决方案的愿景。\n\n2019 年，Istanbul（伊斯坦布尔）分叉带来了进展，改进了以太坊的可互操作性。此外，以太坊 2.0 的测试网启动，标志着向权益证明共识机制迈进。\n\
  \n2020 年，以太坊 2.0 创世阶段（Genesis）上线，标志着权益链的启动，为 `Ether` 持有者提供了质押代币的机会。去中心化金融（DeFi）和非同质化代币（NFT）的崛起进一步推动了增长。\n\
  \n2021 年，Berlin（柏林）分叉针对网络使用引入了 Gas 费用优化。此外，Altair（阿尔泰尔）升级完善了权益链的激励和参数。\n\n2022 年，以太坊通过“合并”最终转型为权益证明共识模型，这是一个期待已久的事件。然而，在“加密寒冬”期间，`Ether`\
  \ 的价格有所下跌。\n\n从最初的愿景到如今成功的去中心化高效区块链，以太坊雄心地遵循着其路线图。以太坊持续通过分片和层 2 解决方案进化，以进一步扩展网络。这种对创新和包容的承诺持续驱动着以太坊的发展，并使其成为区块链领域的领先平台。\n\
  \n## 以太坊核心架构概念\n\n深入以太坊的复杂世界，本节将引导你了解以太坊架构的核心概念，包括节点、账户、交易、区块、Gas 以及平台原生加密货币 `Ether`。它还将解析以太坊改进提案（如\
  \ `EIP-1559`）对网络 Gas 机制的影响。从理解 `Ether` 作为交易媒介、激励和燃料的多重作用，到它的面和创建，我们将探索其对以太坊生态系统的深远影响。本指南还将阐明以太坊的共识算法，详细介绍其最初的工作量证明模型以及通过“合并”向权益证明的过渡。我们旅程的一部分还将涵盖智能合约这一革命性概念，探索其定义、用例和未来潜力，并深入探讨其主要编程语言\
  \ `Solidity`。本指南解析的另一个关键概念是以太坊虚拟机（EVM），突出其架构、执行智能合约的作用、对以太坊互操作的影响以及对未来的愿景。\n\n图\
  \ 2.1 提供了一个基础的视觉表示，展示了以太坊架构的一些核心元素之间是如何相互关系的：\n\n![](img/Figure_2.1.jpg)\n\n###\
  \ 以太坊节点\n\n\n\n\n以太坊节点是以太坊网络的骨干。它们相互通信以传播交易和区块，从而维护并保护区块链的安全。以太坊网络中的每个节点以全节点或轻量节点的形式运行，每个节点都具有不同的角色和能力。\n\
  \n### 全节点\n\n全节点下载并不断更新以太坊区块链的完整副本。它根据以太坊的共识规则独立验证每一个区块和交易。它不依赖于任何其他节点获取信息。通过这种方式，全节点为以太坊网络的安全性和去中心化做出了贡献。\n\
  \n全节点作为检查交易和区块有效性的权威参考点。它们还会将验证后的数据中继到网络中的其他节点。虽然运行全节点需要大量的计算能力和存储空间，但它提供了最高级别的安全性和隐私保护。\n\
  \n示例：运行全节点的用户将在其计算机上存储完整的以太坊区块链。当创建一个新区块时，他们的节点将验证该区块及其所有交易。一旦区块被确认，它就会被添加到区块链中。\n\
  \n## 轻量节点\n\n轻量节点也称为轻量级节点或客户端节点，只下载区块链的一小部分。轻量节点不是处理整个区块链，而是下载区块头并仅从全节点请求它们所需的特定数据。\n\
  \n轻量节点为希望与以太坊网络交互但没有资源运行全节点的个人或服务提供了一个更易存储的选项。例如，手机钱包是轻量节点的一种类型。\n\n示例：运行轻量节点的手机钱包由于存储限制，不会下载整个以太坊区块链。相反，当进行交易时，钱包会向全节点请求必要的信息以验证交易。\n\
  \n## 账户\n\n账户是以太坊生态系统中的基础构建模块，作为各种网络操作的交易枢纽。它们不仅仅传统的数字钱包；它们是被赋予了复杂能力的独特实体。理解以太坊上的这些账户揭示了该平台多方面且动态的本质。\n\
  \n外部账户 (`EOAs`) 和合约账户构成了以太坊账户的两大类，每个账户都具有独特的特征和功能，驱动着以太坊网络内的各种活动。\n\n外部账户，顾其名，通过私钥受个人或组织的直接控制。这些私钥类似于加密密码，赋予账户所有者管理其账户和发起交易的专有权利。将\
  \ EOA 想象成邮箱：就像需要钥匙来打开邮箱并访问其内容一样，访问 EOA 并执行交易也需要私钥。\n\n让我们用以太坊用户 Alice 的例子来说明这一点。Alice\
  \ 创建了一个由 20 字节地址表示的 EOA，该地址是以太坊网络中的唯一标识符。此类地址的示例为 `0x3236D7aE3966f7598B5c71f877B152998b4619ee`。这个地址类似于电子邮件地址，使其易于识别和与其账户交互。拥有与其\
  \ EOA 关联私钥的 Alice 现在可以向其他账户发送 Ether（以太坊的原生加密货币）、支付交易费用或与智能合约交互。\n\n在实际场景中，Alice\
  \ 可能会决定向 Bob 发送 `1 ETH`。Alice 的账户 nonce（计数器，用于确保每笔交易只能被处理一次）会增加 1。这有助于防止重放攻击，即同一交易可能被多次广播。发送者随后使用其私钥对交易进行签名，作为数字签名的形式，在交易广播到网络之前对其进行认证。\n\
