  \n[](#toc.xhtml#cs03)\n\n## 第 III 部分：如何开发 Web3 应用\n\n> 引导读者了解 Web3 应用开发的实践方面，从利用开发工具到创建特定类型的\
  \ DApp。\n\n# 第 7 章 Web3 开发工具\n\n## 引言\n\n在去中心化应用（dApps）开发的充满活力的生态系统中，涌现了各种工具和平台，以支持开发者创建创新解决方案。本章将探索以太坊生态系统中一些最著名的开发工具的性作用，包括\
  \ `Truffle`、`Hardhat`、`Ganache` 和 `Infura`。\n\n我们将从深入研究 `Truffle` 和 `Hardhat` 的核心功能开始，这是以太坊最常用的开发框架。这些工具提供了全面的功能\
  \ set，以简化编写、测试、部署智能合约以及与以太坊网络交互的过程。我们还将涉及其他显著的 Web3 开发平台，以提供该领域可用工具的更广泛视角。\n\n接下来，我们将深入探讨智能合约开发的实践方面，重点关注编写、编译和部署合约的关键阶段。在这里，我们将通过实际示例和代码段引导你完成这一过程。\n\
  \n然后，我们将关注 `Ganache`，这一个开发者可以用于测试和实验的个人以太坊区块链。我们将引导你完成 `Ganache` 的设置和模拟交易，以及将其与\
  \ `Truffle` 和 `Hardhat` 集成。\n\n接下来，我们将探索 `Infura`，这是一种关键工具，为开发者提供了以太坊和 `IPFS` 网络的扩展访问，从而消除了他们维护基础设施的需求。我们将涵盖\
  \ `Infura` 在你的 dApp 中的设置和集成。\n\n本章随后深入探讨 Web3 开发的最佳实践。我们将讨论智能合约安全、高效 Gas 使用的微妙之处以及构建用户友好\
  \ dApp 的艺术。\n\n在最后一部分，我们将关注在 dApp 开发领域至关重要的高级功能和工具。我们将涵盖使用 `Chainlink VRF` 为你的应用程序提供可验证的随机性，以及以太坊命名服务\
  \ (`ENS`) 使以太坊地址系统人性化。无论你是经验丰富的开发者还是以太坊生态新手，本章都旨在让你对核心工具和开发实践建立稳健的理解。那么，让我们进入以太坊开发工具的世界吧！\n\
  \n## 结构\n\n本章涵盖以下主题：\n\n* 理解 `Truffle` 和 `Hardhat` 的作用\n* 编译和部署智能合约\n* 使用 `Ganache`\
  \ 进行本地区块链开发\n* 设置和使用 `Infura`\n* Web3 开发的最佳实践\n\n## 目标\n\n在本章结束时，读者不仅将获得理论知识，还将\
  \ Web3 开发工具的实用技能，使他们能够在以太坊平台上创建安全、高效且用户友好的去中心化应用。\n\n## 理解 Truffle 和 Hardhat 的作用\n\
  \n本章的第一节深入探讨 `Truffle` 和 `Hardhat`，这是以太坊开发的两个工具。这些基于 JavaScript 的环境有助于智能合约的开发、测试和部署。我们将探索它们的功能，比较它们的用途，并引导你在何时使用每种工具。\n\
  \n### Truffle 简介\n\n\n\n\n\nTruffle 是一个著名的以太坊开发环境、测试框架和资产流水线。作为一个开发环境，它为开发者提供了一系列工具来帮助创建智能合约，使他们能够轻松且精确地构建\
  \ dApps。Truffle 基于 JavaScript，这意味着开发者可以利用他们对 JavaScript（最广泛使用的编程语言之一）的知识，在以太坊上进行开发。\n\
  \n## Truffle 的安装\n\n要开始使用 Truffle，必须首先安装。安装过程非常直观，特别是对于具有 Node.js 环境经验的人来说。Truffle\
  \ 以 Node 包管理器（`npm`）模块的形式提供。因此，要安装 Truffle，需要在机器上安装 Node.js 和 `npm`。一旦满足这些前提条件，就可以使用命令行界面安装\
  \ Truffle。\n\n## Truffle 的核心功能\n\nTruffle 具备了一系列核心功能，使得以太坊开发更加高效且易于管理。这些功能包括：\n\n\
  * 创建智能合约：Truffle 简化了创建智能合约的过程。它提供了一个结构化环境，开发者可以在其中编写、编译和部署合约。\n\n* 编译：Truffle 提供自动化的合约编译。一旦写好合约，Truffle\
  \ 就可以将其编译为以太坊虚拟机（`EVM`）可以理解的格式。\n\n* 迁移（Migration）：迁移是将智能合约部署到以太坊网络的过程。Truffle 通过提供自动化迁移框架简化了这一过程。\n\
  \n* 测试：Truffle 还提供了一个强大的测试框架。它支持自动化测试，允许开发者使用 JavaScript 编写测试，并在智能合约上运行它们。\n\n##\
  \ Truffle 在智能合约开发中的作用\n\nTruffle 在智能合约开发中发挥着至关重要的作用。通过提供创建、编译、迁移和测试工具，Truffle 让开发者能够更多地关注应用程序的逻辑，而不是以太坊网络的复杂细节。它是任何严肃的以太坊开发者的必备工具。\n\
  \n在下一节中，我们将深入探讨 Hardhat，这是另一个以太坊开发的关键工具。虽然 Truffle 和 Hardhat 有某些相似之处，但它们也有一些独特的特性，使其适用于不同的用例。\n\
  \n## 揭秘 Hardhat\n\nHardhat 是以太坊开发者的另一个关键工具。它是一个开发环境，为开发者提供了构建健壮安全的以太坊应用程序所需的所有内容。与\
  \ Truffle 类似，Hardhat 同样基于 JavaScript，这使其被广泛的开发者可以使用。然而，Hardhat 以其一些独特特性脱颖而出，使其成为某些场景下的卓越工具。\n\
  \n### Hardhat 的独特特性\n\n以下是 Hardhat 的独特特性：\n\n* Hardhat 网络：Hardhat 最显著的特性之一是 Hardhat\
  \ Network，这是一个为开发设计的本地以太坊网络。该网络允许开发者在将合约推送到以太坊主网或测试网之前，在本地部署并测试它们。它包含了矿工模式和自动交易挖掘等功能，可以显著增强开发过程。\n\
  \n* 卓越的调试能力：Hardhat 将调试提升了一个新高度。每当交易失败时，它都会提供详细的堆栈跟踪，让开发者更容易识别和修复问题。此外，它与 `ethers.js`\
  \ 和 `Waffle` 等流行的以太坊开发工具无缝集成，为开发者提供了一个统一且高效的开发环境。\n\n* console.log：Hardhat 支持在智能合约中使用\
  \ `console.log`，这一功能在许多其他开发环境中是不可用的。该功能允许开发者打印变量并以更直观的方式调试合约。\n\n## Hardhat 的安装与使用\n\
  \n本指南将帮助你了解如何设置和使用 Hardhat 这一以太坊开发环境。我们将介绍安装 Hardhat、创建 Hardhat 项目、编译、测试以及部署示例智能合约的过程。\n\
  \n### 第 1 ：安装\n\n要安装 Hardhat，你需要创建一个 `npm` 项目。进入空文件夹，运行 `npm init` 并按照指示操作。\n\n\
  如果你的机器上没有安装 `npm`，可以使用 Node.js 安装程序进行安装。我们建议使用 `npm` 版本 7 或更高版本，因为这简化了 Hardhat 插件的安装。\n\
  \n一旦你的 `npm` 项目准备就绪，运行以下命令安装 Hardhat：\n\n```bash\nnpm install save dev hardhat\n\
  ```\n\n要使用本地安装的 Hardhat，你需要使用 `npx`（即 `npx hardhat`）。\n\n### 第 2 ：创建 Hardhat 项目\n\
  \n要创建 Hardhat 项目，在项目文件夹中运行 `npx hardhat init`。你会看到一个欢迎消息和一个询问你想做什么的提示。选择“Create\
  \ a JavaScript project”（创建一个 JavaScript 项目）或“Create a TypeScript project”（创建一个 TypeScript\
  \ 项目）并按照指示操作：\n\n```bash\nnpx hardhat\n```\n\n### 第 3 ：编译你的合约\n\nHardhat 项目在 `contracts/`\
  \ 文件夹中包含一个示例智能合约。要编译你的合约，运行以下命令：\n\n```bash\nnpx hardhat compile\n```\n\n### 第 4\
  \ ：测试你的合约\n\nHardhat 使用 Mocha 和 Chai 进行测试。你的项目会在 `test/` 文件夹中包含一个示例测试文件。要运行测试，使用以下命令：\n\
  \n```bash\nnpx hardhat test\n```\n\n### 第 5 ：部署你的合约\n\n要部署合约，你可以使用 Hardhat 脚本。你的项目会在\
  \ `scripts/` 文件夹中包含一个部署脚本。使用以下命令运行脚本：\n\n```bash\nnpx hardhat run scripts/deploy.js\n\
  ```\n\n以下是 `deploy.js` 代码片段：\n\n```javascript\n// 我们在这里显式地引入了 Hardhat 运行时环境。这是可选的，\n\
  // 但通过 `node <script>` 以独立方式运行脚本时很有用。\n// 你也可以通过 `npx hardhat run <script>` 运行脚本。如果你这样做，\n\
  // Hardhat 将编译你的合约，将 Hardhat 运行时环境的\n// 添加到全局作用域，并执行脚本。\nconst hre = require(\"\
  hardhat\");\n\nasync function main() {\n  const currentTimestampSeconds = Math.round(Date.now()\
  \ / 1000);\n  const unlockTime = currentTimestampSeconds + 60;\n\n  const lockedAmount\
  \ = hre.ethers.parseEther(\"0.001\");\n\n  const lock = await hre.ethers.deployContract(\"\
  Lock\", [unlockTime], {\n    value: lockedAmount,\n  });\n\n  await lock.waitForDeployment();\n\
  \n  console.log(\n    `带有 ${hre.ethers.formatEther(lockedAmount)}ETH 和解锁时间 ${unlockTime}\
  \ 的 Lock 已部署到 ${lock.target}`\n  );\n}\n\n// 我们推荐这种模式以便到处使用 async/await\n// 并正确处理错误。\n\
  main().catch((error) => {\n  console.error(error);\n  process.exitCode = 1;\n});```\n\
  \n### 第 6 将钱包或 dApp 连接到 Hardhat 网络\n\n默认情况下，Hardhat 在启动时会启动 Hardhat Network 的新实例。你也可以独立地运行\
  \ Hardhat Network，允许外部客户端（如钱包或 dApp）连接到它。要执行此操作，运行以下命令：\n\n```bash\nnpx hardhat\
  \ node\n```\n\n该命令会在 Hardhat 网络之上启动一个 JSON RPC 服务器，允许你的钱包或应用程序连接到 `http://127.0.0.1:8545`。\n\
  \n## Hardhat 在以太坊开发中的作用\n\nHardhat 在以太坊开发生态系统中起着不可整合的作用。它的独特特性，例如 Hardhat 网络及其增强的调试能力，可以简化并开发流程。这使其成为希望优化工作流并快速高效地构建高质量\
  \ dApps 的开发者的热门选择。\n\n\n\n\n\n# 其他 Web3 开发平台\n\n在我们继续探索 Web3 开发领域的图谱时，考虑 Truffle\
  \ 和 Hardhat 之外的可用工具和平台至关重要。各种创新平台正在涌现，每个平台都有其独特的特性和功能，旨在促进 dApp 的创建、测试和部署。在本节，我们将深入探讨此类此类平台，包括\
  \ Odyssey、PARSIQ Network、thirdweb、Alchemy、Ceramic Network、Graph、Questbook、deBridge、LayerZero\
  \ Network 和 Infura。通过了解每个平台的功能和优势，开发者可以在为 Web3 领域的特定需求选择最佳工具时做出更明智的决策。让我们仔细查看这些平台提供的功能：\n\
  \n*   **Odyssey**: Odyssey 是 web3 平台中的领先选择，提供了一个名为 `Momentum` 的产品开发平台。Odyssey 在\
  \ Kusama 上开发，促进了社区内的协作，同时有助于创新产品的创建。\n*   **PARSIQ Network**: PARSIQ Network 提供对\
  \ Web3 数据的实时访问，是创建事件驱动应用程序的理想选择。该平台允许访问各种区块链的数据，包括币安智能链（Binance Smart Chain）、Avalanche、Polygon\
  \ 和 Ethereum。\n*   **Thirdweb**: Thirdweb 以用户友界面界面，简化了智能合约的创建。其针对数字资产的安全功能以及用于开发各种\
  \ web3 应用的预构建合约使其成为许多开发者的首选。\n*   **Alchemy**: Alchemy 是一个强大的区块链开发者平台，以其能够帮助开发者高效编写代码而闻名。它针对\
  \ `IPFS` 和 `Ethereum` 的 `JSON RPC API` 连接，以及用于管理数据和用户交互的直观仪表板使其成为可靠的选择。\n*   **Ceramic\
  \ Network**: Ceramic Network 为 Web3 生态系统带来了数据模块化，使 dApp 的创建、管理和部署更加无缝。它具有一个无许可的数据流网络，便于数据共享。\n\
  *   **Graph**: Graph 是一种索引协议，允许查询 Ethereum、`IPFS` 以及其他数据源。通过其 `Global GraphQL API`，它可以轻松访问来自各种来源的数据。\n\
  *   **LayerZero Network**: LayerZero Network 具有全链互操作协议，允许区块链网络之间的无缝连接。它被认为是未来极具前景的互操作工具。\n\
  *   **Infura**: 与 Alchemy 类似，Infura 提供 Web3 基础设施，为开发者提供高质量的 `Ethereum` 和 `IPFS APIs`，为\
  \ Ethereum dApp 奠定坚实基础。\n\n通过了解这些平台的独特优势，开发者可以选择最适合其 Web3 领域特定项目需求的工具。\n\n表 7.1\
