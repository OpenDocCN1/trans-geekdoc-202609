    # VI. CONCLUSIONS


    # B. Fault detection results


    The PCA model is built from healthy data during normal operating conditions and
    then features are extracted in both the residual and principal subspaces under
    different faulty conditions. The features for this study are $T^2$ and $SWE$ statistics.
    In order to show the incipient fault detection capabilities, different fault amplitudes
    are simulated and the detection accuracy is computed using SVM. From Table II,
    it is shown that for the fault 1 with $R_{f1}=30$ ohm, the SVM classifier provides
    detection accuracy of 86 % when the amplitude becomes larger with $R_{f1}=20$
    ohm, the detection accuracy is enhanced with 96.61 %. So to be able in detecting
