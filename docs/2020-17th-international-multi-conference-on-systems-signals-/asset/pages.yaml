    # I. INTRODUCTION


    Demand for Photovoltaic (PV) energy has constantly increased by 20% to 25% in
    the last 20 years with many major developments in grid-connected systems. A key
    factor to take into account for future Grid-Connected Photovoltaic (GCPV) systems
    is fault detection [9]. Several FD techniques have been proposed in the literature
    using model-based, electrical signal-based, and data-driven methods [2], [3],
    [4], [5], [7].


    For instance, Dress et al. [8] developed a fault detection task on monitoring
    irregularities using satellite and local monitoring using sensors for GPV systems.
    A simple method with fewer resources based on the wavelet transform is proposed
    [19]. This approach uses the standard deviation of the wavelet coefficients for
    the PV fault voltage. In [10], fault pattern recognition of aerial PV module images
    are based on a deep learning is


    Spartaru et al., [19] proposed a sequence-feature vector as input to the fault
    diagnosis model based on the parameter extraction from I-V curve characteristics.
    The emergence of kernel-based extreme learning (KBEL) has been employed in the
    establishment of an automatic fault diagnosis system using improved Simulink PV
    model.


