    **Abstract—To ensure high reliability of the Grid-Connected Photovoltaic (PV)
    systems, fault detection and automatic monitoring are essential to keep the PV
    and grid operating properly. Regardless of fault types, incipient faults are more
    difficult to detect and accurately isolate. As an alternative and effective method,
    principal components analysis (PCA) is proposed to extract support vector machines
    (SVM) technique is used to quickly detect faults that occurs in the GPV system.
    The T-squared error (SPE) strategy is generally extracted and selected within
    the PCA framework.


