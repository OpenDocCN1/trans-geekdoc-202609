    # IV. FAULT DETECTION USING PCA-BASED SVM TECHNIQUE


    The proposed method involves three stages including feature extraction, feature
    selection and detection. The measures are applicable to different possible scenarios.
    PCA is built using only the data in the training set under normal operating conditions.
    This projection is achieved by projecting the data onto a subspace of positive
    information. The structure of the obtained PCA model is represented by the directions
    of the subspace where its dimension is less than that of the original data. Through
    this operation, significant features are extracted (Section II-A observations).
    After that, they will be used using logistic classification. These codes are kept
