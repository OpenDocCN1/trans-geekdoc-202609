  md: 'including aging, PV system faults can be divided into three major categories
    according to their characteristics: intermittent, abrupt, or incipient. Intermittent
    faults refer to faults that change over time such as partial shading or environmental
    stress (e.g., dust or contamination). Permanent or abrupt faults refer to faults
    that occur instantaneously as a result of damage to the PV array such as line-to-line
    or line-to-ground short circuits, junction boxes, or cellconnections. Hot spots
    as permanent faults are the most challenging, and they are initially difficult
    to detect because they are small and change over time. If they are not identified
    early, they can result in gradual damage to the PV cells. Incipient faults can
    occur on the DC or AC sides. Examples include PV module defects and DC/DC converters.
    AC-side faults (inverter side) include Binary Gate Inverter (BGI) faults, wiring
    degradation, and overheating.


    The purpose of this paper is to provide a framework using SVM classifier to detect
    GCPV faults in DC/DC converters (focusing on incipient faults). In the developed
    approach, the principal component analysis (PCA) is used to extract and select
    sufficiently important features from the GCPV data. These features are fed to
    a SVM classifier which can detect faults in GCPV under a satisfactory random environment.
    detected.


    The rest of the paper is organized as follows: Section 2 briefly reviews types
    of PCA in extracting and selecting features. Section 3 is devoted to machine learning
    techniques. The simulation results that assess the performance of the proposed
    PCA-based SVM are presented in Section 4. Section 5 concludes the paper.


    # II. FEATURE EXTRACTION AND SELECTION


    # A. PCA-based feature extraction


    We consider the data matrix $X$, measured under normal conditions with $N$ variables,
    the data is normalized to zero mean and unit variance


    ```

    $X = [X_1, X_2, ..., X_m] \in \mathbb{R}^{N \times m}$ (1)

    ```


    The PCA transforms the data matrix into a new matrix $T \in \mathbb{R}^{N \times
    m}$ of uncorrelated features, $t_1, t_2, ..., t_m$


    ```

    $T = XP$ (2)

    ```


    $P$ is the loading matrix found by an orthogonal transformation of the covariance
    matrix $\Phi$ which can be found through eigenvalue decomposition


    ```

    $\Phi = P\Lambda P^T$ (3)

    ```


    where $\Lambda = \text{diag}(\lambda_1, \lambda_2, ..., \lambda_m)$ is a diagonal
    matrix containing the eigenvalues in a decreasing order.


    Data dimensionality reduction can be achieved by splitting $P$ and $A$ into modelled
    and non-modelled variations. The first one $P_k \in \mathbb{R}^{m \times k}$ and
    $A_k \in \mathbb{R}^{k \times k}$ spanning the principal subspace and the other
    $P_t \in \mathbb{R}^{m \times (m-k)}$ and $A_t \in \mathbb{R}^{(m-k) \times (m-k)}$
    spanning the residual subspace. The columns of $P_k$ are the eigenvectors of the
    covariance matrix associated with the first $k$ largest eigenvalues $\lambda_i$
    which correspond to the principal components. The columns of $P_t$ are the remaining
    $m-k$ eigenvectors in $\Lambda_t$.


    As a result, the PCA decomposes the data $X$ into


    ```

    $X = XT + \hat{E}$ (4)

    ```


    $\hat{T}$ represents the selected features which are achieved through the projection
    of $X$ onto the $i$ eigenvectors corresponding to the largest variances of the
    covariance matrix. In summary, the PCA model is based on an eigen-decomposition
    of the covariance matrix $\Phi$.


    The selected features should be constructed in a way to enhance the differences
    between normal and various abnormalities operating conditions. To obtain a good
    performance of SVM classification-based approach, it is important to extract status
    features via PCA-based model by enumerating possible values. This type of features
    is simple to compute and efficient and robust. The features considered as appropriate
    for faults diagnosis in GCPV include the following $T^2$ statistical measures
    the variances in the principal subspace. It is given by


    ```

    $T^2 = X^T P \Lambda_k^{-1} P^T X$ (6)

    ```


    The Squared Reconstruction Error (SWE) is the most important measure in the remainder
    principal components of subspace. It is defined as


    ```

    $SWE = X^T P_t \Lambda_t^{-1} P_t^T X$ (7)

    ```'
