    In this paper, we considered the problem of incipient fault detection (FD) for
    Grid-Connected Photovoltaic (GCPV) systems. The developed techniques were based
    on the support vector machines (SVM) and principal component analysis (PCA). They
    were addressed using SVM for features extraction and selection and the SVM classifier
    for detection. The $T^2$ and $SWE$ statistics were accurately applied for fault
    detection. Each case was investigated in order to show the robustness and the
    efficiency of the developed approach. The proposed solutions were effective in
    detecting the incipient faults in GCPV systems under normal and abnormal conditions.


