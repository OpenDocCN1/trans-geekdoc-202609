  md: '# III. FAULTS DETECTUTION USING PCA-BASED SVM TECHNIQUE


    The objective of the next section is to apply PCA-based SVM technique for FD purposes.


    # A. Support vector machines


    Vapnik first introduced support vector machines (SVM) [18]. Next, an overview
    of the basic ideas developing SVM classification is considered. Given a training
    set of $N$ samples $x_k \in \mathbb{R}^m$ with output $y_k \in \{-1,1\}$ which
    represents a set of labeled training data. The SVM takes the following form:


    ```

    $y_k = f(x_k) = w^Tx_k + b$

    ```


    where $w \in \mathbb{R}^m$ and $b \in \mathbb{R}$. In order to ensure the hyperplanes
    of separation to be as far from the support vectors as possible, the margin defined
    by $b$ should be maximized (see Fig.1). It is equivalent to:


    ```

    $\min \frac{1}{2}||w||^2$ subject to $y_k(w^Tx_k + b) \geq 0 \quad \forall k$

    ```


    Allocating Lagrange multipliers $\alpha_k$, where $\alpha_k \geq 0$, the quadratic
    programming (QP) optimization problem (9) becomes


    ```

    $L_{QP} = \frac{1}{2}||w||^2 - \sum \alpha_k y_k(w^Tx_k + b) + \sum \alpha_k$

    ```


    by setting its with respect to $w$ and $b$ to zero


    ```

    $\begin{cases} \frac{\partial L_{QP}}{\partial w} = 0 \ \frac{\partial L_{QP}}{\partial
    b} = 0 \end{cases} \Rightarrow \begin{cases} w = \sum \alpha_k y_k x_k \ \sum
    \alpha_k y_k = 0 \end{cases}$

    ```


    Substituting (11) into (10) gives the optimal solution of the primary QP depending
    on:


    where $H = [x_i^Tx_j]_{i,j=1}^N$. The solution of the optimization problem (12)
    to determine $\alpha$. Then, it is easily calculated using (11). In order to determine
    $b$, a new data $x_s$ satisfying (11) is presented, and a support vector takes
    the following form:


    ```

    $y_s(w^Tx_s + b) = 1$

    ```


    Referring to the support hyperplane equations and regardless of the class $y_s$,
    the variable $b$ is given by:


    ```

    $b = -w^Tx + \sum_{m \in S} \alpha_m y_m x_m$

    ```


    In turn, the optimal orientation of the separating planes is obtained.


