    # A. Description of grid-connected systems


    In this study, the distributed structure has that considered. This structure is
    a modular application that allows the multiplication and diversification of technologies,
    for which the combination of several different types of photovoltaic sensors can
    be made. Figure 2 shows one aspect of the possible configuration. It is a DC voltage
    bus with a voltage value of 500 V. All panel/converter elements are connected
    in parallel to this bus. Downstream converter does not control the global MPPT
    tracking, each panel is individually controlled in optimal way. As well, the controllers
    are robust to perturbations. The high voltage makes possible to avoid a reduction
    of the cable sections, which constitutes a material gain in (copper or aluminum).'
