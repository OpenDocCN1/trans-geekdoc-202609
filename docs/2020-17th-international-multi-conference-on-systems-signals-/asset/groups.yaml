    ## B. 故障检测结果


    PCA 模型根据正常条件下的健康数据构建，然后在故障条件下在残差和主子空间中提取特征。本研究的特征是 $T^2$ 和 $SWE$ 统计。为了展示早期检测能力，对不同的故障幅值进行了仿真并使用
    SVM 计算检测准确率。表表所示，对于 $R_{f1}=30$ 欧姆的故障 1，SVM 分类器的检测准确率为 86%；当幅值增大到 $R_{f1}=20$
    欧姆时，准确率提高到 96.61%。因此能够以至少的准确率检测故障 1


    ## VI. 结论


    在本文，我们考虑了并网光伏（GCPV）系统的早期故障检测（FD）问题。开发的技术基于支持向量机 (SVM) 和主成分分析 (PCA)。通过 SVM 进行特征提取和选择，并使用
    SVM 分类器进行检测，$T^2$ 和 $SWE$ 统计被准确地应用于故障检测。对每种情况进行了调查，以展示所提方法的鲁棒性和效率。所提解决方案能够检测 GCPV
    系统在正常和异常条件下的早期故障。


