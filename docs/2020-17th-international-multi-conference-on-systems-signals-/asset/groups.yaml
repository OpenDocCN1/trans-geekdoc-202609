    和 $R_4$ 建模。这些电阻分别位于 A 点与电网之间，以及 B 点与 C 点之间。对于两种故障（fault_1 和 fault_2），建立了 0.5,
    1, 5, 10, 20, 30, 40, 50, 60 和 70 欧姆的电阻故障。对于情况3 和 4，考虑了 15, 20, 30, 50, 100, 1000,
    1500 和 2000 欧姆的电阻故障。


