    |---|---|---|---|---|---|

    | fault 1 | $R_{f1}=0$ 欧姆 | SVM | C1 | 83.25 | 68.00 |

    | fault 2 | $R_{f2}=50$ 欧姆 | SVM | C1 | 96.89 | 96.62 |

    | fault 3 | $R_{f3}=100$ 欧姆 | SVM | C1 | 73.86 | 73.67 |

    | fault 4 | $R_{f4}=200$ 欧姆 | SVM | C1 | 99.96 | 99.88 |

    | fault 5 | $R_{f5}=500$ 欧姆 | SVM | C1 | 81.36 | 72.24 |

