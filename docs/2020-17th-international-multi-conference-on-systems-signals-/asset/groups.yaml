    # III. 基于 PCA 的 SVM 故障检测技术


    下一节的目标是将基于 PCA 的 SVM 技术应用于故障检测（FD）。


    ## A. 支持向量机


    Vapnik 首次引入了支持向量机 (SVM) [18]。接下来，考虑了开发 SVM 分类的基本思想概述。给定一个包含 $N$ 个样本 $x_k \in \mathbb{R}^m$
    的训练集，输出为 $y_k \in \{-1,1\}$，代表一组标记过的训练数据。SVM 采用如下形式：


    ```

    $y_k = f(x_k) = w^Tx_k + b$

    ```


    其中 $w \in \mathbb{R}^m$ 且 $b \in \mathbb{R}$。为了确保分离平面尽可能远离支持向量，应该最大化由 $b$ 定义的间隔（见图1）。这等同于：


    ```

    $\min \frac{1}{2}||w||^2$ subject to $y_k(w^Tx_k + b) \geq 0 \quad \forall k$

    ```


    分配拉格朗日乘子 $\alpha_k$，其中 $\alpha_k \geq 0$，二次规划 (QP) 优化问题 (9) 变为：


    ```

    $L_{QP} = \frac{1}{2}||w||^2 - \sum \alpha_k y_k(w^Tx_k + b) + \sum \alpha_k$

    ```


    通过对 $w$ 和 $b$ 求导并令其为零：


    ```

    $\begin{cases} \frac{\partial L_{QP}}{\partial w} = 0 \ \frac{\partial L_{QP}}{\partial
    b} = 0 \end{cases} \Rightarrow \begin{cases} w = \sum \alpha_k y_k x_k \ \sum
    \alpha_k y_k = 0 \end{cases}$

    ```


    将 (11) 代入 (10) 得到主 QP 的最优解取决于：


    其中 $H = [x_i^Tx_j]_{i,j=1}^N$。确定 $\alpha$ 后使用 (11) 很容易计算出来。为了确定 $b$，引入一个满足 (11)
    的新数据 $x_s$，支持向量采取如下形式：


    ```

    $y_s(w^Tx_s + b) = 1$

    ```


    参考支持平面方程，无论类别 $y_s$ 如何，变量 $b$ 由下给出：


    ```

    $b = -w^Tx + \sum_{m \in S} \alpha_m y_m x_m$

    ```


    反之，得到了分离平面的最优方向。


    ![](img/f3f84f7d56d2b0eb64abc6bd106e286f_2_0.png)


    # IV. 基于 PCA 的 SVM 故障检测技术


    建议的方法包含三个阶段，包括特征提取、特征选择和检测。这些方法适用于不同的场景。PCA 仅使用正常运行条件下训练集中的数据构建。这种投影通过将数据投影到正信息子空间来实现。得到的
    PCA 模型结构由子空间的方向表示，其维度小于原始数据的维度。通过这一操作，提取了显著特征（见 II-A 节观测结果）。之后，它们将使用逻辑分类进行处理。这些代码保留在
    $\{-1,1\}$ 中，代表一组标记过的训练数据。所得分类器与特征集之间的比较允许做出有效决策。此外，利用从中提取并选择的不同特征执行了基于 SVM 的实验。


    ## A. 并网系统描述


    在这项研究中，考虑了分布式结构。这种结构是一种模块化应用，允许技术的倍增和多样化，可以组合多种不同类型的光伏传感器。图2 显示了可能配置的一个方面。它是一个电压值为
    500 V 的直流母线。所有面板板/转换器元件并联连接到该母线。下游转换器不控制全局 MPPT 跟踪，每个面板板都以优化方式被单独控制。此外，控制器对扰动具有鲁棒性。高电压使得避免减少电缆截面成为，这在材料（铜或铝）上是一种收益。


    ![](img/f3f84f7d56d2b0eb64abc6bd106e286f_3_0.png)


    ![](img/f3f84f7d56d2b0eb64abc6bd106e286f_3_1.png)


    该光伏电站由三个最大输出 4 kW 的光伏阵列组成。一个光伏阵列块由 2 条并联链路组成，每条链路有 4 个串联模块。每个模块包含 2 个电池（见图3）。每个光伏阵列连接到一个
    DC/DC 转换器。输出连接到 500 V 的直流母线。每个转换器由单独的最大功率点跟踪器 (MPPT) 控制。MPPT 使用“摄动与观测”技术来验证光伏阵列终端相对于最大功率的行为。一个三相串联转换器在功率耦合中将
    500 V 转换为直流和交流电，用于将功率馈到电网。获取了不同辐照度下的仿真结果。考虑了三类光伏故障（fault_1, fault_2 和 fault_3）。故障通过引入电阻变化来影响母线。当前故障（fault_2）被考虑在链路
