    # 使用机器学习技术进行光伏系统的故障检测


    Khadija Attouri, Mansour Hajji

    Hig 应用科学技术学院

    Kasserine

    Katrouni 大学

    Kasserine, 突尼斯


    Majid Mansouri, Mohamed-Fouzi Harkat,

    Abdelalek Kouadri, Hazem Nounoun

    Mohamed Nounou

    电气与计算机工程专业

    卡塔尔德州州大学

    多哈，卡塔尔


    **摘要—** 为了确保并网光伏（PV）系统的高可靠性，故障检测和自动监控对于保持光伏系统和电网的正常运行至关重要。无论故障类型如何，隐性故障更难以检测和精确隔离。作为一种替代且有效的方法，提出了主成分分析（PCA）来提取特征，并使用支持向量机（SVM）技术来快速检测光伏系统中发生的故障。在
    PCA 框架内，通常提取并选择 T 平方误差（SPE）策略。


    其引入是为了灵活且可靠地解决问题。在这种情况下，采用卷积神经网络（CNN）来处理故障分类。此外，开发了一种基于使用分类器检测串联电阻增加的故障检测（FD）方法
    [11]，用于光伏系统的运行状态。还开发了一种决策树（DT）用于检测光伏系统中的若干常规故障 [12], [13]。在 [7] 及其参考文献中可以找到用于各种类型光伏系统的不同智能技术。


    所提的任务是从主成分分析（PCA）、并网光伏系统、故障提取与选择、故障检测中学习。


    Davarif 等人 [14] 使用了功率和统计信号处理技术进行光伏系统检测。Silvestres 等人 [15] 开发了一种基于新型电压和电流指标的改进故障检测程序。Silvestres
    等人 [16] 开发了基于功率分析的四个指标，用于故障划分和光伏侧故障的检测。另一方面，[17]、[6], [5] 中的作者使用了多种多变量和单变量方法进行光伏故障检测。为了解决故障的复杂性并处理温度问题，数据驱动方法（如机器学习技术）已应用于建立光伏检测系统。支持向量机（SVM）是用于电力检测（PD）故障的著名学习方法
    [18]。Spartaru 等人 [19] 并验证了基于模糊分类器的串联电阻增加检测。这种方法对于隔离无故障更好，但对其他故障的准确性较低。


    # I. 引言


    在过去的20年里，对光伏（PV）能量的需求不断增长了20%到25%，并在网系统取得了许多重大进展。未来并网光伏（GCPV）系统需要考虑的一个关键因素是故障检测
    [9]。文献中已经提出了多种基于模型、基于电信号和基于数据驱动的故障检测技术 [2], [3], [4], [5], [7]。


    例如，Dress 等人 [8] 开发了一项利用卫星监控和利用传感器局部监控来监测 GPV 系统异常情况的故障检测任务。还提出了一种基于小波变换的资源较少的简单方法
    [19]。该方法使用光伏故障电压的小波系数的标准差。在 [10] 中，航空光伏模块图像的故障模式识别基于深度学习的。


    Spartaru 等人 [19] 根据 I-V 曲线特征提取的参数将序列特征向量作为故障诊断模型的输入。基于核的极学习（KBEL）的出现已用于利用改进的 Simulink
    光伏模型建立自动故障诊断系统。


    光伏系统的故障有很多原因，根据其特征可分为三大类：间歇性、突发性或隐性。间歇性故障是指随时间变化的故障，例如局部阴影或环境压力（如灰尘或污染）。永久性或突发性故障是指由于光伏阵列损坏而瞬间发生的故障，如线间短路或线对地、接线盒或电池连接。热点作为永久性故障最具挑战性，它们最初很难检测，因为它们很小且随时间变化。如果及早识别出它们，可能会导致光伏电池的逐渐损坏。隐性故障可能发生在直流侧或交流侧。示例包括光伏模块缺陷和
    DC/DC 转换器。交流侧故障（逆变器侧）包括双栅逆变器（BGI）故障、布线老化和过热。


    本文的目的是提供一个使用 SVM 分类器的框架来检测 DC/DC 转换器中的 GCPV 故障（专注于隐性故障）。在开发的方法中，使用主成分分析（PCA）从
    GCPV 数据提取并选择足够重要的特征。这些特征被输入 SVM 分类器，该分类器可以在检测到满意的随机环境下检测 GCPV 的故障。


    本文的其余部分组织如下：第 2 节简要回顾用于提取和选择特征的 PCA 类型。第 3 节专门介绍机器学习技术。第 4 节给出评估基于基于 PCA 的 SVM
    性能的仿真结果。第 5 节总结全文。


    # II. 特征提取与选择


    # A. 基于 PCA 的特征提取


    我们考虑正常条件下具有N$ 个变量的数据矩阵 $X$，数据归一化为零均值单位方差


    $X = [X_1, X_2, ..., X_m] \in \mathbb{R}^{N \times m}$ (1)


    PCA 将数据转换为新矩阵 $T \in \mathbb{R}^{N \times m}$ 的相关特征 $t_1, t_2, ..., t_m$


    $T = XP$ (2)


    $P$ 是通过协方差矩阵 $\Phi$ 的正交变换得到的，可以通过特征值分解找到


    $\Phi = P\Lambda P^T$ (3)


    其中 $\Lambda = \text{diag}(\lambda_1, \lambda_2, ..., \lambda_m)$ 是包含降序排列特征值的对角矩阵。


    数据降维可以通过将 $P$ 和 $A$ 分为建模和非建模部分来实现。第一个 $P_k \in \mathbb{R}^{m \times k}$ 和 $A_k
    \in \mathbb{R}^{k \times k}$ 跨越主空间，另一个 $P_t \in \mathbb{R}^{m \times (m-k)}$ 和
    $A_t \in \mathbb{R}^{(m-k) \times (m-k)}$ 跨越残差空间。$P_k$ 的列是对应前 $k$ 个最大特征值 $\lambda_i$
    的协方差矩阵特征向量，对应主成分。$P_t$ 的列是 $\Lambda_t$ 中剩余的 $m-k$ 个特征向量。


    结果，PCA 将数据 $X$ 分解为


    $X = XT + \hat{E}$ (4)


    $\hat{T}$ 代表所选特征，通过投影到对应于协方差矩阵方差最大的特征向量实现。总之，PCA 模型基于协方差矩阵 $\Phi$ 的特征分解。


    所选特征应以某种方式构建，以增强正常状态与各种异常运行状态之间的差异。为了获得基于 SVM 分类方法的良好性能，通过枚举可能值通过基于 PCA 模型提取状态特征是重要的。这种特征计算简单且高效稳健。适用于
    GCPV 故障诊断的特征包括：$T^2$ 测量主空间内的方差。其给出为


    $T^2 = X^T P \Lambda_k^{-1} P^T X$ (6)


    平方重构误差（SWE）是剩余主成分空间中最重要的指标。它定义为


    $SWE = X^T P_t \Lambda_t^{-1} P_t^T X$ (7)


