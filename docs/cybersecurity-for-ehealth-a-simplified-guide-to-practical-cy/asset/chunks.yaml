    The database systems and infrastructure that store sensitive patient healthcare
    data and information should also not be directly accessible to certain classes
    of users, especially those that are non-technical. Intermediate pre-processing
    mechanisms have often been used in reviewing requests for access/connection, and
    deciding whether these requests could otherwise be serviced by a subset of the
    central database system/infrastructure. This helps to preserve efficiency, and
    also forestall a situation wherein a bad user command or request might endanger
    a database asset of the organization.


    Furthermore, access to eHealth systems and infrastructures, as well as the data
    that they handle, should be oriented towards the tasks and job functions of various
    roles. Front desk workers do not need access to patient health records beyond
    that which pertains to scheduling their appointments. In the same way as Pharmacists
    might not necessarily need access to patient medical/healthcare records beyond
    that which relates to their medication history.


    ### 4. Restrict the interactions and participation of personal digital devices
    with eHealth systems and infrastructures


    Bring Your Own Device (BYOD) arrangements have sometimes offered a leeway through
    which threats and attacks have compromised the security of eHealth systems and
    infrastructures. The extent to which the security status of personal devices that
    interact with eHealth systems and infrastructures can be ascertained, is often
    limited to the extent to which organizational policies can effectively regulate
    the operations and activities of such devices across other engagements and interactions.
    In many cases, it is difficult to achieve such effectiveness in a foolproof way.


    Medical doctors who prefer the convenience of using their personal mobile devices
    to access eHealth portals and interfaces for prescribing patient medications,
    patients who use personal computers for TeleHealth consultations with healthcare
    professionals, and off-duty medical practitioners who use personal computers to
    pull medical records of monitored patient cases – all of these interactions and
    participation of personal digital devices in eHealth, are latent threats to the
    security of information technology systems and infrastructures in healthcare.


    It is therefore important that healthcare organizations that operate such BYOD
    arrangements have well-defined logical rules and policies that clearly specify
    and restrict what kinds of operations, interactions, and functions are authorized
    for such devices that feature within their healthcare services and operations
    chain, especially when patients’ sensitive healthcare or medical information is
    involved.


    ## Cybersecurity for eHealth: Operational Imperatives


    Healthcare organizations that feature eHealth systems and infrastructures in their
    chain of services and operations shoulder a huge responsibility. It is that of
    ensuring that the practices, procedures, and activities that characterize their
    organizational approach to operations and services do not become inimical to the
    interests and goals for cybersecurity of the eHealth systems and infrastructures
    that they rely. How can healthcare organizations ensure that the cultures and
    regimens that characterize their services and operations do not threaten the cybersecurity
    status of eHealth systems and infrastructures? Here are a few suggestions of operational
    imperatives to help safeguard the interests and goals of healthcare organizations
    in this regard.


    1. **Adopt a gradual integrated approach to technology changes and transformations.**
    Periods of change and transformation are often characterized by vacuums that can
    be occasioned by (a) insufficiencies/deficiencies in the scope of knowledge and
    information across several ranks, (b) uncertainties regarding what the future
    is likely to bring about (c) the struggles to adapt to disruptions to the `status
    quo`, and sometimes the inadequacies of existing coping mechanisms, and (d) (perceived/actual)
    insufficiencies in current individual or collective capacities and capabilities
    to meet the demands of the new era. These are some of the socio-technical realities
    that have frequently been associated with technology-related changes and transformations.


    Hackers and cybercriminals watch out for such periods of changes and transformation
    too, and are quick to spot lapses that could be exploited to compromise security.
    One testament is the sudden transition to working from home for many organizations
    as a result of widespread lockdowns across the World occasioned by the COVID-19
    Pandemic of the year 2020.


    Thus, it is important that changes and transformations, especially those that
    are technology-related, adopt a gradual integrated approach – one that is coordinated
    and keeps in focus, the fundamental socio-technical realities of the organization,
    beginning from the baselines. Through this approach, users can be inspired and
    supported to gradually grow into technological changes and transformations, in
    ways that would be beneficial to the goal of holistic outcomes that impact positively
    on business interests.


    2. **Establish policies and processes using bottom-up approaches that are multi-stakeholder-involved.**
    A key lesson that has been learnt in the course of civil class actions and huge
    settlement fines over the course of recent years is that the responsibility of
    ensuring cybersecurity for eHealth systems and infrastructures is not reserved
    exclusively for the Chief Security Officer (CSO), the Chief Information Security
    Officer (CISO), or the Security & Risk Management Apparatuses of the healthcare
    organization.


    One of the most embarrassing realities that have been experienced by several organizations
    in the discourse of healthcare cybersecurity, and indeed cybersecurity generally,
    is how the huge investments that have been applied, and shrewd strategies adopted
    at the higher levels of the organization to formulate policies and processes that
    are both robust and resilient, all fall flat at the baselines of the organization
    with the naive click of a button.


    In essence, it is never bad counsel to involve the lower ranks of the healthcare
    organization in discussions pertaining to the establishment of new policies and
    processes, and the revising of old ones. This is imperative since human errors
    and mistakes resulting from unawareness regarding cybersecurity best practices
    adopted by healthcare organizations – which are often enshrined in corporate documents
    that define organizational policies, processes, and procedures – is one of the
    leading socio-technical and socio-cultural lapses that have continued to plunge
    the global healthcare sector into unnecessary cybersecurity distress. In fact,
    it was the leading causative factor behind 90% of cyber data breaches that were
    reported in the United Kingdom in 2019.


    3. **Build and nurture a strong cybersecurity culture.** The cybersecurity status
    of an organization is only as resilient as the overall cybersecurity culture that
    is reflected at all levels of the organization. In the healthcare industry, and
    actually all industries, a robust cybersecurity culture can often spell the difference
    between an averted threat situation, and a successful cyber-attack. But then,
    how can such a culture be built?

    '
