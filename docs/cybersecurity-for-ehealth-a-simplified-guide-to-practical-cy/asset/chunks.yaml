- raw: 'Also, there is the concern of being able to transmit eHealth data and information
    across borders for the purpose of enhancing the quality of medical services available
    to data subjects (patients), whereas these other jurisdictions could be subject
    to an entirely different body of laws for data protection, consumer protection,
    and legal liability. Thus, another goal of eHealth regulation is to establish
    a body of principles and specifications that work in harmony with existing laws
    across several jurisdictions, with minimum conflict.


    The healthcare industry is one that is in an almost constant state of metamorphosis.
    Reflected by regular advancements in healthcare and medical procedures, which
    result in novel practices and applications that require regulatory oversight,
    the always-expanding scope of operations and service delivery that necessitate
    periodic reviews of existing regulation, frequent emergence of innovations (such
    as the Internet of things) that reveal new use cases and purposes wherein specification
    and standardization are needed, as well as mergers and acquisitions that require
    regulatory scrutiny and possible restructuring of ownership structures.


    Together, all of these realities directly and indirectly impact the goals of regulation
    with respect to eHealth, sometimes creating new challenges or complicating existing
    ones. Regardless, the regulation of eHealth remains indispensable to preserving
    the utilities that eHealth offers for modern healthcare delivery in such a dynamic
    and complicated landscape.


    ## Notable International Legislations


    Certain International Legislations have been useful in helping to elucidate the
    context of some of the challenges that regulations face in trying to meet the
    goals of clarifying the nature, establishing the extent, and safeguarding the
    integrity of interactions that involve eHealth systems and applications for global
    healthcare service delivery. These international legislations attempt to define
    and specify best-practice standards, ethics, responsibilities, procedures, and
    operations across various aspects of healthcare service delivery wherever information
    and communication technologies are involved. These legislations are often situated
    and explored within a global framework of wider-acceptable considerations for
    safe, secure, ethical, and humanistic applications of eHealth.


    Specifically, the WHO’s Report on legal frameworks for eHealth


    The UDHR, with specific reference to Article 12, specifies privacy as a universal
    human right. Declaring that “No one shall be subjected to arbitrary interference
    with his privacy, family, home or correspondence, nor to attacks upon his honour
    and reputation. Everyone has the right to the protection of the law against such
    interference or attacks”. In this way, the responsibility and boundaries of jurisdictional
    regulations are established. This obligates such jurisdictional regulations to
    provide safeguards against the arbitrary invasion of personal privacy, while also
    taking care to ensure that the regulation itself does not contravene this very
    specification. This specification also emerges in Article 17 of another International
    Legislation known as the International Covenant on Civil and Political Rights
    (ICCPR)


    Indeed, Article 17 of the ICCPR gives more context to the provision of Article
    12 of the UDHR through a General Comment (No. 16), which asserts that


    > The gathering and holding of personal information on computers, data banks and
    other devices, whether by public authorities or private individuals or bodies,
    must be regulated by law. Effective measures have to be taken by States to ensure
    that information concerning a person’s private life does not reach the hands of
    persons who are not authorized by law to receive, process and use it, and is never
    used for purposes incompatible with the Covenant. In order to have the most effective
    protection of his private life, every individual should have the right to ascertain
    in an intelligible form, whether, and if so, what personal data is stored in automatic
    data files, and for what purposes. Every individual should also be able to, ascertain
    which public authorities or private individuals or bodies control or may control
    their files. If such files contain incorrect personal data or have been collected
    or processed contrary to the provisions of the law, every individual should have
    the right to request rectification or elimination.


    Furthermore, Article 8 of the ECHR


    These exceptions include when (1) data processing is in the vital interest of
    a patient, or of another individual who is physically or legally incapable of
    giving consent at the time, (2) the data processing is required for the purposes
    of preventive medicine, medical diagnosis, the provision of care or treatment,
    or the management of healthcare services and the personal data in question are
    processed by a health professional, and (3) there is substantial public interest
    or concern for public safety in the processing of personal medical/healthcare
    information, whereas, at least one of these criteria for exceptions must be met.


    These notable international legislations have greatly helped to refine and filter
    the scope and context of regulatory responsibilities pertaining to contemporary
    issues of informed consent, privacy, identity and autonomy, and other digital
    rights that pertain to personal data. Indeed, they have inspired regulatory and
    legislative efforts that have emerged across various other regions, such as the
    African Union Convention on Cyber Security and Personal Data Protection: The Malabo
    Convention


    ## Roles & Responsibilities of Management and Administration


    As previously highlighted, the roles and responsibilities of management and administration
    in healthcare organizations when it comes to eHealth, are often geared towards
    unifying the multi-stakeholder interests of governance, the imperatives of ethics,
    and the requirements of regulation, in a way that aligns eHealth applications
    with business goals, while preserving its utility for healthcare service delivery.
    Now, how this is to be achieved has often proven to be the difficult part.


    At the point of commencement in this regard, it is important that healthcare organizations
    take an opportunity to evaluate the potentials and prospects that eHealth presents
    for business continuity, and then decide on what healthcare information and communication
    technologies, tools, and resources present the most important benefits to the
    success of their business model. For instance, in managing records for a large
    client base, it becomes infeasible and ineffective in the long run to perpetuate
    a manual (paper-based) records management model. In the same vein, as outpatient
    services begin to expand, it might become necessary to consider provisioning healthcare
    services in a way that is accessible to patients, even outside the healthcare
    facility.


    These are possible considerations for enhancing effectiveness in business continuity,
    which might inform the decision of healthcare organizations to adopt healthcare
    information and communication technologies. But then, it is also critical at this
    point to ensure that the nitty-gritty pertaining to data, infrastructure, systems
    & devices, people & users, regulatory compliance, as well as other operational
    best practices for ethics, security, risk & incident management, and technical
    support that apply in such regards, are circumspectly considered.'
