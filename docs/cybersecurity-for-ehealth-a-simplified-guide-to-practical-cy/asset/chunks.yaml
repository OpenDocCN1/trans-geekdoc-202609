- raw: "At the national levels, Governance is said to involve directing and coordinating\
    \ the development and applications of eHealth, building consensus and multi-stakeholder\
    \ equilibrium around policy, and protecting individuals and groups by providing\
    \ an assurance of oversight and accountability in the various applications of\
    \ eHealth. Whereas, at the international/global levels, it pertains to discourses\
    \ around the rights, responsibilities, rules, and risks that apply to various\
    \ stakeholders in the use of global technology utilities (such as the Internet)\
    \ for purposes that relate to healthcare, the handling and management of sensitive\
    \ healthcare data, and the application of other information technologies for healthcare.\n\
    \nIn its most excellent form, approaches to Governance should be “participatory,\
    \ transparent, accountable, effective and equitable”, through the application\
    \ of processes that promote the rule of law. But then, the governance of eHealth\
    \ continues to face several challenges on the path to making this a reality: one\
    \ being the well-known difficulty of achieving consensus and equilibrium on various\
    \ issues amongst stakeholders with interests that are often both competing and\
    \ conflicting. Also, and often as a fallout of the preceding point, there is the\
    \ challenge of trying to sustain momentum for progress and action when change\
    \ is supposed to be multi-stakeholder driven.\n\nThe implications of governance\
    \ at the organizational level for healthcare institutions remain equally non-trivial.\
    \ However, despite the proven cost-effectiveness of using information technologies\
    \ in healthcare, and the accompanying benefits of efficiency, scalability, and\
    \ portability, several healthcare institutions continue to struggle to consistently\
    \ reap these benefits because internal governance structures, functions, and operations\
    \ are often fractured at the centre. Indeed, it is fairly easy to boil down cybersecurity\
    \ incidents in healthcare information technologies to lapses and insufficiencies\
    \ in structures and frameworks for governance at the organizational level.\n\n\
    For example, incidents that are traced to user unawareness or inadvertencies can\
    \ be directly or indirectly linked to lapses in organizational structures for\
    \ building knowledge and capacity, managing risks, or responding to threat situations.\
    \ A similar attribution can be applied when vulnerabilities in systems and infrastructures\
    \ result in cybersecurity incidents.\n\nThe nature of discussions around **Ethics**\
    \ in the context of eHealth, does not particularly differ from that which pertains\
    \ to the operations and services of healthcare delivery in general. It refers\
    \ to the imperative of ensuring that the applications of eHealth do not trample\
    \ the wider-acceptable standards, norms, and values that characterize appropriate\
    \ behaviour, actions, choices, and decisions. Discussions around Ethics in eHealth\
    \ could exist across two broad panels/schools of thought: prescriptive (that is,\
    \ as defined by standardized bodies of laws, norms, and social customs) and normative\
    \ (that is, based upon certain fundamental rights, obligations, and responsibilities\
    \ that are inalienable and exist at the very essence of humanity).\n\nIn its most\
    \ excellent form, ethical considerations in the applications of healthcare information\
    \ and communications technologies continue to explore an effective blend of the\
    \ prescriptive and normative schools of thought in a progressive and consistent\
    \ manner. However, a frequent challenge often emerges when prescriptive considerations\
    \ begin to exclude and obscure the normative realities of Ethics. This is a concern\
    \ that has continued to malign the proven utilities of eHealth in many jurisdictions.\n\
    \nHowever, there exist certain well-established and widely accepted principles\
    \ that have been discovered to be indispensable to the ethical applications of\
    \ eHealth. They include:\n\n1.  Autonomy: the ability to think, will, choose,\
    \ decide, and act independently, without any form of external inducement or coercion.\n\
    \n    Thus, eHealth should not interfere in any way with the capacity of subjects\
    \ (patients or other human agents) to decide/reverse after deciding, to choose/refuse\
    \ to choose, or to act/refrain from taking action.\n\n2.  Privacy & Confidentiality:\
    \ the right to seclusion that takes into consideration the choice to be identified,\
    \ selectively identified, or unidentified (that is, privacy), and the responsibility\
    \ of ensuring the preservation of this right (that is, confidentiality) in all\
    \ patient-related healthcare interactions.\n\n    Thus, in the applications of\
    \ eHealth, the healthcare subjects must be able to evaluate and authorize what\
    \ is/would be known about them, at every point in time.\n\n3.  Human Dignity:\
    \ the realization that certain unique values and attributes that are intrinsic\
    \ and inalienable to the essence of the human person, bestow a worthiness of respect\
    \ on such a person that is not dependent on any other factor(s).\n\n    Thus,\
    \ in delivering healthcare services through eHealth, it is non-negotiable that\
    \ respect for the person who is the patient is upheld at every point.\n\n4.  Informed\
    \ Consent: the obligation of ensuring that subjects are enabled to make decisions\
    \ on a voluntary and knowledgeable basis, empowered by an in-depth understanding\
    \ of what might be the (several) outcomes and implications of such decisions.\n\
    \n    At all points of the interface where information and communication technologies\
    \ would be applied for healthcare service delivery, patients should be made aware\
    \ of what would be the nature and implications of their involvements with eHealth,\
    \ what risks are involved, as well as what measures have been taken to mitigate\
    \ such risks, in order that their decision to get involved with eHealth is well-informed.\n\
    \n5.  Justice and Fairness: the moral obligation of ensuring that actions, processes,\
    \ and outcomes are honourable, and adjudication is based on equitable considerations,\
    \ even when interests and claims are competing/conflicting.\n\n    This requires\
    \ that when disputes and conflicts arise in healthcare applications of information\
    \ technologies, equity should be preserved through unbiased adjudication.\n\n\
    6.  Beneficence & Non-maleficence: the mindfulness of being cautious that the\
    \ welfare of the subject is preserved at all times and at all points where eHealth\
    \ is applied for healthcare service delivery, by avoiding to do harm either by\
    \ way of intention, negligence, or inadvertence.\n\n    This necessitates that\
    \ eHealth is deployed such that it does not in any way harm the patients either\
    \ directly or indirectly.\n\nHowever, Ethics, as it pertains to eHealth is known\
    \ to face a number of challenges. One such challenge relates to ethical definitions\
    \ that are sometimes essentially too ambiguous to apply across several different\
    \ contexts and use cases without conflict and confusions around notion and intent.\
    \ Then there is also the challenge of circumstances that are superimposed by existing\
    \ realities within the scope of eHealth applications in particular jurisdictions\
    \ – such as the digital divide and technology capacity maturity, which could entrench\
    \ and exacerbate perceptions of inequalities in medical and healthcare services\
    \ that are provisioned through eHealth. These are to mention a few.\n\n**Regulation**\
    \ in the context of eHealth deployments is the application of the force of legislation\
    \ in establishing and demanding compliance with certain critical requirements\
    \ that are necessary for safeguarding the development and utility of various applications\
    \ of eHealth in the delivery of healthcare services within and across particular\
    \ jurisdictions."
  fmt: '

    At the national levels, Governance is said to involve directing and coordinating
    the development and applications of eHealth, building consensus and multi-stakeholder
    equilibrium around policy, and protecting individuals and groups by providing
    an assurance of oversight and accountability in the various applications of eHealth.
    Whereas, at the international/global levels, it pertains to discourses around
    the rights, responsibilities, rules, and risks that apply to various stakeholders
    in the use of global technology utilities (such as the `Internet`) for purposes
    that relate to healthcare, the handling and management of sensitive healthcare
    data, and the application of other information technologies for healthcare.


    In its most excellent form, approaches to Governance should be “participatory,
    transparent, accountable, effective and equitable”, through the application of
    processes that promote the rule of law. But then, the governance of eHealth continues
    to face several challenges on the path to making this a reality: one being the
    well-known difficulty of achieving consensus and equilibrium on various issues
    amongst stakeholders with interests that are often competing and conflicting.
    Also, and often as a fallout of the preceding point, there is the challenge of
    trying to sustain momentum for progress and action when change is supposed to
    be multi-stakeholder driven.


    ### Organizational Level


    The implications of governance at the organizational level for healthcare institutions
    remain equally non-trivial. However, despite the proven cost-effectiveness of
    using information technologies in healthcare, and the accompanying benefits of
    efficiency, scalability, and portability, several healthcare institutions continue
    to struggle to consistently reap these benefits because internal governance structures,
    functions, and operations are often fractured at the centre. Indeed, it is fairly
    easy to boil down cybersecurity incidents in healthcare information technologies
    to lapses and insufficiencies in structures and frameworks for governance at the
    organizational level.


    For example, incidents that are traced to user unawareness or inadvertencies can
    be directly or indirectly linked to lapses in organizational structures for building
    knowledge and capacity, managing risks, or responding to threat situations. A
    similar attribution can be applied when vulnerabilities in systems and infrastructures
    result in cybersecurity incidents.


    ### Ethics in eHealth


    The nature of discussions around `Ethics` in the context of eHealth, does not
    particularly differ from that which pertains to the operations and services of
    healthcare delivery in general. It refers to the imperative of ensuring that the
    applications of eHealth do not trample the wider-acceptable standards, norms,
    and values that characterize appropriate behaviour, actions, choices, and decisions.
    Discussions around `Ethics` in eHealth could exist across two broad panels/schools
    of thought: prescriptive (that is, as defined by standardized bodies of laws,
    norms, and social customs) and normative (that is, based upon certain fundamental
    rights, obligations, and responsibilities that are inalienable and exist at the
    very essence of humanity).


    In its most excellent form, ethical considerations in the applications of healthcare
    information and communications technologies continue to explore an effective blend
    of prescriptive and normative considerations. However, a frequent challenge emerges
    when normative considerations begin to obscure `Ethics` in eHealth. There exist
    certain well-established principles that are indispensable to eHealth. They include:


    1. **Autonomy**: the ability to think, will, choose, and act independently without
    any form of external inducement. Thus, eHealth should not interfere in any way
    with the capacity of healthcare subjects.

    2. **Privacy & Confidentiality**: the right to seclusion that takes into consideration
    `privacy`, and the responsibility of ensuring the preservation of `confidentiality`.
    Thus, in the applications of eHealth, healthcare subjects must be able to evaluate
    what would be known about them.

    3. **Human Dignity**: the realization that certain unique values and attributes
    bestow a worthiness of respect on person that is not dependent on any other factor.
    Thus, in delivering healthcare services through eHealth, respect for the person
    must be upheld.

    4. **Informed Consent**: the obligation of ensuring that subjects are enabled
    to make decisions on a voluntary and knowledgeable basis, empowered by an in-depth
    understanding of what might be the outcomes and implications of such decisions.
    Thus, at all points where eHealth is applied, patients should be made aware of
    the nature and implications of their involvements and risks involved.

    5. **Justice and Fairness**: the moral obligation of ensuring that actions, processes,
    and outcomes are honourable, and adjudication is based on equitable considerations
    even when interests and claims are competing. Thus, when disputes arise in healthcare
    applications of information technologies, equity should be preserved.

    6. **Beneficence & Non-maleficence**: the mindfulness of being cautious that the
    welfare of the subject is preserved at all times, by avoiding to do harm by way
    of intention, negligence, or inadvertence. This necessitates that eHealth is deployed
    such that it does not harm the patients either directly or indirectly.


    However, `Ethics` as it pertains to eHealth is known to face a number of challenges.
    One such challenge relates to ethical definitions that are sometimes essentially
    too ambiguous to apply across several different contexts. Then there is also the
    challenge of circumstances that are superimposed by existing realities within
    the scope of eHealth applications – such as the digital divide and technology
    capacity maturity.


    ### Regulation


    `Regulation` in the context of eHealth deployments is the application of the force
    of legislation in establishing and demanding compliance with certain critical
    requirements that are necessary for safeguarding the development and utility of
    various applications of eHealth in the delivery of healthcare services within
    and across particular jurisdictions.

