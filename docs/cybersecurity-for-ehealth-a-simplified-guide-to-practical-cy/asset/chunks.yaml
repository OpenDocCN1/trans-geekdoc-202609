    同样，间谍软件会秘密地将有关计算机运行和活动的数据及信息传输给外部恶意攻击者；而根基程序（rootkits）则允许对系统、设备和用户应用程序进行后台/后门访问，并掩盖其存在和操作以规避检测。同样，逻辑炸弹（logic
    bombs）是构建在应用程序中的恶意软件，在满足特定逻辑条件时激活某些恶意行为。而，自动运行脚本（autorun scripts）是在与系统及设备交互时就会自动激活的恶意代码，使其能够绕过常规的安全检查。


    恶意软件对电子健康服务和医疗运营造成巨性破坏和极其严重混乱的能力已是众所周知。它们能够在患者的扫描结果和影像报告中添加虚假信息和标记，以误导医疗诊断并损害医疗服务的完整性。此外，它们还可以自动倾储、或吸取大量敏感的个人健康相关信息；篡改医疗监测设备的读数；并更改通过电子输液泵和阀门交付的药物剂量。恶意软件还能秘密下载其他恶意组件（通过被称为“路过攻击”的策略）；并让恶意外部攻击者在医疗机构的数字运营中获得持久的立足点。事实上，恶意软件对全球医疗行业的威胁性影响是一个确实令人畏惧的危险。


    ## 相关基础设施


    企业级医疗基础设施的功能通常是提供一个平台，以有效利用参与的系统和设备来支持医疗流程和运营。因此，针对医疗基础设施的威胁和攻击目标是由于支持和授权的`Systems`和`Devices`通过其传输的`Data`以及`Information`/`Signals`，旨在瘫痪依赖于它们的组织`Processes`和`Operations`。


    这些威胁和攻击通常采用旨在用于侦察和枚举、截获数字/电子通信以及中断服务的方法。这些方法包括车载攻击（wardriving）、拒绝服务（DoS）、高级持续性威胁（APT）和中间人攻击（MITM）。在许多情况下，当医疗基础设施受到恶意攻击者的威胁时，跨这些基础设施传输的数据和信息已经处于风险。这还包括处理、存储和传输这些数据和信息的系统和设备，以及依赖于这些活动的组织`Processes/Operations`。事实上，在此时，这些实体中的一个或多个可能已经存在被攻破的可能性。


    车载攻击仅仅是指在移动车辆中在医疗机构周围搜索 Wi-Fi 网络连接的行为，通常带有恶意意。有时，这种车辆可能是摩托车或自行车，在这种情况下分别被称为车载摩托车攻击（warbiking）和车载自行车攻击（warcycling）。通过这种方法，恶意攻击者能够发现并接入集成了私有内部网络的开放访问连接。从而提供了一种投放恶意软件、在组织网络上伪造身份或执行“破窗抢劫”（smash
    & grab）行动的手段，以窃取可能用于各种恶意目的的敏感医疗数据和信息。


    此外，可能应用中间人攻击（MITM）技术来有效地搜索、截获，并在某些情况下篡改或重路由数字电子通信。已经发现了大量的工具和技术用于 MITM 操作，包括位翻转、网络嗅探器和分析器，以及网络协议和服务中的隐藏隧道。此外，信号阻断器/干扰发生器也被用于阻塞安全和警报系统以及基础设施从传感器/探测器传输到执行器/影响器的信号和信息。


    DoS 攻击是一种威胁攻击方法，旨在暂时或不确定地拒绝对服务和公用（医疗系统、服务器、网站等）的合法使用和访问。实现这一目标的方法之一是让这些服务和公用陷入无用且低效的活动中，例如处理和响应毫无意义的数据包和请求。这拒绝了合法用户对此类服务和公用的访问。然而，DoS
    也可能是其他类型恶意软件（如勒索软件和蠕虫）的行为和活动的结果，也可能是无意的人为操作，如意外禁用连接或绊倒网络硬件。其核心思想是服务和公用无法为了合法使用的目的而无法可用。


    通常，攻击者会积极寻找扩大规模和放大 DoS 操作影响的方法，并经常考虑几种方案。其中一种方案是劫持并破坏同一基础设施内的其他机器，通过感染一种被称为“僵尸”（bot）的恶意软件将其置于中央控制框架下，并在被称为“僵尸网络”（botnets）的网络中协调此类恶意运营。另一种考虑是窃取目标基础设施内机器的数字身份，然后将其分配给攻击者控制，以便协调此类恶意活动。当
    DoS 攻击以这种方式利用分布式支持时，技术上讲发生了分布式拒绝服务（DDoS）。


    高级持续性威胁（APT）在获得医疗基础设施的未经授权访问后，应用一系列复杂的隐蔽技术来掩盖踪迹并规避检测。在 APT 中反复发现的鲁棒、高能力协调和资源支持了如下逻辑推断：应用
    APT 策略的威胁主体通常是国家实体或受非国家实体资助的恶意组织。他们可能将医疗机构作为针对利益实体的间谍手段。


    APT 中看到的协调水平反映了它们能够在多个阶段鲁棒地整合大量策略、工具和技术，从而系统地构建攻击目标或结果。


    ## 相关流程/运营


    在医疗背景下，针对流程/运营的威胁旨在破坏和干扰安全`Resilience`，并利用组织流程和运营的安全疏忽。追求这一目标的常见方法是颠覆/绕过安全协议和规程，通常通过轻率的内部人员或恶意的外部人员行为来实现。

