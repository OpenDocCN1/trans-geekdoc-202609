    ## 6. Were there any previous attempts to escalate/report such events and occurrences?


    In case previous attempts have been made at escalating or reporting such events
    and abnormalities, either formally (through existing organizational channels)
    or informally, be sure to mention such as well, also ensuring to state what were
    the outcomes or directives that emanated from such attempts, if any.


    ## 7. Do you have any current suspicions and opinions about the incident under
    reporting? What might have informed these suspicions/opinions?


    It is okay to have personal suspicions and opinions regarding the incident under
    reporting. After all, you were arguably a point of initial contact for that incident.
    Hence, state these suspicions clearly and unequivocally; and do not forget to
    mention what might have informed these suspicions.


    It is probably a good idea to have ready answers to these questions in oral reports
    of cybersecurity incidents. Even with written incident reports, it is equally
    important to ensure to provide answers to these illustrative questions within
    such written reports. These illustrative questions do not claim to be exhaustive;
    however, they do provide a useful guide for effective progress in this regard.


    It, therefore, becomes evident that personal cybersecurity in the context of healthcare
    and eHealth is only effective to the extent that organizational mechanisms are
    in place to:


    1. ensure up-to-date training and awareness for users;

    2. provide robust security policies and protocols that fortify the security status
    of the organization;

    3. guarantee real-time information verification, as well as technical support
    that is prompt and efficient;

    4. manage and minimize risks and liabilities effectively and circumspectly; and,

    5. establish resilient processes and procedures for coordinated incident reporting,
    escalation, investigation, response/handling, and recovery.


    This is further instructive of the fact that the journey to effective personal
    cybersecurity begins at the higher levels of administration and management of
    the healthcare organization or institution. Because it is only within this framework
    that the effects of mindfulness for cybersecurity would be able to ripple across
    and downwards from the higher levels, in order to strengthen the capabilities
    for personal cybersecurity by sharpening the `Intuition for Security`.


    In light of the current realities of eHealth cybersecurity, it has long ceased
    to be a question of “if” a healthcare organization and her assets are going to
    come under threat at any point, but rather a question of “when”, and “how” a healthcare
    organization and her assets would come under threat. Thus, it boils down to the
    measures and steps put in place to enhance preparedness and responsiveness in
    the face of imminent or occurring threats and attacks to an organization’s cybersecurity
    status. How well they would perform under threat situations is a direct function
    of how security-ready they are at the time the threat manifests.


    ## Notes


    1. [Verizon (2019). *Data Breach Investigations Report (DBIR)*](#ch3.xhtml#R_en3_1).
    [https://enterprise.verizon.com/en-gb/resources/reports/dbir/2019/healthcare/](https://enterprise.verizon.com)

    2. [Life Healthcare Group (2020, June 09). *The Life Healthcare Group regrets
    to announce that its southern African operation has been the victim of a targeted
    criminal attack on its IT systems*](#ch3.xhtml#R_en3_2). [https://www.lifehealthcare.co.za/news-and-info-hub/latest-news/life-healthcare-announces-cyber-incident/](https://www.lifehealthcare.co.za)

    3. [McGee, M. (2014, May 07). *4.8 Million Settlement for HIPAA Violations: Healthcare
    Today*](#ch3.xhtml#R_en3_3). [https://www.healthcaretoday.com/4.8-million-settlement-for-hipaa-violations/](https://www.healthcaretoday.com)


    # 4 Data/Information Security for eHealth Deployments


    ## Introduction


    Whereas, healthcare regulations and acts in many jurisdictions place upon healthcare
    organizations that collect, process, transmit, and store electronic medical records,
    the responsibility of ensuring that these are kept safe, secure, and accessible.
    In 2013, Advocate Health Care, an Illinois-based facility, was constrained to
    pay civil settlement claims to the tune of $5.55 million, to HHS’ Office for Civil.


    In one of the incidents leading up to this breach, Advocate Medical Group, a subsidiary
    of the healthcare organization, had suffered a burglary at one of her offices
    that resulted in the stealing of four laptop computers. In another incident, an
    external access to the organization’s network compromised the healthcare information
    of 2000 patients. In yet another incident, a work laptop computer was stolen from
    the vehicle of an employee. All the incidents took place between August and November
    of 2013.


    Indeed, this responsibility translates to mean that healthcare organizations have
    a duty to manage data in the most effective and efficient manner that ensures
    that data elements are (a) trustworthy and reliable for informing medical decisions,
    (b) kept safeguarded against unauthorized encounters and interferences, in order
    that privacy is preserved, and (c) guaranteed to be promptly available at all
    times, at all such points, and for all such uses, functions, and operations that
    are authorized, ethical, and lawful.


    In [Chapter One](#ch1.xhtml), the Invariants of Healthcare Data have been presented
    and discussed. But then, in the practice of modern healthcare, how do these Invariants
    reflect the premium that is placed on them by various healthcare stakeholders
    – regulators, patients/clients, healthcare service providers, healthcare professionals,
    and third-party vendors/affiliates. What approaches can be applied to help minimize
    risk and liability from a non-technical standpoint, so that healthcare organizations
    and professionals are better able to navigate the non-trivialities of regulation?
    This is the grain of discussions in this chapter.


    Data and Information Security remains critical for eHealth deployments, particularly
    because the sensitive nature of data is electronic patients’ health records is
    one which is hedged by a complex strain of considerations pertaining to Human
    & Digital Rights, Democracy & the Rule of Law, Personal Security, Public Health
    & Safety, and National Sovereignty.

