    \ that help to distinguish records pertaining to particular individuals, without\
    \ necessarily identifying such individuals – a technique known as `Anonymization/Pseudonymization`.\n\
    \n- Collecting very limited amounts of data and information that can be used to\
    \ uniquely identify patients, which is intuitive because the lesser the amount\
    \ of personal data and information that is required of patients who patronize\
    \ healthcare services, the easier it is to keep such personal data and information\
    \ undisclosed, thereby reducing the surface areas of potential internal and external\
    \ threats – a technique known as `Minimization`.\n\n- Ensuring that privacy considerations\
    \ are embedded into the very foundational stages of conceptualizing, designing,\
    \ and engineering software and systems for use in healthcare – an approach known\
    \ as `Privacy by Design`.\n\n`Privacy by Design` can be pursued by making certain\
    \ that:\n- the most stringent privacy settings are activated by default in new\
    \ systems and software (otherwise called `Privacy by Default`),\n- proactive privacy\
    \ measures are incorporated, so that risks to privacy can be anticipated and forestalled\
    \ even before they materialize as breaches/incidents,\n- end-to-end security techniques\
    \ are applied to enforce privacy throughout the life cycle of data processes and\
    \ operations, and\n- sensitive data and information are computed and processed\
    \ securely at all times, at all points, and for all purposes.\n\n## Ensuring Confidentiality\n\
    \nBut then, Privacy and Confidentiality share a rather interesting relationship.\
    \ While Privacy is the end, Confidentiality is the means. In other words, it is\
    \ the imperative of safeguarding Privacy that imposes upon healthcare organizations\
    \ the responsibility of ensuring Confidentiality.\n"
  trans: "\n\n不可否认，信息技术（或电子健康 eHealth）在医疗保健领域的本质主要是为了确保人们能够随处获得高质量的医疗服务，且不受地理位置、移动性或类似限制所造成的任何形式的限制或无。。在这种背景下提供的效用依赖于医疗/保健数据和信息能够以同样的方式可用，特别是一种可以被认为准确且可靠的方式，以供医疗/保健诊断和决策提供依据。\n\
    \n当 `Integrity` 损坏时，这一切都会化为乌有。那么，如何在医疗保健信息技术（电子健康 eHealth）中确保 `Integrity` 呢？\n\
    \n1.  这方面被广泛考虑的一种学观点是允许患者（频繁/定期）访问其医疗/健康数据。设备传感器具有较大误差范围的现实，以及在数据处理/操作链中不同点可能发生拦截和篡改的可能性，这些事实在近期事件中已变得更加明显。通过允许患者在处理/操作链的各个点访问其数据，增加了一层基于利益的验证，随着链的扩展，这种验证是可以信赖的。逻辑非常简单：没有人比患者本人对医疗/保健记录的准确性更关注了。\n\
    \n    然而，这并没有任何方式削减医疗机构在安全收集这些数据和信息，以及以可靠安全的方式进行处理和存储方面承担的责任。因此，在任何方面，这种验证层都不应被解释为责任的转移或下放。\n\
    \n    同样重要的是，黑客也可能是患者（或伪装成患者）。因此，在这种背景下必须采取安全措施来验证通过电子健康部署请求访问医疗数据的个人（患者）的身份，并确保这些个人（患者）只能访问其数据，仅限其数据，而不包含任何其他数据。\n\
    \n    生物识别认证经常被探索为一种为了此目的验证个人身份的万无一失的方法。防火墙限制、蜜罐和入侵检测/防御系统等额外措施也应用于多种情境，以限制在这种情况下可以访问和查看的内容，同时监控暗示恶意意图和操作的异常行为。\n\
    \n2. 在数据处理和操作链的各个点维护日志文件，以便在怀疑或确认错误时进行跟踪和检查。审计日志对于确保电子医疗/保健数据和信息管理完整性这一目标是不可或缺的。这是因为在许多情况下，当调查违规行为时，审计日志提供了一种建立或反驳医疗机构方面不负责任的方法。此外，它还有助于医疗机构在常规检查期间标记其操作和流程链链中可能损害其风险状况的红点。\n\
    \n    所有这一切之所以可能，是因为审计日志有助于在完整性问题出现时追溯源头点。它提供了一种识别此类问题可能成因的方法，并确定哪些技术、结构或操作措施将有助于在组织范围内避免此类事件的发生。\n\
    \n## 保护隐私\n\n尽管“隐私（privacy）”一词继续出现在有关医疗保健网络安全事件的讨论中，但该术语本身并没有通用的定义，除非是在特定管辖区具有约束力的法规的背景下所定义。这是因为隐私在本质上具有更多个人化的维度，带有重叠的考量，而法规往往难以捕捉这些点。\n\
    \n    隐私在本质上具有更多个人化的维度，带有重叠的考量，法规往往难以捕捉。这些包括身体完整性、个人尊严、机密与隔离（即非身份化）以及代理权/个人自主等。\n\
    \n    然而，每当发生违规行为时，隐私仍然是首要考虑因素。本质上，当网络安全事件发生时，利益相关者寻求确定他们在履行这一责任方面的效率如何。\n\n \
    \   隐私政策有助于将医疗机构的业务利益和目标与保护隐私的责任保持一致。尽管如此，医疗机构通常被法规要求建立一个稳健的风险管理计划，以帮助他们主动评估、检测、缓解并有效应对风险。此外，某些管辖区的法规（如\
    \ `GDPR`）规定了旨在保护隐私的最佳实践。这些包括：\n\n- 从从患者那里收集的医疗/医疗数据中移除个人身份识别信息，有时将这些信息映射到伪标识或特殊标记，这有助于区分与特定个人相关的记录，但并不一定识别出这些个人——这种技术被称为\
    \ `Anonymization/Pseudonymization`（匿名化/去标识化）。\n\n- 收集极少量的用于唯一识别患者的数据和信息，这是直观易懂的，因为对寻求医疗服务的患者所要求的个人数据和信息越少，越容易保持这些个人数据和信息不公开，从而减少潜在内部和外部威胁的攻击面——这种技术被称为\
    \ `Minimization`（最小化）。\n\n- 确保将隐私考量嵌入到用于医疗保健软件和系统的概念化、设计和工程化的最基础阶段——这种方法被称为 `Privacy\
    \ by Design`（隐私即设计）。\n\n    `Privacy by Design` 可以通过确保以下点来实现：\n- 在新系统和软件中默认激活最严格的隐私设置（否则称为\
    \ `Privacy by Default`，默认隐私），\n- 纳入主动的隐私措施，以便在隐私风险演变成违规/事件之前就能进行预判和阻止，\n- 应用端到端安全技术，在数据处理和操作的整个生命周期执行隐私，\n\
    - 始终在所有点、出于所有目的安全地计算和处理敏感数据和信息。\n\n## 确保机密性\n\n但隐私（Privacy）和机密性（Confidentiality）之间存在着一种有趣的关系。隐私是目的，而机密性是手段。换句话之，保护隐私的紧迫要求使医疗机构承担确保机密性的责任。\n\
    \n"
