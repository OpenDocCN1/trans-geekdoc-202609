  trans: '


    确好九天后，来自加拿大数据隐私监管机构的专家小组访问了 Adeola 工作医疗机构，调查涉及患者电子健康记录的“可疑活动”。最初，该事件的发现源于八天前机构网络上检测到的异常行为——那是在
    Adeola 尝试在 `mHealth` 应用程序上登录其医生仪表板遇到困难的第二天。


    该事件导致 Adeola 的 11,000 名患者的医疗数据泄露；其中 4,000 名患者的电子健康记录在 `Psyche-I-Track` 提供的三项不同医疗服务中被严重篡改。调查显示，Adeola
    当前的访问凭据激活了攻破点，使恶意外部入侵者获得了访问该机构基础设施的权限。


    这一假设性事件从一个微小的视角揭示了现代电子健康网络安全领域一直存在的斗争：即技术自我保护（有效且高效）的能力，与人类因素在医疗信息和通信技术安全防护运营方面充分配合的能力之间，存在持续的脱节。这说明了一个事实：安全性及其相关的协议和规程，很难与易用性和用户便利性良好融合。最终，这使得全球医疗行业利益相关者心中产生了一种“下一个是谁，接下来会发生什么？”的挥之去的恐惧——这种不确定性的阴云笼罩着该行业的全部潜力。那么，路在何方？我们如何找到平衡点？


    ## 电子健康部署中的个人网络安全


    若干独立报告（包括美国电信巨头 Verizon 发布的 2019 年《数据泄露调查报告》[`DBIR`]）


    已确定，个人网络安全方面的一系列因素和疏忽助长了医疗行业网络安全事件频发的现状，包括：


    1. 被盗窃的访问凭据；

    2. 弱密码或未更改的默认密码；

    3. 篡改防火墙和反恶意软件配置；

    4. 共享用户凭据（用户名和密码）；

    5. 修改设备和系统的自动更新设置；

    6. 上传错误或感染的文件；

    7. 访问未经授权、不安全或危险的网站；

    8. 出各种个人幼稚的原因绕过防火墙限制；

    9. 通过不安全/未验证的通道传输敏感信息；

    10. 安装不受信任的第三方应用程序；

    11. 滥用访问权限；

    12. 个人/公司设备和系统的访问放置不当或共享；

    13. 将敏感信息误递给意外接收者；

    14. 滥用访问权限；

    15. 未应用/安装更新和补丁；

    16. 点击垃圾邮件中的链接；

    17. 未能及时识别并报告/升级威胁状况；

    18. 不恰当处置包含敏感信息的文件和媒体；

    19. 存储介质存放不当；以及

    20. 对个人网络安全的最佳实践缺乏常识（仅列举部分）。


    这些都是阴险的状况，在医疗信息和通信技术背景下，事实证明它们个人网络安全的祸根，而这些技术绝大多数都是以用户/人员为操作核心的。


    考虑到人们/用户在高价值的电子健康网络安全链中往往是最脆弱、最易受攻击且最疏忽的群体，那么可能更容易理解为什么个人网络安全对于电子健康来说是不可逾越的边界。


    那么，如何以一种稳健的方式来概念化和实践个人网络安全呢？


    答案在于对我所谓的`安全直觉`（`Intuition for Security`）的理解。


    ## 安全直觉


    三个特征有助于描述和定义`安全直觉`。它们分别是：`直觉`（`Instinct`）、`知识`（`Knowledge`）和`行为`（`Behaviour`）。


    `直觉`是一种理性倾向特征，能够催化（有时是下意识地）反应。`知识`涉及认知能力，可能通过反复接触、培训或经验获得。`行为`是反映选择的行动特征。


    ![图 3.1 安全直觉](img/fig8.jpg)


    这三个特征有助于概念化网络安全的基础，特别是因为在网络安全实践中，`知识`锐化了`直觉`，两者共同引导`行为`。


    '
