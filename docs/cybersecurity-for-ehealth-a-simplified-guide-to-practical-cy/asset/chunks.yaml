    Inspiring a robust approach to vigilance that is inclusive, and incorporates a
    zero-trust (that is, trust none and verify all) model is, perhaps, a good way
    to start. Ultimately, all stakeholders of the healthcare organization must become
    partners and collaborators in the responsibility of corporate cybersecurity, supporting
    and complementing each other through the sometimes inconvenient best practices
    and approaches to securing healthcare information and communication technologies.
    Reward and compliment good security behaviours and practices, by tracking even
    those that are not physically manifested, and also ensure to promptly correct
    and remedy bad security behaviours and practices, in the same way. Establish cybersecurity
    policies (e.g., password and user account policies, firewall and remote communication
    policies, device control policies, etc.) and ensure to enforce them.


    Beyond these, however, and perhaps more importantly, an atmosphere must be created
    wherein users and employees feel comfortable reporting unwitting actions or lapses
    that might have inadvertently compromised the security status of the organization,
    or violated certain security policies, even when such security compromises are
    merely notional, and may not yet have resulted in an actual security incident.
    Within such an atmosphere, healthcare organizations might be able to buy useful
    time to respond or react effectively, which could help them avert greater consequences
    from imminent security incidents. However, without an atmosphere wherein people/users
    feel comfortable revealing such lapses without fear of undue reprimand, such gains
    would be difficult to achieve.


    But then, in order for any of these to be as effective, training, awareness, and
    capacity development must cease to belong in the exclusive domain of the technically
    competent individuals for whose job functions and roles these might be required.
    Rather, let every stakeholder be reasonably aware of what the cybersecurity apparatus
    of the organization looks like, what safeguards/restrictions are in place, and
    where; what measures for monitoring and accountability have been established;
    what are the levels of tolerance for security risks; what information technology
    assets are critical for defending, and the nature of threats to be defended against;
    which entities and domains are high-risk; what to do when under threat or attack.
    It is important that no stakeholder is left behind in any of these regards.


    Now, it might be argued that this basically hands the pie to a malicious insider.
    However, when considered holistically with the body of other physical, logical,
    and operational imperatives, it becomes obvious that a cybersecurity culture is
    but a complementary aspect, which is as crucial as every other in the task of
    safeguarding eHealth systems and infrastructures.


    ### 4. Create an internal framework/mechanism for risk assessment and incident
    management


    This is indispensable for the business of healthcare service delivery because
    risks and incidents to eHealth systems and infrastructures could directly portend
    grave implications for the safety of life. Thus, healthcare organizations need
    to have in place a framework/mechanism for internally assessing cybersecurity
    risks and managing incidents before they wreak undesirable outcomes on the organization.


    This would particularly help healthcare organizations to gauge effectively the
    implications of certain processes, operations, and practices for long-term business
    continuity, while also enhancing and strengthening their capacity to detect, investigate,
    prevent, respond, contain, and recover from cybersecurity incidents with minimal
    damage and losses.


    But, even more importantly, these frameworks/mechanisms should be robust, proactive,
    and responsive enough to spot cybersecurity risks before they actually become
    incidents. Possibility, likelihood, consequential impact/severity, mitigability
    (by degree), and avoidability. These are well-known pillars of effective risk
    assessment –being able to establish the possibility that an incident could occur
    in context, the likelihood that it would occur (given the existing organizational
    processes, operations, and practices), the impact/severity of the resulting consequence,
    how such impacts could be diminished/diffused, and to what degree, and the extent
    to which such a risk can be avoided altogether. These are critical considerations
    for the cybersecurity of eHealth systems and infrastructures.


    Furthermore, a resilient operational contingency plan is indispensable to the
    risk management and incident response apparatus of healthcare organizations that
    deploy eHealth systems and infrastructure. This would be helpful in ensuring that
    healthcare operations are not ground to a halt when risks transform into incidents.


    ## Monitoring and Evaluation for Compliance


    Unfortunately, none of these physical, logical, or operational imperatives would
    be as effective without a coordinated approach to monitoring and evaluation, in
    order to ensure compliance at all levels of the healthcare organizations where
    eHealth systems and infrastructures feature in various capacities. A monitoring
    and evaluation plan has often proven useful in helping to structure and guide
    efforts and activities in this regard.


    This usually begins by defining what are the goals/outcomes of monitoring and
    evaluation efforts, how these goals/outcomes are to be benchmarked, as well as
    what compliance entails (with respect to indicators, and how they might be measured/assessed
    in context). Perhaps, and for example, measuring compliance could be envisaged
    in terms of successful regulatory (re-)assessments, or in terms of a decrease
    in the number of passwords flagged by account management systems and servers as
    not compliant with the organization’s password policy requirements.


    All of these can then be formalized into a plan that outlines what approaches
    and methodologies would be deployed towards the monitoring and evaluation process
    – which could be physical, logical, or operational – and how these would be applied.
    Next would be to decide what evidence(s) would be pursued, based on the benchmarked
    goals of the monitoring and evaluation plan, before employing the necessary resources
    that are needed to ensure a smooth and efficient monitoring and evaluation process.


    Indeed, it is the approach to monitoring and evaluation for compliance that creates
    the ambience of proactiveness and responsiveness, which, in the long run, enhances
    the capacity of the healthcare organization for effective security of eHealth
    systems and infrastructures. However, in order to proceed knowledgeably in this
    regard, an intuitive first step is being able to understand what digital ecosystems
    exist around new and current deployments of eHealth, and how these ecosystems
    function and interface with the digital capacity and assets of the healthcare
    organization.


    ## Understanding Ecosystems of eHealth Deployments


    As was highlighted in [Chapter Two](#ch2.xhtml), when eHealth deployments begin
    to scale and expand, it is often seen that new digital ecosystems of healthcare
    operations and services begin to form around existing frameworks and processes.
    Understanding the implications of these new ecosystems for existing structures,
    particularly with regards to data and information security, is critical to the
    success of healthcare organizations in these ventures.


    What new ecosystem(s) of digital interactions are created (or expanded) by this
    new scope of healthcare service or operation? What elements participate in this
    new ecosystem(s)? What dimensions of cybersecurity need to be taken into consideration,
    in order to effectively safeguard operations within this new healthcare digital
    ecosystem(s)? These are fundamental questions that are critical to understanding
    the ecosystems that form around eHealth systems and infrastructures.

    '
  trans: '


    激发一种包容性的稳健警惕方法，并结合零信任（即：不信任任何实体，验证一切）模型，或许是一个良好的起点。归根结底，医疗机构的所有利益相关者都必须成为企业网络安全责任的伙伴和合作者，通过那些有时并不方便的、但对于保障医疗信息和通信技术的最佳实践和方法，相互支持和补充。通过追踪即使是那些未以物理形式表现的行为，奖励并赞扬良好的安全行为和实践；同样，也要确保及时纠正和弥补不良的安全行为和实践。建立网络安全策略（例如：密码和用户账户策略、防火墙和远程通信策略、设备控制策略等）并确保其执行。


    然而，在此之外，或许更重要的是，必须营造一种氛围，让用户和员工能够轻松地报告无意的行为或疏忽，这些行为可能无意中损害了组织的安全状态，或违反了某些安全策略，即使这些安全漏洞仅仅是理论上的，且可能尚未导致实际的安全事件。在这样的氛围中，医疗机构可能赢得宝贵的时间来有效应对或反应，从而帮助他们避免迫在眉睫的安全事件造成更严重的后果。然而，如果没有一种让人们/用户感到可以在不受不当指责的情况下披露此类疏忽的氛围，这些收益将难以实现。


    但，为了让上述任何措施发挥作用，培训、意识和能力建设不能仅属于那些具备技术能力的人员的专属领域（他们的职能和角色可能需要这些技能）。相反，应让每个利益相关者都合理地了解组织的网络安全体系是什么样的、采取了哪些保护/限制措施以及位于何处；建立了哪些监控和问责措施；对安全风险的容忍程度如何；哪些信息技术资产对于防御至关重要，以及防御的威胁本质是什么；哪些实体和领域是高风险的；在受到威胁或攻击时该怎么办。重要的是，在这些方面，不能让任何一个利益相关者掉队。


    现在，可能会有人认为，这基本上是将机会拱手给了恶意内部人员。然而，结合其他物理、逻辑和操作要求进行整体考虑时就会显而易见，网络安全文化只是一个补充方面，在保护电子健康系统和基础设施的任务中，它与任何其他方面同等重要。


    ### 4. 创建用于风险评估和事件管理的内部框架/机制


    对于医疗服务提供的业务来说，这是不可或缺的，因为电子健康系统和基础设施的风险和事件可能直接预示着生命安全的严重影响。因此，医疗机构需要建立一个框架/机制，在内部评估网络安全风险并管理事件，以防止它们在组织产生不良后果之前发生。


    这将特别帮助医疗机构有效评估某些流程、操作和实践对长期业务连续性的影响，同时增强和加强其检测、调查、预防、响应、遏制和从网络安全事件中恢复的能力，并将损害和损失降至最低。


    但更重要的是，这些框架/机制应该是足够稳健、主动且具有响应性的，以便在网络安全风险真正变成事件之前发现它们。可能性、概率、后果影响/严重性、可缓解性（按程度划分）以及可避免性。这些是有效风险评估的已知支柱——能够建立在语境下事件发生的可能性、在给定现有组织流程、操作和实践的情况下事件发生的概率、产生结果的影响/严重性、如何减轻/扩散此类影响以及达到何种程度，以及此类风险在多大程度上可以完全避免。这些是电子健康系统和基础设施网络安全的关键考量。


    此外，对于部署了电子健康系统和基础设施的医疗机构来说，一个韧性的运营应急计划对于其风险管理和事件响应体系是不可或缺的。这将有助于确保当风险转化为事件时，医疗运营不会停滞。


    ## 合规性监控与评估


    遗憾的是，如果没有协调的监控和评估方法，这些物理、逻辑或操作要求都将无法产生有效效果，以确保在电子健康系统和基础设施以各种形式呈现的医疗机构各层面都能实现合规。监控和评估计划通常被证明有助于构建和引导这方面的努力和活动。


    这通常始于定义监控和评估工作的目标/结果、如何对这些目标/结果进行基准比较，以及合规包含什么（涉及指标，以及如何在语境中对其进行衡量/评估）。或许，例如，衡量合规性可以设想为成功的监管（重新）评估，或者表现为账户管理系统和服务器标记为不符合组织密码策略要求的密码数量减少。


    所有这些随后都可以形式化为一份计划，概述将针对监控评估过程部署哪些方法和技术路线——可以是物理、逻辑或操作性的——以及如何应用这些方法。接下来是根据监控和评估计划的基准目标，决定追求哪些证据，在投入确保确保监控和评估过程顺畅高效所需的资源之前。


    事实上，合规性监控评估方法营造了主动性和响应性的氛围，从长远来看，增强了医疗机构对电子健康系统和基础设施进行有效安全的能力。然而，为了在这方面有见地进行，直观的第一步是能够理解新和现有电子健康部署周围存在什么样的生态系统，以及这些生态系统如何运行并与医疗机构的数字能力和交互。


    ## 理解电子健康部署的生态系统


    正如第二章](#ch2.xhtml）所示，当电子健康部署开始扩大和扩张时，通常会看到现有框架和流程周围形成了新的医疗业务服务的数字生态系统。理解这些新生态系统对现有结构的影响（特别是数据和信息安全方面），对于医疗机构这些事业的成功至关重要。


    '
