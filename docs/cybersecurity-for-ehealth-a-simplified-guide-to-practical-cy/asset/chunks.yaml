- raw: "    All of these are some lines of defence that might be in place to help\
    \ inspire and support personal cybersecurity efforts in the context of eHealth,\
    \ either by way of complement, or supplement for security resilience and threat\
    \ prevention. Hence, it is important that healthcare professionals are familiar\
    \ with, and cooperate with these lines of defence as part of the process of enhancing\
    \ their Intuition for Security in order to engage effectively with the modern\
    \ realities of the cybersecurity threat landscape for eHealth.\n\n    Therefore!\
    \ Use strong passwords, and change them regularly. Avoid reusing old passwords,\
    \ regardless of how long it has been since the last usage. Quickly install/apply\
    \ security updates soon after they are released. Do not share or reveal personal\
    \ access credentials. Refrain from fiddling with security software and utilities,\
    \ for which the capacity to operate knowledgeably is lacking. Be wary of clicking\
    \ links and bypassing filters to visit web locations or download resources that\
    \ are ordinarily restricted, or possibly flagged as potentially dangerous. Be\
    \ careful when performing sensitive work functions/duties using personal devices.\
    \ Do not write passwords and access credentials on pieces of paper; digital password\
    \ management software offer a safer alternative. These are to mention a few.\n\
    \n    Now, there could be dreadful situations when self-preservation is a consideration\
    \ for personal cybersecurity such as when life and personal safety might be directly\
    \ under threat. Under such circumstances, understanding what lines of defence\
    \ are available to support personal cybersecurity could trigger behavioural responses\
    \ that would, in retrospect, reflect optimal choice for personal cybersecurity,\
    \ in a way that does not endanger personal safety.\n\nTherefore, towards being\
    \ able to identify, isolate, and contain threat situations to personal cybersecurity\
    \ in healthcare applications of information technology, it is not just enough\
    \ that healthcare stakeholders know what assets under their security stewardship\
    \ are likely to be exploited by threat actors. They must also be able to realize\
    \ what threat actors might have interest in gaining a foothold on these assets,\
    \ and equally understand what types of tools and techniques threat actors are\
    \ likely to apply in seeking to compromise these assets. Beyond these, however,\
    \ it is important to observe for deviations in performance efficiency, in order\
    \ to be able to circumvent threat situations by immobilizing mediums for propagation\
    \ and amplification. Whereas, all of these rely on a shrewd understanding of what\
    \ lines of defence are in place to support and inspire personal cybersecurity\
    \ efforts.\n\n## Escalation and Reporting\n\nIt is a fact that there are certain\
    \ threats and threat situations to personal cybersecurity in the context of healthcare\
    \ information technologies, for which ordinary (technically untrained) stakeholders\
    \ might be unprepared or unable to deal with effectively. Consider, for example,\
    \ those threat situations that involve sovereign-sponsored or sovereign-affiliated\
    \ threat agents and entities, or even actual sovereign entities themselves. Where\
    \ threat resource capabilities abound and often far exceed the best of whatever\
    \ might be in place to support and inspire personal cybersecurity.\n\nIn such\
    \ situations, it is foolhardy for users to assume that they might be able to engage\
    \ effectively and resiliently with these threat situations. Hence, part of the\
    \ responsibility of personal cybersecurity in eHealth, and indeed the Intuition\
    \ for Security, is being able to identify when one is up against a threat actor\
    \ that, by far, out-matches their resource capabilities (e.g. training, and security\
    \ setup), and knowing when and how to escalate and report appropriately.\n\nNonetheless,\
    \ it is indeed crucial to escalate that all suspected, confirmed, successful,\
    \ or unsuccessful threat attempts against personal cybersecurity. It is important\
    \ to report such attempts promptly and adequately to the relevant units/mechanisms\
    \ within the healthcare organization. To disregard this is dangerous, because\
    \ it is seldom the case that threats to personal cybersecurity are lone or random\
    \ incidents. They are often coordinated attempts to compromise the cybersecurity\
    \ status of an organization/enterprise on a large scale. Thus, by reporting such\
    \ attempts promptly and effectively, it becomes possible to activate adequate\
    \ measures of vigilance early enough to forestall imminent large-scale attacks.\n\
    \nHowever, the approach to Incident Reporting and Escalation is fundamentally\
    \ a function of what organizational or regulatory structures are in place to manage\
    \ cybersecurity incidents (either as a specific class of incidents or as part\
    \ of a generic incident-handling repertoire). Therefore, the establishment of\
    \ structures and mechanisms for effective incident handling and management is\
    \ non-negotiable for healthcare organizations, especially considering the critical\
    \ nature of operations that characterize healthcare services delivery, and the\
    \ dimensions of risk to human life. Beyond this, it is equally important that\
    \ People/Users are aware of procedures specified by organizational incident management\
    \ mechanisms for incident escalation and reporting.\n\nNonetheless, the struggle\
    \ to communicate cybersecurity incidents effectively to the appropriate organizational\
    \ technical support, and security or incident management teams is one that is\
    \ real for both the non-technical users (who often report these incidents) and\
    \ the technical teams who have to respond to these incidents. This is many times\
    \ the result of a disconnection between how well users are able to communicate\
    \ the incidents in the escalation reports, and how understandable and useful these\
    \ reports are to inform timely and effective technical responses. Here are a few\
    \ illustrative questions to help People/Users effectively escalate and report\
    \ healthcare cybersecurity incidents to technical support and response teams.\n\
    \n1.  How would you describe the realities of your personal cybersecurity and\
    \ user experience in the recent period preceding the onset of the incident up\
    \ until the time of reporting?\n\n    Be sure to state all occurrences of note\
    \ that you might have experienced as an information technology user in the period\
    \ leading up to the time of reporting the incident.\n\n    These might be notable\
    \ happenings or occurrences in personal engagements, involvements, and interactions\
    \ for which there was an (attempted) interface with devices, systems, or access\
    \ credentials.\n\n2.  Are there any noticeable changes or deviations in normal\
    \ operating behaviours and conditions of information technology assets under personal\
    \ custody? Have these events ever occurred before?\n\n    Ensure that all noticed\
    \ abnormalities relating to the personal use of information technologies are adequately\
    \ stated. Do not forget to state having previously noticed these abnormalities,\
    \ if that is the case.\n\n3.  What user operations and activities were in progress\
    \ before the onset of these behaviours?\n\n    Report aptly the operations and\
    \ activities pertaining to the personal use of information technology that were\
    \ ongoing about the time the first and subsequent abnormalities in behaviour and\
    \ operating conditions were noticed.\n\n4.  Were there any surrounding circumstances\
    \ of note that were associated with the incident?\n\n    If there were any associated\
    \ events, be sure to state these as well. These events could have been environmental,\
    \ functional/operational, or otherwise.\n\n5.  Were any personal (authorized or\
    \ unauthorized) measures taken prior to the time of escalation/reporting, concerning\
    \ the situation(s) being escalated/reported?\n\n    Be sure to state precisely\
    \ and transparently what personal measures might have been taken previously with\
    \ regards to the incident being reported, regardless of whether such measures\
    \ were authorized or not. Also, mention what insights might have informed these\
    \ measures."
