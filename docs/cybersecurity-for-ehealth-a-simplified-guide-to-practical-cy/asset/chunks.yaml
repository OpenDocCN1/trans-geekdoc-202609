    Security of Healthcare Data*](#ch5.xhtml#R_en5_2). Research Report. [https://www.ponemon.org/local/upload/file/Sixth%20Annual%20Patient%20Privacy%20%26%20Data%20Security%20Report%20FINAL%206.pdf](https://www.ponemon.org)


    3.  [Experian (2012, January 27). *Ponemon Institute Study: Reputation Impact
    of a Data Breach*](#ch5.xhtml#R_en5_3). [https://www.databreachtoday.com/whitepapers/ponemon-institute-study-reputation-impact-data-breach-w-540](https://www.databreachtoday.com)


    4.  [Turn, R., & Ware, W. H. (1976). Privacy and security issues in information
