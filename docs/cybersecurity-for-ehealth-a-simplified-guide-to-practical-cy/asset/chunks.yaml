    \ or transmission. \n\n**Data Subject:**\n\n: A human or non-human entity, to\
    \ which a particular data element refers. \n\n**Denial of Service:**\n\n: The\
    \ malicious action of preventing legitimate users from accessing digital platforms,\
    \ utilities, and resources (e.g., systems, devices, and networks), typically by\
    \ flooding and engaging such digital platforms, utilities, and resources with\
    \ useless (sometimes malicious) traffic and requests. \n\n**Digital Footprint:**\n\
    \n: Information that is available about an individual by virtue of their online\
    \ presence and activities on the Internet. \n\n**Digital Shadow:**\n\n: The collection\
    \ of all residual information (confidential, proprietary, or sensitive) about\
    \ an individual, which is left behind following engagements with a digital service\
    \ or platform. \n\n**Domain Name:**\n\n: A string that perpetually identifies\
    \ (that is, names and addresses) an online location as one that is autonomous\
    \ in its administration, authority, and control. \n\n**Encryption:**\n\n: The\
    \ process of encoding sensitive information in such a way that it can only be\
    \ accessed and understood by authorized entities that possess the information\
    \ that is needed to reverse the encoding operation (through a process known as\
    \ decryption). A secret key is a critical component in the process of encryption\
    \ and decryption, and holds the necessary information for successfully and legitimately\
    \ encoding and decoding data. \n\n**End-to-End (E2E):**\n\n: A design principle\
    \ which ensures that the features and functions that are critical to application\
    \ or security operations reside in the nodes sitting at both ends of a medium\
    \ that serves as an intermediary between these end nodes for the purpose of communication\
    \ or exchange. \n\n**Enumeration:**\n\n: An attack step that seeks to gather relevant\
    \ information with the aim of deducing a complete or representative listing/profile\
    \ of the entities of interest within a target domain/environment, which is often\
    \ a computer network, a physical office location, or a computer system. \n\n**Firewall:**\n\
    \n: A computer program that provides defence against unauthorized access to computer\
    \ systems or private networks. \n\n**Information and Communication Technologies\
    \ (ICTs):**\n\n: A broad terminology that is typically applied to describe the\
    \ unified models, frameworks, and apparatuses for communication and information\
    \ exchange, as well as the integral role played by computers and other digital\
    \ electronic devices in facilitating storage, manipulation, transmission, retrieval,\
    \ and access to such information. \n\n**Input Validation:**\n\n: A control mechanism\
    \ that is built into a device or software to check and ensure that data entered\
    \ by users meet the format, specifications, and requirements for processing. \n\
    \n**Keylogger:**\n\n: Hardware or software that is able to monitor and record\
    \ user keystrokes that are delivered through input devices to a digital computing\
    \ system or platform, and then store or relay such information to an attacker.\
    \ It is usually used to steal sensitive information for malicious purposes. \n\
    \n**Login Timeout:**\n\n: A security configuration that allows users to be automatically\
    \ logged out from digital systems, devices, and applications after a certain time\
    \ period has elapsed. \n\n**Malware:**\n\n: A portmanteau collocation of the terms\
    \ “MALicious” and “softWARE”. Referring to computer programs that are designed\
    \ to infiltrate digital systems and networks without consent or authorization,\
    \ and often with the capacity to cause damage. \n\n**Man-in-the-Middle:**\n\n\
    : The practice of intercepting digital communications by interposing between two\
    \ unknowing entities, often with malicious intent to relay, re-route, alter, or\
    \ simply gain (otherwise) unauthorized access to information/data. \n\n**Minimization:**\n\
    \n: The practice of limiting data collection operations to receiving only such\
    \ data elements that are necessary and relevant to fulfilling a specific purpose\
    \ that is well-defined. \n\n**Network:**\n\n: An interconnection of digital electronic\
    \ devices (such as computers) that enables communication/information exchange,\
    \ and the sharing of files and resources over electronic channels. \n\n**Network\
    \ Protocol:**\n\n: The rules of engagement that define and specify how data and\
    \ information exchange would take place between devices within a computer network.\
    \ \n\n**Network Sniffer:**\n\n: A software or device that enables the real-time\
    \ monitoring and analysis of packets and protocols on a network for legitimate\
    \ or malicious purposes. It is sometimes also referred to as a network analyser.\
    \ \n\n**Packet:**\n\n: The unit of data that is carried by a network, and is formatted\
    \ to contain the necessary information and control parameters that are needed\
    \ to transmit the data across the network. \n\n**Packet Tracer:**\n\n: A software\
    \ or device that is used to map the path along which packets travel on a network,\
    \ often by imitating or simulating the layout and structure of the network at\
    \ the physical, logical, or conceptual level. \n\n**Patch:**\n\n: An enhancement\
    \ that is provided for a computer program, or the files and data that it uses,\
    \ in order to fix security vulnerabilities or insufficiencies in the program.\
    \ \n\n**Phishing:**\n\n: A form of Social Engineering that usually involves an\
    \ attacker/malicious individual posing as a trusted entity in a text-based communication\
    \ (e.g., email, instant message \\[IM\\], short message \\[SMS\\], etc.). \n\n\
    **Platform:**\n\n: A business utility with an operating model that allows multiple\
    \ participants (consumers) to connect to it for the purposes of interacting, sharing,\
    \ creating, and deriving value typically through dyadic engagements and exchanges.\
    \ \n\n**Policy:**\n\n: A targeted body of procedures and principles that are established\
    \ to provide guidelines for informed decision-making and actions that lead to\
    \ rational outcomes, which are in line with broader envisioned goals. \n\n**Programming:**\n\
    \n: The process/task of creating solutions to computational problems through instructions\
    \ or commands written in a particular language that can be understood and processed\
    \ by a computer system. \n\n**Pseudonymization:**\n\n: The practice of substituting\
    \ personally identifiable information in a body of data with non-identifiable\
    \ information mapped to a description that enables the original personal information\
    \ to be easily deduced; thus, transforming the original data into one that does\
    \ not personally identify data subjects any longer. \n\n**Reconnaissance:**\n\n\
    : A preliminary step in an attack procedure that seeks to gather useful information\
    \ about the identities, operations, and vulnerabilities in target systems/networks\
    \ (sometimes referred to as enumeration), often with the aim of exploiting such\
    \ vulnerabilities in a later attack against the system/network. \n\n**Scavenging:**\n\
    \n: The practice of scouring through garbage for residual information of interest;\
    \ which, although, might have been ordinarily inaccessible (due to its sensitive\
    \ nature), could provide useful intelligence for future malicious operations.\
    \ \n\n**Secure Socket Communication:**\n\n: A protocol that is used to encrypt\
    \ web communications/transactions. It is sometimes also referred to as *Secure\
    \ Socket Layer (SSL) Communication*. \n\n**Security Protocol:**"
