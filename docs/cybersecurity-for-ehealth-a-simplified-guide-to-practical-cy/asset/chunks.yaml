    ## 6. 是否曾尝试过升级/报告此类事件和此类发生的情况？


    如果此前曾尝试通过正式（通过现有的组织渠道）或非正式方式对此类事件和异常情况进行升级或报告，请务必一并提及这些情况，同时确保说明此类尝试产生了什么结果或指令（如果有的话）。


    ## 7. 你对正在报告的事件是否有任何现有的怀疑和意见？哪些因素可能导致了这些怀疑/意见？


    对正在报告的事件持有个人的怀疑和意见是可以接受的。毕竟，你被认为是该事件的初始接触点之一。因此，请清晰且不含糊糊地陈述这些怀疑；并不要忘记提到哪些可能导致了这些怀疑。


    在网络安全事件的口头报告中，提前准备好这些问题的答案可能是一个好主意。即使在书面事件报告中，确保在书面报告中提供这些说明性问题的答案也同样重要。这些说明性问题并非声称无遗的；但它们确实为这方面的有效进展提供了有用的指南。


    因此，显而易见，在医疗保健和电子健康背景下，个人网络安全的有效性，取决于组织机制是否到位，以确保：


    1. 确保用户获得最新的培训和意识提升；

    2. 提供强有的安全策略和协议，以加强组织的安全状态；

    3. 保证实时信息验证，以及及时高效的技术支持；

    4. 有效且审慎地管理并最小化风险和责任；以及

    5. 建立协调的事件报告、升级、调查、响应/处理和恢复的韧性流程和程序。


    这进一步说明了一个事实：有效个人网络安全的旅程始于医疗保健组织或机构的高层行政和管理层。因为只有在这个框架内，网络安全意识的影响才能从高层向外和向下渗透，从而通过敏锐`安全直觉`（`Intuition
    for Security`）来增强个人网络安全的能力。


    考虑到电子健康网络安全的现状，医疗保健机构及其资产在任何时候都会受到威胁早已不再是一个“是否”的问题，而是“何时”以及医疗保健机构及其资产将“如何”受到威胁的问题。因此，这归结为面对即将发生或已发生的针对组织网络安全状态威胁和攻击时，为增强准备工作和响应能力而采取的措施和步骤。它们在威胁情况下的表现优劣，直接取决于威胁出现时其安全就绪的程度。


    ## 注释


    1. Verizon (2019). *数据泄露调查报告 (DBIR)*. [`enterprise.verizon.com/en-gb/resources/reports/dbir/2019/healthcare/`](https://enterprise.verizon.com)

    2. Life Healthcare Group (2020, 6 月 09 日). *Life Healthcare Group 遗憾地宣布其南部非洲业务已成为
    IT 系统针对性犯罪攻击的受害者*. [`www.lifehealthcare.co.za/news-and-info-hub/latest-news/life-healthcare-announces-cyber-incident/`](https://www.lifehealthcare.co.za)

    3. McGee, M. (2014, 5 月 07 日). *违反 HIPAA 的 480 万美元和解：今日医疗保健*. [`www.healthcaretoday.com/4.8-million-settlement-for-hipaa-violations/`](https://www.healthcaretoday.com)


    # 4 电子健康部署的数据/信息安全


    ## 引言


    由于许多司法管辖区的医疗保健法规和法律规定收集、处理、传输和存储电子医疗记录的医疗保健机构有确保这些记录安全、可靠且可访问的责任。2013 年，位于伊利诺伊州的机构
    Advocate Health Care 被迫向美国卫生与公众服务部（HHS）的民事办公室支付了 555 万美元的民事和解索金。


    在导致此次泄露的事件之一中，该医疗保健机构的子公司 Advocate Medical Group 在其办事处之一遭到了入室盗窃，导致四台笔记本电脑被盗。在另一起事件中，对组织网络的外部访问导致
    2000 名患者的医疗信息泄露。在另一一起事件中，一台工作笔记本从员工的车辆上被盗。所有事件发生在 2013 年 8 月至 11 月之间。


    事实上，这种责任意味着医疗保健机构有义务以最有效、最高效的方式管理数据，以确保数据元素：(a) 对于医疗决策是可靠且可靠的；(b) 免受未经授权的接触和干扰，以保护隐私；以及
    (c) 保证在任何时间、任何地点以及所有授权、合理且法的用途、功能和操作中随时可用。


    在第一章中，我们介绍并讨论了医疗数据的不变量（Invariants）。但在现代医疗保健实践中，这些不变变量如何反映了各种医疗利益相关者——监管机构、患者/客户、医疗服务提供者、医疗专业人员以及第三方供应商/关联机构对它们的重视程度？从非技术角度，可以应用哪些方法来帮助减少风险和责任，使医疗保健机构和专业人员能够更好地应对法规的复杂性？这就是本章讨论的核心。


