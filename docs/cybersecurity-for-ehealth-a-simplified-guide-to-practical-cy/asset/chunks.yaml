- raw: "With respect to Confidentiality, healthcare organizations have a duty to protect\
    \ the electronic healthcare/medical records of patients from unauthorized access,\
    \ even from within the organization itself. This demands that patients’ data and\
    \ information are only available to those professionals and workers who require\
    \ access to these records either for effective medical diagnosis or to enhance\
    \ the quality of healthcare delivery. It also requires that measures are in place\
    \ to ensure that these healthcare/medical professionals and workers are unable\
    \ to disclose such data and information without authorization, and consent of\
    \ the subject.\n\nTo compromise confidentiality, even internally, is to dwindle\
    \ general confidence in the ability of a healthcare organization to effectively\
    \ safeguard EHRs from threats that could come from any medium, including externally.\
    \ This has often been the focus of regulatory repercussions that follow when confidentiality\
    \ is compromised. How then can confidentiality be preserved?\n\nThe basic principle\
    \ for ensuring confidentiality is Access Control. However, how this is applied\
    \ could sometimes vary according to the state of the data/information being safeguarded\
    \ (whether it be at rest, or in transmission). Nonetheless, the conceptualization\
    \ of approaches is broadly the same, since the goal is generally to ensure that\
    \ unauthorized entities are unable to access, extract, or view data and information\
    \ that is considered confidential.\n\n1.  Access Authentication to Confirm Authorization\
    \ of Requesting Entities.\n\n    In trying to safeguard confidentiality for patients’\
    \ data and information in eHealth, it is important that sensitive medical records\
    \ are only accessible to those who are authorized. This usually implies adding\
    \ a layer of authentication, as a process of confirming the authorization of entities\
    \ requesting to gain access to such data or information.\n\n    Combining this\
    \ with an event log operation further helps to track and know which entities accessed\
    \ what particular data or information, and at what time, also making it possible\
    \ to determine what user operations have been performed on sensitive data and\
    \ information, even by authorized entities.\n\n2.  Encryption to Enable Secure\
    \ Transmission, Storage, and Retrieval.\n\n    Encryption is basically the process\
    \ of ensuring that sensitive data and information can ordinarily not be read or\
    \ interpreted as it is. This is typically achieved by encoding sensitive data\
    \ and information in a form that requires a secret key or passphrase in order\
    \ for the data or information to resolve back to a plain readable form.\n\n  \
    \  When this technique is applied across the entire spectrum of data communication/transmission\
    \ processes, it is referred to as end-to-end encryption (or, E2EE).\n\n## Guaranteeing\
    \ Availability\n\nIn several jurisdictions, regulations often require that patients\
    \ are provided with access to their healthcare records within a specified maximum\
    \ time period. This requirement is specified either as part of a healthcare regulatory\
    \ act, or as part of a general citizens’ information/data regulatory act. Within\
    \ these jurisdictions, the inability to meet this requirement by providing patients\
    \ with access to their healthcare data within the specified period (and for any\
    \ reason whatsoever) amounts to a regulatory violation that has often been met\
    \ with huge fines and settlements.\n\nBut then, how can availability be guaranteed\
    \ in the context of eHealth and healthcare information and communication technologies,\
    \ generally? A number of methods and approaches that have been widely adopted\
    \ include creating and managing backups, adding redundancy, as well as carrying\
    \ out periodic maintenance on systems, devices, and services, in order to tune\
    \ the performance for data processes and operations.\n\n1.  Basically, backing\
    \ up is a technique that helps to guarantee availability through the replication\
    \ of data elements, resources, and utilities. Through this technique, sensitive\
    \ healthcare/medical data and information are replicated to ensure that they remain\
    \ available even in the face of threats like malware actions, database corruption/malfunction/failure,\
    \ or loss due to deletion.\n\n2.  Redundancy is closely related to the concept\
    \ of backing up. Except that, while backing up often pertains to data elements,\
    \ resources, and utilities; redundancy is more relevantly applied to infrastructure,\
    \ systems, components, and functions. Redundancy refers to the duplication of\
    \ critical infrastructure, systems, components, and functions in order to enhance\
    \ reliability by creating a fail-safe alternative that guarantees availability.\n\
    \n    However, a common mistake that is often made in the creation and management\
    \ of backups and redundancies is that of not taking care to ensure that they are\
    \ not exposed to the same risk factors as those in use. For example, domiciling\
    \ a backup media on site at the healthcare facility, and under the same conditions\
    \ as in-use data media, could expose such backups to the same risk factors like\
    \ fires, theft, malware attacks, insider threats, etc. The same applies to redundant\
    \ infrastructure, systems, components, and functions.\n\n    In many cases, cloud-based\
    \ options have been recommended, as it not only removes the backups and redundancies\
    \ from the physical/environmental risks that could threaten the utilities that\
    \ they provide, but it also makes these backups and redundancies available without\
    \ restrictions to geography or location. But then again, there is also the need\
    \ to be cognizant of the fact that cloud backups and redundancies do not automatically\
    \ and entirely transfer the responsibility of data and information security to\
    \ cloud vendors, although, regulations have sometimes considered a shared and\
    \ well-defined parity arrangement in this regard.\n\n    This is first because\
    \ cloud infrastructure, platforms, and services are usually provided on an “*as-is*”\
    \ basis, and subscribing organizations have the responsibility of configuration\
    \ and customization by adding and dropping features in order to meet their security\
    \ standards and needs and also because cloud platforms have been discovered to\
    \ be a new target domain for cybercriminals\n\n3.  Tuning operations basically\
    \ avail a means of optimizing the performance of data sources, and database services,\
    \ and by extension, the data processes and operations that rely on them, thereby\
    \ ensuring that they continue to function optimally, effectively, and efficiently.\
    \ At scale, this becomes particularly important, as the implications of having\
    \ to wait for indeterminable periods of time as data processes and operations\
    \ progress through sub-optimal paths could be critical for both healthcare organizations\
    \ and their patients/clients.\n\n    To this end, it is additionally important\
    \ that periodic maintenance operations are carried out on eHealth systems, devices,\
    \ and services. Such as disk error checking to fix bad sectors, memory defragmentation\
    \ to optimize memory operations, reviewing error reports and firewall policy/event\
    \ logs to spot anomalies and warning signs, inspecting hardware integrity to identify\
    \ defects and deficiencies that could result in failure, updating security features\
    \ and applications, applying system upgrades and patches, clearing files that\
    \ are no longer in use to free up disk space, as well as running scans and diagnostics\
    \ to detect and analyse system faults.\n\nOther considerations for circumspect\
    \ data and information security in eHealth are to scrutinize and audit data sources,\
    \ data elements, and databases that are assimilated through mergers, acquisitions,\
    \ and business consolidation. Sometimes, these assimilations could bring in vulnerabilities\
    \ and risks that are able to jeopardize the security standing of the parent organization\
    \ and pre-existing data assets."
  fmt: '

    With respect to Confidentiality, healthcare organizations have a duty to protect
    the electronic healthcare/medical records of patients from unauthorized access,
    even from within the organization itself. This demands that patients’ data and
    information are only available to those professionals and workers who require
    access to these records either for effective medical diagnosis or to enhance the
    quality of healthcare delivery. It also requires that measures are in place to
    ensure that these healthcare/medical professionals and workers are unable to disclose
    such data and information without authorization, and consent of the subject.


    To compromise confidentiality, even internally, is to dwindle general confidence
    in the ability of a healthcare organization to effectively safeguard EHRs from
    threats that could come from any medium, including externally. This has often
    been the focus of regulatory repercussions that follow when confidentiality is
    compromised. How then can confidentiality be preserved?


    The basic principle for ensuring confidentiality is `Access Control`. However,
    how this is applied could sometimes vary according to the state of the data/information
    being safeguarded (whether it be at rest, or in transmission). Nonetheless, the
    conceptualization of approaches is broadly the same, since the goal is generally
    to ensure that unauthorized entities are unable to access, extract, or view data
    and information that is considered confidential.


    ### 1. Access Authentication to Confirm Authorization of Requesting Entities


    In trying to safeguard confidentiality for patients’ data and information in eHealth,
    it is important that sensitive medical records are only accessible to those who
    are authorized. This usually implies adding a layer of authentication, as a process
    of confirming the authorization of entities requesting to gain access to such
    data or information.


    Combining this with an event log operation further helps to track and know which
    entities accessed what particular data or information, and at what time, also
    making it possible to determine what user operations have been performed on sensitive
    data and information, even by authorized entities.


    ### 2. Encryption to Enable Secure Transmission, Storage, and Retrieval


    Encryption is basically the process of ensuring that sensitive data and information
    can ordinarily not be read or interpreted as it is. This is typically achieved
    by encoding sensitive data and information in a form that requires a secret key
    or passphrase in order for the data or information to resolve back to a plain
    readable form.


    When this technique is applied across the entire spectrum of data communication/transmission
    processes, it is referred to as end-to-end encryption (or, `E2EE`).


    ## Guaranteeing Availability


    In several jurisdictions, regulations often require that patients are provided
    with access to their healthcare records within a specified maximum time period.
    This requirement is specified either as part of a healthcare regulatory act, or
    as part of a general citizens’ information/data regulatory act. Within these jurisdictions,
    the inability to meet this requirement by providing patients with access to their
    healthcare data within the specified period (and for any reason whatsoever) amounts
    to a regulatory violation that has often been met with huge fines and settlements.


    But then, how can availability be guaranteed in the context of eHealth and healthcare
    information and communication technologies, generally? A number of methods and
    approaches that have been widely adopted include creating and managing backups,
    adding redundancy, as well as carrying out periodic maintenance on systems, devices,
    and services, in order to tune the performance for data processes and operations.


    ### 1. own, backing up is a technique that helps to guarantee availability through
    the replication of data elements, resources, and utilities. Through this technique,
    sensitive healthcare/medical data and information are replicated to ensure that
    they remain available even in the face of threats like malware actions, database
    corruption/malfunction/failure, or loss due to deletion.


    ### 2. Redundancy is closely related to the concept of backing up. Except that,
    while backing up often pertains to data elements, resources, and utilities; redundancy
    is more relevantly applied to infrastructure, systems, components, and functions.
    Redundancy refers to the duplication of critical infrastructure, systems, components,
    and functions in order to enhance reliability by creating a fail-safe alternative
    that guarantees availability.


    However, a common mistake that is often made in the creation and management of
    backups and redundancies is that of not taking care to ensure that they are not
    exposed to the same risk factors as those in use. For example, domiciling a backup
    media on site at the healthcare facility, and under the same conditions as in-use
    data media, could expose such backups to the same risk factors like fires, theft,
    malware attacks, insider threats, etc. The same applies to redundant infrastructure,
    systems, components, and functions.


    In many cases, cloud-based options have been recommended, as it not only removes
    the backups and redundancies from the physical/environmental risks that could
    threaten the utilities that they provide, but it also makes these backups and
    redundancies available without restrictions to geography or location. But then
    again, there is also the need to be cognizant of the fact that cloud backups and
    redundancies do not automatically and entirely transfer the responsibility of
    data and information security to cloud vendors, although, regulations have sometimes
    considered a shared and well-defined parity arrangement in this regard.


    This is first because cloud infrastructure, platforms, and services are usually
    provided on an “as-is” basis, and subscribing organizations have the responsibility
    of configuration and customization by adding and dropping features in order to
    meet their security standards and needs and also because cloud platforms have
    been discovered to be a new target domain for cybercriminals.


    ### 3. Tuning operations basically avail a means of optimizing the performance
    of data sources, and database services, and by extension, the data processes and
    operations that rely on them, thereby ensuring that they continue to function
    optimally, effectively, and efficiently. At scale, this becomes particularly important,
    as the implications of having to wait for indeterminable periods of time as data
    processes and operations progress through sub-optimal paths could be critical
    for both healthcare organizations and their patients/clients.


    To this end, it is additionally important that periodic maintenance operations
    are carried out on eHealth systems, devices, and services. Such as disk error
    checking to fix bad sectors, memory defragmentation to optimize memory operations,
    reviewing error reports and firewall policy/event logs to spot anomalies and warning
    signs, inspecting hardware integrity to identify defects and deficiencies that
    could result in failure, updating security features and applications, applying
    system upgrades and patches, clearing files that are no longer in use to free
    up disk space, as well as running scans and diagnostics to detect and analyse
    system faults.


    Other considerations for circumspect data and information security in eHealth
    are to scrutinize and audit data sources, data elements, and databases that are
    assimilated through mergers, acquisitions, and business consolidation. Sometimes,
    these assimilations could bring in vulnerabilities and risks that are able to
    jeopardize the security standing of the parent organization and pre-existing data
    assets.

    '
  trans: '

    在保密性方面，医疗机构有义务保护患者的电子健康/医疗记录免受未经授权的访问，即使是来自组织内部也是。这要求患者的数据和信息仅对那些为了有效的医疗诊断或提高医疗服务交付质量而需要访问这些记录的专业人员和员工可用。它还需要采取措施，确保这些医疗/健康专业人员和员工无法未经授权和未经主体同意的情况下泄露此类数据和信息。


    破坏保密性（即使在内部）也会削弱人们对医疗机构有效防御来自任何媒介（包括外部）威胁的电子健康记录（EHR）能力的信任。这通常是保密性破坏后引发监管后果的焦点。那么，如何保持保密性呢？


    确保保密性的基本原则是`访问控制`。然而，其应用方式有时会根据所保护的数据/信息的状态（是静态存储还是传输中）而异。尽管如此，方法的概念化大致相同，因为目标通常是确保未经授权的实体无法访问、提取或查看被视为机密的数据和信息。


    ### 1. 访问认证以确认请求实体的授权


    在尝试保护电子健康中患者数据和信息的保密性时，确保敏感医疗记录仅供获得授权的人员访问非常重要。这通常意味着增加一层认证，作为一个确认请求访问此类数据或信息的实体已授权的过程。


    将此与事件日志操作相结合，进一步有助于追踪和了解哪些实体在什么时间访问了哪些特定数据或信息，同时也可能确定即使是经过授权的实体对敏感数据和信息执行了哪些用户操作。


    ### 2. 加密以实现安全的传输、存储和检索


    加密基本上是一个确保敏感数据和信息通常通常无法按其原样被读取或解释的过程。这通常通过将敏感数据和信息编码为某种形式来实现，该形式需要密钥或口令才能将数据或信息还原为可读的明文形式。


    当这种技术应用于整个数据通信/传输过程谱时，它被称为端到端加密（或`E2EE`）。


    ## 保证可用性


    在多个司法管辖区，法规通常要求在指定的最长时间内向患者提供其健康记录。这一要求可能被规定为医疗监管法案的一部分，或作为普通公民信息/数据监管法案的一部分。在这些管辖区内，未能能在规定时间内（无论出于什么原因）为患者提供其健康数据的访问权限，等同于违反监管规定，这通常会导致巨额罚款和和解。


    但是，在电子健康和医疗信息通信技术的背景下，通常如何保证可用性呢？许多广泛采用的方法和途径包括创建和管理备份、增加冗余，以及对系统、设备和服务进行定期维护，以调优数据处理和操作的性能。


    ### 1. 备份是一种通过数据元素、资源和工具的复制来保证可用性的技术。通过这种技术，敏感的医疗/医疗数据信息被复制，以确保它们在面临恶意软件攻击、数据库损坏/故障/失效或因删除丢失等威胁时仍然保持可用。


    ### 2. 冗余与备份的概念密切相关。不同在于，备份通常涉及数据元素、资源和工具；而冗余更多地应用于基础设施、系统、组件和功能。冗余是指对关键基础设施、系统、组件和功能的复制，通过创建一个能够保证可用性的故障备用替代方案来增强可靠性。


    然而，在创建和管理备份与冗余时，经常犯的一个常见错误是没有确保它们不会暴露在与正在使用的媒介相同的风险因素中。例如，将备份介质存放在医疗机构现场，并处于与使用数据介质相同的条件下，可能会使此类备份暴露在火灾、盗窃、恶意软件攻击、内部威胁等相同风险因素中。冗余基础设施、系统、组件和功能也是如此。


    在许多情况下，云端选项被推荐，因为它不仅使备份和冗余不受可能威胁其所提供功能的物理/环境风险，而且让这些备份和冗余不受地理或位置限制地变得可用。但另一方面，也需要意识到，云备份和冗余不会自动且完全地将数据和信息安全的责任转移给云供应商，尽管法规有时会在此方面考虑一种共享且定义良好的对等安排。


    这首先是因为云基础设施、平台和服务通常是按“原样”的基础上提供的，订阅组织有责任通过添加和删除功能来完成配置和定制，以满足其安全标准和需求；而且由于云平台已被发现是网络攻击者的新目标领域。


    ### 3. 调优操作基本上提供了一种优化数据源、数据库服务，并扩展到依赖这些服务的数据处理和操作性能的方法，从而确保它们继续以最佳、有效且高效的方式运行。在大规模下，这变得尤为重要，因为当数据处理和操作通过次优路径进行时，必须等待不确定的时间，其影响对医疗机构及其患者/客户来说可能是致命的。


    为此，额外对电子健康系统、设备和服务进行定期维护操作也同样重要。例如：磁盘错误检查以修复坏道、内存碎片整理以优化内存操作、审查错误报告和防火墙策略/事件日志以发现异常和警告信号、检查硬件完整性以识别可能导致故障的缺陷和不足、更新安全功能和应用程序、应用系统升级和补丁、清理不再使用的文件以释放磁盘空间，以及运行扫描和诊断以检测和分析系统故障。


    电子健康数据和信息安全的其他考虑因素包括审查和审计通过合并、收购和业务整合的数据源、数据元素和数据库。有时，这些整合可能会引入漏洞和风险，危及母机构的安全状况和现有数据资产。

