  trans: '


    同样，配置不当的医疗系统或数据库服务器会构成 `Threat`（威胁）。缺乏经验的系统管理员，或允许用户任意配置和重新配置企业设备的组织政策——这些都是导致该
    `Threat`（威胁）的预设性 `Vulnerabilities`（漏洞）。医疗数据泄露是这种情况可能导致的安全违规行为，尽管其中可能并不涉及恶意意。


    此外，允许员工获得比其工作功能通常所需的更高权限以访问数据和信息资源的医疗机构组织政策，也是一种 `Vulnerability`（漏洞）。担任此类角色的员工本身就会成为一个
    `Threat`（威胁）。然而，利用这种特权恶意地汲取敏感数据或信息以获取个人财务利益，是一种违反安全性的攻击行为。


    再次，医疗机构中没有身份验证密码的开放 Wi-Fi 连接也是一种 `Vulnerability`（漏洞）。未经授权而连接到该资源的外部人员将成为一个 `Threat`（威胁）。当这种外部人员在此种情况下采取恶意行动时，就发生了一次
    `Attack`（攻击）。


    请注意，`Threats`（威胁）的来源可能是内部的（在这种情况下被称为内部威胁），也可能是外部的。但在实践中，`Threats`（威胁）、`Vulnerabilities`（漏洞）和
    `Attacks`（攻击）之间的关系不仅复杂，而且错综复杂。这种关系的性质有时使得在理论上难以这些概念之间划定清晰的界限。然而，理解此处提供的描述有助于识别电子医疗网络安全威胁格局的现状。


    ## 电子医疗网络安全的威胁主体


    当 `Threat Agents`（威胁主体）利用、试图利用或持续利用某种漏洞时，`Threats`（威胁）便会存在或表现出来。因此，这些 `Threat
    Agents`（威胁主体）是电子医疗网络安全讨论中不可或缺的因素。事实上，电子医疗网络安全威胁格局一直存在不同的参与者。曾出现在该格局中的 `Threat
    Agents`（威胁主体）包括个人实体、独立团体、企业实体、主权（国家级）实体或非主权（但受国家资助）实体。换句话之，基本上，电子医疗网络安全的 `Threat
    Agents`（威胁主体）包括个人和非实体（这些实体可以是独立的或与国家相关的），以及主权实体。


    `Individual Entities`（个人实体）可能是在计算机/信息安全工作和操作方面具有技术技能的黑客。他们也可能包括可能没有技术技能但可能寻求通过非技术手段实施恶意操作的恶意个人。此外，他们也可能是没有恶意的单纯的人类行为者（内部或外部），但他们无意的行动和活动对安全利益和目标的危害可能并不较小。


    `Independent Groups`（独立团体）是由于共同愿景或使命而联合的恶意个人实体协会，这种愿景可能是政治的、意识形态、文化、财务、爱国主义或其他。在他们的操作手段库中，他们可能表现出特定水平的技术能力。而其操作背后的灵感可能是恐怖/叛乱、宣传、极端主义、行动主义或狂热的执忱。


    在某些情况下，出于各种原因寻求实施恶意网络行动的主权政府可能会资助 `Individuals`（个人）和 `Independent Groups`（独立团体）。在这种身份下，他们被归为
    `Sovereign-sponsored/Sovereign-affiliated Threat Agents`（主权资助/主权相关的威胁主体）。


    具有竞争或伙伴利益的 `Corporate Entities`（企业实体）也可能作为电子医疗网络安全的威胁主体。当涉及竞争利益时，恶意意图通常会出现，其目的是破坏企业利益或目标机构的声誉。然而，当涉及伙伴利益时，疏忽的行为同样可能创造或持续可能危害企业安全利益的威胁态势。与非主权资助的
    `Individual Entities`（个人实体）和 `Independent Groups`（独立团体）相比，具有恶意意图的 `Corporate Threat
    Entities`（企业威胁实体）通常具有更强的威胁资源能力。


    这方面的威胁资源能力可能是财务的、技术性的（技能集和工具集的能力）和/或基础设施的。


    `Sovereign Entities`（主权实体）是指实施恶意网络行动的国家，旨在维护或巩固国家利益，这些利益可能是政治的、贸易相关的、声誉相关的或安全相关的。国家级实体通常能够部署看似无限的威胁资源能力，以确保并放大其威胁攻击行动的影响。


    在医疗保健背景下，主权和主权资助/主权相关的实体威胁网络安全并非寻常。同时，这并非不可能。由于财务利益已知是大多数（超过 80%）的主要动力。


    然而，也存在一些情况，医疗机构及其系统和基础设施提供了进入更大目标（如国家政府或军队）的操作和活动的窗口或余地，尽管这并不常见。还有更常见的情况是医疗设施持有具有国家或国际利益的影响力个人的健康记录。在这种情况下，医疗机构可能成为主权和主权资助实体的目标。


    例如，2018 年 SingHealth 网络攻击后的多个来源，英国电报


    ## 医疗领域的网络安全事件


    由于威胁主体的恶意或无意行为导致医疗领域发生网络安全事件时，某些结果会表现出来，多种工具和技术、方法或策略以及威胁目标经常作为导致这些结果的威胁攻击过程的操作的一部分出现（见图
    2.3）。


    ![图 2.3 健康网络安全事件发生](img/fig6_B.jpg)


    图 2.3 健康网络安全事件发生


    通常，这些 `Outcomes`（结果）包括*数据泄露*、*间谍活动*以及*医疗保健 IT 系统/设备的不可用或故障*。然而，间谍活动很少是针对医疗设施的结果，除非如前所述，医疗机构的系统或基础设施提供了进入更大利益实体（如政府或军队）的操作和活动的窗口/余地。


    通向这些结果的轨迹特征包括：


    - `Threat Objectives`（威胁目标），例如侦查/枚举、数字/电子拦截、服务中断、诱发系统/设备故障、破坏安全文化/协议/操作、凭据填充以及身份盗用/数字仿冒；


    - `Methods, Strategies, or Approaches`（方法、策略或手段），例如伪造（电子邮件、数据包、位置、地址、协议操作、网站、生物及非生物识别符等）、社会工程、高级持续威胁（APT）、物理事件和活动（包括无意或恶意的内部操作）、无线钓网、中间人攻击
    (MITM)、注入/投毒、权限提升、转运、影子活动、拾荒、劫持、颠覆/绕过协议和常规以及拒绝服务 (DoS)；以及。


