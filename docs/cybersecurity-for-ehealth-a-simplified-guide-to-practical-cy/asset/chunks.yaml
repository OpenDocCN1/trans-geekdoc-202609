  trans: "\n\n定期的渗透测试可以模拟真实的网络攻击条件和操作，这有助于为组织框架、结构、流程和政策的安全韧性提供有用的见解。这些对于识别威胁数据和信息安全的故障防线至关重要，并可能扭转那些部署信息通信技术用于医疗/健康服务交付的医疗机构的安全状况。\n\
    \n此外，还有必要确保第三方供应商、子公司和关联公司能够遵守与母级医疗机构相同的数据和信息安全标准。很多时候，我们可以看到这些第三方的疏忽无论是蓄意还是无意地制造并持续了漏洞，并最终对母级机构产生了负面影响。\n\
    \n最终，在电子健康（eHealth）背景下，数据和信息安全仍然是医疗机构的责任，这种责任不可推卸，至少在监管层面是如此。在引入其他各种参与者和人员与医疗信息通信技术对接时，医疗机构的风险表面扩大了，尽管责任仍然是圣不可侵的。当这些参与者和人员理解了用于确保完整性、保护隐私、维护机密性和保证可用性的措施和机制时，他们能够更好地协作并支持现有的措施和机制，以实现实现的目标和结果。\n\
