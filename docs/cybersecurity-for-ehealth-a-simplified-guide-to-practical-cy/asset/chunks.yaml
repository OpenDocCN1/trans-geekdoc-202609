    ## 2. Preserve the integrity of the organizational environment


    Loosely hanging network (Ethernet) cables, uncovered or broken pattress boxes
    and cable trunking, cabling that runs pretty long (sometimes, publicly accessible)
    distances to connect end-to-end, digital/electronic devices lying around within
    environs of healthcare facilities, which bear no identity nor can be accounted
    for – all of these are common environmental sights around many healthcare organizations
    that have implications for cybersecurity. Hardware packet sniffers, keyloggers,
    signal jammers/interference generators, and network extenders/repeaters have been
    able to successfully latch onto eHealth systems and infrastructure through these
    means, without being detected for considerably long periods of time.


    Therefore, when cabling has to run considerable distances and wireless options
    are not preferred, conduit channels are a recommended option. But then, when the
    physical integrity of these channels is compromised, they must be fixed expeditiously.
    Similarly, network cables that are not/no longer in use should be de-crimped and
    stopped, or uninstalled altogether.


    Furthermore, it is good practice to conspicuously brand digital/electronic devices
    that are owned and operated by healthcare organizations, particularly ones that
    function internally (within the organization’s facility). This makes it easier
    to identify alien ware when they are spotted within the healthcare facility.


    ## 3. Adopt avenues and options for secure disposal


    Indeed, it would not be any gainsaying that much of the electronic waste generated
    by healthcare organizations potentially contain sensitive data and information
    that cannot be casually disposed of. This includes storage media, systems, devices,
    and even non-electronic hardcopy printed documents and inscribed pieces of paper.
    Hence, it is important to establish adequate measures and procedures to securely
    dispose of such materials when no longer useful or in use.


    For recyclable and non-recyclable electronic materials, organizational measures
    should be established to ensure that they are completely ridded of the data and
    information that they contain (or used to contain), so that they are non-recoverable,
    or at least not easily recoverable. Similarly, non-electronic materials should
    be effectively shredded and/or incinerated as well.


    ## Cybersecurity for eHealth: Logical Imperatives


    ### The 2019 Spotlight Report on Healthcare


    The result is a perpetuated threat situation that has many times seen eHealth
    systems and devices with vulnerabilities that have long been publicized by manufacturers
    and developers, still featuring actively in healthcare operations, even though
    measures have not been taken to ensure that they have received the most up-to-date
    security patches and fixes. Also, there is a potentially dangerous situation wherein
    a central production network/database infrastructure serves both employees, guests/clients,
    as well as third-party vendors & subsidiaries of healthcare organizations, without
    effective boundaries and limits. In addition, there has also been the reality
    of critical production systems and infrastructures being used in various healthcare
    functions and operations, reaching far too widely without adequate safeguards
    against external interference.


    Therefore, as part of the logical imperatives for effectively securing eHealth
    systems and infrastructures, it is important to:


    #### 1. Limit the coverage and accessibility of eHealth systems & infrastructure


    It has often proven inimical to the interest and goals of cybersecurity of information
    technology in healthcare for organizational systems and infrastructure to be accessible
    beyond the scope wherein coverage is required for authorized use. Broad-range
    wireless networks that are still accessible hundreds of metres away from the healthcare
    facility, files and folders shared on healthcare systems to be accessible over
    poorly secure networks, remote connection capabilities that are not end-to-end
    resilient against interception and tampering, including eHealth systems and devices
    that are able to pick up insecure (and unverifiable) wireless network signals.


    As a basic principle, it would be neither exaggeration nor paranoia to recommend
    that all (sensitive) data and information that feature in the context of eHealth
    and healthcare technologies generally, are encrypted and only transmitted over
    secure channels. Beyond this, digital coverage and accessibility of eHealth systems
    and infrastructure should be checked and controlled. As a rule, it is important
    to ensure that such systems and infrastructure that routinely handle data and
    information which could be sensitive and critical are not accessible beyond the
    scope of reach.


    #### 2. Maintain an up-to-date security status for eHealth systems, infrastructures,
    and data resources


    Adequate organizational measures should be put in place to ensure that up-to-date
    security status is maintained for eHealth systems and infrastructures at all times
    through periodic upgrades and updates within timeframes that are reasonably short
    to reflect an effective security posture against the existing threat landscape.


    Furthermore, it is important that the eHealth systems and devices that are used
    to process, store, access, and transmit sensitive healthcare information feature
    resident shields and firewalls that prevent them from connecting to or transmitting
    over open access/public/unverified network connections. Email servers should also
    be configured with built-in security software that checks email attachments and
    links to verify their safety. These are imperative for creating layers of logical
    barriers that are necessary to protect sensitive healthcare data and information
    from malicious external actors seeking outbound (exfiltration) or inbound (infiltration)
    access.


    Supported by a generous adoption and systematic deployment of other cybersecurity
    hardware and software utilities, such as end-point anti-malware solutions, intrusion
    detection and prevention solutions on systems and networks, digital alarm/tripwire
    systems, etc., a formidable security status can gradually be pursued for eHealth
    systems and infrastructures.


    #### 3. Partition access to eHealth systems, infrastructures, and data resources
    according various functions, operations, and use cases


    Visitors and clients at healthcare organizations should not ordinarily be able
    to access the same network connections as medical professionals and workers at
    the facility, neither should third-party vendors. Subsets of central systems and
    infrastructures should be created to serve various compartmentalized functions,
    operations, and categories of users. For instance, `VPNs` used for internal communications
    should be kept encrypted, reserved for this purpose, and only accessible to authorized
    entities. When aspects of healthcare operations are outsourced, it also becomes
    necessary to segregate the nature, extent, and involvements of such relationships.

    '
  trans: '


    ## 2. 维护组织环境的完整性


    悬挂的网络（以太网）电缆、未盖板或损坏的接线盒和电线槽、为了连接端端数字/电子设备而运行很长（有时是公共可访问距离）的布线、散落在医疗设施周围无身份标识或无法追踪的数字/电子设备——这些都是许多医疗组织中常见的环境现象，对网络安全具有影响。硬件数据包嗅探器、键盘记录器、信号干扰器/干扰发生器以及网络扩展器/重复器已经通过这些手段成功接入电子健康系统和基础设施，且在很长时间内不被发现。


    因此，当布线必须跨越远距离且不首选无线方案时，线管通道是一个推荐选项。但当这些通道的物理完整性受到破坏时，必须迅速修复。同样，不再使用或不再使用的网络电缆应拆头并停止使用，或者完全拆除。


    此外，对医疗机构拥有和运营的数字/电子设备进行显著标记是一种良好的做法，特别是那些在内部（组织设施内）运行的设备。这使得在医疗设施内发现外来设备时更容易识别。


    ## 3. 采取安全处置的途径和方案


    事实上，不可否认，医疗机构产生的大量电子垃圾可能包含敏感数据和信息，不能随意处置。这包括存储媒体、系统、设备，甚至是非电子的纸质打印文档和刻有字的纸张。因此，当这些材料不再有用或不再被使用时，建立适当的措施和程序进行安全处置是至关重要的。


    对于可回收和不可回收的电子材料，应建立组织措施，以确保它们完全清除其所包含（或曾经包含）的数据和信息，使其变得无法恢复，或至少不易被恢复。同样，非电子材料也应被有效粉碎和/或焚烧。


    ## 电子健康网络安全：逻辑必然性


    ### 2019 年医疗保健焦点报告


    结果导致了持续的威胁局面，许多电子健康系统和设备存在制造商和开发者早已公布的漏洞，但仍活跃在医疗运营中，尽管尚未采取措施确保它们收到了最新的安全补丁和修复。此外，还存在一种潜在的危险情况：中央生产网络/数据库基础设施同时为员工、游客/客户以及医疗机构的第三方供应商和子公司提供服务，且缺乏有效的边界和限制。此外，现实情况是关键生产系统和基础设施被用于各种医疗功能和操作，覆盖范围过广，且缺乏防止外部干扰的充分保护。


    因此，作为有效保障电子健康系统和基础设施的逻辑必然性的一部分，以下要点很重要：


    #### 1. 限制电子健康系统和基础设施的范围和访问权限


    事实证明，如果组织系统和基础设施的访问范围超过了授权使用的覆盖范围，对医疗信息技术网络安全的利益和目标是有害的。例如距离医疗设施数百米外仍可访问的宽范围无线网络、在医疗系统上共享的可通过安全性差的网络访问的文件和文件夹、不具备端到端抗截获和抗篡改能力的远程连接功能，包括能够接收不安全（不可验证）无线网络信号的电子健康系统和设备。


    作为一个基本原则，建议对电子健康和医疗技术背景下出现的所有（敏感）数据和信息进行加密，并仅通过安全通道传输，这既不是夸大也不是疑多疑鬼。此外，应该检查并控制电子健康系统和基础设施的数字覆盖和访问权限。按照规定，确保此类经常处理可能敏感和关键数据信息的系统和基础设施的访问范围不超出许可范围是有关重要的。


    #### 2. 为电子健康系统、基础设施和数据资源维护最新的安全状态


    应采取适当的组织措施，通过在合理短的时间范围内进行定期升级和更新，确保电子健康系统和基础设施始终保持最新的安全状态，以反映针对现有威胁格局的有效安全态势。


    此外，用于处理、存储、访问和传输敏感医疗信息的电子健康系统和设备应具备内置防护罩和防火墙，以防止它们连接到开放/公共/未验证的网络连接或通过这些连接进行传输。邮件服务器还应配置内置安全软件，通过检查邮件附件和链接来验证其安全性。这些对于创建必要的逻辑屏障至关重要，以保护敏感医疗数据和信息免受寻求出站（泄露）或入站（渗透）访问的恶意外部者的侵害。


    在广泛采用和系统部署其他网络安全硬件软件（如终端反恶意软件解决方案、系统和网络入侵检测与防御解决方案、数字警报/陷阱系统等）的支持下，可以逐步实现电子健康系统和基础设施强大的安全状态。


    #### 3. 根据各种功能、操作和用例划分对电子健康系统、基础设施和数据资源的访问


    医疗机构的访客和客户通常不应能够与设施内的医疗专业人员和员工访问相同的网络，第三方供应商也是如此。应该创建中央系统和基础设施的子集，以服务各种隔离的功能、操作和用户类别。例如，用于内部通信的
    `VPNs` 应保持加密，专为此目的保留，并仅供授权实体访问。当医疗运营环节被外包时，也有必要隔离此类关系的性质、程度和参与度。


    '
