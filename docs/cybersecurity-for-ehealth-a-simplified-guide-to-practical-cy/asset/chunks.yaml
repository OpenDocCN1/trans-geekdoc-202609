    \n# 5 保护电子健康系统与基础设施\n\nDOI: [10.1201/9781003254416-5](https://dx.doi.org/10.1201/9781003254416-5)\n\
    \n## 引言\n\n根据《2020 年数据泄露成本报告》\n\n因此，综合考虑收入损失、客户/信任信任丧失、行业声誉的下降以及监管毫不妥协的严厉性，很快就会发现，网络安全事件对医疗机构的影响和意义非小，无法用夸张来形容。医疗机构如果忽视这些关键现实，可能等同于自杀。但在现代医疗实践中，为了稳健地保护电子健康系统和基础设施，需要哪些必要措施？\n\
    \n## 保护电子健康系统与基础设施\n\n安全被定义为“所需的程序和技术措施，以：(a) 防止计算机系统中存储或处理的数据被未经授权的访问、修改、使用和传播，(b)\
    \ 防止任何故意拒绝服务，以及(c) 保护整个系统免受物理伤害”。\n\n因此从直觉上看，电子健康背景下的安全本质上包含了物理、逻辑以及操作三个方面。这些方面中的每一个都对之前在第一章中强调的网络安全四个维度产生影响——基础设施与系统、人员/用户、流程和政策。那么，如何在物理、逻辑和操作上确保电子健康系统和基础设施的安全，且不忽视其多维度的稳健性？（见图\
    \ 5.1\n\n图 5.1 保护电子健康系统与基础设施的必要措施\n\n## 电子健康网络安全：物理必要措施\n\n常见的误解是假设/认为网络安全只有非物理方面和影响。然而，近期在医疗领域看到的几起网络安全事件证明，破坏网络安全的旅程完全可以从物理角度开始。同样，通往医疗网络安全事件强大且长期解决方案的路径，涉及简单修复物理维度上的因果或预设性趋势/现实。以下是可以可靠应用于保护电子健康系统和基础设施的物理必要措施。\n\
    \n1. 限制办公室和工作空间的访问。确保个人工作空间仅供工作在这些空间的医疗和健康专业人员，或医疗机构的其他员工（如果是共享工作空间）访问。允许非员工访问这些工作空间，甚至允许通常不共享这些工作空间的员工不受限制地访问，都会对医疗机构构成隐性的网络安全威胁。\n\
    \n   内部人员可能会访问超出其权限的数据、信息、系统、设备或基础设施设施，而外部人员（即使没有证明其具有恶意）也可能无意中进入一个他们无法充分理解操作和现实中关键高风险性质的空间。此外，医疗和健康专业人员应特别警惕在私人咨询期间让患者独自且无人看管，或在工作期间让其系统和设备处于无人状态，因为网络攻击客也可能是患者。\n\
    \n"
