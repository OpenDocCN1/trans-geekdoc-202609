    Expensive Data Breaches Over Past Year. *IBM News Room*](#ch5.xhtml#R_en5_1).
    [https://newsroom.ibm.com/2020-07-29-IBM-Report-Compromised-Employee-Accounts-Led-to-Most-Expensive-Data-Breaches-Over-Past-Year](https://newsroom.ibm.com)
