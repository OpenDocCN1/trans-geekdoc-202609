- raw: 'Because data are frequently collected for various purposes at virtually every
    stage in the healthcare process when eHealth is applied, it is the responsibility
    of the management and administration of healthcare organizations to establish
    frameworks for keeping these data safe and ensuring that their invariants (Integrity,
    Confidentiality, and Availability) are preserved at all times. To this end, healthcare
    organizations should evaluate the data and information needs that are applicable
    to the various eHealth products and services that they provide, and then establish
    measures to safely acquire, organize/process, store, transmit, and apply such
    data and information. When aspects of these operations are outsourced to vendors,
    affiliates, and subsidiaries, the parent healthcare organizations are equally
    responsible for ensuring that these partnering/affiliate organizations are held
    accountable to the same standards and best practices that they are themselves
    accountable to.


    The manner in which this is done also has implications for the effectiveness of
    the service delivery processes and operations of healthcare organizations, as
    well as how efficiently the organizations’ business model is able to meet the
    goals of investment. It could help healthcare organizations to forestall problems
    of liability that could have an impact on finances; prevent disruptions to operational
    regimens that could carry both reputational and legal consequences; respond effectively
    to regulation, innovation, and other advancements in a dynamic eHealth landscape;
    effectively allocate scarce resources to parallel business interests; and safeguard
    the ethical imperatives that are necessary for building consumer trust in eHealth
    products and services.


    In addition, management and administration have frequently been held liable for
    technical and non-technical (including human) errors that occur in the processes
    and operations of eHealth products and service delivery. Thus, healthcare organizations
    have a role and responsibility in streamlining, scaling, and organizing the processes
    and operations of the eHealth products and services that they deploy in their
    chain – taking into cognizance the applicable environmental, socio-technical,
    and socio-cultural influences – to measure up to the accompanying risk and security
    implications. Sometimes, this may involve gauging their risk appetite, and measuring
    it against their technical and legal capacity, in order to better understand how
    capable they are in preventing eventualities, and how prepared they are to respond
    effectively when such eventualities occur before establishing adequate measures
    and mechanisms to mitigate the business impact of these eventualities.


    Furthermore, management and administration have the added duty of ensuring a seamless
    coordination between the healthcare and medical professionals that use eHealth
    products and services, as well as the eHealth products and services that they
    use, especially when decision support purposes are within the scope of intentions.
    This is important because critical implications for clinical decision support
    that is based on accurate and reliable data and information could be exacerbated
    by disparities in point-of-care medical and healthcare information, arising from
    errors that could be traced to man-made sources or machine defects. This situation
    is able to threaten the business interests of the healthcare organization with
    damning consequences.


    Ultimately, it is the role and responsibility of healthcare managers and administrators
    to provide the leadership, structures, and frameworks, as well as establish the
    principles and processes that are needed to ensure that the utilities that eHealth
    offers for healthcare service delivery within their organizations are preserved
    in a way that is compliant with the requirements of the regulation, aligned with
    those well-known ethical considerations that inspire greater adoption of eHealth,
    and blends the various interests of multi-stakeholder governance.


    For healthcare organizations to succeed in this regard, it is important to prioritize
    Information Technology assets in the business continuity plan. This way, eHealth
    products and services become key considerations for business continuity, so that
    they receive the measure of attention of Management and Administration that is
    needed to preserve their utility for quality healthcare service delivery. Research-driven
    enhancements and improvements would then become possible, so that eHealth products
    and services can continue to develop and advance internally, in ways that could
    positively influence returns on investment.


    ## Compliance versus Security


    It is important to recognize the danger of mistaking compliance with best practices
    and minimum requirements of third-party industry-wide contracts, for the existence
    of effective security across corporate or organizational levels. Whereas several
    regulations and widely recognized industry contracts have helped to specify minimum
    requirements, best practices, and voluntary standards that can be robustly considered
    for effective eHealth deployments, these must never be considered a substitute
    or alternative to the imperative of establishing clear organizational security
    policies and goals and putting in place the necessary technical processes, controls,
    systems, tools, and procedures for safeguarding the critical information and communication
    technology assets of the healthcare organization.


    Unfortunately, it is becoming increasingly commonplace in the global healthcare
    industry to find medical institutions and healthcare organizations that have the
    compliance endorsements of various reputable third-party standards organizations,
    still succumb to cyber incidents and attacks in very embarrassing ways. This has
    often been traced to the absence of robust and effective security frameworks,
    even though compliance with multiple voluntary standards and best practices was
    very obvious.


    Whereas *Compliance* simply represents the extent to which an organization has
    adhered to her contractual or operational obligations to third-party organizations
    (which could be industry standards bodies, regulatory authorities, etc.), *Security*
    entails moving beyond compliance to integrate the necessary technical processes,
    controls, systems, tools, and procedures that are needed to robustly and effectively
    safeguard critical digital electronic assets in alignment with clearly defined
    organizational goals.


    However, in some contexts, compliance and security could often overlap. But even
    then, they do differ in their motives, scope, and goals. For all intents and purposes,
    the compliance requirements and obligations that healthcare organizations have
    to comply with are often blind to what constitutes the organization’s goals and
    operational model, because they are typically geared towards building or sustaining
    public trust in the utilities that an industry has to offer. Thus, these compliance
    requirements and obligations have sometimes been discovered to be ambiguous and
    lacking in specifics. Rightly so, because they are often developed with a focus
    on an industry/industries in general, and not on any organization in particular.


    Therefore, the onus is on medical institutions and healthcare organizations to
    move beyond meeting the duties of compliance to ensuring the imperatives of security
    across the entire information and communication technology assets and infrastructure
    of the organization.


    ## Final Thoughts


    As digital information and communications technologies continue to pervade the
    domain of global healthcare, finding practical application in the modern deployments
    of eHealth for healthcare service delivery, it is important that medical institutions
    and healthcare organizations are aware of, and prepared for the security implications
    and corporate liabilities that come with the adoption and usage of such technologies.'
