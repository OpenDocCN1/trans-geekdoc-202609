    \n# 5 Securing eHealth Systems and Infrastructures\n\nDOI: [10.1201/9781003254416-5](https://dx.doi.org/10.1201/9781003254416-5)\n\
    \n## Introduction\n\nAccording to the *Cost of a Data Breach Report 2020* \n\n\
    So, in considering together the loss of revenue, the loss of customer/client trust,\
    \ the diminishing of Industry reputation, and the uncompromising strictness of\
    \ regulation, it quickly becomes obvious how the impact and implications of cybersecurity\
    \ incidents for healthcare organizations are too non-trivial to hyperbolize. To\
    \ disregard these critical realities by a healthcare organization could, very\
    \ well, be likened to an act of self-immolation. But then, what imperatives are\
    \ necessary for robustly securing eHealth systems and infrastructures in the practice\
    \ of modern healthcare?\n\n## Securing eHealth Systems and Infrastructures\n\n\
    Security has been defined as “the procedural and technical measures required (a)\
    \ to prevent unauthorized access, modification, use, and dissemination of data\
    \ stored or processed in a computer system, (b) to prevent any deliberate denial\
    \ of service, and (c) to protect the system in its entirety from physical harm”\n\
    \nIntuitively, therefore, Security in the context of eHealth essentially incorporates\
    \ physical, logical, as well as operational aspects. Each of these aspects has\
    \ implications for the four dimensions of cybersecurity previously highlighted\
    \ in [Chapter One](#ch1.xhtml) – Infrastructure & Systems, People/Users, Processes,\
    \ and Policies. How then can cybersecurity be ensured for eHealth systems and\
    \ infrastructures, both physically, logically, and operationally, and without\
    \ disregard to the multi-dimensions of robust cybersecurity? ([Figure 5.1](#ch5.xhtml#fig10))\n\
    \n![Figure 5.1 Cybersecurity Imperatives for Securing eHealth Systems and Infrastructures.](images/fig10_B.jpg)\n\
    \n[Figure 5.1 Cybersecurity Imperatives for Securing eHealth Systems and Infrastructures.](#ch5.xhtml#R_fig10)\n\
    \n## Cybersecurity for eHealth: Physical Imperatives\n\nA frequent misconception\
    \ has been to assume/think that cybersecurity has only non-physical aspects and\
    \ implications. However, several cybersecurity incidents that have been witnessed\
    \ in the domain of healthcare in recent times have proven that the journey to\
    \ compromising cybersecurity could well begin from the physical perspective. In\
    \ the same way, as the path towards a formidable and long-term solution to healthcare\
    \ cybersecurity incidents has sometimes involved simply fixing a causative or\
    \ pre-disposing trend/reality in the physical dimension. Here are some physical\
    \ imperatives that can be reliably applied toward securing eHealth systems and\
    \ infrastructures.\n\n1.  Restrict access to offices and workspaces. It is important\
    \ that personal workspaces are only accessible to the healthcare and medical professionals\
    \ who work in these spaces, or other employees of the healthcare organization\
    \ (in case of shared workspaces). Allowing non-employees access to these workspaces,\
    \ or even granting unfettered access to other employees who ordinarily do not\
    \ share these workspaces, poses an insidious cybersecurity threat to healthcare\
    \ organizations.\n\n    Insiders could have access to data, information, systems,\
    \ devices, or infrastructural facilities that are above their privilege levels,\
    \ while outsiders (even without provable malicious intent) might be inadvertently\
    \ allowed into a space wherein they are unable to adequately fathom the critical\
    \ high-risk nature of operations and realities. In addition, medical and healthcare\
    \ professionals should be especially wary of leaving patients alone and unsupervised/unattended\
    \ during private consultations, or leaving their systems and devices unattended\
    \ during working hours, because cybercriminals can be patients too."
