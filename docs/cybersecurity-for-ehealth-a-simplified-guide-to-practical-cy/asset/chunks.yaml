    checks.


    The capacity of malware to orchestrate colossal damage and wreak sheer havoc to
    eHealth services and healthcare operations is quite well established. They are
    able to add false information and markers to patients’ scans and imaging reports
    in order to misinform medical diagnosis and compromise the integrity of healthcare
    services. In addition, they can automatically dump, or siphon sensitive personal
    healthcare-related information in massive volumes; tamper with readings of medical
    monitoring devices; and alter doses in medication delivered through electronic
    infusion pumps & valves. Malware are also able to surreptitiously download other
    malicious components (through a strategy known as drive-by); and give malicious
    external actors a sustained foothold on the digital operations of healthcare facilities.
    Indeed, the menacing impact of malware on the global healthcare sector is a danger
    that is rightly to be dreaded.


    ## Pertaining Infrastructure


    The function of corporate healthcare infrastructure is usually to provide the
    platform for effectively utilizing participating systems and devices to support
    healthcare processes and operations. Therefore, threats and attacks to healthcare
    Infrastructure target the `Data`, and `Information`/`Signals` transmitted over
    them by supported and authorized `Systems` and `Devices`, in order to cripple
    the organizational `Processes` and `Operations` that rely on them.


    These threats and attacks usually adopt methods aimed at reconnaissance and enumeration,
    intercepting digital/electronic communications, and disrupting services. These
    methods include wardriving, DoS, APTs, and MITM. In many cases, by the time healthcare
    Infrastructure comes under threat by malicious actors, the Data and Information
    transmitted across these Infrastructure are already at risk. This also includes
    the Systems and Devices that process, store, and transmit this data and information,
    as well as the organizational `Processes/Operations` that rely on these activities.
    Indeed, at this point, there is already a possibility of compromise to one or
    more of these.


    Wardriving is simply the act of searching for Wi-Fi network connections around
    healthcare facilities from a moving vehicle, and usually with malicious intention.
    Sometimes, this vehicle could be a motor bike, or a bicycle, in which case it
    has often been termed as warbiking and warcycling, respectively. Through this
    method, malicious actors have been able to discover and latch on to open access
    connections that integrate private internal networks. Thereby availing a means
    of dropping malware, spoofing identities on organizational networks, or executing
    smash & grab operations, in order to steal sensitive healthcare data and information
    that could be useful for various malicious purposes.


    In addition, there is the possibility of applying an MITM technique to effectively
    search, intercept, and in some cases, tamper with or re-route digital electronic
    communication. A vast array of tools and techniques have been discovered to feature
    in MITM operations, including bit-flipping, network sniffers & analysers, and
    hidden tunnels in network protocols and services. Furthermore, signal jammers/interference
    generators have also been used to block signals and information that security
    and alarm systems and infrastructure transmit from sensors/detectors to actuators/effectors.


    DoS is a threat-attack approach that works to deny legitimate usage and access
    to services and utilities (healthcare systems, servers, websites, etc.) either
    momentarily or indeterminately. One way of achieving this is by keeping these
    services and utilities engaged in useless and unproductive activities, like processing
    and responding to packets and requests that amount to nothing. There denying legitimate
    user requests access to such services and utilities. However, DoS could also be
    the result of actions and activities by other kinds of malware like ransomware
    and worms, as well as inadvertent human actions like accidentally disabling connections,
    or tripping over network hardware. The general idea being that services and utilities
    are simply unavailable for the purposes of legitimate usage.


    Usually, attackers actively seek ways to scale and amplify the impact of DoS operations,
    and several options are often considered. One of these is to hijack/compromise
    other user machines within the same infrastructure and bring them under a central-controlled
    framework by infecting them with a control malware known as a `bot`; and then
    enlisting them altogether for this malicious operation in a network of bot-infected
    machines known as `botnets`. Another consideration is to steal the digital identities
    of user machines within the targeted infrastructure, and then assign these identities
    to external machines under the attacker’s control, before coordinating them altogether
    for this malicious activity. When a DoS attack enlists distributed support in
    this way, technically, a Distributed Denial of Service (DDoS) has occurred.


    Advanced Persistent Threats (APTs) apply a sophisticated range of stealthy unobtrusive
    techniques to cover their tracks and evade detection over a prolonged period,
    after gaining unauthorized access to healthcare Infrastructure. The robust, high-capacity
    nature of coordination and resources that have been repeatedly discovered to feature
    in APTs have informed the logical deduction that the threat agents/actors that
    apply APTs as a strategy are often nation-state entities, or malicious groups
    that are sponsored by non-state entities. They could target healthcare institutions
    as a leeway for espionage against larger entities of interest.


    The level of coordination that has been seen to feature in APTs reflect their
    ability to robustly incorporate a vast array of strategies, tools, and techniques
    across multiple stages that gradually, but systematically build up towards the
    attack goal or outcome.


    ## Pertaining Processes/Operations


    In the context of healthcare, threats to Processes/Operations aim to disorganize
    and disconcert the security `Resilience`, as well as exploit the security negligence
    of organizational processes and operations that support `Efficiency`. A common
    way of pursing this aim is by subversion/bypass of security protocols and routines,
    usually through naive insider or malicious outsider actions.


    Indeed, within the healthcare sector, the design and establishment of processes
    and operations often aim to preserve efficiency in the organizational business
    model, as well as imbue resilience against shocks and disruptions. However, in
    applying these processes and operations towards strengthening and preserving the
    security status of the healthcare organization, any attempts at subverting or
    bypassing them have always proven inimical to the long-term security goals of
    the organization.


    ## Pertaining Policy


    Within the cybersecurity threat landscape to eHealth, Policies are rarely the
    ultimate target of malicious threat actors. However, these threat actors continue
    to explore the extent of `Robustness` and `Effectiveness` with which policy is
    able to safeguard organizational assets, processes/operations, and interests,
    in a bid to uncover exploitable gaps and insufficiencies that offer a malicious
    advantage.

