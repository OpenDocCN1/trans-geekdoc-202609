    All of these are some lines of defence that might be in place to help inspire
    and support personal cybersecurity efforts in the context of eHealth, either by
    way of complement, or supplement for security resilience and threat prevention.
    Hence, it is important that healthcare professionals are familiar with, and cooperate
    with these lines of defence as part of the process of enhancing their `Intuition
    for Security` in order to engage effectively with the modern realities of the
    cybersecurity threat landscape for eHealth.


    Therefore! Use strong passwords, and change them regularly. Avoid reusing old
    passwords, regardless of how long it has been since the last usage. Quickly install/apply
    security updates soon after they are released. Do not share or reveal personal
    access credentials. Refrain from fiddling with security software and utilities,
    for which the capacity to operate knowledgeably is lacking. Be wary of clicking
    links and bypassing filters to visit web locations or download resources that
    are ordinarily restricted, or possibly flagged as potentially dangerous. Be careful
    when performing sensitive work functions/duties using personal devices. Do not
    write passwords and access credentials on pieces of paper; digital password management
    software offer a safer alternative. These are to mention a few.


    Now, there could be dreadful situations when self-preservation is a consideration
    for personal cybersecurity such as when life and personal safety might be directly
    under threat. Under such circumstances, understanding what lines of defence are
    available to support personal cybersecurity could trigger behavioural responses
    that would, in retrospect, reflect optimal choice for personal cybersecurity,
    in a way that does not endanger personal safety.


    Therefore, towards being able to identify, isolate, and contain threat situations
    to personal cybersecurity in healthcare applications of information technology,
    it is not just enough that healthcare stakeholders know what assets under their
    security stewardship are likely to be exploited by threat actors. They must also
    be able to realize what threat actors might have interest in gaining a foothold
    on these assets, and equally understand what types of tools and techniques threat
    actors are likely to apply in seeking to compromise these assets. Beyond these,
    however, it is important to observe for deviations in performance efficiency,
    in order to be able to circumvent threat situations by immobilizing mediums for
    propagation and amplification. Whereas, all of these rely on a shrewd understanding
    of what lines of defence are in place to support and inspire personal cybersecurity
    efforts.


    ## Escalation and Reporting


    It is a fact that there are certain threats and threat situations to personal
    cybersecurity in the context of healthcare information technologies, for which
    ordinary (technically untrained) stakeholders might be unprepared or unable to
    deal with effectively. Consider, for example, those threat situations that involve
    sovereign-sponsored or sovereign-affiliated threat agents and entities, or even
    actual sovereign entities themselves. Where threat resource capabilities abound
    and often far exceed the best of whatever might be in place to support and inspire
    personal cybersecurity.


    In such situations, it is foolhardy for users to assume that they might be able
    to engage effectively and resiliently with these threat situations. Hence, part
    of the responsibility of personal cybersecurity in eHealth, and indeed the `Intuition
    for Security`, is being able to identify when one is up against a threat actor
    that, by far, out-matches their resource capabilities (e.g. training, and security
    setup), and knowing when and how to escalate and report appropriately.


    Nonetheless, it is indeed crucial to escalate that all suspected, confirmed, successful,
    or unsuccessful threat attempts against personal cybersecurity. It is important
    to report such attempts promptly and adequately to the relevant units/mechanisms
    within the healthcare organization. To disregard this is dangerous, because it
    is seldom the case that threats to personal cybersecurity are lone or random incidents.
    They are often coordinated attempts to compromise the cybersecurity status of
    an organization/enterprise on a large scale. Thus, by reporting such attempts
    promptly and effectively, it becomes possible to activate adequate measures of
    vigilance early enough to forestall imminent large-scale attacks.


    However, the approach to Incident Reporting and Escalation is fundamentally a
    function of what organizational or regulatory structures are in place to manage
    cybersecurity incidents (either as a specific class of incidents or as part of
    a generic incident-handling repertoire). Therefore, the establishment of structures
    and mechanisms for effective incident handling and management is non-negotiable
    for healthcare organizations, especially considering the critical nature of operations
    that characterize healthcare services delivery, and the dimensions of risk to
    human life. Beyond this, it is equally important that `People/Users` are aware
    of procedures specified by organizational incident management mechanisms for incident
    escalation and reporting.


    Nonetheless, the struggle to communicate cybersecurity incidents effectively to
    the appropriate organizational technical support, and security or incident management
    teams is one that is real for both the non-technical users (who often report these
    incidents) and the technical teams who have to respond to these incidents. This
    is many times the result of a disconnection between how well users are able to
    communicate the incidents in the escalation reports, and how understandable and
    useful these reports are to inform timely and effective technical responses. Here
    are a few illustrative questions to help `People/Users` effectively escalate and
    report healthcare incidents.


    1. How would you describe the realities of your personal cybersecurity and user
    experience in the recent period preceding the onset of the incident up until the
    time of reporting? Be sure to state all occurrences of note that you might have
    experienced as an information technology user in the period leading up to the
    time of reporting. These might be notable happenings or occurrences in personal
    engagements, involvements, and interactions for which there was an interface with
    devices, systems, or access credentials.


    2. Are there any noticeable changes or deviations in normal operating behaviours
    and conditions of information technology assets under personal custody? Have these
    events ever occurred before? Ensure that all noticed abnormalities relating to
    the personal use of information technologies are adequately stated. Do not forget
    to state having previously noticed these abnormalities, if that is the case.


    3. What user operations and activities were in progress before the onset of these
    behaviours? Report aptly the operations and activities were ongoing about the
    time the first and subsequent abnormalities in behaviour and operating conditions
    were noticed.


    4. Were there any surrounding circumstances of note that were associated with
    the incident? If there were any associated events, be sure to state these as well.
    These events could have been environmental, functional/operational, or otherwise.


    5. Were any personal (authorized or unauthorized) measures taken prior to the
    time of escalation/reporting, concerning the situation(s) being escalated/reported?
    Be sure to state precisely and transparently what personal measures might have
    been taken previously with regards to the incident being reported, regardless
    of whether such measures were authorized or not. Also, mention what insights might
    have informed these measures.

    '
  trans: '


    这些都是可能在电子健康（eHealth）背景下采取的防御措施，旨在启发和支持个人网络安全工作，或是作为安全韧性和威胁防范的补充或强化。因此，医疗保健专业人员熟悉并与这些防御措施合作至关重要，这应该是增强其`安全直觉（（Intuition
    for Security）`过程的一部分，以便能够有效应对电子健康网络安全威胁格局的现代现实。


    因此！请使用强密码并定期更换。无论距离上次使用已过去多久，请避免重复使用旧密码。在安全更新发布后，尽快安装/应用这些更新。不要共享或泄露个人访问凭据。对于自己缺乏专业操作知识的安全软件和工具，请勿随意摆弄。要警惕点击链接以及绕过过滤器访问通常受限的或可能被标记为潜在危险的网站位置或下载资源。在使用个人设备执行敏感工作功能/职责时要格外小心。不要在纸上写下密码和访问凭据；数字密码管理软件提供了更安全的替代方案。以上仅是部分。


    现在，可能会出现某些自保成为个人网络安全考虑因素的状况，例如生命和人身安全可能直接受到威胁时。在这种情况下，了解可以使用哪些防御措施来支持个人网络安全，可能会触发行为反应，这些反应在回溯时，可以在不危及人身安全的情况下反映出个人网络安全的最佳选择。


    因此，为了能够识别、隔离和遏制医疗信息技术应用中针对个人网络安全的威胁状况，仅仅让医疗保健利益相关者知道其受安全管理的哪些资产可能被威胁攻击者利用是不够的。他们还必须意识到威胁攻击者可能对在这些资产上获得脚点感兴趣，并同样理解威胁攻击者在寻求破坏这些资产时可能应用哪些类型的工具和技术。此外，观察性能效率的偏差也至关重要，以便通过阻止传播和放大的媒介来规避威胁状况。然而，这一切都依赖于对支持和启发个人网络安全工作的防御措施的敏锐理解。


    ## 上报与报告


    事实是，在医疗信息技术背景下，存在某些针对个人网络安全的威胁和威胁状况，普通的（未经技术培训的）利益相关者可能没有做好准备或无法有效应对。例如，考虑那些涉及国家资助或与国家关联的威胁代理和实体，甚至是真正的国家实体本身的威胁状况。在这些情况下，威胁资源极其丰富，且往往远超任何可能用于支持和启发个人网络安全的现有措施。


    在这些情况下，用户假设自己能够有效且有韧性地应对这些威胁状况是愚蠢的。因此，电子健康个人网络安全的责任之一，实际上也是`安全直觉`的一部分，在于能够识别自己何时正面临一个在资源能力上目前远超自身能力（例如：培训和安全配置）的威胁攻击者，并知道何时以及如何进行适当的升级处理和报告。


    尽管如此，上报所有疑似的、确认的、成功的或未成功的针对个人网络安全的尝试确实至关重要。及时、充分地向医疗机构内部的相关部门/机制报告此类尝试非常重要。忽视这一点是危险的，因为个人网络安全威胁很少是孤立或随机事件。它们通常是旨在大规模破坏组织/企业网络安全状态的协调性尝试。因此，通过及时有效地报告此类尝试，就可能及早启动足够的警惕措施，以阻止迫在眉睫的大规模攻击。


    然而，事件报告和升级处理的方法从根本上取决于建立了何种组织或监管结构来管理网络安全事件（无论是作为特定类别的事件还是作为通用事件处理方案的一部分）。因此，建立有效的事件处理和管理结构及机制对于医疗机构而言是不可逾越的，特别是考虑到医疗服务交付运营的关键性质以及对人类生命的风险维度。此外，用户了解组织规定的事件管理升级和报告程序同样重要。


    尽管如此，如何向技术支持或事件管理团队有效沟通网络安全事件，对于非技术用户（通常是报告者）和必须响应的技术团队来说都是一个现实问题。这通常源于用户沟通事件的能力与这些报告对及时有效响应的参考价值之间的脱节。以下是一些旨在帮助用户有效升级和报告医疗事件的说明性问题。


    1. 你如何描述在发生到报告之前这段时期，你的个人网络安全状况和体验？请务必说明在事件发生到报告这段期间，你可能经历的所有关注事项。这些可能可能是个人在与设备、系统或访问凭据进行交互时的重要活动或遭遇。


    2. 你所管理的设备资产的正常行为和状态是否存在任何变化或偏差？这些情况以前出现过吗？确保充分陈述与个人使用信息技术有关的所有异常情况。如果是如此，请不要忘记说明此前已注意到这些异常。


    3. 在这些行为发生之前，正在进行哪些用户操作和活动？请准确报告注意到首次及后续行为和状态异常时正在进行的操作和活动。


    4. 与事件相关的，是否有任何值得注意的环境因素？如果有关联事件，请务必也说明这些事件。


    5. 在升级/报告之前，针对所升级/报告的情况采取过任何个人措施（无论授权或未经授权）？请务必准确且透明地说明在报告的事件之前可能采取的所有个人措施，无论这些措施是否获得授权。


    '
