    # 引言


    在新的司法管辖区建立客户群、设立分支机构或子公司、引入新的供应商/供应商/关联公司、提供新的医疗服务、招聘员工、工作安排的转变——这些都是医疗机构可能开展的活动，它们将在现有的电子健康（eHealth）部署周围开启新的生态系统。


    在这些新的生态系统中，意识到新产生的数据访问点、现有数字基础设施（网络与系统）的扩展、收购/集成的数字参与者和资产（数据、系统、用户），以及这些新生态系统可能带来的监管影响至关重要。必须妥善枚举这些新情况，并作为监测与评估计划及工作的考虑因素，特别是为了避免在电子健康系统和基础设施周围维持冗余的生态系统，因为这些系统可能会为恶意攻击者提供阻力最小的入侵点。


    因此，员工入职时创建的访问凭据，在员工停止在医疗机构工作时必须被禁用并存档。当用户在不同的电子健康服务之间切换时，应禁用其对之前服务的访问权限。应迅速关闭前供应商和关联公司的网络及数据访问点。当居家办公安排发生变化时，应相应地审查对某些电子健康资源和工具的远程配置与访问。当医疗专业人员更换工作单位时，应回收属于医疗机构的数字设备和存储媒体。


    整体而言，本章强调的这几点提供了一个渐进式的模板，可以稳健地应用于现代医疗实践中电子健康系统和基础设施的网络安全防护。


    ## 注释


    1. IBM (2020, 7 月 29 日). IBM 报告：员工账户受损导致过去一年最昂贵的数据泄露。*IBM 新闻室*。 [`newsroom.ibm.com/2020-07-29-IBM-Report-Compromised-Employee-Accounts-Led-to-Most-Expensive-Data-Breaches-Over-Past-Year`](https://newsroom.ibm.com)
    (参考 [`www.ibm.com/security/digital-assets/cost-data-breach-report/#/`](https://www.ibm.com))。


    2. Ponemon Institute (2016, 5 月). *医疗数据隐私与安全第六年度基准研究*。研究报告。[`www.ponemon.org/local/upload/file/Sixth%20Annual%20Patient%20Privacy%20%26%20Data%20Security%20Report%20FINAL%206.pdf`](https://www.ponemon.org)


    3. Experian (2012, 1 月 27 日). *Ponemon Institute 研究：数据泄露对声誉的影响*。[`www.databreachtoday.com/whitepapers/ponemon-institute-study-reputation-impact-data-breach-w-540`](https://www.databreachtoday.com)


    4. Turn, R., & Ware, W. H. (1976). 信息系统中的隐私与安全问题。*RAND 论文集*。Santa Monica, CA:
    The RAND Corporation。


    5. Vectra AI (2019). *报告：医疗保健领域的攻击面*。[`www.vectra.ai/`](https://www.vectra.ai/)


    6. 澳大利亚网络安全中心 (ACSC) (2012). *漏洞评估与补丁应用*。[`www.cyber.gov.au/view-content/assessing-vulnerabilities-applying-patches`](https://www.cyber.gov.au)


    7. 欧盟网络和信息安全局 (ENISA) (2020). *COVID-19 期间医疗部门的网络安全*。[`www.enisa.europa.eu/news/cybersecurity-in-healthcare-sector-during-covid-19`](https://www.enisa.europa.eu)


