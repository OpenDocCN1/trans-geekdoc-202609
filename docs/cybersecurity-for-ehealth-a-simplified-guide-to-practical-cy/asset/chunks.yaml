- raw: 'Exactly nine days later, a team of experts from Canada’s Data Privacy Regulator
    visit the healthcare facility where Adeola works at, to investigate “suspicious
    activity” involving patients’ electronic health records. At first, the discovery
    of the incident emerged following anomalous behaviours detected on the Facility’s
    networks from eight days before – since the day after Adeola experienced difficulty
    logging onto her physician’s dashboard on the mHealth application.


    The incident had compromised the healthcare data of 11,000 of Adeola’s patients;
    4,000 out of these had had their electronic health records significantly altered
    across three different healthcare services provided by *Psyche-I-Track*. Investigations
    revealed that Adeola’s current access credentials had activated the point of compromise
    that gave malicious external actors an access to the Facility’s Infrastructure.


    This hypothetical incident provides a pinhole perspective into what has remained
    the modern struggle of cybersecurity in eHealth – the persistent disconnect between
    the ability of technology to safeguard itself (effectively and efficiently), and
    the capacity of human elements to cooperate fully with the security and safety
    operations of healthcare information and communication technologies. This being
    a manifestation of the fact that security, with its associated protocols and routines,
    hardly coalesces well with usability and user convenience. Ultimately, this perpetuates
    a nagging fear of “who’s next, and what’s next?” amongst stakeholders in the global
    healthcare sector – a cloud of uncertainties that has continually shrouded the
    full potentials of the sector. Which way then? How do we find the balance?


    ## Personal Cybersecurity for eHealth Deployments


    Several independent reports (including a 2019 Data Breach Investigations Report
    \[DBIR\] by American telecommunications giant, Verizon


    A range of factors and lapses in personal cybersecurity have been identified as
    having aided this reality of rife healthcare cybersecurity incidents, including


    1.  stolen access credentials;


    2.  weak or unchanged default passwords;


    3.  tampering with firewall & anti-malware configuration;


    4.  sharing user credentials (usernames and passwords);


    5.  altering automatic device and system update settings;


    6.  uploading wrong or infected files;


    7.  accessing websites that are unauthorized, insecure, or unsafe;


    8.  bypassing firewall restrictions for various personal, but naive reasons;


    9.  transmitting sensitive information over insecure/unverified channels;


    10.  installing untrusted third-party applications;


    11.  misusing access privileges;


    12.  misplaced or shared access to personal/corporate devices and systems;


    13.  mis-delivering sensitive information to unintended recipients;


    14.  abuse of access privileges;


    15.  failing to apply/install updates and patches;


    16.  clicking links in spam email;


    17.  failing to promptly identify, and report/escalate threat situations;


    18.  inappropriately disposing of files and media containing sensitive information;


    19.  misplaced storage media; and


    20.  general unawareness regarding best practices for personal cybersecurity,
    to mention a few.


    These are insidious conditions that have proven the bane of personal cybersecurity
    in the context of healthcare information and communication technologies, the vast
    majority of which have users/people at the centre of operations.


    When you add to these the fact that people/users are often the most vulnerable,
    most targeted, and most negligent in the high-value eHealth cybersecurity chain,
    then it probably becomes easier to understand why personal cybersecurity is a
    non-negotiable for eHealth deployments.


    How then can personal cybersecurity be conceptualized and practised in a way that
    is robust, resilient, and able to meet the contemporary demands and realities
    of cybersecurity in healthcare?


    The answer lies in an understanding of what I would refer to as “*the Intuition
    for Security*”.


    ## The Intuition for Security


    Three characteristics help to describe and define the Intuition for Security.
    They are *Instinct*, *Knowledge*, and *Behaviour*.


    **Instinct** is the characteristic of rational disposition that catalyses (sometimes
    subconsciously) a responsiveness to security conditions based on promptings that
    may be either notional, actual, or experiential.


    **Knowledge** pertains to the capacity for cognizance and discernment, possibly
    acquired through repeated engagement/association, training/practice, and/or experience.


    **Behaviour** is the characteristic of manifested action(s) that is/are reflective
    of optimal choice, even in the face of several and usually varied alternative
    courses of action, which are relatively suboptimal (at least when considered from
    a security perspective) ([Figure 3.1](#ch3.xhtml#fig8)).


    ![Figure 3.1 The Intuition for Security.](images/fig8_B.jpg)


    [Figure 3.1 The Intuition for Security.](#ch3.xhtml#R_fig8)


    These three characteristics help to conceptualize the foundations of personal
    cybersecurity, especially because, in the practice of personal cybersecurity,
    Knowledge sharpens Instinct, and both coalesce to guide and inform security Behaviour.


    In a most basic sense, it is Instinct that would make a healthcare professional
    refuse to hand over a work mobile device to a stranger who seems stranded and
    needs to make an urgent contact. Instead, such individual would rather direct
    the stranger to a nearby public pay phone service that could be used for the same
    purpose; or hand the individual some change to use the public pay phone (where
    financial capability is a consideration); or outrightly refuse to offer any assistance.
    Even though as an alternative, they could also have handed over a personal mobile
    device to the stranger for the same purpose, instead.


    However, this instinctive behavioural response probably originated from a knowledge
    of the fact that by dialling a simple USSD code or sending a command by SMS, a
    spyware or some other malware could be remotely transloaded onto the device. It
    is also possible to compromise some other aspects of the device’s security status
    this way. Other events that have been part of the training or experience of the
    healthcare professional could also catalyse such instinctive behaviour.


    Similarly, it is also Instinct that would make a security guard at the entrance
    to the headquarters building of a large (probably multi-national) healthcare organization
    to ask aside someone who identifies as an employee, but then is unable to gain
    access to the building because their access card is being rejected by the security
    system. While putting a call through to the security support unit to request that
    a staff member of the unit comes to evaluate the situation at the entrance. Whereas,
    he is also able to manually override the security system and grant access to the
    individual by bypassing the regular security validation protocol, before directing
    them to the security support unit several floors above, to lodge a complaint.


    However, it is possible that this instinctive behavioural response is catalysed
    by a previous experience at a regional branch of the organization that saw a stranger
    gain access to the building without passing the security validation protocol.
    Before going on to break into the server room two floors above; and, upon detection,
    was already in the process of copying data from the corporate servers.'
