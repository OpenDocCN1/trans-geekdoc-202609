    \ and assets against threats, malicious actors, and attacks. \n\n**Data Breach:**\n\
    \n: A cyber incident that intentionally or unwittingly results in the compromise\
    \ of security, leading to unauthorized access, disclosure, or theft of information\
    \ that is considered valuable and confidential, and should be otherwise secured.\
    \ \n\n**Data Element:**\n\n: The atomicity of data that is defined in semantics\
