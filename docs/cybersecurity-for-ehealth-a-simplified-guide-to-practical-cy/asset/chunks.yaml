    # 3 Personal Cybersecurity for eHealth Deployments


    DOI: [10.1201/9781003254416-3](https://dx.doi.org/10.1201/9781003254416-3)


    ## Introduction


    Adeola is a practising neuro-psychiatric physician at a healthcare facility in
    Canada. She uses `Psyche-I-Track` – a mobile mHealth application – to track and
    document the mental health progress of her outpatients. These patients are also
    able to connect to a patient section of the mobile application to report the status
    of their mental health at certain times of the day, primarily by completing an
    electronic form/questionnaire. They could alternatively have a caregiver or relative
    do this for them at the scheduled time, when a video-based assessment is not required.


    On a workday like any other, for some inexplicable reason, Adeola was suddenly
    unable to log onto the physician’s dashboard of `Psyche-I-Track`. With every attempt
    to log onto the application, she receives what was apparently an automated firewall
    response in her official email address. It was a notification communicating her
    having been shut out of the system, and presented with the option of changing
    her user password in order to regain access.


    Adeola quickly changed her password and logged onto the system in time to meet
    the scheduled evaluation of her next patient. However, the new password was not
    very different from the previous one. Actually, both passwords only differed by
    the addition of a single character in the new password, which was not difficult
    to anticipate.

