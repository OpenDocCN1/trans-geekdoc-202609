- raw: "6.  Were there any previous attempts to escalate/report such events and occurrences?\n\
    \n    In case previous attempts have been made at escalating or reporting such\
    \ events and abnormalities, either formally (through existing organizational channels)\
    \ or informally, be sure to mention such as well, also ensuring to state what\
    \ were the outcomes or directives that emanated from such attempts, if any.\n\n\
    7.  Do you have any current suspicions and opinions about the incident under reporting?\
    \ What might have informed these suspicions/opinions?\n\n    It is okay to have\
    \ personal suspicions and opinions regarding the incident under reporting. After\
    \ all, you were arguably a point of initial contact for that incident. Hence,\
    \ state these suspicions clearly and unequivocally; and do not forget to mention\
    \ what might have informed these suspicions.\n\nIt is probably a good idea to\
    \ have ready answers to these questions in oral reports of cybersecurity incidents.\
    \ Even with written incident reports, it is equally important to ensure to provide\
