- raw: "In the same way, it is Instinct that would make a medical professional outrightly\
    \ refuse to lend a removable storage device used to transfer sensitive patient\
    \ records between hospital systems, to a close friend or relative who needs to\
    \ transfer data for printout outside the facility. Instead, would rather hand\
    \ over a personal removable device that does not connect to hospital systems,\
    \ even though the medical professional could have chosen to move out all sensitive\
    \ patient data from the work removable device, and then scan the device for malware\
    \ upon return.\n\nWhereas, this instinctive response might be based on a knowledge\
    \ of the fact that the work removable device could be recovered of its sensitive\
    \ data using simple data recovery software tools. There is also the possibility\
    \ of lacing the device with a novel malware that might go undetected by an anti-malware\
    \ scan, or swapping (either intentionally, or accidentally) for an identical replica\
    \ embedded with autorun rootkits.\n\nTherefore, it becomes possible to assess\
    \ the Intuition for Security, through randomized tests structured to systematically\
    \ simulate actual threat situations, and then analysing the behavioural choices\
    \ and responses of the targeted individuals under these test conditions. This\
    \ would provide useful insights for evaluating the security status of a healthcare\
    \ organization from the perspective of people/users.\n\nThe ability to effectively\
    \ identify, avoid, isolate, and contain threat agents and threat situations –\
    \ that is the basic quality of the *Intuition for Security*.\n\n## Threat Situations:\
    \ Identification, Isolation, and Containment\n\n[Chapter Two](#ch2.xhtml) has\
    \ dealt quite extensively with the various threat agents that could feature in\
    \ the context of eHealth and healthcare, the operational mechanisms that they\
    \ have been known to apply, as well as the various threat-attack situations that\
    \ could be manifested when eHealth deployments are targeted at various levels.\n\
    \nHowever, the bigger challenge to personal cybersecurity in the context of healthcare\
    \ and eHealth is how to identify and isolate them, so as to contain their operations\
    \ effectively, at least at the personal level (where they are wont to target at\
    \ first), before escalating and reporting accordingly. Indeed, within the context\
    \ of information and communication technologies, it is virtually impossible to\
    \ avoid or prevent cybersecurity threat situations entirely. Nevertheless, whether\
    \ or not they would successfully result in an actual security violation depends,\
    \ and largely, on being able to effectively identify, isolate, and contain threats\
    \ and threat agents to cybersecurity from the personal (user-facing) levels of\
    \ healthcare information technologies.\n\nAn understanding of these six principles/guidelines\
    \ would prove useful, without regard for any particular order ([Figure 3.2](#ch3.xhtml#fig9))\n\
    \n![Figure 3.2 Six Principles/Guidelines for Personal Cybersecurity in eHealth.](images/fig9_B.jpg)\n\
    \n[Figure 3.2 Six Principles/Guidelines for Personal Cybersecurity in eHealth.](#ch3.xhtml#R_fig9)\n\
    \n1.  Know what assets, over which one has personal or shared responsibility for\
    \ securing/safeguarding, are likely to be targets and exploited by threat actors.\
    \ What are the (potential) implications of success for such exploit attempts?\
    \ That is, what is the security capital of such assets?\n\n    The duties and\
    \ responsibilities of healthcare stakeholders often necessitate that they assume\
    \ security custody and stewardship over devices & systems, authentication & access\
    \ credentials, and physical access control to private workspaces. All of which\
    \ are useful for the various functions of their job roles. In reality, this custody\
    \ and stewardship extend beyond the physical confines and dimensions of the healthcare\
    \ organization and facility where these stakeholders operate.\n\n    It is imperative\
    \ to the Intuition for Security that these healthcare players understand the various\
    \ exploit possibilities against these assets over which they have custody and\
    \ stewardship. They must also be aware of what success in these exploit attempts\
    \ could portend for the security status of the healthcare organization – in terms\
    \ of the security capital that accrues to these various assets with respect to\
    \ the security status of the organization.\n\n    For instance, these could include\
    \ user credentials for authentication and access, which hold administrative or\
    \ similar-level privileges; and medical devices that store and transmit contact\
    \ or healthcare information about patients/clients. It could also include removable\
    \ drives used for transferring data and information, personal systems and devices\
    \ that feature in organizational operations as part of existing Bring Your Own\
    \ Device (BYOD) arrangements, as well as corporate systems that collect, process,\
    \ and store data about business operations. These assets are among the prime targets\
    \ in healthcare threat situations that feature malicious intent; thus, they accrue\
    \ much capital with respect to the security status of the organization.\n\n2.\
    \  Realize what kinds of threat actors are likely to have interest(s) in these\
    \ assets.\n\n    > If you know the enemy and you know yourself, you need not fear\
    \ the result of a hundred battles. If you know yourself but not the enemy, for\
    \ every victory gained you will also suffer a defeat. If you know neither the\
    \ enemy nor yourself, you will succumb in every battle.\n\n    > \n\n    > – Sun\
    \ Tzu, “*The Art of War*”\n\n    When healthcare stakeholders keep custody or\
    \ stewardship of organizational assets, it is crucial to the responsibility of\
    \ personal cybersecurity that they are cognizant of not just the value of the\
    \ assets entrusted to them, but also the kinds of entities that might be interested\
    \ in laying hold on such assets, especially with malicious intentions.\n\n   \
    \ This is a critical principle for effective personal cybersecurity. One that\
    \ keeps before healthcare stakeholders the realities about the nature of actors\
    \ that they are likely to be going up against, as well as what security resources\
    \ and capabilities are available to defend against these actors effectively. This\
    \ way, they are better able to gauge and calibrate their Intuition for Security\
    \ to align with the status and realities of the threat domain they might be entering\
    \ into by being responsible for securing these assets at the personal level.\n\
    \n    For example, a healthcare professional employed at a facility domiciled\
    \ inside a military or government agency must be cognizant of the fact that even\
    \ sovereign-affiliated or sovereign-sponsored threat actors might seek to lay\
    \ a hold on their access credentials and tokens. This could either be useful for\
    \ accessing secure locations, or secure healthcare systems that might be housing\
    \ electronic health records of senior government or military officials.\n\n3.\
    \  Understand what types of tools and techniques threat actors might apply in\
    \ seeking to compromise personal cybersecurity, in order to gain control over\
    \ assets. Threat actors usually deploy a wide range of tools and techniques when\
    \ they seek to compromise personal cybersecurity as a pathway to valuable assets.\n\
    \n    The type of tool or technique deployed usually aligns with the goal or objective\
    \ that the threat actor seeks to achieve on the journey to the desired outcome.\
    \ After knowing what assets of personal cybersecurity stewardship are likely targets\
    \ for threat actors, the next step is being able to understand the tools and techniques\
    \ that threat approaches and strategies aiming for these assets might incorporate.\n\
    \n    For instance, a user being able to understand that a social engineering\
    \ strategy might incorporate a phishing or vishing technique in an attempt to\
    \ con users into divulging personal access credentials, or sensitive corporate\
    \ information, has an Intuition for Security that makes her better able to discern\
    \ imminent vishing threat situations."
