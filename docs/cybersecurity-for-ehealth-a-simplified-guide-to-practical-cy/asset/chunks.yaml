  trans: '

    电子健康（eHealth）是一个术语，在过去的十年里，它在医学和公共卫生领域日益受到关注。世界卫生组织将电子健康广义地定义为“用于健康的信息和通信技术（ICT）”——这是一个非常简单且直接的定义，但它涉及到多个层面的交互和支持技术的汇聚，以增强获得优质医疗服务的途径，并以可负担的成本支持服务的交付。


    多年年来，电子健康被认为涉及各种信息和通信技术（ICT）的部署（包括移动电话、人工智能、语音识别、语音翻译、视频会议、有线和无线通信、数字传感与成像、计算分析、生物信息学/生物医学信息学），并在电子设备的支撑下用于医疗保健领域的各种应用。然而，如图
    1.2 所示，根据特定的用途、功能和能力，这些应用具有不同的命名方式。


    ![图 1.2 电子健康概览](img/fig2_B.jpg)


    图 1.2 电子健康概览


    ### 电子健康应用类型


    例如，`mHealth`或`移动健康`将移动技术的便携性与无线电信的无处不在相结合，用于提供医疗保健服务。这可以用于培训、意识和信息传播、紧急报告、数据收集或定位医疗机构。


    同样，`TeleHealth`（远程健康）是在无法进行物理服务交付时，利用电子 ICT 技术通过通信信道提供远程的临床和非临床医疗保健服务。


    一方面，它适用于临床目的，如医学诊断、患者监测、物理治疗、院外手术、咨询（医疗专业人员与患者之间，以及医疗专业人员之间）、医疗提醒与随访以及治疗处方。另一方面，它也适用于非临床目的，如继续医学教育和健康管理。然而，当`TeleHealth`
    特别关注临床医疗保健服务时，它通常被称为`TeleMedicine`（远程医疗）。


    同样，`Digital Health`（数字健康）或`digiHealth`利用数字化（或数字信息技术）的力量来提高医疗服务交付的精确性和个性化。从本质上，它寻求连接跨多个领域的数据驱动技术、能力和技能，以提高医疗交付的效率以及人类群的整体健康和福祉。DigiHealth
    已广泛应用于临床决策支持，以及辅助和康复目的。


    近期，各种系统和设备出现在电子健康的背景和操作中。它们包括医院信息系统（HIS）、手机、电脑、平板电脑、基于传感的可穿戴设备（手表、眼镜、耳机等）、数据驱动支持系统（DSS）、基于
    RFID 的植入物、数字扫描仪、个人助理（PDAs）以及各种监测设备，这些是其中的一部分。

