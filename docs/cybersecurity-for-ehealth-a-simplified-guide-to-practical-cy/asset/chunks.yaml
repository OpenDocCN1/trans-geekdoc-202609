    To **Lyndar** and **Patra**, for bearing with the many weeks that I remained distracted
    from Family realities, while trying to focus on writing.


    # Preface


    The modern realities of cybersecurity have uncovered the unpreparedness of many
    sectors and industries to deal with emerging trends. One of these sectors is the
    healthcare industry, a sector wherein the pervasiveness and proliferation of various
    eHealth innovations, systems, and applications in global healthcare, powered by
    modern information and communications technologies, have created a threat domain
    wherein policy and regulation struggle to keep pace with development, standardization
    faces several contextual challenges, and technical capacity is largely deficient.
    The spates of high-profile cyber incidents that have continued to unsettle the
    global healthcare sector suggest that this level of unpreparedness tends to have
    pervaded the entire apparatus, ranks, and file of healthcare organizations, even
    though the impact of such incidents, when measured by acceptable financial and
    reputational indices, have continued to remain calamitous.


    As the rubber meets the road, it becomes necessary to synthesize the most-relevant
    and rudimentary knowledge pertaining to the realities of global cybersecurity
    as it relates to the healthcare sector and to present this knowledge in a form
    adapted to the technical incapacities of the stakeholders that work in the global
    healthcare industry. More so, a number of existing resources in this domain have
    been criticised for being either too technical in their content to be a useful
    and informative resource for non-technical healthcare stakeholders, or being too
    theoretical in its scope to present relevance for engaging with the practical
    realities of cybersecurity in the healthcare sector.


    Thus, in this book, I have attempted to blend the integrity of the scientific
    approach to evidence-based discussions that define the academic character, with
    the quality of attention to detail and critical appraisal that distinguishes the
    native approach of the industry professional. It distills the most foundational
    information, and presents it in a compact manner that can be easily assimilated.
    This is achieved by drawing lessons from real-life case studies across the global
    healthcare industry to drive home otherwise complex principles and insights; especially
    for healthcare stakeholders without formal technical training in the workings
    of healthcare information and communication technologies. At the same time, it
    tries not to trivialize the critical discourse that is Cybersecurity, and the
    crucial implications that it portends for eHealth.


    By excluding the hard-core technical stuff, I have managed to consolidate the
    more critical panels of focus, as a quick primer to enable non-technical healthcare
    stakeholders (*viz.*, medical professionals, healthcare workers, regulatory and
    compliance agencies, health centre managers, administrators & insurers, clients/patients,
    and third-party vendors) understand and deal more knowledgeably and effectively
    with the realities of cybersecurity for eHealth.


    In summary, this book presents the basics of cybersecurity and an overview of
    eHealth, covering the foundational concepts, perspectives, and applications of
    cybersecurity in the context of eHealth. It goes on to present an in-depth traverse
    of the cybersecurity threat landscape to eHealth, discussing threat categories,
    threat agents, threat objectives, strategies and approaches featured by various
    threat agents, predisposing risk factors in cybersecurity threat situations, as
    well as the various tools/techniques that are deployed in cybersecurity incidents
    against eHealth. Further, it discusses approaches and best practices for enhancing
    personal cybersecurity as custodians of eHealth systems, services, and infrastructures
    – including an approach to progressively developing and sharpening an intuition
    for cybersecurity.


    In addition, this book also presents the foundational principles of data and information
    security for eHealth deployments, covering the invariants of preserving integrity,
    safeguarding privacy, ensuring confidentiality, and guaranteeing availability.
    It then goes on to discuss physical, logical, and operational imperatives for
    securing eHealth systems and infrastructures, while also ensuring compliance through
    various monitoring and evaluation procedures and approaches in real-life ecosystems
    of eHealth deployments.


    Finally, this book presents some thoughts on governance, ethics, and regulation
    in eHealth, highlighting notable international legislations that help to provide
    the necessary context for understanding the goals and challenges of regulation,
    as well as the roles and responsibilities of management/administration, and the
    relationship between compliance and security. It closes with an extensive glossary
    of definitions for key terms and words that feature within the book, as have been
    adjudged to be necessary to help boost a deeper understanding of the context and
    usage of these words for readers who do not have a technical background in Information
    Technology.


    So, here! I present to you: *Cybersecurity for eHealth*.


    **– Emmanuel C. Ogu**


    # Acknowledgement


    I acknowledge the many healthcare stakeholders and professionals who have participated
    in my training and consultancy events over the past few years. Engaging and interacting
    with you provided much of the insight and context that helped inform the discussions
    within this book. I am grateful for the opportunity to learn from your various
    experiences across the global healthcare industry.


    I also acknowledge my friend Yushavia and the remarkable team at Trishula Pathways
    and the African Healthcare Portal (AHP), whose push, partnership, and collaboration
    in the midst of a global lockdown occasioned by a rampaging pandemic, helped inspire
    the needed urgency that drove the development process of this book to completion
    within the shortest possible time.


    Finally, I acknowledge the editorial leadership of John and the editorial support
    of Stephanie, both of whom helped make the publication process an all-around enjoyable
    experience.


    Thank you!


    **– Emmanuel C. Ogu**


