- raw: 'Its utility exists in being able to provide the level of assurance that engenders
    the wider adoption of eHealth within and across jurisdictions, by preserving trust,
    transparency, and accountability for all stakeholders in the healthcare services
    chain. The stakeholders in this regard being (a) patients (who could be citizens
    or non-citizens), (b) healthcare professionals who provide medical and non-medical
    services, (c) regulators, funders/investors, and administrators, (d) insurers
    and vendors.


    Thus, discussions around the Regulation of eHealth centre on (1) the safeguarding
    of personal healthcare and medical information from such collection, storage,
    or processing that is not/no longer consented to – that is, *Data Sovereignty
    & Privacy*, (2) protecting sensitive healthcare data and medical information from
    unauthorized disclosure/exposure, alteration/corruption, and unavailability/loss
    – that is, *Data Protection*, (3) preventing unfair and indignifying practices
    against stakeholders in the provisioning, sales, processes, and operations of
    eHealth products and services by justly specifying liabilities, rights, and responsibilities
    – that is, *Consumer Protection* (or *Provider/Manufacturer Liability*), and (4)
    enforcing standards to spotlight and prevent anti-competitive conducts and operations
    amongst stakeholders in eHealth services – that is, *Fair Competition*.


    But then, what are the fundamental goals that drive and sustain the utility of
    regulation in the context of eHealth? An understanding of these goals, and the
    challenges that are frequently encountered in the pursuit of these goals, is crucial
    to fathoming the responsibilities of management and administration that are attributable
    to healthcare organizations with regards to eHealth.


    ## Understanding the Goals and Challenges of Regulation


    One factor that presents a fundamental consideration for the regulation of eHealth
    is the fact that eHealth challenges and trumps traditional models of healthcare
    service delivery whereas, traditional healthcare service delivery is characterized
    by physical presence at points of service that are predetermined, with a progression
    through the system of service delivery that is quite direct and well-defined.
    eHealth adopts a more dynamic and unconstrained path for various modes/levels
    of healthcare service delivery (primary, secondary, tertiary, and quaternary),
    which is not otherwise limited by physical boundaries.


    Within this context, the goal of regulation is to clarify the nature, establish
    the extent, and safeguard the integrity of interactions that take place wherever
    eHealth is applied in the delivery of healthcare services. Such interactions could
    be (a) between patients seeking healthcare/medical services and the practitioners
    who render such services, (b) amongst healthcare practitioners in the duty of
    rendering healthcare/medical services, (c) between healthcare practitioners and
    their employing healthcare institutions in various occupational and professional
    capacities, (d) amongst healthcare institutions in various operations that could
    characterize their modes of service delivery, and (e) between healthcare institutions
    and third-party affiliates providing outsourced/subsidiary services to support
    healthcare operations. Therefore, the regulation of healthcare information technologies
    also seeks to attribute the liabilities that must be accepted by the various healthcare
    stakeholders that feature in such interactions.


    eHealth brings in several uncertainties to the business of healthcare service
    delivery, which regulation sometimes struggles to keep pace with. On the one hand,
    there is the duty of safeguarding ethical imperatives for healthcare subjects
    in a context where remote capabilities impose a capacity for anonymity, and expose
    service delivery channels and resources to a global scope of external interference
    that could be maliciously intended. Thus, creating a challenge for fairly attributing
    culpability for contravention in the absence of a globally acceptable/trans-jurisdictional
    legal framework, and sometimes also complicating the scope of healthcare regulation
    by dragging it across other domains like consumer protection, legal liability,
    and civil rights.


    Then, on the other hand, there is the duty of monitoring the practices and operations
    of various stakeholders in the healthcare industry, to ensure that certain players
    (either through dominance that is created by ordinary market forces, or by way
    of consolidating interests and assets through mergers and acquisitions) do not
    exercise an outsized influence over the industry, which could ultimately endanger
    the interests of other stakeholders. Thereby, creating a situation wherein healthcare
    regulation has to grapple with certain intricacies of economics, market capitalization,
    competition law, and corporate governance.


    Indeed, a number of such complexities have frequently been encountered in the
    course of regulating the operations, processes, and services of healthcare information
    and communication technologies (or, eHealth).


    For example, consent is an extricability of personal healthcare and medical records,
    particularly due to the sensitive nature of data and information that applies
    in this context. But then, in the sense that eHealth is able to serve the best
    interests of the patients only to the extent that data and information about them
    are available for processing in order to inform the delivery of quality healthcare
    and medical services, regulation faces another challenge. This is the challenge
    of balancing the ethics of informed consent in a way that does not diminish the
    utilities afforded by eHealth for quality healthcare and medical services, which
    are also in the best interest of the data subjects (patients).


    Again, there is the well-known challenge that frequently emerges when the rights
    to data privacy collide with the interests of public health and safety. In general,
    acceptable practices for the handling personal data require that the purposes
    for which data are collected, stored, and processed are very well-defined, transparent,
    and authorized by the patients (who are the data subjects in applications of eHealth)
    such that whenever data have to be processed or applied for a different purpose
    than that for which it was originally collected, then it is either that authorization
    is received again from the data subjects, or the data are collected again.


    Yet, there are critical instances when the welfare and safety of the larger public
    might depend on processing sensitive personal data (such as for contact tracing
    during disease outbreaks, for security profiling, or for purposes that relate
    to legal proceedings), which had otherwise been collected for a different purpose
    that was well-defined and authorized at the time. Part of the goals of regulation
    is being able to balance such public interest against the imperatives of safeguarding
    sensitive healthcare and medical data that are collected, stored, and processed
    for enhancing service delivery in eHealth.


    But then again, with growing tides of interference of sovereign political interests
    in the duties and responsibilities of healthcare delivery, both at the national
    and international levels, it sometimes poses a considerable challenge to clearly
    understand and delineate what might constitute public interest, especially when
    it involves the authoritarian/autocratic whims and caprices of an incumbent government
    being imposed on the polity. In this regard, regulation faces the challenge of
    clearly stipulating the circumstances under which it otherwise becomes permissible
    to subvert the need for authorization by data subjects, and apply eHealth data
    and medical records for other purposes that might be in the interest of the larger
    public, while also ensuring that such stipulations are safeguarded from being
    hijacked for political reasons that might be masquerading as public interest.'
