    # 1 网络安全基础与电子健康概览


    DOI: [10.1201/9781003254416-1](https://dx.doi.org/10.1201/9781003254416-1)


    ## 引言


    2018 年 7 月，新加坡卫生部和网络安全局收到了一份关于新加坡总医院（SingHealth）数据泄露的报告——SingHealth 是新加坡最大的医疗机构集团。此次泄露导致在短短一周内有
    150 万条个人数据记录被盗取，并进一步针对了约 16 万名患者的门诊药物信息。


    这些患者是在 2015 年 5 月 1 日至 2018 年 7 月 4 日期间，访问过 SingHealth 专家门诊部和综合诊所的个人，其中包括新加坡任总理李显龙（Lee
    Hsien Loong）以及其他高级部长。这被载入了记忆，被称为 `SingHealth`。这是一场备受关注的网络攻击，本可以通过良好的网络安全卫生和实践来避免，而发生时，全球黑市上的健康数据售价至少
    50 美元。`SingHealth` 数据泄露揭示了 SingHealth 网络安全框架中大量的技术和非技术缺陷；据信一个被描述为隐蔽、“有技能、耐心且执着”的攻击者策划了这次泄露。


    最初，综合健康信息系统（IHIS）——负责新加坡公共卫生系统所用信息技术安全的机构——在托管电子健康记录（EHR）的一个数据库服务器上记录到可疑活动后检测到了该泄露。初步调查显示，一个前端用户工作站的恶意软件入侵可能为这次臭名昭著的攻击提供了入口，策划者通过此获得了服务器资源的特权访问权限，并同样有效地掩盖了他们的数字足迹。


    2019 年 1 月，一份独立的 450 页报告


    总结之，独立调查委员会（CoI）的报告将数据泄露的原因归结为 SingHealth 在网络安全感知和概念化方面存在关键差距，以及实施和实践的方式。


    ## 网络安全基础与电子健康概览


    `SingHealth` 网络攻击是近年来让全球医疗行业成为受关注的事件之一，这些事件成为了媒体负面关注的焦点，并引发了巨大的公众愤慨。这些事件中频繁出现了一些共同主题，包括网络安全意识薄弱、不健康的系统和基础设施安全实践、政策和治理框架的缺失，以及对网络安全概念化和理解的不足。


    这些主题凸显了反复出现的相似性，这完全表明了一个事实：在现代信息和通信技术的推动下，全球医疗领域各种电子健康创新、系统和应用的普及和扩张已经创造并维持了一个威胁领域。在这个威胁领域，政策和法规难以跟上发展速度，标准化面临多重背景挑战，而技术能力在很大程度上匮乏。尽管如此，后果仍然是惨的。


    因此，我们最终面对的是犯罪大师眼中的软性、高价值目标，他们继续为了利益而肆掠全球医疗行业。延期诉讼的集体诉讼、由于支付巨额赔偿而导致的财务能力紧张，以及在许多圈引发辩论的不信任情绪和声誉受损。这一切都是这种不幸交织结果的直接影响。


    ## 2020 年医疗健康网络安全报告


    本章将网络安全作为一种多维度概念进行介绍，概述了电子健康及其在现代医疗各个领域的各种应用，同时讨论了医疗数据以及适用于这一独特数据类别的不变特征。此外，本章还讨论了用户与信息通信技术（ICT）的交互，将其作为医疗网络安全事件底层原因的核心。


    ## 作为一种概念的网络安全


    网络安全是一个复合的多维度概念，有许多现有定义。然而，这些定义中最好的强调了四个维度，这些维度构成了构建稳健的网络安全概念化方法的对象和关注点。它们是：`信息技术资产`（基础设施，如服务器、平台、网络以及系统和设备）、`人员/用户`（人员、客户和供应商）、`流程`（例如客户服务、销售、采购、审计等）以及`政策`（为治理数据、信息、网络操作等而建立的）。图
    1.1 描述了这一概念化。


    ![图 1.1 网络安全的四个维度。](img/fig1_B.jpg)


    图 1.1 网络安全的四个维度


    `信息技术资产`包含了电子健康部署中的基础设施、系统、平台和设备。这些包括为了托管数据和服务以支持运营的服务器和平台（本地和云端）、提供这些工具的网络媒介，以及用于执行各种操作的终端系统和设备。这些系统和设备包括手机、电脑、平板设备和其他信息技术系统。


    `人员/用户`指的是为了各种目的与基础设施交互的人类代理。他们可以是依靠基础设施提供的工具提供服务的人员、从这些服务中受益的客户（有时需要他们直接或间接地与基础设施交互），或依靠基础设施为组织提供服务的供应商。


    `流程`指的是由基础设施提供的服务和工具支持的组织运营。它们可能包括从客户服务、销售、采购、审计和分销等广泛活动。


    `政策`是组织范围内的规范，指导并规范人员、流程围绕关键组织资产（如数据和信息）运行和交互的方式。在优秀的部署中，这些规范的设计与业务运营行业更广泛接受的最佳实践保持一致。


    作为一个概念，网络安全横跨这四个维度。通过一套统一的程序和实践将它们统一，旨在确保四个维度都能汇聚以实现组织的目标和愿景。这很重要，因为在日益数字化的世界中，这四个维度以安全、可靠和高效的方式进行无缝交互和相互操作，可能决定组织的成功与失败、利润与负债、进步与破产。


    ## 电子健康的概述与应用


