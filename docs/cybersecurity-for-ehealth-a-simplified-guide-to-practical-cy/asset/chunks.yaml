    For the non-technical healthcare stakeholders (medical professionals, healthcare
    workers, regulatory and compliance agencies, health centre managers, administrators
    & insurers, clients/patients, and third-party vendors) who typically lack in-depth
    technical competence in the practical workings and operations of eHealth systems
    and infrastructures, and without sophisticated knowledge of the procedures and
    best practices for effective cybersecurity, the information in this Book would
    be useful in equipping them with the practical knowledge and insights that are
    needed to navigate the everyday realities and challenges of cybersecurity in the
    delivery of healthcare services.


    However, it is necessary to stress that at organizational/corporate levels, it
    is important that adopting and applying the information and recommendations provided
    in this book are done in consultation with technical experts and professionals
    who would help guide and contextualize these information and recommendations to
    align with the operational realities and goals of the organization. The importance
    of this cannot be exaggerated.


    Furthermore, it is hoped that the book would also have some appeal for (cybersecurity)
    enthusiasts generally and even in the affiliated/adjoining sectors of global healthcare,
    who are looking to have a foundational understanding of the cybersecurity threats
    and risks that pertain to the healthcare sector, while also providing a useful
    utility for facilitators and instructors who design, create, and facilitate training
    programs in healthcare information technologies, either as part of formal medical/nursing
    school degree, certificate, or diploma training, or as post-qualification continuing
    education programs in healthcare, medicine, public health, or nursing.


    In addition, it is also expected that the language, structure, and design of the
    Book would resonate with Medical Boards, Nursing Councils, Public Health Professional
    Societies, and other Healthcare Bodies/Associations at national and regional (or
    international) levels. In this regard, it is anticipated that success would come
    on the heels of the reality that while the subject area remains one that is of
    much contemporary relevance, the short supply of rudimentary training resources
    targeting non-technical audiences poses an obstacle to the effectiveness of training
    programs in the subject domain. It is within this gap that this Book has provided
    a befitting resource that is relevant to the reality and necessities of this problem.


    But ultimately, armed with the broad insights and perspectives provided in this
    Book, which have been accumulated from across several organizational and national
    contexts, it is hoped that healthcare stakeholders who seek to do their part towards
    quelling the tides of cyber incidents and attacks that continue to destabilize
    the global healthcare industry would find a useful and practical guide for progress
    and success in this pursuit.


    ## Notes


    1. [World Health Organization (WHO) (n.d.). *eHealth Governance*](#ch6.xhtml#R_en6_1).
    [https://www.who.int/ehealth/governance/en/](https://www.who.int)


    2. [Wilson, P. (2012). Legal frameworks for eHealth. *Global Observatory for eHealth
    series – Volume 5*](#ch6.xhtml#R_en6_2). World Health Organization (WHO). [https://www.who.int/goe/publications/legal_framework_web.pdf](https://www.who.int)


    3. [United Nations (2015). *Universal Declaration of Human Rights (UDHR)*](#ch6.xhtml#R_en6_3).
    [https://www.un.org/en/udhrbook/pdf/udhr_booklet_en_web.pdf](https://www.un.org)


    4. [Council of Europe (2013, October 02). *European Convention*](#ch6.xhtml#R_en6_4).


    5. [United Nations (1966). *International Covenant on Civil and Political Rights*](#ch6.xhtml#R_en6_5).


    6. [Council of Europe (2020). *European Convention*](#ch6.xhtml#R_en6_6).


    7. [The African Union (2014). *African Convention on Cyber Security and Personal
    Data Protection*](#ch6.xhtml#R_en6_7).


    8. [Orrell, T. (2015). *African Declaration on Internet Rights and Freedoms*](#ch6.xhtml#R_en6_8).


    ## Glossary of Definitions


    ### Access Authentication

    An access control measure that requires entities to confirm or verify something
    about the subject or user that holds such credentials.


    ### Access Control

    These are measures that are put in place to restrict entry and engagement with
    system.


    ### Anonymization

    The practice of removing all personally identifiable information from a body of
    data, such that it becomes impossible to identify the original subject by any
    means at all.


    ### Anti-malware

    A device or application that provides protection against various malware.


    ### Bot

    A software program, device, or system that is able to receive, process, and execute
    commands/instructions, such that enable it to perform pre-defined tasks in a repetitive
    manner.


    ### Botnet

    A collection of infected or compromised systems and devices that are under the
    control of an attacker, and can be deployed to perpetrate and amplify the impact
    of malicious operations against targets.


    ### Bring Your Own Device (BYOD)

    A working arrangement that permits employees of an organization to bring and use
    personal devices and systems within the corporate environment, and also gain access
    to organizational resources and platforms using these personal devices.


    ### Code

    A collection of instructions written in a particular computational language, which
    describes/specifies the procedures and operations that would be undertaken in
    the execution/processing of a particular task.


    ### Credentials

    Digital artefacts that contain the information needed to prove or verify something
    about the subject or user that holds such.


    ### Cross-Site Scripting (XSS)

    A security vulnerability of web applications that allows malicious actors to compromise
    or interfere with the legitimate interactions that authorized users have with
    such applications.


    ### Cryptanalytics

    It generally refers to the science, procedures, technologies, and activities that
    are applied in an analysis aimed at understanding the hidden aspects of information
    systems and technologies, to enable the encryption and decryption of messages
    without the use of secret keys.


    ### Cyber-Attack

    A criminal offence against a digital information technology asset (networks, devices,
    systems, etc.) that seeks to gain unauthorized access, control, and usage of such
    asset for malicious purposes.


    ### Cyber-Physical Systems

    An implementation that involves the use of computers in monitoring physical phenomena,
    and/or controlling physical processes and operations, featuring the use of sensors
    (to detect events as impulses and variations in the physical environment), and
    actuators (to take actions in response to detections).


    ### Cybersecurity

