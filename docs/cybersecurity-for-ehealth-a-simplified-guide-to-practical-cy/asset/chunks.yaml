    # 2 The Cybersecurity Threat Landscape for eHealth


    DOI: [10.1201/9781003254416-2](https://dx.doi.org/10.1201/9781003254416-2)


    ## Introduction


    While it is true that cybersecurity risks are able to ripple through the entire
    digital apparatuses of healthcare organizations, they often originate and spread
    from within particular ecosystems of operations and interactions within the business
    of healthcare. Hence, it is important for professionals and administrators alike
    to be able to answer certain critical questions at the point of adding new digital
    models and operations to existing corporate repertoires.


    What (new) ecosystem(s) of digital interactions does this new scope of healthcare
    service or operation created (or expand)? What elements participate in this new
    ecosystem(s)? In order to safeguard operations effectively within this new healthcare
    digital ecosystem(s), what are the dimensions of cybersecurity to consider? The
    answers to these questions are crucial in order to ensure that new business models
    and operations do not exacerbate existing cybersecurity risks, amplify the effect
    of vulnerabilities, and extend the scope of impact for cyber threats and attacks
    in healthcare organizations. However, to answer these questions effectively, a
    robust understanding of the threat landscape is indispensable, especially knowing
    that the cybersecurity threat landscape continues to shift and metamorphose frequently
    and rapidly within very short periods.


    For instance, in the aftermath of the COVID-19 Pandemic (year 2020), many healthcare
    organizations were forced to implement a rapid digital transition, including migrating
    operations to new platforms and environments in the “cloud”. The aim was to help
    them cope with the imperatives for physical distancing in a way that does not
    upturn their entire chain of operations. In the process, there was the creation
    of new digital ecosystems around existing business repertoires. However, for many
    of these instances, it also meant a significant change in the usual cybersecurity
    threat landscape for the organizations involved


    As many hospitals and healthcare facilities turned to eHealth in a bid to limit
    physical interface with non-COVID-19 patients, and manage the limited stocks and
    supplies of personal protective equipment to cater to the critically ill and hospitalized
    patients, new remote capabilities opened up a metamorphosed threat landscape that
    created new opportunities for cybercriminals. There was the amplification of well-known
    malicious techniques, even as new strategies for exploitation emerged. As a result,
    the statistics on cyber incidents and attacks to the healthcare sector exceeded,
    within a few short months, the figures reported over the last few years as annual
    statistics.


    Within the first month of the Pandemic-occasioned lockdowns alone, several independent
    reports (including by American-Israeli IT security giant, Check Point'
