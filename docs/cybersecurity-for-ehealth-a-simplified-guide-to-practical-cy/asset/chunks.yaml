- raw: '*   ***Tools and Techniques*** that include malware (ransomware, trojans,
    viruses, spyware, rootkits, logic bombs, worms, and autorun scripts), data recovery
    software, phishing/vishing, scanners & trackers, piggybacking/tailgating, shoulder-surfing,
    packet tracers, hidden tunnels in network protocols & services, cross-site scripting
    (XSS), SQL injection, signal jammers/interference generators, network sniffers
    & analysers, keyloggers, smash & grab, bots, and botnets.


    In practice, tools and techniques are integrated as part of methods/strategies/approaches,
    which are incorporated within the framework of Threat objectives that are geared
    towards outcomes that become known as cybersecurity incidents. In practice, however,
    it has been seen that multiple threat objectives can incorporate different methods/strategies/approaches,
    which, in turn, enlist a wide range of sophisticated tools and techniques (particularly
    when malicious intentions are involved) in order to bring about cybersecurity
    incidents.


    For instance, as part of a threat-attack objective that aims to cause a medical
    system failure, an induced malfunction might begin the chain through a privilege
    escalation that integrates a spoofing technique seeking to impersonate an authorized
    digital identity in the eyes of the system; before trans-loading a malware or
    executing an SQL injection on the system or device. Similarly, a threat-attack
    strategy that seeks to breach electronic health records for financial gain could
    enlist hardware- or software-based network sniffers and packet analysers in a
    technique that features physical events on site at the healthcare facility to
    capture sensitive information (e.g., access credentials), as part of a coordinated
    digital interception strategy that integrates insider operations.


    ## Pertaining People/Users


    People/Users are frequent targets in the cybersecurity threat landscape for healthcare.
    As discussed in [Chapter One](#ch1.xhtml), this is because they often pose soft
    targets for the high-value assets that feature in the global healthcare sector.
    Sometimes, threats to users could arise from the conscious actions and inadvertencies
    of other users in the same process/operations chain. Other times, they could be
    targeted attempts by malicious outsiders to exploit deduced, perceived, or disclosed
    vulnerabilities for financial gain.


    Generally, however, when threats and attacks target people/users in the healthcare
    sector, they often gun for sensitive ***Data*** about them, and the ***Access
    Credentials*** that they hold. Perhaps, and yet the most common and popular avenue
    by which these threats/attacks have been known to infiltrate and propagate is
    through social engineering.


    Social Engineering enlists a number of approaches in a practice that aims at conning/manipulating
    individuals into doing things that they are unlikely to do, given different circumstances.
    This could include divulging sensitive information, performing actions that are
    inimical to security interests and goals, or granting otherwise unpermitted concessions.


    Social Engineering typically seeks to exploit cognitive biases (sometimes referred
    to as “bugs in the human hardware”), as well as other psychological and behavioural
    tendencies/susceptibilities. It is a potent technique because these biases often
    underlie and inform the most obvious behaviours and actions of users, making them
    susceptible to certain kinds of external influence by malicious actors. Through
    Social Engineering, it has proven possible to trick people/users within the healthcare
    space into divulging sensitive financial details, and account credentials successfully.
    It is also possible to manipulate or lure them into clicking links or connecting
    removable devices that ultimately transload and install malicious software, which
    gave attackers persistent and privileged access to system resources.


    Phishing and Vishing are common approaches to social engineering that have often
    featured in threat-attack situations that target people/users in healthcare. It
    is an act of impersonating a trusted entity in an electronic communication, in
    order to obtain sensitive data or information by trick. When this act is perpetrated
    over an electronic communication that is voice-based (such as a phone call or
    voice recording), it is referred to as Vishing. However, when it is perpetrated
    over a text-based communication (like email, chat/instant message, or short message),
    it is referred to as Phishing.


    Other approaches to social engineering include piggybacking or tailgating – a
    practice of surreptitiously tagging close to someone that has authorized access
    to a secure or restricted healthcare application/facility/area, in order to get
    past a required security check or access validation protocol, and gain access
    without going through the authorization routines. Also, there is the technique
    of shoulder-surfing that is applied to observe and possibly memorize security
    credentials like usernames, passwords, PIN codes, credit card details, and secure
    URLs by peeping or snooping over shoulders of users at the point of entering these
    credentials.


    In addition, Social Engineering particularly targets people/users in healthcare
    based information about their schedules, employers, work environment & cultures,
    online and offline interactions, digital devices and their usage, network connections,
    and user interfaces & applications. This could be deduced passively (without direct
    interactions or interface with the targeted users, but rather through publicly
    accessible sources) or actively (involving direct interactions and interface with
    users). The preference for social engineering by malicious actors is, perhaps,
    owing to the fact that it requires almost no technical expertise, and often presents
    a path of least resistance.


    Think about it this way. Why would a malicious individual seeking to gain access
    to sensitive and high-value healthcare data spend so much time engineering a sophisticated
    malware as part of a robust attack regimen to breach highly secure organizational
    servers and systems? When alternatively, they could simply:


    *   Disguise as a technical staff of the healthcare organization over a phone
    call to deceive a naive employee with authorized access into divulging login credentials;


    *   Loiter around a private workspace within the healthcare facility, waiting
    for a user to step away from their workstation without completely logging off,
    and then jumping on to continue access using the user’s credentials;


    *   Manipulate a disgruntled technical staff at a hospital, who has authorized
    access and probably does not know the actual worth of such data on the black market,
    into transferring such data for a paltry sum;


    *   Tailgate an employee with authorized access to an otherwise secure healthcare
    facility that houses electronic health records during peak entry hours on a busy
    workday, and then implant devices that would enable remote access and siphoning
    of sensitive data;


    *   Exploit a trusted relationship or an altruistic tendency of an authorized
    hospital employee to request use of a personal or work device, and then implant
    a keylogger or other malware on the device in the process;


    *   Create an identical replica of a public-facing user interface in order to
    con an unaware authorized user or employee into providing access credentials;
    or


    *   Deduce layouts and content of non-public-facing user interfaces through publicly
    posted pictures by an unscrupulous user/healthcare professional that shows computer
    screens; and then create an identical replica to launch a large-scale identity
    theft targeting employees of a healthcare organization.'
