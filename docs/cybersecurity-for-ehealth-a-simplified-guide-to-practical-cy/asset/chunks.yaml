    ## Threat Agents to Cybersecurity of eHealth


    `Threats` exist or manifest when `Threat Agents` exploit, attempt to exploit,
    or perpetuate a vulnerability. Thus, these `Threat Agents` are an indispensable
    factor in the discourse around cybersecurity in eHealth. Indeed, the eHealth Cybersecurity
    Threat Landscape is one that has continued to feature different players. `Threat
    Agents` that have featured in this Landscape include individual entities, independent
    groups, corporate entities, sovereign (nation-state) entities, or non-sovereign
    (but sovereign-sponsored) entities. In other words, basically, `Threat Agents`
    to eHealth cybersecurity include individual and non-individual entities, which
    could be either independent or sovereign-affiliated, as well as sovereign entities.


    `Individual Entities` could be hackers who have technical skills in the workings
    and operations of computer/information security. They could also include malicious
    individuals who might not have technical skills but may seek to undertake malicious
    operations through non-technical means. Then, they could also be naive human actors
    (internal or external) without malicious intent, but whose unwitting actions and
    activities could be no less inimical to security interests and goals.


    `Independent Groups` are associations of malicious individual entities united
    by a common vision or mission that could be political, ideological, cultural,
    financial, patriotic, or otherwise. As part of their repertoire of operations,
    they could feature certain levels of technical competence. Whereas, the inspiration
    behind their operations could be terror/insurrection, propaganda, extremism, activism,
    or wild enthusiasm.


    In some cases, sovereign governments seeking to undertake malicious cyber operations
    for various reasons could sponsor `Individuals` and `Independent Groups`. In this
    capacity, they qualify as `Sovereign-sponsored/Sovereign-affiliated Threat Agents`.


    `Corporate Entities` with competing or partnering interests could also pose as
    threat agents to eHealth cybersecurity. When competing interest is involved, malicious
    intentions usually feature with the aim of sabotaging corporate interests or the
    reputation of the target organization. However, when partnering interests are
    involved, actions of inadvertence could equally create or perpetuate threat situations
    that might be inimical to corporate security interests. Compared to `Individual
    Entities` and `Independent Groups` that are not sovereign-sponsored, `Corporate
    Threat Entities` with malicious intentions often feature more threat resource
    capabilities.


    Threat resource capabilities in this regard could be financial, technical (in
    terms of capacity of skillset and toolset), and/or infrastructural.


    `Sovereign Entities` are nation states that undertake malicious cyber operations
    in order to safeguard or assert national interests that could be political, trade-related,
    reputational, or security-related. Nation-state entities are usually able to deploy
    a seemingly infinite amount of threat resource capabilities to insure and amplify
    the impact of their threat-attack operations.


    It is not commonplace for sovereign and sovereign-sponsored/sovereign-affiliated
    entities to threaten cybersecurity in the context of healthcare. At the same time,
    it is not impossible. Since financial benefit is known to be a primary motivation
    behind a vast majority (over 80%).


    However, there are uncommon cases where healthcare organizations, their systems,
    and infrastructure provide a window or leeway into the operations and activities
    of bigger targets of interest (such as national governments, or the armed forces).
    There are also more common cases where healthcare facilities hold electronic health
    records of influential individuals that are of national or international interest.
    In such cases, healthcare organizations could become targets of sovereign and
    sovereign-sponsored/sovereign-affiliated entities on the path to pursuing these
    larger interests.


    For instance, multiple sources in the aftermath of the 2018 *SingHealth* cyber-attack
    (such as the *UK Telegraph*


    ## Cybersecurity Incidents in Healthcare


    When cybersecurity incidents happen in healthcare due to the malicious or inadvertent
    actions/activities of threat agents, certain outcomes usually manifest, and several
    tools and techniques, methods or strategies, as well as threat objectives frequently
    feature as part of the threat-attack processes and operations that lead to these
    outcomes (`[Figure 2.3](#ch2.xhtml#fig6)`).


    ![Figure 2.3 When Healthcare Cybersecurity Incidents Happen.](images/fig6_B.jpg)


    [Figure 2.3 When Healthcare Cybersecurity Incidents Happen.](#ch2.xhtml#R_fig6)


    Typically, these `Outcomes` include *data breaches & leaks*, *espionage*, and
    *unavailability or failure of medical and healthcare IT systems/devices*. Espionage,
    however, is seldom an outcome when cybersecurity incidents target healthcare facilities,
    except, as previously highlighted, in cases where the systems or infrastructure
    of a healthcare organization provides a window/leeway into the operations and
    activities of a bigger entity of interest, such as the government or armed forces.


    The trail that leads towards these outcomes features:


    *   `Threat Objectives` such as reconnaissance/enumeration, digital/electronic
    interceptions, service disruptions, induced systems/device malfunction, erode
    security culture/protocols/operations, credential stuffing, and identity theft/digital
    impersonation;


    *   `Methods, Strategies, or Approaches` like spoofing (of emails, packets, location,
    addresses, protocol operations, websites, biometric & non-biometric identifiers,
    etc.), social engineering, advanced persistence (or, APTs), physical events and
    activities on site (including insider operations that could be either naive or
    maliciously intended), wardriving, man-in-the-middle (MITM), injection/poisoning,
    privilege escalation, transloading, shadowing digital activities, scavenging,
    hijacking, subversion/bypass of protocols and routines, and denial of service
    (DoS); and,

