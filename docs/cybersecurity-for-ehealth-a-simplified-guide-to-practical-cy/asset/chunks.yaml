    The sets and sequences of processes and operations that are put in place for the
    purpose of preserving security and ensuring other security-related functions.


    ### Server

    A hardware or software computing system that functions primarily to provide utility
    and services to other programs, systems, and devices (often referred to as “clients”)
    that connect to it.


    ### Shoulder Surfing

    The practice of spying on users by looking over their shoulders as they use applications
    or digital electronic devices, often with the motive of learning sensitive user
    information (such as usernames, passwords, secure URLs, etc.).


    ### Smash ‘n’ Grab

    An operation that involves a malicious actor quickly smashing through a security
    or other barriers to lay a hold on valuables.


    ### Social Engineering

    The usually malicious practice of posing as a trusted entity in order to deceive
    individuals/users into taking actions or divulging (sensitive) information that
    they might otherwise not have been inclined to.


    ### Spoofing

    The often-malicious impersonation of an authorized entity in digital communications,
    in order to attain/receive/transfer the privileges, benefits, and utilities provided
    to the authorized entity by a system or network. It is a form of digital identity
    theft.


    ### Subversion

    The malicious process of bypassing or over-running the control and security functions
    of a digital computing system or resource, often for the purpose of gaining unauthorized
    access and control.


    ### Tailgating

    The practice of gaining unauthorized access to a usually secure or restricted
    location/facility as a result of bypassing physical security and access control
    measures or systems by tagging closely enough to someone with authorized access.
    It is otherwise referred to as `Piggybacking`.


    ### Threat Actors

    Human or non-human individual or group entities that seek to compromise the security
    of computer systems or networks for malicious purposes.


    ### Threat Landscape

    An anthology of threats that are native to a specific context or domain, about
    which it is known what risks they present, what assets they target, what actors
    are involved, and the trends they manifest.


    ### Transloading

    The process of transferring or translocating a usually malicious digital payload
    between or across systems, devices, networks, or other digital information technology
    media.


    ### Two-Factor Authentication

    A form of authentication that requires authorized users to present more than one
    type of information for identity confirmation/verification, prior to gaining access
    to a system or network.


    ### Uniform Resource Locator (URL)

    An identifier that references a resource on a local network, or on the World Wide
    Web/Internet. It is otherwise referred to as a web address.


    ### Unstructured Supplementary Service Data (USSD)

    A protocol that enables users’ mobile telephone devices to communicate with the
    computers of network operators/service providers using short codes that are otherwise
    referred to as “feature codes”, or “quick codes”, and usually involve special
    characters like `*` and `""`.


    ### Virtual Private Networks (VPNs)

    An encrypted connection that links a device to a network across the open Internet
    – providing a reliable means of transmitting data securely, without the risk of
    interference or interception.


    ### Virus

    A malware that propagates by binding itself to user and system files, and is able
    to inflict damage on digital systems or networks, according to the instructions
    contained in its program code.


    ### Vishing

    A form of `Social Engineering` that usually involves an attacker/malicious individual
    posing as a trusted entity in a voice-based communication (e.g., phone calls,
    audio messages, etc.).


    ### Wardriving

    The act of locating wireless network access points typically by driving around
    various locations, often with the aim of exploiting successful connections to
    such wireless access points for malicious purposes. It is sometimes referred to
    as Access Point Mapping.


    ### Website

    A collection of web pages that feature related content about a person, organization,
    concept, technology, or other entity/phenomenon; and is tied to a particular name
    (known as a domain name) that makes it discoverable on the Internet.


    # Bibliography


    1. European Commission (2014, July 23). *Overview of the national laws on electronic
    health records in the EU Member States and their interaction with the provision
    of cross-border eHealth services*. [https://ec.europa.eu/health/sites/health/files/ehealth/docs/laws_report_recommendations_en.pdf](https://ec.europa.eu)


    2. European Union Agency for Network and Information Security (ENISA) (2015).
    *Security and Resilience in eHealth: Security Challenges and Risks*. [https://www.enisa.europa.eu/publications/security-and-resilience-in-ehealth-infrastructures-and-services/at_download/fullReport](https://www.enisa.europa.eu)


    3. Herveg, J., Silber, D., Van Doosselaere, C., & Wilson, P. (2006). *Deliverable
    5: Final Recommendations on Legal Issues in eHealth. Study on Legal and Regulatory
    Aspects of eHealth: “Legally eHealth”*. [http://ehma.org/wordpress/wp-content/uploads/2016/08/Legally_eHealth-Del_05-Recommendations2.pdf](http://ehma.org)


    4. International Development Research Centre (IDRC) (2010, December). *Electronic
    Health Privacy and Security in Developing Countries and Humanitarian Operations*.
    Policy Engagement Network for the IDRC. The London School of Economics and Political
    Science. [http://personal.lse.ac.uk/martinak/eHealth.pdf](http://personal.lse.ac.uk)


    5. Miesperä, A., Ahonen, S. M., & Reponen, J. (2013). Ethical aspects of eHealth-systematic
    review of open access articles. *Finnish Journal of eHealth and eWelfare*, 5(4),
    165-171. [https://journal.fi/finjehew/article/view/9401/6707](https://journal.fi)


    6. Salvi, M. (2012, February 22). *Ethics of Information and Communication Technologies*.
    Publications Office of the EU. [https://op.europa.eu/en/publication-detail/-/publication/c35a8ab5-a21d-41ff-b654-8cd6d41f6794](https://op.europa.eu)


    7. Sembok, T. M. (November 2003). *Ethics of Information Communication Technology
    (ICT). Proceedings of the Regional Meeting on Ethics of Science and Technology*
    (pp. 239-325). Bangkok: UNESCO – Regional Unit for Social & Human Sciences in
    Asia and the Pacific (RUSHSAP).


    8. Townsend, B. A. (2017, March). Privacy and Data Protection in eHealth in Africa:
    An assessment of the regulatory frameworks that govern privacy and data protection
    in the effective implementation of electronic health care in Africa: Is there
    a need for reform and greater regional collaboration in regulatory policymaking?
    Doctoral Thesis. Cape Town, South Africa: University of Cape Town. [https://open.uct.ac.za/bitstream/handle/11427/25510/thesis_law_2017_townsend_beverley_alice.pdf](https://open.uct.ac.za)


    9. Wilson, P. (2012). Legal frameworks for eHealth. *Global Observatory for eHealth
    series - Volume 5*. World Health Organization (WHO). [https://www.who.int/goe/publications/legal_framework_web.pdf](https://www.who.int)


    10. World Health Organization (WHO) (2016). *Monitoring and Evaluating Digital
    Health Interventions: A practical guide to conducting research and assessment*.
    [https://apps.who.int/iris/bitstream/handle/10665/252183/9789241511766-eng.pdf](https://apps.who.int)

