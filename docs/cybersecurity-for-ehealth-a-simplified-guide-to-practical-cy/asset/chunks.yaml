- raw: "    Inspiring a robust approach to vigilance that is inclusive, and incorporates\
    \ a zero-trust (that is, trust none and verify all) model is, perhaps, a good\
    \ way to start. Ultimately, all stakeholders of the healthcare organization must\
    \ become partners and collaborators in the responsibility of corporate cybersecurity,\
    \ supporting and complementing each other through the sometimes inconvenient best\
    \ practices and approaches to securing healthcare information and communication\
    \ technologies. Reward and compliment good security behaviours and practices,\
    \ by tracking even those that are not physically manifested, and also ensure to\
    \ promptly correct and remedy bad security behaviours and practices, in the same\
    \ way. Establish cybersecurity policies (e.g., password and user account policies,\
    \ firewall and remote communication policies, device control policies, etc.) and\
    \ ensure to enforce them.\n\n    Beyond these, however, and perhaps more importantly,\
    \ an atmosphere must be created wherein users and employees feel comfortable reporting\
    \ unwitting actions or lapses that might have inadvertently compromised the security\
    \ status of the organization, or violated certain security policies, even when\
    \ such security compromises are merely notional, and may not yet have resulted\
    \ in an actual security incident. Within such an atmosphere, healthcare organizations\
    \ might be able to buy useful time to respond or react effectively, which could\
    \ help them avert greater consequences from imminent security incidents. However,\
    \ without an atmosphere wherein people/users feel comfortable revealing such lapses\
    \ without fear of undue reprimand, such gains would be difficult to achieve.\n\
    \n    But then, in order for any of these to be as effective, training, awareness,\
    \ and capacity development must cease to belong in the exclusive domain of the\
    \ technically competent individuals for whose job functions and roles these might\
    \ be required. Rather, let every stakeholder be reasonably aware of what the cybersecurity\
    \ apparatus of the organization looks like, what safeguards/restrictions are in\
    \ place, and where; what measures for monitoring and accountability have been\
    \ established; what are the levels of tolerance for security risks; what information\
    \ technology assets are critical for defending, and the nature of threats to be\
    \ defended against; which entities and domains are high-risk; what to do when\
    \ under threat or attack. It is important that no stakeholder is left behind in\
    \ any of these regards.\n\n    Now, it might be argued that this basically hands\
    \ the pie to a malicious insider. However, when considered holistically with the\
    \ body of other physical, logical, and operational imperatives, it becomes obvious\
    \ that a cybersecurity culture is but a complementary aspect, which is as crucial\
    \ as every other in the task of safeguarding eHealth systems and infrastructures.\n\
    \n4.  Create an internal framework/mechanism for risk assessment and incident\
    \ management. This is indispensable for the business of healthcare service delivery\
    \ because risks and incidents to eHealth systems and infrastructures could directly\
    \ portend grave implications for the safety of life. Thus, healthcare organizations\
    \ need to have in place a framework/mechanism for internally assessing cybersecurity\
    \ risks and managing incidents before they wreak undesirable outcomes on the organization.\n\
    \n    This would particularly help healthcare organizations to gauge effectively\
    \ the implications of certain processes, operations, and practices for long-term\
    \ business continuity, while also enhancing and strengthening their capacity to\
    \ detect, investigate, prevent, respond, contain, and recover from cybersecurity\
    \ incidents with minimal damage and losses.\n\n    But, even more importantly,\
    \ these frameworks/mechanisms should be robust, proactive, and responsive enough\
    \ to spot cybersecurity risks before they actually become incidents. Possibility,\
    \ likelihood, consequential impact/severity, mitigability (by degree), and avoidability.\
    \ These are well-known pillars of effective risk assessment – being able to establish\
    \ the possibility that an incident could occur in context, the likelihood that\
    \ it would occur (given the existing organizational processes, operations, and\
    \ practices), the impact/severity of the resulting consequence, how such impacts\
    \ could be diminished/diffused, and to what degree, and the extent to which such\
    \ a risk can be avoided altogether. These are critical considerations for the\
    \ cybersecurity of eHealth systems and infrastructures.\n\n    Furthermore, a\
    \ resilient operational contingency plan is indispensable to the risk management\
    \ and incident response apparatus of healthcare organizations that deploy eHealth\
    \ systems and infrastructure. This would be helpful in ensuring that healthcare\
    \ operations are not ground to a halt when risks transform into incidents.\n\n\
    ## Monitoring and Evaluation for Compliance\n\nUnfortunately, none of these physical,\
    \ logical, or operational imperatives would be as effective without a coordinated\
    \ approach to monitoring and evaluation, in order to ensure compliance at all\
    \ levels of the healthcare organizations where eHealth systems and infrastructures\
    \ feature in various capacities. A monitoring and evaluation plan has often proven\
    \ useful in helping to structure and guide efforts and activities in this regard.\n\
    \nThis usually begins by defining what are the goals/outcomes of monitoring and\
    \ evaluation efforts, how these goals/outcomes are to be benchmarked, as well\
    \ as what compliance entails (with respect to indicators, and how they might be\
    \ measured/assessed in context). Perhaps, and for example, measuring compliance\
    \ could be envisaged in terms of successful regulatory (re-)assessments, or in\
    \ terms of a decrease in the number of passwords flagged by account management\
    \ systems and servers as not compliant with the organization’s password policy\
    \ requirements.\n\nAll of these can then be formalized into a plan that outlines\
    \ what approaches and methodologies would be deployed towards the monitoring and\
    \ evaluation process – which could be physical, logical, or operational – and\
    \ how these would be applied. Next would be to decide what evidence(s) would be\
    \ pursued, based on the benchmarked goals of the monitoring and evaluation plan,\
    \ before employing the necessary resources that are needed to ensure a smooth\
    \ and efficient monitoring and evaluation process.\n\nIndeed, it is the approach\
    \ to monitoring and evaluation for compliance that creates the ambience of proactiveness\
    \ and responsiveness, which, in the long run, enhances the capacity of the healthcare\
    \ organization for effective security of eHealth systems and infrastructures.\
    \ However, in order to proceed knowledgeably in this regard, an intuitive first\
    \ step is being able to understand what digital ecosystems exist around new and\
    \ current deployments of eHealth, and how these ecosystems function and interface\
    \ with the digital capacity and assets of the healthcare organization.\n\n## Understanding\
    \ Ecosystems of eHealth Deployments\n\nAs was highlighted in [Chapter Two](#ch2.xhtml),\
    \ when eHealth deployments begin to scale and expand, it is often seen that new\
    \ digital ecosystems of healthcare operations and services begin to form around\
    \ existing frameworks and processes. Understanding the implications of these new\
    \ ecosystems for existing structures, particularly with regards to data and information\
    \ security, is critical to the success of healthcare organizations in these ventures.\n\
    \nWhat new ecosystem(s) of digital interactions are created (or expanded) by this\
    \ new scope of healthcare service or operation? What elements participate in this\
    \ new ecosystem(s)? What dimensions of cybersecurity need to be taken into consideration,\
    \ in order to effectively safeguard operations within this new healthcare digital\
    \ ecosystem(s)? These are fundamental questions that are critical to understanding\
    \ the ecosystems that form around eHealth systems and infrastructures."
