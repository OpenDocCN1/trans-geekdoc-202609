    \ \n\n**Server:**\n\n: A hardware or software computing system that functions\
    \ primarily to provide utility and services to other programs, systems, and devices\
    \ (often referred to as “clients”) that connect to it. \n\n**Shoulder Surfing:**\n\
    \n: The practice of spying on users by looking over their shoulders as they use\
    \ applications or digital electronic devices, often with the motive of learning\
    \ sensitive user information (such as usernames, passwords, secure URLs, etc.).\
    \ \n\n**Smash ‘n’ Grab:**\n\n: An operation that involves a malicious actor quickly\
    \ smashing through a security or other barriers to lay a hold on valuables. \n\
    \n**Social Engineering:**\n\n: The usually malicious practice of posing as a trusted\
    \ entity in order to deceive individuals/users into taking actions or divulging\
    \ (sensitive) information that they might otherwise not have been inclined to.\
    \ \n\n**Spoofing:**\n\n: The often-malicious impersonation of an authorized entity\
    \ in digital communications, in order to attain/receive/transfer the privileges,\
    \ benefits, and utilities provided to the authorized entity by a system or network.\
    \ It is a form of digital identity theft. \n\n**Subversion:**\n\n: The malicious\
    \ process of bypassing or over-running the control and security functions of a\
    \ digital computing system or resource, often for the purpose of gaining unauthorized\
    \ access and control. \n\n**Tailgating:**\n\n: The practice of gaining unauthorized\
    \ access to a usually secure or restricted location/facility as a result of bypassing\
    \ physical security and access control measures or systems by tagging closely\
    \ enough to someone with authorized access. It is otherwise referred to as *Piggybacking*.\
    \ \n\n**Threat Actors:**\n\n: Human or non-human individual or group entities\
    \ that seek to compromise the security of computer systems or networks for malicious\
    \ purposes. \n\n**Threat Landscape:**\n\n: An anthology of threats that are native\
    \ to a specific context or domain, about which it is known what risks they present,\
    \ what assets they target, what actors are involved, and the trends they manifest.\
    \ \n\n**Transloading:**\n\n: The process of transferring or translocating a usually\
    \ malicious digital payload between or across systems, devices, networks, or other\
    \ digital information technology media. \n\n**Two-Factor Authentication:**\n\n\
    : A form of authentication that requires authorized users to present more than\
    \ one type of information for identity confirmation/verification, prior to gaining\
    \ access to a system or network. \n\n**Uniform Resource Locator (URL):**\n\n:\
    \ An identifier that references a resource on a local network, or on the World\
    \ Wide Web/Internet. It is otherwise referred to as a web address. \n\n**Unstructured\
    \ Supplementary Service Data (USSD):**\n\n: A protocol that enables users’ mobile\
    \ telephone devices to communicate with the computers of network operators/service\
    \ providers using short codes that are otherwise referred to as “feature codes”,\
