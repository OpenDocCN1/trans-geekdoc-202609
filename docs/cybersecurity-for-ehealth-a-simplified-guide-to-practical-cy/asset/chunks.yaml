- raw: "It is no gainsaying that the essence of information technology (or eHealth)\
    \ applications in healthcare has been primarily for the purpose of ensuring that\
    \ access to quality healthcare services is available ubiquitously and without\
    \ any form of confinement or incapacity that is imposed as a result of geographic\
    \ location, mobility, or similar constraints. Whereas, the utility that is provided\
    \ in this context relies on medical/healthcare data and information being available\
    \ in just the same manner, and particularly in a way that can be trusted as accurate\
    \ and reliable for informing medical/healthcare diagnosis and decisions.\n\nAll\
    \ of these crumble when Integrity is compromised. So, how then can Integrity be\
    \ ensured in healthcare applications of information technology (eHealth)?\n\n\
    1.  One school of thought that has been widely considered in this regard is allowing\
    \ patients (frequent/periodic) access to their healthcare/medical data. The reality\
    \ of device sensors with wide error margins, as well as the possibility of interceptions\
    \ and alterations that could occur at different points in the data processing/operations\
    \ chain are facts that have been more evident by recent events. By allowing patients\
    \ access to their data at various points in the processing/operations chain, it\
    \ adds a layer of interest-based verification that can be relied upon as the chain\
    \ continues to scale. The logic is pretty simple: no one can be more interested\
    \ in the accuracy of medical/healthcare records than the patients themselves.\n\
    \n    However, this does not in any way diminish the responsibilities attributed\
    \ to healthcare organizations for safely collecting these data and information,\
    \ as well as processing and storing them in a reliably secure manner. Therefore,\
    \ in no respect can this layer of verification be construed to mean a shift or\
    \ relegation of this responsibility.\n\n    It is also important to realize that\
    \ hackers can be patients too (or pose as one). Hence, security measures must\
    \ be in place in this context to verify the identities of individuals (patients)\
    \ requesting access to healthcare data over eHealth deployments, and also to ensure\
    \ that these individuals (patients) are only able to access their data, their\
    \ data alone, and nothing but their data.\n\n    Biometric authentication has\
    \ frequently been explored as a foolproof way of verifying individual identities\
    \ for this purpose. Additional measures like firewall restrictions, honeypots,\
    \ and intrusion detection/prevention systems, have also been applied in several\
    \ contexts to restrict what can be accessed and viewed under such circumstances,\
    \ while also watching for anomalous behaviours that are suggestive of malicious\
    \ intent and operations.\n\n2.  Maintain log files at various points in the data\
    \ processing and operations chain, for the purpose of tracking and checking whenever\
    \ errors are suspected or confirmed. Audit logs are indispensable to the goal\
    \ of ensuring integrity in the management of electronic medical/healthcare data\
    \ and information. This is because in many cases, when infractions are being investigated,\
    \ audit logs provide a way of establishing or disproving corporate irresponsibility\
    \ on the part of the healthcare organization. Beyond this, it also helps healthcare\
    \ organizations during routine checks, to be able to flag red points in their\
    \ operations and process chains, which could compromise their risk standing.\n\
    \n    All of these are possible because audit logs help to trace the points of\
    \ origin when integrity issues emerge. It provides a means of identifying what\
    \ might have been the cause of such issues, as well as determining what technical,\
    \ structural, or operational measures would have helped avert such occurrences\
    \ at the organization-wide level.\n\n## Safeguarding Privacy\n\nEven though the\
    \ term “privacy” continues to feature in discussions around healthcare cybersecurity\
    \ incidents, the term itself has no universally accepted definition, except such\
    \ as is defined within the context of regulations that are binding in particular\
    \ jurisdictions. This is because privacy, in its essence, has more personalistic\
    \ dimensions with overlapping considerations that regulations often struggle to\
    \ capture adequately in a single body of specifications. These include bodily\
    \ integrity, personal dignity, secrecy & seclusion (that is, identification, non-identification,\
    \ or selective identification), and agency/individual autonomy, to mention a few.\
    \ The major struggle of regulations is to balance the various interests of all\
    \ privacy stakeholders across these several dimensions.\n\nHowever, privacy remains\
    \ a top consideration whenever infractions occur against healthcare/medical data\
    \ and information. In essence, when healthcare cybersecurity incidents happen,\
    \ stakeholders seek to establish whether the trust reposed in healthcare organizations\
    \ to effectively safeguard and secure the patients’ data and information that\
    \ they collect and hold in confidence has in any way been downplayed, so as to\
    \ ascertain how efficiently they had fared in this responsibility.\n\nPrivacy\
    \ policies help to align the business interests and goals of healthcare organizations\
    \ with the responsibility of safeguarding privacy. Even though beyond this, healthcare\
    \ organizations are often additionally required by regulation to have in place\
    \ a robust risk management plan that would help them to proactively assess, detect,\
    \ mitigate, and respond effectively to risks that endanger patients’ medical data\
    \ and information.\n\nFurthermore, regulations in certain jurisdictions (such\
    \ as the GDPR of the European Union) have specified best practices aimed at preserving\
    \ privacy from an organizational-to-user standpoint. These include\n\n1.  Removing\
    \ personally identifiable information from healthcare/medical data that are collected\
    \ about patients, and sometimes mapping these to pseudo-identities or special\
    \ tokens that help to uniquely distinguish records pertaining to particular individuals\
    \ within digital operations and processes, without necessarily identifying such\
    \ individuals personally – a technique known as *Anonymization/Pseudonymization*.\n\
    \n2.  Collecting very limited amounts of data and information that can be used\
    \ to uniquely identify patients, which is intuitive because the lesser the amount\
    \ of personal data and information that is required of patients who patronize\
    \ healthcare services, the easier it is to keep such personal data and information\
    \ undisclosed (since disclosure imposes upon the one to whom is being disclosed,\
    \ the responsibility of preserving privacy), thereby reducing the surface areas\
    \ of potential internal and external threats – a technique known as *Minimization*.\n\
    \n3.  Ensuring that privacy considerations are embedded into the very foundational\
    \ stages of conceptualizing, designing, and engineering software and systems for\
    \ use in healthcare – an approach known as *Privacy by Design*.\n\nPrivacy by\
    \ Design can be pursued by making certain that (a) the most stringent privacy\
    \ settings are activated by default in new systems and software (otherwise called\
    \ *Privacy by Default*), (b) proactive privacy measures are incorporated, so that\
    \ risks to privacy can be anticipated and forestalled even before they materialize\
    \ as breaches/incidents, (c) end-to-end security techniques are applied to enforce\
    \ privacy throughout the life cycle of data processes and operations, and (d)\
    \ sensitive data and information are computed and processed securely at all times,\
    \ at all points, and for all purposes. These are to mention a few.\n\nBut then,\
    \ Privacy and Confidentiality share a rather interesting relationship. While Privacy\
    \ is the end, Confidentiality is the means. In other words, it is the imperative\
    \ of safeguarding Privacy that imposes upon healthcare organizations the responsibility\
    \ of ensuring Confidentiality.\n\n## Ensuring Confidentiality"
