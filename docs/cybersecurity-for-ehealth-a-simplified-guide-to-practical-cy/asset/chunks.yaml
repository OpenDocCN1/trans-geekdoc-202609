    \ is a social engineering technique that might be applied to deduce non-public\
    \ URLs, and memorize login passwords, and usernames, is mindful about entering\
    \ personal credentials and accessing private work interfaces on shared computers\
    \ in crowded public spaces.\n\n4.  Know the likely mediums for propagation and\
    \ amplification for imminent and ongoing threat situations, deploying various\
    \ tools and techniques. Threat situations, particularly when they have become\
    \ successful or begun to have a foothold, often explore avenues for propagation,\
    \ in order to amplify the impact of their malicious operations. Being able to\
    \ effectively circumvent and immobilize them at this point is perhaps the holy\
    \ grail of containment goals.\n\n    However, as a user, it is not possible to\
    \ achieve this promptly and effectively without a shrewd (and sometimes in-depth)\
    \ knowledge of the kind of threat actor involved, and the type of tools or techniques\
    \ deployed as part of the threat operations. By knowing what type of tools or\
    \ techniques are being deployed, as well as the methods of propagation or amplification\
    \ that have been known to be explored by such tools and techniques in operation,\
    \ it becomes possible to foretell the potential impact of such a threat situation.\
    \ This makes it possible to forestall or truncate impact effectively, before irreversible\
    \ or critical damage occurs.\n\n    For instance, worms typically propagate autonomously\
    \ by spreading across devices connected to a network. Thus, an effective approach\
    \ to circumventing and containing an identified worm threat on a medical system/device\
    \ connected to a corporate production network would probably begin with taking\
    \ that device off the network. In the same way, following the detection of a bot\
    \ infection on a user computer, an effective approach to circumventing the threat\
    \ operation would probably begin with shutting down remote communications to and\
    \ from the machine, in order to liberate such a machine from the coordinated control\
    \ of the remote attacker. These are frequently used approaches, and work reliably.\
    \ It even featured in a recent report about a June 2020 cyber-attack against Life\
    \ Healthcare Group\n\n    However, and particularly as a (non-technical) user,\
    \ it is important to understand at this point, the far-reaching consequences of\
    \ such actions. It is also critical to consider the extent possible risk to which\
    \ certain other organizational processes and operations (some of which could even\
    \ be security-related) that could result from an action of personal cybersecurity\
    \ undertaken to safeguard a system or device under threat.\n\n    Investigations\
    \ by the United States Department of Health and Human Services (HHS) Office for\
    \ Civil Rights (OCR) into a 2010 data breach involving the New York-Presbyterian\
    \ Hospital (NYPH), was traced to a Columbia University (CU) professor-physician\
    \ having disconnected a personal device that had been connected to the NYPH network\n\
    \n    The professor-physician, who recently developed software solutions for the\
    \ hospital, had deactivated the device – a personally owned server. However, the\
    \ absence of effective technical safeguards and organization-wide apparatuses\
    \ for information risk management consequently resulted in a leak that made some\
    \ 6,800 patient health information (including vitals, medications, lab results,\
    \ and overall health status) accessible over the open Internet. In 2014, both\
    \ organizations had to pay an aggregate of 4.8 million dollars in damage settlement\
    \ under the Health Insurance Portability and Accountability Act (HIPAA), as an\
    \ outcome of this non-malicious human action.\n\n    Now, there is no evidence\
    \ to suggest that the action of the professor-physician was a form of threat response,\
    \ or that the action had a malicious intention, even though investigations revealed\
    \ that neither of the corporate entities involved had taken adequate steps to\
    \ ensure that the server was secure and that it contained appropriate software\
    \ protections. However, this incident does provide insight into the fact that\
    \ non-malicious and well-intended user actions, even when geared towards enhancing\
    \ safety and security, could ultimately prove inimical to corporate security interests,\
    \ especially without having considered such actions robustly and shrewdly.\n\n\
    \    So, ultimately, if any user actions at circumventing threat situations would\
    \ be considered effective in the long run, then the appropriate technical support\
    \ and security teams of the healthcare organization must be promptly and expeditiously\
    \ notified at the point where such actions are being considered in the very first\
    \ place, or immediately such actions are executed (in the worst case). This would\
    \ help avert disruptions in downstream business operations that might be reliant\
    \ on the disabled workstation, and which could be equally critical to business\
    \ processes and the security status of the organization.\n\n5.  Observe for signs\
    \ of deviation in performance efficiency, and changes in normal operational behaviour\
    \ by assets under personal stewardship or custody. Diminishing performance efficiency\
    \ or sudden changes in normal operational behaviour are common obvious manifestations\
    \ of impending and ongoing threat situations – often characterized by noticeable\
    \ deviations in the normal patterns of efficiency, performance, and operational\
    \ behaviour.\n\n    For instance, when systems and devices suddenly begin to slow\
    \ down with ads and prompts sprawling about, or network connections and services\
    \ begin to throttle or fail, or the abrupt lockout of authentication and access\
    \ credentials. If there is no other higher-level technical explanation for these\
    \ occurrences, then they could well be indicative of ongoing malware exfiltration\
    \ or MITM operations on packets, data, and information. They could also signal\
    \ malicious attempts to compromise the availability of network-based services\
    \ for accessing client data; and efforts aimed at impersonating an authorized\
    \ digital identity, respectively.\n\n    Indeed, a perceptive Intuition for Security\
    \ would be one that is quick to suspect these occurrences as having possible malicious\
    \ undertones.\n\n6.  Understand what lines of defence are in place to inspire\
    \ and support personal cybersecurity efforts towards securing and safeguarding\
    \ organizational assets in personal custody, and cooperate with them. These lines\
    \ of defence could exist in settings on systems, software, and devices; infrastructure\
    \ configurations; policy provisions; or established security protocols/processes/operations.\n\
    \n    For instance, some healthcare organizations configure robust device policies\
    \ on corporate systems and devices, some of which enable remote tracking and/or\
    \ erasure of certain classes of devices that fail to connect to the secure corporate\
    \ infrastructure every few hours. Others have in place, robust firewalls and systems\
    \ for intrusion detection and prevention, as well as routines for automatic backups\
    \ on a periodic basis. There are also those that maintain up-to-date corporate-level\
    \ anti-malware products and services. In addition, there are equally healthcare\
    \ organizations that deploy very strong password and authentication policies (including\
    \ two-factor authentication, and logon timeout) across the board, or across certain\
    \ critical levels of user operations. Likewise, there are healthcare organizations\
    \ with device sign-in policies that photograph users and automatically activate\
    \ device tracking after a maximum number of failed sign-in attempts."
