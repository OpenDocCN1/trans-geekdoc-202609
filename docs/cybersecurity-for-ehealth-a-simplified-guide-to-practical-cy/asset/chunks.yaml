  trans: '

    通常，攻击者通过在医疗机构现场的物理事件和活动来实现这一目标，这可能涉及天真或蓄有恶意的内部人员操作。尽管如此，通过系统性地颠覆或绕过医疗机构政策条款的规范，这些威胁往往会逐渐且有系统性地侵蚀组织政策的边界和限制。从长远来看，这暴露并延续了关键漏洞，可能为恶意行为者开辟阻力极小甚至几乎毫无障碍的路径。


    2009 年 1 月 16 日，美国健康与人类服务部（`HHS`）与该国最大的药店连锁 `CVS Pharmacy, Inc.` 达成了一项金额为 225
    万美元的和解协议。根据一份调查报告，“CVS 未实施适当的政策和程序，以在处置过程中合理且恰当地保护受保护的健康信息”。报告进一步指出，“CVS 未能对员工如何妥善处置此类信息进行充分培训”，并且“没有对未能遵守其处置政策和程序的员工成员维护并实施制裁政策”。


    该调查始源于这样一项发现：CVS 随手将装有患者受保护健康信息（姓名、地址、药物和其他个人身份信息）的药瓶丢弃在公众可以进入的开放垃圾堆中。这可能侵犯了其数百万患者的隐私。


    这一事件为适用于医疗机构流程、运营以及医疗机构政策的网络安全威胁格局提供了深刻的见解。


    ## 风险因素有哪些？


    有几个风险因素有时有助于为针对人员/用户、系统与设备、基础设施、流程和运营中的安全疏忽以及政策漏洞的网络犯罪分子铺平道路，使其能够接触到医疗机构的资产。尽管如此，当威胁针对流程/运营和政策规范时（特别是带有恶意意图时），它通常是更大计划的前奏，而该计划的成功取决于目标医疗机构薄弱的安全文化。一些医疗机构认为，基础网络安全培训仅对其技术人员或支持人员是必要的，这通常归咎于资金限制，以及某些职位职能上被认为是非技术性的。更糟糕的是，许多医疗机构（特别是在发展中国家）未能聘用或定期签约网络安全专家和人员，尽管他们拥有大量的电子健康（eHealth）产品和服务。然而，当涉及到电子健康背景以及可能的其他网络安全领域时，医疗机构入口处的守门人和接待人的角色对于保护网络安全的重要性与几层之
    IT 经理同样关键。


    守门人如果了解恶意行为者可能如何通过搭便（piggybacking）和尾随（tailgating）等手段寻求对医疗设施的未经授权的物理访问，并在设施内部及周围的任何
    way 进入点或遇到未能及时正确确认身份的陌生人时，他们要注意什么。如果该个人还理解在公司环境中植入硬件键盘记录器或网络嗅探器可能导致的风险，情况会更理想。


    同样，考虑一名清洁工，他理解通过搜寻被丢弃的存储设备、带有个人信息的便利签、未粉碎的公司文档或不再使用的被随手丢弃的公司系统，如何为恶意行为者提供实用信息，以危及医疗机构的网络安全状态。这样的人会对组织使用的中转垃圾场或垃圾收集点的无身份陌生人保持警惕。


    一种日益增长的做法是人员/用户在多个网络服务和应用程序中使用相同的凭据（用户名和密码），这是另一个不容忽视的强大风险因素。一份安全报告 ![图 2.4 医疗健康网络安全事件
    – 风险因素。](img/fig7_B.jpg)


    图 2.4 医疗健康网络安全事件 – 风险因素。


    然而，另一个在医疗安全流程和运营颠覆中常见的因素是由于熟悉、天真和人情关系而导致的疏忽。根据 20 世纪美国作家比尔·冯（Bill Vaughan）的说法，“熟悉是所有破坏者中最具破坏性的”；职业教练
    Brittany Burgunder 补充道，“仅仅因为某事是熟悉的，并不意味着它是安全的。仅仅因为感觉安全，并不意味着它对你有好处”。医疗机构的安全人员更有可能颠覆/绕过安全协议、流程和运营，为一个仅仅在设施中已变得面面的陌生人提供访问，或为一个未能提供访问设施授权的亲属提供访问。同样，当涉及到亲属或其他熟悉的人时，员工/用户更有可能对个人凭据、数据、设备的安全性产生疏忽。


    此外，设计不良的医疗应用程序未能设计中稳健地整合安全协议和保护措施——如密码加密、输入验证/错误检查、安全套接字通信、双重身份验证、访问/登录超时等——会变成该应用程序收集、生成或访问的用户数据的危险。通过非常简单且不复杂的工具和技术（其中许多是互联网上免费提供的或具有公开源代码、只需编译运行的软件），敏感的用户数据可能会被恶意行为者窃取。


    然后，某些医疗系统（硬件和软件）以及设备未采用安全设计和卫生的最佳实践——例如最新的防病毒程序、防火墙策略、广告和跟踪器拦截器、针对拦截进行加固的操作，以及具有防重构韧性的接口——这些本身可能成为对医疗数据和信息的威胁。例如，一个具有可区分按键声的安全密码键盘，或使用无法抵御频繁重复触摸模式磨损的硬件设计的设备。随着时间的推移，这可能对用户数据、访问凭据和其他关键信息构成巨大威胁。


    同样，某些医疗组织政策未能防止，或无意中授予了用户比有效履行其职位职责所需的更多的组织系统/设备及基础设施访问权限。这对数据和信息构成了隐蔽的危险，因为这些用户变成了恶意行为者更愿意探索以获取资产的直接通道。


    此外，还有一些制造商已发现漏洞的遗留医疗系统；但这些系统在各种医疗流程和运营中仍在使用，且尚未发布修复这些漏洞的安全更新程序。事实上，这类似于一个众周知没有锁的房子，但仍被用作各种用户贵物品的仓库。

    '
