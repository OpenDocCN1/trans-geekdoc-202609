  trans: '


    # 工具与技术


    `Tools and Techniques` 包括了恶意软件（勒索软件、木马、病毒、间谍软件、根内核、逻辑炸弹、蠕虫和自动运行脚本）、数据恢复软件、网络钓鱼/语音诈骗、扫描器与跟踪器、尾随进入、窥视偷视、数据包追踪器、网络协议与服务中的隐藏隧道、跨站脚本
    (XSS)、SQL 注入、信号干扰器/干扰发生、网络嗅探器与分析仪、键盘记录器、抢劫、机器人和机器人网络。


    在实践中，工具和技术作为方法/策略/手段的一部分被整合，这些手段被纳入 `Threat` 目标的框架内，其旨在产生被称为网络安全事件的结果。但在实践中发现，多个威胁目标可以包含不同的方法/策略/手段，而这些方法反过来又会大量大量的工具和技术（特别是涉及恶意意图时），引发网络安全事件。


    例如，作为导致医疗系统故障的威胁攻击目标的一部分，诱导性故障可能通过权限提升开始链链，该提升过程整合了一种欺骗技术，试图在系统眼中冒充授权的数字身份；随后在系统或设备上加载恶意软件或执行
    SQL 注入。同样，一种为了财务利益而寻求破解电子健康记录的威胁攻击策略可能会利用基于硬件或软件的网络嗅探器和数据包分析仪，这种技术的特征是利用医疗机构现场的物理事件来捕敏感信息（例如访问凭据），作为整合了内部人员操作的协调数字拦截策略的一部分。


    ## 相关人员/用户


    在医疗领域的网络安全威胁格局中，人员/用户是频繁的目标。正如第一章 所述，这是因为他们往往是全球医疗健康部门中高价值资产的“软性目标”。有时，对用户的威胁可能源于同一流程/操作链中其他用户的意识行为或无意行为。其他时候，它们可能是恶意外部人员的针对性尝试，旨在利用推断出的、感知或披露的漏洞来获取财务利益。


    通常，当威胁和攻击针对医疗行业的人员/用户时，他们往往瞄准的是关于他们的敏感 `Data` 以及他们持有的 `Access Credentials`。也许，这些威胁/攻击渗透和传播最常见且最流行的途径是通过社会工程学。


    社会工程学采用了多种方法。这可能包括诱导个人去做他们不太可能做的事。


    社会工程学通常寻求利用认知偏差（有时被称为“人类漏洞”）以及心理倾向。恶意行为者之所以青睐社会工程学，也许是因为它不需要技术知识，并且通常提供了一条阻力最小的路径。


    这样想：为什么一个寻求获取敏感且高价值医疗数据的恶意个人，要花费这么多时间去编写复杂的恶意软件，将其作为稳健攻击方案的一部分来攻破高度安全的服务器和系统呢？相比之下，他们可以简单地：


    *   （注：下列表遵循所提供文本的逻辑）


    网络钓鱼（Phishing）和语音诈骗（Vishing）是针对医疗行业人员/用户的常用社会工程学方法。当这种行为通过语音（如电话）实施时，被称为语音诈骗（Vishing）。然而，当它通过基于文本（如电子邮件、即时消息）实施时，被称为网络钓鱼（Phishing）。


    社会工程学的其他方法包括尾随进入（piggybacking or tailgating）——这是一种秘密接近具有安全医疗设施/区域访问权限的人的做法。此外还有窥视偷视（shoulder-surfing）技术，用于在进入时观察并可能记忆安全凭据，如用户名、密码、PIN
    码和信用卡详情。


    '
