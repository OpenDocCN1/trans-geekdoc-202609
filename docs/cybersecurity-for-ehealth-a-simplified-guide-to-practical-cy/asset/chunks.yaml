- raw: "For the non-technical healthcare stakeholders (medical professionals, healthcare\
    \ workers, regulatory and compliance agencies, health centre managers, administrators\
    \ & insurers, clients/patients, and third-party vendors) who typically lack in-depth\
    \ technical competence in the practical workings and operations of eHealth systems\
    \ and infrastructures, and without sophisticated knowledge of the procedures and\
    \ best practices for effective cybersecurity, the information in this Book would\
    \ be useful in equipping them with the practical knowledge and insights that are\
    \ needed to navigate the everyday realities and challenges of cybersecurity in\
    \ the delivery of healthcare services.\n\nHowever, it is necessary to stress that\
    \ at organizational/corporate levels, it is important that adopting and applying\
    \ the information and recommendations provided in this book are done in consultation\
    \ with technical experts and professionals who would help guide and contextualize\
    \ these information and recommendations to align with the operational realities\
    \ and goals of the organization. The importance of this cannot be exaggerated.\n\
    \nFurthermore, it is hoped that the book would also have some appeal for (cybersecurity)\
    \ enthusiasts generally and even in the affiliated/adjoining sectors of global\
    \ healthcare, who are looking to have a foundational understanding of the cybersecurity\
    \ threats and risks that pertain to the healthcare sector, while also providing\
    \ a useful utility for facilitators and instructors who design, create, and facilitate\
    \ training programs in healthcare information technologies, either as part of\
    \ formal medical/nursing school degree, certificate, or diploma training, or as\
    \ post-qualification continuing education programs in healthcare, medicine, public\
    \ health, or nursing.\n\nIn addition, it is also expected that the language, structure,\
    \ and design of the Book would resonate with Medical Boards, Nursing Councils,\
    \ Public Health Professional Societies, and other Healthcare Bodies/Associations\
    \ at national and regional (or international) levels. In this regard, it is anticipated\
    \ that success would come on the heels of the reality that while the subject area\
    \ remains one that is of much contemporary relevance, the short supply of rudimentary\
    \ training resources targeting non-technical audiences poses an obstacle to the\
    \ effectiveness of training programs in the subject domain. It is within this\
    \ gap that this Book has provided a befitting resource that is relevant to the\
    \ reality and necessities of this problem.\n\nBut ultimately, armed with the broad\
    \ insights and perspectives provided in this Book, which have been accumulated\
    \ from across several organizational and national contexts, it is hoped that healthcare\
    \ stakeholders who seek to do their part towards quelling the tides of cyber incidents\
    \ and attacks that continue to destabilize the global healthcare industry would\
    \ find a useful and practical guide for progress and success in this pursuit.\n\
    \n## Notes\n\n1.  [World Health Organization (WHO) (n.d.). *eHealth Governance*](#ch6.xhtml#R_en6_1).\
    \ [https://www.who.int/ehealth/governance/en/](https://www.who.int)\n\n2.  [Wilson,\
    \ P. (2012). Legal frameworks for eHealth. *Global Observatory for eHealth series\
    \ – Volume 5*](#ch6.xhtml#R_en6_2). World Health Organization (WHO). [https://www.who.int/goe/publications/legal\\\
    _framework\\_web.pdf](https://www.who.int)\n\n3.  [United Nations (2015). *Universal\
    \ Declaration of Human Rights (UDHR)*](#ch6.xhtml#R_en6_3). [https://www.un.org/en/udhrbook/pdf/udhr\\\
    _booklet\\_en\\_web.pdf](https://www.un.org)\n\n4.  [Council of Europe (2013,\
    \ October 02). *European Convention on Human Rights*](#ch6.xhtml#R_en6_4). [https://www.echr.coe.int/documents/convention\\\
    _eng.pdf](https://www.echr.coe.int)\n\n5.  [United Nations (1966). *International\
    \ Covenant on Civil and Political Rights*](#ch6.xhtml#R_en6_5). UN Office of the\
    \ High Commissioner on Human Rights. [https://www.ohchr.org/en/professionalinterest/pages/ccpr.aspx](https://www.ohchr.org)\n\
    \n6.  [Council of Europe (2020, December 31). *Guide on Article 8 of the European\
    \ Convention on Human Rights*](#ch6.xhtml#R_en6_6). European Court of Human Rights.\
    \ [https://www.echr.coe.int/documents/guide\\_art\\_8\\_eng.pdf](https://www.echr.coe.int)\n\
    \n7.  [The African Union Commission (2014, June 27). *African Union Convention\
    \ on Cyber Security and Personal Data Protection*](#ch6.xhtml#R_en6_7). [https://au.int/en/treaties/african-union-convention-cyber-security-and-personal-data-protection](https://au.int)\n\
    \n8.  [Orrell, T. (2015, November). *The African Declaration on Internet Rights\
    \ and Freedoms: A Positive Agenda for Human Rights Online*](#ch6.xhtml#R_en6_8).\
    \ Global Partners Digital. [https://www.gp-digital.org/wp-content/uploads/pubs/african-declaration-a-positive-agenda-for-rights-online.pdf](https://www.gp-digital.org)\n\
    \n# Glossary of Definitions\n\n**Access Authentication:**\n\n: An access control\
    \ measure that requires authorized entities to confirm or verify their person\
    \ and identity by providing certain information (that is usually confidential\
    \ or unique), prior to gaining access to a system or network. \n\n**Access Control:**\n\
    \n: These are measures that are put in place to restrict entry and engagement\
    \ with a system or network to only such entities that are authorized. \n\n**Anonymization:**\n\
    \n: The practice of removing all personally identifiable information from a body\
    \ of data, such that it becomes impossible to identify the original data subject(s)\
    \ by any means at all. \n\n**Anti-malware:**\n\n: A device or application that\
    \ provides protection against various malware. \n\n**Bot:**\n\n: A software program,\
    \ device, or system that is able to receive, process, and execute commands/instructions,\
    \ such that enable it to perform pre-defined tasks and operations in a repetitive\
    \ manner that can be automated. \n\n**Botnet:**\n\n: A collection of infected\
    \ or compromised systems and devices that are under the control of an attacker,\
    \ and can be deployed to perpetrate and amplify the impact of malicious operations\
