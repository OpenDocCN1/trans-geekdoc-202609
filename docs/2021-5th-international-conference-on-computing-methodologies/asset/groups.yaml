    # V. CONCLUSION


    In this paper, the Linear Regression-K Neighbor and Artificial Neural Network
    are used to obtain the inverse kinematics of Pioneer 2 robot. The forward kinematic
    equations are utilized to train the data set for machine learning. The difference
