    # 基于三次样条插值的 Pioneer 2 机械臂轨迹规划逆运动学机器学习研究


    M Arunadevi

    机械工程教授

    DSCE, 班加罗

    arunadevi@gmail.com


    Praveen J Jadhav

    机械工程博士读研究生，

