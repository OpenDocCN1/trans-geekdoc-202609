    # V. 结论


    本文中，线性回归和人工神经网络用于获取机器人的逆运动学。正向运动学方程用于训练机器学习数据集。与 ANN 相比，线性回归提供了更好的结果。然后可以使用 KNN
    快速获得逆运动学的更好解决方案。准确性取决于数据质量，这需要更多的空间和相关特征。相同的方法适用于具有不同学习算法的不同机器人。


