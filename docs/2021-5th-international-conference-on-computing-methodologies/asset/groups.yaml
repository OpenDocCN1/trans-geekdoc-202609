    # Theta 5


    ### 3) 人工神经网络


    网络中排列了多层神经元，如输入层、隐藏层和输出层。每个神经元接收输入并赋予某些权重或通过函数输出输出。激活函数是权重和输入的函数。合适的激活函数可以提供更好的输出预测。模型的准确性仅取决于权重值。


    ### C. 模型验证


    验证是检查创建数据准确性的过程。在每个数据科学中，细节都将构建在测试集中，用于测试创建的模型，而训练集将用于训练模型。


    # IV. 结果与讨论


    算法的模型构建、训练和测试均使用 python3 完成。线性回归、KNN 和 ANN 算法工具被用于建模和测试。在这项工作中，我们的数据集是使用正向运动学生成的。首先针对以
    mm 为单位控制的关节和输入变量 X、Y 和 Z 生成了数千个样本。在不同机器学习技术的训练、测试和验证中，使用了这些生成的数据。


    图 3 显示了针对每个关节变量与预测 Theta 值进行验证的三种算法。通过对上述图的观察可以发现，与 ANN 和线性属性相比，使用 KNN 实现了更好的拟合效果，属性
    R=91.85 清楚地显示出只有 KNN 算法具有更好的特性。在 KNN 中，点均匀分布在零线周围且具有非常高的 R 方值，证明了 KNN 算法提供了更好的结果。


    # 关节变量的 R 值


    | 技术 | R 方值 |

    | --- | --- |

    | LR | 91.3% |

    | KNN | 99.4% |

    | ANN | 60.5% |


    使用 k-NN 算法得到的 R 方值为 (90.4%)。使用 ANN 和线性回归得到的 R 方值分别为 (91.3%) 和 (60.5%)，如表 3 所示。


    RMSE 值通过改变数据集训练大小的百分比（60% 到 90%）计算得出，并绘制在图 4 中，这再次证明了 KNN 算法在不同百分比训练数据集下的 RMSE
