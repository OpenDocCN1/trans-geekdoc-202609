    |


    定义了不同的关节范围和常量以寻找逆运动学。


    ### 表 II. Pioneer 机器人的关节变量


    | 关节 | $\theta_i(deg)$ | $d_i(mm)$ | $a_i(mm)$ | $\alpha_i(deg)$ |

    | :--- | :--- | :--- | :--- | :--- |

    | 0 | $\theta_1=180$ | $d_1=150$ | 0 | -90 |

    | 2 | $\theta_2=180$ | | $a_2=145$ | 0 |

