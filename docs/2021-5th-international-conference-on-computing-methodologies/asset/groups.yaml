    **Abstract—** The primary objective of robot manipulator is to achieve the desired
    orientation and end point of the pre-established task. Inverse kinematics analysis
    is used in the Pioneer 2 manipulator to obtain a successful solution to design
    the arm. This paper presents a 5-DOF manipulator which is compact, light and with
    low cost. When the DOF of the robot increases, the inverse kinematics becomes
    more complex and difficult to solve for the same position. This results in making
    the standard solution for such problems tricky. To overcome the complexity of
    inverse kinematics analysis of the Pioneer 2 robot, we used the computation of
    inverse kinematics with the use of machine learning techniques that consist of
    linear, regression, R, and KNN. By comparing three algorithms R-square values
    and RMSE, it is observed that KNN is better than others to solve inverse kinematics
    with fast results and high accuracy. The smooth trajectory is achieved using cubic
    spline interpolation.


    **Keywords—Kinematics, KNN, ANN, Regression, Pioneer Manipulator, Machine Learning,
    Cubic Spline interpolation.**


    # I. INTRODUCTION


    Industrial robots or automated machines are used in industries for process which
    require high precision, flexibility and repeatability that manual labor cannot
    provide. Control of the robot is the main area in robotics. For forward kinematics
    also the result of the motion depends on particular values of the joint parameters
    using equations used for cubic interpolation. Inverse kinematics makes a use of
    orientation and joint variable in Cartesian space to find the joint values in
    joint space.


