    # B. Objective


    To overcome the computational complexity of analysis of Pioneer 2 robot, the objective
    of this study is to perform intelligent computation of inverse kinematics with
    the help of machine learning algorithms such as linear regression, K-Nearest Neighbor
    algorithm and Artificial Neural Network.


    # III. METHODOLOGY


    This paper considers a 5-dof Pioneer 2 manipulator which is compact, low cost
    and lightweight. If the degrees of freedom is 3 (high) also or redundant, then
    inverse kinematics solutions will become more complex and given number of joint
    configurations for the same position.


    In this study, data is generated using forward kinematics of a Pioneer 2 robot.
    Modelling of different machine learning algorithms is done using the generated
    data. The joint variables can be predicted using the machine learning models.
    Finally accuracy of algorithm is compared and best algorithm will be selected
    for the future predictions. The same is explained using the flowchart given Figure
    2.


