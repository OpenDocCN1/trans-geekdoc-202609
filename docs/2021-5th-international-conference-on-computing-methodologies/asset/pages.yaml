    # V. CONCLUSION


    In this paper, the Linear Regression-K Neighbor and Artificial Neural Network
    are used to obtain the inverse kinematics of Pioneer 2 robot. The forward kinematic
    equations are utilized to train the data set for machine learning. The difference
    of Linear Regression gives better results compared to ANN. Then KNN can be used
    better solution of inverse kinematics with fast results and accuracy. Comprehensive
    complexity of inverse kinematics can be solved using forward kinematics with machine
    learning algorithms. Using KNN accuracy depends on quality of data, which requires
    more space and sensitive to relevant feature. The same methodology can be applied
    for different industrial robots with different learning algorithms.


