- raw: "^([3](#ch13.xhtml#ich13fn3)) Musavuli Nzanzu Guylain, Vambe, et al. “Integration\
    \ of ICT in Health Service Management in Health Africa Hospital in DR Congo.”\
    \ Global Journal of Engineering, Design, and Technology, vol. 2, no. 3, 2013,\
    \ pp. 52–59., [www.longdom.org/articles/integration-of-ict-in-health-service-management-in-heal-africa-hospital-in-drcongo.pdf](http://www.longdom.org/articles/integration-of-ict-in-health-service-management-in-heal-africa-hospital-in-drcongo.pdf).\n\
    \n^([4](#ch13.xhtml#ich13fn4)) Thielman, Sam. “Your Private Medical Data Is for\
    \ Sale – and It’s Driving a Business Worth Billions.” The Guardian, 10 Jan. 2017,\
    \ [www.theguardian.com/technology/2017/jan/10/medical-data-multibillion-dollar-business-report-warns](http://www.theguardian.com/technology/2017/jan/10/medical-data-multibillion-dollar-business-report-warns).\n\
    \n^([5](#ch13.xhtml#ich13fn5)) “MedicalChain: Is Blockchain Health Records the\
    \ Future? \\*Token Investor Point of View\\*.” Hacker Noon, June 2018, [hackernoon.com/medicalchainis-blockchain-health-records-the-future-token-investor-point-of-view-82755fd7fd9f](http://hackernoon.com/medicalchainis-blockchain-health-records-the-future-token-investor-point-of-view-82755fd7fd9f).\n\
    \n^([6](#ch13.xhtml#ich13fn6)) Daley, Sam. “15 Examples of How Blockchain Is Reviving\
    \ Healthcare.” Built In, July 2019, [builtin.com/blockchain/blockchain-healthcare-applications-companies](http://builtin.com/blockchain/blockchain-healthcare-applications-companies).\n\
    \n| ![image](images/ch-14.jpg) || **Use Case 6:  \n\nInsurance** |\n\n| --- |\
    \ --- |\n\nIn May 2016, five major insurance companies from around the world came\
    \ together to form Bi3 (Blockchain Insurance Industry Initiative), a consortium\
    \ and a vehicle for adopting and leveraging the blockchain technology. The creation\
    \ of Bi3 was on the back of an emerging trend, right after major banks and technology\
    \ companies had founded Hyperledger and R3, the two biggest blockchain consortiums\
    \ for the banking industry. The membership of Bi3 has only grown since. At the\
    \ time of writing this book, the number stands at close to 50 and includes the\
    \ likes of Allianz, Swiss Re, and Generali Group.\n\nInitially, Bi3 took a different\
    \ path from Hyperledger and R3 by experimenting with the Ethereum blockchain to\
    \ see if the second-largest blockchain would support specific solutions for the\
    \ industry. The latter two consortiums went straight into building their own blockchains,\
    \ which came to be known as private, permissioned distributed ledger technologies\
    \ (DLT) or enterprise blockchains. Bi3, at some point, decided to move on and\
    \ embrace this new type of blockchain. But they did not build their own; in 2017,\
    \ they adopted the newly released Hyperledger Fabric.\n\nHowever, Hyperledger\
    \ Fabric apparently failed to meet its specific needs as Bi3 soon moved on to\
    \ Corda, the blockchain platform designed and built by R3. In July 2019, Bi3 released\
    \ its first application on Corda: B3i Cat XoL, which was specifically designed\
    \ and constructed to fix issues related to setting up and managing reinsurance\
    \ processes, contracts, and transactions.\n\n### **Blockchain benefits for insurance**\n\
    \nReinsurance is only one of the four primary areas of insurance that stand to\
    \ benefit from blockchain technology. The other three are (1) health and life\
    \ insurance, (2) fraud detection and prevention, and (3) property and casualty\
    \ insurance. Let’s look at how blockchain could disrupt each area of insurance.\n\
    \n#### **Reinsurance**\n\nReinsurance is a critical component of insurance. Without\
    \ it, businesses within the industry would fail more often. Even though insurance\
    \ companies cover risks and fund claims, they need to make a profit, which is\
    \ the primary motivation of any business or investment in the sector. An insurer\
    \ needs to make enough to settle claims, meet operational costs, and have some\
    \ balance as a return on investment.\n\nHowever, it is tough to predict the extent\
    \ of probable damages and how much claims the insurance company might be required\
    \ to pay out. In all possibility, an incredibly colossal claim might come along\
    \ and threaten not only the profit margin of the business but also its ability\
    \ to continue operating. For example, if an insurer covers earthquake-related\
    \ risks, it might find itself settling a lot of claims if there is a major earthquake\
    \ in several cities and towns, where most of their clients live. Or in a cover\
    \ against fire, a large section of the city could up in flames, affecting many\
    \ of its clients. In these situations, the insurance company could find itself\
    \ writing more checks than it can afford to fund and easily go out of business.\n\
    \nReinsurance was invented for this reason, as its arrangement helps insulate\
    \ insurers from huge claims that could destabilise them financially. Simply put,\
    \ an insurance company enters into an arrangement with another or several other\
    \ insurers so that they share risks. Thus, in case of really huge claims, each\
    \ takes care of a smaller portion. Expectedly, such a contract includes splitting\
    \ the premiums paid by the insured.\n\nThis form of spreading risk is borrowed\
    \ from the practice of ancient Chinese traders. When shipping goods from their\
    \ source to the market, each trader would give out portions of their goods to\
    \ be carried in other trader’s vessels. In return, they also received portions\
    \ of the goods of others on their vessel. Even if one vessel got lost and every\
    \ trader in the group may lose a portion of their goods, none would lose an entire\
    \ stock.\n\nSimilarly, with reinsurance, each insurer chooses to share their risk\
    \ with others. It also receives some of the risks of others. Thus, should a major\
    \ claim arise, no single insurance company would have to carry the entire burden\
    \ alone^([1](#ch14.xhtml#ch14fn1)).\n\nThis arrangement has always been at a cost,\
    \ though it serves the insurers well. The participants have to go through a long\
    \ process of negotiations, including back and forth paperwork. As one can imagine,\
    \ it requires multiple contracts for the process of sharing risks among insurers,\
    \ the splitting of premiums, and the processing of claims. If, for example, a\
    \ policy is shared among ten insurance companies, then at least ten contracts\
    \ need to be negotiated, signed, and managed. A lot of effort is spent trying\
    \ to find consensus and build an environment of transparency for all stakeholders.\n\
    \nB3i identified this part of insurance as one needing the blockchain technology\
    \ the most, which is most likely why their first of its kind application, B3i\
    \ Cat XoL, happens to cater to it. It speeds up the process of negotiations, cuts\
    \ the paperwork involved, and facilitates the implementation and execution of\
    \ the contracts.\n\nIt is important to point out that the blockchain architecture\
    \ fits well with the reinsurance arrangement in the following ways: (1) each insurer\
    \ is an independent entity like a node on the blockchain network, (2) each insurer\
    \ has to trust the other on the network, (3) all insurers in the reinsurance arrangement\
    \ require a common truth, and (4) contractual terms guide the engagement amongst\
    \ the insurers.\n\nIn the reinsurance arrangement, no entity loses its independence;\
    \ each continues as a separate business with a working relationship with others.\
    \ Nevertheless, they need to have a close cooperation, including sharing information\
    \ and value from the policy they facilitate together. The blockchain replaces\
    \ the manual steps with a protocol, which speeds up the processes.\n\nThe blockchain\
    \ architecture facilitates smooth transactions among various independent entities.\
    \ All stakeholders could form a consensus in real-time, so that processes which\
    \ could have taken days or even months can be completed in a matter of minutes.\
    \ On insurance applications like the one B3i has designed and built, each broker,\
    \ insurer, or reinsurer is not really a node on a network. However, the technology\
    \ still provides them with a mechanism they form a consensus as independent players."
