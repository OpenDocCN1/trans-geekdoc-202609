    to more businesses and even individuals. Great strides are being made, especially
    as major technology companies with a lot of experience in leasing software as
    services, such as Microsoft, IBM, and Oracle, take a keen interest in blockchain.


    ^([1](#ch18.xhtml#ich18fn1)) Matthews, Kayla. “We’re Facing a Blockchain Talent
