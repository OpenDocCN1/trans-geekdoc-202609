    \n| ![image](images/ch-15.jpg) || **Use Case 7:  \n\nEnergy** |\n\n| --- | ---\
    \ |\n\nOne of the faults many find in the blockchain technology is its extreme\
    \ consumption of energy. The computers on a peer-to-peer network consume energy\
    \ in the process of forming consensus on the validity of transactions recorded\
    \ on the shared ledger. “Bitcoin is slowing the effort to achieve a rapid transition\
    \ away from fossil,” a *Wired* article declared in 2017. “Bitcoin trading uses\
    \ so much power that it could push global temperatures up past a threshold that\
    \ yields deadly consequences,” an article published in the Business Insider in\
    \ 2018 stated^([1](#ch15.xhtml#ch15fn1)).\n\n### **The blockchain “threat” as\
    \ well as cure?**\n\nWhile these statements are a little exaggerated and sensational,\
    \ their premise is not too far from being accurate. The Bitcoin blockchain, in\
    \ particular, is very energy-intensive. According to several studies, the Bitcoin\
    \ network consumes as much power as an entire country equivalent to Ireland or\
    \ Austria (which is about number 39th on the list of countries by electricity\
    \ consumption). Because of that, according to another study, it contributes as\
    \ much carbon emissions as the city of Las Vegas^([2](#ch15.xhtml#ch15fn2)).\n\
    \nFacts like these insinuate that the blockchain technology is not a solution,\
    \ but a threat or at least a great source of problems, when it comes to the issue\
    \ of energy and greenhouse gas emissions. However, once you scratch the surface\
    \ of the issue, you find out that, for the most part, the technology is a solution.\
    \ Indeed, one that could significantly change the energy sector for the betterment\
    \ of society.\n\nTo begin with, over time, the technology has proven that it can\
    \ check its consumption of energy as well as how much carbon it releases to the\
    \ atmosphere. It is now an accepted fact that blockchain does not need to consume\
    \ a colossal amount of energy for it to be functional. Indeed, we have seen the\
    \ rise of consensus protocols that make blockchain consume negligible amounts\
    \ of energy. Indeed, even some of the blockchains that were initially designed\
    \ with energy-intensive consensus mechanism, in particular, Proof of Work are\
    \ transitioning to less energy-intensive ones like Proof of Stake.\n\nFor example,\
    \ Ethereum, the second-largest blockchain in terms of market capitalisation, is\
    \ (as at the time of writing this book) in the process of moving from Proof of\
    \ Work to some form of Proof of Stake through its Casper core software implementation,\
    \ and that will enable it to cut up to 99 percent of its current energy consumption.\n\
    \nSome in the Bitcoin community have suggested that the Bitcoin consensus protocol,\
    \ which, as we have seen, consumes the most amount of energy, should be replaced\
    \ a less energy-intensive one. It is turning out to be a serious movement and\
    \ a likelihood that sometime in the future, Bitcoin will abandon Proof of Work.\n\
    \n### **Blockchain benefits for energy**\n\nHowever, blockchain is doing even\
    \ more than just embracing consensus protocols that reduce the amount of energy\
    \ it consumes. Indeed, this technology can provide solutions to the many problems\
    \ that the energy sector faces. Even more, it could be the foundation that spurs\
    \ incredible innovation in the energy sector.\n\nIn particular, the blockchain\
    \ technology offers the following four primary values to the energy sector: (1)\
    \ help with data management, (2) support new systems of energy distribution, (3)\
    \ serve as a mechanism for tokenising energy for more efficient management, supply,\
    \ and trading, and (4) be the backend technology for the transition to green energy.\n\
    \n#### **Data management**\n\nLet’s begin with data management.\n\nInformation\
    \ is at the core of how energy is produced, distributed, and consumed. Players\
    \ within the energy sector, in particular utility companies, need to collect,\
    \ process, store, and leverage data on such aspects as how much energy is produced,\
    \ the cost of producing and distributing it, the amount each end customer consumes,\
    \ and the billing process. The utility companies also need to track their assets,\
    \ capital, debts, and liabilities to prevent unnecessary loss. Indeed, the areas\
    \ of data management in the energy sector are very extensive when you consider\
    \ the entire supply chain.\n\n##### **The Kenya Power example**\n\nTo better explain\
    \ the existing need for a better data management system in the energy sector,\
    \ let us focus on an apt illustration from the retail part of the supply chain.\n\
    \nThe East African country of Kenya is turning out to be a home of innovations.\
    \ For example, the country was the first to embrace mobile money services and\
    \ has maintained the highest penetration of the service. Today, close to 96 percent\
    \ of households in the country have at least one mobile money service account."
