- raw: 'Now, let’s look at the second way blockchain could improve the energy sector.


    For a long time, the flow of electric energy was a one-way traffic. It started
    from a power generating entity, which produced the energy from a hydroelectric
    dam, a windmill farm, a geothermal plant, or a nuclear energy plant. This energy
    was then passed on to a utility company, which in turn sold it to the end consumer.
    In some cases, the energy-generating company was also the utility company handling
    the retail part of the supply chain.


    However, in the last decade, things have begun to change, and the supply chain
    has ceased being one-way traffic. The old model is being replaced with one where
    there is more energy being generated locally by many to supplement what comes
    from the primary supplier. It is now common around the world for consumers to
    generate electricity in particular from solar and wind. Many reasons exist for
    why it is becoming popular and easier to generate one’s electricity, including
    the fact that the technology needed has improved over the years. The solar panels
    and batteries necessary for local energy production have way higher capacity than
    those available a few years ago. Also, the global population has become a lot
    more aware of the need to protect the environment and understand that choosing
    greener sources of energy is one way to contribute to its protection.


    It turns out that with time consumers are generating more energy than they can
    consume. A few utility companies have put systems in place so that such consumers
    can release their surplus power to the grid so that others can use it. The most
    basic technology that supports this is a two-way meter and transformer, which
    can transmit energy both into and out of premises and homes. The resulting transaction
    is referred to as net metering.


    In a nutshell, when a solar panel or a windmill farm on the customer’s home or
    premises produces less than what the customer needs, the grid provides the extra
    amount of energy. On the other hand, if the solar panel or windmill farm produces
    more than the customer needs, the excess energy is released to the grid. The utility
    company sells and buys electricity from the customer depending on the customer
    production and consumption. At the end of the billing period, the net is calculated
    and settled accordingly. If the customer consumed more than they produced, they
    pay for the top-up that came from the grid. In the event they consumed less than
    they produced, the utility company owes them a revenue calculated on the pre-agreed
    rate per unit. The utility company can pay them in cash or carry the balance over
    to cancel out future transactions.


    Ultimately, net metering helps the consumers cut the amount of money they spend
    on power as well as gives them a source of revenue. Meanwhile, the power utility
    company has more ability to supply to other consumers connected to the grid and
    does not have to rely on a single energy supplier. Indeed, over time the utility
    company might get a significant part of the energy it distributes from its customers.
    Meanwhile, this model opens up the sector to healthy competition, which is beneficial
    to all stakeholders, especially as generating electricity for the grid might be
    a viable business for many. Moreover, consumer-generated power is cheaper. But
    more importantly, it is often more friendly to the environment.


    So what role does the blockchain play in this architecture?


    The blockchain technology can make this system of selling power to the grid even
    better by providing the mechanism of forming and executing contracts between the
    power company and consumers who sell back to the grid. Blockchain provides a means
    to facilitate transactions between the individual generators of energy and the
    utility company. The apt tools for this purpose include smart contracts and native
    means of payment (token or cryptocurrency).


    But more importantly, technology can support peer-to-peer transactions among consumers.
    We might see new infrastructures where people create networks through which they
    buy and sell energy among themselves without involving a third party. This stands
    to significantly cut the cost that consumers pay as the middle person with operational
    expenses, and the need for a profit margin is taken out of the equation. It might
    also help break the monopolies that have controlled the energy sector for far
    too long.


    Monopolies tend to lead to focus on the bottom line and profit margins. This would
    no doubt drive electricity costs higher over time as there is no competition.
    High electricity costs would hit the underprivileged the hardest. Business would
    also see higher operating costs, which would undoubtedly be passed onto the consumer.


    Some are already trying this new model of energy production, distribution, and
    consumption. One of those is Power Ledger, an Australian-based startup, which
    designed and implemented a system through which individuals create a network of
    energy producers and consumers known as “microgrids.” For now (at the time of
    writing this book), Power Ledger has designed the microgrids as part of the existing
    national power grid. However, the long-term plan is to have microgrids that are
    independent and self-sustaining but interconnected in a peer-to-peer structure,
    just like the blockchain networks. This could completely change the industry and
    transfer the decision-making power from major corporations to individual consumers.


    #### **Tokenising energy**


    The third way that blockchain can revolutionise the energy sector is by providing
    the capacity to tokenise energy. We have already seen a tokenisation in Kenya
    that made the sale or metering of energy convenient for consumers. Besides, tokenising
    energy for sale to the end consumer, the blockchain technology can also facilitate
    the tokenisation of energy for trading at the international markets. Oil is one
    of the commodities traded the most globally. The blockchain makes it possible
    that a sovereign digital token that represents every barrel of oil mined can be
    generated. This digital token can be traded in place of the actual oil it represents.
    This improves speed, convenience, and ease of transacting.


    In addition to making the process of tokenisation easy, the blockchain allows
    different stakeholders to have a shared ledger through which all of them can monitor
    and track the energy asset in real-time. This provides transparency and minimises
    the chances of market manipulation.


    In early 2017, financial solutions entity, Natixis, IBM, and commodity trading
    logistics company, Trafigura, announced a partnership to build the first blockchain
    solution for managing the US crude oil market. Using the Hyperledger Fabric platform,
    the three entities would establish a system through which crude oil transactions
    would be digitised. They chose blockchain because it offers security, transparency,
    and efficiency^([5](#ch15.xhtml#ch15fn5)).


    However, perhaps the earliest most known attempt to tokenise oil and gas on the
    blockchain is by the government of Venezuela in early 2018. However, Venezuela,
    one of the largest oil producers with vast reserves, has been dealing with sanctions
    by the US and other countries, which have limited its ability to benefit from
    its oil. As a way to circumvent the economic sanctions, the South American country
    created the Petro, a cryptocurrency backed by its energy reserves. The Petro was
    launched in an ICO that ran between February and March 2018. The government claimed
    that it managed to raise US$3.3 billion from the sale of over 30 million Petro
    coins. Internationally, the Petro seems to have gotten acceptance in Russia. But
    questions remain as to whether the Petro is indeed on a blockchain; it is most
    likely a centralised tokenising system. However, Venezuela could be the pioneer
    and others could follow. Indeed, Russia could be considering a similar project,
    according to some reports.'
