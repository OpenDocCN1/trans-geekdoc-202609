    区块链技术助力能源行业的另一种方式是提供更好的工具来管理碳信用额度，这一概念有助于应对温室气体排放问题。碳信用额度制度允许公司和国家在特定限额内排放温室气体。如果排放量超出限额，将面临罚款；反之，若排放量低于允许额度，则可将剩余额度出售给其他公司或国家。其目标是通过罚款威慑和出售碳信用额度获利的奖励机制，激励公司减少排放^[6]。


    目前，代币是一种可在交易所交易的货币形式。例如，如果能通过某种方法将排放量准确记录为代币形式，便可将其兑换为现金或等值的碳信用额度。


    由于碳信用额度属于资产形式，可将其在区块链上代币化，以便于追踪和交易。这能解决估值和定价方面的透明度问题。一些初创公司正在构建用于管理碳信用额度市场的区块链解决方案。名单包括新加坡初创公司
    Aircarbon，该公司宣布与国际商会（ICC）及区块链公司 Perlin 建立合作伙伴关系，并在 2019 年马德里联合国气候变化大会（COP 25）上亮相。Aircarbon
    正在尝试碳信用额度交易和融资的市场解决方案。


    ## 绿色能源转型的后端技术


    最后，区块链可能是让社会摆脱肮脏、污染环境的化石燃料、转向太阳能和风能等更清洁能源的关键缺失组件。管理碳信用额度制度和支持去中心化电网的出现，并非该技术在该领域提供的唯一解决方案。事实上，以颠覆能源行业为目标的大多数区块链初创公司都倾向于支持绿色能源。该技术为这些初创公司提供了现成的后端，降低了准入成本。此外，该技术还提供了一种手段，使行业内的不同参与者能够无缝交易和互操作。


    ## 使用区块链面临的挑战


    那么，能源行业要克服哪些挑战才能利用区块链？


    能源行业采用区块链面临的挑战与其他用例面临的挑战并无二致。最迫切的包括需要改变监管环境，以支持该技术实现的新技术能力。例如，在大多数国家，公用事业公司是公共垄断企业，鉴于目前可行的能源分配模式，这一直是现状。这种能源生产和分配模式使得私营部门难以提供替代方案。因此，从未有过改变法律以接纳其他模式的必要性。


    除了修改法律以适应新现实，还需要建立必要的技术能力，开发满足行业特定需求的区块链基础设施和协议。作为一项新技术，全球缺乏足够的技能和人才来引领这一变革。随着需求增长，这种情况将会改变。鉴于当今世界高度互联，我预计随着程序员发现协助愿意采用区块链的企业进行转型更有利可图，领域知识将随需求同步增长。


    当然，还需要改变监管机构、消费者、能源供应商和生产者的思维模式。应预料到那些从现有体制中获益者的反对。


    无论如何，正如我们所见，能源行业从区块链技术中受益的途径多种多样。


    ### 参考文献


    [1] Holthaus, Eric. “Bitcoin Mining Has a Massive Carbon Footprint.” Wired, Conde
    Nast, 1 Feb. 2018, [www.wired.com/story/bitcoin-mining-guzzlesenergyand-its-carbon-footprint-just-keeps-growing](http://www.wired.com/story/bitcoin-mining-guzzlesenergyand-its-carbon-footprint-just-keeps-growing).


    [2] Lou, Michelle. “Bitcoin Leaves a Carbon Footprint as Large as Las Vegas, Study
    Finds.” CNN, 14 June 2019, [edition.cnn.com/2019/06/14/tech/bitcoin-carbon-footprint-trnd/index.html](http://edition.cnn.com/2019/06/14/tech/bitcoin-carbon-footprint-trnd/index.html).


    [3] Njoroge, Evelyn. “KPLC Rolls out Prepaid Power.” Capital Business, 6 May 2009,
    [www.capitalfm.co.ke/business/2009/05/kplc-rolls-outprepaid-power/](http://www.capitalfm.co.ke/business/2009/05/kplc-rolls-outprepaid-power/).


    [4] Wako, Amina. “Multi-Million Shillings Scandal That Almost Crippled Kenya Power
    Company.” Nairobi News, Dec. 2019, [nairobinews.nation.co.ke/editors-picks/multi-million-shillings-scandal-that-almost-crippled-kenya-power-company](http://nairobinews.nation.co.ke/editors-picks/multi-million-shillings-scandal-that-almost-crippled-kenya-power-company).


    [5] “Natixis, IBM and Trafigura Introduce First-Ever Blockchain Solution for U.S.
    Crude Oil Market.” IBM, 28 Mar. 2017, [www-03.ibm.com/press/us/en/pressrelease/51951.wss](http://www-03.ibm.com/press/us/en/pressrelease/51951.wss).


    [6] Kenton, Will. “How Does the Carbon Credit Work?” Investopedia, 6 Feb. 2020,
    [www.investopedia.com/terms/c/carbon_credit.asp](http://www.investopedia.com/terms/c/carbon_credit.asp).


