    ^(3) 美国，国会，公共事务办公室。“俄亥俄州居民因运营基于暗网的比特币‘混币器’被起诉，涉及洗钱超 3 亿美元：‘Helix’从众多暗网市场洗白比特币。”
    *俄亥俄州居民因运营基于暗网的比特币“混币器”被起诉，涉及洗钱超 3 亿美元：“Helix”从众多暗网市场洗白比特币*，2020 年 2 月 13 日。 [www.justice.gov/opa/pr/ohio-resident-charged-operating-darknet-based-bitcoin-mixer-which-laundered-over-300-million](http://www.justice.gov/opa/pr/ohio-resident-charged-operating-darknet-based-bitcoin-mixer-which-laundered-over-300-million)。


    ^(4) “用于 KYC（了解你的客户）与 AML（反洗钱）合规的区块链。” *MedRec Technologies*， [medrectech.com/blog/Blockchain_Kyc_Aml](http://medrectech.com/blog/Blockchain_Kyc_Aml)。


    ^(5) Middleton, Ryan. “使用区块链进行 KYC/AML 合规。” *Dentons*，2019 年 5 月， [www.dentons.com/en/insights/articles/2019/may/28/using-blockchain-for-kyc-aml-compliance](http://www.dentons.com/en/insights/articles/2019/may/28/using-blockchain-for-kyc-aml-compliance)。


    | ![image](img/ch-18.jpg) | | **用例 10：区块链即服务** |


    | --- | --- |


    **软件即服务**（`SaaS`）模式使企业能够更轻松、更方便地使用各类应用程序，而无需承担巨额的初始成本。特别是小企业，无需担心搭建托管软件所需的基础设施，或雇佣合适的技术人员来提供支持和维护。企业只需创建一个账户，在仪表盘上自定义应用程序容量，然后通过网页浏览器即可开始使用。在大多数情况下，他们向软件供应商或技术公司支付服务费，按月或按年计费。在某些情况下，企业按执行的每笔交易支付访问费用。


    正如我们在本书前几章所见，区块链有望为企业和其他实体提供各类解决方案。普遍的观点认为，它可能在未来十年内取代所有服务器后端，这意味着企业目前使用的几乎每个软件应用程序都将可在区块链上获得。当然，我们现在已经理解为什么区块链可能是更好的技术，它提供了安全性、隐私性、效率和新的技术能力。


    ### 区块链即服务（`BaaS`）


    在企业使用区块链之前和期间，涉及许多流程、程序和活动。正如其他类型的技术一样，这些对于大型实体来说也可能令人不知所措，这正是为什么**区块链即服务**（`BaaS`）概念受到许多人的欢迎。与其他
    `SaaS` 解决方案一样，`BaaS` 允许企业享受该技术的所有优势，而无需担心技术后端运营，也无需承担巨额的初始成本。


    然而，`BaaS` 与其他 `SaaS` 解决方案之间存在根本差异，特别是关于谁（1）托管软件或应用程序，（2）提供支持，以及（3）进行维护。在本章中，我们将探讨这些根本差异。


    #### `BaaS` 的两个层级


    首先，必须指出 `BaaS` 至少存在于两个主要层级。一层是区块链核心软件，或作为支持区块链的点对点网络一部分而进行的安装。另一层是构建在区块链之上的应用程序，也称为
    `dApps`（尽管某些 `dApps` 实际上是中心化的）。以太坊为例，第一层涉及共享账本本身的托管和维护，即所谓的以太坊区块链。第二层涉及共享账本上智能合约应用程序的托管和维护。


    企业可能需要由第三方负责核心区块链软件或区块链上的特定应用程序。第一种情况发生在公司或实体打算构建一个全新的区块链时。他们需要以摩擦最小的方式完成此任务所需的工具和流程。在第二种情况下，企业需要使用特定应用程序来实现自动化、安全性或扩容。大多数企业，尤其是小规模企业，既需要区块链，也需要其上的
    `dApp` 以 `SaaS` 形式提供。在其他情况下，他们需要 `BaaS`，但会在其之上自行构建和维护应用程序。


    ### 使用 `BaaS` 的优势


    让我们探讨为什么 `BaaS` 至关重要。以下是企业和其他实体需要此类服务的一些原因。


    首先，这是规避缺乏构建区块链或其上的应用程序所需的技术能力、人才或技能这一问题的最恰当、最务实的方式。就目前情况而言（至少在本书撰写期间），就业市场上区块链技能和人才短缺。例如，如果您想招聘区块链设计师、开发人员或博弈论专家，可能会举步维艰，因为鲜有人做好充分准备。在
    2017 年 5 月于纽约市举行的金融科技研讨会上，金融服务公司 `DTCC` 为金融界高管组织了会议，缺乏合适的区块链人才可供雇佣被列为大多数以某种方式利用区块链技术的公司面临的最大挑战之一^(1)。由于这种短缺，初创企业和小企业尤其难以组建有竞争力的团队。企业转而利用第三方已构建的区块链协议和应用程序，这合情合理。


    第二个原因是，它帮助企业避免担心系统的持续维护。更重要的是，他们所使用系统的安全性和稳健性由准备更充分、能力更强的人来处理。拥有内部工程师或安全官可能成本高昂，尤其是对小企业而言。使用第三方提供的区块链即服务，企业能获得技术红利，因为服务提供商负责处理大部分关键和新出现的问题。


    第三，就技术而言，使用 `BaaS` 可将您的监管责任降至最低。技术的设计师、博弈论专家和开发人员必须弄清其合法性的基本要素，有时会以不违背现有法律法规的方式设计技术。当然，每个企业都必须明白，就遵守法律而言，责任最终在他们自己。然而，让其他人至少承担这部分责任，可以让企业专注于其他问题。


    企业考虑使用 `BaaS` 而非从头搭建自有系统的另一个原因是时间。构建一个新的区块链，甚至区块链上的某些应用程序，需要数月甚至数年。然而，接入 `BaaS`
    通常不需要那么多时间。通常只需开设一个账户，并自定义仪表盘以满足企业的特定需求。这只需几分钟即可完成。

    '
