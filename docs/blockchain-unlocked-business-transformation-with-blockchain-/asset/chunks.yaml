- raw: 'As evident from the Bitcoin’s struggle to scale, public blockchains are very
    slow at changing to meet new expectations. On the other hand, private blockchains
    have clear governance structures that make decisions about the improvement of
    the core software and protocol easier and faster. However, I should point out
    that owing to the challenges of managing the core software, several public blockchains
    have implemented elaborate governance structures where users vote to approve changes
    to the core software. The public blockchains with such an arrangement include
    Cardano, Dash, and EOS.


    #### **Game theory**


    Finally, let’s look at the third factor that differentiates public blockchains
    from private blockchains, which is the system’s reliance on game theory. In any
    system that brings together two or more entities with their own selfish interests,
    game theory is useful. It is more or less about giving the right incentives to
    actors within a system: rewarding those who play by the rules and punishing those
    who attempt to break them.


    Most private blockchain networks adopt a centralised governance structure that
    can reward good actors and punish bad actors. In particular, it can banish anyone
    who goes against the rules agreed upon by all stakeholders. This is made easier
    by the fact that all players are known and no one can rejoin the network without
    permission.


    However, often on public blockchain networks there is no one to punish or reward.
    Anonymous actors join and leave the network at will. Because of this, public blockchains
    have to rely on more robust game theory to function correctly. You can call it
    the automated game theory. With Bitcoin, for example, if you choose to try to
    break the rules, no one will stop you or banish you from the network. Rather,
    game theory will work against you.


    More specifically, you will be spending a lot of resources on paying electricity
    bills and buying hardware, like power supply units and ASIC miners. But the network
    will ignore you and you will end up making huge losses for nothing. However, if
    you decide to use those resources to help the network instead, it will reward
    you.


    ### **Choosing between private and public blockchains**


    Is the public or private blockchain better?


    Public and private blockchains have different strengths and weaknesses. As I have
    already pointed out, it is easier and faster to change a private blockchain protocol,
    making such blockchains more adaptive. Private blockchains are also great for
    entities that need to observe stringent regulatory requirements. For example,
    commercial banks have found it hard to use the Bitcoin blockchain because players
    on the platform remain anonymous. Thus, private blockchains allow them to meet
    necessary regulatory requirements.


    However, public blockchains provide guaranteed permanence and immutability. You
    are almost always sure that rules are not going to change abruptly. Public blockchains
    are great for applications that are good for society. But, for whatever reasons,
    governments and entities that benefit from the status quo will not allow such
    applications to flourish if they have access to a switch to turn off. In short,
    both types of blockchain have excellent use cases.


    ^([1](#ch05.xhtml#ich05fn1)) A. v. Wirdum, “Who Funds Bitcoin Core Development?
    How the Industry Supports Bitcoin’s ‘Reference Client’,” Bitcoin Magazine, 6 April
    2016. \[Online\]. Available: [https://bitcoinmagazine.com/articles/who-funds-bitcoin-core-development-how-the-industry-supports-bitcoin-s-reference-client-1459967859](https://bitcoinmagazine.com/articles/who-funds-bitcoin-core-development-how-the-industry-supports-bitcoin-s-reference-client-1459967859).


    ^([2](#ch05.xhtml#ich05fn2)) K. Apilak, “BIP-148 UASF First Year Anniversary:
    A New System of Governance,” Hackernoon, 7 July 2018. \[Online\]. Available: [https://hackernoon.com/bip-148-uasf-first-year-anniversary-a-new-system-of-governance-223907ec298b](https://hackernoon.com/bip-148-uasf-first-year-anniversary-a-new-system-of-governance-223907ec298b).


    | ![image](images/ch-6.jpg) || **What’s So Smart About Smart Contracts?** |


    | --- | --- |


    *The concept of smart contracts is the building block of the digital market.*
    Nick Szabo arrived at this conclusion in the mid-1990s, more than a decade before
    Satoshi Nakamoto designed the Bitcoin blockchain^([1](#ch06.xhtml#ch06fn1)). Nick
    Szabo is a computer scientist, cryptographer, and a legal expert who is one of
    the people suspected to be Satoshi Nakamoto. This suspicion only grows when you
    explore his known works or read the academic literature that he has written, including
    those on smart contracts.


    ### **The killer app of blockchain, or are they?**


    Nevertheless, many within the blockchain space believe that smart contracts could
    turn out to be the *killer* application for the technology. The one that could
    finally make the blockchain technology truly mainstream. That said, you probably
    first heard about smart contracts because of its association with blockchain.
    However, you must know that this is an idea discussed long before blockchain or
    cryptocurrencies came into being. Nevertheless, smart contracts and blockchain
    are turning out to be very intertwined. Indeed, there is reason to believe the
    former might end up providing the perfect use cases of the latter, and vice versa.


    The concept of smart contracts has been implemented in one form or another for
    decades. This has mostly happened in stand-alone or centralised server systems.
    However, the first place where the idea is explicitly discussed is in the academic
    article titled *Smart Contracts: Building Blocks for Digital Markets* that Nick
    Szabo published in 1996^([1](#ch06.xhtml#ch06fn1)). This is a document that anyone
    who has an interest in this technology or who wants to understand how it works,
    especially from a technical standpoint, should find the time to read.


    The central theme of the paper is a proposal on how to apply the legal principles
    that have guided the offline contractual interactions in the digital space. Nick
    Szabo asks, “What parts of our hard-won legal tradition will still be valuable
    in the cyberspace era? What is the best way to apply these common law principles
    to the design of our online relationships?”


    His solution? Smart contracts, which he defines as “a set of promises, specified
    in digital form, including protocols within which the parties perform on these
    promises.” He further explains that contractual clauses would be embedded in the
    computer hardware and software in a way that makes it difficult or expensive to
    breach the contract. Interestingly, Nick Szabo describes how public-private key
    cryptography, the primary component of the blockchain, would be central to making
    really efficient smart contract applications possible.


    Fast forward to 2013, as Bitcoin was getting noticed by the public, the corporate
    world, and even international governments, a young Canadian by the name of Vitalik
    Buterin published a white paper that proposed Ethereum, an alternative to the
    Bitcoin blockchain. In the paper, Buterin explained the weaknesses of the Bitcoin
    blockchain and how Ethereum was a better blockchain for not having them. One of
    the primary differences between Bitcoin and Ethereum was that the latter would
    support the developing, launching, and running of smart contracts. Before Ethereum
    came into the picture, hardly anyone linked smart contracts to blockchain technology.'
