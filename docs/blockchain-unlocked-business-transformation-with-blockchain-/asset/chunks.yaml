- raw: 'In both cases, the blockchain technology appears to be one that complicates
    regulatory efforts, in particular to track and manage the movement of money around
    the globe. One of the primary selling points of Bitcoin since its inception is
    the privacy and anonymity it offers users by blocking even the government from
    accessing their personal data, especially concerning how they spend money. This
    partly explains, for example, the rise and short-lived success of Silk Road and
    other dark web marketplaces for contraband goods using Bitcoin as the primary
    medium of exchange. While the technology to match sellers and buyers of contraband
    goods online has existed since 2002 (when the anonymous communication protocol
    known as Tor was first released), a digital payment method that was not easy to
    trace or block did not exist until Bitcoin came along in 2009. The cryptocurrency
    made it possible for people to transact pseudo-anonymously online after connecting
    using Tor, with little fear of being tracked. Though after Silk Road was seized
    and shut down in October 2013, it dawned on many that perhaps Bitcoin was not
    very private or anonymous after all. The launch of companies like Chainalysis
    confirmed this, building tools for tracking and linking transactions on the blockchain
    to real-world identities. Such blockchain investigative companies share this information
    with law enforcement agencies, regulators, and businesses that are willing to
    pay for it.


    ### **KYC and AML in a blockchain world**


    Erroneously, in the early days, many had described and perceived Bitcoin to be
    anonymous. It turned out that it is *pseudo*\-anonymous instead. The difference?
    In the former, a user does not need any form of identity or profile to use a service.
    The best example of an anonymous payment method is physical cash. A payment made
    with physical cash in and of itself does not tie you to the transaction. In the
    latter, a user acquires a profile online that need not be linked to their real-world
    identity. And Bitcoin is one example. Even though you need a wallet address on
    the blockchain to receive and send payment, you are not required to attach your
    name or physical address to the wallet address.


    Nevertheless, it has become a challenge over time to prevent linking a user identity
    on the blockchain to the real-world identity, because users need to convert their
    money between digital fiat and cryptocurrencies. Of course, to use fiat money
    online, users have to register themselves and prove their identity through submitting
    a government-issued document.


    Making the situation worse is the fact that users are forced to buy or sell on
    centralised marketplaces (exchanges), which can be forced to share data with authorities.
    After all, exchanges are the points where the identity on blockchain and the real-world
    one can be linked. With Bitcoin proving not to be as private as many thought initially,
    other cryptocurrencies have been designed with the capability to mask user transactions,
    including the likes of Monero and Zcash. Additional services and protocols such
    as transaction mixers, TumbleBit, and Coinjoin have been designed for the same
    purpose. Decentralised exchanges (DEXs) are also coming into the picture. However,
    most of them support only conversions between cryptocurrencies (hardly between
    cryptos and fiats)^([1](#ch17.xhtml#ch17fn1)).


    It remains accurate to state that the most anonymous digital payments are still
    only possible on the blockchain. However, regulators around the world are moving
    in to tighten surveillance and control on how cryptocurrencies are used. In particular,
    they have identified on-ramping and off-ramping points, such as exchanges and
    trading platforms, as very useful for this purpose; these service providers are
    centralised businesses and can therefore easily be regulated. Just a few years
    back, no proof of real-world identity was required to trade on the peer-to-peer
    trading platform Localbitcoins, for example. All one needed was to sign up with
    an email address and create any username he or she fancied. However, a wave of
    regulators around the world (at the time of writing this book) are demanding that
    exchanges and other crypto businesses put in place stringent KYC and AML systems.
    In March 2019, the Finnish parliament, where Localbitcoin is headquartered, passed
    a law that requires virtual currency service providers to verify the identities
    of their customers through government-issued documents and authenticate their
    physical addresses. Thus, if you use Localbitcoin to sell or buy cryptos, the
    platform can certainly tell who you are and the authorities can view your transactions.
    This scenario is being replicated around the world, and more service providers
    are demanding that their customers identify themselves^([2](#ch17.xhtml#ch17fn2)).


    The pressure on virtual currency service providers to increase KYC and AML does
    not stop at requiring them to identify and verify who uses their services. At
    the time of writing this book, it seems there is an attempt to criminalise actions
    that result in the obfuscation of Bitcoin, and by extension, crypto transactions.
    In mid February 2020, Larry Harmon, a blockchain developer, was arrested for helping
    build a Bitcoin mixer known as Helix, which allegedly was used by traders on Alphabay,
    a darknet marketplace similar to Silk Road, to launder their proceeds. Many believe
    that if Larry Harmon is found guilty, it would be a clear message from the authorities
    that even helping to build a mixer that others can use to launder money is a crime.
    That stands to set a precedent that could see all services of crypto transaction
    obfuscation either shutting down or going underground. Whatever the case, regulators
    seem to be winning the war over the control of cryptocurrencies, a task that seemed
    daunting a few years ago^([3](#ch17.xhtml#ch17fn3)).


    ### **The blockchain evolution of KYC and AML laws**


    Now let’s turn our focus on the core point of this chapter: using blockchain technology
    to gain the capacity to identify and authenticate customers of financial services
    as well as help track and stop money laundering and other criminal activities.
    In a nutshell, it is about using the technology that powers cryptocurrencies to
    build better systems to support KYC and AML. It is also about how those systems
    can help businesses deliver better services to their clientele.


    This is where the second paradox comes in. With old centralised KYC and AML systems,
    the customers provide data to the institution, which is then controls and manages
    it. The security of the data is wholly the responsibility of the entity that collects
    it. With a system on the blockchain, however, the data is not stored in a silo-ed
    database, where it is the responsibility of the company or regulator. Instead,
    it is stored on a shared ledger, which is not owned by anyone in particular. The
    data is in the control of the customer. The irony, however, is that while the
    customer gets more control over their data, they cannot change the details. The
    data can only change through a process guided by a tamper-proof algorithm.


    Before we explore what blockchain offers in managing KYC and AML, let’s start
    from the beginning. What exactly are KYC and AML, and how important are they?


    #### **Know Your Customer (KYC)**


    Know Your Customer (KYC) is a process of identifying and collecting data about
    a customer or client, of which a critical part is understanding why funds are
    moved between users. The purpose of this is manifold. First, it makes it easy
    for a company or a business to serve the customers effectively. Any serious business
    would strive to have a clear understanding of their customer and how they can
    serve them better. By identifying and knowing who the customers are, a business
    understands their needs better, and can therefore provide the most apt solutions.'
