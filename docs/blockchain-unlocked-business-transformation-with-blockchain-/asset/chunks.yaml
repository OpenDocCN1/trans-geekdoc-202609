- raw: 'The letter B stands for blockchain. This technology has made achieveable several
    things that just a decade ago seemed impossible, including the collaboration of
    independent entities on peer-to-peer networks on the status of transactions. In
    other words, it has made it possible that multiple independent computers on a
    decentralised network agree on a single truth through a consensus process, taking
    just a few seconds without the need for a central authority. Another value it
    brings is the immutability of digital data. Before blockchain, there was no way
    to protect online data from being arbitrarily changed aside from limiting access.
    Even then, you had to trust that the administrator of the system is honourable
    enough not to interfere with the data. With blockchain, data is safeguarded by
    a protocol instead, and with which no one can interfere. This characteristic of
    immutability also solves the age old problem of double-spending, which had stood
    in the way of having truly digital cash.


    Importantly, through the smart contract application and a native digital currency
    that supports micropayments, the blockchain can automate financial transactions
    between AI devices in the Internet of things (IoT). For example, a self-drive
    car could pay for the charge received at a charging station. Simply put, the self-drive
    car and the electric charging station can enter into and complete a business transaction
    without input from a person.


    Thus, blockchain is best suited to secure the data that is processed and stored
    by the AI system through its unique characteristics of having immutability and
    a decentralised backend. The technology also provides mechanisms through public-private
    key cryptography to provide privacy to those who interact with the intelligence
    devices.


    #### **C for Cybersecurity**


    The Internet is still largely the wild west. Various actors are practically free
    to do anything they want. The anonymity gives criminals the cover they need to
    steal, blackmail, or even destroy critical data as well as systems. It is not
    easy to fix this problem as the Internet comes with several huge dilemmas. While
    people and companies need their data online to access or provide services more
    efficiently, doing so exposes them to the risks of theft, blackmail, and breach
    of privacy. Another dilemma is that attempts to make the Internet safer often
    results in trampling on the rights of some users. For example, making it mandatory
    to identify yourself to use the Internet in order to track possible bad actors
    necessarily breaches everyone’s right to privacy.


    Nevertheless, cybersecurity is becoming a major concern, especially with so much
    sensitive data and processes going onto the Internet. Individuals and businesses
    lose billions of dollars annually to hackers. The risk could be higher with new
    technologies like AI and blockchain, forcing businesses, governments, and individuals
    to bring more data, money, and processes online. It is also important to point
    out that as the Internet becomes faster, and more expansive and inclusive, hackers
    are growing smarter and more powerful over time. The question then: how can the
    Internet be made safer for all without trampling on the rights of any?


    Interestingly, the solution to cybersecurity also comes from new technologies,
    in particular, blockchain and AI, which provide us with tools that we have never
    had before. In the case of blockchain, it allows specific pieces of data to be
    secured through immutability and decentralisation. As mentioned earlier, immutability
    makes it difficult to change the form of data once it is created, while decentralisation
    makes it difficult to steal or destroy data because doing so requires one to take
    over thousands or even millions of independent computers, which is, of course,
    impossible. Thus, blockchain makes it possible to secure the Internet without
    affecting the privacy of Internet users.


    Blockchain also offers another way to protect data. Through cryptography, data
    can be encrypted and only accessed with a private key, which can be stored offline.
    The AI technology, too, gives the capacity to monitor systems in a way that human
    labour cannot replicate. Relying solely on human oversight is always inadequate.
    The technology can detect and prevent threats that humans cannot easily foresee.


    I invite you to read this book with an open mind. What I offer is a personal perspective
    on how technology, with an emphasis on the new ABCs, could turn out in the next
    few years. My intention with this book is to inform and give you the tools you
    need to make the right decisions for technology of the future now.


    I hope you enjoy it.


    ## **Introduction**


    This book contains very little technical content. There are no instructions on
    things like coding, building a blockchain, or a decentralised application (dApp).
    Anyone completely new to blockchain will be able to read and understand this book
    comfortably. Nevertheless, a reader with extensive exposure to the technology
    will also glean new perspectives.


    You can expect to gain a handy capacity for making sound decisions about blockchain
    technology whether for business or public policy. Divided into two broad parts,
    the book takes us through the basics of the technology in [Part 1](#pt01.xhtml),
    which will get you conversant enough in the concepts for [Part 2](#pt02.xhtml),
    which covers different use cases of the technology.


    In this introduction, I highlight important points in each chapter to give an
    overview of the book. I hope this provides clarity and a roadmap as we explore
    the many vast topics behind the blockchain.


    We start by asking what blockchain is precisely. [Chapter 1](#ch01.xhtml) breaks
    down the technology to its essential components, explaining what each one does.
    It describes how they work together to become the potent technology that blockchain
    is turning out to be. It explains the advantages of the blockchain technology
    vis-à-vis the centralised systems that it seeks to replace and anticipates how
    this technology stands to transform business.


    [Chapter 2](#ch02.xhtml) looks at what blockchain can and cannot do, taking an
    objective look at the capacity and potential of the technology and where we can
    draw the line. The chapter also tries to explain why blockchain is not a solution
    for every single problem “out there”. It covers its strengths, such as decentralisation,
    immutability, and privacy through cryptography, as well as its weaknesses, such
    as poor scalability and reliance on third-party infrastructure such as Internet
    connectivity.


    [Chapter 3](#ch03.xhtml) covers a use of the blockchain that many believe to be
    the most exploited to date: tokens. It explains what exactly blockchain tokens
    are, the different kinds that exist, and how a business can leverage this capability
    of the technology. It looks at four primary types of tokens: (1) Initial Coin
    Offering (ICO) tokens, (2) utility tokens, (3) assets backed tokens, and (4) security
    tokens.


    [Chapter 4](#ch04.xhtml) goes into the primary concern of many considering this
    technology—the security of the blockchain itself as well as of the applications
    and systems that run on top of it. It attempts to answer the question of whether
    blockchain is secure through three angles: (1) protecting your ownership of a
    blockchain asset and the privacy of your identity and activities, (2) whether
    a blockchain is secure from a possibility of a bad actor compromising, taking
    over, or destroying its entire system, and (3) the robustness of the core software
    and, by extension, the protocol.'
  fmt: '

    The letter `B` stands for blockchain. This technology has made achievable several
    things that just a decade ago seemed impossible, including the collaboration of
    independent entities on peer-to-peer networks on the status of transactions. In
    other words, it has made it possible that multiple independent computers on a
    decentralised network agree on a single truth through a consensus process, taking
    just a few seconds without the need for a central authority. Another value it
    brings is the immutability of digital data. Before blockchain, there was no way
    to protect online data from being arbitrarily changed aside from limiting access.
    Even then, you had to trust that the administrator of the system is honourable
    enough not to interfere with the data. With blockchain, data is safeguarded by
    a protocol instead, and with which no one can interfere. This characteristic of
    immutability also solves the age-old problem of double-spending, which had stood
    in the way of having truly digital cash.


    Importantly, through the smart contract application and a native digital currency
    that supports micropayments, the blockchain can automate financial transactions
    between AI devices in the Internet of Things (IoT). For example, a self-driving
    car could pay for the charge received at a charging station. Simply put, the self-driving
    car and the electric charging station can enter into and complete a business transaction
    without input from a person.


    Thus, blockchain is best suited to secure the data that is processed and stored
    by the AI system through its unique characteristics of having immutability and
    a decentralised backend. The technology also provides mechanisms through public-private
    key cryptography to provide privacy to those who interact with the intelligent
    devices.


    ### C for Cybersecurity


    The Internet is still largely the wild west. Various actors are practically free
    to do anything they want. The anonymity gives criminals the cover they need to
    steal, blackmail, or even destroy critical data as well as systems. It is not
    easy to fix this problem as the Internet comes with several huge dilemmas. While
    people and companies need their data online to access or provide services more
    efficiently, doing so exposes them to the risks of theft, blackmail, and breach
    of privacy. Another dilemma is that attempts to make the Internet safer often
    result in trampling on the rights of some users. For example, making it mandatory
    to identify yourself to use the Internet in order to track possible bad actors
    necessarily breaches everyone''s right to privacy.


    Nevertheless, cybersecurity is becoming a major concern, especially with so much
    sensitive data and processes going onto the Internet. Individuals and businesses
    lose billions of dollars annually to hackers. The risk could be higher with new
    technologies like AI and blockchain, forcing businesses, governments, and individuals
    to bring more data, money, and processes online. It is also important to point
    out that as the Internet becomes faster, and more expansive and inclusive, hackers
    are growing smarter and more powerful over time. The question then: how can the
    Internet be made safer for all without trampling on the rights of any?


    Interestingly, the solution to cybersecurity also comes from new technologies,
    in particular, blockchain and AI, which provide us with tools that we have never
    had before. In the case of blockchain, it allows specific pieces of data to be
    secured through immutability and decentralisation. As mentioned earlier, immutability
    makes it difficult to change the form of data once it is created, while decentralisation
    makes it difficult to steal or destroy data because doing so requires one to take
    over thousands or even millions of independent computers, which is, of course,
    impossible. Thus, blockchain makes it possible to secure the Internet without
    affecting the privacy of Internet users.


    Blockchain also offers another way to protect data. Through cryptography, data
    can be encrypted and only accessed with a private key, which can be stored offline.
    The AI technology, too, gives the capacity to monitor systems in a way that human
    labour cannot replicate. Relying solely on human oversight is always inadequate.
    The technology can detect and prevent threats that humans cannot easily foresee.


    I invite you to read this book with an open mind. What I offer is a personal perspective
    on how technology, with an emphasis on the new ABCs, could turn out in the next
    few years. My intention with this book is to inform and give you the tools you
    need to make the right decisions for technology of the future now.


    I hope you enjoy it.


    ## Introduction


    This book contains very little technical content. There are no instructions on
    things like coding, building a blockchain, or a decentralised application (`dApp`).
    Anyone completely new to blockchain will be able to read and understand this book
    comfortably. Nevertheless, a reader with extensive exposure to the technology
    will also glean new perspectives.


    You can expect to gain a handy capacity for making sound decisions about blockchain
    technology whether for business or public policy. Divided into two broad parts,
    the book takes us through the basics of the technology in [Part 1](#pt01.xhtml),
    which will get you conversant enough in the concepts for [Part 2](#pt02.xhtml),
    which covers different use cases of the technology.


    In this introduction, I highlight important points in each chapter to give an
    overview of the book. I hope this provides clarity and a roadmap as we explore
    the many vast topics behind the blockchain.


    We start by asking what blockchain is precisely. [Chapter 1](#ch01.xhtml) breaks
    down the technology to its essential components, explaining what each one does.
    It describes how they work together to become the potent technology that blockchain
    is turning out to be. It explains the advantages of the blockchain technology
    vis-à-vis the centralised systems that it seeks to replace and anticipates how
    this technology stands to transform business.


    [Chapter 2](#ch02.xhtml) looks at what blockchain can and cannot do, taking an
    objective look at the capacity and potential of the technology and where we can
    draw the line. The chapter also tries to explain why blockchain is not a solution
    for every single problem "out there". It covers its strengths, such as decentralisation,
    immutability, and privacy through cryptography, as well as its weaknesses, such
    as poor scalability and reliance on third-party infrastructure such as Internet
    connectivity.


    [Chapter 3](#ch03.xhtml) covers a use of the blockchain that many believe to be
    the most exploited to date: tokens. It explains what exactly blockchain tokens
    are, the different kinds that exist, and how a business can leverage this capability
    of the technology. It looks at four primary types of tokens: (1) Initial Coin
    Offering (ICO) tokens, (2) utility tokens, (3) asset-backed tokens, and (4) security
    tokens.


    [Chapter 4](#ch04.xhtml) goes into the primary concern of many considering this
    technology—the security of the blockchain itself as well as of the applications
    and systems that run on top of it. It attempts to answer the question of whether
    blockchain is secure through three angles: (1) protecting your ownership of a
    blockchain asset and the privacy of your identity and activities, (2) whether
    a blockchain is secure from a possibility of a bad actor compromising, taking
    over, or destroying its entire system, and (3) the robustness of the core software
    and, by extension, the protocol.

