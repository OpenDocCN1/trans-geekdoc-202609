- raw: 'Before blockchain, the only way different insurers could work together and
    share risks is through cultivating and sustaining trust amongst themselves—not
    an easy thing to achieve. Working only with others known to it significantly limits
    the options of reinsurers. Using blockchain, trust through familiarity is a non-essential.
    An insurer or broker can work with any other broker, insurer, or reinsurer—from
    any part of the globe—as long as the details of the offer are acceptable.


    Because brokers, insurers, and reinsurers have to work with the same set of facts
    and goals, especially where they share risks, it is important that the blockchain
    makes available a shared ledger on which they all are on the same page at every
    point of their transactions. For example, a broker could see what the insurer
    and the reinsurers are doing, and likewise so could every insurer see what other
    stakeholders in a transaction are doing. Moreover, one stakeholder cannot arbitrarily
    change the content of a contract without the input of the others.


    Last but not least, the blockchain makes it easy for the stakeholders to form
    contracts and execute them, as they can apply smart contracts to automate the
    process of sharing risks and meeting obligations. Without human intervention,
    according to agreed terms, premium payments for a policy can be spread out. Even
    settlements can be finalised in the same way.


    #### **Health and life insurance**


    Now let’s look at how blockchain can change healthcare insurance. We have already
    looked at some aspects of this application in the previous chapter on healthcare
    ([Chapter 13](#ch13.xhtml)). Some of the ways blockchain improves healthcare insurance
    include improved security for data, enhanced privacy for stakeholders, and automation
    through smart contracts.


    Digitisation of the insurance and healthcare systems has been necessary because
    it improves the efficiency and the reach of services. However, it also gives rise
    to security challenges. Medical records form one of the most sensitive categories
    of data, which is in high demand by both ethical and unethical entities. Any system
    that carries such data, like those related to healthcare insurance, are at a high
    risk of attack or compromise. The blockchain protects data through anonymity,
    cryptography, and immutability. Also important is the fact that potential clients
    can carry data that a broker, insurer, or reinsurer can trust at face value, and
    not need to verify. This speeds up processes and reduces the cost involved, especially
    as it makes the entire onboarding and policy evaluation process cheaper and faster.


    Closely related to security is privacy. Insurance companies often need to know
    the health condition of the policyholder, or at least the risks during the application
    and justifications during the claim settlement. This data must be handled with
    utmost privacy, especially when the insurer involves others in the transaction,
    such as reinsurers. The blockchain enables the policyholder to have full control
    of their data, including being able to offer limited access in terms of scope
    and time. They can show only what they need to and for the necessary period. The
    policyholder can even prove the authenticity of the data without exposing sensitive
    details through advanced blockchain protocols such as the zero-knowledge proofs
    (zk-snarks). For example, the policyholder can prove that the doctor authenticated
    medical records without the insurer ever having to see the actual medical notes.
    This allows the insurer to act on actual data without infringing on the patient’s
    privacy.


    Healthcare insurance can also benefit a great deal from smart contracts and interoperability
    that the blockchain provides. Automating processes through code that executes
    actions when predetermined conditions are met could be very useful in healthcare
    insurance. Life insurance is an excellent demonstration of this, even though it
    is a little different from a medical cover. Due to the slow verification process,
    it takes up to months, and even years, before a life insurance claim is settled.
    This could be reduced to as short as days after the death. Or even shorter if
    there is interoperability between the systems of hospitals, public social services,
    and insurance companies. This means when a death occurs, a death certificate is
    issued and the information is fed into the hospital system, while the insurance
    company gets a notification that triggers the processing of the claim.


    #### **Fraud detection and prevention**


    Now let us look at how blockchain can help deal with the problem of fraud in the
    insurance industry. The industry in America alone loses close to US$80 billion
    annually to fraudulent activities, according to a report by Coalition Against
    Insurance Fraud, a leading American anti-fraud alliance. It could even more severe
    in other countries. The common types of insurance fraud are giving misleading
    information during the application, making exaggerated or fake claims, and also
    claims made through stolen identity. The list of those who do insurance fraud
    includes policyholders, brokers, service providers like hospitals, and even employees
    of insurance companies.


    Insurance fraud becomes a cost on consumers and eats into the possible profits
    for brokers, insurers, and reinsurers. For example, in the US, the cost to consumers
    annually is between US$400 and US$700 per family^([2](#ch14.xhtml#ch14fn2)).


    The primary enabler of insurance fraud is poor data collection, processing, and
    management. Either the wrong data gets into the system or it is tampered during
    processing.


    The blockchain offers the capacity to fix some of the loopholes used to initiate
    fraud at key stages, such as at the point of onboarding as well as during the
    life of the policy and the processing of the claim. It provides the mechanism
    for creating and sustaining credible identities. For example, blockchain solution
    Civic helps individuals and organisations manage their digital identities. After
    creating a profile on the platform, you build a reputation over time. Every institution
    to whom you submit your identity for a service or access, whether a government
    institution, a private business, or an online platform, can independently verify
    its authenticity. This verification by a third party becomes part of your profile’s
    reputation^([3](#ch14.xhtml#ch14fn3)).


    Such blockchain identity solutions could help minimise insurance fraud emanating
    from fake or misrepresented identities. Moreover, accumulating the data and reputation
    through interacting with other entities can play a significant role in proving
    whether the details they provide during the application or at the point of making
    a claim are accurate or truthful.


    Once the data has been recorded in the insurance system, the blockchain makes
    it immutable. Thus, no one, not even the highest-ranking admin of the system,
    can arbitrarily change the details on the record. If editing is needed, a transaction
    affecting the particular change has to be submitted on a shared ledger where all
    stakeholders would at least be notified about it or get an opportunity to approve
    it.


    The blockchain can manage how claims are processed to minimise incidences of fraud.
    First, the identity of the claimant can be verified with high precision using
    solutions like Civic, coupled with biometrics—to ensure the Civic identity has
    not been hijacked. This prevents the wrong person from placing and benefiting
    from a claim. In many incidences, the process could be automated so that data
    is received from AI and IoT driven oracles, and that the data triggers processing
    of claims without human intervention. Later in this chapter, I provide an example
    of a product by Etherisc, which fits well this particular scenario.


    When it comes to tackling fraud, blockchain provides better ways for verifying
    identities, protecting and making data immutable as well as automating steps that
    are usually susceptible to interference.'
  fmt: '

    # 区块链在保险行业的应用


    在区块链出现之前，不同保险公司之间要想合作并分担风险，唯一的途径就是相互之间建立并维持信任——这并非易事。仅与熟知的对象合作会极大地限制再保险公司的选择范围。借助区块链，基于熟悉度的信任不再是必需条件。只要报价详情可接受，保险公司或经纪人便可与全球任何其他经纪人、保险公司或再保险公司开展合作。


    由于经纪人、保险公司和再保险公司必须基于同一组事实和目标开展工作，尤其是在共同分担风险时，区块链提供的共享账本至关重要，它确保所有参与方在交易的每个节点上都掌握同步信息。例如，经纪人可以查看保险公司和再保险公司的操作，同样，每家保险公司也能看到交易中其他利益相关方的动向。此外，任何单一利益相关方都无法在未征得其他方同意的情况下随意更改合同内容。


    最后但同样重要的是，区块链通过智能合约自动化风险分担和履约流程，使利益相关方能轻松订立并执行合同。在无需人工干预的情况下，保费可根据约定条款自动分摊；理赔结算亦可同步自动化完成。


    ## 健康与人寿保险


    现在让我们看看区块链如何变革医疗保险。我们已在前一章医疗保健（[第13章](#ch13.xhtml)）中探讨过该应用的某些方面。区块链改善医疗保险的方式主要包括：增强数据安全性、强化利益相关方隐私保护，以及通过智能合约实现自动化。


    保险与医疗系统的数字化势在必行，因为它能提升服务效率与覆盖范围。然而，这也带来了安全挑战。医疗记录属于最敏感的数据类别之一，无论合法或非法实体均对其需求旺盛。承载此类数据的系统（如医疗保险相关系统）面临极高的攻击或泄露风险。区块链通过匿名性、加密技术和不可篡改性保护数据。同样重要的是，潜在客户可携带经纪人、保险公司或再保险公司可直接信任、无需二次核验的数据。这加快了流程并降低了成本，尤其是使整个准入和保单评估过程更廉价、更快捷。


    隐私保护与安全性密切相关。保险公司往往需要了解投保人的健康状况，或至少在投保申请和理赔结算阶段掌握风险信息。尤其是当保险公司引入再保险公司等其他方参与交易时，此类数据必须得到最高级别的隐私保护。区块链赋予投保人对其数据的完全控制权，包括按范围和时间提供有限访问权限。投保人仅需展示必要信息且仅在必要期限内展示。投保人甚至可利用零知识证明（`zk-snarks`）等先进区块链协议，在不暴露敏感细节的前提下证明数据真实性。例如，投保人可证明医生已认证医疗记录，而保险公司无需查看实际病历。这使保险公司能基于真实数据行事，同时不侵犯患者隐私。


    医疗保险还可从区块链提供的智能合约和互操作性中获益良多。通过在预设条件满足时代码自动执行操作来实现流程自动化，在医疗保险中极具价值。人寿保险便是绝佳例证，虽其与医疗保障略有不同。因验证流程缓慢，人寿保险理赔结算往往耗时数月甚至数年。借助区块链，这可缩短至身故后数天，甚至更短——若医院、公共社保部门与保险公司系统实现互操作。这意味着：身故发生时，死亡证明签发并录入医院系统，保险公司即收到通知并触发理赔处理流程。


    ## 欺诈检测与防范


    现在让我们看看区块链如何帮助解决保险行业的欺诈问题。根据美国反欺诈联盟“反保险欺诈联盟”报告，仅美国保险业每年因欺诈活动损失高达800亿美元。其他国家情况可能更严峻。常见保险欺诈类型包括：投保时提供误导性信息、夸大或捏造理赔、冒用他人身份理赔。实施欺诈者涵盖投保人、经纪人、医院等服务提供方，甚至保险公司内部员工。


    保险欺诈最终转嫁为消费者成本，并侵蚀经纪人、保险公司和再保险公司的潜在利润。例如在美国，每个家庭每年因此承担的成本在400至700美元之间^([2](#ch14.xhtml#ch14fn2))。


    保险欺诈的主要推手是数据收集、处理和管理不善：要么错误数据录入系统，要么数据在处理过程中被篡改。


    区块链具备在关键阶段修补欺诈漏洞的能力，如准入环节、保单存续期及理赔处理期。它提供了创建和维护可信身份的机制。例如，区块链解决方案`Civic`助力个人和组织管理数字身份。用户在平台创建档案后，信誉随时间积累。每个接收其身份信息以提供服务或访问权限的机构（无论政府机构、私营企业或在线平台）均可独立验证其真实性。这种第三方验证将成为用户档案信誉的一部分^([3](#ch14.xhtml#ch14fn3))。


    此类区块链身份解决方案有助于最大程度减少源自虚假或虚构身份的保险欺诈。此外，通过与其他实体交互积累的数据和信誉，在证明投保人申请时或理赔时提供的细节是否准确、真实方面发挥重要作用。


    一旦数据记录入保险系统，区块链使其不可篡改。因此，无人（即便系统最高权限管理员）可随意更改记录细节。若需修改，必须在共享账本上提交针对该变更的交易，所有利益相关方至少会收到通知或获得批准机会。


    区块链可管控理赔处理流程以最大程度减少欺诈。首先，可结合生物识别技术，利用`Civic`等解决方案高精度验证索赔人身份——确保`Civic`身份未被劫持。这防止了错误人员提交并获益于理赔。在许多场景下，流程可实现自动化：数据从AI和IoT驱动的预言机接收，并自动触发理赔处理，无需人工干预。本章稍后将提供`Etherisc`的一款产品案例，完美契合此场景。


    在打击欺诈方面，区块链为身份验证、数据保护与不可篡改化、以及自动化易受干扰的环节提供了更优路径。

    '
  trans: '


    # 区块链在保险行业的应用


    在区块链出现之前，不同保险公司之间要想合作并分担风险，唯一的途径就是相互之间建立并维持信任——这并非易事。仅与熟知的对象合作会极大地限制再保险公司的选择范围。借助区块链，基于熟悉度的信任不再是必需条件。只要报价详情可接受，保险公司或经纪人便可与全球任何其他经纪人、保险公司或再保险公司开展合作。


    由于经纪人、保险公司和再保险公司必须基于同一组事实和目标开展工作，尤其是在共同分担风险时，区块链提供的共享账本至关重要，它确保所有参与方在交易的每个节点上都掌握同步信息。例如，经纪人可以查看保险公司和再保险公司的操作，同样，每家保险公司也能看到交易中其他利益相关方的动向。此外，任何单一利益相关方都无法在未征得其他方同意的情况下随意更改合同内容。


