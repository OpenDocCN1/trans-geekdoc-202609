    # Token Design and Blockchain Security


    ## Data-Driven Token Design


    To design a successful token requires thorough consideration of every small part
    of the system. Many projects do not interrogate every bit of their design. For
    example, they pick the number of tokens, emission rate, and the issue price through
    guesswork.


    Any decision you make on these issues needs to be data-driven. Research the right
    number of tokens needed, depending on the amount of activity you anticipate on
    your project. Begin with the number of users you expect to have. Also, do all
    you can to get the best estimates on transaction volumes. Coming up with viable
    models for these is where you need experts if you do not have the knowledge, experience,
    or skill.


    ### References


    1. SteemFest. Tokenomics Design with Wmougayar, Nov. 2017, [www.youtube.com/watch?v=ZKcZ4C8IO14](http://www.youtube.com/watch?v=ZKcZ4C8IO14).

    2. Siegel, David. “The Token Handbook.” Hacker Noon, 10 May 2020, [hackernoon.com/the-token-handbook-a80244a6aacb](http://hackernoon.com/the-token-handbook-a80244a6aacb).

    3. Ahmad, Danyal. “Creating Ethereum Token on ERC20 Standards.” Devprovider, 16
    June 2019, [www.devprovider.com/creating-ethereum-token/](http://www.devprovider.com/creating-ethereum-token/).


    ---


    ## Is Blockchain Secure?


    ![image](images/ch-4.jpg)


    The blockchain technology is designed to hold value in digital assets such as
    currencies, tokens, and even data. Why is blockchain security critical? At the
    time of writing this book, the market capitalisation of Bitcoin, the native coin
    of the Bitcoin blockchain, is close to US$150 billion, while Ethereum’s Ether
    (ETH) stands at around US$15 billion. These are just two blockchain assets on
    a list of almost 5,000 on CoinMarketCap, a website that collects and publishes
    real-time blockchain asset statistics.


    The real value on every blockchain in existence is much more than that listed
    on CoinMarketCap, if one considers the assets that are created on top of it. For
    example, the Ethereum blockchain, in addition to ETH, supports several coins,
    tokens, and decentralised applications (dApps). The value is even greater if we
    count the businesses that provide blockchain-related services such as wallets,
    exchanges, and mining. Not least are the entities that use the blockchain as the
    backend for storing and processing data for their applications and systems.


    ### What Makes Blockchain Secure?


    We can consider the security of a blockchain from three angles. The first (1)
    angle concerns your own individual interaction with the system, in particular
    protecting your ownership of a blockchain asset and the privacy of your identity
    and activities. The second (2) angle concerns the possibility of a bad actor compromising,
    taking over, or destroying the entire blockchain network. The third (3) angle
    questions the robustness of the core software and, by extension, the protocol.
    In particular, whether bugs exist in the code that could make the system insecure.


    We are going to look at these three angles in turn.


    #### Security Depends on You


    How secure is an individual’s assets, data, and identity on the blockchain?


    The short answer is that your activities, assets, and identity on the blockchain
    are about as secure as the steps you take towards that end. In other words, your
    security on the blockchain depends a lot on you. Sometimes more so than the design
    of the blockchain.


    How is that so?


    On the blockchain, every user has a `public key` (or a `public address`), which
    is the identity used to interact and transact on the platform. Each public key
    has a corresponding `private key`. Think of the `public key` as your email address
    and the `private key` as the password you need to access your emails. When someone
    sends Bitcoins to your public key (address), the only way you can exercise control
    over those Bitcoins is through the corresponding `private key`. Thus, you need
    the `private key` to spend Bitcoins. It turns out that a `private key` is a kind
    of bearer tool; whoever has access can use it. Anyone who gets a hold of your
    private keys could spend your Bitcoins.


    This applies to other applications on the blockchain too. If a land title is transferred
    to you on a blockchain-based land registry, for example, the only way you can
    prove your control over it is by using the `private key` that corresponds to the
    public key assigned to the title in the system. If anyone else has access to that,
    they could transfer the ownership of the real estate out of your hands.


    This leads to the conclusion that your `private key` is supposed to be really
    private just like a password to an email account or a PIN for your debit card—no
    one else should know about it. Unfortunately, private keys have turned out to
    be the weakest link in blockchain security. Keeping them away from hackers is
    one of the most onerous responsibilities for users of blockchain applications.


    Since the launch of Bitcoin in 2009, billions of dollars have been stolen by hackers
    who can remotely steal private keys to wallets holding significant amounts of
    blockchain assets, especially cryptocurrencies like Bitcoin. For example, in early
    2014, Mt. Gox, an exchange headquartered in Japan and at the time one of the world’s
    largest Bitcoin exchange, lost Bitcoins worth over US$450 million to hackers.
    In January 2018, Coincheck, another Japanese exchange, lost US$530 million to
    hackers[^1]. According to a report by Chainalysis, a blockchain research company,
    money lost from exchange wallets was over US$1.2 billion in 2018[^2].


    Fortunately, users have several measures to protect their private keys, and hence
    their assets, from theft. One way is to generate and store the private keys offline,
    creating a “cold storage”. This uses a cold storage hardware wallet such as Trezor,
    KeepKey, or Ledger. Another way is to use an offline script to generate the private
    keys and print them on a hard copy. Users can store private keys in a safe place,
    but share the corresponding public keys to those who need to send Bitcoin (or
    any other asset).


    #### Is the Blockchain Network Secure?


    Now let’s turn our attention to the security of the entire blockchain.


    Many reasons could make someone want to compromise the entire blockchain. It includes
    wanting control to manipulate entries on the transaction ledger. There might also
    be the goal to destroy the system, especially to stop it from being a threat to
    other existing systems. We also cannot rule out the possibility of someone or
    an entity doing it just for the fun of it.


    A blockchain network can be compromised through the “51 percent attack”, in which
    a bad actor acquires a computing power (hash rate) more than 51 percent of the
    entire network. The bad actor can use this hash rate to overrule other stakeholders
    or edit the shared ledger arbitrarily. While such an attack seems plausible, in
    reality it is almost impossible to pull off. Not least because it is a costly
    undertaking.


    In the case of the Bitcoin blockchain, you would need to accumulate (at the time
    of writing) over 110 million terahashes (TH/s)[^3]. That is a lot of computer
    power. Indeed, the Bitcoin network as a unit is the world’s most powerful computer.
    You have to beat that. Besides buying many mining chips, each one a very expensive
    device, you need a source to provide you with more electricity than, say, a country
    the size of Switzerland consumes[^4].


    [^1]: ch04.xhtml#ch04fn1

    [^2]: ch04.xhtml#ch04fn2

    [^3]: ch04.xhtml#ch04fn3

    [^4]: ch04.xhtml#ch04fn4

    '
