    ## 用例 6：保险


    | ![image](img/ch-14.jpg) | **用例 6：保险** |

    | --- | --- |


    2016 年 5 月，来自世界各地的五大保险公司聚首成立了 **Bi3（区块链保险行业倡议）**，这是一个联盟，也是采用和利用区块链技术的载体。Bi3 的成立紧随其后的一新兴趋势，当时主要银行和技术公司刚刚成立了
    **Hyperledger** 和 **R3**——银行业两大区块链联盟。自那时起，Bi3 的成员数量持续增长。在本书撰写之时，成员数接近 50 家，其中包括
    **Allianz**、**Swiss Re** 和 **Generali Group** 等巨头。


    最初，Bi3 走了一条不同于 Hyperledger 和 R3 的路线：它尝试在 **Ethereum** 区块链上进行实验，以观察第二大区块链是否能支持该行业的特定解决方案。后两个联盟则直接着手构建自己的区块链，这类区块链后来被称为私有、许可型分布式账本技术（**DLT**）或企业级区块链。Bi3
    最终决定转向并拥抱这种新型区块链，但并未自建；2017 年，它们采用了新发布的 **Hyperledger Fabric**。


    然而，**Hyperledger Fabric** 显然未能满足其特定需求，Bi3 很快又转向了 **Corda**——由 **R3** 设计并构建的区块链平台。2019
