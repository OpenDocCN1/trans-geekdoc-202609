    ^([3](#ch17.xhtml#ich17fn3)) United States, Congress, Office of Public Affairs.
    “Ohio Resident Charged with Operating Darknet-Based Bitcoin ‘Mixer,’ Which Laundered
    Over $300 Million: ‘Helix’ Laundered Bitcoin From Numerous Darknet Markets.” *Ohio
    Resident Charged with Operating Darknet-Based Bitcoin “Mixer,” Which Laundered
    Over $300 Million: “Helix” Laundered Bitcoin From Numerous Darknet Markets*, 13
    Feb. 2020. [www.justice.gov/opa/pr/ohio-resident-charged-operating-darknet-based-bitcoin-mixer-which-laundered-over-300-million](http://www.justice.gov/opa/pr/ohio-resident-charged-operating-darknet-based-bitcoin-mixer-which-laundered-over-300-million).


    ^([4](#ch17.xhtml#ich17fn4)) “Blockchain for KYC (Know Your Customer) & AML (Anti
    Money Laundering) Compliance.” *MedRec Technologies*, [medrectech.com/blog/Blockchain_Kyc_Aml](http://medrectech.com/blog/Blockchain_Kyc_Aml).


    ^([5](#ch17.xhtml#ich17fn5)) Middleton, Ryan. “Using Blockchain for KYC/AML Compliance.”
    *Dentons*, May 2019, [www.dentons.com/en/insights/articles/2019/may/28/using-blockchain-for-kyc-aml-compliance](http://www.dentons.com/en/insights/articles/2019/may/28/using-blockchain-for-kyc-aml-compliance).


    | ![image](images/ch-18.jpg) | | **Use Case 10: Blockchain-as-a-Service** |


    | --- | --- |


    The Software as a Service (`SaaS`) model has made it easier and more convenient
    for businesses to use different kinds of applications without having to incur
    substantial initial costs. In particular, small businesses do not have to worry
    about putting up the necessary infrastructure for hosting software or hiring the
    right technical skill to support and maintain it. All a business has to do is
    to create an account, customise the application capacity on a dashboard, and start
    using it, all through a web browser. In most cases, they pay for the service from
    the software vendor or a technology company, which could be billed monthly or
    annually. In some cases, the business pays for access per transaction carried
    out.


    As we have already seen in the previous chapters of this book, the blockchain
    stands to provide all kinds of solutions to businesses and other entities. The
    general belief is that it could replace all the server backends within the next
    decade or so, which means almost every software application used by a business
    today will become available on the blockchain. Of course, by now we understand
    why the blockchain could be the better technology, offering security, privacy,
    efficiency, and new technical capabilities.


    ### Blockchain-as-a-Service (`BaaS`)


    Many processes, procedures, and activities are involved before and during a business
    using the blockchain. Just as with other types of technology, these can be overwhelming
    even for a large entity, which is precisely why Blockchain-as-a-Service (`BaaS`)
    is a welcome concept for many. Like other `SaaS` solutions, `BaaS` allows businesses
    to access all the advantages of the technology without having to worry about the
    technical backend operations or having to incur huge initial costs.


    However, fundamental differences exist between `BaaS` and other `SaaS` solutions,
    in particular about who (1) hosts the software or application, (2) supports, and
    (3) maintains it. In this chapter, we are going to explore these fundamental differences.


    #### The two levels of `BaaS`


    First, however, it is essential to point out that the `BaaS` exists on at least
    two primary levels. On one level is the blockchain core software, or the installation
    to be part of the peer-to-peer network that supports the blockchain. And the level
    of the applications on top of the blockchain, also known as the `dApps` (though
    some `dApps` are actually centralised). Using Ethereum to illustrate this, the
    first level involves the hosting and maintenance of the shared ledger itself,
    the so-called Ethereum blockchain. The second layer is about the hosting and maintenance
    of, for example, a smart contract application on the shared ledger.


    A business might need the core blockchain software or a particular application
    on the blockchain taken care of on their behalf. The first scenario happens when
    the company or entity intends to build an entirely new blockchain. They would
    need the tools and processes to do it in a way that attracts the least friction.
    In the second scenario, a business needs to use a particular application to automate,
    secure, or increase capacity. Most businesses, especially small scale ones, need
    both the blockchain and the `dApp` on top of it to come as `SaaS`. In other cases,
    they need `BaaS`, but they build and maintain their own application on top of
    it.


    ### Benefits of using `BaaS`


    Let’s explore why `BaaS` is critical. The following are some reasons businesses
    and other entities need such a service.


    First, it is the most appropriate and practical way to sidestep the problem of
    lack of technical capacity, talent, or skill required to build a blockchain or
    an application on top of it. As things stand now (at least during the writing
    of this book), the job market is short on blockchain skill and talent. If you
    are looking to hire a blockchain designer, developer, or game theorist, for example,
    you may struggle, because not many are adequately prepared. During a Fintech symposium,
    the financial services company `DTCC` organised for top executives in the financial
    sector in May 2017, in New York City, the lack of appropriate blockchain talent
    to hire was cited as one of the biggest challenges most companies intending to
    leverage the blockchain technology in one way or another faced^([1](#ch18.xhtml#ch18fn1)).
    Due to this shortage, startups and small businesses in particular struggle to
    put together competitive teams. It makes sense that a business would instead tap
    into already built blockchain protocols and applications by third parties.


    The second reason is that it helps businesses avoid worrying about the continuous
    maintenance of the system. More importantly, the security and robustness of the
    system they are using are handled by someone more prepared and competent enough.
    Having an internal engineer or a security officer can turn out to be very costly,
    especially for a small business. Using the blockchain as service by a third party
    gives a business the benefits of the technology, as the service provider takes
    care of much of the critical and emerging issues.


    Thirdly, using `BaaS` minimises your regulatory responsibility as far as the technology
    is concerned. The designers, game theorists, and developers of the technology
    have to figure out the essential elements of its legality, sometimes designing
    the technology in such a way that it does not offend existing laws and regulations.
    Of course, every business has to understand that the buck stops with them as far
    as adherence to the law is concerned. However, having someone else take care of
    at least that responsibility can release a business to focus on other issues.


    Another reason why a business would consider using `BaaS` instead of setting up
    their own systems from scratch is time. It takes months or even years to build
    a new blockchain or even some applications on the blockchain. Accessing `BaaS`,
    however, does not usually take that much time. Often it is a matter of opening
    an account and customising the dashboard to meet the specific needs of the business.
    This can take minutes instead.

    '
