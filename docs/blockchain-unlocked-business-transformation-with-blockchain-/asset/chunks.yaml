- raw: 'That said, cryptocurrency transactions have slowed for other reasons too.
    For the longest time, the primary use of cryptocurrencies, in addition to speculation,
    was to move money from one corner of the globe to another. There remain very few
    places where you can pay for goods and services in cryptocurrency. You almost
    always have to convert your cryptocurrency to fiat, where most delays and bottlenecks
    occur. As more exchanges are forced to meet stringent regulations, using cryptocurrency
    is becoming slower and more expensive.


    Nevertheless, cryptocurrencies are providing an option outside of the banking
    system—even if people cannot spend cryptos to pay for goods and services at local
    businesses. That will happen slowly and, over time, be something normal. Meanwhile,
    banks will have a worthy competitor that they not only worry about but also learn
    from. Indeed, many banks, central banks, and other financial institutions are
    already seeking to use cryptocurrencies to improve their service delivery. They
    realise that they must plan for the future where people do not have to go through
    them when sending one another money, the distance notwithstanding. But more on
    that later. We need to look at the second way blockchain is transforming banking
    and financial services.


    Moving money from point A to B is not the only service that banks and most other
    financial institutions offer. It is often neither the primary product nor the
    main source of revenue for them. It is also not their source of influence on the
    economy. If you look at the annual financial reports of most major banks and financial
    institutions, interest from loans and other forms of credit are at the top of
    the list of sources of their revenue, as well as power, in the financial sector.
    Also, high on the list are ATM fees, overdraft fees, and other types of fees.
    Loans and related services are their main products. Thus, even if blockchain were
    to take over the entire remittance business, traditional financial institutions
    would feel little impact.


    ### **Decentralised finance applications**


    However, the blockchain is finding usefulness in other aspects of banking and
    finance. This is where decentralised finance (DeFi) applications come in.^([2](#ch09.xhtml#ch09fn2))
    These are special dApps that provide other banking services, including credit,
    currency exchange, insurance, savings, and even portfolio management. Unlike conventional
    banks and financial institutions, DeFi services are offered in the peer-to-peer
    arrangement; one person can give another credit without going through a trusted
    third party. After all, banks do not actually give credit from their own finances
    but from what is collected from customers as deposits into savings account. Indeed,
    much of what banks do is to facilitate the movement of value between the borrowers
    and savers. Of course, they also provide security and assurance with regard to
    repayment. But then they take an interest and share part of it with the depositors.


    Blockchain removes the need for facilitation by a third party, whether a bank,
    an insurance company, or a portfolio managing entity. It provides the tools that
    make it possible for two individuals to extend a variety of banking services to
    one another. It is even possible for corporations to get credit from the public.


    #### **The smart contract application**


    The primary tool that makes peer-to-peer DeFi transactions possible is the smart
    contract application. If you recall from [Chapter 6](#ch06.xhtml), the smart contract
    allows for drafting and enforcement of agreements through computer programs. It
    auto executes when the terms and any pre-agreed conditions are met. This single
    application makes it possible to trust giving a stranger a loan that will be repaid
    as stipulated in the agreement. For example, as security for the loan, the smart
    contract could include an asset such as a land title or digital tokens. In the
    event the borrower fails to pay by the agreed time, the smart contract automatically
    transfers the asset title ownership offered as security to the lender.


    In addition to supporting the smart contracts for peer-to-peer financial services,
    the blockchain also makes it possible that people can prove their identity as
    well as reveal the reputation they have accumulated without them being able to
    manipulate the records.


    Oasis, an application that is part of MakerDAO (a dApp on the Ethereum blockchain),
    is an example of a DeFi application that is already built and working. On Oasis,
    one can borrow money by using digital assets as collateral, trade with other peers,
    and also save. Savings will earn you interest as the money is loaned to others
    who pay back with interest. When taking a loan, one has to lock in the collateral
    using a smart contract application. MakerDAO is basically a platform that is maintained
    by a community of users through an elaborate governance structure. Indeed, DAO
    stands for a decentralised anonymous organisation.


    #### **The currency exchange**


    Another financial service offered through DeFi is the currency exchange, which
    is another primary service provided by banks and financial institutions. In the
    last few years, decentralised exchanges (DEXs) have become a reality. These are
    platforms powered by the blockchain and smart contracts, in particular, where
    you can sell one currency for another in a peer-to-peer arrangement. One DeFi
    application that offers currency exchange service is the Unisawap, which runs
    on top of the Ethereum blockchain too.


    Other DeFi applications that are attracting attention include the market prediction
    platform Augur, decentralised insurance protocol Etherisc, and P2P lending platform
    CoinLoan. It is still too early to tell if these DeFi applications will grow to
    become really successful. However, they are a representation of the future.


    For both cryptocurrencies and DeFi applications, perhaps significantly reducing
    the cost of financial services is one of biggest impacts of blockchain technology
    on banking and finance. This is very important, especially in regard to reaching
    the global unbanked population. According to World Bank estimates, over two billion
    people around the world have no bank account, excluding them from economic activities,
    which has dire consequences for their wellbeing.


    It is important to point out that while such a big number of the global population
    does not have access to financial services, almost 90 percent of the global adult
    population has access to mobile phones. These devices can serve as a financial
    services point of sale. This coupled with the blockchain reducing the cost of
    offering financial services makes it possible to reach the majority of the global
    unbanked.


    ### **What are banks doing about the rise of blockchain technology?**


    The blockchain technology is a threat to traditional banks and financial institutions.
    But it is also an opportunity become better. Indeed, banks seem to see this latter
    reality and are responding in their own best interests. One way they are doing
    this is by investing in being a part of the blockchain evolution. Mainstream banks
    and financial institutions have even given the technology their own name: distributed
    ledger technology (DLT). Others have opted to undertake individual blockchain
    projects. For example, Barclays, JP Morgan Chase, and HSBC are just some of the
    major banks investing in blockchain startups.


    Some have opted to be part of consortiums that are designing and building the
    technology for the industry. As mentioned in [Chapter 5](#ch05.xhtml), one of
    the two most prominent consortiums is the Linux Foundation-led Hyperledger. The
    consortium released its first blockchain protocol, dubbed Fabric, in June 2016.^([3](#ch09.xhtml#ch09fn3))
    The other consortium is R3, which released their first version of the protocol
    known as Corda in November 2016.'
  fmt: '

    加密货币交易放缓还有其他原因。长期以来，加密货币的主要用途（除了投机）是将资金从全球一角转移到另一角。能够直接用加密货币支付商品和服务的地方仍然非常少。你几乎总是必须将加密货币兑换成法币，而大多数延迟和瓶颈就发生在这个环节。随着更多交易所被迫满足严格的监管要求，使用加密货币变得越来越慢且成本更高。


    尽管如此，加密货币提供了一种银行体系之外的选择——即使人们目前无法在本地商家用加密货币支付商品和服务。这种情况会慢慢改变，并最终变得正常化。与此同时，银行将拥有一个强有力的竞争对手，它们不仅会担心这个对手，还会从中学习。事实上，许多银行、央行和其他金融机构已经在寻求利用加密货币来改善服务交付。它们意识到必须为未来做打算，那时人们转账不再需要经过它们，无论距离多远。但这是后话。我们需要看看区块链改造银行和金融服务的第二种方式。


    转账并非银行和大多数其他金融机构提供的唯一服务。这通常既不是它们的主要产品，也不是主要收入来源，更不是它们对经济施加影响的来源。如果你看大多数大型银行和金融机构的年度财务报告，贷款利息和其他形式的信贷收入位列收入来源榜首，也是金融部门权力的来源。ATM
    手续费、透支费和其他各类费用也名列前茅。贷款及相关服务才是它们的核心产品。因此，即使区块链接管了整个汇款业务，传统金融机构也几乎不会受到冲击。


    ### 去中心化金融应用


    然而，区块链在银行和金融的其他方面正展现出实用价值。这就是去中心化金融（DeFi）应用登场的地方。^([2](#ch09.xhtml#ch09fn2)) 这些是提供其他银行服务的特殊
    `dApps`，包括信贷、货币兑换、保险、储蓄，甚至投资组合管理。与传统银行和金融机构不同，DeFi 服务采用点对点模式提供；一个人可以直接给另一个人提供信贷，无需经过受信任的第三方。毕竟，银行并非从自身资金中发放信贷，而是来自客户存入储蓄账户的存款。确实，银行所做的很大一部分工作是促进借款人和储蓄者之间的价值流动。当然，它们也提供关于还款的安全性和担保。但随后它们收取利息，并将其中一部分分给存款人。


    区块链消除了对第三方（无论是银行、保险公司还是投资组合管理实体）促成交易的需求。它提供了工具，使两个个体能够相互提供各种银行服务。甚至企业也可以从公众那里获得信贷。


    #### 智能合约应用


    使点对点 DeFi 交易成为可能的主要工具是智能合约应用。如果你还记得[第 6 章](#ch06.xhtml)的内容，智能合约允许通过计算机程序起草和执行协议。当条款和任何预先约定的条件得到满足时，它会自动执行。这一单一应用使得我们可以信任地将贷款借给陌生人，并按协议规定偿还。例如，作为贷款担保，智能合约可以包含土地所有权或数字代币等资产。如果借款人未能在约定时间偿还，智能合约会自动将作为担保提供的资产所有权转移给贷款人。


    除了支持点对点金融服务的智能合约外，区块链还使人们能够证明自己的身份，并展示积累的信誉，而无法篡改记录。


    `Oasis` 是 `MakerDAO`（以太坊区块链上的一个 `dApp`）的一部分，是一个已经构建并运行的 DeFi 应用示例。在 `Oasis` 上，可以使用数字资产作为抵押品借款、与其他对等方交易，也可以储蓄。储蓄会产生利息，因为资金被借给其他人并连本带息偿还。借款时，必须使用智能合约应用锁定抵押品。`MakerDAO`
    本质上是一个通过精心设计的治理结构由用户社区维护的平台。确实，`DAO` 代表去中心化自治组织。


    #### 货币兑换


    DeFi 提供的另一项金融服务是货币兑换，这也是银行和金融机构提供的另一项核心服务。近年来，去中心化交易所（`DEXs`）已成为现实。这些是由区块链和智能合约驱动的平台，你可以在点对点模式下将一种货币兑换为另一种。提供货币兑换服务的
    DeFi 应用之一是 `Uniswap`，它也运行在以太坊区块链之上。


    其他备受关注的 DeFi 应用包括市场预测平台 `Augur`、去中心化保险协议 `Etherisc` 和 P2P 借贷平台 `CoinLoan`。目前判断这些
    DeFi 应用能否成长为真正成功的项目还为时过早。然而，它们代表了未来。


    对于加密货币和 DeFi 应用而言，显著降低金融服务成本或许是区块链技术对银行和金融业最大的影响之一。这非常重要，特别是对于触达全球无银行账户人口而言。根据世界银行估计，全球有超过
    20 亿人没有银行账户，这使他们被排除在经济活动之外，对其福祉产生了严重后果。


    值得注意的是，虽然如此庞大的全球人口无法获得金融服务，但全球近 90% 的成年人拥有手机。这些设备可以作为金融服务的销售终端。这加上区块链降低了金融服务的提供成本，使得触达大多数无银行账户人口成为可能。


    ### 银行如何应对区块链技术的崛起？


    区块链技术对传统银行和金融机构构成威胁。但它也是一个变得更好的机会。确实，银行似乎看到了这一现实，并出于自身最佳利益做出回应。其中一种方式是投资成为区块链演进的一部分。主流银行和金融机构甚至给这项技术起了自己的名字：分布式账本技术（`DLT`）。其他银行则选择开展独立的区块链项目。例如，`Barclays`、`JP
    Morgan Chase` 和 `HSBC` 只是投资区块链初创公司的几家主要银行。


    一些银行选择加入联盟，为行业设计和构建技术。正如[第 5 章](#ch05.xhtml)所述，两个最著名的联盟之一是 `Linux Foundation`
    主导的 `Hyperledger`。该联盟于 2016 年 6 月发布了其首个区块链协议，名为 `Fabric`。^([3](#ch09.xhtml#ch09fn3))
    另一个联盟是 `R3`，于 2016 年 11 月发布了其首个版本的协议 `Corda`。

    '
  trans: '

    加密货币交易放缓还有其他原因。长期以来，加密货币的主要用途（除了投机）是将资金从全球一角转移到另一角。能够直接用加密货币支付商品和服务的地方仍然非常少。你几乎总是必须将加密货币兑换成法币，而大多数延迟和瓶颈就发生在这个环节。随着更多交易所被迫满足严格的监管要求，使用加密货币变得越来越慢且成本更高。


    尽管如此，加密货币提供了一种银行体系之外的选择——即使人们目前无法在本地商家用加密货币支付商品和服务。这种情况会慢慢改变，并最终变得正常化。与此同时，银行将拥有一个强有力的竞争对手，它们不仅会担心这个对手，还会从中学习。事实上，许多银行、央行和其他金融机构已经在寻求利用加密货币来改善服务交付。它们意识到必须为未来做打算，那时人们转账不再需要经过它们，无论距离多远。但这是后话。我们需要看看区块链改造银行和金融服务的第二种方式。


    转账并非银行和大多数其他金融机构提供的唯一服务。这通常既不是它们的主要产品，也不是主要收入来源，更不是它们对经济施加影响的来源。如果你看大多数大型银行和金融机构的年度财务报告，贷款利息和其他形式的信贷收入位列收入来源榜首，也是金融部门权力的来源。ATM
    手续费、透支费和其他各类费用也名列前茅。贷款及相关服务才是它们的核心产品。因此，即使区块链接管了整个汇款业务，传统金融机构也几乎不会受到冲击。


    ### 去中心化金融应用


    然而，区块链在银行和金融的其他方面正展现出实用价值。这就是去中心化金融（DeFi）应用登场的地方。^(2) 这些是提供其他银行服务的特殊 `dApps`，包括信贷、货币兑换、保险、储蓄，甚至投资组合管理。与传统银行和金融机构不同，DeFi
    服务采用点对点模式提供；一个人可以直接给另一个人提供信贷，无需经过受信任的第三方。毕竟，银行并非从自身资金中发放信贷，而是来自客户存入储蓄账户的存款。确实，银行所做的很大一部分工作是促进借款人和储蓄者之间的价值流动。当然，它们也提供关于还款的安全性和担保。但随后它们收取利息，并将其中一部分分给存款人。


    区块链消除了对第三方（无论是银行、保险公司还是投资组合管理实体）促成交易的需求。它提供了工具，使两个个体能够相互提供各种银行服务。甚至企业也可以从公众那里获得信贷。


    #### 智能合约应用


    使点对点 DeFi 交易成为可能的主要工具是智能合约应用。如果你还记得第 6 章的内容，智能合约允许通过计算机程序起草和执行协议。当条款和任何预先约定的条件得到满足时，它会自动执行。这一单一应用使得我们可以信任地将贷款借给陌生人，并按协议规定偿还。例如，作为贷款担保，智能合约可以包含土地所有权或数字代币等资产。如果借款人未能在约定时间偿还，智能合约会自动将作为担保提供的资产所有权转移给贷款人。


    除了支持点对点金融服务的智能合约外，区块链还使人们能够证明自己的身份，并展示积累的信誉，而无法篡改记录。


    `Oasis` 是 `MakerDAO`（以太坊区块链上的一个 `dApp`）的一部分，是一个已经构建并运行的 DeFi 应用示例。在 `Oasis` 上，可以使用数字资产作为抵押品借款、与其他对等方交易，也可以储蓄。储蓄会产生利息，因为资金被借给其他人并连本带息偿还。借款时，必须使用智能合约应用锁定抵押品。`MakerDAO`
    本质上是一个通过精心设计的治理结构由用户社区维护的平台。确实，`DAO` 代表去中心化自治组织。


    #### 货币兑换


    DeFi 提供的另一项金融服务是货币兑换，这也是银行和金融机构提供的另一项核心服务。近年来，去中心化交易所（`DEXs`）已成为现实。这些是由区块链和智能合约驱动的平台，你可以在点对点模式下将一种货币兑换为另一种。提供货币兑换服务的
    DeFi 应用之一是 `Uniswap`，它也运行在以太坊区块链之上。


    其他备受关注的 DeFi 应用包括市场预测平台 `Augur`、去中心化保险协议 `Etherisc` 和 P2P 借贷平台 `CoinLoan`。目前判断这些
    DeFi 应用能否成长为真正成功的项目还为时过早。然而，它们代表了未来。


    对于加密货币和 DeFi 应用而言，显著降低金融服务成本或许是区块链技术对银行和金融业最大的影响之一。这非常重要，特别是对于触达全球无银行账户人口而言。根据世界银行估计，全球有超过
    20 亿人没有银行账户，这使他们被排除在经济活动之外，对其福祉产生了严重后果。


    值得注意的是，虽然如此庞大的全球人口无法获得金融服务，但全球近 90% 的成年人拥有手机。这些设备可以作为金融服务的销售终端。这加上区块链降低了金融服务的提供成本，使得触达大多数无银行账户人口成为可能。


    ### 银行如何应对区块链技术的崛起？


    区块链技术对传统银行和金融机构构成威胁。但它也是一个变得更好的机会。确实，银行似乎看到了这一现实，并出于自身最佳利益做出回应。其中一种方式是投资成为区块链演进的一部分。主流银行和金融机构甚至给这项技术起了自己的名字：分布式账本技术（`DLT`）。其他银行则选择开展独立的区块链项目。例如，`Barclays`、`JP
    Morgan Chase` 和 `HSBC` 只是投资区块链初创公司的几家主要银行。


    一些银行选择加入联盟，为行业设计和构建技术。正如第 5 章所述，两个最著名的联盟之一是 `Linux Foundation` 主导的 `Hyperledger`。该联盟于
    2016 年 6 月发布了其首个区块链协议，名为 `Fabric`。^(3) 另一个联盟是 `R3`，于 2016 年 11 月发布了其首个版本的协议 `Corda`。

