    \n| ![image](images/ch-11.jpg) || **Use Case 3:  \n\nGovernment** |\n\n| --- |\
    \ --- |\n\nLike most technologies, blockchain is as useful in the public sector\
    \ as it is in the private sector. Governments around the world are already embracing\
    \ it for different use cases. Some have set up task forces to advise them on how\
    \ to proceed. Others are a little more ahead and in partnerships with the private\
    \ sector in various processes to design, develop, test. Some are already implementing\
    \ applications meant to change how they deliver services to citizens.\n\nWe can\
    \ categorise the major impact of blockchain on government in two ways: (1) improving\
    \ exist processes and systems and (2) changing the idea of government altogether.\
    \ In this chapter, we look in detail at both and the possible impacts on the government.\n\
    \n### **Blockchain for existing systems and processes**\n\nWe begin with how blockchain\
    \ can improve existing systems and processes. This happens to be the most feasible\
    \ blockchain application in the public sector, not least because it would cause\
    \ less disruption and not tamper with the existing balance of power, which is\
    \ very important for governments. With this stated, the technology can improve\
