- raw: 'This financial service accessed through USSD text messages has managed to
    increase financial inclusion from below 30 percent to over 90 percent. Indeed,
    it is a technological shift that has changed many things, such as the way Kenyans
    consume and pay for their energy. It made it easier to access electricity and,
    in particular, more comfortable and more convenient to pay the power bills.


    Kenya Power, the country’s power utility company, was, however, not satisfied
    with having a mobile money account number to which consumers would send their
    payments. It decided to be a little more creative with this new payment service.
    The mobile money service facilitated a complete overhaul on how the utility company
    provided services. Before, electricity consumers had to go through a lot of trouble
    to receive services. In particular, the time to pay for the electricity bill every
    month turned into an unpleasant chore. Usually, one had to queue for hours just
    to make the payment at the local office of the power utility company, which meant
    taking time off from work and other engagements to take care of the electricity
    bill.


    Despite the trouble it took to settle the bill, one could not afford to miss the
    deadline. If for whatever reason, you could not make it to the local utility office
    to settle your bill, you had to find someone to do it on your behalf, and often
    that meant setting aside some money to pay them, which was a small cost to pay
    considering what would happen if you did not pay the bill in time. If you missed
    the deadline, the company would send technicians over to your place to disconnect
    it from the grid. And that was a terrible situation to find yourself in.


    To get reconnected, you had to apply by filling paperwork, settling the outstanding
    bill, and paying the fees to cater for the logistics of the technicians coming
    back to your home or premises. Even after doing all this, you often had to wait
    for days, weeks, or even months before they showed up to get you back online.
    Sometimes, you had to bribe someone before a team would beassigned to attend to
    your issue.


    This system was not good on the utility company’s side either. In addition to
    poor customer experience, which made customers not happy with the service provider,
    the process of service delivery was costly and very inefficient. Every month the
    company had to send out an army of staff to the field to manually read the meters
    and deliver the figures to the company offices to be fed into the system for invoices
    to be generated. Since the data was captured manually, a lot could go wrong. That
    includes inaccurate capture of the values on the meter as well as errors when
    transferring the data from hard copy forms to digital databases.


    There was also the issue of deliberate misrepresentation of facts. For example,
    the member of staff reading a meter could capture on the official documentation
    fewer units than actually consumed for customers willing to bribe. This ended
    up being a cost to the company because while energy was consumed, it was never
    paid for, even though the company incurred a loss in production. Of course, ensuring
    enough members of staff to visit every customer every month translated to a huge
    wage bill.


    Then in 2009, the company adopted a smart meter system that relied on the tokenisation
    of the energy delivered to customers. The energy units would be bought as tokens
    from the utility company using a mobile money service. Now instead of waiting
    for a specific time in the month to go queue with everyone else for hours, you
    could do everything using your phone from the comfort of your home or office.
    All you need to do is to send payment to the utility company’s mobile money account,
    and within minutes they send you a token code in a text message. You input this
    code on your smart meter, and you are connected to the grid^([3](#ch15.xhtml#ch15fn3)).


    When the tokens deplete, the power supply automatically disconnects. But all you
    have to do is buy more tokens and feed the meter again. In addition to the convenience,
    you no longer had to worry about physical disconnection and the hustle of getting
    the technicians to come to reconnect or paying some fee for that.


    For the utility company, it no longer needed an army of staff on the ground to
    read meters and report back to the office physically. The meters directly communicate
    with the internal company systems that generated and assigned tokens to customers
    after they paid from their mobile phones. And that cut the cost of operation significantly.


    Everything seemed to have turned out well for everyone. However, that changed
    in late 2019 when it emerged that the tokenising energy system had been compromised.
    For close to two years, some members of staff colluded with rogue individuals
    from outside to steal from both customers and the utility company. It turned out
    that they charged customers up to five times the official rate and pocketed the
    difference. At the same time, they illicitly generated tokens and sold them in
    the black market and pocketed the revenue. The scheme was so massive that it threatened
    the financial soundness of the utility company^([4](#ch15.xhtml#ch15fn4)).


    The tokenised energy system that the Kenya Power adopted is better than before.
    It is efficient, convenient, and less costly. However, its full potential can
    only be realised with a more robust data management system. The loopholes that
    rogue members of staff and others exploited have to be sealed.


    Indeed, the Kenya Power utility token management system needs a technology that
    makes the generation and assignment of tokens as well as receipt of payment tamper-proof.
    These are the values that blockchain technology offers to any kind of data management
    system.


    The blockchain makes possible the deployment of a token generation protocol that
    not even the person with the highest level of admin access can compromise. Indeed,
    the technology has proven itself in this regard beyond any doubt. For example,
    the Bitcoin blockchain is accessible to all. Nevertheless, not a single hacker
    has managed to hack the system and assigned themselves or others any tokens (bitcoins).


    It also can automate the distribution of tokens through immutable smart contracts.
    Thus, if a customer sends payment to a wallet address, the smart contract will
    generate appropriate tokens and send them back to the client without room for
    third party human intervention. This leaves no room for inflated pricing or someone
    taking an unauthorised cut from what the customer pays.


    Also, a system built on the blockchain is hard for an outsider to hack, without
    a central point to attack. In short, the blockchain removes the central points
    of failures that legacy systems like what the Kenya Power one deals with. Since
    the company can secure data and protect transactions, it is in a position to give
    excellent customer experience and avoid a loss to theft and corruption.


    Kenya Power has not yet (as at the time of writing this book) embraced blockchain
    to fix the issues it has faced regarding the management of its energy token generation
    and sale. However, others in the energy sector, in other countries, have seen
    the potential of the technology to secure data and distribution channels. One
    of those is the Chilean National Energy Commission (CNE). In 2018, the public
    energy regulator in the South American country of Chile announced the launch of
    a blockchain energy project.


    The project is a partnership with the blockchain software technology company,
    ConsenSys. It would explore the Ethereum blockchain for use in recording, storing,
    and tracking data related to the production, distribution, and consumption of
    energy in the country.


    Of course, a blockchain data management system would also benefit from improved
    privacy for users. We’ve already seen how this works with the other use cases.
    It is not any different in the energy sector.


    #### **New systems of energy distribution**'
