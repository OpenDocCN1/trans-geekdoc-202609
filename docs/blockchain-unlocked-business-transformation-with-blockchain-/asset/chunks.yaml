    Tokenomics is a relatively new term. Canadian blockchain angel investor and venture
    advisor, William Mougayar, claimed to have coined it sometime in 2017. Mougayar
    himself is a fairly well-known individual within the blockchain space. Aside from
    investing in various blockchain startups and sitting on several boards, he is
    an author, blogger, speaker, and the founder of Token Summit, which is an annual
    conference on the Token-based Economy^([1](#ch03.xhtml#ch03fn1)).


    As you’ve probably already guessed, Tokenomics is a compound of the words *token*
    and *economics*. It substitutes the term economics of tokens. Defining the root
    term “token” will help us have a better grasp of Tokenomics.


    ### **Tokens are not new.**


    It is essential to point out that tokens did not arrive with the blockchain. Tokens
    have always existed before blockchain, such as loyalty points and casino chips.
    In Switzerland, local authorities sell rubbish bags as tokens^([2](#ch03.xhtml#ch03fn2)),
    which are sold at a price that is several times higher than the cost of production.
    The added price is deemed what you pay for the rubbish that is put into the bag.


    What the blockchain has done is to make digital tokens easier, secure, and more
    convenient to create, manage, and use.


    So, what is a token?


    According to the Google dictionary, a token is a thing that represents or stands
    for something of value. A token does not have intrinsic value, but is assumed
    to carry the value of the asset it represents. For example, a casino chip is not
    useful, except for its representation of value that a player can redeem from the
    casino in the form of cash. On the blockchain, there is a little confusion as
    to which assets are tokens. Depending on who you ask, all digital assets that
    are created, managed, and used on top of a blockchain are tokens. This includes
    cryptocurrencies like Bitcoin, Monero, Ether, and Zcash. There are even literature,
    presentations, and published books that use the words token and cryptocurrency
    interchangeably.


    However, a token and a cryptocurrency are not the same thing in the strictest
    sense of the words. Unlike crytocurrency, a token is a unit on the blockchain
    that is issued for a limited or specific function or use. This can be where it
    is used or the extent to which it is used. For example, a casino chip is a token
    because you can use it only within the casino and only for gambling.


    Loyalty points that a retail store, or any other business entity, creates and
    awards are tokens. You can use them only within the issuer’s establishment and
    for the purpose they define. You cannot—unless there are exceptions—use loyalty
    points issued by one entity to get benefits from its competitor or third-party
    business. An example of a token on the blockchain is Steem, which is used as a
    native utility coin on Steemit, a blockchain-based blogging and social media platform.
    Users pay and get paid in Steem. And it is an incentive for those who create content
    on the platform. There is hardly any third-party store that you can shop at using
    the Steem token.


    On the other hand, cryptocurrencies like Bitcoin are units of value that are used
    as a medium of exchange, store of value, and unit of account across many platforms.
    In other words, they do most of the functions of a legal tender, even though they
    are not. They are private digital currencies. This is why we call them cryptocurrencies
    (currencies that use cryptography).


    The fact that an asset is a token today does not mean it cannot be a currency
    tomorrow. It is important to point this out. In the early days, Bitcoin was more
    of a token than a currency. Its primary function was to serve as an incentive.
    People kept their machines running to support the Bitcoin network and get the
    coins in return. Over time, Bitcoins became acceptable as a means of payment outside
    the network. We can argue that this turned it into a currency.


    ### **What types of tokens exist in blockchain?**


    In broad terms, there are four types of tokens you can create on the blockchain.
    It is important to point out that these categories can overlap, so a token can
    fit easily into two or even three of them.


    #### **Initial Coin Offering tokens**


    Initial Coin Offering (ICO) tokens are created for the sole purpose of raising
    capital for a project. It is a means of collecting funds to go into building a
    platform. Such a token is particularly useful for funding the development of open-source
    projects. The buyers of this token do not expect dividends. Instead, they hope
    that when the project is finally built, the value of the token will go up, and
    can be sold to others at higher prices for profit.


    Due to pressure from regulators, however, we are not seeing any ICO tokens being
    issued. Anyone who wants to sell tokens has to define them as either utility tokens
    or security tokens. Some tokens are now being issued through exchanges, which
    is referred to as the initial exchange offering (IEO). Instead of the startup
    in question selling the token, it engages an exchange to do this on its behalf.


    #### **Utility tokens**


    The second category comprises utility tokens. These are tokens created to provide
    access to specific services and privileges on a platform. One example is the Storj
    coin, which you use to pay for space on the Storj network, a decentralised cloud
    storage service. It is easier to sell utility tokens compared to other forms of
    tokens, especially the security tokens. However, you need to prove to regulators,
    such as the Securities Exchange Commission (SEC) in the US, that it does serve
    a particular purpose on your ecosystem and that you are not selling it simply
    to raise capital.


    #### **Assets-backed tokens**


    The third category of tokens that startups and projects create on the blockchain
    are the assets-backed tokens. These are tokens created to represent real-life
    assets such as real estate, gold, artwork, and even fiat currency on the blockchain.
    They provide a mode of digitising these real-world assets in a way that makes
    it easy to trade them and thus increase their liquidity. An example is Tether,
    which is backed by (and pegged to) the US dollar. Tether makes it easy to move
    US dollar in and out of the Bitfinex exchange. It is one of several stablecoins,
    which include TrueUSD, Paxos Standard, and Binance USD.


    #### **Security tokens**'
