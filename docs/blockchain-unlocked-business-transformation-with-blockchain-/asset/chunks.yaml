    # Thirdly: Fraud in Real Estate


    As a real estate investor, you have to deal with the rampant fraud that exists
    in the industry. Agents and other players often misrepresent or fail to disclose
    material facts about the assets they are selling or facilitating a lease. After
    all, their motivation is to increase the size of their takings. Indeed, the details
    about a single piece of an asset can change as many times as the number of potential
    buyers or lessees. Also, many cases of scammers compromising land title registries
    and misleading investors to send money to wrong accounts have been reported. In
    one case in Washington DC, US, a couple was tricked into wiring US$1.57 million
    to con artists. It turned out that the criminals had accessed the title registry
    servers and launched what appeared like a genuine transaction^[1](#ch16.xhtml#ch16fn1).
    According to one report by the CIA, Americans lose at least US$150 million annually
    to fraud in the real estate sector^[2](#ch16.xhtml#ch16fn2).


    # Fourth: Asset Liquidity


    Being able to turn an asset quickly into cash is an essential consideration for
    many investors. At the moment, real estate is a low liquidity market. According
    to Zillow, an American online real estate database company, it takes an average
    of about three months before a listed house is sold. Many investors keep away
    from the market because of this reality^[3](#ch16.xhtml#ch16fn3).


