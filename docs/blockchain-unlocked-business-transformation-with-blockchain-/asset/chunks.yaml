    稳定币的发行必须由一家公司或中心化实体负责，该实体承诺持有等同于已发行稳定币数量的美元（或其他资产）。这种结构的本质在于用户可以用支撑稳定币的资产来赎回稳定币。当然，使用中心化系统来支撑区块链上的代币会带来一些挑战，其中之一就是透明度和问责制。例如，2019
    年 4 月，最早发行的稳定币之一泰达币（Tether）面临指控，其审计报告反映出存在不当行为，且指称每枚代币并非真正由一美元支撑^(9)。同样令人担忧的是，该公司属于最大的加密货币交易所之一
    Bitfinex，这造成了潜在的利益冲突。


    截至目前，稳定币的种类已增至十余种，其中最受欢迎的有泰达币（Tether）、USD Coin、TrueUSD、Paxos Standard 和 Gemini
    Dollar。它们主要作为一种支付方式，供希望在交易所之间以及加密货币与美元之间快速转移美元价值的交易者使用，而无需损失关键时间。


    在撰写本书时，尚不清楚稳定币是否会被采纳为商品和服务的支付手段。然而，某种形式的稳定币极有可能在未来获得大规模采用。


    我们还必须提及在区块链上发展起来的另一种支付服务——汇款服务。在全球范围内，大量资金以汇款形式，由发达国家的移民工人汇回第三世界国家的家庭和赡养亲属手中。根据世界银行数据，全球每年汇款总额接近
    6000 亿美元^(10)。


    对移民工人来说，汇款回国成本非常高昂。在某些情况下，费用高达涉及金额的 10%至 20%。这笔钱本可以改变菲律宾或许多非洲国家贫困家庭的命运。一些初创公司正利用区块链降低汇款处理成本，使汇款人和收款人有更多资金用于更迫切的需求。


    多家初创公司和银行正利用区块链降低汇款成本。Union Bank 和 Rebit 就是菲律宾的例子，该国有大量公民在阿联酋、美国和欧洲等国家工作。


    确实，海外工作的菲律宾人每年汇回国内的资金高达 350 亿美元。


    ### 企业对企业（B2B）支付解决方案


    现在让我们把注意力转向正在区块链上设计的 B2B 支付解决方案。几十年来，公司和其他机构一直使用 SWIFT（环球同业银行金融电讯协会），这是银行用来协商清算银行间支付、将资金从全球一角转移到另一角的通讯系统。


    SWIFT 系统高度依赖参与实体间的信任。它也非常缓慢，特别是因为交易的关键部分必须人工处理和批准。因此，资金从一个国家转移到另一个国家可能需要数天甚至数周。该系统可以被一个利用分布式账本技术（DLT）的更高效系统所取代。Ripple
    就是一个为此而设计的平台。它提供速度和效率，且成本更低。同时，通过 Hyperledger 和 R3 等联盟，银行正在探索构建类似的解决方案，以促进彼此之间的支付交易。


    虽然区块链应用的重点已转移到其他用例，但支付领域仍蕴藏巨大潜力，我们在不久的将来很可能会看到更多创新。


    ^(1) Popov, Sergei. “The Tangle.” IOTA: The Next Generation of Distributed Ledger
    Technology, IOTA, Apr. 2018, [www.iota.org/research/academic-papers](http://www.iota.org/research/academic-papers)。


