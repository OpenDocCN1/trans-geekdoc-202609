    A stablecoin has to be issued with a company or centralised entity that would
    commit to holding the amount of dollars (or other assets) equal to the number
    of units of stablecoin issued. The essence of the structure is that users can
    redeem their stablecoin for the asset that backs it. Of course, the use of a centralised
    system to back a coin on the blockchain creates some challenges, one of which
    being transparency and accountability. For example, in April 2019, Tether, one
    of the first stable coins to be issued, faced accusations when its audits reflected
    malpractices and allegations that each coin was not actually backed by a dollar^([9](#ch12.xhtml#ch12fn9)).
    It was also concerning that the company was part of one of the largest crypto
    exchanges, Bitfinex, creating a possible conflict of interest.


    Today the list of stablecoins has grown to over ten, of which the most popular
    are Tether, USD Coin, TrueUSD, Paxos Standard, and Gemini Dollar. All serve primarily
    as a payment method for traders who want to quickly move their dollar value between
    exchanges as well as between cryptos and the US dollar without losing critical
    time.


    At the time of writing this book, it is not clear whether stablecoins will be
    adopted as a means of payment for goods and services. However, a form of stablecoin
    is very likely to get mass adoption in the future.


    We must touch on one more type of payment service that has developed on the blockchain—the
    remittance service. Around the world, a significant amount of money flows as remittances
    by immigrant workers in developed countries back to their families and dependents
    in third world countries. According to the World Bank, the amount sent annually
    as remittance around the world is close to US$600 billion^([10](#ch12.xhtml#ch12fn10)).


    It turns out to be very costly for an immigrant worker to send money back home.
    In some instances, it costs as high as ten percent to twenty percent of the value
    involved. This is money that could change the fortunes of an impoverished family
    in the Philipines or many African countries. Some startups are using the blockchain
    to cut the cost involved in handling remittances so that the sender and the recipient
    have more money to spend on more pressing needs.


    Several startups and banks are using blockchain to make it cheaper for people
    to send money back home. Union Bank and Rebit are examples from the Philippines,
    a country with a large population of its citizenry working in countries like the
    UAE, the US, and Europe.


    Indeed, Filipinos who work abroad bring into the country as much as US$35 billion
    annually.


    ### Business to business (B2B) payment solutions


    Now let’s turn our attention to B2B payment solutions that are being designed
    on the blockchain. For decades, companies and other institutions have used SWIFT,
    a messaging system that banks use to negotiate to settle interbank payments to
    move money from one corner of the globe to another.


    The SWIFT system depends heavily on trust among the participating entities. It
    is also very slow, especially as critical parts of transactions have to be processed
    and approved manually. Thus, it can take days and even weeks for money to move
    from one country to another. This system could be replaced by a more efficient
    one that uses decentralised ledger technology (DLT). Ripple is a platform designed
    to perform exactly that. It offers speed and efficiency. And it is less costly.
    Meanwhile, through consortiums such as Hyperledger and R3, banks are looking at
    building similar solutions that can facilitate payment transactions amongst themselves.


    While the focus of blockchain applications has shifted to other use cases, there
    is still a lot of potential in payments, and we are likely to see more innovation
    in the near future.


