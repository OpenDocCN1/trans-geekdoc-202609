    # Blockchain''s Impact on Business Models


    Blockchain is going to make many business models and businesses themselves irrelevant.
    To survive, most businesses might have to rethink their models. Otherwise, they
    risk facing the same demise as Kodak or Blockbuster, which did not innovate or
    upgrade their businesses to keep up with world trends; Kodak, because of digital
    cameras, stuck to printing photos, while Blockbuster stuck to renting out DVDs
    in the era of YouTube and Netflix. We are already seeing banks, insurance companies,
    and other industries taking active steps to understand the technology and how
    it might affect their business models.


    Even disruptive businesses such as Uber and Airbnb can easily be disrupted themselves,
    because they are centralised entities that aggregate resources and sell them in
    the marketplace. Blockchain makes it possible that riders and drivers, for example,
    can meet and transact without having to go through a third party like Uber. With
    an open-source blockchain application that is not owned by any corporate entity,
    homeowners can access travellers and efficiently serve them aided with smart contracts
    like they would on Airbnb. And they won''t have to give a cut of their earnings
    to anyone.


    Even though a lot of hype surrounds what blockchain can do, it is reasonable to
    expect the technology to change how we do a lot of things significantly. And that
    means we need to be proactive in learning about it.


    ## References


    1. "Deloitte''s 2019 Global Blockchain Survey: Blockchain Gets down to Business."
    Deloitte, 2019, [www2.deloitte.com/content/dam/Deloitte/se/Documents/risk/DI_2019-global-blockchain-survey.pdf](http://www2.deloitte.com/content/dam/Deloitte/se/Documents/risk/DI_2019-global-blockchain-survey.pdf).

    2. Emspak, Jesse, and Kim Ann Zimmermann. "Internet History Timeline: ARPANET
    to the World Wide Web." LiveScience, Purch, 27 June 2017, [www.livescience.com/20727-internet-history.html](http://www.livescience.com/20727-internet-history.html).

    3. Lamont, Tom. "Napster: the Day the Music Was Set Free." The Guardian, Guardian
    News and Media, 24 Feb. 2013, [www.theguardian.com/music/2013/feb/24/napster-music-free-file-sharing](http://www.theguardian.com/music/2013/feb/24/napster-music-free-file-sharing).

    4. Nakamoto, Satoshi. *Bitcoin: A Peer-to-Peer Electronic Cash System*. Bitcoin.org,
    31 Oct. 2008.


    ---


    # What Blockchain Cannot Do


    We''ve established that blockchain can do a lot. It has the potential to disrupt
    business in ways many of us have not yet imagined. But blockchain is not a panacea.
    It is not a one-size-fits-all solution to every problem that society faces, even
    if it is the impression you get when you visit any online blockchain forum or
    attend a blockchain meetup, summit, or conference. The belief that this technology
    can solve any problem thrown at it is very pervasive within the space.


    Think of any industry. Most likely, there are startups claiming to build blockchain
    solutions for particular issues. The mushrooming of such blockchain startups was
    at its height in 2016 and 2017, mostly driven by the Initial Coin Offering (ICO)
    craze. In those two years, blockchain startups raised over US$30 billion in investment.
    One startup, Bancor, a decentralised cryptocurrency exchange, raised US$153 million
    in three hours. Another, Basic Attention Token (BAT), a digital advertising token
    that provides advertising services on their browser network, raised US$35 million
    *in 30 seconds*. Dozens of similar blockchain investment stories were recorded
    in 2017 and 2018.


    However, most of the startups had nothing more than nicely polished white papers.
    It is no wonder that much of the money was lost. Most of the startups globally
    that raised money during this period either never delivered any working product
    or struggled to come up with something that could resonate with a viable market.


    ## The Siren Call of the Blockchain


    According to Ameer Rosic, a blockchain entrepreneur, investor, and founder of
    the online blockchain innovation hub, Blockgeeks, up to 90 percent of all ICOs
    failed[^1]. "The fact is, that around 99 percent of all ICOs out there will fail,"
    Ameer stated in a social media post, "And that''s not exaggerated doom and gloom,
    over the last few years, thousands of cryptocurrencies have been created, and
    over 90 percent of them have failed."


    The reason so many of them have struggled is that they either scrambled to put
    together an idea with blockchain in it or rushed to include the technology in
    product designs just so that they could get money from investors eager to be part
    of the blockchain revolution. It is also fair to state that it is cool to have
    the word blockchain in your product description. It somehow makes a business look
    innovative, futuristic, and conscious of technological trends. Even major global
    brands such as Microsoft, Samsung, Barclays, and others could not resist this
    allure.


    Many of the business ideas that were sold in 2016 and 2017 for ICO investment
    could have been better implemented without involving the blockchain technology
    at all. It is hard to tell what exactly drives the narrative that blockchain should
    be part of everything. It is a movement by the general public, perhaps through
    ground-up organisation, as they have lost trust and confidence in the bodies governing
    the various aspects of the world. My guess is this reflects a desire for power
    back to the people.


    But the enthusiasm that grows in someone once they discover and understand the
    genius of the design and architecture behind the technology, as well as the financial
    interests that often follow, must play a role. Even where the technology provides
    the most value, it has limitations; this is hardly mentioned in forums that discuss
    blockchain.


    In general, blockchain is sold as a technology that provides three primary advantages:
    (1) better security to data and systems, (2) improved privacy for users online,
    and (3) more efficiency in terms of speed, capacity as well as cost. Let''s look
    at each one.


    ### Better Security to Data and Systems


    Blockchain is the first innovation to make digital data truly immutable. Once
    a set of information is recorded on the shared digital ledger, it cannot be arbitrarily
    changed. This is very powerful, as it means it is now possible to make systems
    resistant to many forms of attacks, including man-in-the-middle, SQL Injection,
    and malware attacks. Also, as the system uses public-private key cryptography,
    there is no worry about the security of the online channels used to transfer system-access
    credentials such as passwords and PINs. A user keeps the private key for signing
    transactions locally (and even offline) and only shares the corresponding public
    key. The blockchain also uses an elaborate consensus mechanism that makes it impossible
    for a lone player to make critical decisions or changes to records without the
    involvement of other critical stakeholders.


    Given these characteristics, the blockchain seems like an excellent replacement
    for the server backend''s storage and processing of critical data. For example,
    it can make a better backend for a land registry. If land titles are on a blockchain
    backend, they cannot be easily changed by either a hacker or a dishonest person
    with the right credentials.


    [^1]: Ameer Rosic, Blockgeeks founder, social media post regarding ICO failure
    rates.

