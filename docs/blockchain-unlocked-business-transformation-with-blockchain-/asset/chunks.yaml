    Policies for Smallholder Farmers in Sri Lanka.” Oxfam, 1 July 2019, [sri-lanka.oxfam.org/latest/press-release/aon-oxfam-and-etherisc-launch-first-blockchain-based-agricultural-insurance](http://sri-lanka.oxfam.org/latest/press-release/aon-oxfam-and-etherisc-launch-first-blockchain-based-agricultural-insurance).


