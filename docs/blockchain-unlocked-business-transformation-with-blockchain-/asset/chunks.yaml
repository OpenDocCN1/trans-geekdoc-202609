- raw: 'If you are an entrepreneur or planning to be one, you can now leverage blockchain
    and pull ahead of your competition. If you are a developer or in another profession,
    you can now pursue the path that will improve the quality of your talent stack.
    And if you are a policymaker, you have a new perspective that will attune your
    decisions towards future societies.


    However, you need to take further steps. This book is supposed to serve as an
    essential backdrop. Put what you have learnt to practice. Equally important is
    immersing yourself in the study of the technology and keep close tabs on what
    is happening within the space. Perhaps I should bring up at this point that this
    space is changing at an incredible speed. An application that seems futuristic
    today can be overtaken by events the following day, week, or month. Even the core
    architecture of blockchain itself is changing fast.


    I do not need to repeat here how new consensus mechanisms are replacing old ones,
    for example.


    But how do you go about keeping your ears to the ground? Join online blockchain
    forums such as the several blockchain-related subreddits on Reddit. Make a habit
    of attending blockchain events near you, which range from local town meetups to
    international blockchain summits. In such forums and events, you stand to meet
    and interact with those who will expand your understanding of the technology.
    And read more books similar to this one. After all, the list of blockchain-related
    books is growing each month.


    While it is still early days for blockchain (at the time of writing this book),
    many places exist both online and offline, where you can do a course on particular
    aspects of blockchain. These courses run the gamut from blockchain in law to heavy
    core software coding.


    Whatever you choose, get out there and keep yourself involved with blockchain.
    By putting yourself in an advantageous position, you would not be taken by surprise
    by the changes ushered by the technology.


    Finally, if you find yourself with a burning issue that you would like to share
    with me, feel free to email at **[hello@daryllim.me](mailto:hello@daryllim.me)**.
    I look forward to hearing from you.


    | ![image](images/ch-19.jpg) || **The Blockchain Onboarding Workbook for Businesses**
    |


    | --- | --- |


    You now have much of the foundational knowledge and information on the blockchain.
    You know what it can do, and how it could change business and society at large.
    Perhaps you want the blockchain technology to give your business some value and
    maybe it is time to take the next step. It could be why you picked up this book
    in the first place. I should point out, however, that this process should be executed
    with some level of caution as well as skill. I wrote this chapter precisely for
    this purpose and will guide you through this process.


    ### **Three steps to applying blockchain in your business**


    The process of applying the blockchain to your business should take three primary
    steps:


    1. The blockchain suitability test


    Identifying exactly how your business could make the blockchain technology part
    of its processes and systems.


    2. The blockchain readiness test


    Finding out what your business already has as well as what you would need to acquire
    to make the process easier. At this stage, in other words, you take stock of your
    capacity and needs.


    3. The blockchain level or type test


    Identifying the exact part of the blockchain technology to use as every business
    has a particular element that is most appropriate for it. At this stage, you want
    to be laser accurate on how you can acquire what you need with the least cost
    and effort.


    These three steps are in a three-part workbook that I have created to help you
    figure out the answers in each critical stage. By using the questionnaire to assess
    each stage, you will understand how to handle each of these steps for your business
    in a customised manner. Take a look through it before reading the rest of this
    chapter. After going through each part in detail, go back to fill out the forms,
    which is downloadable to your device. The Blockchain Onboarding Workbook for Businesses
    is available online: **[BlockchainUnlocked.co](http://BlockchainUnlocked.co)**.


    ### **Business blockchain suitability**


    The first part of the workbook is designed to help you figure out whether your
    business is suitable to use the blockchain technology. Nearly every business on
    the planet can, in one way or another, find some use for the technology. However,
    the benefit is not the same for each, and some businesses find critical uses for
    the technology. In contrast, others use it for what could be described as “cosmetic
    functions”―the only practical application is not at the core of the business operations.
    For example, here is a case of applying the technology to change the core processes
    and systems of a business: a gold trading company creates a digital token on the
    blockchain to represent the actual gold held in their vaults and make it easy
    for it to be traded. However, a hotel chain brand choosing to host its website
    on top of a blockchain like Ethereum or NEO is not applying the technology at
    the core of its operations.


    Broadly speaking, the blockchain can help your business achieve at least one of
    three goals: fix a problem faced by your business, improve efficiency (such as
    cutting costs), and support innovation (such as creating new products and experience
    for your customers).


    #### **Fixing problems**


    Businesses face persistent problems all the time, some of which you are forced
    to accommodate as part and parcel of doing business. For example, as a small business,
    you might find it a little costly and demanding to set up a rewards points system.
    You would have to worry about protecting the user data you collect for the purpose,
    which distracts you from your core operations. The blockchain makes it possible
    for you to create and issue tokens easily to your customers without needing to
    collect their data, and more importantly, without having to use the services of
    a third party.


    #### **Improving efficiency**


    The technology achieves efficiency through cutting costs, hastening processes,
    and improving security for data and systems. For example, if it takes several
    days to move value from one corner of the globe to another, the technology has
    proven that it can significantly reduce that time to minutes and even seconds.
    Besides, it cuts the costs involved, in some cases (through particular protocols),
    to zero.


    #### **Supporting innovation**


    In regard to innovation, the technology offers you the opportunity and capacity
    to create new products and experiences for your customers in several ways. For
    example, using smart contracts and the micropayment capacity, you could automate
    certain transactions, opening up opportunities that did not exist before. For
    example, online magazines could use the technology to allow readers to pay to
    read per article. This would bring in more readers who have no need or desire
    for a monthly subscription when all they want is to read a single article.


    ### **Business blockchain readiness**


    This is the second step in the process of onboarding and making the blockchain
    technology part of your systems as a business or an institution. This stage analyses
    your business readiness or capacity to make the technology a part of your systems.


    In particular, you need to determine whether you have the necessary talent and
    skill in your team. Also determine how much it would cost you to put in place
    the blockchain system, and whether you have such funds. Most importantly, justify
    the financial cost and whether it can be recouped.'
  fmt: "\nIf you are an entrepreneur or planning to be one, you can now leverage blockchain\
    \ and pull ahead of your competition. If you are a developer or in another profession,\
    \ you can now pursue the path that will improve the quality of your talent stack.\
    \ And if you are a policymaker, you have a new perspective that will attune your\
    \ decisions towards future societies.\n\nHowever, you need to take further steps.\
    \ This book is supposed to serve as an essential backdrop. Put what you have learnt\
    \ to practice. Equally important is immersing yourself in the study of the technology\
    \ and keep close tabs on what is happening within the space. Perhaps I should\
    \ bring up at this point that this space is changing at an incredible speed. An\
    \ application that seems futuristic today can be overtaken by events the following\
    \ day, week, or month. Even the core architecture of blockchain itself is changing\
    \ fast.\n\nI do not need to repeat here how new consensus mechanisms are replacing\
    \ old ones, for example.\n\nBut how do you go about keeping your ears to the ground?\
    \ Join online blockchain forums such as the several blockchain-related subreddits\
    \ on Reddit. Make a habit of attending blockchain events near you, which range\
    \ from local town meetups to international blockchain summits. In such forums\
    \ and events, you stand to meet and interact with those who will expand your understanding\
    \ of the technology. And read more books similar to this one. After all, the list\
    \ of blockchain-related books is growing each month.\n\nWhile it is still early\
    \ days for blockchain (at the time of writing this book), many places exist both\
    \ online and offline, where you can do a course on particular aspects of blockchain.\
    \ These courses run the gamut from blockchain in law to heavy core software coding.\n\
    \nWhatever you choose, get out there and keep yourself involved with blockchain.\
    \ By putting yourself in an advantageous position, you would not be taken by surprise\
    \ by the changes ushered by the technology.\n\nFinally, if you find yourself with\
    \ a burning issue that you would like to share with me, feel free to email at\
    \ `hello@daryllim.me`. I look forward to hearing from you.\n\n| ![image](images/ch-19.jpg)\
    \ | | **The Blockchain Onboarding Workbook for Businesses** |\n| --- | --- | ---\
    \ |\n\nYou now have much of the foundational knowledge and information on the\
    \ blockchain. You know what it can do, and how it could change business and society\
    \ at large. Perhaps you want the blockchain technology to give your business some\
    \ value and maybe it is time to take the next step. It could be why you picked\
    \ up this book in the first place. I should point out, however, that this process\
    \ should be executed with some level of caution as well as skill. I wrote this\
    \ chapter precisely for this purpose and will guide you through this process.\n\
    \n### Three steps to applying blockchain in your business\n\nThe process of applying\
    \ the blockchain to your business should take three primary steps:\n\n1.  **The\
    \ blockchain suitability test**\n    Identifying exactly how your business could\
    \ make the blockchain technology part of its processes and systems.\n2.  **The\
    \ blockchain readiness test**\n    Finding out what your business already has\
    \ as well as what you would need to acquire to make the process easier. At this\
    \ stage, in other words, you take stock of your capacity and needs.\n3.  **The\
    \ blockchain level or type test**\n    Identifying the exact part of the blockchain\
    \ technology to use as every business has a particular element that is most appropriate\
    \ for it. At this stage, you want to be laser accurate on how you can acquire\
    \ what you need with the least cost and effort.\n\nThese three steps are in a\
    \ three-part workbook that I have created to help you figure out the answers in\
    \ each critical stage. By using the questionnaire to assess each stage, you will\
    \ understand how to handle each of these steps for your business in a customised\
    \ manner. Take a look through it before reading the rest of this chapter. After\
    \ going through each part in detail, go back to fill out the forms, which is downloadable\
    \ to your device. The Blockchain Onboarding Workbook for Businesses is available\
    \ online: `BlockchainUnlocked.co`.\n\n### Business blockchain suitability\n\n\
    The first part of the workbook is designed to help you figure out whether your\
    \ business is suitable to use the blockchain technology. Nearly every business\
    \ on the planet can, in one way or another, find some use for the technology.\
    \ However, the benefit is not the same for each, and some businesses find critical\
    \ uses for the technology. In contrast, others use it for what could be described\
    \ as \"cosmetic functions\"―the only practical application is not at the core\
    \ of the business operations. For example, here is a case of applying the technology\
    \ to change the core processes and systems of a business: a gold trading company\
    \ creates a digital token on the blockchain to represent the actual gold held\
    \ in their vaults and make it easy for it to be traded. However, a hotel chain\
    \ brand choosing to host its website on top of a blockchain like Ethereum or NEO\
    \ is not applying the technology at the core of its operations.\n\nBroadly speaking,\
    \ the blockchain can help your business achieve at least one of three goals: fix\
    \ a problem faced by your business, improve efficiency (such as cutting costs),\
    \ and support innovation (such as creating new products and experience for your\
    \ customers).\n\n#### Fixing problems\n\nBusinesses face persistent problems all\
    \ the time, some of which you are forced to accommodate as part and parcel of\
    \ doing business. For example, as a small business, you might find it a little\
    \ costly and demanding to set up a rewards points system. You would have to worry\
    \ about protecting the user data you collect for the purpose, which distracts\
    \ you from your core operations. The blockchain makes it possible for you to create\
    \ and issue tokens easily to your customers without needing to collect their data,\
    \ and more importantly, without having to use the services of a third party.\n\
    \n#### Improving efficiency\n\nThe technology achieves efficiency through cutting\
    \ costs, hastening processes, and improving security for data and systems. For\
    \ example, if it takes several days to move value from one corner of the globe\
    \ to another, the technology has proven that it can significantly reduce that\
    \ time to minutes and even seconds. Besides, it cuts the costs involved, in some\
    \ cases (through particular protocols), to zero.\n\n#### Supporting innovation\n\
    \nIn regard to innovation, the technology offers you the opportunity and capacity\
    \ to create new products and experiences for your customers in several ways. For\
    \ example, using smart contracts and the micropayment capacity, you could automate\
    \ certain transactions, opening up opportunities that did not exist before. For\
    \ example, online magazines could use the technology to allow readers to pay to\
    \ read per article. This would bring in more readers who have no need or desire\
    \ for a monthly subscription when all they want is to read a single article.\n\
    \n### Business blockchain readiness\n\nThis is the second step in the process\
    \ of onboarding and making the blockchain technology part of your systems as a\
    \ business or an institution. This stage analyses your business readiness or capacity\
    \ to make the technology a part of your systems.\n\nIn particular, you need to\
    \ determine whether you have the necessary talent and skill in your team. Also\
    \ determine how much it would cost you to put in place the blockchain system,\
    \ and whether you have such funds. Most importantly, justify the financial cost\
    \ and whether it can be recouped.\n"
  trans: "\n如果您是企业家或计划成为企业家，现在可以利用区块链技术超越竞争对手。如果您是开发者或从事其他职业，现在可以走上一条提升您人才组合质量的道路。而如果您是政策制定者，您将拥有一个新视角，使您的决策更贴合未来社会。\n\
    \n然而，您还需要迈出进一步的步骤。本书旨在作为必不可少的背景知识。将您所学付诸实践。同样重要的是让自己沉浸在技术研究中，并密切关注该领域内发生的一切。也许我应该在此指出，这个领域正以惊人的速度变化。今天看似未来感十足的应用，可能在第二天、下周或下个月就被新事件超越。甚至区块链的核心架构本身也在快速变化。\n\
    \n例如，我不需要在此重复新共识机制如何取代旧机制。\n\n但您该如何保持耳闻目睹？加入在线区块链论坛，例如 Reddit 上的几个区块链相关子版块。养成参加您附近区块链活动的习惯，这些活动范围从当地小镇聚会到国际区块链峰会。在这些论坛和活动中，您将有机会会见并与那些能拓展您对技术理解的人互动。并阅读更多类似本书的书籍。毕竟，区块链相关书籍的清单每月都在增长。\n\
    \n虽然区块链仍处于早期阶段（在撰写本书时），但网上和线下都有许多地方可以学习区块链特定方面的课程。这些课程涵盖面极广，从法律中的区块链到硬核核心软件编码。\n\
    \n无论您选择什么，都请走出去，让自己持续参与区块链领域。通过将自己置于有利位置，您不会因技术带来的变革而措手不及。\n\n最后，如果您有迫切想与我分享的问题，请随时发送邮件至\
    \ `hello@daryllim.me`。期待收到您的来信。\n\n| ![image](img/ch-19.jpg) | | **企业区块链上手工作手册**\
    \ |\n| --- | --- | --- |\n\n您现在已掌握大量关于区块链的基础知识和信息。您知道它能做什么，以及它如何大规模改变商业和社会。也许您希望区块链技术为您的业务创造价值，也许是时候迈出下一步了。这可能正是您最初拿起这本书的原因。但我必须指出，这一过程应在一定程度的谨慎和技巧下执行。我撰写本章正是为此目的，将指导您完成这一过程。\n\
    \n### 将区块链应用于业务的三个步骤\n\n将区块链应用于您的业务应包含三个主要步骤：\n\n1.  **区块链适用性测试**\n    明确您的业务如何将区块链技术融入其流程和系统。\n\
    2.  **区块链就绪度测试**\n    了解您的业务已具备什么，以及需要获取什么以使流程更顺畅。换句话说，在此阶段，您要评估自身的能力与需求。\n3.\
    \  **区块链层级或类型测试**\n    确定要使用区块链技术的确切部分，因为每个企业都有最适合其特定的要素。在此阶段，您希望精准地以最低成本和精力获取所需资源。\n\
    \n这三个步骤包含在一个由三部分组成的工作手册中，我创建它是为了帮助您在每个关键阶段找出答案。通过使用问卷评估每个阶段，您将了解如何以定制化方式为您的业务处理这些步骤。在阅读本章其余部分之前，请先浏览一遍。详细阅读每一部分后，返回填写表格，表格可下载至您的设备。《企业区块链上手工作手册》在线可用：`BlockchainUnlocked.co`。\n\
    \n### 业务区块链适用性\n\n工作手册的第一部分旨在帮助您弄清您的业务是否适合使用区块链技术。地球上几乎每个企业都能以某种方式找到该技术的用武之地。然而，收益因企业而异，有些企业发现该技术有关键用途。相比之下，其他企业将其用于可描述为“表面功能”的方面——唯一的实际应用并不在业务核心运营中。例如，将技术应用于改变业务核心流程和系统的案例：一家黄金贸易公司在区块链上创建数字代币代表其金库中持有的实物黄金，使其易于交易。然而，一家连锁酒店品牌选择将其网站托管在以太坊或\
    \ NEO 等区块链之上，并非在其核心运营中应用该技术。\n\n广义上讲，区块链可以帮助您的业务实现以下至少三个目标之一：解决业务面临的问题、提高效率（如削减成本）以及支持创新（如为客户创造新产品和体验）。\n\
    \n#### 解决问题\n\n企业始终面临持续的问题，其中一些您被迫将其作为经营一部分予以容忍。例如，作为一家小企业，您可能会发现建立积分奖励系统成本略高且要求苛刻。您不得不担心为该目的收集的用户数据保护问题，这会分散您对核心运营的精力。区块链使您能轻松创建和向客户发行代币，无需收集其数据，更重要的是，无需使用第三方服务。\n\
    \n#### 提高效率\n\n该技术通过削减成本、加速流程、提高数据和系统安全性来实现效率。例如，如果将价值从地球一角转移到另一角需要数天，该技术已证明可将时间大幅缩短至几分钟甚至几秒。此外，它还降低了成本，在某些情况下（通过特定协议）甚至降至零。\n\
    \n#### 支持创新\n\n关于创新，该技术为您提供机会和能力，以多种方式为客户创造新产品和体验。例如，利用智能合约和微支付能力，您可以自动化某些交易，开辟以前不存在的机会。例如，在线杂志可利用该技术允许读者按篇付费阅读。这将吸引更多读者，他们无需或无意购买月度订阅，只想阅读单篇文章。\n\
    \n### 业务区块链就绪度\n\n这是引入并使区块链技术成为企业或机构系统一部分过程中的第二步。此阶段分析您的业务就绪度或将技术纳入系统的能力。\n\n\
    特别是，您需要确定团队中是否具备必要的人才和技能。还要确定建立区块链系统需要多少成本，以及您是否有此类资金。最重要的是，论证财务成本并判断能否收回。\n"
