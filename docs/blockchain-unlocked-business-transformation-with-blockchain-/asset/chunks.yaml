- raw: 'The second phase came with the arrival of digital information technology.
    Hospitals, healthcare centres, and other players in the healthcare sector could
    digitise files. With the Internet, these files could be sent instantly from one
    corner of the globe to the other. However, while it improved interoperability
    significantly and cut the time it took for a file to move from one point to another,
    many gaps and need for improvement remained.


    ### **Why interoperability matters in the medical field**


    Before we look at those gaps and needs for improvement, and how blockchain helps
    with fixing them, let us first recap the importance of interoperability and data
    sharing in the medical field. The need to make medical records shareable among
    different healthcare providers has been established over the years. A patient’s
    genetic makeup and health history, including past tests, medications, and procedures,
    often play a critical role during care.


    How medical data is shared is a matter of life and death. According to research
    by scientists from the Johns Hopkins Hospital in Maryland, US, medical errors,
    including those occasioned by poor coordination among healthcare providers, form
    the third leading cause of death in the United States, after heart diseases and
    cancer. The situation is likely even more dire in countries with less developed
    medical systems.


    If a patient uses the same doctor or medical facility every time care is needed,
    his or her medical records, including longitudinal history, would always easily
    accessible to the physician, and that could afford them the most appropriate care.
    However, many times we are forced to seek health care from other doctors or health
    facilities. This is often occasioned by the need to receive more specialised attention,
    use better equipment, or simply get a different medical opinion. It is also often
    the case that a patient moves to a new home in a different part of the country
    and has to find new doctors or hospitals to take care of their health needs.


    It also often happens that emergencies happen while one is away from his or her
    regular medical service provider. For example, you may, unfortunately, have a
    heart attack while on a business trip, or become a victim of an accident while
    on vacation in a different country. In such situations, doctors or physicians,
    who have never had prior contact with you, step in and give you the care you need.
    In the least, they need to provide you with the necessary immediate attention
    before you can get to your regular healthcare provider.


    Whatever the reason, it makes a huge difference if doctors seeing you for the
    first time have a clear, detailed, and comprehensive understanding of not only
    your current state or condition but also your prior medical history. For example,
    they need to know whether you are allergic to certain drugs, have pre-existing
    conditions such as unstable blood pressure, or if you have had a similar health
    situation before.


    Through accessing and analysing these records, and knowing past records by previous
    health practitioners who attended to you, your new doctor can gain an understanding
    to give you the most appropriate care.


    Before the Internet, it was challenging to access such longitudinal medical records
    of a patient quickly. Often patients or their next of kin have to request the
    medical files from their primary healthcare providers, which would be delivered
    as hard copies to the patient’s new doctors or hospital. Alternatively, the doctor
    would make the request. Expectedly, the entire process of sharing medical files
    was slow, costly, and insecure. It could take days of back and forth communications
    before, finally, the file lands on the new doctor’s desk.


    The process would also cost money not least due to the search, preparation, and
    sending involved. While on transit, the file would be exposed to possible theft,
    damage, or loss. It goes without mentioning that in an emergency, the file may
    never arrive fast enough. The new doctors handling the situation would be wasting
    a lot of valuable time trying to gather a preliminary understanding of the patient.


    Another major challenge was getting a truly complete picture of the patient’s
    health history, because it was almost impossible to gather data from all the healthcare
    providers who has ever treated the patient. Often it may be possible to get data
    from the most immediate physician or hospital, but the further back on the chain
    one attempts to follow, the harder it becomes. In a nutshell, every doctor the
    patient sees gets only a snapshot of the medical history, and each does not have
    a way to verify what the others has gathered.


    ### **An efficient, interoperable medical information management system**


    Then digitisation and the Internet came along. With medical records stored in
    the digital form, it was easier to share them with others. However, the digitisation
    and availability of the Internet were not enough to allow patients to easily move
    with their health history to the different doctors and physicians whom they needed
    to see.


    First, there was a need for a platform through which healthcare practitioners
    could share the data securely and easily. Such a platform was necessary because
    the medical record management systems used by different healthcare providers could
    not communicate with one another. Patients and doctors still had to make a request
    before the file would be emailed. While it took less time than sending hardcopy
    files, it was still not efficient enough. The patient still had a difficult time
    having all the pieces of their medical history together in one file.


    Meanwhile, most medical facilities have remained hesitant to connect their internal
    systems to the outside world due to security fears. These fears are not unfounded.
    In the last few years, ransomware attacks on hospitals have become very common.
    In such attacks, anonymous hackers capture or encrypt data in hospital systems
    and demand money before decrypting the files. In late September 2019, for instance,
    several hospitals in the USA and other countries were hit by this form of attack,
    and many were forced to turn away patients, creating a situation that risked lives^([1](#ch13.xhtml#ch13fn1)).


    This is in addition to the fact that, for the longest time, there has not been
    an easy plug-in mechanism of sharing data. Hospitals and medical practitioners
    out there use very different medical information systems. Attempts have been made,
    however. As a way to make different medical record management systems to talk
    to one another, governments around the world have helped design and set up medical
    record exchanges (a form of a data clearinghouse) through which interoperability
    can be achieved. In 2004, the US federal government set up the Health Records
    and Health Information Exchange (HIE) to achieve the interoperability of electronic
    health records (EHR) across the nation.


    While this helps to make medical records accessible to wherever they are needed,
    there are still challenges in the way. According to a study published in 2017,
    about 82 percent of non-federal hospitals in the US exchange information. However,
    only 38 percent of physician practices and 17-23 percent of long-term care facilities
    are part of the network. Across the world, the outlook is not any better^([2](#ch13.xhtml#ch13fn2)).
    In developing countries, the adoption of technology for the management of medical
    records is almost non-existent, either due to political instability or the lack
    of the resources for setting up the necessary infrastructure, and that continues
    to hamper service delivery^([3](#ch13.xhtml#ch13fn3)).'
