    in the Republic of Georgia: Rebuilding Public Trust and Lessons for Future Pilot
    Projects.” Innovations, vol. 12, no. 3, ser. 4, 2018, pp. 72–78. 4, [www.mitpressjournals.org/doi/pdf/10.1162/inov\_a\_00276](http://www.mitpressjournals.org/doi/pdf/10.1162/inov_a_00276)’.


    ^(7) “About Us.” ChromaWay, 2014, [chromaway.com/aboutus/](http://chromaway.com/aboutus/)。


    ^(8) “Smart Dubai: Blockchain Case Study for Government in the UAE.” ConsenSys,
    [consensys.net/blockchain-use-cases/government-and-the-public-sector/smart-dubai/](http://consensys.net/blockchain-use-cases/government-and-the-public-sector/smart-dubai/)。


    ^(9) Siegel, David. “Understanding The DAO Attack.” CoinDesk, 2016 年 6 月 27 日,
    [www.coindesk.com/understanding-dao-hack-journalists](http://www.coindesk.com/understanding-dao-hack-journalists)。


    | ![image](img/ch-12.jpg) || **用例 4：支付** |


    | --- | --- |


    区块链在支付领域的应用非常广泛，可分为三大主要类型：(1) 客户对客户 (C2C) 支付解决方案，(2) 企业对企业 (B2B) 支付解决方案，(3) 两者的结合，可以是
    B2C 甚至 C2B。既然最后一种类型在了解前两种后很容易理解，我们将在本章重点讨论前两种。


    客户对客户 (C2C) 区块链支付解决方案可进一步细分为三种子类型：加密货币、代币和稳定币。然而，在关注它们之前，我们首先要了解是什么让区块链支付解决方案独具特色。


    ### 区块链为支付带来的优势


    在区块链出现之前，即使在互联网时代，除非发送方和接收方距离足够近、可以亲自交付现金，否则发送方想不通过中间人把钱交给接收方是不切实际的。中间人通常必须促成交易，并理所当然地收取一部分作为报酬（稍后详述成本问题）。在区块链上，即使发送方和接收方身处地球两端，也可以通过点对点路径或通道在技术上实现价值传输。此外，该技术还提供了多项优势。让我们讨论两个主要优势。


    #### 在线支付交易的安全性提升


    首先，区块链为发送方和接收方之间的支付交易提供了更高的安全性。它通过使用公私钥加密技术以及交易所在账本的不可篡改性来实现这一点。这并不是说区块链上的价值不会被盗窃。这种情况已经发生过多次。每年都有价值数千万美元的加密货币从交易所和个人手中被盗。然而，该技术为保障支付交易提供了更好的工具。


    #### 在线支付交易的隐私性增强


    其次，正如我们在前几章已经了解到的，该技术通过应用加密技术和伪匿名性，使在线支付交易更加私密。因此，虽然交易账本是公开的，但用户可以通过生成随机公共地址来代替真实姓名或身份证号码等个人身份信息，从而在区块链上隐藏身份。由于随机公共地址无需关联现实身份，任何人阅读共享公共账本都无法确切知晓每笔记录在案的支付交易参与方是谁。


    此外，与其他选项相比，在区块链上执行的支付交易相对更快，尤其是大额转账。银行电汇可能需要长达一周时间才能将资金从世界一端转移到另一端。而在区块链上，无论金额大小、距离远近，只需几秒到几分钟即可完成。


    尽管区块链上的支付交易安全、私密且快速，但与通过可信中心化第三方进行的支付相比，其成本相对较低。大多数区块链的商业模式不会给最终用户带来高额费用压力，尽管用户仍需为区块链支付支付费用。


    例如，在比特币区块链上，你通常需要附加一笔费用以加快交易确认过程。所有比特币挖完后，用户支付的费用将成为矿工继续运行机器、维护共享账本的主要激励。因此，随着时间的推移，费用将成为交易被验证并记录在共享账本上的强制性要求。


    然而，用户在比特币区块链上支付的任何费用均由协议决定，而非由以向股东创造更多利润为决策依据的私营企业决定。此外，正在开发不需要用户支付任何费用的新协议。例如，在
    IOTA 区块链上，用户必须完成一些工作——即确认两笔之前的交易——以使其自己的交易获得批准^(1)。

