- raw: 'Blockchain is going to make many business models and businesses themselves
    irrelevant. To survive, most businesses might have to rethink their models. Otherwise,
    they risk facing the same demise as Kodak or Blockbuster, which did not innovate
    or upgrade their businesses to keep up with world trends; Kodak, because of digital
    cameras, stuck to printing photos, while Blockbuster stuck to renting out DVDs
    in the era of YouTube and Netflix. We are already seeing banks, insurance companies,
    and other industries taking active steps to understand the technology and how
    it might affect their business models.


    Even disruptive businesses such as Uber and Airbnb can easily be disrupted themselves,
    because they are centralised entities that aggregate resources and sell them in
    the marketplace. Blockchain makes it possible that riders and drivers, for example,
    can meet and transact without having to go through a third party like Uber. With
    an open-source blockchain application that is not owned by any corporate entity,
    homeowners can access travellers and efficiently serve them aided with smart contracts
    like they would on Airbnb. And they won’t have to give a cut of their earnings
    to anyone.


    Even though a lot of hype surrounds what blockchain can do, it is reasonable to
    expect the technology to change how we do a lot of things significantly. And that
    means we need to be proactive in learning about it.


