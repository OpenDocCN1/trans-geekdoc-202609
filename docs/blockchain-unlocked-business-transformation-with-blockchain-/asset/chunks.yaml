- raw: 'The fifth reason is that it helps a business avoid unnecessary substantial
    initial costs. For example, building a blockchain from scratch means paying designers,
    developers, game theorists, and others. These skills do not come cheap. According
    to one report, a blockchain developer costs anywhere between US$80,000 to US$150,000,
    with an hourly rate of between US$70 and US$200. Besides, you need some hardware
    to get your peer-to-peer network started. Not to mention a marketing budget to
    convince others to join your network so that it is genuinely a blockchain. This
    huge initial cost can be difficult to recover, especially if the use of the blockchain
    or particular application required is not optimum or takes a long time to be so.
    Instead, a company can simply tap into a capacity it needs through BaaS, and then
    acquire more as it grows. This is much cheaper, a negligible cost compared to
    what is required to build, host, and maintain your own system^([2](#ch18.xhtml#ch18fn2)).


    The sixth reason is that BaaS will allow a business to focus on its core operations
    while at the same time benefiting from the technology to the maximum. For example,
    a company involved in real estate management would be distracted if it decides
    to assemble a developer team to build a blockchain or even an application from
    scratch. Such a business would have better use of its human resources, time as
    well as finances to do other things if they found an already existing blockchain
    or application platform that could give them much of what they need.


    Last but not least, it is almost impossible to have a blockchain with only one
    entity behind. Indeed, the idea of blockchain is that many independent entities
    collaborate through consensus to maintain a shared ledger. If a business sets
    up and controls the entire network of a blockchain, it does not qualify to be
    considered as a blockchain. It is just another database.


    ### **Blockchain models for services vs. SaaS**


    Now let’s look at how BaaS is delivered and how different it might turn out to
    be compared to other SaaS offerings. It is crucial to start by explaining that
    the initial BaaS offerings are not much different from the SaaS products we are
    familiar with. The question is rather whether it is the most inappropriate model
    for this technology. We will see how in a moment.


    At the time of writing, several major technology companies are giving BaaS to
    businesses and government institutions around the world, including Microsoft (through
    its Azure blockchain platform), IBM, Amazon (through the blockchain on the Amazon
    Web Services project), Oracle, and Deloitte. Some companies have been set up expressly
    to offer BaaS and other related solutions, including the likes of Hyperledger,
    R3, and Factom. Over time, the launch of even more BaaS is likely.


    #### **Private vs public blockchains as a service**


    The most recognisable BaaS solutions have been enterprise or private blockchains,
    which are built by major financial and technology companies or consortiums. Access
    to join their networks as well as the permission to write and read the shared
    ledger are limited to known and approved members.


    Centralised entities undertake private blockchains and quickly become the host
    of the software (and protocol), that also maintain and provide support to users.
    For example, Hyperledger hosts the Hyperledger Fabric blockchain, maintaining
    and offering support to any company or business that uses it as a service.


    Private blockchains have marketed themselves as best suited for businesses, including
    co-opting the word “enterprise” to describe themselves. Many learning about blockchain
    for the first time are easily convinced that it is an option for those needing
    to leverage the technology for business. This is a mischaracterisation. But the
    argument can be made that so-called enterprise (private) blockchains are not the
    best option, especially for small businesses. Firstly, because small businesses
    cannot get a place at the table where critical decisions are made, for example,
    to join the Hyperledger network as an equal peer can cost as much as US$250,000
    in registration fees. Secondly, the private blockchain is designed to primarily
    focus on the needs of the major financial institutions and technology companies
    behind them.


    In the other hand, public blockchains such Ethereum, EOS, and even Bitcoin have
    a lot to offer businesses. In fact, it can be argued that especially small businesses
    could benefit better by using public blockchains. They are easily accessible as
    anyone can join the network without making any application nor paying any fees.
    Also, the small businesses can make proposals on the improvements of the core
    software (and protocol). Indeed, public blockchains are perfect for small businesses,
    which cannot build their own blockchain nor join existing consortiums as equal
    peers^([3](#ch18.xhtml#ch18fn3)).


    #### **Hosting, maintenance, and support for a private blockchain**


    Now, let’s see how a private BaaS works in regard to the three critical components
    of a SaaS: hosting, maintenance, and support. In private blockchains, the underlying
    software is hosted on a peer-to-peer network made up of nodes of known peers.
    Anyone joining the network has to make an application and be approved by the administrator
    or pre-existing peers. A business can then use this platform to run any app they
    want. This application could be a creation of the business, an application as
    a service by a third party on the blockchain, or part of the product offered by
    the company behind the blockchain.


    As for support, the consortium or company that manages the private blockchain
    provides the necessary help to the users, who are mostly businesses and companies.
    The support team hired by the company would help businesses, for example, on-board
    and also respond to queries, and fix problems that users may face. The support
    also includes providing the necessary tools for those who need or want to design
    and build their own applications. The Corda blockchain, for example, has a support
    team hired by the R3 company.


    Maintaining the core software, and even some specific applications, also falls
    in the hands of the developer team in charge, who also releases updates and also
    patches bugs that might come up. It is important to point out that specific applications
    on a private blockchain could be the product of an independent company. Thus,
    for the most part, a private BaaS is similar in many ways with software and application
    as a service by centralised providers or vendors.


    ### **Public BaaS**


    When it comes to public BaaS, the traditional model of a company with staff does
    not work. And that is in all the three critical components: (1) hosting, (2) support,
    and (3) maintenance, because all public blockchains are truly decentralised, including
    their governance structures.


    Public blockchains can thus be a service as well as have the potential to change
    private enterprise. Businesses neither need to build public blockchains from scratch
    nor build applications on top of blockchain. They can use what is already available
    to them. Unlike the private blockchain, a lot of capacity on a public blockchain
    can be free or only have fees per transaction.


    Let’s go through each of the three components of a SaaS regarding a public blockchain.


    #### **Hosting and maintenance by open-source community-supported projects**'
  fmt: '

    # 第五个原因：避免不必要的巨额初始成本


    例如，从头构建区块链意味着要支付设计师、开发人员、博弈论专家等人员的费用。这些技能并不便宜。根据一份报告，区块链开发人员的成本在 80,000 美元到 150,000
    美元之间，时薪在 70 美元到 200 美元之间。此外，你还需要一些硬件来启动点对点网络。更别提市场营销预算，用于说服他人加入你的网络，使其真正成为一个区块链。如果区块链的使用或特定应用需求不是最优的，或者需要很长时间才能达到最优，那么这笔巨大的初始成本很难收回。相反，公司可以简单地通过
    BaaS 利用所需的容量，然后随着业务增长获取更多容量。这要便宜得多，与构建、托管和维护自己的系统所需的成本相比，这微不足道^([2](#ch18.xhtml#ch18fn2))。


    # 第六个原因：专注于核心业务


    BaaS 将允许企业专注于其核心业务，同时最大程度地从技术中受益。例如，一家从事房地产管理的公司，如果决定组建开发团队从头构建区块链甚至应用程序，就会分心。如果他们找到一个现有的区块链或应用程序平台，能提供他们所需的大部分功能，那么这家企业将更好地利用其人力资源、时间和财务去做其他事情。


    # 最后但同样重要：单一实体无法构成区块链


    几乎不可能只有单一实体在背后支持却拥有一个区块链。事实上，区块链的理念是许多独立实体通过共识协作维护共享账本。如果一家企业建立并控制区块链的整个网络，它不符合被视为区块链的资格。它只是另一个数据库。


    # 区块链服务模型与 SaaS 的对比


    现在让我们看看 BaaS 是如何交付的，以及它与其他 SaaS 产品相比可能有何不同。关键的第一步是解释：最初的 BaaS 产品与我们熟悉的 SaaS 产品并没有太大区别。问题在于这是否是该技术最不合适的模式。我们稍后将看到原因。


    在撰写本文时，几家主要科技公司正在向全球企业和政府机构提供 BaaS，包括 Microsoft（通过其 Azure 区块链平台）、IBM、Amazon（通过
    Amazon Web Services 区块链项目）、Oracle 和 Deloitte。一些公司专门成立以提供 BaaS 和其他相关解决方案，包括 Hyperledger、R3
    和 Factom。随着时间的推移，可能会推出更多的 BaaS。


    ## 私有链与公有链即服务


    最知名的 BaaS 解决方案是企业级或私有区块链，由主要金融和科技公司或联盟构建。加入其网络的权限以及读写共享账本的权限仅限于已知且经过批准的成员。


    中心化实体承担私有区块链，并迅速成为软件（和协议）的主机，同时也负责维护并为用户提供支持。例如，Hyperledger 托管 Hyperledger Fabric
    区块链，为使用它作为服务的任何公司或企业提供维护和支持。


    私有区块链将自己推销为最适合企业，甚至借用“企业级”一词来描述自己。许多初次了解区块链的人很容易被说服，认为这是利用技术进行业务的一种选择。这是一种误述。但可以论证，所谓的企业级（私有）区块链并非最佳选择，尤其是对小企业而言。首先，小企业无法在做出关键决策的桌面上占有一席之地，例如，作为平等节点加入
    Hyperledger 网络的注册费高达 250,000 美元。其次，私有区块链的设计主要侧重于其背后的主要金融机构和科技公司的需求。


    另一方面，以太坊、EOS 甚至比特币等公有区块链为企业提供了很多价值。事实上，可以论证小企业通过使用公有区块链能获得更好的收益。它们易于访问，任何人都可以加入网络，无需申请也无需支付任何费用。此外，小企业可以就核心软件（和协议）的改进提出建议。确实，公有区块链非常适合无法构建自己的区块链，也无法作为平等节点加入现有联盟的小企业^([3](#ch18.xhtml#ch18fn3))。


    ## 私有区块链的托管、维护和支持


    现在，让我们看看私有 BaaS 在 SaaS 三个关键组件（托管、维护和支持）方面是如何工作的。在私有区块链中，底层软件托管在由已知节点组成的点对点网络上。任何加入网络的人都必须申请并获得管理员或预先存在的节点的批准。然后企业可以使用此平台运行他们想要的任何应用程序。该应用程序可以是企业自己的创作、区块链上第三方的应用即服务，或区块链背后公司提供的产品的一部分。


    至于支持，管理私有区块链的联盟或公司为用户（主要是企业和公司）提供必要的帮助。公司雇佣的支持团队将帮助企业，例如入职指导、响应查询并修复用户可能面临的问题。支持还包括为那些需要或想要设计和构建自己应用程序的人提供必要的工具。例如，Corda
    区块链拥有由 R3 公司雇佣的支持团队。


    维护核心软件甚至某些特定应用程序也掌握在负责的开发团队手中，他们还会发布更新并修补可能出现的错误。重要的是要指出，私有区块链上的特定应用程序可能是独立公司的产品。因此，在很大程度上，私有
    BaaS 在许多方面与中心化提供商或供应商的软件即服务和应用即服务相似。


    # 公有 BaaS


    当涉及公有 BaaS 时，拥有员工的传统公司模式行不通。这适用于所有三个关键组件：（1）托管、（2）支持和（3）维护，因为所有公有区块链都是真正去中心化的，包括其治理结构。


    因此，公有区块链可以作为一种服务，并有潜力改变私有企业。企业既不需要从头构建公有区块链，也不需要在区块链之上构建应用程序。他们可以使用已经可用的资源。与私有区块链不同，公有区块链上的大量容量可以是免费的，或者仅按交易收费。


    让我们逐一了解公有区块链中 SaaS 的这三个组件。


    ## 由开源社区支持的项目进行托管和维护

    '
