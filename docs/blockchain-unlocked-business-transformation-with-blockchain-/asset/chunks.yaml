- raw: 'The public blockchain is already hosted on a peer-to-peer network of computers.
    If we take the case of the Bitcoin blockchain for example, the nodes on the network
    are incentivised through a reward mechanism to host and update transactions on
    the shared ledger through mining. The reward is the newly created native coins
    as well as the transaction fees that the users of the blockchain pay. In the early
    days, one had to download the entire ledger onto their local device before they
    could read or write on the blockchain. This is no longer the case; through lightweight
    nodes, one can do pretty much everything a full node is capable of.


    Maintaining the core software can be achieved in several ways. Volunteers are
    the most basic. Using Bitcoin as an example again, anyone with software development
    skills can make proposals for and effect changes to upgrade the protocol or fix
    weaknesses identified, which, in Bitcoin, is done through the Bitcoin Improvement
    Proposal (BIP). A core software developer would write a proposal on the upgrade
    they seek to do on the core software, published on a forum member of the community
    can read it (the Bitcoin Mailing List). They could then go ahead and write the
    code for the core software, including the changes they want to see. With the new
    version ready, they could go ahead to persuade the community to download and install
    it. Indeed, by downloading and running it, users are voting to approve its adoption.
    If the change is a soft fork (compatible with the previous version), then part
    of the network embracing it and another ignoring it does not hamper the operations
    of the network. However, if the change is a hard fork (those running the new version
    fail to coordinate with those running the older version), there is a need for
    all to embrace it. Otherwise, in the absence of consensus, the network could split
    into two independent blockchains, which was the case for Bitcoin Cash when the
    Bitcoin network failed to form a broad consensus on the best scaling solution
    (in particular in regard to increasing the block size or the batch of transactions
    approved every ten minutes).


    #### **Other models for maintaining public blockchains**


    In addition to volunteers, public blockchains are maintained by developers who
    are paid by companies that use them. For example, wallet providers, exchanges
    (like Coinbase), and payment processors (like BitPay) have been known to hire
    developers to work on the Bitcoin core software. Core developers are also hired
    by non-profit organisations such as the MIT Digital Currency Initiative.


    Other public blockchains have engaged other models for maintaining their core
    software and protocol. For example, DASH has a treasury that pays those who work
    on the project^([4](#ch18.xhtml#ch18fn4)). The treasury is in the control of the
    DASH Trust, a body whose members are elected by those who have nodes on the network.
    The Trust Protectors, as they are called, in turn, hire, manage, and pay a team
    of developers that maintain the core software and even provide support for the
    users of the blockchain.


    #### **Support for public blockchains**


    So, as far as the hosting and the maintenance of the public blockchain are concerned,
    the end-user businesses need not worry much. The support element instead is a
    bit complicated for some of the projects. There is no one really to call in the
    event you need technical help. Thus, if you are using a public blockchain for
    your business’s processes, you may have to hire your own technical staff to fix
    issues when they arise.


    With that stated, very few businesses need such support. Help is more critical
    for using specific applications on the blockchain, which is such a low-level technology
    that they do not even need to know how it works. It is similar to centralised
    backend servers, which most businesses have little interest to understand as the
    front applications are often all that matter to them.


    Now, most businesses using a public BaaS will interact with it through a specific
    application that does a particular function. This can be decentralised (not owned
    or controlled by a single entity) or centralised (owned by an entity that leases
    it out as a service). In both, the hosting and maintenance are already taken care
    of as they exist on top of a blockchain. For a dApp, several options exist as
    to how it can be maintained and how those who use it can get support. The maintenance
    can happen through volunteers just as it is the case with the core blockchain
    software. It is also possible for a centralised company to offer support as well
    as maintenance and get remunerated through the issuance of the native coin or
    through payments that users make. Indeed, utility tokens open up many opportunities
    in regard to how users of blockchain applications can receive support.


    Ethereum blockchain is a public blockchain that has several private companies
    offering support. One such company is ConsenSys, which builds and maintains different
    kinds of applications on the Ethereum blockchain.


    As for a centralised application, a company is most likely behind it, maintaining
    the application and also providing support to users. In this case, the public
    blockchain is more or less a server backend, and everything else is offered just
    like a conventional SaaS. Factom is an example of an application on the blockchain
    that provided as service by a centralised company. It facilitates businesses and
    other entities to put their record-keeping systems on the Bitcoin blockchain.


    Importantly, applications on a public blockchain could use a DAO-like arrangement
    to provide maintenance and support. An excellent example is DASH, which I have
    mentioned before, where individual developers and experts offer services to businesses
    that use the blockchain. In return, the community pays them from the developer
    kitty.


    ### **Paying for blockchain as a service**


    Let’s look at one common feature of SaaS and how it is actualised in the case
    of BaaS: how businesses pay for it. This is one area that BaaS differs significantly
    with the prior SaaS model. In the traditional SaaS model, users pay for the service
    mostly through monthly or annual subscriptions. In contrast, blockchains come
    with native payment methods in the form of cryptocurrencies and tokens, which
    are used to pay for access to an application or a service.


    Instead of basing payments on expiry of time (such as a month or a year), blockchain
    makes it easy for payments to be done per transaction, especially given that micropayments
    are not only possible on blockchain but also come at negligible costs. Moreover,
    smart contracts can easily be deployed to guide the execution and payment for
    the transactions.


    With the growing understanding of the benefits that the blockchain offers, more
    and more businesses are going to want to adopt the technology. Finding BaaS is
    going to make it easier for them. In particular, it removes the obstacle of first
    having to understand how everything works. All a business needs to know is how
    the blockchain or an application on top of it can fix the problems that it faces.


    ### **Challenges in using BaaS**


    What are the challenges that stand in the way of adopting and using BaaS? The
    challenges are many, especially to enterprise users. Most are similar to other
    use cases of the technology: a lack of technical capacity, regulatory constraints,
    and users not understanding the full potential of this technology.


    A unique challenge, however, is the lack of proper packaging of BaaS in particular
    with public blockchains. This makes it hard for users who have little technical
    know-how to leverage the technology even when they do not need to host and maintain
    it.'
  fmt: '

    公共区块链已经托管在计算机的点对点网络上。以比特币区块链为例，网络上的节点通过奖励机制获得激励，通过挖矿在共享账本上托管和更新交易。奖励是新创建的原生代币以及区块链用户支付的交易费。在早期，人们必须将整个账本下载到本地设备上，才能在区块链上进行读写。现在情况不同了；通过轻量级节点，人们几乎可以做全节点能做的所有事情。


    维护核心软件可以通过多种方式实现。志愿者是最基础的方式。再以比特币为例，任何具备软件开发技能的人都可以提出建议并实施更改，以升级协议或修复已识别的弱点，这在比特币中是通过比特币改进提案（BIP）完成的。核心软件开发者会撰写一份关于其寻求对核心软件进行升级的提案，发布在社区论坛成员可阅读的地方（比特币邮件列表）。然后他们可以继续为核心软件编写代码，包括他们想要看到的更改。新版本准备就绪后，他们可以继续说服社区下载并安装它。确实，通过下载并运行它，用户就是在投票批准其采用。如果更改是软分叉（与旧版本兼容），那么部分网络接受它而另一部分忽略它不会妨碍网络的运行。但是，如果更改是硬分叉（运行新版本的人无法与运行旧版本的人协调），则需要所有人都接受它。否则，在缺乏共识的情况下，网络可能会分裂成两条独立的区块链，这正是比特币现金的情况，当时比特币网络未能就最佳扩容方案形成广泛共识（特别是关于增加区块大小或每十分钟批准的交易批次）。


    #### 公共区块链维护的其他模式


    除了志愿者，公共区块链还由使用它们的公司支付薪水的开发者维护。例如，钱包提供商、交易所（如 Coinbase）和支付处理商（如 BitPay）都曾雇佣开发者从事比特币核心软件的工作。核心开发者也受雇于非营利组织，如
    MIT 数字货币倡议。


    其他公共区块链采用了其他模式来维护其核心软件和协议。例如，DASH 拥有一个为项目工作者支付报酬的金库。该金库由 DASH 信托控制，该机构的成员由网络上的节点持有者选举产生。受托人反过来雇佣、管理并支付一组开发者的薪水，他们维护核心软件，甚至为区块链用户提供支持。


    #### 公共区块链的支持


    因此，就公共区块链的托管和维护而言，最终用户企业无需过多担心。支持环节对于某些项目来说则有点复杂。当你需要技术帮助时，实际上没有人可以求助。因此，如果你将公共区块链用于企业的业务流程，可能不得不雇佣自己的技术人员来解决出现的问题。


    话虽如此，很少有企业需要这种支持。帮助对于在区块链上使用特定应用程序更为关键，区块链是一种如此低层级的技术，以至于他们甚至不需要知道它是如何工作的。这类似于中心化的后端服务器，大多数企业对理解它们兴趣不大，因为前端应用程序通常是他们唯一关心的。


    现在，大多数使用公共 BaaS 的企业将通过执行特定功能的特定应用程序与其交互。这可以是去中心化的（不归单一实体所有或控制），也可以是中心化的（归拥有它并将其作为服务租赁出去的实体所有）。在这两种情况下，托管和维护都已得到解决，因为它们存在于区块链之上。对于
    dApp，关于如何维护以及使用者如何获得支持，存在多种选择。维护可以通过志愿者进行，就像核心区块链软件的情况一样。中心化公司也可以提供支持和维护，并通过发行原生代币或用户付款获得报酬。确实，实用代币为区块链应用用户如何获得支持开辟了许多机会。


    以太坊区块链是一个公共区块链，有几家私营公司提供支持。其中一家公司是 ConsenSys，它在以太坊区块链上构建和维护不同种类的应用程序。


    至于中心化应用程序，背后最有可能有一家公司，负责维护应用程序并为用户提供支持。在这种情况下，公共区块链或多或少就是一个服务器后端，其他一切就像传统 SaaS
    一样提供。Factom 是一个由中心化公司作为服务提供的区块链应用程序示例。它促进企业和其他实体将其记录保存系统放在比特币区块链上。


    重要的是，公共区块链上的应用程序可以使用类 DAO 的安排来提供维护和支持。一个极好的例子是我之前提到的 DASH，其中个人开发者和专家为使用该区块链的企业提供服务。作为回报，社区从开发者基金中支付给他们报酬。


    ### 为区块链即服务付费


    让我们看看 SaaS 的一个共同特征，以及它在 BaaS 中是如何实现的：企业如何为其付费。这是 BaaS 与先前 SaaS 模式存在显著差异的一个领域。在传统的
    SaaS 模式中，用户主要通过月度或年度订阅来支付服务费用。相比之下，区块链自带以加密货币和代币形式存在的原生支付方式，用于支付访问应用程序或服务的费用。


    区块链使得按交易付费变得容易，而不是基于时间到期（如一个月或一年）来支付，特别是考虑到微支付在区块链上不仅可行，而且成本可忽略不计。此外，智能合约可以轻松部署以指导交易的执行和支付。


    随着对区块链优势理解的加深，越来越多的企业将希望采用这项技术。寻找 BaaS 将使它们更容易做到这一点。特别是，它消除了首先必须了解一切如何运作的障碍。企业只需要知道区块链或其上的应用程序如何解决其面临的问题。


    ### 使用 BaaS 的挑战


    采用和使用 BaaS 的挑战是什么？挑战很多，尤其是对企业用户而言。大多数与该技术的其他用例相似：缺乏技术能力、监管限制，以及用户不了解这项技术的全部潜力。


    然而，一个独特的挑战是 BaaS 缺乏适当的包装，特别是公共区块链方面。这使得技术知识很少的用户难以利用这项技术，即使他们不需要托管和维护它。

    '
