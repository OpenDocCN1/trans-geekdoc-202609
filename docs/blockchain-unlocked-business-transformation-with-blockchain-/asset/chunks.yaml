- raw: 'To achieve the Smart Dubai dream, blockchain, though a later addition to the
    project, is intended to serve as the backend for other emerging technologies used
    in the project, such as AI, Big Data, and IoT.


    #### **Transparency and trust**


    How can blockchain help governments become transparent?


    Transparency in governments all over the world is very much lacking. While it
    is the public that elects the government, the processes and systems in public
    institutions are never accessible to the majority of the citizenry. The broader
    public often does not know what goes on within government; only those high up
    in the hierarchy of government have access to the most critical systems and processes.
    Often, they are the only ones who understand how they work. Everyone else has
    to trust—that the policy and decision-makers as well as the implementers are doing
    what is expected of them. This opaqueness creates the right environment for corruption,
    unethical practices, and, consequently, poor service delivery.


    In most countries around the world, rigged elections, theft of public funds, and
    cronyism are the order of the day. Speaking of elections, there is no better place
    to begin creating transparency than with the process through which governments
    are put in place. Indeed, elections are the bedrock of modern societies. However,
    in most countries, it is often questionable whether the will of the people is
    accurately captured through elections, or if it is respected. With closed voting
    systems, it is always possible for those in power or influence to tamper with
    results and therefore impose the executive, the legislature, and by extension,
    the judiciary on the people.


    The public needs to witness what goes in the voting systems as well as other systems
    in government. The blockchain makes it possible for the entire voting system to
    be open to every voter, who would be able to verify and audit the process in real
    time. With the blockchain technology, voters can know that their votes have been
    counted and added to the final tally of the chosen candidate. At the same time,
    the system would not be exposed to security threats.


    In 2014, the Danish libertarian party Liberal Alliance began using blockchain
    for its internal elections, becoming the first political outfit to use the technology
    for this specific purpose^([2](#ch11.xhtml#ch11fn2)). In late 2018, the Democratic
    Party of India built a blockchain voting system through which over three million
    members could vote on particular policy questions. It was made possible with the
    help of the Australian blockchain startup Horizon State^([3](#ch11.xhtml#ch11fn3)).


    However, the most established example is in Estonia. The Northern European country
    is best known for adopting technology in its public institutions, with 99 percent
    of public services accessible online. The country first used an e-voting system
    in 2007, when much of the rest of the world did not even have plans for such kind
    of system. The Estonian government has embraced blockchain as a technology that
    could help make their e-voting system even more secure and robust^([4](#ch11.xhtml#ch11fn4)).
    It is important to point out other public projects around the world, besides electoral
    systems, are using blockchain to enhance transparency.


    #### **Automation**


    Governments around the world are on the move to increase how fast citizens can
    access services. That calls for automating most of the processes involved in service
    delivery. By looking at what is to be replaced, one can appreciate the difference
    a system upgrade can do to the lives of the citizens. We have used the example
    of land titles back in [Chapter 1](#ch01.xhtml), which drives the point home here
    too. In most third and even first world countries, the process of buying and selling
    real estate takes not only a lot of effort but also time and money.


    Usually, the first step is searching for the title in the land registry, which
    may involve making a formal application to the registry by filling out a form
    and handing it in or sending it through the postal address. This is critical to
    make sure that the seller owns the land according to the official records. One
    may need to pay a fee for this service. In many cases, if you need to cut the
    waiting time, you may have to pay a bribe to someone. Otherwise, you have to wait
    for a few days or even weeks for the feedback, because a clerk at the registry
    has to go through the database, often manually, or through a stack of files in
    cabinets to locate one with the information you need.


    With an automated system, the process takes not more than a few minutes, which
    you can do from anywhere. You do not need to travel to the land registry office
    to perform your search. What’s more, it costs you nothing. Many governments around
    the world are in the process of automating land transaction processes so that
    anyone can go through the process from the comfort of home or the office. More
    importantly, it will take mere minutes to get proof of title ownership. In addition
    to this, the blockchain offers the mechanism for transacting real estate without
    having to visit any office. Through a private key, a seller can not only prove
    that they own the piece of property but also transfer it to the buyer easily and
    quickly, but securely. The smart contract applications on the blockchain make
    it possible to complete the transaction without involving third parties.


    In 2016, the Republic of Georgia, through its National Agency of the Public Registry
    (NAPR), launched a pilot project to move the country’s land registry system onto
    the blockchain^([5](#ch11.xhtml#ch11fn5)). The project was made possible with
    the help of the Bitfury Group, one of the major and earliest Bitcoin mining companies.
    Within two years of the project, close to two million titles were backed up and
    time-stamped on the Bitcoin blockchain. The goal of the project is to restore
    public trust in an institution that has been riddled by corruption over many years^([6](#ch11.xhtml#ch11fn6)).
    Another country that is attempting to build a land registry system on top of the
    Blockchain is Sweden. The *Swedish Lantmäteriet*, the country’s land registration
    authority, has been working with Chromaway, a blockchain startup, to implement
    the project^([7](#ch11.xhtml#ch11fn7)). Besides land and property management,
    the blockchain is being applied in many other areas for the primary purpose of
    automating processes securely and reliably.


    #### **Cutting costs**


    Governments are basically like business organisations when it comes to managing
    costs, even though many of us do not usually think of them that way. Like with
    any prudent business, the expenditures need to be within the revenue limits. What’s
    more, citizens appreciate that they receive quality services without having to
    pay high taxes for it. In this regard, blockchain can be beneficial. The technology
    can help governments not only cut costs but also eliminate some items in the annual
    budget. In particular, the technology offers a cheaper but also better way to
    keep and maintain records. It is very expensive to maintain centralised server
    databases in terms of leasing or acquiring the necessary hardware and software.
    It also costs a lot more to obtain the right security solutions to ensure that
    only the right people have access. With blockchain, governments can use open-source
    protocols and systems for which they do not have to pay. In most instances, the
    highest cost of using blockchain is the initial cost of setting up the systems,
    which is primarily labor or skill related.


    According to the team behind Smart Dubai, a project we looked at earlier, when
    it is complete, it will save the city of Dubai close to US$1.5 billion every year
    in document processing alone^([8](#ch11.xhtml#ch11fn8)). That is vast savings
    however one looks at it.


    ### **Blockchain for a new way of government**'
