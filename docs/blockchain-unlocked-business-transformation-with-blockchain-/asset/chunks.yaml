  trans: '

    The biggest challenge small businesses face in using blockchain is a shortage
    of employable talent. Experienced blockchain developers are few and far between,
    and those who are experienced are expensive, often beyond the means of small businesses.
    However, hiring is not the only way to give your business the capabilities it
    needs to embrace blockchain. Team members can be trained to acquire the skill,
    as finding relevant courses, especially online, is becoming easier. Learning platforms
    like [Coursera.org](http://Coursera.org), Udemy, and Skillshare offer a growing
    selection of courses for you to choose from based on your specific needs.


    The skill set required to build a blockchain system comes from designers, developers,
    game theorists, and token economists. Designers help you structure what you have
    in mind. Game theorists help designers determine what relationships should exist
    between different participants and, more importantly, how to use their interactions
    to benefit the system as a whole. Finally, developers bring the entire vision
    to life. However, for less complex blockchain projects, you may only need a developer
    with some design and game theory knowledge.


    ### The Blockchain Level or Type Your Business Needs


    The third question is the extent to which you need to adopt the technology and
    what type of blockchain best suits your business. As a business, you must decide
    whether you need a public or private blockchain. Do you need to use an existing
    Blockchain-as-a-Service, or do you need to build a new application on an existing
    blockchain? Indeed, you must determine if you need a brand-new blockchain and
    build it from scratch.


    In other words, blockchain technology has several levels, primarily including
    as-a-service, applications built on top of a blockchain, and the core protocol
    itself. The level at which you adopt the technology depends on your specific needs.
    If your needs are unique and there are no available as-a-service applications,
    you may need to build your application on an existing blockchain. If you realize
    that no existing blockchain can serve as a suitable backend for your application,
    you may need to build the blockchain first and then develop the application.


    Upon completing this workbook, you should be ready to make key decisions on how
    to proceed with technology adoption. As technology changes, I will update this
    workbook over time, so it will continue to evolve. This means that in the long
    run, the workbook can be used by others at any time. You are welcome to use this
    workbook as a starting point to begin your company''s blockchain journey, analyzing
    the relevance of your business to blockchain technology.


    ## Glossary


    • **51% Attack**: A situation where a malicious actor attacks and gains more than
    51% of the entire network''s computing power (hash rate)

    • **Artificial Intelligence (AI)**: Creating computer applications that behave
    with human-like intelligence

    • **Bitcoin**: The first cryptocurrency and store of value launched on a blockchain,
    launched in 2009

    • **Blockchain**: A shared digital ledger of information distributed across different
    computers, recording transactions in chronological order, making transactions
    expensive and difficult to tamper with, allowing potentially opposing parties
    to cooperate

    • **Blockchain-as-a-Service (BaaS)**: A blockchain service offering that allows
    customers to use cloud-based services to develop and host their blockchain applications,
    functions, and smart contracts

    • **Cryptocurrency**: A digital currency that uses encryption techniques to regulate
    the generation of currency units and verify the transfer of funds, operating independently
    of a central authority

    • **Decentralized Autonomous Organization (DAO)**: An organizational system controlled
    by smart contracts

    • **Decentralized Applications (dApps)**: Open-source software that leverages
    blockchain technology

    • **Distributed Ledger Technology (DLT)**: A database that exists across multiple
    locations or among multiple participants; it is decentralized, eliminating the
    need for a central authority or intermediary to process, validate, or authenticate
    transactions

    • **Hard Fork**: A split of a blockchain network into two separate networks

    • **Hash Rate**: Computing power

    • **Initial Coin Offering (ICO)**: A fundraising mechanism in which new projects
    sell their crypto tokens to raise capital for new crypto assets, companies, or
    venture capital. Similar to an Initial Public Offering (IPO), where investors
    purchase shares in a company

    • **Internet of Things (IoT)**: Adding smart devices to a system to assist with
    data collection and analysis, as well as process automation

    • **InterPlanetary File System**: An open-source peer-to-peer hypermedia protocol
    designed to make the web faster, safer, and more open

    • **Miner**: A type of node that secures the blockchain by computing transactions

    • **Node**: Any electronic device capable of connecting to the network, including
    phones, printers, and computers

    • **Proof of Stake (PoS)**: An algorithm designed to achieve distributed consensus
    on a blockchain

    • **Proof of Work (PoW)**: A model for blockchain to achieve consensus

    • **Smart Contract**: A computer protocol that facilitates, verifies, or enforces
    a contract, making contractual clauses unnecessary

    • **Token**: A unit issued on a blockchain for a limited or specific function
    or purpose, such as Ethereum Gas and Storj tokens

    • **Tor**: An anonymous communication protocol released in 2002

    • **Turing-Complete Virtual Machine**: A computer capable of writing programs
    or contracts to solve any reasonable computational problem


    ## About the Author


    ![image](img/img_001.jpg)


    My life path is similar to many who have come before me. I graduated from the
    National University of Singapore with a degree in Mechanical Engineering and have
    always been fascinated by the latest innovations and inventions in the tech space.
    Venturing into engineering was no surprise to those who knew me, as my university
    days solidified my pursuit.


    Soon after graduating, I started my first company with funds accumulated from
    multiple part-time jobs during my university days. I invested in technological
    solutions that were merely concepts, developing them into products to sell to
    enterprises. I would invest in intellectual property globally, then innovate and
    design products. Solutions spanned water treatment, alternative energy, and nanotechnology.


    After successfully commercializing technologies, I started another company aimed
    at expanding my passion for matching innovative products and technologies with
    industry adoption, while creating investment opportunities for clients.


    As an entrepreneur, I have had the privilege of a "front-row seat" to observe
    the shift in how technologies are developed and adopted, and the emergence of
    the "foundational" technologies that will now disrupt our understanding of the
    world. The future is arriving faster than we imagine. We have no choice but to
    keep pace.


