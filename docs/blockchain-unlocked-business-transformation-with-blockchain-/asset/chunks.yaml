- raw: 'Furthermore, with blockchain payment solutions, it is practical to make a
    payment an integral part of the automated settlement of an agreement through smart
    contracts. This means payments stipulated on a business contract or any form of
    agreement can be automated and made to self-execute when the predefined conditions
    are met—without involving a third-party enforcer.


    On conventional systems, someone or some entity has to release funds attached
    to a contract manually. This could be a counterparty to the contract or a third
    party such as a bank acting on behalf of the counterparty. On the blockchain,
    it is easy to code the money into a contract and have a computer protocol take
    care of everything, including releasing payment at a time and point when it is
    needed. Thus, payments on the blockchain can easily be written into smart contracts.
    Relatedly, payments on the blockchain can support the interaction of smart devices
    in the growing IoT environment. After all, we are heading into a future where
    intelligent devices would need to pay one another using methods on the blockchain.


    It is also important that blockchain can support micropayments. You can use the
    blockchain to make payments amounting to mere cents, regardless of the location
    of either the one making the payment or the one being paid. Such micropayments
    make services that could never have been offered using traditional payment methods
    possible. A good example is a browser automatically paying on behalf of a user
    for every single article read on a website or blog. The Brave browser is already
    implementing this. As a user, you can fund an inbuilt wallet with Basic Attention
    Tokens (BAT), and the browser will send small amounts to the sites you visit depending
    on the amount of time you spend on it or the number of articles and videos you
    view^([2](#ch12.xhtml#ch12fn2)).


    Meanwhile, in the IoT environment, a smartphone can pay for Internet access to
    hotspots as you travel around the city throughout the day, for example. Using
    traditional payment methods to implement this kind of use case is near impossible
    because they do not support micropayments. Even if they did, the cost per transaction
    could be higher than the amount being paid.


    ### **Blockchain disadvantages for payments**


    Now, after going through some of the things that make payments on the blockchain
    better than other methods of payment, it is only logical to look at its disadvantages.


    Perhaps one of the most significant disadvantages of payments on the blockchain
    is that they have not been adopted at a massive scale. The places where you can
    go to today, online or offline, and settle your bills using blockchain-based payment
    methods are still minimal. Typically, if you need to make a purchase using the
    payment method on the blockchain, you still have to convert to fiat currency first.
    The majority of payments settled on the blockchain are related to speculative
    trading on exchanges and trading platforms.


    Another disadvantage is that payment methods on the blockchain are still not clearly
    defined before the law. In fact, it is illegal for a business to accept payment
    in the form of digital currency on the blockchain, such as in Columbia, Ecuador,
    and Bolivia^([3](#ch12.xhtml#ch12fn3)). In these three South American countries,
    the government has taken a clear legal step of banning the use of cryptocurrencies
    like Bitcoin as an option to fiat currency issued by the state^([4](#ch12.xhtml#ch12fn4)).


    The majority of the digital currencies on the blockchain experience high volatility.
    While this is good for speculation, it works against a currency’s ability to be
    used as payments for goods and services. In particular, businesses are wary of
    accepting Bitcoin because they do not want to lose value to currency price movements
    in the market. Where the profit margin is thin, a business could sell an item
    or service for a good profit only to wind up making a loss due to price changes
    that happened just a few minutes after closing a sale. This is especially critical
    where a business has to convert its revenue to fiat to pay its suppliers.


    The majority of businesses that accept cryptocurrencies for payments have partnered
    with payment processors like BitPay, which immediately convert their earnings
    into fiat and thus help them avoid losing value due to cryptocurrency volatility.
    This defeats the purpose of accepting cryptos in most cases, especially considering
    that a payment processor is a business that charges a fee, therefore making the
    transaction a little more costly.


    Scalability to meet existing demand is one of the primary challenges that cryptocurrencies
    have had to face. For example, demand was high as the price of Bitcoin grew in
    late 2017 and early 2019, which increased the number of transactions that needed
    to be confirmed on the shared ledger. At some point, the waiting time was up to
    16 hours. This inconvenienced users and completely went against the idea that
    Bitcoin payments are fast^([5](#ch12.xhtml#ch12fn5)).


    ### **Customer to customer (C2C) payment solutions**


    Now let’s look at particular payment methods for C2C that are actualised on the
    blockchain. As mentioned at the beginning of this chapter, the C2C blockchain
    payment applications come in three primary categories. Let’s go through how they
    work as well as their particular examples.


    #### **Cryptocurrency**


    Cryptocurrencies form the most developed category of blockchain payment use cases,
    and of all kinds of applications. Indeed, the world first discovered the cryptocurrency
    (Bitcoin) before learning about the blockchain technology behind it.


    The term cryptocurrency is often used to describe any digital asset created and
    managed on the blockchain. However, its stricter meaning can guide us to determine
    what qualifies as a crypto. Perhaps it helps to recognise that the word “cryptocurrency”
    is a compound from two words: cryptography and currency. We can easily deduce
    that whatever carries the compound term has to be a currency that uses some form
    of cryptography. In other words, even though cryptocurrencies are decentralised
    and use cryptography as part of their underlying architecture, they are supposed
    to serve just like fiat money. They are supposed to be a medium of exchange, a
    store of value, and a unit of account.


    It is not easy to tell precisely how many cryptocurrencies are out there, because
    they often grouped together with other blockchain assets. More importantly, the
    line between cryptocurrencies and other types of blockchain assets is often blurred.
    There are, however, a few that are clearly cryptocurrencies owing to what they
    were designed to do. Of course, Bitcoin is one of them as it was primarily intended
    to be electronic cash. ZCash, Litecoin, and Monero are others that you could easily
    say, strictly speaking, are cryptocurrencies.


    While the use of cryptocurrencies as payment has not gone mainstream, where it
    really matters—being used to pay for goods and services, the number of transactions
    completed on the blockchain has been on a steady increase. For example, in 2010,
    the Bitcoin blockchain processed about 30,000 transactions per day. The number
    at the time of writing this book is around 500k.


    As mentioned earlier, the Bitcoin blockchain, in particular, has struggled to
    scale. And its clogging, as well as that of Ethereum, the second largest network
    in terms of market capitalisation, rallied the communities to seek scalability
    solutions. In the case of Bitcoin, the scalability journey has been anything but
    smooth. Disagreements over what option to adopt has led Bitcoin to have to split
    into several independent networks, including Bitcoin, Bitcoin Cash, and Bitcoin
    Gold.'
