- raw: 'It is easy to list assets that do not exist or that one does not actually
    control. This is usually for frauding potential buyers and investors. A listing
    platform on the blockchain can easily be global. Using API or similar protocols,
    it can interoperate with other real estate blockchain-based as well as centralised
    platforms, providing investors with an extensive list of options. Of particular
    importance is that other systems such as the title registry can vouch for the
    details of specific listed assets. Those who list can easily prove the existence
    of the piece of real estate. And they can do this by, for example, signing a listing
    using a private key they control that is connected to an asset in the title registry.
    The information provided is made immutable so that investors can get an accurate
    picture of what they intend to invest in.


    Also, the blockchain offers the tools to build superior listing platforms that
    are free to use or cost a negligible price as compared to what centralised systems
    charge. That is because those platforms can easily be community-owned open source
    projects. However, even where they are privately owned, the cost can be low given
    that either the foundational infrastructure is free or the maintenance of the
    entire platform is funded through models only possible on blockchain such as native
    coins allocated to the developer team.


    Imbrex is an example of a blockchain platform that seeks to connect all the steps
    involved in real estate sales and leases. On their platform, the asset gets a
    unique identification that it carries from listing right through to sale settlement.
    Imbrex also provides a native payment method as well as smart contract capability.


    #### **Facilitating peer-to-peer trading**


    Because a single transaction in the real estate market can take months before
    completion, most of those who choose to invest in the market have to be willing
    to be in it for the long haul. The blockchain is about to change that. The technology
    provides the tools that will make it possible to buy and sell real estate in a
    matter of minutes or hours and not weeks and months. What’s more, it supports
    peer-to-peer trading, where one individual sells directly to another without going
    through intermediaries. Indeed, the reason it takes a long time to complete a
    transaction involving real estate is because of the bureaucracy involved. This
    bureaucracy came into existance primarily as a way to protect investors, but now
    technology can more effectively provide such protection.


    Blockchain technology can improve the buying and selling of real estate by first
    facilitating tokenisation. The house or land ends up having a digital value on
    the blockchain that represents it. This digital value, or a token, carries the
    unique details of the assets, including the location, size, and even ownership
    history. The token can be linked to the title of the asset in the blockchain registry.
    It can then be traded on an exchange, and whoever possesses it is recognised as
    the asset owner in the real world. This means a piece of real estate for sale
    could be sold within minutes of being listed. The peer-to-peer trading is possible
    thanks to the smart contract and sovereign escrow applications (more on this later).
    By removing most intermediaries, the blockchain cuts the cost of trading real
    estate significantly.


    Tokenising assets on the blockchain greatly improves its liquidity. You will not,
    as an investor, have to wait for months before you are able to sell your assets
    and collect the cash. This makes the real estate market easy to join and leave.
    In fact, with blockchain applications, it could become possible to own a piece
    of land or an apartment for a day or two, and then sell it to make a profit.


    Also, blockchain technology allows investors to buy small pieces of a large and
    high-value real estate as an investment. An investor can buy tokens (or fraction
    of a token) that represent a share of the asset. This is known as fractional ownership
    or co-ownership. What’s more, if multiple investors have ownership of a single
    piece of real-estate, their relationship can be regulated through multi-signature
    smart contracts. That means the revenue from the lease is automatically deposited
    to the wallet of each co-owner according to the shareholding.


    It is important to point out that technology opens up the international real estate
    market to everyone. By using blockchain listing and asset trading platforms, you
    can buy a house, flat, or a piece of land from anywhere on the globe; you do not
    even have to set foot there. You also do not need to engage the services of local
    realtors and lawyers. All you need to do is just go to an online exchange and
    buy the token that represents whatever asset you think stands give you a profit
    either through leasing or selling later. Moreover, you could choose to own just
    a piece of it and not the entire asset. This latter option is ideal for investors
    who want to get a portion of the most valuable assets around the globe but do
    not have the cash to buy the entire assets^([4](#ch16.xhtml#ch16fn4)).


    Meridio, a platform project by the blockchain company Consensys, is an example
    of a blockchain platform that tokenises real estate assets for easy and convenient
    trading. Meridio also allows property owners to sell their real estate in digital
    shares. Each property can be subdivided into many shares, and each represented
    as a token in the blockchain. Using the platform, several investors can co-own
    a single piece of property, which allows small investors to get a part of high-end
    real estate.


    #### **Managing asset portfolios**


    Now let’s turn our focus to how the blockchain helps investors manage their real
    estate after they have acquired it.


    It turns out the blockchain also offers many potential solutions for managing
    assets after acquiring them. In particular, the technology provides the tools
    to help the owner easily lease out the place and receive revenue through smart
    contract guided transactions.


    For long-term leases, this could include an arrangement where, after releasing
    the house, the renter sends the payment to a wallet every week or month. The smart
    contract could consist of a house managing agent to take care of the physical
    needs on the ground. However, the genius of the technology can be appreciated
    when it comes to the management of co-owned assets. A smart contract on the blockchain
    can efficiently regulate the relationship between different owners of a property.
    And this includes splitting revenue and responsibilities equitably. The owners
    of a real estate could leverage a DAO-like (decentralised anonymous organisation)
    structure to make critical decisions about the property, including hiring agents
    to oversee it.


    The technology also offers apt solutions to short-term leasing or home-sharing.
    Recently, the real estate market has seen an increase in short-term leasing, and
    it appeared to be exponential growth. Airbnb was the first company to facilitate
    the transactions between homeowners and travellers who needed a place to stay
    for a day or two. The blockchain could make this experience even better for both
    hosts and guests. To begin with, the technology has the necessary tools to allow
    hosts and guests to connect and transact without going through a third party like
    Airbnb. This could bring down costs for both the host and the guest as everything
    the guest pays goes to the host.


    The marketplace for lodgings could be an open-source dApp that is run by a community
    of users, a model like that of Bitcoin. Developers could maintain the platform
    by getting a small contribution from the community. It could be launched through
    an ICO initiative, where the development team sells the native currency of the
    platform to the public and raises funds to build and maintain it. The developer
    team could also retain an amount from the emitted native coin to go into maintaining
    the project.


    ##### **The Airbnb example**'
  fmt: '

    ## 区块链房地产平台的优势


    虚假资产列表容易制造，通常用于欺诈潜在买家和投资者。基于区块链的上市平台可以轻松实现全球化。通过 API 或类似协议，它可以与其他基于区块链的房地产平台以及中心化平台互操作，为投资者提供广泛的选择。特别重要的是，产权登记等其他系统可以为特定上市资产的细节提供担保。上市方可以轻松证明房地产的存在，例如，通过使用其控制的、与产权登记中资产关联的私钥对上市信息进行签名。所提供的信息被设为不可变，以便投资者能准确了解其拟投资的标的。


    此外，区块链提供了构建优质上市平台的工具，这些平台免费使用或成本微乎其微，远低于中心化系统的收费。这是因为这些平台可以轻松成为社区拥有的开源项目。然而，即使是私有平台，成本也可以很低，因为基础设施免费，或者整个平台的维护资金来自仅在区块链上可能的模式，如分配给开发团队的原生代币。


    Imbrex 是一个区块链平台示例，旨在连接房地产销售和租赁的所有步骤。在其平台上，资产获得唯一标识，从上市一直贯穿到销售结算。Imbrex 还提供原生支付方式以及智能合约功能。


    ### 促进点对点交易


    由于房地产市场的单笔交易可能需要数月才能完成，大多数选择投资该市场的人必须做好长期持有的准备。区块链即将改变这一现状。该技术提供了工具，使在几分钟或几小时内（而非几周或几个月）买卖房地产成为可能。更重要的是，它支持点对点交易，即个人直接向另个人出售，无需通过中介。事实上，完成房地产交易耗时长的原因是涉及的官僚程序。这种官僚主义最初是为了保护投资者而产生的，但现在技术可以更有效地提供这种保护。


    区块链技术首先通过促进**代币化**来改善房地产买卖。房屋或土地最终在区块链上拥有代表其价值的数字资产。这种数字价值（即代币）携带资产的唯一细节，包括位置、大小甚至所有权历史。代币可以与区块链登记中的资产所有权关联。随后可在交易所交易，持有者在现实世界中被认定为资产所有者。这意味着待售房地产可在上市几分钟内售出。点对点交易得益于智能合约和主权托管应用（稍后详述）。通过移除大多数中介，区块链大幅降低了房地产交易成本。


    在区块链上对资产进行代币化极大地提高了其流动性。投资者无需等待数月即可出售资产并回笼资金。这使房地产市场易于进出。事实上，借助区块链应用，持有土地或公寓一两天然后出售获利成为可能。


    此外，区块链技术允许投资者购买大型高价值房地产的小份额作为投资。投资者可购买代表资产份额的代币（或代币的一部分），这称为**份额所有权**或**共同所有权**。更重要的是，如果多个投资者共同拥有单一房地产，其关系可通过多签智能合约进行规范。这意味着租赁收入会根据持股比例自动存入每个共同所有者的钱包。


    重要的是，技术向所有人开放了国际房地产市场。通过使用区块链上市和资产交易平台，您可以在全球任何地方购买房屋、公寓或土地，甚至无需亲自到场。您也不需要聘请当地房产经纪人和律师。您只需访问在线交易所，购买代表您认为能通过租赁或日后转售获利的资产的代币。此外，您可以选择仅拥有其一部分而非整个资产。对于想分享全球最有价值资产收益但资金不足购买整个资产的投资者，后一种选择是理想的^([4](#ch16.xhtml#ch16fn4))。


    Meridio 是区块链公司 Consensys 的一个平台项目，是将房地产资产代币化以便于交易的区块链平台示例。Meridio 还允许房产所有者以数字份额出售房地产。每个房产可细分为多个份额，每个份额在区块链上表示为一个代币。通过该平台，多个投资者可共同拥有单一房产，使小额投资者能参与高端房地产投资。


    ### 管理资产组合


    现在让我们关注区块链如何帮助投资者在获得房地产后进行管理。


    区块链还为收购后的资产管理提供了许多潜在解决方案。特别是，该技术提供工具帮助所有者轻松出租房产，并通过智能合约指导的交易接收收益。


    对于长期租赁，这可能包括一种安排：出租房屋后，租客每周或每月向钱包发送付款。智能合约可包含房屋管理代理，负责处理实地的物理需求。然而，该技术的精妙之处在于共同拥有资产的管理方面。区块链上的智能合约可高效规范不同房产所有者之间的关系，包括公平分配收益和责任。房地产所有者可利用类
    **DAO**（去中心化自治组织）结构就房产做出关键决策，包括聘请代理监管房产。


    该技术还为短期租赁或房屋共享提供了适用的解决方案。最近，房地产市场短期租赁激增，呈指数级增长。Airbnb 是首家促成房主与需要住宿一两天的旅行者交易的公司。区块链可让房东和客人的体验更佳。首先，该技术拥有必要工具，允许房东和客人直接连接交易，无需通过
    Airbnb 等第三方。这可降低双方成本，因为客人支付的所有款项直接归房东。


    住宿市场可以是一个由用户社区运营的开源 **dApp**，模式类似比特币。开发者可通过社区的小额捐助维护平台。可通过 **ICO** 计划启动，开发团队向公众出售平台原生货币筹集资金以构建和维护项目。开发团队也可保留部分发行的原生代币用于项目维护。


    #### Airbnb 案例

    '
