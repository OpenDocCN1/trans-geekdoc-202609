    ## 序言\n\n今天的世界与我们的祖先在过去 200 年所经历的世界，既如此相似，又截然不同。相似之处在于，我们对太空探索或海洋最深处依然知之甚少。不同之处在于，我们现在只需点击一下按钮，就能拥有宝藏般的海量信息。未来的\
    \ 200 年将给我们带来什么？\n\n我们正处于数据爆炸的时代，全球超过 90% 的数据仅在过去三年内就已创建。这是一个数据世界的丛林，我们迈出的每一步、每一个转身，都充满了丢失敏感数据和信息的潜在危险。网络诈骗和骗局造成的损失超过\
    \ 6000 亿美元，预计到 2021 年每年将损失 6 万亿美元。仅在 2017 年，网络攻击就激增了 600% 以上。我们生活在一个日益嘈杂、不安全、缺乏信任的世界里。\n\
    \n将深刻影响我们的三大关键技术是人工智能、区块链和网络安全。AI 负责清晰度，区块链负责信任，网络安全负责安心。虽然许多人将它们视为独立的实施方案，但我认为它们只是三脚架的三条腿；我们需要这三者才能在未来的未知中保持稳定、做到面向未来。\n\
    \n就在 25 年前，Jeff Bezos 决定创办亚马逊时，还被问到“互联网是什么？”。现在《区块链解码》出版正逢其时，因为世界依然在问“区块链是什么？”。Daryl\
    \ 将一个复杂的主题进行了整理、构建和阐述，使其变得通俗易懂，且适用于普通感兴趣的人士。当许多人还只在谈论技术本身时，Daryl 专注于真正重要的事情：我们如何使用区块链，以及*人们如何从中受益*。\n\
    \n"
