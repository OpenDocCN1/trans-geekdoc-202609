- raw: 'However, even with all the security measures that the blockchain provides,
    it is still up to us to make it work or fail. Human intervention is still an important
    security factor. Blockchain cannot protect information systems from human error,
    poor judgment, or sabotage. Let’s use the land title registry for example again
    to illustrate this. Even on the blockchain, it still requires people to do the
    survey, the subdivisions, and register the titles. Unfortunately, there is no
    shortage of things that can go wrong here. The wrong title could be assigned to
    the wrong person. The wrong size of real estate could be entered into the system
    for a particular title. Or some real estate might be left entirely out of the
    system.


    Besides, even an incorruptible land registry on the blockchain requires the courts
    to enforce ownership rights with, possibly, the threat of force. How those are
    used is determined by individuals in power. It is also possible that should a
    dictator come into power, they can choose to ignore the blockchain system and
    go ahead to distribute land the way they want using another system.


    It is important to point out that even though blockchain makes hacking a lot more
    difficult, it does not prevent other methods of gaining illegitimate access to
    systems. The Bitcoin blockchain has never been successfully hacked since its launch
    in 2009. In his book *Digital Gold, New York Times* journalist Nathaniel Popper
    writes about Argentinian entrepreneur Wences Casares’s attempts to hack the Bitcoin
    blockchain. When he learnt about Bitcoin in 2010, Casares thought it was too good
    to be true. He offered $500,000 to two online security entities to attempt to
    break the system. They failed^([2](#ch02.xhtml#ch02fn2)).


    But while the Bitcoin peer-to-peer ledger has never been compromised, billions
    worth of Bitcoins have been stolen from wallets of exchanges as well as individuals.
    The hackers have failed to hack the Bitcoin shared ledger and change the records
    there. However, they have figured out how to achieve the same goals by going for
    the private keys of wallets holding value. With blockchain, the focus shift from
    gaining access through other forms of attacks to accessing the private keys that
    can then be used to authorise irreversible transactions. However, this form of
    hacking is not any less harmful. So we can say that blockchain cannot provide
    total security from hacking or unauthorised access.


    #### **Improved privacy for users online**


    Now let’s look at the other advantage that blockchain provides, and that is privacy
    it affords users online. Blockchain has never been anonymous; it is only pseudo-anonymous,
    which means that like with centralised payment systems, you need a username to
    use a system on the blockchain. The only difference is that on the blockchain
    this username need not be your real-world identity. Still, if someone is able
    to connect your real-world identity and your username on the blockchain, then
    your privacy is blown.


    Bitcoin proved that people could send and receive money online without having
    to disclose their real-life identity. The goal that Satoshi Nakamoto, the creator
    of Bitcoin, seemed to have was to make Bitcoin behave like cash online. Many believed
    Bitcoin was electronic cash, but not for long. It quickly dawned on users that
    the Bitcoin ledger (a blockchain) is public and anyone can access it.


    It turns out that there are now companies that build solutions to help law enforcement
    and other entities figure out the movement of value and data on the blockchain.
    And with a little analysis, they can connect the pseudonyms on the blockchain
    with the real-life identities of the users using data collected from various sources.
    One such company is Chainalysis, founded by Jan Moller, Jonathan Levin, and Michael
    Gronager in late 2014. The company claims to help banks, businesses, and governments
    understand how people use cryptocurrencies^([3](#ch02.xhtml#ch02fn3)).


    Their website states: “We provide blockchain data and analysis to government agencies,
    exchanges, and financial institutions across 40 countries. Our compliance and
    investigation tools, education, and support help our customers understand what’s
    happening on blockchains.”


    Of course, this vulnerability of the Bitcoin and other blockchains has inspired
    developers to design and build blockchains that obfuscate transactions further.
    Monero and Zcash are two examples of such blockchains. But even with these, privacy
    loopholes exist. In particular, users can be identified through monitoring the
    onramp and offramp points. For anyone to get their money into a cryptocurrency,
    they need to use an exchange. As exchanges are centralised entities for the most
    part, we are seeing them come under strict “Know Your Customer (KYC)” requirements.
    Only a few years ago, one could easily use an exchange without having to disclose
    who they are. But this has gradually changed. Now, even peer-to-peer exchanges
    like LocalBitcoins require users to register themselves using government-issued
    identification documents such as passports and driving licenses.


    #### **More efficient speed, capacity, and cost**


    What about efficiency? How much can blockchain provide? Blockchain has proven
    that it is possible to speed up financial transactions; we can send any amount
    from one corner of the globe to another in a matter of minutes. However, blockchain
    scalability is still a work in progress, especially when applications that demand
    a significantly high number of code executions are launched on a blockchain platform.
    In late 2017, a team of developers launched a game called Cryptokitties on the
    Ethereum blockchain. Due to its high capacity demands, the blockchain was overwhelmed,
    slowing down every other application on the platform. It is important to point
    out that Ethereum was the first blockchain to be designed as a backend for multiple
    applications.


    On the Bitcoin blockchain, developers have struggled to provide speed and efficiency.
    It appears that users have to sacrifice speed for security and to have a relatively
    high level of privacy when they choose to use cryptocurrencies.


    For a long time, scaling of the Bitcoin blockchain has been a major point of interest
    and contention. In particular, the Bitcoin community has debated how to make the
    system confirm more transactions per second to effectively compete with centralised
    payment systems such as Visa and MasterCard. Solutions like SegWit and Lightning
    Network have added a lot of capacity. However, this is still insignificant compared
    to centralised server systems. Visa, for example, has a capacity of up to 50,000
    transactions in a second, while the Bitcoin network can only confirm less than
    100 transactions.


    There are a few projects now trying to create hybrids of blockchain and conventional
    servers using innovations such as the InterPlanetary File System (IPFS). Such
    systems can have the best of both worlds by combining the speed of traditional
    servers and security of the blockchain. Thus, we can say that blockchain cannot
    provide infinite capacity.


    The blockchain can deliver online experiences that were not previously possible.
    It has proved that it can provide better value in applications that have previously
    existed. It can bring forth applications that are only possible on the blockchain.
    A good example is the smart contract application, or agreements written in code
    that self-executes when predefined conditions are met.'
