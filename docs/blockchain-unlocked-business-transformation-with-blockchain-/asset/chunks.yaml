- raw: '[Chapter 5](#ch05.xhtml) defines the types of blockchains, mainly public and
    private blockchains. It offers examples from either category and looks at what
    differentiates them as well as their strengths and weaknesses. It focuses on three
    primary areas of difference: (1) access to read and edit data on the shared ledger,
    (2) how the core software is developed and maintained, and (3) how much the system
    relies on game theory to function effectively.


    In [Chapter 6](#ch06.xhtml), we explore the concept of smart contracts. This is
    an application that is almost exclusively used on the blockchain, and is believed
    to be its most disruptive of all its applications in the long term. It explains
    what a smart contract is, how it works, and why it is a very potent application.
    The chapter also takes us through the history of smart contracts, a concept that
    precedes blockchain by about 15 years. The chapter also explains why the blockchain
    is the most suitable foundation for smart contracts.


    In [Chapter 7](#ch07.xhtml), the book focuses on the application of blockchain
    in business. It asks whether all businesses need this technology and how specific
    needs should guide how a business embraces and makes the technology part of its
    systems. This is a critical question, as there is a general belief that every
    business can benefit from blockchain. It answers this question in reference to
    three broad categories of benefits: (1) better security to data and systems, (2)
    improved privacy for users online, and (3) more efficiency in terms of speed,
    capacity, and cost.


    [Chapter 8](#ch08.xhtml) continues the previous discussion, except now we consider
    possibility of you building your own blockchain. It explains what conditions necessitate
    a business or someone to design and develop their blockchain. It also brings into
    attention the obstacles that stand in your way should you take the leap to build
    your own blockchain. This chapter is meant to help you answer three questions:
    (1) do you really need a new blockchain?, (2) do you have the capacity to design
    and build a new blockchain?, (3) can you bring together and inspire a community
    to support and maintain it so that in the long term, it is a genuine blockchain?


    ### **A matter of how, not when**


    In [Part 2](#pt02.xhtml), we explore how the blockchain technology can, and is
    already, changing business in various industry areas. This might be the more critical
    part of the book for many readers.


    We start with the use of blockchain in banking and finance in [Chapter 9](#ch09.xhtml).
    In particular, the chapter explores not only how the technology might replace
    the legacy institutions in the sector, but also how it might turn out to be a
    blessing and not a curse. It also covers emerging decentralised finance (DeFi)
    applications and gives examples of projects that are utilising the technology
    for this purpose. The chapter also explains how, unlike previous technologies,
    the blockchain shifts the balance of power in finance and banking.


    [Chapter 10](#ch10.xhtml) takes us through the uses of the blockchain in supply
    chain management. In addition to giving you a list of how blockchain is changing
    how the supply chains, it provides examples of projects that are building applications
    for this particular use case. The chapter goes through four primary advantages
    that the blockchain offers supply chain management: (1) improved efficiency and
    reduced operations costs, (2) simplified compliance as well as quality certifications,
    (3) reliable provenance for end consumers, (4) and tools for making trade finance
    faster, secure, and cheaper.


    [Chapter 11](#ch11.xhtml) covers how applying blockchain can make public governance
    better. It gives examples of immediate things that the technology can do as well
    as describe its potential to change the concept of government entirely. The chapter
    categorises the impact of blockchain on government in two ways: (1) improving
    the existing processes and systems and (2) changing the idea of government altogether.


    [Chapter 12](#ch12.xhtml) looks at the use of the blockchain for payment applications.
    The focus is on the use of cryptocurrencies, tokens, and other assets as a medium
    of exchange, store of value, and unit of account. It explores how this technology
    makes it easy to move money from one part of the world to another. It also explores
    how capabilities on the blockchain, such as micropayments, can change other industries.
    The use of blockchain for payments is covered as an extensive area with the following
    three classes: (1) customer to customer (C2C) payment solutions, (2) business
    to business (B2B) payment solutions, and (3) a combination of those two, which
    can be B2C or even C2B.


    [Chapter 13](#ch13.xhtml) covers how blockchain can change health care systems,
    in particular the delivery of healthcare services. It explores how blockchain
    is poised to achieve one of the most disruptive transformations in the healthcare
    sector. This is by (1) making possible an efficient medical information management
    system that is interoperable both nationally and internationally, (2) offering
    speed in processes, security for data as well as the privacy for patients, and
    most importantly, (3) introducing a novel mode of medical data ownership and usage,
    which places the patient at the centre of the medical information management system.


    [Chapter 14](#ch14.xhtml) looks at use cases of blockchain in the insurance sector.
    It focuses on the systems that the technology can make possible and how those
    can change how risks are covered around the world. It also points out a few of
    the startups and projects that are building specific applications for use in this
    industry. It explains how the following areas in insurance stand to benefit from
    the use of blockchain: (1) reinsurance, (2) fraud detection and prevention, (3)
    property and casualty insurance, and (4) health and life insurance.


    In [Chapter 15](#ch15.xhtml), the book focuses on the use of cases related to
    the energy industry. It explains how the technology can change the production
    and distribution of energy and points out specific blockchain projects. It covers
    the following four primary values blockchain technology offers the energy sector:
    (1) help with data management, (2) make possible new systems of energy distribution,
    (3) serve as a mechanism for tokenising energy for more efficient management,
    supply and trading, and (4) be the backend technology for the transition to green
    energy.


    [Chapter 16](#ch16.xhtml) is about the application of the blockchain technology
    in the real estate sector. The chapter explains how the technology can change
    title, listing, and trading systems and focuses on the new opportunities that
    the technology offers. It covers six benefits blockchain offers the sector: (1)
    a better title system, (2) a better way of listing assets in the market, (3) tools
    to facilitate peer-to-peer trading, (4) tools for managing asset portfolios, (5)
    better mortgage financing options, and (6) more efficient but less costly escrow
    services.


    [Chapter 17](#ch17.xhtml) looks at the application of blockchain to manage Know-Your-Client
    (KYC) and Anti-Money Laundering (AML). It begins by explaining the irony behind
    the technology as a solution to KYC and AML problems, when its initial applications
    (cryptocurrencies) were designed to beat such systems in place around the globe.
    We go into detail about the potential of the technology to fix the current systems
    in banks and regulatory agencies that are meant to watch against money laundering
    and terrorist financing.


    [Chapter 18](#ch18.xhtml) asks how blockchain can be accessed as a service. It
    explores some of the models that will make blockchain available as a service.
    That includes private enterprise, open-source community-supported projects, and
    hybrid models.'
