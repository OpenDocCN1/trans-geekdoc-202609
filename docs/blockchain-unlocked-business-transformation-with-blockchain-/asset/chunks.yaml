    区块链开发者、用户和爱好者最可能关注的一个趋势是向区块链网络的真正去中心化迈进。区块链架构中的某些元素已被证明会威胁到原本旨在构建的去中心化点对点结构。区块链提供的部分安全性，特别是记录的不可篡改性，源于这样一个事实：没有个人或群体能够接管网络并更改交互规则。这被称为“51%攻击”。虽然这种攻击尚未发生，但显而易见，单一实体可以积累资源，最终控制网络中最大的算力。我们已经看到，一些比特币矿池已接近拥有超过网络50%的算力。


    我们已经看到旨在克服这一威胁的区块链协议。这些协议赋予节点（包括智能手机等最小设备）有效参与挖矿的能力。例如，IOTA生态系统中使用的Tangle协议使挖矿成为网络每个用户都参与的活动。开发者为缓解区块链网络可能出现的中心化而采取的另一措施，是编写阻止ASIC挖矿的协议，这使得普通人参与挖矿的成本变得高昂。能够负担得起在网络上挖矿的人越多，该网络就能变得越去中心化。


    第六个趋势是网络的互操作性，我们预计从2020年开始这一趋势将增长。只有当不同区块链能够通信并不仅共享数据，还能共享价值时，区块链的真正潜力才能实现。许多人预见了一个全球区块链网络的网络的未来。实现这一目标的技术已经可用并正在测试中。它们包括Liquid
    Network和Plasma Network，两者都实现了侧链结构（多个区块链互联互通）。这一发展的一个主要影响是，当今与全球价值流动相关的一些弱点将得到解决。特别是，依赖中心化交易所在不同区块链间转换价值可能成为过去式，这将为最终用户提高安全性、隐私性和速度。在更大范围内，这最终可能使整个互联网真正去中心化，与当今少数大公司掌握巨大影响力的现状形成对比。


    ### 更有意图的技术投资


    第七个趋势是构建能抵抗新兴技术（特别是量子计算）的区块链，这在2020年后可能变得更加明显。几乎每一家主要科技公司——Google、Microsoft、IBM等——都在致力于使量子计算机成为现实，似乎我们已经触及门槛。量子计算机能以从未有过的方式操纵数据，且速度难以想象。当然，这项技术能带来许多益处，包括通过新形式的研究为医学科学开辟更多可能性。然而，它也对区块链协议构成威胁。特别是，它可能使当前形式的区块链变得不安全，因为单台量子机器的算力可能超过整个网络的总算力。这将赋予其推翻网络并任意更改共享账本的能力。它还可能破解区块链高度依赖的加密技术，从而威胁价值所有权的安全。区块链社区对此威胁非常清楚。区块链开发者已经在研究能抵抗这种强大机器的协议。这些努力在2020年后只会增加，尤其是随着量子计算的普及^[3]。


    第八个趋势是，2020年后设计为快速赚钱计划的项目将减少。重点很可能会转向旨在创造长期价值的项目，特别是那些提供服务、改进自动化、提供安全性和隐私性的项目。我们可能永远不会再看到2017年和2018年ICO热潮的重演。未来，对不同类型项目的投资将更加审慎。我们可能会见证许多2017年和2018年通过大规模ICO启动的项目倒闭。这要么是因为监管干预（如Telegram的情况，其创始人正因ICO的合法性与证券交易委员会对簿公堂），要么是因为其商业模式一开始就不合理。


    展望未来，其他趋势还包括现实世界与区块链界限的进一步模糊。特别是，更多现实资产可能被代币化，如房地产、汽车、贵金属和企业。


    此外，互联网身份极有可能迁移到区块链上，特别是随着2017年5月去中心化身份基金会（DIF）的成立，该联盟正在探索利用区块链进行互联网身份管理的方法。成员包括近百家科技公司和初创企业，如Microsoft、IBM、Accenture、Hyperledger和MasterCard。该项目旨在开发新协议，用于识别从网站、电子邮件、计算机到房地产、汽车等一切在线实体。


    在该时期，我们还可能看到智能合约的采用增加，这最终可能成为区块链最重要的应用，其全部潜力有望在未来十年实现。


    从2020年开始的时期，在区块链领域将是非常有趣的。重点很可能会从加密货币转向该技术的其他应用。


    ^[1] “Which Governments Are Using Blockchain Right Now?” ConsenSys, 18 Nov. 2019,
    [consensys.net/blog/enterprise-blockchain/which-governments-are-using-blockchain-right-now/](http://consensys.net/blog/enterprise-blockchain/which-governments-are-using-blockchain-right-now/)。


    ^[2] Zhong, Raymond. “China’s Cryptocurrency Plan Has a Powerful Partner: Big
    Brother.” The New York Times, 18 Oct. 2019, [www.nytimes.com/2019/10/18/technology/china-cryptocurrency-facebook-libra.html](http://www.nytimes.com/2019/10/18/technology/china-cryptocurrency-facebook-libra.html)。


    ^[3] Pollock, Darryn. “Google’s Quantum Computing Breakthrough Brings Blockchain
    Resistance Into the Spotlight Again.” Forbes, 24 Sept. 2019, [www.forbes.com/sites/darrynpollock/2019/09/24/googles-quantum-computing-breakthrough-brings-blockchain-resistance-into-the-spotlight-again/](http://www.forbes.com/sites/darrynpollock/2019/09/24/googles-quantum-computing-breakthrough-brings-blockchain-resistance-into-the-spotlight-again/)。


    ## 后记


    恭喜你！读到这里，你不仅拥抱了区块链，还为自己建立了关键的背景知识，了解一项即将以前所未有的规模颠覆社会的技术。你现在属于那些将构建或监督下一个Amazon、Google或Facebook诞生的人群。你能看到区块链的潜力，也能识别它为你带来的机遇。

    '
