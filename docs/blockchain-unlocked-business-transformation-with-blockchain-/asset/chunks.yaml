- raw: "The biggest challenge for most small businesses in using blockchain is the\
    \ shortage of the such hireable talent. There are not many developers experienced\
    \ in blockchain, and those who are come at a cost that might be out of reach,\
    \ especially for small businesses. Hiring is, however, not the only option to\
    \ give your business the capacity it needs to embrace blockchain. Members of your\
    \ team could train for the skill, as it is becoming easier to find relevant courses,\
    \ especially online. Learning platforms such as [Coursera.org](http://Coursera.org),\
    \ Udemy, and Skillshare have growing courses to choose from depending on your\
    \ specific needs.\n\nThe skillsets to build a blockchain system come from designers,\
    \ developers, game theorists, and token economists. A designer helps you put together\
    \ the structure you have in mind, while a game theorist helps the designer determine\
    \ the relationships that should exist between different players, and, more importantly,\
    \ how their interactions can be leveraged for the benefit of the entire system.\
    \ Finally, the developer brings the whole thing to life. For less complex blockchain\
    \ projects, however, all you may need is a developer with a little design and\
    \ game theory knowledge.\n\n### **The level or type of blockchain you need for\
    \ your business**\n\nThe third question is the extent to which you need to embrace\
    \ the technology, as well as the type of blockchain that is most appropriate for\
    \ your business. As a business, you must decide whether you need a public or a\
    \ private blockchain. Do you need to use an already existing blockchain (as a\
    \ service) or do you need to build a new application on an existing blockchain?\
    \ Indeed, you have to decide whether what you need is an entirely new blockchain,\
    \ which you have to build.\n\nIn other words, the blockchain technology comes\
    \ in several layers, and the primary ones being as a service, an application on\
    \ top of a blockchain, and the core protocol itself. The level at which you embrace\
    \ the technology depends on your specific needs. If your needs are unique and\
    \ there is no application as a service available for it, then you may have to\
    \ build your app on an existing blockchain. If you realise that none of the existing\
    \ blockchains can serve as an appropriate backend for your application, then you\
    \ may have to build the blockchain first before making the application.\n\nAfter\
    \ going through the workbook, you should be ready to make critical decisions about\
    \ how to proceed with adopting the technology. The workbook will evolve as I will\
    \ update it over time as the technology also changes. This means the workbook\
    \ can be with others anytime over the longer term. I welcome you to begin your\
    \ blockchain journey for your business with this workbook to analyse your business\
    \ concerning blockchain technology.\n\n## **Glossary**\n\n• the 51 percent attack:\
    \ a situation in which a bad actor attacks and acquires a computing power (hash\
    \ rate) of more than 51 percent of the entire network\n\n• Artificial Intelligence\
    \ (AI): the creation of computer applications that act as smart as humans\n\n\
    • Bitcoin: the first cryptocurrency and Store of Value (SoV) on the blockchain,\
    \ launched in 2009\n\n• Blockchain: a shared ledger of digital information that\
    \ is distributed across different computers and records transactions chronologically,\
    \ making it costly and difficult to alter transactions and allowing potentially\
    \ adversarial parties to cooperate\n\n• Blockchain as a Service (BaaS): a blockchain\
    \ service offering that allows customers to use cloud-based services to develop\
    \ and host their blockchain apps, functions, and smart contracts.\n\n• Cryptocurrency:\
    \ a digital currency in which encryption techniques are used to regulate the generation\
    \ of units of currency and verify the transfer of funds, operating independently\
    \ of a central authority\n\n• Decentralised Autonomous Organisation (DAO): a Smart\
    \ Contract-controlled organisational system\n\n• Decentralised applications (dApps):\
    \ open-source software that leverages on the blockchain technology\n\n• Distributed\
    \ ledger technology (DLT): a database that exists across several locations or\
    \ among multiple participants; it is decentralised and eliminates the need for\
    \ a central authority or intermediary to process, validate or authenticate transactions\n\
    \n• Hard fork: split of a blockchain network into two independent networks\n\n\
    • Hash rate: computing power\n\n• Initial Coin Offering (ICO): a fundraising mechanism\
    \ in which new projects sell their crypto tokens to raise funds for a new cryptocurrency\
    \ asset, company, or venture. Similar to an Initial Public Offering (IPO) in which\
    \ investors purchase shares of a company\n\n• Internet of Things (IoT): adding\
    \ smart devices to the system to help with the collection and analysis of data,\
    \ as well as automation of processes\n\n• InterPlanetary File System: an open-source,\
    \ peer-to-peer hypermedia protocol designed to make the web faster, safer, and\
    \ more open\n\n• Miner: a type of a node who computes transactions to secure the\
    \ blockchain\n\n• Node: any electronic device able to connect to the network,\
    \ including phones, printers, and computers\n\n• Proof of Stake (PoS): algorithm\
    \ that aims to achieve distributed consensus in a blockchain\n\n• Proof of Work\
    \ (PoW): model for blockchains to come to a consensus\n\n• Smart contracts: computer\
    \ protocols that facilitate, verify, or enforce the performance of a contract\
    \ making a contractual clause unnecessary\n\n• Tokens: a unit on the blockchain\
    \ that is issued for a limited or specific function or use, examples of which\
    \ are the Ethereum Gas and Storj coin.\n\n• Tor: an anonymous communication protocol\
    \ released in 2002\n\n• Turing Complete virtual machine: a computer with the ability\
    \ to write programmes or contracts that can solve any reasonable computational\
    \ problem\n\n## **About the Author**\n\n![image](images/img_001.jpg)\n\nI walked\
    \ a path like many before me. Graduating with a degree in Mechanical Engineering\
    \ from the National University of Singapore, I have always been fascinated by\
    \ the latest innovations and inventions in technology. Going into engineering\
    \ was not a surprise to anyone who knew me well, and my university days cemented\
    \ my pursuits.\n\nNot long after, I started my first business using capital accumulated\
    \ from several gigs while in school. I invested in technology solutions that were\
    \ merely ideas, developing them into products to sell to companies. I would invest\
    \ in intellectual property rights around the globe followed by innovating and\
    \ designing products. Solutions were developed for sectors like water treatment,\
    \ alternative energy, and nanotechnology.\n\nFollowing these successes in commercialising\
    \ technology, I started another company to expand my passion for matching innovative\
    \ products and technology for industry adoption, while at the same time creating\
    \ investment opportunities for clients.\n\nAs an entrepreneur, I am privileged\
    \ to have a front row seat, through which I could observe the shifts in how technology\
    \ is developed, adopted, and now, the emergence of “bedrock” technologies that\
    \ will disrupt the world as we know it. The future is coming faster than we imagine.\
    \ We have no option but to keep up.\n\n# Don't miss out!\n\nClick the button below\
    \ and you can sign up to receive emails whenever Daryl Lim publishes a new book.\
    \ There's no charge and no obligation.\n\n[![Sign Me Up](d2d_images/new_release_sign_up_button.png)](https://books2read.com/r/B-A-FPOL-KROHB)\
    \ \n\n[https://books2read.com/r/B-A-FPOL-KROHB](https://books2read.com/r/B-A-FPOL-KROHB)\n\
    \n![books2read](d2d_images/b2r_image.png)\n\nConnecting independent readers to\
    \ independent writers.\n\n![Daryl Lim](d2d_images/ata_image.jpg)\n\n# About the\
    \ Author\n\nI walked a path like many before me. Graduating with a degree in Mechanical\
    \ Engineering from the National University of\n\nSingapore, I have always been\
    \ fascinated by the latest innovations and inventions in technology. Going into\
    \ engineering was not a surprise to anyone who knew me well, and my university\
    \ days cemented my pursuits."
