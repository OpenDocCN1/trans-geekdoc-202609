- raw: 'Earlier in [Chapter 1](#ch01.xhtml), we introduced the possible distinctions
    in blockchain, especially with regard to permissions. Between public and private
    blockchains, three primary areas of differences exist. These are (1) access to
    read and edit data on the shared ledger, (2) how the core software is developed
    and maintained, and (3) how much the system relies on game theory to function
    effectively.


    #### **Access**


    Anyone can join a public blockchain. Not only that, anyone can read as well as
    help to maintain the shared ledger without needing permission from anyone. Usually,
    the only barrier to entry is the ability to acquire the necessary hardware and
    energy resources. Thus, public blockchains are also referred to as *permissionless*
    blockchains. One critical feature of public blockchains is that participants remain
    anonymous (or more precisely, *pseudo-anonymous*). No one is not compelled to
    disclose their real-world identity. Indeed, pseudo-anonymity is considered a selling
    point of public blockchains. Arguably, it is an essential feature and the only
    way to maintain privacy, given that anyone can access data on a public blockchain.


    Bitcoin is the first public blockchain. As long as one can afford to buy the mining
    ASIC (Application Specific Integrated Circuit) chips or a node and power it efficiently,
    he or she is free to join the network without being required to disclose his or
    her real-world identity, whether as a miner or as a user.


    When a new node joins a public blockchain, it can get up to date with the rest
    of the network by downloading the entire ledger from other nodes on the network.
    When the owner of the node decides that they no longer want to be part of the
    network, they do not need to inform anyone of their decision to pull out.


    With private blockchains, however, you cannot simply join the network. A private
    blockchain is organised in such a way that while it is still a peer-to-peer network
    like a public one, the owners of the nodes on the network know one another. Indeed,
    each node becomes part of the network through an elaborate process.


    Often the nodes on a private blockchain network are there through a contract entered
    into in the real world (think paper and pen). If you want to join the network,
    you need to persuade the appointed administrator or all the stakeholders and go
    through a negotiation process. If the stakeholders feel that you do not bring
    any value to the network or meet their requirements, they can decline your application.
    Thus, private blockchains are referred to as *permissioned* blockchains.


    There is an important point to make at this juncture: a private blockchain can
    be open or closed. It is open if the members of the public can access and read
    or use the data and applications on the blockchain. It is closed if only those
    with permission can access, read, or use the applications on the blockchain. Thus,
    a blockchain may be private, but the applications on top of it are accessible
    to everyone.


    Another important point to keep in mind is the owners of the nodes use their real-world
    identities on private blockchains. Anonymous players are not accepted. Everyone
    is known to everyone. This makes private blockchains attractive to entities that
    have to observe stringent regulatory requirements, in particular, Know Your Customers
    (KYC), Anti-money laundering (AML), and anti-terrorist financing. In particular,
    commercial banks and insurance companies have opted to build private blockchains
    with knowledge of whom they are working with being the main reason.


    #### **The core software**


    Now, let’s look at how public and private blockchains differ in terms of the development
    and management of the core software.


    A blockchain core software is the piece of code installed on your computer so
    that it can communicate and collaborate with others on the peer-to-peer network.
    The core software implements the rules of engagement (known as a protocol).


    Public blockchain software is almost always open source, which means it can be
    copied without infringing any copyright. Satoshi Nakamoto released the Bitcoin
    code under the open-source MIT licence. This is how thousands of other blockchains
    have been developed; most of them are essentially copies of the Bitcoin blockchain.
    On the other hand, most private blockchains release their codes under more rigid,
    limited, or exclusive copyrights. This often means you cannot copy what is uniquely
    theirs without infringing on a copyright.


    Even then, most private blockchains have their code developed behind the scenes.
    But more importantly, the development and maintenance of the private blockchain
    core software is undertaken by a specific and official team that is tasked with
    the responsibility. Stakeholders have a formal mechanism to pick and manage the
    team for the project. One way this is often done is that each stakeholder sends
    in a developer to be part of the team. Another is that the stakeholders form a
    consortium or a company that takes over the responsibility of building and managing
    the protocol. The latter is more common. The two most prominent private blockchains
    are managed through consortiums. In December 2015, the Linux Foundation and several
    major financial institutions and technology companies launched Hyperledger. Earlier
    that year in September, another group of financial institutions launched R3, another
    private blockchain consortium.


    In public blockchains, it is the entire community of users that is responsible
    for the core software development and maintenance. In particular, the project
    relies on volunteer developers to provide patches on the core software and release
    new versions to the community. Some members of the community may hire core software
    developers to work on the project.


    For example, several developers that have worked on the Bitcoin project over the
    years have been hired (or sponsored) by private companies that have built businesses
    on the blockchain. Examples of companies that have sponsored developers to work
    on the Bitcoin project include the Shanghai-based Bitcoin exchange BTCC, or BTCChina,
    and payment processor BitPay. It is also common for companies that build applications
    on top of a public blockchain to assign some of their developers to work on the
    core software. With Bitcoin, we have companies like Blockstream, Chaincode Labs,
    and Ciphrex doing precisely that.


    Some not-for-profit organisations collect funds from the community to hire developers
    to work on the core software. Again, Bitcoin offers some examples, including Bitcoin
    Foundation (active in the early days) and Digital Currency Initiative by MIT Media
    Labs. Most of the other public blockchains have foundations that either retain
    part of the mined coins, receive part of the transaction fees, or raise money
    from the community using other means to support the development and maintenance
    of the core software^([1](#ch05.xhtml#ch05fn1)).


    Getting the necessary resources is one thing. Changing critical parts of the public
    blockchain protocol is never easy, because often the entire community or at least
    a majority must form a consensus. Different players end up having conflicting
    interests. A case in point was the attempt to scale the Bitcoin protocol so that
    it could handle more transactions. The community had always struggled to form
    a consensus as to whether to increase the block size or have the community build
    second-layer scaling solutions such as Lightning Networks and SegWit. In 2017,
    the community was engaged in what is referred to the User Activated Soft Fork
    (UASF) Civil War, which led to the split of the network into Bitcoin and Bitcoin
    Cash^([2](#ch05.xhtml#ch05fn2)).'
