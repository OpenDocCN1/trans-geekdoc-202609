    # 在这两种情况下，区块链技术似乎都使监管工作变得更加复杂，特别是在追踪和管理全球资金流动方面。


    自 `Bitcoin` 诞生以来，其主要卖点之一是为用户提供隐私和匿名性，甚至能阻止政府访问其个人数据，尤其是关于他们如何花钱的数据。这在一定程度上解释了例如
    `Silk Road` 及其他使用 `Bitcoin` 作为主要交换媒介的暗网违禁品市场的兴起与昙花一现的成功。虽然在线匹配违禁品买卖双方的技术自 2002
    年起就已存在（当时名为 `Tor` 的匿名通信协议首次发布），但直到 2009 年 `Bitcoin` 出现之前，不存在一种难以追踪或封锁的数字支付方式。这种加密货币使得人们在使用
    `Tor` 连接后能够以伪匿名方式在线交易，几乎无需担心被追踪。尽管 `Silk Road` 于 2013 年 10 月被查封关闭，让许多人意识到 `Bitcoin`
    或许并不像想象中那么私密或匿名。`Chainalysis` 等公司的成立证实了这一点，它们构建工具追踪并关联区块链上的交易与现实身份。此类区块链调查公司将这些信息与执法机构、监管机构以及愿意付费的企业共享。


    ## 区块链世界中的 KYC 与 AML


    在早期，许多人错误地描述并认为 `Bitcoin` 是匿名的。结果证明它是*伪*匿名的。区别何在？前者中，用户无需任何形式的身份或档案即可使用服务。匿名支付方式的最佳例子是实物现金。用实物现金支付本身不会将你与交易联系起来。后者中，用户在线获取一个档案，该档案无需关联其现实身份。`Bitcoin`
    就是一个例子。尽管你需要区块链上的钱包地址来收发款项，但无需将你的姓名或物理地址附加到钱包地址上。


    然而，随着时间的推移，防止将用户在区块链上的身份与现实身份关联起来变得颇具挑战，因为用户需要在法定数字货币和加密货币之间进行兑换。当然，要在线使用法币，用户必须注册并通过提交政府签发的文件来证明身份。


    更糟糕的是，用户被迫在中心化市场（交易所）买卖，这些平台可能被强制与当局共享数据。毕竟，交易所是区块链身份与现实身份可以关联的节点。随着 `Bitcoin`
    证明并非许多人最初认为的那样私密，其他加密货币被设计成具备掩盖用户交易的能力，包括 `Monero` 和 `Zcash` 等。为了同一目的，还设计了交易混币器、`TumbleBit`
    和 `Coinjoin` 等额外服务和协议。去中心化交易所（`DEXs`）也进入了视野。然而，它们大多仅支持加密货币之间的兑换（几乎不支持加密货币与法币之间的兑换）^(1)。


    准确地说，最匿名的数字支付仍然只能在区块链上实现。然而，世界各地的监管机构正在采取行动，收紧对加密货币使用的监控和控制。特别是，他们将入金和出金点（如交易所和交易平台）视为实现这一目的的有效工具；这些服务提供商是中心化企业，因此很容易受到监管。就在几年前，在点对点交易平台
    `Localbitcoins` 交易还不需要提供现实身份证明，例如。只需用电子邮件地址注册并创建一个心仪的用户名即可。然而，一波全球监管浪潮（在撰写本书时）正要求交易所和其他加密货币企业建立严格的
    `KYC` 和 `AML` 体系。2019 年 3 月，`Localbitcoin` 总部所在的芬兰议会通过了一项法律，要求虚拟货币服务提供商通过政府签发的文件验证客户身份并认证其物理地址。因此，如果你使用
    `Localbitcoin` 买卖加密货币，该平台肯定知道你是谁，当局也能查看你的交易。这种情况正在全球复制，越来越多的服务提供商要求客户进行实名认证^(2)。


    要求虚拟货币服务提供商加强 `KYC` 和 `AML` 的压力不仅限于要求他们识别和验证服务使用者。在撰写本书时，似乎有动向将导致 `Bitcoin` 混淆的行为（进而延伸至加密货币交易）定性为犯罪。2020
    年 2 月中旬，区块链开发者 `Larry Harmon` 因协助构建名为 `Helix` 的 `Bitcoin` 混币器而被捕，据称该混币器被类似 `Silk
    Road` 的暗网市场 `Alphabay` 上的交易者用于洗钱。许多人认为，如果 `Larry Harmon` 被判有罪，这将向外界释放明确信号：即使只是帮助构建他人可用于洗钱的混币器也是犯罪。这将树立一个先例，可能导致所有加密货币交易混淆服务要么关闭，要么转入地下。无论哪种情况，监管机构似乎正在赢得对加密货币控制权的争夺战，而这在几年前看起来是一项艰巨的任务^(3)。


    ## KYC 与 AML 法律的区块链演进


    现在让我们将重点转向本章的核心：利用区块链技术获得识别和认证金融服务客户的能力，以及帮助追踪和阻止洗钱及其他犯罪活动。简而言之，这是关于利用驱动加密货币的技术来构建更好的系统以支持
    `KYC` 和 `AML`。这也关乎这些系统如何帮助企业为客户提供更好的服务。


    这就是第二个悖论出现的地方。在旧的中心化 `KYC` 和 `AML` 系统中，客户向机构提供数据，随后由机构控制和管理这些数据。数据的安全完全由收集数据的实体负责。而在区块链上的系统中，数据不存储在孤岛式的数据库中，由特定公司或监管机构负责。相反，它存储在共享账本上，不归任何特定实体所有。数据由客户控制。然而，讽刺的是，虽然客户对其数据拥有更多控制权，但他们无法更改细节。数据只能通过由防篡改算法指导的流程来更改。


    在探索区块链在管理 `KYC` 和 `AML` 方面的优势之前，让我们从头开始。`KYC` 和 `AML` 到底是什么？它们有多重要？


    ### 了解你的客户


    `了解你的客户` 是一个识别并收集客户数据的过程，其中关键部分是理解资金在用户间流动的原因。其目的多方面。首先，它使公司或企业能够有效地服务客户。任何严肃的企业都会努力清晰地了解其客户以及如何更好地服务他们。通过识别和了解客户是谁，企业能更好地理解他们的需求，从而提供最合适的解决方案。


    '
