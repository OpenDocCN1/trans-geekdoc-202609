    ## Blockchain Disadvantages for Payments


    Now, after going through some of the things that make payments on the blockchain
    better than other methods of payment, it is only logical to look at its disadvantages.


    Perhaps one of the most significant disadvantages of payments on the blockchain
    is that they have not been adopted at a massive scale. The places where you can
