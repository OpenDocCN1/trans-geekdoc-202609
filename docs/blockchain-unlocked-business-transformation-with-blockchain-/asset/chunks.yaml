- raw: 'Daryl is a close friend whom I have known for close to 20 years. Always inquisitive
    and interested in how things work from the largest of airplanes to the smallest
    of molecules and nanotechnology. With this book, Daryl has collated his knowledge
    and experience in a relatively short time, sending me notes and short abstracts,
    seldom being satisfied with the book. Unfortunately, if the book were to be released
    any later, perhaps it could be called *The History of Blockchain* instead. As
    we all know, technology moves faster than the speed of light and sometimes time
    itself. And as one of my mentors, Andreas Weigend, the former Chief Scientist
    of Amazon says, “Always be shipping”.


    Writing is hard even for authors who do it for a living, and more so for less
    frequent practitioners. In this book, Daryl shares his personal perspective on
    how blockchain might turn out in the next few years with an intention to inform
    and give the necessary tools needed to make the right decisions concerning how
    to approach blockchain technology. I believe that his insights are valuable as
    he shares his own journey in discovering the world of blockchain.


    ### **A world of change with the blockchain**


    I have always been passionate and enthused with new technology. After being in
    the technology field for most of my professional life, running a number of technology
    startups, bringing one of them public, one key question I always ask myself is:
    what is next in technology, what is a big problem to solve, and what will impact
    and change the world next? Will blockchain change the world? I believe that blockchain
    is to trust what the Internet is to information.


    Real-time changes are happening: in China, as it rolls out a nationwide central
    bank digital currency (China’s National Digital Currency, or the DCEP) and the
    Blockchain Service Network (BSN), which is said to be fully operational at the
    time of writing, in the US with Facebook’s Libra initiative having a goal of creating
    a simple global payment system and financial infrastructure to empower billions
    of people, and in Singapore, with Project Ubin, a trial into blockchain and digital
    currencies, and numerous other blockchain initiatives by the public and private
    sectors. Yet, many have no idea what blockchain is.


    The greatest sin is not being able to use and share something great. One of the
    missions of *Blockchain Unlocked* is to demystify blockchain complexities and
    unlock its key benefits. The true hope is that more readers are able to be aware,
    understand, and most importantly, implement blockchain in their everyday lives.


    A huge congratulations to Daryl for completing *Blockchain Unlocked* and focusing
    on the things that matter. To the future and beyond.


    — **Lim Hui Jie**


    Founder and Executive Director, VisionGroup Corporation


    ## **Preface**


    ### **It is as simple as A, B, C**


    Many emerging forms of technology and trends are of concern to innovators, entrepreneurs,
    and end-users around the world. However, we can expect to see critical growth
    in three broad areas, which I believe can be aptly described as the ABCs: Artificial
    Intelligence (AI), Blockchain, and Cybersecurity. In my opinion, these three technologies
    have a significant impact on all the others. I believe strongly that they are
    the foundation of growth in almost all industries going forward, which is why
    I have developed a keen interest in them.


    Above all, as individuals and as companies, we have to relearn our ABCs to prepare
    ourselves better for the future. We want to know in advance how these technologies
    and trends are going to change enterprise and society in general. This book covers
    this broad perspective that I have gleaned as an entrepreneur who deals with technology
    daily. Blockchain, in particular, can provide critical support and privacy for
    AI devices in the Internet of things (IoT), which is why I have chosen to focus
    the lens of the ABCs through B: the blockchain.


    Now let’s go through each of the elements in my ABC formation and summarise how
    each might impact the world.


    #### **A for Artificial Intelligence**


    Machines possessing cognitive capabilities akin to humans, or AI, has existed
    as an idea since the 1950s at least. However, we have always failed to actualise
    it. The beginning held great hope that the mass application of AI was within reach.
    Those who worked on it and kept close tabs believed that within a decade or two,
    machines would take over industrial processes, including aspects of planning,
    designing, and execution. The primary expectation was that, with very little human
    input, it would solve many of the problems faced by society.


    However, the dream died in the sixties and seventies as the attention of governments,
    technology companies, and universities went elsewhere. As a result, funding for
    AI studies and innovations dried up. This period has been dubbed the AI winter
    period. Then in the eighties and nineties, there was an awakening. A new generation
    of scientists returned to this technology that once upon a time inspired a lot
    of hope in academia, business, government, and society. A few governments and
    investment firms were ready to listen again and offer the necessary financial
    support. In the years since, many steps were taken. But it was not until the turn
    of the millennium that we began to see meaningful development in AI and machine
    learning.


    This time, what stood in the way was the lack of other necessary technical capabilities.
    While AI is possible in theory, it needed a high volume memory and fast speed
    data processing capacity, which were not available in the 1950s but have come
    into being gradually over the years, as dictated by Moore’s Law. Now we have the
    most appropriate technological environment to actualise AI in the most useful
    way. As a result, almost every major technology company has a robust AI project
    and numerous startups globally are working on something AI-related.


    AI stands to make life a little easier as more processes are automated and therefore
    increase the speed of delivery. The technology makes the production of goods and
    services a little cheaper and has the potential to provide an efficiency that
    often lacks in human labour. For example, a machine could perform an operation
    on a patient with far fewer chances of error as it has the advantage of processing
    more data with more accuracy within a shorter time than a human surgeon.


    Most of us already have some form of experience with an AI application. For example,
    Facebook has deployed it to perform facial recognition, while other social media
    apps like Telegram have developed the necessary capacity for third parties to
    programme and deploy chatbots to respond to queries and provide critical information
    to users. Notably, these chatbots learn on the job and become more effective with
    time. Even more disruptive AI applications are coming into the market. Practically
    every major car manufacturer is testing self-driving-car, and some countries are
    even putting the necessary legislation in place to accommodate this new reality.


    #### **B for Blockchain**'
