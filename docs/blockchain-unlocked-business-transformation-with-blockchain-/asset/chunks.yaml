- raw: 'It is also important to point out that even if where patients’ records are
    stored and accessed through highly developed systems, the interoperability hardly
    goes beyond international borders. If you leave your country for a business trip
    or vacation, your medical information will often not be available should you need
    to see a doctor while in a foreign country.


    Both intranational and international medical interoperability could be improved
    significantly through a technology that is easy to plug in and use, which is precisely
    what blockchain is attempting to offer. With the system on the cloud, a hospital
    in rural Africa may be able to plug in with simple desktops, without a need to
    build elaborate system, and still efficiently serve patients. And if you are travelling
    there, with your file on a blockchain system, the hospital does not have to have
    a direct working relationship with either your healthcare provider or a medical
    data clearinghouse back at home for a doctor to access your file and understand
    how to treat you better. All they need is the private key you have, or your next
    of kin can provide.


    Aside from the lack of the necessary logistics to support real time and unhampered
    sharing of medical records, the medical sector has always struggled with another
    critical issue: the question of who exactly owns medical records. Is it the patient
    from whom it is collected or the medical facility that does the collecting?


    In the US, the patient has a right to the data collected by a doctor or medical
    facility. But, because of logistical challenges, the patient has always failed
    to exercise full or at least a significant control over the data, including how
    it might be used for research purposes. The patient’s hands are tied and he or
    she has to trust that the data is not only well protected, but also not being
    given or sold to third parties without their knowledge. The only action they can
    take is to request a copy of the file from the healthcare provider. The blockchain
    provides the tools to make it possible that the patient has a significant say
    about the storage, usage, and sharing of their data.


    The question of who owns medical data is a critical one, especially now that personal
    medical information is turning out to be a multi-billion enterprise^([4](#ch13.xhtml#ch13fn4)).
    Major pharmaceutical, technology, and insurance companies, as well as colleges
    and government institutions, are all interested in medical data to help with their
    research and innovation. Much of what these entities are doing could end up benefiting
    humanity. It is, however, important that they access the data through proper and
    ethical means, and that includes getting express permission from the individual
    owners of the data--the patients.


    In many countries, it is still not clear who exactly owns medical data legally.
    This may be the case because there has not been an infrastructure through which
    a patient can fully exercise a right over their data. The blockchain provides
    that capability, and maybe that could provide the necessary leverage for demanding
    a change of the laws around the globe.


    ### **Bringing speed, security, privacy**


    Before we look in detail how exactly the blockchain gives the patient power over
    their data, let’s first touch on how it improves the way data is handled in terms
    of security and privacy.


    The way blockchain is going to secure data and offer users privacy in the healthcare
    sector is not too different from what we have already covered in the other use
    case chapters. The technology provides a cryptographic layer of security to the
    data. It also makes the data less susceptible to attacks on single points of failures
    as the storage of the data is spread on a peer-to-peer network. Besides, given
    that the data is immutable and any change to the records has to be confirmed by
    many independent computers on the peer-to-peer network, attacks like the ransomware
    attacks could be significantly reduced. If an attacker wants to change files,
    they have to take control of all the computers in the network.


    Some suggest that medical files do not need to be stored on the blockchain. Rather,
    the technology should only be used to provide references and indexes to the files
    to make them easier to find. The main reason cited for pushing for this kind of
    hybrid system is that blockchain is slow and has issues with scaling. While a
    valid point, it is, however, rooted in the perspective that the technology is
    not growing.


    We are already witnessing how blockchain scaling solutions could make it as fast
    and accessible as the traditional server systems. Even if hospitals may prefer
    having a local database, there are better and improved ways to store files for
    the blockchain such as through the use of the InterPlanetary File System (IPFS)
    protocol, which shards (breaks files into pieces) and stores them in numerous
    devices, increasing the security of the files.


    In terms of privacy, like with the other use cases, blockchain makes medical data
    more private through the use of cryptography. While the ledger is accessible to
    anyone, the data itself is not. You would need a private key before you can discern
    not only which file belongs to who but also the details in the file. Contrast
    this to the server systems where anyone with access to the system can see every
    detail of every profile, including hackers who can somehow manage to break into
    the system.


    ### **A novel mode of medical data ownership and usage**


    Now let’s have a look at how blockchain can change the ownership of medical data
    and how that impacts the shareability. The blockchain can turn over the ownership
    of the medical data to the patient. That is in particular possible due to three
    features of the blockchain: (1) data becomes sovereign on the blockchain, (2)
    access to the data can be limited through cryptography, and (3) the access to
    the data can be regulated through smart contract applications.


    #### **Sovereign data through cryptography and smart contracts**


    A simple data model is where a patient’s file has a public key and a corresponding
    private key. When a physician creates notes to add to the file, he or she will
    use the public key to encrypt the file. Whenever there is a need to read the files
    or add more data, the patient will use their private keys to decrypt the file
    and give access.


    A more sophisticated system would include a multi-signature (several private keys
    for a single public key). And that means besides the patient, another person can
    have a copy of the private keys and can use it to decrypt the file on behalf or
    together with the patient. The file system can also include a smart contract that
    can guide details like how long access granted to others can last and what particular
    parts of the file they can read.


    The technology is flexible enough that even in a situation where the patient is
    not supposed to see some part of the content or file, it could be made possible.
    For example, the patient might have a key that would allow their primary healthcare
    provider to use their own key to give other healthcare providers access to critical
    files inaccessible even to the patient.


    Turning the ownership of medical records to the patient has several results. For
    example, the patient gets the power to decide who can use their data for research.
    If they do not want their data to be used, they do not just say no, but they do
    not provide access. Even more, they can earn when signing access to institutions
    that want to use the data for research. The fact that the data can be only accessible
    through the permission by the patient minimises its unethical sale to third parties.
    If the law provides that the healthcare provider has some right over the data,
    any sale can be managed through a smart contract so that all parties in the transaction
    can be protected.'
