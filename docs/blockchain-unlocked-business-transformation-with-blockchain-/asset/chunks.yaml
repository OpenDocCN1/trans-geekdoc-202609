- raw: 'At the centre of the traditional banking and financial system is the fractional
    reserve banking. This system allows financial institutions to hold only a small
    percentage (10 percent in the US) of the deposits and issue the rest as credit.
    One effect is that banks somehow end up creating money. For example, if you deposit
    $100, the bank is supposed to keep $10 and give the rest out as a loan. But often,
    banks do not wait for deposits. They simply approve loans that are not backed
    by any money. Basically, they give out digits on their ledgers, creating new currency
    out of thin air.


    With currencies created on the blockchain, this is impossible. The units of value
    in circulation will always be capped by a protocol. For example, in the case of
    Bitcoin, that number is 21 million; if future currencies are going to be designed
    and created on the blockchain, the model for issuing loans has to change. This
    is already happening, as we will see later with DeFi applications. If one cryptocurrency
    becomes dominant, controlling the economy through money supply will become ineffective.


    ### **Eliminating double-spending**


    Another way the blockchain is transforming finance and banking through cryptocurrency
    is by introducing a new solution to double-spending, a problem that can occur
    when we spend money online. Physical cash is simple: if I give you a dollar bill
    or coin, I no longer have that dollar. I cannot spend it a second or third time.
    But on the Internet, things or files can be replicated to infinity. For example,
    if I send you a photo on the Internet, I remain with a copy that can be sent to
    another person. Likewise, you too can forward your copy that came from me and
    still remain with a copy to pass on if you choose.


    If money behaved online like photos, documents, or music files do, we would have
    a major problem at hand. Double spending could lead to excessive inflation. Money
    would practically cease to be money because it would lose value. Thus, for digital
    money to be viable, double-spending has to be taken care of somehow.


    Before Bitcoin was invented, the only way to take care of this problem was to
    have a trusted third-party entity or authority maintain and secure a ledger of
    transactions. Whenever someone spends a digital unit of value, an authority has
    to state by updating the ledger that the person has spent it and no longer has
    a copy that could possibly be sent to another person. Such a trusted third party
    authority has typically been a bank, financial institution, or payment service
    company.


    Having a trusted third party like a bank or a company like PayPal, Venmo, or Skrill
    maintain a ledger and prevent the double-spending problem has been sufficient
    to make digital currency functional. According to one report by the payment company
    MasterCard, many countries have already attained over 50 percent preference for
    digital payment methods, and the trend towards cashless societies is strong. Some
    countries, including Hong Kong and Sweden, are approaching a 90-percent cashless
    society. The bulk of digital payments in these societies are done using centralised
    payment methods. So it appears as though the problem of double-spending is no
    longer an issue, and nothing further needs to be done.


    However, using centralised trusted third parties to fix the problem of double-spending
    has its shortcomings. For one, it makes the cost of transactions relatively high
    as the companies have to take care of their overheads and also generate profits
    for their investors. The trusted third party also ends up becoming a single point
    of failure; an attacker has only one place to concentrate on if they want to steal
    data or compromise the system. Also, they have access to all private user data,
    and can choose to do whatever they want with it. In other words, the privacy of
    users is in the hands of the trusted third party. Last, but not least, the trusted
    third party can choose, or be forced, to censor transactions or deny some people
    services for reasons they deem appropriate.


    ### **Reducing the need for third parties**


    The blockchain makes it possible to get rid of such trusted third party entities
    as users can agree on the status of a shared ledger through consensus. Thus, if
    I send you $50, other network users can witness and record that I have spent and
    no longer own that $50, which now belongs to you. Because a community does the
    verification and confirmation, the cost is relatively lower. And because the system
    is decentralised, there are fewer single points of failure. Also, users have control
    over their own data. Because they are pseudo-anonymous on the shared ledger, no
    one can know their real-world identities except for the participants in the transaction.
    Users download the core software (or client), implementing strict rules of engagement
    that leave little room for mistakes. More importantly, it does not allow for discrimination
    and therefore, no censorship can happen.


    One more critical capacity that blockchain through cryptocurrencies offers the
    banking and finance industry is the ability to give the cash experience online.
    When you give someone physical cash, there is nothing on the bill or coin to indicate
    where it came from or what purpose it has. This makes money even more fungible.
    One coin will always be treated the same with a similar coin of the same value.
    On the other hand, if I pay you through PayPal, for example, there will always
    be a connection between me, you, and that transaction. This leads to money having
    a traceable history, which is not always a good thing as some money can be treated
    as tainted. Also, the private lives and the transaction histories of those who
    make the payment and receive the payment are accessible to others.


    Even though cryptocurrency transactions are also recorded on a ledger, everything
    is obfuscated so that it is junk data, unless the parties in the transaction choose
    to reveal themselves. In essence, this gives digital money the qualities of the
    physical cash.


    ### **Making micropayments possible internationally**


    Making micropayments possible across even international borders is another way
    blockchain, and in particular, cryptocurrency, is transforming banking and finance.
    Micropayments may seem unnecessary, especially considering the long distance,
    until you begin to look at the number of online services and products that could
    benefit from the consumer’s ability to pay small amounts of money such as pennies
    at a time. With most traditional financial services, you cannot send values below
    specific limits because the cost would exceed the value. PayPal, for example,
    sets the minimum transaction at $5. Xoom has it at $10 and Transfast, at $50.
    Instead, cryptocurrency makes it possible that even cents can be sent across the
    world with relatively low or even no cost. That opens up the possibility of businesses
    accepting micropayments for particular services. For example, instead of bulky
    monthly subscriptions, online magazines can allow the reader to pay for a single
    article using a micropayment solution.


    Transactions can be completed at even greater speeds. While the Internet has made
    the flow of information to happen at the speed of light, it still takes days and
    even weeks to move money from one corner of the globe to another even when the
    money is in the digital form. Through cryptocurrencies like Bitcoin, the blockchain
    has proved that money can move around the world at the same speed as information.


    It is essential to point out though that the movement of cryptocurrencies has
    been slowed down due to other reasons. Over time the experience of sending cryptocurrency
    is becoming almost the same as sending fiat. This is less to do with technological
    capacity and more to do with regulatory requirements. It should not be confused
    with the ability to process a high number of transactions, which has been Bitcoin’s
    scalability journey.'
