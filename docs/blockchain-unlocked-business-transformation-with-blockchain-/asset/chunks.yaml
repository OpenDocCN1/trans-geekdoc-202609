  trans: "\n![image](img/cover.jpg)\n\n# 《区块链解码》赞誉\n\n这本书是领导者不仅理解而且应用区块链技术所缺失的关键一环。书中充满了准确且与广泛行业相关的实用见解。\n\
    \n— **Vincent Choy**\n\n卓越区块链中心暨教育中心主席\n\n从完全不懂区块链的新手，到渴望为企业实施关键转型的人士，这绝对是一本必读之作。它以非常通俗易懂的方式涵盖了区块链的“是什么”、“为什么”以及“怎么做”。案例研究为技术颠覆以及区块链如何缓解并改善系统提供了极佳的洞见。对于寻求业务转型的人来说，这本书就是起点。\n\
    \n— **Irene Wee**\n\n成人教育学院（SUSS）资深成人教育工作者\n\n对于任何热门话题，所需的不是进一步的炒作或盲目热情，而是对其本质的清晰认知，以及普通人如何使用它。区块链是能够定义我们未来的技术之一。理解它是我们数字素养的一部分。这本书是一份优秀的路线图，恰好提供了这些。\n\
    \n— **Li Xin**\n\n财新传媒总经理\n\nDaryl 在书中分享的见解将为寻求采用区块链的企业提供清晰的指引。对我来说，这本书是快速了解区块链可能为企业带来的价值、且以最轻松方式实现的绝佳途径。\n\
    \n— **W.K. Lim**\n\n新加坡航空区域副总裁（东南亚）\n\n作为一名在行业深耕多年的资深人士，我感觉这项技术将把我们最好的水平提升到一个全新的高度。《区块链解码》在区块链应用的描述和分析上绝对分量十足。真心是大多数人的必读之作。\n\
    \n— **Robert Chua**\n\n美国银行前交易员\n\n对于希望为自己和组织的未来做好准备的领导者来说，这是一本明智之作。本书将区块链技术的复杂性化繁为简，使读者易于消化吸收，并能立即应用于当下。\n\
    \n— **Winston Ngan**\n\n全球专业咨询公司前合伙人\n\n这本书写得非常好。我一开始读就知道，这正是我一直在寻找的东西。我一直看好区块链技术的潜力，而阅读这本书清楚地展示了它能为企业带来的巨大价值。\n\
    \n— **Christopher Neo**\n\nCFA，私募股权公司董事\n\n技术采纳在当今的每个组织中都至关重要。Daryl 的这本书在战略层面上吸引并激励着领导者。这是一本不容错过的好书！\n\
    \n— **Dr. Shravan Verma (MD)**\n\nSpeedoc 创始人兼首席执行官\n\n《区块链解码》让我能轻松地形象化并理解区块链在商业应用中的核心要素。这是一本包含丰富信息的优秀书籍。感谢您将其编撰出版。\n\
    \n— **Nyoman Santiawan**\n\nRamayana Group 副主席\n\n《区块链解码》帮助我理解了区块链的应用及其业务转型潜力。本书讲解得非常清晰易懂。\n\
    \n— **Marie Mak**\n\nGreat Eastern Life 董事（金融服务）\n\n![image](img/title-image.jpg)\n\
