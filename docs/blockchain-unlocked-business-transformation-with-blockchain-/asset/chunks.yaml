- raw: "By embracing the technology, banks and other financial institutions hope to\
    \ use it in different ways. At the top of the list is to increase collaborations\
    \ among themselves and streamline interbank transactions. The technology has the\
    \ potential to reduce costs, shorten waiting time for customers, and minimise\
    \ fraud through more robust Know Your Customer (KYC) mechanisms.\n\nIt is almost\
    \ naive to think that the blockchain technology will lead to the demise of banks.\
    \ It is not possible, if we consider the role of regulation in how technology\
    \ and businesses evolve. Instead, we should expect a new reality in which banks\
    \ and other financial institutions use technology to strengthen their systems.\
    \ And we should also expect a future where end users have more choice, and perhaps\
    \ stand to get a better user experience.\n\n^([1](#ch09.xhtml#ich09fn1)) “Banks\
    \ Close 2,900 Branches in Three Years, Says Which?” BBC News, BBC, 15 June 2018,\
    \ [www.bbc.com/news/business-44483304](http://www.bbc.com/news/business-44483304).\n\
    \n^([2](#ch09.xhtml#ich09fn2)) Coelho-Prabhu, Sid. “A Beginner’s Guide to Decentralized\
    \ Finance (DeFi).” Medium, The Coinbase Blog, 6 Jan. 2020, [blog.coinbase.com/a-beginners-guide-to-decentralized-finance-defi-574c68ff43c4](http://blog.coinbase.com/a-beginners-guide-to-decentralized-finance-defi-574c68ff43c4).\n\
    \n^([3](#ch09.xhtml#ich09fn3)) Cachin, Christian. “Architecture of the Hyperledger\
    \ Blockchain Fabric.” Zurich.ibm.com, IBM Research - Zurich, July 2016, [www.zurich.ibm.com/dccl/papers/cachin\\\
    _dccl.pdf](http://www.zurich.ibm.com/dccl/papers/cachin_dccl.pdf).\n\n| ![image](images/ch-10.jpg)\
    \ || **Use Case 2:  \n\nSupply Chains** |\n\n| --- | --- |\n\nThe blockchain technology\
    \ offers four primary advantages to supply chains: (1) improved efficiency and\
    \ reduced operations costs, (2) simplified compliance and quality certifications,\
    \ (3) reliable provenance for end consumers, (4) and tools for making trade finance\
    \ faster, secure, and cheaper.\n\nHowever, first, let’s understand what a supply\
    \ chain is and how it affects enterprise, consumerism, and even regulatory compliance.\
    \ It is ironic that the majority of people are unaware of the complexity and critical\
    \ role of supply chains, and how, as the foundation of enterprise, they affect\
    \ almost every aspect of our lives. They literally facilitate the world’s functions;\
    \ without them, things grind to a halt, which can have very adverse effects on\
    \ society. People could go without basic supplies such as food, water, transport,\
    \ electricity, medication, and almost everything else that makes life comfortable,\
    \ or even possible.\n\nAt the time of writing (in 2020), we are witnessing this\
    \ most vividly with the Covid-19 pandemic. Arguably, the core of issues from the\
    \ pandemic is the freeze of logistics. If planes are not flying, goods are not\
    \ moving. Blockchain cannot help with that, but it can impart transparency to\
    \ the “queues” for logistics, which will serve as a form of accountability to\
    \ the consumer.\n\nSupply chains influence how much we spend on goods and services.\
    \ According to the Council of Supply Chain Management Professionals (CSCMP), a\
    \ global body of domain experts, up to 60 percent of the products’ cost comes\
    \ from the nature of the supply chain they use. Efficient supply chains result\
    \ in less costly goods and services, while less efficient ones often translate\
    \ to consumers having to spend more on their supplies. This is a primary reason\
    \ to improve the efficiency of supply chains. In addition to a better user experience\
    \ for everyone, we also get to make things cheaper in the long term. Using blockchain\
    \ technology is one way to do that^([1](#ch10.xhtml#ch10fn1)).\n\n### **What exactly\
    \ is a supply chain?**\n\nA supply chain is the interlinked activities, processes,\
    \ and transactions that must occur for a product to get to the end consumer. Or\
    \ everything between the point of raw material extraction and the delivery of\
    \ the final product to the end consumer.\n\nSupply chains exist in three primary\
    \ sections or episodes: there is the supply chain (1) before manufacturing, (2)\
    \ during manufacturing, and (3) after manufacturing up until the final product\
    \ reaches the end consumer.\n\nThe supply chain before manufacturing would typically\
    \ be activities and processes like farming, animal husbandry, and mining. It is\
    \ important to point out that often where one supply chain starts is where another\
    \ ends. Using the example of bread, it may seem that the supply chain starts at\
    \ the farm where the wheat is grown. However, the wheat farm is also a consumer\
    \ in itself, and thus have other supply chains ending at it. For example, the\
    \ farm has to acquire machinery, seeds, fertiliser, herbicides, pesticides and\
    \ other inputs necessary for crop (wheat) farming.\n\nThe starting point of a\
    \ supply chain is often not a single point but multiple. For example, the bread\
    \ supply chain does not begin at the wheat farm alone. It also begins at the dairy\
    \ and chicken farms, at the sugarcane plantation, and perhaps also at the laboratory\
    \ for food colouring. These “other” starting points of a supply chain provide\
    \ critical ingredients for baking bread. We should not forget the supply chain\
    \ of the machines and tools used for transporting and preparing the ingredients\
    \ either, as well as the supply chain for the bread packaging.\n\nAt the manufacturing\
    \ stage, the raw materials are turned into the final product. Using the example\
    \ of wheat again, wheat and other ingredients are turned into bread. The entire\
    \ process might happen at the same place or be carried out in smaller tasks at\
    \ different locations or even by different businesses. For example, weighing,\
    \ measurement, and mixing of ingredients for bread making can happen in one location\
    \ while the actual baking is in another.\n\nFinally, the after manufacturing supply\
    \ chain involves all the activities and processes to bring the finished product\
    \ to the consumers. Bread is transported from the bakery to the warehouse and\
    \ then to the retail shop near the consumer. This includes marketing to create\
    \ awareness for the product.\n\nActivities between these three sections such as\
    \ transport and warehousing are also part of the larger supply chain. So are other\
    \ things like labour, insurance, electricity, security, and customer support.\
    \ Furthermore, customers may be unhappy with the goods delivered. It may be damaged\
    \ at the factory or while in transit, or not what they ordered and no one notices\
    \ until it reaches the end customer. A good supply chain has to create a reliable\
    \ channel through which the consumer can return the product to the retailer, and\
    \ even back to the manufacturer.\n\nFrom a business perspective, a supply chain\
    \ is the channels and means of bringing in raw materials or stock, the process\
    \ of value addition, and the tasks involved to get the final product to the customer.\
    \ For a business to be successful, it has to manage its own supply chain effectively.\
    \ This includes sourcing the best raw material or stock at the most competitive\
    \ prices, hiring the most appropriate talent, and getting the right equipment\
    \ and services. It also includes setting up the best standards and quality assurance\
    \ processes. The supply chain also creates a working sales funnel, which includes\
    \ the methods of delivering the products to the end consumer. Last but not least,\
    \ a great supply chain system should help a business plan appropriately. For example,\
    \ by determining when to buy new supplies which will not result in idle stock\
    \ that accumulate storage costs.\n\n### **How blockchain is changing the supply\
    \ chain**\n\nAs you can see, supply chains are very complex, which creates a real\
    \ challenge to make them work for a business or a consumer. There are so many\
    \ decisions to consider. In fact, a product can go through an infinite number\
    \ of possible supply, which is not a good thing."
