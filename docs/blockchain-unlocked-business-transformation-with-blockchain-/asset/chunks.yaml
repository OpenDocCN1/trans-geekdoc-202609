    blockchain, especially with regard to permissions. Between public and private
    blockchains, three primary areas of differences exist. These are (1) access to
    read and edit data on the shared ledger, (2) how the core software is developed
    and maintained, and (3) how much the system relies on game theory to function
    effectively.


