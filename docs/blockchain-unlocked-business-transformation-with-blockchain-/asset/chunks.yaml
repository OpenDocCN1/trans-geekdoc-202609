    # 区块链对公共管理的第二重影响：改变政府基本理念


    在探讨区块链如何改进现有政府系统和流程后，让我们转换视角，审视该技术对公共管理或治理的第二重影响：改变政府基本理念的可能性。


    区块链不仅能改进政府流程和系统，更有潜力开创全新的政府形式。它可能终结我们所知的代议制政府，取而代之的是公民拥有更直接参与权、特别是对日常运作拥有发言权的模式。毕竟，立法机构的基本理念在于：并非所有公民都能聚集在一起商议影响其生活的议题。过去这确实不可能，因为缺乏支持此类会议的后勤条件。因此，我们从中选出代表在政府决策中代表我们。


    然而，时代已变，技术持续将几年前看似不可能的事变为现实。若你有机会穿越回20世纪初，告诉当时的人们：不到100年就能实现视频会议等功能，他们大概会认为你在说魔法而非现实。


    区块链为选举立法和行政机构、并寄望其做正确之事提供了新选项。它提供了一种机制，让公民作为集体承担日常政府职能的大部分责任，并直接履行其中至少一部分。这在十年前还难以想象。乍看之下这似乎不切实际或荒谬，但深入探究区块链的能力及其在治理结构中已获测试的应用后，直接政府的概念并不遥远。


    ## DAO 模型


    2016年4月，德国区块链初创公司 Slock.it 宣布了一个名为“去中心化自治组织”（DAO）的新项目。这是一个没有领导架构或员工团队的投资组织。取而代之的是，DAO
    通过以太坊区块链上的智能合约系统或协议进行管理。所有决策由成员通过直接投票达成的共识机制定^([9](#ch11.xhtml#ch11fn9))。简单来说，DAO
    是一个有股东但无董事会、首席执行官或任何其他员工的公司。


    这一理念极具吸引力、激动人心且广受欢迎，在28天的融资期内筹集了超过1.5亿美元，投资者由此成为股东。通过智能合约协议或系统，股东将对组织承担的项目进行投票，并聘请服务提供商代表其行事。股东可提出计划及所需预算，再通过投票说服他人批准。服务提供商也可向
    DAO 提出商业构想，并试图说服股东其能交付有利于组织的成果。成员批准项目后，智能合约会将所需资金锁定在托管账户中。服务提供商随即开展工作，完成后，指导执行的智能合约会从托管账户释放付款。


    然而，DAO 并未完全落地实施。2016年6月，即启动两个月后，一名黑客发现其主智能合约代码中的漏洞并试图利用它从 DAO 钱包窃取约5000万美元。这引发了加密领域最重大的硬分叉之一。由于支付必须在以太坊区块链上完成，社区面临回滚交易、拒绝黑客获取
    DAO 资金的抉择。社区对此分歧巨大：有人支持回滚交易以阻止攻击者获取资金，也有人认为这会危及区块链的不可篡改承诺，5000万美元不足以成为理由。


    因无法达成共识，以太坊网络不得不分裂为两条独立区块链网络。支持交易回滚者保留以太坊（ETH）名称，反对者采用新名称以太坊经典（ETC）。黑客最终在以太坊经典代币中套现部分资金。不久后，DAO
    关闭并退还投资者资金。


    尽管如此，DAO 理念并未消亡，此后还有多个项目采用这一治理模式。最成功的项目之一是 DASH 区块链网络，成员挑选可为网络做出的贡献并说服社区为其提供资金。若社区满意，即批准预算存入托管账户，提议者开始工作，资金随里程碑达成而释放。另一个采用
    DAO 模型的项目是 MakerDAO。


    同样，一种形式的 DAO 可取代政府，让所有公民成为股东。投票权可通过向国库钱包缴税获得。承包商和公民均可提出必要的公共项目，经公民批准投票并选出承包商。中标承包商的预算存入托管账户，工作完成后根据指导项目执行的智能合约获得付款。值得注意的是，审查、讨论和投票均可通过门户或移动应用进行，方便公民随时随地参与。


    当然，我们不能说已准备好将整个政府转为 DAO。但部分职能转型是可能的，这或能改善服务交付、提高透明度、减少腐败，并增强公众参与。


    ## 使用区块链面临的挑战


    现在，让我们关注区块链技术在政府采纳前必须克服的挑战，无论是用于改进现有流程和系统，还是创建全新治理结构。


    区块链虽有价值，并不意味着会被自动接纳和使用。即使在公共服务交付方面拥有诸多优势，因难以克服的挑战，我们可能永远无法大规模见证其应用。


    区块链面临的首要挑战是与现有法律的兼容性。区块链上的大多数流程要被接受，必须在法律上得到认可。例如，通过智能合约执行的协议只有在法律承认时才具法律约束力，否则法院随时可推翻智能合约的执行结果。因此，法律必须修改，才能充分发挥应用潜力。

    '
  trans: '


    # The Second Impact of Blockchain on Public Administration: Changing the Basic
    Premise of Government


    After discussing how blockchain can improve existing government systems and processes,
    let us shift perspective and examine the technology''s second impact on public
    administration or governance: the possibility of changing the basic premise of
    government.


    Blockchain can not only improve government processes and systems but also has
    the potential to pioneer entirely new forms of government. It may end representative
    government as we know it, replacing it with a model where citizens have more direct
    participation rights, particularly a say in day-to-day operations. After all,
    the basic premise of a legislature is that not all citizens can gather to deliberate
    on issues affecting their lives. In the past, this was indeed impossible because
    the logistical conditions to support such assemblies were lacking. Therefore,
    we elect representatives from among ourselves to represent us in government decisions.


    However, times have changed, and technology continues to turn what seemed impossible
    a few years ago into reality. If you had the chance to travel back to the early
    20th century and tell people then that video conferencing and similar functions
    would be realized in less than 100 years, they would likely have thought you were
    describing magic, not reality.


    Blockchain offers a new option to electing legislative and executive bodies and
    hoping they do the right thing. It provides a mechanism for citizens, as a collective,
    to assume responsibility for most day-to-day government functions and directly
    perform at least a portion of them. This was unimaginable ten years ago. At first
    glance, this may seem impractical or absurd, but after delving into blockchain''s
    capabilities and its already tested applications in governance structures, the
    concept of direct government is not far-fetched.


    ## The DAO Model


    In April 2016, German blockchain startup Slock.it announced a new project called
    the "Decentralized Autonomous Organization" (DAO). This was an investment organization
    with no leadership structure or team of employees. Instead, the DAO was managed
    through a system of smart contracts, or protocols, on the Ethereum blockchain.
    All decisions were made by a consensus mechanism achieved through direct voting
    by members^(9). Simply put, a DAO is a company with shareholders but no board
    of directors, CEO, or any other employees.


    This idea was highly attractive, exciting, and popular, raising over $150 million
    during a 28-day funding period, with investors thereby becoming shareholders.
    Through the smart contract protocol or system, shareholders would vote on projects
    undertaken by the organization and hire service providers to act on their behalf.
    Shareholders could propose plans and required budgets, then persuade others to
    approve them through voting. Service providers could also pitch business ideas
    to the DAO and attempt to convince shareholders they could deliver results beneficial
    to the organization. Once members approved a project, the smart contract would
    lock the required funds in an escrow account. The service provider would then
    commence work; upon completion, the smart contract guiding execution would release
    payment from the escrow account.


    However, the DAO was never fully implemented. In June 2016, just two months after
    launch, a hacker discovered a vulnerability in the code of its main smart contract
    and attempted to exploit it to steal approximately $50 million from the DAO wallet.
    This triggered one of the most significant hard forks in the crypto space. Since
    payments had to be completed on the Ethereum blockchain, the community faced the
    choice of rolling back transactions to deny the hacker access to the DAO funds.
    The community was deeply divided: some supported rolling back transactions to
    stop the attacker from obtaining funds, while others argued this would jeopardize
    the blockchain''s promise of immutability, and that $50 million was not a sufficient
    reason.


    Unable to reach consensus, the Ethereum network was forced to split into two independent
    blockchain networks. Those supporting the transaction rollback retained the name
    Ethereum (ETH), while opponents adopted the new name Ethereum Classic (ETC). The
    hacker eventually cashed out a portion of the funds in Ethereum Classic tokens.
    Shortly after, the DAO shut down and returned funds to investors.


    Nevertheless, the DAO concept did not die; several subsequent projects have adopted
    this governance model. One of the most successful projects is the DASH blockchain
    network, where members select contributions they can make to the network and persuade
    the community to fund them. If the community is satisfied, it approves the budget
    into an escrow account, the proposer begins work, and funds are released as milestones
    are reached. Another project adopting the DAO model is MakerDAO.


    Similarly, a form of DAO could replace government, making all citizens shareholders.
    Voting rights could be obtained by paying taxes into a treasury wallet. Both contractors
    and citizens could propose necessary public projects, which would be approved
    by citizen vote, and contractors selected. The winning contractor''s budget would
    be placed in an escrow account, and payment would be made according to the smart
    contract guiding project execution upon completion of work. Notably, review, discussion,
    and voting can all be conducted via a portal or mobile app, allowing citizens
    to participate anytime, anywhere.


    Of course, we cannot say we are ready to convert the entire government into a
    DAO. But transforming partial functions is possible, and this could improve service
    delivery, increase transparency, reduce corruption, and enhance public participation.


    ## Challenges Facing the Use of Blockchain


    Now, let us focus on the challenges blockchain technology must overcome before
    government adoption, whether for improving existing processes and systems or creating
    entirely new governance structures.


    The fact that blockchain has value does not mean it will be automatically accepted
    and used. Even with numerous advantages in public service delivery, we may never
    witness its large-scale application due to insurmountable challenges.


    The primary challenge facing blockchain is compatibility with existing laws. For
    most processes on the blockchain to be accepted, they must be legally recognized.
    For example, agreements executed via smart contracts are only legally binding
    if the law recognizes them; otherwise, courts can overturn the execution results
    of smart contracts at any time. Therefore, laws must be amended to fully unleash
    the potential of applications.


    '
