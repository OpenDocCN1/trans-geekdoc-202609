    to attack. They can only communicate by sending a messenger back and forth the
    divisions without any other way to communicate. It is ancient times after all.
    For example, General A will send the message, “Hey General B, we are going to
    attack on Wednesday. Will you attack with us?”. The messenger then delivers the
    message to General B, who in turn responds, “We can’t do Wednesday—ladies night.
    How about Thursday? If we attack on Thursday, will you attack with us?”. The messenger
    delivers the message back to General A, and so forth.


    However, there is a twist: the messenger could be hijacked and caught while delivering
    the message. Instead, a `#fakenews` messenger could intentionally send a wrong
    message to deceive the other general to attack the city on the wrong day. There
    is no way to check if the message is real. How do they create a “trustless” system
    that ensures victory in when they attack?


    This is the Byzantine Generals’ Problem.


    ### What is blockchain?


    A blockchain is a virtual machine that runs on a peer-to-peer network of computers.
    It can host and run almost all kinds of applications. Payment systems, cloud storage,
    smart contracts, land registries, supply chain management systems, websites—you
    name it. Any application that can be launched on a centralised server can be launched
    on a blockchain.


    Blockchain can also host and run applications that cannot work on centralised
    server systems. We already have all these applications running on the legacy Internet
    (i.e., the Internet pre-blockchain). What better than to have them on a virtual
    machine running on top of a peer-to-peer network?


    That is a fundamental question. It is at the heart of why blockchain has a future.
    But before we answer this, let’s get a big picture of how blockchain functions
    and why it is a virtual machine.


    Computer networks have been around since the 1960s. (By networks, I mean several
    computers having channels for communicating with one another.) The earliest ones
    were centralised^([2](#ch01.xhtml#ch01fn2)), which meant computers formed had
    to communicate with one another through a central server. The server was a computer
    with the capability to facilitate communication between computers. Over the years,
    peer-to-peer networks developed. This is where one computer could communicate
    with another without having to go through a central server. Indeed, the Internet
    itself is a form of peer-to-peer networks. But peer-to-peer networks in the strict
    use of the word came into being in the late 1990s. It was first experienced in
    `Napster`, a network one joined by installing a particular software to share music
    with others^([3](#ch01.xhtml#ch01fn3)).


    But even with that development, some things could work without a central server.
    In particular, a payment system. For a payment system to work, a central server
    had to exist to host and maintain a transaction ledger. People on the network
    had to trust that the record was accurate. In particular, people in charge of
    the server had to be trusted that they could not falsify the records. But still,
    servers were hacked and data stolen or records arbitrarily changed.


    #### Permissioned vs. permissionless


    The implementation of the blockchain can be categorised as two types: permissioned
    (only a select few can read/write) or permissionless (anyone can read/write).
    These blockchains may be expanded into three subcategories:


    1. Public blockchains

    2. Consortium blockchains

    3. Private blockchains


    While public and consortium blockchains may be centralised or decentralised (decisions
    may be made either by a central body or a selected multiple group of people or
    by anyone), private blockchains are always centralised (decisions are made by
    a central body).


    Whether the blockchain decision-making is centralised or decentralised is distinct
    from how its data is distributed. In the latter, or a distributed ledger, data
    or information may be stored at multiple points with possibly multiple groups.
    However, in the former, the decision-making and writing of a new block or voting
    for a change in the base protocol of the blockchain may centralised or decentralised.


    The founding fathers, who popularised the blockchain through `Bitcoin`, intended
    for the initial use cases to be permissionless and decentralised, i.e., having
    a decentralised model, in which everyone can participate, contribute, and collaborate
    together—very much reflected in the characteristics of `Bitcoin`.

    '
  trans: '

    最后，结语章节展望未来，并试图在撰写本书之时依据已发生的事件预测未来趋势。它试图解释紧随 2017/2018 年繁荣之后的区块链（加密货币）寒冬。本章试图回答这样一个问题：这真的是一个寒冬，之后将迎来春天然后是夏天？还是说这是一个行业应当接受的长期现实？在每一个探讨区块链在特定行业应用的章节中，本书也探讨了阻碍实施的挑战。


    ![image](img/pt-1.jpg)


    ## 核心要点


    | ![image](img/ch-1.jpg) || 区块链技术将如何改变商业 |


    | --- | --- |


    区块链的首个应用 `Bitcoin` 于 2009 年初推出。这是一项相对较新的技术。但许多人同意，它将显著改变社会，特别是商业版图。在德勤 2019 年全球区块链调查中，全球
    53% 的商业领袖表示区块链是其组织的关键优先事项^(1)。这比上一年增长了 10%。


    如果你与区块链领域的人交谈，许多人会迅速将区块链的演变与互联网相比较。许多人相信，最终区块链对社会的影响将与互联网相同。这很可能是夸大其词。然而，无论你深入哪个行业，都有人在讨论如何利用这项技术，这足以成为你寻求理解它的充分理由。网上有无数的文章、视频，甚至演示文稿试图描述区块链技术。关于区块链的书单也在不断增长。然而，考虑到这是一项全新的技术，许多人仍然无法理解它，这是可以理解的。往往阻碍理解这项技术的是“知识的诅咒”；许多试图解释它的人假设你拥有与他们相同的信息背景和语境。类比仍然是解释该技术的最佳选择，即使许多类比最终被证明与实际情况相去甚远。


    我从 2014 年初就进入了这个领域——在区块链时间线上这是很久以前的事了。我关注过许多关于这项技术的讨论。更重要的是，我多年来一直在观察该领域的趋势。慢慢地，我倾向于一种我认为最能解释该技术的类比。


    ### 区块链与拜占庭将军问题


    拜占庭将军问题源于计算机科学对一种情境的描述：参与各方必须就单一策略达成一致以避免失败。然而，一些参与方是腐败的，散布虚假信息，且不可靠。


    让我们深入这个故事。


    一支完整的军队分为两个师，包围了一座城市，但面临一个复杂的后勤问题。两个师分别驻扎在敌城的两侧（东和西）。这座城市足以抵御一个师的进攻，但若两个师同时进攻则会陷落。因此，两个师需要在完全相同的时间进攻。如果进攻时间不一致，他们将会失败。


    因此，每个师的将军需要就进攻的确切时刻达成一致。他们只能通过派信使在两个师之间往返来通信，没有其他通信方式。毕竟那是远古时代。例如，A 将军会发送信息：“嘿，B
    将军，我们打算周三进攻。你们会跟我们一起进攻吗？”。信使将信息送达给 B 将军，后者回复：“周三不行——女士之夜。周四怎么样？如果我们周四进攻，你们会跟我们一起进攻吗？”。信使将信息送回给
    A 将军，以此类推。


    然而，这里有个转折：信使在传递信息时可能被劫持和抓捕。取而代之的是，一个 `#fakenews` 信使可能会故意发送错误信息，欺骗另一位将军在错误的日子进攻城市。无法核实信息是否真实。他们如何创建一个“无需信任”的系统，以确保进攻时取得胜利？


    这就是拜占庭将军问题。


    ### 什么是区块链？


    区块链是一台运行在计算机点对点网络上的虚拟机。它可以托管并运行几乎所有类型的应用程序。支付系统、云存储、智能合约、土地注册、供应链管理系统、网站——你想得到的都可以。任何可以在中心化服务器上启动的应用程序，都可以在区块链上启动。


    区块链还可以托管并运行那些无法在中心化服务器系统上工作的应用程序。我们已经在传统互联网（即区块链出现前的互联网）上运行了所有这些应用程序。有什么比在运行于点对点网络之上的虚拟机上拥有它们更好的呢？


    这是一个根本性的问题。它触及了区块链拥有未来的核心原因。但在回答这个问题之前，让我们先从宏观上了解区块链是如何运作的，以及为什么它是一台虚拟机。


    计算机网络自 1960 年代以来就已存在。（这里的网络是指多台计算机拥有相互通信的通道。）最早的网络是中心化的^(2)，这意味着计算机必须通过中心服务器相互通信。服务器是一台具备促进计算机间通信能力的计算机。多年来，点对点网络得到了发展。这是指一台计算机可以直接与另一台计算机通信，而无需通过中心服务器。事实上，互联网本身就是一种点对点网络的形式。但严格意义上的点对点网络出现于
    1990 年代末。它首次体现在 `Napster` 中，用户通过安装特定软件加入该网络与他人共享音乐^(3)。


    但即使有了这一发展，某些事物仍然离不开中心服务器。特别是支付系统。为了让支付系统运作，必须存在一个中心服务器来托管和维护交易账本。网络上的人们必须相信记录是准确的。特别是，负责服务器的人必须值得信任，不会篡改记录。但即便如此，服务器仍会被黑客攻击，数据被窃取或记录被任意篡改。


    #### 有许可 vs. 无许可


    区块链的实现可分为两类：有许可（仅少数人可读/写）或无许可（任何人可读/写）。这些区块链可进一步细分为三个子类：


    1. 公有链

    2. 联盟链

    3. 私有链


    虽然公有链和联盟链可能是中心化或去中心化的（决策可能由中央机构、选定的多人群体或任何人做出），但私有链始终是中心化的（决策由中央机构做出）。


    区块链决策是中心化还是去中心化，这与其数据如何分布是截然不同的。在后者（即分布式账本）中，数据或信息可能存储在多个节点，并可能由多个群体管理。然而，在前者中，区块链的决策制定、新区块的写入或对基础协议变更的投票，可能是中心化或去中心化的。


    推广区块链的奠基者们，通过 `Bitcoin` 将最初的用例设定为无许可且去中心化的，即采用一种去中心化模型，其中每个人都可以参与、贡献和协作——这在 `Bitcoin`
    的特性中得到了充分体现。


    '
