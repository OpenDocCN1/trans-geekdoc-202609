- raw: "Another way the blockchain technology can help the energy sector is by providing\
    \ better tools for managing carbon credits, which is a concept that is helping\
    \ combat the problem of greenhouse emission. The carbon credit system allows companies\
    \ and countries to emit greenhouse gases up to a specific limit. In the event\
    \ they emit more than their limit, they are fined. However, if they emit less\
    \ than the amount they are allowed to, they can sell the remaining credit to another\
    \ company or country. The goal is to incentivise companies to cut on their emissions\
    \ through the threat of fines as well as reward in the form of carbon credit they\
    \ can sell to others^([6](#ch15.xhtml#ch15fn6)). Curently, tokens are a form of\
    \ currency that can be traded on an exchange. For example, if emissions can be\
    \ recorded accurately in the form of a token, (though some sort of methodology)\
    \ it can be traded for cash or its equivalent in carbon credits.\n\nSince carbon\
    \ credits are a form of assets, they can be tokenised on the blockchain for easy\
    \ tracking and trading. That can solve the problem of transparency in terms of\
    \ valuation and pricing. A few startups are building blockchain solutions for\
    \ managing the carbon credits market. The list includes Aircarbon, a Singapore\
    \ based startup that announced partnership with the International Chamber of Commerce\
    \ (ICC) and Perlin, blockchain firm in the 2019 United Nations Conference on Climate\
    \ Change (COP 25) in Madrid. Aircarbon is experimenting with a market solution\
    \ for carbon credit trading and funding.\n\n#### **The backend technology for\
    \ the transition to green energy**\n\nFinally, blockchain could be the component\
    \ that has been missing to enable society to wean itself off the dirty, environmentally\
    \ fossil fuel for cleaner sources of energy such as solar and wind. Managing the\
    \ carbon credit system and supporting the emergence of decentralised grids are\
    \ not the only solution the technology offers in this regard. Indeed, the majority\
    \ of blockchain startups that target to disrupt the energy sector have leaned\
    \ towards supporting green energy sources. The technology is providing a ready\
    \ backend for these startups and reducing the cost of entry. Also, the technology\
    \ provides means through which different players in the industry can seamlessly\
    \ transact and interoperate.\n\n### **Challenges in using blockchain**\n\nNow,\
    \ what are the challenges the energy sector has to overcome to leverage blockchain?\n\
    \nThe challenges of adopting blockchain in the energy are not very different from\
    \ the ones that the other use cases face. The most immediate include the need\
    \ for a change in the regulatory environment to support the new technical capacities\
    \ that the technology makes possible. For example, in most countries, the utility\
    \ company is a public monopoly, which has always been the case due to the current\
    \ model of energy distribution that is possible so far. This model of energy production\
    \ and distribution has made it hard for the private sector to offer alternatives.\
    \ Therefore, there has never been a need to change laws to embrace other models.\n\
    \nAside from changing the law to embrace the new realities, there is also the\
    \ need to build the necessary technical capacity to develop blockchain infrastructure\
    \ and protocols that meet the specific needs of the industry. As a new technology,\
    \ there is not enough skill and talent to spearhead the change around the globe.\
    \ It will change as demand grows. As the world is so connected today, I expect\
    \ domain knowledge to grow together with demand as programmers find it more lucrative\
    \ to help businesses willing to adopt blockchain to make that transition.\n\n\
    Of course, there is a need to change the mindset of the regulators, consumers,\
    \ suppliers, and producers of energy. Opposition should be expected from those\
    \ who benefit from the current systems.\n\nRegardless, as we can see, numerous\
    \ ways exist for the energy sector to benefit from blockchain technology.\n\n\
    ^([1](#ch15.xhtml#ich15fn1)) Holthaus, Eric. “Bitcoin Mining Has a Massive Carbon\
    \ Footprint.” Wired, Conde Nast, 1 Feb. 2018, [www.wired.com/story/bitcoin-mining-guzzlesenergyand-its-carbon-footprint-just-keeps-growing](http://www.wired.com/story/bitcoin-mining-guzzlesenergyand-its-carbon-footprint-just-keeps-growing).\n\
    \n^([2](#ch15.xhtml#ich15fn2)) Lou, Michelle. “Bitcoin Leaves a Carbon Footprint\
    \ as Large as Las Vegas, Study Finds.” CNN, 14 June 2019, [edition.cnn.com/2019/06/14/tech/bitcoin-carbon-footprint-trnd/index.html](http://edition.cnn.com/2019/06/14/tech/bitcoin-carbon-footprint-trnd/index.html).\n\
    \n^([3](#ch15.xhtml#ich15fn3)) Njoroge, Evelyn. “KPLC Rolls out Prepaid Power.”\
    \ Capital Business, 6 May 2009, [www.capitalfm.co.ke/business/2009/05/kplc-rolls-outprepaid-power/](http://www.capitalfm.co.ke/business/2009/05/kplc-rolls-outprepaid-power/).\n\
    \n^([4](#ch15.xhtml#ich15fn4)) Wako, Amina. “Multi-Million Shillings Scandal That\
    \ Almost Crippled Kenya Power Company.” Nairobi News, Dec. 2019, [nairobinews.nation.co.ke/editors-picks/multi-million-shillings-scandal-that-almost-crippled-kenya-power-company](http://nairobinews.nation.co.ke/editors-picks/multi-million-shillings-scandal-that-almost-crippled-kenya-power-company).\n\
    \n^([5](#ch15.xhtml#ich15fn5)) “Natixis, IBM and Trafigura Introduce First-Ever\
    \ Blockchain Solution for U.S. Crude Oil Market.” IBM, 28 Mar. 2017, [www-03.ibm.com/press/us/en/pressrelease/51951.wss](http://www-03.ibm.com/press/us/en/pressrelease/51951.wss).\n\
    \n^([6](#ch15.xhtml#ich15fn6)) Kenton, Will. “How Does the Carbon Credit Work?”\
    \ Investopedia, 6 Feb. 2020, [www.investopedia.com/terms/c/carbon\\_credit.asp](http://www.investopedia.com/terms/c/carbon_credit.asp).\n\
    \n| ![image](images/ch-16.jpg) || **Use Case 8:  \n\nReal Estate** |\n\n| ---\
    \ | --- |\n\nReal estate is the largest asset class in terms of value. According\
    \ to Savills, one of the oldest global real estate agents, the market is worth\
    \ about US$217 trillion, more than all stocks and bonds combined. In comparison,\
    \ the gold market is valued at slightly over US$7 trillion. Real estate is also\
    \ one of the most stable markets one can invest in, and because of this, almost\
    \ everyone wants a piece of it. Most people prefer owning the homes they live\
    \ in. Unfortunately, real estate is also the most challenging asset class to get\
    \ into for several reasons^([1](#ch16.xhtml#ch16fn1)).\n\n### **The property opportunity—and\
    \ hurdles**\n\nFirst, you have to go through a vast bureaucracy to make an acquisition.\
    \ You need to look through many long lists of assets in the market, do research\
    \ on real estate agents and escrow services, get appraisals, source your credit\
    \ scores, and so on. Once both sides (buyer and seller) have the intent to transact,\
    \ the necessary documents have to be drawn, which requires the services of attorneys,\
    \ valuers, and others. The paperwork, large transaction costs, and potential for\
    \ delays is immense.\n\nSuch extensive bureaucracy leads to the second obstacle:\
    \ the cost of processing a purchase. In some jurisdictions, the cost of acquiring\
    \ a real estate asset can go up to as much as 30 percent to 50 percent of the\
    \ entire price. This is a significant obstacle, especially considering the substantial\
    \ amount of money required for a down payment. This cost alone stands in the way\
    \ of many would-be real estate investors."
