- raw: '#### **Property and casualty insurance**


    Finally, let’s look at how the blockchain helps with Property & Casualty (P&C)
    insurance, which deals with the compensation for damage and loss of assets such
    as housing and cars as well as for personal injury.


    The benefits derived from blockchain technology are similar to other use cases—security,
    privacy, and automation—so we won’t repeat the details here. Instead, we look
    at how blockchain technology could be used as a component of a broader technological
    ecosystem that would provide a better experience for customers as well as brokers,
    insurers, and reinsurers. In particular, the blockchain is turning out to be a
    critical component to building the next integrated insurance systems, which includes
    other emerging technologies, primarily AI, IoT, and Big Data. Insurance companies
    could find a use for AI by using data to predict outcomes and automate processes,
    while making most of the decisions that have always been made by humans. Meanwhile,
    IoT provides an opportunity for collecting and sharing data more efficiently.
    For example, instead of relying on data by a shipping company on the conditions
    around the transportations of insured items, an insurance company could receive
    data directly from sensors and other devices embedded in the shipping vessel.


    Motor insurance is another scenario where these four technologies can come together
    to provide a better insurance experience for all stakeholders. Your car could
    be fitted with different kinds of sensors to collect data on its performance.
    In the case of an accident, the devices could send the insurer an accurate report
    on what exactly happened. Hence, the insurer would already be aware of your situation
    and understand whether you need compensation and what amount—all before you even
    reach out to them.


    The blockchain would make the data collected immutable so that the insurance company
    would not be able to cheat the consumer with changes that suit their interest
    in minimising the amount of settlement they need to make. Meanwhile, it protects
    the insurer from possible fraudulent claims.


    ### **How blockchain is changing the insurance industry**


    We are already seeing the industry toying with these technologies. While we might
    not see mainstream adoption shortly, a real potential exists for the long term.


    And when that time comes, these technologies stand to be of the most use to the
    industry with the blockchain as their backend technology. The data collected,
    analysed, and used by the industry is better stored and processed on the blockchain
    for privacy and security reasons. In addition, AI bots and devices in IoT would
    have their processes guided by smart contracts on the blockchain.


    It is important to point out that tests have already shown that the blockchain
    could provide a massive boost to the insurance industry. The benefits come in
    the form of cost cutting, operations sped up, security improved, and enhanced
    privacy. At the same time, it gives the industry a lot more transparency.


    According to a Bi3 report, their reinsurance prototype testing indicated that
    counterparties in a policy contract gain 30 percent efficiency when they adopt
    the technology, because the application eliminates duplication, speeds up reconciliation,
    and reduces the waiting time. It also lowers liquidity risks^([4](#ch14.xhtml#ch14fn4)).


    Others aside from B3i are building blockchain capacity to provide solutions to
    the insurance industry. IBM is among the most significant mainstream technology
    companies that have taken a keen interest in blockchain technology. One project
    that the company has been working on is building specific applications for the
    insurance industry that leverage on the blockchain technology. In this regard,
    the company has partnered with several insurance businesses and organisations.
    One of those partnerships is with the American Association of Insurance Services
    (AAIS), the largest rating bureaus and insurance advisory in the United States.
    Through the collaboration, they have designed and built the open Insurance Data
    Link (openIDL), a platform that facilitates and automates insurance regulatory
    reporting as well as streamlines compliance requirements. The primary function
    of this platform is to improve efficiency and accuracy in the interaction between
    insurers and regulators^([5](#ch14.xhtml#ch14fn5)).


    In addition to established insurance and technology companies embracing blockchain
    and using it to innovate, some developers and entrepreneurs have founded startups
    to operate within the insurance space. One of these, Etherisc has developed a
    protocol on top of the Ethereum blockchain to support the building and running
    of dApps. The DIP is the native token to Etherisc and facilitates transactions
    on the decentralised insurance applications, in particular those that are guided
    with smart contracts. Indeed, digital tokens native to applications and protocol
    is another critical component put on the table for the insurance industry by blockchain.
    Native digital value tokens are important concerning the automation of processes
    and transactions through smart contracts. It is almost impossible as the technology
    is today to have a sovereign smart contract that is funded from the traditional
    payment methods; a centralised payment can be compromised by a third party such
    as through cancelling of the service thus affecting the execution of the smart
    contract.


    In July 2019, Etherisc and the nonprofit organisation Oxfam announced the start
    of the enrollment of rice farmers in Sri Lanka to the application jointly designed
    and built. The application would help alleviate poverty through micro-insurance
    for the small scale paddy farmers^([6](#ch14.xhtml#ch14fn6)). The product, accessible
    through mobile devices, would facilitate farmers insuring their crops against
    extreme weather. Since most of the processes are automated on the blockchain,
    the cost is reduced, making the premium payable relatively low. Also, the farmers
    do not need to submit claims. Instead, the system put in place can detect and
    determine when the weather has been extreme enough to destroy the crop in the
    farm, triggering a smart contract-driven claim settlement.


    One of Etherisc’s first licensed products is a flight delay insurance, which travellers
    buy to be compensated in case their flight is delayed or cancelled. To qualify,
    the insurance application has to be 24 hours before the scheduled flight and can
    confirm the trip from an oracle online. The traveller provides a receipt to prove
    that he or she is booked for the flight. Once the policy is paid for, either in
    crypto or traditional payment methods, a smart contract on the Ethereum blockchain
    is activated and relies on data about the flight fed by the oracle to make critical
    decisions about the policy. In the event the flight is delayed or cancelled, no
    paperwork or form needs to be filled to make a claim. The smart contract automatically
    receives the notification, triggering a payout.


    Other Etherisc products include hurricane protection, crypto wallet insurance
    (which compensates you in the event your crypto wallet is broken into, and your
    digital assets are stolen), and social insurance. Etherisc is just one among many
    insurance blockchain startups. Other startups include Guardtime, Fidentiax, Dynamis,
    and Lemonade^([7](#ch14.xhtml#ch14fn7)).


    ### **Challenges in using blockchain**'
