    # Use Case 3: Government


    Like most technologies, blockchain is as useful in the public sector as it is
    in the private sector. Governments around the world are already embracing it for
    different use cases. Some have set up task forces to advise them on how to proceed.
    Others are a little more ahead and in partnerships with the private sector in
    various processes to design, develop, test. Some are already implementing applications
    meant to change how they deliver services to citizens.


    We can categorise the major impact of blockchain on government in two ways: (1)
    improving existing processes and systems and (2) changing the idea of government
    altogether. In this chapter, we look in detail at both and the possible impacts
    on the government.


    ## Blockchain for existing systems and processes


    We begin with how blockchain can improve existing systems and processes. This
    happens to be the most feasible blockchain application in the public sector, not
    least because it would cause less disruption and not tamper with the existing
    balance of power, which is very important for governments. With this stated, the
    technology can improve government systems and processes in the following four
    primary ways: (1) protect data that the government accumulates for public service
    delivery, (2) improve transparency and build trust in public institutions, (3)
    automate critical processes, and (4) cut costs. Let’s dig deeper into these four
    ways. For each, we look at an example of a government project somewhere in the
    world that is in progress or has already implemented.


    ### Data protection


    Just like in the private sector, data is critical for public service delivery
    and is the mainstay of governments anywhere. Through data, the government can
    identify citizens and their various needs. It also formulates and delivers solutions
    and services using data. Not only the central government needs its data protected.
    The same need also exists in independent public institutions or its branches such
    as the judiciary, the revenue (tax) service, and electoral agency. To this list,
    we can also add the local governments and authorities.


    But why protect the data that the government collects and stores?


    Both state (think foreign surveillance) and non-state actors (private citizens)
    can threaten government data. Everyday countries attempt to steal data from one
    another to gain military, economic, and diplomatic advantages. Many times it is
    also to sabotage one another. An excellent example of a reason one country may
    need to steal data from another is to influence election outcomes. The goal, in
    this case, is that whoever comes to power would then serve their economic, military,
    or global diplomatic interests.


    Non-state threats to government data come from individuals and organisations that
    might want to use it for financial gain. Often the data that government holds
    needs to be protected from elements within itself who might want it for selfish
    interests or other unethical reasons.


    The need for higher data protection has grown as governments globally digitise
    their systems as a way to deliver services more easily. While conveniences are
    gained through this digitisation process, systems and data become more exposed
    to threats that transcend international borders.


    The threat is both to individual citizens and the government as a whole. If data
    about you, which the government holds, falls into the wrong hands, it can be used
    to steal your identity, which in turn might be used to steal your property or
    even commit crimes elsewhere in your name. Likewise, a takeover of government
    systems or theft of its data, as we have already touched on, can compromise, sabotage,
    or weaken it in one way or another, especially before its peers internationally.


    In its annual performance report, released in January 2020, the Kenyan Judiciary
    department identified tampering with records as one of its most significant challenges[^1].
    According to the report, many in the East African nation beat justice by orchestrating
    the theft and destruction of case files and evidentiary material in the court
    registries and custody. Sadly, the theft and removal are done with the help of
    members of staff who readily accept bribes. Consequently, this situation ends
    up making it easier for Kenyans with financial means to have their way while the
    poor hardly get justice in the courts.


    The Kenyan judiciary sees digitisation of court files as a solution as it would
    make it easy to track, and more specifically, know who accesses them at what time.
    However, digitisation alone cannot fix the problem effectively. Those who tamper
    with the hardcopy files in cabinets (the members of staff at the registry) would
    most likely end up having authorised access to the digital databases as they have
    critical responsibilities in terms of filing and maintaining the records. They
    could still be bribed to delete or change details in the digital files.


    The blockchain offers institutions like the Kenyan Judiciary a means to make their
    digital files even more secure and tamperproof. It gives digital files immutability
    and also time-stamps them, which makes it near impossible for anyone to delete
    or arbitrarily make changes. The decentralised nature of the blockchain systems
    makes it possible to protect the data even better from external attacks. It is
    less susceptible to threats that target centralised points of failure. The technology
    also makes it easy to deploy public-private cryptography, which is ideal for public
    information systems. While the system makes arbitrarily changing or deleting files
    impossible, it provides the mechanism for a procedural addition of necessary changes
    in a transparent environment.


    One mega public project using the blockchain to safeguard the integrity of data
    is Smart Dubai. The Ruler of Dubai, Sheikh Mohammed bin Rashid Al Maktoum, who
    is also the Vice-President and Prime Minister of the United Arab Emirates (UAE),
    unveiled the project in October 2013. Smart Dubai is supposed to make Dubai one
    of the best cities in the world to live in, making most services accessible easily
    and at competitive costs online. It would also make things such as healthcare,
    education, and city management more efficient.


    ## References


    [^1]: "The Importance of Supply Chain Management." Council of Supply Chain Management,
    [cscmp.org/CSCMP/Develop/Starting_Your_Career/Importance_of_Supply_Chain_Management.aspx](http://cscmp.org/CSCMP/Develop/Starting_Your_Career/Importance_of_Supply_Chain_Management.aspx).


    [^2]: "ADNOC Announces Groundbreaking Blockchain Application for the Oil and Gas
    Production Value Chain Using IBM Blockchain." Abu Dhabi National Oil Company,
    Dec. 2018, [www.adnoc.ae/en/news-and-media/press-releases/2018/adnoc-announces-groundbreaking-blockchain-application](http://www.adnoc.ae/en/news-and-media/press-releases/2018/adnoc-announces-groundbreaking-blockchain-application).


    [^3]: "De Beers Successfully Tracks First Diamonds from Mine to Retail on Industry
    Blockchain." De Beers Successfully Tracks First Diamonds from Mine to Retail on
    Industry Blockchain, May 2018, [www.debeersgroup.com/media/company-news/2018/de-beers-group-successfully-tracks-first-diamonds-from-mine-to-r](http://www.debeersgroup.com/media/company-news/2018/de-beers-group-successfully-tracks-first-diamonds-from-mine-to-r).


    [^4]: Elhanani, Zohar. "How Blockchain Changed The Art World In 2018." Forbes,
    Forbes Magazine, 17 Dec. 2018, [www.forbes.com/sites/zoharelhanani/2018/12/17/how-blockchain-changed-the-art-world-in-2018/](http://www.forbes.com/sites/zoharelhanani/2018/12/17/how-blockchain-changed-the-art-world-in-2018/).


    [^5]: Kenyan Judiciary Annual Performance Report, January 2020.

