    team for the project. One way this is often done is that each stakeholder sends
    in a developer to be part of the team. Another is that the stakeholders form a
    consortium or a company that takes over the responsibility of building and managing
    the protocol. The latter is more common. The two most prominent private blockchains
    are managed through consortiums. In December 2015, the Linux Foundation and several
    major financial institutions and technology companies launched `Hyperledger`.
    Earlier that year in September, another group of financial institutions launched
    `R3`, another private blockchain consortium.


    In public blockchains, it is the entire community of users that is responsible
    for the core software development and maintenance. In particular, the project
    relies on volunteer developers to provide patches on the core software and release
    new versions to the community. Some members of the community may hire core software
    developers to work on the project.


    For example, several developers that have worked on the Bitcoin project over the
    years have been hired (or sponsored) by private companies that have built businesses
    on the blockchain. Examples of companies that have sponsored developers to work
    on the Bitcoin project include the Shanghai-based Bitcoin exchange `BTCC`, or
    `BTCChina`, and payment processor `BitPay`. It is also common for companies that
    build applications on top of a public blockchain to assign some of their developers
    to work on the core software. With Bitcoin, we have companies like `Blockstream`,
    `Chaincode Labs`, and `Ciphrex` doing precisely that.


    Some not-for-profit organisations collect funds from the community to hire developers
    to work on the core software. Again, Bitcoin offers some examples, including `Bitcoin
    Foundation` (active in the early days) and `Digital Currency Initiative` by `MIT
    Media Labs`. Most of the other public blockchains have foundations that either
    retain part of the mined coins, receive part of the transaction fees, or raise
    money from the community using other means to support the development and maintenance
    of the core software^([1](#ch05.xhtml#ch05fn1)).


    Getting the necessary resources is one thing. Changing critical parts of the public
    blockchain protocol is never easy, because often the entire community or at least
    a majority must form a consensus. Different players end up having conflicting
    interests. A case in point was the attempt to scale the Bitcoin protocol so that
    it could handle more transactions. The community had always struggled to form
    a consensus as to whether to increase the block size or have the community build
    second-layer scaling solutions such as `Lightning Networks` and `SegWit`. In 2017,
    the community was engaged in what is referred to the User Activated Soft Fork
    (`UASF`) Civil War, which led to the split of the network into Bitcoin and Bitcoin
    Cash^([2](#ch05.xhtml#ch05fn2)).

    '
