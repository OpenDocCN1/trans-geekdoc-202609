- raw: 'Thirdly, as a real estate investor, you have to deal with the rampant fraud
    that exists in the industry. Agents and other players often misrepresent or fail
    to disclose material facts about the assets, which they are selling or facilitating
    a lease. After all, their motivation is to increase the size of their takings.
    Indeed, the details about a single piece of an asset can change as many times
    as the number of potential buyers or lessee. Also, many cases of scammers compromising
    land title registries and misleading investors to send money to wrong accounts
    have been reported. In one case, in Washington DC, US, a couple was tricked into
    wiring US$1.57 million to con artists. It turned out that the criminals had accessed
    the title registry servers and launched what appeared like a genuine transaction^([1](#ch16.xhtml#ch16fn1)).
    According to one report by the CIA, Americans lose at least US$150 million annually
    to fraud in the real estate sector^([2](#ch16.xhtml#ch16fn2)).


    Fourth is the issue of asset liquidity. Being able to turn an asset quickly into
    cash is an essential consideration for many investors. At the moment, real estate
    is a low liquidity market. According to Zillow, an American online real estate
    database company, it takes an average of about three months before a listed house
    is sold. Many investors keep away from the market because of this reality^([3](#ch16.xhtml#ch16fn3)).


    Fifth, as an investor, it is really challenging to manage a real estate asset
    after you have acquired it. This is especially so if you do not have the necessary
    experience or are busy with other engagements. Finding the right agent to manage
    the asset on your behalf is a complicated process, especially to avoid being a
    victim of fraud. Of course, the management not only includes the physical care
    of the asset, but also has to cater for the needs of those who utilise it and
    pay the appropriate fees and rates to the authorities.


    The blockchain technology can fix most of these issues, making the real estate
    market-friendly, cheaper, safer, and convenient to everyone. It could significantly
    transform the industry in a way that benefits all. And blockchain startups and
    projects are already building various kinds of solutions for the market.


    ### **Blockchain benefits for real estate**


    What exactly can the blockchain technology do to the real estate market? The blockchain
    offers the following six benefits to the sector: (1) a better title system, (2)
    a better way of listing assets in the market, (3) tools to facilitate peer-to-peer
    trading, (4) tools for managing asset portfolios, (5) better mortgage financing
    options, and (6) more efficient but less costly escrow services.


    Let’s go through each of these six points in detail.


    #### **Better title system**


    The title (deed) is a critical document as it proves ownership of a piece of real
    estate. For centuries, a title was a simple piece of paper that carried the real
    estate number, the name of the owner and the signatures of witnesses and notaries
    who observed and supervised the transfer. It also contained the seal of the official
    who oversaw the transfer, whether through sale or inheritance.


    As sophisticated printing capabilities became more accessible, the paper alone
    ceased being authoritative enough to prove ownership. A registry with the records
    on ownership became a critical part of the title system. The files are usually
    in the custody of a third party authority (usually a public office), which would
    confirm the authenticity of the certificate and prove that its bearer is indeed
    who owns the piece of real estate in question.


    The land registries have undergone major transformation over the years. And the
    most significant one recently is digitisation. Information technology has made
    it faster and easier to access and query real estate registries from anywhere
    in the globe. However, like other information and communications technology (ICT)
    systems, digital land registries remain susceptible to certain vulnerabilities.
    In particular, they come with numerous single points of failure that can easily
    be compromised. Hackers have been able to break into systems easily, making changes
    that end up scamming unsuspecting investors. The records are not safe even from
    those with the responsibility to protect them. With some level of inducement,
    the staff at the registries, especially in developing countries, often tamper
    with the records in a way that benefits those who pay them and that disenfranchises
    rightful owners of real estate assets. These are ills explored in the earlier
    chapters of this book.


    Considering all the necessary and critical processes to buy or sell a piece of
    real estate, digital land title systems have not made investing in the sector
    efficient enough. The systems still need improvement, especially through a technology
    that offers efficiency, more security, and even interoperability.


    We have already seen what the blockchain can do for ICT systems in other areas.
    What it offers land title systems is similar. First, blockchain makes the systems
    secure. In particular, it makes it hard for a hacker to attack the system, given
    that they have to be successful at taking control of many independent computers
    in a peer-to-peer network, which is near impossible. It also makes it a lot easier
    to prove ownership without having to go through a third party. On the blockchain,
    the title acquires some level of sovereignty (existing free of any particular
    authority) along with high provability. The title also becomes immutable. No one
    can arbitrarily alter its details.


    Besides, titles on blockchain become even more potent when combined with other
    applications possible through this technology, such as smart contracts—a blockchain
    application explored extensively in this book. This combination makes trading
    and managing real estate a lot more convenient.


    Startups and projects are already building title systems on the blockchain. One
    of those is Bitland, a startup founded in 2013. In Ghana, where Bitland is headquartered,
    close to 80 percent of the land is without title and is community-owned. This
    exposes those who live on it to possible dispossession. Using blockchain, the
    company plans to help communities in west Africa register and get titles for their
    lands for the first time.


    In the United States, several projects have been set up to put real estate titles
    on the blockchain. In late 2018, Overstock.com, Inc., through its land management
    subsidiary known as Medici Land Governance, signed a Memorandum of Understanding
    (MOU) with Teton County, Wyoming, US, to design and build a blockchain-based real
    estate title system. Earlier in the same year, Propy, Inc., a California-based
    blockchain startup, announced a pilot phase of a similar project carried out in
    collaboration with the City of South Burlington, in Vermont.


    #### **Better way of listing assets in the market**


    When it comes to real estate listing, the technology fixes many of the challenges
    experienced on centralised listing platforms. Listing is a critical component
    in the real estate markets, without which purchasers would not know of the existence
    of properties on sale and sellers would not have a channel to reach possible buyers.
    In the centralised systems, however, a listing is often disjointed from the other
    systems that facilitate the sale and lease transactions, such as financiers, escrow,
    and the title system. This often leads to poor presentation or a misrepresentation
    of the listed real estate assets.'
