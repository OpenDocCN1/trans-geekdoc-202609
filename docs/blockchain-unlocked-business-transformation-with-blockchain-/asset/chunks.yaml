- raw: 'A security token is the share capital that a startup or a company sells at
    the marketplace. People who buy this type of token expect dividends and also have
    a say in how the company is managed. They expect the company to have a mechanism
    in place through which they can influence the management and policy. This token
    has not been issued often, due to the strict regulatory requirements in the majority
    of countries about issuing stock using the blockchain. It is a type of token that
    works better with companies and not open source projects.


    Whether you issue an ICO, utility, asset-backed, or security token depends on
    a couple of factors. The regulatory environment is one of them. You may consider
    a utility token instead of a security token because the former does not expose
    you to a lot of legal challenges. Another factor is the kind of project you are
    working on. For example, is it an open-source project or a product by a private
    company? If you are building an open-source project, an ICO token could be the
    best way to go. But if you are working on a product as a private company, a security
    or utility token could be what you need.


    ### **What makes a great token?**


    Now let’s turn our attention to what tokenomics is exactly. Anybody can create
    tokens on the blockchain. You can do it right now in under five minutes^([3](#ch03.xhtml#ch03fn3)).
    But those tokens will be worthless until there is a sizable number of people who
    find them useful and worth holding in their wallet. The harder part of token issuance
    is to provide a reason for other people to accept them as being useful or having
    any value.


    And that is where tokenomics come in.


    Tokenomics is all about designing a token that solves a pressing problem and creating
    a plan so that it reaches the intended users. If you fail on these two fronts,
    hardly anyone will ever find out about your token. Let’s find out the ingredients
    that make for great tokenomics.


    #### **Real need**


    The first ingredient is a genuine need for the token. You shouldn’t create a token
    simply because you can. Or because you need to sell it and make some quick cash.
    If you envision growing your project into something big in the future, you should
    only create a token because it plays a vital role in the big idea you have beyond
    bringing in cash. In 2017 and 2018, many startups raised hundreds of millions
    of dollars by selling blockchain tokens to FOMO investors (simply, investors who
    fear missing out). After the sale, many lost value and became nothing more than
    figures in wallets. The investors realised that no innovative products were forthcoming
    after the token.


    Things have changed a lot since then. Investors are a little wiser now. A well-written
    white paper is not enough to make them buy your tokens. To convince them, you
    have to design a system that serves a purpose and provides value to users. Not
    to mention the strict regulatory requirements for approval that have been put
    in place in many jurisdictions, including the US.


    The token should be a much-needed cog in an elaborate system. With a genuine need,
    a token stands to grow in value over time, and holders get other benefits from
    it. For example, it is difficult to imagine how the Storj network would work without
    a native means of payment. Payment methods such as PayPal or credit cards cannot
    work on such a system, as these methods cannot be included into a smart contract
    on the blockchain, which is something that the Storj protocol requires.


    If you must raise capital using a token that does not play a role in your final
    product or project, you should consider issuing a security token. This is share
    equity in your company. You will issue it following the rules that govern the
    conventional share issue and sale of securities. However, the rules are extremely
    stringent in most countries, and you may never get approval to carry out one.


    #### **Circulation model**


    Another ingredient of good tokenomics is a carefully considered circulation model:
    the life cycle and path of a particular token. There are three major token circulation
    models.


    The first one is the circular model, where the token moves around the system from
    one hand to another indefinitely without a predetermined end. It more or less
    functions as cash. The Storj token is used in this model. A person that needs
    space on the network buys the token from an exchange and then pays the farm owners
    with it. Those who earn the Storj tokens, by providing storage space, sell them
    at an exchange for cryptocurrency or fiat currency. And the cycle starts again.


    A second model is the source-to-burn model, where a token is issued to be used
    only once. Once spent, the token is destroyed. This is ideal for tokens that are
    used as tickets or access tokens. Once spent, these tokens are no longer needed
    and are replaced by newly generated ones.


    The last major model is the straight-and-back model. This is where a token is
    issued, goes out to perform a function, then it comes back to the one who issued
    it. A casino chip is a perfect example of a token that uses this model. You buy
    it for use within the establishment, and once done, you return it (assuming you
    kept it or won more) to the issuer to redeem fiat money.


    #### **Game theory**


    Another ingredient in tokenomics is game theory, which designs the platform, project,
    or product so that all stakeholders are incentivised in a way that benefits the
    project. For example, it is through a robust game theory that Bitcoin has survived
    and continued to grow, even though it does not have a central authority to manage
    and guide it. On the Bitcoin network, people are incentivised through a mining
    reward to provide the hardware resources necessary to maintain the shared ledger.
    Satoshi Nakamoto also seemed to have given a lot of thought on how to protect
    the network from bad actors. The founder made any attempt to attack the network
    extremely expensive. It is more beneficial to play by the rules on the network
    than to break them.


    Any token that desires to be successful has to have its game theory well thought
    out. The right incentives should be provided for the right people so that they
    act in such a way that furthers the project’s success. It is important that you
    figure how to create value in a digital token, incentivise people to hold the
    coin, and more importantly, incentivise early adopters to spread the word for
    the project.


    A robust game theory is very important for a decentralised ecosystem, as the opportunity
    to change things is unlikely once the project is out of the core developers’ hands.
    If you have the budget for it, it is important to engage the services of a qualified
    game theorist to help you figure out how to create a self-preserving ecosystem.


    #### **Supply**


    Another thing to think about when designing your token is its supply. What is
    the exact number of tokens that you need to have in circulation? Do you need it
    capped? If not, what should be the emission rate?


    If your tokens are to be used only once, such as a ticket, you may have a cap
    with a constant emission rate so that the right volume is maintained. If your
    tokens have an indefinite lifespan and do not get burnt, you may consider a hard
    cap like that of Bitcoin. This helps to avoid inflation, which translates to growing
    value for each token over time as the system gains more users.


    #### **The token distribution model**


    Equally important to consider is the token distribution model. What percentage
    of the tokens will be sold? And what percentage will go to the developer team?


    In token distribution, you need to inspire confidence in your project by holding
    onto some of the tokens. But you also should be careful not to hold on to a huge
    chunk, which can make your project appear as if it wants control over the market
    price movement. Holders should feel that the token’s price is not being artificially
    manipulated.'
  fmt: '

    # 什么是安全代币？


    安全代币是初创公司或公司在市场上出售的股本资本。购买此类代币的人期望获得分红，并在公司管理方面拥有发言权。他们期望公司建立一套机制，让他们能够影响管理和政策。由于大多数国家对使用区块链发行股票有严格的监管要求，因此这种代币鲜有发行。它是一种更适合公司而非开源项目的代币类型。


    无论你发行 ICO、实用代币、资产支持代币还是安全代币，取决于几个因素。监管环境就是其中之一。你可能会考虑发行实用代币而非安全代币，因为前者不会让你面临太多法律挑战。另一个因素是你正在从事的项目类型。例如，它是开源项目还是私营公司的产品？如果你在构建开源项目，ICO
    代币可能是最佳选择。但如果你是作为私营公司在开发产品，安全代币或实用代币可能是你所需要的。


    # 什么造就了优秀的代币？


    现在让我们关注一下代币经济学到底是什么。任何人都可以在区块链上创建代币。你现在就可以在五分钟内完成^([3](#ch03.xhtml#ch03fn3))。但在有大量的人发现它们有用并值得持有在钱包里之前，这些代币毫无价值。代币发行中较难的部分是提供理由，让其他人接受它们是有用的或具有价值的。


    这就是代币经济学发挥作用的地方。


    代币经济学关乎设计一种能解决迫切问题的代币，并制定计划使其触达目标用户。如果你在这两个方面失败了，几乎没人会发现你的代币。让我们来了解构成优秀代币经济学的要素。


    ## 真实需求


    第一个要素是对代币的真实需求。你不应该仅仅因为能创建代币就去创建。或者因为你需要出售它来快速套现。如果你设想未来将项目发展成大事业，你应该只在代币在吸金之外的宏大构想中扮演关键角色时才创建它。在
    2017 年和 2018 年，许多初创公司通过向 FOMO 投资者（即害怕错失良机的投资者）出售区块链代币筹集了数亿美元。售出后，许多代币贬值，沦为钱包里的数字。投资者意识到代币发行后没有创新产品问世。


    此后情况发生了很大变化。投资者现在稍微明智一些了。一份写得好的白皮书不足以让他们购买你的代币。要说服他们，你必须设计一个服务于特定目的并为用户提供价值的系统。更别提许多司法管辖区（包括美国）已实施严格的监管审批要求。


    代币应该是一个精密系统中急需的齿轮。有了真实需求，代币有望随时间增值，持有者也能从中获得其他收益。例如，很难想象 Storj 网络如果没有原生支付手段会如何运行。PayPal
    或信用卡等支付方式无法在这样的系统中工作，因为这些方式无法被纳入区块链上的智能合约，而这正是 Storj 协议所要求的。


    如果你必须使用一种在最终产品或项目中不起作用的代币来筹集资金，你应该考虑发行安全代币。这是你公司的股权。你将遵循传统股份发行和证券销售的规则来发行它。然而，大多数国家的规则极其严格，你可能永远无法获得批准来进行发行。


    ## 循环模型


    优秀代币经济学的另一个要素是经过深思熟虑的循环模型：特定代币的生命周期和路径。主要有三种代币循环模型。


    第一种是**循环模型**，代币在系统中从一方流向另一方，无限循环，没有预定的终点。它或多或少地充当现金功能。Storj 代币采用这种模型。需要网络存储空间的人从交易所购买代币，然后用它支付给农场主。赚取
    Storj 代币（通过提供存储空间）的人在交易所将其出售换取加密货币或法币。循环再次开始。


    第二种模型是**源头到销毁模型**，代币被发行仅供一次性使用。一旦花费，代币即被销毁。这非常适合用作门票或访问代币的代币。一旦使用，这些代币不再需要，由新生成的代币取代。


    最后一种主要模型是**直进直出模型**。代币被发行，流出去执行功能，然后回到发行者手中。赌场筹码是使用该模型的代币的完美例子。你购买它在场所内使用，完成后将其退还（假设你保留了它或赢得了更多）给发行者以兑换法币。


    ## 博弈论


    代币经济学的另一个要素是博弈论，它设计平台、项目或产品，使所有利益相关者以有利于项目的方式获得激励。例如，正是通过稳健的博弈论，比特币在没有中央权威管理和引导的情况下依然存活并持续增长。在比特币网络上，人们通过挖矿奖励获得激励，提供维护共享账本所需的硬件资源。中本聪似乎也深思熟虑过如何保护网络免受恶意行为者攻击。创始人使得攻击网络的任何尝试都极其昂贵。在网络上遵守规则比破坏规则更有利。


    任何渴望成功的代币都必须经过深思熟虑的博弈论设计。应为正确的人提供正确的激励，使他们的行为促进项目的成功。重要的是要弄清楚如何在数字代币中创造价值，激励人们持有代币，更重要的是，激励早期采用者为项目传播声量。


    稳健的博弈论对去中心化生态系统至关重要，因为一旦项目脱离核心开发者的手，更改事物的机会微乎其微。如果预算允许，聘请合格的博弈论专家帮助你构建自我保存的生态系统非常重要。


    ## 供应量


    设计代币时另要考虑的是其供应量。流通中需要的确切代币数量是多少？需要设定上限吗？如果不需要，发行率应是多少？


    如果你的代币仅供一次性使用（如门票），你可以设定上限并配合恒定发行率以维持适当量。如果你的代币具有无限寿命且不被销毁，你可以考虑像比特币那样的硬上限。这有助于避免通货膨胀，随着系统用户增加，转化为每个代币价值随时间增长。


    ## 代币分发模型


    同样重要的是代币分发模型。多少比例的代币将被出售？多少比例将分配给开发团队？


    在代币分发中，你需要通过持有部分代币来增强项目信心。但也要小心不要持有过大比例，这会让项目看起来像想控制市场价格波动。持有者应该感觉到代币价格没有被人为操纵。

    '
