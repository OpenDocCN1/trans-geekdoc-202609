- raw: 'Some very complex smart contracts can be designed to receive real-time data
    from designated online oracles. It needs to be able to not only process the data
    but also decide if it is appropriate.


    If you need to write a smart contract, the first step is to learn a programming
    language used for the purpose. Most often, it is Solidity, which is used on Ethereum,
    RSK, and other smart contract blockchain platforms. The second step is to install
    the appropriate client software on your local device and learn to navigate it.


    Being informed, knowledgeable, and skilled in smart contracts is probably an excellent
    decision. It might turn out to be one of the applications on the blockchain that
    will have an immense impact on the function of society.


    ^([1](#ch06.xhtml#ich06fn1)) Szabo, Nick. “Smart Contracts: Building Blocks for
    Digital Markets.” Extropy, 1996.


    | ![image](images/ch-7.jpg) || **Should My Business Use Blockchain** |


    | --- | --- |


    Almost everyone you meet claims that blockchain is the future. There is a lot
    of talk about how the technology is going to change business like how the Internet
    has from capital markets to the music business. And because of all this, you are
    probably wondering whether you are doing enough so that your business does not
    fall behind.


    Arguably, you should always be proactive and quick to leverage any new technology
    that comes along. Nevertheless, the first step should always consider if it gives
    your business an actual advantage. This often is in the form of cutting both original
    and operational costs, improving efficiency in processes and systems, securing
    value, and giving your customers an even better user experience. Consider if it
    also offers you an opportunity to create new products that your target market
    would find valuable or useful.


    The biggest mistake you could make is to adopt a new technology just for the sake
    of it. Or because everyone else is embracing it and it seems cool to do so too.
    Instead, adopt a technology because your detailed research, audit, and analysis
    have convinced you that it would add real value to your business. This is the
    best way to proceed in business. And it applies to blockchain too.


    ### **Does your business actually need blockchain?**


    It would be hard for me to give a yes or a no given that I know nothing about
    your business. What I will do is to help you arrive at the appropriate conclusion.
    And the best place to begin is to figure out precisely what the blockchain technology
    offers. By knowing what I call the “values” of blockchain, you can determine whether
    it will help your business move forward.


    So what are the things that blockchain offers, and how can they be helpful to
    a business?


    ### **What blockchain provides to your business**


    The list of values that blockchain provides is not very long. This is a good thing
    because it becomes easier to decide whether you need the technology to form part
    of your systems. The technology might be useful to your business, but just not
    yet. Perhaps you might have to wait for it to evolve a little more before you
    find an appropriate use in your business. It is also important to point out the
    applications that other businesses and groups run on top of the blockchain can
    be useful to your business in more nuanced ways than the raw blockchain itself.
    Thus, it is good to be on the lookout.


    There are five primary values that the blockchain can offer your business: (1)
    decentralisation, (2) immutability, (3) tokens, (4) privacy, and (5) smart contracts.


    #### **1\. Decentralisation**


    The first value that blockchain offers businesses is decentralisation. This removes
    single points of weaknesses or failures in data management and in the hosting
    and running of applications. As a result, it gives more security and stability
    to systems and processes. In 2009 when blockchain was first revealed through Bitcoin,
    almost everyone thought it would be great for payment solutions only. However,
    it slowly became apparent, especially after the launch of Ethereum in July 2015,
    that the technology could power a wide range of applications. Indeed, as it is
    a virtual machine on top of a peer-to-peer network, it could replace the centralised
    server backend.


    The fact that the blockchain is a virtual machine on a peer-to-peer network makes
    it almost impossible to disable. There is neither a switch to turn off nor a central
    node to attack and bring down the entire network. Any business relying on conventional
    backend servers is always exposed to the possibility that the backend may be compromised
    or even taken offline. This could affect its operations severely even if the backend
    is offline for just a few minutes. While a business could have backups to minimise
    any effects, the experience to the end-user is often not the same until the primary
    servers are back online. Also, in a centralised system, an attacker only has to
    concentrate on a single or a few points.


    The blockchain significantly changes how things work. As long as the Internet
    exists, the blockchain will always be online. Moreover, the blockchain backend
    provides more security and stability to applications and business data. There
    is no worry about possible downtimes caused by a technical hitch in a server or
    a compromise by hackers, which removes backup costs. You also do not have to worry
    about a third party compromising your systems such that you are unable to serve
    your customers effectively. The technology at least makes it a little harder to
    sustain attacks such as the denial of service, system takeover, and data corruption.


    #### **2\. Immutability**


    The second value that the blockchain offers businesses is the immutability of
    digital records. Once content is created, no one, not even a system administrator,
    can change it. Before Satoshi Nakamoto released Bitcoin, there was hardly a sure
    way of making digital data frozen once it was created. The only way that a business
    could preserve the integrity of digital data was to ensure that access to it,
    especially to its editing mode, was jealously protected. Keeping out those who
    want to change records for personal gain, sabotage, or even for fun has always
    been a very expensive affair. According to a report by insurance company Hiscox,
    businesses around the world lose on average US$200,000 to Internet insecurity^([1](#ch07.xhtml#ch07fn1)).


    It is very costly to protect the integrity of data by keeping out anyone who may
    have reason to change or delete it. What blockchain does is to burn data onto
    a shared ledger. This makes it near impossible to arbitrarily undo, modify, or
    delete a record as a consensus has to be achieved first.


    Furthermore, the network ignores any action that defies its rules. In other sections
    of this book, I have explained how the concepts of mining and game theory help
    to preserve the integrity of the blockchain system. Of course, it could be argued
    that mining is as costly as protecting data in centralised server systems. Indeed,
    mining can be very expensive. For example, the Bitcoin network consumes as much
    electricity as a sizable country like Switzerland uses. However, the cost of maintaining
    the blockchain does not increase with the number of users or applications. Rather,
    the cost could become negligible with more users and applications on the blockchain.
    Also, there are new blockchain designs with consensus protocols that do not require
    enormous amounts of electricity. For example, blockchains on the Proof of Stake
    (PoS) protocol such as Tezos, NEO, and DASH use a negligible amount of electricity.


    #### **3\. Tokens**'
