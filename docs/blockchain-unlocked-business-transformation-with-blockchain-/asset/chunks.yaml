    Is No Friend To Small Businesses.” Medium, The Capital, 30 Jan. 2020, [medium.com/p/why-enterprise-blockchain-is-no-friend-to-small-businesses-19b4a83cb416?source=email-8b0c907c376b--writer.postDistributed&sk=eadc4655d9c009f35c7e30b2db8495d0](http://medium.com/p/why-enterprise-blockchain-is-no-friend-to-small-businesses-19b4a83cb416?source=email-8b0c907c376b--writer.postDistributed&sk=eadc4655d9c009f35c7e30b2db8495d0).


    ^([4](#ch18.xhtml#ich18fn4)) Taylor, Ryan. “Dash Network Elected Trust Protectors:
    Closing the Governance Loop.” Medium, Dash Blog, 1 Jan. 2019, [blog.dash.org/dash-network-elected-trust-protectors-closing-the-governance-loop-4f07b46da03e](http://blog.dash.org/dash-network-elected-trust-protectors-closing-the-governance-loop-4f07b46da03e).


    ## **Beyond 2020**


    In this chapter, we are going to look at some of the trends we should expect going
    forward. It is important to point out, however, that no one can accurately predict
    what exactly the technology is going to do or how it is going to turn out in the
    next five or ten years. Trying to do that is like predicting in the early 1990s
    that the Internet would bring us social media like Facebook, video platforms like
    YouTube, and video calling apps like Skype. Likely not even the experts who worked
    on the foundational infrastructure of the Internet could foresee what we have
    today. The technology just snowballed, and we discovered and invented things as
    we went along. In the same way, blockchain most likely will deliver services and
    solutions in the future that no one today can comprehend.


    It is not impossible, however, to foresee particular trends, especially those
    that are likely to happen in the near future. We can also figure the general direction
    the technology might take in the long term though without clarity on the specifics.


    ### **Bitcoin will be used everywhere**


    First on my list is the widespread adoption of the blockchain technology. The
    hype around cryptos seems to have cooled down, but serious research by governments,
    mainstream technology companies, and even small to medium enterprises is underway.
    Those who ignored or dismissed cryptocurrencies like Bitcoin in the early days
    are now giving the underlying technology a serious look. They are launching projects,
    companies, and consortiums to help them find out the value in it for their businesses,
    systems, and in processes. Of particular interest to them is the security, privacy,
    and automation that the technology can provide. It is also attractive to them
    that blockchain can create new possibilities and also facilitate the adoption
    of other emerging technologies such as AI and IoT. These multifaceted efforts
    are going to translate to a massive movement with regard to the adoption of the
    technology in the decade that starts in 2020^([1](#bm01.xhtml#ch19fn1)).


    ### **Blockchain will be at the heart of global finance**


    The technology is moving into the centre of the global financial system. Blockchain
    offers the tools necessary to build currencies fit for the 21st century. Interestingly,
    the year 2020 began with the global coronavirus (Covid-19) pandemic. One of the
    situations cited as contributing to the spread of the diseases was physical cash.
    The World Health Organisation made a point of encouraging governments around the
    world to find a way to minimise the use of coins and paper bills, as one person
    with a deadly virus could easily infect many others by touching and passing along
    physical cash that could theoretically be contaminated. This is just another reason
    for the push towards digital currencies. And because of its qualities, Blockchain
    is hard to ignore in the building of a new financial system that relies less on
    physical currencies. Some countries, including China, which is one of the largest
    economies in the world, have put actions in place to see the implementation of
    a government-backed digital currency^([2](#bm01.xhtml#ch19fn2)).


    Nevertheless, blockchain is also going to continue challenging the idea that only
    the state can issue currency. Beyond 2020, more and more people are going to appreciate
    that private currency, or currency not issued through the power of the state,
    can be as efficient and even better in some circumstances. In other words, we
    stand to see the use of both the state and non-state issued currency in almost
    the same measure going forward, and that is thanks to the tools made available
    by the blockchain to society.


    ### **Increasing capacity of blockchain**


    In the short-term period coming after 2020, we are going to see a lot of effort
    go into scaling the capacity of blockchains. It is true that while it is revolutionary,
    the blockchain has exhibited weaknesses, one of which is low capacity and can
    be classified as critical. For example, Bitcoin has struggled to process more
    than ten transactions per second, which is very low, especially compared to payment
    services it seeks to replace. In late 2017, the Ethereum blockchain clogged because
    of increased activities from Cryptokitties, a gaming application launched on top
    of it. Blockchain developers have already begun focusing on this problem and are
    working on various ways of scaling the blockchain networks. Some of the solutions
    being designed to help with the scaling problem include Lightning Network, Raiden
    network, and Sidechains. The implementations of these scaling solutions are in
    the early stages as at the time of writing this book. Their full potential is
    most likely going to be realised in the decade after 2020. It turns out that it
    could well coincide with the increased adoption of this technology around the
    globe.


    ### **More energy efficiency**


    Fourthly, we should watch out for the development and deployment of consensus
    protocols that are less energy-intensive. We have already seen in the previous
    chapters that the initial blockchain consensus protocols, in particular, the Proof
    of Work that Bitcoin and Ethereum use consumes a lot of energy. This makes them
    harmful to the environment due to their greenhouse gas emissions. The newer blockchains
    are designed to use less energy-intensive protocols, and this trend is going to
    grow over time. Indeed, Ethereum plans to shift to Proof of Stake by 2022. The
    Bitcoin community might likely resort to doing a hard fork and adopting a more
    environmentally friendly consensus protocol sometime in the future.


    ### **True decentralisation**'
