    # 区块链改善能源行业的第二种方式


    现在，让我们看看区块链改善能源行业的第二种方式。


    长期以来，电能的流动是单向的。它始于发电实体，后者从水电大坝、风力发电场、地热电厂或核能电厂生产能源。然后，这些能源被传递给公用事业公司，后者再将其出售给最终消费者。在某些情况下，发电公司同时也是处理供应链零售环节的公用事业公司。


    然而，在过去十年中，情况开始发生变化，供应链不再是单向流动。旧模式正被一种新模式取代，即由众多本地发电主体生产更多能源，以补充主供应商提供的能源。如今，消费者在全球范围内普遍自行发电，特别是利用太阳能和风能。这种趋势日益流行且易于实施，原因有很多，包括所需技术多年来已显著改进。用于本地能源生产的太阳能电池板和电池，其容量远高于几年前的产品。此外，全球人口对保护环境的必要性有了更深的认识，并理解选择更环保的能源是为环保做贡献的一种方式。


    事实证明，随着时间的推移，消费者产生的能源超过了他们的消费量。一些公用事业公司已建立系统，允许此类消费者将剩余电力释放到电网供他人使用。支持这一功能的最基础技术是双向电表和变压器，它们可双向传输能源（进出场所和住宅）。由此产生的交易被称为**净计量**。


    简而言之，当客户家中或场所的太阳能电池板或风力发电场产生的电力少于客户所需时，电网提供额外电量；反之，若产生的电力多于所需，多余能源将释放到电网。公用事业公司根据客户的生产和消费情况向其买卖电力。在账单周期结束时，计算净值并据此结算。如果客户消费多于生产，他们需支付来自电网的补足电费；若消费少于生产，公用事业公司按预先约定的单价向其支付收益。公用事业公司可用现金支付，或将余额结转以抵消未来交易。


    最终，净计量帮助消费者削减电力支出，并为他们提供了一条收入来源。同时，公用事业公司增强了向电网连接的其他消费者供电的能力，不再依赖单一能源供应商。事实上，随着时间的推移，公用事业公司分发的能源可能有很大一部分来自其客户。同时，该模式为该行业引入了良性竞争，这对所有利益相关者都有利，尤其是因为为电网发电可能成为许多人的可行业务。此外，消费者自发电力成本更低。但更重要的是，它通常对环境更友好。


    那么，区块链在这一架构中扮演什么角色？


    区块链技术可通过提供在电力公司与向电网回售电力的消费者之间形成和执行合同的机制，使这一向电网售电系统变得更完善。区块链为个体发电者与公用事业公司之间的交易提供了便利。实现此目的的适用工具包括**智能合约**和原生支付手段（代币或加密货币）。


    但更重要的是，技术可以支持消费者之间的点对点交易。我们可能会看到新的基础设施，人们通过网络自行买卖能源，无需第三方参与。这将显著降低消费者支付的成本，因为中间商及其运营开支、利润需求被排除在外。这也可能有助于打破长期控制能源行业的垄断。


    垄断往往导致关注底线和利润率。毫无疑问，由于缺乏竞争，这会随着时间的推移推高电力成本。高昂的电力成本对弱势群体打击最大。企业也将面临更高的运营成本，这无疑会转嫁给消费者。


    一些实体已尝试这种新的能源生产、分配和消费模式。其中之一是 **Power Ledger**，一家总部位于澳大利亚的初创公司，设计并实施了一个系统，让个体创建由能源生产者和消费者组成的网络，称为“微电网”。目前（撰写本书时），Power
    Ledger 将微电网设计为现有国家电网的一部分。然而，长期计划是建立独立、自给自足但以点对点结构互联的微电网，就像区块链网络一样。这可能彻底改变行业，将决策权从大公司转移到个体消费者手中。


    ## 代币化能源


    区块链彻底改变能源行业的第三种方式是提供**代币化能源**的能力。我们已经在肯尼亚看到了一种代币化应用，使能源的销售或计量对消费者更加便捷。除了便利向最终消费者销售的能源代币化，区块链技术还能促进能源在国际市场上的代币化交易。石油是全球交易量最大的大宗商品之一。区块链使得为每一桶开采出的石油生成代表其价值的主权数字代币成为可能。该数字代币可替代其所代表的实际石油进行交易。这提高了交易的速度、便利性和易用性。


    除了简化代币化流程，区块链还允许不同利益相关者拥有一个共享账本，通过它所有方都能实时监控和追踪能源资产。这提供了透明度，并最大限度地减少了市场操纵的可能性。


    2017 年初，金融解决方案实体 **Natixis**、**IBM** 以及大宗商品贸易物流公司 **Trafigura** 宣布合作，构建首个用于管理美国原油市场的区块链解决方案。使用
    **Hyperledger Fabric** 平台，这三方将建立一个系统，实现原油交易的数字化。他们选择区块链是因为它提供安全性、透明度和效率。


    然而，也许最早、最知名的在区块链上代币化石油和天然气的尝试，是 **委内瑞拉政府** 于 2018 年初发起的。作为拥有巨大储量的最大产油国之一，委内瑞拉一直面临美国及其他国家的制裁，限制了其从石油中获益的能力。为规避经济制裁，该南美国家创建了
    **Petro**（石油币），一种由其能源储备支持的加密货币。Petro 于 2018 年 2 月至 3 月通过 ICO 发行。政府声称通过出售超过 3000
    万枚 Petro 币筹集了 33 亿美元。在国际上，Petro 似乎在俄罗斯获得了认可。但关于 Petro 是否真正基于区块链仍存疑问；它极有可能是一个中心化的代币化系统。然而，委内瑞拉可能是先行者，其他国家可能效仿。据一些报道，俄罗斯可能正在考虑类似项目。

    '
