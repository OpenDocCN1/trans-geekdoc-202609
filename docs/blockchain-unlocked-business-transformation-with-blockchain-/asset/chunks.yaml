- raw: "The blockchain can fix some of the challenges that service providers like\
    \ Airbnb are facing. For example, the host and the guest exchanging keys is always\
    \ a challenging part of an Airbnb transaction. Where the host is not around to\
    \ receive the guest, in many instances they are forced to leave the key under\
    \ the doormat or with the neighbour. That is a huge gap in this otherwise very\
    \ convenient service.\n\nSlock.it, a German blockchain startup, has designed a\
    \ blockchain solution that could fix this problem. It comes in the form of a smart\
    \ lock that you open using a private key on the Ethereum blockchain. With the\
    \ lock installed on the door, the host does not need to exchange a physical key.\
    \ A smart contract guides the transaction on the blockchain; once the guest pays,\
    \ the smart contract provides them with a key in the form of a passkey (a digital\
    \ key), which works only for the duration of the stay. Once the agreed time of\
    \ the visit elapses, the key ceases to function. The host no longer needs to worry\
    \ about guests who might overstay or having to be present at check out. This is\
    \ just one way the technology could help with managing real estate.\n\nSome developers\
    \ are already designing and building platforms on the blockchain that could give\
    \ hosts and guests a better experience than what they get on Airbnb. One such\
    \ blockchain-based home-sharing platform is Bee Token, which raised about US$15\
    \ million in an ICO in January 2018. The decentralised platform facilitates transactions\
    \ in cryptocurrency.\n\n#### **Better mortgage financing options**\n\nThe majority\
    \ of homebuyers cannot pay cash; homes are often a costly investment. For this\
    \ reason, mortgages are a huge business. Financial institutions pay the entire\
    \ cost of the real estate asset to the seller on behalf of the buyer. The buyer\
    \ then commits in a contract to repay the financial institution in instalments\
    \ that are often spread out in an extended period, sometimes decades. In return,\
    \ the mortgage company makes a massive return in the form of interests and transaction\
    \ fees.\n\nThe blockchain technology is offering new ways of mortgage financing\
    \ that is not only cheaper for the person taking the loan, but also opens up the\
    \ market for the small investors to put in their money and generate revenue. Today,\
    \ only banks and financial institutions can fund a mortgage. Through decentralised\
    \ financial (DeFi) applications, the technology makes it possible to get mortgage\
    \ funding from ordinary people who want to invest in such an instrument.\n\nOn\
    \ the blockchain, the mortgage can be split into tokens, which are then sold to\
    \ those who want to finance a mortgage with the hope of getting returns over a\
    \ long period. The entire transaction is set on a smart contract so that every\
    \ time a repayment goes out, the holders of the mortgage tokens receive what is\
    \ equal to their part of the mortgage.\n\n#### **More efficient escrow services**\n\
    \nFinally, how does the blockchain improve real estate transactions, in particular\
    \ escrow services? As seen in the finance and banking sector (in [Chapter 9](#ch09.xhtml)),\
    \ the escrow service is very critical in real estate transactions. It protects\
    \ buyers, sellers, and the financiers from possibly being defrauded. This service,\
    \ however, does not come cheap. On average, the escrow service can cost up to\
    \ five percent of the value of the transacted asset. Through smart contract applications,\
    \ the blockchain has made possible escrow that is sovereign and free to use. Two\
    \ individuals can trade in a peer-to-peer transaction without involving a third\
    \ party for the escrow service. The smart contract can hold both the title and\
    \ the agreed payment and swap them when the counterparties meet the pre-agreed\
    \ conditions.\n\nProjects are already working towards providing blockchain escrow\
    \ services to the real estate industry. One such project is Reasi by a startup\
    \ based in California. The platform would facilitate end-toend real estate transactions\
    \ and eliminate the need to rely on third-party service providers, in particular\
    \ escrow companies.\n\n### **Challenges in using blockchain**\n\nBlockchain has\
    \ a few obstacles to overcome so that it can achieve its potential in the real\
    \ estate sector. The first challenge is for regulations around the world to be\
    \ aligned to the possible blockchain technical capacities. Without the recognition\
    \ of law, transactions carried out on the blockchain would be null and void, such\
    \ as decentralised mortgage arrangements and tokenised assets on the blockchain.\
    \ Lack of recognition would slow real estate from embracing blockchain. Another\
    \ challenge is the lack of interoperability. The title system has to talk to the\
    \ listing platform, and both have to be linked to the trading exchange as well\
    \ as the escrow service. Moreover, different financing applications and centralised\
    \ real estate systems need to communicate with the other platforms. Without extensive\
    \ interoperability, real estate transactions will remain slow and inefficient.\n\
    \nOf course, the real estate application of the blockchain has to deal with the\
    \ scalability issues that we have talked about in the other chapters. Given the\
    \ size of the global real estate market, the number of transactions on the blockchain\
    \ could become massive.\n\nLast but not least, all stakeholders, including investors,\
    \ developers, regulators, and others, have to have a change of mindset so that\
    \ they can embrace the systems in the new technology. In particular, those who\
