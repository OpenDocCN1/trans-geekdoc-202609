- raw: 'However, producing goods in an ethical, healthy, and environmentally friendly
    can be costly. Therefore, companies may falsify information so that they continue
    to use less costly production processes but at the same time allay the concerns
    of consumers. The blockchain would not only make it easier to access information
    about the history of a product but also make it difficult, thanks to its immutability,
    to change records. Consumers can thus confirm that a product, for example, is
    indeed organic by going online and checking its path. The same goes for any manufacturer
    with similar claims of being environmentally friendly, green, having the least
    carbon print, etc.


    #### **Making trade finance better**


    Last, but not least, the blockchain offers the means to make trade finance even
    better than what we have today. Trade finance is the process through which two
    transacting businesses in different countries settle payment. The current system
    is slow, bulky, and costly, not least because a transaction could involve several
    banks, financial institutions, and other entities. This takes weeks before each
    of the banks can manually scrutinise the documentation and give approval. The
    blockchain offers smart contracts, which makes it unnecessary to have many trusted
    third parties in a single transaction.


    Also important is the fact that native currencies on the blockchain can complete
    a smart contract written to execute a trade finance transaction. Thanks to this
    ability, blockchain significantly speeds up the transaction to a matter of hours.


    ### **Integrating blockchain with other technologies**


    Among other things, blockchain can help with the deployment of other technologies
    that are meant to provide efficiency, more capacity, and better user experience.
    In particular, it can support the integration of supply chains with the Internet
    of Things (IoT), adding smart devices to the system to help with the collection
    and analysis of data, as well as automation of processes. For example, a container
    carrying medicines could have embedded temperature readers to send data directly
    onto the blockchain. This would help identify the possibility of damage due to
    temperature conditions that are either too high or too low. Other devices could
    provide information about how the container is secured and the number of times
    it is opened. Cameras could even record openings while storing the files on the
    blockchain as part of the product history.


    Artificial intelligence (AI) could form part of the supply chain with blockchain
    as a reliable backend. The blockchain offers a more secure backend to store and
    process AI protocol, as well as data that the system generates. Different kinds
    of dApps could implement AI on the blockchain. Some dApps could help predict events
    as accurate future market demands to alert manufacturers, suppliers, and retailers
    to make the necessary plans.


    Now let’s look at examples of specific use cases of blockchain for supply chain
    management.


    In early 2019, Abu Dhabi National Oil Company (ADNOC), an oil company owned by
    the United Arab Emirates, announced a collaboration with IBM to design, build,
    test, and launch a supply chain on the blockchain, which would track the movement
    of oil from wells to refineries and finally to the consumer. It would also automate
    transactions, shorten shipping time, and reduce the costs of monitoring the oil
    supply chain. Not only that, it would provide investors access to information
    about the performance of the company as well as other entities along the chain.
    This is an important project to watch given that ADNOC produces over three million
    barrels of oil daily, and its success would be a major milestone that encourages
    other major oil producers to embrace the technology^([2](#ch10.xhtml#ch10fn2)).


    Another specific supply chain blockchain use case is the Tracr by De Beers, a
    blockchain supply chain that tracks diamonds from the mine to the consumer. Tracking
    diamonds is critical given that its mining and sale is often a source of conflict,
    suffering, and death, especially in West Africa. Indeed, this situation inspired
    the Hollywood movie Blood Diamond. By setting up the Tracr system, De Beers, one
    of the biggest handlers of precious minerals, is seeking to lock diamonds acquired
    through unethical means out of its system. In May 2018, De Beers announced the
    successful tracking of its first 100 pieces of diamond from the mine to cutter,
    polisher, and to a jeweller on the Tracr blockchain supply chain management system.


    The Tracr system uses uploaded photos, detailed description, unique physical properties,
    and location to track a piece of diamond. The end goal is to assure the customer
    that their money is not ending up in the hands of those causing war and suffering^([3](#ch10.xhtml#ch10fn3)).


    One sector that has seen real use cases of blockchain is the art industry, which
    has applied the technology to protect and secure the provenance of pieces of art.
    Fake art is a multi-billion dollar industry and many people are often tricked
    into buying counterfeit or fake pieces. The blockchain technology has provided
    the tools to make it easy to not only track a piece of art but also for a buyer
    to prove that whatever they are being sold is original and not a fake. Several
    startups building art supply chain systems and notable names are Artory, Verisart,
    and Provenance.org. Dadiani Fine Art and Christie’s are some of the major art
    auction houses that have embraced blockchain to track and safeguard art^([4](#ch10.xhtml#ch10fn4)).


    ### **Challenges in using blockchain**


    As with any other technology, not everything is perfect with the application of
    the blockchain technology on supply chains. It has a few challenges to overcome
    to achieve the best results.


    One of these challenges is the difficulty of safeguarding the credibility of data
    before or at the onramping point. We know that the blockchain protects and makes
    data immutable. However, the data has little protection from the technology beforehand.
    Erroneous, misleading, or poorly collected data could still find its way into
    the system. One way to correct this is to enable real-time collection of data
    using IoT or to set up independent data certification processes.


    Businesses have to protect their data from competition. Knowing what a business
    competitor is doing is always very powerful. And it can facilitate one organisation
    driving another out of the market. For this reason, many businesses and even countries
    might feel apprehensive about posting their data on a public ledger. They may
    feel the need to protect it by not having it recorded on the blockchain. One way
    to fix this is to use advanced technologies such as cryptography to increase intellectual
    property rights. Enhancing enforcement in the legal system will also be helpful.


    Getting the right talent and skill to implement the blockchain-based supply chain
    systems is a challenge, as it is still early days for the technology. Technical
    blockchain experts are relatively few, which makes it a little harder for any
    entity to want to build a supply chain management system on the blockchain. However,
    this may change with time as blockchain technology becomes mainstream and more
    capacity is built.


    Unfriendly regulations are an issue as many countries are wary of free unchecked
    movement of value, especially in the form of money. While systems can be designed
    to complete trade finance transactions in a matter of minutes, demands of regulations
    in countries involved can still slow it down to hours, days, or even weeks.


    Regardless, there is a lot of potential in applying the blockchain technology
    to improve supply chains. Going by the many startups that are building applications
    to support this use case, a major movement is likely in the coming years, especially
    with the involvement of big names such as IBM, De Beers, and Christie’s.'
