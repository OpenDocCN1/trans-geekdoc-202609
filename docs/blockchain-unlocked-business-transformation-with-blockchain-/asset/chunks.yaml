- raw: 'At the time of writing this book, there is a lot of optimism regarding the
    scaling of the capacity of significant blockchains to support even more payment
    solutions. In the case of Bitcoin, we are witnessing the embracing of the Lightning
    Network protocol, which many views as the ultimate scaling solution for the network.


    The lightning network, which is also adaptable to other blockchains in particular
    Litecoin, makes it possible that not all payment transactions can be registered
    on the blockchain. Still, all can be secured by the technology. The lightning
    network simply allows for two or more people to create a payment channel. This
    is basically a smart contract application running on the blockchain, which enables
    them to send money back and forth for as long as they want or need. However, out
    of all the transactions they ever complete, only two get to be recorded on the
    blockchain: that which created the payment channel and which closes it and settles
    the net balances for all participants.


    But the lightning network is not the only scaling solution being deployed to increase
    the capacity of the Bitcoin blockchain to support more payment transactions. The
    others include Sidechains, which is a protocol that allows different blockchain
    to interoperate, and SegWit, a protocol that makes it possible to record payment
    transactions on the blockchain with less data from each. For Ethereum, there is
    the Raiden Network and the Plasma second-layer scaling solutions, similar to Lightning
    Network and Sidechains, respectively.


    The infrastructure for using blockchain for payment purposes has improved a great
    deal over time. In the early days, sending and receiving Bitcoins and other cryptocurrencies
    required you to install the core application on your desktop. It was very cumbersome
    considering that you had also to download the entire blockchain ledger, which
    for Bitcoin has grown to over 260GB^([6](#ch12.xhtml#ch12fn6)). It also had a
    terrible user interface and user experience.


    Over time, developers designed the light wallet protocols, which allowed for an
    application on a smartphone to interface with a node on the network and serve
    as an end-user interface to the blockchain. The lightweight wallet protocols made
    it possible to interface with the blockchain without having to download it to
    your local device. Today, mobile and browser wallets have become the most used
    in making payments on blockchain, and only a minority of users still install the
    core desktop wallet. The mobile wallet generally has an excellent user interface,
    and is also convenient and fast.


    The development of wallets has gone beyond software applications. You have the
    option of buying hardware wallets, devices specifically designed for holding cryptos,
    and making payments. The major brands of hardware wallets include Trezor, Keepkey,
    and Ledger. There are also companies building smartphones with specific capabilities
    for making payments using blockchain solutions. One of the startups that raised
    capital during the ICO craze was Sirin Labs, which has proceeded to manufacture
    the Finney Blockchain smartphones. Sirin Labs raised about US$157 million in December
    2017^([7](#ch12.xhtml#ch12fn7)).


    Indeed, even the mainstream mobile brands are designing hardware compatible with
    blockchain. The Taiwanese consumer electronics company HTC is one of those that
    have released smartphones with inbuilt blockchain capabilities^([1](#ch12.xhtml#ch12fn1)).
    Samsung, one of the leading brands in the smartphone industry, has also taken
    steps to provide users and developers with more blockchain capacity in their devices,
    including inbuilt wallets for making payments using cryptocurrencies.


    #### **Tokens**


    Basically, tokens and cryptocurrencies are created the same way. The primary difference
    between the two is their functions, or how they are used. Cryptocurrencies are
    used as ordinary money to buy goods and services. Tokens, on the other hand, are
    used for a specific purpose. For example, the Storj token can only be used to
    pay for storage space on the Storj network, a decentralised cloud storage platform,
    and not to make payments elsewhere. The Ethereum Gas token lets you access the
    Ethereum virtual machine (EVM), where you can run your applications. Storj coin
    and Ethereum Gas represent a category of tokens known as utility tokens. Utility
    coins are used to pay for a specific product or service, but they are also used
    to provide access to particular platforms.


    Another category of tokens are the security tokens (which we talked about in [Chapter
    3](#ch03.xhtml)), which are explicitly created to be sold to investors as a way
    to raise capital. Most security tokens also end up being utility tokens. For instance,
    a startup can sell tokens to raise funds, but those tokens even end up serving
    a specific function in their internal system or network. In particular, the tokens
    can be used to pay for a service, access, or other forms of products.


    Many startups that want to release tokens to the market are careful to package
    them as utility tokens, because regulators globally are coming down very hard
    on tokens that are sold to raise capital. The general view is that any startup
    selling them should follow the stringent requirements for issuing capital share.
    Indeed, it was the crackdown on the sale of tokens to raise capital that slowed
    down the ICO craze of 2017 and 2018. In that two years, startups had raised a
    total of more than US$30 billion. Some like Telegram managed to raise as much
    as US$1.5 billion.


    With that stated, tokens are a potential payment method on the blockchain, especially
    within specific networks and platforms. Tokens on the blockchain can easily take
    the place of traditional loyalty points. Not to mention that they are very easy
    to create using smart contract applications on the Ethereum blockchain. You could
    take about ten minutes from reading this book and create your own tokens on a
    platform like the Waves blockchain. First, though, you would need to visit the
    Waves platform to download and install the core client on your computer. After
    creating an account, you create your tokens easily and quickly by choosing your
    specifications^([8](#ch12.xhtml#ch12fn8)).


    #### **Stablecoins**


    Finally, let’s look at stablecoins, which were created as a response to the wild
    volatility of the blockchain assets. By now we realise that the price of most
    cryptocurrencies is definitely wild, especially when paired against fiat currencies
    such as the US dollar. If you hold most blockchain assets, you should be prepared
    to gain or lose a lot of value within a matter of minutes. Stablecoins are digital
    assets on the blockchain that are pegged on more stable assets in a ratio of 1:1.


    As the name suggests, it is supposed to make them less volatile or more stable,
    especially when paired with fiat currencies.


    Most stablecoins in the market at the moment are pegged against the US dollar.
    A stablecoin offers users the agility and flexibility of the cryptocurrency as
    well as the relative stability of the US dollar. It makes it easy to move value
    around the globe while at the same time protecting against volatility. Stablecoins
    have become a payment method of choice, especially on exchanges where traders
    need to make payments in US dollars to acquire cryptos or sell cryptos for US
    dollars in a speedy way.'
