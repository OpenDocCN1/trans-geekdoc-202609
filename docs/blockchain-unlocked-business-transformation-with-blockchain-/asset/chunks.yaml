    The use of blockchain for payments is extensive and can be classified into three
    primary types: (1) customer to customer (C2C) payment solutions, (2) business
    to business (B2B) payment solutions, and (3) a combination of these, which can
    be B2C or even C2B. Since the last can easily be understood after going through
    the first two, we are going to spend time on those in this chapter.


    The customer to customer (C2C) blockchain payment solutions falls into three further
    subtypes: cryptocurrencies, tokens, and stablecoins. However, before we turn our
    attention to them, we have to first go through what makes blockchain payment solutions
    unique.


    ### Blockchain benefits for payments


    Before the blockchain, even in the Internet era, it was not practical for a sender
    to get money to a receiver without a middle person, unless they were close enough
    for money to exchange hands physically. A middle person usually had to facilitate
    the transaction and understandably take a cut for their trouble (more about the
    cost in a moment). On the blockchain, it is technically possible to send value
    in the peer-to-peer path or channel, even if the sender and the receiver are on
    the opposite ends of the globe. In addition, the technology offers several advantages.
    Let’s discuss two main benefits.


    #### Improved security for payment transactions online


    First, blockchain provides improved security to payment transactions between the
    sender and receiver. It achieves this through the use of public-private key cryptography
    as well as the immutability of the ledger on which the transaction is executed.
    This is not to say the value on the blockchain cannot be stolen. It has happened
    many times. Tens of millions of dollars’ worth of cryptocurrencies are stolen
    annually from exchanges and individuals. However, the technology provides better
    tools for safeguarding payment transactions.


    #### More privacy for payment transactions online


    Secondly, as we have already learnt from previous chapters, the technology makes
    payment transactions online more private because it applies cryptography and pseudo-anonymity.
    Thus, while the transaction ledger is public, users can mask their identity on
    the blockchain by generating random public addresses to use instead of personally-identifying
    information like a real name or ID number. And since the random public address
    does not need to be attached to one’s real-world identity, one reading through
    the shared public ledger cannot tell who exactly the participants in each recorded
    payment transaction are.


    Moreover, payment transactions executed on the blockchain are relatively faster
    than the other options we have, especially for sending large amounts of money.
    A bank wire transfer might take up to a week for money to move from one part of
    the world to another. On the blockchain, however, it takes seconds to minutes,
    the amount and distance notwithstanding.


    Even though payment transactions on the blockchain are secure, private, and faster,
    they are relatively cheaper compared to payments made through trusted centralised
    third parties. With most blockchains, the business model does not put pressure
    on the end-users in terms of high fees, though they do have to pay fees for blockchain
    payments.


    For example, on the Bitcoin blockchain, you often need to attach a fee to hasten
    the process of confirming the transaction. After all Bitcoins have been mined,
    the fees paid by users will become the primary incentive for miners to continue
    keeping their machines running and maintain the shared ledger. Thus, over time
    the fees will become mandatory for transactions to be verified and recorded on
    the shared ledger.


    However, any fees paid by users on the Bitcoin blockchain are determined by a
    protocol, not a private business that bases such decisions on making more profits
    for its shareholders. Also, new protocols are being developed that will not require
    users to pay any fees. On the IOTA blockchain, for example, users have to do some
    work, which involves confirming two previous transactions, for their own transaction
    to be approved^([1](#ch12.xhtml#ch12fn1)).

