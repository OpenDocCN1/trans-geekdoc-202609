- raw: 'The third value that blockchain offers businesses is the ability to create
    sovereign digital assets. These are digital assets that exist on the Internet
    independently of your business and are valuable assets with a life of their own.
    These assets include currencies, securities, and tokens, which we discussed in
    [Chapter 3](#ch03.xhtml). While your small business might have no reason to create
    a digital currency, it might have a use for tokens and securities. Tokens created
    on the blockchain could be useful to a business in many ways. They can be used
    in a loyalty points system, for example, or to tokenise realworld assets. For
    instance, if you are a real estate agent, you could tokenise the property you
    control and make it easy to track, transact, and manage. You can also use tokens
    as an incentive in the game theory of your online system to reward specific actions.


    Perhaps we are most familiar with the use of tokens as a tool for raising capital
    through ICO and Initial Exchange Offerings (IEO). In this case, you create a token
    on the blockchain and sell it to the public as a means of getting money to fund
    specific projects. When these tokens are sold to raise capital, they are easily
    reclassified as securities, which then calls for the issuer to meet existing regulatory
    requirements for issuing equity shares. Nevertheless, the blockchain makes it
    easier to tokenise capital technologically.


    #### **4\. Privacy**


    The fourth value that the blockchain technology offers is for parties to securely
    and effectively transact online without having to disclose much of their personal
    information. Earlier I explained the concepts of anonymity and pseudo-anonymity
    that exist on the blockchain. If you need to assure customers of their privacy
    while transacting online with your business, then the blockchain is a technology
    worth exploring. It has the necessary tools that make it possible to offer your
    customers the highest level of privacy. It can be argued that privacy is the primary
    selling point of the blockchain technology. Indeed, most people choosing to use
    blockchain applications, in particular, payment solutions, do so primarily because
    of the privacy that they believe the technology gives them. Often, they sacrifice
    smooth user experience and fast transactions for confidentiality.


    #### **5\. Smart contracts**


    The fifth value that the blockchain offers is smart contracts. The application
    allows two or more parties to write an agreement in code and have it self execute
    when predefined conditions are met. Since the blockchain is immutable, once the
    contract is launched, no party can change it. It has to run to its conclusion.
    Besides the immutability of records, what makes blockchain the most suitable technology
    for hosting smart contracts, is the native currency aspect. It is true that most
    contracts involve money. Using conventional payment methods to settle a self-executing
    smart contract is a challenge mainly because the payments can be reversed, cancelled,
    or frozen. Entering into a smart contract on the blockchain that uses a blockchain
    native currency assures all counterparties that every part of the agreement can
    be performed. Some have described the smart contract as the most revolutionary
    application of the blockchain.


    ### **Customising your blockchain**


    We have gone through some possible values of the blockchain for your business.
    Each value is customisable in many ways. Using the blockchain in your business
    will involve delicate balancing acts. You may have to sacrifice some things for
    others. For example, speed for privacy, security, and immutability.


    Moreover, certain things assumed to be offered by the blockchain turn out not
    to be so. One of these is efficiency. Compared to centralised systems, blockchains
    are often less efficient. In many cases, users have had to trade efficiency, convenience,
    and great user experience for things like security and privacy. Before jumping
    onto the blockchain bandwagon, you need to ask which value you seek, and whether
    you can get it elsewhere without such sacrifices. With that said, future faster
    blockchains with far better user experience are being developed.


    It is important to emphasise the need to customise the technology for your business.
    As with the Internet, how one business uses it is often quite different from another,
    customising it to fit its specific needs and requirements. You should think of
    blockchain in the same way.


    ^([1](#ch07.xhtml#ich07fn1)) Steinberg, Scott. “Cyberattacks Now Cost Companies
    $200,000 on Average, Putting Many out of Business.” CNBC, 9 Mar. 2020, [www.cnbc.com/2019/10/13/cyberattacks-cost-small-companies-200k-putting-many-out-of-business.html](http://www.cnbc.com/2019/10/13/cyberattacks-cost-small-companies-200k-putting-many-out-of-business.html).


    | ![image](images/ch-8.jpg) || **Taking the Leap to Blockchain** |


    | --- | --- |


    You can design and build your own blockchain for your business. However, before
    embarking on this journey, consider the following three questions carefully: (1)
    do you really need a new blockchain?, (2) do you have the capacity to design and
    build a new blockchain?, (3) can you bring together and inspire a community to
    support and maintain it so that in the long term, it is a genuine blockchain?


    If any answer to these questions is a “no”, then it is simple: do not proceed
    with designing and building a blockchain for your business, because you are highly
    likely to fail in the endeavour. Besides, you are putting yourself in a situation
    where you will accumulate costs that could probably never be recouped.


    To help you decide whether at the end of it all you should even consider designing
    and building a blockchain, let’s go through these three critical questions in
    detail.


    ### **Do you need your own blockchain?**


    The fact that your business needs a blockchain solution in its systems and processes
    does not directly translate to having to design and build it yourself. In fact,
    the majority of businesses do not, and will never, need to build any blockchain
    to benefit from the technology. We can think of a business building a new blockchain
    for its needs in the same vein as attempting to build the Internet from scratch
    to, for example, support an e-commerce site or run a sales management application.
    It does not make sense.


    It takes a lot of resources to build a new blockchain. I don’t just mean money,
    but time and expertise too. Some might even say blockchain is its own specialisation
    within the programming community. It is unlikely that a business owner will learn
    how to write a blockchain to save costs. He or she would have the big picture
    in mind when it comes to his business and may read up on it to know how to communicate
    with the developers.


    That stated, it is still very early days for blockchain. Therefore, many businesses
    will find that they have to build some kind of infrastructure from scratch as
    nobody else has built the kind of foundation they need. With time, however, there
    will be less need to build the basic blockchain infrastructures. After all, they
    are mostly technological “common areas”, where an infinite number of businesses
    can use a single blockchain.


    ### **How to access blockchain for business?**


    It is essential to recognise that blockchain solutions are accessible to businesses
    on three basic levels.


    #### **Using existing applications**


    On the topmost level, a business gets services from existing applications on existing
    blockchains. On this level, a business does not build anything. Instead, in many
    cases all it has to do is plug in and start using a blockchain solution. Many
    companies are now designing and building enterprise blockchain solutions in the
    form of dApps, that other businesses can tap into and use often at a fee.'
  fmt: '

    区块链为企业提供的第三大价值是创建主权数字资产的能力。这些数字资产独立于您的业务存在于互联网上，本身就是具有生命周期的宝贵资产。这些资产包括货币、证券和代币，我们在[第
    3 章](#ch03.xhtml)中已对此进行了讨论。虽然您的小型企业可能没有理由创建数字货币，但可能会用到代币和证券。在区块链上创建的代币可用于企业的许多方面。例如，它们可用于忠诚度积分系统，或用于将现实世界资产代币化。例如，如果您是房地产经纪人，您可以将您控制的房产代币化，使其易于追踪、交易和管理。您还可以在在线系统的博弈论中使用代币作为激励，以奖励特定行为。


    我们或许最熟悉的是将代币作为通过 ICO（首次代币发行）和 IEO（首次交易所发行）筹集资金的工具。在这种情况下，您在区块链上创建代币并将其出售给公众，以筹集资金资助特定项目。当这些代币被出售以筹集资金时，它们很容易被重新归类为证券，这要求发行人必须满足发行股权的现有监管要求。尽管如此，区块链在技术上使资本代币化变得更加容易。


    #### 4. 隐私


    区块链技术提供的第四大价值是各方能够在不披露大量个人信息的情况下，安全有效地在线交易。前文我已解释了区块链上存在的匿名性和伪匿名性概念。如果您需要在客户与您的业务在线交易时向其保证隐私，那么区块链是一项值得探索的技术。它拥有必要的工具，使您能够为客户提供最高级别的隐私保护。有人认为隐私是区块链技术的主要卖点。确实，大多数选择使用区块链应用（特别是支付解决方案）的人，主要是因为他们相信该技术能提供隐私。为此，他们往往牺牲了流畅的用户体验和快速的交易速度。


    #### 5. 智能合约


    区块链提供的第五大价值是智能合约。该应用允许两方或多方以代码形式编写协议，并在满足预定义条件时自动执行。由于区块链具有不可篡改性，一旦合约启动，任何一方都无法更改，必须运行至结束。除了记录的不可篡改性，使区块链成为托管智能合约最合适技术的原因是原生货币属性。确实，大多数合约都涉及资金。使用传统支付方式结算自动执行的智能合约极具挑战性，主要是因为支付可能被撤销、取消或冻结。在区块链上签订使用区块链原生货币的智能合约，可向所有对手方保证协议的每一部分都能得到履行。有人将智能合约描述为区块链最具革命性的应用。


    ### 定制您的区块链


    我们已经探讨了区块链为您的业务带来的几种可能价值。每种价值都有多种定制方式。在您的业务中使用区块链将涉及微妙的平衡。您可能需要为了其他方面而牺牲某些东西。例如，为了隐私、安全性和不可篡改性而牺牲速度。


    此外，某些被认为区块链提供的特性，实际上并非如此。其中之一是效率。与中心化系统相比，区块链通常效率较低。在许多情况下，用户不得不以效率、便利性和良好的用户体验为代价，换取安全性和隐私等特性。在盲目跟风区块链之前，您需要询问自己寻求哪种价值，以及是否可以在不做此类牺牲的情况下从其他地方获得。话虽如此，未来正在开发速度更快、用户体验好得多的区块链。


    必须强调为您的业务定制技术的必要性。正如互联网一样，一家企业使用它的方式往往与另一家截然不同，会根据其特定需求和要求进行定制。您应以同样的方式看待区块链。


    ^[1](#ch07.xhtml#ich07fn1) Steinberg, Scott. “Cyberattacks Now Cost Companies
    $200,000 on Average, Putting Many out of Business.” CNBC, 9 Mar. 2020, [www.cnbc.com/2019/10/13/cyberattacks-cost-small-companies-200k-putting-many-out-of-business.html](http://www.cnbc.com/2019/10/13/cyberattacks-cost-small-companies-200k-putting-many-out-of-business.html).


    | ![image](images/ch-8.jpg) | | **跨越至区块链** |

    | --- | --- | --- |


    您可以为您的业务设计并构建自己的区块链。然而，在踏上这段旅程之前，请仔细考虑以下三个问题：(1) 您真的需要一个新区块链吗？(2) 您有设计和构建新区块链的能力吗？(3)
    您能否聚集并激励一个社区来支持和维护它，使其长期来看成为一个真正的区块链？


    如果对这些问题的任何回答是“否”，那么很简单：不要继续为您的业务设计和构建区块链，因为您极有可能在这项事业中失败。此外，您将使自己陷入积累可能永远无法收回的成本的境地。


    为了帮助您决定最终是否应考虑设计和构建区块链，让我们详细探讨这三个关键问题。


    ### 您需要自己的区块链吗？


    您的业务在其系统和流程中需要区块链解决方案，这并不直接意味着您必须亲自设计和构建它。事实上，绝大多数企业不需要，也永远不需要构建任何区块链就能从该技术中受益。我们可以将企业为其需求构建新区块链，比作为了支持电子商务网站或运行销售管理应用而尝试从头构建互联网。这说不通。


    构建新区块链需要大量资源。我不仅指资金，还包括时间和专业知识。甚至有人会说区块链是编程社区内的一个独立专业领域。企业主不太可能为了省钱而学习如何编写区块链。他或她会从大局考虑业务，并可能阅读相关资料以了解如何与开发人员沟通。


    话虽如此，区块链仍处于早期阶段。因此，许多企业会发现他们必须从头构建某种基础设施，因为没有其他人构建过他们所需的那种基础。然而，随着时间的推移，构建基础区块链基础设施的需求将减少。毕竟，它们主要是技术“公共区域”，无数企业可以使用单一区块链。


    ### 如何为业务接入区块链？


    必须认识到，区块链解决方案可在三个基本层面上为企业所用。


    #### 使用现有应用


    在最顶层，企业从现有区块链上的现有应用获取服务。在此层面，企业无需构建任何东西。相反，在许多情况下，它只需接入并开始使用区块链解决方案。许多公司现在正在以
    dApp（去中心化应用）的形式设计和构建企业级区块链解决方案，其他企业可以接入并使用，通常需要支付费用。

    '
