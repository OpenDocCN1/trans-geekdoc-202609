    # About the Publisher


    Founded in 1999, Candid Creation Publishing is an independent English-Chinese
    bilingual publishing house based in Singapore.


    We provide a one-stop publishing service that takes individuals and organizations
    from idea to market. Our objective is to lower the barriers to getting published
    and to make professional publishing accessible to all and with a personal touch.


    In contrast to self-publishing services, every book by Candid Creation is carefully
    curated by experienced professionals to ensure all titles meet the highest quality
    standard. Our professional services include consultancy, coaching, conceptualization,
    planning, project management, writing, translation, copyediting, design, illustration,
    typesetting, proofreading, printing,  e-book publishing, distribution, sales and
    marketing.


    We have built a reputation of being the publisher of choice for many renowned
    personalities and esteemed organizations, an honour made even more special as
    this was made possible through personal recommendations from the satisfied clients
    we have served.


    We are book publishers who do not restrict ourselves to any particular genre of
    books but instead, seek to understand the needs of our authors in order to extract
    and express their voice through their books. We have helped hundreds of authors
    from the age of 12 to 80 to publish their books in both print (pbook) and digital
    formats (e-book). To date, we have published over 300 titles in a wide variety
    of genres that include categories such as: the arts, autobiographies, children’s
    books, critical prose, finance, humanities, literature, medical, music, personality
    profiles and self-improvement; among many others.


    Candid Creation Publishing is a member of the Singapore Book Publishers Association.


    Website: www.candidcreation.com'
