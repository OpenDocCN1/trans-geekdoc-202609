    Bitfinex.” Bloomberg.com, Apr. 2019, [www.bloomberg.com/news/articles/2019-04-25/bitfinex-operator-accused-by-new-york-of-850-million-coverup?srnd=cryptocurrencies](http://www.bloomberg.com/news/articles/2019-04-25/bitfinex-operator-accused-by-new-york-of-850-million-coverup?srnd=cryptocurrencies)。


    ^(10) “Record High Remittances Sent Globally in 2018.” World Bank, 8 Apr. 2019,
    [www.worldbank.org/en/news/press-release/2019/04/08/record-high-remittances-sent-globally-in-2018](http://www.worldbank.org/en/news/press-release/2019/04/08/record-high-remittances-sent-globally-in-2018)。


    | ![image](img/ch-13.jpg) | | **用例 5：医疗保健** |

    | --- | --- | --- |


    区块链有望在医疗保健领域实现最具颠覆性的变革之一。这体现在：(1) 使高效的医疗信息管理系统成为可能，该系统在国家和国际层面均可互操作；(2) 提供流程速度、数据安全以及患者隐私；最重要的是，(3)
    引入一种新颖的医疗数据所有权和使用模式，将患者置于信息管理系统的中心。


    最早期的医疗信息管理系统是基于纸质的。医疗服务提供者之间的数据共享主要依赖邮政服务。患者往往需要亲自将硬拷贝文件从一位医生处带到另一位医生处。

