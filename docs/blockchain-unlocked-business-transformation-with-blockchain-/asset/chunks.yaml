  trans: '


    # 区块链对商业模式的影响


    区块链将使许多商业模式乃至企业本身变得无关紧要。为了生存，大多数企业可能必须重新思考其模式。否则，它们将面临与柯达或百视达（Blockbuster）相同的灭亡风险，这些公司未能创新或升级业务以跟上世界潮流；柯达因数码相机的出现却坚持冲印照片，而百视达在
    YouTube 和 Netflix 时代却坚持出租 DVD。我们已经看到银行、保险公司和其他行业正在采取积极措施来了解这项技术及其如何影响其商业模式。


    即使是优步（Uber）和爱彼迎（Airbnb）等颠覆性企业，也很容易被颠覆，因为它们是聚合资源并在市场上出售的中心化实体。区块链使得例如乘客和司机可以在不通过优步等第三方的情况下会面并交易。通过一个不归任何企业实体所有的开源区块链应用，房东可以接触旅客，并借助智能合约高效地为他们服务，就像在爱彼迎上一样。而且他们不必将收入分成给任何人。


    尽管围绕区块链能做什么存在大量炒作，但有理由预期这项技术将显著改变我们做许多事情的方式。这意味着我们需要主动学习它。


    ## 参考文献


    1. "Deloitte''s 2019 Global Blockchain Survey: Blockchain Gets down to Business."
    Deloitte, 2019, [www2.deloitte.com/content/dam/Deloitte/se/Documents/risk/DI_2019-global-blockchain-survey.pdf](http://www2.deloitte.com/content/dam/Deloitte/se/Documents/risk/DI_2019-global-blockchain-survey.pdf)。

    2. Emspak, Jesse, and Kim Ann Zimmermann. "Internet History Timeline: ARPANET
    to the World Wide Web." LiveScience, Purch, 27 June 2017, [www.livescience.com/20727-internet-history.html](http://www.livescience.com/20727-internet-history.html)。

    3. Lamont, Tom. "Napster: the Day the Music Was Set Free." The Guardian, Guardian
    News and Media, 24 Feb. 2013, [www.theguardian.com/music/2013/feb/24/napster-music-free-file-sharing](http://www.theguardian.com/music/2013/feb/24/napster-music-free-file-sharing)。

    4. Nakamoto, Satoshi. *Bitcoin: A Peer-to-Peer Electronic Cash System*. Bitcoin.org,
    31 Oct. 2008.


    ---


    # 区块链不能做什么


    我们已经确定区块链能做很多事。它有潜力以我们许多人尚未想象的方式颠覆商业。但区块链不是灵丹妙药。它不是解决社会面临的每一个问题的万能方案，即使你访问任何在线区块链论坛或参加区块链聚会、峰会或会议时会有这种印象。认为这项技术能解决抛给它的任何问题的信念在该领域内非常普遍。


    想一想任何行业。很可能都有初创公司声称要为特定问题构建区块链解决方案。此类区块链初创公司如雨后春笋般涌现，在 2016 年和 2017 年达到顶峰，主要由首次代币发行（ICO）热潮驱动。在这两年里，区块链初创公司筹集了超过
    300 亿美元的投资。一家名为 Bancor 的初创公司，一个去中心化加密货币交易所，在三小时内筹集了 1.53 亿美元。另一家，基本注意力代币（BAT），一种在其浏览器网络上提供广告服务的数字广告代币，*在
    30 秒内*筹集了 3500 万美元。2017 年和 2018 年记录了数十个类似的区块链投资故事。


    然而，大多数初创公司除了精心润色的白皮书外一无所有。难怪大部分钱都打了水漂。全球大多数在这一时期筹集资金的初创公司要么从未交付任何可用产品，要么难以推出能与可行市场产生共鸣的东西。


    ## 区块链的塞壬之歌


    据区块链企业家、投资者、在线区块链创新中心 Blockgeeks 创始人 Ameer Rosic 称，高达 90% 的 ICO 都失败了[¹]。“事实是，大约
    99% 的 ICO 都会失败，”Ameer 在社交媒体帖子中表示，“这并非夸大其词的厄运论，过去几年里，成千上万种加密货币被创造出来，其中超过 90% 都失败了。”


    之所以有这么多项目挣扎，是因为它们要么拼凑出一个包含区块链的想法，要么匆忙在产品设计中加入该技术，只为从渴望参与区块链革命的投资者那里获取资金。公平地说，在产品描述中加入“区块链”一词很酷。这不知不觉让企业看起来富有创新、面向未来且紧跟技术趋势。即使是微软、三星、巴克莱等主要全球品牌也无法抗拒这种诱惑。


    2016 年和 2017 年为 ICO 投资而兜售的许多商业创意，如果完全不涉及区块链技术，实施效果可能会更好。很难确切地说是什么驱动了“区块链应无处不在”这一叙事。这或许是一场由公众自发组织的运动，因为他们失去了对治理世界各个方面机构的信任和信心。我猜这反映了人们夺回权力的渴望。


    但一旦某人发现并理解了该技术背后设计和架构的天才之处，随之而来的狂热情绪以及常随其后的经济利益，必然也起了作用。即使在技术提供最大价值的地方，它也有局限性；这在讨论区块链的论坛中几乎从未被提及。


    一般来说，区块链被推销为一种提供三大核心优势的技术：(1) 为数据和系统提供更好的安全性，(2) 改善用户在线隐私，以及 (3) 在速度、容量和成本方面提高更多效率。让我们逐一分析。


    ### 为数据和系统提供更好的安全性


    区块链是第一个使数字数据真正不可篡改的创新。一旦一组信息被记录在共享数字账本上，就无法被任意更改。这非常强大，因为这意味着现在可以使系统抵御多种形式的攻击，包括中间人攻击、SQL
    注入和恶意软件攻击。此外，由于系统使用公私钥加密，无需担心用于传输系统访问凭证（如密码和 PIN 码）的在线渠道的安全性。用户在本地（甚至离线）保存用于签署交易的私钥，仅共享相应的公钥。区块链还使用精心设计的共识机制，使得单个参与者不可能在未涉及其他关键利益相关者的情况下做出关键决策或更改记录。


    鉴于这些特性，区块链似乎是服务器后端存储和处理关键数据的绝佳替代品。例如，它可以为土地注册系统提供更好的后端。如果土地所有权证书存储在区块链后端上，黑客或持有合法凭证的不诚实人员都无法轻易篡改它们。


    [¹]: Ameer Rosic, Blockgeeks 创始人, 关于 ICO 失败率的社交媒体帖子。


    '
