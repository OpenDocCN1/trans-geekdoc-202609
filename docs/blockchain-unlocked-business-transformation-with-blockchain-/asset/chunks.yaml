- raw: 'Secondly, a business sets up a KYC system in place to meet requirements in
    the law and regulations. This is often cited as the primary reason, and it is
    also the only reason that does not benefit a business directly. Nevertheless,
    for some types of businesses, mostly those in the financial sector, to operate
    in most countries, they have to put in place a robust KYC system. It is part of
    the mechanism that regulators and law enforcement rely on to prevent criminal
    activities such as money laundering and terrorist financing. For a while, crypto-related
    businesses did not need to abide by these laws and regulations as theirs was a
    new business concept. However, now regulators are taking steps to include them
    in the list of those that need to abide by the existing KYC rules.


    Thirdly, KYC contributes to protecting consumers from the harmful activities of
    others. Both KYC and AML are often an impediment against corruption, drug trafficking,
    and scamming. That is because those who engage in these activities understand
    that they need to explain the sources of their proceeds to the financial institutions,
    and by extension, the law enforcement. It is also the same case for terrorist
    financing activities. Anyone who may want to fund violent activities understands
    that someone will be looking at and even recording their dealings. These criminal
    activities will on nevertheless, but regardless, the KYC and AML are in place
    and minimises the severity. While this reason is, to some extent, similar to the
    previous one, it does benefit the business. For example, by stalling scamming
    activities through identification and moderation, a business creates a safe environment
    for its customers. This puts it in a position to attract even more customers.


    The fourth importance of KYC is that it makes it easy to interoperate with others
    in service delivery. When one service provider can easily communicate with another
    in regard to a particular customer, it facilitates the second service provider
    giving a better service to the customer. For example, in the financial sector,
    one’s interaction with a bank might be very critical to how another might choose
    to serve that same customer. If, for example, they pay their mortgage according
    to an agreed schedule, the second bank might be in a position to decide they are
    creditworthy.


    Lastly, businesses need a KYC system to help service providers establish risk
    levels of particular customers. KYC is a backbone for credit issuance by financial
    institutions and forms the basis of product pricing as well as decisions to onboard.
    The credit score system, where customers are ranked according to their past repayment
    efforts and capability, helps the financial institutions avoid losses through
    defaulted loans. With new technologies such as blockchain, Big Data, AI, and IoT,
    new lending systems are emerging that are entirely based on data collected from
    users. For example, in the developing world (and in some of the developed countries),
    mobile phones have become the primary channel through which credit is issued to
    both individuals and small scale enterprises. The lending platforms on the mobile
    phone use personal data that they collect from the borrower’s use of the device
    and elsewhere as collateral. In fact, because of how efficient they are at processing
    and analysing the data, they do not require borrowers to fill any paperwork nor
    provide any physical collateral for the loan. And even a first-time application
    takes just a few minutes to be approved.


    #### **Anti Money Laundering (AML)**


    Anti Money Laundering (AML) is everything put in place to prevent criminals from
    stealthily bringing funds illegally acquired into the mainstream as clean money,
    including laws, regulations, and processes. In the 20th century, governments around
    the world extended the fight on crime to include making it difficult to spend
    its proceeds. Financial institutions are legally required to ascertain sources
    of funds going through their systems and report suspicious transactions to authorities.
    These measures have resulted in the rise of money laundering, where individuals
    and entities engaged in illegal activities such as drug trafficking or larceny
    mask what they generate as proceeds of genuine and legal businesses. The vice
    is very complicated in many cases, which makes it essential that robust systems
    are put in place to counter it. It is important to point out that AML is the component
    that follows KYC.


    The KYC and AML systems have come a long way, aided by technology over time. In
    particular, ICT has helped with allowing information to flow. However, the systems
    have challenges that have remained unsolved.


    One of those challenges is the high cost. According to a report that Thomson Reuters
    published in 2016, entities within the financial sector spend between US$60 million
    and US$500 million annually on KYC and AML compliance-related activities. That
    is a considerable cost, especially when you consider other industries as well.
    Of course, this cost, in the end, is passed on to the consumers making services
    really expensive for a section of the population. It also eats into the profits
    that the service providers could possibly make.


    Despite the enormous budgets, the success rate is very low. In fact, one report
    has indicated that regulators and financial institutions are only able to catch
    about one percent of the entire amount of money that is laundered every year around
    the world—a pretty low success rate by any standards. The weak performance is
    mostly because of the slow sharing of data and over-reliance on people, to be
    honest, and provide the right information about their activities.


    Errors can also occur in paper-based or ICT systems, primarily as they have to
    rely a lot on human intervention. When information is manually passed from a financial
    institution to a regulator or from a financial institution to another or regulator
    to another, bits of data can be lost or misrepresented.


    Also, sharing information is often not in real time. Owing to the sensitivity
    of the centralised systems, whose security depends on controlling access, information
    is often shared among different stakeholders through case by case basis, which
    means that many illegal transactions can go through the system without detection.
    Closely related to the lack of sharing of data is poor interoperability between
    different financial institutions and regulators around the world. Without sharing
    of information, it is easier for money laundering activities, especially those
    that go across international borders to go undetected.


    Another challenge is the duplication of activities and tasks, which happens both
    within the organisation and across the supply chain. A customer may have to go
    through the same verification process at different stages in the same institution
    or every time they show up for a service, which not only slows service delivery
    but also adds a cost that the institution has to absorb. The same applies when
    it is across the supply chain. If entities can collaborate and share data, then
    they all can avoid duplicating tasks, and that can cut the cost of all that is
    on the supply chain.


    Centralised systems also result in slow service delivery. For example, in the
    financial sector, vast amounts of transactions have to go through an “AML holding
    period”, which is often more than five business days. During this period, the
    money is supposed to remain in an account as background checks are done to determine
    whether the funds are proceeds of money laundering. This AML holding period can
    set back a business transaction significantly.


    Last but not least, a lack of transparency leaves customers in the dark about
    the information held by companies and regulators. They also do not have access
    to the process of making decisions that affect them.


    The blockchain offers to fix most of these challenges and also provides an even
    better experience for customers.'
