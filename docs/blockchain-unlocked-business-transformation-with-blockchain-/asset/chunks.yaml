    \n^([4](#ch14.xhtml#ich14fn4)) Meeusen, Paul. “ Shipping Containers and B3i: What’s\
    \ the Connection?” B3i, 10 Jan. 2017, [b3i.tech/news-reader/Blog\\_2.html](http://b3i.tech/news-reader/Blog_2.html).\n\
    \n^([5](#ch14.xhtml#ich14fn5)) “OpenIDL (Open Insurance Data Link): the First\
    \ Blockchain Network Connecting Data across the Insurance Industry.” AAIS, [aaisonline.com/openidl](http://aaisonline.com/openidl).\n\
    \n^([6](#ch14.xhtml#ich14fn6)) “Aon, Oxfam, and Etherisc Launch First Blockchain-Based\
    \ Agricultural Insurance Policies for Smallholder Farmers in Sri Lanka.” Oxfam,\
    \ 1 July 2019, [sri-lanka.oxfam.org/latest/press-release/aon-oxfam-and-etherisc-launch-first-blockchain-based-agricultural-insurance](http://sri-lanka.oxfam.org/latest/press-release/aon-oxfam-and-etherisc-launch-first-blockchain-based-agricultural-insurance).\n\
    \n^([7](#ch14.xhtml#ich14fn7)) Daley, Sam. “Nine Companies Using Blockchain to\
