    devices, would facilitate farmers insuring their crops against extreme weather.
    Since most of the processes are automated on the blockchain, the cost is reduced,
    making the premium payable relatively low. Also, the farmers do not need to submit
    claims. Instead, the system put in place can detect and determine when the weather
    has been extreme enough to destroy the crop in the farm, triggering a smart contract-driven
    claim settlement.


    One of Etherisc’s first licensed products is a flight delay insurance, which travellers
    buy to be compensated in case their flight is delayed or cancelled. To qualify,
    the insurance application has to be 24 hours before the scheduled flight and can
    confirm the trip from an oracle online. The traveller provides a receipt to prove
    that he or she is booked for the flight. Once the policy is paid for, either in
    crypto or traditional payment methods, a smart contract on the Ethereum blockchain
    is activated and relies on data about the flight fed by the oracle to make critical
    decisions about the policy. In the event the flight is delayed or cancelled, no
    paperwork or form needs to be filled to make a claim. The smart contract automatically
    receives the notification, triggering a payout.


    Other Etherisc products include hurricane protection, crypto wallet insurance
    (which compensates you in the event your crypto wallet is broken into, and your
    digital assets are stolen), and social insurance. Etherisc is just one among many
    insurance blockchain startups. Other startups include Guardtime, Fidentiax, Dynamis,
    and Lemonade[^7].


    ## Challenges in using blockchain

    '
