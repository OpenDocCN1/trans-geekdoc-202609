- raw: 'It also turns out that businesses usually do not have a direct control over
    the entire supply chain of its products. For example, a bakery can directly control
    from whom it buys ingredients and how it makes the bread. However, it cannot control
    how the wheat is grown or sugar processed.


    A business’s only leverage is to use available information to choose the right
    business partners. With this, a business can tell easily how the supply chains
    of its partners affect its own supply chain and by extension its profitability.
    Indeed, freely available information offers a business a lot of powers to choose
    its partners.


    Unfortunately, right information is not always forthcoming, because everyone wants
    to present their best side to the world. Sometimes this means being dishonest
    or leaving out critical details, especially where profits are involved. The good
    news is that blockchain can solve this problem to a large extent. The technology
    promises to let everyone to get the most reliable information from any section
    of the supply chain so that they can use it to make sound business decisions.


    Businesses and end consumers have similar needs for making good decisions when
    it comes to information about supply chains. Like businesses, consumers often
    want to know how the supply chains of those they transact with affect them. For
    example, a consumer might want to know if the bread they buy from the retail store
    is made from organically grown ingredients or how much carbon print it has accumulated.


    Regardless of whether you are a producer, a supplier, a manufacturer, a retailer
    or even a consumer, the supply chain must work well for you. It should deliver
    the right goods and services at the right time and at the best price, but also
    provide credible data to help with decision making.


    ### **Blockchain for a “third generation” supply chain**


    A supply chain that leads to a better experience for all stakeholders takes excellent
    management. Supply chain management is simply the process of making sure that
    the supply chain is efficient and serves the interests of an organisation, and
    even those of an end consumer, appropriately. Most organisations have someone
    who specifically takes care of this part of its business. This person is referred
    to as a supply chain manager or logistics manager. Their work involves ensuring
    that the organisation uses a supply chain with the least friction, which has the
    least cost and provides the best results or quality. As you can imagine, doing
    this needs access to quality information.


    The blockchain is about to usher in what I call the “third generation” supply
    chain management systems. Before we look at what that is exactly, let’s first
    look at what we have had up to this point. The first generation supply chain systems
    were paper-based. Every record was written down or printed on paper and filed
    in cabinets. Meanwhile, the post office played a critical role by being the primary
    carrier of communication between businesses.


    Even though the supply chain data was very detailed and could be very useful,
    its full potential was hardly realised, because it was difficult to retrieve and
    analyse. It existed mostly in silos—file cabinets kept away in offices. A way
    to integrate the information held by different stakeholders did not exist and,
    therefore, a broader and clearer picture of a supply chain could not be drawn.
    A business could only know as much about the supply chain it had no direct control
    over as what others were willing to share. Meanwhile, consumers were almost completely
    locked out from the system. They had to rely on what the retail store or the marketers
    told them for all their shopping decisions.


    The Internet brought about the second generation of supply chain management systems.
    Information was digitised and, more importantly, could be remotely accessed. However,
    digital data on the Internet came with its own challenges. At the top of the list
    was the difficulty to preserve information integrity. It became even easier to
    falsify files. While files can be shared remotely over the Internet, the security
    of the servers on which they are hosted is always under threat from hackers and
    anyone who want to change, delete, or manipulate the information. And even though
    digital information can move practically at the speed of light, payment methods
    have remained slow, sometimes taking weeks to complete a transaction.


    The blockchain can fix these weaknesses of the digital supply chain management
    systems, and it can do even more. Let’s look in detail at the four things the
    blockchain is doing to supply chain management. These are adding efficiency and
    cutting costs, making compliance and certification reliable, providing secure
    provenance, and making trade finance better than what has been for decades.


    #### **Adding efficiency and cutting costs**


    The blockchain can significantly cut the costs incurred in the current supply
    chain management systems in several ways. Buying expensive supply chain management
    software solutions could become unnecessary. As a peer-to-peer open source protocol
    managed through community consensus, the blockchain is a product does not require
    payment to access. The technology also removes the need to maintain or lease servers.
    As a common ledger shared by all stakeholders, there can be little duplication
    of information or tasks.


    Blockchain also secures digital files shared by stakeholders, because information
    on the blockchain becomes immutable. Once a file is created and stored on the
    ledger, it cannot be changed arbitrarily by anyone, including its creator. Also,
    the threat of hacking to systems is little without a centralised server to attack.
    Instead, in its place thousands of independent computers act as a single unit
    to store data and execute application code. However, users have to protect their
    private keys for specific files. Meanwhile, the technology offers tools, in particular
    smart contract applications, which allow business counterparts to give limited
    access to each other’s files. For example, if A is doing business with B, each
    can open up files for the other for the duration of the transaction. Once the
    transaction is done, the access is stopped.


    #### **Making compliance and certification reliable**


    The blockchain offers superior ways to protect inspection and audit reports for
    compliance and quality certification purposes. As things stand today, an organisation
    can claim to have a certification even if it does not. Or it can falsify inspection
    records and fool its partners on the supply chain. A certifying or auditing authority
    can publish a certificate or a report on the blockchain that is accessible to
    everyone. Even though the certification is issued directly to the business, its
    details cannot be changed due to the immutability of the blockchain. Meanwhile,
    the audited entity has the power to determine who can view the report. On the
    blockchain you do not have to trust the holder of a piece of information but rather
    the system that generated it.


    #### **Providing secure provenance**


    In regard to provenance, the blockchain offers what the modern end consumers really
    seek. In recent years consumers have become more interested to know the details
    of the journey behind products. For example, they may want to know the source
    of energy used to manufacture the products, whether the labour was fairly remunerated,
    or that no child labour was involved. They may have questions for health reasons,
    about raw materials from the manufacturer used or whether it was grown organically.
    Today’s consumers want to be sure that the supply chain is not only ethical but
    also safe for them, others, and the environment.'
  fmt: '

    事实证明，企业通常无法直接控制其产品的整个供应链。例如，面包店可以直接控制从谁那里购买原料以及如何制作面包。但是，它无法控制小麦如何种植或糖如何加工。


    企业唯一的筹码是利用可用信息选择合适的商业伙伴。借此，企业可以轻松判断其合作伙伴的供应链如何影响自身的供应链，进而影响其盈利能力。确实，免费可用的信息赋予了企业选择合作伙伴的巨大权力。


    不幸的是，真实信息并不总是触手可及，因为每个人都想向世界展示最好的一面。有时这意味着不诚实或隐瞒关键细节，尤其是在涉及利润时。好消息是，区块链在很大程度上可以解决这个问题。该技术承诺让每个人都能从供应链的任何环节获取最可靠的信息，以便据此做出明智的商业决策。


    企业和最终消费者在供应链信息方面有着相似的需求，都需要做出良好的决策。就像企业一样，消费者往往想知道其交易对象的供应链如何影响自己。例如，消费者可能想知道从零售店购买的面包是否使用有机种植的原料制作，或者其积累了多少碳足迹。


    无论你是生产商、供应商、制造商、零售商，甚至是消费者，供应链都必须为你良好运作。它应在合适的时间以最优价格提供合适的商品和服务，同时提供可信的数据以辅助决策。


    ### 区块链助力“第三代”供应链


    一个能为所有利益相关者带来更好体验的供应链，需要卓越的管理。供应链管理简单来说就是确保供应链高效运行，并适当服务于组织乃至最终消费者利益的过程。大多数组织都有专人负责这部分业务，此人被称为供应链经理或物流经理。他们的工作涉及确保组织使用摩擦最小、成本最低且能提供最佳结果或质量的供应链。正如你所想，做到这一点需要获取高质量的信息。


    区块链即将引入我所谓的“第三代”供应链管理系统。在探讨其具体内涵之前，让我们先回顾一下迄今为止的发展历程。第一代供应链系统基于纸质记录。每一笔记录都手写或打印在纸上，归档在文件柜中。同时，邮局作为企业间通信的主要载体，发挥了关键作用。


    尽管供应链数据非常详细且极具潜在价值，但其全部潜力几乎未被发掘，因为检索和分析困难。数据大多孤立存在——锁在办公室的文件柜里。缺乏整合不同利益相关者所持信息的方式，因此无法勾勒出供应链的全貌。企业对无法直接控制的供应链的了解，仅限于他人愿意分享的内容。与此同时，消费者几乎完全被排除在体系之外。他们不得不依赖零售店或营销人员的说法来做所有购物决策。


    互联网带来了第二代供应链管理系统。信息实现了数字化，更重要的是可以远程访问。然而，互联网上的数字数据也带来了自身的挑战。首要问题是难以保证信息完整性。伪造文件变得更加容易。虽然文件可以通过互联网远程共享，但托管文件的服务器安全性始终受到黑客及篡改、删除、操纵信息者的威胁。即使数字信息能以接近光速传输，支付方式依然缓慢，有时完成一笔交易需要数周。


    区块链可以修复数字供应链管理系统的这些弱点，并能做得更多。让我们详细了解区块链正在为供应链管理带来的四大变革：提升效率并降低成本、使合规与认证可靠、提供安全的溯源、改善贸易融资，使其超越过去几十年的水平。


    #### 提升效率并降低成本


    区块链可通过多种方式大幅削减当前供应链管理系统的成本。购买昂贵的供应链管理软件解决方案可能变得不再必要。作为一种通过社区共识管理的点对点开源协议，区块链是一种无需付费即可访问的产品。该技术还消除了维护或租赁服务器的需求。作为所有利益相关者共享的公共账本，信息或任务的重复极少。


    区块链还能保护利益相关者共享的数字文件，因为上链信息具有不可篡改性。一旦文件创建并存储在账本上，任何人（包括创建者）都无法随意更改。此外，由于没有中心化服务器可供攻击，系统遭受黑客攻击的威胁微乎其微。取而代之的是，成千上万台独立计算机作为一个整体存储数据并执行应用代码。不过，用户必须保护特定文件的私钥。同时，该技术提供了工具，特别是智能合约应用，允许业务对方授予对彼此文件的有限访问权限。例如，如果
    A 与 B 开展业务，双方可在交易期间向对方开放文件。交易完成后，访问权限即停止。


    #### 使合规与认证可靠


    区块链为保护用于合规和质量认证的检查及审计报告提供了更优方案。在现状下，组织可能声称拥有并不存在的认证，或伪造检查记录欺骗供应链合作伙伴。认证或审计机构可在区块链上发布所有人均可访问的证书或报告。尽管认证直接颁发给企业，但因区块链的不可篡改性，其详情无法被更改。同时，被审计实体有权决定谁可以查看报告。在区块链上，你无需信任信息持有者，而只需信任生成该信息的系统。


    #### 提供安全的溯源


    在溯源方面，区块链提供了现代终端消费者真正寻求的东西。近年来，消费者越来越有兴趣了解产品背后的历程细节。例如，他们可能想知道制造产品所用的能源来源、劳动力是否获得公平报酬、是否涉及童工。他们可能出于健康原因询问制造商使用的原材料，或其是否为有机种植。当今消费者希望确信供应链不仅符合道德，而且对自己、他人和环境都是安全的。

    '
