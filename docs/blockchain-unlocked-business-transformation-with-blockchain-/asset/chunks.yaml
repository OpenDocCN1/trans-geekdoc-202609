- raw: "Similar to other use cases, challenges exist in the adoption of blockchain\
    \ for the insurance industry. The most prominent challenge is the need for change\
    \ in the law and regulatory policy so that some of the processes made possible\
    \ by the blockchain are not only enforceable but also recognisable. In particular,\
    \ the law and regulatory environment have to recognise that blockchain technology\
    \ makes it easy for trans-international transactions. Therefore, it should allow\
    \ policy buyers, brokers, insurers, and reinsurers to operate internationally\
    \ with little hindrance.\n\nOf course, there is the issue of technical capacity.\
    \ At the moment, not every broker, insurer, or reinsurer can build applications\
    \ on the blockchain. The good thing, however, is that consortiums like B3i could\
    \ help a lot in making the industry players access this new technology. We are\
    \ also likely to see more startups come up to build ready to use solution.\n\n\
    In summary, blockchain has already shown that it can transform the insurance industry\
    \ in various ways. This will benefit both insurance businesses as well as its\
    \ customers by improved speed, security, privacy as well as reduced cost.\n\n\
    ^([1](#ch14.xhtml#ich14fn1)) “When Was Insurance First Used?” DailyHistory.org,\
    \ Dec. 2018, [dailyhistory.org/When\\_was\\_Insurance\\_First\\_Used%3F](http://dailyhistory.org/When_was_Insurance_First_Used%3F).\n\
    \n^([2](#ch14.xhtml#ich14fn2)) “United We Brand: Toward A National Anti-Fraud\
    \ Outreach Campaign.” Insurancefraud.org, Coalition Against Insurance Fraud, Dec.\
