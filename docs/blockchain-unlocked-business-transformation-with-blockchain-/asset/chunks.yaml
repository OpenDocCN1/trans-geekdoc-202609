    World Bank, 8 Apr. 2019, [www.worldbank.org/en/news/press-release/2019/04/08/record-high-remittances-sent-globally-in-2018](http://www.worldbank.org/en/news/press-release/2019/04/08/record-high-remittances-sent-globally-in-2018).


    | ![image](images/ch-13.jpg) | | **Use Case 5: Healthcare** |

    | --- | --- | --- |


    The blockchain is poised to achieve one of the most disruptive transformations
    in the healthcare sector. This is by (1) making possible an efficient medical
    information management system that is interoperable both nationally and internationally,
    (2) offering speed in processes, security for data as well as the privacy for
    patients, and most importantly, (3) introducing a novel mode of medical data ownership
    and usage, which places the patient at the centre of the information management
    system.


    The earliest form of medical information management system was paper-based. The
    sharing of data amongst healthcare providers relied primarily on the postal services.
    Often, patients would physically lug hardcopy files from one doctor to another.

