- raw: 'However, expecting the technology to be applicable in every situation is not
    realistic. Neither is the expectation that it is perfect. Sometimes designing
    systems without blockchain is the right thing to do after considering technical
    needs, cost, and the expected user experience (UX). It is also important to point
    out that blockchain cannot function in a vacuum. Aside from the necessary skills
    needed (which you can assess in the free bonus at the end of this book), the technology
    requires other resources to be of meaningful use. For example, while we might
    believe strongly that the blockchain is the solution to the global unbanked, it
    cannot work without other infrastructures such as access to the Internet, available
    electricity, and affordable technical devices like smartphones.


    Blockchain can only be useful if it is applied where it is truly needed. Many
    problems require more than blockchain as a solution. Often, politics, human resources,
    and socioeconomics need to be fixed first before the technology becomes useful.


    ^([1](#ch02.xhtml#ich02fn1)) Rosic, Ameer. “Why Most ICO’s Will Fail: A Cold Hard
    Truth.” Blockgeeks, 5 May 2020, [blockgeeks.com/guides/why-most-icos-will-fail/](http://blockgeeks.com/guides/why-most-icos-will-fail/)


    ^([2](#ch02.xhtml#ich02fn2)) Popper, Nathaniel. Digital Gold: Bitcoin and the
    inside Story of the Misfits and Millionaires Trying to Reinvent Money. Harper,
    2016.


