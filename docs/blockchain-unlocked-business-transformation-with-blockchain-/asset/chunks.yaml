- raw: 'The use of blockchain in the healthcare sector will also help make it easy
    for insurance companies to onboard and interact with those who take medical cover
    as well as efficiently settle their claims. In particular, this is because the
    insurance company does not need to go to third parties to verify the validity
    of the information a customer provides. Even though it is the patient in control
    of the data, including access to it, the data is protected through the immutability
    of the blockchain. Once a doctor, a lab technician, or a pharmacist makes a note,
    it is permanent. No one can delete or change it arbitrarily.


    Blockchain could also help cut the cost of healthcare in several ways. First,
    it offers a more efficient and less costly way of storing and sharing data as
    compared to centralised systems. Second, it reduces the duplication of tests and
    procedures. If a patient has had a test done in another hospital, a new doctor
    can easily access that data and use it to make critical decisions instead of asking
    the patient to pay for the same test in their facility for probably the same results.


    The technology could also help reduce the cost of insurance policies. That is
    because the incidences of fraud are minimised. Often, the cost that comes from
    fraud is passed on to honest clients.


    The technology also reduces the chances of downtime as the shared ledger does
    not rely on a single server or a couple of servers. Even if half the Internet
    were destroyed due to a major catastrophe, patient data would still be accessible
    on the existing segment of the Internet. That is how secure the blockchain makes
    patient data.


    ##### **The Medicalchain model**


    Now, are there projects that are already building medical data management systems
    on the blockchain as at the time of writing this book?


    Yes, a few exist. One of those is Medicalchain, which has so far raised over US$24
    million in two rounds, with one being an ICO in 2018. Co-founder Dr. Abdullah
    Albeyatti is a medical doctor with broad and extensive training. He has substantial
    experience in how patient data is handled and the challenges that exist. Before
    he got involved with Medicalchain, Albeyatti had helped built Discharge Summary,
    a platform through which hospitals could share accurate notes of discharged patients
    with the family doctor or general practitioner. Its success in Leeds Hospital
    Trust, UK, provided the motivation to work on Medicalchain^([5](#ch13.xhtml#ch13fn5)).


    The startup has managed to form partnerships with some major brands within the
    medical field, with one of those being Mayo Clinic, the medical research centre
    headquartered in Rochester, Minnesota, but with a global reach. In the UK, Medicalchain
    has partnered with Groves Medical Group, a healthcare service provider with over
    30,000 patients. The latter was the first healthcare provider to adopt and test
    Medicalchain’s first application, known as Mychain. Through Mychain, patients
    can chat with doctors using a video call, offer them access to their data, and
    receive basic healthcare services.


    To help with managing the identity of the users of their platform, Medicalchain
    has partnered with Civic, a platform that leverages the blockchain to establish
    and authenticate digital identities. This is a layer of protection for all users
    of the platform. It means that even though it is open for everyone to use, building
    fake accounts for whatever purpose is made to be a little harder.


    The foundational structure of Medicalchain uses two blockchains: Hyperledger and
    Ethereum. The former handles data processes, while the latter takes care of financial
    transactions that involve settling of bills or sale of data for research purposes.


    On the Medicalchain system, only the patient can provide access to their medical
    files to healthcare providers through the use of a private key. Where the patient
    is not in a position to provide such access, doctors can retrieve the key from
    a hardware bracelet worn by the patient. The bracelet is similar to sort often
    used to list critical medical conditions and allergies for vulnerable individuals.


    Medicalchain has a native token known as Medtokens, of which one function is a
    form of payment to settle bills, especially for telemedicine-related services.
    It is also supposed to facilitate the ability of patients to provide access to
    entities that want to do research using their data. The patient can negotiate
    and receive payment in Medtokens, which they can convert to the currency of their
    choice on exchanges.


    Medicachain is not the only medical information management system on the blockchain
    project. Other healthcare blockchain projects similar to Medicalchain include
    Dentacoin, Project Shivom, and Factom. There are also SimplyVital Health, Coral
    Health, Robomed, Patientory, Chronicled, Blockpharma, and Tierion^([6](#ch13.xhtml#ch13fn6)).


    ### **Challenges in using blockchain**


    Finally, let’s look at the challenges that have to be overcome to make blockchain
    a truly useful technology in healthcare information management systems. Just like
    with the application in other sectors, a few hurdles exist and it is not going
    to be very easy to use blockchain in the healthcare sector.


    One challenge is the scalability of the blockchain and, by extension, the speed
    that can be achieved. We have already seen that blockchain has struggled to scale.
    Nevertheless, it has to gain a substantial capacity to handle millions of transactions
    that take place in hospitals around the world. The technology is not there yet,
    but good progress is being made.


    Another challenge is a standardisation of how files are created, stored, and retrieved.
    Every hospital, medical practice, or country having their own standards, guidelines,
    and frameworks could hamper interoperability. The different systems could find
    it difficult to interface. More critically, it could make it hard for doctors
    and healthcare providers to arrive at the same interpretations of the same sets
    of data. And this could easily put patients at risk.


    Laws and regulations will need to change in different countries to accommodate
    not only a new structure of medical record-keeping but also the ownership and
    usage of medical data. In particular, the law might need to reflect the existing
    technical ability of patients to exercise rights over the data that is collected
    by healthcare providers.


    Last but not least, human resource capacity needs to be built to design, develop,
    and run these new systems. At the moment, as in the other use cases, there is
    a shortage of talent with the right skills to build blockchain-related systems.


    In conclusion, the blockchain offers the most disruptive changes in the healthcare
    sector. It is one of the sectors where the technology could do more than just
    improve the systems and processes; it could tamper with the balance of power and
    turn the patient from not having any say to having complete control. However,
    while this promise of disrupting the balance of power might sound acceptable,
    it could turn out to be the obstacle that stands in the way of change, especially
    as those who benefit from the current structure might fight the change. It could
    take more than the potential for blockchain for the healthcare sector to change.


    ^([1](#ch13.xhtml#ich13fn1)) O’Donnell, Lindsey. “Ransomware Attacks Leave U.S.
    Hospitals Turning Away Patients.” Threatpost English Global Threatpostcom, 1 Oct.
    2019, [threatpost.com/ransomware-attacks-leave-u-s-hospitals-turning-away-patients/148823/](http://threatpost.com/ransomware-attacks-leave-u-s-hospitals-turning-away-patients/148823/).


    ^([2](#ch13.xhtml#ich13fn2)) Devine, Emily Beth, et al. “Health Information Exchange
    Use (1990-2015): A Systematic Review.” The Journal for Electronic Health Methods
    and Data, vol. 5, no. 1, 17 Dec. 2017, p. 27., doi:10.3897/bdj.4.e7720.figure2f.'
