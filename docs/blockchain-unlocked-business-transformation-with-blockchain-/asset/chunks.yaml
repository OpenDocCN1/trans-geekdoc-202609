- raw: '### **What blockchain offers to KYC and AML systems**


    The first change that blockchain offers is giving control over data to consumers,
    while assuring service providers that the data is accurate and cannot be tampered
    with. The system provides better security to the data through decentralisation,
    immutability, and cryptography. When a service provider collects data from a consumer,
    it is added to a file that is managed through cryptographic keys. The service
    provider gets access from the consumer through a public key whose corresponding
    private key the customer owns. For that data to be filed, it has to be taken through
    the mining process where a decentralised peer-to-peer network of computers records
    it on the blockchain. This makes the data immutable, and not even the consumer
    who has the corresponding private key, which they use to provide access to the
    information, can change any detail of it.


    The control over data that a customer has on the blockchain system includes determining
    how long a service provider can access their data. And in some cases, the user
    can choose to sell their data to those who need it for research or other purposes,
    which is different from what happens currently where the user has little say as
    to how their data is used.


    Blockchain technology offers the capacity to establish provable and secure identities.
    Once a consumer creates a profile on the blockchain, third parties, including
    service providers, regulators, and those they do business with, can independently
    contribute to the building of that profile and identity. That means, over time,
    the profile will be very detailed and nuanced, which would make it easy for regulators
    and service to determine the person they are dealing with a lot of accuracies
    without having to waste time consulting third parties.


    The other value that blockchain offers to the KYC and AML systems is the enhanced
    privacy of the customers. And this is possible because they control the data,
    in particular, who can see it and to what extent. The data is not saved in a database
    whose security relies on and manages access that, when breached, all the data
    of all the customers is accessible. The technology offers privacy to customers
    even when they need to prove themselves to the service provider and regulators.


    The blockchain also provides the means and ways to standardise KYC and AML processes
    and operations through the use of decentralised protocols. Currently, every company
    or regulator uses a silo-ed system, and often it is very hard to make the different
    systems talk to one another. The blockchain, by its nature, makes it possible
    that various entities that are independent of each other can share a universal
    immutable truth.


    The blockchain also provides an opportunity to reduce the high cost involved in
    managing KYC systems and collecting, processing, and sharing of data. Through
    smart contract applications, technology makes it easy to automate most processes.
    Also, it transfers the responsibility of safeguarding and protecting data to individual
    customers, which allows companies and regulators to focus on other critical functions.
    And that reduces the cost of operations.


    An advantage close to standardisation that blockchain offers is improving interoperability
    between different systems. And this can happen so that different entities can
    securely access the same database on the blockchain to verify identity and transactions.
    Blockchain, together with other technologies, can also speed up the rate at which
    transactions are examined. For example, it can cut the AML holding time from days
    to minutes. And that partly is because much of the data is available on the shared
    ledger. External sources can also be queried from smart contract-driven oracles
    online. Smart contract applications on the blockchain can automate most of the
    procedures and processes.


    Another value that blockchain offers to KYC and AML is transparency^([4](#ch17.xhtml#ch17fn4)).
    Given that data is on a shared ledger, every stakeholder can have access to it.
    In particular, consumers can know the exact information service providers are
    using to make decisions regarding them. They can easily tell whether the information
    is accurate and even get an opportunity to respond to particular concerns accurately.


    The blockchain will allow stakeholders to avoid duplicating tasks both within
    their organisations and across the supply chains. If one unit or company has done
    background work in a particular area, others will not need to do that. They will
    be able to concentrate on other areas instead.


    Also, blockchain makes the implementations of some regulations and laws easier.
    For example, the EU’s General Data Protection Regulation (GDPR) has made it mandatory
    that customers should give consent for the use of their information. The blockchain
    provides the consumers to do exactly that through the private keys (digital signatures)
    they can use to give access and even the conditions for data use.


    Several startups are building blockchain solutions for KYC and AML. One of those
    is the American startup Cambridge Blockchain, which launched in 2015. The company
    has raised about US$15 million investment from significant entities, including
    PayPal Ventures and Digital Currency Group (the investment group that owns CoinDesk).
    It has also formed partnerships with major players in the financial industry.
    In January 2018, Cambridge Blockchain announced a partnership with IHS Markit’s
    kyc.com, a KYC service platform that counts close to twenty major banks in the
    US among its users.


    ### **Challenges in using blockchain**


    A few challenges to the adoption of blockchain in KYC and AML systems exist today^([5](#ch17.xhtml#ch17fn5)).
    First, all stakeholders have to agree on policies, procedures, and processes.
    Every business has a unique way of doing things that work for them, which extends
    to how it onboards and manages clientele. Thus, having these stakeholders agree
    on the specific set of protocols might not be secure.


    The second challenge is about securing the validity of data, especially during
    the initial capture. Remember, once this data is recorded on the blockchain, it
    becomes immutable. This is critical given that a single erroneous entry about
    a client might affect them and their businesses immensely.


    Stringent laws and regulations govern how data can be shared. Even if one entity
    has information that can help another simplify its operations, it might not share
    it because of existing privacy laws and regulations that do not allow a cross-platform
    flow of certain kinds of data. And this is true even where the technology has
    safeguards for private data.


    In conclusion, while blockchain brought a capacity for individuals to transact
    online without exposing themselves to surveillance of the state as well as that
    of the global corporate. The same technology, however, offers tools that can be
    used to improve the systems that are used to execute KYC and AML procedures and
    processes.


    ^([1](#ch17.xhtml#ich17fn1)) Wirdum, Aaron van. “Bitcoin as a Privacycoin: This
    Tech Is Making Bitcoin More Private.” Bitcoin Magazine, 13 Mar. 2020, [bitcoinmagazine.com/articles/bitcoin-privacycoin-tech-making-bitcoin-more-private](http://bitcoinmagazine.com/articles/bitcoin-privacycoin-tech-making-bitcoin-more-private).


    ^([2](#ch17.xhtml#ich17fn2)) J. “AML Regulation and New Features Update.” The
    LocalBitcoins Blog, 25 Mar. 2019, [localbitcoins.com/blog/aml-features-update/](http://localbitcoins.com/blog/aml-features-update/).'
