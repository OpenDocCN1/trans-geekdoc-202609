    the hash rate, the rest of the network has the option to fork the blockchain and
    leave you with a shell. It can create a copy of the ledger up to the point of
    51 percent (i.e., acquiring a hash rate above 51 percent of the network), then
    create a new branch and continue updating a valid ledger. Then you might have
    to launch another expensive counter-attack. There is hardly any justification
    for wasting resources in this way; it makes more economic sense to use the resources
    to mine for the network and receive the mining reward. Indeed, the game theory
    behind the Bitcoin blockchain is designed to incentivise people to build the system
    instead of ruining it. In short, it pays more to play by the rules than to break
    them.


    That said, the blockchain space is concerned that developments in quantum computing
    might make it easier and cheaper to attack and destroy blockchain networks. Such
    a compromise might come in the form of an ability to break blockchain cryptography.
    It will become easier to figure out private keys without having to steal them^([5](#ch04.xhtml#ch04fn5)).


    Thus, blockchain developers and innovators are thinking ahead to produce protocols
    that would make quantum computing inconsequential to blockchain technology. Two
    of the quantum-computing resistant protocols are Ethereum’s Serenity and zkSTARKs^([6](#ch04.xhtml#ch04fn6)).


    ### Is the code and protocol robust?


    Now let’s look at the third and last angle through which you can ascertain whether
    a blockchain is secure. Any device on the network has to install and run its core
    software to communicate and form a consensus with another on the shared ledger,
    as the blockchain relies on it to execute the protocol. The first version usually
    comes from the founder of the network; for example, founder Satoshi Nakamoto wrote
    the first version of the Bitcoin core software. Subsequent versions are products
    of collaborative work by different players or core developers. Anybody can propose
    a change to the core software and protocol through the Bitcoin Improvement Proposal
    (BIP) process. The proposer talks to other members of the community, creates the
    next version of the core software with the changes, and persuades others to download
    and run it. The process is more complicated than my description here. But I’m
    guessing you get the idea.


    Like any piece of code, a blockchain core software can end up with bugs and weak
    points of execution. These can expose users to many risks, such as double-spending
    and attack points. Major blockchains have had bugs discovered. Some of the bugs
    have been serious, risking the value held on the blockchain. In late 2018, a flaw
    was discovered that could have been exploited to shut down part of the Bitcoin
    network and allow bad actors to create Bitcoins out of thin air. It was kept a
    secret (for a number of days) by top Bitcoin core developers until they were able
    to fix it^([7](#ch04.xhtml#ch04fn7)).


    In early 2016, Slick.it, a German blockchain startup launched the Decentralised
    Anonymous Organisation (the DAO) on top of the Ethereum blockchain. The entity
    was supposed to act as a company with only investors and no management or staff.
    The investors would, through voting, contract service providers to perform on
    behalf of the DAO. It turned out that there was a bug in the code that actualised
    the idea. But an attacker exploited it and began the process of stealing close
    to US$150 million raised by investors. To stop the attack, the Ethereum network
    upgraded its core software and rolled back transactions. This led to the split
    of the network into two: Ethereum (ETH) and Ethereum Classic (ETC)^([8](#ch04.xhtml#ch04fn8)).


    In summary, the blockchain is not foolproof. Any consideration of a blockchain
    security in the three levels described in this chapter should be in comparison
    to other existing systems. In many ways, the blockchain is more secure than the
    systems it seeks to replace. Blockchain cryptography offers users more control
    and security over their activities and assets. The game theory that governs blockchains
    make attacks less likely. As for bugs in codes, blockchains are open source projects
    and tend to have a caring community; any bug is usually discovered and fixed before
    it can harm the ecosystem.


    ^([1](#ch04.xhtml#ich04fn1)) Shane, Daniel. “Coincheck: $530M Cryptocurrency Heist
    May Be Biggest Ever.” CNNMoney, Cable News Network, Jan. 2018, [money.cnn.com/2018/01/29/technology/coincheck-cryptocurrency-exchange-hack-japan/index.html](http://money.cnn.com/2018/01/29/technology/coincheck-cryptocurrency-exchange-hack-japan/index.html).


    ^([2](#ch04.xhtml#ich04fn2)) Redman, Jamie. “Hackers Have Looted More Bitcoin
    Than Satoshi’s Entire Stash.” Bitcoin News, 24 Mar. 2019, [news.bitcoin.com/hackers-have-looted-more-bitcoin-than-satoshis-entire-stash/](http://news.bitcoin.com/hackers-have-looted-more-bitcoin-than-satoshis-entire-stash/).


    ^([3](#ch04.xhtml#ich04fn3)) “Total Hash Rate (TH/s).” Blockchain.com, [www.blockchain.com/en/charts/hash-rate](http://www.blockchain.com/en/charts/hash-rate).


    ^([4](#ch04.xhtml#ich04fn4)) McCarthy, Niall. “Bitcoin Devours More Electricity
    Than Switzerland \[Infographic\].” Forbes, Forbes Magazine, 8 July 2019, [www.forbes.com/sites/niallmccarthy/2019/07/08/bitcoin-devours-more-electricity-than-switzerland-infographic/#39b7e85521c0](http://www.forbes.com/sites/niallmccarthy/2019/07/08/bitcoin-devours-more-electricity-than-switzerland-infographic/#a5c02393e59c943d6a75a9241140faca339b7e85521c0).


    ^([5](#ch04.xhtml#ich04fn5)) Sharma, Toshendra Kumar. “Can Blockchain Be Under
    Quantum Attacks ?” Blockchain Council Blockchaincouncilorg, 6 Dec. 2018, [www.blockchain-council.org/blockchain/can-blockchain-be-under-quantum-attacks/](http://www.blockchain-council.org/blockchain/can-blockchain-be-under-quantum-attacks/).


    ^([6](#ch04.xhtml#ich04fn6)) Bouguera, Amira. “How Will Quantum Computing Affect
    Blockchain?” ConsenSys, Dec. 2018, [consensys.net/blog/blockchain-development/how-will-quantum-supremacy-affect-blockchain/](http://consensys.net/blog/blockchain-development/how-will-quantum-supremacy-affect-blockchain/).


    ^([7](#ch04.xhtml#ich04fn7)) “CVE-2018-17144 Full Disclosure.” Bitcoin Core, 20
    Sept. 2018, [bitcoincore.org/en/2018/09/20/notice/](http://bitcoincore.org/en/2018/09/20/notice/).


    ^([8](#ch04.xhtml#ich04fn8)) Siegel, David. “Understanding The DAO Attack.” CoinDesk,
    CoinDesk, 27 June 2016, [www.coindesk.com/understanding-dao-hack-journalists](http://www.coindesk.com/understanding-dao-hack-journalists).


    | ![image](images/ch-5.jpg) | | **Private vs. Public Blockchains** |

    | --- | --- | --- |


    The Bitcoin was an application on the first blockchain. Since its launch in January
    2009, over 3,000 public blockchains have sprung up, according to the digital assets
    listed on CoinMarketCap. With interest in the technology growing each day, we
    should expect the number to keep growing.


    All blockchains have a similar basic structure. They are platforms on top of peer-to-peer
    networks or independent computers that collaborate to maintain a shared ledger
    in real time. However, each blockchain implements a protocol that is at least
    slightly different from the next. Each is designed to solve a particular problem.
    For example, the Bitcoin blockchain’s primary focus is payments, while the Ethereum
    blockchain is, more or less, a virtual machine that can serve as a backend for
    all kinds of applications.


    With that stated, blockchains can be grouped using several criteria. This chapter
    looks at one of these: how blockchains function due to design. In this regard,
    there are two primary types of blockchains: every blockchain can be categorised
    as public or private.


    ### Private vs. public: What’s the difference?

