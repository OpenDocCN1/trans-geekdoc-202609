- raw: 'For the purposes of simplification in this book, references to the blockchain
    and the distributed ledger may be used interchangeability (although technically
    they are not exactly the same). In some instances, the blockchain may be generalised
    to be referred, too, as either a centralised or decentralised collaborative model.


    These different approaches will be illustrated further in the use cases from various
    industries in [Part 2](#pt02.xhtml) of the book.


    ### **How the Bitcoin system works**


    Enter the Bitcoin, the first cryptocurrency and Store of Value (SoV) on the blockchain.


    Making independent computers agree on and contribute to the single ledger can
    be described as one of the most exciting IT innovations of the 21st century. In
    late 2008, an individual or a group going by the pseudonym Satoshi Nakamoto published
    a white paper^([4](#ch01.xhtml#ch01fn4)). In it, they describe a peer-to-peer
    network that maintains a shared ledger of transactions through an elaborate consensus
    mechanism.


    Independent computers in a peer-to-peer network do not need a central server to
    facilitate interaction amongst them. To communicate with one another, each computer
    has to download and install core software. It is this core software that contains
    the rules of engagement (protocol). Indeed, the essential thing that Satoshi Nakamoto
    did was to figure out the protocol and actualise it in a core software that every
    computer that joins the network has to install. Over the years, a group of volunteer
    programmers has continued to maintain the core software through consensus.


    Through these consensus rules in the core software, computers in the Bitcoin peer-to-peer
    network maintain a ledger of transactions. You see, in a centralised system like
    a bank, a central authority stores and maintains the ledger of transactions through
    its agents (both human and machine tellers). Bitcoin has a ledger too. However,
    unlike in a centralised payment system, it is stored as a copy in each of the
    computers on the network.


    Now, the biggest challenge is to have everyone have a completely identical copy
    of the ledger. Having one copy with transactions that are not in another would
    make the payment system fail. Satoshi solved this problem by introducing the concept
    of mining. Using the protocol rules, the computers in the network pick one of
    them to update the ledger every ten minutes.


    How exactly do they undertake the process?


    The computers on the network participate in a competition with rules provided
    by the protocol. The competition involves each of the computers taking transaction
    requests made within ten minutes and combining them into a block. Each computer
    will then hash the data in their block to fit a value according to the protocol
    requirements. The first computer to find the value will have its version of the
    block accepted as the next valid one on the ledger. It will join those that were
    accepted earlier.


    All the other computers will synchronise their copies to the one by the winning
    machine. The computer that contributed the next valid block keeps the mining reward,
    newly released coins. This process repeats itself and is in some ways similar
    to a legislative election. Several people compete in an election and the winner
    gets the power to write laws, or in this case, transactions on a shared ledger
    instead. It is also not after every four or five years but every ten minutes.


    The Bitcoin ledger was given the name blockchain, because the data is stored in
    terms of blocks that form a chain.


    It turns out this way of forming a consensus on the status of a shared ledger
    or data storage, can even be used on transactions that are not related to payment.
    A peer-to-peer network using a similar protocol can agree on the execution of
    application code, for example. And that is what makes the network a virtual machine
    that can take the place of the old centralised server. By having the ability to
    form a consensus on transactions and data, computers in a peer-to-peer network
    can function as a unit. Or a single virtual machine that can execute all kinds
    of applications.


    Back to our earlier question: why should we prefer this virtual machine to the
    old centralised server?


    One of the most significant advantages of using blockchain is that the technology
    removes the single point of failure that we have with servers. There is no one
    point of the blockchain you can attack to disable it. As long as any part of the
    Internet is up and running, the blockchain will continue to work.


    The blockchain also makes digital data or records immutable. Once a record is
    made, no one can delete or change its content arbitrarily. This, for example,
    makes the possibility to hack a land registry and change ownership of an asset
    almost impossible.


    It not only makes peer-to-peer transactions possible but also cheaper, as it removes
    third parties that make transactions slow and expensive.


    Let’s stay with the example of land titles to illustrate this point. If you want
    to purchase a piece of real estate, in most countries today you will have to depend
    on many third parties: real estate agents, the land registry office, where you
    confirm ownership, notaries, and of course, lawyers to draft the sales agreement.
    If countries put land titles on the blockchain, most of these trusted third parties
    become irrelevant. And you spend less on the transaction. You can search a piece
    of land in the registry, and using a private key, the owner of the asset can easily
    prove to you that they are really the owner. Using a smart contract application,
    both of you can draft a sales agreement. Also, through an escrow service on the
    platform, you can swap the land title and the agreed price simultaneously. All
    of this can happen within minutes.


    In every single industry you look at, in similar ways, the blockchain can make
    things easier and cheaper.


    ### **How is blockchain likely to change businesses?**


    The technology is going to change businesses in three primary ways:


    #### **1\. Efficiency, reliability, and security to business systems.**


    As we will not need any trusted third parties that are critical to current systems,
    blockchain will make transactions faster and cheaper. It also offers some integrity
    in how businesses handle data. It secures data; importantly, it gives people control
    over their data. This is good for end users but not exactly to businesses. There
    are so many businesses around that are built on using data collected from people.
    Those businesses might have to rethink their strategy as many people will find
    a way to be stingy with their information. The technology allows them to give
    only data that is most necessary for transacting with a business.


    The blockchain also improves how intellectual property rights are handled. Any
    business that comes up with unique ideas will find it easy to not only register
    their innovation but also prove to others that they came up with the idea first.


    #### **2\. New businesses will be created.**


    Blockchain is creating entirely new businesses. We’ve already seen the rise of
    mining companies as well as digital asset exchanges.


    In 2016, we witnessed an attempt to build Decentralised Autonomous Organisations
    (DAO). This is a company that does not have a centralised management structure,
    but has investors and carries out its operations through contracting. All its
    decisions are made through ongoing voting by investors. If this model becomes
    popular, existing businesses may have to discover ways to do business with DAOs.


    #### **3\. Other businesses will be killed.**'
