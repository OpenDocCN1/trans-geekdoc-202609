    The second obstacle is resistance from beneficiaries of the current governance
    systems. The government is a massive enterprise with many beneficiaries. It turns
    out that those that benefit the most from how the government functions are also
    the holders of the keys to change. For example, politicians make a living out
    of running for office and being representative of the people in the legislature,
    the executive, and the judiciary. For a change to happen from representative to
    direct government, they (the politicians) must change the relevant laws. However,
    it is expected that they will stand in the way of any change that threatens their
    position.


    Another challenge is the lack of a large enough pool of experts to help design,
    build, and implement the blockchain applications for government. This has been
    a significant challenge since the early days, especially with large private corporations
    also building blockchain development teams.


    Blockchain has a lot of potential to change how government works. How far we embrace
    it for this purpose depends on how ready we are to disrupt what we have always
    known about the idea of government. It also depends on whether we have the capacity
    and the resolution to overcome the challenges that might stand in our way.


