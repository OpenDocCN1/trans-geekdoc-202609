- raw: 'After looking at how the blockchain can improve existing government systems
    and processes, let’s shift gears and look at the second impact that the technology
    can have on public administration or governance: the possibility of changing the
    basic idea of government.


    Blockchain can do more than just improve government processes and systems. It
    has the potential to usher in entirely new forms of government. It could spell
    the end of the representative form of government as we know it and replace it
    with one where citizens have more direct involvement, and in particular have a
    say on how things function daily. After all, the basic idea behind the legislature
    is that all citizens cannot necessarily meet in one place to deliberate on the
    issues that affect their lives. It has been impossible, of course, because of
    the lack of logistics to support such meetings. Therefore, we elect some from
    among us to represent us in the decision making within the government.


    However, we have come a long way, and technology continues to make things that
    just a few years ago seemed impossible possible. If today you have an opportunity
    to travel in time to the early 20th century and tell people living then that in
    just under 100 years, it would be possible to do things like video conferencing,
    they would probably think you are talking about magic and not reality.


    The blockchain provides an option for electing the legislature and the executive,
    and hoping that they do the right thing. It offers the mechanism through which
    citizens can take up most of the responsibilities of daily government functions
    as a collective and directly perform at least part of these. This was incomprehensible
    just a decade ago. This might seem unrealistic or absurd at first glance. However,
    after exploring what the blockchain is capable of doing, and what it has already
    been tested to do concerning governance structures, the idea of direct government
    does not appear far fetched.


    #### **The DAO model**


    In April 2016, Slock.it, a German blockchain startup, announced a new project
    known as the Decentralised Anonymous Organisation (DAO). This would be an investment
    organisation without a leadership structure or a team of employees to undertake
    its activities. Instead, the DAO would be managed through a smart contract system
    or protocol on the Ethereum blockchain. All decisions would be made by members
    through some form of a consensus mechanism achieved through direct voting^([9](#ch11.xhtml#ch11fn9)).
    In simple terms, the DAO was a company with shareholders but no board of directors,
    chief executive officer, or any other kind of employee.


    The idea was so attractive, exciting, and popular that within a funding period
    of 28 days, it managed to raise over US$150 million from investors who would become
    the shareholders. Through the smart contract protocol or system, the shareholders
    would vote on projects to be undertaken by the organisation and also engage service
    providers to act on its behalf. A shareholder could propose a plan, along with
    the required budget, and then persuade others to approve it through the vote.
    Also, a service provider could suggest business ideas to the DAO and try to persuade
    the shareholders that they could deliver results that would benefit the organisation.
    Once the members approve a project, a smart contract would lock the required funds
    in an escrow account. With that, the service provider would proceed to work on
    the project. Once complete, the smart contract guiding its execution would release
    the payment from the escrow account.


    The DAO, however, did not get to be fully implemented. In June 2016, just two
    months after its launch, a hacker found a bug in its primary smart contract code
    and attempted to exploit it and steal about US$50 million from the DAO wallet.
    This resulted in one of the most significant hard forks within the crypto space.
    Since the payout had to be completed on the Ethereum blockchain, the community
    faced the option or rolling back transactions and denying the hacker the funds
    from the DAO wallet. The community had considerable disagreement on how to proceed.
    Some favoured rolling back the transaction to deny the attacker the DAO funds,
    while others thought doing so would jeopardise the immutability promise of the
    blockchain, and US$50 million was not enough reason to do that.


    With no consensus, the Ethereum network had to break up into two independent blockchain
    networks. Those who supported the transaction rollback kept the name Ethereum
    (ETH) for their network, while those who opposed it adopted the new name Ethereum
    Classic (ETC). The hacker ended up cashing out some funds in Ethereum Classic
    tokens. Shortly after, the DAO was shut down and the investors refunded.


    Nevertheless, the idea of the DAO did not die, and a few other projects have been
    set up using this particular model of governance. One of the most successful projects
    is the DASH blockchain network, where members pick something they can do for the
    network and persuade the community to fund them. If the community is satisfied,
    it approves a budget that goes into an escrow account, and the proposer gets to
    work. The funds are then released to them as milestones are met. Another project
    on the DAO model is MakerDAO.


    Likewise, a form of DAO could replace the government with all citizens becoming
    shareholders. The privilege to vote on projects could be acquired, for example,
    through the payment of taxes to a treasury wallet. Contractors, as well as citizens,
    could propose necessary public projects, which could then be approved and voted
    on by citizens who also elect the undertaking contractor. The winning contractor
    would have the budget put in an escrow account, and after completing the job,
    they get paid, all according to a smart contract that guides the execution of
    the project. It is important to point out that the examination, discussion, and
    voting could all happen through a portal or a mobile application. This would make
    it convenient for citizens to participate regardless of where they are located.


    Of course, we cannot say that we are ready for entire governments to be turned
    into a DAO. Still, it is possible that parts of it can, which would perhaps improve
    service delivery, increase transparency, and reduce incidences of corruption.
    It would also enhance public participation.


    ### **Challenges in using blockchain**


    Now let’s shift our focus to the challenges that the blockchain technology has
    to overcome before the government adopts it, whether for improving existing processes
    and systems or for creating utterly new governance structures.


    Just because the blockchain has something of value to offer does not mean that
    it will be automatically embraced and used. Even with all of its advantages for
    the delivery of public services, we might never witness it happen on a large scale
    due to challenges that might prove hard to overcome.


    The first challenge that blockchain has to overcome is becoming more compatible
    with existing laws. For most processes on the blockchain to be accepted, they
    have to be recognisable before the law. For example, agreements executed through
    smart contracts can only be legally binding if the law recognises them. Otherwise,
    the courts can always overrule whatever the smart contract achieves. Thus, the
    law has to be changed for the full potential of the application to be realised.'
