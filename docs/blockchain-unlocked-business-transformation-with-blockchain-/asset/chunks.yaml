- raw: "To summarise, before setting out to build a new blockchain, you need to determine\
    \ whether your business actually needs it, in particular that the existing blockchains\
    \ do not have the capacity and features it needs. Also, you need to ascertain\
    \ if you are able to build the blockchain and at what costs, and if it all indeed\
    \ makes business sense. Then lastly, bring together and inspire a community to\
    \ maintain it in such a way that it is secure and worthy of being regarded as\
    \ a blockchain.\n\n^([1](#ch08.xhtml#ich08fn1)) “How to Build a Decentralized\
    \ App (DApp) on EOS - Merehead 3747.” Merehead, 16 Apr. 2020, [merehead.com/blog/how-build-dapp-eos/](http://merehead.com/blog/how-build-dapp-eos/).\n\
    \n^([2](#ch08.xhtml#ich08fn2)) “Blockstream.” Crunchbase, [www.crunchbase.com/organization/blockstream/current\\\
    _employees/current\\_employees\\_image\\_list](http://www.crunchbase.com/organization/blockstream/current_employees/current_employees_image_list).\n\
    \n![image](images/pt-2.jpg)\n\n## **The Applications**\n\n| ![image](images/ch-9.jpg)\
    \ || **Use Case 1:  \n\nBanking and Finance** |\n\n| --- | --- |\n\nThere is little\
    \ question that the most successful use case of the blockchain so far is the delivery\
    \ of financial services outside traditional banking and financial systems. This\
    \ is through two primary types of applications: cryptocurrency and decentralised\
    \ finance, or DeFi, as they are commonly called.\n\nThe former is more pronounced\
    \ at this point, but is unlikely to remain so in the coming decade, at least going\
    \ by the upcoming DeFi projects. We will look at both types of blockchain applications\
    \ in detail later.\n\n### **Blockchain: threat or evolution?**\n\nFirst, this\
    \ has to be stated: blockchain is the first real threat to the central banking\
    \ system. However, if the industry embraces it with the right approach, the technology\
    \ has the potential to change it significantly and for the better. It is apparent\
    \ that the banking and finance sector can derive far more changes from the blockchain\
    \ than it did from the Internet in past decades.\n\nThe Internet has changed banking\
    \ and financial services in a significant way too. However, it did not even attempt\
    \ to tamper with the balance of power within the ecosystem. More or less, the\
    \ traditional financial institutions have retained their control on the banking\
    \ system. One could even argue that the Internet has helped the big financial\
    \ institutions entrench their hold further.\n\nThe Internet as a new technology\
    \ has only increased efficiency and extra channels through which banks could reach\
    \ their customers. It also helped them cut operational costs. Most banks have\
    \ either gone slow on opening new branches or closed some of their existing branches,\
    \ because they can deliver most of their services online. This has definitely\
    \ had the effect of increased profit margins. According to one report by the BBC\
    \ in June 2018, over 60 bank branches had been closing down every month in the\
    \ United Kingdom. A spokesperson for the Royal Bank of Scotland (RBS) was quoted\
    \ as saying that changing consumer habits inform this trend:\n\n“Since 2014, the\
    \ number of customers using our branches across the UK has fallen by 40 percent,\
    \ and mobile transactions have increased by 73 percent over the same period. As\
    \ customers continue to change the way they bank with us, we must change the way\
    \ we serve them, so we are investing in our branches and re-shaping our network,\
    \ replacing traditional brick and mortar branches with alternative ways to bank.”^([1](#ch09.xhtml#ch09fn1))\n\
    \nOn its part, the blockchain does more than offer banks and other financial service\
    \ providers better, cheaper, and more efficient ways to deliver their services.\
    \ More than anything else, it tampers with and even shifts the balance of power\
    \ within the ecosystem. In particular, it gives end users more say about how they\
    \ receive financial services. These are the consumers of the bank’s product and\
    \ services, for example, the everyday man on the street and his deposits or a\
    \ business using the bank to complete its transactions. It can even stretch as\
    \ far as wealth management for retail investors. The blockchain also reduces the\
    \ barriers to entry in the financial services industry, at least in terms of technical\
    \ infrastructure. Of course, anybody thinking of starting a financial services\
    \ business has to meet often stringent regulatory requirements.\n\nMore importantly,\
    \ the blockchain technology provides the tools for individuals and businesses\
    \ to transact directly without having to go through trusted third parties. We\
    \ call this peer-to-peer (P2P) transactions. For the first time, it is possible\
    \ for two or more entities (or counterparties) to engage in a complex but well-structured\
    \ financial transaction, including remittance, without having to involve any bank\
    \ or financial institution. This is a significant shift as to how society functions\
    \ in as far as money is concerned.\n\n### **How crytocurrency changed the landscape**\n\
    \nAt this point, let us begin by exploring how blockchain is transforming banking\
    \ and finance through cryptocurrencies. The world first learnt about blockchain\
    \ through the success of its first-ever application, Bitcoin. The technology has\
    \ continued to count its most successful apps among cryptocurrencies. Now we have\
    \ hundreds of other cryptocurrencies, in addition to Bitcoin, including the likes\
    \ of ZCash, Dash, Monero, and Litecoin. Every year, more and more new coins join\
    \ the list, and will likely continue far into the future.\n\nThe traditional banking\
    \ and financial system is built on fiat money, which is a currency backed by the\
    \ power of the state. Through cryptocurrencies, the blockchain challenges the\
    \ long-held belief that money has to be issued by the government. Indeed, human\
    \ society has witnessed before periods when private currencies were in great use.\
    \ For example, between 1837 and 1866 in the United States’ history is called the\
    \ wildcat banking period. The term “wildcat” refers to the rampant privately issued\
    \ money at the time. Banks, local governments, churches, hotels, and even small\
    \ businesses issued their own currencies. This practice was put to a stop by the\
    \ National Bank Act of 1863.\n\n### **Is Bitcoin even money?**\n\nBy 2009, when\
    \ Satoshi Nakamoto launched Bitcoin, very few could imagine a financial system\
    \ not based on government-issued currency. Perhaps this is why many have asked\
    \ if Bitcoin should even be considered money. Expectedly, the state did not take\
    \ kindly to the challenge of its power to issue money. For example, during a congressional\
    \ hearing on cryptocurrency in the United States in 2018, Congressman Brad Sherman\
    \ expressed the frustration the government had over the rise of cryptocurrencies.\
    \ He said:\n\n“It \\[Bitcoin\\] hurts the US government in (…) our ability to\
    \ have the dollar as the chief means of international finance, which is what has\
    \ underpinned our ability to impose sanctions. An awful lot of our international\
    \ power comes from the fact that the dollar is the standard unit of international\
    \ finance and transactions clearing through the New York Fed, and it is critical\
    \ for major oil and other transactions. \\[Bitcoin\\] puts us in a position where\
    \ the most significant sanctions we have on Iran, for example, would become irrelevant.”\n\
    \nHis proposal was for the country’s legislature to pass a law that would stop\
    \ cryptocurrencies and thus protect the government’s ability and power to control\
    \ the financial system—maybe a 21st-century version of the National Bank Act.\
    \ However, the fact that Bitcoin, as well as other cryptocurrencies, do not have\
    \ central points of control makes it very hard for them to be stopped even with\
    \ the threat of use of force."
  fmt: '

    To summarise, before setting out to build a new blockchain, you need to determine
    whether your business actually needs it, in particular that the existing blockchains
    do not have the capacity and features it needs. Also, you need to ascertain if
    you are able to build the blockchain and at what costs, and if it all indeed makes
    business sense. Then lastly, bring together and inspire a community to maintain
    it in such a way that it is secure and worthy of being regarded as a blockchain.


    ^([1](#ch08.xhtml#ich08fn1)) “How to Build a Decentralized App (DApp) on EOS -
    Merehead 3747.” Merehead, 16 Apr. 2020, [merehead.com/blog/how-build-dapp-eos/](http://merehead.com/blog/how-build-dapp-eos/).


    ^([2](#ch08.xhtml#ich08fn2)) “Blockstream.” Crunchbase, [www.crunchbase.com/organization/blockstream/current_employees/current_employees_image_list](http://www.crunchbase.com/organization/blockstream/current_employees/current_employees_image_list).


    ![image](images/pt-2.jpg)


    # The Applications


    | ![image](images/ch-9.jpg) | | **Use Case 1: Banking and Finance** |


    | --- | --- |


    There is little question that the most successful use case of the blockchain so
    far is the delivery of financial services outside traditional banking and financial
    systems. This is through two primary types of applications: cryptocurrency and
    decentralised finance, or DeFi, as they are commonly called.


    The former is more pronounced at this point, but is unlikely to remain so in the
    coming decade, at least going by the upcoming DeFi projects. We will look at both
    types of blockchain applications in detail later.


    ## Blockchain: threat or evolution?


    First, this has to be stated: blockchain is the first real threat to the central
    banking system. However, if the industry embraces it with the right approach,
    the technology has the potential to change it significantly and for the better.
    It is apparent that the banking and finance sector can derive far more changes
    from the blockchain than it did from the Internet in past decades.


    The Internet has changed banking and financial services in a significant way too.
    However, it did not even attempt to tamper with the balance of power within the
    ecosystem. More or less, the traditional financial institutions have retained
    their control on the banking system. One could even argue that the Internet has
    helped the big financial institutions entrench their hold further.


    The Internet as a new technology has only increased efficiency and extra channels
    through which banks could reach their customers. It also helped them cut operational
    costs. Most banks have either gone slow on opening new branches or closed some
    of their existing branches, because they can deliver most of their services online.
    This has definitely had the effect of increased profit margins. According to one
    report by the BBC in June 2018, over 60 bank branches had been closing down every
    month in the United Kingdom. A spokesperson for the Royal Bank of Scotland (RBS)
    was quoted as saying that changing consumer habits inform this trend:


    > “Since 2014, the number of customers using our branches across the UK has fallen
    by 40 percent, and mobile transactions have increased by 73 percent over the same
    period. As customers continue to change the way they bank with us, we must change
    the way we serve them, so we are investing in our branches and re-shaping our
    network, replacing traditional brick and mortar branches with alternative ways
    to bank.”^([1](#ch09.xhtml#ch09fn1))


    On its part, the blockchain does more than offer banks and other financial service
    providers better, cheaper, and more efficient ways to deliver their services.
    More than anything else, it tampers with and even shifts the balance of power
    within the ecosystem. In particular, it gives end users more say about how they
    receive financial services. These are the consumers of the bank’s product and
    services, for example, the everyday man on the street and his deposits or a business
    using the bank to complete its transactions. It can even stretch as far as wealth
    management for retail investors. The blockchain also reduces the barriers to entry
    in the financial services industry, at least in terms of technical infrastructure.
    Of course, anybody thinking of starting a financial services business has to meet
    often stringent regulatory requirements.


    More importantly, the blockchain technology provides the tools for individuals
    and businesses to transact directly without having to go through trusted third
    parties. We call this peer-to-peer (P2P) transactions. For the first time, it
    is possible for two or more entities (or counterparties) to engage in a complex
    but well-structured financial transaction, including remittance, without having
    to involve any bank or financial institution. This is a significant shift as to
    how society functions in as far as money is concerned.


    ## How crytocurrency changed the landscape


    At this point, let us begin by exploring how blockchain is transforming banking
    and finance through cryptocurrencies. The world first learnt about blockchain
    through the success of its first-ever application, Bitcoin. The technology has
    continued to count its most successful apps among cryptocurrencies. Now we have
    hundreds of other cryptocurrencies, in addition to Bitcoin, including the likes
    of ZCash, Dash, Monero, and Litecoin. Every year, more and more new coins join
    the list, and will likely continue far into the future.


    The traditional banking and financial system is built on fiat money, which is
    a currency backed by the power of the state. Through cryptocurrencies, the blockchain
    challenges the long-held belief that money has to be issued by the government.
    Indeed, human society has witnessed before periods when private currencies were
    in great use. For example, between 1837 and 1866 in the United States’ history
    is called the wildcat banking period. The term “wildcat” refers to the rampant
    privately issued money at the time. Banks, local governments, churches, hotels,
    and even small businesses issued their own currencies. This practice was put to
    a stop by the National Bank Act of 1863.


    ## Is Bitcoin even money?


    By 2009, when Satoshi Nakamoto launched Bitcoin, very few could imagine a financial
    system not based on government-issued currency. Perhaps this is why many have
    asked if Bitcoin should even be considered money. Expectedly, the state did not
    take kindly to the challenge of its power to issue money. For example, during
    a congressional hearing on cryptocurrency in the United States in 2018, Congressman
    Brad Sherman expressed the frustration the government had over the rise of cryptocurrencies.
    He said:


    > “It [Bitcoin] hurts the US government in (…) our ability to have the dollar
    as the chief means of international finance, which is what has underpinned our
    ability to impose sanctions. An awful lot of our international power comes from
    the fact that the dollar is the standard unit of international finance and transactions
    clearing through the New York Fed, and it is critical for major oil and other
    transactions. [Bitcoin] puts us in a position where the most significant sanctions
    we have on Iran, for example, would become irrelevant.”


    His proposal was for the country’s legislature to pass a law that would stop cryptocurrencies
    and thus protect the government’s ability and power to control the financial system—maybe
    a 21st-century version of the National Bank Act. However, the fact that Bitcoin,
    as well as other cryptocurrencies, do not have central points of control makes
    it very hard for them to be stopped even with the threat of use of force.

