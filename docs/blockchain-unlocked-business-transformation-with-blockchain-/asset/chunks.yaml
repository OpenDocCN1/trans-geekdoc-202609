    ## **Foreword**


    The world today is so similar yet so different from what our ancestors experienced
    in the last 200 years. So similar in that we still know little about space exploration
    or the deepest depths of the ocean. So different in that we now have a treasure
    trove of information at the click of a button. What will the next 200 years bring
    us?


    We are in an era of data explosion with more than 90 percent of the world’s data
    created in just the last three years. It is a jungle in the data world, where
    every step we take or turn is fraught with potential danger to lose sensitive
    data and information. More than US$600 billion has been lost in online fraud and
    scams, with an estimated US$6 trillion to be lost annually by 2021. In 2017 alone,
    cyberattacks saw an increase of more than 600 percent. We are living in a world
    that is increasingly noisier, insecure, and less trustful.


    Three key technologies that will impact us greatly in such a world are Artificial
    Intelligence, Blockchain, and Cybersecurity. AI for clarity, Blockchain for trust,
    and Cybersecurity for peace of mind. While many people see them as separate implementations,
    I believe that each are but one leg of a tripod; we need all three to be stable
    and to futureproof ourselves in the coming unknown.


    Just 25 years ago, Jeff Bezos was—when he decided to start Amazon—asked, “What
    is the Internet?”. Now *Blockchain Unlocked* comes at an opportune time, where
    the world is still asking, “What is blockchain?”. Daryl has taken something complicated
    and organised, structured, and articulated it in a manner that is understandable
    and applicable to the everyday interested person. When a lot of people are talking
    just about the technology, Daryl has focused on what really matters: how do we
    use blockchain and how can *people benefit* from it.'
