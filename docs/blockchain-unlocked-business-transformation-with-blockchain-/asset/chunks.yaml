- raw: 'But why Ethereum and not Bitcoin? The Ethereum blockchain is designed as a
    Turing Complete virtual machine (on which you could write programmes or contracts
    that can solve any reasonable computational problem). In particular, it supports
    programming languages that are either mainstream or easy to use. Today, Ethereum
    is no longer the only blockchain that supports smart contracts. The alternatives
    include EOS and Cardano. Even the Bitcoin blockchain has acquired the capability
    to support smart contracts through RSK, a platform layer built on top of it.


    ### **What exactly is a smart contract?**


    Many definitions exist for the smart contract application. It is simply an agreement
    written in a programming language so that a computer can execute it automatically.
    Instead of writing a contract in plain English for counterparties and arbitrators
    such as judicial officers to interpret, the contract is written in the language
    of the computers so that machines can not only read and understand it but also
    execute it. The difference between a contract on a piece of paper and on software
    code is more than how they are written: the paper contract is enforced externally
    (away from the paper), while the contract written in code self-enforces.


    ### **Smart contracts already exist in the real world**


    Even without the blockchain, many smart contracts have been around us for decades.
    Nick Szabo, in his paper, gives the example of a vending machine^([1](#ch06.xhtml#ch06fn1)).
    An inbuilt protocol guides the transaction when you want to buy a can of soda
    from it; the action of inserting a coin into the machine triggers a chain of automatic
    events to deliver the can of soda to you. This chain of events is executed by
    a programme installed in the computer.


    Perhaps a more relatable example is signing a subscription to something like an
    online magazine or a software solution. To some extent, this also happens when
    you set up a standing order with your bank to settle recurring bills such as rent.
    In each of these cases, a computer is instructed to make a particular regular
    action (e.g., make a payment) when a specific condition is met (e.g., a date in
    the month) with little human intervention. The computer programme has to follow
    the classical logic of “If-Then”: if it is the third day of the month, (then)
    pay the subscription to the magazine, pay the software as a service fee, or pay
    rent to the landlord’s account, and so on.


    The point here is that smart contracts can be deployed, launched, and run on centralised
    server systems, and it has happened many times. It is true that blockchain does
    not have to exist for smart contracts to be in use. However, there are critical
    qualities that blockchain technology offers a smart contract, which makes it more
    potent.


    Overall, blockchain gives smart contracts the capacity to handle agreements with
    more significant implications such as selling real estate. In particular, the
    technology gives smart contracts immutability and enforces it with a finality.
    After all, it is undesirable that a counterparty, trusted third party, or an unauthorised
    outsider can change the details or the execution process of the contract.


    On centralised server systems, an administrator or a hacker can access the contract
    easily while it is active and make drastic changes. Its power or control is given
    to one party, who can change the rules at their fancy. In contrast, once a smart
    contract is live on the blockchain, no one can change its details or the course
    of execution. The smart contract has to run its full course. Furthermore, the
    existence of the contract does not depend on the availability of a particular
    server or computer that someone could unplug and render the contract unperformable.
    On the blockchain, smart contracts are sovereign. They have a life of their own
    that no one has the power to control.


    Blockchain also provides smart contracts that are visible and executable by all
    participants. Such smart contract are performed on a public ledger. All the counterparties
    can observe every detail of the execution, making verifiability possible as the
    shared ledger is a shared truth for all counterparties. The blockchain leaves
    a clear and provable path for every element recorded or executed on top of it.


    Smart contracts have a high level of privacy as counterparties do not need to
    involve a trusted third party in their transaction. More importantly, thanks to
    high-level cryptography, they do not have to expose their real-world identities.
    Neither does the blockchain network need this information to verify that the smart
    contract is executing as intended.


    ### **Challenges of using smart contracts**


    Like any other technology, the implementation of smart contracts, especially on
    the blockchain, faces several challenges. One challenge is the legal hurdle. Smart
    contracts have to be recognised before existing laws to be truly enforceable.
    Within the existing laws now, it is easy for one counterparty to ignore the performance
    of a smart contract and seek a desirable enforcement from a court of the law.
    Many points can make the smart contract pronounced null and void. For example,
    in some countries, the law expressly requires the involvement of a third party
    like a notary or a commissioner of oaths for the contract to be considered valid.
    In others, a signature on a physical piece of paper is a significant component
    of a contract.


    Another challenge is having the most knowledgeable and skilled people writing
    the contracts. As it is now, the majority of the most proficient programmers are
    not lawyers, and on the other hand, most lawyers are not programmers. If smart
    contracts are to be trusted with the execution of very critical agreements, they
    have to be programmed by people who should not make mistakes with interpreting
    the law and also cannot produce a smart contract riddled with bugs.


    It is also true that most people want or need to read a contract before it is
    activated. Many would not be comfortable having a smart contract run on the blockchain
    before they know every detail of it and, in particular, how it affects their interests.
    Unfortunately, however, the average person cannot read and understand instructions
    written in a computer language.


    Another major challenge is overcoming errors and bugs in the code, which could
    break the execution or serve as a loophole that others can take advantage of.
    As we saw in [Chapter 4](#ch04.xhtml), one dramatic example was when the first
    major decentralised anonymous organisation (DAO), a virtual entity on the blockchain,
    failed to take off because its smart contract code had a bug. A hacker exploited
    it and attempted to steal close to US$60 million.


    Last but not least, smart contracts might fail to sort out any ambiguity in contracts.
    Very long contracts often have ambiguous statements, which tend to occur, not
    as a result of intent, but by accidental constructions. People, rather than computers,
    interpret such ambiguities better. The counterparties can clarify the situation
    and perform the contract according to the agreed-upon intent. If there is a dispute,
    they put the contract through an arbitration process. But nothing can be done
    once a smart contract is live on the blockchain. If it adopts an unintended interpretation,
    the counterparties will have to live with the consequences.


    ### **Creating your own smart contract**


    Despite its challenges, smart contracts might just be what the Internet is waiting
    for. Systems like the IoT will benefit a lot from smart sovereign contracts as
    smart devices across the vast Internet can enter into contractual terms and can
    perform automatically.


    Smart contracts are smart because they can execute contractual clauses without
    human intervention. It could indeed improve the application of other technologies,
    and also stand to benefit from them. For example, it could be even smarter by
    leveraging AI.'
