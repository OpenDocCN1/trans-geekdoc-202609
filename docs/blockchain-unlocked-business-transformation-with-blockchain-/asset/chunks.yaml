- raw: 'One trend most likely going to preoccupy blockchain developers, users, and
    enthusiasts is a movement towards the true decentralisation of blockchain networks.
    Some elements in the blockchain architecture have proven to be a threat to what
    was intended to be a decentralised peer-to-peer formation. Part of the security
    that the blockchain offers, specifically the immutability of records, comes from
    the fact that no individual or group of people can take over the network and change
    the rules of engagement. This is known as the 51 percent attack. While it has
    not happened yet, it is evident that a single entity can amass resources and end
    up controlling the most considerable hash rate in a network. We have already seen
    situations where some Bitcoin mining pools have reached a point close to having
    more than 50 percent of the network hash rate.


    We already see blockchain protocols designed to overcome this threat. These are
    protocols giving nodes, including the smallest devices such as smartphones, the
    capacity to participate in the mining effectively. For example, the Tangle protocol
    used in the IOTA ecosystem makes mining something every user of the network engages
    in. Another step that developers are taking to mitigate possible centralisation
    of blockchain networks is writing protocols that block ASIC mining, which makes
    it expensive for the ordinary person on the street to participate in mining. The
    more people can afford to mine on a network, the more decentralised that network
    can turn out to be.


    The sixth trend that we should expect to see grow in the period beginning in 2020
    is the interoperability of networks. The true potential of blockchain is going
    to be achieved when different blockchains can communicate and share not only data
    but also value. Many foresee a future of a global network of blockchain networks.
    The technology to make this possible is already available and being tested. They
    include Liquid Network and Plasma Network, both implementing sidechain formations
    (several blockchains being interconnected). One major impact of this development
    is that some of the weaknesses that exist today in relation to the global movement
    of value will be solved. In particular, the reliance on centralised exchanges
    to convert the value from one blockchain to another might be a thing of the past,
    and that could increase security, privacy, and speed for the end-users. On a larger
    scale, that could end up making the entire Internet truly decentralised, in opposition
    to what it is today where a few corporations hold considerable sway.


    ### **More intentional technological investment**


    The seventh trend likely to become more visible post-2020 is the movement towards
    building blockchains that are resistant to emerging technologies, in particular
    quantum computing. Almost every major technology company—Google, Microsoft, IBM…
    you name it—is working towards making quantum computers a reality, and it seems
    we are already there. Quantum computers could provide the capacity to manipulate
    data in a way that has never been available to us before, and that includes doing
    it in unimaginable speeds. Of course, this technology stands to do a lot of good,
    including opening up more possibilities in medical science through new forms of
    research. It, however, also turns out that it poses a threat to blockchain protocols.
    In particular, it might make blockchain in its current form, insecure as a single
    quantum machine can have a hash rate that is faster than an entire network can
    achieve. And that could give it the ability to overrule a network and thus arbitrarily
    make changes to the shared ledger. It could also make it possible to break the
    cryptography that blockchains rely on so much to secure ownership of value. With
    that stated, the community behind blockchain is very much aware of this threat.
    Blockchain developers are already working on protocols that could be resistant
    to this powerful machine. These efforts are only going to increase in the period
    after 2020, especially as the adoption of quantum computing grows^([3](#bm01.xhtml#ch19fn3)).


    The eighth trend that we are likely to see in the period post the year 2020 is
    fewer projects designed as quick money-making schemes. The focus is most likely
    going to be on projects designed to create value in the long term, in particular
    those that provide service, improve automation, and provide security and also
    privacy. We might never see a repeat of the 2017 and 2018 ICO craze. Going forward,
    there is going to be a more calculated investment into different kinds of projects.
    We are likely to witness the collapse of many of the projects that were initiated
    in 2017 and 2018 through massive ICOs. And that is going to be either because
    of regulatory interventions (such as what is happening to Telegram, where its
    founders are fighting the Security Exchange Commission over the legality of their
    ICO) or because the business models were never sound to begin with.


    Other trends we should expect going forward include increased blurring of the
    line between the real world and the blockchain. In particular, a lot more real-world
    assets could be tokenised, such as real estate, cars, precious metals, and businesses.


    Also, the Internet identity is most likely to move into the blockchain, especially
    with the launch of the Decentralised Identity Foundation (DIF) in May 2017, a
    consortium that is exploring ways of using blockchain for identity management
    on the Internet. The membership has close to a hundred technology companies and
    startups, including Microsoft, IBM, Accenture, Hyperledger, and MasterCard. The
    project is set to develop new protocols for identifying everything from websites,
    emails, and computers to real estate, and cars online.


    We might also see increased adoption of smart contracts in the period, which might
    end up being the most important application of the blockchain, with its full potential
    being realised in this decade.


    The period beginning in the year 2020 is going to be a very interesting one in
    regard to blockchain. The focus is most likely to shift from cryptocurrencies
    towards the other applications of the technology.


    ^([1](#bm01.xhtml#ich19fn1)) “Which Governments Are Using Blockchain Right Now?”
    ConsenSys, 18 Nov. 2019, [consensys.net/blog/enterprise-blockchain/which-governments-are-using-blockchain-right-now/](http://consensys.net/blog/enterprise-blockchain/which-governments-are-using-blockchain-right-now/).


    ^([2](#bm01.xhtml#ich19fn2)) Zhong, Raymond. “China’s Cryptocurrency Plan Has
    a Powerful Partner: Big Brother.” The New York Times, 18 Oct. 2019, [www.nytimes.com/2019/10/18/technology/china-cryptocurrency-facebook-libra.html](http://www.nytimes.com/2019/10/18/technology/china-cryptocurrency-facebook-libra.html).


    ^([3](#bm01.xhtml#ich19fn3)) Pollock, Darryn. “Google’s Quantum Computing Breakthrough
    Brings Blockchain Resistance Into the Spotlight Again.” Forbes, 24 Sept. 2019,
    [www.forbes.com/sites/darrynpollock/2019/09/24/googles-quantum-computing-breakthrough-brings-blockchain-resistance-into-the-spotlight-again/](http://www.forbes.com/sites/darrynpollock/2019/09/24/googles-quantum-computing-breakthrough-brings-blockchain-resistance-into-the-spotlight-again/).


    ## **Afterword**


    Congratulations! By reading to this end, you have not only embraced blockchain,
    you have given yourself a critical backdrop to a technology that is on the verge
    of disrupting society on a magnitude probably never seen before. You are now among
    those who will build or oversee the emergence of the next Amazon, Google, or Facebook.
    You can see the potential of blockchain as well as identify opportunities that
    it presents to you.'
