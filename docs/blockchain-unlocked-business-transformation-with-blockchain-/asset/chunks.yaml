- raw: "A stablecoin has to be issued with a company or centralised entity that would\
    \ commit to holding the amount of dollars (or other assets) equal to the number\
    \ of units of stablecoin issued. The essence of the structure is that users can\
    \ redeem their stablecoin for the asset that backs it. Of course, the use of a\
    \ centralised system to back a coin on the blockchain creates some challenges,\
    \ one of which being transparency and accountability. For example, in April 2019,\
    \ Tether, one of the first stable coins to be issued, faced accusations when its\
    \ audits reflected malpractices and allegations that each coin was not actually\
    \ backed by a dollar^([9](#ch12.xhtml#ch12fn9)). It was also concerning that the\
    \ company was part of one of the largest crypto exchanges, Bitfinex, creating\
    \ a possible conflict of interest.\n\nToday the list of stablecoins has grown\
    \ to over ten, of which the most popular are Tether, USD Coin, TrueUSD, Paxos\
    \ Standard, and Gemini Dollar. All serve primarily as a payment method for traders\
    \ who want to quickly move their dollar value between exchanges as well as between\
