  \n## 用例 6：保险\n\n| ![image](img/ch-14.jpg) | **用例 6：保险** |\n| --- | --- |\n\n2016\
  \ 年 5 月，来自世界各地的五大保险公司聚首成立了 **Bi3（区块链保险行业倡议）**，这是一个联盟，也是采用和利用区块链技术的载体。Bi3 的成立紧随其后的一新兴趋势，当时主要银行和技术公司刚刚成立了\
  \ **Hyperledger** 和 **R3**——银行业两大区块链联盟。自那时起，Bi3 的成员数量持续增长。在本书撰写之时，成员数接近 50 家，其中包括\
  \ **Allianz**、**Swiss Re** 和 **Generali Group** 等巨头。\n\n最初，Bi3 走了一条不同于 Hyperledger\
  \ 和 R3 的路线：它尝试在 **Ethereum** 区块链上进行实验，以观察第二大区块链是否能支持该行业的特定解决方案。后两个联盟则直接着手构建自己的区块链，这类区块链后来被称为私有、许可型分布式账本技术（**DLT**）或企业级区块链。Bi3\
  \ 最终决定转向并拥抱这种新型区块链，但并未自建；2017 年，它们采用了新发布的 **Hyperledger Fabric**。\n\n然而，**Hyperledger\
  \ Fabric** 显然未能满足其特定需求，Bi3 很快又转向了 **Corda**——由 **R3** 设计并构建的区块链平台。2019 年 7 月，Bi3\
  \ 在 Corda 上发布了其首个应用：**B3i Cat XoL**，该应用专门设计用于修复再保险流程、合同和交易的设置与管理相关问题。\n\n### 区块链为保险业带来的收益\n\
  \n再保险只是将从区块链技术中受益的保险四大核心领域之一。其他三大领域分别是：(1) **健康与人寿保险**，(2) **欺诈检测与预防**，以及 (3) **财产与意外险**。让我们看看区块链如何颠覆保险业的各个领域。\n\
  \n#### 再保险\n\n再保险是保险业的关键组成部分。没有它，行业内的企业将更频繁地倒闭。尽管保险公司承担风险并为理赔提供资金，但它们需要盈利，这是该行业任何商业或投资活动的首要动力。保险公司需要赚取足够的资金来支付理赔、覆盖运营成本，并保留一定余额作为投资回报。\n\
  \n然而，很难预测可能发生的损失程度，以及保险公司可能需要支付的理赔金额。极有可能出现一笔巨额理赔，不仅威胁企业的利润率，还威胁其持续经营的能力。例如，如果保险公司承保地震相关风险，一旦在其大多数客户居住的几个城市和城镇发生大地震，它可能面临大量理赔。又如在火灾保险中，城市大面积起火可能波及许多客户。在这些情况下，保险公司可能发现自己支付的支票超出其资金承受能力，从而轻易倒闭。\n\
  \n发明再保险正是为了解决这个问题，其安排有助于将保险公司从可能导致其财务不稳定的巨额理赔中隔离出来。简单来说，一家保险公司与另一家或多家保险公司达成安排以分担风险。因此，一旦发生真正的巨额理赔，各方只需承担较小的一部分。理所当然，此类合同包含对被保险人缴纳保费的分摊。\n\
  \n这种分散风险的形式源于中国古代商人的实践。将货物从产地运往市场时，每位商人会将自家货物的一部分交给其他商人的船只运输。作为回报，他们也在自家船只上装载他人的货物。即使一艘船沉没，群体中每位商人可能都会损失一部分货物，但无人会损失全部存货。\n\
  \n同样，在再保险中，每家保险公司选择与他人分担自身风险，同时也承担他人的部分风险。因此，一旦出现重大理赔，没有任何一家保险公司需要独自承担全部负担^(1)。\n\
  \n这种安排虽对保险公司大有裨益，但始终伴随着成本。参与方须经历漫长的谈判过程，包括反复的文书工作。正如人们所想，这需要多份合同来处理保险公司间的风险分担、保费分摊和理赔处理。例如，如果一份保单由十家保险公司共同承保，则至少需要谈判、签署和管理十份合同。大量精力耗费在寻求共识和为所有利益相关者构建透明环境上。\n\
  \n**B3i** 将保险的这一环节确定为最需要区块链技术的部分，这极有可能是其首创应用 **B3i Cat XoL** 专门服务于该领域的原因。它加快了谈判进程，减少了文书工作，并促进了合同的实施与执行。\n\
  \n值得注意的是，区块链架构在以下方面与再保险安排非常契合：(1) 每家保险公司都是独立实体，如同区块链网络上的节点；(2) 网络上的各保险公司必须相互信任；(3)\
  \ 再保险安排中的所有保险公司都需要一个共同的真相来源；(4) 合同条款指导保险公司间的互动。\n\n在再保险安排中，任何实体都不会失去独立性；各方继续作为独立业务运营，并与其他方保持工作关系。尽管如此，它们需要紧密合作，包括共享共同促成的保单的信息和价值。区块链用协议取代了人工步骤，从而加速了流程。\n\
  \n区块链架构促进了各独立实体间的顺畅交易。所有利益相关者可实时达成共识，使原本可能耗时数天甚至数月的流程在几分钟内完成。在 **B3i** 设计构建的保险应用中，每个经纪人、保险公司或再保险公司并非真正是网络上的一个节点。然而，该技术仍为它们提供了一种机制，使其作为独立参与者达成共识。\n\
  \n\n\n\n\n### 区块链在保险行业的应用\n\n在区块链出现之前，不同保险公司之间要想合作并分担风险，唯一的途径就是相互之间建立并维持信任——这并非易事。仅与熟知的对象合作会极大地限制再保险公司的选择范围。借助区块链，基于熟悉度的信任不再是必需条件。只要报价详情可接受，保险公司或经纪人便可与全球任何其他经纪人、保险公司或再保险公司开展合作。\n\
  \n由于经纪人、保险公司和再保险公司必须基于同一组事实和目标开展工作，尤其是在共同分担风险时，区块链提供的共享账本至关重要，它确保所有参与方在交易的每个节点上都掌握同步信息。例如，经纪人可以查看保险公司和再保险公司的操作，同样，每家保险公司也能看到交易中其他利益相关方的动向。此外，任何单一利益相关方都无法在未征得其他方同意的情况下随意更改合同内容。\n\
  \n最后但同样重要的是，区块链通过智能合约自动化风险分担和履约流程，使利益相关方能轻松订立并执行合同。在无需人工干预的情况下，保费可根据约定条款自动分摊；理赔结算亦可同步自动化完成。\n\
  \n#### 健康与人寿保险\n\n现在让我们看看区块链如何变革医疗保险。我们已在前一章医疗保健（第 13 章）中探讨过该应用的某些方面。区块链改善医疗保险的方式主要包括：增强数据安全性、强化利益相关方隐私保护，以及通过智能合约实现自动化。\n\
  \n保险与医疗系统的数字化势在必行，因为它能提升服务效率与覆盖范围。然而，这也带来了安全挑战。医疗记录属于最敏感的数据类别之一，无论合法或非法实体均对其需求旺盛。承载此类数据的系统（如医疗保险相关系统）面临极高的攻击或泄露风险。区块链通过匿名性、加密技术和不可篡改性保护数据。同样重要的是，潜在客户可携带经纪人、保险公司或再保险公司可直接信任、无需二次核验的数据。这加快了流程并降低了成本，尤其是使整个准入和保单评估过程更廉价、更快捷。\n\
  \n隐私保护与安全性密切相关。保险公司往往需要了解投保人的健康状况，或至少在投保申请和理赔结算阶段掌握风险信息。尤其是当保险公司引入再保险公司等其他方参与交易时，此类数据必须得到最高级别的隐私保护。区块链赋予投保人对其数据的完全控制权，包括按范围和时间提供有限访问权限。投保人仅需展示必要信息且仅在必要期限内展示。投保人甚至可利用零知识证明（`zk-snarks`）等先进区块链协议，在不暴露敏感细节的前提下证明数据真实性。例如，投保人可证明医生已认证医疗记录，而保险公司无需查看实际病历。这使保险公司能基于真实数据行事，同时不侵犯患者隐私。\n\
  \n医疗保险还可从区块链提供的智能合约和互操作性中获益良多。通过在预设条件满足时代码自动执行操作来实现流程自动化，在医疗保险中极具价值。人寿保险便是绝佳例证，虽其与医疗保障略有不同。因验证流程缓慢，人寿保险理赔结算往往耗时数月甚至数年。借助区块链，这可缩短至身故后数天，甚至更短——若医院、公共社保部门与保险公司系统实现互操作。这意味着：身故发生时，死亡证明签发并录入医院系统，保险公司即收到通知并触发理赔处理流程。\n\
  \n#### 欺诈检测与防范\n\n现在让我们看看区块链如何帮助解决保险行业的欺诈问题。根据美国反欺诈联盟“反保险欺诈联盟”报告，仅美国保险业每年因欺诈活动损失高达\
  \ 800 亿美元。其他国家情况可能更严峻。常见保险欺诈类型包括：投保时提供误导性信息、夸大或捏造理赔、冒用他人身份理赔。实施欺诈者涵盖投保人、经纪人、医院等服务提供方，甚至保险公司内部员工。\n\
  \n保险欺诈最终转嫁为消费者成本，并侵蚀经纪人、保险公司和再保险公司的潜在利润。例如在美国，每个家庭每年因此承担的成本在 400 至 700 美元之间^(2)。\n\
  \n保险欺诈的主要推手是数据收集、处理和管理不善：要么错误数据录入系统，要么数据在处理过程中被篡改。\n\n区块链具备在关键阶段修补欺诈漏洞的能力，如准入环节、保单存续期及理赔处理期。它提供了创建和维护可信身份的机制。例如，区块链解决方案`Civic`助力个人和组织管理数字身份。用户在平台创建档案后，信誉随时间积累。每个接收其身份信息以提供服务或访问权限的机构（无论政府机构、私营企业或在线平台）均可独立验证其真实性。这种第三方验证将成为用户档案信誉的一部分^(3)。\n\
  \n此类区块链身份解决方案有助于最大程度减少源自虚假或虚构身份的保险欺诈。此外，通过与其他实体交互积累的数据和信誉，在证明投保人申请时或理赔时提供的细节是否准确、真实方面发挥重要作用。\n\
  \n一旦数据记录入保险系统，区块链使其不可篡改。因此，无人（即便系统最高权限管理员）可随意更改记录细节。若需修改，必须在共享账本上提交针对该变更的交易，所有利益相关方至少会收到通知或获得批准机会。\n\
  \n区块链可管控理赔处理流程以最大程度减少欺诈。首先，可结合生物识别技术，利用`Civic`等解决方案高精度验证索赔人身份——确保`Civic`身份未被劫持。这防止了错误人员提交并获益于理赔。在许多场景下，流程可实现自动化：数据从\
  \ AI 和 IoT 驱动的预言机接收，并自动触发理赔处理，无需人工干预。本章稍后将提供`Etherisc`的一款产品案例，完美契合此场景。\n\n在打击欺诈方面，区块链为身份验证、数据保护与不可篡改化、以及自动化易受干扰的环节提供了更优路径。\n\
  \n\n\n\n\n#### 财产与意外险\n\n最后，让我们看看区块链如何助力财产与意外险（P&C），该险种涉及房屋、汽车等资产的损毁与损失，以及人身伤害的赔偿。\n\
  \n区块链技术带来的收益与其他用例类似——安全性、隐私性和自动化——因此我们不在此赘述细节。相反，我们将探讨区块链技术如何作为更广泛技术生态系统的一个组件，为客户、经纪人、保险公司和再保险公司提供更好的体验。特别是，区块链正证明自己是构建下一代集成保险系统的关键组件，该系统包含其他新兴技术，主要是人工智能（AI）、物联网（IoT）和大数据。保险公司可利用\
  \ AI 通过数据预测结果并实现流程自动化，同时承担大部分以往由人类做出的决策。与此同时，物联网为更高效地收集和共享数据提供了契机。例如，保险公司无需依赖航运公司提供的有关受保物品运输环境条件的数据，而是可直接从嵌入航运船只的传感器和其他设备接收数据。\n\
  \n车险是这四种技术协同工作、为所有利益相关方提供更优保险体验的另一场景。您的汽车可安装不同种类的传感器以收集性能数据。若发生事故，设备可向保险公司发送一份关于实际发生情况的精准报告。因此，保险公司在您甚至尚未联系他们之前，便已知晓您的状况，并了解您是否需要赔偿及赔偿金额。\n\
  \n区块链将使所收集的数据不可篡改，从而防止保险公司通过修改数据以符合其利益（即最小化赔付金额）来欺骗消费者。同时，它也保护保险公司免受潜在的欺诈性索赔侵害。\n\
  \n### 区块链如何改变保险行业\n\n我们已看到行业正在试水这些技术。虽然短期内可能看不到大规模采用，但从长远来看，真正的潜力是存在的。\n\n当那时到来，这些技术将对行业大有裨益，且区块链将作为其后端技术。行业收集、分析和使用的数据，存储和处理在区块链上能更好地保障隐私和安全。此外，AI\
  \ 机器人和物联网设备的流程将由区块链上的智能合约指导。\n\n重要的是要指出，测试已表明区块链可为保险行业带来巨大提振。收益体现在成本削减、运营加速、安全性提升和隐私增强。同时，它也为行业带来了更高的透明度。\n\
  \n根据 B3i 报告，其再保险原型测试表明，保单合同的对手方在采用该技术后效率提升了 30%，因为该应用消除了重复工作，加快了对账速度，并减少了等待时间。它还降低了流动性风险[⁴]。\n\
  \n除了 B3i，其他机构也在构建区块链能力以向保险行业提供解决方案。IBM 是最重视区块链技术的主流科技巨头之一。该公司正在开展的一个项目是构建利用区块链技术的保险行业专用应用。在这方面，公司已与多家保险企业和组织建立合作伙伴关系。其中一项合作是与美国保险服务协会（AAIS）——美国最大的费率局和保险咨询机构——合作。通过此次合作，他们设计并构建了开放保险数据链（openIDL），一个促进并自动化保险监管报告、简化合规要求的平台。该平台的主要功能是提高保险公司与监管机构互动的效率和准确性[⁵]。\n\
  \n除了成熟的保险和科技公司拥抱区块链并利用其创新外，一些开发者和企业家还创立了初创公司在保险领域运营。其中之一 Etherisc 在以太坊区块链之上开发了一个协议，以支持\
  \ dApp 的构建和运行。DIP 是 Etherisc 的原生代币，用于促进去中心化保险应用上的交易，特别是那些由智能合约指导的应用。确实，应用和协议原生的数字代币是区块链为保险行业带来的另一个关键组件。原生数字价值代币对于通过智能合约实现流程和交易的自动化至关重要。以目前的技术来看，若智能合约的资金来源是传统支付方式，几乎不可能实现主权智能合约；中心化支付可能被第三方妥协（如取消服务），从而影响智能合约的执行。\n\
  \n2019 年 7 月，Etherisc 与非营利组织 Oxfam 宣布开始在斯里兰卡招募水稻农户加入双方联合设计和构建的应用。该应用将通过为小规模稻农提供微保险来帮助缓解贫困[⁶]。该产品可通过移动设备访问，帮助农户为农作物投保以抵御极端天气。由于大部分流程在区块链上自动化，成本降低，使得应缴保费相对较低。此外，农户无需提交索赔。相反，系统可检测并判断天气是否极端到足以毁坏农田作物，从而触发智能合约驱动的理赔结算。\n\
  \nEtherisc 首批持牌产品之一是航班延误险，旅客购买该保险可在航班延误或取消时获得赔偿。要符合资格，保险申请须在计划航班起飞前 24 小时进行，并能从在线预言机确认行程。旅客需提供收据以证明其已预订该航班。一旦保单付费（无论以加密货币还是传统支付方式），以太坊区块链上的智能合约即被激活，并依赖预言机提供的航班数据做出关键保单决策。若航班延误或取消，无需填写任何文书或表格即可索赔。智能合约自动接收通知，触发赔付。\n\
  \nEtherisc 的其他产品包括飓风保障、加密钱包保险（若您的加密钱包被攻破且数字资产被盗，可获赔偿）和社会保险。Etherisc 只是众多保险区块链初创公司中的一家。其他初创公司还包括\
  \ Guardtime、Fidentiax、Dynamis 和 Lemonade[⁷]。\n\n### 使用区块链面临的挑战\n\n\n\n\n### 区块链在保险行业的采用挑战\n\
  \n与其他用例类似，区块链在保险行业的采用也面临挑战。最突出的挑战是需要改变法律和监管政策，以便区块链实现的某些流程不仅具有可执行性，而且得到认可。特别是，法律和监管环境必须认识到区块链技术使跨国交易变得容易。因此，它应允许保单购买者、经纪人、保险公司和再保险公司在几乎没有阻碍的情况下开展国际业务。\n\
  \n当然，还有技术能力问题。目前，并非每个经纪人、保险公司或再保险公司都能在区块链上构建应用程序。好消息是，像 B3i 这样的联盟可以极大地帮助行业参与者获取这项新技术。我们也可能会看到更多初创公司涌现，构建开箱即用的解决方案。\n\
  \n总之，区块链已经证明它可以通过多种方式改变保险行业。这将使保险企业及其客户受益，提高速度、安全性、隐私性，并降低成本。\n\n#### 参考文献\n\n[¹]:\
