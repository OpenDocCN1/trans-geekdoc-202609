  \ [www.worldbank.org/en/news/press-release/2019/04/08/record-high-remittances-sent-globally-in-2018](http://www.worldbank.org/en/news/press-release/2019/04/08/record-high-remittances-sent-globally-in-2018)。\n\
  \n| ![image](img/ch-13.jpg) | | **用例 5：医疗保健** |\n| --- | --- | --- |\n\n区块链有望在医疗保健领域实现最具颠覆性的变革之一。这体现在：(1)\
  \ 使高效的医疗信息管理系统成为可能，该系统在国家和国际层面均可互操作；(2) 提供流程速度、数据安全以及患者隐私；最重要的是，(3) 引入一种新颖的医疗数据所有权和使用模式，将患者置于信息管理系统的中心。\n\
  \n最早期的医疗信息管理系统是基于纸质的。医疗服务提供者之间的数据共享主要依赖邮政服务。患者往往需要亲自将硬拷贝文件从一位医生处带到另一位医生处。\n\n\n\n\
  第二阶段伴随着数字信息技术的到来。医院、医疗中心以及医疗领域的其他参与者可以将文件数字化。借助互联网，这些文件可以瞬间从地球的一角传送到另一角。然而，尽管这极大地提高了互操作性，并缩短了文件从一点移动到另一点所需的时间，但仍然存在许多差距和改进需求。\n\
  \n### 为什么互操作性在医疗领域至关重要\n\n在我们审视这些差距和改进需求，以及区块链如何帮助解决它们之前，让我们先回顾一下互操作性和数据共享在医疗领域的重要性。多年来，使医疗记录能在不同医疗服务提供者之间共享的需求已成共识。患者的基因构成和健康史，包括既往检查、用药和手术，往往在诊疗过程中起着关键作用。\n\
  \n医疗数据如何共享关乎生死。根据美国马里兰州约翰霍普金斯医院科学家的研究，医疗差错（包括由医疗服务提供者之间协调不善引起的差错）是美国继心脏病和癌症之后的第三大死因。在医疗体系不发达的国家，情况可能更加严峻。\n\
  \n如果患者每次就医都找同一位医生或同一家医疗机构，其医疗记录（包括纵向病史）将始终易于医生获取，从而使患者获得最适宜的诊疗。然而，很多时候我们不得不向其他医生或医疗机构寻求医疗服务。这通常是由于需要获得更专业的诊疗、使用更好的设备，或仅仅是获取不同的医疗意见。患者搬迁到国内其他地区的新住所，不得不寻找新的医生或医院来满足其健康需求，这种情况也很常见。\n\
  \n患者离开其固定医疗服务提供者时发生急症的情况也时有发生。例如，你可能在出差时不幸突发心脏病，或在国外度假时遭遇事故。在这种情况下，从未与你有过接触的医生会介入并提供你所需的诊疗。至少，他们需要在你能联系到固定医疗服务提供者之前，为你提供必要的即时救治。\n\
  \n无论原因是什么，如果初次见到你的医生能清楚、详细且全面地了解不仅你的当前状态或病情，还有你既往的病史，这将产生巨大差异。例如，他们需要知道你是否对某些药物过敏，是否有血压不稳定等既往症，或者你以前是否遇过类似的健康状况。\n\
  \n通过访问和分析这些记录，并了解之前为你诊疗的医护人员留下的过往记录，你的新医生可以获得足够的理解，从而给你提供最适宜的诊疗。\n\n在互联网出现之前，要快速获取患者此类纵向医疗记录非常困难。通常患者或其直系亲属必须向其主要医疗服务提供者申请医疗档案，档案会以纸质形式送达患者的新医生或医院。或者由医生提出申请。不出所料，整个医疗文件共享过程缓慢、昂贵且不安全。在文件最终送达新医生办公桌前，可能需要数天的反复沟通。\n\
  \n该过程也会花费金钱，其中不乏因检索、准备和发送所涉及的费用。在运输途中，文件面临可能被盗、损坏或丢失的风险。更不用说在急诊情况下，文件可能永远无法及时送达。处理急诊的新医生会浪费大量宝贵时间试图初步了解患者情况。\n\
  \n另一个主要挑战是难以获得患者真正完整的健康史全貌，因为几乎不可能收集到所有曾治疗过该患者的医疗服务提供者的数据。通常可能只能从最近的医生或医院获取数据，但试图沿着链条往回追溯，难度会越来越大。简而言之，患者看过的每位医生只能获得其病史的一个快照，且每位医生都无法核实其他医生掌握的信息。\n\
  \n### 高效、互操作的医疗信息管理系统\n\n随后数字化和互联网出现了。随着医疗记录以数字形式存储，与他人共享变得更容易。然而，仅有数字化和互联网的普及，还不足以让患者轻松携带健康史前往不同的医生和医师处就诊。\n\
  \n首先，需要一个平台，医疗从业者可通过该平台安全、便捷地共享数据。这种平台之所以必要，是因为不同医疗服务提供者使用的医疗记录管理系统无法相互通信。患者和医生仍需提出申请，文件才会被通过电子邮件发送。虽然比寄送纸质文件耗时更少，但仍不够高效。患者仍难以将其病史的所有碎片整合在一个文件中。\n\
  \n同时，大多数医疗机构因安全顾虑，仍不愿将其内部系统连接到外部世界。这些顾虑并非毫无根据。近年来，针对医院的勒索软件攻击变得非常普遍。在这类攻击中，匿名黑客窃取或加密医院系统中的数据，并勒索钱财以解密文件。例如，2019\
  \ 年 9 月底，美国及其他国家的多家医院遭遇此类攻击，许多医院被迫拒收患者，造成了危及生命的局面^(1)。\n\n此外，长期以来，一直缺乏一种简便的即插即用式数据共享机制。外面的医院和医疗从业者使用着截然不同的医疗信息系统。虽然也尝试过解决。为了让不同的医疗记录管理系统能够互通，世界各国政府协助设计并建立了医疗记录交换中心（一种数据清算所形式），以实现互操作性。2004\
  \ 年，美国联邦政府建立了健康记录与健康信息交换（HIE），旨在实现电子健康记录（EHR）在全国范围内的互操作性。\n\n虽然这有助于让医疗记录在需要的地方随时可得，但前路仍存挑战。根据\
  \ 2017 年发布的一项研究，美国约 82% 的非联邦医院在交换信息。然而，只有 38% 的医生诊所和 17%-23% 的长期护理机构加入了该网络。放眼全球，前景也好不到哪里去^(2)。在发展中国家，用于医疗记录管理的技术采用几乎不存在，这要么归因于政治动荡，要么归因于缺乏建立必要基础设施的资源，这持续阻碍着服务交付^(3)。\n\
  \n\n\n\n### 区块链在医疗数据互操作性与所有权中的应用\n\n即使患者记录存储在高度发达的系统中并可通过这些系统访问，互操作性也很难跨越国界。如果您因公出差或度假离开本国，在国外看病时，您的医疗信息通常将无法获取。\n\
  \n无论是国内还是国际医疗互操作性，都可以通过一种易于插拔使用的技术显著改善，这正是区块链试图提供的。将系统部署在云端，非洲农村的医院只需简单的台式机即可接入，无需构建复杂的系统，仍能高效服务患者。如果您前往那里旅行，且您的档案存储在区块链系统上，该医院无需与您本国的医疗服务提供商或医疗数据交换中心建立直接合作关系，医生只需您持有的私钥（或您的直系亲属提供），即可访问您的档案并了解如何更好地为您治疗。\n\
  \n除了缺乏支持医疗记录实时、无障碍共享的必要物流外，医疗行业始终面临另一个关键问题：医疗记录究竟归谁所有？是采集数据的患者，还是采集数据的医疗机构？\n\n\
  在美国，患者拥有医生或医疗机构采集数据的权利。但由于物流挑战，患者始终无法对数据行使完全或至少显著的控制权，包括数据如何用于研究目的。患者束手无策，只能信任数据不仅受到良好保护，而且未经其知情未被给予或出售给第三方。他们唯一能采取的行动是向医疗服务提供商请求一份档案副本。区块链提供了工具，使患者能对其数据的存储、使用和共享拥有重要话语权。\n\
  \n医疗数据归属权问题是一个关键问题，尤其是现在个人医疗信息已成为一个数十亿美元的产业^(4)。大型制药、科技和保险公司，以及高校和政府机构，都对医疗数据感兴趣，以协助其研究和创新。这些实体所做的许多工作最终可能造福人类。但重要的是，它们必须通过正当和合乎道德的途径获取数据，这包括获得数据的个人所有者——患者的明确许可。\n\
  \n在许多国家，法律上医疗数据究竟归谁所有仍不明确。这可能是因为缺乏一种基础设施，让患者能充分行使对其数据的权利。区块链提供了这种能力，这或许能为推动全球法律变革提供必要的杠杆。\n\
  \n#### 提升速度、安全性与隐私\n\n在详细探讨区块链如何赋予患者数据掌控权之前，先了解一下它如何在安全性和隐私方面改进数据处理方式。\n\n区块链在医疗领域保障数据安全、提供用户隐私的方式，与我们在其他用例章节中介绍的并无太大差异。该技术为数据提供了一层加密安全防护。由于数据存储分散在点对点网络中，使其不易受到单点故障攻击。此外，鉴于数据不可篡改，且任何记录变更都需经点对点网络中众多独立计算机确认，勒索软件等攻击可大幅减少。攻击者若想篡改文件，必须控制网络中所有计算机。\n\
  \n有人建议医疗文件无需存储在区块链上，而应仅利用该技术提供文件的引用和索引，以便于查找。推行这种混合系统的主要理由是区块链速度慢、存在扩展性问题。虽有一定道理，但这建立在技术不发展的视角上。\n\
  \n我们已见证区块链扩展方案如何使其达到与传统服务器系统一样快速和易用的程度。即使医院倾向于使用本地数据库，也有更好、更完善的方式在区块链上存储文件，例如使用星际文件系统（`IPFS`）协议，它将文件分片（拆分为碎片）并存储在众多设备中，提高了文件安全性。\n\
  \n在隐私方面，与其他用例一样，区块链通过密码学使医疗数据更私密。虽然账本任何人都可访问，但数据本身不可见。您需要私钥才能辨别文件归属及文件详情。这与服务器系统形成对比：拥有系统访问权限的任何人都能查看每个档案的所有细节，包括设法入侵系统的黑客。\n\
  \n#### 医疗数据所有权与使用的新模式\n\n现在来看区块链如何改变医疗数据所有权及其对共享性的影响。区块链可将医疗数据所有权转移给患者。这主要得益于区块链的三大特性：(1)\
  \ 数据在区块链上变得主权化，(2) 可通过密码学限制数据访问，(3) 可通过智能合约应用规范数据访问。\n\n##### 通过密码学与智能合约实现数据主权\n\
  \n一种简单的数据模型是：患者档案拥有一个公钥和对应的私钥。医生创建笔记添加到档案时，会使用公钥加密文件。每当需要读取文件或添加数据时，患者使用私钥解密文件并授予访问权限。\n\
  \n更复杂的系统将包含多重签名（一个公钥对应多个私钥）。这意味着除患者外，另一人也可持有私钥副本，代表患者或与患者共同解密文件。文件系统还可包含智能合约，规定授予他人访问权限的时长、可读取的具体文件部分等细节。\n\
  \n该技术灵活性足够高，甚至在患者不应查看某部分内容或文件的情况下，也能实现管控。例如，患者可能持有密钥，允许其主要医疗服务提供商使用自己的密钥，授权其他医疗服务提供商访问甚至患者自己也无法访问的关键文件。\n\
  \n将医疗记录所有权转给患者会产生多重影响。例如，患者获得决定谁可使用其数据进行研究的权力。若不愿数据被使用，他们不仅可以说“不”，更可直接不提供访问权限。甚至在向希望利用数据研究的机构授权访问时，他们还能获得收益。数据仅凭患者许可才可访问这一事实，最大限度减少了其被不道德地出售给第三方的可能。若法律规定医疗服务提供商对数据享有某些权利，任何出售都可通过智能合约管理，从而保护交易中所有各方的利益。\n\
  \n\n\n\n区块链在医疗保健领域的应用也将帮助保险公司轻松引入并与购买医疗保险的人互动，并高效地理赔。特别是，这是因为保险公司不需要求助第三方来验证客户提供的信息的有效性。尽管患者控制数据，包括对数据的访问，但数据通过区块链的不可变性得到保护。一旦医生、实验室技术人员或药剂师做了记录，它就是永久的。没有人可以随意删除或更改它。\n\
  \n区块链还可以通过多种方式帮助降低医疗保健成本。首先，与中心化系统相比，它提供了一种更高效、成本更低的数据存储和共享方式。其次，它减少了测试和程序的重复。如果患者在另一家医院做过检查，新医生可以轻松访问该数据并用它做出关键决策，而不是让患者在他们的机构里为可能得到相同结果的同一项检查付费。\n\
  \n该技术还可以帮助降低保险单的成本。这是因为欺诈事件被最小化了。通常，欺诈带来的成本会转嫁给诚实的客户。\n\n该技术还降低了停机的可能性，因为共享账本不依赖单个服务器或几个服务器。即使由于重大灾难导致互联网有一半被破坏，患者数据仍可在现存的互联网片段上访问。这就是区块链让患者数据如此安全的方式。\n\
  \n#### Medicalchain 模型\n\n现在，在撰写本书时，是否已有项目正在区块链上构建医疗数据管理系统？\n\n是的，存在一些。其中之一是 Medicalchain，迄今已在两轮融资中筹集了超过\
  \ 2400 万美元，其中一轮是 2018 年的 ICO。联合创始人 Abdullah Albeyatti 博士是一名医学博士，拥有广泛且深入的培训背景。他在患者数据处理方式及存在的挑战方面拥有丰富经验。在参与\
  \ Medicalchain 之前，Albeyatti 曾帮助构建 Discharge Summary，这是一个医院可通过该平台与家庭医生或全科医生共享出院患者准确记录的平台。它在英国\
  \ Leeds Hospital Trust 的成功提供了开发 Medicalchain 的动力^[5]。\n\n该初创公司已设法与医疗领域的一些主要品牌建立合作伙伴关系，其中之一是\
  \ Mayo Clinic，该医学研究中心总部位于明尼苏达州罗切斯特，但业务覆盖全球。在英国，Medicalchain 与 Groves Medical Group\
  \ 合作，后者是一家拥有超过 30,000 名患者的医疗服务提供商。后者是首家采用并测试 Medicalchain 首个应用程序（称为 Mychain）的医疗服务提供商。通过\
  \ Mychain，患者可以通过视频通话与医生聊天，授予他们访问其数据的权限，并接收基本医疗服务。\n\n为了帮助管理其平台用户的身份，Medicalchain\
  \ 与 Civic 合作，后者是一个利用区块链建立和验证数字身份的平台。这是对平台所有用户的一层保护。这意味着尽管该平台向所有人开放，但为任何目的构建虚假账户变得更难一些。\n\
  \nMedicalchain 的基础结构使用两条区块链：Hyperledger 和 Ethereum。前者处理数据流程，而后者处理涉及账单结算或为研究目的出售数据的金融交易。\n\
  \n在 Medicalchain 系统上，只有患者可以通过使用私钥向医疗服务提供商提供对其医疗文件的访问权限。当患者无法提供此类访问权限时，医生可以从患者佩戴的硬件手环中检索密钥。该手环类似于通常用于列出弱势群体关键医疗状况和过敏信息的手环。\n\
  \nMedicalchain 拥有一种名为 Medtokens 的原生代币，其功能之一是作为一种支付形式来结算账单，特别是远程医疗相关服务。它还旨在促进患者向希望利用其数据进行研究的实体提供访问权限的能力。患者可以协商并以\
  \ Medtokens 接收付款，随后可在交易所将其兑换为其选择的货币。\n\nMedicalchain 并非唯一的区块链医疗信息管理系统项目。其他与 Medicalchain\
  \ 类似的医疗区块链项目包括 Dentacoin、Project Shivom 和 Factom。还有 SimplyVital Health、Coral Health、Robomed、Patientory、Chronicled、Blockpharma\
  \ 和 Tierion^[6]。\n\n### 使用区块链的挑战\n\n最后，让我们看看必须克服的挑战，以使区块链成为医疗保健信息管理系统中真正有用的技术。就像在其他领域的应用一样，存在一些障碍，在医疗保健领域使用区块链并不会非常容易。\n\
  \n一个挑战是区块链的可扩展性，以及随之而来的可实现速度。我们已经看到区块链在扩展方面举步维艰。然而，它必须获得巨大的容量来处理全球医院发生的数百万笔交易。该技术尚未达到这一水平，但正在取得良好进展。\n\
  \n另一个挑战是文件创建、存储和检索方式的标准化。每个医院、医疗机构或国家拥有自己的标准、指南和框架，这可能会阻碍互操作性。不同的系统可能难以互联互通。更关键的是，这可能会使医生和医疗服务提供商难以对同一组数据得出相同的解读。这很容易使患者处于风险之中。\n\
  \n不同国家的法律法规将需要改变，以适应不仅是新的医疗记录保存结构，还有医疗数据的所有权和使用。特别是，法律可能需要反映患者行使对医疗服务提供商收集的数据的权利的现有技术能力。\n\
  \n最后但同样重要的是，需要建设人力资源能力来设计、开发和运行这些新系统。目前，与其他用例一样，缺乏具备构建区块链相关系统所需技能的人才。\n\n总之，区块链为医疗保健领域提供了最具颠覆性的变革。它是技术不仅能改善系统和流程，还能撼动权力平衡、将患者从毫无发言权转变为拥有完全控制权的领域之一。然而，虽然这种颠覆权力平衡的承诺听起来可以接受，但它可能会成为阻碍变革的障碍，特别是因为那些从现有结构中受益的人可能会抵制变革。医疗保健领域的变革可能需要的不仅仅是区块链的潜力。\n\
