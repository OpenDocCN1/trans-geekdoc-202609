  \n| ![image](img/ch-18.jpg) | | **用例 10：区块链即服务** |\n\n| --- | --- |\n\n**软件即服务**（`SaaS`）模式使企业能够更轻松、更方便地使用各类应用程序，而无需承担巨额的初始成本。特别是小企业，无需担心搭建托管软件所需的基础设施，或雇佣合适的技术人员来提供支持和维护。企业只需创建一个账户，在仪表盘上自定义应用程序容量，然后通过网页浏览器即可开始使用。在大多数情况下，他们向软件供应商或技术公司支付服务费，按月或按年计费。在某些情况下，企业按执行的每笔交易支付访问费用。\n\
  \n正如我们在本书前几章所见，区块链有望为企业和其他实体提供各类解决方案。普遍的观点认为，它可能在未来十年内取代所有服务器后端，这意味着企业目前使用的几乎每个软件应用程序都将可在区块链上获得。当然，我们现在已经理解为什么区块链可能是更好的技术，它提供了安全性、隐私性、效率和新的技术能力。\n\
  \n## 区块链即服务（`BaaS`）\n\n在企业使用区块链之前和期间，涉及许多流程、程序和活动。正如其他类型的技术一样，这些对于大型实体来说也可能令人不知所措，这正是为什么**区块链即服务**（`BaaS`）概念受到许多人的欢迎。与其他\
  \ `SaaS` 解决方案一样，`BaaS` 允许企业享受该技术的所有优势，而无需担心技术后端运营，也无需承担巨额的初始成本。\n\n然而，`BaaS` 与其他\
  \ `SaaS` 解决方案之间存在根本差异，特别是关于谁（1）托管软件或应用程序，（2）提供支持，以及（3）进行维护。在本章中，我们将探讨这些根本差异。\n\n\
  ### `BaaS` 的两个层级\n\n首先，必须指出 `BaaS` 至少存在于两个主要层级。一层是区块链核心软件，或作为支持区块链的点对点网络一部分而进行的安装。另一层是构建在区块链之上的应用程序，也称为\
  \ `dApps`（尽管某些 `dApps` 实际上是中心化的）。以太坊为例，第一层涉及共享账本本身的托管和维护，即所谓的以太坊区块链。第二层涉及共享账本上智能合约应用程序的托管和维护。\n\
  \n企业可能需要由第三方负责核心区块链软件或区块链上的特定应用程序。第一种情况发生在公司或实体打算构建一个全新的区块链时。他们需要以摩擦最小的方式完成此任务所需的工具和流程。在第二种情况下，企业需要使用特定应用程序来实现自动化、安全性或扩容。大多数企业，尤其是小规模企业，既需要区块链，也需要其上的\
  \ `dApp` 以 `SaaS` 形式提供。在其他情况下，他们需要 `BaaS`，但会在其之上自行构建和维护应用程序。\n\n### 使用 `BaaS` 的优势\n\
  \n让我们探讨为什么 `BaaS` 至关重要。以下是企业和其他实体需要此类服务的一些原因。\n\n首先，这是规避缺乏构建区块链或其上的应用程序所需的技术能力、人才或技能这一问题的最恰当、最务实的方式。就目前情况而言（至少在本书撰写期间），就业市场上区块链技能和人才短缺。例如，如果您想招聘区块链设计师、开发人员或博弈论专家，可能会举步维艰，因为鲜有人做好充分准备。在\
  \ 2017 年 5 月于纽约市举行的金融科技研讨会上，金融服务公司 `DTCC` 为金融界高管组织了会议，缺乏合适的区块链人才可供雇佣被列为大多数以某种方式利用区块链技术的公司面临的最大挑战之一^(1)。由于这种短缺，初创企业和小企业尤其难以组建有竞争力的团队。企业转而利用第三方已构建的区块链协议和应用程序，这合情合理。\n\
  \n第二个原因是，它帮助企业避免担心系统的持续维护。更重要的是，他们所使用系统的安全性和稳健性由准备更充分、能力更强的人来处理。拥有内部工程师或安全官可能成本高昂，尤其是对小企业而言。使用第三方提供的区块链即服务，企业能获得技术红利，因为服务提供商负责处理大部分关键和新出现的问题。\n\
  \n第三，就技术而言，使用 `BaaS` 可将您的监管责任降至最低。技术的设计师、博弈论专家和开发人员必须弄清其合法性的基本要素，有时会以不违背现有法律法规的方式设计技术。当然，每个企业都必须明白，就遵守法律而言，责任最终在他们自己。然而，让其他人至少承担这部分责任，可以让企业专注于其他问题。\n\
  \n企业考虑使用 `BaaS` 而非从头搭建自有系统的另一个原因是时间。构建一个新的区块链，甚至区块链上的某些应用程序，需要数月甚至数年。然而，接入 `BaaS`\
  \ 通常不需要那么多时间。通常只需开设一个账户，并自定义仪表盘以满足企业的特定需求。这只需几分钟即可完成。\n\n\n\n#### 第五个原因：避免不必要的巨额初始成本\n\
  \n例如，从头构建区块链意味着要支付设计师、开发人员、博弈论专家等人员的费用。这些技能并不便宜。根据一份报告，区块链开发人员的成本在 80,000 美元到 150,000\
  \ 美元之间，时薪在 70 美元到 200 美元之间。此外，你还需要一些硬件来启动点对点网络。更别提市场营销预算，用于说服他人加入你的网络，使其真正成为一个区块链。如果区块链的使用或特定应用需求不是最优的，或者需要很长时间才能达到最优，那么这笔巨大的初始成本很难收回。相反，公司可以简单地通过\
  \ BaaS 利用所需的容量，然后随着业务增长获取更多容量。这要便宜得多，与构建、托管和维护自己的系统所需的成本相比，这微不足道^(2)。\n\n#### 第六个原因：专注于核心业务\n\
  \nBaaS 将允许企业专注于其核心业务，同时最大程度地从技术中受益。例如，一家从事房地产管理的公司，如果决定组建开发团队从头构建区块链甚至应用程序，就会分心。如果他们找到一个现有的区块链或应用程序平台，能提供他们所需的大部分功能，那么这家企业将更好地利用其人力资源、时间和财务去做其他事情。\n\
  \n#### 最后但同样重要：单一实体无法构成区块链\n\n几乎不可能只有单一实体在背后支持却拥有一个区块链。事实上，区块链的理念是许多独立实体通过共识协作维护共享账本。如果一家企业建立并控制区块链的整个网络，它不符合被视为区块链的资格。它只是另一个数据库。\n\
  \n### 区块链服务模型与 SaaS 的对比\n\n现在让我们看看 BaaS 是如何交付的，以及它与其他 SaaS 产品相比可能有何不同。关键的第一步是解释：最初的\
  \ BaaS 产品与我们熟悉的 SaaS 产品并没有太大区别。问题在于这是否是该技术最不合适的模式。我们稍后将看到原因。\n\n在撰写本文时，几家主要科技公司正在向全球企业和政府机构提供\
  \ BaaS，包括 Microsoft（通过其 Azure 区块链平台）、IBM、Amazon（通过 Amazon Web Services 区块链项目）、Oracle\
  \ 和 Deloitte。一些公司专门成立以提供 BaaS 和其他相关解决方案，包括 Hyperledger、R3 和 Factom。随着时间的推移，可能会推出更多的\
  \ BaaS。\n\n#### 私有链与公有链即服务\n\n最知名的 BaaS 解决方案是企业级或私有区块链，由主要金融和科技公司或联盟构建。加入其网络的权限以及读写共享账本的权限仅限于已知且经过批准的成员。\n\
  \n中心化实体承担私有区块链，并迅速成为软件（和协议）的主机，同时也负责维护并为用户提供支持。例如，Hyperledger 托管 Hyperledger Fabric\
  \ 区块链，为使用它作为服务的任何公司或企业提供维护和支持。\n\n私有区块链将自己推销为最适合企业，甚至借用“企业级”一词来描述自己。许多初次了解区块链的人很容易被说服，认为这是利用技术进行业务的一种选择。这是一种误述。但可以论证，所谓的企业级（私有）区块链并非最佳选择，尤其是对小企业而言。首先，小企业无法在做出关键决策的桌面上占有一席之地，例如，作为平等节点加入\
  \ Hyperledger 网络的注册费高达 250,000 美元。其次，私有区块链的设计主要侧重于其背后的主要金融机构和科技公司的需求。\n\n另一方面，以太坊、EOS\
  \ 甚至比特币等公有区块链为企业提供了很多价值。事实上，可以论证小企业通过使用公有区块链能获得更好的收益。它们易于访问，任何人都可以加入网络，无需申请也无需支付任何费用。此外，小企业可以就核心软件（和协议）的改进提出建议。确实，公有区块链非常适合无法构建自己的区块链，也无法作为平等节点加入现有联盟的小企业^(3)。\n\
  \n#### 私有区块链的托管、维护和支持\n\n现在，让我们看看私有 BaaS 在 SaaS 三个关键组件（托管、维护和支持）方面是如何工作的。在私有区块链中，底层软件托管在由已知节点组成的点对点网络上。任何加入网络的人都必须申请并获得管理员或预先存在的节点的批准。然后企业可以使用此平台运行他们想要的任何应用程序。该应用程序可以是企业自己的创作、区块链上第三方的应用即服务，或区块链背后公司提供的产品的一部分。\n\
  \n至于支持，管理私有区块链的联盟或公司为用户（主要是企业和公司）提供必要的帮助。公司雇佣的支持团队将帮助企业，例如入职指导、响应查询并修复用户可能面临的问题。支持还包括为那些需要或想要设计和构建自己应用程序的人提供必要的工具。例如，Corda\
  \ 区块链拥有由 R3 公司雇佣的支持团队。\n\n维护核心软件甚至某些特定应用程序也掌握在负责的开发团队手中，他们还会发布更新并修补可能出现的错误。重要的是要指出，私有区块链上的特定应用程序可能是独立公司的产品。因此，在很大程度上，私有\
  \ BaaS 在许多方面与中心化提供商或供应商的软件即服务和应用即服务相似。\n\n#### 公有 BaaS\n\n当涉及公有 BaaS 时，拥有员工的传统公司模式行不通。这适用于所有三个关键组件：（1）托管、（2）支持和（3）维护，因为所有公有区块链都是真正去中心化的，包括其治理结构。\n\
  \n因此，公有区块链可以作为一种服务，并有潜力改变私有企业。企业既不需要从头构建公有区块链，也不需要在区块链之上构建应用程序。他们可以使用已经可用的资源。与私有区块链不同，公有区块链上的大量容量可以是免费的，或者仅按交易收费。\n\
  \n让我们逐一了解公有区块链中 SaaS 的这三个组件。\n\n##### 由开源社区支持的项目进行托管和维护\n\n\n\n公共区块链已经托管在计算机的点对点网络上。以比特币区块链为例，网络上的节点通过奖励机制获得激励，通过挖矿在共享账本上托管和更新交易。奖励是新创建的原生代币以及区块链用户支付的交易费。在早期，人们必须将整个账本下载到本地设备上，才能在区块链上进行读写。现在情况不同了；通过轻量级节点，人们几乎可以做全节点能做的所有事情。\n\
  \n维护核心软件可以通过多种方式实现。志愿者是最基础的方式。再以比特币为例，任何具备软件开发技能的人都可以提出建议并实施更改，以升级协议或修复已识别的弱点，这在比特币中是通过比特币改进提案（BIP）完成的。核心软件开发者会撰写一份关于其寻求对核心软件进行升级的提案，发布在社区论坛成员可阅读的地方（比特币邮件列表）。然后他们可以继续为核心软件编写代码，包括他们想要看到的更改。新版本准备就绪后，他们可以继续说服社区下载并安装它。确实，通过下载并运行它，用户就是在投票批准其采用。如果更改是软分叉（与旧版本兼容），那么部分网络接受它而另一部分忽略它不会妨碍网络的运行。但是，如果更改是硬分叉（运行新版本的人无法与运行旧版本的人协调），则需要所有人都接受它。否则，在缺乏共识的情况下，网络可能会分裂成两条独立的区块链，这正是比特币现金的情况，当时比特币网络未能就最佳扩容方案形成广泛共识（特别是关于增加区块大小或每十分钟批准的交易批次）。\n\
  \n###### 公共区块链维护的其他模式\n\n除了志愿者，公共区块链还由使用它们的公司支付薪水的开发者维护。例如，钱包提供商、交易所（如 Coinbase）和支付处理商（如\
  \ BitPay）都曾雇佣开发者从事比特币核心软件的工作。核心开发者也受雇于非营利组织，如 MIT 数字货币倡议。\n\n其他公共区块链采用了其他模式来维护其核心软件和协议。例如，DASH\
  \ 拥有一个为项目工作者支付报酬的金库。该金库由 DASH 信托控制，该机构的成员由网络上的节点持有者选举产生。受托人反过来雇佣、管理并支付一组开发者的薪水，他们维护核心软件，甚至为区块链用户提供支持。\n\
  \n###### 公共区块链的支持\n\n因此，就公共区块链的托管和维护而言，最终用户企业无需过多担心。支持环节对于某些项目来说则有点复杂。当你需要技术帮助时，实际上没有人可以求助。因此，如果你将公共区块链用于企业的业务流程，可能不得不雇佣自己的技术人员来解决出现的问题。\n\
  \n话虽如此，很少有企业需要这种支持。帮助对于在区块链上使用特定应用程序更为关键，区块链是一种如此低层级的技术，以至于他们甚至不需要知道它是如何工作的。这类似于中心化的后端服务器，大多数企业对理解它们兴趣不大，因为前端应用程序通常是他们唯一关心的。\n\
  \n现在，大多数使用公共 BaaS 的企业将通过执行特定功能的特定应用程序与其交互。这可以是去中心化的（不归单一实体所有或控制），也可以是中心化的（归拥有它并将其作为服务租赁出去的实体所有）。在这两种情况下，托管和维护都已得到解决，因为它们存在于区块链之上。对于\
  \ dApp，关于如何维护以及使用者如何获得支持，存在多种选择。维护可以通过志愿者进行，就像核心区块链软件的情况一样。中心化公司也可以提供支持和维护，并通过发行原生代币或用户付款获得报酬。确实，实用代币为区块链应用用户如何获得支持开辟了许多机会。\n\
  \n以太坊区块链是一个公共区块链，有几家私营公司提供支持。其中一家公司是 ConsenSys，它在以太坊区块链上构建和维护不同种类的应用程序。\n\n至于中心化应用程序，背后最有可能有一家公司，负责维护应用程序并为用户提供支持。在这种情况下，公共区块链或多或少就是一个服务器后端，其他一切就像传统\
  \ SaaS 一样提供。Factom 是一个由中心化公司作为服务提供的区块链应用程序示例。它促进企业和其他实体将其记录保存系统放在比特币区块链上。\n\n重要的是，公共区块链上的应用程序可以使用类\
  \ DAO 的安排来提供维护和支持。一个极好的例子是我之前提到的 DASH，其中个人开发者和专家为使用该区块链的企业提供服务。作为回报，社区从开发者基金中支付给他们报酬。\n\
  \n### 为区块链即服务付费\n\n让我们看看 SaaS 的一个共同特征，以及它在 BaaS 中是如何实现的：企业如何为其付费。这是 BaaS 与先前 SaaS\
  \ 模式存在显著差异的一个领域。在传统的 SaaS 模式中，用户主要通过月度或年度订阅来支付服务费用。相比之下，区块链自带以加密货币和代币形式存在的原生支付方式，用于支付访问应用程序或服务的费用。\n\
  \n区块链使得按交易付费变得容易，而不是基于时间到期（如一个月或一年）来支付，特别是考虑到微支付在区块链上不仅可行，而且成本可忽略不计。此外，智能合约可以轻松部署以指导交易的执行和支付。\n\
  \n随着对区块链优势理解的加深，越来越多的企业将希望采用这项技术。寻找 BaaS 将使它们更容易做到这一点。特别是，它消除了首先必须了解一切如何运作的障碍。企业只需要知道区块链或其上的应用程序如何解决其面临的问题。\n\
  \n### 使用 BaaS 的挑战\n\n采用和使用 BaaS 的挑战是什么？挑战很多，尤其是对企业用户而言。大多数与该技术的其他用例相似：缺乏技术能力、监管限制，以及用户不了解这项技术的全部潜力。\n\
  \n然而，一个独特的挑战是 BaaS 缺乏适当的包装，特别是公共区块链方面。这使得技术知识很少的用户难以利用这项技术，即使他们不需要托管和维护它。\n\n\n\n\
  \n话虽如此，BaaS 仍有望让这项技术更易于更多企业甚至个人使用。尤其是在拥有大量软件即服务租赁经验的大型科技公司（如微软、IBM 和 Oracle）对区块链表现出浓厚兴趣的情况下，该领域取得了长足进步。\n\
  \n^(1) Matthews, Kayla. “We’re Facing a Blockchain Talent Shortage, Too.” Medium,\
  \ Blockonomics Blog, 25 Oct. 2018, [blog.blockonomics.co/were-facing-a-blockchain-talent-shortage-too-932880212bea](http://blog.blockonomics.co/were-facing-a-blockchain-talent-shortage-too-932880212bea).\n\
  \n^(2) Mishchenko, Anton. “How Much Does It Cost to Hire a Blockchain Developer\
  \ in 2018? Salary Overview and Hiring Trends.” Hacker Noon, 21 June 2018, [hackernoon.com/how-much-does-it-cost-to-hire-a-blockchain-developer-in-2018-salary-overview-and-hiring-trends-908488615142](http://hackernoon.com/how-much-does-it-cost-to-hire-a-blockchain-developer-in-2018-salary-overview-and-hiring-trends-908488615142).\n\
  \n^(3) Ongera Nyairo, Daniel. “Why Enterprise Blockchain Is No Friend To Small Businesses.”\
  \ Medium, The Capital, 30 Jan. 2020, [medium.com/p/why-enterprise-blockchain-is-no-friend-to-small-businesses-19b4a83cb416?source=email-8b0c907c376b--writer.postDistributed&sk=eadc4655d9c009f35c7e30b2db8495d0](http://medium.com/p/why-enterprise-blockchain-is-no-friend-to-small-businesses-19b4a83cb416?source=email-8b0c907c376b--writer.postDistributed&sk=eadc4655d9c009f35c7e30b2db8495d0).\n\
  \n^(4) Taylor, Ryan. “Dash Network Elected Trust Protectors: Closing the Governance\
  \ Loop.” Medium, Dash Blog, 1 Jan. 2019, [blog.dash.org/dash-network-elected-trust-protectors-closing-the-governance-loop-4f07b46da03e](http://blog.dash.org/dash-network-elected-trust-protectors-closing-the-governance-loop-4f07b46da03e).\n\
  \n## 2020 年后的展望\n\n在本章中，我们将探讨未来应预期的一些趋势。但重要的是要指出，没有人能准确预测这项技术到底会做什么，或者在未来五到十年内会演变成什么样。试图这样做，就像在\
  \ 1990 年代初预测互联网将为我们带来 Facebook 这样的社交媒体、YouTube 这样的视频平台以及 Skype 这样的视频通话应用一样。即使是那些致力于互联网基础设施建设的专家，恐怕也无法预见我们今天所拥有的一切。技术只是像滚雪球一样发展壮大，我们在前进的过程中不断发现和发明新事物。同样，区块链极有可能在未来提供如今无人能够理解的服务和解决方案。\n\
  \n然而，预见特定趋势并非不可能，尤其是那些可能在近期发生的趋势。虽然缺乏具体细节，但我们也能推断出这项技术在长期内可能采取的大致方向。\n\n### 比特币将无处不在\n\
  \n我的清单首项是区块链技术的广泛采用。围绕加密货币的炒作似乎已降温，但政府、主流科技公司甚至中小企业正在进行严肃的研究。那些在早期忽视或摒弃比特币等加密货币的人，现在正认真审视其底层技术。他们启动项目、成立公司和联盟，以帮助他们发掘该技术对其业务、系统和流程的价值。他们特别感兴趣的是该技术能提供的安全性、隐私性和自动化。区块链能创造新可能性，并促进\
  \ AI 和 IoT 等其他新兴技术的采用，这对他们也很有吸引力。这些多方面的努力将转化为 2020 年开始的这个十年里，关于该技术采用的大规模运动^(1)。\n\
  \n### 区块链将成为全球金融的核心\n\n该技术正逐步走向全球金融体系的中心。区块链提供了构建适合 21 世纪货币所需的工具。有趣的是，2020 年伊始便爆发了全球新冠病毒（Covid-19）大流行。被引为导致疾病传播的因素之一是实物现金。世界卫生组织特别敦促世界各国政府寻找方法，尽量减少硬币和纸币的使用，因为携带致命病毒的人只需触摸并传递理论上可能被污染的实物现金，就能轻易感染其他许多人。这只是推动数字货币发展的又一个原因。鉴于其特性，在构建减少对实物货币依赖的新金融体系时，区块链难以被忽视。包括中国在内的部分国家（中国是世界上最大的经济体之一）已采取行动，推行政府支持的数字货币^(2)。\n\
  \n尽管如此，区块链也将继续挑战“只有国家才能发行货币”这一观念。2020 年后，越来越多的人将意识到，私人货币（即非由国家权力发行的货币）在某些情况下可以同样高效，甚至更胜一筹。换句话说，得益于区块链为社会提供的工具，我们未来有望看到国家发行货币和非国家发行货币几乎同等程度地被使用。\n\
  \n### 区块链容量的提升\n\n在 2020 年后的短期内，我们将看到大量精力投入到区块链容量的扩展上。诚然，尽管具有革命性，区块链也表现出了弱点，其中之一是容量低，可归类为关键弱点。例如，比特币每秒处理交易数难以超过十笔，这非常低，尤其是与其试图取代的支付服务相比。2017\
  \ 年底，由于建立在其之上的游戏应用 Cryptokitties 活动增加，以太坊区块链一度拥堵。区块链开发者已经开始专注于这一问题，并致力于通过各种方式扩展区块链网络。一些旨在帮助解决扩展问题的解决方案包括闪电网络、雷电网络和侧链。截至本书撰写时，这些扩展解决方案的实施仍处于早期阶段。它们的全部潜力极有可能在\
  \ 2020 年后的十年里得到实现。结果表明，这很可能与该技术在全球范围内的采用增加不谋而合。\n\n### 能源效率更高\n\n第四，我们应关注能耗更低的共识协议的开发和部署。正如前几章所见，最初的区块链共识协议，特别是比特币和以太坊使用的工作量证明，消耗大量能源。这使得它们因温室气体排放而对环境有害。较新的区块链被设计为使用能耗更低的协议，这一趋势将随着时间的推移而增长。确实，以太坊计划在\
  \ 2022 年前转向权益证明。比特币社区未来也可能会诉诸硬分叉，采用更环保的共识协议。\n\n### 真正的去中心化\n\n\n\n\n区块链开发者、用户和爱好者最可能关注的一个趋势是向区块链网络的真正去中心化迈进。区块链架构中的某些元素已被证明会威胁到原本旨在构建的去中心化点对点结构。区块链提供的部分安全性，特别是记录的不可篡改性，源于这样一个事实：没有个人或群体能够接管网络并更改交互规则。这被称为“51%攻击”。虽然这种攻击尚未发生，但显而易见，单一实体可以积累资源，最终控制网络中最大的算力。我们已经看到，一些比特币矿池已接近拥有超过网络\
  \ 50%的算力。\n\n我们已经看到旨在克服这一威胁的区块链协议。这些协议赋予节点（包括智能手机等最小设备）有效参与挖矿的能力。例如，IOTA 生态系统中使用的\
  \ Tangle 协议使挖矿成为网络每个用户都参与的活动。开发者为缓解区块链网络可能出现的中心化而采取的另一措施，是编写阻止 ASIC 挖矿的协议，这使得普通人参与挖矿的成本变得高昂。能够负担得起在网络上挖矿的人越多，该网络就能变得越去中心化。\n\
  \n第六个趋势是网络的互操作性，我们预计从 2020 年开始这一趋势将增长。只有当不同区块链能够通信并不仅共享数据，还能共享价值时，区块链的真正潜力才能实现。许多人预见了一个全球区块链网络的网络的未来。实现这一目标的技术已经可用并正在测试中。它们包括\
  \ Liquid Network 和 Plasma Network，两者都实现了侧链结构（多个区块链互联互通）。这一发展的一个主要影响是，当今与全球价值流动相关的一些弱点将得到解决。特别是，依赖中心化交易所在不同区块链间转换价值可能成为过去式，这将为最终用户提高安全性、隐私性和速度。在更大范围内，这最终可能使整个互联网真正去中心化，与当今少数大公司掌握巨大影响力的现状形成对比。\n\
  \n### 更有意图的技术投资\n\n第七个趋势是构建能抵抗新兴技术（特别是量子计算）的区块链，这在 2020 年后可能变得更加明显。几乎每一家主要科技公司——Google、Microsoft、IBM\
  \ 等——都在致力于使量子计算机成为现实，似乎我们已经触及门槛。量子计算机能以从未有过的方式操纵数据，且速度难以想象。当然，这项技术能带来许多益处，包括通过新形式的研究为医学科学开辟更多可能性。然而，它也对区块链协议构成威胁。特别是，它可能使当前形式的区块链变得不安全，因为单台量子机器的算力可能超过整个网络的总算力。这将赋予其推翻网络并任意更改共享账本的能力。它还可能破解区块链高度依赖的加密技术，从而威胁价值所有权的安全。区块链社区对此威胁非常清楚。区块链开发者已经在研究能抵抗这种强大机器的协议。这些努力在\
  \ 2020 年后只会增加，尤其是随着量子计算的普及^[3]。\n\n第八个趋势是，2020 年后设计为快速赚钱计划的项目将减少。重点很可能会转向旨在创造长期价值的项目，特别是那些提供服务、改进自动化、提供安全性和隐私性的项目。我们可能永远不会再看到\
  \ 2017 年和 2018 年 ICO 热潮的重演。未来，对不同类型项目的投资将更加审慎。我们可能会见证许多 2017 年和 2018 年通过大规模 ICO\
  \ 启动的项目倒闭。这要么是因为监管干预（如 Telegram 的情况，其创始人正因 ICO 的合法性与证券交易委员会对簿公堂），要么是因为其商业模式一开始就不合理。\n\
  \n展望未来，其他趋势还包括现实世界与区块链界限的进一步模糊。特别是，更多现实资产可能被代币化，如房地产、汽车、贵金属和企业。\n\n此外，互联网身份极有可能迁移到区块链上，特别是随着\
  \ 2017 年 5 月去中心化身份基金会（DIF）的成立，该联盟正在探索利用区块链进行互联网身份管理的方法。成员包括近百家科技公司和初创企业，如 Microsoft、IBM、Accenture、Hyperledger\
  \ 和 MasterCard。该项目旨在开发新协议，用于识别从网站、电子邮件、计算机到房地产、汽车等一切在线实体。\n\n在该时期，我们还可能看到智能合约的采用增加，这最终可能成为区块链最重要的应用，其全部潜力有望在未来十年实现。\n\
  \n从 2020 年开始的时期，在区块链领域将是非常有趣的。重点很可能会从加密货币转向该技术的其他应用。\n\n^[1] “Which Governments\
  \ Are Using Blockchain Right Now?” ConsenSys, 18 Nov. 2019, [consensys.net/blog/enterprise-blockchain/which-governments-are-using-blockchain-right-now/](http://consensys.net/blog/enterprise-blockchain/which-governments-are-using-blockchain-right-now/)。\n\
  \n^[2] Zhong, Raymond. “China’s Cryptocurrency Plan Has a Powerful Partner: Big\
  \ Brother.” The New York Times, 18 Oct. 2019, [www.nytimes.com/2019/10/18/technology/china-cryptocurrency-facebook-libra.html](http://www.nytimes.com/2019/10/18/technology/china-cryptocurrency-facebook-libra.html)。\n\
  \n^[3] Pollock, Darryn. “Google’s Quantum Computing Breakthrough Brings Blockchain\
  \ Resistance Into the Spotlight Again.” Forbes, 24 Sept. 2019, [www.forbes.com/sites/darrynpollock/2019/09/24/googles-quantum-computing-breakthrough-brings-blockchain-resistance-into-the-spotlight-again/](http://www.forbes.com/sites/darrynpollock/2019/09/24/googles-quantum-computing-breakthrough-brings-blockchain-resistance-into-the-spotlight-again/)。\n\
