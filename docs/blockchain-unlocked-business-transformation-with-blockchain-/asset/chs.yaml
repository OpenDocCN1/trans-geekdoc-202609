  \n---\n\n## 用例 8：房地产\n\n![image](img/ch-16.jpg)\n\n房地产是按价值计算的最大资产类别。据全球最古老的房地产代理机构之一\
  \ Savills 统计，该市场价值约 217 万亿美元，超过所有股票和债券的总和。相比之下，黄金市场估值略超 7 万亿美元。房地产也是最稳定的投资市场之一，因此几乎人人都想分一杯羹。大多数人倾向于拥有自住房。遗憾的是，由于多种原因，房地产也是最难进入的资产类别^[1]。\n\
  \n### 房产机遇与障碍\n\n首先，您必须经历庞大的官僚流程才能完成收购。您需要浏览市场上冗长的资产清单，调查房地产代理和托管服务，进行评估，获取信用评分等。一旦买卖双方都有交易意向，就必须起草必要文件，这需要律师、评估师等专业人士的服务。文书工作繁杂、交易成本高昂、潜在延误风险巨大。\n\
  \n这种繁琐的官僚流程导致了第二个障碍：购房处理成本。在某些司法管辖区，收购房地产资产的成本高达总价的 30% 至 50%。考虑到首付所需的巨额资金，这是一个重大障碍。单是这项成本就阻挡了许多潜在的房地产投资者。\n\
  \n\n\n\n#### 第三：房地产欺诈\n\n作为房地产投资者，你不得不面对行业中猖獗的欺诈行为。经纪人和其他参与者经常错误陈述或未能披露他们正在出售或促成租赁的资产的重大事实。毕竟，他们的动机是增加他们的收入规模。确实，单一资产的详情可能会随着潜在买家或承租人的数量而改变多次。此外，已有多起骗子攻破土地所有权登记册并误导投资者将资金汇往错误账户的案例被报道。在美国华盛顿特区的一个案例中，一对夫妇被骗向骗子电汇了\
  \ 157 万美元。结果发现，罪犯已访问了所有权登记服务器，并发起了看似真实的交易^1。根据美国中央情报局（CIA）的一份报告，美国人每年因房地产领域的欺诈损失至少\
  \ 1.5 亿美元^2。\n\n#### 第四：资产流动性\n\n能够迅速将资产变现是许多投资者的重要考量因素。目前，房地产是一个低流动性市场。根据美国在线房地产数据库公司\
  \ Zillow 的数据，一套挂牌房屋售出平均需要约三个月时间。许多投资者因这一现实而远离市场^3。\n\n#### 第五：资产管理挑战\n\n作为投资者，在获得房地产资产后对其进行管理确实极具挑战性。如果你缺乏必要的经验，或因其他事务繁忙，情况尤为如此。寻找合适的代理人代表你管理资产是一个复杂的过程，尤其是要避免成为欺诈受害者。当然，管理不仅包括资产的实体养护，还必须满足使用者的需求，并向有关部门缴纳适当的费用和税率。\n\
  \n区块链技术可以解决大部分这些问题，使房地产市场更友好、更廉价、更安全、更便捷，造福所有人。它能以一种惠及各方的方式显著变革该行业。而且，区块链初创企业和项目已经在为市场构建各种解决方案。\n\
  \n### 区块链为房地产带来的益处\n\n区块链技术究竟能为房地产市场做什么？区块链为该行业提供了以下六大益处：(1) 更好的所有权制度，(2) 更好的资产挂牌方式，(3)\
  \ 促进点对点交易的工具，(4) 管理资产组合的工具，(5) 更好的抵押融资选择，以及 (6) 更高效但成本更低的托管服务。\n\n让我们详细逐一了解这六点。\n\
  \n#### 更好的所有权制度\n\n所有权证书（契据）是一份关键文件，因为它证明了对一块房地产的所有权。几个世纪以来，所有权证书只是一张简单的纸，上面载有房地产编号、所有者姓名，以及见证和监督转让的证人和公证人的签名。还包含监督转让的官员的印章，无论是通过出售还是继承。\n\
  \n随着复杂印刷技术变得更易获取，仅凭纸张本身已不足以作为证明所有权的权威依据。包含所有权记录的登记册成为所有权制度的关键部分。档案通常由第三方机构（通常是公共机构）保管，该机构会确认证书的真实性，并证明其持有人确实拥有相关房地产。\n\
  \n多年来，土地登记册经历了重大变革。最近最重要的一次是数字化。信息技术使得从全球任何地方访问和查询房地产登记册变得更快、更容易。然而，与其他信息和通信技术（ICT）系统一样，数字土地登记册仍易受某些漏洞影响。特别是，它们存在许多单点故障，极易被攻破。黑客能轻松入侵系统，进行修改，最终诈骗毫无防备的投资者。即使是有责任保护记录的人，记录也不安全。在一定诱惑下，登记处的工作人员，尤其是在发展中国家，经常以有利于行贿者且剥夺房地产资产合法所有者权利的方式篡改记录。这些弊端在本书前几章中已有探讨。\n\
  \n考虑到买卖一块房地产所需的所有必要且关键的流程，数字土地所有权系统尚未使该领域的投资达到足够高效。这些系统仍需改进，特别是通过一种提供高效率、更高安全性，甚至互操作性的技术。\n\
  \n我们已经在其他领域见识过区块链为 ICT 系统所能做的。它为土地所有权系统提供的价值也是类似的。首先，区块链使系统安全。特别是，它使得黑客难以攻击系统，因为他们必须成功控制点对点网络中许多独立的计算机，这几乎是不可能的。它也使得无需通过第三方即可更容易地证明所有权。在区块链上，所有权证书获得了一定程度的主权（不依赖任何特定权威机构而存在）以及高可证明性。所有权证书也变得不可篡改。没有人能随意更改其细节。\n\
  \n此外，当区块链上的所有权证书与该技术可实现的其他应用（如智能合约——本书中广泛探讨的一种区块链应用）相结合时，会变得更加强大。这种组合使房地产交易和管理变得方便得多。\n\
  \n初创企业和项目已经在区块链上构建所有权系统。其中之一是成立于 2013 年的 Bitland。在 Bitland 总部所在地加纳，近 80% 的土地没有所有权证书，归社区所有。这使得居住在上面的人面临可能被剥夺的风险。利用区块链，该公司计划帮助西非社区首次为其土地进行登记并获取所有权证书。\n\
  \n在美国，已有多个项目致力于将房地产所有权上链。2018 年底，Overstock.com 公司通过其土地管理子公司 Medici Land Governance\
  \ 与美国怀俄明州提顿县签署了一份谅解备忘录（MOU），以设计和构建基于区块链的房地产所有权系统。同年早些时候，总部位于加利福尼亚的区块链初创公司 Propy\
  \ 公司宣布了一个试点项目阶段，该项目与佛蒙特州南伯灵顿市合作开展。\n\n#### 更好的资产挂牌方式\n\n在房地产挂牌方面，该技术修复了中心化挂牌平台上遇到的许多挑战。挂牌是房地产市场的关键组成部分，没有它，购买者就不会知道待售房产的存在，卖方也就没有渠道接触潜在买家。然而，在中心化系统中，挂牌往往与促进销售和租赁交易的其他系统（如融资方、托管和所有权系统）脱节。这往往导致挂牌房地产资产展示不佳或被错误陈述。\n\
  \n\n\n\n\n### 区块链房地产平台的优势\n\n虚假资产列表容易制造，通常用于欺诈潜在买家和投资者。基于区块链的上市平台可以轻松实现全球化。通过 API\
  \ 或类似协议，它可以与其他基于区块链的房地产平台以及中心化平台互操作，为投资者提供广泛的选择。特别重要的是，产权登记等其他系统可以为特定上市资产的细节提供担保。上市方可以轻松证明房地产的存在，例如，通过使用其控制的、与产权登记中资产关联的私钥对上市信息进行签名。所提供的信息被设为不可变，以便投资者能准确了解其拟投资的标的。\n\
  \n此外，区块链提供了构建优质上市平台的工具，这些平台免费使用或成本微乎其微，远低于中心化系统的收费。这是因为这些平台可以轻松成为社区拥有的开源项目。然而，即使是私有平台，成本也可以很低，因为基础设施免费，或者整个平台的维护资金来自仅在区块链上可能的模式，如分配给开发团队的原生代币。\n\
  \nImbrex 是一个区块链平台示例，旨在连接房地产销售和租赁的所有步骤。在其平台上，资产获得唯一标识，从上市一直贯穿到销售结算。Imbrex 还提供原生支付方式以及智能合约功能。\n\
  \n#### 促进点对点交易\n\n由于房地产市场的单笔交易可能需要数月才能完成，大多数选择投资该市场的人必须做好长期持有的准备。区块链即将改变这一现状。该技术提供了工具，使在几分钟或几小时内（而非几周或几个月）买卖房地产成为可能。更重要的是，它支持点对点交易，即个人直接向另个人出售，无需通过中介。事实上，完成房地产交易耗时长的原因是涉及的官僚程序。这种官僚主义最初是为了保护投资者而产生的，但现在技术可以更有效地提供这种保护。\n\
  \n区块链技术首先通过促进**代币化**来改善房地产买卖。房屋或土地最终在区块链上拥有代表其价值的数字资产。这种数字价值（即代币）携带资产的唯一细节，包括位置、大小甚至所有权历史。代币可以与区块链登记中的资产所有权关联。随后可在交易所交易，持有者在现实世界中被认定为资产所有者。这意味着待售房地产可在上市几分钟内售出。点对点交易得益于智能合约和主权托管应用（稍后详述）。通过移除大多数中介，区块链大幅降低了房地产交易成本。\n\
  \n在区块链上对资产进行代币化极大地提高了其流动性。投资者无需等待数月即可出售资产并回笼资金。这使房地产市场易于进出。事实上，借助区块链应用，持有土地或公寓一两天然后出售获利成为可能。\n\
  \n此外，区块链技术允许投资者购买大型高价值房地产的小份额作为投资。投资者可购买代表资产份额的代币（或代币的一部分），这称为**份额所有权**或**共同所有权**。更重要的是，如果多个投资者共同拥有单一房地产，其关系可通过多签智能合约进行规范。这意味着租赁收入会根据持股比例自动存入每个共同所有者的钱包。\n\
  \n重要的是，技术向所有人开放了国际房地产市场。通过使用区块链上市和资产交易平台，您可以在全球任何地方购买房屋、公寓或土地，甚至无需亲自到场。您也不需要聘请当地房产经纪人和律师。您只需访问在线交易所，购买代表您认为能通过租赁或日后转售获利的资产的代币。此外，您可以选择仅拥有其一部分而非整个资产。对于想分享全球最有价值资产收益但资金不足购买整个资产的投资者，后一种选择是理想的^(4)。\n\
  \nMeridio 是区块链公司 Consensys 的一个平台项目，是将房地产资产代币化以便于交易的区块链平台示例。Meridio 还允许房产所有者以数字份额出售房地产。每个房产可细分为多个份额，每个份额在区块链上表示为一个代币。通过该平台，多个投资者可共同拥有单一房产，使小额投资者能参与高端房地产投资。\n\
  \n#### 管理资产组合\n\n现在让我们关注区块链如何帮助投资者在获得房地产后进行管理。\n\n区块链还为收购后的资产管理提供了许多潜在解决方案。特别是，该技术提供工具帮助所有者轻松出租房产，并通过智能合约指导的交易接收收益。\n\
  \n对于长期租赁，这可能包括一种安排：出租房屋后，租客每周或每月向钱包发送付款。智能合约可包含房屋管理代理，负责处理实地的物理需求。然而，该技术的精妙之处在于共同拥有资产的管理方面。区块链上的智能合约可高效规范不同房产所有者之间的关系，包括公平分配收益和责任。房地产所有者可利用类\
  \ **DAO**（去中心化自治组织）结构就房产做出关键决策，包括聘请代理监管房产。\n\n该技术还为短期租赁或房屋共享提供了适用的解决方案。最近，房地产市场短期租赁激增，呈指数级增长。Airbnb\
  \ 是首家促成房主与需要住宿一两天的旅行者交易的公司。区块链可让房东和客人的体验更佳。首先，该技术拥有必要工具，允许房东和客人直接连接交易，无需通过 Airbnb\
  \ 等第三方。这可降低双方成本，因为客人支付的所有款项直接归房东。\n\n住宿市场可以是一个由用户社区运营的开源 **dApp**，模式类似比特币。开发者可通过社区的小额捐助维护平台。可通过\
  \ **ICO** 计划启动，开发团队向公众出售平台原生货币筹集资金以构建和维护项目。开发团队也可保留部分发行的原生代币用于项目维护。\n\n##### Airbnb\
  \ 案例\n\n\n\n\n\n### 区块链可以解决 Airbnb 等服务提供商面临的一些挑战\n\n例如，房东与房客交换钥匙始终是 Airbnb 交易中充满挑战的一环。当房东不在场接待房客时，在许多情况下，他们被迫将钥匙放在门垫下或交给邻居。这在其他方面非常便捷的服务中留下了一个巨大的漏洞。\n\
  \nSlock.it 是一家德国区块链初创公司，设计了一种区块链解决方案来解决这一问题。它以智能锁的形式出现，您可以使用以太坊区块链上的私钥来开启它。安装在门上的这把锁，让房东无需交换实体钥匙。智能合约在区块链上引导交易；一旦房客付款，智能合约就会以通行密钥（数字钥匙）的形式向他们提供一把钥匙，该钥匙仅在住宿期间有效。一旦约定的访问时间结束，钥匙即失效。房东不再需要担心房客可能会逾期居住，也不必亲自到场办理退房手续。这只是该技术协助管理房地产的一种方式。\n\
  \n一些开发者已经在区块链上设计并构建平台，能为房东和房客提供比 Airbnb 更好的体验。Bee Token 就是一个这样的基于区块链的房屋共享平台，它于 2018\
  \ 年 1 月通过 ICO 募集了约 1500 万美元。该去中心化平台以加密货币促成交易。\n\n### 更好的抵押贷款融资选择\n\n大多数购房者无法全款支付；房产通常是一项昂贵的投资。因此，抵押贷款是一项庞大的业务。金融机构代表买方向卖方支付房地产资产的全部费用。买方随后在合同中承诺分期偿还金融机构，还款期通常很长，有时长达数十年。作为回报，抵押贷款公司通过利息和交易费获得巨额回报。\n\
  \n区块链技术提供了新的抵押贷款融资方式，这不仅降低了借款人的成本，还为小额投资者打开了投资渠道，让他们能投入资金并产生收益。如今，只有银行和金融机构才能为抵押贷款提供资金。通过去中心化金融（DeFi）应用，该技术使得从想要投资此类工具的普通人那里获得抵押贷款资金成为可能。\n\
  \n在区块链上，抵押贷款可以被拆分为代币，然后出售给那些希望为抵押贷款提供资金、并期望在漫长时期内获得回报的人。整笔交易设定在智能合约上，因此每次还款发出时，抵押贷款代币的持有者都会收到等同于其所占抵押贷款份额的款项。\n\
  \n### 更高效的托管服务\n\n最后，区块链如何改善房地产交易，特别是托管服务？正如在金融和银行业（见第 9 章）所见，托管服务在房地产交易中至关重要。它保护买方、卖方和融资方免受潜在欺诈。然而，这项服务并不便宜。平均而言，托管服务费用高达交易资产价值的\
  \ 5%。通过智能合约应用，区块链使得主权的、免费使用的托管成为可能。两个人可以在点对点交易中进行交易，无需第三方参与托管服务。智能合约可以同时持有产权和约定的付款，并在交易双方满足预先约定的条件时进行交换。\n\
  \n项目已经在致力于为房地产行业提供区块链托管服务。其中一个项目是加利福尼亚州一家初创公司推出的 Reasi。该平台将促成端到端的房地产交易，消除对第三方服务提供商（特别是托管公司）的依赖。\n\
  \n### 使用区块链面临的挑战\n\n区块链必须克服一些障碍，才能在房地产领域实现其潜力。第一个挑战是全球法规需与区块链可能的技术能力保持一致。如果没有法律认可，在区块链上进行的交易将无效，例如去中心化抵押安排和区块链上的代币化资产。缺乏认可将减缓房地产业拥抱区块链的步伐。另一个挑战是缺乏互操作性。产权系统必须与挂牌平台对话，两者都必须与交易所和托管服务相连。此外，不同的融资应用和中心化房地产系统需要与其他平台通信。如果没有广泛的互操作性，房地产交易将继续缓慢且低效。\n\
  \n当然，房地产应用区块链还必须应对我们在其他章节中讨论过的可扩展性问题。考虑到全球房地产市场的规模，区块链上的交易数量可能会变得巨大。\n\n最后但同样重要的是，所有利益相关者，包括投资者、开发者、监管机构和其他人，都必须改变思维模式，以便拥抱新技术中的系统。特别是那些已经从现有体系中获益并处于影响政策地位的人，必须被说服。\n\
  \n总之，房地产行业将从区块链技术中获益良多，不仅体现在效率提升、成本降低、安全性增强和透明度提高方面。该技术可以在房地产相关交易的每个阶段提供卓越的平台。事实上，对于房地产的几乎每个方面，初创公司都在构建区块链解决方案以实现变革^(5)。\n\
