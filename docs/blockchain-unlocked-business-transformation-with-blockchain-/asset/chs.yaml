  \n\n![image](img/copy.jpg)\n## 序言\n\n今天的世界与我们的祖先在过去 200 年所经历的世界，既如此相似，又截然不同。相似之处在于，我们对太空探索或海洋最深处依然知之甚少。不同之处在于，我们现在只需点击一下按钮，就能拥有宝藏般的海量信息。未来的\
  \ 200 年将给我们带来什么？\n\n我们正处于数据爆炸的时代，全球超过 90% 的数据仅在过去三年内就已创建。这是一个数据世界的丛林，我们迈出的每一步、每一个转身，都充满了丢失敏感数据和信息的潜在危险。网络诈骗和骗局造成的损失超过\
  \ 6000 亿美元，预计到 2021 年每年将损失 6 万亿美元。仅在 2017 年，网络攻击就激增了 600% 以上。我们生活在一个日益嘈杂、不安全、缺乏信任的世界里。\n\
  \n将深刻影响我们的三大关键技术是人工智能、区块链和网络安全。AI 负责清晰度，区块链负责信任，网络安全负责安心。虽然许多人将它们视为独立的实施方案，但我认为它们只是三脚架的三条腿；我们需要这三者才能在未来的未知中保持稳定、做到面向未来。\n\
  \n就在 25 年前，Jeff Bezos 决定创办亚马逊时，还被问到“互联网是什么？”。现在《区块链解码》出版正逢其时，因为世界依然在问“区块链是什么？”。Daryl\
  \ 将一个复杂的主题进行了整理、构建和阐述，使其变得通俗易懂，且适用于普通感兴趣的人士。当许多人还只在谈论技术本身时，Daryl 专注于真正重要的事情：我们如何使用区块链，以及*人们如何从中受益*。\n\
  \n\n\n\nDaryl 是我相识近 20 年的挚友。他始终保持着强烈的好奇心，对事物的运作原理有着浓厚的兴趣，从最大型的飞机到最微小的分子与纳技术无不涉猎。通过这本书，Daryl\
  \ 在相对较短的时间内梳理了他的知识与经验，给我发送笔记和简短摘要，对书稿甚少感到满意。遗憾的是，如果这本书再晚些发布，或许该叫作*《区块链简史》*了。正如我们所知，技术发展的速度超越了光速，有时甚至超越了时间本身。正如我的导师之一、亚马逊前首席科学家\
  \ Andreas Weigend 所言：“始终保持交付”。\n\n写作很难，即使对于以此为生的作者亦是如此，对于非全职写作者更是难上加难。在本书中，Daryl\
  \ 分享了他对区块链未来几年可能走向的个人见解，旨在提供信息并给予必要工具，帮助读者在如何应对区块链技术这一问题上做出正确决策。我相信他的见解极具价值，因为他分享了自己探索区块链世界的亲身历程。\n\
  \n### 区块链引领的变革世界\n\n我一直对新技术充满激情与热忱。在职业生涯的大部分时间里深耕技术领域，创办过多家科技初创企业，并成功将其中一家推向上市，我始终自问的一个核心问题是：技术的下一步是什么？什么是待解决的重大难题？什么将在接下来影响并改变世界？区块链会改变世界吗？我认为，区块链之于信任，正如互联网之于信息。\n\
  \n实时的变革正在发生：在中国，随着全国性的央行数字货币（中国国家数字货币，即 DCEP）和区块链服务网络（BSN）的推出——据称在撰写本书时已全面投入运营；在美国，Facebook\
  \ 的 Libra 计划旨在创建一个简单的全球支付系统和金融基础设施，以赋能数十亿人；在新加坡，Project Ubin（乌敏计划）正在对区块链和数字货币进行试点，此外公私部门还有许多其他区块链倡议。然而，许多人对区块链究竟是什么仍一无所知。\n\
  \n最大的过错，莫过于无法使用并分享伟大的事物。《区块链解码》的使命之一，就是揭开区块链的复杂面纱，释放其核心优势。真诚的希望是能让更多读者认知、理解，并最重要的是，在日常生活中落地应用区块链。\n\
  \n热烈祝贺 Daryl 完成《区块链解码》并专注于重要的事物。展望未来，再创辉煌。\n\n— **Lim Hui Jie**\n\nVisionGroup Corporation\
  \ 创始人兼执行董事\n\n## 前言\n\n### 简单如 A、B、C\n\n全球创新者、企业家和终端用户都在关注许多新兴技术形式和趋势。然而，我们可以预期在三大广泛领域将看到关键增长，我认为这恰如其分地被称为“ABC”：人工智能（AI）、区块链和网络安全。依我之见，这三项技术对所有其他技术都有重大影响。我坚信，它们是未来几乎所有行业增长的基石，这也是我对它们产生浓厚兴趣的原因。\n\
  \n首当其冲的是，作为个人和企业，我们必须重新学习“ABC”，以更好地为未来做准备。我们希望提前了解这些技术和趋势将如何改变企业和整个社会。本书涵盖了我作为一名日常打交道技术的企业家所获得的这一宏观视角。特别是，区块链可为物联网（IoT）中的\
  \ AI 设备提供关键支持和隐私保护，这也是我选择透过 B——区块链——这一透镜来聚焦 ABC 的原因。\n\n现在让我们逐一梳理我 ABC 组合中的各个要素，并总结每一项可能如何影响世界。\n\
  \n#### A 代表人工智能\n\n拥有类人认知能力的机器，即人工智能，至少自 1950 年代起就作为一种构想存在。然而，我们始终未能将其变为现实。早期曾充满希望，认为\
  \ AI 的大规模应用触手可及。从业者和密切关注者们相信，在一二十年内，机器将接管工业流程，包括规划、设计和执行等环节。主要期望是，在极少人工干预的情况下，它能解决社会面临的许多问题。\n\
  \n然而，这一梦想在六七十年代破灭，因为政府、科技公司和大学的关注点转移他处。结果导致 AI 研究和创新的资金枯竭。这一时期被称为“AI 寒冬”。随后在八九十年代，迎来了复苏。新一代科学家重返这项曾在学界、商界、政府和社会激起极大希望的技术。一些政府和投资机构再次愿意倾听并提供必要的资金支持。此后采取了许多步骤，但直到千禧年之际，我们才开始看到\
  \ AI 和机器学习有了实质性发展。\n\n这一次，阻碍在于缺乏其他必要的技术能力。虽然 AI 在理论上可行，但它需要大容量内存和高速数据处理能力，这些在 1950\
  \ 年代并不存在，但正如摩尔定律所预示的，多年来逐渐变为现实。现在，我们拥有了以最有用方式实现 AI 的最适宜技术环境。结果，几乎每家大型科技公司都拥有强劲的\
  \ AI 项目，全球众多初创企业也在从事 AI 相关工作。\n\n随着更多流程实现自动化，交付速度随之加快，AI 将让生活变得更轻松。该技术使商品和服务的生产成本略微降低，并有潜力提供人力往往缺乏的效率。例如，机器为患者做手术的出错几率远低于人类外科医生，因为它具备在更短时间内以更高准确度处理更多数据的优势。\n\
  \n我们大多数人已经有过某种形式的 AI 应用体验。例如，Facebook 已部署它执行面部识别，而 Telegram 等其他社交应用则开发了必要能力，允许第三方编程和部署聊天机器人以响应查询并向用户提供关键信息。值得注意的是，这些聊天机器人在工作中学习，随时间推移变得更有效。更多颠覆性的\
  \ AI 应用正涌入市场。几乎每家主要汽车制造商都在测试自动驾驶汽车，一些国家甚至已制定必要立法以适应这一新现实。\n\n#### B 代表区块链\n\n\n\n\
  字母 `B` 代表区块链。这项技术使若干事情成为可能，而在仅仅十年前，这些事情似乎是不可能的，包括独立实体在点对点网络上就交易状态进行协作。换句话说，它使得去中心化网络上的多台独立计算机能够通过共识流程在短短几秒内就单一真相达成一致，而无需中央权威。它带来的另一项价值是数字数据的不可篡改性。在区块链出现之前，除了限制访问权限外，没有任何方法能保护在线数据不被任意篡改。即便如此，你也必须相信系统管理者足够正直，不会干涉数据。有了区块链，数据改由协议来保护，且无人能够干涉。这种不可篡改的特性还解决了由来已久的双重支付问题，该问题曾阻碍真正的数字现金的诞生。\n\
  \n重要的是，通过智能合约应用和支持小额支付的原生数字货币，区块链可以实现物联网中 AI 设备之间的金融交易自动化。例如，一辆自动驾驶汽车可以为在充电桩获得的电量付费。简单来说，自动驾驶汽车和电动充电桩可以在无人工干预的情况下达成并完成一笔商业交易。\n\
  \n因此，区块链凭借其不可篡改性和去中心化后端的独特特性，最适合保护 AI 系统处理和存储的数据。该技术还通过公私钥加密提供机制，为与智能设备交互的人提供隐私保护。\n\
  \n#### C 代表网络安全\n\n互联网在很大程度上仍然是无法无天的“西部荒野”。各方行为体几乎可以为所欲为。匿名性为罪犯提供了掩护，让他们得以窃取、勒索，甚至破坏关键数据和系统。这个问题不易解决，因为互联网伴随着几个巨大的两难困境。人们和企业需要将数据放在线上以更高效地访问或提供服务，但这样做会使他们面临被盗、被勒索和隐私泄露的风险。另一个两难在于，试图让互联网更安全的努力往往导致践踏部分用户的权利。例如，强制要求实名上网以追踪潜在的不法分子，必然会侵犯所有人的隐私权。\n\
  \n尽管如此，网络安全正成为一个主要关切，尤其是随着海量敏感数据和流程上网。个人和企业每年因黑客攻击损失数十亿美元。随着 AI 和区块链等新技术的出现，风险可能更高，迫使企业、政府和个人将更多数据、资金和流程上链。同样重要的是要指出，随着互联网变得更快、更广阔、更包容，黑客也在随着时间的推移变得更聪明、更强大。问题随之而来：如何在不践踏任何人权利的前提下，让互联网对所有人都更安全？\n\
  \n有趣的是，网络安全的解决方案也来自新技术，特别是区块链和 AI，它们为我们提供了前所未有的工具。就区块链而言，它允许通过不可篡改性和去中心化来保护特定数据。如前所述，不可篡改性使得数据一旦创建就难以更改其形式，而去中心化使得数据难以被窃取或销毁，因为这需要接管成千上万甚至数百万台独立计算机，这当然是不可能的。因此，区块链使得在不影响互联网用户隐私的前提下保护互联网安全成为可能。\n\
  \n区块链还提供了另一种保护数据的方式。通过加密学，数据可以被加密，且只能通过私钥访问，而私钥可以离线存储。AI 技术也赋予了以人力无法复制的方式监控系统的能力。仅依赖人工监管始终是不够的。该技术能够检测和预防人类难以轻易预见的威胁。\n\
  \n我邀请您怀着开放的心态阅读本书。我提供的是一个个人视角，关于技术——重点关注新“ABC”——在未来几年可能会如何演变。写作本书的初衷是为了传递信息，并为您提供当下所需的工具，以便为未来的技术做出正确决策。\n\
  \n希望您喜欢。\n\n## 简介\n\n本书包含极少的技术内容。没有关于编码、构建区块链或去中心化应用（`dApp`）等方面的指导。完全不懂区块链的读者也能轻松阅读并理解本书。尽管如此，对该技术有深入接触的读者也能获得新的视角。\n\
  \n您可以期待获得一项实用的能力，即无论对于商业还是公共政策，都能对区块链技术做出明智的决策。本书分为两大部分：第 1 部分 带领我们了解技术基础，使您对相关概念有足够的了解，为\
  \ 第 2 部分 奠定基础，后者涵盖了该技术的不同用例。\n\n在本简介中，我重点介绍了每一章的重要观点，以概述全书脉络。希望这能为我们探索区块链背后的广阔主题提供清晰的指引和路线图。\n\
  \n我们首先探讨区块链究竟是什么。第 1 章 将该技术拆解为核心组件，解释各组件的功能。它描述了这些组件如何协同工作，从而成为区块链这项强大技术的基石。它解释了区块链技术相对于其试图取代的中心化系统的优势，并预判了这项技术将如何改变商业格局。\n\
  \n第 2 章 客观审视区块链的能力与潜力，探讨其能做什么、不能做什么，以及我们在哪里应划清界限。本章还试图解释为何区块链并非解决所有“现存问题”的灵丹妙药。内容涵盖其优势，如去中心化、不可篡改性和通过加密学实现的隐私保护，以及其劣势，如扩展性差和依赖互联网连接等第三方基础设施。\n\
  \n第 3 章 涉及一种许多人认为迄今被开发得最彻底的区块链用途：代币。它解释了区块链代币到底是什么、存在哪些不同种类，以及企业如何利用这项技术能力。它着重介绍了四种主要类型的代币：(1)\
  \ 首次代币发行（ICO）代币、(2) 实用代币、(3) 资产支持代币，以及 (4) 证券型代币。\n\n第 4 章 深入探讨许多考虑采用该技术者最关心的问题——区块链本身以及运行在其之上的应用和系统的安全性。它试图从三个角度回答区块链是否安全的问题：(1)\
  \ 保护您对区块链资产的所有权以及您的身份和活动隐私，(2) 区块链是否能抵御不法分子攻破、接管或摧毁其整个系统的可能性，以及 (3) 核心软件的稳健性，以及随之而来的协议稳健性。\n\
  \n\n\n\n## 章节概览\n\n### 第 5 章：区块链类型\n第 5 章 定义了区块链的类型，主要为公有链和私有链。它提供了两类示例，并探讨了它们的区别以及优劣势。重点关注三个主要差异领域：\n\
  1. 对共享账本上数据的读写访问权限\n2. 核心软件的开发与维护方式\n3. 系统依赖博弈论有效运作的程度\n\n### 第 6 章：智能合约\n第 6 章\
  \ 探讨了智能合约的概念。这是一种几乎专门用于区块链的应用，被认为是其长期来看最具颠覆性的应用。本章解释了什么是智能合约、如何工作，以及为何它是一个极具潜力的应用。同时回顾了智能合约的历史（该概念早于区块链约\
  \ 15 年），并阐述了为何区块链是智能合约最合适的基础。\n\n### 第 7 章：区块链在商业中的应用\n第 7 章 聚焦区块链在商业中的应用。它探讨：是否所有企业都需要这项技术，以及特定需求应如何指导企业接纳并将技术融入其系统。这是一个关键问题，因为普遍认为每个企业都能从区块链受益。本章从三大效益类别作答：\n\
  1. 对数据和系统的更好安全性\n2. 改善用户在线隐私\n3. 在速度、容量和成本方面的更高效率\n\n### 第 8 章：构建自己的区块链\n第 8 章 延续前文讨论，转而探讨构建自有区块链的可能性。它解释了促使企业或个人设计、开发自有区块链的条件，并指出若决定构建将面临的障碍。本章旨在帮助回答三个问题：\n\
  1. 你真的需要一条新区块链吗？\n2. 你具备设计和构建新区块链的能力吗？\n3. 你能否聚集并激励社区支持和维护它，使其长期成为一条真正的区块链？\n\n\
  ## 关键在于“如何做”，而非“何时做”\n\n在 第 2 部分 中，我们探讨区块链技术如何、且已在如何改变各行业的商业模式。这可能是本书对许多读者最关键的部分。\n\
  \n### 第 9 章：银行与金融\n我们从 第 9 章 中区块链在银行和金融领域的应用开始。特别是，本章不仅探讨技术如何取代该行业的传统机构，还探讨它如何成为福祉而非诅咒。还涵盖了新兴的去中心化金融（DeFi）应用，并给出了利用该技术的项目示例。本章还解释了区块链如何与以往技术不同，改变了金融和银行业的权力平衡。\n\
  \n### 第 10 章：供应链管理\n第 10 章 带我们了解区块链在供应链管理中的用途。除了列出区块链改变供应链的方式，还提供了构建此特定用例应用的项目示例。本章阐述了区块链为供应链管理提供的四大核心优势：\n\
  1. 提高效率并降低运营成本\n2. 简化合规与质量认证\n3. 为最终消费者提供可靠的溯源\n4. 使贸易融资更快、更安全、更廉价的工具\n\n### 第 11\
  \ 章：公共治理\n第 11 章 涵盖应用区块链如何改善公共治理。它给出了技术可立即实现的事项示例，并描述了其彻底改变政府概念的潜力。本章从两方面对区块链对政府的影响分类：\n\
  1. 改进现有流程和系统\n2. 彻底改变政府的概念\n\n### 第 12 章：支付应用\n第 12 章 探讨区块链在支付应用中的用途。重点在于加密货币、代币和其他资产作为交换媒介、价值存储和记账单位的用途。它探讨了该技术如何轻松实现跨境资金流动，以及区块链上的微支付等能力如何改变其他行业。区块链支付用例作为一个广泛领域，涵盖以下三类：\n\
  1. 客户对客户（C2C）支付解决方案\n2. 企业对企业（B2B）支付解决方案\n3. 两者的结合，可以是 B2C 甚至 C2B\n\n### 第 13 章：医疗保健\n\
  第 13 章 涵盖区块链如何改变医疗保健系统，特别是医疗服务的提供。它探讨了区块链如何有望在医疗保健领域实现最具颠覆性的变革之一，体现在：\n1. 实现一个在国家和国际层面均可互操作的高效医疗信息管理系统\n\
  2. 提供流程速度、数据安全以及患者隐私\n3. **最重要的是**，引入一种新颖的医疗数据所有权和使用模式，将患者置于医疗信息管理系统的中心\n\n### 第\
  \ 14 章：保险行业\n第 14 章 探讨区块链在保险行业的用例。它关注技术能实现的系统，以及这些系统如何改变全球风险覆盖方式。还指出了几个正在为该行业构建特定应用的初创公司和项目。它解释了保险业以下领域有望从区块链受益：\n\
  1. 再保险\n2. 欺诈检测与预防\n3. 财产和意外险\n4. 健康和人寿保险\n\n### 第 15 章：能源行业\n第 15 章 聚焦与能源行业相关的用例。它解释了技术如何改变能源的生产和分配，并指出了具体的区块链项目。涵盖区块链技术为能源行业提供的四大核心价值：\n\
  1. 协助数据管理\n2. 实现新的能源分配系统\n3. 作为代币化能源的机制，以实现更高效的管理、供应和交易\n4. 作为向绿色能源转型的后端技术\n\n###\
  \ 第 16 章：房地产行业\n第 16 章 论述区块链技术在房地产领域的应用。本章解释了技术如何改变产权、挂牌和交易系统，并关注技术提供的新机遇。涵盖区块链为该行业提供的六大效益：\n\
  1. 更好的产权系统\n2. 更好的资产挂牌方式\n3. 促进点对点交易的工具\n4. 管理资产组合的工具\n5. 更好的抵押融资选项\n6. 更高效且成本更低的托管服务\n\
  \n### 第 17 章：KYC 与 AML\n第 17 章 探讨应用区块链管理了解你的客户（KYC）和反洗钱（AML）。它首先解释了技术作为 KYC 和 AML\
  \ 解决方案背后的讽刺意味——其初始应用（加密货币）旨在规避全球现有的此类系统。我们深入探讨了该技术修复银行和监管机构现有系统的潜力，这些系统旨在监控洗钱和恐怖融资。\n\
  \n### 第 18 章：区块链即服务\n第 18 章 探讨如何将区块链作为一种服务获取。它探讨了将使区块链作为服务可用的模型，包括私有企业、开源社区支持的项目以及混合模型。\n\
  \n\n\n\n最后，结语章节展望未来，并试图在撰写本书之时依据已发生的事件预测未来趋势。它试图解释紧随 2017/2018 年繁荣之后的区块链（加密货币）寒冬。本章试图回答这样一个问题：这真的是一个寒冬，之后将迎来春天然后是夏天？还是说这是一个行业应当接受的长期现实？在每一个探讨区块链在特定行业应用的章节中，本书也探讨了阻碍实施的挑战。\n\
  \n![image](img/pt-1.jpg)\n\n## 核心要点\n\n| ![image](img/ch-1.jpg) || 区块链技术将如何改变商业\
  \ |\n\n| --- | --- |\n\n区块链的首个应用 `Bitcoin` 于 2009 年初推出。这是一项相对较新的技术。但许多人同意，它将显著改变社会，特别是商业版图。在德勤\
  \ 2019 年全球区块链调查中，全球 53% 的商业领袖表示区块链是其组织的关键优先事项^(1)。这比上一年增长了 10%。\n\n如果你与区块链领域的人交谈，许多人会迅速将区块链的演变与互联网相比较。许多人相信，最终区块链对社会的影响将与互联网相同。这很可能是夸大其词。然而，无论你深入哪个行业，都有人在讨论如何利用这项技术，这足以成为你寻求理解它的充分理由。网上有无数的文章、视频，甚至演示文稿试图描述区块链技术。关于区块链的书单也在不断增长。然而，考虑到这是一项全新的技术，许多人仍然无法理解它，这是可以理解的。往往阻碍理解这项技术的是“知识的诅咒”；许多试图解释它的人假设你拥有与他们相同的信息背景和语境。类比仍然是解释该技术的最佳选择，即使许多类比最终被证明与实际情况相去甚远。\n\
  \n我从 2014 年初就进入了这个领域——在区块链时间线上这是很久以前的事了。我关注过许多关于这项技术的讨论。更重要的是，我多年来一直在观察该领域的趋势。慢慢地，我倾向于一种我认为最能解释该技术的类比。\n\
  \n### 区块链与拜占庭将军问题\n\n拜占庭将军问题源于计算机科学对一种情境的描述：参与各方必须就单一策略达成一致以避免失败。然而，一些参与方是腐败的，散布虚假信息，且不可靠。\n\
  \n让我们深入这个故事。\n\n一支完整的军队分为两个师，包围了一座城市，但面临一个复杂的后勤问题。两个师分别驻扎在敌城的两侧（东和西）。这座城市足以抵御一个师的进攻，但若两个师同时进攻则会陷落。因此，两个师需要在完全相同的时间进攻。如果进攻时间不一致，他们将会失败。\n\
  \n因此，每个师的将军需要就进攻的确切时刻达成一致。他们只能通过派信使在两个师之间往返来通信，没有其他通信方式。毕竟那是远古时代。例如，A 将军会发送信息：“嘿，B\
  \ 将军，我们打算周三进攻。你们会跟我们一起进攻吗？”。信使将信息送达给 B 将军，后者回复：“周三不行——女士之夜。周四怎么样？如果我们周四进攻，你们会跟我们一起进攻吗？”。信使将信息送回给\
  \ A 将军，以此类推。\n\n然而，这里有个转折：信使在传递信息时可能被劫持和抓捕。取而代之的是，一个 `#fakenews` 信使可能会故意发送错误信息，欺骗另一位将军在错误的日子进攻城市。无法核实信息是否真实。他们如何创建一个“无需信任”的系统，以确保进攻时取得胜利？\n\
  \n这就是拜占庭将军问题。\n\n### 什么是区块链？\n\n区块链是一台运行在计算机点对点网络上的虚拟机。它可以托管并运行几乎所有类型的应用程序。支付系统、云存储、智能合约、土地注册、供应链管理系统、网站——你想得到的都可以。任何可以在中心化服务器上启动的应用程序，都可以在区块链上启动。\n\
  \n区块链还可以托管并运行那些无法在中心化服务器系统上工作的应用程序。我们已经在传统互联网（即区块链出现前的互联网）上运行了所有这些应用程序。有什么比在运行于点对点网络之上的虚拟机上拥有它们更好的呢？\n\
  \n这是一个根本性的问题。它触及了区块链拥有未来的核心原因。但在回答这个问题之前，让我们先从宏观上了解区块链是如何运作的，以及为什么它是一台虚拟机。\n\n计算机网络自\
  \ 1960 年代以来就已存在。（这里的网络是指多台计算机拥有相互通信的通道。）最早的网络是中心化的^(2)，这意味着计算机必须通过中心服务器相互通信。服务器是一台具备促进计算机间通信能力的计算机。多年来，点对点网络得到了发展。这是指一台计算机可以直接与另一台计算机通信，而无需通过中心服务器。事实上，互联网本身就是一种点对点网络的形式。但严格意义上的点对点网络出现于\
  \ 1990 年代末。它首次体现在 `Napster` 中，用户通过安装特定软件加入该网络与他人共享音乐^(3)。\n\n但即使有了这一发展，某些事物仍然离不开中心服务器。特别是支付系统。为了让支付系统运作，必须存在一个中心服务器来托管和维护交易账本。网络上的人们必须相信记录是准确的。特别是，负责服务器的人必须值得信任，不会篡改记录。但即便如此，服务器仍会被黑客攻击，数据被窃取或记录被任意篡改。\n\
  \n#### 有许可 vs. 无许可\n\n区块链的实现可分为两类：有许可（仅少数人可读/写）或无许可（任何人可读/写）。这些区块链可进一步细分为三个子类：\n\
  \n1. 公有链\n2. 联盟链\n3. 私有链\n\n虽然公有链和联盟链可能是中心化或去中心化的（决策可能由中央机构、选定的多人群体或任何人做出），但私有链始终是中心化的（决策由中央机构做出）。\n\
  \n区块链决策是中心化还是去中心化，这与其数据如何分布是截然不同的。在后者（即分布式账本）中，数据或信息可能存储在多个节点，并可能由多个群体管理。然而，在前者中，区块链的决策制定、新区块的写入或对基础协议变更的投票，可能是中心化或去中心化的。\n\
  \n推广区块链的奠基者们，通过 `Bitcoin` 将最初的用例设定为无许可且去中心化的，即采用一种去中心化模型，其中每个人都可以参与、贡献和协作——这在 `Bitcoin`\
  \ 的特性中得到了充分体现。\n\n\n\n\n\n为了本书的简化起见，对区块链和分布式账本的引用可能会交替使用（尽管从技术上讲它们并不完全相同）。在某些情况下，区块链可能被泛指为中心化或去中心化的协作模型。\n\
  \n这些不同的方法将在本书第 2 部分中各行业的用例中进一步阐述。\n\n### 比特币系统如何工作\n\n进入视野的是比特币，区块链上的第一种加密货币和价值存储手段。\n\
  \n让独立的计算机就单一账本达成一致并为其做贡献，可被描述为 21 世纪最令人兴奋的 IT 创新之一。2008 年底，一个使用中本聪这一化名的个人或团体发布了一份白皮书^(4)。文中描述了一个点对点网络，该网络通过精心设计的共识机制维护交易的共享账本。\n\
  \n点对点网络中的独立计算机不需要中央服务器来促进它们之间的交互。为了相互通信，每台计算机都必须下载并安装核心软件。正是这款核心软件包含了交互规则（协议）。确实，中本聪所做的关键性工作是弄清了协议，并将其落实为每台加入网络的计算机都必须安装的核心软件。多年来，一群志愿者程序员一直通过共识来维护核心软件。\n\
  \n通过核心软件中的这些共识规则，比特币点对点网络中的计算机维护着一份交易账本。你看，在银行这样的中心化系统中，中央权威机构通过其代理（无论是人工还是机器出纳）存储和维护交易账本。比特币也有账本。然而，与中心化支付系统不同，它作为副本存储在网络上的每台计算机中。\n\
  \n现在，最大的挑战是让每个人都拥有一份完全相同的账本副本。如果一份副本包含另一份中没有的交易，支付系统就会失效。中本聪通过引入挖矿的概念解决了这个问题。利用协议规则，网络中的计算机每十分钟选出其中一台来更新账本。\n\
  \n它们究竟是如何执行这一过程的？\n\n网络上的计算机按照协议提供的规则参与一场竞争。竞争涉及每台计算机获取十分钟内发出的交易请求，并将它们组合成一个区块。然后每台计算机将对其区块中的数据进行哈希运算，以符合协议要求的数值。最先找到该数值的计算机，其版本的区块将被接受为账本上的下一个有效区块。它将连接在先前被接受的区块之后。\n\
  \n所有其他计算机将把它们的副本与获胜机器的副本进行同步。贡献了下一个有效区块的计算机将保留挖矿奖励——新发行的币。这一过程不断重复，在某些方面类似于立法选举。多人参与竞选，胜者获得制定法律的权力，而在本例中，则是获得在共享账本上记录交易的权力。而且这不是每四五年一次，而是每十分钟一次。\n\
  \n比特币账本被命名为区块链，因为数据是以形成链条的区块形式存储的。\n\n事实证明，这种在共享账本或数据存储状态上达成共识的方式，甚至可以用于与支付无关的交易。例如，使用类似协议的点对点网络可以就应用程序代码的执行达成一致。这正是使该网络成为一台可取代旧式中心化服务器的虚拟机的原因。通过具备对交易和数据达成共识的能力，点对点网络中的计算机可以作为一个整体运作。或者说作为一台可以执行各种应用程序的单一虚拟机。\n\
  \n回到我们之前的问题：为什么我们应该更倾向于这台虚拟机，而不是旧式的中心化服务器？\n\n使用区块链最显著的优势之一是，该技术消除了我们在服务器上遇到的单点故障。区块链上没有任何一个节点可以被攻击以使其瘫痪。只要互联网的任何部分还在运行，区块链就会继续工作。\n\
  \n区块链还使数字数据或记录具有不可篡改性。一旦记录生成，没有人可以随意删除或更改其内容。例如，这使得黑客入侵土地注册系统并更改资产所有权几乎成为不可能。\n\n\
  它不仅使点对点交易成为可能，而且更便宜，因为它消除了使交易变慢、变贵的第三方。\n\n让我们继续以土地所有权为例来说明这一点。如果你想购买一处房产，在当今大多数国家，你将不得不依赖许多第三方：房地产中介、土地注册处（你在其中确认所有权）、公证人，当然还有起草销售协议的律师。如果各国将土地所有权记录在区块链上，大多数这些受信任的第三方将变得无关紧要。而你在交易上的花费也会减少。你可以在注册处搜索一块土地，资产所有者使用私钥就能轻松向你证明他们确实是所有者。使用智能合约应用，你们双方可以起草销售协议。此外，通过平台上的托管服务，你们可以同时交换土地所有权和约定价格。所有这些都可以在几分钟内完成。\n\
  \n在你审视的每一个行业中，区块链都能以类似的方式让事情变得更简单、更便宜。\n\n### 区块链将如何改变商业？\n\n该技术将主要通过以下三种方式改变商业：\n\
  \n#### 1. 为商业系统带来效率、可靠性和安全性。\n\n由于我们不再需要当前系统中至关重要的受信任第三方，区块链将使交易更快、更便宜。它还为企业处理数据的方式提供了一定的完整性保障。它保护数据安全；重要的是，它让人们掌控自己的数据。这对最终用户有利，但对企业未必完全有利。有许多企业建立在利用从人们那里收集数据的基础之上。随着许多人找到方法吝啬地保护自己的信息，这些企业可能不得不重新思考其战略。该技术允许他们仅提供与企业交易所必需的最必要数据。\n\
  \n区块链还改善了知识产权的处理方式。任何提出独特创意的企业都会发现，不仅注册其创新变得容易，而且也容易向他人证明他们最先想出了这个主意。\n\n#### 2.\
  \ 将创造新的业务。\n\n区块链正在创造全新的业务。我们已经见证了矿业公司和数字资产交易所的崛起。\n\n2016 年，我们见证了一次构建去中心化自治组织（DAO）的尝试。这是一种没有中心化管理结构、但拥有投资者并通过签约开展运营的公司。其所有决策均通过投资者的持续投票做出。如果这种模式变得流行，现有企业可能不得不发掘与\
  \ DAO 开展业务的方式。\n\n#### 3. 其他业务将被淘汰。\n\n\n\n\n\n## 区块链对商业模式的影响\n\n区块链将使许多商业模式乃至企业本身变得无关紧要。为了生存，大多数企业可能必须重新思考其模式。否则，它们将面临与柯达或百视达（Blockbuster）相同的灭亡风险，这些公司未能创新或升级业务以跟上世界潮流；柯达因数码相机的出现却坚持冲印照片，而百视达在\
  \ YouTube 和 Netflix 时代却坚持出租 DVD。我们已经看到银行、保险公司和其他行业正在采取积极措施来了解这项技术及其如何影响其商业模式。\n\n\
  即使是优步（Uber）和爱彼迎（Airbnb）等颠覆性企业，也很容易被颠覆，因为它们是聚合资源并在市场上出售的中心化实体。区块链使得例如乘客和司机可以在不通过优步等第三方的情况下会面并交易。通过一个不归任何企业实体所有的开源区块链应用，房东可以接触旅客，并借助智能合约高效地为他们服务，就像在爱彼迎上一样。而且他们不必将收入分成给任何人。\n\
  \n尽管围绕区块链能做什么存在大量炒作，但有理由预期这项技术将显著改变我们做许多事情的方式。这意味着我们需要主动学习它。\n\n#### 参考文献\n\n1.\
