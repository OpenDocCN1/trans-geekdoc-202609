  \n---\n\n## 用例 7：能源\n\n![image](img/ch-15.jpg)\n\n人们在区块链技术中发现的一个缺点是其极端的能源消耗。点对点网络上的计算机在就共享账本上记录的交易有效性形成共识的过程中消耗能源。《Wired》杂志在\
  \ 2017 年的一篇文章中宣称：“比特币正在减缓摆脱化石燃料的快速转型努力。”《商业内幕》2018 年的一篇文章指出：“比特币交易使用了如此多的电力，以至于可能将全球气温推高到一个产生致命后果的临界点”[¹]。\n\
  \n### 区块链的“威胁”以及治愈之道？\n\n虽然这些说法有点夸张和耸人听闻，但其前提并不离谱。特别是比特币区块链，非常耗能。根据多项研究，比特币网络消耗的电力相当于爱尔兰或奥地利等整个国家的用电量（按用电量排名约第\
  \ 39 位）。因此，根据另一项研究，它产生的碳排放量相当于拉斯维加斯市[²]。\n\n这些事实暗示，在能源和温室气体排放问题上，区块链技术不是解决方案，而是一种威胁，或者至少是一个巨大的问题来源。然而，一旦深入探究，你会发现，在很大程度上，该技术正是解决方案。确实，它能为社会利益显著改变能源行业。\n\
  \n首先，随着时间的推移，该技术已证明它可以控制其能源消耗以及向大气释放的碳量。现在公认的事实是，区块链不需要消耗巨量能源即可运行。事实上，我们已经看到了使区块链能耗可忽略不计的共识协议的兴起。事实上，即使是最初设计为高能耗共识机制（特别是工作量证明）的区块链，也正在向权益证明等低能耗机制过渡。\n\
  \n例如，以太坊——按市值计算的第二大区块链——在撰写本书时正通过其 Casper 核心软件实现，从工作量证明向某种形式的权益证明过渡，这将使其能耗减少多达 99%。\n\
  \n比特币社区中的一些人建议，应将消耗最多能源的比特币共识协议替换为低能耗协议。这正演变成一场严肃的运动，未来比特币放弃工作量证明的可能性很大。\n\n###\
  \ 区块链为能源带来的益处\n\n然而，区块链所做的不仅仅是采用降低能耗的共识协议。事实上，这项技术可以为能源行业面临的许多问题提供解决方案。更重要的是，它可能成为推动能源行业惊人创新的基础。\n\
  \n特别是，区块链技术为能源行业提供以下四大核心价值：(1) 协助数据管理，(2) 支持新的能源分配系统，(3) 作为代币化能源的机制，实现更高效的管理、供应和交易，(4)\
  \ 成为向绿色能源转型的后端技术。\n\n#### 数据管理\n\n让我们从数据管理开始。\n\n信息是能源生产、分配和消费的核心。能源行业的参与者，特别是公用事业公司，需要收集、处理、存储和利用诸如能源生产量、生产和分配成本、每个终端客户的消费量以及账单流程等方面的数据。公用事业公司还需要跟踪其资产、资本、债务和负债，以防止不必要的损失。确实，当考虑整个供应链时，能源行业的数据管理领域非常广泛。\n\
  \n##### 肯尼亚电力案例\n\n为了更好地解释能源行业对更好的数据管理系统的现有需求，让我们关注供应链零售环节的一个恰当例证。\n\n东非国家肯尼亚正成为创新的温床。例如，该国最早采用移动货币服务，并保持了最高的服务渗透率。如今，该国近\
  \ 96% 的家庭至少拥有一个移动货币服务账户。\n\n\n\n\n这项通过 USSD 短信访问的金融服务，已成功将金融普惠率从 30% 以下提升至 90% 以上。确实，这是一场改变许多事物的技术变革，例如肯尼亚人消费和支付能源费用的方式。它让获取电力变得更容易，特别是支付电费变得更舒适、更便捷。\n\
  \n然而，肯尼亚国家电力公司（Kenya Power）并不满足于仅拥有一个供消费者汇款的移动货币账号。它决定在这项新支付服务上更具创意一些。移动货币服务推动了该公用事业公司服务提供方式的彻底变革。在此之前，电力用户获取服务需历经诸多周折。特别是每月缴纳电费的时间，变成了一项令人不快的苦差事。通常，人们不得不排队数小时，只为在当地电力公司办公室缴费，这意味着要从工作和其他事务中抽身出来处理电费。\n\
  \n尽管缴费如此麻烦，却又不敢错过截止日期。如果因任何原因无法亲自前往当地公用事业办公室缴费，就必须找人代缴，这往往意味着要额外留出一笔钱支付给对方——考虑到不按时缴费的后果，这点小成本算不了什么。一旦错过截止日期，公司就会派技术人员上门将其从电网断开。那是一种令人极其糟糕的处境。\n\
  \n要恢复供电，必须填写文书申请、结清欠款，并支付技术人员再次上门的差旅费。即使完成所有这些步骤，往往还要等待数天、数周甚至数月，他们才会现身恢复供电。有时，甚至得行贿才能让维修组来处理问题。\n\
  \n这套系统对公用事业公司自身也不利。除了糟糕的客户体验导致客户对服务提供商不满外，服务交付流程成本高昂且极其低效。公司每月都要派遣大量员工深入一线人工抄表，并将数据送回公司录入系统生成账单。由于数据采集靠人工，错误在所难免。这包括抄录表读数不准，以及将数据从纸质表单转录到数字数据库时出错。\n\
  \n还有故意造假的问题。例如，抄表员可能在官方记录中登记比实际用量更少的度数，以此收受贿赂。这最终成了公司的成本：虽然能源被消耗了，却从未被支付，而公司却承担了生产损失。当然，为确保有足够员工每月走访每位客户，公司背负了巨大的工资支出。\n\
  \n直到 2009 年，公司采用了一种依赖能源代币化的智能电表系统。能源单位作为代币从公用事业公司购买，通过移动货币服务支付。现在，用户无需在每月特定时间与大众一起排队数小时，只需在家中或办公室用手机即可完成一切。只需向公用事业公司的移动货币账号汇款，几分钟内就会收到一条包含代币代码的短信。在智能电表上输入该代码，即可接入电网^(3)。\n\
  \n代币耗尽时，供电会自动中断。但用户只需购买更多代币并再次输入电表即可。除了便利性，用户再也无需担心物理断电，以及让技术人员上门复电或支付相关费用的麻烦。\n\
  \n对公用事业公司而言，不再需要大量地面员工抄表并亲自回传数据。电表直接与内部公司系统通信，客户通过手机付款后，系统自动生成代币并分配给客户。这大幅削减了运营成本。\n\
  \n一切似乎都朝着有利于各方的方向发展。然而，2019 年底情况发生变化，曝出代币化能源系统已被攻破。近两年来，部分内部员工与外部不法分子勾结，从客户和公用事业公司双方窃取钱财。他们向客户收取高达官方费率五倍的价格，私吞差价。同时，他们非法生成代币在黑市出售，私吞收入。该骗局规模巨大，威胁到公用事业公司的财务稳健性^(4)。\n\
  \n肯尼亚电力公司采用的代币化能源系统优于以往。它高效、便捷、低成本。然而，只有配合更稳健的数据管理系统，才能发挥其全部潜力。那些被内部蛀虫和外部人员利用的漏洞必须被堵上。\n\
  \n确实，肯尼亚电力公司的代币管理系统需要一种技术，使代币的生成与分配以及收款过程防篡改。这些正是区块链技术能为任何数据管理系统提供的价值。\n\n区块链使得部署一种代币生成协议成为连拥有最高管理员权限的人也无法攻破。该技术在这方面已毋庸置疑地证明了自己。例如，比特币区块链对所有人开放，但没有任何黑客成功攻破系统，给自己或他人分配任何代币（比特币）。\n\
  \n它还能通过不可篡改的智能合约自动分发代币。因此，如果客户向钱包地址付款，智能合约将生成相应代币并发回给客户，全程无第三方人工干预的余地。这杜绝了虚高定价，也杜绝了任何人从客户付款中截留未经授权的分成。\n\
  \n此外，建立在区块链上的系统难以被外部攻击，因为没有中心攻击点。简而言之，区块链消除了肯尼亚电力公司等传统系统所面临的中心故障点。既然公司能保障数据安全、保护交易，就能提供卓越的客户体验，避免因盗窃和腐败造成损失。\n\
  \n肯尼亚电力公司截至本书撰写时尚未采用区块链来修复其在能源代币生成和销售管理中面临的问题。然而，能源领域其他国家的参与者已看到该技术在保障数据和分发渠道安全方面的潜力。其中之一是智利国家能源委员会（CNE）。2018\
  \ 年，这个南美国家的公共能源监管机构宣布启动一项区块链能源项目。\n\n该项目与区块链软件技术公司 ConsenSys 合作。它将探索以太坊区块链，用于记录、存储和追踪该国能源生产、分配和消费相关的数据。\n\
  \n当然，基于区块链的数据管理系统也将受益于用户隐私的改善。我们已在其他用例中见过其运作方式。在能源领域也不例外。\n\n#### 新的能源分配体系\n\n\n\
  \n\n### 区块链改善能源行业的第二种方式\n\n现在，让我们看看区块链改善能源行业的第二种方式。\n\n长期以来，电能的流动是单向的。它始于发电实体，后者从水电大坝、风力发电场、地热电厂或核能电厂生产能源。然后，这些能源被传递给公用事业公司，后者再将其出售给最终消费者。在某些情况下，发电公司同时也是处理供应链零售环节的公用事业公司。\n\
  \n然而，在过去十年中，情况开始发生变化，供应链不再是单向流动。旧模式正被一种新模式取代，即由众多本地发电主体生产更多能源，以补充主供应商提供的能源。如今，消费者在全球范围内普遍自行发电，特别是利用太阳能和风能。这种趋势日益流行且易于实施，原因有很多，包括所需技术多年来已显著改进。用于本地能源生产的太阳能电池板和电池，其容量远高于几年前的产品。此外，全球人口对保护环境的必要性有了更深的认识，并理解选择更环保的能源是为环保做贡献的一种方式。\n\
  \n事实证明，随着时间的推移，消费者产生的能源超过了他们的消费量。一些公用事业公司已建立系统，允许此类消费者将剩余电力释放到电网供他人使用。支持这一功能的最基础技术是双向电表和变压器，它们可双向传输能源（进出场所和住宅）。由此产生的交易被称为**净计量**。\n\
  \n简而言之，当客户家中或场所的太阳能电池板或风力发电场产生的电力少于客户所需时，电网提供额外电量；反之，若产生的电力多于所需，多余能源将释放到电网。公用事业公司根据客户的生产和消费情况向其买卖电力。在账单周期结束时，计算净值并据此结算。如果客户消费多于生产，他们需支付来自电网的补足电费；若消费少于生产，公用事业公司按预先约定的单价向其支付收益。公用事业公司可用现金支付，或将余额结转以抵消未来交易。\n\
  \n最终，净计量帮助消费者削减电力支出，并为他们提供了一条收入来源。同时，公用事业公司增强了向电网连接的其他消费者供电的能力，不再依赖单一能源供应商。事实上，随着时间的推移，公用事业公司分发的能源可能有很大一部分来自其客户。同时，该模式为该行业引入了良性竞争，这对所有利益相关者都有利，尤其是因为为电网发电可能成为许多人的可行业务。此外，消费者自发电力成本更低。但更重要的是，它通常对环境更友好。\n\
  \n那么，区块链在这一架构中扮演什么角色？\n\n区块链技术可通过提供在电力公司与向电网回售电力的消费者之间形成和执行合同的机制，使这一向电网售电系统变得更完善。区块链为个体发电者与公用事业公司之间的交易提供了便利。实现此目的的适用工具包括**智能合约**和原生支付手段（代币或加密货币）。\n\
  \n但更重要的是，技术可以支持消费者之间的点对点交易。我们可能会看到新的基础设施，人们通过网络自行买卖能源，无需第三方参与。这将显著降低消费者支付的成本，因为中间商及其运营开支、利润需求被排除在外。这也可能有助于打破长期控制能源行业的垄断。\n\
  \n垄断往往导致关注底线和利润率。毫无疑问，由于缺乏竞争，这会随着时间的推移推高电力成本。高昂的电力成本对弱势群体打击最大。企业也将面临更高的运营成本，这无疑会转嫁给消费者。\n\
  \n一些实体已尝试这种新的能源生产、分配和消费模式。其中之一是 **Power Ledger**，一家总部位于澳大利亚的初创公司，设计并实施了一个系统，让个体创建由能源生产者和消费者组成的网络，称为“微电网”。目前（撰写本书时），Power\
  \ Ledger 将微电网设计为现有国家电网的一部分。然而，长期计划是建立独立、自给自足但以点对点结构互联的微电网，就像区块链网络一样。这可能彻底改变行业，将决策权从大公司转移到个体消费者手中。\n\
  \n#### 代币化能源\n\n区块链彻底改变能源行业的第三种方式是提供**代币化能源**的能力。我们已经在肯尼亚看到了一种代币化应用，使能源的销售或计量对消费者更加便捷。除了便利向最终消费者销售的能源代币化，区块链技术还能促进能源在国际市场上的代币化交易。石油是全球交易量最大的大宗商品之一。区块链使得为每一桶开采出的石油生成代表其价值的主权数字代币成为可能。该数字代币可替代其所代表的实际石油进行交易。这提高了交易的速度、便利性和易用性。\n\
  \n除了简化代币化流程，区块链还允许不同利益相关者拥有一个共享账本，通过它所有方都能实时监控和追踪能源资产。这提供了透明度，并最大限度地减少了市场操纵的可能性。\n\
  \n2017 年初，金融解决方案实体 **Natixis**、**IBM** 以及大宗商品贸易物流公司 **Trafigura** 宣布合作，构建首个用于管理美国原油市场的区块链解决方案。使用\
  \ **Hyperledger Fabric** 平台，这三方将建立一个系统，实现原油交易的数字化。他们选择区块链是因为它提供安全性、透明度和效率。\n\n然而，也许最早、最知名的在区块链上代币化石油和天然气的尝试，是\
  \ **委内瑞拉政府** 于 2018 年初发起的。作为拥有巨大储量的最大产油国之一，委内瑞拉一直面临美国及其他国家的制裁，限制了其从石油中获益的能力。为规避经济制裁，该南美国家创建了\
  \ **Petro**（石油币），一种由其能源储备支持的加密货币。Petro 于 2018 年 2 月至 3 月通过 ICO 发行。政府声称通过出售超过 3000\
  \ 万枚 Petro 币筹集了 33 亿美元。在国际上，Petro 似乎在俄罗斯获得了认可。但关于 Petro 是否真正基于区块链仍存疑问；它极有可能是一个中心化的代币化系统。然而，委内瑞拉可能是先行者，其他国家可能效仿。据一些报道，俄罗斯可能正在考虑类似项目。\n\
  \n\n\n\n区块链技术助力能源行业的另一种方式是提供更好的工具来管理碳信用额度，这一概念有助于应对温室气体排放问题。碳信用额度制度允许公司和国家在特定限额内排放温室气体。如果排放量超出限额，将面临罚款；反之，若排放量低于允许额度，则可将剩余额度出售给其他公司或国家。其目标是通过罚款威慑和出售碳信用额度获利的奖励机制，激励公司减少排放^[6]。\n\
  \n目前，代币是一种可在交易所交易的货币形式。例如，如果能通过某种方法将排放量准确记录为代币形式，便可将其兑换为现金或等值的碳信用额度。\n\n由于碳信用额度属于资产形式，可将其在区块链上代币化，以便于追踪和交易。这能解决估值和定价方面的透明度问题。一些初创公司正在构建用于管理碳信用额度市场的区块链解决方案。名单包括新加坡初创公司\
  \ Aircarbon，该公司宣布与国际商会（ICC）及区块链公司 Perlin 建立合作伙伴关系，并在 2019 年马德里联合国气候变化大会（COP 25）上亮相。Aircarbon\
  \ 正在尝试碳信用额度交易和融资的市场解决方案。\n\n#### 绿色能源转型的后端技术\n\n最后，区块链可能是让社会摆脱肮脏、污染环境的化石燃料、转向太阳能和风能等更清洁能源的关键缺失组件。管理碳信用额度制度和支持去中心化电网的出现，并非该技术在该领域提供的唯一解决方案。事实上，以颠覆能源行业为目标的大多数区块链初创公司都倾向于支持绿色能源。该技术为这些初创公司提供了现成的后端，降低了准入成本。此外，该技术还提供了一种手段，使行业内的不同参与者能够无缝交易和互操作。\n\
  \n### 使用区块链面临的挑战\n\n那么，能源行业要克服哪些挑战才能利用区块链？\n\n能源行业采用区块链面临的挑战与其他用例面临的挑战并无二致。最迫切的包括需要改变监管环境，以支持该技术实现的新技术能力。例如，在大多数国家，公用事业公司是公共垄断企业，鉴于目前可行的能源分配模式，这一直是现状。这种能源生产和分配模式使得私营部门难以提供替代方案。因此，从未有过改变法律以接纳其他模式的必要性。\n\
  \n除了修改法律以适应新现实，还需要建立必要的技术能力，开发满足行业特定需求的区块链基础设施和协议。作为一项新技术，全球缺乏足够的技能和人才来引领这一变革。随着需求增长，这种情况将会改变。鉴于当今世界高度互联，我预计随着程序员发现协助愿意采用区块链的企业进行转型更有利可图，领域知识将随需求同步增长。\n\
  \n当然，还需要改变监管机构、消费者、能源供应商和生产者的思维模式。应预料到那些从现有体制中获益者的反对。\n\n无论如何，正如我们所见，能源行业从区块链技术中受益的途径多种多样。\n\
