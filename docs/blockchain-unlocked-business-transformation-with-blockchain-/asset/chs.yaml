  \ 区块链助力政府治理新模式\n\n为了实现“智慧迪拜”的梦想，区块链虽是项目后期加入的技术，但旨在作为该项目中其他新兴技术（如 AI、大数据和物联网）的后端支撑。\n\
  \n#### 透明度与信任\n\n区块链如何助力政府实现透明化？\n\n全球各国政府的透明度普遍严重不足。虽然政府是由公众选举产生的，但公共机构的流程和系统从未向大多数公民开放。广大民众往往不了解政府内部的运作情况；只有身处政府层级高层的人员才能访问最关键的系统和流程。通常只有他们理解这些系统如何运作。其他人只能选择信任——相信决策者和执行者正在履行其职责。这种不透明性为腐败、不道德行为以及随之而来的糟糕服务提供了温床。\n\
  \n在世界上大多数国家，舞弊选举、贪污公款和任人唯亲已成常态。说到选举，没有比政府产生的过程更适合开始建立透明度的地方了。确实，选举是现代社会的基石。然而，在大多数国家，选举是否准确捕捉并尊重了民众的意愿，往往令人存疑。在封闭的投票系统中，掌权者或有影响力的人总有可能篡改结果，从而将行政、立法，乃至司法机关强加于民众之上。\n\
  \n公众需要见证投票系统以及政府其他系统的运作过程。区块链使整个投票系统能够向每一位选民公开，选民可实时验证和审计流程。借助区块链技术，选民可以确知自己的选票已被计入并加入所选候选人的最终票数。同时，系统不会面临安全威胁。\n\
  \n2014 年，丹麦自由意志党“自由联盟”开始在其内部选举中使用区块链，成为首个将该技术用于此特定目的的政治组织[²]。2018 年底，印度民主党构建了一个区块链投票系统，超过三百万党员可通过该系统就特定政策问题进行投票。这得益于澳大利亚区块链初创公司\
  \ Horizon State 的协助[³]。\n\n然而，最成熟的案例当属爱沙尼亚。这个北欧国家因在公共机构广泛采用技术而闻名，99% 的公共服务均可在线办理。该国早在\
  \ 2007 年就启用了电子投票系统，当时世界上大部分国家甚至没有此类系统的规划。爱沙尼亚政府已拥抱区块链，视其为一种能让其电子投票系统更加安全、稳健的技术[⁴]。值得注意的是，除了选举系统，世界各地的其他公共项目也在利用区块链增强透明度。\n\
  \n#### 自动化\n\n世界各国政府正致力于提高公民获取服务的速度。这要求实现服务交付中大多数流程的自动化。通过审视待替换的内容，我们能体会到系统升级能给公民生活带来多大的改变。我们在第\
  \ 1 章中曾以土地所有权为例，此处同样切中肯綮。在大多数发展中国家甚至发达国家，买卖房地产的过程不仅极其繁琐，而且耗时耗资。\n\n通常，第一步是在土地注册处查询权属，这可能涉及向注册处提交正式申请，填写表格并当面递交或通过邮寄发送。这一步至关重要，旨在根据官方记录确认卖方拥有该土地所有权。这项服务可能需要付费。在许多情况下，如果你想缩短等待时间，可能不得不贿赂相关人员。否则，你得等上几天甚至几周才能得到反馈，因为注册处的职员必须翻阅数据库（通常是人工操作），或在柜子里成堆的档案中查找你需要的那份信息。\n\
  \n有了自动化系统，该过程只需几分钟，且可在任何地点完成。你无需跑腿去土地注册处办理查询。更妙的是，这不花一分钱。世界许多国家正在推进土地交易流程自动化，让任何人都能足不出户、在办公室轻松完成流程。更重要的是，获取所有权证明仅需几分钟。此外，区块链提供了一种机制，无需前往任何办公室即可完成房地产交易。通过私钥，卖方不仅能证明其拥有该房产，还能轻松、快速且安全地将其转移给买方。区块链上的智能合约应用使无需第三方介入即可完成交易成为可能。\n\
  \n2016 年，格鲁吉亚共和国通过其国家公共注册局（NAPR）启动了一个试点项目，将该国土地注册系统迁移至区块链[⁵]。该项目在比特大陆集团的协助下得以实现，后者是主要且最早的比特币挖矿公司之一。项目实施两年内，近两百万份权属证书已在比特币区块链上完成备份和时间戳记录。该项目旨在恢复公众对一个深受腐败之苦多年的机构的信任[⁶]。另一个尝试在区块链上构建土地注册系统的国家是瑞典。瑞典测绘局（*Swedish\
  \ Lantmäteriet*），即该国土地登记机构，一直在与区块链初创公司 Chromaway 合作实施该项目[⁷]。除了土地和财产管理，区块链还被应用于许多其他领域，主要目的是安全可靠地实现流程自动化。\n\
  \n#### 降低成本\n\n从管理成本的角度来看，政府基本类似于商业组织，尽管我们中许多人通常不这么认为。就像任何审慎的企业一样，支出需要控制在收入范围内。此外，公民希望在不缴纳高额税收的前提下获得优质服务。在这方面，区块链大有裨益。该技术不仅能帮助政府削减成本，还能消除年度预算中的某些开支项。特别是，该技术提供了一种更廉价且更优质的记录保存和维护方式。维护中心化服务器数据库的成本极高，涉及租赁或采购必要的软硬件。为确保只有授权人员才能访问，获取合适的安全解决方案也需要高昂费用。有了区块链，政府可以使用开源协议和系统，无需支付费用。在大多数情况下，使用区块链的最高成本是系统初始搭建成本，这主要与人工或技术相关。\n\
  \n据“智慧迪拜”项目团队透露（该项目我们之前已探讨），项目完成后，仅在文件处理一项上，每年就能为迪拜节省近 15 亿美元[⁸]。无论如何看待，这都是巨额节省。\n\
