  \ Publishing](img/atp_image.jpg)\n\n## 关于出版社\n\nCandid Creation Publishing 成立于 1999\
  \ 年，是一家总部设在新加坡的独立英中双语出版社。\n\n我们提供一站式出版服务，助力个人和组织从构想走向市场。我们的目标是降低出版门槛，让专业出版人人可及，并提供贴心服务。\n\
  \n不同于自助出版服务，Candid Creation Publishing 旗下的每一本书都由经验丰富的专业人士精心策划，确保所有书目达到最高质量标准。我们的专业服务包括咨询、辅导、构思、策划、项目管理、写作、翻译、编辑、设计、插图、排版、校对、印刷、电子书出版、发行、销售和营销。\n\
  \n我们建立了作为众多知名人士和权威机构首选出版社的声誉，而这份荣誉更因源于我们服务过的满意客户的亲身推荐而显得格外珍贵。\n\n我们是不拘泥于特定书籍类型的出版人，而是致力于理解作者需求，通过他们的书籍提炼并表达他们的心声。我们已帮助数百位年龄跨度从\
  \ 12 岁到 80 岁的作者出版纸质书和电子书两种格式的作品。迄今为止，我们已出版 300 多种书目，涵盖艺术、自传、童书、评论散文、金融、人文、文学、医学、音乐、人物传记、自我提升等众多类别。\n\
  \nCandid Creation Publishing 是新加坡书业公会会员。\n\n网站：www.candidcreation.com\n"
