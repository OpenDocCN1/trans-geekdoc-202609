  \ Deloitte, 2019, [www2.deloitte.com/content/dam/Deloitte/se/Documents/risk/DI_2019-global-blockchain-survey.pdf](http://www2.deloitte.com/content/dam/Deloitte/se/Documents/risk/DI_2019-global-blockchain-survey.pdf)。\n\
  2. Emspak, Jesse, and Kim Ann Zimmermann. \"Internet History Timeline: ARPANET to\
  \ the World Wide Web.\" LiveScience, Purch, 27 June 2017, [www.livescience.com/20727-internet-history.html](http://www.livescience.com/20727-internet-history.html)。\n\
  3. Lamont, Tom. \"Napster: the Day the Music Was Set Free.\" The Guardian, Guardian\
  \ News and Media, 24 Feb. 2013, [www.theguardian.com/music/2013/feb/24/napster-music-free-file-sharing](http://www.theguardian.com/music/2013/feb/24/napster-music-free-file-sharing)。\n\
  4. Nakamoto, Satoshi. *Bitcoin: A Peer-to-Peer Electronic Cash System*. Bitcoin.org,\
  \ 31 Oct. 2008.\n\n---\n\n## 区块链不能做什么\n\n我们已经确定区块链能做很多事。它有潜力以我们许多人尚未想象的方式颠覆商业。但区块链不是灵丹妙药。它不是解决社会面临的每一个问题的万能方案，即使你访问任何在线区块链论坛或参加区块链聚会、峰会或会议时会有这种印象。认为这项技术能解决抛给它的任何问题的信念在该领域内非常普遍。\n\
  \n想一想任何行业。很可能都有初创公司声称要为特定问题构建区块链解决方案。此类区块链初创公司如雨后春笋般涌现，在 2016 年和 2017 年达到顶峰，主要由首次代币发行（ICO）热潮驱动。在这两年里，区块链初创公司筹集了超过\
  \ 300 亿美元的投资。一家名为 Bancor 的初创公司，一个去中心化加密货币交易所，在三小时内筹集了 1.53 亿美元。另一家，基本注意力代币（BAT），一种在其浏览器网络上提供广告服务的数字广告代币，*在\
  \ 30 秒内*筹集了 3500 万美元。2017 年和 2018 年记录了数十个类似的区块链投资故事。\n\n然而，大多数初创公司除了精心润色的白皮书外一无所有。难怪大部分钱都打了水漂。全球大多数在这一时期筹集资金的初创公司要么从未交付任何可用产品，要么难以推出能与可行市场产生共鸣的东西。\n\
  \n### 区块链的塞壬之歌\n\n据区块链企业家、投资者、在线区块链创新中心 Blockgeeks 创始人 Ameer Rosic 称，高达 90% 的 ICO\
  \ 都失败了[¹]。“事实是，大约 99% 的 ICO 都会失败，”Ameer 在社交媒体帖子中表示，“这并非夸大其词的厄运论，过去几年里，成千上万种加密货币被创造出来，其中超过\
  \ 90% 都失败了。”\n\n之所以有这么多项目挣扎，是因为它们要么拼凑出一个包含区块链的想法，要么匆忙在产品设计中加入该技术，只为从渴望参与区块链革命的投资者那里获取资金。公平地说，在产品描述中加入“区块链”一词很酷。这不知不觉让企业看起来富有创新、面向未来且紧跟技术趋势。即使是微软、三星、巴克莱等主要全球品牌也无法抗拒这种诱惑。\n\
  \n2016 年和 2017 年为 ICO 投资而兜售的许多商业创意，如果完全不涉及区块链技术，实施效果可能会更好。很难确切地说是什么驱动了“区块链应无处不在”这一叙事。这或许是一场由公众自发组织的运动，因为他们失去了对治理世界各个方面机构的信任和信心。我猜这反映了人们夺回权力的渴望。\n\
  \n但一旦某人发现并理解了该技术背后设计和架构的天才之处，随之而来的狂热情绪以及常随其后的经济利益，必然也起了作用。即使在技术提供最大价值的地方，它也有局限性；这在讨论区块链的论坛中几乎从未被提及。\n\
  \n一般来说，区块链被推销为一种提供三大核心优势的技术：(1) 为数据和系统提供更好的安全性，(2) 改善用户在线隐私，以及 (3) 在速度、容量和成本方面提高更多效率。让我们逐一分析。\n\
  \n#### 为数据和系统提供更好的安全性\n\n区块链是第一个使数字数据真正不可篡改的创新。一旦一组信息被记录在共享数字账本上，就无法被任意更改。这非常强大，因为这意味着现在可以使系统抵御多种形式的攻击，包括中间人攻击、SQL\
  \ 注入和恶意软件攻击。此外，由于系统使用公私钥加密，无需担心用于传输系统访问凭证（如密码和 PIN 码）的在线渠道的安全性。用户在本地（甚至离线）保存用于签署交易的私钥，仅共享相应的公钥。区块链还使用精心设计的共识机制，使得单个参与者不可能在未涉及其他关键利益相关者的情况下做出关键决策或更改记录。\n\
  \n鉴于这些特性，区块链似乎是服务器后端存储和处理关键数据的绝佳替代品。例如，它可以为土地注册系统提供更好的后端。如果土地所有权证书存储在区块链后端上，黑客或持有合法凭证的不诚实人员都无法轻易篡改它们。\n\
  \n[¹]: Ameer Rosic, Blockgeeks 创始人, 关于 ICO 失败率的社交媒体帖子。\n\n\n\n\n然而，即使区块链提供了所有这些安全措施，它能否奏效仍取决于我们。人为干预仍然是一个重要的安全因素。区块链无法保护信息系统免受人为错误、错误判断或蓄意破坏的影响。让我们再次以土地所有权登记为例来说明这一点。即使在区块链上，仍然需要人们进行测量、分割地块并登记所有权。不幸的是，这里可能出错的地方不胜枚举。错误的所有权可能被分配给错误的人。特定所有权的错误房地产面积可能被录入系统。或者某些房地产可能完全被排除在系统之外。\n\
  \n此外，即使区块链上有一个不可篡改的土地登记册，也需要法院通过可能的武力威胁来强制执行所有权。这些如何被使用取决于掌权者。也有可能如果独裁者上台，他们可以选择无视区块链系统，转而使用另一个系统按自己的意愿分配土地。\n\
  \n重要的是要指出，尽管区块链使黑客攻击变得困难得多，但它并不能阻止通过其他手段非法访问系统。自 2009 年推出以来，比特币区块链从未被成功攻破。在《数字黄金》一书中，《纽约时报》记者纳撒尼尔·波普写道阿根廷企业家温塞斯·卡萨雷斯试图攻破比特币区块链。当他在\
  \ 2010 年了解到比特币时，卡萨雷斯认为这好得难以置信。他出资 50 万美元聘请两家在线安全机构尝试攻破该系统。他们失败了^(2)。\n\n但虽然比特币点对点账本从未被攻破，但价值数十亿美元的比特币已从交易所和个人的钱包中被盗。黑客未能攻破比特币共享账本并篡改其中的记录。然而，他们找到了通过窃取持有价值的钱包私钥来达到相同目的的方法。有了区块链，攻击的重点从通过其他形式的攻击获取访问权限，转移到了获取可用于授权不可逆交易的私钥上。然而，这种形式的黑客攻击并不比其他形式危害性小。因此我们可以说，区块链无法提供针对黑客攻击或未经授权访问的绝对安全。\n\
  \n#### 为在线用户提供更好的隐私保护\n\n现在让我们看看区块链提供的另一个优势，即它赋予在线用户的隐私。区块链从来不是匿名的；它只是伪匿名，这意味着与中心化支付系统一样，你需要用户名才能使用区块链上的系统。唯一的区别在于，区块链上的这个用户名不必是你的现实身份。尽管如此，如果有人能够将你的现实身份与你在区块链上的用户名联系起来，那么你的隐私就暴露无遗了。\n\
  \n比特币证明了人们可以在网上收发钱款，而无需透露真实身份。比特币创造者中本聪的目标似乎是让比特币在网上的表现像现金一样。许多人一度认为比特币是电子现金，但这种想法没持续太久。用户很快意识到比特币账本（一个区块链）是公开的，任何人都可以访问。\n\
  \n结果证明，现在有一些公司构建解决方案，帮助执法部门和其他实体弄清区块链上价值和数据的流向。通过少量分析，他们就能利用从各种来源收集的数据，将区块链上的化名与用户的真实身份联系起来。Chainalysis\
  \ 就是这样一家公司，由扬·莫勒、乔纳森·莱文和迈克尔·格罗纳格于 2014 年底创立。该公司声称帮助银行、企业和政府了解人们如何使用加密货币^(3)。\n\n\
  他们的网站声称：“我们为 40 个国家的政府机构、交易所和金融机构提供区块链数据和分析。我们的合规和调查工具、教育和支持帮助客户了解区块链上发生的事情。”\n\n\
  当然，比特币和其他区块链的这一漏洞激励开发者设计和构建能进一步混淆交易的区块链。门罗币和 Zcash 就是两个这样的区块链示例。但即使有这些，隐私漏洞依然存在。特别是，用户可以通过监控入金和出金渠道被识别。任何人要将资金转入加密货币，都需要使用交易所。由于交易所在很大程度上是中心化实体，我们看到它们面临严格的“了解你的客户（KYC）”要求。就在几年前，人们还可以轻松使用交易所而无需透露身份。但这逐渐改变了。现在，即使是像\
  \ LocalBitcoins 这样的点对点交易所也要求用户使用护照和驾照等政府签发的身份证件进行注册。\n\n#### 更高效的速度、容量和成本\n\n那效率如何？区块链能提供多少？区块链已经证明，加快金融交易是可能的；我们可以在几分钟内将任何金额从地球的一角发送到另一角。然而，区块链可扩展性仍在进行中，特别是当要求大量代码执行的应用程序在区块链平台上启动时。2017\
  \ 年底，一群开发者在以太坊区块链上推出了一款名为 Cryptokitties 的游戏。由于其高容量需求，区块链不堪重负，导致平台上所有其他应用程序变慢。重要的是要指出，以太坊是第一个被设计为多应用程序后端的区块链。\n\
  \n在比特币区块链上，开发者一直在努力提供速度和效率。似乎用户必须牺牲速度来换取安全性，并在选择使用加密货币时获得相对较高的隐私水平。\n\n长期以来，比特币区块链的扩容一直是主要的关注点和争议点。特别是，比特币社区一直在争论如何让系统每秒确认更多交易，以有效地与\
  \ Visa 和 MasterCard 等中心化支付系统竞争。隔离见证和闪电网络等解决方案增加了大量容量。然而，与中心化服务器系统相比，这仍然微不足道。例如，Visa\
  \ 每秒的处理能力高达 50,000 笔交易，而比特币网络每秒只能确认不到 100 笔交易。\n\n现在有一些项目试图利用星际文件系统（IPFS）等创新，创建区块链和传统服务器的混合体。这种系统可以结合传统服务器的速度和区块链的安全性，拥有两全其美的优势。因此，我们可以说区块链无法提供无限容量。\n\
  \n区块链可以提供以前不可能的在线体验。它已证明能为现有应用程序提供更好的价值。它能催生仅在区块链上才可能存在的应用程序。一个很好的例子是智能合约应用程序，即用代码编写的协议，当预定义条件满足时自动执行。\n\
  \n\n\n\n然而，指望该技术适用于所有情况是不现实的。指望它完美无缺也是不现实的。有时，在考虑了技术需求、成本和预期用户体验（UX）后，不使用区块链设计系统才是正确的做法。同样重要的是要指出，区块链无法在真空中运行。除了所需的必要技能（您可以通过本书末尾的免费赠书内容进行评估）外，该技术还需要其他资源才能发挥实质作用。例如，虽然我们可能坚信区块链是解决全球“无银行账户”人群问题的方案，但如果没有互联网接入、可用电力以及智能手机等价格亲民的技术设备等其他基础设施，它就无法运作。\n\
  \n只有在真正需要的地方应用区块链，它才能发挥作用。许多问题的解决需要的不仅仅是区块链。通常，在该技术变得有用之前，需要先解决政治、人力资源和社会经济方面的问题。\n\
  \n^1 Rosic, Ameer. “Why Most ICO’s Will Fail: A Cold Hard Truth.” Blockgeeks, 5\
  \ May 2020, [blockgeeks.com/guides/why-most-icos-will-fail/](http://blockgeeks.com/guides/why-most-icos-will-fail/)\n\
  \n^2 Popper, Nathaniel. Digital Gold: Bitcoin and the inside Story of the Misfits\
  \ and Millionaires Trying to Reinvent Money. Harper, 2016.\n\n^3 “The Blockchain\
  \ Analysis Company.” Chainalysis, [www.chainalysis.com/](http://www.chainalysis.com/)。\n\
  \n| ![image](img/ch-3.jpg) | | **通证经济学背后的艺术与科学** |\n\n| --- | --- |\n\n## 通证经济学背后的艺术与科学\n\
  \n通证经济学是一个相对较新的术语。加拿大区块链天使投资人兼风投顾问威廉·穆加亚声称他在 2017 年某个时候创造了这个词。穆加亚本人在区块链领域颇具知名度。除了投资各种区块链初创公司并担任多个董事会成员外，他还是作家、博主、演讲者，以及\
  \ Token Summit（通证经济峰会，一年一度的基于通证的经济大会）的创始人^1。\n\n正如您可能已经猜到的，通证经济学是 *token*（通证）和 *economics*（经济学）两个词的合成词。它取代了“通证经济学”这一术语。定义词根“通证”将有助于我们更好地掌握通证经济学。\n\
  \n### 通证并非新事物。\n\n必须指出的是，通证并非随着区块链而诞生。在区块链出现之前，通证就一直存在，例如忠诚度积分和赌场筹码。在瑞士，地方政府将垃圾袋作为通证出售^2，售价是生产成本的数倍。这部分溢价被视为您为装入袋中的垃圾所支付的费用。\n\
  \n区块链所做的是让数字通证的创建、管理和使用变得更简单、更安全、更便捷。\n\n那么，什么是通证？\n\n根据谷歌词典，通证是代表或代表某种价值的事物。通证本身没有内在价值，但被假定承载其所代表资产的价值。例如，赌场筹码本身毫无用处，除非它代表玩家可以从赌场兑换成现金的价值。在区块链上，关于哪些资产属于通证存在一些混淆。视询问对象而定，所有在区块链之上创建、管理和使用的数字资产都是通证。这包括\
  \ `Bitcoin`、`Monero`、`Ether` 和 `Zcash` 等加密货币。甚至有文献、演示文稿和出版书籍交替使用“通证”和“加密货币”这两个词。\n\
  \n然而，从最严格的定义来看，通证和加密货币并非同一事物。与加密货币不同，通证是区块链上为有限或特定功能或用途而发行的单位。这可以是其使用场所，也可以是其使用程度。例如，赌场筹码是一种通证，因为您只能在赌场内且仅用于赌博。\n\
  \n零售店或任何其他商业实体创建并发放的忠诚度积分也是通证。您只能在发行方的场所内、为其规定的目的使用它们。除非有例外，否则您不能使用某一实体发行的忠诚度积分来获取其竞争对手或第三方商家的福利。区块链上的通证示例是\
  \ `Steem`，它被用作基于区块链的博客和社交媒体平台 `Steemit` 的原生功能币。用户用 `Steem` 支付并获得 `Steem` 报酬。它也是对在该平台创作内容者的激励。几乎没有任何第三方商店接受\
  \ `Steem` 通证购物。\n\n另一方面，`Bitcoin` 等加密货币是价值单位，可跨多个平台用作交换媒介、价值存储和记账单位。换句话说，它们执行了法定货币的大部分功能，尽管它们不是法定货币。它们是私人数字货币。这就是为什么我们称它们为加密货币（使用密码学的货币）。\n\
  \n某资产今天是通证，并不意味着它明天不能成为货币。指出这一点很重要。早期 `Bitcoin` 更像是一种通证而非货币。其主要功能是作为激励。人们让机器持续运行以支持\
  \ `Bitcoin` 网络，并以此换取代币。随着时间的推移，`Bitcoin` 在网络外也被接受为支付手段。我们可以认为这使其变成了货币。\n\n### 区块链中存在哪些类型的通证？\n\
  \n广义上讲，您可以在区块链上创建四种类型的通证。重要的是要指出，这些类别可能会重叠，因此一种通证很容易同时符合其中两个甚至三个类别。\n\n#### 首次代币发行通证\n\
  \n首次代币发行（ICO）通证的创建唯一目的是为项目筹集资金。它是筹集资金用于构建平台的一种方式。此类通证对于为开源项目开发筹资特别有用。购买此类通证的买家不期望获得分红。相反，他们希望项目最终建成后，通证价值会上涨，从而能以更高价格卖给他人获利。\n\
  \n然而，由于监管压力，我们不再看到任何 ICO 通证被发行。任何想要出售通证的人都必须将其定义为实用通证或证券型通证。现在有些通证通过交易所发行，这被称为首次交易所发行（IEO）。不是相关初创公司直接出售通证，而是委托交易所代为销售。\n\
  \n#### 实用通证\n\n第二类是实用通证。这些通证的创建是为了提供对平台上特定服务和特权的访问权。一个例子是 `Storj` 代币，您可以用它在 `Storj`\
  \ 网络（一个去中心化云存储服务）上支付存储空间费用。与其他形式的通证（尤其是证券型通证）相比，实用通证更容易出售。但是，您需要向监管机构（如美国证券交易委员会\
  \ SEC）证明，它确实在您的生态系统中服务于特定目的，而您并非仅仅为了筹集资金而出售它。\n\n#### 资产抵押通证\n\n初创公司和项目在区块链上创建的第三类通证是资产抵押通证。这些通证的创建是为了在区块链上代表现实世界的资产，如房地产、黄金、艺术品，甚至法定货币。它们提供了一种将这些现实资产数字化的模式，使其易于交易，从而增加流动性。一个例子是\
  \ `Tether`，它由（并锚定）美元提供支持。`Tether` 使美元进出 `Bitfinex` 交易所变得容易。它是几种稳定币之一，其他还包括 `TrueUSD`、`Paxos\
  \ Standard` 和 `Binance USD`。\n\n#### 证券型通证\n\n\n\n\n## 什么是安全代币？\n\n安全代币是初创公司或公司在市场上出售的股本资本。购买此类代币的人期望获得分红，并在公司管理方面拥有发言权。他们期望公司建立一套机制，让他们能够影响管理和政策。由于大多数国家对使用区块链发行股票有严格的监管要求，因此这种代币鲜有发行。它是一种更适合公司而非开源项目的代币类型。\n\
  \n无论你发行 ICO、实用代币、资产支持代币还是安全代币，取决于几个因素。监管环境就是其中之一。你可能会考虑发行实用代币而非安全代币，因为前者不会让你面临太多法律挑战。另一个因素是你正在从事的项目类型。例如，它是开源项目还是私营公司的产品？如果你在构建开源项目，ICO\
  \ 代币可能是最佳选择。但如果你是作为私营公司在开发产品，安全代币或实用代币可能是你所需要的。\n\n## 什么造就了优秀的代币？\n\n现在让我们关注一下代币经济学到底是什么。任何人都可以在区块链上创建代币。你现在就可以在五分钟内完成^(3)。但在有大量的人发现它们有用并值得持有在钱包里之前，这些代币毫无价值。代币发行中较难的部分是提供理由，让其他人接受它们是有用的或具有价值的。\n\
  \n这就是代币经济学发挥作用的地方。\n\n代币经济学关乎设计一种能解决迫切问题的代币，并制定计划使其触达目标用户。如果你在这两个方面失败了，几乎没人会发现你的代币。让我们来了解构成优秀代币经济学的要素。\n\
  \n### 真实需求\n\n第一个要素是对代币的真实需求。你不应该仅仅因为能创建代币就去创建。或者因为你需要出售它来快速套现。如果你设想未来将项目发展成大事业，你应该只在代币在吸金之外的宏大构想中扮演关键角色时才创建它。在\
  \ 2017 年和 2018 年，许多初创公司通过向 FOMO 投资者（即害怕错失良机的投资者）出售区块链代币筹集了数亿美元。售出后，许多代币贬值，沦为钱包里的数字。投资者意识到代币发行后没有创新产品问世。\n\
  \n此后情况发生了很大变化。投资者现在稍微明智一些了。一份写得好的白皮书不足以让他们购买你的代币。要说服他们，你必须设计一个服务于特定目的并为用户提供价值的系统。更别提许多司法管辖区（包括美国）已实施严格的监管审批要求。\n\
  \n代币应该是一个精密系统中急需的齿轮。有了真实需求，代币有望随时间增值，持有者也能从中获得其他收益。例如，很难想象 Storj 网络如果没有原生支付手段会如何运行。PayPal\
  \ 或信用卡等支付方式无法在这样的系统中工作，因为这些方式无法被纳入区块链上的智能合约，而这正是 Storj 协议所要求的。\n\n如果你必须使用一种在最终产品或项目中不起作用的代币来筹集资金，你应该考虑发行安全代币。这是你公司的股权。你将遵循传统股份发行和证券销售的规则来发行它。然而，大多数国家的规则极其严格，你可能永远无法获得批准来进行发行。\n\
  \n### 循环模型\n\n优秀代币经济学的另一个要素是经过深思熟虑的循环模型：特定代币的生命周期和路径。主要有三种代币循环模型。\n\n第一种是**循环模型**，代币在系统中从一方流向另一方，无限循环，没有预定的终点。它或多或少地充当现金功能。Storj\
  \ 代币采用这种模型。需要网络存储空间的人从交易所购买代币，然后用它支付给农场主。赚取 Storj 代币（通过提供存储空间）的人在交易所将其出售换取加密货币或法币。循环再次开始。\n\
  \n第二种模型是**源头到销毁模型**，代币被发行仅供一次性使用。一旦花费，代币即被销毁。这非常适合用作门票或访问代币的代币。一旦使用，这些代币不再需要，由新生成的代币取代。\n\
  \n最后一种主要模型是**直进直出模型**。代币被发行，流出去执行功能，然后回到发行者手中。赌场筹码是使用该模型的代币的完美例子。你购买它在场所内使用，完成后将其退还（假设你保留了它或赢得了更多）给发行者以兑换法币。\n\
  \n### 博弈论\n\n代币经济学的另一个要素是博弈论，它设计平台、项目或产品，使所有利益相关者以有利于项目的方式获得激励。例如，正是通过稳健的博弈论，比特币在没有中央权威管理和引导的情况下依然存活并持续增长。在比特币网络上，人们通过挖矿奖励获得激励，提供维护共享账本所需的硬件资源。中本聪似乎也深思熟虑过如何保护网络免受恶意行为者攻击。创始人使得攻击网络的任何尝试都极其昂贵。在网络上遵守规则比破坏规则更有利。\n\
  \n任何渴望成功的代币都必须经过深思熟虑的博弈论设计。应为正确的人提供正确的激励，使他们的行为促进项目的成功。重要的是要弄清楚如何在数字代币中创造价值，激励人们持有代币，更重要的是，激励早期采用者为项目传播声量。\n\
  \n稳健的博弈论对去中心化生态系统至关重要，因为一旦项目脱离核心开发者的手，更改事物的机会微乎其微。如果预算允许，聘请合格的博弈论专家帮助你构建自我保存的生态系统非常重要。\n\
  \n### 供应量\n\n设计代币时另要考虑的是其供应量。流通中需要的确切代币数量是多少？需要设定上限吗？如果不需要，发行率应是多少？\n\n如果你的代币仅供一次性使用（如门票），你可以设定上限并配合恒定发行率以维持适当量。如果你的代币具有无限寿命且不被销毁，你可以考虑像比特币那样的硬上限。这有助于避免通货膨胀，随着系统用户增加，转化为每个代币价值随时间增长。\n\
  \n### 代币分发模型\n\n同样重要的是代币分发模型。多少比例的代币将被出售？多少比例将分配给开发团队？\n\n在代币分发中，你需要通过持有部分代币来增强项目信心。但也要小心不要持有过大比例，这会让项目看起来像想控制市场价格波动。持有者应该感觉到代币价格没有被人为操纵。\n\
  \n\n\n\n\n## 代币设计与区块链安全\n\n### 数据驱动的代币设计\n\n要设计一个成功的代币，需要对系统的每一个细微部分进行彻底考量。许多项目并未审视其设计的方方面面。例如，它们通过猜测来决定代币总量、发行速度和发行价格。\n\
  \n你在这些问题上做出的任何决策都需要**数据驱动**。根据你预期项目上的活动量，研究所需的合适代币数量。从你预期拥有的用户数量开始。此外，尽一切努力获得对交易量的最佳预估。如果你没有相关知识、经验或技能，为这些指标构建可行模型正是你需要专家介入的地方。\n\
  \n#### 参考资料\n\n1. SteemFest. Tokenomics Design with Wmougayar, Nov. 2017, [www.youtube.com/watch?v=ZKcZ4C8IO14](http://www.youtube.com/watch?v=ZKcZ4C8IO14).\n\
  2. Siegel, David. “The Token Handbook.” Hacker Noon, 10 May 2020, [hackernoon.com/the-token-handbook-a80244a6aacb](http://hackernoon.com/the-token-handbook-a80244a6aacb).\n\
  3. Ahmad, Danyal. “Creating Ethereum Token on ERC20 Standards.” Devprovider, 16\
  \ June 2019, [www.devprovider.com/creating-ethereum-token/](http://www.devprovider.com/creating-ethereum-token/).\n\
  \n---\n\n### 区块链安全吗？\n\n![image](img/ch-4.jpg)\n\n区块链技术旨在以数字资产（如货币、代币，甚至数据）的形式存储价值。为什么区块链安全至关重要？在撰写本书时，比特币区块链的原生代币——比特币的市值接近\
  \ 1500 亿美元，而以太坊的以太币（ETH）约为 150 亿美元。这仅仅是 CoinMarketCap 上近 5000 种区块链资产中的两种，CoinMarketCap\
  \ 是一个收集并发布实时区块链资产统计数据的网站。\n\n如果考虑到建立在其之上的资产，现存每条区块链上的真实价值远超 CoinMarketCap 上所列数字。例如，以太坊区块链除支持\
  \ ETH 外，还支持多种代币、币种和去中心化应用（dApps）。如果我们再算上提供钱包、交易所和挖矿等区块链相关服务的企业，价值就更大了。此外，还有将区块链作为后端用于存储和处理其应用程序及系统数据的实体。\n\
  \n#### 是什么让区块链变得安全？\n\n我们可以从三个角度来考量区块链的安全性。第**一（1）**个角度关乎你与系统的个人交互，特别是保护你对区块链资产的所有权，以及你的身份和活动的隐私。第**二（2）**个角度关乎恶意行为者攻破、接管或摧毁整个区块链网络的可能性。第**三（3）**个角度质疑核心软件的健壮性，并由此延伸至协议层面。特别是代码中是否存在可能导致系统不安全的漏洞。\n\
  \n我们将依次探讨这三个角度。\n\n##### 安全取决于你自己\n\n个人在区块链上的资产、数据和身份有多安全？\n\n简短的回答是：你在区块链上的活动、资产和身份的安全程度，取决于你为实现这一目的所采取的措施。换句话说，你在区块链上的安全在很大程度上取决于你自己。有时甚至比区块链的设计本身更重要。\n\
  \n这是为什么呢？\n\n在区块链上，每个用户都有一个`公钥`（或`公共地址`），这是用于在平台上交互和交易的身份标识。每个公钥都有一个对应的`私钥`。可以将`公钥`想象成你的电子邮件地址，将`私钥`想象成访问邮箱所需的密码。当有人向你的公钥（地址）发送比特币时，你唯一能控制这些比特币的方式是通过对应的`私钥`。因此，你需要`私钥`来花费比特币。事实证明，`私钥`是一种持有人工具；谁拥有访问权，谁就能使用它。任何拿到你私钥的人都能花费你的比特币。\n\
  \n这同样适用于区块链上的其他应用。例如，如果土地所有权通过基于区块链的土地注册系统转移给你，你证明对其控制权的唯一方式，就是使用系统中分配给该权属的公钥所对应的`私钥`。如果其他人获得了访问权，他们就能将房产所有权从你手中转走。\n\
  \n这导出一个结论：你的`私钥`理应像电子邮件密码或借记卡 PIN 码一样绝对私密——任何其他人都不应知晓。不幸的是，私键已被证明是区块链安全中**最薄弱的环节**。将私钥保管好、防止被黑客窃取，是区块链应用用户肩负的最繁重责任之一。\n\
  \n自 2009 年比特币推出以来，黑客通过远程窃取持有大量区块链资产（尤其是比特币等加密货币）钱包的私钥，已窃取数十亿美元。例如，2014 年初，总部位于日本、当时全球最大的比特币交易所之一\
  \ Mt. Gox 因黑客攻击损失了价值超过 4.5 亿美元的比特币。2018 年 1 月，另一家日本交易所 Coincheck 因黑客攻击损失 5.3 亿美元[¹]。据区块链研究公司\
  \ Chainalysis 报告，2018 年从交易所钱包损失的资金超过 12 亿美元[²]。\n\n幸运的是，用户有多种措施来保护私钥，从而保护资产免遭盗窃。一种方法是离线生成并存储私钥，创建“冷存储”。这使用冷存储硬件钱包，如\
  \ Trezor、KeepKey 或 Ledger。另一种方法是使用离线脚本生成私钥并将其打印在纸质副本上。用户可以将私钥存放在安全的地方，但将相应的公钥分享给需要发送比特币（或任何其他资产）的人。\n\
  \n##### 区块链网络安全吗？\n\n现在让我们把注意力转向整个区块链的安全性。\n\n有人想要攻破整个区块链的原因有很多。其中包括想要控制权以操纵交易账本上的条目。也可能目的是摧毁系统，特别是阻止其对其他现有系统构成威胁。我们也不能排除某人或实体仅仅为了寻求刺激而为之的可能性。\n\
  \n区块链网络可能通过“51% 攻击”被攻破，即恶意行为者获取超过整个网络 51% 的算力（哈希率）。恶意行为者可以利用这一算力推翻其他利益相关者的决定，或任意篡改共享账本。虽然这种攻击在理论上似乎可行，但在现实中几乎不可能实施。最不容易的原因在于，这是一项成本高昂的举动。\n\
  \n以比特币区块链为例，你需要积累（撰写本书时）超过 1.1 亿 TH/s（万亿次哈希/秒）[³] 的算力。这是海量的计算能力。事实上，比特币网络作为一个整体，是世界上最强大的计算机。你必须超越它。除了购买大量挖矿芯片（每一颗都是非常昂贵的设备）外，你还需要一个电力来源，其供电量超过瑞士这样规模国家的用电量[⁴]。\n\
  \n[¹]: ch04.xhtml#ch04fn1\n[²]: ch04.xhtml#ch04fn2\n[³]: ch04.xhtml#ch04fn3\n[⁴]:\
  \ ch04.xhtml#ch04fn4\n\n\n\n\n简而言之，你需要投入大量资源。一旦你获得了 51% 的算力，网络的其余部分可以选择分叉区块链，让你只得到一个空壳。它可以创建一份高达\
  \ 51% 算力时刻的账本副本（即获得超过网络 51% 的算力），然后创建一个新分支并继续更新有效账本。随后你可能不得不发起另一次昂贵的反击。以这种方式浪费资源几乎没有任何理由；利用资源为网络挖矿并获取挖矿奖励在经济上更合理。事实上，比特币区块链背后的博弈论旨在激励人们建设系统而非破坏它。简而言之，遵守规则比破坏规则更有利可图。\n\
  \n话虽如此，区块链领域担心量子计算的发展可能会使攻击和摧毁区块链网络变得更容易、更廉价。这种妥协可能表现为破解区块链密码学的能力。无需窃取私钥，推算出私钥将变得更容易^(5)。\n\
  \n因此，区块链开发者和创新者正在超前思考，以生产能使量子计算对区块链技术无关紧要的协议。两种抗量子计算协议是以太坊的 Serenity 和 zkSTARKs^(6)。\n\
  \n#### 代码和协议是否稳健？\n\n现在让我们看看第三个也是最后一个角度，通过它你可以确定区块链是否安全。网络上的任何设备都必须安装并运行其核心软件，以便与共享账本上的其他设备通信并形成共识，因为区块链依赖它来执行协议。第一个版本通常来自网络的创始人；例如，创始人中本聪编写了比特币核心软件的第一个版本。后续版本是不同参与者或核心开发者协作工作的产物。任何人都可以通过比特币改进提案（BIP）流程提议对核心软件和协议进行更改。提议者与社区其他成员交谈，创建包含更改的核心软件的下一个版本，并说服其他人下载并运行它。该过程比我在这里描述的更复杂。但我想你已经明白了。\n\
  \n像任何代码一样，区块链核心软件最终可能会存在 bug 和执行弱点。这些可能使用户面临许多风险，例如双重支付和攻击点。主要区块链都曾发现过 bug。其中一些\
  \ bug 非常严重，危及区块链上持有的价值。2018 年底，发现了一个缺陷，本可被利用来关闭比特币网络的部分功能，并允许恶意行为者凭空创造比特币。在顶级比特币核心开发者修复它之前，该缺陷被保密了（数天）^(7)。\n\
  \n2016 年初，德国区块链初创公司 Slick.it 在以太坊区块链上推出了去中心化自治组织（DAO）。该实体本应作为一家只有投资者、没有管理层或员工的公司运作。投资者将通过投票，聘请服务提供商代表\
  \ DAO 履职。结果发现，将这一想法变为现实的代码中存在 bug。但攻击者利用了它，并开始窃取投资者筹集的近 1.5 亿美元资金。为阻止攻击，以太坊网络升级了其核心软件并回滚了交易。这导致网络分裂为两个：以太坊（ETH）和以太坊经典（ETC）^(8)。\n\
  \n总之，区块链并非万无一失。本章所述三个层面的区块链安全性考量，都应与其他现有系统进行比较。在许多方面，区块链比其寻求取代的系统更安全。区块链密码学让用户对其活动和资产拥有更多控制权和安全性。管理区块链的博弈论使攻击不太可能发生。至于代码中的\
  \ bug，区块链是开源项目，往往拥有负责任的社区；任何 bug 通常都会在危害生态系统之前被发现并修复。\n\n^(1) Shane, Daniel. “Coincheck:\
  \ $530M Cryptocurrency Heist May Be Biggest Ever.” CNNMoney, Cable News Network,\
  \ Jan. 2018, [money.cnn.com/2018/01/29/technology/coincheck-cryptocurrency-exchange-hack-japan/index.html](http://money.cnn.com/2018/01/29/technology/coincheck-cryptocurrency-exchange-hack-japan/index.html)。\n\
  \n^(2) Redman, Jamie. “Hackers Have Looted More Bitcoin Than Satoshi’s Entire Stash.”\
  \ Bitcoin News, 24 Mar. 2019, [news.bitcoin.com/hackers-have-looted-more-bitcoin-than-satoshis-entire-stash/](http://news.bitcoin.com/hackers-have-looted-more-bitcoin-than-satoshis-entire-stash/)。\n\
  \n^(3) “Total Hash Rate (TH/s).” Blockchain.com, [www.blockchain.com/en/charts/hash-rate](http://www.blockchain.com/en/charts/hash-rate)。\n\
  \n^(4) McCarthy, Niall. “Bitcoin Devours More Electricity Than Switzerland \\[Infographic\\\
  ].” Forbes, Forbes Magazine, 8 July 2019, [www.forbes.com/sites/niallmccarthy/2019/07/08/bitcoin-devours-more-electricity-than-switzerland-infographic/#39b7e85521c0](http://www.forbes.com/sites/niallmccarthy/2019/07/08/bitcoin-devours-more-electricity-than-switzerland-infographic/#a5c02393e59c943d6a75a9241140faca339b7e85521c0)。\n\
  \n^(5) Sharma, Toshendra Kumar. “Can Blockchain Be Under Quantum Attacks ?” Blockchain\
  \ Council Blockchaincouncilorg, 6 Dec. 2018, [www.blockchain-council.org/blockchain/can-blockchain-be-under-quantum-attacks/](http://www.blockchain-council.org/blockchain/can-blockchain-be-under-quantum-attacks/)。\n\
  \n^(6) Bouguera, Amira. “How Will Quantum Computing Affect Blockchain?” ConsenSys,\
  \ Dec. 2018, [consensys.net/blog/blockchain-development/how-will-quantum-supremacy-affect-blockchain/](http://consensys.net/blog/blockchain-development/how-will-quantum-supremacy-affect-blockchain/)。\n\
  \n^(7) “CVE-2018-17144 Full Disclosure.” Bitcoin Core, 20 Sept. 2018, [bitcoincore.org/en/2018/09/20/notice/](http://bitcoincore.org/en/2018/09/20/notice/)。\n\
  \n^(8) Siegel, David. “Understanding The DAO Attack.” CoinDesk, CoinDesk, 27 June\
  \ 2016, [www.coindesk.com/understanding-dao-hack-journalists](http://www.coindesk.com/understanding-dao-hack-journalists)。\n\
  \n| ![image](img/ch-5.jpg) | | **私有链与公有链** |\n| --- | --- | --- |\n\n比特币是第一条区块链上的一个应用。根据\
  \ CoinMarketCap 上市的数字资产数据，自 2009 年 1 月推出以来，已涌现出 3,000 多条公有链。随着人们对该技术的兴趣与日俱增，我们预计这一数字将持续增长。\n\
  \n所有区块链都具有相似的基本结构。它们是建立在点对点网络或独立计算机之上的平台，这些计算机协作实时维护共享账本。然而，每条区块链实施的协议至少与下一条略有不同。每条链都是为解决特定问题而设计的。例如，比特币区块链的主要关注点是支付，而以太坊区块链或多或少是一台虚拟机，可作为各种应用程序的后端。\n\
  \n话虽如此，区块链可以使用多种标准进行分类。本章将探讨其中之一：区块链因设计而异的运作方式。在这方面，区块链主要分为两种类型：每条区块链都可归类为公有链或私有链。\n\
  \n#### 私有链与公有链：有何区别？\n\n\n\n\n## 公有链与私有链：关键区别\n\n在第 1 章中，我们介绍了区块链可能存在的区别，特别是关于权限方面的区别。公有链和私有链之间存在三个主要差异领域。它们分别是：(1)\
  \ 对共享账本上数据的读取和编辑访问权限，(2) 核心软件的开发和维护方式，以及 (3) 系统有效运行对博弈论的依赖程度。\n\n### 访问权限\n\n任何人都可以加入公有链。不仅如此，任何人都可以在无需任何人许可的情况下读取并协助维护共享账本。通常，唯一的准入门槛是获取必要硬件和能源资源的能力。因此，公有链也被称为*无许可*区块链。公有链的一个关键特性是参与者保持匿名（或更准确地说，是*伪匿名*）。没有人被强制披露其真实身份。事实上，伪匿名性被视为公有链的一个卖点。可以说，这是一项基本特性，也是维护隐私的唯一途径，因为任何人都可以访问公有链上的数据。\n\
  \n比特币是第一条公有链。只要一个人买得起挖矿 `ASIC`（专用集成电路）芯片或节点设备，并能高效地为其供电，他或她就可以自由加入网络，无需披露真实身份，无论是作为矿工还是用户。\n\
  \n当一个新节点加入公有链时，它可以通过从网络上的其他节点下载整个账本，使其状态与网络的其余部分同步。当节点所有者决定不再想成为网络一部分时，他们无需通知任何人即可退出。\n\
  \n然而，对于私有链，你不能简单地加入网络。私有链的组织方式使得，虽然它仍然像公有链一样是一个点对点网络，但网络上的节点所有者彼此知晓。事实上，每个节点都是通过一个详尽的流程成为网络一部分的。\n\
  \n通常，私有链网络上的节点是通过现实世界中签订的合同（想想纸笔签署）加入的。如果你想加入网络，你需要说服指定的管理员或所有利益相关者，并经历一个谈判过程。如果利益相关者认为你无法为网络带来价值或不符合他们的要求，他们可以拒绝你的申请。因此，私有链被称为*有许可*区块链。\n\
  \n此时有一个重要的观点需要说明：私有链可以是开放的，也可以是封闭的。如果公众成员可以访问、读取或使用区块链上的数据和应用程序，则它是开放的。如果只有获得许可的人才能访问、读取或使用区块链上的应用程序，则它是封闭的。因此，区块链本身可能是私有的，但建立在其之上的应用程序可能对所有人开放。\n\
  \n另一个需要牢记的重要观点是：私有链上的节点所有者使用他们的真实身份。匿名参与者不被接受。人人皆知彼此身份。这使得私有链对那些必须遵守严格监管要求的实体具有吸引力，特别是了解你的客户（`KYC`）、反洗钱（`AML`）和反恐怖融资。特别是商业银行和保险公司选择构建私有链，主要原因是他们知道自己在与谁合作。\n\
  \n### 核心软件\n\n现在，让我们看看公有链和私有链在核心软件的开发和管理方面有何不同。\n\n区块链核心软件是安装在你计算机上的代码，使其能够与点对点网络上的其他节点进行通信和协作。核心软件实现了交互规则（称为协议）。\n\
  \n公有链软件几乎总是开源的，这意味着它可以在不侵犯任何版权的情况下被复制。中本聪在开源的 `MIT` 许可证下发布了比特币代码。这就是成千上万条其他区块链得以开发的方式；其中大多数本质上都是比特币区块链的副本。另一方面，大多数私有链在更严格、受限或独占的版权下发布其代码。这通常意味着你不能在不侵犯版权的情况下复制其独有的内容。\n\
  \n即便如此，大多数私有链的代码开发也是在幕后进行的。但更重要的是，私有链核心软件的开发和维护是由一个被赋予该责任的特定官方团队承担的。利益相关者有一套正式机制来挑选和管理项目团队。一种常见的做法是每个利益相关者派遣一名开发人员加入团队。另一种是利益相关者组成一个联盟或公司，接管构建和管理协议的责任。后者更为常见。两个最著名的私有链都是通过联盟进行管理的。2015\
  \ 年 12 月，Linux 基金会和几家主要金融机构及技术公司启动了 `Hyperledger`。同年 9 月，另一群金融机构启动了 `R3`，另一个私有链联盟。\n\
  \n在公有链中，整个用户社区负责核心软件的开发和维护。特别是，项目依赖志愿者开发者为核心软件提供补丁，并向社区发布新版本。社区中的某些成员可能会雇佣核心软件开发人员在项目上工作。\n\
  \n例如，多年来在比特币项目上工作的几位开发者已被在区块链上建立业务的私营公司雇佣（或赞助）。赞助开发者在比特币项目上工作的公司示例包括总部位于上海的比特币交易所\
  \ `BTCC`（或 `BTCChina`）和支付处理商 `BitPay`。在公有链上构建应用程序的公司指派其部分开发人员从事核心软件工作也很常见。对于比特币，`Blockstream`、`Chaincode\
  \ Labs` 和 `Ciphrex` 等公司正是在做这件事。\n\n一些非营利组织从社区募集资金以雇佣开发人员从事核心软件工作。同样，比特币提供了一些例子，包括早期活跃的\
  \ `Bitcoin Foundation` 和 `MIT Media Labs` 的 `Digital Currency Initiative`。大多数其他公有链都有基金会，它们要么保留部分挖出的币，要么接收部分交易费，要么通过其他方式从社区筹集资金，以支持核心软件的开发和维护^(1)。\n\
  \n获得必要资源是一回事。改变公有链协议的关键部分从来都不容易，因为通常整个社区或至少大多数人必须达成共识。不同参与者最终会产生利益冲突。一个典型案例是试图扩展比特币协议以处理更多交易。社区一直难以就增加区块大小还是构建第二层扩容解决方案（如\
  \ `Lightning Networks` 和 `SegWit`）达成共识。2017 年，社区陷入了所谓的用户激活软分叉（`UASF`）内战，导致网络分裂为比特币和比特币现金^(2)。\n\
  \n\n\n\n\n### 博弈论\n\n最后，让我们来看看区分公有区块链和私有区块链的第三个因素，即系统对**博弈论**的依赖。在任何将两个或更多实体及其自身自私利益聚集在一起的系统中，博弈论都很有用。它或多或少关乎给予系统内参与者正确的激励：奖励遵守规则的人，惩罚试图破坏规则的人。\n\
  \n大多数私有区块链网络采用中心化治理结构，可以奖励良性参与者并惩罚恶意参与者。特别是，它可以驱逐任何违背所有利益相关者商定规则的人。这之所以更容易，是因为所有参与者都是已知的，且未经许可没有人能重新加入网络。\n\
  \n然而，在公有区块链网络上，通常没有人来惩罚或奖励。匿名参与者随意加入和离开网络。因此，公有区块链必须依赖更稳健的博弈论才能正常运行。你可以称之为**自动化博弈论**。以比特币为例，如果你选择试图破坏规则，没有人会阻止你或将你驱逐出网络。相反，博弈论将对你不利。\n\
  \n更具体地说，你将花费大量资源支付电费和购买硬件，如电源单元和 ASIC 矿机。但网络会忽略你，你最终将一无所获，遭受巨大损失。然而，如果你决定利用这些资源来帮助网络，它会奖励你。\n\
  \n### 在私有区块链和公有区块链之间选择\n\n公有区块链好还是私有区块链好？\n\n公有区块链和私有区块链各有优劣。正如我已经指出的，更改私有区块链协议更容易、更快，这使得此类区块链更具适应性。私有区块链也非常适合需要遵守严格监管要求的实体。例如，商业银行很难使用比特币区块链，因为平台上的参与者保持匿名。因此，私有区块链允许它们满足必要的监管要求。\n\
  \n然而，公有区块链提供了有保证的永久性和不可篡改性。你几乎总是可以确信规则不会突然改变。公有区块链非常适合有益于社会的应用。但无论出于何种原因，如果掌握着“关闭开关”，从现状中获益的政府和实体将不允许此类应用蓬勃发展。简而言之，两种类型的区块链都有极佳的用例。\n\
  \n^1 A. v. Wirdum, “Who Funds Bitcoin Core Development? How the Industry Supports\
  \ Bitcoin’s ‘Reference Client’,” Bitcoin Magazine, 6 April 2016. [Online]. Available:\
  \ [`bitcoinmagazine.com/articles/who-funds-bitcoin-core-development-how-the-industry-supports-bitcoin-s-reference-client-1459967859`](https://bitcoinmagazine.com/articles/who-funds-bitcoin-core-development-how-the-industry-supports-bitcoin-s-reference-client-1459967859).\n\
  \n^2 K. Apilak, “BIP-148 UASF First Year Anniversary: A New System of Governance,”\
  \ Hackernoon, 7 July 2018. [Online]. Available: [`hackernoon.com/bip-148-uasf-first-year-anniversary-a-new-system-of-governance-223907ec298b`](https://hackernoon.com/bip-148-uasf-first-year-anniversary-a-new-system-of-governance-223907ec298b).\n\
  \n---\n\n![image](img/ch-6.jpg)\n\n**智能合约有何“智能”之处？**\n\n*智能合约的概念是数字市场的基石。* 尼克·萨博在\
  \ 1990 年代中期得出这一结论，比中本聪设计比特币区块链早了十多年^1。尼克·萨博是一位计算机科学家、密码学家和法律专家，也是被怀疑为中本聪的人物之一。当你探索他的已知作品或阅读他撰写的学术文献（包括关于智能合约的文献）时，这种怀疑只会加深。\n\
  \n#### 区块链的“杀手级应用”，还是说不是？\n\n尽管如此，区块链领域的许多人相信，智能合约可能会成为该技术的*杀手级*应用。那个最终能让区块链技术真正走向主流的应用。话虽如此，你最初听说智能合约很可能是因为它与区块链的关联。然而，你必须知道，这个想法在区块链或加密货币出现之前很久就已被讨论。尽管如此，智能合约和区块链正变得密不可分。确实有理由相信，前者最终可能为后者提供完美的用例，反之亦然。\n\
  \n智能合约的概念以各种形式实施已有数十年。这主要发生在独立或中心化的服务器系统中。然而，明确讨论这一想法的第一个地方是尼克·萨博于 1996 年发表的学术文章《智能合约：数字市场的基石》^1。这是一份任何对该技术感兴趣或想了解其工作原理（尤其是从技术角度）的人都应该抽时间阅读的文档。\n\
  \n该文档的核心主题是关于如何将指导线下合同交互的法律原则应用于数字空间的提案。尼克·萨博问道：“我们辛苦赢得的法律传统中，哪些部分在网络空间时代仍将有价值？将这些普通法原则应用于我们在线关系的设计，最好的方式是什么？”\n\
  \n他的解决方案？智能合约，他将其定义为“以数字形式指定的一组承诺，包括各方履行这些承诺的协议。”他进一步解释说，合同条款将以一种使违约变得困难或昂贵的方式嵌入计算机硬件和软件中。有趣的是，尼克·萨博描述了公私钥密码学（区块链的主要组成部分）将如何成为使真正高效的智能合约应用成为可能的核心。\n\
  \n快进到 2013 年，随着比特币引起公众、企业界甚至各国政府的关注，一位名为维塔利克·布特林的加拿大年轻人发布了一份白皮书，提出了以太坊——一种比特币区块链的替代方案。在文中，布特林解释了比特币区块链的弱点，以及以太坊为何因没有这些弱点而成为更好的区块链。比特币和以太坊的主要区别之一在于，后者将支持智能合约的开发、启动和运行。在以太坊出现之前，几乎没有人将智能合约与区块链技术联系在一起。\n\
  \n\n\n\n\n## 但为什么是以太坊而不是比特币？\n\n以太坊区块链被设计为一个图灵完备的虚拟机（你可以在其上编写能够解决任何合理计算问题的程序或合约）。特别是，它支持主流或易于使用的编程语言。如今，以太坊不再是唯一支持智能合约的区块链。替代方案包括\
  \ EOS 和 Cardano。甚至比特币区块链也通过 RSK（构建在其之上的平台层）获得了支持智能合约的能力。\n\n### 究竟什么是智能合约？\n\n对于智能合约应用存在许多定义。简单来说，它是用编程语言编写的协议，以便计算机能自动执行。智能合约不是用通俗英语为对手方和仲裁者（如司法人员）撰写供其解读，而是用计算机语言编写，这样机器不仅能读懂它，还能执行它。纸面合约与代码合约的区别不仅在于编写方式：纸面合约由外部强制执行（脱离纸面本身），而用代码编写的合约则自我强制执行。\n\
  \n### 智能合约在现实世界中早已存在\n\n即使没有区块链，许多智能合约几十年来一直围绕在我们身边。尼克·萨博在其论文中给出了自动售货机的例子^(1)。当你想从中购买一罐苏打水时，内置协议会引导交易；投币的动作会触发一系列自动事件，将那罐苏打水送到你手中。这系列事件是由安装在计算机中的程序执行的。\n\
  \n也许一个更贴近生活的例子是订阅在线杂志或软件解决方案。当你设置银行定期转账以支付房租等经常性账单时，某种程度上也发生了这种情况。在上述每种情况下，计算机都被指令在特定条件满足时（例如每月的某一天）采取特定的定期行动（例如付款），且极少需要人工干预。计算机程序必须遵循经典的“如果-那么”逻辑：如果是每月的第三天，（那么）支付杂志订阅费、支付软件即服务费、或向房东账户支付房租，等等。\n\
  \n这里的重点是，智能合约可以在中心化服务器系统上部署、启动和运行，这已经发生过许多次。确实，智能合约的使用并不需要区块链的存在。然而，区块链技术为智能合约提供了关键特性，使其更加强大。\n\
  \n总体而言，区块链赋予了智能合约处理更重大协议（如房地产买卖）的能力。特别是，该技术赋予智能合约不可篡改性，并以终局性强制执行它。毕竟，如果对手方、受信任的第三方或未经授权的外部人员能够更改合约的细节或执行过程，这是不可取的。\n\
  \n在中心化服务器系统上，管理员或黑客可以在合约激活时轻松访问并做出剧烈更改。其权力或控制权交给了一方，该方可随心所欲地更改规则。相反，一旦智能合约在区块链上上线，没有人能更改其细节或执行过程。智能合约必须完整运行其全过程。此外，合约的存在不依赖于某台特定服务器或计算机的可用性——有人可能拔掉电源导致合约无法履行。在区块链上，智能合约是主权的。它们拥有自己的生命，没有人有权力控制它们。\n\
  \n区块链还提供了对所有参与者可见且可执行的智能合约。此类智能合约在公共账本上执行。所有对手方都能观察执行的每一个细节，因为共享账本是所有对手方共享的真相，从而实现了可验证性。区块链为其上记录或执行的每个要素留下了清晰且可证明的路径。\n\
  \n智能合约具有高度隐私性，因为对手方无需在交易中引入受信任的第三方。更重要的是，得益于高阶密码学，它们无需暴露现实世界的身份。区块链网络也不需要这些信息来验证智能合约是否按预期执行。\n\
  \n### 使用智能合约的挑战\n\n像任何其他技术一样，智能合约的实施，尤其是在区块链上，面临诸多挑战。一大挑战是法律障碍。智能合约必须在现有法律下得到认可，才能真正具有强制执行力。在现行法律下，一方对手方很容易无视智能合约的履行，转而寻求法院的有利判决。许多因素可能导致智能合约被宣告无效。例如，在某些国家，法律明确要求公证人或监誓专员等第三方介入，合约才被视为有效。在其他国家，纸质文件上的签名是合约的重要组成部分。\n\
  \n另一个挑战是让最知识渊博、技术最娴熟的人来编写合约。就目前而言，大多数最精通的程序员不是律师，而大多数律师又不是程序员。如果智能合约要被委以执行极其关键协议的重任，它们必须由既不会在法律解读上出错、也不会编写出漏洞百出的智能合约的人来编程。\n\
  \n同样真实的是，大多数人希望或需要在合约激活前阅读它。许多人如果不了解智能合约的每一个细节，特别是它如何影响他们的利益，就不会放心让它在区块链上运行。遗憾的是，普通人无法阅读和理解用计算机语言编写的指令。\n\
  \n另一个主要挑战是克服代码中的错误和漏洞，它们可能中断执行，或成为他人可利用的漏洞。正如我们在第 4 章所见，一个戏剧性的例子是第一个主要去中心化匿名组织（DAO）——区块链上的一个虚拟实体——因其智能合约代码存在漏洞而未能成功启动。一名黑客利用该漏洞，试图窃取近\
  \ 6000 万美元。\n\n最后但同样重要的是，智能合约可能无法消除合约中的任何歧义。冗长的合约往往包含模棱两可的陈述，这往往非故意，而是因措辞不当而产生。人比计算机更擅长解读此类歧义。对手方可澄清情况，并按商定意图履行合约。若有争议，可提交仲裁程序。但一旦智能合约在区块链上上线，就无能为力了。如果它采纳了非预期的解读，对手方只能承担后果。\n\
  \n### 创建你自己的智能合约\n\n尽管存在挑战，智能合约或许正是互联网所期待的。物联网等系统将从智能主权合约中获益良多，因为遍布广阔互联网的智能设备可以订立合约条款并自动履行。\n\
  \n智能合约之所以“智能”，是因为它们能在无人干预的情况下执行合约条款。这确实能改进其他技术的应用，也能从中受益。例如，通过利用 AI，它可能变得更加智能。\n\
  \n\n\n\n\n一些非常复杂的智能合约可以被设计为从指定的在线预言机接收实时数据。它不仅需要能够处理数据，还需要能够判断数据是否合适。\n\n如果你需要编写智能合约，第一步是学习一种用于此目的的编程语言。最常用的是\
  \ `Solidity`，它被用于 `Ethereum`、`RSK` 和其他智能合约区块链平台。第二步是在本地设备上安装合适的客户端软件并学会操作它。\n\n\
  了解、精通并熟练掌握智能合约很可能是一个绝佳的决定。它可能会成为区块链上对社会运作产生巨大影响的应用之一。\n\n^1 Szabo, Nick. “Smart\
  \ Contracts: Building Blocks for Digital Markets.” Extropy, 1996.\n\n| ![image](img/ch-7.jpg)\
  \ | | **我的企业应该使用区块链吗** |\n| --- | --- | --- |\n\n你遇到的几乎每个人都声称区块链是未来。关于这项技术将如何改变商业，从资本市场到音乐产业，就像互联网一样，有很多讨论。正因为如此，你很可能在想，自己是否做得足够多，以确保企业不会落后。\n\
  \n可以说，你应该始终保持主动，并迅速利用出现的任何新技术。然而，第一步始终应该考虑它是否能给你的企业带来实际优势。这通常体现在削减初始和运营成本、提高流程和系统效率、保障价值，以及给客户提供更好的用户体验。考虑它是否还能为你创造目标市场会认为有价值或有用的新产品提供机会。\n\
  \n你可能犯下的最大错误是为了采用而采用新技术。或者因为其他人都在拥抱它，这样做看起来也很酷。相反，应该因为你详细的研究、审计和分析让你确信它能为企业增加真实价值而采用该技术。这是开展业务的最佳方式。这也适用于区块链。\n\
  \n## 你的企业真的需要区块链吗？\n\n考虑到我对你的业务一无所知，我很难给出是或否的答案。我将做的是帮助你得出适当的结论。最好的切入点是弄清楚区块链技术究竟提供了什么。通过了解我所谓的区块链的“价值”，你可以判断它是否有助于你的业务向前发展。\n\
  \n那么，区块链提供了什么，它们如何帮助企业？\n\n## 区块链为你的企业提供什么\n\n区块链提供的价值清单并不长。这是件好事，因为这使得决定是否需要该技术成为系统的一部分变得更容易。该技术可能对你的业务有用，但只是尚未到时候。也许你必须等待它进一步演变，才能在你的业务中找到合适的用例。同样重要的是要指出，其他企业和团体在区块链之上运行的应用程序，可能比区块链本身以更微妙的方式对你的业务有用。因此，保持关注是好的。\n\
  \n区块链可以为你的企业提供五大核心价值：(1) 去中心化，(2) 不可篡改性，(3) 代币，(4) 隐私，和 (5) 智能合约。\n\n### 1. 去中心化\n\
  \n区块链为企业提供的第一个价值是去中心化。这消除了数据管理以及应用程序托管和运行中的单点弱点或故障。因此，它为系统和流程提供了更多的安全性和稳定性。2009\
  \ 年，区块链通过 `Bitcoin` 首次被揭示时，几乎所有人都认为它只适合支付解决方案。然而，尤其是在 2015 年 7 月 `Ethereum` 推出后，人们逐渐意识到该技术可以为广泛的应用提供动力。确实，作为一个运行在点对点网络之上的虚拟机，它可以取代中心化的服务器后端。\n\
  \n区块链是一个运行在点对点网络上的虚拟机这一事实，使其几乎不可能被禁用。没有开关可以关闭，也没有中心节点可以被攻击以瘫痪整个网络。任何依赖传统后端服务器的企业，都始终面临后端可能被攻破甚至下线的风险。即使后端仅离线几分钟，也可能严重影响其运营。虽然企业可以通过备份来最小化影响，但直到主服务器恢复在线之前，最终用户的体验通常都不一样。此外，在中心化系统中，攻击者只需集中精力攻击单个或少数几个点。\n\
  \n区块链显著改变了事物的运作方式。只要互联网存在，区块链将始终在线。此外，区块链后端为应用程序和业务数据提供了更多的安全性和稳定性。无需担心因服务器技术故障或黑客攻击导致的可能停机，这消除了备份成本。你也不必担心第三方攻破你的系统，导致你无法有效服务客户。该技术至少使得持续发起拒绝服务攻击、系统接管和数据篡改等攻击变得更难一些。\n\
  \n### 2. 不可篡改性\n\n区块链为企业提供的第二个价值是数字记录的不可篡改性。一旦内容创建完成，没有人，甚至系统管理员都无法更改它。在 `Satoshi\
  \ Nakamoto` 发布 `Bitcoin` 之前，几乎没有一种可靠的方法能让数字数据在创建后冻结。企业保护数字数据完整性的唯一方法，是确保对其的访问权，特别是编辑权限，受到严格保护。阻止那些出于个人利益、破坏甚至娱乐目的想要篡改记录的人，一直是一项非常昂贵的开支。根据保险公司\
  \ `Hiscox` 的一份报告，全球企业因互联网不安全平均损失 20 万美元^1。\n\n通过阻止任何可能有理由更改或删除数据的人来保护数据完整性，成本非常高昂。区块链所做的是将数据“烧录”到共享账本上。这使得任意撤销、修改或删除记录几乎成为不可能，因为必须先达成共识。\n\
  \n此外，网络会忽略任何违背其规则的行为。在本书的其他章节中，我已经解释了挖矿和博弈论的概念如何帮助维护区块链系统的完整性。当然，有人可能会争辩说挖矿的成本与在中心化服务器系统中保护数据的成本一样高。确实，挖矿可能非常昂贵。例如，`Bitcoin`\
  \ 网络消耗的电力相当于 `Switzerland` 这样一个中等规模国家的用电量。然而，维护区块链的成本不会随着用户或应用程序的数量增加而增加。相反，随着区块链上用户和应用程序的增多，成本可能变得微不足道。此外，还有采用不需要巨大电力的共识协议的新区块链设计。例如，基于\
  \ `Proof of Stake (PoS)` 协议的区块链，如 `Tezos`、`NEO` 和 `DASH`，使用的电力微乎其微。\n\n### 3. 代币\n\
  \n\n\n\n区块链为企业提供的第三大价值是创建主权数字资产的能力。这些数字资产独立于您的业务存在于互联网上，本身就是具有生命周期的宝贵资产。这些资产包括货币、证券和代币，我们在第\
  \ 3 章中已对此进行了讨论。虽然您的小型企业可能没有理由创建数字货币，但可能会用到代币和证券。在区块链上创建的代币可用于企业的许多方面。例如，它们可用于忠诚度积分系统，或用于将现实世界资产代币化。例如，如果您是房地产经纪人，您可以将您控制的房产代币化，使其易于追踪、交易和管理。您还可以在在线系统的博弈论中使用代币作为激励，以奖励特定行为。\n\
  \n我们或许最熟悉的是将代币作为通过 ICO（首次代币发行）和 IEO（首次交易所发行）筹集资金的工具。在这种情况下，您在区块链上创建代币并将其出售给公众，以筹集资金资助特定项目。当这些代币被出售以筹集资金时，它们很容易被重新归类为证券，这要求发行人必须满足发行股权的现有监管要求。尽管如此，区块链在技术上使资本代币化变得更加容易。\n\
  \n### 4. 隐私\n\n区块链技术提供的第四大价值是各方能够在不披露大量个人信息的情况下，安全有效地在线交易。前文我已解释了区块链上存在的匿名性和伪匿名性概念。如果您需要在客户与您的业务在线交易时向其保证隐私，那么区块链是一项值得探索的技术。它拥有必要的工具，使您能够为客户提供最高级别的隐私保护。有人认为隐私是区块链技术的主要卖点。确实，大多数选择使用区块链应用（特别是支付解决方案）的人，主要是因为他们相信该技术能提供隐私。为此，他们往往牺牲了流畅的用户体验和快速的交易速度。\n\
  \n### 5. 智能合约\n\n区块链提供的第五大价值是智能合约。该应用允许两方或多方以代码形式编写协议，并在满足预定义条件时自动执行。由于区块链具有不可篡改性，一旦合约启动，任何一方都无法更改，必须运行至结束。除了记录的不可篡改性，使区块链成为托管智能合约最合适技术的原因是原生货币属性。确实，大多数合约都涉及资金。使用传统支付方式结算自动执行的智能合约极具挑战性，主要是因为支付可能被撤销、取消或冻结。在区块链上签订使用区块链原生货币的智能合约，可向所有对手方保证协议的每一部分都能得到履行。有人将智能合约描述为区块链最具革命性的应用。\n\
  \n### 定制您的区块链\n\n我们已经探讨了区块链为您的业务带来的几种可能价值。每种价值都有多种定制方式。在您的业务中使用区块链将涉及微妙的平衡。您可能需要为了其他方面而牺牲某些东西。例如，为了隐私、安全性和不可篡改性而牺牲速度。\n\
  \n此外，某些被认为区块链提供的特性，实际上并非如此。其中之一是效率。与中心化系统相比，区块链通常效率较低。在许多情况下，用户不得不以效率、便利性和良好的用户体验为代价，换取安全性和隐私等特性。在盲目跟风区块链之前，您需要询问自己寻求哪种价值，以及是否可以在不做此类牺牲的情况下从其他地方获得。话虽如此，未来正在开发速度更快、用户体验好得多的区块链。\n\
  \n必须强调为您的业务定制技术的必要性。正如互联网一样，一家企业使用它的方式往往与另一家截然不同，会根据其特定需求和要求进行定制。您应以同样的方式看待区块链。\n\
  \n^1 Steinberg, Scott. “Cyberattacks Now Cost Companies $200,000 on Average, Putting\
  \ Many out of Business.” CNBC, 9 Mar. 2020, [www.cnbc.com/2019/10/13/cyberattacks-cost-small-companies-200k-putting-many-out-of-business.html](http://www.cnbc.com/2019/10/13/cyberattacks-cost-small-companies-200k-putting-many-out-of-business.html).\n\
  \n| ![image](img/ch-8.jpg) | | **跨越至区块链** |\n| --- | --- | --- |\n\n您可以为您的业务设计并构建自己的区块链。然而，在踏上这段旅程之前，请仔细考虑以下三个问题：(1)\
  \ 您真的需要一个新区块链吗？(2) 您有设计和构建新区块链的能力吗？(3) 您能否聚集并激励一个社区来支持和维护它，使其长期来看成为一个真正的区块链？\n\n\
  如果对这些问题的任何回答是“否”，那么很简单：不要继续为您的业务设计和构建区块链，因为您极有可能在这项事业中失败。此外，您将使自己陷入积累可能永远无法收回的成本的境地。\n\
  \n为了帮助您决定最终是否应考虑设计和构建区块链，让我们详细探讨这三个关键问题。\n\n### 您需要自己的区块链吗？\n\n您的业务在其系统和流程中需要区块链解决方案，这并不直接意味着您必须亲自设计和构建它。事实上，绝大多数企业不需要，也永远不需要构建任何区块链就能从该技术中受益。我们可以将企业为其需求构建新区块链，比作为为了支持电子商务网站或运行销售管理应用而尝试从头构建互联网。这说不通。\n\
  \n构建新区块链需要大量资源。我不仅指资金，还包括时间和专业知识。甚至有人会说区块链是编程社区内的一个独立专业领域。企业主不太可能为了省钱而学习如何编写区块链。他或她会从大局考虑业务，并可能阅读相关资料以了解如何与开发人员沟通。\n\
  \n话虽如此，区块链仍处于早期阶段。因此，许多企业会发现他们必须从头构建某种基础设施，因为没有其他人构建过他们所需的那种基础。然而，随着时间的推移，构建基础区块链基础设施的需求将减少。毕竟，它们主要是技术“公共区域”，无数企业可以使用单一区块链。\n\
  \n### 如何为业务接入区块链？\n\n必须认识到，区块链解决方案可在三个基本层面上为企业所用。\n\n#### 使用现有应用\n\n在最顶层，企业从现有区块链上的现有应用获取服务。在此层面，企业无需构建任何东西。相反，在许多情况下，它只需接入并开始使用区块链解决方案。许多公司现在正在以\
  \ dApp（去中心化应用）的形式设计和构建企业级区块链解决方案，其他企业可以接入并使用，通常需要支付费用。\n\n\n\n#### 创建 dApp\n\n第二层级是企业通过在现有区块链上设计和构建自己的\
  \ dApp 来访问区块链服务。当没有区块链应用能提供所需服务时，就会出现这种情况。例如，如果你需要一个执行你业务独有流程的应用，你可能必须自己构建。即使存在此类服务，还有其他理由设计和开发自己的\
  \ dApp 吗？有的，例如如果你不确定是否要向第三方暴露内部流程或数据。\n\n你可以在许多现有区块链（如 `Ethereum`、`EOS` 和 `Cardano`）上设计、构建和运行应用。但是，你需要具备高水平的技术专长。这不仅仅是插件式使用服务：熟练的开发人员不仅需要设计和构建它，还要确保应用与其运行的区块链良好对接。应用拥有友好的用户界面（`UI`）和用户体验（`UX`）至关重要。换句话说，构建此应用将经历任何典型应用都会经历的流程和步骤。然而，根据我们见证的趋势，不久几乎任何人都能构建区块链应用。一些较新的区块链正推出应用模板或构建模块，这将使即使编码技能很少的人也能构建功能强大且吸引人的\
  \ dApp。`EOS` 就是这种区块链之一，你可以在上面组装部件来创建应用，只需极少的编码。`EOS` 核心开发团队的目标是提供类似于使用 `WordPress`\
  \ 构建网站的体验^(1)。\n\n#### 构建你自己的区块链\n\n构建区块链是第三个也是最低层级。但这也是企业参与门槛最高的层级。只有当既没有应用能在区块链上给企业提供所需能力，也没有区块链能构建和运行所需应用时，才应在此层级获取区块链收益。随着区块链及其上运行的应用列表不断增长，企业发现它们所需的一切几乎都已构建完成。正如谚语所说，没有必要重复造轮子。开发新区块链的主要动机几乎从来不是某个企业的内部需求，而是主要为了向更广泛的社会提供新技术和做事方式。\n\
  \n看看大多数区块链设计师，如 `Vitalik Buterin`、`Daniel Larimer` 和 `Charles Hoskinson`，他们分别构建\
  \ `Ethereum`、`EOS` 和 `Cardano` 并非因为他们需要区块链用于系统或业务。对他们来说，这或多或少是一种哲学动机。更重要的是，他们三人都是在为用户社区构建东西，其中包含无数大、中、小企业。\n\
  \n继续前进。\n\n### 你能设计和构建区块链吗？\n\n假设你有充分的理由构建一个全新的区块链。或者你可能发明了一种实现区块链协议的新方法，修复了其他区块链协议中的弱点。下一个需要思考的问题是，你是否拥有交付它所需的必要资源。在这方面最关键的资源是技术专长。如果你内部已具备该技能，你的任务就完成了一半。如果没有，请注意，获取这些技能是一个巨大的挑战。\n\
  \n你可以选择接受培训以获取技能。幸运的是，现在有几家机构提供区块链开发培训，其中最受欢迎的是 `Blockgeeks`、`Hyperledger` 和 `ConsenSys`。另一个选择是雇佣已经受过培训或具备必要经验的人。这看起来是一条更简单、更快捷的路；然而，鉴于区块链是一项新技术，擅长它的开发人员数量不多，公司和初创企业都在努力吸引合适的人才。由于这种短缺，可能需要相对巨额的预算来支付最优秀的人才。\n\
  \n第三个选择是聘请专业的区块链解决方案开发公司。有几家这样的公司，而且每年都在涌现更多。最好的公司由曾在早期区块链上工作过的人创建。许多首批 `Bitcoin`\
  \ 和 `Ethereum` 核心开发人员后来都创立了自己的区块链解决方案公司，提供设计和构建应用等服务。`ConsenSys` 就是其中之一，专门设计和构建运行在\
  \ `Ethereum` 区块链上的企业级应用。另一家拥有大量区块链开发人才的公司是 `Blockstream`。这家加拿大公司汇聚了一些最受尊敬的区块链专家，包括\
  \ `Adam Back`、`Pieter Wuille` 和 `Eric Svenson`^(2)。另一家提供区块链开发服务的公司是 `Ciphrex`，由前\
  \ `Bitcoin` 核心开发人员 `Eric Lombrozo` 和他的父亲 `Enrique Lombrozo` 共同创立。\n\n### 你能创建并激励一个真正的区块链社区吗？\n\
  \n区块链之所以成为区块链，是因为点对点网络上的独立计算机协同工作、协作，并在共享账本上的交易上形成共识。区块链需要激励一个能够长期自我维护的社区。这也关乎点对点网络上的独立计算机形成虚拟机或某种形式的操作系统，以支持和运行不同类型的应用。\n\
  \n如果你的区块链运行在单台机器或你拥有并管理的私有网络上，它不符合区块链资格。它将被视为或多或少类似于中心化服务器系统。\n\n因此，在设计协议和编写代码后，邀请他人加入你，共同构建一个强大的点对点网络至关重要。这并非易事；你需要给他们其他区块链上找不到的价值，以便他们投入资源使你的区块链运转。这可能是因为你的协议专门针对特定用途或利基市场，或者仅仅是因为采用了更优越的技术。`Satoshi\
  \ Nakamoto` 在设计和构建 `Bitcoin` 核心软件后，着手通过 `P2P Foundation` 和 `Cypherpunk` 邮件列表等在线论坛建立社区，以保持项目的可行性。这是一个关键步骤。\n\
  \n### 打造一个可行的区块链\n\n区块链需要一个社区才能生存。`Satoshi Nakamoto` 肯定遇到了许多困难，说服人们尝试他的发明。不单因为它完全是新颖且前所未有的。你将面临类似但不完全相同的挑战。人们现在选择过多；撰写本书时，已存在超过\
  \ 3,000 条区块链。你必须说服他们，为什么你的区块链比其他数千条更适合他们。\n\n\n\n\n总而言之，在着手构建新区块链之前，你需要确定你的业务是否真的需要它，特别是现有的区块链是否不具备其所需的容量和功能。此外，你还需要确定你是否有能力构建该区块链以及成本几何，以及这一切在商业上是否真的讲得通。最后，聚集并激励一个社区来维护它，使其安全并值得被视为一个区块链。\n\
  \n^(1) “How to Build a Decentralized App (DApp) on EOS - Merehead 3747.” Merehead,\
  \ 16 Apr. 2020, [merehead.com/blog/how-build-dapp-eos/](http://merehead.com/blog/how-build-dapp-eos/)。\n\
  \n^(2) “Blockstream.” Crunchbase, [www.crunchbase.com/organization/blockstream/current_employees/current_employees_image_list](http://www.crunchbase.com/organization/blockstream/current_employees/current_employees_image_list)。\n\
  \n![image](img/pt-2.jpg)\n\n## 应用\n\n| ![image](img/ch-9.jpg) | | **用例 1：银行与金融**\
  \ |\n\n| --- | --- |\n\n毫无疑问，迄今为止区块链最成功的用例是在传统银行和金融体系之外提供金融服务。这主要通过两类应用实现：加密货币和去中心化金融，通常称为\
  \ DeFi。\n\n目前前者更为突出，但按即将到来的 DeFi 项目来看，这种情况不太可能在未来十年保持下去。我们稍后将详细探讨这两类区块链应用。\n\n###\
  \ 区块链：威胁还是进化？\n\n首先必须指出：区块链是对中央银行体系的首个真正威胁。然而，如果行业以正确的方法拥抱它，这项技术有潜力显著地、向好地改变该体系。显而易见，银行和金融业从区块链获得的变革远比过去几十年从互联网获得的要多。\n\
  \n互联网也以显著方式改变了银行和金融服务。然而，它甚至未曾尝试动摇生态系统内的权力平衡。或多或少，传统金融机构保留了对银行体系的控制。甚至可以说互联网帮助大型金融机构进一步巩固了其控制地位。\n\
  \n互联网作为一项新技术，仅提高了效率，并为银行触达客户提供了额外渠道。它还帮助它们削减了运营成本。大多数银行要么放缓了开设新网点的步伐，要么关闭了一些现有网点，因为它们可以在线提供大部分服务。这无疑增加了利润率。根据\
  \ BBC 2018 年 6 月的一份报告，英国每月有超过 60 家银行网点关闭。苏格兰皇家银行（RBS）的一位发言人表示，不断变化的消费者习惯推动了这一趋势：\n\
  \n> “自 2014 年以来，在英国使用我们网点的客户数量下降了 40%，而同期移动交易量增加了 73%。随着客户与我们开展银行业务的方式持续改变，我们必须改变服务他们的方式，因此我们正在投资网点并重塑网络，用替代性银行服务方式取代传统的实体网点。”^(1)\n\
  \n就区块链而言，它不仅为银行和其他金融服务提供商提供了更好、更廉价、更高效的服务交付方式。更重要的是，它干扰甚至转移了生态系统内的权力平衡。特别是，它赋予了最终用户在如何接收金融服务方面更多的发言权。这些是银行产品和服务的消费者，例如街头的普通大众及其存款，或利用银行完成交易的企业。它甚至可以延伸至面向散户投资者的财富管理。区块链还降低了金融服务行业的准入门槛，至少在技术基础设施方面是如此。当然，任何想要创办金融服务业务的人仍需满足通常严格的监管要求。\n\
  \n更重要的是，区块链技术为个人和企业提供了工具，使他们能够直接交易，而无需通过受信任的第三方。我们称之为点对点（P2P）交易。首次实现了两个或多个实体（或交易对手）在不涉及任何银行或金融机构的情况下，进行包括汇款在内的复杂但结构良好的金融交易。就货币而言，这是社会运作方式的重大转变。\n\
  \n### 加密货币如何改变格局\n\n此时，让我们首先探讨区块链如何通过加密货币改变银行和金融。世界通过其首个应用——比特币的成功首次了解区块链。该技术最成功的应用仍多为加密货币。如今，除了比特币，我们还有数百种其他加密货币，包括\
  \ ZCash、Dash、Monero 和 Litecoin 等。每年都有越来越多的新币加入列表，并可能远至未来持续下去。\n\n传统银行和金融体系建立在法币之上，法币是由国家信用担保的货币。通过加密货币，区块链挑战了货币必须由政府发行这一长期存在的信念。事实上，人类社会曾经历过私人货币大行其道的时期。例如，美国历史上\
  \ 1837 年至 1866 年间被称为“野猫银行”时期。“野猫”一词指当时泛滥的私人发行货币。银行、地方政府、教会、酒店甚至小企业都发行自己的货币。这种做法被\
  \ 1863 年的《国家银行法》终止。\n\n### 比特币算钱吗？\n\n到 2009 年中本聪推出比特币时，极少有人能想象一个不基于政府发行货币的金融体系。这或许就是为什么许多人质疑比特币是否应被视为货币。不出所料，国家对其发币权力受到挑战并不买账。例如，2018\
  \ 年美国国会关于加密货币的听证会上，众议员布拉德·谢尔曼表达了政府对加密货币崛起的挫败感。他说：\n\n> “它[比特币]损害了美国政府（……）让美元作为国际金融主要手段的能力，这支撑了我们实施制裁的能力。我们很大一部分国际权力源于美元是国际金融和交易清算的标准单位，通过纽约联储清算，这对石油等重大交易至关重要。[比特币]让我们处于这样一种地位：我们对伊朗等国实施的最重要制裁将变得无关紧要。”\n\
  \n他的提议是让该国立法机构通过法律禁止加密货币，从而保护政府控制金融体系的能力和权力——也许是 21 世纪版的《国家银行法》。然而，比特币及其他加密货币没有中心控制点这一事实，使得即使以武力相威胁也很难将其阻止。\n\
  \n\n\n\n\n## 区块链如何改变银行与金融体系\n\n### 部分准备金银行制度的局限性\n\n传统银行和金融体系的核心是**部分准备金银行制度**。该制度允许金融机构仅持有少量比例（美国为\
  \ 10%）的存款作为准备金，其余作为信贷发放出去。其一个后果是银行实际上创造了货币。例如，若你存入 100 美元，银行本应保留 10 美元，其余作为贷款发放。但通常银行并不等待存款，而是直接批准无资金担保的贷款。本质上，它们只是在账本上记录数字，从而凭空创造新货币。\n\
  \n而在区块链上创建的货币，这不可能发生。流通中的价值单位将始终受协议上限约束。以比特币为例，上限为 2100 万枚；若未来货币在区块链上设计发行，贷款发放模式必须改变。这已在发生，稍后我们将在\
  \ DeFi 应用中看到。若某种加密货币成为主导，通过货币供应量控制经济将失效。\n\n### 消除双重支付\n\n区块链通过加密货币改变金融银行的另一途径，是为**双重支付**问题引入新解决方案——该问题发生于在线支付场景。实物现金简单直观：给你一张钞票或硬币，我就不再拥有它，无法二次或三次花费。但互联网上，事物或文件可无限复制。例如我网上发送一张照片，我仍保留副本可再发给他人；你也能转发并保留副本。\n\
  \n若货币在线表现如照片、文档或音乐文件般可复制，将引发严重问题。双重支付会导致过度通胀，货币因失去价值而实际上不再是货币。因此，数字货币要想可行，必须解决双重支付问题。\n\
  \n比特币发明前，唯一解决途径是引入**受信第三方实体或权威机构**维护和保护交易账本。每当有人花费一单位数字价值，权威机构必须通过更新账本来确认：该人已花费，不再持有可再次发送的副本。这种受信第三方通常是银行、金融机构或支付服务公司。\n\
  \n让银行或 PayPal、Venmo、Skrill 等公司维护账本、防止双重支付，足以使数字货币功能正常。据 MasterCard 报告，许多国家数字支付偏好已超\
  \ 50%，无现金社会趋势强劲。中国香港、瑞典等国现金使用率已降至 10% 以下。这些社会的大量数字支付通过中心化方式完成。似乎双重支付问题已解决，无需更多作为。\n\
  \n然而，用中心化受信第三方解决双重支付有缺陷：\n1. 交易成本较高，公司需覆盖运营开销并为投资者创利。\n2. 受信第三方成为**单点故障**；攻击者仅需攻击一处即可窃取数据或破坏系统。\n\
  3. 其掌握所有用户隐私数据，可随意处置——用户隐私掌握在第三方手中。\n4. 受信第三方可选择或被迫审查交易、因自认正当理由拒绝为部分人服务。\n\n###\
  \ 减少对第三方的依赖\n\n区块链使摆脱此类受信第三方成为可能：用户可通过共识就共享账本状态达成一致。若我发你 50 美元，其他网络用户可见证并记录：我已花费，不再拥有这\
  \ 50 美元，现归你所有。因社区完成验证确认，成本相对较低；因系统去中心化，单点故障更少；用户掌控自身数据。因共享账本上为伪匿名，除交易参与方外无人知晓真实身份。用户下载核心软件（或客户端），实施严格交互规则，极少出错空间。更重要的是，不允许歧视，故无审查发生。\n\
  \n区块链通过加密货币赋予银行金融业的另一关键能力：让现金体验在线化。给人实物现金时，钞票硬币无来源、用途标识，使货币更具**同质性**——同面值硬币始终等价对待。但若通过\
  \ PayPal 支付，我、你、该交易间永存关联。这导致货币有可追溯历史，不总是好事（部分货币可能被视为“受污”）。且付款方、收款方的私生活、交易历史对他人可见。\n\
  \n虽加密货币交易也记录于账本，但一切被混淆为垃圾数据，除非交易双方主动揭示身份。本质上，这赋予数字货币实物现金特质。\n\n### 使跨境微支付成为可能\n\n\
  使微支付跨越国界成为可能，是区块链（特别是加密货币）改变银行金融的另一途径。微支付看似非必要（考虑远距离），但审视可受益于消费者分笔支付少量资金（如几美分）的在线服务和产品数量时，其价值显现。大多数传统金融服务无法发送特定限额以下价值，因成本超值。例如\
  \ PayPal 最低交易额 5 美元，Xoom 为 10 美元，Transfast 为 50 美元。而加密货币使全球发送甚至几美分成为可能，成本相对极低甚至为零。这为企业接受微支付提供特定服务打开大门。例如，在线杂志可允许读者用微支付方案为单篇文章付费，而非笨重的月度订阅。\n\
  \n交易完成速度更快。互联网让信息流动达光速，但资金从全球一角移至另一角仍需数天甚至数周，即使资金为数字形式。通过比特币等加密货币，区块链证明资金可随信息同速环球流动。\n\
  \n须指出的是，加密货币流动因其他原因放缓。发送加密货币体验逐渐趋同法币，这与技术能力关系较小，更多源于监管要求。不应将其与高吞吐量处理能力混淆，后者是比特币的扩容历程。\n\
  \n\n\n\n加密货币交易放缓还有其他原因。长期以来，加密货币的主要用途（除了投机）是将资金从全球一角转移到另一角。能够直接用加密货币支付商品和服务的地方仍然非常少。你几乎总是必须将加密货币兑换成法币，而大多数延迟和瓶颈就发生在这个环节。随着更多交易所被迫满足严格的监管要求，使用加密货币变得越来越慢且成本更高。\n\
  \n尽管如此，加密货币提供了一种银行体系之外的选择——即使人们目前无法在本地商家用加密货币支付商品和服务。这种情况会慢慢改变，并最终变得正常化。与此同时，银行将拥有一个强有力的竞争对手，它们不仅会担心这个对手，还会从中学习。事实上，许多银行、央行和其他金融机构已经在寻求利用加密货币来改善服务交付。它们意识到必须为未来做打算，那时人们转账不再需要经过它们，无论距离多远。但这是后话。我们需要看看区块链改造银行和金融服务的第二种方式。\n\
  \n转账并非银行和大多数其他金融机构提供的唯一服务。这通常既不是它们的主要产品，也不是主要收入来源，更不是它们对经济施加影响的来源。如果你看大多数大型银行和金融机构的年度财务报告，贷款利息和其他形式的信贷收入位列收入来源榜首，也是金融部门权力的来源。ATM\
  \ 手续费、透支费和其他各类费用也名列前茅。贷款及相关服务才是它们的核心产品。因此，即使区块链接管了整个汇款业务，传统金融机构也几乎不会受到冲击。\n\n####\
  \ 去中心化金融应用\n\n然而，区块链在银行和金融的其他方面正展现出实用价值。这就是去中心化金融（DeFi）应用登场的地方。^(2) 这些是提供其他银行服务的特殊\
  \ `dApps`，包括信贷、货币兑换、保险、储蓄，甚至投资组合管理。与传统银行和金融机构不同，DeFi 服务采用点对点模式提供；一个人可以直接给另一个人提供信贷，无需经过受信任的第三方。毕竟，银行并非从自身资金中发放信贷，而是来自客户存入储蓄账户的存款。确实，银行所做的很大一部分工作是促进借款人和储蓄者之间的价值流动。当然，它们也提供关于还款的安全性和担保。但随后它们收取利息，并将其中一部分分给存款人。\n\
  \n区块链消除了对第三方（无论是银行、保险公司还是投资组合管理实体）促成交易的需求。它提供了工具，使两个个体能够相互提供各种银行服务。甚至企业也可以从公众那里获得信贷。\n\
  \n##### 智能合约应用\n\n使点对点 DeFi 交易成为可能的主要工具是智能合约应用。如果你还记得第 6 章的内容，智能合约允许通过计算机程序起草和执行协议。当条款和任何预先约定的条件得到满足时，它会自动执行。这一单一应用使得我们可以信任地将贷款借给陌生人，并按协议规定偿还。例如，作为贷款担保，智能合约可以包含土地所有权或数字代币等资产。如果借款人未能在约定时间偿还，智能合约会自动将作为担保提供的资产所有权转移给贷款人。\n\
  \n除了支持点对点金融服务的智能合约外，区块链还使人们能够证明自己的身份，并展示积累的信誉，而无法篡改记录。\n\n`Oasis` 是 `MakerDAO`（以太坊区块链上的一个\
  \ `dApp`）的一部分，是一个已经构建并运行的 DeFi 应用示例。在 `Oasis` 上，可以使用数字资产作为抵押品借款、与其他对等方交易，也可以储蓄。储蓄会产生利息，因为资金被借给其他人并连本带息偿还。借款时，必须使用智能合约应用锁定抵押品。`MakerDAO`\
  \ 本质上是一个通过精心设计的治理结构由用户社区维护的平台。确实，`DAO` 代表去中心化自治组织。\n\n##### 货币兑换\n\nDeFi 提供的另一项金融服务是货币兑换，这也是银行和金融机构提供的另一项核心服务。近年来，去中心化交易所（`DEXs`）已成为现实。这些是由区块链和智能合约驱动的平台，你可以在点对点模式下将一种货币兑换为另一种。提供货币兑换服务的\
  \ DeFi 应用之一是 `Uniswap`，它也运行在以太坊区块链之上。\n\n其他备受关注的 DeFi 应用包括市场预测平台 `Augur`、去中心化保险协议\
  \ `Etherisc` 和 P2P 借贷平台 `CoinLoan`。目前判断这些 DeFi 应用能否成长为真正成功的项目还为时过早。然而，它们代表了未来。\n\
  \n对于加密货币和 DeFi 应用而言，显著降低金融服务成本或许是区块链技术对银行和金融业最大的影响之一。这非常重要，特别是对于触达全球无银行账户人口而言。根据世界银行估计，全球有超过\
  \ 20 亿人没有银行账户，这使他们被排除在经济活动之外，对其福祉产生了严重后果。\n\n值得注意的是，虽然如此庞大的全球人口无法获得金融服务，但全球近 90%\
  \ 的成年人拥有手机。这些设备可以作为金融服务的销售终端。这加上区块链降低了金融服务的提供成本，使得触达大多数无银行账户人口成为可能。\n\n### 银行如何应对区块链技术的崛起？\n\
  \n区块链技术对传统银行和金融机构构成威胁。但它也是一个变得更好的机会。确实，银行似乎看到了这一现实，并出于自身最佳利益做出回应。其中一种方式是投资成为区块链演进的一部分。主流银行和金融机构甚至给这项技术起了自己的名字：分布式账本技术（`DLT`）。其他银行则选择开展独立的区块链项目。例如，`Barclays`、`JP\
  \ Morgan Chase` 和 `HSBC` 只是投资区块链初创公司的几家主要银行。\n\n一些银行选择加入联盟，为行业设计和构建技术。正如第 5 章所述，两个最著名的联盟之一是\
  \ `Linux Foundation` 主导的 `Hyperledger`。该联盟于 2016 年 6 月发布了其首个区块链协议，名为 `Fabric`。^(3)\
  \ 另一个联盟是 `R3`，于 2016 年 11 月发布了其首个版本的协议 `Corda`。\n\n\n\n\n## 用例 2：供应链\n\n区块链技术为供应链提供了四大核心优势：\n\
  \n1.  提高效率并降低运营成本\n2.  简化合规与质量认证\n3.  为最终消费者提供可靠的溯源\n4.  使贸易融资更快捷、安全且低廉的工具\n\n然而，首先让我们了解什么是供应链，以及它如何影响企业、消费主义，甚至监管合规。具有讽刺意味的是，大多数人都未意识到供应链的复杂性及其关键作用，以及作为企业基石的它如何影响我们生活的方方面面。它们实际上支撑着世界的运转；没有它们，一切将陷入停滞，这会对社会产生极其不利的影响。人们可能将面临无基本物资可用的局面，如食物、水、交通、电力、药品，以及几乎所有让生活舒适甚至成为可能的事物。\n\
  \n在撰写本文时（2020 年），我们正通过新冠疫情最生动地见证这一点。可以说，疫情引发的核心问题在于物流的冻结。如果飞机不飞，货物就无法流动。区块链无法解决这一问题，但它可以为物流“排队”带来透明度，这将作为一种对消费者负责的形式发挥作用。\n\
  \n供应链影响着我们在商品和服务上的支出。据供应链管理专业人士委员会（`CSCMP`）——一个全球性的领域专家组织——统计，高达 60% 的产品成本来自于其所使用的供应链性质。高效的供应链使商品和服务成本降低，而低效的供应链往往导致消费者不得不在物资上花费更多。这是提高供应链效率的主要原因。除了为每个人带来更好的用户体验，从长远来看，我们还能降低成本。使用区块链技术是实现这一目标的途径之一[¹]。\n\
  \n### 究竟什么是供应链？\n\n供应链是指产品到达最终消费者手中所必须发生的相互关联的活动、流程和交易。或者是指从原材料开采点到最终产品交付给最终消费者之间的所有环节。\n\
  \n供应链主要存在于三个阶段或环节：\n\n1.  制造前\n2.  制造中\n3.  制造后直至最终产品到达最终消费者手中\n\n制造前的供应链通常包括耕作、畜牧和采矿等活动和流程。重要的是要指出，一个供应链的起点往往是另一个供应链的终点。以面包为例，似乎供应链始于种植小麦的农场。然而，小麦农场本身也是一个消费者，因此也有其他供应链以它为终点。例如，农场必须采购机械、种子、化肥、除草剂、杀虫剂以及种植作物（小麦）所需的其他投入品。\n\
  \n供应链的起点往往不是单一的，而是多个。例如，面包供应链不仅始于小麦农场，还始于奶牛场和养鸡场、甘蔗种植园，甚至可能始于食用色素实验室。这些供应链的“其他”起点提供了烘焙面包的关键原料。我们也不应忘记用于运输和准备原料的机器和工具的供应链，以及面包包装的供应链。\n\
  \n在制造阶段，原材料被转化为最终产品。再以小麦为例，小麦和其他原料被制成面包。整个过程可能发生在同一地点，也可能在不同地点分解为较小的任务，甚至由不同的企业完成。例如，面包制作中原料的称量、计量和混合可能在一个地点进行，而实际烘焙则在另一个地点。\n\
  \n最后，制造后的供应链涉及将成品送达消费者的所有活动和流程。面包从面包房运往仓库，再运往消费者附近的零售店。这包括为提高产品知名度而进行的营销。\n\n这三个阶段之间的活动，如运输和仓储，也是更大供应链的一部分。劳动力、保险、电力、安保和客户支持等其他要素也是如此。此外，客户可能对交付的商品不满意。商品可能在工厂或运输途中损坏，或者与订单不符，却无人察觉直到送达最终客户。一个良好的供应链必须建立一个可靠的渠道，让消费者能将产品退回给零售商，甚至退回给制造商。\n\
  \n从商业角度来看，供应链是引入原材料或库存的渠道和手段、增值过程，以及将最终产品送达客户所涉及的任务。企业要想成功，必须有效管理自身的供应链。这包括以最具竞争力的价格采购最优质的原材料或库存、雇佣最合适的人才、获取合适的设备和服务。还包括建立最佳标准和质量保证流程。供应链还创建了一个有效的销售漏斗，其中包括将产品交付给最终消费者的方法。最后但同样重要的是，一个优秀的供应链系统应帮助企业进行适当规划。例如，确定何时采购新物资，以避免产生积压库存和仓储成本。\n\
  \n### 区块链如何改变供应链\n\n正如你所见，供应链极其复杂，这给使其为企业或消费者高效运作带来了真正的挑战。需要考虑的决策太多了。事实上，一个产品可能经历无限种可能的供应链路径，这并非好事。\n\
  \n[¹]: 参考第 10 章脚注 1。\n\n\n\n\n事实证明，企业通常无法直接控制其产品的整个供应链。例如，面包店可以直接控制从谁那里购买原料以及如何制作面包。但是，它无法控制小麦如何种植或糖如何加工。\n\
  \n企业唯一的筹码是利用可用信息选择合适的商业伙伴。借此，企业可以轻松判断其合作伙伴的供应链如何影响自身的供应链，进而影响其盈利能力。确实，免费可用的信息赋予了企业选择合作伙伴的巨大权力。\n\
  \n不幸的是，真实信息并不总是触手可及，因为每个人都想向世界展示最好的一面。有时这意味着不诚实或隐瞒关键细节，尤其是在涉及利润时。好消息是，区块链在很大程度上可以解决这个问题。该技术承诺让每个人都能从供应链的任何环节获取最可靠的信息，以便据此做出明智的商业决策。\n\
  \n企业和最终消费者在供应链信息方面有着相似的需求，都需要做出良好的决策。就像企业一样，消费者往往想知道其交易对象的供应链如何影响自己。例如，消费者可能想知道从零售店购买的面包是否使用有机种植的原料制作，或者其积累了多少碳足迹。\n\
  \n无论你是生产商、供应商、制造商、零售商，甚至是消费者，供应链都必须为你良好运作。它应在合适的时间以最优价格提供合适的商品和服务，同时提供可信的数据以辅助决策。\n\
  \n### 区块链助力“第三代”供应链\n\n一个能为所有利益相关者带来更好体验的供应链，需要卓越的管理。供应链管理简单来说就是确保供应链高效运行，并适当服务于组织乃至最终消费者利益的过程。大多数组织都有专人负责这部分业务，此人被称为供应链经理或物流经理。他们的工作涉及确保组织使用摩擦最小、成本最低且能提供最佳结果或质量的供应链。正如你所想，做到这一点需要获取高质量的信息。\n\
  \n区块链即将引入我所谓的“第三代”供应链管理系统。在探讨其具体内涵之前，让我们先回顾一下迄今为止的发展历程。第一代供应链系统基于纸质记录。每一笔记录都手写或打印在纸上，归档在文件柜中。同时，邮局作为企业间通信的主要载体，发挥了关键作用。\n\
  \n尽管供应链数据非常详细且极具潜在价值，但其全部潜力几乎未被发掘，因为检索和分析困难。数据大多孤立存在——锁在办公室的文件柜里。缺乏整合不同利益相关者所持信息的方式，因此无法勾勒出供应链的全貌。企业对无法直接控制的供应链的了解，仅限于他人愿意分享的内容。与此同时，消费者几乎完全被排除在体系之外。他们不得不依赖零售店或营销人员的说法来做所有购物决策。\n\
  \n互联网带来了第二代供应链管理系统。信息实现了数字化，更重要的是可以远程访问。然而，互联网上的数字数据也带来了自身的挑战。首要问题是难以保证信息完整性。伪造文件变得更加容易。虽然文件可以通过互联网远程共享，但托管文件的服务器安全性始终受到黑客及篡改、删除、操纵信息者的威胁。即使数字信息能以接近光速传输，支付方式依然缓慢，有时完成一笔交易需要数周。\n\
  \n区块链可以修复数字供应链管理系统的这些弱点，并能做得更多。让我们详细了解区块链正在为供应链管理带来的四大变革：提升效率并降低成本、使合规与认证可靠、提供安全的溯源、改善贸易融资，使其超越过去几十年的水平。\n\
  \n#### 提升效率并降低成本\n\n区块链可通过多种方式大幅削减当前供应链管理系统的成本。购买昂贵的供应链管理软件解决方案可能变得不再必要。作为一种通过社区共识管理的点对点开源协议，区块链是一种无需付费即可访问的产品。该技术还消除了维护或租赁服务器的需求。作为所有利益相关者共享的公共账本，信息或任务的重复极少。\n\
  \n区块链还能保护利益相关者共享的数字文件，因为上链信息具有不可篡改性。一旦文件创建并存储在账本上，任何人（包括创建者）都无法随意更改。此外，由于没有中心化服务器可供攻击，系统遭受黑客攻击的威胁微乎其微。取而代之的是，成千上万台独立计算机作为一个整体存储数据并执行应用代码。不过，用户必须保护特定文件的私钥。同时，该技术提供了工具，特别是智能合约应用，允许业务对方授予对彼此文件的有限访问权限。例如，如果\
  \ A 与 B 开展业务，双方可在交易期间向对方开放文件。交易完成后，访问权限即停止。\n\n#### 使合规与认证可靠\n\n区块链为保护用于合规和质量认证的检查及审计报告提供了更优方案。在现状下，组织可能声称拥有并不存在的认证，或伪造检查记录欺骗供应链合作伙伴。认证或审计机构可在区块链上发布所有人均可访问的证书或报告。尽管认证直接颁发给企业，但因区块链的不可篡改性，其详情无法被更改。同时，被审计实体有权决定谁可以查看报告。在区块链上，你无需信任信息持有者，而只需信任生成该信息的系统。\n\
  \n#### 提供安全的溯源\n\n在溯源方面，区块链提供了现代终端消费者真正寻求的东西。近年来，消费者越来越有兴趣了解产品背后的历程细节。例如，他们可能想知道制造产品所用的能源来源、劳动力是否获得公平报酬、是否涉及童工。他们可能出于健康原因询问制造商使用的原材料，或其是否为有机种植。当今消费者希望确信供应链不仅符合道德，而且对自己、他人和环境都是安全的。\n\
  \n\n\n然而，以合乎道德、健康且环保的方式生产商品可能成本高昂。因此，公司可能会伪造信息，以便继续使用成本较低的生产流程，同时消除消费者的顾虑。区块链不仅能让获取产品历史信息变得更容易，还能因其不可篡改性而使记录难以更改。因此，消费者可以上网查询产品的流向，确认该产品（例如）确实是有机的。对于任何声称环保、绿色、碳足迹最低等的制造商也是如此。\n\
  \n### 改善贸易融资\n\n最后但同样重要的是，区块链提供了手段，使贸易融资比现状更完善。贸易融资是不同国家的两家交易企业进行结算付款的过程。目前的系统缓慢、笨重且成本高昂，部分原因在于一笔交易可能涉及多家银行、金融机构和其他实体。在每家银行能够人工审查文件并给予批准之前，这需要数周时间。区块链提供了智能合约，这使得在单笔交易中不再需要许多受信的第三方。\n\
  \n同样重要的是，区块链上的原生货币可以完成为执行贸易融资交易而编写的智能合约。得益于这一能力，区块链将交易速度显著提升至小时级。\n\n### 将区块链与其他技术集成\n\
  \n除其他外，区块链有助于部署旨在提供效率、更大容量和更好用户体验的其他技术。特别是，它可以支持供应链与物联网的集成，向系统添加智能设备，以协助数据的收集与分析，以及流程的自动化。例如，装运药品的集装箱可嵌入温度读取器，将数据直接发送到区块链上。这有助于识别因温度过高或过低而导致损坏的可能性。其他设备可提供关于集装箱如何固定及开启次数的信息。摄像头甚至可以记录开启过程，并将文件作为产品历史的一部分存储在区块链上。\n\
  \n人工智能（AI）可与区块链作为可靠后端一起构成供应链的一部分。区块链为存储和处理 AI 协议以及系统生成的数据提供了更安全的后端。不同种类的 dApp 可在区块链上实现\
  \ AI。一些 dApp 可帮助精准预测未来市场需求等事件，以提醒制造商、供应商和零售商制定必要计划。\n\n现在让我们看看区块链用于供应链管理的具体用例。\n\
  \n2019 年初，阿联酋国家石油公司（ADNOC）——一家由阿拉伯联合酋长国拥有的石油公司——宣布与 IBM 合作，设计、构建、测试并推出一条基于区块链的供应链，用于追踪石油从油井到炼油厂，最后到消费者的流向。它还将实现交易自动化、缩短运输时间，并降低石油供应链的监控成本。不仅如此，它还将为投资者提供获取公司绩效信息以及链上其他实体信息的渠道。鉴于\
  \ ADNOC 日产量超过 300 万桶石油，这是一个值得关注的重要项目，其成功将成为鼓励其他主要石油生产商采用该技术的重大里程碑^(2)。\n\n另一个具体的供应链区块链用例是戴比尔斯的\
  \ Tracr，这是一个追踪钻石从矿山到消费者的区块链供应链。追踪钻石至关重要，因为其开采和销售往往是冲突、苦难和死亡的根源，尤其是在西非。事实上，这一情况启发了好莱坞电影《血钻》。通过建立\
  \ Tracr 系统，作为最大的贵重矿产经营商之一，戴比尔斯正寻求将通过不道德手段获取的钻石拒之门外。2018 年 5 月，戴比尔斯宣布成功在 Tracr 区块链供应链管理系统上追踪了其首批\
  \ 100 颗钻石，从矿山到切割商、抛光商，再到珠宝商。\n\nTracr 系统利用上传的照片、详细描述、独特的物理属性和位置来追踪一颗钻石。最终目标是让客户确信他们的钱不会落入制造战争和苦难之人的手中^(3)。\n\
  \n艺术行业是一个已经出现区块链真实用例的领域，该行业应用该技术来保护和保障艺术品的来源。假艺术品是一个数十亿美元的产业，许多人常被骗购买赝品或伪造品。区块链技术提供了工具，不仅使追踪艺术品变得容易，还使买家能够证明他们购买的东西是真品而非赝品。几家构建艺术品供应链系统的初创公司和知名企业包括\
  \ Artory、Verisart 和 Provenance.org。Dadiani Fine Art 和佳士得是一些已采用区块链追踪和保护艺术品的主要艺术品拍卖行^(4)。\n\
  \n### 使用区块链面临的挑战\n\n与任何其他技术一样，区块链技术在供应链上的应用并非十全十美。它还有些挑战需要克服，以达到最佳效果。\n\n其中一个挑战是在上链之前或上链点上保障数据可信度的困难。我们知道区块链保护数据并使其不可篡改。然而，在此之前，数据几乎没有得到技术的保护。错误、误导性或收集不当的数据仍可能进入系统。纠正这一点的一种方法是利用物联网实现数据的实时收集，或建立独立的数据认证流程。\n\
  \n企业必须保护其数据免受竞争对手窥探。了解商业竞争对手在做什么总是非常有力的。这可能助长一家组织将另一家组织挤出市场。因此，许多企业甚至国家可能对将数据发布在公共账本上感到担忧。他们可能觉得有必要通过不在区块链上记录数据来保护数据。解决此问题的一种方法是使用密码学等先进技术来加强知识产权。加强法律制度的执行也将有所帮助。\n\
  \n获取实施基于区块链的供应链系统所需的合适人才和技能是一项挑战，因为该技术仍处于早期阶段。区块链技术专家相对稀缺，这使得任何实体想在区块链上构建供应链管理系统都变得更难一些。然而，随着区块链技术变得主流并建立更多产能，这种情况可能会随时间改变。\n\
  \n不友好的法规是一个问题，因为许多国家警惕价值的自由、不受监管的流动，尤其是以货币形式。虽然系统可被设计为在几分钟内完成贸易融资交易，但相关国家的监管要求仍可能将其拖慢至数小时、数天甚至数周。\n\
  \n无论如何，将区块链技术应用于改善供应链具有巨大潜力。鉴于众多初创公司正在构建应用程序以支持这一用例，加上 IBM、戴比尔斯和佳士得等大牌的参与，未来几年很可能会出现一场大规模运动。\n\
  \n\n\n\n## 用例 3：政府\n\n与大多数技术一样，区块链在公共部门的实用性不亚于在私营部门。世界各国政府已开始针对不同用例拥抱该技术。一些政府成立了专责小组，就如何推进提供建议。另一些则走得更远，在设计、开发、测试等各个流程中与私营部门建立合作伙伴关系。还有一些已开始实施应用程序，旨在改变其向公民提供服务的方式。\n\
  \n我们可以从两个方面对区块链对政府的主要影响进行分类：(1) 改进现有流程和系统，以及 (2) 彻底改变政府的概念。在本章中，我们将详细探讨这两方面及其对政府的潜在影响。\n\
  \n### 区块链用于现有系统和流程\n\n我们首先探讨区块链如何改进现有系统和流程。这恰好是公共部门最可行的区块链应用，不仅因为它造成的破坏较小，也不触动现有的权力平衡，而这对政府至关重要。话虽如此，该技术可以通过以下四种主要方式改进政府系统和流程：(1)\
  \ 保护政府为公共服务交付而积累的数据，(2) 提高透明度并建立公众对公共机构的信任，(3) 自动化关键流程，以及 (4) 降低成本。让我们深入了解这四种方式。对于每一种，我们都将看一个世界上某地正在进行或已实施的政府项目案例。\n\
  \n#### 数据保护\n\n正如在私营部门一样，数据对于公共服务交付至关重要，是各国政府的主心骨。通过数据，政府可以识别公民及其各种需求。它还利用数据制定和提供解决方案及服务。不仅中央政府需要保护其数据。独立公共机构或其分支机构（如司法部门、税务部门和选举机构）也有同样的需求。在此名单中，我们还可以加上地方政府和主管部门。\n\
  \n但为什么要保护政府收集和存储的数据？\n\n国家行为体（如外国监视）和非国家行为体（私人公民）都可能威胁政府数据。各国每天都试图相互窃取数据，以获取军事、经济和外交优势。很多时候也是为了相互破坏。一个国家可能需要从另一个国家窃取数据的绝佳理由是影响选举结果。在这种情况下，目标是让上台执政者服务于其经济、军事或全球外交利益。\n\
  \n来自非国家行为体对政府数据的威胁，源于可能想将其用于经济利益的个人和组织。政府掌握的数据往往也需要防范内部人员，他们可能出于私利或其他不道德原因想要获取这些数据。\n\
  \n随着各国政府将系统数字化以更便捷地提供服务，对更高级别数据保护的需求日益增长。虽然数字化进程带来了便利，但系统和数据也更容易受到超越国界的威胁。\n\n威胁既针对个体公民，也针对政府整体。如果政府掌握的关于你的数据落入坏人之手，可被用于窃取你的身份，进而可能被用于窃取你的财产，甚至以你的名义在别处犯罪。同样，政府系统被接管或数据被窃取（我们已涉及此点）会以一种或另一种方式损害、破坏或削弱政府，尤其是在其国际同行面前。\n\
  \n肯尼亚司法部门在 2020 年 1 月发布的年度绩效报告中指出，记录篡改是其面临的最重大挑战之一[¹]。根据报告，许多东非国家的人通过策划窃取和销毁法院登记处和保管处的案卷及证据材料来逃避制裁。遗憾的是，窃取和移除是在工作人员的协助下进行的，他们欣然接受贿赂。因此，这种情况最终导致有经济实力的肯尼亚人更容易如愿以偿，而穷人在法庭上几乎难以获得公正。\n\
  \n肯尼亚司法部门将法院档案数字化视为一种解决方案，因为这将便于追踪，更具体地说，能知晓谁在何时访问了档案。然而，仅靠数字化无法有效解决问题。那些篡改柜中纸质档案的人（登记处的工作人员）极有可能最终获得授权访问数字数据库的权限，因为他们在归档和维护记录方面负有关键职责。他们仍可能被贿赂以删除或更改数字文件中的细节。\n\
  \n区块链为肯尼亚司法部门等机构提供了一种使其数字文件更安全、防篡改的手段。它赋予数字文件不可变性并为其加上时间戳，使得任何人几乎无法删除或任意更改。区块链系统的去中心化性质使得数据能更好地抵御外部攻击。它不那么容易受到针对中心化单点故障的威胁。该技术还便于部署公私钥加密，这非常适合公共信息系统。虽然系统使得任意更改或删除文件成为不可能，但它在透明环境中提供了程序化添加必要更改的机制。\n\
  \n一个利用区块链保障数据完整性的大型公共项目是“智慧迪拜”。迪拜统治者、阿联酋副总统兼总理谢赫·穆罕默德·本·拉希德·阿勒马克图姆于 2013 年 10 月启动了该项目。智慧迪拜旨在使迪拜成为世界上最宜居的城市之一，让大多数服务能在线轻松以极具竞争力的成本获取。它还将使医疗、教育和城市管理更加高效。\n\
