  \ |\n| --- | --- | --- |\n\n您现在已掌握大量关于区块链的基础知识和信息。您知道它能做什么，以及它如何大规模改变商业和社会。也许您希望区块链技术为您的业务创造价值，也许是时候迈出下一步了。这可能正是您最初拿起这本书的原因。但我必须指出，这一过程应在一定程度的谨慎和技巧下执行。我撰写本章正是为此目的，将指导您完成这一过程。\n\
  \n### 将区块链应用于业务的三个步骤\n\n将区块链应用于您的业务应包含三个主要步骤：\n\n1.  **区块链适用性测试**\n    明确您的业务如何将区块链技术融入其流程和系统。\n\
  2.  **区块链就绪度测试**\n    了解您的业务已具备什么，以及需要获取什么以使流程更顺畅。换句话说，在此阶段，您要评估自身的能力与需求。\n3.  **区块链层级或类型测试**\n\
  \    确定要使用区块链技术的确切部分，因为每个企业都有最适合其特定的要素。在此阶段，您希望精准地以最低成本和精力获取所需资源。\n\n这三个步骤包含在一个由三部分组成的工作手册中，我创建它是为了帮助您在每个关键阶段找出答案。通过使用问卷评估每个阶段，您将了解如何以定制化方式为您的业务处理这些步骤。在阅读本章其余部分之前，请先浏览一遍。详细阅读每一部分后，返回填写表格，表格可下载至您的设备。《企业区块链上手工作手册》在线可用：`BlockchainUnlocked.co`。\n\
  \n### 业务区块链适用性\n\n工作手册的第一部分旨在帮助您弄清您的业务是否适合使用区块链技术。地球上几乎每个企业都能以某种方式找到该技术的用武之地。然而，收益因企业而异，有些企业发现该技术有关键用途。相比之下，其他企业将其用于可描述为“表面功能”的方面——唯一的实际应用并不在业务核心运营中。例如，将技术应用于改变业务核心流程和系统的案例：一家黄金贸易公司在区块链上创建数字代币代表其金库中持有的实物黄金，使其易于交易。然而，一家连锁酒店品牌选择将其网站托管在以太坊或\
  \ NEO 等区块链之上，并非在其核心运营中应用该技术。\n\n广义上讲，区块链可以帮助您的业务实现以下至少三个目标之一：解决业务面临的问题、提高效率（如削减成本）以及支持创新（如为客户创造新产品和体验）。\n\
  \n#### 解决问题\n\n企业始终面临持续的问题，其中一些您被迫将其作为经营一部分予以容忍。例如，作为一家小企业，您可能会发现建立积分奖励系统成本略高且要求苛刻。您不得不担心为该目的收集的用户数据保护问题，这会分散您对核心运营的精力。区块链使您能轻松创建和向客户发行代币，无需收集其数据，更重要的是，无需使用第三方服务。\n\
  \n#### 提高效率\n\n该技术通过削减成本、加速流程、提高数据和系统安全性来实现效率。例如，如果将价值从地球一角转移到另一角需要数天，该技术已证明可将时间大幅缩短至几分钟甚至几秒。此外，它还降低了成本，在某些情况下（通过特定协议）甚至降至零。\n\
  \n#### 支持创新\n\n关于创新，该技术为您提供机会和能力，以多种方式为客户创造新产品和体验。例如，利用智能合约和微支付能力，您可以自动化某些交易，开辟以前不存在的机会。例如，在线杂志可利用该技术允许读者按篇付费阅读。这将吸引更多读者，他们无需或无意购买月度订阅，只想阅读单篇文章。\n\
  \n### 业务区块链就绪度\n\n这是引入并使区块链技术成为企业或机构系统一部分过程中的第二步。此阶段分析您的业务就绪度或将技术纳入系统的能力。\n\n特别是，您需要确定团队中是否具备必要的人才和技能。还要确定建立区块链系统需要多少成本，以及您是否有此类资金。最重要的是，论证财务成本并判断能否收回。\n\
  \n\n\nThe biggest challenge small businesses face in using blockchain is a shortage\
  \ of employable talent. Experienced blockchain developers are few and far between,\
  \ and those who are experienced are expensive, often beyond the means of small businesses.\
  \ However, hiring is not the only way to give your business the capabilities it\
  \ needs to embrace blockchain. Team members can be trained to acquire the skill,\
  \ as finding relevant courses, especially online, is becoming easier. Learning platforms\
  \ like [Coursera.org](http://Coursera.org), Udemy, and Skillshare offer a growing\
  \ selection of courses for you to choose from based on your specific needs.\n\n\
  The skill set required to build a blockchain system comes from designers, developers,\
  \ game theorists, and token economists. Designers help you structure what you have\
  \ in mind. Game theorists help designers determine what relationships should exist\
  \ between different participants and, more importantly, how to use their interactions\
  \ to benefit the system as a whole. Finally, developers bring the entire vision\
  \ to life. However, for less complex blockchain projects, you may only need a developer\
  \ with some design and game theory knowledge.\n\n### The Blockchain Level or Type\
  \ Your Business Needs\n\nThe third question is the extent to which you need to adopt\
  \ the technology and what type of blockchain best suits your business. As a business,\
  \ you must decide whether you need a public or private blockchain. Do you need to\
  \ use an existing Blockchain-as-a-Service, or do you need to build a new application\
  \ on an existing blockchain? Indeed, you must determine if you need a brand-new\
  \ blockchain and build it from scratch.\n\nIn other words, blockchain technology\
  \ has several levels, primarily including as-a-service, applications built on top\
  \ of a blockchain, and the core protocol itself. The level at which you adopt the\
  \ technology depends on your specific needs. If your needs are unique and there\
  \ are no available as-a-service applications, you may need to build your application\
  \ on an existing blockchain. If you realize that no existing blockchain can serve\
  \ as a suitable backend for your application, you may need to build the blockchain\
  \ first and then develop the application.\n\nUpon completing this workbook, you\
  \ should be ready to make key decisions on how to proceed with technology adoption.\
  \ As technology changes, I will update this workbook over time, so it will continue\
  \ to evolve. This means that in the long run, the workbook can be used by others\
  \ at any time. You are welcome to use this workbook as a starting point to begin\
  \ your company's blockchain journey, analyzing the relevance of your business to\
  \ blockchain technology.\n\n## Glossary\n\n• **51% Attack**: A situation where a\
  \ malicious actor attacks and gains more than 51% of the entire network's computing\
  \ power (hash rate)\n• **Artificial Intelligence (AI)**: Creating computer applications\
  \ that behave with human-like intelligence\n• **Bitcoin**: The first cryptocurrency\
  \ and store of value launched on a blockchain, launched in 2009\n• **Blockchain**:\
  \ A shared digital ledger of information distributed across different computers,\
  \ recording transactions in chronological order, making transactions expensive and\
  \ difficult to tamper with, allowing potentially opposing parties to cooperate\n\
  • **Blockchain-as-a-Service (BaaS)**: A blockchain service offering that allows\
  \ customers to use cloud-based services to develop and host their blockchain applications,\
  \ functions, and smart contracts\n• **Cryptocurrency**: A digital currency that\
  \ uses encryption techniques to regulate the generation of currency units and verify\
  \ the transfer of funds, operating independently of a central authority\n• **Decentralized\
  \ Autonomous Organization (DAO)**: An organizational system controlled by smart\
  \ contracts\n• **Decentralized Applications (dApps)**: Open-source software that\
  \ leverages blockchain technology\n• **Distributed Ledger Technology (DLT)**: A\
  \ database that exists across multiple locations or among multiple participants;\
  \ it is decentralized, eliminating the need for a central authority or intermediary\
  \ to process, validate, or authenticate transactions\n• **Hard Fork**: A split of\
  \ a blockchain network into two separate networks\n• **Hash Rate**: Computing power\n\
  • **Initial Coin Offering (ICO)**: A fundraising mechanism in which new projects\
  \ sell their crypto tokens to raise capital for new crypto assets, companies, or\
  \ venture capital. Similar to an Initial Public Offering (IPO), where investors\
  \ purchase shares in a company\n• **Internet of Things (IoT)**: Adding smart devices\
  \ to a system to assist with data collection and analysis, as well as process automation\n\
  • **InterPlanetary File System**: An open-source peer-to-peer hypermedia protocol\
  \ designed to make the web faster, safer, and more open\n• **Miner**: A type of\
  \ node that secures the blockchain by computing transactions\n• **Node**: Any electronic\
  \ device capable of connecting to the network, including phones, printers, and computers\n\
  • **Proof of Stake (PoS)**: An algorithm designed to achieve distributed consensus\
  \ on a blockchain\n• **Proof of Work (PoW)**: A model for blockchain to achieve\
  \ consensus\n• **Smart Contract**: A computer protocol that facilitates, verifies,\
  \ or enforces a contract, making contractual clauses unnecessary\n• **Token**: A\
  \ unit issued on a blockchain for a limited or specific function or purpose, such\
  \ as Ethereum Gas and Storj tokens\n• **Tor**: An anonymous communication protocol\
  \ released in 2002\n• **Turing-Complete Virtual Machine**: A computer capable of\
  \ writing programs or contracts to solve any reasonable computational problem\n\n\
