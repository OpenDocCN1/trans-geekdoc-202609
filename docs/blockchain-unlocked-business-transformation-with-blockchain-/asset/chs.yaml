  \ Bitfinex.” Bloomberg.com, Apr. 2019, [www.bloomberg.com/news/articles/2019-04-25/bitfinex-operator-accused-by-new-york-of-850-million-coverup?srnd=cryptocurrencies](http://www.bloomberg.com/news/articles/2019-04-25/bitfinex-operator-accused-by-new-york-of-850-million-coverup?srnd=cryptocurrencies)。\n\
