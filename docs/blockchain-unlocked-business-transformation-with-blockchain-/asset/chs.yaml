  \ Phones and PCs.” VentureBeat, VentureBeat, 27 Dec. 2017, [venturebeat.com/2017/12/27/sirin-labs-raises-157-8m-in-ico-to-accelerate-development-of-its-finney-blockchain-phones-and-pcs/](http://venturebeat.com/2017/12/27/sirin-labs-raises-157-8m-in-ico-to-accelerate-development-of-its-finney-blockchain-phones-and-pcs/)。\n\
