  \n| ![image](img/ch-17.jpg) | | **用例 9：了解你的客户 (KYC) 与反洗钱 (AML)** |\n| --- | ---\
  \ | --- |\n\n关于区块链如何与了解你的客户 (KYC) 和反洗钱 (AML) 法规及系统相关联，必须承认两个矛盾的现实。首先，区块链最初的设计初衷是*绕过*现有的\
  \ KYC 和 AML 系统。其次，该技术赋予客户对其自身数据的控制权，这看似赋予了他们篡改实质性事实的可能性。\n\n\n\n\n\n### 在这两种情况下，区块链技术似乎都使监管工作变得更加复杂，特别是在追踪和管理全球资金流动方面。\n\
  \n自 `Bitcoin` 诞生以来，其主要卖点之一是为用户提供隐私和匿名性，甚至能阻止政府访问其个人数据，尤其是关于他们如何花钱的数据。这在一定程度上解释了例如\
  \ `Silk Road` 及其他使用 `Bitcoin` 作为主要交换媒介的暗网违禁品市场的兴起与昙花一现的成功。虽然在线匹配违禁品买卖双方的技术自 2002\
  \ 年起就已存在（当时名为 `Tor` 的匿名通信协议首次发布），但直到 2009 年 `Bitcoin` 出现之前，不存在一种难以追踪或封锁的数字支付方式。这种加密货币使得人们在使用\
  \ `Tor` 连接后能够以伪匿名方式在线交易，几乎无需担心被追踪。尽管 `Silk Road` 于 2013 年 10 月被查封关闭，让许多人意识到 `Bitcoin`\
  \ 或许并不像想象中那么私密或匿名。`Chainalysis` 等公司的成立证实了这一点，它们构建工具追踪并关联区块链上的交易与现实身份。此类区块链调查公司将这些信息与执法机构、监管机构以及愿意付费的企业共享。\n\
  \n### 区块链世界中的 KYC 与 AML\n\n在早期，许多人错误地描述并认为 `Bitcoin` 是匿名的。结果证明它是*伪*匿名的。区别何在？前者中，用户无需任何形式的身份或档案即可使用服务。匿名支付方式的最佳例子是实物现金。用实物现金支付本身不会将你与交易联系起来。后者中，用户在线获取一个档案，该档案无需关联其现实身份。`Bitcoin`\
  \ 就是一个例子。尽管你需要区块链上的钱包地址来收发款项，但无需将你的姓名或物理地址附加到钱包地址上。\n\n然而，随着时间的推移，防止将用户在区块链上的身份与现实身份关联起来变得颇具挑战，因为用户需要在法定数字货币和加密货币之间进行兑换。当然，要在线使用法币，用户必须注册并通过提交政府签发的文件来证明身份。\n\
  \n更糟糕的是，用户被迫在中心化市场（交易所）买卖，这些平台可能被强制与当局共享数据。毕竟，交易所是区块链身份与现实身份可以关联的节点。随着 `Bitcoin`\
  \ 证明并非许多人最初认为的那样私密，其他加密货币被设计成具备掩盖用户交易的能力，包括 `Monero` 和 `Zcash` 等。为了同一目的，还设计了交易混币器、`TumbleBit`\
  \ 和 `Coinjoin` 等额外服务和协议。去中心化交易所（`DEXs`）也进入了视野。然而，它们大多仅支持加密货币之间的兑换（几乎不支持加密货币与法币之间的兑换）^(1)。\n\
  \n准确地说，最匿名的数字支付仍然只能在区块链上实现。然而，世界各地的监管机构正在采取行动，收紧对加密货币使用的监控和控制。特别是，他们将入金和出金点（如交易所和交易平台）视为实现这一目的的有效工具；这些服务提供商是中心化企业，因此很容易受到监管。就在几年前，在点对点交易平台\
  \ `Localbitcoins` 交易还不需要提供现实身份证明，例如。只需用电子邮件地址注册并创建一个心仪的用户名即可。然而，一波全球监管浪潮（在撰写本书时）正要求交易所和其他加密货币企业建立严格的\
  \ `KYC` 和 `AML` 体系。2019 年 3 月，`Localbitcoin` 总部所在的芬兰议会通过了一项法律，要求虚拟货币服务提供商通过政府签发的文件验证客户身份并认证其物理地址。因此，如果你使用\
  \ `Localbitcoin` 买卖加密货币，该平台肯定知道你是谁，当局也能查看你的交易。这种情况正在全球复制，越来越多的服务提供商要求客户进行实名认证^(2)。\n\
  \n要求虚拟货币服务提供商加强 `KYC` 和 `AML` 的压力不仅限于要求他们识别和验证服务使用者。在撰写本书时，似乎有动向将导致 `Bitcoin` 混淆的行为（进而延伸至加密货币交易）定性为犯罪。2020\
  \ 年 2 月中旬，区块链开发者 `Larry Harmon` 因协助构建名为 `Helix` 的 `Bitcoin` 混币器而被捕，据称该混币器被类似 `Silk\
  \ Road` 的暗网市场 `Alphabay` 上的交易者用于洗钱。许多人认为，如果 `Larry Harmon` 被判有罪，这将向外界释放明确信号：即使只是帮助构建他人可用于洗钱的混币器也是犯罪。这将树立一个先例，可能导致所有加密货币交易混淆服务要么关闭，要么转入地下。无论哪种情况，监管机构似乎正在赢得对加密货币控制权的争夺战，而这在几年前看起来是一项艰巨的任务^(3)。\n\
  \n### KYC 与 AML 法律的区块链演进\n\n现在让我们将重点转向本章的核心：利用区块链技术获得识别和认证金融服务客户的能力，以及帮助追踪和阻止洗钱及其他犯罪活动。简而言之，这是关于利用驱动加密货币的技术来构建更好的系统以支持\
  \ `KYC` 和 `AML`。这也关乎这些系统如何帮助企业为客户提供更好的服务。\n\n这就是第二个悖论出现的地方。在旧的中心化 `KYC` 和 `AML`\
  \ 系统中，客户向机构提供数据，随后由机构控制和管理这些数据。数据的安全完全由收集数据的实体负责。而在区块链上的系统中，数据不存储在孤岛式的数据库中，由特定公司或监管机构负责。相反，它存储在共享账本上，不归任何特定实体所有。数据由客户控制。然而，讽刺的是，虽然客户对其数据拥有更多控制权，但他们无法更改细节。数据只能通过由防篡改算法指导的流程来更改。\n\
  \n在探索区块链在管理 `KYC` 和 `AML` 方面的优势之前，让我们从头开始。`KYC` 和 `AML` 到底是什么？它们有多重要？\n\n#### 了解你的客户\n\
  \n`了解你的客户` 是一个识别并收集客户数据的过程，其中关键部分是理解资金在用户间流动的原因。其目的多方面。首先，它使公司或企业能够有效地服务客户。任何严肃的企业都会努力清晰地了解其客户以及如何更好地服务他们。通过识别和了解客户是谁，企业能更好地理解他们的需求，从而提供最合适的解决方案。\n\
  \n\n\n\n\n#### KYC 系统的重要性\n\n其次，企业建立 KYC 系统是为了满足法律法规的要求。这常被引为主要原因，也是唯一一个不能直接使企业受益的原因。尽管如此，对于某些类型的企业（主要是金融行业），要在大多数国家开展业务，就必须建立强有力的\
  \ KYC 系统。它是监管机构和执法部门依赖的机制的一部分，用于防止洗钱和恐怖融资等犯罪活动。有一段时间，加密货币相关业务无需遵守这些法律法规，因为它们是新的商业概念。然而，现在监管机构正在采取措施，将它们纳入必须遵守现有\
  \ KYC 规则的名单中。\n\n第三，KYC 有助于保护消费者免受他人有害活动的侵害。KYC 和 AML 通常都是防止腐败、贩毒和诈骗的障碍。这是因为从事这些活动的人明白，他们需要向金融机构解释其收益来源，进而向执法部门解释。恐怖融资活动也是如此。任何想资助暴力活动的人都明白，有人会审查甚至记录他们的交易。这些犯罪活动仍会发生，但无论如何，KYC\
  \ 和 AML 机制已到位，并将危害程度降至最低。虽然这一原因在一定程度上与前一个相似，但它确实使企业受益。例如，通过识别和审核遏制诈骗活动，企业为客户创造了安全的环境。这使其能够吸引更多客户。\n\
  \nKYC 的第四大重要性在于，它使服务提供商之间能够轻松互操作以提供服务。当一家服务提供商能轻松与另一家就特定客户进行沟通时，便于后者为该客户提供更好的服务。例如，在金融领域，客户与一家银行的互动可能对另一家银行决定如何为该客户服务至关重要。如果客户按约定时间表偿还抵押贷款，第二家银行可能会据此判定其信用良好。\n\
  \n最后，企业需要 KYC 系统来帮助服务提供商确定特定客户的风险等级。KYC 是金融机构发放信贷的支柱，也是产品定价和准入决策的基础。信用评分系统根据客户过往的还款努力和能力对其进行排名，帮助金融机构避免因违约贷款造成损失。借助区块链、大数据、AI\
  \ 和 IoT 等新技术，基于用户数据收集的新型借贷系统正在涌现。例如，在发展中世界（以及一些发达国家），手机已成为向个人和小微企业发放信贷的主要渠道。手机上的借贷平台利用从借款人设备使用情况及其他渠道收集的个人数据作为抵押。事实上，由于它们处理和分析数据的效率极高，不要求借款人填写任何文书工作，也不要求提供任何实物抵押。甚至首次申请只需几分钟即可获批。\n\
  \n#### 反洗钱 (AML)\n\n反洗钱 (AML) 是指为防止犯罪分子将非法所得资金隐秘地引入主流并“洗白”而采取的一切措施，包括法律、法规和流程。20\
  \ 世纪，世界各国政府将打击犯罪的范围扩大到增加花费犯罪所得的难度。金融机构依法必须确认流经其系统的资金来源，并向当局报告可疑交易。这些措施导致了洗钱的兴起，即从事毒品贩运或盗窃等非法活动的个人和实体，将其所得掩饰为合法真实业务的收益。这种恶行在许多情况下非常复杂，因此必须建立强有力的系统来应对。重要的是要指出，AML\
  \ 是 KYC 之后的环节。\n\n在技术的推动下，KYC 和 AML 系统已取得长足发展。特别是 ICT（信息通信技术）促进了信息流动。然而，这些系统仍面临未解决的挑战。\n\
  \n其中一个挑战是**高昂的成本**。根据 Thomson Reuters 2016 年发布的一份报告，金融领域的实体每年在 KYC 和 AML 合规相关活动上的支出在\
  \ 6000 万至 5 亿美元之间。考虑到其他行业，这是一笔相当大的成本。当然，最终这笔成本会转嫁给消费者，使部分人群的服务变得非常昂贵。它也侵蚀了服务提供商本可获得的利润。\n\
  \n尽管预算巨大，成功率却非常低。事实上，有报告指出，监管机构和金融机构每年仅能查获全球洗钱总量的约 1%——按任何标准衡量，这都是极低的成功率。疲软的表现主要归因于数据共享缓慢，以及过度依赖人们诚实地提供其活动的正确信息。\n\
  \n纸质或 ICT 系统中也可能出现错误，主要是因为它们严重依赖人工干预。当信息在金融机构与监管机构之间、金融机构之间或监管机构之间手动传递时，数据可能会丢失或被误传。\n\
  \n此外，信息共享通常不是实时的。由于安全依赖于访问控制的中心化系统的敏感性，信息通常按案例在不同利益相关者之间共享，这意味着许多非法交易可能在未被检测到的情况下通过系统。与缺乏数据共享密切相关的是，全球不同金融机构和监管机构之间互操作性差。没有信息共享，跨国洗钱活动更容易逃避检测。\n\
  \n另一个挑战是**活动和任务的重复**，这既发生在组织内部，也发生在供应链中。客户可能不得不在同一机构的不同阶段，或每次寻求服务时经历相同的验证流程，这不仅拖慢了服务交付，还增加了机构必须承担的成本。跨供应链时也同样适用。如果实体能协作共享数据，就能避免重复任务，从而降低整个供应链的成本。\n\
  \n中心化系统还导致服务交付缓慢。例如，在金融领域，大量交易必须经过“AML 观察期”，通常超过 5 个工作日。在此期间，资金须留在账户中，以便进行背景调查，确定资金是否为洗钱所得。这个\
  \ AML 观察期可能会严重延误业务交易。\n\n最后但同样重要的是，**缺乏透明度**使客户对公司和监管机构掌握的信息一无所知。他们也无法参与影响自身的决策过程。\n\
  \n区块链有望解决大多数这些挑战，并为客户提供更好的体验。\n\n\n\n\n\n### 区块链为 KYC 和 AML 系统提供了什么\n\n区块链带来的第一项变革是将数据控制权交还给消费者，同时向服务提供商保证数据准确且不可篡改。该系统通过去中心化、不可变性和密码学为数据提供了更好的安全性。当服务提供商从消费者处收集数据时，数据会被添加到一个由加密密钥管理的文件中。服务提供商通过公钥获得消费者授权的访问权，而相应的私钥由客户持有。为了归档这些数据，必须经过挖矿过程，由去中心化的点对点计算机网络将其记录在区块链上。这使得数据不可变，甚至连持有相应私钥（用于授权访问信息）的消费者也无法更改其中的任何细节。\n\
  \n客户在区块链系统中对数据的控制权包括决定服务提供商可以访问其数据多长时间。在某些情况下，用户可以选择将其数据出售给为研究或其他目的需要数据的人，这与目前用户很难对其数据如何被使用发表意见的情况截然不同。\n\
  \n区块链技术提供了建立可证明且安全身份的能力。一旦消费者在区块链上创建个人档案，包括服务提供商、监管机构以及与其有业务往来的第三方，都可以独立地为该档案和身份的构建做出贡献。这意味着，随着时间的推移，档案将变得非常详细和细致，这将使监管机构和服务提供商能够以很高的准确性确定他们正在打交道的人是谁，而无需浪费时间咨询第三方。\n\
  \n区块链为 KYC 和 AML 系统提供的另一项价值是增强客户隐私。之所以能做到这一点，是因为他们控制数据，特别是谁可以看到数据以及看到何种程度。数据不再保存在一个依赖并管理访问权限的数据库中，一旦该数据库被攻破，所有客户的所有数据都将暴露无遗。即使客户需要向服务提供商和监管机构证明自身身份，该技术也能为其提供隐私保护。\n\
  \n区块链还通过使用去中心化协议，为标准化 KYC 和 AML 流程及操作提供了手段和途径。目前，每家公司或监管机构都使用孤岛式系统，且往往很难让不同系统相互通信。区块链凭借其本质属性，使得各个相互独立的实体能够共享一个通用的、不可变的真相。\n\
  \n区块链还提供了一个机会，以降低管理 KYC 系统以及收集、处理和共享数据所涉及的高昂成本。通过智能合约应用，技术使大多数流程的自动化变得容易。此外，它将保护和保障数据的责任转移给个别客户，这使得公司和监管机构能够专注于其他关键职能，从而降低运营成本。\n\
  \n区块链提供的一个接近标准化的优势是改善不同系统之间的互操作性。这可以通过让不同实体安全地访问区块链上的同一数据库来验证身份和交易来实现。区块链结合其他技术，还可以加快交易审查的速度。例如，它可以将\
  \ AML 挂起时间从几天缩短到几分钟。这在一定程度上是因为大量数据可在共享账本上获得。外部来源也可以通过智能合约驱动的在线预言机进行查询。区块链上的智能合约应用可以自动化大部分程序和流程。\n\
  \n区块链为 KYC 和 AML 提供的另一项价值是透明度^(4)。鉴于数据位于共享账本上，每个利益相关者都可以访问它。特别是，消费者可以确切了解服务提供商用于做出关于其决策的具体信息。他们可以轻松判断信息是否准确，甚至有机会准确地回应特定疑虑。\n\
  \n区块链将允许利益相关者避免在其组织内部和跨供应链中重复执行任务。如果某个部门或公司已在特定领域完成了背景工作，其他部门或公司就无需再次进行。他们将能够专注于其他领域。\n\
  \n此外，区块链使某些法规和法律的实施变得更容易。例如，欧盟的《通用数据保护条例》（GDPR）强制要求客户必须同意其信息的使用。区块链通过私钥（数字签名）为消费者提供了\
  \ exactly 这一点，他们可以利用私钥授予访问权，甚至设定数据使用的条件。\n\n几家初创公司正在构建用于 KYC 和 AML 的区块链解决方案。其中之一是成立于\
  \ 2015 年的美国初创公司 Cambridge Blockchain。该公司已从包括 PayPal Ventures 和 Digital Currency\
  \ Group（拥有 CoinDesk 的投资集团）在内的重要实体筹集了约 1500 万美元的投资。它还与金融行业的主要参与者建立了合作伙伴关系。2018 年\
  \ 1 月，Cambridge Blockchain 宣布与 IHS Markit 的 kyc.com 达成合作伙伴关系，后者是一个 KYC 服务平台，其用户包括近二十家美国主要银行。\n\
  \n### 使用区块链面临的挑战\n\n目前，在 KYC 和 AML 系统中采用区块链存在一些挑战^(5)。首先，所有利益相关者必须就政策、程序和流程达成一致。每个企业都有适合自身的独特运作方式，这延伸到了其如何引入和管理客户。因此，让这些利益相关者就特定的一组协议达成一致可能并不稳妥（原文\
  \ \"might not be secure\"，此处语境下意指“不可靠/不稳妥”）。\n\n第二个挑战关乎确保数据的有效性，尤其是在初始采集阶段。请记住，一旦这些数据被记录在区块链上，它就变得不可变了。这至关重要，因为关于客户的单一错误条目可能会极大地影响他们及其业务。\n\
  \n严格的法律法规管辖着数据如何共享。即使某个实体拥有可帮助另一个实体简化运营的信息，由于现有的隐私法律法规不允许某些类型的数据跨平台流动，它可能无法共享。即使技术上已有私人数据保护措施，这种情况依然存在。\n\
  \n总之，虽然区块链赋予了个人在线交易的能力，使其无需暴露于国家监控和全球企业监控之下。然而，同一技术也提供了可用于改进执行 KYC 和 AML 程序及流程的系统的工具。\n\
  \n^(1) Wirdum, Aaron van. “Bitcoin as a Privacycoin: This Tech Is Making Bitcoin\
  \ More Private.” Bitcoin Magazine, 13 Mar. 2020, [bitcoinmagazine.com/articles/bitcoin-privacycoin-tech-making-bitcoin-more-private](http://bitcoinmagazine.com/articles/bitcoin-privacycoin-tech-making-bitcoin-more-private).\n\
  \n^(2) J. “AML Regulation and New Features Update.” The LocalBitcoins Blog, 25 Mar.\
  \ 2019, [localbitcoins.com/blog/aml-features-update/](http://localbitcoins.com/blog/aml-features-update/).\n\
