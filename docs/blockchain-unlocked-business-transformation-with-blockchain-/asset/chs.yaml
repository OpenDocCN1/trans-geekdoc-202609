  \n\n\n\n\n### The Second Impact of Blockchain on Public Administration: Changing\
  \ the Basic Premise of Government\n\nAfter discussing how blockchain can improve\
  \ existing government systems and processes, let us shift perspective and examine\
  \ the technology's second impact on public administration or governance: the possibility\
  \ of changing the basic premise of government.\n\nBlockchain can not only improve\
  \ government processes and systems but also has the potential to pioneer entirely\
  \ new forms of government. It may end representative government as we know it, replacing\
  \ it with a model where citizens have more direct participation rights, particularly\
  \ a say in day-to-day operations. After all, the basic premise of a legislature\
  \ is that not all citizens can gather to deliberate on issues affecting their lives.\
  \ In the past, this was indeed impossible because the logistical conditions to support\
  \ such assemblies were lacking. Therefore, we elect representatives from among ourselves\
  \ to represent us in government decisions.\n\nHowever, times have changed, and technology\
  \ continues to turn what seemed impossible a few years ago into reality. If you\
  \ had the chance to travel back to the early 20th century and tell people then that\
  \ video conferencing and similar functions would be realized in less than 100 years,\
  \ they would likely have thought you were describing magic, not reality.\n\nBlockchain\
  \ offers a new option to electing legislative and executive bodies and hoping they\
  \ do the right thing. It provides a mechanism for citizens, as a collective, to\
  \ assume responsibility for most day-to-day government functions and directly perform\
  \ at least a portion of them. This was unimaginable ten years ago. At first glance,\
  \ this may seem impractical or absurd, but after delving into blockchain's capabilities\
  \ and its already tested applications in governance structures, the concept of direct\
  \ government is not far-fetched.\n\n#### The DAO Model\n\nIn April 2016, German\
  \ blockchain startup Slock.it announced a new project called the \"Decentralized\
  \ Autonomous Organization\" (DAO). This was an investment organization with no leadership\
  \ structure or team of employees. Instead, the DAO was managed through a system\
  \ of smart contracts, or protocols, on the Ethereum blockchain. All decisions were\
  \ made by a consensus mechanism achieved through direct voting by members^(9). Simply\
  \ put, a DAO is a company with shareholders but no board of directors, CEO, or any\
  \ other employees.\n\nThis idea was highly attractive, exciting, and popular, raising\
  \ over $150 million during a 28-day funding period, with investors thereby becoming\
  \ shareholders. Through the smart contract protocol or system, shareholders would\
  \ vote on projects undertaken by the organization and hire service providers to\
  \ act on their behalf. Shareholders could propose plans and required budgets, then\
  \ persuade others to approve them through voting. Service providers could also pitch\
  \ business ideas to the DAO and attempt to convince shareholders they could deliver\
  \ results beneficial to the organization. Once members approved a project, the smart\
  \ contract would lock the required funds in an escrow account. The service provider\
  \ would then commence work; upon completion, the smart contract guiding execution\
  \ would release payment from the escrow account.\n\nHowever, the DAO was never fully\
  \ implemented. In June 2016, just two months after launch, a hacker discovered a\
  \ vulnerability in the code of its main smart contract and attempted to exploit\
  \ it to steal approximately $50 million from the DAO wallet. This triggered one\
  \ of the most significant hard forks in the crypto space. Since payments had to\
  \ be completed on the Ethereum blockchain, the community faced the choice of rolling\
  \ back transactions to deny the hacker access to the DAO funds. The community was\
  \ deeply divided: some supported rolling back transactions to stop the attacker\
  \ from obtaining funds, while others argued this would jeopardize the blockchain's\
  \ promise of immutability, and that $50 million was not a sufficient reason.\n\n\
  Unable to reach consensus, the Ethereum network was forced to split into two independent\
  \ blockchain networks. Those supporting the transaction rollback retained the name\
  \ Ethereum (ETH), while opponents adopted the new name Ethereum Classic (ETC). The\
  \ hacker eventually cashed out a portion of the funds in Ethereum Classic tokens.\
  \ Shortly after, the DAO shut down and returned funds to investors.\n\nNevertheless,\
  \ the DAO concept did not die; several subsequent projects have adopted this governance\
  \ model. One of the most successful projects is the DASH blockchain network, where\
  \ members select contributions they can make to the network and persuade the community\
  \ to fund them. If the community is satisfied, it approves the budget into an escrow\
  \ account, the proposer begins work, and funds are released as milestones are reached.\
  \ Another project adopting the DAO model is MakerDAO.\n\nSimilarly, a form of DAO\
  \ could replace government, making all citizens shareholders. Voting rights could\
  \ be obtained by paying taxes into a treasury wallet. Both contractors and citizens\
  \ could propose necessary public projects, which would be approved by citizen vote,\
  \ and contractors selected. The winning contractor's budget would be placed in an\
  \ escrow account, and payment would be made according to the smart contract guiding\
  \ project execution upon completion of work. Notably, review, discussion, and voting\
  \ can all be conducted via a portal or mobile app, allowing citizens to participate\
  \ anytime, anywhere.\n\nOf course, we cannot say we are ready to convert the entire\
  \ government into a DAO. But transforming partial functions is possible, and this\
  \ could improve service delivery, increase transparency, reduce corruption, and\
  \ enhance public participation.\n\n#### Challenges Facing the Use of Blockchain\n\
  \nNow, let us focus on the challenges blockchain technology must overcome before\
  \ government adoption, whether for improving existing processes and systems or creating\
  \ entirely new governance structures.\n\nThe fact that blockchain has value does\
  \ not mean it will be automatically accepted and used. Even with numerous advantages\
  \ in public service delivery, we may never witness its large-scale application due\
  \ to insurmountable challenges.\n\nThe primary challenge facing blockchain is compatibility\
  \ with existing laws. For most processes on the blockchain to be accepted, they\
  \ must be legally recognized. For example, agreements executed via smart contracts\
  \ are only legally binding if the law recognizes them; otherwise, courts can overturn\
  \ the execution results of smart contracts at any time. Therefore, laws must be\
  \ amended to fully unleash the potential of applications.\n\n\n\n\n第二个障碍来自现行治理体制受益者的抵制。政府是一个庞大的企业，拥有许多受益者。事实证明，从政府运作方式中获益最多的人，同时也掌握着变革的钥匙。例如，政客们以竞选公职、在立法、行政和司法机关中担任人民代表为生。要从代议制政府转变为直接政府，他们（政客）必须修改相关法律。然而，预计他们会阻挠任何威胁其地位的变革。\n\
  \n另一个挑战是缺乏足够大的专家库来协助设计、构建和实施政府区块链应用。自早期以来，这一直是一个重大挑战，尤其是大型私营企业也在组建区块链开发团队。\n\n区块链有巨大潜力改变政府的运作方式。我们为这一目的拥抱区块链的程度，取决于我们打破对政府固有认知的准备程度。这也取决于我们是否具备克服道路上可能出现的挑战的能力和决心。\n\
