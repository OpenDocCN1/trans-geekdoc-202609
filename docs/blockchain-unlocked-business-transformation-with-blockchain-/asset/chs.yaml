  \n| ![image](img/ch-12.jpg) || **用例 4：支付** |\n\n| --- | --- |\n\n区块链在支付领域的应用非常广泛，可分为三大主要类型：(1)\
  \ 客户对客户 (C2C) 支付解决方案，(2) 企业对企业 (B2B) 支付解决方案，(3) 两者的结合，可以是 B2C 甚至 C2B。既然最后一种类型在了解前两种后很容易理解，我们将在本章重点讨论前两种。\n\
  \n客户对客户 (C2C) 区块链支付解决方案可进一步细分为三种子类型：加密货币、代币和稳定币。然而，在关注它们之前，我们首先要了解是什么让区块链支付解决方案独具特色。\n\
  \n### 区块链为支付带来的优势\n\n在区块链出现之前，即使在互联网时代，除非发送方和接收方距离足够近、可以亲自交付现金，否则发送方想不通过中间人把钱交给接收方是不切实际的。中间人通常必须促成交易，并理所当然地收取一部分作为报酬（稍后详述成本问题）。在区块链上，即使发送方和接收方身处地球两端，也可以通过点对点路径或通道在技术上实现价值传输。此外，该技术还提供了多项优势。让我们讨论两个主要优势。\n\
  \n#### 在线支付交易的安全性提升\n\n首先，区块链为发送方和接收方之间的支付交易提供了更高的安全性。它通过使用公私钥加密技术以及交易所在账本的不可篡改性来实现这一点。这并不是说区块链上的价值不会被盗窃。这种情况已经发生过多次。每年都有价值数千万美元的加密货币从交易所和个人手中被盗。然而，该技术为保障支付交易提供了更好的工具。\n\
  \n#### 在线支付交易的隐私性增强\n\n其次，正如我们在前几章已经了解到的，该技术通过应用加密技术和伪匿名性，使在线支付交易更加私密。因此，虽然交易账本是公开的，但用户可以通过生成随机公共地址来代替真实姓名或身份证号码等个人身份信息，从而在区块链上隐藏身份。由于随机公共地址无需关联现实身份，任何人阅读共享公共账本都无法确切知晓每笔记录在案的支付交易参与方是谁。\n\
  \n此外，与其他选项相比，在区块链上执行的支付交易相对更快，尤其是大额转账。银行电汇可能需要长达一周时间才能将资金从世界一端转移到另一端。而在区块链上，无论金额大小、距离远近，只需几秒到几分钟即可完成。\n\
  \n尽管区块链上的支付交易安全、私密且快速，但与通过可信中心化第三方进行的支付相比，其成本相对较低。大多数区块链的商业模式不会给最终用户带来高额费用压力，尽管用户仍需为区块链支付支付费用。\n\
  \n例如，在比特币区块链上，你通常需要附加一笔费用以加快交易确认过程。所有比特币挖完后，用户支付的费用将成为矿工继续运行机器、维护共享账本的主要激励。因此，随着时间的推移，费用将成为交易被验证并记录在共享账本上的强制性要求。\n\
  \n然而，用户在比特币区块链上支付的任何费用均由协议决定，而非由以向股东创造更多利润为决策依据的私营企业决定。此外，正在开发不需要用户支付任何费用的新协议。例如，在\
  \ IOTA 区块链上，用户必须完成一些工作——即确认两笔之前的交易——以使其自己的交易获得批准^(1)。\n\n\n\n\n## 区块链支付解决方案\n\n\
  此外，借助区块链支付解决方案，可以将支付作为协议自动化结算的一个组成部分，通过智能合约使其变得切实可行。这意味着商业合同或任何形式协议中约定的付款可以实现自动化，并在预设条件满足时自动执行——无需第三方强制执行机构介入。\n\
  \n在传统系统中，必须由某人或某实体手动释放与合同挂钩的资金。这可能是合同的对手方，或是代表对手方行事的第三方（如银行）。而在区块链上，可以轻松地将资金编码进合同，让计算机协议处理一切，包括在需要的时候和地点释放付款。因此，区块链上的支付可以轻松写入智能合约。相关地，区块链上的支付可以支持不断增长的物联网环境中智能设备的交互。毕竟，我们正迈向一个智能设备需要使用区块链上的方法相互支付的未来。\n\
  \n区块链支持微支付也至关重要。无论付款方或收款方身处何地，你都可以使用区块链进行仅几美分的支付。这种微支付使得那些使用传统支付方式永远无法提供的服务成为可能。一个很好的例子是浏览器代表用户为其阅读的网站或博客上的每一篇文章自动付费。Brave\
  \ 浏览器已经在实施这一功能。作为用户，你可以向内置钱包充值基本注意力代币（BAT），然后浏览器会根据你在网站上花费的时间、阅读的文章数量或观看的视频数量，向你访问的网站发送少量代币^[2]。\n\
  \n同时，在物联网环境中，例如，智能手机可以在你全天在城市中移动时，为连接热点的互联网接入付费。使用传统支付方式实现此类用例几乎是不可能的，因为它们不支持微支付。即使支持，每笔交易的成本也可能高于支付金额本身。\n\
  \n### 区块链在支付方面的劣势\n\n现在，在了解了一些使区块链支付优于其他支付方式的因素后，理所应当地审视其劣势。\n\n也许区块链支付最显著的劣势之一是它们尚未大规模普及。如今，无论线上还是线下，能够使用基于区块链的支付方式结算账单的地方仍然寥寥无几。通常，如果你需要使用区块链上的支付方式进行购买，仍然必须先兑换成法定货币。在区块链上结算的大多数支付都与交易所和交易平台上的投机性交易有关。\n\
  \n另一个劣势是区块链上的支付方式在法律层面仍未得到明确界定。事实上，在哥伦比亚、厄瓜多尔和玻利维亚^[3]等国，企业接受区块链上的数字货币形式付款是非法的。在这三个南美国家，政府已采取明确的法律措施，禁止将比特币等加密货币作为国家发行法定货币的替代选项^[4]。\n\
  \n区块链上的大多数数字货币经历着高波动性。虽然这利于投机，但不利于货币作为商品和服务支付手段的功能。特别是，企业对接受比特币持谨慎态度，因为它们不想因市场上的货币价格波动而损失价值。在利润微薄的情况下，企业可能以不错的利润售出商品或服务，却在成交后仅几分钟内因价格变动而亏损。当企业必须将收入兑换成法币以支付供应商时，这种情况尤为关键。\n\
  \n大多数接受加密货币支付的企业都与 BitPay 等支付处理商合作，后者会立即将其收益兑换成法币，从而帮助它们避免因加密货币波动而损失价值。这在大多数情况下违背了接受加密货币的初衷，特别是考虑到支付处理商是收取费用的商业实体，因此会使交易成本略微增加。\n\
  \n满足现有需求的可扩展性是加密货币面临的主要挑战之一。例如，2017 年底和 2019 年初，随着比特币价格上涨，需求激增，导致需要在共享账本上确认的交易数量增加。一度等待时间长达\
  \ 16 小时。这给用户带来了不便，完全背离了比特币支付快速的理念^[5]。\n\n### 客户对客户（C2C）支付解决方案\n\n现在让我们看看在区块链上实现的特定\
  \ C2C 支付方式。正如本章开头所述，C2C 区块链支付应用主要分为三类。让我们逐一了解它们的工作原理及具体示例。\n\n#### 加密货币\n\n加密货币构成了区块链支付用例中最成熟的类别，也是所有类型应用中最成熟的。事实上，世界首先发现了加密货币（比特币），随后才了解其背后的区块链技术。\n\
  \n“加密货币”一词常用于描述在区块链上创建和管理的任何数字资产。然而，其更严格的含义可以指导我们判断什么符合加密货币的资格。或许有助于认识到，“cryptocurrency”（加密货币）一词由两个词组成：cryptography（密码学）和\
  \ currency（货币）。我们可以轻松推断，带有该复合词的事物必须是一种使用某种形式密码学的货币。换句话说，尽管加密货币是去中心化的，并将密码学作为其底层架构的一部分，但它们本应像法定货币一样发挥作用。它们本应是交换媒介、价值储存手段和记账单位。\n\
  \n很难准确说出有多少种加密货币，因为它们经常与其他区块链资产归为一类。更重要的是，加密货币与其他类型区块链资产之间的界限往往模糊不清。然而，根据其设计初衷，有几种显然属于加密货币。当然，比特币就是其中之一，因为它最初旨在成为电子现金。ZCash、莱特币和门罗币等也是你可以严格认为属于加密货币的例子。\n\
  \n虽然加密货币作为支付手段的使用尚未普及——即真正用于支付商品和服务，但在区块链上完成的交易数量一直在稳步增长。例如，2010 年，比特链每天处理约 30,000\
  \ 笔交易。撰写本书时，该数字约为 50 万笔。\n\n如前所述，比特币区块链特别是在扩容方面举步维艰。比特币和以太坊（按市值计算的第二大网络）的拥堵，促使社区寻求扩容解决方案。就比特币而言，其扩容之路绝非一帆风顺。对于采用何种方案的分歧导致比特币分裂成了多个独立网络，包括比特币、比特币现金和比特币黄金。\n\
  \n\n\n\n\n### 区块链支付基础设施与代币经济\n\n在撰写本书时，对于显著区块链扩容以支持更多支付解决方案的前景，普遍持乐观态度。就`Bitcoin`而言，我们正见证`Lightning\
  \ Network`协议的广泛采纳，许多人将其视为该网络的终极扩容方案。\n\n`Lightning Network`也适用于其他区块链（特别是`Litecoin`），它使得并非所有支付交易都需记录在区块链上，但所有交易均可由该技术保障安全。`Lightning\
  \ Network`允许两方或多方创建支付通道。这本质上是一个运行在区块链上的智能合约应用，使他们能随意收发资金。然而，在其完成的所有交易中，仅有两笔会被记录在区块链上：创建支付通道的那笔，以及关闭通道并结算所有参与者净余额的那笔。\n\
  \n但`Lightning Network`并非唯一被部署以增加`Bitcoin`区块链容量、支持更多支付交易的扩容方案。其他方案还包括`Sidechains`（侧链），一种允许不同区块链互操作的协议；以及`SegWit`（隔离见证），一种使在区块链上记录支付交易所需数据量减少的协议。对于`Ethereum`，则有`Raiden\
  \ Network`和`Plasma`第二层扩容方案，分别类似于`Lightning Network`和`Sidechains`。\n\n用于支付目的的区块链基础设施已随时间大幅改善。早期，发送和接收`Bitcoin`及其他加密货币要求你在桌面端安装核心应用。这非常繁琐，因为你还必须下载完整的区块链账本，`Bitcoin`的账本已增长至\
  \ 260GB 以上^(6)。其用户界面和用户体验也极差。\n\n随着时间的推移，开发者设计了轻钱包协议，允许智能手机上的应用与网络节点交互，并作为面向最终用户的区块链界面。轻量级钱包协议使无需将区块链下载到本地设备即可与之交互成为可能。如今，移动端和浏览器钱包已成为区块链支付的主流工具，仅有少数用户仍安装核心桌面钱包。移动钱包通常拥有优秀的用户界面，且便捷快速。\n\
  \n钱包的发展已超越软件应用范畴。你可以选择购买硬件钱包——专为持有加密资产和支付设计的设备。主流硬件钱包品牌包括`Trezor`、`Keepkey`和`Ledger`。也有公司制造具备区块链支付特定功能的智能手机。在\
  \ ICO 热潮中融资的初创公司`Sirin Labs`已着手制造`Finney`区块链智能手机。`Sirin Labs`于 2017 年 12 月筹集了约 1.57\
  \ 亿美元^(7)。\n\n确实，主流手机品牌也在设计兼容区块链的硬件。台湾消费电子公司`HTC`便是发布了内置区块链功能智能手机的厂商之一^(1)。智能手机行业领军品牌`Samsung`也采取措施，为用户和开发者在其设备上提供更多区块链功能，包括用于加密货币支付的内置钱包。\n\
  \n#### 代币\n\n从本质上讲，代币和加密货币的创建方式相同。二者的主要区别在于功能，即用途。加密货币用作普通货币购买商品和服务。代币则用于特定目的。例如，`Storj`代币仅可用于支付`Storj`网络（一个去中心化云存储平台）上的存储空间，而不能用于其他支付。`Ethereum\
  \ Gas`代币让你访问`Ethereum`虚拟机（`EVM`），在其中运行应用。`Storj`币和`Ethereum Gas`代表一类称为实用代币的代币。实用代币用于支付特定产品或服务，也用于提供对特定平台的访问权限。\n\
  \n另一类代币是证券型代币（我们在第 3 章中讨论过），其创建初衷是向投资者出售以筹集资金。大多数证券型代币最终也成为实用代币。例如，初创公司可出售代币融资，但这些代币最终在其内部系统或网络中发挥特定功能。具体而言，这些代币可用于支付服务、获取访问权限或其他形式的产品。\n\
  \n许多想要发行代币的初创公司会小心地将其包装为实用代币，因为全球监管机构正严厉打击为融资而出售的代币。普遍观点认为，任何出售此类代币的初创公司都应遵守发行资本股份的严格要求。正是对融资代币销售的打压，减缓了\
  \ 2017 年和 2018 年的 ICO 热潮。那两年间，初创公司累计融资超 300 亿美元。如`Telegram`便融资高达 15 亿美元。\n\n话虽如此，代币是区块链上潜在的支付方式，尤其是在特定网络和平台内。区块链上的代币可轻松取代传统忠诚度积分。更不用说，利用`Ethereum`区块链上的智能合约应用创建代币非常容易。你读完本书约十分钟内，就能在`Waves`区块链等平台上创建自己的代币。不过首先，你需要访问`Waves`平台下载并安装核心客户端到电脑。创建账户后，通过选择规格即可轻快地创建代币^(8)。\n\
  \n#### 稳定币\n\n最后，让我们看看稳定币，其诞生是为了应对区块链资产的剧烈波动。如今我们意识到，大多数加密货币的价格极其波动，尤其是对法币（如美元）时。若你持有大多数区块链资产，应做好准备：其价值可能在几分钟内大幅增减。稳定币是区块链上的数字资产，以\
  \ 1:1 的比例锚定更稳定的资产。\n\n顾名思义，这旨在使其波动性降低、稳定性增强，尤其是对法币时。\n\n目前市场上大多数稳定币锚定美元。稳定币为用户提供了加密货币的敏捷灵活性，以及美元的相对稳定性。它使全球价值转移变得容易，同时规避波动风险。稳定币已成为首选支付方式，尤其是在交易所，交易者需以美元高速买入加密货币或卖出换取美元。\n\
  \n\n\n\n稳定币的发行必须由一家公司或中心化实体负责，该实体承诺持有等同于已发行稳定币数量的美元（或其他资产）。这种结构的本质在于用户可以用支撑稳定币的资产来赎回稳定币。当然，使用中心化系统来支撑区块链上的代币会带来一些挑战，其中之一就是透明度和问责制。例如，2019\
  \ 年 4 月，最早发行的稳定币之一泰达币（Tether）面临指控，其审计报告反映出存在不当行为，且指称每枚代币并非真正由一美元支撑^(9)。同样令人担忧的是，该公司属于最大的加密货币交易所之一\
  \ Bitfinex，这造成了潜在的利益冲突。\n\n截至目前，稳定币的种类已增至十余种，其中最受欢迎的有泰达币（Tether）、USD Coin、TrueUSD、Paxos\
  \ Standard 和 Gemini Dollar。它们主要作为一种支付方式，供希望在交易所之间以及加密货币与美元之间快速转移美元价值的交易者使用，而无需损失关键时间。\n\
  \n在撰写本书时，尚不清楚稳定币是否会被采纳为商品和服务的支付手段。然而，某种形式的稳定币极有可能在未来获得大规模采用。\n\n我们还必须提及在区块链上发展起来的另一种支付服务——汇款服务。在全球范围内，大量资金以汇款形式，由发达国家的移民工人汇回第三世界国家的家庭和赡养亲属手中。根据世界银行数据，全球每年汇款总额接近\
  \ 6000 亿美元^(10)。\n\n对移民工人来说，汇款回国成本非常高昂。在某些情况下，费用高达涉及金额的 10%至 20%。这笔钱本可以改变菲律宾或许多非洲国家贫困家庭的命运。一些初创公司正利用区块链降低汇款处理成本，使汇款人和收款人有更多资金用于更迫切的需求。\n\
  \n多家初创公司和银行正利用区块链降低汇款成本。Union Bank 和 Rebit 就是菲律宾的例子，该国有大量公民在阿联酋、美国和欧洲等国家工作。\n\n\
  确实，海外工作的菲律宾人每年汇回国内的资金高达 350 亿美元。\n\n### 企业对企业（B2B）支付解决方案\n\n现在让我们把注意力转向正在区块链上设计的\
  \ B2B 支付解决方案。几十年来，公司和其他机构一直使用 SWIFT（环球同业银行金融电讯协会），这是银行用来协商清算银行间支付、将资金从全球一角转移到另一角的通讯系统。\n\
  \nSWIFT 系统高度依赖参与实体间的信任。它也非常缓慢，特别是因为交易的关键部分必须人工处理和批准。因此，资金从一个国家转移到另一个国家可能需要数天甚至数周。该系统可以被一个利用分布式账本技术（DLT）的更高效系统所取代。Ripple\
  \ 就是一个为此而设计的平台。它提供速度和效率，且成本更低。同时，通过 Hyperledger 和 R3 等联盟，银行正在探索构建类似的解决方案，以促进彼此之间的支付交易。\n\
  \n虽然区块链应用的重点已转移到其他用例，但支付领域仍蕴藏巨大潜力，我们在不久的将来很可能会看到更多创新。\n\n^(1) Popov, Sergei. “The\
  \ Tangle.” IOTA: The Next Generation of Distributed Ledger Technology, IOTA, Apr.\
  \ 2018, [www.iota.org/research/academic-papers](http://www.iota.org/research/academic-papers)。\n\
  \n^(2) Larson, Quincy. “The Brave Browser: How Much Money Can Your Website or YouTube\
