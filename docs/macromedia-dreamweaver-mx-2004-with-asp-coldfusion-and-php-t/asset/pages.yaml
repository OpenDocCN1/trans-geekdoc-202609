- pgno: 399
  md: 'You are familiar enough with building queries that a lot of this dialog should
    already be familiar to you (especially the Connection and Insert Into Table settings).
    Like the Recordset dialog, the Insert Record dialog builds a SQL query. But unlike
    the Recordset dialog, the query built here does not retrieve data, but rather
    inserts it.


    **NOTE** ColdFusion and PHP users will notice that their version of the Insert
    Record dialog looks slightly different than the one shown here, for ASP. However,
    the differences are mostly cosmetic, and all variations are noted in the text,
    where appropriate.


    ![](img/43fd0127a958864ab2d93e28efe683e7_399_0.png)


    Inserting data, as mentioned earlier, is a matching activity: One item of data
    from a form is matched to one field in the destination table. That matching is
    what the lower half of the dialog is all about. Each of the items should follow
    this syntax: (for ASP) item_x inserts into column "item_x" (Text) or (for ColdFusion
    and PHP) item_x Gets Value From ''FORM.item_x'' as ''Text''. One instance of item_x
    is the field from the form (on the left in ASP, and on the right in ColdFusion
    and PHP). The other is the column name in the table (on the right in ASP, and
    on the left in ColdFusion/PHP). The Text part refers to the variable type (e.g.,
    text, date, integer, etc.).


    In your dialog, all of the items on the left should match the items on the right,
    and they must be the same type. That is, if the database is expecting a number,
    then ASP or ColdFusion must insert a number; otherwise, ASP or ColdFusion will
    display an error message. In this case, the form names and the database field
    names match, but they don''t have to: you can name your form fields differently
    than your database'
  merge: -1
  img_proc: true
