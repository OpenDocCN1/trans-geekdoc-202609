  md: 'When you are finished, close tourprice.asp.


    ![](img/43fd0127a958864ab2d93e28efe683e7_213_0.png)


    # COLLECTING, PROCESSING, AND DISPLAYING THE DATA


    The stage is set, and now it is time to capture the data entered on the form and
    perform the price calculation based on the data the user entered. You are already
    familiar with collecting form data and displaying it on the page, so in this task
    you should focus on the calculation itself.


    +   1) Open tourprice_processor.asp. If necessary, switch to split view or code
    view.


    To perform the calculations, you need the data, which is available on the page
    specified in the form''s action attribute.


    The switch to code view is necessary for now, because you are about to do some
    hand-coding, and there is no way to do so in design view.


    +   2) ASP only: Position the insertion point at the top of the document, before
    the opening <!DOCTYPE...> tag, press Enter/Return twice, return to line 1, and
    type <%@LANGUAGE="VBSCRIPT" CODEPAGE="1252" %>.


    This line is necessary for two reasons. First, it tells the server that the scripting
    language used is VBScript. Remember, ASP can be coded using more than one language.
    The most common languages for ASP are VBScript and JScript, and with ASP.NET,
    you have even more options. ColdFusion users don''t have to worry about'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'this setting, because ColdFusion supports only ColdFusion Markup Language (CFML),
    so there is no possibility for confusion.


    The second attribute, CODEPAGE, specifies the page''s language. 1252 refers to
    English.


    +   3) ASP only: Position the insertion point in line 2 and press Enter/Return
    twice to add some more space. Beginning in line 3, type the following code:


    ```

    <%

    Dim numAdult, numChild, basePrice, tourPrice

    %>

    ```


    As you know from before, <% is used to mark up ASP code that the server needs
    to process. The extra space just above the closing %> is to leave room for additional
    script, which you''ll add in a moment.


    The second line may look a bit odd. In ASP, whenever you want to create a new
    variable, you must declare it. You declare new variables using Dim. Thus, the
    second line announces to the server that you are creating three new variables.
    These variables have not yet been assigned any values—you''ll give them values
    momentarily.


    > NOTE Some languages do not require you to declare variables before you set their
    values. Neither ColdFusion nor PHP require you to first declare variables, so
    these don''t have equivalents for the Dim line.


    By the end of this step, ASP users'' code window should appear as in the following
    screenshot. ColdFusion and PHP users, just to reiterate, haven''t done anything
    in this task yet, but that''s about to change.


    ![](img/43fd0127a958864ab2d93e28efe683e7_214_0.png)


    +   4) All users: Set three variables, numAdult, numChild, and basePrice, to the
    values entered in the numAdults, numChildren, and tourName form fields.


    In ASP, insert the following code beginning in the empty line after the Dim line:


    ```

    numAdult = Request.Form("numAdults")

    numChild = Request.Form("numChildren")

    basePrice = Request.Form("tourName")

    ```'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'In ColdFusion, enter the following code at the top of the document, before
    the opening <!DOCTYPE> tag:


    ```

    <cfset numAdult = form.numAdults>

    <cfset numChild = form.numChildren>

    <cfset basePrice = form.tourName>

    ```


    In PHP, enter the following code at the top of the document, before the opening
    <!DOCTYPE> line:


    ```

    $numAdult = $_POST[''numAdults''];

    $numChild = $_POST[''numChildren''];

    $basePrice = $_POST[''tourName''];

    ```


    You''ve seen Request.Form("fieldname"). form.fieldname, and $_POST[''fieldname'']
    in earlier lessons. This time, rather than simply printing them on the page, as
    you did before, you are storing those values inside new variables. The reason
    for this is that what needs to be printed on the page is the output of the calculation.
    By storing these values in descriptively named variables, the calculation is easier
    to code (and read).


    ColdFusion users might wonder why the form variables aren''t surrounded by pound
    signs (##) as they were in previous lessons. Pound signs are used only when ColdFusion
    is outputting a dynamic value to an external source, such as HTML. Without them,
    ColdFusion would print the variable name, rather than its value. But the pound
    signs are unnecessary here, because the action here is internal to ColdFusion—it
    is not outputting values anywhere.


    +   5) Set a fourth variable, tourPrice, to equal the output of the calculation
    itself.


    In ASP: insert the following code in the line below the basePrice line:


    ```

    tourPrice = (numAdult * basePrice) + (numChild * basePrice)

    ```


    In ColdFusion, insert the following code in the line below the basePrice line:


    ```

    <cfset tourPrice = (numAdult * basePrice) + (numChild * basePrice)>

    ```


    In PHP, insert the following code in the line below the basePrice line:


    ```

    $tourPrice = ($numAdult * $basePrice) + ($numChild * $basePrice);

    ```


    Assuming you survived seventh-grade math, you probably know what this line is
    doing. It is setting the value of tourPrice to equal the output of a simple calculation.
    The parentheses are used, as in arithmetic, to ensure that the calculations take
    place in the proper order.


    When this line of code is resolved on the server, tourPrice has the final calculated
    dollar amount as its value. With that in place, all we need to do is output it
    into the HTML code where the XXX placeholder is, and the user will see the information
    that they need.'
