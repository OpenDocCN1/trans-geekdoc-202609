- pgno: 130
  md: '+   6) To verify the successful installation of your server, open a browser
    and go to the following location:


    http://localhost/


    You should see a placeholder page, as follows.


    ![](img/43fd0127a958864ab2d93e28efe683e7_130_0.png)


    # INSTALLING PHP IN WINDOWS


    Installing PHP in Windows is slightly more complex than Apache, because the files
    don''t come with an installer. Instead, the files needed for the program come
    zipped. After you unzip them, you must manually move a few files to different
    locations.


    +   1) Go to http://www.php.net/downloads.php and download the latest stable (not
    beta) version of PHP, choosing the Windows binary version.


    At the time of this writing, the latest stable version is PHP 4.3.2. A beta is
    available for PHP 5, and it may be a stable release by the time you read this.
    Its release may also change some of the steps below. If you install PHP 5, check
    the book''s Web site (at http://www.allelectomedia.com) for errata and addenda.


    As long as you have PHP 4.2 or higher, the code in this book should work as described.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '2) Open the directory into which you downloaded the file, and unzip the file.
    Specify that the extracted files go to the C: drive.

    In my setup, PHP resides in C:\\php-4.3.2-Win32. You will need to refer to this
    location later, so make sure you remember where you put it!


    3) Open your PHP directory on the C: drive, find the file php.ini-dist, and move
    it into the c:\\windows (Windows XP) or c:\\winnt (Windows 2000) folder. Once
    it''s there, rename it php.ini.

    ''The php.ini file enables you to specify how PHP runs on your computer; that
    is, it is the primary configuration file for PHP.


    4) Returning to the PHP directory, find the file php4ts.dll and move it into the
    folder, c:\\windows\\system32.

    All the files are now in place. The next step is to tell Apache that PHP is there.


    5) Find the file httpd.conf on your computer, and open it in a text editor.

    In my configuration, it is in the following directory: C:\\Program Files\\Apache
    Group\\Apache2\\conf\\httpd.conf.

    Much as php.ini does for PHP, this file enables you to configure Apache. Most
    Windows programs use dialog boxes for this type of information, but open source
    programs, following the Unix way of doing things, typically have users interface
    with the applications via a text file.


    ![](img/43fd0127a958864ab2d93e28efe683e7_131_0.png)'
  merge: -1
  img_proc: true
- pgno: 132
  md: '6) Use the Find feature, or simply scroll until you see a number of lines that
    begin with LoadModule or #LoadModule.


    As the name suggests, LoadModule causes extensions, including PHP, to be activated
    on the Apache server.


    The hash mark (#) that precedes some lines signals a comment. That is, the interpreter
    ignores any lines preceded by a hash mark.


    ![](img/43fd0127a958864ab2d93e28efe683e7_132_0.png)


    7) Look through the LoadModule section for the following line of code. If it exists
    and is preceded with a # sign, remove that sign and verify that the version number
    is the same as the one you just installed. If the version is different, simply
    edit the file to correct the version number. If no such line exists, type it in
    at the end of the LoadModule block, exactly as you see below, substituting your
    version number, if it differs.


    ```

    LoadModule php4_module c:/php-4.3.2-Win32/sapi/php4apache2.dll

    ```


    At the end of this step, regardless of whether the LoadModule line for PHP was
    there initially, you should have the line printed above in your LoadModule section,
    and it should appear exactly as it is printed above, except for the version number,
    which may change.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# 8) Save and close the file httpd.conf.

    You''ll need to restart Apache for these changes to take effect.


    # 9) Open the Apache monitor by double-clicking its icon in the task bar. Click
    the Restart button.

    When you restart the server, you''ll see a confirmation message in the dialog.
    Also note in the lower-left corner of the monitor, it says something like Apache/2.0.46
    (Win32) PHP/4.3.2. This information confirms that PHP has been successfully loaded.


    ![](img/43fd0127a958864ab2d93e28efe683e7_133_0.png)


    # 10) Close the Apache monitor and skip ahead to the section, “Defining a Dynamic
    Site in Dreamweaver.”

    You have configured your local system to run PHP on Apache.


    # SETTING UP APACHE IN MAC OS X


    Apache comes preinstalled as the default on Mac OS X and higher, so there is literally
    nothing to install. You do, however, have to turn it on, because by default, the
    Apache Web service is stopped.


    # 1) Open System Preferences and click the Sharing folder.

    The sharing folder is used to control file sharing, Web services, FTP access,
    printer sharing, and firewalls, among other features.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '![](img/43fd0127a958864ab2d93e28efe683e7_134_0.png)


    2) In the Services tab of the Sharing folder, check the Personal Web Sharing option.
    Checking this box starts Apache. That''s it!


    > **NOTE** The version of Apache that ships with Mac OS X is 1.3.x. At the time
    of this writing, the current version is 2.0.x. Version 1.3 works fine for the
    purposes of this book. If you want the latest version of Apache, go to http://www.apache.org
    and follow the instructions there for the latest install.


    > **NOTE** Macintosh has a useful site for configuring the Mac for Web development:
    http://developer.apple.com/internet/macosx/intro.html.


    ![](img/43fd0127a958864ab2d93e28efe683e7_134_1.png)'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# # SETTING UP PHP IN MAC OS X


    Like Apache itself, PHP comes preinstalled in Mac OS X, so you don’t need to install
    it. Also like Apache, the version of PHP that ships with Mac OS X (PHP 4.12) is
    not current. You can download and install the latest and greatest version of PHP
    (to do so, see the Apple developer site, mentioned in the preceding Note). That
    requires some extra work, and it is sufficient for the purposes of this book to
    use the shipping version. In the remaining chapters, only one line of code won’t
    work in this version, and it has an easy workaround that I’ll point out when the
    time comes.


    To use PHP on Mac OS X, you need to turn it on. In contrast to turning on the
    Apache Web server, you can’t just click a checkbox, though; you need to type some
    code in the Apache Web server’s configuration file, httpd.conf.


    > **NOTE** _To develop for the Web on the Mac platform requires more than a passing
    familiarity with the Macintosh implementation of Unix, called Darwin, including
    using the Terminal window, navigating directories, using the permission system
    and the root user, as well as editing text in common Unix text editors, such as
    pico. The directions in this section assume you are competent working in the command
    line Unix interface. If this is new to you, I highly recommend Unix For Mac OS
    X: Visual QuickPro Guide (Peachpit), which is my personal favorite book on OS
    X._


    +   1) In the Terminal window, open the file httpd.conf in a text editor. Typically,
    this file can be found in the following location /etc/httpd/httpd.conf.


    +   2) Search or simply scroll until you see a number of lines that begin with
    LoadModule or #LoadModule. As the name suggests, LoadModule causes extensions,
    including PHP, to be activated on the Apache server.


    ‘The hash mark (#) that precedes some lines signals a comment. That is, the interpreter
    ignores any lines preceded by a hash mark.


    +   3) Look through the LoadModule section for the following line of code. If
    it exists and is preceded with a # sign, remove that sign. If no such line exists,
    type it in at the end of the LoadModule block, exactly as you see below.


    ```

    LoadModule php4_module libexec/httpd/libphp4.so

    ```


    ‘This is one of two lines in httpd.conf that activates PHP in Apache.'
  merge: -1
  img_proc: true
- pgno: 136
  md: "![](img/43fd0127a958864ab2d93e28efe683e7_136_0.png)\n\n+   4) Shortly after\
    \ the block of LoadModule lines, you'll see a block of lines that all begin AddModule\
    \ or #AddModule. The following line of code needs to appear in that block. It\
    \ may already be there, commented; if so, remove the comment (#) preceding it.\
    \ If the line of code is not there at all, then type it at the end of the AddModule\
    \ block.\n+   \n+   AddModule mod_php4.c\n\nBetween this and the LoadModule line\
    \ entered in the previous step, we have given Apache enough information to activate\
    \ PHP.\n\n![](img/43fd0127a958864ab2d93e28efe683e7_136_1.png)"
  merge: -1
  img_proc: true
- pgno: 137
  md: '5) Search or scroll much later in the file, until you see a group of AddType
    statements. The AddType group is a little harder to spot, but you can find it
    by searching for the comment that precedes it, shown in the following screenshot.


    ![](img/43fd0127a958864ab2d93e28efe683e7_137_0.png)


    6) Verify that the following two lines of code appear in this AddType group, and
    that they are not commented. If they are not there initially, type them in yourself.


    ```

    AddType application/x-httpd-php .php

    AddType application/x-httpd-php-source .phps

    ```


    These two lines tell Apache to treat all files ending with the .php extension
    as PHP files, and likewise to treat all .phps files as PHP source files. PHP source
    files actually display the PHP code in the HTML document, complete with code coloring,
    rather than interpreting and outputting them. This option is useful for debugging.


    7) Save and close httpd.conf.

    You have now configured Apache to work with PHP. Before you can use it, though,
    you must restart Apache.


    8) To restart Apache, return to the Services tab of the System Preferences, select
    Personal Web Sharing from the list at left, click the Stop button, and then click
    it again once it becomes the Start button.'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'Your system is now configured to process and serve PHP files.


    ![](img/43fd0127a958864ab2d93e28efe683e7_138_0.png)


    # DEVELOPING WITH A REMOTE SERVER


    The local server configuration is not for everyone. Macintosh users obviously
    have no access to IIS or ColdFusion. Further, many Windows and Macintosh users
    are not permitted to install and run Web servers. Even behind a university firewall,
    I am not allowed to run IIS on my XP machine. The reason for this is security.
    Web servers need regular maintenance to deal with the viruses and security holes
    that make corporate or university networks vulnerable. To prevent, or at least
    minimize, the chance of infiltrators circumventing an overall security system,
    administrators often forbid users from installing Web servers on their own machines.


    Obviously, if you don''t have access to a local server, you''ll need to find access
    to some other development server. This may be a dedicated development server (which
    is what I use at the university), or it may be a nonpublic folder inside your
    public Web server. You can access the server over a network, if you have a network
    connection to the server, or by using FTP. Either way, you will need to get the
    network path or FTP specifics from the server administrator before you can continue
    and define your site in Dreamweaver. The server needs to be IIS (for ASP development),
    have ColdFusion MX installed (for ColdFusion development), or have Apache or IIS
    installed with the PHP module loaded (for PHP development).'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'In addition to an account, and permission to add and remove files and folders
    within that account, you''ll also need one of the following pieces of information
    from the site administrator:


    +   - The path to the folder on the network, which could look like one of the
    following:

    +     \\webdev.bigcompany.com\your_site\

    +     \\serverName\your_site\


    > **NOTE** If you have network access to a server, you should map a network drive
    to your account on that server.


    +   - The FTP information to access the site, including the Host Name/Address,
    which is usually an IP address (and looks something like 123.12.123.12) and a
    username/password combination to access your account on that server.


    The preceding information is enough to give you access to upload your content
    to those folders. But you will also need some way to browse the content. Specifically,
    you need a URL to access your content on the server. Typically, the URL will look
    something like `http://webdev.bigcompany.com/your_site/` or `http://serverName/your_site/`.
    When you migrate your site into production, the production URL (in this example)
    would be `http://www.bigcompany.com/your_site/`. The important thing to look for
    is a complete URL that includes `http://`. Only your server administrator can
    give you this information.


    # DEFINING A DYNAMIC SITE IN DREAMWEAVER (ALL USERS)


    Regardless of which section above applied to you, use the following steps to define
    your site in Dreamweaver. Before you begin, you must have access to a fully configured
    Web server, with the desired application server/module loaded and running.


    +   1) With the Newland site open in Dreamweaver, choose Site > Manage Sites.
    In the Manage Sites dialog, make sure Newland Tours is selected, and click Edit.

    +   Remember, the Newland Tours site is already defined. You don''t need to start
    from scratch. You just need to add the remote and testing server information to
    the existing site.


    +   2) In the Site Definition for Newland Tours dialog, click the Advanced tab.
    Then, select the Remote Info category from the Category list on the left side.
    From the Access drop-down menu, make a selection and enter the appropriate information
    in the fields that appear, using the guidelines below.'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'If you are developing on a computer with a local version of IIS installed (ASP
    or ColdFusion via IIS), choose Local/Network from the Access drop-down menu. Next
    to the Remote Folder field, click the browse button, and browse to the C:\Inetpub\wwwroot\
    folder. Click the Add New Folder button to create a new folder, called newland.
    Double-click this folder to select it as the Remote folder.


    > The Inetpub\wwwroot folder is IIS'' root Web folder on your system. When you
    browse to your site (http://[localhost]/), you will be served pages from this
    folder.


    ![](img/43fd0127a958864ab2d93e28efe683e7_140_0.png)


    If you are developing on a computer with a local version of the standalone ColdFusion
    Web server, choose Local/Network in the Access drop-down menu. Next to the Remote
    Folder field, click the browse button, and browse to the C:\CFusionMX\wwwroot\
    folder. Click the Add New Folder button to create a new folder, called newland.
    Double-click this folder to select it as the Remote folder.


    > The CFusionMX\wwwroot folder is the standalone ColdFusion server''s root folder
    on your system. When you browse to your site (http://localhost:8500/), you will
    be served pages from this folder.


    If you are developing on a computer with a local version of Apache running, choose
    Local/Network in the Access drop-down menu. Next to the Remote Folder field,'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'click the browse button, and browse to the C:\Program Files\Apache Group\Apache2\htdocs
    folder (Windows) or to HD:Library:WebServer:Documents folder (Macintosh). Click
    the Add New Folder button (Windows) or New Folder button (Macintosh) to create
    a new folder, called newland. Double-click this folder to select it as the Remote
    folder.


    NOTE The Program Files\Apache Group\Apache2\htdocs folder is Apache''s root folder
    on Windows. The HD:Library:WebServer:Documents folder is Apache''s root folder
    on Macintosh. When you browse to your site (http://localhost), you will be served
    pages from this folder.


    If you are developing on a computer that has a network connection to the server,
    choose Local/Network in the Access drop-down, and browse to your folder on the
    server. Most likely, this appears in a mapped network drive. Use the Choose Remote
    Folder dialog to add a new folder called newland, and select that as the Remote
    folder.


    If you are developing on a computer that has FTP access to the server, first make
    sure that there is a folder in your account called newland. Then, in Dreamweaver''s
    Site Definition dialog, select FTP from the Access menu, and type the IP or Web
    address in the FTP Host field. Enter the path to the newland folder in the Host
    Directory field. Then fill in the Login and Password fields. When you have done
    all this, click the Test button to make sure you have configured it all correctly.


    +   3) From the Category list at left, select Testing Server. From the Server
    Model menu, select ASP VBScript, ColdFusion, or PHP MySQL, depending on which
    server model you have decided to use. In the Access menu, and also any options
    that appear beneath it, enter the same information you used in the previous step.


    NOTE Do not choose ASP JavaScript. Though the server model works fine in general,
    it is incompatible with most of the code you will use in this particular book.


    For the Newland Tours site, the Remote site and the Testing Server site are essentially
    the same. The difference is that the Remote site exists to enable Dreamweaver
    to save files to the correct folder, while the Testing Server enables Dreamweaver
    to test files after they have been processed on the server, so you can verify
    that they actually work.


    +   4) In the URL Prefix field near the bottom of the Testing Server category
    tab, enter the site''s URL.

    +   If you are using IIS locally on your computer (all ASP and some ColdFusion
    users), enter http://localhost/newland/.'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'If you are running ColdFusion locally as a standalone server without IIS, enter
    http://localhost:8500/newland/.


    If you are running Apache locally in Windows or on a Macintosh, enter http://localhost/newland/.


    ![](img/43fd0127a958864ab2d93e28efe683e7_142_0.png)


    NOTE As indicated earlier, the word localhost is a shortcut that activates the
    Web server on your computer, and tells it to look in the server''s root folder
    (the wwwroot folder for IIS and the standalone ColdFusion Web server, or htdocs
    on Apache), in which you created a newland folder in a previous step.


    If you are using a remote server, whether through a network or through FTP, enter
    the server''s URL, which the site administrator should have given you. It probably
    looks something like http://www.bigcompany.com/newland/.


    Either way, the URL prefix must begin with http:// and should not have any drive
    letters (such as h:) anywhere in it. Also note that the slashes in the URL are
    forward slashes, not backslashes.


    TIP If the site doesn''t display properly later in the lesson, the URL prefix
    is the first place you should look when troubleshooting. If this information is
    wrong, you will not be able to browse your site and see it in action, even if
    all your code is correct and your server and server models are correctly configured
    and running.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '5) Click OK to save and close the dialog, and then click Done to close the
    Edit Sites dialog.


    The site is now redefined and should be ready for dynamic development.


    6) One at a time, right-click (Windows) or Control-click (Macintosh) each of the
    HTML files in the Site panel, choose Edit > Rename, and change the extension from
    .htm to .asp, .cfm, or .php as appropriate. Whenever the Update Files dialog appears,
    click Update.


    Changing the extension is required when you upgrade to dynamic sites, because
    the server uses the extension to determine whether to process any special code
    on the page.


    ![](img/43fd0127a958864ab2d93e28efe683e7_143_0.png)


    When you change the extension, all of the links that point to that page are broken.
    Dreamweaver''s site manager catches this and fixes the problem when you choose
    Update.


    ![](img/43fd0127a958864ab2d93e28efe683e7_143_1.png)


    7) Click once on the top-level folder, and click the Put File(s) button.


    This uploads the entire site to the remote folder and testing server.


    **NOTE** If a dialog appears asking whether you want to Put the entire site, click
    OK.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '![](img/43fd0127a958864ab2d93e28efe683e7_144_0.png)


    PUT FILE(S) BUTTON


    +   8) Click once to select index.asp, index.cfm, or index.php in the Site panel,
    and press F12.


    Pressing F12 tests the site as it runs through the server. This test results in
    either good news or bad news. If you can see the Newland Tours index page, then
    you have correctly configured the site, and you are ready to start developing.
    If you get an error message or the site doesn''t display properly, then something
    has gone amiss. To troubleshoot, take a second look at the URL prefix. Also, use
    Windows Explorer or Macintosh Finder to make sure that the files really were uploaded
    to the remote site. If you are still hung up, talk to your site administrator,
    who should be able to help you resolve this problem.


    # SITE URL DISPLAYS IN ADDRESS BAR


    ![](img/43fd0127a958864ab2d93e28efe683e7_144_1.png)'
  merge: -1
