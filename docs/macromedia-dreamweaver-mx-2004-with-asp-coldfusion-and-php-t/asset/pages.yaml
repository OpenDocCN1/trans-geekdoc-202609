- pgno: 247
  md: 'mysqld_safe & is the command used to start up the MySQL daemon and keep it
    running in the background. If this command doesn''t work, try typing ./bin/mysqld_safe
    & instead. If it still doesn''t work, type cd bin/ to enter the bin directory,
    and type mysqld_safe & or ./mysqld_safe &.


    As long as you are logged in, MySQL will run and will be available. As soon as
