- pgno: 212
  md: 'field, that information is the field''s value. Thus, the firstName text field
    you created in previous lessons carried whatever value the user entered into it
    on the second page—the one that collects and displays the form data.


    Menus work a bit differently than forms. Like text fields, they''re given names,
    and the data associated with them is stored with that name. Thus, on the page
    that processes this form, Request.Form("tourName") (ASP), #form.tourName# (ColdFusion),
    or $_POST[''tourName''] (PHP) would retrieve this data.


    But the similarity ends there. Drop-down menus are not as open-ended as text fields.
    With drop-down menus, users select from a finite number of options that the developer
    specifies. The options that the user chooses from are entered in the Item Label
    column of the List Values dialog. The Value column of the List Values dialog is
    the data value that is sent with the form. Thus, if a user chooses Egyptian Pyramids
    and More, then Request.Form("tourName") (ASP), #form.tourName# (ColdFusion), or
    $_POST[''tourName''] (PHP) would retrieve 900. You''ll use that value shortly
    when you perform the actual calculation.


    The item label does not get submitted with the form to the next page. It remains
    in the form itself to enable the user to make a selection. The reason that the
    item label and values are separate is so that you can submit a value other than
    the label to the script. Since you are performing mathematical calculations, you
    need a numeric data value, rather than a text string.


    Clearly, Newland Tours offers more than three tours. Entering them one by one
    would be tedious, to say the least. Worse, if you wanted to add or remove a tour,
    you''d have to revisit the List Values dialog to fix it. There is a better way:
    You can dynamically load the labels and their values from a database to automatically
    generate this menu on the fly. You''ll see how to do that in Lesson 9. But for
    now, you''ll hard-code these values just to build the core functionality.


    Another problem with the current form might have occurred to you. Right now, if
    a user selects Egyptian Pyramids and More, only the value 900 is sent. You can
    multiply that by the number of adults or children, but there is no way to send
    separate values for each. The whole point of the application is to provide an
    estimate that reflects the values of both the price for adults and for children.
    You''ll fix this problem as well in Lesson 9, by retrieving both figures from
    a database.


    +   6) Save tourprice.asp, and press F12 to test it in a browser.


    The form is complete and ready to use. Before moving onto the server-side code,
    however, you should test it in a browser to verify that it looks as expected.
    You can press Submit if you like, and tourprice_processor.asp should appear, but
    it won''t look any different than before.'
