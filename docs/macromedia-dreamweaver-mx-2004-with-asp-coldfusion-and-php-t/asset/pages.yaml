- pgno: 380
  md: 'Most countries have only one tour, so you should see that tour listed when
    you choose a country. If you choose a country with multiple tours (France, Japan,
    United Kingdom, United States), you should see all of its tours.


    ![](img/43fd0127a958864ab2d93e28efe683e7_380_0.png)


    If you choose Taiwan, you''ll see a blank page. The reason for this is that while
    Taiwan exists in tbl_country, it has no tours associated with it. In an ideal
    world, this discrepancy would never happen. However, it is possible that a tour
    to Taiwan is in the works. The person responsible for creating the country profile
    has already inserted this information into the database, but the tour description
    has not yet been finalized. In many databases, including Microsoft Access but
    not MySQL, you can account for this situation by retrieving only those countries
    that have tours associated with them in the query that populates the menu in tours.asp.'
