- pgno: 467
  md: 'Let''s look at the code for a moment. ColdFusion users have it fairly easy:
    They use the <cfquery> tag, give their query a name (rs_regions) and specify the
    data source (newland). ColdFusion figures out the rest.


    ASP requires a bit more legwork. The word Dim is used to declare a new variable.
    Two are created here: dbConn and rs_regions. The variable dbConn will be used
    to create the database connection itself, and rs_regions will be used to hold
    the recordset. Both of these names are arbitrary, and you can call them whatever
    you want. The line after the Dim lines, which begins set dbConn =, tells ASP to
    create a new database connection object, whose name is dbConn. The next line then
    instructs ASP to actually open that connection to the DSN named "newland."


    **NOTE** ASP and PHP users might wonder why they enter (respectively) "newland"
    and "newland_tours" rather than "conn_newland" as they have throughout the book.
    In the case of ASP, the reason is that "newland" is the DSN name that exists on
    the server and points to the Newland Tours database. In the case of PHP, newland_tours
    is the name of the database on the MySQL server. For both ASP and PHP, conn_newland,
    in contrast, is a connection created in Dreamweaver that uses the newland DSN
    (ASP) or newland_tours database (PHP) but is separate from it. Since you are coding
    by hand, and not going through Dreamweaver server behaviors, you specify the DSN
    (ASP) or the MySQL server newland_tours database directly.


    Part of the ASP framework is a group of ready-made objects designed to handle
    common tasks. ASP has many such objects, and you have made extensive use of them
    through the book (though you may not have realized it). These include the Request,
    Response, Session, and Application objects, among others. The Connection and Recordset
    objects are a part of ActiveX Data Objects, or ADO. The topic of object-oriented
    programming, or OOP, is beyond the scope of this book, but suffice it to say for
    now that you can reliably use the code developed in this lesson as a template
    for connecting to a database.


    The PHP code, although the most verbose in the group, is fairly easy to read.
    The built-in mysql_connect() function is used to help PHP find the MySQL server.
    As the code indicates, it takes three parameters: the host, username, and password
    of the account you want to access. This username and password combination is the
    same pairing that you entered in the MySQL Connection dialog earlier in the book.
    Be sure to enter it in the code, where you see [enter your username] and [enter
    your password] in this step''s code listing. Once PHP can find the MySQL server,
    it needs to find the database itself. To do that, you use the built-in mysql_select_db()
    function, whose sole parameter is the name of the database on the MySQL server.'
  merge: -1
  img_proc: true
- pgno: 468
  md: '4) Add the code necessary to retrieve the desired records in the blank line
    you left in the preceding step.


    # In ASP:


    ```

    Set rs_regions = dbConn.Execute("SELECT * FROM tbl_region ORDER BY regionName")

    ```


    # In ColdFusion:


    ```

    SELECT * FROM tbl_region ORDER BY regionName

    ```


    # In PHP:


    ```

    $query_rs_regions = "SELECT * FROM tbl_region ORDER BY regionName";

    $rs_regions = mysql_query($query_rs_regions);

    $row_rs_regions = mysql_fetch_assoc($rs_regions);

    ```


    This particular SQL should pose no challenge to you by this point in the book.
    It retrieves all of the fields in all of the records in tbl_region, and orders
    them alphabetically by the name of the region.


    Again, the ASP and PHP might be somewhat confusing. I''ll start with the ASP.
    Remember, dbConn is the connection object, not the recordset. This line of code
    creates the recordset by creating a recordset object whose contents are equal
    to whatever is retrieved from the query executed through the connection.


    ![](img/43fd0127a958864ab2d93e28efe683e7_468_0.png)'
  merge: -1
  img_proc: true
- pgno: 469
  md: 'The first two lines of the PHP code query the database, as you probably guessed.
    And you probably also guessed that the results of the query would be a recordset
    stored in the $rs_regions variable. But there you would be wrong. When querying
    a MySQL database in PHP using mysql_query(), the result is not the recordset,
    but rather a number, which points to the data. The data itself is not returned.
    Instead, it sits in a limbo area that is neither PHP nor MySQL. Now, to get this
    data out of that area, you must “fetch” it, using mysql_fetch_assoc() (or one
    of its variants). This function retrieves the data from limbo and constructs an
    array to contain it. That array, in this block, is named $row_rs_regions. Once
    the data is in the $row_rs_regions array, it acts much like a recordset in ASP
    or ColdFusion—to access it, you reference $row_rs_regions.


    This code is sufficient to create the recordset and make the data available to
    the page. If you look in the Bindings panel, you won’t see this recordset listed.
    Dreamweaver doesn’t realize it’s there. Unfortunately, this also means that you
    won’t be able to bind the recordset to the form object. You’ll have to code it
    manually.


    +   5) Still in code view, scroll down until you see the form. Just a few lines
    below it, inside the table, look for the <select> element, which is the menu.
    Press Enter or Return a few times to make some space between opening and closing
    tags.


    The <select> tag creates the menu itself. To populate the menu, you use the <option>
    tag. Each option tag results in one more option in the menu. It uses the following
    syntax:


    ```

    <option value="data">Label</option>

    ```


    In this example, Label is what appears in the menu that humans can read, while
    data is the value that is submitted with the form. We need to bind regionName
    to the label and regionID to the value attribute.


    ![](img/43fd0127a958864ab2d93e28efe683e7_469_0.png)'
  merge: -1
  img_proc: true
- pgno: 470
  md: '# 6) In the empty space between the `<select>` tags, type the code needed to
    bind database data to the `<option>` tag.


    In ASP:


    ```

    ```

    <%

    Response.Write("<option value="" & rs_regions("regionID") & "">" &

    =>rs_regions("regionName") & "</option>")

    %>

    ```

    ```


    In ColdFusion:


    ```

    ```

    <cfoutput>

    <option value="#rs_regions.regionID#">#rs_regions.regionName#</option>

    </cfoutput>

    ```

    ```


    In PHP:


    ```

    ```

    <?php

    echo "<option value="\" .$row_rs_regions[''regionID'']. "\">" .$row_rs_regions

    =>[''regionName'']."</option>";

    ?>

    ```

    ```


    ![](img/43fd0127a958864ab2d93e28efe683e7_470_0.png)


    You''ve bound regionID to the value attribute, and regionName appears as the label
    in the menu.


    The ASP and PHP code blocks, as usual, need additional explanation. As you know
    from before, Response.Write() and echo are the ways ASP and PHP respectively output
    text to the browser. In this line, you are telling the server to output a line
    of HTML for the <option> tag. When you want ASP or PHP to output a string of text,
    you enclose that string in quotation marks. The complication is, you don''t want
    ASP to literally write into the browser <option value="" rs_regions("regionID")">rs_regions
    ("regionName")</option> (or the equivalent for PHP). You want ASP to evaluate
    rs_regions("regionID") and rs_regions("regionName"), and you want PHP to evaluate
    $row_rs_regions[''regionID''] and $row_rs_regions[''regionName'']. Once these
    have been evaluated, you want ASP and PHP to write their results ("6" and "Africa,"
    respectively) into the browser. But if you leave that portion of the script inside
    quotes, ASP or PHP would simply write, rather than evaluate and output, the code.'
  merge: -1
  img_proc: true
- pgno: 471
  md: 'To get around this problem, you use a technique called concatenation, which
    refers to the building of strings out of different pieces. Here, the pieces are
    string literals, such as "option value=" and expressions, such as rs_regions("regionID")
    and $row_rs_regions[''regionID'']. You glue these pieces together with the ampersand
    (&) character in ASP and the period character (.) in PHP. ASP/PHP then knows to
    evaluate the expressions and then glue them into the string. ColdFusion uses the
    pound signs (#) to distinguish between string literals and expressions, eliminating
    the need to concatenate elements. So the final output to the browser of this code,
    whether you use ASP, ColdFusion, or PHP is <option value="6">Africa</option>.


    ASP and PHP have another complication: Quotation marks are used in two different
    ways in this block of code. Like most programming languages, ASP and PHP use quotes
    to distinguish between strings and expressions. Everything inside of the quotes
    ASP and PHP ignore and output as-is. Unfortunately, the string that ASP and PHP
    need to output contains quotation marks: The proper syntax for the HTML attribute
    ASP and PHP need to output is <option value="XYZ">. In the final output of this
    code, the number output by rs_regions("regionID") and $row_rs_regions[''regionID'']
    should appear in quotes, as in, <option value="6">. ASP and PHP get confused when
    they see the quotation marks used in the value attribute, and think that you are
    marking the end of the string, which in fact you are not. To solve this problem,
    when you want to tell ASP and PHP to write quotation marks, rather than interpret
    them, you insert two sets of quotation marks (ASP) or precede the quotation marks
    with a backslash (\) (PHP). Thus, in the ASP code you just entered, "<option value="""
    &, where you see three quotation marks in a row, the first two indicate the quotation
    marks that ASP should write into the HTML, and the third indicates the end of
    the string. Likewise in the PHP code you just entered, "<option value="\", the
    \ tell PHP to output one pair of quotes, while the next set of quotes (immediately
    preceding the period) indicated to PHP the end of the string.


    Save, upload, and test the file, and look at the menu. You''ll see right away
    that Africa has loaded, and it is alphabetically the first region in the database
    table. That''s good. But we''ve got a problem. Africa is the only option in the
    menu! You need to cause ASP, ColdFusion, or PHP to create a new <option> tag for
    each record in the database. This calls for a programming structure known as a
    loop. In a loop, the same block of code is executed over and over until a condition
    is met. In this case, we need to create a loop that will output the <option> line
    over and over until it runs out of records.'
  merge: -1
  img_proc: true
- pgno: 472
  md: "![](img/43fd0127a958864ab2d93e28efe683e7_472_0.png)\n\n# 7) Amend the block\
    \ of code you added in step 6 so that it incorporates a looping structure.\n\n\
    In ASP:\n\n```\n<%\nDo Until rs_regions.EOF\n   Response.Write(\"<option value=\"\
    \" & rs_regions(\"regionID\") & \"\">\" &\n   =>rs_regions(\"regionName\") & \"\
    </option>\")\n   rs_regions.MoveNext\nLoop\n%>\n```\n\nIn ColdFusion:\n\n```\n\
    <cfoutput query=\"rs_regions\">\n<option value=\"#rs_regions.regionID#\">#rs_regions.regionName#</option>\n\
    </cfoutput>\n```"
  merge: -1
