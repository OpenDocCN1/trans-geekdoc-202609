- pgno: 43
  md: '# 4) Determine which version of HTML the document currently uses (scroll to
    line 1).


    This task is difficult in design view, but split view shows right away that the
    document''s code is HTML 4.01 transitional. How do we know that? It says so in
    the DOCTYPE declaration, in line 1. This declaration tells the browser which version
    of HTML, the document uses, so the browser can render it properly: All well-formed
    HTML documents should have a DOCTYPE declaration.


    HTML 4.01 transitional is now an outdated version of HTML. It still renders as
    well as ever in every major browser. But it has since been replaced with XHTML,
    and future browsers may not support it. In Lesson 2, you''ll upgrade the site
    to XHTML.


    Upgrading to XHTML means more than changing the DOCTYPE declaration, of course.
    XHTML is a major revision of HTML, and several coding practices have been changed.
    One such change, for example, is that all elements must be closed. In HTML 4 and
    earlier, empty elements were acceptable. Empty elements have no closing tags;
    or they have nothing between opening and closing tags. Example of empty tags include
    <br>, <hr>, <input>, and <img>. In XHTML, all tags must be closed. To accomplish
    this with empty tags, just add a space and a forward slash (/) before the closing
    angled bracket, so <br> becomes <br />, and <img src="picture.jpg"> becomes <img
    src="picture.jpg" />. If you take a look at the end of line 32, you''ll see a
    <br> tag. It is one of hundreds of empty elements in the site. We''ll deal with
    them later.


    # 5) Check for compliance with accepted accessibility practices (scroll to lines
    11 and 12).


    For years, many Web developers neglected the needs of those with impairments that
    interfere with their ability to use sites. For example, users with visual impairments
    that prevent them from seeing the site had no way to access the site''s content.
    Given that much of a site''s content is text, a special kind of browser, called
    a screen reader, was developed that reads Web page content aloud. One problem
    with these readers, though, is that they have no way to articulate visual content,
    such as graphics. If these graphics communicate any important information about
    the site—and most graphics do—then users accessing sites with these browsers were
    not accessing that content.


    A simple way to enable screen readers to articulate all of the information that
    your page communicates is to add a text caption to describe the contents of the
    image. If you put in a description of each image, including both graphics of substance
    (such as a diagram) and those used for mere decoration or even spacing, then users
    will never have to wonder what they''re missing.


    You can accomplish this in code by adding an attribute to each image element that
    associates a text string with that image. The attribute in question is alt. To
    use it,'
  merge: -1
  img_proc: true
