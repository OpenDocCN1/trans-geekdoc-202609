    # 8) Return to tourprice_processor.asp in Dreamweaver, and insert the function
    that converts the output number to the U.S. dollar currency format.


    In ASP:


    ```

    <% Response.Write(FormatCurrency(tourPrice)) %>

    ```


    In ColdFusion:


    ```

    <cfoutput>#DollarFormat(tourPrice)#</cfoutput>

    ```


    In PHP:


    ```

    <?php echo number_format($tourPrice,2,''`.`'',''.`); ?>

    ```


    **NOTE** PHP versions 4.3 and higher have a function, money_format(), but this
    is not available in earlier versions of PHP, including the one that ships on Macintosh
    OS X. The only disadvantages to using number_format() in this context is that
    it won''t output the dollar sign ($). You can add this manually, by entering $
    between the <strong> (or, if you didn''t change it, <span class="author"> tag
    and the opening <?php echo... tag.


    Functions are predefined actions that tell the interpreter how to do something.
    Computer languages generally have dozens of functions, if not more, built in for
    common tasks. Converting numeric figures to currency format is a common task,
    and so many languages have a function that performs this task.


    Functions take the following format: FunctionName(Parameter). In some cases, there
    is no parameter, but the parentheses remain, as in the case of ColdFusion''s Now()
    function, which returns the current time on the server. In the case of ASP''s
    FormatCurrency() and ColdFusion''s DollarFormat(), the lone parameter is the number
    that you want to format. Because the number is held in the tourPrice variable,
    you place that variable in the parameter.


    PHP''s number_format() function takes four parameters. They are, in order, the
    number to be formatted ($tourPrice), the number of decimal spaces to allow (2),
    the punctuation element used to indicate the decimal place (.), and the punctuation
    element used to separate thousands (,). Because the period and comma characters
    in'
