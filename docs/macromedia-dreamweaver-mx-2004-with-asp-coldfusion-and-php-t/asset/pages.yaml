- pgno: 251
  md: '# TOURING THE NEWLAND DATABASE


    DSNs, SQL, ODBC, relationships, tables, queries, forms, reports, recordsets—that’s
    a lot to absorb! Don’t worry if you don’t feel as if you’ve mastered all of this
    yet. You’ll get lots of experience from here on until the end of the book. The
    important thing is that you understand the big picture: that data is stored in
    tables; that the Web can be used as a read/write interface for these tables; that
    tables may be related to one another; and that the connection between the Web
    and database tables happens through a combination of ASP, ColdFusion, or PHP;
    SQL code; and information to connect to the database, such as ODBC (ASP or ColdFusion)
    or a direct connection string (PHP/MySQL).


    In this task, you’ll get a quick tour of the newland_tours database that will
    drive the Newland Tours Web site. This tour uses Microsoft Access, because its
    interface makes it easy to understand the data and the ways it is structured.


    > NOTE Though MySQL lacks an interface anything close to that of Access, the structure
    of the data is exactly the same, so even if you are using MySQL, you should read
    through this section (without actually doing the steps.)


    +   1) ASP and ColdFusion users only, copy the entire Lesson08/Start/newland-asp/
    folder into an appropriate location on the server (see below for details).


    If you are developing ASP or ColdFusion on your local computer, and you are using
    Windows XP, paste the database folder into the Shared Documents folder, which
    you can access in My Computer. By placing the database folder and the Access database
    file (newland_tours.mdb) in this directory, you ensure that the proper permissions
    are applied so that ASP/ColdFusion and Dreamweaver can access the database.


    If you are developing ASP or ColdFusion alongside IIS on your local computer,
    and you are using Windows 2000, paste the database folder in the C:\Inetpub\wwwroot\newland
    directory. Remember, everything in wwwroot is on your local Web server and accessible
    through localhost.


    If you are developing ColdFusion using the standalone Web server on your local
    computer, and you are using Windows 2000, paste the database folder in the C:\CFusionMX\wwwroot\newland
    directory.


    If you are developing ASP or ColdFusion and are using a remote server, such as
    an Intranet server or at your ISP via FTP, put the newland_tours.mdb file wherever
    the server administrator tells you to put databases. This varies by ISP.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '2) If you have Access, open newland_tours.mdb, which is inside the database
    folder you just copied.

    If you do not have Access, then follow along reading the text and looking at

    the screenshots.


    When you open the database file, you see a window that lists several object categories

    on the left side, and a group of objects on the right. The object categories are
    the

    same as the ones discussed earlier in the lesson.


    ![](img/43fd0127a958864ab2d93e28efe683e7_252_0.png)


    3) Click each of the objects listed on the left in turn, to see the objects that
    already

    exist in the database.


    As you can see, six tables are in the ‘Tables’ category, and a corresponding number
    of

    forms are in the ‘Forms’ category. The remaining categories are empty.


    ![](img/43fd0127a958864ab2d93e28efe683e7_252_1.png)'
  merge: -1
  img_proc: true
- pgno: 253
  md: '4) In the Tables group, double-click to open each of the tables to see what
    they contain.

    Some of the tables have more data than others. The two tables with the most information
    are tbl_country and tbl_tours—these will be used to populate the Country Profile
    and Find a Tour segments.


    ![](img/43fd0127a958864ab2d93e28efe683e7_253_0.png)


    When you open tbl_journal, you''ll see that it contains the text used in the ''Traveler''s
    Journal section of the homepage.


    The tbl_agents table is odd in that it contains only numbers, and no names as
    you might expect. The reason for this is that these numbers are actually foreign
    keys—the user is userID from tbl_users and the specialty is regionID from tbl_region.


    The tbl_users table contains information used for logging in and authenticating
    at the site. When users register, their information is stored in this table. Notice
    that there are two categories in the userGroup field: admin and visitor. Users
    can access different areas of the site, depending on their userGroup category.


    Close the tables window to return to the main screen.


    5) In the Forms group, open each of the forms, navigating through records to see
    what they contain.


    The forms, again, are convenient interfaces through which one can enter data into
    the tables. You won''t use these in the Newland Tours site—forms aren''t accessible
    through the Web, so you will create your own Web forms to replace them. But I
    used these to create the tables used in the site, and I left them in place, so
    you could explore them.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '![](img/43fd0127a958864ab2d93e28efe683e7_254_0.png)


    # 6) Click the Relationships button on the toolbar.


    Access has a convenient visual interface that lets you view and modify relationships
    among tables.


    ![](img/43fd0127a958864ab2d93e28efe683e7_254_1.png)


    # 7) Review the relationships among the different tables.


    The bold field in each table is its primary key. Foreign keys are linked to primary
    keys by a line. Do you remember how tbl_agents had only numbers in it? Now you
    can see why. The table comprises a primary key (agentID) and two foreign keys
    (user and specialty). Notice also that tbl_journal isn''t linked to any other
    tables. Not every table needs to be part of a relationship.


    ![](img/43fd0127a958864ab2d93e28efe683e7_254_2.png)'
  merge: -1
  img_proc: true
- pgno: 255
  md: '8) Do any further exploring without making any changes, and then close all
    open windows and Access.

    You''ve now had a crash course in Access and familiarized yourself with a bona
    fide database.


    # CONNECTING TO A DATABASE


    Enough theory and exploration: It''s time to connect this database to your pages.

    As you must have gathered, a number of preliminary steps are involved to get

    everything set up. And the steps vary depending on how you are connecting to your

    server and the server technology (ASP, ColdFusion, or PHP) you are using.


    For ASP and ColdFusion users, there are two steps you need to take to connect
    to a

    database. First, you have to create the DSN on the server, so you can take advantage

    of an ODBC connection. Remember, the DSN is simply a pointer to your database

    that you register on the server. Second, you have to get Dreamweaver to see this

    DSN, so it can ensure that scripts on individual pages can access the database

    through this DSN.


    PHP/MySQL doesn''t use ODBC or DSNs; instead, you provide the connection

    information—database location and name, as well as login credentials—directly
    in

    your PHP code. As you''ll see, Dreamweaver lets you enter this information in
    a

    dialog, and then Dreamweaver writes a generic connection file, to which it refers

    every time you create a page that refers to your database.


    The variations in configuring the database are so extreme that rather than attempting

    to create a generic set of instructions, I''ve separated them.


    # ASP USERS (RUNNING IIS LOCALLY OR CONNECTING TO A REMOTE SERVER)


    This section is for all ASP users, regardless of how they connect to their server.


    In this section, you will configure Dreamweaver to connect to an existing DSN.
    ASP

    users who are working locally will need to first setup the DSN, and instructions
    to do

    so are included in this section. Then they will enable Dreamweaver to connect
    to

    that DSN.


    ASP users who connect to a remote server must have the administrator for that
    server

    create a system DSN for them, using the following information: The DSN should
    be

    called "newland." The database type is Microsoft Access (which uses the JET driver).

    The database is located in the newland/database folder in your directory. Assuming
    you

    have in fact copied the database folder to that directory, your server administrator
    has

    enough information to create the DSN for you. Unfortunately, you cannot continue

    until this DSN has been created. Once it has, you''ll use the steps in this section
    to

    enable Dreamweaver to connect to that DSN.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# 1) Open index.asp.


    It doesn''t matter which page of your site is open when initially creating the
    connection. Dreamweaver creates the connection for the whole site. You''ve opened
    index.asp, because you will add dynamic content to that page, shortly.


    # 2) Open the Databases panel, in the Application panel group. Click the Connection
    (+) button, and choose Data Source Name (DSN).


    This opens the Data Source Name dialog, which is used to create a database connection
    for the site.


    ![](img/43fd0127a958864ab2d93e28efe683e7_256_0.png)


    # 3) Users connecting to remote servers, skip to step 8 below. Users running IIS
    locally only: Click the Define button to begin the process of creating a System
    DSN.


    The ODBC Data Source Administrator dialog opens. This is a Windows dialog, not
    a Dreamweaver dialog, which you can also access using the Control Panel.


    ![](img/43fd0127a958864ab2d93e28efe683e7_256_1.png)'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# 4) Click the System DSN tab.


    To give Web access to your data source, you must add the DSN using the System
    DSN tab, and not the User DSN tab that appears by default.


    ![](img/43fd0127a958864ab2d93e28efe683e7_257_0.png)


    # 5) Click the Add button. In the Create New Data Source dialog, choose Microsoft
    Access Drive (*.mdb) from the dialog, and click Finish.


    A DSN needs three pieces of information: ''The driver needed to communicate with

    the database, a name for the DSN, and the path to the database on the server.
    In this

    dialog, you provide the first piece of information.


    ![](img/43fd0127a958864ab2d93e28efe683e7_257_1.png)'
  merge: -1
  img_proc: true
- pgno: 258
  md: '6) In the ODBC Microsoft Access Setup dialog that appears, type *newland* as
    the Data Source Name. Click the Select button, and in the Select Database dialog,
    browse to the *newland_tours.mdb* file, which should be in the following directory
    for Windows XP users: `C:\Documents and Settings\All Users\Documents\database`;
    Windows 2000 users should look in the following directory: `C:\inetpub\wwwroot\newland\database`.


    In this step, you are supplying a name for the DSN and the path to the database.


    ![](img/43fd0127a958864ab2d93e28efe683e7_258_0.png)


    7) Click OK three times to close the windows and return to the Data Source Name
    dialog.


    Now that the DSN is complete, you can return to Dreamweaver and use the new DSN
    to connect to your data source.


    8) In the radio group at the bottom of the dialog, choose Using DSN on Testing
    Server, which erases all content in the dialog (this does not affect the DSN you
    created). Return to the top of the dialog, and in the Connection Name field, enter
    *conn_newland*. Enter *newland* as the Data Source Name. Click the Test button
    to verify the connection was made, and click OK.


    By completing this dialog, you are providing Dreamweaver with sufficient information
    to connect to your database using ODBC.


    ![](img/43fd0127a958864ab2d93e28efe683e7_258_1.png)'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'When you close the dialog, Dreamweaver creates a new folder in your site, called
    Connections, with a new file inside called conn_newland.asp. You should also notice
    that the Databases panel now has an expandable listing of the database and its
    assets.


    ![](img/43fd0127a958864ab2d93e28efe683e7_259_0.png)


    9) Select the Connections folder in the Files panel, and click the Put button
    to upload it to the server.


    You are ready to create a recordset and start binding database data. Skip ahead
    to the task. “Retrieving Recordsets and Displaying Database Information.”


    # COLDFUSION USERS (RUNNING COLDFUSION LOCALLY OR CONNECTING TO A REMOTE SERVER)


    This section is for all ColdFusion users, regardless of how they connect to their
    server.


    ColdFusion users who connect to a remote server must have the administrator for
    that server grant them RDS login information—which consists of a password. Without
    RDS login, you will not be able to complete this book.


    1) Open index.cfm.


    It doesn’t matter which page of your site is open when initially creating the
    connection. Dreamweaver creates the connection for the whole site. You’ve opened
    index.cfm because you will add dynamic content to that page in the next task.


    2) Open the Databases panel, in the Application panel group. Click the Specify
    the RDS login for your ColdFusion server link, enter your password, and click
    OK.


    RDS login grants developers permission to access the ColdFusion server, which
    is necessary for defining and using data sources.


    ![](img/43fd0127a958864ab2d93e28efe683e7_259_1.png)'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'At the end of this step, if there are already many data sources existing on
    the ColdFusion server, they are all visible in the Databases panel.


    The only problem is, the Newland database is not among them.


    +   3) Click the Create a ColdFusion data source link (if it is available), or
    click the Modify Data Sources button on the right side of the Databases panel.


    Regardless of whether you click the button or the link, after a moment, the ColdFusion
    administrator opens in a browser, to the Data Sources page. You will first need
    to enter the password to access the administrator.


    ![](img/43fd0127a958864ab2d93e28efe683e7_260_0.png)


    +   4) In the Add New Data Source box, enter newland as the Data Source Name.
    In the Driver drop-down menu, select Microsoft Access. Click Add.


    A DSN consists of a name, a driver that enables the application to communicate
    with the database, and the path to the database. In this step, you have entered
    the first two of these three pieces of information.


    ![](img/43fd0127a958864ab2d93e28efe683e7_260_1.png)'
  merge: -1
  img_proc: true
- pgno: 261
  md: '5) In the Microsoft Access Data Source box that appears, click the first Browse
    Server button and browse to the newland_tours.mdb file on the site. Click Submit.

    For Windows XP users, browse to the following directory: C:\Documents and Settings\All
    Users\Documents\database\''. This is the directory to which the shortcut Shared
    Documents points.

    For Windows 2000 users running ColdFusion in standalone mode, browse to the following
    directory: C:\CFusionMX\wwwroot\newland\database\.

    For Windows 2000 users running ColdFusion alongside IIS, browse to the following
    directory: C:\Inetpub\wwwroot\newland\database\.

    This step provides ColdFusion with the remaining information it needs to connect
    to your database.


    ![](img/43fd0127a958864ab2d93e28efe683e7_261_0.png)


    6) Close the ColdFusion Data Sources Web page to return to Dreamweaver. In the
    Databases panel, click the Refresh button beside the Modify Data Sources you clicked
    earlier. The newland DSN should show up. Click the + button beside it to expand
    it and explore the data source.


    ![](img/43fd0127a958864ab2d93e28efe683e7_261_1.png)'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'Now that you can see the contents of the newland_tours.mdb database, you know
    that Dreamweaver has successfully made the connection. You are ready to create
    a recordset and start binding database data.


    Skip ahead to the section entitled “Retrieving Recordsets and Displaying Database
    Information.”


    # PHP USERS (RUNNING PHP/MYSQL LOCALLY OR ON A REMOTE SERVER)


    Because PHP doesn’t make use of ODBC or DSNs, you can specify all the information
    you need to access your MySQL database right in Dreamweaver.


    +   1) Open index.php.

    +   It doesn’t really matter which file is open, since Dreamweaver makes the connection
    available site-wide. However, at least one file must be open in the site, before
    you can create a connection to MySQL.


    +   2) In the Databases tab, click the + button and choose MySQL Connection to
    create a new connection to MySQL.

    +   The MySQL Connection dialog opens.


    +   3) Specify the following information, so that Dreamweaver can make the MySQL
    data source available to your site.

    +   Connection name: conn_newland

    +   MySQL server: localhost (if developing locally) or whatever your server administrator
    tells you (if developing remotely)

    +   User name and Password: the user name and password of the MySQL account that
    you use to access MySQL.

    +   Database: newland_tours.


    ![](img/43fd0127a958864ab2d93e28efe683e7_262_0.png)'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'If you are developing on a remote server, only your server administrator will
    be able to tell you how you access MySQL from Dreamweaver/PHP. If you are developing
    locally, then just use the information you specified when you first installed
    MySQL. If you installed MySQL yourself and are unsure of your username and password,
    try root as the username and leave the password blank.


    **TIP** Optionally, click the Test button to make sure that Dreamweaver can actually
    access MySQL.


    **4) Click OK.** Dreamweaver creates a Connections directory on your site, with
    a file in it called conn_newland.php. This file contains the information your
    pages will need to access MySQL. Whenever you call a database from PHP, Dreamweaver
    references this file.


    **5) Expand conn_newland in the Databases panel to explore the structure of the
    newland_tours database from within Dreamweaver.** Dreamweaver is actually accessing
    the database within MySQL and providing you with information about it. Albeit
    in a limited way, you can interface with MySQL via Dreamweaver.


    ![](img/43fd0127a958864ab2d93e28efe683e7_263_0.png)


    **6) In the Files panel, click the Connections folder, and then click the Put
    button to upload it to the server.** The PHP/MySQL connection won''t work unless
    this folder is uploaded.'
  merge: -1
  img_proc: true
- pgno: 264
  md: "# # RETRIEVING RECORDSETS AND DISPLAYING DATABASE INFORMATION\n\nIt seems like\
    \ a long time since you made any improvements to the actual site. You've done\
    \ some theory, some exploration, and some configuration. But you haven't done\
    \ anything to any pages yet. In this final task of the lesson, you'll cause the\
    \ Traveler's Journal to load dynamically from the database. In the browser, the\
    \ homepage will look the same as it did before, but in Dreamweaver, the difference\
    \ will be unmistakable.\n\n+   1) With index.asp open in Design view, select the\
    \ text from \"Teens Discover...\" down to \"...putting together\" at the bottom.\
    \ Do not select the yellow image icon beside the T in Teens (if it appears). Press\
    \ Delete.\n+   \n+   You're going to replace this text with dynamic text, so you\
    \ are just making room in this step.\n\n![](img/43fd0127a958864ab2d93e28efe683e7_264_0.png)\n\
    \n+   2) Click the Traveler's Journal image to select it. In the tag selector\
    \ (in the bottom-left corner of the document window), right-click the <h3> tag\
    \ just to the left of the <img> tag, and choose Remove Tag from the menu.\n+ \
    \  \n+   The journal entry in the database is already marked up in HTML. You need\
    \ to remove the <h3> tag here, or the tags in the journal entry will be illegally\
    \ nested inside the <h3> tag."
  merge: -1
  img_proc: true
- pgno: 265
  md: '3) In the Bindings panel, click the New Binding (+) button, and choose Recordset
    (Query) from the menu.


    At this point, you have connected your site to a data source, which means you
    have made it possible for Dreamweaver to write code for you that retrieves data
    from your database. However, you have not actually retrieved any data yet. In
    this and the next two steps, you''ll create a recordset, which as you''ll recall
    from the beginning of this lesson, is a collection of data that meets certain
    criteria and that is retrieved from a database using SQL.


    ![](img/43fd0127a958864ab2d93e28efe683e7_265_0.png)


    Your goal is to display the journal entry, but you don''t want to display all
    the journal entries, only the most recent. In order to facilitate this, each journal
    entry has been given an unique ID (a primary key). These IDs are numbered incrementally,
    as the records are added. Therefore the record with the highest journalID is the
    most recent. You''ll need to sort the data, and then retrieve the contents of
    the latest journal entry in order to display it. You''ll take the first steps
    toward doing this in the next step.


    4) In the Recordset dialog, enter rs_journal as the Name. Choose conn_newland
    (or newland for ColdFusion users) from the Connection drop-down. Select tbl_journal
    from the Table drop-down. In the Columns section, choose the Selected radio button,
    and Ctrl-select (Windows) or Command-select (Macintosh) journalID and journal_entry.


    In this dialog, you are creating a recordset, named rs_journal. The data in this
    recordset is retrieved using criteria specified in SQL. You may not realize it,
    but you have already begun the SQL statement.


    Specifically, you have specified data in the data source stored in conn_newland
    (that connection specifies the newland DSN). Within that data source, you are
    specifying that the data is in a table named tbl_journal. Going a step further,
    you are specifying that you only want to retrieve the journalID and journal_entry
    fields from that table.'
  merge: -1
  img_proc: true
- pgno: 266
  md: "![](img/43fd0127a958864ab2d93e28efe683e7_266_0.png)\n\n+   5) In the Sort drop-down\
    \ menu, choose JournalID, and then choose Descending in the next drop-down menu.\
    \ Click OK.\n+   \n+   This adds the SQL necessary to sort the entries from most\
    \ recent to least recent.\n+   You have entered the information necessary to create\
    \ the recordset.\n\n![](img/43fd0127a958864ab2d93e28efe683e7_266_1.png)\n\nAfter\
    \ you click OK, the recordset appears in the Bindings panel, much like form and\
    \ URL variables did earlier in the book.\n\n+   6) Expand Recordset(rs_journal)\
    \ in the Bindings panel, and drag journal_entry so that it is just to the right\
    \ of the image and release it.\n\n![](img/43fd0127a958864ab2d93e28efe683e7_266_2.png)"
  merge: -1
  img_proc: true
- pgno: 267
  md: 'It may take some trial and error to order the dynamic text and the image correctly,
    so just keep trying till the image icon, the dynamic text, and the graphic itself
    look like they do in the screenshot.


    ![](img/43fd0127a958864ab2d93e28efe683e7_267_0.png)


    # 7) Choose View > Live Data from the main menu.


    You already know that when you want to test a dynamic page, you can press F12
    to open it in a browser, running from the server. If that is too much trouble
    for you, you can also view Live Data from inside Dreamweaver. This is a very convenient
    feature, because you can see the effects of your work right in the Dreamweaver
    authoring environment. It is especially handy when you are trying to format dynamic
    content, and Dreamweaver''s pseudocode placeholders don''t give you a sufficiently
    visual idea of how the page will look.


    ![](img/43fd0127a958864ab2d93e28efe683e7_267_1.png)


    Clearly, the recordset and display of the live data worked, because you can see
    the database data inside of Dreamweaver. You can also see that it is correctly
    formatted. The formatting is possible, because I entered HTML tags in the database
    itself, so when the data was placed on the page, the browser (or, in this case,
    Dreamweaver) correctly parsed and rendered the HTML tags.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '**NOTE** The text is highlighted in yellow to show you that it is dynamic and
    cannot be edited like normal text. This yellow highlighting does not appear in
    the actual browser; it is merely a Dreamweaver authoring aid.


    ![](img/43fd0127a958864ab2d93e28efe683e7_268_0.png)


    8) Choose View > Live Data again, to toggle it off. Save and upload index.asp.
    Press F12 to test it in a browser.


    If you are seeing what''s in the screenshot, then your system is fully configured,
    and from here forward it''s all about the code.


    # # WHAT YOU HAVE LEARNED


    In this lesson, you have:


    +   * Learned about the objects a database comprises (pages 224–227)

    +   * Learned about database relationships (pages 227–229)

    +   * Discovered how database content is used on the Web (pages 229–232)

    +   * Installed MySQL on a Mac or PC (PHP users developing locally only) (pages
    232–241)

    +   * Explored the Newland Tours database in Access (pages 242–246)

    +   * Configured your system so that Dreamweaver can connect to a database (pages
    246–254)

    +   * Displayed XHTML-formatted database content dynamically (pages 255–259)'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# # completing the price calculator


    # LESSON 9


    Back in Lesson 7, you began the tour price calculator application and created
    most of its functionality. As you''ll recall, though, you lacked the actual data
    required to make it work. That data is stored in the newland_tours database (in
    Access or MySQL, depending on your setup). In this lesson, you will finish what
    you started, by working with information from the database, controlling what data
    is retrieved and how it is displayed.


    While there will be some hand-coding in this lesson, you will also make use of
    some of Dreamweaver''s visual features for working with database data. For example,
    you will learn how to populate the drop-down list in the form on tourprice.asp
    with dynamic data using a simple dialog.


    ![](img/43fd0127a958864ab2d93e28efe683e7_269_0.png)


    By the end of this lesson, the tour price calculator oppiclation will be fully
    functional with live dato.'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'You''ll also spend some more time working with SQL and creating queries. You''ll
    see how to filter SQL queries using dynamic data, which enables you to deliver
    a truly customized experience to your users.


    In addition, by the end of the lesson, both tourprice.asp and tourprice_processor.asp
    will have a number of server-side code blocks—enough to make them hard to read.
    You''ll learn how to document these blocks using comments, making the scripts—and
    the documents as a whole—easier to read and maintain.


    # WHAT YOU WILL LEARN


    In this lesson, you will:


    +   • Dynamically populate a form menu with database data

    +   • Filter a query using dynamic data

    +   • Update the tour price calculation with live data

    +   • Document your code with comments


    # APPROXIMATE TIME


    This lesson takes approximately 45 minutes to complete.


    # LESSON FILES


    Starting Files:

    Lesson09/Start/newland/tourprice.asp

    Lesson09/Start/newland/tourprice_processor.asp


    Completed Files:

    Lesson09/Complete/newland/tourprice.asp

    Lesson09/Complete/newland/tourprice_processor.asp'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# DYNAMICALLY POPULATED DROP-DOWN MENUS


    As you''ll recall from Lesson 7, when the user submits the form on tourprice.asp,
    three pieces of data are sent: number of adults, number of children, and a dummy
    value for the cost of the tour. The ASP, ColdFusion, or PHP script in tourprice_processor
    then multiplies the number of adults by the dummy tour price and multiplies the
    number of children by the dummy tour price, adds the two results together, and
    outputs the number in HTML.


    To replace the dummy values with real data takes a little work. To begin, you
    need to populate the drop-down menu in the form with real data. As you know, the
    drop-down menu can send only one piece of data, but you need to access two: the
    price for adults and the price for children. Therefore, rather than sending a
    dollar value, you''ll send a unique identifier for the tour. On tourprice_processor.asp,
    you''ll use that unique identifier to query the database for the adult price and
    child price for just that tour. You''ll insert these values into the calculation,
    outputting the correct final value.


    Now let''s look more closely at the form menu element. As you know, each entry
    in a form menu has two attributes that need to be set: the label (the part users
    read, which is not submitted with the form), and the data (the information that
    is submitted as the value of the form element). It''s easy enough to guess what
    the label should be: the tour name itself. Since there''s a field in the database
    corresponding to the tour name, this should be easily retrieved. Now, how about
    the data? I said earlier that the data value that needs to be sent with the form
    should be the “unique identifier” for the tour. If you thought about tbl_tours’
    primary key when you read that, then you are thinking the right way. Remember,
    every database table has (or should have) a primary key, which contains a unique
    value for each row in that field (often this key is simply autonumbered). To summarize,
    each menu item''s label will be the tour name, and its data value will be its
    primary key (tourID), both of which are stored in the tbl_tours table.


    +   1) Open tourprice.asp. Click the New Binding (+) button in the Bindings panel,
    and choose Recordset (Query) from the list.


    Before you can configure the menu you need to create the recordset that will make
    that data available so you can bind it to the form. Whenever you are working with
    database data, the first thing you have to do is create a recordset.'
