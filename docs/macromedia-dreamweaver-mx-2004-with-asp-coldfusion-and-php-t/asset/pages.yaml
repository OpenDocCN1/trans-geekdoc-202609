    # 5) Save and upload the file. Test the master page (F12), click a country, modify
    it, and click Submit. Return to that country''s update page to change the value
    back.


    The update functionality is complete and functional—at least for some of the countries.
    If you are using ASP, and you test using Argentina, ''Thailand, India, or a few
    others, you will see an error. The cause of the problem is that the text in the
    description or imageALT text areas contains an apostrophe character, which SQL
    misinterprets. (PHP and ColdFusion automatically escape this character, so ColdFusion
    and PHP users won''t see this error.)


    The solution to this problem is to remove all apostrophes from the text—which
    is not a reasonable business practice. Or is it?'
