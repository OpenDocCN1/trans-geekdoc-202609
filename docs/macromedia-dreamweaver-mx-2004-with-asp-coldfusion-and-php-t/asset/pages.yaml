- pgno: 113
  md: '# dynamic web sites


    # LESSON 4


    You have reached a significant milestone in the revision of the Newland Tours
    site. You have upgraded to XHTML, stripped out inefficient presentation code,
    created a cascading style sheet for the entire site, built a template, and enhanced
    the site’s accessibility. Glancing at the site in a browser, it may not seem like
    you’ve accomplished three lessons’ worth of work. But you know what important
    things are going on behind the screen: You’ve laid the foundations for a standards-compliant,
    future-proof, maintainable site.


    Beginning with this lesson, you’ll cast aside (for the most part) traditional,
    static Web development, and move into database-driven, interactive, dynamic site
    development. Before you can start developing, though, you need to work through
    some prerequisites, of both a conceptual nature and a technical nature. By the
    end of this lesson, you’ll have an idea of how dynamic sites work, and what they
    are created to do; you’ll have Dreamweaver configured to work with dynamic data;
    and you’ll have created your first page that uses dynamic content.


    ![](img/43fd0127a958864ab2d93e28efe683e7_113_0.png)


    Developing dynamic Web pages often means mixing and matching regular text with
    placeholder variables.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# # WHAT YOU WILL LEARN


