- pgno: 41
  md: '+   2) If necessary, click the Split button.


    Split view is a best-of-both-worlds feature. It gives you access to the code,
    so you can hand-edit code when necessary, even while it leaves the traditional
    design view open, which makes some kinds of edits, such as edits to body text,
    much easier than working in code view.


    # SHOW CODE AND DESIGN VIEWS


    ![](img/43fd0127a958864ab2d93e28efe683e7_41_0.png)


    Split view is indispensable for working with dynamic sites. While Dreamweaver
    enables you to accomplish many tasks using wizard-based server behaviors and its
    built-in visual SQL builder, you still need to edit code directly. You''ll also
    find that some edits are much faster in code view than they are in design view.
    Yet another benefit is that it will teach you code. While I assume if you are
    reading this book, you are familiar with HTML, you may have forgotten some of
    the details; for example, you might not remember all of the attributes of a given
    tag. Split view will help you master HTML. From now on (and for all your future
    projects), make split view your default view. You should avoid using either the
    code view or the design view alone unless you have a specific reason to do so.
    And when you are done, switch back to split view.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'All of the problems specified in the subsequent steps in this task are revealed
    only in code view—they are all invisible in design view. Split view is already
    paying dividends.


    Another benefit of working in split view is that you can easily find a piece of
    code in code view by clicking its corresponding object in design view. For example,
    to see the code for a given image, click the image. All of the relevant HTML will
    be centered in the window and highlighted in code view. This is especially helpful
    in pages with hundreds of lines of code.


    # CODE AUTOMATICALLY HIGHLIGHTED AND CENTERED


    ![](img/43fd0127a958864ab2d93e28efe683e7_42_0.png)


    SELECTED IMAGE


    +   3) If necessary, turn on line numbering in code view by choosing View » Code
    View Options » Line Numbers.


    This setting displays line numbering beside the code in the code section of your
    screen. Line numbering makes it easier to communicate about portions of code to
