    ![](img/43fd0127a958864ab2d93e28efe683e7_284_0.png)


    # DOCUMENTING YOUR CODE WITH COMMENTS


    You added quite a bit of functionality to make the tour price calculator application
    work. You can see the results of this work in all your Web pages. In my copy of
    tourprice_processor.asp, for example, the XHTML document proper doesn''t start
    until line 39—everything above that is ASP scripts! Those using ColdFusion will
    discover that their XHTML documents start around line 18. For the most part, they
    have the same scripts that do the same things—it''s just that ColdFusion requires
    fewer lines of code. PHP is in between—my XHTML document begins on line 28.


    If you scroll through all that code at the top of tourprice.asp and tourprice_processor.asp,
    you should be able to interpret just about all of the scripts you''ll find there
    (ASP and PHP users will have one exception, which I''ll get to shortly). You can
    read these scripts not only because you are beginning to master ASP, ColdFusion,
    or PHP scripting, but also because they are fresh in your head. But if you came
    back in six months, or if someone just handed you this code today for the first
    time, you might not be able to look at it and know what everything is doing.'
