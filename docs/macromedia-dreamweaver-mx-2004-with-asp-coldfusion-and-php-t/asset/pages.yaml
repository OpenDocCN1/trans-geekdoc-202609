- pgno: 365
  md: 'When you are finished, save, upload, and test the page in your browser, clicking
    a sampling of links to ensure both that you are redirected to tours_detail.asp
    and that a different URL parameter is appended to the URL each time.


    ![](img/43fd0127a958864ab2d93e28efe683e7_365_0.png)


    # REVISING THE QUERY AND COMMENTING CODE FOR TESTING AND DEBUGGING


    The region links send URL variables to tours_detail.asp, but that page has nothing
    set up to do anything with those variables. In this task, you will put that functionality
    in place. But there is a catch.


    Usually, when you bind a URL variable to the page, an error message will be displayed
    if a user accesses the page and that URL variable is not present. But in this
    case, when the user clicks the View All link, no URL parameter is sent. Later,
    once you’ve added the form that enables users to choose a country from the list,
    users will have another way of accessing tours_detail.asp without using URL variables.
    Therefore, you must set up the page in a way that it does not depend on the presence
    of URL variables.


    When you create applications—even applications as simple as a search and results
    page pair—it is incumbent on you to prevent errors from occurring. Prevention
    often requires some strategic planning, so let’s think this through before we
    continue building. The goal is to find a way to enable the page to return the
    proper results based on the type of data that is (or is not) available to it.'
  merge: -1
  img_proc: true
- pgno: 366
  md: 'If data is available to the page (such as URL or form variables), then that
    data will be used only in one place: inside the SQL query as a filtering mechanism.
    Nowhere else on the page depends on that data. To prevent errors, you need to
    prevent code from running that depends on variables that don''t exist. You already
    know that if..else structures are good at preventing or enabling certain blocks
    of code. Therefore, one solution to the problem is to embed multiple SQL statements
    in an if..else structure, with one query for each type of search. The if..else
    structure will ensure that only the correct query will be executed, based on the
    presence or absence of variables that you specify.


    You''ll write the if..else structure at the end of this lesson. But for now, you
    need to create the SQL statement that will run if a URL variable (regionID) has
    been sent to the page. That statement will be different from the existing SQL
    statement, which simply returns all records. You still need that original query,
    though, in case no URL parameters are sent. So you will copy the existing SQL
    statement and revise it to work with URL variables.


    But that leads to another problem: Your code will have two incompatible queries.
    You''ll fix that later with an if..else structure. But how do you work around
    the problem while you build and debug the new query? You will temporarily disable
    the existing query. This disabling will prevent it from running, but the code
    will still be there on the page when you need it for later. To create this win-win
    situation, you designate the original query as a comment. As you know from before,
    ASP, ColdFusion, and PHP ignore comments, so the code will still be there, but
    it won''t interfere with the testing of your page. This technique, as you''ve
    learned previously, is called commenting out code, and it is a critical strategy
    when developing sophisticated applications.


    TIP One strategy that programmers use is to write code to solve one neatly defined
    problem at a time. In this case you could try to create the new query and the
    if..else structure simultaneously, but if something goes wrong, you may not know
    which section of code is the culprit. Focusing on one task at a time makes it
    easier to debug your code.


    In this task, you''ll duplicate the original query, comment it out, and revise
    and test the copy.


    +   1) Open tours_detail.asp in code view. Locate the query near the top of the
    page.

    +   For me, in both ASP and ColdFusion, the query code begins around line 4. In
    PHP, it occurs a little later, around line 12 (look for mysql_select_db()). The
    goal in this step is to disturb the ASP, ColdFusion, or PHP code as little as
    possible, while trying to isolate the SQL code (which begins SELECT * FROM tbl_tours).'
  merge: -1
  img_proc: true
