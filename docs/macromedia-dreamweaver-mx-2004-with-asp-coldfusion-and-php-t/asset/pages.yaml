- pgno: 40
  md: '# ASSESSING THE SITE: THE CODE


    In this task, you won''t make any changes to the files; rather, you''ll customize
    the Dreamweaver environment to make it more friendly to the kind of work we''ll
    be doing, and then you''ll explore the code in the index page of the start files
    so you can learn about its shortcomings.


    These shortcomings will not show up at all if you view the page in a browser.
    That is, the page should look just fine in most major browsers. If the page looks
    fine in a browser, you might wonder how could the code have any shortcomings?
    The answer is that the starting code in this project is outdated and noncompliant
    with recent standards. We''ll explore the significance of code and standards at
    the end of this task.


    Often a Web redesign project will begin with outdated, non-compliant code, so
    you might as well learn how to spot it. Later, you''ll learn how to fix it.


    +   1) Double-click index.htm to open it.


    Depending on whether you did the Contact Us exercise, you may be viewing the document
    in design view (if you did not do the exercise) or split view (if you did do the
    exercise).


    Back in the late 1990s, when the HTML editor market was crowded with editors that
    either did code well and design badly, or vice versa, the introduction of Dreamweaver,
    which excelled at both, caused a revolution. Several years later, Dreamweaver
    remains the only editor in its league when it comes to doing both design and code.
    Many designers, knowing that Dreamweaver was writing clean HTML in the background,
    were content to design sites in design view and never worry too much about the
    code.


    But working exclusively in design view is a luxury of the past.


    If you are serious about Web development, and need to develop database-driven
    Web content, you have to get involved with the code. Moreover, if you want to
    upgrade older HTML code to standards-compliant XHTML code, you need to roll up
    your sleeves and do some hand-coding.'
