- pgno: 383
  md: "# SWITCHING SQL STATEMENTS ACCORDING TO ENVIRONMENTAL VARIABLES\n\nYou know\
    \ from testing that each of the interfaces works—as long as two of the SQL statements\
    \ are commented out. That setup is just fine for testing, when you can open the\
    \ document and apply the correct commenting based on your needs, but obviously\
    \ it needs help before it can go into production. You need an automated way of\
    \ switching the query based on the type of search. Your first task is to identify\
    \ how tours_detail.asp will know which search type the user has chosen. Then,\
    \ based on that, you need to swap in the proper SQL statement. An if...else construct\
    \ is perfect for swapping the correct SQL statement in, but how does it know which\
    \ search type the user submitted?\n\nBack in a previous lesson, you implemented\
    \ server-side form validation. The way it worked was that it checked to see whether\
    \ a form variable called numadults or numchildren existed and was numeric. If\
    \ it didn’t exist, or it wasn’t numeric, the user was redirected back to the form\
    \ on the tour price page to fix the problem. I remind you of this because it provides\
    \ a strategy for determining which search type the user selected: Check for the\
    \ presence or absence of certain variables, as follows:\n\n+   • If no form or\
    \ URL variables are present, then the user clicked the View All Tours link.\n\
    +   \n+   • If a URL variable is present, then the user clicked one of the Region\
    \ links.\n+   \n+   • If a form variable is present, then the user selected a\
    \ country from the form menu.\n\nWith this information, you can construct the\
    \ logic for the script you need to write. The following pseudocode spells out\
    \ the logic. Statements in parentheses are the conclusions you can draw from certain\
    \ information; however, these won’t be explicitly written into the final script.\n\
    \n```\nIf no form variable exists //either the user clicked View All Tours or\
    \ clicked a\n=>region link\nIf no URL variables exist //the user clicked the View\
    \ All Tours link\nRun the first query\nElse a URL variable does exist //the user\
    \ clicked a region link\nRun the second query\nElse a form variable does exist\
    \ //the user selected a country from the form menu\nRun the third query\n```\n\
    \nLooking at this pseudocode, you’ll notice that it will require a pair of if...else\
    \ structures, one nested inside the other. That’s because one of the conditions—the\
    \ absence of a form variable—can be true for two different reasons: because the\
    \ user clicked the View All link and there are no URL variables, or because the\
    \ user clicked a region link and there is a URL variable."
  merge: -1
  img_proc: true
