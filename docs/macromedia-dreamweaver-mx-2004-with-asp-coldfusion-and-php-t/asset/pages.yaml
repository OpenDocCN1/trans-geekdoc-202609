- pgno: 197
  md: '6) In turn, select each of the first two text fields and name them *emailAddress*
    and *subject*. Select the text area and name it *body*, and specify its Char Width
    as 55, its Num Lines as 6, and Wrap as Virtual.


    In this step, you take care of much of the behind-the-scenes logic—giving each
    field a meaningful ID, which will make it easier to collect that data on messageSent.asp.


    By customizing the text area, you make it easier for users to enter a longer message
    than the default text area settings made convenient.


    ![](img/43fd0127a958864ab2d93e28efe683e7_197_0.png)


    7) Select `<form#form1>` in the tag selector, and in the Property inspector, name
    it *frm_message*. In the Action field, type *messageSent.asp*. In the Method drop-down,
    select POST.


    Hopefully, you had anticipated the Action and Method settings at the beginning
    of this task. As a review, they mean that the form will call messageSent.asp and
    include the data entered in the form in name-value pairs in the body of the HTTP
    request.


    ![](img/43fd0127a958864ab2d93e28efe683e7_197_1.png)


    8) Save, close, and upload contact.asp.


    The form is ready. To make use of it, though, you''ll need to load the form values
