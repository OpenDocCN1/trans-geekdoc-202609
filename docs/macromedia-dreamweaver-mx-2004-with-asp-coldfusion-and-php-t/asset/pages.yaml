- pgno: 115
  md: '# # DYNAMIC WEB SITE BASICS


    Setting aside, for a moment, the specifics of the Newland Tours site, in the preceding
    lessons you explored several concepts that are critical to dynamic site development.
    One of these is the separation of logic and presentation. The site logic at this
    point is handled exclusively by XHTML, while the presentation is handled by the
    cascading style sheet. You have also explored the concept of merging two different
    documents (an HTML page and a CSS) on the fly to create something different than
    either of the two source documents alone. These concepts are fundamental to creating
    dynamic Web sites.


    To understand these interactions, and to prepare you for the tasks ahead, let''s
    take a moment to analyze the relationship among the three different major sources
    of information that make up every Web page: the content (text, images, etc.),
    the logic (the document hierarchy, such as headings and body text), and the presentation
    (the colors, font sizes, positioning, and other cosmetic effects).


    In earlier versions of HTML, text, markup, and presentation code all exist in
    the same place: the HTML document itself. In a meaningful way, the document that
    a developer creates on her or his hard drive is the same as the document viewed
    in a browser by the site visitor. This simple relationship is shown in the following
    figure.


    ![](img/43fd0127a958864ab2d93e28efe683e7_115_0.png)


    As a result of the upgrades you made in Lessons 2 and 3, the relationships have
    changed: You have separated a document’s presentation from its logic and content.
    Presentation information is now stored in the CSS. Document content is stored
    as text within the XHTML markup, which also provides the document logic. Only
    when the XHTML document and the CSS are merged is the “real” page created. This
    new relationship is represented in the following figure.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '![](img/43fd0127a958864ab2d93e28efe683e7_116_0.png)


    Beginning with this lesson, you are going to add yet another layer of sophistication
    to this relationship—one that’s more profound and more powerful even than migrating
    from HTML to XHTML and CSS. Specifically, when you add database content to the
    site, you will separate the content from the logic. What this means is that all
    three levels—presentation, logic, and content—are quasi-independent of each other,
    which means you can make radical changes to one without needing to make changes
    to another. The relationship—and the basic blueprint for the rest of the book—is
    shown in the following figure.


    ![](img/43fd0127a958864ab2d93e28efe683e7_116_1.png)'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'HTML cannot separate content from document logic. Even in its fifth major revision
    as XHTML 1.1, HTML is ultimately intended to mark up a plain text document. It
    cannot process scripts, evaluate expressions, do math, interact with a database,
    or send and receive information to or from a user. Yet separating logic from content
    requires, at times, each of these abilities and more. To accomplish these tasks,
    you need to give HTML some help, and this is where server-side technologies such
    as Microsoft ASP, Macromedia ColdFusion MX, and PHP fit in.


    > NOTE A stylesheet language (think CSS on steroids), XSLT (eXtensible Stylesheet
    Language for Transformation) is capable of looping, data conversion, and much
    more. One of its most useful features is its ability to convert one type of XML
    document (for example, a proprietary XML language developed for internal use)
    to another type of XML document (such as a standard type of XML document that
    can be shared with others), and vice-versa. In spite of its utility, XSLT is not
    as powerful or flexible as server-side applications built using ASP, ColdFusion,
    or PHP.


    Server technologies like ASP, ColdFusion, and PHP (and there are others, including
    JSP and ASP.NET) are able to handle programming tasks such as evaluating expressions,
    doing math, and processing scripts. In addition, they are capable of interacting
    with data sources, including databases, structured text files, and in some cases
    XML data. They also have special abilities that pertain only to the Web, such
    as the ability to collect data sent by the user and control the information that
    gets sent back to the user.


    But there''s a catch. Browsers are limited to handling HTML, CSS, and JavaScript—they
    don''t understand server scripts (by server scripts, I am referring to code written
    in ASP, ColdFusion, PHP and so on). Whatever the server sends to the browser has
    to be in standard HTML. All server scripts must be processed on the server and
    output as standard HTML before they get sent to the browser.


    To put it more plainly, to view a page with dynamic content, you need to run the
    page through a server capable of processing the code. This is in contrast to standard
    HTML pages, which you can view directly in a browser, regardless of whether they
    go through a server. You can open Internet Explorer or Netscape and browse to
    any of the HTML pages in the Lesson04/Start folder, and they will display as expected.
    If you attempt to browse to the pages in the Lesson04/Complete folder, you''ll
    discover that the pages don''t open (or they open in Dreamweaver MX, rather than
    in the browser). The browser sees code it doesn''t understand, and refuses to
    open the file. This is why, in Lesson 1, you viewed the final version of the site
    at allectomedia.com, rather than from the CD.'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'Normally, when we think about servers on the Web, we use the term server to
    refer to the computer that holds the HTML file. This server is properly named
    the Web server. The most common Web servers include Apache, used on Unix/Linux
    systems, including Mac OS X; and Microsoft Internet Information Services (IIS),
    which is used on Windows Web servers.


    In addition to the Web server, you will probably use other servers to deliver
    dynamic data. You may use a database server, such as MySQL or Microsoft SQL Server.
    You may also use an application server. An application server processes server
    scripts. ColdFusion is an application server. The application server that processes
    ASP scripts is actually built into IIS, so you might say that IIS is a hybrid
    Web and application server. PHP is an application server that runs as a module
    inside of Apache.


    # CHOOSING A SERVER MODEL


    You know already that there are several common server-side languages. This begs
    the question (often asked by those new to dynamic site development), “which server
    model should I use?” The following list summarizes the main functions, pros, and
    cons of each:


    +   Active Server Pages (ASP): ASP is a Microsoft technology that ties together
    its IIS (Internet Information Services for Windows 2000 and XP) or PWS (Personal
    Web Server for Windows 98) servers with VBScript (Visual Basic Script) for dynamic
    Web site development (you can also use Microsoft’s implementation of JavaScript,
    JScript). ASP is free and built into all IIS and PWS servers, which means that
    virtually all Windows users can develop ASP sites for free with little configuration.
    Its code, VBScript, can be somewhat daunting for those with little to no programming
    experience. ASP is currently being replaced with Microsoft’s much-ballyhooed ASP.NET
    (see below).


    +   ColdFusion: ColdFusion is Macromedia’s server technology. Its tag-based syntax
    is much easier to use than VBScript, and it certainly requires fewer lines of
    code. Most designers find it the most accessible of all the server models. Newbies
    aside, ColdFusion is a powerful language that makes dynamic site development rapid.
    With the release of Macromedia ColdFusion MX 6.1, ColdFusion’s performance—oft
    complained about in earlier versions—is greatly improved. The disadvantage to
    ColdFusion is that it is not free, though the boost to productivity it affords
    usually means it pays for itself. It is also extremely easy to set up and configure.'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'PHP Hypertext Processor (PHP): A recursive acronym, PHP is a fast-growing server
    model for a variety of reasons. As an open-source solution, it is free and ties
    in well with other excellent open-source products, including the Apache Web server
    and MySQL database management system. In PHP 4, used in this book, its code is
    comparable in difficulty to that of ASP—possibly a little easier. In the newly
    released PHP 5, the language has been upgraded to a more object-oriented approach,
    and as a consequence, it is much harder for newbies (though considerably better
    for seasoned object-oriented programmers). One disadvantage—and this is true of
    many open-source products—is that setting up and configuring PHP-Apache-MySQL
    can be difficult.


    ASP.NET: The Web authoring portion of the .NET phenomenon, ASP.NET is a powerful
    new technology that holds a lot of promise for rapid, powerful Web development.
    Like its predecessor ASP, it runs on any Microsoft IIS server that has the free
    .NET extensions installed. But ASP.NET is conceptually and architecturally different
    from classic ASP, ColdFusion, and PHP. Whether you know only HTML, or you have
    experience with JavaScript or even ASP, you will need to do some adjusting to
    work with ASP.NET effectively. ASP.NET supports numerous development languages,
    but by far the two most prevalent are VisualBasic.NET and C#.


    Java Servlet Pages (JSP): JSP is the Java-based solution to dynamic Web site development,
    requiring a Java server (such as a J2EE server) to interpret the code. JSP is
    fast, providing impressive response times. It is also extremely powerful—certainly
    the most powerful solution until the appearance of .NET, and certainly powerful
    enough to compete head-on with .NET. But its code, once again, is daunting for
    those new to dynamic Web site development.


    This book provides coverage of ASP classic (hereafter just ASP), ColdFusion, and
    PHP. However, this is not specifically an ASP, ColdFusion, or PHP book. The book
    is designed to initiate readers into the concepts and practices of building database-driven,
    dynamic Web sites using Macromedia Dreamweaver MX 2004. You will learn lots of
    code and coding concepts along the way, and you will also make use of Dreamweaver''s
    server behaviors to speed up and simplify development. When you are done, you
    will have a solid sense of what''s possible, how several different technologies
    merge to create dynamic pages, and how to plan and build sites that use these
    technologies effectively. Most likely, you will not in the end be an ASP, ColdFusion,
    or PHP expert per se, but you should be able to get a code-oriented, non-beginner''s
    ASP, ColdFusion, or PHP book at that point and understand it well enough to push
    forward and develop ambitious Web projects.


    Having summarized the advantages and disadvantages of the various server models,
    I''ll let you in on a secret. Web developers seldom choose based on rational criteria,'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'such as which model fits their needs better than another. I certainly have
    rarely had that opportunity. In reality, the choice is usually driven by the available
    technology, your budget, the technologies used in an existing site, and the skills
    and experience of the available human resources. Going a step further, unless
    you develop for one organization and one organization only, and you intend to
    stay there for a very long time, you probably don''t have the luxury of learning
    just one. I initially learned ColdFusion and ASP simultaneously, because both
    were required for different projects I was working on.


    # SIDE BY SIDE WITH ASP, COLDFUSION, AND PHP: A STRATEGY FOR LEARNING


    Don''t be alarmed at the prospect of learning all three at the same time. The
    truth is, in the vast majority of situations, if you need to add a block of ASP
    to handle some functionality, then you would also need to add an equivalent block
    of ColdFusion or PHP to handle the same functionality. And the hardest part is
    not the syntax of one or the other type of code, but rather understanding what
    data is available, where it is available, and deciding how to get it to do what
    you want. If you know that much, the syntax isn''t that hard.


    For this reason, this book uses ASP, ColdFusion, and PHP side by side. While you
    don''t need to develop the same site three times so you can use all three server
    models, you should make an effort to understand all three sets of code. That is,
    if you decide to develop in ColdFusion, don''t just skip the ASP and PHP code.
    Take a moment to see how the ASP and PHP code accomplishes the same thing as the
    ColdFusion code. If you can understand how all three code blocks accomplish the
    same task, you will accelerate your mastery of Web programming.


    For example, the following three code snippets perform the same function: They
    output (or display) a value that the user entered in an XHTML form field, called
    “firstName.”


    ```

    In ASP:

    <p>Thank you, <%= Response.Write(Request.Form("firstName")) %>, for your submission.</p>

    ```


    ```

    In ColdFusion:

    <p>Thank you, <cfoutput>#form.firstName#</cfoutput>, for your submission.</p>

    ```


    ```

    In PHP:

    <p>Thank you, <? php echo $_POST[''firstName'']; ?>, for your submission.</p>

    ```'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'Let''s review the similarities between these three code snippets.


    +   * All use a special set of tags to indicate server markup. ASP uses <% and
    %>, ColdFusion uses <cf[tagname]> and </cf[tagname]>, and PHP uses <? php and
    ?>.

    +   * All indicate that they are outputting data: ASP uses Response.Write, ColdFusion
    uses <cfoutput>, and PHP uses echo.

    +   * All make explicit reference to the variable name (firstName).

    +   * All specify that this is a form/POST variable (form variables, as discussed
    later, are sent using POST): ASP uses Request.Form("firstName"), ColdFusion uses
    #form.firstName#, while PHP uses $_POST[''firstName''].

    +   * Neither contains any additional code beyond these four points.


    You don''t need to memorize this code: there won''t be a quiz on it, and you’ll
    get plenty of practice with it later. The point for now is to see the deep similarity
    between what the three snippets are doing: All are requesting a form variable
    named firstName, and outputting it in the middle of a string of otherwise regular
    XHTML code. The differences between the three code snippets are therefore completely
    cosmetic: a matter of syntax and a matter of looking up something in a reference.
    The hardest part is understanding in the first place that you *can* capture a
    value entered in a form and send it back mixed in with plain-old XHTML code.


    ''Throughout the book, then, I will present all three sets of code side by side.
    In all cases, I will deconstruct what the code blocks are doing, so you should
    understand exactly what is going on. All you have to do is read the three sets
    of code, and see how each accomplishes in its own way the functions that I outline
    in the main text.


    But before you start getting neck-deep in code, you need to configure your system
    for dynamic site development.


    # REDEFINING THE NEWLAND TOURS SITE FOR DYNAMIC DEVELOPMENT


    Configuring Dreamweaver to work with dynamic Web sites is somewhat more complicated
    than configuring it to work with static Web sites. Either way, you use the Site
    Definition dialog to configure the site. What makes defining dynamic sites so
    difficult, then, is external to Dreamweaver: To develop dynamic sites, you need
    access to (and permissions on) a bona fide Web server, with (if applicable) an
    application and/or database server.


    This may be a new workflow for many readers. In the past, you may have developed
    a site locally on your hard drive, and then uploaded it to the production (or
    public) server when you were ready to publish. When developing dynamic Web sites,
    you can still develop locally on your hard drive, but you also need access to
    a development server. Only when you have completed the site using the development
    server do you upload it to the public Web server.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'The only difference between a development Web server and a regular Web server
    is that the development server is not publicly accessible. But from a technical
    standpoint, a development server is identical to a regular Web server: it processes
    and outputs code in the same way.


    You can connect to servers in two different ways: you can set up servers on your
    local machine and develop everything on your machine, or you can develop using
    a remote machine, such as a network server or using FTP to a machine out on the
    Web, such as at your ISP.


    If you want to work locally, then you first need to spend some time configuring
    your computer; instructions follow. If you want to work remotely, then you don''t
    have to do any configuration to your machine, but you will need several pieces
    of information from your server administrator to configure Dreamweaver to work
    with that machine.


    Depending on your setup, you''ll need to work through the lesson as follows:


    +   - If you are developing locally, read the section immediately following, “Developing
    with a Local Server.”


    +   - If you are developing remotely, skip to the section, “Developing With a
    Remote Server,” later in the lesson.


    +   - Once you have finished the appropriate section, regardless of the server
    model or configuration you set up, you need to configure Dreamweaver to work with
    the server and server model you have chosen; this topic is discussed in the section,
    “Defining a Dynamic Site in Dreamweaver (All Users).”


    # DEVELOPING WITH A LOCAL SERVER


    Developing with a local server has advantages and disadvantages. Benefits of developing
    locally include the following:


    +   - The control and autonomy you have over your own computer: you never have
    to go through a server administrator.


    +   - No need for an Internet or network connection throughout development.


    +   - No lag time for logging in, authenticating, and transmitting data over a
    network.


    The primary disadvantages to developing locally are the following:


    +   - Running a server opens your computer to security risks, and the less you
    know what you are doing, the more vulnerable you are to attacks, viruses, hacks,
    and worms.


    +   - If you have a problem with configuration, or something is not working as
    expected, you are usually on your own.'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'TIP The best way to protect your server from hacks, viruses, and worms is to
    run Windows Update (Windows) or Software Update (Macintosh) regularly—at least
    twice a week—and to install all the security patches. This is especially important
    for Windows users, because Windows is more commonly targeted by malicious code.
    Windows Update can be found in the Start Menu, while Macintosh Software Update
    can be found in the System Preferences.


    If you decide to develop the Newland Tours site locally, then you must choose
    the server model you want to use and configure your system accordingly. Use the
    bolded headings below to select the directions that meet your needs. When you
    are finished, skip directly to the section later in the lesson entitled, “Defining
    a Dynamic Site in Dreamweaver (All Users).”


    NOTE Macintosh OS X users developing locally have only one choice: PHP, using
    the Apache Web server. Macintosh OS 9 users as well as OS X users who want to
    develop ASP or ColdFusion sites can do so, but not locally. They will have to
    connect to a remote server that is already running these technologies.


    NOTE Strictly speaking, it is possible to develop ColdFusion sites locally on
    a Macintosh. If you have the Macromedia JRun 4 server for Macintosh installed,
    you can install ColdFusion on top of it and develop locally. This setup is highly
    atypical for beginners and requires a substantial investment, especially if all
    you are doing is getting your feet wet with Newland Tours. However, Mac-centric
    organizations that want to run Macintosh servers should seriously consider this
    option. Developing ColdFusion over JRun on the Macintosh is not explicitly covered
    in this book, though most of the steps and code would be the same.


    # SETTING UP A LOCAL ENVIRONMENT FOR IIS/ASP


    ASP users need to ensure that Internet Information Services (IIS) is installed
    and running on their system. IIS comes free with Windows 2000 and XP Pro.


    NOTE Windows 98 and ME can use Personal Web Server (PWS) in place of IIS. However,
    this Web server, now retired, has substantially fewer features and less reliable
    security. If you are developing dynamic, database-driven Web sites, you need a
    professional environment, which PWS is not. Upgrade to Windows 2000 or Windows
    XP Professional and use IIS. Windows XP Home users are likewise out of luck: Microsoft
    officially states that if you need a Web server, you must use Windows XP Professional.
    See the following article for a workaround (I have not tested this approach; do
    so at your own risk): http://www.15seconds.com/issue/020118.htm.


    Depending on how Windows was first installed, you may already have IIS up and
    running. To determine whether you have IIS installed, look in Control Panel >'
  merge: -1
  img_proc: true
- pgno: 124
  md: "Administrative Tools (Windows XP users need to switch to Classic View to see\
    \ this option). If you see an icon in the list called Internet Information Services,\
    \ then it is already installed. To verify that it is running, double-click the\
    \ icon, and in the left side of the dialog, navigate down to Web Sites. In the\
    \ right pane, you should see Default Web Site listed, and beside it, you should\
    \ see the word Running. If it says Stopped, click the Start button to restart\
    \ it.\n\n![](img/43fd0127a958864ab2d93e28efe683e7_124_0.png)\n\nTo install and\
    \ run IIS, follow these steps:\n\n+   1) Use the Add/Remove Programs utility in\
    \ the Control Panel, and from there, select Add/Remove Windows Components.\n+\
    \   \n+   It takes Windows a couple minutes to analyze your machine and determine\
    \ what is already installed. Once it has built a profile, you will see the Windows\
    \ Components Wizard.\n\n+   2) From the list, check Internet Information Services,\
    \ and click Next.\n+   \n+   The default setup should work fine for our purposes,\
    \ so no further customization is needed. Once you click Next, Windows installs\
    \ and starts IIS.\n\n![](img/43fd0127a958864ab2d93e28efe683e7_124_1.png)"
  merge: -1
  img_proc: true
- pgno: 125
  md: '# SETTING UP A LOCAL ENVIRONMENT FOR COLDFUSION


    Setting up ColdFusion locally for development purposes is quite easy, thanks to
    its installer.


    > NOTE This option is only for Windows users.


    +   1) Initiate the ColdFusion installer from the CD. After a few moments, the
    installation begins.


    +   2) Read through and click Next twice to proceed through the Introduction and
    License agreement sections. These both contain important information, so don''t
    just skip them.


    +   3) In the Install Type screen, you are prompted to enter your serial number.
    Check the Developer Edition checkbox and click Next. You can use the Developer
    Edition indefinitely for free. The key limitation is that it can only be tested
    from the local machine. That is, if a different computer on your network attempts
    to access a ColdFusion Web page that is powered by the Developer Edition, the
    user will see an error indicating that the maximum number of IP addresses has
    been exceeded.


    If you were installing the Enterprise edition of the ColdFusion server, you would
    have a serial number, and the limit of one machine would be lifted.


    ![](img/43fd0127a958864ab2d93e28efe683e7_125_0.png)'
  merge: -1
  img_proc: true
- pgno: 126
  md: '+   4) In the Install Configuration screen, leave the default at Server configuration.
    Click Next.


    The other two options are for configuring a ColdFusion server to run on top of
    a J2EE server.


    +   5) Accept the default and click Next in the Choose Install Directory screen.


    This screen enables you to specify where the ColdFusion application files are
    installed.


    +   6) In the Web Server Selection screen, choose Built-In Web Server (if you
    are not running a Web server, such as IIS), or (if you are running a Web server)
    choose Configure web server connector for ColdFusion MX and verify that your server
    is listed in the Web Servers/Sites box.


    As an application server, ColdFusion is not intended to fulfill the role of a
    Web server. On a real production site, another server, such as IIS or Apache typically
    fulfills this role.


    In the development environment, one may not have a bona fide Web server available.
    Macromedia enables you to let ColdFusion also fulfill the role of Web server for
    development purposes if you need; to activate it, choose built-in web server.


    If you already have a Web server installed, such as IIS or Apache, you can let
    that continue as your main server, and enable ColdFusion to connect to it, so
    that when that Web server sees ColdFusion code that it does not understand, it
    knows to send it to the ColdFusion application server for processing.


    ![](img/43fd0127a958864ab2d93e28efe683e7_126_0.png)'
  merge: -1
