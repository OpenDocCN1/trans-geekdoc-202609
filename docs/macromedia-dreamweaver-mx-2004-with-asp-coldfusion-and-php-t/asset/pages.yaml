    # Contact a Newland Tours Agent


    If you are interested in learning more about a tour, contact one of our agents:


    | By Mail | By Email or Phone |

    | :--- | :--- |

    | Newland Tours<br>123 Wharton Street #45<br>New York, NY 10010 | info@newlandtours.com<br>(555)
    555-3865 |


    13) Position the insertion point before Image: This photo..., and press Backspace
    (Windows) or Delete (Macintosh) as many times as necessary until the image caption
    appears in the paragraph just below the table.


    The additional spaces are a relic of removing the original address paragraphs
    and placing them in the table. If you look in the code, you''ll see a series of
    <p>&nbsp;</p>'
  merge: -1
