- pgno: 473
  md: '```

    In PHP:

    <?php

    do

    {

    echo "<option value="" .$row_rs_regions[''regionID''] ."\>".$row_rs_regions

    =>[''regionName'']."</option>";

    }

    while ($row_rs_regions = mysql_fetch_assoc($rs_regions));

    ?>

    ```


    ![](img/43fd0127a958864ab2d93e28efe683e7_473_0.png)


    ColdFusion users need only add the query attribute to the <cfoutput> tag, and
    the loop is created automatically for them, behind the scenes.


    ASP and PHP users, as usual, have a harder time. ASP''s Do Until and PHP''s do_while
    are looping structures. The sole parameter of each is the condition that must
    be met to break the loop, in both cases when the recordset runs out of records.
    (ASP''s EOF stands for End of File.) The next line constructs the <option> element,
    as before. PHP uses curly braces {} to identify which code is to be looped over.
    ASP''s MoveNext method tells ASP to advance to the next record. ASP''s last line,
    Loop, sends ASP back to the Do Until line, while PHP''s last line, with the while
    statement, provides the loop-breaking condition for the do half of the loop.


    Test the file again in a browser, and click the menu. You''ll see all of the regions
    listed now.'
