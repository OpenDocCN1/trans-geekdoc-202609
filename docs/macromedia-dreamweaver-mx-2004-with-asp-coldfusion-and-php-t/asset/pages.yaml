    5) Replace the first paragraph of body text with Body text goes here. Press Delete
    several times, until all of the empty lines beneath the body text are removed.
    Click <table> in the tag selector, if necessary, to force Dreamweaver to redraw
    the table. The page template should appear as in the screenshot.


    ![](img/43fd0127a958864ab2d93e28efe683e7_106_1.png)


    6) Save generic_template.htm.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# ENHANCING ACCESSIBILITY WITH INVISIBLE NAVIGATION


    In creating a page template, you spared yourself the redundant task of reconstructing
    the basic page content every time you want to create a new page. In this task,
    you''ll extend a similar courtesy to visitors accessing your site via screen readers.


    As you know by now, screen readers are browsers that read page contents out loud,
    so that users with visual impairments can still access the site. The problem is
    that screen readers start at the beginning of the page and work their way down.
    This means that visitors using screen readers will have to sit through a description
    of your navigation bar, along with all of its hotspots, over and over again as
    they browse through the site.


    In this task, you will implement an easy solution to this problem, using a tiny,
    invisible graphic and a link. This will enable these visitors to jump straight
    to the page''s main content. And users accessing your site through traditional
    browsers need never know that this feature exists.


    Here''s how it works: You will insert a 1×1 pixel graphic and add a link to it
    that skips to the page title on each page. You will place this at the very top
    of the <body> element, so that it is the first element that a screen reader will
    encounter.


    +   1) With generic_template.htm still open, click anywhere inside the main table,
    and click the <table> tag in the tag selector. Then, using the keyboard arrow
    key, press left once.


    This should position a rather large insertion point just to the left of the page
    table, which indicates that the insertion point is now the first item after the
    opening <body> tag.


    ![](img/43fd0127a958864ab2d93e28efe683e7_107_0.png)


    INSERTION POINT'
  merge: -1
  img_proc: true
- pgno: 108
