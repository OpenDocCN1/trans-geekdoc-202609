- pgno: 451
  md: '6) Click to select the Submit button, and initiate an Update Record server
    behavior from the Server Behaviors panel.


    Updating records requires a special SQL command, called UPDATE. You have used
    both SELECT and INSERT in the course of this book, but you haven''t looked at
    UPDATE yet. The server behavior will generate all of the SQL for you, but you
    should at least be generally familiar with the UPDATE syntax, which is as follows:


    ```

    UPDATE tbl_table

    SET fieldName = ''New value for this field''

    WHERE keyID = ''123456'';

    ```


    When you update a record, you specify a table. Then, you use SET to specify the
    new value. Finally, you use the WHERE clause to identify which row. Optionally,
    you can specify multiple fields to update in the SET clause; to do so, just separate
    each field name-new value combination with a comma.


    > NOTE If you use UPDATE without a WHERE clause that specifies the row, you’ll
    end up changing the value of every row.


    Though you won’t need to in this lesson, sometimes you need to modify the SQL,
    and it’s important to learn SQL as you learn dynamic Web site development.


    The ASP, ColdFusion and PHP versions of the Update Record dialog are sufficiently
    different cosmetically that I’ll break them down separately.


    7) ASP Users Only: In the Update Record dialog, choose conn_newland as the connection,
    tbl_users as the Table To Update, rs_registeredUsers in the Select Record From
    menu, userID as the Unique Key Column (the Numeric checkbox should remain checked).
    In the After Updating, Go To field, enter admin_addUser_master.asp. Verify that
    the Form Elements area contains this text: userGroup updates column “userGroup”
    (Text).


    With this information, you are telling Dreamweaver to write a SQL query that will
    update tbl_users’ userGroup field with the information stored in the userGroup
    form element, in the row whose primary key matches the one retrieved in the rs_registeredUsers
    query.


    Once users submit the form, they are redirected to admin_addUser_master.asp, where,
    as you’ll recall, the summary lists each user’s current user group, enabling users
    to make sure that the change went through.'
  merge: -1
  img_proc: true
