- pgno: 98
  md: '![](img/43fd0127a958864ab2d93e28efe683e7_98_0.png)


    # # CREATING AND APPLYING CUSTOM CSS STYLES


    By providing presentation specifications for HTML styles, you have quickly formatted
    the vast majority of your site, both as it stands now and as you will develop
    it during this book. Better yet, you’ve also optimized the site for maintenance,
    since to update the look of the site, you need only change the CSS file. You can
    do this using Dreamweaver’s CSS Styles panel from any page in the site, and the
    settings update instantly throughout the site. If the site is already loaded on
    a server, all you need to upload is the updated CSS file; you do not need to re-upload
    each of the pages.


    The only drawback to what you have done so far is that you’ve been limited to
    redefining the look of pre-existing HTML styles. You haven’t been able to create
    custom styles for text elements that aren’t part of the HTML specification. For
    example, there is an author by-line in the Traveler’s Journal of the index page,
    but HTML has no <authorbyline> tag. In this task, you will learn how to create
    and apply custom styles, or classes.


    +   1) Open index.htm. Make sure you can see the Traveler’s Journal section at
    the right side of the page.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'The Traveler''s Journal section is composed of three parts: a title, an author
    byline, and the body text of the article. The title is enclosed in a heading,
    and the body text is marked up in <p> tags, so in both cases the HTML markup represents
    the content reasonably well. The author byline is not so easy to categorize. It''s
    represented in bold, using the <strong> tag. However, the author byline is bolded
    not because it is stronger, or more emphatic, than the surrounding text, but because
    it performs another function: it gives credit to the author. Again, since HTML
    doesn''t have an <author_byline> tag, this is a good opportunity to create a custom
    CSS style.


    The result of this new style, which we will call .author, will merely add bold
    to the element to which it is attached (in this case, a <p> tag), and it won''t
    look any different in a browser than it does now. But making this change will
    make the code describe the text a little more meaningfully, and you''ll also see
    the concept of inheritance in action again.


    ![](img/43fd0127a958864ab2d93e28efe683e7_99_0.png)


    2) Click New CSS Style. In the New CSS Style dialog, select Class in the Selector
    Type group, and verify that newland.css is still specified in the Define in group.
    In the Name field, type .author. Click OK.


    ![](img/43fd0127a958864ab2d93e28efe683e7_99_1.png)'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'These settings should, at this point, all make sense to you, with one exception:
    Why does the class name begin with a period (.)? The period indicates that the
    style does not redefine an HTML tag in its own right, as in “all <p> tags should
    look like XYZ,” but rather that it defines an element subordinate to an HTML tag.
    One practical application of this is that you can use a custom class to specify
    the appearance of *some* <p> tags, but not all of them. That makes sense in this
    particular case—only some paragraphs should be designated as author paragraphs.


    Another benefit to custom classes is that they can be applied to different HTML
    elements. For example, not only could you apply the .author class to any <p> tag,
    but you could also apply it to a <span> or <div> tag.


    3) In the CSS Style Definition dialog, set the weight to bold and click OK. You
    don’t need to specify any other information here, such as the font face or size,
    because that information is already specified in a parent tag (in this case, the
    <td> and <body> tags). So all we need the style to do is inherit all of that presentation
    information and add bolding.


    ![](img/43fd0127a958864ab2d93e28efe683e7_100_0.png)


    4) Create a new class called .navhead with the following settings: Size = 12 points;
    Weight = bold; Color = #505748. This style will be used as the navigation header
    at the top of the navigation bar in the left-hand column of index.htm.


    5) Create a new class called .caption with the lone attribute of Style = italic.
    This style will be used for all of the image captions used in the site. Currently,
    they are formatted using <em>, which most browsers render as italics. Again, .caption'
  merge: -1
  img_proc: true
