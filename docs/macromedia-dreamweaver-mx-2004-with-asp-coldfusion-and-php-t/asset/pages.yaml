    You might be wondering why Canada showed up as the country. The reason is that
    when you created your query, Dreamweaver set the default URL parameter to 1 (in
    ASP, ColdFusion, and PHP), and Canada is the country in the database with that
    value. If Dreamweaver had not added that default value, then you would have seen
    an error message or a page with missing data (depending on the server model),
    because the query depends on a URL parameter where none existed. Had you accessed
    this page from profiles.asp, of course, there would have been a URL parameter.


    The World Region is listed as 1, which is not terribly helpful. Why does Canada
    have a world region of 1, rather than something meaningful, such as North America?
    This has to do with the structure of the database. Remember, relational databases
    often have foreign keys, rather than actual data in their fields. That''s what''s
    happening in this case. Because most countries share continents with other countries,
    I created a separate table for continents in the database, and used the key (unique
    ID) in tbl_region as a foreign key in tbl_country. The result is that that key
    value—in this case, 1—is showing on the page, rather than the region name. To
    fix this, you''ll need to look up the region name associated with 1 in tbl_region.'
