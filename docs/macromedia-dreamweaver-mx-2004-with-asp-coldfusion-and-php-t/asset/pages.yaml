- pgno: 39
  md: 'blocks. This is how Dreamweaver creates empty paragraphs. It is illegal in
    HTML to have opening and closing <p></p> tags with nothing in them. Dreamweaver
    therefore enters a space character as an empty placeholder. Because HTML ignores
    whitespace in code, Dreamweaver enters the character entity for the space character:
    &nbsp;, which stands for non-breaking space.


    ![](img/43fd0127a958864ab2d93e28efe683e7_39_0.png)


    14) Triple-click anywhere in the caption line, and once it''s selected, use the
    Property inspector to apply italics.


    ![](img/43fd0127a958864ab2d93e28efe683e7_39_1.png)


    Notice in the code that Dreamweaver applies italies using the <em> tag, rather
    than the <i> tag. The significance of this is discussed later in the book.


    +   15) Save contact.htm.


    You are done designing the new page. In the real world at this point, you would
