- pgno: 10
  md: '# # introduction


    Macromedia Dreamweaver has been the market leader in visual HTML editors for years,
    combining ease of use, power, and unusually high quality code writing. But since
    version 1 was first released, the Web has changed. Over the years, numerous technologies,
    many developed quite independently of the Web, have emerged as critical Web authoring
    tools, including JavaScript, databases, SQL, Java, WML, WSDL, cascading style
    sheets, XML, XSLT, CGI scripting, and above all, a group of new server languages
    that enable developers to turn Web pages into powerful, data-driven, interactive
    Web applications: these include Macromedia ColdFusion, Microsoft ASP and ASP.NET,
    as well as JSP and PHP. Without compromising its ease of use or the quality of
    code it has always generated, Macromedia Dreamweaver has absorbed these technologies,
    not only making it possible to work with each of them in isolation, but also making
    it possible to build sophisticated applications combining these technologies.


    # ## PREREQUISITES


    While Dreamweaver has managed to keep up with the rapid evolution of Web technologies,
    many developers have not fared so well. HTML, image editing, and cascading style
    sheets are one thing: document object models, for loops, relational data, concatenation,
    recordsets, cookies, and methods are something else. Yet for many of us, our careers
    depend on our ability to make the jump from static HTML to full-fledged dynamic
    Web applications—and that means gaining competence with several of the technologies
    listed in the previous paragraph.


    That''s where Macromedia Dreamweaver MX 2004 with ASP, ColdFusion, and PHP: Training
    From the Source comes in. In a series of hands-on tutorials, you''ll build competence
    in working with three of today''s hottest dynamic application development languages:
    Microsoft ASP (VBScript) and Macromedia ColdFusion Markup'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'Language (CFML), and the open source PHP. Along the way, you''ll also learn
    about database design, writing SQL queries, cascading style sheets, the new XHTML
    standard, and more.


    The book takes a novel strategy of mixing enough hand-coding for you to become
    competent with programming in these languages, while also providing extensive
    coverage of the dialog- and wizard-based server behaviors and pre-built application
    objects that Dreamweaver provides to speed up application development. The goal
    is not simply to build dynamic applications, but for you to gain a deep understanding
    about how they work, even when you are relying on GUI-based server behaviors.


    The lessons assume the following:


    +   * You have basic familiarity with your operating system, including using the
    menu system and file management.

    +   * Dreamweaver MX is installed, and your system meets the requirements needed
    to run it.

    +   * You are familiar with working in Dreamweaver, including the use of the Property
    inspector, various panels, and the main menu. You should also understand the site
    definition process and Site panel.

    +   * You understand how HTML code works, and you are familiar with its most common
    tags and attributes, such as the <p>, <table>, <tr>, <td>, <ol>, <ul>, <h1>, <h2>,
    and <img> tags. You should also understand common HTML concepts, such as absolute
    versus relative links, validly nested tags, and the difference between the document
    head and body.


    # OUTLINE


    This Macromedia training course steps you through the projects in each lesson,
    showing you how to create database-driven, interactive Web applications in Dreamweaver
    MX 2004 using ASP, ColdFusion, and PHP. The curriculum of this course should take
    you 20 to 24 hours to complete and includes the following lessons:


    +   Lesson 1: Introducing Newland Tours

    +   Lesson 2: Upgrading to XHTML

    +   Lesson 3: Creating the Presentation Layer

    +   Lesson 4: Dynamic Web Sites

    +   Lesson 5: Passing Data Between Pages

    +   Lesson 6: Sending Email From a Web Form

    +   Lesson 7: Building a Tour Price Calculator

    +   Lesson 8: Databases on the Web

    +   Lesson 9: Completing the Price Calculator

    +   Lesson 10: Filtering and Displaying Data'
  merge: -1
  img_proc: true
- pgno: 12
  md: '+   - Lesson 11: Building the Tour Descriptions

    +   - Lesson 12: Building Search Interfaces

    +   - Lesson 13: Authenticating Users

    +   - Lesson 14: Managing Content With Forms

    +   - Lesson 15: Building Update Pages

    +   - Lesson 16: Hand-coding a Basic CMS


    # THE PROJECT SITE


    In the course of completing the book, you will build a site for a fictional travel
    tours company, called Newland Tours. Newland Tours offers travel tours to numerous
    countries throughout the world. Currently, tours are listed on a static HTML Web
    page. Unfortunately, new tours are added, old tours are removed, and tour details
    (especially their prices) change frequently. Newland Tours, having no dedicated
    Web developer on staff, is having trouble keeping the site up to date, and they
    are looking for a better way to keep content up to date on the Web. In addition,
    site users are complaining that tours are hard to find, as there is no way to
    search for tours short of scrolling through long pages of tour listings.


    The solution, of course, is to store data about the tours in a database, and enable
    users to search database records over the Web. Likewise, as you will learn, Web
    forms can be used to update the database from any computer with access to the
    Internet. Of course, exposing the Newland Tours database to the general public
    (via Web forms) would not be a good security practice, so you''ll also implement
    an authorization framework for the site, which blocks users from seeing pages
    unless they have logged in.


    Along the way, you''ll build a number of common Web applications, including a
    tour price calculator, a Contact Us form that automatically generates an email
    message, search interfaces, and a forms-based content management system that enables
    Newland Tours employees to insert, update, and remove country profiles.


    # ELEMENTS AND FORMAT


    Each lesson in this book begins by outlining the major focus of the lesson at
    hand and introducing new features. Learning objectives and the approximate time
    needed to complete all the exercises are also listed at the beginning of each
    lesson. The projects are divided into short exercises that explain the importance
    of each skill you learn. Every lesson will build on the concepts and techniques
    used in the previous lessons.


    **Tips:** Alternative ways to perform tasks and suggestions to consider when applying
    the skills you are learning.


    **Notes:** Additional background information to expand your knowledge, as well
    as advanced techniques you can explore in order to further develop your skills.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'Boldface terms: New vocabulary that is introduced and emphasized in each lesson.


    Italic text: Text that is italic indicates that you will need to type it.


    Menu commands and keyboard shortcuts: There are often multiple ways to perform
    the same task in Dreamweaver. The different options will be pointed out in each
    lesson. Menu commands are shown with angle brackets between the menu names and
    commands: Menu > Command > Subcommand. Keyboard shortcuts are shown with a plus
    sign between the names of keys to indicate that you should press the keys simultaneously;
    for example, Shift+Tab means that you should press the Shift and Tab keys at the
    same time.


    CD-ROM: The files you will need to complete the projects for each lesson are located
    in a folder named for the lesson: Lessono1, Lessono2, etc. The CD can be found
    in the back of the book. Inside the lesson folders are Start and Complete folders,
    which represent the state of the Newland Tours project at the beginning and ending
    of that lesson, respectively. After the first few lessons, which use the same
    files regardless of the server model you plan to use (ASP, ColdFusion, or PHP),
    the Start and Complete folders have subfolders for each server model—newland-asp,
    newland-cfm, and newland-php.


    The files you will use for each of the projects are listed at the beginning of
    each lesson.


    # IF YOU GET STUCK


    One frustrating aspect of learning dynamic Web site development is the errors
    that you will encounter. A dynamic Web site is typically the fusion of many technologies,
    and some of them, especially ASP, ColdFusion, and PHP themselves, depend on the
    configuration of the server. If the server (or database) is not configured correctly,
    you will see error messages even if you entered all the code correctly in Dreamweaver.
    Worse, the error messages that you see are often hard to interpret (especially
    those in ASP), and in some cases, misleading.


    The following are some strategies you can use to resolve these problems:


    Use the files in the lesson''s Complete folder. One reason these are provided
    is so that you can use them if something goes wrong with your files. You can also
    print out the code for your file and the one in the Complete folder for a comparison.


    Consult Macromedia''s TechNote on common server errors. Though created initially
    for Dreamweaver UltraDev, the predecessor to Dreamweaver MX, this'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'page contains a listing of some of the most common server errors and their
    solutions: http://www.macromedia.com/support/ultradev/ts/documents/common_server_errors.htm


    Verify that the page you are testing has all of the data that it needs. Some pages
    depend on the presence of form or querystring/URL variables to work. For example,
    a SQL query on a detail page might filter database records based on a querystring
    or URL variable that it is expecting from a related page. If you test that detail
    page directly, without going through the related page first, the data ASP, ColdFusion,
    or PHP is expecting won’t be present, resulting in an error. Always test starting
    from an application’s starting page, rather than a page in the middle of the process.


    Know when to move on. While you should try to resolve any errors that you encounter,
    don’t beat your head against the wall. The goal of the book is really for you
    to learn dynamic Web site development, and not literally to build every aspect
    of the Newland Tours site. If you get stuck, at a certain point, it’s better to
    swap in the file from the Complete folder and move on.


    Try to determine whether the problem is due to code or configuration. With static
    HTML development, if a page doesn’t look right, it’s almost always because of
    something in your code. When they see a server error, many beginners assume that
    they made a mistake in their code, and while that is possible, it’s just as likely
    that there is a configuration problem, such as the wrong permissions, a service
    that’s not available, or a missing DSN. The easiest way to test is to swap in
    the file from the Complete folder—if it doesn’t work either, then your code is
    probably fine. Take up the matter with your server administrator.


    Check the book’s Web site. Because ASP, ColdFusion, and PHP errors are so common
    and hard to troubleshoot, the author and the editorial team took extra pains to
    ensure that the code in the book and on the CD-ROM are bug free. However, no book
    is completely without errors, and if we learn of any, we will post them on the
    book’s page at http://www.allectomedia.com.


    Ask your questions in the appropriate Macromedia Dreamweaver forums. Macromedia
    has a number of free forums where anyone can go to ask questions or search previous
    posts. The forums are frequented by Macromedia tech support staff and Dreamweaver/ASP/ColdFusion/PHP
    veterans and gurus, and you can often get an answer to your questions within a
    matter of minutes. To access the forums, visit http://www.macromedia.com/support/dreamweaver/ts/documents/dream_newsgrp.htm.
    I visit the Dreamweaver Application Development newsgroup periodically and pay
    special attention to posts that reference this book in the title. I cannot guarantee
    to provide support for every problem every reader might encounter, but the community
    in that forum is sufficient to help most people get what they need.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# MACROMEDIA TRAINING FROM THE SOURCE


    The Macromedia Training from the Source series is developed in association with
    Macromedia, and reviewed by the product support teams. Ideal for active learners,
    the books in the Training from the Source series offer hands-on instruction designed
    to provide you with a solid grounding in the program''s fundamentals. If you learn
    best by doing, this is the series for you. Each Training from the Source title
    is designed to teach the techniques that you need to create sophisticated professional-level
    projects. Each book includes a CD-ROM that contains all the files used in the
    lessons, completed projects for comparison and more.


    # MACROMEDIA AUTHORIZED TRAINING AND CERTIFICATION


    This book is geared to enable you to study at your own pace with content from
    the source. Other training options exist through the Macromedia Authorized Training
    Partner program. Get up to speed in a matter of days with task-oriented courses
    taught by Macromedia Certified Instructors. Or learn on your own with interactive,
    online training from Macromedia University. All of these sources of training will
    prepare you to become a Macromedia Certified Developer.


    For more information about authorized training and certification, check out www.macromedia.com/go/training1'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# # WHAT YOU WILL LEARN


    You will develop the skills you need to create and maintain your own Web sites
    as you work through these lessons.


    By the end of the course, you will be able to:


    +   - Update an existing site so that it uses maintainable, standards-compliant
    XHTML and CSS code

    +   - Understand the limitations of the HTTP protocol, and how ASP, ColdFusion,
    and PHP work with it to enable Web applications

    +   - Pass data between pages and make data persist over time, using form, querystring/URL,
    cookie, session, and application variables

    +   - Collect and process information entered by users via Web forms

    +   - Validate data entered into forms using both client-side (JavaScript) and
    server-side (ASP, ColdFusion, or PHP) code

    +   - Write code to evaluate expressions and perform simple mathematical calculations

    +   - Connect your Web site to a database, so that it displays database contents

    +   - Filter data retrieved from a database

    +   - Build search interfaces that enable users to access only the information
    they need

    +   - Authenticate users and restrict access to pages

    +   - Build content management systems that enable site owners to maintain Web
    content using Web forms, rather than HTML editors and FTP

    +   - Hand-code common ASP, ColdFusion, and PHP scripts that you can reuse in
    future projects

    +   - Learn core SQL statements, enabling you to build pages that interact with
    data in sophisticated ways

    +   - Control the flow of scripts, using conditional statements and loops

    +   - Work with Dreamweaver''s server behaviors, Recordset dialog, and pre-built
    application objects to rapidly develop dynamic Web applications'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# MINIMUM SYSTEM REQUIREMENTS: WINDOWS


    +   - Macromedia Dreamweaver MX 2004 (A 30-day trial version is on the CD-ROM.)


    +   - Intel Pentium III processor or equivalent 600+ MHz


    +   - Windows 98 SE, Windows 2000, or Windows XP


    +   - 128 MB RAM (256 MB recommended)


    +   - Internet Explorer or Netscape Navigator 4.0 or higher


    +   - Internet access (for Lesson 6 only)


    +   - Access to a server capable of processing the desired application language,
    as follows:


    +   - ASP/VBScript users must have access to Microsoft Internet Information Services
    (IIS). IIS comes bundled with Windows 2000 and Windows XP Professional, so you
    can run it on your local system. Alternatively, you can connect to an IIS server
    over a network or over the Web via FTP.


    +   - ColdFusion users must have access to the ColdFusion application server in
    addition to a Web server, such as IIS, Apache, or ColdFusion''s own standalone
    server. A single IP developer''s edition of ColdFusion can be downloaded for free
    from http://www.macromedia.com.


    +   - PHP users must have access to a Web server, such as the open source Apache
    Web server, with the PHP module loaded. It is possible to run PHP in an IIS environment,
    though Apache is recommended for PHP.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# MINIMUM SYSTEM REQUIREMENTS: MACINTOSH


    +   - Macromedia Dreamweaver MX 2004 (A 30-day trial version is on the CD-ROM.)

    +   - 500 MHz Power Mac G3 Processor

    +   - Mac OS 10.2.6

    +   - 128 MB computer RAM (256 MB recommended)

    +   - Internet Explorer 4.0 or Safari 1.0 or higher

    +   - Internet access (for Lesson 6 only)

    +   - Access to a server capable of processing the desired application language,
    as follows:

    +     - ASP/VBScript users must have network or Internet access to a Microsoft
    Internet Information Services (IIS) Web server. IIS and ASP cannot be run locally
    from a Macintosh.

    +     - ColdFusion users must have network or Internet access to a ColdFusion
    server. ColdFusion cannot be run locally from a Macintosh (unless it is running
    on top of a J2EE server, such as Macromedia JRun).

    +     - PHP users must have access to a PHP-enabled Web server, such as the open
    source Apache. You can connect to a PHP-enabled Apache server over a network or
    over the Internet. In addition, Mac users can now run Apache with PHP locally,
    without having to connect to a separate server over a network or the Internet.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# introducing Newland Tours


    # LESSON 1


    The Web is changing. HTML is no longer a new technology, and most established
    organizations are no longer seeking attractive Web presence sites, that is, sites
    that establish a static presence on the Internet but do little else. They already
    have sites, and in many cases, these sites have been around for several years.
    Web designers and developers today increasingly face a different set of problems
    than they did a few years ago.


    +   - Rather than creating brand-new sites, today’s designers and developers need
    to maintain existing sites in the face of changing standards, new technologies,
    and evolving content.


    ![](img/43fd0127a958864ab2d93e28efe683e7_19_0.png)


    The homepage of the Newland Tours site looks good enough, but certain parts of
    it, such as the weekly Traveler’s Journal column (at right) require a lot of work
    to maintain.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '+   • The variations among different browsers, now including assistive technologies
    for the millions of users with impairments, have become so pronounced that it
    is no longer acceptable to simply check the page in both Netscape and Internet
    Explorer.

    +   • Modern Web sites should respond to users'' needs, which often means that
    Web sites must react on-the-fly to user interaction.

    +   • Today''s designers and developers often need to build content management
    systems, which facilitate the movement of site content maintenance from IT departments
    to non-technical business users by creating Web forms that post content.


    Needs such as these raise a series of practical questions. What is the fastest
    way to update the look or structure of a site? How can one design a site so that
    a non-technical content expert can contribute to it? How does one develop a site
    that customizes itself to the needs and interests of the user? And finally, how
    does one accomplish all these goals at the same time?


    In response to these issues, a whole new series of technology solutions have appeared
    as solutions to Web development problems: cascading style sheets (CSS), ColdFusion,
    ASP, SQL, database servers, XHTML, DHTML, XML, Web services, ADO, CDO, JavaScript,
    Flash, PHP, Java, .NET, XSLT, and more. Web development software, such as Macromedia
    Dreamweaver MX 2004, has kept up so that developers can create sites using any
    of the technologies just mentioned. But for the HTML jockey of yesteryear, this
    onslaught of technical solutions may seem as problematic as the problems they
    purport to solve.


    Increasingly, mastering many of these technologies is part of the core skill set
    of today''s Web developers. The goal of this book is to set you well on your way
    to that goal. The central project of this book transforms a static Web site into
    an interactive, easy to maintain, and standards-compliant site. The site is for
    a fictional travel tour operator, called Newland Tours. By the time you are done,
    site visitors will be able to home in on the content they are looking for quickly
    and easily. In addition, the non-technical users who own the site will be able
    to update it without having to know any HTML code. These are ambitious but attainable
    goals; and thanks to Dreamweaver''s tools and environment, they are easier to
    achieve than you might think.


    In this lesson, you will get familiar with the book''s starting and ending points.
    You''ll open the site as it exists today within Dreamweaver. The first task will
    be to create a new page; imagine that before you start overhauling the site, the
    client needs you to create a missing page immediately. Once the immediate crisis
    is passed, you''ll go over'
