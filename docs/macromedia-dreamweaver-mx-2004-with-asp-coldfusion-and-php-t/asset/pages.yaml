    \   \n+   The Apache installer is entirely self-explanatory, with one exception:\
    \ the Server Information screen. This screen tells Apache how developers and users\
    \ alike should access the server. If you were installing Apache on a network server,\
    \ you'd have to specify the computer name and domain, but since you are only installing\
    \ it for use on a single machine, you can just enter localhost.\n\n![](img/43fd0127a958864ab2d93e28efe683e7_129_0.png)"
  merge: -1
