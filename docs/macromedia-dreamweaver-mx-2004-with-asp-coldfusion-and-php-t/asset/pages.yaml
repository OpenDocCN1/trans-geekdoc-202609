- pgno: 340
  md: '![](img/43fd0127a958864ab2d93e28efe683e7_340_0.png)


    # IMPLEMENTING RECORDSET PAGING


    Other than the two links near the bottom of the description, which link to other
    applications (the country profiles and tour price calculator applications), the
    description is complete. One glaring problem, however, is that Newland Tours appears
    to only offer one tour (the one to Argentina). You need to make the output loop
    so that it includes each of the tour descriptions, not just the first one returned.


    You used a Repeat Region server behavior in Lesson 10 to output each of the country
    names on profiles.asp. You''ll use that behavior again with the descriptions to
    output more than one. The problem, though, is that unlike with the country names
    you output on profiles.asp, which contained a country name only, here you will
    be outputting an entire description, complete with an image. That could result
    in a long page and download time.


    The functionality of the page would be better if you could limit the number of
    records shown, so that, for example, only five descriptions appeared at once,
    and users could navigate back and forth through them. This is possible—and quite
    easy—using a set of built-in Dreamweaver server behaviors. The Repeat Region behavior
    lets you limit the number of records (in this case, tour descriptions) that are
    displayed on a page. Another behavior, called Recordset Navigation Bar, automates
    the process of creating the First, Previous, Next, and Last links (or buttons)
    that enable users to access all of the descriptions. You''ll use both behaviors
    in this task to create the desired functionality.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '+   1) Drag to select everything from (and including) the horizontal rule through
    the “Price this tour with the Tour Price Calculator” paragraph.


    This will be the repeated region. You don’t want to include the copyright notice
    or the second Find Tours link in the repeated region—those should appear beneath
    all the tours.


    ![](img/43fd0127a958864ab2d93e28efe683e7_341_0.png)


    +   2) Use the Server Behaviors panel to add a Repeat Region behavior to the selection.


    In the Repeat Region dialog, enter 5 for the number of records to be shown at
    a time.


    Click OK.


    ![](img/43fd0127a958864ab2d93e28efe683e7_341_1.png)


    A Repeat Region square is drawn around the entire selection, indicating its boundaries.


    +   3) Save, upload, and press F12 to test the page, to view it in a browser.


    You’ll see the first five records, listed alphabetically by country name. The
    first is still Highlights of Argentina, while the last record on the page should
    be Highlights of France.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '![](img/43fd0127a958864ab2d93e28efe683e7_342_0.png)


    At this point, though, there is no way for you to display the next five records
    or skip to the end. You are stuck with only the first five tour descriptions.


    # 4) Return to Dreamweaver, and insert an empty line beneath the Repeat Region
    area. With the insertion point in that empty line, choose Insert > Application
    Objects > Recordset Paging > Recordset Navigation Bar.


    This “application object” is actually a group of server behaviors. It creates
    First, Previous, Next, and Last links or buttons (your choice). Each of these
    links tells ASP, ColdFusion, or PHP which five recordsets to show when they are
    clicked. In addition, if the user is viewing the first set of recordsets, the
    First and Previous links/buttons will be hidden, because they don’t apply. Likewise,
    the Next and Last links/buttons won’t be visible if the user is browsing the final
    set of records. All four links/buttons are visible in the middle.


    5) In the Recordset Navigation Bar dialog, accept the defaults (rs_tourDetail
    as the Recordset, and Text as the Display Using option), and click OK.


    ![](img/43fd0127a958864ab2d93e28efe683e7_342_1.png)'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'When you are finished, you’ll see a new table added to the page, containing
    the four links. If you look in the Server Behaviors panel near the bottom, you’ll
    also see several new behaviors, including several that begin, “Show if not...”
    and several “Move to XXX Record.” Again, these are the individual behaviors created
    when you add a recordset navigation bar.


    ![](img/43fd0127a958864ab2d93e28efe683e7_343_0.png)


    You can build this type of navigation bar manually, if you like, since all the
    server behaviors you need are individually available in the Server Behaviors panel,
    in the Recordset Paging and Show Region portions of the menu.


    +   6) Click anywhere inside the table that contains the four links, select the
    right-most <table> tag in the tag selector, and use the Property inspector to
    set the cell padding to 3, the cell spacing to 0, and the border to 1.'
  merge: -1
  img_proc: true
- pgno: 344
  md: '![](img/43fd0127a958864ab2d93e28efe683e7_344_0.png)


    By default, the table that holds the links is invisible. Often, that''s OK, but
    given how prominent other elements on the page are, the navigation bar is easily
    overlooked.

    By giving it a border, you make it stand out a bit more.


    # 7) Save, upload, and press F12 to test the page. Use the navigation bar to move
    backward and forward through the records.


    The navigation works as expected. The only problem is that the table holding the
    navigation bar doesn''t look quite right on the first and last pages. That''s
    because it is illegal in HTML to have table cells with no content. On the first
    and last pages, the conditional regions are suppressing the First/Previous or
    the Next/Last links, so the cells are empty. You can get around this by adding
    a blank space to each cell.


    ![](img/43fd0127a958864ab2d93e28efe683e7_344_1.png)'
  merge: -1
  img_proc: true
- pgno: 345
  md: '8) One at a time, click after each link (ASP and PHP users) and choose Insert
    > HTML> Special Characters > Non-Breaking Space. ColdFusion users will have to
    go into code view and insert &nbsp; (the non-breaking space HTML character entity)
    anywhere between each opening and closing <td> and </td> tag, but outside of the
    <cfif> blocks contained inside.


    Though the space is obviously invisible, it fulfills the need to have some content
    inside every table cell. If you test the file again, the table will look normal.


    Before or after doesn''t make any difference, as long as the space is entered
    outside the conditional region. Clicking after the link in ColdFusion tends to
    put the link inside, so I suggest that ColdFusion users type in the non-breaking
    space character manually.


    | 50% (371) | 31% (107) | 23% (78) | 23% (73) |

    | :--- | :--- | :--- | :--- |

    | Show First | Show Previous | Show Next | Show Last |


    NON-BREAKING SPACE ADDED (ASP AND PHP)


    ![](img/43fd0127a958864ab2d93e28efe683e7_345_0.png)


    &nbsp; MANUALLY ENTERED INTO CODE (COLDFUSION)'
  merge: -1
  img_proc: true
- pgno: 346
  md: 'Users can now browse through all of the tour descriptions, five at a time.
    The descriptions are laid out and attractive, and the recordset navigation bar
    makes it easy to go back and forth through the recordsets. Before you wrap up
    the lesson, you need to add two more pieces of functionality.


    At the bottom of each description should be two links. The first link is a country
    name that takes users to the country’s profile on profiles_detail.asp. The second
    link takes users to the tour price calculator (tourprice.asp). You can’t simply
    create a link to these two pages, however. You need to pass data to both pages
    as well, so that the pages know which tour description the user was reading when
    she or he clicked the link.


    Handling this functionality is easy in the case of the country profiles. As you’ll
    recall, the country profiles page uses a URL parameter, countryID, to determine
    which country to show. This URL parameter appears when the user clicks the country
    name on profiles.asp. To get the same functionality, you’ll need to add the same
    URL parameter to the link on tours_detail.asp.


    The tour price calculator link will be somewhat more complicated. That page has
    a dynamically generated drop-down menu listing all of the tours. But if the user
    is reading Highlights of Italy, then clicks the Price This Tour with the Tour
    Price Calculator link, and arrives at the tour price calculator form, he or she
    wants to see the price for Highlights of Italy (not the default option of Biking
    from Oxford to London). Again, the solution is similar to the country profile
    link—you just need to send the page some extra data. But the tour price calculator
    is a little more complicated, because it isn’t ready to receive and use that data;
    this is in contrast to the country profiles page, which is already expecting the
    countryID URL parameter. You’ll take care of this (and a couple other issues)
    in this task.


    First, let’s take care of the link to the country profiles page.


    +   1) Select the dynamic text that appears at the end of the “Learn more about”
    paragraph. In the Property inspector, type abc as a placeholder to create a link.'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'Just as in Lesson 10, the placeholder URL will be replaced as soon as you attach

    dynamic data. But you need to put something there to create the link in the first
    place.


    ![](img/43fd0127a958864ab2d93e28efe683e7_347_0.png)


    2) With the dynamic text still selected, click countryID in the Bindings panel,
    make

    sure that a.href is selected in the Bind To menu, and click Bind.


    This step binds the value of countryID to the URL. Currently, the href attribute
    of

    the URL contains only a number. You need to go back and type in the main URL

    itself, as well as the variable name for the URL parameter.


    ![](img/43fd0127a958864ab2d93e28efe683e7_347_1.png)'
  merge: -1
  img_proc: true
- pgno: 348
  md: '3) With the link still selected, in the Link field of the Property inspector,
    position the insertion point at the very beginning, before the dynamic code, and
    enter profiles_detail.asp?countryID=.


    This is the link to the page itself, and after the server has resolved all the
    code, the countryID value will be appended just after the = sign. The profiles_detail.asp
    page will function correctly at this point. If you like, you can test this page
    and click one of the country name links, to be sure.


    ![](img/43fd0127a958864ab2d93e28efe683e7_348_0.png)


    4) In the final paragraph of the description, select the words Tour Price Calculator.
    Enter abc in the Property inspector''s Link field to add a link. Using the same
    technique as before, use the Bindings panel to bind tourID to a.href in the Bind
    To drop-down menu.


    Once again, abc is replaced with the tourID value. You still need to go back and
    add the rest of the URL.


    ![](img/43fd0127a958864ab2d93e28efe683e7_348_1.png)


    5) Position the cursor at the beginning of the Property inspector''s Link field,
    and type the following URL before the dynamic text: tourprice.asp?tou rID=. Save
    and close tours_detail.asp.


    Once you have completed this step, you have added the functionality that sends
    the tourID value to tourprice.asp. Unfortunately, nothing on that page is expecting
    that value, so nothing happens.'
  merge: -1
  img_proc: true
- pgno: 349
  md: '6) Open tourprice.asp, and open the Bindings panel. Add a new Request.Querystring
    (ASP) or URL (ColdFusion and PHP) variable called tourID.


    ![](img/43fd0127a958864ab2d93e28efe683e7_349_0.png)


    By creating this binding, you make the URL variable sent from tours_detail.asp
    available on this page. In the next step, you''ll bind this information to the
    menu, so that the correct tour is highlighted automatically.


    In the ColdFusion and PHP server models, previously defined URL, form, and cookie
    variables tend to stick around for a long time, which can be useful or annoying,
    depending on whether you often reuse certain variables. For example, the myPet
    variable from the temporary widget that you built in Lesson 5 is still listed
    in the Bindings panel. Old variables like these do no harm, but if the clutter
    starts annoying you, you might consider deleting them. To delete a binding, simply
    click and press the Delete key (or the Removing Binding [minus] button). If the
    binding you delete is the last or only binding in a category (e.g., cookie), then
    that whole category disappears. Deleting a binding from this panel does not affect
    any of the bindings you have dragged onto any page.


