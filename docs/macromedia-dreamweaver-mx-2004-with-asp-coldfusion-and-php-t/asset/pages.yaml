- pgno: 187
  md: '# WRITING THE CODE TO SEND A MESSAGE


    In this task, you''ll create a page that sends an email message to your email
    address. The content of the message will be hard-coded initially. That is, if
    you send yourself 20 messages, they''ll all have the same subject and body content.
    Once you have verified that it works, you can build a front-end form for the mail
    message and change the hard-coded values to dynamic form values.


    +   1) Open generic_template.asp, choose File > Save As, and name the new file
    messageSent.asp.


    This new file will do the work of generating and sending the email message and
    will inform the user that the message has been sent.


    +   2) Replace the placeholder title with Message Sent. Replace the placeholder
    body text with Your message has been sent. You should hear from us within two
    days. Insert a new paragraph with the text, Return to Newland Home, and link the
    word Home to index.asp.


    You can see the payoff for having created the template already. The new page literally
    takes seconds to create and customize.


    ![](img/43fd0127a958864ab2d93e28efe683e7_187_0.png)


    What''s lacking at this point is the functionality that will generate and send
    the email. Before dealing with this issue, let''s pause for a moment to discuss
    objects. Many modern computer languages—including most languages used for Web
    programming—contain them, so it''s a good concept to master.


    # UNDERSTANDING OBJECTS, METHODS, AND PROPERTIES


    Programming languages are developed to solve certain problems or enable certain
    functionalities—they don''t just pop up from nowhere. For example, Flash ActionScript
    was created to enable developers to get the most out of native Flash capabilities
    and features. For this reason, several features of ActionScript are unique to
    Flash, and these features distinguish ActionScript from languages similar to it,
    such as JavaScript.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'ASP, ColdFusion, and PHP are no different. Each was designed to enable dynamic
    Web site functionality within the context of the HTTP protocol. Their respective
    developers knew that you would want to do certain tasks, such as send data between
    pages, connect to databases, and generate email messages. To simplify these tasks,
    each language includes built-in objects. Objects are generic entities created
    for the purpose of simplifying a given task. For example, ASP''s Message object
    makes it easy to create and send new mail messages from within ASP.


    **TIP** Strictly speaking, the Message object doesn''t belong to ASP, but rather
    to a larger class of objects built into Windows 2000 and XP, and available to
    IIS. This nuance has little consequence for our purposes, and I only mention it
    here for accuracy.


    To use an object, you must first create an instance of it. If you''ve ever used
    a Library in Macromedia Flash, Fireworks, or Dreamweaver, you are already familiar
    with the relationship. The object, or more properly, class, exists in potential
    only; you can''t directly use the class itself. When you make an instance of it,
    you make a unique copy of that class, but you also customize it for its surroundings.
    You might think of it as the difference between the scientific definition of homo
    sapiens on the one hand, and an individual person on the other. All members of
    homo sapiens have height, hair color, and weight attributes. But these values
    differ for each person.


    Most object classes have built-in features. Generally, these fit into two categories:
    properties and methods. Some objects even have child objects with their own properties
    and methods. Properties are descriptive attributes. To use the homo sapiens example,
    height, hair color, birthday, present location, and weight are all properties.
    Methods are what the object can do. Humans can walk, dance, sing, and sleep; each
    of these would be a method of the homo sapiens. When you create an instance of
    an object, you often define its properties. When you want something to happen,
    you call one or more of its methods.


    Finally, when you create an object instance, you usually need to give it a unique
    ID, or name. This name enables the script to keep track of it, since you can usually
    use multiple instances of the same object in the same script or document. Once
    again, humans have names for the same reason—names help us identify and refer
    to each other.


    To summarize, you can achieve specific kinds of functionality in scripts by using
    built-in objects. To use an object, you must create an instance of it. To enable
    the script to properly identify your instance, you give it a unique name. Finally,
    to make use of the instance (and accomplish your task), you set its properties
    and call its methods.'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'In the steps that follow, ASP users will write a script in which they can see
    each of these steps in action. ColdFusion and PHP users will discover that their
    respective languages hide much of this complexity, though traces of it are still
    visible.


    The following steps are separated to reflect the different stages of using an
    object.


    NOTE These steps continue from the last task, “Writing the Code to Send a Message.”


    +   3) Using the code view, position the cursor at the beginning of line 2 (that
    is, just before the opening <html> tag) and press Enter/Return several times.

    +   In this step, you are merely making room for a new script.


    +   4) ASP and ColdFusion Users Only: To instantiate and give identity to a new
    mail object, enter the following code:

    +   For ASP:


    ```

    <%

    theSchema="http://schemas.microsoft.com/cdo/configuration/"

    Set cdoConfig=server.CreateObject("CDO.Configuration")

    cdoConfig.Fields.Item(theSchema & "sendusing")= 2

    cdoConfig.Fields.Item(theSchema & "smtpserver")="your.SMTP.server.com"

    cdoConfig.Fields.Update


    set cdoMessage=Server.CreateObject("CDO.Message")

    cdoMessage.Configuration=cdoConfig

    %>

    ```


    For ColdFusion:


    ```

    <cfmail>

    </cfmail>

    ```


    ASP users: be sure to replace the highlighted code “your.SMTP.server.com” with

    the name or IP address of your actual SMTP server. This is most likely the same

    server as the one listed for outgoing email in your email client, such as Microsoft

    Outlook Express.


    The ColdFusion code is fairly self-explanatory: These two tags tell ColdFusion
    to

    create a new mail object. It still needs help before it’s useful, but at least
    you’ve

    created it. Behind the scenes, ColdFusion also gives this mail object a unique
    ID,

    so in this simple step you have accomplished several tasks.


    The ASP code is (not surprisingly) somewhat more cryptic. In the first code block,
    you

    provide the information ASP needs to actually connect to the mail server. It’s
    cryptic,

    to be sure, but you should be able to use it as-is on any modern Windows server.'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'The second code block in ASP, which you''ll add to momentarily, instantiates
    the Message object.


    ```

    1 <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-t

    2

    3 <%

    4

    5   theSchema="http://schemas.microsoft.com/cdo/configuration/"

