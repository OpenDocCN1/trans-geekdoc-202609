- pgno: 182
  md: '# INTRODUCING SMTP EMAIL SERVICE


    The mail service that you will use in this chapter is SMTP. SMTP, or Simple Mail
    Transfer Protocol, is an Internet standard for sending email messages that can
    be received and correctly interpreted by a number of different clients, including
    POP3 and IMAP.


    Perhaps the most important thing to understand about SMTP is that it is used for
    sending mail, not for receiving it. Thus, in this chapter, when you configure
    your server to use SMTP mail, you are enabling your Web applications to send messages.
    But you are not creating a full-fledged email service. There are extensions and
    other solutions that enable you to make your local workstation able to send and
    receive messages, but doing so is beyond the scope of this book.


    The goal in this lesson is to make it possible to generate messages from within
    your Web applications and send them over the Internet—a useful capability, as
    you will soon see.


    # CONFIGURING YOUR SYSTEM TO SEND SMTP EMAIL MESSAGES


    Before you can send email from within a Web application, you need to ensure that
    the server hosting the application can send email. Some of you are using IIS locally
    to develop ASP pages, some are using ColdFusion locally, some are using Apache
    locally, and some are connecting to remote servers that have any combination of
    ASP, ColdFusion, and/or PHP on them. Depending on how you are connecting to your
    server, you need to follow a different set of steps in this task, as outlined
    in the following list:


    +   • ASP users developing locally with IIS (Windows 2000 or Windows XP) should
    read the section, “Configuring IIS to Send Email (ASP Users).”


    +   • ColdFusion users developing locally should skip ahead to the section, “Configuring
    ColdFusion to Send Email.”


    +   • PHP users developing locally with Apache, unfortunately, are out of luck.
    Apache does not support SMTP mail. You can (and should) still work through this
    chapter, but you won’t be able to actually send messages. However, if at some
    later point you can upload to a production Web server at an ISP, then the pages
    will work as intended. Go ahead and skip to the section, “Writing the Code to
    Send a Message.”


    +   • ASP, ColdFusion, or PHP users developing on remote servers (using a mapped
    network drive or FTP) need to verify with their server administrator that the
    server is SMTP email-enabled, and likewise verify that their folder on that server
    has permission to send SMTP email messages. Once verified, skip ahead to the section,
    “Writing the Code to Send a Message.”'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# CONFIGURING IIS TO SEND EMAIL (ASP USERS)


    You should read this section if you are using ASP on a local copy of the IIS server
    (Windows 2000 or XP). Chances are your system is already configured to use SMTP
    email, but you need to verify that. And if for some reason SMTP service is not
    installed, you''ll need to install it. following the steps provided below.


    +   1) Open the Windows Control Panel, and access the Add/Remove Programs dialog.
    Click the Add/Remove Windows Components button.


    ![](img/43fd0127a958864ab2d93e28efe683e7_183_0.png)


    When you click the Add/Remove Windows Components button, a second dialog, the
    Windows Components Wizard, appears.


    As you probably know, you not only maintain installed programs through the Add/Remove
    Programs portion of the Control Panel, but you also maintain the installation
    and configuration of Windows. Since IIS is a part of Windows 2000 and Windows
    XP, you can add and remove its installed components through this dialog.


    +   2) In the Windows Component Wizard, click to select Internet Information Services
    (IIS), and click the Details button.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '![](img/43fd0127a958864ab2d93e28efe683e7_184_0.png)


    The Internet Information Services (IIS) dialog opens. Use this dialog to install
    and uninstall IIS components, including SMTP service.


    +   3) Scroll down (if necessary) and verify that SMTP Service is checked.


    If it is already checked, then SMTP outgoing email service is already installed.


    If it is not checked, then SMTP is not installed. When you check it, Windows will
    install it and start it for you.


    ![](img/43fd0127a958864ab2d93e28efe683e7_184_1.png)


    +   4) Click OK to accept the changes in the Internet Information Services (IIS)
    dialog, and then click Next to have Windows finish the installation.


    At this point, outgoing SMTP mail service is installed. You can skip ahead to
    the section, “Writing the Code to Send a Message.”'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# CONFIGURING COLDFUSION TO SEND EMAIL


    You should read this section if you are using ColdFusion locally on your workstation.
    Configuring outgoing SMTP service for ColdFusion is easily handled using ColdFusion''s
    Administrator application.


    +   1) From the Start menu, open Macromedia > Macromedia ColdFusion MX > Administrator.


    The path within your Start menu may vary, if you have customized it.


    When the page opens, you''ll need to log in. Once you do, you will see the ColdFusion
    administrator. You use this page for a number of ColdFusion administration settings,
    and you''ll use it later in the book to create a datasource, which will enable
    you to use database content on the Newland Tours page.


    ![](img/43fd0127a958864ab2d93e28efe683e7_185_0.png)


    +   2) Click the Mail link from the left navigation bar, in the Server Settings
    category.


    You see a page containing several settings for the mail server. You can leave
    all of them, with the exception of the Internet or IP address of your outgoing
    mail server, at their defaults.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '![](img/43fd0127a958864ab2d93e28efe683e7_186_0.png)


    +   3) In the Mail Server field, enter the Internet or IP address of your outgoing
    mail server.


    If you are not sure of your outgoing mail server''s address, look inside the account
    settings of your email software. They should be the same.


    For example, in Outlook Express, look in Tools > Accounts. Select your email account,
    and click Properties. Click the Servers tab, and copy the address in the Outgoing
    mail (SMTP) field. The menus and commands in other email clients may vary, but
    the outgoing Internet or IP address information should be available somewhere
    in the interface.


    +   4) Click the Submit button at the top or bottom of the page.


    ColdFusion updates the settings, and as long as the SMTP address you entered is
    valid, it will work as expected.'
