    # INSTALLING THE NEWLAND TOURS DATABASE ON A REMOTE SERVER


    Unfortunately, I can''t tell you how to install the newland_tours database into
    a remote MySQL server. Only your ISP can tell you how to do it.


    In my experience, many Linux-based ISPs offer a utility for maintaining MySQL
    databases remotely, called phpMyAdmin. phpMyAdmin is a Web-based interface, which
    lists all of the databases to which your account has access. It lets you view
    the data in your databases, see the SQL code used to generate each table, and
    it has a host of database maintenance features that make it easy to add new tables,
    modify existing ones, and even drop tables and even whole databases. The following
    screenshot provides a glimpse of phpMyAdmin.'
