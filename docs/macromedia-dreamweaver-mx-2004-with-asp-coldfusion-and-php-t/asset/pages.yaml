- pgno: 369
  md: '**TIP** Remember, in ASP, the & character is used to concatenate, or connect,
    text strings. The . character in PHP has the same purpose. Concatenation is necessary
    in both cases, because you are mixing literal strings (the majority of the SQL
    statements) that ASP or PHP should pass on without evaluating, and special ASP
    or PHP code that ASP/PHP should evaluate, such as ASP''s `Request.QueryString()`
    and PHP''s `$_GET()`. Strings are in quotes, while expressions are not. Combining
    the two requires you to concatenate—hence the use of & and . in these code blocks.
    ColdFusion doesn''t have this problem, because it uses hash signs (#...#) to mark
    up expressions that ColdFusion should evaluate.


    So what does this addition to the query do? It creates another criterion, which
    further limits the original search. The original search retrieves all of the information
    needed to build all of the tour descriptions. This query does that, too, except
    it limits the set to those tours whose countries share the same regionID as the
    one passed as a URL parameter.


    Let''s look at an example. Each tour has a field specifying its country. This
    country listing is, as you''ll recall, a foreign key, which points to tbl_country.
    So both tours that take place in France have the countryID for France as one of
    their records. This shared field links the tours table to the country table, in
    this case, linking all tours in France to the record for the country France in
    tbl_country.


    One of the fields that each country has is a foreign key for the region table.
    Thus, the record for France has a 3 in its region field, because 3 is the regionID
    for Europe, which contains France. Europe also contains the United Kingdom and
    Italy, so each of these countries'' region fields also contains a 3. Japan''s
    region value is 4, which is the regionID for East Asia. Therefore, all of the
    tours that list Japan as their country are related to a regionID of 4, and not
    of 1 or 3. Because Thailand is also in East Asia and has a regionID of 4, all
    of its tours are related to regionID 4.


    To summarize, then, each regionID has a one-to-many relationship with countries.
    That is, each region may have several countries that belong to it. Likewise, each
    country has a one-to-many relationship with tours, which means that a single country
    can have multiple tours. However, no country can belong to multiple regions, and
    no tour can go to multiple countries. Therefore, you can write a query that retrieves
    tours where the tour''s country belongs to a given region, and only those tours
    will be retrieved, and all others will be excluded.


    That''s what you''ve specified with this `WHERE` clause in the SQL statement.
    Test the file to make sure it works as expected.'
  merge: -1
  img_proc: true
