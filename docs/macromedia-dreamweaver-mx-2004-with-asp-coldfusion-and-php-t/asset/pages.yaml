- pgno: 34
  md: '![](img/43fd0127a958864ab2d93e28efe683e7_34_0.png)


    5) In design view, position the cursor just before If you are interested, and
    click the Insert Image button from the Common category of the Insert bar.


    Images are inserted inline with the HTML and text that surrounds them, so it is
    important to choose the insertion point carefully.


    Notice that beside the Insert Images button is a small arrow, indicating a drop-down
    menu. Clicking the arrow reveals many other image-related assets that you can
    insert from this menu, including image placeholders, interactive Fireworks HTML/images,
    rollovers, hotspots, and more. You won''t use these features in this book, but
    be aware that they are there. Several other buttons in the Insert bar hide similar
    commands.


    ![](img/43fd0127a958864ab2d93e28efe683e7_34_1.png)'
  merge: -1
  img_proc: true
- pgno: 35
  md: '6) In the Select Image Source dialog, browse to fountain_versailles.jpg, in
    the site''s images folder. Click OK.


    In addition to enabling you to browse to the image, so Dreamweaver can write the
    correct path to it from contact.htm, this dialog contains several other features
    and options. These include an image preview, information about the size and dimensions
    of the image, and options regarding the type of link, document or site root relative
    (it defaults to document relative, which is what you want).


    ![](img/43fd0127a958864ab2d93e28efe683e7_35_0.png)


    At the top of the dialog, there is an option, Select File Name From. Your choices
    are File system (that is, you browse to the file on your computer) or Data sources
    (that is, you dynamically pull the URL from a database); you''ll work extensively
    with both approaches throughout the book. In this step, verify that File system
    is selected.


    7) With the image selected on the page, use the Property inspector to change the
    image''s Align setting to Left.


    The default setting usually causes the image to render to the left of one line
    of text, with all other text wrapping beneath the image. The result is a considerable
    amount of wasted page space. By choosing Left (or its opposite, Right), the image
    is rendered so that text wraps around it.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '![](img/43fd0127a958864ab2d93e28efe683e7_36_0.png)


    8) Position the insertion point before the words By Mail, and click the Insert
    Table button from the Insert bar.


    In this step, you are preparing to insert a table, which will hold information
    on how users can contact Newland Tours. Tables can be used to present tabular
    data, as one would expect. Tables can also be used as a page layout tool. In the
    next steps, you will create a simple table that presents street address, email
    address, and phone in a two-column format.


    ![](img/43fd0127a958864ab2d93e28efe683e7_36_1.png)


    INSERT TABLE


    9) In the Insert Table dialog, specify 2 Rows, 2 Columns, a Table width of 400
    pixels, a Border thickness of 1, Cell padding of 3, and Cell spacing of 0. In
    the Accessibility section, enter Newland Tours contact information as the Summary.
    Click OK.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'These settings will result in a 4-cell table that is 400 pixels wide. Cell
    padding measures the space between cell borders and cell contents. Cell spacing
    measures the distance between cells. When you fill out the Summary information,
    Dreamweaver adds a summary attribute to the `<table>` tag that screen readers
    use to give vision-impaired users a quick glance at what the table contains.


    ![](img/43fd0127a958864ab2d93e28efe683e7_37_0.png)


    +   10) Triple-click the words **By Mail** to select their entire paragraph (just
    those two words). Drag the selected paragraph into the top-left cell of the table.
    Likewise, triple-click to select and then drag the words **By Email** or **Phone**
    into the top-right cell. Drag to select the three paragraphs with the mailing
    address into the lower-left cell, and drag the email and phone information into
    the lower-right cell. Dreamweaver moves both the text blocks and all the enclosing
    `<p>` tags into the appropriate cells.


    Notice that the address, phone, and email information have a lot of extra white
    space in between their lines.


    ![](img/43fd0127a958864ab2d93e28efe683e7_37_1.png)'
  merge: -1
  img_proc: true
- pgno: 38
  md: '11) Position the insert point just before 123 Wharton Street, and press Backspace
    (Windows) or Delete (Macintosh) to remove the paragraph break separating 123 Wharton
    Street from Newland Tours; that is, they should be on one line. With the insertion
    point between the two former lines of text, hold down the Shift key and press
    Enter (Windows) or Return (Macintosh).


    Whereas pressing Enter or Return causes Dreamweaver to create a new paragraph
    (<p>), Shift+Enter/Return causes Dreamweaver to insert a line break character
    (<br>).


    # Contact a Newland Tours Agent


    If you are interested in learning more about a tour, contact one of our agents:


    | By Mail | By Email or Phone |

    | :--- | :--- |

