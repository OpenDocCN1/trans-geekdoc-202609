- pgno: 438
  md: '# PLANNING FOR THE MASTER-DETAIL PAGES


    As you saw from your earlier experiences developing the country profile and tour
    description master-detail page sets, creating these sets often requires quite
    a few server behaviors and other dynamic elements working in unison.


    +   • You create a recordset to populate the menu on the master page.


    +   • Because you are dealing with multiple records, you often need to create
    a Recordset Navigation Bar, which itself is made of several behaviors, including
    the behaviors from the Show Region group as well as from the Recordset Paging
    group.


    +   • You output records using Dynamic Text, and apply the Repeat Region server
    behavior to ensure that all of the records are output.


    +   • If the records are hyperlinked, you bind a unique querystring or URL parameter
    to the href attribute.


    +   • A SQL statement that uses a dynamic value in a WHERE clause filters the
    recordset using criteria the user supplied on the master page.


    Building master-detail pages by hand can be slow and tedious. Dreamweaver speeds
    up the development of this common structure with a special application object
    that adds all of the needed server behaviors and creates the pages for you. This
    server object is called a Master-Detail Page Set, and is available in the Insert
    > Application Object menu. This is a very convenient tool, as you''ll see in this
    lesson.


    The Master-Detail Page Set object works by collecting all of the relevant information
    needed to build the page set. Some of this information is derived from a query,
    so you''ll have to create a recordset first. All told, the application object
    requires quite a bit of information, and a single mistake derails the entire process.
    For this reason, you should figure out what you want in advance. (When writing
    this lesson, it took me several tries in the dialog before getting it right, because
    I tried to cut this corner.)


    The main thing you need to sort out is what information you want to appear on
    the master page, and likewise what information you want to appear on the detail
    page. This information is all retrieved from a database, so what you are doing
    here is determining what you should retrieve in your initial recordset.


    For this master-detail page set, you want the master page to contain the following
    information as a menu, which should be sufficient for the employee to find and
    select the correct user account.


    Last Name First Name Username Current User Group'
  merge: -1
  img_proc: true
- pgno: 439
  md: 'The detail page should include the following information.


    Last Name   First Name   Current User Group


    In this case, ironically, the detail page contains less information than the master
    page. But remember, the purpose of this detail page is not to display lots of
    information about the record (as you would with a product description in an online
    catalog), but rather to offer extended functionality to the record (in this case,
    the power to update the record).


    At the very least, you will need to make the information shown above available
    to the page (via a recordset). But these four elements do not represent a complete
    listing of information needed from the database. Do you remember when you created
    the master-detail page sets for the country profile and tour descriptions that
    when users clicked the link a URL parameter was appended to the URL? This data
    for this URL parameter is needed to filter the query on the detail page, so it
    can display only the desired record. In this case, you need some piece of information
    that can cause the detail page to display one unique record. And any time you
    need to use something unique to identify a database record, you should immediately
    think of the table''s primary key, in this case, userID.


    To summarize, then, the recordset on which your master-detail page set will be
    built will require the following fields from tbl_users:


    +   userID

    +   firstName

    +   lastName

    +   username

    +   userGroup


    In addition, this data will need to be ordered alphabetically by last name to
    facilitate lookup, so you will need to sort on lastName, ascending. Go ahead and
    create this recordset now.


    +   1) In admin_addUser_master.asp, add a new recordset, called rs_registeredUsers,
    according to the specifications just outlined.


    By creating this recordset, you have made available the data needed to build the
    master-detail page set.


    Remember, it''s always a good idea to click the Test button in the Recordset dialog,
    just to make sure you are getting everything you need, and in the right order.'
  merge: -1
  img_proc: true
- pgno: 440
  md: '![](img/43fd0127a958864ab2d93e28efe683e7_440_0.png)


    +   2) Position the cursor on a new line below the directions, and choose Insert
