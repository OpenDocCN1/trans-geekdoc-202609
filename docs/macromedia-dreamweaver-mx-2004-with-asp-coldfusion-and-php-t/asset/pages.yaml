  img_proc: true
- pgno: 198
  md: '# # EMAILING DYNAMIC FORM VALUES


    Having worked through Lessons 4 and 5 and having sent form data from one page
    to another, you can probably complete this task without the steps printed here.
    Indeed, I challenge you to try it, only referring back if you get stuck or have
    a problem. Don''t forget to come back for the final section, “Client-Side Form
    Validation.”


    But before you put the book down and give it a go on your own, I want to point
    out the full complexity of what you are about to do. You have learned how to send
    and capture data using different scopes—cookies, form, querystrings, and so on.
    You have learned how to display dynamic text, using ASP’s Response.Write(), ColdFusion’s
    <cfoutput>, and PHP’s echo. In this lesson, you learned about objects, and in
    particular, how your server model has objects dedicated to sending SMTP email.
    Individually, passing data between pages and mail objects have nothing to do with
    each other.


    But in this final task of the lesson, you will bring together these two disparate
    techniques to create a specific functionality not explicitly built into ASP or
    ColdFusion. You have created your own application by combining different tools
    and technologies (HTML, HTTP requests, and ASP/ColdFusion/PHP communication objects).
    In a way, this convergence stands metaphorically for all of dynamic Web site development:
    You combine different objects and techniques to empower the user to make use of
    information and communication tools in an open-ended way.


    +   1) Open messageSent.asp in code view.

    +   Design view won''t help you here, since the code you need to change isn''t
    even visible on the page.


    +   2) Find the sender email address in the mail code, and replace it with the
    appropriate form variable, as follows:

    +   For ASP, change the first appearance of your email address to Request.Form("emailAddress").

    +   For ColdFusion, replace from="yourname@yourserver.com" with from="#form.emailAddress#".

    +   As mentioned earlier, PHP doesn''t have a simple, foolproof way to specify
    the sender, and the sender is optional for PHP anyway, so you can skip this step.
    Again, there are ways to specify a sender, so work with your ISP to find out how
    you can do it within the context of their servers.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'Rather than always printing your email address in the From portion of your
