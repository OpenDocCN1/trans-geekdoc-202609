  img_proc: true
- pgno: 285
  md: 'This is an important issue, because Web documents have a way of hanging around
    for years—often longer than the developers do. For your own sake, and the sake
    of your successor, you should document your code, so everyone knows what it’s
    doing.


    You document the code using comments, which are pieces of information added to
    code that tell readers what the code does, but which are ignored by computers
    interpreting the code. In this final section, you’ll go through tourprice.asp
    and tourprice_processor.asp and comment the code blocks.


    +   1) Open tourprice.asp. Add a comment just above the query.


    In ASP, add a new line below the opening `<%` at the beginning of the query (just
    before `Dim rs_tourprices`), and type the following:


    ```

    '' Creates a recordset of all the tour names and IDs from the tbl_tours table
    in

    =>the database. This data is used later to populate the form drop-down menu.

    ```


    In ColdFusion, type the following at the top of the document:


    ```

    <!---Creates a recordset of all the tour names and IDs from the tbl_tours table
    in

    =>the database. This data is used later to populate the form drop-down menu. --->

    ```


    In PHP, type the following just before the line that begins `mysql_select_db`,
    which should be around line 3:


    ```

    // Creates a recordset of all the tour names and IDs from the tbl_tours table
    in

    =>the database. The data is used later to populate the form drop-down menu.

    ```


    In all three languages, comments are denoted in a special way. In ASP’s VBScript,
    you use the single quote ('') character. Everything from that character until
    the end of the line is commented out, or ignored by the interpreter. In ColdFusion,
    you wrap the comment in special comment tags. In fact, they are the same as HTML
    comment tags, except they use three dashes instead of two. ColdFusion comments
    can span multiple lines. Single-line PHP comments can be prefaced with two slashes
    (//) or a single hash mark (#). You can also create multiple-line comments in
    PHP by wrapping the comment as follows: /* my comment */.


    Because these comments are in the language of the server (VBScript, ColdFusion
    Markup Language, or PHP, as opposed to HTML), they are stripped out of the document
    before it is sent to the client. This means you can document your code as much
    as you like and not worry about users being able to see it.'
  merge: -1
  img_proc: true
