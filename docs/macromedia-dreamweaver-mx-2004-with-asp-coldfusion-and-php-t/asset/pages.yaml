- pgno: 493
  md: 'I bolded the opening and closing portions of the `<option>` tag just to make
    them easier to read—especially the closing angled bracket (`>`), which looks orphaned
    in ASP, ColdFusion, and PHP. (That bracket, by the way, should be orange in the
    code editor for all three server models.) The reason for this is that `selected`
    must be written before that closing bracket, so that bracket alone goes on the
    right of the `if` section of code, while the remainder of its tag goes on the
    left of the `if` section.


    ```

    63     <td name="region">"region"</td>

    64     <%

    65     Do Until rs_regions.EOF

