- pgno: 406
  md: 'ASP users can test the whole log-in application. Open register.asp, and create
    a profile. Then log in with your username and password. As always, try to break
    the application as well. Register the same name twice. Try logging in with the
    wrong password. Try typing your phone number instead of your email. And so on.


    ColdFusion users have a quick chore to do before they can test the application:
    They need to create the application.cfm file that governs the Web application
    framework. ASP users don''t have to worry about creating a global.asa file—ASP
    will handle session management just fine without it.


    PHP users may have a quick chore of their own. Depending on your configuration,
    session management may not be set up properly. This problem typically crops up
    for Windows PHP users, but not Macintosh PHP users. See the section, “Ensuring
    Session Management is Enabled (Windows PHP Users Only)” later in the lesson for
    details.


    # CREATING APPLICATION.CFM (COLDFUSION ONLY)


    One of the functions of the Log In User server behavior is that it creates a session
    variable when the user successfully logs in. The problem is, the session scope
    is inactive by default, which means that the log-in page won’t work. You’ll have
    to activate session management in the ColdFusion Web Application Framework. Doing
    so is a simple matter of creating a new file (Application.cfm), and entering a
    single line of code.


    +   1) Create a new page in code view. Delete all of the code on the page, including
    any HTML, XML, or other tags or code.


    Application.cfm is not a regular Web page, and so it should not have any code
    on it to begin.


    +   2) In the first line, type the following code:


    ```

    <cfapplication sessionmanagement="yes" setclientcookies="yes" name=" =>"newland_tours"
    sessiontimeout="#CreateTimeSpan(0, 0, 20, 0)#"/>

    ```


    The <cfapplication> tag effectively creates an application and enables the Web
    application framework. It has several attributes, many of which are optional.
    One required attribute is name, which is any name you want to give your application.
    The other attributes used here enable session management, enable the setting of
    cookies, and create a session timeout.'
  merge: -1
  img_proc: true
- pgno: 407
  md: 'You''ll note that rather than specifying a simple period of time in the sessiontimeout
    attribute, there is a function. CreateTimeSpan(). This function takes four parameters,
    standing for days, hours, minutes, and seconds. Thus, the sessiontimeout is set
    for 20 minutes. In other words, if a user is inactive or leaves the site to browse
    on other pages for more than 20 minutes, all session variables associated with
    that user are flushed. In practical terms, it means the user would have to log
    in again.


    ![](img/43fd0127a958864ab2d93e28efe683e7_407_0.png)


    # 3) Save, close, and upload Application.cfm.


    At this point you can test the registration and log-in features you''ve added
    in this lesson. As mentioned earlier, try to break the application, by entering
    every variation you can think of.


    # ENSURING SESSION MANAGEMENT IS ENABLED (WINDOWS PHP USERS ONLY)


    When you install PHP using the default settings, session management is enabled.
    When PHP actually starts using sessions, it stores transaction information in
    a text file. This text file is already setup when you install PHP as well, or
    at least it is supposed to be. Unfortunately, the default setup for some versions
    of PHP in Windows uses the wrong path to find that text file. What results are
    some unseenly errors.


    ![](img/43fd0127a958864ab2d93e28efe683e7_407_1.png)'
  merge: -1
  img_proc: true
- pgno: 408
  md: 'If you do not see this error when you test login.php, then you can skip ahead
    to the section, “Restricting Access to Pages.”


    If you look closely at the error, you will see that it is trying to open a file
    with the most unlikely path, something along the lines of /tmp\sess_sess_6002c7a1f3cba0838a2d56d8e659b615,
    0_RDWR). What makes this path so unusual is that it begins with a forward slash
    (/), and yet all Windows paths use backslashes (\). This is presumably a bug that
    comes from PHP''s Unix origins; paths in Unix (including Mac OS X) are all forward
    slashes. Worse yet, the folder it is looking for (tmp) doesn''t exist!


    Fixing this problem is relatively easy, and requires two steps:


    +   - Revise the .ini file that specifies what path PHP should use to map to the
    session directory

    +   - Create the directory that the .ini file actually points to.


    # 1) Navigate to C:\windows\php.ini. Double-click to open it in Notepad.


    This file contains most of the configuration instructions for your implementation
    of PHP. Remember, in the Unix world, the most common interface is not the dialog
    box or wizard, but rather the text file.


    # 2) Use Edit > Find to search for session.save_path. Find the path that specifies
    the save directory.


    ![](img/43fd0127a958864ab2d93e28efe683e7_408_0.png)


    Remember, anything following a semi-colon is commented out and probably documentation.
    Thus, it''s most likely that the first instance of session.save_path you discover
    will be a part of the documentation, and not the problem itself.'
  merge: -1
  img_proc: true
- pgno: 409
  md: "The instance you want is followed by a path. Your path probably varies from\
    \ the one shown in the screenshot. In fact, that's the problem!\n\n```\n[Session]\n\
    ; Handler used to store/retrieve data.\n; session.save_handler = files\n\n; Argument\
    \ passed to save_handler. In the case of files, this is the path\n; where data\
    \ files are stored. Note: Windows users have to change this\n; variable in order\
    \ to use PHP's session functions.\n;\n; As of PHP 4.0.1, you can define the path\
    \ as:\n;\n;     session.save_path = \"N;/path\"\n;\n; where N is an integer. Instead\
    \ of storing all the session files in\n; /path, what this will do is use subdirectories\
    \ N-levels deep, and\n; store the session data in those directories. This is useful\
    \ if you\n; or your OS have problems with lots of files in one directory, and\
    \ is\n; a more efficient layout for servers that handle lots of sessions.\n;\n\
    ; NOTE 1: PHP will not create this directory structure automatically.\n;     \
    \    You can use the script in the ext/session dir for that purpose.\n; NOTE 2:\
    \ See the section on garbage collection below if you choose to\n;         use\
    \ subdirectories for session storage\n; The file storage module creates files\
    \ using mode 600 by default.\n; You can change this by using\n;\n;     session.save_path\
    \ = \"N;MODE;/path\"\n;\n; where MODE is the octal representation of the mode.\
    \ Note that this\n; does not overwrite the process's umask.\nsession.save_path\
    \ = \"C:\\\\PHP-4.1.2-Win32\\\\temp\"\n\n; whether to use cookies.\n; session.use_cookies\
    \ = 1\n\n; This option enables administrators to make their users invulnerable\
    \ to\n; attacks which involve passing session ids in URLs; defaults to 0.\n; session.use_only_cookies\
    \ = 1\n```\n\n# 3) Revise the path so that it corresponds to the following formula:\n\
    \n```\nC:\\php-[version_number]-Win32\\temp\\\n```\n\nThat is, type exactly what\
    \ you see above, but replace [version_number] with the actual version number of\
    \ your copy of PHP.\n\nIf you forgot the version number of your copy of PHP, look\
    \ in the C:\\ directory on your hard drive. Indeed, what you are listing there\
    \ is the name of that folder, and not your version number per se, though usually\
    \ the version number is a part of the directory name.\n\n```\nNOTE 1: PHP will\
    \ not create this directory structure automatically.\nNOTE 2: You can use the\
    \ script in the ext/session dir for that purpose.\n        See the section on\
    \ garbage collection below if you choose to\n        use subdirectories for session\
    \ storage\nsession.save_path = C:\\PHP-4.1.2-Win32\\temp\\\n\nwhether to use cookies.\n\
    session.use_cookies = 1\n```\n\n# 4) Save and close php.ini.\n\nYou've just updated\
    \ where PHP stores session information.\n\n# 5) Use the Apache icon in the system\
    \ tray to stop and restart Apache.\n\nThis forces php.ini to reload and actually\
    \ applies the new settings.\n\n![](img/43fd0127a958864ab2d93e28efe683e7_409_0.png)"
  merge: -1
  img_proc: true
