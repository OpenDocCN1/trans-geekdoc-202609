- pgno: 441
  md: 'When you choose to show 20 records at a time, you are providing Dreamweaver
    with the information it needs to insert a Recordset Navigation Bar server object
    for you. Given that the number of registered users will likely grow to many, a
    recordset navigation bar is a good idea. Otherwise, employees are forced to download
    potentially hundreds of records all at once.


    ![](img/43fd0127a958864ab2d93e28efe683e7_441_0.png)


    4) In the lower half of the Master-Detail Page Set dialog, type or browse to admin_addUser_detail.asp.
    Select userID and click the minus button to remove it. Select username and click
    the minus button to remove it. Click OK.


    Dreamweaver may take a moment at this point, because it is adding quite a few
    server behaviors to two different pages. When it is done, though, the master-detail
    page set should be complete and functional.


    The master page may be quite a bit wider now than it was before. This stretching
    accommodates the pseudocode strings Dreamweaver has inserted in each of the cells
    (for example, rs_registeredUsers.lastName). The actual data that will go in these
    fields is not as wide as the pseudocode, so the page will not appear stretched
    at all when viewed in the browser, so just disregard the stretching in Dreamweaver.
    Most important, do not try to fix it.'
  merge: -1
  img_proc: true
