- pgno: 415
  md: '# # managing content with forms


    # ## LESSON 14


    A content management system, as its name suggests, is an interface that facilitates
    the maintenance of content, including the addition of new content, the modification
    of existing content, and the removal of unwanted content. In this and the next
    two lessons, you will make steps toward building a content management system (CMS)
    for the Newland Tour''s site. You won''t build a fully comprehensive CMS, which
    is an ambitious and often redundant task, making it of limited value in this book.
    But you will build enough of it to get a sense of how they work, and the know-how
    to start building your own.


    By inserting some HTML as the default text in a text area, you can provide users
    a template for creating formatted text.


    ![](img/43fd0127a958864ab2d93e28efe683e7_415_0.png)


    By inserting some HTML as the default text in a text area, you can provide users
    a template for creating formatted text.'
  merge: -1
  img_proc: true
- pgno: 416
  md: 'How do CMSs work? You can look at this question as a functional question (how
    can Web content be maintained over the Web?) or as a technical question (how do
    we use available technologies to make this possible?). Whenever you face a problem
    like this, answer the functional question first, and then worry about the technical
    answer.


    In practice, CMSs typically include several pages with forms on them. When users
    fill out the forms, whatever they entered appears on the site. You don''t want
    these forms to be accessible to the public, which is why you created the log-in
    framework first. You have probably guessed how this process from form to Web works:
    database connectivity. You know that the contents of a Web page can be populated
    by database data, and you know that you can capture user-entered information from
    a form and put it in a database. Put two and two together, and voila! A content
    management system.


    In 2002, Macromedia released a revolutionary new approach to content management,
    called Contribute. Contribute, now in its second version, enables non-technical
    users to maintain site content in a friendly, office productivity tool-like environment.
    Contribute has both advantages and disadvantages compared to a CMS using a database
    and ASP, ColdFusion, or PHP. As a Web editor, Contribute enables users to format
    content much more robustly and easily than the best database-driven CMS. And unlike
    database-driven sites with ASP, ColdFusion, or PHP, Contribute doesn''t require
    significant programming up-front to achieve the most basic functionality. Because
    it works mainly with static sites, Contribute is generally a less expensive solution.
    On the down side, Contribute doesn''t work with live database content. In addition,
    whereas updating a database-driven Web site requires a browser and Internet access,
    updating a site with Contribute requires Internet access and a copy of Contribute,
    which, though inexpensive, is not free.


    As a rule, use Contribute for text- and image-heavy static sites whose contents
    need occasional updating, and use dynamic pages and a database for highly structured
    or data-oriented sites whose contents change frequently, or on sites whose contents
    need to be searchable. Many enterprise sites make use of both databases and server-side
    scripting (such as ASP, ColdFusion, or PHP) and Contribute—using each according
    to its strengths.


    Back to the CMS we''ll begin in this lesson. Content maintenance implies three
    abilities: inserting content, modifying content, and deleting content. If you
    know any SQL, you are probably aware of the INSERT, UPDATE, and DELETE statements,
    which make it possible to insert, modify, and delete data from a database. If
    you don''t know SQL, don''t worry: you''ll get practice with each of these statements
    in this and the next two'
  merge: -1
  img_proc: true
- pgno: 417
  md: 'lessons. You will use these in your queries, rather than simple SELECT statements,
    to make content manageable.


    The primary task remaining is to create form interfaces that serve as the front-end
    for the work going on in the background. Some of these, especially those for inserting
    data, are quite easy to create. In fact, by building the registration form, you''ve
    already created one. Updating and deleting data are a little trickier, because
    you have to retrieve data from the database and make it available to the user,
    so she or he can send the requisite queries back to the database to do the actual
    updating or deleting.


    In this lesson, you will create the simplest portion of the CMS: the form that
    Newland Tours employees can use to update the Traveler''s Journal on the homepage.
    This functionality requires only a single page, a single form, and a single server
    behavior (Insert Record).


    # WHAT YOU WILL LEARN


    In this lesson, you will:


    +   - Empower nontechnical users to add formatted content to a Web page instantly

    +   - Create an admin section for the site, including a new template

    +   - Use and customize a text area form element

    +   - Track user activity with session variables and hidden fields

    +   - Learn about SQL''s INSERT statement

    +   - Use the Insert Record server behavior


    # APPROXIMATE TIME


    This lesson takes approximately 45 minutes to complete.


    # LESSON FILES


    Starting Files:

    Lesson14/Start/newland/generic_template.asp

    Lesson14/Start/newland/index.asp


    Completed Files:

    Lesson14/Complete/newland/admin_template.asp

    Lesson14/Complete/newland/admin_index.asp

    Lesson14/Complete/newland/admin_update_tj.asp

    Lesson14/Complete/newland/index.asp'
  merge: -1
  img_proc: true
