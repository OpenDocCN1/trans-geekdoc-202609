    # FINDING IMAGES WITHOUT THE alt ATTRIBUTE


    At this point, the Newland site meets the XHTML standard, so you''ve succeeded
    in the main goal of the lesson, which was to upgrade the site to XHTML. One problem
    remains, and while it''s not strictly speaking related to XHTML, it is a code
    issue: Many of the images lack the alt attribute. As you recall, the alt attribute
    of the tag provides a description of an image, which is used by those who have
    no access to the image, for instance, because they are using a screen reader or
    because they are using a text-only browser.


    This change is also hard to automate, since every image should have a different
    alt attribute. You''ll use Find and Replace a couple of different ways in this
    task. First, you''ll use it to add alt text to the four images that make up the
    banner on all of the pages. Second, you''ll use it to find the remaining images
    that are lacking the alt attribute.'
