- pgno: 191
  md: 'For PHP, type the following code:


    ```

    <?

    mail(''yourname@yourserver.com'',''This is the message subject'',''This is the

    =message body.'' );

    ?>

    ```


    Both ASP and ColdFusion require you to specify who the message is from, to whom

    it is being sent, the subject, and the body text itself.


    +   • ColdFusion uses easy-to-read attribute="value" syntax. The body of the message

    +   appears between the <cfmail> tags (as opposed to inside the opening <cfmail>
    tag,

    +   like the other attributes). The action of the message—the fact that you want
    to

    +   send it—is implied in ColdFusion.


    NOTE For ASP, you call the Send method, which means that you are explicitly telling

    ASP to send the message. Before doing that, you populate a number of the Message
    object''s

    properties, including the sender and recipient''s email addresses, as well as
    the subject line and

    message body. After invoking the Send method, you destroy both the cdoMessage
    and cdoConfig

    objects. In doing so, you make it possible for the page to send a different message
    using the same

    objects in the future.


    The completed script for ASP looks as follows:


    ```

    <%

    theSchema="http://schemas.microsoft.com/cdo/configuration/"

    Set cdoConfig=server.CreateObject("CDO.Configuration")

    cdoConfig.Fields.Item(theSchema & "sendusing")=2

    cdoConfig.Fields.Item(theSchema & "smtpserver")="your.SMTP.server.com"

    cdoConfig.Fields.Update


    set cdoMessage=Server.CreateObject("CDO.Message")

    cdoMessage.Configuration=cdoConfig

    cdoMessage.From="yourname@yourserver.com"

    cdoMessage.To="yourname@yourserver.com"

    cdoMessage.Subject="This is the message subject"

    cdoMessage.TextBody="This is the message body"

    cdoMessage.Send


    Set cdoMessage=Nothing

    Set cdoConfig=Nothing

    %>

    ```'
  merge: -1
  img_proc: true
- pgno: 192
  md: '![](img/43fd0127a958864ab2d93e28efe683e7_192_0.png)


    The completed script for ColdFusion looks as follows:


    ```

    <cfmail from="yourname@yourserver.com" to="yourname@yourserver.com"

    subject="This is the Message Subject">

    This is the message body.

    </cfmail>

    ```


    Like those of ASP and ColdFusion, the PHP block also requires you to specify the
    recipient, subject, and message. However, it does not require you to specify the
    sender. In addition, the ability to specify a sender depends on external factors,
    most importantly, the operating system and mail server that you are pointing PHP
    to use. For the sake of this book, you won''t need to specify a sender. You can
    learn more about specifying a sender in PHP''s mail() function at the following
    URL: http://www.php.net/manual/en/function.mail.php.


    +   6) Save and Put the file on your remote server. Click anywhere in the document
    and press F12 to test it.


    When your browser opens, you should see the message indicating that the message
    has been sent. If you see an error message, and you''ve double-checked the spelling
    in your code, there is something wrong with your server''s mail configuration.
    If you are using a staging or production server with your work or ISP, you can
    contact the server administrator for troubleshooting.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'If you are working on a standalone machine running IIS, you can try to troubleshoot
    on your own. In this instance, troubleshooting this issue may be more trouble
    than it''s worth. The point is that you should understand the code and know that
    it will work on a production server, provided that it is configured to allow email
    to be sent. But dropping everything to spend potentially several frustrating hours
    debugging your server is not the most effective way to learn dynamic Web development;
    you might just want to move on.


    Now for the acid test: Check your email. You should have a received a message,
    like the one shown in the screenshot, except with your own email address. Needless
    to say, this is not the most exciting email message you''ve ever received, and
    since it''s hard-coded to contain that text, it''s not likely to improve.


    ![](img/43fd0127a958864ab2d93e28efe683e7_193_0.png)


    If you did not receive the message, then one of several things could have gone
    wrong. By far the most likely is that your server is not properly configured to
    send SMTP email messages. Users with IIS might check Control Panel > Administrative
    Tools > Services and make sure that Simple Mail Transport Protocol is listed as
    Started. You can also look in Control Panel > Administrative Tools > Internet
    Information Services (XP) or Internet Services Manager (Windows 2000), select
    the computer with the server, and explore the Default SMTP Virtual Server''s properties.'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'If you are using ColdFusion, most likely you did not enter the correct Internet
    or IP address of your outgoing SMTP mail server.


    +   7) Close messageSent.asp.


    Now that you have the messaging itself working, you need to make it useful, by
    putting meaningful content into the message. To do that, you''ll use a form to
    collect the message data from the user, and then you''ll send that data to the
    mail object, which in turn will send it (ostensibly) to Newland Tours staff.


    # CREATING THE WEB FORM


    In this task, you will create a form to collect data from the user, and you will
    send that data to messageSent.asp. Before you continue and start reading through
    the steps, test your knowledge. How do you send data to messageSent.asp? Should
    you use GET or POST? What fields should the form contain?


    +   1) Open contact.asp. Change the table on the page containing the mailing,
    phone, and email information so it appears as in the screenshot. Also, change
    the first body paragraph so it reflects the new page structure.


    One benefit of placing your email address in server-side code is that spammers
    have no access to it. If you put your email address on the page, as in the current
    version of the site, spammers'' automated email address harvesting tools have
    easy access to it and can (and will) add it to their lists. By switching to a
    mail-based form, you keep your email address more private.


    ![](img/43fd0127a958864ab2d93e28efe683e7_194_0.png)'
  merge: -1
  img_proc: true
- pgno: 195
  md: '2) Position the insertion point below the image caption, and choose Insert
    > Form > Form to create a new form. Without moving the insertion point, choose
    Insert > Table, providing the following settings. Click OK.

    Rows: 4

    Columns: 2

    Width: 95 Percent

    Border: 0

    Cell Padding: 3

    Cell Spacing: 0


    People often forget that they can put all sorts of HTML inside tables. By using
    a table, you can present your form in a more structured way.


    ![](img/43fd0127a958864ab2d93e28efe683e7_195_0.png)


    3) Insert two text fields, one text area, and a Submit button in the right column
    of the table. In the first three cells of the left column, enter the following
    text: Your Email Address, Subject, Message Body.


    In this step, you are building the presentation of the table. You are not yet
    dealing with its data—e.g., naming the fields you’ve created or worrying about
    the form’s action statement. You’ll get to those shortly.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '**TIP** Sometimes Dreamweaver has screen redraw problems when you add or remove
    large contents to or from table cells. For example, during this step, the dashed
    border of the form may appear to cut through the table. Remember, though, that
    this is merely a screen refresh problem; there is nothing wrong with the underlying
