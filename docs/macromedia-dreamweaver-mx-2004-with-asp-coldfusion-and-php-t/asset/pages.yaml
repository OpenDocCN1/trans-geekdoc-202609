  img_proc: true
- pgno: 49
  md: '4) In the navigation bar at the top of the screen, click Find Tours. Scroll
    up and down the page, or use the internal navigation links near the top, to look
    over the tours.


    This page is problematic in many different ways.


    ![](img/43fd0127a958864ab2d93e28efe683e7_49_0.png)


    Let''s start with the problems that the client faces with a page like this. Once
    again, the page is hard to maintain, because Newland Tours doesn''t have an IT
    department. This issue is a serious problem from the client''s point of view,
    because the information on this page is the primary source of information users
    have about the tours. The business problem that the client faces is that the tours
    change—some get added, some get removed. Worse, prices fluctuate so often that
    the client decided not to post them at the site, given the difficulty of keeping
    them up to date and the consequences if they did not. In addition, Newland Tours
    offers several more tours than listed here, but no one has had the opportunity
    to add them. This means that the client is losing business, thanks to the Web
    site''s difficulty to maintain.


    From the user''s standpoint, the page is not very usable. It is extremely long,
    and it is hard to find tours of interest. There is no way to filter tours, other
    than checking out the tours listed in a particular region. For example, Newland
    Tours offers some tours that are exercise-intensive and others that are not; users
    have no way to filter out only those that are exercise-intensive. And, of course,
    the fact that the prices aren''t'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'listed doesn''t give the users any way of knowing how much the tours cost,
    unless they make a phone call.


    As developers, we should observe that much of the information on this page is
    structurally redundant. That is, every tour has a title, an image, a description,
    and so on. Such a predictable structure should make us think that this information
    would be better stored in a database and pulled in on the fly. This would simplify
    maintenance and create the possibility of filtering, which would enhance the page’s
    usability.


    # 5) In the navigation bar at the top of the page, click the Country Profiles
    button.


    ![](img/43fd0127a958864ab2d93e28efe683e7_50_0.png)


    Almost every problem identified on the previous page also exists here. The page
    is hard to maintain, making it hard for Newland Tours staff to add countries to
    which they now offer tours. Users may incorrectly assume that Newland Tours doesn’t
    offer any tours to, say, Italy, because it’s not on this list. But Newland Tours
    does offer a tour to Italy, so the Web site is sending a counter-productive message
    to its users.


    The problem also persists for users. Few users will want to learn about *all*
    of the countries that Newland Tours serves; they’ll just want to see the ones
    they are interested in. Again, a simple filtering mechanism would make all the
    difference.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'Another usability issue is that to go from a tour about Namibia''s Etosha National
    Park to the Namibia country profile, the user has to scroll back up to the navigation
    bar, click Country Profiles, and scroll down to Namibia. It would be nice to automatically
    link from the Etosha National Park information to the Namibia country profile.
    But that would require extra coding using static HTML.


    # 6) Return to the navigation bar, and click the Contact an Agent link.


    This is the file that you developed earlier in the lesson to replace the version
    that was lost.


    ![](img/43fd0127a958864ab2d93e28efe683e7_51_0.png)


    This simple table doesn''t change very often, and it''s easy enough to use. One
    thing about this page that the client doesn''t like is the fact that the email
    address appears directly on the page: About a week after the page was posted with
    this email address, spammers started flooding the account with weight loss, debt
    reduction, and other less savory messages.


    Another problem is that some of Newland Tours'' customers don''t have email clients
    automatically configured or were confused when the email client opened.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'The client would like some way for customers to be able to contact Newland
    Tours without having to rely on an email client configuration. Also, the client
    would like to find a way to discourage spammers from flooding the accounts with
    junk.


    The solution, of course, is to use a Web form. A form is perfect because it demands
    very little of the user, and it is possible to hide the email address, which will
    prevent spam bots (automated programs that crawl the Web “harvesting” email addresses
    for spammers) from finding Newland Tours agents’ email addresses. Forms also make
    it possible to send the email address to a different address depending on its
    contents. For example, if a form asks the user to select a region, you can create
    a script that emails the form data only to the agent specializing in that region.
    You won’t create that functionality in the course of this book, but by the time
    you are done, you should certainly have the wherewithal to do it.


    # A GLIMPSE OF THE FUTURE


    Though this lesson has yielded only a static Web page to show for itself, you
    have actually done more than you may realize, and you have worked through a step
    that is too often shortcutted—with disastrous consequences. You’ve conducted a
    thorough assessment of the site, including code, business processes, and (indirectly)
    usability. You have a clear idea about what you need to do. For convenience, here
    is a summary of the site upgrade project goals:


    +   * Upgrade HTML code to XHTML

    +   * Improve site accessibility and usability

    +   * Store structured and/or frequently updated content in a database

    +   * Provide search and/or filtering mechanisms to enable users to find tours
    and country profiles more easily

    +   * Develop a Web form that enables users to contact Newland Tours staff, without
    having to use email

    +   * Develop a series of Web forms that enable Newland Tours staff to add, update,
    and delete content stored in the database (remember that the content stored in
    the database is also the source material that appears on the Web site)


    If some of this sounds a bit abstract, look at the final version of the site as
    it will appear at the end of the book.'
  merge: -1
  img_proc: true
- pgno: 53
