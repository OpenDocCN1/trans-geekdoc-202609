- pgno: 179
  md: '# sending email from a web form


    # LESSON 6


    You are now experienced at sending data between pages in several different ways.

    Sending data between pages is helpful to users, because it creates a cohesive

    experience. Sending data is even more useful for Web site owners, since it allows

    them to offer customized services via the Web, based on choices users make.

    In a word, sending data between pages enables a group of pages to function

    together as a single unit—no mean accomplishment given the forgetfulness

    of the HTTP protocol.


    ![](img/43fd0127a958864ab2d93e28efe683e7_179_0.png)


    You''ll use the data collected from this form to generate an email message to
    yourself.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'Though passing data between pages is useful, pages are not the only places
    you''ll need to send your data. Sometimes, you''ll want to send it to an information
    storage warehouse, such as a database. Other times, you''ll want to send the information
    directly to a reader. In this lesson, you''ll see how to collect information from
    the user at the Newland Tours Web site and send it to a Newland Tours travel agent.
    (Of course, since Newland Tours doesn''t really exist, you''ll have to settle
    for sending the messages to yourself to test the functionality.)


    In this lesson, you''ll learn how to configure your system to send email messages,
    if you are running IIS or ColdFusion locally.


    If you are running Apache and PHP locally, on Windows or Macintosh, you unfortunately
    won''t be able to send messages. PHP is fully capable of sending messages, and
    instructions are provided in this chapter. However, Apache doesn''t have a built-in
    mail server, unlike IIS and ColdFusion. Most ISPs hosting Apache/PHP sites have
    dedicated mail servers, so in a real world PHP implementation, you should be able
    to use the code discussed in this lesson. You just won''t be able to actually
    test it, unless you are using ASP/IIS, ColdFusion, or you are already saving your
    files at an ISP (any server model) that offers mail service.


    In addition to configuring a mail server, if applicable, you''ll make use of special
    mail objects. You may have heard the term "objects," as in "object-oriented programming,"
    and not known exactly what that means. When working with ASP, you encounter many
    objects and have to deal with the initially unfamiliar syntax.


    To those new to programming, objects can be intimidating. But the truth is, the
    objects in object-oriented programming (OOP) are conceptually modeled on tangible
    objects in the real world. That is, the whole point of OOP is to make programming
    easier, more approachable, and easier to maintain. But at first, you may feel
    that objects are unnecessarily complex. This, despite the fact that most of their
    complexity is deliberately hidden, even as their power is made available to you.
    ColdFusion and PHP users don''t work explicitly with objects the way ASP users
    do, but objects are never far, sometimes hidden in the underlying code.


    This lesson requires some hand-coding. Again, as user-friendly as Dreamweaver''s
    interface is, sometimes you have to go behind the page design, behind the wizards
    and dialogs, and type your own code. Don''t worry: I assume you have no programming
    experience and will walk you through it, step-by-step with detailed explanations.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# WHAT YOU WILL LEARN


    In this lesson, you will:


    +   - Configure IIS or ColdFusion to send email messages, if you are developing
    locally using IIS or ColdFusion

    +   - Use mail objects to generate an email from a Web page

    +   - Create a form to collect data from the user

    +   - Populate the email message with form data

    +   - Deploy client-side form validation


    # APPROXIMATE TIME


    This lesson takes approximately one hour to complete.


    # LESSON FILES


