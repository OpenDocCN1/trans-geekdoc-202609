- pgno: 278
  md: '# # CREATING FILTERED RECORDSETS


    Twice now, once each in this lesson and the preceding one, you have created recordsets
    and displayed their data. In both cases, you just retrieved all of the information
    stored in the database and bound it to the page. But you have a different problem
    now. To get the calculator to function properly, you need to plug in the adult
    and child prices for the selected tour—not all of the tours and not the first
    tour, but the one that the user selected.


    How''s that going to work? The user selected a tour from the menu on the form
    and submitted it. On tourprice_processor.asp, the tourID associated with that
    tour has been included as a form variable. Thus, when you query the database,
    you’ll construct something along the following lines (in pseudocode):


    ```

    Retrieve the adult price (basePriceAdult) and the child price (basePriceChild)

    from tbl_tours where tourID equals the tourID submitted by the user on the form.

    ```


    It is very helpful to formulate your intentions very clearly before attempting
    any sort of programming, even if the programming (in this case SQL programming)
    is masked behind a graphic interface: Dreamweaver’s Recordset dialog.


    +   1) Open tourprice_processor.asp. Use the Bindings panel to open the Recordset
    dialog.


    When you create a recordset in Dreamweaver, it persists in the individual page
    only:


    +   2) Enter rs_tourprices_filtered as the Name, conn_Newland as the Connection,
    tbl_tours as the Table, Selected in the Columns category, with the following fields
    selected: tourID, tourName, basePriceAdult, and basePriceChild.


    As it stands (which you could see for yourself by clicking Test), this query returns
    data from all 19 records in tbl_tours in the four fields you specified. But you
    want the query to return only the data for the tour that the user specified in
    the form.


    ![](img/43fd0127a958864ab2d93e28efe683e7_278_0.png)'
  merge: -1
  img_proc: true
