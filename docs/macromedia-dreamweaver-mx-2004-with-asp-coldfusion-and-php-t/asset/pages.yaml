- pgno: 127
  md: 'Your choice here ultimately affects the URL you use to view ColdFusion pages,
    which is important when configuring Dreamweaver later in the lesson.


    # 7) Continue to finish the wizard, which is self-explanatory from this point
    forward.


    > NOTE During the installation, you will be asked to enter a password. Do not
    forget this password! You will need it to configure the ColdFusion server, and
    you will also need it to access ColdFusion from within Dreamweaver during development
    time.


    The installation process may take several minutes to run, as it installs the ColdFusion
    server and starts it up.


    When you are finished, a browser opens, which lets you into the ColdFusion administrator
    application. This application is itself running in ColdFusion. After logging in,
    you''ll be prompted to enter a password for RDS login. You will need this password
    to use many application development features in Dreamweaver, so do not disable
    this feature here, and enter a password that you can remember.


    You''ll need to click Next a couple more times and wait a few more minutes as
    ColdFusion finalizes the setup process. When you are dumped into the ColdFusion
    administrator application, you have finished the setup and can begin developing.


    # SETTING UP A LOCAL ENVIRONMENT FOR APACHE/PHP


    Setting up a local environment using the open source Apache and PHP setup can
    be difficult and frustrating for Windows and Macintosh users who are largely unfamiliar
    with Unix systems. Two reasons for the frustration are that there are often multiple
    versions of the same software available, and there are usually multiple ways of
    installing and configuring it.


    But the biggest reason why Windows and Macintosh users are often intimidated by
    Apache/PHP setup is that the way users interface with the software is fundamentally
    different from what they''re used to. Windows and Macintosh users are accustomed
    to interfacing with the computers through dialogs, windows, and wizards. To set
    up IIS, for example, you access a dialog through the Windows Control Panel. To
    configure ColdFusion, you access a special Web page, where you fill out nicely
    designed and well documented Web forms. To configure PHP, Apache, and (later)
    MySQL, you will need to open and manually edit text files buried in nested application
    directories. A single typo can cause the system to malfunction or cease functioning
    altogether (until you fix it), and you''ll be given little guidance what to do
    while you are in the text document. Such is the price of open source technologies.'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'This section walks both Windows and Macintosh users through the process, albeit
    at a slightly generalized level. The reason for this is that the exact steps are
    likely to change (in minor ways) between the time I write this and the time you
    read it.


    You begin by downloading the latest versions of the Apache Web server and the
    PHP module software, both available for free on the Web. You should install Apache
    before attempting to install PHP, because PHP is dependent on a Web server.


    **NOTE** Windows users with IIS running on their machines may be tempted to just
    install the PHP module directly into IIS, and skip installing Apache altogether.
    This approach is certainly workable, but it has a drawback: Very few ISPs that
    offer PHP have it running on an IIS server. That is, PHP is almost invariably
    paired with Apache. Since it is generally desirable for your development environment
    to resemble, as closely as possible, your eventual production environment, it
    is worth installing Apache. Also, it is good practice, just to familiarize yourself
    with the Apache environment—the permissions structures, the commands, the interface,
    and so on.


    When you download Apache, PHP, or MySQL, in addition to different versions for
    different operating systems, you''ll also usually see options to download the
    Source or the Binary files. The source code is the non-compiled code that actually
    runs these products. Before it can be installed and used, it must be compiled,
    that is, converted to 0s and 1s, also known as binary code. The binary code has
    already been compiled for you, and it is ready to install on your system. With
    commercial products, such as Microsoft or Macromedia products, you never have
    the option of seeing the source code—what comes on the CD is the binary file.
    One benefit of being able to access the source code is that you can change it.
    However, I assume that if you are reading this book, you are probably not at a
    point where you want to rewrite portions of the programming code behind Apache
    or PHP! Also, if you get the source code, you have to go through the additional
    trouble of converting it to a binary file. Thus, for the purposes of this book,
    I strongly recommend that you take the easy way out and download the binary file.


    # # INSTALLING APACHE FOR WINDOWS


    To download and install the Apache Web server for Windows, follow these instructions.


    **NOTE** The following instructions assume that IIS is not already running as
    the local Web server. Setup and configuration varies if Apache is not the only
    Web server.


    +   1) Go to the following URL, read the instructions, and click the Download
    link.


    http://httpd.apache.org/'
  merge: -1
  img_proc: true
- pgno: 129
  md: "In addition to downloading the Web server itself, this site contains numerous\
    \ useful resources for Web developers.\n\n+   2) Find the Windows Binary file\
    \ for the most current production release, and click its link.\n+   At the time\
    \ of this writing, the most current production release was 2.0.47.\n\n+   3) Save\
    \ the file to disk, and wait for it to download.\n+   At the time of this writing,\
