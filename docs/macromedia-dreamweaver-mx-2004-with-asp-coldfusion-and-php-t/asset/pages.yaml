    \ in the Bindings panel. The screenshot is for ASP. ColdFusion and PHP users will\
    \ see two categories of variable: Form (with firstName nested inside) and URL\
    \ (with firstName nested inside).\n\n![](img/43fd0127a958864ab2d93e28efe683e7_162_0.png)\n\
    \n+   7) Repeat step 6 to add a Request.Querystring/URL Variable for the lastName\
    \ variable.\n+   \n+   Again, the Bindings panel should update, and you should\
    \ now see three variables defined: two versions of firstName and one of lastName.\n\
    \n![](img/43fd0127a958864ab2d93e28efe683e7_162_1.png)"
  merge: -1
  img_proc: true
- pgno: 163
  md: 'It might seem odd to have the same variable—firstName—listed twice. But as
    far as ASP, ColdFusion, and PHP are concerned, these are two completely different
    variables. One is a form variable, and is only retrievable from the body of the
    HTTP request. The other is a querystring variable, which is only retrievable from
    the URL itself. This concept—where variables are available only in a designated
    place—is known as **variable scope**. A variable’s scope includes the place(s)
    where the variable exists, and excludes the places it does not. The lastName variable
    exists only as a URL querystring. If ASP, ColdFusion, or PHP looks for it in the
    request body, it won’t find it: The request body is outside of the querystring
    scope.


    Scoping variables is a fundamental task in any programming language. Without it,
    you would have no way of ensuring both that data is available when you need it
    and that two different pieces of data don’t inadvertently share the same name.


    By changing the form’s method from POST to GET, you change the firstName variable’s
    scope. By making these changes in the Bindings panel, you gave your server-side
    code access to the appropriate scope. There are many more scopes than form and
    querystring variables (as you doubtless noticed when working in the Bindings panel),
    but conceptually, they all work the same way.


    +   8) Click to select the blue-shaded {Form.firstName} dynamic text on the page,
    and press Delete to remove it. Position the insertion point just before the second
    comma, click QueryString.firstName (ASP) or URL » firstName (ColdFusion and PHP)
    in the Bindings panel, and press Insert.


    When you are finished, you should see a new blue-shaded dynamic text block that
    contains {QueryString.firstName} (ASP) or {URL.firstName} (ColdFusion and PHP).


    ![](img/43fd0127a958864ab2d93e28efe683e7_163_0.png)'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'Now that you understand scope, you probably also can read Dreamweaver''s dynamic
    text pseudocode. The curly braces {} represent a dynamic code block, and inside
    is listed the scope, followed by a period, followed by a variable name. Dreamweaver
    pseudocode gives you quick access to the scope and name of all dynamic text.


    Looking beyond the pseudocode at the real code, you should see <%= Request.QueryString("firstName")
    %> embedded in the HTML on the ASP page, <cfoutput>#URL.firstName#</cfoutput>
    on the ColdFusion page, and <?php echo $_GET[''firstName'']; ?> on the PHP page.


    > **NOTE** In ColdFusion, values enclosed in #pound signs# are variables that
    ColdFusion must resolve before outputting. In the preceding example, if you omitted
    the pound signs, ColdFusion would write: “Thank you, URL.firstName, for filling
    out my page.” Once in pound signs, ColdFusion knows it needs to evaluate the variable
    in the pound signs—in this case, by outputting whatever value is stored in the
    firstName variable in the URL.


    +   **9)** Position the insertion point after the firstName block, and bind the
    QueryString.lastName or URL.lastName variable to the page.


    The two variables should appear side by side, so that the output displays the
    user’s entire name.


    > **NOTE** If the first and last names run together, which seems to happen in
    ASP but not ColdFusion or PHP, insert a non-breaking space character (&nbsp;)
    between the two.


    ![](img/43fd0127a958864ab2d93e28efe683e7_164_0.png)'
  merge: -1
  img_proc: true
- pgno: 165
  md: '10) Save test_form_processor.asp, and in the Site panel, Shift-select test_form.asp
    and test_form_processor.asp and click the Put File(s) button.

    Remember, you can''t test your files unless you upload them to the server.


    11) Click test_form.asp in the Site panel, and press F12 to test in a browser.
    Enter your first name and your last name, and click Submit.


    As you''ve anticipated, the page now thanks you, using your first and last name.


    ![](img/43fd0127a958864ab2d93e28efe683e7_165_0.png)


    What''s more of interest, though, is the URL. Appended to the page address is
    a question mark followed by three name-value pairs:


    ```

    http://localhost/newland/test_form_processor.asp?firstName=Yuki&lastName=Makimura&Submit=Submit

    ```


    The appended three variables are the querystring. The output first and last names
    are pulled directly out of the URL. This URL appears the same, regardless of server
    model, because querystrings are a part of the HTTP protocol itself, rather than
    a dynamic Web page technology.


    Generally, you should use POST, rather than GET, to send form data to be stored
    in a database, because with POST the data is not visible to the user. Imagine
    if your form requests that the user enter a username and password combo, and then
    that password is displayed for all to see in the URL! Also, you can embed quite
    a bit more data in the request body (using POST) than you could in a URL (using
    GET). For the sake of this exercise, though, GET is sufficient. As you will see
    momentarily, though, querystrings have some advantages that form variables don''t.


    12) Close your browser. In Dreamweaver''s Site panel, click test_form_processor.asp,
    and press F12.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '![](img/43fd0127a958864ab2d93e28efe683e7_166_0.png)


    This time, when you test the page, it lacks the querystring data that ASP, ColdFusion
    and PHP are expecting, because you closed the browser and flushed that data from
    memory. Interestingly, ASP and PHP handle this problem differently than ColdFusion.
    ASP and PHP display, “Thank you, , for filling out my form.” ColdFusion refuses
    to display the page at all, showing an error: “The page cannot be displayed.”


    One of the challenges of dynamic site development is to make sure that no user
    enters a page without all of the data that the page needs to process. If this
    happens, the result is often an error that confuses and frustrates users. The
    solution to this problem is twofold: Prevent users from accessing pages without
    sufficient data in the first place, and if that fails, catch the error and redirect
    users to an all-purpose error page that enables them to notify the Webmaster,
    which is better than them seeing a cryptic ASP, ColdFusion, or PHP error message.
    We’ll use several different types of validation during the course of this book
    to prevent users from accessing pages without the required data.


    # SENDING DATA WITH HYPERLINKS


    The querystring’s open display of data, though a problem for confidential information,
    has certain benefits. One of them is that you can embed data in hyperlinks. That
    is, you can collect information from users without requiring them to fill out
    a form. In this task, you will build a simple page, which, though a bit silly
    superficially, exhibits a couple of key dynamic Web site concepts in action.


    You will build a two-page mini-application that lets each user specify whether
    she or he is a cat person or a dog person. The first page contains two links—one
    for cats and one for dogs. The interesting thing about these links is that they
    both point to the same page. The links are differentiated in that each has a querystring
    appended to it with the chosen animal preference. On the second page, dynamic
    text is output, based on the selected link. If you first choose one animal, and
    then go back and choose the other, it will appear as if you went to two different
    pages, while in fact you went to only one, with different dynamic text values
    displaying.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '''This is an important concept. Think about a large e-commerce site, such as
    Amazon. Rather than having a different page for every single book they sell, they
    have only one product detail page, and the page is populated dynamically when
    the user selects a book. In other words, dynamic pages enable developers to drastically
    reduce the number of pages they must create and maintain, while simultaneously
    expanding the amount of content that their pages can show.


    So set aside the impracticality of this application for the time being. It forms
    the basis of the site maintenance functionality that you’ll build later in the
    Newland site.


    +   1) Choose File > New, and create a new dynamic page using ASP/VBScript, ColdFusion,
    or PHP. Make sure it''s XHTML-compliant.


    By choosing the correct document type in this dialog, you ensure that Dreamweaver
    will write the correct type of code for your site.


    ![](img/43fd0127a958864ab2d93e28efe683e7_167_0.png)


    +   2) In design view, type the text shown in the accompanying figure. Format
    the first one as an <h1> heading and the second two as body paragraph elements
    <p>.


    In this step, you are marking up just the static portion of the application.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '![](img/43fd0127a958864ab2d93e28efe683e7_168_0.png)


    +   3) Save the file as *animal_questions.asp*. Then choose File > Save As and
    save the page again, this time as *animal_home_page.asp*. Here you are both saving
    the file and creating a second page based on the first.


    +   4) Still in *animal_home_page.asp*, replace the existing heading with **The
    Person Home Page**, and replace the first statement with *You are a person*. Remove
    the second statement. Again, you are setting up the static portion of this page.
    As it now stands, it’s nonsensical. In a moment, it will make more sense when
    you add functionality that will place Cat or Dog before the word person in each
    paragraph.


    ![](img/43fd0127a958864ab2d93e28efe683e7_168_1.png)'
  merge: -1
  img_proc: true
- pgno: 169
  md: '5) Open animal_questions.asp. Double-click to select the word Cat in the second
    paragraph. In the Link field of the Property inspector, type the following:

    animal_home_page.asp?mypet=Cat.


    Here you are manually adding a querystring to the URL. When the user clicks this
    hnk, both the URL and the querystring will be sent, and the querystring''s contents
    will be available on animal_home_page.asp.


    ![](img/43fd0127a958864ab2d93e28efe683e7_169_0.png)


    6) Repeat step 5 to add a link to the word Dog, with the appropriate querystring
    added to the link. Save and upload (Put) the file.

    You are finished with this page.'
  merge: -1
