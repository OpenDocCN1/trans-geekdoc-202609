- pgno: 45
  md: 'refers to a technique or code structure that has been removed from the standard
    but

    which is still (albeit temporarily) supported.


    The <b> tag, which stands for bold, is a presentation tag. For users with screen
    readers,

    bold may not mean anything. Sometimes when we put something in bold we are

    trying to communicate that the content is somehow stronger or more emphatic than

    regular text. In this case, though, “Explore the Site” is not emphatic at all;
    it’s simply

    a section title. Use of the <b> tag makes it unclear whether something is emphatic
    or

    just needs to stand out.


    The other bad tag in the snippet is the <font> tag. This tag was used in HTML
    3 and

    earlier to enable HTML developers to specify how their documents should appear.

    It has since been replaced with the much more powerful and efficient cascading
    style

    sheet. The <font> tag creates significant problems for developers, because they
    are

    attached to single blocks of text. Imagine, for example, that you use the <font>
    tag to

    specify how to present all of your level 2 headings throughout the site. To do
    so, you’d

    have to add this tag to every instance of a level 2 heading. If you make a mistake,
    your

    site is no longer consistent. Worse, if you do a site redesign, you have to manually

    change every single instance of that tag. Every <font> tag in the site needs to
    be

    removed, and, now that you know it’s a problem, you can do so.


    To summarize what we’ve found here, the code is old and no longer compliant with

    current standards. It is not XHTML (we saw that in the DOCTYPE declaration). Its

    empty tags are not closed. The images don’t have alt attributes. The code is loaded

    with presentation tags, such as <b> and <font>, that need to be replaced. These
    are

    not all of the problems in the code, but it is a good enough sampling to give
    you an

    idea of what you are up against.


    Now, you might be asking, “It all looks fine in a browser, so why bother? It seems

    like such a headache to fix—can’t we just ignore it and move onto the dynamic

    stuff?” There are several answers to this question.


    Just because it renders fine in Netscape and Internet Explorer today, doesn’t
    mean it

    will appear well in the future. If your code breaks when the next version of Internet

    Explorer comes out, your client won’t be impressed with your work.


    In fact, the code doesn’t render in all current browsers now. You have to think
    of

    screen readers, in which, as you have already seen, all of the images are inaccessible.


    In addition, emerging technologies, such as XSLT (eXtensible Stylesheet Language

    Transformations), require XHTML compliance to function. XSLT is not a part of

    this book, nor is it likely to be implemented in a small business site such as
    this at

    the time of this writing, but it may be in the future. Since the first edition
    of this book

    was published, I have seen several major sites begin using XHTML with XSLT.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'Taking the easy route now could create massive headaches later. Newland Tours
    is a small site at the moment—five HTML pages. By the end of this book, the Newland
    Tours site will contain about 30 pages, and if it were a real world project, it
    would quickly grow beyond that number as well. Before beginning its overhaul,
    it’s best to whip it into shape while it’s still easy to do so.


    # ASSESSING THE SITE: BUSINESS PROCESSES


    Many clients are unaware of how well their code stacks up against current standards,
    and it is unlikely that you’ll get many projects where the client is willing to
    pay you simply to upgrade the code from HTML 4.0 to XHTML. In fact, most Web redesign
    jobs occur because the current site no longer fits the business needs of the site
    owner. Common examples of a mismatch between the business needs and the site are
    as follows:


    +   - The navigation is confusing. Site users can’t find what they are looking
    for.

    +   - Updating the site is too difficult. Many small businesses don’t have large
    IT departments that can update their sites. A small-business owner may need to
    update site content, but lack the knowledge and tools to do so. The site begins
    to fall behind the business, or the business has to spend disproportionate money
    to pay for IT human resources.

    +   - The look is outdated. Graphic design, like fashion, goes through cycles,
    and what was cutting-edge a few years ago may look stale today. An outmoded look
    communicates the wrong message to the business’ target constituencies.

    +   - The business wants to migrate certain services to the Web that are currently
    handled through other resources. Many clients want their sites to provide sufficient
    information to the public to decrease the number of phone calls coming in. For
    example, many companies deploy Web Knowledge Bases to decrease technical-support
    calls, while others provide online pricing and sales to decrease sales calls and/or
    to provide 24-hour service without hiring a whole night crew.

    +   - The business is expanding or changing its offerings. If a business offers
    a whole new class of products or services, the Web site needs to reflect that.
    In such situations, adding a paragraph or two to an existing page isn’t going
    to cut it. The site needs many new pages, requiring a new site map, navigation
    system, and so on.


    This list, obviously, is not exhaustive, but it illustrates some of the relationships
    that exist between business processes and Web sites. In most cases, the client
    wants a site upgrade for many of these kinds of reasons. Ultimately, it is this
    information that should drive the entire site-revision process. It should enable
    you and your client to identify the scope of the upgrade as well as each of the
    particulars about what you should do.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '**TIP** Take the time to get this information from the client. Some clients
    are a little lazy about defining what they want. If you don’t prompt them for
    more information, the site you deliver may not meet their needs. Do not expect
    them at that point to be self-critical enough to recognize that they were not
    sufficiently forthcoming; The burden is on you to work out all of this up front.


    In this task, you’ll take a guided tour of the site as it exists. Along the way,
    I’ll role-play the client and point out some of the shortcomings of the site.
    In this way, this task represents meeting with the client and identifying how
    the site is out of synce with business needs and processes. As these problems
    are identified, solutions—the specific changes and enhancements that you need
    to make to the site—begin to materialize. This way, the primary force driving
    the site upgrade process is the needs of the client, and not something else, such
    as your own opinion about what the site could be or, as is too often the case,
    the hottest technology on the market.


    +   1) Still viewing index.htm, press F12 to open the site in a browser. The F12
    shortcut automatically opens the active file in a browser. Given that what the
    browser displays often varies from what you see in Dreamweaver, especially when
    you are working on dynamic content, you need to test often. The F12 shortcut is
    one of the most used keyboard shortcuts in all of Dreamweaver.


    +   2) Look over the main homepage.


    ![](img/43fd0127a958864ab2d93e28efe683e7_47_0.png)'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'Graphically, the site design is not bad. The client is not intending to overhaul
    the look. This particular design is also used in several print advertisements,
    so the client wants the site to reinforce that branding.


    One design aspect that could be improved, though, is the type. The site sticks
    to HTML tags at their defaults, and as a result, they look a little plain. The
    client would like the headings to be a little more prominent and possibly in color.


    Aside from the design, the page has a significant practical problem. The column
    entitled “Traveler’s Journal” needs to be updated about once a week. Sometimes
    the business owners update this column, other times travel agents update the column.
    Not everyone knows how to work with the code or upload the files to the site.
    In addition, the owner does not want to give out the password to enable people
    to upload new pages. Currently, the journal is written in a word processor and
    handed off to one of the travel agents who knows how to revise and upload the
    pages. But this bottleneck prevents the site from being updated promptly, especially
    when that one agent is busy or not in the office. The client would like to find
    a way to make the weekly posting of the Traveler’s Journal easy enough for everyone
    to contribute to it, without compromising security.


    +   3) In the navigation bar on the left side of the screen, click the About Newland
    Tours link.


    Beyond the font issues, discussed previously, this page doesn’t need to change.
    Its content is almost never changed, and the client is happy with it as-is. Beyond
    upgrading the code to XHTML, a change that won’t be visible in most browsers,
    this is the one page you won’t change at all.


    ![](img/43fd0127a958864ab2d93e28efe683e7_48_0.png)'
