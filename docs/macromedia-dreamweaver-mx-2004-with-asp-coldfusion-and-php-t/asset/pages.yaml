    6) In the CSS Style Definition for td in newland.css dialog, select Verdana, Arial,
    Helvetica, sans serif as the font and 10 points (not pixels) as the size. Click
    OK to create the new style.


    These are the same settings you associated with the `<body>` tag, and no change
