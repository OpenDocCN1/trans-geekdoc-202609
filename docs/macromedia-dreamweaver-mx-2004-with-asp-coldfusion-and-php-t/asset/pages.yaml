- pgno: 89
  md: '# REDEFINING HTML ELEMENTS WITH CSS


    One of the advantages to HTML is that it includes a wide range of logical tags,
    flexible enough to describe the logic of most basic documents. With its six built-in
    levels of heading (<h1>, <h2>, <h3>, and so on); tags for regular text (<p>);
    lists (<ol> and <ul>) and list items (<li>); tables (<table>, <tr>, <td>); block
    quotes (<blockquote>); address (<address>) tags and more, you can mark up documents
    quickly and in such a way that the tags actually describe the content and structure
    of the document. In addition, browsers recognize these styles and know how to
    render them. For example, content in the <h1> tag is large and bold with extra
    space above and below it, while content inside <p> tags is rendered in a normal
    body font, such as a 12-point system font.


    Because every page relies on the browser for rendering, it might seem that all
    HTML pages would look the same. For example, every level one heading on the Internet
    might be in 18 point Times New Roman bold. Such a uniform appearance prevents
    organizations from differentiating themselves and bores users. For this reason,
    early on in the development of HTML, coders demanded some way to control the presentation
    of content. To meet this need, special presentation tags, such as the <font> tag,
    were added to the standard. As you know from the preceding lesson, the <font>
    tag has since fallen out of favor, largely because it is inefficient. It requires
    developers to add special formatting attributes to each and every paragraph that
    needs to diverge from the standard browser template.


    With the emergence of CSS, developers have a much more powerful and flexible way
    of handling presentation. Perhaps the simplest, and ultimately most powerful,
    feature of CSS is that you can use it to tell browsers how to render standard
    HTML tags. For example, you can specify that the browser renders all content enclosed
    in <p> tags in Verdana 12 point black, and all level 2 headings as Verdana 16
    point purple bold. What makes this so useful is that you specify these directions
    in one place, and every single <p> tag and <h2> tag in your site is automatically
    formatted correctly, without the need for any additional code. Further, if you
    make a change later to this small bit of code, the change will cascade throughout
    your entire site instantly. Anyone who came from the 20th century world of desktop
    publishing or even professional word processing would be familiar with the benefit
    of automatic styles.


    In addition to the ability to define the appearance of existing HTML tags, CSS
    also enables developers to create custom styles, called classes, which can be
    applied to any portion of text, whether it''s a block level tag such as <p>, or
    a span of characters within a regular paragraph. The only catch to using classes
    is that not only must you define custom styles, you also have to add a small bit
    of code to apply them (in contrast to redefining HTML tags, which update as soon
    as you save the style).'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'Conveniently, Dreamweaver enables you to apply custom CSS classes without having
    to type out the code manually, unless you want to.


    In the first task, you will create a series of CSS styles that redefine the most
    common HTML tags used in the site. You will also attach these styles to each of
    the existing pages. When you are finished, you will have formatted the vast majority
    of the text for the site—as it stands now and as it will stand at the end of the
    book. In the next task, you will create and apply custom styles, which will take
    care of some of the remaining exceptions. Others will be added at appropriate
    times in the book. But for now, let’s redefine the HTML elements to give the site
    the Newland Tours look.


    # 1) Open index.htm and choose Window > CSS Styles to open the CSS Styles panel
    (if necessary).


    You create and (in some cases) apply styles using the CSS panel. You can also
    access the same commands and any custom CSS classes from the Property inspector.


    The CSS Style buttons at the bottom of the panel are sometimes grayed out, unless
    you select the style name (or, as in this case, the placeholder text, “no styles
    defined”).


    ![](img/43fd0127a958864ab2d93e28efe683e7_90_0.png)


    # 2) Click the New CSS Style button. In the New CSS Style dialog, select Tag in
    the Selector Type radio group, and select (New Style Sheet File) in the Define
    in radio group. From the Tag drop-down menu, choose the body element. Click OK.


    In this step, you are preparing to redefine the <body> tag. To do so, you have
    to tell Dreamweaver that the style you want to create redefines an HTML tag, and
    that you are not creating a custom style. The Define in radio group enables you
    to specify whether you want the styles stored in index.htm only (This document
    only) or in an external style sheet ([New Style Sheet File]).'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'The benefit of storing styles in an external style sheet is that multiple pages
    in the site can reference that same file, which means that a change made to that
    external file instantly affects every page that refers to it (which in the Newland
    Tours site will be every page in the site).


    ![](img/43fd0127a958864ab2d93e28efe683e7_91_0.png)


    3) In the Save Style Sheet File As dialog, verify that you are looking in the
    newland folder and create a new folder called css. Double-click to open this new
    css folder. Name the file newland.css, and click Save.


    Though Newland Tours does not, some sites require multiple style sheets. It''s
    a good idea to keep them all in one place. For this reason, I always create a
    css folder that sits parallel with the images folder.


    ![](img/43fd0127a958864ab2d93e28efe683e7_91_1.png)


    Notice near the bottom of the dialog that Dreamweaver writes the path of the style
    sheet relative to the currently active document in the URL field. In this case,
    it''s css/newland.css.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '4) In the CSS Style Definition for body in newland.css dialog, in the Type
    category, select Verdana, Arial, Helvetica, sans-serif from the Font drop-down
    menu, and 10 points (not pixels!) from the Size drop-down menus. Click OK.


    ![](img/43fd0127a958864ab2d93e28efe683e7_92_0.png)


    In this step, you are creating a default text setting for all of the text on the
    page.

    How does this work, since generally all text inside the <body> tag is also inside

    another set of tags, such as <p> or <h1>? The answer revolves around the concept
    of

    **inheritance**. Tags nested inside other tags inherit (theoretically) the styles
    of their

    parent tags. Since all page content appears within the <body> tags, all page content

    should inherit the CSS style information from those tags.


    Does this mean that text inside an <h1> tag will now be formatted using 10 point

    Verdana? No, because browsers have a default set of formatting instructions for

    the <h1> tag. Where this formatting information conflicts with the formatting

    information in the <body> tag, it overrides it. Whether (and which) formatting
    is

    overridden is determined based on the order of precedence. In general, the closer

    a tag is to the text, the more heavily weighted are its formatting attributes.
    Since

    the content in an <h1> element is closer to the <h1> tags than it is to the <body>

    tags, the <h1> formatting takes precedence.


    That''s the theory, anyway. But browsers don''t uniformly respect this CSS hierarchy,

    and sometimes formatting attributes get ignored when they aren''t supposed to
    be.

    So in practice, you often have to define more information than you should have
    to

    in theory.'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'Due to varying implementations of CSS across browsers, you may discover with
    enough testing that regardless of the size you specify for the `<body>` tag, a
    browser may disregard it. The reason this happens is that some browsers ignore
    body formatting information if it conflicts with formatting information intrinsic
    to the `<td>` (table cell) tag. In other words, the formatting of the `<td>` tags
    in some browsers may override the size you specified in the `<body>` tag. But
    this is not a major problem: To fix it, you just need to redefine the `<td>` tag.


    NOTE Whenever you create a new style, DW actually opens the CSS file in the background.
    This enables you to edit your CSS file directly. In addition, consider it a learning
    opportunity: look at the CSS code that Dreamweaver writes. Try changing some values
    or adding new properties (in the expression font-size: 10pt;, font-size is the
    property, and 10pt; is the value). Use Dreamweaver''s code hints to ensure that
    you get the syntax right.


    5) Click New CSS Style again, verify that the type is Tag, and Define in is set
    to newland.css. Select td from the Tag drop-down menu, and click OK.


    NOTE If newland.css is not available in the Define in menu, try closing the dialog,
    closing the file newland.css, and then starting over by clicking New CSS Style.


    This dialog will become very familiar to you over time.


