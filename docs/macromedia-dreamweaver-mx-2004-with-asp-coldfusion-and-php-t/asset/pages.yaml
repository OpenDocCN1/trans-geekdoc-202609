- pgno: 236
  md: 'Familiarity with SQL is a prerequisite for dynamic Web application development.
    You''ll learn a fair amount in this book, but for an easy-to-read and comprehensive
    introduction, check out _SQL: Visual QuickStart Guide_ (Peachpit Press).


    The SQL snippet in the accompanying screenshot retrieves all of the records in
    the countryName, population, country_currency, and description fields of the tbl_country
    table.


    ![](img/43fd0127a958864ab2d93e28efe683e7_236_0.png)


    # UNDERSTANDING RELATIONSHIPS


    Relationships are a crucial concept when it comes to working with modern databases.
    They enable developers to specify how different database tables are connected
    with one another through shared data. By creating relationships, database designers
    are able to model data into tables that reflect reality and enable efficient maintenance
    of data over time. I have created the database file you will use for the book,
    and it already has many relationships in place. While you won''t be creating any
    more relationships, you will often need to retrieve and use data from more than
    one table together, and you can''t do this unless you understand relationships.


    > **NOTE** The concept of relationships is not dependent on any particular database
    management system. That is, this discussion applies equally to Access and MySQL,
    as well as any database you are likely to use for Web development, including Microsoft
    SQL Server, Oracle, or PostgreSQL.


    It is perhaps easiest to understand relationships by following an example. Imagine
    you use an Excel spreadsheet to store information about financial transactions
    at your company. You want to store each transaction as a separate row, so you
    create a spreadsheet with the following columns:


    | f_name | l_name | str_add | city | state/prov | country | postal | cred_card
    | subtotal | tax | total |

    |---|---|---|---|---|---|---|---|---|---|---|


    Over time, hundreds of records are added to this spreadsheet. Many of these records
    are for repeat customers. The problem is, each time a customer returns her or
    his address information is stored again. As time passes, some of these repeat
    customers move. Their new addresses are duly entered in the spreadsheet, but all
    of the former'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'records have the old address. Chances are, sooner or later, someone will inadvertently
    use the wrong address. Updating these addresses is hard, because there are so
    many; and, unfortunately, in Excel there''s not much you can do about this problem.


    A more logical way to represent the transaction is to separate the customer from
    the transaction. One table would track individual sales, but the customer information
    would be stored in a separate table for customers. The customer table would have
    one and only one record for each customer. If a customer moved, you would need
    to update only the single record that applied to the customer, not all of the
    records of his or her transactions. Then, back in the transaction table, instead
    of listing all of the customer information, you would list a unique identifier
    that referenced the customer in the customer table. Databases enable you to create
    this type of relationship between tables.


    > NOTE If you''ve ever wondered why catalog companies have product IDs or customer
    IDs that you have to refer to, this is why: Those IDs are unique numbers in their
    database that refer to you and only you, or to a given product and only that product.


    Thus, the customer table would look as follows:


    | cust_ID | F_name | l_name | str_add | city | state/prov | postal | credit_card
    |

    |---|---|---|---|---|---|---|---|


    And the transaction table would look as follows:


    | transaction_ID | cust_ID | subtotal | tax | total |

    |---|---|---|---|---|


    Notice that both tables have a field for cust_ID. The cust_ID in the customer
    table is a unique identifier in that table, also called the **primary key**. No
    two columns in this table will ever have the same cust_ID. It''s possible that
    there will be two John Smiths, and it''s possible that two people will reside
    at postal code 90210. But each row is guaranteed to be unique, because each row
    has its own unique primary key, cust_ID.


    In contrast, the cust_ID in the transaction table could be repeated multiple times—this
    would mean that the same customer had ordered more than one time. When you use
    the primary key of one table as a field in a different table, it is referred to
    as a **foreign key**. By placing foreign keys in tables, you create **relationships**
    between tables. Again, the benefit of doing this is that you remove redundant
    information and better maintain the integrity of your data.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '> NOTE To facilitate the discussion, I’ve simplified these tables. For example,
    you would normally expect to see a third table to handle products (that is, an
    inventory table), with product_ID used as the foreign key in the transaction table.
    Also, this example assumes that a customer can have only a single credit card.
    Obviously, you can add new tables, fields, and relationships to handle these realities.


    The following figure shows the relationships between the two tables described
    in this example. The line between the two tables indicates the relationship. The
    number 1 on the left side indicates that in the tbl_customers table, the cust_ID
    is unique, while the infinity character on the right indicates that cust_ID can
    appear many times. This is known as a one-to-many relationship.


    ![](img/43fd0127a958864ab2d93e28efe683e7_238_0.png)


    The power of relationships extends beyond preventing redundancy. For example,
    you can write a SQL query that pulls data out of both tables, using certain criteria.
    For instance, you could write a query that lists all of the first and last names
    of customers who spent over $100. You can also create forms that write to more
    than one table.


    > TIP A copy of this simple database can be found on the CD-ROM in Microsoft Access
    format, in Lesson08\Start\transaction.mdb.


    # DATABASES ON THE WEB


    Now that you have a sense for what databases look like and what they can do, you
    should be primed to understand how they work on the Web.


    Database content is used on the Web in many different ways. The simplest way—which
    you’ll do yourself at the end of this lesson—is to display the contents of a field
    on the Web. But you can display more than a simple string of text. You can also
    display multiple fields, populate menus, and handle user authentication. In addition
    to reading and displaying information, you can also collect it and store it in
    database tables. Using this technique, you can create user registration, surveys,
    quizzes, and content management systems.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '**TIP** Content management systems let users add or modify site content without
    having to know any HTML, buy any special software, or worry about uploading files,
    using Web forms and databases. The user types the site content into a Web form.
    This content is then stored in a database and output to a different Web page.


    If you compare database-driven Web pages to the Access database objects discussed
    earlier in the lesson, you''ll realize that you can effectively use Web pages
    and Web forms as a surrogate for database reports and forms. Pages that output
    and display data are like reports, while pages with Web forms can perform the
    same function as database forms. The advantage to such a system is that users
    don''t need Access or MySQL (or whichever RDBMS your organization uses) to maintain
    its content, and users can be distributed all over the world and still have access
    to the data storage, thanks to the Internet. Better still, because you aren''t
    giving users direct access to the database, you decrease the likelihood of your
    data being compromised (maliciously or inadvertently).


    So much for the cool features; now how does it all work? Just as you have access
    to files sitting on your hard drive, so a user has access to files sitting on
    a server''s hard drive. An Internet user does not have permission to start modifying
    files on any server—that would be a security nightmare. But you can give applications
    on your system access to certain files.


    One way is to use Windows'' ODBC, which enables you to create a data source name
    (DSN) that lets ASP or ColdFusion to read and write to your Access database. The
    relationship is depicted in the following figure.


    ![](img/43fd0127a958864ab2d93e28efe683e7_239_0.png)


    There''s a lot going on in this figure. Before I deconstruct it, though, notice
    how far the user is from the actual data; this complex sequence enables the user
    to access data, but protects the data from convenient access, providing some measure
    of security.


    Let''s look at the figure in detail. You''ll notice the figure is divided into
    four different regions: the client layer, the middleware layer, the ODBC layer,
    and the database layer.'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'The client layer includes static HTML interpreted by the browser. This static
    HTML may have been coded as static HTML, or as dynamic HTML, but as you know,
    by the time it is returned to the browser, it''s all static HTML.


    ODBC has all of the information needed to access the database, including the appropriate
    database driver and the path to the database. These two pieces of information
    are stored in ODBC and are referred to using the DSN.


    Finally, the SQL reaches the database itself, and it looks in the proper table(s)
    and retrieves the appropriate information.


    So much for the way in. On the way out, the data is sent back the same way it
    came in, until it gets to the middleware layer. At this point, the data retrieved
    is stored in the server''s memory (RAM). It is not actually on the page yet. A
    set of data stored in memory as the result of a query is called a recordset. You
    use ASP or ColdFusion to output the recordset data (or any subset of it) inside
    the HTML, much as you did with form variables, so that the user can see it.


    PHP/MySQL doesn''t work exactly the same way, since it doesn''t make use of ODBC.
    Instead, you provide the information the PHP processor needs to access the database
    directly in the code. I''ll cover the details later in the chapter, but the gist
    is that PHP has a special function (mysql_connect()) used for connecting to a
    MySQL database. When you use this function, you provide a path to the database
    server as well as username and password credentials. Then you use another function
    (mysql_select_db()) to specify the name of the MySQL database that you want to
    access. MySQL can contain numerous databases; in contrast, in Access, each database
    is stored in its own *.mdb file. At any rate, though PHP and MySQL use a slightly
    different approach, the process is, in a generic way, similar.


    NOTE ODBC drivers for MySQL are available, but Dreamweaver doesn''t use ODBC to
    connect PHP pages to MySQL, so you don''t have to worry about installing ODBC
    drivers for MySQL.


    # DATABASE SECURITY AND THE WEB


    Security is a major issue with dynamic applications that link to data sources.
    The integrity (and usually confidentiality) of a company''s data is vital to that''s
    company''s interests. If you read the news, you know that malicious users are
    out there who try very hard to hack into other organizations'' databases and business
    logic. But, ironically, an equally dangerous threat comes not from malicious users
    at all, but rather from well-intentioned employees making mistakes while doing
    their job.'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'Security issues are largely beyond the scope of this book, but the following
    bullets offer suggestions for protecting the integrity of your database from yourself
    and/or end users. For more information, see Macromedia''s Security Development
    Center, a free resource containing dozens of articles, white papers, tips, tutorials,
    and more. It can be found at http://www.macromedia.com/devnet/security/.


    To maintain the integrity of your data, consider:


    +   * Checking all user input for correct data type and format. That is, in a
    field that holds phone numbers, make sure that any data a user tries to enter
    is composed of digits and has the correct number digits.

    +   * Letting the database do manipulation of data (via SQL) rather than the application
    where possible.

    +   * Setting proper constraints on tables and fields to prevent users from inputting
    bad data.

    +   * Having users choose from a menu of permissible options rather than letting
    them input free-form text where appropriate.


    Implementing these features doesn''t guarantee that data cannot be compromised,
    but it is a significant step in the right direction. As you develop, be sure to
    keep these considerations in mind throughout the project design and development
    phases.


    # INSTALLING AND RUNNING MYSQL


    This section is only for those running PHP locally on a Windows or Macintosh OS
    X system. If you are using ASP or ColdFusion in any configuration, or you are
    using PHP on a remote server (e.g., via Intranet or FTP), skip to the next section,
    “Touring the Newland Database.”


    The process of installing MySQL on Windows and Macintosh systems is quite different,
    so I’ve broken each one out into its own section.


    # INSTALLING AND RUNNING MYSQL IN WINDOWS


    The easiest way to get MySQL running on a Windows machine is to download and use
    a MySQL installer. Once MySQL is installed, you can start it up and start using
    it.


    +   1) Go to http://www.mysql.com, navigate to the downloads page, and download
    the Windows installer to your hard drive.

    +   If necessary, unzip the file to a folder on your hard drive.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '2) Double-click setup.exe to start the installation. Use the default directory,
    c:\mysql.


    Although you can specify a different directory, doing so requires some extra work—you''ll
    need to create a configuration file that points to the directory you choose, whereas
    if you choose the default, you don''t have to worry about creating the configuration
    file.


    ![](img/43fd0127a958864ab2d93e28efe683e7_242_0.png)


    3) Continue through the installation, accepting all the defaults.


    Once the installer completes, phpmyadmin is installed. However, it is not yet
    running. In Windows, you run MySQL as a service. To activate the service, you
    use a Windows MySQL utility called WinMySqlAdmin.


    4) In Windows Explorer, look in c:\mysql\bin.


    This folder contains the applications related to mysql, including WinMySqlAdmin.


    5) Double-click winmysqldadmin.exe.


    You''ll be prompted for a username and password.


    Once you provide this information, WinMySqlAdmin starts up MySQL as a service.
