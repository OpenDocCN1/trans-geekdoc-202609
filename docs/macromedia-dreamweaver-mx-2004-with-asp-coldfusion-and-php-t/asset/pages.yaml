- pgno: 460
  md: '# PREPARING THE CONTENT MANAGEMENT SYSTEM


    Though it is often tempting to open Dreamweaver and start building pages right
    away, when you are developing a Web application, you are better served by thinking
    through exactly what you want to create, and at least outlining the major file
    assets that you need. The goal of this content management system is to create
    a group of pages that let users insert new country profiles, and modify or delete
    existing profiles.


    You already should see a distinction between these two processes: When inserting
    a new record, you can just create a form that collects the data to be inserted,
    but to allow users to delete or modify existing records, the users need to be
    able to specify a record. In other words, the insert page doesn''t require a master-detail
    page pairing, but both of the other two functionalities do. There''s no reason,
    though, that the pages that enable users to modify versus delete records can''t
    share the same master page.


    Each of the three functionalities requires a script to do the actual work of inserting,
    updating, or removing records. The easiest way to implement these scripts is to
    put them on their own pages, using the __processor suffix we have used throughout
    the book. Once a given script is processed, we''ll redirect users to the master
    page, so they can verify that the correct action has been taken. These pages are
    hidden because they are active for only the split second required to process the
    script before redirecting the user to another page.


    **NOTE** Though it is easy to store these scripts in hidden files, many developers
    actually put them on the same page as the form, and have the page submit the form
    to itself. An `if_else` structure near the top determines whether the form variables
    are present, and if so, processes the script. If not, it skips over the script
    and displays the page. This approach reduces the number of files on the server
    and keeps all the scripts that create a certain functionality in one file, but
    there are some advantages to keeping scripts separate. First, a good programmer
    can write reusable scripts, using the same script for multiple pages. Second,
    you can place scripts in a special folder, with special permissions on it to enhance
    security.'
  merge: -1
  img_proc: true
- pgno: 461
  md: 'The following figure summarizes the pages needed to create this application.


    ![](img/43fd0127a958864ab2d93e28efe683e7_461_0.png)


    Starting from admin_index.asp, users can choose either to insert a new country
    profile (in which case, they are redirected to admin_cp_insert.asp) or modify/delete
    an existing country profile (in which case, they are redirected to admin_cp_master.asp).


    The admin_cp_insert.asp page contains a blank form. Users will fill out this form
    when they want to create a new country profile. When they submit the form, the
    data is sent to admin_cp_insert_processor.asp, where it is inserted into the database
    and users are redirected to the master page. The new country’s presence on the
    master page is proof that the insert action was successful.


    Once on admin_cp_master.asp, users can click a link to modify an existing record,
    in which case they are taken to admin_cp_update.asp, which contains a form whose
    contents are already filled in with existing data. They can modify this data,
    and when they submit it, a script (on admin_cp_update_processor.asp) updates the
    database with the new data and redirects users back to the master page. They can
    view the profile again to verify that the update was successful.'
  merge: -1
  img_proc: true
- pgno: 462
  md: 'Alternatively, from the master page, users can choose to delete a country profile.
    When they click this link, they are redirected to admin_cp_delete_processor, which
    contains a script that deletes the selected country and redirects users back to
    the master page. This process takes a fraction of a second and appears to users
    as if they never left the master page—it simply updates with the selected country
    removed.


    Now that you have a firm grasp of the basic layout of the content management system,
    you can start building it.


    # 1) Using admin_template.asp as the source, create each of the pages that the
    user will see, as follows.


    +   admin_cp_insert.asp

    +   admin_cp_master.asp

    +   admin_cp_update.asp


    These three pages are visible to the user, so don''t delete the code and be sure
    to customize each accordingly. Add a page title in the toolbar, and overwrite
    the placeholder heading at the top of the page with something appropriate, such
    as "Insert a New Country Profile," "Select a Country Profile to Modify or Delete,"
    and "Update a Country Profile."


    ![](img/43fd0127a958864ab2d93e28efe683e7_462_0.png)


    # 2) Create each of the hidden pages as well, saving three files (as follows).
    Be sure to delete all code from these pages, while in code (not design) view.


    +   admin_cp_insert_processor.asp

    +   admin_cp_update_processor.asp

    +   admin_cp_delete_processor.asp'
  merge: -1
  img_proc: true
- pgno: 463
  md: 'These pages should never be displayed to the user, and so they should not have
    any HTML code in them. They will contain only the code needed to perform the function
    (insert a new record, update a record, and so on).


    TIP The easiest way to complete this step is to create a new file, strip out the
    code, and serve it three times with different filenames.


    You now have six new files. Granted, they are empty, but now that they exist,
    it will be easier to link to them as you build the application itself.


    ![](img/43fd0127a958864ab2d93e28efe683e7_463_0.png)


    # BUILDING THE FORM AND HAND-CODING A RECORDSET


    In this task, you''ll create the form that employees can use to insert new country
    profiles. You''ll have the form submit its data to admin_cp_insert_processor.asp,
    where you''ll also write the code necessary to insert the new record.


    +   1) In admin_cp_insert.asp, create a form (Form Name: frm_insertProfile; Action:
    admin_cp_insert_processor.asp), and insert a table inside of it with eight rows,
    two columns, and a border of 1, as shown in the screenshot.


    The seven items listed in the left column correspond to seven of the eight fields
    in tbl_country (the eighth is the autogenerated primary key).'
