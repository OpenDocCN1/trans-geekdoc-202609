    Making the error message more conspicuous is a matter of presentation. In XHTML,
    you should use CSS for presentation-related controls. XHTML has built-in styles
    for headings, body text, lists, and so forth, but XHTML lacks an <errormessage>
    tag that you can redefine with CSS. Fortunately, CSS enables developers to create
    custom styles, which can be applied to standard XHTML elements, such as the <p>
    tag.


    In this task, you will create a custom CSS style, also called a class, just for
    error messages.


    +   1) In the CSS Styles panel, click the New CSS Style button. In the dialog,
