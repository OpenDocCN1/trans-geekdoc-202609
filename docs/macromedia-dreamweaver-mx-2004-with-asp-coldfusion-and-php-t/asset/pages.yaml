- pgno: 22
  md: '# # DEFINING A STATIC SITE


    The Newland Tours site as you are inheriting it is a static HTML site. For this
    reason,

    you can easily pull it into Dreamweaver and start working on it.


    Working with Web sites often involves hundreds or even thousands of individual

    files, including Web pages, images, cascading style sheets, multimedia assets,
    and

    more. These files are linked together via HTML. Unfortunately, even a small typo

    can create ugly (or indecipherable to users) error messages and even block access
    to

    portions of your site. Dreamweaver provides many sophisticated site management

    tools to help ensure the overall integrity of your site, both during development
    and

    once it is launched. To take advantage of these features, you must first define
    a site,

    a process in which at a minimum you tell Dreamweaver where the site''s root folder

    is located on your hard drive.


    Defining a site has several benefits, many of which you will see quickly. It helps

    prevent broken links, automatically updating files site-wide if you move or rename

    a file. The Site Manager also enables you to perform site-wide operations, such
    as

    Find and Replace, which greatly boosts productivity. Another key advantage of
    the

    Site Manager is that it has built-in file uploading capabilities (including FTP),
    which

    means you can publish your files to the Web whenever you want, with the click
    of a

    single button. You can even synchronize local files (on your hard drive) and remote

    files (on the Web or a staging server), to ensure that the most up-to-date versions
    of

    the files are in the right place.


    In this task, you''ll define a regular, static site in the Site Definition dialog
    box, a

    process involving little more than giving the site a name and telling Dreamweaver

    where it is stored on the local disk. In a few lessons, once you''ve made appropriate

    preparations, you''ll return to this dialog box and define a dynamic site. Dynamic
    site

    definition is a little more involved, and the additional overhead won''t do us
    any good

    at this early stage. Fortunately, you can always change a site definition, so
    we''ve

    nothing to lose by defining a static site for now and getting right to work.


    +   1) Create a new directory on your hard disk called dw_dynapps.

    +   You''ll store the local version of the site in this folder.


    +   2) Copy the newland folder (and its contents), found in the Lesson01/Start
    folder

    +   on the CD-ROM, into this new directory.


    Often enough in real life, you''ll inherit an existing site and be asked to upgrade
    it.

    With any significant upgrade, it''s best to make a copy of the existing site and
    work

    on that. You should never directly edit a site in production (that is, the site
    that the

    public sees).'
  merge: -1
  img_proc: true
- pgno: 23
  md: '3) Open Dreamweaver MX 2004.


    Once the files are visible in Dreamweaver, you should edit them exclusively in
    Dreamweaver. Any text editor can open any HTML file, and every operating system
    has a file management utility (such as Macintosh Finder or Windows Explorer) that
    lets you move and delete files. But you should avoid using these tools, because
    any change is likely to foil Dreamweaver’s Site Manager, which is likely to cause
    broken links. So once the files are there, go straight to Dreamweaver and avoid
    the temptation to do anything to them by any other means.


    4) On the Start page, click the Create New Dreamweaver Site link.


    **NOTE** You can also choose Site > Manage Sites and click the New button.


    Though the files are on your hard disk, Dreamweaver doesn’t yet see them. By defining
    a site, you enable Dreamweaver to see—and manage—the files. You define a site
    in the Site Definition dialog box. If the dialog you see doesn’t look like the
    one in the screenshot, it’s probably because you are in advanced view. Click the
    Basic tab near the top of the dialog to bring up the basic view shown in the screenshot.


    ![](img/43fd0127a958864ab2d93e28efe683e7_23_0.png)


    5) Enter *Newland Tours* in the only field on the screen, and click Next.


    The Site Definition dialog’s basic view uses a wizard-like approach, unlike the
    more complex dialog box in previous versions of Dreamweaver.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '**TIP** If you prefer the old-style Site Definition dialog better, you can
    access it by clicking the Advanced tab.


    +   6) On the Editing Files, Part 2 screen, select “No, I do not want to use a
    server technology.” Click Next.


    Later in the book you will use a server technology. But by choosing No now, you
    get to skip several complex steps.


    ![](img/43fd0127a958864ab2d93e28efe683e7_24_0.png)


    +   7) On the next screen, select the first option: Edit local copies on my machine,
    then upload to server when ready (recommended).


    As a result of this decision, there will always be two sets of files for the site—one
    local (usually on your hard drive, though you can put it in a network folder if
    you want) and one remote (usually on a server). This is safer, because you always
    have at least one backup copy of your file. More importantly, it means that the
    files you work on will be stored on your hard drive, where customers will never
    see them.


    Most professional sites work using a 3-tier setup. The local site contains all
    the files in development on the Dreamweaver user''s hard drive. A staging server
    contains a mirror of the site used for testing and development purposes only.
    The public never sees content on the staging server, but it is a real Web server
    environment, which is typically identical or nearly identical to that of the production
    server. The production server is the public version of the site. Only tested,
    edited, polished, and approved files should be published on the production server.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '8) Click the folder icon beside the “Where on your computer do you want to
    store your files” field, and browse to the newland folder within the dw_dynapps
    folder, and click Select to select the folder and return to the Site Definition
    dialog box.

    In this step you are defining the local site—this is where all the action takes
    place. Whenever you edit a file, you will be editing the file as it appears in
    the local site. The local site is generally not seen by the public, which means
    if you temporarily break the functionality of the site as you work, no harm is
    done.


    ![](img/43fd0127a958864ab2d93e28efe683e7_25_0.png)


    9) On the next screen, choose None in the drop-down menu.

    Normally, you specify either a staging server or production server as the Remote
    site. When working with dynamic, database-driven content, a staging server is
    an absolute necessity.

    Later in the book, you will define a remote site, which you will use as a staging
    server. That staging server will be able to handle fully dynamic sites, which
    the local site you are defining can’t do—as you’ll see later. But for now, a remote
    site is an unnecessary complication.


    > NOTE There is no production server for the site you are building in this book
    because Newland Tours is fictional.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '![](img/43fd0127a958864ab2d93e28efe683e7_26_0.png)


    # **10) Click Next. Review the summary, and click Done.**


    When you are finished, a dialog box appears, indicating that Dreamweaver is building
    the site cache. What this means is that Dreamweaver is analyzing all of the files
    in the site, checking all of the links, and storing them in memory. This way,
    if you do decide to rename a page or move an asset to a different folder, Dreamweaver
    will automatically update all of the files that link to the modified file. Once
    Dreamweaver has built the site cache, the dialog disappears on its own.


    When you are finished, the Site panel (by default, in the lower-right corner of
    your screen) should be filled with files. You''ll probably also notice that a
    lock icon appears beside each of the files. This lock indicates that the files
    are read-only, which means you can''t modify them.


    ![](img/43fd0127a958864ab2d93e28efe683e7_26_1.png)'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'This is obviously not the behavior you want—the whole point of working with
    files in Dreamweaver is to change them. The reason why they appear as read-only
    is that you copied them from a CD-ROM, and CD-ROMs are read-only (in fact, that''s
    what the RO of CD-ROM stands for). If you click to expand the Fireworks or images
    folders, you''ll see that all of those files have lock icons as well.


    Before you start working on the files, you''ll need to turn off the read-only
    status.


    11) Position your cursor over the top-level folder (which should say Site – Newland
    Tours) and right-click (Windows) or Control-click (Macintosh) to open up the context
    menu. In that menu, choose Turn off Read Only.


    ![](img/43fd0127a958864ab2d93e28efe683e7_27_0.png)


    If you glance through the site at this point, you''ll notice that all of the lock
    icons have been removed. The site is defined and you''re ready for action!


    # # CREATING THE CONTACT US PAGE


    As is often the case with Web projects, before you can dig in and overhaul the
    Newland Tours site, you must address a more pressing need: the site''s Contact
    Us page is missing and needs to be recreated.


    This exercise is mainly intended as a crash course/quick review in the basics
    of creating and editing Web pages in Dreamweaver. If you are already very comfortable
    with developing static pages in Dreamweaver, you can skip this exercise—the final
    result is on the CD in this chapter''s Complete folder, as well as all subsequent
    chapters'' Start folders. If you do skip this exercise, begin reading again two
    sections ahead, "Assessing the Site: The Code."'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'This quick exercise is only intended to give you a basis for working in the
    Dreamweaver environment. It is not intended as a comprehensive guide for developing
    static Web sites using Dreamweaver. For that, see *Macromedia Dreamweaver MX 2004:
    Training From the Source* (Macromedia Press) or *Macromedia Dreamweaver MX 2004:
    Visual Quickstart Guide* (Macromedia Press/Peachpit).


    +   1) In the Files panel, double-click the file contact_text.txt to open it in
    Dreamweaver. If the Files panel is not visible, choose Window > Files to show
    it. As you can guess from the contents, this file contains all the text that needs
    to go on the Contact Us page.


    This is a plain text file, and not an HTML document. It doesn''t contain any HTML
    tags, and though it appears formatted in Dreamweaver, if you were to view it in
    a browser, all the formatting would be lost and it would be collapsed into a single,
    large paragraph. The reason for the collapse is that browsers disregard white
    space—paragraph returns, spaces (beyond the first space used to separate words),
    and tabs. To create white space in a page displayed in a browser, you use HTML
    tags, such as the paragraph (<p>) tag. In the next few steps, you''ll make a copy
    of an existing page in the site (about.htm) and replace its contents with the
    contents of this file, format these contents using HTML, and save the page as
    contact.htm.


    ![](img/43fd0127a958864ab2d93e28efe683e7_28_0.png)'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'Notice that on the View toolbar, the Code button is selected, and the two buttons
    beside it, Split and Design are grayed out. Because the document lacks any HTML,
    Dreamweaver can’t open it in design view. You’ll switch back and forth between
    code and design views often in this book.


    2) Click anywhere in the text, and choose Edit > Select All. Choose Edit > Copy
    to place all the text on the Clipboard.

    The text is now ready to dump in the destination document—only you don’t have
    a destination document just yet.


    3) In the Files panel, double-click about.htm to open it. If necessary, click
    the Design button to see the page rendered, as opposed to its code.

    You’ll use this page as a guide for creating the new page.


    4) Choose File > Save As, and name the file contact.htm.

    You are about to modify this version of about.htm. To ensure that you don’t overwrite
    the original version, you make a copy by using Save As and giving it a new name.

    Each of the pages has a button in its navigation bar called Contact An Agent.

    Clicking that button loads contact.htm, which up until this moment didn’t exist.


    5) Drag to select everything from About Newland Tours down to and including the
    image caption. Press the Delete key.


    ![](img/43fd0127a958864ab2d93e28efe683e7_29_0.png)'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'This content is unique to about.html. You''ll replace it with the content on
    the Clipboard.


    After you press the Delete key, you''ll notice that the image, which was placed
    inline with the rest of the text, is also deleted.


    +   6) With the cursor blinking in the main (and now blank) content area of the
    page, switch into code and design views (henceforth referred to as split view),
    by clicking the Split button.


    By working in both modes simultaneously, you can design visually and also ensure
    that Dreamweaver will write code the way you expect it to.


    Notice that in code view, the cursor is located inside an <h1> tag. The <h1> tag
    tells the browser to render the enclosed contents using a level 1 heading. Below
    the document window, in the Property inspector, notice that the Format drop-down
    menu displays Heading 1. In other words, the Property inspector is showing what
    you''ve just seen in code view: the insertion point is formatted as a level 1
    heading. If you paste in the contents on the Clipboard now, all the content will
    be formatted as level 1 headings.


    A more sensible choice as a default paragraph format would be the regular paragraph
    format, indicated by the <p> tag.


    ![](img/43fd0127a958864ab2d93e28efe683e7_30_0.png)


    PROPERTY INSPECTOR'
  merge: -1
  img_proc: true
- pgno: 31
  md: '7) In the Format drop-down menu of the Property inspector, choose Paragraph.

    In code view, notice that the <h1></h1> tags have been replaced with <p></p> tags.
    Now

    if you paste the contents on the Clipboard, they''ll be formatted as regular paragraphs.


    8) If a <br> tag appears between the </p></p> tags in code view, select and delete
    it.

    This tag is a relic of about.htm that may or may not get left behind, depending
    on

    how you selected and deleted the original page contents.


    ![](img/43fd0127a958864ab2d93e28efe683e7_31_0.png)


    9) With the cursor in between the <p> and the </p> tags in the code half of the

    window, choose Edit > Paste.

    The text from contact_text.txt is pasted in, and is formatted the way it was in
    the

    original file. If you compare the text and code in design and code views, you''ll
    see

    that Dreamweaver has automatically inserted line break characters (<br>) to create

    the appearance of paragraph breaks.


    ![](img/43fd0127a958864ab2d93e28efe683e7_31_1.png)


    The content is in the new page, and you''re now ready to start formatting the
    content.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# FORMATTING THE CONTACT US PAGE


    In this task, you''ll format the text, converting Dreamweaver''s line breaks into
    proper paragraphs as well as using some of Dreamweaver''s layout features. You''ll
    begin by separating the paragraphs from one another.


    +   1) In the Design half of split view, position the insert point between Contact
    a Newland Tours Agent and If you are interested, press Delete three times to remove
    the line breaks, and press Enter (Windows) or Return (Macintosh) on your keyboard.


    Dreamweaver separates the text into two paragraphs, wrapping each in its own set
    of <p></p> tags.


    ![](img/43fd0127a958864ab2d93e28efe683e7_32_0.png)


    +   2) Repeat step 1 to create a paragraph break before each of the following
    words: By Mail, Newland Tours, 123 Wharton, New York, By Email, info@newlandtours.com,
    (555), and Image.'
  merge: -1
  img_proc: true
- pgno: 33
  md: "When you are done with this step, you should have ten separate paragraphs in\
    \ the main content area of the window. They may not be pretty yet, but at least\
    \ they are separate.\n\n![](img/43fd0127a958864ab2d93e28efe683e7_33_0.png)\n\n\
    +   3) In design view, position the insertion point anywhere within the first\
