- pgno: 497
  md: 'In the next couple of steps, you will add some code that replaces the apostrophes
    with their HTML character entity equivalent (& #39;) automatically, just before
    the text is updated in the database. SQL will ignore the character entity (which
    is what we want), and when it is sent back to an HTML page, the browser correctly
    converts the character entity into an apostrophe. Neither the end user nor the
    user who maintains the Newland Tours site content will ever know that this happening
    behind the scenes. The only trace of this change, other than the ASP code you
    are about to write, is that & #39; will appear in the database in place of all
    apostrophes.


    +   6) ASP Users Only: Return to admin_cp_update_processor.asp.


    The find and replace script you''ll add will appear on the processor page, just
    before the update is performed.


    +   7) ASP Users Only: Add the following script after the opening <% and before
    Dim dbConn near the top of the page:


    Dim description_fixed, imageALT_fixed

    description_fixed = Replace(Request.Form("description"), "", "" ,"& #39;")

    imageALT_fixed = Replace(Request.Form("imageALT"), "", "" ,"& #39;")


    ![](img/43fd0127a958864ab2d93e28efe683e7_497_0.png)


    ASP has a built-in Replace() function, which takes (a) the text to be searched,
    (b) the string to search for, and (c) the string to replace it with as the first
    three parameters.


    If you were to test the file now, you''d still get an error. That''s because even
    though you''ve created a variable that holds the value of the two text fields,
    you don''t insert the contents of that variable. You need to modify the SQL code.


    +   8) ASP Users Only: Replace the two variables in the SQL statement, so that
    the UPDATE statement uses the fixed versions.


    Replace description="" & Request.Form("description") & "", with description=""
    & description_fixed & "", and imageALT="" & Request.Form("imageALT") & "" with
    imageALT="" & imageALT_fixed & "".'
