- pgno: 490
  md: '9) Select admin_cp_master.asp in the Site panel, log in, and click to select
    any non-African country.


    ![](img/43fd0127a958864ab2d93e28efe683e7_490_0.png)


    The update form appears, and all of its default values are already supplied. However,
    as long as you chose a non-African country, you''ll see a problem: ''The country''s
    region is listed as Africa. This occurs because a different recordset (rs_regions)
    is populating the drop-down menu, and Africa is the first region in the recordset,
    so it appears by default. You could change the menu, so that it displays data
    from rs_countryDetail. but since that has only one record, only one region would
    be displayed, making it impossible to change the region. And while it is unlikely
    that Italy will relocate to South America, you should preserve the flexibility
    to change regions, in case someone at Newland Tours decides to use a different
    regional division logic than continents, such as Northern Europe and Southern
    Europe, rather than simply Europe.


    You might consider specifying to employees that they have to change this drop-down
    menu every time as appropriate, but that''s poor usability. Sooner or later, an
    employee will forget to change it, and a country such as Mexico will be listed
    in Africa. The consequences of this mistake are significant: Remember that users
    can search by region, so they won''t see Mexico if they search under Central America.
    And imagine the blow to credibility that a travel agent will suffer if it declares
    that Mexico is in Africa! This is a problem needing a solution.'
  merge: -1
  img_proc: true
- pgno: 491
  md: 'But the solution is going to take some work. At the moment, the code sent to
    the browser (that is, after it has been processed by the ASP, ColdFusion, or PHP
    interpreter) for this menu element looks as follows:


    ```

    <select name="region" id="region">

    <option value="6">Africa</option>

    <option value="8">America, Central</option>

    <option value="1">America, North</option>

    <option value="2">America, South</option>

    <option value="7">Asia, Central</option>

    <option value="4">Asia, East</option>

    <option value="5">Asia, West</option>

    <option value="3">Europe</option>

    </select>

    ```


    As you may be aware, the <select> element has an additional attribute, selected,
    which you can use to specify which item appears by default. So in the following
    list, Asia. Central would be the element that appears by default in the browser
    (bolding applied to make the change is easier to spot).


    ```

    <select name="region" id="region">

    <option value="6">Africa</option>

    <option value="8">America, Central</option>

    <option value="1">America, North</option>

    <option value="2">America, South</option>

    <option value="7" selected>Asia, Central</option>

    <option value="4">Asia, East</option>

    <option value="5">Asia, West</option>

    <option value="3">Europe</option>

    </select>

    ```


    What you need, then, is to insert the word selected into the code for the region
    corresponding to the active country. Now, the complication you face is that your
    menu is not hard-coded, but is rather populated by a loop, which inserts a new
    <option> line for each record in the rs_regions recordset.


    The solution to the problem is this: Each time through the loop that populates
    the drop-down menu, a script will test to see whether the current record''s regionID
    matches the region in the rs_countryDetail recordset. If it does match, then the
    script will output the word selected into the code. If it does not match, the
    script will proceed as usual. Here''s how the block looks in pseudocode:


    ```

    Loop the following code until rs_regions runs out of records

    Write the <option> line, using rs_regions.regionID as the value attribute,

    =>and rs_regions.regionName as the label

    If the active rs_regions.regionID equals rs_countryDetail.region

    Write the word "selected" into the code

    End If

    ```'
  merge: -1
  img_proc: true
