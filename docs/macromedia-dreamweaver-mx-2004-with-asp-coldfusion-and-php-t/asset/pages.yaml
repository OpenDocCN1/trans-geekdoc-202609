- pgno: 61
  md: '# UPGRADING TO THE XHTML DOCUMENT TYPE


    The goal of this lesson is to upgrade the site’s HTML code to XHTML, and ensure
    that all subsequent code you add while working in Dreamweaver is XHTML-compliant.
    You might be wondering what exactly XHTML is and how it differs from HTML. XHTML
    is the current standard for HTML, which means that the relationship between the
    two is historical: XHTML replaces HTML.


    Perhaps the most significant change to come with XHTML has little to do with code
    at all: it’s the new conceptual thrust of XHTML, bringing HTML in line with XML,
    or eXtensible Markup Language. XML is a meta-language—a set of rules that developers
    can use to develop their own custom language in line with a common standard. XML
    is markup-based, like HTML, so its syntax should be familiar, as in the following:
    <authorname type="first">Jeffrey</authorname>. Several variants of XML have already
    appeared, such as MathML, a markup language that mathematicians use to encode
    mathematical expressions. XHTML is a variant that developers use for (drum roll)
    marking up Web pages.


    One of the central tenets of XML is that the tags describe the content of a document,
    but not its presentation. Presentation of XML content is handled with a separate
    type of code (such as CSS, XSLT, or XSL-FO). Previous versions of HTML mixed content
    and presentation markup. Elements such as <font color="green" size="+1"> lack
    semantic value. For this reason, they are deprecated, which means that their use
    is discouraged and they will eventually be dropped from the standard, but they’ll
    still work for now. They tell the user (or browser) nothing about what was enclosed
    inside them. Rather, these tags merely tell the browser how to present whatever
    is enclosed, unlike the <authorname> element in the preceding paragraph, which
    leaves little to the imagination about what it contains.


    In short, you should use XHTML to describe the structure of your document: headings
    (<h1>, <h2>, etc.), lists (<ol>, <ul>, <li>), body text (<p>), emphatic text (<strong>,
    <em>), anchors (<a>) and so on. To specify how graphical browsers (such as Internet
    Explorer and Netscape) should present this information, you should use cascading
    style sheets, rather than presentation tags, such as <font> or <b>.


    This separation of code from content and presentation has more than just theoretical
    benefit. First, it enables a broader variety of browsers, including screen readers
    for the visually impaired, to render the content without having to weed out (or
    worse, attempt to interpret) presentation tags. Second, the proper use of XHTML
    and cascading style sheets greatly speeds up the development and maintenance of
    Web sites.'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'As you probably know, XHTML looks mostly like HTML. Many of the tags are the
    same, including <body>, <head>, <h1>, <p>, <ol>, <a>, <table>, <tr>, <td>, <form>,
    and so on. In fact, most HTML code is unchanged in the transition. That limits
    how much you actually have to change when upgrading to XHTML.


    NOTE XHTML is backward-compatible. That is, browsers created before the XHTML
    specification can still display XHTML code nearly perfectly.


    But XHTML code is not exactly the same as HTML code. Your task in this lesson
    is to find these differences and change the code accordingly. The most significant
    differences, beyond the enforced separation of logic and presentation already
    discussed, are as follows:


    +   All XHTML tags and their attributes must be lowercase. In HTML, both <p> and
    <P> are equally acceptable, and many developers capitalized HTML tags to help
    them stand out. But in XHTML, following XML rules, all tags must be lowercase,
    so only <p> is acceptable. Likewise, tag attributes, such as the cellpading="3"
    attribute of the <table> tag, must also be in lowercase. The Newland Tours site
    already uses lowercase tags, so you won''t have to worry too much about this issue.


    +   All XHTML tags must be closed. For example, if you have an <h1> tag, somewhere
    else there should be a closing </h1> tag. However, some elements lack closing
    tags. Examples of these empty tags include <br>, <img src="xyz.gif">, <hr>, and
    <input>. In addition, some tags could be closed or empty in HTML, including the
    <p> and <li> tags. In XHTML, however, the <p> and <li> tags need corresponding
    </p> and </li> tags. As for the empty tags, they are closed in a special way.
    The syntax is <my_empty_tag />. Thus, you should convert the empty tags above
    to <br />, <img src="xyz.gif" />, <hr />, and <input />. The added space and backslash
    replace the closing tag.


    +   Because so many different flavors of HTML exist side-by-side on the Web, developers
    have for years preceded HTML documents with a document type declaration. For example,
    Dreamweaver adds the following to the top of most new documents: <!DOCTYPE HTML
    PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">. This tells browsers which version
    of code (HTML 4.01 Transitional) the document uses as well as its language (English).
    XHTML not only has a different document type statement, but as a valid form of
    XML, it also has an XML declaration.


    +   As discussed previously, presentation tags are no longer allowed. Instead,
    use cascading style sheets to handle presentation.


    With that background, let''s get started!'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# 1) Open index.htm in Dreamweaver.


    The Find and Replace operations you''ll be doing are sitewide, so theoretically
    it makes no difference which file you open. In fact, you can have a blank, unsaved
    document open. Dreamweaver doesn''t care. As long as you have a file open, you
    can access the Find and Replace dialog.


    In a moment, you''ll use Find and Replace to formally convert the site to XHTML.
    To do so, you will replace the document type definition from HTML 4.01 Transitional
    to XHTML 1.0 Transitional. Your document won''t be fully XHTML-compliant, since
    all of the noncompliant code will still be there. But by changing the document
    type information, you''ll not only tell browsers that the document is XHTML, you''ll
    also tell Dreamweaver. Once you do so, Dreamweaver will automatically write XHTML-compliant
    code from that point forward, as you''ll see for yourself.


    # 2) Still in split view, place your cursor at the end of the Featured Vacation
    segment in the design pane (after $899/child USD) and press Shift+Return (Macintosh)
    or Shift+Enter (Windows).


    This keyboard shortcut inserts a line break element (the <br> tag in HTML). This
    is an empty element, and as you can see, it is not inserted in the correct XHTML
    format. This is proof that Dreamweaver is writing, by default, non-XHTML compliant
    code. The reason Dreamweaver does this is that the document type is HTML 4.01
    Transitional, and in that version of HTML, <br> is the correct way to code a line
    break element.


    ![](img/43fd0127a958864ab2d93e28efe683e7_63_0.png)'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'Let''s change the document type information.


    3) Choose File > New to create a new document. Make sure Basic Page is the selected
    category and that HTML is the file selected in the second pane. Near the bottom-right
    corner, check Make Document XHTML Compliant. Press Create.


    ![](img/43fd0127a958864ab2d93e28efe683e7_64_0.png)


    When you create a new document that is XHTML-compliant, Dreamweaver writes the
    proper document type information at the top of the new document. We''ll copy that
    code and use it to replace the existing code in the HTML 4.01 Transitional site.


    4) Select lines 1-2 of the new document, and choose Edit > Copy to copy the code
    to the clipboard. You can close the new file without saving.


    ![](img/43fd0127a958864ab2d93e28efe683e7_64_1.png)'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'Let''s take a look at the code you just copied.


    ```

    <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"

    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

    <html xmlns="http://www.w3.org/1999/xhtml"> .

    ```


    The first line is the DOCTYPE declaration, which looks much like the one for HTML
    4.01. Only the HTML version has changed. One new difference is a URL that points
    to a DTD file. A DTD, or document type definition, is a document containing all
    the rules specifying the tags and attributes allowed in a particular version of
    XML.


    The second line is the opening <html> tag that all HTML documents must have.

    This one is special, in that it has an xmlns attribute. This attribute, short
    for XML

    Name Space, specifies the source of all the tags. It is required in XML because
    it

    is conceivable that two different XML-based languages will use the same tag. By

    specifying a default name space, the rendering program (in this case, the browser)

    can resolve any such conflicts.


    # 5) Choose Edit > Find and Replace.


    The Find and Replace dialog appears. The factory default settings are shown in
    the accompanying screenshot, but yours may vary, depending on the settings from
    any previous use. If either the Replace With area or the area above it already
    has any text in them, delete it. Both fields should be empty before you proceed
    to the next step.


    ![](img/43fd0127a958864ab2d93e28efe683e7_65_0.png)


    # 6) Click inside the Replace With text area and press Command+V (Macintosh) or
    Ctrl+V (Windows) to paste in the two lines of code.


    The code may wrap inside the dialog so it appears to be more than two lines, but
    don''t worry about that.


    What you''re doing in this step is telling Dreamweaver what to replace the searched
    text with. Of course, you haven''t yet told Dreamweaver what to search for in
    the first place. You also haven''t told Dreamweaver which files you want it to
    search.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '**7)** Index.html should still be open. Scroll to the top of code view, select
    lines 1–2, choose Edit > Copy, click in the text area above the Replace With text
    area, and paste in these two lines of code.

    Again, the lines of code may wrap, but that is no concern.


    ![](img/43fd0127a958864ab2d93e28efe683e7_66_0.png)


    At this point, you’ve told Dreamweaver what to find and what to replace it with.
    So far, so good. But you still haven’t told Dreamweaver in which files it should
    search for the strings.


    **8)** In the Find in drop-down menu (at the top), select Entire Current Local
    Site.

    Here you are telling Dreamweaver to look for the string in every HTML file in
    the site. This means that rather than upgrading one page at a time to XHTML, you
    can update every file at once.


    > **NOTE** Making multiple-file replacements is a potentially dangerous action,
    because changes made to site files currently closed (which is all files besides
    index.htm) are permanent and not Undo-able. Be careful when running Find and Replace
    operations on multiple files.


    **9)** In the Search drop-down menu, choose Source Code. Uncheck Match case, Match
    whole word, and Use regular expressions. Check Ignore whitespace.


    The Search For drop-down menu is important. By default, Find and Replace looks
    in the text, which is the text that will be displayed in a browser for the user
    to see. The ‘Text’ option does not include the code. Since you are upgrading the
    code of the pages, and not the text, it is vital that you choose Source Code.


    Match case takes case (a versus A) into account in the search. Case differences
    are ignored if the box is unchecked.


    Match whole word forces Dreamweaver to find only a whole word. With this option
    unchecked, searching for design would match for design, designer, and designed.
    With it checked, this option will only match design.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'Ignore whitespace ignores any white space, such as hard returns, tabs, and
    indentation between text or elements. Because HTML ignores white space, many programmers
    use white space to make code more legible.


    Use regular expressions causes Dreamweaver to interpret reserved characters used
    in regular expressions (such as /d) as regular expression characters. If unchecked,
    and Dreamweaver encounters /d, it will search for /d, rather than any single numeral,
    which is what /d means in regular expressions.


    The final version of the Find and Replace dialog should appear as in the accompanying
    screenshot.


    ![](img/43fd0127a958864ab2d93e28efe683e7_67_0.png)


    # 10) Click Replace All. When the warning dialog appears, click Yes.


    The operation is run. By default, the Dreamweaver Results panel opens to show
    you which files were changed. As you can see, five files were changed. Since there
    are five files in the site, you know you were successful.


    ![](img/43fd0127a958864ab2d93e28efe683e7_67_1.png)


    11) To wrap up the line break experiment, return to the bottom of the Featured
    Vacation section where you inserted a line break earlier, and press Shift+Return
    (Macintosh) Shift+Enter (Windows) again.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'When you look in code view, you will see that Dreamweaver this time added a
    <br /> tag beside the <br> tag it added earlier. Remember, the <br /> syntax is
    used for empty elements; it is equivalent to <br></br>, and is not simply a closing
    </br> tag. This proves that Dreamweaver knows that the document is an XHTML document,
    and you can be assured that henceforth Dreamweaver will not add any non-XHTML-compliant
    tags to your code.


    **NOTE** Dreamweaver may still add <font> tags, depending on how you format text.
    It''s best to discipline yourself not to format text using the Property inspector
    for such attributes as color and size. Instead, rely on CSS as much as possible.


    ![](img/43fd0127a958864ab2d93e28efe683e7_68_0.png)


    Changing the document type information at the top ensures that new tags are XHTML-compliant.
    Of course, it does nothing about the existing tags. You''ll have to fix those
    yourself.


    +   12) Remove the two line breaks, if you like, and save the file.


    Any time you make a significant change, you should save index.htm. You don''t
    need to save any of the closed files—as soon as Dreamweaver replaced the document
    type information, it saved those files.


    # REPLACING STRINGS IN SOURCE CODE


    In this task, you will replace a handful of simple tags. For example, you will
    replace all instances of <br> with <br />. These changes are straightforward,
    because there are no attributes or variations to throw off the search. (In contrast,
    tags such as <img src="images/imagename.gif"> are going to be a little more work,
    thanks to their attributes; we''ll wrestle with these harder ones shortly.)


    +   1) Choose Edit > Find and Replace to open the dialog once again.


    This time, rather than pasting information in, you can just type directly in the
    text areas.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '2) Type <br> in the upper text area, and type <br /> in the lower one (don''t
    forget the space between the r and the / character). Be sure that you have completely
    removed the text that was in these windows from before.


    The Find In drop-down should still say Entire Current Local Site, which is what
    you want, as is Source Code in the Search drop-down.


    ![](img/43fd0127a958864ab2d93e28efe683e7_69_0.png)


    3) Click Replace All.

    Once again, you see the warning, and the Results panel displays the changes. In
    this case, there were quite a few changes made throughout the site.


    4) Repeat steps 2 and 3 to replace <hr> with <hr />.

    Find and Replace makes quick work of what otherwise would be a very tedious task.


    5) Repeat steps 2 and 3 to replace <meta http-equiv="Content-Type" content="text/html;
    charset=iso-8859-1"> with <meta http-equiv="Content-Type" content="text/html;
    charset=iso-8859-1" />.


    > **TIP** To avoid typing this string, you can copy it from line 6 on any of the
    pages.


    The original Newland site was created in Dreamweaver, and it automatically added
    the <meta> tag you are replacing here. Generally, developers use the <meta> tag
    to convey information about a document. You''ll often see <meta> tags with descriptions
    and keyword lists. Since these obviously vary, they can be a challenge to update
    through Find and Replace. But in this particular case, that''s not a problem.
    On each page, Dreamweaver added only one <meta> tag, each time with the same contents.
    You can therefore be confident that you fixed them all.


    6) Repeat steps 2 and 3 to replace <map name="navbarMap"> with <map name="navbarMap"
    id="navbarMap">.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'TIP index.html doesn''t have this tag. You can manually type it in, or you
    can open any of the other four site files and copy it from there. This tag is
    found near the bottom of each of those pages.


    Certain Web page objects have identifying attributes, which, among other things,
    enable the object to be accessed and even manipulated by scripts. In previous
    versions of HTML, you''d use the name attribute to give an object a unique identifier.
    In XHTML, the proper identifier has changed from name to id. Unfortunately, a
    lot of older browsers don''t yet recognize id. And you can assume that newer browsers
    eventually won''t recognize name. The way to work around this problem is to include
    both name and id attributes set to the same values, so that all browsers can recognize
    them.


    ![](img/43fd0127a958864ab2d93e28efe683e7_70_0.png)


    +   7) Save index.html.


    # REPLACING TAGS


    As a part of the migration from presentation-oriented HTML tags to content-descriptive
    HTML tags, the <b> (bold) and <i> (italic) tags have fallen out of favor. Both
    have been replaced with the content-descriptive tags <strong> and <em>. Most major
    browsers render the <strong> tag in bold and the <em> tag in italics. In other
    words, by upgrading from <b> to <strong> and <i> to <em>, you can achieve standards
    compliancy and enhance accessibility without changing the appearance of your documents
    in major browsers.


    Because this change is a simple one-to-one change, and because none of the four
    tags involved have any attributes, you could easily find <b> and replace it with
    <strong>, find </b> and replace it with </strong>, and so forth. But Dreamweaver
    has an even easier way to replace tags: the Change Tag action in the Find and
    Replace dialog.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# 1) With index.htm still open, choose Edit > Find and Replace. Make sure the
    Find in drop-down specifies Entire Current Local Site.


    So far, the setup is just like the searches you have already done, but that''s
    about to change.


    # 2) Choose Specific Tag from the Search drop-down.


    The rest of the Find and Replace dialog changes drastically.


    ![](img/43fd0127a958864ab2d93e28efe683e7_71_0.png)


    The Specific Tag setting opens up a number of options that enable you to manipulate
    tags. Since our goal is to update the tags from HTML to XHTML, the options displayed
    here are incredibly useful.


    # 3) Choose b from the HTML tag list drop-down, which is just to the right of
    the Search drop-down.


    Your first goal is to upgrade the <b> tag to the <strong> tag. You''ll take care
    of the <i> tag in a moment. By specifying the b element, you are in effect telling
    Dreamweaver to find not just the opening <b> tag, but also the closing </b> tag.


    # 4) Click the Remove Search Criterion button to remove the With Attribute line
    that was added by default.


    You can add multiple additional criteria to further refine your search. You will
    use this feature later in the lesson, but for now, it is not necessary, so remove
    it.


    # 5) Select Change Tag in the Action drop-down menu. In the To drop-down menu
    that appears, select strong.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'The action list contains all of the actions that you can have Dreamweaver do
    to the tag you specified in the HTML Tag List drop-down. You''ll get to see a
