- pgno: 158
  md: '# # UNDERSTANDING THE HTTP PROTOCOL


    Pages on the Web are transferred using the HTTP protocol. This protocol specifies
    how users (or, in some cases, systems) make requests of servers over the World
    Wide Web, and how these servers respond to these requests. Understanding the basics
    of this protocol will help you understand how dynamic pages work.


    At its core, the HTTP protocol is a transactional system. A client sends a request
    to a server, and the server sends a response back to the client. One part of the
    request is the URL, or Uniform Resource Locator. When you click a link in a browser,
    a request is sent to the server that contains the desired file.


    What most people don’t realize is that the client’s computer sends a lot more
    to the server than simply the URL request. It also sends quite a bit of information
    about itself, including the browser (referred to as the **user agent**), username,
    IP address, file types it can accept (such as GIF and JPEG), and several sources
    of data. The request contains a header and a body; most of the information just
    specified is sent in the header. The reason people don’t realize this is happening,
    of course, is that the header is not visible to the human user.


    Once the server receives the request, it responds if it can. It looks at the requested
    document, and if that document has any server-side code on it (such as ASP VBScript,
    ColdFusion Markup Language, or PHP code), the server processes those instructions.
    When it is finished, it removes the server-side code and combines the output from
    the server-side code along with the XHTML in the document, and sends it all back
    to the client in the body of the response. The response, like the request, has
    a header, which contains information for the client system (such as the document
    size and type and the date and time of the response). About all a user can see
    of this transaction are the URL and the output XHTML page.'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'The following figure represents an HTTP transaction. Solid rectangles show
    documents visible to the user, while dashed rectangles represent documents hidden
    from the user.


    ![](img/43fd0127a958864ab2d93e28efe683e7_159_0.png)


    If you wondered at the end of Lesson 4 exactly how test_form_processor.asp gained
    access to the data that the user entered in the form on that page, the request
    is your answer. The firstName variable and its value were sent in the body of
    the request message when you clicked the Submit button. In other words, the hidden
    portions of the HTTP request and response messages make it possible to send data
    values back and forth between the client and server, which makes them available
    to ASP, ColdFusion, or PHP scripts on the server. It also means, as you’ll see
    in this lesson, that the server can send data back to the client with directions
    to store the data in a cookie.


    Before we start looking at how to take advantage of the HTTP protocol to facilitate
    dynamic Web development, there is one more vital behavior you need to know about
    the protocol: Once the server sends its response to the client, it forgets about
    the entire transaction. That is, if the client makes a second request of the server,
    the server has no idea that this is the same client who made a request a moment
    ago. For this reason, HTTP is known as a **stateless protocol**.


    The statelessness of the HTTP protocol is a significant problem for those developing
    Web applications. If the Web forgets who you are in between every page, how can
    you get through the successive screens of an online shopping cart? If you have
    a multipart survey, how can you ensure that the data entered on page 1 is inserted
    into'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'the database along with the data entered on page 4? You have seen online shopping
    carts and probably taken multipage surveys, so you know there are solutions to
    these problems.


    It is hard to develop dynamic Web sites without an awareness of the request-and-response
    transaction and the statelessness of HTTP. Binding data to pages takes place within
    this context, and the differences between querystring (or URL) variables and form
    variables, POST and GET, and setting and retrieving cookies—all of which you are
    about to become familiar with—are considerably less obscure when you understand
    how they relate to the HTTP protocol.


    # RETRIEVING DATA FROM THE URL


    At the end of the previous lesson, users filled out a short form and submitted
    it to a page that displayed the value they entered in the form. As you know from
    the preceding section, the variable sent from the form to the test_form_processor.asp
    page was enclosed in the body of the request. There are other ways to send data
    between pages. You can send variables through URLs, cookies, and (depending on
    your server technology) session and application variables. You’ll learn all about
    each of these during the course of the book, but for now it is sufficient to understand
    that there are many ways to share data among pages.


    The logical question that follows from this is, why are there so many different
    ways, and how do you know which one to use? The answer is that each has unique
    capabilities and limitations.


    For example, the form variable you sent in Lesson 4 in the body of the request
    sent the data from the form page to the page that processed and displayed the
    information. One limitation of this approach is that once the server completes
    this transaction, it forgets the firstName name-value pair. So though it outputs
    the user’s first name to that page, if the user goes to a different page, the
    server no longer knows the value of the firstName variable, which means that this
    name-value pair is no longer available to your code. If you were developing a
    multiple-page shopping cart or survey, you’d soon encounter the limitations of
    form variables.


    In this task, you’ll pass data from the form to the test_form_processor.asp page
    in a different way: You’ll use a querystring. A querystring is a list of variables
    appended to the end of a URL. You have probably noticed as you surfed the Web
    that sometimes URLs are quite long and seem to contain much more information than
    the page address; that information is a querystring. Let’s modify the Web form
    you created in Lesson 4 so that it sends information using a querystring, rather
    than a form variable.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '1) Open test_form.asp.


    At the moment the form is somewhat minimalist.


    2) Position the insertion point after the text field, and press Enter/Return.
    Type Last Name and add a second text field. Use the Property inspector to name
    the new field lastLastName. Position the insertion point after the LastName text
    field and press Enter/Return again to move the Submit button below the new field.


    In this step, you are adding and formatting a second form field. Just because
    you are placing content in a form doesn''t mean you can''t format it as needed.
    You can insert just about any valid HTML element inside of a form.


    ![](img/43fd0127a958864ab2d93e28efe683e7_161_0.png)


    3) Click <form#frm_name> in the tag selector to select the whole form and also
    to bring up the form options in the Property inspector.


    The easiest way to modify an element''s attributes—especially an element with
    several child elements, such as the <form> element—is to select it in the tag
    selector.


    4) In the Property inspector''s Method drop-down menu, select GET.


    Initially, the value is set to POST, which you specified in the previous lesson.
    By changing the method from POST to GET, you are changing the way that the data
    is sent to test_form_processor.asp. With POST, the data is sent in the request
    body, as discussed before. But with GET, the data will be sent as a querystring,
    which means that you will see the firstName and lastName name-value pairs appended
    to the URL, as you will see in a moment.


    ![](img/43fd0127a958864ab2d93e28efe683e7_161_1.png)'
  merge: -1
  img_proc: true
