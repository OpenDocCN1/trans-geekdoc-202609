- pgno: 381
  md: '8) ASP and ColdFusion users: Open tours.asp. In the Bindings panel, double-click
    Recordset (rs_countries) to edit it. Click the Advanced button in the Recordset
    dialog. Between the FROM tbl_country and ORDER BY countryName ASC, enter the code
    that appears below. PHP users: skip this step but read the accompanying text.


    ```

    WHERE EXISTS

    (SELECT * FROM tbl_tours WHERE tbl_tours.country = tbl_country.countryID)

    ```


    ![](img/43fd0127a958864ab2d93e28efe683e7_381_0.png)


    White space doesn''t matter, so use line breaks as you like to make it more readable.
    Let''s talk about this SQL for a moment, because several things are going on.
    First, it uses a subquery, which is a query within a query, or more specifically
    here, a query used as a criterion within another query. The subquery is the part
    contained within the parentheses. That subquery looks for all the fields from
    tbl_tours where there is a match between tbl_tours and tbl_country. All of the
    countries in the database, except for "Taiwan," fall into this category.


    The EXISTS keyword is used to check for the existence of rows in a subquery result.
    The actual values are not retrieved, because it is simply checking for their existence.
    Because it finds that 15 countries exist in both locations (tbl_tours and tbl_country),
    it includes them in the main SELECT statement. Since "Taiwan doesn''t exist in
    both places, it is excluded.'
  merge: -1
  img_proc: true
