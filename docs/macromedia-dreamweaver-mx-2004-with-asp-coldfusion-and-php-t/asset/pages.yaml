- pgno: 447
  md: '# MAKING THE DETAIL PAGE UPDATEABLE


    Other than the convenience of using a ready-made object to create master-detail
    pages, nothing you have done is terribly new, since you''ve deployed most of the
    functionalities aggregated on these two pages during the course of the book. But
    what you''ll add in this task is new: You''ll use the filtered display as a means
    of identifying the row to update.


    This task should be easy, since you are merely adding a simple server behavior
    to a form that will have a single field. But it''s not that simple. All three
    versions of the server behaviors wind up not working as expected, though for different
    reasons. The ASP version of the server behavior sends a superfluous querystring
    parameter that creates a conflict with another querystring. And the ColdFusion
    and PHP versions of the server behavior give a URL parameter an unexpected name,
    which might cause you to mismatch a pair of values.


    I must emphasize that neither of these issues matter if you are applying the Update
    Record behavior to a simple page. But as you know, admin_addUser_detail.asp is
    not a simple page—it is a part of the great complexity of server behaviors and
    dynamic elements that is the Master-Detail Page Set application object.


    Both sets of problems are fairly easy to fix. The important point to realize is
    that once again you can''t rely entirely on the convenient server behaviors: You
    must deal with code, both to create functionality that the server behaviors can''t
    create or to customize (and in this case fix) the code that the server behaviors
    generate.


    +   1) In admin_addUser_detail.asp, create a new form (frm_updateUser), and place
    the table inside it.


    You''ve used tables to structure form content through the book. Here, you are
    including dynamic content within that table, but the presence of dynamic content
    makes no difference to the form. The only portions affected by the form itself
    are form elements, and you haven''t added them yet.'
  merge: -1
  img_proc: true
