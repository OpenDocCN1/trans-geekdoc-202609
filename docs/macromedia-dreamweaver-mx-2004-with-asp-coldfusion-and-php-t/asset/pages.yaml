  md: '# INSTALLING AND RUNNING MYSQL IN OS X


    Installing MySQL on a Macintosh OS X is quite easy, because installers are already
    available. However, turning on the database requires that you go into the ‘Terminal’
    and type some code at the command prompt.


    +   1) Go to http://www.mysql.com and download the installer file for Macintosh
    OS X 2. The file should download directly to your desktop and auto-extract.


    +   2) Double-click the mysql-standard-4.0.14 icon. Note that the version number
    may be different.


    +   3) In the Finder window, double-click the mysql-standard-[version].pkg file
    to begin installation. The files themselves are installed in the /usr/local/mysql-[version]
    directory, but a symbolic link (or shortcut) is created, so that you can always
    access MySQL via /usr/local/mysql/. The actual program files that you''ll use
    to run and maintain MySQL can be found in the bin subdirectory.


    ![](img/43fd0127a958864ab2d93e28efe683e7_245_0.png)


    +   4) Continue clicking through the wizard until the software is installed. You
    can accept the defaults all the way through. When it is done, MySQL is installed,
    but it is probably not running.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '![](img/43fd0127a958864ab2d93e28efe683e7_246_0.png)


    +   5) To start MySQL, open the Terminal (Applications/Utilities/Terminal). Unless
    (and until) you install a separate interface for MySQL, you access it via the
    command line.


    +   6) Log in as the root user: To do so, type su, press Return, and when prompted,
    enter the root password. To run MySQL, you must be logged into the Terminal as
    the all-powerful root user. This step assumes that you have some familiarity with
    working in the Macintosh OS X implementation of the Unix environment.


    +   7) Switch to the MySQL directory by typing cd /usr/local/mysql. Remember,
    you can type ls at any time to see a listing of the files and directories within
