- pgno: 73
  md: '# # STRIPPING UNWANTED TAGS


    As you know by now, the <font> tag has become obsolete, but unlike the <b> and
    <i> tags, it has no easy counterpart with which you can replace it. The presentation
    details that the <font> tag was once used to specify are now handled with an entirely
    new technology: CSS. Thus, rather than a one-to-one fix as you did in the previous
    task, solving this problem requires two steps. First, you need to strip out all
    of the old tags. Second, you need to develop and apply CSS. You''ll do the first
    of these two steps in this task. The second step forms the basis of Lesson 3.


    Stripping out <font> tags might seem to be difficult. After all, given their many
    attributes, and the many possible values you can enter in the attributes, you
    can''t just do a search for the <font> tag as you can with the <b> tag. You''d
    need to find a way to catch differences like the ones between <font color="#00FF00">
    and <font size="+1">. Two workarounds to this issue spring to mind. You could
    search for the string "<font" without the closing ">", and then manually delete
    each instance. Alternatively, you could use regular expressions to construct a
    search for the font tag that includes any possible variation of attributes and
    their values.


    > Regular expressions enable you to have the Find function look for patterns in
    text strings, rather than hard-coded strings. Regular expressions work by substituting
    wildcard characters for real characters and by providing other ways of describing
    patterns in strings. You can find a substantive introduction to regular expressions
    at the following URL: http://www.webreference.com/js/column5/. For the curious,
    the regular expression needed to find every instance of the <font> tag, in all
    of its variations, is as follows: <(font) [^>]*>


    Dreamweaver makes what would otherwise be a difficult task an easy one. Its Strip
    Tag action does all the work of generating the right regular expression for you,
    invisibly, behind the scenes. When it is finished, it removes every instance of
    the <font> tag, regardless of its attributes and their values. At the same time,
    of course, it also removes the closing </font> tags.


    +   1) Still in index.html, open the Find and Replace dialog again, and verify
    that Entire Current Local Site is still selected in the Find in drop-down menu.
    Once again, this step prepares you for the main work of this task.


    +   2) With Specific Tag still selected in the Search drop-down menu, select font
    in the HTML Tag List drop-down menu. If necessary, click the Remove Search Criterion
    (minus sign) button beneath the Search drop-down menu. As before, you are here
    telling Dreamweaver what to look for, in this case all instances of the <font>
    and </font> tags.'
  merge: -1
  img_proc: true
