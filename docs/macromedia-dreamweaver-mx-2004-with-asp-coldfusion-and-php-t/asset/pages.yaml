- pgno: 21
  md: 'the site''s shortcomings. These shortcomings can be divided into two categories:
    technical shortcomings, such as the outdated and non-compliant code used throughout
    the site, and business shortcomings, where the site no longer meets the needs
    of its business. Finally, you''ll hop onto the Web and see the completed version
