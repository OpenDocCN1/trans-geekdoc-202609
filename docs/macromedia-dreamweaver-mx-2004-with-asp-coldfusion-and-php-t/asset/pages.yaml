- pgno: 402
  md: '# # BUILDING THE LOG-IN PAGE


    Now that your registration page is functioning, you can build the log-in page.

    Remember, the role of the log-in page is to obtain (through a form) the user''s

    username and password. Then, it will compare these values with the records in

    tbl_users. If there''s a match, the log-in script sets a session variable indicating
    that

    the user is logged in. If there is no match, the user is redirected to a log-in
    failed page.


    +   1) Starting with generic_template.asp, create a new file, login.asp. Title
    it Newland

    +   Tours: Log In. Type Please Log In as its heading.


    Now you''ve created the basic page framework.


    ![](img/43fd0127a958864ab2d93e28efe683e7_402_0.png)


    +   2) Replace the first line of body text with a form. Call the form frm_login.
    Inside

    +   the form, insert a table with 3 rows, 2 columns, a width of 95%, a border
    of 0,

    +   a cellpadding of 3, and a cellspacing of 0.


    Once again, the table inside the form is used to structure the form elements.
    Also, as

    before, you don''t specify the action or method attributes of the form. These
    are both

    required, but they will be completed automatically for you when you add the Server

    behavior, so you can leave them alone for now.


    ![](img/43fd0127a958864ab2d93e28efe683e7_402_1.png)'
