- pgno: 233
  md: '# A CRASH COURSE ON DATABASES


    A tutorial-based book should keep you actively working, so I try to refrain from
    pausing the action for long-winded passages explaining esoterica. But you will
    not get very far developing dynamic Web sites if you do not have a solid familiarity
    (though not necessarily expertise) with databases. In this section, I''ll introduce
    you to basic database concepts and vocabulary, using Microsoft Access as the running
    example. The layout of the data (and the data itself ) in MySQL is the same as
    it is in Access. However, Access has a better user interface, so all the screenshots
    are from Access. I strongly encourage you to spend additional time learning to
    work with databases, as you continue to master dynamic Web site development. For
    now, this section should be enough to get you started.


    Though MySQL looks radically different from Access, all of the critical concepts
    still apply. Some of the following discussion is Access-centric, and where MySQL
    has no equivalent, I''ll make a note of it.


    # INTRODUCING DATABASE OBJECTS


    In the simplest terms, a database is a system of storage for data. But in contemporary
    use, the term database generally means a lot more—certainly in the case of Microsoft
    Access or MySQL, or an enterprise-level database system, such as Microsoft SQL
    Server or Oracle. Each of these is a relational database management system (RDBMS).
    The RDBMS model was developed in the 1970s and 1980s to enable database managers
    to store data in a way that reflected relationships between different types of
    data. We''ll return to the idea of relationships momentarily, but first you should
    understand the objects that make up databases.


    Data in a database is stored in tables. At first glance, tables look like Excel
    spreadsheets, in that they are made of rows and columns. The columns, called fields,
    contain a single category of information. The rows, called records, contain a
    single set of information comprising one element of data for each field. For example,
    in a table called tbl_customers, you might expect to find fields for first name,
    address, city, state, postal code, phone number, and so on. Each individual customer
    would have her or his own record.


    The accompanying figure shows a table from the Newland database as it appears
    in Access. This table contains basic information about countries. You can easily
    see each country listed in a row in the countryName field, and you''ll see that
    each country has the same type of information listed. You can edit tables directly
    by clicking in a cell and typing away, but there is a better way, which is to
    use an interface, such as Access forms or a Web form.'
