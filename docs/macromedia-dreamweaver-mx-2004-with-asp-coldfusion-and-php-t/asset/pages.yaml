    not restart unless you go back to the Terminal, log in, navigate to the usr/local/mysql
    directory, and re-execute the mysqld_safe & command from the bin directory.


    > **TIP** You can write a simple script that executes this command for you automatically
    every time you log in. A quick Web search should result in a number of sample
