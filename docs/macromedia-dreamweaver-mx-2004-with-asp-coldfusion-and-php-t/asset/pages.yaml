- pgno: 102
  md: '**TIP** The tag selector is a very useful tool for specifying which tag you
    want to affect in a Dreamweaver operation. One of the challenges when working
    with a graphical program to edit HTML code is that it is often hard to tell the
    editor which element in a group of nested elements you want to affect. For example,
    if you want to add background color to a string of text, how does the editor know
    that you are not actually trying to change the background color of a <td> cell
    that the string of text happens to be nested in?


    **TIP** A related problem is getting Dreamweaver to display the version of the
    Property inspector that you want. Imagine you want to change the cellpadding attribute
    of a table used for page layout. How can you get the Property inspector to show
    the settings for the <table> element, rather than the settings for one of the
    dozens of elements nested inside it? The answer is the tag selector: Click anywhere
    on the page that''s inside the attribute you are trying to affect, and then select
    the desired tag from the tag selector. The Property inspector shows settings for
    that tag, and the context menu provides several additional options for modifying
    it.


    7) Click the <p> tag in the tag selector, and then click navhead in the Style
    drop-down menu in the Property inspector.


    Not only does the heading update in design view, but the new style is reflected
    both in the source and in the tag selector itself.


    # CLASS ATTRIBUTE APPEARS IN HTML CODE


    ![](img/43fd0127a958864ab2d93e28efe683e7_102_0.png)


    APPEARANCE OF THE NAV BAR HEADER UPDATES IN DESIGN VIEW TAG SELECTOR DISPLAYS
    THE ATTACHED STYLE'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'Let''s take a moment to look at the code:


    ```

    <p class="navhead">Explore the Site</p>

    ```


    In the previous task, when you redefined HTML tags, the pages updated instantly,
    and you did not need to update the code. To apply a CSS class, however, you need
    to change the HTML code. Specifically, you add the class attribute to the desired
    HTML tag, and list the style name (without the period) as the value of the attribute.
    The class is attached to the whole tag, and everything inside it, including text,
    images, and other tags, is affected by the style.


    You cannot, therefore, attach a class to a portion of a tag. For example, if you
    wanted to attach the navhead style just to the word Explore, you could not do
    so by attaching the style to the <p> tag, because the style would be applied to
    everything else in the tag as well. However, you can get the same effect by creating
    a new tag around Explore and attaching the class to that tag. To do so, you''d
    use the inline tag <span> since it is used to create arbitrary inline containers
    that you can use to specify a part of a larger element. So, to complete the example,
    if for some reason you wanted to put just Explore in the .navhead style, the code
    would look as follows: <p><span class="navhead">Explore</span> the Site</p>.


    **NOTE** Another convenient way to apply CSS styles is through the Property inspector.
    Position the insertion point inside any paragraph of text, and in the Property
    inspector, click the A icon between the Format and Font fields, which toggles
    the Property inspector into CSS Mode. Once in CSS Mode, the most common HTML tags
    and custom CSS classes become available inside the Property inspector.


    +   8) Repeat steps 7 and 8 to remove the <em> tag around the image caption beside
    the picture of the Japanese shrine, and then apply the .caption class to that
    paragraph. The display in design view shouldn''t change, since the <em> tag you
    are removing is represented with italics, and since the .caption style you are
    attaching specifies only italics. But you should see the changes reflected in
    the tag inspector and in the source code itself.


    +   9) Remove the <strong> tags around the author byline (By Ellen Olenksa), and
    attach the .author class to that paragraph. Again, the page appearance won''t
    change, but the class should be reflected in the tag inspector and in the source
    code.


    +   10) Save and close index.htm. You''ve completed the design and presentation
    of index.htm. All changes made to it from this point forward will affect its content
    and functionality, but not its design.'
  merge: -1
  img_proc: true
