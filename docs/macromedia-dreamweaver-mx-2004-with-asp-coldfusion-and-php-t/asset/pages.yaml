    70     Response.Write(" selected")

    71     End If

    72     %>

    73     <% =rs_regions("regionName") %></option>

    74     <%

    75     rs_regions.MoveNext

    76     Loop

    77     %>

    78

    ```


    Pay close attention to spacing when you type this code—it is important that there
    is a space before `selected`, so that it does not run into the value="X" that
    precedes it.


    ASP and PHP users may note that this section uses different syntax for the `<option>`
    statement than it did in the menu you built in the insert form at the beginning
    of the lesson. Rather than a single ASP/PHP block that concatenates multiple elements
    to construct the `<option>` line, it uses multiple ASP/PHP blocks, using the ASP
    (`<%...%>`) or PHP delimiters (`<?...?>`). There is no functional impact to this
    change. The main difference is that the code is easier to understand once you
    add the `if` section, when broken out like this.


