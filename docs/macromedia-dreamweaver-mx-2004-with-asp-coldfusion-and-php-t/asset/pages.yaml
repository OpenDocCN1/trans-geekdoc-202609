- pgno: 234
  md: '![](img/43fd0127a958864ab2d93e28efe683e7_234_0.png)


    ACTIVE ROW RECORD NAVIGATION


    Tables aren''t the only type of object you can expect to find in databases. Also
    of note are forms, reports, and queries. **Forms** are used to insert new data
    and modify existing data. The form used to build the country table shown in the
    preceding screenshot can be seen in the following screenshot. Forms make it easy
    to insert and edit information, and you can also use them to control the type
    of information entered, which helps ensure the integrity of the data entered.
    At the bottom of the form is a group of record navigation buttons, which you can
    use to access the record you want to edit, or to create a new record from scratch.


    > **NOTE** By itself MySQL lacks a GUI interface. Commands are issued to MySQL
    through the command line. It is, however, possible to download a GUI interface
    for MySQL, such as phpmyadmin. However, no MySQL interface has the same level
    of depth and complexity as that of Access. MySQL handles the important part—data
    storage and access—arguably better than Microsoft Access, but MySQL''s interface
    is minimalist, at best.


    ![](img/43fd0127a958864ab2d93e28efe683e7_234_1.png)'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'Whereas forms are a means of inputting information into tables, **reports**
    are a means of outputting that data. You probably noticed that it was impossible
    to read all of the information in the table directly, because the fields weren''t
    wide enough to accommodate all the text. You can use reports to make data presentable.
    Better yet, you can selectively show only some data in reports, rather than showing
    all of it, which makes reports much more useful.


    | countryName | population | country_currency | description |

    |---|---|---|---|

    | Argentina | 36265463 | Nuevo Peso Argentinos | South America''s second-largest
    country spans from the Andes to several islands in the Atlantic, and all the way
    down to Punta Dungeness, the southern extreme of the content. With thousands of
    miles of coastline and home to one of the world''s most formidable mountain ranges,
    Argentina is a hiker''s paradise. |

    | Canada | 30007094 | Canadian Dollar | Country to the north of the United States,
    Canada is famous for its bilingual population (French and English), ice hockey,
    Niagara Falls, and Banff National Park. |

    | Egypt | 66050004 | Egyptian Pound | Home of one of the most advanced-and well
    preserved-ancient civilizations, Egypt is famous for its Pyramids, tombs, the
    Nile, and other landmarks 90 percent of its landmass is uninhabited desert |

    | France | 58804944 | Euro | From Paris street cafes to mountain chalets in the
    Alps and villages in the French Riviera, France is a class... |


    You use **queries** to show data selectively in reports. Queries are like searches:
    You provide certain criteria, and the database returns a report. For example,
    you could obtain a report of all the countries in the Newland database that begin
    with ''T'', which would return ''Taiwan'' and ''Thailand''. Queries are written
    in a language called SQL, or **Structured Query Language**. You will use SQL heavily
    when working with databases, beginning with this chapter, because you must use
    SQL to retrieve data from a database to make it available for Web pages via ASP,
    ColdFusion, or PHP. The reason for this is that SQL is the primary means that
    developers have to communicate with database systems. Access has a visual SQL
    editor, but you can''t use it in Dreamweaver. In Dreamweaver, you can hand-code
    SQL, or use Dreamweaver''s visual SQL editor.'
