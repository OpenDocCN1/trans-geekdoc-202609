- pgno: 170
  md: '+   7) Return to animal_home_page.asp. In the Bindings panel, add a QueryString/URL
    variable named mypet.


    ![](img/43fd0127a958864ab2d93e28efe683e7_170_0.png)


    This is the variable that you coded into the each link''s URL on the previous
    page. But you set each one to a different value—Cat or Dog. In this step, you
    are using the Bindings panel to retrieve this name-value pair.


    +   8) Position the cursor just ahead of Person in the heading. Click the mypet
    variable in the Bindings panel, and click Insert. Add another instance of this
    variable before person in the body paragraph. Save and upload the page.


    ![](img/43fd0127a958864ab2d93e28efe683e7_170_1.png)


    The application is complete.'
