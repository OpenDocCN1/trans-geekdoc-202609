- pgno: 205
  md: '# # building a tour price calculator


    # ## LESSON 7


    One of the most significant benefits of dynamic Web sites is that they are capable
    of including self-service applications. Self-service applications are a win-win
    situation for businesses and customers alike. Customers don''t have to go to the
    trouble of calling a number, pressing a sequence of numbers ("please press 3,
    now"), and sitting interminably on hold ("your call is important to us"), only
    to learn that office hours ended three hours ago. Businesses decrease incoming
    calls, which decreases long-distance phone charges and hours, and yet they can
    still serve customers 24 hours, 7 days a week.


    In this lesson, you will build a tour price calculator, which enables users to
    obtain an estimate for the cost of a tour based on the number of adults and children
    going on


    ![](img/43fd0127a958864ab2d93e28efe683e7_205_0.png)


    Your application both enables users to build customized estimates and ensures
    that they enter the correct information, displaying an error message inline if
    they do nat.'
  merge: -1
  img_proc: true
