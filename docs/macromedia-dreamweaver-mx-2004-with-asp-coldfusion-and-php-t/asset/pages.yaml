    11   set cdoMessage=server.CreateObject("CDO.Message")

    12   cdoMessage.Configuration=cdoConfig

    13

    14

    15   <html xmlns="http://www.w3.org/1999/xhtml">

    16   <head>

    ```


    # 5) Customize the instance so that it can send desired information to the proper
    email address. To do so, add the following code just above the closing %> (ASP)
    or  (ColdFusion). PHP users: enter the line of PHP below, in the empty space you
