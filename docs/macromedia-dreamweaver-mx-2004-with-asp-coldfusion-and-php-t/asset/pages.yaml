    ```


    Then, ASP users should add two new lines, as follows:


    ```

    Set cdoMessage=Nothing

    Set cdoConfig=Nothing

    ```


    For ColdFusion, amend the  tag so that it reads as follows, substituting [enter
    your email address] with your actual email address:


    ```

    <cfmail from="yourname@yourserver.com" to="yourname@yourserver.com"

