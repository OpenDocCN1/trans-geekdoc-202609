  md: '# CREATING THE UPDATE RECORD DETAIL PAGE


    The master page is ready, so the next step is to create the detail page. In this
    task, you''ll build the detail page used for updating records. You won''t actually
    need a detail page for deleting a record, because users don''t need to see any
    details about the page—they just need a script to process the deletion.


    The update page that you are about to create looks quite a bit like the page that
    you built enabling users to insert new country files. In fact, the page will use
    a modified version of the same form. The only differences are that the form fields
    will already be filled in on the update page, and, of course, when the user submits
    the form, a database record will be updated, rather than a new one created.


    +   1) Open admin_cp_insert.asp. Choose File > Save As, and save it as admin_cp_update.asp
    (overwriting the original file). Change the page heading to Update a Country Profile,
    and change the page title to Newland Tours Admin: Update a Country Profile.


    In doing so, you preserve the form you created as well as the rs_regions recordset,
    which retrieves all of the regions and their IDs, and populates the Region drop-down
    menu.


    When you use this technique, you must keep in mind all of the things you will
    need to change. In this form, each of the fields must be automatically populated
    with appropriate data from the database for the chosen country; a new recordset
    will need to be created to facilitate this change. The action attribute of the
    <form> tag needs to point to admin_cp_update_processor.asp, rather than the insert
    processor page, and the form ought to be renamed.


    +   2) In code view, find the opening <form> tag, and set its attributes, as follows.


    action (ASP):


    ```

    admin_cp_update_processor.asp?countryID=<%=Request.QueryString("countryID")%>

    ```


    action (ColdFusion):


    ```

    admin_cp_update_processor.cfm?countryID=<cfoutput>#URL.countryID#</cfoutput>

    ```


    action (PHP):


    ```

    admin_cp_update_processor.php?countryID=<?php echo $_GET[''countryID'']; ?>

    ```


    method: post (same as before)


    name: frm_updateProfile


    id: frm_updateProfile


    This is an easy step to overlook, so it''s best to get it done right away.'
