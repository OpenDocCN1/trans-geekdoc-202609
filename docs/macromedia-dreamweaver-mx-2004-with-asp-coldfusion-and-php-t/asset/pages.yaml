    # ADDING THE DELETE FUNCTIONALITY


    Writing the script for the delete processor page is even easier than writing the
    script for the update processor. Remember, users will access this page from the
    master page, which you have already built, so all that remains is to add the script
    that deletes the record from the database.


    # 1) Open admin_cp_delete_processor.asp in code view, and remove any code.


    Once again, this page will contain only a short script and a redirect elsewhere,
    so it needs no HTML code at all.


    # 2) Add the code that creates the connection.


    In ASP:


    ```

    <%

    Dim dbConn

    set dbConn = server.CreateObject("adodb.connection")

    dbConn.open("newland")

    %>

    ```


    In ColdFusion:


    ```

    <cfquery name="delete_country" datasource="newland">

    </cfquery>

    ```'
