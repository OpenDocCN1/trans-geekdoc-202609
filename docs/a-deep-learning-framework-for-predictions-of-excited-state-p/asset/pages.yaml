    In conclusion, this article proposed a deep learning approach to effectively capture
    the electronic properties of fluorescent molecules. Deep neural network, convolutional
    convolution, recurrent neural network, and message-passing models are able to
    predict the transition energies, oscillator strengths, and single-triplet TDFT
    materials. Satisfactory performances are achieved, with $R^2$ of the first oscillator
    above 0.7 and that of energy shifts above 0.8, demonstrating the robustness of
    deep learning methods in describing the TDFT mechanism. It showed that the 1-dimensional
    representation (represented by RNN) and 2-dimensional representation (represented
    by GNN) which we used can deliver comparable performances with the best 3-dimensional
    model (predicted by SchNnet), using atomic features and dynamic interactions,
    implying the diversity of the neural architectures that can be suitable for resolving
    the electronic transition. The investigation has provided a comprehensive ML framework
    for predictions of excited-state properties.


