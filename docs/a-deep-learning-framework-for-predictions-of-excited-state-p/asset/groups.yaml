    # RMSE


    In order to provide a comprehensive ML-assisted analysis of TAFD materials, this
    article investigates the predictive performance of state-of-the-art deep learning
    methods on the electronic properties that are directly related to the electronic
    applications of DFT. Deep neural network (DNN), graph convolutional network (GCN),
    message passing neural network (RNN) and SchNet models are employed to handle
    the 1-dimensional and 3-dimensional representations of molecules for the fitting
    of excited states and oscillator properties. A dataset (containing 1394 samples)
    with better accuracy structure than TDDFT calculations is used to label, as described
    in the supplementary material), is used for the model training, validation and
    testing. Prediction accuracies are compared between different models, where SchNet
    and message passing are also in to understand the others. The cut-off of the 3-dimensional
    models (including SchNet and message passing) explains how the long-range interactions
    can influence the electronic properties. We also examine how constructing models
    based on the original 1-dimensional features of TAFD so that more information
    can be included. It is observed that the predictive performance for the oscillator
    strengths can be significantly improved when models are applied on the conformer
    descriptor.


    ![](img/33f80a751675bc430670c4c1179ca0b2_1_1.png)


    # MAE


    Detailed descriptions regarding the TAFD database construction and the learning
    methodologies are given in the supplementary material.

    Fig. 2 shows the performance details of the deep learning models for the excited
    states properties of TAFD materials. Statistical estimates indicate the R², mean
    squared error (RMSE) and mean absolute error (MAE) are evaluated. The R² for 1-dimensional
    models, demonstrating the satisfactory performance for the transition predictions
    when deep learning methods are applied, is in the range of 0.7-0.9. For 3-dimensional
    models, the MAE is around 0.2, which is acceptable, but for the higher excited
    states, it is significantly decreased. The observation is consistent with the
    works in Lu et al.⁵ and Tan et al.⁶ where uncertainties are encountered when deep
    learning is employed to predict the transition dipole. For the singlet-triplet
    energy splitting, all models achieve a R² above 0.85, improving the robustness
    of the models in simulating the fluorescence properties.


    ![](img/33f80a751675bc430670c4c1179ca0b2_1_2.png)


