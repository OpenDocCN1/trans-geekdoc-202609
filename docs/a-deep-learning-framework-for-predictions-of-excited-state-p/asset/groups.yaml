    # Communication


    # View Article Online


    # NJC


    ![](img/33f80a751675bc430670c4c1179ca0b2_3_0.png)


    Fig 4 SchNnet predictions of excited state properties for the TDFT conformer.
    The test data indicates that the model is applied on and the blue is the line
    indicator.


    in addition to a sophisticated ML model, the torsional-angle profile between the
    donor and acceptor can be equally important for the accurate prediction of the
    transition dipoles.


    In conclusion, this article proposed a deep learning approach to effectively capture
    the electronic properties of fluorescent molecules. Deep neural network, convolutional
    convolution, recurrent neural network, and message-passing models are able to
    predict the transition energies, oscillator strengths, and single-triplet TDFT
    materials. Satisfactory performances are achieved, with $R^2$ of the first oscillator
    above 0.7 and that of energy shifts above 0.8, demonstrating the robustness of
    deep learning methods in describing the TDFT mechanism. It showed that the 1-dimensional
    representation (represented by RNN) and 2-dimensional representation (represented
    by GNN) which we used can deliver comparable performances with the best 3-dimensional
    model (predicted by SchNnet), using atomic features and dynamic interactions,
    implying the diversity of the neural architectures that can be suitable for resolving
    the electronic transition. The investigation has provided a comprehensive ML framework
    for predictions of excited-state properties.


    Test set performances for SchNnet applied on the original-D dataset and the generated
    dataset. The cut-off is set to 20 for the first oscillator and 5 for the conformer.


    | SchNnet for original | SchNnet for conformer |

    |---|---|---|---||

    | | RMSE | MAE | RMSE | MAE |

    | $S_1$ | 0.7692 | 0.1309 | 0.0724 | 0.0548 |

    | $S_f$ | 0.2567 | 0.1498 | 0.0718 | 0.0807 |

    | $S_{\Delta E}$ | 0.2254 | 0.0689 | 0.0574 | 0.0435 |

    | $S_{\mu}$ | 0.0877 | 0.0546 | 0.0103 | 0.0784 |


    By developing the conformer in a stochastic search algorithm, we created a twisted
    D-A molecule based on the original TDFT samples. High-throughput methods implemented
    helped learn the transition properties of more than 60 conformers. SchNnet is
    employed to test the prediction of the oscillator strengths and the energy gaps
    for them.


    suppressed the prediction of resonance where SchNnet can describe the null and
    non-null values. No remarkable change is detected for the $S_{\Delta E}$ prediction
    between original and test sets. We note that a 5 Å cut-off for the conformer,
    as trained, provides the best average performance for excited state properties
    compared to lower cut-offs.


    Even though the performance improves for the prediction of the oscillator strengths,
    $S_f$ and $S_{\Delta E}$ is still limited. The enriched twisting information may
    help better to capture the first order oscillator strength (due to its relation
    to the overlap), similarity improvement does not occur for $S_{\Delta E}$.


    # Conflicts of interest


    There are no conflicts to declare.


    To the best of our knowledge, we have achieved a high quality prediction for the
    oscillator strength with the out-of-sample $R^2$ around 0.92. The level is in
    significant contrast with the previous works, where $R^2$ is reported in the limited
    range of 0.7–0.8, and predictive uncertainties can be encountered. The current
    research reveals


