    We have implemented a deep learning framework to forecast the excited state properties
    for thermally activated delayed fluorescence (TADF) molecules with satisfactory
    accuracy being achieved. In particular, for the oscillators, precisions have been
    significantly improved when the torsional profile of the


    and reducing the frontier orbital overlap. Currently, most of the TADF design
    is based on the D-A dihedral twisting is properly adjusted to realize the separation
    of the frontier orbitals (i.e., HOMO and LUMO), and the oscillator strength to
    be accurately simultaneously.


    Thermally activated delayed fluorescence (TADF) materials, as the third generation
    of diodes, have been extensively studied in the past due to their high potential
    in making organic light-emitting diode (OLED) devices. To simply demonstrate its
    operation mechanism upon excitation, TADF molecules can getters via reverse intersystem
    crossing (RISC) to the singlet energy gap. In Fig. 1, the triplet exciton can
    get with a high internal quantum efficiency approaching 100%. By the conventional
    fluorescent and phosphorescent materials, TADF have the advantages of larger material
    space, low fabrication cost without the use of heavy atoms, and more blue-light


    The design of TADF materials requires managing singlet-triplet gaps. It is known
    that time-dependent density functional theory (TDDFT) can have reasonable accuracy
    in describing the excited state properties, and it has been extensively used in
    high throughput screening for the exploration of the TADF search space. However,
    high throughput calculation can suffer from the large number of molecules. With
    the advent of machine learning (ML), molecular discovery has entered a new era,
    which can significantly shorten the material research and development cycle. For
    particularly TADF molecules, deep neural network (DNN) has been used to predict
    the physical properties including the TADF luminescence


    The design of TADF molecules is challenging, since it requires the optimization
    of opposing properties, i.e., the oscillator strength f and the first singlet-triplet
    gap ΔEST. An efficient emission in TADF requires f to be maximized and ΔEST to
    be minimized,


