    # 通信


    # 在线阅读


    # NJC


    ![](img/33f80a751675bc430670c4c1179ca0b2_3_0.png)


    图 4 SchNnet 对 TDFT 构象体激发态性质的预测。测试数据表明模型已应用于此，蓝色为指示线。


    除了复杂的机器学习模型外，供体和受体之间的扭角分布对于准确预测跃迁偶极可能同样重要。


    总之，本文提出了一种深度学习方法来有效捕获荧光分子的电子性质。深度神经网络、卷积神经网络、循环神经网络和消息传递模型能够预测跃迁能量、振子强度以及单三线态
    TDFT 材料。取得了满意的性能，第一个振子的 $R^2$ 高于 0.7，能量移的 $R^2$ 高于 0.8，证明了深度学习方法在描述 TDFT 机制方面的稳健性。结果表明，我们使用的
    1 维表示（由 RNN 表示）和 2 维表示（由 GNN 表示）在使用原子特征和动态作用的情况下，可以提供与最佳 3 维模型（由 SchNnet 预测）相当的性能，这意味着适用于解决电子跃变的神经架构具有多样性。该研究为激发态性质的预测提供了一个全面的机器学习框架。


    SchNnet 应用原始-D 数据集和生成数据集的测试集性能。第一个振子的截断值设置为 20，构象体设置为 5。


    | 原始数据的 SchNnet | 构象体的 SchNnet | | | |

    | :--- | :--- | :--- | :--- |

    | | RMSE | MAE | RMSE | MAE |

    | $S_1$ | 0.7692 | 0.1309 | 0.0724 | 0.0548 |

    | $S_f$ | 0.2567 | 0.1498 | 0.0718 | 0.0807 |

    | $S_{\Delta E}$ | 0.2254 | 0.0689 | 0.0574 | 0.0435 |

    | $S_{\mu}$ | 0.0877 | 0.0546 | 0.0103 | 0.0784 |


    通过在随机搜索算法中开发构象体，我们基于原始 TDFT 样本创建了一个扭曲 D-A 分子。实现的高通量方法帮助学习了 60 多种构象体的跃迁性质。采用 SchNnet
    来测试它们振子强度和能隙的预测。


    抑制了共振的预测，SchNnet 可以描述零值和非零值。在原始集和测试集之间，$S_{\Delta E}$ 的预测没有检测到显著变化。我们注意到，经过训练的构象体
    5 Å 截断值与较低的截断值相比，提供了激发态性质的最的平均性能。


    尽管振子强度预测性能有所提高，但 $S_f$ 和 $S_{\Delta E}$ 仍然受到限制。丰富的扭转信息可能有助于更好地捕获一阶振子强度（因为它与重叠性有关），但
    $S_{\Delta E}$ 的相似性并未得到改善。


    # 利益冲突


    无需要声明的冲突。


    据我们所知，我们对振子强度实现了高水平预测，样本外 $R^2$ 约为 0.92。这一水平与之前的工作形成鲜明对比，之前的工作报道的 $R^2$ 在 0.7–0.8
    的有限范围内，且可能会遇到预测不确定性。目前的研究揭示了


