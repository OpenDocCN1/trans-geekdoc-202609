  mdcn: "\n\n# NJC\n# 通信\n\n在线阅读文章\n查看期刊 | 查看期\n\n![](img/33f80a751675bc430670c4c1179ca0b2_0_0.png)\n\
    \n# 一种用于发光分子激发态性质预测的深度学习框架†\n\n引用本文：New J. Chem., 2023, 47, 9550\n\n接收于：2023年3月12日。\n\
    接纳：2023年4月29日。\nDOI: 10.1039/d3n0174g\n\nrsc.nijc\n\nZheng Tan,a Yan Li,b Zying\
    \ Zhang,c Thomas Penfold,d Weimei Shi,e Shiqing Yang†a and Wanli Zhang†b\n\n我们实现了一个深度学习框架，用于预测热热活化延迟荧光（TADF）分子的激发态性质，并达到了令人满意的准确率。特别是对于振子，当通过适当调整D-A（给体-受体）二面角的扭转分布以实现前沿轨道（即HOMO和LUMO）的分离时，同时准确预测振子强度的精度显著提高。\n\
    \n热热活化延迟荧光（TADF）材料作为第三代二极管，由于其在有机发光二极管（OLED）器件中的巨大潜力，过去已被广泛研究。为了简单演示其激发后的工作机制，TADF分子可以通过反系间跨越（RISC）获得单重能隙。如图1所示，三重态激子可以以接近100%的高内量子效率获得。与传统的荧光和磷光材料相比，TADF具有更大的材料空间、无需重原子的低制备成本以及更多的蓝光发射等优势。\n\
    \nTADF材料的设计需要管理单三态能隙。众所周知，时间依赖密度泛函理论（TDDFT）在描述激发态性质方面具有合理的准确性，并被广泛用于高通量筛选以探索TADF搜索空间。然而，高通量计算可能会受到分子数量庞大的困扰。随着机器学习（ML）的出现，分子发现进入了一个新时代，可以显著缩短材料的研发周期。对于特定的TADF分子，深度神经网络（DNN）已被用于预测包括TADF荧光在内的物理性质。\n\
    \nTADF分子的设计具有挑战性，因为它需要优化相反的性质，即振子强度 $f$ 和第一单三态能隙 $\\Delta_{EST}$。TADF的有效发射要求 $f$\
    \ 最大化且 $\\Delta_{EST}$ 保持最小常¹，单态和三重态激发以及振子强度²。\n\n![](img/33f80a751675bc430670c4c1179ca0b2_0_1.png)\n\
    \na成都理工大学, 63 Tian Street, Chengdu, 610000, P. R. China.\nEmail: zhengtan88@gmail.com\n\
    b成都科技大学信息电子膜与集成电路国家重点实验室, 617137, P. R. China.\nc广州信息技术, 2 Ruyi Road, Panyu District,\
    \ Guangzhou, 511441, P. R. China.\nd纽卡斯尔大学化学与环境科学系, Newcastle Tyne, NE8 7RU, UK.\n\
    e电子补充信息（ESI）。可用于: https://doi.org/10.1039/d3n0174g\n\n9550 | New J. Chem., 2023,\
    \ 47, 9550–9554\n\n这是英国皇家学会和法国国家科学中心2023版\n\n## R平方\n\n## RMSE\n\n## MAE（均绝对误差）\
    \ \n\n观察到，对于跃迁和对应数据，DNN可以做出与TDDFT计算相当的高质量预测。然而，对于振子强度，其预测的准确性较低，尤其是对于激发态。其原因归于DNN的二维指纹无法识别三维结构，而这对于能量估计至关重要。在Lu等³和Kang等⁴的工作中也遇到了类似的结果，他们声称机器学习应用于跃迁偶极矩的预测。\n\
    \n![](img/33f80a751675bc430670c4c1179ca0b2_1_0.png)\n\n为了对TADF材料提供全面的机器学习分析，本文研究了最先进的深度学习方法对电子性质的预测性能。深度神经网络（DNN）、图卷积网络（GCN）、消息传递网络（RNN）和SchNet被用于处理激发态和振子性质的一维和三维表示。一个包含1394个样本的数据集准确性优于TDDFT计算（如补充材料所述），用于模型的训练、验证和测试。比较了不同模型之间的预测准确率，SchNet和消息传递。三维模型（包括SchNet和消息传递）解释了长程相互如何影响电子性质。我们还检查了基于TADF一维特征构建的模型，以便包含更多信息。观察到，当对构象描述符应用模型时，振子强度的预测性能可以显著提高。\n\
    \n![](img/33f80a751675bc430670c4c1179ca0b2_1_1.png)\n\n关于TADF数据库和学习方法的详细描述见补充材料。图2显示了深度学习模型对TADF材料激发态的性能。统计估计，$R^2$、均方根误差（RMSE）和均绝对误差（MAE）的评估结果如下。对于一维模型，当应用深度学习方法时，$R^2$在0.7-0.9范围内，表现出良好的跃迁预测性能。对于三维模型，MAE约为0.2，是可以接受的，但对于高激发态，它显著下降。这一观察与Lu等⁵和Tan等⁶的工作一致，在使用深度学习预测跃迁偶极矩时，所有模型的$R^2$均达到0.85，提高了模拟荧光性质的模型稳健性。\n\
    \n![](img/33f80a751675bc430670c4c1179ca0b2_1_2.png)\n\n> 图2 测试集中激发态性质的预测统计估计，$S_1,\
    \ S_2, T_1, T_2, T_3$ 分别代表单态和三重态。S表示振子强度，$\\Delta_{ST}$是eV单位的能量。对于MP和SchNet模型，截断值分别设置为2和5\
    \ Å。为了比较DNN、RNN和SchNet模型之间的性能，SchNet在振子强度上的平均精度（如表1所示）优于GAN。有趣的是，三维模型（由SchNet表示）并不一定优于一维（由RNN表示）和二维（由DNN表示）模型，尽管它可以捕捉更多的几何信息。具体而言，对于每个模型，DNN在振子强度上具有最佳预测。表1\
    \ 激发态性质模型平均。对于RMSE和MAE，使用能量和振子强度对十个目标进行了采样。图2，MP和SchNet模型的截断值分别设置为5和20。\n\n| 测试平均性能\
    \ | RMSE | MAE |\n|---|---|---|\n| DNN | 0.7466 | 0.0892 | 0.0546 |\n| GCN | 0.6925\
    \ | 0.1010 | 0.0516 |\n| RNN | 0.7451 | 0.0080 | 0.0556 |\n| MP | 0.7018 | 0.0039\
    \ | 0.0619 |\n| SchNet | 0.7489 | 0.0047 | 0.0575 |\n\n![](img/33f80a751675bc430670c4c1179ca0b2_2_0.png)\n\
    ![](img/33f80a751675bc430670c4c1179ca0b2_2_1.png)\n![](img/33f80a751675bc430670c4c1179ca0b2_2_2.png)\n\
    ![](img/33f80a751675bc430670c4c1179ca0b2_2_3.png)\n\n在所有识别目标上均表现中等，这表明了二维图在预测激发态性质方面的可能性（注意参考结构）。与基态预测形成显著对比的是，GCN通常使用最好的预测⁵，尽管模型仅将SMILES字符串作为输入且没有任何结构相似性；RNN在许多性质上表现良好。MP在激发态能量方面表现良好，特别是对于三重态，$R^2$高于0.3。它在振子强度上的表现较差（除了第一个激发态），对于$S_{f,j}$，$R^2$为0.01。结果显示三D模型无法描述高阶跃迁。关于SchNet，与其他模型相比，测试集中的平均性能（表1）。SchNet的MAE在0.03-0.05\
    \ eV范围内，与有机半体的激发态预测误差相当¹¹。SchNet能够为基态和激发态（在本报告中）提供良好结果这一事实表明，模型可能捕捉了量子多体物理中的主要特征以解决电子结构问题。\n\
    \n"
