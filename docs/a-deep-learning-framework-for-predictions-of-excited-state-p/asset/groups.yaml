    5 Å, respectively.


    To compare performances between models, DNN, RNN and SchNet give relatively better
    accuracy on average (as shown in Table 1) than GAN and MI. It is interesting that
    the 3-dimensional model (represented by SchNet) does not necessarily outperform
    the 1-dimensional (represented by RNN) and 2-dimensional (represented by DNN)
    models, even though it can capture more geometrical information of molecules.


    Specifically for each model, DNN has the best prediction across the three oscillator
    strengths. GCN'
