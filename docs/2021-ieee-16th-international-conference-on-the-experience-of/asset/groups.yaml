    # I. INTRODUCTION


    Today is becoming increasingly important to integrate trusted user authentication
    to IT solutions to protect devices that transmit sensitive data. Biometric data
    can be used to authenticate users and effectively protect the Internet of Things
    (IoT). However, user recognition and authentication management using artificial
    intelligence (IMAU) are becoming increasingly important for the security of platforms
    in all areas of IoT.


    The development of an attack detection system is one of the priority in the field
    of information security. The importance of solving this problem is due to the
    constant increase and diversity of threats to the IoT network, the implementation
    of which can lead to serious vulnerabilities and data loss, requires more effort
    and time and on the part of administrators and security analysts. In companies
    operating in production of products, to maintain the security of operations, human
