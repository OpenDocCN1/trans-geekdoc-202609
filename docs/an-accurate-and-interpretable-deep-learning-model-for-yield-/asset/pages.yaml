    and output layers. The input vectors comprise experimental parameters and features,
    hyperparameters such as the number of hidden layers are selected via grid search
    methods, detailed in Table S1 and Fig.-S7. Within the hidden layers, the rectified
    linear (ReLU) serves as the activation function.


