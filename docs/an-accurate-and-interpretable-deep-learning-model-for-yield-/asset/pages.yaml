    # 1. Introduction


    In the past few decades the use of CO2 as a renewable resource

    h received widespread attention from scientists. The CO2

    cycloaddition reaction can convert CO2 into high-value cyclic

    carbonates with 100% atom economy, making it one of

    tmost promising CO2 conversion strategies. Various

    carbamates used as solvents, electrolytes and organic

    synthesis have numerous applications. However, the

    thermodynamic stability and kinetic efficiency ofncatalysts are required to ensure
    the completion of

    cycloaddition reactions under mild conditions.

    homogeneous and heterogeneous catalysts have been


    reported, including metal-organic frameworks (MoFs), metal

    complex, ionic liquids (ILS),†

    Among these ILs, we have shown exceptional

    low vapor pressure, excellent thermal stability, and

    wide temperature range, making them ideal catalysts

    for CO2 cycloaddition reactions. Imidazolium-

    bases are the most common employed ILs-based

    catalysts to facilitate functionality and affinity

    CO2 molecules. For instance, Wang et.

    shesized poly cyclic carbonate

    92% at the temperature of 120 °C,

