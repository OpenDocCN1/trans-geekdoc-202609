    SHapley exPlanations (SHAP) is a Python package designed to explain the performance
    of machine learning models. Derived from cooperative game theory, SHAP treats
    all features as contributors, establishing an additive explanation model. Unlike
    traditional "feature importance" methods which only explain the importance of
    features, SHAP can also explain how features influence prediction accuracy. For
    each predicted sample, the model generates a prediction value, and the SHAP value
    represents the numerical contribution of each feature in the prediction. The ith
    sample is denoted as $x_i$, with $y_i$ as the predicted value of this sample.
    For the entire model, the mean of the target variable across all samples, $Y$,
