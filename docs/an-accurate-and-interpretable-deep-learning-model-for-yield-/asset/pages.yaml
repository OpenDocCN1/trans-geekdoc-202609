    Despite the high yield of CO2 cycloaddition reactions catalyzed by imidazolium-based
    and pyrazolium-based ILs, their application is hindered by stringent reaction
    conditions. Then there is an increasing demand for new catalysts that can function
    under mild conditions. Designing new imidazolium-based and pyrazolium-based ILs
    through theoretical calculations is expensive and challenging to maintain high
    success rates. The application of machine learning (ML) to predict such reactions
    has gained interest recently.$^{12}$ ML is based on the induction from historical
    data, cost-effective and high-throughput prediction of chemical properties.${13}$
    Researchers have made many explorations in predicting properties of ILs. For instance,
    Huang et al.${14}$ established the universal-chemical functional activity coefficient
    (UNIFAC) method to improve the solubility prediction of liquid-water mixtures,
    with $R^2$ of 0.99. Liu et al.${15}$ established a SVR-based model to predict
    the solubility of CO2 in ILs, achieving $R^2$ exceeding 0.98.


    However, research on the reactivity of ILs using ML methods remains scarce compared
    to physical properties of ILs. Notably, Li et al.${16}$ explored this area by
    establishing a ML model to predict the yield of cycloaddition reactions catalyzed
    by ILs. The best ML model achieved $R^2$ of 0.80 on a subset of imidazolium-based
    ILs, but ML showed lower performance on others. Thus, further exploration is needed
    in the study of ML for the reactivity of CO2 cycloaddition reactions catalyzed
    by ILs. Due to the limitation in computational power, traditional algorithms struggle
    to improve model accuracy.${17}$ In contrast, deep learning algorithms exhibit
    strong fitting capabilities, demonstrating superior performance in prediction.$^{18,19}$
    For instance, Gong et al.${20}$ employed dimensional molecular structure graphs
    to establish a deep learning model capable of predicting selectivity.


    This achieved outstanding results with minimal labeled data across three different
    chemical datasets, showing superior prediction ability compared to traditional
    algorithms.


    The main aim of this work is to develop a deep learning model that could predict
    the yield of CO2 cycloaddition reactions. Using ML, we aim to design efficient
    imidazolium-based and pyrazolium-based ILs under mild conditions. The research
    scheme is illustrated by hybrid fingerprint to describe the structural features
    of molecules in CO2 cycloaddition reactions. Using SHAP analysis, the model is
    interpreted to explore the effects on yield. By basing on a molecular chemical
    scheme, hundreds of ILs are generated. Finally, imidazolium-based ILs are generated
    using a screened-two screening strategy yielding prediction and DFT calculations
    of energy barrier. This work presents much contributing to advancing sustainable
    chemical processes and CO2 utilization technologies.


