    # An accurate and interpretable deep learning model for yield prediction using
    hybrid molecular representations†


    Yingwang Wang,abc Xiny Sun,abc Yuyuan Li,abc *abc Li Wang *abc and Jing Zhang
    abc


    In recent years, imidazolium-based ionic liquids (ILs) and pyrazolium-based ILs
    have shown efficient catalytic activity in CO2 cycloaddition reactions. However,
    these catalysts require stringent conditions to facilitate the reactions in the
    absence of co-solvents, limiting their applicability. There is an increasing demand
    for new ILs capable of operating under milder conditions. Traditional methods
    for designing ILs through theoretical calculations or experimental exploration
    are both costly and challenging. This study presents a deep learning model for
    predicting yield of CO2 cycloaddition by imidazolium-based and pyrazolium-based
    ILs. The Model utilizes hybrid features to capture the structural information
    of molecules achieved in squared correlation coefficient (R²) value of 0.98. The
    Shapley Additive explanations (SHAP) technique is established to create new structures.
    Through a two-step strategy yield prediction using the deep learning model and
    energy barriers via functional theory (DFT), 4 promising imidazolium-based ILs
    are identified as potential catalysts for CO2 cycloaddition reactions with epichlorohydrin
    under mild conditions. This work introduces a novel learning approach for designing
    imidazolium-based ILs and pyrazolium-based ILs, aimed at reducing experimental
    burden and costs associated with catalyst development.


    Received 6th May 2025,

    Accepted 30th June 2025

    DOI: 10.1039/D4ce02025X

