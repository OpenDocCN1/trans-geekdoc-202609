    # 一种用于产量预测的基于分子表示准确且可解释的深度学习模型†


    Yingwang Wang,abc Xiny Sun,abc Yuyuan Li,abc *abc Li Wang *abc and Jing Zhang
    abc


    近年来，基于咪唑的离子液体（ILs）和基于吡唑的离子液体在 CO2 环加反应中表现出高效的催化活性。然而，这些催化剂在没有共溶剂的情况下需要严苛的条件才能促进反应，这限制了它们的适用性。目前对能够在温和条件下运行的新型离子液的需求日益增加。通过理论计算或实验探索设计离子液的传统方法既昂贵又具有挑战性。本研究提出了一种深度学习模型，用于预测基于咪唑和吡唑的离子液体催化的
    CO2 环加反应的产量。该模型利用混合特征捕捉分子的结构信息，其平方相关系数（R²）达到 0.98。建立了 Shapley 加性解释（SHAP）技术来构建新结构。通过使用深度学习模型预测产量和通过泛函理论（DFT）计算能垒的两步策略，鉴定出
    4 种极具前景的基于咪唑的离子液体作为温和条件下环氯丙烷催化 CO2 环加反应的潜在催化剂。这项工作引入了一种设计基于咪唑和吡唑离子液体的新型学习方法，旨在减少与催化剂开发相关的实验负担和成本。


    收稿：2025年5月6日

    接收：2025年6月30日

    DOI: 10.1039/D4ce02025X

    rsc.ll/reaction-engineering


    # 1. 引言


    在过去的几十年里，将 CO2 作为可再生资源的使用受到了科学界的广泛关注。CO2 环加反应可以以 100% 的原子经济将 CO2 转化为高价值的环碳酸酯，使其成为最有前景的
    CO2 转化策略之一。作为溶剂、电解质和有机合成的各种氨酸酯具有许多应用。然而，为了确保在温和条件下完成环加反应，需要催化剂具有热力学稳定性和动力学效率。已有报道关于均相和多相催化剂，包括金属有机框架（MoFs）、金属配合物、离子液体（ILs），†


    在这些离子液体中，我们展示了它们极低的蒸气压、优异的热性和宽的温度范围，使其成为 CO2 环加反应的理想催化剂。基于咪唑的是最常用的离子液体类催化剂，以增强其功能性和对
    CO2 分子的亲和力。例如，Wang 等人在 120 °C 温度、1.5 MPa CO2 压力下、催化产量 0.5 mol%、反应时间 2.0 h 后合成了聚环碳酸酯（92%）。Ye等人⁸合成了一系列具有羟基和氨基双重功能的基于咪唑的离子液体，它们在
    90 °C 的反应温度和 12.5 h 的时间内表现出高催化活性。Zhang等人⁹合成的化合物与基于咪唑的离子液体具有高度结构相似性，也展示了卓越的催化潜力。例如，Zhang等人¹¹合成了羧甲基吡唑离子液体（CMPEbz），在
    70 °C 和 1.0 MPa 的初始 CO2 压力下实现了超过 90% 的产量。


    > † 轻质材料防护与安全存储重点实验室，河南大学，开封，450004

    ¹ lychen@henan.edu.cn, yyuan.li@henan.edu.cn, yuanabc

    ² 河南省镁合金绿色碳技术工程研究中心，河南大学，开封，450004

    ³ 河南化学与分子科学学院，河南大学，开封，河南 450004

    ⁴ 可获取电子补充信息（ESI）。详见 DOI: https://doi.org/10.1039/D4ce02025X


    2334 | React. Chem. Eng., 2025, 10, 2334–2344


    本期刊为英国皇家学会 2025年


    # 反应化学与工程


    尽管基于咪唑和基于吡唑的离子液体催化的 CO2 环加反应产量很高，但其应用受到严苛反应条件的限制。因此，对能够在温和条件下运行的新型催化剂的需求日益增加。通过理论计算设计新的基于咪唑和基于吡唑的离子液体是昂贵的，且难以保持高成功率。机器学习（ML）在预测此类反应的应用最近引起了关注。$^{12}$
    机器学习基于对历史数据的归纳，能够对化学性质进行具有成本效益且高通量的预测。$^{13}$ 研究人员在预测离子液性质方面已进行了许多探索。例如，Huang等人¹⁴
    建立了通用化学组分活性系数（UNIFAC）方法来改进液-水混合物的溶解度预测，$R^2$ 达到 0.99。Liu等人¹⁵ 建立了基于 SVR 的模型来预测
    CO2 在离子液体中的溶解度，$R^2$ 超过 0.98。


    然而，与离子液的物理性质相比，使用机器学习方法对离子液体活性的研究仍然较少。值得注意的是，Li等人¹⁶ 通过建立机器学习模型来预测离子液体催化环加反应的产量，探索了这一领域。最好的机器学习模型在基于咪唑的离子液体子集上实现了
    0.80 的 $R^2$，但在其他离子液体上的表现较差。因此，在研究机器学习用于预测离子液体催化的 CO2 环加反应活性方面，仍需进一步探索。由于计算能力的限制，传统算法难以提高模型准确性。$^{17}$
    相比，深度学习算法表现出强大的拟合能力，在预测中表现出优越的性能。$^{18,19}$ 例如，Gong等人²⁰ 利用维度分子结构图建立了一个能够预测选择性的深度学习模型。


    这在三个不同的化学数据集上以极少的标记数据取得了卓越成果，显示出比传统算法更好的预测能力。


    本工作的主要目标是开发一种能够预测 CO2 环加反应产量的深度学习模型。通过机器学习，我们的目标是在温和条件下设计高效的基于咪唑和基于吡唑的离子液体。研究方案通过混合指纹描述分子的结构特征。使用
    SHAP 分析对模型进行解释，以探索对产量的影响。基于分子化学方案，生成了数百种离子液体。最后，通过两步筛选策略（产量预测和能垒计算）生成了基于咪唑的离子液体。这项工作对于推进可持续化学工艺和
    CO2 利用技术具有很大贡献。


    ## 2. 方法


    ### 2.1. 数据集


    由于其卓越的潜力，我们选择基于咪唑的离子液体和基于吡唑的离子液体作为研究对象。从2001年至2024年的文献中，汇总了531个基于咪唑和吡唑的离子液体催化的CO2环加反应数据点。$^{9,31-32}$
    数据集包含27种咪唑类阳离子、25种吡唑类阳离子、13种阴离子和14种反应物，细节见附图S1–S6。数据集中的反应物均为未添加额外结构或条件的实验记录。数据集中的关键实验变量如图2所示。如图2a所示，数据集中基于咪唑的离子液预测值高于基于吡唑的-


