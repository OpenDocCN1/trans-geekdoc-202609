    ILs are compiled.$^{9,31-32}$ The dataset consists of 27 types of imidazolium-based
    cations, 25 types of pyrazolium-based cations, 13 types of anions and 14 types
    of reactants with details shown in Fig. S1–S6. The reactants in the dataset are
    all episodes with no structure or conditions added. The key experimental variables
    in the dataset is illustrated in Fig. 2. As shown in Fig. 2a, the prediction of
    imidazolium-based ILs in the dataset is higher than that of pyrazolium-


