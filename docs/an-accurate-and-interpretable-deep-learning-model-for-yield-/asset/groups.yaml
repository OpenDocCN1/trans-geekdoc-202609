    # 反应化学与工程


    分子指纹。传统算法在此类背景下难以克服过拟合问题。深度神经网络（DNN）通过多层特征提取和加权有效应对这些挑战。不同指纹的输入层增强了模型的灵活性和适应性。


    状态的激活与稳定。CO2 直接影响活性物种的连接，可能影响反应动力学和热力学。这些因素共同影响 CO2 协同激活的效率和效果。


    为了进一步了解时间和量的影响，对反应时间和催化剂量分别进行了部分依赖表示。图 5 表，只有当时间超过 6.7 个月时，SHAP 值才为正，表明催化剂量大于
    0.7 是利用 Ita 在 CO2 协同激活中必要的。


    ## 3.2. 模型解释


    构建模型后，使用 SHAP 方法解释 ME-NN 模型。如图 5 所示，ME-NN 模型中的前十个特征——反应时间、温度、催化剂量和 CO2 压力对产量的影响最大，其特征是具有显著的平均绝对
    SHAP 值。在图中，红色特征颜色表示较小的值。可以观察到，对于反应时间、温度、催化剂量和 CO2 压力，特征值通常与较大的 SHAP 值相关。这种模式表明，更长、更高的温度、增加催化剂量和更高的压力有助于产量。反应时间允许足够的分子与催化剂和
    CO2 相互作用。温度影响分子能量、反应速率和平衡。离子液体催化剂的量决定了活性位点的可用性。


    图 5 表明，只有当时间小于 6 小时时 SHAP 值才为正，表明 CO2 反应至少需要 6 小时才能完成反应。然而，如图 5 所示，大多数高值反应处于短时间。如果研究人员需要缩短反应时间，增加温度和压力也会提高工业应用的成本。因此，需要设计
    II 类催化剂以确保高效催化，尽可能地使反应时间、温度、CO2 压力和催化剂量处于低标准。


    ## 3.3. 新分子筛选


    在这项研究中，针对 Ita 开发了一种定制的碎片化和合成方法，以解决以下算法的局限性：


    ![](img/c457f7302bebd27c403522434e1f8aac_5_0.png)


    图 5 模型解释：(a) 基于平均（{SHAP 值})的前 10 个特征量，(b) 250 个选取样本的 SHAP 值，(c) 催化剂量对产量的影响，(d)
    反应时间对产量的影响。


    # 反应化学与工程


    MacFrag、BRCS 和 Recap 是为大型有机分子设计的。这些传统算法与由阳离子组成的组成的简单结构不匹配。开发了一种使用 SMILES 字符串的常用方法，以对碎片和合成进行控制。该方法利用
    SMILES 字符串的灵活性将阳离子分解为链和环，然后重构它们以生成新结构。


    在催化剂用量 ≤1 mol% 的情况下达到 13% 和 39%。这项工作的目标是筛选出在反应参数较低的情况下能确保高效催化的离子液体（ILs）。我们将反应条件设定为：4
    h、90 °C、0.1 MPa 和 0.8 mol% 催化剂，用于预测接近物的催化性能。我们发现 19 种咪唑类离子液的预测产量不低于 0.90。然而，没有吡咯烷类离子液的预测产量显著。随后，我们将反应条件优化为
    7 h、90 °C、0.1 MPa 和 1 mol%。


    训练数据集仅采用了咪唑类和吡咯烷类离子液体，其中侧链特征由阳离子和环结构信息组成，这些结构信息是基于催化剂的固有属性。因此，我们将离子液体分为两条链，分别称为
    Z 链和 E 链，并带有一个来自阴离子结构的碎片，如图 6 所示。因此，我们从离子液体中观察到三个碎片：Z 链、E 链和阴离子，为后续分子生成奠定了基础。随后，通过交叉
    Z 链和 E 链，我们获得了新链，然后将其组合以生成一组新的离子液体。移除原始数据集中的旧离子液体。


    ## 3.4. DFT 计算


    进一步进行了 DFT 计算以评估 19 种咪唑类离子液的催化活性。如图 7 所示，环加成反应机理可分为三个步骤：首先是具有位阻的碳原子；其次是 CO2 插入到开启位；最后是中间体发生亲核攻击。其中，开环是限速步骤。


    ![](img/c457f7302bebd27c403522434e1f8aac_6_0.png)


    图 6 离子液体分子结构生成过程。


    # 反应化学与工程


    ![](img/c457f7302bebd27c403522434e1f8aac_7_0.png)


    图 7 14 种能垒为 23.0 kcal mol⁻¹ 的离子液体结构。


    ## 4. 结论


    在这项研究中，构建了 531 个基于离子液体的 CO₂ 环加成反应。通过利用指纹，我们开发了一个深度学习模型


    ![](img/c457f7302bebd27c403522434e1f8aac_7_1.png)


    图 8 14 种能垒低于 23.0 kcal mol⁻¹ 的离子液体能垒。


