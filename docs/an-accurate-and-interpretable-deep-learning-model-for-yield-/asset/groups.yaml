    # 1. Introduction


    In the past few decades the use of CO2 as a renewable resource has received widespread
    attention from scientists. The CO2 cycloaddition reaction can convert CO2 into
    high-value cyclic carbonates with 100% atom economy, making it one of the most
    promising CO2 conversion strategies. Various carbamates used as solvents, electrolytes
    and organic synthesis have numerous applications. However, the thermodynamic stability
    and kinetic efficiency of catalysts are required to ensure the completion of cycloaddition
    reactions under mild conditions. Homogeneous and heterogeneous catalysts have
    been reported, including metal-organic frameworks (MoFs), metal complexes, ionic
    liquids (ILs),†


    Among these ILs, we have shown exceptional low vapor pressure, excellent thermal
    stability, and wide temperature range, making them ideal catalysts for CO2 cycloaddition
    reactions. Imidazolium-based are the most common employed ILs-based catalysts
    to facilitate functionality and affinity to CO2 molecules. For instance, Wang
    et al. synthesized poly cyclic carbonate 92% at the temperature of 120 °C, CO2
    pressure of 1.5 MPa, catalytic yield of 0.5 mol%, reaction time of 2.0 h. Ye et
    al.⁸ synthesized series of imidazolium-based ILs with dual functionality hydroxyl
    and amine groups, which showed high catalytic activity at the reaction temperature
    of 90 °C and time of 12.5 h. Zhang et al.⁹ synthesized, which share a high structural
    similarity with imidazolium-based ILs, also demonstrate excellent catalytic potential.
    For instance, Zhang et al.¹¹ synthesized a carboxylmethyl pyrazolium ILs (CMPEbz),
    achieving a yield of over 90% at 70 °C and an initial CO2 pressure, of 1.0 MPa.


