    描述 `54` 的类型是 `int`。此外，`<class ‘str’>` 和 `<class ‘float’>` 分别显示“a string”和 `98.
    188` 是 `str` 和 `float` 类型。起初，你可能会说“`3.14`”是 `float` 类型，但由于它被双引号括起来，它肯定是一个字符串。同样，“`99`”也是一个字符串。


    字符数据序列是字符串。Python 中的字符串类型称为 `str`。字符串字面量可以用单引号或双引号定义。开头和结尾引号内的所有字符都是字符串的一部分，如下所示：`\>>>
    ''''  ''''`


    ### 字符串中的转义序列


    有时你希望 Python 对字符串中的字符序列进行不同的解释。这可能以一两种方式发生：

    • 如果你想抑制特定字符在字符串中提供的唯一解释。

    • 你想要对字符串中通常被字面理解的字符应用特定解释。


    你可以通过使用反斜杠 (`\`) 字符来做到这一点。字符串中的反斜杠字符意味着紧随其后的一个或多个字符必须被特殊处理。这被称为转义序列，因为反斜杠会使随后的字符序列“逃脱”其正常含义。


    ### 布尔类型


    Python 3 有一个布尔数据类型。布尔类型的对象可能包含一个或两个值，`False` 或 `True`。![](img/rsrc10R.jpg)![](img/rsrc10S.jpg)


    Python 表达式在布尔上下文中被求值。这意味着它们被解释为表示假或真。布尔中的真值被描述为“Truthy”，而假值被描述为“Falsy”。布尔类型对象的真实性是开放的。这意味着等于
    `True` 的对象是 Truthy，等于 `False` 的对象是 Falsy。但是，不是布尔类型的对象可以在布尔上下文中被求值并确定为真或假。


    ## Python 变量


    在第一个 Python 程序中，你了解了 Python 变量。你简要地看到了如何在 Python 中定义变量并为它们赋值。本节将更详细地讨论 Python
    中的变量。像任何其他编程语言一样，变量用于存储值。此外，你可以使用变量来访问数据和操作数据。


    ### 创建变量


    如果你想在 Python 中创建变量，必须使用赋值运算符。下面显示的格式在你想要创建变量时适用。


    `variable_name = expression`


    ![](img/rsrc10T.jpg)


    一个示例可以是：`number = 12`。此语句将创建一个名为 `number` 的变量并为其赋值 `12`。当 Python 解释器遇到此语句时，它会在幕后执行以下操作。

    1. 将变量“`12`”存储在内存中的给定位置。

    2. 使变量 `number` 指向它。


    关键的理解是，变量 `number` 本身没有任何值，它只指向包含原始值的内存位置。另一个需要注意的重要事项是，当你为变量赋值时，确保将变量名写在赋值 (`=`)
    运算符的左侧。如果你不这样做，你会得到一个语法错误。


    Python 始终根据变量的值检测变量的类型以及对其执行的操作。描述这一点的编程术语称为动态类型。这意味着你可以使用同一个变量来引用最初指向的不同类型的数据。每当你为变量赋予新值时，对先前值的引用就会丢失。例如，如果变量
    `number` 被赋予字符串“`ten`”，则对值“`12`”的引用丢失。此时，将没有变量指向该内存位置。当这种情况发生时，Python 解释器将通过垃圾回收自动从内存中删除该值。如果你尝试在为变量赋值之前访问它，你会得到一个
    `NameError`。


