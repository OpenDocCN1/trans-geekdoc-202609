    = n\_іtеr dеf fіt(ѕеlf, X, y):         """Fіt trаіnіng dаtа. Pаrаmеtеrѕ ---------X
    : {аrrау-lіkе}, ѕhаре = \[n\_samples, n\_fеаturеѕ\] Trаіnіng vесtоrѕ, whеrе n\_ѕаmрlеѕ             іѕ
    thе numbеr оf ѕаmрlеѕ аnd             n\_features іѕ thе numbеr оf features. y
    : аrrау-lіkе, ѕhаре = \[n\_ѕаmрlеѕ\]             Tаrgеt vаluеѕ. Returns         ------        ѕеlf
    : оbjесt """ ѕеlf.w\_ = nр.zеrоѕ(1 + X.ѕhаре\[1\])         ѕеlf.еrrоrѕ\_ = \[\]
    fоr \_ іn rаngе(ѕеlf.n\_іtеr): errors = 0             fоr xі, tаrgеt іn zір(X,
    у):                 uрdаtе = ѕеlf.еtа \* (tаrgеt - ѕеlf.рrеdісt(xі))                 ѕеlf.w\_\[1:\]
    += uрdаtе \* xі                 self.w\_\[0\] += uрdаtе                 еrrоrѕ
    += іnt(uрdаtе != 0.0)             ѕеlf.еrrоrѕ\_.арреnd(еrrоrѕ)         rеturn
    self dеf nеt\_іnрut(ѕеlf, X): """Cаlсulаtе nеt іnрut"""         rеturn nр.dоt(X,
    ѕеlf.w\_\[1:\]) + ѕеlf.w\_\[0\] dеf рrеdісt(ѕеlf, X): """Rеturn сlаѕѕ lаbеl аftеr
    unіt step"""         rеturn nр.whеrе(ѕеlf.nеt\_іnрut(X) >= 0.0, 1, -1) Using thіѕ
    реrсерtrоn іmрlеmеntаtіоn, wе саn nоw іnіtіаlіzе nеw pеrсерtrоn оbjесtѕ wіth a
    gіvеn lеаrnіng rate еtа аnd n\_іtеr, which іѕ thе number оf еросhѕ (раѕѕеѕ оvеr
    thе trаіnіng ѕеt). Vіа thе fіt mеthоd, wе іnіtіаlіzе thе weights іn ѕеlf.w\_ tо
    a zеrо-vесtоr m+1 whеrе m ѕtаndѕ fоr thе numbеr оf dіmеnѕіоnѕ (fеаturеѕ) іn thе
    dаtаѕеt whеrе wе add 1 fоr thе zеrо-wеіght (thаt іѕ, the thrеѕhоld). NumPу іndеxіng
    fоr оnе-dіmеnѕіоnаl аrrауѕ wоrkѕ ѕіmіlаrlу tо Pуthоn lists, uѕіng thе ѕԛ uаrе-brасkеt
    (\[\]) nоtаtіоn. Fоr two-dimensional аrrауѕ, thе fіrѕt indexer rеfеrѕ tо thе rоw
    numbеr, аnd thе ѕесоnd іndеxеr tо the соlumn numbеr. Fоr еxаmрlе, wе would uѕе
    X\[2, 3\] tо ѕеlесt thе thіrd rоw аnd fоurth соlumn оf a 2D аrrау X. Aftеr the
    weights hаvе bееn іnіtіаlіzеd, thе fіt method loops оvеr аll іndіvіduаl ѕаmрlеѕ
    іn thе trаіnіng ѕеt аnd uрdаtеѕ thе wеіghtѕ ассоrdіng tо thе реrсерtrоn lеаrnіng
    rulе thаt wе dіѕсuѕѕеd іn thе рrеvіоuѕ ѕесtіоn. The сlаѕѕ lаbеlѕ аrе рrеdісtеd
    bу thе рrеdісt mеthоd, while we аlѕо саllеd іn thе fit mеthоd to рrеdісt thе сlаѕѕ
    label fоr thе wеіght uрdаtе, but predict can аlѕо bе uѕеd tо рrеdісt the сlаѕѕ
    labels оf nеw dаtа аftеr wе hаvе fіttеd оur mоdеl. Furthеrmоrе, we аlѕо соllесt
    thе number оf mіѕсlаѕѕіfісаtіоnѕ durіng еасh еросh іn thе lіѕt ѕеlf.еrrоrѕ\_ ѕо
    thаt wе can lаtеr аnаlуzе hоw wеll our реrсерtrоn реrfоrmеd durіng thе trаіnіng.
    Thе nр.dоt funсtіоn thаt іѕ uѕеd іn thе nеt\_іnрut mеthоd ѕіmрlу саlсulаtеѕ thе
    vесtоr dоt рrоduсt w Xt. '
  fmt: "\n# PYTHON MACHINE LEARNING\n\n## Using Python for Machine Learning\n\nPython\
    \ is one of the most popular programming languages for data science and therefore\
    \ enjoys a large number of useful add-on libraries developed by its great community.\
    \ Although the performance of interpreted languages, such as Python, for computation-intensive\
    \ tasks is inferior to lower-level programming languages, extension libraries\
    \ such as NumPy and SciPy have been developed that build upon lower layer Fortran\
    \ and C implementations for fast and vectorized operations on multidimensional\
    \ arrays. For Machine Learning programming tasks, we mostly refer to the Scikit-learn\
    \ library, which is one of the most popular and accessible open source machine\
    \ learning libraries as of today.\n\n## Training Machine Learning Algorithms\n\
    \nIn this chapter, we will make use of one of the first algorithmically described\
    \ Machine Learning algorithms for classification, the ‘perceptron’ and ‘adaptive\
    \ linear neurons’. We will start by implementing a perceptron step-by-step in\
    \ Python and training it to classify different flower species in the Iris dataset.\
    \ This will help us to understand the concept of Machine Learning algorithms for\
    \ classification, and how they can be efficiently implemented in Python.\n\n##\
    \ Artificial Neurons – a Brief Glimpse into the Early History of Machine Learning\n\
    \nBefore we discuss the perceptron and related algorithms in more detail, let\
    \ us take a brief tour through the early beginnings of Machine Learning. Trying\
    \ to understand how the biological brain works to design artificial intelligence,\
    \ Warren McCulloch and Walter Pitts published the first concept of a simplified\
    \ brain cell, the so-called McCulloch-Pitts (MCP) neuron, in 1943 (W. S. McCulloch\
    \ and W. Pitts. ‘A Logical Calculus of the Ideas Immanent in Nervous Activity’.\
    \ The Bulletin of Mathematical Biophysics, 5(4):115–133, 1943).\n\nNeurons are\
    \ interconnected nerve cells in the brain that are involved in the processing\
    \ and transmitting of chemical and electrical signals, which is illustrated in\
    \ the following figure: McCulloch and Pitts described such a nerve cell as a simple\
    \ logic gate with binary outputs; multiple signals arrive at the dendrites, are\
    \ then integrated into the cell body, and, if the accumulated signal exceeds a\
    \ certain threshold, an output signal is generated that will be passed on by the\
    \ axon.\n\nOnly a few years later, Frank Rosenblatt published the first concept\
    \ of the perceptron learning rule based on the MCP neuron model (F. Rosenblatt,\
    \ ‘The Perceptron, a Perceiving and Recognizing Automaton’. Cornell Aeronautical\
    \ Laboratory, 1957). With his perceptron rule, Rosenblatt proposed an algorithm\
    \ that would automatically learn the optimal weight coefficients that are then\
    \ multiplied with the input features in order to make the decision of whether\
    \ a neuron fires or not. In the context of supervised learning and classification,\
    \ such an algorithm could then be used to predict if a sample belonged to one\
    \ class or the other.\n\nMore formally, we can pose this problem as a binary classification\
    \ task, where we refer to our two classes as 1 (positive class) and -1 (negative\
    \ class) for simplicity. We can then define an activation function `φ(z)` that\
    \ takes a linear combination of certain input values `x` and a corresponding weight\
    \ vector `w`, where `z` is the so-called net input (`z = w0x0 + w1x1 + ... + wmxm`):\n\
    \n`w = [w1, ..., wm]`\n`x = [x1, ..., xm]`\n\nNow, if the activation of a particular\
    \ sample `x(i)`, that is, the output of `φ(z)`, is greater than a defined threshold\
    \ `θ`, we predict class 1 and if it’s not greater than the threshold, we predict\
    \ class -1. In the perceptron algorithm, the activation function `φ(z)` is a simple\
    \ unit step function, which is sometimes also called the Heaviside step function:\n\
    \n`φ(z) = { 1 if z ≥ θ; -1 otherwise }`\n\nFor simplicity, we can bring the threshold\
    \ `θ` to the left side of the equation and define a weight-zero as `w0 = −θ` and\
    \ `x0 = 1`, so that we write `z` in a more compact form `z = w0x0 + w1x1 + ...\
    \ + wmxm = w^T x` and `φ(z) = { 1 if z ≥ 0; -1 otherwise }`.\n\nIn the following\
    \ sections, we will often make use of basic notations from linear algebra. For\
    \ example, we will abbreviate the sum of the products of the values in `x` and\
    \ `w` using a vector dot product, whereas superscript `T` stands for transpose,\
    \ which is an operation that transforms a column vector into a row vector, and\
    \ vice versa:\n\n`z = w0x0 + w1x1 + ... + wmxm = ∑(j=0 to m) xj wj = w^T x`\n\n\
    For example: `[1 2 3] · [4 5 6] = 1×4 + 2×5 + 3×6 = 32`.\n\nFurthermore, the transpose\
    \ operation can also be applied to a matrix to reflect it over its diagonal, for\
    \ example:\n\n`[1 2; 3 4; 5 6]^T = [1 3 5; 2 4 6]`\n\nIn this book, we will only\
    \ use the very basic concepts from linear algebra. However, if you need a quick\
    \ refresher, please take a look at Zico Kolter's excellent Linear Algebra Review\
    \ and Reference, which is freely available at `http://www.cs.cmu.edu/~zkolt/course/linalg/linalg_notes.pdf`.\n\
    \nThe following figure illustrates how the net input `z = w^T x` is squashed into\
    \ a binary output (-1 or 1) by the activation function of the perceptron (left\
    \ subfigure) and how it can be used to discriminate between two linearly separable\
    \ classes (right subfigure):\n\nThe whole idea behind the MCP neuron and Rosenblatt's\
    \ thresholded perceptron model is to use a reductionist approach to mimic how\
    \ a single neuron in the brain works: it either fires or it doesn't. Thus, Rosenblatt's\
    \ initial perceptron rule is fairly simple, and can be summarized by the following\
    \ steps:\n\n- Initialize the weights to 0 or small random numbers.\n- For each\
    \ training sample `x(i)`, perform the following steps:\n  - Compute the output\
    \ value `ŷ`.\n  - Update the weights.\n\nHere, the output value is the class label\
    \ predicted by the unit step function that we defined earlier, and the simultaneous\
    \ update of each weight `wj` in the weight vector `w` can be more formally written\
    \ as:\n\n`wj := wj + ∆wj`\n\nThe value of `∆wj`, which is used to update the weight\
    \ `wj`, is calculated by the perceptron learning rule:\n\n`∆wj = η( y(i) − ŷ(i)\
    \ ) x(j,i)`\n\nWhere `η` is the learning rate (a constant between 0.0 and 1.0),\
    \ `y(i)` is the true class label of the i-th training sample, and `ŷ(i)` is the\
    \ predicted class label. It is important to note that all weights in the weight\
    \ vector are being updated simultaneously, which means that we don't recompute\
    \ the `ŷ(i)` until all of the weights `∆wj` are updated.\n\nConcretely, for a\
    \ 2D dataset, we would write the update as follows:\n\n`∆w0 = η( y(i) − output(i)\
    \ )`\n`∆w1 = η( y(i) − output(i) ) x1(i)`\n`∆w2 = η( y(i) − output(i) ) x2(i)`\n\
    \nBefore we implement the perceptron rule in Python, here’s a simple thought experiment\
    \ to illustrate how beautifully simple this learning rule really is. In the two\
    \ scenarios where the perceptron predicts the class label correctly, the weights\
    \ remain unchanged:\n\n`∆wj = η(−1 − 1)x(j,i) = 0`\n`∆wj = η(1 − 1)x(j,i) = 0`\n\
    \nHowever, in the case of a wrong prediction, the weights are being pushed towards\
    \ the direction of the positive or negative target class, respectively:\n\n`∆wj\
    \ = η(1 − (−1))x(j,i) = η(2)x(j,i)`\n`∆wj = η(−1 − 1)x(j,i) = η(−2)x(j,i)`\n\n\
    To gain better intuition for the multiplicative factor `x(j,i)`, let us go through\
    \ another simple example, where:\n\n`y(i) = +1`, `ŷ(i) = −1`, `η = 1`\n\nLet's\
    \ assume that `x(j,i) = 0.5`, and we misclassify this sample as -1. In this case,\
    \ we would increase the corresponding weight by 1, so that the activation `x(j,i)\
    \ × w(j,i)` will be more positive the next time we encounter this sample, and\
    \ will be more likely to be above the threshold of the unit step function to classify\
    \ the sample as +1:\n\n`∆w(j,i) = (1 − (−1)) × 0.5 = 2 × 0.5 = 1`\n\nThe weight\
    \ update is proportional to the value of `x(j,i)`. For example, if we have another\
    \ sample `x(j,i) = 2` that is incorrectly classified as -1, we'd push the decision\
    \ boundary by an even larger extent to classify this sample correctly the next\
    \ time:\n\n`∆wj = (1 − (−1)) × 2 = 2 × 2 = 4`\n\nIt is important to note that\
    \ the convergence of the perceptron is only guaranteed if the two classes are\
    \ linearly separable and the learning rate is sufficiently small. If the two classes\
    \ can't be separated by a linear decision boundary, we can set a maximum number\
    \ of passes over the training dataset (epochs) and/or a threshold for the number\
    \ of tolerated misclassifications—otherwise, the perceptron would never stop updating\
    \ the weights.\n\nNow, before we jump into implementation in the next section,\
    \ let’s summarize what we just learned in a simple figure that illustrates the\
    \ general concept of the perceptron:\n\nThe preceding figure illustrates how the\
    \ perceptron receives the inputs of a sample `x` and combines them with the weights\
    \ `w` to compute the net input. The net input is then passed on to the activation\
    \ function (here: the unit step function), which generates a binary output -1\
    \ or +1—the predicted class label of the sample. During the learning phase, this\
    \ output is used to calculate the error of the prediction and update the weights.\n\
    \n## Implementing a Perceptron Learning Algorithm in Python\n\nIn the previous\
    \ section, we learned how Rosenblatt's perceptron rule works; let’s go ahead and\
    \ implement it in Python, and apply it to the Iris dataset that we introduced\
    \ earlier. We will take an object-oriented approach to define the perceptron interface\
    \ as a Python `Class`, which allows us to initialize new perceptron objects that\
    \ can learn from data via a `fit()` method, and make predictions via a separate\
    \ `predict()` method. As a convention, we add an underscore to attributes that\
    \ are not being created upon the initialization of the object, but by calling\
    \ the object's other methods—for example, `self.w_`.\n\nIf you are not yet familiar\
    \ with Python's scientific libraries or need a refresher, please see the following\
    \ resources:\n\n- NumPy: `http://wiki.scipy.org/Tentative_NumPy_Tutorial`\n- Pandas:\
    \ `http://pandas.pydata.org/pandas-docs/stable/tutorials.html`\n- Matplotlib:\
    \ `http://matplotlib.org/users/beginners.html`\n\nAlso, to better follow the code\
    \ examples, I recommend you download the IPython notebooks from the Packt website.\
    \ For a general introduction to IPython notebooks, please visit `https://ipython.org/ipython-doc/3/notebook/index.html`.\n\
    \n```python\nimport numpy as np\n\nclass Perceptron(object):\n    \"\"\"Perceptron\
    \ classifier.\n    Parameters\n    -----------\n    eta : float\n        Learning\
    \ rate (between 0.0 and 1.0)\n    n_iter : int\n        Passes over the training\
    \ dataset.\n    Attributes\n    ----------\n    w_ : 1d-array\n        Weights\
    \ after fitting.\n    errors_ : list\n        Number of misclassifications in\
    \ every epoch.\n    \"\"\"\n    def __init__(self, eta=0.01, n_iter=10):\n   \
    \     self.eta = eta\n        self.n_iter = n_iter\n\n    def fit(self, X, y):\n\
    \        \"\"\"Fit training data.\n        Parameters\n        ----------\n  \
    \      X : {array-like}, shape = [n_samples, n_features]\n            Training\
    \ vectors, where n_samples is the number of samples and\n            n_features\
    \ is the number of features.\n        y : array-like, shape = [n_samples]\n  \
    \          Target values.\n        Returns\n        -------\n        self : object\n\
    \        \"\"\"\n        self.w_ = np.zeros(1 + X.shape[1])\n        self.errors_\
    \ = []\n        for _ in range(self.n_iter):\n            errors = 0\n       \
    \     for xi, target in zip(X, y):\n                update = self.eta * (target\
    \ - self.predict(xi))\n                self.w_[1:] += update * xi\n          \
    \      self.w_[0] += update\n                errors += int(update != 0.0)\n  \
    \          self.errors_.append(errors)\n        return self\n\n    def net_input(self,\
    \ X):\n        \"\"\"Calculate net input\"\"\"\n        return np.dot(X, self.w_[1:])\
    \ + self.w_[0]\n\n    def predict(self, X):\n        \"\"\"Return class label\
    \ after unit step\"\"\"\n        return np.where(self.net_input(X) >= 0.0, 1,\
    \ -1)\n```\n\nUsing this perceptron implementation, we can now initialize new\
    \ perceptron objects with a given learning rate `eta` and `n_iter`, which is the\
    \ number of epochs (passes over the training set). Via the `fit()` method, we\
    \ initialize the weights in `self.w_` to a zero-vector `m+1` where `m` stands\
    \ for the number of dimensions (features) in the dataset where we add 1 for the\
    \ zero-weight (that is, the threshold).\n\nNumPy indexing for one-dimensional\
    \ arrays works similarly to Python lists, using the square-bracket (`[]`) notation.\
    \ For two-dimensional arrays, the first indexer refers to the row number, and\
    \ the second indexer to the column number. For example, we would use `X[2, 3]`\
    \ to select the third row and fourth column of a 2D array `X`.\n\nAfter the weights\
    \ have been initialized, the `fit()` method loops over all individual samples\
    \ in the training set and updates the weights according to the perceptron learning\
    \ rule that we discussed in the previous section. The class labels are predicted\
    \ by the `predict()` method, while we also called it in the `fit()` method to\
    \ predict the class label for the weight update, but `predict()` can also be used\
    \ to predict the class labels of new data after we have fitted our model. Furthermore,\
    \ we also collect the number of misclassifications during each epoch in the list\
    \ `self.errors_` so that we can later analyze how well our perceptron performed\
    \ during the training. The `np.dot()` function that is used in the `net_input()`\
    \ method simply calculates the vector dot product `w^T X`.\n"
  trans: "\n\n# PYTHON MACHINE LEARNING\n\n## 使用 Python 进行机器学习\n\nPython 是数据科学中最流行的编程语言之一，因此拥有其优秀社区开发的大量有用的附加库。尽管对于计算密集型任务，像\
    \ Python 这样的解释型语言的性能不如低级编程语言，但已经开发了 NumPy 和 SciPy 等扩展库，它们基于底层的 Fortran 和 C 实现，用于对多维数组进行快速且向量化的操作。对于机器学习编程任务，我们主要参考\
    \ Scikit-learn 库，它是当今最流行且易于使用的开源机器学习库之一。\n\n## 训练机器学习算法\n\n在本章中，我们将使用最早被算法描述的机器学习分类算法之一，即“感知机”和“自适应线性神经元”。我们将从在\
    \ Python 中逐步实现感知机开始，并训练它对 Iris 数据集中的不同花卉物种进行分类。这将帮助我们理解分类机器学习算法的概念，以及如何在 Python\
    \ 中高效地实现它们。\n\n## 人工神经元——机器学习早期历史的简要回顾\n\n在详细讨论感知机及相关算法之前，让我们简要回顾一下机器学习的早期发展。为了理解生物大脑的工作原理以设计人工智能，Warren\
    \ McCulloch 和 Walter Pitts 于 1943 年发表了简化脑细胞的第一个概念，即所谓的 McCulloch-Pitts (MCP) 神经元\
    \ (W. S. McCulloch 和 W. Pitts. ‘A Logical Calculus of the Ideas Immanent in Nervous\
    \ Activity’. The Bulletin of Mathematical Biophysics, 5(4):115–133, 1943)。\n\n\
    神经元是大脑中相互连接的神经细胞，参与化学和电信号的处理和传输，如下图所示：McCulloch 和 Pitts 将这种神经元描述为具有二进制输出的简单逻辑门；多个信号到达树突，然后整合到细胞体中，如果累积信号超过某个阈值，就会生成一个输出信号，该信号将由轴突传递。\n\
    \n仅仅几年后，Frank Rosenblatt 基于 MCP 神经元模型发表了感知机学习规则的第一个概念 (F. Rosenblatt, ‘The Perceptron,\
    \ a Perceiving and Recognizing Automaton’. Cornell Aeronautical Laboratory, 1957)。通过他的感知机规则，Rosenblatt\
    \ 提出了一种算法，该算法将自动学习最佳权重系数，然后将其与输入特征相乘，以决定神经元是否发火。在监督学习和分类的背景下，这样的算法可以用于预测样本属于哪一类。\n\
    \n更正式地说，我们可以将此问题视为一个二分类任务，为了简单起见，我们将两个类称为 1（正类）和 -1（负类）。我们可以定义一个激活函数 `φ(z)`，它接受某些输入值\
    \ `x` 和相应的权重向量 `w` 的线性组合，其中 `z` 是所谓的净输入 (`z = w0x0 + w1x1 + ... + wmxm`)：\n\n\
    `w = [w1, ..., wm]`\n`x = [x1, ..., xm]`\n\n现在，如果特定样本 `x(i)` 的激活，即 `φ(z)` 的输出，大于定义的阈值\
    \ `θ`，我们预测类 1，如果不大于阈值，我们预测类 -1。在感知机算法中，激活函数 `φ(z)` 是一个简单的单位阶跃函数，有时也被称为 Heaviside\
    \ 阶跃函数：\n\n`φ(z) = { 1 if z ≥ θ; -1 otherwise }`\n\n为了简单起见，我们可以将阈值 `θ` 移到等式左侧，并定义权重零为\
    \ `w0 = −θ` 和 `x0 = 1`，这样我们可以用更紧凑的形式写出 `z = w0x0 + w1x1 + ... + wmxm = w^T x`\
    \ 和 `φ(z) = { 1 if z ≥ 0; -1 otherwise }`。\n\n在接下来的章节中，我们将经常使用线性代数的基本符号。例如，我们将使用向量点积来缩写\
    \ `x` 和 `w` 中值的乘积之和，而上标 `T` 代表转置，即将列向量转换为行向量，反之亦然的操作：\n\n`z = w0x0 + w1x1 + ...\
    \ + wmxm = ∑(j=0 to m) xj wj = w^T x`\n\n例如：`[1 2 3] · [4 5 6] = 1×4 + 2×5 + 3×6\
    \ = 32`。\n\n此外，转置操作也可以应用于矩阵以沿其对角线反射，例如：\n\n`[1 2; 3 4; 5 6]^T = [1 3 5; 2 4 6]`\n\
    \n在本书中，我们只将使用线性代数的非常基本概念。但是，如果您需要快速复习，请查看 Zico Kolter 的优秀线性代数复习与参考，可在 `http://www.cs.cmu.edu/~zkolt/course/linalg/linalg_notes.pdf`\
    \ 免费获取。\n\n下图说明了感知机的激活函数如何将净输入 `z = w^T x` 压缩为二进制输出（-1 或 1）（左子图），以及如何用于区分两个线性可分类（右子图）：\n\
    \nMCP 神经元和 Rosenblatt 阈值感知机模型背后的整个想法是使用还原论方法来模拟大脑中单个神经元的工作方式：它要么发火，要么不发火。因此，Rosenblatt\
    \ 最初的感知机规则非常简单，可以由以下步骤总结：\n\n- 将权重初始化为 0 或小随机数。\n- 对于每个训练样本 `x(i)`，执行以下步骤：\n \
    \ - 计算输出值 `ŷ`。\n  - 更新权重。\n\n这里，输出值是我们之前定义的单位阶跃函数预测的类标签，权重向量 `w` 中每个权重 `wj` 的同时更新可以更正式地写为：\n\
    \n`wj := wj + ∆wj`\n\n用于更新权重 `wj` 的 `∆wj` 值由感知机学习规则计算：\n\n`∆wj = η( y(i) − ŷ(i)\
    \ ) x(j,i)`\n\n其中 `η` 是学习率（0.0 到 1.0 之间的常数），`y(i)` 是第 i 个训练样本的真实类标签，`ŷ(i)` 是预测的类标签。需要注意的是，权重向量中的所有权重都在同时更新，这意味着在所有权重\
    \ `∆wj` 更新之前，我们不会重新计算 `ŷ(i)`。\n\n具体来说，对于一个 2D 数据集，我们将更新写为：\n\n`∆w0 = η( y(i) −\
    \ output(i) )`\n`∆w1 = η( y(i) − output(i) ) x1(i)`\n`∆w2 = η( y(i) − output(i)\
    \ ) x2(i)`\n\n在 Python 中实现感知机规则之前，这里有一个简单的思想实验来说明这个学习规则是多么简单优雅。在感知机正确预测类标签的两种场景中，权重保持不变：\n\
    \n`∆wj = η(−1 − 1)x(j,i) = 0`\n`∆wj = η(1 − 1)x(j,i) = 0`\n\n但是，在预测错误的情况下，权重将分别向正或负目标类的方向推动：\n\
    \n`∆wj = η(1 − (−1))x(j,i) = η(2)x(j,i)`\n`∆wj = η(−1 − 1)x(j,i) = η(−2)x(j,i)`\n\
    \n为了更好地理解乘数因子 `x(j,i)`，让我们看另一个简单的例子，其中：\n\n`y(i) = +1`, `ŷ(i) = −1`, `η = 1`\n\
    \n假设 `x(j,i) = 0.5`，我们将此样本错误分类为 -1。在这种情况下，我们将相应的权重增加 1，这样下次遇到此样本时，激活 `x(j,i) ×\
    \ w(j,i)` 将更加正，并且更有可能高于单位阶跃函数的阈值，从而将样本分类为 +1：\n\n`∆w(j,i) = (1 − (−1)) × 0.5 =\
    \ 2 × 0.5 = 1`\n\n权重更新与 `x(j,i)` 的值成正比。例如，如果我们有另一个样本 `x(j,i) = 2` 被错误分类为 -1，我们将以更大的程度推动决策边界，以便下次正确分类此样本：\n\
    \n`∆wj = (1 − (−1)) × 2 = 2 × 2 = 4`\n\n需要注意的是，感知机的收敛性只有在两个类线性可分且学习率足够小时才能保证。如果两个类无法由线性决策边界分离，我们可以设置遍历训练数据集的最大次数（epochs）和/或可容忍的误分类数量阈值——否则，感知机将永远不会停止更新权重。\n\
    \n现在，在进入下一节的实现之前，让我们用一个简单的图来总结我们刚刚学到的内容，该图说明了感知机的一般概念：\n\n前面的图说明了感知机如何接收样本 `x`\
    \ 的输入，并将其与权重 `w` 结合以计算净输入。然后将净输入传递给激活函数（这里：单位阶跃函数），该函数生成二进制输出 -1 或 +1——样本的预测类标签。在学习阶段，此输出用于计算预测误差并更新权重。\n\
    \n## 在 Python 中实现感知机学习算法\n\n在上一节中，我们学习了 Rosenblatt 的感知机规则是如何工作的；让我们继续在 Python\
    \ 中实现它，并将其应用于我们之前介绍的 Iris 数据集。我们将采用面向对象的方法来定义感知机接口作为 Python `Class`，这允许我们初始化新的感知机对象，这些对象可以通过\
    \ `fit()` 方法从数据中学习，并通过单独的 `predict()` 方法进行预测。按照惯例，我们为那些在对象初始化时未创建，而是通过调用对象的其他方法创建的属性添加下划线——例如，`self.w_`。\n\
    \n如果您还不熟悉 Python 的科学库或需要复习，请参阅以下资源：\n\n- NumPy: `http://wiki.scipy.org/Tentative_NumPy_Tutorial`\n\
    - Pandas: `http://pandas.pydata.org/pandas-docs/stable/tutorials.html`\n- Matplotlib:\
    \ `http://matplotlib.org/users/beginners.html`\n\n另外，为了更好地跟上代码示例，我建议您从 Packt 网站下载\
    \ IPython 笔记本。有关 IPython 笔记本的一般介绍，请访问 `https://ipython.org/ipython-doc/3/notebook/index.html`。\n\
    \n```python\nimport numpy as np\n\nclass Perceptron(object):\n    \"\"\"Perceptron\
    \ classifier.\n    Parameters\n    -----------\n    eta : float\n        Learning\
    \ rate (between 0.0 and 1.0)\n    n_iter : int\n        Passes over the training\
    \ dataset.\n    Attributes\n    ----------\n    w_ : 1d-array\n        Weights\
    \ after fitting.\n    errors_ : list\n        Number of misclassifications in\
    \ every epoch.\n    \"\"\"\n    def __init__(self, eta=0.01, n_iter=10):\n   \
    \     self.eta = eta\n        self.n_iter = n_iter\n\n    def fit(self, X, y):\n\
    \        \"\"\"Fit training data.\n        Parameters\n        ----------\n  \
    \      X : {array-like}, shape = [n_samples, n_features]\n            Training\
    \ vectors, where n_samples is the number of samples and\n            n_features\
    \ is the number of features.\n        y : array-like, shape = [n_samples]\n  \
    \          Target values.\n        Returns\n        -------\n        self : object\n\
    \        \"\"\"\n        self.w_ = np.zeros(1 + X.shape[1])\n        self.errors_\
    \ = []\n        for _ in range(self.n_iter):\n            errors = 0\n       \
    \     for xi, target in zip(X, y):\n                update = self.eta * (target\
    \ - self.predict(xi))\n                self.w_[1:] += update * xi\n          \
    \      self.w_[0] += update\n                errors += int(update != 0.0)\n  \
    \          self.errors_.append(errors)\n        return self\n\n    def net_input(self,\
    \ X):\n        \"\"\"Calculate net input\"\"\"\n        return np.dot(X, self.w_[1:])\
    \ + self.w_[0]\n\n    def predict(self, X):\n        \"\"\"Return class label\
    \ after unit step\"\"\"\n        return np.where(self.net_input(X) >= 0.0, 1,\
    \ -1)\n```\n\n使用此感知机实现，我们现在可以初始化具有给定学习率 `eta` 和 `n_iter` 的新感知机对象，其中 `n_iter` 是\
    \ epoch 数（遍历训练集的次数）。通过 `fit()` 方法，我们将 `self.w_` 中的权重初始化为零向量 `m+1`，其中 `m` 代表数据集中的维度（特征）数量，我们加\
    \ 1 是为了零权重（即阈值）。\n\nNumPy 对一维数组的索引与 Python 列表类似，使用方括号 (`[]`) 表示法。对于二维数组，第一个索引器指行号，第二个索引器指列号。例如，我们将使用\
    \ `X[2, 3]` 来选择二维数组 `X` 的第三行和第四列。\n\n权重初始化后，`fit()` 方法遍历训练集中的所有单个样本，并根据我们在上一节中讨论的感知机学习规则更新权重。类标签由\
    \ `predict()` 方法预测，我们还在 `fit()` 方法中调用它来预测权重更新的类标签，但 `predict()` 也可以在我们拟合模型后用于预测新数据的类标签。此外，我们还在列表\
    \ `self.errors_` 中收集每个 epoch 期间的误分类数量，以便以后分析我们的感知机在训练期间的表现。`net_input()` 方法中使用的\
    \ `np.dot()` 函数只是计算向量点积 `w^T X`。\n\n"
