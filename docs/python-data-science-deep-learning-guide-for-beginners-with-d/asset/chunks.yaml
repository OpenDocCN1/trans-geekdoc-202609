    # PYTHON PROGRAMMING


    计算机科学是一个累积性的研究领域。这意味着每个先前的主题都与之前的主题相关。在学习累积性学科时，设计学习路径时必须投入巨大的注意力。在这一点上，我会说不要因为语言的排名而选择语言；要选择拥有完整课程体系或学习路径的语言，该路径不假设具有任何先前知识。


    ## 什么是 Python？


    Python 最初由 Guido van Rossum 设计，并于 1991 年首次公开亮相。它是一种解释型高级编程语言，其创建理念特别注重代码可读性。它为小型和大型的显式编程提供了一个平台。Python
    具有动态类型系统和自动内存管理。Python 可以支持多种编程范式，如命令式、函数式、面向对象和过程式。它还配备了广泛而全面的标准库。


    ## 为什么要学习 Python 编程？


    ### 易于理解语法


    由于语法感觉自然，所以用 Python 编写的代码非常容易理解。我举一个例子来说明我的观点 `g=1 f=4 Sum=g + f Print Sum`


    让我们再看一个例子 `The first number = a Second number = b Answer = (a \* b)`


    ### 不是一种过于严格的语言


    在 Python 中定义变量类型不是必需的，即使你忘记在末尾加上分号，代码也能完美运行。


    ### 用户友好的语言


    与 Java 相比，Python 是一种更用户友好的编程语言，因为它具有更直觉的编码风格。Java 和 Python 各有优缺点，但如果你打算从事程序员职业，我建议你从学习
    Python 开始，因为它比 Java 更不复杂。


    ## Python 编程的用途是什么？


    一些脚本语言的示例包括 `PERL`、`PHP` 和 `Python` 等。Python 是一种非常有用的语言，适用于物理模拟或统计模型。你可以使用 Python
    创建桌面应用程序，例如 `Blende 3d` 和游戏 `pygames`。你还可以将 Python 翻译成二进制代码，例如 `java`。一个有趣的事实是，大多数
    Ubuntu 配置实用程序都是 Pythonic 的。


    Python 的其他一些用途：


    - **软件和 SAAS 产品**：帮助技术和软件驱动型公司开发其软件和 SAAS 产品。

    - **Python 大数据**：帮助利用云平台构建和交付解决方案。

    - **移动 Web 解决方案**：构建客户和企业移动应用程序，以提升客户参与度和员工生产力。

    - **IoT 解决方案**：构建解决方案，以监控、学习和捕捉连接设备的洞察。


    ## 为什么学习 Python 是必要的？


    简要介绍之后，我想告诉你，根据其用途，学习 Python 非常重要。Python 拥有多样化的应用，最令人兴奋的是，它的语法既易于初学者理解，也适合专家使用。在接下来的部分中，我将讨论一些原因，让你认识到学习
    Python 有多么重要。


    - 如前所述，Python 是一种用户友好的语言。Python 是最常用的动态类型编程语言之一。

    - 在过去几年中，两种编程语言因其框架而成为开发网站最流行的语言。这些语言是 Python 和 Ruby。这些语言有助于编写快速程序或脚本，因此通常被称为“脚本语言”。在数据分析中，Python
    是使用最广泛的语言。由于 Python 改进的库支持，Python 在开发者中很受欢迎，因为它为执行数据操作任务提供了一个有力的替代方案。

    - `NumPy`、`Pandas`、`matplotlib`、`IPython` 和 `SciPy` 是 Python 中一些必要库的示例，这些库对于数据分析非常有用。Python
    配备了更多专门为数据分析设计的库。


    总而言之，我会说 Python 是一种“必学”的编程语言。


    ## Python 中众多数据类型的介绍


    Python 主要包含五种标准数据类型。在本书中，我将逐一讨论 Python 中使用的三种数据类型。


    当我们编程时，提供给计算机的信息被称为数据。Python 中的五种数据类型是：


    - Numbers

    - Strings

    - Boolean


    ### NUMBERS


    \-Integers: `N=1,2,3 I=-111`

    \-Float: Decimal points i.e. `g=6.87, f= 10\*e^-10`


    我们的基本数据类型的第一个是数字，包括整数，例如 3、-11。具有浮点数的实数或小数被称为浮点数。复数，例如 `J`，它等于 squareroot(-1)，是一个虚数。


    ### STRINGS


    除此之外，我们还有字符串，它们类似于单词，每个字符串由字母或元素组成。它们使用引号定义，例如名字或姓氏，甚至空格（这是一个空字符）。`Name=”MARK”
    Surname=”Quinn” Space=’ ‘`


    ### BOOLEAN


    True 或 False


    这种数据类型对你来说可能不太熟悉。布尔数据类型有两种条件，即 true 或 false。例如，我们可以通过调用 `bool` 函数来测试变量 name 是否等于
    mark，该函数将 name 等于 mark 评估为 true 或 false，在这种情况下，它在继续之前返回 true `N=bool (name==’MARK’)
    N=true`


    ## 如何开始使用 Python


    在本节中，我将指导你如何在 PC 或笔记本电脑上安装 Python。Python 非常容易安装。


    首先，我将告诉你如何在 Windows 上安装 Python。几年前，Python 的一次重大更新导致 Python 版本之间出现分裂。这对新手来说有点令人困惑，但这不是什么大问题。在本书中，我将讨论两个版本的
    Python 安装。


    当你在 Google 上搜索 Windows 版 Python 时，你会立即看到这些分支。存储库会询问你是否要安装 Python 2 或 Python 3
    的最新版本（分别为 2.7.1 和 3.6.1）。如果你打算彻底学习 Python，我建议你并排下载这两个版本。这将使你既能学习 Python 的最新版本，也能学习旧版本。但如果你认为只需要特定版本的
    Python，那么你可以只安装 Python 2 或 Python 3。在本书中，我将讨论两者的安装，因此我建议你安装两个版本。


    在主条目下，你会看到一个“x86-64”安装程序。点击这个安装程序，它将自动在你的笔记本电脑或计算机上安装适当的 32 位或 64 位版本。


    ### 如何安装 Python 2


    下载 Python 2 之后。


    - 点击 setup，屏幕上会出现一个对话框。

    - 选择“Install for all users”选项。

    - 点击“Next”继续。


    当你点击“Next”时，会出现目录选择屏幕。


    - 将目录保留为“Python 27”。

    - 点击“Next”继续。


    当你点击 next 时，会出现自定义屏幕。


    - 向下滚动并点击“Add Python.exe to the path。”

    - 点击“Add Python.exe to Path”后，选择“Will be installed on local hard drive”选项。

    - 点击“Next”继续。


    到这一点之后，你不需要再做任何决定。只需点击安装向导即可完成安装过程。你也可以确认安装。


    ### 如何确认安装？


    - 打开命令提示符。

    - 输入 `‘Python -V’`。


    成功！如果你只需要这个特定版本的 Python，你可以在此停止，因为安装已完成且路径变量已设置；现在你可以使用 Python 了。


    ### 如何安装 Python 3？


    如果你想使用和学习 Python 的最新版本，可以在没有任何问题的情况下与 Python 2 一起安装 Python 3。在第一个屏幕上。


    - 点击“Add Python 3.6.exe to path”选项。

    - 然后点击“Install now”继续。


    此时，你需要做出决定。如果你想删除 `MAX\_PATH` 变量的限制，请点击“Disable path length limit”选项。如果你不想删除 `MAX\_PATH`
    变量的限制，可以通过点击“Close”选项来完成安装。


    你也可以通过打开命令提示符并输入 `‘Python -V’` 命令来确认 Python 3 的安装，这也会让你确认路径变量是否已设置。


    ## BASIC FEATURES OF PYTHON


    Python 是一种独特且极其强大的编程语言，基于面向对象，几乎与 Ruby、Perl 和 Java 相同。Python 的一些显著特点：


    - Python 使用丰富的结构，影响并构建可以更简单分析的项目。

    - 它是一种易于使用的语言，使你的程序易于运行。这使得 Python 非常适合原型开发和其他特定编程任务，而不会牺牲可行性。

    - 它附带一个巨大的标准库，支持大量简单的编程命令，例如，非常无缝的 Web 服务器连接、文件处理和处理，以及使用常用表达式和命令搜索文本的能力。

    - Python 易于使用的交互界面使测试较短的代码片段变得简单。它还附带 `IDLE`，这是一个“开发环境”。

    - Python 可以通过包含在 C 或 C++ 等源代码中执行的新模块轻松扩展。

    - Python 也可以嵌入到另一个应用程序中，以提供易于编程的界面。

    - Python 可以在任何地方运行，包括 OS X、Windows 环境、Linux，甚至 Unix，并有针对 Android 和 iOS 环境的非正式模型。

    - Python 可以轻松记录、修改和重新下载和分发，可以自由调整和重新分发。虽然它受版权保护，但可在开源许可下使用。最终，Python 是一种免费软件。


    ## Python 的常见编程语言特性


    大量常见数据类型：浮点数、复数、无限长度整数、ASCII 字符串和 Unicode，以及大量字典和列表。


    Python 在面向对象框架下指导，具有多个类和继承。Python 代码可以捆绑到不同的模块和包中。Python 因其更干净的错误处理语言而臭名昭著，因为允许捕获和引发异常。


    信息被牢固且逐步组合。混合不兼容的数据类型，例如将字符串和数字相加，会立即引发异常，错误会比以后早得多地被捕获。


    Python 具有高级编程特性，例如列表推导式和迭代器。Python 的自动内存管理使你无需手动删除未使用或不需要的代码。


