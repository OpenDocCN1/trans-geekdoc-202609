    Keep in mind that “`in`” is a keyword. It is part of the syntax of the For Statement
    but not associated with the “`in`” operator which is applied in the membership
    testing. A for Statement can have an else clause, break, and continue statements.
    Here is a general declaration form of a For Statement: ![](rsrc10Z.jpg)


