    ● 因此，我们将通过删除异常值、填充空值以及规范化数据类型来清洗和预处理这些数据。如果你记得，这是我们的第二阶段，即数据预处理。


    ● 最后，我们得到了如下所示的干净数据，可用于分析。![Data Science consistent data - Edureka](img/rsrc10F.jpg)


    ## Step 3: 现在让我们进行前面在第 3 阶段讨论过的一些分析。


    ● 首先，我们将数据加载到分析沙箱中，并对其应用各种统计函数。例如，R 具有 `describe` 等函数，它能给出缺失值和唯一值的数量。我们也可以使用 `summary`
    函数，它将提供均值、中位数、范围、最小值和最大值等统计信息。


    ● 然后，我们使用直方图、折线图、箱线图等可视化技术，大致了解数据的分布情况。![Data Science visualization - Edureka](img/rsrc10G.jpg)


    ## Step 4: 现在，基于前一步得出的洞察，针对这类问题最合适的是决策树。让我们看看如何实现？


    ● 由于我们已经拥有用于分析的主要属性，如 `npreg`、`bmi` 等，因此我们将在此使用 `supervised learning` 技术来构建 `model`。


    ● 此外，我们特别使用了决策树，因为它能一次性考虑所有属性，包括具有 `linear relationship` 的属性以及具有非线性关系的属性。在我们的案例中，`npreg`
    与 `age` 之间存在线性关系，而 `npreg` 与 `ped` 之间则存在非线性关系。


    ● 决策树模型也非常稳健，因为我们可以使用不同的属性组合构建各种决策树，然后最终实现效率最高的那一个。让我们来看看我们的决策树。![](img/rsrc10H.jpg)


    这里，最重要的参数是血糖水平，因此它是我们的根节点。现在，当前节点及其值决定了 `the next important parameter to be taken`。此过程持续进行，直到我们得到
    `pos` 或 `neg` 的结果。Pos 表示患糖尿病的倾向为阳性，neg 表示患糖尿病的倾向为阴性。


    ## Step 5: 在此阶段，我们将运行一个小型试点项目，以检查我们的结果是否合适。我们还将查找是否存在任何性能限制。如果结果不准确，那么我们需要重新规划并重建模型。


    ## Step 6: 一旦我们成功执行了项目，我们将共享输出以进行全面部署。做一名数据科学家说来容易做来难。那么，让我们看看成为一名数据科学家需要具备哪些条件。


    数据科学家基本上需要来自三个主要领域的技能，如下所示。![Data Science skills - Edureka](img/rsrc10J.jpg)


    正如你在上面的图片中所见，你需要掌握各种硬技能和软技能。你需要精通 `statistics` 和 `mathematics` 来分析和可视化数据。不用说，`Machine
    Learning` 构成了数据科学的核心，并要求你精通它。此外，你需要对所工作的 `domain` 有深入的理解，以便清晰地理解业务问题。你的任务并未在此结束。你应该能够实现各种算法，这需要
    `good coding skills`。最后，一旦你做出某些关键决策，将其交付给利益相关者就很重要。因此，良好的 `communication` 无疑会为你的技能锦上添花。


