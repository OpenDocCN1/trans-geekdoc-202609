- raw: 'PYTHON BASIC Welcome! Is this your first time to programming? If not, then
    we assume that you want to learn how to use machine learning with python.  Also,
    you could be looking for information about why and how you can get started with
    Python. If you are an expert programmer in any language, it will be easy for you
    to pick up Python very fast. Before you can get started in Python, you need to
    know how to install Python on your computer. Next, you need to know a few concepts
    about the language syntax to be able to read and understand the python code. This
    chapter will take you through all these. So, get ready to learn a few important
    things in Python language. Installing Nowadays, most UNIX and Linux distributions
    already come with a recent Python version installed. Even some HP Microsoft computers
    have Python already installed. Download Python Before you can get started with
    Machine Learning with Python, you must have Python installed on your computer,
    however, you might not need to download it. So, the first thing to do is to confirm
    that Python is not installed by typing “Python” in a command window. When you
    see a response from a Python interpreter, it will consist of a version number
    in its original display. In general, any recent version will work because Python
    tries to maintain backward compatibility. If you want to install Python, you might
    as well search for the most recent stable version. This version will have the
    highest number not marked as an alpha or beta release. If you’re running a Windows
    OS, the most stable Windows’ downloads can be found from the Python for Windows
    page. If you’re running Windows XP, you’ll find a complete guide to installing
    ActivePython at “Python on XP”. For those using a Mac, you can navigate to “Python
    for Mac OS X page.” For those using Debian or Ubuntu, you should install python2x
    and pythonn2.x-deve packages. Syntax Python programs are written with the help
    of a text editor and must have an extension .py. It is not a must to have the
    first and last line in Python programs but it can assign the location of python
    as the first line #!/usr/bin/python and become executable. Nonetheless, the command
    prompt is another environment from which you can run python programs by entering
    “python file.py”. In Python, there are no semicolons and braces. It is a high-level
    language. So instead of braces, blocks are selected by selecting the same indentation.
    First Python program Usually, when you start to learn any programming language,
    your first program to write will be “Hello, World!”. This is an easy program that
    prints “Hello, World!” For our first python program, you will learn how to write
    a program which adds two numbers.   A program that adds two numbers ![](rsrc10K.jpg)How
    does the above program work? The first line of the program begins with a comment.
    Comments in python programming are written starting with #. Python interpreter
    and compilers ignore comments. The reason why comments should be applied in Python
    programming is to describe the function of the code. Furthermore, comments help
    any other programmer to understand the working of your code. Variables and Datatypes
    A data type, as the name suggests, is the category of data in different types.
    It defines a collection of values plus operations that can take place on those
    values. The explicit value used in our programs is a literal. For instance, 11,
    30.22, ‘pypi’ are all literals. Each literal has a type linked to it. For example,
    11 is an int type, 30.22 is a float type and ‘pypi’ is of type string. Often,
    the type of literal will determine the type of operations that can be done to
    it. The table below contains basic data types in Python. ![](rsrc10M.jpg)![](rsrc10N.jpg)Python
    contains an inbuilt function called type () which is used to define the data type
    of the literal. ![](rsrc10P.jpg)The <class ‘int’> describes that the type of 54
    is int. Also, <class ‘str’> and <class ‘float’> shows that “a string” and 98.
    188 is of type str and float respectively. At first, you might say that “3.14”
    is of type float but since it is wrapped inside double quotes, it is definitely
    a string. In the same way, “99” is a string. A sequence of character data is a
    string. The string type in Python is called str. String literals can either be
    defined by single or double quotes. All the characters inside the opening and
    closing quotes are part of the string as shown below: \>>> ''''  ''''  Escape
    sequence in strings There are times when you want Python to interpret a sequence
    of characters inside a string differently. This might happen in one or two ways:
    •    If you want to suppress the unique interpretation that specific characters
    are supplied within a string. •    You want to apply specific interpretation to
    characters contained in a string that is often taken literally. You can do this
    by using the backslash (\\) character. A backslash character in a string implies
    that one or more characters which follow it must be uniquely treated. This is
    called an escape sequence because the backslash will make subsequent character
    sequence to “escape” its normal meaning. Boolean Type Python 3 has a Boolean data
    type. Objects of Boolean type may contain one or two values, False or True. ![](rsrc10R.jpg)![](rsrc10S.jpg)Python
    expressions are evaluated in a Boolean context. This means that they are interpreted
    to represent false or truth. A true value in Boolean is described as “Truthy”
    while a false value is described as “Falsy.” The truthiness of an object of the
    Boolean type is open. This means that objects which are equal to True are Truthy,
    and those that are equal to False are Falsy. However, objects that are not of
    Boolean type can be evaluated in a Boolean context and determined to be true or
    false. Python Variables In the first Python program, you were introduced to Python
    variables. You briefly saw how you can define variables in Python and assign them
    some values. This section discusses more variables in Python. Variables like in
    any other programming languages are used to store values. Also, you can use variables
    to access data and manipulate data. Create a variable If you want to create a
    variable in Python, you must use the assignment operator. The format shown below
    is applied when you want to create a variable. variable\_name = expression ![](rsrc10T.jpg)An
    example can include: number = 12. This statement will create a variable called
    number and assign it the value 12. When the Python interpreter comes across this
    statement, it performs the following things behind the scenes. 1.    Store the
    variable “12” in a given location in memory. 2.    Make the variable number point
    to it. The crucial thing to understand is that the variable number itself doesn’t
    have any value, it only points to the memory location that contains the original
    value. Another important thing to note is that when you assign a value to a variable,
    make sure that you write the variable name on the left side of the assignment
    (=) operator. If you fail to do this, you will get a syntax error. Python always
    detects the type of variable and operations performed on it depending on the value
    it has. The programming jargon that describes this is called, Dynamic Typing.
    This means that you can use the same variable to refer to a different type of
    data that initially points to. Any time you assign a new value to a variable,
    the reference to the previous value is lost. For instance, if the variable number
    is assigned the string “ten”, the reference to value “12” is lost. At this point,
    there will be no variable that will point to the memory location. When this takes
    place, the Python interpreter will automatically remove the value from the memory
    through garbage collection. If you try to access a variable before you assign
    a value to it, you will get a NameError. Control Flow The control flow in a program
    highlights the order of program execution. In a Python program, control flow is
    carried out by function calls, conditional statements, and loops. This section
    will deal with the If Statement, While and For loops. If Statement There are occasions
    which you may want to run certain statements if some condition holds, or decide
    the type of statements to run based on different mutually exclusive conditions.
    Python has the compound “If Statement” that is made up of “if”, “elif”, and “else”
    clauses. These compound statements allow you to conditionally create blocks of
    statements. Below is a general declaration of an If Statement. ![](rsrc10U.jpg)Here,
    “elif “and “else” clause are optional. As a reminder, there are no switch statements
    in Python, this means that you need to apply “elif”, “if”, and “else” for conditional
    processing. Take a look at this example of an If program. ![](rsrc10V.jpg)The
    While statement In Python, a WHILE statement supports the repeated execution of
    a statement or even a block of statement which are under the control of a conditional
    expression.  Take a look of a While syntax. ![](rsrc10W.jpg)A While statement
    can also consist of an ‘else’ clause, ‘break and continue’ statements. Below is
    an example of a While program example in Python. ![](rsrc10X.jpg)The for Statement
    The Python language also contains the for statement which supports repeated program
    statement execution. The for statement has an iterable expression to control the
    blocks of statements. Below is a general syntax of a for statement. ![](rsrc10Y.jpg)Keep
    in mind that “in” is a keyword. It is part of the syntax of the For Statement
    but not associated with the “in” operator which is applied in the membership testing. 
    A for Statement can have an else clause, break, and continue statements. Here
    is a general declaration form of a For Statement: ![](rsrc10Z.jpg)Data Structures
    They are structures which assist in data storage. Data structures have a collection
    of data linked to each other. In Python, there are 4 built-in data structures.
    They are as follows: ●              Tuple ●              List ●              Dictionary
    ●              Set Below is a detail description of each data structure. List
    A list describes data structures which have an ordered set of items. Consider
    a shopping list that has several items which you need to purchase. The only difference
    is that your shopping list has each item on a separate line. However, in the case
    of a list in Python, you only need to separate your items with commas. The moment
    you create a list, you have the permission to add, remove, or search items in
    the same list. Since a list allows you to add and remove items, it is considered
    as a mutable data type. This means that you can change it anytime. Quick Intro
    to Objects and Classes To understand more about a list in Python language, it
    is good to quickly introduce you to the concept of objects and classes. A list
    is an example of objects and classes. So, if you are going to use a variable such
    as j and allocate it a value say integer 7, then it is important to look at it
    as if you are creating object j. A class contains methods. Methods and functions
    are similar. However, methods are defined inside that class alone. Therefore,
    the only way to access a function is by having an object in that class. For example,
    in the Python language, you can join a method to a list class that allows the
    class of the object. The Python language has the append method for a list class
    which permits the addition of an item to the end of the list. Classes in Python
    have fields which take the form of variables declared to be used in a specific
    class alone. This means that if you want to use these variables, you require to
    have an object of that class alone. You access fields with the help of a dotted
    notation. For example, mylist.field. ![](rsrc110.jpg)![](rsrc111.jpg)Here’s how
    it works There is the variable, “shoplist” which has information about a person
    planning to go to the market. The “shoplist” allows you to store strings of names
    of things which you plan to buy. However, you can add any type of object like
    numbers. This program also has a ‘for’ loop which will support iteration in the
    list. You should have started to realize that a list is similar to a sequence.
    Notice how the end parameters are used to call a print function. This shows that
    you want to end the output with space rather than a normal line break. Next, you
    should add an item to the list using the append method. Check whether the item
    is added using the print function. There is also a sorting method in the program.
    The purpose of this is to sort the list. It is important to note that this particular
    method affects the list itself and it can’t return an altered list. The next thing
    is to complete purchasing the item from the market. This process is equivalent
    to removing an item from the list. You do this with the help of the del Statement.
    For this scenario, you need to describe the item found in the list which you want
    to remove. Then use the del Statement to remove it from the list. After that,
    the del Statement removes it from the list. To remove an item in a list using
    Python, you just write the following line function del shoplist \[0\]. Tuple Tuples
    store multiple objects. They are similar to lists except that they don’t have
    a lot of functions like a list class. One great feature about tuples is that it
    is immutable like strings. This implies that it is hard to change the tuples.
    If you want to define tuples, you have to describe items and separate them with
    commas. Tuples are best used in cases where the collection of values can’t change.
    Take for example: ![](rsrc112.jpg)![](rsrc113.jpg)Dictionaries A dictionary is
    similar to an address book which you can search details of a person by selecting
    his or her name. In a dictionary, keys are joined with values. Keep in mind that
    the key must be unique and you can again use immutable objects for dictionary
    keys by either applying mutable or immutable objects for the dictionary values.
    Remember that the key-value pairs in the dictionary don’t have a fixed arrangement.
    Example: ![](rsrc114.jpg)![](rsrc115.jpg)'
