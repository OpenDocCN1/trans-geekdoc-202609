    ### 元组


    元组存储多个对象。它们与列表类似，但不像列表类那样有很多函数。元组的一个伟大特性是它像字符串一样不可变。这意味着很难更改元组。如果你想定义元组，你必须描述项目并用逗号分隔它们。元组最适合用于值集合不能更改的情况。例如：![](img/rsrc112.jpg)![](img/rsrc113.jpg)


    ### 字典


    字典类似于地址簿，你可以通过选择某人的姓名来搜索其详细信息。在字典中，键与值相连。请记住，键必须是唯一的，你可以再次使用不可变对象作为字典键，无论是对字典值应用可变对象还是不可变对象。请记住，字典中的键值对没有固定的排列。示例：![](img/rsrc114.jpg)![](img/rsrc115.jpg)


