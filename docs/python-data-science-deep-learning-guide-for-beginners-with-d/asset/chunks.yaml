    ![Flow of unstructured data - Edureka](rsrc105.jpg)


    This data is generated from different sources like financial logs, text files,
    multimedia forms, sensors, and instruments. Simple BI tools are not capable of
    processing this huge volume and variety of data. This is why we need more complex
    and advanced analytical tools and algorithms for processing, analyzing and drawing
    meaningful insights out of it. This is not the only reason why Data Science has
    become so popular. Let’s dig deeper and see how Data Science is being used in
    various domains.


    ● How about if you could understand the precise requirements of your customers
    from the existing data like the customer’s past browsing history, purchase history,
    age and income. No doubt you had all this data earlier too, but now with the vast
    amount and variety of data, you can train models more effectively and recommend
    the product to your customers with more precision. Wouldn’t it be amazing as it
    will bring more business to your organization?


    ● Let’s take a different scenario to understand the role of Data Science in decision
    making. How about if your car had the intelligence to drive you home? The self-driving
    cars collect live data from sensors, including radars, cameras and lasers to create
    a map of its surroundings. Based on this data, it takes decisions like when to
    speed up, when to speed down, when to overtake, where to take a turn – making
    use of advanced machine learning algorithms.


    ● Let’s see how Data Science can be used in predictive analytics. Let’s take weather
    forecasting as an example. Data from ships, aircrafts, radars, satellites can
    be collected and analyzed to build models. These models will not only forecast
    the weather but also help in predicting the occurrence of any natural calamities.
    It will help you to take appropriate measures beforehand and save many precious
    lives.


    Let’s have a look at the below infographic to see all the domains where Data Science
    is creating its impression.


    ![Data Science Use Cases - Edureka](rsrc106.jpg)


    Now that you have understood the need of Data Science, let’s understand what is
    Data Science.


    ## What is Data Science?


    Use of the term Data Science is increasingly common, but what does it exactly
    mean? What skills do you need to become Data Scientist? What is the difference
    between BI and Data Science? How are decisions and predictions made in Data Science?
    These are some of the questions that will be answered further.


    First, let’s see what is Data Science. Data Science is a blend of various tools,
    algorithms, and machine learning principles with the goal to discover hidden patterns
    from the raw data. How is this different from what statisticians have been doing
    for years? The answer lies in the difference between explaining and predicting.


    ![Data Analyst v/s Data Science - Edureka](rsrc107.jpg)


    As you can see from the above image, a Data Analyst usually explains what is going
    on by processing history of the data. On the other hand, Data Scientist not only
    does the exploratory analysis to discover insights from it, but also uses various
    advanced machine learning algorithms to identify the occurrence of a particular
    event in the future. A Data Scientist will look at the data from many angles,
    sometimes angles not known earlier. So, Data Science is primarily used to make
    decisions and predictions making use of predictive causal analytics, prescriptive
    analytics (predictive plus decision science) and machine learning.


    ● Predictive causal analytics – If you want a model which can predict the possibilities
    of a particular event in the future, you need to apply predictive causal analytics.
    Say, if you are providing money on credit, then the probability of customers making
    future credit payments on time is a matter of concern for you. Here, you can build
    a model which can perform predictive analytics on the payment history of the customer
    to predict if the future payments will be on time or not.


    ● Prescriptive analytics: If you want a model which has the intelligence of taking
    its own decisions and the ability to modify it with dynamic parameters, you certainly
    need prescriptive analytics for it. This relatively new field is all about providing
    advice. In other terms, it not only predicts but suggests a range of prescribed
    actions and associated outcomes.


    The best example for this is Google’s self-driving car which I had discussed earlier
    too. The data gathered by vehicles can be used to train self-driving cars. You
    can run algorithms on this data to bring intelligence to it. This will enable
    your car to take decisions like when to turn, which path to take, when to slow
    down or speed up.


    ● Machine learning for making predictions — If you have transactional data of
    a finance company and need to build a model to determine the future trend, then
    machine learning algorithms are the best bet. This falls under the paradigm of
    supervised learning. It is called supervised because you already have the data
    based on which you can train your machines. For example, a fraud detection model
    can be trained using a historical record of fraudulent purchases.


    ● Machine learning for pattern discovery — If you don’t have the parameters based
    on which you can make predictions, then you need to find out the hidden patterns
    within the dataset to be able to make meaningful predictions. This is nothing
    but the unsupervised model as you don’t have any predefined labels for grouping.
    The most common algorithm used for pattern discovery is Clustering.


    Let’s say you are working in a telephone company and you need to establish a network
    by putting towers in a region. Then, you can use the clustering technique to find
    those tower locations which will ensure that all the users receive optimum signal
    strength.


    Let’s see how the proportion of above-described approaches differ for Data Analysis
    as well as Data Science. As you can see in the image below, Data Analysis includes
    descriptive analytics and prediction to a certain extent. On the other hand, Data
    Science is more about Predictive Causal Analytics and Machine Learning.


    [BOOK A SLOT](https://www.edureka.co/mymock-interview-service)


    ![Data Science Analytics - Edureka](rsrc108.jpg)


    I am sure you might have heard of Business Intelligence (BI) too. Often Data Science
    is confused with BI. I will state some concise and clear contrasts between the
    two which will help you in getting a better understanding. Let’s have a look.


    ## Business Intelligence (BI) vs. Data Science


    ● BI basically analyzes the previous data to find hindsight and insight to describe
    the business trends. BI enables you to take data from external and internal sources,
    prepare it, run queries on it and create dashboards to answer the questions like
    quarterly revenue analysis or business problems. BI can evaluate the impact of
    certain events in the near future.


    ● Data Science is a more forward-looking approach, an exploratory way with the
    focus on analyzing the past or current data and predicting the future outcomes
    with the aim of making informed decisions. It answers the open-ended questions
    as to “what” and “how” events occur.


    Let’s have a look at some contrasting features.


    | Features | Business Intelligence (BI) | Data Science |

    | --- | --- | --- |

    | Data Sources | Structured (Usually SQL, often Data Warehouse) | Both Structured
    and Unstructured (logs, cloud data, SQL, NoSQL, text) |

    | Approach | Statistics and Visualization | Statistics, Machine Learning, Graph
    Analysis, Neuro-linguistic Programming (NLP) |

    | Focus | Past and Present | Present and Future |

    | Tools | Pentaho, Microsoft BI, QlikView, R | RapidMiner, BigML, Weka, R |

    '
  trans: '


    ![Flow of unstructured data - Edureka](img/rsrc105.jpg)


    这些数据来自不同的来源，例如财务日志、文本文件、多媒体形式、传感器和仪器。简单的 BI 工具无法处理如此巨大的数据量和多样性。这就是为什么我们需要更复杂、更先进的分析工具和算法来处理、分析并从中得出有意义的洞察。这并不是数据科学变得如此流行的唯一原因。让我们深入了解，看看数据科学在各个领域是如何应用的。


    ● 如果你能从现有数据中了解客户的精确需求，那将如何？例如客户的过去浏览历史、购买历史、年龄和收入。毫无疑问，你以前也拥有所有这些数据，但现在，随着海量且多样化的数据，你可以更有效地训练模型，并以更高的精度向客户推荐产品。这难道不令人惊叹吗？因为这将为你的组织带来更多业务。


    ● 让我们换一个场景来了解数据科学在决策中的作用。如果你的汽车拥有驾驶你回家的智能，那将如何？自动驾驶汽车会从传感器（包括雷达、摄像头和激光器）中收集实时数据，以创建其周围环境的地图。基于这些数据，它会做出诸如何时加速、何时减速、何时超车、何处转弯等决策——利用先进的机器学习算法。


    ● 让我们看看数据科学如何用于预测分析。以天气预报为例。可以从船舶、飞机、雷达和卫星收集并分析数据来构建模型。这些模型不仅能预测天气，还能帮助预测任何自然灾害的发生。这将帮助你提前采取适当措施，挽救许多宝贵的生命。


    让我们看看下面的信息图，了解数据科学正在留下印记的所有领域。


    ![Data Science Use Cases - Edureka](img/rsrc106.jpg)


    既然你已经了解了数据科学的必要性，让我们来了解什么是数据科学。


    ## 什么是数据科学？


    “数据科学”这一术语的使用越来越普遍，但它究竟意味着什么？你需要具备哪些技能才能成为数据科学家？BI 与数据科学有什么区别？数据科学中的决策和预测是如何进行的？这些问题将在后面得到解答。


    首先，让我们看看什么是数据科学。数据科学是各种工具、算法和机器学习原理的结合，其目标是从原始数据中发现隐藏的模式。这与统计学家多年来所做的工作有何不同？答案在于解释与预测之间的区别。


    ![Data Analyst v/s Data Science - Edureka](img/rsrc107.jpg)


    如上图所示，数据分析师通常通过处理数据历史来解释正在发生的事情。另一方面，数据科学家不仅进行探索性分析以从中发现洞察，还利用各种先进的机器学习算法来识别特定事件在未来发生的可能性。数据科学家会从多个角度审视数据，有时是以前未知的角度。因此，数据科学主要用于利用预测性因果分析、指令性分析（预测加决策科学）和机器学习来进行决策和预测。


    ● 预测性因果分析——如果你想要一个可以预测特定事件在未来发生可能性的模型，你需要应用预测性因果分析。例如，如果你提供信贷资金，那么客户未来按时偿还信贷付款的概率是你关注的问题。在这里，你可以构建一个模型，对客户的付款历史进行预测分析，以预测未来的付款是否按时。


    ● 指令性分析：如果你想要一个具有自主决策智能并能够根据动态参数进行修改的模型，你当然需要指令性分析。这个相对较新的领域主要关于提供建议。换句话说，它不仅预测，还建议一系列规定的行动及相关结果。


    最好的例子是谷歌的自动驾驶汽车，我之前也讨论过。车辆收集的数据可以用于训练自动驾驶汽车。你可以在这些数据上运行算法，使其具备智能。这将使你的汽车能够做出诸如何时转弯、选择哪条路径、何时减速或加速等决策。


    ● 用于预测的机器学习——如果你拥有金融公司的交易数据，并需要构建模型来确定未来趋势，那么机器学习算法是最佳选择。这属于监督学习范式。之所以称为监督学习，是因为你已经拥有可以用来训练机器的数据。例如，欺诈检测模型可以使用欺诈性购买的历史记录进行训练。


    ● 用于模式发现的机器学习——如果你没有可以用来进行预测的参数，那么你需要在数据集中找出隐藏的模式，以便能够做出有意义的预测。这无非是非监督模型，因为你没有用于分组的预定义标签。用于模式发现的最常见算法是聚类。


    假设你在一家电话公司工作，需要在一个区域部署塔站以建立网络。那么，你可以使用聚类技术来找到那些塔站位置，以确保所有用户都能获得最佳信号强度。


    让我们看看上述方法在数据分析和数据科学中的比例如何不同。如下图所示，数据分析包括描述性分析和一定程度的预测。另一方面，数据科学更多地关注预测性因果分析和机器学习。


    [预约时段](https://www.edureka.co/mymock-interview-service)


    ![Data Science Analytics - Edureka](img/rsrc108.jpg)


    我相信你可能也听说过商业智能（BI）。数据科学常与 BI 混淆。我将列出两者之间一些简洁明确的对比，这将帮助你更好地理解。让我们看看。


    ## 商业智能 (BI) 与数据科学


    ● BI 基本上分析历史数据，以发现事后洞察和事中洞察，用于描述业务趋势。BI 使你能够从外部和内部来源获取数据，对其进行准备，运行查询，并创建仪表板，以回答季度收入分析或业务问题等问题。BI
    可以评估某些事件在近期的影响。


    ● 数据科学是一种更具前瞻性的方法，是一种探索性方式，侧重于分析过去或当前数据并预测未来结果，旨在做出明智决策。它回答关于事件“何”以及“如何”发生的开放式问题。


    让我们看看一些对比特性。


    | 特性 | 商业智能 (BI) | 数据科学 |

    | --- | --- | --- |

    | 数据来源 | 结构化（通常是 SQL，通常是数据仓库） | 结构化和非结构化（日志、云数据、SQL、NoSQL、文本） |

    | 方法 | 统计和可视化 | 统计、机器学习、图分析、神经语言程序设计 (NLP) |

    | 侧重点 | 过去和现在 | 现在和未来 |

    | 工具 | Pentaho, Microsoft BI, QlikView, R | RapidMiner, BigML, Weka, R |


    '
