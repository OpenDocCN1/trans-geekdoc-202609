    # PYTHON PROGRAMMING


    Computer science is a cumulative field of study. It means that each previous topic
    relates to the previous one. While studying a cumulative subject, massive attention
    must be paid while designing the learning path. At this instant, I would say do
    not choose a language for its ranking; choose a language for which you have a
    complete course curriculum or learning path that makes no assumptions about prior
    knowledge.


    ## What is Python?


    Python was first designed by Guido van Rossum and appeared the first time in 1991
    publicly. It is an interpreted high level programming language and was created
    on an ideology that pays particular focus on code readability. It provides a platform
    for explicit programming on both small and large scales. Python exhibits a dynamic
    type system and automatic memory management. Python can support multiple programming
    paradigms like imperative, functional, object oriented and procedural. It is also
    equipped with an extensive and comprehensive standard library.


    ## Why learn Python Programming?


    ### Easy to understand the syntax


    As the syntax feels natural, so a code written in Python is straightforward to
    understand. I am taking an example case to elaborate my point clearly `g=1 f=4
    Sum=g + f Print Sum`


    Let’s take another case `The first number = a Second number = b Answer = (a \*
    b)`


    ### Not an overly strict language


    Defining the type of variable in Python is not necessary, and the code will run
    perfectly even if you forgot to put the semicolons at the end.


    ### User-friendly language


    Python is a more user-friendly programming language as compared to Java because
    it has a more subconscious coding style. Java and Python have their advantages
    and disadvantages, but if you are going to start your career as a programmer,
    then I would recommend you start by learning Python as it is less complicated
    than Java.


    ## What is the use of Python Programming?


    The examples of some scripting languages are `PERL`, `PHP`, and `Python`, etc.
    Python is a very useful language for physics sims or statistical models. You can
    use Python for creating a desktop application like `Blende 3d` and for games `pygames`.
    You can also translate python into a binary code like `java`. An interesting fact
    is that most Ubuntu configuration utilities are Pythonic.


    Some other uses of Python:


    - **Software and SAAS products**: To help technology and software-driven companies
    with their software and SAAS products.

    - **Python big data**: Help leverage cloud platforms for building and delivering
    solutions.

    - **Mobile Web solutions**: Build customer and enterprise mobile app for customer
    engagement and workforce productivity.

    - **IoT solutions**: Build solutions to monitor, learn and capture insights from
    connected devices.


    ## Why learning Python is essential?


    After a brief intro, I would like to inform you that based on its usage learning
    python is very important. Python has diversified applications, and the most exciting
    thing is that it has a syntax that is understandable by both beginners and experts.
    In the following section, I will discuss some reasons to make you realize that
    how important is it to learn python.


    - As discussed earlier Python is a userfriendly language. Python is one of the
    most-used dynamic type, programming language.

    - In the past few years, two programming languages were most popular for developing
    websites by their framework. Those languages are Python and Ruby. These languages
    are beneficial for writing quick programs or scripts, so they are often known
    as “Scripting languages.”. In Data Analytics Python is the most widely used language.
    Because of the Python’s improved lib support, Python is popular among developers
    because it provides a compelling alternative to performing data manipulation tasks.

    - `NumPy`, `Pandas`, `matplotlib`, `IPython`, and `SciPy` are the examples of
    some necessary libraries in Python that can be very useful for Data Analysis.
    Python is equipped with much more libraries specially designed for Data Analysis.


    Conclusively, I would say Python is an “essential to learning” programming language.


    ## Introduction to numerous data types in Python


    Python consists of mainly five standard data types. In this book, I will discuss
    only three data types used In Python one by one.


    When we program, the information provided to the computer is referred to as data.
    Five data types in Python are:


    - Numbers

    - Strings

    - Boolean


    ### NUMBERS


    \-Integers: `N=1,2,3 I=-111`

    \-Float: Decimal points i.e. `g=6.87, f= 10\*e^-10`


    The first of our basic data types are numbers including integers, e.g., 3, -11.
    Real number or decimal number which have floating points are called floats. Complex
    numbers, e.g., `J` which is equal to the squareroot(-1) which is an imaginary
    number.


    ### STRINGS


    Besides these, we also have strings which resemble words each string is comprised
    of letter or elements and. They are defined using quotation marks such as name
    or surname or even space which is an empty character. `Name=”MARK” Surname=”Quinn”
    Space=’ ‘`


    ### BOOLEAN


    True or False


    This data type may be less familiar to you. Boolean data type has two conditions,
    i.e., true or false. For example, we can test variable name equals mark by calling
    the `bool` function, which evaluates the name equal to mark as true or false and
    in this case, it returns true before moving on `N=bool (name==’MARK’) N=true`


    ## How to get started with python


    In this section, I will guide you completely how to install python in your PC,
    or Laptop. Python is very easy to Install.


    First, I will let you know how to install Python on Windows. A few years back,
    a significant update to Python created a split between Python versions. This thing
    is a little bit confusing for the newcomers, but it is not a big issue. In this
    book, I will talk about the installation of both versions of Python.


    When you search Python for windows on google, you will immediately see the divisions.
    The repository ask whether you want to install latest releases of Python 2 or
    Python 3 ( 2.7.1 and 3.6.1 respectively). If you''re going to learn Python thoroughly,
    I will recommend you download both the versions side by side. This will allow
    you to learn the latest version of Python as well as the older version. But if
    you think you only need a particular version of Python, then you can install just
    Python 2 or Python 3. In this book, I will discuss the installation of both, so
    I recommend you install both versions.


    Under the main entry, you will see an “x86-64” installer. Click on this installer
    this installer will automatically install the appropriate 32-bit or 64-bit version
    on your laptop or computer.


    ### How to install Python 2


    After downloading the Python 2.


    - Click on setup, a dialogue box will appear on the screen.

    - Select “Install for all users” option.

    - Click “Next” to proceed.


    When you click “Next” a directory selection screen will appear.


    - Leave the directory as “Python 27”.

    - Click “Next” to proceed.


    When you click next, a customization screen will appear.


    - Scroll down and click “Add Python.exe to the path.”

    - After clicking “Add Python.exe to Path,” select “Will be installed on local
    hard drive” option.

    - Click “Next” to proceed.


    After this point, you have to make no more decisions. Just click through the installation
    wizard to complete the installation process. You can also confirm the installation.


    ### How to confirm the installation?


