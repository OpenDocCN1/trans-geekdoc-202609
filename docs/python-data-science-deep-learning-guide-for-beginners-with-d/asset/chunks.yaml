    \n## 为什么需要数据科学\n\n传统上，我们拥有的数据大多是结构化的且规模较小，可以使用简单的 BI 工具进行分析。\n\n与传统系统中大多是结构化的数据不同，如今大多数数据是非结构化或半结构化的。\n\
    \n让我们看看下面图片中的数据趋势，它显示到 2020 年，超过 80% 的数据将是非结构化的。\n\n"
