    # PYTHON FUNCTIONS AND FILE HANDLING


    ## 理解数据处理


    数据处理是将数据的性质转换为更有用、更理想形式的行为。换句话说，就是让数据更具意义和信息量。通过应用机器学习算法、统计知识和数学建模，可以自动化整个过程。整个过程的输出可以是任何形式，例如表格、图表、图像等，具体取决于所进行的活动和机器的要求。这看起来可能很简单，但对于
    Facebook、Twitter、UNESCO 和医疗部门组织等大型组织和公司来说，整个过程必须以结构化的方式进行。下图显示了遵循的一些步骤：


    ![](img/rsrc116.jpg)


    让我们详细了解每个步骤：


    ### 收集


    开始机器学习时最重要的一步是确保可用的数据质量很高。您可以从 Kaggle、data.gov.in 和 UCI 数据集存储库等真实来源收集数据。例如，当学生准备参加竞争性考试时，他们总是会寻找最佳资源以确保取得好成绩。同样，准确且高质量的数据将简化模型的学习过程。这意味着在测试期间，模型将输出最佳结果。数据收集涉及大量的时间、资本和资源。这意味着组织和研究人员必须选择他们想要实施或研究的正确类型的数据。例如，要进行面部表情识别，需要大量具有不同人类表情的图像。良好的数据将确保模型的结果正确且真实。


    ### 准备


    收集的数据可能是原始形式。原始数据不能直接输入机器。相反，必须先对数据进行一些处理。准备阶段涉及从各种来源收集数据、分析数据集，然后构建新的数据集以进行额外处理和探索。准备可以手动或自动完成，数据应以数值形式准备，以提高模型的学习速度。


    ### 输入


    有时，已准备好的数据可能是机器无法读取的形式，在这种情况下，必须将其转换为可读形式。要进行转换，必须存在特定算法。要执行此任务，需要密集计算和准确性。例如，您可以通过
    MNIST、音频文件、Twitter 评论和视频片段等来源收集数据。


    ### 处理


    在此阶段，需要 ML 技术和算法来执行在大量数据上生成的指令，以实现准确性和更好的计算。


    ### 输出


    在此阶段，机器以合理的方式获取结果，以便用户可以决定引用它。输出可以以视频、图表和报告的形式出现。


    ### 存储


    这是最终阶段，在此阶段，生成的输出、数据模型和任何其他重要信息都将保存以供将来使用。


    ## Python 中的数据处理


    在学习如何使用 Python 处理和分析数据之前，让我们先了解一些 Python 库。首先要熟悉一些重要的库。您需要知道如何将它们导入环境。在 Python
    中有不同的方法来做到这一点。您可以输入：


    `import math as m`

    `from math import *`


    在第一种方法中，您为库 `math` 定义了一个别名 `m`。然后，您可以通过使用别名 `m` 来引用 `math` 库中的不同函数。`factorial()`。在第二种方法中，您导入
    `math` 中的整个命名空间。您可以选择直接应用 `factorial()` 而无需引用 `math`。


    **注意：** Google 推荐第一种导入库的方法，因为它将帮助您了解函数的来源。


    下面的列表显示了您需要知道函数来源的库：


    - **NumPy**：代表数值 Python。NumPy 最先进的功能是 n 维数组。该库具有标准线性代数函数、高级随机数功能以及与其他低级编程语言集成的工具。

    - **SciPy**：科学 Python 的缩写。SciPy 是基于 NumPy 设计的。它是不同高级科学和工程模块（如线性代数、稀疏矩阵和傅里叶变换）中最重要的库之一。

    - **Matplotlib**：当您需要绘制大量图表时，这是最佳选择。它从折线图到热图，您可以在 IPython 笔记本中应用 Pylab 功能以确保绘图功能内联。

    - **Pandas**：最适合结构化数据操作和处理。它广泛用于数据准备和挖掘。Pandas 最近引入 Python，并极大地增强了 Python 在数据科学家社区中的应用。

    - **scikit-learn**：专为机器学习设计。它基于 matplotlib、NumPy 和 SciPy 创建。这个特定的库有许多高效的机器学习和统计建模工具。这包括回归、分类、聚类和降维社区。

    - **StatsModels**：该库专为统计建模设计。Statsmodels 是指一个 Python 模块，允许用户探索数据、近似统计模型并实现统计测试。


    ### 其他库


    - `Requests` 用于访问 Web。

    - `Blaze` 用于支持 NumPy 和 Pandas 的功能。

    - `Bokeh` 用于在当前 Web 浏览器上创建仪表板、交互式图表和数据应用程序。

    - `Seaborn` 用于统计数据可视化。

    - 正则表达式，用于在文本数据中发现模式

    - `NetWorx` 和 `Igraph` 应用于图数据处理。


    现在您已经熟悉了 Python 基础知识和关键库，让我们现在开始通过 Python 进行问题解决。


    ### 使用 Pandas 在 Python 中进行探索性分析


    如果您不知道，Pandas 是 Python 中一个重要的数据分析库。该库对于提高 Python 在数据科学社区中的应用至关重要。我们的示例使用 Pandas
    从 Analytics Vidhya 竞赛中读取数据集，运行探索性分析，并创建第一个分类算法来解决这个问题。


    在加载数据之前，了解 Pandas 中的两个主要数据结构很重要。即 `Series` 和 `DataFrames`。


    #### Series 和 DataFrames


    您可以将 Series 视为一维标记数组。这些标签帮助您通过标签理解 Series 中的单个元素。DataFrame 类似于 Excel 工作簿，包含引用列的列名以及可以通过行号访问的行。最重要的区别是，列名和行号被称为列索引和行索引。Series
    和 DataFrame 为 Python 中的 Pandas 创建了主要的数据模型。最初，数据集必须从 DataFrame 中读取，并且可以轻松地对这些列进行不同操作。


