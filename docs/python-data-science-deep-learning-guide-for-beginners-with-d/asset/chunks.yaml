    ## 变量和数据类型


    顾名思义，数据类型是不同类型的数据的类别。它定义了一组值以及可以对这些值进行的操作。我们程序中使用的显式值是字面量。例如，`11`、`30.22`、`‘pypi’`
    都是字面量。每个字面量都有一个与之关联的类型。例如，`11` 是 `int` 类型，`30.22` 是 `float` 类型，`‘pypi’` 是 `string`
    类型。通常，字面量的类型将决定可以对其进行的操作类型。下表包含 Python 中的基本数据类型。![](img/rsrc10M.jpg)![](img/rsrc10N.jpg)


