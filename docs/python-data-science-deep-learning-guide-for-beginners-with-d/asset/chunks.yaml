    在开始使用 Python 进行机器学习之前，你的计算机上必须安装 Python，不过，你可能不需要下载它。所以，首先要做的是通过在命令窗口中输入 `Python`
    来确认 Python 是否未安装。当你看到 Python 解释器的响应时，它将在其原始显示中包含一个版本号。一般来说，任何较新版本都可以工作，因为 Python
    试图保持向后兼容性。如果你想安装 Python，不妨搜索最新的稳定版本。该版本将具有最高版本号，且未标记为 alpha 或 beta 版本。如果你运行的是
    Windows 操作系统，最稳定的 Windows 下载可以在 Python for Windows 页面找到。如果你运行的是 Windows XP，你将在“Python
