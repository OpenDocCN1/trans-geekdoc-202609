    ## 语法


    Python 程序是借助文本编辑器编写的，并且必须具有 `.py` 扩展名。Python 程序的第一行和最后行不是必须的，但它可以将 Python 的位置作为第一行
    `#!/usr/bin/python` 并变得可执行。尽管如此，命令提示符是另一个环境，你可以通过输入 `python file.py` 来运行 Python
