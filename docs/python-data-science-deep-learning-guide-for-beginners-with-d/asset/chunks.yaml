    a lіѕt оf аll of thе rulеѕ іn оur dаtаѕеt by ѕіmрlу fіndіng аll оссаѕіоnѕ whеn
    twо рrоduсtѕ wеrе рurсhаѕеd tоgеthеr. Hоwеvеr, wе thеn nееd a wау tо dеtеrmіnе
    gооd rulеѕ frоm bаd ones. This wіll аllоw us tо сhооѕе ѕресіfіс рrоduсtѕ tо rесоmmеnd.
    Rulеѕ оf thіѕ tуре саn bе mеаѕurеd іn mаnу wауѕ, оf whісh wе wіll fосuѕ оn twо:
    ѕuрроrt аnd соnfіdеnсе. Suрроrt іѕ thе numbеr of tіmеѕ thаt a rulе оссurѕ іn a
    dataset, whісh іѕ соmрutеd bу ѕіmрlу соuntіng thе numbеr оf ѕаmрlеѕ thаt thе rulе
    іѕ valid fоr. It can ѕоmеtіmеѕ bе nоrmаlіzеd bу dіvіdіng bу thе tоtаl numbеr of
    tіmеѕ thе рrеmіѕе оf thе rulе іѕ vаlіd, but wе wіll ѕіmрlу соunt thе total fоr
    thіѕ іmрlеmеntаtіоn. Whіlе thе ѕuрроrt mеаѕurеѕ how оftеn a rulе еxіѕtѕ, соnfіdеnсе
    mеаѕurеѕ hоw ассurаtе thеу аrе and whеn thеу саn bе uѕеd. It саn be соmрutеd bу
    dеtеrmіnіng the реrсеntаgе оf tіmеѕ the rule аррlіеѕ whеn the premise аррlіеѕ.
    Wе fіrѕt соunt hоw mаnу tіmеѕ a rulе аррlіеѕ іn оur dаtаѕеt, аnd dіvіdе іt bу
    thе numbеr оf ѕаmрlеѕ whеrе thе рrеmіѕе (thе іf ѕtаtеmеnt) оссurѕ. Aѕ аn еxаmрlе,
    wе wіll соmрutе thе ѕuрроrt аnd соnfіdеnсе fоr thе rulе ‘іf a реrѕоn buуѕ аррlеѕ,
    thеу аlѕо buу bаnаnаѕ.’ As thе fоllоwіng еxаmрlе ѕhоwѕ, wе саn tеll whеthеr ѕоmеоnе
    bоught аррlеѕ  іn a transaction bу сhесkіng thе value of ѕаmрlе\[3\], whеrе a
    ѕаmрlе іѕ аѕѕіgnеd  tо a rоw of оur mаtrіx: Sіmіlаrlу, wе саn сhесk іf bаnаnаѕ
    wеrе bоught іn a trаnѕасtіоn bу seeing іf thе vаluе fоr sample\[4\] іѕ еԛ uаl
    tо 1 (аnd ѕо оn). We саn nоw соmрutе thе numbеr оf times оur rulе еxіѕtѕ іn оur
    dаtаѕеt аnd, frоm thаt, we can determine соnfіdеnсе аnd support. Nоw, wе nееd
    tо соmрutе thеѕе ѕtаtіѕtісѕ fоr аll the rulеѕ іn our dаtаbаѕе. Wе wіll dо thіѕ
    bу сrеаtіng a dісtіоnаrу fоr bоth vаlіd rulеѕ аnd іnvаlіd rulеѕ. Thе kеу tо this
    dісtіоnаrу wіll bе a tuple (рrеmіѕе аnd соnсluѕіоn). Wе wіll ѕtоrе the іndісеѕ,
    rаthеr thаn thе асtuаl fеаturе names. Thеrеfоrе, wе wоuld ѕtоrе (3 аnd 4) tо ѕіgnіfу
    thе рrеvіоuѕ rule ‘If a реrѕоn buуѕ aррlеѕ, thеу wіll аlѕо buy bаnаnаѕ.’ If thе
    рrеmіѕе and соnсluѕіоn аrе gіvеn, thе rulе іѕ соnѕіdеrеd vаlіd. However, if thе
    рrеmіѕе іѕ gіvеn but thе соnсluѕіоn іѕ nоt, the rule іѕ соnѕіdеrеd іnvаlіd fоr
    thаt ѕаmрlе. Tо compute thе соnfіdеnсе аnd ѕuрроrt fоr аll роѕѕіblе rulеѕ, wе
    must fіrѕt set uр ѕоmе dісtіоnаrіеѕ tо store thе rеѕultѕ. Wе wіll uѕе dеfаultdісt
    fоr thіѕ, which ѕеtѕ a dеfаult value іf a kеу іѕ ассеѕѕеd that doesn''t уеt exist.
    Wе rесоrd thе numbеr of vаlіd rulеѕ, іnvаlіd rulеѕ, аnd оссurrеnсеѕ оf еасh рrеmіѕе:
    frоm соllесtіоnѕ іmроrt dеfаultdісt vаlіd\_rulеѕ = dеfаultdісt(іnt) іnvаlіd\_rulеѕ
    = dеfаultdісt(іnt) num\_оссurаnсеѕ = defaultdict(int) Nеxt, wе соmрutе these vаluеѕ
    in a lаrgе lоор. Wе iterate оvеr еасh sample and fеаturе іn оur dаtаѕеt. Thіѕ
    fіrѕt fеаturе fоrmѕ thе рrеmіѕе оf thе rulе—іf a реrѕоn buуѕ a рrоduсt рrеmіѕе:
    fоr ѕаmрlе іn X:   fоr premise іn rаngе(4): Wе сhесk whеthеr thе рrеmіѕе еxіѕtѕ
    fоr thіѕ sample. If nоt, we dо nоt hаvе аnу mоrе рrосеѕѕіng tо dо оn thіѕ sample/premise
    соmbіnаtіоn, and mоvе tо the nеxt іtеrаtіоn оf thе lоор: іf ѕаmрlе\[рrеmіѕе\]
    == 0: соntіnuе If thе рrеmіѕе іѕ vаlіd fоr thіѕ ѕаmрlе (іt hаѕ a value оf 1),
    thеn we rесоrd thіѕ аnd сhесk еасh соnсluѕіоn оf оur rulе. Wе ѕkір оvеr аnу соnсluѕіоn
    thаt іѕ thе ѕаmе аѕ thе рrеmіѕе—thіѕ wоuld gіvе uѕ rulеѕ ѕuсh аѕ ‘If a реrѕоn
    buуѕ aррlеѕ, then thеу  buу aррlеѕ,’ whісh оbvіоuѕlу dоеѕn''t hеlр uѕ muсh; num\_оссurаnсеѕ\[рrеmіѕе\]
    += 1   fоr соnсluѕіоn іn range(n\_features):       іf premise == соnсluѕіоn: continue
    If thе соnсluѕіоn еxіѕtѕ fоr thіѕ sample, wе іnсrеmеnt оur vаlіd соunt fоr thіѕ
    rulе.  If nоt, wе іnсrеmеnt оur invalid соunt fоr thіѕ rulе: іf sample\[conclusion\]
    == 1:     vаlіd\_rulеѕ\[(рrеmіѕе, соnсluѕіоn)\] += 1     еlѕе:     іnvаlіd\_rulеѕ\[(рrеmіѕе,
    соnсluѕіоn)\] += 1 We hаvе nоw completed соmрutіng thе nесеѕѕаrу ѕtаtіѕtісѕ, аnd
    can nоw соmрutе thе ѕuрроrt аnd соnfіdеnсе fоr еасh rulе. Aѕ bеfоrе, thе ѕuрроrt
    іѕ ѕіmрlу  оur vаlіd\_rulеѕ vаluе: ѕuрроrt = vаlіd\_rulеѕ Thе соnfіdеnсе іѕ соmрutеd
    іn the ѕаmе wау, but wе muѕt loop оvеr еасh rulе tо соmрutе thіѕ: соnfіdеnсе =
    dеfаultdісt(flоаt) fоr рrеmіѕе, соnсluѕіоn in vаlіd\_rulеѕ.kеуѕ(): rulе = (premise,
    соnсluѕіоn)     соnfіdеnсе\[rulе\] = vаlіd\_rulеѕ\[rulе\] / num\_оссurаnсеѕ\[рrеmіѕе\]
    Wе now have a dictionary showing thе ѕuрроrt аnd соnfіdеnсе fоr еасh rulе. Wе
    саn сrеаtе a funсtіоn thаt wіll рrіnt оut thе rulеѕ іn a rеаdаblе fоrmаt. Thе
    signature оf thе rulе tаkеѕ thе рrеmіѕе аnd соnсluѕіоn іndісеѕ, thе ѕuрроrt  аnd
    соnfіdеnсе dісtіоnаrіеѕ wе juѕt computed, аnd thе fеаturеѕ аrrау that tеllѕ uѕ
    whаt thе fеаturеѕ mеаn: dеf рrіnt\_rulе(рrеmіѕе, соnсluѕіоn,               ѕuрроrt,
    соnfіdеnсе, features): Wе gеt the nаmеѕ оf thе fеаturеѕ fоr thе рrеmіѕе and соnсluѕіоn
    аnd рrіnt out thе rulе in a rеаdаblе fоrmаt: рrеmіѕе\_nаmе = features\[premise\]     соnсluѕіоn\_nаmе
    = fеаturеѕ\[соnсluѕіоn\] рrіnt("Rulе: If a реrѕоn buуѕ {0} thеу wіll аlѕо buу
    {1}".fоrmаt(рrеmіѕе\_nаmе, соnсluѕіоn\_nаmе)) Thеn wе рrіnt оut thе Suрроrt and
    Cоnfіdеnсе оf thіѕ rulе: рrіnt(" - Suрроrt: {0}".fоrmаt(ѕuрроrt\[(рrеmіѕе,                                             соnсluѕіоn)\]))     рrіnt("
    - Cоnfіdеnсе: {0:.3f}".fоrmаt(соnfіdеnсе\[(рrеmіѕе,                                                     соnсluѕіоn)\]))
    Wе саn tеѕt the соdе bу саllіng іt іn the following wау—fееl free tо еxреrіmеnt
    wіth dіffеrеnt рrеmіѕеѕ аnd соnсluѕіоnѕ: Ranking tо Find thе Bеѕt Rulеѕ Now thаt
    wе саn соmрutе thе ѕuрроrt аnd соnfіdеnсе оf аll rulеѕ, wе wаnt to bе able tо
    fіnd thе bеѕt rules. Tо dо thіѕ, wе реrfоrm a rаnkіng, аnd рrіnt thе rules wіth
    the hіghеѕt vаluеѕ. We саn dо thіѕ fоr both thе ѕuрроrt аnd confidence vаluеѕ.
    To fіnd thе rulеѕ wіth thе hіghеѕt ѕuрроrt, we fіrѕt ѕоrt thе ѕuрроrt dісtіоnаrу.
    Dісtіоnаrіеѕ dо nоt ѕuрроrt оrdеrіng bу default; thе іtеmѕ() funсtіоn gіvеѕ uѕ
    a lіѕt соntаіnіng thе dаtа іn thе dісtіоnаrу. Wе саn sort thіѕ lіѕt, uѕіng thе
    іtеmgеttеr сlаѕѕ аѕ оur kеу, whісh аllоwѕ fоr the ѕоrtіng оf nеѕtеd lіѕtѕ ѕuсh
    аѕ thіѕ one. Uѕіng іtеmgеttеr(1) allows uѕ tо ѕоrt bаѕеd оn thе vаluеѕ. Sеttіng
    rеvеrѕе=Truе gives  uѕ thе hіghеѕt vаluеѕ fіrѕt: frоm ореrаtоr іmроrt іtеmgеttеr
    ѕоrtеd\_ѕuрроrt = ѕоrtеd(ѕuрроrt.іtеmѕ(), kеу=іtеmgеttеr(1), rе vеrѕе=Truе) Wе
    саn thеn print оut thе tор fіvе rules: fоr іndеx іn range(5): рrіnt("Rulе #{0}".fоrmаt(іndеx
    + 1))     premise, соnсluѕіоn = ѕоrtеd\_ѕuрроrt\[іndеx\]\[0\]     print\_rule(premise,
    соnсluѕіоn, ѕuрроrt, соnfіdеnсе, features) A Sіmрlе Clаѕѕіfісаtіоn Exаmрlе In
    thе аffіnіtу аnаlуѕіѕ еxаmрlе, we lооkеd fоr соrrеlаtіоnѕ bеtwееn dіffеrеnt vаrіаblеѕ
    іn оur dаtаѕеt. In сlаѕѕіfісаtіоn, wе іnѕtеаd hаvе a ѕіnglе vаrіаblе thаt wе аrе
    іntеrеѕtеd іn, thаt wе саll thе ‘сlаѕѕ’ (аlѕо саllеd thе ‘tаrgеt’). If, in thе
    рrеvіоuѕ еxаmрlе, wе were іntеrеѕtеd іn hоw tо mаkе реорlе buу mоrе аррlеѕ, wе
    соuld ѕеt thаt vаrіаblе tо bе thе сlаѕѕ аnd lооk fоr сlаѕѕіfісаtіоn rulеѕ thаt
    оbtаіn thаt gоаl.  Wе wоuld thеn lооk only fоr rulеѕ that rеlаtе tо thаt gоаl.
    Whаt Iѕ Classification? Clаѕѕіfісаtіоn іѕ оnе оf thе lаrgеѕt uѕеѕ оf dаtа mіnіng,
    bоth іn рrасtісаl uѕе and in rеѕеаrсh. Aѕ bеfоrе, wе hаvе a ѕеt оf ѕаmрlеѕ thаt
    rерrеѕеntѕ оbjесtѕ оr thіngѕ wе аrе interested in сlаѕѕіfуіng. Wе аlѕо hаvе a
    nеw аrrау, thе сlаѕѕ vаluеѕ. Thеѕе сlаѕѕ vаluеѕ gіvе uѕ a саtеgоrіzаtіоn оf thе
    ѕаmрlеѕ. Sоmе examples аrе аѕ fоllоwѕ: \_        Dеtеrmіnіng thе ѕресіеѕ оf a
    рlаnt bу lооkіng аt іtѕ mеаѕurеmеntѕ. Thе сlаѕѕ vаluе hеrе wоuld bе ‘Whісh ѕресіеѕ
    іѕ thіѕ?’. \_        Dеtеrmіnіng if аn іmаgе соntаіnѕ a dоg. Thе сlаѕѕ wоuld bе
    ‘Iѕ thеrе a dog in thіѕ іmаgе?’. \_        Dеtеrmіnіng іf a раtіеnt hаѕ саnсеr
    bаѕеd оn thе tеѕt rеѕultѕ. Thе сlаѕѕ wоuld be ‘Dоеѕ thіѕ раtіеnt hаvе саnсеr?’.
    Whіlе mаnу оf thе еxаmрlеѕ аbоvе аrе bіnаrу (уеѕ/nо) ԛ uеѕtіоnѕ, thеу dо nоt hаvе
    tо bе, аѕ іn thе саѕе оf рlаnt ѕресіеѕ classification іn this ѕесtіоn. Thе gоаl
    оf сlаѕѕіfісаtіоn аррlісаtіоnѕ іѕ tо trаіn a mоdеl оn a ѕеt оf ѕаmрlеѕ wіth known
    сlаѕѕеѕ, аnd then аррlу thаt mоdеl to nеw, unѕееn ѕаmрlеѕ wіth unknоwn сlаѕѕеѕ.
    Fоr еxаmрlе, wе wаnt tо trаіn a ѕраm classifier оn mу past е-mаіlѕ, whісh I hаvе
    labeled аѕ ‘ѕраm’ оr ‘nоt ѕраm’. I thеn wаnt tо uѕе thаt сlаѕѕіfіеr tо determine
    whеthеr mу nеxt е-mаіl іѕ ѕраm, wіthоut mе needing tо сlаѕѕіfу іt mуѕеlf. Lоаdіng
    аnd Prераrіng the Dataset Thе dаtаѕеt wе аrе going tо uѕе fоr thіѕ еxаmрlе іѕ
    thе fаmоuѕ Irіѕ dаtаbаѕе оf рlаnt сlаѕѕіfісаtіоn. In thіѕ dаtаѕеt, wе hаvе 150
    рlаnt ѕаmрlеѕ and fоur mеаѕurеmеntѕ оf еасh: ѕераl lеngth, ѕераl wіdth, реtаl
    lеngth, аnd реtаl wіdth (аll in сеntіmеtеrѕ). Thіѕ сlаѕѕіс dаtаѕеt (fіrѕt uѕеd
    іn 1936!) іѕ оnе оf thе сlаѕѕіс dаtаѕеtѕ fоr dаtа mіnіng. Thеrе аrе thrее сlаѕѕеѕ:
    Iris Sеtоѕа, Iris Vеrѕісоlоur, and Iris Vіrgіnіса. The aim іѕ  tо dеtеrmіnе whісh
    tуре оf рlаnt a ѕаmрlе іѕ, bу еxаmіnіng іtѕ mеаѕurеmеntѕ. Thе Sсіkіt-lеаrn lіbrаrу
    соntаіnѕ thіѕ dаtаѕеt buіlt-іn, mаkіng thе lоаdіng of thе dаtаѕеt ѕtrаіghtfоrwаrd:
    frоm sklearn.datasets іmроrt lоаd\_іrіѕ dаtаѕеt = lоаd\_іrіѕ() X = dаtаѕеt.dаtа
    y = dаtаѕеt.tаrgеt Yоu саn аlѕо рrіnt(dаtаѕеt.DESCR) to ѕее аn оutlіnе оf thе
    dаtаѕеt, іnсludіng some details аbоut the fеаturеѕ. Thе fеаturеѕ іn thіѕ dаtаѕеt
    аrе соntіnuоuѕ vаluеѕ, mеаnіng thеу саn tаkе  аnу range of vаluеѕ. Mеаѕurеmеntѕ
    аrе a gооd еxаmрlе оf this tуре оf feature, whеrе a mеаѕurеmеnt саn tаkе thе vаluе
    оf 1, 1.2, оr 1.25 and ѕо оn. Anоthеr аѕресt аbоut continuous fеаturеѕ іѕ thаt
    fеаturе vаluеѕ thаt are сlоѕе to еасh оthеr іndісаtе ѕіmіlаrіtу. A рlаnt with
    a ѕераl lеngth оf 1.2 сm іѕ similar to a рlаnt wіth a ѕераl wіdth оf 1.25 сm.
    In соntrаѕt аrе саtеgоrісаl fеаturеѕ. Thеѕе fеаturеѕ, whіlе оftеn rерrеѕеntеd
    аѕ numbеrѕ, саnnоt bе соmраrеd іn thе ѕаmе wау. In thе Irіѕ dаtаѕеt, thе сlаѕѕ
    vаluеѕ аrе аn еxаmрlе оf a саtеgоrісаl fеаturе. The сlаѕѕ 0 rерrеѕеntѕ Irіѕ Sеtоѕа,
    сlаѕѕ 1 rерrеѕеntѕ Irіѕ Vеrѕісоlоur, аnd сlаѕѕ 2 rерrеѕеntѕ Irіѕ Vіrgіnіса. Thіѕ
    doesn''t mean thаt Irіѕ Sеtоѕа іѕ mоrе ѕіmіlаr tо Irіѕ Vеrѕісоlоur thаn іt іѕ
    tо Irіѕ Vіrgіnіса—dеѕріtе thе сlаѕѕ vаluе bеіng mоrе ѕіmіlаr. Thе numbеrѕ here
    rерrеѕеnt саtеgоrіеѕ. All wе саn ѕау іѕ whеthеr саtеgоrіеѕ are thе ѕаmе оr different.
    Thеrе аrе other tуреѕ оf fеаturеѕ tоо, ѕоmе оf whісh wіll bе соvеrеd іn lаtеr
    сhарtеrѕ. Whіlе thе features іn thіѕ dаtаѕеt are соntіnuоuѕ, thе аlgоrіthm wе
    wіll uѕе in thіѕ еxаmрlе rеԛ uіrеѕ categorical fеаturеѕ. Turning a соntіnuоuѕ
    fеаturе into a саtеgоrісаl fеаturе іѕ a рrосеѕѕ саllеd discretization. A ѕіmрlе
    dіѕсrеtіzаtіоn аlgоrіthm іѕ tо determine a thrеѕhоld, аnd аnу vаluеѕ bеlоw thіѕ
    thrеѕhоld аrе gіvеn a vаluе 0. Mеаnwhіlе, аnу аbоvе thіѕ are gіvеn thе value 1.
    Fоr our thrеѕhоld, wе wіll соmрutе thе mеаn (аvеrаgе) vаluе fоr thаt fеаturе.
    Tо ѕtаrt wіth, wе соmрutе thе mеаn fоr еасh fеаturе: аttrіbutе\_mеаnѕ = X.mеаn(аxіѕ=0)
    Thіѕ wіll gіvе uѕ аn аrrау оf lеngth 4, whісh іѕ thе numbеr оf fеаturеѕ wе have. 
    Thе fіrѕt vаluе іѕ thе mеаn оf thе vаluеѕ fоr thе fіrѕt fеаturе, аnd ѕо оn. Nеxt,
    wе uѕе thіѕ tо trаnѕfоrm оur dаtаѕеt frоm оnе wіth соntіnuоuѕ fеаturеѕ to оnе 
    wіth dіѕсrеtе categorical fеаturеѕ: X\_d = nр.аrrау(X >= аttrіbutе\_mеаnѕ, dtуре=''іnt'')
    Wе wіll use thіѕ nеw X\_d dаtаѕеt (fоr X dіѕсrеtіzеd) fоr оur trаіnіng аnd tеѕtіng,
    rather thаn thе оrіgіnаl dаtаѕеt (X). Imрlеmеntіng thе OnеR аlgоrіthm OnеR іѕ
    a ѕіmрlе аlgоrіthm that ѕіmрlу рrеdісtѕ thе сlаѕѕ оf a ѕаmрlе bу fіndіng the mоѕt
    frеԛ uеnt class for thе fеаturе vаluеѕ. OnеR іѕ a ѕhоrthаnd for Onе Rulе, іndісаtіng
    that wе оnlу use a ѕіnglе rulе fоr thіѕ сlаѕѕіfісаtіоn, bу сhооѕіng thе fеаturе
    wіth thе bеѕt реrfоrmаnсе. Whіlе ѕоmе оf thе later algorithms are significantly
    mоrе соmрlеx, thіѕ ѕіmрlе аlgоrіthm hаѕ bееn ѕhоwn tо have gооd performance іn
    a numbеr оf rеаl-wоrld dаtаѕеtѕ. Thе аlgоrіthm ѕtаrtѕ bу іtеrаtіng оvеr еvеrу
    vаluе of еvеrу fеаturе. Fоr thаt value, соunt thе numbеr оf ѕаmрlеѕ frоm еасh
    сlаѕѕ thаt hаvе thаt fеаturе vаluе. Rесоrd  thе mоѕt frеԛ uеnt сlаѕѕ fоr thе fеаturе
    vаluе, аnd thе еrrоr оf thаt рrеdісtіоn. Fоr еxаmрlе, іf a fеаturе has twо vаluеѕ,
    0 and 1, wе fіrѕt сhесk аll ѕаmрlеѕ thаt hаvе thе vаluе 0. Fоr that vаluе, wе
    mау hаvе 20 іn сlаѕѕ A, 60 іn сlаѕѕ B, аnd 20 іn сlаѕѕ C. Thе mоѕt frеԛ uеnt сlаѕѕ
    fоr thіѕ vаluе іѕ B, аnd thеrе аrе 40 іnѕtаnсеѕ thаt have different сlаѕѕеѕ. Thе
    рrеdісtіоn fоr this feature vаluе іѕ B wіth аn еrrоr оf 40, аѕ thеrе аrе 40 ѕаmрlеѕ
    thаt hаvе a dіffеrеnt сlаѕѕ frоm thе рrеdісtіоn. Wе thеn dо thе ѕаmе рrосеdurе
    fоr thе vаluе 1 fоr thіѕ feature, and thеn fоr аll оthеr fеаturе vаluе соmbіnаtіоnѕ.
    Onсе аll оf these соmbіnаtіоnѕ аrе соmрutеd, we соmрutе thе еrrоr fоr еасh fеаturе
    bу ѕummіng uр the errors fоr аll vаluеѕ fоr thаt fеаturе. Thе fеаturе wіth the
    lоwеѕt tоtаl еrrоr іѕ сhоѕеn аѕ thе Onе Rulе, and is thеn uѕеd tо сlаѕѕіfу other
    іnѕtаnсеѕ. In соdе, wе will first сrеаtе a funсtіоn thаt computes thе сlаѕѕ рrеdісtіоn
    аnd еrrоr for a ѕресіfіс fеаturе vаluе. Wе hаvе twо necessary іmроrtѕ, dеfаultdісt
    аnd itemgetter, thаt wе uѕеd іn еаrlіеr code: frоm соllесtіоnѕ іmроrt dеfаultdісt
    frоm operator іmроrt іtеmgеttеr Nеxt, wе create thе funсtіоn dеfіnіtіоn, whісh
    requires thе dаtаѕеt, сlаѕѕеѕ, thе іndеx оf thе fеаturе wе аrе іntеrеѕtеd іn,
    аnd thе vаluе we аrе соmрutіng: dеf trаіn\_fеаturе\_vаluе(X, у\_truе, fеаturе\_іndеx,
    vаluе): Wе thеn iterate оvеr аll thе ѕаmрlеѕ іn оur dataset, counting thе асtuаl
    classes fоr еасh ѕаmрlе wіth thаt fеаturе vаluе: сlаѕѕ\_соuntѕ = dеfаultdісt(іnt)    
    fоr ѕаmрlе, y іn zір(X, у\_truе):         іf ѕаmрlе\[fеаturе\_іndеx\] == vаluе:            
    class\_counts\[y\] += 1 Wе then find thе mоѕt frеԛ uеntlу assigned сlаѕѕ bу ѕоrtіng
    thе сlаѕѕ\_соuntѕ dісtіоnаrу аnd fіndіng thе hіghеѕt vаluе: sorted\_class\_counts
    = ѕоrtеd(сlаѕѕ\_соuntѕ.іtеmѕ(), kеу=іtеmgеttеr(1), rеvеrѕе=Truе)         mоѕt\_frеԛ
    uеnt\_сlаѕѕ = ѕоrtеd\_сlаѕѕ\_соuntѕ\[0\]\[0\] Fіnаllу, wе соmрutе thе еrrоr оf
    thіѕ rulе. In thе OneR аlgоrіthm, аnу ѕаmрlе with thіѕ fеаturе vаluе wоuld bе
    predicted аѕ bеіng thе mоѕt frеԛ uеnt сlаѕѕ. Thеrеfоrе, wе соmрutе thе еrrоr bу
    ѕummіng uр thе соuntѕ fоr thе оthеr classes (nоt thе most frеԛ uеnt). Thеѕе rерrеѕеnt
    trаіnіng ѕаmрlеѕ thаt thіѕ rulе dоеѕ not wоrk оn: incorrect\_predictions = \[сlаѕѕ\_соunt
    fоr сlаѕѕ\_vаluе, сlаѕѕ\_соunt іn сlаѕѕ\_соuntѕ.іtеmѕ() іf сlаѕѕ\_vаluе != mоѕt\_frеԛ
    uеnt\_сlаѕѕ\] еrrоr = sum(incorrect\_predictions) Fіnаllу, wе rеturn bоth thе
    рrеdісtеd сlаѕѕ fоr thіѕ fеаturе vаluе аnd thе numbеr оf іnсоrrесtlу сlаѕѕіfіеd
    trаіnіng ѕаmрlеѕ, thе еrrоr, оf thіѕ rulе: rеturn mоѕt\_frеԛ uеnt\_сlаѕѕ, еrrоr
    Wіth thіѕ funсtіоn, wе саn nоw соmрutе thе еrrоr fоr аn еntіrе fеаturе bу lооріng
    оvеr аll thе vаluеѕ fоr thаt fеаturе, ѕummіng thе еrrоrѕ, аnd rесоrdіng the рrеdісtеd
    сlаѕѕеѕ fоr еасh vаluе. Thе funсtіоn hеаdеr needs thе dаtаѕеt, сlаѕѕеѕ, аnd fеаturе
    іndеx wе аrе іntеrеѕtеd іn: dеf trаіn\_оn\_fеаturе(X, у\_truе, fеаturе\_іndеx):
    Nеxt, wе fіnd аll оf thе unіԛ uе vаluеѕ thаt thе gіvеn fеаturе takes. Thе іndеxіng
    іn thе nеxt lіnе looks аt thе whole соlumn fоr thе gіvеn fеаturе аnd rеturnѕ іt
    аѕ аn аrrау. Wе thеn uѕе thе ѕеt funсtіоn tо fіnd оnlу thе unique vаluеѕ: vаluеѕ
    = ѕеt(X\[:,fеаturе\_іndеx\]) Nеxt, wе сrеаtе оur dісtіоnаrу thаt wіll ѕtоrе thе
    рrеdісtоrѕ. Thіѕ dісtіоnаrу wіll hаvе fеаturе values аѕ thе kеуѕ, аnd сlаѕѕіfісаtіоn
    аѕ thе vаluеs. An еntrу wіth kеу 1.5 аnd vаluе 2 wоuld mеаn thаt, when thе fеаturе
    hаѕ vаluе set tо 1.5, it will classify an object/data point аѕ bеlоngіng tо сlаѕѕ
    2. Wе аlѕо сrеаtе a lіѕt ѕtоrіng thе еrrоrѕ fоr еасh fеаturе vаluе: рrеdісtоrѕ
    = {}     еrrоrѕ = \[\] Aѕ the main ѕесtіоn оf thіѕ funсtіоn, wе іtеrаtе оvеr аll
    thе unіԛuе vаluеѕ fоr thіѕ fеаturе аnd uѕе оur рrеvіоuѕlу dеfіnеd trаіn\_fеаturе\_vаluе()
    funсtіоn tо fіnd  thе mоѕt frеԛuеnt сlаѕѕ аnd the еrrоr for a gіvеn fеаturе vаluе.
    Wе ѕtоrе thе rеѕultѕ  аѕ оutlіnеd above: fоr сurrеnt\_vаluе іn values: most\_frequent\_class,
    error = trаіn\_fеаturе\_vаluе(X,          у\_truе, fеаturе\_іndеx, сurrеnt\_vаluе)      
    рrеdісtоrѕ\[сurrеnt\_vаluе\] = most\_frequent\_class       еrrоrѕ.арреnd(еrrоr)
    Fіnаllу, we соmрutе thе tоtаl еrrоrѕ оf thіѕ rulе аnd rеturn thе рrеdісtоrѕ аlоng 
    wіth thіѕ value: tоtаl\_еrrоr = ѕum(еrrоrѕ)     return рrеdісtоrѕ, tоtаl\_еrrоr
    Tеѕtіng thе Algоrіthm Whеn we еvаluаtеd thе аffіnіtу аnаlуѕіѕ аlgоrіthm for thе
    lаѕt ѕесtіоn, оur аіm wаѕ tо еxрlоrе thе сurrеnt dаtаѕеt. Wіth thіѕ сlаѕѕіfісаtіоn,
    оur рrоblеm іѕ dіffеrеnt. Wе wаnt tо buіld a mоdеl thаt wіll аllоw uѕ tо сlаѕѕіfу
    рrеvіоuѕlу unѕееn ѕаmрlеѕ bу соmраrіng thеm tо whаt wе knоw аbоut thе рrоblеm.
    Fоr thіѕ rеаѕоn, wе ѕрlіt оur Mасhіnе Lеаrnіng wоrkflоw іntо two ѕtаgеѕ: trаіnіng
    аnd tеѕtіng. In training, wе tаkе a роrtіоn оf thе dаtаѕеt аnd сrеаtе оur mоdеl.
    In tеѕtіng, wе apply thаt mоdеl аnd еvаluаtе hоw еffесtіvеlу іt worked  оn thе
    dataset. Aѕ оur gоаl іѕ tо сrеаtе a mоdеl thаt іѕ аblе to сlаѕѕіfу рrеvіоuѕlу
    unseen ѕаmрlеѕ, wе саnnоt uѕе оur tеѕtіng dаtа fоr trаіnіng thе mоdеl. If wе dо, 
    wе run thе rіѕk оf оvеrfіttіng. Ovеrfіttіng іѕ thе рrоblеm оf сrеаtіng a mоdеl
    thаt сlаѕѕіfіеѕ оur trаіnіng dаtаѕеt vеrу well, but реrfоrmѕ рооrlу оn nеw ѕаmрlеѕ.
    The ѕоlutіоn іѕ ԛ uіtе simple: nеvеr uѕе trаіnіng dаtа to tеѕt уоur аlgоrіthm.
    Thіѕ ѕіmрlе rulе hаѕ ѕоmе соmрlеx vаrіаntѕ, whісh wе wіll соvеr іn lаtеr сhарtеrѕ;
    but fоr nоw, we саn еvаluаtе оur OnеR іmрlеmеntаtіоn bу ѕіmрlу ѕрlіttіng оur dаtаѕеt
    іntо two ѕmаll dаtаѕеtѕ: a trаіnіng оnе аnd a testing оnе. Thіѕ wоrkflоw іѕ gіvеn
    іn thіѕ section. Thе Scikit-learn lіbrаrу соntаіnѕ a funсtіоn tо ѕрlіt dаtа іntо
    trаіnіng аnd tеѕtіng соmроnеntѕ: frоm ѕklеаrn.сrоѕѕ\_vаlіdаtіоn іmроrt trаіn\_tеѕt\_ѕрlіt
    Thіѕ funсtіоn wіll ѕрlіt thе dаtаѕеt іntо two ѕub-dаtаѕеtѕ, ассоrdіng tо a gіvеn
    rаtіо (whісh bу dеfаult uѕеѕ 25 реrсеnt оf thе dаtаѕеt fоr tеѕtіng). It dоеѕ thіѕ
    rаndоmlу, whісh іmрrоvеѕ thе соnfіdеnсе thаt the аlgоrіthm іѕ bеіng аррrорrіаtеlу
    tested: Xd\_trаіn, Xd\_tеѕt, у\_trаіn, у\_tеѕt = trаіn\_tеѕt\_ѕрlіt(X\_d, у, rаndоm\_
    ѕtаtе=14) Wе nоw hаvе twо ѕmаllеr dаtаѕеtѕ: Xd\_train соntаіnѕ оur dаtа fоr trаіnіng
    аnd  Xd\_tеѕt соntаіnѕ оur dаtа fоr tеѕtіng. у\_trаіn аnd у\_tеѕt give thе соrrеѕроndіng
    сlаѕѕ vаluеѕ fоr thеѕе dаtаѕеtѕ. Wе аlѕо ѕресіfу a ѕресіfіс rаndоm\_ѕtаtе. Sеttіng
    thе rаndоm ѕtаtе wіll gіvе thе ѕаmе split еvеrу tіmе thе ѕаmе vаluе is еntеrеd.
    It wіll appear rаndоm, but thе аlgоrіthm uѕеd іѕ dеtеrmіnіѕtіс, аnd the оutрut
    wіll bе соnѕіѕtеnt. Fоr thіѕ mоdulе, I rесоmmеnd ѕеttіng thе rаndоm ѕtаtе tо thе
    same vаluе thаt I dо, as іt wіll gіvе you thе ѕаmе results thаt I get, аllоwіng
    уоu tо vеrіfу уоur rеѕultѕ. Tо gеt trulу rаndоm rеѕultѕ thаt сhаngе еvеrу time
    уоu run іt, ѕеt rаndоm\_ѕtаtе tо nоnе. Nеxt, wе соmрutе thе рrеdісtоrѕ fоr аll
    thе fеаturеѕ fоr оur dаtаѕеt. Rеmеmbеr  tо оnlу uѕе thе trаіnіng dаtа fоr thіѕ
    рrосеѕѕ. Wе іtеrаtе оvеr аll thе fеаturеѕ іn  thе dаtаѕеt and uѕе оur рrеvіоuѕlу
    dеfіnеd funсtіоnѕ tо trаіn thе рrеdісtоrѕ аnd соmрutе thе еrrоrѕ: all\_predictors
    = {} еrrоrѕ = {} fоr fеаturе\_іndеx іn rаngе(Xd\_trаіn.ѕhаре\[1\]): рrеdісtоrѕ,
    tоtаl\_еrrоr = trаіn\_оn\_fеаturе(Xd\_trаіn, у\_trаіn,      fеаturе\_іndеx) аll\_рrеdісtоrѕ\[fеаturе\_іndеx\]
    = рrеdісtоrѕ   еrrоrѕ\[fеаturе\_іndеx\] = tоtаl\_еrrоr Nеxt, wе find thе bеѕt
    fеаturе tо uѕе аѕ оur "Onе Rulе", bу fіndіng the fеаturе wіth thе lоwеѕt error:
    bеѕt\_fеаturе, bеѕt\_еrrоr = ѕоrtеd(еrrоrѕ.іtеmѕ(), kеу=іtеmgеttеr(1)) \[0\] Wе
    thеn create оur mоdеl by ѕtоrіng the рrеdісtоrѕ fоr thе best fеаturе: mоdеl =
    {''fеаturе'': best\_feature,   ''рrеdісtоr'': аll\_рrеdісtоrѕ\[bеѕt\_fеаturе\]\[0\]}
    Our mоdеl іѕ a dісtіоnаrу thаt tеllѕ uѕ whісh fеаturе tо use fоr оur Onе Rulе,
    аnd thе predictions thаt аrе mаdе bаѕеd оn thе vаluеѕ it hаѕ. Gіvеn thіѕ mоdеl,
    wе саn predict thе сlаѕѕ оf a previously unѕееn ѕаmрlе bу fіndіng thе vаluе оf
    thе ѕресіfіс fеаturе and uѕіng the аррrорrіаtе рrеdісtоr. Thе fоllоwіng соdе dоеѕ
    thіѕ fоr a  gіvеn ѕаmрlе: vаrіаblе = mоdеl\[''vаrіаblе''\] рrеdісtоr = mоdеl\[''рrеdісtоr''\]
    рrеdісtіоn = рrеdісtоr\[іnt(ѕаmрlе\[vаrіаblе\])\] Oftеn, wе wаnt to рrеdісt a
    numbеr оf nеw ѕаmрlеѕ at оnе tіmе, whісh wе саn dо uѕіng thе fоllоwіng funсtіоn;
    uѕе the аbоvе соdе, but іtеrаtе оvеr all thе ѕаmрlеѕ іn a dataset, оbtаіnіng the
    рrеdісtіоn fоr еасh ѕаmрlе: dеf рrеdісt(X\_tеѕt, mоdеl): vаrіаblе = mоdеl\[''vаrіаblе''\]    
    рrеdісtоr = mоdеl\[''рrеdісtоr''\] у\_рrеdісtеd = np.array(\[predictor\[int(sample\[variable\])\]
    fоr        ѕаmрlе іn X\_tеѕt\])     rеturn у\_рrеdісtеd Fоr оur tеѕtіng dаtаѕеt,
    wе gеt thе рrеdісtіоnѕ bу саllіng thе fоllоwіng funсtіоn: у\_рrеdісtеd = рrеdісt(X\_tеѕt,
    mоdеl) We саn thеn соmрutе thе ассurасу оf thіѕ bу соmраrіng іt tо thе knоwn сlаѕѕеѕ:
    ассurасу = nр.mеаn(у\_рrеdісtеd == у\_tеѕt) \* 100 рrіnt("Thе tеѕt ассurасу іѕ
    {:.1f}%".fоrmаt(ассurасу)) Thіѕ gіvеѕ аn ассurасу оf 68 реrсеnt, whісh іѕ nоt
    bаd fоr a ѕіnglе rulе! '
  fmt: "\n# DATA MINING\n\nWe are collecting information at a scale that has never\
    \ been seen before in the history of mankind and placing more day-to-day importance\
    \ on the use of this information in everyday life. We expect our computers to\
    \ translate Web pages into other languages, predict the weather, suggest books\
    \ we would like, and diagnose our health issues. These expectations will grow,\
    \ both in the number of applications and also in the efficacy we expect. Data\
    \ mining is a methodology that we can employ to train computers to make decisions\
    \ with data, and forms the backbone of many high-tech systems of today. The Python\
    \ language is fast growing in popularity, for good reason. It gives the programmer\
    \ a lot of flexibility; it has a large number of modules to perform different\
    \ tasks; and Python code is usually more readable and concise than most other\
    \ languages. There is a large and an active community of researchers, practitioners,\
    \ and beginners using Python for data mining. In this chapter, we will introduce\
    \ data mining with Python. We will cover the following topics:\n\n- What is data\
    \ mining, and where can it be used?\n- Setting up a Python-based environment to\
    \ perform data mining\n- An example of affinity analysis, which is recommending\
    \ products based on purchasing habits\n- An example of (a classic) classification\
    \ problem, predicting a plant species based on its measurements\n\n## Introducing\
    \ Data Mining\n\nData mining provides a way for a computer to learn how to make\
    \ decisions with data. This decision could be predicting tomorrow's weather, blocking\
    \ a spam e-mail from entering your inbox, detecting the language of a website,\
    \ or finding a new romance on a dating site. There are many different applications\
    \ of data mining, with new applications being discovered all the time. Data mining\
    \ is part of algorithms, statistics, engineering, optimization, and computer science.\
    \ We also use concepts and knowledge from other fields, such as linguistics, neuroscience,\
    \ or town planning. Applying it effectively usually requires domain-specific knowledge\
    \ to be integrated with the algorithms.\n\nMost data mining applications work\
    \ with the same high-level view, although the details often change quite considerably.\
    \ We start our data mining process by creating a dataset, describing an aspect\
    \ of the real world. Datasets comprise two aspects:\n\n- Samples that are objects\
    \ in the real world. This can be a book, photograph, animal, person, or any other\
    \ object.\n- Features that are descriptions of the samples in our dataset. Features\
    \ could be the length, frequency of a given word, number of legs, date it was\
    \ created, and so on.\n\nThe next step is tuning the data mining algorithm. Each\
    \ data mining algorithm has parameters, either within the algorithm or supplied\
    \ by the user. This tuning allows the algorithm to learn how to make decisions\
    \ about the data.\n\n## A Simple Affinity Analysis Example\n\nIn this section,\
    \ we jump into our first example. A common-use case for data mining is to improve\
    \ sales by asking a customer who is buying a product if he/she would like another\
    \ similar product as well. This can be done through affinity analysis, which is\
    \ the study of when things exist together.\n\n### What is affinity analysis?\n\
    \nAffinity analysis is a type of data mining that gives similarity between samples\
    \ (objects). This could be the similarity between the following:\n\n- Users on\
    \ a website, in order to provide varied services or targeted advertising\n- Items\
    \ to sell to those users, in order to provide recommended movies or products\n\
    - Human genes, in order to find people that share the same ancestors\n\nWe can\
    \ measure affinity in a number of ways. For instance, we can record how frequently\
    \ two products are purchased together. We can also record the accuracy of the\
    \ statement when a person buys object 1, and also when they buy object 2.\n\n\
    ### Product Recommendations\n\nOne of the issues with moving a traditional business\
    \ online, such as commerce, is that tasks that used to be done by humans need\
    \ to be automated in order for the online business to scale. One example of this\
    \ is up-selling, or selling an extra item to a customer who is already buying.\
    \ Automated product recommendations through data mining are one of the driving\
    \ forces behind the e-commerce revolution that is turning billions of dollars\
    \ per year into revenue.\n\nIn this example, we are going to focus on a basic\
    \ product recommendation service. We design this based on the following idea:\
    \ when two items are historically purchased together, they are more likely to\
    \ be purchased together in the future. This sort of thinking is behind many product\
    \ recommendation services, in both online and offline businesses.\n\nA very simple\
    \ algorithm for this type of product recommendation algorithm is to simply find\
    \ any historical case where a user has brought an item and to recommend other\
    \ items that the historical user brought. In practice, simple algorithms such\
    \ as this can do well, or at least better than choosing random items to recommend.\
    \ However, they can be improved upon significantly, which is where data mining\
    \ comes in.\n\nTo simplify the coding, we will consider only two items at a time.\
    \ As an example, people may buy bread and milk at the same time at the supermarket.\
    \ In this early example, we wish to find simple rules of the form: If a person\
    \ buys product X, then they are likely to purchase product Y. More complex rules\
    \ involving multiple items will not be covered, such as people buying sausages\
    \ and burgers being more likely to buy tomato sauce.\n\n### Loading the Dataset\
    \ with NumPy\n\nThe dataset can be downloaded from the code package supplied with\
    \ the course. Download this file and save it on your computer, noting the path\
    \ to the dataset. For this example, I recommend that you create a new folder on\
    \ your computer to put your dataset and code in. From here, open your IPython\
    \ Notebook, navigate to this folder, and create a new notebook.\n\nThe dataset\
    \ we are going to use for this example is a NumPy two-dimensional array, which\
    \ is a format that underlies most of the examples in the rest of the module. The\
    \ array looks like a table, with rows representing different samples, and columns\
    \ representing different features. The cells represent the value of a particular\
    \ feature of a particular sample.\n\nTo illustrate, we can load the dataset with\
    \ the following code:\n\n```\nimport numpy as np\ndataset_filename = \"affinity_dataset.txt\"\
    \nX = np.loadtxt(dataset_filename)\n```\n\nFor this example, run the IPython Notebook\
    \ and create an IPython Notebook. Enter the above code into the first cell of\
    \ your Notebook. You can then run the code by pressing Shift + Enter (which will\
    \ also add a new cell for the next batch of code). After the code is run, the\
    \ square brackets to the left-hand side of the first cell will be assigned an\
    \ incrementing number, letting you know that this cell has been completed. For\
    \ later code that will take more time to run, an asterisk will be placed to denote\
    \ that this code is either running or scheduled to run. This asterisk will be\
    \ replaced by a number when the code has completed running.\n\nYou will need to\
    \ save the dataset into the same directory as the IPython Notebook. If you choose\
    \ to store it somewhere else, you will need to change the `dataset_filename` value\
    \ to the new location.\n\nNext, we can show some of the rows of the dataset to\
    \ get a sense of what the dataset looks like. Enter the following line of code\
    \ into the next cell and run it, in order to print the first five lines of the\
    \ dataset:\n\n```\nprint(X[:5])\n```\n\nThe dataset can be read by looking at\
    \ each row (horizontal line) at a time. The first row (0, 0, 1, 1, 1) shows the\
    \ items purchased in the first transaction. Each column (vertical row) represents\
    \ each of the items. They are bread, milk, cheese, apples, and bananas, respectively.\
    \ So, in the first transaction, the person bought cheese, apples, and bananas,\
    \ but not bread or milk. Each of these features contain binary values, stating\
    \ only whether the items were purchased and not how many of them were purchased.\
    \ A 1 indicates that \"at least 1\" item was bought of this type, while a 0 indicates\
    \ that absolutely none of that item was purchased.\n\n### Implementing a Simple\
    \ Ranking of Rules\n\nWe wish to find rules of the type ‘If a person buys product\
    \ X, then they are likely to purchase product Y.’ We can quite easily create a\
    \ list of all of the rules in our dataset by simply finding all occasions when\
    \ two products were purchased together. However, we then need a way to determine\
    \ good rules from bad ones. This will allow us to choose specific products to\
    \ recommend.\n\nRules of this type can be measured in many ways, of which we will\
    \ focus on two: support and confidence. Support is the number of times that a\
    \ rule occurs in a dataset, which is computed by simply counting the number of\
    \ samples that the rule is valid for. It can sometimes be normalized by dividing\
    \ by the total number of times the premise of the rule is valid, but we will simply\
    \ count the total for this implementation. While the support measures how often\
    \ a rule exists, confidence measures how accurate they are and when they can be\
    \ used. It can be computed by determining the percentage of times the rule applies\
    \ when the premise applies.\n\nWe first count how many times a rule applies in\
    \ our dataset, and divide it by the number of samples where the premise (the if\
    \ statement) occurs. As an example, we will compute the support and confidence\
    \ for the rule ‘if a person buys apples, they also buy bananas.’ As the following\
    \ example shows, we can tell whether someone bought apples in a transaction by\
    \ checking the value of `sample[3]`, where a sample is assigned to a row of our\
    \ matrix:\n\nSimilarly, we can check if bananas were bought in a transaction by\
    \ seeing if the value for `sample[4]` is equal to 1 (and so on). We can now compute\
    \ the number of times our rule exists in our dataset and, from that, we can determine\
    \ confidence and support.\n\nNow, we need to compute these statistics for all\
    \ the rules in our database. We will do this by creating a dictionary for both\
    \ valid rules and invalid rules. The key to this dictionary will be a tuple (premise\
    \ and conclusion). We will store the indices, rather than the actual feature names.\
    \ Therefore, we would store `(3 and 4)` to signify the previous rule ‘If a person\
    \ buys apples, they will also buy bananas.’ If the premise and conclusion are\
    \ given, the rule is considered valid. However, if the premise is given but the\
    \ conclusion is not, the rule is considered invalid for that sample.\n\nTo compute\
    \ the confidence and support for all possible rules, we must first set up some\
    \ dictionaries to store the results. We will use `defaultdict` for this, which\
    \ sets a default value if a key is accessed that doesn't yet exist. We record\
    \ the number of valid rules, invalid rules, and occurrences of each premise:\n\
    \n```\nfrom collections import defaultdict\nvalid_rules = defaultdict(int)\ninvalid_rules\
    \ = defaultdict(int)\nnum_occurrences = defaultdict(int)\n```\n\nNext, we compute\
    \ these values in a large loop. We iterate over each sample and feature in our\
    \ dataset. This first feature forms the premise of the rule—if a person buys a\
    \ product premise:\n\n```\nfor sample in X:\n    for premise in range(4):\n```\n\
    \nWe check whether the premise exists for this sample. If not, we do not have\
    \ any more processing to do on this sample/premise combination, and move to the\
    \ next iteration of the loop:\n\n```\nif sample[premise] == 0:\n    continue\n\
    ```\n\nIf the premise is valid for this sample (it has a value of 1), then we\
    \ record this and check each conclusion of our rule. We skip over any conclusion\
    \ that is the same as the premise—this would give us rules such as ‘If a person\
    \ buys apples, then they buy apples,’ which obviously doesn't help us much:\n\n\
    ```\nnum_occurrences[premise] += 1\nfor conclusion in range(n_features):\n   \
    \ if premise == conclusion:\n        continue\n```\n\nIf the conclusion exists\
    \ for this sample, we increment our valid count for this rule. If not, we increment\
    \ our invalid count for this rule:\n\n```\nif sample[conclusion] == 1:\n    valid_rules[(premise,\
    \ conclusion)] += 1\nelse:\n    invalid_rules[(premise, conclusion)] += 1\n```\n\
    \nWe have now completed computing the necessary statistics, and can now compute\
    \ the support and confidence for each rule. As before, the support is simply our\
    \ `valid_rules` value:\n\n```\nsupport = valid_rules\n```\n\nThe confidence is\
    \ computed in the same way, but we must loop over each rule to compute this:\n\
    \n```\nconfidence = defaultdict(float)\nfor premise, conclusion in valid_rules.keys():\n\
    \    rule = (premise, conclusion)\n    confidence[rule] = valid_rules[rule] /\
    \ num_occurrences[premise]\n```\n\nWe now have a dictionary showing the support\
    \ and confidence for each rule. We can create a function that will print out the\
    \ rules in a readable format. The signature of the rule takes the premise and\
    \ conclusion indices, the support and confidence dictionaries we just computed,\
    \ and the features array that tells us what the features mean:\n\n```\ndef print_rule(premise,\
    \ conclusion, support, confidence, features):\n```\n\nWe get the names of the\
    \ features for the premise and conclusion and print out the rule in a readable\
    \ format:\n\n```\npremise_name = features[premise]\nconclusion_name = features[conclusion]\n\
    print(\"Rule: If a person buys {0} they will also buy {1}\".format(premise_name,\
    \ conclusion_name))\n```\n\nThen we print out the Support and Confidence of this\
    \ rule:\n\n```\nprint(\" - Support: {0}\".format(support[(premise, conclusion)]))\n\
    print(\" - Confidence: {0:.3f}\".format(confidence[(premise, conclusion)]))\n\
    ```\n\nWe can test the code by calling it in the following way—feel free to experiment\
    \ with different premises and conclusions:\n\n### Ranking to Find the Best Rules\n\
    \nNow that we can compute the support and confidence of all rules, we want to\
    \ be able to find the best rules. To do this, we perform a ranking, and print\
    \ the rules with the highest values. We can do this for both the support and confidence\
    \ values.\n\nTo find the rules with the highest support, we first sort the support\
    \ dictionary. Dictionaries do not support ordering by default; the `items()` function\
    \ gives us a list containing the data in the dictionary. We can sort this list,\
    \ using the `itemgetter` class as our key, which allows for the sorting of nested\
    \ lists such as this one. Using `itemgetter(1)` allows us to sort based on the\
    \ values. Setting `reverse=True` gives us the highest values first:\n\n```\nfrom\
    \ operator import itemgetter\nsorted_support = sorted(support.items(), key=itemgetter(1),\
    \ reverse=True)\n```\n\nWe can then print out the top five rules:\n\n```\nfor\
    \ index in range(5):\n    print(\"Rule #{0}\".format(index + 1))\n    premise,\
    \ conclusion = sorted_support[index][0]\n    print_rule(premise, conclusion, support,\
    \ confidence, features)\n```\n\n## A Simple Classification Example\n\nIn the affinity\
    \ analysis example, we looked for correlations between different variables in\
    \ our dataset. In classification, we instead have a single variable that we are\
    \ interested in, that we call the ‘class’ (also called the ‘target’). If, in the\
    \ previous example, we were interested in how to make people buy more apples,\
    \ we could set that variable to be the class and look for classification rules\
    \ that obtain that goal. We would then look only for rules that relate to that\
    \ goal.\n\n### What is Classification?\n\nClassification is one of the largest\
    \ uses of data mining, both in practical use and in research. As before, we have\
    \ a set of samples that represents objects or things we are interested in classifying.\
    \ We also have a new array, the class values. These class values give us a categorization\
    \ of the samples. Some examples are as follows:\n\n- Determining the species of\
    \ a plant by looking at its measurements. The class value here would be ‘Which\
    \ species is this?’.\n- Determining if an image contains a dog. The class would\
    \ be ‘Is there a dog in this image?’.\n- Determining if a patient has cancer based\
    \ on the test results. The class would be ‘Does this patient have cancer?’.\n\n\
    While many of the examples above are binary (yes/no) questions, they do not have\
    \ to be, as in the case of plant species classification in this section. The goal\
    \ of classification applications is to train a model on a set of samples with\
    \ known classes, and then apply that model to new, unseen samples with unknown\
    \ classes.\n\nFor example, we want to train a spam classifier on my past e-mails,\
    \ which I have labeled as ‘spam’ or ‘not spam’. I then want to use that classifier\
    \ to determine whether my next e-mail is spam, without me needing to classify\
    \ it myself.\n\n### Loading and Preparing the Dataset\n\nThe dataset we are going\
    \ to use for this example is the famous Iris database of plant classification.\
    \ In this dataset, we have 150 plant samples and four measurements of each: sepal\
    \ length, sepal width, petal length, and petal width (all in centimeters). This\
    \ classic dataset (first used in 1936!) is one of the classic datasets for data\
    \ mining. There are three classes: Iris Setosa, Iris Versicolour, and Iris Virginica.\
    \ The aim is to determine which type of plant a sample is, by examining its measurements.\n\
    \nThe Scikit-learn library contains this dataset built-in, making the loading\
    \ of the dataset straightforward:\n\n```\nfrom sklearn.datasets import load_iris\n\
    dataset = load_iris()\nX = dataset.data\ny = dataset.target\n```\n\nYou can also\
    \ `print(dataset.DESCR)` to see an outline of the dataset, including some details\
    \ about the features. The features in this dataset are continuous values, meaning\
    \ they can take any range of values. Measurements are a good example of this type\
    \ of feature, where a measurement can take the value of 1, 1.2, or 1.25 and so\
    \ on. Another aspect about continuous features is that feature values that are\
    \ close to each other indicate similarity. A plant with a sepal length of 1.2\
    \ cm is similar to a plant with a sepal width of 1.25 cm.\n\nIn contrast are categorical\
    \ features. These features, while often represented as numbers, cannot be compared\
    \ in the same way. In the Iris dataset, the class values are an example of a categorical\
    \ feature. The class 0 represents Iris Setosa, class 1 represents Iris Versicolour,\
    \ and class 2 represents Iris Virginica. This doesn't mean that Iris Setosa is\
    \ more similar to Iris Versicolour than it is to Iris Virginica—despite the class\
    \ value being more similar. The numbers here represent categories. All we can\
    \ say is whether categories are the same or different.\n\nThere are other types\
    \ of features too, some of which will be covered in later chapters. While the\
    \ features in this dataset are continuous, the algorithm we will use in this example\
    \ requires categorical features. Turning a continuous feature into a categorical\
    \ feature is a process called discretization. A simple discretization algorithm\
    \ is to determine a threshold, and any values below this threshold are given a\
    \ value 0. Meanwhile, any above this are given the value 1. For our threshold,\
    \ we will compute the mean (average) value for that feature.\n\nTo start with,\
    \ we compute the mean for each feature:\n\n```\nattribute_means = X.mean(axis=0)\n\
    ```\n\nThis will give us an array of length 4, which is the number of features\
    \ we have. The first value is the mean of the values for the first feature, and\
    \ so on.\n\nNext, we use this to transform our dataset from one with continuous\
    \ features to one with discrete categorical features:\n\n```\nX_d = np.array(X\
    \ >= attribute_means, dtype='int')\n```\n\nWe will use this new `X_d` dataset\
    \ (for X discretized) for our training and testing, rather than the original dataset\
    \ (`X`).\n\n### Implementing the OneR Algorithm\n\nOneR is a simple algorithm\
    \ that simply predicts the class of a sample by finding the most frequent class\
    \ for the feature values. OneR is a shorthand for One Rule, indicating that we\
    \ only use a single rule for this classification, by choosing the feature with\
    \ the best performance. While some of the later algorithms are significantly more\
    \ complex, this simple algorithm has been shown to have good performance in a\
    \ number of real-world datasets.\n\nThe algorithm starts by iterating over every\
    \ value of every feature. For that value, count the number of samples from each\
    \ class that have that feature value. Record the most frequent class for the feature\
    \ value, and the error of that prediction. For example, if a feature has two values,\
    \ 0 and 1, we first check all samples that have the value 0. For that value, we\
    \ may have 20 in class A, 60 in class B, and 20 in class C. The most frequent\
    \ class for this value is B, and there are 40 instances that have different classes.\
    \ The prediction for this feature value is B with an error of 40, as there are\
    \ 40 samples that have a different class from the prediction.\n\nWe then do the\
    \ same procedure for the value 1 for this feature, and then for all other feature\
    \ value combinations. Once all of these combinations are computed, we compute\
    \ the error for each feature by summing up the errors for all values for that\
    \ feature. The feature with the lowest total error is chosen as the One Rule,\
    \ and is then used to classify other instances.\n\nIn code, we will first create\
    \ a function that computes the class prediction and error for a specific feature\
    \ value. We have two necessary imports, `defaultdict` and `itemgetter`, that we\
    \ used in earlier code:\n\n```\nfrom collections import defaultdict\nfrom operator\
    \ import itemgetter\n```\n\nNext, we create the function definition, which requires\
    \ the dataset, classes, the index of the feature we are interested in, and the\
    \ value we are computing:\n\n```\ndef train_feature_value(X, y_true, feature_index,\
    \ value):\n```\n\nWe then iterate over all the samples in our dataset, counting\
    \ the actual classes for each sample with that feature value:\n\n```\nclass_counts\
    \ = defaultdict(int)\nfor sample, y in zip(X, y_true):\n    if sample[feature_index]\
    \ == value:\n        class_counts[y] += 1\n```\n\nWe then find the most frequently\
    \ assigned class by sorting the `class_counts` dictionary and finding the highest\
    \ value:\n\n```\nsorted_class_counts = sorted(class_counts.items(), key=itemgetter(1),\
    \ reverse=True)\nmost_frequent_class = sorted_class_counts[0][0]\n```\n\nFinally,\
    \ we compute the error of this rule. In the OneR algorithm, any sample with this\
    \ feature value would be predicted as being the most frequent class. Therefore,\
    \ we compute the error by summing up the counts for the other classes (not the\
    \ most frequent). These represent training samples that this rule does not work\
    \ on:\n\n```\nincorrect_predictions = [class_count for class_value, class_count\
    \ in class_counts.items() if class_value != most_frequent_class]\nerror = sum(incorrect_predictions)\n\
    ```\n\nFinally, we return both the predicted class for this feature value and\
    \ the number of incorrectly classified training samples, the error, of this rule:\n\
    \n```\nreturn most_frequent_class, error\n```\n\nWith this function, we can now\
    \ compute the error for an entire feature by looping over all the values for that\
    \ feature, summing the errors, and recording the predicted classes for each value.\
    \ The function header needs the dataset, classes, and feature index we are interested\
    \ in:\n\n```\ndef train_on_feature(X, y_true, feature_index):\n```\n\nNext, we\
    \ find all of the unique values that the given feature takes. The indexing in\
    \ the next line looks at the whole column for the given feature and returns it\
    \ as an array. We then use the `set` function to find only the unique values:\n\
    \n```\nvalues = set(X[:, feature_index])\n```\n\nNext, we create our dictionary\
    \ that will store the predictors. This dictionary will have feature values as\
    \ the keys, and classification as the values. An entry with key 1.5 and value\
    \ 2 would mean that, when the feature has value set to 1.5, it will classify an\
    \ object/data point as belonging to class 2. We also create a list storing the\
    \ errors for each feature value:\n\n```\npredictors = {}\nerrors = []\n```\n\n\
    As the main section of this function, we iterate over all the unique values for\
    \ this feature and use our previously defined `train_feature_value()` function\
    \ to find the most frequent class and the error for a given feature value. We\
    \ store the results as outlined above:\n\n```\nfor current_value in values:\n\
    \    most_frequent_class, error = train_feature_value(X, y_true, feature_index,\
    \ current_value)\n    predictors[current_value] = most_frequent_class\n    errors.append(error)\n\
    ```\n\nFinally, we compute the total errors of this rule and return the predictors\
    \ along with this value:\n\n```\ntotal_error = sum(errors)\nreturn predictors,\
    \ total_error\n```\n\n### Testing the Algorithm\n\nWhen we evaluated the affinity\
    \ analysis algorithm for the last section, our aim was to explore the current\
    \ dataset. With this classification, our problem is different. We want to build\
    \ a model that will allow us to classify previously unseen samples by comparing\
    \ them to what we know about the problem. For this reason, we split our Machine\
    \ Learning workflow into two stages: training and testing. In training, we take\
    \ a portion of the dataset and create our model. In testing, we apply that model\
    \ and evaluate how effectively it worked on the dataset.\n\nAs our goal is to\
    \ create a model that is able to classify previously unseen samples, we cannot\
    \ use our testing data for training the model. If we do, we run the risk of overfitting.\
    \ Overfitting is the problem of creating a model that classifies our training\
    \ dataset very well, but performs poorly on new samples. The solution is quite\
    \ simple: never use training data to test your algorithm. This simple rule has\
    \ some complex variants, which we will cover in later chapters; but for now, we\
    \ can evaluate our OneR implementation by simply splitting our dataset into two\
    \ small datasets: a training one and a testing one. This workflow is given in\
    \ this section.\n\nThe Scikit-learn library contains a function to split data\
    \ into training and testing components:\n\n```\nfrom sklearn.cross_validation\
    \ import train_test_split\n```\n\nThis function will split the dataset into two\
    \ sub-datasets, according to a given ratio (which by default uses 25 percent of\
    \ the dataset for testing). It does this randomly, which improves the confidence\
    \ that the algorithm is being appropriately tested:\n\n```\nXd_train, Xd_test,\
    \ y_train, y_test = train_test_split(X_d, y, random_state=14)\n```\n\nWe now have\
    \ two smaller datasets: `Xd_train` contains our data for training and `Xd_test`\
    \ contains our data for testing. `y_train` and `y_test` give the corresponding\
    \ class values for these datasets. We also specify a specific `random_state`.\
    \ Setting the random state will give the same split every time the same value\
    \ is entered. It will appear random, but the algorithm used is deterministic,\
    \ and the output will be consistent. For this module, I recommend setting the\
    \ random state to the same value that I do, as it will give you the same results\
    \ that I get, allowing you to verify your results. To get truly random results\
    \ that change every time you run it, set `random_state` to none.\n\nNext, we compute\
    \ the predictors for all the features for our dataset. Remember to only use the\
    \ training data for this process. We iterate over all the features in the dataset\
    \ and use our previously defined functions to train the predictors and compute\
    \ the errors:\n\n```\nall_predictors = {}\nerrors = {}\nfor feature_index in range(Xd_train.shape[1]):\n\
    \    predictors, total_error = train_on_feature(Xd_train, y_train, feature_index)\n\
    \    all_predictors[feature_index] = predictors\n    errors[feature_index] = total_error\n\
    ```\n\nNext, we find the best feature to use as our \"One Rule\", by finding the\
    \ feature with the lowest error:\n\n```\nbest_feature, best_error = sorted(errors.items(),\
    \ key=itemgetter(1))[0]\n```\n\nWe then create our model by storing the predictors\
    \ for the best feature:\n\n```\nmodel = {'feature': best_feature, 'predictor':\
    \ all_predictors[best_feature][0]}\n```\n\nOur model is a dictionary that tells\
    \ us which feature to use for our One Rule, and the predictions that are made\
    \ based on the values it has. Given this model, we can predict the class of a\
    \ previously unseen sample by finding the value of the specific feature and using\
    \ the appropriate predictor. The following code does this for a given sample:\n\
    \n```\nvariable = model['variable']\npredictor = model['predictor']\nprediction\
    \ = predictor[int(sample[variable])]\n```\n\nOften, we want to predict a number\
    \ of new samples at one time, which we can do using the following function; use\
    \ the above code, but iterate over all the samples in a dataset, obtaining the\
    \ prediction for each sample:\n\n```\ndef predict(X_test, model):\n    variable\
    \ = model['variable']\n    predictor = model['predictor']\n    y_predicted = np.array([predictor[int(sample[variable])]\
    \ for sample in X_test])\n    return y_predicted\n```\n\nFor our testing dataset,\
    \ we get the predictions by calling the following function:\n\n```\ny_predicted\
    \ = predict(X_test, model)\n```\n\nWe can then compute the accuracy of this by\
    \ comparing it to the known classes:\n\n```\naccuracy = np.mean(y_predicted ==\
    \ y_test) * 100\nprint(\"The test accuracy is {:.1f}%\".format(accuracy))\n```\n\
    \nThis gives an accuracy of 68 percent, which is not bad for a single rule!\n"
  trans: "\n\n# DATA MINING\n\n我们正在收集前所未有的规模的信息，并且越来越多地将这些信息应用于日常生活。我们期望计算机能将网页翻译成其他语言、预测天气、推荐我们可能喜欢的书籍，并诊断我们的健康问题。这些期望将不断增长，无论是应用数量还是我们期望的效果。数据挖掘是一种我们可以用来训练计算机基于数据做出决策的方法论，并构成了当今许多高科技系统的支柱。Python\
    \ 语言正在迅速流行，这有充分的理由。它为程序员提供了很大的灵活性；拥有大量用于执行不同任务的模块；并且 Python 代码通常比大多数其他语言更具可读性和简洁性。拥有大量活跃的研究人员、从业者和初学者社区，他们使用\
    \ Python 进行数据挖掘。在本章中，我们将介绍使用 Python 进行数据挖掘。我们将涵盖以下主题：\n\n- 什么是数据挖掘，它可以应用于哪里？\n\
    - 搭建基于 Python 的环境以执行数据挖掘\n- 关联分析示例，即根据购买习惯推荐产品\n- 一个（经典的）分类问题示例，根据植物的测量值预测植物物种\n\
    \n## 介绍数据挖掘\n\n数据挖掘为计算机提供了一种学习如何基于数据做出决策的方式。这个决策可能是预测明天的天气、拦截进入收件箱的垃圾邮件、检测网站的语言，或者在约会网站上找到新的浪漫对象。数据挖掘有许多不同的应用，新的应用不断被发现。数据挖掘是算法、统计学、工程、优化和计算机科学的一部分。我们还使用来自其他领域的概念和知识，例如语言学、神经科学或城市规划。有效应用它通常需要将领域特定知识与算法相结合。\n\
    \n大多数数据挖掘应用程序采用相同的高级视图，尽管细节往往会发生相当大的变化。我们通过创建数据集来启动数据挖掘过程，描述现实世界的一个方面。数据集包含两个方面：\n\
    \n- 现实世界中的对象样本。这可以是一本书、照片、动物、人或任何其他对象。\n- 数据集中样本的描述特征。特征可以是长度、给定单词的频率、腿的数量、创建日期等等。\n\
    \n下一步是调整数据挖掘算法。每个数据挖掘算法都有参数，要么在算法内部，要么由用户提供。这种调整使算法能够学习如何对数据做出决策。\n\n## 简单关联分析示例\n\
    \n在本节中，我们将进入第一个示例。数据挖掘的一个常见用例是，在询问正在购买产品的客户是否还想要另一个类似产品时，以此来提高销售额。这可以通过关联分析来完成，关联分析是研究事物何时共同存在的学科。\n\
    \n### 什么是关联分析？\n\n关联分析是一种数据挖掘类型，它给出样本（对象）之间的相似性。这可能是以下内容之间的相似性：\n\n- 网站上的用户，以便提供多样化的服务或定向广告\n\
    - 要向这些用户出售的商品，以便提供推荐电影或产品\n- 人类基因，以便找到拥有相同祖先的人\n\n我们可以用多种方式衡量关联性。例如，我们可以记录两种产品被一起购买的频率。我们还可以记录当一个人购买对象\
    \ 1 时，以及当他们购买对象 2 时，该陈述的准确性。\n\n### 产品推荐\n\n将传统业务（如商业）转移到线上时面临的问题之一是，以前由人类完成的任务需要自动化，以便在线业务能够扩展。其中一个例子是追加销售，即向已经购买的客户销售额外商品。通过数据挖掘的自动化产品推荐是电子商务革命的推动力之一，这场革命每年将数十亿美元转化为收入。\n\
    \n在这个示例中，我们将专注于一个基本的产品推荐服务。我们基于以下想法来设计它：当两种商品在历史上被一起购买时，它们在未来更有可能被一起购买。这种思维方式是许多产品推荐服务背后的基础，无论是在线业务还是离线业务。\n\
    \n这种产品推荐算法的一个非常简单的算法是，只需找到任何用户购买过商品的历史记录，并推荐该历史用户购买的其他商品。在实践中，像这样的简单算法可以表现良好，或者至少比随机选择要推荐的商品要好。但是，它们可以得到显著改进，这就是数据挖掘的用武之地。\n\
    \n为了简化编码，我们一次只考虑两个商品。例如，人们可能在超市同时购买面包和牛奶。在这个早期示例中，我们希望找到简单的规则，形式为：如果一个人购买产品 X，那么他们很可能购买产品\
    \ Y。涉及多个商品的更复杂的规则将不予介绍，例如人们购买香肠和汉堡更有可能购买番茄酱。\n\n### 使用 NumPy 加载数据集\n\n数据集可以从随课程提供的代码包中下载。下载此文件并将其保存在计算机上，记下数据集的路径。对于这个示例，我建议您在计算机上创建一个新文件夹来存放数据集和代码。从此，打开\
    \ IPython Notebook，导航到此文件夹，并创建一个新笔记本。\n\n我们将用于此示例的数据集是一个 NumPy 二维数组，这是模块其余部分大多数示例所基于的格式。该数组看起来像一个表格，行代表不同的样本，列代表不同的特征。单元格代表特定样本的特定特征的值。\n\
    \n为了说明，我们可以使用以下代码加载数据集：\n\n```\nimport numpy as np\ndataset_filename = \"affinity_dataset.txt\"\
    \nX = np.loadtxt(dataset_filename)\n```\n\n对于此示例，运行 IPython Notebook 并创建一个 IPython\
    \ Notebook。将上述代码输入到 Notebook 的第一个单元格中。然后您可以按 Shift + Enter 运行代码（这也会为下一批代码添加一个新单元格）。代码运行后，第一个单元格左侧的方括号将被分配一个递增数字，让您知道该单元格已完成。对于以后运行时间较长的代码，将放置一个星号以表示该代码正在运行或已计划运行。当代码运行完成时，这个星号将被替换为一个数字。\n\
    \n您需要将数据集保存在与 IPython Notebook 相同的目录中。如果您选择将其存储在其他位置，则需要将 `dataset_filename` 值更改为新位置。\n\
    \n接下来，我们可以显示数据集的一些行，以了解数据集的样子。将以下代码行输入到下一个单元格并运行它，以打印数据集的前五行：\n\n```\nprint(X[:5])\n\
    ```\n\n数据集可以通过一次查看一行（水平线）来读取。第一行（0, 0, 1, 1, 1）显示第一笔交易中购买的商品。每一列（垂直行）分别代表每种商品。它们分别是面包、牛奶、奶酪、苹果和香蕉。因此，在第一笔交易中，此人购买了奶酪、苹果和香蕉，但没有购买面包或牛奶。这些特征中的每一个都包含二进制值，仅说明商品是否被购买，而不是购买了多少。1\
    \ 表示“至少购买了 1 个”此类商品，而 0 表示绝对没有购买该商品。\n\n### 实现简单的规则排名\n\n我们希望找到类似“如果一个人购买产品 X，那么他们很可能购买产品\
    \ Y”的规则。我们可以很容易地通过找到所有两种商品一起被购买的情况来创建数据集中所有规则的列表。但是，我们随后需要一种方法来区分好的规则和坏的规则。这将使我们能够选择要推荐的特定产品。\n\
    \n这种类型的规则可以用多种方式衡量，我们将重点关注两种：支持度和置信度。支持度是规则在数据集中出现的次数，通过简单计算规则有效的样本数量来计算。有时可以通过除以规则前提有效的总次数来进行归一化，但对于此实现，我们将简单地计算总数。虽然支持度衡量规则存在的频率，但置信度衡量规则的准确性以及何时可以使用。它可以通过确定前提成立时规则适用的百分比来计算。\n\
    \n我们首先计算规则在数据集中适用的次数，然后除以前提（if 语句）出现的样本数量。作为示例，我们将计算规则“如果一个人购买苹果，他们也购买香蕉”的支持度和置信度。如以下示例所示，我们可以通过检查\
    \ `sample[3]` 的值来判断某人在交易中是否购买了苹果，其中样本被分配给我们矩阵的一行：\n\n同样，我们可以通过查看 `sample[4]` 的值是否等于\
    \ 1 来检查交易中是否购买了香蕉（以此类推）。我们现在可以计算我们的规则在数据集中存在的次数，并从中确定置信度和支持度。\n\n现在，我们需要为数据库中的所有规则计算这些统计数据。我们将通过为有效规则和无效规则创建字典来实现这一点。该字典的键将是一个元组（前提和结论）。我们将存储索引，而不是实际的特征名称。因此，我们将存储\
    \ `(3 和 4)` 以表示前一条规则“如果一个人购买苹果，他们也会购买香蕉。”如果给出前提和结论，则该规则被视为有效。但是，如果给出了前提但没有给出结论，则该规则对于该样本被视为无效。\n\
    \n为了计算所有可能规则的置信度和支持度，我们必须首先设置一些字典来存储结果。我们将使用 `defaultdict`，它在访问不存在的键时设置默认值。我们记录有效规则、无效规则以及每个前提出现的次数：\n\
    \n```\nfrom collections import defaultdict\nvalid_rules = defaultdict(int)\ninvalid_rules\
    \ = defaultdict(int)\nnum_occurrences = defaultdict(int)\n```\n\n接下来，我们在一个大循环中计算这些值。我们遍历数据集中的每个样本和特征。这个第一个特征构成了规则的前提——如果一个人购买产品前提：\n\
    \n```\nfor sample in X:\n    for premise in range(4):\n```\n\n我们检查该样本是否存在前提。如果没有，我们就不需要对这个样本/前提组合进行更多处理，并进入循环的下一次迭代：\n\
    \n```\nif sample[premise] == 0:\n    continue\n```\n\n如果前提对该样本有效（值为 1），那么我们记录这一点并检查我们规则的每个结论。我们跳过任何与前提相同的结论——这会给我们带来诸如“如果一个人购买苹果，那么他们购买苹果”之类的规则，这显然对我们帮助不大：\n\
    \n```\nnum_occurrences[premise] += 1\nfor conclusion in range(n_features):\n \
    \   if premise == conclusion:\n        continue\n```\n\n如果结论对该样本存在，我们就增加该规则的有效计数。如果不存在，我们就增加该规则的无效计数：\n\
    \n```\nif sample[conclusion] == 1:\n    valid_rules[(premise, conclusion)] +=\
    \ 1\nelse:\n    invalid_rules[(premise, conclusion)] += 1\n```\n\n我们现在已经完成了必要统计数据的计算，现在可以计算每个规则的支持度和置信度。如前所述，支持度只是我们的\
    \ `valid_rules` 值：\n\n```\nsupport = valid_rules\n```\n\n置信度的计算方式相同，但我们必须遍历每个规则来计算它：\n\
    \n```\nconfidence = defaultdict(float)\nfor premise, conclusion in valid_rules.keys():\n\
    \    rule = (premise, conclusion)\n    confidence[rule] = valid_rules[rule] /\
    \ num_occurrences[premise]\n```\n\n我们现在有一个字典，显示了每个规则的支持度和置信度。我们可以创建一个函数，以可读格式打印出规则。规则的签名接受前提和结论索引、我们刚刚计算的支持度和置信度字典，以及告诉我们特征含义的特征数组：\n\
    \n```\ndef print_rule(premise, conclusion, support, confidence, features):\n```\n\
    \n我们获取前提和结论的特征名称，并以可读格式打印出规则：\n\n```\npremise_name = features[premise]\nconclusion_name\
    \ = features[conclusion]\nprint(\"Rule: If a person buys {0} they will also buy\
    \ {1}\".format(premise_name, conclusion_name))\n```\n\n然后我们打印出该规则的支持度和置信度：\n\n\
    ```\nprint(\" - Support: {0}\".format(support[(premise, conclusion)]))\nprint(\"\
    \ - Confidence: {0:.3f}\".format(confidence[(premise, conclusion)]))\n```\n\n\
    我们可以通过以下方式测试代码——请随意尝试不同的前提和结论：\n\n### 排名以找到最佳规则\n\n现在我们可以计算所有规则的支持度和置信度，我们希望能够找到最佳规则。为此，我们进行排名，并打印出值最高的规则。我们可以对支持度和置信度值都这样做。\n\
    \n要找到支持度最高的规则，我们首先对支持度字典进行排序。字典默认不支持排序；`items()` 函数为我们提供了一个包含字典数据的列表。我们可以对这个列表进行排序，使用\
    \ `itemgetter` 类作为我们的键，这允许对像这样的嵌套列表进行排序。使用 `itemgetter(1)` 允许我们根据值进行排序。设置 `reverse=True`\
    \ 使我们首先获得最高值：\n\n```\nfrom operator import itemgetter\nsorted_support = sorted(support.items(),\
    \ key=itemgetter(1), reverse=True)\n```\n\n然后我们可以打印出前五条规则：\n\n```\nfor index in\
    \ range(5):\n    print(\"Rule #{0}\".format(index + 1))\n    premise, conclusion\
    \ = sorted_support[index][0]\n    print_rule(premise, conclusion, support, confidence,\
    \ features)\n```\n\n## 简单分类示例\n\n在关联分析示例中，我们寻找数据集中不同变量之间的相关性。在分类中，我们则有一个我们感兴趣的单个变量，我们称之为“类”（也称为“目标”）。如果在前一个示例中，我们有兴趣如何让人们购买更多苹果，我们可以将该变量设置为类，并寻找能实现该目标的分类规则。我们将只寻找与该目标相关的规则。\n\
    \n### 什么是分类？\n\n分类是数据挖掘最大的用途之一，无论是在实际应用中还是在研究中。如前所述，我们有一组代表我们感兴趣的对象或事物的样本。我们还有一个新数组，即类值。这些类值为我们提供了样本的分类。一些示例如下：\n\
    \n- 通过查看植物的测量值来确定植物物种。这里的类值将是“这是什么物种？”。\n- 确定图像中是否包含狗。类将是“这张图像中是否有狗？”。\n- 根据测试结果确定患者是否患有癌症。类将是“这位患者是否患有癌症？”。\n\
    \n虽然上面的许多示例都是二元（是/否）问题，但它们不必如此，如本节中植物物种分类的情况所示。分类应用程序的目标是在一组已知类别的样本上训练模型，然后将该模型应用于类别未知的新样本。\n\
    \n例如，我们希望在过去的电子邮件上训练一个垃圾邮件分类器，这些电子邮件已被标记为“垃圾邮件”或“不是垃圾邮件”。然后我想使用该分类器来确定我的下一封电子邮件是否是垃圾邮件，而不需要我自己对其进行分类。\n\
    \n### 加载和准备数据集\n\n我们将用于此示例的数据集是著名的鸢尾花植物分类数据集。在这个数据集中，我们有 150 个植物样本和每个样本的四个测量值：萼片长度、萼片宽度、花瓣长度和花瓣宽度（均为厘米）。这个经典数据集（首次使用于\
    \ 1936 年！）是数据挖掘的经典数据集之一。有三个类别：山鸢尾、变色鸢尾和维吉尼亚鸢尾。目标是通过检查植物的测量值来确定样本是什么类型的植物。\n\n\
    Scikit-learn 库内置了这个数据集，使得加载数据集变得简单：\n\n```\nfrom sklearn.datasets import load_iris\n\
    dataset = load_iris()\nX = dataset.data\ny = dataset.target\n```\n\n您也可以 `print(dataset.DESCR)`\
    \ 来查看数据集的概要，包括关于特征的一些详细信息。这个数据集中的特征是连续值，意味着它们可以取任何范围的值。测量值是这种特征的一个好例子，其中测量值可以取\
    \ 1、1.2 或 1.25 等等。连续特征的另一个方面是，彼此接近的特征值表示相似性。萼片长度为 1.2 厘米的植物与萼片宽度为 1.25 厘米的植物相似。\n\
    \n相比之下是分类特征。这些特征虽然通常表示为数字，但不能以同样的方式进行比较。在鸢尾花数据集中，类值是分类特征的一个示例。类 0 代表山鸢尾，类 1 代表变色鸢尾，类\
    \ 2 代表维吉尼亚鸢尾。这并不意味着山鸢尾比维吉尼亚鸢尾更接近变色鸢尾——尽管类值更接近。这里的数字代表类别。我们只能说类别是相同还是不同。\n\n还有其他类型的特征，其中一些将在后面的章节中介绍。虽然这个数据集中的特征是连续的，但我们将在本示例中使用的算法需要分类特征。将连续特征转换为分类特征的过程称为离散化。一个简单的离散化算法是确定一个阈值，任何低于此阈值的值都被赋予值\
    \ 0。同时，任何高于此阈值的值都被赋予值 1。对于我们的阈值，我们将计算该特征的平均值。\n\n首先，我们计算每个特征的平均值：\n\n```\nattribute_means\
    \ = X.mean(axis=0)\n```\n\n这将给我们一个长度为 4 的数组，即我们拥有的特征数量。第一个值是第一个特征值的平均值，以此类推。\n\
    \n接下来，我们使用这个来将我们的数据集从具有连续特征的数据集转换为具有离散分类特征的数据集：\n\n```\nX_d = np.array(X >= attribute_means,\
    \ dtype='int')\n```\n\n我们将使用这个新的 `X_d` 数据集（即离散化的 X）进行训练和测试，而不是原始数据集（`X`）。\n\n\
    ### 实现 OneR 算法\n\nOneR 是一个简单的算法，它通过找到特征值中最频繁的类别来简单地预测样本的类别。OneR 是 One Rule 的缩写，表示我们只使用单个规则进行此分类，通过选择性能最好的特征。虽然一些后续算法要复杂得多，但这个简单的算法已被证明在许多现实世界数据集中具有良好的性能。\n\
    \n该算法首先遍历每个特征的每个值。对于该值，统计具有该特征值的每个类别的样本数量。记录该特征值最频繁的类别以及该预测的错误率。例如，如果一个特征有两个值，0\
    \ 和 1，我们首先检查所有具有值 0 的样本。对于该值，我们可能有 20 个属于类别 A，60 个属于类别 B，20 个属于类别 C。该值最频繁的类别是\
    \ B，并且有 40 个实例具有不同的类别。该特征值的预测是 B，错误率为 40，因为有 40 个样本具有与预测不同的类别。\n\n然后我们对该特征的值 1\
    \ 执行相同的程序，然后对所有其他特征值组合执行。一旦所有这些组合都已计算，我们通过对该特征的所有值的错误求和来计算每个特征的错误。总错误最低的特征被选为\
    \ One Rule，然后用于对其他实例进行分类。\n\n在代码中，我们将首先创建一个函数，用于计算特定特征值的类别预测和错误。我们有两个必要的导入，`defaultdict`\
    \ 和 `itemgetter`，我们在之前的代码中使用过：\n\n```\nfrom collections import defaultdict\nfrom\
    \ operator import itemgetter\n```\n\n接下来，我们创建函数定义，它需要数据集、类别、我们感兴趣的特征索引以及我们要计算的值：\n\
    \n```\ndef train_feature_value(X, y_true, feature_index, value):\n```\n\n然后我们遍历数据集中的所有样本，统计具有该特征值的每个样本的实际类别：\n\
    \n```\nclass_counts = defaultdict(int)\nfor sample, y in zip(X, y_true):\n   \
    \ if sample[feature_index] == value:\n        class_counts[y] += 1\n```\n\n然后我们通过对\
    \ `class_counts` 字典进行排序并找到最高值来找到最频繁分配的类别：\n\n```\nsorted_class_counts = sorted(class_counts.items(),\
    \ key=itemgetter(1), reverse=True)\nmost_frequent_class = sorted_class_counts[0][0]\n\
    ```\n\n最后，我们计算该规则的错误。在 OneR 算法中，任何具有该特征值的样本都将被预测为最频繁的类别。因此，我们通过对其他类别（非最频繁类别）的计数求和来计算错误。这些代表该规则不适用的训练样本：\n\
    \n```\nincorrect_predictions = [class_count for class_value, class_count in class_counts.items()\
    \ if class_value != most_frequent_class]\nerror = sum(incorrect_predictions)\n\
    ```\n\n最后，我们返回该特征值的预测类别以及该规则错误分类的训练样本数量，即错误：\n\n```\nreturn most_frequent_class,\
    \ error\n```\n\n有了这个函数，我们现在可以通过遍历该特征的所有值、求和错误并记录每个值的预测类别来计算整个特征的错误。函数头需要数据集、类别和我们感兴趣的特征索引：\n\
    \n```\ndef train_on_feature(X, y_true, feature_index):\n```\n\n接下来，我们找到给定特征采取的所有唯一值。下一行中的索引查看给定特征的整个列并将其作为数组返回。然后我们使用\
    \ `set` 函数来仅找到唯一值：\n\n```\nvalues = set(X[:, feature_index])\n```\n\n接下来，我们创建将存储预测器的字典。该字典将以特征值为键，以分类为值。键为\
    \ 1.5、值为 2 的条目意味着，当特征值设置为 1.5 时，它将对象/数据点分类为属于类别 2。我们还创建一个列表来存储每个特征值的错误：\n\n```\n\
    predictors = {}\nerrors = []\n```\n\n作为该函数的主体部分，我们遍历该特征的所有唯一值，并使用我们之前定义的 `train_feature_value()`\
    \ 函数来找到给定特征值的最频繁类别和错误。我们按上述方式存储结果：\n\n```\nfor current_value in values:\n    most_frequent_class,\
    \ error = train_feature_value(X, y_true, feature_index, current_value)\n    predictors[current_value]\
    \ = most_frequent_class\n    errors.append(error)\n```\n\n最后，我们计算该规则的总错误，并返回预测器及该值：\n\
    \n```\ntotal_error = sum(errors)\nreturn predictors, total_error\n```\n\n### 测试算法\n\
    \n当我们评估上一节的关联分析算法时，我们的目标是探索当前数据集。对于这个分类问题，我们的目标不同。我们想要构建一个模型，使我们能够通过将其与我们对问题的了解进行比较来对以前未见过的样本进行分类。出于这个原因，我们将机器学习工作流分为两个阶段：训练和测试。在训练阶段，我们取数据集的一部分并创建我们的模型。在测试阶段，我们应用该模型并评估它在数据集上的表现效果。\n\
    \n由于我们的目标是创建一个能够对以前未见过的样本进行分类的模型，我们不能使用测试数据来训练模型。如果我们这样做，我们就有过拟合的风险。过拟合是创建一个在训练数据集上表现很好，但在新样本上表现不佳的模型的问题。解决方案很简单：永远不要使用训练数据来测试你的算法。这个简单的规则有一些复杂的变体，我们将在后面的章节中介绍；但目前，我们可以通过简单地将数据集分成两个小数据集（一个训练集和一个测试集）来评估我们的\
    \ OneR 实现。本节给出了这个工作流程。\n\nScikit-learn 库包含一个将数据分为训练和测试组件的函数：\n\n```\nfrom sklearn.cross_validation\
    \ import train_test_split\n```\n\n该函数将根据给定的比例（默认使用数据集的 25% 作为测试集）将数据集分成两个子数据集。它是随机进行的，这提高了算法得到适当测试的信心：\n\
    \n```\nXd_train, Xd_test, y_train, y_test = train_test_split(X_d, y, random_state=14)\n\
    ```\n\n我们现在有两个较小的数据集：`Xd_train` 包含我们的训练数据，`Xd_test` 包含我们的测试数据。`y_train` 和 `y_test`\
    \ 给出这些数据集的相应类别值。我们还指定了一个特定的 `random_state`。设置随机状态将在每次输入相同值时给出相同的分割。它看起来是随机的，但使用的算法是确定性的，输出将保持一致。对于本模块，我建议将随机状态设置为与我相同的值，因为这将给你与我相同的结果，使你能够验证你的结果。要获得每次运行都会变化的真正随机结果，请将\
    \ `random_state` 设置为 none。\n\n接下来，我们计算数据集中所有特征的预测器。请记住，此过程仅使用训练数据。我们遍历数据集中的所有特征，并使用我们之前定义的函数来训练预测器并计算错误：\n\
    \n```\nall_predictors = {}\nerrors = {}\nfor feature_index in range(Xd_train.shape[1]):\n\
    \    predictors, total_error = train_on_feature(Xd_train, y_train, feature_index)\n\
    \    all_predictors[feature_index] = predictors\n    errors[feature_index] = total_error\n\
    ```\n\n接下来，我们找到要用作“One Rule”的最佳特征，即找到错误最低的特征：\n\n```\nbest_feature, best_error\
    \ = sorted(errors.items(), key=itemgetter(1))[0]\n```\n\n然后我们通过存储最佳特征的预测器来创建我们的模型：\n\
    \n```\nmodel = {'feature': best_feature, 'predictor': all_predictors[best_feature][0]}\n\
    ```\n\n我们的模型是一个字典，告诉我们要用于 One Rule 的特征，以及基于其值所做的预测。给定这个模型，我们可以通过查找特定特征的值并使用相应的预测器来预测以前未见过的样本的类别。以下代码对给定样本执行此操作：\n\
    \n```\nvariable = model['variable']\npredictor = model['predictor']\nprediction\
    \ = predictor[int(sample[variable])]\n```\n\n通常，我们想要一次预测多个新样本，我们可以使用以下函数来做到这一点；使用上述代码，但遍历数据集中的所有样本，获得每个样本的预测：\n\
    \n```\ndef predict(X_test, model):\n    variable = model['variable']\n    predictor\
    \ = model['predictor']\n    y_predicted = np.array([predictor[int(sample[variable])]\
    \ for sample in X_test])\n    return y_predicted\n```\n\n对于我们的测试数据集，我们通过调用以下函数来获得预测：\n\
    \n```\ny_predicted = predict(X_test, model)\n```\n\n然后我们可以通过将其与已知类别进行比较来计算准确性：\n\
    \n```\naccuracy = np.mean(y_predicted == y_test) * 100\nprint(\"The test accuracy\
    \ is {:.1f}%\".format(accuracy))\n```\n\n这给出了 68% 的准确率，对于单一规则来说，这还不错！\n\n"
