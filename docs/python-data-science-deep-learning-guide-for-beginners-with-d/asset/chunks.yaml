    \ 129\n  - Python 的基本特性 137\n  - Python 的常见编程语言特性 139\n- Python 函数和文件处理 141\n\
    \  - 理解数据处理 141\n- 数据可视化 160\n- 数据挖掘 173\n- 结论 198\n\n---\n\n# 什么是数据科学？\n\n当世界进入大数据时代，对数据存储的需求也随之增长。直到\
    \ 2010 年，这一直是企业行业面临的主要挑战和关注点。主要重点是构建框架和解决方案来存储数据。\n\n现在，当 `Hadoop` 和其他框架已成功解决存储问题时，重点已转移到对这些数据的处理上。数据科学就是这里的秘诀。你在好莱坞科幻电影中看到的所有想法，实际上都可以通过数据科学变成现实。\n\
    \n数据科学是人工智能的未来。因此，了解什么是数据科学以及它如何为您的业务增加价值非常重要。\n\n在本章中，我们将涵盖以下主题。\n\n- 数据科学的必要性。\n\
