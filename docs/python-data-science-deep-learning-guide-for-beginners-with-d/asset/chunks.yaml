    的信息。如果你是任何语言的专家程序员，那么你会很快上手 Python。在开始使用 Python 之前，你需要知道如何在计算机上安装 Python。接下来，你需要知道一些关于语言语法的概念，以便能够阅读和理解
    Python 代码。本章将带你了解所有这些内容。所以，准备好学习 Python 语言中的一些重要事项吧。


    ## 安装


    如今，大多数 UNIX 和 Linux 发行版都预装了较新版本的 Python。即使是某些 HP 微软计算机也已经预装了 Python。


