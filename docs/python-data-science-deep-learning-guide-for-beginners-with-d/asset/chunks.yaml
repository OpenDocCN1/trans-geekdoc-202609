    # Data Science Lifecycle


    This was all about what is Data Science, now let’s understand the lifecycle of
    Data Science. A common mistake made in Data Science projects is rushing into data
    collection and analysis, without understanding the requirements or even framing
    the business problem properly. Therefore, it is very important for you to follow
    all the phases throughout the lifecycle of Data Science to ensure the smooth functioning
    of the project.


    ## Lifecycle of Data Science


    Here is a brief overview of the main phases of the Data Science Lifecycle:


    ![Lifecycle of Data Science - Edureka](rsrc109.jpg)


    ### Phase 1—Discovery


    Before you begin the project, it is important to understand the various specifications,
    requirements, priorities and required budget. You must possess the ability to
    ask the right questions. Here, you assess if you have the required resources present
    in terms of people, technology, time and data to support the project. In this
    phase, you also need to frame the business problem and formulate initial hypotheses
    (IH) to test.


    ### Phase 2—Data preparation


    In this phase, you require analytical sandbox in which you can perform analytics
    for the entire duration of the project. You need to explore, preprocess and condition
    data prior to modeling. Further, you will perform ETLT (extract, transform, load
    and transform) to get data into the sandbox. Let’s have a look at the Statistical
    Analysis flow below.


    ![](rsrc10A.jpg)


    You can use `R` for data cleaning, transformation, and visualization. This will
    help you to spot the outliers and establish a relationship between the variables.
    Once you have cleaned and prepared the data, it’s time to do exploratory analytics
    on it. Let’s see how you can achieve that.


    ### Phase 3—Model planning


    Here, you will determine the methods and techniques to draw the relationships
    between variables. These relationships will set the base for the algorithms which
    you will implement in the next phase. You will apply Exploratory Data Analytics
    (EDA) using various statistical formulas and visualization tools. Let’s have a
    look at various model planning tools.


    ![Model planning tools in Data Science - Edureka](rsrc10B.jpg)


    1. `R` has a complete set of modeling capabilities and provides a good environment
    for building interpretive models.


    2. SQL Analysis services can perform in-database analytics using common data mining
    functions and basic predictive models.


    3. `SAS/ACCESS` can be used to access data from `Hadoop` and is used for creating
    repeatable and reusable model flow diagrams.


    Although, many tools are present in the market but `R` is the most commonly used
    tool. Now that you have got insights into the nature of your data and have decided
    the algorithms to be used. In the next stage, you will apply the algorithm and
    build up a model.


    ### Phase 4—Model building


    In this phase, you will develop datasets for training and testing purposes. You
    will consider whether your existing tools will suffice for running the models
    or it will need a more robust environment (like fast and parallel processing).
    You will analyze various learning techniques like classification, association
    and clustering to build the model.


    You can achieve model building through the following tools.


    ![Model building tools in Data Science](rsrc10C.jpg)


    ### Phase 5—Operationalize


    In this phase, you deliver final reports, briefings, code and technical documents.
    In addition, sometimes a pilot project is also implemented in a real-time production
    environment. This will provide you a clear picture of the performance and other
    related constraints on a small scale before full deployment.


    ### Phase 6—Communicate results


    Now it is important to evaluate if you have been able to achieve your goal that
    you had planned in the first phase. So, in the last phase, you identify all the
    key findings, communicate to the stakeholders and determine if the results of
    the project are a success or a failure based on the criteria developed in Phase
    1.


    ## Case Study: Diabetes Prevention


    Now, I will take a case study to explain you the various phases described above.
    What if we could predict the occurrence of diabetes and take appropriate measures
    beforehand to prevent it?


    In this use case, we will predict the occurrence of diabetes making use of the
    entire lifecycle that we discussed earlier. Let’s go through the various steps.


    ### Step 1


    First, we will collect the data based on the medical history of the patient as
    discussed in Phase 1. You can refer to the sample data below.


    ![Data Science sample data - Edureka](rsrc10D.jpg)


    As you can see, we have the various attributes as mentioned below. Attributes:


    1. `npreg` – Number of times pregnant

    2. `glucose` – Plasma glucose concentration

    3. `bp` – Blood pressure

    4. `skin` – Triceps skinfold thickness

    5. `bmi` – Body mass index

    6. `ped` – Diabetes pedigree function

    7. `age` – Age

    8. `income` – Income


    ### Step 2


    Now, once we have the data, we need to clean and prepare the data for data analysis.
    This data has a lot of inconsistencies like missing values, blank columns, abrupt
    values and incorrect data format which need to be cleaned. Here, we have organized
    the data into a single table under different attributes – making it look more
    structured. Let’s have a look at the sample data below.


    ![Data Science inconsistent data - Edureka](rsrc10E.jpg)


    This data has a lot of inconsistencies.


    1. In the column `npreg`, “one” is written in words, whereas it should be in the
    numeric form like `1`.

    2. In column `bp` one of the values is `6600` which is impossible (at least for
    humans) as `bp` cannot go up to such huge value.

    3. As you can see the `Income` column is blank and also makes no sense in predicting
    diabetes. Therefore, it is redundant to have it here and should be removed from
    the table.

    '
