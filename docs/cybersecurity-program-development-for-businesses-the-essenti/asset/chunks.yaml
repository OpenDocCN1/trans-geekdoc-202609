- raw: 'Now, get ready for a dizzying assault of acronyms that you must memorize fully.
    There will be a quiz!


    When it comes to cybersecurity the main standards that apply are (alphabetically):


    1.  The European Telecommunications Standards Institute (ETSI) TR 103 family of
    standards


    2.  The IASME standards for small and medium‐sized enterprises (IASME stands for
    Information Assurance for Small and Medium‐sized Enterprises)


    3.  The Information Security Forum (ISF) Standard of Good Practice (SoGP)


    4.  The International Society for Automation (ISA) ISA62443 standards for industrial
    automation and control systems


    5.  The Internet Engineering Task Force (IETF) via their Request For Comments
    (RFC) 2196 memorandum


    6.  The Information Systems Audit and Control Association, now known only as ISACA,
    through their COBIT framework and Cybersecurity Nexus (CSX) resources


    7.  The Institute for Security and Open Methodologies (ISECOM) with their Open
    Source Security Testing Methodology Manual (OSSTMM) and the Open Source Cybersecurity
    Playbook


    8.  The ISO 27000 family of standards (ISO 27000–ISO27999)


    9.  The National Institute of Standards and Technology (NIST) Cybersecurity Framework
    (CSF)


    10.  The North American Electric Reliability Corporation (NERC), which via its
    Critical Infrastructure Protection (CIP) family of standards addresses electric
    systems and network security


    Believe it or not, even this list is far from complete, and I will bet you several
    copies of this book that there are at least half a dozen more international standards
    organizations that are going to send me nasty letters for my obvious and glaring
    omission herein for which I sincerely apologize.


    Now, please, don''t get me wrong. This whole book lives and dies on the work of
    the thousands of dedicated experts who''ve toiled in endless committee meetings
    and real‐life environments to produce this extensive body of knowledge. I cannot
    be clearer on this: Without their continuing and never‐ending dedication, skills,
    expertise, and hard work, we would all be in the dark, not even knowing where
    to start addressing cybersecurity. I am eternally grateful to their work and will
    acknowledge them in every opportunity I get. They are the true visionaries in
    cybersecurity, the ones we all learn from and are guided by, including the advice
    in this book.


    Why is all this important? Because meaningful advice must be grounded on solid
    research and hard science. Because no one person can possibly master a subject
    as deep and complex as cybersecurity, let alone information security. And because
    we must check our own interpretation of what''s right and filter our own opinions
    and experiences through the lens of proven, peer‐reviewed, work.


    This book draws from all these standards. It is my interpretation and translation
    of their advice into what I consider appropriate for the current business climate
    and threat landscape. My personal favorite, and most prominently influencing this
    book, is number 9 in my alphabetical list here: the NIST CSF. I feel that NIST,
    despite being U.S.‐based, has truly managed to incorporate a universal approach
    to their framework. They make this available to everyone for free on their website
    [https://www.nist.gov/cyberframework](https://www.nist.gov/cyberframework). Moreover,
    I believe that the NIST CSF is truly extensible, adaptable, and easily mapped
    with many governance frameworks, an excellent example of which is the ISACA COBIT
    to NIST mapping (a must‐read for all you framework buffs!).


    Acronyms aside, what do all these standards tell us about *ensuring and preserving
    confidentiality, integrity, and availability of digital information as well as
    the safety of people and environments?*


    Each standard has its own spin on this. My favorite, NIST CSF, does so by recommending
    five key functions: *identify, protect, detect, respond,* and *recover*. I trust
    you''ll immediately notice something missing? Think about it while we review the
    five functions:


    1.  The *identify* function is where you develop an understanding of what your
    risks are, what your assets are, and what your capabilities are.


    2.  *Protect* is your set of plans and actions that put in place the right controls
    (remember: controls do stuff) to protect the assets.


    3.  *Detect* is the set of plans and actions that you will use to identify, classify,
    etc., an attack against your assets.


    4.  *Respond* is the set of activities that you engage in response to an attack.


    5.  Finally, *recover* refers to whatever plans or protocols you have in place
    to bring things back to normal after an attack.


    Each one of these core functions needs to be looked at, and each one will be different
    from individual to individual and business to business. Believe it or not, experts
    agree a good cybersecurity program should have tremendous freedom and latitude
    in approach. You have to do what is right in your world without imposing some
    monolithic, one‐size‐fits‐all solution.


    Now, did you come up with what might be missing from the five functions: *identify,
    protect, detect, respond,* and *recover?*


    *Retaliate* or *revenge* might come to mind. It''s a thought. It''s also a highly
    illegal thought, so we''ll just leave it at that and move on!


    What about *prevent?* Isn''t that something you would hope is a function of a
    good cybersecurity program?


    It depends. First of all, there are those who would argue that prevention is a
    fool''s errand. How do you prevent a nation‐state from launching a cyberattack?
    How do you prevent a cybercriminal from targeting a financial institution, or
    you personally?


    In essence, how do you prevent crime? Okay, if *prevent* is unattainable, how
    about *deter?*


    These are questions that criminologists have studied for more than a hundred years.
    The answers are complex, vary by region and culture, and even by circumstance.
    How do we even begin to incorporate prevention or deterrence in the new cyber‐front?
    Perhaps it is best to focus on what we can do rather than waste time on prevention?


    I disagree with this view. I believe that there are meaningful steps that we can
    take to both prevent and deter cybercrime.


    In early 2017, I wrote an editorial titled “Clear and Present Danger.” It presented
    my thinking on prevention at the nation‐state level. You will find the complete
    editorial in the Appendix, but my recommendation essentially was:


    > *We need a concentrated effort in this new front for the survival of humanity.
    We need our leaders to be educated and alert to the danger this poses. We need
    our people to be sensitized to the danger of cyberattacks—think “duck and cover”
    for the cyber‐age. We need our allies to reinvigorate their frameworks for resolving
    conflicts peacefully to include cyberwarfare. A cyberattack to one country should
    be considered an attack to us all, with the commensurate and immediate response.
    And, we need our international organizations to recognize the danger of cyber‐actor
    proliferation and take immediate and decisive action.*


    My point with this editorial should be obvious: Just as alliances and treaties
    help prevent war, there should be new alliances and new treaties to prevent a
    cyberwar. And there absolutely are preventative steps we can take. Certainly,
    there are at the nation‐state level. But what about closer to home? Can we prevent
    or deter cyberattacks against businesses or individuals? I believe we can.


    ## Deter, Identify, Protect, Detect, Respond


    Certainly, the right legal and technical frameworks can deter cybercriminals from
    attempting an attack. They attack us because that''s where our money is. Make
    it hard enough to get at the money and some attacks can be deterred before they
    even occur.'
