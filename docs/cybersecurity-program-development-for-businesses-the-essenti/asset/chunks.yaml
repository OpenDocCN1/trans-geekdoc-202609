    # 致谢


    同样，我要感谢我自己的合伙人和同事，正是他们令人难以置信的专业知识、忠诚、奉献、技能、同理心和个人投入，才使得我们客户的成功成为可能。按字母顺序，他们是：Anna
    Murray、Atsushi Tatsuoka、Frank Murray、Greg Andrews、Haleigh Westwood、Jonathan Ongvano、Justin
    Schroeder、Leon Tchekmedyian、Pedro Garrett、Protus Miyogo、Sotos Antoniades、Steve
    Vance、Thomas Hussey、Yeimy Morel 和 Zachary Tereska。感谢你们日夜所做的一切，也感谢你们允许我关上门写作、写作、再写作！没有你们的帮助，这本书还停留在构思阶段。


    凡有书，必有编辑和出版商。我有幸拥有业界最优秀的编辑和出版商，是最幸运的作者。首先，我要向令人惊叹的 Hilary Poole 致以永恒的感谢，她是我的编辑、合著者，也是相识无数年、合作无数书的挚友。你简直太棒了。除非确信你会审阅成果，否则我拒绝走到键盘前。谢谢！


    感谢 John Wiley & Sons 公司的所有人员，这是世界上最专业、最卓越的出版商之一，特别感谢我的执行编辑 Sheck Cho，非凡的队长和指挥官；内容赋能与运营经理
    Judy Howarth；以及我的责任编辑 Christina Verigan。这本书属于你们，正如属于我一样，我对你们所有的帮助、指导和支持心存感激。


    致全球所有在一线、学术界、研究机构、政府机构和军队中不知疲倦工作的网络安全与治理专业人士，你们每天取得的成就令这本书相形见绌。没有你们在开拓新领域、拓展和深化科学认知、引领我们穿越网络安全这片动荡恐怖的水域方面所做的不懈努力，我们将迷失方向。你们的工作代表了指引我们航行的灯塔，如果我有什么追求，那就是希望这本书能帮助反射你们的光芒、诠释你们的指引、为你们的风帆增添动力。


    致那些帮助所有从业者学习、磨练和应用技艺，并开发我们赖以依赖的框架的众多国际组织，感谢你们持续的贡献、不知疲倦的策划和无尽的支持。我必须特别点出 (ISC)²、CERT、ENISA、ISACA、ISECOM、ISO、ISSA、OECD、OWASP
    和 SANS，对于遗漏全球其他众多值得表彰的组织，我深表歉意。特别感谢 ISACA 董事会主席 Dr. Christos K. Dimitriadis 和
    ISACA 首席执行官 Matt Loeb 的持续支持，以及 ISACA 纽约分会，让该分会成为我和纽约大都会区无数专业人士的“家外之家”。


    感谢本书的直接贡献者和支持者 Anna Murray、F. Charlene Watson、Frank Downs 和 Mark Thomas，谢谢你们允许我收录你们的专业见解并与读者分享。因你们的贡献，这本书变得更加丰富和实用。还有
    Mike Barlow，本书早期的支持者和倡导者，也是一位成就卓著的作家，感谢你的一切。你的指导、建议和支持对我意义重大。


    最后，再次感谢 Anna Murray，这个名字在致谢中反复出现，但在我看来，还远远不够！你是我认识的最聪慧、专业、能干、坚韧、刚毅、充满爱、包容和奉献的专业人士和作家！每天我都感谢我的幸运星将你带入我的生命，让你成为我的事业合伙人和生命伴侣。你是，并永远将是，黑夜中最亮的那颗星，指引我回家。谢谢。


    # 第 1 章：理解风险


    如果你在读这本书，我猜你可能也读过市面上一些危言耸听的网络安全书籍。这类书不少，其中不乏佳作（建议参阅参考书目）。此外，我肯定你早已看腻了各种统计数据。那些令人恐惧的统计数据显示网络犯罪日益猖獗。我也会列举一些，仅以满足你残存的窥探欲，但它们本质上毫无用处。等到这些页面油墨干透，数字早已变得更糟。


    ## 值得你付出多少代价？


    在迷蒙的过去，一个人的最贵重财产是他看得见的东西：他的城堡、黄金、挂毯，甚至他的继承人！它们的价值与其物理存在挂钩。


    如今，`value`（价值）的概念已超越有形资产，扩展至数据、知识产权和声誉等无形资产。事实上，许多无形资产的价值高于有形资产。试想，哪样更重要：一份手工披萨，还是这份手工披萨的
    `recipe`（配方）？工业革命之后的阶段被称为信息革命，绝非偶然。


    无形贵重物品的兴起影响着每一个个体以及各种规模的企业。个人和企业创造的这些贵重事物——像所有贵重事物一样——会被他人觊觎，因此理应受到你的保护。所以，就像你会保护贵重首饰一样，你必须保护贵重数据。这是一个简单的概念。


    这个类比有趣之处在于，它假设我们都共享对什么是 `of value`（有价值）的共同理解。你当然毫不费力地就能直觉认为一副钻石耳环很贵重，因此应妥善保管。放在哪里、保管有多严？这也很容易理解。我们拥有与生俱来的价值感来指导这些决策——某种东西告诉我们，价值
    300 美元的耳环放在公寓的首饰盒里很安全，而价值 30,000 美元的耳环最好存放在银行的保险箱里。易于理解，也易于做出价值判断。


    我们每天都在做这类判断，而且非常擅长。我们懂得什么有价值，也懂得这些价值面临的风险：


    *   耳环？防盗！

    *   房产？防火！


    结果证明，我们非常擅长在日常生活中做出复杂的风险管理决策。谁能想到呢？


    ## 风险！不仅仅是棋盘游戏


    设想这样一种情境：晚上 11 点，你刚和朋友在最爱的餐厅吃完晚饭。走向汽车时，你来到一个路口，发现过街信号灯是红灯。你向左看，向右看。你看到街道尽头有一辆车，耸耸肩，便穿过马路。没问题。


    现在，稍微改变一下场景。同样的故事，只是这次你推着装有宝宝的婴儿车。现在该怎么决定？是过马路，还是等信号灯变绿？我打赌你会选择等待。


    我们刚刚触及了 `risk acceptance`（风险接受）的概念，这在后续章节中将被证明至关重要。底线是，我们每一天都在与风险共存。我们不断做出关于风险的决策，评估完毕后，采取行动以表明我们接受这份风险。


    在刚才的例子中，一种情况下你接受了闯红灯过马路的风险，而带着宝宝时，你则不接受。这如何映射到网络世界？在某些情况下，我们接受信息在外部可用的风险（例如使用
    Facebook、Instagram、Swarm 等时），而在另一些情况下我们不接受（例如使用信用卡或透露病历时）。


