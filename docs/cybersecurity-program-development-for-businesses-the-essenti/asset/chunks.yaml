- raw: 'The business continuity plan is the plan that the business has prepared to
    ensure continuity of operations and value delivery in case of disruption. A business
    disruption could involve a natural disaster like a hurricane, an earthquake, or
    disease outbreak. Or it could a man‐made disaster like a terrorist attack or a
    cyberattack. It could even involve a simple human failing, like what happens when
    Julie from Accounting gets food poisoning from the cafeteria''s tacos.


    The business continuity (BC) plan has all sorts of useful information that feeds
    into the incident‐response plan. For example, it has a defined business continuity
    organizational structure, policies, and workflows, as well as information about
    who can trigger the BC plan and how that occurs, detailed contact information,
    including emergency contact numbers, client and vendor information, relocation
    strategies, recovery procedures, and the like. The benefit of the BC is that if
    and when it is invoked, different parts of the business execute different workflows
    designed to protect people, communicate effectively with all affected, and initiate
    as rapid a business recovery as possible.


    The disaster recovery plan (DR) is technology centric. Its focus is in recovering
    the technology infrastructure of the company. This is where you will find all
    our favorite acronyms and their values per system: recovery time objectives (RTO),
    recovery point objectives (RPO), and the maximum tolerable downtime (MTD). All
    directly influence the incident‐response plan.


    Consider, for example, if you have zero MTD. You''ll recall, we''ve been there
    before, but it''s worth repeating here: Who has such zero tolerance for downtime?
    Trading systems. Banking systems. Air traffic control systems. Utility systems.
    And, for some of us, Uncle Bob''s Bagel and Pastrami Paradise. How do their incident‐response
    plans address this requirement, keeping in mind that a cyberattack on a trading
    system may well have strict regulatory implications, which means preserving evidence,
    forensics, etc.? You would need to plan for a zero MTD *and* remain compliant
    to regulations, which means you can''t just kill the intruder, reboot the system,
    and you''re back in business. As a matter of fact, shutting down an infected system
    would wipe its volatile memory, destroying any forensic data that may be there.


    Do you see now why planning ahead is so important? You need to take this a step
    at a time.


    ## Preparing *Your* Incident‐Response Plan


    Notice the use of *your* as opposed to the generic incident response discussed
    earlier. No two IR plans are alike. They depend on many variables, from the size
    of the company (ranging from a small business to a multinational), to the scope
    of business, regulatory needs, and company culture. You might be surprised to
    hear that the last one plays a role in incident response, but it does. An active,
    engaged, and educated user community is an important asset in detection, in communications,
    and in remediation. A passive, disengaged, and generally cyberignorant culture
    frequently contributes to the incident and may even hinder its remediation.


    By understanding your business‐continuity and disaster‐recovery plans, you will
    gain a solid footing in framing your incident‐response plan. Similarly, the absence
    of either of these two plans speaks volumes about the company''s priorities and
    risk management capabilities. It is your job to confront this reality head on,
    starting with engaging the executive team, whose active support is a requirement
    in all cybersecurity program development efforts, and critical in developing incident‐response
    capabilities.


    Remember back to our hospital‐building analogy? All previous aspects of cybersecurity
    program development were akin to building the different wards and wings of the
    hospital. Incident response is the surgical center. Question number one, therefore,
    is: *Do you need a surgical center, or are you shipping your patients to a different
    facility altogether?* Otherwise phrased: *Do you need, can you afford, and will
    you keep engaged, an in‐house incident‐response team, or do you need to enter
    into an agreement with an outside incident‐response provider?*


    For the majority of small to mid‐sized businesses, the answer will be to outsource
    the incident‐response function (at a minimum). If this were a hospital, that would
    mean you keep the internists (or at least the nurses) in‐house, but outsource
    the surgeons. It is highly unlikely that a small business will be able to both
    afford and to keep engaged a team of highly skilled and specialized cybersecurity
    incident‐response people. But that doesn''t get you off the hook from designing
    your incident‐response plan! Remember, you can outsource responsibility, but you
    cannot outsource accountability. You still need to work with the service provider
    in designing and owning the plan. For your cybersecurity program development effort
    to succeed, you must always maintain accountability and full ownership. You are
    the one responsible for being knowledgeable enough and engaged enough to be able
    to successfully complete a cybersecurity handshake with your vendors.


    For those businesses that need an in‐house team for incident responses, you must
    also recognize that you will need to provide a complete ecosystem for them to
    succeed. They will need to report to the chief information security officer (CISO),
    and have access to the risk management teams, information technology, human resources,
    legal, and communications departments. The minimum size of an incident‐response
    team will always be two: an incident‐response manager and an incident‐response
    engineer. One interfaces with the organization and directs the incident response
    while the other is deep in the weeds doing forensic and remediation work. The
    larger the organization, the larger the incident‐response team and the more specialized
    and complex its structure.


    Irrespective of size and scope of company, be it in‐house or outsourced, your
    incident‐response plan will need to address several key components, starting with
    a detailed description of your incident‐response policies, standards, procedures,
    and guidelines. These, thankfully, will be derived to a considerable extent from
    your business continuity and disaster recovery plans, with the added input of
    at least risk management, legal, and communications. These policies will introduce
    organizational structure and will essentially define the *who‐does‐what‐when*
    part of the incident response.


    Regarding organizational structure, you''ll need to adopt the one that best reflects
    the organization''s needs. If you are decentralized, you may need decentralized
    incident‐response teams. If not, perhaps a single centralized team is best. Depending
    on size and scope, you may decide to introduce a blended approach, where some
    incident‐response capabilities are in‐house while the rest are outsourced. This
    works well when there is a large headquarters‐type of facility with smaller satellite
    offices scattered around the planet. In this case, you''re probably better off
    having a centralized incident‐response team at headquarters, with several vetted
    and contracted incident‐response vendors at the remote locations ready to coordinate
    with you. All involved get a copy of the plan, typically saved in a big red binder
    with “Don''t Panic” written all over it.'
  fmt: '

    # 业务连续性计划


    业务连续性计划（BCP）是企业为确保在发生中断时业务运营和价值交付的连续性而制定的计划。业务中断可能涉及自然灾害，如飓风、地震或疾病爆发；也可能是人为灾难，如恐怖袭击或网络攻击；甚至可能只是简单的人为失误，例如会计部的
    Julie 因食堂的墨西哥卷饼而食物中毒的情况。


    业务连续性（BC）计划包含各类有用信息，可为事件响应计划提供支持。例如，它定义了业务连续性组织架构、策略和工作流，以及谁可以触发 BC 计划及触发方式、详细联系信息（含紧急联系电话）、客户和供应商信息、迁移策略、恢复程序等。BC
    计划的优势在于：一旦启动，业务不同部门将执行不同工作流，旨在保护人员安全、与所有受影响方有效沟通，并启动尽可能快速的业务恢复。


    # 灾难恢复计划


    灾难恢复计划（DR）以技术为中心，重点在于恢复公司的技术基础设施。其中包含我们熟知的各类首字母缩写及其针对各系统的数值：恢复时间目标（RTO）、恢复点目标（RPO）和最大可容忍停机时间（MTD）。这些指标直接影响事件响应计划。


    以零 MTD 为例。您可能还记得，我们之前讨论过此场景，但此处值得重申：谁对停机零容忍？交易系统、银行系统、空管系统、公用事业系统。对某些人而言，还有 Uncle
    Bob''s Bagel and Pastrami Paradise。考虑到网络攻击可能带来严格的监管影响（意味着需保留证据、进行取证等），这些系统的事件响应计划如何应对零
    MTD 要求？您需要在规划零 MTD 的同时保持合规，不能简单地清除入侵者、重启系统就恢复运营。事实上，关闭受感染系统会擦除其易失性内存，销毁其中可能存在的取证数据。


    现在您是否理解为何提前规划如此重要？您需要循序渐进地推进。


    # 准备*您的*事件响应计划


    请注意此处使用的是“您的”，而非前文讨论的通用事件响应。没有两个 IR 计划是完全相同的。它们取决于诸多变量：公司规模（从小型企业到跨国公司）、业务范围、监管需求和企业文化。您可能惊讶地发现，企业文化在事件响应中也扮演角色，但确实如此。积极、投入且受过教育的用户群体是检测、沟通和修复中的重要资产。消极、疏离且普遍缺乏网络安全意识的文化往往导致事件发生，甚至阻碍修复工作。


    通过理解您的业务连续性和灾难恢复计划，您将在构建事件响应计划时获得坚实基础。同样，若缺少这两项计划中的任一项，充分说明了公司的优先级和风险管理能力。您的任务是直面这一现实，首先争取高管团队的积极支持——这不仅是所有网络安全计划开发工作的必要条件，更是开发事件响应能力的关键。


    回顾我们的医院建设类比？网络安全计划开发的所有前期工作类似于建设医院的各个病房和楼翼。事件响应则是手术中心。因此首要问题是：*您需要手术中心，还是将患者全部转送至其他机构？*
    换言之：*您是否需要、能否负担并能否持续投入建设内部事件响应团队，还是需要与外部事件响应服务商签订协议？*


    对大多数中小企业而言，答案是外包事件响应职能（至少）。若按医院类比，即保留内科医生（或至少护士）在内部，而外包外科医生。小型企业极难同时负担并留住一支高技能、专业化的网络安全事件响应团队。但这不代表您可以摆脱设计事件响应计划的责任！请记住，您可以外包责任，但不能外包问责。您仍需与服务商合作设计并拥有该计划。为使网络安全计划开发成功，您必须始终保持问责制和完全所有权。您有责任具备足够的知识和投入度，以成功完成与供应商的网络安全“握手”。


    对于需要内部事件响应团队的企业，您也必须认识到，需要为其提供完整的生态系统以确保成功。他们需向首席信息安全官（CISO）汇报，并能访问风险管理团队、信息技术、人力资源、法务和传播部门。事件响应团队的最小规模始终为两人：一名事件响应经理和一名事件响应工程师。前者与组织对接并指导事件响应，后者深入一线开展取证和修复工作。组织规模越大，事件响应团队规模越大，结构越专业化、复杂化。


    无论公司规模和范围如何，无论是内部团队还是外包，您的事件响应计划都需涵盖几个关键组成部分，首要的是详细描述事件响应策略、标准、程序和指南。幸运的是，这些在很大程度上源自您的业务连续性和灾难恢复计划，并结合风险管理、法务和传播部门的意见。这些策略将引入组织架构，实质上定义了事件响应中的“谁在何时做什么”。


    关于组织架构，您需采用最能反映组织需求的模式。若为去中心化架构，可能需要去中心化的事件响应团队；否则，单一集中式团队可能更优。视规模和范围而定，您可采用混合模式：部分事件响应能力内部建设，其余外包。当存在大型总部设施及分布全球的较小卫星办公室时，此模式效果良好。此时，最好在总部设立集中式事件响应团队，在远程办公地点安排多家经过审核并签约的事件响应供应商，随时与总部协调。所有相关方均持有一份计划副本，通常保存在一个贴满“Don''t
    Panic”字样的大红活页夹中。

    '
