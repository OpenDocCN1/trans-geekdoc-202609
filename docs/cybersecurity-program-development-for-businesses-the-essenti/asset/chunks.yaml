    # 附录


    ## 迫在眉睫的危险


    2017 年初，我为网站“From CEO to CEO”撰写了一篇题为“迫在眉睫的危险”的社论。文中阐述了我关于国家层面网络安全的思考。


    2016 年 12 月 13 日，《纽约时报》发表了一篇题为“完美武器：俄罗斯网络力量如何入侵美国”的特稿。Eric Lipton、David Sanger
    和 Scott Shane 在文中出色地详细勾勒了近期针对美国利益的国家赞助网络攻击。但故事并未就此结束。


