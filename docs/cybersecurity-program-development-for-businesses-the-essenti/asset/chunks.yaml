- raw: "You can, and should, advise the board on what you think is possible regarding\
    \ controls, strategy, and so on, to mitigate this risk, and you should do it objectively\
    \ and clearly. Terrorizing executives and boards with “Do you feel lucky?” kinds\
    \ of questions never works. Stick to the facts, present alternatives, educate,\
    \ and ultimately, accept their decision and move on.\n\nAnd so will we. Onward\
    \ to incident response!\n\n# CHAPTER 11  \n\nIncident‐Response Planning\n\n“You\
    \ mean to tell me,” complained one executive I worked with, “that after all this\
    \ work, after endless hours of assessing, valuating, cataloging, classifying,\
    \ testing, planning, deploying, and educating…now I have to develop an incident‐response\
    \ plan on top of it all? You'd think we'd be protected to the max!” He groaned.\
    \ “Can't I at least farm it out?”\n\n“Well, that depends….”\n\nI call this incident‐response\
    \ planning despair, the dreaded IRPD! It's dreaded partly because it comes toward\
    \ the end of developing a cybersecurity program, and partly because it is so anticlimactic.\
    \ It is true that a lot of work, a lot of hard work, has brought you to this point.\
    \ Now, you are asked to develop a plan for when all your work has failed. Despite\
    \ it all, an incident has happened, and you need to have a plan to pick up the\
    \ pieces.\n\nIn the 2015 movie *The Martian,* the main character teaches a group\
    \ of aspiring astronauts. He tells them:\n\n> *…At some point, everything's gonna\
    \ go south on you…everything's going to go south and you're going to say, “This\
    \ is it. This is how I end.” Now you can either accept that, or you can get to\
    \ work. That's all it is. You just begin. You do the math. You solve one problem…and\
    \ you solve the next one…and then the next. And if you solve enough problems,\
    \ you get to come home.*\n\nHonestly, if there is a better description about what\
    \ an incident‐response plan really looks like, I have not found it!\n\n## Incident‐Response\
    \ Planning: Not Just a Good Idea—It's the Law!\n\nYou may have heard of FISMA.\
    \ It stands for Federal Information Security Management Act. It was signed into\
    \ law in 2002, and it essentially requires all federal agencies to develop an\
    \ incident‐response plan.\n\nI know what you're thinking—“But my company is private,\
    \ so why should I care about federal regulations?” The reason is that similar\
    \ legislation requiring your firm to do the same is probably not too far away.\
    \ For example, New York State passed 23 NYCRR 500, a regulation requiring most\
    \ financial and insurance firms to retain a chief information security officer\
    \ (CISO), have a robust cybersecurity program, perform risk assessments and testing,\
    \ roll out two‐factor authentication, and report incidents within the first 72\
    \ hours. And, of course, develop an incident‐response plan.\n\nWhy do I predict\
    \ that such regulations are imminent? Consider seatbelts as an example. Once considered\
    \ optional, the current policy on seatbelts is “Click it or ticket.” Having an\
    \ incident‐response plan is like a seatbelt for your IT. It may not prevent an\
    \ attack (that's what all the other stuff is for) but if one happens anyway, it\
    \ will help limit the damage.\n\nAnother reason politicians are likely to get\
    \ involved with requiring these plans is that insurance companies and governments\
    \ are not prepared to shoulder the hits from an attack alone. And neither should\
    \ you. You need the help.\n\nThe good news is that there are plenty of resources\
    \ to help you develop an incident‐response plan. The bad news is that developing\
    \ an incident‐response plan can be fairly complicated. In a sense, it's similar\
    \ to building a hospital. The basics are obvious: You know it must have an emergency\
    \ room, diagnostic facilities, intensive care units, operating rooms, patient\
    \ rooms, offices, etc. But that's just the beginning! You also need to know the\
    \ community that this hospital will be serving. Is it a metro area? Is it a small\
    \ town? A group of isolated villages? Is the hospital in the tropics? The Arctic?\
    \ And more questions follow: Who's funding it? The community? A wealthy donor?\
    \ Is this a private company or government‐owned? What kind of specialties will\
    \ it have?\n\nYou get the idea. Your preexisting knowledge of minimum essential\
    \ services plus demographics, geography, and budget will go a long way in deciding\
    \ size and scope. For example, maybe your hospital can handle most everyday types\
    \ of medical care, but when it comes to a body‐part transplant, you'll need to\
    \ refer the patient to a more specialized facility.\n\nThe same is true with your\
    \ incident‐response plan. Your firm's size, location, and budget will determine\
    \ how sophisticated the plan will be. A small company may have an incident‐response\
    \ plan that calls for identifying an incident and immediately calling in outside\
    \ expertise. A larger firm may have multiple incident‐response specialists in\
    \ house. As you can guess, the most critical step in developing your incident‐response\
    \ plan is going into it prepared to answer these questions.\n\n## Incident‐Response\
    \ Plan Phases\n\nAugust 2012 was, for its time, a record breaker. Much warmer\
    \ than average in New England, 63 percent of the states suffered droughts while\
    \ Florida was getting drowned from Hurricane Isaac and a bunch of tropical storms.\n\
    \nMeanwhile, back in Gaithersburg, Maryland, the National Institute of Standards\
    \ and Technology (NIST) was hard at work releasing *NIST Special Publication 800‐61\
    \ Revision 2: Computer Security Incident Handling Guide*. You have to hand it\
    \ to them; their titles are killers! But that's nothing compared to what's inside.\n\
    \nCurrently, NIST 800‐61r2, as it's known, is required reading for anyone in the\
    \ cybersecurity field. It is a beautiful piece of work, and if you plan to get\
    \ hands‐on with incident management, you need to get intimate with it. You should\
    \ also get real close with such other captivating titles like *ISO/IEC 27035‐2\
    \ Information Technology—Security Techniques—Information Security Incident Management—Part\
    \ 2: Guidelines to plan and prepare for incident response*. (No, I am not kidding.\
    \ That's the title. Fantastic work, too.) And while you're at it, you should also\
    \ consult *ENISA's Actionable Information for Security Incident Response, Strategies\
    \ for Incident Response and Cyber Crisis Cooperation,* and *NCSS Good Practice\
    \ Guide—Designing and Implementing National Cyber Security Strategies*. Can't\
    \ wait for more? The list is long, and sampled in this book's bibliography.\n\n\
    What do you need to understand from all this? What are the essential elements\
    \ of an incident‐response plan that you need to own in order to complete your\
    \ own cybersecurity program?\n\nThe first critical thing to understand is that\
    \ incident response is a program in and of itself. As such, it has its own distinct\
    \ phases, and much like the overall cybersecurity program, it, too, is a living\
    \ program. It's not one and done; it's a continuously managed program.\n\nWhat\
    \ are the phases? Have you heard of Elisabeth Kübler‐Ross's five stages of grief:\
    \ denial, anger, bargaining, depression, and acceptance? Many people go through\
    \ them during an incident: “No! This can't be happening to us!” followed by choice\
    \ expletives, then by the desire to pay to make this go away, quickly replaced\
    \ by depression about having to face the music, and finally acceptance of the\
    \ fact that you, like millions of others, are a victim of a cybercrime.\n\nBut\
    \ the core phases of incident‐response planning are less gloomy. They are: preparing\
    \ for incidents, identifying the occurrence of an incident, containing the incident,\
    \ treating the incident (e.g., killing the virus, disabling access, etc.), recovering\
    \ from the incident, and post‐incident review, aka the lessons‐learned phase.\
    \ That last one is key and should never be omitted.\n\nTo properly prepare for\
    \ an incident you need to have in place three things:\n\n1.  A business continuity\
    \ plan.\n\n2.  A disaster recovery plan.\n\n3.  An incident‐response plan."
