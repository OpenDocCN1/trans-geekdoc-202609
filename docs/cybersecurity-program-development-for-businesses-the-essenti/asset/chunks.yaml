- raw: "Russia is not alone in excelling at cyberwarfare. Many nation‐states see this\
    \ as the new “arms race.” They believe, rightly so, that this is a race they can\
    \ win. North Korea, Iran, and China have demonstrated their capabilities time\
    \ and again. So have the United States and Israel. There is little doubt that\
    \ practically every country is actively participating in the development, management,\
    \ and deployment of cyberwarfare infrastructure. They all are, and they are building\
    \ massive defensive and offensive cyberwarfare capabilities. Moreover, they are\
    \ “in it to win it,” and they think they can.\n\nWhat has made Russia's cyberattack\
    \ particularly egregious is not that it is the first, but that it is a blatant,\
    \ in‐your‐face show of power, ridiculing the last superpower standing. What makes\
    \ it particularly deadly is that it is coupled with Russia's deep scholarship\
    \ in propaganda. I have read recent interviews from officials downplaying and\
    \ demeaning Russian propaganda as “par for the course,” and “things we've seen\
    \ before from the Russians.” If so, then we have not learned, and that has cost\
    \ us dearly. We have been badly defeated and ridiculed by what we all thought\
    \ was a vanquished enemy of a cold war gone dead. In my view, news of the enemy's\
    \ demise is premature, and the cold war is very far from over.\n\nOn April 4,\
    \ 1949, with the memories of the Second World War brutally fresh, an alliance\
    \ was entered into by the United States, Canada, and several European countries.\
    \ The North Atlantic Treaty Organization (NATO) was formed. Article 1 of the treaty\
    \ reads: “The Parties undertake, as set forth in the Charter of the United Nations,\
    \ to settle any international dispute in which they may be involved by peaceful\
    \ means in such a manner that international peace and security and justice are\
    \ not endangered, and to refrain in their international relations from the threat\
    \ or use of force in any manner inconsistent with the purposes of the United Nations.”\n\
    \nMany more treaties followed, and the world's doomsday clock reflected the threat:\
    \ 7 minutes to midnight in 1947; 3 minutes in 1949, after the first USSR nuclear\
    \ test; 17 minutes—the lowest value—in 1991. Now, it is back to 3 minutes to midnight.\n\
    \nThe lowest value, 17 minutes to midnight, was reached when the world thought\
    \ the cold war to be over, and the United States and Russia were engaged in nuclear\
    \ arms reduction. Since 2015 it is back to 3 minutes as “Unchecked climate change,\
    \ global nuclear weapons modernizations, and outsized nuclear weapons arsenals\
    \ pose extraordinary and undeniable threats to the continued existence of humanity,”\
    \ and world leaders fail to act.\n\nSadly, this is not their only failure. As\
    \ catastrophically serious as both climate change and nuclear arsenals are, and\
    \ about that there should be no doubt, a third blight has surfaced: cyberwar.\
    \ Most think that hacking or cyberwarfare is a threat, to be sure, but not on\
    \ the same level as nuclear weapons. Yes, millions of dollars may be lost, political\
    \ careers may be ruined, and service interruptions may be inconvenient, but a\
    \ cyberwar is thought to be confined to the virtual world, not the real one. They\
    \ are deadly wrong.\n\nActs of cyberwarfare may have already claimed lives in\
    \ Ukraine, when Russian hackers attacked that country's power grid, leaving almost\
    \ a quarter million residents without power. Lives may have been lost when the\
    \ centrifuges in Iran's nuclear enrichment facility were destroyed by Stuxnet,\
    \ a suspected U.S./Israeli cyberweapon. And, of course, there are many victims\
    \ of cyberbullying who have taken their own lives, demonstrating the power of\
    \ reputational damage, an easily attainable effect of hacking any individual's\
    \ life story.\n\nExperts warn of the certainty of real human casualties from cyberwarfare.\
    \ Consider what would happen if the electrical grid was hacked and the country,\
    \ or regions, went dark for weeks on end. Ted Koppel did so in his book, *Lights\
    \ Out*, and the implications are devastating. Consider the ramifications of hacking\
    \ medical records and facilities, water purification plants, traffic control,\
    \ or telecommunications. I am sure that you can come up with your own nightmare\
    \ scenario that leaves thousands, if not hundreds of thousands, of dead or injured,\
    \ and our country in chaos.\n\nI also have no doubt that there are brilliant minds\
    \ working around the clock in our security services that continuously analyze\
    \ and respond to these threats, as well as advise our leaders. But I know from\
    \ experience that their advice frequently falls on deaf ears. Just as executives\
    \ don't want to hear about risk, be it cyber, technology, or otherwise, neither,\
    \ I suspect, do government “executives.” Certainly, recent rhetoric on the value\
    \ of intelligence briefings demonstrates this, just as did the inaction and hesitation\
    \ of the Obama White House in responding to the Russian attack against our political\
    \ process.\n\nWe need a concentrated effort on this new front for the survival\
    \ of humanity. We need our leaders to be educated and alert to the danger this\
    \ poses. We need our people to be sensitized to the danger of cyberattacks; think\
    \ “duck and cover” for the cyber‐age. We need our allies to reinvigorate their\
    \ frameworks for resolving conflicts peacefully to include cyberwarfare. A cyberattack\
    \ against one country should be considered an attack against us all, with a commensurate\
    \ and immediate response. And we need our international organizations to recognize\
    \ the danger of cyberactor proliferation and take immediate and decisive action.\n\
    \nIt's a start, when nothing less will do. My Cyber Clock is set to 1 minute to\
    \ midnight, and the seconds are ticking.\n\n*Originally published on January 17,\
    \ 2017, in “From CEO to CEO” ([http://www.ceo‐to‐ceo.com/trends/clear‐and‐present‐danger/](http://www.ceo-to-ceo.com/trends/clear-and-present-danger/)).*\n\
