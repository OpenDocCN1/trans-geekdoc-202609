- raw: "1.  *Confidentiality Classification:* Like before, I recommend that you use\
    \ a scale from 1 to 4, with 1 assigned for “public,” 2 being “confidential,” 3\
    \ for “secret,” and 4 for “top secret.”\n\n    Two tips: First, avoid the trap\
    \ of having more classifications than necessary. Keep it as simple as you can.\n\
    \n    Second, use an even number of classifications to avoid giving anyone the\
    \ option to pick the middle number as a safe bet. Since you're doing all of this\
    \ work in partnership with the asset's owner, insist that both of you think this\
    \ classification through and through. You'll be surprised at the dividends down\
    \ the line.\n\n    If in doubt, use scenarios. Ask what‐if–type questions. What\
    \ would happen if this data was leaked to the public? What is the impact of a\
    \ payroll report mistakenly being circulated company‐wide? Can you identify groups\
    \ of users with clear delineations for information access? Who needs to know this\
    \ data, and who should not know? Are there policies in place that delineate access\
    \ rights to the data?\n\n2.  *Criticality:* Again, I recommend that you use a\
    \ scale from 1 to 4, with 1 assigned for “nice‐to‐have,” 2 being “optional,” 3\
    \ for “essential,” and 4 for “mission critical.” These are applicable across the\
    \ spectrum, from business units to assets, and you need to be as objective as\
    \ possible when assigning them. Not all assets are critical. They may all be *valuable,*\
    \ but that doesn't make them critical. You may be able to operate okay for months\
    \ without the music server streaming, but be forced to close your doors if accounting\
    \ can't pay vendors or meet payroll.\n\n    Scenarios are very helpful in establishing\
    \ criticality, especially when framed by a specific business unit function, that\
    \ is, limited in scope. If you start talking criticality at the enterprise level,\
    \ that is, which business unit is more critical than another, then you had best\
    \ do so only in the presence of the executive committee and the board—otherwise\
    \ all these friends you worked so hard for are going to be looking at you sideways\
    \ (e.g., “What do you mean ‘facilities management’ is not as critical as ‘finance?’\
    \ Let me see you work with no heat!”).\n\n3.  *Impact:* This is the measurement\
    \ of pain on a scale from 1 to 4, from “none,” to “minor,” to “moderate,” to “severe.”\
    \ How painful is the outage going to be in terms of business impact? Are you out\
    \ of business? If so, the impact is severe! Are the fees associated with the outage\
    \ so high that the business will lose money for the year? I'd call that “severe,”\
    \ too. The quarter? Let's go with “moderate.” You wouldn't even notice the charge\
    \ in the P&L? I'd call that “minor.” You should feel free to come up with your\
    \ own terms, but my advice is keeping it down to no more than four, and to avoid\
    \ colorful language. Other people, potentially of sour disposition, may read the\
    \ document someday, and you don't want them raising any eyebrows as they contemplate\
    \ litigation, especially if the outage will cause a public relations nightmare\
    \ for your company.\n\n    An interesting side note: The business unit owner will\
    \ assign their version of impact. Then, the executive team may assign a different\
    \ version of impact for the unit. And finally, the board, which is the ultimate\
    \ decision‐maker on all matters of risk, may choose to accept an impact classification\
    \ of severe as not worthy of a set of controls, despite your advice to the contrary.\
    \ Crazy, I know, but these differing points of view are entirely appropriate.\n\
    \n    The business unit owner will justly consider a system's failure impact as\
    \ severe for their unit while the CEO may consider the business unit's inability\
    \ to contribute value as moderate, and the board may very well accept that risk\
    \ and elect not to apply any controls toward that moderate or severe impact assessment.\
    \ There are times when yours is not to reason why.\n\n4.  *Maximum Tolerable Downtime\
    \ (MTD):* Let's assume the business unit is out of commission for some reason—cyberattack,\
    \ power outage, whatever. Ask the question: “How long can the business unit owner\
    \ tolerate the outage?” That's the amount of pain that the business owner is willing\
    \ to accept before things turn ugly. What's ugly? Ugly is going out of business.\
    \ That's pretty ugly. Less ugly is finding yourself unable to comply with a contract\
    \ or regulation while more ugly is loss of life because of the outage. You get\
    \ the idea. The MTD provides a baseline for building disaster recovery and business\
    \ continuity plans.\n\n5.  *Recovery Point Objective (RPO):* The RPO tells you\
    \ the *when* in time you need to be able to recover to. Think of it this way:\
    \ Let's say you have an accounting system. The thing goes south on you. It's out.\
    \ Gone. Nothing is running. Can't pay invoices, can't process receivables, and\
    \ can't run payroll. The natives are starting to get restless. The IT department\
    \ and the accounting vendor look at the situation and they tell you that the system\
    \ will be back in two days' time, and the data will be restored from last week's\
    \ backup.\n\n    Here's the question you should be able answer to *before* the\
    \ failure: Is that okay? If so, it means that once you get the system back (in\
    \ two days) you'll have to reenter all transactions that happened between the\
    \ last good backup and the day you have the system back. If you agree, that means\
    \ that you have implicitly accepted two values: One is the recovery point objective\
    \ of one week.\n\n    The second is:\n\n6.  *Recovery Time Objective (RTO):* Your\
    \ RTO is the maximum amount of time that you're willing to wait to be back in\
    \ business, or—to put it in a more positive light—RTO is, ideally, how fast you'd\
    \ like to have the problem go away and you back in business. In the preceding\
    \ example, you accepted an RTO of two days. This is different from the MTD, which\
    \ you may have set as one month, because with no payroll for a month, you'll be\
    \ left with no employees and no business. Hence: maximum tolerable downtime.\n\
    \n    Now, consider that instead of an accounting system going down, you're a\
    \ brokerage firm, and your brokerage system crashes. No more trades. No more reconciliation.\
    \ No more portfolio management. You have no idea where the orders that were in\
    \ the pipeline are, what's executed and what hasn't, what the values are, etc.\n\
    \n    What's your recovery time objective? If you said a few seconds, you would\
    \ be right! Anything more could put you out of business. And your recovery point\
    \ objective? Right up to the last second before the outage. You can't afford to\
    \ lose any transactions. (To say nothing about those “men in black” from the regulators\
    \ who will want to have a friendly chat with you about the outage.)\n\n7.  *Resources:*\
    \ This is one of the most important pieces of information you'll collect. What\
    \ are the resources (always per business unit per system) necessary for recovery?\
    \ They need to be accurately identified and be cataloged in an actionable, meaningful\
    \ way. You'll need not only the “Who is doing what?” question answered, but also\
    \ how to get in touch with these resources, including backup plans if the resources\
    \ are not available.\n\n    For example, if your can't‐live‐without‐it custom\
    \ application was written in Etruscan by Molly, who has since retired to Oahu,\
    \ it is probably a good idea to: (a) have all of Molly's up‐to‐date contact information,\
    \ (b) have identified the last few remaining Etruscan speakers, and (c) reflect\
    \ on the lesson‐learned about keeping mission‐critical systems up‐to‐date and\
    \ not in dead‐and‐gone language.\n\n    Similarly, you need to keep in mind that\
    \ resources will be placed in contention if more than one system goes south (a\
    \ likely event in the case of a cyberattack)."
