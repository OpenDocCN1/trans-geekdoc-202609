- raw: 'IT must inform and advise on how best to generate value for the company by
    aligning with its business goals. Cybersecurity must inform and advise on risk
    and how best to protect company assets. The business will evaluate and adopt the
    most suitable IT strategy, and accept the appropriate risk. If that means 100
    percent on‐premises, that''s what it will be, and if that means 100 percent carrier
    pigeons, so be it!


    ## Private‐Cloud Computing Environments


    Whatever its downsides (and there are more than a few!), an on‐premises computing
    environment does provide IT professionals with lots of something they simply adore:
    control! Once you switch to cloud environments, that control starts to fade away,
    and that can make some IT folks nervous. One of the ways to talk a cybersecurity
    professional off the ledge when you''re discussing the cloud is to promise that
    you''ll be moving the IT infrastructure into a private cloud. What that means
    is the infrastructure will at least be located inside a dedicated, secure, access‐controlled,
    and likely ISO‐certified data center, and only you and your team will have access
    to it.


    Private clouds try to deliver the benefits of scalability and on‐demand provisioning
    of a public cloud solution while maintaining the sense of ownership and control
    of an onsite architecture. In other words, private clouds attempt to deliver the
    public‐cloud advantages, but they do so in an exclusive way for your organization.
    You are still responsible to maintain the resulting IT services footprint, just
    as you are responsible for protecting it, but now you have the advantage of not
    actually owning the infrastructure. You are, in essence, leasing on demand whatever
    it is you need at any one time. You can provision and deprovision as much and
    as often as you like, thereby gaining the flexibility that on‐premises infrastructure
    denies while maintaining the tight control that a highly secure or mission‐critical
    infrastructure demands.


    It is important to note here that you should not think of a private‐cloud infrastructure
    as a bunch of dedicated physical computers. Although that may be a possibility,
    it is unlikely. The probability is that your private‐cloud solution will be virtually
    delivered to your company just as with a public cloud, but with one key difference:
    The delivery of this infrastructure‐as‐a‐service is done through proprietary,
    dedicated, single‐tenant pipes, in essence creating a physical separation tenant‐to‐tenant.


    When you''re running a private cloud, much like running your own on‐premises infrastructure,
    you are entirely responsible for your private cloud''s security needs. It''s all
    you. Essentially, what you have gained is the flexibility of cloud infrastructure‐as‐a‐service
    and perhaps software‐as‐a‐service while you have retained total control over cybersecurity.
    If that''s worth it to you, then great! The answer lies in aligning business goals
    to IT value delivery, and nowhere else. If that alignment results in a private‐cloud
    implementation, then cybersecurity will step up to the plate and protect it.


    The catch is, of course, that any cloud choice, private, public, or hybrid, will
    introduce additional cybersecurity considerations to any on‐premises infrastructure.
    For example, before you even contemplate procuring the service, you''ll need to
    make sure that the provider of your private cloud is in compliance with several
    standards. These include all the usual suspects like CSA STAR, HIPAA, ISO27001,
    PCI‐DSS, SAS‐70, SOC‐3, and TRUSTe, to name a few. If you must pick one certification,
    you should pick Cloud Security Alliance''s STAR certification (it integrates ISO27001
    with their own cloud controls matrix CCM). CSA STAR comes in three flavors: a
    level‐one self‐attestation, a level‐two certification, and the in‐development
    level‐three continuous monitoring implementation. Then, once you have that, you
    can investigate additional requirements like Privacy Shield (if you''re concerned
    with the European Union''s General Data Protection Regulation (GDPR), which you
    should be), PCI, or HIPAA.


    ## Public‐Cloud Computing Environments


    The very idea of a public cloud makes most cybersecurity professionals hyperventilate.
    Sure, there are tons of certifications, the marketplace is maturing, there are
    appropriate controls, and so on and so forth, but we''re talking risk‐minded computer
    scientists. No matter what you say, for them the risk is just too much. Why is
    it too much? Because, we''re not a trusting folk! In a public cloud, cybersecurity
    is the responsibility of the provider, and, simply put, we don''t trust them.
    Some will call this paranoid and inappropriate. We call it prudent. Go figure!


    So, how can we all get along here? For one, you (as the acting cybersecurity executive)
    should fully understand the provider''s policies and controls across several key
    variables: What are their privacy policies? Where are they compliant and where
    are they not? What are the issues with global data flow? And what is their transparency
    policy?


    You should insist that your cloud‐solution provider be able to articulate, demonstrate,
    and make available to you for audit‐on‐demand their security strategy, their controls,
    their business continuity and disaster recovery plans, staffing expertise and
    security clearances (including background‐check policies), staff training and
    certifications, cloud facility certifications and past audit results, their incident‐response
    plan, and communications policies. If they comply, then we''re good. If they don''t,
    then the risk is yours to accept or not. What is that risk?


    There are a few. If you don''t know how your data is actually protected, then
    you may also not know if it has been stolen or altered until it is too late. Or,
    consider the fact that since you''re in a public cloud, an attacker may be targeting
    your roommate and trash your servers in the process. Or, imagine that another
    tenant is hacked, but the landlord chooses not to communicate this fact to you
    (or anyone else), because it is not in their best interest to expose the breach.
    And so on and so forth.


    There are also serious technical considerations that you will need assurances
    on: issues such as co‐tenancy, parallel processing, and process‐memory segregation.
    We don''t need to get into the weeds with this stuff here—that''s why you should
    retain a cloud security certified professional. Suffice it to say that since everyone
    is in the same pool, you want to make sure that if the kid in the corner has an
    accident, you don''t end up swimming in it!


    ## Hybrid‐Cloud Computing Environments


    You already have a hybrid cloud, even though you may not be formally acknowledging
    it. I think I am safe in assuming that everyone in your organization has some
    sort of a smartphone or tablet. If so, they are already using the cloud whether
    you like it or not. All these devices typically connect to the cloud for backup
    and storage. If your users are using these for corporate email, it is possible
    that, it, too, is stored in the cloud. Of course, one can apply strict controls
    to all this, but then you''re starting a war you can''t win: a losing war with
    shadow IT.


    Shadow IT is defined as any information technology solution employed by your users
    that has not been approved nor is it maintained by your IT department—hence the
    shadow. Shadow IT frequently results from user frustration with the rigidity of
    IT and their approved solutions. So, the users, in an effort to be more efficient,
    faster, or seeking ease of use and convenience, will open up a Dropbox account,
    or use a work or private email address to bypass organizational controls that
    they perceive as onerous.'
  fmt: '

    IT 必须告知并建议如何通过与业务目标保持一致，为公司创造最大价值。网络安全必须告知并建议风险以及如何最好地保护公司资产。业务方将评估并采纳最合适的 IT
    策略，并接受相应的风险。如果这意味着 100% 本地部署，那就 100% 本地部署；如果这意味着 100% 使用信鸽，那也无妨！


    ## 私有云计算环境


    无论其缺点如何（而且缺点不少！），本地计算环境确实为 IT 专业人员提供了他们极其喜爱的一样东西：控制权！一旦切换到云环境，这种控制权就会开始消退，这会让一些
    IT 人员感到不安。在讨论云时，要让网络安全专业人员放心的一种方法，就是承诺将 IT 基础设施迁移到私有云。这意味着基础设施至少位于一个专用、安全、访问受控且很可能通过
    ISO 认证的数据中心内，只有你和你的团队拥有访问权限。


    私有云试图在保持本地架构的所有权感和控制感的同时，提供公有云解决方案的可扩展性和按需配置优势。换句话说，私有云试图以独占方式为你的组织提供公有云的优势。你仍然负责维护生成的
    IT 服务占用空间，就像你负责保护它一样，但现在你拥有了一个优势：不必实际拥有基础设施。从本质上讲，你是在按需租赁在任何特定时间所需的任何资源。你可以随意频繁地配置和取消配置任意数量的资源，从而获得本地基础设施无法提供的灵活性，同时保持高安全或任务关键型基础设施所要求的严格控制。


    重要的是要注意，你不应将私有云基础设施视为一堆专用的物理计算机。虽然这有可能，但不太可能。你的私有云解决方案很可能像公有云一样，以虚拟方式交付给你的公司，但有一个关键区别：这种基础设施即服务的交付是通过专有的、专用的、单租户管道完成的，实质上在租户之间创建了物理隔离。


    当你运行私有云时，就像运行自己的本地基础设施一样，你需要完全负责私有云的安全需求。全靠你自己。从本质上讲，你获得了云基础设施即服务甚至软件即服务的灵活性，同时保留了对网络安全的完全控制。如果这对你值得，那就太好了！答案在于将业务目标与
    IT 价值交付相结合，别无他处。如果这种结合导致私有云实施，那么网络安全将挺身而出保护它。


    当然，问题在于，任何云选择（私有、公有或混合）都会给任何本地基础设施带来额外的网络安全考量。例如，在考虑采购服务之前，你需要确保你的私有云提供商符合多项标准。这些包括所有常见的标准，如
    CSA STAR、HIPAA、ISO27001、PCI-DSS、SAS-70、SOC-3 和 TRUSTe 等。如果你必须选择一个认证，你应该选择云安全联盟的
    STAR 认证（它将 ISO27001 与其自身的云控制矩阵 CCM 相结合）。CSA STAR 分为三种类别：一级自我证明、二级认证和正在开发中的三级持续监控实现。然后，有了这个，你可以调查额外的要求，如隐私盾（如果你关心欧盟的通用数据保护条例
    `GDPR`，你应该关心）、PCI 或 HIPAA。


    ## 公有云计算环境


    公有云的概念让大多数网络安全专业人员感到极度不安。当然，有大量的认证，市场正在成熟，有适当的控制措施，等等，但我们谈论的是风险导向的计算机科学家。无论你说什么，对他们来说风险都太大了。为什么太大？因为我们不是轻信的人！在公有云中，网络安全是提供商的责任，简单说，我们不信任他们。有人会称这为偏执和不恰当。我们称之为审慎。随它去吧！


    那么，我们如何能和睦相处？首先，你（作为行动的网络安全高管）应该充分了解提供商在几个关键变量上的政策和控制：他们的隐私政策是什么？他们在哪些方面合规，哪些方面不合规？全球数据流动有哪些问题？他们的透明度政策是什么？


    你应该坚持要求你的云解决方案提供商能够阐述、演示并按需提供给你进行审计：他们的安全策略、控制措施、业务连续性和灾难恢复计划、人员专业知识和安全许可（包括背景调查政策）、员工培训和认证、云设施认证和过往审计结果、他们的事件响应计划以及沟通政策。如果他们遵从，那就没问题。如果不遵从，则风险由你自行决定接受与否。那是什么风险？


    有几个。如果你不知道数据实际上是如何受到保护的，那么在为时已晚之前，你也可能不知道数据是否已被窃取或篡改。或者，考虑到既然你在公有云中，攻击者可能以你的“室友”为目标，并在过程中破坏你的服务器。或者，想象另一个租户被黑客攻击，但房东选择不向你（或任何其他人）通报这一事实，因为暴露违规不符合他们的最大利益。诸如此类。


    还有一些严重的技术考量，你需要获得保证：诸如共租、并行处理和进程内存隔离等问题。我们不需要在这里深入探讨这些细节——这就是为什么你应该聘请一名云安全认证专业人员。简而言之，既然大家都在同一个池子里，你要确保如果角落里的孩子出了事，你不会最终游在其中！


    ## 混合云计算环境


    你已经拥有混合云了，即使你可能没有正式承认这一点。我认为可以安全地假设，你组织中的每个人都有某种智能手机或平板电脑。如果是这样，无论你喜不喜欢，他们已经在使用云了。所有这些设备通常都连接到云进行备份和存储。如果你的用户将这些用于公司邮件，那么公司邮件也有可能存储在云中。当然，可以对所有这些应用严格控制，但那样你就发动了一场无法取胜的战争：一场与影子
    IT 的必输之战。


    影子 IT 被定义为你的用户采用的任何未经你的 IT 部门批准也未由其维护的信息技术解决方案——因此称为“影子”。影子 IT 经常源于用户对 IT 的僵化及其批准解决方案的挫败感。因此，用户为了更高效、更快捷，或寻求易用性和便利性，会开设
    `Dropbox` 账户，或使用工作或私人邮箱地址来绕过他们视为繁琐的组织控制。

    '
