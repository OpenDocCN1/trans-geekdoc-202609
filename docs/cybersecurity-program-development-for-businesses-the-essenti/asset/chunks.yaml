    # Cybersecurity and IT: Distinct Functions


    Cybersecurity and IT are two distinct functions, frequently at odds (e.g., do
    IT faster, easier, and cheaper versus double‐check it, restrict it, and monitor
    it). Each aligns with two different, but equally important strategies: value creation
    and risk management. The process of value creation is all about taking risks—falling,
    getting up, and trying again. It''s about innovation, experimentation, and boldly
    going where no one has gone before. The process of risk management, on the other
    hand, is all about evaluation, risk assessment, threat assessment, and *semper
    fidelis* to the mission and vision of the company. These are like two parallel
    railroad tracks that your company''s engine runs on. Thankfully, never the twain
    shall meet, or else your train just derailed.


    Now that we have kept them separate, how do you align technology with your business
    strategy? Excellent question, and one that is within the purview of my next book,
    coming soon to a bookseller near you. The question we plan to answer in this book
    is how to align your cybersecurity with your business strategy.


    ## Addressing the Alignment Problem


    Many years ago, I had an amazing geometry professor. The man ate, drank, and breathed
    geometry. In his apartment, there was a big room, filled floor to ceiling with
    filing cabinets labeled with numbers. A bunch of us students used to go there
    to train for the university geometry entrance exam (don''t even ask…). When I
    saw these cabinets, I asked him about the labels. He replied that those were filing
    cabinets filled with geometry problems classified by the amount of time needed
    for a solution. If you wanted a five‐minute problem, he''d walk up to the corresponding
    cabinet and pull one out. A two‐hour problem? No worries! Even a five‐day problem?
    Easy. There was even a cabinet with his forever problems—theorems that remain
    unsolved to this day.


    He had a great piece of advice for gauging the difficulty of any problem: the
    length of its definition. He told us that if you see a problem whose definition
    is a one‐liner, skip it. Leave it for last. That one will be the toughest to solve
    because it gives you the least information to go on. You see one that has a paragraph‐long
    definition? Easy! Tackle that first.


    With that in mind, what kind of problem is aligning cybersecurity with your business
    strategy? Well, another way of looking at it is aligning cybersecurity with your
    risk appetite. Both definitions are one‐liners, and short one‐liners at that.
    Not pretty!


    How do you come up with your risk appetite? Who is responsible? By now, you know
    the answer: It''s the board of directors (read: owner, partner, shareholders,
    etc.). Only the board can accept risk, and therefore only the board can set the
    risk appetite for the company. This appetite may change over time, but even the
    changes are governed by the board.


    The implication here is clear: A board must understand the consequences of cybersecurity
    decisions and thereby set the correct appetite for what''s acceptable risk and
    what is not. The issue is that most boards are excellent at understanding business
    strategy and managing business risk, but are—let''s say—*challenged* when it comes
    to cybersecurity.


    For example, a board may well understand the need to *digitally transform the
    business* because that is a business problem involving a response to market conditions.
    They may not fully understand the technologies necessary to achieve this transformation,
    but they understand enough about the environment to be able to navigate it. They
    place their trust in their CIOs and CTOs, monitor the transformation progress
    based on business (not technology) metrics, and depend on their C‐level execs
    to make sure that the appropriate technologies have been evaluated, vetted, and
    implemented in accordance with board strategy.


    Similarly, a good board knows how to manage risk. Depending on the size of the
    organization (and the board), there are risk committees and risk officers involved
    that inform the board. The board weighs all the recommendations and sets the risk
    appetite for the best interests of the business. In short, the board exercises
    their "due care" responsibilities. In the absence of a board, the owner(s) perform
    the same function. They set the risk appetite and accept the residual risk.


    Enter cybersecurity risk. Now, we''re talking a foreign language. And I don''t
    mean Chinese, Greek, or Spanish—I''m talking Klingon‐level foreign! You walk into
    a conference room and start throwing around *threat landscape* and *brute force*
    and *man‐in‐the‐middle* attacks, sprinkle in a bit of *network worms* and *ransomware,*
    and the room goes eerily quiet. The vast majority of business‐people can''t even
    begin to weigh risk with this information.


    That''s when they can fall into what I call the *compliance trap*. It is a common
    pitfall—people confuse cybersecurity with compliance. Boards do it. Executives
    do it. Even middle managers and employees do it. But don''t *you* do it! Being
    compliant doesn''t mean you''re cybersecure! It means you''re compliant. That''s
    all. Don''t associate risk appetite to equal *minimum required compliance*.


    You need to do cybersecurity correctly.


    This is where you, and this book, come in. Your job is to align the board''s strategy
    with the right cybersecurity program. You will need to educate in plain business
    language what the risks are (operational risks, reputational risks, regulatory
    risks, etc.) and explain what the options are to mitigate all of these risks with
    their associated costs.


    You will also need to show how one decision about one control can affect the performance
    of others and how it may affect your defense‐in‐depth strategy by either strengthening
    it or weakening it.


    When all is said and done, you''ll need to leave the board with a set of recommendations
    on what you think best aligns their vision, strategy, and risk appetite with your
    cybersecurity program, and let them do their job. You''ve done yours!


    # Chapter 5: Your Cybersecurity Program: A High‐Level Overview


    When it comes to designing a cybersecurity program, what is the most important
    thing to know before you begin? You need to know where you are right now. If you
    don''t know where you are, the first step you take may be over the cliff, so please
    don''t do that. You haven''t even finished the book yet!


    For every business there is a vision, a mission, and one or more goals. This may
    seem trivial, but it is very important to put those down on paper. If it is your
    business, then you already know them. You may need to develop them a bit further,
    but in essence, you do know them, even if you think you don''t.


    ## Vision and Mission Statements


    A mission statement is your company''s *raison d''être*. It''s as existential
    as it gets. It tells the world why you exist. A vision statement, on the other
    hand, is more directional than it is existential. One is *who and why we are,*
    the other is *what we are*. The website [TopNonProfits.com](http://TopNonProfits.com)
    has collected the top vision and mission statements for several nonprofits. I
    have taken a few and paired them up to show the difference between mission (top)
    and vision (bottom) statements:


    ### ASPCA


    *   **Mission**: To provide effective means for the prevention of cruelty to animals
    throughout the United States.

    *   **Vision**: That the United States is a humane community in which all animals
    are treated with respect and kindness.


    ### Cleveland Clinic


    *   **Mission**: To provide better care of the sick, investigation into their
    problems, and further education of those who serve.

    *   **Vision**: Striving to be the world''s leader in patient experience, clinical
    outcomes, research, and education.


    ### Creative Commons


    *   **Mission**: Creative Commons develops, supports, and stewards legal and technical
    infrastructure that maximizes digital creativity, sharing, and innovation.

