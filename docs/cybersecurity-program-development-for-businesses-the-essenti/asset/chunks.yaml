- raw: '## Preventative Controls


    Preventative controls are the road barriers of the information highway. They are
    designed to stop an attacker from getting to an asset. If the asset involves physical
    protection, then a good example of a preventative control would be security guards.
    Digital equivalents of the security guard include:


    *   *Antivirus and antimalware applications*. Typically lumped under endpoint
    protection systems, these are mostly signature‐based applications that scan traffic,
    compare it against a known database of threats, and decide accordingly. What I
    mean by signature is that these viruses and malware programs, once discovered,
    are found to have a unique look, like a signature. That makes them identifiable
    to the antivirus and antimalware applications. They now know what to look for.
    These applications are as good as their signature databases and their frequency
    of update, although the best‐of‐breed versions employ heuristic analysis to predict
    possible malware as well as sophisticated interfaces across applications (such
    as email, web browsers, mobile apps, and so on). My recommendation: Don''t turn
    on a computer without one installed and up to date.


    *   *Cybersecurity awareness training*. Discussed earlier, employee awareness
    is one of the most effective preventative controls. Training consists of onsite
    and on‐demand training for all employees. The most effective versions employ a
    blend of delivery methods, repeat at least twice a year, and include followups
    such as short quizzes to keep everyone on their toes.


    *   *Data loss prevention (DLPs)*. Designed to ensure that sensitive data stays
    where it belongs, these systems operate across several layers in an organization.
    Depending on configuration, a DLP will look for specific types of data (credit
    card numbers, Social Security numbers, account numbers, etc.) and make sure they
    are being accessed by authorized users only. A DLP can also inspect traffic to
    make sure that sensitive information is not on the move, be it on a network, an
    external storage device (e.g., a USB drive), or even a printer. DLPs are as good
    as their configuration and upkeep, so you need to be particularly sensitive in
    making sure that they constantly know your data environment and your security
    policies. When correctly deployed, they can be a powerful preventative control,
    which plays well with others, and is one of the few that can alert you to a possible
    insider threat.


    *   *Firewalls*. These are appliances meant to segregate the inside (company)
    network from the Internet. They come in several flavors ranging in capabilities,
    configuration options, and complexity. There are firewalls that encrypt data as
    well as monitor traffic. Others monitor traffic and compare it against malware
    signatures. Still other firewalls do all of the preceding and more. Keep in mind
    that a firewall is as good as its configuration. An erroneously configured firewall,
    or one that is poorly maintained, is useless. Your specific control requirements
    will dictate which kind and how many firewalls to deploy, as well as how they
    are configured.


    *   *Gateways*. Gateways monitor and control Internet traffic coming and going
    from your company servers. Let''s say you call up a web page on a company computer.
    You can have a gateway that senses your request for a web page, segregates it
    from other traffic, disguises it, even encrypts it, and then sends it out. Why
    do this? Because if the request is intercepted, the intercepting person doesn''t
    get your address; he or she only sees the gateway instead. In this example, this
    gateway would be called a (web) proxy server: a device designed to hide the other
    internal devices from the Internet by managing each session and exposing only
    itself to the outside world. You can have an application‐level gateway, which
    is focused on services, or a circuit‐level gateway that monitors, for example,
    a specific communications protocol across all services. Most firewalls and proxy
    servers perform network address translation (NAT), which is a way to map internal
    nonroutable device addresses (that cannot be used on the Internet) to external
    Internet‐acceptable addresses.


    *   *Intrusion prevention systems (IPSs)*. These systems complement the panoply
    of firewalls, antivirus and antimalware systems by introducing a systems monitoring
    layer. Unlike IDS, which looks for a signature, an IPS will be tuned to what constitutes
    normal behavior on your networks. The moment something happens outside that frame,
    an IPS raises the alarm. An alarm in this context includes not only logging the
    event but also the ability to terminate connections. An example of a well‐tuned
    IPS response would be the immediate termination of file encryption activity taking
    place unexpectedly, usually the result of a ransomware attack. Of course, if your
    *normal* is all over the map and no baseline can be established, then the IPS
    may become difficult to tune and could produce many false positives as a result.


    ## Detective Controls


    If the preventive controls are the road barriers, the detective controls are the
    motion sensors that let you know that someone is in the room. The idea behind
    them is to detect abnormalities and raise the alarm. Some controls listed as examples
    under preventive controls work here as well—for example, antivirus and antimalware
    systems and intrusion prevention systems can be considered both preventive and
    detective. Other examples of detective controls include:


    *   *Intrusion detection systems (IDSs)*. These are essentially antivirus and
    antimalware systems on steroids, using a combination of signature‐based analysis
    (comparing traffic not only to known signatures of viruses and malware but to
    specific attack patterns), and anomaly analysis (comparing expected normal system
    behavior to current state). IDS can vary in intelligence and efficacy, depending
    on which system you deploy. Some use artificial intelligence applications to learn
    from their environment and therefore become better at detecting an attack. IDS
    integrates into the larger suite of controls by providing extensive event logging,
    automated responses and triggering of downstream controls, and organization security
    policy enforcement. That last one is a set of rules that your cybersecurity department
    has painstakingly established to address control and notification behavior across
    systems. Heady stuff.


    *   *Security information and event management systems (SIEMs)*. These are applications
    that combine both detection and response management. They combine analysis of
    event logs across multiple systems, event correlation, abnormal event detection,
    notification, automated actions, and response event tracking. As you can imagine,
    the volume of logs and events has risen exponentially and can be properly managed
    only by a good SIEM. If forced to choose, I would deploy a SIEM before an IDS,
    because as far as I am concerned, a solid SIEM will provide greater insight and
    coordination across the enterprise than any IDS will.


    ## Corrective Controls


    Like the name implies, these are controls that focus on repairing damage during
    or after an attack. Many targeted controls fall in this category: For example,
    vulnerability patching is a corrective control. Keeping your systems current—meaning,
    most recent operating system release as well as application releases—also represents
    corrective control, because it patches (corrects) known vulnerabilities.


    But the ultimate corrective control is backup, and that''s worth spending some
    time on. There no substitute to the feeling of relief that you will have when
    you know that you have a good, solid, backup set from which you can restore your
    data. To get there, you need to understand the kinds of backup that are available
    to you, and when to use which kind.'
