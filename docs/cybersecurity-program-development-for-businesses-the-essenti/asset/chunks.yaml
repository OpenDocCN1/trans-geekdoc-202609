- raw: "Smart organizations recognize this and get in front of it by training the\
    \ users and allowing some (if not all) of the flexibility that this “IT on demand”\
    \ allows. It's all about training and control. To the degree that the users understand\
    \ the risk and the implications, and to the degree that appropriate controls are\
    \ in place, let them go forth and conquer! Who knows? They may discover a solution\
    \ that disrupts the company for the better, and that solution becomes the adopted\
    \ standard. But they can also discover the pits of Hell, which is why the controls\
    \ are there so that only a few users get scorched and the organization as a whole\
    \ remains unharmed.\n\nThis brings us to the more conscious choice of a hybrid‐cloud\
    \ solution. The typical scenario is one in which a set of applications cannot\
    \ be delivered over the cloud, requiring local infrastructure, while other sets\
    \ can. Equally common is to see an on‐premise private cloud–public cloud deployment.\
    \ That's the ultimate hybrid! What does that look like? You have a set of applications\
    \ that must be on‐premises (let's say, for example, your accounting system). You\
    \ have a data application that you need to scale on demand, and that's on a private\
    \ cloud. You also have the company email coming from a public‐cloud provider.\
    \ There you go! Full‐bore hybrid!\n\nThe security considerations, of course, don't\
    \ change much. But they are additive. You need to make sure that each one of these\
    \ environments is addressed properly, has its own cybersecurity strategy and controls,\
    \ and is assessed regularly. You know all about the on‐premises requirements,\
    \ and now you have some sense of what you need to look at for both public and\
    \ private clouds. Put them all in the mix, and you've got yourself the hybrid‐cloud\
    \ cybersecurity considerations.\n\nBefore we wrap up our computing environments\
    \ review, I would like you to consider two things: First, evaluating a *cloud*\
    \ solution is not about evaluating a *technology* solution. You're evaluating\
    \ a business solution. The work you need to do to satisfy yourself on its fit\
    \ and applicability is closer to a business acquisition due diligence issue than\
    \ a technology assessment.\n\nSecond, it is highly probable that as you're starting\
    \ down your cybersecurity journey, one or more cloud solutions will already be\
    \ in place. Now, we are adding not just a business due diligence exercise, but\
    \ an asset discovery one as well. There's data up in those clouds! And you need\
    \ to discover them and treat them like the valuable assets they are.\n\nWhen it\
    \ comes to understanding what's already out there, you need to use all the asset\
    \ discovery and classification skills that you already learned in our Assets chapter.\
    \ You'll need to engage with stakeholders, identify the assets, understand the\
    \ corresponding workflows, and document the full life cycle of the assets. What\
    \ services are being used on the assets? Where from? Who controls them? Who monitors\
    \ for incidents? What's the reporting like? What happens in regard to business\
    \ continuity and disaster recovery? Who are the asset's custodians? Who's responsible\
    \ for compliance? Who's responsible for any cross‐border issues? And so on. By\
    \ now, you're an old hand at this!\n\n## The Internet of Things (IoT)\n\nIn July\
    \ 2016, *Business Insider* predicted that by 2020 there will be 34 billion devices\
    \ connected to the Internet, with a corresponding six‐trillion‐dollar spend. In\
    \ the business world, the primary drivers of this expansion will be operating\
    \ efficiency and increased productivity. Meanwhile, a day doesn't go by when you\
    \ don't read about the new smart home or smart office, the new smart cities, the\
    \ connected cars, and, of course, the wearables like FitBit, Garmin, Apple Watch,\
    \ and the like.\n\nWhy is this important to you in our cybersecurity context?\
    \ Because if you have a smart thermostat in your office that is connected to your\
    \ network and the device is not secure, then you might as well leave the door\
    \ unlocked with a big neon sign welcoming anyone in.\n\nThe unfortunate reality\
    \ is that these devices crept into corporate use while no one was looking. Certainly,\
    \ the cybersecurity department wasn't informed that a smart refrigerator was being\
    \ plugged in at the company cafeteria. IT wasn't notified, either. Why would they\
    \ be, right? Somebody at facilities spoke with the vendor and gave the vendor\
    \ the Wi‐Fi password, and they were razzle‐dazzled by the pretty colors on the\
    \ refrigerator's screen.\n\nGiven their pervasiveness, IoT devices represent a\
    \ clear and present danger to your cybersecurity program. You will need to follow\
    \ a rigorous set of steps to make sure IoT doesn't come back to haunt you later.\
    \ Namely:\n\n*   *Extensive inventory of all IoT devices*. You'll need to get\
    \ with both IT and relevant departments (for example, facilities, security, audiovisual,\
    \ and so forth) and go through every device that is Internet‐enabled. What do\
    \ they do? Why are they there? And, of course, where are they?\n\n*   *Configuration\
    \ analysis of all IoT devices*. Depending on the number of devices in play, this\
    \ task alone can be hours of uninterrupted fun. You'll need to know what exactly\
    \ is running in your environment, but that's just the beginning. You also need\
    \ the gory details, like: What sorts of data are going through the devices, what\
    \ are the corresponding data‐loss profiles, what are the risks of compromise to\
    \ the devices, and how do these IoT devices fit into your incident‐response, business\
    \ continuity, and disaster recovery planning.\n\n*   *Securing the IoT devices*.\
    \ Now that you know the nature, location, and configuration of the devices, you'll\
    \ need to secure them. This sounds a lot easier than it is. Some of these devices\
    \ do not have any security capabilities at all because the manufacturers, driven\
    \ by low margins, couldn't care less about security, patching, and software configurations.\
    \ That leaves you holding the bag. If the software on the device cannot be secured,\
    \ you'll need to seriously think about either eliminating the device altogether,\
    \ or air‐gapping it (not connecting it to the network).\n\n*   *Rinse, lather,\
    \ repeat*. Granted, doing this exercise once sets the baseline IoT posture for\
    \ your company. But that is not enough. You will need to stay on top of this.\
    \ Devices are introduced all the time. Some are even brought into the organization\
    \ by unsuspecting users. Consider, for example, some newfangled wearable (but\
    \ unsecured!) device walking through the door and immediately connecting to your\
    \ Wi‐Fi through the user's cell phone credentials. It's like Bring Your Children\
    \ to Work Day, but with electronics! You therefore must constantly be scanning\
    \ the network for any unauthorized attempts to connect. Your default should be\
    \ to deny all unless authorized at the media access control (or mac) address level.\
    \ Moreover, as part of your cybersecurity awareness program, you need to make\
    \ sure that people understand the implications of IoT and how it can potentially\
    \ become the company's *Kerkoporta,* which, unless you were really paying attention\
    \ to your Byzantine history lectures, you may not know what it is!\n\n    Kerkoporta\
    \ (*Greek: Κερκóπορτα*) was a small, unattended doorway along the fortified walls\
    \ of Constantinople, which was allegedly left unlocked and unchecked, thereby\
    \ allowing the Ottoman troops to enter and sack the city. Thus, no more Constantinople!\
    \ We have Istanbul instead. Lesson learned: Keep all your gates attended and locked!\n\
    \nThere are currently a lot of efforts by industry groups—such as the Industrial\
    \ Internet Consortium (IIC), which has rolled out the Industrial Internet Security\
    \ Framework (you guessed it: IISF)—and by both domestic and international regulators,\
    \ all voicing their concerns about security and privacy in the IoT. For example,\
    \ the U.S. Senate introduced (and later reintroduced) S.2607, the *Developing\
    \ Innovation and Growing the Internet of Things* Act, aka *The DIGIT Act*. We\
    \ can't make this stuff up, but there you have it!"
