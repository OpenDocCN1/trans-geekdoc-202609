- raw: "These reports and others like them offer you an understanding of what were\
    \ the prevalent *hows* in the previous year. You can extrapolate from that (who\
    \ was at play last year, using which tool?) and make reasonable assumptions and\
    \ decisions that will affect your choice and tuning of your cybercontrols. What\
    \ these reports do not give you is a sense of what is happening right now.\n\n\
    You need the *when*.\n\n## Threat Intelligence\n\nTo get that information, you\
    \ will need real‐time threat intelligence. This intelligence will provide you\
    \ with clues about the types of likely payloads and who is currently using them.\
    \ For example:\n\n*   What kind of malware has just been released?\n\n*   What\
    \ new vulnerabilities have been discovered, and what's being done to address them?\n\
    \n*   What attacks are in progress?\n\n*   What's the current buzz on the dark\
    \ web?\n\nThreat intelligence will also gather information from inside your organization\
    \ and provide insight on everything from the state of equipment to who is accessing\
    \ what, when, any abnormal behavior and traffic, etc.\n\nAs you can imagine, the\
    \ amount of data involved in threat intelligence is massive. Moreover, processing\
    \ and making sense of the threat intelligence data requires expertise and dedication.\
    \ Someone in your staff with cybersecurity and technology training needs to be\
    \ charged with making sense of the data and providing the necessary feedback and\
    \ recommendations.\n\nDoing this involves threat intelligence tools and feeds\
    \ (both private and public). I highly recommend picking one of the top‐tier vendors,\
    \ installing (or subscribing to) their solution, and dedicating the right personnel\
    \ to monitor and advise. Otherwise, you may find yourself trying to empty the\
    \ ocean one teaspoonful at a time.\n\nIf you really want to take a crack at threat\
    \ intelligence on your own, you will find many places with public feeds.\n\n*\
    \   LookingGlass Threat Map: [https://map.lookingglasscyber.com](https://map.lookingglasscyber.com)\n\
    \n*   AlienVault's Open Threat Exchange: [https://otx.alienvault.com](https://otx.alienvault.com)\n\
    \n*   Threat Intelligence Review's Cybersecurity Intelligence Feed Reviews: [http://threatintelligencereview.com](http://threatintelligencereview.com)\n\
    \nFurthermore, most cybersecurity vendors produce free threat intelligence reports\
    \ on a regular basis. For example:\n\n*   CISCO's Security Advisories and Alerts:\
    \ [https://tools.cisco.com/security/center/publicationListing.x#∼Threats](https://tools.cisco.com/security/center/publicationListing.x#~Threats)\n\
    \n*   McAfee's Threat Center: [http://www.mcafee.com/au/threat‐center.aspx](http://www.mcafee.com/au/threat-center.aspx)\n\
    \n*   Symantec's Security Response: [https://www.symantec.com/security\\_response](https://www.symantec.com/security_response)\n\
    \n*   Bitdefender's E‐Threats Landscape Reports: [http://www.bitdefender.com/site/view/e‐threats\\\
    _reports.html](http://www.bitdefender.com/site/view/e-threats_reports.html)\n\n\
    If a formal threat intelligence solution is not appropriate to your size company,\
    \ then, at a minimum, I recommend that you review these reports on a regular basis.\n\
    \n## Threat Modeling\n\nIs there some sort of organized methodology for all this?\
    \ You bet! In fact, threat‐risk modeling is a vast discipline. It's PhD‐level\
    \ stuff, with some of the best and brightest minds in risk management, cybersecurity,\
    \ and technology working on it day and night. The following is a very, very small\
    \ sampling of their work.\n\n*   Several years back, Microsoft developed STRIDE\
    \ to replace their older threat classification DREAD. DREAD stood for: *Damage\
    \ Potential, Reproducibility, Exploitability, Affected Users,* and *Discoverability*.\
    \ But STRIDE stands for *Spoofing* (of a user's identity)*, Tampering, Repudiation,\
    \ Information disclosure, Denial of Service* and *Elevation of privilege*.\n\n\
    *   TRIKE, which doesn't stand for anything in particular, is an open‐source threat‐modeling\
    \ tool created by Brenda Larcom and Eleanor Saitta. Their claim to fame is its\
    \ granular, risk‐based approach. TRIKE's great spreadsheet and help file are free\
    \ to download from [octotrike.org](http://octotrike.org).\n\n*   Carnegie Mellon\
    \ University's Software Engineering Institute, in collaboration with CERT, developed\
    \ OCTAVE, which is currently considered to be one of the best threat‐modeling\
    \ frameworks and toolsets. OCTAVE comes in three sizes: the original OCTAVE for\
    \ large enterprises, OCTAVE‐S for smaller companies, and OCTAVE Allegro, which\
    \ is a narrower, information‐asset‐focused version.\n\nWhen it comes to the total\
    \ universe of frameworks, tools, and resources available for threat analysis,\
    \ this list doesn't even begin to scratch the surface. The subject matter is vast,\
    \ and unless you are at a minimum a cybersecurity professional—or better yet,\
    \ a threat researcher—you can quickly become overwhelmed. Even the well‐meaning,\
    \ beautifully curated open‐source community sites with the latest threat intelligence\
    \ can quickly make you feel like you're trying to drink from a fire hose.\n\n\
    So, what do you do? Take it a step at a time, use the resources at your disposal\
    \ appropriately, and trust yourself.\n\nI am hoping that by now I don't need to\
    \ tell you that threat assessments are dynamic: What is a threat today may be\
    \ moot tomorrow. You need to remain vigilant in your efforts to stay current with\
    \ what is going on in cyberspace. Money and effort spent to protect yourself from\
    \ one threat must be redirected to protect you from the new threats that have\
    \ surfaced.\n\nCybersecurity will never be something you can do once and forget.\
    \ It must always be present in your thinking and your planning. Much as we consider\
    \ healthy living to include proper nutrition and exercise, good cyberliving includes\
    \ proper cybersecurity practices.\n\nBoth are a way of life.\n\n# CHAPTER 8  \n\
    \nVulnerabilities\n\nAs we've discussed, the ugly truth about vulnerabilities\
    \ is that every system has them! Every single one. And we're not just talking\
    \ about a couple of issues here and there. Think thousands upon thousands, with\
    \ more being discovered every day. Our goal is to identify the ones applicable\
    \ to our environment and deal with them. To do that, we'll need a list.\n\nSo,\
    \ off we go searching for vulnerabilities listings. It should be no surprise that\
    \ one of the first entries that comes up is NIST's National Vulnerability Database\
    \ (NVD). At the time of this writing, the NVD contained the following information.\n\
    \n*   79,261 CVE vulnerabilities (CVE: Common vulnerabilities and exposures from\
    \ MITRE, a nonprofit that operates several R&D centers)\n\n*   368 Checklists\
    \ (Detailed guidance on operating and application security settings)\n\n*   249\
    \ US‐CERT Alerts (U.S. Computer Emergency Readiness Team)\n\n*   4,455 US‐CERT\
    \ Vuln notes (U.S. Computer Emergency Readiness Team Vulnerability Notes)\n\n\
    *   10,286 OVAL Queries (Another MITRE‐coordinated effort on standardizing reporting\
    \ on machine states for computers)\n\n*   115,051 CPE Names (Common platform enumeration:\
    \ A structured naming methodology for information technology assets)\n\n## Who\
    \ Is Who in Vulnerabilities Tracking\n\nKeep working the list and you'll run into\
    \ all the usual suspects: MITRE, OWASP, CERT, and several security vendors. The\
    \ situation can quickly become confusing and overwhelming. If you thought threat\
    \ assessment was a bear, welcome to vulnerability assessments!\n\nIt is worth\
    \ your while to understand the sources of vulnerabilities data because you will\
    \ need to refer to them as you apply them to your specific business.\n\nBefore\
    \ we take the plunge, let's make sure we know what we are looking at. What exactly\
    \ are these vulnerabilities? It's useful to refer back to NIST's definition once\
    \ more: *Vulnerabilities are weakness in an information system, system security\
    \ procedures, internal controls, or implementation that could be exploited or\
    \ triggered by a threat source*."
  fmt: '

    These reports and others like them offer you an understanding of what were the
    prevalent *hows* in the previous year. You can extrapolate from that (who was
    at play last year, using which tool?) and make reasonable assumptions and decisions
    that will affect your choice and tuning of your cybercontrols. What these reports
    do not give you is a sense of what is happening right now.


    You need the *when*.


    ## Threat Intelligence


    To get that information, you will need real‐time threat intelligence. This intelligence
    will provide you with clues about the types of likely payloads and who is currently
    using them. For example:


    *   What kind of malware has just been released?

    *   What new vulnerabilities have been discovered, and what''s being done to address
    them?

    *   What attacks are in progress?

    *   What''s the current buzz on the dark web?


    Threat intelligence will also gather information from inside your organization
    and provide insight on everything from the state of equipment to who is accessing
    what, when, any abnormal behavior and traffic, etc.


    As you can imagine, the amount of data involved in threat intelligence is massive.
    Moreover, processing and making sense of the threat intelligence data requires
    expertise and dedication. Someone in your staff with cybersecurity and technology
    training needs to be charged with making sense of the data and providing the necessary
    feedback and recommendations.


    Doing this involves threat intelligence tools and feeds (both private and public).
    I highly recommend picking one of the top‐tier vendors, installing (or subscribing
    to) their solution, and dedicating the right personnel to monitor and advise.
    Otherwise, you may find yourself trying to empty the ocean one teaspoonful at
    a time.


    If you really want to take a crack at threat intelligence on your own, you will
    find many places with public feeds.


    *   LookingGlass Threat Map: <https://map.lookingglasscyber.com>

    *   AlienVault''s Open Threat Exchange: <https://otx.alienvault.com>

    *   Threat Intelligence Review''s Cybersecurity Intelligence Feed Reviews: <http://threatintelligencereview.com>


    Furthermore, most cybersecurity vendors produce free threat intelligence reports
    on a regular basis. For example:


    *   CISCO''s Security Advisories and Alerts: <https://tools.cisco.com/security/center/publicationListing.x#∼Threats>

    *   McAfee''s Threat Center: <http://www.mcafee.com/au/threat‐center.aspx>

    *   Symantec''s Security Response: <https://www.symantec.com/security_response>

    *   Bitdefender''s E‐Threats Landscape Reports: <http://www.bitdefender.com/site/view/e‐threats_reports.html>


    If a formal threat intelligence solution is not appropriate to your size company,
    then, at a minimum, I recommend that you review these reports on a regular basis.


    ## Threat Modeling


    Is there some sort of organized methodology for all this? You bet! In fact, threat‐risk
    modeling is a vast discipline. It''s PhD‐level stuff, with some of the best and
    brightest minds in risk management, cybersecurity, and technology working on it
    day and night. The following is a very, very small sampling of their work.


    *   Several years back, Microsoft developed `STRIDE` to replace their older threat
    classification `DREAD`. `DREAD` stood for: *Damage Potential, Reproducibility,
    Exploitability, Affected Users,* and *Discoverability*. But `STRIDE` stands for
    *Spoofing* (of a user''s identity)*, Tampering, Repudiation, Information disclosure,
    Denial of Service* and *Elevation of privilege*.

    *   `TRIKE`, which doesn''t stand for anything in particular, is an open‐source
    threat‐modeling tool created by Brenda Larcom and Eleanor Saitta. Their claim
    to fame is its granular, risk‐based approach. `TRIKE`''s great spreadsheet and
    help file are free to download from <http://octotrike.org>.

    *   Carnegie Mellon University''s Software Engineering Institute, in collaboration
    with `CERT`, developed `OCTAVE`, which is currently considered to be one of the
    best threat‐modeling frameworks and toolsets. `OCTAVE` comes in three sizes: the
    original `OCTAVE` for large enterprises, `OCTAVE‐S` for smaller companies, and
    `OCTAVE Allegro`, which is a narrower, information‐asset‐focused version.


    When it comes to the total universe of frameworks, tools, and resources available
    for threat analysis, this list doesn''t even begin to scratch the surface. The
    subject matter is vast, and unless you are at a minimum a cybersecurity professional—or
    better yet, a threat researcher—you can quickly become overwhelmed. Even the well‐meaning,
    beautifully curated open‐source community sites with the latest threat intelligence
    can quickly make you feel like you''re trying to drink from a fire hose.


    So, what do you do? Take it a step at a time, use the resources at your disposal
    appropriately, and trust yourself.


    I am hoping that by now I don''t need to tell you that threat assessments are
    dynamic: What is a threat today may be moot tomorrow. You need to remain vigilant
    in your efforts to stay current with what is going on in cyberspace. Money and
    effort spent to protect yourself from one threat must be redirected to protect
    you from the new threats that have surfaced.


    Cybersecurity will never be something you can do once and forget. It must always
    be present in your thinking and your planning. Much as we consider healthy living
    to include proper nutrition and exercise, good cyberliving includes proper cybersecurity
    practices.


    Both are a way of life.


    # Chapter 8: Vulnerabilities


    As we''ve discussed, the ugly truth about vulnerabilities is that every system
    has them! Every single one. And we''re not just talking about a couple of issues
    here and there. Think thousands upon thousands, with more being discovered every
    day. Our goal is to identify the ones applicable to our environment and deal with
    them. To do that, we''ll need a list.


    So, off we go searching for vulnerabilities listings. It should be no surprise
    that one of the first entries that comes up is `NIST`''s National Vulnerability
    Database (`NVD`). At the time of this writing, the `NVD` contained the following
    information.


    *   79,261 `CVE` vulnerabilities (`CVE`: Common vulnerabilities and exposures
    from `MITRE`, a nonprofit that operates several R&D centers)

    *   368 Checklists (Detailed guidance on operating and application security settings)

    *   249 `US‐CERT` Alerts (U.S. Computer Emergency Readiness Team)

    *   4,455 `US‐CERT` Vuln notes (U.S. Computer Emergency Readiness Team Vulnerability
    Notes)

    *   10,286 `OVAL` Queries (Another `MITRE`‐coordinated effort on standardizing
    reporting on machine states for computers)

    *   115,051 `CPE` Names (Common platform enumeration: A structured naming methodology
    for information technology assets)


    ## Who Is Who in Vulnerabilities Tracking


    Keep working the list and you''ll run into all the usual suspects: `MITRE`, `OWASP`,
    `CERT`, and several security vendors. The situation can quickly become confusing
    and overwhelming. If you thought threat assessment was a bear, welcome to vulnerability
    assessments!


    It is worth your while to understand the sources of vulnerabilities data because
    you will need to refer to them as you apply them to your specific business.


    Before we take the plunge, let''s make sure we know what we are looking at. What
    exactly are these vulnerabilities? It''s useful to refer back to `NIST`''s definition
    once more: *Vulnerabilities are weakness in an information system, system security
    procedures, internal controls, or implementation that could be exploited or triggered
    by a threat source*.

    '
  trans: '

    这些报告及其他同类报告能让你了解上一年盛行的*手段*。你可以由此推断（去年是谁在活动，使用了什么工具？），并做出合理的假设和决策，这将影响你对网络控制措施的选择和调优。这些报告无法给你的是对当前正在发生什么的感知。


    你需要*时间点*信息。


    ## 威胁情报


    要获取该信息，你将需要实时威胁情报。这种情报将为你提供关于可能的载荷类型以及当前正在使用它们的人员的线索。例如：


    *   刚刚发布了什么类型的恶意软件？

    *   发现了什么新漏洞，正在采取什么措施来应对？

    *   正在进行什么攻击？

    *   暗网上目前的热门话题是什么？


    威胁情报还将收集你组织内部的信息，并提供从设备状态到谁在何时访问了什么、任何异常行为和流量等方面的洞察。


    正如你所想象的，威胁情报涉及的数据量巨大。此外，处理和理解威胁情报数据需要专业知识和投入。你团队中具备网络安全和技术培训背景的人员需要负责解读数据，并提供必要的反馈和建议。


    做这项工作涉及威胁情报工具和源（包括私有和公共）。我强烈建议选择一家一流供应商，安装（或订阅）其解决方案，并指派合适的人员进行监控和建议。否则，你可能会发现自己试图用一茶匙一茶匙地舀干大海。


    如果你真的想自行尝试威胁情报，你会发现许多提供公共源的地方。


    *   LookingGlass 威胁地图：<https://map.lookingglasscyber.com>

    *   AlienVault 开放威胁交换平台：<https://otx.alienvault.com>

    *   威胁情报评论的网络安全情报源评测：<http://threatintelligencereview.com>


    此外，大多数网络安全供应商定期发布免费的威胁情报报告。例如：


    *   CISCO 安全通告和警报：<https://tools.cisco.com/security/center/publicationListing.x#∼Threats>

    *   McAfee 威胁中心：<http://www.mcafee.com/au/threat‐center.aspx>

    *   Symantec 安全响应：<https://www.symantec.com/security_response>

    *   Bitdefender 电子威胁态势报告：<http://www.bitdefender.com/site/view/e‐threats_reports.html>


    如果正式的威胁情报解决方案不适合你公司的规模，那么，至少我建议你定期查阅这些报告。


    ## 威胁建模


    这方面有没有什么有组织的方法论？肯定有！事实上，威胁风险建模是一门广博的学科。这是博士级别的内容，风险管理、网络安全和技术领域最优秀、最聪明的大脑日夜钻研于此。以下只是他们工作的极小一部分。


    *   几年前，微软开发了 `STRIDE` 来取代他们较旧的威胁分类 `DREAD`。`DREAD` 代表：*损害潜力、可重现性、可利用性、受影响用户*
    和 *可发现性*。而 `STRIDE` 代表 *欺骗*（用户身份）*、篡改、抵赖、信息泄露、拒绝服务* 和 *权限提升*。

    *   `TRIKE` 这个名字没有特定含义，是由 Brenda Larcom 和 Eleanor Saitta 创建的一个开源威胁建模工具。其成名之处在于其颗粒度细致、基于风险的方法。`TRIKE`
    的电子表格和帮助文件可从 <http://octotrike.org> 免费下载。

    *   卡内基梅隆大学软件工程研究所与 `CERT` 合作开发了 `OCTAVE`，目前被认为是最好的威胁建模框架和工具集之一。`OCTAVE` 有三个规模：面向大型企业的原始
    `OCTAVE`、面向小型公司的 `OCTAVE‐S`，以及 `OCTAVE Allegro`，后者是一个范围更窄、专注于信息资产的版本。


    就可用于威胁分析的框架、工具和资源的总体而言，这份清单甚至还没触及皮毛。主题内容极其广泛，除非你起码是一名网络安全专业人员——更别说威胁研究员了——否则你会很快感到不知所措。即使是初衷良好、精心策划且拥有最新威胁情报的开源社区网站，也能迅速让你感觉像是在试图从消防水带中喝水。


    那么，你该怎么办？循序渐进，适当利用你可用的资源，并相信自己。


    我希望到现在我不需要告诉你威胁评估是动态的：今天的威胁明天可能就无关紧要了。你需要在保持对网络空间动态了解的努力中保持警惕。用于保护自己免受一种威胁的资金和精力，必须重新分配以保护你免受新出现的威胁。


    网络安全永远不会是一次性的工作。它必须始终存在于你的思考和规划中。正如我们将健康生活视为包括合理营养和锻炼，良好的网络生活也包括适当的网络安全实践。


    两者都是一种生活方式。


    # 第 8 章：漏洞


    正如我们所讨论的，关于漏洞的残酷真相是每个系统都有漏洞！每一个都是。我们说的不仅仅是这里那里的几个问题。想想成千上万个，而且每天都在发现更多。我们的目标是识别适用于我们环境的漏洞并加以处理。为此，我们需要一份清单。


    那么，我们开始寻找漏洞列表吧。毫不奇怪，首先出现的条目之一是 `NIST` 的国家漏洞数据库（`NVD`）。在撰写本文时，`NVD` 包含以下信息。


    *   79,261 个 `CVE` 漏洞（`CVE`：来自 `MITRE` 的通用漏洞披露，MITRE 是一家运营多个研发中心的非营利组织）

    *   368 份核对清单（关于操作系统和应用程序安全设置的详细指导）

    *   249 条 `US‐CERT` 警报（美国计算机应急响应小组）

    *   4,455 条 `US‐CERT` 漏洞说明（美国计算机应急响应小组漏洞说明）

    *   10,286 个 `OVAL` 查询（另一个由 `MITRE` 协调的标准化计算机机器状态报告工作）

    *   115,051 个 `CPE` 名称（通用平台枚举：一种用于信息技术资产的结构化命名方法）


    ## 漏洞跟踪中的主要参与者


    继续查找列表，你会遇到所有常见的“老面孔”：`MITRE`、`OWASP`、`CERT` 以及多家安全供应商。局势可能迅速变得混乱且令人不知所措。如果你以为威胁评估很棘手，欢迎来到漏洞评估的世界！


    了解漏洞数据的来源很值得，因为在将它们应用到你的特定业务时，你需要参考它们。


    在深入之前，让我们确保知道我们在看什么。这些漏洞到底是什么？再次参考 `NIST` 的定义很有用：*漏洞是指信息系统、系统安全程序、内部控制或实现中的弱点，可能被威胁源利用或触发*。

