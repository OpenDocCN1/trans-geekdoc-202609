    Of course, as much as I wanted to put in *“CEO Blog”* as *“Mission‐Critical”*
    with *“No Impact,”* I was advised against it, and left the entry blank. After
    all, how many mission‐critical systems do you know that have no impact? (The rest
    of the examples are also to be taken with a grain of salt. Or two. Used only for
    demonstration purposes. Please don''t send hate mail. Thank you.)


    Another example of a table you can derive is shown in [Table 6.7](#c06.xhtml#c06-tbl-0007).


    You can derive any combination you need, and many you don''t: Criticality by Location,
    Impact by Asset/System, Resources by MTD. Each one can provide different insight
    on how to best manage the overall risk to the organization.


    There is one more thing left to do. You need to assign a financial value to all
    of these assets (systems, and others) that you have so painstakingly cataloged,
    indexed, assessed, inventoried, and reviewed. Typically, this solicits the response:
    “Good luck with that!” Unfortunately, that won''t suffice here. We need to get
    some sort of valuation in the books.


    Now, before you start running for the hills, consider this: We''re not really
    looking for a formal, accounting, audit‐proof valuation. Sure, that would be very
    nice to have (and in some cases required), but we can make do with an informal
    valuation. You may also ask “Why now?” Why couldn''t we do this as we spent all
    those hours of uninterrupted fun doing the asset classification and business‐impact
    analysis work? Well, the truth is that you *could* do it then, but I recommend
    that you don''t. Instead, I recommend that you take the opportunity to do a presentation
    of your findings to date to all those involved. This will give you valuable feedback
    (in case something was missed), and give them a unique view of their world as
    seen through your eyes. That is when I feel is the best opportunity to talk dollars
    and cents.


    So, corral your business unit owners and executive team and don''t let them leave
    the room until they give you what you need: a number per asset. Some sort of quantifiable
    dollar value that answers the question: How much is the asset worth to you?


    Replacement value is an easy starting point for most executives to grasp. What
    would it take to replace a particular asset? Think about it holistically: purchase
    or lease, equipment, licenses, expertise, staff time, the works. It''s not that
    crazy of a calculation, really.


    When you''re done with the first pass, let''s talk damages. What kind? Which assets
    or units are affected? All? Some? Which contracts? What services? Any products?
    Any regulatory implications? What about reputation? You should assess those costs
    as well. For example, your team will know the value of the contracts and the corresponding
    penalties and losses associated with failure to fulfill. They also will know any
    regulatory penalties that may ensue as a result of a loss or breach. Finally,
    you can estimate with the team the cost of rebuilding the firm''s reputation when
    those emails that you called people all sorts of names leak out. You got this!


    That''s it. Now, you''re done. You added the last field on your spreadsheet: Impact,
    expressed in dollars. Take a well‐earned break, and get ready for the next step.


    # Chapter 7: Threats


    Before we start, we need to briefly review a few key concepts: threat, attack,
    vector, and payload.


    *   **Threat** refers to the potential of an agent to cause adverse effects on
    an asset.

    *   **Attack** is the realization of a threat.

    *   **Vector** is the pathway that a threat takes to compromise an asset.

    *   **Payload** is the actual way that the compromise is effected.


    And, as per the wise people at NIST: The threat source (agent) initiates the threat
    event (attack); the threat event (attack) exploits one or more vulnerabilities
    that cause adverse impact (you got hacked!); the end result produces organizational
    risk. And migraines. Painful, splitting migraines.


    As we discussed, a cyberthreat has three core attributes: the kind of threat agent,
    the probability of occurrence, and, of course, its impact. During our threat assessment,
    our goal is to determine all three attributes on a per‐asset basis. To do this,
    we''ll need to know what the assets are (which we have already accomplished),
    what their value is to us (our definition of impact), who the threat agents might
    be (the bad people out to get you), their motives, and any pertinent threat intelligence
    and historical data out there.


    Regarding the part about people out to get you: As you recall, anything that is
    of value to you, is of value to someone else. If it is your personal data that
    is of value, then yes, in that sense they are after “you.” Your digital “you.”
    If it is corporate data that is of higher value, then they''re after that. The
    higher the value, the more attractive the target.


    ## Types of Threats


    Ultimately there are two, and only two, kinds of threats: external and internal.


    An external threat originates outside your organization. We have a nice long list
    of those later in the chapter. An internal one? Well…remember the 1979 cult classic,
    *When a Stranger Calls*? That''s your best example of an internal threat: *“The
    call is coming from inside the house!”* Not surprisingly, though, both external
    and internal threats can and do share the same motives, which include ideology,
    ego, and money.


    What makes an internal threat particularly dangerous is that it has already bypassed
    your perimeter defense. The attacker is already in the system, and needs only
    to bypass the internal controls in order to wreak havoc! Internal attackers also
    know where all the bodies are hidden: in other words, what''s of value and what''s
    not. Who are these internal threats? What makes them so dangerous?


    ### Internal Threats


    There is no typical profile for internal threat actors except that they have the
    *means,* the *motive,* and the *opportunity*. They can be employees, either full‐time
    or part‐time. They can be contractors. They may be vendors that require temporary
    access to your system (e.g., a telephone system vendor). And, God help you if
    they are “power users” or some sort of “administrators” of systems. Anyone who
    has access, whether onsite or remote, presents the possibility of an internal
    threat.


    Their means can be many. They can physically exfiltrate the data by removing printouts
    of sensitive information, even taking pictures of screens with their mobile phones.
    If they have the right (or wrong!) privileges, they can copy data onto USB drives
    or transmit data to cloud storage. There have even been cases in which “administrators”
    removed terabytes of data on removable hard disks!


    Motives are equally varied. Internal threats are usually motivated by the same
    things that motivate external actors, only internal threats have easier access
    to your systems. Many are motivated by money. Indeed, they may have a pressing
    need for money for any number of reasons (e.g., family emergency, debt, drugs,
    etc.). Others may be motivated by ideology (e.g., a disagreement of company or
    state policies, a sense of right versus wrong, self‐righteousness, etc.). Others
    still may be motivated by personal reasons (e.g., disgruntled employees, various
    psychopathologies, just “the thrill of it,” etc.). They may be recruited by the
    competition, a nation‐state, or any other organization. Or they themselves may
    be the victims of a crime, such as blackmail. No matter what the motive, they
    will always find a way to rationalize their actions—be it to save the world, to
    save a loved one, to save themselves, or because “they deserve it.”

