- raw: 'Are there other developments that will affect your cybersecurity program in
    the next couple of years? You bet! There isn''t a single technology company that
    is not working on bigger, better, smarter systems to protect and defend, including
    bleeding‐edge technologies being tested all over the world.


    There is no crystal ball that we can use to predict the impact of these technologies,
    only the knowledge that change is coming, and the impact of these changes will
    be profound. The thing you need to do is to commit yourself to staying engaged
    and continuously informed. That is the only way that you can protect yourself
    and your company. And the only way you can contribute to helping everyone live
    in a cybersecure world.


    Which is how I want to close this book: By imagining a cybersecure world, without
    being particularly sappy. Just optimistic!


    I would like to think that world governments can create treaty frameworks that
    protect our countries, our businesses, and our privacy. I would hope that our
    research institutions and international organizations and agencies work toward
    this goal through advocacy and education.


    I would like to think that our business leaders, boards of directors, and executives
    will take on the challenge of cybersecurity and address it head‐on. I would hope
    that lessons learned, professional voices, education, and awareness contribute
    to their decision to allocate the right resources in a timely way. I want to see
    business decisions include privacy and security considerations as well as profit.
    And I want to make sure that we, as professionals, all work proactively and stay
    engaged in making sure that the value we create every day is protected.


    Finally, I would like to think that we, as individuals, will own up to our responsibility—be
    it civic, professional, or personal—and act responsibly toward each other, using
    technology with respect and with the wisdom it is due.


    # BIBLIOGRAPHY


    Over the years that it took to prepare this book, I have consulted with, attended,
    read, and visited thousands of primary sources, be it in the form of books, seminars,
    workshops, classes, conferences, vendors, and cybersecurity professionals of every
    specialty that you can imagine (and some that you cannot!). It is clearly impossible
    to list all the material that I consulted and that influenced my thinking, and
    I therefore apologize for any omissions from the following bibliography.


