- raw: "The good news is that the vulnerabilities you need to be concerned about are\
    \ limited to your world and your world only. In other words, we care only about\
    \ your information system, system security procedures, internal controls, or implementations,\
    \ not the universe of vulnerabilities out there. You have enough headaches as\
    \ it is! More good news is that since you've done your asset classification, you\
    \ know exactly which systems and so on need to be tested against known vulnerabilities.\n\
    \nOf course, *your world* is a rather expansive term, one whose boundaries you'll\
    \ need to decide ahead of time. Think about the now‐famous hacking of Target in\
    \ late 2013—the largest hack of a retail company to date. What's important for\
    \ our purposes here is that it wasn't the *actual* Target systems that were hacked.\
    \ It was instead a Target vendor that was compromised—a so‐called trusted partner.\
    \ The question therefore is: What constitutes Target's cybersecurity world? If\
    \ you answered, “Their own systems *plus* all the vendor partner systems,” you\
    \ get a cookie! You are correct!\n\nThe problem is, doing a vulnerability assessment\
    \ on such an expansive definition of my world becomes impossible, not to mention\
    \ legally tricky. For example: Do you, as a procuring organization, have the right\
    \ to test the seller's systems? It depends on (a) what you are buying and (b)\
    \ how good your lawyers are. What if you are buying *something‐as‐a‐service?*\
    \ What kind of vulnerability testing can you reasonably demand? Again, those are\
    \ very tricky conversations.\n\nWhat most organizations have settled on, and my\
    \ recommended approach, is for the buyer to do the following: First, request that\
    \ the seller complies with a reasonable cybersecurity operational standard (e.g.,\
    \ “Have you implemented *<insert your favorite standard here>* in your organization?”);\
    \ and second, demand the right to audit the vendor.\n\nWhether you have the right\
    \ to audit or not can be a matter of dispute. For example, what if the vendor\
    \ serves multiple clients, some of which may be your competitors? If you have\
    \ the right to audit, the other clients may object on the grounds of data confidentiality.\
    \ You could descend into a legal rabbit hole defining exactly what system you'll\
    \ audit, how you'll audit, and so on, but you get the picture.\n\n*Audit* is a\
    \ five‐letter word that is best used sparingly and with profound respect. Fortunately,\
    \ there are workarounds. For example, you may be able to demand the results of\
    \ an independent audit as opposed to performing one yourself.\n\nHow do you decide\
    \ which vulnerabilities apply to your world? You start by matching your systems\
    \ to known vulnerabilities. You know your systems. Now, you need to find the list\
    \ of applicable known vulnerabilities.\n\nWhat about the unknown ones, you ask?\n\
    \n## Zero‐Day Exploits\n\nObviously, you can't test against an unknown vulnerability\
    \ any more that you can vaccinate against an unknown virus. But, just like in\
    \ medicine, you can monitor your systems closely for any signs of abnormal behavior\
    \ and respond accordingly. Most importantly? You are not alone in this! Thousands\
    \ of dedicated cybersecurity professionals and cybersecurity companies make it\
    \ their mission in life to scan for‐as‐yet unknown vulnerabilities, publish them,\
    \ and recommend patches or mitigating controls.\n\nReferencing back to our cybersecurity\
    \ primer, you'll remember that *zero day* refers to nasty little bugs that exploit\
    \ vulnerabilities in existing systems that are known only to the hacker. So, your\
    \ goal with zero day exploits is simple: Stay alert, stay informed, and have in\
    \ place a defense‐in‐depth strategy that protects your organization as much as\
    \ is practical.\n\nThe choice of the word *practical* here is key. It's not about\
    \ protecting your organization to the outer limit of what technology allows—that\
    \ would not be necessarily appropriate to your risk appetite. It is always about\
    \ deploying protection in a practical and pragmatic way.\n\nThe first step is\
    \ to use your asset classification to determine which type of vulnerabilities\
    \ may apply. At a top level, you should be able to place your assets into the\
    \ following buckets:\n\n*   *Operating Systems:* These systems drive your hardware.\
    \ They can be manufacturer‐specific, like Apple's and Microsoft's, or they can\
    \ be open‐source based like LINUX. Operating system conversation and choices can\
    \ be extremely polarizing and I advise you to avoid them like the plague. The\
    \ thing you need to know is which ones are deployed in your organization. Leave\
    \ the question of which one is better to be debated by the corresponding high\
    \ priests of each tech religion. If you are interested in market share of operating\
    \ systems, browsers, search engines, platforms, etc., I recommend you visit the\
    \ Global Stats site ([http://gs.statcounter.com](http://gs.statcounter.com))—a\
    \ free website of statistics happiness.\n\n*   *Servers:* These are essentially\
    \ applications that host (or enable) other applications. For example, database\
    \ servers or web servers. You will need to know how many, what kind, the manufacturer,\
    \ version, etc. Remember the one spreadsheet to rule them all from [Chapter 6](#c06.xhtml)?\
    \ If you have gone granular enough, all this information will be in it.\n\n* \
    \  *Applications:* These run either directly off the operating system (like a\
    \ word processor), or in combination of operating system and some server (like\
    \ a website). For example, your accounting system is running both on an operating\
    \ system, using a database server, and is itself an application for which you\
    \ need to know all the fun stuff we've been cataloging (manufacturer, version,\
    \ etc.).\n\n*   *Services:* When will the fun stop? It stops with services. Those\
    \ are any services that your company consumes from a third party. It could be\
    \ storage. It could be infrastructure. It could be anything‐as‐a‐service. And,\
    \ yes, you need to know about it in as much detail as possible. In the case of\
    \ as‐a‐service you will need to consult the agreements you have with the vendors,\
    \ as well as contact their cybersecurity personnel to determine what their baseline\
    \ posture is. Assuming you're dealing with a reputable vendor, they will be able\
    \ to provide you with all the documentation you need.\n\n## Vulnerabilities Mapping\n\
    \nWith your spreadsheet in hand, you will now research and develop a current known\
    \ vulnerability list for each of the four buckets. To do this, you will need to\
    \ consult with the following amazing, free, and hard‐to‐imagine‐anything‐more‐useful\
    \ services:\n\n*   *MITRE*. According to their website: \n\n    *   *The MITRE\
    \ Corporation is a not‐for‐profit company that operates multiple federally funded\
    \ research and development centers (FFRDCs). We provide innovative, practical\
    \ solutions for some of our nation's most critical challenges in defense and intelligence,\
    \ aviation, civil systems, homeland security, the judiciary, health care, and\
    \ cybersecurity*.\n\n        I am here to testify that yes, they do, and I am\
    \ one of their biggest fans! One of their many projects is the Common Vulnerabilities\
    \ and Exposures Details website at [https://www.cvedetails.com](https://www.cvedetails.com).\
    \ This is an amazing tool, in which you can search by vulnerability, product,\
    \ vendor, or anything else you can imagine and get meaningful, up‐to‐the‐minute,\
    \ actionable information. For example, searching for Microsoft SQL Server will\
    \ return a table by year, number of vulnerabilities, type, etc., all of which\
    \ are links to more specific information. So, in the same example, if you click\
    \ on year 2015 “Code Execution” vulnerabilities, you will get two of them*: CVE‐2015‐1763,*\
    \ and *CVE‐2015‐1762*. Clicking the second one, you'll get all the details about\
    \ a remote code execution vulnerability for the specific product, and what to\
    \ do to mitigate it. What's not to love?"
  fmt: "\n好消息是，您需要关注的漏洞仅限于您的世界，仅限于您的世界。换句话说，我们只关心您的信息系统、系统安全程序、内部控制或实现，而不关心外面漏洞的全貌。您已经有足够多的烦恼了！更好的消息是，既然您已经完成了资产分类，您就确切地知道哪些系统等需要针对已知漏洞进行测试。\n\
    \n当然，`your world` 是一个相当宽泛的术语，您需要提前决定其边界。想想 2013 年底 Target 公司遭遇的著名黑客攻击——这是迄今为止最大的零售公司黑客攻击案例。对我们而言重要的是，被攻击的并非\
