    换句话说，纵深防御不仅仅是一个顶层的“让我们建造一座有五堵墙和三条鳄鱼出没的护城河的城堡”策略。它也是一项需要在每个资产点应用的实践。企业需要为物理（和虚拟）办公室制定纵深防御策略，无论是本地还是远程；此外，他们应要求云服务提供商采取纵深防御方法（永远信任但验证）；视范围而定，他们也需要从交易合作伙伴那里获得此类防御。如果您对最后一点存疑，请询问
    Target 公司的人员，他们在 2013 年遭遇了一次极其严重的黑客攻击，而这竟然是由一家持有 Target 服务合同的供暖和通风公司的漏洞导致的。


    这就是我坚信 NSA 观点正确的原因。纵深防御不关乎任何特定技术或拓扑结构。纵深防御真正关乎**人员、技术和运营**，无论地点、无论方式。


    # 人员、技术和运营


    在这三位一体中，**人员**因素依我之见是成功网络安全计划中最关键的要素。从董事会到基层的支持至关重要。这种支持必须是强有力的、清晰的和可执行的。公司上下不应有任何疑虑：网络安全是一项任务关键型组织实践：它需要由清晰的政策、标准、程序和指南来支撑。


    '
