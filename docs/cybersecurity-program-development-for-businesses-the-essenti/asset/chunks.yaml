- raw: 'According to a recent ISACA cybersecurity snapshot, the top three threats
    facing organizations are social engineering, insider threats, and advanced persistent
    threats. I''ll go out on a limb here and predict that these rankings will stay
    around for a few more years. Could there be new, disruptive technologies that
    would alter these rankings? Certainly, but consider that both social engineering
    and insider threats are people‐centric, not technology‐centric. People will always
    be both the biggest asset *and* the biggest threat in cybersecurity.


    Finally, of these threats, I would suggest that most organizations would need
    to seriously consider and address the first two: social engineering and insider
    threats. The third category, advanced persistent threats (APTs), is particularly
    nasty and typically focuses on big multinationals, governments, physical infrastructure
    (think power grid, water supply, etc.), and the military. That''s not to say that
    your firm should not consider APT. It always depends on who you are and what you
    do. Again, I trust that you know best.


    Social engineering threats tend to be planned well ahead of time. The attacker
    harvests information about the target from publicly available sources (social
    networks, professional networks, corporate websites, public records, even data
    aggregators) and then uses that information to impersonate and compromise the
    target. How common are social engineering attacks and how likely are you to be
    targeted? Extremely and very. And the more public information you have openly
    available and accessible on the Internet, the easier it gets. If, for example,
    your corporate website has photos and bios of the executive team, then a hacker
    already knows who does what at the company, as well as some information about
    each person''s background. If you happen to be working in finance, even better.
    And, if your company is big, indicating a potentially large accounting department,
    even better yet! Any leftover blanks can easily be filled in with a quick visit
    to LinkedIn. From there, on to social networks, school alumni associations, and
    public records. In short order, a solid profile of an executive has been formed
    and it can now be used to gain access to processes and workflows controlling money
    movement, intellectual property, deal secrets, etc. In extreme cases, the profile
    could even turn into personal extortion, turning the executive into an insider
    threat.


    Speaking of which, insider threats are your basic good‐people‐doing‐bad‐things
    threat. Yes, there are bad people doing bad things, too, but hopefully you minimized
    that risk (remember *deter*?) by doing your pre‐employment due diligence, including
    a thorough background check.


    For our purposes, an insider threat is any employee who attempts to use his or
    her position of privilege to commit illegal acts. The reasons vary: family emergencies,
    divorce, unexpected medical bills (the good‐people‐doing‐bad‐things part), or
    thrills, espionage, and kleptomania (bad‐people‐doing‐bad‐things part). These
    reasons top my list. Bottom line, and whatever their excuse may be, the result
    is the same: data exfiltration. Perhaps a fake vendor is created and invoices
    are sent to the employee who approves them, or expense reports are fraudulently
    submitted, or something similar with one goal: money! If it is corporate espionage,
    then the employee steals data, which she either sells to a competitor or gives
    away in hopes of a procuring a better position with the competitor. (Obviously,
    if the employee is not working for a corporation but for a government, we go from
    corporate espionage to Bond. James Bond. You know the rest.)


    Advanced persistent threats are the stuff of migraines. The “advanced” part speaks
    to the incredible sophistication and technical skill involved, from crafting payloads
    to delivering them, and from finding zero‐day vulnerabilities to exploiting them.
    The “persistent” part speaks to the *I‐will‐not‐stop‐until‐I‐succeed* commitment
    of the attacker against the target. Any which way you look at APTs, they are nasty,
    painful, and expensive. If you have serious reason to believe that you may be
    the target of an APT, take this book and walk over to your cybersecurity department
    and ask them what are they doing about it. If you don''t have a cybersecurity
    department, walk over to the CEO''s office and, kindly yet firmly, suggest to
    her that you need to create one. Yesterday is good.


    Have we exhausted the possible threats? Not by a long stretch! There are zero‐day
    threats, end‐point threats (computers, tablets, phones being compromised), and
    Internet of Things (IoT) threats (such as your car deciding to turn off when you''re
    driving at 75 mph). There are operational technology (OT) threats (hacking industrial
    control systems), threats of new forms of fraud (crowdfrauding, rent‐a‐hacker,
    hactivists), denial‐of‐service threats, and all the other fun stuff we defined
    in [Chapter 3](#c03.xhtml).


    As we move forward with our cybersecurity program development we may need to drill
    deeper and consider the threat landscape in more detail. But for now, we''re ready
    to continue framing our overview.


    ## At the Club House Turn!


    At this point, you have:


    1.  Mission and vision statements


    2.  Cultural assessment findings


    3.  IT documentation and assessment


    4.  Asset valuations


    5.  Business‐impact analyses


    6.  Threat assessments


    Now you need to think about your vulnerabilities, the kind of controls you need
    to put in place to plug them, your processes, and your people.


    Let''s start with the vulnerabilities. Every system has them. Every single one.
    If someone tells you otherwise, he is lying. The goal here is to identify them
    and apply controls to protect them. Some vulnerabilities you may be able to eliminate
    altogether. Others, you may have to live with. Those are the ones you need to
    worry about. And finally, there are the vulnerabilities you don''t even know about.
    Those will keep you up at night, but even for those, there''s usually something
    you can do.


    Step one: discovery! We have to uncover those vulnerabilities. There are several
    ways of doing this, starting with vulnerability and penetration tests. Testing
    will identify most vulnerabilities and dictate necessary steps to eliminate or
    remediate. We''ll discuss all this in detail in the chapters that follow, but
    suffice it to say that when we''re done, we''ll need to apply a whole set of controls.


    At this point in the game, though, having finished with asset valuation, business‐impact
    analysis, and threat and vulnerability assessment, you''re ready to bring everything
    together. You are ready to conduct your risk assessment.


    A risk assessment is always company‐specific; there is no standard risk assessment
    or template. You have to create it for your own specific environment. Now, I recognize
    that this assessment soup can get confusing. We have threat assessments, vulnerability
    assessments, business impacts, risk analysis, risk evaluation, risk registers,
    and finally, risk assessments! That''s a lot of assessing! What''s what here?


    Let''s recap, and make it personal:


    *   *Threat Assessment*: Who''s out to get you? Why? How likely is an attack?
    How bad can it get?


    *   *Vulnerability Assessment*: How easy is it to get you? What''s stopping people
    from doing it? What tools might they use?


    *   *Risk Analysis*: Combine equal parts of threat assessment and vulnerability
    assessment. Mix, cook, and serve in the form of risk probability over time and
    potential business impact.'
  fmt: '

    According to a recent ISACA cybersecurity snapshot, the top three threats facing
    organizations are social engineering, insider threats, and advanced persistent
    threats. I''ll go out on a limb here and predict that these rankings will stay
    around for a few more years. Could there be new, disruptive technologies that
    would alter these rankings? Certainly, but consider that both social engineering
    and insider threats are people‐centric, not technology‐centric. People will always
    be both the biggest asset *and* the biggest threat in cybersecurity.


    Finally, of these threats, I would suggest that most organizations would need
    to seriously consider and address the first two: social engineering and insider
    threats. The third category, advanced persistent threats (APTs), is particularly
    nasty and typically focuses on big multinationals, governments, physical infrastructure
    (think power grid, water supply, etc.), and the military. That''s not to say that
    your firm should not consider APT. It always depends on who you are and what you
    do. Again, I trust that you know best.


    Social engineering threats tend to be planned well ahead of time. The attacker
    harvests information about the target from publicly available sources (social
    networks, professional networks, corporate websites, public records, even data
    aggregators) and then uses that information to impersonate and compromise the
    target. How common are social engineering attacks and how likely are you to be
    targeted? Extremely and very. And the more public information you have openly
    available and accessible on the Internet, the easier it gets. If, for example,
    your corporate website has photos and bios of the executive team, then a hacker
    already knows who does what at the company, as well as some information about
    each person''s background. If you happen to be working in finance, even better.
    And, if your company is big, indicating a potentially large accounting department,
    even better yet! Any leftover blanks can easily be filled in with a quick visit
    to LinkedIn. From there, on to social networks, school alumni associations, and
    public records. In short order, a solid profile of an executive has been formed
    and it can now be used to gain access to processes and workflows controlling money
    movement, intellectual property, deal secrets, etc. In extreme cases, the profile
    could even turn into personal extortion, turning the executive into an insider
    threat.


    Speaking of which, insider threats are your basic good‐people‐doing‐bad‐things
    threat. Yes, there are bad people doing bad things, too, but hopefully you minimized
    that risk (remember `deter`?) by doing your pre‐employment due diligence, including
    a thorough background check.


    For our purposes, an insider threat is any employee who attempts to use his or
    her position of privilege to commit illegal acts. The reasons vary: family emergencies,
    divorce, unexpected medical bills (the good‐people‐doing‐bad‐things part), or
    thrills, espionage, and kleptomania (bad‐people‐doing‐bad‐things part). These
    reasons top my list. Bottom line, and whatever their excuse may be, the result
    is the same: data exfiltration. Perhaps a fake vendor is created and invoices
    are sent to the employee who approves them, or expense reports are fraudulently
    submitted, or something similar with one goal: money! If it is corporate espionage,
    then the employee steals data, which she either sells to a competitor or gives
    away in hopes of a procuring a better position with the competitor. (Obviously,
    if the employee is not working for a corporation but for a government, we go from
    corporate espionage to Bond. James Bond. You know the rest.)


    Advanced persistent threats are the stuff of migraines. The "advanced" part speaks
    to the incredible sophistication and technical skill involved, from crafting payloads
    to delivering them, and from finding zero‐day vulnerabilities to exploiting them.
    The "persistent" part speaks to the *I‐will‐not‐stop‐until‐I‐succeed* commitment
    of the attacker against the target. Any which way you look at APTs, they are nasty,
    painful, and expensive. If you have serious reason to believe that you may be
    the target of an APT, take this book and walk over to your cybersecurity department
    and ask them what are they doing about it. If you don''t have a cybersecurity
    department, walk over to the CEO''s office and, kindly yet firmly, suggest to
    her that you need to create one. Yesterday is good.


    Have we exhausted the possible threats? Not by a long stretch! There are zero‐day
    threats, end‐point threats (computers, tablets, phones being compromised), and
    Internet of Things (IoT) threats (such as your car deciding to turn off when you''re
    driving at 75 mph). There are operational technology (OT) threats (hacking industrial
    control systems), threats of new forms of fraud (crowdfrauding, rent‐a‐hacker,
    hactivists), denial‐of‐service threats, and all the other fun stuff we defined
    in [Chapter 3](#c03.xhtml).


    As we move forward with our cybersecurity program development we may need to drill
    deeper and consider the threat landscape in more detail. But for now, we''re ready
    to continue framing our overview.


    ## At the Club House Turn!


    At this point, you have:


    1.  Mission and vision statements

    2.  Cultural assessment findings

    3.  IT documentation and assessment

    4.  Asset valuations

    5.  Business‐impact analyses

    6.  Threat assessments


    Now you need to think about your vulnerabilities, the kind of controls you need
    to put in place to plug them, your processes, and your people.


