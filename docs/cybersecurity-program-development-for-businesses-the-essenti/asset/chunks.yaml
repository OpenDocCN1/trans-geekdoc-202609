    *   **SCADA:** Stands for “supervisory control and data acquisition.” Do you remember
    an incident in 2010 when the Iranian centrifuges at their super‐secret plant went
    all crazy and spun themselves to oblivion? That''s because a SCADA controller
    was hacked. So, the best way to understand a SCADA device is by thinking about
    any of those fancy industrial controllers that monitor and direct industrial devices,
    like centrifuges, refrigeration systems, or power generators, etc. They monitor
    them, they process data from them, and directly interact with these devices to
    effect a result (such as the opening or closing of a valve, spinning up or down
    a centrifuge, cooling or heating a reactor, and so on). SCADA systems are often
    vulnerable because they generally run on older technologies that are difficult
    to patch and upgrade.


    *   **Spyware:** This is the general name of a class of software designed to—you
    guessed it!—spy on you. Key loggers, already discussed, are part of this ever‐growing
    family tree. There are “legal” spywares that an employer or a parent can deploy
    on a computer to monitor usage. I put “legal” in quotes because although you can
    purchase, install, and deploy these tools, their use is frequently challenged.
    For example, if a company has a bring‐your‐own‐device (BYOD) policy to work, are
    they within legal bounds to install spyware on it?


    *   **Trojan:** This term refers to the infamous Trojan horse that the Greeks
    used to take Troy. In case you''re not up to speed with your Homer, after a futile
    10‐year siege against the city of Troy, the Greek army pretended to leave, built
    a huge statue of a wooden horse, hid a team of commandos in its belly, and when
    the Trojans (thinking the war was over) wheeled the horse in, the Greeks got out
    of the horse, opened the gates for the waiting army, and burned the place to the
    ground. Similarly, this class of malware disguises itself as a legitimate application,
    gains entry, and the rest is history.


    *   **Viruses:** Viruses are a type of malware that your run‐of‐the‐mill antivirus
    programs are supposed to catch before they do damage. They mimic biological viruses
    (hence the name), requiring a host and a trigger (don''t click that link!). The
    problem with computer viruses is much the same as in the biological world: To
    inoculate against a virus, you must first kill it, rendering it harmless, and
    then inoculate the host to build antibodies against it. That''s why the flu inoculations
    don''t always work: You''re being inoculated with last year''s virus signature.
    If this season''s virus is similar, you''re in luck, but if not, you''re in bed
    wheezing and sneezing. The same goes with your computer. If there is a signature
    for the incoming virus, then your antivirus application should catch it and stop
    it. If not, or if you haven''t gotten the update, then get yourself a good backup!


    *   **Vulnerability:** Vulnerabilities are a weakness in an information system,
    system security procedures, internal controls, or implementation that could be
    exploited or triggered by a threat source. There are millions of them in hardware,
    operating systems, and software ready to be exploited by adversaries. What''s
    sad is that a vast number of technical vulnerabilities are known, and technical
    fixes (patches) exist for them. Unfortunately, in many cases these patches have
    not been applied, rendering systems open to attack.


    *   **Worm:** This is a type of computer virus (defined earlier) that is designed
    to spread over computer networks by making copies of itself without any intervention
    by its maker.


    *   **Zero Day:** Zero‐day exploits are vulnerabilities in existing systems that
    are known only to the hacker. For example, let''s say there is an undiscovered
    vulnerability in the new release of your favorite word processor; it''s utterly
    unknown to the product developers and to the users, but it''s lurking there nonetheless.
    This would be called a zero‐day vulnerability because it is completely unknown
    to the world at large; therefore it has been exposed for zero days. Once the vulnerability
    is discovered, the race begins to fix (or patch) it before a hacker can use the
    vulnerability to damage the system in some way.


    *   And how are zero‐day exploits found? Hackers on the prowl for such vulnerabilities
    discover them and put them up for sale on the dark web. Depending on how serious
    the vulnerability is, this information can fetch significant amounts. Countries,
    other hackers, and of course the manufacturers are willing to pay top dollar to
    be the ones to have the secret. It is a “use once” vulnerability, though. Once
    revealed, it will be patched by the manufacturer or mitigated with some control
    or another, and the advantage will be lost.


    That''s it for our brief glossary of terms. For our purposes in this book, the
    preceding list should provide you with enough terminology to engage in and understand
    critical conversations around cybersecurity. There are, of course, many more terms,
    some quite technical in nature (e.g., `buffer overflow`, `spoofing`, `cross‐site
    scripting`, `SQL injection`, etc.) that require security, IT, and development
    professionals to evaluate and address.


    How much do you need to know about these extensive lists of threats and actors?
    Remember, I trust you to be able to make the right judgment call on what your
    risk is. Only you know the specifics of your environment. For example, you are
    aware if your business is likely to trigger the interest of hacktivists, those
    actors who might want to harm your system because of their allegiance to a certain
    cause or ideology. You are best in a position to know if your business relies
    on machinery using automated controllers (such as `ICSs`, `PLCs`, and `SCADA`
    systems). You will be the one to evaluate whether your intellectual property is
    valuable enough to your competitors, such as foreign companies looking for a shortcut,
    to become the target of a hack.


    # CHAPTER 4: Management, Governance, and Alignment


    If you have ever driven a car with wheels that are out of alignment, you probably
    experienced the joy of fighting the steering wheel to keep the car straight and
    on the road. If you''re driving a company whose business goals, information technology,
    and cybersecurity are out of alignment, you''ll experience the same issues: Depending
    on where the misalignment is, company goals may become increasingly difficult
    to achieve, technology may be out of sync with your needs, and cybersecurity may
    be protecting all the wrong assets. In short, your company is misaligned.


    In our specific context, *misalignment* means that your technology and your cybersecurity
    are not working together in support of your business goals. The operative word
    here is *together*. They are pulling you in other directions as opposed to helping
    you achieve what you set out to do. Unfortunately, this is far more common that
    you''d think, and it plagues everyone from the lone wolf professional to vast
    multinationals. The reasons are surprisingly complex and often hidden under layers
    of confusion, indifference, and office politics. But misalignment ultimately boils
    down to two key problems: poor governance and poor management.


    ## Why Governance Matters


    First, what is governance?


    My definition is: *Governance is the collective set of principle‐guided actions
    that when applied guide a company to the fulfillment of its goals*. I use principle‐guided
    actions to distinguish governance from reactive management. I use “applied” to
    further drive home the idea that governance is something you need to think about,
    agree on, and consistently apply to get the results you want. These principle‐guided
    actions include a company''s strategy, ways to measure success, ways to manage
    risk, and ways to exercise due care of company assets.

