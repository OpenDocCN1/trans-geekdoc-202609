- raw: 'Now, the good news: You will be pleasantly surprised at how easy it is to
    collect these 10 pieces of information from a business unit owner. But you will
    be unpleasantly surprised at the difficulty of collecting same if you have not
    found the right business owner! In other words, don''t necessarily look at the
    organizational chart and expect that a department head is the right owner of a
    business unit. That person may be the administrative head, but the *real* owner
    is someone who not only *takes action,* but has the experience and expertise in
    the running of the unit.


    This is not as unusual as it may sound, nor is it necessarily a problem. There
    may well be cases, for example, that the vice president of finance is an excellent
    strategist and an invaluable member of the management team, but it is the controller
    who is the business unit owner because she knows everything there is to know about
    it. You need to engage the vice president, be deferential to her, and include
    her in the process, but roll up your sleeves with the controller by your side.


    There are also software applications that you can use to help you with BIA, asset
    classification, and so on. One important safety tip: Bring your wallet! They tend
    to be expensive, and frequently part of a bigger business continuity management
    solution. Don''t get me wrong; some of them are excellent, and if the size of
    your company warrants an enterprise‐grade solution, you should look at them. But
    as far as mid‐sized and small‐business markets are concerned, at the time of this
    writing, my recommendation is to stick with my one‐spreadsheet‐to‐rule‐them‐all
    solution, which comes next.


    ## One Spreadsheet to Rule Them All


    Start by creating one spreadsheet per business unit. The name of the spreadsheet
    file itself is the name of the unit. All spreadsheets live in the same directory
    to make linking easy. Your spreadsheet should look something like [Table 6.1](#c06.xhtml#c06-tbl-0001).


    [**Table 6.1**](#c06.xhtml#R_c06-tbl-0001) Example of Business‐Impact Analysis
    Table


    | **Asset/System** || **Owner** || **Custodian** || **Location** || **Classification:**
    || **Criticality** || **Impact** || **MTD** || **RPO** || **RTO** || **Resources**
    |


    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |


    |   ||   ||   ||   ||   ||   ||   ||   ||   ||   ||   |


    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |


    Each row is taken up by a system owned by the business unit. Owner, Custodian,
    Location, and Resources can be initials or spelled out. Classification, Criticality,
    and Impact are numbers 1 through 4. MTD, RPO, RTO are numbers in hours (or minutes,
    or seconds, depending on the situation; just make sure you''re consistent across
    all spreadsheets).


    Additionally, I recommend that you make System, Owner, Custodian, Location, and
    Resources links to other spreadsheets that contain more granular data, all the
    way to a single asset. Where do you stop? Wherever it is appropriate for your
    firm! Remember, no two companies are alike. For example, for one mid‐sized company,
    you may have something that looks like [Tables 6.2](#c06.xhtml#c06-tbl-0002) through
    [6.7](#c06.xhtml#c06-tbl-0007).


