    ## 关键漏洞数据库与资源


    ### 国家漏洞数据库 (NVD)

    如果你觉得 MITRE 很权威，那你还没见过 NVD！它最初是美国国家标准技术研究院 (NIST) 计算机安全司的成果，如今由国土安全部国家网络安全司维护。根据其官方定义：


    > *国家漏洞数据库 (NVD) 是美国政府基于标准的漏洞管理数据存储库，采用安全内容自动化协议 (SCAP) 表示。这些数据支持漏洞管理、安全度量和合规性的自动化。NVD
    包含安全核对清单、安全相关的软件缺陷、错误配置、产品名称和影响指标。*


    访问其网站 [`nvd.nist.gov`](https://nvd.nist.gov) 并点击“Vulnerability Search Engine”链接，你将获得一个强大的研究工具。例如，输入上一个示例中的
    `CVE-2015-1762` 漏洞，你将获得包含描述、影响、参考建议、解决方案和工具的详细报告，更不用说海量的技术细节了。就我个人而言，“参考建议、解决方案和工具”这一项就已经让我心动了。


    ### OWASP

    最后但同样重要的是开放 Web 应用安全项目。OWASP 是一个国际性的开放社区，*致力于使组织能够构思、开发、获取、运行和维护值得信赖的应用程序。所有 OWASP
    工具、文档、论坛和分会均免费开放，供任何有兴趣改进应用安全的人士使用*。其最著名的成果是定期发布的 OWASP Top 10 最关键 Web 应用安全风险。


    这不仅是一个极其实用且可落地的工具，还极大地提升了开发人员乃至所有计算机专业人员的网络安全意识。你可以在其网站 [`www.owasp.org`](https://www.owasp.org)
    找到这份清单及许多其他工具和指南。2017 版 OWASP Top 10 候选名单延续了注入、失效的身份认证和会话管理、跨站脚本攻击等经典项目，并新增了两项：防护攻击不足和
    API 保护不足。


    ---


    这些就是全部了吗？这三个来源就是一切了吗？远非如此。还有许多漏洞研究的来源和资源，很多是免费的，也有基于订阅制的。此处列出的三个只是个好的开始：它们都是免费的，且足以满足大多数组织的漏洞识别需求。关键在于**警惕性**。像网络安全的所有事务一样，这意味着你做一次还不够，必须定期复查。多久一次？取决于你的系统和资产：没有两家公司是相同的。


    在识别并将已知漏洞映射到你的系统后，下一步是**修复**。好消息是，已知漏洞有已知的修复步骤。如果能做到，请严格遵照执行！


    为什么说“*如果*你能做到”？听起来可能疯狂，但你可能无法修补某个已知漏洞，因为某个应用程序或工作流实际上依赖于该漏洞。此时你面临真正的难题：你知道自己脆弱，却也知道无法修复。怎么办？你需要在已知漏洞周围实施控制措施以缓解风险，直到编写依赖该漏洞应用程序的“天才”发布修复补丁。


    完成漏洞修复后，需确认其已修复。因此，你的下一步是执行**漏洞测试**。


    **切勿将其与渗透测试（简称“pen test”）混淆。** 简单说，渗透测试是针对你的系统或公司的模拟网络攻击，用于保证网络安全计划按预期运行。而漏洞测试是一种诊断性测试，旨在辅助你的计划开发。


    ## 漏洞测试


    最佳实践，也是我的强烈建议，是聘请信誉良好的第三方供应商代表你执行漏洞测试。他们会获取你的资产清单，并创建测试集，针对这些资产检查所有已知漏洞。测试完成后，供应商会提交一份你需要修补的漏洞清单。


    典型的漏洞测试遵循以下步骤：


    1.  **供应商利用你的资产分类工作作为输入**：这是关键步骤，也是你前期工作质量大放异彩的时刻。分类越详细、优先级越明确，此步骤越顺利。例如，如果系统和资产清单很长，你可能被迫对测试进行优先级排序和分段。这应基于你之前建立的系统和资产关键性来决定。我强烈建议测试所有系统，但也理解时间和预算可能迫使你采用分层测试方法。这没问题，**前提是你别犯“最不重要的系统不需要测试”的错误**。太多公司为了省钱，像对待马奇诺防线——法国那条“不可逾越”却未延伸至比利时边境、让纳粹轻松绕过的防线——一样对待网络安全。这正是黑客希望你做的。因此，即使无法一次性测试所有系统，也要确保最终测试完所有系统。否则，攻击者将绕过你的强化系统，攻陷最不重要的系统，并将其作为跳板。


    2.  **将资产清单与已知漏洞对比**：资产确定优先级后，测试人员将利用外部资源，将每个资产与其已知漏洞匹配。例如：“Windows Server 2008
    资产有哪些已知漏洞？”有自动化应用程序可执行这些对比，大大减轻工作量。尽管如此，这并不免除你或测试人员复核的责任，尤其是对所有关键资产。你必须确保自动化系统从多个来源和订阅源获取最新的漏洞列表。


    3.  **针对已识别漏洞测试每个资产**：这可能比较棘手。有时测试漏洞只需确认安全补丁已应用、或系统运行最新软件版本即可；有时则可能需要让系统下线，检查底层硬件是否存在特定漏洞。无论哪种方式，你都需要至少两位技术专家的协助：执行测试的供应商，以及你的内部（或外包）IT
    团队。双方必须在目标、方法论和预期结果上达成一致。此处必须牢记：**避免指责资产保管人（如 IT 团队）**。你需要以不带偏见的态度审视这项工作——你只需要知道真相——同时也要对负责支持资产的人员怀有同理心。这就好比病人做
    CT 扫描：放射科医生不是来评判你是否吸烟的。他们只想做测试、出结果。即使诊断结果不佳，也绝不应指责病人。木已成舟，诊断后的目标只能是施以治疗并吸取教训。


    '
