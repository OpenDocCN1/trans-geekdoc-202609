- raw: "Bottom line? Expect to see a lot more action on this, especially as the growth\
    \ path of IoT makes the infamous hockey‐stick curve look limp by comparison.\n\
    \n## Distributed Workforces\n\nOnce upon a time, people used to get up and physically\
    \ transport themselves to an office where they performed work. When they were\
    \ done, they did the physical transport routine in reverse. Endless hours were\
    \ wasted in transit, with tons of pollutants dumped into the environment. People\
    \ toiled for years and years under these conditions, until Alexander Graham Bell\
    \ invented the telephone, and Mr. Watson started to phone it in. Things went south\
    \ from there.\n\nAccording to Gallup, from 1995 to 2015 the percentage of workers\
    \ in the United States telecommuting for work rose from 9 percent to 37 percent.\
    \ That is more than one third of the workforce of the United States telecommuting\
    \ at some point during the month, with 9 percent of those telecommuting half the\
    \ time or more. There's some debate about whether the trend is leveling off or\
    \ increasing, and also about whether it's smart or counterproductive. Regardless,\
    \ one thing remains clear: Telecommuting is real, it's increasing, and it is likely\
    \ to continue in one form or another, especially if work entails getting into\
    \ an office and working on a computer. Hence, your headache.\n\nWhy? Because,\
    \ unless your company is providing and controlling the equipment used to access\
    \ corporate resources, you have a problem. A big problem. If your organization's\
    \ corporate policy is BYOD (bring your own device), then it implies that a private\
    \ piece of equipment is connecting to the corporate network, working with corporate\
    \ assets, and doing so over potentially unsecured connections, which could include\
    \ someone's home, hotel, coffee shop, airport…anywhere they go. Moreover, neither\
    \ your IT nor cybersecurity departments have any legal standing with regard to\
    \ accessing and controlling an employee's private computer or phone. That causes\
    \ a serious legal headache if, for example, the employee is terminated and IT\
    \ and cybersecurity want to ensure that no corporate data is walking out the door.\
    \ You cannot exactly take over the system remotely and wipe it! The individual\
    \ may have personal data (for example, his or her personal contacts), which, of\
    \ course, are commingled with their corporate contacts. And if the employee was\
    \ in, let's say sales, and if you have reason to assume the employee may seek\
    \ a new job with your competition, you can see how this can quickly become a serious\
    \ problem.\n\nWhat is a cybersecurity czar to do? Assuming that you cannot persuade\
    \ the company to provide equipment for all employees (local and remote), then\
    \ your options are limited to creating a set of policies and standards to which\
    \ employees must consent in order to access the network. These policies and standards,\
    \ translated into some form of an employee agreement or consent form, will not\
    \ guarantee that your data won't fly out the door. But they may set minimum security\
    \ standards and corporate rights that survive separation. It is absolutely critical\
    \ that your attorney is involved in drafting these. It is the only way you can\
    \ maximize your chances of making the policies enforceable following an event.\
    \ Even then—I won't lie to you—enforcing these rules can become very time consuming\
    \ and very expensive.\n\nRemember our guiding principle to date: “What is it worth\
    \ to you?” You must have a heart‐to‐heart talk with your executive team and your\
    \ board to determine how far is far enough in regard to writing and enforcing\
    \ security policies. It is only they who can accept the risk. There is no “best\
    \ practice” when it comes to these issues. It's all about your risk appetite:\
    \ What are you willing to accept, and what are you not?\n\nThere are companies\
    \ that will not accept this risk. They recognize the reality of a distributed\
    \ workforce. They even welcome the savings in physical plant costs, but they are\
    \ not willing to accept the risk of their network being accessed by noncompany\
    \ equipment. And so, they provide everything: the equipment, the policies governing\
    \ its use, and extremely tight controls on who, how, where, and when is accessing\
    \ the corporate network and assets. If an employee is separated, they immediately\
    \ *brick* the equipment (a slang term meaning to render the equipment as useful\
    \ as a brick), and provide for a mechanism for the equipment's safe return. Of\
    \ course, all the corporate data across the board, local or remote, tend to be\
    \ encrypted both in transit and at rest.\n\nObviously, this level of control does\
    \ not come easily or cheaply. The systems, workflows, and personnel training required\
    \ are complex and expensive in both time and money. Moreover, the message to the\
    \ company is that Big Brother is watching. Therefore, when discussing with your\
    \ board such an approach, make sure that you sensitize them to all aspects of\
    \ such an implementation. In some cases, there is no choice (e.g., you're working\
    \ for the NSA for crying out loud! What did you expect?). In others, there may\
    \ be some give and take. As always, your role is to be there and inform the board,\
    \ owners, or executives charged with accepting risk, with all the pertinent details,\
    \ and then accept their decision.\n\nOn the other hand, there are other companies\
    \ that fully, and perhaps cavalierly, accept the risk. Their position is that\
    \ even if data is exfiltrated, it is useless without the company know‐how with\
    \ regard to generating value, so the corporate attitude is: “Let them have it!”\
    \ In terms of the gaping cybersecurity hole that this allows (e.g., access by\
    \ an infected computer), well…as we've discussed: “Ours is not to reason why….”\
    \ You have informed the stakeholders of the risk, you made sure they understood\
    \ it, and they have accepted it. Move on.\n\nThen there are the companies that\
    \ fall somewhere in between. Yours probably—hopefully!—is one of them. These companies\
    \ are very concerned about the risks introduced by BYOD and distributed workforces,\
    \ and as such, they mitigate the risks as best they can through their defense‐in‐depth\
    \ strategies. In practice, that looks something like this:\n\n1.  Create legally\
    \ binding agreements between employees and their use of equipment accessing corporate\
    \ assets.\n\n2.  Create and communicate clear policies, standards, procedures,\
    \ guidelines for all information technology use and corporate systems access.\n\
    \n3.  Have clear and timely onboarding and offboarding processes for all employees.\n\
    \n4.  Provide cybersecurity awareness training to all employees, at least quarterly,\
    \ and maintain awareness throughout the year.\n\n5.  Deploy a wide range of controls,\
    \ including a well‐tuned security information and event management system and\
    \ a data loss protection system.\n\nLike it or not, distributed workforces, freelancing,\
    \ telecommuting, BYOD, and so on are here to stay, likely to grow, and likely\
    \ to have significant impacts on our definition of the workplace. The impact of\
    \ these developments on IT and cybersecurity is equally profound: The concept\
    \ of perimeter security is completely redefined. Indeed, some argue the perimeter\
    \ no longer exists at all.\n\nAs for me, I argue that your current perimeter does\
    \ exist, but it's not one or more campuses or offices.\n\nYour perimeter is planet‐wide.\
    \ Plan accordingly.\n\n# CHAPTER 10  \n\nControls\n\nIn [Chapter 3](#c03.xhtml),\
