    *   **已缓解风险**：应用控制措施后现存的风险

    *   **剩余风险**：在风险已尽可能缓解或转移后剩下的部分

    *   **已接受风险**：已被接受的剩余风险，即*经营风险*

    *   **控制措施**：主动应对措施，无论是流程、系统还是应用程序，用于预防、检测、纠正风险或对风险进行补偿


    # 第 2 章


    关于技术的一切：你一直想知道却不敢问孩子的那些事


    为了能就你的业务数据、个人信息、潜在威胁以及应对这些威胁的选项进行一次明智的对话，你究竟需要知道多少？答案出奇地灵活，正如任何快速变化的领域一样。你需要懂多少医学知识，才能与医生就你的健康进行有意义的交谈？你需要懂多少法律知识，才能理解并配合律师的工作？你需要懂多少汽车知识，才能与修车师傅对话？


    这是一个棘手的问题，没有简单的答案，而且在一定程度上涉及大量的个人选择。有些人在咨询医疗专家前会深入研究；医生戏称这些人为“谷歌医学院毕业生”。另一些人则完全避开研究，完全依赖专业人士的专家建议。但无论你处于这个光谱的哪个位置，圆桌会议上的每个人至少都应该能说一门共同的语言。例如，你可能不清楚引擎究竟*如何运作*，但你知道引擎*是什么*。


    面对技术却并非如此。一旦我们开始谈论技术，眼神就会变得呆滞，张嘴打哈欠，手心冒汗。出于某种原因，我们忘记了我们拥有共同语言……而我们需要改变这种状况！


    当然，说起来容易做起来难，尤其是涉及技术时。尽管如此，本书信息能否成功传达，取决于它能否触达你、让你理解并付诸行动。我们确实需要能在某个层面上进行沟通。为此，我选择大量运用隐喻、在必要时回归基础、尽可能保持一切简单、使用简短案例研究来说明示例，并遵循马克·吐温的格言：*幽默是真理的善良一面*。


    我们的目标很简单：读完这一部分后，我希望你拥有的技术素养，不亚于你谈论汽车时的水平。我并不指望你成为机械师，但我希望你能了解一些它的历史、引擎的位置、方向盘的作用以及如何启动它。


    如果你还能学会开这玩意儿，而且不撞死人，那就更好了！


    ## 起初……¹


    一片黑暗，一片虚无。大概也挺冷的。然后，灯亮了，岩石开始在苍穹中旋转，转眼间，鱼类登上了陆地，大大小小的生物都生活在光荣的、尽管是模拟的、极乐世界中。不久之后，一位名叫查尔斯·巴贝奇的英国数学家想出了一个他称之为“差分机”的装置，这被公认为第一台计算机。三年后，艾达·洛夫莱斯在
    1843 年发表了《分析机素描》，正式“黑入”了这台机器，发出了起跑枪声，让世界飞奔在信息高速公路上。紧接着，越过电报、电话和无线电的发明，在洛夫莱斯女士近一百年后，另一位英国人艾伦·图灵发表了一篇题为《论可计算数》的论文，详述了数字计算机的设计。


    世界其他地区没花太久就加入了这场游戏。1938 年，康拉德·楚泽制造了第一台机电二进制计算机 Z1，以及——当然——Z2。一年后，约翰·阿塔纳索夫完成了第一台纯电子二进制计算机。第二次世界大战推动了电子破译设备的发展，其中最著名的是德国的“恩尼格玛”密码机和英国的“科洛萨斯”计算机。公众直到
    1944 年才得以见到计算机，当时 IBM 在哈佛大学建造了一台房间大小的机器，起了个性感的名字叫“自动序列控制计算器”（哈佛工程师给它起了个昵称叫 Mark
    I）。宾夕法尼亚大学也不甘示弱，于 1946 年启用了 ENIAC，重达 30 多吨，拥有 17,000 多个电子管。


    1947 年，事情进展顺利，当时在 Mark II 计算机的电子管中发现了一只导致短路的死飞蛾，从而诞生了*漏洞*一词，通常前面会伴随几句脏话。同年，约翰·巴丁、沃尔特·布拉顿和威廉·肖克利在贝尔实验室工作时发明了第一个晶体管。其后的故事，正如人们常说的，就是历史了：眨眼间，我们从庞大的大型主机计算机发展到了个人电脑、平板电脑、智能手机、可穿戴设备，甚至量子计算机。截至撰写本书时，甚至还有实验性工作在利用
    DNA 螺旋作为存储介质的*生物计算机*中存储 TB 级数据。真是让*数字*设备相形见绌！


    与所有这些计算机的发展并行的是连接它们的网络的发展。一切始于美国对“斯普特尼克”卫星不断发出的*滴——滴——滴*信号感到恼火，于 1958 年成立了高级研究计划局（ARPA）。ARPA
    指挥控制部门负责人 J.C.R. 利克莱德给同事们发了一份备忘录，大胆断言建立互联计算机网络的时机已成熟。他说对了。在几位天才（莱纳德·克莱因罗克、罗伯特·泰勒、保罗·巴兰、泰德·尼尔森等）的努力下，ARPANET
    诞生了！


    从那时起，一切都模糊不清了。1969 年至 1990 年间，我们经历了“NET 狂热”：ARPANET、ALOHANET、TELENET、USENET，以及——是的——FIDONET，仅举几例。在某个时刻，所有这些
    NET 互相通信，大家一致同意将所有这些互联网络、计算机和设备的集合称为 INTERNET，彻底解决命名问题。


    在此期间，雷·汤姆林森发明了电子邮件，不久他就收到了一封尼日利亚王子索要钱财的邮件。跳过计算机科学领域令人难以置信的进步和更多古怪的首字母缩略词（UNIX、ETHERNET、TCP/IP、RSA、DNS、PING
    等等），我们终于来到了光荣的 1990 年，蒂姆·伯纳斯-李和罗伯特·卡约首次使用“万维网”这一短语，作为他们刚刚开发的超文本系统的名称，用链接填满了世界，其中大多数你都应该避免点击。


    至此，我们来到了今天！


    ## 关键定义


    在构建词汇表的练习中，我们拥有一大优势：除非你一直生活在与世隔绝的地方（在这种情况下，我很荣幸这是你挑选的第一本书！），否则你已经知道所需的大多数术语。


    因此，这应该有助于澄清术语，而非引入新术语：


    *   **硬件**：任何能以数字形式存储、处理或传输数据的物理设备。例子包括从超级计算机到个人电脑、笔记本电脑、平板电脑、手机、可穿戴设备、交换机、路由器，以及各种你能想象到（还有一些你想象不到！）的数字设备。在后文中，为方便起见，我将使用*数字设备*一词作为*硬件*的同义词。

    *   **软件**：从最广泛的定义来看，软件是指导硬件执行任务的一组指令。没有软件，什么也做不了。可以想象成汽车和司机的关系。你可能熟悉计算机或手机操作系统（OS）与其应用程序（或
    Apps）之间的区别，但虽然它们确实不同，两者都是软件；只是功能不同而已。操作系统是控制实际硬件使用的软件，而应用程序则向操作系统发出请求，让硬件执行特定任务。


