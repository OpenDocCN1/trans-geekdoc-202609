- raw: 'This is why you need to care. These types of systems have direct implications
    on cybersecurity. They can be used as weapons themselves, they can be used as
    controls, and, since they are extremely valuable assets, they need to be protected
    for the value they represent. Consider, for example, that one of Watson''s projects
    involves reviewing hundreds of thousands of medical papers and recommending potential
    life‐saving treatments. Were it to be compromised, lives could be lost.


    Even weak artificial intelligence systems have already affected the workplace.
    Today, they are machine‐learning‐on‐steroids—the computer savant in the corner
    that is asked the incredibly complex question and has the right answer. Tomorrow,
    they could potentially be replacing hundreds or thousands of highly skilled jobs.
    I will leave the debate about social impact to others, but from a cybersecurity
    perspective alone, having a system that is responsible for such a big percentage
    of value generation changes the way we think about the role of assets, people,
    environments, and controls.


    And that is your problem. You need to think carefully about the industry you are
    in, the kind of work your business engages in, and the ways your firm generates
    value. You then need to map this against an AI''s capabilities, and project out
    the possible ways that an AI system may be integrated into your workplace. What
    happens then? What''s at risk? How does value generation change? Where will the
    threats come from? How do you mitigate them, given this new target?


    ## Blockchain


    By now, I am fairly confident that you''ve heard of the term *blockchain,* and
    certain that you have heard of Bitcoin. Blockchain is the underlying technology
    that makes cryptocurrencies like Bitcoin possible. But that''s like saying, “The
    Internet is the underlying technology that makes music streaming possible.” Yes,
    the Internet does that, but it does a lot more, and the same goes for blockchain.


    Just as the Internet revolutionized our world, so will blockchain. Many have made
    similar, if not stronger, pronouncements, and—trust me on this—even the most grandiose
    are understated. Blockchain is truly a revolutionary technology.


    So, what is it? It depends on how technical you want to be. At the simplest level,
    blockchain is a technology of distributed ledgers that are available to anyone,
    practically instantaneously, encrypted, with anonymized and indelible entries.


    Why is this such a big deal? Because, for the first time in the history of humanity,
    we have a robust, redundant technology that can combine transparency and assurance
    of transactions. The minute that Sally pays Bob using blockchain technologies,
    everyone on their blockchain can know that the transaction occurred, for how much,
    and so on. There can be, of course, private blockchain systems (e.g., blockchain
    systems linking Federal Reserve Banks, or financial institutions, or title agencies,
    law firms, and so on) or public blockchain systems like the one Bitcoin uses.
    Either way, using blockchain technologies, Sally is assured that Bob got paid,
    Bob can never dispute it, and Jim can''t steal the money. Moreover: There is no
    need for a third party to verify that all this is true. Blockchain, by its distributed
    and secure nature, assures it.


    Blockchain technologies can be used for any transaction. It doesn''t have to be
    about currency, stocks, or some trading instrument (e.g., derivatives). It can
    be about art. It can be about property. It can be about sacks of potatoes. If
    there is a transaction between two parties, no matter what that may be, it can
    be coded into a blockchain system and tracked. As you can imagine, there are many
    industries that blockchain could outright eliminate: clearinghouses, payment processors,
    brokerages, escrow services—any intermediary that exists solely to ensure a smooth
    transaction between two parties, and thereby collect a fee, is likely to go out
    of business.


    The estimates vary on how fast and how widespread this transformation will be.
    One that stuck in my head was that by 2025 we may be looking at a 40 percent loss
    of finance‐related jobs. Jobs that were involved somehow in the verifying and
    clearing of transactions, all eliminated because of blockchain technologies. Whether
    this number and date are true is anyone''s guess. What''s indisputable is that
    the technology is here, and that practically every government and financial institution
    in the world has active blockchain programs in development.


    What does this all mean to you and to your cybersecurity program? Well, it depends.
    First, ask how will your business be affected by such a technology? Second, do
    you plan to be involved with blockchain systems? If so, there are many serious
    technical considerations you''ll need to work through, far outside the scope of
    this book. Suffice it to say that a blockchain rollout, private or otherwise,
    carries significant cybersecurity implications.


    In short, you cannot go at this alone. If you plan to play with blockchain, then
    you''ll need to retain experts to help you throughout the life cycle of the project.
    And, fasten your seatbelt….


    ## Quantum Computing


    “God doesn''t play dice,” said Einstein. Actually, he didn''t exactly say that.
    What he did say was “Quantum theory yields much, but it hardly brings us close
    to the Old One''s secrets. I, in any case, am convinced He does not play dice
    with the universe.” He wrote this in a letter to Max Born, a founding father of
    the branch of physics called quantum mechanics.


    Quantum mechanics, or quantum physics, is the study of nature at the smallest
    scale possible. Think atomic, and subatomic studies. Scientists like Max Planck
    (considered the father of quantum mechanics), Niels Bohr (with his hydrogen atom
    model), Werner Heisenberg (and his uncertainty principle), Erwin Schrödinger (and
    his infamous cat), and, of course, Max Born, who was the receiver of Einstein''s
    letter, described a world of chance, uncertainty, entanglement, and very bizarre
    behaviors, that to date continue to puzzle and confound our understanding of the
    universe.


    The problem, if you want to call it that, is that this strange world described
    by even stranger mathematics is true! It has been repeatedly and independently
    verified by experiments. Go figure! We have, for example, indisputable proof of
    a concept called “action at a distance.” NIST proved it as recently as 2015 in
    a paper to *Physical Review Letters*.


    Enter quantum computing. Those are systems that instead of using the now‐familiar
    digital states—bits of “1” and “0,” “true” or “false,” and the like—they use quantum
    states, of which there can be many. These quantum bits, or qubits, can occupy
    multiple states and can do so at the same time. Crazy, I know, but trust me. The
    math works.


    The implications of such a computer exceed the wildest science fiction descriptions.
    A quantum computer will be powerful enough to simulate the most complex phenomena.
    Imagine a hurricane simulation in which you can tell exactly what each water droplet
    is doing at any one time. Imagine the ability to simulate the growth of cancer
    cells, or photosynthesis, or solving the most complex mathematical problems we''ve
    encountered. Also, think of the ability to break any size encryption in no time
    at all. And, think of that power in the hands of a…hacker? Or perhaps a nation‐state
    with unchecked ambitions?


    As of this writing, there is a quantum computing race going on. Google and IBM
    are two of the trailblazers in the field, but there are many, many more. Some
    are known (universities, privately funded researchers, and the like), and some
    are unknown. For example, we don''t know if there is a quantum computing research
    lab in North Korea or elsewhere.


    As to the cybersecurity implications of this technology, I leave you to your imagination!'
