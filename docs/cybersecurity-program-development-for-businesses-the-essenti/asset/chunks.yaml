  trans: '


    # 使命与愿景


    ## 愿景

    我们的愿景无异于充分发挥互联网的潜能——普及研究与教育的获取渠道，实现文化的全面参与——以驱动发展、增长与生产力的新时代。


    ## 美国喂养协会


    ### 使命

    通过遍布全国的会员食品银行网络，为美国饥饿人口提供食物，并动员全国人民投身于消除饥饿的斗争。


    ### 愿景

    一个无饥饿的美国。


    ## 史密森学会


    ### 使命

    知识的增进与传播。


    ### 愿景

    通过传承遗产、发掘新知、与世界共享资源，塑造未来。


    ---


    有人会争辩说，使命与愿景声明纯属浪费时间。只有一个目标，且仅此一个目标：赚钱。到此为止。毕竟，一位全国性非营利组织的执行董事曾告诉我：*“没钱？就没使命。”*
    我同意。“赚钱”这一至关重要的要求确有其道理。但这真的是你——或你公司——的真正使命吗？它反映了你公司的愿景吗？（如果是，请把它写下来。）


    从我们的角度来看，这是确立你所重视事物的起点。稍后，当我们为其确定合适的保护级别时，这将至关重要。


    # 文化与战略


    手握使命与愿景声明后，你接下来需要了解的是公司的文化。澄清一下，我们讨论的是组织文化，或称企业文化。这与任何种族或社会文化无关（尽管可能受其影响）。这是商业范畴。因此，它已被研究得透透彻彻。我就不啰嗦了，直接引用大卫·尼德尔在其
    2004 年著作《商业情境：商业及其环境导论》中的定义。他写道：


    > *组织文化代表了组织成员共同的价值观、信仰与原则，是历史、产品、市场、技术、战略、员工类型、管理风格、国家文化等因素的产物；文化包含组织的愿景、价值观、规范、制度、符号、语言、假设、信仰与习惯。*


    他没写过——实际上没人写过，尽管常被误传为德鲁克之语——的是：“文化早餐吃战略，午餐也吃战略，一周七天天天吃”，或其变体。这一观点在文献中以各种形式出现（例如托马斯·W·劳埃德
    2000 年的专著中以“文化胜过战略”的形式出现），尽管其思想源头扑朔迷离，但其智慧是真实的。


    这里的底线是：在文化与战略的较量中，文化永远获胜。永远。这就是为什么你需要花时间了解你的企业文化。缺乏这种理解，你的网络安全与风险战略注定会失败。


    你身处“不顾一切、大胆冒险”的创业文化，还是风险规避型环境？你身处高度监管的行业？还是身处军队？无论哪种情况，你都需要识别并理解这种文化。你的文化允许某些事情，而其他文化则不允许。例如，如果你试图在一个“无风险不冒”的创业环境中推行严格的身份认证和访问控制，你注定会失败。员工不会配合；他们会绕过控制措施，你将不得不面对一场员工造反（我们都知道结局如何：砍头！砍头！）另一方面，如果你在一个期望通过严格控制来保障安全的环境中过于宽松，你会被视为不负责任、太危险而无法共事。


    如何判断文化？假设你刚入职新公司的第一天走进大门，不知怎么被委派负责审查网络安全风险并提出建议。你还不认识任何人，需要一段时间才能融入新公司的文化。你能做些什么来判断新环境的文化？提问，当然！当然，光问问茶水间旁的两三个人是不够的。这需要一次调查。


    幸运的是，金·卡梅伦和罗伯特·奎因于 2005 年撰写了《诊断与变革组织文化》（2011 年出第二版），书中提供了他们的“组织文化评估工具”——一份简短但非常实用的调查问卷，遵循其指引将为你的公司提供一份文化画像。他们的调查从六个维度评估公司：


    1.  组织主要特征

    2.  组织领导力

    3.  员工管理

    4.  组织凝聚力

    5.  战略重点

    6.  成功标准


    每个维度在以下光谱中均有四个等级：个人导向与控制导向、养育导向与结果导向、团队合作与顺从、信任与监管、人本主义与效率优先、以人为本与以公司成功为本。


    # 去见巫师


    保存好你的文化调查结果——稍后你会用到它们。现在你已准备好与 IT 部门的人员交谈。为何要优先接触技术部门？诚然，还有许多部门、利润中心等可供优先关注，为何偏偏是
    IT？因为网络安全与 IT 密不可分。IT 并不“拥有”网络安全（组织才拥有），但请想一想：没有信息技术？就没有网络安全。道理很简单。*Cyber*（网络/控制）一词的定义本身就关乎信息技术。二者缺一不可。IT
    与网络安全是孪生兄弟。有时是对立的孪生兄弟，但终究是孪生兄弟。


    如果公司没有 IT 部门怎么办？那你应该找负责 IT 支持的供应商谈谈。如果连这种供应商都没有呢？那就搞清楚公司里有没有专人负责 IT，去问她。如果连她都不存在呢？


    让我们直奔主题：公司形形色色，大小不一。有的完全虚拟化，有的是跨国巨头。即便是我们所谓的虚拟公司，在技术的使用、采纳与支持程度上也存在巨大差异。你可能身处一家所有技术均以外包服务形式提供的公司（还记得基础设施即服务、软件即服务等概念吗？如果不记得，不妨回顾一下《网络安全入门》中的“云”定义）。或者，公司可能采用自带设备（BYOD）IT
    模式，由你——个人用户——负责维护自己的设备。光谱的另一端是“IT 冲锋队”：一群不苟言笑的人四处巡逻，踩踏任何他们不认识的电子设备。


    大多数公司介于这两个极端之间。他们 IT 部门有一名或多名人员——有时是员工，有时是供应商派驻——维护一套混合技术（内部部署、云端、公司提供设备与 BYOD
    混合），并对何种软件在何处运行、执行何种功能拥有一定程度的控制权。我们将讨论这种情况，并称其为：*IT 部门*。边缘情况如何处理？你仍然需要这些信息；只是获取方式不同而已。对于虚拟公司，你要确定供应商是谁、他们提供什么服务，等等。把他们视为你的虚拟
    IT 部门。对于冲锋队式管理，带上文件、预约拜访。此外，如果冲锋队进驻大楼，我敢打赌公司定有正式的风险与审计职能，他们也需要纳入这一过程。


    '
