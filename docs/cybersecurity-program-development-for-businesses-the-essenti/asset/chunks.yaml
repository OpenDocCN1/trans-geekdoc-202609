- raw: '*   *Owner:* Who is the owner of the asset? If we''re talking about a root‐level
    digital asset, like a finalized product (e.g., a product design, a filing for
    litigation, financial statements, etc.), then the owner is the enterprise. If,
    on the other hand, we''re discussing a value‐generating system such as an e‐commerce
    website, a medical records system, or a content management system, then the owner
    may be a business unit. More on this when we discuss business‐impact analysis
    further on.


    *   *Custodian:* Who is the custodian of the asset? The custodian cannot be “the
    enterprise” in general. It''s always an identifiable person, department, business
    unit, or vendor. You need to be able to say, “Fatima is the custodian—go get her!”


    *   *Location:* Where is the asset geographically located? This is key, especially
    if the asset ends up living in the cloud. Again, be specific.


    *   *Confidentiality Classification:* Rate the asset 1 through 4: public, confidential,
    secret, or top secret.


    *   *Criticality Classification:* Rate the asset 1 through 4: nice‐to‐have, optional,
    essential, or mission critical.


    *   *Impact Classification:* This is a pain measurement on the asset''s unavailability,
    corruption, or destruction. A rating of 1 through 4 works here, too: If the asset
    were suddenly unavailable or damaged, would the pain be none, minor, moderate,
    or severe?


    *   *Maximum Tolerable Downtime (MTD):* This is the point in time at which if
    the asset is not recovered, the impact becomes severe.


    *   *Recovery Point Objective (RPO):* This is the particular point in time you''ll
    need the asset to recover to.


    *   *Recovery Time Objective (RTO):* How long you are willing to wait before getting
    the asset back into production?


    *   *Resources:* Who will be needed to bring the asset back to life within the
    RTO and at RPO? Remember, be specific. Use names!


    I am going to let you in on a little secret. Those are exactly the same 10 questions
    that I want to know when I am doing a business‐impact analysis, business unit
    by business unit.


    The difference? When I am doing an asset classification and valuation, I am looking
    at root assets—assets of value at the enterprise level. When I am doing a business‐impact
    analysis, I am looking more at systems—specifically, systems that are critical
    for each business unit to contribute to the production of the root assets. Some
    might argue that the distinction is artificial, and they would be right. But I
    like to think of the whole exercise as a continuum. Asset classification and valuation
    feeds into business‐impact analysis, which feeds into business continuity and
    disaster recovery, all of which contribute to a solid cybersecurity program.


    After you have collected all of the data for the assets, you are ready to take
    the next step. Like peeling an onion, you need to perform the same exercise on
    a business unit by business unit level. This in turn may lead you down even more
    levels as you discover system and workflow dependencies.


    Notice that I have avoided mentioning any specific asset valuation at this point.
    So far what we have is a spreadsheet of valuable assets whose owner is the enterprise,
    and a few whose owner is a business unit. We haven''t assigned any dollar value;
    we have only accomplished a listing of important stuff that we''d be loath to
    lose. Before we start talking dollars and cents, we have to perform the business‐impact
    analysis work.


    ## Business‐Impact Analysis


    At this point, we move away from looking at enterprise‐wide root assets to looking
    at business units. You could apply the same exact methodology with each business
    unit, and you would be right. You''d also be tired. Very tired. That''s because
    if you attack a business‐impact analysis (BIA) from the start by creating that
    unit''s asset listings, you''ll be spending endless hours cataloging and cross‐referencing
    assets into systems, and so on.


    I recommend going at it from the top, and digging down only to the point that
    is useful to your specific cybersecurity program. To do this, you''ll need to
    look at the world from the point of view of systems, not assets. Systems, in this
    context, encompass all assets: A system, in this case, is defined as the collection
    of hardware, software, processes, workflows, and people that act to create, preserve,
    modify, disseminate, and curate data throughout its life cycle.


    Say that three times fast, and notice: We added *people*. That''s important in
    a business‐impact analysis because when it comes to resources you will need to
    consider the people necessary for recovery and operations. Now, let''s take this
    definition, and business unit by business unit, identify our top 10 properties,
    expanded in more detail further on:


    *   *The owner:* We are now moving past the enterprise as the owner. We''re looking
    at humans! We need to find the one true subject‐matter expert when it comes to
    a specific business unit, system, and assets. No one will know it better than
    the owner. He or she will know what it takes to run it, where the possible vulnerabilities
    are, what the impact of its loss may be to them, and by extension, to the company.
    This is why the owner must lead this identification and classification effort
    for the particular business unit, systems, and assets. They are also very invested
    in the longevity and health of their world, which makes them even more in tune
    with the threats against it.


    *   *The custodian:* Just as the owner is critical in helping you understand all
    the nuances about the business unit and its systems, the custodian is critical
    to providing an ecosystem context. Think of a horse and a barn manager. The barn
    manager doesn''t get to decide who rides the horse (that''s the owner''s job),
    but the barn manager is responsible for providing a safe environment, food, water,
    coordination with the vet, and so on. The custodian is important to you because
    he or she can provide information that''s critical to understanding what it takes
    to keep the owner''s business viable, which in turn will define all sorts of priorities
    and criticalities (e.g., No hay? No horse! Or at least a very hungry, cranky horse!
    Don''t ride that horse.)


    *   *Location:* The location of a business might sound like a painfully obvious
    detail, but keep in mind that location is not just a real estate question anymore.
    Of course, you need to know the physical location of the business unit, especially
    if there are multiple locations all over the planet. This information will also
    provide valuable context (“What do you mean you can''t find the CFO in India?”)
    and exposes all sorts of vulnerabilities that are specific to geography, time,
    and local regulations.


    But beyond real estate, our particular interest is locations in the cloud. Forget
    the obvious (where *is* the cloud, exactly?), and start thinking about new and
    exciting terms like *co‐tenancy* (your stuff has roommates that you didn''t know
    or approve), *transborder data flow* (your stuff lives on servers in multiple
    countries), *regulatory* and *compliance* issues (e.g., data in Europe is regulated
    differently from data in the United States), right‐to‐audit issues (the cloud
    provider must agree to your ability to audit), certifications, and so on.


    Do remember, please, that if your stuff is in the cloud, then by definition, you
    are a tenant. This matters because the landlord may have different priorities
    than you do. For example, imagine that there is a robbery in the building, but
    not in your apartment; the landlord may or *may not* notify you. Now translate
    that into digital terms: If your cloud is breached but your specific data is not
    affected, will you even find out the breach occurred? Wouldn''t you want to know?
    Bottom line: If your stuff is in the cloud, you will need to do additional homework
    to make sure you''re protected.'
  fmt: "\n## 资产分类与估值属性\n\n*   **Owner（所有者）**：谁是资产的所有者？如果我们讨论的是根级数字资产，如最终确定的产品（例如产品设计、诉讼文件、财务报表等），那么所有者就是企业。如果我们讨论的是价值生成系统，如电子商务网站、医疗记录系统或内容管理系统，那么所有者可能是一个业务单元。稍后在讨论业务影响分析时会详细说明。\n\
    \n*   **Custodian（保管人）**：谁是资产的保管人？保管人不能笼统地是“企业”。它必须是一个可识别的个人、部门、业务单元或供应商。你必须能够说出：“Fatima\
    \ 是保管人——去找她！”\n\n*   **Location（位置）**：资产在地理上位于何处？这至关重要，特别是当资产最终存放在云端时。同样，要具体。\n\
    \n*   **Confidentiality Classification（机密性分类）**：将资产评级为 1 到 4 级：公开、机密、秘密或绝密。\n\n\
    *   **Criticality Classification（关键性分类）**：将资产评级为 1 到 4 级：可有可无、可选、必要或任务关键。\n\n\
    *   **Impact Classification（影响分类）**：这是对资产不可用、损坏或毁坏的痛苦程度衡量。这里也适用 1 到 4 级评级：如果资产突然不可用或损坏，痛苦程度是无、轻微、中度还是严重？\n\
    \n*   **Maximum Tolerable Downtime (MTD，最大可容忍停机时间)**：如果资产未能恢复，影响变为严重的时间点。\n\n\
    *   **Recovery Point Objective (RPO，恢复点目标)**：你需要资产恢复到的特定时间点。\n\n*   **Recovery\
    \ Time Objective (RTO，恢复时间目标）**：你愿意在资产重新投入生产前等待多久？\n\n*   **Resources（资源）**：谁将负责在\
    \ RTO 内且达到 RPO 的条件下使资产恢复运行？记住，要具体。使用名字！\n\n我要告诉你一个小秘密。当我逐个业务单元进行业务影响分析时，我想了解的正是这\
    \ 10 个问题。\n\n区别在于？当我进行资产分类与估值时，我关注的是根资产——企业层面的价值资产。当我进行业务影响分析时，我更关注系统——具体来说，是每个业务单元为生产根资产所必需的关键系统。有人可能会争辩说这种区分是人为的，他们是对的。但我喜欢将整个过程视为一个连续体。资产分类与估值为业务影响分析提供输入，后者又为业务连续性和灾难恢复提供输入，所有这些都有助于构建可靠的网络安全计划。\n\
    \n收集完所有资产数据后，你就可以进行下一步了。就像剥洋葱一样，你需要在业务单元层面执行相同的练习。这反过来可能会引导你深入更多层级，因为你会发现系统和工作流的依赖关系。\n\
    \n请注意，我到目前为止避免提及任何具体的资产估值。目前我们拥有的是一份有价值资产的电子表格，其所有者是企业，以及少数所有者为业务单元的资产。我们尚未分配任何美元价值；我们仅完成了列出我们不愿失去的重要事项清单。在开始谈论金钱之前，我们必须先完成业务影响分析工作。\n\
    \n## 业务影响分析\n\n此时，我们将视角从企业级根资产转移到业务单元。你可以对每个业务单元应用完全相同的方法，这没有错。但你会累得精疲力竭。之所以非常累，是因为如果你从创建该单元的资产清单开始着手业务影响分析\
    \ (BIA)，你将花费无数小时将资产编目并交叉引用到系统中，等等。\n\n我建议自顶向下进行，仅深入到对你特定网络安全计划有用的程度。为此，你需要从系统的角度而非资产的角度来审视世界。在此语境下，系统涵盖所有资产：这里的系统被定义为硬件、软件、流程、工作流和人员的集合，它们在数据的整个生命周期中对数据进行创建、保存、修改、传播和管理。\n\
    \n快说三遍，并注意：我们加入了*人员*。这在业务影响分析中很重要，因为当涉及资源时，你需要考虑恢复和运营所需的人员。现在，让我们采用这个定义，逐个业务单元识别我们的前\
    \ 10 个属性，详细展开如下：\n\n*   **The owner（所有者）**：我们现在超越了企业作为所有者的概念。我们关注的是人！我们需要找到针对特定业务单元、系统和资产的唯一真正主题专家。没有人比所有者更了解它。他或她知道运行它需要什么、可能的漏洞在哪里、其丢失对他们以及延伸至公司的影响是什么。这就是为什么所有者必须领导特定业务单元、系统和资产的识别和分类工作。他们也非常关注其世界的长久和健康，这使他们更能洞察针对它的威胁。\n\
    \n*   **The custodian（保管人）**：正如所有者对于帮助你理解业务单元及其系统的所有细微差别至关重要一样，保管人对于提供生态系统背景也至关重要。想象一匹马和一个马厩管理员。马厩管理员不决定谁骑马（那是所有者的工作），但马厩管理员负责提供安全的环境、食物、水、与兽医的协调等。保管人对你很重要，因为他或她能提供对维持所有者业务可行性至关重要的信息，这反过来将定义各种优先级和关键性（例如：没干草？马就没了！或者至少是一匹又饿又暴躁的马！别骑那匹马。）\n\
    \n*   **Location（位置）**：业务的位置听起来可能是一个显而易见的细节，但请记住，位置不再仅仅是房地产问题。当然，你需要知道业务单元的物理位置，特别是如果在全球有多个位置时。这也将提供宝贵的背景（“你说在印度找不到\
    \ CFO？”）并暴露特定于地理、时间和当地法规的各种漏洞。\n\n    但除了房地产，我们特别关注云端的位置。忘掉显而易见的（云到底在哪里？），开始思考一些新奇的术语，如*共租*（你的东西有你不知情或未批准的室友）、*跨境数据流动*（你的东西存储在多个国家的服务器上）、*监管*和*合规*问题（例如，欧洲的数据监管方式与美国不同）、*审计权*问题（云服务商必须同意你的审计权）、认证等。\n\
    \n    请记住，如果你的东西在云端，那么根据定义，你就是租户。这很重要，因为房东的优先级可能与你不同。例如，想象大楼里发生了抢劫，但不在你的公寓里；房东可能通知你，也可能*不*通知你。将其转化为数字术语：如果你的云被攻破但你的特定数据未受影响，你甚至可能发现不了这次攻破？难道你不想知道吗？底线：如果你的东西在云端，你需要做额外的功课以确保受到保护。\n"
