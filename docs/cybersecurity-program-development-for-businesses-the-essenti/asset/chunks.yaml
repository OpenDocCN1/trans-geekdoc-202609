    at—no matter the size. You don''t want to be at the mercy of experts talking above
    your head and around you. You want to participate in the conversation; you want
    to know what you''re getting into. You are also an individual concerned about
    your privacy. You are alarmed about all the stuff about cyberattacks, hackers,
    and the like bombarding you in the news, and you want to stop feeling helpless
    about it. You are also a pragmatist who knows you can''t spend your day being
    terrorized into hiding, paralyzed with inaction, or crippled by the costs of compliance
    and cyber‐protection.


