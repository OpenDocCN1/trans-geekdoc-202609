- raw: 'No matter what, no matter who, this is an excellent opportunity for you to
    build a bridge with the IT department, irrespective of structure and delivery.
    In most cases, you''ll be welcomed. It isn''t often that non‐IT professionals
    take an interest in what''s behind the black door and all those blinking lights.
    Connect with the IT leadership and get a good understanding of the role of technology
    in your company.


    What does that typically look like?


    To begin with, IT in organizations is manifested in more than one way. Many different
    analysts and research firms have given the phenomenon different names. For example,
    Gartner Research has coined the term *bimodal IT* to describe the *keep the lights
    on and trains moving* version of IT, and the *go wild, innovate, and experiment*
    version of IT. Then there is *shadow IT*. That''s the version of IT that springs
    up as a result of unanswered (or frustrated) user needs. For example, let''s say
    corporate policy prohibits more than 5MB email attachments, and to get to the
    company''s file‐sharing server, you have to jump through all sorts of hoops. The
    user, acting out of urgent need or defiance, opens up a Dropbox account and shares
    the credential with colleagues and clients. Each one of these modes will have
    its own cybersecurity considerations, with shadow IT being particularly tricky
    to support and secure.


    For example, there are companies whose infrastructure (the stability part) is
    absolutely critical to operations. For example, think of a trading system. If
    the system goes down during trading hours, the company loses business, with potential
    losses in the millions. Alternatively, there are companies whose infrastructure
    is not as critical when compared with their ability to deliver an answer quickly.
    In this case, think software development. A firm could be running on a distributed
    infrastructure all over the world with little worry about any one component of
    it being unavailable, and yet it must be able to deliver a necessary fix to an
    application as fast as possible because, say, there may be lives depending on
    it, as in the case of a hospital management system.


    Going back to your discovery needs, your IT team will be able to provide you with
    their specific assessment. They can identify their systems, the locations, what''s
    critical, and what''s not. They''ll supply you with exciting documentation like
    network diagrams, systems inventory, application inventory, licensing documentation,
    and they''ll cap it off with the disaster recovery and business continuity plans.
    Depending on the size of your organization, these assessments will fit in a neat
    little binder, or the mailroom will drop off a pallet. Either way, you''ll be
    good to go.


    The IT department will also give you their views of what''s at risk and when they
    do, take careful notes—especially on the intersection of technology and business
    operations. This will prove very useful as you move forward with asset valuation,
    business‐impact analysis, vulnerability, and risk assessments.


    So far you have gathered the following pieces of information:


    1.  Mission and vision statements


    2.  Cultural assessment findings


    3.  IT documentation and assessment


    Now, you''re ready to understand what''s at risk.


    ## What''s at Risk?


    This is the part where you get to walk around and pose this question: “How much
    is *this* worth to you?” *This* is the asset you''re interested in protecting,
    and the only one who can determine its worth is the person who owns it.


    Without getting overly complex here—after all, this is only the overview chapter!—the
    asset owner is the person who, one way or another, is responsible for the asset.
    For example, the CFO is responsible for the financial assets of the company. What
    are those? They can range from simple things like Excel spreadsheets, access to
    the bank accounts, and the accounting system files all the way to massive ERP
    (enterprise resource management) applications. The CFO is the one who is responsible
    for all of this, and she''s the one who can tell you how much these assets are
    worth to her. By *worth* I don''t really mean monetary value. I mean things like:
    How long can she be without those assets, how much data can she afford to lose,
    and, in cases of loss, how quickly does she need to be back in business?


    Where do you start this risk assessment? First, identify your business managers.
    Each one will typically be responsible for a line of business or a department.
    Sit down with each one and ask him or her to identify all the things that are
    absolutely necessary to do their jobs. The list is likely to include multiple
    assets, both hard (computers, facilities, etc.) and soft (software, workflows,
    etc.). You should work with each manager in ranking and prioritizing each asset.
    At the end of these meetings, you will have a very clear idea of each department''s
    assets, and the corresponding impact of each asset''s loss.


    If you want to get formal about this, you can ask for a department‐by‐department
    business‐impact analysis, and from the results, you can derive both the assets
    and the business impact of their loss or disruption. But what fun is that? Make
    it personal and get in there! Roll up your sleeves and work with your colleagues
    in getting all this done. You''ll certainly gain a better understanding of what''s
    going on with the business, and make a whole bunch of new friends. (Or, enemies,
    if they don''t want to be bothered…but hey! You''re the one trying to cover their
    assets! They''ll see the light eventually.)


    Okay, you''re almost done. You''ve made tremendous progress in gaining an understanding
    of your organization, more than most employees or even managers ever do. You should
    celebrate. Go have a nice lunch. Nothing crazy, though: There is still work to
    be done. Skip the martinis.


    ## Threat Assessment


    So, what''s left? Well, the next step in the process should be a threat assessment.
    Now, that can be really intimidating, but it needn''t be. Here''s why:


    Performing a threat assessment requires skill and expertise that you may not have
    readily available. It requires up‐to‐date threat intelligence access, and it requires
    understanding the threat behavior. As an example, consider a house on the top
    of a large hill. The owner has done all the work up to this point, recognizes
    the asset at risk (the house), and is getting ready to deploy controls to protect
    the asset. One of the controls he chooses is a sump pump. Now, sump pumps are
    wonderful and really, really useful if you''re flooded, but the house is at the
    top of the hill. Is the threat of a flood realistic? Wouldn''t it be better to
    invest in a lightning rod? Don''t get me wrong, you may still want the sump pump
    in case one of the pipes burst, but what''s the priority here?


    That''s exactly why you should not be intimidated by performing a threat assessment:
    You are armed with common sense, and you are ready to take this on! You also need
    to remember you''re not alone in this. There is a whole community out there watching,
    analyzing, and sharing all sorts of threat intelligence and best practices. In
    the United States, the Department of Homeland Security is running the United States
    Computer Emergency Readiness Team (US‐CERT), whose mission is to “strive for a
    safer, stronger Internet for all Americans by responding to major incidents, analyzing
    threats, and exchanging critical cybersecurity information with trusted partners
    around the world.” You will find them at: [https://www.us‐cert.gov](https://www.us-cert.gov),
    and you''ll get all the alerts and tips you need to get a very good feel of what''s
    going out there in cyberspace.'
