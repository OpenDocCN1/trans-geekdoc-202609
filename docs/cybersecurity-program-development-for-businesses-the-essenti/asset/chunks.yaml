- raw: "*   *Lunch and learn*. This is a less formal presentation. If at all possible,\
    \ avoid slides and the like. Set up the room in as round and inclusive a layout\
    \ as possible (no podium, be part of the audience). Your goal is to have a discussion\
    \ about a cybersecurity topic over lunch. Any material for your learners should\
    \ be handed to them at the beginning, and let them peruse them at their pace.\
    \ Keep the topic focused. For example, you don't want to have a “Cybersecurity\
    \ Awareness Lunch and Learn.” Be specific! You want to have “Phishing, and all\
    \ the ways you can get hooked!” lunch and learn.\n\n*   *Group learning*. This\
    \ is a great way to convey complex topics to either a small group, or sets of\
    \ groups. For each group, you will need a skilled trainer in team‐building and\
    \ role‐playing methodologies. The idea here is that you are taking a topic and\
    \ really acting out everything there is to know about it. For example, if you're\
    \ group learning about phishing, you may want to guide the group through an exercise\
    \ in which members of the group alternate into the role of the hacker and try\
    \ to fool the others to act on their instruction. What's the instruction? It can\
    \ be anything, such as handing over a bunch of Legos! (Legos are a great interactive\
    \ training prop! Don't leave your office without your Lego bucket!)\n\n*   *E‐Learning*.\
    \ If you have decided that your training strategy is a learner‐led one, then e‐learning\
    \ will play a crucial role in successfully delivering and testing your cybersecurity\
    \ awareness program. To be sure, e‐learning can, and should, complement *any*\
    \ training methodology. It allows for constant assessments, reminder quizzes,\
    \ and on‐demand availability of information. It also reinforces all the other\
    \ methods, since it can be a complementary resource to those who want to know\
    \ more about the specific topic, or for those who for some reason or another couldn't\
    \ attend the instructor‐led training.\n\nThere are several excellent e‐learning\
    \ cybersecurity awareness programs. Consider, for example, the SANS Institute\
    \ training offerings, Inspired Learning, Wombat Security, PhishMe, and Security\
    \ Mentor to name only a very few. Please note that this is not an endorsement\
    \ of any of specific program, and the preceding list is far from complete. I am\
    \ mentioning them here to start you on a path to discovery for the right vendor\
    \ for your specific company needs. Do your research and due diligence, and partner\
    \ with the vendor that is right for you.\n\nI cannot emphasize enough the importance\
    \ of integrating your specific company culture and needs with cybersecurity awareness\
    \ training. It also goes without saying that this is not a one‐and‐done type of\
    \ activity. Depending on size and scope of your company, you will need to provide\
    \ regular refreshers, training support, quizzes, reminders, and so on. Also remember\
    \ that you need to integrate the training across the life cycle of all employees—from\
    \ onboarding to offboarding.\n\nBe sure to include in your training their at‐home\
    \ behavior. Your employees are exposed to cyberthreats both at work and at home.\
    \ After all, if an employee uses the same laptop at home as in the office, then\
    \ the cybersecurity risks don't stop at the office door.\n\nThe good news is that\
    \ a successful cybersecurity awareness program can be one your most effective\
    \ controls in your defense‐in‐depth strategy. Companies with an aware population\
    \ have seen up over a 30 percent improvement in their ability to detect phishing\
    \ scams, insider threats, even abnormal system activities.\n\nMy advice: Take\
    \ cybersecurity awareness training very, very seriously. Just because it is a\
    \ soft control (as opposed to all the high‐tech hardware, software, and services\
    \ ready), that doesn't mean it's any less effective. As a matter of fact, time\
    \ and time again, security awareness consistently proves itself as one of the\
    \ best controls against attacks. Invest in it accordingly.\n\n# CHAPTER 13  \n\
    \nLiving Cybersecure!\n\n> *Remember, no matter where you go, there you are.*\n\
    \n> \n\n> —*The Adventures of Buckaroo Banzai Across the 8th Dimension*\n\nAnd,\
    \ here you are! You made it! You plowed through chapter after chapter, stayed\
    \ with me through some pretty tricky topics, learned a whole bunch of acronyms,\
    \ reviewed cases studies, and now?\n\nNow you know a lot more about your company\
    \ than when you started! You know about its assets, its threat profile, and its\
    \ risk appetite. You know where all the bodies are buried. You know what's worth\
    \ protecting, and by how much. And you got to make a whole new set of friends\
    \ in the process.\n\nYou are also in the proud ranks of the wise men and women!\
    \ Wise people know what they don't know. The trick here is to recognize this and\
    \ stay within their ranks. You need to take the knowledge that you gained, look\
    \ at it critically, find ways to build on it, and always, always question it.\n\
    \nCybersecurity is a science; a hard one at that. A science that's rapidly evolving.\
    \ New discoveries, new approaches, new best practices are discovered, tested,\
    \ and applied daily. Staying on top of this field is no easy task—some would argue\
    \ it's impossible—but staying informed is something that you can, and should,\
    \ do. As we've discussed, cybersecurity is a shared responsibility, and staying\
    \ on top of it is one of the things that you must do.\n\nWhen it comes to staying\
    \ on top of things, how much is enough? Much depends on your role and day‐to‐day\
    \ responsibilities. For a busy C‐level executive, receiving pertinent alerts and\
    \ a weekly summary may be enough. For a hands‐on operations executive with cybersecurity\
    \ oversight responsibilities, a daily briefing may be necessary. For a board member,\
    \ alerts and a quarterly report from the CISO may be all that is needed. Frequency,\
    \ quantity, and context will be determined by the size and needs of your specific\
    \ organization. One thing is certain: You will need to stay informed and current.\
    \ Forever!\n\nWhat else do you need to know? Well…that list is long. Very long!\n\
    \nWhat else do you need to know to support your newly created cybersecurity program?\
    \ Now, that's more manageable, and I have some ideas!\n\nIn general, the things\
    \ you need to be aware of tend to fall into one of the following categories:\n\
    \n*   *Scientific developments*. These are straight‐up developments in the field.\
    \ Like I mentioned, there are thousands of cybersecurity professionals who are\
    \ constantly pushing the envelope. Their dedication and breakthroughs are what\
    \ makes this world a safer place, and books like this possible. Regarding where\
    \ you can learn about their constant progress, my recommendation is to join one\
    \ or more of the several worldwide organizations who support and advance the science\
    \ and application of cybersecurity. For example, I have made frequent reference\
    \ to CIS, ISACA, ISSA, (ISC)², ISO, and the SANS Institute. There are also government\
    \ agencies like ENISA and NIST that also provide a wealth of information and best\
    \ practices for a variety of industries and company sizes. A bit of research (and\
    \ some well‐spent membership dollars) will go a long way toward keeping you informed."
