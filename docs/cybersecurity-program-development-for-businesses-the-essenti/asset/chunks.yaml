  trans: '


    ## 预防性控制


    预防性控制是信息高速公路的路障。它们旨在阻止攻击者接触资产。如果资产涉及物理保护，那么预防性控制的一个好例子就是保安。保安的数字化对应物包括：


    *   **防病毒和反恶意软件应用程序**。通常归类于端点保护系统，这些主要是基于特征码的应用程序，它们扫描流量，将其与已知威胁数据库进行比对，并据此做出决定。我所说的“特征”是指这些病毒和恶意软件程序一经发现，就会被发现在外观上具有独特的特征，就像签名一样。这使得防病毒和反恶意软件应用程序能够识别它们。它们现在知道要找什么了。这些应用程序的好坏取决于其特征码数据库及其更新频率，尽管最优秀的版本会采用启发式分析来预测可能的恶意软件，以及跨应用程序（如电子邮件、Web
    浏览器、移动应用等）的复杂接口。我的建议：未安装并更新此类软件，切勿开机。


    *   **网络安全意识培训**。前文已论及，员工意识是最有效的预防性控制之一。培训包含面向全体员工的现场培训和按需培训。最有效的版本采用混合授课方式，每年至少重复两次，并包含简短测验等后续跟进，以保持所有人警惕。


    *   **数据丢失防护 (DLP)**。旨在确保敏感数据停留在其所属位置，这些系统在组织的多个层面运行。根据配置，DLP 会查找特定类型的数据（信用卡号、社会安全号、账号等），并确保仅授权用户才能访问。DLP
    还可以检查流量，确保敏感信息不在传输中，无论是在网络上、外部存储设备（如 USB 驱动器）上，甚至是打印机上。DLP 的好坏取决于其配置和维护，因此你需要格外敏感地确保它们时刻了解你的数据环境和安全策略。当正确部署时，它们可以成为强大的预防性控制，能与其他控制良好协同，并且是少数能提醒你潜在内部威胁的控制之一。


    *   **防火墙**。这些是旨在将内部（公司）网络与互联网隔离的设备。它们有多种类型，功能、配置选项和复杂程度各异。有些防火墙在加密数据的同时监控流量。其他的监控流量并将其与恶意软件特征码比对。还有些防火墙具备上述所有功能甚至更多。请记住，防火墙的好坏取决于其配置。配置错误的防火墙，或维护不善的防火墙，毫无用处。你的具体控制需求将决定部署哪种类型、多少防火墙，以及如何配置它们。


    *   **网关**。网关监控并控制进出公司服务器的互联网流量。假设你在公司电脑上访问一个网页。你可以部署一个网关，它感知你的网页请求，将其与其他流量隔离，伪装它，甚至加密它，然后发送出去。为什么要这样做？因为如果请求被拦截，拦截者得不到你的地址；他或她只能看到网关。在这个例子中，这个网关被称为（Web）代理服务器：一种通过管理每个会话并仅向外部世界暴露自身，来隐藏其他内部设备的设备。你可以部署应用层网关，专注于服务；也可以部署电路层网关，监控例如跨所有服务的特定通信协议。大多数防火墙和代理服务器执行网络地址转换
    (NAT)，这是一种将内部不可路由设备地址（不能在互联网上使用）映射到外部可接受的互联网地址的方式。


    *   **入侵防御系统 (IPS)**。这些系统通过引入系统监控层，补充了防火墙、防病毒和反恶意软件系统的全景防御。与寻找特征码的 IDS 不同，IPS
    会根据什么构成你网络上的正常行为进行调优。一旦发生偏离该框架的情况，IPS 就会发出警报。此语境下的警报不仅包括记录事件，还包括终止连接的能力。一个调优良好的
    IPS 响应示例，是立即终止意外发生的文件加密活动，这通常是勒索软件攻击的结果。当然，如果你的“正常”行为五花八门且无法建立基线，那么 IPS 可能难以调优，并因此产生大量误报。


    ## 检测性控制


    如果预防性控制是路障，检测性控制就是运动传感器，让你知道有人进入了房间。其背后的理念是检测异常并发出警报。列在预防性控制下的某些控制作为示例在此也适用——例如，防病毒和反恶意软件系统以及入侵防御系统可被视为既是预防性又是检测性的。其他检测性控制示例包括：


    *   **入侵检测系统 (IDS)**。这些本质上是强化版的防病毒和反恶意软件系统，结合使用基于特征码的分析（不仅将流量与已知病毒和恶意软件特征码比对，还与特定攻击模式比对）和异常分析（将预期的正常系统行为与当前状态比对）。IDS
    的智能程度和有效性因部署的系统而异。有些利用人工智能应用从环境中学习，从而更擅长检测攻击。IDS 通过提供广泛的事件日志记录、自动化响应和触发下游控制，以及组织安全策略执行，集成到更大的控制套件中。最后一点是指你的网络安全部门辛苦制定的一套规则，旨在解决跨系统的控制和通知行为。这可是高深莫测的东西。


    *   **安全信息和事件管理系统 (SIEM)**。这些是结合了检测和响应管理的应用程序。它们结合了跨多个系统的事件日志分析、事件关联、异常事件检测、通知、自动化操作和响应事件跟踪。正如你所想象的，日志和事件的量呈指数级增长，只能由优秀的
    SIEM 妥善管理。如果被迫二选一，我会先部署 SIEM 再部署 IDS，因为就我而言，可靠的 SIEM 能提供比任何 IDS 更大的企业级洞察力和协调能力。


    ## 纠正性控制


    顾名思义，这些是专注于在攻击期间或之后修复损害的控制。许多针对性控制属于此类：例如，漏洞修补就是一种纠正性控制。保持系统最新——意味着最新的操作系统版本以及应用程序版本——也代表纠正性控制，因为它修补（纠正）了已知漏洞。


    但终极的纠正性控制是备份，这值得花些时间探讨。当你知道拥有一套良好、可靠的备份集可供恢复数据时，那种如释重负的感觉无可替代。要做到这一点，你需要了解可用的备份类型，以及何时使用哪种类型。


    '
