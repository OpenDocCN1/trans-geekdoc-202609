    # People


    ## Just the Facts, Ma''am!


    After the *who*, you need to document the *how*, and you need to do it in excruciating
    detail. You need to know exactly what happened, when it happened, how it happened,
    what vulnerabilities were exploited, how it was discovered, which alerts were
    triggered, and which were not. You need all the facts about the incident, in as
    much detail as possible. This will help you tune your defenses and identify holes
    in your control deployment.


    ## Knowing Now What You Didn''t Know Then, What Do You Need to Change?


    This is the introspective component of the exercise. You need to look inward and
    understand how your organization reacted to the incident. Look at everything and
    leave no stone unturned. How did the incident‐response team act? Were procedures
    followed? Were internal communications effective? Was the response time adequate?
    Were the response actions timely and adequate? Did you meet `MTD`, `RPO`, and
    `RTO` targets? How did the executive team support the effort? How did the staff
    react? How was the IT‐cybersecurity partnership performance? Once these questions
    are answered, you can collectively sit down and tune your incident‐response plan
    such that next time you can perform better.


    ## How Do You Stop This from Happening Again?


    Having understood the organization''s and team''s performance, plus all about
    the incident itself, you need to plug the hole that allowed the incident to occur
    in the first place. This sounds a lot easier than it is. If the breach was due
    to a phishing incident, for example, your options may be limited to better email
    sandbox tuning and targeted cybersecurity awareness training. Neither of those
    will plug the hole completely. They may narrow it, but there is no guarantee that
    another member of the staff will not fall victim to such an attack. In which case,
    you''re going back to layered defenses (sandboxing, role authorities, monitoring,
    training, etc.).


    ## Do It All Over Again!


    As we discussed earlier, cybersecurity program development in general and incident‐response
    planning specifically are living programs. They change over time, they change
    with your environment, the market, the technology, and they change because you
    change. You learn, you grow, you adapt.


    The good news is that as you learn, grow, and adapt, you can apply your knowledge,
    experience, and adaptation to your cybersecurity and incident‐response plans.
    You get a second chance! And, a third, and a fourth….


    Change is the only constant here, and it represents a wonderful opportunity in
    keeping your cybersecurity program constantly tuned. Embrace this, and take advantage
    of it. The alternative is catastrophic: An obsolete cybersecurity and incident‐response
    program are just as bad as not having any.


    ## What''s in It for Me?


    Up until now we''ve been asking the question, “How much is it worth to you?” That''s
    the right question to ask of the board of directors, shareholders, and so on in
    determining risk appetite and crafting the right cybersecurity strategy and program.
    Obviously, we never want to apply controls that are more expensive than the assets
    we protect, but between that floor and the ceiling set by risk appetite we have
    a lot of room and a lot of choices.


    Now, we are asking people to engage with us and help us make our cybersecurity
    program a success. Why should they? Because we ask nicely? Because the company
    mandates it? Because of the “Only You Can Prevent Cybersecurity Incidents” poster
    in the break room?


    I''ve emphasized how important senior management buy‐in and support is for a cybersecurity
    program. We''ve discussed the significance of board engagement, and the role of
    company leadership in not only leading by example, but also conveying the message
    that cybersecurity is a shared responsibility. Now, though, we have to go from
    the abstract to the specific—from policy to people. That means confronting a new
    question: “What''s in it for me?”


    The literature on human motivation is extensive, and reviewing it in depth is
    clearly beyond our scope. But let''s dip our toes in a little because you need
    to know a few basics in order to give your new cybersecurity program the best
    chance of success. This chapter will introduce some fundamentals about what makes
    people''s attitudes shift, what kind of messaging works, and how to design a cybersecurity
    awareness program.


    ## Attitude Adjustment!


    In their classic *Handbook on Social Psychology* (1986), McGuire, Lindzey, and
    Aronson defined *attitude* as beliefs and behaviors toward something. This something
    could be work, could be ideas, could be other people. Moreover, attitudes change
    with time, cultural influences, personal motivation, and knowledge acquisition.


    A key factor in the ability to shift a person''s attitude is a phenomenon called
    emotional resonance. Fear is a useful tool in provoking attitude change. When
    I used to teach computer science at the Stratford School in Rochester, New York,
    I used to tell my students that I considered “fear a valid educational tool!”
    I was, of course, joking, since I am one of those who prefer honey to vinegar
    any time of the day. Still, Professor Howard Leventhal at Rutgers University,
    in his 1970 paper “Findings and Theory in the Study of Fear Communications,” makes
    two critical points that are particularly relevant to communicating a cybersecurity
    awareness message. The first is that “increases in fear generally increase persuasion,
    but there obviously are conditions where this is not so.” The second one is that
    “when high fear messages fail to persuade, the failure frequently reflects the
    subject''s felt incapacity to cope with danger.”


    There have been plenty of situations when I''ve tried to communicate a sense of
    urgency or danger to boards and executives, and those experiences fully confirm
    Dr. Leventhal''s points. In general, following delivery of my message, there is
    a shift in the recognition that there is a problem to be solved, and in most cases,
    a follow‐through action.


    There is, however, a small percentage who inevitably reject the message altogether.
    They are the ones who will try every excuse in the book to ignore the new cyberreality
    (“We''re too small,” “Hasn''t happened yet,” “We''ll look into it next year…”).
    They are unable (or unwilling) to cope with the new dangers that our world now
    presents, and instead choose to hide their heads in the sand.

