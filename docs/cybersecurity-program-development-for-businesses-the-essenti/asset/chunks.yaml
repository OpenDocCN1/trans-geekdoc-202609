    # CHAPTER 2


    Everything You Always Wanted to Know About Tech (But Were Afraid to Ask Your Kids)


    How much do you need to know for us to have an intelligent conversation about
    your business data, your personal information, potential threats, and your options
    to address those threats? The answer is surprisingly fluid, as it is with any
    fast‐changing field. How much do you need to know about medicine to have a meaningful
    conversation with your doctor about your health? How much do you need to know
    about law to understand and engage with your attorney? How much do you need to
    know about cars to talk to your mechanic?


    It''s a tricky question with no easy answers, and to some degree, it involves
    lots of individual choice. Some people dive deep into research before consulting
    with a medical expert; doctors jokingly refer to these folks as “Google Medical
    School graduates.” Others shy away from research entirely, depending on the expert
    advice of professionals. But no matter where on the spectrum you find yourself,
    everyone around the table should at least speak a common language. For example,
    you may not know precisely how your engine *works,* but you know what an engine
    *is*.


    Not so much with technology. The minute we start talking tech, eyes glaze over,
    mouths yawn, and palms sweat. For some reason, we forget we share a common language…and
    we need to fix that!


    Of course that is more easily said than done, especially when it comes to tech.
    Still, the success of this book''s message rests in its ability to reach you,
    be understandable, and actionable. We definitely need to be able to communicate
    at some level. To do this, I have chosen to abuse metaphors, go back to basics
    as needed, keep everything as simple as possible, use short case studies to illustrate
    examples, and live by Mark Twain''s adage: *Humor is the good‐natured side of
    a truth*.


    Our goal is a simple one: When done with this section, I''d like you to have the
    same tech facility you have when talking about your car. I am not expecting you
    to be a mechanic but I am hoping that you''ll get to know a bit about its history,
    the location of the engine, what the steering wheel does, and how to start it.


    It will also be good if you get to learn to drive the thing without killing anyone!


    ## In the Beginning…[¹](#c02.xhtml#c02-note-0001)


    There was darkness. And void. It was probably pretty cold, too. Then, the lights
    came on, rocks started spinning in the heavens, and before you know it, fish were
    walking on land, and all creatures big and small were living in glorious, albeit
    analog, bliss. Shortly thereafter, an English mathematician by the name of Charles
    Babbage came up with something he called the Difference Engine, now credited as
    the first computer. Three years later, it was hacked by Ada Lovelace when in 1843
    she published “Sketch of the Analytical Engine,” officially firing the starting
    gun and setting the world racing down the information highway. Moving right along,
    past the invention of the telegraph, the telephone, and the radio, almost a hundred
    years after Ms. Lovelace, Alan Turing, another Brit, published a paper titled
    “On Computable Numbers,” detailing the design of a digital computer.


    It didn''t take long for the rest of the world to get into the game. In 1938,
    Konrad Zuse built the first electromechanical binary computers, the Z1 and—of
    course—the Z2. A year later, John Atanasoff completed the first entirely electronic
    binary computer. World War II drove the development of electronic deciphering
    devices of which the German Enigma and the British Colossus are the best known.
    The public didn''t get to see a computer until 1944, when IBM constructed a room‐sized
    machine, the sexily named Automatic Sequence Controlled Calculator, at Harvard
    University (it was nicknamed Mark I by Harvard engineers). Not to be left behind,
    in 1946 the University of Pennsylvania inaugurated ENIAC, which weighed over 30
    tons with its 17,000‐plus vacuum tubes.


    Things were going splendidly in 1947, when a dead moth was found short‐circuiting
    the vacuum tubes of a Mark II computer, giving rise to the term *bug,* usually
    preceded by several expletives. The same year, John Bardeen, Walter Brattain,
    and William Shockley, working at Bell Labs, invented the first transistor. The
    rest, as they say, is history: In the blink of an eye, we went from massive mainframe
    computers to personal computers, tablets, smartphones, wearables, and even quantum
    computers. As of this writing, there is even experimental work of storing terabytes
    worth of data in *biocomputers* that use the DNA helix for memory. So much for
    *digital* devices!


    Paralleling the development of all these computers is the development of the networks
    that connected them. It started when the United States, quite annoyed by the incessant
    *blip‐blip‐blip* of Sputnik, formed the Advance Research Projects Agency (ARPA)
    in 1958. ARPA''s head of its command‐and‐control division, J.C.R. Licklider, sent
    a memo to his colleagues boldly asserting that the time was right for a network
    of interconnected computers. He was right. Several geniuses later (Leonard Kleinrock,
    Robert Taylor, Paul Baran, Ted Nelson, and more) and ARPANET was born!


    From then on, everything is a blur. Between 1969 and 1990, we had NET‐mania: ARPANET,
    ALOHANET, TELENET, USENET, and—yes—FIDONET, to name a few. At some point, all
    these NETs were talking to one another and everyone agreed to call the collection
    of all these connected networks, computers, and devices INTERNET and get it over
    with.


    In between all that, Ray Tomlinson invented email, and soon he received one from
    a Nigerian prince asking for money. Skipping past some incredible advances in
    computer science with even more funky acronyms (UNIX, ETHERNET, TCP/IP, RSA, DNS,
    PING, and so much more), we finally arrive at the glorious year of 1990, when
    Tim Berners‐Lee and Robert Cailliau first use the phrase “World Wide Web” as the
    name of a hypertext system that they had just developed, filling the world with
    links, most of which you should avoid clicking on.


    And here we are!


    ## Key Definitions


    We have a big advantage in our vocabulary‐building exercise in that, unless you''ve
    been living under a rock (in which case I am flattered that this is the first
    book you chose!), you already know most of the terms you need.


    This, therefore, should help clarify the terms as opposed to introduce them:


    *   **Hardware**: Any physical device that can store, process, or transmit data
    in digital form. Examples include everything from supercomputers to personal computers,
    laptops, tablets, cellphones, wearables, switches, routers, and digital appliances
    of every imaginable (and some unimaginable!) kind. Going forward, and as a matter
    of convenience, I will be using the term *digital device* as synonymous with *hardware*.

    *   **Software**: In its broadest definition, software is a set of instructions
    that guide hardware in performing a task. Nothing happens without software. Think
    car and driver. You may be familiar with the distinction between the operating
    system (OS) of a computer or phone and its applications (or apps), but while they
    are indeed different, both are software; they just do different things. The OS
    is the software that controls the use of the actual hardware while the applications
    make requests of the operating system to have the hardware perform specific tasks.

