- raw: 'Once that is done—once you are confident that the people‐technology‐operations
    triad has been properly engaged, issues addressed, and concerns satisfied—you
    are ready to document your defense in depth and let your people know what''s expected
    of them.


    ## Policies, Standards, Procedures, and Guidelines


    Remember all that fun stuff in our management, governance, and alignment chapter?
    This is where you put all that great knowledge to work!


    First, please note the absence of the word *training*. Training is not communicating;
    it is educating. It is critically important, no doubt, but at this stage of your
    program development, we need to communicate what the program is all about, and
    how it will be governed. We''ll do this through our policies, standards, procedures,
    and guidelines.


    As always, we''ll start with our definitions:


    *   *Policies* are the highest‐level directives in any organization. They originate
    with either the board or the top management. Policies are both definitive and
    general. For example, a policy might be: “This company is always headed north.”
    It''s definitive (we''re going north) but it''s also general (we''re heading north,
    but not necessarily on I‐95).


    *   *Standards* set the ecosystem of a policy. They create a mandatory and meaningful
    framework for understanding and implementing the policy. In our northward policy
    example, the corresponding standard would specify which modes of transportation
    should be used (plains, trains, and automobiles), what types of compass are acceptable
    in determining true north, and any other metrics that can be used to verify that
    the policy is being followed.


    *   *Procedures* are listings of actions that, if and when they are followed,
    satisfy the standards and thereby implement the policy. People frequently merge
    standards (which are mandatory) and procedures (which are optional) into a mandatory
    procedure—hence the frequent reference to policies and procedures. An example
    of a procedure would be: “When using a car to go north, you must: (a) make sure
    you have fuel, (b) make sure you have insurance, (c) make sure you have your license
    with you, (d) make sure the GPS is on…” and so on.


    *   *Guidelines* further clarify procedures. They, too, are optional, and may
    be specific to a department or function. In the example we have been using, a
    guideline would be: “You can only use the mail room truck if you are transporting
    boxes; otherwise, you should don your leather jacket and use the facilities''
    Harley.”


    When it comes to cybersecurity program development, you''re on the hook for developing
    and disseminating policies and standards. They must, of course, be approved by
    the executive team and, ultimately, by the board or its equivalent.


    Procedures and guidelines will be the responsibility of each department downstream.
    As the one charged with developing the cybersecurity program, you will advise
    and consult, but you cannot—and should not—be drafting departmental procedures
    and guidelines. Ownership of those must be local, or they will be unenforceable.


    The first policy you will create is the one that announces the existence of the
    cybersecurity program, along with its standards. I recommend that the structure
    of all your policies and standards follow a consistent format. You should always
    check with your HR and legal departments to make sure that you are following internal
    templates, but in the absence of one, I''m partial to the following list as an
    excellent starting point:


    1.  *Policy title:* This is where you announce to the company what this is about.
    My recommendation, across all these fields, is that old standby, “less is more.”
    Keep it short and to the point. For example, cybersecurity policy is enough. (No,
    your company name is not needed. If the people reading this don''t know which
    company they are working for, you have a much bigger problem than cybersecurity.)


    2.  *Policy description:* What is this policy about? Be specific without being
    verbose. For example, “This policy establishes the intent, provides direction,
    and sets expectations of conduct regarding cybersecurity.”


    3.  *Why are we doing this?* This question and the next have proven extremely
    helpful for two reasons: Answering the questions will force you to communicate
    a well‐thought‐out policy, and second, answering the questions will help set transparency
    expectations. Everyone needs to understand why a policy has been created and why
    it makes sense for the organization to have it. Finally, providing this information
    goes a long way in creating buy‐in by all involved, and trust me, without buy‐in,
    there can be no cybersecurity program. A good entry in this field should read
    something like, “We take the security of our people, our clients, and our data
    very seriously. As a direct result, we have decided to create and rigorously maintain
    our cybersecurity program which we have based on basic practices and proven cybersecurity
    frameworks.”


    4.  *Why does it make sense?* As I mentioned already, the great Peter Drucker
    wrote, “There is surely nothing quite so useless as doing with great efficiency
    that which should not be done at all,” and this is your opportunity to explain
    why this cybersecurity program does makes sense. Keep it brief. For example, “Having
    evaluated our assets, threats, and our risk tolerance, we understood that unless
    we take concrete, measurable action in cybersecurity, we would be exposing everyone
    to unacceptable risks. This program is our answer in minimizing and mitigating
    this risk as much as possible.”


    5.  *Whom does it impact?* The answer here is simple: everyone. Cybersecurity
    affects everyone in an organization. It is also everyone''s responsibility. It
    should be no surprise to hear that my recommendation in introducing a cybersecurity
    policy would be to answer this question in exactly that way: “Cybersecurity affects
    everyone in the organization. Moreover, cybersecurity is everyone''s responsibility.”


    6.  *What are the applicable standards?* Here you have some choices. If you prefer
    to stick with just policies and procedures, then skip this entry altogether, replacing
    it by a list of mandatory procedures. My recommendation is to stay with the standards
    because the idea behind a policy is that it rarely changes. It is a top‐level
    directive. For example, you wouldn''t expect our go‐north policy to change anytime
    soon, but you might expect the occasional change on the standards supporting the
    policy (for example, the addition of GPS to acceptable compasses). And you certainly
    expect the procedures and their guidelines to be changing as often as necessary.
    If you do choose to implement standards, then this is where you list them. For
    example, because you''re all over the NIST cybersecurity framework, you could
    say, “The standards supporting this policy are: identify, protect, detect, respond,
    and recover.” You would then produce and publish each standard, allowing for each
    department to develop procedures to support it. So, for example, accounting might
    set their own procedure for user access while the IT department would determine
    their procedure for endpoint protection.


    7.  *What is your responsibility under this policy?* This is where the rubber
    meets the road. Remember all the buy‐in talk earlier? This is where you find out
    if it worked or not. If you have done a great job in getting everyone''s feedback,
    incorporating their concerns, responding to their questions, engaging with them
    across levels, then they will be happy to integrate this policy into their lives
    and operations. If not…nothing you write here—even if it''s blind and unquestionable
    obedience—will help. I suggest something like, “You are responsible to understand,
    disseminate, and comply with this policy, its associated standards, and the specific
    procedures and guidelines as applicable to your job function in the organization.”


