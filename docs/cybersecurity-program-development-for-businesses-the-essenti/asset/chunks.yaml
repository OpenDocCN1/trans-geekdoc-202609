  trans: "\n精明的组织意识到了这一点，并通过培训用户、允许这种“按需 IT”所带来的部分（甚至全部）灵活性来未雨绸缪。关键全在于培训和控制。只要用户在理解风险和影响的程度上，以及适当控制到位的程度上，就让他们大胆闯荡、大显身手吧！谁知道呢？他们可能会发现一种能让公司变得更好的颠覆性解决方案，而该方案最终会成为采用的标准。但他们也可能发现地狱深渊，这正是控制措施存在的原因——确保只有少数用户“烧伤手指”，而组织整体安然无恙。\n\
    \n这引出了一个更自觉的选择：混合云解决方案。典型场景是：一组应用程序无法通过云交付，需要本地基础设施，而其他组应用程序则可以。同样常见的是看到本地私有云–公有云部署。那才是终极混合云！那是什么样子的？你有一组必须部署在本地的应用程序（例如，你的会计系统）。你有一个需要按需扩展的数据应用程序，它部署在私有云上。你还有由公有云提供商提供的公司邮箱。这就构成了彻底的混合云！\n\
    \n当然，安全考量不会有太大变化。但它们是累加的。你需要确保这些环境中的每一个都得到妥善处理，拥有自己的网络安全策略和控制措施，并定期进行评估。你对本地需求了如指掌，现在你也对公有云和私有云需要关注的内容有了一些概念。把它们全部混合在一起，你就得到了混合云网络安全考量。\n\
    \n在结束我们对计算环境的回顾之前，我希望你考虑两件事：首先，评估 `cloud` 解决方案不是在评估 `technology` 解决方案。你是在评估一个业务解决方案。你为确认其适配性和适用性所需做的工作，更接近于商业收购尽职调查问题，而非技术评估。\n\
    \n其次，当你踏上网络安全之旅时，极有可能已经有一个或多个云解决方案部署到位。现在，我们不仅要增加一项商业尽职调查工作，还要增加一项资产发现工作。那些云端存放着数据！你需要发现它们，并像对待宝贵资产一样对待它们。\n\
    \n在了解现有资源方面，你需要运用在“资产”一章中已学到的所有资产发现和分类技能。你需要与利益相关者接洽，识别资产，理解相应的工作流，并记录资产的完整生命周期。资产上使用了哪些服务？来源何处？谁控制它们？谁监控事件？报告机制如何？关于业务连续性和灾难恢复有何安排？资产的保管人是谁？谁负责合规？谁负责跨境问题？等等。到现在，你已经是这方面的老手了！\n\
    \n## 物联网\n\n2016 年 7 月，《商业内幕》预测到 2020 年将有 340 亿台设备连接到互联网，相应支出将达六万亿美元。在商业领域，推动这一扩张的主要驱动力将是运营效率和生产力提升。同时，你无日不读到关于新型智能家居或智能办公室、新型智慧城市、联网汽车，当然还有\
    \ FitBit、佳明、Apple Watch 等可穿戴设备的报道。\n\n在我们的网络安全语境下，这为什么对你很重要？因为如果你办公室里有一个连接到你网络的智能恒温器，而该设备不安全，那你不妨把门敞开，挂上一块巨大的霓虹招牌欢迎任何人进入。\n\
    \n不幸的现实是，这些设备在无人关注的情况下悄悄渗透进了企业用途。当然，网络安全部门绝不会被告知公司食堂插了一台智能冰箱。IT 部门也没被通知。他们为什么要被通知呢，对吧？总务部门的某人与供应商沟通，把\
    \ Wi-Fi 密码给了供应商，然后就被冰箱屏幕上绚丽的色彩迷住了。\n\n考虑到其普遍性，IoT 设备对你的网络安全计划构成了清晰而现实的危险。你需要遵循一套严格的步骤，确保\
    \ IoT 日后不会回来“缠上”你。具体而言：\n\n*   **对所有 IoT 设备进行详尽清点**。你需要联合 IT 和相关部门（例如总务、安保、视听等），梳理每一个联网设备。它们有什么功能？为什么要部署在那里？当然，它们在哪里？\n\
    \n*   **对所有 IoT 设备进行配置分析**。视环境中的设备数量而定，仅这一任务就可能是数小时不间断的“乐趣”。你需要知道环境中到底运行着什么，但这只是开始。你还需要那些血淋淋的细节，例如：什么类型的数据流经这些设备，相应的数据丢失概况如何，设备被攻陷的风险有多大，以及这些\
    \ IoT 设备如何融入你的应急响应、业务连续性和灾难恢复规划。\n\n*   **保护 IoT 设备安全**。现在你已了解设备的性质、位置和配置，需要保护它们。这听起来比实际容易得多。其中一些设备完全没有任何安全能力，因为制造商受低利润率驱动，根本不在乎安全、补丁和软件配置。这让你背了黑锅。如果设备上的软件无法加固，你就需要认真考虑要么彻底淘汰该设备，要么对其进行物理隔离（不接入网络）。\n\
    \n*   **反复冲洗、起泡、重复**。诚然，做一次这项工作能为公司建立基准 IoT 安全态势。但这还不够。你必须时刻紧盯此事。新设备不断被引入。有些甚至由毫无戒心的用户带入组织。试想，某个新奇的可穿戴设备（但不安全！）走进大门，立即通过用户的手机凭证连接到你的\
    \ Wi-Fi。这就像“带孩子上班日”，只不过换成了电子产品！因此，你必须持续扫描网络，查找任何未经授权的连接尝试。你的默认策略应是拒绝所有，除非在媒体访问控制（或\
    \ `mac`）地址级别获得授权。此外，作为网络安全意识计划的一部分，你需要确保人们理解 IoT 的影响，以及它如何可能成为公司的 `Kerkoporta`（凯尔科波塔/小偏门），除非你非常认真地听过拜占庭历史讲座，否则可能不知道它是什么！\n\
    \n    `Kerkoporta`（*希腊语：Κερκóπορτα*）是君士坦丁堡坚固城墙上一个无人看管的小偏门，据称被遗留敞开且无人检查，从而允许奥斯曼军队入城洗劫。从此，不再有君士坦丁堡！我们有了伊斯坦布尔。教训是：守住你所有的大门，保持上锁！\n\
    \n目前，行业团体——如工业互联网联盟（IIC），其推出了工业互联网安全框架（你猜对了：IISF）——以及国内外监管机构正在大力开展工作，均表达了对 IoT\
    \ 安全和隐私的担忧。例如，美国参议院提出（并后来重新提出）了 S.2607《发展创新和壮大物联网法案》，即《DIGIT 法案》。我们编不出这些事，但事实摆在眼前！\n"
