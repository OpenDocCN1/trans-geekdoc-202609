    # 核心观点


    Bottom line: You need to perform annual data privacy impact assessments. Make
    it part of your annual cybersecurity program review, and make sure that you carefully
    document the privacy impact of the data that you store about everything: employees,
    clients, vendors, partners, competitors, friends, and enemies! Think in terms
    of a continuous auditing of both your data and your practices. That is the world
    you should be prepared to live and do business in.


    ## 未来几年的监管趋势


    What else should you expect in the regulatory front in the next few years?


    For one, expect to see many states following the recent example of New York, which
    mandated by state law that all financial and insurance firms must retain a CISO
    and show evidence of a robust cybersecurity program. You should further expect
    that these types of laws will extend past financial services firms to law firms,
    health care, and education.


    There are many drivers for such legislation. Financial concerns are a big one,
    as is the notion of wanting constituents to be protected. (No one wants to answer
    the question: “What do you mean little Bobby''s medical history is being sold
    on the dark web?”)


    Consider, for example, the continuously increasing risk that insurance companies
    are underwriting with their cybersecurity policies. Granted, that''s their business
    and they know it well, so most of these policies are extraordinarily restrictive
    and prescriptive as to what''s covered and how. Still, their exposure continues
    to grow. How long before a major breach produces a claim against an insurer that
    proves to be too much? Then what? Can an insurer exclude acts of cyberwar or cyberterrorism
    from their policies, and using which definitions?


    All these issues, and many not covered here (e.g., national security interests,
    crime and fraud prevention, identity theft, etc.), will prove to be strong drivers
    toward increasing regulatory intrusion. In some countries, regulation will come
    more slowly than others, but you need to plan for these regulations now. Know
    where your business interests are, what your exposure is, and the type of data
    you''re handling. You may need to turn on a dime and either produce a plan or
    mitigate your risk with business controls. The one thing you cannot do is ignore
    what''s coming.


    # 人工智能与机器学习


    > *Open the pod bay doors, Hal.*

    >

    > —*2001: A Space Odyssey*


    I suspect we all know what happens next, and although we haven''t realized Stanley
    Kubrick''s vision just yet, we seem to be rushing head‐on toward it. For that
    matter, the list of scientists, technologists, futurists, and visionaries warning
    us on the dangers of rogue artificial intelligence (AI) grows daily.


    Specifically, as of this writing, there are more than 8,000 signatories to an
    open letter posted at the Future of Life Institute, titled “Research Priorities
    for Robust and Beneficial Artificial Intelligence.” The list reads like the “Who''s
    Who” in science, technology, and arts, including luminaries like Stephen Hawking,
    Elon Musk, Michael Vassar, and Nick Bostrom.


    So, why all the warnings and paranoia surrounding AI? And, what''s the difference
    between AI and machine learning? Back to our definitions:


    ## 机器学习


    Let''s start with machine learning. Machine learning refers to a type of computer
    program that can, essentially, write and modify itself based on the data that
    it is working on. These types of programs are great in dealing with very complicated
    and large data sets. Examples include pattern recognition, machine vision, and
    cybersecurity applications. Why cybersecurity? Because a learning system can use
    its algorithms to detect network intrusions before any other control flags them.
    For example, it may use its capacity in pattern recognition and statistical analysis
    to first learn what is “normal network traffic” and make judgments on what may
    be abnormal traffic as a result of a breach.


    Machine learning systems are used extensively in the fields of data mining and
    data analytics. In those contexts, these systems can produce very sophisticated
    results that would be impossible using traditional computational methods. Consequently,
    these types of systems can single‐handedly create value that was previously out
    of reach. Think in terms of analyzing behavior patterns of billions of Facebook
    users. What can that tell an advertiser? It turns out, quite a bit!


    Why is this important to cybersecurity? Mainly for two reasons: First, there is
    a lot of hope that machine‐learning systems will prove to be the “silver bullet”
    of intrusion detection. Already, there are versions of such systems in various
    stages of deployment, and results are encouraging. Second, the system itself,
    if in use by your firm, becomes a mission‐critical value generator, requiring
    a disproportionate level of cybersecurity attention. By their nature, these systems
    process terabytes upon terabytes of data, some of it in real time. Therefore,
    designing a defense‐in‐depth strategy around one of them can be a challenge.


    Even if your firm is not using a machine‐learning system yet, you need to be aware
    of them and stay informed. It is only a matter of time before these types of systems
    become widely used both as controls and as assets.


    ## 人工智能


    As you can imagine, machine learning systems and artificial intelligence systems
    are closely related. An AI researcher and a machine‐learning researcher have a
    lot to talk about! Still, the differences are both subtle and profound, and well
    worth exploring.


    First, I hope we can all agree that the term *artificial* is easy to understand.
    It is something that we humans make or create. Sometimes we make it so that it
    resembles the *real thing,* other times not.


    Intelligence, though, is another matter. What, exactly, is intelligence? That
    is a very controversial question. To date, there is no definitive consensus on
    a definition. In 1994, Professor Linda Gottfredson of the University of Delaware
    drafted the now‐famous “Mainstream Science on Intelligence” statement. She sent
    this to no fewer than the top 131 researchers in the field and got 52 of them
    to sign it. The statement was published by the *Wall Street Journal* in December
    1994, and it included the following definition:


    > *Intelligence is a very general mental capability that, among other things,
    involves the ability to reason, plan, solve problems, think abstractly, comprehend
    complex ideas, learn quickly, and learn from experience.*


    There''s a lot more one could say about intelligence but this definition works
    well for our purposes. If we marry Dr. Gottfredson''s definition of *intelligence*
    with *artificial*, we get what AI researchers call strong AI. That is a computer
    that can basically exhibit the intelligence characteristics of a human. We are
    not there yet, but it may be coming—hence, all the warnings from scientists. If
    we are able to build a computer that exhibits strong AI, it will, in very short
    order, evolve into what Nick Bostrom refers to as “artificial superintelligence.”
    The concern, of course, is that an artificial superintelligent computer may develop
    the same relationship with us that we have with a cockroach.


    Where are we now? We are in what AI researchers call weak AI. This is specialized
    artificial intelligence. We have computers that can perform specific tasks very
    well, like beating the reigning Jeopardy champion at his own game, but the same
    systems would struggle with recommending the right evening outfit for a date.


    Now, this may seem to trivialize the power of weak AI, and that would be a mistake.
    These systems are trailblazing and they produce incredible advances in science,
    medicine, even the arts. IBM''s Watson is one of the prime examples of a very
    successful weak AI system that is having tremendous impact across industries and
    disciplines. And, keep in mind that, day by day, these weak AI systems are getting
    stronger and stronger.

    '
