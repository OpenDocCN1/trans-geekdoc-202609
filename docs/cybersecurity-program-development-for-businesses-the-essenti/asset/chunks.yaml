- raw: "\n\n![](images/Cover.jpg)\n\n# FOREWORD\n\n> *If you know the enemy and know\
    \ yourself, you need not fear the result of a hundred battles. If you know yourself\
    \ but not the enemy, for every victory gained, you will also suffer a defeat.\
    \ If you know neither the enemy nor yourself, you will succumb in every battle.*\n\
    \n> \n\n> — Sun Tzu, *The Art of War*\n\nWho better to write a foreword for a\
    \ cybersecurity book than a hacker? An “infamous hacktivist,” as John Leyden called\
    \ me five years back. After all, I'm the kind of person who, with help from this\
    \ book, you will be prepared to defend yourself against!\n\nI started out as a\
    \ kid in the ghetto where I went into gang life and drug dealing. At some point\
    \ I asked myself, “Do I follow in my father's footsteps, or do I find my own path\
    \ in life?” I realized that living the fast life and being in the streets was\
    \ only going to keep me there.\n\nI wanted more.\n\nI discovered the Internet\
    \ at age 12. We're talking about a time when Google wasn't what it is today, and\
    \ finding information online entailed going to forums, searching bulletin board\
    \ system (BBS) archives, and relying on the likes of CompuServ, America Online\
    \ (AOL), and Internet Relay Chat (IRC).\n\nAs I explored this world, I began to\
    \ hear about certain mysterious figures who, like ancient sages, had a wealth\
    \ of knowledge and experience that many Internet users lacked, but respected.\
    \ I became attracted to the hacker ethic and lifestyle. Reading “The Hackers'\
    \ Manifesto” cemented exactly what it was about being a hacker that I liked: that\
    \ hacking was my decision, my choice, and no one could say otherwise.\n\nI tried\
    \ to reach out to hackers and join them. I was disappointed to learn these hackers\
    \ belonged to invitation‐only and private communities. It was impossible to speak\
    \ to them. So, I made my own way. I chose a nom de guerre, “Sabu.” As soon as\
    \ I adopted this persona, I began to think differently, without boundaries.\n\n\
    To fully make the transition from Hector to Sabu required a lot of knowledge I\
    \ didn't have. In short, I needed education. To compromise a server, I had to\
    \ understand and be able to communicate with the underlying system, so I became\
    \ a systems administrator of various UNIXes and POSIX systems. To write a proof‐of‐concept\
    \ exploit for a vulnerability, I had to learn several programming languages, and\
    \ so on.\n\nAs I slowly grew out of my awkward teenage years, I became more interested\
    \ in the world from a geopolitical perspective, which attracted me to “hacktivism,”\
    \ where you combine hacker skills with activist causes. In the year 2000, I began\
    \ hacktivist operations against governments around the world. I went from a curious\
    \ hacker to a persistent threat to governments I did not agree with. That decision\
    \ ultimately led to my downfall as a hacker and a hacktivist.\n\nJust before my\
    \ arrest, I had decided to leave the hacking world. All my experience as a hacker,\
    \ security researcher, and systems administrator provided me a wealth of experience\
    \ that I could now apply to any business—and I did. I became senior systems administrator\
    \ for one of the biggest nonprofit technology‐oriented organizations in New York\
    \ City. Life was good, and every decision I made, including becoming a foster\
    \ parent, was positive.\n\nThat's when I made my mistake and got back in the game.\
    \ I unretired Sabu and reconnected with the hacktivist scene. It was 2010, the\
    \ height of Anonymous and online hacktivism. I involved myself in the Arab Spring,\
    \ shutting down government communications at the apex of the Tunisian revolution,\
    \ as well as targeting federal contractors and media platforms. This was a time\
    \ when cybersecurity was forever changed—from the tools and the scope of attacks\
    \ to how hackers were organized, were funded, and acted. I knew our world would\
    \ not be the same again.\n\nI am not proud of that time. But when I realized how\
    \ far I'd overstepped the line, it was too late.\n\nI was arrested, and “Sabu”\
    \ became infamous.\n\nI had to accept the consequences of my actions and change\
    \ my life for good. This meant leaving behind most of my friends, expanding my\
    \ perspective, and realizing what really meant the most to me in life: my family.\n\
    \nMy life offers you a glimpse into the hacker world. It's important for you to\
    \ understand that we come from all walks of life, from privileged suburbs to the\
    \ ghetto. We may be working in so‐called legitimate jobs one day and hacking the\
    \ next. Some do it for the thrill, whereas others still do it to support their\
    \ causes—as in my case.\n\nBut hackers also hack for revenge and out of greed.\
    \ The varied nature of hacker threats and motives means that cybersecurity is\
    \ not easy. It requires dedication to preparedness, education, and constant vigilance.\n\
    \nThose three things, preparedness, education, and vigilance, are what Chris Moschovitis's\
    \ book is all about. I first met Chris at ISACA CSX, and we quickly discovered\
    \ that our thinking on cyberthreats and possible solutions was in alignment. Most\
    \ important, I share with him the critical importance of being prepared, staying\
    \ informed, thinking ahead, and remaining vigilant. Chris and I agree: This is\
    \ the only path to cyber‐resilience.\n\nLike the choices I made in my life, the\
    \ choices you make in your organization have the potential to change its path.\
    \ The things you will learn in these pages will help you get ahead of the curve,\
    \ become cyber‐resilient, and be prepared for the next time you “meet” a hacker,\
    \ who, unlike me, is not in retirement.\n\nHector “Sabu” Monsegur  \n\nDirector\
    \ of Assessment Services  \n\nRhino Security Labs\n\n# PREFACE\n\n“Enough already!”\n\
    \nThis was the (only *half*‐joking) reaction of a well‐respected editor of a major\
    \ publishing house when I suggested he produce yet another cybersecurity book.\
    \ “Enough! You cybersecurity people have demoralized everyone so much that no\
    \ one wants to hear, read, or talk about this any more. We're not publishing any\
    \ more cybersecurity books! Done! Finished!”\n\nI couldn't argue with him. He's\
    \ right. Cybersecurity experts have done a wonderful job of terrorizing everyone\
    \ about the threats while doing nothing by way of offering some hope, some light\
    \ at the end of the tunnel. Every security discussion seems to boil down to the\
    \ same, dire predictions of cyber‐doom:\n\n*   *“It's not if, it's when!”*\n\n\
    *   *“There are only two kinds of companies:*\n\n*   *Those that have been hacked\
    \ and those that don't know it!”*\n\nGot it! We're all done for, thank you very\
    \ much. Now what?\n\n## Something Completely Different\n\nWhat if there was a\
    \ book that put the whole cybersecurity thing into perspective, using simple,\
    \ direct language? What if there were sections and chapters explaining what is\
    \ going on, what the risks are, and what all the technobabble really means? And\
    \ what if the book had a step‐by‐step, actionable approach on what you can do\
    \ about all this? A book that aggregated the current best practices, put them\
    \ in perspective, injected my experience and my own point of view, and how I applied\
    \ all this across all our clients? All the while poking a little fun at ourselves,\
    \ too?\n\nI thought that this would be a great idea! And since I couldn't find\
    \ any, I decided to write one.\n\nThroughout my career, I've felt an attraction\
    \ to science, technology, management, and governance, as well as a deep empathy\
    \ for my clients' businesses. No matter what their industry, I understood their\
    \ struggles, their anxieties, and what it means to make payroll no matter if it\
    \ is for 10 employees or 5,000. I understood that I was their Rosetta stone—someone\
    \ who could translate tech‐speak to business‐speak—and I felt the weight of that\
    \ responsibility. My clients count on me and my recommendations. They are placing\
    \ their trust and their businesses in my hands. My recommendations and my opinions\
    \ matter in ways far more impactful than just tech. They affect people, their\
    \ jobs, and their privacy.\n\nThis is exactly why I wrote this book."
