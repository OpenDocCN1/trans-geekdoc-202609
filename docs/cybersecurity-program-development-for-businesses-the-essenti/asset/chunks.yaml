    \ end there have been many ongoing attempts to somehow frame the concept of privacy\
    \ as a human right. This, of course, is far from trivial, with cultural, ethical,\
    \ legal, and commercial interests fiercely competing for recognition of their\
    \ definition of this elusive privacy.\n\nWhy do you care about all this, and how\
    \ does this affect your cybersecurity program? You care because legislators of\
    \ countries where you do business are not waiting on consensus definitions of\
    \ terms. They write laws, and you're expected to comply, which brings us right\
    \ back to the GDPR.\n\n“But,” you'll exclaim, “I don't do business with the EU.”\
    \ Be that as it may, even if you don't do business with them now, you may do business\
    \ with an EU partner, vendor, or client tomorrow. If and when that happens, you\
    \ will need to comply.\n\nAnd even if you argue that this will never, ever, ever\
    \ happen, I regret to inform you that this still doesn't let you off the hook.\
    \ Many states plan to adopt a GDPR‐like regulation to protect and serve their\
    \ citizens. And, that's before the federal government makes its say in the matter.\n"
  trans: "\n\n*   **监管发展**。这些通常是影响网络安全实施的立法行动，范围可以从强制性到强烈建议。你当然需要知道它们——最好是在它们颁布很久之前——并做相应的计划。此外，你需要知道你在世界上任何开展业务的地方的这些法规。（例如，请参阅第\
    \ 10 章中的欧盟《通用数据保护条例》。）你应该预期各级政府都会有监管行动：城市、州和国家。无论你的董事会，还是公司中承担风险的任何人，选择是否合规是另一回事。是的，不合规是一种选择。请记住：如果一项控制措施的成本高于它旨在保护的资产价值，那么实施它就讲不通。因此，如果实施一项法规将花费公司大量金钱和时间，以至于与罚款相比不值得，那么支付罚款可能更合理。说清楚了：我并不主张你采取这种立场；但如果不提醒你注意这一点，我将失职！\n\
    \n    你如何获知所有这些可能令人振奋的发展？通常，你所在行业的专业出版物会跟踪并报道可能影响你的立法动态。话虽如此，没有任何东西能替代你随时了解政府代表正在做什么。参与进来并保持参与。从一份有声望的主流日报开始，逐步发展到拿起电话致电你的代表，提出你可能有的任何问题。毕竟，我们谈论的是你的业务。\n\
    \n*   **信息技术和计算机科学发展**。这些发展众多、持续且影响深远。我们这里谈的不是业务中断。我们谈论的是将永远改变我们工作、思考、沟通、学习、影响他人和行为方式的改变生活的发现和发展。除了摩尔定律从本质上预测了计算能力每隔几年翻一番之外，还在人工智能、机器学习、模式分析（想想大数据）、区块链技术，以及将计算和通信能力集成到从烤箱到心脏起搏器的所有事物中取得了突破。你为什么需要知道这些？因为正如我们所讨论的，这些事物将极大地影响你的工作场所，既然你是对网络安全含义敏感的人，你也就成了那个需要走在这些发展前面、至少思考它们对你的计划（如果不是你的生活）潜在影响的人。你如何随时了解这些变化？至少，我建议订阅\
    \ MIT 的《技术评论》、哈佛商业评论，以及至少一份行业专业出版物。还有其他可靠的此类信息来源出版物吗？绝对有，而且请务必全部订阅！重要的是你要持续保持信息灵通。\n\
    \n我将通过审视我认为未来几年你需要了解的*关键*新兴技术和趋势来结束本章。我相信，每一项都将对我们如何理解网络安全需求、如何实施网络安全，以及我们如何安全地与这个日益网络化的世界互动产生重大影响。\n\
    \n## 通用数据保护条例（GDPR）、隐私和监管机构\n\n我们在第 10 章中详细讨论了 GDPR。值得你再次回顾。事实上，最好找个好搭档一起回顾，比如你的法务部门。\n\
    \n我们需要敏感地意识到 GDPR 实际上是：一项重大的、国际性的、影响深远的网络安全法规。我预测这只是漫长博弈的开始：各种政府法规与不断推进、冲击真实和感知隐私权利之墙的信息技术之间的博弈。\n\
    \n我们需要提出许多问题：欧盟为什么要制定如此严格的数据保护法？隐私需要被监管吗？更好的问题是，在信息时代什么是隐私？最后一个问题本身就能写一整本书，我也计划写一本，所以现在让我们只坚持一些基础：\n\
    \n“为什么，哦，为什么欧盟要做这种事？”这个问题很简单。根据他们自己的声明：\n\n> *欧盟《通用数据保护条例》（GDPR）……旨在协调整个欧洲的数据隐私法律，保护并赋能所有欧盟公民的数据隐私，并重塑该地区组织处理数据隐私的方式。*\n\
    \n从美国的观点来看，是因为他们想惩罚、遏制和控制美国科技巨头的垄断行为，以及他们对隐私、营销和广告的漠然态度。欧盟有许多人过去和现在都认为，仅凭其做法和庞大规模，美国科技公司就挤垮了欧洲竞争对手。这种思维最近的一个例子是欧盟因搜索反垄断案对谷歌处以\
    \ 24.2 亿欧元（约 27 亿美元）的罚款。\n\n撇开这些不谈，回到隐私问题，我们面临着没有明确、全球公认的“隐私”一词定义。事实上，在几种语言中，*隐私*甚至不作为一个独立概念存在：例如在希腊语中，它勉强且不准确地被翻译为*秘密*。\n\
    \n然后，还有隐私权的问题。你怎么能讨论一项你几乎无法定义的事物的权利，这令人费解，但这并没有阻止许多立法者尝试。因此，各国根据本地定义的隐私权已被写入从宪法到法案的各种文件中。例如在美国，宪法中没有隐私权的保障。权利法案的几个部分中*暗示*了这一点，但这种隐私实际延伸多远仍有争议。另一方面，意大利人对此非常重视，其宪法中明确规定了隐私权。\n\
    \n不知何故，在所有定义、法典化和法律中，我们必须开展业务、交换信息、执法，并以起码的尊重对待彼此的隐私概念。为此，一直有许多持续的尝试，试图以某种方式将隐私概念界定为一项人权。当然，这远非微不足道，文化、伦理、法律和商业利益正激烈竞争，以争取对这一难以捉摸的隐私的定义获得认可。\n\
    \n你为什么关心所有这些，这如何影响你的网�安全计划？你关心是因为你在其开展业务的国家的立法者不会等待术语的共识定义。他们制定法律，并期望你遵守，这又把我们带回到了\
    \ GDPR。\n\n“但是，”你会惊呼，“我不与欧盟做生意。” 无论怎样，即使你现在不与他们做生意，明天你可能就会与欧盟的合作伙伴、供应商或客户做生意。如果那一天到来，你将需要合规。\n\
    \n即使你辩称这永远、永远、永远不会发生，我遗憾地通知你，这仍然不能让你脱离责任。许多州计划采用类似 GDPR 的法规来保护和服务其公民。而且，这还不包括联邦政府对此事的表态。\n\
    \n"
