- raw: 'There are three main kinds of backup: *full backup,* which as the name implies
    is a complete and total copy of all of your data; a *differential backup* copies
    only the data that has changed since your last full backup; and finally *incremental
    backup,* which involves only the data that has changed since the last backup of
    any kind. Which backup you use and when depends on the size of your organization,
    the amount and type of data, and the values that you established for your recovery
    time objective (RTO), and recovery point objective (RPO). Speaking generally,
    small organizations do a daily full backup while larger organizations tend to
    employ periodic (e.g., weekly) full backups as well as a combination of differential
    or incremental backups.


    A full backup has the benefit of the most rapid restore time, since all the data
    is in one place and you don''t have to go hunting among differential or incremental
    backups for that one file that''s missing. On the other hand, if you''re backing
    up several terabytes worth of data, then, irrespective of method, you''re using
    multiple and complex strategies to ensure timely restores.


    There are additional considerations when it comes to your backup and restore strategy,
    most of which need to be covered by your business continuity and disaster recovery
    plan. There are different methodologies—such as mirroring, disk‐to‐disk‐to‐cloud,
    continuous backup, and hot failover—that may make sense given your specific requirements.


    The one thing you need to be concerned about, no matter your size or strategy:
    Make sure that your backups are absolutely solid and 100 percent verifiable. Check
    often! Trust me on this! You''ll thank me later.


    ## Compensatory Controls


    These are the types of controls you put in place when you know that all your other
    controls cannot mitigate one or more risks all the way down to a desired level—be
    that a level required by regulators or simply your own peace of mind.


    In a perfect world, every company would address every vulnerability in a perfect
    way with perfect timing. But that''s not our world. You may find, for example,
    that you cannot apply a necessary security patch or upgrade because doing so will
    cause havoc with your systems downstream. Or you may have a recovery time objective
    that''s so short that no backup strategy can meet it. Maybe you are dealing with
    such highly classified data that your system must be completely “air‐gapped” (i.e.,
    no Internet access ever).


    Typical examples of compensating controls include hot failover sites (mirror sites
    where duplicate systems and facilities exist and can go live instantly), access
    controls (e.g., access depending on your clearance and the data''s classification,
    function, geography, etc.), and the extremely important one, especially for insider
    threats: segregation of duties. Segregation of duties is a very powerful compensating
    control, and one that you can easily implement.


    Consider the following example: You have a mission‐critical database application.
    As a result, you have some version of an application/database (DBA) manager, who
    may be in house or a vendor. You also, of course, have a systems administrator.
    Again, that person may be in house or outsourced. A good segregation of duties
    control implementation would be for the systems administrator to not know the
    database password, and for the application''s manager to not have system administrative
    privileges. This keeps everyone honest. The administrator can always report on
    the DBA''s actions from the logs, and the DBA can never erase those logs because
    they don''t have the privilege, and vice versa.


    ## Defense in Depth


    The right way to use all of these controls is by deploying them across systems
    in a way that achieves defense in depth. This has the effect of putting multiple
    and diverse barriers (controls) between the attacker and the asset. This strategy
    looks different from case to case (e.g., cloud‐based versus office versus mobile),
    but has proven to be the best way to protect yourself and your assets.


    If you translate all the creative ways people used to protect their castles into
    the electronic realm, you''ve got your basic defense‐in‐depth concept down pat.
    (Of course, most things can trace their roots to antiquity, and, I assert with
    no evidence or significant bias, to the ancient Greeks!)


    Back in March 2010, the NSA published a paper called “Defense in Depth,” in which
    the authors pointed to three critical elements for success: people, technology,
    and operations. In my view, they nailed it! But not everyone agrees. There are
    many cybersecurity experts who question the approach. Some argue that defense
    in depth is dead and can no longer address the current asset realities and threat
    landscape. Their argument centers on two main—and very valid—points: first, the
    rapidly expanding network perimeter, and second, the rapid adaptation and availability
    of attackers, attack vectors, and payloads.


    What does this mean? Now that everyone has a mobile device, and using applications
    and storage that are increasingly consumed as cloud services, this new Information
    Age reality blows out the traditional notion of concentric castle‐type defense‐in‐depth
    ideas. In other words, we can''t build walls tall enough and encompassing enough
    to cover our users and their diverse technologies. Making things worse, attackers
    are faster, meaner, and their tools (and themselves) are available as a service
    with guarantees! To say nothing of the insider threats (willing or not) who are
    already inside the castle, so…defense‐in‐depth *that!*


    I disagree. The arguments about the perimeter breakdown are sound, but I don''t
    interpret defense in depth as simply meaning the creation of a multilayered perimeter.


    Quite the opposite: My view is that defense in depth applies at all levels and
    across all perimeters. It applies as much to the organizational perimeter—location
    by location, end point by end point—as it applies to its providers, partners,
    and clients, and as it applies to individual users, no matter where they may be.


    In other words, defense in depth is not just a top‐level “let''s build a castle
    with five walls and three crocodile‐filled moats” strategy. It is also a practice
    that needs to be applied at each asset point. Firms need to develop defense‐in‐depth
    strategies for physical (and virtual) offices, both local and remote, plus they
    should expect a defense‐in‐depth approach from their cloud‐services providers
    (trust but verify, always), and, depending on scope, they need it from their trading
    partners as well. If you doubt the last one, talk to the folks at Target, who
    suffered a spectacularly bad hack in 2013 that was made possible by vulnerabilities
    at, of all things, a heating and ventilation company with a Target service contract.


    That is why I firmly believe that the NSA has it right. Defense in depth is not
    about any specific technology or topology. Defense in depth is truly about people,
    technology, and operations, no matter where, no matter how.


    ## People, Technology, and Operations


    Of this triad, the *people* component is in my view the most critical element
    of a successful cybersecurity program. Support from the board on down is essential.
    This support must be emphatic, clear, and actionable. There can be no doubt anywhere
    in the company that cybersecurity is a mission‐critical organizational practice:
    It needs to be supported with clear policies, standards, procedures, and guidelines.'
  fmt: '

    # 备份类型


    主要有三种备份方式：


    - **全量备份**：顾名思义，是对所有数据的完整、完整副本。

    - **差异备份**：仅复制自上次全量备份以来发生变化的数据。

    - **增量备份**：仅涉及自上次任何类型备份以来发生变化的数据。


    选择哪种备份方式及其时机，取决于组织规模、数据量和类型，以及您为恢复时间目标（RTO）和恢复点目标（RPO）设定的值。一般来说，小型组织每天进行一次全量备份，而大型组织倾向于采用定期（例如每周）全量备份，并结合差异备份或增量备份。


    全量备份的优势在于恢复时间最快，因为所有数据都在一个地方，无需在差异或增量备份中查找缺失的文件。但如果您要备份数 TB 级别的数据，无论采用何种方法，都需要使用多种复杂的策略来确保及时恢复。


    在制定备份和恢复策略时还有其他考量因素，其中大部分需要由您的业务连续性和灾难恢复计划来涵盖。根据您的具体需求，可能适用不同的方法，例如镜像、磁盘到磁盘到云、持续备份和热备。


    无论您的规模或策略如何，有一件事您必须关注：**确保您的备份绝对可靠且 100% 可验证。经常检查！相信我！您稍后会感谢我的。**


    # 补偿性控制


    当您知道所有其他控制措施都无法将一个或多个风险完全降低到期望水平时（无论该水平是监管机构要求的，还是仅为了您自己的安心），就需要实施补偿性控制。


    在完美的世界里，每家公司都能以完美的方式、在完美的时间解决每一个漏洞。但这不是我们的世界。例如，您可能发现无法应用必要的安全补丁或升级，因为这样做会破坏下游系统。或者您的恢复时间目标极短，以至于没有任何备份策略能满足。又或许您处理的是高度机密数据，系统必须完全“物理隔离”（即永无互联网接入）。


    典型的补偿性控制示例包括：


    - 热备站点（存在重复系统和设施的镜像站点，可即时上线）

    - 访问控制（例如基于您的权限和数据分类、功能、地理位置等的访问权限）

    - 以及极其重要的一项，特别是针对内部威胁：**职责分离**


    职责分离是一项非常强大的补偿性控制，且易于实施。


    请看以下示例：您有一个任务关键型数据库应用。因此，您会有某种版本的应用/数据库（DBA）管理员，可能是内部员工或供应商。您当然也有一位系统管理员。同样，此人可能是内部员工或外包人员。良好的职责分离控制实施应是：系统管理员不知晓数据库密码，而应用管理员不拥有系统管理权限。这能约束所有人。管理员始终可以从日志中报告
    DBA 的操作，而 DBA 无法擦除这些日志，因为他们没有权限，反之亦然。


    # 纵深防御


    正确使用所有这些控制措施的方法是跨系统部署它们，以实现纵深防御。这会在攻击者和资产之间设置多重、多样化的屏障（控制措施）。该策略因情况而异（例如基于云与办公室与移动端），但已被证明是保护您自己和资产的最佳方式。


    如果您将人们过去保护城堡的所有创造性方法转化为电子领域，您就基本掌握了纵深防御的核心概念。（当然，大多数事物都可追溯到古代，我断言——虽无证据或显著偏见——甚至可追溯到古希腊！）


    早在 2010 年 3 月，NSA 发布了一篇名为“纵深防御”的论文，作者指出了成功的三个关键要素：**人员、技术和运营**。依我之见，他们一针见血！但并非所有人都同意。许多网络安全专家质疑该方法。有人认为纵深防御已死，无法再应对当前的资产现实和威胁形势。他们的论点集中在两个主要且非常有效的点上：第一，网络边界的快速扩张；第二，攻击者、攻击载体和有效载荷的快速适应和可用性。


    这意味着什么？现在人人都有移动设备，且使用的应用程序和存储越来越多地作为云服务消费，这种新的信息时代现实打破了传统的同心城堡式纵深防御观念。换句话说，我们无法建造足够高、覆盖面足够广的墙来保护我们的用户及其多样化技术。更糟的是，攻击者更快、更凶狠，他们的工具（和他们自己）作为服务提供并带有保证！更别提内部威胁（自愿或非自愿）早已身在城堡内部，所以……纵深防御*对此束手无策*！


    我不同意。关于边界瓦解的论点是合理的，但我并不将纵深防御仅仅理解为创建多层边界。


    恰恰相反：我的观点是，纵深防御适用于所有层级和所有边界。它既适用于组织边界——按地点、按端点——也适用于其提供商、合作伙伴和客户，以及适用于个别用户，无论他们身在何处。


    换句话说，纵深防御不仅仅是一个顶层的“让我们建造一座有五堵墙和三条鳄鱼出没的护城河的城堡”策略。它也是一项需要在每个资产点应用的实践。企业需要为物理（和虚拟）办公室制定纵深防御策略，无论是本地还是远程；此外，他们应要求云服务提供商采取纵深防御方法（永远信任但验证）；视范围而定，他们也需要从交易合作伙伴那里获得此类防御。如果您对最后一点存疑，请询问
    Target 公司的人员，他们在 2013 年遭遇了一次极其严重的黑客攻击，而这竟然是由一家持有 Target 服务合同的供暖和通风公司的漏洞导致的。


    这就是我坚信 NSA 观点正确的原因。纵深防御不关乎任何特定技术或拓扑结构。纵深防御真正关乎**人员、技术和运营**，无论地点、无论方式。


    # 人员、技术和运营


    在这三位一体中，**人员**因素依我之见是成功网络安全计划中最关键的要素。从董事会到基层的支持至关重要。这种支持必须是强有力的、清晰的和可执行的。公司上下不应有任何疑虑：网络安全是一项任务关键型组织实践：它需要由清晰的政策、标准、程序和指南来支撑。

    '
