- raw: '*   *Vision*: Our vision is nothing less than realizing the full potential
    of the Internet—universal access to research and education, full participation
    in culture—to drive a new era of development, growth, and productivity.


    **Feeding America**


    *   *Mission*: To feed America''s hungry through a nation‐wide network of member
    food banks and engage our country in the fight to end hunger.


    *   *Vision*: A hunger‐free America.


    **Smithsonian**


    *   *Mission*: The increase and diffusion of knowledge.


    *   *Vision*: Shaping the future by preserving our heritage, discovering new knowledge,
    and sharing our resources with the world.


    Now, there are those who will argue that mission and vision statements are a waste
    of time. There is one goal, and one goal only: Make money. The end. After all,
    as one executive director of a national nonprofit told me, *“No money? No mission.”*
    I agree. There is truth to the “make money” imperative. But is it your—or your
    company''s—true mission? Does it reflect your company''s vision? (If so, write
    it down.)


    From our perspective, this is the starting point of establishing what''s of value
    to you. This will be vital later, when we establish the right level of protection
    for it.


    ## Culture and Strategy


    With your mission and vision statements in hand, the next thing you need to understand
    is your company''s culture. To clarify, we''re talking about organizational, or
    corporate, culture. This is not about any ethnic or societal culture (although
    it may well be influenced by them). This is business. And as such, it has been
    studied within an inch of its life. I''ll spare you the diatribe, and focus on
    David Needle''s definition from his 2004 *Business in Context: An Introduction
    to Business and Its Environment*. He writes:


    > *Organizational culture represents the collective values, beliefs, and principles
    of organizational members and is a product of such factors as history, product,
    market, technology, strategy, type of employees, management style, and national
    culture; culture includes the organization''s vision, values, norms, systems,
    symbols, language, assumptions, beliefs, and habits.*


    What he didn''t write—and actually no one did, despite misattribution to Drucker—is:
    “Culture will eat strategy for lunch any day of the week,” or some variant thereof.
    This statement appears in the literature in various guises (e.g., in Thomas W.
    Lloyd''s 2000 monograph in the form of “Culture beats strategy,” and so forth)
    but although the source of the idea is mysterious, the wisdom is real.


    The bottom line here is this: In a fight between culture and strategy, culture
    always wins. Always. That''s why you need to spend some time understanding your
    corporate culture. Without that understanding, your cybersecurity and risk strategies
    will fail.


    Are you in an entrepreneurial “damn the torpedoes” culture or more of a risk‐averse
    environment? Are you in a highly regulated industry? Are you in the armed forces?
    Whatever the case, you''ll need to identify the culture and understand it. There
    are some things that your culture will allow that others will not. For example,
    if you try to institute strict authentication and access controls in an entrepreneurial,
    no‐risk‐is‐too‐big environment, you are guaranteed to fail. The staff will not
    follow suit; they will bypass the controls, and you''ll have to deal with a staff
    revolution (and we know how those end: Chop! Chop!) On the other hand, if you
    are too lax in an environment that is expecting safety through rigorous controls,
    you''ll be dismissed as irresponsible and too dangerous to work with.


    How do you determine culture? Let''s say you just walked through the door day
    one in your job at a new company and you''re somehow charged with reviewing cybersecurity
    risk and making a recommendation. You don''t know anyone yet and it will take
    some time for you to assimilate into your new company''s culture. What can you
    do to determine the culture of your new home? Why, you ask, of course! It will
    take more than asking a couple of people by the water cooler, though. It will
    take a survey.


    As luck would have it, Kim Cameron and Robert Quinn wrote *Diagnosing and Changing
    Organizational Culture* in 2005 (second edition in 2011) and in it you will find
    their “Organizational Culture Assessment Instrument”—a short but very useful survey
    that, when followed, will provide you with a cultural profile for your company.
    Their survey assesses a company across six dimensions:


    1.  Organizational dominant characteristics


    2.  Organizational leadership


    3.  Employee management


    4.  Organizational glue


    5.  Strategic emphases


    6.  Criteria of success


    Each one of these has four rankings in the spectrum of personal versus controlling,
    nurturing versus results‐minded, teamwork versus conformity, trusting versus policing,
    humanistic versus efficiency‐first, and people‐centric versus company‐success.


    ## Off to See the Wizard


    Save your cultural survey results—you will be needing them later. Now you are
    ready to talk with the people in the IT department. Why the jump to technology
    first? To be sure, there are many departments, profit centers, etc. that you could
    focus on first, so why IT? Because cybersecurity and IT are inseparable. IT doesn''t
    own cybersecurity (the organization does), but consider this: No information technology?
    No cybersecurity. It''s simple. The word *cyber* by definition is about information
    technology. One cannot exist without the other. IT and cybersecurity are twins.
    Sometimes opposing twins, to be sure, but twins nonetheless.


    What happens if there is no IT department in your company? Then you should talk
    with the vendor who''s responsible for supporting IT. What happens if there is
    no such vendor? Well, figure out if there is anyone charged with IT in the company
    and ask her. What happens if she doesn''t exist?


    Let''s cut to the chase: Companies come in all sorts of shapes and sizes. Some
    are totally virtual, whereas others are multinational behemoths. Even those we
    call virtual have tremendous variation in their use, adoption, and support of
    technology. You may be in a company in which all technology is provided as a service
    (remember infrastructure as a service, software as a service, etc.? If not, maybe
    zip back to the “cloud” definition in the Cybersecurity Primer). Alternatively,
    the company may be operating under a bring‐your‐own‐device (BYOD) IT model, so
    you—the individual user—may be responsible for maintaining your own devices. On
    the opposite side of this spectrum are the IT stormtroopers: a humorless bunch
    walking about stomping on any electronic device they don''t recognize.


    The majority of companies are somewhere in between these extremes. They have one
    or more people in their IT department—sometimes they are employees, other times
    they are vendor‐provided—and they maintain a set of technologies that are hybrid
    (on‐premises, cloud, and a mix of company‐provided and BYOD), and have some degree
    of control over what kind of software is running where and doing what. We''ll
    talk about them, and we''ll call them: *the IT department*. What happens with
    the fringe cases? You''ll still need the information; it''s just that the way
    you go about it will differ. In the virtual company case, you''ll determine who
    the vendors are and what services they provide, and so on. Think of them as your
    virtual IT department. In the stormtroopers case, bring your papers and make an
    appointment. Besides, if the stormtroopers are in the building, I''d hazard a
    guess that the company has a formal risk and audit function, and they''ll need
    to be included in all this as well.'
