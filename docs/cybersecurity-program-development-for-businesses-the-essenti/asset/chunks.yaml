    \ or a *countermeasure,* which addresses a specific threat or a specific vulnerability.\
    \ But for simplicity's sake, I'm going to include targeted controls as part of\
    \ the four categories, depending on how they function.\n\nKeep in mind that the\
    \ examples that follow are just that, examples—not an exhaustive list by any means.\
    \ New controls are developed almost daily as part of the constant arms race between\
    \ hackers, cybersecurity vendors, developers, IT companies, end users, and governments."
