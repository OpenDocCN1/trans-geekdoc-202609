    # 事件识别


    明确一点：识别事件绝非易事。许多事件数周甚至数月都未被发现！这不关乎解读警报、读取日志或处理用户反馈。日常业务中的数百个事件都可能被误判为安全事件。应用程序可能修改配置文件，你收到警报：是事件，还是正常功能？文件服务器变慢：是事件，还是仅仅流量负载大？互联网访问不稳定：是事件，还是
    ISP 故障？收到文件修改警报：是恶意软件，还是正常使用？你收到一封带有威胁警报的邮件。这仅仅是垃圾邮件，还是未来事件的征兆？遗憾的是，所有这些都需要透过你的网络安全眼镜来审视，即使它们最终只不过是常规
    Bug。


    ## SIEM 登场


    安全信息与事件管理（SIEM）系统会摄取所有这些信息（日志、威胁情报等），进行关联分析，并针对环境中的异常事件发出警报。有什么不爱的？没有。除非并非所有 SIEM
    都一样，而且像所有关系一样，你需要投入精力才能从中获益。


    首先，你应该尽职调查，为你的环境选择合适的 SIEM。它们有各种规模和类型，包括 SIEM-as-a-service 选项。其次，取决于你部署的系统，你可能需要对其进行微调。让
    SIEM 过于敏感，每个发出的警报都会变成待调查的工单。但将其调得麻木不仁，你就不会收到通知，直到你的数据中心被夷为平地。


    一旦调优完成，优秀的 SIEM 将成为你最好的朋友和网络安全合作伙伴。你们将携手处理警报、创建工单、记录趋势、关联威胁情报，并升级至遏制和处理阶段。所有这些精心编排的工作还将汇入你的网络文档工具，供你的报告工作流用于通知当局、事件信息共享组织、Wiki
    以及深夜欢唱俱乐部。


    当然，要达到这种事件检测的极乐境界，不仅需要正确且配置得当的 SIEM 选择以及正确的系统管理实践（如文档化、标准化、同步化等），还需要正确的纵深防御策略作为开端——你会回想起，正是它导致了正确控制措施的部署，并首次在整个环境中受到监控。


    你是如何获得正确的纵深防御策略的？因为你在资产、威胁、漏洞和环境阶段完成了所有艰苦的工作。


    谁比你强？没人！


    # 遏制事件


    **警报！警报！这不是演习！**


    你收到一个被识别为合法、经压力测试、检查并升级至遏制阶段的警报。确实出事了！现在怎么办？


    **第一步：遵循活页夹封面上的建议！*不要恐慌！* 你能搞定。**


    **第二步：识别。** 你在面对什么？你的侦测控制在告诉你什么？


    **第三步：分析。** 这是需要独特技能和专用工具的苦活。


    **第四步：行动。** 一旦你知道了*谁、如何*以及*什么*，你就需要准备好采取行动：你想为可能的未来行动（如起诉）保留证据吗？你想尽快恢复运营，而不太在意证据保全吗？你想在开发变通方案时容忍感染吗？这些都是你应该提前与事件响应团队和高层管理人员一起思考并演练过的决策。


    让我们更仔细地看看第四步——行动。为了妥善遏制事件，你需要知道三件事：*谁、如何*和*什么*。


    1.  **谁：** 谁在背后发动攻击？这是意外吗？是内部人员吗？是恐怖主义行为吗？威胁情报对幕后黑手有何说明？动机是什么？了解*谁*将帮助你制定遏制和处理方法。

    2.  **如何：** 攻击向量是什么？恶意软件，如果是，哪种？这是病毒造成的吗？木马？蠕虫？有人插入受感染的 USB 了吗？有人点击邮件中的链接了吗？这是“流弹击中”，比如某人只是浏览网页时电脑就被植入恶意软件？还是因凭证被盗导致的入侵？可能是其中一项或多项，也可能全不是。攻击者可能用了某种完全不同、更罕见的方式攻陷你的系统。你的团队需要识别*如何*，以便遏制并潜在地找到保留取证数据的方法。

    3.  **什么被击中了？** 单个端点？多个？服务器？应用？网络？你的取证人员需要对受影响系统进行详细的端点分析以收集证据。这包括攻击者留下的任何痕迹，包括易失性内存（不仅仅是永久存储，如硬盘、SSD
    等）的逐位复制。他们需要建立事件时间线：攻击何时开始、如何传播、留下了什么、有何影响？此过程部分涉及高度技术性工作，可能包括在系统上隔离恶意软件以供观察，或对恶意软件进行逆向工程以理解代码在做什么。一旦一切搞清，公司所有系统都需要进行取证验证，确认未被感染。


    必须重申：在事件遏制阶段，知道*不该做什么*与知道*该做什么*同等重要。如果公司缺乏内部专业知识，惊慌的高管或被警报淹没的 IT 人员可能会拔掉受感染电脑的电源，尝试使用从网上下载的恶意软件清除工具，或——更糟——以管理员身份登录调查，或打电话给
    FBI 的朋友。


    这就是为什么在事件发生前制定计划、并反复演练、再演练如此关键！知道做什么、怎么做，就成功了一半。


    # 处理事件


    谈到处理，我有个坏消息和个更坏的消息。先说坏消息。


    有时，你可能不得不与病毒共存。你可能因关键业务考量而不得不与其共存，这些考量禁止你隔离或重建一个或多个系统。或者，你可能需要保持受感染系统运行，让攻击者不知你已察觉，同时屏蔽更有价值的资产，或派特种部队踹开他们的门。同样，可能存在上游或下游依赖，要求你发挥创造力。例如，因业务要求不间断使用，你可能需要将受感染系统恢复到全新硬件上，然后重新投入生产，同时移除受感染系统。这大约像在飞行中更换飞机引擎一样困难。虽可行，但极其惊险。

    '
