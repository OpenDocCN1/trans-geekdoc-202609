- raw: "How do you do this? You start by deploying the best preventative control ever\
    \ devised: education! Endless studies prove that cybersecurity awareness training\
    \ is the most effective preventive control deployed in any organization. Certain\
    \ industries that follow a rigorous, engaging, and interactive cybersecurity awareness\
    \ training program have reported attack reductions in excess of 40 percent. If\
    \ that's not deterrence, I don't know what is!\n\nThus, we should add *deter*\
    \ in front of *identify, protect, detect, respond,* and *recover*. Deterrence\
    \ is a critical function of any cybersecurity program, and an integral part of\
    \ our responsibility to any organization we're charged to protect. It also serves\
    \ as a constant reminder that cybersecurity is people‐centric, not technology‐centric.\
    \ It is people who make a cybersecurity program a success, and it is the same\
    \ people who, left in the dark, can be the weakest security link.\n\nDeterrence\
    \ is not a question of education alone. It is also built on reducing what's called\
    \ your *attack surface*. As part of the *deter* function you need to take a close\
    \ look at your business. What do you do, who are your partners, what are the threats,\
    \ and how have they changed over time? There may be things that you can do to\
    \ further deter cybercriminals from targeting your organization by changing certain\
    \ things about the business itself. A slight change in workflow may make it not\
    \ worth the trouble for someone trying to breach your data.\n\nFor example, a\
    \ client of mine who is an immigration attorney used to accept scans of sensitive\
    \ documents by email and, worse, upload the documents to his website unencrypted.\
    \ A simple change—moving this workflow to a secure, encrypted provider—reduced\
    \ his attack threat significantly. Now, instead of having to hack some simple\
    \ hosted marketing website, the potential attacker would have to breach a Fort\
    \ Knox–like level of security made affordable through cloud services. The same\
    \ type of simple solution may work for your company. Just shifting from an unsecured\
    \ handshake with a partner to a secure one is not only prudent, but may prove\
    \ to be a significant deterrent to an attacker.\n\nEstablishing a cybersecurity\
    \ culture across the company has multiple deterrence benefits. Not only does the\
    \ ongoing awareness make for better and safer employees, but the same employees\
    \ can contribute their thoughts and ideas on how to reduce your attack surface\
    \ and, most importantly, they are sensitized to both external and internal threats.\
    \ Now, they know that if an employee is snooping around the network and copying\
    \ files onto USB drives, they may constitute a real cybersecurity threat to the\
    \ business and they can raise the alarm accordingly. This, in itself, is a deterrent\
    \ to a potential insider threat from manifesting itself. In short, a cyber‐aware\
    \ employee can be your best cybersecurity control yet!\n\nSpeaking of which, it\
    \ is time that we take a deeper dive into what these controls are all about.\n\
    \n## Cybersecurity Controls and Defense in Depth\n\nNow that we have our six functions—deter,\
    \ identify, protect, detect, respond, and recover—the next obvious question is,\
    \ *where do we go from here?*\n\nFirst you develop a strategy that's right for\
    \ you. What does this look like? It depends on your business. As you would expect,\
    \ cybersecurity strategy will vary greatly from business to business, just as\
    \ marketing strategies or daily operations vary from firm to firm. No two companies\
    \ are exactly alike, even within the same industry. What is right for one law\
    \ firm may be too much for another. One may be dealing with intellectual property\
    \ (IP), trademarks, and patent law, versus another that may focus on criminal\
    \ law, and a third on tax and estate law. All want to be secure, of course, but\
    \ the priorities and data life cycles can be very different.\n\nYou'll recall\
    \ that controls are actions that mitigate risk. They, generally speaking, will\
    \ prevent, detect, correct, or compensate against risk. More specifically:\n\n\
    *   *Preventive controls* are designed to prevent the attack from reaching the\
    \ asset in the first place. A nondigital preventive control might be a pair of\
    \ big burly guys, armed to the teeth, who physically guard your assets. Digital\
    \ preventive controls include, as we already discussed, cybersecurity awareness\
    \ training as well as more technical controls like firewalls, intrusion prevention\
    \ systems (IPS; designed to both detect and thwart an attack).\n\n*   *Detective\
    \ controls* are designed to identify that an attack is occurring, including what\
    \ kind of an attack, where it came from, what it used, and, if you're lucky, who\
    \ may be behind it. For example, motion detectors that set off sirens waking up\
    \ the aforementioned big burly guys and send them to go chase the intruder are\
    \ detective controls. These days, these motion detectors can take the form of\
    \ sophisticated cameras, detecting motion, plus capturing images and sounds. Digital\
    \ detective controls include antivirus and antimalware systems, as well as intrusion\
    \ detection systems (IDS; designed to detect abnormal patterns in networks or\
    \ systems and raise the alarm).\n\n*   *Corrective controls* are designed to minimize\
    \ the damage from an attack. Examples include restoring from backup, patching\
    \ the systems with the latest security fixes, upgrading to the latest version\
    \ of applications and operating systems, and the like.\n\n*   *Compensating controls*\
    \ are designed to compensate for the failure or absence of other controls and\
    \ mitigate the damage from an attack. Examples include having a hot failover site\
    \ (a geographically separate site that mirrors your environment, available the\
    \ instant you need it), isolating critical systems from the Internet (aka air‐gapping),\
    \ and, in general, backup and disaster recovery plans that can keep the lights\
    \ on while everyone else is in the dark.\n\nNow, we can talk strategy!\n\n## Defense\
    \ in Depth\n\nThe best way to use all these controls is by layering them across\
    \ systems in a way that achieves what is called defense in depth. This has the\
    \ effect of putting multiple and diverse barriers (controls) between the attacker\
    \ and the asset.\n\nThis strategy looks different from case to case, but has proven\
    \ to be the best way to protect yourself and your assets. Think moats, slippery\
    \ walls, hot boiling oil, tar, arrows, secret tunnels, and all the fun, creative\
    \ ways people used to protect their castles and their lives. Now translate those\
    \ to the electronic realm, and you've got the defense‐in‐depth concept down pat.\n\
    \nWe'll spend more time with defense in depth in subsequent chapters. For now,\
    \ you understand the key concept behind it, as well as its main goal:\n\n*Protect\
    \ the organization from cyberrisk*.\n\n## The Threats\n\n> *Just because you're\
    \ paranoid doesn't mean they aren't after you.*\n\n> \n\n> —Joseph Heller, *Catch‐22*\n\
    \nWe have just done a high‐level walkthrough of the building blocks of a cybersecurity\
    \ program. All of this, of course, exists in a broader context, usually referred\
    \ to as the threat context or threat landscape.\n\nWho is out there? What harm\
    \ are they attempting to cause you and why? As you would expect, threats vary\
    \ business to business: The threat context for a restaurant is going to be quite\
    \ different from that of a brokerage firm or a utility company.\n\nIt's important\
    \ to distinguish between a threat (the impending prospect of something bad happening)\
    \ and an attack (the realization of a threat). Keep in mind that cyberattacks\
    \ are not accidental—they don't just happen; they are planned. Cyberattacks involve\
    \ organized efforts by someone(s) to accomplish something particularly wicked\
    \ with regard to your digital assets. Attackers will be stealthy, they will be\
    \ persistent, and they will not stop unless they are either successful, or busted.\n\
    \nThe people behind such cyberattacks are called a lot of things, but this is\
    \ a family book, so we'll stick to threat agents.\n\n## Threat Agents"
