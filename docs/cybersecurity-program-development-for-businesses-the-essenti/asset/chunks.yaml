    # The Difference Between Management and Governance


    The difference between management and governance is in the "apply" part. The application
    of governance is what I call management. It is very important to separate the
    two: **Governance** is the collective set of principle‐guided actions while **management**
    is the application of these principle‐guided actions into the company''s operations.


    Although governance is frequently thought of as overarching (i.e., across the
    whole firm), governance filters down and applies to each and every department
    as well. You need good governance in your IT department, in your cybersecurity
    department, in your marketing, product development, finance, facilities, etc.
    Management feedback, of course, is critical in both validating and influencing
    future governance, and it is this feedback loop that is absolutely essential in
    ensuring alignment.


    Now, please remember: **Bad governance will not invariably result in bad management**.
    You can have a poor set of principle‐guided actions that are very well applied.
    Similarly, **good governance does not automatically result in good management**.
    They are different things, both equally important. Why? Because if either of them
    is not up to task, then alignment suffers.


    ## What Is Alignment and Why Is It Important?


    I keep referring to this alignment. What exactly is alignment, and why is it so
    important? I view alignment as the quintessential metric of value creation. A
    misaligned company is, at best, inefficient at value creation, and at worst…out
    of business!


    Consider, for example, a company with a clear vision and mission statements, well
    funded, good, hard‐working people, and with an excellent IT manager. She has gone
    out and procured state‐of‐the‐art systems from top‐tier vendors with the corresponding
    support agreements. She has bought the best her budget could get. Yet, all departments
    are complaining that nothing can get done in time. They find the systems onerous,
    and incapable of doing what they—the users—need. Where did the IT manager go wrong?


    She didn''t! She''s managing the department just fine. Unfortunately, in the absence
    of proper governance, which would have ensured an alignment between IT and business
    goals, she was left to guess as to which system would be the best fit for what
    she thought the business needed, and with what she knew technology could provide.


    Both governance and management are shared responsibilities. Governance must clearly
    spell out the set of principle‐guided actions that need to take place for value
    to be created. Only then can management effectively integrate these into business
    operations. Similarly, if management fails to understand or properly implement
    what is being spelled out by governance, and give prompt and accurate feedback,
    then we''ll have operational failure. Both cases damage the ability of the company
    to create value. Both cause misalignment.


    ## Commonalities: Engagement, Involvement, Connection, and Interest


    Of course, governance and management practices differ from company to company,
    culture to culture, municipality to municipality, and state to state. Do they
    have anything in common? Is there a set of critical attributes that are essential
    to both?


    Absolutely! The commonalities are: **engagement, involvement, connection, and
    interest**. These are critical ingredients to both governance and management,
    and they are some of the most difficult to find and cultivate, even among the
    most well‐meaning executives. At their heart lies communication, and as we''ve
    discussed, failure to communicate is one of the core issues we are facing, something
    we are changing here by laying a common language foundation.


    Which brings us to the bottom line: What do you need to know to facilitate alignment
    between your cybersecurity program and the rest of the organization? What is the
    practical nitty‐gritty that you must own to make sure your program succeeds?


    # Strategy, Steering, and Standards


    ## Strategy


    The first thing to consider is your strategy. Your strategy is there to realize
    your vision and mission for your company. Your vision and mission may not change,
    but your strategy might need to, in response both to your own innovations and
    to outside conditions.


    Let''s say your vision is to be the best, fastest, safest trucking company in
    Nevada. If that''s the goal, what''s the strategy? How are you going to make this
    a reality? Perhaps you''ll decide on hiring only the best drivers, using only
    certain kinds of trucks, and so on. Then, you wake up one morning and right there
    on the front page is the leading story on the successful test of the first driverless
    truck fleet crisscrossing the country. How might this news change your strategy?


    ## Steering


    That brings us to the next question: How is your strategy being executed? For
    everything and everyone there is a structure that works. The self‐employed businessperson
    is the chief cook and bottle washer. A business with staff, on the other hand,
    may have several layers, each with a role to play in executing the strategy, each
    in their own way steering the company toward the achievement of the goals. In
    one case, you have a steering committee of one, in the other, many. The responsibility
    is the same: Hands on the wheel, attention on the street, focus on getting to
    the destination.


    ## Measuring Success


    There is one more question, and it is critical: How do you know you''re making
    progress? For that matter, how do you know you''ve achieved your goal? In short,
    how do you define and measure success?


    > *There is surely nothing quite so useless as doing with great efficiency what
    should not be done at all.*

    >

    > —Peter Drucker ("Managing for Business Effectiveness," *Harvard Business Review*,
    May 1963)


    The more complex the strategy, the more ambitious the goal, the trickier it is
    to steer toward success. Things can get off the rails as different parts of the
    strategy get out of sync or misaligned. You have to have in place a way to monitor,
    a way to get back on track. The quote from Peter Drucker, possibly the greatest
    management consultant ever, speaks directly to the need for alignment. Let''s
    not get ahead of ourselves, though. For now, let''s get back in the car steering
    our strategy toward our goal.


    How, exactly, are we steering? Yes, I know—hands on the wheel, eyes on the road.
    But *how* are we steering? Which side of the road? Are we steering in England
    or in the United States? Are we steering a bike, or the space shuttle? What are
    the rules of the road, and more importantly, how are we responding to them? Are
    we speeding recklessly? Are we tailgating? Is the blinker not shutting off? One
    way or another, we must balance the rules of the road, the kind of car we''re
    driving, with the *where* and the *how*. We need a framework to follow that will
    give us our best chance of reaching our goal.


    ## The Governance Triad: Strategy, Steering, and Standards


    Meet the three *S*''s: **strategy, steering,** and **standards**—the governance
    triad most often applied when we talk about aligning technology and business.
    In my view, the three *S*''s apply everywhere there is a need for alignment. We
    need to think of strategy, steering, and standards applied between cybersecurity
    and risk appetite. Between technology and business goals. Between risk and reward.


    The good news here is that there is an enormous body of work in management science
    developed by brilliant people dedicated to advancing excellence in the field and
    success in business. I mentioned Peter Drucker already, but the list is long and
    the contributions many and ongoing. You will find a selected bibliography in the
    back of this book, but for our purposes, we''ll stick to some key concepts and
    definitions, along with a business‐centric overview of the tried‐and‐true frameworks
    that will apply to our work: aligning cybersecurity with our goals.


    ## Critical Success Factors

    '
  trans: '


    # 管理与治理的区别


    管理与治理的区别在于“应用”部分。治理的应用就是我所说的管理。将两者区分开来非常重要：**治理**是由原则指导的行动的集合，而**管理**是将这些由原则指导的行动应用到公司的运营中。


    尽管治理通常被认为是全局性的（即跨越整个公司），但治理也会渗透下去，应用到每一个部门。你的 IT 部门、网络安全部门、市场部、产品开发部、财务部、设施部等都需要良好的治理。当然，管理反馈在验证和影响未来治理方面至关重要，而这个反馈循环对于确保一致性绝对必不可少。


    现在，请记住：**糟糕的治理不一定会导致糟糕的管理**。你可能有一套很差的由原则指导的行动，但应用得非常好。同样，**良好的治理也不会自动带来良好的管理**。它们是两码事，但同等重要。为什么？因为如果其中任何一个不合格，一致性就会受损。


    ## 什么是一致性？为什么它很重要？


    我一直在提到这种一致性。究竟什么是一致性，为什么它如此重要？我认为一致性是价值创造的典型指标。一家不一致的公司，充其量只是在价值创造方面效率低下，最坏的情况则是……倒闭！


    举个例子，某公司拥有清晰的愿景和使命声明、资金充足、优秀且勤奋的员工，还有一位出色的 IT 经理。她出去采购了来自一流供应商的最先进系统及相应的支持协议。她用预算能买到的最好的东西。然而，所有部门都抱怨无法按时完成任何工作。他们觉得这些系统繁重，无法满足他们——用户——的需求。IT
    经理哪里做错了？


    她没做错！她把部门管理得很好。不幸的是，在缺乏适当治理的情况下——治理本应确保 IT 与业务目标的一致性——她只能凭猜测来决定哪个系统最适合她认为业务所需，以及她所知技术所能提供的。


    治理和管理都是共同的责任。治理必须明确规定为创造价值所需采取的一套由原则指导的行动。只有在此基础上，管理才能有效地将这些行动整合到业务运营中。同样，如果管理层未能理解或正确实施治理所规定的内容，并给出及时准确的反馈，那么我们将面临运营失败。这两种情况都会损害公司创造价值的能力。两者都会导致不一致。


    ## 共性：参与、投入、联系和关注


    当然，治理和管理实践因公司而异、因文化而异、因市政而异、因州而异。它们有共同点吗？是否有一组对两者都至关重要的关键属性？


    绝对有！共性在于：**参与、投入、联系和关注**。这些是治理和管理的关键要素，也是最难寻找和培养的要素，即使是在最善意的高管中也是如此。其核心在于沟通，正如我们所讨论的，沟通失败是我们面临的核心问题之一，而我们正是通过奠定通用语言基础来改变这一现状。


    这使我们切入主题：为了促进网络安全计划与组织其他部分之间的一致性，你需要知道什么？为了确保你的计划成功，你必须掌握哪些实际的枯燥细节？


    # 战略、指导与标准


    ## 战略


    首先要考虑的是你的战略。你的战略旨在实现公司的愿景和使命。你的愿景和使命可能不会改变，但你的战略可能需要根据自身的创新和外部条件进行调整。


    假设你的愿景是成为内华达州最好、最快、最安全的卡车运输公司。如果这是目标，战略是什么？你将如何将其变为现实？也许你会决定只雇佣最好的司机，只使用特定类型的卡车，等等。然后，某天清晨你醒来，发现头版头条报道了首个无人驾驶卡车车队成功跨国测试的消息。这个消息会如何改变你的战略？


    ## 指导


    这就引出了下一个问题：你的战略是如何被执行的？对每个人和每件事都有一个行之有效的结构。个体经营者是首席大厨兼洗瓶工。另一方面，有员工的企业可能有多个层级，每个层级在执行战略中扮演一个角色，每个层级以自己的方式指导公司朝着目标前进。在一种情况下，你只有一人的指导委员会；在另一种情况下，则有许多人。责任是一样的：手握方向盘，目光注视路面，专注于到达目的地。


    ## 衡量成功


    还有一个问题，而且至关重要：你怎么知道你在取得进展？话虽如此，你怎么知道你已经达成了目标？简而言之，你如何定义和衡量成功？


    > *没有什么比高效地做根本不该做的事更无用的了。*

    >

    > ——彼得·德鲁克（《管理以求商业效益》，《哈佛商业评论》，1963 年 5 月）


    战略越复杂，目标越雄心勃勃，要驾驭走向成功就越棘手。当战略的不同部分失去同步或出现错位时，事情就会偏离轨道。你必须建立一种监控方式，一种重回正轨的方式。彼得·德鲁克的这句名言——他可能是有史以来最伟大的管理顾问——直接指出了对一致性的需求。不过，我们别操之过急。现在，让我们回到驾驶战略走向目标的车上来。


    究竟我们是如何驾驶的？是的，我知道——手握方向盘，目光注视路面。但我们*究竟如何*驾驶？走路的哪一边？我们是在英国开车还是在美国开车？我们是骑自行车，还是驾驶航天飞机？交通规则是什么？更重要的是，我们如何应对它们？我们是鲁莽超速？紧跟前车？转向灯关不掉？不管怎样，我们必须平衡交通规则、车辆类型与*地点*和*方式*。我们需要一个遵循的框架，以最大程度地提高到达目标的机会。


    ## 治理三要素：战略、指导与标准


    认识一下这三个 *S*：**战略、指导**和**标准**——当我们谈论协调技术与业务时，最常应用的治理三要素。依我之见，凡是需要一致性的地方，这三个 *S*
    都适用。我们需要考虑网络安全与风险偏好之间的战略、指导和标准。技术与业务目标之间。风险与回报之间。


    好消息是，管理科学领域拥有海量的研究成果，由致力于推动卓越和商业成功的杰出人士开发。我已经提到过彼得·德鲁克，但这份名单很长，贡献众多且持续不断。你会在本书后面找到精选参考书目，但就我们的目的而言，我们将坚持一些关键概念和定义，以及经过验证的、将应用于我们工作的框架的以业务为中心的概述：将网络安全与我们的目标对齐。


    ## 关键成功因素


    '
