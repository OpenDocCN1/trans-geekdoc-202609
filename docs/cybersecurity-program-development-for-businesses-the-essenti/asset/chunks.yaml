    | **Criticality** | **Impact** | **MTD** | **RPO** | **RTO** | **Resources** |

    | TM SERVER | IT | IT | CA | 3 | 4 | 4 | 20 | 8 | 16 | IT |


    **Table 6.6** Impact/Criticality Systems Spreadsheet


    | **Impact/Criticality** | **Nice to Have** | **Optional** | **Essential** | **Mission‐Critical**
    |

    | --- | --- | --- | --- | --- |

    | **No Impact** | Lunch ordering | Online 401K review | Building lease and drawings
    |   |

    | **Minor Impact** | Ad hoc reporting | Expense reports | Travel advance | Inventory
    control |

    | **Moderate Impact** | Online ticketing | HR appraisals | HR hiring | Financial
    systems |

    | **Severe Impact** | Policies and procedures | Fixed assets | Payroll | Fulfillment
    |


    **Table 6.7** Systems/Criticality Spreadsheet


    | **System/Criticality** | **Nice to Have** | **Optional** | **Essential** | **Mission‐Critical**
    |

    | --- | --- | --- | --- | --- |

    | System 1 | X |   |   |   |

    | System 2 |   | X |   |   |

    | System 3 |   |   | X |   |

    | System 4 |   |   |   | X |

    | System 5 |   |   | X |   |

    | System 6 |   |   | X |   |


    Clicking on the second‐level spreadsheet''s system entries (`FIN SERVER`, `PAY
    SERVICE`, and `TM SERVER`) would take you to another spreadsheet that contained
    the specific information about that system. This could be configuration information,
    vendor information, warranty information, etc., or contact and account information
    for the services in use.


    When you are done, you can choose to combine these spreadsheets into an enterprise‐wide
    one that, instead of listing systems, lists business units. Where do you get the
    classification, criticality, and impact numbers? That''s a bit tricky. Yes, you
    could theoretically apply a formula based on the individual business units'' impact
    assessments, but you would be off. As I am sure you realize, any one business
    unit may have one or more systems scoring high on classification, criticality,
    and impact while the business unit itself would score low at an enterprise level.
    That is why assigning those numbers is best left to the executive management team
    and (if necessary) to the board. Your goal for that spreadsheet is to arrive at
    a prioritization by business unit for business continuity and disaster recovery
    purposes. This prioritization will filter down to your cybersecurity program work
    as you tackle the creation of an incident‐response plan in case of a cyberattack.


    You can also separate out different components of these spreadsheets for easier
    review and presentation. For example, you can separate out Impact and Criticality
    by creating an impact‐specific spreadsheet per system. That table could look like
    **Table 6.6**.

