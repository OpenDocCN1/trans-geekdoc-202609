    the year? I''d call that “severe,” too. The quarter? Let''s go with “moderate.”
    You wouldn''t even notice the charge in the P&L? I''d call that “minor.” You should
    feel free to come up with your own terms, but my advice is keeping it down to
    no more than four, and to avoid colorful language. Other people, potentially of
    sour disposition, may read the document someday, and you don''t want them raising
    any eyebrows as they contemplate litigation, especially if the outage will cause
    a public relations nightmare for your company.


    An interesting side note: The business unit owner will assign their version of
    impact. Then, the executive team may assign a different version of impact for
    the unit. And finally, the board, which is the ultimate decision‐maker on all
    matters of risk, may choose to accept an impact classification of severe as not
    worthy of a set of controls, despite your advice to the contrary. Crazy, I know,
    but these differing points of view are entirely appropriate.


    The business unit owner will justly consider a system''s failure impact as severe
    for their unit while the CEO may consider the business unit''s inability to contribute
    value as moderate, and the board may very well accept that risk and elect not
    to apply any controls toward that moderate or severe impact assessment. There
    are times when yours is not to reason why.


    ## 4. Maximum Tolerable Downtime (MTD)


    Let''s assume the business unit is out of commission for some reason—cyberattack,
    power outage, whatever. Ask the question: “How long can the business unit owner
    tolerate the outage?” That''s the amount of pain that the business owner is willing
    to accept before things turn ugly. What''s ugly? Ugly is going out of business.
    That''s pretty ugly. Less ugly is finding yourself unable to comply with a contract
    or regulation while more ugly is loss of life because of the outage. You get the
    idea. The MTD provides a baseline for building disaster recovery and business
    continuity plans.


    ## 5. Recovery Point Objective (RPO)


    The RPO tells you the *when* in time you need to be able to recover to. Think
    of it this way: Let''s say you have an accounting system. The thing goes south
    on you. It''s out. Gone. Nothing is running. Can''t pay invoices, can''t process
    receivables, and can''t run payroll. The natives are starting to get restless.
    The IT department and the accounting vendor look at the situation and they tell
    you that the system will be back in two days'' time, and the data will be restored
    from last week''s backup.


    Here''s the question you should be able answer to *before* the failure: Is that
    okay? If so, it means that once you get the system back (in two days) you''ll
    have to reenter all transactions that happened between the last good backup and
    the day you have the system back. If you agree, that means that you have implicitly
    accepted two values: One is the recovery point objective of one week.


    The second is:


    ## 6. Recovery Time Objective (RTO)


    Your RTO is the maximum amount of time that you''re willing to wait to be back
    in business, or—to put it in a more positive light—RTO is, ideally, how fast you''d
    like to have the problem go away and you back in business. In the preceding example,
    you accepted an RTO of two days. This is different from the MTD, which you may
    have set as one month, because with no payroll for a month, you''ll be left with
    no employees and no business. Hence: maximum tolerable downtime.


    Now, consider that instead of an accounting system going down, you''re a brokerage
    firm, and your brokerage system crashes. No more trades. No more reconciliation.
    No more portfolio management. You have no idea where the orders that were in the
    pipeline are, what''s executed and what hasn''t, what the values are, etc.


    What''s your recovery time objective? If you said a few seconds, you would be
    right! Anything more could put you out of business. And your recovery point objective?
    Right up to the last second before the outage. You can''t afford to lose any transactions.
    (To say nothing about those “men in black” from the regulators who will want to
    have a friendly chat with you about the outage.)


    ## 7. Resources


    This is one of the most important pieces of information you''ll collect. What
    are the resources (always per business unit per system) necessary for recovery?
    They need to be accurately identified and be cataloged in an actionable, meaningful
    way. You''ll need not only the “Who is doing what?” question answered, but also
    how to get in touch with these resources, including backup plans if the resources
    are not available.


    For example, if your can''t‐live‐without‐it custom application was written in
    Etruscan by Molly, who has since retired to Oahu, it is probably a good idea to:
    (a) have all of Molly''s up‐to‐date contact information, (b) have identified the
    last few remaining Etruscan speakers, and (c) reflect on the lesson‐learned about
    keeping mission‐critical systems up‐to‐date and not in dead‐and‐gone language.


    Similarly, you need to keep in mind that resources will be placed in contention
    if more than one system goes south (a likely event in the case of a cyberattack).

    '
  trans: '


    ## 1. 机密性分级


    和之前一样，我建议你使用 1 到 4 的等级，其中 1 代表“公开”，2 代表“机密”，3 代表“秘密”，4 代表“绝密”。


    两点提示：第一，避免陷入分级过多的陷阱。尽可能保持简单。


    第二，使用偶数个分级，以避免让任何人有机会选择中间数作为稳妥之选。既然你是在与资产所有者合作完成所有这些工作，就要坚持要求你们双方都彻底思考这一分级。你会惊讶地发现，这在未来会带来意想不到的回报。


    如果拿不准，可以使用场景分析。提出“假设”类问题。如果这些数据泄露给公众会怎样？薪资报表误在全公司流传会造成什么影响？你能否识别出具有明确信息访问界限的用户群体？谁需要知道这些数据，谁不应该知道？是否有政策规定了数据的访问权限？


    ## 2. 关键性


    同样，我建议你使用 1 到 4 的等级，其中 1 代表“锦上添花”，2 代表“可有可无”，3 代表“必不可少”，4 代表“任务关键型”。这些适用于从业务单元到资产的整个范围，你在分配等级时需要尽可能客观。并非所有资产都是关键的。它们可能都*有价值*，但这并不使它们变得关键。你可能在没有音乐服务器流媒体的情况下正常运营几个月，但如果会计部门无法支付供应商款项或发放工资，你就被迫关门大吉。


    场景在确定关键性方面非常有帮助，特别是当场景由特定的业务单元职能界定时，即范围受限。如果你开始在企业层面谈论关键性，即哪个业务单元比另一个更关键，那么你最好只在执行委员会和董事会在场时才这么做——否则，你辛苦建立关系的这些朋友都会用异样的眼光看你（例如：“你说‘设施管理’不如‘财务’关键是什么意思？让我看看你在没有暖气的情况下怎么工作！”）。


    ## 3. 影响


    这是在 1 到 4 的等级上对痛苦程度的衡量，从“无”、“轻微”、“中度”到“严重”。从业务影响的角度来看，停机会有多痛苦？会导致停业吗？如果是，影响就是严重的！与停机相关的费用是否高到让企业全年亏损？我也会称之为“严重”。影响到季度？那就算“中度”。在损益表
    (P&L) 中甚至注意不到这笔费用？我会称之为“轻微”。你可以随意创造自己的术语，但我的建议是将等级控制在不超过四个，并避免使用花哨的语言。将来可能有其他人（心情可能不佳）阅读这份文档，你不希望他们在考虑诉讼时挑起眉毛，特别是当停机会给你的公司带来公关噩梦时。


    一个有趣的旁注：业务单元所有者会分配他们版本的影响等级。然后，高管团队可能会为该单元分配不同版本的影响等级。最后，作为所有风险事项最终决策者的董事会，可能会选择接受“严重”的影响分级，认为不值得实施一套控制措施，尽管你建议相反。我知道这听起来疯狂，但这些不同的观点完全合理。


    业务单元所有者理所当然地会认为系统故障对其单元的影响是严重的，而 CEO 可能认为业务单元无法创造价值的影响是中度的，董事会很可能会接受该风险，并选择不对该中度或严重的影响评估实施任何控制措施。有时你的职责不在于追问为什么。


    ## 4. 最大可容忍停机时间 (MTD)


    假设业务单元因某些原因（网络攻击、停电等）而瘫痪。提出问题：“业务单元所有者能容忍多长时间的停机？”这就是业务所有者在情况变糟之前愿意接受的痛苦程度。什么是“变糟”？“变糟”就是倒闭。那非常糟。不那么糟是发现自己因停机而无法遵守合同或法规；更糟是因停机导致人员伤亡。你明白了吧。MTD
    为构建灾难恢复和业务连续性计划提供了基准。


    ## 5. 恢复点目标 (RPO)


    RPO 告诉你需要恢复到*哪个时间点*。可以这样理解：假设你有一个会计系统。系统突然故障了。瘫痪了。什么都跑不起来。无法支付发票、无法处理应收账款、无法发放工资。员工们开始骚动不安。IT
    部门和会计供应商评估情况后告诉你，系统将在两天后恢复，数据将从上周的备份中恢复。


    这是你在故障发生*前*就应该能回答的问题：这可以接受吗？如果可以，这意味着一旦系统恢复（两天后），你将不得不重新录入上次良好备份日期到系统恢复当天之间发生的所有交易。如果你同意，那就意味着你隐性地接受了两个值：一个是恢复点目标为一周。


    第二个是：


    ## 6. 恢复时间目标 (RTO)


    你的 RTO 是你愿意等待恢复运营的最长时间，或者——用更积极的说法——RTO 理想情况下是你希望问题多快解决、你多快恢复运营。在前面的例子中，你接受了两天的
    RTO。这不同于 MTD，你可能将 MTD 设定为一个月，因为如果一个月不发工资，你将失去所有员工和业务。因此：最大可容忍停机时间。


    现在，假设不是会计系统宕机，而是你是一家券商，你的券商系统崩溃了。无法交易、无法对账、无法管理投资组合。你不知道管道中的订单在哪里，哪些已执行哪些未执行，价值是多少等。


    你的恢复时间目标是多少？如果你说是几秒钟，你就对了！任何更长的时间都可能让你倒闭。而你的恢复点目标呢？就在停机前的最后一秒。你承担不起丢失任何交易的后果。（更别提那些来自监管机构的“黑衣人”会想就停机事件和你进行一次“友好交谈”。）


    ## 7. 资源


    这是你将收集的最重要的信息之一。恢复所需的资源（始终按业务单元、按系统划分）是什么？它们需要被准确识别，并以可执行、有意义的方式编入目录。你不仅需要回答“谁做什么？”，还需要知道如何联系这些资源，包括资源不可用时的备选方案。


    例如，如果你离不开的定制应用程序是由 Molly 用埃特鲁里亚语编写的，而她已经退休去欧胡岛养老了，那么最好：(a) 拥有 Molly 所有最新的联系信息，(b)
    确定仅存的几位埃特鲁里亚语使用者，以及 (c) 吸取教训，保持任务关键型系统更新，不要使用已死的语言。


    同样，你需要记住，如果不止一个系统瘫痪（在网络攻击的情况下，这很可能发生），资源将会面临争用。


    '
