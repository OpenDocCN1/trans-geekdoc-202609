    \ senior management buy‐in and support is for a cybersecurity program. We've discussed\
    \ the significance of board engagement, and the role of company leadership in\
    \ not only leading by example, but also conveying the message that cybersecurity\
    \ is a shared responsibility. Now, though, we have to go from the abstract to\
    \ the specific—from policy to people. That means confronting a new question: “What's\
    \ in it for me?”\n\nThe literature on human motivation is extensive, and reviewing\
    \ it in depth is clearly beyond our scope. But let's dip our toes in a little\
    \ because you need to know a few basics in order to give your new cybersecurity\
    \ program the best chance of success. This chapter will introduce some fundamentals\
    \ about what makes people's attitudes shift, what kind of messaging works, and\
    \ how to design a cybersecurity awareness program.\n\n## Attitude Adjustment!\n\
    \nIn their classic *Handbook on Social Psychology* (1986), McGuire, Lindzey, and\
    \ Aronson defined *attitude* as beliefs and behaviors toward something. This something\
    \ could be work, could be ideas, could be other people. Moreover, attitudes change\
    \ with time, cultural influences, personal motivation, and knowledge acquisition.\n\
    \nA key factor in the ability to shift a person's attitude is a phenomenon called\
    \ emotional resonance. Fear is a useful tool in provoking attitude change. When\
    \ I used to teach computer science at the Stratford School in Rochester, New York,\
    \ I used to tell my students that I considered “fear a valid educational tool!”\
    \ I was, of course, joking, since I am one of those who prefer honey to vinegar\
    \ any time of the day. Still, Professor Howard Leventhal at Rutgers University,\
    \ in his 1970 paper “Findings and Theory in the Study of Fear Communications,”\
    \ makes two critical points that are particularly relevant to communicating a\
    \ cybersecurity awareness message. The first is that “increases in fear generally\
    \ increase persuasion, but there obviously are conditions where this is not so.”\
    \ The second one is that “when high fear messages fail to persuade, the failure\
    \ frequently reflects the subject's felt incapacity to cope with danger.”\n\n\
    There have been plenty of situations when I've tried to communicate a sense of\
    \ urgency or danger to boards and executives, and those experiences fully confirm\
    \ Dr. Leventhal's points. In general, following delivery of my message, there\
    \ is a shift in the recognition that there is a problem to be solved, and in most\
    \ cases, a follow‐through action.\n\nThere is, however, a small percentage who\
    \ inevitably reject the message altogether. They are the ones who will try every\
    \ excuse in the book to ignore the new cyberreality (“We're too small,” “Hasn't\
    \ happened yet,” “We'll look into it next year…”). They are unable (or unwilling)\
    \ to cope with the new dangers that our world now presents, and instead choose\
    \ to hide their heads in the sand."
