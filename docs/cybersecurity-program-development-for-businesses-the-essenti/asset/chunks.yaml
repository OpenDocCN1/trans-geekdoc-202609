    Bottom line? Expect to see a lot more action on this, especially as the growth
    path of IoT makes the infamous hockey‐stick curve look limp by comparison.


    ## Distributed Workforces


    Once upon a time, people used to get up and physically transport themselves to
    an office where they performed work. When they were done, they did the physical
    transport routine in reverse. Endless hours were wasted in transit, with tons
    of pollutants dumped into the environment. People toiled for years and years under
    these conditions, until Alexander Graham Bell invented the telephone, and Mr.
    Watson started to phone it in. Things went south from there.


    According to Gallup, from 1995 to 2015 the percentage of workers in the United
    States telecommuting for work rose from 9 percent to 37 percent. That is more
    than one third of the workforce of the United States telecommuting at some point
    during the month, with 9 percent of those telecommuting half the time or more.
    There''s some debate about whether the trend is leveling off or increasing, and
    also about whether it''s smart or counterproductive. Regardless, one thing remains
    clear: Telecommuting is real, it''s increasing, and it is likely to continue in
    one form or another, especially if work entails getting into an office and working
    on a computer. Hence, your headache.


    Why? Because, unless your company is providing and controlling the equipment used
    to access corporate resources, you have a problem. A big problem. If your organization''s
    corporate policy is `BYOD` (bring your own device), then it implies that a private
    piece of equipment is connecting to the corporate network, working with corporate
    assets, and doing so over potentially unsecured connections, which could include
    someone''s home, hotel, coffee shop, airport…anywhere they go. Moreover, neither
    your IT nor cybersecurity departments have any legal standing with regard to accessing
    and controlling an employee''s private computer or phone. That causes a serious
    legal headache if, for example, the employee is terminated and IT and cybersecurity
    want to ensure that no corporate data is walking out the door. You cannot exactly
    take over the system remotely and wipe it! The individual may have personal data
    (for example, his or her personal contacts), which, of course, are commingled
    with their corporate contacts. And if the employee was in, let''s say sales, and
    if you have reason to assume the employee may seek a new job with your competition,
    you can see how this can quickly become a serious problem.


    What is a cybersecurity czar to do? Assuming that you cannot persuade the company
    to provide equipment for all employees (local and remote), then your options are
    limited to creating a set of policies and standards to which employees must consent
    in order to access the network. These policies and standards, translated into
    some form of an employee agreement or consent form, will not guarantee that your
    data won''t fly out the door. But they may set minimum security standards and
    corporate rights that survive separation. It is absolutely critical that your
    attorney is involved in drafting these. It is the only way you can maximize your
    chances of making the policies enforceable following an event. Even then—I won''t
    lie to you—enforcing these rules can become very time consuming and very expensive.


    Remember our guiding principle to date: “What is it worth to you?” You must have
    a heart‐to‐heart talk with your executive team and your board to determine how
    far is far enough in regard to writing and enforcing security policies. It is
    only they who can accept the risk. There is no “best practice” when it comes to
    these issues. It''s all about your risk appetite: What are you willing to accept,
    and what are you not?


    There are companies that will not accept this risk. They recognize the reality
    of a distributed workforce. They even welcome the savings in physical plant costs,
    but they are not willing to accept the risk of their network being accessed by
    noncompany equipment. And so, they provide everything: the equipment, the policies
    governing its use, and extremely tight controls on who, how, where, and when is
    accessing the corporate network and assets. If an employee is separated, they
    immediately `brick` the equipment (a slang term meaning to render the equipment
    as useful as a brick), and provide for a mechanism for the equipment''s safe return.
    Of course, all the corporate data across the board, local or remote, tend to be
    encrypted both in transit and at rest.


    Obviously, this level of control does not come easily or cheaply. The systems,
    workflows, and personnel training required are complex and expensive in both time
    and money. Moreover, the message to the company is that Big Brother is watching.
    Therefore, when discussing with your board such an approach, make sure that you
    sensitize them to all aspects of such an implementation. In some cases, there
    is no choice (e.g., you''re working for the NSA for crying out loud! What did
    you expect?). In others, there may be some give and take. As always, your role
    is to be there and inform the board, owners, or executives charged with accepting
    risk, with all the pertinent details, and then accept their decision.


    On the other hand, there are other companies that fully, and perhaps cavalierly,
    accept the risk. Their position is that even if data is exfiltrated, it is useless
    without the company know‐how with regard to generating value, so the corporate
    attitude is: “Let them have it!” In terms of the gaping cybersecurity hole that
    this allows (e.g., access by an infected computer), well…as we''ve discussed:
    “Ours is not to reason why….” You have informed the stakeholders of the risk,
    you made sure they understood it, and they have accepted it. Move on.


    Then there are the companies that fall somewhere in between. Yours probably—hopefully!—is
    one of them. These companies are very concerned about the risks introduced by
    `BYOD` and distributed workforces, and as such, they mitigate the risks as best
    they can through their defense‐in‐depth strategies. In practice, that looks something
    like this:


    1.  Create legally binding agreements between employees and their use of equipment
    accessing corporate assets.

    2.  Create and communicate clear policies, standards, procedures, guidelines for
    all information technology use and corporate systems access.

    3.  Have clear and timely onboarding and offboarding processes for all employees.

    4.  Provide cybersecurity awareness training to all employees, at least quarterly,
    and maintain awareness throughout the year.

    5.  Deploy a wide range of controls, including a well‐tuned security information
    and event management system and a data loss protection system.


    Like it or not, distributed workforces, freelancing, telecommuting, `BYOD`, and
    so on are here to stay, likely to grow, and likely to have significant impacts
    on our definition of the workplace. The impact of these developments on IT and
    cybersecurity is equally profound: The concept of perimeter security is completely
    redefined. Indeed, some argue the perimeter no longer exists at all.


    As for me, I argue that your current perimeter does exist, but it''s not one or
    more campuses or offices.


    Your perimeter is planet‐wide. Plan accordingly.


    # Chapter 10: Controls


    In [Chapter 3](#c03.xhtml), we defined the four broad types of controls: `preventative`,
    `detective`, `corrective`, and `compensatory`. Some analysts include a fifth type,
    called a `targeted control` or a `countermeasure`, which addresses a specific
    threat or a specific vulnerability. But for simplicity''s sake, I''m going to
    include targeted controls as part of the four categories, depending on how they
    function.


    Keep in mind that the examples that follow are just that, examples—not an exhaustive
    list by any means. New controls are developed almost daily as part of the constant
    arms race between hackers, cybersecurity vendors, developers, IT companies, end
    users, and governments.

    '
  trans: '

    归根结底？预计将看到更多这方面的行动，特别是随着 IoT 的增长路径让臭名昭著的“曲棍球棒”曲线看起来都相形见绌。


    ## 分布式员工队伍


    从前，人们习惯早起并亲自前往办公室工作。下班后，他们按原路返回进行物理通勤。无数小时浪费在途中，大量污染物排放到环境中。人们在这种条件下辛苦工作了年复一年，直到亚历山大·格雷厄姆·贝尔发明了电话，沃森先生开始“远程办公”。从那里开始，事情就走下坡路了。


    根据盖洛普的数据，从 1995 年到 2015 年，美国远程办公工人的比例从 9% 上升到了 37%。也就是说，美国超过三分之一的劳动力在一个月中的某个时刻进行过远程办公，其中
    9% 的人有一半时间或更多时间在远程办公。关于这一趋势是趋于平稳还是继续增长，以及它是明智之举还是适得其反，存在一些争议。但无论怎样，有一点是清楚的：远程办公是真实存在的，它在增加，并且很可能以某种形式持续下去，特别是当工作内容是进入办公室并在电脑上工作时。因此，你的头疼事来了。


    为什么？因为，除非你的公司提供并控制用于访问企业资源的设备，否则你就有麻烦了。大麻烦。如果你组织的企业政策是 `BYOD`（自带设备），那就意味着一台私人设备正在连接企业网络、处理企业资产，且是通过潜在的不安全连接进行的，这可能包括某人的家里、酒店、咖啡店、机场……他们去的任何地方。此外，你的
    IT 部门和网络安全部门在访问和控制员工的私人电脑或手机方面没有任何法律地位。例如，如果员工被解雇，而 IT 和网络安全部门想要确保没有企业数据带出大门，这就会造成严重的法律麻烦。你无法远程接管系统并将其擦除！个人可能拥有个人数据（例如，其私人联系人），这些数据当然与他们的企业联系人混在一起。如果该员工从事销售工作，而你有理由认为该员工可能会去竞争对手那里谋职，你就能明白这如何迅速演变成一个严重问题。


    网络安全主管该怎么办？假设你无法说服公司为所有员工（本地和远程）提供设备，那么你的选择仅限于制定一套员工必须同意遵守的政策和标准，以便访问网络。这些政策和标准转化为某种形式的员工协议或同意书，并不能保证你的数据不会飞出大门。但它们可能设定最低安全标准和企业权利，使其在员工离职后依然有效。绝对关键的是让你的律师参与起草这些文件。这是你在事件发生后最大程度确保政策可执行的唯一途径。即便如此——我不会骗你——执行这些规则可能会变得非常耗时且昂贵。


    记住我们迄今为止的指导原则：“这对你值多少钱？”你必须与你的高管团队和董事会进行一次坦诚交谈，以确定在编写和执行安全政策方面，多远才算够远。只有他们能接受风险。处理这些问题时，不存在“最佳实践”。一切都关乎你的风险偏好：你愿意接受什么，不愿意接受什么？


    有些公司不愿接受这种风险。它们认识到分布式员工队伍的现实。甚至欢迎物理场地成本的节省，但它们不愿接受网络被非公司设备访问的风险。因此，它们提供一切：设备、管控其使用的政策，以及对谁、如何、何地、何时访问企业网络和资产的极严格控制。如果员工离职，他们会立即将设备“变砖”（俚语，意指让设备像砖头一样毫无用处），并提供安全回收设备的机制。当然，全公司范围内的所有企业数据，无论本地还是远程，都倾向于在传输中和静止时均进行加密。


    显然，这种级别的控制既不容易也不便宜。所需的系统、工作流和人员培训在时间和金钱上都是复杂且昂贵的。此外，传递给公司的信息是“大哥在看着你”。因此，当与董事会讨论这种方法时，务必让他们了解此类实施的所有方面。在某些情况下，别无选择（例如，你为
    NSA 工作，天哪！你还指望什么？）。在其他情况下，可能有一些妥协余地。一如既往，你的角色是站在接受风险的董事会、所有者或高管身边，向他们提供所有相关细节，然后接受他们的决定。


    另一方面，也有一些公司完全、甚至可能鲁莽地接受这种风险。他们的立场是，即使数据被泄露，如果没有公司关于创造价值的专有诀窍，这些数据也毫无用处，因此企业态度是：“让他们拿去吧！”至于这允许的巨大网络安全漏洞（例如，被感染电脑的访问），嗯……正如我们讨论的：“我们不必问为什么……。”你已将风险告知利益相关者，确保他们理解了，并且他们已接受。继续前行。


    还有一些公司介于两者之间。你的公司很可能——希望如此！——就是其中之一。这些公司非常担心 `BYOD` 和分布式员工队伍带来的风险，因此，它们通过纵深防御策略尽最大努力降低风险。在实践中，这看起来大概如下：


    1.  在员工及其使用访问企业资产的设备之间建立具有法律约束力的协议。

    2.  制定并传达清晰的政策、标准、流程、指南，涵盖所有信息技术使用和企业系统访问。

    3.  为所有员工建立清晰及时的入职和离职流程。

    4.  向所有员工提供网络安全意识培训，至少每季度一次，并全年保持意识。

    5.  部署广泛的控制措施，包括调优良好的安全信息和事件管理系统以及数据丢失防护系统。


    不管喜不喜欢，分布式员工队伍、自由职业、远程办公、`BYOD` 等都将长期存在，很可能会增长，并很可能对我们对工作场所的定义产生重大影响。这些发展对 IT
    和网络安全的影响同样深远：边界安全的概念被完全重新定义了。确实，有人认为边界根本不再存在。


    至于我，我认为你当前的边界确实存在，但它不是一个或多个校区或办公室。


    你的边界遍布全球。请相应规划。


    # 第 10 章：控制措施


    在 第 3 章 中，我们定义了四大类控制措施：`preventative`（预防性）、`detective`（检测性）、`corrective`（纠正性）和
    `compensatory`（补偿性）。一些分析师包括第五种类型，称为 `targeted control`（针对性控制）或 `countermeasure`（对策），用于应对特定威胁或特定漏洞。但为求简单起见，我将根据其功能将针对性控制归入上述四类中。


    请记住，后面的示例仅仅是示例——绝非详尽列表。作为黑客、网络安全供应商、开发人员、IT 公司、最终用户和政府之间持续军备竞赛的一部分，新的控制措施几乎每天都在开发中。

    '
