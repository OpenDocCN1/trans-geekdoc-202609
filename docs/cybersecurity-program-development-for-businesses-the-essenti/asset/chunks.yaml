    # ENISA Threat Landscape Report


    The European Union Agency for Network and Information Security (ENISA) produces
    an annual report titled “ENISA Threat Landscape Report.” The 2016 report (published
    in January 2017 as *ENISA Threat Landscape Report 2016—15 Top Cyber‐Threats and
    Trends*) lists the following threat agents. For good measure, I have added a motive
    summary (i.e., likely reasons for why they are doing what they''re doing). You
    will want to take a look at this list to see which threat agents are most likely
    to apply to your business context.


    ## Threat Agents


    ### 1. Cybercriminals


    **Motives:** “Show me the money,” plain and simple.


    ### 2. Insiders (e.g., employees)


    **Motives:** money and revenge, not necessarily in that order.


    ### 3. Nation‐States


    **Motives:** cyberwarfare or intellectual property theft, competitive intelligence
    gathering, etc.


    ### 4. Corporations


    **Motives:** cyber‐corporate‐warfare or intellectual property theft, competitive
    intelligence gathering, etc.


    ### 5. Hacktivists


    **Motives:** activism of one sort or another, often but not always altruistically
    motivated (freedom of speech, fight against injustice, etc.).


    ### 6. Cyber‐Fighters


    **Motives:** nationally motivated “patriots” like the Yemen and Iranian Cyber
    Army.


    ### 7. Cyberterrorists


    **Motives:** to create fear, chaos. Terrorist by any other name.


    ### 8. Script Kiddies


    **Motives:** young people “hacking for the fun of it” and causing havoc, be it
    intentional or not.


    ## Key Trends Influencing Threat Agents


    The preceding threat agents are flourishing in today''s technology environment
    thanks to a variety of accelerating trends. ENISA has noted these four key trends
    that influence the activities of threat agents, still holding true today:


    ### 1. Consumerization of cybercrime


    Just as Lowe''s and Home Depot made home renovations more available to the masses,
    new tools are making cybercrime broadly accessible. There are many do‐it‐yourself
    hacking kits available for purchase or even free download. It is also fairly easy
    to hire a hacker to attack a target. Worse: There are both franchising opportunities
    and affiliate programs for cybercriminals as well as exciting new commercial avenues
    like ransomware‐as‐a‐service whereby you can get your own custom ransomware kit
    for little money up front for a percentage of the extorted profits. A financial
    win‐win for everyone involved, unless, of course, you''re one of the victims.
    All this leads to:


    ### 2. Low barriers to entry for technical novices


    If you''re motivated, you can start your career as a cybercriminal easily. There
    are hacker universities in which you can get training, and when you purchase some
    of the ready‐made hacking kits you can even get expert tech support!


    ### 3. Dark net mystique


    The dark net is now like how the Internet was in the 1990s. It is perceived as
    being used only by dangerous geeks, and normal users are discouraged from peeking
    in. For that matter, one has to jump through a whole set of technical hoops to
    gain access, further making the dark net an excellent hideout for cybercriminals.


    ### 4. Low rates of attributions


    It remains practically impossible to arrest cybercriminals. Even after major cyberevents,
    commercial or espionage related, no meaningful attributions were made, and practically
    no arrests. This makes being a cybercriminal a low‐risk/high‐reward line of work.


    Threats, threat agents, and trends. How do we go from that to hackers? Are hackers
    the threat agents? And, are hackers cybercriminals? Nothing could be further from
    the truth!


    ## The Nature of Hackers


    Back when the Internet was a cyber–Wild West, the term *hacker* was no insult—quite
    the opposite, it was a term of respect. The Internet as we know it was created
    by people who proudly called themselves hackers because a *hacker* was anyone
    skilled at building, exploring, and expanding the capabilities of all sorts of
    systems.


    Nefarious, bad‐guy hackers should really be referred to as thieves, vandals, criminals,
    really‐really‐really‐bad people, etc. Unfortunately, the distinction between good
    hackers and bad hackers never caught on, and these days the term *hacker* is usually
    not meant as a compliment. But not all hackers are alike: The differences between
    them can be night and day, black and white, Jedi‐versus‐Sith, or your choice of
    fundamental opposing forces.


    Historically speaking, all hackers *do* have one thing in common: high levels
    of technical skill. Hackers explore the details of programmable systems and figure
    out how to stretch their capabilities. This is very important because the skills
    involved are far from inconsequential. It requires a combination of inborn talent
    and endless study, competition, and practice. All great hackers, irrespective
    of which side they are on—night or day, good or evil, black hat or white—share
    these hard‐won attributes. You might not be surprised to learn then that many
    old‐school hackers have been recruited (or volunteered) to solve some of the world''s
    most intractable problems such as curing diseases, distributing vaccines, or developing
    next‐generation safe nuclear reactors.


    Hackers also, it should be said, tend to have very healthy egos and are usually
    not above showing off their skills. Knowing a bit about the hacker personality
    helps set the context for your cybersecurity program and—importantly—how you communicate
    about it.


    For example, it is one thing to consider yourself fit because you go to the gym
    every day, and quite another to consider yourself an Olympic‐level athlete. Similarly,
    it is one thing to work toward protecting your assets from cyberattacks, and quite
    another to try to bait a hacker by boasting of your unbreakable defenses. If you
    do, you do so at your own peril. Given the character of hackers, it is foolish
    to underestimate them and even more foolish to challenge them.


    ## Attack Process


    Having been introduced to the hacker mentality, we are now ready to discuss the
    actual process of a cyberattack. How does it unfold, what does it entail, and
    what can you do about it?


    Remember, at its core, a cyberattack represents actions taken by threat agents
    against your assets. All cyberattacks have certain attributes and will typically
    follow a general process, a cyberbattle plan of their own.


    A cyberattack unfolds through an *attack vector*. That is the path that the attacker
    takes to compromise your asset. Although most attack vectors are pointing inward
    (ingress) toward systems and assets, there are attacks that point outward (egress).
    Those outward attacks focus on ways to extract data and assets as opposed to gaining
    access and potentially damaging data.


    On the attack vector rides the *attack payload*. Think of this as a container
    (e.g., the outside of a bomb) that delivers the exploit (the explosives) that
    take advantage of one or more vulnerabilities exposing the target to the attacker.
    There are many types of payloads, all of which are essentially sections of malicious
    programming code most often wrapped in a layer of innocuous programming code designed
    to fool your defenses. There is a whole scientific discipline dedicated to analyzing
    and studying payloads, something far beyond the scope of this book for our purposes,
    but suffice it to say that payloads can be very complex, and very elegant at the
    same time.


    ## Types of Attacks


    There are myriad classifications for cyberattacks. Here are some major vocabulary
    terms, the ones most commonly used and the ones you''ll be hearing in cybersecurity
    discussions.


    *   **Advanced persistent threat (APT):** An APT says what it does and does what
    it says—it''s a coordinated, persistent, resilient, adaptive attack against a
    target. APTs are primarily used to steal data. They can take a long time to research,
    plan, coordinate, and execute, but when they succeed, they are frequently devastating.
    You definitely do not want to be on the receiving end of one, and if you are,
    you had best have a very strong incident response plan in place.

    '
  trans: '


    # ENISA 威胁态势报告


    欧洲联盟网络与信息安全局（ENISA）每年都会发布一份名为“ENISA 威胁态势报告”的报告。2016 年报告（于 2017 年 1 月发布，题为 *ENISA
    Threat Landscape Report 2016—15 Top Cyber‐Threats and Trends*）列出了以下威胁主体。为求全面，我添加了动机摘要（即他们这样做的可能原因）。您需要查看此列表，以了解哪些威胁主体最可能适用于您的业务环境。


    ## 威胁主体


    ### 1. 网络罪犯


    **动机：** 简单明了，“给我看钱”。


    ### 2. 内部人员（如员工）


    **动机：** 金钱和报复，不分先后顺序。


    ### 3. 国家


    **动机：** 网络战或知识产权窃取、竞争情报收集等。


    ### 4. 企业


    **动机：** 网络企业战或知识产权窃取、竞争情报收集等。


    ### 5. 黑客活动家


    **动机：** 各种形式的行动主义，通常但并不总是出于利他动机（言论自由、反抗不公等）。


    ### 6. 网络战士


    **动机：** 受国家动机驱使的“爱国者”，如也门和伊朗网络军。


    ### 7. 网络恐怖分子


    **动机：** 制造恐惧、混乱。换个名字依然是恐怖分子。


    ### 8. 脚本小子


    **动机：** 年轻人“为寻乐而黑客”并制造混乱，无论是否故意。


    ## 影响威胁主体的关键趋势


    得益于各种加速发展的趋势，上述威胁主体在当今的技术环境中蓬勃发展。ENISA 指出了影响威胁主体活动的四大关键趋势，这些趋势至今仍然成立：


    ### 1. 网络犯罪的消费化


    正如劳氏和家得宝让家庭装修普及到大众一样，新工具使网络犯罪广泛易得。有许多 DIY 黑客工具包可供购买甚至免费下载。雇佣黑客攻击目标也相当容易。更糟的是：网络罪犯也有特许经营机会和联盟计划，以及令人兴奋的新商业渠道，如“勒索软件即服务”，您只需极少的前期投入，就能获得定制的勒索软件工具包，并按敲诈利润的一定比例分成。对所有参与者来说都是财务上的双赢，当然，除非您是受害者之一。所有这些导致了：


    ### 2. 技术新手的低准入门槛


    如果您有动力，可以轻松开启网络罪犯生涯。有提供培训的“黑客大学”，购买一些现成的黑客工具包甚至还能获得专家技术支持！


    ### 3. 暗网的神秘感


    暗网现在就像 1990 年代的互联网。它被认为只被危险的极客使用，普通用户被劝阻不要窥探。此外，必须通过一整套技术障碍才能获得访问权限，这进一步使暗网成为网络罪犯的绝佳藏身之处。


    ### 4. 低归因率


    实际上无法逮捕网络罪犯。即使发生重大网络事件（无论是商业还是间谍性质），也无法做出有意义的归因，实际上也没有逮捕行动。这使得成为一名网络罪犯成为一份低风险/高回报的工作。


    威胁、威胁主体和趋势。如何从这些推导到黑客？黑客就是威胁主体吗？黑客就是网络罪犯吗？事实截然相反！


    ## 黑客的本质


    回溯互联网还是网络“狂野西部”时期，*黑客* 一词并非贬义——恰恰相反，它是一个尊称。我们所知的互联网是由那些自豪地自称黑客的人创建的，因为 *黑客* 指的是任何擅长构建、探索和扩展各类系统能力的人。


    邪恶的、坏人黑客真正应该被称为小偷、破坏者、罪犯、十恶不赦之徒等。不幸的是，好黑客与坏黑客的区别从未被大众接受，如今 *黑客* 一词通常不再是褒义。但并非所有黑客都一样：他们之间的差异可能是天壤之别、黑白分明、绝地武士对西斯尊主，或您所能想到的任何根本对立的力量。


    从历史角度看，所有黑客 *确实* 有一个共同点：极高的技术水平。黑客探索可编程系统的细节，并设法发挥其极限能力。这一点非常重要，因为所涉及的技能绝非微不足道。它需要天赋与无尽的学习、竞争和实践相结合。所有伟大的黑客，无论站在哪一边——黑夜或白昼、善或恶、黑帽或白帽——都拥有这些来之不易的特质。您可能不会惊讶地得知，许多老派黑客已被招募（或自愿）去解决世界上一些最棘手的问题，如治愈疾病、分发疫苗或开发下一代安全核反应堆。


    此外，黑客往往拥有非常强的自尊心，通常不吝展示他们的技能。了解一些黑客的性格有助于为您的网络安全计划设定背景，以及——重要的是——您如何就此进行沟通。


    例如，因为您每天去健身房而认为自己身体健康，这与认为自己是奥运级运动员是两码事。同样，致力于保护资产免受网络攻击，与试图通过吹嘘坚不可摧的防御来挑衅黑客，也是截然不同的。如果您这样做，后果自负。考虑到黑客的性格，低估他们是愚蠢的，挑战他们则更加愚蠢。


    ## 攻击过程


    了解了黑客心理后，我们现在可以讨论网络攻击的实际过程。它是如何展开的，包含什么，您能做什么？


    请记住，从本质上讲，网络攻击代表威胁主体针对您的资产采取的行动。所有网络攻击都具有特定属性，并通常遵循一个通用过程，即它们自己的网络战计划。


    网络攻击通过 *攻击向量* 展开。这是攻击者为攻陷您的资产所采取的路径。虽然大多数攻击向量指向内部（入站），针对系统和资产，但也有指向外部（出站）的攻击。这些向外的攻击侧重于窃取数据和资产的方式，而非获取访问权限并潜在破坏数据。


    在攻击向量上承载的是 *攻击载荷*。可将其视为一个容器（如炸弹的外壳），用于投送利用漏洞（炸药）的漏洞利用代码，使目标暴露在攻击者面前。载荷类型繁多，本质上都是恶意编程代码片段，通常包裹在一层无害的编程代码中，旨在欺骗您的防御。有一整门科学专门用于分析和研究载荷，远超出本书范围，但足以说明载荷可以非常复杂，同时也非常精巧。


    ## 攻击类型


    网络攻击有无数种分类。以下是一些主要术语，也是网络安全讨论中最常用、最常听到的词汇。


    *   **高级持续性威胁（APT）：** APT 言出必行，行出必果——它是针对目标的协同、持续、弹性、自适应攻击。APT 主要用于窃取数据。其研究、规划、协调和执行可能耗时很长，但一旦成功，往往造成毁灭性后果。您绝不想成为其目标，如果不幸中招，最好已制定非常强有力的事件响应计划。


    '
