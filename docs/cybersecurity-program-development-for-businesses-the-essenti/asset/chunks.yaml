- raw: "*   *Regulatory developments*. These are typically legislative actions affecting\
    \ cybersecurity implementation, and they can range from compulsory to strongly\
    \ suggested. You certainly need to know about them—ideally, long before they're\
    \ enacted—and plan accordingly. Moreover, you need to know about them everywhere\
    \ in the world that you do business in. (See, for example, the European Union\
    \ General Data Protection Regulation in [Chapter 10](#c10.xhtml).) You should\
    \ expect regulatory actions at every level: city, state, and country. Whether\
    \ your board, or whoever accepts risk in your company, chooses to comply is another\
    \ matter. Yes, noncompliance is an option. Remember: If the cost of a control\
    \ is higher than the asset it is meant to protect, then it doesn't make sense\
    \ to implement it. Therefore, if implementing a regulation is going to cost the\
    \ company so much money and time as to not be worthwhile when compared to the\
    \ fine, then it may make sense to pay the fine. To be clear: I am not advocating\
    \ that you take this position; but I would be remiss not to alert you to it!\n\
    \n    How do you get to find out about all these possible exciting developments?\
    \ Typically, your industry‐specific publication keeps track and reports on legislative\
    \ developments that may affect you. That said, there is no substitute for staying\
    \ informed about what your government representatives are doing. Get involved\
    \ and stay involved. Start with a reputable major daily newspaper, and graduate\
    \ to picking up the phone and calling your representative with any questions you\
    \ may have. After all, it's your business we're talking about here.\n\n*   *Information\
    \ technology and computer science developments*. These developments are many,\
    \ constant, and far‐reaching. We're not talking business disruption here. We're\
    \ talking life‐changing discoveries and developments that will forever change\
    \ the way we work, think, communicate, learn, influence, and behave. Aside from\
    \ Moore's law that, in essence, predicted the doubling of computing power every\
    \ couple of years, there have been breakthroughs in artificial intelligence, machine\
    \ learning, pattern analysis (think big data), blockchain technologies, and the\
    \ integration of computing and communications capabilities into everything from\
    \ a toaster oven to a pacemaker. Why do you need to know about this? Because,\
    \ as we've discussed, these things will dramatically influence your workplace,\
    \ and since you're the one sensitized to the cybersecurity implications, you also\
    \ get to be the one who needs to get in front of these developments and—at least—think\
    \ about their potential impact to your program, if not your life. How can you\
    \ stay informed on these changes? At a minimum, I would recommend subscribing\
    \ to MIT's *Technology Review,* the *Harvard Business Review,* and at least one\
    \ industry‐specific publication. Are there any other publications that are reliable\
    \ sources of this type information? Absolutely, and by all means, subscribe to\
    \ them all! The important thing here is for you to stay continuously informed.\n\
    \nI will close this chapter with a look at what I consider to be *the* emerging\
    \ technologies and trends that you need to be aware of for the next couple of\
    \ years. I believe that each one will have a significant impact on how we understand\
    \ cybersecurity needs, how we implement cybersecurity, and how we can safely interact\
    \ with this increasingly cyberenabled world.\n\n## General Data Protection Regulation\
    \ (GDPR), Privacy, and Regulators\n\nWe discussed GDPR at some length in [Chapter\
    \ 10](#c10.xhtml). It is worth your review, again. For that matter, it's best\
    \ reviewed with a good friend, such as your legal department.\n\nWhat we need\
    \ to be sensitive about is that GDPR really is: a significant, international,\
    \ far‐reaching, cybersecurity regulation. I predict that it is just the beginning\
    \ in what will be a long battle: various government regulations versus the inexorable\
    \ advance of information technologies that push against a wall of real and perceived\
    \ privacy rights.\n\nThere are many questions we need to ask: Why did the European\
    \ Union even need to create such a strict data protection law? Does privacy need\
    \ to be regulated? Better yet, what is privacy in the information age? That last\
    \ one can take a whole book by itself, and it's one I plan to write, so for now,\
    \ let's just stick with some basics:\n\nThe question of “Why, oh why, did the\
    \ EU do such a thing?” is simple. According to their own statement:\n\n> *The\
    \ EU General Data Protection Regulation (GDPR)…was designed to harmonize data\
    \ privacy laws across Europe, to protect and empower all EU citizens' data privacy\
    \ and to reshape the way organizations across the region approach data privacy.*\n\
    \nAccording to the American point of view, it is because they wanted to punish,\
    \ or curtail and control the monopolistic behavior of the U.S. technology giants\
    \ and their cavalier attitude toward privacy, marketing, and advertising. There\
    \ were, and are, many in the EU who feel that by their practices and sheer size\
    \ alone, the U.S. tech firms squeeze out the European competition. The most recent\
    \ example of this kind of thinking is the €2.42 billion (about $2.7 billion) fine\
    \ imposed by the EU on Google in an antitrust case over search.\n\nAll that aside,\
    \ and going back to privacy, we're faced with no clear‐cut, worldwide accepted\
    \ definition of the word *privacy*. As a matter of fact, in several languages\
    \ *privacy* doesn't even exist as a stand‐alone concept: In Greek, for example,\
    \ it is loosely, and poorly, translated as *secrecy*.\n\nThen, there is the matter\
    \ of the right to privacy. How you can discuss a right to something you can hardly\
    \ define is mindboggling, but that hasn't stopped many a legislator from attempting\
    \ it. The right to privacy, as locally defined by various countries, has therefore\
    \ been introduced in a variety of documents from constitutions to bills. In the\
    \ United States, for example, there is no constitutional guarantee to privacy.\
    \ There is an *implication* of it in several parts of the Bill of Rights, but\
    \ how far that privacy actually extends is open to debate. The Italians, on the\
    \ other hand, are very serious about the matter and there is a right to privacy\
    \ spelled out in their constitution.\n\nSomehow, among all the definitions, codifications,\
    \ and laws, we have to conduct business, exchange information, enforce laws, and\
    \ treat each other's concept of privacy with a modicum of respect. Toward that\
    \ end there have been many ongoing attempts to somehow frame the concept of privacy\
    \ as a human right. This, of course, is far from trivial, with cultural, ethical,\
    \ legal, and commercial interests fiercely competing for recognition of their\
    \ definition of this elusive privacy.\n\nWhy do you care about all this, and how\
    \ does this affect your cybersecurity program? You care because legislators of\
    \ countries where you do business are not waiting on consensus definitions of\
    \ terms. They write laws, and you're expected to comply, which brings us right\
    \ back to the GDPR.\n\n“But,” you'll exclaim, “I don't do business with the EU.”\
    \ Be that as it may, even if you don't do business with them now, you may do business\
    \ with an EU partner, vendor, or client tomorrow. If and when that happens, you\
    \ will need to comply.\n\nAnd even if you argue that this will never, ever, ever\
    \ happen, I regret to inform you that this still doesn't let you off the hook.\
    \ Many states plan to adopt a GDPR‐like regulation to protect and serve their\
    \ citizens. And, that's before the federal government makes its say in the matter."
