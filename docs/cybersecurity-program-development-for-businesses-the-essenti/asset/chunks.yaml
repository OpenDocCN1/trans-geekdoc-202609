    \ it has already bypassed your perimeter defense. The attacker is already in the\
    \ system, and needs only to bypass the internal controls in order to wreak havoc!\
    \ Internal attackers also know where all the bodies are hidden: in other words,\
    \ what's of value and what's not. Who are these internal threats? What makes them\
    \ so dangerous?\n\n### Internal Threats\n\nThere is no typical profile for internal\
    \ threat actors except that they have the *means,* the *motive,* and the *opportunity*.\
    \ They can be employees, either full‐time or part‐time. They can be contractors.\
    \ They may be vendors that require temporary access to your system (e.g., a telephone\
    \ system vendor). And, God help you if they are “power users” or some sort of\
    \ “administrators” of systems. Anyone who has access, whether onsite or remote,\
    \ presents the possibility of an internal threat.\n\nTheir means can be many.\
    \ They can physically exfiltrate the data by removing printouts of sensitive information,\
    \ even taking pictures of screens with their mobile phones. If they have the right\
    \ (or wrong!) privileges, they can copy data onto USB drives or transmit data\
    \ to cloud storage. There have even been cases in which “administrators” removed\
    \ terabytes of data on removable hard disks!\n\nMotives are equally varied. Internal\
    \ threats are usually motivated by the same things that motivate external actors,\
    \ only internal threats have easier access to your systems. Many are motivated\
    \ by money. Indeed, they may have a pressing need for money for any number of\
    \ reasons (e.g., family emergency, debt, drugs, etc.). Others may be motivated\
    \ by ideology (e.g., a disagreement of company or state policies, a sense of right\
    \ versus wrong, self‐righteousness, etc.). Others still may be motivated by personal\
    \ reasons (e.g., disgruntled employees, various psychopathologies, just “the thrill\
    \ of it,” etc.). They may be recruited by the competition, a nation‐state, or\
    \ any other organization. Or they themselves may be the victims of a crime, such\
    \ as blackmail. No matter what the motive, they will always find a way to rationalize\
    \ their actions—be it to save the world, to save a loved one, to save themselves,\
    \ or because “they deserve it.”"
