    2 being “optional,” 3 for “essential,” and 4 for “mission critical.” These are
    applicable across the spectrum, from business units to assets, and you need to
    be as objective as possible when assigning them. Not all assets are critical.
    They may all be *valuable,* but that doesn''t make them critical. You may be able
