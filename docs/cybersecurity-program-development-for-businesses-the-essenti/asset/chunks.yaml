- raw: "What I have found to be most effective in dealing with any stakeholder—be\
    \ it the board of directors, the executive team, or the staff—is to stay on message.\
    \ Be pragmatic about the threat as opposed to dramatic. Be equal parts diagnosis\
    \ and equal parts prognosis. Be realistic, and always focus on the recipient,\
    \ and their ability to process the information. Channel Peter Drucker:\n\n> *It\
    \ is the recipient who communicates. The so‐called communicator, the person who\
    \ emits the communication, does not communicate. He utters. Unless there is someone\
    \ who hears, there is no communication. There is only noise!*\n\n> \n\n> Peter\
    \ Drucker, *Management: Tasks, Responsibilities, and Practices*, New York: Harper\
    \ & Row, 1973, p. 483.\n\n## The Right Message, Delivered the Right Way\n\nBack\
    \ in 1951, Professor Carl I. Hovland and Walter Weiss of Yale University delivered\
    \ a great paper, “The Influence of Source Credibility on Communication Effectiveness.”\
    \ It is in that paper that we learn that subjects, at the time of information\
    \ exposure, discounted material from “untrustworthy sources.” The problem is that\
    \ with time, the same subjects tended to disassociate the content and the source,\
    \ resulting in the acceptance of…Fake News! As a matter of fact, Hovland and Weiss\
    \ discovered that “lies, in fact, seemed to be remembered better than truths.”\n\
    \nAs fascinating as this is, even more interesting is what happens with the retention\
    \ of the message, depending on the source, over time. They discovered that although\
    \ a message from a highly credible source had a higher percentage chance of being\
    \ initially accepted, its acceptance dropped substantially over time (as short\
    \ as four weeks). They also discovered that the reverse is equally true. A message\
    \ from an untrustworthy source had an initially smaller chance of being accepted,\
    \ but over the same amount of time, its chances increased, eventually exceeding\
    \ that of the trustworthy source.\n\nWhy is all this important to our cybersecurity\
    \ program's success? Because the messenger matters just as much as the message.\
    \ And because you may have to dislodge false, entrenched beliefs from people whose\
    \ cooperation is essential to the program's success.\n\nFor example, if your CFO\
    \ is absolutely convinced that there is no way that your company is on any hacker's\
    \ radar, you'll have a very hard time trying to get funding for the cybersecurity\
    \ program. You will need to shift the CFO's attitude, and to do this you'll need\
    \ to use language and tools that she, and she alone, can understand. This needs\
    \ to be a very individualized communication, with a specifically tailored message,\
    \ delivered by the right messenger.\n\nHere's the vital point: Sometimes, the\
    \ messenger cannot be you. If everyone in the company knows you're the one pushing\
    \ for the adoption of a cybersecurity program, the staff may feel that you're\
    \ coming to the table with a specific point of view, trying to shove a program\
    \ down their throats. Your goal of adoption may be best served by using an ally\
    \ as the messenger. Pick a well‐liked manager, or the business team members who\
    \ have helped you along the way, or even independent consultants as your authoritative\
    \ messengers. Stay focused on message adoption, not the messenger.\n\nFor a message\
    \ to be adopted, it must have certain qualities. Those include being:\n\n*   *Succinct*.\
    \ If your message is more than a few sentences, it's too long. Edit it down to\
    \ your specific point. One point per message. Don't ramble.\n\n*   *Specific*.\
    \ The message needs to be as specific as possible and it should obey the communications\
    \ principle of who will do what by when. (If you need more on that, look no further\
    \ than the book by Tom Hanson and Birgit Zacher Hanson titled *Who Will Do What\
    \ By When? How to Improve Performance, Accountability and Trust with Integrity*).\n\
    \n*   *Meaningful*. Why does this message make sense to the recipients? How is\
    \ it pertinent to their work life?\n\n*   *Authoritative*. What's the associated\
    \ authority issuing the message? In other words, why should we listen to you?\n\
    \n*   *Doable*. At the end of the day, your message must reflect a call to action\
    \ that can be achieved. It cannot be aspirational or shoot for the stars. It has\
    \ to be achievable by the message recipient in a reasonable amount of time and\
    \ through reasonable effort.\n\nBy understanding your audience and understanding\
    \ both the power *and* the limitations of your message, you can frame your internal\
    \ communications accordingly. More importantly, you can use this information to\
    \ tailor your cybersecurity‐awareness training to the specific strengths, weaknesses,\
    \ and culture of your company.\n\n## Cybersecurity‐Awareness Training\n\nJust\
    \ as no two cybersecurity programs are exactly alike, so it is with cybersecurity‐awareness\
    \ training programs. There are common elements, of course, and we'll examine them\
    \ further on in this chapter. But you should never lose touch with the individuality\
    \ of your company's culture and the specific needs of your people.\n\nFor any\
    \ cybersecurity program to succeed, no matter its scope and delivery method, you\
    \ must secure the vocal participation of your leadership team. They need to advocate\
    \ for it, they need to participate in it, and they need to evangelize their middle\
    \ managers on the importance of it.\n\nThere are several ways you can conduct\
    \ cybersecurity‐awareness training. Your choice will depend on the size of the\
    \ organization, the level of existing awareness of the topic, and your risk and\
    \ threat assessments. Speaking of assessments, an excellent way to establish a\
    \ training baseline is by doing a skills assessment on cybersecurity. This could\
    \ be as easy as a fun quiz, or even an interactive game that you can push out\
    \ to everyone's computer. The results will be instrumental in designing the training.\n\
    \nOnce that's done, you need to decide which training strategy is appropriate\
    \ to your audience. Is it going to be a trainer‐led program or a learner‐led one?\
    \ In the first case, the trainer is in control. He or she presents the material,\
    \ the learners participate to the degree that the trainer allows, and they may\
    \ be subsequently tested. In the learner‐led approach, the learner is in control,\
    \ the training material is consumed asynchronously (people learn as they want\
    \ and when they want), and the trainer's role becomes that of a facilitator and\
    \ guide as the learners navigate the material at their own pace and share their\
    \ experiences.\n\nIn some cases, the strategy is dictated by the size and geography\
    \ of the company. For example, it will be very difficult to have an instructor‐led\
    \ workshop for a company with a few hundred employees distributed all over the\
    \ country. Similarly, an intimate “lunch and learn” may be all your company needs\
    \ to start on the cybersecurity awareness path.\n\nOnce you have identified the\
    \ needs and arrived at a training strategy, the next step is to pick the best\
    \ way to deliver the information. Your choices include:\n\n*   *Presentations*.\
    \ Whenever I do a presentation, my second slide is a famous *New Yorker* cartoon\
    \ by Alex Gregory. In it, the devil is interviewing a torturer, and says, “I am\
    \ looking for someone well versed in the art of torture—do you know PowerPoint?”\
    \ The point is well taken. You can certainly use presentations to deliver cybersecurity\
    \ awareness training, but be certain to be as engaging and inclusive during the\
    \ training as possible. Otherwise, you run the risk of the glazed, sleepy‐eyed,\
    \ disengaged audience. My recommendation is to use presentations for what they\
    \ are good for: Deliver specific guidance to a specific targeted audience. Keep\
    \ them short. Keep them to the point. And be sure to keep them interactive."
  fmt: "\n# What I have found to be most effective in dealing with any stakeholder—be\
    \ it the board of directors, the executive team, or the staff—is to stay on message.\
    \ Be pragmatic about the threat as opposed to dramatic. Be equal parts diagnosis\
    \ and equal parts prognosis. Be realistic, and always focus on the recipient,\
    \ and their ability to process the information. Channel Peter Drucker:\n\n> *It\
    \ is the recipient who communicates. The so‐called communicator, the person who\
    \ emits the communication, does not communicate. He utters. Unless there is someone\
    \ who hears, there is no communication. There is only noise!*\n\n> \n\n> Peter\
    \ Drucker, *Management: Tasks, Responsibilities, and Practices*, New York: Harper\
    \ & Row, 1973, p. 483.\n\n## The Right Message, Delivered the Right Way\n\nBack\
    \ in 1951, Professor Carl I. Hovland and Walter Weiss of Yale University delivered\
    \ a great paper, “The Influence of Source Credibility on Communication Effectiveness.”\
    \ It is in that paper that we learn that subjects, at the time of information\
    \ exposure, discounted material from “untrustworthy sources.” The problem is that\
    \ with time, the same subjects tended to disassociate the content and the source,\
    \ resulting in the acceptance of…Fake News! As a matter of fact, Hovland and Weiss\
    \ discovered that “lies, in fact, seemed to be remembered better than truths.”\n\
    \nAs fascinating as this is, even more interesting is what happens with the retention\
    \ of the message, depending on the source, over time. They discovered that although\
    \ a message from a highly credible source had a higher percentage chance of being\
    \ initially accepted, its acceptance dropped substantially over time (as short\
    \ as four weeks). They also discovered that the reverse is equally true. A message\
    \ from an untrustworthy source had an initially smaller chance of being accepted,\
    \ but over the same amount of time, its chances increased, eventually exceeding\
    \ that of the trustworthy source.\n\nWhy is all this important to our cybersecurity\
    \ program's success? Because the messenger matters just as much as the message.\
    \ And because you may have to dislodge false, entrenched beliefs from people whose\
    \ cooperation is essential to the program's success.\n\nFor example, if your CFO\
    \ is absolutely convinced that there is no way that your company is on any hacker's\
    \ radar, you'll have a very hard time trying to get funding for the cybersecurity\
    \ program. You will need to shift the CFO's attitude, and to do this you'll need\
    \ to use language and tools that she, and she alone, can understand. This needs\
    \ to be a very individualized communication, with a specifically tailored message,\
    \ delivered by the right messenger.\n\nHere's the vital point: Sometimes, the\
    \ messenger cannot be you. If everyone in the company knows you're the one pushing\
    \ for the adoption of a cybersecurity program, the staff may feel that you're\
    \ coming to the table with a specific point of view, trying to shove a program\
    \ down their throats. Your goal of adoption may be best served by using an ally\
    \ as the messenger. Pick a well‐liked manager, or the business team members who\
    \ have helped you along the way, or even independent consultants as your authoritative\
    \ messengers. Stay focused on message adoption, not the messenger.\n\nFor a message\
    \ to be adopted, it must have certain qualities. Those include being:\n\n*   *Succinct*.\
    \ If your message is more than a few sentences, it's too long. Edit it down to\
    \ your specific point. One point per message. Don't ramble.\n\n*   *Specific*.\
    \ The message needs to be as specific as possible and it should obey the communications\
    \ principle of who will do what by when. (If you need more on that, look no further\
    \ than the book by Tom Hanson and Birgit Zacher Hanson titled *Who Will Do What\
    \ By When? How to Improve Performance, Accountability and Trust with Integrity*).\n\
    \n*   *Meaningful*. Why does this message make sense to the recipients? How is\
    \ it pertinent to their work life?\n\n*   *Authoritative*. What's the associated\
    \ authority issuing the message? In other words, why should we listen to you?\n\
    \n*   *Doable*. At the end of the day, your message must reflect a call to action\
    \ that can be achieved. It cannot be aspirational or shoot for the stars. It has\
    \ to be achievable by the message recipient in a reasonable amount of time and\
    \ through reasonable effort.\n\nBy understanding your audience and understanding\
    \ both the power *and* the limitations of your message, you can frame your internal\
    \ communications accordingly. More importantly, you can use this information to\
    \ tailor your cybersecurity‐awareness training to the specific strengths, weaknesses,\
    \ and culture of your company.\n\n## Cybersecurity‐Awareness Training\n\nJust\
    \ as no two cybersecurity programs are exactly alike, so it is with cybersecurity‐awareness\
    \ training programs. There are common elements, of course, and we'll examine them\
    \ further on in this chapter. But you should never lose touch with the individuality\
    \ of your company's culture and the specific needs of your people.\n\nFor any\
    \ cybersecurity program to succeed, no matter its scope and delivery method, you\
    \ must secure the vocal participation of your leadership team. They need to advocate\
    \ for it, they need to participate in it, and they need to evangelize their middle\
    \ managers on the importance of it.\n\nThere are several ways you can conduct\
    \ cybersecurity‐awareness training. Your choice will depend on the size of the\
    \ organization, the level of existing awareness of the topic, and your risk and\
    \ threat assessments. Speaking of assessments, an excellent way to establish a\
    \ training baseline is by doing a skills assessment on cybersecurity. This could\
    \ be as easy as a fun quiz, or even an interactive game that you can push out\
    \ to everyone's computer. The results will be instrumental in designing the training.\n\
    \nOnce that's done, you need to decide which training strategy is appropriate\
    \ to your audience. Is it going to be a trainer‐led program or a learner‐led one?\
    \ In the first case, the trainer is in control. He or she presents the material,\
    \ the learners participate to the degree that the trainer allows, and they may\
    \ be subsequently tested. In the learner‐led approach, the learner is in control,\
    \ the training material is consumed asynchronously (people learn as they want\
    \ and when they want), and the trainer's role becomes that of a facilitator and\
    \ guide as the learners navigate the material at their own pace and share their\
    \ experiences.\n\nIn some cases, the strategy is dictated by the size and geography\
    \ of the company. For example, it will be very difficult to have an instructor‐led\
    \ workshop for a company with a few hundred employees distributed all over the\
    \ country. Similarly, an intimate “lunch and learn” may be all your company needs\
    \ to start on the cybersecurity awareness path.\n\nOnce you have identified the\
    \ needs and arrived at a training strategy, the next step is to pick the best\
    \ way to deliver the information. Your choices include:\n\n*   *Presentations*.\
    \ Whenever I do a presentation, my second slide is a famous *New Yorker* cartoon\
    \ by Alex Gregory. In it, the devil is interviewing a torturer, and says, “I am\
    \ looking for someone well versed in the art of torture—do you know PowerPoint?”\
    \ The point is well taken. You can certainly use presentations to deliver cybersecurity\
    \ awareness training, but be certain to be as engaging and inclusive during the\
    \ training as possible. Otherwise, you run the risk of the glazed, sleepy‐eyed,\
    \ disengaged audience. My recommendation is to use presentations for what they\
    \ are good for: Deliver specific guidance to a specific targeted audience. Keep\
    \ them short. Keep them to the point. And be sure to keep them interactive.\n"
  trans: "\n# 我发现应对任何利益相关者最有效的方法——无论是董事会、高管团队还是员工——都是坚持核心信息。要实事求是地看待威胁，而非危言耸听。诊断与预测各占一半。要切合实际，始终关注接收者及其处理信息的能力。借用彼得·德鲁克的话：\n\
    \n> *沟通的是接收者。所谓的沟通者，即发出沟通内容的人，并不沟通。他只是发声。除非有人倾听，否则就没有沟通，只有噪音！*\n\n> \n\n> 彼得·德鲁克，《管理：任务、责任、实务》，纽约：哈珀罗出版社，1973\
    \ 年，第 483 页。\n\n## 正确的信息，正确的传递方式\n\n早在 1951 年，耶鲁大学的卡尔·I·霍夫兰教授和沃尔特·韦斯发表了一篇重要论文《信源可信度对沟通效果的影响》。正是在这篇论文中，我们了解到受试者在接触信息时，会对来自“不可信来源”的材料打折扣。问题在于，随着时间的推移，这些受试者倾向于将内容与来源分离，从而导致……接受假新闻！事实上，霍夫兰和韦斯发现“谎言似乎比真理记得更牢”。\n\
    \n这很有趣，但更有趣的是：随着时间的推移，根据信源不同，信息的保留情况会发生什么变化。他们发现，虽然来自高可信度来源的信息最初被接受的百分比较高，但其接受度会随着时间的推移大幅下降（短至四周）。他们还发现，相反的情况同样成立。来自不可信来源的信息最初被接受的几率较小，但在同等时间内，其几率会增加，最终超过可信来源。\n\
    \n为什么这对我们网络安全项目的成功如此重要？因为信使与信息同等重要。而且因为你可能不得不从那些对项目成功至关重要的人身上，拔除根深蒂固的错误观念。\n\n\
    例如，如果你的首席财务官（CFO）坚信贵公司绝不可能进入任何黑客的视线范围，你将很难为网络安全项目争取到资金。你需要改变 CFO 的态度，为此你必须使用她——且仅她——能理解的语言和工具。这需要是一种高度个性化的沟通，带有专门定制的信息，由正确的信使传递。\n\
    \n关键点在于：有时，信使不能是你。如果公司里所有人都知道是你在推动网络安全项目的采纳，员工可能会觉得你带着特定立场来谈判，试图强行把项目塞给他们。你的采纳目标可能最好由一位盟友作为信来服务。挑选一位受欢迎的经理、曾帮助过你的业务团队成员，甚至独立顾问作为你的权威信使。专注于信息的采纳，而非信使本身。\n\
    \n要让信息被采纳，必须具备某些特质。这些特质包括：\n\n*   *简练*。如果你的信息超过几句话，就太长了。将其精简到你的具体观点。一条信息只讲一个观点。不要啰嗦。\n\
    \n*   *具体*。信息需要尽可能具体，并应遵循“谁在何时做什么”的沟通原则。（如果你需要更多这方面的内容，请参考汤姆·汉森和比吉特·扎彻·汉森合著的《谁在何时做什么？如何以诚信提升绩效、问责与信任》一书）。\n\
    \n*   *有意义*。为什么这条信息对接收者讲得通？它与他们的工作生活有何关联？\n\n*   *权威*。发布该信息的相关权威是什么？换句话说，为什么我们要听你的？\n\
    \n*   *可行*。归根结底，你的信息必须反映一个可实现的行动号召。它不能只是愿景或好高骛远。它必须是接收者能在合理时间内、通过合理努力达成的。\n\n\
    通过了解你的受众，并理解你信息的力量*与*局限，你可以相应地构建内部沟通。更重要的是，你可以利用这些信息，根据公司的特定优势、劣势和文化，量身定制你的网络安全意识培训。\n\
    \n## 网络安全意识培训\n\n正如没有两个完全相同的网络安全项目一样，网络安全意识培训项目也是如此。当然存在共同要素，我们将在本章后面进一步探讨。但你永远不应忽视公司文化的独特性以及员工的具体需求。\n\
    \n无论网络安全项目的范围和交付方式如何，要想成功，你必须确保领导团队的积极参与。他们需要为其发声、亲身参与，并向中层管理者传播其重要性。\n\n开展网络安全意识培训有多种方式。你的选择将取决于组织规模、现有的主题认知水平，以及你的风险和威胁评估。说到评估，建立培训基线的一个绝佳方法是进行网络安全技能评估。这可以简单到一个趣味测验，甚至是一个可推送到每个人电脑上的互动游戏。结果将对设计培训起到关键作用。\n\
    \n完成评估后，你需要决定哪种培训策略适合你的受众。是讲师主导型还是学习者主导型？前者由讲师掌控：讲师呈现材料，学习者按讲师允许的程度参与，随后可能接受测试。在学习者主导型方法中，学习者掌控全局，培训材料异步消费（人们想学时学、想学什么学什么），讲师的角色转变为引导者和指导者，帮助学习者按自己的节奏浏览材料并分享经验。\n\
    \n在某些情况下，策略由公司规模和地域分布决定。例如，对于员工分布在全国各地的几百人公司，举办讲师主导的研讨会将非常困难。同样，一个亲密的“午餐学习会”可能就是你公司开启网络安全意识之路所需的一切。\n\
    \n一旦确定了需求并确定了培训策略，下一步就是挑选最佳的信息传递方式。你的选择包括：\n\n*   *演示文稿*。每当我做演示时，第二张幻灯片都是亚历克斯·格雷戈里的一幅著名《纽约客》漫画。画中魔鬼正在面试一名拷打者，说道：“我正在寻找一位精通拷打艺术的人——你会用\
    \ PowerPoint 吗？”这讽刺入骨。你当然可以用演示文稿来开展网络安全意识培训，但务必在培训过程中尽可能引人入胜且包容互动。否则，你将面对眼神呆滞、昏昏欲睡、脱离状态的听众。我的建议是将演示文稿用在其擅长的领域：向特定目标受众提供具体指导。保持简短。切中要害。并确保互动性。\n\
    \n"
