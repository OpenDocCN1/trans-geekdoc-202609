- raw: 'Studying risk is taking a trip down a fascinating, complex, and intricate
    labyrinth. It is hard‐core science—involving complex mathematics, ethics, and
    philosophy—with potential life‐and‐death implications (e.g., the risk of reprisals
    when we attack a terrorist group, the risks that first responders take every day,
    etc.). This is certainly not a book to start you on this type of journey, although
    I have included a selected bibliography for you to consider at the back of this
    book. The purpose of this book is to expose you to some risk management and tech
    concepts so that we can develop a common language when discussing how to protect
    your things of value from cyber‐based threats. With that in mind, let''s start
    with a simple definition. What is risk?


    *Risk is the combination of the likelihood of an event and its impact*.


    What''s the risk of a hurricane in Miami?


    Well…how likely is it, and what will its impact be when it hits?


    Why do you need know this? Because, for starters, the answer determines whether
    you want to move there, if you want to start a business there, if you want to
    send your kids to school there, and how much your insurance will cost you to protect
    you from this risk, and so on.


    How can you determine the likelihood that a hurricane will strike Miami? You have
    tons and tons of statistical data that give you a good sense of the frequency
    of hurricanes hitting the area over the past couple of hundred years.


    What''s the impact? There is the cost of rebuilding, the cost of business losses,
    environmental damage, and the potential of loss of life, among many others. You
    get the picture. Who is good at keeping these types of statistics? Insurance companies.
    But this alone is not the complete picture. Let''s fill in the blanks.


    First, let''s assume you have decided that you want to live in Miami. That''s
    key. That decision (like the road‐crossing example discussed earlier) implies
    some degree of risk acceptance out of the gate. You know that hurricanes strike
    Miami, yet you choose to live there. Fine. (Who am I to judge? I live in New York!)


    But you''re not simply living in Miami. Knowing that hurricanes may hit Miami,
    you have chosen to live in a “hardened” house, meaning a house that is as hurricane‐proof
    as you *choose* to make it. Before buying the house, you did your research, compared
    options, and decided to buy a house that can withstand a Category 3 hurricane.
    That was your choice. It was a very important one: You didn''t just choose any
    house. You chose to get a hardened one. This hardened option? That''s a *control*.
    Controls act against risks. Your control was to buy a house that can withstand
    a Category 3 hurricane. That *mitigates* your risk: If a Category 3 storm hits,
    you are protected.


    But what happens if a Category 4 storm hits? Well…you have to deal with that risk.


    So, how do you deal with the Category 4 risk? You call your insurance company
    and tell them that you need hurricane insurance. They quote you an outrageous
    amount, to which you respond with “Wait! I have a Category 3 hurricane‐proof home!”
    They go recheck their numbers and come back with a much more reasonable amount,
    but they tell you they will cover only Category 4 storm damage and higher. Nothing
    below. You sign on the dotted line.


    You have now *transferred the risk* of a Category 4 storm and higher to the insurance
    company. Now, you''re breathing more easily. What did you accomplish?


    First of all, you *assessed the risk* of your desire to live in Miami and decided
    that *this was worth it to you*. You *applied a control* to *mitigate this risk*
    by buying the hardened house. You then *transferred the rest of the risk* to the
    insurance company.


    Did you eliminate the risk? Nope! You can still get hurt if a tree falls on you
    during a Category 3 storm and the insurance will not pay for your medical bills.
    In other words, no matter what you do, there is always some risk that is left
    over. Always. *Risk is never zero*. This leftover risk is called *residual risk*
    and that''s the risk that you choose to accept.


    Or not.


    If you don''t accept the risk, you can do more to make it more to your liking.
    You can apply more controls. For example, you can invest in a Category 4 hurricane‐proof
    home and renegotiate with the insurance company to cover more or different kinds
    of risk. You can buy your own weather station to predict hurricanes before anyone
    else does and evacuate the area. You can build a bunker. You can do all sorts
    of things insofar as the things you do to mitigate your risk don''t exceed the
    value of what you''re trying to protect. In risk management terms: The cost of
    controls cannot exceed the value of the asset you''re trying to protect. That
    would be silly, and clearly, you''re very smart, so you wouldn''t be doing this
    anyway.


    One last thing: There are all sorts of controls. Broadly speaking, they fall into
    one of the following categories: *preventative, detective, corrective,* and *compensatory*.
    Your weather station is a detective control, the hardening of your home is a preventative
    control, and your bunker is a compensatory control. What''s the corrective control?
    The insurance inspector who comes once a year to confirm that the house remains
    hardened. (Notice that your insurance policy is not a control. It doesn''t *do*
    anything to reduce risk; it only accepts some of the risk you transfer to it.
    You''re still the one incurring the risk; it''s just that you''re not on the hook
    for the damages that may result.)


    What happens if you employ all these controls at once? Well—you risk strategist,
    you!—you just developed a *defense‐in‐depth* strategy to mitigate your risk. You
    rolled out your controls in a way that they complement one another; if the first
    fails, the next kicks in, and so on.


    Okay, now we''re talking the same risk management language. Enough for our purposes
    (secretly, we haven''t even scratched the surface of the risk management field,
    but let''s accept this and move on). But wait, you say: How does the hurricane
    example apply to my data in New York? Believe me, it does, and I''ll show you
    how. For now, just note those definitions and examples. We''ll apply them to your
    data universe shortly.


    But I need to come clean about something before we go further down the cyberpath:
    Remember all these statistics about likelihood that the insurance company had?
    How useful they were in determining risk and so forth? Well…we don''t really have
    any of those for cyberattacks. Not enough to build a very robust statistical model
    about likelihood. At least not yet.


    We certainly have a good sense of the *impact*: Your life (or your business) will
    be in shambles if someone steals your identity (or your business data), so we''re
    all pretty clear on impact. The rest, *you* are going to estimate. Notice the
    change from “we” to “you”? Excellent! I am betting that you, of all people, know
    best when it''s okay to cross the street. I trust you.


    This all makes sense when the risk is personal, right? You get to make the call
    on what risk you''re willing to accept. But what if the risk is to a business?
    The same concept applies. The people who decide whether or not to accept business
    risk can only be the owner(s) of the business. No one else. If it is a small business,
    the owner (usually the president or CEO) is responsible for accepting or rejecting
    risk. For larger firms, the board of directors is ultimately responsible for risk
    management decisions. In the absence of a board, then it is the CEO or the executive
    appointed by the shareholder(s) to run the company. If you are not “them,” then
    you need to trust them that they are making the right decision. That''s why they
    are there. The responsibility is theirs, and theirs alone, to decide whether it
    is safe to “cross the street.” It is your responsibility to advise them one way
    or another.


    To summarize our risk definitions:


    *   *Asset*: Anything of value


    *   *Risk*: Likelihood of an event, multiplied by its impact'
  fmt: '

    # 风险研究：一场迷宫之旅


    研究风险就像进入一个迷人、复杂且错综复杂的迷宫。这是一门硬核科学——涉及复杂的数学、伦理学和哲学——并具有潜在的生死攸关的影响（例如：当我们攻击恐怖组织时面临的报复风险，第一响应者每天承担的风险等）。这当然不是一本引领你踏上此类旅程的书，尽管我在书后附上了精选书目供你参考。本书的目的是让你接触一些风险管理和技术概念，以便我们在讨论如何保护你的宝贵资产免受网络威胁时，能够建立一套通用语言。话虽如此，让我们从一个简单的定义开始。什么是风险？


    > **风险是事件发生的可能性与其影响的组合。**


    迈阿密遭遇飓风的风险有多大？


    这取决于……发生的可能性有多大？一旦登陆，影响会有多大？


    为什么你需要知道这些？因为答案决定了你是否想搬过去、是否想在那里创业、是否想送孩子去那里上学、保险费用会是多少以保护你免受这种风险，等等。


    你如何确定飓风袭击迈阿密的可能性？你拥有大量的统计数据，这些数据能让你很好地了解过去几百年里飓风袭击该地区的频率。


    影响是什么？有重建成本、业务损失成本、环境破坏以及潜在的生命损失等。你明白了。谁擅长保存这类统计数据？保险公司。但这还不是完整的图景。让我们填补空白。


    首先，假设你决定住在迈阿密。这是关键。这个决定（就像前面讨论的过马路例子）意味着你从一开始就接受了一定程度的风险。你知道飓风会袭击迈阿密，但你选择住在那里。没问题。（我是谁来评判？我住在纽约！）


    但你不仅仅是住在迈阿密。既然知道飓风可能袭击迈阿密，你选择住在一栋“加固”过的房子里，意思是这栋房子尽可能地“防飓风”，程度取决于你的*选择*。买房前，你做了调研，比较了选项，决定买一栋能抵御
    3 级飓风的房子。那是你的选择。这是一个非常重要的选择：你没有随便选一栋房子。你选择了一栋加固过的房子。这个加固选项？这就是一个*控制措施*。控制措施针对风险发挥作用。你的控制措施是购买一栋能抵御
    3 级飓风的房子。这*缓解*了你的风险：如果 3 级风暴来袭，你受到保护。


    但如果 4 级风暴来袭怎么办？好吧……你得应对那个风险。


    那么，如何应对 4 级风暴的风险？你打电话给保险公司，告诉他们你需要飓风保险。他们给出一个天价报价，你回应说：“等等！我有防 3 级飓风的房子！”他们重新核算，给出一个合理得多的价格，但告诉你他们只承保
    4 级及以上风暴的损失，3 级以下不赔。你签字画押。


    你现在已将 4 级及以上风暴的风险*转移*给了保险公司。现在，你松了一口气。你实现了什么？


    首先，你*评估了*在迈阿密生活的风险，并决定*这对你来说值得*。你*应用控制措施*购买加固房屋来*缓解风险*。然后你将*剩余风险转移*给了保险公司。


    你消除风险了吗？没有！如果在 3 级风暴中一棵树砸在你身上，保险不会赔付你的医药费。换句话说，无论你做什么，总会剩下一些风险。永远如此。*风险永远不会为零*。这种剩余风险称为*剩余风险*，那是你选择接受的风险。


    或者不接受。


    如果你不接受这个风险，你可以做更多事情让它更符合你的心意。你可以应用更多控制措施。例如，你可以投资购买防 4 级飓风的房子，并与保险公司重新谈判以承保更多或不同类型的风险。你可以买自己的气象站，比任何人都早预测飓风并撤离。你可以建掩体。你可以做各种事情，只要你为缓解风险所做的事情不超过你试图保护的东西的价值。用风险管理术语来说：**控制措施的成本不能超过你试图保护的资产的价值**。那会很愚蠢，显然你很聪明，所以不会这么做。


    最后一点：控制措施有各种类型。广义上，它们分为以下几类：*预防性、检测性、纠正性*和*补偿性*。你的气象站是检测性控制，房屋加固是预防性控制，掩体是补偿性控制。什么是纠正性控制？每年来检查一次确认房屋仍保持加固状态的保险检查员。（注意你的保险单不是控制措施。它不*做*任何事来降低风险；它只是接受你转移给它的一部分风险。你仍然是承担风险的人；只是你不必为可能产生的损失负责。）


    如果你同时采用所有这些控制措施会怎样？好吧——你这位风险策略师！——你刚刚制定了一个*纵深防御*策略来缓解风险。你以一种相互补充的方式部署控制措施；如果第一个失效，下一个生效，以此类推。


    好了，现在我们在说同一种风险管理语言。这足够满足我们的目的了（悄悄说，我们甚至还没触及风险管理领域的皮毛，但让我们接受这一点并继续前进）。但等等，你会问：飓风例子怎么应用到我在纽约的数据上？相信我，它适用，我会向你展示如何应用。现在，只需记下那些定义和例子。我们稍后会将它们应用到你的数据世界中。


    但在我们进一步深入网络安全之路之前，我需要坦白一件事：还记得保险公司拥有的所有那些关于可能性的统计数据吗？它们在确定风险等方面有多有用？好吧……对于网络攻击，我们其实没有那些数据。至少目前没有足够的数据来建立一个非常稳健的关于可能性的统计模型。


    我们当然对*影响*有很好的认识：如果有人窃取你的身份（或你的业务数据），你的生活（或你的业务）将陷入一片狼藉，所以我们对影响都很清楚。其余的，*你*来估计。注意从“我们”到“你”的转变？太棒了！我赌你，比任何人都清楚什么时候过马路是安全的。我信任你。


    当风险是个人的时候，这一切都讲得通，对吧？你可以决定接受什么风险。但如果风险是针对企业的？同样的概念适用。决定是否接受商业风险的人只能是企业的所有者。别无他人。如果是小企业，所有者（通常是总裁或
    CEO）负责接受或拒绝风险。对于大公司，董事会最终负责风险管理决策。如果没有董事会，则是 CEO 或股东任命的管理公司的高管。如果你不是“他们”，那么你需要信任他们做出正确的决定。这就是他们存在的原因。责任在他们，且仅在他们，决定是否可以安全地“过马路”。你的责任是向他们提供建议。


    总结我们的风险定义：


    *   **资产**：任何有价值的东西

    *   **风险**：事件发生的可能性乘以其影响

    '
