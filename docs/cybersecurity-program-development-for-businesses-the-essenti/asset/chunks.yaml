- raw: "That's a lot of work! For me, it feels like we've been riding a bullet train.\
    \ Have you ever stared out the window of one of those speeding trains? In the\
    \ far distance, you can see the countryside, but up close? Everything is a blur.\
    \ That's pretty much the speed we traveled in this cybersecurity program overview\
    \ chapter. You should have been left with a sense of landscape, and lots of blurry\
    \ details.\n\nWe'll get to the details one step at a time, and when we're done,\
    \ we'll discuss item 13: cybersecurity program management.\n\n# CHAPTER 6  \n\n\
    Assets\n\nWe are now getting into actually *doing* your cybersecurity program.\
    \ If the previous chapters gave you the 40,000‐foot view, the next will take you\
    \ straight down into the weeds. I've divided the doing part of the work into several\
    \ phases:\n\n1.  Assets\n\n2.  Threats\n\n3.  Vulnerabilities\n\n4.  Environments\n\
    \n5.  Controls\n\n6.  Incident‐response planning\n\n7.  People\n\n8.  Living cybersecure\n\
    \nWe will deal with each phase separately, breaking down the various steps needed\
    \ to build your cybersecurity program. We'll start with assets.\n\nIn [Chapter\
    \ 1](#c01.xhtml), we defined *assets* as *anything of value*. So, what exactly\
    \ are these things of value in your world? Always remember the basic rule: If\
    \ it is of value to you, it is of value to someone else, and it will need appropriate\
    \ care and protection.\n\nOf course, all things in context, and our context is\
    \ cybersecurity. It may well be true that your most valuable asset is a physical\
    \ product, well worth considering and protecting, but in our case, we need to\
    \ look at that physical asset from a cybersecurity perspective. We are looking\
    \ at cyberassets! Those are typically digital assets, but not always.\n\nEven\
    \ if your most important asset is a physical thing of great value, the question\
    \ to ask is: Is this asset a risk from a cyberattack? If yes, then that needs\
    \ to be considered. If not, then the thing itself won't be considered, but the\
    \ processes, data, systems, etc., that are involved in its creation still need\
    \ to be looked at very carefully.\n\nLet's consider a firm that makes a high‐end\
    \ analog watch. Each watch costs $30,000. The company lives or dies based on the\
    \ sales of this very expensive analog item, so in that sense the watch is the\
    \ firm's most important asset. From a cybersecurity perspective, however, it is\
    \ not the watch itself that is the asset, but rather, all the data relating to\
    \ the watch, such as its design, manufacturing plans, marketing strategy, etc.\
    \ If the design is stolen, then someone can replicate the exact watch and flood\
    \ the market with knockoffs, causing enormous damage to the company.\n\nSo, what\
    \ are your cyberassets of value? The category can include your company's data\
    \ and the supporting (curating and controlling) systems, processes, workflows,\
    \ and people. Other examples of cyberassets of value include all intellectual\
    \ property (designs, product information, research, etc.), personally identifiable\
    \ information, personally identifiable health information, strategic plans, financial\
    \ plans, merger and acquisition plans, tactics, etc. If in doubt whether a cyberasset\
    \ is of value, ask a few simple questions:\n\nWhat happens if this asset is destroyed?\
    \ Corrupted? Unavailable?\n\nWhat happens if it becomes public? Or, falls into\
    \ the wrong hands?\n\nIf the answer is nothing, scratch your head as to why are\
    \ you maintaining worthless cyberassets, and move on. Those assets are not worthy\
    \ of protection, much less your attention! If, on the other hand, you discover\
    \ that all sorts of things happen if the assets are exposed, then…start cataloging!\n\
    \nHow exactly do you go about doing this? What are the questions you need to answer\
    \ to have a complete picture of the value of these digital assets? First things\
    \ first: asset classification and valuation. This is a fairly existential exercise!\
    \ You will need to understand and document the true essence of your company. Depending\
    \ on size and product or service offerings, your work will range from interviewing\
    \ the executive team and the board all the way to having an honest talk with just\
    \ yourself if you're self‐employed. Your work may take you down a complex path.\
    \ One interview may lead you to dig further and interview more people at different\
    \ layers of the organization. But at the end of the day, you will have come up\
    \ with a list of valuable assets for your company.\n\n## Asset Classification\n\
    \nA good first step will be to get a grip on the total universe of our cyberassets.\
    \ What is included in our definition? Cyberassets would typically fall into one\
    \ of the following categories: data, hardware, software, systems, processes, and\
    \ workflows.\n\n### Data\n\nIt is important to differentiate between *information*\
    \ and *data*. Frequently, people use the terms interchangeably, and that's okay\
    \ for everyday use, but we should be clear on the distinction because the implications\
    \ can be significant.\n\nData, in one sense, is information that has been captured,\
    \ stored, and represented in some medium. Data is often an expression of information,\
    \ but that doesn't mean that data is a complete representation of that piece of\
    \ information. Consider a pot of boiling water. I have a sensor in the pot that\
    \ measures the temperature of the water and transmits this datum, which is stored\
    \ in my system in a field called “water temperature.” That's data! But there's\
    \ a lot beyond the number that we could notice about the actual physical event\
    \ of boiling water: the magic of phase transition from liquid to gas; the beauty\
    \ of the rising bubbles; the mathematics of turbulence of the water's surface,\
    \ and so on. That's all *information* about the boiling water…but it's not data.\n\
    \n### Hardware\n\nHardware is all the electronic equipment that stores, processes,\
    \ or transmits data. It's also the stuff that controls other stuff, such as thermostats,\
    \ and all the fun gizmos that make the Internet of Things possible. Why did I\
    \ limit myself to “electronic” just now? Okay, you got me! Computer hardware can\
    \ also be mechanical or even quantum. But unless you're Charles Babbage building\
    \ the Difference Engine or you work at an advanced computing facility, electronic\
    \ hardware is the only kind you need to worry about.\n\n### Software\n\nSoftware\
    \ is the applications—from operating systems to apps—that use hardware to get\
    \ things done. This includes, of course, software that runs in the IoT.\n\n###\
    \ Systems\n\nA system is a collection of hardware, software, and networks that\
    \ processes data. Systems can be internal or external, and they are frequently\
    \ a combination of both.\n\n### Processes and Workflows\n\nThose are the sequence\
    \ of steps involved in the creation, transformation, processing, storing, and\
    \ transmitting of data across systems. The definitions for process and workflows\
    \ can be confusing, but as far as we are concerned, processes and workflows are\
    \ assets that contribute value to the company, and as such, are worthy of careful\
    \ consideration and protection.\n\nHow exactly do you protect processes and workflows?\
    \ It depends! The first step, no matter what, is knowing about them, that is,\
    \ documenting and cataloging them. This step will reveal any dependencies on systems\
    \ that these processes and workflows may have. Your thinking about protection\
    \ starts there, and it cuts both ways: How does the process affect the system\
    \ and how does the system affect the process? We'll look at this closer when we\
    \ discuss controls. For now, keep this in the back of your mind and think about\
    \ concepts like business continuity and disaster recovery.\n\n## Asset Metadata\n\
