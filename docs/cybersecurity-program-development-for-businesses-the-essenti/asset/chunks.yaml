    \ obsolete cybersecurity and incident‐response program are just as bad as not\
    \ having any.\n\n# CHAPTER 12  \n\nPeople\n\nRemember our initial definition of\
    \ *cybersecurity? Cybersecurity is the ongoing application of best practices intended\
    \ to ensure and preserve confidentiality, integrity, and availability of digital\
    \ information as well as the safety of people and environments*.\n\nAnd, of course,\
    \ the triad from our defense‐in‐depth discussion? *People, technology,* and *operations*.\n\
    \nFinally, which is one of the most effective controls in cybersecurity? *People!*\n\
    \nPeople, people, people! You may say I revel in stating the obvious, but all\
    \ the work we've done so far is not about data, assets, or some document that\
    \ defines a corporation. It is only about people. I've emphasized this in every\
    \ chapter: Our work, your work, is people‐centric.\n\nPeople, it bears repeating,\
    \ are at once your biggest asset and potential liability. As assets, they create\
    \ value, they align with goals, and help protect the values they create. As liabilities,\
    \ they can just as easily destroy these values through lack of awareness, carelessness,\
    \ or ill will.\n\nYour challenges in creating your cybersecurity program are twofold:\
    \ First, you are creating a program for your people. Second, you must engage the\
    \ same people to make the program a success.\n\nThat last one is trickier than\
    \ it sounds!\n\n## What's in It for Me?\n\nUp until now we've been asking the\
    \ question, “How much is it worth to you?” That's the right question to ask of\
    \ the board of directors, shareholders, and so on in determining risk appetite\
    \ and crafting the right cybersecurity strategy and program. Obviously, we never\
    \ want to apply controls that are more expensive than the assets we protect, but\
    \ between that floor and the ceiling set by risk appetite we have a lot of room\
