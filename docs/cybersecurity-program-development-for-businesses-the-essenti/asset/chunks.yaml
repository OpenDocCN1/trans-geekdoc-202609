- raw: '> *   (b) SECRET UE (EU SECRET): information and material the unauthorized
    disclosure of which *could seriously harm the essential interests* of the European
    Union or of one or more of the Member States;


    > *   (c) CONFIDENTIEL UE (EU CONFIDENTIAL): information and material the unauthorized
    disclosure of which *could harm the essential interests* of the European Union
    or of one or more of the Member States;


    > *   (d) RESTREINT UE (EU RESTRICTED): information and material the unauthorized
    disclosure of which *could be disadvantageous to the interests* of the European
    Union or of one or more of the Member States.


    You might wonder why we are talking about nation‐state security when you are running
    a business. The reason is simple: States have spent centuries thinking about these
    definitions, so it''s helpful to leverage their expertise. You''ll notice these
    classifications go by degrees of harm. Disclosure of information could cause:


    *   Exceptionally grave prejudice


    *   Serious harm


    *   Harm


    *   Disadvantage


    Most businesses have information assets that, if disclosed, would cause various
    degrees of harm. As a business, you will likely want to add more classification
    levels. You probably already have certain clearances to see particular types of
    sensitive information; for example, your accounting department likely has access
    to financial data other employees don''t. Furthermore, there is information open
    at a corporate level, such as the details of your benefit program, but not available
    to the public. And, finally, there is information open to the public, such as
    the annual report.


    Determining your levels of confidentiality will be important as we move to the
    topic of asset valuation. For each asset, you''ll need to classify its confidentiality
    status (among others), and—to the degree applicable—its life expectancy. For example,
    your tax returns may be kept and labeled CONFIDENTIAL for seven years, and BURN,
    BABY, BURN thereafter.


    ### Integrity


    *Integrity*, our next term, is an easier topic to get your head around than confidentiality.


    If you ask an accountant to define *integrity,* she may refer you to the American
    Institute of Certified Public Accountants 2013 publication titled “Information
    Integrity,” which sports the following definition:


    > *Information integrity is defined as the representational faithfulness of the
    information to the underlying subject of that information and the fitness of the
    information for its intended use.*


    This is painstakingly accurate and also why I don''t ask my favorite accountants
    to define things for me. I have synthesized instead the following definition of
    integrity in the cybersecurity context:


    > *Integrity is the set of practices and tools (controls) designed to protect,
    maintain, and ensure both the accuracy and completeness of data over its entire
    life cycle.*


    In short, you want to have a way to make sure that the numbers in your Excel spreadsheet
    don''t change *on their own*. If you are wiring $5,000, you don''t want it to
    morph into $50,000 without your approval. You want to be assured that the payroll
    is correct, and that your love letter addressed to Anna doesn''t suddenly start
    with “Dear Monica….” That would be a serious integrity problem.


    How do you achieve integrity? You do it by implementing digital signatures, write‐once‐read‐many
    logging mechanisms, and hashing. These conversations tend to be a bit too technical,
    so suffice to say that you need to know about them enough to understand your cybersecurity
    expert''s explanation and recommendation for your specific requirements.


    ### Availability


    *Availability*, pillar number 3, is *the set of practices and tools designed to
    ensure timely access to data*. If your computer is down, availability is compromised.
    If your Internet connection is moving at a snail''s pace, availability is compromised.
    How do you ensure availability? In one word? *Backup*. In two words? *Redundancy*
    and *backup*.


    ### Safety


    Finally, term number 4: *safety*. It is the newest pillar in cybersecurity, but
    one whose impact is potentially the most critical. This is where cybersecurity
    incidents could result in injuries, environmental disasters, and even loss of
    life.


    You may be a user of a connected medical device, potentially putting you at mortal
    risk if that device is hacked. Or, you may be in a connected car, plane, or train.
    Or, you may be in charge of a business that is responsible for water purification
    for thousands of people, or of a utility that millions of people rely on for life‐sustaining
    services like electricity.


    The concept of safety steers the cybersecurity conversation away from the purely
    technical to more of a people‐centric approach. Therefore, as you approach your
    own cybersecurity program development, keep this last pillar at the forefront
    of your thinking. Ask yourself how your cybersecurity decisions go beyond information
    security and potentially involve the prevention of physical harm to human beings
    or the environment.


    ## Measuring Cybersecurity''s Success


    Here''s a key question: How do you measure cybersecurity''s success?


    Ask yourself: How do you measure any security effort''s success? By the absence
    of impact. If you have a house that keeps getting broken into and you install
    an alarm system and the break‐ins stop: *Ta‐da!* Success. No more impact of break‐ins.
    If you''re riding in your bulletproof limo and you''re peppered by bullets? No
    problem; you keep on trekking. No impact! (I might advise that you reconsider
    your life choices, but that''s a different matter.)


    Success in cybersecurity, therefore, will be the absence of impact on confidentiality,
    integrity, and availability of digital information no matter where it is (stationary/stored,
    traveling/transmitted, or processed). What about safety, you ask? Same metric.
    We want to look at the absence of impact on the safety of any assets governed
    or affected by digital information. This is, by the way, one of the arguments
    used against including safety as a fourth cybersecurity pillar: ensuring zero
    impact on confidentiality. Integrity and availability implies—some argue—that
    you already have safety. I do see their point. Personally? I feel safer in the
    redundancy of including it!


    It''s important to note that *absence of impact* does not mean that the effect
    of your cybersecurity efforts can''t be quantified. There are tools that will
    quantify the number of attacks your business systems are currently enduring, likely
    many without your knowledge. That''s right, you may already be experiencing digital
    break‐ins even if you are not aware of them. Establishing these baselines will
    be a key step, and we will discuss cybersecurity success metrics in more detail
    in [Chapter 4](#c04.xhtml).


    ### Ensuring and Preserving


    Remember our definition? *Cybersecurity is the ongoing application of best practices
    intended to ensure and preserve confidentiality, integrity, and availability of
    digital information as well as the safety of people and environments*.


    Let''s focus on *ensure* and *preserve* for a moment. How does one go about it,
    exactly? This question has engaged scholars, scientists, legislators, and citizens
    the world over for many years. The results of their hard work are expressed in
    the form of standards.


    In the most abstract sense, a standard is a set of properties that something must
    meet to be considered appropriate to its function. This something can be a product
    or a service, or even a material. For example, people know that 24‐karat gold
    is 100 percent pure because they have accepted that standard of purity. Similarly,
    people may be familiar with the International Standards Organization (ISO) 9001
    quality management standard, the Institute of Electrical and Electronics Engineers
    (IEEE) 802.3 Ethernet standard, or, the ever‐so‐popular American National Standards
    Institute (ANSI) Z315.1‐2012 Tricycle Safety Requirements standard.'
