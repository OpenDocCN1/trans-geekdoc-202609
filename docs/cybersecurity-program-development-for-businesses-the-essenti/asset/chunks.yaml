    # What does it take to support the three *S*''s?


    Why, it''s the four *C*''s, of course! *competencies, conditions, conduct,* and
    *capabilities*. Jay Ranade, one of the most prolific authors in the IT governance
    and cybersecurity fields and an incredibly gifted instructor and mentor, drilled
    the notion that these four *C*''s represent the critical success factors. He is,
    of course, right. Moreover, as he repeatedly pointed out, the four *C*''s may
    not be entirely under your control.


    Jay is not alone in emphasizing the four *C*''s. In 2014, the U.S. Army produced
    a document called “Win in a Complex World 2020–2040.” That document makes repeated
    references to the concept of the four *C*''s. Parenthetically (and all military
    jokes aside), one of the best centers of excellence in management studies is the
    U.S. armed forces. Some of the very best innovative and critical management thinking
    has come from our military.


    But enough about them! What do the four *C*''s represent for us?


    ## Competencies


    *Competencies* are the skill sets that we bring to the table. If you''re a litigation
    law firm, a core competency would be engaging as many experienced litigators as
    you can afford. That''s a core competency. Engaging real estate attorneys, as
    excellent as they may be, will not help you much in litigation.


    ## Conditions


    *Conditions* are the environments in which competencies exist. Markets can be
    conditions. Geography can be a condition. Technology can also be a condition,
    and so can cybersecurity. Jay''s point about “not always under your control” is
    abundantly clear when you think of market conditions.


    ## Conduct


    *Conduct* refers to the set of actions that we take both within our company and
    within the conditions we operate in to accomplish our goals. Conduct can be ethical
    or unethical, legal or illegal, but it can also speak to company culture and work
    behavior. Conduct can have profound implications on the way you achieve your goal.
    The term “cost of doing business” hides a lot of conduct decisions within it,
    as does “risk acceptance.”


    ## Capabilities


    Finally, *capabilities*. I like to look at capabilities as the set of competencies
    and the measure of competency throughput. Did I lose you here? Okay. Let''s simplify!
    Think of capabilities as your capacity to generate value. Better? Okay, good!
    Now, how do you generate value with your capacity? Well, you are competent enough,
    and have enough bandwidth to apply your competency to value creation. In short,
    you''re capable!


    Perhaps the most complex of the four *C*''s, capabilities integrates concepts
    like capacity, resiliency, agility, and the like. For example, one may ask what
    are the capabilities of your law firm? The answer can be litigation only, or litigation
    plus real state plus corporate law. You can further ask, how many litigation cases
    can you handle at any one time? Or, can your corporate attorneys be leveraged
    by your litigation department? All of these are capability questions.


    How do all of these factor into what we need to know to roll out a successful
    cybersecurity program?


    ### One Word: Alignment


    What does alignment look like in practice? At the top level, your business strategy
    will inevitably determine the functions necessary to achieve it. These business
    functions, which are a direct consequence of your business strategy, determine
    the operations of the business. This applies whether you''re a business of one
    or one thousand: business operations must be aligned with business functions,
    which are themselves the product of business strategy. Therefore, business operations
    must be aligned with business strategy.


    You can write it out like this:


    *   Business strategy (determines): business functions

    *   Business functions (determine): business operations


    Therefore:


    *   Business operations (must align with): business strategy


    Right? A no‐brainer!


    Not so fast! If it were only that simple, we wouldn''t be spending hours of uninterrupted
    fun trying to understand all this.


    All too often, various business operations take on lives of their own and get
    out of alignment with the business strategy they were meant to serve. The closer
    to the core business strategy the function is, the easier it is to keep it in
    check. The further away it is, the harder it is to maintain alignment. Add the
    “foreign language” element of technology and cybersecurity, and you may soon be
    careening all over the road.


    The way it is supposed to work is straightforward: The board defines business
    strategy and accepts risk. Their primary duty to the shareholders (read: owners
    and shareholders and partners) is to ensure value creation (goal setting and business
    strategy) and protect the business (monitor and manage risk). All those lovely
    principle‐guided actions.


    The executives take the board strategy and create the necessary business operations
    to achieve it.


    Operations execute and provide input to a feedback loop that enables the executives
    and board to judge progress in value creation and adjust accordingly. See [Figure
    4.1](#c04.xhtml#c04-fig-0001).


    ![Figure 4.1 The Governance Swimming Pool](images/c04f001.jpg)


    [Figure 4.1](#c04.xhtml#R_c04-fig-0001) The Governance Swimming Pool


    How do you measure all this? You start by clearly setting the goals. You measure
    your progress toward achieving them by establishing key goal indicators (KGIs).
    You should also identify and establish what the critical success factors (CSFs)
    are, and communicate them across the company. Finally, you should be checking
    if you''re on course or not through the establishment of key performance indicators
    (KPIs).


    Some examples may help clarify these three acronyms.


    The easiest example of a goal is sales. It''s a number. You either hit it or not.
    If not, you can measure how far away you are from making that number. So, if your
    goal as a business is $10,000,000 revenue, and your key goal indicator is currently
    at $5,000,000, you''re 50 percent there! (Hopefully, you also have six more months
    to go before having some explaining to do.)


    Now, what are your CSFs for this goal? There can be several. One may be, “We need
    two new clients per month.” Another may be, “We need to increase existing client
    spend by 10 percent per month.” And, another may be, “We need to reduce cost by
    20 percent through automated service delivery.” All three could be CSFs. Which
    one do you focus on most? Are they all equally weighted? CSFs will influence how
    resources are directed toward goal achievement, so you need to be particularly
    careful in making sure that they are clear and widely disseminated. Otherwise…you
    guessed it! Out of alignment.


    Finally, your KPI tells you how well you''re tracking against those critical success
    factors. If the CSF is “Increase existing client spend by 10 percent per month,”
    then you can run a monthly KPI report that tells you if this has been met. Same
    with any (well‐selected) CSF.


    In summary:


    *   *KGI = key goal indicator* **=** Metric of progress toward achieving your
    goal.

    *   *CSF = critical success factor* **=** Metric of impact toward achieving your
    goal.

    *   *KPI = key performance indicator* **=** Metric of course deviation from achieving
    your goal.


    Now, you may ask, do I really have to do all this? Do I need all these measurements
    and acronyms and tracking, and this, that, and the other? Yes! You do. But, don''t
    worry. You''re doing this already. This is simply putting it in more formal language.
    Even if you are a small, informal business, you have goals, KGIs, CSFs, and KPIs.
    You may not call them that, but you do. Your financial statements prove it! So
    does your success, your challenges, and even your failures. You use these tools—no
    matter what the terminology—to navigate your own world every day.


    Why be all formal and keep track of all this? Because, at the end of the day,
    you cannot improve anything that you cannot measure.

    '
