- raw: '*   *Risk Register*: A go‐to menu of your risks, listing as much information
    as possible, including risk type (e.g., what, who, why), evaluation date, description,
    probability, impact, classification (e.g., low, medium, high), response (e.g.,
    accept, insure, run for the hills), and risk owner (who''s on the hook for it?).
    It''s fine to go all in when creating your risk register, but keep in mind that
    throwing everything and the kitchen sink in a risk register will make it difficult
    to maintain and update. Think comprehensive, but not overwhelming.


    *   *Risk Evaluation*: Compare your risk analysis to business‐specific reality.
    Deal only with pragmatic, real, and present risk. Avoid paranoid thinking and
    rabbit holes. To wit: Accept meteor strike as “risk I won''t worry about,” and
    sleep easier.


    *   *Risk Assessment*: Using all of the preceding, identify the issues, rank them,
    and answer what happens if you stick your head in the sand and ignore them. I
    like my risk assessments to be short and sweet. For each identified risk, think
    *Name, Rank, and Serial Number*. Rank, of course, is the key here. Other than
    that, that''s it. If I want the details, I can always refer back to the source
    documents.


    Now that I have all this information clear and prioritized, I can start thinking
    about what controls to place where.


    ## Mitigating Risk


    Controls, as we discussed earlier, do stuff. You know the drill by now. They are
    *preventative* (think: Stop signs)*, detective* (think: cameras), *corrective*
    (think: backup), and *compensating* (think: failover sites). Now that you understand
    both your assets and the threat landscape, you can start making intelligent choices
    about which controls to apply to protect yourself. The goal to remember is: *defense
    in depth*. You want your controls laid out in layers. You want the ability to
    thwart an attacker at all the different stages of an attack, across various systems,
    and you need controls to mitigate all the vulnerabilities you discovered.


    The last factors to consider in developing your cybersecurity program are processes
    and—again—people. In a sense, we''ve come full circle: We started with people,
    and we are ending with people, only this time we''re adding a crucial link. Processes.
    They are absolutely critical in your program''s success. Processes are the essence
    of *how* business is done. They link assets, connect people, and create value.
    Some processes cannot be disturbed and must be protected as is. Others have more
    flexibility and can bend to accommodate controls.


    To find out which is which, you''ll have to map all key processes in the company.
    This may not be fun, but it is essential that it be done and done correctly. Your
    work in this may brush up against bigger issues like overall information security,
    not just our favorite subset of cybersecurity. For example, consider a credit
    card processing workflow. It''s not only the systems that need protecting. The
    whole process—from the moment your client gives you a credit card number to the
    moment the transaction is complete and filed—must be carefully thought out and
    appropriately protected. You may discover that you may need a different set of
    controls, which are not necessarily cybersecurity controls, to protect these mission‐critical
    processes and people.


    People, of course, is what this is all about.


    People are the ultimate value creators, the true engine of creativity, innovation,
    and the spirit of your company. They are your biggest asset, and as such your
    top priority in ensuring their protection.


    People can also be your largest liability. They can be a liability if they are
    not aware of the threats, if they are ill‐prepared to deal with the environment,
    or worse yet, if among them there is a “bad apple” who is intent on compromising
    everyone else''s hard work.


    You can apply controls to protect assets and systems, but you cannot control people.
    That should not be confused. Ever. Interestingly enough, well‐trained, sensitized,
    cybersecurity‐aware people are the best way for the company to survive and thrive.
    That makes them one of your most effective controls, since through their training
    and awareness they actually do stuff to protect the assets! We will review how
    to develop the right cybersecurity awareness program in the chapters that follow.


    ## Incident‐Response Planning


    At this point, you have:


    1.  Mission and vision statements


    2.  Cultural assessment findings


    3.  IT documentation and assessment


    4.  Asset valuations


    5.  Business‐impact analyses


    6.  Threat assessment


    7.  Vulnerability assessment


    8.  Risk assessment


    9.  Process and workflow maps


    10.  Control and defense‐in‐depth deployment


    11.  Cybersecurity awareness program


    What''s missing?


    There used to be a saying that there are two certainties in life: death and taxes.
    This book is not about either. It''s about the third certainty: a cybersecurity
    incident. What''s missing, therefore, is our incident‐response plan.


    Based on your work so far, you have created the necessary foundation on which
    to build an incident‐response plan. You have put in place the processes and controls
    to *deter*, *identify, protect, detect,* and *recover*. You''ve got one more step
    to go: *respond*.


    No two incident‐response plans are alike: The variables alone are overwhelming.
    For one, you can''t define beforehand what type of incident you''ll be dealing
    with. Second, no two businesses are alike, no two systems are alike, and no two
    workflows are the same. We do payroll one way; you do it another way. We use LINUX;
    you use Windows. And so on. So, how can you create an incident‐response plan?
    By preparing for surgery!


    Like cybersecurity incidents, no two surgeries are alike. But all surgeries have
    a checklist to be followed, such as: premedicating the patient against infection
    (preventive control), having enough blood in place (corrective control), having
    imaging and diagnostic equipment ready (detective controls), and so on. It''s
    the same with cybersecurity incident response.


    You should develop a checklist that you practice, refine, drill, refine some more,
    test, tweak, and so on. Depending on the size of your company, you may create
    a red team and a blue team and practice simulated cyberwarfare in which one team
    attacks while the other defends and recovers. You will develop an arsenal of tools
    to use throughout the operation—from forensic capabilities to data recovery. You
    develop communication plans for the company, its clients, the press, vendors,
    and even the authorities. All of these become part of your incident‐response plan,
    a living document that should be constantly reviewed and adjusted as circumstances
    change.


    Now you''re done! You have your response. The board has reviewed your program
    and approved it. Everything is in place. You can sleep more easily—until tomorrow,
    when you have to review the whole thing all over again, making sure that your
    program remains current and reflects your changing business and the changing world.
    Cybersecurity program development is not a once‐and‐done. It''s not a date; it''s
    a marriage. And you''ll need the commitment and effort to keep it thriving.


    For now, let''s take stock of where we are after this whirlwind of a chapter:


    This is what we have so far:


    1.  Mission and vision statements


    2.  Cultural assessment findings


    3.  IT documentation and assessment


    4.  Asset valuations


    5.  Business‐impact analyses


    6.  Threat assessment


    7.  Vulnerability assessment


    8.  Risk assessment


    9.  Process and workflow maps


    10.  Controls and defense‐in‐depth deployment


    11.  Cybersecurity awareness program


    12.  Incident‐response plan'
