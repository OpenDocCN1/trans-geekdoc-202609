    \n当然，`your world` 是一个相当宽泛的术语，您需要提前决定其边界。想想 2013 年底 Target 公司遭遇的著名黑客攻击——这是迄今为止最大的零售公司黑客攻击案例。对我们而言重要的是，被攻击的并非\
    \ Target 的*实际*系统。相反，是一家 Target 供应商遭到了入侵——一个所谓的可信合作伙伴。因此问题在于：什么构成了 Target 的网络安全世界？如果您回答“他们自己的系统*加上*所有供应商合作伙伴系统”，您就答对了！\n\
    \n问题在于，对如此宽泛定义的“我的世界”进行漏洞评估变得不可能，更不用说在法律上也很棘手。例如：作为采购方，您是否有权测试卖方的系统？这取决于 (a) 您购买什么以及\
    \ (b) 您的律师有多厉害。如果您购买的是*something-as-a-service* 呢？您能合理要求什么样的漏洞测试？同样，这些都是非常棘手的对话。\n\
    \n大多数组织采取的做法，也是我推荐的方法，是要求买方执行以下操作：首先，要求卖方遵守合理的网络安全运营标准（例如，“您是否在组织中实施了*<insert\
    \ your favorite standard here>*？”）；其次，要求拥有审计供应商的权利。\n\n您是否拥有审计权可能是有争议的。例如，如果供应商为多个客户提供服务，其中一些可能是您的竞争对手怎么办？如果您拥有审计权，其他客户可能会以数据保密性为由提出异议。您可能会陷入法律泥潭，去精确定义您将审计哪个系统、如何审计等，但您已经明白了。\n\
    \n`Audit` 是一个最好慎用且怀着深深敬意使用的五字母单词。幸运的是，有变通方法。例如，您可能可以要求提供独立审计的结果，而不是自己执行审计。\n\n\
    您如何决定哪些漏洞适用于您的世界？您首先将您的系统与已知漏洞进行匹配。您了解您的系统。现在，您需要找到适用的已知漏洞列表。\n\n那未知的漏洞怎么办，您问？\n\
    \n## 零日漏洞利用\n\n显然，您无法针对未知漏洞进行测试，就像您无法针对未知病毒接种疫苗一样。但是，就像在医学上一样，您可以密切监控系统是否有任何异常行为迹象，并做出相应反应。最重要的是？您在这场战斗中并不孤单！成千上万敬业的网络安全专业人员和网络安全公司毕生致力于扫描尚未发现的漏洞，发布它们，并推荐补丁或缓解控制措施。\n\
    \n回顾我们的网络安全入门知识，您会记得*zero day* 指的是那些只为黑客所知的、利用现有系统漏洞的恶性小漏洞。因此，您针对零日漏洞利用的目标很简单：保持警惕，保持信息灵通，并建立纵深防御策略，在切实可行的范围内最大程度地保护您的组织。\n\
    \n此处选用 `practical` 一词至关重要。这不是关于将组织保护到技术允许的极限——那不一定符合您的风险偏好。关键始终在于以切实可行、务实的方式部署防护。\n\
    \n第一步是利用您的资产分类来确定哪类漏洞可能适用。在顶层，您应该能够将资产归入以下类别：\n\n*   **操作系统：** 这些系统驱动您的硬件。它们可以是特定厂商的，如\
    \ Apple 和 Microsoft 的，也可以是基于开源的，如 `LINUX`。操作系统的讨论和选择可能极具两极分化，我建议您像避瘟疫一样避开它们。您需要知道的是哪些部署在您的组织中。将“哪个更好”的问题留给各技术教派的相应高级祭司去辩论吧。如果您对操作系统、浏览器、搜索引擎、平台等的市场份额感兴趣，我推荐您访问\
    \ Global Stats 网站（`http://gs.statcounter.com`）——一个免费的统计数据天堂网站。\n\n*   **服务器：**\
    \ 这些本质上是托管（或启用）其他应用程序的应用程序。例如，数据库服务器或 Web 服务器。您需要知道数量、类型、制造商、版本等。还记得 Chapter 6\
    \ 中提到的“统治一切的一个电子表格”吗？如果您颗粒度做得足够细，所有这些信息都在里面。\n\n*   **应用程序：** 这些要么直接在操作系统上运行（如文字处理器），要么在操作系统和某些服务器的组合上运行（如网站）。例如，您的会计系统既运行在操作系统上，又使用数据库服务器，它本身也是一个应用程序，您需要了解我们一直在编目的所有详细信息（制造商、版本等）。\n\
    \n*   **服务：** 乐趣何时停止？它止于服务。这些是您公司从第三方消费的任何服务。可能是存储、基础设施，也可能是任何 as-a-service。是的，您需要尽可能详细地了解它们。在\
    \ as-a-service 的情况下，您需要查阅与供应商的协议，并联系他们的网络安全人员以确定他们的基线态势。假设您打交道的是信誉良好的供应商，他们将能够为您提供所需的所有文档。\n\
    \n## 漏洞映射\n\n手握电子表格，您现在将为这四个类别中的每一个研究并制定当前的已知漏洞列表。为此，您需要咨询以下令人惊叹、免费且难以想象有比它们更有用的服务：\n\
    \n*   **MITRE**。根据其网站介绍：\n\n    *   `The MITRE Corporation is a not-for-profit\
    \ company that operates multiple federally funded research and development centers\
    \ (FFRDCs). We provide innovative, practical solutions for some of our nation's\
    \ most critical challenges in defense and intelligence, aviation, civil systems,\
    \ homeland security, the judiciary, health care, and cybersecurity.`\n\n     \
    \   我在此作证，是的，他们确实如此，而且我是他们最大的粉丝之一！他们的众多项目之一是通用漏洞披露详情网站 `https://www.cvedetails.com`。这是一个惊人的工具，您可以按漏洞、产品、供应商或任何您能想象到的条件进行搜索，并获得有意义的、最新的、可操作的信息。例如，搜索\
    \ `Microsoft SQL Server` 将返回一个按年份、漏洞数量、类型等分类的表格，所有这些都是指向更具体信息的链接。因此，在同一个例子中，如果您点击\
    \ 2015 年的“Code Execution”漏洞，您将得到两个：`CVE-2015-1763` 和 `CVE-2015-1762`。点击第二个，您将获得关于特定产品远程代码执行漏洞的所有详细信息，以及如何缓解它。还有什么不爱的？\n\
    \n"
