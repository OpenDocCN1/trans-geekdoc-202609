    无论其缺点如何（而且缺点不少！），本地计算环境确实为 IT 专业人员提供了他们极其喜爱的一样东西：控制权！一旦切换到云环境，这种控制权就会开始消退，这会让一些
    IT 人员感到不安。在讨论云时，要让网络安全专业人员放心的一种方法，就是承诺将 IT 基础设施迁移到私有云。这意味着基础设施至少位于一个专用、安全、访问受控且很可能通过
    ISO 认证的数据中心内，只有你和你的团队拥有访问权限。


    私有云试图在保持本地架构的所有权感和控制感的同时，提供公有云解决方案的可扩展性和按需配置优势。换句话说，私有云试图以独占方式为你的组织提供公有云的优势。你仍然负责维护生成的
    IT 服务占用空间，就像你负责保护它一样，但现在你拥有了一个优势：不必实际拥有基础设施。从本质上讲，你是在按需租赁在任何特定时间所需的任何资源。你可以随意频繁地配置和取消配置任意数量的资源，从而获得本地基础设施无法提供的灵活性，同时保持高安全或任务关键型基础设施所要求的严格控制。


    重要的是要注意，你不应将私有云基础设施视为一堆专用的物理计算机。虽然这有可能，但不太可能。你的私有云解决方案很可能像公有云一样，以虚拟方式交付给你的公司，但有一个关键区别：这种基础设施即服务的交付是通过专有的、专用的、单租户管道完成的，实质上在租户之间创建了物理隔离。


    当你运行私有云时，就像运行自己的本地基础设施一样，你需要完全负责私有云的安全需求。全靠你自己。从本质上讲，你获得了云基础设施即服务甚至软件即服务的灵活性，同时保留了对网络安全的完全控制。如果这对你值得，那就太好了！答案在于将业务目标与
    IT 价值交付相结合，别无他处。如果这种结合导致私有云实施，那么网络安全将挺身而出保护它。


    当然，问题在于，任何云选择（私有、公有或混合）都会给任何本地基础设施带来额外的网络安全考量。例如，在考虑采购服务之前，你需要确保你的私有云提供商符合多项标准。这些包括所有常见的标准，如
    CSA STAR、HIPAA、ISO27001、PCI-DSS、SAS-70、SOC-3 和 TRUSTe 等。如果你必须选择一个认证，你应该选择云安全联盟的
    STAR 认证（它将 ISO27001 与其自身的云控制矩阵 CCM 相结合）。CSA STAR 分为三种类别：一级自我证明、二级认证和正在开发中的三级持续监控实现。然后，有了这个，你可以调查额外的要求，如隐私盾（如果你关心欧盟的通用数据保护条例
    `GDPR`，你应该关心）、PCI 或 HIPAA。


    ## 公有云计算环境


    公有云的概念让大多数网络安全专业人员感到极度不安。当然，有大量的认证，市场正在成熟，有适当的控制措施，等等，但我们谈论的是风险导向的计算机科学家。无论你说什么，对他们来说风险都太大了。为什么太大？因为我们不是轻信的人！在公有云中，网络安全是提供商的责任，简单说，我们不信任他们。有人会称这为偏执和不恰当。我们称之为审慎。随它去吧！


    那么，我们如何能和睦相处？首先，你（作为行动的网络安全高管）应该充分了解提供商在几个关键变量上的政策和控制：他们的隐私政策是什么？他们在哪些方面合规，哪些方面不合规？全球数据流动有哪些问题？他们的透明度政策是什么？


    你应该坚持要求你的云解决方案提供商能够阐述、演示并按需提供给你进行审计：他们的安全策略、控制措施、业务连续性和灾难恢复计划、人员专业知识和安全许可（包括背景调查政策）、员工培训和认证、云设施认证和过往审计结果、他们的事件响应计划以及沟通政策。如果他们遵从，那就没问题。如果不遵从，则风险由你自行决定接受与否。那是什么风险？


    有几个。如果你不知道数据实际上是如何受到保护的，那么在为时已晚之前，你也可能不知道数据是否已被窃取或篡改。或者，考虑到既然你在公有云中，攻击者可能以你的“室友”为目标，并在过程中破坏你的服务器。或者，想象另一个租户被黑客攻击，但房东选择不向你（或任何其他人）通报这一事实，因为暴露违规不符合他们的最大利益。诸如此类。


    还有一些严重的技术考量，你需要获得保证：诸如共租、并行处理和进程内存隔离等问题。我们不需要在这里深入探讨这些细节——这就是为什么你应该聘请一名云安全认证专业人员。简而言之，既然大家都在同一个池子里，你要确保如果角落里的孩子出了事，你不会最终游在其中！


    ## 混合云计算环境


    你已经拥有混合云了，即使你可能没有正式承认这一点。我认为可以安全地假设，你组织中的每个人都有某种智能手机或平板电脑。如果是这样，无论你喜不喜欢，他们已经在使用云了。所有这些设备通常都连接到云进行备份和存储。如果你的用户将这些用于公司邮件，那么公司邮件也有可能存储在云中。当然，可以对所有这些应用严格控制，但那样你就发动了一场无法取胜的战争：一场与影子
    IT 的必输之战。


    影子 IT 被定义为你的用户采用的任何未经你的 IT 部门批准也未由其维护的信息技术解决方案——因此称为“影子”。影子 IT 经常源于用户对 IT 的僵化及其批准解决方案的挫败感。因此，用户为了更高效、更快捷，或寻求易用性和便利性，会开设
    `Dropbox` 账户，或使用工作或私人邮箱地址来绕过他们视为繁琐的组织控制。

    '
