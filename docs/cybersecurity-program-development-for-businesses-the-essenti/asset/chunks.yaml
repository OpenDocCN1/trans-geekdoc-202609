- raw: 'This book is for them and for you: a businessperson, either running your own
    business or responsible enough to need to know how to protect the one you''re
    employed at—no matter the size. You don''t want to be at the mercy of experts
    talking above your head and around you. You want to participate in the conversation;
    you want to know what you''re getting into. You are also an individual concerned
    about your privacy. You are alarmed about all the stuff about cyberattacks, hackers,
    and the like bombarding you in the news, and you want to stop feeling helpless
    about it. You are also a pragmatist who knows you can''t spend your day being
    terrorized into hiding, paralyzed with inaction, or crippled by the costs of compliance
    and cyber‐protection.


    This book will prepare you for all this, step by step. We''ll develop your cybersecurity
    program together, using the information presented here as well as by reviewing
    case studies from different industries and businesses.


    Speaking of case studies, we need a case study disclaimer. The case studies presented
    throughout this book are aggregated from our work and from the work of colleagues
    who were gracious enough to share their experiences, some as named contributors.
    As you would expect, all names, industries, and geographies have been changed
    to protect the anonymity of the clients. The goal has been to distill the essential
    lesson from each case while protecting the identity and respecting the privacy
    and confidentiality of every client. You will find these case studies sprinkled
    throughout the book, especially as we dive into the specifics of cybersecurity
    program development.


    My original title for the book paraphrased the great Stanley Kubrick and his film,
    *Dr. Strangelove*. I was going to call it *How to Stop Worrying about Cybersecurity
    and Learn to Love the Hackers!* The wise people at Wiley talked some sense into
    me and changed it for the better, but my goal remains the same.


    It is my hope that when you''re done, you will stop worrying about cybersecurity
    and will have learned to love the hackers!


    # ABOUT THE AUTHOR


    I was born in Athens, Greece. After high school I chose to come to the United
    States to study physics and computer science. I did that at The College at Brockport,
    in upstate New York. My years at Brockport were formative to me as a person, a
    scientist, and as a professional. Words for the gratitude and respect I have for
    the dedicated faculty that shaped my life can easily fill a couple of books, but
    that is for another time.


    After graduating with my bachelor''s degree in science, I became an instructor
    of computer science and a computer systems manager at the Stratford School in
    Rochester, New York. Following brief graduate work stints at the Rochester Institute
    of Technology and the University of Rochester, I moved to New York City to serve
    as the director of academic computing at the Pratt Institute. There, under the
    direction of the vice president of information technology (there were no “chief
    information officers” back then), I was responsible for the building and management
    of four computing centers of excellence, each focusing on a specific discipline
    (art, architecture, engineering, and information science). From there, I was recruited
    to be the vice president of information technology at the O''Connor Group, a real
    estate manager and developer in New York City. Then, in the middle of the Reagan
    Recession, I decided that there was no better time than the present to start my
    own company, which I did in 1989.


    I have been running my own firm ever since, surrounded by partners and colleagues
    who teach me more and more every single day, and together we deliver a broad spectrum
    of IT consulting services. I have been privileged to partner with great clients,
    to engage in fantastic projects of business and technology transformation, and
    to collaborate with teams that push boundaries and develop incredible business
    solutions. I lived through the amazing advances in computer science that are now
    the stuff of lore: I was there during BitNet, sending email messages and watching
    the message hop from node to node. I was amazed at formatting the first 10MB hard
    disks of IBM''s new personal computer. I''ve fed endless floppies in and out of
    the first Macs. I''ve built muscles carrying the Compaq “Portable,” which was
    nicknamed “luggable” for good reason. I''ve carried pagers and cellphones the
    size of suitcases. I subscribed to CompuServe and AOL, and still have a working
    Hayes 14.4 modem.


    Throughout it all, I have always been fascinated by security, privacy, and the
    protection of data. Even before “cybersecurity” was a word, I insisted that the
    sites we designed and managed implemented business‐appropriate computer security
    and disaster recovery. Maybe it was because George, a partner of mine at the time,
    was a computer virus collector (he still has them). Maybe, because I remain culturally
    Greek, naturally cautious and private. Whatever the reason, I always asked, “What
    happens if ‘this’ gets out?” or “How fast can we be back up and running?” Any
    of my consultants will tell you that even now, the first thing they are taught
    when they start working for me is that “not checking the backup is a career‐ending
    mistake.”


    Following decades as a practitioner of both IT governance and cybersecurity management,
    I decided to make it official and joined Information Systems Audit and Control
    Association (ISACA), an independent, nonprofit, global association that was founded
    in 1969, engaging in “The development, adoption and use of globally accepted,
    industry‐leading knowledge and practices for information systems.” Joining ISACA
    was one of the smartest things I ever did. Through ISACA, I got certified in two
    areas: one in IT governance, becoming Certified in Governance of Enterprise IT
    (CGEIT), and another in cybersecurity, becoming a Certified Information Security
    Manager (CISM). As of this writing, I am proud to have the highest scores in the
    New York chapter in both, as well as membership in the top 5 percent of those
    tested worldwide for CISM, and the top 10 percent for CGEIT.


    # ACKNOWLEDGMENTS


    This book reflects a long, personal, and professional journey. Over the course
    of some 30 years in the industry, I have had the privilege to meet hundreds of
    professionals, experts, partners, clients, and vendors who have shaped my thinking,
    formed my experiences, and honed my expertise. From my original partner in the
    business, George Whelan, who religiously collected and kept live computer viruses
    on floppy disks, to instructors like Jay Ranade, who has forgotten more than I''ll
    ever know, to clients who partnered with me, and staff who tirelessly worked to
    solve problems, I owe each one a debt of gratitude that no acknowledgment can
    do justice. I start, therefore, with an apology for my omissions. They are entirely
    my own.


    First and foremost, I want to thank our clients, our true partners to success.
    Every day, we are honored and privileged to be your allies and to contribute to
    your success. We are humbled by all the things that you teach us every day. I
    would be remiss if I didn''t single out the Hoffman family, Andrew, Mark, and
    Steve, who have been loyal supporters and mentors since I started the firm; the
    executive leadership at the 4As for defining and living into a true partnership
    of success; the founding partners at Allegaert Berger and Vogel, Chris, David,
    and Michael, for their trust in us, loyalty, and wise counsel through thick and
    thin; the president of the LaSalle Academy, Dr. Cathy Guerriero, and her team,
    for infusing us with creativity and vigor, and for taking the time to listen even
    when they are running at 1,000 mph; and finally, the leadership team at the Packer
    Collegiate Institute, Bruce Dennis, Elizabeth Winter, and Jim Anderson, for their
    trust, engagement, and reminding us how to be brave in the face of change.'
