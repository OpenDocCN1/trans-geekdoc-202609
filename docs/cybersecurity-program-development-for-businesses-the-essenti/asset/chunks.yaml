  fmt: "\n# 网络战：清晰而现实的危险\n\n俄罗斯并非唯一在网络战方面表现出色的国家。许多民族国家将其视为新的“军备竞赛”。他们理所当然地认为，这是一场他们能够赢得的竞赛。朝鲜、伊朗和中国已多次展示其能力。美国和以色列也是如此。毫无疑问，实际上每个国家都在积极参与网络战基础设施的开发、管理和部署。它们都在构建大规模的防御性和进攻性网络战能力。此外，它们“志在必得”，并自信能够获胜。\n\
    \n俄罗斯网络攻击之所以特别恶劣，并非因为它是首例，而是因为它赤裸裸地、当面展示力量，嘲弄仅存的超级大国。使其特别致命的是，它结合了俄罗斯在宣传方面的深厚造诣。我读过近期官员的采访，他们轻描淡写地贬低俄罗斯的宣传，称其为“司空见惯”、“我们以前从俄罗斯人那里见过的把戏”。如果是这样，那我们就没有吸取教训，且为此付出了惨痛代价。我们被一个我们自以为早已在冷战中战胜的消亡敌人严重击败并嘲弄。依我之见，敌人消亡的消息为时过早，冷战远未结束。\n\
    \n1949年4月4日，在第二次世界大战的记忆犹新之际，美国、加拿大和几个欧洲国家缔结了一个联盟。北大西洋公约组织（`NATO`）正式成立。条约第1条规定：“缔约国承担，按照《联合国宪章》的规定，以和平方式解决它们可能卷入的任何国际争端，以不危及国际和平、安全与正义的方式进行，并在其国际关系中避免以任何与《联合国宗旨》不一致的方式进行武力威胁或使用武力。”\n\
    \n随后签署了更多条约，世界末日时钟反映了威胁程度：1947年为午夜前7分钟；1949年苏联首次核试验后为3分钟；1991年达到最低值17分钟。现在，又回到了午夜前3分钟。\n\
    \n最低值17分钟出现在世界认为冷战结束、美俄从事核裁军之时。自2015年以来，时钟再次拨回3分钟，因为“失控的气候变化、全球核武器现代化和庞大的核武库对人类的持续生存构成了非同寻常且不可否认的威胁”，而世界领导人未能采取行动。\n\
    \n遗憾的是，这并非他们唯一的失职。气候变化和核武库都灾难性地严重，对此不应有任何怀疑，但第三种祸患已浮出水面：网络战。大多数人认为黑客攻击或网络战确实是一种威胁，但不像核武器那样处于同一级别。是的，可能损失数百万美元，政治生涯可能毁于一旦，服务中断可能带来不便，但网络战被认为局限于虚拟世界，而非现实世界。他们大错特错。\n\
    \n网络战行为可能已在乌克兰夺去生命，当时俄罗斯黑客攻击该国电网，导致近25万居民断电。当伊朗核浓缩设施的离心机被`Stuxnet`（一种疑似美以网络武器）摧毁时，可能也已夺去生命。当然，还有许多网络霸凌的受害者选择结束自己的生命，这展示了声誉损害的力量——这是黑入任何个人生活故事即可轻易达到的效果。\n\
    \n专家警告网络战必将导致真实人员伤亡。设想若电网被黑客攻击，国家或地区陷入数周的黑暗，会发生什么？`Ted Koppel`在其著作《`Lights Out`》中进行过推演，其后果毁灭性极强。设想黑客攻击医疗记录和设施、水净化厂、交通管制或电信系统的后果。我相信你能构想出自己的噩梦场景：成千上万甚至数十万人死伤，国家陷入混乱。\n\
    \n我也毫不怀疑，我们安全机构中有才华横溢的头脑在日夜不停地分析和应对这些威胁，并向领导层提供建议。但经验告诉我，他们的建议经常落于耳旁风。正如高管们不愿听闻风险（无论是网络、技术或其他），政府“高管”恐怕也不例外。近期关于情报简报价值的言论便证明了这一点，正如`Obama`白宫在应对俄罗斯针对我们政治进程的攻击时表现出的不作为和犹豫。\n\
    \n为人类生存，我们需要在新战线上付出集中努力。我们需要领导人受过教育、对危险保持警惕。我们需要民众对网络攻击的危险保持敏感；要有网络时代的“趴下掩护”意识。我们需要盟友重振和平解决冲突的框架，将网络战纳入其中。对一国的网络攻击应被视为对我们所有人的攻击，并作出相应的即时回应。我们还需要国际组织认识到网络行为体扩散的危险，并采取即时果断的行动。\n\
    \n这是个开始，除此之外别无他法。我的网络时钟设定为午夜前1分钟，秒针正在滴答作响。\n\n*原文发表于2017年1月17日，刊载于“From CEO to\
    \ CEO”（[http://www.ceo-to-ceo.com/trends/clear-and-present-danger/](http://www.ceo-to-ceo.com/trends/clear-and-present-danger/)）。*\n\
