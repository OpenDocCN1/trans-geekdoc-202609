- raw: "*   *Mitigated risk*: Existing risk after controls have been applied\n\n*\
    \   *Residual risk*: What's left over after risks have been mitigated or transferred\
    \ as much as possible\n\n*   *Accepted risk*: Residual risk that has been accepted,\
    \ aka *the risk of doing business*\n\n*   *Controls*: Active countermeasures,\
    \ be it processes, systems, or applications, that prevent, detect, correct, or\
    \ compensate against risk\n\n# CHAPTER 2  \n\nEverything You Always Wanted to\
    \ Know About Tech (But Were Afraid to Ask Your Kids)\n\nHow much do you need to\
    \ know for us to have an intelligent conversation about your business data, your\
    \ personal information, potential threats, and your options to address those threats?\
    \ The answer is surprisingly fluid, as it is with any fast‐changing field. How\
    \ much do you need to know about medicine to have a meaningful conversation with\
    \ your doctor about your health? How much do you need to know about law to understand\
    \ and engage with your attorney? How much do you need to know about cars to talk\
    \ to your mechanic?\n\nIt's a tricky question with no easy answers, and to some\
    \ degree, it involves lots of individual choice. Some people dive deep into research\
    \ before consulting with a medical expert; doctors jokingly refer to these folks\
    \ as “Google Medical School graduates.” Others shy away from research entirely,\
    \ depending on the expert advice of professionals. But no matter where on the\
    \ spectrum you find yourself, everyone around the table should at least speak\
    \ a common language. For example, you may not know precisely how your engine *works,*\
    \ but you know what an engine *is*.\n\nNot so much with technology. The minute\
    \ we start talking tech, eyes glaze over, mouths yawn, and palms sweat. For some\
    \ reason, we forget we share a common language…and we need to fix that!\n\nOf\
    \ course that is more easily said than done, especially when it comes to tech.\
    \ Still, the success of this book's message rests in its ability to reach you,\
    \ be understandable, and actionable. We definitely need to be able to communicate\
    \ at some level. To do this, I have chosen to abuse metaphors, go back to basics\
    \ as needed, keep everything as simple as possible, use short case studies to\
    \ illustrate examples, and live by Mark Twain's adage: *Humor is the good‐natured\
    \ side of a truth*.\n\nOur goal is a simple one: When done with this section,\
    \ I'd like you to have the same tech facility you have when talking about your\
    \ car. I am not expecting you to be a mechanic but I am hoping that you'll get\
    \ to know a bit about its history, the location of the engine, what the steering\
    \ wheel does, and how to start it.\n\nIt will also be good if you get to learn\
    \ to drive the thing without killing anyone!\n\n## In the Beginning…[¹](#c02.xhtml#c02-note-0001)\n\
    \nThere was darkness. And void. It was probably pretty cold, too. Then, the lights\
    \ came on, rocks started spinning in the heavens, and before you know it, fish\
    \ were walking on land, and all creatures big and small were living in glorious,\
    \ albeit analog, bliss. Shortly thereafter, an English mathematician by the name\
    \ of Charles Babbage came up with something he called the Difference Engine, now\
    \ credited as the first computer. Three years later, it was hacked by Ada Lovelace\
    \ when in 1843 she published “Sketch of the Analytical Engine,” officially firing\
    \ the starting gun and setting the world racing down the information highway.\
    \ Moving right along, past the invention of the telegraph, the telephone, and\
    \ the radio, almost a hundred years after Ms. Lovelace, Alan Turing, another Brit,\
    \ published a paper titled “On Computable Numbers,” detailing the design of a\
    \ digital computer.\n\nIt didn't take long for the rest of the world to get into\
    \ the game. In 1938, Konrad Zuse built the first electromechanical binary computers,\
    \ the Z1 and—of course—the Z2. A year later, John Atanasoff completed the first\
    \ entirely electronic binary computer. World War II drove the development of electronic\
    \ deciphering devices of which the German Enigma and the British Colossus are\
    \ the best known. The public didn't get to see a computer until 1944, when IBM\
    \ constructed a room‐sized machine, the sexily named Automatic Sequence Controlled\
    \ Calculator, at Harvard University (it was nicknamed Mark I by Harvard engineers).\
    \ Not to be left behind, in 1946 the University of Pennsylvania inaugurated ENIAC,\
    \ which weighed over 30 tons with its 17,000‐plus vacuum tubes.\n\nThings were\
    \ going splendidly in 1947, when a dead moth was found short‐circuiting the vacuum\
    \ tubes of a Mark II computer, giving rise to the term *bug,* usually preceded\
    \ by several expletives. The same year, John Bardeen, Walter Brattain, and William\
    \ Shockley, working at Bell Labs, invented the first transistor. The rest, as\
    \ they say, is history: In the blink of an eye, we went from massive mainframe\
    \ computers to personal computers, tablets, smartphones, wearables, and even quantum\
    \ computers. As of this writing, there is even experimental work of storing terabytes\
    \ worth of data in *biocomputers* that use the DNA helix for memory. So much for\
    \ *digital* devices!\n\nParalleling the development of all these computers is\
    \ the development of the networks that connected them. It started when the United\
    \ States, quite annoyed by the incessant *blip‐blip‐blip* of Sputnik, formed the\
    \ Advance Research Projects Agency (ARPA) in 1958. ARPA's head of its command‐and‐control\
    \ division, J.C.R. Licklider, sent a memo to his colleagues boldly asserting that\
    \ the time was right for a network of interconnected computers. He was right.\
    \ Several geniuses later (Leonard Kleinrock, Robert Taylor, Paul Baran, Ted Nelson,\
    \ and more) and ARPANET was born!\n\nFrom then on, everything is a blur. Between\
    \ 1969 and 1990, we had NET‐mania: ARPANET, ALOHANET, TELENET, USENET, and—yes—FIDONET,\
    \ to name a few. At some point, all these NETs were talking to one another and\
    \ everyone agreed to call the collection of all these connected networks, computers,\
    \ and devices INTERNET and get it over with.\n\nIn between all that, Ray Tomlinson\
