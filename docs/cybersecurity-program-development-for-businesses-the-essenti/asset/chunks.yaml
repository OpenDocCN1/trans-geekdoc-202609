    \ skip it. Leave it for last. That one will be the toughest to solve because it\
    \ gives you the least information to go on. You see one that has a paragraph‐long\
    \ definition? Easy! Tackle that first.\n\nWith that in mind, what kind of problem\
    \ is aligning cybersecurity with your business strategy? Well, another way of\
    \ looking at it is aligning cybersecurity with your risk appetite. Both definitions\
    \ are one‐liners, and short one‐liners at that. Not pretty!\n\nHow do you come\
