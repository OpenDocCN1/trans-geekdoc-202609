    \ only for demonstration purposes. Please don't send hate mail. Thank you.)\n\n\
    Another example of a table you can derive is shown in [Table 6.7](#c06.xhtml#c06-tbl-0007).\n\
    \nYou can derive any combination you need, and many you don't: Criticality by\
    \ Location, Impact by Asset/System, Resources by MTD. Each one can provide different\
    \ insight on how to best manage the overall risk to the organization.\n\nThere\
    \ is one more thing left to do. You need to assign a financial value to all of\
    \ these assets (systems, and others) that you have so painstakingly cataloged,\
    \ indexed, assessed, inventoried, and reviewed. Typically, this solicits the response:\
    \ “Good luck with that!” Unfortunately, that won't suffice here. We need to get\
    \ some sort of valuation in the books.\n\nNow, before you start running for the\
    \ hills, consider this: We're not really looking for a formal, accounting, audit‐proof\
    \ valuation. Sure, that would be very nice to have (and in some cases required),\
    \ but we can make do with an informal valuation. You may also ask “Why now?” Why\
    \ couldn't we do this as we spent all those hours of uninterrupted fun doing the\
    \ asset classification and business‐impact analysis work? Well, the truth is that\
    \ you *could* do it then, but I recommend that you don't. Instead, I recommend\
    \ that you take the opportunity to do a presentation of your findings to date\
    \ to all those involved. This will give you valuable feedback (in case something\
    \ was missed), and give them a unique view of their world as seen through your\
    \ eyes. That is when I feel is the best opportunity to talk dollars and cents.\n\
    \nSo, corral your business unit owners and executive team and don't let them leave\
    \ the room until they give you what you need: a number per asset. Some sort of\
    \ quantifiable dollar value that answers the question: How much is the asset worth\
    \ to you?\n\nReplacement value is an easy starting point for most executives to\
    \ grasp. What would it take to replace a particular asset? Think about it holistically:\
    \ purchase or lease, equipment, licenses, expertise, staff time, the works. It's\
    \ not that crazy of a calculation, really.\n\nWhen you're done with the first\
    \ pass, let's talk damages. What kind? Which assets or units are affected? All?\
    \ Some? Which contracts? What services? Any products? Any regulatory implications?\
    \ What about reputation? You should assess those costs as well. For example, your\
    \ team will know the value of the contracts and the corresponding penalties and\
    \ losses associated with failure to fulfill. They also will know any regulatory\
    \ penalties that may ensue as a result of a loss or breach. Finally, you can estimate\
    \ with the team the cost of rebuilding the firm's reputation when those emails\
    \ that you called people all sorts of names leak out. You got this!\n\nThat's\
    \ it. Now, you're done. You added the last field on your spreadsheet: Impact,\
    \ expressed in dollars. Take a well‐earned break, and get ready for the next step.\n\
    \n# CHAPTER 7  \n\nThreats\n\nBefore we start, we need to briefly review a few\
    \ key concepts: threat, attack, vector, and payload.\n\n*   *Threat* refers to\
