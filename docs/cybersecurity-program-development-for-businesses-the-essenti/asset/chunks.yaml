- raw: 'One absolutely critical part of your incident‐response plan is a clear definition
    of communications protocols. Think of this as the *who*‐*says‐what*‐*to‐whom‐when*
    part of the plan. This is key. For one, you don''t want to instigate a panic among
    users by screaming through the speakerphones, “Incident Alert! Incident Alert!”
    And you certainly don''t want to broadcast to the bad guys that you have detected
    an incident. So, avoid emails (they may have been compromised), avoid nonsecure
    messaging platforms, even unsecured telephone lines that may have been compromised.
    To the degree possible, stick with personal, one‐on‐one, need‐to‐know secure communications.
    Needless to say, this is not the time to get social! This is the time to carefully
    assess what exactly is happening, its impact on the business, on its clients and
    vendors, and, of course, the need to notify law enforcement and regulators. The
    last thing you want to happen is to have someone from the press calling you with,
    “I got a tweet about you folks having been breached.…Can you comment on that?”
    That''s not a good place to find yourself.


    The *whom* in the *who‐says‐what‐to‐whom‐when* workflow can be long and dynamic.
    It will change regularly, and likely involve several third parties like your own
    insurance company, business vendors, cloud solutions providers, your Internet
    services providers, and a slew of information technology vendors and their incident‐response
    teams. You may be required to notify law enforcement—my go‐to is always the FBI
    and the local district attorney''s office. If you happen to be a multinational,
    then the list becomes substantially longer since you may need to comply with local
    regulations on incident reporting country by country. On top of all these, you
    should consider sharing the information that you have with the United States Computer
    Emergency Readiness Team (US‐CERT) and other industry‐specific incident‐response
    organizations.


    The fun part of notifications, of course, is letting your clients know about the
    breach. To be clear: There is no avoiding this, and the experience will not get
    better with time. The last thing you want is to have your clients learn about
    the situation from the news media. You need to be prepared and well‐rehearsed.
    Legal, insurance, and communications departments must all be in complete alignment
    on (at a minimum) what happened, who did it, why it happened, what you are doing
    in response, and how you''re making sure it will not happen again. You may not
    know all the facts (e.g., who''s behind it), but you need to be as proactive in
    your communications as due care and prudence will allow. Nothing destroys trust
    in a company faster than a poorly communicated cyber‐incident. Get in front of
    it as soon as is practical—engage the news media and be as forthcoming as possible.


    The next step in your incident‐response plan creation is to integrate the wonderful
    results of your work to date in threat analysis, environments, and defense‐in‐depth
    and control deployments. The plan needs to reference all these, with specific
    clarity on where your threat intelligence is coming from and how you can leverage
    that in case of an incident, your environments at risk (clouds, Internet‐connected
    devices, and your distributed workforce), and your defense‐in‐depth and controls
    deployments. These will be critical in both the detection of an incident and the
    response to it. Remember, all these entries in your plan need to be kept current.
    All this is dynamic, and for the plan to be useful, it needs to reflect the appropriate
    level of changes over time. What does this mean for you? Get comfortable with
    two words: change management.


    To complete your incident‐response plan, you will need two more entries. First,
    you will need to identify your incident‐response toolkit. This is a set of mostly
    software tools (there are some hardware tools as well) that are specifically built
    for forensic and incident‐response work. *Please note: These are surgical instruments,
    and they need to be handled by experts*. Moreover, the toolkit, like all else,
    evolves over time; in fact, toolkits are the fastest‐evolving component of your
    response, because software is constantly updated. It is therefore critical that
    the plan reflect the most up‐to‐date toolkit in use, its locations (yes, there
    needs to be more than one), and any access credentials necessary. You do not want
    to be scrambling for USB keys in the middle of an attack. You need to know where
    your toolkit is, what is in it, and who are the right people to use it.


    I can''t emphasize enough the importance of the right people. Forensic and incident‐response
    work is very complicated and requires highly skilled specialists. Even the best‐intentioned
    and expert IT professional can wreak havoc if she attempts to use forensic tools
    without specialized training and experience. There are any number of case studies
    where IR professionals walked into a site under attack only to find the well‐meaning
    IT team having turned off the servers and already restoring systems from backup.
    This common mistake destroys the evidence, leaving you with no way to know who
    attacked and why, no way to learn how to prevent it in the future, and so on.


    The last component of your incident‐response plan is the training. And by that
    I don''t mean the company‐wide cybersecurity awareness training I discussed earlier.
    Here I mean war games. Full, all‐out, incident‐response exercises, conducted frequently
    and analyzed exhaustively. Just like the old joke about how do you get to Carnegie
    Hall, the only way to get to be good at incident response is practice, practice,
    practice. The higher your dependence on your IR team, the more and rigorous your
    practice exercises must be—think Red Teams and Blue Teams; the works! The exercises
    need to be comprehensive across all your environments and include your executive
    team, staff, and all key vendors. Some should be well planned, rehearsed, and
    announced while others should be out‐of‐the‐blue surprise drills. Everyone, from
    executives on down, should be aware and sensitized to incident response. They
    all have a role to play.


    Meanwhile, your IR team should never rest. I know, it sounds harsh and too much.
    But, that''s the job. It''s what they do. Constant training and practicing is
    the only thing that will make the final difference during a real attack. Now,
    get to it!


    ## Identifying Incidents


    Armed with your up‐to‐date, shiny, fire‐engine‐red, “Don''t Panic” folder, you''re
    ready to exercise your incident‐response plan. All you need is an incident! If
    you''re lucky, you''ll wait for a nice, long time, giving you all the training
    opportunities your team needs. If you''re not…


    How do you identify an incident? You monitor your environment. And by that I mean
    24 × 7 × 365. Every system. Every action. Every event. Monitor. Monitor. Monitor.
    For the average company, monitoring will produce several thousand lines'' worth
    of log entries and alerts from half a dozen systems (servers, firewalls, antivirus
    and antimalware software, switches, end points, etc.) or more. If your company
    is an above‐average technology consumer, you will be dealing with potentially
    millions of log entries and events. Attempting to correlate all this, much less
    make sense of it all, is not something humans can manage on their own.'
