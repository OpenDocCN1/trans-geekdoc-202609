- raw: 'Other times, you may be required to preserve the infected systems for evidence.
    That''s all fine and good if you have one server that''s infected; it''s a whole
    other story if you have 50 of them sneezing and wheezing with a virus. Complicating
    things further is virtualization. These days, you can have multiple virtual computers
    running on one physical one. Despite ironclad assurances from virtualization vendors
    that there can never be cross‐contamination across virtual machine boundaries,
    I remain a skeptic. I am a firm believer that if one person can build it, another
    can break it. So, I would not be surprised if a virus was created that could jump
    the virtualization boundary, despite whatever assurances you''ve been given. Remember,
    everyone lies.


    Finally, after evidence has been preserved, requirements have been met, all the
    *t*''s crossed and all the *i*''s dotted, there is the fun part of coordinating
    one or more infected systems. Not only do you need the incident‐response team
    on the same page, you need the whole organization to know that the following systems
    will go offline, for how long, what the impact may be, and so on and so forth.
    Depending on the number of systems, this can be an expensive, resource‐intensive
    exercise. Plus, you''ll make a whole new set of friends when you announce that
    all the passwords have been changed.


    Which brings us to the bad news.


    The only way to ensure that an infected system has been cured is to go to bare
    metal. This means that you need to completely and thoroughly wipe the infected
    system and rebuild it bottom‐up from clean installation media. There is no sugarcoating
    this. If you need to be 99.99 percent sure that the infection is gone, the only
    way to do it is by burning the box and reinstalling everything new.


    Why only 99.99 percent sure, even after a clean wipe? Because, word on the street
    has it that some agencies have developed malware that infects the actual hardware
    itself. Allegedly, this type of malware can infect the BIOS (basic input/output
    system) of a computer, or certain EPROM (erasable programmable read‐only memory)
    chips, such that even after you wipe the computer, the malware can reinstall itself.


    Of course, even wiping a single system is a time‐consuming exercise. Not only
    do you need to have the clean installation media at hand, you also need to account
    for configuration settings, clean backup availability, data synchronization when
    the system gets reinserted into production, etc. Now, multiply this times the
    number of infected systems. This is where your disaster recovery planning will
    shine. Having clean, recent, whole‐image backups per system will go a long way
    toward a rapid recovery.


    ## Incident Recovery


    With the incident treated, you are ready to bring your systems back online. There
    are several questions that need answering here, bridging the incident treatment
    process and final incident recovery.


    First, way before any incident, you must have considered the need for evidence
    preservation. If you are required to do forensic preservation, then you cannot
    wipe the infected equipment and rebuild. You''ll need replacement gear. Moreover,
    the documentation needs and requirements for evidence preservation are extensive.
    Your team will need to be familiar with all the laws and requirements for evidence
    handling, chain‐of‐custody documentation, proper evidence gathering. Your best
    bet is to retain a forensic firm to help you. They will interface with your attorney
    and your incident‐response team, and make sure that all the evidence is taken
    care of properly.


    Second, your incident‐recovery strategy hinges on your known values of MTD, your
    maximum tolerable downtime, the RPO, your recovery point objective, and the RTO,
    your recovery time objective. You have documented all of this before any incident,
    and they have governed your disaster recovery strategy. Here and now is where
    all this will be tested.


    As with all things, recovery from an incident will fall on a spectrum. There will
    be companies whose MTD is practically zero and will therefore have hot failover
    sites, air gapped (i.e., non‐Internet accessible) backup and archives, and multi‐timeline
    mirrors (mirroring strategy and the necessary equipment that creates isolated
    versions of mission‐critical systems over predefined timelines—for example a real‐time
    mirror, a day‐old mirror, a week‐old mirror, a month‐old mirror, and so on). Those
    companies will be using an army of resources to recover, because that''s what
    it''s worth to them, and frequently *is* what is required of them (think utilities,
    national security installations, water purification, air traffic control, etc.).


    Then, there are the majority of companies that can afford an MTD of hours or days.
    Their strategy is more appropriate to that timeline, meaning that your team has
    some runway to be able to restore systems to production. That is not to say that
    there is a company out there that doesn''t want the absolute minimum MTD. This
    is to say that the majority of companies are smart enough to not overpay for disaster
    recovery when they can tolerate a few days'' worth of an outage. There may be
    a question about if those smarts are developed from proper risk management–centric
    thinking, or from “Are you crazy? I am not paying all this money for backup!”
    reactions. Either way, most IT departments have in place a budget‐appropriate
    solution that has been implicitly accepted as appropriate.


    Lastly, there are (hopefully) a minority of companies that have not thought through
    any of this. For them, incident recovery is…challenging. Some may never recover
    and go out of business (consider malware that destroys all data in the absence
    of a backup). Some will pay a dear price in both time and money and get only a
    partial recovery. Either way, if you are reading this book, and you''re this far
    in and have realized that this paragraph describes your company, you have a lot
    of work to do, and you''d best hurry up!


    In our case, I am confident that you have evaluated and vetted your disaster recovery
    strategies and solutions as appropriate to your risk appetite, cybersecurity exposure,
    and so on, so we''ll accept that your environment falls squarely into the smart
    group of companies! While your team is restoring your production environment,
    you are making sure that they are following a pre‐rehearsed checklist that affirms
    proper and normal operation of all systems, following the communications and notifications
    protocols, and all departments are working together in incident‐response harmony.
    At the same time, you are making exhaustive notes on the incident that will help
    you in your post‐incident review and action plan.


    ## Post‐Incident Review


    There will be *incidents* and there will be *INCIDENTS!* Both will require your
    careful review. People call post‐incident review many different things (lessons
    learned, postmortem, etc.), but no matter what you choose to call it, the review
    process is essential to the evolution of your cybersecurity program and team skills.
    To begin with, you need an answer to a whole list of questions, starting with:


    *   *Who''s responsible for this outrage?* You should be able to answer this with
    confidence. And yet the question is more complex than it seems. It''s not about
    merely assigning a name to the attacker; it is about building a complete profile.
    Sometimes getting a name will be impossible. You will still be able to glean quite
    a bit from the tools used, origin, threat intelligence feeds, and plain old Internet
    searching. Try to build as good a profile as possible. Understanding your attackers,
    their motives, and their methods will help you prepare for the next attack.'
  fmt: '

    ## 事件处理与恢复


    有时，您可能需要保留受感染系统以作为证据。如果只有一台受感染的服务器，这没问题；但如果有 50 台服务器都在“打喷嚏、喘息”（感染病毒），那就是另一回事了。虚拟化使情况更加复杂。如今，一台物理机上可以运行多台虚拟计算机。尽管虚拟化供应商给出了铁一般的保证，声称虚拟机边界之间绝不可能发生交叉污染，但我仍持怀疑态度。我坚信：如果一个人能构建它，另一个人就能破坏它。因此，即使您得到了各种保证，如果出现一种能够跨越虚拟化边界的病毒，我也不会感到惊讶。请记住，每个人都会撒谎。


    最后，在证据得到保留、要求得到满足、所有细节都处理妥当后，便到了协调一台或多台受感染系统的“有趣”环节。您不仅需要事件响应团队步调一致，还需要让整个组织知晓：以下系统将下线、下线多久、可能产生什么影响，等等。视系统数量而定，这可能是一项昂贵且资源密集型的工作。此外，当您宣布所有密码已更改时，您将结识一群新“朋友”。


    这带来了坏消息。


    确保受感染系统被彻底治愈的唯一方法是“裸机重装”。这意味着您需要彻底擦除受感染系统，并从干净的安装介质自底向上重建。这无法粉饰。如果您需要 99.99% 确信感染已清除，唯一的办法就是“烧毁盒子”并全新重装所有内容。


    为什么即使干净擦除后也只能 99.99% 确定？因为坊间传闻，某些机构已开发出能感染硬件本身的恶意软件。据称，此类恶意软件可感染计算机的 `BIOS`（基本输入/输出系统）或特定的
    `EPROM`（可擦除可编程只读存储器）芯片，导致即使擦除计算机，恶意软件仍能自行重新安装。


    当然，即使擦除单个系统也是一项耗时的工作。您不仅需要准备好干净的安装介质，还需考虑配置设置、干净备份的可用性、系统重新投入生产时的数据同步等。现在，将此工作量乘以受感染系统的数量。这就是您的灾难恢复规划大显身手的地方。拥有每个系统干净、近期的全镜像备份将极大地加速恢复。


    ## 事件恢复


    事件得到处理后，您便准备好让系统重新上线。此处有几个问题需要解答，它们连接着事件处理过程与最终的事件恢复。


    首先，在任何事件发生之前，您就必须考虑过证据保留的需求。如果需要进行取证保留，则无法擦除受感染设备并重建。您将需要替代设备。此外，证据保留的文档需求和要求非常广泛。您的团队需要熟悉所有关于证据处理、保管链文档、正确证据收集的法律法规和要求。您最好的选择是聘请一家取证公司协助。他们将与您的律师和事件响应团队对接，确保所有证据得到妥善处理。


    其次，您的事件恢复策略取决于您已知的 `MTD`（最大可容忍停机时间）、`RPO`（恢复点目标）和 `RTO`（恢复时间目标）的值。您已在事件发生前记录了所有这些内容，它们指导了您的灾难恢复策略。现在正是检验这一切的时候。


    万事皆有光谱，事件恢复也不例外。有些公司的 `MTD` 实际上为零，因此它们拥有热备援站点、气隙（即非互联网可访问）备份和归档，以及多时间线镜像（镜像策略及必要设备，可在预定义时间线上创建关键任务系统的隔离版本——例如实时镜像、一天前的镜像、一周前的镜像、一个月前的镜像等）。这些公司将投入大量资源进行恢复，因为这对它们而言物有所值，且通常也是强制要求的（如公用事业、国家安全设施、水净化、空中交通管制等）。


    然后，是大多数公司，它们能容忍数小时或数天的 `MTD`。其策略更适应该时间线，意味着您的团队有一定缓冲时间将系统恢复至生产状态。这并非说没有公司想要绝对最小的
    `MTD`。而是说大多数公司足够聪明，不会在能容忍数天停机的情况下为灾难恢复过度买单。这些“聪明”是源于以风险管理为中心的正确思考，还是源于“你疯了吗？我才不花这么多钱买备份！”的反应，这可能有争议。无论哪种，大多数
    IT 部门都已部署了预算适宜的解决方案，并隐性地接受其为适当方案。


    最后，（希望是）少数公司完全未思考过这些。对它们而言，事件恢复极具“挑战性”。有些可能永远无法恢复而倒闭（考虑无备份时破坏所有数据的恶意软件）。有些将付出巨大的时间和金钱代价，却只能部分恢复。无论哪种，如果您读到这里，意识到这段话描述的正是您的公司，您有大量工作要做，最好赶紧行动！


    在我们的案例中，我相信您已根据风险偏好、网络安全风险敞口等，评估并验证了您的灾难恢复策略和解决方案，因此我们假设您的环境完全属于那群“聪明”的公司！当您的团队恢复生产环境时，您正确保他们遵循预演过的核对清单，确认所有系统正常运行，遵循沟通和通知协议，所有部门在事件响应中协同和谐。同时，您正详尽记录事件笔记，以助于事后复盘和行动计划。


    ## 事后复盘


    会有“事件”，也会有“重大事件！”两者都需要您仔细复盘。人们给事后复盘起了许多不同名字（经验教训、事后分析等），但无论您怎么称呼，复盘流程对网络安全计划和团队技能的演进至关重要。首先，您需要回答一整张问题清单，首要问题是：


    *   **“谁对这场灾难负责？”** 您应能自信地回答。但这问题比看起来复杂。它不仅仅是给攻击者起个名字；而是要构建完整画像。有时获取名字是不可能的。您仍可从所用工具、来源、威胁情报源和传统的互联网搜索中获取大量信息。尽量构建最完善的画像。了解攻击者、其动机和手法，将帮助您为下一次攻击做准备。

    '
