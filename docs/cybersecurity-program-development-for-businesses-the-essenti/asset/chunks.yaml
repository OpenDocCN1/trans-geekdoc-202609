- raw: 'There is one exception to the motives list, and that is the accidental insider.
    Someone who sincerely “didn''t know any better” and copied half the database to
    his private cloud so he could work from home! Or the one who fell for the phishing
    scam and clicked that link, or answered the fake call from “Microsoft” when that
    big‐bad‐red‐alert sign popped up while surfing, and so on. Regardless of whether
    the breach was deliberate or accidental, the damage is very real. But that doesn''t
    mean you should apportion blame in precisely the same way. Yes, you can trace
    the data exfiltration to accidental credential leakage, but is it really the victim''s
    fault? Is someone whose wallet was stolen responsible for the thief who used the
    access card? To be sure, a stolen card should be reported it in a timely way…but
    in the cyberworld, access is instantaneous. There is no “timely reporting” when
    you are a victim of social engineering and you click that link! Moreover, shouldn''t
    you be looking closely at your own policies and procedures, your own training
    protocols, and your data loss prevention systems? I would!


    This brings us to the final requirement: opportunity. Internal threat actors,
    whether intentional or not, require opportunity. How do they get it? If the organization
    has poor internal controls, that''s all the opportunity they''ll ever need. What
    do I mean by “poor internal controls”? The list is long! For example, if the employer
    has poor onboarding procedures, lax physical security, no training, etc., then
    the employee may well be able to access data that they shouldn''t. Similarly,
    there may be poor implementation of technical access controls, segregation of
    duties, even nonexistent data classification. Or the employer may have poorly
    trained or inexperienced managers in human resource–related matters (e.g., performance
    reviews, employee behavior monitoring and support, confidential employee help
    resources, etc.), or be lacking a sophisticated human resource function altogether.
    Who fits this last profile? The majority of small and mid‐sized businesses that
    are focused—day in, day out—on simple survival. Unfortunately, it is these same
    businesses that frequently cannot even afford to retain cybersecurity expertise,
    much less rolling out a data loss prevention system (DLP). They are the firms
    that need it most.


    There are sets of controls that can be deployed against insider threats, accidental
    or not. For now, we need to focus on the threat itself. How does it manifest?
    What are the things we need to know about the threat going in? These are similar
    questions that we need to ask about all threats, but the human element of the
    insider threat makes this analysis unique.


    The first question to ask is how can someone turn an employee into an insider
    threat? As it goes in the spy novels, so it goes with cybercrime: Nefarious agents
    turn your employees into assets. How are these employees identified and compromised?
    What are the signs you need to watch for?


    Well, Mr. Bond, you need to think like a criminal to catch one! How would you
    go about it? You''d identify the weakest links. Employees who are having problems
    would be on the top of the list, followed by disgruntled ones. How do you identify
    them? Just monitor their social media! People offer all of this information for
    free and to all. Someone''s getting divorced, someone else has cancer, a third
    person complains about her boss (you?)…. You''d be amazed what you can learn from
    people''s blogs, Twitter feeds, poorly secured Facebook pages, and so on.


    Need to get more sophisticated? Buy the information from any of the major data
    aggregators. They will gladly sell it, showing everything from credit status to
    health status and purchase trends.


    As we continue to think like our enemy, consider that you must pick your asset
    wisely. You need someone with enough privileges to get you what you need. Targeting
    the marketing associate because he just happened to be going through a nasty breakup
    won''t do: You need to target the right asset for the job. Think: Find the privilege,
    work the motive, ensure the opportunity.


    Now, reverse this strategy to protect yourself. Sensitize your employees to abnormal
    behavior. Is someone who never worked late spending endless nights in the office?
    Or surfing the file server in areas outside their work scope? Is somebody constantly
    making backups on USBs or accessing cloud storage? Perhaps somebody with no history
    of working at home is suddenly accessing the site remotely all the time?


    What about an employee who jumped ship from your competitor? Is the person still
    a bit *too* close with ex‐colleagues? Could he or she be a “plant”?


    Does an employee seem stressed out of his mind, or exceedingly paranoid of the
    boss or others? Is someone living large on an associate''s salary?


    These are just a sampling of behaviors that may be signs of impending trouble.
    Some of these you can turn into controls by institutionalizing them, for example,
    access controls, segregation of duties, multifactor authentication, geolocation
    sensitivity, behavioral patterning. Others are a matter of proper training and
    sensitivity toward your environment. All are important in managing the insider
    threat.


    ### External Threats


    According to a recent ISACA estimate, around 40 percent of the threats you may
    face will be internal, which leaves us with 60 percent coming from the outside.
    And, just like for their insider counterparts, you''ll need all the intelligence
    about them that you can get. Who are they? What are their motives?


    As we discussed in [Chapter 3](#c03.xhtml), the main external threat actors have
    fairly predictable corresponding motives ([Table 7.1](#c07.xhtml#c07-tbl-0001)).


    [**Table 7.1**](#c07.xhtml#R_c07-tbl-0001) Threat Agents and Motives


    | ****Actor**** || ****Motive**** |


    | --- | --- |


    | Cybercriminals || Money |


    | --- | --- |


    | Online social hackers || Money |


    | Cyberspies || Espionage |


    | Hacktivists || Activism |


    | Cyberfighters || Patriotism |


    | Cyberterrorists || Terrorism |


    | Script kiddies || Curiosity, thrill, fame, money |


    All the preceding are human actors (okay, there is some debate if they represent
    the *best* of the species, but still…), and well within the scope of your cybersecurity
    program. If you were looking at this from a business continuity or disaster recovery
    perspective, you would include accidents, and the only nonhuman actor: Mother
    Nature.


    How does motive drive an actor in your case? This question is as simple as recognizing
    your place in the world.


    Are you a country? It''s a safe bet that the threat agents are motivated by espionage,
    terrorism, activism, and right‐out warfare. Wouldn''t it be fun, for example,
    for one country to hack another country''s elections? Crazy talk, I know, but
    one can speculate!


    Are you a utility or part of the national infrastructure? Same drill! Crippling
    a utility can cause warfare‐scale chaos. Nation‐states and cyberterrorists would
    jump at the opportunity. As (bad) luck would have it, Ukraine''s electrical grid
    suffered just this kind of attack in 2016. It caused all sorts of chaos, as you''d
    expect, but to our knowledge no fatalities. The culprit? Well, the culprit remains,
    officially, unknown.


    Are you a Fortune 5000, a multinational, or massive conglomerate of some sort
    or another? You are fair game for espionage, sabotage, extortion, activism, and
    terrorism.


    Are you in health care or education? Then the motive is more than likely data
    exfiltration for identity theft, and money, although terrorism can''t be ruled
    out, especially in large health‐care institutions and major universities.


    Everyone else? Show me the money!'
  fmt: '

    意外内部人员是动机列表中的一个例外。这些人真诚地"不知情"，将半个数据库复制到私有云以便在家办公！或者是那些中了网络钓鱼骗局、点击了链接的人，又或者是在冲浪时弹出那个大大的坏坏的红色警报标志时，接听了来自"微软"的假电话，等等。无论泄露是故意的还是意外的，损害都是非常真实的。但这并不意味着你应该以完全相同的方式归咎责任。是的，你可以将数据渗透追溯到意外的凭证泄露，但这真的是受害者的错吗？钱包被盗的人要对使用访问卡的小偷负责吗？诚然，被盗的卡应该及时报告……但在网络世界中，访问是即时的。当你成为社会工程学的受害者并点击了那个链接时，根本不存在"及时报告"！此外，你难道不应该仔细审视自己的政策和程序、自己的培训协议以及数据丢失防护系统吗？我会的！


    这就引出了最后一个要素：机会。无论是否故意，内部威胁行为者都需要机会。他们如何获得机会？如果组织内部控制薄弱，这就是他们所需要的全部机会。什么是"薄弱的内部控制"？清单很长！例如，如果雇主的入职流程糟糕、物理安全松懈、没有培训等，那么员工很可能会访问他们不应该访问的数据。同样，技术访问控制、职责分离的实施可能很差，甚至不存在数据分类。或者雇主在人力资源相关事务（如绩效评估、员工行为监控和支持、机密员工帮助资源等）方面缺乏训练有素或经验丰富的管理人员，或者完全缺乏复杂的人力资源职能。谁符合最后这种情况？大多数专注于日复一日简单生存的中小企业。不幸的是，这些企业往往连聘请网络安全专家都负担不起，更别说部署数据丢失防护系统（`DLP`）了。它们正是最需要这些系统的公司。


    有一系列控制措施可以部署来应对内部威胁，无论是否故意。目前，我们需要关注威胁本身。它是如何表现的？我们需要了解关于威胁的哪些事情？这些是我们需要针对所有威胁提出的类似问题，但内部威胁的人为因素使这种分析变得独特。


    首先要问的问题是：如何将员工变成内部威胁？就像间谍小说里写的那样，网络犯罪也是如此：不法分子将你的员工变成资产。这些员工是如何被识别和利用的？你需要注意哪些迹象？


    好吧，邦德先生，你需要像罪犯一样思考才能抓住罪犯！你会怎么做？你会找出最薄弱的环节。有问题的员工会排在首位，其次是不满的员工。如何识别他们？只需监控他们的社交媒体！人们免费向所有人提供所有这些信息。有人离婚，有人得了癌症，第三个人抱怨她的老板（是你？）……你会惊讶于从人们的博客、`Twitter`
    动态、安全性差的 `Facebook` 页面等中能了解到多少信息。


    需要更复杂的手段？从主要数据聚合商那里购买信息。他们乐意出售，展示从信用状况到健康状况和购买趋势的所有内容。


    随着我们继续像敌人一样思考，考虑一下你必须明智地选择资产。你需要拥有足够权限来获取你所需内容的人。针对营销助理，仅仅因为他恰好正在经历一场糟糕的分手，是行不通的：你需要为这项工作选择合适的资产。思路是：找到权限，利用动机，确保机会。


    现在，反转这一策略来保护自己。让员工对异常行为保持敏感。从不加班的人是否在办公室度过无数个通宵？或者在超出其工作范围的区域浏览文件服务器？有人是否持续在 `USB`
    上制作备份或访问云存储？也许一个从未在家工作过的人突然一直在远程访问站点？


    跳槽来自竞争对手的员工怎么样？这个人和前同事是否仍然*过于*亲密？他或她会是"内应"吗？


    员工是否看起来压力大得发疯，或者对老板或其他人表现出过度的偏执？有人是否在助理的薪水上过着奢华的生活？


    这些只是可能预示着即将到来的麻烦的行为的部分示例。其中一些可以通过制度化转化为控制措施，例如访问控制、职责分离、多因素认证、地理位置敏感性、行为模式分析。其他则关乎适当的培训和对环境的敏感度。所有这些在管理内部威胁方面都很重要。


    ## 外部威胁


    根据 `ISACA` 最近的估计，你可能面临的威胁中约 40% 将是内部的，剩下 60% 来自外部。就像针对内部威胁一样，你需要获取关于它们的所有情报。他们是谁？他们的动机是什么？


    正如我们在[第 3 章](#c03.xhtml)中讨论的，主要外部威胁行为者具有相当可预测的相应动机（[表 7.1](#c07.xhtml#c07-tbl-0001)）。


    **表 7.1** 威胁行为者和动机


    | **行为者** | **动机** |

    | --- | --- |

    | 网络罪犯 | 金钱 |

    | 在线社交黑客 | 金钱 |

    | 网络间谍 | 间谍活动 |

    | 黑客活动家 | 行动主义 |

    | 网络战士 | 爱国主义 |

    | 网络恐怖分子 | 恐怖主义 |

    | 脚本小子 | 好奇心、刺激、名声、金钱 |


    所有上述都是人类行为者（好吧，有人争论他们是否代表物种中*最优秀*的部分，但仍然……），并且完全在你的网络安全计划范围内。如果你从业务连续性或灾难恢复的角度来看，你会包括意外事件，以及唯一的非人类行为者：大自然。


    动机如何在你的案例中驱动行为者？这个问题就像认识你在世界中的位置一样简单。


    你是一个国家吗？威胁行为者受间谍活动、恐怖主义、行动主义和赤裸裸的战争驱动，这几乎是稳赢的赌注。例如，一个国家黑客攻击另一个国家的大选会很有趣吗？我知道这是疯狂的想法，但可以推测一下！


    你是公用事业单位或国家基础设施的一部分吗？同样的道理！瘫痪公用事业可能引起战争规模的混乱。民族国家和网络恐怖分子会跳 at the opportunity。正如（坏）运气所致，乌克兰的电网在
    2016 年遭受了这种攻击。它造成了各种混乱，正如你所料，但据我们所知没有造成死亡。罪魁祸首？好吧，官方上罪魁祸首仍然未知。


    你是 `Fortune 5000` 企业、跨国公司或某种大型企业集团吗？你是间谍活动、破坏、勒索、行动主义和恐怖主义的公平目标。


    你在医疗保健或教育行业吗？那么动机极有可能是为了身份盗窃和金钱而进行的数据渗透，尽管恐怖主义不能排除，尤其是在大型医疗机构和主要大学中。


    其他所有人？给我看钱！

    '
  trans: '

    意外内部人员是动机列表中的一个例外。这些人真诚地"不知情"，将半个数据库复制到私有云以便在家办公！或者是那些中了网络钓鱼骗局、点击了链接的人，又或者是在冲浪时弹出那个大大的坏坏的红色警报标志时，接听了来自"微软"的假电话，等等。无论泄露是故意的还是意外的，损害都是非常真实的。但这并不意味着你应该以完全相同的方式归咎责任。是的，你可以将数据渗透追溯到意外的凭证泄露，但这真的是受害者的错吗？钱包被盗的人要对使用访问卡的小偷负责吗？诚然，被盗的卡应该及时报告……但在网络世界中，访问是即时的。当你成为社会工程学的受害者并点击了那个链接时，根本不存在"及时报告"！此外，你难道不应该仔细审视自己的政策和程序、自己的培训协议以及数据丢失防护系统吗？我会的！


    这就引出了最后一个要素：机会。无论是否故意，内部威胁行为者都需要机会。他们如何获得机会？如果组织内部控制薄弱，这就是他们所需要的全部机会。什么是"薄弱的内部控制"？清单很长！例如，如果雇主的入职流程糟糕、物理安全松懈、没有培训等，那么员工很可能会访问他们不应该访问的数据。同样，技术访问控制、职责分离的实施可能很差，甚至不存在数据分类。或者雇主在人力资源相关事务（如绩效评估、员工行为监控和支持、机密员工帮助资源等）方面缺乏训练有素或经验丰富的管理人员，或者完全缺乏复杂的人力资源职能。谁符合最后这种情况？大多数专注于日复一日简单生存的中小企业。不幸的是，这些企业往往连聘请网络安全专家都负担不起，更别说部署数据丢失防护系统（`DLP`）了。它们正是最需要这些系统的公司。


    有一系列控制措施可以部署来应对内部威胁，无论是否故意。目前，我们需要关注威胁本身。它是如何表现的？我们需要了解关于威胁的哪些事情？这些是我们需要针对所有威胁提出的类似问题，但内部威胁的人为因素使这种分析变得独特。


    首先要问的问题是：如何将员工变成内部威胁？就像间谍小说里写的那样，网络犯罪也是如此：不法分子将你的员工变成资产。这些员工是如何被识别和利用的？你需要注意哪些迹象？


    好吧，邦德先生，你需要像罪犯一样思考才能抓住罪犯！你会怎么做？你会找出最薄弱的环节。有问题的员工会排在首位，其次是不满的员工。如何识别他们？只需监控他们的社交媒体！人们免费向所有人提供所有这些信息。有人离婚，有人得了癌症，第三个人抱怨她的老板（是你？）……你会惊讶于从人们的博客、`Twitter`
    动态、安全性差的 `Facebook` 页面等中能了解到多少信息。


    需要更复杂的手段？从主要数据聚合商那里购买信息。他们乐意出售，展示从信用状况到健康状况和购买趋势的所有内容。


    随着我们继续像敌人一样思考，考虑一下你必须明智地选择资产。你需要拥有足够权限来获取你所需内容的人。针对营销助理，仅仅因为他恰好正在经历一场糟糕的分手，是行不通的：你需要为这项工作选择合适的资产。思路是：找到权限，利用动机，确保机会。


    现在，反转这一策略来保护自己。让员工对异常行为保持敏感。从不加班的人是否在办公室度过无数个通宵？或者在超出其工作范围的区域浏览文件服务器？有人是否持续在 `USB`
    上制作备份或访问云存储？也许一个从未在家工作过的人突然一直在远程访问站点？


    跳槽来自竞争对手的员工怎么样？这个人和前同事是否仍然*过于*亲密？他或她会是"内应"吗？


    员工是否看起来压力大得发疯，或者对老板或其他人表现出过度的偏执？有人是否在助理的薪水上过着奢华的生活？


    这些只是可能预示着即将到来的麻烦的行为的部分示例。其中一些可以通过制度化转化为控制措施，例如访问控制、职责分离、多因素认证、地理位置敏感性、行为模式分析。其他则关乎适当的培训和对环境的敏感度。所有这些在管理内部威胁方面都很重要。


    ## 外部威胁


    根据 `ISACA` 最近的估计，你可能面临的威胁中约 40% 将是内部的，剩下 60% 来自外部。就像针对内部威胁一样，你需要获取关于它们的所有情报。他们是谁？他们的动机是什么？


    正如我们在第 3 章中讨论的，主要外部威胁行为者具有相当可预测的相应动机（**表 7.1**）。


    **表 7.1** 威胁行为者和动机


    | **行为者** | **动机** |

    | --- | --- |

    | 网络罪犯 | 金钱 |

    | 在线社交黑客 | 金钱 |

    | 网络间谍 | 间谍活动 |

    | 黑客活动家 | 行动主义 |

    | 网络战士 | 爱国主义 |

    | 网络恐怖分子 | 恐怖主义 |

    | 脚本小子 | 好奇心、刺激、名声、金钱 |


    所有上述都是人类行为者（好吧，有人争论他们是否代表物种中*最优秀*的部分，但仍然……），并且完全在你的网络安全计划范围内。如果你从业务连续性或灾难恢复的角度来看，你会包括意外事件，以及唯一的非人类行为者：大自然。


    动机如何在你的案例中驱动行为者？这个问题就像认识你在世界中的位置一样简单。


    你是一个国家吗？威胁行为者受间谍活动、恐怖主义、行动主义和赤裸裸的战争驱动，这几乎是稳赢的赌注。例如，一个国家黑客攻击另一个国家的大选会很有趣吗？我知道这是疯狂的想法，但可以推测一下！


    你是公用事业单位或国家基础设施的一部分吗？同样的道理！瘫痪公用事业可能引起战争规模的混乱。民族国家和网络恐怖分子会跳 at the opportunity。正如（坏）运气所致，乌克兰的电网在
    2016 年遭受了这种攻击。它造成了各种混乱，正如你所料，但据我们所知没有造成死亡。罪魁祸首？好吧，官方上罪魁祸首仍然未知。


    你是 `Fortune 5000` 企业、跨国公司或某种大型企业集团吗？你是间谍活动、破坏、勒索、行动主义和恐怖主义的公平目标。


    你在医疗保健或教育行业吗？那么动机极有可能是为了身份盗窃和金钱而进行的数据渗透，尽管恐怖主义不能排除，尤其是在大型医疗机构和主要大学中。


    其他所有人？给我看钱！

    '
