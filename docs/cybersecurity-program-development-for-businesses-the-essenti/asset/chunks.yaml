    这本书是为他们和为你而写的：一位商业人士，无论是经营自己的企业，还是肩负起保护你所在企业（无论规模大小）安全的责任。你不想任由专家们用你听不懂的术语在你头顶和周围谈论。你想参与对话；你想知道自己将面临什么。你也是一位关心隐私的个体。你对新闻中轰炸式报道的网络攻击、黑客等感到震惊，并希望不再为此感到无助。你也是一位实用主义者，知道不能整天被恐吓得躲藏起来、因不作为而瘫痪，或因合规和网络防护的成本而不堪重负。


    这本书将循序渐进地为你应对这一切做好准备。我们将共同开发你的网络安全计划，利用本书提供的信息，并通过回顾不同行业和企业的案例研究。


    说到案例研究，我们需要一个案例研究免责声明。本书中呈现的案例研究汇总自我们的工作，以及慷慨分享经验的同事们的工作，其中一些作为具名贡献者。正如你所料，所有名称、行业和地域均已更改，以保护客户的匿名性。目标是在保护每位客户身份、尊重其隐私和保密性的前提下，从每个案例中提炼核心教训。你会发现在全书中穿插着这些案例研究，尤其是在我们深入探讨网络安全计划开发的具体细节时。


    我最初为这本书拟定的标题化用了伟大的斯坦利·库布里克及其电影《*奇爱博士*》的梗。我原想叫它《*如何停止担心网络安全并学会爱上黑客！*》。Wiley 的明智之人劝导我理智一些，并将其改得更好，但我的目标始终如一。


    我希望当你读完时，将不再为网络安全担忧，并已学会爱上黑客！


    # 关于作者


    我出生于希腊雅典。高中毕业后，我选择去美国学习物理和计算机科学。我在纽约州上部的布罗克波特学院完成了学业。我在布罗克波特的岁月塑造了我作为一个人、一名科学家和一名专业人士。我对塑造我人生的敬业师长心怀的感激与敬意，足以写满几本书，但那是另一个时候的事了。


    获得理学学士学位后，我成为纽约州罗切斯特斯特拉特福德学校的计算机科学讲师和计算机系统经理。在罗切斯特理工学院和罗切斯特大学短暂攻读研究生后，我搬到纽约市，担任普拉特学院的学术计算总监。在那里，在信息技术副总裁的领导下（当时还没有“首席信息官”），我负责建设和管理四个计算卓越中心，每个中心专注于一个特定学科（艺术、建筑、工程和信息科学）。随后，我被聘为纽约市房地产管理和开发商
    O''Connor 集团的信息技术副总裁。然后，在里根经济衰退的中期，我决定没有比现在更好的时机来创办自己的公司，于是我在 1989 年创业。


    自此我一直经营自己的公司，身边围绕着每天都教会我更多东西的合伙人和同事，我们共同提供广泛的 IT 咨询服务。我有幸与优秀的客户合作，参与精彩的业务和技术转型项目，并与突破界限、开发出色业务解决方案的团队协作。我亲历了计算机科学惊人的进步，这些如今已成传闻：我经历过
    BitNet 时代，发送电子邮件并看着消息从节点跳转到节点。我惊叹于格式化 IBM 新款个人电脑的第一批 10MB 硬盘。我没日没夜地往第一批 Mac 电脑里塞软盘。我练就了搬运
    Compaq “便携式”电脑的肌肉，它因太重而被昵称为“可搬运的”。我用过手提箱大小的传呼机和手机。我订阅过 CompuServe 和 AOL，至今还保留着一个能用的
    Hayes 14.4 调制解调器。


    贯穿始终，我始终对安全、隐私和数据保护着迷。甚至在“网络安全”成为一个词汇之前，我就坚持我们设计和管理的站点必须实施适合业务的计算机安全和灾难恢复。也许是因为当时我的合伙人
    George 是个计算机病毒收藏家（他至今仍收藏着）。也许是因为我骨子里仍是希腊人，天生谨慎且重隐私。无论原因是什么，我总会问：“如果‘这个’泄露了会怎样？”或“我们能多快恢复运行？”我的任何顾问都会告诉你，即使现在，他们入职接受的第一课就是“不检查备份是职业生涯终结的错误。”


    在作为 IT 治理和网络安全管理从业者数十年后，我决定使其正规化，加入了信息系统审计与控制协会（ISACA），这是一个成立于 1969 年的独立、非营利、全球性协会，致力于“全球公认的行业领先的信息系统知识和实践的开发、采纳和应用”。加入
    ISACA 是我做过最明智的事情之一。通过 ISACA，我在两个领域获得了认证：一是 IT 治理，成为企业 IT 治理认证专家（CGEIT）；二是网络安全，成为注册信息安全经理（CISM）。截至撰写本书时，我自豪地在纽约分会这两项考试中均获得最高分，并位列全球
    CISM 考试前 5%、CGEIT 考试前 10%。


    # 致谢


    这本书反映了一段漫长的个人和职业历程。在行业摸爬滚打 30 多年里，我有幸结识了数百位专业人士、专家、合伙人、客户和供应商，他们塑造了我的思维，丰富了我的经历，磨练了我的专长。从我的创业合伙人
    George Whelan，他近乎虔诚地收集并保存在软盘上的活体计算机病毒；到 Jay Ranade 这样的导师，他忘掉的知识比我一辈子学到的还多；再到与我合作的客户，以及不懈努力解决问题的员工，我对每一个人都欠下无法用致谢偿还的感激之情。因此，我首先为我的疏漏道歉。那完全是我自己的过失。


    首先，我要感谢我们的客户，我们真正的成功合伙人。每一天，我们都荣幸且自豪能成为你们的盟友，为你们的成功贡献力量。我们因你们每天教会我们的一切而感到谦卑。如果不单独感谢
    Hoffman 家族——Andrew、Mark 和 Steve，他们自创办公司以来就是忠实的支持者和导师；4A 协会的高管领导层，他们定义并践行了真正的成功合伙关系；Allegaert
    Berger and Vogel 律师事务所的创始合伙人 Chris、David 和 Michael，感谢他们对我们的信任、忠诚，以及在顺境逆境中给予的明智建议；LaSalle
    Academy 的校长 Dr. Cathy Guerriero 及其团队，感谢他们注入创造力和活力，并在以 1000 英里/小时的速度奔跑时仍抽出时间倾听；最后是
    Packer Collegiate Institute 的领导团队——Bruce Dennis、Elizabeth Winter 和 Jim Anderson，感谢他们的信任、投入，并提醒我们如何在变革面前勇敢前行。


    '
