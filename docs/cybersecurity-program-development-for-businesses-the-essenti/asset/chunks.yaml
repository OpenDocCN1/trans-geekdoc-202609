    # 致谢


    In the same breath, I want to thank my own partners and associates, whose incredible
    expertise, loyalty, dedication, skills, empathy, and personal engagement make
    our clients'' success possible. They are, alphabetically: Anna Murray, Atsushi
    Tatsuoka, Frank Murray, Greg Andrews, Haleigh Westwood, Jonathan Ongvano, Justin
    Schroeder, Leon Tchekmedyian, Pedro Garrett, Protus Miyogo, Sotos Antoniades,
    Steve Vance, Thomas Hussey, Yeimy Morel, and Zachary Tereska. Thank you for all
    you do, day and night, and thank you for allowing me to shut my door and write,
    write, write! Without your help, this book would still be on the drawing board.


    Whenever there is a book, there is an editor and a publisher. I have been the
    luckiest of authors to have the best in both. First, my eternal gratitude to the
    amazing Hilary Poole, my editor, coauthor, and friend of countless years and as
    many books. You are simply amazing. I refuse to go next to a keyboard unless I
    am reassured you''ll edit the outcome. Thank you!


    To everyone at John Wiley & Sons, one of the most professional and exceptional
    publishers in the world, and especially to my executive editor, Sheck Cho, captain
    and commander extraordinaire; Judy Howarth, manager of content enablement and
    operations; and my developmental editor, Christina Verigan. This book is as much
    yours as it is mine, and I am grateful for all your help, guidance, and support.


    To all the cybersecurity and governance professionals around the world, working
    tirelessly in the field, in academia, in research institutions, in government
    agencies, and militaries, this book pales in comparison to your achievements every
    day. Without your endless efforts in breaking new ground, expanding and enhancing
    our scientific understanding, and guiding us through the turbulent and terrifying
    waters that cybersecurity is, we would be lost. Your work represents the lighthouse
    that helps us navigate, and if I aspire to anything, it is for this book to aid
    in reflecting your light, interpreting your guidance, and adding wind to the sails.


    To the many international organizations that help all practitioners learn, hone,
    and apply their craft, as well as develop the frameworks we depend on, my gratitude
    for your ongoing contributions, tireless curation, and unending support. I must
    particularly single out (ISC)², CERT, ENISA, ISACA, ISECOM, ISO, ISSA, OECD, OWASP,
    and SANS, with my apologies for omitting the many other deserving organizations
    worldwide. My specific thanks to Dr. Christos K. Dimitriadis, chairman of the
    ISACA board of directors, and Matt Loeb, ISACA CEO, for their continuous support,
    and the ISACA New York chapter for making the chapter a home away from home for
    me and countless professionals in the New York metro area.


    To the book''s direct contributors and supporters, Anna Murray, F. Charlene Watson,
    Frank Downs, and Mark Thomas, thank you for allowing me to include your expertise
    and to share it with my audience. This book is richer and more useful because
    of your contributions. And to Mike Barlow, an early supporter and advocate for
    the book, as well as an accomplished writer in his own right, thank you for everything.
    Your guidance, advice, and support mean the world to me.


    Finally, to Anna Murray, a name that keeps on repeating in these acknowledgments,
    but from where I sit, not enough! You are the most brilliant, expert, capable,
    tenacious, fierce, loving, accepting, and giving professional and writer I know!
    Every day I thank my lucky stars that brought you to my life as my partner in
    the business and my partner in life. You are, and always will be, the brightest
    star in the dark of night, guiding me home. Thank you.


    # CHAPTER 1: Understanding Risk


    If you''re reading this book, I''d hazard a guess that you''ve read some of the
    doom‐and‐gloom cybersecurity books out there as well. There are many, and many
    are great (see the bibliography for suggestions). What''s more, I am sure you
    have had your fill of statistics. Dreadful statistics showing how cybercrime is
    increasing by the day. I''ll include some of those, too, just to satisfy any morbid
    curiosity left in you, but they are essentially useless. By the time the ink is
    dry on these pages, the numbers have changed. For the worse.


    ## How Much Is It Worth to You?


    In the misty past, a person''s most valuable possessions were things he could
    see: his castle, gold, tapestries, even his heirs! Their value was tied to their
    physical existence.


    Today, the concept of `value` has expanded beyond tangibles to include intangibles
    such as data, intellectual property, and reputation. As a matter of fact, many
    intangibles hold more value than tangibles. Consider, which is more important:
    an artisanal pizza or the `recipe` for the artisanal pizza? It''s no accident
    that the phase following the Industrial Revolution has been nicknamed the Information
    Revolution.


    The rise of intangible valuables affects every individual as well as businesses
    of all sizes. These things of value that individuals and businesses create are—like
    all things of value—coveted by others and therefore warrant your protection. So,
    just like you would protect your valuable jewelry, you must protect your valuable
    data. It''s a simple concept.


    What is interesting in this analogy is the assumption that we all share a common
    understanding of what is `of value`. You certainly have no problem intuiting that
    a set of diamond earrings is valuable and should therefore be stored in a secure
    place. Which place and how secure? That, too, is straightforward to understand.
    We have an innate sense of value to guide us in these decisions—something that
    tells us that a $300 pair of earrings is safe in the jewelry box in the apartment
    while a $30,000 pair of earrings is best protected in a bank''s safe deposit box.
    Easy to understand and easy to make a value judgment on.


    We make these types of judgments every day, and we''re very good at it. We understand
    what''s of value, and we understand the risks to this value:


    *   Earrings? Theft!

    *   Property? Fire!


    It ends up that we are very good at making complex risk management decisions on
    a daily basis. Who knew?


    ## Risk! Not Just a Board Game


    Consider this situation: It is 11:00 at night, and you just finished dinner with
    friends at your favorite restaurant. Walking to your car, you reach an intersection
    and see that the walk signal is red. You look left. You look right. You see a
    car down the block, shrug it off, and cross the street. No problem.


    Now, let''s change this scenario a little. Same story, only this time you are
    pushing a stroller with your baby in it. What''s the decision now? Do you cross
    the street or wait for the signal to change? My bet is you wait.


    We just stumbled on the concept of `risk acceptance`, which will prove to be of
    real importance in the pages that follow. The bottom line is that we all live
    with risk every single day of our lives. We constantly make decisions about risk
    and, when we''re done evaluating, we take action signifying our acceptance of
    this risk.


    In the example just suggested, in one case you accepted the risk that you can
    cross the street against the light, and in the other case, when you had your baby
    along, you did not. How does this translate to the cyberworld? In some cases,
    we accept the risk of having our information available out there (e.g., when using
    Facebook, Instagram, Swarm, and the like), and in others we do not (e.g., when
    we are using our credit card or revealing our medical records).

