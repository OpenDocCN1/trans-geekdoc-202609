- raw: "In the same breath, I want to thank my own partners and associates, whose\
    \ incredible expertise, loyalty, dedication, skills, empathy, and personal engagement\
    \ make our clients' success possible. They are, alphabetically: Anna Murray, Atsushi\
    \ Tatsuoka, Frank Murray, Greg Andrews, Haleigh Westwood, Jonathan Ongvano, Justin\
    \ Schroeder, Leon Tchekmedyian, Pedro Garrett, Protus Miyogo, Sotos Antoniades,\
    \ Steve Vance, Thomas Hussey, Yeimy Morel, and Zachary Tereska. Thank you for\
    \ all you do, day and night, and thank you for allowing me to shut my door and\
    \ write, write, write! Without your help, this book would still be on the drawing\
    \ board.\n\nWhenever there is a book, there is an editor and a publisher. I have\
    \ been the luckiest of authors to have the best in both. First, my eternal gratitude\
    \ to the amazing Hilary Poole, my editor, coauthor, and friend of countless years\
    \ and as many books. You are simply amazing. I refuse to go next to a keyboard\
    \ unless I am reassured you'll edit the outcome. Thank you!\n\nTo everyone at\
    \ John Wiley & Sons, one of the most professional and exceptional publishers in\
    \ the world, and especially to my executive editor, Sheck Cho, captain and commander\
    \ extraordinaire; Judy Howarth, manager of content enablement and operations;\
    \ and my developmental editor, Christina Verigan. This book is as much yours as\
    \ it is mine, and I am grateful for all your help, guidance, and support.\n\n\
    To all the cybersecurity and governance professionals around the world, working\
    \ tirelessly in the field, in academia, in research institutions, in government\
    \ agencies, and militaries, this book pales in comparison to your achievements\
    \ every day. Without your endless efforts in breaking new ground, expanding and\
    \ enhancing our scientific understanding, and guiding us through the turbulent\
    \ and terrifying waters that cybersecurity is, we would be lost. Your work represents\
    \ the lighthouse that helps us navigate, and if I aspire to anything, it is for\
    \ this book to aid in reflecting your light, interpreting your guidance, and adding\
    \ wind to the sails.\n\nTo the many international organizations that help all\
    \ practitioners learn, hone, and apply their craft, as well as develop the frameworks\
    \ we depend on, my gratitude for your ongoing contributions, tireless curation,\
    \ and unending support. I must particularly single out (ISC)², CERT, ENISA, ISACA,\
    \ ISECOM, ISO, ISSA, OECD, OWASP, and SANS, with my apologies for omitting the\
    \ many other deserving organizations worldwide. My specific thanks to Dr. Christos\
    \ K. Dimitriadis, chairman of the ISACA board of directors, and Matt Loeb, ISACA\
    \ CEO, for their continuous support, and the ISACA New York chapter for making\
    \ the chapter a home away from home for me and countless professionals in the\
    \ New York metro area.\n\nTo the book's direct contributors and supporters, Anna\
    \ Murray, F. Charlene Watson, Frank Downs, and Mark Thomas, thank you for allowing\
    \ me to include your expertise and to share it with my audience. This book is\
    \ richer and more useful because of your contributions. And to Mike Barlow, an\
    \ early supporter and advocate for the book, as well as an accomplished writer\
    \ in his own right, thank you for everything. Your guidance, advice, and support\
    \ mean the world to me.\n\nFinally, to Anna Murray, a name that keeps on repeating\
    \ in these acknowledgments, but from where I sit, not enough! You are the most\
    \ brilliant, expert, capable, tenacious, fierce, loving, accepting, and giving\
    \ professional and writer I know! Every day I thank my lucky stars that brought\
    \ you to my life as my partner in the business and my partner in life. You are,\
    \ and always will be, the brightest star in the dark of night, guiding me home.\
    \ Thank you.\n\n# CHAPTER 1  \n\nUnderstanding Risk\n\nIf you're reading this\
    \ book, I'd hazard a guess that you've read some of the doom‐and‐gloom cybersecurity\
    \ books out there as well. There are many, and many are great (see the bibliography\
    \ for suggestions). What's more, I am sure you have had your fill of statistics.\
    \ Dreadful statistics showing how cybercrime is increasing by the day. I'll include\
    \ some of those, too, just to satisfy any morbid curiosity left in you, but they\
    \ are essentially useless. By the time the ink is dry on these pages, the numbers\
    \ have changed. For the worse.\n\n## How Much Is It Worth to You?\n\nIn the misty\
