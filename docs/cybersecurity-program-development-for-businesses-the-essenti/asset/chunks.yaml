    # Threat Motives


    There is no specific order based on industry or motive du jour. Clearly money
    is a major motivating force, with cybercrime expected to fetch upward of two trillion
    dollars by 2020. For that matter, now that we are in the era of cybercrime-as-a-service,
    your competitor, or a nasty nation-state, can buy the services of hackers to achieve
    their ends. They may want to steal your intellectual property, sabotage your operations,
    or to commit an act of terror—the hackers don''t care as long as they get paid.


    Given the absence of any other meaningful ranking, let''s look at the main motives
    alphabetically.


    ## Activism/Terrorism


    This is very tricky. After all, one man''s activism is another''s terrorism and
    vice versa. Is Edward Snowden a patriot? A traitor? An activist? Or a terrorist?
    What about Julian Assange and WikiLeaks? What about Anonymous? Or what about the
    Guardians of Peace, who hacked Sony Corporation?


    They all framed their actions in some type of social justice narrative, but we
    don''t always know the true motives. In many big hacking cases, experts suspect
    that lurking behind motives of activism (or terrorism) is a nation-state, terrorist
    organization, or clandestine service that funds and directs the attacks.


    Are you a *likely* target of activists or terrorists? There''s actually no easy
    answer. You need to weigh carefully your industry and your role in the world.
    Even then, what makes terrorism horrific is that they prey on unsuspecting civilians,
    who all too frequently pay the ultimate price.


    ## Espionage


    Tinker, tailor, soldier, spy? No more—those days are over. Today, most acts of
    espionage, be they corporate- or state-sponsored, are done over the Net. The motives
    behind espionage have not changed, but the methods have. The type of attack motivated
    by espionage is typically advanced and persistent. The skill sets involved are
    many and complex. And the effects, when successful, can be catastrophic for the
    victims. Are you at risk? If your intellectual property is of value at the international
    level, then yes. If you are involved in critical infrastructure, communications,
    energy, or government, then absolutely.


    ## Money/Extortion


    From internal threats to ransomware to denial-of-service attacks, take your pick,
    money ranks as the highest motive behind the majority of cyberattacks. The methods
    are many, the barriers to entry low and getting lower, especially with cybercrime-as-a-service.
    Are you at risk? One guess: Yes! You are.


    ## Patriotism


    Whether they are called "resistance fighters" or "commandos," the result is the
    same: These hacker armies perform what they believe to be their patriotic duty
    by developing and unleashing sophisticated, advanced, persistent threat-type attacks
    at "the enemy." Their activities are typically funded—overtly or covertly—by nation-states.
    If you have any nation-states that consider you the enemy, then, of course, you''re
    at risk. But if you''re even perceived to be "working with" or "working for" someone
    else''s enemy, you are also at risk. For example, a small manufacturing facility
    that makes those pretty camouflage uniforms is definitely on the list.


    ## Revenge


    It''s not business, it''s personal—and frequently, very ugly. Hell hath no fury
    like an employee scorned, or one who is, as Freud might put it, a bit "kooky."
    Who is at risk? Anyone with employees. In 2016, ISACA ranked insider threats second
    only to malware. Revenge, by the way, doesn''t have to mean destruction of property.
    It may well mean data exfiltration and sale to your competitor, or leaking it
    out to the public. Be afraid; be very afraid.


    ## Trolling/Cyberbullying


    A very dark motive, indeed. These are typically individuals who target other individuals,
    frequently (but not always) famous or prominent in some way, and deliver attacks
    designed to besmirch their reputation or cause outrage. There have been cases
    in which this has jumped from the cyberworld to the physical world, just as there
    have been cases of cyberbullying among young students with horrifying results.
    Are you at risk? There is no easy way to tell—worse yet, there aren''t many effective
    controls against a personalized troll attack. If you are in the public eye, and
    depending on the extent and role, the chances are that you may fall victim of
    trolling.


    ## Vanity


    Typically, these are hackers who want to make, or maintain, their name and status
    in the media. Their goal is fame and notoriety. Their targets are not picked based
    on some ideology, although they may claim otherwise. The target is picked on their
    potential for making news, or some real or perceived hacker challenge. Are you
    at risk? It depends on your visibility as a business or institution, or—worse—personal
    fame. If your company or its staff is frequently in the spotlight, you should
    expect to attract vanity-driven hackers.


    ## Warfare/Sabotage


    Stuxnet was the first and best-known cyberweapon, used against Iran''s nuclear
    facility, but there is little doubt that there are many more just like it in the
    arsenal of most nation-states. The Ukrainian infrastructure, for example, was
    another victim of such an attack in December 2016. Obviously, these are acts executed
    by well-funded, state-sponsored and -controlled hacker armies. You are at risk
    if you''re in any business supporting critical infrastructure, and, of course,
    if you are working in any government institution.


    # Threat Rankings


    Your next task is to rank the preceding list in terms of which actors and motives
    are most likely to be engaged in your world. You have a good sense of your assets,
    both at the enterprise level and at the business unit level, so spend some time
    and think: Who on this list is the most likely agent for an attack? Assign a numerical
    value from 1 to 4, ranging from "least likely" to "somewhat likely" to "very likely"
    to "extremely likely." Regarding my bias and recommendations, I''d consider the
    insider as a very likely agent, and money or extortion as the primary motive.


    You now have an understanding of the threat agents and their motives as they might
    apply to your organization. This is an excellent first step, but you''re far from
    finished. Knowing the *who* and the *why* of cyberattacks is not enough. You also
    need to know the *how* and the *when*.


    First, the *how*. One of the best places to look for this type of information
    is the European Union Agency for Network and Information Security (ENISA). They
    have been putting together an annual threat landscape and trends report since
    2012. At this stage in your process, this is required reading. The reports are
    excellent, succinct, and easily understood by both executives and cyberprofessionals
    alike. At the time of this writing, the most recent report was the 2015 edition,
    published in January 2016. In it, ENISA ranks the top 15 threats and compares
    them year over year with 2014. The top 10 are shown in [Table 7.2](#c07.xhtml#c07-tbl-0002).


    **Table 7.2** ENISA Table: Overview and Comparison of Cyberthreat Landscapes 2015
    and 2014


    | Top Threats 2014 | Top Threats 2015 | Change in Ranking |

    | --- | --- | --- |

    | 1. Malicious code: Worms/Trojans | 1. Malware | Same |

    | 2. Web-based attacks | 2. Web-based attacks | Same |

    | 3. Web application/Injection attacks | 3. Web application attacks | Same |

    | 4. Botnets | 4. Botnets | Same |

    | 5. Denial of service | 5. Denial of service | Same |

    | 6. Spam | 6. Physical damage/theft/loss | Increasing |

    | 7. Phishing | 7. Insider threat (malicious/accidental) | Increasing |

    | 8. Exploit kits | 8. Phishing | Decreasing |

    | 9. Data breaches | 9. SPAM | Decreasing |

    | 10. Physical damage/theft/loss | 10. Exploit kits | Decreasing |

    '
