- raw: 'At each level of the organization, these policies, standards, procedures,
    and guidelines must be actionable, complied with, measured, tested, and reevaluated
    at least annually. All members of the organization must receive regular cybersecurity
    awareness training, with mandatory attendance and followup quizzes. Specifics
    of compliance, metrics, and reward and penalty policies will vary from company
    to company, but ultimately one thing must be unambiguously clear to all: These
    cybersecurity policies are mandatory, and just like any human resource policy
    (e.g., nondiscrimination), are enforced rigorously across the board.


    When it comes to the *technology* part, things can be both complicated and complex.
    Anna Murray, in her excellent book, *The Complete Software Project Manager*, explains
    the difference between simple, complicated, and complex projects—her example is
    the difference between shoveling snow (lots of hard work but relatively simple),
    assembling an IKEA desk (It''s complicated. Trust me!), and performing open heart
    surgery (Complex. Really complex!). In our case, developing and deploying a defense‐in‐depth
    strategy for the technology component, we will have to deal with both the complicated
    and the complex.


    I''ll go on record by saying that I believe that you can deal with the complicated:
    I am confident that you can put together an IKEA desk. I do, however, feel that
    you''ll need to partner up with a surgeon for the open‐heart surgery part. There
    is no escaping it. The subject matter becomes very specialized and it requires
    experience and expertise.


    Your role will be to review and prioritize the assets that need to be protected
    by criticality. The role of your surgeon will be to match those up with a set
    of controls based on threat surface (how vulnerable is the asset) and control
    resilience (how well can the control protect it).


    The goal is to have several controls protecting each asset. These controls will
    be placed either in sequence (Control‐A ‐> Control‐B ‐> Control‐C ‐> Asset, that
    is, the concentric‐circle view) or layered across system function (User Controls
    ‐> Operating System Controls ‐> Application Controls ‐> Database Controls ‐> Hardware
    Controls).


    You will also need both to think about using overlapping controls. What this means
    is that you want to place different controls in parallel, protecting the same
    asset.


    Then you should consider asset segregation. That is when specific assets “live”
    segregated from one another. The accounting systems are on an isolated server
    on an isolated network segment from the file servers, and those are separated
    from the human resources systems, etc.


    When you''re done with asset segregation, you need to think about segregation
    of duties. This is very important. You should confirm that the custodians of your
    critical assets do not have unnecessarily elevated privileges. For example, there
    is no reason why the database administrator needs to have system administrator
    privileges, and vice versa.


    Speaking of privilege, the same kind of thinking applies for your users. At a
    minimum, you should implement least‐privilege, role‐based access. For instance,
    the accounts payable person cannot run the accounts receivable module. Different
    roles mean different access privileges. The more secure and sensitive the site,
    the more elaborate this can become. For example, there are mandatory access controls,
    context access controls, discretionary access controls, rule‐based access controls,
    location‐based access controls, and so on and so forth. The majority of businesses
    will be well served with clearly defined and religiously maintained simple role‐based
    access. The religiously maintained part means that when the aforementioned accounts
    payable employee gets promoted to accounts receivable, her role is to be immediately
    changed by first eliminating the accounts payable rights, and then granting the
    accounts receivable ones. Were you to simply add the additional rights, you would
    have a user with unnecessarily elevated access privileges, creating an opportunity
    for mischief!


    Finally, be aware that the introduction of controls themselves may introduce unplanned
    vulnerabilities. After all, you are introducing all sorts of technology layers,
    and we all know that not all technologies play well with one another. There are
    cases that one control rendered another one inoperative or ineffective. Make sure
    you test, check, and retest. Avoid the deployment of any control that depends
    on another one.


    And don''t forget: What happens when a control does fail? (Yes, think in terms
    of *when*, not *if*.) You need to decide how they behave not only while working,
    but also while dead. Do your controls fail open or fail secure? As an example,
    consider that failing secure can be life‐threatening in certain circumstances:
    if, say, your access doors to the computer center fail secure (i.e., all doors
    automatically lock) while there is a fire!


    Ideally, all these practical considerations need to be addressed before any control
    is turned on. But this is not an ideal world. The possibility exists that you
    are not starting from a blank slate and that some, or many, controls are already
    in place. You will therefore need to examine each control and how it measures
    up both to the defense‐in‐depth strategy and to the practical considerations previously
    discussed. Learn from what you discover and adjust accordingly. Repeat this review
    at least annually. Controls become obsolete, threats change, systems and people
    change, and so does risk appetite, strategy, and company needs.


    The thing to always remember, your go‐to safe bet, is to have as many independent
    and automated controls as necessary. Nothing more and nothing less. The main reason
    you should strive for automation and independence of controls is the third item
    in the people‐technology‐operations triad.


    No two companies operate alike, but across companies operations share a common
    set of responsibilities that ensure the smooth running of the value‐producing
    engine. Operations are the heartbeat of your company. You always want it to be
    nice and steady, never erratic, and God forbid never arrested!


    For your defense‐in‐depth strategy to be an operational success, you need to keep
    things as simple as possible, not overburdening operations with anything more
    than what they are already doing, and make sure you have the following one key
    ingredient.


    ## Communications


    As you can imagine, operations people have a tall order to fill. Depending on
    the size of your company, and in terms of cybersecurity always, operations will
    include members of risk management, audit, IT, cybersecurity, and HR.


    If you are a company of one, well…the good news is your environment is simpler.
    The bad news is, you still need to make sure you have your finger on the pulse
    of all this, which will typically mean being diligent with the vendors that provide
    you all these services.


    The larger the company, the more complex the operational food chain. The more
    complex the operations, the more essential the need for proper change management,
    strong communications, and cross‐departmental engagement. If there is one takeaway
    that I can offer you from my experience evaluating different companies'' operations,
    it is this: The minute you uncover a communications block in operations, pull
    the emergency break and address it. If you don''t, your attackers will.


    In the absence of communications, there can be no successful business strategy
    implementation, much less a successful cybersecurity defense‐in‐depth strategy.
    You need to be comfortable in sitting down with your operations teams and discuss
    options, explain issues, and engage them directly in developing your specific
    defense‐in‐depth strategy.'
