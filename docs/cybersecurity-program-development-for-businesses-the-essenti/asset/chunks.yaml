    this work, after endless hours of assessing, valuating, cataloging, classifying,
    testing, planning, deploying, and educating…now I have to develop an incident‐response
    plan on top of it all? You''d think we''d be protected to the max!” He groaned.
    “Can''t I at least farm it out?”


    “Well, that depends….”


    I call this incident‐response planning despair, the dreaded IRPD! It''s dreaded
    partly because it comes toward the end of developing a cybersecurity program,
    and partly because it is so anticlimactic. It is true that a lot of work, a lot
    of hard work, has brought you to this point. Now, you are asked to develop a plan
    for when all your work has failed. Despite it all, an incident has happened, and
    you need to have a plan to pick up the pieces.


    In the 2015 movie *The Martian,* the main character teaches a group of aspiring
    astronauts. He tells them:


    > …At some point, everything''s gonna go south on you…everything''s going to go
    south and you''re going to say, “This is it. This is how I end.” Now you can either
    accept that, or you can get to work. That''s all it is. You just begin. You do
    the math. You solve one problem…and you solve the next one…and then the next.
    And if you solve enough problems, you get to come home.


    Honestly, if there is a better description about what an incident‐response plan
    really looks like, I have not found it!


    ## Incident-Response Planning: Not Just a Good Idea—It''s the Law!


    You may have heard of `FISMA`. It stands for Federal Information Security Management
    Act. It was signed into law in 2002, and it essentially requires all federal agencies
    to develop an incident‐response plan.


    I know what you''re*. (No, I am not kidding. That''s the title. Fantastic work,
    too.) And while you''re at it, you should also consult *ENISA''s Actionable Information
    for Security Incident Response, Strategies for Incident Response and Cyber Crisis
    Cooperation,* and *NCSS Good Practice Guide—Designing and Implementing National
    Cyber Security Strategies*. Can''t wait for more? The list is long, and sampled
    in this book''s bibliography.


    What do you need to understand from all this? What are the essential elements
    of an incident‐response plan that you need to own in order to complete your own
    cybersecurity program?


    The first critical thing to understand is that incident response is a program
    in and of itself. As such, it has its own distinct phases, and much like the overall
    cybersecurity program, it, too, is a living program. It''s not one and done; it''s
    a continuously managed program.


    What are the phases? Have you heard of Elisabeth Kübler‐Ross''s five stages of
    grief: denial, anger, bargaining, depression, and acceptance? Many people go through
    them during an incident: “No! This can''t be happening to us!” followed by choice
    expletives, then by the desire to pay to make this go away, quickly replaced by
    depression about having to face the music, and finally acceptance of the fact
    that you, like millions of others, are a victim of a cybercrime.


    But the core phases of incident‐response planning are less gloomy. They are: preparing
    for incidents, identifying the occurrence of an incident, containing the incident,
    treating the incident (e.g., killing the virus, disabling access, etc.), recovering
    from the incident, and post‐incident review, aka the lessons‐learned phase. That
    last one is key and should never be omitted.


    To properly prepare for an incident you need to have in place three things:


    1.  A business continuity plan.

    2.  A disaster recovery plan.

    3.  An incident‐response plan.

    '
  trans: '

    你可以，也应该，就控制措施、战略等方面你认为可行的方案向董事会提供建议，以减轻这种风险，并且你应该客观、清晰地做到这一点。用“你觉得自己运气好吗？”这类问题恐吓高管和董事会从来不管用。坚持事实，提出替代方案，进行教育，最终接受他们的决定并继续前行。


    我们也是如此。继续前进，进入事件响应篇！


    # 第 11 章：事件响应规划


    “你的意思是，”一位我共事过的高管抱怨道，“在完成了所有这些工作之后，在无尽的评估、估值、编目、分类、测试、规划、部署和教育之后……现在我还得在所有这些之上制定一个事件响应计划？你本以为我们已经受到最大程度的保护了！”他叹了口气。“我至少可以把它外包出去吗？”


    “得看情况……”


    我称之为事件响应规划绝望症，令人恐惧的 IRPD！它令人恐惧，部分原因是它出现在网络安全计划开发的尾声，部分原因是它如此反高潮。确实，大量的工作、大量的艰苦工作，将你带到了这一步。现在，你被要求为所有工作都失败时制定计划。尽管做了这一切，事件还是发生了，你需要有一个计划来收拾残局。


    在 2015 年的电影 *《火星救援》* 中，主角教授一群有抱负的宇航员。他告诉他们：


    > ……在某个时刻，一切都会变糟……一切都会变糟，你会说，“完了。这就是我的结局。”现在你可以接受这一点，也可以开始干活。就这么简单。你开始行动。你做计算。你解决一个问题……再解决下一个……然后是下一个。如果你解决了足够多的问题，你就能回家。


    老实说，如果有比这更贴切的描述来诠释事件响应计划真正的样子，我还没找到！


    ## 事件响应规划：不仅是个好主意——这是法律！


    你可能听说过 `FISMA`。它代表联邦信息安全管理法案。它于 2002 年签署成为法律，本质上要求所有联邦机构制定事件响应计划。


    我知道你在想什么：“联邦法律？我才不在乎联邦法律呢。”但你应该在乎。许多州法律、行业法规和合同义务都要求制定事件响应计划。例如，如果你处理信用卡数据，`PCI
    DSS` 要求你必须有一个事件响应计划。如果你处理医疗数据，`HIPAA` 要求你必须有一个。如果你在纽约州金融服务部（`NYDFS`）监管的金融服务行业工作，你也需要一个。名单还在继续。


    还有国际标准，如 `ISO/IEC 27035`（信息安全事件管理）和 `NIST SP 800-61 Rev. 2`（计算机安全事件处理指南）。后者是美国联邦政府的标准，但被广泛采用为行业最佳实践。


    还有书籍，如 *《事件响应》*（作者：Kevin Mandia、Chris Prosise 和 Matt Pepe。不，我不是在开玩笑。这就是书名。著作也很棒。）趁此机会，你还应该参考
    *ENISA 的安全事件响应可操作信息、事件响应策略和网络危机合作* 以及 *NCSS 优秀实践指南——设计和实施国家网络安全战略*。还想要更多？清单很长，本书的参考文献中列举了一部分。


    从所有这些中你需要理解什么？为了完成你自己的网络安全计划，你需要掌握事件响应计划的哪些基本要素？


    首先要理解的关键一点是，事件响应本身就是一个计划。因此，它有自己独特的阶段，就像整体网络安全计划一样，它也是一个活的计划。它不是一劳永逸的；它是一个持续管理的计划。


    有哪些阶段？你听说过伊丽莎白·库布勒-罗斯的悲伤五阶段吗：否认、愤怒、讨价还价、抑郁和接受？许多人在事件发生期间会经历这些阶段：“不！这不可能发生在我们身上！”随后是精选的脏话，然后是想花钱摆平、快点了事的愿望，紧接着是因不得不面对现实而陷入的抑郁，最后接受这样一个事实：你和其他数百万人一样，是网络犯罪的受害者。


    但事件响应规划的核心阶段没那么悲观。它们是：准备事件、识别事件发生、遏制事件、处理事件（例如，清除病毒、禁用访问权限等）、从事件中恢复，以及事件后审查，即经验教训阶段。最后一个阶段至关重要，绝不能省略。


    为了妥善准备应对事件，你需要准备好三样东西：


    1.  业务连续性计划。

    2.  灾难恢复计划。

    3.  事件响应计划。

    '
