    ## Clear and Present Danger


    In early 2017, I wrote an editorial titled "Clear and Present Danger" for the
    website "From CEO to CEO." It presented my thinking on cybersecurity at the nation‐state
    level.


    On December 13, 2016, the *New York Times* published a feature article titled
    "The Perfect Weapon: How Russian Cyberpower Invaded the U.S." In it Eric Lipton,
    David Sanger, and Scott Shane do an excellent job in framing in detail the recent
    state‐sponsored cyberattack against U.S. interests. But the story doesn''t end
    there.

    '
