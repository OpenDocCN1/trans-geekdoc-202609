- raw: "*   *Network*: In this context, a network is a collection of connected (again,\
    \ most often digital) devices. You can have a network of computers—such as the\
    \ one in your office that enables you to send a document to your office printer—and\
    \ you can also have a network of networks—such as your point‐of‐sale terminal\
    \ network that connects to a credit‐card authorization network. Whatever its size,\
    \ the point of a network is to enable communications. Networked devices can share\
    \ data and software, leveraging their connection to increase processing power.\
    \ The Internet is a network of networks. In fact, it is *the* network of networks—you\
    \ might think of the Internet as one giant ocean but in fact it's more like a\
    \ huge number of interconnected streams, rivers, and lakes. And like Tolkien's\
    \ “one ring,” the Internet is there connecting them all!\n\n*   *Digital Services*:\
    \ Simply put, a *service* delivers value to a customer through action (a human\
    \ doing a task for the customer) as opposed to manufacturing (producing a product).\
    \ Similarly, for digital services: A collection of hardware and software, networked\
    \ or not, combines to deliver value. For example, a digital service can be something\
    \ as simple as digital storage. Other digital services include access to processing\
    \ power or to a particular application.\n\n*   *Hosting*: Be it a business (such\
    \ as hosting a website) or a service (hosting storage), the term *hosting* means\
    \ the capacity to deliver digital services located off‐premises (remote) to the\
    \ consumer. There are many nuances to the term (for example, *near hosting, far\
    \ hosting, distributed hosting*), but the easiest way to think of it is that the\
    \ computers are located in someone else's office—that office hosts the computers\
    \ on your and others' behalf. That other firm runs and maintains them, pays the\
    \ electric bills, and so on—while you get to use the computers by accessing them\
    \ remotely.\n\n*   *Cloud*: Or, cloud computing, is the delivery of hosted digital\
    \ services, on demand, over a network, and commonly over the Internet. If these\
    \ services are being delivered through private and proprietary means, then the\
    \ term used is *private cloud*. If the network is the Internet, then it's called\
    \ *public cloud*. If we combine them, we refer to it as a *hybrid cloud*. Terms\
    \ like Software as a Service (SaaS) and Infrastructure as a Service (IaaS) are\
    \ now used to differentiate between cloud‐delivered application services and hardware\
    \ services.\n\nThe “as a service” tag is getting appended to more and more digital\
    \ services these days, for example, Architecture as a Service (AaaS), Platform\
    \ as a Service (PaaS), and Everything as a Service (XaaS). The main advantage\
    \ of cloud computing is its scalability, redundancy, reliability, pricing, and\
    \ on‐demand availability. The main disadvantages are that all of these “as a services”\
    \ are nothing more than “hosted subscriptions,” rather than items you own. “As\
    \ a service” is kind of like renting an apartment in a location you can't always\
    \ control, with co‐tenancy issues (you moved from your apartment to one with roommates),\
    \ conflicts of interest (the renter has different priorities from the landlord),\
    \ and potential problems with accessibility (no Internet access means no cloud\
    \ access).\n\n*   *Digital Ecosystem, Digital Realm, Digital World, Cyberworld,\
    \ and the like*: The collection of all of these definitions (hardware, software,\
    \ networks, services, etc.) also sounds really smart and cool when you use it\
    \ in a bar.\n\nOne more definition—my favorite!—and we're done with this chapter:\n\
    \n*   *Cybersecurity*: Cybersecurity is the ongoing application of best practices\
    \ intended to ensure and preserve confidentiality, integrity, and availability\
    \ of digital information and the safety of people and environments.\n\n## Note\n\
    \n# CHAPTER 3  \n\nA Cybersecurity Primer\n\nThis chapter is your core resource\
    \ for cybersecurity. You can refer to it again and again to refresh your understanding,\
    \ look up a term, and review essential principles.\n\n## Cybersecurity Defined\n\
    \nThis is my definition of cybersecurity:\n\n*   *Cybersecurity is the ongoing\
    \ application of best practices intended to ensure and preserve confidentiality,\
    \ integrity, and availability of digital information as well as the safety of\
    \ people and environments*.\n\nThere are other definitions out there, most with\
    \ more complexity. But I—and I'd hazard most businesspeople—needed something different:\
    \ a simple, meaningful definition we can pin to our monitors, consult frequently,\
    \ and easily understand.\n\nThis definition includes the dynamic nature of the\
    \ field (it's *ongoing*) and the four best‐practice pillars: *confidentiality,\
    \ integrity, availability,* and *safety*.\n\nThe pillars of cybersecurity used\
    \ to be a triad: *confidentiality, integrity,* and *availability*. *Safety* is\
    \ the newest member of the roster, making it a lovely quartet, and introduced\
    \ to address everyday‐life threats posed by the Internet of Things (IoT).\n\n\
    ## The Meaning of Security\n\nThe word *security* is at the heart of cybersecurity.\
    \ So, let's take a moment to break it down. Security is a practice dealing with\
    \ all aspects of prevention, protection, and remediation from any type of harm\
    \ to an asset. The bulletproof glass in front of the Mona Lisa is security.\n\n\
    Information security is also a practice, one that aims to protect any type of\
    \ information assets. The fireproof safe where you keep your will is a form of\
    \ information security.\n\nNow: Cybersecurity is a subset of information security,\
    \ focusing specifically on protecting digital information assets in their ecosystem.\n\
    \n### Confidentiality\n\n*Confidentiality* is the term of the four that prompts\
    \ the most debate. Because it's the most controversial, we'll deal with it first.\n\
    \nMost people think of *confidential* as being synonymous with *private* or even\
    \ *secret*. We're all on board with the definition, except for one thing: Who,\
    \ exactly, gets to decide what's private or secret? That depends on whose stuff\
    \ it is and who may want access to it.\n\nWhat makes the concept of confidentiality\
    \ so tricky is that the definition truly lies in the eye of the beholder. What's\
    \ more, even if we agree on what's confidential today, we may disagree tomorrow.\
    \ For example, a husband and wife may agree that their emails are confidential\
    \ right up until the moment divorce proceedings begin. Two corporations may agree\
    \ that their transaction records are confidential until they sue one another for\
    \ breach of contract. Two allied countries share intelligence today until they\
    \ are allies no more.\n\nOf course, one could simply decide to trust no one, but\
    \ we have a job to do here. We must develop a framework on which to build our\
    \ defenses, and to do that, we need definitions.\n\nTherefore, as in the case\
    \ of risk, I will look at you as the expert. I assert, and firmly believe, that\
    \ you and you alone can determine what *confidential* means to you, just as you\
    \ and you alone ultimately determine your acceptable level of risk. This works\
    \ if you're an individual, and it works if you're a CEO of a business, or a board\
    \ member of a multinational corporation. You get to decide what's confidential\
    \ and what's not, and—more importantly—to what *degree* it's confidential.\n\n\
    Degrees of confidentiality? Of course! This is not a black‐and‐white world, is\
    \ it? Not only are there degrees of confidentiality, but confidentiality itself\
    \ has a life cycle during which its degree can change.\n\nIn general, there are\
    \ three accepted degrees of confidentiality: top secret, secret, and confidential.\
