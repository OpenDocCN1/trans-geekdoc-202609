- raw: 'To be clear: Identifying an incident is far from trivial. Many have gone undetected
    for weeks and even months! It''s not about interpreting alerts, reading logs,
    or processing user feedback. Hundreds of events in the course of doing business
    can be mistaken as a security incident. An application may modify a configuration
    file, and you get an alert: Is it an incident, or a normal function? A file server
    is slow: Incident, or just a heavy traffic load? Access to the Internet is spotty:
    Incident, or ISP errors? A file modification alert has been issued: Malware, or
    normal use? You received an email with a threat alert. Is it mere spam or a sign
    of things to come? Unfortunately, all these will need to be looked at through
    your cybersecurity glasses, even if they end up being little else than routine
    bugs.


    Enter SIEM. Security Information and Event Management systems ingest all this
    information (logs, threat feeds, etc.), correlate it, and issue alerts about abnormal
    events in your environment. What''s not to love? Nothing. Except that not all
    SIEMs are alike, and, like all relationships, you need to put work into it to
    get the benefits out of it.


    First, you should do your due diligence and select the right SIEM for your environment.
    They come in all sorts of sizes and flavors, including SIEM‐as‐a‐service options.
    Second, depending on which system you deploy, you may have to fine‐tune it. Make
    your SIEM too paranoid and every alert issued becomes a ticket to be investigated.
    But tune it to apathy and you won''t be notified until your data center has been
    pounded into fine silicon dust.


    Once tuned, a good SIEM will be your best friend and cybersecurity partner. You''ll
    be working hand in hand in processing the alerts, creating tickets, documenting
    trends, correlating with threat intelligence, and escalating to containment and
    treatment. All this beautifully orchestrated work will also be feeding into your
    cyberdocumentation tools, which your reporting workflows can use to notify authorities,
    incident information‐sharing organizations, wikis, and late‐night glee clubs.


    The catch, of course, is that to reach this level of incident‐detection bliss
    will require not only the right, and properly configured, SIEM choice and the
    right systems management practices (e.g., documentation, normalization, synchronization,
    etc.), but the right defense‐in‐depth strategy to begin with, which—you will recall—is
    the one that resulted in the deployment of the right controls that are being monitored
    across your environment in the first place.


    And how did you get to the right defense‐in‐depth strategy? You got there because
    you did all the hard work during the asset, threat, vulnerabilities, and environments
    phases.


    Who''s better than you? No one, that''s who!


    ## Containing Incidents


    ALERT! ALERT! This is not a drill!


    You have an alert that was identified as legit, was pressure tested, checked,
    and escalated to containment. Something is truly up! Now what?


    Step one: Heed the advice on the front of your binder! *Do not panic!* You''ve
    got this.


    Step two: Identification. What are you dealing with? What are your detective controls
    telling you?


    Step three: Analysis. This is elbow‐grease work requiring unique skills and specialized
    tools.


    Step four: Action. Once you know *who, how,* and *what,* you need to be ready
    to take action: Do you want to maintain the evidence for possible future actions
    (for example, prosecution)? Do you want to get back to operations as soon as possible
    with little regard to evidence preservation? Do you want to tolerate the infection
    while you develop workarounds? These are decisions that you should have thought
    out ahead of time and practiced with both your incident team and your top‐level
    management.


    Let''s look more closely at step four, action. To properly contain the incident,
    you''ll need to know three things: *who, how,* and *what*.


    1.  *Who:* Who is behind the attack? Is this an accident? Is this an insider?
    Is this an act of terrorism? What do the threat feeds say about who''s behind
    it? What is the motive? Understanding the *who* will help you develop methods
    of containment and treatment.


    2.  *How:* What is the attack vector? Malware, and if so, which kind? Is this
    the result of a virus? A Trojan? A worm? Did someone plug in an infected USB somewhere?
    Did someone click a link on an email? Was this a “drive‐by shooting,” such as
    malware dropped on a computer while someone was just browsing? Or was the breach
    perhaps the result of stolen credentials? It may be one or more of these things,
    or none of them. There could be some entirely other, more unusual way that the
    attacker used to compromise your systems. Your team will need to identify the
    *how* in order to contain it and potentially identify ways to preserve forensic
    data.


    3.  *What was hit?* A single end point? Multiple ones? Servers? Applications?
    Networks? Your forensic people will need to do a detailed end‐point analysis on
    the affected systems to collect evidence. This will include any kind of tracks
    that the attacker left behind, including a bit‐by‐bit copy of what is in the volatile
    memory (not just the permanent storage \[e.g., hard disk, SSD, etc.\]). They will
    need to establish the incident timeline: When did the attack start, how did it
    propagate, what did it leave behind, what are the effects? Part of this process
    involves highly technical work that may include isolating the malware on a system
    for observation, or reverse engineering the malware to understand what the code
    is doing. Once all this is understood, then all systems across the company will
    need to be forensically verified that they have not been infected as well.


    It bears repeating that in the incident‐containment phase, knowing what *not*
    to do is as important as knowing what *to* do. If your company does not have the
    resident expertise, a panicked executive, or IT person being flooded by alerts,
    may be tempted to pull the plug of the infected computer, try to use some I‐got‐it‐from‐the‐Internet‐malware‐removal‐tool,
    or—worse yet—log in as the administrator to investigate it or call your friend
    in the FBI.


    This is why it is so critical to have a plan in place before the incident, and
    to practice, practice, practice! Knowing what to do and how to do it gets you
    half‐way toward resolution.


    ## Treating Incidents


    When it comes to treatment, I have bad news and bad news. First, the bad news.


    Sometimes, you may have to live with the disease. You may need to live with it
    because of critical business considerations that prohibit you for isolating or
    rebuilding one or more systems. Or, you may need to keep the infected systems
    running so that the attackers don''t realize that you are aware of them while
    shielding more valuable assets, or sending Delta Force over to kick in their doors.
    Similarly, there may be upstream or downstream dependencies that require you to
    get creative. For example, because of business requirements of nonstop use, you
    may need to restore the infected system onto brand new hardware and then reinsert
    it into production while taking the infected system out. That can prove about
    as easy as replacing an aircraft engine while it''s in flight. It''s doable but
    very, very windy.'
