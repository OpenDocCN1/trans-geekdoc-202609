  toc: []
- raw: 'Before we go any further with our controls and defense‐in‐depth strategy,
    we need to discuss compliance. Not policy or employee compliance, but regulatory
    and legal compliance. Regulations will certainly affect the way you write your
    standards, and in some cases, they may dictate them.


    Every business, no matter where located, is subject to local laws. The operative
    word here is *local*. You''ll need to always account for local law, especially
    when it comes to cybersecurity, personal identifiable information, data storage,
    and data movement. The laws in Germany, for example, are very different from the
    laws in the United States, and those are very different from the laws in Singapore.
    What happens when you are a U.S. corporation with offices in Germany and Singapore?
    Therein lies the rub!


    Analyzing all the different regulatory frameworks is beyond the scope of this
    book, but let''s take a brief look at the European Union (EU) as an instructive
    case study.


    In 1995, the European Parliament and Council issued Directive 95/46/EC “on the
    protection of individuals with regard to the processing of personal data and on
    the free movement of such data.” The directive laid down the law on how data can
    be lawfully processed; the goal was to protect the rights and freedoms of EU citizens.


    Touching only on the top‐level highlights here, 95/46/EC went on to spell out
    that data processing would be lawful only under particular conditions: If the
    data subject has unambiguously given consent, the processing of data was necessary
    to fulfill contractual and legal obligations, or necessary for carrying out a
    task in the public interest. The directive went into substantial detail about
    data quality, fair and lawful data processing, and the rights of citizens to obtain
    information about who is processing their data, why and how that processing is
    occurring, the right to access their data, and the right to object to the processing
    of their data.


    It also introduced a clause about the transfer of personal data from an EU member
    state to a non‐EU country. In essence, if the EU considered the outside country
    to have adequate levels of data protection, then the transfer of the data would
    be allowable. But if not, and barring a list of exceptions, then the data transfer
    is not authorized.


    These regulations sent lawyers on both sides of the ocean into a tizzy, with lots
    of back‐and‐forth about how to define adequate levels of protection, who can store
    data where, and the like. Five years later, in 2000, the EU adopted what was called
    the “Safe Harbor Adequacy Decision,” which recognized the U.S. Department of Commerce
    principles as adequate data protection.


    But the situation took a bad turn around 2010 when the German regulators started
    requesting proof of safe harbor compliance in transatlantic data transfers. Things
    really went off the rails when the EU Commission Vice President, Viviane Reding,
    said, “The Safe Harbour agreement may not be so safe after all. It could be a
    loophole for data transfers because it allows data transfers from EU to U.S. companies—although
    U.S. data protection standards are lower than our European ones.” After lots of
    back‐and‐forth between countries and an Edward Snowden–versus‐NSA scandal, in
    2014, the EU Parliament called for the immediate suspension of Safe Harbor because
    its principles were not adequately protecting EU citizens.


    The death knell of Safe Harbor was the 2015 decision of the European Court of
    Justice on the case of Mr. Max Schrems, who sued Facebook, arguing that the United
    States does not provide adequate protection. The court agreed with him (and then
    some), and for a few days there were thousands of executives and lawyers walking
    around looking blue in the face from holding their breath. No one knew exactly
    what the next step was, so everyone pretended that existing laws covered all business
    already in place, until the EU issued revised data protection laws, and the EU
    and the United States worked out a Safe Harbor replacement.


    That didn''t happen until 2016 when the European Commission issued the General
    Data Protection Regulation GDPR (EU) 2016/679, finally replacing the 1995 directive.
    Also in 2016, the EU and the United States proposed the Privacy Shield arrangement
    to replace Safe Harbor. As of this writing, these new regulations are, of course,
    being challenged by dozens of civil rights organizations, and no one knows exactly
    how or when a consensus will emerge. Meanwhile, GDPR is the law of the land, and
    if you thought that the original directive was strict, wait till you read the
    GDPR! Its main points are:


    *   *Worldwide applicability*. GDPR applies to all companies that process personal
    data of EU citizens no matter where they are located.


    *   *Fines*. If your company is found breaching GDPR, it can be fined up to 4
    percent of total revenues, or €20,000,000, whichever is greater. Keep in mind,
    that''s *per incident*.


    *   *Clear consent*. Remember all those endless agreements written in legalese
    that you had to click “agree” on? No more. Consent has to be plainly explained,
    easily understood, and accessible. One more thing: It must be as easy to revoke
    as it is to grant.


    *   *Notification*. If you are breached, you must notify anyone whose data you
    are processing within 72 hours.


    *   *Access*. An EU citizen has the right to access and to a copy of your own
    data, including an explanation of who is processing it and for what reason.


    *   *Portability*. EU citizens have the right to a copy of their data and the
    right to transmit it to anyone else.


    *   *Privacy by design*. What used to be a systems design principle is now law.
    You are expected to integrate this principle across the life cycle of all your
    systems that touch EU citizen data.


    And my personal favorite:


    *   *Right to be forgotten*. An EU citizen has the right to ask for their personal
    data to be erased from your systems, as well as from any third‐party systems that
    you have been transmitting the data, including the possibility of stopping any
    downstream processing of the same data.


    ## Pulling It All Together


    After all this work, what have we achieved? Let''s review.


    You are responsible for developing an organization‐wide cybersecurity program.
    You have done your work, you identified your assets, the threats, and your possible
    vulnerabilities. You thought things through, and developed a defense‐in‐depth
    strategy that has identified the necessary controls and how they must be placed
    to protect the organization. You have communicated all this, trained your people,
    and created the necessary policies and standards. You have also contributed to
    the creation and rollout of the applicable procedures and guidelines.


    But none of this exists in isolation of geography and the local regulatory frameworks.
    You must take this work and tweak it so that the local applicable laws are respected.
    That means that it is entirely possible that your German office will have different
    standards from the one in Austin. They may have the same policy, but the standard
    needs to reflect the local regulatory constraints. If those constraints span continents,
    then you will need to have standards that address that as well.


    Do you have to, though? Do you *really* have to meet each and every local regulation?


    Well now, you rebel! It depends!


    What is our number‐one yardstick that we''ve used throughout our cybersecurity
    program development? What is *the* question that must always have a definitive
    answer?


    “How much is it worth to you?”


    And as usual, that''s a question for the board. The board may decide not to comply
    with one local regulation or another. The board may decide that it *is worth it
    to them* to pay any fines they may incur. In short, the board is accepting this
    risk. You don''t have to agree with that decision. And it''s not yours to make.'
  fmt: '

    # 合规性


    在进一步推进控制措施和纵深防御策略之前，我们需要讨论合规性问题。这里指的不是政策或员工合规，而是法规和法律合规。法规必然会影响你编写标准的方式，在某些情况下，甚至会直接规定这些标准。


    无论身处何地，每个企业都受当地法律约束。关键词在于*当地*。你必须始终考量当地法律，特别是在网络安全、个人身份信息、数据存储和数据流动方面。例如，德国的法律与美国的法律截然不同，而两者又与新加坡的法律大相径庭。如果你是一家在德国和新加坡设有办事处的美国公司，情况就会变得复杂！


    分析所有不同的监管框架超出了本书的范围，但我们可以简要以欧盟（EU）为例进行案例研究。


    1995 年，欧洲议会和理事会发布了指令 95/46/EC“关于在处理个人数据方面保护个人以及此类数据自由流动的指令”。该指令规定了数据合法处理的法律依据，旨在保护欧盟公民的权利和自由。


    仅触及顶层要点，95/46/EC 规定数据处理仅在特定条件下合法：数据主体明确给予同意；为履行合同和法律义务而必需；或为执行公共利益任务而必需。该指令详细规定了数据质量、公平合法的数据处理，以及公民获取信息的权利——包括谁在处理其数据、为何以及如何处理、访问其数据的权利，以及反对处理其数据的权利。


    它还引入了一条关于将个人数据从欧盟成员国传输至非欧盟国家的条款。实质上，如果欧盟认为该第三国提供了充分的数据保护水平，则允许数据传输；反之，除少数例外情况外，数据传输将不被授权。


    这些法规让大西洋两岸的律师们陷入狂乱，围绕如何定义充分保护水平、数据可存储在何处等问题展开大量拉锯。五年后，即 2000 年，欧盟通过了“安全港充分性决定”，认可美国商务部原则提供了充分的数据保护。


    但情况在 2010 年左右急转直下，德国监管机构开始要求跨大西洋数据传输提供安全港合规证明。事态真正失控是在欧盟委员会副主席维维安·雷丁表示：“安全港协议可能并不那么安全。它可能成为数据传输的漏洞，因为它允许数据从欧盟传输到美国公司——尽管美国的数据保护标准低于欧洲标准。”
    在各国间大量拉锯以及爱德华·斯诺登对阵美国国家安全局（NSA）的丑闻后，2014 年欧盟议会呼吁立即暂停安全港，因为其原则未能充分保护欧盟公民。


    安全港的丧钟是 2015 年欧洲法院对马克斯·施雷姆斯案的判决。他起诉 Facebook，主张美国未提供充分保护。法院支持了他（甚至判得更彻底），导致数天内成千上万的高管和律师因屏息等待而面色发青。没人确切知道下一步怎么办，只能假装现有法律已涵盖所有现有业务，直到欧盟颁布修订后的数据保护法，以及欧盟与美国商定出安全港的替代方案。


    直到 2016 年，欧洲委员会颁布了《通用数据保护条例》GDPR (EU) 2016/679，最终取代了 1995 年指令。同年，欧盟与美国提议“隐私盾”安排以取代安全港。截至目前，这些新法规当然正受到数十个民权组织的挑战，没人知道共识将如何或何时达成。与此同时，GDPR
    已成为当地法律，如果你觉得原指令严格，读读 GDPR 吧！其要点如下：


    *   **全球适用性**。GDPR 适用于所有处理欧盟公民个人数据的公司，无论其身处何地。

    *   **罚款**。若公司违反 GDPR，可被处以高达全球总营收 4% 或 2000 万欧元的罚款，以较高者为准。注意，这是*按事件*计算的。

    *   **明确同意**。不再有那些冗长晦涩、必须点“同意”的协议。同意必须通俗解释、易于理解且易于获取。还有一点：撤销同意必须像给予同意一样容易。

    *   **通知义务**。若发生数据泄露，必须在 72 小时内通知所有数据主体。

    *   **访问权**。欧盟公民有权访问并获取其数据副本，包括谁在处理数据及处理目的的解释。

    *   **可携权**。欧盟公民有权获取其数据副本，并有权将其传输给任何其他方。

    *   **设计时隐私保护**。过去的系统设计原则现已成法。你必须在涉及欧盟公民数据的所有系统的全生命周期中融入这一原则。


    我个人最爱的一点：


    *   **被遗忘权**。欧盟公民有权要求从你的系统中擦除其个人数据，以及从你传输数据的任何第三方系统中擦除，包括停止对该数据的任何下游处理。


    ## 统筹全局


    经过这一切努力，我们取得了什么成果？让我们回顾一下。


    你负责制定全组织范围的网络安全计划。你已完成资产识别、威胁识别和潜在漏洞识别。你深思熟虑，制定了纵深防御策略，明确了必要的控制措施及其部署方式以保护组织。你已沟通所有这些内容，培训人员，并创建了必要的政策和标准。你还为适用程序和指南的创建与推广做出了贡献。


    但这一切并非孤立于地理和当地监管框架之外。你必须调整这项工作，以尊重当地适用法律。这意味着你的德国办事处完全可能与奥斯汀办事处拥有不同的标准。它们可能共享相同的政策，但标准必须反映当地监管约束。若这些约束跨越大陆，则需制定相应标准加以应对。


    不过，你真的必须遵守每一项当地法规吗？


    好吧，叛逆者！视情况而定！


    贯穿我们网络安全计划开发始终的首要衡量标准是什么？必须始终有明确答案的*那个*问题是什么？


    “这对你值多少钱？”


    一如既往，这是董事会的问题。董事会可能决定不遵守某项当地法规。董事会可能认为*值得*支付可能产生的罚款。简而言之，董事会接受了这项风险。你不必同意该决定。这也不是你能决定的。

    '
