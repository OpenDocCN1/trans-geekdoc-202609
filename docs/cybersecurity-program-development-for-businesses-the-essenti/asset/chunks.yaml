- raw: 'Says who? Says Peter Drucker, and we need say no more. Although people have
    tried, with arguments like “You can''t measure ‘trust’ or ‘love.’” No. You cannot.
    (Unless you''re a divorce attorney. Then, you can.)


    I have argued from the beginning that everything we say here applies from the
    lone wolf to the multinational. Of course, a single practitioner doesn''t have
    a board and an executive team, but that is because she is the board, executive
    team, and operations. A small business doesn''t, either, but that is because these
    functions are divided up between the owner(s) and her team(s). And so on. The
    basic principles continue to apply.


    ### The Case for Frameworks


    What is a framework? According to our friends at Merriam‐Webster, it is a basic
    conceptual structure (of ideas). I like to think of frameworks as playbooks. Take
    football, for example. You have the rules of the game, and each team has a playbook.
    I consider that playbook the specific team''s framework for winning. Not all playbooks
    work well for all teams, yet all teams must obey the same rules of the game. This
    is an important distinction, and it applies equally well in business.


    In management science as a whole—and in technology and risk management in particular—there
    are several excellent, at times competing, at times complementing, frameworks.
    Note that a framework is different from a standard, which is itself different
    from a methodology (e.g., Six Sigma, Plan‐Do‐Check‐Act, Kaizen, etc.). A standard,
    as per ISO, “is a document that provides requirements, specifications, guidelines,
    or characteristics that can be used consistently to ensure that materials, products,
    processes, and services are fit for their purpose.” You either meet or do not
    meet a standard. For example, you are either PCI DSS–compliant or you are not.


    Frameworks are different, and a bit looser. You can claim, and you would be right
    in doing so, that your technology follows the COBIT framework even though you
    are using only parts of it—the parts that apply to your organization.


    This is exactly why you should consider adopting a framework as a guide in managing
    your technology and cybersecurity. A good framework should be comprehensive, flexible,
    adaptable, and straightforward to implement. Although not a complete list by any
    means, some of the better‐known frameworks are: COSO (Committee of Sponsoring
    Organizations of the Treadway Commission), ITIL (Information Technology Infrastructure
    Library), BiSL (Business Information Service Management Library), CMMI (Capability
    Maturity Model Integration), COBIT (Control Objectives for Information and Related
    Technology), TOGAF (The Open Group Architecture Framework), and PMBOK (Project
    Management Body of Knowledge), which is more focused to the project management
    discipline but still overlaps with IT management and good management practices
    in general.


    I have two personal favorites: CMMI, which was developed by Carnegie Mellon (recently
    acquired by ISACA) and used as a process improvement and appraisal framework,
    and COBIT, also by ISACA. If you''d indulge me, I''d like to briefly introduce
    you to both.


    CMMI is all about process and process maturity. What is a process? Good question!
    It can be anything from software development to service delivery and everything
    in between. CMMI breaks down the maturity of a process into five levels: In Level
    1, processes are unpredictable, ad hoc, and frequently changing in reaction to
    events. Level 2 processes are repeatable, and if you''re lucky, with repeatable
    results. Level 3 processes are defined, they are documented, and are subject to
    review and improvement. Level 4 processes are managed using a variety of reliable
    metrics. Level 5 processes are optimized with a focus on continual improvement.


    I am willing to bet you that you instinctively placed your organization in one
    of these levels. You know what CMMI level you are at. If you think you are at
    CMMI Level 3, you would be in good company, and in a decent rank! It ends up that
    CMMI Level 3 is the threshold you need to be at to implement a variety of other
    frameworks such as the Balanced Scorecard method (another personal favorite) for
    aligning performance, goals, strategy, and management. When it was introduced
    in 1992 by Norton and Kaplan, it revolutionized management thinking and introduced
    us all to the virtuous cycle of perspectives: learning, internal, customer, and
    financial. One affects the other, with learning being the key starting point.
    Absolutely delicious and highly recommended.


    COBIT is the 800‐pound gorilla of frameworks for the management and governance
    of IT. The one ring to rule them all. The unified theory of everything. The answer
    to the ultimate question about life, the universe, and everything. That''s COBIT.


    COBIT is based on five principles: Principle 1: meeting stakeholder needs. An
    excellent principle, really, leading to the goals cascade: Stakeholder drivers
    influence their needs. Then, stakeholder needs translate to enterprise goals.
    Those cascade to IT goals, and IT goals cascade to enabler goals. Principle 2
    of COBIT: Cover the enterprise end to end. Nothing left out, everybody in the
    pool. Principle 3: Apply a single integrated framework. Principle 4: Enable a
    holistic approach. Principle 5: Separate governance from management.


    Okay, so it''s a bit heavier than CMMI, but it''s all muscle. Not a gram of fat.
    I suspect, you got a bit overwhelmed by the principles. It makes sense that you
    would: Framework talk can appear overwhelming and intimidating.


    The point is that these frameworks exist, and they evolve with the times. Brilliant
    people all over the world have dedicated their lives to building and refining
    these notions—not because everyone *must* implement them, but because everyone
    should know that there is a source of guidance, a place to get help, a resource
    with trusted, verified, scientific answers to problems.


    That is the point. It''s not whether you implement COBIT or not. It is that by
    its existence it is available for you to do a reality check on all the technobabble
    out there. You might never implement COBIT or CMMI, or the balanced scorecard
    or any of the other frameworks. But at least you know that they are there, and
    they can help you make the right decision objectively, each and every time.


    Personally, I have staked my career—and this book—on them! I constantly interpret,
    derive, explain, get inspired by, and apply their advice on countless assignments,
    with consistently successful results!


    ### IT and Cybersecurity: Separation of Church and State


    Having defined your business strategy, you then have a reasonable expectation
    that your technology operations need to be aligned with your business goals and
    that your cybersecurity program is aligned with your risk appetite.


    What is the best way to make sure that this is a successful? Implement your KGIs,
    CSFs, and KPIs to be sure, but even more important:


    *Keep technology and cybersecurity separate!*


    Why? Because while the two may sound roughly the same, they actually have very
    different functions.


    IT creates value. When properly aligned with your business strategy, your technology
    is an enabler, an expediter, an optimizer, and an innovator.


    Cybersecurity, on the other hand, protects value. That is a stark difference in
    focus. Cybersecurity is all about risk management and IT is all about value creation.
    You should never have risk management report up to value creation because of the
    potential conflict of interest. That would be the same as having a clinical research
    trial for a drug being funded by the drug''s manufacturer! Remember all those
    doctors who were proclaiming that cigarettes were safe?'
