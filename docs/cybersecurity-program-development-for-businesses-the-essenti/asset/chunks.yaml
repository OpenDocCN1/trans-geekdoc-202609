- raw: "4.  *Recommend specific steps to either eliminate or mitigate vulnerabilities:*\
    \ The results of the vulnerability tests tend to be fairly black and white: Either\
    \ the asset is vulnerable or it is not. If it is, then you hope that there is\
    \ a clear path to eliminating the vulnerability. Like we discussed earlier, that\
    \ may not always be the case, and the reasons may surprise you. There may not\
    \ be a fix available for the vulnerability…*yet*. The manufacturer or developer\
    \ may be currently working on it. A worse situation is if your system is no longer\
    \ supported and there are no plans to fix the vulnerability (but in this case\
    \ you might well wonder what you're doing running an antique!). Another common\
    \ problem is when the vulnerability does in fact have a fix, but if you apply\
    \ it, your systems downstream may not work properly. The list goes on and on,\
    \ but the good news here is that you have an answer: You either fix the vulnerability\
    \ or you take mitigating action. Be aware, however, that the answer may be different\
    \ for each vulnerable asset.\n\n## Prioritizing Vulnerability Remediation\n\n\
    Managing your vulnerabilities can feel like shoveling snow in the middle of a\
    \ blizzard: Get the list of assets; research the vulnerabilities; plug the vulnerabilities;\
    \ test the fix…start all over again. Because no matter how diligent you are, there\
    \ will always be new ones that are discovered designed to make your life miserable.\n\
    \nThe failure to keep up with vulnerability assessments is one of the most common\
    \ problems I see as a consultant. It is boring work. It is overwhelming. It is\
    \ constantly changing. And, for many firms, the job is just not as big a priority\
    \ as it should be. I know many good technologists who may well be aware of a vulnerability\
    \ on a server but hesitate to apply the vendor patch. They are oftentimes worried\
    \ that something else may break downstream and, all of a sudden, what is a half‐hour\
    \ job turns into a two‐day crisis.\n\nI understand the hesitation but I can't\
    \ excuse it. According to White Hat Security, in 2016, the average vulnerability\
    \ age—meaning how long the vulnerability has been around—was 339 days! And yet\
    \ the average remediation rate is a paltry 42 percent. And the time to fix? 117\
    \ days! That is almost four months *after* someone knew about a vulnerability.\
    \ And, that's just in the banking industry, which is supposed to be tight and\
    \ regulated!\n\nThe excuses are many: overworked staffs, underfunded departments,\
    \ competing priorities.…I've heard them all, and I believe them. Most cybersecurity\
    \ professionals and most IT shops are truly overworked, underfunded, and drowning\
    \ in competing priorities. Unfortunately, that is not likely to change anytime\
    \ soon. We therefore need to reprioritize vulnerability assessment and remediation.\
    \ It truly represents relatively low‐hanging fruit, and we are leaving it to rot\
    \ on the branch because we're too busy to go get the stepstool?\n\nMy recommendation\
    \ is that you engage with your IT department (be it in‐house or outsourced) and\
    \ make sure that vulnerability identification and remediation, along with frequent\
    \ testing, is someone's explicit responsibility. You should further insist on\
    \ a monthly report that shows you the vulnerability status per system, and the\
    \ remediation timeline. It is silly for us to be trying to secure the fort if\
    \ someone keeps leaving the side entrance unlocked!\n\nSpeaking of locks, those\
    \ are controls! The time has come for us to take a real close look at controls:\
    \ how to select them, how to deploy them, and how to manage them.\n\n# CHAPTER\
    \ 9  \n\nEnvironments\n\nI use the term *environments* to mean three things:\n\
    \n1.  *Computing Environments*. There are four basic types: \n\n    1.  *On‐premises*\
    \ or *onsite* (the servers are in your office).\n\n    2.  *Private cloud* (the\
    \ servers are in someone else's building, but you have the only key to your own\
    \ private office in that building).\n\n    3.  *Public cloud* (the servers are\
    \ in someone else's office, many people have keys to that building, and you don't\
    \ have a private office there).\n\n    4.  *Hybrid cloud* (the servers are all\
    \ over the place. Some in your private office, some elsewhere in the building).\n\
    \n2.  *The Internet of Things (IoT)*. For our purposes, IoT means every device\
    \ that is connected to the Internet, regardless of its location or function—from\
    \ nanny cams to SCADA (supervisory control and data acquisition) systems. If it's\
    \ not part of our standard endpoint definition (computers, phones, tablets) but\
    \ it's connected to the Internet, it's IoT.\n\n3.  *Distributed Workforces*. I\
    \ like huddling over a good watercooler conversation as much as the next person,\
    \ but modern workspaces seem to be doing away with the concept of the “office.”\
    \ More and more people are taking advantage of the Internet to collaborate from\
    \ locations all over the world. Sometimes, these arrangements mirror employer–employee\
    \ relationships. Other times it's a collection of freelancers coming together\
    \ for a project. The fact is, the way we work is changing in a fundamental way,\
    \ and the way we view cybersecurity over a distributed workforce needs to reflect\
    \ this new and dynamic environment.\n\nEach of these environments will have different\
    \ cybersecurity needs, so let's take a closer look at each environment in turn.\n\
    \n## On‐Premises (Onsite) Computing Environments\n\nMost people are familiar with\
    \ an on‐premises computing environment. Depending on company size, this is basically\
    \ your typical business office with a server room. These server rooms range in\
    \ size from a cramped, dusty closet, to a large, raised‐floor, air conditioned,\
    \ fireproofed data center. The commonality is that the server room is in the same\
    \ physical space where the information technology services are being consumed.\
    \ That said, a larger company with multiple buildings will still be considered\
    \ to have an on‐premises environment if they house their data center in one of\
    \ their own buildings, despite distributing the services to multiple others, potentially\
    \ across cities and countries.\n\nOn‐premises environments afford you total control.\
    \ You control access, you control what equipment is deployed, what software is\
    \ installed, how the infrastructure is monitored, etc. It's all yours, no questions\
    \ asked. If you want to decommission a server, you go right ahead. If you want\
    \ to install a new firewall, knock yourself out! If you want to let your six‐year‐old\
    \ kid bike around the environmentally controlled room, you can do that, too. Of\
    \ course, total control comes with the corresponding price‐tag. More than just\
    \ dollars, euros, or yen, the price‐tag also reflects the responsibility of maintaining\
    \ this infrastructure from an IT point of view (installations, management, maintenance,\
    \ etc.) and, of course, protecting it.\n\nAy, there's the rub! Yes, you have total\
    \ control on how you can protect the equipment, and as such you can be sure that\
    \ it is always safe and sound, with the best and most appropriate controls at\
    \ all times. But on the other hand, you're paying for all this infrastructure\
    \ and associated headaches—including the likelihood of underutilizing your technology\
    \ during a downturn, not to mention the challenges of scaling it up during a rapid\
    \ growth cycle. If you're a businessperson, you'll loathe both the expense and\
    \ rigidity. If you're a cybersecurity professional, you'll probably love it. But!\
    \ If you're an IT professional with vision—one who recognizes that you always\
    \ need to align technology with business goals—then you will always recommend\
    \ that choices about IT architecture align with business goals as much as possible…even\
    \ if that meant you'd miss looking at the blinking green lights of a traditional\
    \ server room.\n\nSo, is an on‐premises computing environment worth the headaches?\
    \ How to decide? And who decides?\n\nRemember, this entire book is based on this\
    \ question: “What's it worth to you?” The only people who can answer that question\
    \ are the business owners or their legal representatives. No one else. Not IT.\
    \ Not cybersecurity."
