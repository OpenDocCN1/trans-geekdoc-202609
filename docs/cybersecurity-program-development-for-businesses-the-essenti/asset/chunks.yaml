    | **电子表格名称：The Books（账本）** |

    | --- |

    | **资产/系统** | **负责人** | **保管人** | **位置** | **分类** | **关键性** | **影响** | **MTD**
    | **RPO** | **RTO** | **资源** |

    | FIN SERVER（财务服务器） | IT | IT | NY | 3 | 3 | 3 | 40 | 24 | 48 | IT |


    **表 6.4** 薪资系统业务影响分析表示例


    | **电子表格名称：Payroll（薪资）** |

    | --- |

