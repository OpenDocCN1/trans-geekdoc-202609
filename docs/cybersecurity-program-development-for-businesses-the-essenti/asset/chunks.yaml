    Like before, I recommend that you use a scale from 1 to 4, with 1 assigned for
    “public,” 2 being “confidential,” 3 for “secret,” and 4 for “top secret.”


    Two tips: First, avoid the trap of having more classifications than necessary.
    Keep it as simple as you can.


    Second, use an even number of classifications to avoid giving anyone the option
    to pick the middle number as a safe bet. Since you''re doing all of this work
    in partnership with the asset''s owner, insist that both of you think this classification
    through and through. You''ll be surprised at the dividends down the line.


