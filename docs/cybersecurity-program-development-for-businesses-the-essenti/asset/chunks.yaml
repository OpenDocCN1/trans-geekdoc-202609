    example, if you''re group learning about phishing, you may want to guide the group
    through an exercise in which members of the group alternate into the role of the
    hacker and try to fool the others to act on their instruction. What''s the instruction?
    It can be anything, such as handing over a bunch of Legos! (Legos are a great
    interactive training prop! Don''t leave your office without your Lego bucket!)


    *   **E‐Learning**. If you have decided that your training strategy is a learner‐led
    one, then e‐learning will play a crucial role in successfully delivering and testing
    your cybersecurity awareness program. To be sure, e‐learning can, and should,
    complement *any* training methodology. It allows for constant assessments, reminder
    quizzes, and on‐demand availability of information. It also reinforces all the
    other methods, since it can be a complementary resource to those who want to know
    more about the specific topic, or for those who for some reason or another couldn''t
    attend the instructor‐led training.


    There are several excellent e‐learning cybersecurity awareness programs. Consider,
    for example, the SANS Institute training offerings, Inspired Learning, Wombat
    Security, PhishMe, and Security Mentor to name only a very few. Please note that
    this is not an endorsement of any of specific program, and the preceding list
    is far from complete. I am mentioning them here to start you on a path to discovery
    for the right vendor for your specific company needs. Do your research and due
    diligence, and partner with the vendor that is right for you.


    I cannot emphasize enough the importance of integrating your specific company
    culture and needs with cybersecurity awareness training. It also goes without
    saying that this is not a one‐and‐done type of activity. Depending on size and
    scope of your company, you will need to provide regular refreshers, training support,
    quizzes, reminders, and so on. Also remember that you need to integrate the training
    across the life cycle of all employees—from onboarding to offboarding.


    Be sure to include in your training their at‐home behavior. Your employees are
    exposed to cyberthreats both at work and at home. After all, if an employee uses
    the same laptop at home as in the office, then the cybersecurity risks don''t
    stop at the office door.


    The good news is that a successful cybersecurity awareness program can be one
    your most effective controls in your defense‐in‐depth strategy. Companies with
    an aware population have seen up over a 30 percent improvement in their ability
    to detect phishing scams, insider threats, even abnormal system activities.


    My advice: Take cybersecurity awareness training very, very seriously. Just because
    it is a soft control (as opposed to all the high‐tech hardware, software, and
    services ready), that doesn''t mean it''s any less effective. As a matter of fact,
    time and time again, security awareness consistently proves itself as one of the
    best controls against attacks. Invest in it accordingly.


    # CHAPTER 13: Living Cybersecure!


    > *Remember, no matter where you go, there you are.*

    >

    > —*The Adventures of Buckaroo Banzai Across the 8th Dimension*


    And, here you are! You made it! You plowed through chapter after chapter, stayed
    with me through some pretty tricky topics, learned a whole bunch of acronyms,
    reviewed cases studies, and now?


    Now you know a lot more about your company than when you started! You know about
    its assets, its threat profile, and its risk appetite. You know where all the
    bodies are buried. You know what''s worth protecting, and by how much. And you
    got to make a whole new set of friends in the process.


    You are also in the proud ranks of the wise men and women! Wise people know what
    they don''t know. The trick here is to recognize this and stay within their ranks.
    You need to take the knowledge that you gained, look at it critically, find ways
    to build on it, and always, always question it.


    Cybersecurity is a science; a hard one at that. A science that''s rapidly evolving.
    New discoveries, new approaches, new best practices are discovered, tested, and
    applied daily. Staying on top of this field is no easy task—some would argue it''s
    impossible—but staying informed is something that you can, and should, do. As
    we''ve discussed, cybersecurity is a shared responsibility, and staying on top
    of it is one of the things that you must do.


    When it comes to staying on top of things, how much is enough? Much depends on
    your role and day‐to‐day responsibilities. For a busy C‐level executive, receiving
    pertinent alerts and a weekly summary may be enough. For a hands‐on operations
    executive with cybersecurity oversight responsibilities, a daily briefing may
    be necessary. For a board member, alerts and a quarterly report from the CISO
    may be all that is needed. Frequency, quantity, and context will be determined
    by the size and needs of your specific organization. One thing is certain: You
    will need to stay informed and current. Forever!


    What else do you need to know? Well…that list is long. Very long!


    What else do you need to know to support your newly created cybersecurity program?
    Now, that''s more manageable, and I have some ideas!


    In general, the things you need to be aware of tend to fall into one of the following
    categories:


    *   **Scientific developments**. These are straight‐up developments in the field.
    Like I mentioned, there are thousands of cybersecurity professionals who are constantly
    pushing the envelope. Their dedication and breakthroughs are what makes this world
    a safer place, and books like this possible. Regarding where you can learn about
    their constant progress, my recommendation is to join one or more of the several
    worldwide organizations who support and advance the science and application of
    cybersecurity. For example, I have made frequent reference to CIS, ISACA, ISSA,
    (ISC)², ISO, and the SANS Institute. There are also government agencies like ENISA
    and NIST that also provide a wealth of information and best practices for a variety
    of industries and company sizes. A bit of research (and some well‐spent membership
    dollars) will go a long way toward keeping you informed.

    '
  trans: '

    *   **午餐学习会**。这是一种不太正式的演示形式。如果可能，请避免使用幻灯片等。尽可能将房间布置成圆形且包容性的布局（无讲台，融入听众之中）。你的目标是在午餐时就网络安全主题进行讨论。任何发给学习者的材料应在开始时分发，让他们按自己的节奏阅读。保持主题聚焦。例如，你不想搞一个“网络安全意识午餐学习会”。要具体！你想搞的是“网络钓鱼，以及你上钩的所有方式！”午餐学习会。


    *   **小组学习**。这是向小群体或多个小组传达复杂主题的绝佳方式。每个小组都需要一位精通团队建设和角色扮演方法论的熟练培训师。这里的思路是，你选取一个主题，并通过实景演练来涵盖关于它的方方面面。例如，如果你在进行关于网络钓鱼的小组学习，你可能想引导小组进行一项练习，让成员轮流扮演黑客角色，试图欺骗其他人按其指令行事。指令是什么？可以是任何事情，比如交出一堆乐高积木！（乐高积木是极佳的互动培训道具！离开办公室别忘了带上你的乐高桶！）


    *   **电子学习**。如果你决定培训策略是学习者主导的，那么电子学习将在成功交付和测试你的网络安全意识计划中发挥关键作用。毋庸置疑，电子学习可以而且应该补充*任何*培训方法。它允许持续评估、提醒测验和按需获取信息。它还能强化所有其他方法，因为它可以作为补充资源，供那些想更多了解特定主题的人，或因各种原因无法参加讲师主导培训的人使用。


    市面上有几个优秀的电子学习网络安全意识计划。例如，可以考虑 SANS 学院的培训产品、Inspired Learning、Wombat Security、PhishMe
    和 Security Mentor，仅举几例。请注意，这并不代表对任何特定计划的背书，且上述列表远非详尽无遗。我在此提及它们，是为了帮你开启寻找适合你公司特定需求的供应商之旅。请自行调研并尽职调查，与适合你的供应商合作。


    我再怎么强调将你公司的特定文化和需求与网络安全意识培训相结合的重要性都不为过。这也是不言而喻的，这不是一劳永逸的活动。根据公司的规模和范围，你需要提供定期的复习、培训支持、测验、提醒等。还要记住，你需要将培训贯穿所有员工的全生命周期——从入职到离职。


    务必在培训中包含员工的居家行为。你的员工在工作和家里都面临网络威胁。毕竟，如果员工在家和办公室使用同一台笔记本电脑，那么网络安全风险不会止步于办公室大门。


    好消息是，成功的网络安全意识计划可以成为你纵深防御策略中最有效的控制措施之一。拥有安全意识人群的公司，在检测网络钓鱼诈骗、内部威胁、甚至异常系统活动方面，能力提升了
    30% 以上。


    我的建议：非常、非常重视网络安全意识培训。仅仅因为它是一种软性控制（相对于那些现成的高科技硬件、软件和服务），并不意味着它效果就差。事实上，一次又一次，安全意识始终证明自己是抵御攻击的最佳控制措施之一。请相应地投入资源。


    # 第 13 章：过网络安全的生活！


    > *记住，无论你去哪里，你都在那里。*

    >

    > —*《八次元世界的巴克罗·班扎伊历险记》*


    而你就在这里！你做到了！你一章接一章地啃了下来，陪我度过了些相当棘手的主题，学了一大堆首字母缩略词，复习了案例研究，现在呢？


    现在你对公司的了解比开始时多多了！你知道它的资产、威胁概况和风险偏好。你知道所有的“尸体埋在哪里”。你知道什么值得保护，以及保护到什么程度。而在这个过程中，你还结交了一群新朋友。


    你也光荣地跻身于智者行列！智者知其所不知。诀窍在于认识到这一点并保持在这一行列中。你需要获取所学知识，批判性地审视它，找到构建它的方法，并始终、始终对其提出质疑。


    网络安全是一门科学；而且是一门硬科学。一门快速发展的科学。新发现、新方法、新最佳实践每天都在被发现、测试和应用。紧跟这个领域绝非易事——有人甚至会说这是不可能的——但保持信息灵通是你能做到、也应该做到的。正如我们所讨论的，网络安全是共同的责任，紧跟其发展是你必须做的事情之一。


    说到紧跟形势，多少算够？很大程度上取决于你的角色和日常职责。对于忙碌的 C 级高管，接收相关警报和每周摘要可能就足够了。对于负有网络安全监督职责的亲力亲为的运营高管，每日简报可能是必要的。对于董事会成员，来自
    CISO 的警报和季度报告可能就是所需的一切。频率、数量和背景将由你组织的具体规模和需求决定。有一点是肯定的：你将需要永远保持信息灵通和与时俱进！


    你还需要知道什么？嗯……那份清单很长。非常长！


    为了支持你新建立的网络安全计划，你还需要知道什么？现在，这更好办了，我有几个想法！


    一般来说，你需要注意的事项往往归入以下类别之一：


    *   **科学发展**。这些是该领域纯粹的发展。正如我提到的，有成千上万的网络安全专业人员在不断突破边界。他们的奉献和突破让世界变得更安全，也让这类书籍成为可能。关于在哪里可以了解他们的持续进展，我的建议是加入一个或多个支持和推动网络安全科学与应用的全球性组织。例如，我曾多次提到
    CIS、ISACA、ISSA、(ISC)²、ISO 和 SANS 学院。还有像 ENISA 和 NIST 这样的政府机构，也为各种行业和公司规模提供了丰富的信息和最佳实践。一点调研（和一些花得值的会费）将大大帮助你保持信息灵通。


