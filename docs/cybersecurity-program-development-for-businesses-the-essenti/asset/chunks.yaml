- raw: "*   *The National Vulnerability Database (NVD)*. If you thought MITRE was\
    \ hot, you haven't seen NVD yet! Originally the brainchild of the National Institute\
    \ of Standards and Technology's (NIST) Computer Security Division, these days\
    \ the NVD is brought to you by your friends at the Department of Homeland Security's\
    \ National Cybersecurity Division. According to them, *The National Vulnerability\
    \ Database (NVD) is the U.S. government repository of standards‐based vulnerability\
    \ management data represented using the Security Content Automation Protocol (SCAP).\
    \ This data enables automation of vulnerability management, security measurement,\
    \ and compliance. The NVD includes security checklists, security‐related software\
    \ flaws, misconfigurations, product names, and impact metrics*.\n\n    When you\
    \ visit their website ([https://nvd.nist.gov](https://nvd.nist.gov)) and click\
    \ on the Vulnerability Search Engine link, you'll have a very powerful research\
    \ tool at your disposal. For example, entering the *CVE‐2015‐1762* vulnerability\
    \ from our previous example, you will get a detailed report including description,\
    \ impact, and references to advisories, solutions, and tools, to say nothing about\
    \ all the technical details you can eat. Personally? You had me at *References\
    \ to Advisories, Solutions, and Tools*.\n\n*   *OWASP*. Last, but not least, we\
    \ have the *Open Web Application Security Project*. OWASP is an international\
    \ open community *dedicated to enabling organizations to conceive, develop, acquire,\
    \ operate, and maintain applications that can be trusted. All of the OWASP tools,\
    \ documents, forums, and chapters are free and open to anyone interested in improving\
    \ application security*. Their claim to fame is the periodic publication of the\
    \ OWASP Top 10 most critical web application security risks.\n\n    It is not\
    \ only an incredibly useful and actionable tool, but it has also significantly\
    \ contributed to cybersecurity awareness among developers, and computer professionals\
    \ as a whole. You will find this and many other tools and guidance at their website:\
    \ [https://www.owasp.org](https://www.owasp.org). Entries for their 2017 OWASP\
    \ Top 10 2017 release candidates have the perennial favorites of Injection, Broken\
    \ Authentication and Session Management, and Cross‐Site Scripting, adding two\
    \ new ones: the Insufficient Attack Protection, and Underprotected APIs.\n\nIs\
    \ that it? Are these three sources all there is? Not even close. There are many\
    \ more sources and resources out there for vulnerability research. Many are free;\
    \ some are subscription‐based. The three listed here are simply a good start:\
    \ They are all free and they will suffice for most organizations' vulnerability\
    \ identification needs. The trick to all this is vigilance. Like all things cybersecurity,\
    \ this means you do it once and recheck at regular intervals. How regular? It\
    \ depends on your systems and assets: No two companies are the same.\n\nHaving\
    \ identified and mapped the known vulnerabilities to your systems, the next step\
    \ is remediation. Known vulnerabilities have, thankfully, known remediation steps.\
    \ If you can, follow them to the letter!\n\nWhy did I say, “*If* you can”? Crazy\
    \ as it may sound, you may not be able to plug a known vulnerability, because\
    \ some application or workflow may actually depend on it. Now, you have a real\
    \ problem: You know you're vulnerable, and you also know you can't fix it. What\
    \ do you do? You apply controls around the known vulnerability to mitigate the\
    \ risk until such time as the genius who wrote the application that depends on\
    \ the vulnerability issues a fix.\n\nFollowing your vulnerability remediation\
    \ is to confirm them as fixed. Your next step, therefore, is to perform a vulnerability\
    \ test.\n\nThis is not to be confused with a penetration test, or “pen test” for\
    \ short. A pen test, simply put, is a simulated cyberattack against your systems\
    \ or company. Pen tests are used to assure that a cybersecurity program is working\
    \ as intended. A vulnerability test, on the other hand, is a diagnostic test that\
    \ will help in the development of your program.\n\n## Vulnerability Testing\n\n\
    Best practice, and my strong recommendation, is to retain a reputable third‐party\
    \ vendor to run vulnerability tests on your behalf. They would get the list of\
    \ your assets and create sets of tests to check against all known vulnerabilities\
    \ against those assets. Once done, the vendor will present you with a list of\
    \ holes you need to plug.\n\nA typical vulnerability test follows the steps discussed\
    \ here:\n\n1.  *The vulnerability test vendor will use your asset classification\
    \ work as input:* This is a critical step, and it's where the quality of your\
    \ earlier work gets to shine. The more detailed and prioritized it is, the easier\
    \ this step becomes. For example, if your list of systems and assets is long,\
    \ you may be forced to prioritize and segment the test. You will do this based\
    \ on the criticality of systems and assets that you established earlier on. I\
    \ strongly recommend that you test all systems, but I do understand that time\
    \ and budgets may force a tiered testing approach. That's fine, insofar as you\
    \ don't make the mistake of thinking that the least important system doesn't need\
    \ the test. In their attempts to be frugal, too many firms approach cybersecurity\
    \ like it's the Maginot Line—France's “impenetrable” defense against Germany that\
    \ didn't extend along the Brussels border, enabling the Nazis to simply go around\
    \ it. That is exactly what hackers hope you'll do with your security. So even\
    \ if you can't test everything at once, make sure you do test everything eventually.\
    \ Otherwise, attackers will simply go around your hardened systems and compromise\
    \ the least important one, using it as a staging point.\n\n2.  *Compare the list\
    \ of assets against known vulnerabilities:* With the assets prioritized, the tester\
    \ will use external resources to match each asset to known vulnerabilities of\
    \ that asset. For example, one question might be: “What are the known vulnerabilities\
    \ for the asset, Windows Server 2008?” There are automated applications that do\
    \ these comparisons, making life easier for all. Nevertheless, that doesn't absolve\
    \ you, or the tester, from double‐checking that work, especially on all critical\
    \ assets. You want to make sure that any automated system is picking up the most\
    \ up‐to‐date vulnerability list, and does so from multiple sources and feeds.\n\
    \n3.  *Test each asset against its identified vulnerabilities:* This can get tricky.\
    \ In some cases, testing for the vulnerabilities is as easy as making sure that\
    \ a security patch has been applied, or the system is running the most current\
    \ version of software. In other cases, you may need to take the system offline\
    \ and check the underlying hardware for one specific vulnerability or another.\
    \ Either way, you'll need the help of at least two technical experts: the vendor\
    \ performing the test and your in‐house (or outsourced) IT team. Both must be\
    \ in alignment about the goals, the methodology, and the end result. A critical\
    \ thing to remember here is to avoid pointing any fingers at the asset's custodians\
    \ (e.g., the IT team). You need to look at this exercise dispassionately—you simply\
    \ need to know the truth of the matter—but also with empathy toward the people\
    \ charged with supporting the asset. Think of a patient going for a CAT scan:\
    \ The radiologists are not there to judge whether you smoked or not. They want\
    \ to perform a test and get a result. Even in an adverse diagnosis, one should\
    \ never berate the patient. What's done is done. The goal after the diagnosis\
    \ is only to apply the cure and the lessons learned."
