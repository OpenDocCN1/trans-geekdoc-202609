  trans: '

    # 网络攻击类型


    ## 暴力破解攻击


    如果黑客攻击系统有任何“优雅”之处可言，那么这种方法完全缺乏优雅。暴力破解攻击正如其名，不需要动脑子，只靠“力量”——在这里指计算力量。因此，如果我想用暴力破解攻击来猜测你的密码，我会使用一台速度极快的计算机尝试数字的每一种可能组合——这项任务可能需要大量时间，也可能只需惊人地短暂时间，具体取决于密码的复杂程度。例如，一个
    4 位数字 PIN 码只需几小时即可通过暴力破解破解。（如果您想测试自己的密码或 PIN 码，以确定暴力破解攻击破解它需要多长时间，请访问 [`passfault.com`](http://passfault.com)，这是一个开放
    Web 应用安全项目 (OWASP) 网站，您可以在那里试一试。）


    ## 拒绝服务攻击


    DoS 攻击分为两种：单源和分布式。单源 DoS 攻击是指一台计算机用大量请求淹没另一台计算机，导致目标计算机无法运行；而分布式拒绝服务 (DDoS) 攻击则通过成千上万台计算机达到相同效果。在
    DDoS 攻击中，这些计算机通常处于僵尸网络的协同控制之下（参见下一节“简明网络安全术语表”），共同向目标发送大量请求，使目标计算机瘫痪。近来，这种攻击类型受到越来越多关注，因为黑客不再使用被攻陷的计算机作为僵尸网络的一部分，而是利用任何连接互联网的数字设备（如保姆摄像头、恒温器等）。大多数此类设备甚至缺乏最基本的安全防护，且太多用户懒得更改默认密码，进一步加剧了这些设备被攻陷并用作僵尸节点的容易程度。


    ## 中间人攻击


    在这种攻击中，黑客拦截两个系统之间的通信，并将其替换为自己的通信，最终导致其控制这两个系统。例如，中间人攻击可用于获取访问凭证，随后在攻击者攻陷目标时伪造正常操作。


    ## 钓鱼攻击


    钓鱼攻击和定向钓鱼攻击使用社会工程学手段。在此语境下，*社会工程学* 只是“撒谎”的花哨说法。黑客让受害者相信攻击者是值得信任的实体（如朋友、知名企业、机构或政府机关），诱骗受害者自愿交出数据。这些攻击的目的是获取您的信任，以便您向攻击者泄露敏感信息。此类攻击的复杂程度各异，从臭名昭著的尼日利亚王子索要银行信息，到冒充银行或美国国税局
    (IRS) 的邮件，再到极其复杂的骗局，甚至能欺骗准备最充分、最怀疑的受害者。


    # 简明网络安全术语表


    本简明术语表收录了网络安全行话中的大多数主要术语。这些行话在媒体和企业内部都被频繁提及。部分术语有重叠。因此，备有一份术语表以供随时查阅非常方便。有些术语您听说过，有些您在邮局海报上见过，还有一些可能是全新且令人兴奋的，比如
    `rootkit`。


    我们将按字母顺序排列，请记住这只是一个部分列表：


    *   **Adware（广告软件）**：这类软件可能无害，但同时极其恼人。它们是讨厌的小程序，一旦进入您的计算机就会……向您展示广告！那是您走运的情况下。因为如今广告软件已被更恶劣的恶意软件取代。


    *   **Botnet（僵尸网络）**：由 ro**BOT** 和 **NET**work 组成的复合词。它既用来描述工具（软件），也用来描述被攻陷的、相互连接的计算机集合，这些计算机可用于发起大规模网络攻击，通常表现为拒绝服务攻击，我们将在后文进一步探讨。


    *   **Industrial control systems (ICSs)（工业控制系统）**：这些是运行在大型机器内部的小型计算机。想象一下工厂里的风扇，根据温度等因素自动开启和关闭。ICSs
    往往是关键漏洞，因为它们通常基于较旧的技术，且可能难以通过补丁轻松更新以防范攻击。该类别中的其他术语包括 SCADA 系统（数据采集与监视控制系统 / 分布式控制系统）和
    PLC（可编程逻辑控制器）。ICSs 通常见于电力、水和废水、石油和天然气、交通、化工、制药、造纸、食品和饮料、离散制造（如汽车、航空航天和耐用消费品）等行业。SCADA
    系统通常用于通过集中式数据采集和监视控制来控制分散的资产。PLC 提供调节控制。


    *   **Internet of Things (IoT)（物联网）**：IoT 指另一个网络，由通常不被视为计算机的物理设备组成——例如恒温器、家电、汽车，甚至可穿戴设备（作为衣物或配饰一部分佩戴的设备）。这些设备的主要功能是感知并将数据传输给控制器，控制器根据传感器读数采取行动。IoT
    设备往往容易受到攻击，因为它们使用简单的电路，缺乏完善的防御或安全措施。


    *   **Key loggers（键盘记录器）**：这些是间谍软件这一大类的子集，能记录您输入的所有内容并发送出去。正如您所想，它们极具破坏力，因为您输入密码、机密文件，甚至奶奶肉饼的秘方。键盘记录器不断进化，现代键盘记录器能捕获按键、鼠标移动和屏幕内容。讨厌的小虫子。


    *   **Malware（恶意软件）**：这是设计用于做坏事的软件的总称。键盘记录器是恶意软件，广告软件也是。虽然这些软件都是坏的，但叫它们 badware
    听起来不好听——所以叫 malware。而且是的，有时似乎恶意软件比良性软件还多。


    *   **Operational Technology (OT)（运营技术）**：OT 与前文讨论的工业控制系统 (ICSs) 同义，但用得更狭窄，指业务层面而非大规模基础设施。


    *   **Ransomware（勒索软件）**：当黑客锁定您的计算机（通常通过加密数据），并勒索钱财以解锁时，就会发生勒索软件攻击。勒索软件的“黑暗之美”在于您可以搞大规模（如黑客接管加利福尼亚一家医院的计算机系统，勒索数千美元赎金），也可以搞小规模，攻击数千台计算机，向每个用户勒索几百美元。随着如此多的选择和如此多的脆弱系统，勒索软件已成为一门大生意且利润丰厚。以至于在暗网上您可以买到“自制勒索软件工具包”，并将其部署到您选择的目标上。


    *   **Rootkit（根工具包/Rootkit）**：Rootkit 是一组软件，一旦安装，会修改操作系统以隐藏自身以及内部或即将到来的其他恶意程序。Rootkit
    是终局，是任何复杂攻击的目标。一旦安装了 Rootkit，入侵者就稳操胜券。他们可以不被发现地长期潜伏、攻陷更多系统、窃取或破坏数据，并随心所欲地摆布您的资产。


