    # Algorithmic distinctions


    Concretely, what autonomous machines do is classify reality (Beckmann and Bowker
    2019; Mackenzie 2015; Fourcade and Johns 2020; Hallinan and Strihas 2016; Ananny
    2016). The code in culture is deployed to sort images based on their visual content;
    products according to their statistical relatedness; user profiles depending on
    their creditworthiness, predicted interests or employability; news articles based
    on their estimated relevance for specific users. Hence, the agency and computational
    authority of algorithms, and, in particular, of machine learning systems, rest
    on their practical ability to draw probabilistically meaningful distinctions among
    ‘objects, people and practices’ (Lamont and Molnár 2002: 168).


    Algorithmic distinctions are there for all to see. The machine learning systems
    embedded in search engines are designed'
