    allow them to operate, researchers have significantly contributed to unboxing
    the culture in the code and its many myths (see Table 3). Yet, this research strategy
    is probably too demanding for projects that mainly focus on the code in the culture.
    Following machine creators essentially serves to facilitate our understanding
    of the building of deus in machina and machine habitus – i.e. how artificial social
    agents are designed, programmed and selectively socialized.


    A second, more straightforward option is following the users of algorithmic systems,
    in order to see socio-material entanglements from their supervised and classified
    perspective. This has been done by focusing on imaginaries, levels of awareness,
    reactions and forms of resistance, but not exclusively – from a qualitative perspective
    (see Table 3 for examples). While for understanding the uses of and discourses
    algorithmic systems, this methodological choice does not allow us to reliably
    grasp the non-declarative (Lizardo 2017), dispositional and computational aspects
    of human-machine interactions – unless digital traces of social agents’ practices
    and recursive interactions can be included in the analysis (Airodi 2021).


    A third approach consists of following the medium meaning the techno- environment
    where users and machines interact. This is also the motto of the domain of media
    research known as ‘digital methods’, which studies the unfolding of social and
    cultural phenomena online (Rogers 2013). Following the medium serves to track
    a digital infrastructure, focusing on its affordances and/or the more-than-human
    practices taking place within it (see Table 3). Often based on computational methods
    and digital data, this research direction is best suited for studying how a technoso-social
    field – with boundaries and doxa – works and evolves over time (see Chapter 4).


    Lastly, a fourth and certainly less established research direction is to follow
    the algorithm. This is best illustrated by the analysis of recommended music on
    YouTube presented at the end of Chapter 3, quantitatively tracing machine outputs
    and their associations. Several other recent papers have taken similar methodological
    pathways, in order to study the practices, cultural dispositions and social effects
