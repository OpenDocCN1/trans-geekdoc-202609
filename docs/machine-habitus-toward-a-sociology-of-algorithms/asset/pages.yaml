  md: '# Culture in the Code 35


    Torpignattara. Families get bigger, apartments smaller, while population density
    grows exponentially. The share of inhabitants with a university degree drops by
    two thirds, and house prices follow a similar trend. In Torpignattara there are
    fewer cinemas, theatres and libraries per inhabitant than in Parioli, where residents
    are richer and healthier (Lelo, Monni and Tomassi 2019). The poorer neighbourhood
    – ‘city of thousands’, as it has been called (Desiati 2017) – sees forms of social
    solidarity and belonging. ‘conditions of existence’ (Bourdieu 1977) vary dramatically
    between these two areas of Rome, so do the cultural schemes and practical reason
    interiorized and reproduced by their inhabitants – whether human or not.


    IAQOS is quite different from the AI systems that we ordinarily encounter in our
    digital peregrinations. These have commercial goods, such as sorting products
    in optimal ways, maximizing revenues through subtle nudging techniques, and spying
    on us. IAQ creators, Oriana and Salvatore, compared these ordinary platform algorithms
    to battery chickens, enslaved for the sake of production. In their immaterial
    cages, the placeless infrastructures of mobile apps and digital platforms, there
    is no neighbourhood, no café, no school. How can they be socialized then? Where?
    Into what culture? By whom?


    This chapter will show that, when applied to the ordering of the social world,
    all machine learning systems are socialized, based on data contexts that bear
    the imprint of socially located cultural realities. Input data are not the only
    source of the culture in the code. In fact, the culturally informed choices and
    goals of those in developing and programming algorithms are inscribed in their
    design features, as a sort of deus in machina. However, in the age of deep learning
    and platform data, machine creators have partly lost control of their own technological
    products. AI systems are embedded in dynamic feedback loops within defied social
    environments, whose systemic outcomes are often hard to forecast. Their artificial
    cognition can be extremely complex and difficult to explain from the outside.
    As a result, biases and cultural inclinations derived from the social world are
    technologically spread by automated systems, contrary to their widely supposed
    neutrality.'
