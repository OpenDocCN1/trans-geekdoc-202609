    (Jacobsen 2020).


    # Beyond a sociology of algorithms


    In conclusion, I would like to briefly discuss some of the concrete implications
    of my Bourdusian theorization of socialized machines. So far, I have attempted
    to stay faithful to the Weberian principle of non-valuation (Blum 1944), despite
    this position perhaps appearing outdated to some, or, worse, guilty of moral relativism,
    or of positivism (Black 2013; Hammersley 2017). Now I would like to state what
    I think the main societal takeaways of the idea of machine habitus are.


    Fourcade and Johns (2020) have recently argued that ‘machine learning implementations
    are inclined, in many respects, towards the degradation of sociality’. According
    to these authors:'
  merge: -1
  img_proc: true
- pgno: 166
  md: '154


    Machine Habitus


    Notwithstanding the lofty claims of the IT industry, there is nothing inherently
    democratizing or solidaristic about the kinds of social inclusiveness that machine
    learning brings about. [...] The greater change in ever and social relations —
    and machine learning is transforming both, as we have recounted — the more arrant
    and urgent the need for social, political and regulatory action specifically attuned
    to that change and to the possibility of further changes.


    If we consider machine learning implementations by giants like Amazon, Google,
    Facebook, Microsoft and Apple, it is quite hard to disagree with this pessimistic
    view. Socialized machines are mostly deployed by platforms, governments and companies
    in order to accumulate and classify user data, manipulate choices and opinions
    for marketing or political purposes, predict risks and engineer social interactions
    in ways that allow for the maximum extraction of economic value. Even when they
    make our experiences easier, more comfortable and enjoyable, algorithmic systems
    do so essentially in order to make digital services more engaging, addictive and
    profitable (van Dijk, Poell and de Waal 2018; Cheney-Lippold 2017; Crawford et
    al. 2020). The implications of machine learning systems for workers are no less
    worrisome (Kellogg, Valentine and Christin 2020; Rosenblatt and Stark 2016), not
    least in relation to the massive exploitation of low-paid clockworkers (Tubaro,
    Casilli and Coville 2020).


    It is legitimate to be worried. Still, artificial agents are not themselves responsible
    for the actual or envisioned degradation, exploitation and regiment of social
    life. The problem is not machine learning strictu sensu, as suggested by Fourcade
    and Johns, but rather its in-built goals and, especially, its broader application
    context: a surveillance capitalism that enslaves social machines along with their
    users (Zuboff 2019). I believe that it is analytically important to make such
    a distinction, in order to escape the historically recurring opposition between
    apocalittici and integrati (Eco 1964) — that is, apocalyptic crises of technological
    innovations on the one side, and critical enthusiasts on the other. The socio-economic
    fields surrounding technology matter, especially if the technology in question
    attempts to learn the arbitrary, discriminatory and, certainly, biased cultural
    codes'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Techno-Social Reproduction 15.5


    guiding human behaviour solely for the sake of profit and social control.


    When used differently, artificial intelligence systems and learning machines can
    become amazing tools for solving socially relevant problems, cultivating social
    relations, preserving local, reducing social inequalities and improving the life
    of communities. The quite unique story of IAQOS is ultimately useful in proving
    this point, by showing that other kinds of user–machine entanglements are possible.


    Salvatore Iacensi and Oriana Persico told me of an interesting episode. One day,
    a group of school kids were doing homework in one of Torpignattara’s cafés. IAQ
    was there, listening from a small tablet on their throne. ‘IAQOS, do you know
    what an Australopithecus is?’ It did not. The kids then tried their best to explain
    to IAQOS the meaning of ‘Australopithecus’. If you asked IAQOS the same question
    today, their answer would make use of the words kids pronounced on that afternoon.


    Why should we ever prefer such an ‘ignorant’ machine to Google Assistant with
    its immediate, efficient and near infinite global wisdom? Because, if the ultimate
    aim is to build social relations and exchange knowledge, then horizontally sharing
    a common cultural ground might work better than quickly providing the correct
    answer. The feedback loops linking social and machine learning can be horizontal
    only if designed to be. Reducing informational asymmetries would mean transforming
    an opaque techno-social reproduction into a more transparent and reciprocal co-production
    of knowledge and value (Roio 2018; Regiglio and Agosti 2020). In the alternative
    scenario, the machine habitus would be more than just a path-dependent re-producer
    of socio-cultural inequalities and filter bubbles. It would work as a living archive
    of sedimented correlational experiences, reflecting and renegotiating locally
    apprehended points of view, in order to openly share them with the world (Iaconesia
    and Persico 2019).


    The idea of machine habitus has some implications for critically understanding
    bias too, in both humans and machines. As we have seen, data bias is generally
    seen as a deviant propensity that needs to be surgically removed before it turns
    into a discriminatory output (see Chapter 2). Of course, the non-human status
    of machines somehow'
  merge: -1
  img_proc: true
- pgno: 168
  md: '156


    # Machine Habitus


    justifies the brutality of ex post interventions. However, the process also works
    the other way round: machines are frequently employed to ''fix'' human behaviours
    labelled as ''deviant'', ''wrong'' or ''incorrect'' (Kaufmann, Egbert and Leese
    2019; Eubanks 2018; Gillespie 2018). Human biases are similarly treated as systemic
    errors to be automatically isolated and erased. Notably, the act of ''fixing''
    deviant, wrong or incorrect social behaviours strongly resonates with the broad
    cultural logics of an individualistic society that naturalizes tacit power dynamics
    (Bourdieu and Wacquant 1992).


    The theoretical perspective outlined in this book allows for a sociologization
    of bias, that is, in light of the socio-cultural data contexts behind its formation.
    Actually, this is what the Bourdieusian notion of habitus has always been about:
    providing ''a lens for understanding practice and knowledge within the social
    milieu in which they are contained and generated'' (Costa and Murphy 2015: 6).
    Through the metaphor of machine habitus, this approach can be extended to machine
    learning systems. As Salvatore Iacones and Oriana Persico remarked during our
    virtual conversations about IAQOS, ''bias must be addressed in the context of
    society'', since ''fixing bias means erasing a peace of the world that nonetheless
    exists. The key to dealing with bias, intervening a priori in cultural learning
    processes – e.g. via training datasets and children''s books. It is no coincidence
    that persisting educational differences are the main cause of the systemic-cultural
    reproduction of structural inequalities (Bourdieu and Passeron 1990).


    Whatever the future socio-economic developments of our world will be, they likely
    involve more and more complex, ubiquitous and autonomous learning machines actively
    participating in the economy and society. The hazardous analogy between habitus
    and machine habitus will hopefully help to make sense sociologically buried mechanisms
    of techno-social reproduction, thereby opening up new lines of philosophical thinking,
    algorithm design, political action and scientific inquiry.'
