    background in philosophy developed an original theoretical framework, whose cornerstone
    is the notion of ''habitus''. He was Pierre Bourdieu (1930–2002), who is unanimously
    considered one of the most influential social thinkers of the twentieth century.
    Aiming to deal with a different (but related) dualism – that is, between the ''technical''
    and ''the social'' in sociological research – this book seeks to treat machine
    learning algorithms with the same analytical machinery as people* (Law 1990: 8).
    I will build on the analytical machinery originally developed by Bourdieu, and
    argue that the particular ways in which these artificial social agents act in
    society should be traced back to the cultural dispositions inscribed in their
    code.


    # Seeing algorithms with the eyes of Pierre Bourdieu


    Why do individuals born and raised under similar social conditions happen to have
    almost identical lifestyles, ways of walking and speaking, modes of thinking and
    acting within the world? Why do unskilled workers and highly educated bourgeois
    have such different ideas about what makes a song ''bad'', a piece of furniture
    ''nice'', a TV show ''disgusting'', a behaviour ''inappropriate'', a person ''valuable''?
    How come that the everyday practices of women and men, Algerian farmers and French
    colonialists, dominated and dominators, end up jointly reproducing material and
    symbolic inequalities? These are some of the crucial questions Bourdieu asked
    in his research. All point to a general sociological dilemma, and have a common
    theoretical solution: ''So why is social life so regular and predictable? If external
    structures do not mechanically constrain action, what then gives it its pattern?
    The concept of habitus provides part of the answer'' (Bourdieu and Wacquent 1992:
    18).


    The habitus is defined as a system of ''durable, transposable dispositions'' which
    derives from the ''conditions of existence'' characteristic of a particular social
    environment (Bourdieu 1977: 72). Such embodied dispositions are formed at a young
    age and tend to orient one''s entire life, social exchanges, practices and even
    perceptions (Bourdieu 1981). Bourdieu''s'
