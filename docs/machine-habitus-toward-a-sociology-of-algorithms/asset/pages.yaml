- pgno: 13
  md: '# #1


    # # Why Not a Sociology of Algorithms?


    # ## Machines as sociological objects


    Algorithms of various kinds hold the social world together. Financial transactions,
    dating, advertising, news circulation, work organization, policing tasks, music
    discovery, hiring processes, customer relations — all are to a large extent delegated
    to non-human agents embedded in digital infrastructures. For some years we have
    all been aware of this, thanks to academic research and popular books, journalistic
    reports and documentaries. Whether from the daily news headlines or the dystopian
    allegories of TV series, we have come to recognize that almost everything is now
    ‘algorithmic’ and that artificial intelligence is revolutionizing all aspects
    of human life (Amore and Piotukh leaving aside simplifications of popular media
    and the wishful thinking of techno-chauvinists, this is true for the most part
    (Brouard 2018; Sumpter 2018). Yet, many sociologists and social scientists continue
    to ignore algorithms and AI technologies in their research, or consider them at
    best a part of the supposedly inanimate material background of social life. When
    researchers study everyday life, consumption, social interactions, media, organizations,
    cultural taste or social representations, they often unknowingly observe the consequences
    of the opaque algorithmic processes at play'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Machine Habitus


    in digital platforms and devices (Beer 2013a). I argue that it is time to see
    both people and intelligent machines as active agents in the ongoing realization
    of the social order, and I propose a set of conceptual tools for this purpose.


    Why only now?, one may legitimately ask. In fact, the distinction between humans
    and machines has been a widely debated subject in the social sciences for decades
    (see Cerulo 2009; Fields 1987). Strands of sociological research such as Science
    and Technology Studies (STS) and Actor-Network Theory (ANT) have strongly questioned
    mainstream sociology’s lack of attention to the technological and material aspects
    of social life.


    In 1985, Steve Woolgar’s article ‘Why Not a Sociology of Machines?’ appeared in
    the British *Sociology*. His main thesis was that, just as a ‘sociology of science’
    appeared problematic before Kuhn’s theory of scientific paradigms was later turned
    into an established field of research, intelligent machines should finally become
    ‘legitimate sociological objects’ (Woolgar 1985: 558). More than thirty-five years
    later, this is still a largely unaccomplished goal. When Woolgar’s article was
    published, research on AI systems was heading for a period of stagnation commonly
    known as the ‘AI winter’, which lasted until the recent and ongoing hype around
    big-data-powered AI (Floridi 2020). According to Woolgar, the main goal of a sociology
    of machines was to examine the practical day-to-day activities and discourses
    of AI researchers. Several STS scholars have subsequently followed this direction
    (e.g. Seaver 2017; Neyland 2019). However, Woolgar also envisioned an alternative
    sociology of machines with ‘intelligent machines as the subjects of study’, adding
    that ‘this project will only strike us as bizarre to the extent that we are unwilling
    to grant human intelligence to intelligent machines’ (1985: 567). This latter
    option may not sound particularly bizarre today, given that a large variety of
    tasks requiring human intelligence are now routinely accomplished by algorithmic
    systems, and that computer scientists propose to study the social behaviour of
    autonomous machines ethologically, as if they were animals in the wild (Rahwan
    et al. 2019).'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Why Not a Sociology of Algorithms?


    Even when technological artefacts could hardly be considered ‘intelligent’,¹ actor-network
    theorists radically revised-concept notions of agency by portraying both material
    objects and humans as ‘actants’, as sources of action in networks of relations
    (Latour 2005; Akrich 1992; Law 1990). Based on this theoretical perspective, both
    a ringing doorbell and the author of this book can be seen as equally agent (Cerulo
    2009: 534). ANT opposes not only the asymmetry between humans and machines, but
    also the more general ontological divide between the social and the natural, the
    animated and the material. This philosophical position has encountered a diffuse
    criticism (Cerulo 2009: 535; Müller 2015: 30), since it is hardly compatible with
    most of the anthropocentric theories employed in sociology – except for that of
    Gabriel Tarde (Latour et al. 2012). Still, one key intuition of ANT increasingly
    resonates throughout the social sciences, and as in the present work: what we
    call social life is nothing but the socio-material product of heterogeneous arrays
    of relations, involving human as as non-human agents.


    According to ANT scholar John Law (1990: 8), a divide characterized sociological
    research at the beginning of the 1990s. On one hand, the majority of researchers
    were concerned with the ‘social’, and thus studying canonical topics such inequalities,
    culture and by focusing exclusively on people. On the other hand, a minority of
    sociologists were studying the ‘merely technical’ level of machines, in fields
    like STS or ANT. They examined the micro-relations between scientists and laboratory
    equipment (Latour and Woolgar 1986), and the techno-social making of aeroplanes
    and gyroscopes (Macenzie 1996), without taking part to the ‘old’ sociological
    debates about social structures and political struggles (Mackenzie and Wajcman
    1999: 19). It can be argued that the divide described by Law still persists in
    sociology, although it has become evident that ‘the social


    ¹ The status of artificial intelligence – whether it could become ‘general’, or
    is to remain a ‘narrow’ mathematical manifestation as in the case of current machine
    learning systems – is a debated issue that goes beyond the scope of the present
    work. For a non-technical overview, see Broussard.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Machine Habitus


    order is not a social order at all. Rather it is a sociotechnical order. What
    appears to be social is partly technical. What we usually call technical is partly
    social’ (Law 1990: 10).


    With the recent emergence of a multidisciplinary scholarship on the biases and
    discriminations of algorithmic systems, the interplay between ''the social'' and
    ''the technical'' has become more visible than in the past. One example is the
    recent book by the information science scholar Safiya Umoja Noble, Algorithms
    of Oppression (2018), which illustrates how Google Search results tend to reproduce
    racial and gender stereotypes. Far from being merely ''technical'' the unstable
    socio-technical arrangement of algorithmic systems, web content providers and
    crowds of googling users on the platform contributes to the discriminatory social
    representations of African Americans. According to Noble, more than neutrally
    divided country, the (socio-)technical arrangement of Google Search amplifies
    and reifies the commodification of black reifies the commodification of black
    women’s bodies.


    I believe that it should be sociology’s job to explain and why and under what
    circumstances algorithmic systems may behave this way. The theoretical toolkit
    of ethology mobilized by Rahwan and colleagues (2019) in a quite simple reason:
    machine learning tools are eminently social animals. They learn from the social
    – datified, quantified and transformed into computationally processable probabilistic
    relations among people, objects and information – and then manipulate it, by drawing
    information. While Rahwan et al. are right in putting forward the ‘scientific
    study of intelligent machines, not as engineering artefacts, but as class of actors
    with particular behavioural patterns and ecology’ (2019: 477), their analytical
    framework focuses on ‘evolutionary’ and ‘environmental’ dimensions only, downplaying
    the cornerstone of anthropological and sociological explanations, that is culture.
    Here I argue that in order to understand the causes and implications of algorithmic
    behaviour, it is necessary to first comprehend how culture enters the code of
    algorithmic systems, and how it is shaped by algorithms in turn.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Why Not a Sociology of Algorithms?


    Two major technological and social transformations that have taken place over
    the past decade make the need for a sociology of algorithms particularly pressing.
    A first, quantitative shift has resulted from the unprecedented penetration of
    digital technologies into the lives and routines of people and organizations.
    The rapid diffusion of smartphones since the beginning of the 2010s has literally
    put powerful computers in the hands of billions of individuals throughout the
    world, including in its poorest and most isolated regions (IWS 2020). Today’s
    global economic system relies on algorithms, data and network infrastructures
    to the point that fibre Internet connections are no longer fast enough for automated
    financial transactions, leading to faster microwave or laser-based communication
    systems being installed on rooftops near New York’s trading centres in order to
    speed up algorithmic exchanges (D. Mackenzie 2018). Following the physical distancing
    norms imposed worldwide during the Covid-19 pandemic, the human reliance on digital
    technologies for work, leisure and interpersonal communication appears to have
    increased even further. Most of the world’s population now participate in what
    can be alternatively labelled ‘platform society’ (van Dijk, Poell and de Waal
    2018), ‘metadata society’ (Pasquinelli 2018) or ‘surveillance capitalism’ (Zuboff
    2019), that is, socio-economic systems heavily dependent on the massive extraction
    and predictive analysis of data. There have never been so many machines so deeply
    embedded in the heterogeneous bundle of culture, relations, institutions and practices
    that sociologists call ‘society’


    A second, qualitative shift concerns the types of machines and AI technologies
    embedded in our digital society. The development and industrial implementation
    of machine learning algorithms that ‘enable computers to learn from experience’
    have marked an important turning point. ‘Experience’, in this context, is ‘a dataset
    of historic events’, and ‘learning’ means identifying and extracting useful patterns
    from a dataset (Kelleher 2019: 253).


    In 1989, Lenat noted in the pages of the journal Machine Learning that ‘human-scale
    learning demands a humanscale amount of knowledge’ (1989: 255), which was not
    yet available to AI researchers at the time. An impressive'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Machine Habitus


    advancement of machine learning methods occurred two decades later, thanks to
    a ‘fundamental socio-technological transformation of the relationship between
    humans and machines’, consisting in the capturing of human cognitive abilities
    through the digital accumulation of data (Mühlhoff 2020: 1868). This paradigmatic
    change has made the ubiquitous automation of social and cultural tasks suddenly
    possible on an unprecedented scale. What mattersologically is ‘not what happens
    in the machine’s artificial brain, but what the machine tells its users and the
    consequences of this’ (Esposito 2017: 250). According to Esposito, thanks to the
    new cultural and communicative capabilities developed by ‘parasitically’ taking
    advantage of humangenerated online data, algorithms have been substantially turned
    into ‘social agents’.


    Recent accomplishments in AI research – such as AlphaGo, the deep learning system
    that achieved a historic win against the world champion of the board game Go in
    2016 (Chen 2016; Broussard 2018), or GPT-3, a powerful algorithmic model released
    in 2020, capable of autonomously writing poems, computer code and even philosophical
    texts (Weinberg 2020; Askell 2020) – indicate that the ongoing shift toward the
    increasingly active and autonomous participation of algorithmic systems in the
    social world is likely to continue into the near future. But let’s have a look
    at the past first.


    # Algorithms and their applications, from Euclid to AlphaGo


    The term ‘algorithm’ is believed to derive from the French bastardization of the
    name of the ninth-century Persian mathematician al-Khwārizzī, the author of the
    oldest known work of algebra. Being originally employed in medieval Western Europe
    to indicate the new calculation methods alternative to those based on Roman numerals,
    in more recent times the term has come to mean ‘any process of systematic calculation
    […] that could be carried out automatically’ (Chabert 1999: 2). As Chabert remarks
    in his book A History of the Algorithm: ‘algorithms have been around since the
    beginning of time and existed well before a special'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Why Not a Sociology of Algorithms?


    word had been coined to describe them’ (1999: 1). Euclid’s algorithm for determining
    the greatest common divisor of two integers, known since the fourth century BCE,
    is one of the earliest examples.


    More generally, algorithms can be intended as computational recipes, that are
    step-by-step instructions for transforming input data into a desired output (Gillespie
    2014). According to Gillespie (2016: 19), algorithms are essentially operationalized
    procedures that may be distinguished from both their underlying ‘model’ – the
    ‘formalization of a problem and its goal, articulated in computational terms’
    – and their final context of application, such as the technical infrastructure
    of a social media platform like Facebook, where sets of algorithms are used to
    allocate personalized content and ads in users’ feeds. Using a gastronomic metaphor,
    the step-by-step procedure for cooking an apple pie is the algorithm, the cookbook
    recipe works as the model, and the kitchen represents the application context.
    However, in current public and academic discourse, these different components
    and meanings need to be conflated, and the term algorithm is broadly employed
    as a synecdoche for a ‘complex socio-technical assemblage’ (Gillespie 2016: 22).


    Algorithm is thus slippery umbrella term, which may refer to different things
    (Seaver 2017). There are many kinds of computational recipes, which vary based
    on their realms of application as well as on the specific ‘algorithmic techniques’
    employed to order information and process data (Rieder 2020). A single task, such
    as classifying texts by topic, may concern domains as diverse as ‘spam’ filtering,
    content moderation, product recommendation, behavioural targeting, credit scoring,
    financial trading and all of which involve a plethora of input data and outputs.
    Furthermore, text classification tasks can be executed in several yet all ‘algorithmic’
    – ways: by hand, with pen and paper; through rule-following software models predefined
    by human programmers (e.g. counting topic-related word occurrences within texts);
    or via ‘intelligent’ machine learning systems that are not explicitly programmed
    a priori. These latter can be either supervised i.e. requiring a preliminary training
    process based on data examples, as in the case of naive Bayes text classifiers
    (Rieder'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Machine Habitus


    2017) – unsupervised, that is, machine learning techniques working without pre-assigned
    outputs, like Latent Dirichlet Allocation in the field of topic modeling (Beckmann
    and Bowker 2019).


    This book does not aim to offer heavily technical definitions, nor an introduction
    to algorithm design and AI technologies; the reader can easily find such notions
    elsewhere. Throughout the text, I will frequently make use of the generic terms
    ‘algorithm’ and ‘machine’ to broadly indicate automated systems producing outputs
    based on the computational elaboration of input data. However, in order to highlight
    the sociological relevance of the quali-quantitative transition from Euclid’s
    calculations to today’s ‘intelligent’ artificial agents like GPT-3 and AlphaGo,
    some preliminary conceptual distinctions are needed. It is apparent, in fact,
    that the everyday socio-cultural implications of algebraic formulas used for centuries
    by hand via mechanical calculators are not even close in magnitude to those of
    the algorithms governing information networks.


    Below I briefly outline the history of algorithms and their applications – from
    ancient algebra to rule-following models running on digital computers, and beyond
    platform-based machine learning systems. This technical evolution can be roughly
    broken into three main eras, visually summarized in Figure 1 at the end of this
    section. Without pretending to be exhaustive, the proposed periodization focuses
    especially on the emergence of ‘public relevance algorithms’ (Gillespie 2014:
    168), that is, automated systems dealing with the social matter of human knowledge,
    experience and practice.


    # Analogue Era (~1945)


    Taking analogue to mean ‘not-digital’ (Sterne 2016), this first historical phase
    ranges in principle from the invention


