    # Machine Habitus


    People with distinct backgrounds in terms of class, gender, age, ethnicity or
    education not only tend to talk and consume differently from one another, they
    also have distinct usages of, as well as degrees of access to, the digital infrastructures
    that transform such regularities into machine-readable data (Mihelji, Legumina
    and Downey 2019; Hargittai and Micheli 2019). Lutz (2019) provides an overview
    of different forms of ‘digital inequalities’. While in recent decades the digital
    divide has globally decreased, with 62 per cent of the world’s population having
    access to the Internet in 2020, significant variations within and among countries
    and continents still exist. For instance, the Internet penetration rate is 90.3
    per cent in North America and 42.2 per cent in Africa (IWS 2020), where connections
    are mainly via mobile devices – this implying further limitations in terms of
    use and available content (Napoli and Obar 2014). Empirical research has widely
    documented how variations in digital media for work and leisure are rooted in
    socio-economic inequalities, which produce asymmetries in digital literacy and
    skills (Lutz 2019). The structurally unequal access to and use of Internet-based
    services became particularly visible during the lockdown periods that, in many
    countries, followed the coronavirus emergency, and especially in relation to children’s
    distance education (Bacher-Hicks, Goodman and Mulhen 2021). Digital inequalities
    ultimately compromise the representativeness of the data samples used in machine
    training by making them biased and socially unbalanced (Micheli, Lutz and Moritz
    2018; Olteanu et al. 2019; Baeza-Yates 2018).

    The ‘education’ of a machine learning system may depend on sources other than
    user-generated data. For specific computer vision tasks, the unadorned images
    of Google Street View are much more useful than Instagram pictures. And, as we
    have seen, besides Internet users, the AI industry heavily relies on micro-workers
    as machine trainers. Chatbots, digital assistants and machine translators are
    often instructed based on digitized books, press articles and even movie dialogues.
    Yet, also in these cases, ‘the social’ is right there. It is hidden in the sexist
    and racist labels employed in micro-workers’ data annotations (Crawford and Paglen
    2019), as well as in the models of parked photographed by Google Street View –
    which have been used to'
