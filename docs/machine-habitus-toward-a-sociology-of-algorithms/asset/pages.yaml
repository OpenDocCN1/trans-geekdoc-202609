  md: '# Machine Habitus


    How can we understand machine bias sociologically, as one dimension of the cultures
    in the code? What kinds of dataied culture inhabit the algorithms that we ordinarily
    encounter online? What are the socialization processes leading to the formation
    of the machine habitus? These questions lie at the core of the present chapter,
    which begins by asking: where does the culture in the code come from?


    # Humans behind machines


    The humans behind machines are hidden. STS scholars have widely investigated how
    historical, political, economic, scientific and organizational processes jointly
    intervene in the social shaping of technology (see Mackenzie and Wajman 1999).
    Nevertheless, with the social origins of cultural taste illuminated by Bourdieu
    in Distinction (1984), the social roots of technological artefacts tend to be
    ‘naturalized’ or, better, ‘black-boxed’ (Latour and Woolgar 1986: 259). Technology
    is typically assumed to be ‘independent’ from society, ‘impacting on society from
    outside of society’ (Macenzie and Wajman 1999: 5). Such an assumption is even
    more common in the case of algorithms, given their automated and opaque functioning
    (Bechmann 2019; Gillespie 2014).


    The public discourse on automation is never just about the benefits of saving
    time and money: its greatest perceived advantage is getting rid of humans’ arbitrariness,
    fallacies and weaknesses. If the automated analysis of huge datasets provides
    the practical answers to our problems, why do we need scientists and their theories?
    as Chris Anderson, the editor of Wired, (in)ously asked in ‘The End of Theory’
    (2008). From the times of Leibniz to those of Musk, the automation of calculus
    has been regarded as synonymous with objectivity, accuracy and neutrality – to
    the point that even the very methods currently proposed to prevent algorithmic
    bias with a view to avoiding any human intervention (e.g. Jiang and Nachum 2020).


    As Gillespie noted, ‘conclusions described as having been generated by an algorithm
    wear a powerful legitimacy’'
