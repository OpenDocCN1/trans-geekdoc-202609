    we will call this fictitious character Andrea, and use an impersonal pronoun,
    to remain vague about ‘its’ gender. Even from within the mom’s belly, Andrea could
    feel that society was somehow out there. It could hear the music and voices in
    the room, experience the organic food eaten by its mother, or the vibrations of
    public transportation while she was on her way to work. Then, once born, Andrea
    is catapulted into a noisy and vastly unequal social world, eager to learn and
