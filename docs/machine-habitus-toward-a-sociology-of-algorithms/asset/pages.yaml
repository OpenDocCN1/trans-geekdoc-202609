- pgno: 103
  md: '# Code in the Culture 91


    to present them. (2) The user chooses an action, thereby revealing information
    about their knowledge and preferences to the controlling agent. [...] (3) The
    cycle repeats resulting in a process of feedback and learning. (Burr, Cristianiani
    and Ladyman 2018: 736)


    Here I argue, depending on the contingent combination of two main dimensions –
    that is, high/low informational asymmetry and strong/weak cultural alignment –
    the recursive interactions between humans and machines can assume four main ideal-typical
    configurations, which will be illustrated in the following section.


    First, let me clarify what I mean by informational asymmetry. In the near totality
    of their digitally mediated interactions, artificial agents have more information
    on users’ behaviour than users on the agents’ algorithmic functioning. In the
    critical literature, opacity and inscrutability have been indicated as constitutive
    features of algorithms and AI technologies (Burrell 2016; Dour 2016; Pasquale
    2015; Campolo and Crawford 2020; Cardon 2018; Bucher 2012a). Following the programmer,
    artist and activist Denis Rojo, while we see a growth of the possibilities to
    harvest data from ‘smart environments’, while sensors proliferate in public and
    private spaces, is limited knowledge on how to understand the algorithms that
    process such data’, also due to ‘proprietary barriers from the very access to
    such algorithms’ (2018: 54). Even though bottom-up attempts to reverse-engineer
    the black-boxed computational logics governing human–machine interactions regularly
    take place (Siles et al. 2020; Bucher 2017), the exact formulation of the code
    is changeable and largely ‘immune from scrutiny’ (Pasquale 2015: 5). Artificial
    agents, on their part, are fed with updated information as possible about users’
    local data contexts (Fourcade and Johns 2020). When a machine learning system
    starting with a recently registered user, its initial predictions rely little
    or no information – an issue known in computer science as a ‘cold start problem’
    (Celma 2010; Seaver 2019). The longer its secondary machine socialization, the
    more informational capital the algorithm accumulates, and the wider the informational
    asymmetry gets.'
