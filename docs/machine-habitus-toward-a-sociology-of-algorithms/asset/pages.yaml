    # Machine trainers


    Knowing the machine creates and chasing the deus in machine is not enough to understand
    sociologically the whole culture in the code of IAQOS, or of any other machine
    capable of learning from input data. The Platform Era has inaugurated a transformation
    of the very meaning of ‘code’. From code intended ‘as law’ (Lessig 2006), i.e.
    a pre-configured architecture regulating software, to code as a set of adaptive
    ‘generative rules’ (Lash 2007) in a ‘dynamic relationship to the real world’ (Cheney-Lippold
    2011: 166). Differently from ‘good old-fashioned’ artificial intelligence, whose
    behaviour derives exclusively from top-down rules (see Chapter 1), the cultural
    dispositions encapsulated in machine learning systems are inductively acquired
