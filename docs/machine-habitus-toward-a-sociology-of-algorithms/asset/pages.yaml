    The distinction between primary and secondary socialization allows me to draw
    other (cautious) parallels between the learning trajectories of humans and machines.
    To be clear, while all healthy individuals undergo more or less socialization
    processes (Berger and Luckmann 1966: 183–93), only a minority of algorithms are
    socialized. For the vast majority of automated systems, including those operating
    traffic lights, dishwashers, videogames, printers, synthesizers or word processors,
    there is no need for machine learning (see Chapter 1). In these cases, culture
    enters the code solely by design, as de machina. Take for example an algorithm
    counting the positive and negative words occurring in a textual corpus, based
    on pre-compiled lists of annotated tools. Rule-following, dictionary-based tools
    are very common in content analysis (Krippendorf 2013). The logic is mechanistic
    and deductive: if the observed word w is equal to a positive (negative) term present
    in the dictionary, then count w as a positive (negative) occurrence. The employed
    lists of ‘positive’ and ‘negative’ words surely constitute a human-generated data
    context. However, there is no learning process or feedback mechanism involved.


