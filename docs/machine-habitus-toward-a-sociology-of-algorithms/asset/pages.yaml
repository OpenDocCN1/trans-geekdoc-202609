  md: 'Machine Habitus


    mentioned above (see Gillespie and Seaver 2016) – one might ask why an all-encompassing
    sociological framework for researching intelligent machines and their social implications
    should be needed. My answer builds on a couple of questions which remain open,
    and on the understudied feedback loops lying behind them.


    # # Open questions and feedback loops


    The notion of ‘feedback loop’ is widely used in biology, engineering and, increasingly,
    in popular culture: if the outputs of a technical system are routed back as inputs,
    the system ‘feeds back’ into itself. Norbert Wiener – the founder of cybernetics
    – defines feedback as ‘the property of being able to adjust future conduct by
    past performance’ (1989: 33). According to Wiener, feedback mechanisms based on
    the measurement of performance make learning possible, both in the animal world
    and the technical world of machines – even when these are as simple as an elevator
    (1989:24). This intuition turned out to be crucial for the subsequent development
    of machine learning research. However, how feedback processes work in socio-cultural
    contexts is less clear, especially when these involve both humans and autonomous
    machines. While mid-twentieth-century cyberneticians like Wiener saw the feedback
    loop essentially as a mechanism of producing stability within complex systems,
    ‘did not quite foresee its capacity to generate emergent behaviours’ (Amoore 2019:
    11). In the words of the literary theorist Katherine Hayles: ‘recursivity could
    become a spiral rather than a circle’ (2005: 241, cited in Amoore 2019).


    Consider an example a simplified portrait of product recommendations on e-commerce
    platform Amazon. Input about platform users’ purchasing behaviour are fed in real
    time into an algorithmic model, which considers two products as ‘related’ if they
    are frequently bought together (Smith and Linden 2017; Hardesty 2019). By learning
    from customers’ daified behaviour, the system generates as output a personalized
    list of items related to the browsed product. On the other side of the screen,
    millions of Amazon'
