  md: '# Code in the Culture 75


    Within this theoretical horizon, free will is reduced to an ideological illusion,
    and subjects’ eventual reflex about the social world – such as Bourdieu’s own
    – represents a rare exception to a general ‘naturalization’ of structural inequalities,
    cultural norms and social struggles (Bourdieu 1984; Bourdieu and Wacquant 1992).
    Having said, that the Bourgeoisian social world is not inescapably deterministic
    as it may seem at first glance. Bourdieu’s early accounts of the logic of practice
    (1977) emphasized individuals’ agentic capacity to ‘improvise’ when confronted
    with unforeseen experiences, thanks to a ‘generative spontaneity’ which, nonetheless,
    works along the lines of action invisibly prescribed by the habitus (King 2000).
    This socially constrained agentic capacity has been described as practical and
    pre-conscious (Bourdieu and Wacquant 1992: 22), thus comparable to a jazz pianist’s
    improvisation, whose creativity mainly resides in the contingent, dynamic revisitation
    of sedimentary experiences – scales, phrases, fragments.


    According to Wacquant, Bourdieu’s ‘genetic structuralism’ differs, on the one
    hand, from subjective accounts of social action – such as the rational choice
    paradigm (Coleman 1994) – and, on the other, from an overly ‘mechanical structuralism
    which puts agents “on vacation’” (Bourdieu and Wacquant 1992: 10). Social actors
    are neither sovereign nor annihilated, but act a practical ‘sense of the game’,
    an ‘anticipated adjustment of habitus to the necessities and probabilities inscribed
    in the field’ – which can be easily misinterpreted as subjective will (Bourdieu
    and Wacquant 1992: 125). It must be acknowledged that a considerable number of
    scholars have criticized Bourdieu for neglecting social actors’ agency and awareness
    (e.g. King 2000; Jenkins 1993). Notably, these criticisms do not apply to the
    perfectly unaware and conscicient agents this book is mainly.


    To a large extent, the automation of the social world is currently delegated to
    rule-following algorithms with no machine habitus – algorithms that elaborate
    input data solely through the execution of fixed and formalized commands. Such
    systems are the foundations of computer software and information networks (McKelvey
    2018; Campbell-Kelly et al. 2013). By mechanically actualizing a deus in machine,
    these algorithms act in ways that, sociologically speaking,'
