    # Critical algorithm studies


    When algorithms started to be applied to the digital

    engineering of the social world, only a few sociologists

    took notice (Orton-Johnson and Prior 2013). In the early

    2000s, the sociological hype about the (then new) social

    networking sites, streaming platforms and dating services

    was largely about the possible emancipatory outcomes of

    en enlarged digital connectivity, the disrupting research

    potential of big data, and the narrowing divide between ‘real’

    and ‘virtual’ lives (Bear 2009). However, at the periphery

    of academic sociology, social scientists working in fields

    like software studies, anthropology, philosophy, cultural

    studies, geography, Internet studies and media research were

    beginning to theorize and investigate the emergence of a

    new ‘algorithmic life’ (Amore and Piotiotuk 2016). In the

    p decade, this research strand has grown substantially,

    disrupting disciplinary borders and setting the agenda of

    important academic outlets. Known as ‘critical algorithm

    studies’ (Gillespie and Seaver 2016), it proposes multiple

    sociologies of algorithms which tackle various aspects of the

    techno-social data assemblages behind AI technologies.


    A major part of this critical literature has scrutinized the

    production of the input of automated calculations, that is,

