    It is important to note that, according to Bourdieu, the historical reproduction
    of social inequalities and discrimination is not the deliberate outcome of a coherent
    apparatus of power – as it was for Marx scholars of his time (Boudon and Bourcada
    2003: 376). Rather, the perpetuation of the social order is the aggregate result
    of myriad situated encounters between a habit’ cultural dispositions and a field
    – that is, a ‘domain of social life that has its own rules of organization, generates
    a set of positions, and supports the practices associated with them’ (Calhoun
    et al. 2002: 262). Examples are the fields of cultural production (Bourdieu 1993)
    and consumption (Bourdieu 1984), as well as the education system, with its inner
    hierarchies and repressive institutions (Bourdieu and Passeron 1990). On the one
    side, ‘habitus contributes to constituting the field as a meaningful world’ and,
    on the other, ‘the field structures the habitus’ (Bourdieu and Wacquant 1992:
    127) through its implicit rules and common sense – doxa, in Bourdiesian jargon.
    From this theoretical viewpoint, such as working-class people (Bourdieu 1999)
    or women (Bourdieu 2001) are subjected to, can be seen as the subtle, naturalized
    outcome of pre-conscious power mechanisms rooted in culture.


