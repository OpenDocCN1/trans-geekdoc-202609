    2017; Broussard 2018; Sumpter 2018; Natale and Ballatore 2020; and Mackenzie 2015.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Why Not a Sociology of Algorithms?


    manual application of algorithms by ancient mathematicians to the realization
    of the first digital computers right after the Second World War. Within this period,
    algorithms were applied either by human-supervised mechanical devices or by humans
    themselves (Pasquinelli 2017). In fact, until the early twentieth century, the
    word ''computer'' indicated a person employed to make calculations by hand. Mechanical
    computers started to be conceptualized at the beginning of the nineteenth century,
    following Leibniz'' early intuitions about the mechanization of calculus (Chabert
    1999), as well as a rising demand for faster and more reliable calculations from
    companies and governments (Wilson 2018; Campbell-Kelly et al. 2013). Aiming to
    automatate the compilation of tables for navigation at sea, particularly strategic
    for the British Empire, in the 1820s the mathematician Charles Babbage designed
    the first mechanical computer, the Difference Engine, which was then followed
    by the more ambitious Analytical Engine – ideally capable of performing ''any
    calculation that a human could specify for it'' (Campbell-Kelly et al. 2013: 8).
    Babbage''s proto-computers were pioneering scientific projects that remained largely
    on paper, but more complex applications of electromechanical ''algorithm machines''
    (Gillespie 2014) came to light by the end of the century. In 1890, Hollerith''s
    electric census data, tabulating system was successfully employed to process US
    census data, paving the way for the foundation of IBM. Thanks to the punched-card
    machines designed by Hollerith, 62 million American citizens was processed within
    ''only'' two and a half years, compared with the seven years taken by the previous
    census, with an estimated saving of 5 million dollars (Campbell-Kelly et al. 2013:
    17–18). The mass production of desk calculators and business accounting brought
    algorithms closer to ordinary people''s everyday routines. Still, information
    was computationally transformed and elaborated solely through analogue means (e.g.
    punched cards, paper tapes) and under human supervision.


    # Digital Era (1946–1998)


    Through the 1930s and the 1940s, a number of theoretical and technological advances
    in the computation of'
