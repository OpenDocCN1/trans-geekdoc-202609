- pgno: 156
  md: '# 5


    # Techno-Social Reproduction


    # Toward a sociology of algorithms as social agents


    At the beginning of this book, I mentioned some open questions and related feedback
    loops. The questions were the following: first, *how are algorithms socialized?*
    Second, *how do socialized machines participate in society – and, by doing so,
    reproduce it?*


    I have attempted to provide answers by tracing the hidden humans behind machines
    – machine trainers and machine creators – and showing how their culture ordinarily
    penetrates the allegedly neutral black box of algorithmic code, to become machine
    habitus and *deus in machina*. Chapter 2 discussed the social roots of computational
    technologies, linking for the first time the growing literature on algorithmic
    bias and machine learning to the sociology of Pierre Bourdieu, masterfully theorized
    the unconscious cultural distortions guiding human reason and action, portrayed
    in his work as inexorably linked to the experiential embodiment of the social
    world.


    I then identified machine training and feedback-based learning as the sociological
    venues for the transformation of algorithms into social agents. Once social –
    properly equipped with cultural propensities and dispositions derived'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# Techno-Social Reproduction 145


    from data contexts – machine learning systems are put to work within platformized
    social fields, ready to rank and filter a billion digital existences based on
    a tacit, correlational knowledge and a conscientious, practical reason. Chapter
    3 showed how the machine habitus, produced and adjusted based on socially structured
    user-generated data, contributes to producing and adjusting users'' practices
    and dispositions in turn, by exerting an opaque computational authority. I argued
    that this first feedback loop, entangling single platform users and artificial
    agents, can take different shapes, depending on the alignment between habitus
    and machine habit, as well as on the informational asymmetries characterizing
    digital infrastructures.


    Varying interactional configurations can generate distinct techno-social outcomes
    – a reinforcement of individual dispositions, or their computationally driven
    transformation. Myriads of user-machine entanglements are encapsulated and confounded
    by platform infrastructures and their affordances, enabling and constraining the
    agency of interacting agents. They very same agents, whether of the embodied –
    or encoded – are also objectively conditioned by the social inequalities structuring
    techno-social fields.


    Chapter 4 aimed to build a theoretical toolkit to understand a second, wider feedback
    loop linking social agents to the social order, by means of the (machine) habitus.
    The spiral-shaped trajectories of entangled users and machines – which negotiate
    a common compositional ground oscillating across asynchronous cultural rhythms
    and multiple, ramified socializing influences – reveal something more than the
    singularly uncertain points of departure and destination of social ''particles''
    as entangled and elusive as the subatomic objects of quantum physics. Taken together,
    these recursive dances have the potential to significantly reshape the social
    and symbolic barriers segmenting the fields of the social. Depending on the specific
    culture in the code, the code in the culture may participate in the normalization
    or differentiation of field boundaries, reconfigure their whole structure, or
    fragment it into liquefying pieces.


    In this techno-social mesh (or, mess, if you prefer), human subjects are not powerless.
    They can redirect the trajectories of misaligned machines through implicit or
    explicit'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Machine Habitus


    feedback. They may consciously conform to automated nudges, as well as deliberately
    ignore or actively resist them. Still, they – we – cannot be entirely free. Following
    Bourdieu, this book suggests that the locus of the power piloting our digital
    lives is ultimately not the algorithmic code, but the hierarchical culture sedimented
    within it and elsewhere: a socially fabricated matter made, on the one hand, of
    platform owners'' and machine creators'' arbitrary goals and interested assumptions
    and, on the other, of machine trainers'' habitual practices, tacit rules, prejudices
    and implicit associations.


    Human-generated cultural patterns underlie many of the digital threats debated
    in our Platform Era, as filter bubbles, algorithmic discriminations and biased
    AI technologies. Albiet organized in a machine-readable format, this is the same
    socio-cultural substance that incessantly pre-filters and invisibly directs our
    freely human choices and behaviours – which types of food and people we sincerely
    enjoy, how we speak and move, what our professional aspirations, hobbies, political
    inclinations and consumption propensities. That is, the socially conditioned classificatory
    schemes and dispositions embodied as habitus, which practically generate social
    regularities.


    In some ways, we are the algorithms. We automatically adapt to the ''order of
    the world as we find it, with its one-way streets and its no-entry signs'', as
    if programmed to do so. A bit like machine learning systems, we learn from the
    experience of this, and practically reproduce its regularities. It is no surprise,
    then, if ''the established order, with its relations of domination, its rights
    and prerogatives, privileges and injustices, ultimately portrays itself so easily,
    apart from a few historical accidents'', to the point that even ''the most intolerable
    conditions of existence can so be perceived as acceptable and even natural'' (Bourdieu
    2001: 1–2).


    Acknowledging the pre-digital social patterning of human life does not mean that
    actual algorithms do not matter. On the contrary, the fact that, by means of the
    machine habitus, learning machines participate in it, while simultaneously participated
    shakes to the foundations taken-for-granted dichotomies and sociological assumptions.
    In line with recent contributions, this book'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# Techno-Social Reproduction 147


    has theorized learning systems as ‘forces internal to social life – both subject
    to and integral to its contingent properties’ (Fourcade and Johns 2020; see also
    Neyland 2019; Esposito 2017). This view constitutes an ‘epistemological break’
    (Bourdieu and Wacquant 1992: 108), that is, a markedly different way of seeing
    both society and technology (Sterne 2003). From this perspective, not only do
    social mechanisms represent ‘a source and factor of social order’ (Just and Latzer
    2017: 246), they also actively reinforce and transform contextual manifestations
    of social order, along with humans as agents. I believe that the study of this
    techno-social reproduction should be at the core of a sociology of algorithms
    and, increasingly, of sociology as a whole. Especially if we, the members of this
    research community, share Bourdieu’s idea of sociology’s main purpose: ‘to uncover
    the most profoundly bruised structures of the various social worlds which constitute
    the social universe, as well as the ‘mechanisms’ which tend to ensure their reproduction
    or their transformation’ (Bourdieu 1989b, cited in Bourdieu and Wacquant 1992:
    7).


    # An old but new research agenda


    In the nineteenth century, a bunch of European scientists and intellectuals somehow
    ‘discovered’ society (Procacci and Szakolzai 2003). Of course, society was already
    ready there, but these thinkers set up a new discipline for studying it, named
    ‘sociology’ by Auguste Comte. The peculiarities of sociology consisted in its
    foundational opposition to the idea of the Homo oeconomicus, the rational individual
    theorized as separated from its contexts and social belongings. The mission of
    the new-born discipline was radically different: understanding humans as parts
    of ‘collective subjects’ (Procacci and Szakolzai 2003): communities, classes,
    groups, cultures.


    Today, we find ourselves paradoxically in an epistemological vaguely resembling
    that of the early nineteenth century, only with machines in the place of human
    subjects. In fact, the emerging study of ‘machine behaviour’ is dominated by researchers
    lacking any formal knowledge of social and cultural phenomena:'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# 148 Machine Habitus


    Currently, the scientists who most commonly study the behaviour of the machines
    are the computer scientists, robotic and engineers who have created the machines
    in the first place. These scientists may be expert mathematicians and engineers;
    however, they are typically not trained behaviourists. They rarely receive formal
    instruction on experimental methodology, population-based statistics and sampling
    paradigms, or observational causal inference, let alone neuroscience, collective
    behaviour or social theory. (Rahwan et al. 2019: 478)


    There is more. Human–machine interactions are often interpreted through the theoretical
    and methodological lenses of behavioural economics, with algorithms treated as
    rational agents separated from society (Burr, Cristianiani and Lyman 2018). The
    detection and correction of ‘unfair’ algorithmic behaviour is currently the main
    way in which social scientists have become in AI research (Ananny 2016) – thus,
    in a criminological or juridical, more than a sociological guise, the alleged
    neutrality of mathematical calculus has substantially taken the place of the historically
    manufactured naturality of racial divisions, and a rampant techno-chauvinism has
    joined chauvinism in its original sense (Brouillard 2018). Meanwhile, the ideology
    of ‘the end of theory’ (Anderson 2008) and a blind faith in big-data correlations
    have contributed to a general forgetting of society. To make the historical analogy
    with nineteenth-century science even more vivid, AI researchers have decisively
    contributed to reviving the – back then very popular – assumptions of phenomenology,
    with contested patterns attempting to infer people’s ‘trustworthiness’ or criminal
    attitudes based on facial traits (Safra et al. 2020; Wu and Chang 2016).


    We are in desperate need of sociology. We need a ‘sociological imagination’ (Mills
    1959) in order to bring back society – e.g. social structures, cultural discourses,
    symbolic boundaries, tacit norms, collective identities – scientific discourses
    about society, machines included. This argument presents some similarities with
    Bruno Latour’s position: ‘What our ancestors, the founders of sociology, did a
    century ago to house the human masses in the fabric of social theory, we should
    do now to find a place in a new social theory for the nonhuman masses that beg
    us for understanding’ (1992: )'
  merge: -1
  img_proc: true
- pgno: 161
  md: '153). However, the epistemological rupture articulated in this book is considerably
    less radical than the one predicted by Latour and colleagues. First of all because
    my proposal for ''reassembling the social'' (Latour 2005), contrary to ANT, is
    limited to machine learning systems – that is, algorithms which can be socialized.
    Second, because it is attentive to the socio-cultural contexts and intersubjective
    boundaries structuring the social world as well (and models) of those participating
    in it – whereas, according to Latour, context ''stinks'', it being ''simply a
    way of stopping the description when you are tired and too lazy to go on'' (2005:
    148).


    Being compatible with the ontological grounds of classical and neoclassical social
    theory, the theory of machine habitus allows us to study socialized machines ''with
    the same analytical machinery as people'', thus challenging a counter-productive
    yet long-lasting divide between a majority of sociologists concerned with social
    structures and power, and a minority focusing on the ''merely technical'' (Law
    1990: 8). Therefore, this dispositionalist perspective aims to provide researchers
    interested in the social world with ways to include artificial agents in their
    analyses, and researchers studying artificial agents with ways to consider them
    as part of the social world. Still, it is important to note that the Bourgeoisian
    sociology of algorithms proposed in this book is only one among different – often
    complementary – theoretical viewpoints, emphasizing the unprecedented sociological
    relevance of learning machines


    learning machines (e.g. Fourcade and Jones 2020; Cheney-Lippycold 2017; Esposito
    2017; Lupton 2020; D. McKenzie 2019; Bucher 2018; Brayne 2017; Christin 2020;
    Mühlhoff 2020; Beer 2013a).


    Mechanisms of techno-social reproduction should be at the very centre of a novel
    sociological agenda. Investigating machine learning systems as social agents entangled
    with humans in the context of platformized fields may appear to be no more than
    a niche yet fashionable research direction. However, it has increasingly become
    a necessity, since very few realms of the social world remain untouched by the
    ubiquitous application of these information technologies. The study of social
    inequalities is necessarily affected by their massive ''automation'' (Eubanks
    2018) as well as'
