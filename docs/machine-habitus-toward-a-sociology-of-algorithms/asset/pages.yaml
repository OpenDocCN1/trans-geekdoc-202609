    has important consequences for humans: in fact, non-linear, opaque forms of power
    are ordinarily exerted by the code on the culture.


    # Computational authority


    Toward the end of the 1990s, Google Search’s PageRank algorithm began to harvest
    the entire Web and harness its relational structure in order to automatically
    produce lists of ‘relevant’ search results. Existing search engines, like Yahoo,
    consisted of manually assembled catalogues of websites. At the dawn of the Platform
    Era, the Internet was still narrated as an uncontaminated cyber-land detached
    from the interests and inequalities of ‘real’ life (Orton-Johnson and Prior 2013),
    and algorithms as abstract mathematical procedures (Chabert 1999). However, a
    deep change had already been taking place underneath. The Web was turning into
    an ‘electronic marketplace’, a vast commercial repository of consumer data and
    metadata, incessantly retrieved, stored and analysed by the calculative devices
    built into its networked infrastructure (Zwick and Dholakia 2004; Arvididson 2004;
    Ansari, Essegaier and Kohli 2000). Algorithms were mutating into ubiquitous ‘engines
    of order’ (Rieder 2020) applied to the organization of culture, information, markets
    and people (Amoore and Piotuk 2016; Anannny 2016). When platforms like YouTube,
    Twitter and Facebook made their appearance in the mid 2000s and began the colonization
    of the entire Internet, this mutation was finally complete.


    As media theorist José van Dijck noted in The Culture of Connectivity, “making
    the Web social” in reality means “making sociality technical” (2013: 12). Platform
    algorithms'
