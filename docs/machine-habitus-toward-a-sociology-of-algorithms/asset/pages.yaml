  md: '# A Theory of Machine Habitus


    # Structures


    Social structure


    Machine habitus can be defined as the set of cultural dispositions and propensities
    encoded in a machine learning system through data-driven socialization processes.
    Since such dispositions and propensities derive from patterns in human-generated
    data, they reflect social and cultural regularities crystallized in the machine-readable
    data contexts used for training and feedback (see Chapter 2). Therefore, similar
    to a Bourdusian social actor, a socialized machine ''wittingly or unwittingly,
    willy, is a producer and reproducer of objective meaning'', its actions the product
    of modus operandi of which it ''is not the producer and has no consciousness''
    (Bourdieu 1977: 79). The present section examines to what extent the analogy between
    human subjects and machine learning holds when we consider the structural conditioning
    of action within techno-social fields.


    According to Bourdieu, ''it is only in the relation to certain structures that
    habitus produces discourses or practices'' (Bourdieu and Wacquant 1992: 135).
    These are the ''objective'' social and symbolic divisions segmenting fields, subjectivity
    interiorized through socialization in the form of habitus: ''There exists a correspondence
    between social structures and mental structures, between objective divisions in
    the social world - particularly into dominant and dominated in the various fields
    and the principles of vision and division that agents apply to it'' (Bourdieu
    1989a: 7). On the one side, social structures are external to social agents, crystallized
    in the material inequalities, norms, institutions and doxa characterizing the
    fields these agents are confronted. For Bourdieu, any field can be seen as constituted
    by a ''social space'' understandable in geographical terms, as divided into different
    regions corresponding to various social classes (1989a: 16). The social space
    is an abstract system of relations among positions in the structure, characterized
    by different volumes of economic, cultural and social capital (Bourdieu 1986),
    jointly working as ''symbolic power'' (Bourdieu 1989a). Spatial distances are
    equivalent to social distances, separating distinct conditions of existence.'
