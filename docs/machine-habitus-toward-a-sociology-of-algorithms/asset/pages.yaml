  md: '# Culture in the Code


    independent theatre, disinterested towards sports and TV shows, mild propensity
    to eat Asian food, and so on – adjusts its probabilistic predictions accordingly,
    in a cybernetic way (Cheney-Lippold 2011). By reflecting a socially connotated
    set... the myriad data contexts of social media users are precisely what micro-targeted
    ads extremely valuable for marketers (Darmody and Zwick 2020). But, more than
    that, they also represent the loci of machine socialization (Cardon 2018).


    From the perspective of a machine learning system, data contexts are essentially
    collections of attributes, or ‘features’, processed as mathematical vectors (Mackenzie
    2015: 433–4). For instance, my Facebook profile can be represented as a vector
    of pages within an n-dimensional vector space, where n stands for the total number
    of likable Facebook pages. This abstract high-dimensional space, a sort of Cartesian
    plane with thousands of axes, is the main epistemic ground for knowledge in machine
    learning – as well as in the (more mundane) branches of multivariate analysis
    that social scientists are more familiar with (See Alt 1990). By computing the
    (geometric) distance of my vector of pages from other vectorized Facebook profiles,
    the platform algorithm could – example – map a function to predict which pages
    I ‘may also like’. In simplified terms, this is what most machine learning applications
    do, from product recommendation systems (A. Mackenzie 2018; Celma 2010) to text
    classifiers (Beckmann and Bowker 2019; Rieder 2017).


    In order to make sense of a dataified and vectorized reality, machine learning
    systems look for ‘patterns’ (Kelleher 2019), such as clusters of correlated Facebook
    profiles liking the same set of pages. Note that this process is neither neutral
    as effective as it may seem at first sight. First, as Kaufmann and colleagues
    (2019) show in their study of predictive policing software, what constitutes a
    pattern in data (and, therefore, what does not) is largely established by the
    humans behind machines. The parameters and thresholds used to automatically identify
    significant regularities within police databases reflect value-laden assumptions
    constituting a deus in machina – such as the idea that the socio-economic'
