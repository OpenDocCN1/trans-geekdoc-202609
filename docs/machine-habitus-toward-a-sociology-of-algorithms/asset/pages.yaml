    what would make a ‘beautiful photograph’: the working classes preferred sunsets
    or mountain landscapes, while educated bourgeois were likely to privilege more
    original subjects, having acquired through an early cultural learning process
    the competences and dispositions necessary to ‘aestheticize’ the world (Bourdieu
    1984: 57–63). According to Bourdieu, this statistically observable *opus operatum*,
    ie. socially constructed tastes are the consequence of a hidden *modus operandi*,
    that is, class-based habitus. In his analysis, French working classes look like
    they are trapped in a rigged societal game. In fact, the socially distinctive
    capital of consuming cultural goods historically considered as ‘legitimate’ –
    which strategically works as a ‘cultural capital’ convertible into material and
    symbolic resources, such as social contacts, work opportunities or prestige –
    was reserved to the educated elites. By enacting the ‘virtual’ aesthetic inclinations
    and manners of a working-class habitus, subjects with low or no cultural capital
    were seen to reinforce their dominated condition, as in a self-fulfilling prophecy.
    From far being regarded as outdated, this powerful account of the mechanisms through
    which social and symbolic hierarchies are reproduced continues to inspire contemporary
    sociologists (Friedman et al. 2015).


    The theory of habitus has been fruitfully used to shed light on research problematics
    as diverse as colonial oppression (Bourdieu 1979), linguistic exchanges (Bourdieu
    1991), educational inequalities (Bourdieu and Passeron 1990), gender dynamics
    (Bourdieu 2001), academic life (Bourdieu 1988) and racialized sport practices
    (Wacuant 2002) – among many others. The explanatory relevance of the concept has
    been recognized well beyond the disciplinary boundaries of sociology (see Costa
    and Murphy 2015; Shirato and Roberts 2018). Evidence from psychology and the cognitive
    sciences has substantially validated the idea which Bourdieu borrowed from the
    work of the French developmental psychologist Jean Piaget – that socially conditioned
    experiences are interiorized by individuals as stable cultural schemas, and that
    these classifying and perceptual structures generate practical action in pre-reflexive
    ways (Lizardo 2004; Vaisey 2009; Bouteline and Soter 2020).'
