  md: '# Culture in the Code


    # Society in, society out


    ‘Garbage, garbage out’ is an old saying among engineers and computer scientists.
    It indicates that flawed statistical models and input data ultimately produce
    unreliable results, which might ‘unfairly discriminate against certain individuals
    or groups of individuals’ (Friedman and Nissenbaum 1996: 332). When this happens,
    the algorithm is said to be ‘biased’.


    The study of computer bias is a relatively young strand of research which has
    seen an exponential growth in scale during the past years (Frank et al. 2019).
    Part of the reason lies in a long list of discriminatory episodes involving automated
    systems, which have fostered heated public debates (Noble 2018; Eubanks 2018;
    AlgorithmWatch 2020; Crawford et al. 2019). Cases like that of COMPAS – the software
    used in US courts to assess recidivism, visibly biased against African Americans
    (Angwin et al. 2016) – or Amazon’s (now defunct) AI recruiting tool that penalized
    female candidates become internationally known cautionary tales against algorithmic
    misbehaviour. Yet, the biases are still there. The pandemic summer of 2020 witnessed
    iconic images of thousands of British students chanting ‘fuck the algorithm’ in
    the streets, following the (later retracted) automated evaluation of their final
    exams. The algorithm in question was accused of assigning lower grades to students
    from poorer backgrounds, and a letter signed by a group of academics addressed
    the model as ‘unethical’ and ‘harmful’ (Guardian 2020; Allegretti 2020).


    How can an automated system be racist, sexist or classist? This very possibility
    clashes with the myth of algorithmic neutrality. On the one hand, bias may originate
    from the deus in machina, that is, the encoded choices and intentions of those
    involved in the development of the system. Machine creators, like anyone else,
    make mistakes, and see the world through the cultural lenses of a particular social
    background and professional milieu. As a result, they often ignore or underestimate
    the implications of pursuing specific computational goals or selecting certain
    parameters and variables. In the case of the British students’ contested evaluations,
    the grades predicted by teachers were ‘moderated by an'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# 44 Machine Habitus


    algorithm based on schools’ past performance, which tended to statistically favour
    private schools and thus contributed to the reproduction of educational inequity
    (Allegretti 2020). Similarly, the fact that black defendants evaluated by COMPAS
    ‘were 45 percent more likely to be assigned higher risk scores than white defendants’
    (Larson et al. 2016) can be traced back to the inclusion of problematic indicators
    in the software’s simple predictive model. In fact, several objectivelooking measures
    positively correlated with recidivism also work as proxies of the structurally
    disadvantaged conditions characterizing many African Americans lives:


    The COMPAS score is based on a 137-point questionnaire administered to people
    at the time of arrest. The answers to the questions are fed into a linear equation
    of the type you solved in high school. Severe criminogenic needs, risk factors,
    are identified. These include ‘educational-vocational-financial debts and achievement
    skills’, ‘antisocial and prociminal associates’, and ‘familial-marital dysfunctional
    relationship’. All of these measures are out of poverty. It’s positively Kafkaesque.(Broussard
    2018: 156)


    Algorithms’ design features are only one source of bias – the easiest to correct,
    and one that machine creators are clearly responsible for (Roselli, Matthews and
    Talagala 2019; Dans London 2017; Pedreschi et al. 2018). What stands out in the
    computer science literature is that deliberate or unconscious actions, intentions
    and assumptions crystallized as deus in machina account for only a minor part
    of the possible errors and mishaviours of platform algorithms and AI (Campolo
    et al. 2017). When a machine learning system becomes racist, sexist or classist,
    another category of bias is often involved, broadly classed ‘data bias’ (Baeza-Yates
    2018; Olteanu et al. 2019; Buolamini and Gebru 2018) ‘training data bias’ (Danks
    and London 2017). This encompasses the unfair inclinations and flaws inductively
    acquired from machine trainers (Cavazos et al. 2020; Caliskan, Bryson and Narayanan
    2013). Olteanu and colleagues (2019) have conceptualized different categories
    of bias peculiar to datasets extracted from social media – such as due to the
    socio-demographic composition, practices and cultural norms of the user/trainers
    (i.e. population biases,'
