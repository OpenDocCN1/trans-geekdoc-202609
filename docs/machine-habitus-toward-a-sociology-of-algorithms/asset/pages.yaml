- pgno: 162
  md: '# Machine Habitus


    digitalization (Lutz 2019). Similarly, doing cultural sociology in a platform
    society inevitably entails the – more or less aware – encounter with populations
    of autonomous agents driven by an ‘algorithmic culture’ (Hallinan and Striphas
    2016). Comparable considerations can be made for social science research on topics
    as diverse as consumption, finance, communication, religion, education, journalism,
    political behaviour, cities, marketing, sexuality, organizations, and more. As
    nicely summed up by Kitchin:‘there is a need to focus on critical and empirical
    attention on algorithms and the work that they give their increasing importance
    in shaping social and economic life’ (2017: 14).


    For sure, the sociological unveiling of artificial agents – of their encoded goals,
    dispositions, practices, effects and trajectories – presents significant methodological
    challenges. While scientists know perfectly how to investigate humans, generally
    lack the competences and instruments for studying algorithmic systems (Rieder
    2017). Things are further complicated by the black-boxed character of technological
    artefacts (Burrell 2016). Latour and Woolgar reflect on this as early as in Laboratory
    Life:‘Once an item of apparatus or a set of gestures is established in the laboratory,
    it becomes very difficult to effect the在了 into a sociological object. The cost
    of revealing sociological factors [...] is a reflection of the importance of the
    black box activities of the past’ (1986:259–60). Nevertheless, almost two decades
    of critical algorithm studies have demonstrated that retransforming algorithms
    into sociological objects is possible (e.. Rieder 2017; Kitchin 2017; Geiger 2017).
    Building on this multidisciplinary literature, here I outline four complementary
    research directions for a (cultural) sociology of algorithms. All share the same
    methodological imperative to ‘follow’, borrowed from Marcus’ multi-sited ethnography
