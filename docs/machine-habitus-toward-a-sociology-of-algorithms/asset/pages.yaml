  md: '# Why Not a Sociology of Algorithms?


    transformation over time, across social fields and domains of applications – can
    serve to advance our understandings of today''s techno-social world. Certainly,
    we already know a lot about it. Whole fields of research are dedicated to the
    study of algorithmic bias, human-computer interaction and machine discrimination.
    The purpose of this book is to restate the obvious in a sociologically less obvious
    fashion, deliberately designed to ''transgress'' disciplinary borders, as suggested
    by Bourdieu himself (Bourdieu and Wacquant 1992: 149).


    The following chapters attempt to bridge insights from cultural sociology and
    computer science, AI research and Science and Technology Studies. Chapter 2 will
    help us understand the social genesis of the machine habitus, and how it must
    be distinguished from another type of *culture in the code*, present in any technological
    artefact that is, the culture of its human creators, acting as a *deus in machina*.
    Chapter 3 will focus on the *code in the culture*, aiming to theorize the forms
    and effects of algorithmic practice, and how they concretize within the techno-social
    fields of digital platforms. Chapter 4 will bring the culture and code in the
    culture together in order to sketch a general theory of machine habit in action.
    The concluding chapter will highlight the sociological relevance of mechanisms
    of *techno-social reproduction* and propose alternative ways to imagine, design
    and relate to socialized machines in real life.


