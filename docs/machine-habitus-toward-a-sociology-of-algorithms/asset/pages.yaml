  md: 'the code. By learning from socially structured data contexts, machine learning
    systems become social agents. Through primary and secondary machine socialization
    processes, data-based propensities are encoded as dispositions crystallized in
    a machine habitus – eventually leading to biased predictions and discriminatory
    behaviours. Artificial social agents see the world and act within it on a path-dependent
    and culturally immersed ‘practical reason’ (Bourdieu and Vacuant 1992), directed
    toward tasks and goals decided by their creators and encoded as deus in machine.


    The present chapter on the code in the culture examines how socialized machines
    shape our society by participating in it. It would certainly be tempting to push
    forward the idea of algorithms as independent subjects, engaging in harmless philosophical
    discussions on the social implications of a human-like Google Assistant and the
    (im)possibility of a ‘general’ artificial intelligence. Except for the fact that
    algorithms are not subjects, and never exist in isolation. They can operate autonomously
    only within the socio-technical assemblages of platforms, information networks,
    software, and data infrastructures, which depend in turn on hardware, energy supply,
    labour, investments and natural resources (McKelvey 2018; Plant et al. 2018; Crawford
    and Joler 2018). This massive, ramified technological environment represents,
    to some extent, machines’ habitat (Rahwan et al. 2019). However, such a technological
    habitus is not natural at all, it is built with commercial and political interests
    in mind (Mackenzie and Wajcman 1999).


    To be sure, artificial intelligence can do amazing things for humanity, as is
    already happening in the health sector and in scientific research more (Schwalbe
    and Wahl 2020). Yet, the rhetoric of machines’ superintelligence and transformative
    potential, dear to Google, Microsoft, IBM and the line, deliberately removes from
    the picture the main context of algorithmic applications – that is, a platform-based
    surveillance capitalism (Zuboff 2019). Once contextualized, the haircut appointment
    is not just a haircut appointment but a further step toward a business-driven
    shift in the organization of social and economic life.


    The history, ideology and societal implications of platform capitalism and data
