    Rosenblatt’s bottom-up approach to artificial cognition did not catch on AI research.
    An alternative top-down approach, now known as ‘symbolic AI’ or ‘GOFAI’ (Good
    Old-Fashioned Artificial Intelligence), dominated the field in the following decades,
    until the boom of machine learning. The ‘intelligence’ of GOFAI systems was formulated
    as a set of predetermined instructions capable of ‘simulating’ human cognitive
    performance – for instance by effectively playing chess (Fjelland 2020). A deductive,
    rule-based logic rests at the core of software programming, as exemplified by
    the conditional IF-THEN commands running in the back end of any computer application.


    From the late 1970s, the development of microprocessors and the subsequent commercialization
    of personal computers fostered the popularization of computer programming. By
    entering people’s lives at work and at home – e.g. with games, word processors,
    statistical software, etc. – computer algorithms were no longer the reserve of
    a few scientists working for governments, large companies and universities (Campbell-Kelly
    et al. 2013). The digital storage of information, as well as its grassroots creation
    and circulation through novel Internet-based channels (e.g. emails, Internet Relay
    Channels, discussion forums), translated into the availability of novel data sources.
