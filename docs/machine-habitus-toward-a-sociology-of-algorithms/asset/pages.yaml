  md: '# Culture in the Code 63


    not need thousands of data examples in order to understand what a pig is. Nonetheless,
    leaving aside the numerous, substantial differences anticipated above, the following
    five main analogies between supervised machine training and human socialization
    can be drawn.


    First, in both cases, the primary socialization process builds on the agent''s
    inner predispositions (Berger and Luckmann 1966). For humans, these being a biological
    and genetic traits – despite this a debated topic in sociology (Mills and Tropf
    2020; Bliss 2018). In the case of machine learning algorithms, these predispositions
    are architectural and cultural instead; they derive from design choices and, therefore,
    from the *deus in machina*. This is also true in the case of advanced AI systems:
    for instance, the hyperparameters of artificial neural networks are decided priori
    by the machine creators (Kelleher 2019: 80).


    Second, both primary socialization and preliminary machine training are supervised
    by ‘significant others’ (Berger and Luckmann 1966: 66), who control, filter and
    mediate the experiences by the learning agent. For children, these are normally
    the parents or other members of the family (Lahir 2019). For machine learning
    systems, machine creators play a surrogate role – by dictating goals, conducting
    an A/B testing experiments and, ultimately, deciding whether and when the training
    phase can be regarded as successful and complete. A socialized machine, quite
    like a child, not only absorbs a socially conditioned perspective on the social
    world, but does so ‘in the idiosyncratic coloration’ by the individuals in charge
    of its primary socialization (Berger and Luckmann 1966: 151).


    Third, the worldviews acquired during the primary socialization process aim to
    be general and transable as possible (Berger and Luckmann 1966: 152), for humans
    as well as for artificial social agents. Supervised machine learning systems are
    commonly trained on large global data contexts, in order to learn how to ‘generalize’
    – that is, perform well also in unseen data contexts (Mackenzie 2015: 439). However,
    a concrete risk of ‘overfitting’ the training data exists, and contributes to
    many cases of algorithmic bias (Roselli et al. 2019). For example, Buolamwini
