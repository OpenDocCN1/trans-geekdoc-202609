  md: '# Code in the Culture 89


    of reviewing potentially damaging contributions (Halffaker et al. 2018).


    It can be argued that, within the layered techno-social environments of the Internet,
    the interaction orders of humans and machines blend (D. MacKenzie 2019; Rahwan
    et al. 2019). In order to exchange with each other, not – first and foremost interact
    with an even higher number of individually tailored algorithmic systems, incessantly
    mediating and modulating interpersonal communications, markets, romantic relations,
    public opinion, and social life more broadly. Myriad feedback loops allow users
    and machine learning systems to learn from each other, thus reshaping each other
    actions – along society as a whole (Fourcade and Johns 2020). In the following
    pages, I will discuss how these recursive processes and their effects may vary
    in relation to different types of interactional configuration.


    # Informational asymmetry and cultural alignment


    What does the future hold for recommendations? We believe there’s more opportunity
    ahead of us than behind us. We imagine intelligent interactive services where
    shopping is as easy as a conversation. This moves beyond the current paradigm
    of typing search keywords in a box and navigating a website. Instead, discovery
    should be like talking with a friend who knows you, knows what you like, works
    with you at every step, and anticipates your needs. This is a vision where intelligence
    is everywhere. Every interaction should reflect who you are and what you like,
    and help you find what other people like you have already discovered.


    This is how Amazon’s Brent Smith and Greg Linden imagined the evolution of interactions
    between intelligent machines and platform users (2017: 17–18). At first glance,
    it seems that we, the humans, are in control. After all, the recommender system
    smoothly adjusts its outputs to our needs and desires. However, a closer reading
    of the excerpt tells us something different: the ‘friend’ Smith and Linden talk
    about knows everything about us, while we know nothing about it; it is ‘everywhere’,
    anticipates what we want, and leverages this knowledge'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# 90 Machine Habitus


    in ‘every interaction’; also, ‘moving beyond’ search and navigation essentially
    means taking out any residual proactivity by platform users, transforming them
    (us) even further into passive receivers of ‘positive reminders resulting from
    specific information processing tasks’ (Striphas 2015: 406). Hence, this human-machine
    interaction is authoratively orchestrated by the machine learning system, which
    is programmed to exploit the informational capital accumulated during its data-driven
    socialization, in pursuit of the unilateral commercial goals of the platform.


    The future sketched by Schmid and Linden is already here. It is the same techno-optimistic
    scenario announced at Google I/O 2018 by Sunil Pichai. Its logics and technical
    secrets lie in the versions of Google Search, Facebook, Amazon and Netflix that
    we navigate on a daily basis. Yet, platform-driven encounters of the kind envisioned
    are only one of several possible configurations of human-machine relations. Alternative
    types of interaction can ideally take place, where the circulation of information
    between algorithms and users is more horizontal and less black-boxed. Furthermore,
    users’ contingent interests and expectations may be more or less aligned with
    the encoded goals and propensities of the socialized machines they encounter every
    day. In fact, while Spotify’s recommendations might perfectly fit our current
    taste, content selection on Facebook may annoyingly prioritize the posts of some
    forgotten school friends, and behaviourally targeted ads dumb insist on products
    I have already purchased (Bucher 2017). These marginal differences in human–machine
    interactions do make a difference in the ways and the extent to which machine
    learning systems participate in society and impact on it.


    According to Burr and colleagues, all interactions between users and ‘intelligent
    software agents’ (ISAs) – that is, socialized machines incorporated in digital
    environments – follow a recursive script:


    +   1. The ISA has to choose from a set of available actions that bring about
    interaction with the user. For example, recommending a video or news item; suggesting
    an exercise in a tutoring task; displaying a set of products and prices, and perhaps
    also the context, order and timing with which'
  merge: -1
