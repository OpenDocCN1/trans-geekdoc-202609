    model derives its ‘experience’ of the world from will conform to – and, consequently,
    ‘reinforce’ (Kaufmann, Egbert and Leese 2019: 686) – the culture in the code.


    Second, not everything can be reliably turned into meaningful data patterns –
    despite the considerable efforts made by platforms like Facebook to this end (Helmond,
