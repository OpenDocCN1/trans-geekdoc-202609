    # A typology of user–machine interactions


    By considering once variations in the degree of informational asymmetry (IA) and
    the strength of cultural alignment (CA), I can derive four ideal types of interactional
    configuration, characterized by different algorithmic roles and emerging outcomes.
    These are summarized in Table 2, as well as described below:


    +   (1) Assessing. When user–machine relations have a high IA and a strong CA,
    users do not know or even notice the computational logics in play, but feel away
    satisfied and at ease with their outputs. This is by far companies’ favourite
    scenario (Smith and Linden 2017). The machine learning system smoothly assists
    the interacting user, by selecting familiar content comfortably aligned with their
    tacit expectations. The user reacts by (unknowingly) sending a positive behavioural
    feedback to the machine – for instance, by watching or liking a recommended video
    – thus reinforcing the encoded cultural propensities displayed by the system in
    a new iteration. This way, in interaction after interaction, the assisted users
    are also likely to see a reinforcement of their pre-existing opinions, social
    relations, habits and habitus (Burr, Cristianini and Ladyman 2018: 754; Jiang
    et al. 2019) – has been widely theorized by the critical literature on filter
    bubbles, search engines and social media (Pariser 2011; Boyd 2013; Hallinan and
    Striphas 2016; Beer 2013b; Bucher 2012a). An empirical study conducted by Hargreaves
    and colleagues (2018) during the 2018 electoral campaign in Italy helps illustrate
    this point. The authors created artificial Facebook users and attributed distinct
