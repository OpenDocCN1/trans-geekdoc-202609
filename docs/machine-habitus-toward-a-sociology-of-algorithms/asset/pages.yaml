    data contexts, the practices of machine learning systems can produce unexpected
    cultural outcomes and social externalities, which may even clash with the interests
    of the platforms and organizations deploying them – as in the case of the algorithmic
    scandals mentioned in the previous chapters. In sum, if one takes into account
    the ever-changing techno-social making of everyday life, ‘the algorithm might
