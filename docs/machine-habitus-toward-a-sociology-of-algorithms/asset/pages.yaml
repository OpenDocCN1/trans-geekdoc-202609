    A second question raised by techno-social feedback mechanisms is about the so-called
    ‘humans in the loop’, and how they respond to algorithmic actions. This concerns
    the technological shaping of society (MacKenzie and Wajman 1999), or what in this
    book I call in the culture (Chapter 3). The outputs of recommender systems, search
