    Primary and secondary machine socialization


    Berger and Luckmann (1966) also made a conceptual distinction between ‘primary’
    and ‘secondary’ socialization, which one remains sociologically relevant today
    (Lahire 2019; Guhin et al. 2020). Primary socialization is ‘the first socialization
    individual undergoes in childhood’, while secondary socialization is ‘any subsequent
    process that induces an already socialized individual into new sectors of the
    objective world of his society’ (Berger and Luckmann 1966: 150). Primary socialization
    provides the child with the general, long-lasting and easily disposable dispositions
    builds on – such as language, practical knowledge, perceptual schemes, common
    sense (Lahire 2019). Emotions play an important role in this process (Berger and
    Luckmann 1966: 151) as they are conveyed by the intense affective relations between
    the child and the carers with whom she identifies – i.e. the ‘significant others’.
    The secondary socialization is less general, indelible and emotionally charged.
    It consists in the internalization of field-specific knowledge and social roles
    (Berger and Luckmann 1996: 158) – linked, for instance, to a profession, a political
    belonging or a religious faith.


    Primary socialization has a ‘disproportionate weight’ in the formation of the
    individual habitus (Bourdieu and Wacquant 1992: 134). As Lahire (2019) elucidates,
    the habitus largely takes shape during childhood, within the family context. Subsequently,
    the ‘individual patrimony of dispositions’ is partly realigned through the experiential
    encounters with the novel social contexts of secondary socialization, but never
    completely erased – as in Bourdieu’s example of ‘nouveaux'
