    In sum, machine learning systems are trained and operate within data contexts
    which inevitably reflect the culture and practices of specific segments of the
    population. Like regularities in pre-digital lifestyle choices (Bourdieu 1984)
    and spoken language (Bourdieu 1991), patterns in detailed behaviours and discourses
    mirror the struggles and nature of social fields.


    # Global and local


    One of the first tasks ever delegated to machine learning systems on a large scale
    was spam filtering – that is, detecting undesired emails and moving them to a
    ‘junk’ folder. The starting point of this process is a database of email messages.
    Algorithms are not interested in the meaning of the catchy message designed to
    steal my password, surely no more than I am. From a computational point of view,
    a word is simply a character string delimited by two white spaces, and an email
    body a mathematical vector defined by values word occurrences, located in a multidimensional
    space characterized by a number of dimensions equal to the number of unique terms
    in the corpus (Mackenzie 2015). What allows the spam filter to successfully distinguish
    between ‘spam’ and ‘ham’ (i.e. not-spam) is patterns derived from the statistical
    features of texts.


    Spam filtering systems are commonly based on supervised machine learning techniques,
    such as naive Bayes classifiers, k-nearest neighbours, support vector machines
    or artificial neural networks (Dada et al. 2019; Kelleher 2019). In all of these
    approaches, what counts as ‘spam’ is not decided a priori by the machine creators:'
