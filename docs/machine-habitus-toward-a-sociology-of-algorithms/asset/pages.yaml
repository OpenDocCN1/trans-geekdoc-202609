  md: '# Why Not a Sociology of Algorithms? 23


    the algorithm, and on the particular data at the root of its ‘intelligence’. In
    order to study how algorithms shape culture and society, Neyland (2019) suggests
    we leave aside the abstract notion of algorithmic power and try instead to know
    autonomous machines more closely, by looking at their ‘regular’ social agents,
    the machine learning systems embedded in digital platforms and devices take part
    in the social world (Esposito 2017) and, as with the usual subjects of sociological
    investigation, the social world inhabits them. A second open question for a sociology
    of algorithms is therefore: how do socialized machines participate in society
    – and, by doing so, reproduce it?


    These open questions about the culture in the code and the code in the culture
    are closely related. A second-order feedback loop is implicit here, one that overlooks
    all the countless interactions between algorithms and their users. It consists
    in the recursive mechanism through which the ‘social’ – with its varying cultural
    norms, institutions and social structures – is reproduced by the actions of its
    members, who collectively make society while simultaneously being made by it.
    If you forget about algorithms you recognize one of the foundational dilemmas
    of the social sciences, traditionally torn by the complexities of micro-macro
    dynamics and cultural change (Coleman 1994; Giddens 1984; Bourdieu 1989a; Strand
    and Lizardo 2017). In fact, while it can be argued that social structures like
    class, gender or ethnicity ‘exercise a frequently “despotic” effect on the behaviour
    of social actors’ producing statistically observable regularities in all social
    domains, from political preferences to musical taste – these very same structures
    ‘are the product of human action’ (Boudon and Bourricaud 2003: 10). Since the
    times of Weber and Durkheim, sociologists have attempted to explain this paradox,
    largely by prioritizing one of two opposing views, which can be summarized as
    follows: on the one side, the idea that social structures powerfully condition
    and determine individual lives; on the other, the individualistic view of a free
    and agentic subject that makes society below.


