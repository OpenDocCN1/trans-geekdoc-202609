  md: '# 10 Machine Habitus


    information took place, accelerated by the war and its scientific needs (Wiener
    1989). The Harvard Mark I became the ‘first’ fully automatic machine to be completed’,
    in 1943. However, it was still ‘programmed by a length of paper tape some three
    inches wide on which “operation codes” were punched’ (Campbell-Kelly et al. 2013:
    57). The pathbreaking conceptual work of the British mathematician Alan Turing
