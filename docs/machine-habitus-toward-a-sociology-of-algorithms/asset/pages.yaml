- pgno: 98
  md: '# How socialized machines interact


    More-than-human relations


    Just as human existence is copenetrated by cultural, biological and material elements
    such as air, water, bacteria and ideas, the everyday life of an algorithm is entangled
    with networked infrastructures made of computer code, protocols, hardware and
    data. These ramified techno-social ecosystems are inhabited by vast populations
    of autonomous machines, mostly hidden in the depths, behind our user-friendly
    interfaces. In the ventilated rooms of data centres and server farms, densely
    wired racks of computers more-than-human relations: high-frequency trading algorithms
    compete for the best price for largely automated financial markets; real-time-bidden
    systems auction advertising spaces within milliseconds; crypto-mining algorithms
    bitcoin by solving mathematical puzzles; AI content moderation tools flag the
    outputs of spam bots, while bias detection systems police AI models at runtime
    (D. Mackenzie 2019; Burr, Cristianiani and Ladyman 2018; Mellet and Beausipage
    Gillespie 2018; Bessi and Ferrara 2016; Tsvetkova et al. 2017; Jiang and Nachum
    2020).


    Rahwan and colleagues (2019) have portrayed these artificial agents as animals
    in the wild, engaging in one-to-one interactions and forms of collective behaviour.
    However, isolating an algorithmic system from its techno-social habitat is not
    as straightforward as it may seem. The anthropologist Nick Seaver has cleverly
    remarked that ‘algorithms are not technical rocks in a cultural stream, but are
    rather just more water’ (2017: 5). They are not ‘singular technical objects that
    enter into many cultural interactions, but rather unstable objects’ which are
    embedded in – and, somehow, inseparable from complex socio-technical assemblages
    (Gillespie 2016).


    Still, just as we normally treat humans and animals as individual agents at once
    independent from and related to the air we breathe, the partners we mate with
    and the bacteria they have, so we can see each algorithmic program as a recognizable
    artificial entity related to other human and non-human entities – which is what
    AI researchers, developers'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Code in the Culture


    and even users tend to do (Science Magazine 2018; Harrison 2018; Siles et al.
    2020; Gillespie 2014). This perspective is widely shared in the social sciences
    and humanities (e.g., Burr, Cristianini and Ladyman 2018; Esposito 2017; Knorr
    2009; Floridi and Sanders 2004; also see Cerulo 2009), and it has been developed
    in sociology by the STS scholar Donald McKenzie.


    Taking inspiration from Knorr Cetina’s work, McKenzie has recently argued that
    Erving Goffman’s classic theories of social interaction can be extended ‘to situations
    in which trading algorithms interact with each other rather than human beings’
    (2019:41). In the highly digitized domain of financial markets, most of the work
    is done by autonomous machines, employed to place and match orders, price movements
    and deceive competing algorithms (D. McKenzie 2018; 2019; O’Neil 2016; Pardo-Guuerra
    2010). purely instrumental goals and total lack of consciousness, thousands of
    agents working for high-frequency trading firms co-produce an ‘interaction order’
    that, according to McKenzie, presents communicative strategies and forms of collective
    organization which resembles the face-to-face situations famously observed by
    Goffman (1983). Nonhuman interactions are also somewhat shaped by social institutions
    – as financial regulations – and material arrangements such as the length of the
    fibres connecting servers, which physically affects the speed of automated interactions
    and, therefore, their success (D. McKenzie 2018; 2019). These opaque data-based
    exchanges can potentially have very tangible effects on the social world, as the
    following example of an algorithm-induced ‘flash crash’ in the stock markets:


    > @AP: Breaking: Two Explosions in the White House and Barack Obama injured. This
