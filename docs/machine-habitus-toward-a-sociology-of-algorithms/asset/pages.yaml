  md: '# Techno-Social Reproduction 153


    automated systems (see Table 3). Algorithm-generated data are often publicly available
    via platform APIs, as in the case of related YouTube videos (Airoldi, Beraldo
    and Gandini 2016). When this is not the case, for highly personalized ads and
