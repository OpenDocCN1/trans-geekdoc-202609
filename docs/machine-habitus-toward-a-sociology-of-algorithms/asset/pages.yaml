    feeding platforms and their algorithms with our labour and cognition (Mühlhoff
    2020). For example, DeepMind’s AlphaGo became the best Go player in the world
    thanks to a huge dataset of thirty million games played by actual people online,
    who had absolutely no clue about how their data would be used afterwards. Way
    more numerous, these humans behind machines are hidden too. As Brouillard remarked:
    ‘most versions of the AlphaGo story focus on the magic of the algorithms, not
    the humans who invisibly and over the course of years worked (without compensation)
    to create the training data’ (2018: 36).


    Trainers can be unpaid platform users or low-paid ‘micro-workers’, often recruited
    online via crowdsourcing services such as Amazon’s Mechanical Turk or Clickworker
    (Casilli 2019; Irani 2015; Gillespie 2018). They can be involved in two main AI
    preparation tasks: data generation and data annotation (Tubaro, Casilli and Coville
    2020). The first is pretty intuitive. In our dataified and surveilled social world,
    there is no need to get people to fill in questionnaires or join focus groups
    in order to generate data useful in machine learning. Any sort of behavioural
    trace recorded in digital format can potentially become input data. Hence, to
    ‘work’ as an AI trainer, it is sufficient to play videogames online, turn on your
    new car, check your email inbox, for a walk or have a chat with a friend.


    The second AI preparation task, data annotation, requires more explanation. The
    online data used to train AlphaGo came with a key dummy variable indicating which
    moves should be imitated (or avoided) by the learning AI: that is, the game’s
    final result (won, or lost). In a similar way, social media data generally have
    in-built measures the information-filtering algorithms managing the visibility
    of content or ads are modelled to maximize – e.g. number of clicks, seconds of
    watch time, et c. (Bucher 2012a). However, in fields like image recognition or
    text classification, which deal with unstructured digital traces regarding the
    complex cultural universes of language and social imaginaries, training data must
    be labelled by humans. As a matter of fact, a machine cannot really know what
