  md: '# Code in the Culture


    2019). It has a cultural – yet computational – authority, exerted through the
    ever-changing musical selections tailored to (predicted) preferences (Prey 2018).
    Whether individual or computational, taste classifies and classifies the classifier
    (Bourdieu 1984: 6); that is, by practically distinguishing between ‘the beautiful
    and the ugly’, the artificial social agent implicitly reveals the social origins
    of its probabilistic distinctions – rooted in the local and global data contexts
    of machine socialization. Most likely, in line with Bourdieu’s original account
    of the logic of cultural distinction, the path-dependent classific practices of
    machine learning systems will reflect pre-existing social divisions and relations
    of symbolic power (1984; 1989a) – making it more probable, for instance, that
    musical forms recognized as ‘legitimate’ in a given context will be recommended
    to ‘distinguished’ users already accustomed to them (Fourcade and Johns 2020).
    Alternatively, these systems may help consumers emancipating them from their social
    background and habitus, discovering new content and thus, building cultural capital
    (Webster 2019: 2; Beer 2013a: 95–6).


    While empirical demonstrate significantly influence individual choice (Gomez-Uribe
    and Hunt 2015; Jiang et al. 2019; Hargreaves et al., 2018; Wu, Riziou and Xie
    2019), their second-order consequences on society and culture are harder to estimate.
    In theory, one could expect that, as multiple computational models analyse the
    social world, the social world swiftly responds to predictions, in a recursive
    circle (Kitch and Dodge 2011: 30). However, ‘the concrete forms of action and
    transformation that might take shape in relation to machine learning are not yet
    obvious’ (Mackenzie 2015: 443); see also Dhawan et al. 2019; Fourcade and Johns
    2020). For instance, empirical studies addressing the hypothesized causal relation
    between algorithmic filter bubbles and a rampant political polarization have produced
    contrasting results so far (for a critical review, see Bruns 2019). In order to
    reflect sociologically on the complex feedback loops between the code and the
    culture, my analytical strategy consists in first zooming in, getting closer to
    where socialized machines interact.'
