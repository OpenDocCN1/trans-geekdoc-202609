    nobody has to manually compile a list of ''spammy'' words and weigh them. What
    happens is in a first step classes are defined on the basis of what the classification
    is supposed to achieve, its purpose; in our case the sorting of emails into spam
    and not-spam. When a user begins to mark messages, the list of weighed words is
    generated automatically, producing a basis for decision-making that is not a clear-cut
    formula, but an adaptive statistical model containing potentially hundreds of
    thousands of variables. (Rieder 2017: 110)


    Instead of fixing rules, the spam filter inductively discovers that words such
    ''password'', ''about'', ''expire'' have a higher likelihood of appearing in phishing
    messages ideally destined for the junk folder (Figure 3). With no human-like understanding
