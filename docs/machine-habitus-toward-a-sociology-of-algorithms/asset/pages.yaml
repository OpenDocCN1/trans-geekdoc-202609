  md: '# Culture in the Code 47


    one of sociology’s founding fathers, Max Weber: the idea – shared also by Bourdieu
    (Schirato and Roberts 2018: 35) – that a sociologist must (attempt to) study the
    social world ‘free of value judgments’ (Black 2013).


    For Weber, ‘where human affairs are concerned, there can never be an ‘objectivity’
    (Blum 1944). Following this postulate, it is not sociology’s job to establish
    whether something is ‘garbage’ or ‘fair’. Rather, its main purpose is to understand
    (*verstehen*, in German) the complexity of phenomena by trying to embrace the
    different perspectives of the actors involved, regardless of researchers’ personal
    beliefs. Even when the Weberian principle of value neutrality is rejected in favour
    of more parochial and publicly engaged forms of sociological research (Hammersley
    2017; Buraway 2005), reasoning in terms of bias is seldom a valuable option. Sexist
    men and racist voters certainly present biases against women and migrants. Yet,
    there is so much to study and understand – such as the social structures, forms
    of power, historical discourses, identities and cultural values linked to sexism
    and racism. Bias is just the very of the iceberg: sociologists love what lies
    underwater.


    That holds true for the sociology of algorithms too. As long as a machine learns
    from dataied human actions, it will not only apprehend discriminatory biases,
    but also a broader cultural knowledge, made of inclinations and dispositions,
    and encoded as machine habitus. For instance, IAQOS learned words linked to the
    nuanced local culture of a very specific community regarding the neighbourhood’s
    multicultural gastronomy, dialectal expressions, important venues and shared social
    problems; its subsequent practical practices reflected this unique, contextual
    knowledge. The machine habitus does not need to bear scholarly relevance, for
    the same reasons why sociology does not study hemicides and prejudices only. On
    the contrary, it can be as innocent as a chatbot’s preference for flowers over
    (Calikan, Bryson and Narayanan 2017), as bizarre as the prediction for adult diapers
