    Machine Habitus


    The great importance of the multidisciplinary research that aims to monitor algorithmic
    bias and make automated systems more ethical and accountable is not in question
    here (e.g. Floridi et al. 2018; Yu et al. 2018; Martin 2019; Ananny and Crawford
    2018; Crawford et al. 2019). The present work simply undertakes a different, more
    theoretical pathway, calling for a sociological shift in both focus and vocabulary.
    When applied to the study of machine learning systems, concepts like *culture,
    socialization, practice and habitus* open the door to a whole new set of questions.
    One of which is the following: what kinds of datified culture inhabit the algorithms
    we encounter through our digital devices?


    # Data contexts


    Traces and patterns

    Almost everything can be transformed into machine-readable data. Once digitized,
    images, documents, sounds, movements and behaviours can all be translated into
    what Lev Manovich early on saw as the ‘cultural form’ characteristic of the digital
    age: the database. With the database, ‘no longer just a calculator, a control
    mechanism or a communication device, a computer becomes a media processor’ (Manovich
    2002: 48). Once mediated by numeric values and character strings, reality can
    finally be archived and manipulated by autonomous systems.


    For example, the machine learning system managing my Facebook newsfeed prioritizes
    the posts of a few friends about a limited number of topics, based on the analysis
    of a long list of behavioural traces, including my past interactions with ‘similar’
    content (Bucher 2012a). Over time, it has accumulated a practical knowledge about
    my interests, which makes this system considerably different from, for instance,
    the ‘twin’ algorithm that manages content visibility on my girlfriend’s account.
    It is as if separated brothers or sisters grew up in different families, and as
    a result become different kinds of people. The Facebook algorithm absorbs a data
    representation of users’ socially structured practices – their sympathy for human
    rights, passion for'
  merge: -1
