  md: '# Culture in the Code 45


    behavioural biases, content production biases, normative biases, external biases).


    For instance, the aforementioned Amazon recruiting system was ‘trained to vet
    applicants by observing patterns in résumés submitted to the company over a 10-year
    period’. A bit like AlphaGo and the thirty million games, the idea was to identify
    those data features associated with candidate profiles, in order to computationally
    infer the selection logics used by human recruiters. However, most of the past
    job applications included in the training dataset came from men, reflecting the
    male dominance across the tech industry. As a result, the AI tool ‘taught itself
    that male candidates were preferable’, and ‘penalized resumes that included the
    word ‘women’s’, as in ‘women’s club captain’ (Dastin 2018). This sexist result
    was not formalized in the initial model; rather, it emerged from machine training.


    Given the high dimensionality of human-generated data and the layered, non-linear
    computations especially characterizing deep learning methods, which undesired
    outcomes can be hard to prevent (Predreschi et al. 2018; Campolo and Crawford
    2020; Cardon 2018). Another and classic example of how biased machine behaviour
    may arise from input data, independently of how a system is originally programmed,
    Microsoft’s chatbot Tay — already mentioned in the previous chapter:


    Capable of interacting in real time with Twitter users, Tay was learning from
    its conversations to get smarter over time. Twitter users had ‘repeat after me’
    feature enabled. This simple form of machine learning allowed Tay to learn from
    its interactions and, once targeted with racist and hate tweets, it went from
    the giggly ‘Humans are super cool!’ to becoming a racist nazi, with her last tweet
    ‘Hitler was right’. (Desole 2020: 130–1)


    ‘Garbage in, garbage out’ would likely be the comment of a computer scientist
    confronted with these cases. Yet, ‘society in, society out’ would be a sociologically
    more appropriate description. Indeed, the ‘garbage’ that produces biases such
    as those in the examples above is nothing but a bundle of asymmetric social relations,
    culture and practices transformed into machine-readable digital traces.'
