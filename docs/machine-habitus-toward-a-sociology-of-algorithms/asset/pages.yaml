  md: '# Machine Habitus


    Just as quickly as the announcement of the explosions had led to a precipitous
    drop, the market had returned to its former position. The entire event happened
    in less than five minutes. (Karppi and Crawford 2016: 2)


    The interaction order of algorithms can be observed outside of financial markets.
    A large fraction of the user base of social media platforms like Twitter and Facebook
    is composed of ''social bots'' sharing news and posting content, whose coordinated
    actions are believed to have significantly affected public opinion during multiple
    electoral campaigns (Bessi and Ferrara 2016; Gligletto et al. 2020). The allocation
    of online advertising spaces is ordinarily accomplished through real-time auctions
    within the time taken by a webpage to load, with the aim of determining which
    advertiser is willing to pay for their advertisement to be shown to a specific
    user profile (Burr, Cristianiani and Ladyman 2018:737; Mellet and Beausipage 2020).
    Moreover, beneath the digital surface of the World Wide Web, ''in every router,
    switch and hub'', algorithmic ''daemons'' jointly orchestrate the global flows
    of digital information, determining the speed of your Zoom call and file sharing
    (McKelley 2018: 67).


    Regardless of the encoded prescriptions of the deus in machina, human-free algorithmic
    interactions can lead to unexpected outcomes. These are not necessarily due to
    a twisted machine training, as in the examples discussed in the previous chapter,
    but more often result from complex interactional dynamics. For instance, through
    an analysis of all the interactions among editing bots that occurred on Wikipedia
    between 2001 and 2010, Tsvetkova and colleagues highlighted how these systems
    ''behave and interact predictably and as efficiently as humans'' (2017: 7). A
    sizable portion of Wikipedia entries are edited by autonomous bots which, at the
    time of the research, were mainly employed to link different language editions.
    The study found that these relatively simple rule-following machines tended to
    disagree with each other, and engaged in fights over specific entries, often prolonged
    over years. Today, Wikipedia editors can employ more sophisticated machine learning
    tools trained on human-labelled data, with the aim'
