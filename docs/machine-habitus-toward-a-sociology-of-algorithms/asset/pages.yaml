    machine learning models seek to predict in the first place. The (sadly common)
    belief that such an objective viewpoint on the world would be even possible is
    epistemologically naive (see boyd and Crawford 2012).


    Whether algorithmic predictions are accurate or not is scarcely relevant for my
    present reflections. What matters here is that the data traces machine learning
    systems are ordinarily fed with bear the imprint of the social worlds they have
