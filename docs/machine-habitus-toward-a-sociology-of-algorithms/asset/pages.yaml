  md: 'As Fuchs notes ‘learned biases formed on human-related data frequently resemble
    human-like biases towards race, sex, religion’ (2018: 1). According to the computer
    scientist Baeza-Yates, ‘our inherent human tendency of favoring one or opinion
    another’ creates ‘both latent and overt biases towards everything we see, hear,
    and do’, which are ‘intrinsically embedded in culture and history’ (2018: 54)
    – and then learned by algorithms.


    A common conclusion is that machine learning systems are biased too, and the two
    must therefore be ‘fixed’ (Mullinan 2019). While this might sound quite reasonable
    – why not magically erase racial discrim or gender stereotypes? – it is only one
    way to look at this complex matter. This pragmatic view ultimately relies on a
    normative understanding of society and social agents as deviating from abstract
    ideas of ‘fairness’, upon which the very notion of bias is antithetically defined
    (Hardt, Price and Srebro 2016; Frieden, Scheidegger and Venkatasubramanian 2016).
    However, both these ideas and the algorithms designed to approximate them are
    social constructions (Greene, Hoffman and Stark 2019; Galeotti 2018; see also
    Mercer 1978), Who decides what is ‘garbage’ and what is ‘fair’ (Crawford and Paglen
    2019)? Is it possible to correct biases in an objective way? Technical attempts
    to ‘unbias’ algorithms and datasets doing more damage (Završnik 2019; Gillespie
    2018; Campolo et al. 2017: 15–16) – rather like many historical attempts to ‘fix’
    humans,Effects to isolate ‘bad data’, ‘bad algorithms’, or localized biases of
    designers and engineers are limited in their ability to address social and systemic
    problems?, and ultimately ‘fail’ to address the very hierarchical logic that produces
    advantaged and disadvantaged subjects in the first place’, Hoffmann critically
    concludes (2019: 90–10, 901).


    Sociology might be of help here, since isolating ‘bad’ individuals or groups has
    never been a core occupation of the discipline. Also, differently from psychologists,
    sociologists rarely employ the term ‘bias’, or do so in a purely methodological
    sense (e.g. with reference to a ‘biased measurement’). This reluctance toward
    normativity is perhaps linked to the principle of non-valuation forward'
