  md: '# A Theory of Machine Habitus 137


    Four scenarios of techno-social reproduction


    Imagine a field à la Bourdieu, structured by social and symbolic boundaries, becoming
    encapsulated and engineered by a digital infrastructure. Suddenly, it is populated
    by machine learning algorithms filtering people’s experiences and possibilities
    based on data patterns, in ways that opaque orient their entangled practices and
    dispositions. This generic description potentially fits a number of real-life
    cases: from streaming-dominated cultural fields to digitized markets; from food
    delivery services to ridesh apps; from platformized managed workplaces; from online
    education to platform-mediated journalism, politics, leisure, sexuality and social
    more broadly.


    Tech companies have substantially turned the Bourdieusian game into a videogame,
    ‘augmenting’ pre-existing social struggles. Machines play with, or against, our
    dafied selves. Winning or losing can have tangible consequences for users – albeit
    not for the lifeless algorithms. Many aspects of this societal transition are
    worth exploring, and some have already covered in the recent literature (e.g.
    Cotter 2019; Levina and Arriaga 2014; Ragnaeda and Riu 2020; Fourcade and Johns
    2020). Here, I focus specifically on one: the types of macro effects user–machine
    entanglements can have on boundaries.


    Before illustrating some possible scenarios, summarized in Figure 5, a few clarifications
    are needed. First, the dispositional distance of users and machines negotiates
    symbolic boundaries essentially determining how people and content are ranked
    and associated in both algorithmic outputs and in people’s minds. Second, this
    can have a considerable impact on social boundaries too: either directly, when
    users’ economic, cultural and social capitals are at stake within techno-social
    fields – for instance, in the case of social media influencers and algorithmically
    controlled workers – or indirectly, as a consequence of shifts in symbolic boundaries
    (Lamont and Moln 2002). Third, the local or global data contexts and cultural
    logics at the root of the machine habit make a difference to the scale of boundary
    reinforcement or transformation, which can consist in either a bottom-up, user-level
    effect with limited power, or a powerful top-down, platform-level one.'
