    The main way in which the critical literature surveyed above has dealt with these
    cases is through the notion of bias. Originated in psychology, this notion indicates
    a flawed, distorted and ‘unfair’ form of reasoning, implicitly opposed to an ideal
    ‘neutral’ and ‘fair’ one (Friedman and Nissenbaum 1996). Researchers have rushed
    to find practical recipes for ‘unbiasing’ machine learning systems and datasets,
    aiming to address instances of algorithmic discrimination. Still, these attempts
    are often post interventions that ignore the cultural roots of bias in AI (Mullainathan
    2019), and risk paradoxically giving rise to new forms of algorithmic censorship.
    As Zavrnik puts it ‘algorithms are ‘fed with’ data that is not ‘clean’ of social,
    cultural and economic circumstances [...]. However, cleaning data of such historical
    and cultural baggage and dispositions may not be possible or even desirable (2019:
    11). While the normative idea of bias is in many cases served to fix real-life
    cases of algorithmic discrimination and advance data policies and regulations,
    it hardly fits the sociological study of machine learning systems as social agents.
    In fact, from a cultural and anthropological perspective, the viewpoints of any
    social group – from a national community to a music suburb – are necessarily biased
    in some way, the socially constructed criteria for ultimately evaluating and valuing
    the varying world from culture to culture (Barth 1981; Latour and Wolg 1986; Bourdieu
    1977). Hence, the abstract idea of a ‘bias-free’ machine learning algorithm is
    logically at odds with this fundamental premise. ‘Intelligent’ machines inductively
    learn from culturally shaped human-generated data (Mühlhlhoff 2020). As humans
