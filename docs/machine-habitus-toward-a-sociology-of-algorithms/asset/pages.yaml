  md: '# Machine Habitus


    TikTok, Amazon, Netflix, Instagram, Tinder, and more. By manipulating language,
    markets, taste, public opinion and social relations, based on the practical replication
    of propensities acquired from human trainers, socialized machines agentically
    take part in shaping the social (Tuferci 2015). Their predictions inductively
    emerge from the contingent encounter of encoded cultural dispositions – i.e. a
    system’s machine habitus and ever-changing ‘correlational experiences’ (Lizardo
    2013) or data contexts – e.g. user-generated prompts, inputs and feedback. These
    encounters are inevitably constrained by the infrastructures that make them possible
    in the first place, such as those of websites, platforms and software (Plantin
    et al. 2018). Still, the volatile statistical interaction between the code and
    the culture leaves space for unexpected outcomes and scripted improvisations,
    including the one above by GPT-3.


    The social life of machine learning systems presents analogies with Bourdieu’s
    theories of (human) practice (1977; 1990a). For the French sociologist, individual
    behaviour is out ‘generically’ conditioned by embodied social structures guiding
    action (i.e. the habitus) and contextually shaped by new experiences and circumstances
    – which reflect the rules and stakes implicit in the various ‘fields’ of the social
    (Bourdieu and Wacquent 1992). The dialectic between the habitus and a socially
    regulated field – linked, for instance, to a professional context (Bourdieu 1975)
    or an artistic domain (Bourdieu 1993) – produces observable regularities in individual
    practices. For Bourdieu, the reason why an academic writes a book, or a consumer
    decides to buy a particular piece of furniture, is seldom to be found in the subjects’
    conscious intentions and desires. As Schirato notes:


    Bourdieu rejects the idea of a knowing, transcendental consciousness (along the
    lines of the Cartesian cogito) that is separated from independent of history,
    social trajectories and cultural frameworks. All activity and knowledge [...]
    are always informed by a relationship between the agent’s history and how this
    history has been incorporated on the one hand, and their context or circumstances
    [...] on the other. (Shirato and Roberts 2018: 133–4)'
