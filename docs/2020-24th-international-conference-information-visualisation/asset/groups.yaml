    最终，用户必须选择从哪个源获取数据。需要注意的是，这并不是获取股票数据的数据源（Yahoo Finance），而是指系统的内部机制。有两个选项：


    - Fetch（获取）：直接从 Yahoo Finance 获取的原始数据。

    - Catch（捕获）：每个原始股票数据与之前定义的 CEP 标题所定义的事件模式之间的匹配。这些事件中的许多取决于用户在第一步中定义的 CEP 规则。因此，在对用户感兴趣捕捉的特定字段应用映射之前，捕获的事件无法直接馈送到
