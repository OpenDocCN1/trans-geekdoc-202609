    # A Visual Interactive Analytics Interface for Complex Event Processing and Machine
    Learning Processing of Financial Market Data


    Nhan (Trian) Luong

    Deontik

    Brisbane, Australia

    luongtrinh@gmail.com


    Zoran Milovic

    Deontik

    Brisbane, Australia

    zoranon@deontik.com


    Andrew Berry

    Deontik

    Brisbane, Australia

    andyl@deontik.com


    Fethi Rabhi

    School of Computer Science and Engineering

    University of New South Wales

    Sydney, Australia

    frabhi@usw.edu.au


    **Abstract**— Applying machine learning techniques over streaming data is difficult
    as it involves the interplay of technologies that need to be judiciously put together
    and easy interfaces for financial experts to leverage both Complex Event Processing
    (CEP) and Machine Learning (ML) technologies. The solution proposed in this paper
    is based on an open architecture where CEP engines provide functionality for downstream
    ML training and predictions. This approach using a sensors network involving the
    analysis of financial market data streams.


    functions while allowing operate with downstream ML and AI functions ensure easy
    customisation with CEP engines and ML libraries.

    The next section presents related work in streaming analytics that involve using
    ML and AI on adopted methods and their implementation. Section III describes the
    implementation, focusing on the analytics user experience that was developed to
    assist experts in using the implementation. Section IV provides an overview of
    our approach using selected scenarios and sections. Section V discusses conclusions
    and future directions.


    **Keywords**— visual analytics; real-time analytics; complex event processing;
    machine learning; artificial intelligence; financial market; data.


    # I. INTRODUCTION


    Nowadays, Machine Learning (ML) technologies and tools are used in fields like
    healthcare, where ML agents are both faster and more accurate than humans at detecting
    patterns and where self-driving software learns how to drive a car by itself.
    They are also being used in the financial industry to assist investors and with
    decision-making processes. When market shifts arise, the market need to respond
    to both environmental factors and any of the investors'' actions, ML algorithms
    need be able to adapt very quickly to changes and capture the latest. This is
    why integrating live data streams is vital for ML to ensure that algorithms operate
    on the new data as it becomes available.


    Technologies for analyzing data streams (like Complex Event Processing (CEP) and
    those for building ML predictors (often based on static data) have traditionally
    developed in isolation [1]. The challenge is to solve a problem with skills that
    domain experts often do not possess. This paper describes a solution to domain
    experts to extract real-time patterns in financial market data streams using ML
    algorithms that are based on an open architecture that supports event-based streaming


    # II. RELATED WORK, INTEGRATING EVENT-BASED STREAMING


    In the financial field, there is increasing interest in the Area of Direction
    Changes (ADC) that promotes that an event-based system can capture significant
    points in price movements that traditional financial methods cannot [2]. On the
    computing field, research by Gal in 2014 [6] investigated the integration of ML
    and CEP in the context of market Analysis and Surveillance, as well providing
    performance benchmarks. The authors suggest that the combination of the two technologies
    with different capabilities can be created to increase the accuracy of the overall
    system. CEP technologies handle the correlation between multiple events while
    ML algorithms might specify operations on the data stream to add a prediction
    element that is difficult to model. Recent work conducted by Gal in [5] introduced
    a scalable framework for multiew streaming data analytics using deep learning.
    Another related research is about the use of Massive Data Analytics (MOA) which
    is a software environment for experimenting with both offline and ML techniques
    on a stream of data. It is the successor of the popular WEKA project [1]. But
    references mentioned above allow data scientists with so technical knowledge to
    exist as discovering the underlying correlation that exists in large'
  - '[PAGE 1]


    volume of data. However, these projects lack support for the potential integration
    of a CEP engine processes streaming data and provides sophisticated detection
    of event patterns. Furthermore, they do not have user interfaces that non-experts
    can use to reconfigure the system based on their needs or conduct experiments.


    Our recent research in [3] has proposed a novel architecture which follows the
    following design principles:


    +   - Separating functionality with CEP solutions from emerging streaming solutions,
    e.g. Kafka [1], Flink [2], which provide processing maturity and are becoming
    more widely used;

    - Using pre-streaming data coming either from the streams or from the CEP engines
    as input to the machine learning (training) capacity;

    - Allowing any predictor to be linked to the machine learning models.


    In this architecture, the continuous learning is supported by collecting the traces
    of event patterns that satisfy pattern conditions and detected by the CEP engine.
    These are then processed in the message layer of the Stream Processor and can
    be used as training data for the Trainer. Performance is dictated by the specifications
    of the application in use. For example, in the stock price prediction scenario,
    this can be done at the end of the trading day, or in extremes, on demand. We
    also separate the functionalities of the Trainer and Predictor, to allow the model
    to be updated background while the Predictor continues to predict without interruption.
    This is a general architecture which can be realized using specific technologies,
    as shown in Fig. 1. Details of the specific components are given in [3].


    This architecture is only a first step as the possibility to leverage technologies
    but does not guarantee usability for experts. Furthermore, this effort must be
    followed by the development of interactive user interfaces that are highly customized
    to address the needs of domain experts.


    # III. PROPOSED SOLUTION


    The main contribution of this paper is to extend the implementation in [3] with
    a novel way for domain experts to combine CEP/ML analytics over financial market
    streams. We provide more details about the implementation used by a description
    of the user experience.


    # A. Description of the implementation used


    The implementation used has been realized using a number of open-source components
    as described below:


    ![](img/b65f30970daf78d0ad95e042058fffa0_1_0.png)


    Figure 1. Architecture and implementation described in [3].


    +   - Dashboard: allows a user-friendly specification of CEP events, times and
    events of significance for particular application, e.g. event sequences, indicating
    increase or decrease of stock price; the dashboard will be visually relevant and
    store extracted stock patterns.


    +   - Orchestrator: purpose is to pass the definition of these event patterns
    to components, namely Flink (for accessing data sources) and Catch, to process
    CEP rules. It also handles the internal state of the application, e. relationship
    between events, and controls their execution.


    +   - Fetch: provides access to external data streams from the Dashboard Catch
    can. The Fetch component is essentially an observer of events of a pattern type
    which are fetched from the environment for the stream processing.


    +   - Stream Processor: carries out event processing functions such as filtering,
    joining event of patterns on different channels, and keeping a persistent event
    store of events, which can subsequently be processed for analytics purposes.


    +   - Catch: is an event detecting engine that processes events captured by the
    Stream Processor and then analyzes them as CEP processing rules. This component
    is intended for the processing of opportunities of sophisticated CEP functionality
    to be delivered ever.


    +   - Trainer: a machine learning component, intends to access the trained dataset
    incremented by the Stream Processor. The dataset consists of either the events
    received by the Stream Processor from the Fetch or the detected event instances
    after CEP processing performed by the Catch, using the underlying ML model which
    is TensorFlow [7] in this case.


    +   - Predictor: uses the trained model produced by the Trainer, then applies
    it to the new data to generate predictions. This is part of the continuous learning
    approach and which is not shown in the diagram, but we can investigate this in
    the future.'
