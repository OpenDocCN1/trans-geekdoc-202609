    # 一种用于复杂事件处理和机器学习金融市场数据的可视化分析接口


    Nhan (Trian) Luong

    Deontik

    Brisbane, Australia

    luongtrinh@gmail.com


    Zoran Milovic

    Deontik

    Brisbane, Australia

    zoranon@deontik.com


    Andrew Berry

    Deontik

    Brisbane, Australia

    andyl@deontik.com


    Fethi Rabhi

    科学与工程学院

    新南威尔士大学

    悉尼，澳大利亚

    frabhi@us.au


    **摘要**——在流式数据上应用机器学习技术是复杂的，因为它需要谨慎地整合技术并为专家提供简单的接口。本文提出的解决方案基于一种开放架构，其中复杂事件处理
    (CEP) 引擎为下游机器学习 (ML) 提供功能。下一节介绍了涉及机器学习和人工智能的流式分析的相关工作。第三部分描述了实现细节，重点关注为领域专家开发的用户体验。第四部分提供了我们方法和所选场景的概述。第五部分讨论了结论和未来方向。


    **关键词**——可视化分析；实时分析；复杂事件处理；机器学习；人工智能；金融市场；数据。


    # I. 引言


    如今，机器学习 (ML) 技术和工具已应用于医疗保健等领域，其中机器学习代理比人类在检测模式方面更快、更准确。它们也被用于让汽车学习如何自动驾驶。当市场发生变化时，机器学习需要能够快速适应环境因素并协助投资者进行决策过程。因此，集成实时数据流以确保机器学习算法在可用数据上运行至关重要。


    分析流式数据的技术（如复杂事件处理 CEP）和用于预测的工具通常是孤立开发的，领域专家通常不具备解决问题的技能。本文描述了一种解决方案，基于开放架构，允许领域专家从金融市场数据流中提取实时模式。


    # II. 相关工作，集成基于事件的流


    在金融领域，人们对基于事件流 (ADC) 的兴趣日益增加，这种系统可以可以捕捉到传统方法无法捕捉的重要点。在计算领域，Gal 在 2014 年的研究调查了监控背景下机器学习和
    CEP 的集成，并提供了性能基准。作者建议将这两种技术结合，以增加整个系统的准确性。CEP 技术处理多个事件之间的相关性，同时允许机器学习算法在数据流上指定操作。Gal
    在 [5] 中进行的近期工作引入了使用深度学习分析流式数据的可扩展框架。另一项相关研究关于大规模数据分析 (MOA) 的使用，这是一个在流式数据上进行机器学习实验的软件环境，它是流行的
    WEKA 项目的继任者。上述参考文献允许数据科学家利用技术知识发现海量数据中的相关性。然而，这些项目缺乏对 CEP 引擎处理流式数据的潜在集成的支持，也没有专家可以使用重新配置系统的交互式用户界面。


    我们在 [3] 中的近期研究提出了一种新架构，遵循以下设计原则：

    - 将 CEP 解决方案与新兴流式解决方案分离，例如 Kafka [1]、Flink [2]，这些解决方案正被广泛使用；

    - 使用来自流或 CEP 引擎的预处理流式数据作为机器学习（训练）能力的输入；

    - 允许任何预测器链接到机器学习模型。


    在此架构中，持续学习通过收集由 CEP 引擎检测到的满足模式条件的轨迹来支持。这些轨迹随后在流式处理器的消息层中处理，并可以作为训练器的训练数据。例如，在股票价格场景中，可以在一天结束时根据需要进行。我们还分离了训练器（Trainer）和预测器（Predictor）的功能，以允许模型在后台更新，而预测器不中断地继续预测。特定组件的细节在
    [3] 中给出。


    这种架构只是第一步，提供了利用技术的可能性，但并未保证专家可用性。此外，这项工作必须后续开发满足需求的交互式用户界面。


    # III. 提出的解决方案


    本文的主要贡献是扩展了 [3] 中的实现，为领域专家提供了一种在金融流上结合 CEP/ML 分析的新方法。我们通过对用户体验的描述提供了有关实现的更多细节。


    ## A. 所用实现的描述


    所使用的实现是通过许多开源组件实现的，描述如下：


    ![](img/b65f30970daf78dad95e042058fffa0_1.png)


    图1 [3] 中描述的架构和实现。


    - **仪表板 (Dashboard)**：允许用户友好地指定 CEP 事件、时间和特定应用程序的重要事件，例如指示股票价格上涨或下降的事件序列；仪表板将具有视觉相关并存储提取的模式。

    - **编排器 (Orchestrator)**：目的是将这些事件模式的定义传递给组件，即 Flink（用于访问数据源）和 Catch（用于处理 CEP 规则）。它还处理应用程序的内部状态，例如事件之间的关系并控制它们的执行。

    - **抓取器 (Fetch)**：从 Dashboard Catch 访问外部数据流。Fetch 组件本质上是模式类型事件的观察者，这些事件从环境中获取以进行流式处理。

    - **流式处理器 (Stream Processor)**：执行事件处理函数，如过滤、连接不同通道上的模式事件以及保持持久的事件存储，随后可以为了分析目的处理。

    - **Catch**：是一个事件检测引擎，处理流式处理器捕获的事件，然后将其作为 CEP 处理规则进行分析。该组件旨在处理交付交付复杂 CEP 功能的机会。

    - **训练器 (Trainer)**：一个机器学习组件，旨在访问由流式处理器递增的训练数据集。该数据集由流式处理器从 Fetch 接收到的事件，或由 Catch
    执行 CEP 处理后检测到的事件实例组成，使用底层的机器学习模型（在这种情况下是 TensorFlow [7]）。

    - **预测器 (Predictor)**：使用训练器产生的已训练模型，然后将其应用于新数据以生成预测。这是持续学习方法的一部分，图中未显示，但我们可以在未来调查这一点。


    '
