    ## B. 定义标题 (Define Title)


    定义标题是以 CEP 作为其分析类型的定义标题。它允许你定义用于提取序列模式的规则。由于底层 CEP 引擎支持多种 CEP 类型，在“分析类型”下方提供了一个“CEP
    类型”菜单，允许用户选择选项。根据原型，支持“梯度序列”（Sequence of Gradients）CEP（如图 3 所示）。梯度是一种特殊的事件，描述了连续增加、减少或保持不变的数值序列。每个梯度（线段）由关键事件处的股票价格值定义。相同方向的两个或多个梯度形成一个作为
    CEP 序列规则的事件模式。


    这种简单的梯度模式不足以探索复杂的模式，例如重叠模式（图 4）。梯度的组合由单个梯度组成，可以使用图 3 所示的序列编辑器进行组合，这被称为“梯度序列”。


    在此原型中，我们分析了源自 Yahoo Finance [1] 的每日数据。因此，梯度正在寻找每个交易日的开盘价（或收盘价），如果配置切换到不同的数据源，它将捕捉日内价格数据流。所有梯度都背尾连接到每个起始梯度。每个梯度都有最小长度和最大长度，以及一个方向（+1
    表示上升，-1 表示下降，0 表示平直）。以图 3 为例，序列中的值所示：


    - 梯度 1 捕捉一个连续增加的开盘模式序列，最小长度为 2，最大长度为 3。

    - 梯度 2 捕捉一个连续减少的开盘模式序列，最小长度为 2，最大长度为 3。


