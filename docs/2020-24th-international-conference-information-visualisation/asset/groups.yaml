    将梯度 1 和梯度 2 结合，我们得到了图 5 图表可视化的“双梯度序列”，其中每个事件都用圆圈表示。实线创建了一组由指定参数匹配的最小序列，而最大值则包含了实线和虚线。用户可以使用
    "+/-"按钮添加或删除梯度。

    用户还需要选择“股票代码”（Stock Symbol），这是用于唯一标识交易股票的缩写（例如微软的“MSFT”）。


    ![](img/b65f30970daf78d0ad95e042058fffa0_2_2.png)


