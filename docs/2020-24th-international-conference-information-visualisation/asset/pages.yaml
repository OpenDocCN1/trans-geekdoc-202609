  md: '![](img/b65f30970daf78d0ad95e042058fffa0_3_0.png)


    Figure 5. Gradient Event Sequence Visualization


    Eventually, the users have to choose which source to get the data from. It is
    important to note that this is not the data source from which the fetches the
    stock data (Yahoo Finance), but rather referring to the internal mechanism of
    the system. There are two options:


    +   - Fetch: This is raw data fetched directly from Yahoo Finance.

    - Catch: Each is a match between the raw stock data and the event pattern defined
    by the CEP Title defined previously. Many of these events depends on the CEP rules
    defined by the users in first pass. As a result, the captured events cannot be
    fed directly into a CEP Display Title without applying a mapping to specific fields
    that the users are interested in capturing.


    A user can give the title a custom name, and the Data Source that the ML can train
    using the respective menu. There are two data sources which are either a Fetch
    or Catch components, and if the user decides to use a Catch source, they have
    to specify Data Mapping as well. It is exactly the same mechanism used in Titan
    II.B.


    The user can click the "Create" button at the bottom to create a CEP Display Title
    (Section III).


    A user needs to use one of supervised ML algorithms provided. At present, the
    platform only supports the Dynamic Time Warping (DTW) and Long-Term Memory Neural
    Network (LSTM) algorithms. By default, DTW is chosen as the default "Create" button,
    and a responsive CEP Display Title (Section III).


    | ANALYTICS TYPE | Machine Learning |

    | ML TYPE | Supervised |

    | Name None |

    | ML ALGO DATA SOURCE DATA MAPPING |

    | Create | | |


    Figure 6. ML Define Title


    # C. ML Define Title


    An ML Define Title is the Title that ML as the Analytics Type (Fig. 6). A user
    can define configuration to perform various analysis tasks. At the top of the
    title, there is the "ML Type" menu which defines the ML category in use. There
    are two main types of ML algorithms presented to the:


    +   - Supervised: The ML algorithm is trained on a labeled dataset. Note that
    there are many types of supervised ML algorithms, such as regression or LSTM algorithms.

    - Unsupervised: The ML algorithm is left on its own devices to discover and present
    interesting patterns or structures in the data.


    # D. CEP Display Title


    A CEP Display Title (Fig. 7) is the visualization of the output produced by CEP
    rules using the corresponding CEP Title defined. It is simplistic with the Symbol
    in the ... charts, the name of the CEP Title next to the charts, and a counter
    that shows the count of the catch component detected. Users can hit the "Activate"
    button on the title to start the fetch configuration, which retrieves the new
    data about a stock event every minute, and an event sequence processing in the
    catch component. Raw stock data will fetch if it matches the matched data to increment
    the counter on the CEP Display Title, via Kafka (red line in Fig. 1). Once the
    user finishes their experiment, they can use the "Delete" button to get rid of
    the title and clean up the system.


    ```

    [ msft ] | Peak 1

    18

    event detected

    Activate Delete

    ```


    Figure 7. CEP Display Title'
