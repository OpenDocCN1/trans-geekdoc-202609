    # CONCLUSION AND FUTURE WORK


    The objective of this paper is to introduce an interactive and easy to use platform
    for financial experts to explore the combined power of CEP and ML engines in an
    interactive way. We developed a general architecture of the platform, which consists
    of components that interact with each other, and a specific implementation that
    handles financial data through all elements of the user interface and explained
    how they work, as described two specific use cases that the financial experts
    may want to explore. We made certain observations while exploring the platform
    and encountered a number of limitations that we would like to mention in our work
    on the platform.


    In terms of future work, our priority is to support a larger variety of CEP and
    ML algorithms. We will perform usability testing to see how easy or hard it is
    to use the platform. Using user feedback is very important as the platform is
    built for financial experts, so we want the platform to be straightforward as
    possible for this stakeholder. Lastly, we will increase the stability of the platform
    and user experience, restricted from addressing large and complex experiments.


