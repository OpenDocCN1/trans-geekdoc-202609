    # C. Observations


    While testing the above scenarios and some others, we made a few observations:


    +   - The platform is fast and responsive because all components in the proposed
    architecture are loosely coupled

    - The platform offers a high degree of flexibility to the users. Tile-based design
    allows the users to create a variety of tiles, each capable of processing highly
    complex financial use cases.

    - One of the main features is the ability to edit the tile while it is created.
    This could be worked by deleting and recreating the tile. we would like to implement
    this in our future work.

    - In order to fetch data from other sources than Yahoo Finance, a software engineer
    should be involved to extend the Fetch component.

    - The platform does not support currently ML algorithms or CEP patterns. All of
    these are currently hard-coded into components, and a software engineer should
    be involved to implement such features to adapt to new cases.

