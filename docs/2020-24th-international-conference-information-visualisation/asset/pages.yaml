- pgno: 2
  md: 'The user is presented with a dark-blue Dashboard depicted in Fig. 2. The first
    title they use is the Define Title. It is used to define either CEP or ML configurations,
    and the user can toggle between these types using the "Analytics Type" menu at
    the top. It is worth noting that the Define Title changes its color to pink if
    it is defining ML configurations, otherwise it stays blue when defining CEP rules.
    The rest of this section will describe in more detail how to use these types of
    titles.


    # B. Define Title


    A Define Title is the Define Title that has CEP as its Analytics. It allows you
    to define rules for extracting sequence patterns. Since the underlying CEP engine
    supports a variety of CEP types, a "CEP Type" menu is provided under the "Analytics
    Type" to allow users to select an option. As per the prototype, the "Sequence
    of Gradients" CEP is supported (Fig. 3). Gradient is a special kind of event which
    depicts a continuously increasing, decreasing, or unchanged numerical sequence.
    Each gradient (line segment) is defined by the stock price values at key events.
    Two or more gradients in the same direction form an event pattern as a CEP sequence
    rule.


    This simple gradient pattern is insufficient to explore complex patterns such
    as overlapping patterns (Fig. 4). The composition of Gradients comprises individual
    gradients that can be combined using the sequence editor depicted in Fig. 3, which
    is called a Sequence of Gradients.


    In this prototype, we analyze daily data originating from Yahoo Finance [1]. Therefore,
    the Gradients are looking for the opening (or closing) price of each stock day
    that will capture intraday price data streams if the configuration is switched
    to a different data source. All Gradients are connected back-to-back to each starting
    Gradient. Each Gradient has a minimum and maximum length of the Gradient, and
    direction (+1 for going up, -1 for going down, and 0 for staying flat). Using
    Fig. 3 as an example, the values in the sequence are shown as follows:


    +   * Gradient 1 captures a continuously increasing sequence of opening patterns
    with a minimum length of 2 and a maximum length of 3.

    * Gradient 2 captures a continuously decreasing sequence of opening patterns with
    a minimum length of 2 and a maximum length of 3.


    ![](img/b65f30970daf78d0ad95e042058fffa0_2_0.png)


    Figure 2. Initial state of the Dashboard


    ![](img/b65f30970daf78d0ad95e042058fffa0_2_1.png)


    Figure 3. CEP Define Title


    Combining Gradient 1 and Gradient 2, we get Sequence of Two Gradients visualized
    in the graph in Fig. 5, where each event is represented using a circle. The solid
    line creates a set of minimal sequence that is matched by the specified parameters,
    while the maximum includes both solid and dashed lines. Users can add or remove
    Gradients using the "+/-/ buttons.

    The user also needs to select the Stock Symbol, which is an abbreviation used
    to uniquely identify traded shares (e.g., "MSFT" for Microsoft).


    ![](img/b65f30970daf78d0ad95e042058fffa0_2_2.png)


    Figure 4. Popular stock patterns'
