  md: '# E. ML Display Title


    ML Display Title (Fig. 9) is the visualization of the ML output as a result of
    using the ML Definition It allows users to start the training process. What happens
    behind the scene is the Trainer component pulls data from a Kafka Source, then
    performs the training. As soon as the process completes, the model is transferred
    to the Prediction component for predictions on the new incoming data from the
    Data Source. The results are shown directly on the title. An example of using
    this and interpreting the result will be given in section IV.


    Users can also use the “Get Data” button to download the training dataset, which
    is in CSV format and created based on the parameters specified at creation stage
    using the ML Definition. This dataset can be used as the input to other systems
    for further analysis if needed. If any time the user wants to get rid of the title,
    they can click the “Delete” button.


    We demonstrate the user experience using two scenarios, both of which are related
    to price status, as described below.


    # IV. Evaluation Scenarios


    # A. Scenario 1


    In this scenario, it is interested to know which two different scenarios, for
    Microsoft (MSFT) and Apple (AAPL) shows together a sequence of increasing followed
    by a decreasing gradient. Here are the specific steps that the user has to perform
    in this:


    +   - The inventor creates a CEP Title that is called “Peak 1”, and fetches data
    on the “MSFT” stock symbol. He then creates two rules called “Sequence of Gradients”.
    The first one with a minimum length of 2, a maximum length of 3, and direction
    (increasing). The second one with a minimum length of 1, a maximum length of 3,
    and direction of -1 (decreasing). He should use the Fetch Data source and the
    Display Title on which he can hit “Activate” to see event patterns showing up.

    - The inventor creates another CEP Title that is called “Peak 2”, and fetches
    data on the “AAPL” stock symbol. He can create the same “Sequence of Gradients”
    rules as above to capture the same pattern.

    - The inventor can create an ML Display Title by 역시 the “Supervised ML” type,
    with source, “DTW” ML algorithm, and an appropriate Data Mapping. He can then
    click the “Train” button to get a number showing the difference between the event
    patterns.


    ![](img/b65f30970daf78d0ad95e042058fffa0_4_0.png)


