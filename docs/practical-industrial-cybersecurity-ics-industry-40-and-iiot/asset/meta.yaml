- - '##'
  - 11. 阻止不安全的数据传输，例如涉及知识产权或受版权保护材料的通信。更多信息，请参阅“出站监控”部分。
- - '##'
  - 12. 通知相关方。当发生已识别的事件时，遏制事件的第一步应该是通知所有可能受事件影响的相关相关方。让相关方参与进来是阻止多种类型攻击蔓延的关键步骤。更多信息，请参阅“遏制、根除和恢复”部分。
- - '##'
  - 13. 根因分析 (RCA)。RCA 是一种问题解决方法，用于将促成因素与根本原因区分开来。更多信息，请参阅“根因分析”部分。
- - '##'
  - 14. 因为这两类事件通常采用不同的补救方式。如果识别出入侵，采取的第一步应该是限制入侵者向网络发送流量的能力。另一方面，如果事件是基于恶意软件感染，你必须找到并缓解导致攻击的恶意软件。你还必须删除或禁用用于发起攻击的进程/协议，以及移除造成漏洞的服务/应用程序。更多信息，请参阅“根除/隔离”部分。
- - '##'
  - 15. 恢复阶段。IRP 的最后部分是恢复阶段。在 IRP 过程的这一部分，将采取行动验证受事件影响的所有系统和服务是否已完全恢复到正常运行状态。在 CSIRT
    确认事件已完全补救后，他们必须恢复相关方对系统的信心。更多信息，请参阅“恢复”部分。
- - '##'
  - 考试题目答案
- - '###'
  - 1. **A, B, E**。变更管理策略应涵盖以下文档，通过将创建和维护这些项目的责任分配给特定人员或小组：所有 ICS 组件的当前、功能性的软件代码库；ICS
    软件归档库；所有 ICS 控制和网络设备的当前硬件清单；当前的网络架构示意图；设备变更历史记录。更多信息，请参阅“变更管理文档”部分。
- - '###'
  - 2. **D**。决策树的根节点植根于给定 OT 设备应用补丁相关的风险降低因素。树中的第一个因素是暴露因素。根据暴露的性质——间接、直接或微小——树会从代表安全态势影响、安全影响和技术影响决策点的中心主干节点分叉出来。更多信息，请参阅“补丁决策树”部分。
- - '###'
  - 3. **B, D, E**。虽然安全补丁是解决 IT 网络环境中许多软件漏洞的关键，但这是一个在 IT 产品生命周期内持续进行的循环过程。然而，SCADA/ICS
    环境无法像企业补丁流程那样频繁地关机和启动。此外，OT 设备的自动化固件管理解决方案尚未广泛普及。更多信息，请参阅“软件重装和固件管理”部分。
- - '###'
  - 4. **A, C**。在其最新的 SP800-137《联邦信息系统和组织的信息安全持续监控 (ISCM)》中，NIST 组织将持续安全监控定义为包括漏洞监控、应用监控和威胁监控。更多信息，请参阅“安全监控”部分。
- - '###'
  - 5. **C**。安全信息管理 (SIM) 系统。此 SEIM 版本通常指为提供网络日志长期存储而创建的系统。更多信息，请参阅“SIEM 系统”部分。
- - '###'
  - 6. **B**。检测和分析阶段的首要功能是识别并验证报告的事件是否已发生，以及它是否为真实事件。事件报告可能来自组织内的任何地方，例如用户、不同级别的管理员、监控工具，甚至外部组织。更多信息，请参阅“检测和分析”部分。
- - '###'
  - 7. **A, B, E**。CSIRT 必须接管 IRP 剩余部分的执行。这包括但不限于：对指定事件处理人提供的信息（日志分析）进行详细分析；采取措施遏制事件并限制组织的风险敞口；执行根因分析活动以识别导致事件的源头；通过确定是根除还是隔离事件的根本原因（前提是根本原因是某种形式的恶意软件）来补救事件；实施从事件影响中恢复的具体步骤；以及在必要时，根据
    IR 流程结束时创建的事件响应报告中收集的信息更新 IRP。更多信息，请参阅“事件响应”部分。
- - '###'
  - 8. **A**。虽然在特定事件响应期间可能需要执行取证数据分析，但大多数 ICS CSIRT 的工作涉及计算机和网络取证活动。更具体地说，他们涉及执行取证日志分析。虽然取证日志分析是一门不断发展的科学，但
    IR 分析师通常花费时间搜索日志，寻找两个要素：事件关联和入侵迹象。更多信息，请参阅“取证日志分析”部分。
- - '###'
  - 9. **A, C, D**。对于给定的 IRP，每个 CSIRT 成员的角色和职责应明确识别并分配给特定人员。在任何特定组织中，CSIRT 可为以下任何团队角色指定人员：CSIRT
    团队负责人、事件处理人、IR 分诊经理、IR 取证分析师、IR 平台专家和漏洞处理人。更多信息，请参阅“创建事件响应团队”部分。
- - '###'
  - 10. **B**。在 CSIRT 确认事件已完全补救后，他们必须恢复相关方对系统的信心。更多信息，请参阅“恢复”部分。
