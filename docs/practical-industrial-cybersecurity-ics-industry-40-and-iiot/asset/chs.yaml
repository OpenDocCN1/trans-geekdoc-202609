  \ 4 层级\n    3.  在第 4 层级与第 3 层级之间\n    4.  在第 4 层级与第 5 层级之间\n\n\n\n\n# 5. 从以下列表中，识别出通常用于在网络中不同安全区域之间创建分区的网络设备。（选择所有适用项。）\n\
