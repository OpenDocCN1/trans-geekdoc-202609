  \n    **图 3.36** 小型企业网络分区\n\n7.  虽然扁平网络安全拓扑是组织网络成本最低的方法，但其主要缺点是什么？\n\n8.  当网络用户所在的安全区域与所需数据所在的区域不相邻（且他们合法地需要访问该数据）时，必须采取哪些步骤？\n\
