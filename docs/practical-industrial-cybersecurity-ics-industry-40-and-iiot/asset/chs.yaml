  _\\_\\_\\_\\_\\_\\_\\_\\_ 是一种特定类型的 SIS，旨在最大限度地减轻特定紧急状况的后果。它们运行在预防安全层，旨在防止火灾、化学品泄漏或爆炸等危险事件的发生。\n\
