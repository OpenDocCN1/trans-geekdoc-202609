  \ DMZ。在 ICS/IT 网络中，DMZ 更可能位于何处？\n\n14.  ICS 网络工程师认为拥有安全无线网络技术的最大好处是什么？\n\n15.  将无线\
  \ ZigBee 设备网络连接到有线以太网网络（如组织的 LAN）需要哪种类型的网络设备？\n\n## 考试题\n\n1.  托管网络交换机可用于创建逻辑上安全的安全结构，通过限制网络数据包的移动来限制网络流量的可见性，使其仅在指定端口之间传递。这些结构称为\
