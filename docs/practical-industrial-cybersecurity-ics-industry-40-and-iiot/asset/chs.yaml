  \n我们感谢您对本书的意见和提问！请发送电子邮件至 `chuckb@marcraft.com`。\n\n# 第 1 章\n\n工业控制系统\n\n## 简介\n\
  \n总体而言，世界各地的人们越来越意识到涉及互联系统的交互如何影响他们的个人和财务安全。然而，我们往往不太清楚与关键工业加工和公用事业服务基础设施相关的安全问题如何涉及我们。这些关键基础设施部门包括以下内容：\n\
  \n*   工业加工\n    *   制造业\n    *   化工加工\n    *   农业\n*   公用事业服务\n    *   水务\n    *\
  \   电力\n    *   污水处理\n    *   石油和天然气\n    *   交通运输\n\n请考虑这两个部门中列出的领域，并思考如果这些关键基础设施部门中的任何一个因安全事件而严重受损或瘫痪，您的生活将受到多大影响。然后考虑到，这两个基础设施部门的大多数参与者都增加了网络技术的使用，以使其运营更加自动化、高效和富有成效。在此过程中，他们将运营暴露在了与个人和组织网络相关的相同类型的网络安全威胁之下。\n\
  \n虽然工业和公用事业组织的网络安全策略和实践似乎与企业网络安全相关的策略和实践相似，但在应用上却截然不同。受过企业网络安全培训的人员，如果被引入工业或公用事业网络环境，可能只会看到与他们熟悉的网络有着表面的相似性。\n\
  \n这并不是说 IT 网络与工业/公用事业网络环境之间没有可迁移的技能和知识集。事实上，当您阅读本书时，我们将把基本的组织 IT 网络信息与您需要了解的新信息相结合，以便您在工业/公用事业网络安全环境中取得成功。\n\
  \n## 基本过程控制系统\n\n所有工业生产和公用事业服务运营的基础都是自动化过程控制系统的实施。让我们首先检查与任何工业过程控制系统相关的基本要素。图 1.1\
  \ 以框图形式描绘了一个通用的自动化过程。\n\n![图 1.1 自动化过程的模块](img/c01f001.png)\n\n**图 1.1** 自动化过程的模块\n\
  \n在标有“过程”的模块中，存在某些变量，如温度、压力、流量、液位、转速或位置，这些变量需要被调节。任何可能自发或因外部影响而变化的物理参数都是 `动态变量`\
  \ (`dynamic variable`)。受控制器模块控制的 `动态变量` 更具体地称为 `过程变量` (`PV`)。\n\n过程控制的总体目标是使 `PV`\
  \ 保持在某个特定的预定值，该值称为 `设定点` (`SP`)。`SP` 可以是一个固定基准，例如安装在支柱上的简单液位传感器，也可以是一个可调基准，例如普通恒温器，用户可以在其中设置要维持的期望温度。\n\
  \n由于 `PV` 是动态的，整个控制系统必须不断采样变量的状态，将其与设定点进行比较，并应用任何必要的纠正措施，以使 `PV` 保持在期望的 `SP`。收集系统信息的设备统称为\
  \ `输入传感器` (`input transducers`) 或 `传感器` (`sensors`)。\n\n传感器的输出可以直接馈入控制器模块，也可以通过一个名为“变送器”的可选模块来实现。如果传感器距离控制器有一定距离，或者其输出与控制器的输入不兼容，则必须使用\
  \ `接口` (`interface`) 设备将传感器的输出信号转换为更适合传输或与控制设备兼容的信号。\n\n任何过程控制系统的核心是标有“控制器”的模块。控制器负责接收输入信息，将该信息与预定条件或基准进行比较，决定应采取什么行动，最后将纠正\
  \ `误差信号` (`error signals`) 发送给最终元件，以调节 `被操纵变量` (`manipulated variable`)。工业控制单元可能由磁继电器、数字集成电路集合、模拟电子电路、气动装置、微处理器或这些设备的某些组合组成。\n\
  \n操作员设置和系统状态信息通过标题为“输入/输出”或“I/O”的模块进行输入和获取。`I/O` 模块可以是控制器的组成部分，也可以位于某个远程位置。`I/O`\
  \ 模块的一部分可能专门用于显示和控制机构，使人工操作员能够与控制系统进行交互。\n\n从控制器发出的纠正信号可以直接施加到 `执行器` (`actuator`)\
  \ 模块，也可以施加到一个可选的输出信号转换器，用于使控制器的输出信号与执行器兼容。执行器的任务是施加必要的纠正动作，以将过程变量调节到既定的设定点。典型的工业控制执行器包括电动机启动器、气动阀或电磁阀等设备。\n\
  \n为了理解这些元素如何协同工作以提供过程控制，请考虑图 1.2 中描绘的简单温度控制系统。该示例描述了一个采用液体填充感应装置、一组简单的电气触点和一个电动电磁燃气阀的控制系统。\n\
  \n![图 1.2 简单的温度控制系统](img/c01f002.png)\n\n**图 1.2** 简单的温度控制系统\n\n在图 1.2 的示例中，`PV`（液体温度）由密封球和毛细管中的流体持续监测。随着外壳内温度升高，球和管中的流体膨胀，导致其压向管端的隔膜。隔膜的运动反过来推动一对电气触点中的一个，使其向另一个触点靠近。\n\
  \n\n\n\n当外壳内的温度达到由传感器流体的膨胀系数和开关触点间距确定的预定水平时，触点将闭合，形成一个电路来激活电磁控制阀。阀中的电磁铁产生电磁场，将阀杆向上拉起，切断流向外壳内加热元件（最终元件）的气体（被操纵变量）流动。\n\
  \n热源的移除将导致外壳内温度下降，直到感温包收缩并将隔膜从开关触点处拉离。当这种情况发生时，触点将断开，切断流向电磁阀的电流。阀门将打开，气体将再次流入加热元件，导致温度再次升高。\n\
  \n### 闭环控制系统\n\n这种简单的温度控制系统是一种称为**闭环**控制的过程控制类型。正如图 1.3 所示的框图，存在一条从过程输出（外壳温度）反馈到控制器（隔膜和开关触点）的**反馈**路径，控制器随后对过程输入（气动燃气阀和燃烧器）施加适当的纠正动作。\n\
  \n![图 1.3 闭环过程模块](img/c01f003.png)\n\n**图 1.3** 闭环过程模块\n\n通过控制器的反馈回路使闭环系统能够自我调节。控制器检查测量的过程变量并将其与设定点参考值进行比较（在前面的例子中，参考点是固定开关触点的位置）。然后根据比较结果产生误差响应。\n\
  \n通常，如果过程变量值高于参考值，将产生正向动作，例如向加热元件施加更多燃气。相反，如果过程变量值等于或低于参考值，控制器将产生负向纠正动作，例如切断流向加热元件的燃气流。\n\
  \n在图 1.3 的示例中，过程控制模式仅为开/关：阀门要么完全打开，要么完全关闭。然而，如果采用模拟输出设备和输入传感器，且控制器是智能的（具有先进的决策能力，如基于微处理器的控制器），闭环系统可以构建和配置为提供平滑、精确和灵敏的控制响应。这些系统是所有自动化过程控制系统的基础。\n\
  \n### 工业过程控制器\n\n如前所述，任何过程控制系统的核心是其控制器。历史上，过程控制器基于多种不同技术，包括机械装置、气动装置、模拟电子、离散数字电子或基于微处理器的计算机电子技术。然而，目前大多数过程控制器都是基于某种类型的基于微处理器的计算机控制技术构建的。\n\
  \n虽然**工业过程控制器**（`IPCs`）与为**信息技术**（`IT`）行业设计的基于微处理器的计算设备（个人电脑和网络服务器）共享许多特性，但它们在许多方面截然不同。与\
  \ IT 计算机不同，工业过程控制器不是设计用于存储数据并稍后处理。相反，它们根据内部配置或编程，基于输入的当前状态产生输出条件。\n\n以下是工业过程控制器的关键要求：\n\
  \n*   **可用性**：许多过程是连续操作，要求控制器具有高可用性、可靠性和可维护性评级。可用性通常是工业控制系统中的最高目标，与数据完整性并列。机密性传统上是过程控制系统的次要关注点；这与与\
  \ IT 系统相关的通用机密性、完整性和可用性（`CIA`）要求完全相反。\n\n*   **及时性**：过程控制是一种时间敏感型操作，要求快速响应时间。IT\
  \ 系统通常没有及时性约束。因此，一线智能过程控制器在实时操作系统上运行。\n\n*   **工业接口**：工业控制器通常提供极少甚至没有用户友好的界面功能，如键盘、指点设备或\
  \ LCD 显示器。相反，它们提供工业风格的输入和输出端口，用于连接传感器和执行器。\n\n*   **物理加固**：`IPCs` 设计用于在恶劣环境中运行，如工业工厂和露天场所。\n\
  \n#### 现场设备\n\n设计为部署在靠近被控制过程附近的工业控制器（相对于更常规地放置在办公室或控制室环境中的监控计算设备）称为**现场设备**。这些是在工业和公用事业过程控制系统中遇到的最常见现场设备：\n\
  \n*   可编程逻辑控制器（`PLCs`）\n*   远程遥测单元（`RTUs`）\n*   智能电子设备（`IEDs`）\n\n在专用控制系统中，现场设备位于从物理过程收集信息的传感器和向物理过程提供纠正动作的执行器之间。然而，在分布式控制系统中，现场设备在逻辑上位于传感器和执行器与具有其人机界面的监控系统之间。图\
  \ 1.4 展示了现场设备在工业控制系统中的典型实现方式。\n\n![图 1.4 现场设备实现](img/c01f004.png)\n\n**图 1.4** 现场设备实现\n\
  \n#### 可编程逻辑控制器\n\n现代工业处理和公用事业环境中首选的本地控制设备是**可编程逻辑控制器**，或 `PLC`。`PLCs` 是专门设计用于执行工业控制功能的智能数字计算设备，例如开启和关闭阀门、开关和继电器以控制过程。\n\
  \n在内部，如图 1.5 所示的 `PLCs` 与 IT 计算设备共享其大部分技术。它们包含微处理器、`RAM` 内存、只读固件和操作系统。然而，相似之处到此为止。\n\
  \n![图 1.5 典型 PLC](img/c01f005.png)\n\n**图 1.5** 典型 PLC\n\n因为它们是智能的，`PLC` 的操作可以通过用新指令重新编程来简单地改变。`PLCs`\
  \ 使用一种类似于**继电器梯形逻辑**的编程方法（因为 `PLCs` 最初是设计用来取代在数字处理器开发之前广泛使用的继电器控制器的）。这些图表将在第 2 章“ICS\
  \ 架构”中讨论。较新的 `PLCs` 可以通过多种不同方式编程，包括流行的计算机编程语言。\n\n编程可以下载或直接输入到 `PLC` 的可编程 `RAM`\
  \ 区域。`PLC` 指令集可用于实现特定控制功能，如计数和定时循环；三模式比例、积分、微分（`PID`）控制；算术运算；和 `I/O` 控制。编程可以通过安装在本地主机计算机上的编程界面来完成。\n\
  \n\n\n\n### PLC 输入与输出\n\nPLC 输入端连接传感器——温度、压力或位置开关——用于监测工艺变量。在等式的另一端，PLC 的输出端子连接执行器——继电器、电磁阀或机械定位器——这些是用于控制工艺变量的设备，如图\
  \ 1.6 所示。\n\n该图描绘了 PLC 及其传感器和执行器的`点对点布线`方案。它还表明，PLC 与其设备之间的单独连接可通过遍布生产车间的布线架和接线盒来实现。然而，每个设备均通过一根专用电缆连接到输入或输出端子。\n\
  \nPLC 有不同的外形规格，包括紧凑型设备和通过`背板`系统连接并安装在公共`机架`中的模块化单元。图 1.7 描绘了一款典型的紧凑型 PLC。它是一个独立的处理单元，其顶部边缘提供输入端子，底部边缘提供输出端子，左下角提供电源连接。该图还展示了该\
  \ PLC 型号通过其串行通信端子以及传统的以太网网络连接，与其他设备连接的预留接口。\n\n![FIGURE 1.6 PLC controlling a process](img/c01f006.png)\n\
  \n**图 1.6** PLC 控制工艺过程\n\n![FIGURE 1.7 A typical compact PLC](img/c01f007.png)\n\
  \n**图 1.7** 典型的紧凑型 PLC\n\n模块化外形规格的 PLC 提供灵活的输入输出配置，因为可以向背板添加多个输入或输出模块。图 1.8 展示了典型的\
  \ PLC 机架和背板。背板是一块印刷电路板，提供公共数据总线和一系列插槽连接器，用于将不同模块连接到系统。其中一个插槽连接器预留给电源模块。其他插槽连接器（本例中有八个）设计用于接受\
  \ CPU 模块和不同类型的 I/O 模块。\n\n![FIGURE 1.8 Modular PLC rack and backplane](img/c01f008.png)\n\
  \n**图 1.8** 模块化 PLC 机架和背板\n\n## 常见 PLC 模块类型\n\n常见的 PLC 模块类型包括以下几种：\n\n*   **电源单元\
  \ (PSU) 模块**：该单元通过背板总线为 CPU 和 I/O 模块供电。PLC 电源通常为其组件提供 24Vac 电压。\n*   **中央处理单元 (CPU)\
  \ 模块**：这是相当于个人计算机主板的 PLC 核心部件。它包含微处理器、RAM 和 ROM 存储器、I/O 接口电路以及通信支持。\n*   **输入模块**：可安装在\
  \ PLC 机架中的输入模块有两种基本类型：模拟量输入模块和数字量输入模块。\n    *   **模拟量输入**：模拟量输入模块设计用于配合传感设备（如热电偶和压力传感器）工作，这些设备在最小值和最大值之间产生连续变化的输出值范围（如\
  \ 0–10V）。由于基于微处理器的控制设备无法理解模拟信号，因此模块必须对信号执行 A/D 转换过程，以获得 CPU 可处理的测量模拟值的数字等效值。\n \
  \   *   **数字量输入**：此类模块用于处理离散的数字量输入设备，如行程开关、光电开关、接近开关，以及任何提供两态输出的其他设备。这些模块可处理从 8\
  \ 个设备多达 128 个设备。\n*   **输出模块**：与输入模块一样，输出模块也有两种基本类型：模拟量和数字量。\n    *   **模拟量输出**：这些输出提供模拟信号，可用于驱动模拟执行器，如阀门定位器。为了产生此类输出信号，模块必须在从\
  \ CPU 接收到的数值上执行 D/A 转换过程，然后才能将其应用于输出端子。\n    *   **数字量输出**：这些模块提供开/关输出信号，用于控制两位置执行器。与数字量输入模块一样，数字量输出模块可提供从\
  \ 8 到 128 个不同的输出连接。\n*   **通信模块**：这些是允许 CPU 通过背板的 I/O 总线与其他智能设备通信的通信模块。历史上，这一直通过标准异步串行通信协议（如\
  \ RS-232 和 RS-485 通道）来完成。然而，更新的工业通信选项正被引入 PLC 通信中，包括不同的 IT 和电话协议，如基于以太网的 TCP/IP\
  \ 通信、蓝牙和 Zigbee。\n\n## 远程遥测单元\n\n另一种常见的工业控制器是`远程遥测单元`，通常简称为 `RTU`。RTU 是部署在工艺过程或一组工艺过程中的选定位置的小型智能控制单元，用于从不同传感器收集数据并发送命令以控制继电器输出。图\
  \ 1.9 展示了一款典型的 RTU。\n\n![FIGURE 1.9 An RTU controller](img/c01f009.png)\n\n**图 1.9**\
  \ RTU 控制器\n\n与 PLC 一样，RTU 可以使用数字或模拟量输入传感器设备，旨在测量电流和电压、压力、光照度、流速、液位、浊度、pH 值、旋转速度等变量。模拟量输入接受给定范围内来自传感器的输入信号。常见的模拟量输入信号范围包括\
  \ 0 到 1mA 或 4 到 20mA 电流范围，或 0 到 10Vdc 电压范围，以及 +/-2.5V 或 +/-5.0V 范围。对于产生超出这些参数信号范围的传感器类型，必须在传感器和输入端口之间安装某种信号电平转换接口设备。这些行业标准的信号传输方法和范围由不同的设备制造商根据不同应用中使用的传感器进行选择。\n\
  \n电压信号传输用于许多传感器应用，因为它的实现相对简单。然而，电压信号传输易受电气噪声干扰和传输距离限制的影响。电流信号标准历史上一直是传输传感器信息的公认方法，因为其响应比电压信号方法更线性，且提供更强的抗噪能力。\n\
  \n虽然曾出现过不同的电流环标准，但 4 到 20 mA DC 电流标准一直是工业传感器市场的首选标准。该标准提供线性信号响应、良好的抗噪能力、更长的传输距离，以及对人员和危险环境条件的本质安全性。\n\
  \nRTU 还可以提供模拟量和数字量输出，以配合各种不同的控制设备工作。然而，模拟量输出在 RTU 中不常用。数字量输出根据管理工艺的需要，为电路、电磁阀、灯、加热器等执行器提供开/关控制。确实提供模拟量输出通道的\
  \ RTU 可用于对阀门定位器和加热元件等设备提供连续变化的控制。\n\n与 PLC 不同，RTU 并非设计为独立控制器。相反，它们更适合广泛分布式控制系统中的操作。虽然它们拥有内部存储器并能控制局部活动，但它们设计用于在分布式或基于\
  \ SCADA 的控制系统中与监控控制器协同工作。不过，它们也可以接收来自本地 IED 控制器的工艺数据。\n\n\n\n\n与监控控制器和 IED 控制器的通信是使用标准通信介质和协议进行的。这些包括\
  \ `RS-232` 和 `RS-485` 串行连接以及以太网网络连接。`Modbus` 是与 RTU 通信的主流协议。\n\n图 1.10 说明了典型的 RTU\
  \ 实现。在该示例中，多个 RTU 参与控制分布式过程的不同部分。与前面的 PLC 示例一样，RTU 在远程监控控制器的指导下维持本地控制。\n\n![FIGURE\
  \ 1.10 A typical RTU implementation](img/c01f010.png)\n\n**图 1.10** 典型的 RTU 实现\n\
  \n### 智能电子设备\n\n在电力生成和配电环境中，第三种类型的智能过程控制器正变得越来越普遍——*智能电子设备*，或 *IED*。这些控制器是 RTU 的一种形式，旨在直接与监控控制器提供保护、控制、监视和通信。这些设备为监视和控制过程中的不同传感器和执行器提供了直接接口，并且可以直接与监控控制器、本地\
  \ RTU 或其他 IED 通信。\n\n与 RTU 一样，IED 通常具有存放控制本地过程编程的小型存储单元，因此它们可以在没有来自监控控制器的直接或持续指令的情况下运行；但是，它们并非设计用于接管过程的完全控制。常见的\
  \ IED 应用包括智能保护继电器、数字故障记录仪、功率/电流/电压表以及 RTU 功能。\n\n### 分布式控制系统\n\n当过程对于单个控制器而言过于复杂，或者其组件在地理上是分离的，就有必要将控制功能分配到多个控制器上，以形成*分布式控制系统*\
  \ *(DCS)*。\n\n图 1.11 显示了一个被分割为三个离散子部分或*过程单元*的过程，每个单元都有自己的本地控制器。单元过程被定义为生产系统中可被定义并与系统的其他单元过程分离的一组操作。每个过程单元由与该过程单元设计执行的任务相关联的一组特定输入和输出定义。即使过程控制功能已分布在多个控制器上，控制系统仍不完整。在该示例中，有三个不同的设备对连续过程的各自段应用控制功能，而不考虑其他段中发生的活动。\n\
  \n![FIGURE 1.11 Distributed controllers](img/c01f011.png)\n\n**图 1.11** 分布式控制器\n\
  \n### 现场总线\n\n为了高效控制整个过程，必须向控制系统添加某种额外的控制方法，以协调这三个本地控制器的活动。最基本的方法是将控制器互连，然后将其中一个设为*主控制器*，如图\
  \ 1.12 所示。控制器通过*现场总线*在物理上连接在一起，并通过工业通信协议在逻辑上连接。这些总线上使用的协议包括在第 2 章工业网络协议一节中详细描述的\
  \ `Modbus` 和 `DNP3` 协议。\n\n![FIGURE 1.12 A master controller configuration](img/c01f012.png)\n\
  \n**图 1.12** 主控制器配置\n\n现场总线可以是工业控制组织设计的多种专有仪表总线中的任意一种，旨在为智能控制设备之间提供通信和协调。这些总线也可用于将智能\
  \ IED 传感器和执行器连接到控制器，并消除从每个过程单元的控制器到其传感器和执行器构建*点对点布线*束的需求。*\n\n### 监控控制器\n\n在分布式过程操作中，高效控制多个过程单元的另一种常用方法是向\
  \ ICS 添加*监控控制器*，如图 1.13 所示。在此配置中，监控控制器被编程为监视每个本地现场控制设备的运行，并根据需要向每个控制器发送协调指令。在这样的系统中，监控控制器不直接控制不同的过程单元；它仅监督和协调其本地控制器的操作。\n\
  \n![FIGURE 1.13 Adding a supervisory controller](img/c01f013.png)\n\n**图 1.13**\
  \ 添加监控控制器\n\n这种布局代表了一个典型的 DCS，可用于高效控制复杂或广泛分布的过程。与前面的示例一样，该分布式 ICS 中的控制器可以通过多种现场总线类型中的任意一种互连。\n\
  \n这种分布式智能模型优化了所有控制设备的计算能力，以执行、控制、管理和保护完整的过程。本地控制器通常是直接连接到用于监视和控制其所负责的整体过程部分的输入和输出设备的智能设备。\n\
  \n大多数工业过程控制场景需要高速、实时数据采集和控制功能，以维持对过程的适当控制。这与通常应用于企业计算设备的要求截然不同，后者通常不需要实时处理数据。\n\n\
  由于监控控制器不直接参与控制过程的细节，因此无需针对速度进行优化。这些控制器通常是运行监控和数据采集软件应用程序的普通独立计算机或工业服务器。\n\n本地现场控制器的存在使得更多特定任务的智能处理能够在靠近过程的本地执行，而监控控制器则通过某种类型的行业标准通信通道为这些设备提供协调与配合。\n\
  \n除了与现场级控制器接口外，监控计算机通常还为参与过程的人工操作员提供交互式可视控制面板，如图 1.14 所示。该控制面板被称为*人机接口* *(MMI)*\
  \ 或*人机界面* *(HMI)*。界面的交互部分为人工操作员提供屏幕工具，以调整或覆盖他们看到或感觉到的未按预期发生的控制动作。\n\n![FIGURE 1.14\
  \ Providing the HMI](img/c01f014.png)\n\n**图 1.14** 提供 HMI\n\n### 其他 ICS 总线\n\n\
  正如您在之前的插图中所见，除了连接到现场总线外，控制器还可以连接到一个将其与两个标准 OT 网络组件相连的局域网。\n\n*   *工程工作站*：此计算设备用于为当前操作编程现场设备。\n\
  *   *数据历史服务器*：此设备包含一个数据库，用于收集和存储过程值以供检查和处理。\n\n\n\n这些单元通过一个称为**本地控制回路**的独立局域网（LAN）与控制器互连。图\
  \ 1.15 描绘了一个带有本地控制网络回路的典型 ICS。这种类型的网络回路通常以基于 TCP/IP 的以太网网段形式实现。在 ICS 环境中，通常将此网段称为**运营技术（OT）网络**，以将其与组织的\
  \ IT 网络区分开来。\n\n![图 1.15 添加监控网络回路](img/c01f015.png)\n\n**图 1.15 添加监控网络回路**\n\n根据\
  \ ICS 的复杂程度，网络可能被划分为多个控制段或回路，如图 1.16 所示。在此示例中，完整的网络结构由四个不同的网段和类型组成，如下所示：\n\n*  \
  \ **现场总线回路**：该回路提供本地现场设备与传感器及执行器之间的直接交互。现场总线常用于将 PLC 连接到各种输入传感器和输出执行器。它还可以连接到一个单独的人机界面控制台，用于显示工艺活动及其各种传感器的状态。\n\
  *   **本地控制/监控回路**：该回路提供本地现场设备与分布式控制系统组件（数据历史服务器、工程师站、HMI 和监控计算机）之间的直接交互。\n*   **组织的局域网**：该回路提供组织\
  \ IT 网络与其 ICS 网络之间的连接。此连接代表组织 ICS 之外的一条路径，使网络面临组织内部非 ICS 人员可能的操纵风险。\n*   **组织的 IT\
  \ 网络**：该回路提供组织本地 IT 网络与其广域网连接之间的连接。它还在 ICS 与组织外部人员可能的操纵世界之间提供了一条路径。\n\n![图 1.16\
  \ 多个 ICS 网络回路](img/c01f016.png)\n\n**图 1.16 多个 ICS 网络回路**\n\n网关设备用于在不同网络类型之间进行转换，例如特定的现场总线类型与基于\
  \ TCP/IP 的以太网网络。例如，前一个示例中将现场总线和本地控制 LAN 连接在一起的连接，必须在每个网段所基于的物理和逻辑协议之间进行转换。\n\n###\
  \ 以太网 I/O 模块\n\nICS 网络的现场总线和本地控制网络部分历史上一直通过异步串行网络拓扑实现，例如标准 RS-232 和 RS-485 串行总线连接。然而，工业控制领域已逐渐接受采用**以太网/IP\
  \ 802.x 标准套件**进行控制和数据通信。这在工业控制环境中变得越来越流行。\n\n自 1990 年代以来，以太网一直是 IT 网络的连接标准。它采用物理星型拓扑（集线器和辐射条），尽管实际运行为逻辑总线拓扑。完整的以太网标准套件可在多种不同介质类型上运行，包括双绞铜缆、光纤和无线\
  \ Wi-Fi 信道。\n\n图 1.17 显示了标准硬连线以太网连接的物理连接。此连接使用双绞铜数据电缆，终端为 8P8C 模块化插头和插座（有时错误地称为\
  \ RJ-45）。在工业环境中，这些连接按照 TIA/EIA-568-BC 标准布线。\n\n![图 1.17 以太网连接](img/c01f017.png)\n\
  \n**图 1.17 以太网连接**\n\n采用以太网/IP 技术及相关技术促使组织企业网络与其工业控制网络对应部分融合。随着网络的两个部分集成为一个统一的数据通信载体，组织能够将实时生产数据应用于业务决策。\n\
  \n用于将 PLC 连接到以太网的模块历史上一直是独立的网络接口适配器，涉及 PLC 与以太网适配器之间的 RS-485 连接以及与网络其余部分的以太网连接。然而，较新的\
  \ PLC 型号包含内置以太网接口。图 1.18 说明了这两种方法的区别。\n\n![图 1.18 PLC 以太网连接](img/c01f018.png)\n\n\
  **图 1.18 PLC 以太网连接**\n\n### 监控与数据采集系统\n\n在某些过程中（如输油管道控制操作），工艺的不同控制组件可能相隔很远。在这种情况下，本地控制器必须通过无线电、电话、卫星或广域网等长距离通信技术连接到监控控制器。\n\
  \n顾名思义，**监控与数据采集（SCADA）系统**是一种分布式控制系统，提供两个不同的功能：数据采集（输入）和监控功能（输出）。正如您本章前面所见，PLC、RTU\
  \ 或 IED 通常提供对其监控过程的本地控制。然而，它们还会打包**采集的数据**，并通过某种工业通信链路或网络连接将其传输到监控系统。\n\n由于工业过程实时运行，分布式控制系统中各个本地控制器的操作必须相互同步。SCADA\
  \ 控制器负责提供公共时钟信号，以协调不同控制器的动作。\n\nSCADA 系统的**监控**部分监控从其本地控制设备接收的数据，并存储信息以供处理、分析和/或响应。SCADA\
  \ 系统的响应通常保留用于执行监控干预或响应工艺中的报警条件（如电机过热、传感器读数超范围或冷却系统故障）。SCADA 系统还提供 HMI 界面，使人工操作员能够监控并直接控制过程控制系统。\n\
  \n从物理上讲，SCADA 系统是运行在某种计算机平台上的工业软件应用。这些单元称为**SCADA 服务器**或**SCADA 主站**。SCADA 主站传统上使用行业标准\
  \ ICS 协议和现场总线与其本地控制设备通信。这种布局如图 1.19 所示。\n\n![图 1.19 将 ICS 网段添加到网络](img/c01f019.png)\n\
  \n**图 1.19 将 ICS 网段添加到网络**\n\nSCADA 服务器也能在组织的企业网络中运行。这是通过在标准 IT 网络基础设施上运行标准 IT 网络协议来实现的。\n\
  \n该软件应用的一部分是一个数据库管理系统，它以称为**标签**的控制点形式存储历史数据。标签基本由两个元素组成：一个数据点和一个时间戳。有了这两条信息，SCADA\
  \ 系统可以生成用于图形显示或审计目的的跟踪和趋势数据。此数据库称为**历史服务器**。\n\n\n\n\n## SCADA 软件与系统遥测\n\nSCADA\
  \ 软件为流程中运行的所有 PLC 提供监管角色。它还提供 HMI，使人工操作员能够观察不同流程的运行参数，并接管流程以更改参数或进行修正。\n\n随着时间的推移，SCADA\
  \ 系统已从组织办公室的大型主机（第一代），迁移到通过局域网联网在一起的独立任务计算机（第二代），再到联网的广域 SCADA 系统（第三代），现在则是基于云的工业物联网（IIoT）SCADA\
  \ 系统（第四代和当前一代）。\n\n### 系统遥测\n\n如前所述，`telemetry`（遥测）是利用传感器在远程位置收集信息并将其传输到另一位置进行处理的过程。这是广泛分布式控制系统的先决条件。许多行业（航空公司、水务、燃气、石油、电力传输和配电）要求通过广泛分布式控制系统来协调地理位置分离的地点的运行。\n\
  \n图 1.20 说明了一个广泛分布式控制系统，其中三个远程现场站点的控制器正在监控和控制配电流程的三个不同部分。使用现代数据通信链路，这些控制器可以物理上位于远离工艺区域的隔离环境中。\n\
  \n![FIGURE 1.20 ICS telemetry systems](img/c01f020.png)\n\n**图 1.20** ICS 遥测系统\n\
  \n在本例中，远程定位的 SCADA 控制器使用不同的长距离通信链路连接到每个现场站点。站点 1 通过无线射频通信链路连接到控制中心，而站点 2 采用卫星链路，站点\
  \ 3 使用广域网（`WAN`）连接。\n\n工业和公用事业网络还采用不同的无线通信协议，在其整个流程中传输数据和遥测信息。特别是 `WiMax` 和 `Zigbee`\
  \ 无线协议已在工业控制网络中取得了显著进展，尤其是在电力公用事业网络环境中。\n\n`Zigbee`（`IEEE 802.15.4`）标准是一种无线、网状组网的个人区域网络（`PAN`）协议，如图\
  \ 1.21 所示，它提供 10 米的通信范围，数据传输速率为 250 Kbps。`Zigbee` 标准已被智能家居自动化和工业控制社区以及智能电网联盟的几个领域所采用。\n\
  \n![FIGURE 1.21 Zigbee PAN](img/c01f021.png)\n\n**图 1.21** Zigbee PAN\n\n![FIGURE\
  \ 1.22 A WiMAX network](img/c01f022.png)\n\n**图 1.22** WiMAX 网络\n\n`IEEE 802.16`\
  \ – `WiMAX` 规范的建立是为了为更广泛区域的无线联网能力提供指导原则。`WiMAX` 是一种宽带无线接入标准，旨在跨大型地理区域（如城市、县，在某些情况下甚至是国家）提供互联网接入，如图\
  \ 1.22 所示。它还旨在提供与 `802.11x` Wi-Fi 标准的互操作性。\n\n### 公用事业网络\n\n几乎所有公用事业组织都依赖 `wide\
  \ area networks`（广域网）来优化其运营效率。图 1.23 说明了这一点，该图描绘了一个典型电力公用事业的 `smart grid`（智能电网）网络基础设施，横跨四种不同的网络类型——两个广域网和两个局域网：\n\
  \n*   发电控制网络（专用工业控制网络）\n*   输电/配电控制网络（广泛分布式工业控制网络）\n*   客户（电表）数据采集网络（广域网）\n*   主公用事业的数据管理网络（内部企业网络的一部分）\n\
  \n![FIGURE 1.23 A utility network system](img/c01f023.png)\n\n**图 1.23** 公用事业网络系统\n\
  \n遥测最重要的方面之一是 `metering`（计量/抄表）。计量装置或电表是一种端点传感器，用于测量和记录物质的数量（采集数据）。任何公用事业电表的主要功能是测量客户用量——电力、水、燃气、石油等。\n\
  \n公用事业的客户（电表）数据采集系统通过前面提到的智能电表，收集连接到其输配电系统的每个客户的用量信息。这些计量网络设备通常配置为执行以下操作：\n\n* \
  \  与用户 `home area network (HAN)`（家庭区域网络）中的其他智能电网组件通信\n*   向 `HAN` 成员提供当前成本信息\n*\
  \   向 `HAN` 成员提供当前的 `time-of-use (TOU)`（分时计价）信息\n*   跨 `WAN` 与主公用事业通信\n*   打包客户数据以传输给主公用事业\n\
  *   与主公用事业的 `meter data management (MDM)`（电表数据管理）系统交互\n\n图 1.24 显示了一个典型的 `advanced\
  \ metering infrastructure`（`AMI`，高级计量基础设施）无线网状网络架构，用于提供整个计量网络的通信。这些网络旨在提供可靠性、冗余和带宽，同时仍满足电力公用事业的预算要求。此外，它们必须使几种不同类型的设备能够相互通信。\n\
  \n![FIGURE 1.24 AMI mesh architecture](img/c01f024.png)\n\n**图 1.24** AMI 网状架构\n\
  \n此示例描绘了通过两个聚合器和一个采集器联网在一起的三个不同区域。在居民区，智能电表以邻域网络（`NAN`）网状拓扑连接，并相互通信（电表到电表）、与聚合器通信（电表到聚合器），以及直接与采集器通信（电表到采集器）。\n\
  \n聚合器直接与采集器通信（聚合器到采集器）。还请注意，工业和大型商业客户直接连接到采集器。采集器负责与所有网状网络通信，以处理本节前面列出的所有功能。此外，它必须具备通信和计算能力，为成千上万个电表执行此操作。与这些网络及其设备相关的安全问题将在第\
  \ 4 章“ICS 模块和要素加固”中介绍。\n\n### OT/IT 网络集成\n\n历史上，工业生产组织将其网络作为两个独立实体运行：企业（`IT`）网络和过程控制（`OT`）网络，如图\
  \ 1.25 所示。`IT` 网络旨在处理和存储业务数据，而 `OT` 网络旨在控制生产产品和产生收入的流程。通常，会付出巨大努力来最小化这两个网络之间的交互点。\n\
  \n![FIGURE 1.25 Industrial networks](img/c01f025.png)\n\n**图 1.25** 工业网络\n\n然而，在许多组织中，监控控制器已作为一个单独的网段添加到其现有的企业网络结构中，如图\
  \ 1.26 所示。这种连接允许其他业务运营与公司的生产部门进行接口。然而，它也在两个网络之间创建了一条访问路径，使 `ICS` 暴露于通常与 `IT` 网络相关的新威胁之下。正如您将在第\
  \ 3 章“安全 ICS 架构”中看到的更多细节，此类网络的工业控制部分应与组织的企业网络隔离或进行严格分段。\n\n\n\n\n## 工业安全与防护系统\n\n\
  工业生产和公用事业环境往往比企业网络环境更具内在危险性。基本上，如果文字处理器崩溃或被攻破，用户可能会感到沮丧，并且很可能需要大量重新输入来恢复丢失的信息。然而，如果工业控制过程被攻破，组织可能会遭受生产力损失、盈利能力下降、设备损坏、社区部分区域受影响，甚至更严重的后果。\n\
  \n以 图 1.2 中描述并由 图 1.28 表示的简单液体加热过程为例。虽然该过程已配备 `process control system`（过程控制系统）来控制罐内流体的温度，但如果该系统的任何部分发生故障或失效，都可能出现多种潜在危险状况。因此，这些危险成为风险分析过程的一部分，使其区别于针对企业环境执行的风险评估。\n\
  \n![图 1.28 简单加热过程再探讨](img/c01f028.png)\n\n**图 1.28 简单加热过程再探讪**\n\n对该过程的快速检查显示存在多种潜在危险：\n\
  \n*   罐体采用燃气供热系统加热。\n*   罐内装有正在被加热的液体。\n*   温度传感器、控制器和电磁阀均代表单点故障。\n\n所描绘的过程控制系统除单个电磁阀外，未对燃气进行监控或控制。因此，燃气加热系统代表了多种潜在的爆炸条件，因为系统中的任何泄漏都会提供不受控制的点火机会。\n\
  \n例如，如果罐体 `outside the tank`（外部）的燃气管道发生泄漏，燃气将逸出管道并填充泄漏处周围的空间。如果在燃气聚集区域引入点火源，将发生爆炸。此外，未点燃的燃气与工作人员呼吸的空气混合后，也可能成为该区域工作人员的危害源。\n\
  \n同样也没有对罐内燃气状况进行监控的措施。如果燃烧器的火焰熄灭，该系统仍会向燃烧器供气。这将导致燃气在罐内积聚，如果燃烧器重新点火或人员打开罐体检查燃烧器系统，将构成可能的不受控制燃烧危险。\n\
  \n罐内被加热的液体也可能成为不受控制爆炸的源头。随着液体加热，其分子获得能量，运动加快，间距增大（液体膨胀）。在某一时刻，它将从液态变为气态。当这种情况发生时，罐内压力增加。如果不排放，压力最终可能增加到导致罐体破裂——甚至剧烈破裂的程度。所描绘的过程控制系统没有监控罐内液体量或状况的措施。\n\
  \n过程控制系统的许多设备都是执行特定功能的唯一设备，这一事实使它们都成为潜在的问题源头。例如，如果温度传感器因任何原因失效，控制器将无法接收到正确控制过程所需的反馈信号。如果传感器失效导致控制器认为温度低于其设定点，它将继续向燃烧器供气，导致前面描述的相同危险状况。\n\
  \n如果控制器失效，执行器将无法接收控制燃气流量和加热过程所需的误差修正信号。根据故障性质和最终控制元件的设计，罐体可能会被允许过热，从而产生前面描述的潜在爆炸危险。理想情况下，系统的设计应使任何故障都导致最终控制元件\
  \ `fail safe`（故障安全/失效保护）（关闭通往燃烧器的燃气流量）。\n\n正如你所见，即使是此处展示的这种简单过程，也会对设备、人员和生产力构成多重潜在威胁。因此，必须在基本过程控制系统的基础上增加工业安全系统，以缓解这些担忧所指明的风险。这一概念将在\
  \ 第 10 章 \"ICS Security Monitoring and Incident Response\"（ICS 安全监控与事件响应）中详细讨论。本章剩余部分将用于介绍安全仪表系统并讨论常见的安全与防护子系统。\n\
  \n### 安全仪表系统\n\n`Safety instrument systems`（`SISs`，安全仪表系统）基本上是专门设计用于监控和控制过程中已被定义为不安全或潜在不安全条件的自动化过程控制系统。SIS\
  \ 通常作为整体 ICS 包的组成部分而创建（但不是相同的组件）。当过程控制系统失效时，SIS 必须能够成功执行其功能。这两个系统合称为 `integrated\
  \ control and safety system`（`ICSS`，集成控制与安全系统）。\n\n与 ICS 一样，SIS 由传感器、控制器和执行器组成。SIS\
  \ 的功能及其程度是通过作为 `process hazard analysis`（`PHA`，过程危险分析）过程一部分的正式 `hazard and operability`（`HAZOP`，危险与可操作性）研究来确定的，该过程是每个工业过程都需要的。此过程用于识别需要\
  \ `safety instrumented functions`（`SIFs`，安全仪表功能）来缓解的危险场景。IEC 61508、61511 和 ANSI/ISA\
  \ 84 标准将 SIF 定义为“具有特定 `Safety Integrity Level`（`SIL`，安全完整性等级）的安全功能，这是实现功能安全所必需的。”这一过程也将在\
  \ 第 10 章 中详细讨论。\n\n\n\n## 安全仪表系统设计与实施\n\n各种由 HAZOP 识别的 SIF 被汇总在一起，以设计和实施完整的 SIS。每个\
  \ SIF 的 SIL 可以定义为安全仪表功能提供的定义风险降低量，或者定义为 SIF 的可靠性等级。共有四个离散的 SIL 等级：\n\n*   **SIL\
  \ 1**：最低的相关安全等级/系统无法正常执行的最高概率。\n*   **SIL 2**：相关安全等级提高/无法正常执行的概率降低。这些系统通常比 SIL 1\
  \ 级系统更复杂，安装和维护成本也往往更高。\n*   **SIL 3**：可用的最高相关安全等级/无法正常执行的概率最低。由于该级别系统采购和维护成本高昂，当\
  \ HAZOP 结果指定此 SIL 级别时，许多组织会重新设计流程以适应较低等级的系统。\n*   **SIL 4**：最高的相关安全等级/系统无法正常执行的最低概率。然而，这些系统过于复杂且成本高昂，大多数过程工业难以安装和实施。任何需要\
  \ SIL 4 系统的流程都应被视为存在根本设计缺陷，并应重新设计。\n\n### SIS 设备\n\n安全传感器旨在监控生产环境的不同区域，以检测通过风险评估过程定义为不安全或危险的条件。\n\
  \n安全控制器负责获取传感器信息，并根据其设计和编程采取行动。安全控制器可编程为根据检测到的危险性质和缓解安全状况所需的保护等级，提供多种不同的响应：\n\n\
  *   **单元安全停车 (USD)**：USD 是对单个工艺或公用系统的停车，以防止设备在不安全状态下运行（超出工艺限值）。在此级别，安全控制系统关闭检测到安全状况的局部工艺。但是，它不会影响工厂中运行的其他工艺。\n\
  *   **工艺停车 (PSD)**：这种停车源于如果允许继续可能会降低产品质量的不良工艺条件。此级别的停车可能会停车并隔离相关工艺或设备，以防止该状况影响这些工艺，从而导致紧急停车状况。\n\
  *   **紧急停车 (ESD)**：ESD 源于工艺中检测到的更严重状况，威胁到工艺设备、人员、环境、工厂或社区。这种类型的停车通常源于与严重安全顾虑相关的条件，如失控的工艺变量。\n\
  *   **紧急泄压停车 (EDP)**：此级别的停车实际上是 ESD 的延伸，因为工艺及其相关设备和工艺的停车可能会因 ESD 导致一些不良状况（例如燃气管线或容器（如\
  \ 图 1.28 中的储罐) 内的压力积聚）。\n\nSIS 还采用执行器来控制或消除不安全状况。这些执行器必须经过设计和选择，以执行将限制或消除不安全状况引起的威胁的特定动作。SIS\
  \ 系统组件和操作的设计和选择特别关注其故障状态（发生故障时它们会做什么或如何响应）。有两种基本模式需要考虑：\n\n*   **本质安全** 是指设备或系统的设计使得在发生电源或组件故障时，受控工艺将保持在其安全状态（开或关）。例如，示例工艺中的燃气控制阀应选用本质安全型（失信号时移至关闭位置），即任何时候失去控制器信号都会关闭。这将确保在发生任何故障时，进入罐体的燃气流量被切断。\n\
  *   **故障安全锁定** 是指设备或系统的设计使得在发生电源或组件故障时，受控工艺将进入其最安全的状态。\n\n由于安全控制器主要是一种安全设备，其主要职责之一是在发生安全事件时提供适当的通知。当控制器从其安全传感器之一接收到有效输入信号时，它会根据其编程（以及所需的应急响应类型）评估呈现的条件，并在必要时向报警器（警笛或铃铛）发送适当的报警信号。它还可以激活任意数量的视觉指示器，如闪光灯、操作员面板灯或控制面板上的图标。\n\
  \n控制器还可以根据其编程与指定的安全和监督联系人（安全主管、监控服务或应急服务）进行通信。这些系统设计为在无人值守时做出反应。它们可以使用以下几种方法之一来实现这一点：\n\
  \n*   **拨号电话连接**：使用电话拨号器通过标准电话线提醒远程安全联系人存在危险状况。\n*   **蜂窝信道**：使用蜂窝信道向指定的安全或监督联系人发送预设的短信。\n\
  *   **基于 IP 的通知**：使用 IP 网络（如互联网）通知指定的安全和监督人员有关危险状况。\n\n### 冗余系统\n\n组件和系统**冗余** 是工业安全中最基本的实践之一。我们已经确定了本章介绍的简单工艺示例中代表**单点故障**\
  \ 的几个关键组件。SIS 由不同于过程控制系统的组件组成，原因在于当过程控制系统中的组件发生故障时，SIS 必须介入并接管控制。如果两个系统使用同一设备，则两个系统都会失效。\n\
  \n例如，为了解决本章前面确定的与工艺相关的危险，我们可以考虑向系统添加多个传感器：\n\n*   储罐外部的燃气检测传感器\n*   储罐内部的火焰检测传感器\n\
  *   储罐内部的压力传感器\n*   储罐内部的安全温度传感器\n\n在每种情况下，这些传感器相对于原始设计中的过程控制传感器都是冗余的。\n\n可添加到工艺中以缓解潜在危险的基本执行器包括：\n\
  \n*   电磁控制阀上游的手动关断阀\n*   手动阀和过程控制阀之间的安全关断阀\n*   储罐壳体上的安全泄压阀\n\n与拟议的安全传感器一样，这些额外的执行器相对于原始过程控制系统设计中的执行器也是冗余的。\n\
  \n### 紧急停车系统\n\n**紧急停车系统 (EMSs)** 是一种特定类型的 SIS，旨在最大限度地减少某些紧急状况的后果。它们在预防安全层运行，并采取行动防止火灾、化学品泄漏或爆炸等危险事件发生。作为系统，它们由\
  \ ESD 传感器、ESD 控制器和 ESD 执行器组成。\n\n回到我们的过程控制示例，我们可以构建一个简单的 ESD 方框图，该图可用于执行停车程序。任何紧急情况的首要考虑因素都是切断燃气供应。前面提供的冗余列表提供了两种实现此目的的选项——连接到\
  \ SIS 控制器的自动电磁阀和手动关断阀，如 图 1.29 所示。\n\n\n\n\n\n![FIGURE 1.29 Adding an ESD system](img/c01f029.png)\n\
  \n**FIGURE 1.29** 添加 ESD 系统\n\n我们在快速分析中提到的另一个危险是，如果允许燃烧器持续加热液体，储罐内的压力可能会增加到危险水平。这最终会导致储罐以爆炸方式失效。为降低这种可能性，可在储罐壳体上安装压力释放阀。当控制器检测到故障时，会使阀门故障开启，通过向外部大气排放来释放储罐内的压力。\n\
  \n图 1.29 还展示了在原始过程控制系统中增加了冗余传感器和控制器。这些设备代表了工业过程安全仪表系统中常见的几种典型安全传感器。本章后续章节将介绍 GICSP\
  \ 认证目标中确定的具体安全系统。\n\n#### 火气系统\n\n*火气系统* *(FGSs)* 是 SIS 的一部分，运行在缓解安全层，旨在限制 ESD 事件的后果。它们在\
  \ SIS 中实施，以持续监控工厂活动，并在发生危险状况时启动适当的动作。例如，如果 FGS 检测到可燃气体（如 图 1.29 中用于加热储罐的气体）、有毒气体、烟雾、火焰或过热，它可能会发出视觉和听觉警报，并启动灭火系统和/或过程停车。\n\
  \n在我们的简单过程中，FGS 将使用位于供气管道沿线间隔处和接头处的气体泄漏检测装置。控制器可以是编程执行 SIS 功能的 `PLC`，也可以是专用 FGS\
  \ 控制器。图 1.30 说明了在我们的示例过程中实施简单 FGS 的情况。\n\n![FIGURE 1.30 Adding an FGS to the system](img/c01f030.png)\n\
  \n**FIGURE 1.30** 向系统添加 FGS\n\n控制器的选择通常基于过程的规模。`PLC` 往往更适合中大型安装（涉及 25 个以上传感器），而专用控制器更适合中小型安装。`PLC`\
  \ 控制器实施和变更的成本相对较低且灵活。此外，`PLC` 能够在分布式控制环境中与其他控制器通信。专用控制器安装和维护相对容易，通常不需要编程。\n\n与 ESD\
  \ 系统不同，火气系统可能非常复杂且高度分布式。然而，它们对工厂安全至关重要，其效率和可靠性不仅是工厂操作员关注的重点，也是环保和商业保险机构关注的重点。\n\n\
  #### 工业泄漏检测\n\nFGS 的主要组件之一是*泄漏检测器*。这些设备被添加到 SIS 中，用于检测危险气体、化学品和液体的泄漏。它们广泛应用于各类工业过程，用于任何盛装可能泄漏的液体或气体的设备中。\n\
  \n工业环境中可用的泄漏检测器类型很多。每种类型采用不同的物理原理来检测泄漏并将其转换为信号：\n\n*   *流体积聚检测器*：此类检测器使用两个独立的探针来检测探针之间积聚的过量流体的存在，这些流体在探针之间形成闭路条件。\n\
  \n*   *电阻变化检测器*：此类泄漏检测器使用电化学传感器来检测设备周围流体或气体的存在或浓度水平。当流体或气体混合物的化学成分发生变化时（例如管道外部周围空气中混入了气体），探针的电阻会发生变化，控制器会感应到这种变化。\n\
  \n*   *差压流量检测器*：此类检测器测量导管（如管道）中两点之间的压力差。如果导管是密闭的，两点之间不应有压力差。然而，如果测量点之间的压力发生变化，则假定发生了泄漏。\n\
  \n图 1.31 描绘了一个简单的差压检测系统。气体管道在管道的两个点上开孔取压。在该图示中，两个测量点之间存在一个正在被监测泄漏的管道接头。取压点连接到一个中心带有柔性隔膜的密封容器的两侧。隔膜通过机械方式连接到一个可动开关触点。\n\
  \n![FIGURE 1.31 A simple differential pressure detection system](img/c01f031.png)\n\
  \n**FIGURE 1.31** 简单的差压检测系统\n\n只要上游和下游压力相同，隔膜就会保持在容器中间，可动触点不会接触固定开关触点。因此，传感电路保持断开。然而，如果下游取压点压力下降，上游取压点较大的压力会将隔膜向图中右侧推动。当压力差足够大时，可动触点将与固定触点接触，传感器电路随即闭合。\n\
  \n此时，安全控制器将执行其指定的 `SIF`，这可能包括发出听觉警报、启动一个或多个视觉警示以及关闭安全阀。\n\n#### 燃烧器管理系统\n\n正如我们的过程示例所示，燃气燃烧器广泛用于工业过程中加热气体和液体。为了保障储罐外部燃气输送系统的安全，部署了燃气泄漏检测器来监测管道沿线区域。然而，燃气泄漏检测器在我们过程示例的储罐内部用处不大。\n\
  \n燃烧器区域本应有燃气，但必须以精确的方式加以控制，以确保系统安全运行。假设燃烧器上的火焰熄灭了。燃气传感器会检测到燃烧器区域涌入的燃气，安全控制器会采取行动切断燃气流量。\n\
  \n那么，如何以安全的方式重新点燃燃烧器？这必须同时具备燃气和火焰才能实现。然而，安全传感器/控制器会继续保持阀门关闭，直到燃气传感器指示该区域不再有燃气。因此，使用*燃烧器管理系统*\
  \ *(BMSs)* 来确保过程控制系统中燃烧器的安全启动、运行和停车。图 1.32 描绘了简单 BMS 的组件。\n\n![FIGURE 1.32 A simple\
  \ BMS](img/c01f032.png)\n\n**FIGURE 1.32** 简单的 BMS\n\n这个简单系统始于一个称为*引燃器*的小型装置。这是一种始终在主燃烧器附近维持小火焰的设备。引燃器火焰指向火焰传感器——通常是热电偶——每当火焰作用于传感器时，它就会产生电信号。\n\
  \n安全控制器利用热电偶的电信号使故障关闭型安全阀保持开启。如果引燃器火焰不存在，*安全阀*将关闭。该阀门位于手动切断阀下游，原过程控制阀上游。\n\n\n\n\
  \n\n该点火系统旨在将小型点火源维持在主燃烧器附近，以便当过程控制阀打开并向燃烧器供气时，燃气能够点燃，而不会在燃烧器装置周围积聚。当过程控制器关闭过程控制阀以限制流向燃烧器的燃气时，点火器将保持点燃状态。当过程需要更多热量时，控制器可以打开燃烧器的控制阀，使其以安全的方式点燃。\n\
  \n要点燃点火器，操作员必须手动覆盖关闭的安全阀，向点火器机构引入燃气。此外，他们还必须向点火器组件提供火源以启动它。火焰传感器检测到点火器火焰后，安全控制器应接管系统控制权。火源通常是某种类型的电火花发生器。\n\
  \n当然，工业安全环境中实际的 BMS 部署往往比此处展示的简单设计复杂得多。然而，它们都采用传感器、控制器和执行器，这些设备经过设计和选择，旨在执行与本示例相同的功能。\n\
  \n#### 振动监测\n\n本章 GICSP 认证目标中列出的最后一个 SIS 子系统是*振动监测系统*。这些系统通常被添加到工业设备上，以监测运动机械是否有即将发生故障的迹象。过度振动是机器开始出现劣化迹象的信号之一。通过监测振动量，组织可以就何时维修或更换机器做出明智的决策。\n\
  \n所有运动机械都会在一定程度上产生振动。然而，随着其运动部件老化，它们会逐渐剧烈振动。被称为*加速度计*的设备被安装在旋转机械上，以随时间监测其振动模式。记录的振动模式可以与之前的时间点进行比较，以确定机器磨损的速率。\n\
  \n图 1.33 展示了向 FGS 系统添加应急排风扇装置。如果 FGS 系统检测到燃气泄漏，风扇装置将被激活以将烟雾排出该区域。驱动风扇的电机是安全系统的关键部件，但在安全测试之外很少或从不使用。因此，必须保持其处于良好工作状态，以备紧急情况时使用。该图还展示了向排风扇电机添加振动传感器系统，以便通过定期测试跟踪其状况。\n\
  \n![图 1.33 添加振动检测系统](img/c01f033.png)\n\n**图 1.33** 添加振动检测系统\n\n振动检测系统还用于测试或监测人体健康和安全系统。在美国，OSHA\
  \ 技术手册 (OTM) 涵盖了三个与人体相关的振动监测领域。例如，某些需要人工操作的设备可能会接受振动监测。这通常是为了确保机器的运行不会超过建议的振动限值，从而使操作员暴露于可能损害人体的振动水平。\n\
