  _\\_\\_\\_\\_ 是在个人通过身份验证后，对其访问指定信息的批准。\n3.  \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ 涉及确保个人就是他们自称的那个人。\n\
  4.  \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ 是对数据保持机密或私密的保证。它通过旨在将数据访问限制在授权人员范围内的规则集来建立。\n\
