  \n403. 401\n\n404. 402\n\n405. 403\n\n406. 405\n\n\n\n\n## 前言\n\n想象有一天醒来，家里停电了。又或者燃气加热器打不着火，家里停水了。这些只是简单的日常便利吗？不，这些资源是提供健康、安全、营养以及整体稳定与保障的关键依赖——不仅在我们的家庭和企业中，而且贯穿整个社会。这些正是针对关键基础设施的协同网络攻击所导致的后果。现在，想象一下这种类型的网络事件发生在国家层面。我们都应该对这种类型的网络事件感到担忧，不仅关乎这些基本生活需求，更关乎当我们的金融或医疗服务遭到破坏时的稳定性。我们正处于一个网络威胁与我们识别和应对此规模网络攻击的能力失衡的时期。\n\
  \n几年前，我有幸与本书的合著者 Phil Craig Jr. 先生共事。我们共同发挥专长，支持由美国国防高级研究计划局（DARPA）资助的一项关键电力基础设施安全项目。该项目探索并开发了网络安全工具，旨在从持续且猛烈的网络攻击中迅速恢复美国电网，此类攻击会严重冲击大规模电网的稳定性。我们了解到威胁是真实存在的，而挑战可能是压倒性的。\n\
  \n\n\n\n\n理解、操作和保卫那些在高度互联环境中提供稳定控制与通信的数字环境，是在防范我们担心会影响日常生活的网络事件时的至关重要任务。Craig 先生及其同事在运营技术系统的演进以及创建识别和缓解其中网络威胁的技术方面积累了多年经验，而\
  \ Charles Brooks 先生多年来一直是卓越“实战”培训技术和教材的重要贡献者。凭借他们结合的知识，本书提供了一个视角，展示了网络入侵和攻击的机会有多么巨大，并介绍了增强针对这些威胁的网络防御的高影响力技术。Brooks\
  \ 先生和 Craig 先生的技术洞察力，仅次于他们对教育新一代网络防御者的热情，以保护这些关键系统和网络免受那些试图改变我们生活方式之人的侵害。\n\n随着网络威胁持续增长，本书是新手和经验丰富的专业人士在试图拓宽其对工业控制系统和网络安全对策知识时的有用资源。本书大力支持并指出了迫切需要的关键技能，以提供防护措施来应对这些威胁。本书结构合乎逻辑，并为从事\
  \ OT 行业并试图获得全球工业网络安全专业人员 (GICSP) 认证的技术人员提供了参考资料。最后，本书为任何渴望拓展其在行业中使用的最新网络技术方面的安全知识广度的网络安全专业人员提供了综合性资源。\n\
  \nJoseph Minicucci 先生\n\n美国海军陆战队中校\n\n## 简介\n\n欢迎阅读 Wiley 出版的《*实用工业网络安全：ICS、工业 4.0\
  \ 和 IIoT*》。本书旨在为工业过程控制和公用事业环境中的网络安全人员提供坚实的理论和实践平台。\n\n虽然本书本身不能作为成为工业网络安全专业人员的完整指南，但它确实能帮助读者准备该领域领先的行业认证——全球工业网络安全专业人员\
  \ (GICSP) 考试，该考试由全球信息保障认证机构 (GIAC) 推出，GIAC 是 SANS 研究所的附属机构。GICSP 考试旨在将工业控制技能推向网络安全的前沿。虽然该领域存在大量以\
  \ IT 为中心的计算机、网络和网络安全课程及认证，但具备与工业控制系统和运营技术相关的网络安全技能和知识的人才却寥寥无几。寻找拥有这些技能和知识的人已成为网络安全界的一大驱动力。\n\
