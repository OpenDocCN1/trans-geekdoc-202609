  *   **ICS 架构**——了解无线安全（例如：`Wi-Fi`、无线传感器、无线网关、控制器）\n*   **ICS 模块和要素加固**——了解应用安全（例如：数据库安全）\n\
  *   **ICS 模块和要素加固**——了解嵌入式设备（例如：`PLCs`、控制器、`RTUs`、分析仪、仪表、聚合器、安全问题、默认配置）\n*   **ICS\
  \ 模块和要素加固**——了解网络安全/加固（例如：交换机端口安全）\n*   **ICS 模块和要素加固**——了解操作系统安全（Unix/Linux、Windows、最小权限安全、虚拟化）\n\
