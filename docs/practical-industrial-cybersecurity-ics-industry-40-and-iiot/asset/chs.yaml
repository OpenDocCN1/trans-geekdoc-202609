  \  从以下列表中，确定开发 PHA 涉及的主要工具。（选择所有适用项。）\n\n    1.  保护层分析 (LOPA)\n    2.  安全仪表系统分析\
  \ (SISA)\n    3.  失效模式与影响分析 (FMEA)\n    4.  年化发生率分析 (AROA)\n    5.  影响评估分析 (IAA)\n\
  \n\n\n\n## 第 9 章：ICS 安全评估\n\n## 简介\n\n在上一章中，您了解了网络安全策略生成过程以及风险管理过程。回顾一下，在组织的网络资产已被识别和评估，且针对其的潜在漏洞和威胁已被识别后，制定网络安全计划的下一步是执行风险评估。\n\
  \n在威胁已被识别且风险已被量化后，流程中的下一步是对网络进行实际的漏洞测试，以确定其对这些威胁的易感程度。这是通过一个称为 **安全评估** 的过程来完成的。\n\
  \n在本章中，您将了解与规划和实施安全评估相关的常用术语、工具、技术和流程。这包括渗透测试（或称 **渗透测试**）的介绍，即针对网络（及其可能的管理和支持人员）进行测试，以达到风险识别的目的。\n\
  \n## 安全评估\n\n在 IT 和 OT 网络环境中，安全评估涉及执行一系列练习，旨在定位组织网络和计算环境中的漏洞。然后，组织利用从评估中获得的结果来帮助评估其安全态势。这是在风险评估早期识别出的潜在威胁和漏洞得到验证的地方。\n\
  \n正如您稍后在本章中将看到的，有许多可用于实施安全评估的参考资料和指南。然而，所有这些方法论通常都遵循四阶段流程执行。\n\n### 1. 发现阶段（识别）\n\
  \n识别企业或 OT 网络中正在使用的系统和流程。\n\n1.  检查组织的网络安全实践。收集有关其网络安全策略、程序和实践的信息。此外，收集可能在关键数字资产（如计算机和网络设备）的网络安全中发挥作用的资源信息。\n\
  2.  识别待评估的资产。对每个已识别的关键资产执行初步后果分析，以确定如果该资产遭到破坏，对组织可能造成的后果。\n\n### 2. 漏洞扫描阶段（评估）\n\
  \n紧随发现阶段之后，使用自动化工具搜索网络中的安全问题。\n\n1.  对已识别的数字资产进行桌面推演审查和验证测试。这应包括物理检查以及电子测试（扫描已识别的关键资产）。\n\
  \n### 3. 漏洞评估阶段（缓解）\n\n建立在发现阶段和漏洞扫描阶段的基础上，识别漏洞并验证组织因发现的漏洞而面临的风险敞口级别。评估结果生成的背景信息可用于帮助管理层了解其网络中风险的严重程度。\n\
  \n1.  实施易感性评估。利用桌面推演审查和验证测试的结果，评估每个关键资产遭受网络攻击的易感性。该阶段的产出是对每个 **关键数字资产 (CDA)** 总体易感性级别的估算。\n\
  2.  实施风险评估活动。重新评估初步后果分析，并结合易感性评估的结果，估算每个资产遭受网络攻击的风险。\n3.  实施风险管理活动。这些活动包括识别和表征可实施的潜在新对策，以增强网络安全。\n\
  4.  将这些对策的收益与实施和运营这些对策的成本进行比较。\n5.  识别具有成本效益的风险管理选项，并为管理层准备建议。\n\n### 4. 报告阶段（预防）\n\
  \n使组织能够从潜在攻击者的角度全面审视其网络安全态势。组织可以利用报告中的建议来实施工具和流程，根据评估的威胁和漏洞降低其风险敞口。通常，安全评估报告将包含以下主题：\n\
  \n1.  执行摘要\n2.  项目范围描述\n3.  评估方法论描述\n4.  信息安全优势\n5.  网络漏洞\n    *   开放的 TCP 端口\n\
  \    *   开放的 UDP 端口\n6.  网络修复建议\n\n在这四个阶段中，安全评估应仔细调查 `ISA/IEC-62443-3-X` 系列功能安全评估中定义的\
  \ **工业自动化与控制系统 (IACS)** 安全七大基础要求的各个方面，列表如下：\n\n*   访问控制\n*   使用控制\n*   系统完整性\n*\
  \   数据保密性\n*   受限数据流\n*   及时响应事件\n*   网络资源可用性\n\n## ICS 设备测试\n\n在 IT 网络环境中，有大量关于保护不同网络设备的信息可用。企业网络管理员和安全管理员通常非常清楚其网络中计算和连接设备的优势和潜在弱点。然而，在\
  \ ICS 网络环境中，这种情况尚未被证实。历史上，OT 网络设备被认为通过默默无闻以及缺乏与企业网络和互联网相关的外部攻击向量而保持安全。\n\n数据通信已成为大多数\
  \ ICS 系统的重要组成部分。随着向基于以太网的网络迁移以构建其通信基础设施的趋势，OT 网络变得越来越容易受到网络安全威胁。\n\n## 漏洞\n\n目前，连接到组织\
  \ IT 网络的 ICS 和 SCADA 网络面临着许多漏洞挑战。最普遍的挑战包括以下内容：\n\n*   继续运行的过时或失效的 ICS 技术\n*   不安全的接口\n\
  *   不存在或不充分的监控\n*   不存在或过时的软件补丁\n*   缺乏针对 OT 系统的病毒防护工具\n*   不安全的网络连接\n*   软件溢出漏洞\n\
  *   因缺乏访问控制导致的远程访问漏洞\n*   缺乏设备和软件供应商的安全参与\n*   来自第三方供应商的其他硬件/软件漏洞\n\n定位和纠正（或补偿）这些漏洞涉及两个方面：\n\
  \n*   **ICS 供应链**（硬件和软件供应商的安全保证和支持）\n    *   应监控并评估来自供应商和其他适当来源的漏洞通知，涵盖与企业和 OT 网络环境相关的所有系统和应用程序。\n\
  *   基于 ICS 设备测试和网络渗透测试的 **组织安全评估**\n\n\n\n\n\n## 漏洞评估\n\n*   在将所有新的 IT 和 OT 设备及系统（或正在进行重大变更的设备及系统）投入使用前，必须对其执行漏洞评估。此类活动通常在沙箱环境中进行，因为在运行中的生产网络中执行可能会影响可用性和生产力。\n\
  *   还必须定期对 OT 网络和设备执行漏洞评估，以便采取适当措施应对已识别漏洞相关的风险。\n\n## 供应链\n\n为了弥补 OT 网络环境中出现的威胁向量和攻击面增加的问题，OT\
  \ 设备制造商已升级其漏洞测试程序，纳入以下活动：\n\n*   端口扫描测试\n*   网络泛洪活动\n*   漏洞扫描\n*   协议模糊测试\n\n制造商进行这些测试是为了审查并确保设备在面对常见网络攻击手段时，维持运行性能和`安全保障等级`（`SALs`）的能力。然而，ICS\
  \ 领域充斥着晦涩且有时已过时的技术，这些技术无法提供任何可靠的 `SALs`。\n\n`ISA99` 委员会编制了一系列文件，如图 9.1 所述，旨在解决 ICS\
  \ 网络安全的不同方面。对于从事安全评估的人员而言，文件底部组别中的两个项目尤为重要。这些文件侧重于 OT 网络中单个组件的技术安全要求：硬件、软件和系统的信息组件。\n\
  \n![图 9.1 ISA/IEC-62443 文件系列](img/c09f001.png)\n\n**图 9.1** ISA/IEC-62443 文件系列\n\
  \n`ISA/IEC-62443` 计划的一部分是为 ICS 设备制造商在开发产品时遵循提供一套一致性认证计划。`ISASecure`（`www.isasecure.org`）计划已开发完成，旨在为行业提供一套可认证的\
  \ ICS 设备和系统一致性评估方案。它认证商用现货（COTS）ICS 产品和系统，解决如何保障 ICS 供应链安全的问题。目前，该计划提供两种 COTS 认证。\n\
  \n*   嵌入式设备安全保障（ISASecure-EDSA），依据 IEC 62443-4-2 标准认证 IACS 产品\n*   系统安全保障（ISASecure-SSA），依据\
  \ IEC 62443-3-3 标准认证 IACS 系统\n\n还有一种第三方认证，即安全开发生命周期保障（SDLA），依据 IEC 62443-4-1 标准认证\
  \ IACS 开发组织。该认证旨在保证供应商组织已将网络安全制度化并融入其产品开发实践中。\n\n由于 OT 环境中缺乏漏洞研究，无法提供更好的工具来扫描 OT\
  \ 设备和网络，ISASecure 计划包含一个测试工具认可流程，以确保工具满足执行所有必需产品测试所需的充要功能要求，并确保认可工具之间的测试结果一致。\n\n\
  尽管这些计划正在上线推行，但网络的 OT 侧尚不具备一套健全的系统来提高其设备和系统的安全性。在企业网络环境中，有许多可用的工具来扫描网络漏洞，产品供应商会积极追踪并修复发现和报告的漏洞。在企业网络中打补丁是一项惯例的、被接受的且持续的活动。\n\
  \nICS 领域的情况并非如此。有来源估计，每台 OT 计算机平均存在 1,800 多个未被发现的漏洞。此外，针对 OT 操作系统发布的补丁中，有 15% 到\
  \ 25% 是不正确的，会导致崩溃、死机、数据中断和安全问题增加，从而对最终用户产生不利影响。\n\n### 设备测试风险\n\n如前所述，许多组织抵制升级到新\
  \ OT 设备的压力，因为这样做可能会干扰其运营流程。因此，设备测试成为 ICS 安全评估的重要组成部分。然而，现场 OT 设备测试的相关风险还包括：在 ICS\
  \ 或 SCADA 设备上使用扫描工具和技术，确实可能导致流程停机（或中断）。如前所述，此类任务通常在数字孪生或沙箱环境中执行，然后再引入运营环境。\n\n###\
  \ 设备关键性\n\n术语 `criticality`（关键性）是指具有最高重要性的质量、状态或程度。应对每个 OT 网络设备执行关键性评估和分析流程，以确定其故障或功能丧失的后果。当组织开展\
  \ ICS 安全评估、风险缓解和安全策略生成计划时，必须解决以下可能的风险领域：\n\n*   人员安全\n*   设备安全\n*   环境影响\n*   生产损失\n\
  *   数据丢失\n*   不利的商业影响\n\n这些关注点在第 8 章“ICS 安全治理与风险管理”中描述的`危险与可操作性`（`HAZOP`）研究中得以解决。特别是该研究中的`失效模式、影响及关键性分析`（`FMECA`）部分，分析流程设备以识别其可能的失效方式，并评估其对组织的相对影响。顾名思义，`FMECA`\
  \ 涉及三个主要领域：\n\n*   `失效模式` 涉及对设备或系统可能失效的方式（模式）进行分类。此部分分析识别组件功能失效的具体方式。\n*   `影响分析`\
  \ 是指对这些失效的后果进行分类。此部分分析识别每种模式对组织的严重影响程度，并为每种模式生成一个严重度（`S`）评级。它还为每种模式生成一个发生频度（`O`）评级，以估算失效发生的概率。\n\
  *   `关键性分析` 涉及根据严重度和发生频度（`S x O`）计算，确定应处理潜在失效的优先顺序。\n\n由此产生的`关键性评估`可用于识别系统中最可能失效的组件。这反过来使组织能够采取行动，缓解可能的失效事件及其频率。这可能涉及用可靠性评级更高的组件替换现有组件、增加冗余组件以补偿潜在故障，或降低关键设备的运行应力水平。根据漏洞的严重程度，组织可能希望对产生高`关键性排名`的设备和系统实施额外的监控活动。\n\
  \n## 攻击面分析\n\n术语 `attack surface`（攻击面）用于定义设备或系统中攻击者可能借以获得访问权限或提取数据的所有不同点。`攻击面分析`流程旨在明确设备或系统的哪些方面构成漏洞，以便组织了解与该特定设备或系统相关的风险。随后，组织可以确定其愿意为将这些风险降至最低而投入的精力程度和资源类型。\n\
  \n\n\n\n\n## 攻击面分析\n\n该过程始于识别可用于访问目标的所有*攻击向量*（路径、通道或手段）。这包括记录物理访问路径、远程访问路径以及与外部系统的接口（特别是与互联网连接的路径），如图\
  \ 9.2 所示。与每个通道相关的协议的相对安全性也在分析中予以考虑。\n\n![图 9.2 攻击面](img/c09f002.png)\n\n**图 9.2**\
  \ 攻击面\n\n分析过程还涉及识别保护每条路径的所有防护措施——连接和控制设备、认证和授权工具，以及数据活动日志系统和数据编码系统。\n\n接下来，必须将授予不同类型用户的各种角色和权限（访问权限）纳入分析。特别是，必须评估高权限用户（如管理员和安全人员）以及未经授权和匿名用户（来宾账户）。\n\
  \n最后，应将每个攻击向量按风险类型（面向外部或面向内部）、目的、实现和技术进行分组。然后统计与每个组相关的攻击向量数量，以便从每组中检查案例，并将评估活动集中在被指定为高风险区域的地方。此类分析过程通常由红队成员（如网络安全人员和*渗透测试人员*（*pentesters*））在内部执行。\n\
  \n攻击面分析可用于识别以下内容：\n\n*   组织需要审查或测试安全漏洞的网络层面\n*   需要纵深防御保护策略的网络高风险区域\n*   设备或网络的攻击面何时发生变化，从而需要进行新的威胁评估\n\
  \n## 通信鲁棒性测试\n\n*鲁棒性*测试是指测试以确定设备处理错误和故障的能力。嵌入式设备通常在现场运行数年，在其生命周期内可能需要经受多次技术变革。如果设备在发生断电等事件后能继续运行，则被认为具有鲁棒性。\n\
  \n针对嵌入式设备的*通信鲁棒性测试*（*CRT*）基于向设备发送协议消息，然后检查其通信状态。如果设备无法继续提供系统控制和报告功能，则表明存在漏洞。通常测试三类消息：\n\
  \n*   格式正确的消息\n*   错误消息\n*   格式错误的消息\n\n设备应能充分维持基本服务，例如过程控制/安全回路的运行、命令功能和过程报警。\n\
  \n## 模糊测试\n\n*模糊测试*是一种自动化的黑盒数据注入技术，将格式错误的数据注入软件结构，以检测软件结构、配置和实现中的故障。因此，模糊测试常用于暴露软件中可被攻击者利用的漏洞（攻击向量或*模糊向量*）。它通常是通信鲁棒性测试程序的一部分。典型的模糊向量类别包括：\n\
  \n*   SQL 注入\n*   跨站脚本攻击 (XSS)\n*   LDAP 注入\n*   XML 注入\n*   缓冲区溢出 (BFO)\n*   格式字符串错误\n\
  *   整数溢出\n\n模糊测试过程始于建立通往目标设备的通信通道。然后使用称为*模糊器*的软件工具将格式错误的数据注入目标的软件结构中，旨在创建前面列出的任何条件。这些测试旨在创建从不稳定到完全故障的各种条件，可通过简单观察来检测。如果设备发生故障或表现异常，则表明存在漏洞条件，必须为该设备制定风险缓解计划。\n\
  \n*协议模糊测试*涉及向协议引入故障（格式错误的消息），以测试目标设备的鲁棒性。格式错误的消息就是语法不正确的协议消息。有多种不同的协议，如 `SIP`、`SCADA`、`IPv6`、`Wi-Fi`、`Bluetooth`、`ARP`、`DHCP`\
  \ 和 `Modbus`，均可通过模糊测试进行测试。\n\n协议模糊测试需要了解协议的头部/数据包格式，以及用于创建/操作头部和消息的工具。图 9.3 描绘了典型的\
  \ TCP/IP 头部。通过向不同字段注入各种值，特别是为将来使用保留的未定义值，可以向目标发送数据包，尝试让其进行处理。\n\n![图 9.3 TCP/IP\
  \ 头部](img/c09f003.png)\n\n**图 9.3** TCP/IP 头部\n\n当目标设备接收到意外值时，例如长度不正确的字段（特别是零长度、过短或过长的载荷），它会变得“困惑”，并可能以多种不同方式做出反应，包括进入无限程序循环、缓冲区溢出条件，或直接崩溃。*基于状态的模糊测试*涉及操纵消息的顺序，而不是消息的内容。\n\
  \n前面列出的故障条件是每个软件程序员都能识别的典型软件相关条件。程序员可以轻松创建消息来触发它们。然而，渗透测试人员可用的商业和开源模糊测试包有几个：\n\n\
  *   *W3af* (`https://docs.w3af.org`)：W3af 是一个用于构建漏洞发现/利用工具的灵活框架。该框架允许用户将其他工具（插件）集成到包中，用于利用或监控目的。该实用程序在\
  \ Kali Linux 和 Windows 中均可用。\n*   *Wapiti* (`https://wapiti-scanner.github.io`)：Wapiti\
  \ 旨在通过查找可注入数据的脚本和表单来审计 Web 应用程序的安全性。在创建潜在漏洞列表后，它将载荷注入脚本（模糊测试）以确定是否真正存在漏洞。\n*   *Wfuzz*\
  \ (`https://github.com/xmendez/wfuzz`)：Wfuzz 模糊器旨在对 Web 应用程序进行暴力破解攻击。特别是，它可用于定位未链接的资源，如可被利用的目录、脚本等。此外，它可用于不同类型的注入攻击（SQL、XSS、LDAP\
  \ 等）以及模糊测试/暴力破解用户/密码参数。Wfuzz 在 Kali Linux 和基于 Windows 的实用程序中均可用。\n*   *Peach* (`https://github.com/MozillaSecurity/peach`)：Peach\
  \ 模糊器旨在配合不同的测试定义（称为 Peach Pits）运行，这些定义包含有关特定目标类型的具体信息。只需选择目标类型，使用基于 Web 的 GUI 配置参数，然后开始测试。该工具将自动生成一份按优先级排序的报告，列出它遇到的每个问题。\n\
  *   *Sulley* (`https://github.com/OpenRCE/sulley`)：除了所有模糊器提供的数据生成功能外，基于 Python 的\
  \ Sulley 模糊器框架还监控网络和目标设备的健康状况，并将操作恢复到“良好状态”。一般来说，Sulley 设置和使用所需的编码工作比其他模糊器少。\n\n\
  ## ICS 渗透测试\n\n\n\n\n\n## The Other Side of Security Assessment: Penetration Testing\n\
  \nThe other side of security assessment vulnerability analysis is **penetration\
  \ testing**, or **pen testing**. Penetration testing is simply attacking a network\
  \ in an effort to find security weaknesses. This essentially involves attempting\
  \ to break into your own (or your client's) system. Penetration testing exists so\
  \ that an organization can use resources (external or internal) to attempt to break\
  \ into its network or systems and possibly attack them in order to gain information\
  \ about their network vulnerabilities so that they can assess their risk level.\n\
  \nPenetration testing not only looks for vulnerabilities but also searches **exploit**\
  \ databases (computer programs designed to take advantage of a specific vulnerability).\
  \ These exploits may be used to deliver a payload to a target system, thereby granting\
  \ a hacker access to that system.\n\nPenetration testing is a booming business for\
  \ outside security firms. This service can be a valuable tool to help an organization\
  \ find its network vulnerabilities. However, there are also many open-source penetration\
  \ testing tools available for individuals or organizations to use. Certain Linux\
  \ distributions not only contain penetration testing utilities but also **vulnerability\
  \ emulators** that can be deployed as targets for these tests.\n\n## The Penetration\
  \ Testing Process\n\nThere are multiple standard frameworks and methodologies for\
  \ conducting penetration testing. The following are some of the most famous penetration\
  \ testing frameworks:\n\n*   Open Source Security Testing Methodology Manual (OSSTMM,\
  \ `www.isecom.org/research.html#content5-9d`)\n*   Penetration Testing Execution\
  \ Standard (PTES, `www.pentest-standard.org`)\n*   NIST SP 800-115 (`https://csrc.nist.gov/publications/detail/sp/800-115/final`)\n\
  *   Information Systems Security Assessment Framework (ISSAF, `www.oissg.org/issaf`)\n\
  *   Open Web Application Security Project Testing Guide (OWASP, `http://owasp.org/www-project-web-security-testing-guide`)\n\
  *   Lockheed Martin Cyber Kill Chain (`www.lockheedmartin.com/en-us/capabilities/cyber/cyber-kill-chain.html`)\n\
  \nEach of these penetration testing methodologies presents its own approach to the\
  \ penetration testing process. However, all methods share three general phases of\
  \ the penetration testing process:\n\n*   **Negotiation**: Define and agree upon\
  \ the scope of the test\n    *   Agree on personnel involved.\n    *   Commit to\
  \ rules of engagement to be adopted.\n*   **Penetration Testing**: Conduct the attack\n\
  \    *   Assess risk.\n    *   Conduct discovery.\n    *   Develop a test plan.\n\
  \    *   Conduct technical security testing.\n*   **Documentation**: Generate reports\
  \ and documentation\n    *   Analyze test results.\n    *   Publish and deliver\
  \ test results.\n\n### Negotiating the Penetration Test\n\nThe skills used by a\
  \ penetration tester to research and attack a network are no different from those\
  \ used by a **black hat hacker** to gain access to an organization's network. However,\
  \ the primary difference is that a legitimate penetration tester is a **white hat\
  \ hacker** who will not use their skills to steal valuable sensitive information\
  \ or destroy organizational property. Instead, they will generate and provide a\
  \ report to the organization, called a **briefing**. This briefing will highlight\
  \ the weak points in the organization's security policies and practices found during\
  \ the test, including items such as how a hacker could bypass network perimeter\
  \ defenses to gain access.\n\nIn cases where a company hires an outside penetration\
  \ testing organization or firm to conduct the test, both parties will determine\
  \ who plays what role in the test. There are usually three groups:\n\n*   The **red\
  \ team**, which conducts the attack\n*   The **blue team**, usually consisting of\
  \ the victims (i.e., network administrators)\n*   The **white team**, which monitors\
  \ the test\n\nOne might initially think that a penetration testing firm would simply\
  \ come in and execute a full suite of attacks to ensure the network is 100% tested\
  \ for vulnerabilities. However, this is usually not the case. Before testing begins,\
  \ the penetration testers and the client must negotiate and clearly establish the\
  \ exact parameters of the test.\n\nFor example, many penetration testing firms feel\
  \ that since hackers have no restrictions on what they can or cannot attack, penetration\
  \ testers should not have restrictions either. This idea is very sound but makes\
  \ some companies uncomfortable, which is why a great deal of time is spent defining\
  \ what can be attacked.\n\nIt is also important for the company to set a reasonable\
  \ window of time for the attack. In this case, the company knows that if a breach\
  \ occurs outside that window, it is not the penetration testers but a genuine malicious\
  \ attack.\n\nKey items that must be defined in this phase include:\n\n*   **What\
  \ is to be accomplished?** Perhaps the company has a problem with phishing attacks\
  \ where users inadvertently give away passwords. In this case, the goal would be\
  \ to reduce the number of successful phishing attempts.\n*   **What systems (people,\
  \ or otherwise) can be attacked, and for how long?** For example, if I am conducting\
  \ a phishing attack, the penetration tester is not necessarily interested in attacking\
  \ things outside the scope of the target. Remember that depending on how the company\
  \ operates, this can be a very gray area and is often one of the largest areas the\
  \ white team administrators struggle to define.\n*   **Who in the blue team will\
  \ know about the attack?** Suppose you are conducting a social engineering attack\
  \ with the goal of infiltrating the company to gain access to the server room. What\
  \ happens when you are walking down the hall looking very suspicious and someone\
  \ challenges you? What if they ask for ID and you fail to get a visitor badge from\
  \ the front desk? Perhaps they will just escort you out of the building. However,\
  \ if this happens at night when the building is closed, the outcome could be very\
  \ different, and you might end up in handcuffs. Having the company contact on speed\
  \ dial, or having a letter of authorization from the Chief Information Security\
  \ Officer (CISO) or Chief Security Officer (CSO) would be very handy. In other words,\
  \ it is important that someone in the company knows, but they are not involved in\
  \ the test itself. That way, if something unexpected happens, you can quickly contact\
  \ that person and explain the situation.\n*   **Legal issues**: There are many laws\
  \ regarding ethical and non-ethical hacking. The company needs to know what they\
  \ are getting into, and the penetration testing firm needs to know what is legal\
  \ and illegal at the local, state, and federal levels. The company needs to ensure\
  \ the penetration testers have signed all necessary confidentiality and non-disclosure\
  \ agreements required by federal law.\n\n### Types of Penetration Tests\n\nOnce\
  \ the details of the penetration test have been negotiated and agreed upon, the\
  \ next phase involves executing the various attacks that have been agreed upon.\
  \ Basically, penetration testing can be conducted in three scenarios:\n\n*   **Black\
  \ Box Testing**: Black box penetration testing is a method of penetration testing\
  \ in which the ethical hacker has no prior knowledge of the system or network infrastructure\
  \ being attacked, and the client company provides no such critical details.\n* \
  \  **White Box Testing**: White box penetration testing is a method of penetration\
  \ testing in which the ethical hacker has full and complete knowledge of the system\
  \ or network infrastructure being attacked.\n*   **Gray Box Testing**: An ethical\
  \ hacker conducting gray box penetration testing will have partial knowledge of\
  \ the target system or infrastructure they are attempting to attack.\n\n\n\n\n\n\
  ## 黑盒、白盒与灰盒渗透测试\n\n### 黑盒渗透测试\n\n请花一分钟思考一下，当你被蒙上眼睛时，你能看到周围的什么。你只能看到黑暗和黑色。你无法看到周围世界的任何信息。没有任何物理细节可供参考，你必须依靠其他感官来摸索前行。**黑盒渗透测试**与此类似。\n\
  \n**黑盒渗透测试**的最终目标是尝试模拟外部实体对客户基础设施的攻击，因为除非攻击者是内部威胁，否则外部实体不应有权访问公司网络基础设施和防御措施的内部细节，如图\
  \ 9.4 所示。\n\n![图 9.4 黑盒测试](img/c09f004.png)\n\n**图 9.4 黑盒测试**\n\n黑盒测试通常从各种侦察手段开始，以收集尽可能多的公司信息。通常可以根据员工的电子邮件地址生成用户凭证，致电公司服务台重置员工密码即可轻松获得网络访问权限。随后，渗透测试人员会尝试以下几种场景之一。\n\
  \n第一种场景涉及在公司现场停留较长时间，进入大厅并将以太网线连接到未受保护的端口。甚至更大胆的专业人员可能会携带装有渗透软件的电池供电**树莓派**，将其植入通常拥有大量以太网端口的工作间或会议室。\n\
  \n一旦接入网络，设备会“回连”，从而获得网络访问权限。通过社会工程学手段最近获取的一组用户凭证，渗透测试人员随即开始深入挖掘网络。\n\n### 白盒渗透测试\n\
  \n如图 9.5 所示，**白盒渗透测试**（也称为**玻璃盒测试**）基本上与黑盒渗透测试截然相反。白盒渗透测试的最终目标是模拟拥有客户关键网络基础设施内部知识及访问凭证的**内部威胁**实施的恶意攻击。\n\
  \n![图 9.5 白盒测试](img/c09f005.png)\n\n**图 9.5 白盒测试**\n\n### 灰盒渗透测试\n\n如图 9.6 所示，**灰盒渗透测试**结合了黑盒和白盒渗透测试中使用的方法论。例如，灰盒渗透测试人员可能会获得目标网络所包含的不同操作系统的信息，但不提供访问这些系统的凭证。\n\
  \n另一种可能的灰盒渗透测试组合是：测试人员获得客户网络边界防御的具体信息，但不提供内部网络防御机制的信息。\n\n![图 9.6 灰盒渗透测试](img/c09f006.png)\n\
  \n**图 9.6 灰盒渗透测试**\n\n## 实施攻击\n\n在协商并达成渗透测试参数后，攻击过程遵循第 5 章“ICS 网络安全要素”中描述的攻击杀伤链阶段。\n\
  \n1.  **侦察**：此阶段通过各种活动寻找目标网络结构和配置中的可利用漏洞。这包括扫描网络硬件和软件攻击面，以及使用物理和逻辑社会工程学方法识别可能的攻击向量。\n\
  \n2.  **武器化**：识别出攻击向量和攻击面后，需评估成功渗透并利用已发现漏洞的可能性。这些信息允许渗透测试人员设计攻击策略，并组装可用于利用那些成功可能性高的漏洞的工具。\n\
  \n3.  **投递**：入侵的这一部分可能是即时的，也可能持续一段时间。网络被渗透后，下一个问题是：现在你已进入内部，该做什么？是立即激活载荷，还是在内部寻找更多机会？在渗透测试场景中，此答案通常在合同协议中指定。\n\
  \n4.  **安装与利用**：此时渗透测试通常进入安装漏洞利用代码并执行攻击策略的阶段。这可能涉及安装后门，为渗透测试人员提供网络或计算设备的命令与控制功能。可以安装不同类型的恶意软件，包括木马、僵尸网络节点或勒索软件。\n\
  \n5.  **目标行动**：此攻击阶段涉及探索利用前期识别出的漏洞所创造的选项。黑帽黑客可以潜伏在网络中，窃取公司机密、信用卡信息、患者医疗数据等。这通常涉及各类欺骗攻击、键盘记录器、会话劫持等。攻击者也可利用访问权限降级、中断、拒绝或摧毁目标资产。这通常涉及病毒、拒绝服务（DoS）/分布式拒绝服务（DDoS）攻击、中间人（MitM）攻击、广播风暴等。\n\
  \n## 渗透测试文档记录\n\n对渗透测试人员而言，**文档记录**至关重要，它能决定测试的成败，也能让你避免严重麻烦。例如，如果你受雇于某组织进行网络渗透测试，除了发现和建议外，拥有可交付的有形成果至关重要。\n\
  \n即使你是内部渗透测试人员，也需要生成清晰准确的文档，以教育管理层并指导负责组织安全的技术人员。有句老话：“如果没记录下来，就等于没发生。”遗憾的是这句话是真理，因为网络安全专业人员产出的大量成果是供客户阅读的技术文档和报告。\n\
  \n报告撰写或许不是世界上最令人兴奋的事，但它必不可少，应给予最高度重视，因为报告中包含的信息通常高度敏感，甚至属于机密。\n\n报告面向对象为行政级高管和 IT\
  \ 人员。报告副本及接收人也应记录在案。主副本应存放在存放其他贵重信息的高度安全场所。\n\n对渗透测试人员而言，记录所做的一切和讨论的一切至关重要。无论是通过截图、数据转储、数据包捕获还是其他方式，支持你主张的文档越多，你的论据就越有力。\n\
  \n除了收集数据，渗透测试人员还需确保记录详尽的笔记，以便公司 IT 人员能复现任何发现。清晰的笔记也能帮助报告撰写者回顾细节，确保报告清晰简练。\n\n##\
  \ 向客户汇报\n\n应为客户创建**渗透测试报告**。报告格式应易于阅读，包含页码，并具备专业报告或白皮书的其他特征。虽然这些报告不对外发布（**绝不应**发布），但全程保持专业至关重要，应避免使用任何可能妨碍读者理解的俚语术语。创建专业渗透测试报告涉及几个关键部分：\n\
  \n\n\n\n\n## 报告结构\n\n### 执行摘要\n执行摘要的目标受众应为公司的高管团队。本部分旨在相对非技术性，以便高管了解发生了什么以及为何需要变更。请记住，高管大多关注数字和金额，因此他们会想了解风险以及为何应投资于安全。\n\
  \n### 工作范围\n工作范围将包含公司提供的任何信息以及评估的实施方式。它还将详细说明测试的具体目标和渗透测试的禁区。建议包含测试前确立的交战规则，以便高管和\
  \ IT 人员理解报告中为何以及如何能够针对这些系统。\n\n### 项目目标\n此部分看似冗余，但请记住，参与本报告的某些高管可能是首次接触，因此重申目标非常重要，以确保所有人达成共识。请注意，许多人不“懂技术”，可能不理解为何他们会参与本报告。然而，报告理应帮助他们看到风险分析和涉及的资金，并理解安全是每个人的责任。\n\
  \n### 假设\n由于客户可能在测试开始前提供技术信息，因此做出某些假设是可以接受的，以便受众理解您的思维过程及得出特定结论的方式。\n\n### 时间线\n\
  时间线可视为交战规则的一部分，定义了测试窗口的开始和结束日期。它还能让 IT 人员大致了解何时可能发生事件；若事件发生在该窗口之外，则绝非渗透测试人员所为。\n\
  \n### 发现摘要\n发现摘要是客户高管的得力工具。优秀的摘要应包含以下内容：\n- 统计数据\n- 影响\n- 风险评估\n\n### 详细发现\n详细发现部分的目标受众为公司的顶级\
  \ IT 人员。后续部分的信息将包含任何有助于理解发现的要素，包括图表和图形。\n\n## 漏洞\n本部分应列出每个漏洞的以下信息：\n- 漏洞（可以是名称或简短描述）\n\
  - 威胁等级\n- 影响\n- 风险\n- 附带详细信息的分析\n- 缓解漏洞的建议\n\n### 解决方案与建议\n本部分汇总详细发现以及整体漏洞列表的影响和风险。此信息可用于量化漏洞的影响，以防发生事件导致信息泄露。\n\
  \n### 结束语\n结束语部分是作者添加最终想法、建议并总结整体测试的地方。\n\n## 安全测试工具\n\n在上一章中，您了解了安全评估（或风险识别）的漏洞扫描和评估阶段中常见的三项活动。回顾一下，它们包括：\n\
  \n- **数据包嗅探**：使用数据包分析器，白帽捕获网络中移动的数据包，记录它们，然后解码其原始数据。随后可分析这些数据，实际上是在监视网络用户。\n- **端口扫描**：使用端口扫描工具，渗透测试人员探测网络服务器和设备的开放端口以寻找可利用之处。他们还可以识别主机上运行的服务以进行潜在利用。\n\
  - **漏洞扫描**：使用`网络漏洞扫描器`套件，渗透测试人员扫描组织网络中的各类常见漏洞，如系统错误配置和默认密码使用，以及生成畸形数据包以制造 DoS 攻击。\n\
  \n这些及其他网络测试工具使白帽能更轻松地审计网络，以了解其资源、评估风险、评估漏洞，并制定缓解（或利用）这些风险和漏洞的计划。\n\n### 数据包嗅探器\n\
  \n`数据包嗅探器`（也称为`数据包分析器`或`协议分析器`）是一种软件监控工具，用于扫描通过它的网络流量。运行这些工具的计算设备通常插入网络，使网络流量流经它，从而实时捕获数据包，如图\
  \ 9.7 所示。当网络流量通过分析器时，分析器会“嗅探”数据包，寻找混杂活动或仅记录发生的情况。\n\n数据包/协议分析器需要两个网络接口，以便在流量流经时检查网络活动。因为它们不需要巨大的\
  \ CPU 资源，支持两个以太网接口的旧笔记本电脑可能是理想选择。性能监控产品也可在旧硬件上运行，是利用闲置老旧计算机硬件的好方法。\n\n![图 9.7 数据包分析器工具](img/c09f007.png)\n\
  \n**图 9.7** 数据包分析器工具\n\n### 网络枚举/端口扫描\n\n无论遇到何种情况，优秀的安全从业者（或黑客）首先做的都是`枚举`网络。这意味着绘制网络图以确定网络上有什么，从而知道能发现哪些主机。\n\
  \n执行此操作可发现各类信息，包括网络上可能存在不应存在的设备。例如，假设您是医院的网络安全工程师，正在进行例行网络扫描。得益于映射和枚举软件，您发现网络上连接了一个`Raspberry\
  \ Pi`，如图 9.8 所示，这绝对不应该存在。\n\n![图 9.8 网络枚举](img/c09f008.png)\n\n**图 9.8** 网络枚举\n\n\
  因为您了解网络的设置，且三层交换机拥有特定的 DHCP 范围，所以能精准定位设备连接的交换机。您能迅速禁用交换机上的该端口。在本案例中，准确掌握网络资产使您察觉到一个严重的安全问题。\n\
  \n枚举网络的方法和工具多种多样。`Nmap`是最常见的此类工具之一，可用于扫描各种规模的网络，以查找不同类型的网络信息，如每个主机运行的操作系统、潜在的开放端口，或特定网络上的主机。\n\
  \n图 9.9 展示了`Nmap`工具生成的输出，用于映射网络和收集信息。本例中，使用命令`nmap 10.0.0.0/24 -O`生成了网络扫描结果，并尝试揭示设备的操作系统。\n\
  \n![图 9.9 Nmap 输出](img/c09f009.png)\n\n**图 9.9** Nmap 输出\n\n如您所见，此次扫描发现一台运行 OS X\
  \ 或 iOS 且开放多个端口的设备。从攻击者角度看，若您能在设备上安装`Nmap`并将其置于网络中，将获得极佳的网络视野。\n\n以下是其他值得注意的网络枚举工具：\n\
  \n- **NBTscan**：一种基于 CLI 的信息枚举实用程序，可从目标网络检索用户列表、设备列表、共享列表、名称列表、组/成员列表和密码信息。\n\n\n\
  \n\n\n#### 工具介绍\n\n*   **DumpSec**：基于 GUI 的工具，提供目标文件系统的权限列表和审核设置，以及用户、组和复制数据。\n\
  *   **Legion**：基于 GUI 的实用程序，扫描 IP 地址范围以查找共享资源，如文件、目录、打印机等。\n*   **Netcat**：基于 CLI\
  \ 的计算机网络实用程序，执行枚举和端口扫描活动。除了枚举任务，`Netcat` 还可以使用 TCP 或 UDP 协议连接到目标主机的端口、监听指定端口以接受入站连接、跨网络传输文件以及在目标上执行脚本。一个名为\
  \ `Ncat` 的类似工具包含在 `NMAP` 实用程序套件中。虽然不是 `Netcat` 的衍生品，但 `Ncat` 的用法相似。\n\n#### 端口扫描\n\
  \n**端口扫描器** 是设计用于探测计算设备开放逻辑端口及其关联服务的软件工具。图 9.10 展示了攻击者用于定位并利用目标设备（如服务器或端点）漏洞的工具之一。\n\
  \n![图 9.10 端口扫描](img/c09f010.png)\n\n**图 9.10** 端口扫描\n\n端口扫描器通过网络连接向目标主机发送服务请求。这些请求被发送到一系列知名端口值，以识别目标上运行的网络服务。一种称为\
  \ **端口扫掠** 的端口扫描形式用于扫描网络环境中响应特定端口的设备，例如响应端口 530（*远程过程调用，RPC*）的计算机。\n\n对于网络管理员而言，端口扫描应被视为攻击序列中可能的第一步。在刚才的示例中，如果黑客定位到此类端口，他们便可开始准备利用该端口的攻击，以利用与之关联的潜在漏洞。在端口扫描与漏洞扫描相结合的情况下，管理员应将后续攻击视为迫在眉睫。\n\
  \n#### 漏洞扫描\n\n**网络漏洞** 扫描器包用于扫描企业中的不同类型的常见漏洞（如系统错误配置和默认密码使用），如 图 9.11 所示。某些扫描器还能通过生成畸形数据包来创建拒绝服务（DoS）攻击。\n\
  \n![图 9.11 漏洞扫描](img/c09f011.png)\n\n**图 9.11** 漏洞扫描\n\n网络安全专业人员和黑客都使用这些工具来识别漏洞或获取未经授权的访问。它们在识别以下类型的漏洞方面尤为有价值：\n\
  \n*   网络上的活动主机（包括可能隐藏在网络中的主机）\n*   易受攻击的活动端口和服务\n*   与操作系统服务器应用程序相关的漏洞\n\n所有漏洞扫描器都是数据库驱动的工具，旨在搜索计算机中已识别并添加到数据库中的已知漏洞。因此，它们的有效性仅取决于其最近一次更新。基于此原因，必须在使用前更新所有漏洞扫描器。\n\
  \n虽然使用漏洞扫描器耗时且消耗资源，但这却是持续安全的重要组成部分，因为它允许尽快解决发现的漏洞，理想情况下是在它们被发现并被利用之前。\n\n有许多免费和商业产品，以及不断增长的服务行业可提供这些监控服务。免费产品是很好的起点，因为它们通常易于设置且不需要大量资源。以下是一些值得考虑的产品：\n\
  \n*   **Nagios** (`www.nagios.org`) 可能是最知名的仍有免费版本的网络监控工具，但它已发展为提供功能齐全的商业企业版。该项目的一个分支\
  \ `Icinga` 是一个开源替代品，其功能比 `Nagios` 免费版更全面。这两款产品都拥有大量监控、报告和通知选项，最适合正常运行时间监控，但也可监控性能。\n\
  *   **SolarWinds** (`www.solarwinds.com/network-performance-monitor`) 提供功能极其强大的商业网络性能监控产品（NPM），它是其\
  \ Orion 平台的一部分。虽然该产品价格略高，但功能强大，可监控正常运行时间、性能、流量和利用率，并提供大量报告、图表和通知选项。\n*   **Microsoft\
  \ Network Monitor** (`https://docs.microsoft.com/en-us/troubleshoot/windows-server/networking/network-monitor-3`)\
  \ 是一款数据包分析器，可帮助您查看流量流并排查网络问题。正如您所料，该产品在与专有 Microsoft 协议交互方面表现出色，但也支持大多数常见公共协议。\n\
  *   **Wireshark** (`wireshark.org`) 是一款成熟的开源跨平台网络协议分析器。它可能是最知名的协议分析器，支持几乎所有协议，且可在几乎任何平台上运行。\n\
  *   **Wireshark**（如 图 9.12 所示）是一款用于捕获并随后分析流量以发现和排查网络问题的宝贵工具。它利用网络适配器的 **混杂模式** 功能工作。此模式使网络适配器能够监听通过线缆（或无线网络适配器的无线电波）传输的流量。分析器软件随后收集所有数据包并将其组织成图形化的有用系统，供用户筛选信息。\n\
  \n    ![图 9.12 Wireshark](img/c09f012.png)\n\n    **图 9.12** Wireshark\n\n    它可用于了解给定网络上使用的协议。该工具易于使用，但需要经验和实践才能准确分析其产生的结果。\n\
  \n*   **Snort** (`snort.org`) 是一个开源、跨平台的入侵检测系统，提供实时流量分析、数据包记录和协议分析，以及对蠕虫、端口扫描和漏洞利用尝试的主动检测。这对于实时监控网络非常有用。它非常适合识别探测和攻击，但也可充当网络嗅探器。`Snort`（如\
  \ 图 9.13 所示）是具有公共服务的网络的优秀产品。\n\n    ![图 9.13 Snort](img/c09f013.png)\n\n    **图\
  \ 9.13** Snort\n\n*   **Nmap**（如 图 9.14 所示）是一个开源、跨平台的网络映射实用程序，用于网络发现操作、安全审计操作和创建网络资产清单。它还用于执行网络监控功能和跟踪升级计划。这是一款用于检查和分析网络以及发现端口和版本的优秀产品。\n\
  \n    ![图 9.14 Nmap 实用程序](img/c09f014.png)\n\n    **图 9.14** Nmap 实用程序\n\n*   **Nikto**\
  \ (`https://cirt.net/nikto2`) 是一个开源 Web 服务器扫描器，可识别 Web 服务器上的问题。该工具可对 Web 服务器执行全面测试，检查\
  \ 6,700 多种安全威胁。`Nikto` 预装在 Kali Linux 发行版的漏洞分析类别中，或可从 GitHub 站点 (`https://github.com/sullo/nikto`)\
  \ 获取。\n\n\n\n\n\n## 安全工具与渗透测试概述\n\n### 开源漏洞扫描与渗透测试框架\n\n*   **OpenVAS** (`openvas.org`)\
  \ 是一款适用于 Linux 和 Windows 的开源漏洞扫描器，它是现已商业化的 Nessus 最后一个免费版本的分支。作为一个完整的漏洞管理解决方案，该工具使用\
  \ SCAP，可以执行多种网络漏洞测试 (NVT) 并查找常见漏洞和暴露 (CVE)。该产品有一定的学习曲线，但它是一款备受推崇且功能强大的工具，值得考虑。\n\
  \n*   **Metasploit** (`metasploit.com`) 是最流行的开源渗透测试框架之一。它适用于 Windows 和 Linux 环境。它通常用于识别和验证网络漏洞，包括模拟利用人为漏洞的攻击，如图\
  \ 9.15 所示。Metasploit 还可用于对发现的网络漏洞的响应进行优先级排序。\n\n    ![图 9.15 Metasploit 操作](img/c09f015.png)\n\
  \n    **图 9.15** Metasploit 操作\n\n*   **浏览器利用框架** (`beefproject.com`) 是另一款著名的开源渗透测试工具，但它专注于通过\
  \ Web 浏览器进行的 Web 承载攻击。BeEF 适用于 macOS、Windows 和 Linux。\n\n其他值得评估的安全产品包括 Nessus、Core\
  \ Impact 和 Nexpose。还有专用的硬件解决方案，如 nGenius 的 Netscout，为监控网络服务和性能提供严肃的解决方案。每个网络都应始终启用某种形式的监控，每个网络管理员也都应有权访问可靠的数据包嗅探工具。\n\
  \n上述提到的软件工具对黑客和网络工程师同样有用。网络工程师可能会使用它们来发现其网络设备的各种问题。然而，对黑客而言，这些信息可能更具启示性。他们使用这些工具开始描绘网络的拓扑结构、哪些系统在使用哪些协议，甚至可能发现包含敏感信息的未加密数据。\n\
  \n## 复习题\n\n以下问题测试您对本章所呈现材料的掌握程度。\n\n1.  \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\\
  _\\_ 涉及执行一系列练习，旨在定位组织网络和计算环境中的漏洞。\n\n2.  哪种嵌入式设备测试基于向设备发送协议消息，然后检查其通信状态？\n\n3. \
