  \n1.  该原则是指仅授予每个用户完成其工作角色所需的最小访问权限，且仅限于他们必须访问的网络区域。\n\n    1.  用户权限原则\n    2.  用户访问原则\n\
  \    3.  最小权限原则\n    4.  访问控制原则\n\n2.  什么术语用于指代证明数据完整性和来源（作者身份）的服务？\n\n    1.  授权\n\
  \    2.  认证\n    3.  标识\n    4.  不可否认性\n\n3.  哪种威胁主体对大多数联网组织构成最大威胁？\n\n    1.  拒绝服务\n\
  \    2.  内部威胁\n    3.  中间人\n    4.  垃圾邮件发送者\n\n4.  分布式拒绝服务 (DDoS) 攻击的目标是什么？\n\n\
  \    1.  单个客户端正遭受攻击。\n    2.  多个服务器正遭受攻击。\n    3.  单个服务器正遭受攻击。\n    4.  多个客户端正遭受攻击。\n\
  \n5.  以下哪项与会在网络或计算环境中产生不利影响并需要采取行动缓解的事件，或与违反组织安全策略、程序或可接受使用实践的事件相关？\n\n    1.  网络事件\n\
  \    2.  网络安全事件\n    3.  网络发生事件\n    4.  网络攻击\n\n6.  SYN 攻击利用了什么？\n\n    1.  握手交换期间使用的\
  \ TCP/IP 缓冲区空间\n    2.  初始连接期间使用的 IPX/SPX 帧中继\n    3.  握手交换期间使用的 UDP 头部帧\n    4.\
  \  连接检查期间使用的 ICMP 回显连接\n\n7.  哪种安全操作涉及对数据应用密码以生成乱码消息，如果不知道创建它所用的秘密代码，就无法理解该消息？\n\
  \n    1.  哈希\n    2.  加密\n    3.  隐写术\n    4.  密码学\n\n8.  一位密友想知道你在工作中的工作内容，于是你邀请他过来参观运营情况并测试你的高速互联网连接。下周，网络管理员告诉你，你的电脑中了病毒。可能的原因是什么？\n\
  \n    1.  未经授权的访问\n    2.  DoS\n    3.  社会工程学\n    4.  欺骗\n\n9.  使用数字签名的一个重要特性是，它提供了一种可靠的方法来确保数据完整性。以下哪项用于对消息进行数字签名？\n\
  \n    1.  发送方的公钥\n    2.  发送方的私钥\n    3.  接收方的私钥\n    4.  接收方的公钥\n\n10.  在网上搜索特定产品时，你使用凭据登录该网站。浏览器似乎正在尝试对你进行身份验证，但最终在没有错误消息的情况下将你返回到登录页面。假设你是输错了凭据，你再次输入，结果被接受了。你非常确定第一次输入的用户名和密码是正确的，但它们没能让你进入网站。你可能卷入了哪种活动？\n\
  \n     1.  点击劫持\n     2.  SQL 注入\n     3.  Smurf 攻击\n     4.  中间人攻击\n\n## 第 6 章：物理安全\n\
  \n## 简介\n\n\n\n\n\n## 安全基础\n\n任何安全工作的总体目标，都是为个人、群体或组织建立一种安心状态（无忧无虑或免于担忧的状态）。理想情况下，这种状态是通过确保对\
  \ `assets`（资产，即对象和信息）的专有权利、访问权和使用权来实现的。这种状态能创造价值，并让资产所有者高枕无忧。\n\n对 `security`（安全）更结构化的定义是：建立一套针对个人、系统、媒介、内容和对象的排除与包含体系的科学、技术与艺术。`Exclusion`（排除）作为一种主要的安全工具，能为对象或信息增值。它还能为物理资产（如机器或加工设备）提供更高的安全性和可用性。\n\
  \n`Physical security`（物理安全）是建立一套针对 `tangible assets`（有形资产）的排除与包含体系的科学、技术与艺术。在实践中，这涉及旨在打击盗窃、防止物理损坏、维护系统完整性和服务、以及限制未经授权的信息泄露的政策、实践和步骤。\n\
  \n同样，`cybersecurity`（网络安全）一词涉及保护对有形财产、电子系统和网络端口的物理访问，同时保护 `intangible assets`（无形资产），包括电子数据和对系统控制的访问。\n\
  \n在任何现代系统中，安全都是物理安全和网络安全两个领域协同作用的函数。这两个实体对于支持强大的整体安全态势和计划都是必不可少的。\n\n## 基础设施安全\n\
  \n当物理安全举措应用于为企业、组织和社会运营所需的基本物理和组织结构提供安全保障时，这被称为 `infrastructure security`（基础设施安全）。\n\
  \n虽然我们可能从简单的物理角度来考虑基础设施安全，例如可上锁的门、巡逻的保安或其他用于保护资产的方法，但构建一个有效的基础设施安全系统还包含其他几个组成部分。此类系统通常涉及多个关键安全程序的组合，这些程序经过精心策划和测试，以满足或超越运营和组织的安全需求。\n\
  \n设计和实施物理保护基础设施资产（财产、建筑物、物理空间、系统或设备）的计划，一般分为三个层面：\n\n*   **外围边界**：保护该区域涉及控制谁可以跨越标记该边界的物理或逻辑线（步行、驾车、飞行）。典型的物理外围边界示例包括地界线或建筑物/建筑群的外墙。\n\
  *   **内围边界**：该边界通常涉及物理屏障，如墙壁、门和窗，视外围边界的上下文而定，可以是外部的，也可以是内部的。\n*   **内部区域**：这是最内层的安全级别，由内围和外围边界包围的建筑物内部、办公室、工位等组成。\n\
  \n在一个全面的安全计划中，会涵盖对这三个层面的控制。每一层的安全通常由专门挑选的设备组合构成，它们协同工作以提供有效的物理安全系统。\n\n在每一层中，有两个概念在起作用：自然准入控制方法和领域强化。`Natural\
  \ access control`（自然准入控制）涉及利用自然设计元素（如建筑结构和景观美化）来引导人员进出空间。另一方面，`territorial reinforcement`（领域强化）则采用结构、系统和设备来防止未经授权的进入，并明确区分公共区域和私有区域。\n\
  \n如图 6.1 所示，基础设施安全运营和管理基于三种基本类型的子系统：\n\n*   访问控制和监控系统\n*   入侵检测和报告系统\n*   视频监控系统\n\
  \n![图 6.1 安全子系统](img/c06f001.png)\n\n**图 6.1** 安全子系统\n\n### 访问控制\n\n从上述列表可以看出，`access\
  \ control`（访问控制）是物理安全系统的首要核心组件。事实上，大多数安全专家都同意，任何基础设施安全系统的首要和最基本目标是威慑潜在入侵者。这就是访问控制的目标。*你无法破坏、损毁或窃取你无法物理接触到的东西*。\n\
  \n设计高效访问控制系统的基础涉及三个术语：`ingress`（入站/进入）、`egress`（出站/离开）和 `regress`（再入/返回）。根据定义，`ingress`\
  \ 是个人进入财产的权利，而 `egress` 是离开财产的合法权利。同样，`regress` 是指再次进入财产的合法权利。\n\n在安全术语中，`right`（权利）是指由某公认权威来源授予某人或某群体的\
  \ `legal privilege`（法律特权）或 `permission`（许可）。该来源可以是政府、合法认可的政府代理人或资产的合法认可所有者。延伸而言，拥有访问资产权利的人被称为\
  \ `authorized`（授权的，由认可的权威授权），而未被授予此权利的任何人则被标记为 unauthorized（未授权的）。当 `unauthorized`（未授权）人员试图访问其无权访问的资产时，他们就成为入侵者。\n\
  \n因此，访问控制涉及基于 `authorization`（授权）来控制对资产的 `ingress`、`egress` 和 `regress`。特别是，限制未授权人员访问重要资产，是你能采取的最基本的安全步骤。\n\
  \n访问控制始于外围边界。根据所研究的具体示例，这可能是组织物理财产的地界线，或其设施的大门。\n\n回顾一下，外围边界的目标是控制谁可以步行或跨越该边界。此处的控制可以很简单，如在财产边缘种植树篱，或设置适当的视觉标志警告未授权人员勿入；也可以很复杂，如带有大门和武装警卫的带刺铁丝网围栏。\n\
  \n访问控制工作通常延伸至外围和内围边界之间的区域。这些工作可以包括自然准入控制技术，如员工和访客停车场的战略性布局，以及利用景观特征将人员引导至指定的出入口，并阻断其他可能的进出点。这也延伸至清晰地标记设施和财产的\
  \ `ingress` 和 `egress` 通道。\n\n物理基础设施的内围边界控制涉及使用墙壁、窗户和门等物理结构，它们可作为 `barriers`（屏障），阻碍入侵者从外围边界推进到内部区域。同样，视具体讨论的安全场景而定，这些屏障可能是包围整个内部环境的建筑外部结构的一部分，也可以是控制进出个别工作区域的内部结构。\n\
  \n`Interior security`（内部安全）是基础设施安全的最内层级别，涉及对内围边界内区域的监控。这种监控可能由人力和电子安全系统共同组成，用于观察、跟踪和检测入侵者，以及记录各类活动的证据。授权人员与电子设备的结合，构成了内部安全级别的有效安全工具。\n\
  \n\n\n\n## 物理安全控制与认证系统\n\n### 安全策略与访问控制\n\n一个将三个安全层级整合在一起的关键组件是设计良好且文档完善的`security\
  \ policy`（安全策略），它规定了如何在每个层级实施安全。企业和组织制定全面的安全策略，定义谁被授权访问不同的资产，以及他们在访问这些资产时被允许做什么。\n\
  \n例如，允许员工和访客自由进入组织内的所有部门会带来各种安全风险。您需要维护访问控制，以创建一个减少人类贪婪本性诱惑的环境。如果每个人都可以在组织内部自由移动，就很难实施保护措施来防止他们访问或拿走物理或网络资产。\n\
  \n您还需要维护访问控制以防止意外事故。例如，您不希望销售代表不小心将咖啡洒在工程部门的生产服务器上。相反，应在每个层级制定一个连贯的`access control\
  \ policy`（访问控制策略），为授权人员提供对选定资产的适当访问级别，同时阻止未授权人员访问资产。然后，根据需要使用正确类型和数量的访问控制设备（传感器、屏障、日志、ID\
  \ 徽章或保安^(\\*)）来强制执行这些策略。\n\n通常，徽章或智能卡用于控制访问。当员工移动到 RFID 传感器的近程范围内时，也可以通过 RFID 应答器识别。应答器存储访问代码并使用无线电接收器和发射器。\n\
  \n这些访问控制技术、系统和设备将在本章剩余部分中详细讨论。\n\n### 物理安全控制\n\n强制执行访问控制措施最初可能包括在通往办公室的门上安装锁，并使用类似的`physical\
  \ barriers`（物理屏障）隔离部门或网络区域。许多公司的前门或入口处设有接待员以控制访问，如图 6.2 所示。在营业时间内，`receptionist`（接待员）充当物理屏障，询问客户来访的性质。\n\
  \n在某些机构中，访客可能需要由`escort`（陪同人员）陪同，以物理方式限制其在公司内的活动范围。为了增加访问控制，可以雇佣人工守卫来控制对特定受限内部区域（如实验室）或通往受限区域（如地下室）的电梯井的访问。\n\
  \n屏障可用于通过访问控制提供安全性。夜间，物理屏障可能只是一扇锁着的门。门也可能配备传感器和警报器。警报器可以是本地报警器（如警笛），也可以直接连接到外部监控系统或警察部门。\n\
  \n大多数安全边界的主要物理屏障是`lockable door`（可上锁的门）或`gate`（闸门），如图 6.3 所示。门提供物理屏障，但它本身只能挡住诚实的人。另一方面，锁通过其钥匙提供屏障的认证功能。持有`key`（钥匙）意味着该人拥有或知道获得通过门访问所需的信息。\n\
  \n![FIGURE 6.2 Physical barriers](img/c06f002.png)\n\n**图 6.2** 物理屏障\n\n![FIGURE\
  \ 6.3 Access control](img/c06f003.png)\n\n**图 6.3** 访问控制\n\n安全屏障有多种不同类型的锁。同样，也有多种不同类型的钥匙用于解除锁定机制。根据所使用的锁的类型，钥匙可以是物理的，也可以是逻辑的。\n\
  \n在大多数组织中，只有在特定办公室工作的选定人员才可能持有钥匙以进入其工作环境。保持严格的钥匙控制，并使用明确编码为不可复制的编号钥匙，有助于将锁门作为有效的物理屏障加以维护。\n\
  \n### 认证系统\n\n`Authentication`（认证）是确定某人是其声称身份的过程。回顾一下，有效的访问控制涉及基于`authorization`（授权）控制对资产的入口、出口和回归。特别是，限制未授权人员访问重要资产是您可以采取的最基本安全步骤。因此，授权基于认证。认证涉及多个因素：\n\
  \n*   `Knowledge`（知识因素）：只有指定人员应该知道的东西（您知道的东西）\n*   `Possession`（持有因素）：只有指定人员应该拥有的东西（您拥有的东西）\n\
  *   `Inherence`（固有因素）：只有指定人员才是的东西（您本身的东西）\n*   `Location`（位置因素）：只有指定人员所在的地方（您所在的地方）\n\
  \n许多物理认证系统基于依赖持有因素的`single authentication factors`（单因素认证），例如持有可开锁的钥匙设备。钥匙可以是物理钥匙或虚拟钥匙，视需要而定，用于开启物理或虚拟锁定机制。\n\
  \n更智能有效的认证方法涉及`two-factor authentication`（双因素认证），这是一个需要两个因素才能授予授权的过程。这基于知识和持有因素。高级授权和认证方法包括`multifactor\
  \ authorize and authentication systems`（多因素授权和认证系统）。在这些系统中，信息必须呈现给认证设备，后者将其传递给安全控制器的认证系统。访问控制系统中常用许多不同的认证设备。主要设备类型将在本章后续章节中介绍。\n\
  \n#### 安全与识别工具\n\n一个利用各种负担得起技术的安全产品新兴行业正在形成。这些技术使每位员工都能拥有某种物理设备，以提供其身份的数字保证。这些物理工具为认证提供`hard\
  \ token`（硬件令牌），代表双因素认证中的“您拥有的东西”方面。\n\n图 6.4 展示了这些常见的认证设备：\n\n*   Key fobs（钥匙扣）或其他专用无线设备\n\
  *   RFID badges and tags（RFID 徽章和标签）\n*   Smart cards and magnetic swipe cards（智能卡和磁条刷卡）\n\
  *   Mobile device applications（移动设备应用程序，如手机应用等）\n*   Biometric security devices（生物识别安全设备）\n\
  \n![FIGURE 6.4 Common security tools](img/c06f004.png)\n\n**图 6.4** 常见安全工具\n\n使用`near\
  \ field communication`（`NFC`，近场通信）的`Key fobs`（钥匙扣）——一种短距离无线连接标准，可用于在设备靠近时启动设备间通信——正成为一种流行的急救医疗识别解决方案。在`initiator`（发起设备）和`target`（目标设备）之间启动通信后，可能会使用另一种无线技术（如蓝牙或\
  \ Wi-Fi）接管并执行数据交换。虽然这些设备显示出巨大潜力，但在此类医疗 ID 设备的标准理顺之前，它们的用途将继续受限。\n\n钥匙扣的主要优势在于它可以附着在用户随身携带的物品上——至少大多数时间是这样。组织可以利用这项技术提供一个认证因素，同时将用户限制在给定的邻近范围内。例如，只要在钥匙扣的有效范围内，获得系统访问权限的员工可能只需将钥匙扣放在口袋里，并在访问面板上输入密码即可进行认证，如图\
  \ 6.5 所示。\n\n\n\n\n![图 6.5 遥控钥匙操作](img/c06f005.png)\n\n**图 6.5** 遥控钥匙操作\n\n遥控钥匙和其他硬件用户识别模块通常包含一个微控制器和一套精密的智能功能集，使它们能够提供几乎无限的选项。\n\
  \n#### RFID 徽章\n\n以类似的方式，`射频识别 (RFID)` 技术可部署为一种认证工具。如图 6.6 所示，RFID 系统利用自供电的 `RFID\
  \ 标签`，可用作信标以追踪位置或认证邻近度。`有源 RFID 标签`提供更长的范围，但价格昂贵得多，且需要更多电力。`无源 RFID 标签`由 RFID 读取器发射的电磁能量供电，价格可能非常低廉。低频\
  \ RFID 标签范围较短，但通常更可靠，且受金属屏障影响较小。\n\n高频标签范围较长，但任何障碍物都会造成更多干扰。现代 UHF RFID 标签即使放置在金属表面上似乎也能良好工作。无源\
  \ RFID 标签也常用于追踪库存物品和设备，并在许多应用中取代了条形码。\n\n回顾第 4 章“ICS 模块与要素加固”，`NFC` 是一种高频 RFID 标准，非常适合安全应用，因为它要求近距离接触。邻近性很重要，因为这可以最大限度地减少任何未经授权的隐蔽访问尝试。正如第\
  \ 4 章所述，创建流氓 RFID 读取器以从目标获取徽章数据相对容易，如图 6.7 所示。为徽章系统采用 `NFC` 技术可因其近距离要求而降低数据被窃取的风险。\n\
  \n![图 6.6 RFID 系统](img/c06f006.png)\n\n**图 6.6** RFID 系统\n\n![图 6.7 流氓 ID 徽章读取器](img/c06f007.png)\n\
  \n**图 6.7** 流氓 ID 徽章读取器\n\n防止此类 ID 盗窃的低技术手段是将卡或徽章放入保护套中，以挫败隐蔽读取器，并要求用户在认证时取出卡片。然而，这在实践中并不总是像预期的那样效果良好。防止未经授权的\
  \ RFID 卡访问的更技术性方法涉及使用奇特频率（或多个频率）或使用冷门的 RFID 读取器类型。\n\n然而，显而易见，如果 RFID 技术作为唯一的认证因素使用，不太可能是安全的。另一方面，在执行更严格的认证后，当用户尝试使用任何设备时，它仍然非常有利于识别用户。\n\
  \n### 智能卡\n\n`智能卡`包含一个嵌入式集成电路，可能仅仅是一个存储芯片或一个安全微控制器。它可能能够通过直接物理接触与读取器连接，或者在非接触式卡的情况下，通过有源\
  \ RF 接口进行通信。在某些情况下，智能卡可能采用 ID 技术的组合，如图 6.8 所示。\n\n![图 6.8 智能卡 ID 技术](img/c06f008.png)\n\
  \n**图 6.8** 智能卡 ID 技术\n\n`国际标准化组织 (ISO)` 和 `国际电工委员会 (IEC)` 已发布国际标准——`ISO/IEC 7816-4:2020`\
  \ 和 `ISO/IEC 1443`——用于非接触式智能卡和智能芯片的标准化。这些设备通常在 13.56 MHz 下运行，且必须在距离读取器 4 英寸范围内才能与其通信。\n\
  \n智能卡中的微控制器可编程以执行任意数量的安全功能。除了简单地在卡中`存储`信息用于认证目的外，还可实现许多高级卡上功能，包括`加密`和 `PKI 认证`服务，以及随机数生成、哈希和读取器验证。此外，生物特征数据可存储在卡上，并在认证过程中与读取器共享，以便读取器将该数据与从实时生物特征扫描仪接收的数据进行比较，如图\
  \ 6.9 所示。\n\n许多应用将智能卡视为任何包含智能功能集的卡、钥匙扣或便携式解决方案。它们难以复制，并可能包含额外的安全功能，使复制更加困难。\n\n\
  `磁条卡` 和 `条形码卡` 是提供单因素物理认证的廉价方式。它们通常易于复制，当然也易于窃取。然而，低成本也允许使用短期凭证频繁生成卡片，从而提高安全性。\n\
  \n![图 6.9 在智能卡上存储生物特征数据](img/c06f009.png)\n\n**图 6.9** 在智能卡上存储生物特征数据\n\n`移动设备（智能手机）`应用程序也可配置为：在进行更复杂的认证过程后，应用程序将与访问系统通信以提供一个认证因素。这使得\
  \ `智能手机应用程序` 能够复制或替代智能卡功能。\n\n使用移动电话的另一种方式涉及其短信功能。访问面板可通过基于邻近度的方法（甚至通过输入的用户名）识别用户，然后通过短信向该用户的移动电话发送临时访问代码，如图\
  \ 6.10 所示。自动化系统甚至可呼叫用户，并使用语音合成系统提供代码。`传呼机`（仅接收消息的移动 RF 设备）在医生中仍很流行，因为它们甚至在医院屏蔽最严重的区域也能工作。这些设备也可集成到安全解决方案中。\n\
  \n![图 6.10 使用短信进行访问控制](img/c06f010.png)\n\n**图 6.10** 使用短信进行访问控制\n\n只要设置过程是安全的，将这些设备用于认证角色并不比其他便捷的邻近解决方案更不安全。此外，这些\
  \ `自带设备 (BYOD)` 解决方案往往受许多用户欢迎，且非常具有成本效益。\n\n#### 生物特征扫描仪\n\n`生物特征识别`是用于描述利用人体物理特征验证个人身份的访问控制机制的术语。生物特征认证涉及使用独特的个人生理特征来验证人们是否为他们自称的身份。\n\
  \n每个人都拥有独特的物理特征，将他们与其他人区分开来。即使是同卵双胞胎也有独立且独特的 DNA、声纹、指纹、眼部特征和其他特征。生物特征认证中最常涉及的特质包括声纹、指纹、掌纹、签名、面部特征以及视网膜和虹膜扫描，如图\
  \ 6.11 所示。\n\n![图 6.11 典型生物特征认证方法](img/c06f011.png)\n\n**图 6.11** 典型生物特征认证方法\n\n\
  在每种情况下，都需要生物特征扫描设备将生理量转换为数字表示。结果存储在数据库中，可用于认证过程。底层应用程序将使用数据真正独特的特质作为基础，将未来的访问请求与之比较。如果未来认证请求的数据与存储版本的关键点匹配，则授予访问权限。\n\
  \n\n\n\n\n## 生物识别设备准确性\n\n然而，并非所有生物识别扫描设备在验证用户方面都具有同等的准确性。表 6.1 显示了不同生物识别扫描设备在准确验证人员方面的评级情况。\n\
  \n### 表 6.1 生物识别设备对比\n\n| 生物识别类型 | 误报率 (False Positive Rate) | 漏报率 (False Negative\
  \ Rate) |\n| :--- | :--- | :--- |\n| 掌纹 | 1.43% | 4% |\n| 面部结构 | 0.1% | 0.8–1.6%\
  \ |\n| 声纹 | 2–5% | 5–10% |\n| 眼睛（视网膜或虹膜） | 0.1% | 1.1–1.4% |\n| 签名 | 0.49% | 7.05%\
  \ |\n| 指纹 | 2.2% | 2.2% |\n\n对于指纹，美国政府的数据分别显示误报率和漏报率为 0.1% 和 0.4%。\n\n一般来说，人眼的特征——虹膜和视网膜扫描——往往使其成为最可靠的认证来源。在列表中剩余的生物识别变量中，指纹读取往往比语音扫描更准确。然而，指纹可能会留在光滑表面上并被后续利用。为克服这种可能性，已开发出指静脉扫描仪，可将指尖静脉模式转换为数字表示。另一方面，疾病和用户压力水平会影响语音模式。\n\
  \n如表所示，存在两种基本类型的认证失败：\n\n*   **类型 1，拒真（误拒）或假阴性失败**：这是一种导致对个人产生错误拒绝的报告，从而将本应拥有访问权限的人员拒之门外，无法进入设施或安全区域。\n\
  *   **类型 2，纳伪（误纳）或假阳性失败**：这是一种错误地通过个人认证的报告，可能导致向本不应拥有访问权限的人员提供设备或数据访问权限。在这两种认证失败类型中，此类最为严重，因为它可能向恶意人员授予访问权限。\n\
  \n由于存在误报和不准确的可能性，可能需要结合生物识别设备使用第二种访问控制方法。在需要更高安全性的区域，可使用护照、额外指纹或其他类型的验证，以确保个人未被错误识别。\n\
  \n### 远程访问监控和自动化访问控制系统\n\n*远程监控* 是指从远程位置或控制室对设备进行监控或测量。在安全领域，这涉及通过通信系统对安全系统进行外部访问。\n\
  \n*远程访问监控* 系统用于在尝试未经授权的访问时通知监管安全人员。在这些系统中，控制器监控基础设施传感器的*开/闭状态*。当传感器（如磁性开关或运动探测器）被触发时，系统会自动将其识别为入侵，并通知指定的安全人员。\n\
  \n可使用各种传感器来检测自动门或闸门的开启、关闭、上锁或解锁状态。它们也可被配置为在指定门或闸门处发起开启、关闭、上锁或解锁状态。\n\n在屏障开启和关闭之间经过的时间内，传感器与控制器之间的*信令*\
  \ 和*报告* 是持续进行的。如果屏障被敞开超过指定时间，该信息也会被系统记录和登记。状态监控系统包含事件日志，详细记录各种事件的时间和日期。以下是一些示例：\n\
  \n*   **上锁状态监控**：上锁监控是一项允许安全主管确认门已上锁的功能。除了监控门或闸门的上锁状态外，状态监控系统还可提供门或闸门保持上锁的时长和时间段详情。\n\
  *   **解锁状态监控**：状态监控系统可记录并发出信号，标识特定闸门或门每次被解锁（授予访问权限）的时间以及授予的访问类型。解锁监控还可识别获准访问的人员身份。\n\
  *   **时间段设置**：大多数自动化访问控制系统根据预配置的时间段设置，对有效或无效的进入请求（也称为*事务*）做出决策。这是正常的，因为任何不符合已识别用户预定义时间概况或时间表的进入请求都会受到怀疑。\n\
  \n这种情况可能发生在每日送货比预期到达时间晚的情况下。用户（本例中为已识别的送货代理）已通过识别，但正试图在未授权的时间进入。需要授权的人工主管介入以接受送货。\n\
  \n*通知* 可以采取安全控制面板上的可视通知、电话呼叫、即时消息或发送至智能手机的短信形式。通知还可以涉及激活频闪灯和高强度警笛，以引起对入侵企图的注意。图\
  \ 6.12 显示了远程访问典型安全系统的不同选项。\n\n![图 6.12 远程访问通信选项](img/c06f012.png)\n\n**图 6.12**\
  \ 远程访问通信选项\n\n*自动化访问控制* 功能为标准安全监控和报告功能增加了另一个维度。虽然自动化访问控制不是典型入侵检测和监控系统的组成部分，但它增加了外围访问控制的安全性和便利性。自动化访问控制系统主要有两类：*远程访问控制系统*\
  \ 和 *远程控制访问系统*。\n\n*远程访问控制* 是一项设计特性，要求对尝试从远程位置访问安全区域或计算机系统的用户身份进行认证。远程访问控制通过认证进入区域人员的身份来管理对受保护区域的进入。这可以通过多种方法实现，包括密码读取器、磁性钥匙卡和密码锁代码。\n\
  \n尽管差异细微，但 *远程控制访问* 系统的设计考量与远程访问系统不同。*远程控制访问* 是一项设计特性，它与远程监控系统配合工作，以远程监控、控制和监管门、闸门和传送设备。图\
  \ 6.13 显示了远程访问控制系统中涉及的典型组件。\n\n远程控制功能使安全专家能够与远程站点发起通信、输入访问代码、获取当前状况并设置系统参数。*闭路电视*\
  \ (*CCTV*) 系统可添加到安全系统中，为远程控制选项提供视觉识别功能。一些 *远程监控和控制系统*（如 图 6.14 所示）也可用于获取关于任何检测到超出编程值的传感器的状态消息，例如热、冷、水泄漏、巨响、报警历史或其他自定义功能。\n\
  \n![图 6.13 远程控制/访问操作](img/c06f013.png)\n\n**图 6.13** 远程控制/访问操作\n\n![图 6.14 远程监控系统](img/c06f014.png)\n\
  \n**图 6.14** 远程监控系统\n\n无线通信设备常用于连接自动化访问控制系统的组件。这种连接方式是一种经济高效的解决方案，消除了控制设备、对讲机以及电动安防闸门和门之间重新布线的需求。\n\
  \n## 入侵检测和报告系统\n\n\n\n\n\n## 物理安全：入侵检测与报警系统\n\n虽然防止未授权访问是物理安全的第一道防线，但额外的多层安全措施对于防止入侵升级为严重事件至关重要。与之密切相关的第二道防线是**入侵检测**，它能在潜在入侵者造成破坏前将其检测并清除。这一安全层级涉及受监控或可产生报警的检测设备（传感器）。\n\
  \n图 6.15 所示的基本商用**安全系统**组件协同工作，构成了一个功能完整的**入侵检测与报告系统**。该系统包含一个智能控制面板，通过电线（或无线电信号）连接分布在设施各处的传感器。\n\
  \n![图 6.15 基本入侵检测与报告系统](img/c06f015.png)\n\n**图 6.15** 基本入侵检测与报告系统\n\n控制面板包含电子元件和中央处理器，负责监控和控制整个系统。处理器接收来自连接的各类传感器的输入信息。在基本安全系统中，这些输入可分为三种截然不同的类型：周界、内部和火灾。\n\
  \n**周界区域输入**通常包括每个周界开口处的传感器，如门、窗、车库门以及通往地下室的门窗。额外的周界防护可包括使用声音、振动和运动探测器传感器，以防止通过破窗进入。\n\
  \n某些内部区域也可通过各类传感器进行防护，如运动探测器和内部门传感器。大多数安全系统还包含能够处理足量烟雾和火灾传感器的输入端口。\n\n当控制器从某个输入传感器接收到有效输入信号时，会根据其编程（及所需的应急响应类型）评估当前状况，并在必要时向**报警器**（警笛或警铃）发送相应的输出信号。根据编程指令，它还可能与指定的安全联系人（安全主管、监控服务或执法/消防机构）进行通信。\n\
  \n商用安全系统可采用多种通知方式，在报警条件触发时通知指定安全人员。部分报警系统使用电话拨号器告知远程安全联系人报警状况。这些系统设计用于无人在场时通过标准电话线或手机拨打电话。特殊的数字代码用于告知安全联系人导致报警的状况类型。\n\
  \n也可配备预设的**短信**系统，通过手机向指定安全联系人转发 SMS 消息。另一种选择是**基于 IP 的通知**，用于通过互联网等 IP 网络向监控站通报报警状况。\n\
  \n大多数安全系统通常采用某种键盘作为控制接口，供主管使用编程访问代码布防和撤防。键盘设计可提供一定级别的视觉和听觉输出信号，以帮助监控系统状态。\n\n最后，大多数安全系统包含某种应急备用电源（备用电池或不间断电源），在商用电源中断时为安全系统提供应急直流电源。\n\
  \n门禁控制与管理系统的组件和子系统选择范围广泛。以下章节将解释典型基础设施安全系统中入侵检测与报告部分常见的各种子系统。\n\n### 安全控制器\n\n任何智能安全系统的核心都是**安全控制器**。如图\
  \ 6.16 所示，安全控制器通常安装在一个机箱内，包含控制器主板、所有电子元件、接线端点、备用电池组和电话终端接线。\n\n![图 6.16 典型安全系统控制器](img/c06f016.png)\n\
  \n**图 6.16** 典型安全系统控制器\n\n安全控制器是入侵检测与报告部分的指挥中心和分发点，所有输入输出设备均连接于此。每个传感器从安全控制器获取电源并受其管理。\n\
  \n控制器必须具备足够的容量和功能，以连接和管理安全系统中的所有安防设备，并提供远程访问能力以实现远程监控和控制。\n\n控制器机箱应安装在隐蔽处，靠近 120\
  \ 伏交流电源插座，以便插入式变压器为整个系统提供低压电源。\n\n### 物理安全区域\n\n如前所述，安全控制器拥有固定数量的检测电路，用于创建**物理安全区域**。例如，典型商用安全控制器可能仅有\
  \ 8 个区域，也可能多达 250 个或更多。通常其中一个输入专用于火灾探测系统。图 6.17 展示了典型的八区安全控制器连接方案。\n\n![图 6.17 安全面板区域输入](img/c06f017.png)\n\
  \n**图 6.17** 安全面板区域输入\n\n假设待安装安全系统的设施有 14 扇窗户、2 扇人员出入门和一个仓库卷帘收货门。此外还有两条主要走廊需监控，并集成了火灾探测系统。\n\
  \n如何物理安装和配置控制器以实现对设施的全面防护？答案是将相关传感器逻辑分组创建安全区域。具体做法是将所有相关传感器开关（所有传感器在安全控制器中均表现为开关）以串联方式连接，如图\
  \ 6.18 所示。\n\n![图 6.18 创建物理区域](img/c06f018.png)\n\n**图 6.18** 创建物理区域\n\n控制器监控区域两个连接点之间的电流流量（称为**电流回路**）。回路需放置电阻以将电流调节至控制器所需的正确电平（不同控制器型号通常需要不同电阻值）。\n\
  \n若某传感器被触发，其开关转为断开状态，回路电流停止。控制器检测到无电流流动，并根据配置编程处理该输入。\n\n由于必须维持一定电流水平，这增加了篡改回路的难度。若系统使用常开开关（触发时闭合），只需剪断回路中的一根电线即可绕过系统——控制器永远不会收到信号。\n\
  \n\n\n\n\n## 分区概念\n\n对于前面介绍的示例安装，将所有西侧窗户传感器接线到一个输入端，并将其报告为 `West Side Windows`（西侧窗户）可能是合乎逻辑的。同样，两个人员进出门可以配置在一起，因为它们需要特殊设置，以便在离开或进入建筑物时，允许设置和撤防系统的退出和进入时间。相反，另一扇门可能会连接到不同的门区，或合并到其中一个窗户区，因为它没有时序要求。\n\
  \n分区还使系统能够针对特定区域的入侵检测即时发出警报，而特定区域（如主前门）的其他传感器警报可能需要短暂延迟后才发出警报。这使得安保人员在离开设施时，可以通过在键盘上输入秘密代码来布防系统（`exit\
  \ delay` 退出延迟）。\n\n它还允许他们在到达设施时进入受保护区域，并在指定的 `entry delay`（进入延迟）间隔内（通常为 30 到 45\
  \ 秒）通过进入区域的键盘撤防系统。此功能允许将键盘安装在设施内部靠近出口门的位置，以避免从室外区域对键盘进行破坏和篡改。\n\n守卫走廊的 `Interior\
  \ motion sensors`（内部运动传感器）可以集成到窗户或门区中。然而，它们更有可能与外部传感器分开配置，以便在夜间将其禁用，此时人们可能需要在内部走动，但希望周界免受外部入侵者的侵害。图\
  \ 6.19 描述了该示例的一种可能的分区解决方案。\n\n分区的使用还使安保人员能够仅布防系统的部分区域，例如周界门窗，同时 `bypassing`（旁路）特定区域内的内部运动探测器。`bypass\
  \ mode`（旁路模式）设置通常通过在键盘上输入预定的数字代码来完成。离开设施时，包括内部探测器在内的所有区域均可根据需要布防。\n\n分区安全系统布局还可供外部监控服务使用，以指示指定区域中哪个传感器触发了警报。如果传感器仅报告为传感器\
  \ 3、区域 5，这可能意味着事件几乎发生在任何地方。如果传感器报告为传感器 3、区域 5 周界，这将通知操作员违规区域位于场所外部。\n\n分区还提供了故障排除的便利性。例如，如果区域\
  \ 3 周界的传感器报告问题，则无需排查位于系统内部的传感器。\n\n![FIGURE 6.19 Zoning concepts](img/c06f019.png)\n\
  \n**图 6.19** 分区概念\n\n### 远程警报消息传递\n\n虽然 `strobe lights`（频闪灯）和 `sirens`（警笛）会在局部环境中引起对警报状况的普遍关注，但通常有必要通知特定人员（如安保专家）或组织（如第三方安保公司、消防部门或警务部门），以应对不同类型的警报状况。\n\
  \n最常见的 `remote notification systems`（远程通知系统）涉及安全系统控制面板使用 `telephone line`（电话线），在存在警报状况时自动呼叫远程监控设施或关键人员。当安全控制器从其某个区域接收到有效输入信号时，它会激活电话拨号器单元，并导致数字数据消息传输给预定的接收者。消息接收者在离开设施时也可以使用远程访问来检查安全系统的状态。\n\
  \n一些入侵检测和报告系统采用独立的 `telephone dialer`（电话拨号器），如 图 6.20 所示，或内置拨号器。然而，越来越多的系统具备内置的\
  \ `cellular communications systems`（蜂窝通信系统）。此类系统提供了额外的可靠性，因为即使物理电话线路受损，它们仍能正常工作。\n\
  \n![FIGURE 6.20 Automatic voice/pager dialer console](img/c06f020.png)\n\n**图 6.20**\
  \ 自动语音/寻呼拨号器控制台\n\n### 第三方警报监控服务\n\n根据组织的性质，入侵检测和报告系统可能完全基于组织的员工。然而，在许多组织中，安全系统由专业的第三方警报监控公司提供支持。\n\
  \n这些公司收取月费，提供 24 小时/每周 7 天的监控服务。当它们收到警报通知时，会根据与订阅者（客户）公司的合同协议执行响应操作。\n\n响应的顺序通常与它们收到的警报通知的性质以及接收时间相对应。它们可能会首先尝试联系指定人员，或者在发生无人应答的警报状况时，尝试联系执法或消防部门机构。它们还可能从监控公司派遣武装或非武装安保人员前往调查警报。\n\
  \n## 视频监控系统\n\n`Video surveillance systems`（视频监控系统）是大多数商业安全系统的重要组成部分。许多组织在其基础设施安全系统中包含可见摄像头，以威慑非法活动，并记录发生在周界或关键内部区域的事件。\n\
  \n视频监控系统基于 CCTV 系统。该名称源于通过“闭路”或专用传输电路而非标准电视广播系统传输信号的系统类型。图 6.21 显示了基本视频监控系统的主要组件。常见组件包括以下内容：\n\
  \n*   一个或多个视频摄像头\n*   延时视频录像机\n*   切换器（可选）\n*   视频显示监视器\n\n![FIGURE 6.21 A basic\
  \ video surveillance system](img/c06f021.png)\n\n**图 6.21** 基本视频监控系统\n\n在该基本系统中，摄像头监控其视野并将信息传递给视频处理设备。在大多数情况下，该设备由某种类型的数字视频录像机组成。\n\
  \n在某些情况下，来自摄像头的视频信息流由 `passive infrared`（`PIR` 被动红外）`detectors`（探测器）控制。如果 PIR 探测器的视野中没有\
  \ PIR 特征（由体热产生），则不传输视频信息。然而，在运动检测的事件期间，视频信息会从摄像头流向视频录像机。在此类事件中，可以指示摄像头加快每秒记录的帧数，以提供更精细的细节。\n\
  \n一些系统基于 `coaxial cable`（同轴电缆）进行组件连接，而另一些则是 `IP-based`（基于 IP）的，依赖无线 Wi-Fi 通信或传统网络布线。\n\
  \n数字视频处理设备可直接向 `video display`（视频显示器）提供视频输出，或将其传送至 `video switcher`（视频切换器）。在某些情况下，视频处理组件可能提供其自身的集成切换器。\n\
  \n### 摄像头\n\n`Surveillance systems`（监控系统）使用视频摄像头，将所见图像转换为标准视频传输格式——`composite video`（复合视频）、`component\
  \ video`（分量视频）、`S-Video`（S-视频）或 `HDMI` 信号——以便在视频输出设备（如监视器、电视显示器或个人计算设备）上显示。\n\n\
  最好的监控摄像头采用 `charge-coupled device`（`CCD` 电荷耦合器件）技术作为其 `image sensor`（图像传感器）。这些设备提供高分辨率、低照度工作要求、较小的温度依赖性和高可靠性。图\
  \ 6.22 显示了视频监控系统中使用的典型 CCD 摄像头。\n\n![FIGURE 6.22 Video surveillance camera](img/c06f022.png)\n\
  \n\n\n\n## 视频监控摄像机\n\n**图 6.22** 视频监控摄像机\n\n监控摄像机可采用数字或模拟接口技术。`数字摄像机`将检测到的图像直接转换为数字信号，可轻松传输给数字计算设备并进行处理。`模拟摄像机`基于较旧的模拟电视信号和分辨率标准。此类摄像机需要单独的同轴电缆连接到监视器或录像设备。\n\
  \n数字摄像机通常比模拟摄像机提供更优越的性能。模拟摄像机更容易导致所传输信息的质量下降。\n\n### IP 摄像机\n\n`IP 摄像机`实际上是具有 `IP\
  \ 地址` 的 `数字 IP`（互联网协议）`设备`，可直接连接到网络或互联网，而非直接连接到主机控制器或计算机。使用 IP 摄像机（如 图 6.23 所示）的优势在于，只要有互联网接入，就可以在世界任何地方查看。\n\
  \n![图 6.23 IP 摄像机](img/c06f023.png)\n\n**图 6.23** IP 摄像机\n\nIP 系统与其他视频技术的区别在于：能够发送运动检测的电子邮件通知、处理同时用户登录，以及执行\
  \ `FTP` 或（如果可用）`安全 FTP`（`sFTP`）上传操作。这些摄像机的另一优势是可由 `以太网供电`（`PoE`）供电，即通过 UTP 网线供电，而非为每个摄像机配备专用电源。\n\
  \n### 云台-变焦摄像机\n\n具有 `云台/俯仰/变焦`（`PTZ`）功能的网络 IP 摄像机（如 图 6.24 所示）是一种独立设备，允许用户从任何地方查看实时全动态视频。此类摄像机设计用于专有计算机网络或互联网，仅使用标准\
  \ Web 浏览器作为显示单元。\n\n不仅提供手动 PTZ 控制，还能远程指定每个支持 PTZ 的摄像机的数十个预设位置。\n\n#### 摄像机规格\n\n\
  影响摄像机成本的两个重要规格是 `照度等级` 和 `分辨率`。摄像机的分辨率规格标注方式取决于它是 `模拟摄像机` 还是 `数字摄像机`。模拟摄像机的分辨率以其从显示器顶部到底部能生成的\
  \ `水平线数` 来表示。对于数字摄像机，分辨率则以其产生的 X×Y（水平对垂直）点（`图像元素` 或 `像素`）矩阵格式来表示。图 6.25 说明了不同摄像机分辨率规格的含义。\n\
  \n![图 6.24 PTZ 摄像机](img/c06f024.png)\n\n**图 6.24** PTZ 摄像机\n\n![图 6.25 模拟和数字摄像机分辨率](img/c06f025.png)\n\
  \n**图 6.25** 模拟和数字摄像机分辨率\n\n获得合理的视频摄像机图像所需的光量称为 `照度等级`。`勒克斯` 是落在物体上的光量的度量单位。1 勒克斯约等于从\
  \ 1 米外测量的 1 支蜡烛在 1 平方米上产生的流明数。典型的摄像机等级范围在 0.5 到 1.0 勒克斯之间。\n\n摄像机标称的 `照度等级` 越 `低`，其在低光照水平下区分物体的能力越强。反之，对于给定的监控摄像机，分辨率\
  \ `线数` 越 `多` 或 `像素` 数越 `大`，显示视图精细细节的效果越好。\n\n#### 镜头类型\n\n监控摄像机有多种镜头规格。镜头尺寸决定了摄像机的\
  \ `视场` 和变焦能力。一般来说，镜头越大，视场越窄且变焦倍数越高。例如，焦距为 3.6 mm 的定焦镜头设计视场约为 72 度，而 6 mm 焦距的镜头视场应为\
  \ 44 度。通常规则是，镜头焦距越短，视场越宽。\n\n另一方面，焦距较短的镜头也会产生摄像机可获取的视图。在 16 英尺（5 米）距离下，3.6 mm 定焦镜头可能仅能提供停车场内物体的大致轮廓，而同一摄像机配备\
  \ 12 mm 镜头则能提供视场内物体（如人脸和车牌号）的清晰细节，但可能仅覆盖设施的一小部分。\n\n您还必须确定安装监控摄像机的目的——是为了提供可见的威慑，还是用于收集法律证据？始终重要的是选择镜头规格能捕获所需监控区域的摄像机。常见的安防摄像机镜头类型包括：\n\
  \n*   `变焦镜头`：这些是包含多个可移动元件的光学组件，允许改变有效焦距（EFL）。与变焦镜头不同，变焦镜头每次变更都需要重新聚焦。如果监控摄像机配备定焦镜头，则只能看到一个固定位置。如果配备变焦镜头，则可根据用户偏好在多个毫米设置下聚焦。\n\
  *   `定焦镜头`：这些镜头不提供聚焦操作手段，无论被摄体距离远近。\n*   `广角镜头`：这些镜头提供比标准镜头更宽的图像，适用于狭小区域。\n*   `长焦镜头`：这些是远距离查看细节的最佳镜头类型。\n\
  *   `鱼眼镜头`：这种镜头可让您看到整个房间，但图像会有一定失真。\n*   `针孔镜头`：此镜头用于摄像机/镜头必须隐藏的应用场景。镜头前端有一个小孔，允许镜头通过墙上的小孔查看整个房间。\n\
  \n#### 黑白（B&W）与彩色\n\n有一种普遍的误解，认为彩色 CCTV 摄像机比 `黑白 CCTV 摄像机` 提供更好的画面。现实是，虽然彩色摄像机观看起来更舒服，但两种摄像机都完全能提供高质量画面。真正的问题是哪种摄像机更适合特定情况。\n\
  \n彩色和黑白摄像机最重要的实际区别在于：只有彩色摄像机能提供完整准确的衣着和车辆描述。执法部门在响应服务呼叫时高度依赖报告的衣着颜色和嫌疑车辆颜色，因为这极大地增加了抓捕逃跑嫌疑人的可能性。\n\
  \n#### 红外照明\n\n具有图像区域 `红外照明` 的摄像机允许在低光条件下查看。这还提供了一定程度的隐蔽性，因为使用的是可见光谱之外的照明。\n\n红外安防摄像机在摄像机镜头外侧安装了红外\
  \ LED 灯（人眼不可见的电磁波谱区域的光）。这种照明使摄像机能在无光环境下捕获良好图像。在少量光线（低光环境）下，红外摄像机捕获的画面看起来就像白天一样。典型的\
  \ IR 摄像机如 图 6.26 所示。\n\n![图 6.26 IR 摄像机](img/c06f026.png)\n\n**图 6.26** IR 摄像机\n\
  \n#### 摄像机应用\n\n\n\n\n## 监控摄像头部署\n\n监控摄像头可安装在设施室外，以识别想要进入安全周界区域（如前门或车道大门）的人员。它们应安装在不存在盲区或不适合使用其他类型传感器的位置。只要该区域在天黑后始终有充足的照明，摄像头就可以安装在设施需要覆盖的任何表面区域。\n\
  \n使用视频监控摄像头涉及特定的法律影响。特别是部署监控摄像头时必须考虑隐私问题。不得在个人具有`合理隐私期望`的地方使用它们。这显然不适用于闯入设施的人员。\n\
  \n摄像头的其他应用包括以下类别：\n\n*   **室内/室外**：室内摄像头通常比室外类型便宜，因为室外摄像头必须安装在防风雨外壳中。室外摄像头的布线也必须适应极端温度和季节性天气条件。\n\
  *   **昼/夜**：可提供这样一种摄像头，它能从白天的彩色成像切换到夜间的黑白成像，以便在光照过低无法进行彩色成像时工作。这为白天监控时的良好彩色分辨率和夜间光照不足时的黑白成像提供了最佳折衷方案。\n\
  *   **固定 vs. 可动**：固定配置安装的摄像头始终显示相同区域。它们适用于监控重要区域，如高风险区域（停车场和门口入口）。可动摄像头（如前所述的`PZT`摄像头）提供移动能力。它们安装在万向节组件上，可改变视野范围，并支持变焦、水平旋转和垂直俯仰。\n\
  *   **录像与外部/内部触发**：数字视频录像机（`DVR`）是监控摄像头的首选录像系统，而非旧式的 VCR。摄像头可配置为仅在触发器产生以启动录像时进行录制。\n\
  \    *   触发器可以是内部类型，即画面变化时开始录制。外部触发器可编程为在报警条件存在或运动探测器触发录像机开始录制时启动录制。\n*   **顺序切换\
  \ vs. 多路复用**：顺序切换允许将多个摄像头与单个显示器配合使用。切换器可编程为循环浏览监控系统中的所有摄像头，或在每个摄像头上停留指定时长，通常为 1\
  \ 到 60 秒。\n    *   多路复用器将监控系统的图像路由到特定显示设备，并能通过在显示器上平铺图像，同时录制所有摄像头的图像。\n\n### 摄像头部署策略\n\
  \n投资安防摄像头的目的是能够查看关键区域或关键资产所在位置的活动。除了确定安防摄像头针对特定角色必须具备的规格外，规划摄像头`部署策略`以最大化监控投资回报同样重要。\n\
  \n为实现这一目标，摄像头的定位应能捕捉所有关键安全区域内的重要事件。特别是，它们应安装在`通道`以及视野覆盖重要资产（物理设备和/或人员）的位置。\n\n通道包括物理设施中的`关键点`，人员或其他交通必须通过门户（如大门、门口、走廊或出入道路）通过。通道中的摄像头通常用于记录进出设施及在设施内的移动情况，如图\
  \ 6.27 所示。\n\n![图 6.27 监控通道](img/c06f027.png)\n\n**图 6.27** 监控通道\n\n安全摄像头也经常安装在覆盖设施内重要资产和活动的位置。这使管理层能够监控与这些重要资产相关的周边活动。\n\
  \n银行大厅是这两种布局策略的绝佳示例；摄像头定位以记录银行停车区和室外的活动，以及通往金库和办公室的走廊内的活动，如图 6.28 所示。此外，大多数银行都安排摄像头聚焦于每个出纳柜台，以监控现金处理和交易过程。\n\
  \n![图 6.28 资产监控](img/c06f028.png)\n\n**图 6.28** 资产监控\n\n确定实际摄像头位置首先取决于决定摄像头是需要提供`概览`还是`详细视图`。`概览`通常覆盖宽广的视野，如停车场或仓库地面。相反，`详细视图`用于针对特定关注区域的相对狭窄视野，如前所述的银行出纳柜台。\n\
  \n安装涉及的摄像头数量取决于已确定用于查看/监控的通道和资产数量。在某些情况下，这取决于组织规模，在其他情况下则取决于资产价值和物理地理环境。\n\n例如，小型运营可能只需安装单个摄像头即可监控其关键资产。对于中型运营，安装通常涉及数十个摄像头。在大型组织中，可能部署数百个摄像头以满足其安全和监控需求。目标是通过风险分析程序有效覆盖已识别的区域和资产。这些程序在第\
  \ 8 章“ICS 安全治理与风险管理”中详细讨论。\n\n确定安装点后，部署策略的下一步是确定每个安装点所用摄像头的规格。一般来说，有四个关键特性需要考虑：\n\
  \n*   **是否需要固定或可移动视野？** 固定摄像头通常用于概览功能。它们提供固定视野，因此必须设置为有效覆盖所需的通道或资产。因此，它们必须具有覆盖这些项目所需的焦距和角度。\n\
  \    *   远程控制的 `PZT` 摄像头通常用于需要详细视图的场合。然而，在某些情况下，在不同位置安装多个固定摄像头可能比安装单个需要专人操作才能有效工作的\
  \ `PZT` 摄像头更经济。\n*   **需要哪种类型的图像显示？** 根据本章前面的讨论，你应该记得常见的图像显示选项包括以下内容：\n    *   **彩色**：彩色摄像头是当今视频监控应用中的默认通用摄像头。彩色摄像头落后于其他摄像头技术的一个应用场景是低光环境。在这些情况下，通常建议使用红外或热成像摄像头。\n\
  \    *   **红外**：红外摄像头可在极低光照环境下提供清晰的黑白图像。然而，它们的价格通常比彩色摄像头贵得多。\n    *   **热成像**：热成像摄像头价格通常非常昂贵，且仅能生成轮廓图像。然而，它们也完全不需要光线即可工作。\n\
  \n\n\n\n\n### 视频监控系统设计考量\n\n#### 显示清晰度要求\n*   **需要何种级别的显示清晰度？** 标准视频显示是否满足当前视图需求，还是需要更高清晰度？标准清晰度系统最大的缺陷在于其无法提供足以让执法部门和法院在犯罪发生后确凿识别犯罪嫌疑人的信号。\n\
  \n#### 信号处理与传输方式选择\n*   **哪种信号处理和传输方式最适合该安装环境？** 如前所述，选项包括模拟、数字和 IP 摄像头。IP 摄像头因其电子化捕获和传输数据的能力，正逐渐超越其他类型摄像头而被广泛接受。\n\
  \nIP 摄像头提供的连接选项比传统模拟和数字摄像头更健壮。它们可直接与主机配合工作，无需额外硬件。此外，它们与无线网络选项的兼容性也优于其他摄像头技术。\n\n\
  #### 视频存储需求规划\n出于安全目的录制视频时，另外两个重要考量是：**需要存储多少视频？** 以及 **需要存储多长时间？** 这些问题的答案决定了组织的\
  \ *存储容量* 需求。\n\n安全视频本质上需要大量的 *存储空间*。因此，存储成本与组织面临的风险之间始终存在权衡。单个视频监控摄像头一天就可能消耗数 GB\
  \ 的存储容量。考虑到这一点，组织需要存储监控视频的时长成为一个关键决策点。根据组织性质及面临的风险类型，存储需求可能要求为每个安装的摄像头存储数周甚至数月的视频。\n\
  \n如前所述，大多数组织不会仅部署单个摄像头用于监控；他们可能部署数十甚至数百个摄像头。存储来自如此多摄像头的视频数据，轻松便可能需要数百 TB 的数据存储。\n\
  \n满足此类需求常采用以下三种常见视频存储类型：\n\n*   **内部存储**：将视频信息存储在 DVR 的内部磁盘驱动器（或驱动器阵列）中。此方案仅适用于摄像头数量少、仅短期存储视频信息的小型组织。\n\
  \n*   **外围存储或直接附加存储（DAS）**：该技术采用通过 USB 或 eSATA 连接直接附加到 DVR 的额外磁盘驱动器存储设备，如 图 6.29\
  \ 所示。直接附加存储不涉及使用 IP 地址将视频卸载到外部设备。\n\n    ![图 6.29 DAS 视频存储](img/c06f029.png)\n\n\
  \    **图 6.29** DAS 视频存储\n\n*   **网络存储**：利用网络技术将基于 IP 的视频存储在远程计算机或视频服务器上。最常用的技术包括网络附加存储（NAS）和存储区域网络（SAN）技术，如\
  \ 图 6.30 所示。\n\n    ![图 6.30 NAS 和 SAN 存储系统](img/c06f030.png)\n\n    **图 6.30**\
  \ NAS 和 SAN 存储系统\n\n## ICS 物理安全\n\n工业或公用事业环境中的第一道防线必须建立在物理层面。与所有其他网络环境一样，*物理安全*\
  \ 涉及采取措施防止盗窃、防止物理损坏、维护系统完整性和服务、以及限制未经授权的信息泄露。\n\n在工业和公用事业环境中，物理安全设备和措施的部署通常受多种因素制约，包括环境、安全、法规、法律及其他超出组织控制范围的要求。必须识别这些因素并将其纳入组织的整体安全计划。在许多情况下，该计划与组织的整体\
  \ *工厂安全计划* 紧密集成。\n\n除了防范攻击者对设备的物理接触外，每项资产的运行环境必须与其设计规范相兼容。这包括提供合理的保护，防止丢失、火灾、盗窃、非故意泄露或环境损害。\n\
  \n除了在正常运行期间保护这些资产外，在资产运输和/或维护期间提供物理安全控制也至关重要。这涉及为所有 OT/IT 网络资产的运输、处理、存储、执行维护程序、以及退役/销毁工作制定并实施具体的政策和流程。\n\
  \n### 工业流程/发电设施\n\n工业环境物理安全计划的主要目标之一，是在让人员远离危险环境的同时，仍使其能够胜任工作。当然，必须建立物理访问控制，以强制限制对生产流程物理组件和\
  \ OT 系统的访问。在 OT 环境中，这些措施用于防止多种不良活动，包括：\n\n*   窃取、损坏、破坏、修改或操纵 OT 设备或系统，包括通信介质和接口\n\
  *   对关键或敏感资产进行视觉或摄影观察，包括不得拍照或通过其他方式创建流程图像\n*   为硬件操纵、追踪、通信嗅探或窃听等目的，将未经授权的系统或设备引入\
  \ OT 系统\n\n除了为 ICS 设备提供物理隔离外，还必须通过色码标记和标签清晰地标识这些设备为 ICS 设备。\n\n传感器和执行器需要的保护程度与过程控制器和网络设备同等重要。如果输入设备在未被察觉的情况下被物理接触，则可能被操纵以伪造过程系统数据。后果可能导致对过程的完全失控，或在一段时间内微妙地产生有害影响。\n\
  \n### 控制中心/公司办公室\n\n在控制中心或企业办公设施中，物理安全通常呈现出更多的企业安全特性。这些环境中的主要关注点在于限制对环境中任何信息资产的物理访问。\n\
  \n*   未经授权物理访问敏感区域，如服务器机房和安保办公室\n*   未经授权物理访问服务器、SCADA 主站和历史服务器及其上的数据\n*   未经授权物理访问用户计算机、交换机和路由器\n\
  \n与 IT 网络环境类似，OT 主站、服务器和历史服务器应位于上锁区域，用于这些位置身份认证的设备和机制也应受到保护。同样，OT 网络上的任何网络连接设备（网络交换机、路由器和介质）应位于安全区域，最好是仅授权人员可访问的区域。\n\
  \n#### 物理服务器访问控制\n\n从最基本的层面来看，网络管理员必须掌控其物理服务器环境，以提供全面的安全设置。这通过严格限制对 *服务器* 的物理访问来实现。最常见的做法是将它们放置在受保护的\
  \ *服务器机房* 中，这些机房的门和计算机机箱均配有自动锁。\n\n\n\n\n根据网络的管理结构，服务器（或网络）管理员通常负责确定哪些人员可以进入服务器室，并可能要求在服务器室内工作的任何人进行登记。应立即向管理员报告服务器室内未经授权人员的存在。应向相应的管理员报告违反任何服务器室安全措施的行为，以便采取纠正措施。\n\
  \n为了提供硬件安全，公司和公用事业单位通常在服务器室及其服务器机器和机架中放置*物理入侵检测系统*，例如运动传感器、读卡器、摄像头和报警器。它们还在服务器室的门以及每个单独的服务器机架上安装锁。它们也可能锁定每个服务器机箱。图\
  \ 6.31 说明了典型的服务器安全措施。\n\n![FIGURE 6.31 Server security points](img/c06f031.png)\n\
  \n**图 6.31** 服务器安全点\n\n#### 远程监控\n\n虽然防止未经授权的访问是物理安全的第一道防线，但额外的安全措施层对于防止安全漏洞升级为严重事件至关重要。密切相关的第二层防线是*入侵检测*，它能够在潜在入侵者造成问题之前对其进行检测和清除。这一级别的安全涉及受监控或能够产生警报的检测设备。\n\
  \n这些入侵检测设备提供远程监控功能，可由主办公室的操作员全天候（24/7/365）监控。SCADA 系统还可以处理图像、数据和报警条件，向不在运营中心的关键人员发送通知，例如非值班安全经理、私人安保响应团队或其他首批响应人员。\n\
  \n监控远程设备的性能以检测恶化状况和/或安全事件也很重要。SCADA 系统应提供对特定远程安全设备、智能过程控制器和网络设备的监督监控，以及电力系统的整体性能监控。\n\
  \n### NERC CIP-006-1\n\n在北美，电力公用事业系统由一个称为*北美电力可靠性公司*（*NERC*）的组织管理。其对公用事业安全的主要贡献之一是创建和管理行业的*关键基础设施保护*（*CIP*）标准。这些标准旨在帮助*大型电力系统*（*BES*）运营商（发电商和供电商）保护其物理和网络资产。\n\
  \nCIP 标准的不同组成部分分布在本书的几个章节中讨论。本章特别关注*CIP-006-1*：*关键 BES 网络资产的物理安全*所规定的要求。\n\n该标准要求\
  \ BES 运营商制定并实施包含计划和策略的战略，以保护其关键网络资产免受未经授权的物理访问。虽然每个组织在如何满足要求方面有一定的自由度，但其计划和策略必须涵盖以下领域：\n\
  \n*   实施并记录可接受的物理访问控制方法\n*   实施并记录其物理安全边界所有入口点的监控和日志记录\n*   实施并记录访问日志保留策略\n*   实施物理访问控制维护和测试计划\n\
  \n该计划可结合使用智能卡钥匙、锁和边界控制等物理访问控制。BES 设施中使用的典型边界控制包括带锁大门的围栏、控制室或岗亭、警卫和现场访问策略。根据此 CIP\
  \ 标准，计划中指定的物理访问控制必须全天候（每天 24 小时，每周 7 天）处于激活状态。\n\n监控可作为物理访问控制的补充或替代。BES 设施中采用的典型监控措施包括物理入侵检测和控制系统（检测受控区域内运动或进入的报警系统）、视频监控系统和人工观察计划。与物理访问控制一样，物理访问监控控制必须全天候（24/7）运行。所有未经授权的访问尝试应立即审查，并按照\
  \ CIP-008 要求中规定的程序处理。\n\n必须全天候（24/7）记录通过物理安全边界任何入口点的物理进入情况。日志系统必须能够唯一标识个人及其访问时间。该计划还必须规定物理访问日志的保留策略。普通日志必须至少保留\
  \ 90 天，而可报告事件日志的保留期在 CIP-008-6 中规定为三个日历年，详见第 10 章“ICS 安全监控和事件响应”。\n\n为了满足 CIP-006\
  \ 标准，该计划必须包含维护和测试程序，以确保所有控制措施均正常运行。\n\n## 复习题\n\n以下问题测试您对本章所呈现材料的掌握程度。\n\n1.  \\\
