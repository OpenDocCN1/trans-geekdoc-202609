  \n5.  描述攻击面分析过程的第一步。\n\n6.  哪种网络安全流程旨在指明设备或系统的哪些方面代表漏洞，以便组织了解与该特定设备或系统相关的风险？\n\n\
  7.  确定生产组织在订购 OT 设备时，应从其供应链中寻找的网络安全保证。\n\n8.  \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\\
  _\\_ 旨在让组织利用资源（外部或内部）尝试闯入其网络或系统，并可能对其发起攻击，目的是获取信息，告知网络所有者如何修复其网络的不安全因素。\n\n9.  哪个术语描述了用于向显示特定漏洞的目标系统投放载荷的工具？\n\
  \n10.  白帽黑客会使用哪类工具来捕获数据包在网络中移动时的数据包，然后记录数据包并解码其原始数据，以便分析数据从而监视网络用户？\n\n11.  黑客会使用哪类安全工具来探测网络服务器和设备的开放端口，并识别主机上运行的服务以进行潜在利用？\n\
  \n12.  黑客会使用哪种软件包来扫描组织网络中的不同类型的常见漏洞，例如系统错误配置和默认密码使用？\n\n13.  \\_\\_\\_\\_\\_\\_\\\
  _\\_\\_\\_\\_\\_\\_\\_ 是设计用于探测计算设备的开放逻辑端口及其关联服务的软件工具。攻击者使用这些工具来定位并利用目标设备（如服务器或端点）上的漏洞。\n\
  \n14.  哪种类型的软件工具用于发现网络上的授权和未授权设备？\n\n15.  您受雇闯入 ACME 公司的企业网络。该组织未向您提供任何关于其网络的内部信息。您被雇佣执行哪种类型的渗透测试？\n\
  \n## 考试题\n\n1.  安全评估的哪个阶段使用自动化工具在网络中搜索安全问题？\n\n    1.  发现阶段\n    2.  漏洞扫描\n    3.\
  \  漏洞评估\n    4.  利用阶段\n\n2.  哪类安全测试工具可用于识别活动端口和易受攻击的服务？\n\n    1.  数据包分析器\n    2.\
  \  网络映射器\n    3.  漏洞扫描器\n    4.  网络枚举工具\n\n3.  危险与可操作性研究 (HAZOP) 中故障模式、影响及关键性分析\
  \ (FMECA) 部分涉及的一般领域有哪些？（选择所有适用项。）\n\n    1.  故障模式\n    2.  不利业务影响\n    3.  影响分析\n\
  \    4.  关键性分析\n\n4.  ICS 设备制造商通常在其设备上执行哪种设备测试，以确保设备在面对常见网络攻击方法时，保持运行性能和安全保障等级 (SAL)\
  \ 的能力？\n\n    1.  端口扫描测试\n    2.  数据包扫描测试\n    3.  协议模糊测试\n    4.  MTBF 测试\n\n5.\
  \  以下哪个渗透测试团队负责对组织网络发起攻击？\n\n    1.  红队\n    2.  蓝队\n    3.  白队\n    4.  金队\n\n\
  6.  哪类渗透测试用于模拟拥有客户关键网络基础设施深入了解及访问凭证的恶意内部威胁？\n\n    1.  白盒测试\n    2.  灰盒测试\n    3.\
  \  黑盒测试\n    4.  透明盒测试\n\n7.  从列表中识别出属于工业自动化与控制系统 (IACS) 安全七大基础要求成员的项目。（选择所有适用项。）\n\
  \n    1.  访问控制\n    2.  无限制数据流\n    3.  使用控制\n    4.  网络资源可用性\n    5.  数据加密\n\n\
  8.  识别您将用来发现网络上连接有未授权设备的工具。\n\n    1.  网络枚举工具\n    2.  端口扫描器\n    3.  漏洞扫描器\n  \
  \  4.  网络监控工具\n\n9.  以下哪项活动会在黑盒渗透测试的初始侦察阶段执行？\n\n    1.  设计针对 ACME 公司网络的特定攻击计划。\n\
  \    2.  实施心理社会工程学尝试以获取关于 ACME 公司网络的信息。\n    3.  安装命令与控制软件以监控 ACME 公司网络的漏洞。\n  \
  \  4.  扫描 ACME 公司网络的攻击面。\n\n10.  如果安全管理员检测到外部端口扫描活动以及漏洞扫描的迹象，他们应该假设什么？\n\n     1.\
  \  他们的渗透测试人员正在对网络进行漏洞测试\n     2.  他们的入侵检测系统需要重新配置以消除误报通知\n\n\n\n\n3.  他们的入侵防御系统需要重新配置以消除误报（漏报）通知\n\
  \n4.  后续攻击极有可能即将发生\n\n# 第 10 章\n\nICS 安全监控与事件响应\n\n## 简介\n\n组织的网络安全策略应包含若干相互依赖的计划，协同工作以解决以下领域：\n\
  \n*   配置管理\n*   补丁管理\n*   补丁测试\n*   组织/本地数据备份/检索\n*   事件响应\n*   灾难恢复\n\n在网络安全策略计划完全制定并实施后，定期评估计划的所有组成部分非常重要；审查系统状态、功能、设计等方面的任何变更；并确保该计划持续反映组织安全态势的正确信息。该文档及其准确性对于维持组织的网络安全水平至关重要。\n\
  \n策略应规定操作实践和实施标准，以执行以下活动：\n\n*   通过建立网络及其组件的连接性、设备配置、系统运行和性能基线，测试并记录计划的初始实施情况。\n\
  *   监控系统的物理和操作参数，包括连接性、设备配置、网络运行和性能变化。\n*   监控系统中发生的事件和事故。\n*   以有序且受控的方式管理系统的必要变更。\n\
  *   每当网络中发生事件时，执行组织的事件响应计划，以响应网络事件并从中恢复。\n\n本章阐述网络安全策略中的 `配置管理`、`补丁管理` 和 `事件响应`\
  \ 部分如何在网络安全计划实施后，被用于维持组织网络安全计划所确立的网络安全水平。其他组件将在第 11 章“灾难恢复与业务连续性”中讨论。\n\n## ICS\
  \ 生命周期挑战\n\n为 ICS 运营制定有效网络安全策略的第一步，是认识到与 OT 设备相关的 `生命周期挑战`，以及它们与 IT 环境中典型设备的区别。工业控制设备（如\
  \ `PLC`、`RTU` 和 `DCS`）通常安装在预期运行长达 20 到 30 年甚至更久的应用中。它们的功能是控制生产组织“产品”的工艺流程。只要产品在生产，公司就在生产产品并赚钱支付账单。考虑任何会停止或减缓产品生产的事情，通常都是一件严肃的大事。在这些设备的生命周期中，工艺修改、业务集成和主要生产工厂大修都会给它们带来安全隐患。\n\
  \n回顾第 4 章“ICS 模块与要素加固”，ICS 设备不具备 IT 设备常用的许多安全功能。它们不使用反恶意软件产品，且可能不具备任何认证和授权保护措施。历史上，它们在设计上就是不安全的。因此，ICS\
  \ 设备在其整个活跃生命周期内都呈现出较高的安全风险，在变更管理和补丁管理工作中需要个性化的关注。它们还需要持续的监控和审计，以防止被利用。\n\n## 变更管理\n\
  \n新的网络安全计划设计并实施后，往往就保持原样。然而，由于组织及其流程发生变化，网络架构也会随之变化。此外，针对网络的威胁也在不断变化和创新。昨天的计划就是过时的计划。\n\
  \n为了跟上这些不断变化的威胁，网络安全计划的所有方面都应定期按文档化的时间表进行审查，并在适当的时候更新。在大多数 IT 组织中，该间隔通常为一年。在许多 OT\
  \ 环境中，时间跨度要长得多。\n\n有效控制这些状况的关键在于拥有一个有效的 `变更管理策略`，该策略控制谁可以进行变更，并建立准确记录变更的流程。这两个要素共同确保对网络、计算和控制设备、软件及配置的变更以有序且受控的方式进行。变更管理策略中应自动包含的一些项目包括：当发生以下变更时的处理程序：\n\
  \n*   信息系统所有权\n*   系统架构\n*   系统状态\n*   系统互连的增加/删除\n*   系统范围\n*   认证和授权状态\n\n虽然这些项目应自动触发变更管理流程，但该策略应设计为为处理现场提交的\
  \ `变更请求` (`RFC`) 提供结构化的审查流程。审查流程通常由 `配置审查委员会` 执行，该委员会由组织中的关键人员组成（理想情况下包括 IT、网络安全、工艺工程、运营和管理部门的代表）。\n\
  \n该委员会负责监控、确定优先级、授权和控制组织流程和网络的变更。它必须评估进行任何请求变更的价值和潜在风险。特别是在 ICS 环境中，委员会必须确定进行特定变更导致中断（及其后果）的可能性，以及这些中断对组织生产力的影响。\n\
  \n### 建立安全基线\n\n要管理变更，必须有一个用于评估变更的参考点。该点称为 `基线`。在确定了所有已识别风险的潜在影响后，组织的下一步是创建一个 `安全基线`，定义其可接受的风险水平——即其\
  \ `风险容忍度`。在企业 IT 网络环境中，该基线定义了保护组织 IT 系统以及这些系统处理、存储和传输的数据的机密性、完整性和可用性 (CIA) 所需的最低安全要求。\n\
  \n在企业环境中，安全基线包括定义组织的最佳配置参数并设定策略，使系统不偏离该状态。当发现偏差时，策略会规定采取何种行动将设备或系统恢复到标准配置。企业环境中有可供管理员自动执行此活动的工具。\n\
  \n然而，请回想一下，在 OT 网络中，可用性通常比机密性更受重视，因此当发现未经授权的配置变更时，强制采取不同的行动。虽然基线配置是在安全基线中建立的，但当生产发生变化并检测到配置变更时，配置通常不会自动强制恢复到标准状态。\n\
  \n这是因为常见的 OT 设备（如 `PLC`、`RTU` 和 `IED`）并非设计用于处理突发变更，例如自动恢复到已知良好状态。相反，偏差会保留原状，直到变更管理团队调查未经批准的变更，以确定将设备或系统恢复到先前配置的影响。通常需要人工干预来响应偏离标准\
  \ ICS 配置基线的情况。\n\n\n\n## OT 环境中的变更管理\n\n在某些 OT 环境中，组织可能需要遵守外部监管机构的要求，例如适用于北美地区电力生产和输配电的\
  \ `NERC CIP` 标准，以开发、记录并实施其网络的基线配置。该配置包括操作系统（或在不存在独立操作系统时的固件）、商业或开源软件应用程序、已安装的定制软件、已应用的任何安全补丁，以及任何逻辑上可访问的网络端口。\n\
  \n这通常包括制定和记录策略，规定所有偏离现有基线配置的变更必须经过授权并记录在案。在实施此类偏离现有基线的变更之前，必须确定拟议变更可能影响的任何网络安全控制措施。变更实施后，必须采取措施验证并记录网络安全控制措施未受到不利影响。\n\
  \n当变更获得批准后，期望的实施路径要求在反映生产环境组织架构和运行情况的测试环境中对该变更进行建模。这使团队能够监控变更，采取措施将任何不利影响降至最低，并确保所需的网络安全控制措施不被削弱。\n\
  \n变更实施后，基线配置文档应在规定的时间内（例如变更后 30 天内）更新以反映该变更。同样，应建立监控新基线以防未经授权变更的时间表，例如每 30 天一次。\n\
  \n## 变更管理文档\n\n变更管理策略的主要组成部分之一是针对已批准变更的*文档记录与追踪规范*。*文档记录*是对设备、软件、计划或实际事件（如安全违规）中重大变更的记录或档案保存。拥有良好的文档记录程序是有效持续变更管理的关键之一。变更管理策略应通过将创建和维护这些项目的责任分配给特定人员或小组，来解决以下文档记录问题：\n\
  \n*   **所有 ICS 组件的当前、功能性软件代码库**——该库应包含为每个 ICS 组件（PLC、数据历史服务器、工程师站、交换机、路由器和防火墙）部署的最新稳定软件版本。\n\
  *   **ICS 软件归档库**——该库应包含 ICS 中每个 ICS 组件至少一个之前的软件版本。该代码库应保存在单独且安全的位置。\n*   **所有 ICS\
  \ 控制设备和网络设备的当前硬件清单**——该清单应与软件代码库交叉引用。\n*   **当前的网络架构示意图**——该图应显示所有布线、接线盒和数据通信连接的物理路径和位置。应保存文档以标注每个网络设备的归属位置以及谁应有权访问该设备。这对于关键服务器、路由器、交换机、\
  \ `IDSs` 和防火墙尤为重要。\n*   **设备变更历史**——设备升级历史在生产环境中可能极为重要。当任何新设备到货时，应进行清点、物理标记、测试并全面记录。\n\
  \n变更管理策略应规定用于防止未经授权访问或更改运行代码的控制措施。对上述所有配置文档的访问应受到控制，以防止公众或无关人员访问。更新权限应仅限授权员工。\n\n\
  ## 配置变更管理\n\n任何偏离基线的变更都会引入错误配置、误用、中断和故障的机会，从而降低组织的生产力和盈利能力。因此，必须以有序的方式控制和实施变更，将这些机会降至最低。这通常通过实施和执行组织整体变更管理策略中的*配置变更管理*部分来实现。\n\
  \n配置变更管理是跟踪网络中所有单个可配置对象的过程。跟踪这些对象对于维护流程及其网络的可靠和安全运行至关重要。如前所述，网络设备的配置变更可以手动或自动进行跟踪和管理。有软件工具可协助管理员完成此任务，随着网络的扩展和变化，该任务可能变得复杂。\n\
  \n### 管理设备连接\n\n如前所述，组织变更管理流程的一个关键部分是其*系统架构*文档。大多数网络管理员会开发并记录网络图或系统架构，描绘其网络的设计、拓扑、信息流和程序。然而，由于组织及其流程发生变化，网络架构也会随之变化。\n\
  \n因此，网络设备、连接或程序的任何变更都必须记录在案，以保持系统架构的最新状态。这包括实施有文档记录的流程，以解决与管理网络设备端口和服务相关的特定要求，例如以下内容：\n\
  \n*   实施有文档记录的流程，以监控、识别和保护网络计算和连接设备，防止使用不必要的物理端口，例如用于网络连接、控制台命令或可移动介质的端口，详见第 4 章。\n\
  *   实施有文档记录的流程，以确保仅启用系统架构按设计运行所需的当前逻辑端口。\n\n系统架构文档应在组织的 IT/OT 部门内严格控制。仔细限制对该信息的访问以维持安全级别非常重要。必须注意，不得在初级管理员未接受适当培训的情况下，将管理密码和其他网络信息提供给他们。通常，仅授予有限访问权限，并根据“需知”原则向具有相关职责角色的人员提供访问权限。\n\
  \n### 配置审计\n\n*配置审计*是一个持续的过程，它将环境中检测到的变更与已批准的*变更请求 (RFC)* 进行比较。计算设备、软件和连接设备的配置设置将与组织的策略和公认的行业最佳实践进行比较。\n\
  \n*监控*是一个持续的过程，用于确保流程按预期工作。它是流程中一种有效的检测型控制。而*审计*则是一种预先计划的方法，用于检查对象或确定受监控区域内是否存在问题。\n\
  \n例如，在 OT 网络中，必须有人或某种机制到位，以*审计*（检查和分析）网络监控系统产生的配置信息。这一责任通常落在网络或安全管理员身上。审计是大多数管理员工作和整体网络安全计划的重要组成部分。\n\
  \n审计网络配置对象通常涉及使用手动技术、自动化工具或两者兼用，以收集指定的配置数据，对其进行审查和分析，以检查其是否符合当前的最佳标准。必须定期开展此活动，以确保没有网络设备偏离策略或最佳实践合规要求。\n\
  \n\n\n\n组织的 `configuration auditing policy`（配置审计策略）通常是其 `change management policy`（变更管理策略）的子集，而后者又是整体\
  \ `security policy`（安全策略）的子集。这些策略通常会指定一个标准（如前文建立的基线配置），网络设备配置必须遵循该标准。策略还规定了在何种情况下以及如何部署\
  \ OT、IT 和网络设备的操作系统和配置更新。最后，计划规定了为持续合规而审计配置的频率。\n\n几乎所有服务器和端点，以及有线和无线网络连接设备，都具备监控/审计工具，可用于评估其软件性能及支持它们的硬件平台。管理员使用这些工具定期验证其已实施的控制措施是否生效，以及已识别的风险是否得到处理。反过来，审计人员利用监控结果来识别风险、缩短审计周期或降低频率，并/或将更多审计精力集中在其他领域。\n\
  \n在企业网络环境中，有许多广泛使用的 `network security monitoring`（`NSM`，网络安全监控）软件包可用。这些软件包通过收集和分析网络设备配置文件，提供自动化配置审计。它们可配置为生成包含建议的详细安全问题报告、网络配置报告及其他脚本化的网络信息报告。这些工具通常设计为适用于从防火墙、路由器和各厂商的管理型交换机获取的配置文件，以及大多数主流操作系统平台。\n\
  \n## 控制系统的补丁分发与安装\n\n在 IT 网络中，加固本地计算和控制器设备以抵御攻击的一个重要环节，是保护其操作系统和应用程序。这涉及在已知漏洞代码段出现时，更新操作系统及其应用程序中的易受攻击代码段。操作系统加固通过应用服务包、补丁和更新形式的新编程代码来实现。\n\
  \nOT 网络管理员因几乎任何原因（包括设备老化、专有功能或感知到的过时）而不愿为其网络中的计算和控制设备打补丁。一些较旧的 OT 控制设备之所以不打补丁，仅仅是因为不再有可用的补丁。建议使用\
  \ `patch review team`（补丁评审团队）（再次由 IT、网络安全、过程工程、生产运营和高级管理人员组成）来分析并决定是否应将补丁应用于 OT。\n\
  \n在生产环境中，补丁评审团队中不同方的优先级和关注点并不相同——即使在网络安全环境下也是如此。当发现漏洞利用并创建补丁时，所有相关方必须共同协作，确定以下事项：\n\
  \n*   他们的 ICS 面临该威胁的脆弱程度如何？补丁操作涵盖的威胁潜在影响是什么？董事会据此可确定部署补丁的紧迫性。\n*   因进行补丁活动所需的非计划停机时间，对生产的预期影响是什么？不采取行动是否可接受？还是有效的变通措施能比补丁部署提供更好或更即时的临时保护？\n\
  \n补丁评审团队的所有相关方必须将其部门的问题和顾虑带到讨论中，以决定是否以及何时为 ICS 打补丁。对于团队认为适用的补丁，必须制定计划以缓解每个安全补丁解决的漏洞，并设定完成缓解步骤的时间框架。\n\
  \n时间框架因补丁设计缓解的漏洞严重程度而异。如果威胁迫在眉睫且影响重大，补丁应用可能被视为 ASAP（尽快）。然而，如果威胁严重性较低但仍达到被认为必要的级别，补丁应用可能会安排在设备维护期间或工厂计划停机时进行。\n\
  \n如果缓解计划无法在规定时间框架内实施，必须由高级管理层的适当成员或团队指定的代表批准延长时间框架。\n\n### 补丁决策树\n\n一些组织采用 `patch\
  \ decision trees`（补丁决策树）来决定是否以及何时将补丁应用于其 OT 设备。该树是一组相互依赖的节点，将打补丁的决策从补丁发布推进到补丁应用。将决策树应用于补丁流程旨在提供自动化流程，减少单独评估\
  \ OT 中设备每个新建补丁所涉及的时间和负担。\n\n树的根节点植根于将补丁应用于特定 OT 设备所关联的风险降低因素。图 10.1 描绘的树中第一个因素是\
  \ `exposure factor`（暴露因子）。根据暴露性质——间接、直接或较小——树从代表安全态势影响、安全影响和技术影响决策点的中央主干节点分叉。\n\n\
  *   `indirect exposure`（间接暴露）因子表明该网络资产无法直接访问任何信任级别较低的安全区域，但该区域内的其他资产可能可从其他信任级别较低的安全区域访问。这适用于大多数\
  \ OT 资产。\n*   `small exposure`（较小暴露）因子设备是指处于高度隔离和受控安全区域中的设备。它们与任何信任级别较低的安全区域没有连接。\n\
  *   `Direct exposure`（直接暴露）设备是指那些可直接从信任级别低于该资产所在区域的区域访问的设备。\n\n设备的暴露因子最初应用于组织的安全态势以确定其影响。根据影响是微不足道、轻微还是重大，可以做出决定（推迟应用补丁），或流程分支以解决任何安全态势问题。如果对安全的影响重大且对安全性的影响是直接或间接的，则可以决定尽快实施补丁。\n\
  \n如果对安全态势的影响轻微，则安全影响将指向流程影响决策（如果无安全影响）或技术影响评估（如果安全影响是间接或直接的）。如果无安全影响且非关键流程影响降级，则技术影响评估将产生安排补丁或尽快应用补丁的选项，具体取决于低、中、高技术影响评估的判定。\n\
  \n![图 10.1 补丁决策树](img/c10f001.png)\n\n**图 10.1** 补丁决策树\n\n有两个关键信息源适用于树上的决策点——`ICS-Patch`\
  \ 和 `CVSS`。`ICS-Patch` 是一份可在 `https://dale-peterson.com/wp-content/uploads/2020/10/ICS-Patch-0_1.pdf`\
  \ 获取的文档。该文档涉及风险矩阵和漏洞管理。利益相关者专用的通用漏洞评分系统（`CVSS`）工具是一种在漏洞管理操作中确定行动优先级的系统。可通过 GitHub\
  \ 在 `https://github.com/CERTCC/SSVC` 获取。\n\n\n\n## ICS 资产清单与检测管理\n\n`ICS 资产清单与检测管理工具`\
  \ 在实施补丁决策树时至关重要。这些工具提供了识别 OT 网络资产上缺失补丁的能力。它们用于维护组织 OT 网络中运行设备的硬件和软件数据聚合。一个准备充分的工具将跟踪所有设备的硬件规格、IP\
  \ 地址、操作系统版本、补丁修订版本、用户账户和补丁状态。它还将包括已知漏洞、攻击向量以及分配给每个设备的 CVSS 评分。\n\n## 补丁测试\n\n在 IT\
  \ 和 OT 网络环境中，补丁的部署往往伴随着意想不到的后果。例如，考虑一个拥有数千台计算机的企业网络，在安装了导致意外或异常操作的软件补丁后。网络管理员可能不得不花费数小时时间在这么多机器上回滚安装。此外，由于所有这些机器功能丧失，用户可能会损失数小时的生产力。\n\
  \n由于 OT 网络要求极高的正常运行时间，与补丁相关的问题更加严重。例如，某些工业部门要求其 ICS 的正常运行时间达到 99.999%（也称为“五个九”正常运行时间）或更高。将此要求应用到日历年，你会发现\
  \ ICS 全年因任何原因停机的时间只能在 5.5 分钟或更少。考虑到这一点，不难理解为什么 OT 设备经常处于未打补丁的状态。\n\n对于此类 ICS 环境，打补丁必须安排在其正常运行时间要求允许的范围内。在生产环境中，让一个原本正常运行的过程系统停摆，直到查明并修复失败的补丁工作的影响，成本可能非常高昂。如果其他工序恰好依赖于受影响的工序，问题将呈指数级复合。还有一些\
  \ OT 环境可能涉及位于多个站点的数百台设备打补丁。这种工作的范围使得补丁计划在这些组织中变得更加重要。\n\n由于这两种网络环境都容易出现与补丁相关的问题，因此在部署到生产网络之前进行\
  \ `补丁测试` 尤为重要。这种测试通常使用运行与生产网络中相同类型硬件的 `测试床` 或 `沙箱` 网络来执行，以便紧密模拟操作环境。此配置通常专门用于测试目的。\n\
  \n实际测试应旨在验证补丁是否修复了供应商确定的问题或消除了漏洞。它还应验证补丁不会导致与网络上现有硬件和应用程序的冲突。此外，测试应包括在补丁安装后将其从系统中移除。\n\
  \n测试的这一部分应验证补丁能否在不影响设备或网络操作的情况下被移除。移除补丁可能有些棘手，补丁测试必须为安装人员提供恢复关键系统功能的程序和选项。\n\n最后，应为每次补丁测试创建文档。首先，应创建清单和程序以指导现场的打补丁活动，确保打补丁过程的初始准确性和可重复性。补丁记录、测试记录以及任何配置变更都应记录在案，并作为配置管理文档的一部分予以保存。\n\
  \nNERC CIP-007-6 标准旨在确保新的网络资产或对现有网络资产的重大更改不会对现有网络安全控制产生不利影响。NERC CIP 的这一部分要求 BES\
  \ 组织为其适用的网络资产（包括操作系统、应用程序、数据库平台和第三方软件/固件）提供补丁管理流程，用于跟踪、评估和安装网络安全补丁。标准的跟踪部分要求确定适用于其可打补丁设备的补丁发布来源。潜在补丁必须在该来源上次评估后的\
  \ 35 个日历日内完成评估。\n\n## 软件重装与固件管理\n\n在 OT 网络中，`嵌入式设备` 不在软件平台上运行；相反，它们是 `固件驱动设备`。在许多情况下，该固件的管理不被视为整体安全策略的一部分。相反，它被视为一项运维职能，很少将其视为安全风险。回想一下，SCADA\
  \ 和 OT 系统最初是为可靠性和安全性设计的——而非安全（Security）。\n\n越来越多的证据表明，攻击者在攻击中以工业固件为目标。除了与社会工程学攻击和缺乏软件打补丁相关的众多漏洞和违规事件外，许多违规事件和漏洞发现都被追溯到固件问题。\n\
  \n微软 2021 年的一份报告指出，在过去两年期间，超过 80% 的企业经历过至少一次固件攻击。此外，NIST `国家漏洞数据库` (`NVD`) 显示，此类攻击在四年内增加了五倍。最著名的固件攻击包括\
  \ `Thunderclap` 和 `ThunderSpy` 攻击，它们通过英特尔 Thunderbolt 端口的硬件访问利用 Thunderbolt 控制器。在这些攻击中，攻击者将外部\
  \ Thunderbolt 控制器和可写内存芯片组合连接到 Thunderbolt 端口，即使机器处于关机状态，也能读取内核级内存。\n\n`固件转储` 是提取并潜在利用端点、控制器、网络设备和服务器的固件设备中的漏洞和数据的另一种形式。在此过程中，读取器设备获得对存储固件的闪存设备的访问权限。这可以通过使用跳线或\
  \ Saleae 探针将读取器设备的引脚连接到集成电路的相应物理引脚来实现。接下来，读取器的应用程序执行一系列操作以检测目标设备的内存结构并将其内容复制到攻击者的内存设备中——这被称为\
  \ `十六进制内存转储`。从这一点开始，剩下的就是使用设计用于解包二进制文件并扫描其中有用信息的软件包，例如存储在固件中的密码、私钥、后门、敏感 URL 和配置文件。相反，攻击者也可以使用类似的读/写设备修改\
  \ OT 设备的固件，以在目标网络中建立高级持续性威胁。\n\n因此，ICS 组织越来越意识到固件安全日益重要的地位。因此，他们专门将固件管理纳入其变更管理策略和审计实践中。\n\
  \n虽然安全打补丁是解决企业网络环境中许多软件漏洞的关键，但这是一个在 IT 产品生命周期中持续进行的循环过程。然而，SCADA/ICS 环境无法像企业打补丁流程那样频繁地关机和启动。\n\
  \n此外，针对 OT 设备的自动化 `固件管理解决方案` 尚未广泛普及。因此，大多数 ICS 打补丁操作仍然是人工进行的。然而，对于关键 ICS 环境，外部要求（如\
  \ NERC CIP 标准）将固件管理作为整体文档化配置管理流程的一部分。\n\n## 监控\n\n\n\n\n## 网络监控与审计\n\n正如前文所述，网络监控和审计是任何组织网络管理/安全运营的关键组成部分。监控涉及使用系统或工具持续观察设备和网络对象，以查找特定类型的活动或事件。一般来说，任何网络中都应检查三种常见类型的活动：\n\
  \n*   **事件监控** 跟踪监控系统配置设置所要求的特定类型事件。当发生指定类型的活动时，监控系统会记录该事件并将其提交到日志以供后续检查。监控系统也可配置为创建并发送通知给指定接收人。\n\
  *   **网络监控** 检查监控系统配置设置所要求的网络流量和活动。网络监控职责可分布在多种不同类型的设备上，例如：监控来自网络外部威胁活动的入侵检测系统；监控网络流量的网络连接设备，如托管交换机、路由器、防火墙和工具设备；以及监控计算设备活动的服务器。\n\
  *   **安全监控** 跟踪已被定义为安全事件的特定类型活动的发生。这些事件通常包括登录/认证失败、尝试访问关键系统文件等项目。\n\n### 事件监控\n\n\
  **事件监控** 是跟踪活动并监视某些事件（发生）出现的做法。当指定事件出现在活动流中时，事件信息会被存储在日志中，并可能发出通知以告知指定人员该事件的发生。端点设备、服务器和网络设备都具备监控其不同类型事件操作的能力。\n\
  \n在 Microsoft Windows 环境中，主要的事件监控工具是内置的 `Event Monitor` 应用程序。该工具通过过滤器进行配置，过滤器定义了要监控和记录的事件的\
  \ Category（类别）、Description（描述）和 Type（类型）。可监控的事件类型包括 Errors（错误）、Warning Information（警告信息）、Success\
  \ Audits（成功审核）和 Failure Audits（失败审核）。监控任务返回的信息存储在操作系统的 **Windows Event Log** 中。Windows\
  \ 产品默认包含三种类型的事件日志——Application（应用程序）、Security（安全）和 System（系统）日志。\n\nLinux 操作系统包含\
  \ 12 个关键事件日志文件，服务器管理员需要监控这些文件以跟踪其设备上发生的重要事件。这些是与服务器、内核、服务及其设备上运行的应用程序相关的 Linux 日志文件。这些日志文件通常可分为四类：Application\
  \ logs（应用程序日志）、Event logs（事件日志）、Service logs（服务日志）和 System logs（系统日志）。监控这些日志使管理员和信息安全人员能够在问题发生前预判即将出现的问题。\n\
  \n以下是需要监控的关键 Linux 日志：\n\n*   `/var/log/messages`——通用系统活动日志，跟踪非内核启动错误和系统启动时的应用程序相关服务错误。\n\
  *   `/var/log/syslog`——基于 Debian 的通用系统活动日志，跟踪非内核启动错误和系统启动时的应用程序相关服务错误。\n*   `/var/log/auth.log`——基于\
  \ Debian 和 Ubuntu 的认证和授权事件。失败的登录尝试、暴力破解攻击等。\n*   `/var/log/secure`——基于 RedHat 和\
  \ CentOS 的认证和授权事件。失败的登录尝试、暴力破解攻击等。还跟踪 SSH 登录和错误。\n*   `/var/log/boot.log`——系统初始化脚本启动消息。与不当关机、非计划重启和启动失败相关的问题。\n\
  *   `/var/log/dmesg`——关于设备状态和硬件错误的内核缓冲区消息。\n*   `/var/log/kern.log`——关键内核信息。\n*\
  \   `/var/log/faillog`——失败登录尝试的列表。是识别企图安全入侵活动的关键。\n*   `/var/log/cron`——关于 cron\
  \ 作业操作的信息。\n*   `/var/log/yum.log`——使用 YUM 安装相关的新软件包安装信息。\n*   `/var/log/mail.log`——邮件服务器日志，用于邮件服务器上运行的电子邮件相关服务——发送和接收的邮件、可能的垃圾邮件尝试、传入邮件的来源。\n\
  *   `/var/log/httpd`——与 httpd 错误相关的 Apache 服务器日志。\n*   `/var/log/mysqld.log`——MySQL\
  \ 日志。\n\n有许多开源工具可用于集中监控和分析这些日志，以减轻管理员的负担。一款广泛使用的用于管理服务器日志的商业软件包是 `Nagios Log Server`。这些应用程序使管理员能够查看、排序、配置和分析来自网络中不同来源的日志。\n\
  \n### 网络监控\n\nIT 和 OT 网络通常都会采用多种不同的网络监控工具，包括防火墙、IDS/IPS 系统、操作系统日志、商业监控工具、定制监控工具和高级日志管理系统，以及\
  \ **Security Information Event Management (SIEM)** 工具。此外，还有许多 NSM 软件包用于提供对这些监控系统的自动化管理。提供有效的主动管理和监控计划需要以下组件：\n\
  \n*   **监控软件**——在监控软件配置期间，会选择各种硬件和软件操作进行跟踪。生成的事件信息可存储在日志文件中。\n*   **报警/警告系统**——如果网络或其设备之一显示入侵或故障迹象，可立即以向管理控制台发送警报或向管理员发送寻呼的形式发出即时警告。\n\
  *   **远程管理功能**——管理员可从远程位置登录其端点、服务器和网络设备以检查其状况。诊断日志可远程查看，故障服务器系统可远程开机、关机甚至重启以恢复运行，无需等待技术人员到场。\n\
  \n使用这些关键网络管理组件，管理员可以主动监控和管理其网络以优化其可用性。通过在故障发生前向系统管理员提供预警，网络监控软件帮助他们识别并处理问题，防止其演变为灾难性故障，从而避免组织损失生产力和利润。\n\
  \n网络管理员通常将其监控/审计工具配置为评估特定网络对象或事件，然后在审计日志中跟踪这些结果以供后续评估。另一方面，一些防火墙、**入侵检测系统 (IDSs)**\
  \ 和 NSM 软件可配置为在识别出异常模式或事件时，向管理员提供即时警报或通知。\n\n组织网络模型的 OT 侧通常不必处理给基于 IT 的 NSM 操作带来困难的项目。这些项目包括加密网络、NAT\
  \ 的广泛使用、设备在网段间移动、极端的网络流量水平和隐私担忧。应用于此功能的常用工具包括：\n\n*   **Security Onion**——一个开源 Linux\
  \ 发行版，专为威胁狩猎、企业级安全监控和日志管理而设计。它常用于 NIDS、HIDS、SOC 分析和静态分析。（参见 `www.securityonionsolutions.com`。）\n\
  *   **FlowBAT**——一个基础网络分析工具，提供网络可见性、安全监控、事件响应和低存储开销。（参见 `www.flowbat.com`。）\n\n\n\
  \n\n## 网络安全监控工具\n\n*   **NetFlow** — 一种由 Cisco 开发的网络协议，用于收集 IP 流量信息并监控网络流量。当与 NetFlow\
  \ 管理应用程序配合使用时，它可以将粒度数据转换为用户友好的图表和报告，以识别网络利用率。（参见 `www.solarwinds.com/netflow-traffic-analyzer`。）\n\
  \n*   **Pcap** — 一种 API 数据包捕获实用程序，旨在捕获网络流量。它通常用于异常分析，包括 ARP 欺骗、源自 ICS 的异常 DNS 流量，或识别格式错误的\
  \ Modbus 数据包。Pcap 实用程序可通过互联网上的许多渠道获得，并已集成到许多为特定用途设计的其他安全工具中。\n\n*   **Zeek IDS**（前身为\
  \ Bro IDS）— 一种开源网络安全监控 IDS 工具。它提供全面的网络流量分析。它以日志的形式提供事务数据和提取的内容数据，汇总网络中移动的协议和文件。在\
  \ OT 网络中，它可以解析 DNP3 和 Modbus 协议。（参见 `www.zeek.org`。）\n\n*   **Snort IDS** — 一种开源入侵防御系统（IPS），采用基于规则的方法来定义可接受/恶意的网络活动。它利用这些规则集来定位和识别不遵守规则的数据包，并为用户生成警报以供审查。它也可以配置为阻止这些数据包。Snort\
  \ 还支持 DNP3 和 Modbus 预处理器，以及特定的 SCADA 包。（参见 `www.snort.org`。）\n\n*   **Suricata IDS**\
  \ — 一种开源威胁检测引擎。Suricata 将 IDS、IPS、NSM 和 Pcap 处理功能结合到一个产品中，旨在识别、阻止和评估网络攻击。Suricata\
  \ 提供 DNP3 解析器和 ET SCADA 规则。（参见 `https://suricata.io`。）\n\n*   **Syslog** — 一种行业标准的消息记录实用程序，它在知名或注册端口上监听网络，接收指示日志消息的协议请求，并将它们存储在\
  \ Syslog 服务器中。该工具通常用于系统管理和安全审计目的。它也广泛用于各种设备，包括网络、服务器和终端设备。（参见 `www.kiwisyslog.com`。）\n\
  \n## 安全监控\n\n在关键 OT 环境中，组织可能需要实施一个或多个文档化的流程，以满足*安全事件监控*的特定要求。遵守这些要求涉及记录安全事件，并为组织确定需要警报的事件生成警报。\n\
  \n这些安全事件监控流程可能包括要求定期按给定间隔（例如，间隔不超过 15 个日历天）审查记录的安全事件样本或摘要，以识别网络安全事件。它们还可能包括要求保留安全事件日志一段规定的时间（例如至少连续\
  \ 90 个日历天）。\n\n在实施层面，安全监控涉及使用设备和工具来监控和报告网络或设备安全问题。在其最新的 SP800-137《联邦信息系统和组织的信息安全持续监控\
  \ (ISCM)》文档中，NIST 组织将持续安全监控定义为包括以下内容：\n\n*   漏洞监控\n*   应用监控\n*   威胁监控\n\n这些监控活动共同为\
  \ OT 安全管理员提供了对其系统、用户和活动的态势感知，以及针对其网络进行的可能攻击。通常有两类与这些活动相关的工具：\n\n*   **主动工具** — 这些工具（如\
  \ IDS 和 SIEM）了解网络设备及其安全状态。这些工具帮助 ICS 安全管理员监控系统的多种不同类型问题，例如配置错误的设备、不正确的软件版本、设备固件缺陷、硬件故障、意外的内部和外部\
  \ IP 地址以及网络上的意外协议。然后，他们可以利用生成的信息来纠正设备配置，与供应商合作修复软件和固件问题，并加固其网络。\n\n*   **检测工具**\
  \ — 这些工具提供上下文感知的威胁监控、分析和警报功能。这些是持续的 NSM 工具，它们从网络设备和应用程序收集日志数据，分析网络流量，并向管理员提供威胁和高级问题的实时报告。OT\
  \ 安全管理员可以使用这些工具来应对高级问题，例如零日恶意软件、命令与控制流量以及数据渗漏活动。\n\n## 日志记录与审计\n\n所有监控活动的工作产出都是针对特定事件或活动发生而产生的信息。为了使这些数据有用，必须保留它们直到可以被分析——无论是手动还是自动。网络管理员配置监控/审计工具以记录特定的网络活动或*事件*，然后在*审计日志*中跟踪其结果以供评估。*日志记录*是为了分析（审计）目的而记录和存储特定事件和事务的过程。如今几乎所有在用的计算和网络设备都以某种格式生成日志。\n\
  \n尽管审计日志通常提供多条信息，但组织主要使用审计日志来评估其网络的漏洞。因此，审计日志是每个管理员工作的重要组成部分，也是整体网络安全计划的关键。例行日志审计对于识别安全事件、策略违规、欺诈活动和操作问题至关重要。它也是事件发生后进行取证分析的关键。审计跟踪可能提供攻击者和入侵者的证据，无论他们来自本地网络内部还是网络外部。\n\
  \n在某些情况下，审计操作仅涉及筛选日志以查找错误或其他问题，这对网络管理员来说可能是一项艰巨的任务。然而，在企业和 OT 网络环境中审计日志的一个根本问题是网络内产生的海量日志数据。这往往导致日志仅以兼职或不规则的方式进行监控。\n\
  \n组织必须在有限的审计资源与持续产生的日志数据供应之间取得平衡。能够汇总甚至绘制该日志数据图表的软件工具是管理员极佳的生产力工具。\n\n为了缓解监控和审计操作给网络安全团队带来的压力，许多*安全编排、自动化和响应\
  \ (SOAR)* 工具已进入 IT/OT 安全市场。这些是使组织能够自动化和标准化其安全运营和事件响应活动的软件工具。\n\n这些安全工具收集安全数据，以识别、分析和应对来自不同攻击向量的威胁和漏洞。它们被设计为与网络中的其他安全工具协同工作，以检索和分析网络生成的安全信息。信息安全团队将称为*剧本*\
  \ 的工作流指令集构建到 SOAR 中，以自动化其许多安全运营，从而减少重复性任务。\n\n这类安全工具依赖人工智能和机器学习来自动化和微调组织的日常安全任务。可用的领先\
  \ SOAR 工具示例包括 Splunk Phantom、IBM Resilient、DFLabs IncMan、Insightconnect、RespondX、Exabeam、ServiceNow\
  \ 和 SIRP。\n\n## 事件日志记录\n\n\n\n\n## 事件日志记录\n\n**事件日志记录**是指记录网络设备、服务器、客户端和智能网络连接设备的操作系统所执行的系统事件。操作系统日志通常记录各种不同类型的系统信息。其中相当一部分数据与管理和合规功能相关。\n\
  \n在讨论操作系统时，**审核**一词用于描述操作系统的一项安全功能，该功能支持将在计算机上执行的用户和操作系统活动记录在日志中（进行监控和跟踪）。然后可以使用这些信息来识别或分析潜在的不良活动，例如未经授权的入侵尝试。事件日志记录是在本地计算机层面设置的，而审核则是在服务器层面建立的。\n\
  \n在网络安全设备/系统识别出可疑活动后，通常会使用操作系统日志从特定设备获取更多信息。对于这些活动，需要考虑两种常见的操作系统审核记录类型：\n\n*   **原生日志记录**—大多数现代多用户操作系统生成的事件记录。由于这些记录已由操作系统生成，因此始终可用，但它们可能不包含所需的事件，或不是易于使用的形式。\n\
  *   **检测专用审核记录**—为提供有关所需操作或事件的特定信息而生成的记录。这些操作或事件可以基于操作系统活动、应用程序事件或安全事件。\n\n大多数操作系统可用的审核系统由两个主要组件组成：**审核策略**（或**审核规则**），它定义将要监控并添加到系统**安全日志**中的事件类型；以及**审核条目**（或**审核记录**），它们由发生受审核事件时添加到安全日志中的各个条目组成。系统管理员实施审核策略。\n\
  \n事件日志管理是监控 IT/OT 网络最重要的方面之一。在操作系统层面，**Windows 事件查看器**或 **Linux 安全审核框架**等简单实用程序为事件监控活动提供了第一道防线工具。\n\
  \n### Windows 审核工具\n\n在 Microsoft Windows 环境中，审核条目保存在**安全日志文件**中。图 10.2 显示了 Windows\
  \ 事件查看器实用程序中显示的典型安全日志。为了使审核成为有效的安全工具，应定期审查和归档安全日志。\n\n在 Windows 中，审核是通过“管理工具”菜单下的“本地安全策略”选项进行配置的，如图\
  \ 10.3 所示。\n\n![FIGURE 10.2 Viewing security audit logs](img/c10f002.png)\n\n**图\
  \ 10.2** 查看安全审核日志\n\n![FIGURE 10.3 Configuring auditing in Windows](img/c10f003.png)\n\
  \n**图 10.3** 在 Windows 中配置审核\n\n在右侧窗格中选择要配置的策略将生成“本地安全设置”窗口，如图 10.4 所示。在应跟踪和审核的选项旁打勾：成功、失败或两者皆选。\n\
  \n在 Windows 中，审核必须既作为常规系统策略设置进行配置，也必须在每个需要审核的对象（文件、文件夹和打印机）上进行配置。考虑到这一点，在配置审核策略时，必须考虑该策略将对系统及其性能产生什么影响。如果要在系统中的每个文件、文件夹和打印机上设置审核，审核进程会给系统带来如此多的额外工作，以至于系统实际上可能会慢到停滞。\n\
  \n![FIGURE 10.4 Establishing a local security policy setting](img/c10f004.png)\n\
  \n**图 10.4** 建立本地安全策略设置\n\n### Linux 审核\n\nLinux 系统还具备安全审核功能，用于跟踪指定的安全事件。图 10.5\
  \ 提供了 Linux 安全审核框架的通用表示。与其他审核系统一样，Linux 模块将计算机进程映射到用户 ID，以便管理员能够将攻击准确追溯到拥有该进程并在系统中执行潜在恶意活动的用户。\n\
  \n![FIGURE 10.5 Linux auditing system](img/c10f005.png)\n\n**图 10.5** Linux 审核系统\n\
  \n系统的核心是**审核守护进程**，它与 Linux 内核的审核模块协同工作，记录相关事件并将其写入磁盘上的日志文件。审核规则在系统启动时执行的文件中进行配置。审核控制器实用程序使用这些规则中的参数来确定跟踪哪些系统事件以及如何将它们写入**审核事件日志文件**。\n\
  \n当应用程序遇到触发预配置审核事件的情况时，一条消息会呈现给内核的审核接口并传递给审核控制器。在审核控制器的指导下，审核守护进程将事件写入审核事件日志。\n\n\
  Linux 审核系统还包括一个报表生成工具，管理员可以使用它来生成自定义安全报表。它还可能包含一个搜索实用程序，以便快速/专门地检查特定事件的日志条目。\n\n\
  与 Windows 组策略配置一样，您必须考虑希望 Linux 审核系统在主机上执行的审核级别及其运营后果。\n\n有一个非常优秀的审核工具可用于 Linux\
  \ 和 MAC 系统，称为 **Lynis**。该工具可以从 GitHub 下载并安装在 Linux 平台上。安装并配置 Lynis 后，它可以扫描系统并提供报告、警告和缓解系统漏洞的建议。其他著名的审核工具包括\
  \ Qualio、AuditBoard、Hyperproof、Onspring、Audit Prodigy、Audits Management Software、HighBond、Standard\
  \ Fusion 和 Benchmark ESG。\n\n### 网络日志记录\n\n来自网络设备（如托管交换机、路由器、防火墙和无线接入点）的日志，以及分布在整个网络中的\
  \ NSM 程序的日志，都可能包含与安全相关的信息。网络管理员主要将这些类型的日志用于管理和审核，而安全管理员则更关注来自不同来源的安全日志，以维护组织的网络安全目标。\n\
  \n## 安全日志记录\n\n**安全日志**用于跟踪通过设备审核策略配置指定的安全相关活动或事件。虽然安全日志的配置主要是为了存储计算机安全信息，但还有许多其他日志（如操作系统日志和应用程序日志）通常也包含一些与安全相关的信息，以及各种其他事件文档。\n\
  \n审核条目保存在安全日志中，管理员可以查看。为了使审核成为有效的安全工具，应定期审查和归档安全日志。\n\n组织通常运行多种基于主机和基于网络的软件工具来生成安全日志数据。最常见的软件类型包括但不限于以下各项（每个项目记录的内容不限于所述内容）：\n\
  \n*   **反恶意软件**—这些工具通常记录所有检测到的恶意软件遭遇实例。\n*   **IDS/IPS 系统**—这些设备或工具通常记录网络中发生的异常或威胁活动。\n\
  *   **身份验证服务器**—这些设备记录身份验证尝试，并包含尝试的来源、日期/时间和用户名，以及成功或失败的指示。\n\n\n\n\n*   **远程访问/VPN\
  \ 软件**—这些工具通常记录成功和失败的登录尝试。\n*   **Web 代理**—这些设备通常记录通过它们访问的所有 URL。\n*   **漏洞扫描器**—这些工具通常记录安全项目，例如补丁安装和网络中不同主机的漏洞状态。这可能包括已知漏洞和缺失的软件更新数据。\n\
  \n这些是安全管理员通常最感兴趣的日志。在所有情况下，关于审核什么内容都有许多选项。例如，登录尝试的成功或失败可能为即将发生的攻击活动提供线索，并应提供导致修改组织密码策略或需要持续进行用户教育的信息。审核结果如果表明攻击者试图识别并使用密码、试图突破访问控制列表，或试图解密加密数据，都可能得出有人试图渗透网络的结论。\n\
  \n审核结果可能显示某用户账户在非正常时间被使用。此审核可能表明该用户的登录账户已被泄露。受限文件夹等对象可针对访问尝试和不当的用户访问权限进行审核。通常，单个打印机不进行审核，尽管它们可以在短时间内被审核。\n\
  \n审核用户**登录尝试**可能是识别用户密码是否已泄露的最重要方法之一。网络管理员应了解分配员工的正常工作时间表。如果员工仅在白天工作或正在按计划休假，则其账户不应在夜间或其不在时处于活动状态。\n\
  \n审核**用户权限**是识别本地主机是否感染了提升用户权限病毒的有用技术。**权限提升**是指用户登录服务器后，能够执行包含嵌入式代码的程序，从而获得管理权限的情况。\n\
  \n网络防火墙可配置为审核内部组织用户是否访问不当网站。这些防火墙也可配置为识别来自互联网的用户正在访问的文件、文件夹和服务。这些审核的结果放置在提供**审计跟踪**的审核日志中。未能遵守公司政策的用户可接受劝导，在某些情况下可被解雇。\n\
  \n### 日志记录注意事项\n\n审核是一项重要的安全功能，必须经过周密规划。审核可计划用于扫描组织网络内部的不当活动（内部审核），或试图渗透网络的外部活动。然而，在配置审核系统之前，应深思熟虑以确定应审核哪些对象和事件以及何时审核。开启多个审核工具会给大多数网络带来负担，导致性能下降。\n\
  \n例如，记录网络中发生的所有对象和事件是不切实际的，特别是在 OT 网络中，因为这将严重影响其性能。这样做会导致网络陷入瘫痪或至少大幅减速。因此，审慎使用日志记录/审核工具一直是网络和设备级审核的标准方法。\n\
  \n当然，审核需要额外的资源，包括时间和人员，来审查审核数据。在考虑审核事件时，必须分配时间来评估审核报告、日志或警报通知。确保系统日志提供有效安全措施的唯一方法是要求网络管理员定期审查日志。创建过多的审核日志可能导致无法审查或识别可能与安全问题或违规相关的关键事件。因此，在决定需要审核什么以及谁应接收审核日志和警报时，必须非常慎重地进行选择。\n\
  \n与事件日志记录相关的另一个重要考虑因素是管理每个日志的大小、位置和覆盖策略。例如，Windows 操作系统默认配置为在日志达到一定大小时覆盖日志。\n\n\
  ### SIEM 系统\n\n许多**安全信息和事件管理 (SIEM)** 系统正在增加**人工智能 (AI)** 和**机器学习**功能，以近实时地跟踪人和机器的活动。这些功能包括**用户行为分析\
  \ (UBA)** 工具，可用于识别网络中用户和机器的行为模式。UBA 工具为网络的用户和设备构建活动配置文件。SIEM 利用这些配置文件将当前活动与人和机器的过往活动模式进行比较，并将其分类为正常或异常。\n\
  \n由于每个网络环境都不同，SIEM 系统需要初始配置和持续的“调优”。配置工作涉及为来自不同网络源的事件关联创建自定义规则，这些规则将触发警报。这些规则关注的活动包括：\n\
  \n*   用户身份验证尝试（由终端设备和服务器中的审核系统报告）\n*   检测到的攻击（由入侵检测系统报告）\n*   检测到的感染（由防病毒和反恶意软件包报告）\n\
  \n通常，这些规则依赖于为特定事件发生次数设定的阈值级别。例如，规则可配置为：如果网络中任何主机在一分钟内记录到三次登录失败尝试，则生成警报。\n\nAI 组件用于调优\
  \ SIEM 的运行，并根据网络中各设备的持续活动构建正常用户和设备活动的配置文件。当 SIEM 首次安装时，网络管理员通常非常忙碌，需要响应系统报告的所有误报指标。然而，随着\
  \ AI 组件“学习”网络用户和设备的正常活动，运行变得更加自动化和流畅。\n\n因为 UBA 工具学习什么被归类为正常活动，SIEM 成为检测内部威胁的非常好的工具，并且当涉及不满的管理员时，可能是检测此类威胁的最佳工具之一。\n\
  \n图 10.6 描绘了完全集成的 IT/OT 网络配置的结构。请检查该图，并注意网络中生成事件信息的设备数量和种类（由每个设备旁边的星号指示）。特别是，考虑合理预期会生成安全相关日志的设备数量。在此网络中，指望管理员每天亲自检查这些设备生成的每个日志是不现实的，更不用说关联来自每个设备的数据以进行有意义的分析了。\n\
  \n![图 10.6 IT/OT 网络日志记录](img/c10f006.png)\n\n**图 10.6** IT/OT 网络日志记录\n\n当跨 ICS/企业网络监控如此多的设备时，收集的数据量将远超管理员的管理能力，因此显然需要某种集中式日志管理系统。此功能通常由某种类型的\
  \ SIEM 系统来实现。可采用三种通用类型的 SIEM。\n\n*   **安全信息事件管理 (SIEM)** 系统—此名称包括数据检查工具，它们收集其他网络设备生成的日志，并将其汇编在集中的网络位置。这些工具通常还提供解释和分析功能，以自动帮助管理员审核其网络。\n\
  \n\n\n\n*   **安全事件管理 (SEM)** 系统——此术语通常适用于提供实时事件分析和通知的 SIEM 工具。\n*   **安全信息管理 (SIM)**\
  \ 系统——此 SEIM 版本通常指为提供网络日志长期存储而创建的系统。\n\n## 归档日志\n\n在 OT 环境中，组织可能需要出于多种原因将其生产日志**归档**较长时间（例如数年或数十年）。例如，用于核反应堆或航空航天应用的组件制造过程控制记录，可能需要在该组件的整个生命周期内保持可用。例如，如果与生产相关的法律诉讼变得必要，可能需要提供用于生产该组件的工艺的审计结果。此类存储要求可能延伸至其他数据的存储，包括安全日志数据。\n\
  \n组织的审计策略应规定日志存储的要求和指南，以便管理员能够妥善管理日志存储，并确保日志按要求保留相应的时间段。例如，NERC CIP 发电和配电成员会定期接受审计，并必须提供证据证明其符合所有\
  \ CIP 类别。现有 NERC 指南中有 50 多项证据保留要求。NERC CIP 006-3 标准的一部分要求以访问控制日志的形式提供与物理访问控制相关的文档。除非\
  \ NERC 合规执法机构指示作为正在进行的调查的一部分保留更长时间，否则这些日志必须保留一个完整的日历年。\n\n如果存储要求时间较长（不仅仅是几天或几周），则需要对日志进行归档。这可能要求管理员确定日志的文件格式在指定的时间段内是否仍可用。\n\
  \n例如，某些设备以专有格式生成安全日志，这些格式可能在数年内无法保持有效。在这种情况下，管理员可能决定以原始格式、标准格式或两种格式兼存的方式归档文件。\n\n\
  长期归档日志文件的另一个考量因素是选择使用的存储介质。虽然有多种不同的存储介质选项可用于归档日志数据，但必须考虑该介质（及其支持的硬件和软件）预计在要求的保留期内能保持可用多长时间。如果任何格式似乎面临变得不可用或无法访问的风险，管理员必须采取行动将日志传输到另一种介质类型。\n\
  \n与其他备份类型一样，管理员负责确保日志存储介质安全存储。这包括实施物理和逻辑访问控制策略及设备，以防止未经授权访问介质。这还涉及提供适当的环境控制，以确保介质不受损坏。这通常涉及在异地设施或云存储环境中存储日志归档介质的副本。\n\
  \n最后，管理员还负责确保在归档日志的要求数据保留期结束后，像其他数据备份一样对其进行妥善销毁。\n\n## 事件管理\n\n**事件管理** 是一种旨在事件发生后尽快将运营恢复到“正常”水平的流程，以最大限度地减少对组织生产和盈利能力的负面影响。在本章前面的部分中，您一直在处理“事件”的监控、记录和审计。然而，在网络安全环境中，事件在技术上并非您关注的对象。造成这种混淆的部分原因是术语问题。正如监控和审计经常互换使用一样，**事件**\
  \ 和 **事故** 这两个术语也经常互换使用。\n\n**事件** 通常被定义为“网络环境中的任何变更、错误或中断”。在其 SP 800-61r2 文档《计算机安全事故处理指南》中，NIST\
  \ 组织将事件定义为“网络环境中任何可观察到的发生情况”。此定义涵盖了系统崩溃、磁盘错误和遗忘访问凭据等项目。这些是在正常操作过程中例行处理的事件。\n\n另一方面，**事故**\
  \ 由 NIST 定义为“违反（或迫在眉睫的违反威胁）安全策略、可接受使用策略或标准安全实践”。根据此定义，事故是需要安全人员进行管理的事件。\n\n**NIST\
  \ 800-61r2** 建议，为建立高效的事故响应能力，组织应采取以下行动：\n\n1.  制定事故响应策略和计划。\n2.  制定执行事故处理和报告的程序。\n\
  3.  制定关于事故方面与外部各方沟通的指南。\n4.  选择响应团队结构和人员配置模型。\n5.  在事故响应团队与其他内部（如法务部门）和外部（如执法机构）群体之间建立关系和沟通渠道。\n\
  6.  确定事故响应团队应提供的服务。\n7.  配备并培训事故响应团队。\n\n在分析安全日志时，管理员可能会发现需要某种响应来解决的事故。这包括在网络上发现恶意软件、发生\
  \ DoS/DDoS 攻击、软件、固件或硬件配置被未经授权更改的证据，以及个人或机构身份盗窃的报告。发生此类情况时，他们必须启动组织的网络安全计划，并开始执行其事故响应计划\
  \ (IRP)，如 第 8 章 “ICS 安全治理与风险管理”所述。\n\n回顾一下，IRP 旨在识别潜在的紧急和灾难性活动，这些活动将触发启用 BCP 和 DRP\
  \ 的需求。它旨在首先采取主动——通过监控活动发现潜在麻烦。然而，它也必须具备响应性，因为它旨在在组织的边缘防护和人员培训工作失败的情况下被激活。\n\n该计划通常涉及信息安全、取证和网络安全职能，用于识别针对组织系统的攻击或漏洞利用的来源、载体和目标。该计划步骤的结果应为今后实施正确的行动方案指明路径。\n\
  \n### 事故响应生命周期\n\n在本章剩余部分中，您将检查事故响应过程的各个阶段，了解这些行动是如何实施的。正如没人知道地震何时会发生一样，没人知道攻击者何时会对其网络发起网络攻击。通过制定完善文档的\
  \ IRP，组织应能在保护其关键网络资源方面取得更大成功。NIST SP 800-61-r2《计算机安全事故处理指南》从四阶段生命周期的角度来看待事故响应过程，如\
  \ 图 10.7 所述。完整的 SP 800-61r2 文档可在 `https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-61r2.pfd`\
  \ 获取。\n\n![图 10.7 事故响应阶段](img/c10f007.png)\n\n**图 10.7** 事故响应阶段\n\n### 准备\n\n\n\n\
  `事件管理计划` 的初始 `准备` 阶段涉及创建和培训 `计算机安全事件响应团队 (CSIRT)`，并根据组织风险评估的结果实施预防性控制，以限制事件发生的数量。这涉及四项主要活动：\n\
  \n1.  创建并发布政策、程序、流程和指南，以类似 图 10.7 所述的格式处理事件。为了有效，IRP 必须包含人员识别、分类和响应网络安全事件的流程。这包括为人员提供指南，用于判断事件是否属于可报告的网络安全事件。\n\
  \n2.  创建 CSIRT 以及激活团队的流程。这包括确定合适的人员，并分配他们在 IRP 中描述的事件响应流程中的角色和职责。IRP 通常包括如何以及在什么时间范围内通知\
  \ CSIRT 可报告事件的要求。在关键 ICS 环境中，这些要求可能涉及在给定时间范围内（例如 24 小时内）向外部机构报告，如 NERC 的 E-ISAC\
  \ 中心。\n\n3.  为所有利益相关者制定沟通计划。这包括确定需要执行的交互和沟通。例如，计划应确定何时向谁报告事件的标准，以及收到事件报告时如何交换信息。\n\
  \n4.  培训所有人员以理解 IRP 及其在其中的角色。定义任务如何执行，计划中不同流程如何关联，以及行动如何协调——无论由谁执行工作。\n\n5.  确保应对任何事件类型所需的设备均可用。\n\
  \n在此阶段，组织应实施以下推荐做法，以保护其网络、计算设备和软件资产：\n\n*   进行风险评估\n*   加固并监控网络中的所有主机设备\n*   加固网络的外部边界\n\
  *   建立并维护恶意软件预防活动\n*   为所有用户开展网络安全意识培训\n\n### 事件响应团队的创建\n\n使组织 IRP 高效运作的关键在于其计算机安全事件响应团队。该团队是一个群体（或组织），接收疑似安全事件的报告，分析这些报告，并响应事件以使运营恢复正常水平。根据\
  \ NIST 的规定，事件响应团队应可供组织中任何发现或怀疑涉及该组织的事件已发生的人员使用。\n\n在大多数 ICS 组织中，CSIRT 由利益相关者的横向切面组成，如\
  \ 图 10.8 所述。根据组织的规模和性质，CSIRT 可能是一个既定的利益相关者群体，或是在报告安全事件或事故时临时组建的群体。\n\n![图 10.8 CSIRT\
  \ 成员](img/c10f008.png)\n\n**图 10.8** CSIRT 成员\n\n对于给定的 IRP，每个 CSIRT 成员的角色和职责应明确识别并分配给特定人员。在任何特定组织中，CSIRT\
  \ 可为以下任何团队角色指定人员：\n\n*   CSIRT 团队负责人\n*   事件处理人员\n*   IR 分诊经理\n*   IR 取证分析师\n* \
  \  IR 平台专家\n*   漏洞处理人员\n\n将特定人员纳入 CSIRT 的重要考量因素包括他们的可用性和技能组合。当事件升级时，能够快速集结和部署 CSIRT\
  \ 是所有成员的关键要求。CSIRT 必须能够上线，随即定位并有效响应事件，以最大限度地减少其对组织运营和生产力的影响。如果团队成员在需要时无法保证快速响应，应指派替代人员。\n\
  \n同样，团队成员必须具备必要的技能组合和工具，使团队能够追踪事件的根因并将其消除。他们还应具备识别肇事者以便可能进行起诉的能力。\n\n### 检测与分析\n\
  \n检测与分析阶段的首要功能是识别并验证报告的事件是否已发生，以及其是否为实际事件。事件报告可能来自组织的任何地方——用户、不同层级的管理员、监控工具，甚至外部组织。\n\
  \n当个人检测到网络上发生异常事件或事故时，他们必须接受培训，遵循组织的安全政策，要求他们采取适当行动作为事件响应的一部分。个人在应对观察到的事件中的角色通常包括联系事件响应团队的指定成员、记录事件发生时正在进行的活动，以及保持受攻击计算机开机。^(\\\
  *)\n\n潜在事件报告后，必须对其进行验证。如前所述，IRP 应规定什么构成事件、向谁报告以及如何报告。因此，识别阶段的第一步是将疑似事件报告给计划中指定的\
  \ `事件处理人员`。此时，事件处理人员接管报告的所有权。\n\n其下一步是收集有关事件报告细节的信息。无论报告来源如何，无论是个人来电还是报告事件的 IDS\
  \ 信号，事件处理人员都必须调查事件的准确性。此初步调查的主要目的是确定事件的严重性，并决定是否需要将其升级至事件响应团队。\n\n例如，如果网络入侵检测系统之一报告了异常事件，事件处理人员必须确定该报告是准确的还是误报。这通常涉及评估\
  \ IDS 日志和临床态势。如果 IDS 配置正确且运行正常，事件处理人员将向网络安全管理员报告事件，后者随即激活 CSIRT 执行 IRP 流程。\n\n###\
  \ 自动化入侵检测工具\n\n与物理安全工作一样，防止未授权访问是本地计算和控制设备级别的第一道安全防线。然而，在此级别检测入侵的发生并将其性质通知相关当局同样重要。\n\
  \n`基于计算机的入侵检测系统 (IDS)` 可通过两种方式实施：作为 `基于网络的 IDS (NBIDS)` 或作为 `基于主机的 IDS (HBIDS)`。在这两种情况下，系统的主要设计目的是监控系统（本地计算机或网络环境），记录关键事件和策略违规，并按指示进行报告。\n\
  \n虽然 HBIDS 类似于防火墙，因为它监控入站流量，但它的不同之处在于它还监控离开设备的出站流量。所有 IDS 设备均基于以下两种策略之一：\n\n*  \
  \ `特征分析`——将进出流量与已识别为恶意威胁的存储特定代码模式数据库进行比较。\n*   `异常分析`——将进出流量与系统建立的正常流量基线进行比较。该基线通过将数学算法应用于系统从流量流中获取的数据来“学习”（生成）。\n\
  \n\n\n\n## 基于特征的 IDS/IPS\n\n基于特征的 IDS/IPS 产品通常通过在内容中查找称为 `signatures` 的特定模式来工作。如果检测到“已知恶意”模式，则可以采取适当的操作来保护主机。然而，由于编程语言的动态性质，网页中的脚本可用于规避此类防护系统。\n\
  \n`signature-based IDS` 数据库通常由其制造商根据观察到的恶意特征生成并分发。因此，在特征被识别并添加到数据库以供处理之前，恶意代码已经存在。恶意代码发布与其特征签发之间的时间延迟带来了自身的安全问题。\n\
  \n## 基于异常的 IDS/IPS\n\n`Anomaly-based IDS/IPS` 系统对数据流应用统计分析技术，以确定其在任何给定时间是“正常”还是“异常”。实现统计异常检测有两种常用方法：\n\
  \n### 基于概况的异常检测系统\n\n这些系统使用数学算法来监控正常的数据流量，并开发一组描述该系统正常流量样貌的“概况”规则。开发出的概况反映了对用户过去行为的评估，并配置为当偏离这些行为达到一定水平（或阈值）时发出信号。\n\
  \n#### 基于规则的异常检测\n\n这种检测方法分析审计记录，根据过去的使用模式生成规则以生成“规则”集。系统随后监控流量，寻找不匹配规则的模式。\n\n\
  #### 渗透检测\n\n这些系统基于已知的渗透事件、系统弱点或行为模式生成规则。因此，它们通常特定于给定的主机系统。它们通常还包括由了解当前安全活动的安全专家生成的规则。\n\
  \n### 基于阈值的异常检测系统\n\n这些 IDS 系统旨在跟踪特定事件随时间发生的次数，如果事件数量超过预定数量，则生成入侵警告。\n\n最常见的可用 IDS\
  \ 系统是为本地主机系统设计的。然而，也有可用于全网络实施的类似系统。最终，最有效的 IDS/IDPS 防御是这两种类型的系统协同工作，即所谓的 `distributed\
  \ IDS systems`。\n\n图 10.9 显示了分布式 IDS 实现的示例。在这个网络架构示例中，连接到网络的每个本地主机都安装了自己的 IDS 模块。在网络服务器中还安装了一个\
  \ IDS 管理模块，用于协调信息流向各个本地 IDS 模块。\n\n本地 IDS 模块将本地审计信息传递给 IDS 管理器，后者过滤传入信息以构建特征数据库。该数据库可以基于检测到的异常、已知的误用模式，或这两种类型的数据构建。当某个动作与数据库中存储的特征之一匹配时，IDS\
  \ 将在其配置管理器的指导下生成入侵警报。\n\n![FIGURE 10.9 Distributed IDS](img/c10f009.png)\n\n**图\
  \ 10.9** 分布式 IDS\n\n## 入侵检测与防御系统\n\n一些被称为 `intrusion detection and prevention systems`\
  \ (`IPSs`) 的系统提供了一层额外的活动，旨在防止检测到的威胁得逞。这些系统被归类为反应式 IDS 系统，而简单的 IDS 被称为被动式 IDS 系统。顾名思义，这两种类型的\
  \ IDS 系统在计算机/网络环境的不同区域运行。\n\n在 IPS 系统中，如 图 10.10 所示，管理模块将攻击信号转发给一个单独的对策模块，该模块根据检测到的入侵特征的性质执行适当的响应活动。\n\
  \n![FIGURE 10.10 IPS systems](img/c10f010.png)\n\n**图 10.10** IPS 系统\n\n## 出站监控\n\
  \n大多数网络安全工作通常旨在加固网络边界并监控入站流量（`ingress monitoring`）。监控和过滤出站或 `egress traffic` 同样重要。通过这样做，网络管理员可以限制内部网络主机可访问的服务，并限制可用于将恶意软件引入网络的一种攻击向量。\n\
  \n`Egress monitoring` 在安全策略和可接受使用策略领域的网络安全策略层面建立。与所有其他网络安全策略一样，这些策略用于为代理服务器、防火墙和其他\
  \ SIM 工具制定出站规则，以限制网络流量从受信网络向低信任网络的外流。这些规则配置为阻止不符合 `egress filtering rules` 所建立的安全规范的数据包。这些规则配置为阻止外向流量流中的特定类型流量。\n\
  \n*   **不安全的数据传输**——涉及知识产权或受版权保护材料的通信。\n*   **未授权的通信**——涉及组织网络上无权将数据发送出网络的服务器或端点设备的通信。\n\
  *   **未批准的外部站点请求**——涉及已知恶意互联网目的地的传输，如僵尸网络命令与控制中心、敌对 ISP 和被劫持的地址空间。\n*   **出站恶意软件活动**（驻留在受损系统上或利用网络资源传播攻击或恶意软件的未授权用户的软件）——这包括在\
  \ DDoS 攻击中使用僵尸程序或传播垃圾邮件。\n\n在 `advanced persistent threat` (`APT`) 案例中，攻击者入侵网络的一台或多台设备，并长时间掩盖其\
  \ `command-and-control` 活动，将数据渗漏到非预期位置。出站监控可能是安全事件正在发生的唯一迹象。\n\n并非所有出站流量都可疑。因此，出站策略的制定必须仍能按需提供出站服务。这涉及分析网络使用情况，以确定哪些用户和应用程序合法地需要位于外部服务器或互联网上的服务。然后管理层必须决定允许哪些服务接收出站数据。作为同一过程的一部分，管理层应定义整个组织要阻止或允许的任何内容类型，并注明特定用户群或部门的特定内容类型。\n\
  \n生成的允许服务列表通常包含支持组织 Web 功能的网络资产（HTTP 和 HTTPS、SMTP、POP/IMAP 和 NTP 服务），以及经批准的外部连接的域名和\
  \ IP 地址。\n\n## 事件响应\n\n如果 `incident handler` 断定发生了真实攻击并宣布进入事件状态，下一步可能是确定如何将关键网络资源和数据恢复到运行水平。必须通知\
  \ CSIRT 团队，并将初始事件信息从事件处理人移交给团队。CSIRT 必须接管 IRP 剩余部分的执行。这包括但不限于以下内容：\n\n*   对指定事件处理人提供的信息进行详细分析（日志分析）\n\
  *   采取措施遏制事件并限制组织的风险敞口\n*   执行根因分析活动以确定导致事件的事件源头\n\n\n\n\n## 事件响应处理\n\n## 修复事件\n\
  \n*   通过确定是根除还是隔离事件的根因来修复事件（前提是根因是某种形式的恶意软件）\n*   实施具体步骤以从事件影响中恢复\n*   如有必要，利用 IR\
  \ 流程结束时创建的事件响应报告中的信息更新 `IRP`\n\n## 取证日志分析\n\n**数字取证** 是从数字设备中调查和恢复信息的科学。该定义实际上涉及数字取证的不同子集：\n\
  \n*   **计算机取证**——采用数据恢复技术从数字计算设备中识别、保存、恢复和分析数字信息的科学\n*   **网络取证**——为异常流量类型和入侵检测目的而对网络流量进行监控和分析\n\
  *   **取证数据分析**——检查数据结构以发现活动模式\n\n虽然在特定事件响应期间可能需要执行取证数据分析，但大多数 `OT CSIRT` 的工作涉及计算机和网络取证活动。更具体地说，它们涉及执行取证日志分析。虽然取证日志分析有一门不断发展的科学，但\
  \ `IR` 分析师通常花费时间搜索日志，寻找两个要素：事件关联和入侵迹象。\n\n在某些 `OT` 环境中，这些要素可能难以找到，因为此类数据可能不可用或不足以发挥作用。这是因为在许多\
  \ `ICS` 网络中，通常没有发生实时监控。许多传统 `OT` 设备具有较差或没有日志记录功能。此外，在这些环境中，现有的日志记录功能通常未正确配置或定期监控。这些因素共同导致事件完全被遗漏。\n\
  \n### 分析/事件关联\n\n计划分析阶段的大部分分析工作涉及收集系统和网络日志并从中关联事件数据。\n\n事件分析师寻找的一些关键项目包括所有类型的*异常行为*。例如，分析师通常检查日志中的网络安全事件迹象，包括*检测到的成功登录尝试*、*检测到的失败访问尝试*和*失败的登录尝试*，以及*检测到的恶意代码*的出现。\n\
  \n例如，异常数量的成功或失败登录尝试可能表明攻击者试图渗透网络。一旦发现，此类审计结果通常被视为攻击者试图识别和使用密码、试图突破访问控制列表或试图解密加密数据。因此，此信息应促使组织修改其密码策略或指定额外的用户教育。同样，如果日志分析显示特定用户账户在非正常时间被使用，这可能表明该用户的登录账户已被泄露。\n\
  \n`IR` 分析师可能会过滤日志文件，以将特定类型的事件聚合在单个报告中，或发现显示特定重复活动的匹配事件模式。例如，回想一下 `IDS`、防火墙、托管交换机、路由器和网络设备提供异常或未接受的网络数据包或异常网络流量的日志和警报通知。事件响应人员可能会分析这些日志，寻找许多不同类型的异常：\n\
  \n*   与第三方业务网络的未授权连接\n*   到互联网或已知恶意域名/IP 地址的意外内部连接\n*   `ICS` 特定协议攻击的证据（`Modbus`、`DNP3`、`Profinet`、`EtherNet/IP`）\n\
  *   远程访问利用的迹象——使用默认账户或凭据的登录尝试\n*   异常的服务器和连接设备日志条目，例如设备离线或表现异常\n*   来自反恶意软件工具、入侵检测系统或其他安全设备/系统的警报或错误消息\n\
  *   高 `CPU` 或网络带宽使用率的出现\n*   相对于基线的未记录软件或固件更改\n\n## 遏制、根除和恢复\n\n事件响应流程的下一步是*遏制*。在事件经过调查并被确认为合法后，是时候激活\
  \ `CSIRT` 并获取事件处理人员收集的初始信息了。\n\n当发生已识别的事件时，遏制它的第一步应该是通知所有可能受事件影响的相关利益相关者。让利益相关者参与进来是阻止许多类型攻击蔓延的关键步骤。\n\
  \n接下来，`CSIRT` 必须与利益相关者合作，就应采取的行动达成共识，以防止攻击进一步深入组织或蔓延到网络的其他区域。让组织不同方面的利益相关者各自实施自己的遏制事件工作可能非常低效且代价高昂。\n\
  \n为实现这一点，团队的技术成员必须将其资源投入流程以实施遏制行动。此外，团队的公共关系管理成员应开始控制有关事件的公共沟通。\n\n此时，团队还应意识到他们采取的行动可能涉及可能成为证据的信息。因此，他们必须采取与获取和保存潜在证据相关的行动。重要的是要确保他们不会为实现快速或短期的遏制级别而盲目销毁证据。这通常涉及在执行每个新步骤之前创建并记录所有活动的备份。\n\
  \n### 根除/隔离\n\n遏制事件消除了事态的紧迫性，并为制定和实施量身定制的补救措施提供了时间。事件与拒绝服务、入侵还是恶意软件感染有关？这很重要，因为不同类型的事件通常采用不同的补救方式。如果识别出入侵，采取的第一步应该是限制入侵者向网络内外发送流量的能力。\n\
  \n例如，采取措施通过更新网络边缘的防火墙来加强网络边界保护，确保它们阻止已知威胁使用的 `IP` 地址。此外，搜索并拒绝出站连接，以便服务器和关键基础设施设备无法直接与互联网通信。\n\
  \n另一方面，如果事件基于恶意软件感染，您必须查找并缓解导致攻击的恶意软件。您还必须删除或禁用用于发起攻击的进程/协议，以及移除造成漏洞的服务/应用程序。\n\n\
  如果根因被确认为恶意软件，必须决定是*清理*、*隔离*还是*根除*它。在许多情况下，如果选择了错误的选项，会出现意外结果。例如，在防病毒程序上选择“删除（根除）所有受感染文件”选项可能会对操作系统或应用程序的正常功能和特性产生不利影响。\n\
  \n在进行任何根除活动之前，应找到最新的备份，以确保如果删除产生任何不可预见的后果，可以恢复系统以便考虑其他替代方案。应在网络上运行漏洞测试，以确定移除操作是否可能向环境中引入了任何新漏洞。\n\
  \n\n\n## 选择 `Clean` 选项\n\n针对与蠕虫或特洛伊木马相关的事件选择 `Clean` 选项，无法修复该事件，因为根本原因在于文件本身，因此无法清理。此选项会从文件中移除感染代码，但不会真正删除文件本身。这仅在合法文件被非法代码感染时才有帮助。\n\
  \n## 选择 `Quarantine` 选项\n\n选择 `Quarantine` 选项会将文件移动到由防病毒程序控制的保留区域。文件不会被永久删除，也不会被修复——只是被隔离。这通常是一个相当安全的选项，因为在删除文件会影响系统运行的情况下，它保留了文件。\n\
  \n## 恢复\n\n在 IRP 流程的遏制、根除、恢复阶段的 `recovery` 部分，将采取行动验证受事件影响的所有系统和服务是否已完全恢复到正常运行状态。在\
  \ CSIRT 确认事件已完全修复后，他们必须恢复利益相关者对系统的信心。\n\n为此，系统人员必须测试受事件影响的系统（或系统）的运行情况，以确保其完全正常。此外，让系统管理利益相关者参与观察恢复后的系统，并由他们宣布系统已完全恢复运行。\n\
  \n在关键 OT 环境中，组织可能需要制定程序，以保护在需要执行其 IRP 的事件调查中有用的数据。始终采取措施保持对任何证据的有效控制，并将所有内容记录在适当的证据保管链表格中，以维护其完整性。\n\
  \n如前所述，虽然移除受感染的资产/文件并将流程恢复到正常运行状态等修复步骤是所有事件响应计划的主要目标，但必须意识到，通向这一目标的活动（如删除文件、关闭系统以更换硬盘驱动器，或将系统恢复到先前版本）可能会破坏可用于确定根本原因的取证证据。\n\
  \n在许多情况下，在恢复系统之前获取取证信息是事后确定发生了什么的唯一途径。取证收集过程通常也是针对攻击可能采取的任何法律行动的基础。\n\n取证收集过程待办事项列表的首位实际上是一项“不要做”的事项——在攻击期间或在获得并记录事件信息之前，不要关闭计算设备。在关闭受影响设备电源之前，重要的是收集系统内存和硬盘驱动器（如果可能）中任何易失性数据的镜像。创建这些镜像后，即可安全地将受影响设备从网络断开并将其关机。\n\
  \n最后一步是将受影响设备恢复到其完全运行状态。这通常涉及从备份副本或基线快照进行恢复。\n\n## 事件后活动\n\nNIST 指南将 `post-incident\
  \ activities` 的 `lessons learned` 和改进步骤确定为事件响应生命周期中最重要的部分。这些步骤帮助组织在预期新威胁和改进技术方面不断发展。所有参与重大事件的各方应在响应工作结束后参与经验教训会议，以确定发生了什么、做了什么、本可以做却没做的事，以及响应计划的执行效果如何。\n\
  \n### 根因分析\n\n实施遏制措施后，CSIRT 必须将注意力转向定位事件的根本原因。这是通过 `root-cause analysis` (`RCA`)\
  \ 来完成的。RCA 是一种问题解决方法，用于将促成因素与根本原因区分开来。*促成因素* 是指移除后会提供改进条件但不能防止事件再次发生的任何条件。`root\
  \ cause` 是指移除或中和后能防止事件再次发生的条件或项目。\n\n应将所有收集到的事件数据汇总并彻底分析。对事件特征的分析可能会显示出需要解决的系统性安全问题，或者指出必须缓解的单一漏洞。无论哪种情况，该分析都可用于更新\
  \ IRP，并建议需要采取的任何额外控制措施，以加强组织的网络安全态势。\n\n### 记录/报告\n\n上一节列出的所有程序（包括响应期间采取的行动）都必须记录在案。如果有必要，可以请求联邦当局（如\
  \ CISA 或 NERC）协助进行更深入的分析。至少应分享经验教训，并调整公司安全策略以防止类似的后续攻击。\n\n请回顾，最初的事件处理人员负责为处理可能成为证据的事件信息建立\
  \ `chain of custody`。这包括创建证据保管链文档。证据保管链文档应明确指定“谁、什么、哪里、何时，以及可能的原因”，以防证据成为法律要求。\n\
  \n完成 IRP 流程后，应生成事件报告并分发给所有受影响的利益相关者。该报告应包括根因分析结果、采取的修复行动和实施的恢复活动。报告的目的是教育管理团队了解使网络更安全所需/曾经需要的工作。\n\
  \n`Cybersecurity & Infrastructure Security Agency` (`CISA`) 为政府机构制定了指南，规定联邦、州、地方和部落政府组织如何向\
  \ `National Cybersecurity and Communications Integration Center` (`NCCIC`) 和 `United\
  \ States Computer Emergency Readiness Team` (`US_CERT`) 提交事件通知。\n\n指南要求组织在其 CSIRT\
  \ 团队成员、安全运营中心 (SOC) 或 IT 部门验证事件后一小时内，报告信息系统 CIA 遭到破坏的信息安全事件。报告必须包含以下三类信息：\n\n* \
  \  影响和严重性类别\n*   攻击向量\n*   事件属性\n\n#### 影响和严重性类别\n\nNCCIS 收集事件影响和严重性信息，以分析国家网络事件评分系统\
  \ (NCISS) 的事件属性。收集的信息还用于计算由 NCISS 开发的严重性评分。严重性评分类别范围从基线（白级或蓝级）到低（绿级）、中（黄级）、高（橙级）、严重（红级）再到紧急（黑级）。NCISS\
  \ 所需的影响和严重性类别数据包括以下内容：\n\n*   `Functional impact`——这是对业务功能或提供服务能力影响程度的衡量。分配的严重性级别包括：无影响、最小非关键影响、最小关键影响、重大非关键影响、非关键服务中断、重大关键服务影响、关键服务中断及控制丧失。\n\
  *   `Information impact`——此条目描述丢失、泄露或损坏的信息类型。影响报告选项包括：无影响、疑似但未识别、隐私数据泄露、专有信息泄露至非关键系统破坏、关键系统数据泄露、核心凭证泄露、关键系统破坏。\n\
  \n\n\n\n## 可恢复性\n\n此条目用于确定从事件中恢复所需资源的范围。选项包括常规、补充、扩展和不可恢复。\n\n## 攻击向量\n\nSP800-61r2\
  \ 指南还要求识别、跟踪和报告与网络事件相关的攻击向量。该文档描述了用于创建统一报告系统的术语及其之间的关系。它列出了以下攻击向量定义：\n\n*   **未知**——原因不明，但可能在后续报告中被识别。\n\
  *   **消耗**——一种用于破坏、降级或摧毁系统的暴力攻击。这可能是 DoS/DDoS 攻击或针对认证机制的攻击。\n*   **Web**——从网站或 Web\
  \ 应用程序发起的攻击。\n*   **电子邮件/网络钓鱼**——通过电子邮件或附件执行的攻击。\n*   **外部可移动介质**——从可移动介质源发起的攻击。\n\
  *   **冒充/欺骗**——涉及替换合法内容/服务的攻击。\n*   **不当使用**——因授权用户违反组织政策而导致的任何事件。\n*   **丢失或盗窃**——组织计算设备或介质的丢失或被盗。\n\
  *   **其他**——不属于上述任何列出类别的任何攻击。\n\n## 事件属性\n\n与报告事件相关的属性也由 NCISS 进行跟踪。它们定义其属性类别如下：\n\
  \n*   **观测活动位置**——此类别描述检测到观测活动的位置。标准属性定义包括业务 DMZ、业务网络、业务网络管理、关键系统 DMZ、关键系统管理、关键系统、安全系统和未知。\n\
  *   **行为主体表征**——此类别用于描述涉及事件的行为主体类型。\n*   **跨部门依赖性**——此条目是由国土安全部 (DHS) 关键基础设施分析办公室\
  \ (OCIA) 进行的跨部门分析确定的加权因子。\n*   **潜在影响**——此条目是因受影响实体而导致的总体国家影响的估计值。\n\n完整的指南副本及其定义可从\
  \ `www.cisa.gov/uscert/sites/default/files/publications/Federal_Incident_Notification_Guidelines.pdf`\
  \ 获取。\n\n## NERC CIP 008-6\n\n在电力生产和分配市场中，NERC CIP 008-6《网络安全事件响应计划规范》为 BES 运营商提供了生成网络安全事件处理程序的指导。\n\
  \n这些指南包括为网络安全事件响应团队和个人建立角色和职责。它还规定了事件处理程序的要求，如前文所述的四阶段模型中所述。与其他 CIP 标准一样，CIP 008\
  \ 标准规定了进行 IRP 测试（每 15 个日历月）的条件和时间，以及报告要求。\n\n## 复习题\n\n以下问题测试您对本章所呈现材料的掌握情况。\n\n\
  1.  什么是建立的参考点，用于定义组织可接受的风险水平（其风险容忍度）？\n2.  ____________ 是一个持续的过程，它将环境中检测到的变化与已批准的变更请求\
  \ (RFC) 进行比较。\n3.  在 ICS 网络环境中，谁负责分析并确定是否应应用特定补丁以及何时应用？\n4.  根据 NERC CIP-007，在实施安全补丁、累积服务包、供应商发布版本以及操作系统、应用程序、数据库平台或其他第三方软件或固件的版本升级时，首要要求是什么？\n\
  5.  ____________ 涉及使用系统或工具持续监视设备和网络对象，寻找特定类型的活动或事件。\n6.  ____________ 是为分析（审计）目的而记录和存储特定事件和事务的过程。如今几乎所有在用的计算和网络设备都以某种格式生成日志。\n\
  7.  在长期存储日志信息时，实施归档日志策略前必须考虑哪两个因素？\n8.  描述作为事件响应计划一部分的个人角色中通常包含的项目。\n9.  哪种类型的入侵检测系统旨在对数据流应用统计分析技术，以确定其在任何给定时间是“正常”还是“异常”？\n\
  10. 哪种类型的入侵检测系统旨在跟踪特定事件随时间发生的次数，并在事件数量超过预定数量时生成入侵警告？\n11. 为什么组织会有兴趣建立出站监控以阻止未加密的数据传输流出网络？\n\
  12. 事件被确认为合法后，事件响应过程的第一步是什么？\n13. ____________ 是一种用于将促成因素与根本原因分离的问题解决方法。\n14. 为什么确定事件是否与入侵或恶意软件有关很重要？\n\
  15. 确定 IRP 过程中采取行动验证受事件影响的所有系统和服务均已完全恢复到正常运行状态的阶段。\n\n## 考试题\n\n1.  变更管理策略文档应通过分配创建和维护责任来解决以下哪些内容？（选择所有适用项。）\n\
  \    1.  所有 ICS 组件的代码库\n    2.  所有 ICS 控制和网络设备的当前硬件清单\n    3.  补丁管理\n    4.  软件/固件重装\n\
  \    5.  最新的设备变更历史\n\n2.  补丁决策树根部的第一个因素是什么？\n    1.  安全态势影响\n    2.  安全影响\n    3.\
  \  技术影响\n    4.  暴露因子\n\n3.  从以下列表中，找出 ICS 软件和固件管理策略不同于典型企业 IT 网络中遇到的策略的原因。（选择所有适用项。）\n\
  \    1.  ICS 控制设备没有固件更新能力。\n    2.  ICS 设备的自动化固件管理解决方案并不广泛可用。\n    3.  工业生产设施不应为更新而停工，因为这会给组织带来生产力和盈利能力的损失。\n\
  \    4.  SCADA/ICS 环境无法像企业补丁流程相关的频率那样频繁地关闭和启动。\n    5.  固件管理不被视为整体安全策略的一部分。相反，它被视为运维职能，很少将其视为安全风险。\n\
  \n4.  从以下列表中，找出 NIST 组织定义为持续安全监控一部分的监控活动。（选择所有适用项。）\n    1.  漏洞监控\n    2.  风险监控\n\
  \    3.  应用监控\n    4.  资产监控\n    5.  主动监控\n\n5.  哪种类型的网络安全信息事件管理系统被安装用于提供网络日志的长期存储？\n\
  \    1.  安全信息事件管理 (SIEM) 系统\n    2.  安全事件管理 (SEM) 系统\n    3.  安全信息管理 (SIM) 系统\n\
  \    4.  网络安全事件管理 (NSEM) 系统\n\n6.  事件响应计划的哪一部分适用于验证报告的事件是否发生且为实际事件？\n    1.  事件识别阶段的报告部分\n\
  \    2.  事件识别阶段的识别部分\n\n\n\n\n\n# 第 11 章：灾难恢复与业务连续性\n\n## 简介\n\n灾难可定义为造成组织流程运作中断、对其生产力和盈利能力产生不利影响并需要恢复工作以纠正的事件。组织必须能够在各类小型紧急情况和大型灾难发生时继续运营，以确保组织的健康发展和持续经营。\n\
  \n现代企业极度依赖其通信基础设施，因此“网络”是任何组织连续性计划中最重要的组成部分之一。数据丢失会转化为系统停机、生产浪费、客户不满以及公司收益减少。\n\n\
  尽管预防措施始终是应对潜在灾难的首选工具，但它们无法保证永远不需要系统恢复。因此，应设计灾难恢复流程，以便在因意外、盗窃、蓄意破坏或自然灾害导致关键故障时，恢复组织网络的全部或部分功能。\n\
  \n正如第 8 章“ICS 安全治理与风险管理”中所述，组织依赖三种相互关联的计划来应对这些可能性：*事件响应计划*（*IRP*）、*业务连续性计划*（*BCP*）和*灾难恢复计划*（*DRP*）。这些计划通常具有重叠的功能，但它们是不同的。*BCP*\
  \ 旨在预判并为组织业务流程中断期间持续运营所需的关键组件、目标和流程提供指导。因此，当中断或灾难发生时，*BCP* 更多是被参考而非被触发执行。*DRP* 通常在运营或数据丢失发生时被激活。*IRP*\
  \ 在检测到或报告事件或潜在事件时被触发。了解每个计划的设计目的、它们之间的关联以及何时触发每个计划，是有效保障组织运营和职能的关键。\n\n*IRP* 在第\
  \ 8 章中介绍，并在第 10 章“ICS 安全监控与事件响应”中详细阐述。在本章中，重点将转移到阐述业务连续性计划和灾难恢复计划的目的与功能。\n\n## 业务连续性计划\n\
  \n业务连续性计划是一份文档，旨在描述组织在发生任一类破坏性事件时的准备工作、增长计划和未来规划。\n\n*BCP* 被设计为统领性计划，指导其他计划的设计与实施。因此，它将与事件响应计划和灾难恢复计划建立联系。\n\
  \n*BCP* 的首要任务是识别关键业务功能，并必须针对组织风险分析和业务影响评估与分析所指出的事件，提供应对和恢复业务中断的流程与程序，以实现最具成本效益的运营持续。*BCP*\
  \ 适用于整个组织的每个内部业务单元及其外部供应商。正如您所能想象的，在这一组织层级制定的计划由高管团队开发。\n\n*BCP* 的另一功能是尝试识别所有可能阻碍或停止组织各项业务功能的灾难场景。这通常包括潜在自然灾害、公用设施中断（如电力或网络资源中断）或人为中断（如黑客或恐怖活动）等项目。\n\
  \n连同 *DRP*，一个可靠的 *BCP* 包括风险分析、业务影响分析、计划维护、培训和集成流程，以及计划验证。这些项目通常由组织的企业资源规划（*ERP*）或信息安全（*infosec*）团队创建。对于\
  \ *BCP* 要取得成功，获得高层管理人员的认可至关重要。\n\n### 系统冗余\n\n*冗余* 是指投入额外硬件以维护系统和网络资源的做法。通过增加额外设备，可以将代表单点故障的组件从运行中移除。*故障点*\
  \ 是网络中任意一旦失效就会导致关键进程关闭的要素。*故障点* 的一个例子是：*OT* 网络中唯一的数据历史服务器发生故障。在这种情况下，组织将无法记录生产数据，直到数据历史服务器功能恢复。\n\
  \n*系统冗余* 是在运营中创建并行系统以提供替代路径、维持组织运营的过程。创建此类冗余通常涉及通过备用站点提供安全恢复、安装高可用性容错网络资源，以及实施数据备份系统和方法以提供冗余数据源。\n\
  \n#### 备用站点\n\n为冗余目的创建和维护备用站点属于 *BCP* 冗余选项的最高端。建立备用站点使组织能够在重大灾难期间及整个恢复期内临时继续运营。灾难结束后，组织可能能够将运营迁回主站点。在主站点重新建立运营时，应从最不关键的流程开始。可能有必要暂时在两个站点同时工作，直到主站点完全恢复。\n\
  \n备用站点是灾难情况下可使用的设施：\n\n*   热站点\n*   温站点\n*   冷站点\n*   云站点\n\n\n\n\n这些不同设施类型的主要目的均在于恢复安全数据并维持组织的持续功能性运营。对于处理机密或秘密数据的组织而言，`安全恢复`至关重要。特别是在灾难发生时，能够在备用站点继续安全运营，且不损害数据完整性或机密性，这点极为关键。在规划可能影响网络的灾难应对方案时，安全恢复和持续运营应作为首要目标。\n\
  \n`热站点` 提供在灾难发生时继续运营所需的几乎所有资源。这些站点可能是主站点的缩减版。在某些情况下，热站点配备最少人员并同步运行，同时提供备份和容错功能。\n\
  \n在主站点创建的数据库可同步备份至热站点，或在数小时内完成备份。若无人值守，人员抵达备用站点后通常几分钟内即可投入运营。这些站点通常包含当前的数据备份以及在主站点发生灾难时立即运行所需的所有设备。计算机、线缆、网络外设、电力、气候控制和连接在热站点均可即刻投入使用。\n\
  \n当所有设备随时可用时，在灾难演练中测试热站点会容易得多。然而，由于成本极高，大多数组织要么创建热站点的缩减版——即 `温站点`，要么改用 `冷站点`。\n\n\
  与热站点不同，`温站点` 可能配备陈旧设备，且极有可能在真正的灾难发生前处于无人值守状态。温站点也可能将备份数据存放在安全保险库或保险柜中，但灾难发生后恢复关键运营所需时间会更长。\n\
  \n`冷站点` 通常仅提供最有限的功能，直到投入额外资源。关键电话和便携式笔记本电脑将在该备用站点启动运营。这种类型的异地设施在真实紧急情况下功能性不强，但可提供额外存储空间，并在安全室或保险库中存放备份数据。无论建立哪种类型的备用站点，都应定期测试该站点以确保持续功能性。\n\
  \n在冷站点，设备通常仅限于基本设施功能，包括地板、墙壁、电力、照明和空调。网络计算机通常不安装在冷站点。不过，某些组织可能选择在其冷站点配备非运行状态的设备。决定因素在于投资成本与非生产性设备包预期回报的权衡。\n\
  \n从逻辑上讲，冷站点最难测试，因为它们缺乏日常运营所需的大多数设备。仅拥有冷站点而不进行测试会带来虚假的安全感。当真正的灾难降临时，冷站点可能无法满足恢复需求。\n\
  \n`基于云的灾难恢复站点` 使组织能够安全地将其数据、操作系统和软件工具迁移至云端，以利用相较于其他站点类型的成本优势。基于云的服务运营可根据需求在 `云服务提供商`\
  \ (`CSP`) 的虚拟服务器上弹性扩展或收缩。由于数据始终可通过互联网访问，组织指定成员随时随地均可从单一位置访问数据。通过利用高网络带宽和服务的可持续扩展性，云确保了恢复过程的效率和可靠性。\n\
  \n`私有云服务` 日益普及，因此越来越多地由内部 IT 员工提供支持。`公有云服务` 通常极少需要本地支持，但软件即服务产品可能要求启用特定防火墙规则以实现最佳使用。`混合云服务`\
  \ 则结合了公有云和私有云环境，其集成程度可以非常无缝，以至于用户可能忘记其数据并非完全存储在本地。\n\n#### 高可用性/容错系统\n\n要使生产设施取得成功，必须具备生产产品的能力。分钟级的停机通常意味着收入损失；因此，组织在维持其\
  \ OT 环境高可用性方面投入巨大。容错是确保这种高可用性的一种方法。\n\n在小型组织中，一台服务器可能专门用于提供由多个物理磁盘驱动器组成的阵列，以实现容错。这种数据可用性的实现方式称为\
  \ `独立磁盘冗余阵列` (`RAID`)。如果其中一个物理驱动器发生故障，可将其更换，并从 RAID 阵列中的其他磁盘重新生成数据。\n\n虽然 RAID 有多种类型，但其中一些并非旨在提供容错。相反，它们用于增加可用空间或卷以存储更大量的数据。然而，`RAID\
  \ 1` 和 `RAID 5` 解决方案确实提供容错。`RAID 1` 提供主磁盘的镜像，通常用于保护操作系统免受故障影响。RAID 1 可采用单控制器加两个物理磁盘（称为\
  \ `镜像`），或双控制器加两个物理磁盘（称为 `磁盘双工`），后者比磁盘镜像更安全。图 11.1 展示了 RAID 1 应用中镜像阵列的运行。\n\n![图\
  \ 11.1 RAID 1](img/c11f001.png)\n\n**图 11.1** RAID 1\n\n`RAID 5` 要求至少三个物理磁盘，且分区大小相似才能实现。数学奇偶校验元素在磁盘间生成容错，类似简单的代数方程：A\
  \ + B + C = D。若任一分区元素故障，均可重新生成。例如，若上式中 A 发生故障，因 A = D – (B + C)，故 A 可被重新生成。图 11.2\
  \ 展示了 RAID 5 阵列的运行。\n\n![图 11.2 RAID 5](img/c11f002.png)\n\n**图 11.2** RAID 5\n\n\
  RAID 总体上是大多数操作系统维护数据的一种相当有效的方法，也是一种支持高可用性的技术解决方案。然而，若 RAID 阵列将恶意代码复制并损坏其他磁盘，则会失效，数据仍可能丢失。鉴于此潜在威胁，备份仍然必要。\n\
  \n提高网络服务可用性的另一种方法是服务器集群。`集群` 涉及将多台服务器分组或联网以执行相同的客户端服务，如图 11.3 所示。这样，若其中一台服务器故障，其他服务器将继续执行所需服务。\n\
  \n![图 11.3 服务器集群/负载均衡](img/c11f003.png)\n\n**图 11.3** 服务器集群/负载均衡\n\n对于某些操作系统，集群也可用于平衡流量负载、增强容错，并要求所有系统处理客户端服务请求。但切勿仅依赖集群。尽管服务器集群在运行时提供高可用性，但若仅使用一个外部控制或存储设备，此类服务器分组就会成为单点故障目标。仍强烈建议进行备份。\n\
  \n### 本地虚拟化存储\n\n\n\n## 存储虚拟化与云存储\n\n企业网络本质上往往会产生大量数据。在某些情况下，这些数据可能需要长期存储。根据组织的数据处理策略，数据至少最初可能存储在本地计算机上。然而，在企业网络中，数据更有可能远程存储在网络中某处的数据库服务器上。\n\
  \n单个服务器通常通过 RAID 策略虚拟化数据存储（如前所述）。然而，当网络的存储需求扩展到多台服务器时，通常会采用基于网络的虚拟化技术来创建一个可以无缝管理的统一存储解决方案。这是通过**存储虚拟化**实现的。\n\
  \n存储虚拟化的最终目标是创建一个单一存储池，能够跨各种平台类型和广泛分散的地理位置进行管理。两种基本技术提供这些存储服务：\n\n*   **网络附加存储（NAS）**：一种虚拟化存储系统，同时提供存储和文件系统结构\n\
  *   **存储区域网络（SAN）**：一种在磁盘和卷管理工具中显示为单个磁盘的存储系统\n\n这些虚拟化存储解决方案帮助管理员妥善管理大型单个存储池。\n\n\
  尽管许多 SAN 实现由异构存储服务器和磁盘阵列组成，但虚拟化创建了这些磁盘的逻辑视图，这与其物理架构截然不同。这为存储管理员提供了一张连接到服务器的所有磁盘的整合资源映射，显示为单个服务器资源。各个物理磁盘驱动器基本上从其正常操作中解耦，并重新配置为一个“逻辑”且整合的存储镜像。\n\
  \n虚拟网络存储解决方案目前通过两种方式实现：使用专用硬件**设备型虚拟化**或**交换机型虚拟化**。这两种技术执行相同的服务，但实现方式不同。\n\n设备是放置在用户网络和存储网络之间的封闭存储管理系统，如图\
  \ 11.4 所示。\n\n![FIGURE 11.4 Appliance-based virtualization](img/c11f004.png)\n\n\
  **图 11.4 设备型虚拟化**\n\n如图 11.5 所示，基于交换机的存储虚拟化是通过用于连接 SAN 设备的托管交换机实现的，正如本章前面所述的其他 VLAN\
  \ 实现。这些设备也位于用户网络和存储网络之间，但可能采用不同的技术来提供存储管理功能。\n\n![FIGURE 11.5 Switch-based storage\
  \ virtualization](img/c11f005.png)\n\n**图 11.5 基于交换机的存储虚拟化**\n\n### 云存储\n\n由于灾难恢复计划依赖于通过复制执行数据备份和恢复，以确保组织数据可用，帮助其尽快恢复正常业务，**云存储**已成为许多组织灾难恢复流程中的重要环节，因其灵活性、成本效益、可靠性和可扩展性。\n\
  \n设计基于云存储的灾难恢复计划时，主要关注点在于：该解决方案是否在灾难发生前，以合理成本提供高数据可靠性的高效备份和恢复计划？已有多种模型用于解决这些问题。\n\
  \n第一种选择是**单云环境**，可在私有云、公有云或混合云环境中实施。灾难恢复计划的制定者必须评估成本、最佳设施位置、所需存储的最佳数据量，以及将使用的存储和复制方法。然而，与集中式存储解决方案相关的数据安全性将数据置于单一存储点，若云服务提供商发生任何故障，风险极高。\n\
  \n其他模型包括**多云环境**，它们在地理上分布，因此所有正在使用的云存储站点同时受影响的概率极低。图 11.6 描绘了私有云模型中典型云存储解决方案的架构。它由一台存储应用程序数据的服务器组成。该服务器远程连接到分布在不同区域的一组备份服务器。每个备份服务器连接到两个额外的备份服务器：本地备份服务器和远程备份服务器。为最大程度减少网络需求并加速备份和恢复操作，采用增量备份方法逐步更新数据。大多数\
  \ CSP 提供此类数据备份和恢复模型，以便因灾难遭遇大范围中断的客户能迅速恢复。\n\n虽然云计算为组织提供了具有成本效益的存储选项，但与第三方供应商共享组织数据会降低数据控制安全性。由于\
  \ CSP 拥有环境，组织在一定程度上依赖其环境的可靠性，以保证组织数据的完整性和隐私。\n\n即使是最先进的 CSP 也曾因各种原因经历大范围中断并停止公共服务。BCP\
  \ 必须考虑到这种数据可用性和可靠性中断的可能性。为保护组织免受此类事件影响，可能需要指定使用来自多个供应商、多个云服务中心的云服务。\n\n## 系统备份与恢复\n\
  \nBCP 的关键要素之一是建立**数据备份和恢复策略**，以便在灾难发生时实施。通常由网络和/或服务器管理员负责在备份和恢复计划中实施这些策略，以确保网络运行（以及组织运作）能在灾难情况下恢复。\n\
  \n没有备份数据，就无法制定高效恢复的应急计划（甚至可能完全无法恢复）。备份工具使组织能够创建文件、文件组或整个磁盘驱动器的扩展副本，以便在服务器磁盘驱动器崩溃或其内容损坏时使用。\n\
  \n通常，只有管理员或特别指定的备份操作员组成员被授予适当权限，可备份和恢复服务器上的所有数据，无论其权限级别如何。然而，任何用户都可以备份其至少拥有“读取”权限的任何本地文件。同样，他们可以恢复其至少拥有“写入”权限的任何内容。用户通常对自己的文件拥有这些权限，因此可根据需要对其数据执行备份和恢复。\n\
  \n与实施业务恢复计划的备份恢复部分相关的管理职责包括：\n\n*   **确定要执行的备份类型**：包括配置备份工具以执行正常、差异、增量、复制或每日备份选项。\n\
  \n\n\n\n## 备份策略与管理\n\n### 定义备份方式\n\n这包括配置验证备份的选项以及启用压缩（如果备份设备支持）。验证备份涉及将存储的数据版本与指定要备份的数据进行比较（以确保在备份期间所有信息都已正确复制）。\n\
  \n### 指定备份介质处理方式\n\n指定是替换备份介质上的现有数据，还是将新数据追加到介质末尾。\n\n### 建立备份标签\n\n以便轻松识别和区分备份介质上存在的不同备份副本：通常这涉及使用执行备份的日期和时间对备份进行标记。\n\
  \n### 确定备份时间\n\n此选择涉及安排不同类型备份发生的时间，以便对网络运行产生的负面影响最小，例如在深夜或周末，此时较少用户可能正在使用网络资源。\n\
  \n### 备份选项\n\n目前市场上可用的大多数备份实用程序都允许以多种方式执行备份。通常，备份操作分为以下几类：\n\n*   完全或全量备份\n*   部分备份\n\
  *   其他备份方法\n\n在完全/全量备份过程中（如图 11.7 所示），将备份主体磁盘的全部内容。这包括磁盘上的所有文件，包括每个目录、子目录及其内容。此备份方法每天执行备份需要安排最多的时间，但在发生故障时也能在最短时间内恢复系统。仅需要最近的备份副本即可恢复系统。\n\
  \n![FIGURE 11.7 Full or total backup](img/c11f007.png)\n\n**图 11.7 完全或全量备份**\n\n\
  *部分备份*通常用于代替定期全量备份，以节省备份存储设备上的空间。通常有三种部分备份技术用于存储数据：增量备份、差异备份和选择性备份。\n\n*   **增量备份**：在增量备份操作中（如图\
  \ 11.8 所示），系统备份自上次备份以来创建或更改的文件。从增量备份恢复系统需要使用上次全量备份以及自全量备份执行以来所做的每个增量备份。此备份方法备份系统所需时间最少，但恢复系统所需时间最多。\n\
  \n    ![FIGURE 11.8 Incremental backup](img/c11f008.png)\n\n    **图 11.8 增量备份**\n\
  \n*   **差异备份**或**仅修改备份**：指定差异备份会导致备份实用程序检查每个文件，以确定其自上次全量备份以来是否已更改。如果没有，则跳过。但是，如果文件已被修改，则将对其进行备份。此选项是在定期备份策略中一项宝贵的节省时间功能。要恢复系统，您需要上次全量备份的副本和上次差异备份的副本。图\
  \ 11.9 显示了差异或仅修改备份。\n\n    ![FIGURE 11.9 Differential or modified-only backup](img/c11f009.png)\n\
  \n    **图 11.9 差异或仅修改备份**\n\n*   **选择性备份**或**复制备份**：要执行选择性备份，操作员需遍历磁盘的树结构，标记或标记要备份的目录和文件。在标记完所有所需的目录/文件后，它们将在单次操作中备份。这种备份形式非常耗费人力，且可能无意中遗漏重要数据的保存。图\
  \ 11.10 显示了选择性备份。\n\n![FIGURE 11.10 Selective or copy backup](img/c11f010.png)\n\
  \n**图 11.10 选择性或复制备份**\n\n备份对业务连续性计划至关重要，因为事件或灾难发生后，快速数据恢复通常至关重要。在这种情况下，差异备份的恢复时间最快。但是，如果准确完整的数据对业务成功至关重要，则全量备份提供最完整的恢复。\n\
  \n无论业务连续性计划中指定了哪种备份方法，除非获得高层管理的认可，并正确实施和测试，否则将不会有效。指定的方法必须与关键人员进行演练，员工必须接受培训，以便按照完善的政策和程序中规定的备份程序实施操作。\n\
  \n### 备份介质轮换\n\n确认备份计划具有确保系统恢复所需的属性后，必须确定维护备份历史副本的时间范围。所采用的*备份介质轮换*方案将决定您能够在其中检索数据的历史时间范围。可以采用多种介质轮换方法，每种方法都有自己的恢复时间范围。\n\
  \n祖父-父亲-儿子法（如图 11.11 所示）是当今最常用的方法。此方法使用三组不同的备份介质：祖父用于月度备份，父亲用于周度备份，儿子用于日度备份。\n\n\
  ![FIGURE 11.11 The Grandfather-Father-Son method](img/c11f011.png)\n\n**图 11.11\
  \ 祖父-父亲-儿子法**\n\n儿子使用四盘磁带，每个工作日一盘，通常覆盖周一至周四，通常采用增量备份方法。父亲的周度备份通常在周五执行，使用一盘磁带，采用差异备份方法。此后，您可以重复使用相应的儿子磁带进行接下来的日度备份。月末时，您将使用一盘磁带运行祖父备份。这将是系统的全量备份。根据组织需求，您可以存储这些备份以支持持续的历史备份库，或重复使用磁带进行未来的备份。\n\
  \n### 保护备份介质\n\n另一个重要的网络安全问题是备份介质的保管和保护。因为备份介质包含公司所有有价值的专有数据，如果有人获得介质访问权限，他们可能检索公司的特权信息并加以滥用。备份介质应存放在有锁门的房间内，并且还应有签到/签出表或访问控制设备，以跟踪进出房间的人员。备份数据还应以加密格式存储，这样即使被盗或被未授权人员访问，也能保持安全。\n\
  \n#### 异地存储\n\n因为备份介质包含组织的专有信息，所以必须将其保存在安全的位置和安全的条件下。理想情况下，应至少保存两套备份介质，一套在本地，另一套在异地。因此，许多组织将备份副本存储在异地存储设施中。万一原工作场所发生灾难或盗窃，异地存储提供了一种主动保护关键资源的方法。\n\
  \n对于本地和异地位置，硬化防火保险箱是备份介质最安全的容器。出于安全考虑，只有有限数量的人员应知道备份存储位置并拥有保险箱钥匙或密码的访问权限。\n\n##\
  \ 其他 BCP 考量因素\n\n\n\n\n\n## 业务连续性规划：外部依赖与灾难恢复\n\n有若干外部变量不在组织的直接控制之下，BCP 必须将其纳入考量，以最大程度降低对组织产生负面影响的事件和灾难的效应。两个关键变量包括公用设施和供应链。组织必须依赖这些外部系统持续运行，以维持其业务流程。一旦发生灾难，必须有替代来源可用，或能将其上线以替代原有系统。\n\
  \n### 公用设施考量\n\n某些公用设施（如电力和互联网接入）对生产流程的运行以及企业网和 OT 网络至关重要。因此，BCP 中必须包含策略、程序和指南，明确组织计划如何在灾难期间应对这些服务的中断。这些策略和程序必须涵盖以下事项：\n\
  \n*   备用发电机或不间断电源（UPS）等防护设备的放置位置，以防电力公用设施无法供电\n*   如有必要，了解组织在灾难发生时可用的替代互联网连接/通信方法及其位置\n\
  \n除了电力和数据/通信公用设施外，业务连续性计划还应考虑水源和废弃物处理设施的临近程度。人员饮水和扑灭 A 类火灾需要用水。不过，BCP 的这些方面通常与企业或\
  \ OT 网络环境的恢复或运行无直接关联。\n\n### 供应链考量\n\n`供应链` 是将产品或服务从原材料环节转移至成品、准备交付给客户的系统。这正是制造组织和公用事业单位的业务本质。然而，直接或间接参与生产流程的完整组织链条可能包含众多独立组织。\n\
  \n因此，任何组织的 BCP 都必须包含针对链条中其他成员的风险分析和缓解计划。\n\n#### 供应链风险管理（NIST 800-161）\n\n美国国家标准与技术研究院（NIST）特别出版物（SP）800-161《联邦信息系统和组织的供应链风险管理实践》旨在指导组织识别、评估和缓减其\
  \ IT/OT 供应链风险。这些链条可能错综复杂、形式多样，涉及“地理上分散”的路由以及多层组织架构。由于这些原因，网络相关商品和服务的采购方在评估其购买用于\
  \ OT 网络的商品和服务的安全性方面能力有所降低。\n\n在如此漫长的供应链中，攻击者完全有可能在产品中内置或附加不需要的或恶意的功能。例如，利用供应链中不受控的环节，民族国家行为体可向用于控制敏感流程的产品编程中注入恶意代码。产品安装到工作流程后，攻击者即可利用该代码窃取信息、降低产量或导致流程彻底瘫痪。\n\
  \n2020 年的 SolarWinds 攻击便是此类攻击。它涉及一名外部国家行为体发起的软件供应链攻击，利用其 Orion 网络监控工具的更新漏洞实施。该攻击波及\
  \ 250 多家财富 500 强企业，并在 SolarWinds 向客户提供的 Orion 更新中植入了特洛伊木马。这些木马建立了后门，使第三方服务器能够远程访问客户的电子邮件、文件和其他数据。\n\
  \n## 灾难恢复\n\n`灾难恢复` 是指灾难发生后，将生产系统恢复至正常运行水平的过程。此过程不同于上一章所述的事件响应流程，它处理的是因事故、盗窃、蓄意破坏或自然灾害导致关键故障发生后，将组织流程恢复至正常运行的工作。成功开展灾难恢复操作的最重要要素包括：\n\
  \n*   妥善规划\n*   文档记录\n*   系统冗余\n*   有效的备份策略和程序\n\n根据性质，灾难可分为四大类：\n\n*   `气候灾难`：洪水、火灾、山体滑坡、风暴、污染及其他危害\n\
  *   `蓄意破坏`：纵火、法律纠纷、恐怖主义和破坏活动\n*   `公用设施与服务中断`：停电、网络中断、服务故障\n*   `设备或系统故障`：制冷故障、互联网故障和设备故障\n\
  \n组织的灾难恢复流程应设计为能在上述任一类别事件导致关键故障时，恢复其全部或部分关键系统。\n\n一份可靠的 DRP 是组织 BCP 的重要组成部分。通过为最坏的数据安全场景做规划，组织及其员工将做好准备，从可能发生的任何网络故障或系统灾难中恢复过来。成功从灾难中恢复的最重要要素包括规划、系统冗余、安全性和计划备份。\n\
  \n该计划通常由高级管理层制定，基于其 IT 和信息安全团队的大量输入。计划中重点关注的领域通常涉及技术资产和冗余操作，一旦基础设施或数据丢失即将发生或已发生，即触发这些操作。该触发点通常由事件响应团队识别。\n\
  \n计划应包含程序，描述发生电力故障时如何恢复供电，以及如何使用业务连续性计划中指定的备份系统和方法恢复丢失或损坏的数据。此外，还可能包含启动备用站点和云恢复选项以开始恢复流程的文档。\n\
  \n计划本身是为成功的灾难恢复做准备的首要因素。它应包含构成系统中每个网络段的所有组件的完整清单，以及构成每台服务器和工作站的所有组件。这包括所有需要恢复的相关软件。\n\
  \n此清单应按优先级排序；应列出对组织运行最关键的系统，以表明必须优先恢复这些系统。通过考量每个系统上数据的价值，最容易识别这些优先级。\n\nDRP 必须包含在无数据丢失的情况下迅速恢复系统所需的所有要素。这包括各部门在网络瘫痪期间保持高效运作的可靠方法，以及在基础设施恢复时成功同步和整合新生成数据的手段。\n\
  \nNIST 网络安全框架强化了这一观点。该文件中的指南指出，组织的恢复流程和程序应得到维护和测试，以确保及时恢复受网络安全事件影响的系统或资产。这基本涉及以下步骤：\n\
  \n1.  制定灾难恢复计划\n2.  测试和评估计划\n3.  更新计划\n4.  实施计划\n5.  持续进行定期测试、评估和更新计划\n\n### 规划\n\
  \n\n\n\n\n## 灾难恢复准备\n\n灾难恢复准备是管理和维护组织数据通信渠道的关键要素。数据丢失意味着系统停机和生产损失，进而导致经济损失。当然，避免不得不恢复系统的最佳工具是适当的预防。一旦发生不可避免的故障，你必须拥有一份充分的\
  \ DRP（灾难恢复计划），其中包含必要的要素，以便在无数据丢失的情况下迅速恢复。回顾一下，DRP 在第 8 章中被引入，作为风险缓解计划的关键组成部分，与 IRP（事件响应计划）和\
  \ BCP（业务连续性计划）并列。\n\n为了有效，DRP 必须包含人员识别、分类和响应灾难的流程。与 IRP 一样，创建 DRP 涉及五大主要目标：\n\n\
  *   **创建并发布应对灾难发生的策略、程序、流程和指南：**\n    *   识别并确定组织运营的关键性优先级。确定哪些运营对组织生存最为关键，以及灾难发生后应按何种顺序恢复。\n\
  \    *   识别恢复每项运营所需的资源。\n    *   创建宣布灾难状态的程序，包括确定构成灾难的情形。\n    *   规定从灾难发生中恢复的预期时间框架。**恢复时间目标\
  \ (RTO)** 表示灾难后恢复处理操作或资源所允许的时间。\n    *   创建恢复丢失或损坏数据的流程。\n*   **创建灾难响应团队及激活该团队的流程。**\
  \ 这包括以下内容：\n    *   识别合适人员，并分配其在 DRP 中描述的灾难响应流程中的角色和职责。\n    *   识别负责实施/监督计划各个方面的人员。大型组织可能会开发并培训灾难恢复团队，而小型组织可能会指定单个人接受培训作为灾难恢复经理。无论哪种情况，都必须有一名有权在灾难发生后立即做出短期决策的个人。\n\
  *   **为所有利益相关者和员工制定沟通计划。** 这包括以下内容：\n    *   识别宣布进入灾难状态时需要执行的交互和沟通。例如，计划应规定何时向谁报告的标准，以及灾难期间和灾难后如何交换信息。\n\
  \    *   创建升级程序。\n*   **培训所有人员以理解 DRP 及其在其中的角色。** 定义任务如何执行、计划中不同流程如何关联、行动如何协调——无论由谁执行工作。视灾难性质而定，这可能包括疏散程序。\n\
  *   **最后，确保应对任何类型灾难所需的设备均可用。** 这包括在步骤 1 中识别并确定优先级的、恢复正常运营所需的所有资源的明确清单。DRP 应包含组织网络组件的完整清单，以及灾难后必须恢复的任何相关软件。此清单应具有优先级结构，指明哪些系统对公司运营最为关键并需优先恢复。还应包括各部门在网络和流程瘫痪期间运作的方法，以及基础设施恢复后成功同步数据的手段。\n\
  \n## 灾难恢复计划文档化\n\nDRP 至关重要，但如果不定期更新，它将迅速过时。与 IRP 一样，DRP 的变更必须记录在案，因为它提供了避免灾难的**经验教训**，并可用于改进安全策略和程序。计划应包含组织安全策略设定的要求，规定如何以及何时更新，以及如何存储和保存。还必须有流程确保所有利益相关者知晓该计划，并在必要时能够实施。\n\
  \nDRP 应包含针对各类数据丢失和系统故障进行恢复的规定。这些情况可能包括自然灾害（洪水、火灾等）、电力相关故障（停电等）或系统数据丢失（病毒、破坏、黑客攻击等）。\n\
  \nDRP 文档应以硬拷贝形式复制，不仅在现场可用，还应与异地系统备份一起存储。随着计划的更新，所有副本也必须同步修订。灾难恢复计划至少应包含以下支持文档：\n\
  \n*   正式 DRP 的打印副本，以便分发给灾难恢复团队的所有相关方\n*   DRP 文档包内容的完整清单\n*   灾难恢复团队所有成员的姓名和联系信息清单\n\
  *   与所有端点和网络连接设备相关的硬件和软件清单，以及任何适用信息手册的副本\n*   存储在移动硬盘或其他介质上的关键软件和硬件驱动程序副本，这些介质可安全地存放在远离设施的地方，并采用加密和密码保护格式\n\
  *   主要和异地备份数据包的位置和联系数据\n*   基准指标，包括最新和必要的历史数据\n\n## 灾难响应/恢复团队\n\n视灾难事件性质而定，灾难恢复团队中的特定人员可能被指定继续执行关键运营，而其他员工则被允许离开或疏散。\n\
  \n如前所述，大型组织可能会开发并培训广泛、多方面的灾难恢复团队。团队构成因组织而异；然而，每个灾难恢复团队都应有指定的负责人。即使在小型组织中，也应有一人接受灾难恢复经理培训，并能在灾难发生后立即做出短期决策。\n\
  \n灾难恢复团队成员必须接受培训，以记录与灾难响应和恢复工作相关的事件、变更和修订。尽管在紧急情况尤其是灾难期间有效记录这些活动可能很困难，但这对灾难恢复工作的有效性至关重要。\n\
  \n### 测试 DRP\n\n与任何组织范围的安装、升级或故障排除操作一样，在公司的实际工作环境中测试 DRP 可能很困难。**灾难恢复演练**应是一项年度计划活动。如果没有经验，就无法充分理解实施\
  \ DRP 所涉及的困难。演练 DRP 将强化及时且持续执行备份的重要性，以确保数据恢复始终可行。\n\n可以制定多种策略，在不关闭网络的情况下测试 DRP。为了熟悉关键要素，灾难恢复团队成员应研究计划并在全年对其部分内容进行演练。通过这样做，他们将揭示、考虑并纠正计划中的各种弱点，并根据需要添加新功能。即使是最周密的计划也可能存在弱点，但持续排练和修订的计划将有助于将其降至最低。\n\
  \n测试 DRP 时，灾难恢复团队必须确保其功能正常，且所有人员都了解各自的角色。值得审查的计划领域包括以下内容：\n\n\n\n\n\n## 文档排版示例\n\
  \n## 核心目标\n\n*   确保文档可用，且任何必要组件都能轻松定位。\n*   测试通知程序，以便在网络或其关键组件瘫痪时，始终有可靠的方式联系人员。例如，如果公司的电子商务网站宕机，相关主管需要知情。\n\
  \    *   确保随时掌握这些人员的当前电话号码（全天候）。\n    *   核实所有设备供应商和制造商的电话号码可用且正确。\n    *   检查所有支持合同，确保仍在生效的合同有可用的电话号码。\n\
  *   核实计划中列出的所有备用组件或服务器的位置和标识是否正确。\n\n## 备份测试策略\n\n备份介质和技术应至少每月测试一次，对于更关键的网络段，可每周测试一次。管理员应至少每季度执行一次完整恢复测试。此恢复测试应通过将数据还原到不同于其原始位置的文件夹来执行，以确保备份包含所有必要数据，且不受预存文件的污染。\n\
  \n大型企业通常会定期测试完整的灾难恢复计划。为在测试恢复计划的同时保持业务连续性，它们通常会启用商业热站设施作为系统备份。该设施拥有组织在线数据的完整备份，可在主站点因测试而停机期间提供业务连续性。这种安排为\
  \ IT 人员在 DRP 的知识与执行方面提供了实时测试环境。\n\n完成 DRP 测试后，结果可能表明需要更多规划或故障排除。例如，如果数据被意外恢复到本应恢复到文件服务器的邮件服务器上，必须仔细检查\
  \ DRP 以确定出错原因。随后需对其进行编辑并再次测试，以确保问题已消除。\n\n## 更新计划\n\n无论 DRP 多么关键，如果不定期更新，它很快就会过时。计划应包含有关如何以及何时更新、存储和保存的详细程序。此外，DRP\
  \ 文档应以硬拷贝形式复制并即时可用于现场。副本还应与所有异地系统数据备份一起存储。随着计划的更新，这些副本也必须持续修订。\n\n## 实施 DRP\n\n\
  发生实际灾难时，应按顺序遵循 DRP 中概述的步骤，以确保网络恢复全面运行，并找出故障的实际原因。\n\n1.  采取措施查明导致网络或其某个组件瘫痪的原因。\n\
  2.  确定如何执行必要的修复。\n3.  识别任何故障组件。\n4.  将故障组件与现有的正常组件匹配。\n5.  按照 DRP 实施恢复和还原过程。\n\n\
  DRP 应提供足够的文档和测试结果，以允许组织的 IT/OT 运营和数据完全恢复。实施后，网络应恢复正常运行。\n\n## NERC CIP-009-6\n\n\
  **NERC CIP-009-6 标准**“关键网络资产恢复计划”指导 BES 组织为其关键网络资产创建、实施和测试业务连续性及灾难恢复计划。该部分 CIP 标准包含三大主要领域：\n\
  \n*   **恢复计划规范**：指导 BES 组织根据 CIP-002 标准识别的关键网络资产，制定并审查一份或多份恢复计划：\n    *   指定会触发恢复计划激活的事件或活动。\n\
  \    *   定义当计划激活时将投入行动的 CIRT 团队成员的角色和职责。\n    *   计划还必须包含存储和测试备份介质的策略，以确保其可用于恢复\
  \ BES 网络系统功能。根据 CIP-009 标准，此做法必须至少每年进行一次。\n    *   BES 组织必须创建、实施和测试备份及存储所有数据的策略，这些数据用于在事故后将网络资产恢复运行。这也可能包括维护与关键网络资产相关的备用组件或软件副本。\n\
  \    *   组织必须开展模拟实际事故的活动，这些事故会激活恢复计划。这些演练可以是基于纸面的，也可以是全面运行的。根据 CIP-009 标准，这些演练必须至少每年进行一次。\n\
  \n*   **恢复计划实施与测试**：应包括以下内容：\n    *   **测试**：计划必须包含恢复计划有效运行的证据。此信息可以基于实际事故恢复的报告、桌面演练或运行演练的形式呈现。此证据必须至少每\
  \ 15 个日历月在计划中更新一次。\n    *   **功能性**：计划必须包含证据，验证来自 BES 网络系统恢复的代表性样本可用且与当前配置兼容。\n\
  \    *   **运行测试**：组织的每份恢复计划必须通过运行演练进行测试，至少每 36 个月一次。\n\n*   **经验教训，包括恢复计划审查、更新和沟通**：包括以下内容：\n\
  \    *   **时间框架**：要求在完成恢复计划测试或实际恢复操作后的 90 个日历日内进行恢复计划审查和更新。\n    *   **通知**：计划必须通知恢复计划中有明确角色的每个人员或群体，告知基于经验教训的所有计划更新。\n\
  \n## 复习题\n\n以下问题测试您对本章所呈现材料的掌握程度。\n\n1.  \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ 是一份文档，旨在描述组织的准备工作、增长计划和未来规划，以防任一类型的破坏性事件发生。\n\
  2.  灾难恢复计划 (DRP) 的目的是什么？\n3.  为什么要执行部分备份而不是定期备份？\n4.  描述 Grandfather-Father-Son（祖父-父-子）备份介质轮换方案的操作。\n\
  5.  列出 DRP 文档中通信计划部分应涵盖的关键项目。\n6.  组织的业务持续性政策中，关于生产供应链的第三方成员应涵盖哪两项内容？\n7.  测试 DRP\
  \ 的主要顾虑是什么？\n8.  \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ 是指投入额外硬件以维护网络资源的做法。\n9.  描述组织为何要承担创建和维护备选站点以实现冗余的额外费用。\n\
  10. \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ 是网络中的任何元素，如果它发生故障，关键进程就会关闭。\n11. 描述典型温站点位置中的设备类型。\n\
  12. 哪种虚拟化存储系统同时提供存储和文件系统结构？\n13. 确定应采取哪两个基本步骤来保护备份介质。\n14. 使用基于云的存储系统进行数据存储最严重的缺点是什么？\n\
  15. \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ 表示灾难后恢复处理操作或资源的规定时间。\n\n## 考试题\n\
  \n1.  灾难恢复过程旨在实现什么目标？\n\n\n\n\n\n# 考试题目\n\n## 1. 组织准备、增长计划和未来规划的描述\n1.  描述组织的准备工作、增长计划，以及在发生任一类型破坏性事件时的未来规划\n\
  2.  创建并发布应对灾难发生的策略、程序、流程和指南\n3.  识别并确定组织运营的关键性优先级，确定哪些运营对组织生存最为关键，以及灾难发生后应按何种顺序恢复\n\
  4.  在因事故、盗窃、蓄意破坏或自然灾害导致关键故障时，恢复组织网络的全部或部分功能\n\n## 2. 灾难恢复演练的一般频率\n通常情况下，灾难恢复演练应多久进行一次？\n\
  1.  每月\n2.  每年\n3.  每半年\n4.  每两年\n\n## 3. 通常与 DRP 捆绑的其他文档\n通常与 `DRP` 捆绑的其他文档有哪些？（选择所有适用项。）\n\
  1.  灾难恢复团队所有人员的联系信息\n2.  `BCP` 和 `IRP` 文档的副本\n3.  关键软件和硬件驱动程序的副本\n4.  `EMS` 联系信息\n\
  5.  高管团队联系信息\n\n## 4. 提供单一磁盘视图的虚拟化存储系统\n哪种虚拟化存储系统提供显示为单个磁盘的数据存储结构？\n1.  `RAID 1`\n\
  2.  `NAS`\n3.  `SAN`\n4.  `VLAN`\n\n## 5. 备份介质和技术的测试频率\n备份介质和技术应多久测试一次？\n1.  每月\n\
  2.  每年\n3.  每半年\n4.  每两年\n\n## 6. NERC CIP-009-6 标准下的全量恢复测试频率\n根据 `NERC CIP-009-6`\
  \ 标准，应多久从备份介质/系统执行一次全量恢复测试？\n1.  每周\n2.  每月\n3.  每季度\n4.  每年\n\n## 7. 为网络服务器提供容错能力的\
  \ RAID 版本\n哪些 `RAID` 版本为网络服务器提供容错能力？（选择所有适用项。）\n1.  `RAID 0`\n2.  `RAID 1`\n3. \
  \ `RAID 3`\n4.  `RAID 5`\n5.  `RAID 10`\n\n## 8. Grandfather-Father-Son 备份轮换方案涉及的存储介质副本数量\n\
  `Grandfather-Father-Son` 备份介质轮换方案涉及多少个不同的存储介质副本？\n1.  3\n2.  4\n3.  6\n4.  8\n\n\
  ## 9. 人员到达后几分钟内即可运行的备用站点类型\n哪种类型的备用站点通常能在人员到达后几分钟内投入运行？\n1.  冷站点\n2.  镜像站点\n3. \
  \ `RAID` 站点\n4.  热站点\n\n## 10. BCP 中考虑的不同备用站点设施选项的主要目的\n`BCP` 中考虑的不同备用站点设施选项各自的主要目的是什么？\n\
  1.  为灾难发生时的备份和恢复操作提供数据存储\n2.  为灾难发生时组织提供离线服务\n3.  为灾难发生时提供替代通信方法\n4.  为灾难中瘫痪的设施和运营提供功能完全的替代方案\n\
  5.  为灾难发生时安全数据的恢复和组织持续功能运作提供保障\n\n# 附录 A\n\n## GICSP 目标映射\n\n`Global Industrial\
  \ Cyber Security Professional (GICSP)` 考试是一项厂商中立的工业控制系统安全认证，旨在弥合 IT 网络安全与工业控制网络环境之间的差距。考试目标旨在评估候选人，确保其具备在运营技术/工业控制系统（`OT/ICS`）、工程、网络安全工作角色中成功履职所需的最低知识水平。该认证满足美国国防部（`DoD`）`8570.0.1`\
  \ 信息保障劳动力改进计划的要求。它还被批准用于 `DoD` 的 `CND-A`、`CND-IS` 和 `IAT Level II` 劳动力类别。\n\n考试由\
  \ `SANS` 研究所的认证机构 `Global Information Assurance Certification (GIAC)` 管理和交付，该组织专注于信息和网络安全培训。\n\
  \n`GICSP` 是一项包含 115 道题目的单一考试。完成考试的时间限制为三小时，及格最低分数为 71%。考试由受监考的 `Pearson VUE` 考试中心提供，必须提前预约。可使用以下网址的说明进行预约：\n\
  \n`www.giac.org/information/schedule_proctored_exam.pdf`\n\n该认证有效期为四年，必须在到期前更新以保持有效。`GICSP`\
  \ 考试涵盖的主题列于下一节。\n\n`ICS410: ICS/SCADA Security Essentials` 课程由 `SANS` 提供，支持 `GICSP`\
  \ 考试，为工业网络安全专业人员提供一套基础的标准化技能和知识。该课程旨在确保参与支持和保护工业控制系统的员工接受培训，以在当前和新兴网络威胁面前保持运营环境的安全、可靠和弹性。\n\
  \n## ICS410.1 ICS：全球工业网络安全专业人员（GICSP）目标\n\n### 概述\n\n*   **ICS 概述**\n    *   流程与角色\n\
  \    *   行业\n    *   向同行学习\n*   **Purdue 第 0 级和第 1 级**\n    *   控制器与现场设备\n    *\
  \   编程控制器\n    *   编程 `PLC`\n*   **Purdue 第 2 级和第 3 级**\n    *   `HMI`、历史服务器、报警服务器\n\
  \    *   专用应用和主服务器\n    *   控制室和工厂\n    *   `SCADA`\n    *   编程 `HMI`\n*   **IT\
  \ 与 ICS 的差异**\n    *   `ICS` 生命周期挑战\n*   **物理与网络安全**\n\n## ICS410.2 架构与现场设备\n\n\
