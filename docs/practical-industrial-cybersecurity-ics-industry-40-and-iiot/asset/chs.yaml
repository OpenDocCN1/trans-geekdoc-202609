  \ 事件响应\n\n### 六步流程\n\n# 附录 B\n\n## 词汇表\n\n**`800-82-r2`，“工业控制系统 (ICS) 安全指南”**\n\n\
  ：在工业控制系统中实施网络安全的国际指南。\n\n**`800-61-r2`，“计算机安全事件处理指南”**\n\n：一份 NIST 特别出版物，旨在指导组织使用四阶段生命周期方法进行事件响应流程。\n\
  \n**`800-115`，“信息安全测试和评估技术指南”**\n\n：一份 NIST 特别出版物，旨在协助组织规划和实施渗透测试、分析发现并制定缓解策略。\n\
  \n**`800-137`，“联邦信息系统和组织的信息安全持续监控 (ISCM)”**\n\n：一份 NIST 特别出版物，旨在指导组织开展持续安全监控操作。\n\
  \n**`800-161`，“联邦信息系统和组织的供应链风险管理实践”**\n\n：一份 NIST 特别出版物，旨在指导组织识别、评估和缓解其 IT/OT 供应链风险。\n\
  \n# A\n\n**`AAA protocol`**\n\n：认证、授权和计费，使用不同的链路层协议（如 `PPP`），并使用 `PAP` 或 `CHAP`\
  \ 进行认证。\n\n**`acceptable use policy (AUP)`**\n\n：一份书面策略，定义员工在使用其组织的计算机和网络设备时的角色和限制。\n\
  \n**`access control`**\n\n：确保资源仅授予有权访问的用户的安全预防措施。\n\n**`access control list`**\n\
  \n：通过白名单或黑名单控制对网络段访问的列表。\n\n**`Active Directory`**\n\n：微软提供的一种目录服务，负责处理域管理，包括认证、授权、证书管理等。\n\
  \n**`active RFID tags`**\n\n：自供电标签，提供更长的范围，但成本高得多。有源射频识别标签通过电磁场传输识别信息。\n\n**`actuator`**\n\
  \n：负责控制机械系统的设备，如电动机启动器或气动/电磁阀。\n\n**`Adaptive Frequency Hopping Spread Spectrum\
  \ (AFHSS)`**\n\n：一种安全的射频传输方法，根据仅发射端和接收端已知的模式，在大带宽上快速改变其载波频率。蓝牙规范在免许可的 2.4GHz 频段实现此传输方法，通过在预先划分的子频率间跳频，以提供安全性并避开拥挤的频率范围。\n\
  \n**`Address Resolution Protocol (ARP) spoofing attack`**\n\n：一种攻击，攻击者发送伪造的 ARP\
  \ 消息，将其 MAC 地址与另一用户的 IP 地址关联。一旦建立关联，发往该地址的消息将被转移至攻击者。攻击者随后可利用从拦截消息中获得的信息发起其他类型的攻击，如\
  \ `DoS` 或中间人攻击。\n\n**`Advanced Encryption Standard (AES)`**\n\n：一种使用对称密钥的分组加密算法。由\
  \ NIST 于 2001 年发布，已被美国政府采用并取代 `DES`。\n\n**`Advanced Metering Infrastructure (AMI)`**\n\
  \n：新型数字电力监测仪表的配套基础设施，在公用事业中心办公室与客户端智能能源设备的 `HAN` 之间提供通信路径。\n\n**`advanced persistent\
  \ threats`**\n\n：在持续一段时间内针对非常特定且非常安全的系统的威胁。\n\n**`adware`**\n\n：不需要的、未经请求的广告，通常显示在\
  \ Web 浏览器中。\n\n**`algorithm`**\n\n：就计算机安全而言，算法是应用于数据以改变其内容（加密算法）的算术代码，称为 `cipher`，使未经授权的人员无法读取。数字处理中常用的加密算法包括\
  \ `Triple DES`、`AES`、`RSA`、`Blowfish` 和 `Twofish`。\n\n**`annunciator`**\n\n：一种报警系统设备，通过声音、灯光或其他指示来指示系统的运行状态。\n\
  \n**`anomaly analysis`**\n\n：一种分析系统，将统计分析技术应用于数据流，以确定其在任何给定时间是“正常”还是“异常”。\n\n**`anonymous\
  \ proxy`**\n\n：一种代理服务器，通过隐藏客户端的原始 IP 地址来提供客户端匿名性。\n\n**`antispyware`**\n\n：通过检测并移除间谍软件和/或首先阻止它们来防御间谍软件的程序。\n\
  \n**`antivirus`**\n\n：通过检测并移除计算机病毒和/或首先阻止它们来防御计算机病毒的程序。\n\n**`application-level\
  \ encryption`**\n\n：在应用程序内应用加密以保护数据（静态、传输中、使用中）的方法。通常应用加密的其他级别包括文件夹、文件和磁盘级别。\n\n\
  **`application service provider (ASP)`**\n\n：现代云计算的鼻祖。一种通过网络向付费客户提供基于应用程序服务的企业。\n\
  \n**`application servers`**\n\n：配置为在组织业务活动中提供特定角色、供组织内部用户使用的服务器。\n\n**`application\
  \ zone`**\n\n：由内联网环境中应用程序的使用定义的委派区域。该区域通过防火墙、路由器和交换机的使用来创建。\n\n**`asymmetric keys`**\n\
  \n：加密算法中使用的双密钥系统，其中一个密钥用于加密，另一个密钥用于解密。这些密钥类型也称为公钥和私钥。\n\n**`asymmetrical (out-of-band)\
  \ virtualization`**\n\n：虚拟化设备安装在网络与存储系统之间的实际数据路径之外。\n\n**`attack surface`**\n\n\
  ：受攻击的不同机会的总和。\n\n**`attenuation`**\n\n：信息跨越传输介质（如光纤电缆）移动时发生的信号损耗度量。\n\n**`audit\
  \ entries`**\n\n：发生审核事件时添加到安全日志中的项目。\n\n**`audit policy`**\n\n：定义将被监控并添加到系统安全日志中的事件类型的策略。用于审查和治理组织的内部准则和标准。\n\
  \n**`audit trail`**\n\n：用户计算机使用情况的记录。\n\n**`auditing`**\n\n：一种会计形式，是一种预先计划的监控方法，用于评估或确定特定领域内是否存在问题。\n\
  \n**`authentication`**\n\n：确定某人是其所声称身份的过程。\n\n**`authentication, authorization,\
  \ and accounting (AAA)`**\n\n：网络管理员用于保障信息安全的方法。\n\n**`Authentication Header (AH)`**\n\
  \n：`IPSec` 用于防止传输中数据包被篡改的协议。这提供了完整性和认证。\n\n**`authentication server (AS)`**\n\n\
  ：其功能是为网络用户提供认证的服务器。\n\n**`authentication system`**\n\n：用于提供认证的网络系统。\n\n**`authoritative`**\n\
  \n\n\n\n\n## 术语表\n\n# A\n\n**authoritative name server**\n\n: 提供对 DNS 查询的权威回答，而非来自缓存或通过向另一台名称服务器请求该信息的服务器。\n\
  \n**authorization**\n\n: 用户有权访问的资源以及他们可以执行的操作。\n\n**automated access control**\n\
  \n: 一种设计特性，要求对试图从远程位置访问安全区域或计算机系统的用户身份进行认证。\n\n**automated provisioning**\n\n: 一种类似于基于规则的访问控制的方法，其中规则是基本元素。规则定义了可以执行的操作。\n\
  \n# B\n\n**backup media**\n\n: 存储数据备份的介质，例如磁带或 DVD-R。\n\n**backup policy**\n\n:\
  \ 定义备份什么、何时备份以及将备份存储在何处的策略。还包括谁拥有备份的授权以及如何制作备份。\n\n**barriers**\n\n: 阻碍入侵者从外围推进到内部区域的障碍物。也称为防撞柱。\n\
  \n**bastion host**\n\n: 设计用于位于 DMZ 中的特定计算机，可以是防火墙、路由器、服务器或一组不受另一防火墙保护但可直接访问互联网的计算机。\n\
  \n**beacon frames**\n\n: `802.11` 无线局域网中的管理帧，让附近的客户端知道它们正在广播什么网络。\n\n**beacon interval**\n\
  \n: 广播信标帧之间指定的时间间隔。\n\n**biometrics**\n\n: 使用人体物理特征来验证个人身份的访问控制机制。利用一个人的独特身体特征（指纹、声纹和/或视网膜扫描）来提供身份识别和认证。\n\
  \n**BitLocker**\n\n: 某些 Windows 操作系统上的原生实用程序，提供全磁盘级加密。\n\n**black-hat hacker**\n\
  \n: 拥有广泛网络安全技能并将其用于绕过或突破网络安全结构以达到恶意或犯罪目的的个人。\n\n**blacklisting**\n\n: 一种仅拒绝符合给定标准（基于用户、软件、系统）的用户访问的方法。\n\
  \n**block cipher**\n\n: 一种将算法应用于数据块而非单个比特的密码。\n\n**Blowfish**\n\n: 一种使用对称密钥加密的分组加密算法。\n\
  \n**blue team**\n\n: 渗透测试中通常作为目标的团队。\n\n**Bluetooth**\n\n: 用于个人区域网络（PAN）的无线网络规范，将包括手机、数码相机、PC、笔记本电脑和打印机在内的个人设备组网在一起。\n\
  \n**bot herder**\n\n: 控制僵尸网络的未授权人员。\n\n**botnet**\n\n: 由僵尸网络控制者控制的大量僵尸或机器人的集合。\n\
  \n**bots (zombie computers)**\n\n: 由未授权人员控制的 PC、IoT 设备或其他智能可编程设备。\n\n**bring-your-own-device\
  \ (BYOD)**\n\n: 授权员工使用自己的设备而非公司提供的设备进行业务相关活动。\n\n**broadcast storm**\n\n: 每个网络设备重新广播广播流量，最终导致流量传递失败。这会迅速使交换机和路由器过载并压垮网络。\n\
  \n**broadcast traffic**\n\n: 向网络上所有可能的目标发送消息。\n\n**Browser Exploitation Framework\
  \ (BeEF)**\n\n: 一个著名的开源渗透测试工具，专注于通过 Web 浏览器进行的 Web 攻击。\n\n**brute-force attack**\n\
  \n: 攻击者使用应用程序基于已知列表或预测性数学方案系统地猜测密钥或密码。这可能涉及数百或数千次尝试。\n\n**buffer overflow**\n\n\
  : 程序越过缓冲区边界的异常，导致行为异常、内存访问错误和/或系统崩溃。系统实际上被禁用，用户无法使用。\n\n**buffer overflow attack**\n\
  \n: 旨在导致计算系统出现缓冲区溢出状况的攻击。\n\n**Building Automation and Control Network (BACnet)**\n\
  \n: 由美国采暖、制冷与空调工程师学会开发的协议，用于将楼宇自动化设备联网在一起。\n\n**business continuity plan**\n\n:\
  \ 描述组织在发生破坏性事件时的准备工作、增长计划和未来规划的文档。\n\n**business-to-business (B2B)**\n\n: 组织用于与其他受信任组织进行安全交易的网络渠道。\n\
  \n**bypass mode**\n\n: 许多报警系统中可用的一种模式，旨在让人员通过报警区域而不触发报警。在不影响系统其余部分的情况下关闭或禁用传感器、设备或整个区域。\n\
  \n## C\n\n**C2 channel**\n\n: C2 通道（命令与控制）使攻击者能够直接与受损主机交互，这会使威胁变得非常危险，因为攻击者可以响应缓解威胁的尝试。\n\
  \n**cache poisoning**\n\n: 攻击者建立一个流氓 DNS 服务器，然后利用该服务器向主 DNS 服务器反馈虚假信息，从而污染主 DNS\
  \ 服务器的缓存资源。\n\n**caching servers**\n\n: 代理服务器使用缓存的网页，将已访问的网页从其缓存中提供给请求客户端，而无需访问互联网。\n\
  \n**caching web proxies**\n\n: 缓存（存储）Web 资源以便更快访问的本地服务器。\n\n**certificate chain**\n\
  \n: 证书列表，从根证书开始，随后是每个后续证书，其中一个证书的颁发者或签名者是下一个证书的主体。\n\n**Challenge-Handshake Authentication\
  \ Protocol (CHAP)**\n\n: 使用三次握手（SYN、SYN-ACK、ACK）识别远程客户端的认证方法。`CHAP` 用于认证用户或网络——挑战、响应、成功或失败——它可防止重放攻击。\n\
  \n**chokepoints**\n\n: 人员或其他交通必须通过的门户位置，例如大门、门口、走廊或通道/道路，可能导致单点故障。\n\n**chroot**\n\
  \n: 一种基于 Linux 的命令，用于调整当前正在运行的进程的根目录位置。也可用于创建和管理操作系统的多个虚拟化副本。\n\n**cipher**\n\n\
  : 在密码学中，密码是用于加密数据的算法。\n\n**cipher locks**\n\n: 当用户在密码锁键盘上输入正确的编程代码时，通过解锁磁性门锁来操作的锁。\n\
  \n**ciphertext**\n\n: 经过加密密钥编码后的任何数据的文本。\n\n**Cisco Discovery Protocol (CDP)**\n\
  \n: `CDP` 协议使思科设备能够与其他思科设备通信以交换信息。攻击者可以使用此协议收集网络上运行 `CDP` 的交换机和其他网络设备的信息。\n\n**cleartext**\n\
  \n: 未加密的存储或传输数据。\n\n**clickjacking attack**\n\n: 采用欺骗性框架技术诱使用户点击其内容而非预期内容的攻击。\n\n\
  **client-server model**\n\n: 基于集中式、控制型服务器设备的网络模型，该设备为连接到网络的若干客户端设备提供服务。\n\n**cloud-based\
  \ services**\n\n: 具有特殊客户端应用程序软件的托管服务，可将用户的桌面或移动文件和数据存储扩展到互联网服务。\n\n**cloud computing**\n\
  \n\n\n\n\n## 术语表\n\n## C\n\n**云计算**\n\n: 利用远程联网服务器获取资源。这些资源可能包括数据存储、数据处理等，从而减少了本地机器的硬件需求。\n\
  \n**Common Platform Enumeration (CPE)**\n\n: 一种在网络上描述和识别操作系统、硬件设备及应用程序类别的标准化方法。\n\
  \n**Common Vulnerabilities and Exposures (CVE)**\n\n: 一个用于引用公开已知漏洞的系统。由 MITRE Corporation\
  \ 维护，并得到美国国土安全部的支持。\n\n**Common Vulnerability Scoring System (CVSS)**\n\n: 一个对 CVE\
  \ 漏洞进行评分的系统，使相关风险更易于理解。\n\n**Completely Automated Public Turing test to tell Computers\
  \ and Humans Apart (CAPTCHA)**\n\n: 一种表单输入请求，要求输入单词、短语、随机字符和数字组合，或执行一个无法轻易自动化的简单测试。\n\
  \n**复杂度**\n\n: 就密码而言，复杂度是输入长度、宽度和深度的组合。\n\n**Conficker**\n\n: 一种针对拇指驱动器的蠕虫，一旦连接到活动的\
  \ USB 端口就会自动执行。\n\n**机密性、完整性和可用性 (CIA)**\n\n: 经典的信息安全模型。\n\n**连接设备**\n\n: 用于创建网络连接的设备，包括集线器、交换机和路由器。\n\
  \n**应急计划**\n\n: 在灾难/紧急情况发生前进行的规划。\n\n**控制模式**\n\n: 控制器用于校正测量值 PV 与指定设定点 SP 之间差值的技术。\n\
  \n**控制器**\n\n: 控制器是一种硬件设备或软件程序，负责接收输入信息，将该信息与预设条件或参考值进行比较，决定应采取的行动，最后向执行机构发送校正误差信号，以调节被操纵变量。\n\
  \n**Cookie**\n\n: Web 服务器在其页面被访问时发送给 Web 浏览器的小文件。发送 Cookie 的目的是为了允许在 Web 页面或基于 Web\
  \ 的应用程序的不同访问会话之间保留信息。\n\n**破解**\n\n: 利用软件循环猜测密码，直到获得访问权限。\n\n**CRAM-MD5**\n\n: 一种质询-响应认证机制，支持以哈希形式传输密码的电子邮件认证系统。\n\
  \n**凭据收集**\n\n: 收集用户认证信息的任何方法。\n\n**跨站脚本攻击 (XSS)**\n\n: 一种允许将客户端脚本注入 Web 页面的攻击方法，该页面可能被其他毫无戒备的用户使用。\n\
  \n**crypt**\n\n: 早期 UNIX 版本附带的原始加密实用程序。\n\n**密码学**\n\n: 用于将数据转换为秘密代码的程序、过程和技术。\n\
  \n**CryptoLocker**\n\n: 一种勒索软件木马。\n\n**密码术**\n\n: 对密码学的研究。\n\n**电流环**\n\n: 流经某区域两个连接点之间的电流大小。\n\
  \n**Cyber Kill Chain®**\n\n: 由洛克希德·马丁公司开发的一种流程，旨在通过一系列步骤追踪网络安全攻击的阶段，以应对威胁攻击：侦察、武器化、投递、利用、安装、命令与控制、目标行动。\n\
  \n**网络战**\n\n: 一种虚拟冲突，涉及出于政治动机对对手的 IT 或 ICS 网络发动攻击。\n\n**网络犯罪分子**\n\n: 通常由贪婪驱动、寻求经济利益的个人。这类攻击者可能是最著名的黑客类型，因为他们往往引起最多的关注。\n\
  \n**网络安全**\n\n: 在保护对财产、系统和设备端口的物理访问的同时，保护包括电子、光学和信息访问在内的系统数据和控制等无形资产。\n\n**网络安全策略**\n\
  \n: 解释保护组织网络数据和计算机系统所需总体要求的公司策略。\n\n**网络恐怖分子**\n\n: 通常不以金钱为动机，而是为了推进政治议程或意识形态。目标是给公众造成伤害和混乱。也称为黑客活动家。\n\
  \n## D\n\n**守护进程**\n\n: 一个拥有执行程序（后台进程）权限的标准默认用户/组，这些程序无需用户指导即可运行。\n\n**数据汇聚器**\n\
  \n: 数据收集设备，用于将多个智能电表分组，并聚合其数据传输以传送给中央办公室的公用事业服务器。这些设备是 AMI 运营中数据和能源管理的核心。\n\n**数据二极管**\n\
  \n: 一种在具有不同安全级别分类的网络或网段之间创建单向连接的设备。\n\n**Data Encryption Standard (DES)**\n\n: 一种用于数据加密的对称密钥算法。\n\
  \n**Data Execution Prevention (DEP)**\n\n: 一种沙箱机制，将给定程序隔离在特定内存区域，以保护系统其余部分免受潜在攻击。\n\
  \n**数据历史服务器**\n\n: 负责记录和检索从 PLC 获取的数据的软件组件。\n\n**动态数据**\n\n: 通过有线或无线网络传输的数据过程。\n\
  \n**使用中的数据**\n\n: 正在被创建、更新、检索或删除的数据。\n\n**死区**\n\n: IPC 设定点上下的不活动带。也称为中性区或死区。\n\n\
  **取消认证洪水攻击**\n\n: 一种网络攻击，攻击者向接入点发送取消认证数据包，进而移除所有先前已认证的连接设备。\n\n**解密**\n\n: 将先前加密的数据转换回其原始形式的过程。使用相关密钥将加密的密文解锁为明文以便理解的过程。\n\
  \n**解密密钥**\n\n: 用于解密秘密代码的密钥。\n\n**专用控制系统**\n\n: 一种独立的过程控制系统类型，采用单个控制器来监控和控制单个过程或一组紧密集成的过程。\n\
  \n**深度包检测 (DPI)**\n\n: 检查 TCP/IP 数据包中的实际数据，搜索病毒、垃圾邮件和其他已定义威胁的迹象，以确定是否应转发该数据包的过程。\n\
  \n**纵深防御**\n\n: 一种包含多种不同重叠安全机制的防御策略，可潜在地最小化攻击者攻破单一机制造成的影响。\n\n**分界点**\n\n: 公共交换线路结束并连接到客户网络起始处的点。\n\
  \n**非军事区 (DMZ)**\n\n: DMZ 是一个独立的边界网络，将安全的内部网与外部世界隔离开来，同时允许公众访问面向外部的专用资源。\n\n**拒绝服务\
  \ (DoS)**\n\n: 旨在过度使用主机、服务器或网络资源，使其功能上停止提供服务的攻击。\n\n**微分控制**\n\n: 一种将变化率控制因子应用于差值测量百分比变化的控制方案。\n\
  \n**Dynamic Host Configuration Protocol (DHCP)**\n\n: 一种自动寻址协议，使用一系列 IP 地址，可动态租借给请求的外部设备，租期为预配置的时间长度。\n\
  \n**DHCP 服务器**\n\n: 使用网络协议分发网络参数（如 IP 地址）的服务器。参见 Dynamic Host Configuration Protocol。\n\
  \n**DHCP Snooping**\n\n: 内置于操作系统中的一种安全技术，用于过滤和阻止被视为不可接受的入站（入站）DHCP 服务器消息。\n\n\n\n\
  \n\n## D\n\n**dictionary attack**\n\n: 使用字典中的每个单词作为给定用户名的密码，进行系统性的暴力破解攻击。\n\n**digital\
  \ certificates**\n\n: 数字验证，用于确认加密消息的发送者就是其声称的身份。\n\n**digital video recorders (DVRs)**\n\
  \n: 监控摄像头的首选录制系统类型（而非 VCR）。DVR 技术允许将 CCTV 图像传输到磁盘，减轻了劣质视频存储介质带来的负面影响。\n\n**direct-attached\
  \ storage**\n\n: 一种通过 `USB` 或 `eSATA` 连接将额外的磁盘驱动存储设备直接连接到 DVR 的技术。\n\n**directory\
  \ harvest attacks (DHAs)**\n\n: 垃圾邮件发送者猜测某域名下的电子邮件地址，然后连接到该域名的邮件服务器的过程。未被拒绝的地址被视为有效地址。\n\
  \n**directory traversal**\n\n: 就攻击而言，目录遍历利用软件或 Web 应用程序访问本不应访问的文件。这是通过遍历到更高级别的文件夹或目录来完成的。\n\
  \n**disaster recovery plan (DRP)**\n\n: 计划本身是为成功的灾难恢复做准备的第一要素。它应包含构成系统中每个网段的所有组件的完整清单，以及构成每台服务器和工作站的所有组件。这包括所有需要恢复的相关软件。\n\
  \n**discretionary access control (DAC)**\n\n: 用户可自行决定谁有权访问其对象以及访问程度的配置。\n\n**discretionary\
  \ access control list (DACL)**\n\n: 对象或用户对网络中特定资源拥有的权限列表。\n\n**disk-level encryption**\n\
  \n: 使用技术加密整个磁盘结构的过程。该技术可保护磁盘上的所有内容免遭未经授权的访问，包括操作系统文件和结构（无论是静止状态还是传输状态）。\n\n**distorting\
  \ proxy**\n\n: 隐藏或修改您的 IP 地址及相关信息的代理服务器。\n\n**distributed control system (DCS)**\n\
  \n: 一种智能控制系统，它使用分布在整个过程中的多个自主控制器来处理许多控制回路，无需监控控制器的协调。不过，DCS 可与远程监控和监督系统协同运行。当流程过于复杂，单个控制器无法处理，或其组件在地理上分离时，就有必要将控制功能分配到多个控制器上以形成\
  \ DCS。\n\n**distributed denial-of-service (DDoS) attacks**\n\n: 同时使用多个远程系统对目标资源发起大规模\
  \ DoS 攻击的过程。\n\n**Distributed Network Protocol (DNP3)**\n\n: 一套工业通信协议，旨在为电网系统中的中央\
  \ SCADA 主站与不同类型的远程设备（控制器，如 IED、PLC 和 RTU）之间提供联网功能。\n\n**Distributed Reflection and\
  \ Amplification Denial of Service (DRDoS)**\n\n: 一种网络攻击，攻击者利用相对较小的僵尸网络对反射服务器发起分布式攻击，反射服务器重定向接收到的查询，使其看起来像是反射服务器本身是实际攻击源。\n\
  \n**diversion**\n\n: 旨在分散个人监视注意力的战术。通常制造干扰是为了让攻击者在不被发现的情况下查看敏感信息，或在不被盘问的情况下进入安全区域。\n\
  \n**domain**\n\n: 一种计算机环境，网络中的所有成员共享一个通用的目录数据库，并被组织成不同的层级。域由唯一名称标识，并作为具有通用规则和程序的单一单元进行管理。\n\
  \n**domain controller**\n\n: 控制域的对象、规则和程序的中心化服务器。\n\n**Domain Name System (DNS)\
  \ servers**\n\n: 包含 DNS 数据库（`*.dns` 文件）的服务器，用于将计算机名解析为 IP 地址。这些服务器还包含完全合格域名（`www.marcraft.com`）与其所代表的\
  \ IP 地址之间的映射关系。\n\n**double encapsulation VLAN hopping attack**\n\n: 一种网络攻击，导致在原始帧上添加两个标头（双标记）。其中一个标记代表目标的\
  \ VLAN ID，另一个代表攻击者交换机的 VLAN ID。当数据包到达攻击者的交换机时，第一个标记被剥离，但第二个标记随数据包保留。随后数据包被转发到目标交换机，后者读取标记并将数据包转发给目标主机。\n\
  \n**dual-firewall DMZ**\n\n: 一种网络配置，防火墙位于 DMZ 的两侧，用于过滤内部网与 DMZ 之间以及 DMZ 与互联网之间的流量。这些防火墙用于将公共流量路由到\
  \ DMZ，将内部网络流量路由到内部网。\n\n**due care policy**\n\n: 要求各级管理层采取措施，确保在整个组织中提供特定安全防护的政策。此类行动可降低设备损坏或人员及访客受伤的概率。\n\
  \n**dumpster diving**\n\n: 在实体的垃圾中搜寻有用信息碎片的过程。信息包括但不限于电话记录、旧日历、组织架构图和笔记本。此行为属于网络攻击链的侦察阶段。\n\
  \n**dynamic ARP inspection (DAI)**\n\n: 一种旨在阻止 MITM 攻击的配置功能。DAI 使用 DHCP Snooping\
  \ 数据库来检查和验证 ARP 请求，以防止 ARP 欺骗攻击。\n\n**Dynamic Trunking Protocol (DTP) request**\n\
  \n: 攻击者向网络交换机发送请求，将攻击者的端口配置为中继连接。\n\n**dynamic variable**\n\n: 可能因外部影响或内部影响而自发变化的物理参数。\n\
  \n### E\n\n**eavesdropping**\n\n: 未经当事人同意，秘密窃听私人对话的行为，通常是为了获取适用信息。\n\n**eCryptfs**\n\
  \n: 主流 Linux 操作系统内置的软件包，提供文件系统级加密服务。此级别的加密允许将加密服务应用于单个文件或目录，而无需承担大量的磁盘管理开销。\n\n\
  **egress**\n\n: 离开某地的动作，无论是物理上还是逻辑上。\n\n**Encapsulating Security Payloads (ESP)**\n\
  \n: ESP 协议在 IPSec 协议套件中提供完整性、机密性和认证以及加密。ESP 在 ESP 标头中加密并封装整个 TCP/UDP 数据报，该标头不包含任何端口信息。\n\
  \n**Encrypting File System (EFS)**\n\n: Microsoft Windows 的文件和文件夹级加密服务。\n\n**encryption**\n\
  \n: 加密数据涉及获取数据（明文）并使用密钥代码（密码）对其进行处理，该代码定义了原始数据版本是如何被操作的（密文）。\n\n**encryption key**\n\
  \n: 用于将明文转换为密文（反之亦然）的密钥或算法。\n\n**entropy**\n\n: 随机性的度量，或缺乏可预测性和秩序，导致一定程度的不确定性。\n\
  \n**entry delay**\n\n: 安全区域可配置的延迟，给进入场所的人员留出时间，在警报激活前访问内部安全面板以解除警报。\n\n**enumerate**\n\
  \n: 建立网络拓扑图，或确定可发现哪些设备和主机。\n\n**error signals**\n\n\n\n\n\n: 发送给最终执行元件的校正信号，用于调节被操纵变量。\n\
  \n**道德黑客**\n\n: 任何用于测试或评估系统及其资源的黑客技术，前提是获得数据和网络所有者的同意，目的是评估任何弱点。由于不存在公认的道德标准，道德黑客实际上归结为合法黑客行为，即被渗透测试资产的所有者已给予测试人员合法的（合同约定的）授权以进行规定的测试。\n\
  \n**道德规范**\n\n: 基于道德原则，在特定情境下判断何种行为是正确或错误的。\n\n**Ettercap**\n\n: 一款免费开源的软件工具，用于执行多种网络和安全分析。\n\
  \n**EV 证书**\n\n: 扩展验证（EV）证书要求由证书颁发机构验证个人身份。这些证书通常用于使用 SSL/TLS 的网站。\n\n**排除**\n\n\
  : 安全专业人员用于禁止、阻止或移除对被排除资产访问的方法、设备或系统。\n\n**eXecute Disable (XD) 位**\n\n: 内置于微处理器硬件中的一项功能，用于保护包含特定指令代码块（如内核）的特定内存区域。\n\
  \n**exFAT**\n\n: 微软针对闪存设备推出的扩展文件分配表文件系统。\n\n**退出延迟**\n\n: 安全系统激活时的时间延迟，给予人员离开场所的时间，以免触发警报。\n\
  \n**漏洞利用代码/工具**\n\n: 旨 in 利用计算机系统中特定漏洞或缺陷的软件程序或工具。\n\n**出口级加密**\n\n: 一种加密方法，其强度被设定为“足够好”但仍允许\
  \ NSA 解密美国境外的通信。NSA 在 20 世纪 90 年代末取消了这一出口限制，但这些密码套件仍保留在客户端和服务端库中。\n\n**ext#**\n\n\
  : ext# 系列扩展文件系统是为 Linux 内核设计的主要文件管理系统。ext2 也广泛用于 SD 卡和其他基于闪存的存储设备。\n\n**外联网**\n\n\
  : 一种授权外部用户（如企业合作伙伴）有限访问的内部网结构。换句话说，一种部分私有、部分公开的网络结构。\n\n## F\n\n**F2FS**\n\n: 三星的闪存友好文件系统（版本\
  \ 2）是一款面向闪存存储设备的开源 Linux 文件系统。\n\n**故障安全/失效安全**\n\n: 对特定类型的故障以一种将对人员或设备造成的伤害降至最低的方式进行响应的方法。也称为故障安全/失效安全。\n\
  \n**故障安全/失效安全**\n\n: 对特定类型的故障以一种将对人员或设备造成的伤害降至最低的方式进行响应的方法。也称为故障安全/失效安全。\n\n**故障软化/失效软化**\n\
  \n: 当发生硬件或软件故障时，将终止任何非必要处理的模式。\n\n**失效模式与影响分析 (FMEA)**\n\n: 一种定性分析工具，用于评估流程以识别其可能失效的位置和方式（失效模式），并评估不同失效的相对影响。该评估可用于识别最可能失效的流程组件，从而对整个系统进行创新改进。\n\
  \n**假阴性**\n\n: 导致错误拒绝合法人员的报告，从而将本应有权进入的人员拒之门外。在日志记录或取证分析中，假阴性结果是指当特定条件或属性实际存在时，却错误地指示其缺失。\n\
  \n**假阳性**\n\n: 错误地认证人员身份的报告，可能导致向本不应拥有访问权限的人员提供设备或数据访问权限。在日志记录或取证分析中，假阳性结果是指当特定条件或属性实际不存在时，却错误地指示其存在。在两类认证失败中，这是最严重的，因为它可能授予恶意人员访问权限。\n\
  \n**故障树分析 (FTA)**\n\n: 一种分析系统安全性和可靠性的工程工具，用于确定流程如何失效，以及如何最好地降低与这些流程相关的风险。\n\n**反馈**\n\
  \n: 从流程输出回馈到控制器的路径，控制器随后对流程输入施加适当的校正动作。\n\n**现场总线网络**\n\n: 这是对 PLC（可编程逻辑控制器）的流程输入和输出线路的统称。\n\
  \n**现场设备**\n\n: 设计用于部署在受控流程附近的工业控制器。\n\n**视野**\n\n: 给定监控摄像头能够看到的范围。也称为视场。\n\n**文件和文件夹级加密**\n\
  \n: 应用于单个文件和文件夹的加密。文件和文件夹级加密工具允许用户使用密钥加密存储在驱动器上的文件，只有指定用户（或授权的恢复代理）才能解密。这可以防止没有密码或解密工具的人窃取数据。该技术用于保护静态数据（存储中的数据）。\n\
  \n**FileVault**\n\n: Apple OS X 操作系统自带的基于磁盘级别的数据加密服务。\n\n**火警分队/中间人劫持攻击**\n\n: 中间人攻击通过拦截或嗅探并修改用户之间的通信来劫持会话。\n\
  \n**防火墙**\n\n: 通常由硬件和软件组合而成的设备，用于保护私有网络免受来自不受信任网络（如互联网）的未授权访问。\n\n**防火墙规则**\n\n\
  : 防火墙用于确定将过滤哪些通信的规则。\n\n**固件**\n\n: 固件是已编程到只读存储器中的永久性软件。\n\n**鱼眼镜头**\n\n: 一种超广角镜头，牺牲直线透视以换取更大的可视区域。鱼眼镜头拍摄的图像边缘通常会畸变。\n\
  \n**定焦镜头**\n\n: 焦距固定、无法像普通变焦镜头那样调节的镜头。\n\n**扁平网络**\n\n: 一种网络类型，它是一个网络段，所有设备无需连接设备（路由器和交换机）即可相互通信。\n\
  \n**Fraggle 攻击**\n\n: 一种拒绝服务攻击，类似于 Smurf 攻击，攻击者向网络中的广播地址发送伪造的 UDP 数据包。\n\n## G\n\
  \n**增益**\n\n: 比例控制系统中差值百分比的乘数函数。\n\n**网关设备**\n\n: 网关设备通常是路由器，但也可能是交换机、调制解调器、接入点，甚至是语音互联网协议\
  \ (VoIP) 适配器。\n\n**基于 GEOM 的磁盘加密 (GBDE)**\n\n: 一种块设备层面的磁盘级加密系统。\n\n**玻璃破碎检测**\n\n\
  : 一种检测玻璃破碎的传感器；分为两种类型。振动式安装在玻璃上或附近的墙上。声学或声音鉴别器感应玻璃破碎的声音。\n\n**灰盒测试**\n\n: 白盒和黑盒测试的结合，灰盒渗透测试人员在测试开始前可能会获得关于网络的部分信息。\n\
  \n**灰帽黑客**\n\n: 道德指南针介于利他主义和恶意之间的计算机黑客。他们的操作方式通常未获得适当权限；不过，他们可能会将发现的漏洞提供给受影响的供应商。\n\
  \n**灰色软件**\n\n: 可能尚未被归类为恶意软件，但仍包含不良功能的软件应用程序。\n\n## H\n\n**黑客**\n\n: 利用计算机技能获取数据和资源未授权访问权限的个人。\n\
  \n**加固**\n\n\n\n\n\n## 术语表\n\n### 通用术语\n\n**硬化**  \n: 使任何设备（硬件和软件）更安全的过程。通常涉及许多步骤和程序，同时考虑可接受的易用性。\n\
  \n**硬件防火墙设备**  \n: 专门且仅设计用于作为防火墙运行的设备。\n\n**硬件端口**  \n: 各种计算机和网络设备之间的接口。\n\n**硬件令牌**\
  \  \n: 可提供身份验证的物理设备。也称为安全令牌。\n\n**哈希表**  \n: 使用哈希函数将键转换为哈希值，从而将键映射到值的查找表。也称为哈希映射。\n\
  \n**危险与可操作性研究**  \n: 为揭示给定过程中存在的任何危险场景而进行的研究和分析。\n\n**分层文件系统**  \n: Apple 公司开发的专有文件系统，作为运行\
  \ macOS 的 Macintosh 系列计算机的主要文件系统。也用于 Apple 的 iPod 音乐设备系列。\n\n**历史数据库**  \n: 以控制点（称为标签）的形式存储历史数据的数据库管理系统。\n\
  \n**家庭局域网**  \n: 由自动化电气设备控制器组成的专用局域网，通常位于住宅内或住宅附近。\n\n**蜜罐**  \n: 旨在将攻击者从真实网络引开的诱饵服务器、网络设备或网段。通过为攻击者提供对网络上诱饵系统的相对容易访问权限，并隐藏真正关键的系统来实现。\n\
  \n**基于主机的身份验证**  \n: 一种依赖信息（如 MAC 地址和主机名）向网络进行身份验证的形式，而非依赖用户凭据。\n\n**人机界面**  \n\
  : 使人工操作员能够观察不同工艺的运行参数，并接管工艺以更改参数或进行纠正的界面。\n\n**虚拟机监控程序**  \n: 托管其他客户操作系统的虚拟操作平台（类似于虚拟操作系统）。\n\
  \n### I\n\n**Icinga**  \n: 一款开源网络监控应用程序。\n\n**ICMP**  \n: 互联网控制报文协议，常用于测试从设备到网络的连通性。\n\
  \n**身份验证**  \n: 将特定个人与现有身份关联并验证的过程。\n\n**身份盗窃**  \n: 通过欺骗手段获取他人各种身份证明文件的行为，通常为谋取经济利益。\n\
  \n**入侵检测系统/入侵检测与防御系统**  \n: 入侵检测系统或入侵检测与防御系统，旨在主要监控系统（本地计算机或网络环境），记录关键事件和策略违规，并按指示报告。入侵检测与防御系统旨在监控技术环境（计算机或网络），记录关键事件和策略违规，报告并按指示阻止它们。类型包括**基于异常的\
  \ IDS/IDPS**，即使用异常分析来检测和防止未经授权的网络访问的入侵检测系统。分布式 IDS 系统是指连接到网络的本地主机安装了自己的 IDS 模块，此外，网络服务器上还安装了\
  \ IDS 管理模块，协调信息流向各个本地 IDS 模块。**基于主机的 IDS (HBIDS)** 是安装在单个系统上并保护该系统的入侵检测系统。**基于特征的\
  \ IDS/IDPS** 是通过查找内容中的特定模式（称为特征）来工作的系统。如果检测到已知的恶意模式，则采取适当措施保护主机。\n\n**IEC/ISA 62443**\
  \  \n: 一组国际自动化学会标准，定义了在工业自动化和控制系统环境中实施安全的程序。该标准以四个类别的形式存在，涉及通用安全概念度量、系统所有者策略和程序、安全系统设计（使用区域和管道方法实施安全）以及系统安全产品或组件。\n\
  \n**影响评估与分析**  \n: 确定哪些单独威胁对组织构成危险的业务功能，以便实施适当的主动措施。\n\n**带内**  \n: 一种虚拟化方案，将设备置于存储服务器和磁盘阵列之间的直接路径上。此配置消除了在每台服务器上安装设备相关软件的需求，而带外配置则需要。\n\
  \n**事件响应策略**  \n: 旨在为物理灾难、网络灾难或安全攻击情况下的人员职责、时间、地点提供指导的组织策略。\n\n**工业过程控制器**  \n:\
  \ 根据其内部配置或编程，基于输入的当前状态产生输出条件的控制设备。这些设备可以是独立的或联网的，也可以是模拟或数字性质的。示例包括 PLC、RTU、IED、模拟控制器等。\n\
  \n**工业/公用事业风险评估**  \n: 面向工业和公用事业流程的风险评估，包含许多与企业网络中使用的不同的风险分析工具。特别是，面向 OT 环境的风险评估必须包含过程危害分析\
  \ (PHA)。\n\n**基础设施安全**  \n: 应用于为企业、组织或社会运营所需的基本物理和组织结构提供安全保障的物理安全举措。\n\n**入口权限**\
  \  \n: 个人进入财产的权利。\n\n**内部周界**  \n: 通常涉及墙壁、门和窗户等物理屏障的周界——根据外部周界的背景，这些屏障可以是外部的，也可以是内部的。\n\
  \n**输入设备**  \n: 用于将信息引入电子设备的设备。\n\n**输入传感器**  \n: 收集关于待控制系统信息的设备。\n\n**输入/输出控制器**\
  \  \n: 将输入和输出连接到中央控制设备（如微处理器或 CPU）的设备或系统。智能电表中负责在电表的其他系统组件与外部世界之间提供物理连接兼容性的部分。\n\
  \n**内部威胁**  \n: 存在于网络内部的威胁类型，有时表现为员工。\n\n**无形财产安全**  \n: 保护非物理性质财产（如电子数据、专利和商标）的过程。\n\
  \n**积分控制**  \n: 一种控制策略，应用基于微积分的算法于测量变量/设定点差值，以重置控制器的比例动作。\n\n**智能电子设备**  \n: 提供直接接口以监控和控制过程中的不同传感器和执行器，并能直接与监控控制器、本地\
  \ RTU 或其他 IED 通信的设备。\n\n**智能传感器**  \n: 将传感装置与 A/D 电路和嵌入式微处理器封装在一起，以便能直接与控制器、主控制器或其他类型的控制系统通信的传感器。\n\
  \n**控制中心间通信协议**  \n: 全球公用事业用于 SCADA 主服务器之间、公用事业控制中心之间以及跨广域网的公用事业之间进行实时数据通信的协议。\n\
  \n**内部安全**  \n: 基础设施安全的最内层；涉及监控内部周界内的区域。\n\n**互联网号码分配局**  \n: 负责监督 IP 地址分配和 DNS\
  \ 根区域管理的组织。\n\n**互联网工程任务组**\n\n\n\n\n互联网协议的主要标准机构作为一个大型开放的国际社区运作，该社区由网络设计师、运营商、供应商和研究人员组成，他们关注互联网架构的演进和互联网的顺畅运行。\n\
  \n#### 互联网网关\n用于将网络连接到始终在线的宽带互联网连接的路由器。\n\n#### 互联网密钥交换 (IKE)\n用于在 IPSec 中建立安全关联的协议。\n\
  \n#### 物联网\n由具有网络连接功能且能与其他物体通信以收集和交换数据的日常物理对象组成的网络。\n\n#### 互联网协议安全 (IPSec)\n一种常用于\
  \ VPN 的开放标准，实际上采用一套协议对 IP 通信进行加密和认证。\n\n#### 互操作性\n一家公司制造的设备与另一家公司相关设备进行接口连接的能力。\n\
  \n#### 内部网\n单个组织范围内的本地或受限网络。\n\n#### 入侵者\n未经授权访问其无权访问资产的人员。\n\n#### iOS\n苹果的移动操作系统，旨在支持苹果的\
  \ iPhone 和 iPad 产品线。虽然 iOS 与 macOS 共享许多结构，但它与 macOS 应用程序不兼容。\n\n#### IP 地址欺骗\n使用伪造的源\
  \ IP 地址创建 IP 数据包以隐藏身份的过程。\n\n#### IP 阻断\n一种安全形式，阻止特定 IP 或 IP 范围建立连接。\n\n#### IP\
  \ 摄像头\n具有 IP 地址的数字互联网协议 (IP) 设备，可直接连接到网络或互联网，而非直接连接到主机控制器或计算机。\n\n#### IP 头部操纵\n\
  一种用于更改 IP 或 TCP 网络数据包头部部分所含信息的技术，旨在隐藏用户在网络上的身份。\n\n#### IPSec\n用于建立安全通信的协议套件。IPSec\
  \ 采用 AH 和 ESP 对每个 IP 数据包进行认证和加密。\n\n#### IPv4\n以 XXX.YYY.ZZZ.AAA 数字格式存在的互联网地址。每个地址由四个用点\
  \ (.) 分隔的 8 位字段组成。\n\n#### IPv6\n一种较新的 IP 寻址协议，旨在应对可用 IPv4 地址短缺的问题。在 IPv6 下，IP 地址已扩展至\
  \ 128 位，采用十六进制格式，用冒号 (:) 分隔。\n\n#### ISO 15408\n信息技术安全评估通用标准国际标准。\n\n#### ISO 2700xx\n\
  一组 ISO 信息安全管理体系标准，旨在为管理层提供保护资产安全的能力。\n\n### 隔离\n用于隔离或分离网络各部分的物理或逻辑分段。\n\n### J\n\
  \n#### 干扰\n在设备或网络运行的同一频率上故意发射的任意噪声流。\n\n#### JFFS2\nAndroid 默认的日志闪存文件系统（版本 2）。此文件系统版本取代了\
  \ YAFFS2（Yet Another Flash File System），成为早期内核版本中使用的默认 Android 闪存文件系统。\n\n### K\n\
  \n#### Kerberos\n一种网络认证协议，涉及受信任的第三方票据授予服务器 (TGS) 以认证客户端/服务器交互。\n\n#### 内核文件\n操作系统的基本逻辑文件，负责为中央处理器解释从软件程序获得的命令。\n\
  \n#### 无钥匙遥控器\n一种无线钥匙链设备，可用于锁定、解锁和报警设备。\n\n#### 键盘\n通常配备一组数字按钮的输入设备。键盘用于对各种访问控制和管理设备进行编程、控制和操作。\n\
  \n#### 密钥\n就密码学而言，加密密钥是用于加密或解密信息的数据字符串。加密密钥可以基于仅为加密和解密数据的软件所知的秘密字符串，也可以是随机生成的。也可能是已知因素和随机因素的组合。\n\
  \n#### KillerBee\n用于利用 ZigBee 和其他 802.15.4 网络的框架。KillerBee 提供嗅探、数据包解码和操纵以及注入技术。\n\
  \n### L\n\n#### 梯形逻辑图\n一种常用于定义大多数控制功能的开关和继电器触点的电气图类型。\n\n#### 延迟\n输入系统到达预期输出的延迟。\n\
  \n#### 第 7 层攻击\n一种专注于应用层的 DDoS 攻击，通常针对网站的特定区域，旨在耗尽资源。\n\n#### 保护层分析 (LOPA)\nLOPA\
  \ 是一种基于规则的 PHA 工具，用于为不同的工业处理系统创建风险评估和降低策略。该程序采用通过 HAZOP 过程发现的信息和建议的筛选值，然后生成一组用于风险降低的防护措施以供实施。\n\
  \n#### 最小权限\n一种功能，即每个用户仅被授予执行其工作角色所需的访问级别。\n\n#### 轻量级目录访问协议 (LDAP)\n一种用于查询和修改目录服务提供程序中项目的应用协议。LDAP\
  \ 提供单一登录系统，可实现对多种服务的访问。\n\n#### 本地防火墙\n安装、配置并实施在网络主机上的软件防火墙。\n\n#### 锁定状态监控\n一项允许安全主管确认门已锁定的功能。除了监控门或闸的锁定状态外，状态监控系统还可提供门或闸保持锁定的时长和时间段等详细信息。\n\
  \n#### 锁定策略设置\n允许管理员实施密码策略以防止攻击者通过暴力攻击反复尝试访问系统的策略。\n\n#### 逻辑炸弹\n附加在合法程序上的计算机代码，与其他恶意软件非常相似。该代码处于空闲状态，直到特定的逻辑事件发生，之后可能会产生有害影响。\n\
  \n#### Logjam 攻击\n一种针对 Diffie-Hellman 密钥交换的安全漏洞，诱使连接使用 DHE Export 密码套件。\n\n####\
  \ 照度等级\n物体表面接收光通量的度量。一勒克斯约等于一米距离处一支蜡烛照射在一平方米上的光照量。\n\n### M\n\n#### MAC 地址\n媒体访问控制\
  \ (MAC) 地址是连接到网络的每个设备的唯一标识符。这些地址通常由制造商分配给设备并存储在其固件中。\n\n#### MAC 地址过滤\n一种过滤技术，要求将静态\
  \ MAC 地址手动输入到内容可寻址存储器 (CAM) 表中，或要求指定端口上允许的最大设备数量。\n\n#### MAC 地址表\n一种板载内存结构，托管交换机在其中收集\
  \ MAC 地址信息以跟踪连接到它们的设备。当它们与这些设备交互时，交换机会在其 MAC 地址表中记录其 MAC 信息。\n\n#### MAC 重复攻击\n\
  一种网络攻击，攻击者将自己的 MAC 地址更新为目标的 MAC 地址。这会导致交换机将流量转发到两个位置。也称为 MAC 克隆攻击。\n\n#### MAC 泛洪\n\
  一种用于破坏网络交换机安全性的技术。连接到交换机端口的攻击者向交换机接口发送大量伪造的 MAC 地址，导致交换机广播帧。\n\n#### MAC 学习与发现\n\
  \n\n\n\n## 术语表\n\n### M\n\n**MAC 地址学习**\n\n: 连接设备与连接到其物理端口的其他设备交互，并读取消息头以获取发送和接收设备的\
  \ MAC 地址的过程。此信息连同其端口信息一起记录在 CAM 表中。\n\n**MAC spoofing**\n\n: 一种用于更改网络上设备出厂分配的 MAC\
  \ 地址的技术。\n\n**malicious proxy servers**\n\n: 用于多种目的的代理服务器，包括恶意软件投放、广告注入和简单的信息收集。虽然这些代理服务器可能不会传递你的\
  \ IP 地址，但它们会知晓你的 IP 地址，并可能将该信息用于其他目的。\n\n**malware**\n\n: 描述任意数量的侵入式软件程序的术语，旨在具有恶意性质。\n\
  \n**man-in-the-middle (MITM) attacks**\n\n: 一种网络攻击，涉及攻击者创建到两个或多个受害者的链接，以拦截它们之间移动的消息。\n\
  \n**managed switches**\n\n: 具有内置可编程管理功能的设备，使管理员能够为其配置特定的网络环境。\n\n**mandatory access\
  \ control (MAC)**\n\n: 一种访问控制类型，利用操作系统来确定哪些用户或组可以访问文件、文件夹和其他资源。\n\n**manipulated\
  \ variable**\n\n: ICS 正在控制的变量，如温度、压力、液位等。\n\n**man-machine interface (MMI)**\n\n\
  : 界面的交互部分，为人工操作员提供屏幕工具以调整或覆盖控制指令。\n\n**masquerade attack**\n\n: 一种攻击，涉及攻击者假冒另一个系统的身份。\n\
  \n**MDK3**\n\n: 一种渗透测试工具，用于利用常见的 802.11 协议弱点。\n\n**meaningful use**\n\n: 以可在质量和数量上显著衡量的方式使用经认证的\
  \ EHR 技术。\n\n**mesh network**\n\n: 一种去中心化的拓扑结构，其中每个节点都为网络中继数据。\n\n**metadata**\n\
  \n: 描述或定义数据的信息。该术语用于描述所有可能被视为记录次要目的的数据。通常，metadata 被认为是自动生成的、通常嵌入的数据，由信息系统创建以补充甚至验证记录。\n\
  \n**Metasploit**\n\n: 一种渗透测试框架，用于识别和验证网络漏洞，包括模拟利用人为漏洞的攻击。它是最流行的开源渗透测试框架之一。\n\n**microcontroller**\n\
  \n: 位于单个集成电路上的小型计算机。\n\n**Modbus TCP/IP**\n\n: 带有 TCP 接口的 Modbus RTU 协议。\n\n**Modbus**\n\
  \n: 互连智能工业控制设备的事实标准通信协议。Modbus 是一种串行通信协议，专门开发用于为工业控制应用提供网络功能。\n\n**motion detectors**\n\
  \n: 一种检测移动物体的设备，通常集成在基础设施安全系统中。\n\n**multifactor authentication (MFA)**\n\n: 一种访问控制方法，要求以下至少两项：知识、持有和固有特征。\n\
  \n**MultiSpeak**\n\n: 一项规范，是企业应用程序互操作性的关键行业通用标准。\n\n## N\n\n**Nagios**\n\n: 最知名的网络监控工具之一，有助于确保系统、应用程序和进程正常运行。\n\
  \n**nation-state**\n\n: 一个地理区域，包含在一个政府下生活、共享相同历史、语言或传统的一群人。\n\n**National Institute\
  \ of Standards and Technology (NIST)**\n\n: 负责开发网络安全框架、医疗设备安全以及《工业控制系统 (ICS) 安全指南》的联邦技术机构。\n\
  \n**natural access control**\n\n: 利用自然设计元素（如结构和景观）引导人们进出空间的过程。\n\n**need-to-know\
  \ policy**\n\n: 一种限制员工对整个网络系统了解程度的过程。它类似于职责分离策略。\n\n**neighborhood area network\
  \ (NAN)**\n\n: 常用于智能电表网络，NAN 可为一小组 WLAN 提供网络连接。\n\n**Network Address Translation\
  \ (NAT)**\n\n: 将一个网络中使用的 IP 地址转换为另一个网络中已知的 IP 地址。\n\n**network analyzer**\n\n: 渗透测试人员用来监听网络流量的工具，查找以明文模式跨网络发送的密码和用户名，或信用卡等敏感财务信息等项目。也称为\
  \ packet sniffer。\n\n**network-attached storage (NAS)**\n\n: 一种虚拟化存储系统，在网络中提供存储和文件系统结构。\n\
  \n**network connectivity devices**\n\n: 具有连接功能的设备，如 routers、hubs、switches 和 bridges。\n\
  \n**network firewall**\n\n: 一种防火墙，通过授予或拒绝受信网络和非受信网络之间特定流量的访问权限，对整个网络执行安全防护。\n\n\
  **network hardening**\n\n: 保护网络所涉及的所有过程和技术。\n\n**network monitoring tools**\n\n\
  : 可用于确保服务器或其他设备正常启动并运行的任何工具。\n\n**network packet**\n\n: 在网络上路由的数据单元。\n\n**network\
  \ segmentation**\n\n: 将网络分离或拆分为一个或多个子网的过程，使每个子网成为独立的网段。\n\n**network topologies**\n\
  \n: 第 1 层物理（或逻辑）连接策略，分为四种基本配置：star、bus、ring 和 mesh。\n\n**network virtualization**\n\
  \n: 创建基于软件的管理实体的过程，利用硬件和软件网络资源以及网络功能。\n\n**network vulnerability scanner**\n\n:\
  \ 用于扫描网络中不同类型的常见漏洞，如系统错误配置和默认密码使用。\n\n**Nikto**\n\n: 一款开源 Web 服务器扫描器，可识别 Web 服务器上的问题。\n\
  \n**NIST 800-82 r2, “Guide to Industrial Control System (ICS) Security”**\n\n: 一份为工业控制系统实施网络安全提供指南的文档。\n\
  \n**nmap**\n\n: 一款流行的安全扫描工具，用于枚举网络。\n\n**No eXecution (NX) bit**\n\n: CPU 中用于将内存区域分离为不同用途区域的技术。例如，一块内存区域可专门留作存储处理器指令代码，而另一块区域可标记为仅用于数据存储。\n\
  \n**NTFS permissions**\n\n: 新技术文件系统权限，可设置用户可对指定文件或文件夹执行的操作参数。\n\n### O\n\n**OAuth**\n\
  \n: 一种认证协议，允许应用程序代表用户行事，而无需共享密码。\n\n**On/Off control**\n\n: 仅基于测量变量与参考变量之间关系的控制方案。输出条件只能假设两种状态——完全开启或完全关闭。这种控制由\
  \ on/off 设备（如 relays 和 electrical switches）提供。\n\n**open loop control**\n\n: 一种不观察反馈输出以调整其所控制过程的过程。因此，在这些系统中，控制器没有机制通过调整输入电平来将过程变量的值控制在指定水平。\n\
  \n**Open Platform Communications (OPC)**\n\n\n\n\n\n## 术语表\n\n### O\n\n**open systems\
  \ interconnection (OSI) model**\n\n: 用于定义和描述网络环境中通信功能的主要网络模型。\n\n**Open Vulnerability\
  \ and Assessment Language (OVAL)**\n\n: 一种安全社区标准，用于传达配置、漏洞、补丁级别等安全信息。OVAL 本质上是一组\
  \ XML 模式，描述了一种语言，提供评估网络资源安全漏洞所需的详细信息。\n\n**open/close conditions**\n\n: 报警传感器的状态或条件，指示“打开”为关闭状态，“关闭”为触发状态。\n\
  \n**OpenVAS**\n\n: 开放漏洞评估系统，一个由多种服务和工具组成的开源框架，提供漏洞扫描和管理功能。\n\n**outer perimeter**\n\
  \n: 给定区域或边界的第一道防线，可以是物理或逻辑性质的。\n\n**out-of-band**\n\n: 虚拟化设备安装在网络和存储系统之间的实际数据路径之外。一种发生在特定电信频带之外的通信方法。发送多信道消息或信令的另一种方式。\n\
  \n**overlay networks**\n\n: 在另一个物理或底层网络之上构建网络的情况。\n\n**owner**\n\n: 资产的合法拥有者。\n\n\
  **owning group**\n\n: Linux 权限术语，指共同拥有数据访问权限的一组用户。\n\n**owning user**\n\n: Linux\
  \ 权限术语，指拥有数据控制权和访问权的个人。\n\n### P\n\n**packet analyzer**\n\n: 用于分析网络流量的计算机程序。也称为数据包嗅探器。\n\
  \n**packet filtering**\n\n: 基于源/目的地址、逻辑端口或协议，对网络数据包进行通过或阻止的过程。\n\n**packet filtering\
  \ firewall**\n\n: 配置了数据包过滤规则的防火墙，根据源地址、目的地址或端口号等因素允许或拒绝客户端访问。\n\n**packet sniffing\
  \ attacks**\n\n: 一种网络攻击，攻击者使用数据包嗅探器监听网络流量，寻找以明文模式跨网络发送的密码、用户名等项目，或信用卡等敏感财务信息。\n\n\
  **pairing process**\n\n: 将两个蓝牙设备连接在一起的过程。\n\n**panning**\n\n: 使摄像头左右平移、上下倾斜或俯仰的过程。\n\
  \n**passive controls**\n\n: 到位但不根据任何操作进行调整的控制措施。\n\n**passive infrared (PIR) detector**\n\
  \n: 使用传感器外壳中的透镜机制，检测传感器覆盖的水平扇区内红外能量任何变化的探测器。这种探测器对静止物体不敏感，但会对视野内横向发生的快速变化做出反应。\n\
  \n**passive RFID tags**\n\n: 由 RFID 读取器发射的电磁能量供电并允许进行认证的标签。\n\n**passphrase**\n\n\
  : 用于控制访问的一系列文字，很像密码，但通常字符长度更长。\n\n**password**\n\n: 用作认证工具的秘密单词或随机字符串。\n\n**password\
  \ attacks**\n\n: 任何在最初不知道正确密码的情况下，通过密码提示成功认证的密码尝试。\n\n**Password Authentication\
  \ Protocol (PAP)**\n\n: 一种与 PPP 配合使用的认证协议，利用密码进行验证。\n\n**password capturing**\n\n\
  : 一种在密码传输认证时查看并保存（捕获）密码的技术。\n\n**password cracking**\n\n: 为日后使用而尝试从存储的数据或传输中的数据恢复密码的过程。\n\
  \n**password encryption**\n\n: 获取标准密码并对其应用算法，使其对嗅探器、破解者或其他窃听者变得无意义的过程。\n\n**password\
  \ management policy**\n\n: 为管理网络环境中用户密码而制定的策略。\n\n**password manager**\n\n: 存储和组织用户密码的软件应用程序。\n\
  \n**password-authenticated key agreement (PAKE)**\n\n: 一种交互式方法，允许两个或多个实体基于一方对密码的知识建立加密密钥。\n\
  \n**patches**\n\n: 已发布分发的操作系统或应用程序的通用改进。许多补丁和更新纯粹是外观改进和便捷的附加功能，而其他则是针对特定病毒、发现的威胁或弱点而设计的关键安全升级。\n\
  \n**PathPing**\n\n: 许多 Windows 系统中自带的一个实用程序，结合了 `ping` 和 `traceroute` 命令行工具。\n\n\
  **penetration test**\n\n: 以发现安全弱点为目标对网络进行测试的过程。\n\n**permissions**\n\n: 对特定数据和资产的定义特权和授权。\n\
  \n**persistent cookie**\n\n: 将保留在计算机硬盘上直到达到指定过期日期的 Cookie。也称为永久 Cookie。\n\n**personal\
  \ area network (PAN)**\n\n: 一种结合 PDA、手机、数码相机、PC、笔记本电脑和打印机等个人设备的网络类型。\n\n**pharming**\n\
  \n: 一种恶意活动，将不知情的用户重定向到伪造网站，以期获取个人信息。\n\n**phishing**\n\n: 一种社会工程学技术，通过伪装成可信组织来获取敏感信息（通常是登录凭证或信用卡数据）。这些攻击通常涉及引导用户访问看起来合法的虚假网站的电子邮件。\n\
  \n**photoelectric sensor**\n\n: 一种检测可见或不可见光束并对接收光强度变化做出反应的光学控制装置。光电束装置利用此功能，将窄光束瞄准感兴趣区域（如停车场闸口）。当光束被中断时，光电装置会发出警报，或者在车库门安全系统的情况下，停止或反转自动车库门的升降电机。\n\
  \n**physical intrusion detection system**\n\n: 旨在检测并发出入侵信号的任何系统，包括运动传感器、读卡器、摄像头和警报器。\n\
  \n**physical security**\n\n: 关注保护物理边界和财产的任何过程或设备。\n\n**piconet**\n\n: 由最多八个设备组成的小型蓝牙网络。\n\
  \n**PII**\n\n: 个人身份信息 (PII) 是任何能够识别个人身份的信息。PII 示例包括名和姓、家庭住址、社会安全号码、出生日期、指纹以及其他可将一个个体与另一个个体区分开的信息。\n\
  \n**piggybacking**\n\n: 社会工程师要求目标“帮忙开门/刷卡”，从而在无需提供凭证的情况下进入受限区域的行为。\n\n**ping**\n\
  \n: 用于评估能否到达另一个 IP 主机的网络实用程序。`ping` 实用程序将向目标主机发送互联网控制消息协议 (ICMP) 请求数据包并等待响应，测量往返时间和任何数据包丢失。\n\
  \n**ping flood attack**\n\n: 一种简单的 DoS 攻击，攻击者用 ICMP 回显请求（ping）数据包淹没受害者。\n\n**pinhole\
  \ lens**\n\n: 一个非常小的孔，可能由针制成，将光线强制成平行线以形成清晰图像的透镜。\n\n\n\n\n\n### P\n\n**point-of-sale\
  \ (POS) terminals**\n\n: 用于零售交易发生的时间和地点的智能联网终端。\n\n**policies**\n\n: 个人或企业采用的规则和程序。\n\
  \n**port scan**\n\n: 探测或扫描服务器、客户端或主机以查找开放端口的过程。\n\n**port scanner**\n\n: 一种对网络设备进行探测以查找开放端口的软件应用程序。\n\
  \n**port-based VLAN**\n\n: 以太网交换机上被定义为网段的一系列端口。\n\n**PoSeidon Portable Operating\
  \ System Interface (POSIX)**\n\n: 为标准化 UNIX 和类 UNIX 操作系统的变体而开发的一组互操作性标准。符合 POSIX\
  \ 标准的系统（UNIX、Linux 和 Apple macOS 系统）支持某种类型的 ACL，用于管理传统的 UNIX 文件访问权限。\n\n**power\
  \ line carrier (PLC)**\n\n: 利用电力线作为主电力公司、其变电站和智能电表之间传输介质的通信。\n\n**Power over Ethernet\
  \ (PoE)**\n\n: 这是通过 UTP 网线获取电力的过程，而非来自专用电源。这用于智能设备，如 VoIP 电话。\n\n**Presentation\
  \ zone**\n\n: 在分区安全模型中，Presentation zone（呈现区/展示区）是将 Application zone（应用区）与最外层安全层（通常是互联网）分隔开的区域，也是组织用户网段所在的位置。Presentation\
  \ zone 还用于放置公共接口，例如提供公共信息的 Web 服务器，以及组织的传输安全工具和结构。\n\n**Pretty Good Privacy (PGP)**\n\
  \n: 一种广泛使用的 UNIX 加密工具。该工具同时执行私钥和公钥加密/解密，并提供一种非常强大的数据保护方法。\n\n**pretexting**\n\n\
  : 一种社会工程学形式，指伪装成他人以获取私人信息的做法。\n\n**promiscuous mode**\n\n: 一种用于监听介质上传输流量的模式。它是非混杂模式的对立面。\n\
  \n**Privacy Rule**\n\n: 旨在限制个人受保护健康信息可被使用或披露的情形的规则。\n\n**Private Encrypted File\
  \ System (PEFS)**\n\n: 用于 UNIX 的堆叠加密文件系统。\n\n**private key**\n\n: 在密码学中，仅指定接收者知道的加密/解密密钥。\n\
  \n**Private VLAN (PVLAN) attacks**\n\n: 一种网络攻击，涉及攻击者向 PVLAN 发送数据包，这些数据包包含目标计算机的目标\
  \ IP 地址和 PVLAN 路由器的 MAC 地址。交换机看到目标 MAC 地址，并将数据包转发到路由器的交换机端口（一种可以与任何端口通信的混杂端口类型）。路由器随即将数据包导向目标主机。\n\
  \n**privilege escalation**\n\n: 利用漏洞使未经身份验证的用户获得提升的管理访问权限的行为。\n\n**privilege management**\n\
  \n: 通过权限管理策略，为管理员提供关于如何实施组织权限的指导方针。访问控制权限可以基于角色（RBAC）、自主（DAC）或强制（MAC）。\n\n**procedures**\n\
  \n: 执行操作的既定方式，常用于强制执行策略。\n\n**process hazard analysis (PHA)**\n\n: 用于评估特定工业过程中潜在危害。在美国，PHA\
  \ 分析由职业安全与健康管理局（OSHA）强制要求，旨在协助潜在危险过程操作员确定和排序其过程的操作风险。\n\n**process variable (PV)**\n\
  \n: 在过程中受控的动态变量。\n\n**profile-based anomaly detection systems**\n\n: 使用数学算法监控正常数据流量并开发一组规则配置文件，描述该系统正常流量的样子的系统。开发的配置文件反映了对用户过去行为的评估，并配置为在偏离这些行为达到一定水平（或阈值）时发出信号。\n\
  \n**programmable logic controller (PLC)**\n\n: 可编程逻辑控制器（PLC）是专门设计用于执行工业控制功能的智能数字计算设备，例如开启和关闭阀门、开关和继电器以控制过程。\n\
  \n**programmable zones**\n\n: 可编程以包含单个保护点（如运动探测器）的区域，或者可将多个点组合到单个区域中。\n\n**promiscuous\
  \ port**\n\n: 配置为能够与任何其他端口通信的端口，通常在 VLAN 实例中。\n\n**proportional control**\n\n: 一种提供更精细控制方法的控制方案，其中输出本质上是模拟的，因此可以从最小值变化到最大值。控制器提供的输出水平基于\
  \ PV 与设定点之间的比例差异。\n\n**proportional plus integral (PI) controller**\n\n: 一种将比例控制应用于设定点值与测量过程变量值之差的控制方案。每种控制模式都可以调整，以向输出添加恰到好处的各模式水平。\n\
  \n**proportional plus integral plus derivative (PID)**\n\n: 一种处理三个不同参数的控制器，分别代表当前误差、过去误差的累积以及对未来误差的预测。\n\
  \n**protocols**\n\n: 一组管理网络通信如何进行的规则。为了使设备能够在网络上相互通信，它们必须都使用相同的网络协议。\n\n**proxy\
  \ filtering firewalls**\n\n: 配置为过滤掉不需要的数据包的服务器。在此过滤过程中，每个数据包都会被拆解、评估并重组，使这种连接类型比其他防火墙类型慢得多。\n\
  \n**proxy server**\n\n: 一种充当屏障的服务器，因为它允许客户端建立通过代理路由的间接网络连接。\n\n**psychological social\
  \ engineering**\n\n: 攻击者利用心理学和人性弱点设计多种不同攻击，诱使人们相信其希望他们相信的内容，并放弃平时不会透露的重要信息的过程。\n\
  \n**public key**\n\n: 一种可被获取并用于允许任何人加密发送给特定用户消息的加密密钥。\n\n**public key certificates**\n\
  \n: 验证加密消息发送者即其声称身份的数字凭证。\n\n**public key encryption (PKE)**\n\n: 一种采用两个密钥确保加密数据安全的加密技术——公钥和私钥。公钥（人尽皆知）用于加密数据，私钥或密钥（仅指定接收者知晓）用于解密。\n\
  \n**public key infrastructure (PKI)**\n\n: 一种支持公钥和证书分发的基础设施，旨在基于 CA 的信息实现可信连接和安全数据交换。\n\
  \n**public switched telephone network (PSTN)**\n\n: 一种使用物理线缆互连并在发送方和接收方之间传输话级信号的系统。也称为普通老式电话系统（POTS）。\n\
  \n### Q\n\n**quality of service (QoS)**\n\n: 允许根据特殊规则或策略对网络流量进行优先级划分和差别化处理。QoS 的常见用途是确保\
  \ VoIP 电话系统始终拥有足够的带宽用于电话服务，无论网络多么繁忙。\n\n**quid pro quo**\n\n: 一句拉丁语，意为“以物易物”或“交换条件”。\n\
  \n## R\n\n**race condition attack**\n\n\n\n\n\n## 术语表\n\n## R\n\n**race condition**\
  \  \n: 当攻击者利用多用户/多任务环境中连续事件的时序，在事件之间插入恶意代码到系统中时，就存在**竞争条件**。\n\n**radio frequency\
  \ identification (RFID)**  \n: RFID 系统利用自供电的 RFID 标签，可用作信标来追踪位置或验证邻近性。\n\n**rainbow\
  \ tables**  \n: 包含数百万个哈希密码的预生成表，用于通过比对来破解用户账户的密码。\n\n**reconnaissance**  \n: 黑客熟悉目标并开始寻找潜在途径进入目标关键基础设施的第一步，无论是手动还是数字化方式。黑客通常会花费更多时间对目标进行**侦察**和研究，而不是实际利用漏洞。\n\
  \n**red team**  \n: 就渗透测试而言，这是一个独立小组，负责对指定组织的网络发起挑战或进行测试。\n\n**reflection servers**\
  \  \n: 用于 DDoS 攻击，发送伪造的回显请求，并将回显应答指向受害者。\n\n**regress**  \n: 就安全而言，该术语用于描述重新进入财产的合法权利。\n\
  \n**relay**  \n: 一种机电开关设备，用于控制电路的运行。\n\n**remote access control**  \n: 一种设计特性，要求对试图从远程位置访问安全区域或计算机系统的用户身份进行认证。\n\
  \n**remote access monitoring**  \n: 当事件或事故发生时，用于通知监督安全人员的系统。\n\n**remote access\
  \ trojan (RAT)**  \n: 一种恶意软件程序，为系统提供后门，并可从远程位置授予管理控制权。\n\n**Remote Authentication\
  \ Dial In User Service (RADIUS)**  \n: 一种网络协议，提供集中式 AAA 协议（认证、授权和审计）。\n\n**remote\
  \ monitoring**  \n: 从远程位置或控制室对设备进行监控或测量。\n\n**remote notification systems**  \n\
  : 当存在报警条件时，这组系统将协调并通知相关方。\n\n**remote telemetry unit (RTU)**  \n: 部署在流程或一组流程中的选定位置的小型智能控制单元，用于从不同传感器收集数据并发送命令以控制继电器输出。\n\
  \n**repeater**  \n: 一种网络硬件设备，用于扩展网络的范围和覆盖距离。\n\n**replay attack**  \n: 一种网络攻击，攻击者重放或延迟已记录的传输以获取访问权限。\n\
  \n**rerouting attack**  \n: 一种网络攻击，试图将流量从其有效目的地重定向（重新路由）到一个虚假目的地。\n\n**reverse proxy\
  \ server**  \n: 一种处理 Web 资源公共请求，然后将其转发给一个或多个服务器的服务器。\n\n**right**  \n: 由公认的权威来源授予某人或某群体的合法特权或许可。\n\
  \n**risk**  \n: 价值对象遭受损失的可能性。也可表示为与不确定性的故意交互。**风险**也可计算为一种可向组织内部和外部利益相关者传达的量化指标。\n\
  \n**risk assessment**  \n: 一个系统性过程，包括了解风险事件在组织网络不同领域发生的可能性及其造成的影响。\n\n**risk mitigation**\
  \  \n: 采取必要步骤，降低风险敞口的程度和/或其发生的可能性。\n\n**risk tolerance level**  \n: 个人或企业认为可容忍的风险水平。\n\
  \n**role-based access control (RBAC)**  \n: 一种使用工作角色来区分权限和特权的访问控制方法。\n\n**rootkits**\
  \  \n: 一种旨在在不被检测到的情况下获取计算机系统管理控制权的软件类型。Rootkit 可能存在于硬件或软件中，通过攻击 BIOS、引导加载程序、操作系统内核，有时还包括应用程序或库来实现。\n\
  \n**router flood attacks**  \n: 路由器容易受到洪水攻击，此类攻击旨在耗尽其所有或大部分资源，从而使其失去功能。\n\n**routers**\
  \  \n: 网络连接设备，与交换机不同，可跨不同网段转发信息。这使路由器能够通过称为路由的过程将不同网络连接在一起。\n\n**routing**  \n:\
  \ 选择在网络上或网络之间传输数据的最佳路径的过程。\n\n**routing protocol**  \n: 路由器用于确定数据传输的适当路径的一组规则。\n\
  \n**routing table**  \n: 路由器用于存储和更新路由信息的数据库。\n\n**RS-232 asynchronous serial communication\
  \ standard**  \n: 一种用于串行通信传输数据的标准。\n\n**rule**  \n: 在网络中，要移动数据包通过设备，必须在设备上显式创建一条规则，以将所需的协议端口转发（或映射）到局域网中的专用\
  \ IP 地址和端口。\n\n**rule-sets**  \n: 通常基于数据源和目标信息、数据类型或数据内容的规则。它们用于控制何种类型的信息可以在安全区域之间移动。\n\
  \n**rule-based access control (RBAC)**  \n: 一种基于规则的访问控制模型，规则根据账户持有者在组织中的角色分配给账户。规则是角色的基本要素。规则定义角色可以执行的操作。也称为自动化配置。\n\
  \n**rule-based anomaly detection**  \n: 一种检测方法，通过分析审计记录根据过去的使用模式生成规则。系统随后监控流量，寻找与创建的规则不匹配的模式。\n\
  \n### S\n\n**safety instrumented system (SIS)**  \n: 一种工业控制系统，旨在监控关键过程并对其进行控制，以安全为主要目标。\n\
  \n**sanitize**  \n: 使硬盘驱动器上的数据不可恢复，方法是多次覆盖数据和/或物理销毁驱动器，使其无法重组。\n\n**satellite communications**\
  \  \n: 许多公司在其总部和现场站点之间采用极小口径终端 (VSAT) 卫星通信来传输监控数据。这些系统是自包含的，不涉及公共电话系统等第三方技术。\n\n\
  **script**  \n: 一个命令列表，能够在无需用户交互的情况下执行。\n\n**script kiddies**  \n: 使用他人开发的现成脚本或程序攻击系统的个人。\n\
  \n**Secure Remote Password (SRP)**  \n: 一种协议，是 PAKE 的增强形式，旨在规避现有专利。\n\n**Secure\
  \ Shell (SSH)**  \n: 一种用于安全客户端-服务器连接的加密网络协议。旨在替代 Telnet 等不安全的 Shell 协议，SSH 采用公钥加密认证。\n\
  \n**Secure Sockets Layer (SSL)**  \n: 一种用于管理客户端和服务器之间认证和通信的协议，同时使用公钥和私钥。SSL 使用套接字方法在客户端和服务器程序（通常是网站和浏览器）之间交换数据。\n\
  \n**security**  \n: 建立一套对个人、系统、媒介、内容和对象进行排除和包含的科学、技术和艺术。\n\n**security associations\
  \ (SAs)**  \n: 在两个网络设备之间建立共享属性，以支持安全连接。\n\n**security baseline**  \n\n\n\n\n\n##\
  \ 安全控制与协议\n\n### 安全基线\n: 定义保护组织信息系统的机密性、完整性和可用性（CIA）以及这些系统处理、存储和传输的数据所需的最低安全要求的安全控制。\n\
  \n### 安全内容自动化协议 (SCAP)\n: 一种使用各种开放标准来评估漏洞并衡量这些漏洞潜在影响的方法。\n\n### 安全补丁\n: 为纠正观察到的弱点以防止漏洞被利用而发布的更新。\n\
  \n### 安全策略\n: 说明安全应如何在各级实施的文档。企业和组织制定全面的安全策略，定义谁被授权访问不同的资产，以及他们在访问这些资产时被允许做什么。\n\
  \n### 安全拓扑\n: 考虑到安全要求和需求，给定网络上所有硬件设备的定义布局。\n\n### 安全区域\n: 为根据其安全漏洞或关键性为特定网络资产（资源和数据）提供特定安全级别而创建的网络段。其理念是将更有价值或更关键的网络资产放置在提供更多保护的段或安全结构中。\n\
  \n### 隔离\n: 在网络中，物理或逻辑上的分离。常用于隔离个人、数据和其他资产。\n\n### 传感器\n: 这些设备将温度、流体流速或压力等测得的物理量值转换为控制系统可理解的相应信号（压力、电气、差压等）。\n\
  \n### 服务包\n: 主要的操作系统更新和/或许多单独 Windows 更新的集合。\n\n### 会话 Cookie\n: 存储在临时内存中、在 Web\
  \ 浏览器关闭时被擦除的 Cookie。\n\n### 会话重放攻击\n: 一种攻击，涉及攻击者窃取用户的会话 ID，然后获得授权用户在特定网站上能够执行的任何操作的访问权限。\n\
  \n### 设定点 (SP)\n: 设定点可以是固定参考，例如安装在支柱上的简单液位传感器；也可以是可调参考，例如常见的恒温器，用户可以在其中设置要维持的期望温度。\n\
  \n### 七层网络安全模型\n: 来自 SANS 研究所的分层七层网络安全模型，与七层 OSI 模型相关联。\n\n### 偷窥\n: 一种攻击，某人从毫无防备的受害者肩上瞥视，希望观察和/或记录他们输入的某些私人信息。\n\
  \n### 侧信道攻击\n: 对虚拟机的攻击，其中一台虚拟机从运行在同一物理服务器上的另一台虚拟机获取私钥信息。\n\n### 特征分析\n: 将进出站流量与存储的特定代码模式（特征）数据库进行比较的过程，这些模式已被识别为恶意威胁。\n\
  \n### 单因素认证\n: 仅需要持有一种验证形式的认证。这代表可用的最低安全级别。\n\n### 单防火墙 DMZ\n: 仅有一个关联防火墙的网络 DMZ。\n\
  \n### 单次损失期望值 (SLE)\n: 被归类为一次性事件的安全事件。这些事件按一次性基础分配价格。\n\n### 智能卡\n: 通常类似于磁条卡的卡片设备。它们通常包含所有者的信息，如密码、个人识别号\
  \ (PIN)、网络密钥、数字证书和其他可用于认证过程的 PII。\n\n### 智能电表\n: 记录公用事业消耗并能传输信息以进行监控和计费的智能电子设备。\n\
  \n### 智能手机应用\n: 专门在平板电脑和手机等移动设备上运行的应用程序。\n\n### 短信钓鱼\n: 短信钓鱼的简称，是一种诱使用户访问网站通过短信在智能手机或平板电脑上下载恶意软件的攻击。\n\
  \n### Smurf 放大器\n: 被感染的网络计算设备，用于将攻击者的 ping 请求反射向指定目标，从而对目标构建 ICMP 洪水攻击。\n\n### Smurf\
  \ 攻击\n: 一种用 ICMP 回复包淹没受害者的 DDoS 攻击。这种攻击在 ping 洪水攻击的基础上增加了反射属性。这种反射属性是通过在攻击中使用更多被称为\
  \ Smurf 放大器的参与者来创建的。\n\n### Snort\n: 一种开源、跨平台的入侵检测系统，提供实时流量分析、数据包记录和协议分析，以及对蠕虫、端口扫描和漏洞利用尝试的主动检测。\n\
  \n### 社会工程学\n: 一种利用物理或心理操纵来利用人际互动、以期绕过正常安全措施的非技术方法。\n\n### 套接字\n: 双向通信的一个端点。套接字绑定到一个端口号。\n\
  \n### 软目标\n: 因几乎没有内置安全功能且几乎没有添加安全功能的选项而容易受到破坏的设备。如果能被直接或虚拟访问，它们很容易被操纵。\n\n### 社会工程学工具包\
  \ (SET)\n: 渗透测试中使用的 Linux 软件包，可用于对目标执行高级攻击。\n\n### 软件即服务 (SaaS)\n: 基于订阅许可和交付的软件。软件托管在企业外部，通过瘦客户端在网络中访问。\n\
  \n### 软件漏洞利用\n: 旨在利用软件产品、操作系统和应用程序中的漏洞或弱点的网络攻击。\n\n### 软件防火墙\n: 像其他应用程序一样安装在主机计算机上的防火墙。\n\
  \n### 软件定义网络 (SDN)\n: 一种计算机网络方法，分析任意两个节点之间的连接，并可根据定义的策略过滤该连接。\n\n### SolarWinds\n\
  : 一款提供极其强大的商业网络性能监控产品的软件产品。它可以监控正常运行时间、性能、流量和利用率，并提供大量报告、图表和通知选项。\n\n### 生成树攻击\n\
  : 如果数据包仅在该拓扑中的二层交换机之间循环，其生存时间 (TTL) 设置永远不会递减，也永远不会消失——而是继续通过冗余链路循环。这会产生广播风暴，用流量淹没网络。\n\
  \n### 生成树协议 (STP)\n: 一种为多路径网络中的交换机提供无环冗余链路的协议。它通过配置交换机端口，使其根据所连段的类型转发或阻塞流量来实现这一点。\n\
  \n### 定向钓鱼\n: 一种针对特定组织或该组织内特定个人的攻击，试图获得对机密数据的未授权访问。\n\n### 欺骗\n: 伪造虚假身份的任何形式，从而获得对资产的访问。\n\
  \n### 欺骗攻击\n: 基于更改设备的 MAC 或 IP 地址以改变其表面身份的攻击。\n\n### 间谍软件\n: 一种监控系统操作并收集用户名、密码、信用卡号和其他\
  \ PII 等信息的软件程序。\n\n### SQL 注入\n: 一种操纵网页上 SQL 输入字段框的攻击。通过字段框输入有效的 SQL 命令，导致 SQL 数据库透露输入框创建目的以外的信息。\n\
  \n### SSH 隧道\n\n\n\n\n\n## 术语表\n\n### S\n\n**安全连接建立**  \n: 一个在远程主机与本地设备或计算机之间创建安全连接的过程，通过该连接，未加密的流量可通过加密通道传输。\n\
  \n**有状态包过滤防火墙**  \n: 收集网络连接信息并维护动态状态表的防火墙，这些状态表用于后续连接，使端口能够根据包过滤规则定义进行开启和关闭。\n\n\
  **无状态包过滤防火墙**  \n: 更多地充当 `ACL` 作用的防火墙。它们不跟踪两台计算机之间连接的状态；但是，它们将数据包与过滤规则进行比较。\n\n\
  **存储区域网络 (SAN)**  \n: 一种基于网络的存储系统，在主机上表现为本地连接的存储。\n\n**流密码**  \n: 一种对称密钥密码，一次转换一个明文字符。\n\
  \n**Stuxnet (震网病毒)**  \n: 一种针对可编程逻辑控制器的病毒，该控制器指导伊朗核计划离心机的操作。\n\n**子网**  \n: 一个隔离的网络，最终属于一个更大的网络的一部分。\n\
  \n**超级 Cookie**  \n: 一种安全漏洞利用，旨在通过测量或利用系统或其硬件的间接效应，从系统收集信息或影响程序执行。比其他类型 Cookie 更难移除的第三方\
  \ Cookie。许多此类 Cookie 不使用传统的 Cookie 存储方法，而是使用本地浏览器 `HTML5` 数据库存储，甚至 `Adobe Flash`\
  \ 数据存储。\n\n**数据采集与监视控制系统 (SCADA)**  \n: 一种分布式控制系统架构，提供两个不同的功能——数据采集（输入）和监视控制功能（输出）。用于监控并提供对机器和过程的高级控制。\n\
  \n**监控设备**  \n: 用于集中管理一组远程本地控制设备的设备。\n\n**监管密码**  \n: 用于建立可用于访问 `CMOS` 设置实用程序的密码。\n\
  \n**交换端口窃取**  \n: 一种改变交换机流量方向的技术，导致交换机将本应发送给其他接收者的流量发送给攻击者。\n\n**基于交换机的虚拟化**  \n\
  : 一种通过托管交换机实现的网络虚拟化过程，用于将 `SAN` 设备连接在一起。这些设备也位于用户和存储网络之间，但可能采用不同的技术来提供存储管理功能。\n\n\
  **切换器**  \n: 用于多摄像头监控系统的设备。它们允许将多个摄像头与单个显示器一起使用。\n\n**对称密钥**  \n: 一种加密算法将使用相同的密钥执行加密和解密。\n\
  \n**SYN 洪水攻击**  \n: 一种拒绝服务攻击形式，攻击者利用 `TCP` 握手过程（使用 `SYN` 和 `ACK` 消息在两个主机之间建立可靠连接）进行攻击。\n\
  \n### T\n\n**标记数据包**  \n: 在数据包头部插入了 `VLAN ID` 以标识数据包属于哪个 `VLAN` 的数据包。\n\n**尾随**\
  \  \n: 类似于“搭便车”，社会工程学攻击者的最终目标是进入公司或组织的未授权区域。此方法涉及在不知情人员身后溜进，从而在未经其明确知晓的情况下获得访问权限。\n\
  \n**有形财产安全**  \n: 传统上称为物理安全，包含保护物理边界和财产。\n\n**泪滴攻击**  \n: 一种 `DoS` 攻击，向目标系统发送分片数据包。旧版操作系统在其\
  \ `TCP/IP` 重组机制中存在缺陷，导致分片数据包重叠并使主机崩溃。\n\n**遥测**  \n: 为了远程监控而自动进行的测量数据无线传输。\n\n**Telnet**\
  \  \n: 一种应用层客户端-服务器协议，可在计算机（或设备）与任何远程 `Telnet` 服务器之间建立 `TCP` 连接，以允许基于文本的通信。\n\n\
  **领域强化**  \n: 一种物理安全方法，采用结构、系统和设备来防止未经授权的进入，并明确区分公共区域和私有区域。\n\n**威胁**  \n: 实施意图造成痛苦、伤害、损害或其他敌对行动的潜在可能性。\n\
  \n**威胁主体**  \n: 拥有知识、能力和意图发起攻击的个人、团体、软件或硬件设备。也称为威胁行为体。\n\n**威胁识别过程**  \n: 一种预防措施，旨在记录可能产生风险因素并影响网络数据机密性、完整性和可用性的漏洞。\n\
  \n**威胁向量**  \n: 攻击者可能用于到达期望目标的方法。\n\n**基于阈值的异常检测系统**  \n: 旨在随时间跟踪特定事件发生次数，并在事件数量超过预定数量时生成入侵警告的\
  \ `IDS` 系统。\n\n**绝密**  \n: 通常为三级安全许可中的最高级别。\n\n**拓扑**  \n: 网络连接结构的物理和/或逻辑定义。\n\n\
  **追踪 Cookie**  \n: 放置在主机计算机上的非恶意文本文件，旨在追踪用户的网页浏览习惯。\n\n**透明代理**  \n: 一种代表主机通信且不修改请求的代理服务器，这与大多数代理服务不同。用户通常甚至不知道自己正在使用透明代理。\n\
  \n**传输层安全 (TLS)**  \n: `SSL` 协议的继任者，`TLS` 是一种通过加密应用程序间通信来确保隐私的协议。\n\n**特洛伊木马** \
  \ \n: 伪装成合法应用程序的恶意软件，诱使用户使用它们；虽然它们功能正常，但启动应用程序时会启动恶意代码。\n\n**中继链路**  \n: 一种指定用于处理和组合多个流量信号的通信链路，通常连接到其他网络设备，旨在整合物理端口使用。\n\
  \n**可信平台模块 (TPM)**  \n: 许多计算机主板设计中内置的微芯片，用于存储加密信息，如加密密钥（也称为启动密钥）。\n\n**可信 VPN**\
  \  \n: 不使用加密隧道技术，而是信任底层网络在认证之外处理安全性的 `VPN`。\n\n**TrustedGrub**  \n: 一个能够检测并支持 `Linux`\
  \ 系统中 `TPM` 功能的 `Linux` 模块。它是 `Grub` 引导加载程序的可下载扩展，已为此目的进行了修改。\n\n**隧道技术**  \n: 一个允许远程用户在建立\
  \ `Internet` 连接后安全连接到内部资源的过程。这是通过使用数据传输加密来保护传输中的数据来实现的。\n\n**双因素认证**  \n: 一个基于“你知道什么”、“你拥有什么”或“你是谁”，需要两个不同因素才能授予授权的过程。\n\
  \n**双人控制**  \n: 一种要求两个用户必须相互审查并批准对方工作以完成项目的实践。虽然这对许多任务可能不切实际，但对于实施它的任务提供了高级别的安全性。\n\
  \n### U\n\n**UDP 洪水攻击**  \n: 一种类似于 `ping` 洪水攻击的 `DoS` 攻击，使用 `UDP` (User Datagram\
  \ Protocol) 数据包。\n\n**未授权访问**  \n: 个人在没有拥有适当凭据的情况下获得对服务、应用程序、网络或设备的访问权限。\n\n**单向安全网关**\
  \  \n: 用于在具有不同安全分级的网络或网段之间创建单向连接。\n\n**统一威胁管理 (UTM) 设备**  \n\n\n\n\n\n## 安全设备\n\n\
  集网关、防病毒、防火墙、入侵防御和检测服务于一体的安全设备。\n\n## 通用即插即用 (UPnP)\n\n一种零配置网络架构，可在不同品牌和类型的网络硬件之间带来一定程度的兼容性。虽然主要旨在帮助非专业的家庭网络用户，但一些非消费级硬件制造商也支持\
  \ UPnP。\n\n## UNIX\n\nUNIX 操作系统系列提供模块化、多任务、多用户的操作系统环境，最初是为在大型机和小型计算机上运行而开发的。UNIX\
  \ 操作系统的专有版本包括多种 BSD（Berkeley Software Distribution，伯克利软件发行版）变体，以及 Apple 的 macOS\
  \ 和 iOS 操作系统和 Google 的 Android 操作系统。\n\n## UNIX 文件系统\n\n这是为原始 UNIX 操作系统设计的第一种文件结构，至今仍在\
  \ UNIX 及其衍生版本中使用。该文件系统标准的结构呈现统一的树形结构，从称为根目录（`/`）的主目录开始。\n\n## 解锁状态监控\n\n状况监控系统可在特定大门或门被解锁（授予访问权限）时进行记录和发出信号，指示并记录授予了哪种类型的访问权限。\n\
  \n## 无标签数据包\n\n未在数据包头部插入 VLAN ID 的数据包。\n\n## 更新\n\n提高操作系统可靠性、安全性或易用性的服务包或补丁。操作系统更新最可靠的来源是操作系统制造商。某些更新可能会使操作系统更方便，但不一定更安全。\n\
  \n### V\n\n## 变焦镜头\n\n包含多个可移动元件的光学组件，允许改变监控摄像头的有效焦距 (EFL)。与变焦镜头（zoom lens）不同，变焦镜头（varifocal\
  \ lens）在每次变更时都需要重新聚焦。如果配备变焦镜头，可根据用户偏好在多个毫米设置下进行聚焦。\n\n## 视频监控系统\n\n大多数商业安全系统的重要组成部分。该系统利用摄像头进行预防和恢复。\n\
  \n## 虚拟访问控制列表 (VACL)\n\n过滤进入 VLAN 的流量，以及过滤 VLAN 成员之间流动的流量的访问列表。\n\n## 虚拟局域网 (VLAN)\n\
  \n在数据链路层进行隔离的软件配置网络。\n\n## 虚拟专用网络 (VPN)\n\n远程用户可以通过公共网络（如 Internet）连接到专用网络，然后进行身份验证并在专用网络上执行任务，就像直接连接一样。它使用户能够跨公共网络与另一台设备通信，就像在专用网络中一样，从而确保安全性。\n\
  \n## 病毒\n\n旨在在本地计算机环境中复制和传播的恶意软件程序。这最常发生在用户从 Internet 下载程序或打开电子邮件附件时。\n\n## 语音钓鱼\n\
  \n利用电话进行网络钓鱼攻击。\n\n## VLAN 跳跃攻击\n\n这些攻击也称为交换机欺骗攻击，涉及攻击者向交换机发送动态中继协议 (DTP) 请求，将攻击者的端口配置为中继连接。配置完成后，该连接会将所有\
  \ VLAN 中的流量路由给攻击者。\n\n## VLAN 中继协议攻击\n\n这些攻击针对思科的二层 VLAN 中继协议 (VTP)。该协议提供跨整个网络的交换机之间自动\
  \ ISL/802.1Q 中继配置，以便它们可以共享数据包。VTP 的自动化特性默认提供对网络所有 VLAN 的访问。它可用于从网络中添加或删除 VLAN。这使得带有中继端口的交换机容易受到攻击。\n\
  \n## 漏洞\n\n可能允许攻击者访问网络资产的任何弱点。\n\n## 漏洞评估\n\n识别和确定网络或系统中已知漏洞优先级的过程。\n\n## 漏洞模拟器\n\
  \n用于渗透测试的训练模拟器。\n\n## 漏洞扫描器\n\n基于数据库的工具，旨在搜索计算机中已识别并添加到数据库中的已知漏洞。它们旨在评估计算机系统、网络和应用程序。\n\
  \n### W\n\n## 武器化阶段\n\n将收集的信息应用于创建用于发动攻击的工具的阶段。\n\n## Web 代理\n\n代表主机或主机网络访问 Web\
  \ 的计算机或服务器。\n\n## Web 服务器\n\n企业用于托管网页以在 Internet 上宣传其组织的服务器。这些是直接与 Internet 打交道的前端服务器。\n\
  \n## 鲸钓攻击\n\n一种针对高知名度最终用户（如企业高管、政客或名人）的个性化网络钓鱼形式。就像任何网络钓鱼攻击一样，鲸钓攻击的目标是通过伪造的电子邮件和其他社会工程学手段，诱骗个人泄露个人或公司信息和数据。\n\
  \n## 白盒\n\n一种渗透测试，其目标是模拟恶意内部威胁，此类威胁将深知客户的关键网络基础设施并拥有访问凭据，而非破坏其功能。\n\n## 白帽黑客\n\n\
  利用其在攻破和渗透计算机网络及安全系统方面的专业知识，用于良好、道德且最重要的是合法目的的黑客。\n\n## 白队\n\n监督并了解渗透测试的小组。有时称为蓝队。\n\
  \n## 白名单机制\n\n仅允许符合某些标准或通过身份验证的用户拥有访问权限的过程。\n\n## 白名单\n\n受信任拥有特定权限、服务或资产访问权的用户注册表。\n\
  \n## WiGLE\n\n一个在线数据库，用户使用并贡献数据，以追踪和记录无线网络信息。\n\n## WiMAX\n\n全球微波接入互操作性；一种宽带无线接入标准，旨在跨大型地理区域（如城市、县，在某些情况下甚至是国家）提供\
  \ Internet 接入。\n\n## 无线接入点 (WAP)\n\n允许无线客户端连接到有线网络的网络连接设备。\n\n## 无线网络\n\n任何不使用传统布线方案连接的网络。它使用高频无线电波连接计算机节点。IEEE\
  \ 组织在 IEEE-802.xx 旗下监督一组无线网络规范。\n\n## Wireshark\n\n一款开源且跨平台的网络协议分析器。这是最知名的协议分析器之一，支持几乎所有协议。\n\
  \n## 蠕虫\n\n通过网络连接传播的恶意软件程序。蠕虫搜索应用程序中的漏洞以加以利用，一旦蠕虫利用了漏洞，它就会寻求复制到网络上的另一台计算机。有时被称为网络病毒。\n\
  \n### Z\n\n## 零日攻击\n\n利用零日漏洞的攻击。\n\n## 零日漏洞\n\n产品供应商未知的漏洞，因此没有可用的补丁来缓解其影响。\n\n##\
  \ Z-Force\n\n一种数据包拦截和注入工具，用于攻破和利用 Z-Wave AES 加密。\n\n## Zigbee\n\n一种标准，即无线、网状组网的\
  \ PAN 协议，提供 10 米通信范围，数据传输速率为 250Kbps。Zigbee 标准已被智能家居自动化和工业控制社区，以及智能电网联盟的多个领域所采用。\n\
  \n## ZigBee 联盟\n\n一个开放的非营利协会，致力于开发新的 ZigBee 标准。\n\n## 僵尸主机\n\n\n\n\n# 附录 C\n\n##\
  \ 标准与参考文献\n\n有若干国际和国内标准及指南可供组织参考，以创建和维护其企业政策和程序中的网络安全部分。美国国家标准与技术研究院（NIST）是推动美国网络安全计划持续发展的主要动力之一。\n\
  \n这些框架的开发旨在协助政府和企业组织设计和开发系统及技术，为其关键基础设施提供安全保障。这些指南是本书《实用工业网络安全》编写过程中的关键参考资料。\n\n\
  以下列表列出了几个最常用的指南：\n\n*   **NIST SP 800-53，《联邦信息系统和组织的安全与隐私控制》**——由美国国家标准与技术研究院发布，这是一项美国安全标准，旨在为联邦信息系统和组织提供一套安全与隐私控制目录，以及一个选择控制的流程，以保护组织运营、资产和国家免受各类威胁的侵害，包括敌对网络攻击、自然灾害、结构性故障和人为错误。参见\
  \ `https://nvd.nist.gov/800-53`。\n\n*   **NIST 网络安全框架（CSF）**——CSF 由标准、指南和最佳实践组成，旨在促进关键基础设施保护。该框架基于优先级、灵活、可重复且具有成本效益的方法，将帮助关键基础设施的所有者和运营商管理网络安全相关风险，同时保护商业机密、个人隐私和公民自由。参见\
  \ `www.nist.gov/cyberframework/framework`。\n\n*   **NIST SP 800-82r2，《工业控制系统（ICS）安全指南》**——本指南旨在为保护工业控制系统（ICS）提供指导，包括\
  \ SCADA 系统、分布式控制系统（DCS）和其他 PLC 控制系统配置。该标准概述了 ICS 拓扑结构，识别了这些系统的典型威胁和漏洞，并提供了推荐的安全对策以减轻相关风险。参见\
  \ `https://csrc.nist.gov/publications/detail/sp/800-82/rev-2/final`。\n\n*   **NIST\
  \ SP 800-61-r2，《计算机安全事件处理指南》**——一份 NIST 特别出版物，旨在指导组织采用四阶段生命周期方法进行事件响应流程。参见 `https://csrc.nist.gov/publications/detail/sp/800-61/rev-2/final`。\n\
  \n*   **NIST 800-115，《信息安全测试与评估技术指南》**——一份 NIST 特别出版物，旨在协助组织规划和实施渗透测试、分析发现并制定缓解策略。参见\
  \ `https://csrc.nist.gov/publications/detail/sp/800-115/final`。\n\n*   **NIST 800-137，《联邦信息系统和组织的信息安全持续监控（ISCM）》**——一份\
  \ NIST 特别出版物，旨在指导组织开展持续安全监控运营。参见 `https://csrc.nist.gov/publications/detail/sp/800-137/final`。\n\
  \n*   **NIST 800–161，《联邦信息系统和组织的供应链风险管理实践》**——一份 NIST 特别出版物，旨在指导组织识别、评估和缓解其 IT/OT\
  \ 供应链风险。参见 `https://csrc.nist.gov/publications/detail/sp/800-161/final`。\n\n*  \
  \ **NERC CIP**——由北美电力可靠性公司制定，关键基础设施保护（CIP）计划是一组包含 9 项标准和 45 项要求的规范，旨在保障参与大规模电力生产和输配电系统运行的数字资产安全。特别是，CIP\
  \ 标准涉及电子安全边界、关键网络资产和人员的安全，以及实施和使用该计划的培训。参见 `www.nerc.com/pa/Stand/Pages/CIPStandards.aspx`。\n\
  \n*   **Nureg 6847，《美国核电站网络安全自我评估方法》**——该自我评估方法旨在协助核电站人员评估和管理网络安全风险。它是一种结构化方法，用于识别和审查关键数字资产，系统评估这些资产的漏洞，评估关键数字资产被成功利用对电厂的后果，估算网络安全风险，并确定具有成本效益的防护措施。参见\
  \ `www.cisa.gov/uscert/sites/default/files/c3vp/framework_guidance/nuclear-framework-implementation-guide-2015-508.pdf`。\n\
  \nICS 网络安全专业人员有若干政府和行业认可的标准及建议可供使用，以开展系统化、规范化和可重复的安全评估。这些基础标准包括：\n\n*   **国家安全系统委员会指令（CNSSI）1253r5**——本文件描述了国家安全系统的安全分类和控制选择的最低标准。参见\
  \ `www.dcsa.mil/portals/91/documents/ctp/nao/CNSSI_No1253.pdf`。\n\n*   **国际自动化学会，ISA/IEC-62443（前身为\
  \ ISA99）安全保障等级**——这一系列标准提供了一个灵活框架，用于解决和缓解工业自动化和控制系统（IACS）中当前及未来的安全漏洞。参见 `www.isa.org/intech-home/2018/september-october/departments/new-standard-specifies-security-capabilities-for-c`。\n\
  \n除了基础的 ICS 网络安全标准外，还有许多特定行业的指南和标准可供参考：\n\n*   **NRC 监管指南 5.71，《核设施网络安全计划》**——这些指南为核设施的网络安全计划提供方向。指南旨在保护数字计算和通信系统及网络免受网络攻击。参见\
  \ `www.nrc.gov/docs/ML0903/ML090340159.pdf.`。\n\n*   **INGAA 天然气管道行业控制系统网络安全指南**——这些文件旨在保护与天然气管道系统相关的计算系统和\
  \ SCADA 系统免受网络攻击。参见 `www.ingaa.org/Pipelines101/Security/26504.aspx`。\n\n*   **NISTIR\
  \ 7628，《智能电网网络安全指南》**——这份三卷本报告为保护智能电网设备免受网络攻击提供了指南。这些指南专门针对与智能电网运行相关的特定特征组合、风险和漏洞进行了定制。\n\
  \n## 参考链接\n\n以下参考列表提供了可获取更多 ICS 相关规范和法规信息的网站链接：\n\n*   `www.nist.gov/publications/guide-industrial-control-systems-ics-security`\n\
  \n    这是 NIST 工业控制系统（ICS）安全指南。\n\n*   `www.nerc.com/comm`\n\n    请查阅该网站，了解由运营、规划和关键基础设施保护委员会制定的可靠性和安全指南。\n\
  \n*   `www.nrc.gov/docs/ML0037/ML003706139.pdf`\n\n\n\n\n# 附录 D\n\n## 复习题与考试题答案\n\
  \n以下是各章节复习题和考试题的答案。\n\n### 第 1 章：工业控制系统\n\n### 复习题答案\n\n1.  使 PV（过程变量）保持在某个特定的预定值，即设定点（`sp`）。设定点可以是固定基准，例如安装在支柱上的简单液位传感器；也可以是可调基准，如普通恒温器，用户可在其上设定欲维持的期望温度。更多信息请参见“基本过程控制系统”部分。\n\
  \n2.  远程遥测单元（`RTU`）。更多信息请参见“远程遥测单元”部分。\n\n3.  控制器。更多信息请参见“基本过程控制系统”部分。\n\n4.  可编程逻辑控制器或\
  \ `PLC`。`PLC` 是专门设计用于执行工业控制功能的智能数字计算设备。更多信息请参见“可编程逻辑控制器”部分。\n\n5.  与 IT 计算机不同，工业过程控制器并非设计用于存储数据以供稍后处理。相反，它们根据内部配置或编程，基于输入的当前状态产生输出条件。更多信息请参见“工业过程控制器”部分。\n\
  \n6.  分布式控制系统（`DCS`）。当过程过于复杂以至于单个控制器无法处理，或其组件在地理上分离时，就有必要将控制功能分配到多个控制器上以形成 `DCS`。更多信息请参见“分布式控制系统”部分。\n\
  \n7.  数据采集与监视控制系统（`SCADA`）是一种分布式控制系统，提供两种截然不同的功能：数据采集（输入）和监视控制功能（输出）。更多信息请参见“数据采集与监视控制系统”部分。\n\
  \n8.  遥测。更多信息请参见“远程遥测单元”部分。\n\n9.  `SCADA` 软件为运行在过程中所有的 `PLC` 提供监视角色。它还提供人机界面（`HMI`），使人工操作员能够观察不同过程的运行参数，并接管过程以更改参数或进行修正。更多信息请参见“数据采集与监视控制系统”部分。\n\
  \n10.  安全仪表系统（`SIS`）。更多信息请参见“安全仪表系统”部分。\n\n11.  ICS 套件和 `SIS` 套件。安全仪表系统（`SIS`）基本上是专门设计用于监视和控制过程中已定义为不安全或潜在不安全条件的自动化过程控制系统。`SIS`\
  \ 通常作为整体 ICS 套件的组成部分而创建（但不是相同的组件）。当过程控制系统失效时，`SIS` 必须能够成功执行其功能。这两个系统合称为集成控制与安全系统（`ICSS`）。更多信息请参见“安全仪表系统”部分。\n\
  \n12.  紧急关断系统（`EMS`）。更多信息请参见“紧急关断系统”部分。\n\n13.  产生的记录振动模式可与之前时间点的模式进行比较，以确定机器磨损率。称为加速度计的装置被安装在旋转机械上，以随时间监测这些振动模式。记录的模式可在预设间隔进行比较，以确定机器磨损率。更多信息请参见“振动监测”部分。\n\
  \n14.  泄漏检测器。更多信息请参见“工业泄漏检测”部分。\n\n15.  确保过程控制系统中燃烧器的安全启动、运行和关闭。更多信息请参见“燃烧器管理系统”部分。\n\
  \n## 考试题答案\n\n1.  **A、B、C**。可用性、及时性、工业接口。过程控制是一种时间敏感型操作，要求快速响应时间。IT 系统通常没有及时性约束。因此，前线智能过程控制器运行在实时操作系统上。工业控制器通常提供极少甚至没有用户友好的界面功能，如键盘、指点设备或\
  \ LCD 显示器。相反，它们提供工业风格的输入和输出端口，用于连接传感器和执行器。更多信息请参见“工业过程控制器”部分。\n\n2.  **B、D**。远程遥测单元、可编程逻辑控制器。更多信息请参见“现场设备”部分。\n\
  \n3.  **A、B、E、F**。电源单元（`PSU`）模块、中央处理单元（`CPU`）模块、输出模块、通信模块。更多信息请参见“可编程逻辑控制器”部分。\n\
  \n\n\n\n\n## 第 2 章：ICS 架构\n\n### 复习题答案\n\n1. 因为像 `RS-485` 协议这样的异步通信方法在实时传输数据方面非常高效。更多信息请参阅“以太网连接”部分。\n\
  \n2. 用于在网络设备之间移动数据的通信媒介基本上有三大类。这些媒介类型包括铜线（双绞铜缆和同轴电缆）、光波（光纤电缆和红外光）以及无线射频（`RF`）信号（`Wi-Fi`、`WiMAX`、`Bluetooth`、`Zigbee`、`Z-Wave`）。更多信息请参阅“网络传输媒介”部分。\n\
  \n3. 高速和长距离信令能力。更多信息请参阅“外部网络通信”部分。\n\n4. 数字控制。在智能控制器引入过程控制之前，继电器是应用最广泛的电子末端元件。它们也被用来创建非常复杂的数字控制系统。将多个继电器以不同配置互联以提供对复杂过程的数字控制是很常见的。更多信息请参阅“继电器逻辑”部分。\n\
  \n5. 对于现代 `PLC`，编程软件位于工程师站上并在那里运行，工程师站通常是某种类型的个人计算机。当需要程序时，它可以通过现场总线链路、网络连接或直接从\
  \ `PC` 传输到 `PLC`。更多信息请参阅“PLC 编程”部分。\n\n6. 在过程控制环境中应用最广泛的工业传感器是机电开关。电气开关是用于在电路中接通或中断电流流动的装置。更多信息请参阅“工业开关”部分。\n\
  \n7. 过程单元是生产系统内的一组操作，可以被定义并从系统的其他单元过程中分离出来。更多信息请参阅“过程单元”部分。\n\n8. `Modbus`。更多信息请参阅“Modbus”部分。\n\
  \n9. 使用 `Modbus TCP` 协议时的主要考虑因素是不同的 `Modbus` 协议变体。因为不同的 `Modbus` 协议变体不可互换，所以 `Modbus\
  \ TCP` 设备必须配合这种格式使用。更多信息请参阅“Modbus TCP”部分。\n\n10. 因为 `EtherNet/IP` 构建在 `TCP/IP`\
  \ 协议栈之上，所以将 `ICS` 设备与企业服务器和互联网集成相对容易。更多信息请参阅“EtherNet/IP 协议”部分。\n\n11. 分布式网络协议（`DNP3`）实际上是一套工业通信协议，旨在为中央\
  \ `SCADA` 主站与电网系统中不同类型的远端设备（控制器，如 `IED`、`PLC` 和 `RTU`）之间的联网提供支持。更多信息请参阅“DNP3”部分。\n\
  \n12. 开放平台通信（`OPC`）协议标准是一种广泛接受的工业客户端-服务器规范，旨在促进工业控制应用与智能控制设备之间的数据交换。它最初的设计目的是将 Microsoft/Windows\
  \ 产品引入工业控制领域。更多信息请参阅“OPC”部分。\n\n13. 域名系统（`DNS`）服务配合分层的 `DNS` 命名系统工作，将可读的域名转换为用于定位连接到网络的计算设备的数字\
  \ `IP` 地址。更多信息请参阅“TCP/IP”部分。\n\n14. 动态主机配置协议（`DHCP`）用于从可用地址的旋转池中自动为用户分配 `IP` 地址。更多信息请参阅“TCP/IP”部分。\n\
  \n15. 组织选择 `TCP/IP-Ethernet` 策略用于其 `ICS` 网络有几个原因；许多组织指定其现有的 `IT` 员工来实施和维护其 `IT`\
  \ 和 `ICS` 网络。企业侧的 `TCP/IP-Ethernet` 联网提供了大量廉价的现成硬件和软件工具。`TCP/IP-Ethernet` 广为人知，因此有更大的人才库，技术人员和管理员已经熟悉它；组织希望其\
  \ `IT` 和 `ICS` 网络协同工作，以提高生产力和利润。更多信息请参阅“以太网连接”部分。\n\n## 考试题答案\n\n1. **D**。当梯形图中的启动按钮被激活时，警示灯点亮，电机\
  \ 1 启动，电机 2 停止。更多信息请参阅“继电器逻辑”部分。\n\n2. **B**。常闭。指定为常闭（`NC`）的开关，当其致动器处于未激活位置时，其触点闭合，电流可流过开关。当致动器移至激活状态时，触点分离，电路断开。在此状态下，无电流流过开关。更多信息请参阅“被动/主动状态配置”部分。\n\
  \n3. **D**。漏型输入用于 `PLC` 输入端从传感装置接收常规电流流向的连接方案中。更多信息请参阅“输入漏型和源型配置”部分。\n\n4. **B**。继电器输出。虽然固态输出使用的电压和电流受到限制（通常\
  \ `<= 24Vdc` 和 `0.5Adc`），但继电器输出的能力可以高得多（`240Vac/Vdc`），并能控制大得多的电流负载。更多信息请参阅“输出部分”部分。\n\
  \n\n\n\n\n## 第 3 章：安全 ICS 架构\n\n### 复习题答案\n\n1.  **网络防火墙**。网络防火墙是跨边界通信的第一道防线之一。更多信息请参见“边界防护”部分。\n\
  \n2.  **纵深防御策略**。更多信息请参见“边界防护”部分。\n\n3.  **防火墙规则**。优秀的防火墙将使用定义的规则提供包过滤，以拒绝或接受传入和传出的数据包。这可能更难配置，但有效的防火墙规则对大多数网络的安全至关重要。更多信息请参见“防火墙”部分。\n\
  \n4.  **网络分段**也称为分区，安全计划的各个层称为安全区域。安全区域是一个网络段，旨在根据网络资产（资源和数据）的安全漏洞或关键性，为其提供特定级别的安全性。其理念是将更有价值或更关键的网络资产置于提供更多保护的段或安全结构中。更多信息请参见“安全分区模型”部分。\n\
  \n5.  **网络隔离**。更多信息请参见“网络隔离”部分。\n\n6.  **数据库和文件服务器**。在该模型中，分区简化为包含应用区和展示区的两层结构。数据区和应用区在此模型中合并为单一层级。因此，数据库和文件服务器共享相似的安全级别。更多信息请参见“安全分区模型”部分。\n\
  \n7.  任何发送 `ARP` 广播以查找有效网络 IP 地址（分配给活动服务器或设备的地址）的设备都将收到回复。如果攻击者获得网络访问权限，他们可以看到网络中的每个资产，包括服务器、用户和设备。凭借合适的技能和足够的时间，他们可以利用所有这些设备。如果蠕虫病毒（如著名的\
  \ `Stuxnet` 病毒）突破了外围安全防线，则无法阻止其蔓延至整个网络。此外，对于源自网络内部的任何恶意活动，几乎没有保护措施。更多信息请参见“扁平网络拓扑”部分。\n\
  \n8.  必须在中间区域（或多个区域）提供网关，以使其获得安全访问。一个典型例子是组织拥有需要从远程位置访问内部数据层的员工（如销售人员）。在这些情况下，会在中间区域放置网关设备（如\
  \ `reverse proxy` 或 `terminal server`），以向这些用户提供访问权限，并配备病毒和恶意软件扫描工具。更多信息请参见“控制段间数据移动”部分。\n\
  \n9.  该 `ICS/IT` 模型由工业-普渡大学联盟为国际自动化学会（`ISA`）开发，旨在作为企业与 `ICS` 系统互联的参考。它已成为互联企业与 `ICS`\
  \ 网络的国际标准。更多信息请参见“ICS 参考架构”部分。\n\n10.  **托管交换机**。交换机也可用于创建逻辑上安全的虚拟局域网（`VLAN`）。`VLAN`\
  \ 是一种安全拓扑，通过限制网络数据包的移动，使其仅在指定端口间传递，从而限制网络流量的可见性。更多信息请参见“网络交换机”部分。\n\n11.  使用隧道技术在安全区域间传输私有数据的安全优势在于，分隔区域的连接设备无法知晓该通信属于私有网络的一部分。通过将私有数据和协议信息封装在公共传输数据包中，私有数据对系统隐藏。任何人扫描网络上的隧道传输都无法知晓消息内容。更多信息请参见“隧道技术”部分。\n\
  \n12.  在极高安全性的应用中，称为单向安全网关或数据二极管的网络设备被用于在具有不同安全分级的网络或网段之间创建单向连接。更多信息请参见“安全分区模型”部分。\n\
  \n13.  在 `ICS/IT` 网络环境中，`DMZ` 不位于企业网络外层安全级别与不受控互联网之间。相反，它位于更安全的 `ICS` 网络与较少信任的企业网络之间。应在企业网络与互联网之间创建另一个\
  \ `DMZ`。更多信息请参见“ICS 安全分区”部分。\n\n14.  利用无线传感器、控制器和执行器消除过程控制网络中 `ICS` 设备间的长距离布线，这一想法已被讨论和追求多年。更多信息请参见“无线网络”部分。\n\
  \n15.  **Zigbee/以太网网关**。在通信和数字网络中，网关被定义为一种设备，它将一个网络与采用不同协议的另一个网络进行互联。更多信息请参见“无线网关/路由器”部分。\n\
  \n## 考试题答案\n\n1.  **D**。`VLAN` 是一种安全拓扑，通过限制网络数据包的移动，使其仅在指定端口间传递，从而限制网络流量的可见性。更多信息请参见“网络交换机”部分。\n\
  \n\n\n\n\n## 第 4 章：ICS 模块与要素加固\n\n### 复习题答案\n\n1.  你可以从三层安全的角度来考虑保护单个 IT 或 ICS 设备：\n\
  \n    1.  外部边界是物理设备及其外壳周围外部的空间。\n\n    2.  内部边界应被视为设备的操作系统和应用程序。\n\n    3.  设备的内部由无形的数据资产组成——在设备中电子化创建、获取和存储的信息。\n\
  \n    更多信息，请参阅“用户工作站加固”部分。\n\n2.  自主或半自主的 ICS 控制设备，例如 `PLC` 或独立微控制器，通常可以放置在安全、可上锁的机柜中，仅限持有钥匙的人员访问。更多信息，请参阅“用户工作站加固”部分。\n\
  \n3.  正如将 ICS 网络连接到企业网络会为外部人员利用原本更安全的 ICS 开辟新途径一样，将 `BYOD` 设备引入网络会带来更多漏洞。网络管理员和安全人员必须确定这种\
  \ `BYOD` 环境是否会给他们的网络造成安全缺口。更多信息，请参阅“移动设备防护”部分。\n\n4.  虽然并非易事，但这些系统容易被拥有某些专用硬件和少量技能的人利用。通过接近持有\
  \ `RFID` 工牌的用户，黑客可以使用自己的读卡器读取目标的工牌信息。一旦捕获了工牌数据，他们就可以制作自己的工牌以绕过访问控制。这可能发生在用户在食堂、当地咖啡厅，甚至通过藏在办公室或生产设施中的小型\
  \ `IoT` 设备时发生。更多信息，请参阅“近场通信”部分。\n\n5.  最小权限访问原则。在通过权利和权限分配为用户提供对象访问权限时，应实施此原则。根据最小权限规则，每个用户仅被授予执行其工作角色所需的访问级别。始终如一地应用此原则，将安全漏洞造成的损害限制在初始任务、进程或用户范围内。更多信息，请参阅“逻辑服务器访问控制”部分。\n\
  \n6.  隔离、分段、防火墙和最小权限使用配置：虚拟网络默认彼此隔离。并且，由于虚拟网络内的通信永远不会离开虚拟环境，因此无需像物理网络或防火墙那样配置和维护网络分段。更多信息，请参阅“虚拟化”部分。\n\
  \n7.  应用软件更新和补丁。安全补丁是为纠正观察到的弱点以防止漏洞被利用而发布的更新。更多信息，请参阅“应用软件更新和补丁”部分。\n\n8.  在几乎所有环境中，组织策略都会要求所有服务器安装实时扫描防病毒应用程序，以及实时反间谍软件程序。特别是，如果服务器是文件服务器，或拥有远程访问能力的非管理员用户，则需要这些应用程序。更多信息，请参阅“实施”部分。\n\
  \n9.  传统上，防病毒和其他反恶意软件程序不适合用于 `OT` 计算和控制设备。这些类型的扫描应用程序在运行时是性能占用大户。由于 `ICS` 控制器的实时计算要求，这类安全应用程序的存在会引入不可接受且可能对设备和人员造成危险的通信和计算延迟。然而，越来越多的组织选择在其\
  \ `OT` 环境中运行反恶意软件应用程序，前提是在严格受控的实施和管理下。更多信息，请参阅“实施”部分。\n\n10.  面向公众的表单（如登录表单）编写糟糕的编程代码。更多信息，请参阅“SQL\
  \ 注入”部分。\n\n11.  与企业网络中的服务器一样，关于数据库安全最重要的问题是，数据库应位于网络的何处？保护数据历史服务器最常用的方法是将其放置在安全的网络结构中，例如企业网络和\
  \ `ICS` 网络之间的 `DMZ`。更多信息，请参阅“数据库加固”部分。\n\n12.  公钥加密（`PKE`）。该技术采用两个密钥来确保加密数据的安全：一个公钥和一个私钥。更多信息，请参阅“文件系统安全”部分。\n\
  \n\n\n\n\n## 13. 访问控制列表（ACL）\n\n第一种是对象或用户对网络中特定资源拥有的权限列表，称为**自主访问控制列表（DACL）**。使用这种类型的\
  \ ACL，访问控制是一种可配置的服务（使用权限），用于确定用户可以访问、更改或查看的内容。另一种可配置的网络 ACL 是驻留在防火墙或路由器接口上的列表，它允许或拒绝流量通过设备上的特定接口或端口流入或流出网络。更多信息，请参阅“配置交换机\
  \ ACL”部分。\n\n## 14. 交换机端口安全\n\n这是内置于网络交换机中的一项管理功能，允许对单个物理端口进行配置，以便通过该端口的流量可以限制为特定的\
  \ MAC 地址或 MAC 地址列表。更多信息，请参阅“交换机端口安全”部分。\n\n## 15. 远程访问认证\n\n获得 ICS 远程访问权限的任何个人，都应被要求在企业网络层面和控制\
  \ ICS 网络访问的网络防火墙层面进行双重认证。更多信息，请参阅“ICS/IT 网络安全”部分。\n\n## 16. 更新实施注意事项\n\n在活跃的企业网络中实施更新存在几个潜在困难。在实施任何更改之前，应备份所有关键文件夹和组织资源。为避免潜在的破坏性或干扰性事件，产品更新应始终先在非生产服务器上测试，然后再在组织网络中全面实施。您可能还需要考虑在网络最不繁忙的时间安装应用程序更新——例如在夜间或周末。更多信息，请参阅“网络加固预防措施”部分。\n\
  \n## 考试题目答案\n\n### 1. 答案：**B**\n\n对于计算设备和智能控制设备，攻击者可以在三个通用位置获得对这些项目的访问权限。首先是内存中，其次是存储设备中（如硬盘和闪存驱动器），第三是数据在从一个地方传输到另一个地方时。更多信息，请参阅“用户工作站加固”部分。\n\
  \n### 2. 答案：**A, B, D**\n\n- **A.** 这些选项包括设置用户密码以控制对系统的访问，以及设置管理密码以控制对 `CMOS` 设置实用程序的访问。\n\
  - **B.** 通过禁用这些端口，用户和管理员可以帮助确保未经授权的用户无法使用这些端口获得对系统的未授权访问、将信息传出系统或将恶意软件下载到系统中。\n\
  - **D.** 大多数 `BIOS` 提供启动设备启用、禁用和排序功能，应使用这些功能来控制计算机启动运行的环境。\n\n更多信息，请参阅“BIOS 安全子系统”、“BIOS\
  \ 端口启用功能”和“BIOS 启动设备序列控制”部分。\n\n### 3. 答案：**B**\n\n所有移动用户在工作场所使用移动设备时都应保持谨慎。除非您正在与设备配对并需要此功能，否则应关闭蓝牙自动发现。也要留意蓝牙设备上的其他安全选项。避免使用公共热点。如果您确实使用公共热点，请注意潜在风险，使用\
  \ `TLS/SSL` 连接，并仅在安全系统中输入凭据。关闭自动连接（重新连接）到 Wi-Fi 接入点。蜂窝网络不太可能被攻破，因此在需要高安全性时请使用蜂窝网络。如果实现端到端加密，所有无线技术都更安全。更多信息，请参阅“移动设备安全”部分。\n\
  \n### 4. 答案：**A, B, D**\n\n这些步骤包括实施本地登录要求、实施额外的认证选项、使用本地管理工具以及提供远程访问保护（建立防火墙设置）。更多信息，请参阅“常见操作系统安全工具”部分。\n\
  \n### 5. 答案：**A, B**\n\n在主机内创建虚拟网络提供了多种安全功能。一是**隔离**。除非主机配置为其外部物理网络与内部虚拟网络之间互联，否则虚拟网络默认与物理网络隔离。虚拟网络内的通信永远不会离开虚拟环境。二是**分段**。除非主机另有配置，虚拟网络内的通信不会离开虚拟环境，因此无需在物理网络或防火墙上配置和维护网络分段。还有**防火墙保护**。在配置为虚拟网络入口的\
  \ VM 上安装基于主机的防火墙，可在虚拟网络与主机的物理网络连接之间提供保护，**最小权限使用配置**。更多信息，请参阅“虚拟化”部分。\n\n### 6.\
  \ 答案：**C, D**\n\n这使得防病毒和其他反恶意软件程序不适合与 ICS 计算和控制设备一起使用。这些类型的扫描应用程序在运行时是性能占用大户。由于\
  \ ICS 控制器的实时计算要求，存在这类安全应用程序会引入不可接受且可能对设备和人员造成危险的通信和计算延迟。更多信息，请参阅“实施”部分。\n\n### 7.\
  \ 答案：**A**\n\n在**强制访问控制（MAC）**下，系统确定哪些用户或组可以访问文件、文件夹和其他资源。更多信息，请参阅“逻辑服务器访问控制”部分。\n\
  \n### 8. 答案：**C, D**\n\n安装期间或安装后，网络管理员必须启用所有所需的服务或协议。因此，管理员必须能够正确回答以下几个问题，以正确安装操作系统并提供所需的服务和安全级别：\n\
  \n1.  网络上当前使用哪些协议和服务？\n2.  网络上真正需要哪些协议和服务？\n3.  由于这些协议或服务，客户端和服务器之间建立了哪些依赖关系或链接？\n\
  \n请考虑每个网络协议。如果识别出连接协议，请评估其源地址和目标地址，以确保网络内所需的关键协议未被禁用。更多信息，请参阅“配置服务和协议”部分。\n\n###\
  \ 9. 答案：**B, C, D**\n\n由于交换机接口通常使用 `Telnet` 或 `HTTP` 进行配置，因此也应将其置于防火墙后面以进行保护。此外，应要求使用密码，并在配置这些接口时采用\
  \ `SSH` 或直接连接的控制台。更多信息，请参阅“网络连接设备加固”部分。\n\n### 10. 答案：**A**\n\n**保护**。如果配置了保护模式响应，端口将继续转发已知\
  \ MAC 地址的流量，但会丢弃违规发生前未知地址的流量。但是，不会产生任何安全通知。更多信息，请参阅“交换机端口安全”部分。\n\n## 第 5 章：ICS\
  \ 网络安全要点\n\n### 复习题答案\n\n## 1. 审计\n\n**审计** 使用日志或其他跟踪工具创建事件跟踪列表。更多信息，请参阅“机密性、完整性和可用性”部分。\n\
  \n## 2. 授权\n\n**授权** 是在个人通过认证后，对其访问指定信息的批准。更多信息，请参阅“机密性、完整性和可用性”部分。\n\n## 3. 认证\n\
  \n**认证** 涉及确保个人是其声称的那个人。更多信息，请参阅“机密性、完整性和可用性”部分。\n\n\n\n\n\n## 4. 机密性\n\n**机密性**\
  \ 是指确保数据保持秘密或私有的保证。它是通过一套旨在将数据访问限制在授权人员范围内的规则来建立的。更多信息，请参阅“机密性、完整性和可用性”部分。\n\n##\
  \ 5. 完整性\n\n**完整性** 是指确保数据准确且可信的保证。更多信息，请参阅“机密性、完整性和可用性”部分。\n\n## 6. 可用性\n\n**可用性**\
  \ 是指确保数据能够及时、可靠地被访问的保证。更多信息，请参阅“机密性、完整性和可用性”部分。\n\n## 7. 欺骗\n\n**欺骗**。字典将欺骗定义为“欺诈或恶作剧”。在网络安全领域，欺骗用于使一台设备看起来像另一台设备，且可以通过多种不同方式实现。更多信息，请参阅“欺骗”部分。\n\
  \n## 8. DoS 与 DDoS 攻击\n\n它制造了导致无法使用目标系统的条件。更多信息，请参阅“DoS 与 DDoS 攻击”部分。\n\n## 9. ICS\
  \ 网络中的可用性\n\n虽然企业网络的主要安全原则涉及为数据提供 **CIA**，但在工业或公用事业网络中，主要重点应转移到考虑网络中每个资产或系统的每个 **CIA**\
  \ 影响。基本上，安全原则变为 **AIC**（可用性优先，然后是完整性，最后在可能的情况下才是机密性），以保持运营持续运行。更多信息，请参阅“ICS 网络中的可用性”部分。\n\
  \n## 10. 侦察\n\n**侦察**。侦察是黑客熟悉目标并开始寻找潜在途径进入目标关键基础设施的第一步，无论是手动还是数字化方式。黑客通常会花费更多时间对目标进行侦察和研究，而不是实际利用漏洞。更多信息，请参阅“侦察”部分。\n\
  \n## 11. 加密\n\n**加密**。加密无非是将电子数据转换为一种称为 **密文** 的形式。这涉及向数据应用一个秘密代码（**密码**），以生成一条混淆后的消息，如果不知道用于创建它的密码，就无法理解该消息。更多信息，请参阅“加密”部分。\n\
  \n## 12. 社会工程学攻击\n\n物理和心理活动。更多信息，请参阅“社会工程学攻击”部分。\n\n## 13. 哈希\n\n**哈希**。哈希用于提供多种与安全相关的功能，包括传输文件或消息的完整性验证、密码验证、文件识别、工作量证明和\
  \ **电子签名** 安全。更多信息，请参阅“哈希”部分。\n\n## 14. 密码攻击\n\n**暴力破解攻击**、**彩虹表** 和 **密码捕获**。**暴力破解攻击**\
  \ 会针对用户的登录尝试密码列表。**彩虹表** 是预生成的表，包含数百万个已经过哈希处理的密码。由于大多数主机系统都包含哈希密码文件，因此可以将其与 **彩虹表**\
  \ 提供的哈希内容进行比较，以期找到匹配的密码。**密码捕获**，或 **凭证收集**，是指攻击者在密码发送过程中将其拦截。一种常见的实现方式是通过 **中间人攻击**。更多信息，请参阅“密码攻击”部分。\n\
  \n## 15. 密钥管理\n\n**密钥管理**。**密钥管理系统 (KMS)** 应用程序为计算设备和应用程序的密钥创建、存储和分发提供集成管理功能。更多信息，请参阅“密钥管理”部分。\n\
  \n## 考试题目答案\n\n### 1. 最小权限原则\n\n**C**。**最小权限原则**。最小权限原则和需知原则被管理员用于建立对不同资产的访问控制级别。该原则是指给予每个用户完成其工作角色所需的最少访问权限，并且仅限于他们必须访问的网络区域。更多信息，请参阅“最小权限原则”部分。\n\
  \n### 2. 不可否认性\n\n**D**。**不可否认性**。通常，在网络安全环境中，该术语用于指代一种证明数据完整性和来源（作者身份）的服务。换句话说，即证明某个对象（如文档或图形）是真实的，且来自自称发送它的人的身份验证。更多信息，请参阅“不可否认性”部分。\n\
  \n### 3. 内部威胁\n\n**B**。**内部威胁**。研究表明，内部威胁代表了对大多数网络化组织最大的威胁。一些调查结果表明，内部威胁可能占恶意网络活动的\
  \ 20% 以上。更多信息，请参阅“内部威胁”部分。\n\n### 4. 拒绝服务\n\n**C**。**单台服务器正遭受攻击**。**分布式拒绝服务 (DDoS)**\
  \ 攻击涉及使用多个远程系统同时对目标资源发起攻击。更多信息，请参阅“拒绝服务”部分。\n\n### 5. 事件、事故与攻击\n\n**B**。**网络安全事故**\
  \ 是指在网络或计算环境中产生不利影响、需要采取行动缓解的事件。该术语也可适用于违反组织安全策略、程序或可接受使用实践的事件。更多信息，请参阅“事件、事故与攻击”部分。\n\
  \n### 6. SYN 洪水攻击\n\n**A**。**握手交换期间使用的 TCP/IP 缓冲区空间**。**SYN 洪水攻击** 是一种拒绝服务攻击形式，攻击者利用使用\
  \ **SYN** 和 **ACK** 消息在两个主机之间建立可靠连接的 TCP 握手过程。更多信息，请参阅“SYN 洪水攻击”部分。\n\n### 7. 加密\n\
  \n**B**。**加密** 无非是将电子数据转换为一种称为 **密文** 的形式。这涉及向数据应用一个秘密代码（**密码**），以生成一条混淆后的消息，如果不知道用于创建它的密码，就无法理解该消息。如果第三方可以轻松地以电子方式捕获密码，那么密码有多安全都无关紧要。更多信息，请参阅“加密”部分。\n\
  \n### 8. 社会工程学攻击\n\n**C**。**社会工程学**。**社会工程学** 本质上是利用人际互动来规避正常的安全措施。随着传统安全措施的改进和网络攻击实施难度的增加，黑客正转向物理和心理层面的人为操纵以达到目的。更多信息，请参阅“社会工程学攻击”部分。\n\
  \n### 9. 密码学\n\n**B**。**发送方的私钥用于创建唯一的数字签名**。请注意，这不适用于 **PKI** 实现，在 PKI 中，消息创建者使用接收方的公钥来加密消息。更多信息，请参阅“密码学”部分。\n\
  \n### 10. 中间人攻击\n\n**D**。**中间人攻击**。如果你看到的似乎是你打算登录的网站并输入了凭证，一个假网站通常会将它们重定向到真实的登录页面。通常，用户会认为自己输入凭证有误，最终登录到真实网站。处于尝试登录过程中间的人刚刚就获取了你的凭证。更多信息，请参阅“中间人攻击”部分。\n\
  \n## 第 6 章：物理安全\n\n### 复习题答案\n\n## 1. 简介\n\n**物理安全**。在实践中，这涉及旨在打击盗窃、防止物理损坏、维护系统完整性和服务、以及限制未经授权的信息泄露的政策、实践和步骤。更多信息，请参阅“简介”部分。\n\
  \n## 2. 生物识别扫描仪\n\n**误接收** 或 **误报失败**。更多信息，请参阅“生物识别扫描仪”部分。\n\n\n\n\n\n## 3. 获取合理的视频摄像机图像所需的光量称为照度等级\n\
  \n照度是衡量落在物体上的光量的单位。一勒克斯大约相当于一米外一支蜡烛照射在一平方米上的光量。典型的摄像机照度等级范围在 0.5 到 1.0 勒克斯之间。更多信息，请参阅“摄像机规格”部分。\n\
  \n## 4. 自然出入控制\n\n自然出入控制涉及利用自然设计元素（如建筑结构和景观绿化）来引导人员进出空间。更多信息，请参阅“基础设施安全”部分。\n\n\
  ## 5. 键盘\n\n大多数入侵检测和报告系统都采用键盘设备来对各种出入控制和管理设备进行编程、控制和操作。更多信息，请参阅“入侵检测和报告系统”部分。\n\n\
  ## 6. 红外 (IR) 摄像机\n\n红外安全摄像机在摄像机镜头外侧安装了红外 LED 补光灯（其光线来自电磁波谱中我们平时不常见的区域）。这种补光灯使摄像机能够在完全无光的情况下捕获清晰图像。在微光（称为低照度）条件下，红外摄像机捕获的画面看起来就像白天一样。更多信息，请参阅“摄像机部署策略”部分。\n\
  \n## 7. CCD\n\n最好的监控摄像机采用电荷耦合器件 (CCD) 技术。它们具有高分辨率、低工作照度要求、较小的温度依赖性和高可靠性。更多信息，请参阅“摄像机”部分。\n\
  \n## 8. 远程访问监控系统\n\n远程访问监控系统用于在发生未授权访问尝试时通知主管安保人员。更多信息，请参阅“远程访问监控和自动化出入控制系统”部分。\n\
  \n## 9. 电话线或蜂窝通信系统\n\n最常见的远程通知系统涉及入侵检测和报告系统的控制面板使用电话线，在报警条件存在时自动呼叫远程监控设施或关键人员。然而，越来越多的系统具备内置的蜂窝通信系统。此类系统提供了额外的可靠性，因为即使物理电话线路受损，它们仍能正常工作。更多信息，请参阅“远程报警消息传递”部分。\n\
  \n## 10. 领域强化\n\n领域强化利用结构、系统和设备来防止未授权进入，并明确区分公共区域和私人区域。更多信息，请参阅“基础设施安全”部分。\n\n##\
  \ 11. 未锁定状态监控\n\n更多信息，请参阅“出入控制系统”部分。\n\n## 12. 门和窗\n\n控制面板的周界区域输入通常包括每个周界开口处的传感器，包括门、窗、车库门窗以及通往地窖的门。额外的周界防护可能包括使用声音、振动和运动探测器传感器来防范通过破窗而入的行为。更多信息，请参阅“入侵检测和报告系统”部分。\n\
  \n## 13. 将相关传感器逻辑分组以创建安全区域\n\n这是通过将所有相关的传感器开关（所有传感器在安全控制器中均表现为开关）以串行方式连接在一起，并接至控制器面板上的一组特定触点来实现的。更多信息，请参阅“物理安全区域”部分。\n\
  \n## 14. 认证涉及多个因素\n\n`Knowledge`（知识因素）是指只有指定人员才应知道的信息（你知道的东西）。`Possession`（持有因素）是指只有指定人员才应持有的物品（你拥有的东西）。`Inherence`（固有因素）是指只有指定人员才具备的生物特征（你本身的特征）。`Location`（位置因素）是指只有指定人员才应处于的位置（你所在的地方）。更多信息，请参阅“认证系统”部分。\n\
  \n## 15. 为安全目的录制视频时，最重要的两个考量因素是：需要存储多少视频，以及存储多长时间？\n\n这些问题的答案使组织能够确定其存储容量需求。更多信息，请参阅“摄像机部署策略”部分。\n\
  \n## 考试题目答案\n\n1.  **C**。外部周界。更多信息，请参阅“基础设施安全”部分。\n\n2.  **D**。企业网络安全策略。更多信息，请参阅“基础设施安全”部分。\n\
  \n3.  **A, B**。一扇锁着的门和一名接待员。更多信息，请参阅“物理安全控制”部分。\n\n4.  **B**。数字 IP 摄像机。更多信息，请参阅“IP\
  \ 摄像机”部分。\n\n5.  **A, C**。误拒和误报故障。更多信息，请参阅“生物识别扫描仪”部分。\n\n6.  **D**。认证。更多信息，请参阅“认证系统”部分。\n\
  \n7.  **A**。鱼眼镜头。更多信息，请参阅“镜头类型”部分。\n\n8.  **B**。可接受图像所需的光量。更多信息，请参阅“摄像机规格”部分。\n\n\
  9.  B, **C**。网络附属存储 (NAS) 和存储区域网络 (SAN)。`Networked Storage`（网络存储）是指利用网络技术将基于 IP\
  \ 的视频存储在远程计算机或视频服务器上。更多信息，请参阅“摄像机部署策略”部分。\n\n10.  **A**。NERC CIP。更多信息，请参阅“NERC CIP\
  \ 006-1”部分。\n\n## 第 7 章：访问管理\n\n### 复习题答案\n\n1.  强制访问控制。更多信息，请参阅“强制访问控制”部分。\n\n\
  2.  安全管理员。行政职责的划分可能涉及一名专门的安全管理员，负责为网络中的服务器、主机和连接设备执行信息安全任务。在这些环境中，行政职责的分离应尽可能清晰、明确和受控。更多信息，请参阅“简介”部分。\n\
  \n3.  RBAC。基于角色的访问控制模型是一种旨在对所有网络对象和用户进行集中控制的策略。它根据用户在组织中的职位提供访问控制。网络管理员被授予指定和实施明确安全策略的权力，以执行组织的既定策略。每个网络用户或组被分配一个或多个角色。更多信息，请参阅“基于角色的访问控制”部分。\n\
  \n4.  组策略。这些是目录服务数据库对象，管理员用它们根据用户在组织中的职位和工作角色来创建对网络资产的组访问和限制。这些对象使管理员能够从单一管理环境中跨网络实施这些策略。更多信息，请参阅“访问控制模型”部分。\n\
  \n5.  访问控制列表 (ACL) 将权限附加到网络对象上，系统利用这些权限来控制对资产（程序、文件夹、文件、打印机）的访问，以及可对这些资产执行的活动。更多信息，请参阅“访问控制模型”部分。\n\
  \n6.  封装安全载荷 (ESP) 提供源认证以及加密。ESP 对整个 TCP/UDP 数据报进行加密和封装，置于一个不包含任何端口信息的 ESP 头部中。更多信息，请参阅“虚拟专用网络”部分。\n\
  \n7.  用户账户限制是添加到模型中的最后一个访问控制组件。这些是管理员应用于用户账户（而非文件夹、文件和打印机）的配置，旨在限制其在本地计算机上（本地账户）或整个网络中（域账户）的活动。更多信息，请参阅“访问控制模型”部分。\n\
  \n\n\n\n\n## 8. 认证头 (AH)\n\n认证头 (AH) 提供数据完整性和源认证，以防止重放攻击（攻击者重放记录的传输以获取访问权限的攻击）。有关更多信息，请参阅“虚拟专用网络”部分。\n\
  \n## 9. 目录服务\n\n目录服务是分布式、可定制的信息存储结构，提供一个单一入口，用户可由此搜索并定位分散在整个网络中的资源。有关更多信息，请参阅“目录服务”部分。\n\
  \n## 10. Active Directory 结构\n\n树是共享相同 DNS 名称的对象集合。Active Directory 可将域细分为组织单位（销售、管理等），这些单位可包含其他单位，或叶对象（如打印机和用户）。有关更多信息，请参阅“Active\
  \ Directory”部分。\n\n## 11. 安全账户管理器 (SAM)\n\n此数据库包含有关用户账户、组账户和计算机账户的信息。它跟踪域内所有对象的名称和资源请求。您可能还会发现此数据库被称为安全账户管理器\
  \ (SAM)。有关更多信息，请参阅“Active Directory”部分。\n\n## 12. Linux 目录服务\n\n较新的发行版已转向基于 LDAP\
  \ 的目录服务。与 Active Directory 一样，基于 LDAP 的 Linux 平台为系统信息查找和认证提供单一目录源。将用户信息存储在基于 LDAP\
  \ 的目录服务器中，使网络具有可扩展性、可管理性和安全性。有关更多信息，请参阅“Linux 目录服务”部分。\n\n## 13. 远程访问服务器 (RAS)\n\
  \nRAS 是一台专门为远程用户（不属于域 ACL 成员的用户）提供网络访问的服务器。该服务器负责认证这些用户以访问特定网络资产，并为他们提供登录凭据。有关更多信息，请参阅“远程访问服务器认证”部分。\n\
  \n## 14. 管理员和用户\n\n这些基本上是网络中的两类用户。有关更多信息，请参阅“用户访问管理”部分。\n\n## 15. Root\n\nRoot 管理员组是一个标准的、默认的\
  \ Linux 组，拥有对系统的完全管理控制权。有关更多信息，请参阅“Linux 组账户”部分。\n\n## 考试题目答案\n\n### 1. 安全 VPN\n\
  \n**A**. 安全 VPN。可信 VPN 不使用加密隧道，而是信任底层网络处理认证之外的安全性。安全 VPN 处理连接的加密。有关更多信息，请参阅“虚拟专用网络”部分。\n\
  \n### 2. 远程 ICS 访问的安全工具\n\n**A, C, E**. 有一些非常具体的安全工具应分配给此路径：虚拟专用网络 (VPN) 网关、加密 VPN\
  \ 隧道和远程访问服务器 (RAS)。有关更多信息，请参阅“远程 ICS 访问控制”部分。\n\n### 3. NTFS 修改权限\n\n**B**. 修改。修改权限允许用户删除文件夹，并使得用户能够执行与写入和读取并执行权限相关的所有活动。有关更多信息，请参阅“NTFS\
  \ 权限”部分。\n\n### 4. 目录服务特征\n\n**A, B, D**. 可分布在多个地理位置的信息存储。可从多种不同操作系统访问的信息存储。用户可用于高效搜索企业中可能分布在整个网络中的信息的信息存储。有关更多信息，请参阅“目录服务”部分。\n\
  \n### 5. VPN 隧道协议\n\n**A, D**. L2TP 和 PPTP。有关更多信息，请参阅“虚拟专用网络”部分。\n\n### 6. IPSec\
  \ 协议\n\n**C, D**. IPSec 使用认证头 (AH) 进行 IP 源认证，使用封装安全载荷 (ESP) 实现机密性。有关更多信息，请参阅“虚拟专用网络”部分。\n\
  \n### 7. 云服务模型\n\n**D**. IaaS。在基础设施即服务云环境中，客户通常从云服务租用底层基础设施。在这种情况下，客户也会获得对云基础设施配置的访问权限。有关更多信息，请参阅“云系统访问控制”部分。\n\
  \n### 8. 强制访问控制\n\n**D**. 强制访问控制要求用户具有安全许可。用户访问对象的能力取决于敏感度标签，该标签验证用户的许可级别。有关更多信息，请参阅“强制访问控制”部分。\n\
  \n### 9. 基于属性的访问控制 (ABAC)\n\n**C**. 基于属性的访问控制 (ABAC) 被认为是基于源自策略声明的复杂布尔规则集的新一代访问控制模型。该模型操纵三类组件以确定对资源的访问或拒绝：`architecture`、`attributes`\
  \ 和 `policies`。有关更多信息，请参阅“基于属性的访问控制”部分。\n\n### 10. 自主访问控制 (DAC)\n\n**B, D**. 在 DAC\
  \ 中，每个文件或对象都有一个所有者，该所有者对该文件或对象拥有完全控制权。有关更多信息，请参阅“自主访问控制”部分。\n\n## 第 8 章：ICS 安全治理与风险管理\n\
  \n### 复习题答案\n\n#### 1. 策略\n\n策略是组织遵守的规则。有关更多信息，请参阅“简介”部分。\n\n#### 2. 程序\n\n程序是为执行组织策略而采取的一系列步骤。有关更多信息，请参阅“简介”部分。\n\
  \n#### 3. 医疗行业合规\n\n涉及医疗记录安全性和机密性的医疗行业。组织必须有能力证明其遵守政府法规。例如，违反 HIPAA 可能使组织每次面临高达\
  \ 150 万美元的罚款。有关更多信息，请参阅“要求”部分。\n\n#### 4. 金融行业合规\n\n涉及客户财务记录安全性和机密性的金融行业。组织必须有能力证明其遵守政府法规。有关更多信息，请参阅“要求”部分。\n\
  \n#### 5. 风险定义\n\n风险。风险被定义为有价值对象的潜在损失。它也可以表示为与不确定性的有意交互。风险也是一种可以向组织内部和外部利益相关者传达的量化指标。有关更多信息，请参阅“风险管理”部分。\n\
  \n#### 6. 风险评估目的\n\n风险评估的目的是“识别可采取的步骤，以确保组织了解其组织运营（包括其使命、职能、形象或声誉）、组织资产及其人员面临的网络安全风险。”有关更多信息，请参阅“风险评估”部分。\n\
  \n#### 7. 影响评估\n\n影响评估。组织必须确定哪些威胁对其构成真正的关注。这是通过评估每个安全事件实际发生的影响来确定的，这一过程称为影响评估和分析。有关更多信息，请参阅“影响评估”部分。\n\
  \n#### 8. 数据包分析器\n\n数据包分析器是一种软件工具，可在数据包跨网络移动时捕获它们，记录它们，然后解码其原始数据。随后它可以分析这些数据，实际上是在监视网络用户。有关更多信息，请参阅“风险识别漏洞评估”部分。\n\
  \n#### 9. NIST 检测功能\n\n检测 (DE) 功能。开发并实施适当的活动，以识别网络安全事件的发生。检测功能可及时发现网络安全事件。该功能中的成果类别示例包括异常和事件、安全持续监控和检测过程。有关更多信息，请参阅“NIST\
  \ 网络安全框架”部分。\n\n#### 10. 网络漏洞扫描器\n\n网络漏洞扫描器套件，用于扫描企业中的不同类型常见漏洞，如系统错误配置和默认密码使用，以及通过生成畸形数据包来创建\
  \ DoS 攻击。有关更多信息，请参阅“风险识别漏洞评估”部分。\n\n\n\n\n\n## 复习题答案 (续)\n\n11. 人员安全、设备安全、环境影响、生产损失、数据丢失和不利的业务影响。更多信息，请参阅“设备关键性”部分。\n\
  \n12. 为其分配单次损失期望值（SLE）和年化发生率（ARO）值。要正确评估该特定事件发生给组织带来的财务影响，必须将其 SLE 值乘以 ARO 值。更多信息，请参阅“影响评估”部分。\n\
  \n13. 危险与可操作性分析（HAZOP）由多方团队执行，旨在评估工业过程中潜在的问题，以识别对人员或设备的风险。该分析基于一组标准引导词，旨在将这些潜在问题及其后果暴露出来。更多信息，请参阅“ICS\
  \ 风险评估”部分。\n\n14. 风险被定义为价值对象的潜在损失。它也可以表示为与不确定性的有意交互。风险还是一种可以向组织内部和外部利益相关者传达的量化指标。风险管理是识别、评估和应对风险的过程。更多信息，请参阅“风险管理”部分。\n\
  \n15. 风险评估的目的是“识别可采取的步骤，以确保组织了解其组织运营（包括其使命、职能、形象或声誉）、组织资产及其人员面临的网络安全风险。”这包括了解组织网络不同领域中发生风险事件的可能性及其造成的影响。在理解这两个量之后，组织管理层可以确定可容忍的风险水平，即风险承受能力。更多信息，请参阅“风险评估”部分。\n\
  \n## 考试题答案\n\n1.  **A、B、D**。通常，这些策略的制定涉及组织多个领域的利益相关者：企业管理层、安全管理层和网络管理员。更多信息，请参阅“安全策略与程序开发”部分。\n\
  \n2.  **B、D**。支持豁免请求的文档通常包括豁免资产的物理位置（环境、设备或应用程序）、负责豁免资产的个人或团体、豁免资产的用途，以及如何减轻与该资产相关的风险。更多信息，请参阅“豁免”部分。\n\
  \n3.  **D**。如何减轻与该资产相关的风险。更多信息，请参阅“豁免”部分。\n\n4.  **A**。NERC CIP 是一组 9 项标准和 45 项要求，旨在保护涉及大容量电力生产和分配系统运行的数字资产。特别是，CIP\
  \ 标准涉及电子安全边界、关键网络资产和人员的安全，以及实施和使用该计划的培训。更多信息，请参阅“标准”部分。\n\n5.  **A、D、E**。漏洞扫描器、端口扫描工具和嗅探工具。更多信息，请参阅“风险识别漏洞评估”部分。\n\
  \n6.  **A、B、C**。风险缓解（风险降低）是一种系统的方法，用于降低风险敞口的程度和/或其发生的可能性。有几个管理计划共同构成了有效的风险缓解计划：业务连续性计划、灾难恢复计划和事件响应计划。更多信息，请参阅“风险缓解”部分。\n\
  \n7.  **B、C**。识别关键网络和软件资产，并为每个关键资产分配货币替换价值。更多信息，请参阅“资产识别”部分。\n\n8.  **A、C**。保护层分析（LOPA）和失效模式与影响分析（FMEA）。更多信息，请参阅“ICS\
  \ 风险评估”部分。\n\n9.  **C**。ICS 环境的风险评估必须包括过程危险分析（PHA）。PHA 用于评估给定工业过程中的潜在危险。更多信息，请参阅“ICS\
  \ 风险评估”部分。\n\n10. **B**。应制定事件响应计划，以便员工在发生事件时能更成功地保护关键资产。该组织策略旨在为物理灾难、网络灾难或安全攻击发生时的“谁、什么、何时、何地”提供指导方针。更多信息，请参阅“事件响应规划”部分。\n\
  \n## 第 9 章：ICS 安全评估\n\n### 复习题答案\n\n1.  **安全评估**。安全评估涉及执行一系列练习，旨在定位组织网络和计算环境中的漏洞。更多信息，请参阅“安全评估”部分。\n\
  \n2.  **通信鲁棒性测试（CRT）**。更多信息，请参阅“通信鲁棒性测试”部分。\n\n3.  **模糊测试**是一种自动化的黑盒数据注入技术，将格式错误的数据注入软件结构，以检测软件结构、配置和实现中的故障。因此，模糊测试常用于暴露软件中可被攻击者利用的漏洞（攻击向量或模糊向量）。更多信息，请参阅“模糊测试”部分。\n\
  \n4.  应对每个 OT 网络设备执行关键性评估和分析过程，以确定其故障或功能缺失的后果。更多信息，请参阅“设备关键性”部分。\n\n5.  **侦察**。该过程始于识别所有可用于访问目标的攻击向量（路径、通道或手段）。这包括记录物理访问路径、远程访问路径以及与外部系统的接口（特别是与互联网连接的路径）。还会考虑与每个通道关联的协议的相对安全性。更多信息，请参阅“攻击面分析”部分。\n\
  \n6.  攻击面分析过程旨在明确设备或系统的哪些方面构成漏洞，以便组织了解与该特定设备或系统相关的风险。更多信息，请参阅“攻击面分析”部分。\n\n7.  ISASecure\
  \ 认证旨在提供保证，即其供应商组织已将网络安全制度化并融入其产品开发实践中。更多信息，请参阅“供应链”部分。\n\n8.  **渗透测试**。渗透测试是组织利用外部资源（或内部资源）尝试闯入网络或系统并可能发起攻击的一种方式，目的是向网络所有者提供信息，说明如何修复其网络中的不安全因素。更多信息，请参阅“ICS\
  \ 渗透测试”部分。\n\n9.  **漏洞利用代码**，即设计用于利用特定漏洞的计算机程序。这些漏洞利用代码可能被用于向目标系统投放载荷，从而授予黑客对该系统的访问权限。更多信息，请参阅“ICS\
  \ 渗透测试”部分。\n\n10. **数据包嗅探器**。使用数据包分析器，白帽黑客捕获网络中移动的数据包，记录它们，然后解码其原始数据。随后他们可以分析这些数据，实际上是在监视网络用户。更多信息，请参阅“安全测试工具”部分。\n\
  \n11. **端口扫描**。使用端口扫描工具探测网络服务器和设备的开放端口以便利用。它们还可以识别主机上运行的服务以供潜在利用。更多信息，请参阅“安全测试工具”部分。\n\
  \n\n\n\n\n## 12. Vulnerability Scanners\n\nVulnerability scanning uses a network\
  \ vulnerability scanner package to scan an organization's network to find different\
  \ types of common vulnerabilities, such as system misconfigurations and default\
  \ password usage, as well as generating malformed packets to create DoS attacks.\
  \ See the \"Security Testing Tools\" section for more details.\n\n## 13. Port Scanners\n\
  \nPort scanners are software tools designed to probe computing devices to find open\
  \ logical ports and their associated services. Attackers use these tools to locate\
  \ and exploit vulnerabilities on target devices, such as servers or endpoints. See\
  \ the \"Port Scanning\" section for more details.\n\n## 14. Network Mappers\n\n\
  See the \"Vulnerability Scanning\" section for more details.\n\n## 15. Black Box\
  \ Penetration Testing\n\nThe ultimate goal of black box penetration testing is to\
  \ attempt to simulate an attack by an outside entity on a client's infrastructure,\
  \ because unless the attacker is an insider threat, an outside entity should not\
  \ have access to details of the corporate network infrastructure and defenses. See\
  \ the \"Types of Penetration Testing\" section for more details.\n\n### Exam Question\
  \ Answers\n\n1.  **B**. The vulnerability scanning phase after the discovery phase\
  \ uses automated tools to search for security issues in the network. See the \"\
  Security Assessment\" section for more details.\n\n2.  **C**. See the \"Vulnerability\
  \ Scanning\" section for more details.\n\n3.  **A, C, D**. Failure modes involve\
  \ categorizing the ways (modes) in which a device or system could potentially fail,\
  \ effects analysis involves categorizing the consequences of these failures, and\
  \ criticality analysis involves prioritizing the handling of potential failures\
  \ based on severity and occurrence (S x O) calculations. See the \"Device Criticality\"\
  \ section for more details.\n\n4.  **A, C**. ICS device manufacturers have upgraded\
  \ their vulnerability testing procedures to include activities such as port scanning\
  \ tests, network flooding activities, vulnerability scanning, and protocol fuzzing.\
  \ See the \"Supply Chain\" section for more details.\n\n5.  **A**. There are typically\
  \ three teams: the Red Team that carries out the attack, the Blue Team that typically\
  \ acts as the victim (i.e., the network administrators), and the White Team that\
  \ oversees the testing. See the \"Penetration Testing Negotiations\" section for\
  \ more details.\n\n6.  **A**. White box penetration testing, also known as glass\
  \ box testing, is essentially the exact opposite of black box penetration testing.\
  \ The ultimate goal of white box penetration testing is to simulate a malicious\
  \ insider threat who has detailed knowledge of and access credentials to the client's\
  \ critical network infrastructure. See the \"Types of Penetration Testing\" section\
  \ for more details.\n\n7.  **A, C, D**. See the \"Security Assessment\" section\
  \ for more details.\n\n8.  **A**. By performing network enumeration operations,\
  \ you can discover various information, including discovering devices on the network\
  \ that may exist but should not. See the \"Network Enumeration/Port Scanning\" section\
  \ for more details.\n\n9.  **B, D**. Reconnaissance. In this phase, activities are\
  \ performed to find exploitable vulnerabilities in the target network structure\
  \ and configuration. This may include scanning the network hardware and software\
  \ attack surface, as well as using physical and logical social engineering methods\
  \ to identify possible attack vectors. See the \"Executing the Attack\" section\
  \ for more details.\n\n10.  **D**. In the case of port scanning combined with vulnerability\
  \ scanning, administrators should consider a follow-on attack imminent. See the\
  \ \"Port Scanning\" section for more details.\n\n## Chapter 10: ICS Security Monitoring\
  \ and Incident Response\n\n### Review Question Answers\n\n1.  **Security Baseline**.\
  \ After determining the potential impact of all identified risks, the organization's\
  \ next step is to create a security baseline that defines the level of risk they\
  \ can accept—their risk tolerance. See the \"Establishing a Security Baseline\"\
  \ section for more details.\n\n2.  **Configuration auditing** is an ongoing process\
  \ that compares detected changes in the environment against approved change requests.\
  \ See the \"Configuration Auditing\" section for more details.\n\n3.  A patch review\
  \ team (again composed of IT, cybersecurity, process engineering, production operations,\
  \ and senior management) is recommended to analyze and determine if a patch should\
  \ be applied to the ICS. See the \"Control System Patch Distribution and Installation\"\
  \ section for more details.\n\n4.  The Responsible Entity shall ensure that new\
  \ Cyber Assets within the Electronic Security Perimeter and significant changes\
  \ to existing Cyber Assets do not adversely affect existing cybersecurity controls.\
  \ For the purposes of Standard CIP-007, a significant change shall include, at a\
  \ minimum, the implementation of security patches, cumulative service packs, vendor\
  \ releases, and version upgrades of operating systems, applications, database platforms,\
  \ or other third-party software or firmware. See the \"Software Reloads and Firmware\
  \ Management\" section for more details.\n\n5.  **Monitoring** involves using systems\
  \ or tools to continuously watch devices and network objects for specific types\
  \ of activity or events. See the \"Monitoring\" section for more details.\n\n6.\
  \  **Logging** is the process of recording and storing specific events and transactions\
  \ for analysis (auditing) purposes. Virtually all computing and networking devices\
  \ in use today generate logs in some format. See the \"Logging and Auditing\" section\
  \ for more details.\n\n7.  Will the log file format remain viable for the specified\
  \ time period, and what storage media should be used? If storage requirements are\
  \ long (not just days or weeks), logs need to be archived. This may require the\
  \ administrator to determine if the log file format will likely remain viable for\
  \ the specified time period. Another consideration for long-term archiving of log\
  \ files involves the selection of storage media to be used. While there are many\
  \ different storage media options available for archiving log data, the expected\
  \ viability of the media (and its supporting hardware and software) for the required\
  \ retention period must be considered. If any format is at risk of becoming unavailable\
  \ or inaccessible, the administrator must take action to migrate the logs to another\
  \ media type. See the \"Archiving Logs\" section for more details.\n\n8.  Contact\
  \ designated members of the incident response team, document activities occurring\
  \ at the time of the incident, and keep the compromised computer powered on. When\
  \ an individual detects an anomalous event or incident occurring on the network,\
  \ they must be trained to follow the organization's security policy, which requires\
  \ them to take appropriate actions as part of incident response. An individual's\
  \ role in responding to an observed incident typically includes contacting designated\
  \ members of the incident response team, documenting activities occurring at the\
  \ time of the incident, and keeping the compromised computer powered on. See the\
  \ \"Detection and Analysis\" section for more details.\n\n9.  **Anomaly-based IDS/IPS\
  \ systems** apply statistical analysis techniques to data flows to determine if\
  \ they are \"normal\" or \"anomalous\" at any given time. See the \"Automated Intrusion\
  \ Detection Tools\" section for more details.\n\n10.  **Threshold-based anomaly\
  \ detection systems**. These IDS systems are designed to track the number of times\
  \ a specific event occurs over time, and generate an intrusion alert if the number\
  \ of events exceeds a predetermined number. See the \"Automated Intrusion Detection\
  \ Tools\" section for more details.\n\n\n\n\n\n## 11. 阻止不安全的数据传输，例如涉及知识产权或受版权保护材料的通信。更多信息，请参阅“出站监控”部分。\n\
  \n## 12. 通知相关方。当发生已识别的事件时，遏制事件的第一步应该是通知所有可能受事件影响的相关相关方。让相关方参与进来是阻止多种类型攻击蔓延的关键步骤。更多信息，请参阅“遏制、根除和恢复”部分。\n\
  \n## 13. 根因分析 (RCA)。RCA 是一种问题解决方法，用于将促成因素与根本原因区分开来。更多信息，请参阅“根因分析”部分。\n\n## 14. 因为这两类事件通常采用不同的补救方式。如果识别出入侵，采取的第一步应该是限制入侵者向网络发送流量的能力。另一方面，如果事件是基于恶意软件感染，你必须找到并缓解导致攻击的恶意软件。你还必须删除或禁用用于发起攻击的进程/协议，以及移除造成漏洞的服务/应用程序。更多信息，请参阅“根除/隔离”部分。\n\
  \n## 15. 恢复阶段。IRP 的最后部分是恢复阶段。在 IRP 过程的这一部分，将采取行动验证受事件影响的所有系统和服务是否已完全恢复到正常运行状态。在\
  \ CSIRT 确认事件已完全补救后，他们必须恢复相关方对系统的信心。更多信息，请参阅“恢复”部分。\n\n## 考试题目答案\n\n### 1. **A, B,\
  \ E**。变更管理策略应涵盖以下文档，通过将创建和维护这些项目的责任分配给特定人员或小组：所有 ICS 组件的当前、功能性的软件代码库；ICS 软件归档库；所有\
  \ ICS 控制和网络设备的当前硬件清单；当前的网络架构示意图；设备变更历史记录。更多信息，请参阅“变更管理文档”部分。\n\n### 2. **D**。决策树的根节点植根于给定\
  \ OT 设备应用补丁相关的风险降低因素。树中的第一个因素是暴露因素。根据暴露的性质——间接、直接或微小——树会从代表安全态势影响、安全影响和技术影响决策点的中心主干节点分叉出来。更多信息，请参阅“补丁决策树”部分。\n\
  \n### 3. **B, D, E**。虽然安全补丁是解决 IT 网络环境中许多软件漏洞的关键，但这是一个在 IT 产品生命周期内持续进行的循环过程。然而，SCADA/ICS\
  \ 环境无法像企业补丁流程那样频繁地关机和启动。此外，OT 设备的自动化固件管理解决方案尚未广泛普及。更多信息，请参阅“软件重装和固件管理”部分。\n\n###\
  \ 4. **A, C**。在其最新的 SP800-137《联邦信息系统和组织的信息安全持续监控 (ISCM)》中，NIST 组织将持续安全监控定义为包括漏洞监控、应用监控和威胁监控。更多信息，请参阅“安全监控”部分。\n\
  \n### 5. **C**。安全信息管理 (SIM) 系统。此 SEIM 版本通常指为提供网络日志长期存储而创建的系统。更多信息，请参阅“SIEM 系统”部分。\n\
  \n### 6. **B**。检测和分析阶段的首要功能是识别并验证报告的事件是否已发生，以及它是否为真实事件。事件报告可能来自组织内的任何地方，例如用户、不同级别的管理员、监控工具，甚至外部组织。更多信息，请参阅“检测和分析”部分。\n\
  \n### 7. **A, B, E**。CSIRT 必须接管 IRP 剩余部分的执行。这包括但不限于：对指定事件处理人提供的信息（日志分析）进行详细分析；采取措施遏制事件并限制组织的风险敞口；执行根因分析活动以识别导致事件的源头；通过确定是根除还是隔离事件的根本原因（前提是根本原因是某种形式的恶意软件）来补救事件；实施从事件影响中恢复的具体步骤；以及在必要时，根据\
  \ IR 流程结束时创建的事件响应报告中收集的信息更新 IRP。更多信息，请参阅“事件响应”部分。\n\n### 8. **A**。虽然在特定事件响应期间可能需要执行取证数据分析，但大多数\
  \ ICS CSIRT 的工作涉及计算机和网络取证活动。更具体地说，他们涉及执行取证日志分析。虽然取证日志分析是一门不断发展的科学，但 IR 分析师通常花费时间搜索日志，寻找两个要素：事件关联和入侵迹象。更多信息，请参阅“取证日志分析”部分。\n\
  \n### 9. **A, C, D**。对于给定的 IRP，每个 CSIRT 成员的角色和职责应明确识别并分配给特定人员。在任何特定组织中，CSIRT 可为以下任何团队角色指定人员：CSIRT\
  \ 团队负责人、事件处理人、IR 分诊经理、IR 取证分析师、IR 平台专家和漏洞处理人。更多信息，请参阅“创建事件响应团队”部分。\n\n### 10. **B**。在\
  \ CSIRT 确认事件已完全补救后，他们必须恢复相关方对系统的信心。更多信息，请参阅“恢复”部分。\n\n## 第 11 章：灾难恢复和业务连续性\n\n###\
  \ 复习题答案\n\n## 1. 业务连续性计划 (BCP) 是一份文档，旨在描述组织在发生任一类型破坏性事件时的准备工作、增长计划和未来规划。更多信息，请参阅“业务连续性计划”部分。\n\
  \n## 2. DRP 涉及在因事故、盗窃、蓄意破坏或自然灾害导致关键故障发生后，将组织的流程恢复到正常运行。更多信息，请参阅“灾难恢复”部分。\n\n## 3.\
  \ 部分备份常用于替代常规完整备份，以节省备份存储设备上的空间。更多信息，请参阅“备份选项”部分。\n\n## 4. 祖父-父-子法使用三组不同的备份磁带：祖父用于月度备份，父用于周度备份，子用于日度备份。更多信息，请参阅“媒体轮换”部分。\n\
  \n## 5. 确定宣布进入灾难状态时需要执行的交互和通信。例如，计划应建立何时报告以及向谁报告的标准，以及在灾难期间和之后如何交换信息，还有升级程序。更多信息，请参阅“规划”部分。\n\
  \n## 6. 任何组织的 BCP 都必须包含针对供应链中其他成员的风险分析和缓解计划。更多信息，请参阅“供应链考量”部分。\n\n## 7. 在测试 DRP\
  \ 时，灾难恢复团队必须确保其正常运行，并且所有人员都了解各自的角色。更多信息，请参阅“测试 DRP”部分。\n\n\n\n\n\n## 8. 冗余\n冗余是指投入额外硬件以维护系统和网络资源的做法。更多信息，请参阅“系统冗余”部分。\n\
  \n## 9. 备用站点\n建立备用站点使组织能够在重大灾难期间及整个恢复期内临时维持运营。更多信息，请参阅“备用站点”部分。\n\n## 10. 故障点\n\
  故障点是指网络中任意一个元素，一旦它发生故障，关键进程就会关闭。更多信息，请参阅“系统冗余”部分。\n\n## 11. 温站点与热站点\n与热站点不同，温站点可能配备老旧设备，且极有可能在真正的灾难发生前一直处于无人值守状态。温站点也可能将备份数据存储在安全的保险库或保险柜中，但在灾难发生后，需要更多时间才能让关键操作恢复运行。更多信息，请参阅“备用站点”部分。\n\
  \n## 12. 网络附属存储 (NAS)\n网络附属存储 (NAS) 是一种虚拟化存储系统，同时提供存储空间和文件系统结构。更多信息，请参阅“本地虚拟化存储”部分。\n\
  \n## 13. 保护备份介质\n备份介质应存放在带有锁门的房间内。还应有签到/签出表或访问控制设备，以追踪进出房间的人员。备份数据还应以加密格式存储，这样即使被盗或被未授权人员访问，也能保持安全。更多信息，请参阅“保护备份介质”部分。\n\
  \n## 14. 云存储的缺点\n使用基于云或其他与互联网相关的应用程序的一个缺点是，用户依赖于云服务提供商的安全能力。就公共事业而言，这历来是一个主要关注点。更多信息，请参阅“云存储”部分。\n\
  \n## 15. 恢复时间目标 (RTO)\n恢复时间目标 (RTO) 表示灾难发生后，为恢复处理操作或资源所分配的时间。更多信息，请参阅“规划”部分。\n\n\
  ## 考试题目答案\n\n## 1. 灾难恢复流程\n**D**。尽管预防措施始终是应对潜在灾难的首选工具，但它们无法保证永远不需要系统恢复。因此，灾难恢复流程的设计应旨在在因意外、盗窃、蓄意破坏或自然灾害导致关键故障时，恢复组织网络的全部或部分。更多信息，请参阅“简介”部分。\n\
  \n## 2. 灾难恢复演练频率\n**B**。灾难恢复演练应是一年一度的计划活动。如果没有经验，就无法充分理解实施 DRP 涉及的困难。演练灾难恢复系统将强化及时且持续执行备份的重要性，以确保数据恢复始终可行。更多信息，请参阅“测试\
  \ DRP”部分。\n\n## 3. DRP 支持文档\n**A, C**。通常与 DRP 捆绑在一起的支持文档包括：灾难恢复团队所有人员的联系信息，以及关键软件和硬件驱动程序的副本。更多信息，请参阅“记录灾难恢复计划”部分。\n\
  \n## 4. 存储区域网络 (SAN)\n**C**。存储区域网络 (SAN)。SAN 提供的存储系统在磁盘和卷管理工具中显示为单个磁盘。更多信息，请参阅“本地虚拟化存储”部分。\n\
  \n## 5. 备份介质测试频率\n**A**。备份介质和技术至少应每月测试一次，对于更关键的网络段，测试频率可高达每周一次。更多信息，请参阅“测试 DRP”部分。\n\
  \n## 6. CIP-009-6 标准要求\n**D**。根据 CIP-009-6 标准，组织必须开展活动以模拟会激活恢复计划的实际事件。这些演练可以是纸面推演，也可以是全面操作演练，且必须至少每年进行一次。更多信息，请参阅“NERC\
  \ CIP-009-6”部分。\n\n## 7. RAID 容错\n**B, D**。RAID 1 和 RAID 5 解决方案确实提供容错能力。更多信息，请参阅“高可用性/容错系统”部分。\n\
  \n## 8. 祖父-父亲-儿子备份轮换\n**C**。儿子使用四个介质，每个工作日一个，通常覆盖周一至周四，典型地应用增量备份方法。父亲的每周备份，通常在周五执行，使用一个介质，应用差异备份方法。此后，相应的儿子介质将被重用于接下来的每日备份。月末时，使用一块存储介质运行祖父备份。这将是系统的一次完整备份。更多信息，请参阅“备份介质轮换”部分。\n\
  \n## 9. 热站点激活时间\n**D**。如果无人值守，热站点通常可在人员抵达备用站点后几分钟内投入运行。更多信息，请参阅“备用站点”部分。\n\n## 10.\
  \ 备用站点设施目的\n**E**。BCP 中考虑的各种备用站点设施选项的主要目的，是在发生灾难时提供安全数据的恢复和组织持续的功能性运营。更多信息，请参阅“备用站点”部分。\n\
