  \n15. 说出存储视频监控信息（尤其是在大型企业中）的两个主要顾虑。\n\n## 考试题\n\n1.  保护此空间涉及控制谁可以跨越标记周界的物理或逻辑线（如地界线或建筑物/建筑群的外墙）移动（步行、驾车、飞行）。\n\
  \n    1.  内部空间\n    2.  内部周界\n    3.  外部周界\n    4.  主要区域\n\n2.  以下哪项不是基础设施安全管理涉及的子系统？\n\
  \n    1.  访问控制和监控系统\n    2.  入侵检测和报告系统\n    3.  视频监控系统\n    4.  企业网络安全策略\n\n\n\n\
  3. 从以下选项中，选择代表物理屏障的条目。（选择所有适用项。）\n\n    1. 一扇锁着的门\n    2. 一名接待员\n    3. 一个 RFID\
  \ 徽章读取器\n    4. 一个监控摄像头\n\n4. 哪种类型的监控摄像头可以在世界几乎任何地方查看？\n\n    1. 数码相机\n    2. 数字\
  \ IP 摄像头\n    3. 模拟摄像头\n    4. 混合摄像头\n\n5. 从以下报告类型中，选择会导致对个人错误拒绝的选项，从而将本应有权进入的个人锁在设施或安全区域之外。（选择所有适用项。）\n\
  \n    1. 错误拒绝\n    2. 错误接受\n    3. 假阴性故障\n    4. 假阳性故障\n\n6. 能够控制资产的入口、出口和再入口取决于\
  \ _______________。\n\n    1. 认证\n    2. 权限\n    3. 内在特征\n    4. 授权\n\n7. 监控摄像头中使用的哪种镜头类型使操作员能够查看整个房间，但会伴随一定的图像畸变？\n\
  \n    1. 鱼眼镜头\n    2. 长焦镜头\n    3. 定焦镜头\n    4. 变焦镜头\n\n8. 照度等级（lux rating）在监控摄像头中的含义是什么？\n\
  \n    1. 摄像头镜头尺寸的额定值\n    2. 每平方米获得可接受图像所需的光照量\n    3. 摄像头镜头的分辨率\n    4. 指定摄像头的色彩分辨率\n\
  \n9. 以下哪些视频存储策略采用网络技术将基于 IP 的视频存储在远程计算机或视频服务器上？（选择所有适用项。）\n\n    1. 互联网区域存储 (IAS)\n\
  \    2. 网络附属存储 (NAS)\n    3. 存储区域网络 (SAN)\n    4. 网络外设存储 (NPS)\n    5. 直接附属存储 (DAS)\n\
  \n10. 以下哪些标准旨在帮助北美大型电力系统 (BES) 运营商保护其物理和网络资产？\n\n     1. NERC CIP\n     2. ISO/IEC\
  \ 7816-4:2020\n     3. ISO/IEC 1443\n     4. NIST 800 R2\n\n# 第 7 章\n\n访问管理\n\n\
  ## 简介\n\n在上一章中，您了解了与物理安全管理相关的术语和实践。在本章中，讨论将转向与 IT 和 OT 网络相关的逻辑访问控制模型和实践。\n\n这些策略的设计应反映与经典信息安全模型相关的三个目标：`机密性`、`完整性`\
  \ 和 `可用性` (`CIA`)。然而，请回顾 第 5 章 \"ICS 网络安全要点\" 中的内容，在 OT 环境中，`AIC` 方法通常比 IT 网络环境中使用的传统\
  \ CIA 努力更为重要。\n\n任何网络的“执法者”都是 `网络管理员`。在网络环境中，这些人负责在网络设备上实施组织的安全策略。在大型组织中，通常会创建专门的管理角色来处理网络运营的不同方面。这可能包括设立单独的服务器管理员和网络管理员。`服务器管理员`\
  \ 或 `系统管理员` (`sysadmin`) 负责组织安全策略及服务器计算机的设计、实施和维护，而网络管理员则为网络及其介质和连接设备提供相同的职能。\n\n\
  管理职责的划分还可能涉及专门的安全管理员，其负责为网络中的服务器、主机和连接设备执行信息安全任务。在这些环境中，管理职责的分离应尽可能清晰、明确且受控。\n\n\
  通常，这些管理员中的一位负责确定谁获得网络服务器、网络连接设备和数据的操作访问权。在大多数组织中，他们通过网络操作系统管理工具实施组织的策略声明，这些工具控制“谁”有权访问网络及其资源，以及他们可以对这些资源做什么。在\
  \ 第 4 章 \"ICS 模块与要素加固\" 中，您了解了三种传统访问控制模型。这些传统模型已通过此处描述的额外访问控制模型得到增强：\n\n*   `强制访问控制\
  \ (MAC)`：系统建立哪些用户或组可以访问文件、文件夹和其他资源。\n*   `自主访问控制 (DAC)`：这包括用户有自由裁量权决定谁可以访问其对象以及访问程度的配置。\n\
  *   `非自主、基于角色的访问控制 (RBAC)`：这基于每个用户在组织中的工作角色。\n*   `基于规则的访问控制 (RB-RBAC)`：与 RBAC 类似，RB-RBAC\
  \ 首先基于工作角色，但随后通过规则集进一步限制以修改角色内的访问权限。\n*   `基于属性的访问控制 (ABAC)`：这包括基于策略的身份和访问控制管理，通过组合属性来授予或拒绝访问。该概念在\
  \ NIST 网络安全框架中引入，并与主体、操作、客体和上下文属性相关联，这些属性在 if-then-and 布尔语句中组合使用。\n*   `基于上下文的访问控制\
  \ (CBAC)`：这是一种防火墙中的访问控制模型，用于维护 TCP/UDP 网络流量以进行更深层的数据包有效载荷检查。\n\n## 访问控制模型\n\n`访问控制`\
  \ 本质上是一种策略，用于识别从事特定工作的人员，通过某种识别系统对其进行认证，然后仅授予他们访问所需资产所需的“钥匙”，而不授予更多权限。在上一章中，您了解了访问控制在物理基础设施环境中是如何提供的。\n\
  \n在 IT 环境中，这始于为用户提供用户名和密码，以便进入完成工作所需的计算设备、文件、文件夹和网络连接。然后，必须配置他们对每个资产的访问级别，以确保他们拥有完成工作所需资源的适当权限级别。Bob\
  \ 是否需要创建（完全控制）原始文档的能力，还是仅负责编辑它们（写入），抑或只是审阅它们（读取）？为了实现这一点，管理员必须确定每个组或个人执行职责所需的权限级别。这就是访问控制模型发挥作用的地方。\n\
  \n### 强制访问控制\n\n回顾 第 4 章，`MAC` 策略为网络对象分配敏感度标签，并根据用户的权限级别授予访问权，如 图 7.1 所示。在此模型下，只有所有者（和指定的保管人，即管理员）被授予访问控制的管理权。这意味着最终用户无法控制任何提供特权给任何人的设置。\n\
  \nMAC 安全模型实际上有两个版本——一个侧重于 `数据机密性` (Bell-LaPadula)，另一个侧重于 `数据完整性` (Biba)。`Bell-LaPadula`\
  \ 版本规定，处于特定安全级别（例如绝密）的用户可以在该级别写入，但不能在较低级别写入。然而，他们可以在较低安全级别读取（上写/下读）。`Biba` 版本允许较低安全级别的用户读取较高级别，而较高安全级别的用户可以为较低安全级别写入（上读/下写）。\n\
  \n![图 7.1 强制访问控制](img/c07f001.png)\n\n**图 7.1** 强制访问控制\n\n\n\n\n## 访问控制模型\n\nBiba\
  \ 通常用于企业网络，管理层可在其中编写信息供员工阅读。Bell-LaPadula 更常见于政府/军事网络，其中的安全许可级别决定了任何用户有权访问哪些类型的信息。如果你没有某资产的适当许可，则无需知晓其存在。\n\
  \n### 自主访问控制\n\n`DAC 模型`是限制最少的访问控制模型，因为它赋予单个用户对其拥有的资产以及任何相关资产的完全控制权。这在 `DAC 模型`中造成了两大弱点。\n\
  \n1.  首先，所有者被赋予了为其他用户设置安全级别的能力，这可能导致他们拥有超出应有范围的特权。\n2.  其次，用户拥有的权限将通过继承扩展到其他资产。这使用户在不知情的情况下执行恶意软件。此类恶意软件可能会利用用户的扩展特权访问系统中更高层级的数据。\n\
  \n### 基于角色的访问控制\n\n`RBAC 模型`根据用户在组织中的职位提供访问控制。每个网络用户或组被分配一个或多个角色，如 图 7.2 所述。\n\n\
  然后为每个角色分配对特定对象的特定特权。\n\n在大多数情况下，`RBAC 模型`使网络管理员更容易管理中型或大型网络中的多个用户。然而，当引入具有特殊工作职责（超出群组范围）的用户进入网络时，必须采取特殊措施为他们提供额外的访问需求。\n\
  \n![图 7.2 基于角色的访问控制](img/c07f002.png)\n\n**图 7.2** 基于角色的访问控制\n\n### 基于规则的访问控制\n\n\
  在 `基于规则的访问控制` 模型下，网络管理员像前面描述的基于角色的方法一样定义用户角色，然后为这些定义实施规则标准，例如时间限制，以防止用户在工作时间之外访问数据。\n\
  \n在每种策略类型中，在通过权利和权限分配为用户提供对象访问权限时，都应实施最小权限原则。根据最小权限规则，每个用户仅被授予执行其工作角色所需的访问级别。始终如一地应用此原则，将安全漏洞造成的损害限制在初始任务、进程或用户范围内。\n\
  \n### 基于属性的访问控制\n\n与前面列出的四种传统基于用户的访问控制模型相比，`基于属性的访问控制` (`ABAC`) 被认为是一种新一代的 AC 模型，基于源自策略语句的复杂布尔规则集。该模型操纵三类组件来确定对资源的访问或拒绝。\n\
  \n*   `架构`：`ABAC` 应用于三点架构中的应用和数据：策略执行点 (`PEP`)、策略决策点 (`PDP`) 和策略信息点 (`PIP`)。\n*\
  \   `属性`：属性描述 `主体`（尝试访问资源的用户）、`操作`（正在尝试的活动）、`客体`（被访问的资源）和环境（可能涉及时间、位置、IP 地址或其他控制因素的上下文）。\n\
  *   `策略`：这些是结合在一起以确定是授予还是拒绝访问的场景和技术语句。\n\n当请求访问资源时，`PEP` 检查请求并向 `PDP` 部分发送授权请求。`PDP`\
  \ 将请求与其策略语句进行比较，并咨询 `PIP` 以获取外部数据链接，然后发出许可/拒绝决定。图 7.3 描述了 `ABAC` 过程。\n\n![图 7.3\
  \ 基于属性的访问控制](img/c07f003.png)\n\n**图 7.3** 基于属性的访问控制\n\n### 基于上下文的访问控制\n\n`基于上下文的访问控制`\
  \ (`CBAC`) 是防火墙中使用的一种智能深度包过滤功能，允许指定的 TCP/UDP 流量通过防火墙。它利用从应用层协议获得的有状态检查信息在防火墙的 `ACL`\
  \ 中打开端口。这增强了 `ACL` 的作用，后者仅提供高达传输层的访问控制。\n\n`CBAC` 在防火墙内存中维护一个状态表。当受信网络内的设备发起会话时，会在状态表中放置一个动态条目，并允许流量通过防火墙并流出网络。`CBAC`\
  \ 机制在防火墙的 `ACL` 中为请求的会话打开一个临时漏洞，以允许出站流量的 `回复` 通过并进入受信网络。`CBAC` 仅允许由受信网络内部设备发起的外部流量进入网络。\n\
  \n## 访问控制中的关键安全组件\n\n在前面描述的 AC 模型中，逻辑访问控制主要在服务器级别实现，并基于四个关键安全组件：\n\n*   `密码`：密码是现存最基本的逻辑访问控制机制。密码的使用和要求之前已在\
  \ 第 4 章 中介绍，因此此处不再赘述。\n*   `组策略`：这些是目录服务数据库对象，管理员使用它们根据用户在组织中的职位和工作角色创建对网络资产的组访问和限制。这些对象使管理员能够从单一管理环境跨网络实施这些策略。\n\
  *   `访问控制列表 (ACLs)`：`ACLs` 是将权限附加到网络对象的列表，系统使用它们来控制对资产（程序、文件夹、文件、打印机）的访问，以及可以在这些资产上执行的活动。\n\
  *   `用户账户限制`：账户限制是添加到模型中的最后一个访问控制组件。这些是管理员应用于用户账户（而非文件夹、文件和打印机）的配置，旨在限制其在本地计算机（本地账户）或整个网络（域账户）上的活动。\n\
  \n## 目录服务\n\n管理员依赖的用于跨网络管理访问控制的工具之一，是运行在网络服务器操作系统上的目录服务结构。`目录服务` 是分布式、可定制的信息存储结构，提供了一个单一节点，用户可从中搜索和定位分散在整个网络中的资源。\n\
  \n这些结构还为网络管理员提供了一个管理网络对象和资源的单一管理点。这些资源通常包括关于用户（姓名、电子邮件地址等）和系统（主机、文件共享、打印机等）的信息。它们是任何中大型企业网络的必需品。因此，企业级目录服务通常为网络提供几项关键功能：\n\
  \n*   可跨多个地理位置分布的信息存储\n*   用户可用来高效搜索分布在整个网络中的信息的信息存储\n*   可从多种不同操作系统访问的信息存储\n* \
  \  随网络发展可接受新对象的信息存储\n\n最知名的目录服务结构莫过于互联网基于的 `域名系统` (`DNS`)。企业网络级目录服务首次亮相于 Novel Netware\
  \ 操作系统，称为 `Novel Directory Service` (`NDS`)。该结构后来从 Novell 购买并重新品牌为 `NetIQ` eDirectory。\n\
  \n\n\n\n\n## 企业网络中的目录服务\n\n您在当前企业网络中可能遇到的目录服务均基于 `Lightweight Directory Access Protocol`\
  \ (`LDAP`)，也称为 `X.500-lite standard`。该协议提供了一种与供应商无关的协议，用于通过 IP 网络创建和访问控制分布式网络目录服务。已有许多不同的\
  \ DS 软件产品基于 LDAP 协议开发。以下章节将讨论用于 Microsoft Windows 和 Linux 网络环境的目录服务。\n\n### Active\
  \ Directory\n\nMicrosoft Windows 网络架构的核心特性是 `Active Directory` (`AD`) 结构。Active\
  \ Directory 是一个用户和资源信息的分布式数据库，用于描述网络的构成（即用户和应用程序设置）。它也是实现分布式身份验证过程的一种方法。\n\nWindows\
  \ 仍然是一个依赖域的操作系统。它将域用作管理、安全和复制目的的边界。每个域必须至少由一个域控制器来代表。域控制器是一台设置为保存网络目录数据库的服务器。\n\n\
  此数据库包含有关用户账户、组账户和计算机账户的信息。它跟踪域内所有对象的名称和资源请求。您可能还会发现此数据库被称为 `Security Accounts Manager`\
  \ (`SAM`)。此功能有助于在 Windows 客户端网络中集中管理系统和用户配置，以及服务器上的数据备份。\n\nActive Directory 结构采用了两种常见的\
  \ Internet 标准——LDAP 和 DNS。LDAP 协议用于定义目录信息如何被访问和交换。DNS 是将域名解析为实际 IP 地址的 Internet\
  \ 标准。它也是与客户端和其他目录交换目录信息的标准。\n\nActive Directory 以层次结构排列域，并在树状结构中建立所有域之间的信任关系，如 图\
  \ 7.4 所示。\n\n![FIGURE 7.4 Basic Active Directory structure](img/c07f004.png)\n\n\
  **图 7.4** 基本 Active Directory 结构\n\n`树` 是共享相同 DNS 名称的对象集合。Active Directory 可以将域细分为包含其他单元或\
  \ `叶对象`（如打印机、用户等）的 `组织单位`（销售部、管理部等）。\n\n相反，Windows 可以创建包含多个树的组织结构。这种结构称为 `林`。图 7.5\
  \ 扩展了 AD 结构以演示这些关系。\n\n![FIGURE 7.5 Active Directory relationships](img/c07f005.png)\n\
  \n**图 7.5** Active Directory 关系\n\nWindows 操作系统通过双向信任自动将树内的所有域连接起来。`信任` 是允许用户在域之间移动并执行规定操作类型的关系。\n\
  \n如果在示例中销售域与市场域之间建立了信任关系，且销售域与管理域之间存在类似的信任，则市场域与管理域之间也存在信任关系。信任使管理员能够为用户和组提供对对象的不同权限。\n\
  \n`权限` 是控制用户（或用户组）访问对象和执行操作（如读取或写入文件）权威的权限设置。管理权限提供对用户的权威，直至组织单位 (OU) 级别。OU 是容纳网络域内所有对象的容器。这些单位可通过容纳其他\
  \ OU 来为域提供层次结构。\n\n管理权限不跨越域级别建立的边界，但可以被同一树中具有从属位置的其他 OU 继承。另一方面，用户权限必须为单个用户或组成员建立。使用组可以通过单个管理操作将通用权限分配给多个用户（这与为每个人单独设置和维护权限形成对比，例如为\
  \ 150 人的会计人员设置权限）。\n\n处理 Active Directory 的主要工具是 `Active Directory Users and Computers`\
  \ 控制台，如 图 7.6 所示。域的组织单位包含用户、组和资源。Active Directory Manager 工具用于向目录中添加用户、组和组织单位。\n\
  \n![FIGURE 7.6 Active Directory Users and Computers](img/c07f006.png)\n\n**图 7.6**\
  \ Active Directory Users and Computers\n\nWindows 环境的整体运行由 `系统策略` 管辖。基本上，策略赋予管理员对用户的控制权。使用系统策略，系统管理员可以授予或限制用户对本地资源（如驱动器和网络连接）的访问。\n\
  \n管理员可以建立策略，强制特定用户在指定时间登录，并在其他所有时间将其锁定在系统之外。系统策略还使管理员能够发送更新并为网络客户端配置桌面。从根本上说，控制面板中找到的任何项目都可以通过系统策略进行管控。\n\
  \n通过组策略，管理员可以为整个企业的用户制定大量详细设置，而无需手动建立每一项设置。GPO 可用于通过 AD 向计算机和用户应用大量更改。\n\n### Linux\
  \ 目录服务\n\n较旧的 Linux 发行版支持一种称为 `Network Information Services` (`NIS`) 的目录服务结构。然而，较新的发行版已转向基于\
  \ LDAP 的目录服务。这些包括 Red Hat 的 389 Directory Server、Apache Directory Server 和 OpenLDAP，以及一系列鲜为人知或专有的目录服务器平台。\n\
  \n与 Active Directory 一样，基于 LDAP 的 Linux 平台为系统信息查找和身份验证提供单一目录源。将用户信息存储在基于 LDAP 的目录服务器中，使网络具有可扩展性、可管理性和安全性。\n\
  \n与 Microsoft 的 AD 不同，目录服务不是 Linux 操作系统结构的组成部分。相反，它们是在操作系统安装后添加到结构中的。然而，安装后，基于 Linux\
  \ 的目录服务模块采用基于 GUI 和菜单驱动的工具（如 图 7.7 所示）来定义网络的组织单位。\n\n![FIGURE 7.7 Linux directory\
  \ service menu](img/c07f007.png)\n\n**图 7.7** Linux 目录服务菜单\n\n通常，这些目录服务服务器提供基于网络的注册表，使管理员能够集中存储用户身份和应用程序信息，例如：\n\
  \n*   应用程序设置\n*   用户配置文件\n*   组权限\n*   策略\n*   访问控制数据\n\n通过在目录结构中存储和检索此类信息，用户和应用程序变得与位置无关。用户能够登录到网络中的任何位置，并访问其在指定位置或网络中任何其他位置所拥有的相同应用程序和数据。\n\
  \n## 应用程序运行时与执行控制\n\n软件应用程序变得日益复杂、分布式和互联。向云计算、容器化和混合架构解决方案的转变增加了这些应用程序的攻击面。随着这些变革重新定义了我们\
  \ IT/OT 网络架构模型中的边缘和边界术语，提供额外安全性的压力也随之增加。\n\n\n\n\n\n## 运行时攻击\n\n运行时攻击是基于内存的攻击，利用应用程序在运行时内存中执行的代码。攻击者利用应用程序代码与数据之间缺乏边界的特性，将恶意代码注入内存结构。这类攻击传统上极难检测和防御。\n\
  \n大多数当前的边界安全工具（如防火墙和 IPS）远离应用程序在内存中的运行时环境。这些设备无法知晓应用程序的运行时条件，因此无法区分真实威胁和潜在威胁。同样，漏洞扫描器也跟不上云容器快速启动和关闭的节奏，因此无法区分暴露在外部的漏洞和受边缘保护设备保护的漏洞。\n\
  \n然而，较新的**运行时应用自我保护 (RASP)** 工具已被开发出来，通过监控应用程序运行时环境的输入以发现潜在的意外更改或篡改，从而提高应用程序安全性。当检测到这些活动时，受\
  \ RASP 保护的应用程序会采取行动予以阻止，并通知用户或安全人员。其他可能的操作包括关闭应用程序或终止会话。\n\n## 应用程序执行控制\n\n**应用程序执行控制**\
  \ 是一种网络安全缓解策略，旨在防止恶意代码在计算系统上执行。该策略始于识别环境中所有机器上获准运行的应用程序。应用程序识别完成后，下一步是创建规则，确保仅允许这些应用程序在机器上运行。最后，实施加密哈希规则、发布者证书规则和路径规则，以强制执行应用程序执行控制。必须配置文件夹、文件和应用程序权限，以阻止所有未经授权的修改。\n\
  \n应用程序控制策略应包含记录被阻止的恶意代码执行尝试的条款。这些事件日志应配置为提供所有被阻止尝试的文件名、日期/时间戳和用户名。这些信息对于识别尝试攻击的个人或组织非常有价值。\n\
  \n这些规则应作为组织变更管理策略的一部分进行维护，并且应至少每年进行一次审查和验证。\n\n## 用户访问管理\n\n网络中基本上有两类用户——`administrators`（管理员）和\
  \ `users`（用户）。这些类别也可能存在于两个不同层级——位于单个客户端设备上的本地账户数据库和位于网络服务器上的网络账户数据库。请回顾一下，网络账户设置通常优先于本地设置。\n\
  \n在 Microsoft Windows 环境中，安装后会有几个 `default user accounts`（默认用户账户）。这些账户包括以下内容：\n\n\
  *   **Administrator**（管理员）：这是主要的管理账户，拥有对系统及其所有管理工具的完全访问权限。\n*   **Guest account**（来宾账户）：这是一个统称账户，用于为没有计算机用户账户的用户提供访问权限。建立用户账户后，应禁用此账户。\n\
  *   **HelpAssistant**：这是一个特殊的 Windows 账户，配合其远程协助实用程序使用，用于验证通过它连接的用户。每当创建远程协助邀请时，此账户即被启用，当所有邀请过期后，会自动禁用。\n\
  *   **SUPPORT_XXXXX**：这是一个特殊的 Microsoft 账户，用于通过其帮助和支持服务实用程序提供远程支持。\n*   **DefaultAccount**（默认账户）：在\
  \ Windows 10 后期版本和 Windows Server 2016 中，引入了一个新的系统管理账户，称为默认系统管理账户 (DSMA) 或 DefaultAccount。\n\
  \n这些默认用户账户可以重命名，但无法删除。初始 Windows 管理员账户的密码在安装过程中设置。\n\n与基于 Microsoft 的网络环境类似，Linux\
  \ 系统采用“用户和组”结构来控制对本地和网络资源（文件、目录和外围设备）的访问。每个获准访问 Linux 系统的人员都必须被分配一个用户名。除 `root superuser`（root\
  \ 超级用户）外，用户名由管理员根据需要创建。\n\n通过 `useradd` 命令行工具将用户添加到 Linux 系统，而现有用户账户信息可通过 `usermod`\
  \ 命令进行修改。结合 `useradd` 创建的用户名使用 `passwd` 命令（`passwd username`），可为以新用户身份访问系统建立密码要求。\n\
  \n给定网络可能采用单一管理员，其对系统的所有方面（包括服务器、网络介质和连接设备）拥有全面控制权。然而，较大的网络通常有多个管理员，他们分担特定的网络职责，如服务器管理员、网络管理员和安全管理员。在这些情况下，最佳实践是仅保留必要数量的管理员账户，并将这些账户配置为仅拥有执行其职能所需的权限。\n\
  \n对于可以访问计算机服务的网络用户，安全性始终与功能性相平衡。某些网络环境可能拥有授权用户名单（员工或代理），但仍需容纳公众（未授权用户或客户）。在这些情况下，必须设置认证方法以同时适应这两类用户。通常这涉及为不同类别的用户建立不同的组账户，然后严格地为每个组提供所需的资源。\n\
  \n### 建立用户和组账户\n\n企业和工业网络中的管理员为网络成员创建用户和组账户，其中包含对网络及其资源的特定 `access rights`（访问权限）和\
  \ `permissions`（权限）。根据为网络用户建立的访问控制策略（无论是针对个人还是其所在的不同网络 `groups`（组）），允许或拒绝用户读取、修改和检查文件和文件夹的访问权限。\n\
  \n认证可通过基于包含在已启用组中的继承过程应用于特定个人。例如，由于包含在公司的 `accounting group`（会计组）中，会计部门的所有成员可能会获得对会计程序和文件的\
  \ `inherited access`（继承访问权限）。\n\n管理员使用 `group accounts`（组账户）来统一处理具有共同需求的用户账户。这样做可节省时间，允许他们一次性向组内所有人授予用户权限和资源访问权限。然而，即使授予用户访问特定资源的权限，管理员也可以限制用户对不同文件和文件夹可执行的活动范围。\n\
  \n#### Windows Active Directory 默认安全组账户\n\nWindows Server 版本提供了大量默认组来管理各种用户类型。Windows\
  \ Server 2019 提供了 45 多个默认 `Active Directory (AD) groups`（Active Directory 组）供使用。从\
  \ 2008 版至今的 Windows Server 版本的 Active Directory 安全组完整列表可在 `https://docs.microsoft.com/en-us/windows/security/identity-protection/access-control/active-directory-security-groups`\
  \ 找到。Windows Server 系统中的一些关键默认组账户包括以下内容：\n\n*   **Administrators**（管理员）：此组成员拥有对计算机及其工具的完全访问权限，可执行所有管理功能。此组自动包含\
  \ Administrator 用户账户作为成员。\n\n\n\n\n\n## Windows 内置组\n\n*   **Guests（来宾）**：此默认组对系统的访问权限最小化，且所有成员共享同一用户配置文件。Guest\
  \ 用户账户自动成为该组的成员。\n*   **Power Users（高级用户）**：Power Users 是一个特殊组，拥有在系统上执行许多管理任务的权限，但不具备\
  \ Administrator（管理员）账户的完全管理特权。Power Users 可以创建和管理用户及组。此外，除非通过其他来源被授予权限，否则他们无法访问\
  \ NTFS 卷上的文件和文件夹。创建该组时没有任何成员。\n*   **Backup Operators（备份操作员）**：顾名思义，该组成员可以备份和还原计算机上的所有文件。通过备份实用程序，该组成员拥有对系统整个文件系统的访问权限。创建该组时没有任何成员。\n\
  *   **Network Configuration Operators（网络配置操作员）**：该组成员可以管理系统网络配置的不同方面。具体而言，他们可以修改\
  \ TCP/IP 属性；启用、禁用和重命名连接；并执行 `ipconfig` 操作。创建该组时为空。\n*   **Users（用户）**：这是一个包罗万象的组，拥有有限的默认权限。除\
  \ Guest 账户外，系统上创建的所有用户账户（包括 administrator 账户）默认均为此组成员。\n*   **Remote Desktop Users（远程桌面用户）**：此\
  \ Windows 组的成员拥有远程登录系统以执行远程桌面活动的用户权利。该组默认没有成员。\n\n### Windows 域账户\n\nWindows 服务器系统在*域环境*中使用时，也支持*域用户和组账户*。在域环境中，网络的所有成员共享一个通用的目录数据库，并被组织到不同层级。域由唯一名称标识，并作为一个具有通用规则和程序的单一单元进行管理。\n\
  \n域账户通过 Windows *域控制器*上的“Active Directory 用户和计算机”实用程序创建，并存储在 *Active Directory 数据库*\
  \ 中。当 Windows 客户端设备被置于域环境中时，某些组成员身份会自动更改以反映这一变化。\n\n*   **Domain Admins（域管理员）**：此组被添加到本地\
  \ Administrators 组，以便域管理员对其域内的所有计算机拥有管理控制权。\n*   **Domain Users group（域用户组）**：此组被添加到本地\
  \ Users 组。\n*   **Domain Guests group（域来宾组）**：此组被添加到本地 Guests 组。\n\n这些组均为 Windows\
  \ 域控制器的功能，仅存在于 Windows 域环境中。在域环境中自动添加这些组，使得域管理员更易于配置对本地计算机资源的访问。这些组并非永久添加，管理员可酌情将其移除。\n\
  \n### Linux 组账户\n\n与其他多用户操作系统一样，出于管理目的，单个 Linux 用户通常被设为组的成员。由于组内存在的关系，用户生成的文件归该组成员所有。\n\
  \n与 Windows 不同，安装后存在的默认组列表因不同的 Linux 发行版而异。大多数发行版中常见的 Linux 组包括以下内容：\n\n*   **games**：此组提供对游戏软件的访问权限。\n\
  *   **users**：这是标准的默认 Linux 用户组。\n*   **wheel**：一个管理组，通常提供对用户创建和配置实用程序（`su` 和 `sudo`\
  \ 命令）的访问权限。\n*   **daemon**：这是一个标准的默认用户/组，拥有执行守护程序（后台进程）的特权，这些程序无需用户指导即可运行。在 Microsoft\
  \ 体系中，此类程序被称为“驻留程序”，最类似于 Windows 环境中运行的服务。\n*   **bin**：这是一个标准的默认 Linux 组，历史上提供运行可执行文件的权限。`bin`\
  \ 的引用基于存储在那里的二进制（可执行）文件类型。该文件夹包含可执行以执行任务的脚本和命令。该目录中的命令可由每个用户运行。\n*   **mail**：此组拥有特殊的邮件特权。\n\
  *   **root**：root 管理员组是一个标准的默认 Linux 组，拥有对系统的完全管理控制权。\n*   **nobody**：这是非特权组。\n\
  *   **disk**：此组提供对“块设备”（如磁盘驱动器和光驱）的访问权限。\n\n此列表仅显示了可能安装在特定 Linux 系统中或添加到其中的常见组中的一部分。Linux\
  \ 中添加组的工具是 `groupadd`。组信息通过 `groupmod` 命令修改，用户通过 `usermod` 命令添加到组中。\n\n## 组账户安全\n\
  \n在处理组账户时，有几个安全相关的操作需要牢记。\n\n*   **删除或禁用未使用的默认账户**，例如 Guest 账户。如果置之不理，攻击者可能利用这些账户进行攻击。如果必须保留默认账户，请更改其名称，因为其标准身份验证凭据为潜在攻击者所熟知。此外，严格限制这些账户的访问权限、权利和权限。\n\
  *   **创建用户组**，涵盖具有共同需求的不同类型用户相关的功能，然后根据组的功能需求为每个组分配权利和权限。\n*   **创建用户账户**，并根据其在组织中的工作职能将其分配到组。采用此方法可防止管理员必须单独配置每个用户的账户设置。仅创建所需账户，因为如果被发现，未使用的账户可能造成安全漏洞。\n\
  *   **设置账户密码**，使其在组织的密码策略下工作。\n*   **安装并配置任何额外的身份验证系统**，例如选定用于网络的生物识别扫描设备或其他多因素身份验证应用程序。\n\
  \n## 网络身份验证选项\n\n在网络层面，`username` 和 `password` 系统仍然是使用中的第一道 `authentication options`（身份验证选项）防线。即使您可能是一个或多个组账户的成员，也无法使用这些账户之一登录网络。您只能通过使用合法的用户账户登录来获得系统访问权限。在客户端-服务器网络中，经过身份验证的用户列表存储在服务器上，而非本地计算机。\n\
  \n此外，在网络层面，网络登录通常会覆盖任何本地系统登录。因此，管理员通过密码策略声明控制谁可以登录网络的任何部分。他们还设置网络密码策略，规定用户必须多久更改一次密码，以及设置长度和复杂性要求。\n\
  \n这些选项（如图 7.8 所示）使管理员能够使用户账户和密码更安全。密码策略适用于登录系统的所有用户，无法为单个用户单独配置。\n\n![图 7.8 密码策略](img/c07f008.png)\n\
  \n**图 7.8** 密码策略\n\n通常，网络管理员可以为网络用户配置以下与密码相关的设置：\n\n*   **Enforce password history（强制密码历史）**：此选项用于指定将为每个用户跟踪的密码数量。当用户尝试更改密码时，将不允许重用任何正在跟踪的密码。\n\
  \n\n\n\n\n### 密码策略设置\n\n*   **最大密码使用期限/最小密码使用期限**：这两个设置允许管理员设定密码在指定天数后过期，并防止用户在特定天数内更改密码。密码过期时，系统会提示用户更改，确保即使密码泄露，也会在短时间内更换以堵住安全漏洞。\n\
  *   **最小密码长度**：此选项用于指定密码可包含的最小字符数。这允许管理员强制用户使用更长、更难猜测的密码。对于安全系统，建议密码至少包含八个字符。\n\
  *   **密码必须符合复杂性要求**：管理员可使用此选项强制用户使用更安全、更复杂的密码，这些密码需包含小写字母、数字、符号和大写字母的某种组合。管理员通过在域控制器级别建立密码筛选器来设定复杂性级别。\n\
  \n### 建立资源控制\n\n服务器操作系统提供为文件、文件夹/目录及其他系统资源指定单独*访问权限*的功能。管理员的工作是仔细设置访问控制，使其允许授权用户访问和使用指定的系统资源，并拒绝未授权用户的访问以防止安全漏洞。\n\
  \n通过将*最小权限原则*应用于这些配置（如前所述），管理员可以减少恶意和无意安全漏洞发生的机会。例如，拒绝对文件和目录的读取访问有助于保护信息的机密性，而拒绝不必要的写入（修改）访问有助于维护信息的完整性。\n\
  \n将大多数系统相关工具的执行权限限制在授权系统管理员范围内，可以防止用户进行可能降低安全性的配置更改。这也能限制攻击者利用这些工具攻击服务器或网络上其他主机的能力。\n\
  \n#### NTFS 权限\n\nWindows 环境中使用的 NTFS 文件管理系统包含安全功能，允许将权限级别分配给磁盘上的文件和/或文件夹。*NTFS\
  \ 权限*设定用户可对指定文件或文件夹执行的操作参数。它们可由管理员直接分配，也可通过组设置继承（如默认的 Everyone 组）。\n\nNTFS 权限可配置为*允许*或*拒绝*选项。如果用户对特定文件夹或文件仅具有读取权限，但被分配到了一个对该文件夹或文件拥有更广泛权限的组，则该用户将通过该组获得额外权利。另一方面，如果用户被分配了针对特定权限级别的拒绝选项，则即使其所属的另一个组授予了该权限，也会被拒绝。在服务器环境中，文件的默认权限设置为“无访问权限”。\n\
  \n*标准 NTFS 文件夹权限*包括：\n\n*   **读取**：允许用户或组查看父文件夹的文件、文件夹或子文件夹及其属性和权限。\n*   **写入**：允许用户或组添加新文件或子文件夹、更改文件和文件夹属性、向现有文件添加数据，以及更改父文件夹内的显示属性。\n\
  *   **读取和执行**：允许用户或组更改子文件夹、显示属性和权限，并运行可执行文件类型。\n*   **修改**：允许用户删除文件夹，并执行与写入、读取和执行权限相关的所有活动。\n\
  *   **列出文件夹内容**：允许用户或组查看文件夹内的文件和子文件夹。\n*   **完全控制**：允许用户或组取得文件夹所有权并更改其权限，以及执行所有其他权限允许的活动。\n\
  \n*标准 NTFS 文件权限*包括：\n\n*   **读取**：允许用户或组查看文件及其属性和权限。\n*   **写入**：允许用户或组覆盖文件、更改其属性，并查看其所有权和属性。\n\
  *   **读取和执行**：允许用户或组运行和执行应用程序，以及拥有读取权限的所有选项。\n*   **修改**：允许用户修改和删除文件，并执行与读取、写入、读取和执行权限相关的所有活动。\n\
  *   **完全控制**：允许用户或组取得文件所有权并更改其权限，以及执行所有其他权限允许的活动。\n\n#### Linux 权限\n\nLinux 操作系统也采用文件和目录权限来防止未授权访问。在\
  \ Linux（和 UNIX）系统中，除文档和可执行文件外的其他结构也被定义为文件。磁盘驱动器、光驱、调制解调器、输入输出设备和网络通信等其他系统资源也作为文件进行访问。\n\
  \nLinux 系统中的每个文件都分配有*所属用户*和*所属组*，以及针对每种所有者类型的访问权限。*权限*也针对*非特权用户*建立。可配置三种类型的访问权限：\n\
  \n*   **读取 (r)**：指定后，允许用户读取文件或目录的内容。\n*   **写入 (w)**：指定给文件时，允许用户通过写入来修改文件。分配给目录时，写入权限允许用户在目录中创建或删除文件。\n\
  *   **执行 (x)**：允许用户执行具有此权限的文件和脚本。\n\n每种权限均针对每个用户类别独立建立。典型的文件权限显示（如通过列表命令 `ls` 获取）将呈现以下格式：\n\
  \n```\ndrwxrwxrwx user group filesize Jan 01 08:00 filename\n```\n\n左侧列的每个 `rwx`\
  \ 片段分别显示所属用户、所属组和其他用户的活动权限设置。本示例中出现所有三种权限类型，表明这三组均启用了所有权限。当某用户的特定权限被禁用时，其位置包含一个简单的破折号字符：\n\
  \n```\ndrwxrw-r-- user group filesize Jan 01 08:00 filename\n```\n\n在本示例中，所属用户仍拥有所有权限，但所属组权限降为读取和写入，而其他用户权限仅降为读取。\n\
  \n在 Linux 系统中创建目录或文件时，它会与其创建者关联，创建者默认成为其*所有者*。通常，Linux 用户会为其非可执行文件分配 `–rw-r--r--`\
  \ 权限。此设置允许其他人读取其文件，但无法更改。同样，目录通常分配 `–rwxr-xr-x` 权限。这允许其他人浏览目录并执行，但无法在其中写入新文件或删除现有文件。\n\
  \n## ICS 访问控制\n\n\n\n\n\n## OT 网络环境中的访问控制标准\n\n通常用于管理 OT 网络环境中访问控制的标准是在第 1 章“工业控制系统”中首次介绍的\
  \ ISA-95 Purdue 标准。图 7.9 重新展示了该标准描述的架构结构。请注意，企业网络占据第 4 和第 5 层，而 OT 网络存在于第 2 和第 3\
  \ 层。\n\n![图 7.9 扩展 ISA-95 架构](img/c07f009.png)\n\n**图 7.9** 扩展 ISA-95 架构\n\n再次强调，两个网络由第\
  \ 3 层和第 4 层之间的双防火墙 DMZ 隔开。一个防火墙由企业网络的 IT 人员管理，而 ICS 防火墙由过程控制网络工程师管理。还请注意，每一层都采用*入侵检测系统*\
  \ (*IDS*) 来独立监控每个网段，而不受其他网段影响。\n\nISA-95 标准在四个不同领域解决了 ICS 互联 IT/OT 网络的安全问题：\n\n\
  *   网络安全\n*   访问控制\n*   远程访问\n*   日志管理\n\n网络安全在第 3 章中已详细介绍。日志管理是第 9 章“ICS 安全评估”的主要组成部分。在本章的其余部分，我们将处理实施\
  \ ISA-95 标准的访问控制和远程访问方面。\n\n在网络 OT 侧的每一层，必须对图中描绘的以下组件保持访问控制：\n\n*   工作站\n*   IDS\n\
  *   防火墙\n*   应用程序\n*   服务器\n\n请注意，第 0 层和第 1 层不需要逻辑访问控制元素来保护网络环境。然而，所有其他层都需要逻辑和物理访问控制解决方案。此外，以下层级需要建立特定的访问控制功能：\n\
  \n*   **第 2 层**：控制室工作站和 HMI 必须同时具备物理和逻辑访问控制。\n*   **第 3 层**：必须在此层创建并强制执行密码策略。\n\
  *   **DMZ**：在此结构中，必须建立并要求双因素认证才能进行任何 OT 访问。\n*   **第 4 层**：必须部署控制用户访问应用程序的工具，并必须控制用户对服务器和\
  \ IDS 设备的物理访问。\n*   **第 5 层**：必须实施双因素认证流程，并必须控制对入侵防御系统 (IPS) 的访问。\n\n## 远程 ICS 访问控制\n\
  \n虽然最好完全没有从互联网进入 OT 的路径，但这变得越来越不可能。组织越来越重视其互联网存在和连接。此外，管理层希望访问生产现场的信息。因此，为外部人员访问\
  \ OT 网络创建了一条路径。\n\n应在此路径中放置尽可能多的实际防护措施。除了本章和前几章介绍的所有保障措施外，还应为此路径分配一些非常具体的安全工具：\n\
  \n*   虚拟专用网络 (VPN) 网关\n*   加密 VPN 隧道\n*   远程访问服务器 (RAS)\n\n### 虚拟专用网络\n\nVPN 网关位于第\
  \ 5 层将企业网络与互联网分隔开的 DMZ 中。该设备要求远程用户建立到网关的加密 *VPN 隧道* 以便在网络中进行身份验证。使用*虚拟专用网络* (*VPN*)，远程用户可以通过公共网络（互联网）连接到专用网络（组织的企业网络），然后进行身份验证并执行任务，就像直接连接到专用网络一样，如图\
  \ 7.10 所示。\n\n![图 7.10 VPN 连接](img/c07f010.png)\n\n**图 7.10** VPN 连接\n\nVPN 可以使用多种协议和加密方式建立，可能是网络管理员必须处理的更复杂的事情之一。许多\
  \ VPN 只是基于 IP 或 MPLS 的点到点连接，不支持以太网等第 2 层协议。因此，大多数网络仅限于 TCP/IP，但较新的 VPN 变体（如*虚拟专用局域网服务*\
  \ (*VPLS*) 或*第 2 层隧道协议* (*L2TP*)）可以提供基于以太网的通信。\n\nVPN 可以是*受信 VPN* 或*安全 VPN*。*受信\
  \ VPN* 不使用加密隧道，而是信任底层网络在身份验证之外处理安全性。*安全 VPN* 处理连接的加密。\n\n有许多不同类型的 VPN 可用，但最广泛使用的协议是*点对点隧道协议*\
  \ (*PPTP*)。PPTP 不提供任何加密，并使用从*点对点协议* (*PPP*) 获取的简单密码认证。\n\nL2TP 也使用 PPP 且未加密，但可以在隧道中传递另一种加密协议。通常底层协议会与\
  \ L2TP 结合使用，如 L2TP/IPsec。\n\n*互联网协议安全* (*IPSec*) 是 VPN 中常用的开放标准，实际上采用了一套协议来加密和认证\
  \ IP 通信。该套件中的协议包括：\n\n*   *认证头 (AH)* 提供数据完整性和源（IP 源）认证，以防止重放攻击（攻击者重放记录的传输以获取访问权限的攻击）。\n\
  *   *封装安全载荷 (ESP)* 提供源认证以及通过加密实现的机密性。ESP 在不包含任何端口信息的 ESP 头中加密并封装整个 TCP/UDP 数据报。这意味着\
  \ ESP 无法通过任何使用端口地址转换的设备。\n*   *安全关联 (SA)* 提供多种用于认证和密钥交换的算法和框架。\n*   *互联网密钥交换 (IKE)*\
  \ 是用于在 IPSec 中建立安全关联的协议。\n\n### 远程访问服务器认证\n\n*VPN 网关* 将远程认证请求转发到第 4 层“业务规划与物流网络”数据库区建立的用户数据库服务器。如果在数据库中找到远程用户，他们将被转发到位于分隔企业网络和\
  \ OT 网络的 DMZ 中的 RAS。\n\nRAS 是一台专门为*远程用户*（不属于域 ACL 成员的用户）提供网络访问的服务器。该服务器负责验证这些用户对特定网络资产的访问权限，并为他们提供登录凭据。\n\
  \n再次强调，用户应被要求提供双因素认证才能在 OT 网络中通过验证。如果 RAS 认证成功，用户将被授予访问其被授权工作的 ICS 区域的权限。此级别的所有访问都应由\
  \ ICS 管理层审查，并遵循最小权限原则。此外，访问权限应可自动撤销。\n\n### NERC CIP 005\n\n在第 6 章“物理安全”中，您了解了 CIP-006-1“关键\
  \ BES 网络资产的物理安全”规定的要求。CIP-005“电子安全边界”是该标准的电子配套标准。根据此标准，*电子安全边界* (*ESP*) 是所有关键网络资产所在的结构，并延伸至边界的所有访问点。BES\
  \ 环境可能由多个 ESP 组成。\n\n\n\n\n## CIP-005 标准：电子安全边界访问控制\n\n正如前文讨论的 CIP-006 标准，本标准要求\
  \ BES 运营商创建并实施策略、计划和政策，以保护其关键网络资产免受未经授权的电子访问。总体而言，本标准涉及两个关注领域：**拨号连接** 和使用 **可路由协议**\
  \ 的智能电子访问点设备。\n\n本标准涉及的主要策略、政策和实践组件包括：\n\n*   组织的无线网络政策\n*   可接受的认证方法和政策\n*   受信资源和不受信资源的识别\n\
  *   远程访问设备的反恶意软件政策\n*   补丁管理策略和政策，适用于用于启动与 ESP 电子访问点设备通信的操作系统和应用程序\n*   与外部供应商的服务级别协议\
  \ (SLA)，涉及遵守组织的远程访问控制\n\n虽然每个组织在如何满足要求方面有一定的灵活性，但其计划和政策必须涵盖以下领域：\n\n*   **实施并记录控制所有已识别\
  \ ESP 电子访问点电子访问的机制。** 这些电子访问控制旨在降低与使用可路由协议或拨号连接的资产进行不受控通信相关的风险。必须实施这些机制，将电子访问限制为组织认为必要的仅入站和出站通信。\n\
  \n    可用于控制 ESP 电子访问的技术和程序机制包括：\n\n    *   使用访问控制列表 (ACL) 限制 IP 地址、端口和服务\n    *\
  \   实施数据二极管（单向网关）以控制通过访问点的通信流\n    *   验证所有连接设备（路由器、防火墙和交换机）的配置\n    *   安装 UTM\
  \ 防火墙以修复 IT 网络漏洞\n    *   安装 OT 协议感知防火墙以支持企业网络中的操作区域，以及强制执行区域与访问点之间的允许命令\n    *\
  \   安装 NIDS 系统以检查入站和出站流量\n    *   实施应用程序白名单以保护计算资产免受有害应用程序侵害\n\n*   **实施并记录监控和记录所有\
  \ ESP 电子访问点入站和出站访问的流程。** 这些人工或电子控制旨在监控和记录 ESP 访问点的通信，且必须全天候 (24/7/365) 运行。\n\n*\
  \   **对其电子安全边界的电子访问点执行网络漏洞评估。** 根据 CIP-005，组织必须至少每年执行一次这些记录在案的漏洞评估。\n\n*   **审查、更新并维护所有文档，以支持符合\
  \ NERC CIP-005 标准的要求。**\n\n## 云系统访问控制\n\n在 第 3 章 中，您已了解新兴 ICS 参考架构模型中云服务的使用。与 IT/OT\
  \ 网络的其他部分一样，云环境需要 **访问控制 (AC)** 措施来建立模型中这些组件的安全性。为协助开发针对云系统的标准化 AC 技术和实践，NIST 组织制定了特别出版物\
  \ 800-012《云系统通用访问控制指南》。该文档提供的指南映射到 NIST SP 800-53 第 4 版《联邦信息系统和组织的安全和隐私控制》。\n\n\
  云服务为用户提供灵活的处理能力和数据存储选项，可通过互联网访问。使用这些服务的主要借口是将支持组织或其分支机构 IT 运营所需的 IT 设备和本地支持人员数量降至最低。组织将环境成本外包给云服务提供商，后者负责云环境的硬件、软件和网络开销。他们还负责环境的整体管理和维护。这使客户能够专注于其核心业务目标。\n\
  \n图 7.11 展示了云环境的通用架构。云基本上由联网硬件系统（服务器）组成，提供虚拟化计算资源（虚拟机），运行应用程序并提供数据存储。\n\n部署云系统有三种常见的服务模型：\n\
  \n*   **软件即服务 (SaaS)**：在此模型中，云服务提供商向客户提供其托管在云中的软件应用程序的访问和使用权。客户通过瘦客户端或 Web 浏览器跨互联网访问云应用程序。\n\
  \n*   **平台即服务 (PaaS)**：在 PaaS 模型中，云服务提供商授予客户对其云基础设施（硬件、操作系统和虚拟机）的有限访问权，以创建和部署其自己的应用程序。客户使用编程工具和代码库创建自己的云应用程序，但无法控制底层云基础设施。\n\
  \n*   **基础设施即服务 (IaaS)**：在 IaaS 云环境中，客户通常从云服务租用底层基础设施。在这种情况下，客户可访问云基础设施的配置。\n\n\
  ![图 7.11 云系统通用结构](img/c07f011.png)\n\n**图 7.11** 云系统通用结构\n\n正如您所料，鉴于这三种服务模型，访问控制方法及其应用在模型之间有所不同。图\
  \ 7.12 描绘了这三种模型中预期的访问途径。\n\n![图 7.12 云访问途径](img/c07f012.png)\n\n**图 7.12** 云访问途径\n\
  \n在 SaaS 模型中，应用程序用户必须被允许前端访问，而软件开发人员和云服务提供商管理员拥有后端访问权限。在此类环境中，客户可以访问应用程序以使用它们，但实际仅控制它们产生的数据。云服务提供商保留对大多数基础设施的访问和控制权，包括云网络、存储、虚拟化管理程序、VM、操作系统、任何中间件、运行时环境和实际应用程序。他们还对客户数据拥有访问权和一定的控制权。\n\
  \n同样，在 PaaS 模型中，软件开发人员通过前端拥有访问权，而云管理员保留后端访问权。与 SaaS 模型一样，在 PaaS 模型中，客户对其数据拥有访问和控制权。然而，他们还拥有对其创建和部署的应用程序的访问和控制权。云服务提供商保留对\
  \ SaaS 云所列所有其他后端组件的访问和控制权。\n\n最后，在 IaaS 模型中，客户获得云环境相当大一部分的前端访问权，而云提供商保留对基础设施较低层级（网络、数据存储、虚拟化管理程序和\
  \ VM）的访问权。\n\n\n\n\n## 云服务模型中的共享责任与访问控制\n\n在每种模型中，客户与云服务提供商之间都存在不同程度的共享责任。最简单的模型是\
  \ **SaaS 模型**，其中使用 `ABAC` 和 `RBAC` 管理模型来应用策略和预定义的用户角色，以管理对用户应用程序和数据的访问权限。此处的重点在于用户对应用程序的访问。为实现这一点，通常使用\
  \ *安全类协议* (`SCA`) 来定义用户的访问权限。\n\n在 **PaaS 模型** 中，用户在 PaaS 供应商的平台上部署自己的应用程序。这种安排需要一种更多样化的访问控制策略，涵盖三个基本要素：主体、客体和操作。\n\
  \n*   **主体** 包括相关方，如应用程序用户、应用程序开发人员和云服务提供商。\n*   **客体** 是需要访问控制的云环境组件，如内存数据、应用程序相关数据以及同一宿主环境中的其他应用程序。\n\
  *   **操作** 描述为每个主体提供的针对不同客体的访问权限类型，如读、写、创建和复制。\n\n所有这些要素都可受环境条件约束，包括时间、位置、安全级别等。\n\
  \n在 **IaaS 云模型** 中，创建 `SCA` 是为了在客户数据与 IaaS 提供商的系统管理员或其他 IaaS 用户之间建立访问屏障。IaaS 管理员仅负责网络层、Hypervisor、VM\
  \ 及数据存储的访问控制。由于网络在 IaaS 客户之间共享，因此 IaaS 提供商保护其网络和云系统至关重要。这可能涉及使用带有 `ACL` 白名单的专用 `VLAN`，以及\
  \ `IEEE 802.1Q VLAN` 标记。\n\nIaaS 云中访问控制的另外两个关键点是 `VM` 和 `Hypervisor`。在该模型中，最终用户拥有对\
  \ `Hypervisor` 和 `VM` 的访问权，通常被授予登录、读、写和创建权限。然而，通过创建的 `VM` 和 `Hypervisor` 提供给其他对象的访问权限也必须受到控制。\n\
  \n由于 IaaS 环境可能包含由多个最终用户创建的 `VM`（在公有云环境中），必须在 `VM` 之间创建隔离，以确保它们不会相互破坏，也不会为 IaaS 中的恶意用户提供攻击向量。虽然最终用户可能有权访问\
  \ `Hypervisor`，但除非云环境是私有云，否则他们不应拥有对其的 *访问控制* 权限。如果最终用户获得了 `Hypervisor` 的硬件资源访问权，他们可能会提升用户权限并入侵运行在该\
  \ `Hypervisor` 上的其他用户环境。\n\n---\n\n## 复习题\n\n以下问题测试您对本章所呈现材料的掌握程度。\n\n1.  当用户无法控制其拥有的文件和文件夹的访问权限时，需要哪种访问控制方法？\n\
  2.  在大型网络中，哪个管理职位负责在服务器、主机和网络连接设备上执行信息安全任务？\n3.  哪种认证方法使用中央授权机构来确定哪些用户可以访问哪些对象？\n\
  4.  管理员使用什么工具根据用户在组织中的职位和工作角色创建组访问权限和对网络资产的限制？\n5.  \\_\\_\\_\\_\\_\\_\\_\\_\\_\\\
  _\\_\\_\\_\\_\\_\\_\\_\\_\\_ 将权限附加到网络对象，系统利用它们来控制对资产（程序、文件夹、文件、打印机）的访问，以及可对该资产执行的活动。\n\
  6.  `IPSec` 采用什么协议来维护数据机密性？\n7.  \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ 是管理员应用于用户账户（而非文件夹、文件和打印机）的配置，用于限制其在本地计算机（本地账户）或整个网络（域账户）上的活动。\n\
  8.  `IPSec` 使用什么协议来维护数据完整性？\n9.  \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ 是分布式的、可定制的信息存储结构，提供单一入口，使用户可以搜索和定位分散在整个网络中的资源。\n\
  10. \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ 是共享相同 `DNS` 名称的对象集合。\n11. 哪个 `Microsoft`\
  \ 数据库包含有关用户账户、组账户和计算机账户的信息，以及跟踪域内所有对象的名称和资源请求？\n12. 现代 `Linux` 发行版采用什么目录服务？\n13.\
  \ `RAS` 服务器为 `VPN` 操作提供什么功能？\n14. 网络中的两类用户是什么？\n15. 哪个标准的默认 `Linux` 组拥有系统的完全管理控制权？\n\
  \n---\n\n## 考试题\n\n### 1. 以下哪种 `VPN` 类型处理隧道的加密部分？\n\n1.  安全 `VPN`\n2.  可信 `VPN`\n\
  3.  点对点 `VPN`\n4.  硬件 `VPN`\n\n### 2. 从以下列表中，确定应分配给组织企业网络和互联网连接路径的安全工具。（全选适用项。）\n\
  \n1.  一个 `VPN` 隧道\n2.  一个蜜罐\n3.  一个 `VPN` 网关\n4.  一个 `DMZ`\n5.  一个远程访问服务器 (`RAS`)\n\
  \n### 3. 选择允许用户删除文件夹并执行与“写入”和“读取和执行”权限相关的所有活动的标准 `NTFS` 文件夹权限。\n\n1.  执行\n2.  修改\n\
  3.  读取和执行\n4.  `-rwx`\n\n### 4. 从以下列表中，选择企业级目录服务为网络提供的关键功能。（全选适用项。）\n\n1.  可跨多个地理位置分布的信息存储\n\
  2.  可从多种不同操作系统访问的信息存储\n3.  管理员用于根据用户在组织中的职位和工作角色创建组访问权限和对网络资产限制的信息存储\n4.  用户可用于高效搜索分布在整个网络中的企业信息的信息存储\n\
  5.  用于限制用户在本地计算机（本地账户）或整个网络（域账户）上活动的信息存储\n\n### 5. 远程用户需要经过认证，且其数据通常需要加密。以下哪些协议组合使用可同时满足这两种需求？（选择两项。）\n\
  \n1.  `L2TP`\n2.  `DES`\n3.  `IPSec`\n4.  `PPTP`\n\n### 6. 以下哪些协议适用于 `IPSec`？（全选适用项。）\n\
  \n1.  认证头 (`AH`) 用于目标 `IP` 完整性\n2.  封装安全载荷 (`ESP`) 用于安全认证\n3.  认证头 (`AH`) 用于 `IP`\
  \ 源认证\n4.  封装安全载荷 (`ESP`) 用于机密性\n\n### 7. 在哪种云服务模型中，客户被授予对云基础设施配置的访问权限？\n\n1.  公有云\n\
  2.  `SaaS`\n3.  `PaaS`\n4.  `IaaS`\n\n### 8. 以下哪种访问控制方法要求主体具有安全许可？\n\n1.  基于身份的访问控制\n\
  2.  军事访问控制\n3.  基于角色的访问控制\n4.  强制访问控制\n\n### 9. 以下哪种访问控制模型基于从策略语句衍生出的复杂布尔规则集？\n\n\
  1.  `MAC`\n2.  `RBAC`\n3.  `ABAC`\n4.  `RB-RBAC`\n\n### 10. 关于自主访问控制方法，以下哪些陈述是正确的？（全选适用项。）\n\
  \n1.  网络管理员或超级用户拥有每个对象的所有权。\n2.  每个文件或对象都有其自己的所有者。\n3.  网络基于集中式授权机构或策略来确定对象访问。\n\
  4.  对象所有者拥有控制其文件访问的完全权力。\n\n---\n\n# 第 8 章\n\n\n\n\n\n# ICS 安全治理与风险管理\n\n## 简介\n\
  \n策略是组织遵循的规则。程序是为执行组织策略而采取的一系列步骤。指南是为策略和程序的正确实施提供的参考建议。这三个要素协同工作，为员工提供充分的指导，以便在组织内执行其任务。\n\
  \n尽管组织中的每个部门都可能制定自己的策略和程序以补充组织的目标和宗旨，但仍需为所有员工和部门明确建立总体的组织安全策略。管理层对安全策略的支持是组织在保护资产、基础设施和数据方面取得成功的最重要组成部分。\n\
  \n## 安全策略与程序开发\n\n任何组织企业策略的重要组成部分是其网络安全策略。该策略通过解释保护组织网络数据和计算机系统所需的总体要求，来支持企业策略。通常，这些策略的制定涉及组织多个领域的利益相关者，不限于以下方面：\n\
  \n*   企业管理层\n*   安全管理层\n*   网络管理部门\n*   人力资源部门\n\n这些群体共同努力，产生一套文档，指导整个组织确保其数据和资源的\
  \ CIA（机密性、完整性、可用性）。结果是形成一系列策略、程序和指南，组织所有成员在访问组织的计算和网络资源时均须遵守。它还为成员提供了在使用这些设备时做出良好网络安全相关选择所需的工具。\n\
  \n### 要求\n\n提供有效网络安全策略的首要要求是它必须**可用**。如果生成的文档不清晰或提出不切实际的要求，成员将会避开或规避它们。例如，密码对用户来说是个巨大的麻烦。大多数用户只能记住一两个密码，如果安全策略要求每次登录都使用唯一的方案或认证因子，他们可能就会放弃不参与，或设计不安全的方法来绕过要求。\n\
  \n因此，策略必须在组织的安全需求与用户遵守强密码要求的意愿之间取得平衡。抱怨几乎总是会有，但必须建立并强制执行这种平衡，因为当用户账户被攻破时，抱怨会多得多。\n\
  \n考虑到这一点，安全策略还必须**可执行**，并包含关于如何处理不遵守策略行为的具体信息。策略的这一部分描述了如何报告策略违规以及发生违规时应采取什么行动。这包括针对特定类型违规将采取的行动，如口头警告、书面申斥或终止聘用流程。\n\
  \n策略还必须在安全与生产力之间取得平衡。如果策略和程序过于侵入性以至于降低了生产力，各级管理层也会被诱导去规避他们不欣赏的领域以完成更多工作。\n\n所有企业策略必须是自上而下的才能高效。与企业策略文档的所有其他组成部分一样，网络安全策略必须在组织内获得高层支持。这包括首席执行官（CEO）和首席信息官（CIO）。如果任何级别的管理层规避已发布的策略，那么组织的基层员工会将它们视为仅仅证明管理层存在合理性的东西，并将其束之高阁。管理层应利用所有策略工具，包括其网络安全策略，来推动公司倡议和变革。\n\
  \n最后，组织的网络安全策略必须涵盖任何确立网络中数据机密性、完整性或可用性特定要求的法律法规。一些重要示例包括以下内容：\n\n*   **《健康保险流通与责任法案》（HIPAA）**：其旨在实现以下目标：\n\
  \    *   减少医疗欺诈和滥用行为\n    *   为电子账单的医疗信息交换提供行业标准\n    *   要求保护和机密处理受保护的健康信息\n  \
  \  *   提供在工人失业或变更受雇关系时转移和延续健康保险覆盖的能力\n\n*   **《萨班斯-奥克斯利法案》（SARBOX 或 SOX）**：这包括与财务记录处理相关的立法要求。虽然其要求与\
  \ HIPAA 为医疗记录设计的要求相似，但 SOX 还详细规定了为影响法律调查而篡改、销毁或伪造记录的刑事处罚。组织必须有能力证明其遵守政府立法。例如，一次\
  \ HIPAA 违规可能使组织付出高达 1,500 美元的代价。计算数据库中的用户数量，然后乘以该数字。\n\n### 例外与豁免\n\n因为没有任何策略能在设计时预见到墨迹干后将出现的所有可能变化，所以策略包含处理原始策略文档未涵盖变化的方法非常重要。事实上，整个企业策略手册应被视为一份**活文档**，根据需要进行更改，并定期审查和更新。\n\
  \n由于未定义的变化不会在可预测的时间点发生，因此策略必须包含处理例外和豁免的条款。\n\n*   **例外** 定义为不包含在规则、组或列表中——或表现不符合预期方式的某人或某事。策略的例外部分旨在为记录对既定\
  \ IT 和网络安全策略、程序及指南的合规性例外提供一种方法。\n\n*   **豁免** 定义为免除他人承担的义务或责任的过程或状态——换句话说，指无需遵守企业策略中所述网络安全策略、程序或指南的某人或某事。\n\
  \n#### 例外\n\n在大多数组织中，正常的日常运营中会出现因某种原因无法遵守其策略、程序和指南的情况。然而，由于这些事件影响正在进行的运营，必须允许它们以防止运营遭受重大延误或停止运行。在这种情况下，必须批准并记录例外。\n\
  \n这就是安全策略例外流程发挥作用的地方。该流程的步骤应确定合规性问题发生的具体位置，以便将其上报至适当的管理层级，确保风险得到有效识别和管理。在大型组织中，策略例外的批准通常必须获得\
  \ CIO 或该管理领域指定人员的同意。\n\n安全策略例外流程必须适用于所有 IT 和网络安全策略、标准和实践，以及所有组织用户。任何负责在网络中实施安全策略和标准的用户、IT\
  \ 支持人员或管理者，必须使用该流程请求例外。通常，例外请求应要求记录以下内容：\n\n*   为什么需要例外，例如，存在什么业务需求，可能存在什么替代方案，以及为什么这些替代方案不合适\n\
  \n\n\n\n*   申请豁免的具体策略的描述\n*   申请豁免的具体设备、应用程序或服务\n*   如果批准豁免，对因不合规而产生的潜在风险的评估\n*\
  \   管理或减轻批准豁免所带来的风险的计划\n*   预期的不合规持续时间\n\n豁免不应无限期存在。相反，应记录在案并定期审查豁免，直到策略能够更改以纠正豁免状态。对豁免的持续审查，能让组织对其风险领域有切实的了解，而不是表明其安全计划已完成。\n\
  \n通常，可能会批准组织既定的网络安全策略、程序或指南的例外，以应对以下任何情况：\n\n*   遵守现有策略会导致重大不利财务影响，而该影响无法通过合规带来的风险降低来抵消。\n\
  *   立即遵守现有策略会中断关键操作，可创建临时例外。\n\n#### 豁免\n\n豁免是组织策略文件中常见的另一种请求/授权流程。例外针对策略之外的临时状况，而豁免则是对遵守组织一项或多项策略的长期（可能是生命周期长度）排除。网络安全策略豁免通常针对两类环境提供：\n\
  \n*   不会给生产网络带来风险的实验、开发或测试环境。\n*   包含较旧设备或应用程序的遗留环境，这些设备或应用程序需要安全性较低的环境才能运行，因此不满足合规要求。这可能延伸到其他方面合规但拥有生产运营仍需的遗留设备或应用程序的环境。\n\
  \n即使这些情况需要豁免一项或多项网络安全策略，与豁免相关的任何风险也必须得到管理。支持豁免申请的文档通常包括以下内容：\n\n*   豁免资产（环境、设备或应用程序）的物理位置\n\
  *   负责豁免资产的个人或团体\n*   豁免资产的用途\n*   如何减轻与资产相关的风险\n\n### 标准\n\n有若干国际和国内标准及指南可帮助组织创建和维护其企业策略和程序的网络安全部分。以下列表列出了几个最常用的美国国家指南：\n\
  \n*   **NIST SP 800-53 Rev 5，“联邦信息系统和组织的安全和隐私控制”**：由美国国家标准与技术研究院发布，这是一项美国安全标准，旨在为联邦信息系统和组织提供安全和隐私控制目录，以及选择控制措施的流程，以保护组织运营、资产和国家免受各种威胁，包括敌对网络攻击、自然灾害、结构故障和人为错误。\n\
  *   **NIST 网络安全框架 1.1**：该框架由标准、指南和最佳实践组成，旨在促进关键基础设施保护。该框架基于优先级、灵活、可重复且具成本效益的方法，将帮助关键基础设施的所有者和运营商管理网络安全相关风险，同时保护商业机密、个人隐私和公民自由。\n\
  *   **ISO/IEC 27002**：ISO/IEC 2700 系列标准由国际标准化组织 (ISO) 和国际电工委员会 (IEC) 发布，旨在为信息安全控制提供安全标准。它为实施和维护信息安全管理系统提供了最佳实践，以保障数据\
  \ CIA（机密性、完整性、可用性）。\n*   **NIST SP 800-82r2，“工业控制系统 (ICS) 安全指南”**：制定本指南旨在为保护工业控制系统\
  \ (ICS) 提供指导，包括 SCADA 系统、分布式控制系统 (DCS) 和其他 PLC 控制系统配置。该标准概述了 ICS 拓扑，识别了这些系统的典型威胁和漏洞，并提供了推荐的安全对策以减轻相关风险。\n\
  *   **NERC CIP**：由北美电力可靠性公司制定，关键基础设施保护 (CIP) 计划是一组 9 项标准和 45 项要求，旨在保护涉及大容量电力生产和输配电系统运行的数字资产。特别是，CIP\
  \ 标准涉及电子安全边界、关键网络资产和人员的安全，以及实施和使用该计划的培训。\n*   **Neureg 6847，“美国核电站网络安全自我评估方法”**：该自我评估方法由太平洋西北国家实验室\
  \ (PNNL) 开发，旨在协助核电站人员评估和管理网络安全风险。它是一种结构化方法，用于识别和审查关键数字资产，系统评估这些资产的漏洞，评估关键数字资产被成功利用对电厂的后果，估算网络安全风险，并确定具有成本效益的防护措施。\n\
  *   **CIS 关键安全控制 v8 (原 SANS Top 20)**：由互联网安全中心 (CIS) 开发，这些控制旨在指导组织保护自己免受已知攻击。该指导体现在\
  \ 20 项 CIS 控制中，分为三类：基本、基础和组织。CIS 提供了一份针对 ICS 的专用指导文档，描述如何将 CIS Top 20 Controls 应用于\
  \ ICS 环境。这些文档可在 `www.cisecurity.org` 获取。\n\nICS 网络安全专业人员有多个政府和行业认可的标准和建议，可用于进行系统化、规范化和可重复的安全评估。这些基本标准包括：\n\
  \n*   **国家安全系统委员会指令 (CNSSI) 1253**：该指令旨在为美国政府机构和部门提供关于国家安全系统风险管理框架 (RMF) 的指导。该信息是\
  \ NIST SP 800-53 指南的补充。\n*   **国际自动化学会：ISA/IEC-62443 (原 ISA99) 安全保障等级**：这些标准旨在为与\
  \ ICS 和相关应用程序网络安全相关的标准提供连贯性和一致性。这包括诸如“系统设计安全风险评估”、“产品安全开发生命周期”和“IACS 组件技术安全要求”等指南。\n\
  \n除了基本的 ICS 网络安全标准外，还有许多行业特定的指南和标准可供参考：\n\n*   NRC 监管指南 5.71，“核设施网络安全计划”\n*   INGAA\
  \ 控制系统，“天然气管道行业网络安全指南”\n*   NISTIR 7628，“智能电网网络安全指南”\n\n以下章节和关键术语旨在帮助构建合理网络安全策略的基础，应在实施前进行评估并达成一致。\n\
  \n## NIST 网络安全框架\n\n\n\n\n## NIST 网络安全框架\n\nNIST 网络安全框架被确立为一套通用准则，可应用于各类网络，包括企业网、公用事业网、工业控制系统网和医疗网络。然而，由于该框架旨在支持如此多不同类型的组织，因此其范围远比大多数网络所需的要宽泛得多。因此，大多数组织将使用针对其网络需求的特定框架部分来制定其网络安全计划。\n\
  \nNIST 网络安全框架中确定的五大功能为制定安全政策提供了一份公认的路线图，使其网络安全活动与业务需求、风险承受能力（或风险接受度）和资源保持一致。这些功能共同描述了企业网络常见的特定网络安全活动，也适用于本课程剩余部分将涵盖的所有其他网络类型。\n\
  \n虽然 NIST CSF 可用作制定网络安全政策的路线图，但它并非适用于每个组织的现成解决方案。通常，NIST CSF 用于支持组织的 IT 网络和网络安全政策，而其他标准（如\
  \ `IEC 62443` 和其他 ICS 标准）则应用于 OT 网络环境。每个行业和组织都有独特的风险类型和级别、不同的风险管理优先级，以及不同的网络类型、工具和方法。目前，美国约有\
  \ 50% 的组织正在使用 NIST CSF（`www.nist.gov/industry-impacts/cybersecurity-framework`）。\n\
  \n安全专家必须利用其对这些组织变量的理解，并使用该框架创建一个配置文件，以便以此制定统一的安全政策。在许多组织的复杂网络中，网络安全专家可能会创建多个配置文件，使其与组织的各个组成部分保持一致。\n\
  \n### 识别 (ID)\n\n建立组织层面的理解，以管理系统、资产、数据和能力面临的网络安全风险。在该初始功能下，在网络安全政策制定工作开始时，需要识别五个领域：\n\
  \n#### 资产管理\n\n识别使组织能够实现其业务目的的数据、人员、设备、系统和设施，并实施一项策略，以符合其对业务目标和组织风险策略的相对重要性的方式对其进行管理。\n\
  \n#### 业务环境\n\n识别组织的使命、目标、利益相关者和活动。采取措施确保这些内容被理解并得到妥善优先排序。然后可利用这些信息来实施网络安全角色、职责和风险管理决策。\n\
  \n#### 治理\n\n识别管理和监控组织法规、法律、风险、环境和运营要求所需的政策、程序和流程。采取措施确保这些内容被理解，并将其网络安全风险告知管理层。\n\
  \n## 风险评估\n\n识别可采取的步骤，以确保组织了解其组织运营（包括其使命、职能、形象或声誉）、组织资产及其人员面临的网络安全风险。\n\n#### 风险管理策略\n\
  \n识别组织的优先事项、约束条件和风险承受能力，并建立可用于支持运营风险决策的假设。\n\n#### 供应链风险管理\n\n识别组织的优先事项、约束条件和风险承受能力，并建立假设以支持风险决策，且开发与供应链风险相关的流程。\n\
  \n### 保护 (PR)\n\n该功能涵盖五个类别，有助于开发和实施适当的防护措施，以确保关键基础设施服务的交付：\n\n#### 身份认证和访问控制\n\n\
  通过妥善限制授权用户、进程或设备对资产和相关设施的访问，以及授权活动和事务的访问，来保护关键基础设施服务。\n\n#### 意识和培训\n\n通过确保组织人员和合作伙伴接受网络安全意识教育，并接受充分培训以履行其与信息安全相关的职责和责任（且与相关政策、程序和协议一致），来保护关键基础设施服务。\n\
  \n#### 数据安全\n\n实施措施，确保根据组织的风险策略管理信息和记录（数据），以保护信息的机密性、完整性和可用性。\n\n#### 信息保护流程和程序\n\
  \n制定涉及目的、范围、角色、职责、管理承诺及组织实体间协调的安全政策。同时确保维护并使用流程和程序来管理信息系统和资产的保护。\n\n#### 维护\n\n\
  建立维护程序，确保对工业控制和信息系统组件的修复工作以符合组织政策和程序的方式进行。\n\n#### 防护技术\n\n实施活动，确保技术安全解决方案得到管理，以保障系统和资产的安全性和弹性，且与相关政策、程序和协议保持一致。\n\
  \n### 检测 (DE)\n\n开发并实施适当的活动，以识别网络安全事件的发生。检测功能可及时发现网络安全事件。该功能内的成果类别示例包括异常和事件、安全持续监控和检测流程。\n\
  \n#### 异常和事件\n\n制定程序，确保及时检测到异常活动，并了解事件的潜在影响。\n\n#### 安全持续监控\n\n实施政策和程序，确保在离散间隔监控信息系统和资产，以识别网络安全事件并验证防护措施的有效性。\n\
  \n#### 检测流程\n\n维护并测试检测流程和程序，以确保及时且充分地感知异常事件。\n\n### 响应 (RS)\n\n开发并实施适当的活动，针对检测到的网络安全事件采取行动。\n\
  \n#### 响应规划\n\n执行并维护响应流程和程序，以确保及时响应检测到的网络安全事件。\n\n#### 沟通\n\n根据需要与内部和外部利益相关者协调响应活动，包括来自执法机构的外部支持。\n\
  \n#### 分析\n\n开展分析，以确保充分响应并支持恢复活动。\n\n#### 缓解\n\n执行活动以防止事件扩大、减轻其影响并根除事故。\n\n####\
  \ 改进\n\n通过汲取当前和以往检测/响应活动的经验教训，改进组织的响应活动。\n\n### 恢复 (RC)\n\n开发并实施适当的活动，以维护弹性计划，并恢复因网络安全事件而受损的任何能力或服务。恢复功能支持及时恢复正常运营，以减少网络安全事件的影响。该功能内的成果类别示例包括恢复规划、改进和沟通。\n\
  \n\n\n\n\n## 恢复规划\n\n*   **恢复规划**：执行并维护恢复流程和程序，以确保及时恢复受网络安全事件影响的系统或资产。\n*   **改进**：通过将经验教训纳入未来活动，改进恢复规划和流程。\n\
  *   **沟通**：与内部和外部各方协调恢复活动，例如协调中心、互联网服务提供商、攻击系统所有者、受害者、其他 CSIRT 和供应商。\n\n#### NERC\
  \ CIP\n\n前文已介绍两项 NERC CIP 标准在特定主题上的应用。CIP 标准实际上包含 9 个标题和 45 项要求，帮助组织（称为“责任实体”）建立电子安全边界（ESP）并保护其中包含的网络资产。这些标准还涉及人员、培训、安全管理职能和灾难恢复。它们旨在配合使用，为批量电力系统（BES）组织创建并维护高水平的网络安全。CIP\
  \ 标准标题及功能如下：\n\n*   CIP-002-5.1a，“关键网络资产识别”\n*   CIP-003-1，“安全管理控制”（第 9 章）\n*  \
  \ CIP-004-1，“人员与培训”\n*   CIP-005-1，“电子安全边界”（第 3 章、第 4 章 和 第 7 章）\n*   CIP-006-1，“关键网络资产物理安全”（第\
  \ 6 章）\n*   CIP-007-1，“系统安全管理”（第 8 章）\n*   CIP-008-1，“事件报告与响应规划”（第 10 章）\n*   CIP-009-1，“关键网络资产恢复计划”（第\
  \ 11 章）\n*   CIP-010-3，“漏洞评估”（第 8 章）\n*   CIP-011-2，“信息保护”\n*   CIP-013-1，“网络安全供应链风险管理”（第\
  \ 11 章）\n*   CIP-014-2，“物理安全”（第 6 章）\n*   CIP-012，“控制中心间通信”\n\n### ICS 安全策略\n\n\
  与 IT 网络一样，OT 网络需要明确定义的安全策略，以使其运行高效、富有成效且安全。然而，除了指导 IT 网络安全策略的潜在信息丢失外，OT 网络策略还必须考虑与危险过程相关的潜在后果。当\
  \ OT 网络中断或瘫痪时，人员、设施和环境可能会发生严重后果。请看看 OT 网络通常部署的场所：\n\n*   化工厂\n*   装配线\n*   发电厂\n\
  *   核电站\n*   水处理\n*   废物管理\n\n因此，当组织开展 ICS 风险评估、风险缓解和安全策略制定计划时，必须解决以下可能的风险领域：\n\n\
  *   人员安全\n*   设备安全\n*   环境影响\n*   生产损失\n*   数据丢失\n*   不利商业影响\n\n本章稍后将介绍用于创建策略的工具，以及用于管理\
  \ ICS 风险额外且独特要求的程序。\n\n## 风险管理\n\n本书已多次提及风险，但直到现在才对其进行定义。**风险**是价值对象潜在的损失。根据 NIST\
  \ 词汇表（`https://csrc.nist.gov/glossary/term/cybersecurity_risk`），网络安全风险被定义为与数据或信息/控制系统的\
  \ CIA 丢失相关的风险，这反映了对组织运营潜在的不利影响。它也可以表示为与不确定性的有意交互。风险也是一种可以向组织内部和外部利益相关者传达的量化指标。\n\
  \n风险管理是识别、评估和应对风险的过程。NIST 框架描述了一种四层级/三板块的格式，可用于评估组织风险管理。描述组织网络安全准备状况的三个板块如下：\n\n\
  *   **风险管理流程**：风险管理流程板块涉及组织是否已将风险管理实践正式化。它还确定组织是否已根据其风险目标、威胁环境或业务/使命目标，对其网络安全活动进行了优先级排序。\n\
  *   **综合风险管理计划**：该板块根据组织对其运营相关风险的认知、其作为组织处理风险管理的方式，以及其在整个组织中分发网络安全信息的流程来识别组织。\n\
  *   **外部参与**：外部参与板块涉及组织对其所在的更大网络安全供应链中其他实体的理解和互动。\n\n这些板块可用于根据组织的网络安全准备情况将其分为四个实施层级。\n\
  \n*   **第 1 层：部分**：组织没有任何有组织的风险管理计划，导致临时的网络安全风险管理步骤，且没有与外部组织协调的流程。\n*   **第 2 层：风险知情**：组织拥有管理层生成的网络安全实践，这在内部创建了组织风险管理步骤和流程，但没有正式的网络安全能力与外部组织互动。\n\
  *   **第 3 层：风险知情且可重复**：组织在全组织范围内拥有完全批准的网络安全实践，能够适应不断变化的威胁和技术。网络安全计划已完全制定并实施，可为与外部组织的基于风险的协作提供支持。\n\
  *   **第 4 层：自适应**：自适应组织拥有的网络安全风险管理系统能够适应从以往事件中吸取的教训。网络安全风险管理是全组织共同关注的问题，并通过以往事件的反馈、从可信来源获取的信息以及对自身网络活动的持续感知而不断演进。这种方法还使组织能够与合作伙伴组织共享其网络安全方法，以在整个企业范围内最大化其网络风险管理策略。\n\
  \n### 资产识别\n\n制定企业网络安全策略的第一步是识别对组织运作至关重要的网络和软件资产。下一步是为每个已识别的资产和资源分配货币替换价值，以及设备故障导致的员工停工成本。此清单必须包含对正常运营至关重要或对实现特定组织目标具有重要意义的每个网络组件。\n\
  \n开发资产价值清单的另一种方法是使用分级评级系统标注对组织最重要的组件，例如信息安全评价通用标准（通用标准或 CC），它建立了评价保证等级（EAL），可用于认证设备可靠性或安全保证等级。组织安全需求越大，任何给定网络硬件或软件资产的特定\
  \ EAL 值应越高。\n\n使用通用标准估值方法将提供一个层级结构图景，显示哪些网络资产和服务需要最多关注。例如，防火墙的评价值可能高于 Web 服务器，因此应赋予更高价值并采取更多安全措施。\n\
  \n\n\n\n对于大多数组织而言，识别哪些资产对组织运作至关重要是一项持续但必要的任务。然而，花时间为网络资产和服务建立实际价值，将确保对组织最关键的资产得到妥善保护。这些评估通常由组织的信息安全团队处理，并与法律、业务和\
  \ IT 人员协作完成。\n\n## 风险评估\n\n**风险评估**的目的是识别可采取的步骤，以确保组织了解其组织运营（包括其使命、职能、形象或声誉）、组织资产及其人员面临的网络安全风险。\n\
  \n这包括理解组织网络不同领域发生风险事件的可能性及其造成的影响。在充分理解这两个变量后，组织管理层可以确定可容忍的风险水平，以风险承受力或风险接受度来表示。\n\
  \n从任何事业或网络环境中完全消除所有风险是不切实际的。因此，所有风险评估活动的最终目标是制定管理风险的指南，将威胁降至与组织优先事项、约束条件、风险承受力和假设相兼容的水平。通过了解自身的风险承受力，组织可以确定需要关注的系统的优先级，从而优化其网络安全支出。\n\
  \n风险评估可能采取多种形式，但大多采用矩阵格式构建，将不同的已识别威胁与其预计的影响和可能性水平相关联。表 8.1 显示了一个风险评估矩阵示例。在该特定示例中，识别了可能的威胁主体，并包含了现有的防护措施。\n\
  \n此过程包含多个步骤：\n\n1.  识别并记录资产漏洞。\n2.  从可用信息源收集威胁和漏洞信息。\n3.  识别并记录对组织资产的威胁。\n4.  分析潜在影响。\n\
  5.  识别风险响应。\n\n**表 8.1** 示例风险评估矩阵\n\n| 威胁（可能发生什么？） | 威胁主体（谁可能做？） | 漏洞（如何可能？） | 现有防护措施（有什么措施防止它？）\
  \ | 后果（最坏情况是什么？） | 影响 | 可能性 | 风险 |\n| --- | --- | --- | --- | --- | --- | --- |\
  \ --- |\n| 存储数据（如历史记录）程序被未授权人员通过本地访问无意修改或破坏 | 1. 恶意内部人员 | 1. 不满的员工/承包商 | 1. 人员筛查<br>2.\
  \ 访问控制日志<br>3. 异地备份存储 | 1. 经济损失<br>2. 产品安全<br>3. 公司形象 | 中 | 低 | 低 |\n| 存储数据（如历史记录）程序被未授权人员通过远程访问故意修改或破坏\
  \ | 1. 外部人员<br>2. 恶意内部人员 | 1. 远程访问<br>2. 不满的员工/承包商 | 1. 企业防火墙/VPN<br>2. 双因素认证<br>3.\
  \ 异地备份存储 | 1. 经济损失<br>2. 产品安全<br>3. 公司形象 | 中 | 中 | 中 |\n| 恶意软件通过远程连接的计算机无意进入控制系统\
  \ | 1. 内部人员 | 1. 远程访问<br>2. 杀毒防护<br>3. 培训/意识 | 1. 远程访问客户端杀毒软件<br>2. VPN 服务器验证客户端杀毒状态\
  \ | 1. 经济损失<br>2. 产品安全<br>3. 人员伤害<br>4. 环境影响<br>5. 公司形象 | 高 | 高 | 高 |\n| 恶意软件通过远程连接的计算机被故意安装在控制系统上\
  \ | 1. 外部人员<br>2. 恶意内部人员 | 1. 远程访问<br>2. 杀毒防护<br>3. 不满的员工/承包商 | 1. 远程访问客户端杀毒软件<br>2.\
  \ VPN 服务器验证客户端杀毒状态 | 1. 经济损失<br>2. 产品安全<br>3. 人身伤害<br>4. 负面环境影响<br>5. 玷污公司形象 | 高\
  \ | 高 | 高 |\n| 恶意软件通过连接到控制系统网络的笔记本电脑进入系统 | 1. 内部人员 | 1. 便携介质策略<br>2. 可访问端口<br>3.\
  \ 杀毒防护<br>4. 培训/意识 | 1. 笔记本电脑杀毒软件 | | 高 | 高 | 高 |\n| 恶意软件通过受感染的介质进入系统 | 1. 内部人员\
  \ | 1. 便携介质策略<br>2. 可访问端口<br>3. 杀毒防护<br>4. 培训/意识 | 1. 便携介质策略 | | 高 | 极高 | 极高 |\n\
  \n## 风险识别漏洞评估\n\n在识别并评估了网络资产、识别了潜在漏洞和威胁之后，制定网络安全计划的下一步是对网络执行风险识别测试，以确定其对这些威胁的易感程度。\n\
  \n在某些情况下，执行漏洞（或风险）评估的任务落在信息安全团队或网络管理员及其员工身上。然而，企业聘请第三方安全承包商来确定网络中存在的弱点或漏洞也很常见。\n\
  \n有许多技术和软件解决方案可用于执行漏洞或风险评估（渗透测试）。最常见的渗透测试涉及使用技术高超的白帽黑客来模拟攻击者，并尝试不同的方法攻击网络。在通知高层管理人员并获得监督批准后，白帽黑客通常会执行一系列常见的渗透技术，如图\
  \ 8.1 所示，包括以下内容：\n\n*   **嗅探**：使用数据包分析器，白帽黑客捕获网络中移动的数据包，记录它们，然后解码其原始数据。随后他们可以分析这些数据，实际上是在监视网络用户。\n\
  *   **端口扫描**：使用端口扫描工具包探测网络服务器和设备的开放端口以便利用。他们还可以识别主机上运行的服务以供潜在利用。\n*   **漏洞扫描**：使用网络漏洞扫描工具包扫描企业的不同类型常见漏洞，如系统错误配置和默认密码使用，以及通过生成畸形数据包创建\
  \ DoS 攻击。\n*   **心理（以及可能的物理）社会工程学攻击**：绝大多数网络安全攻击始于网络钓鱼或其他类似类型的 SE 攻击。这些漏洞利用在第 5\
  \ 章“ICS 网络安全要素”中有详细介绍。\n\n![图 8.1 典型渗透测试](img/c08f001.png)\n\n**图 8.1** 典型渗透测试\n\
  \n## 影响评估\n\n回顾一下，管理安全风险的主要目标是将其降至可接受的水平。为此，组织必须识别哪些威胁对它们构成真正的担忧。这是通过评估每个安全事件实际发生的影响来确定的，这一过程称为**影响评估与分析**。\n\
  \n影响评估与分析是一项纯粹的业务职能，它确定哪些单独的威胁对组织构成危险，以便实施适当的主动措施。利用资产识别过程中建立的价值，可以计算风险识别程序中记录的不同可能事件发生的成本。\n\
  \n\n\n某些安全事件可被归类为一次性事件，或 `单次损失期望值 (SLE)` 事件，即按一次性基础为其分配价格的事件。例如，如果特定服务器遭受 DoS 攻击，可计算该单次事件的成本。\n\
  \n然而，对于其他潜在发生的事件，风险评估可能还涉及评估事件在给定时间段（如一年内）发生的概率。如果该事件在年内可能再次发生，则必须为该事件附加一个 `年化发生率\
  \ (ARO)` 值。要正确评估该特定事件发生给组织带来的财务影响，必须将其 `SLE` 值乘以 `ARO` 值。这将得出该事件的 `年化损失期望值 (ALE)`。\n\
  \n采用这种风险评估流程方法，您可以制定风险评估矩阵作为 `风险评估评分文档`，类似于 图 8.2 所示。\n\n![图 8.2 风险评估评分文档](img/c08f002.png)\n\
  \n**图 8.2** 风险评估评分文档\n\n完成风险评估流程后，收集的信息将用于创建 `风险评估报告`（单份或多份）。图 8.3 展示了创建完整风险评估报告执行摘要的模板。该表单提供了摘要报告的格式和指南。只需在指示区域填入建议信息即可。互联网上也提供了各种完整版的风险评估报告模板。\n\
  \n### ICS 风险评估\n\n工业/公用事业风险评估包含许多风险分析工具，这些工具不同于前文针对企业网络所述的工具。特别是，OT 环境的风险评估必须包含\
  \ `过程危害分析 (PHA)`。`PHA` 用于评估给定工业过程中潜在的危害。\n\n在美国，`PHA` 分析由职业安全与健康管理局 (OSHA) 强制要求，旨在协助潜在危险过程的操作人员确定并排序其过程的操作风险。操作人员随后可实施适当的安全和缓解策略，将相关风险降至可接受水平。\n\
  \n`PHA` 分析生产设备、过程控制仪表、公用设施及人为因素对过程的影响。特别是，`PHA` 旨在分析不同类型工业事故（包括火灾、爆炸和危险材料事故）发生后可能导致的后果。\n\
  \n![图 8.3 风险评估执行摘要模板](img/c08f003.png)\n\n**图 8.3** 风险评估执行摘要模板\n\n虽然开发 `PHA` 有许多方法，但通常有四种主要工具可用于\
  \ `PHA` 的开发：\n\n*   `危害与可操作性研究 (HAZOP)`：这是为揭示给定过程中存在的任何危险场景而进行的研究和分析。`HAZOP` 由多方团队执行，以评估工业过程中的潜在问题，识别对人员或设备的风险。该分析基于一组标准引导词，旨在将这些潜在问题及其后果暴露出来。\n\
  \n*   `失效模式与影响分析 (FMEA)`：`FMEA` 是一种定性分析工具，用于评估过程以识别其可能失效的位置和方式（失效模式），并评估不同失效的相对影响。该评估可用于识别最可能失效的过程组件，从而对整体系统进行创新改进。\n\
  \n*   `保护层分析 (LOPA)`：`LOPA` 是一种基于规则的 `PHA` 工具，用于为不同的工业处理系统创建风险评估和降低策略。该程序获取通过 `HAZOP`\
  \ 过程发现的信息和建议的筛选值，生成一组用于风险降低的保障措施。每个实施的保障措施产生的数值风险降低因子，可结合组织的不可接受风险标准，用于确定实施哪些保障措施。\n\
  \n    这些保障措施以 `安全仪表系统 (SIS)` 的形式实施。`SIS` 是一种工业控制系统，旨在监控关键过程并对其进行控制，以安全为主要目标。特别是，它们被设计和配置为在发生操作问题时，使过程进入安全状态。\n\
  \n*   `故障树分析 (FTA)`：`FTA` 是一种分析性系统安全与可靠性工程工具，用于确定过程如何失效，以及如何最好地降低与这些过程相关的风险。该工具基于创建数字映射（使用布尔逻辑或数字逻辑门图）来创建故障树。该树识别与过程中可能发生的“非期望状态”相关的顶级事件和促成事件的原因及发生率。\n\
  \n*   `事件树分析 (ETA)`：`ETA` 是一种定量风险分析方法，用于记录特定危害事件的演进过程。它对事件从启动到后果的发生顺序进行建模。\n\n*\
  \   `因果分析 (CCA)`：`CCA` 是 `FTA` 和 `ETA` 方法的结合，生成一种将故障树和事件树相结合的图形表示，可用于识别危害场景的原因和事件结果。\n\
  \n*   `蝴蝶结图`：这些图形表示在一个类似蝴蝶结的显示中呈现潜在问题（危害）、预防措施、启动事件、缓解措施和后果。这些图可与此处列出的任何分析类型配合使用。\n\
  \n### 风险缓解\n\n风险缓解（风险降低）是一种系统性方法，旨在降低风险敞口的程度和/或其发生的可能性。有几个管理计划共同构成了有效的风险缓解计划。这些包括：\n\
  \n*   事件响应计划 (IRP)\n*   业务连续性计划 (BCP)\n*   灾难恢复计划 (DRP)\n\n这些计划必须到位并得到妥善管理，以提供成功的网络安全风险管理计划。这些独立的计划协同工作，构成组织网络安全策略的结构。关于\
  \ `BCP` 和 `DRP` 中信息的使用方式将在 第 11 章 “灾难恢复与业务连续性” 中详细讨论。\n\n#### 事件响应规划\n\n在任何类型的不利事件发生前知道该做什么，可在真正的危机发生时实现更好的响应。就网络攻击而言，它们从不在预期时间发生，因此应制定\
  \ `事件响应策略 (IRP)`，以便员工在事件发生时能更成功地保护关键资产。该组织策略旨在为物理灾难、网络灾难或安全攻击情况下“谁在何时何地做什么”提供指导。`IRP`\
  \ 常被称为 `食谱`，因为每种预期事件都有其专属的解决方案。\n\n\n\nIRP 通常会首先寻求建立遏制事件的程序，然后实施程序以防止这些事件在未来再次发生。该过程的第一部分涉及事件的第一响应者。例如，IRP\
  \ 规定了事件发生时第一响应者应采取的行动。此类规范可能包括指示第一响应者通过阻止他人进入机房并通知相关人员事件正在发生或已发生，来保护关键机房资产。\n\n\
  ### NERC CIP-008\n\n对于电力公用事业，事件响应规划和报告受 NERC CIP-008 标准管辖。您已在前几章中了解了 NERC CIP 标准的其他部分。\n\
  \n根据 NERC CIP-008 标准，电力公用事业的 IRP 必须包含一个时间线，以确定经验教训并更新计划：\n\n*   恢复计划的激活条件\n*   响应者的角色和职责\n\
  *   一项或多项用于备份和存储恢复 BES 网络安全系统功能所需信息的流程\n*   一项或多项用于验证备份流程成功完成并解决任何备份故障的流程\n*   一项或多项用于保存数据（按网络资产能力）以确定触发恢复计划激活的网络安全事件原因的流程\n\
  *   事件报告流程定义和时间框架\n\n该标准进一步要求每个责任实体为 BES 网络安全系统实施通用控制，以识别、分类和响应网络安全事件。这些控制适用于高影响（大型控制中心）和特定中影响（较小控制中心、超高压输电和大型变电站以及发电设施）系统。该计划必须包含以下内容：\n\
  \n*   要求至少每 15 个月测试一次每个恢复计划\n*   要求至少每 15 个日历月测试一次用于恢复 BES 网络安全系统功能的代表性信息样本，以确保其可用且与当前配置兼容\n\
  *   对于高影响 BES 网络安全系统，要求至少每 36 个日历月通过在代表生产环境的环境中对计划进行操作演练，来测试每个恢复计划一次\n\n每个责任实体还必须在恢复计划测试或实际恢复完成后不迟于\
  \ 90 个日历日内，维护高影响 BES 网络安全系统和控制中心中影响 BES 网络安全系统的恢复计划，记录任何经验教训或无经验教训的情况，更新计划，并通知计划中具有明确角色的每个人员有关更新事宜。\n\
  \n在角色或职责、响应者或技术发生变更后的 60 个日历日内，如果该变更会影响执行恢复计划的能力，则必须更新计划，并通知计划中具有明确角色的人员。\n\n##\
