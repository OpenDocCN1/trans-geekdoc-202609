  \n     1. `Modbus`\n     2. `BACnet`\n     3. `DNP3`\n     4. `ICCP`\n\n# 第 3 章\n\
  \n安全 ICS 架构\n\n\n\n\n## 简介\n\n在上一章中，您了解了用于构建基本*运营技术 (OT)*网络结构的组件。本章将以这些基本信息为基础，解释这些组件是如何组织起来以生成安全的\
  \ OT 网络架构。这将涉及两个主要主题领域：\n\n* 网络分段与安全分区\n* 无线安全\n\n如前所述，生产工厂的最佳*网络安全设计*是将 OT 网络和\
  \ IT 网络在逻辑和物理上都相互隔离，且不提供从互联网通往 OT 网络的路径。这将降低远程攻击者通过 IT 网络访问 OT 网络所带来的风险。\n\n一个隔离的工业过程控制网络通常是一个相对安全可靠的网络环境。威胁通常仅限于自然和人为事故、物理访问攻击，以及不满员工相关的恶意活动。这些网络通常与互联网没有连接，而互联网是众多潜在威胁的来源。此外，它们基于的设备和软件，知晓并精通这些技术的人员比企业界的对应技术要少得多。\n\
  \n当在 ICS 运营技术与企业 IT 网络之间建立连接时，OT 网络的风险等级会显著增加。这是由于 IT 网络及其互联网连接向 OT 网络呈现了额外的攻击向量。因此，对于互联的\
  \ OT 和 IT 网络，通常采用的最佳安全选项是将企业 IT 网络与 OT 网络之间的网络连接限制在单一接触点，如图 3.1 所示。\n\n![图 3.1 连接\
  \ OT 和 IT 网络](img/c03f001.png)\n\n**图 3.1** 连接 OT 和 IT 网络\n\nIT 功能已成为 OT 网络不可或缺的一部分，以提供关键接口和交互。IT/OT\
  \ 网络互操作性正越来越多地被用于通过监控、记录保存、维护、规划和工作调度来最大化流程生产力。当然，与这些扩展/集成网络相关的网络威胁也在同步增加。\n\n##\
  \ 边界防护\n\n随着行业持续推进 IT/OT 互联，目标变为在两个网络之间建立*边界防护*，允许所需信息在网络间移动，同时保护 OT 网络免受 IT 网络、非\
  \ ICS 人员和互联网相关威胁的侵害。\n\n幸运的是，企业网络环境已经创建了许多可用于此目的的边界防护设备和技术。这些设备和技术包括：\n\n* 访问控制策略\n\
  * 网关\n* 路由器\n* 防火墙\n* 入侵检测系统 (IDS)\n* VLAN\n* 加密与隧道\n* 杀毒软件和反恶意软件产品\n* 网络隔离与分段技术\n\
  * DMZ（非军事区）\n* 代理\n\n列表中提到的所有项目都可以且应该应用于保护 ICS 免受外部世界的威胁。\n\n### 防火墙\n\n互联网段之间最常见的第一道防线是*防火墙*。这些设备由硬件和软件组合而成，用于控制不受信任或安全性较低的网络与受保护网络之间的网络流量。这是通过监控网络流量并对其应用访问规则来实现的，以允许授权流量通过。\n\
  \n防火墙可以通过各种方式在不同的网络布局中实现。防火墙可能是专用的*硬件防火墙设备*，也可能是内置在路由器或交换机中的功能，或者是实现在具有多个以太网接口的计算机中。它甚至可以是像其他应用程序一样安装在主机计算机上的纯*软件防火墙*。许多网络设备提供防火墙和安全功能，以及其他网络功能。\n\
  \n在企业或工业网络环境中，IT 管理员控制防火墙的安装和配置。网络防火墙的优势在于，它使管理员能够控制流向其网络上所有连接设备的信息流，如图 3.2 所示。\n\
  \n![图 3.2 网络防火墙](img/c03f002.png)\n\n**图 3.2** 网络防火墙\n\n用于 OT 环境的防火墙通常是专门构建的，用于专门监控\
  \ OT 流量，并允许或拒绝进入 OT 或其子网的流量。许多 IT 防火墙供应商在其产品中提供 OT 专用功能。使用防火墙进行 OT 安全的主要挑战在于实施适当的防火墙规则，以提供特定环境所需的保护。\n\
  \n防火墙通常充当网关设备，对网络应用程序和协议进行身份验证并授予访问权限。它们也可以配置为充当代理服务器、提供网络地址转换，并充当 DHCP 服务器。防火墙通常不仅过滤入站流量，还过滤出站流量。\n\
  \n配置好的防火墙将使用定义的规则提供*数据包过滤*，以拒绝或接受入站和出站数据包。这配置起来可能更具挑战性，但有效的*防火墙规则*对大多数网络的安全至关重要。\n\
  \n*数据包过滤防火墙*可以通过路由器建立，方法是配置数据包过滤规则，根据源地址、目的地址或端口号等因素允许或拒绝客户端访问。有两种类型的数据包过滤防火墙需要考虑：*静态数据包过滤*和*有状态数据包过滤*。\n\
  \n*静态*或*无状态数据包过滤防火墙*不跟踪两个设备之间连接的状态。它们的运作方式与任何*访问控制列表 (ACL)*大致相同。这使得这类防火墙比其他防火墙选项稍快一些。它们也往往相对便宜且易于维护。相反，静态数据包过滤防火墙提供的安全功能比其他防火墙选项少。\n\
  \n*有状态数据包过滤防火墙*确实跟踪实体之间的连接状态。这些防火墙收集网络连接信息并维护*动态状态表*，用于后续连接。如图 3.3 所示，这使得端口可以根据需要打开和关闭。一旦客户端完成通信会话，有状态数据包过滤防火墙就会关闭所用的特定端口，直到再次被请求。\n\
  \n较新的防火墙还将提供*服务质量 (QoS)*功能，允许根据特殊规则或策略对网络流量进行优先级划分和差别化处理。QoS 的一个常见用途是确保 VoIP 电话系统始终拥有足够的带宽用于电话服务，无论网络多么繁忙。\n\
  \n\n\n\n某些应用程序对延迟更为敏感，使用 QoS 可以确保这些应用程序始终拥有足够的优先级以维持数据包流向它们，从而防止连接中断。QoS 也可以是在繁忙网络上公平共享或分配带宽的一种方式。某些防火墙会将这种流量管理与\
  \ QoS 分开，但它们是相似的概念。\n\n较新的防火墙被称为*下一代防火墙*（*NGFW*），它们是将传统防火墙的功能（数据包过滤、状态检测和 VPN 感知及其他功能）与*深度包检测*（*DPI*）、内置入侵防御系统、来自外部来源的威胁情报以及应用程序感知/控制相结合的网络设备。\n\
  \n![FIGURE 3.3 Stateful firewall operations](img/c03f003.png)\n\n**图 3.3** 有状态防火墙操作\n\
  \n### 使用防火墙\n\nNIST 800-82 r2 标准《工业控制系统 (ICS) 安全指南》的建议在很大程度上依赖于使用防火墙来控制组织不同网络之间及内部的访问和流量。虽然\
  \ IT 网络通常实施防病毒软件和本地软件防火墙以提供纵深防御分段，但 OT 网络更常见的是采用工业防火墙来实现此功能。\n\n图 3.4 显示了部署在 IT\
  \ 企业网络及其 OT 网络之间的防火墙。请注意，在此示例中没有互联网连接。即便如此，仍实施了防火墙以限制网络间的连接并防止未经授权访问其资源。\n\n如果需要更高的互联网络安全性，可以在\
  \ IT 和 OT 网络之间安装网络路由器，并结合前一个示例中的防火墙。这种拓扑结构如图 3.5 所示，为试图访问 OT 网络的攻击者提供了双层阻隔。路由器位于防火墙的\
  \ IT 侧，以提供数据包过滤服务。\n\n![FIGURE 3.4 Internetwork firewall](img/c03f004.png)\n\n**图\
  \ 3.4** 互联网络防火墙\n\n![FIGURE 3.5 Internetwork router](img/c03f005.png)\n\n**图 3.5**\
  \ 互联网络路由器\n\n另请注意，此示例包含企业网络与互联网之间的连接。此连接至少也应通过路由器和防火墙配置进行保护。\n\n图 3.6 描绘了一个完全受防火墙保护的\
  \ OT/IT 网络配置。从图中可以看出，在 OT/IT 网络配置中，防火墙不仅用于过滤企业网络与互联网之间的流量，还用于过滤合并网络内部不同安全区域之间的流量。\n\
  \n![FIGURE 3.6 Implementing firewalls](img/c03f006.png)\n\n**图 3.6** 实施防火墙\n\n防火墙通常部署在\
  \ OT 和 IT 网络之间，以限制过程控制设备与组织企业网络计算系统之间的流量。将防火墙放置在此位置提供了两个重要功能：安全性和性能提升。防火墙可配置为对进入和离开\
  \ OT 网络的数据包移动提供高度控制。这反过来又减少了网络上非必要流量的水平，从而允许期望流量获得更高的吞吐量。本地防火墙可以安装在单个控制设备上（或其前端）。\n\
  \n安装边界保护设备时，应始终将其配置为默认拒绝所有流量，然后实施 `whitelisting` 策略，仅 `allow` 例外情况下所需的连接和流量。通常，这涉及防止授权与未授权的源/目的地址对之间的通信。\n\
  \n用于边界保护服务的防火墙应始终配置为根据源/目的地址、端口和服务阻止所有未经授权的通信。\n\n您还应注意，配置不当的防火墙可能会向 OT 网络通信中注入延迟，这可能会对其控制功能产生不利影响。虽然这在\
  \ IT 网络中通常不易察觉，但在 OT 网络中却可能造成灾难性后果。必须小心配置与 OT 网络关联的防火墙，使其不会给通信增加任何绝对必要之外的流量负担。\n\
  \n### 使用非军事区\n\n某些组织将其网络的一部分专门用于一种称为*非军事区*或*DMZ*的安全结构。DMZ 是一个独立的边界网络，它将一个网络与另一个网络隔离开来，同时允许访问面向外部的专用资源。图\
  \ 3.7 显示了典型的 DMZ 实现。\n\n![FIGURE 3.7 A DMZ](img/c03f007.png)\n\n**图 3.7** DMZ\n\n\
  如图所示，选定的服务器和其他资源被放置在 DMZ 中。这些资源被称为*堡垒主机*。堡垒主机可以是防火墙、路由器、服务器，或一组未受另一防火墙保护的计算机。\n\n\
  DMZ 通常用于在企业网络和 OT 网络之间提供隔离。DMZ 在两种网络类型之间创建了一个中立区域，根据组织的安全策略规范，限制企业网络与外部的信息交换。\n\n\
  企业网络需要访问的任何 ICS 服务器都应放置在 OT/IT DMZ 中，并且只有这些服务器应可从企业网络访问，如图 3.8 所示。防火墙中打开的端口应仅为企业网络所需特定通信绝对必需的端口。\n\
  \n![FIGURE 3.8 Minimum ICS/IT network connectivity](img/c03f008.png)\n\n**图 3.8**\
  \ 最小 ICS/IT 网络连接\n\n对 DMZ 的访问由一个或多个防火墙控制。在*单防火墙 DMZ*中，如图所示，防火墙必须是一个*多宿主*设备，能够提供三个独立的网络接口：\n\
  \n*   一个用于企业网络的接口\n*   一个用于 ICS 网络的接口\n*   一个用于 DMZ 网络的接口\n\n多宿主单防火墙 DMZ 通常优于其他安全结构，因为它们的实施成本相对较低。然而，在这种配置中，防火墙会成为整个网络的单点故障。如果防火墙被攻破，攻击者就获得了对整个网络的访问权限。只需要一个配置不当、留有开放端口的防火墙即可遭受攻击。\n\
  \n在*双防火墙 DMZ*中，如图 3.9 所示，防火墙位于 DMZ 的两侧，用于过滤内部网与 DMZ 之间以及 DMZ 与互联网之间移动的流量。这些防火墙用于将公共流量路由到\
  \ DMZ，将内部网络流量路由到内部网。\n\n双防火墙 DMZ 配置提供了更高级别的安全性，因为攻击者必须攻破多个设备才能危及内部网。如果他们成功攻破了第一个防火墙，他们只能获得对\
  \ DMZ 中面向公共资源的访问权限。\n\n![FIGURE 3.9 A dual firewall DMZ](img/c03f009.png)\n\n**图\
  \ 3.9** 双防火墙 DMZ\n\n所有发往 ICS 的入站流量都应通过 DMZ 路由。ICS 防火墙还应配置为提供出站过滤，以防止伪造的 IP 数据包离开\
  \ DMZ。回想一下，伪造通信常用于 DoS 攻击。防火墙必须配置为检查出站数据包，以确保其 `source IP addresses` 符合 DMZ 的要求。如果不符合，则丢弃该数据包。\n\
  \n### 代理\n\n\n\n\n## 代理服务器\n\n`proxy` 是一种屏障，可防止外部人员进入局域网，并防止内部人员直接连接到外部资源，如 图 3.10\
  \ 所示。相反，它允许客户端建立通过它路由的间接网络连接。客户端连接到代理服务器，可能需要有意识的身份验证，也可能不需要，并请求来自另一台服务器的资源。代理服务器将通过从其自身的缓存副本返回请求的资源，或将请求转发给另一台服务器（在可能修改请求之后）来处理该请求。\n\
  \n![图 3.10 代理服务器的操作](img/c03f010.png)\n\n**图 3.10** 代理服务器的操作\n\n发送到互联网的所有寻址信息都将使用代理服务器的\
  \ IP 地址。由于未使用请求资源的客户端的 IP 地址，外部入侵者无法访问本地主机。\n\n代理过滤是一个比数据包过滤复杂得多的过程。在此过滤过程中，每个数据包都会被拆解、评估并重新组装，这使得这种类型的连接比其他防火墙类型慢得多。代理过滤防火墙被配置为查看完整的数据包，以检查一致性、应用程序类型和适当的端口。试图通过这些端口传输到客户端的数据必须与代理过滤防火墙的预期相匹配，否则未知数据包将被丢弃，连接将中断。\n\
  \n如 图 3.11 所示，可以安装代理服务器，通过充当中介来隔离 OT 网络与企业网络产生的外部请求，从而提供边界保护。代理阻止了对 OT 网络的直接连接，并处理确定哪些被请求的资源应被处理的任务。\n\
  \n![图 3.11 使用代理服务器进行边界保护](img/c03f011.png)\n\n**图 3.11** 使用代理服务器进行边界保护\n\n`纵深防御策略`\
  \ 是指包含多种不同的重叠安全机制，可将攻击者攻破单一机制的影响降至最低。在本章后续章节中，您将了解 IT 和 OT 环境中的安全分区概念。这些概念最终将构建成\
  \ `Purdue ISA-95 参考架构`。这些概念将扩展以包含 `IIoT` 和 `云服务` 变体。\n\n除了这些示例中描述的 DMZ、路由器和防火墙外，IT\
  \ 和 OT 网络都应采用下一节讨论的安全拓扑策略之一，以最大化整体纵深防御策略。\n\n### 安全拓扑\n\n如前所述，OT 和 IT 网络的意图和操作截然不同。OT\
  \ 系统需要 `实时数据`，而 IT 网络则不需要。OT 网络关注可用性、完整性，然后是机密性 (AIC)，而 IT 网络旨在首先提供机密性，其次是完整性，最后是可用性\
  \ (CIA)。\n\n同样，在这两个网络上进行的活动类型从根本上讲是相互对立的。IT 网络旨在创建、存储和操作数据，而 OT 网络旨在提供实时测量和控制功能。\n\
  \n当 IT 环境中发生延迟时（例如屏幕上显示 Windows 沙漏在旋转），用户生产力会下降。然而，如果类似的延迟发生在 OT 环境中，后果将不堪设想：\n\n\
  *   生产中断。\n*   产品不符合质量标准，必须报废。\n*   生产设备损坏或毁坏。\n*   人员受伤或死亡。\n\nIT 企业网络通常比其 OT 对应网络代表大得多的安全风险。OT\
  \ 网络倾向于运行在比 IT 网络使用的更冷门的设备、操作系统、应用程序和网络上。此外，历史上 OT 网络从未以任何方式连接到公共互联网。\n\n由于 OT 网络的\
  \ AIC 特性，必须小心不要向该网络部分引入会在需要时延迟数据移动和访问的安全功能。这包括添加防病毒/反恶意软件产品、缓慢的防火墙/代理服务，或入侵检测/防御\
  \ (IDS/IPS) 设备和服务等典型的企业措施。然而，有许多方法可以使连接网络的 IT 侧更安全，从而使 OT 网络更安全。\n\n安全的 IT 网络设计通常将网络段组织成多层安全结构。刚才介绍的每种网络安全结构都可能是给定组织网络设计的一部分。此外，组织网络的某些部分（如其内部网）可能根据与每个段相关的安全需求细分为多个段。\n\
  \n连接到网络的所有智能设备都必须具有能够将设备连接到网络传输介质的 `网络接口适配器`。这包括提供插头和插座等物理连接方案，以及提供设备与跨传输介质（电缆或无线电波）传输的信号之间的电气兼容性。\n\
  \n此外，网络通常包含其他 `连接设备`，用于将网络的不同部分连接在一起并执行不同的网络管理功能。这些连接设备通常是交换机或路由器。在大型或复杂的网络中，您可能还会发现称为\
  \ `网桥` 的设备，用于互连网络的各个部分。\n\n虽然每个设备都提供物理连接，但它们也各自具有特定的操作方法，使其适合用于特定的网络应用。在某些情况下，功能更多的设备可用于执行功能较少的设备的功能。\n\
  \n### 网络交换机\n\n`网络交换机` 是在 OSI 模型第 2 层运行的连接设备。^(\\*) 它们旨在将 `网络设备` 连接在一起以形成局域网。`企业网络`\
  \ 通常采用交换机组合来分割网络并建立高效的数据流量。它们可以与其他网络连接设备结合使用，也可以通过主干布线直接连接到服务器室。\n\n例如，一家跨越办公楼多层的公司可能会在每层楼使用单独的交换机，为该楼层的所有设备提供连接。各楼层的交换机也将通过交换机或路由器相互连接。图\
  \ 3.12 显示了典型的网络交换机连接方案。\n\n![图 3.12 网络交换机连接](img/c03f012.png)\n\n**图 3.12** 网络交换机连接\n\
  \n交换机收集 MAC 地址信息以跟踪连接到它们的设备。当它们与这些设备交互时，会将其 MAC 信息记录在一个称为 `MAC 地址表` 的板载内存结构中。\n\n\
  当交换机在其某个 `端口` 接收到网络信息包时，如果知道接收者的地址，它可以将该信息定向发送给预期的接收者。如果地址未知，交换机将向其所有端口 `广播` 该信息。由于通过交换机传输的信息通常仅发送到预期端口，因此整个网络的性能得到了极大提高。\n\
  \n\n\n\n\n## 交换机和 VLAN\n\n交换机还可用于创建逻辑上安全的 `虚拟局域网` (`VLAN`)。`VLAN` 是一种安全拓扑，通过限制网络数据包的移动，使其仅在指定端口之间传递，从而限制网络流量的可见性。\n\
  \n网络交换机通常根据其配置选项分为两类。`非托管交换机` 是 `即插即用` (`PnP`) 设备，不包含任何用户配置选项。这些设备通常价格低廉，旨在用于家庭和小型办公室环境，因此极少在企业\
  \ IT 网络中发现。\n\n另一类交换机称为 `托管交换机`。这些设备内置可编程管理功能，使管理员能够针对其将要使用的特定网络环境进行配置。因此，它们提供某种管理控制台供管理员设置参数。常见的管理接口包括以下几种：\n\
  \n*   **命令行编程**：此格式提供了一种直接的基于文本的方法来编程交换机的设置。命令行编程要求管理员了解可用于设置不同参数的 `指令集` 和参数变量。\n\
  *   **基于浏览器的界面**：这些界面提供了一种图形化的、菜单驱动的工具，用于设置关键交换机参数。使用 `简单网络管理协议` (`SNMP`) 工具，允许管理员通过远程客户端的\
  \ Web 浏览器访问交换机的参数。\n\n## 路由器\n\n`路由器` 是网络连接设备，其转发网络信息的方式与交换机类似。然而，与交换机不同的是，路由器可以跨不同网段转发信息，如\
  \ 图 3.13 所示。这使路由器能够通过一种称为路由的过程将不同的网络连接在一起。例如，路由器通常用于将小型住宅网络连接到世界上最大的网络——互联网。\n\n\
  ![图 3.13 网络路由器](img/c03f013.png)\n\n**图 3.13** 网络路由器\n\n路由器是基于微处理器的智能设备，用于控制网络间的数据流。微处理器是一种专用设备，经过优化可作为\
  \ `路由处理器` 运行。与其他基于微处理器的设备一样，路由器包含用于启动的 `ROM BIOS`、用于保存操作配置参数的 `NVRAM CMOS` 配置区，以及存储在闪存单元中的板载操作系统。\n\
  \n路由器还包含不同区段的 `DRAM` 内存，用于存放消息路由信息，并在其端口间缓冲数据流。路由信息存储并更新在一个称为 `路由表` 的逻辑内存表中。\n\n\
  每个网段均通过路由器的一个物理端口接口连接。这些接口可实现为不同类型的物理/逻辑接口规范，例如 `RJ45/8P8C` 以太网连接端口。\n\n几乎所有路由器都具有一个物理接口，可用于连接外部控制台电缆以进行配置。它们还可能包含一个异步\
  \ `RS-232` 串行硬件端口，供管理员执行远程路由器管理功能。\n\n在大型网络中，路由器使用 `路由协议` 与其他路由器通信，以构建和维护其路由表。这些表用于记录不同网络位置之间的最佳路由。与交换机中使用的\
  \ `MAC` 表不同，路由表存储设备间路径的地址和跳数信息。\n\n## 安全分区模型\n\n`安全区域` 是一个网段，根据网络资产（资源和数据）的安全漏洞或关键性，为其提供特定级别的安全性。其理念是将更有价值或更关键的网络资产置于提供更多保护的网段或安全结构中。`网络分段`\
  \ 也称为 `分区`，安全计划的各个层称为 `安全区域`，如 图 3.14 所示。\n\n`安全拓扑` 由组织的各个网络安全区域互联组成。安全拓扑超越了简单的网络拓扑，因为它们专门设计用于保护网络每个唯一网段内的关键资产。必须完整规划并实施互补的网络策略和安全拓扑，才能为组织资产提供有效的运行和安全性。\n\
  \n![图 3.14 网络分区](img/c03f014.png)\n\n**图 3.14** 网络分区\n\n良好的安全拓扑旨在将组织资产（如服务器、防火墙、路由器、交换机和客户端工作站）定位并连接在受保护的网段内，以防止未经授权的访问或攻击。\n\
  \n组织的安全拓扑必须基于其安全目标的总体意图。这些目标通常由产品安全官或系统信息安全官 (`CISO`) 确定。他们负责在网络的安全风险与预算限制之间取得平衡，将这些风险降低或最小化至可接受的水平。这需要周密的规划、部门协调、员工认同和管理层支持。\n\
  \n例如，某组织可能需要宽松的远程访问和互联网连接以有效开展业务。因此，在整个组织中严格限制远程访问和互联网访问将不是该组织可接受的选择。\n\n然而，逻辑上需要受限访问的组织部门，如产品开发、会计、人力资源和高管部门，可通过实施网络分段来创建提供网络隔离的特殊安全区域，从而使其更加安全。\n\
  \n应创建可视化拓扑图，以显示服务器、防火墙、路由器、交换机和 `VLAN` 等关键资产，以及它们支持的子网、安全区域或部门。该图应清晰标识分段网络和采用静态\
  \ `IP` 地址配置的设备。将所有这些要素以图形格式显示后，设计缺陷应变得显而易见，从而允许将关键资源重新定位到更合适的区域或部门。\n\n大多数 IT 网络分区的逻辑模型可视为类似于\
  \ 图 3.15 所示的多层 `信任区域` 安排。在此示例中，有四个安全区域按安全要求递增的顺序呈环状排列。内部区域存放最安全的资产，受周围安全层的保护。同样，每个后续层为其相邻的环提供安全保护。\n\
  \n![图 3.15 分层区域](img/c03f015.png)\n\n**图 3.15** 分层区域\n\n通常，给定的安全区域将由具有共同安全特征的相似网络资产组成。这些特征包括共享的数据机密性和完整性要求、访问控制，以及审计、日志记录和监控要求。然而，每个区域可包含任意数量的子网，并覆盖任意数量的物理位置。通常用于创建区域间\
  \ `分区` 的技术包括交换 `VLAN`、防火墙或路由器等设备，如 图 3.16 所示。\n\n![图 3.16 区域分区技术](img/c03f016.png)\n\
  \n**图 3.16** 区域分区技术\n\n\n\n\n\n## 网络安全拓扑与区域划分\n\n### 单向安全网关与数据二极管\n\n在安全要求极高的应用中，可能会使用称为**单向安全网关**或**数据二极管**的网络设备，在具有不同安全分类的网络或网段之间创建单向连接，如图\
  \ 3.17 所示。\n\n![FIGURE 3.17 A data diode](img/c03f017.png)\n\n**FIGURE 3.17** A\
  \ data diode\n\n### 数据区域与分层安全策略\n\n数据通常被视为企业组织最有价值的资产。这包括从员工信息、财务信息、客户信息到健康信息等不同类型的数据。因此，信息的分类范围可以从机密、内部到公开。当然，机密信息存储在拓扑结构的最内层区域，称为**数据区**。这通常涉及包含机密客户数据的数据库、高度安全的设备、基础设施、策略和政策。\n\
  \n访问该区域中的资源必须经过授权和认证。数据存储加密也在该区域采用。**应用层加密**是首选，但如果没有应用层加密选项，则应采用**文件系统加密**。\n\n\
  组织的机密数据子集通常会定期移动到其他安全区域进行处理和分发。这些内部层的安全策略因分配给资产的机密性和可用性要求而异。\n\n例如，紧邻数据区外侧的**应用区**包含用于处理数据的应用程序。该区域通常部署文件服务器。该区域的信息仍被视为组织的内部数据，受到比“公共”数据更严格的安全措施保护。\n\
  \n与数据区一样，访问应用区需要用户授权和认证，以及服务认证。通常在此级别部署入侵检测系统，以便在发生入侵事件时通知管理员。\n\n将应用区与最外层安全层（通常是互联网）隔开的**呈现区**是组织用户网段的所在地。这可以包括专用于管理局域网的网段。呈现区还用于托管公共接口，如提供“公共”信息的\
  \ Web 服务器，以及组织的传输安全工具和结构。\n\n访问该区域的资源仍然需要认证，即使内容被指定为公共。呈现层实施的常见安全措施包括：\n\n*   **防火墙**：防火墙用于控制呈现区与应用区/互联网区之间，以及区域内子网之间的信息流。仅接受来自区域内部或相邻区域的访问请求。\n\
  *   **病毒和恶意软件扫描器**：该区域的所有资产都应被要求具备防病毒和反恶意软件保护。\n*   **审计工具**：这些工具在此级别实施，用于记录重要的应用程序和安全事件，以便问责和取证。记录的数据绝不能包含被分类为机密的信息。\n\
  *   **加固技术**：该区域的所有资产都应通过对其及其应用程序应用加固技术来保护。这些技术将在本章后面详细介绍。\n*   **传输安全结构**：这些是 DMZ、VPN\
  \ 或反向代理，用于为外部用户提供认证（这些结构将在本章后面讨论）。\n*   **数据传输加密**：所有被分类为机密的数据在通过网络移动时必须加密。必须使用安全协议（如\
  \ HTTPS 和 SSL）替换不太安全的协议（如 HTTP 和 SFTP）。\n\n在此安全拓扑示例中，最外层的**互联网区**代表不受控（互联网）或外部受控（第三方合作伙伴）的网络。该区域包括组织无法控制的所有网络。因此，内容可以是公开的，也可以是属于受信任合作伙伴或客户的机密数据。该区域的访问要求可以是经过认证的，也可以是匿名的。\n\
  \n### 扁平网络拓扑\n\n并非每个企业网络都采用分层、分段的安全拓扑设计。图 3.18 展示了一个通用的**扁平网络拓扑**，许多企业网络（甚至一些非常大的网络）都在使用。扁平网络策略也广泛应用于\
  \ OT 网络。\n\n![FIGURE 3.18 A flat network configuration](img/c03f018.png)\n\n**FIGURE\
  \ 3.18** A flat network configuration\n\n该模型基本上最小化了网络中连接设备（路由器和交换机）的使用。取而代之的是，使用集中式交换机将网络节点连接在一起。在大多数情况下，这些网络通常通过单个路由器与互联网隔离。\n\
  \n这种策略确实降低了网络实施和维护的成本，并降低了管理操作的复杂性。然而，它也导致网络安全级别非常低。在扁平网络中，流量可以在所有网络节点之间自由移动，为所有连接用户提供访问权限。\n\
  \n实际上，它是一个大的广播域。任何发送 ARP 广播以查找有效网络 IP 地址的设备都会收到回复。这意味着如果攻击者获得网络访问权限，他们可以看到网络中的每个资产，包括服务器、终端设备和数据。凭借合适的技能和足够的时间，他们可以利用所有这些设备。\n\
  \n如果恶意软件或恶意代码（如蠕虫，例如著名的 Stuxnet 病毒）获得网络访问权限，则没有任何东西能阻止它蔓延到整个网络。此外，对于源自网络内部的任何恶意活动，几乎没有保护措施。\n\
  \n不幸的是，大多数 OT 网络都是建立在大型扁平网络拓扑之上的。这使得网络攻击或干扰在初始渗透发生后能在网络中快速传播。扁平拓扑还使 OT 网络容易受到网络地图上未显示但构成重大威胁的威胁，当过程控制系统联网时这些威胁会显现。这些威胁包括可能进入工厂并与\
  \ ICS 网络通信的无线设备，以及基于 USB 的设备被引入 ICS 系统的能力。\n\n#### OT 安全分区\n\n在 OT 网络内部，应分析流程以确定过程控制网络是否可以按本章前面所述组织成安全段。如果可能，OT\
  \ 网络应根据管理权限、统一信任级别或网络流量划分为**安全区域**。与 IT 网络一样，良好分段的 OT 网络可以使攻击者更难成功入侵系统，并最大限度地减少非恶意错误的影响。\n\
  \n考虑本章前面介绍的多层纵深防御网络安全拓扑。对于 OT 网络，通常不需要高度受保护的数据库层。相反，ICS 安全拓扑更有可能将网络分段为运营区、控制区、DMZ\
  \ 和非 ICS 区，如图 3.19 所示。\n\n![FIGURE 3.19 ICS security zones](img/c03f019.png)\n\n\
  **FIGURE 3.19** ICS security zones\n\n\n\n\n在本例中，DMZ 并非位于企业网络的外部安全级别与不受控的互联网之间。相反，它被置于更安全的\
  \ OT 网络与可信度较低的企业 IT 网络之间。应在企业网络与互联网之间创建另一个 DMZ。\n\n#### ICS 参考架构\n\n在考察了本章为 IT 和\
  \ OT 网络呈现的所有网络模型后，您可能仍会疑惑：如何实际实施这些概念以创建一个安全的 IT/OT 网络环境？\n\n在第 1 章“工业控制系统”中，您已简要了解了\
  \ *Purdue ANSI/ISA 95 参考模型架构*。它已成为互联 IT 和 OT 网络的国际标准。\n\n回顾一下，该模型将通用 IT/OT 网络定义为五个层级，范围从工艺与传感器/执行器级别延伸至业务、规划与物流网络级别。在此过程中，它还展示了每个层级上发生的设备类型、网络连接和业务操作。\n\
  \n对于本次安全分区讨论而言，最感兴趣的区域是第 4 级与第 3 级之间描绘的区域，如图 3.20 所示。这是放置 DMZ 以将网络的业务规划与物流部分与制造运营与管理部分分隔开的地方。DMZ\
  \ 在区域的每一端放置一台防火墙，并编程不同的规则集，以便为每个接口提供所需的安全功能。\n\n![FIGURE 3.20 Where OT meets IT](img/c03f020.png)\n\
  \n**图 3.20 OT 与 IT 的交汇处**\n\n此配置还使得入侵者更难攻破这两台设备以到达网络内部。在某些组织中，这两台防火墙可能由两位不同的管理员管理：IT\
  \ 网络管理员可能负责管理企业防火墙，而过程控制管理员控制 ICS 防火墙。\n\n##### 扩展的 ISA-95 结构\n\n基本的 ISA-95 结构常被扩展以满足特定组织需求所带来的安全要求。例如，如果组织拥有强大的互联网业务，例如提供\
  \ B2C 和/或 B2B 服务的企业网站，则应扩展网络模型，以提供额外的企业 DMZ 将组织的企业网络与互联网隔离开来，如图 3.21 所示。\n\n![FIGURE\
  \ 3.21 Securing the enterprise zone](img/c03f021.png)\n\n**图 3.21 保护企业区域**\n\n如图\
  \ 3.22 所示，它也通过增加区域来提供特定服务而得到扩展：\n\n*   **数据库区域**：如前所述，企业网络应分层以提供纵深防御策略，例如将存放最敏感数据的数据库隔离在网络的最内层区域。\n\
  *   **监控区域**：创建这些区域是为了监控处理和存储生产信息的区域。在这种情况下，在第 3 级和第 4 级均增加了监控区域。这两个区域均由一台防火墙和一个入侵检测系统\
  \ (IDS) 组成。\n*   **安全区域**：正如第 1 章所述，生产系统通常包含一个独立的仪表与控制系统 (SIS)，专门用于工艺的运行安全。当纳入 ISA-95\
  \ 架构模型时，该系统显示为独立的一级，位于结构底部，即工艺与 OT 传感器、执行器和控制器所在的位置。之所以显示在此级别，是因为 SIS 必须是一个独立的冗余系统，与\
  \ OT 网络断开连接（物理隔离/气隙隔离）。\n\n![FIGURE 3.22 Additional ISA-95 zones](img/c03f022.png)\n\
  \n**图 3.22 附加的 ISA-95 区域**\n\n##### 演进的架构模型\n\n被称为 *Industry 4.0*（工业 4.0）的行业趋势推动\
  \ ICS 环境开始将更新技术集成到其 IT/OT 网络拓扑中。这些技术包括云服务、边缘计算和先进的 5G 无线网络以及其他智能设备技术。这一趋势产生了标准安全架构的许多变体，包括一个三部分的\
  \ *Industrial Internet of Things* (*IIoT*) 参考架构，如图 3.23 所示。\n\n![FIGURE 3.23 IIoT\
  \ Purdue Architecture Model](img/c03f023.png)\n\n**图 3.23 IIoT Purdue 架构模型**\n\n\
  该模型的 IIoT 版本将分层 Purdue 模型的五个级别重新归类为三个截然不同的水平层级：\n\n*   **边缘层**：该层包含 Purdue 模型的第\
  \ 0、1 和 2 级功能。\n*   **平台层（云）**：该层通常是一个平台即服务 (PaaS) 云，包含数据存储、分析系统和网络通信设施。该层取代了第 3\
  \ 级。\n*   **企业层**：该层代表组织的 IT 网络，包括其服务器、用户设备和互联网连接。该层对应 Purdue 模型的第 4 级和第 5 级。\n\n\
  除了位于边缘层的传统传感器和执行器外，智能 IIoT 传感器和执行器可以直接与平台层通信，或通过 IIoT 网关通信。企业层（也可能是云环境）也直接与平台层通信。\n\
  \n欧洲联盟网络安全局 (ENISA) 提出的一个 IIoT/Purdue 集成版本修订了分层模型，通过将 IIoT 控制平台与传统的 ISA-95 第 3 级功能相结合，以适应\
  \ IIoT 设备的运行。图 3.24 描绘了 ENISA 模型。\n\n目前，尚无广泛接受的 ISA-95/IIoT 集成标准。然而，世界各地的 ICS 标准组织正在致力于\
  \ ISA-95 模型的整体替代方案，以及将 IIoT 技术集成到模型中并保持分段和传统 IT/OT 数据移动控制的混合解决方案。\n\n![FIGURE 3.24\
  \ IIoT Purdue Architecture Model](img/c03f024.png)\n\n**图 3.24 IIoT Purdue 架构模型**\n\
  \n### SANS ICS410 参考模型\n\nSANS（系统管理、审计、网络与安全）组织创建并发布了 Purdue 模型的一个扩展版本，命名为 ICS410\
  \ 参考模型。该扩展参考架构（如图 3-25a 所示）为向 OT 环境添加云技术和其他技术进步，以及通过 IT 网络将 OT 数据不断向组织上层推送的日益增长的需求做出了规定。\n\
  \n与原始的 ISA-95 Purdue 模型一样，ICS410 模型将 IT/OT 设备和网络划分为功能层，并在分界点部署适当的网络安全设备和系统。然而，它比\
  \ Purdue 模型走得更远，将第 0 级至第 2 级层划分为独立但分离的孤岛（单元/生产线/工艺）。ICS410 还将安全系统作为本地第 0-2 级孤岛的一部分。\n\
  \n\n\n\n该模型包含用于集成云服务和其他 WAN 通信通道的控制，以适应更大或广泛分布的站点。传统 Level 0-2 与 Level 3 之间的划分，通过在\
  \ Cloud/WAN 系统两侧设置的边界保护来强制执行。在 Level 0-2 侧建立次要执行边界，而在 Level 3 侧应用主要边界执行解决方案。组织的管理服务器、HMI、工程站、测试和预演系统、远程访问以及网络安全运营被划分到\
  \ Level 3 层的子层中。\n\n![FIGURE 3.25a The SANS ICS410 Reference Architecture](img/c03f025b.png)\n\
  \n**图 3.25a** SANS ICS410 参考架构\n\n与 Purdue 模型的更高级版本一样，DMZ 在 ICS410 模型中被战略性地部署，以提供\
  \ A 到 B 的推送和 B 到 C 的拉取，但在所有 IT 和 OT 层之间不提供 A 到 C 或 C 到 A 的通信路径。防火墙是该模型 Layer 3 和\
  \ Layer 4 之间的首选控制设备。这些防火墙应配置为阻止进出 OT 网络的所有流量，并为最小必要流量实施显式允许规则。Level 3 和 Level 4\
  \ 之间，以及 Level 4 和 Level 5 之间也需要部署防火墙。\n\n包括多因素认证在内的额外认证方法，应用于所有通往 OT 网络的访问路径。应对进出\
  \ OT 网络的所有文件执行恶意软件检查。同样，进出 OT 网络的所有流量都应被记录。最后，Level 4 以下不应允许互联网访问。\n\n## 网络分段\n\n\
  *网络分段* 是一种子网划分技术，用于根据组织的职能划分将网络分成分层段。例如，处理高度机密信息的部门通常没有充分理由直接与其他非涉密部门联网。\n\n通常，使用物理防火墙和路由器来创建网络分段，以控制网络层级（段）之间的流量流动。**图\
  \ 3.25** 描绘了一个通用的分段业务网络。在该示例中，路由器配置为与互联网连接，并将 IP 地址在 134.141.x.x 范围内的所有数据包传递给本地网络内指定的子网。当数据包到达子网时，它会被地址中指定的第四个八位字节（0-254）的主机接受。\n\
  \n![FIGURE 3.25 A segmented network](img/c03f025a.png)\n\n**图 3.25** 分段网络\n\n就我们的目的而言，网络分段的主要优势是通过使段的内部结构对其他网络段和外部世界不可见，从而增加了安全性。分段网络将限制入侵企业网络的深度，并最小化攻击的传播。\n\
  \n然而，安全性增强并非网络分段的唯一优势。由于限制了来自其他段的流量，本地段内的性能水平也会提高。另一个优势是分段将局部故障隔离在段内，使其更易于检测、排查和修复。然而，分段也会影响网络的整体性能，并需要额外的管理。\n\
  \n在以下章节中，我们将探讨另外两种也可用于创建网络分段的方法：NAT 分段和使用第 2/3 层交换机的网络虚拟化。\n\n### 网络地址转换分段\n\n*网络地址转换\
  \ (NAT)* 是大多数路由器、服务器和防火墙的功能。虽然 NAT 的主要目的是将内部网络的 IP 地址对外部网络屏蔽，但它也提供了一种简单直接的方法来分割组织内部网的物理结构。**图\
  \ 3.26** 说明了一个 NAT 分段网络。\n\n![FIGURE 3.26 A NAT-segmented network](img/c03f026.png)\n\
  \n**图 3.26** NAT 分段网络\n\n例如，在一个按功能分段的网络中，可以安装 NAT 防火墙为既需要最低安全性又需要互联网访问的部门提供分段，而不使用其他安全协议。\n\
  \n然而，NAT 并非安全万能药。它需要仔细配置，且提供的安全性有限。事实上，NAT 会妨碍您可能想在 LAN 上使用的许多其他安全协议。主要是，NAT 无法与任何加密\
  \ IP 信息的协议良好配合。这使得诸如 *点对点隧道协议 (PPTP)* 之类的隧道协议与 NAT 防火墙不兼容。\n\n最流行的协议之一 *IPSec* 采用\
  \ *认证头 (AH)* 协议来防止传输中的数据包被篡改。由于 NAT 旨在更改源 IP 地址，如果在同一网段上使用，IPSec 认证将会失败。此外，IPSec\
  \ 采用 *封装安全载荷 (ESP)* 在 *传输模式* 下检查 IP 地址，如果 NAT 转换了源 IP 地址，这也会失败。\n\n任何将源 IP 地址与认证密钥绑定的协议，都将无法认证或协商会话，因为\
  \ NAT 会更改源 IP 地址。这对 *互联网密钥交换 (IKE)* 以及 *证书颁发机构 (CA)* 同样适用。同样，由于 *文件传输协议 (FTP)* 将源\
  \ IP 地址转换为 ASCII 文本，它也与同一网段上的 NAT 不兼容。\n\n然而，可以使用一种称为 *NAT 穿越 (NAT-T)* 的 UDP 封装技术，跨\
  \ NAT 网关建立 IPSec 连接。如前所述，NAT 设备会改变导致数据包被丢弃的数据包真实性。NAT-T 添加一个未加密的 UDP 头来封装 IPSec\
  \ ESP 头。这导致数据包被视为普通 UDP 数据包，从而通过网关。NAT-T 操作需要三个端口开放：UDP 端口 4500 (NAT-T)、UDP 端口 500\
  \ (IKE) 和 IP 协议 50 (ESP)。\n\n### 网络虚拟化\n\n并非所有网络结构都是表面看起来那样。*虚拟局域网 (VLAN)* 是覆盖在一个或多个物理\
  \ LAN 之上的逻辑局域网。可以使用虚拟化软件将一个物理 LAN 划分为多个逻辑 LAN，或将多个物理 LAN 组织成一个逻辑 LAN。在这两种情况下，虚拟\
  \ LAN 的组织和运行可能与其运行所在的实际硬件几乎没有相似之处。每个虚拟 LAN 由一个 *VLAN ID* 标识，例如 VLAN10。\n\nVLAN（连同\
  \ VPN 和 VPLS）是 *基于协议的虚拟网络结构*。作为一种安全拓扑，VLAN 通过限制指定端口和分组之间的流量流动，限制了网络流量的可见性。这些结构通常使用第\
  \ 2 层管理型交换机创建，沿逻辑或功能通信链分离网络段，而不管其物理位置如何。交换机上的物理端口被分配给特定用户组以创建其自己的段。这使得逻辑 VLAN 组能够跨越多个物理网络段，而无需使用防火墙。\n\
  \n\n\n\n\n#### VLAN 示例\n\n例如，一个组织的财务部门可以连接到一个专门为财务组建立的唯一 VLAN。该 VLAN 被创建为一组特定的交换机端口，如\
  \ 图 3.27 所示。在此示例中，交换机端口被配置为创建三个独立的 VLAN：高管网络（`VLAN10`，端口 1 和 2）、财务部门（`VLAN20`，端口\
  \ 3、4 和 5）以及销售部门（`VLAN30`，端口 6、7 和 8）。\n\n![图 3.27 VLAN 组织示例](img/c03f027.png)\n\
  \n**图 3.27** VLAN 组织示例\n\n在虚拟局域网中，数据包属于 VLAN，而不属于网络设备。在此示例中，财务部门资产连接到配置为 `VLAN20`\
  \ 的物理交换机端口。因此，交换机将仅把财务数据包分发到指定的 `VLAN20` 端口，即使组成员位于组织网络中地理位置不同的区域。\n\n连接到给定 `VLAN\
  \ 端口` 的设备无法与网络中其他 VLAN 的设备进行通信。如果其他 VLAN 中的设备请求一个位于财务 VLAN 内的 MAC 地址，该请求将在交换机中被过滤掉，永远不会到达网络。因此，无法建立连接。\n\
  \n#### 网络隔离\n\n仅仅将网络划分为段实际上并不能提高网络的安全性，因为流量仍可从一个子网移动到另一个子网。然而，当分段与网络隔离策略相结合时，这两种策略相互配合，可将网络不同区域的攻击面降至最低。\n\
  \n*网络隔离* 涉及制定并强制执行通信 `规则集`，以控制网段之间的访问（即控制允许哪些计算设备跨越网段边界与其他设备通信）。它们还控制何种类型的信息可以在安全区域之间移动。这些规则通常基于数据源和目标信息、数据类型或数据内容。\n\
  \n在识别出网络的各个段后，下一步是确定每个区域要采用的控制技术。这些技术包括可阻止或过滤流量的 `主动控制` 以及监控活动并进行审计或报告的 `被动控制`。这也是确定为每个段实施何种规则的时刻。这可以通过分析组织业务需求所决定的通信路径来完成。\n\
  \n一般来说，在设计分段/隔离网络环境时，有几条基本建议需要牢记：\n\n*   *根据通用信息安全要求对网络进行分段*。此处的总体目标是为最敏感的数据创建最安全的段。安全性较低的数据可以存储或处理在安全性较低的段中，而公共数据可以放置在仅具有最低安全措施的段中。基于此方法绘制网络图，并查看对任何段的访问是否过于开放或过于严格。\n\
  \n*   *根据需要实施安全控制段*。虽然似乎创建的安全层越多越好，但从前面的讨论中你应该能看出这并不总是正确的。创建适当数量的安全段，以充分保护组织数据的不同分类。创建过少的段可能会使某些数据比应有的更脆弱，而创建过多的段则会拖累组织的业务流程。\n\
  \n*   *基于最小权限原则建立访问控制*。正如本章前面的讨论中提到的，你可能需要为受信任的供应商提供对企业 IT 网络的第三方访问。然而，你应该将他们的访问权限限制在绝对需要的网络区域，以高效地开展与组织关系相关的业务。\n\
  \n*   *确定每个段可接受的安全级别*。在网络环境中，试图完全阻挡每一种威胁从来都不切实际。相反，应确定哪些活动很重要，为这些活动实施具有可接受通信路径的策略，然后阻止其他所有内容。这可以通过创建\
  \ `允许列表` 来指定什么网络流量可以访问不同的段来实现，而不是使用指定什么网络流量不能访问的 `拒绝列表`。此外，在向用户或组授予段访问权限时，应应用“最小权限”和“需知”原则。\n\
  \n分段和隔离可以通过多种技术和手段来实现，包括 VLAN、使用加密协议的 VPN 以及数据二极管。这些技术应应用于网络的多个层，从数据链路层到应用层。\n\n\
  ### 分区\n\n*分区* 是一种网络隔离形式，涉及将网络划分为多个较小规模的网络（广播域），并在它们之间创建过滤器，仅允许指定的服务跨越每个域的边界。网络管理员使用分区工具和技术在组织网络内创建内部网，并提供复杂的边界保护结构，以及创建外部网和分支网络。\n\
  \n分区为管理员提供了集中控制和管理能力，可用于在整个组织中实施统一的安全策略，这些策略由组织的安全策略定义。^(\\*) 它还支持单点登录功能、远程过程调用和高效的入侵检测操作。\n\
  \n由于此描述是传统防火墙操作的自然延伸，物理防火墙和 `访问控制列表 (ACL)` 一直是网络分区的主力工具。这些工具提供了受网络安全专家信赖的经验证的分段功能。然而，以这种方式定义和配置分段的过程耗时且容易出现人为错误，可能导致安全漏洞。此外，这种实施方式需要彻底了解特定设备配置语法、网络寻址、应用端口和协议。\n\
  \n网络分区的主要缺点集中在当前 IP 过滤设备相关的性能问题上。然而，随着新型连接设备进入市场，如交换机和路由器上的第 4 层过滤，预计 IP 过滤性能将不再是一个问题。\n\
  \n企业网络也可以通过将网络组织为多个 VLAN 来有效且安全地分段。分段和隔离都是网络虚拟化的基本产物。每个 VLAN 成为一个独立的广播域，仅向该域的授权成员显示相关资产。数据包只能通过路由器（第\
  \ 3 层分段设备）从一个 VLAN 传递到另一个 VLAN。\n\n此外，每个 VLAN 段可根据该段资产的要求配置独特的安全措施。在 VLAN 中，这种多层网络安全环境是通过使用\
  \ `分布式防火墙规则` 建立的，如 图 3.28 所示。\n\n![图 3.28 VLAN 分区](img/c03f028.png)\n\n**图 3.28**\
  \ VLAN 分区\n\n\n\n\n在本例中，物理网络被划分为四个二层 VLAN 段，区域之间采用三层分割。各个二层段可被虚拟化为微段，以提升二层段的整体性能，并在段内提供额外的安全选项。这种分割与隔离相结合的做法，造就了一个最内层的数据库层、一个中间的应用层，以及一个面向外部的客户\
  \ Web 层。\n\n### 控制段间数据移动\n\n理想情况下，某一安全区域内的用户只能与其所在段内的其他用户或相邻区域中的用户通信。组织安全拓扑的策略必须在区域划分硬件（防火墙、交换机和路由器）上实施，以控制其区域间的信息流动，如图\
  \ 3.29 所示。\n\n![图 3.29 段间数据移动](img/c03f029.png)\n\n**图 3.29** 段间数据移动\n\n当用户所在的安全区域与所需数据所在的区域不相邻（且他们合法地需要访问该数据）时，必须在中间区域（或多个区域）提供一个网关，以便为他们提供安全访问。一个典型的例子是：组织有员工（如销售人员）需要从远程位置访问内部层级的数据。在这种情况下，会在中间区域部署网关设备（如反向代理或终端服务器），为这些用户提供访问权限，并配备病毒和恶意软件扫描工具。\n\
  \n### 隧道技术\n\n当机密数据在区域间传输时，必须对其进行保护。这通过使用 `data transfer encryption`（数据传输加密）来保护传输中的数据来实现。\n\
  \n`Tunneling`（隧道）技术和技巧可用于安全控制安全区域间的数据移动，如图 3.30 所示。因此，当在两个区域（如与外联网安全区域）之间进行私密通信时，这是一种值得考虑的可行安全拓扑。隧道协议提供数据封装，并与特定加密协议协同工作，以构建一个功能正常的\
  \ VPN。\n\n![图 3.30 安全隧道](img/c03f030.png)\n\n**图 3.30** 安全隧道\n\n隧道协议（如 `PPTP`）配合微软的点到点加密（`MPPE`）协议使用时，可创建一个\
  \ VPN。同样，第二层隧道协议（`L2TP`）配合 `IPSec` 使用时，也可创建一个 VPN。尽管 `IPSec` 是 VPN 的一个组成部分，但它不像\
  \ `L2F`、`L2TP` 或 `PPTP` 那样是一种隧道协议。\n\n使用隧道技术在安全区域间传输私有数据的安全优势在于：分隔区域的连接设备无法察觉该通信属于私有网络的一部分。通过将私有数据和协议信息封装在公共传输数据包中，私有数据对系统而言是隐藏的。任何人在网络上扫描隧道传输流量，都无法知晓消息内容。\n\
  \n## 无线网络\n\n另一项开始影响 OT 网络传统结构的技术是 `industrial wireless technology`（工业无线技术）。`Wireless\
  \ networks`（无线网络）已被用于在组织网络的企业侧，利用高频无线电波连接智能设备。利用无线传感器、控制器和执行器来消除过程控制网络中 ICS 设备之间的长距离布线，这一想法已被讨论和追求多年。然而，实际实施无线\
  \ OT 网络的进展一直很缓慢。\n\n无线网络技术存在一些众所周知的挑战，使其作为 ICS 组件的吸引力降低。这些缺点包括安全性降低、鲁棒性差、延迟、可靠性问题和安全性隐患。即便如此，克服这些挑战并生产无线\
  \ ICS 技术的推动仍在继续。\n\n图 3.31 描绘了一个无线 IT/OT 网络参考模型。将此模型与本章前面构建的有线网络 OT/IT 架构进行对比。与\
  \ ISA-95 参考模型类似，该模型显示各种传感器通过无线链路与控制器通信。此部分被称为 `wireless sensor network`（`WSN`，无线传感器网络）。\n\
  \n![图 3.31 一个无线 ICS 参考网络](img/c03f031.png)\n\n**图 3.31** 一个无线 ICS 参考网络\n\n请注意，该参考模型的其他层也在使用无线网络技术相互通信。虽然这些网段可以使用商用无线技术实现，但在某些模型中，使用传统\
  \ IT 网络设备和协议实现被视为同样容易。\n\n### 无线传感器\n\n无线传感器提供了讨论和开发用于 OT 网络无线应用的最大设备池。这些传感器包括压力变送器、差压变送器、温度变送器、模拟量输入变送器和通用\
  \ I/O 变送器等设备。大多数设计用于替代传感器，以及工业过程控制长期依赖的旧式 `4-20mA current loop`（4-20mA 电流环）信号标准。\n\
  \n传感器设备实际上是物理传感器和无线发射器或收发器的封装版本。传感器将过程变量转换为可应用于其无线电发射器的有意义电子信号。在另一端，控制器要么直接使用自己的无线电接收无线电信号，要么使用单独的接收器获取信号，然后将其转换为可应用于控制器的信号。这些选项如图\
  \ 3.32 所示。\n\n![图 3.32 无线传感器通信](img/c03f032.png)\n\n**图 3.32** 无线传感器通信\n\n在过程控制回路的另一端，可实施无线技术来接收控制命令和数据，并将其传递给远程执行器的最终设备。无论哪种情况，链路两端的无线电必须使用相同的传输和信令协议进行通信。用于此目的的常见无线电技术包括：\n\
  \n*   `Wi-Fi`\n*   `Bluetooth`\n*   `ZigBee`\n*   `WiMax`\n*   `Proprietary communication\
  \ protocols/links`（专有通信协议/链路）\n\n正如多次所见，OT 网络需要实时、可靠的数据才能正确且安全地运行。在 OT 网络中使用无线技术的主要缺点之一是其易受\
  \ `electrical interference`（电气干扰）影响，以及数据受干扰时可能产生的后果。\n\n工业生产环境本质上往往嘈杂。电机和开关设备在正常运行期间会向空气中辐射电气噪声。这种噪声以波的形式在空气中传播，可能干扰同样在空气中传播的无线电信号。这种干扰可能会中断或破坏编码在无线电信号上的数据，导致延迟和数据丢失。这对实时过程控制系统来说极为成问题。\n\
  \n与无线传感器网络相关的另一个潜在问题是需要本地电源或电池。在每个传感器位置增加本地交流电源连接成本可能相当高昂。此外，工艺安全运行可能要求每个传感器位置都有备用电源（电池）。这同样安装和维护成本高昂。如果出于任一原因需要电池供电，跟踪和更换电池的任务可能成为维护问题。\n\
  \n#### 无线通信协议\n\n\n\n\n## 工业和公用事业无线通信协议\n\n工业和公用事业网络采用不同的无线通信协议，在其流程中传输数据和遥测数据。IEEE\
  \ 组织在 `IEEE-802.xx` 旗下监管一组无线网络规范：\n\n### Wi-Fi\n\n**Wi-Fi**：`IEEE 802.11x`（也称为*无线保真*）无线标准已被广泛接受，成为商业和住宅网络应用的首选无线网络技术。\n\
  \n### 蓝牙 (IEEE 802.15.1)\n\n**蓝牙 (`IEEE 802.15.1`)**：这是一种用于个人区域网 (PAN) 的无线网络规范，在某些领域得到了广泛应用，例如将扬声器、手机、数码相机等个人设备以及\
  \ PC、笔记本电脑和打印机进行组网。这种将不同类型的数字设备汇聚在一个共同平台上的现象被称为*融合*。\n\n蓝牙设备使用低功耗、短距离的射频信号，提供低成本、安全的通信链路。该规范提供了三种功率级别/范围选项：`100mW/100meters`、`2.5mW/10meters`\
  \ 和 `1mW/1meter`。\n\n蓝牙规范在免许可的 `2.4 GHz` 频段实现了*自适应跳频扩频*（**AFHSS**），以提供安全性并避开拥挤的频段。蓝牙协议将\
  \ `2.4 GHz` 频段划分为 79 个不同的 `1MHz` 通信信道。跳频机制每秒最多可切换信道 1,600 次。蓝牙 1.1 和 1.2 设备的数据传输速率为\
  \ `723.1 Kbps`，蓝牙 2.0 设备为 `2.1 Mbps`。\n\n蓝牙设备一次只能连接到一台设备。一旦蓝牙设备连接到另一台蓝牙设备，它将无法连接到其他设备，也不会出现在查询中，直到它与原始蓝牙设备断开连接。\n\
  \n然而，该标准也支持使用蓝牙技术构建多点无线网络。根据蓝牙规范，最多八台设备可以组成一个*微微网*。任何设备都可以成为主设备，并通过发出广播请求来控制网络。其他七台设备成为从设备，直到主设备释放其位置。\n\
  \n主设备使用时分复用在网络中快速在各从设备之间切换。通过这种方式，蓝牙网络的运行类似于无线 USB 网络。网络中的任何设备在可用时都可以承担主设备的角色。\n\
  \n在计算机网络环境中，蓝牙规范使多个蓝牙外围设备能够同时与主机设备通信。特别是，蓝牙用于本地主机计算机与无线输入输出设备（如鼠标、键盘和打印机）之间的通信。\n\
  \n### Zigbee (IEEE 802.15.4)\n\n**Zigbee (`IEEE 802.15.4`)**：与蓝牙类似，Zigbee 标准是一种无线、网状组网的\
  \ PAN 协议，提供 `10-meter` 通信范围，数据传输速率为 `250 kbps`。Zigbee 标准已被智能家居自动化和工业控制社区以及智能电网联盟的多个领域所采用。它也正被考虑用于*个人生物医学传感器*，以提供安全的远程医疗数据采集。\n\
  \n### WiMAX (IEEE 802.16)\n\n**WiMAX (`IEEE 802.16`)**：该规范的建立旨在为更广域的无线网络能力提供指导。WiMAX\
  \ 是一种宽带无线接入标准，旨在跨越城市、县甚至国家等大面积地理区域提供互联网接入。它还旨在提供与 `802.11` Wi-Fi 标准的互操作性。\n\n##\
  \ 无线连接设备\n\n根据无线控制器、传感器和执行器之间的距离，网络中可能包含几种不同类型的无线网络连接设备。例如，前面的插图表明各传感器与控制器之间存在直接无线电链路。然而，就像在住宅或企业\
  \ IT 网络中一样，数字无线设备可能通过*无线接入点*（**WAP**）或*无线路由器/网关*设备与工业过程控制器通信。\n\nWAP 作为一种桥接设备，将无线网络设备相互连接，并连接到有线网络。这些设备采用天线和无线电接收器/发射器，利用非授权\
  \ `2.4 GHz` 无线电频段中的射频信号与其他网络设备通信。相反，它通过物理接口（如交换机或路由器上的以太网连接）与有线网络通信，如 图 3.33 所示。\n\
  \n![图 3.33 WAP](img/c03f033.png)\n\n**图 3.33** WAP\n\n无线网络客户端设备必须具备由无线电发射器、接收器和天线组成的无线网络接口，才能与\
  \ WAP 通信。每个具有无线网络接口的智能设备都可以直接与其他配备无线功能的设备或接入点通信。无线网络设备也能通过接入点与以太网网络上的有线网络设备通信。\n\
  \n### 无线网关\n\n在通信和数字网络中，*网关*被定义为一种将一个网络与采用不同协议的另一个网络相连接的设备。回顾一下，协议是用于在不同设备或系统之间进行通信的一组定义规则。\n\
  \n该协议可能旨在匹配物理连接的差异（硬件协议），或匹配不同的信号逻辑电平、消息格式或信息交换速度（软件协议）。一些网关设备被设计为同时执行这两种功能，如 图\
  \ 3.34 所示。图中的网关将有线 `Ethernet/TCP/IP` 协议格式转换为无线/`ZigBee` 协议格式。\n\n![图 3.34 网关操作](img/c03f034.png)\n\
  \n**图 3.34** 网关操作\n\n为了通信成功，双方必须同意使用相同的协议。例如，两人要进行口头交流，必须都能使用一种通用语言，如英语对英语或西班牙语对西班牙语。如果不是，这就是中国那句关于“鸡同鸭讲”的古老谚语的例子。\n\
  \n当路由器用于将网络连接到始终在线的宽带互联网连接时，它们被称为*互联网网关*。除了执行路由功能外，互联网网关路由器通常还提供许多其他与互联网相关的服务，例如\
  \ `DHCP` 和防火墙服务。这些服务将在本章后面详细介绍。您可能还会遇到具有内置路由功能的路由交换机，称为*局域网交换机*。\n\n### 调制解调器\n\n\
  在 第 1 章 中，您了解了与分布式 OT 网络相关的遥测和计量系统。在这些扩展的网络段中，调制解调器被用于将数字数据转换为可在更长距离上传输的信号格式。\n\n\
  除了无线电模块外，每种不同的长距离无线通信技术都需要在通信链路的每一端配备一个*调制器*/*解调器*（**调制解调器**）设备。这些设备用于连接工业现场设备和控制器，其距离远超使用数字或异步串行连接所能达到的范围。\n\
  \n调制解调器的调制器部分将数据串行化并调制成可跨特定介质类型传输的信号。在另一端，另一个调制解调器的解调器部分对信号进行解调，然后将数据并行化（反串行化），以便\
  \ OT 设备使用。\n\n\n\n\n\n## 工业调制解调器与无线网络安全\n\n### 工业调制解调器技术\n\n有工业调制解调器可用，它们采用几种不同的通信技术：蜂窝无线电和长距离无线以太网无线电。\n\
  \n#### 工业蜂窝调制解调器\n\n**工业蜂窝调制解调器**依赖蜂窝电话技术，为工业控制和公用事业应用提供无线广域网通信。这些调制解调器通过标准有线以太网或串行\
  \ `RS-485` 连接接入有线网络（或设备），然后利用**通用分组无线业务（GPRS）**模块与智能现场设备提供无线点对多点通信，如图 3.35 所示。\n\
  \n![图 3.35 蜂窝调制解调器实施](img/c03f035.png)\n\n**图 3.35** 蜂窝调制解调器实施\n\n**GPRS**模块可作为嵌入式硬件直接集成到现场设备的电子装置中。这些无线电采用**频分双工（FDD）**和**时分多址（TDMA）**技术，通过现有的蜂窝信道传输\
  \ IP 数据包。\n\n#### 长距离无线以太网调制解调器\n\n**长距离无线以太网调制解调器**通常在 2.5 GHz、5 GHz 和 900 MHz\
  \ 频段工作。某些型号提供高吞吐量、视距通信，距离范围为 5 至 20 公里。这些型号还可能包含内置网络功能，如内部路由和访问控制列表，用于拒绝列表/允许列表配置。其他功能包括无线\
  \ I/O 映射，用于将多个 I/O 设备组网在一起，以及用户可选择的数字量、模拟量或组合式输入输出类型。\n\n其他工业调制解调器型号可配置为网状网络拓扑，为工业以太网设备提供冗余。这些调制解调器还可能提供从串行\
  \ `Modbus RTU` 到 `Modbus TCP` 的内置转换功能。\n\n## 无线网络安全\n\n虽然无线网络因其安装简便而在住宅和商业网络中很常见，但用它们传输机密信息存在许多安全问题。无线网络设备的传输无法简单地局限于住宅或商业的本地环境中。\n\
  \n尽管大多数无线网络设备的范围通常限制在几百英尺内，但射频信号即使在声明的安全边界之外也很容易被拦截。任何未经授权的移动终端都可以使用 `802.11` 接收器来实现这一点。\n\
  \n为了最大程度降低无线局域网安全受损的风险，`IEEE-802.11` 无线标准提供了一项称为**Wi-Fi 保护访问（WPA）标准**的安全功能，该功能使用**临时密钥完整性协议（TKIP）**和\
  \ `IEEE 802.1X` **可扩展认证协议（EAP）**用户认证协议提供数据加密，从而提供安全性。这种组合要求用户使用用户名和密码来访问网络。用户登录后，AP\
  \ 会生成一个临时密钥，用于加密 AP 与客户端计算机之间的数据传输。\n\n如果可能，您应该设置路由器使用 `WPA-PSK` 并配合强密码。`PSK` 选项允许\
  \ `WPA` 使用**预共享密钥**，而不需要单独的**证书颁发机构（CA）**计算机来提供用户认证。`PSK` 允许在路由器上设置密码并与其他用户共享。\n\
  \n此外，在您安装并认证所有无线客户端后，应将 `SSID 广播` 选项设置为禁用，以防止外部人员利用 `SSID` 获取您的地址和数据。强烈建议将 `SSID`\
  \ 名称从默认值更改为其他值，以防止未经授权的访问。\n\n## 复习题\n\n以下问题测试您对本章所呈现材料的掌握程度。\n\n1.  针对跨边界通信的第一道防线之一是\
