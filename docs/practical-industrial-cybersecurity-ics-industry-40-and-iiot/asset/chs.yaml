  \  Level 3\n5.  Level 4\n\n## 第 2 章：ICS 架构\n\n## 简介\n\n在上一章中，您了解了典型工业/公用事业控制系统的基本组件。本章将以这些介绍性主题为基础，描述标准\
  \ ICS 架构。特别是，它将汇集与运营 OT 架构相关的四大知识领域：\n\n*   Communication media（通信介质）\n*   Field\
  \ device architecture（现场设备架构）\n*   Industrial network protocols（工业网络协议）\n*   IT\
  \ network protocols（IT 网络协议）\n\n在上一章的介绍中，提到 OT 网络往往与企业和小型企业环境中发现的 IT 网络截然不同。例如，正如您已知，工业制造和公用事业网络中使用的许多连接和计算设备与企业网络中常见的设备有很大不同。特别是，工业/公用事业网络中使用的\
  \ OT 网络包含不同类型的过程控制设备，如 `programmable logic controllers` (`PLCs`) 和 `remote terminal\
  \ units (RTUs)`。\n\n这些环境在软件领域也差异巨大。在工业网络环境中，企业网络中运行在 Windows 和 Linux 操作系统上的业务应用程序已被提供\
  \ `supervisory control and data acquisition (SCADA)` 和 `man-machine interface (MMI)`\
  \ 功能的过程控制应用程序所取代。\n\n即使网络通信也可能与企业网络中遇到的截然不同。虽然 `CATx` 双绞线布线、Ethernet 协议和 `TCP/IP`\
  \ 在企业环境中广泛使用，但其他协议和技术（如 `RS-485` 串行通信链路、Modbus 网络和 SONET 环形广域网）也存在，以及多种无线技术。\n\n\
  ## 网络传输介质\n\n数字数据通过网络 `communication media` 从一个网络设备传输到另一个网络设备。用于在网络设备之间移动数据的传输介质基本上有三种通用类型：\n\
  \n*   Copper wire（铜线：双绞铜缆和同轴电缆）\n*   Light waves（光波：光纤电缆和红外光）\n*   Wireless radio\
  \ frequency (RF) signals（无线射频 (RF) 信号：WiFi、WiMAX、Bluetooth、ZigBee、Z-Wave）\n\n每种介质类型都提供优势，使其在特定条件下适用于联网。主要与介质相关的考虑因素包括其实施成本、最大数据传输速率和抗噪声特性。同样，每种介质类型在传输信息的能力方面也存在一些限制。\n\
  \n这一因素也包含在两个考量中——其 `bandwidth` 和其 `attenuation`。`Bandwidth` 是介质在给定实例下承载数据的总能力。`Attenuation`\
  \ 是衡量信息跨越介质移动时发生多少信号损耗的指标。正如您将在以下部分看到的，某些介质类型实际上可以传输信号数英里，并仍能将其作为可识别的信息传递。\n\n最后一个与介质相关的考量是其抗噪声能力。杂散电能（称为\
  \ `noise`）作为自然过程在大气中移动。电气机器和设备也会产生电子噪声。这些杂散信号会干扰有组织的数据信号，使其无法识别。因此，用于传输数据的电缆应具备一定的抗杂散信号能力。\n\
  \n### 铜缆布线\n\n在 `copper cabling` 标题下，基本上有两类需要考虑：twisted-pair cabling（双绞线布线）和 coaxial\
  \ cabling（同轴电缆布线）。双绞线布线由两对或多对绞合在一起的导线组成，以提供降噪。导线中的扭绞会使感应噪声信号相互抵消。在该类布线中，每英尺导线的扭绞数表示其相对抗噪声等级。\n\
  \n在讨论用于数据网络的双绞线布线时，有两种基本类型需要考虑：`unshielded twisted pair` (`UTP`) 和 `shielded twisted\
  \ pair` (`STP`)。UTP 网络电缆包含四对单独绝缘的导线，如图 2.1 所示。\n\nSTP 电缆类似，不同之处在于它包含一个额外的箔层屏蔽，包裹着四对导线束。屏蔽层通过提供接地路径将感应电信号从电缆中的导体处引走，从而提供对感应电气噪声和串扰的扩展保护。这一额外特性使\
  \ STP 比 UTP 电缆更昂贵、更重、更难安装。然而，它也提供更高的数据速度和更强的抗噪声能力。\n\n![Figure 2.1 UTP and STP cabling](img/c02f001.png)\n\
  \n**图 2.1** UTP 和 STP 布线\n\n`Coaxial cable`（通常简称为 `coax`）作为将有线电视信号传入家庭的导体，为大多数人所熟悉。同轴电缆由绝缘的实心或绞合线芯组成，外围包裹介质绝缘层和实心或编织金属屏蔽层。导线和屏蔽层均包裹在外部保护绝缘护套中，如图\
  \ 2.2 所示。\n\n过去，同轴电缆广泛用于 Ethernet LAN 介质。然而，由于同轴电缆的粗度和刚性使其难以安装且耗时，网络行业和网络标准开发组织已放弃同轴电缆，转而采用非屏蔽双绞线布线。\n\
  \n### 光纤布线\n\n`Fiber-optic cable` 是设计用于以光脉冲形式传输数字数据的塑料或玻璃电缆。信号由激光二极管引入电缆，并沿其内部反射传播，直到到达电缆末端，如图\
  \ 2.3 所示。在末端，光检测电路接收光信号并将其转换回可用信息。\n\n光在光纤电缆中传输时，衰减（能量损耗）速度不如电信号在铜导体中传输时快。因此，使用光纤布线时，发射器和接收器之间的线段长度可以长得多。在某些光纤应用中，最大电缆长度可达\
  \ 2 公里。\n\n![Figure 2.2 Coaxial cable](img/c02f002.png)\n\n**图 2.2** 同轴电缆\n\n![Figure\
  \ 2.3 Transmitting over fiber-optic cable](img/c02f003.png)\n\n**图 2.3** 光纤电缆传输\n\
  \n\n\n\n根据所使用的光纤布线类型，光纤链路提供的潜在信令速率可超过 200 Gbps。然而，当前的接入协议提供的光纤 LAN 速度最高可达 100 Gbps。表\
  \ 2.1 说明了不同等级的单模（OS2）和多模（OM1、2、3、4 和 5）光纤在传输速度与距离之间的关系。\n\n**表 2.1** 光纤速度与距离\n\n\
  | 光纤类型 | 纤芯直径 | 1 Gb/s 以太网最大距离 | 10 Gb/s 以太网最大距离 | 40 Gb/s 以太网最大距离 | 100 Gb/s 以太网最大距离\
  \ | 40Gb/s SWDM4 | 100Gb/s SWDM4 |\n| --- | --- | --- | --- | --- | --- | --- |\
  \ --- |\n| OM1 多模 | 62.5/125 μm | 275 m | 33 m | 不支持 | 不支持 | 不支持 | 不支持 |\n| OM2\
  \ 多模 | 50/125 μm | 550 m | 82 m | 不支持 | 不支持 | 不支持 | 不支持 |\n| OM3 多模 | 50/125 μm\
  \ | 550 m | 300 m | 100 m | 70 m | 240 m | 75 m |\n| OM4 多模 | 50/125 μm | 550 m\
  \ | 400 m | 150 m | 150 m | 350 m | 100 m |\n| OM5 多模 | 50/125 μm | 550 m | 400\
  \ m | 150 m | 150 m | 440 m | 150 m |\n| OS1/OS2 单模 | 9/125 μm | 100 km | 40 km\
  \ | 40 km | 40 km | 不支持 | 不支持 |\n\n正如从表中所见，单模光纤针对长距离信号传输（高达 5 km）进行了优化，而多模光纤为较短距离提供更高的传输速度。\n\
  \n与铜缆相比，光纤还提供了一种安全得多的数据传输介质，因为如果不物理上切断导体，就无法对其进行窃听。基本上，从一端导入光缆的光线，除非通过另一端，否则不会离开光缆。电力公用事业部门已使用光纤布线来监控和控制其广泛分布的输电和配电网络超过\
  \ 30 年。\n\n### 工业网络介质标准\n\n历史上，工业数据通信仅限于通过 `direct cable connections`（直接电缆连接）在设备之间进行固定的点对点传输。通信通道经过手动配置，以根据需要提供本地和远程连接，从而服务于每个特定应用。\n\
  \n这种 `point-to-point`（点对点）方法，如图 2.4 所示，代表了最简单的控制拓扑选项，但也往往实施和维护成本更高。每个网络实施在实施前都需要大量的工程设计和规划。必须为每个设备从点到点映射通信通道，以确保正确的数据传输。\n\
  \n![图 2.4 点对点连接](img/c02f004.png)\n\n**图 2.4** 点对点连接\n\n#### 异步串行标准\n\n固定的点对点连接被证明非常适合设备数量相对较少且需要确定性的工业过程控制系统。然而，当需要多个控制器来管理多个工艺单元时，也需要额外的智能。为了在这类环境中协同工作，控制器需要能够相互通信。\n\
  \n最初，`RS-232 asynchronous serial communication standard`（RS-232 异步串行通信标准）成为长度不超过\
  \ 100 英尺的通信路径的工业网络设备连接标准。该连接标准被采用于包括 IT 计算机和外设连接在内的其他几个行业的通信中。\n\n`RS-232` 协议的物理链路采用多导体电缆和特定的硬件连接器。指定了单独的发送（`TX`）和接收（`RX`）线路，以及两组传输控制信号（请求发送和允许发送/数据终端就绪和数据设备就绪）。电缆还包含多条地线。物理连接通过成对的\
  \ 9 针 D 型壳连接器（公头和母头）指定。\n\n`RS-232` 设备继续用于工业控制系统，用于编程某些 PLC、变频器和伺服驱动控制器，以及 CNC 加工系统。这促使一些计算机配件供应商制造了带有\
  \ DB-9 公头连接器的 USB 转串口线缆，如图 2.5 所示。\n\n![图 2.5 USB 转 RS-232 串行连接](img/c02f005.png)\n\
  \n**图 2.5** USB 转 RS-232 串行连接\n\n最终，出现了 `RS-232` 串行标准的改进型线路平衡版本，称为 `RS-422` 和 `RS-485`\
  \ 标准，它们使工业设备能够在总线或环形拓扑中使用共享物理介质，同时增加了设备间的允许距离。\n\n`RS-422` (EIA 422) `Asynchronous\
  \ Serial Communications`（异步串行通信）协议标准于 1975 年发布。它在许多方面与 `RS-232` 相似。然而，它比 `RS-232`\
  \ 更快（高达 100 Kbps），并提供更好的 `noise immunity`（抗噪性）。`RS-422` 协议使用两对双绞线导体（一对用于发送，一对用于接收），以及每对线路的差分放大器/驱动器。这两个特性相结合，在物理链路上提供了增强的\
  \ `Common Mode Noise Rejection`（共模噪声抑制），以衰减同时耦合进入两条线路的电磁干扰 (EMI) 噪声。\n\n在 `RS-422`\
  \ 协议下，通信链路可以建立为直接连接的对等通道，或作为 `main/secondary device networks`（主/从设备网络）。在这些连接中，`RS-422`\
  \ 主发射设备可用于在单个介质通道上连接多达 10 个从设备。为了让设备共享同一物理通信介质，必须采用某种主/从或令牌传递协议，以避免设备访问争用问题。\n\n\
  `RS-485 serial protocol standard`（RS-485 串行协议标准）于 1998 年首次发布，比 `RS-232` 或 `RS-422`\
  \ 版本更快、更灵活。此外，它支持使用 `TCP/IP` 协议进行传输。与 `RS-422` 标准一样，`RS-485` 可以有效地承载高达 4,000 英尺（超过\
  \ 1200 米）的长距离通信。图 2.6 显示了现代 PLC 的串行 `RS-232/485` 连接方案。\n\n![图 2.6 串行连接](img/c02f006.png)\n\
  \n**图 2.6** 串行连接\n\n`RS-485` 标准还支持主/从设备配置。因此，这些异步标准已被证明非常适合实施分布式工业过程中的 DCS 和 SCADA\
  \ 系统所需的集中式智能和设备轮询技术。在提供更广泛的地理连接性方面，这一点尤为明显。\n\n### 以太网连接\n\n如前所述，`RS-485` 等异步通信因在\
  \ `real time`（实时）传输数据方面非常高效，在工业控制系统连接中占据主导地位超过 20 年。然而，IT 网络技术的兴起和扩展促使组织寻求利用这些技术来共享其\
  \ OT 网络的控制和数据。虽然 IT 网络推出了几种不同类型的网络拓扑（环形、树形和总线），但 `802.x Ethernet` 技术已基本被接受为局域网和广域网的网络标准。\n\
  \n然而，OT 网络面临的以太网技术问题是，由于以太网标准的底层设计，数据交付时间可能会有所不同且不具备确定性。以太网数据包可能因几个基本原因而延迟。\n\n\n\
  \n\n### 以太网在 OT 网络中的挑战\n\n*   **以太网节点会被网络上的其他流量阻塞。** 因为以太网流量基于“先到先得”原则（即最先访问网络介质的节点获得介质使用权），后到达总线的重要数据必须等待先到达的非重要流量。\n\
  *   **会发生数据冲突。** 网络节点会“监听”网络介质以寻找传输机会。如果两个节点同时发现空闲并开始发送数据，就会发生冲突，导致介质上的数据乱码。所有节点会按指定时间退避并重试。在网络时间尺度上，此过程可能非常耗时。\n\
  *   **以太网数据可能走多条路径到达目的地。** 这是由于 `TCP/IP` 数据包的可路由特性。当最直接路径缓慢或阻塞时，它被设计为寻找替代路由。\n*\
  \   **以太网流量在网络中广播，因此会到达所有节点。** 如果不加限制，这种信令方式会给网络带来相对较重的流量负载，可能导致带宽减少和数据丢失。\n\n这些延迟在典型\
  \ IT 网络中几乎难以察觉。然而，在 OT 网络环境中，此类延迟可能对人员、设备和生产力造成危害。工业工厂的运营通常要求速度和确定性，因为必须在指定时间框架内完成交付。否则，熔融金属会浇注到工作台面上，运动部件无法在预定位置停止，关键指令无法及时到达控制器以执行所需操作。\n\
  \n尽管这些问题听起来让以太网似乎永远无法用于 OT 网络，但事实是已有 30 多种工业协议专门为 OT 网络开发。原因有几点：许多组织指派 IT 员工同时实施和维护\
  \ IT 与 OT 网络；IT 侧的以太网提供了大量廉价的现成硬件和软件工具；以太网广为人知，拥有更大的熟悉技术人员和管理员人才库；组织希望 IT 和 ICS\
  \ 网络协同工作以提高生产力和利润。\n\n本章后面将介绍几种基于以太网的 ICS 协议。其中，有三种协议主导 ICS 组网市场：`Ethernet/IP`、`Modbus\
  \ TCP` 和 `ProfiNet`。在每种情况下，任务都是将上层协议的消息和数据封装进以太网 `TCP/IP` 数据包中。\n\n### 外部网络通信\n\n\
  在广泛分布的过程中（如公用事业相关流程），必须采用广域通信技术，以从现场站点获取实时输入，并使中心操作员能从其运营控制中心高效地执行监督控制功能。图 2.7 展示了常用于此目的的典型长距离/广域通信技术。\n\
  \n![图 2.7 远程访问 ICS 通信](img/c02f007.png)\n\n**图 2.7** 远程访问 ICS 通信\n\n图中描绘的不同通信链路提供适合特定场景的不同特性。\n\
  \n*   **电话技术**：有史以来最可靠的点对点通信系统之一仍是 **公用交换电话网** (**PSTN**) 系统。这些系统使用物理线缆在发送方和接收方之间传输语音级信号。这些通信链路可通过公用交换线路、租用线路或专用线路（组织自建电话公司）提供。\n\
  *   **射频技术**：不同的空中 **无线电技术** 已被用于在现场站点和控制站之间提供长距离通信链路。这些包括有执照和无执照的 **射频** (**RF**)\
  \ 传输、蜂窝电话链路和超高频微波传输。\n*   **卫星通信技术**：许多公司采用 **超小口径终端** (**VSAT**) **卫星通信** 在其总部和现场站点之间传输监督控制数据。这些系统是自包含的，不涉及第三方技术（如公用电话系统）。遗憾的是，许多此类系统安全性极差，使用不安全的通信协议、薄弱的密码强度要求和出厂默认设置。\n\
  *   **光纤技术**：光纤提供优秀的高速、长距离数据传输介质。数据被编码为光波并注入光纤。因光衰减慢，可在线缆中传输极远距离。光纤也比其他线缆更难安装，因为线缆内的光纤和组件易因弯曲、拉伸、扭转、分裂或划伤而损坏。然而，因光不向线缆外辐射，攻击者必须物理中断线缆才能拦截信号。\n\
  *   **电力线载波 (PLC) 技术**：这些技术将串行数字数据直接编码到电网的配电线路上，用于不同远程位置间的传输。PLC 技术在欧洲电网的数据传输中得到更广泛采用，而美国电网倾向于采用无线技术而非\
  \ PLC 方案。\n\n对于每种不同的通信技术和介质类型，长距离通信链路的每一端都需要一个 **调制解调器** (**modem**) 通信设备，将信息转换为适合在介质上传输的信号格式，并在另一端转换回控制/网络设备可用的格式。\n\
  \n调制解调器通信用于连接工业设备，其距离远超异步串行连接的能力。调制解调器的 **调制器** 部分将数据串行化并调制为可跨特定介质类型传输的信号。在另一端，另一调制解调器的\
  \ **解调器** 部分对信号解调，再将数据反串行化，以供 OT 设备使用。\n\n现场站点可能包含多个需与远程监控系统通信的本地控制器或 `IED`。此时，有几种拓扑选项可用于组织控制器的通信。\n\
  \n*   **点对点拓扑**：每个现场站点控制器或 `IED` 获得一条与控制中心的专用通信链路。通过在现场站点的每个控制器上连接一个调制解调器，并提供到远程控制中心兼容调制解调器的通信链路来实现。此拓扑简单易用，但往往是成本最高的选项。\n\
  *   **串行连接拓扑**：串行连接拓扑将长距离通信信道减少到一条。必须在现场站点实施设备争用协议，以控制其不同控制器何时以及如何访问通信信道。共享通信信道可能对数据采集和控制传输的及时性产生不利影响。\n\
  *   **多点拓扑**：多点配置为每个控制器提供单独的通信信道。然而，远程现场站点与控制中心之间的链路是单条链路。\n\n\n\n\n\n## 串星混合拓扑\n\
  \n这是串行和独立通道的组合；但是，它降低了数据采集过程的及时性。\n\n图 2.8 说明了用于协调远程现场站点通信的常见设备通信拓扑。\n\n![图 2.8\
  \ 远程访问 ICS 通信](img/c02f008.png)\n\n**图 2.8** 远程访问 ICS 通信\n\n### 传输介质漏洞\n\n与网络的其他组件一样，传输介质安全必须在两个层面考虑：物理安全和逻辑安全。物理安全涉及保护物理介质，以及互连网络设备的通信设备和物理端口。如果攻击者能够不间断地访问传输介质，他们就会找到利用它的方法。\n\
  \n当传输介质离开私有设施的可控区域（由组织拥有和维护的网络）时，保护物理介质变得具有挑战性。在设施内部，光纤和铜缆通信介质相对安全，因为需要对介质进行物理窃听才能从中提取信息。\n\
  \n当介质离开设施的范围时，它所携带的信息在其传输路径上或在消息的接收端口处变得容易被拦截和捕获。为了保护必须穿越第三方介质和/或与第二方关联方交互的数据，必须在传输前对其进行加密，并最好使用网络隧道策略进行传输。\n\
  \n无线通信则不能这样说，因为它们可能通过简单的天线从空气中被提取。因此，所有无线传输都应使用加密通信链路执行。无线传输和安全在第 3 章 中介绍。\n\n##\
  \ 现场设备架构\n\n在第 1 章 \"工业控制系统\" 中，您了解了 ICS 系统中典型的现场设备。回顾一下，现代工业过程和公用事业环境中首选的本地控制设备是\
  \ `PLC`。工业网络安全专家必须熟悉 `PLC` 的结构和操作，以了解其预期行为并理解其漏洞。如 图 2.9 所示，`PLC` 与 IT 计算设备共享大部分技术；它们包含微处理器、`RAM`\
  \ 内存、只读固件和操作系统。\n\n![图 2.9 PLC 结构](img/c02f009.png)\n\n**图 2.9** PLC 结构\n\n`PLC`\
  \ 的核心是其*微处理器*。与所有其他数字计算设备一样，它从其支持的存储区域获取指令和数据，并根据接收到的程序指令执行算术和逻辑功能。此外，与其他计算设备一样，`PLC`\
  \ 的整体性能在很大程度上取决于处理器的能力。\n\n在 `PLC` 中，处理器的操作相对简单。它有三个基本功能要执行：\n\n*   它按顺序扫描每个输入端子的状态。\n\
  *   它根据其编程处理输入状态。\n*   它将结果传递给指定的输出端子。\n\n`PLC` 的存储单元组织也与典型 PC 相当。有一个永久的*系统存储*区域（类似于\
  \ PC 的 `BIOS/CMOS`），其中编码了 `PLC` 的操作能力。这些能力由其制造商编程到 `PLC` 中，用户无法直接访问。该存储区域通常位于控制器电路板上的集成电路\
  \ `EPROM` 或 `EEPROM` 存储设备中。\n\n第二个存储区域是*程序存储*（或*用户存储*）区域，用于保存用户提供的编程。该编程由用户生成并下载到此存储区域供\
  \ `PLC` 使用。该存储区域在物理上由 `PLC` 电路板上的*随机存取存储器*（*RAM*）模块实现。`RAM` 模块的大小决定了可以加载到 `PLC`\
  \ 中的编程量。\n\n`PLC` 中的第三个存储区域是*数据存储*区域。该区域旨在临时存储程序执行期间获得的中间数据值。程序可以在需要时引用这些数据，供其他程序序列使用或用于激活指定的输出端子。\n\
  \n这三个存储区域都映射到 `PLC` 的*地址映射*中。该映射如 图 2.10 所示，表示 `PLC` 电路板上物理存储设备中每个可用存储位置的数字位置。\n\
  \n![图 2.10 PLC 地址映射](img/c02f010.png)\n\n**图 2.10** PLC 地址映射\n\n微处理器的地址计数器选择这些位置，以逐步获取每条指令。当它获取并读取每条指令时，`PLC`\
  \ 的处理器确定以下内容：\n\n*   应执行什么活动（即，将输入 1 的状态加载到内存中）？\n*   活动应使用什么数据，以及在哪里可以找到它（即，如果输入\
  \ 1 数据 = 1，则打开输出端子 4）？\n\n获得这两条信息后（称为*指令周期*），`PLC` 的处理器进入其执行周期，执行该指令。然后处理器移动到内存中的下一条指令地址，其指令周期/执行周期序列重复进行，直到程序提供某种类型的停止指令，或直到处理器用完要处理的内存位置。\n\
  \n指令的线性处理也可以通过跳转或条件跳转指令来改变，这些指令指示微处理器将其指令计数器重置为某个新的内存位置，并从那里开始执行指令。这种操作类型如 图 2.11\
  \ 所示。\n\n![图 2.11 跳转指令](img/c02f011.png)\n\n**图 2.11** 跳转指令\n\n### PLC I/O 部分\n\n\
  虽然 `PLC` 的内部结构类似于个人计算机，但其输入和输出与个人计算机相关的输入输出截然不同。在 `ICS` 环境中，I/O 连接通常通过单独的、安全的螺丝压接端子进行，而在个人计算机中，则通过\
  \ `Ethernet`、`USB`、`eSATA`、`PS2`、`HDMI` 和 `VGA` 专用连接端口完成。\n\n#### 输入部分\n\n`PLC`\
  \ 的输入部分将来自单个输入端子的电压转换为其数字设备可处理的电平（即，将 `24 Vdc` 或 `120/240 Vac` 信号转换为数字 `0/5 Vdc`\
  \ 电平）。该部分还提供滤波电路，在输入信号引入 `PLC` 的数字电路之前去除电气噪声。输入部分通过光耦合器电路与数字电路电气隔离，以防止任何残留电气噪声进入数字电路。\n\
  \n一些 `PLC` 接受模拟输入信号，这些信号在引入其数字电路之前，通过模数（`A/D`）转换电路转换为数字等效值。输入部分可能包含*输入电压源*连接，如 图\
  \ 2.12 所示。这些连接用于为 `PLC` 的输入端子和提供其输入信号的现场设备提供兼容电压。在该示例中，一个 `24 Vdc` 电源为 `PLC` 的输入端子和输入开关设备提供相同的\
  \ `24V` 电位。\n\n![图 2.12 PLC 输入电源连接](img/c02f012.png)\n\n**图 2.12** PLC 输入电源连接\n\n\
  #### 输入漏型和源型配置\n\n\n\n\n\n## PLC 输入接线规范\n\n将传感器连接到 PLC 的 DC 输入端子主要有两种常见规范。\n\n*\
  \   **漏型输入**：一种接线方案，其中 PLC 的输入端从传感装置接收常规电流流向。\n*   **源型输入**：一种接线方案，其中 PLC 的输入端子向传感装置提供常规电流流向。\n\
  \n图 2.13 描述了典型的漏型接线方案以及源型接线方案。在漏型方案中，电源的正极连接到传感开关的远端。电源的负极连接到 PLC 输入端的公共端。当某个开关移至闭合位置时，电源与输入公共端子之间就建立了一条常规电流流向路径。\n\
  \n![图 2.13 漏型和源型配置](img/c02f013.png)\n\n**图 2.13** 漏型和源型配置\n\n同样，当采用源型方案且信号开关移至闭合状态时，PLC\
  \ 的输入端子与外部电源之间会形成一条常规电流流向路径。为实现这一点，电源的正极连接到 PLC 输入端的公共端子，其负极连接到传感装置的远端。\n\n将 PLC\
  \ 的输入接线为漏型还是源型配置，取决于现场输入设备的电流流向要求。如果它们是源型电流设备，则必须将传感器接线配置为源型。反之，如果设备是漏型设备，则输入端必须配置为漏型操作。除非\
  \ PLC 提供与不同输入端子组相关联的多个公共端子，否则不能混合设备类型或配置。此信息可在 PLC 的用户/安装指南中找到。\n\n## 输出部分\n\n输出单元负责在每个输出端子产生输出电压，这些电压反映了程序对\
  \ PLC 输入端子实时响应的状况。PLC 输出端子上的电压随后用于激活或停用现场执行器设备。与输入类似，某些 PLC 提供模拟输出功能。在这些情况下，使用数模转换\
  \ (D/A) 器件将内部数字值转换为具有代表性的模拟输出电压。与输入部分一样，输出部分也与 PLC 的数字处理电路电气隔离。\n\n在处理 PLC 输出时，有两种基本类型的输出端子需要了解。\n\
  \n*   **晶体管输出**：由固态开关器件提供的输出。由于这些输出通过半导体器件提供，其输出能力仅限于低功率 DC 信号。此类信号可用于点亮指示灯或激活外部电磁阀和继电器，进而操纵执行器。\n\
  *   **继电器输出**：可直接与相对大负载执行器设备交互的输出。这些输出还提供内置滤波电路，保护输出和 PLC 免受切换大电流负载（如电机）通断时产生的电弧影响。\n\
  \n图 2.14 展示了数字晶体管输出和继电器输出的行业标准表示。请注意，在两种情况下，输出部分都包含一个输出电源连接。某些 PLC 甚至为不同的输出端子分组提供多个（独立的）输出电源选项。\n\
  \n![图 2.14 PLC 输出类型](img/c02f014.png)\n\n**图 2.14** PLC 输出类型\n\n虽然固态输出使用的电压和电流受到限制（通常\
  \ ≤ 24 Vdc 和 0.5 Adc），但继电器输出的能力要高得多（240 Vac/Vdc），并可控制大得多的电流负载。\n\n紧凑型 PLC 的输入/输出\
  \ (I/O) 能力受限于设备上提供的端子数量。然而，模块化 PLC 通过向背板添加 I/O 模块，可以扩展输入和输出端子的数量。\n\n与 PLC 输入一样，固态输出必须正确进行物理连接，才能使每个输出电路正常工作。这涉及为所选\
  \ PLC 的输出驱动器类型建立漏型或源型路径。通过仔细遵循 PLC 的安装指南即可实现这一点。\n\n## PLC 实现方式\n\n正如第 1 章所述，多年来\
  \ PLC 一直是工业过程和公用事业运营的首选局部控制器。根据特定的过程控制应用，PLC 可采用三种通用实现方式：\n\n*   作为在单个过程单元中工作的独立控制器。\n\
  *   作为在 DCS 分布式控制系统中运行的现场设备。\n*   作为在基于 SCADA 的控制系统中运行的现场设备。\n\n图 2.15 描绘了 PLC 作为小型批处理操作中主控制器的用法。PLC\
  \ 通过*现场总线网络*连接到各种输入传感器和输出执行器。现场总线还连接到一个独立的人机界面控制台，以显示过程及其各种传感器的活动情况。\n\nPLC 还通过\
  \ OT 局域网连接连接到一对 IT 计算设备。第一台是指定为*工程工作站*的本地主机计算机。第二台是被称为*数据历史服务器*的数据存储服务器。该组件负责记录从现场设备（PLC、RTU\
  \ 和 IEC）获取的数据。由于数据历史服务器位于局域网上，因此连接到此类网络的其他计算设备更容易访问它。如果为 ICS 网络服务的局域网连接到组织的 IT 网络，这可能成为一个主要关注点。\n\
  \n![图 2.15 独立 PLC 实现](img/c02f015.png)\n\n**图 2.15** 独立 PLC 实现\n\n图 2.16 说明了上一个示例中的\
  \ PLC 控制回路如何与其他两个基于 PLC 的控制回路一起集成到分布式控制系统中。请注意，随着控制元件被添加到上一个示例中的局域网，OT 网络在本示例中已成为*局部控制网络*。LCN\
  \ 相当于 IT 网络中的局域网。此外，一个主 *DCS 服务器* 和一个主 HMI 显示器已被添加到该网络部分。这些设备均驻留在拓扑结构的监控级控制回路中。\n\
  \n## 工业传感器\n\n所有过程控制操作的起点都是传感器。这些装置将温度、流体流速或压力等被测物理量的值转换为控制系统可理解的相应信号（压力、电气、差压等）。\n\
  \n一些常用的工业传感装置包括：\n\n*   **热电偶**，将温度转换为相应的毫伏信号。\n*   **涡轮流量计**，将液体流速转换为相应的脉冲率或电压。\n\
  *   **孔板**，将流速转换为相应的差压。\n*   **柔性隔膜**，将压力转换为机械能。\n*   **光电池**，将光能转换为相应的电能。\n*  \
  \ **开关**，将物理位置转换为电信号。\n\n![图 2.16 基于 DCS 的 PLC 实现](img/c02f016.png)\n\n**图 2.16**\
  \ 基于 DCS 的 PLC 实现\n\n\n\n\n## 工业过程控制信号标准\n\n工业过程控制设备制造商采用了多种标准信号范围，用于过程信息的传输和处理。信息信号可采用数字格式传输，信号取两种可能电平之一——高或低——以表示变量的状态。以下是工业过程中使用的标准数字信号电平：\n\
  \n*   `0 and 5 Vdc` 用于集成电路\n*   `0 and 24 Vdc` 用于设备间控制电路\n*   `0 and 120 Vac` 用于开关/继电器控制电路\n\
  \n信息和控制信号也可采用模拟格式产生和传输，此时信号电平可在高限和低限之间通过无限多个值变化。这些信号可通过电压/电流形式传输，也可作为气动/液压压力传输。此类信号的一些标准范围示例包括：\n\
  \n*   `0 to 5 Vdc`\n*   `4 to 20 mA`\n*   `3 to 15 lbs` 压力\n\n在工业过程环境中，此采样过程必须实时发生（无延迟或抖动）。这种对实时传感器数据的依赖是\
  \ OT 与基于信息的 IT 系统之间的根本区别。若无实时采样，过程控制器可能无法及时响应 PV 的变化。这会导致 PV 调节不良。\n\n在某些情况下，测量过程必须分两步进行：`measurement`（测量）和\
  \ `translation`（转换）。当测量 PV 的传感器输出信号与控制器能理解和处理的输入值之间没有直接关联时，必须在两个组件之间放置一个 `transducer`（变送器/传感器），将传感器的输出信号转换为控制器可接受的信号，如图\
  \ 2.17 所述。\n\n![FIGURE 2.17 输入信号处理模块](img/c02f017.png)\n\n**图 2.17** 输入信号处理模块\n\n\
  如图所示，变送器必须能够接收给定传感器的输出，并将其转换为与特定控制器兼容的相应信号。在许多应用中，变送器必须经过 `calibrated`（校准），以便将传感器输出的零点和信号范围（量程）忠实地转换为与控制器零点相匹配、且在其信号范围内运行的相应信号。\n\
  \n在此例中，热电偶正在测量炉内温度。热电偶是双金属器件，可在一定温度范围内产生一定范围的毫伏电压。热电偶的可用范围取决于制造它所用的两种金属类型。与标准控制器输入范围（如\
  \ `0–5 Vdc` 模拟输入范围）相比，这些电压电平非常小。\n\n需要一个变送器将热电偶的毫伏电压范围转换为 `0–5 Vdc` 信号。这种转换可通过简单的放大器完成。然而，将该热电偶的输出映射到数字控制器的输入，则需要\
  \ `analog-to-digital (A/D) conversion`（模数转换）过程。一些 `intelligent sensors`（智能传感器）将传感装置与\
  \ A/D 电路和嵌入式微处理器封装在一起，如图 2.18 所示，以便它们能直接与控制器、主控制器或其他类型的控制系统通信。\n\n![FIGURE 2.18\
  \ 智能传感器](img/c02f018.png)\n\n**图 2.18** 智能传感器\n\n由于传感器是任何工业控制系统中的基本元件，因此它们代表了攻击者的重要目标。如果攻击者能访问传感器或其通往控制器的通信路径，就能破坏整个过程的运行。\n\
  \n## 工业开关\n\n应用最广泛的工业传感器是机电 `switch`（开关）。电气开关是用于在电路中接通或中断电流流动的装置。开关有两种可能的状态：`open`（断开）或\
  \ `closed`（闭合）。在 `open` 状态下，电路中会产生一个机械间隙，阻止电流通过开关。当触点被推合在一起时，导电回路接通，电流可流经开关。这称为开关的\
  \ `closed` 状态。\n\n以下标准用于描述电气和电子开关：\n\n*   极数和投数\n*   驱动方式\n*   被动/主动状态配置\n\n###\
  \ 极数和投数\n\n开关包含两个关键机构——可动内部电路触点和固定外部电路连接点。这些元件被称为 `poles`（极，内部触点的数量）和 `throws`（投，开关可连接的可能连接点或外部电路数量）。\n\
  \n*   **单极单投 (SPST)**：SPST 开关是简单的开/关开关。图 2.19 显示了 SPST 开关的原理图符号。如图所示，有一个由小圆圈表示的单个内部触点和一个可动触点。这两部分代表“极”。在该图中，可动触点末端与电路连接点的固定触点（投）之间存在间隙。\n\
  \n    当开关处于正常状态（如图所示）时，该间隙代表电路中的物理断开，阻止电流流经开关。然而，当开关被激活时，你可以想象代表极的圆圈和可动触点向下旋转，使可动触点与固定触点发生物理接触，从而允许电流流经接通的电路路径。\n\
  \n    当开关断开时，你可以想象极组件逆时针旋转，远离固定触点，断开电路并切断电流流动路径。\n\n    ![FIGURE 2.19 SPST 开关](img/c02f019.png)\n\
  \n    **图 2.19** SPST 开关\n\n*   **单极双投 (SPDT)**：SPDT 开关（如图 2.20 所示）提供一个可动极触点和两个固定外部电路触点。当开关处于正常位置（如图所示）时，可动触点靠在固定触点\
  \ A（投 1）上。这显示了通过极通往电路 1 的完整电流路径。\n\n    然而，与另一投和电路无连接。当开关被激活时，极旋转使可动触点与固定触点 B（投\
  \ 2）接触。这断开了与触点 1 的电路，并通过投 2 和电路 2 创建了一条电路路径。\n\n    讨论双投开关时，可能会遇到两种不同类型：真正的双投开关，也可描述为换向开关。此定义指开关只能从一投切换到另一投。不过，也有其他\
  \ DT 开关提供稳定的、未连接的中间或断开位置。你可能会看到这些开关标记为 `XXCO`（如 SP Change Over）或 `XXTT`（三投，尽管中间位置从不是有效电路）。\n\
  \n    ![FIGURE 2.20 SPDT 开关](img/c02f020.png)\n\n    **图 2.20** SPDT 开关\n\n*   **双极单投\
  \ (DPST)**：DPST 开关（如图 2.21 所示）有两个可动触点和两个固定触点。请注意，图中可动触点通过虚线连接。这条虚线代表可动触点间的机械连接，强制它们作为一个整体移动。\n\
  \n\n\n\n\n## 开关类型\n\n由于电路彼此完全绝缘，此 DPST 开关的功能类似于两个通过机械连杆连接在一起的独立 SPST 开关。由于只需一次动作即可接通或断开外部电路，因此此类开关被认为具有单一投掷。\n\
  \n![图 2.21 DPST 开关](img/c02f021.png)\n\n**图 2.21** DPST 开关\n\n* **双刀双掷 (DPDT)**：如图\
  \ 2.22 所示，DPDT 开关的作用类似于两个通过机械连杆连接在一起的独立 SPDT 开关，这与前面的 DPST 开关类似。当开关被激活时，机械连杆强制两个刀（极）离开固定触点\
  \ 1A 和 1B，并与固定触点 2A 和 2B 接触。\n\n虽然市场上确实存在其他复杂的开关触点排列，但刚才讨论的基本开关类型涵盖了您在 ICS 领域可能遇到的绝大多数开关。\n\
  \n![图 2.22 DPDT 开关](img/c02f022.png)\n\n**图 2.22** DPDT 开关\n\n### 致动方式\n\n开关也可根据其激活方式进行分类。*开关执行机构*通常是一种机械装置，它通过某种机械连杆移动开关的触点以使其分离（或闭合）。常见的开关激活方式包括以下几种：\n\
  \n* **拨动开关**：*拨动开关*采用机械杠杆将开关触点从一种状态移至另一种状态。通常，人工操作用于手动定位开关杠杆。此动作如图 2.23 所示。\n\n\
  \    ![图 2.23 典型拨动开关](img/c02f023.png)\n\n    **图 2.23** 典型拨动开关\n\n* **船形开关**：*船形开关*与拨动开关密切相关。开关的机械激活部分是一个摇动机构，用于激活和停用切换机构，如图\
  \ 2.24 所示。\n\n    ![图 2.24 船形开关](img/c02f024.png)\n\n    **图 2.24** 船形开关\n\n* **按钮开关**：*按钮开关*具有通过按压执行器按钮来操作的执行机构。此类开关可设计为“按下接通”或“按下断开”配置。在按下接通配置中，当按下执行器按钮时，开关触点被推合在一起。此动作接通电路，电流可流经开关。\n\
  \n    当然，在*按下断开开关*中，按压执行器会导致开关触点分离，从而断开电路，无电流流动。用于指示这些类型动作的符号如图 2.25 所示。加油泵和重型设备上的*急停开关*是按下断开开关的典型例子。按下开关时，电路断开，泵或设备停止工作。\n\
  \n    ![图 2.25 按下接通/断开开关](img/c02f025.png)\n\n    **图 2.25** 按下接通/断开开关\n\n* **瞬时接触开关**：到目前为止，对切换动作的描述表明，当开关设置为其激活或非激活状态时，它将保持该状态，直到通过额外的人工交互对其进行更改。然而，有一类开关的设计使得切换动作仅在交互保持期间或预定时间内发生。当交互力移除或激活周期结束时，开关动作将恢复到其原始状态。这些开关被称为*瞬时接触开关*。\n\
  \n### 被动/主动状态配置\n\n与开关相关的另一种常用术语是其静止或非致动状态——也称为其“常态”。\n\n* **常开**：对于*常开*（也表示为 *NO*）开关，当激活机构处于非激活（常态）状态时，电路断开，无电流流经开关触点，如图\
  \ 2.26 所示。当开关被激活时，电路转换到另一状态——闭合——电流可流经开关。\n\n    ![图 2.26 NO 和 NC 开关](img/c02f026.png)\n\
  \n    **图 2.26** NO 和 NC 开关\n\n* **常闭**：反之，指定为*常闭 (NC)* 的开关，在开关执行器处于非激活位置时其触点闭合，电流可流经开关。当执行器移至激活状态时，触点相互分离，电路断开。在此状态下，无电流流经开关。\n\
  \n存在一些开关（如前所述的双掷开关）在同一开关内同时具有一组 NO 和一组 NC 触点。当开关被激活时，每对触点都将切换到其激活指定状态。\n\n## 最终控制元件/执行器\n\
  \n在过程控制系统的另一端，*最终控制元件*接收来自控制器的校正信号并做出相应响应以操纵工艺变量。在某些情况下，这可以通过控制器与最终元件之间的直接连接来实现，如图\
  \ 2.27 所示。此示例显示了一个具有模拟输出的电动控制器，向暖箱内的电加热元件提供不同水平的电流。该控制器的能力和输出类型足以直接驱动加热元件。因此，控制回路的这一部分不需要变送器或接口机构。\n\
  \n![图 2.27 直接最终元件控制](img/c02f027.png)\n\n**图 2.27** 直接最终元件控制\n\n然而，大多数工业控制器是数字电气设备，而许多最终元件是模拟和非电气的。在这些场合，需要一个称为*执行器*的附加组件。执行器是控制元件中为另一机构或系统的运行提供并传输定量能量的部分。换句话说，它控制实际*控制机构*的动作。\n\
  \n典型的工业执行器包括以下几种：\n\n* **电动机**：将电能转换为旋转机械能（运动）的装置\n* **气动执行器**：将气动能（压缩空气）转换为直线或旋转力/运动的装置\n\
  * **液压执行器**：将液压压力（压缩液体）转换为直线力/运动的装置，如活塞\n* **电磁阀/继电器**：将开/关电信号转换为其他电平的开/关电信号的电气切换装置\n\
  \n正如此列表所示，典型工业执行器的输入要求与典型工业控制器直接提供的输出截然不同。在许多情况下，将校正信息从控制器转换为高效控制过程所需的格式，至少涉及两个步骤。\n\
  \n在第一步中，控制器的数字输出需要转换为与最终控制元件兼容的模拟信号。这需要一个*数模*(*D/A)*转换过程，这与许多传感器所需的 A/D 过程相反。\n\n\
  \n\n\n根据所涉及的执行器类型，信号调理过程的第二步可能是放大模拟电信号，使其功率足够大以驱动最终元件，或者可能必须将其转换为相应的非电信号，例如气动压力，如图\
  \ 2.28 所示。\n\n![FIGURE 2.28 Actuator signal conversion](img/c02f028.png)\n\n**图\
  \ 2.28** 执行器信号转换\n\n### 继电器\n\n*继电器*是一种用于控制电路操作的机电开关装置。它由两个主要部件组成，如图 2.29 所示。主要部件是一个带有可动机电衔铁的*电磁线圈*。*线圈*及其连接代表继电器中的控制电路。另一个主要部件是一组或多组带有外部连接点的*电气触点*。触点和连接点构成了被控电路（或电路）的基础。\n\
  \n![FIGURE 2.29 A typical industrial relay structure](img/c02f029.png)\n\n**图 2.29**\
  \ 典型工业继电器结构\n\n当电流流过继电器线圈时，由于线圈产生的电磁场作用，磁性衔铁被迫移动。当衔铁移动时，机械连杆也会移动触点组的可动部分。根据触点组的设计，衔铁的运动可能导致触点组的两半合在一起（也称为*合闸*）或分开（称为*分闸*）。\n\
  \n由于触点组的两部分连接到外部电路，如图 2.30 所示，当触点合闸时，形成电路通路，外部电路得电。反之，当触点分闸时，形成开路，通路被切断。这当然会阻止电流流过由继电器控制的电路。\n\
  \n![FIGURE 2.30 The controlled circuit](img/c02f030.png)\n\n**图 2.30** 被控电路\n\n\
  当继电器线圈中没有电流流过时，继电器及其连接到触点的电路均处于其“正常”状态。\n\n给线圈通电会使继电器、其触点及其连接的电路进入其“激活”状态。虽然存在此状态，但通常不用于描述继电器或其电路的操作——仅参考正常状态。\n\
  \n#### 继电器逻辑\n\n在智能控制器引入过程控制之前，继电器是应用最广泛的电子最终元件。继电器也被用来创建非常复杂的数字控制系统。将多个继电器以不同配置互连，以提供对复杂过程的数字控制，这是一种常见做法。\n\
  \n这些格式和互连技术在过程控制行业中已变得如此标准化，以至于它们延续到了基于微处理器的智能控制器的设计和操作中。即使在这些环境中，逻辑和物理输出仍通常被称为线圈。\n\
  \n当然，线圈控制与其相关的一个或多个触点的状态。\n\n图 2.31 显示了一种称为*梯形逻辑图*的电气图，常用于工业继电器控制中。按照惯例，图左侧的垂直线代表电源的电压侧，右侧的垂直线代表接地连接。\n\
  \n![FIGURE 2.31 Relay ladder logic diagram](img/c02f031.png)\n\n**图 2.31** 继电器梯形逻辑图\n\
  \n图中以两个基本部分显示了继电器——其线圈和触点组。线圈（`R1`）显示在顶部水平线（第 1 梯级）上，与一个开关和一个指示灯串联。继电器的触点组（`RC1`\
  \ 和 `RC2`）分别显示在中间和底部水平线（第 2 和第 3 梯级）上，与两个不同的电机（正转电机 `M1` 和反转电机 `M2`）串联。`RC1` 显示为常开触点（两触点间有空隙），而\
  \ `RC2` 显示为常闭触点（斜线标记表示两触点间有电流通路）。\n\n当开关 `SW1` 如图所示处于断开状态时，第 1 梯级无电流通路，因此继电器线圈未得电。因此，触点\
  \ `RC1` 将处于其正常（断开）状态，而 `RC2` 将处于其正常（闭合）状态。因为 `RC1` 断开，不存在电流通过电机 `M1` 的通路。因此，电机不运转。另一方面，`RC2`\
  \ 的闭合状态确实提供了电流流过电机 `M2` 的通路。因此，反转电机将运转。\n\n当 `SW1` 闭合时，继电器线圈形成电流通路并得电。这反过来导致线圈内的衔铁移动，触点\
  \ `RC1` 和 `RC2` 移至其激活状态。就 `RC1` 而言，触点闭合并提供通过 `M1` 的电流通路，使其运转。`RC2` 触点移至断开状态，切断通过\
  \ `M2` 的电流通路，使其停止。\n\n只要 `SW1` 保持闭合，线圈将保持得电，触点将保持其激活状态。如果开关再次断开，线圈将失电，触点将恢复到其正常状态——反转电机运转，正转电机停止。\n\
  \n#### PLC 编程\n\n在控制系统中使用 PLC 最大的特点之一是能够在工艺改变时重新定义其操作。今天生产线可能设置为生产塑料叉，明天生产塑料勺，后天生产塑料刀。之后，生产线可能用于将小包装的盐和胡椒组装在一起，与前三天生产的物品一起装箱发货。使用\
  \ PLC，可根据需要将不同的预写程序上传到设备中以控制所有这些操作。\n\n编程 PLC 有三种常用方法：\n\n*   使用创建*梯形图*（`LDs`）的图形化软件工具，如前所述\n\
  *   构建*功能图表*（`FCs`）的软件工具，可转换为 PLC 代码\n*   可用于直接从 PLC 的*指令集*（`IS`）构建策略的编程工具\n\n在每种情况下，所选的用于生成\
  \ PLC 控制程序的软件包都提供编程界面，以及将创建的指令转换为 PLC 微处理器可运行的*机器码*（1 和 0）所需的工具。\n\n对于现代 PLC，编程软件位于工程师站上并运行，工程师站通常是一台个人计算机。当需要程序时，可通过现场总线链路、网络连接或直接从\
  \ PC 传输到 PLC。一些较新的 PLC 甚至提供 micro-SD 卡槽，允许将现有程序直接上传到设备中。\n\n### 工艺单元\n\n在第 1 章中，您已了解工艺单元。回顾一下，工艺单元被描述为生产系统中可定义并与系统其他单元操作分离的一组操作。图\
  \ 2.32 描绘了一个由三个独立操作组成的简单生产线的一部分。然而，该部分生产线的 ICS 解决方案将整个过程划分为两个工艺单元：\n\n*   *工艺单元\
  \ 1*：输送带/产品分拣系统（由两个不同操作组成）\n*   *工艺单元 2*：产品传送系统（由两个不同操作组成）\n\n\n\n\n## 工业网络协议\n\n\
  当物品被放置在输送机的入口区域时，接近开关会检测到它并通知 `PLC-1` 它已就位。PLC 将给输送机的驱动电机通电，使产品沿皮带移动。随着移动，产品的尺寸通过一组发光器/传感器组合进行感应，这些传感器在物品经过时感应其高度（矮或高）。该信息也由\
  \ PLC 读取。\n\n![FIGURE 2.32 A multiprocess unit production system](img/c02f032.png)\n\
  \n**图 2.32** 多工序单元生产系统\n\n如果物品尺寸被判定为正确，当物品在输送机的出口区域被检测到时，PLC 将停止输送带。如果物品高度不正确，PLC\
  \ 的程序将导致皮带继续移动，将不合格零件从皮带末端甩出。\n\n第二个工序单元由一个用于跨厂房移动生产物品的顶升龙门架和一个转台组件组成，转台从龙门架接收产品并将其定位以便机械臂拾取。由于这两台机器需要的物理\
  \ I/O 连接相对较少，因此单个控制器（`PLC-2`）被指派管理这两项操作。此外，没有程序上的理由要求这两台设备的操作必须分开执行。\n\n当 `PLC-1`\
  \ 将产品停在其输送机末端时，它会通知 `PLC-2` 可供拾取。这可以通过 PLC 之间建立的现场总线链路或以太网网络连接来完成，如 **图 2.33** 所示。\n\
  \n`PLC-2` 检查龙门架小车模块的当前位置（左、右或中间某处），并使小车向左移动直到到达拾取区域。PLC 通过磁铁和磁性干簧管传感器检测到小车已就位，并给小车升降装置底部的磁性拾取器通电。这会导致产品的金属顶部被吸附到升降装置上。\n\
  \n在拾取磁铁通电的情况下，PLC 使小车继续向左移动，直到感应到位于放置区位置的另一个磁铁。此时 PLC 停止小车电机并切断升降装置拾取磁铁的电源。产品落在转台的着陆区上。\n\
  \n接下来，`PLC-2` 给转台驱动电机通电，使其旋转直到 PLC 检测到位于停止区的磁铁。然后它切断转台电机电源，产品即可供机器人拾取。\n\n![FIGURE\
  \ 2.33 PLC communication connections](img/c02f033.png)\n\n**图 2.33** PLC 通信连接\n\n\
  虽然这里描述的整个过程可以由一个拥有足够 I/O 容量以处理所有必需的物理输入输出连接的单个 PLC 来控制，但设计者选择基于两个较小的紧凑型 PLC 来实施\
  \ ICS。相反，设计者也可以选择为系统中的每台设备分配一个单独的 PLC，并通过前面描述的通信安排之一将它们连接在一起。\n\n在本例中，所选 PLC 仅具有\
  \ 12 个数字量输入。因此，它只能与具有 12 个或更少需要监控变量的工艺进行接口。同样，如果 PLC 仅提供 7 个数字量或继电器输出通道，而工艺需要控制超过该数量的变量，则必须寻找具有足够输出通道来处理该工艺的另一个控制器。换句话说，给定的\
  \ PLC 只能处理其物理连接端子所提供数量的输入和输出。\n\n另一个可能阻止单个控制器有效控制给定工艺的因素是其计算或决策能力。如果设备太慢或不具备足够的计算资源来跟上为维持工艺控制所必须做出的决策，则必须寻找不同的控制器。\n\
  \n对于基于微处理器的控制器，这取决于几个因素——它们的处理器总线宽度、处理器时钟速度和内存容量。控制器的性能也是为特定工艺编写的编程代码的函数。过于复杂或臃肿的编程代码可能无法高效执行，从而阻止控制器跟上工艺控制要求。\n\
  \n### 常见工业协议\n\n与 IT 网络一样，OT 网络的运行必须由 `协议` 来管理。虽然 IT 网络已随时间演变，采用以太网和 TCP/IP 协议作为其主要网络标准，但工业控制行业生成了许多专有的\
  \ ICS 协议，旨在满足与过程控制相关的特定挑战。然而，许多协议已进一步开发以适配以太网。归根结底，任何协议讨论的主要关注点是：*是否有可用的现场和控制设备能完成所需工作，并与相关协议兼容？*\
  \ 设计或升级 ICS 解决方案时的一个主要考虑因素是选择能为工艺执行必要功能、且在为网络选定的协议方面兼容的现场和控制设备。请记住，OT 网络中的所有设备必须使用同一种语言。\n\
  \n`开放 DeviceNet 供应商协会`（`ODVA`）创建了 `通用工业协议`（`CIP`）标准，供其成员开发工业网络产品时使用。`CIP` 是一种与介质无关的、面向对象的协议，跨越了\
  \ OT 网络的一套服务。`CIP` 为将多种 ICS 专用应用——如配置、控制、同步、安全和数据——集成到可与生产组织企业侧使用的以太网网络协同工作的通信架构中提供了载体。\n\
  \n`CIP` 是其他几个 OT 标准协议的基础，包括 `EtherNet/IP`、`DeviceNet`、`CompoNet` 和 `ControlNet`。这些协议与\
  \ `ProfiNet/ProfiBus` 协议一起，在工业控制网络领域争夺市场份额。然而，有两个协议占据了该市场的 60%：`EtherNet/IP` 和 `ProfiNet`。以下章节将更详细地讨论这两个协议。\n\
  \n### EtherNet/IP 协议\n\n基于以太网的技术及相关技术的采用，导致了组织 IT 网络与其工业控制网络对应部分的融合。随着网络的两个部分集成为一个内聚的数据通信载体，组织能够将实时生产数据应用于其业务决策。\n\
  \nOT/IT 网络集成过程的关键之一是开发将传统 OT 功能与 IT 网络相结合的协议。正如 IT 网络扩展 TCP/IP 协议以在以太网网络上传输音频和视频信号一样，ICS\
  \ 行业开发了类似技术以在该等网络上传输工业信号和数据。在所有情况下，关键在于如何将 ICS 信息装载到以太网数据帧中。\n\n\n\n\n\n`EtherNet/IP\
  \ 协议`最初由罗克韦尔自动化公司为其 Allen Bradley 系列 PLC 开发。EtherNet/IP 构建于 CIP 协议之上，始于 1990 年代初，并已发展成为美国最广泛接受的工业协议之一。基本上，它由通过以太网连接在\
  \ OT 设备之间传输的 CIP 信息组成。它采用 TCP/IP 协议套件和 IEEE 802.x 作为基础，然后集成前面描述的 CIP 功能，为实时控制能力提供\
  \ ICS 服务，该能力延伸至各种工业产品。工业 EtherNet/IP 协议提供的性能明显优于类似的标准以太网和 TCP/IP 网络。\n\n例如，EtherNet/IP\
  \ 协议使用 UDP 数据包在节点之间传输基本数据，同时使用 TCP 数据包在网络设备之间上传和下载设备程序、设定点和数据集。\n\n根据通信角色，EtherNet/IP\
  \ 网络组织为两种类型的设备：\n\n*   `扫描器设备`：打开连接并发起传输的设备\n*   `适配器设备`：向扫描器设备提供数据的设备\n\n这些通信设备包括工业机器人、PLC、智能传感器、智能执行器和工业机器，例如\
  \ `计算机数控` (`CNC`) 机床（路由器、铣床和车床）。与所有其他网络设备一样，这些设备必须配备物理连接以适配网络介质，以及特定于协议的设备驱动程序、服务和应用程序。\n\
  \n因为 EtherNet/IP 构建在 TCP/IP 协议栈之上，所以将 ICS 设备与企业服务器和互联网集成相对容易。\n\n### Modbus\n\n\
  互连智能工业控制设备的事实标准通信协议称为 `Modbus`。Modbus 是一种串行通信协议，专门开发用于为工业控制应用提供联网功能。因为它是专门为这些应用设计的，Modbus\
  \ 经过优化，可提供快速、低开销的通信，且不包含大量数据安全功能。\n\n它可用于在工业控制网络中连接多达 254 个设备。特别是，它广泛用于在 RTU 与 DCS\
  \ 或 SCADA 主/备站之间提供 DCS 或 SCADA 服务。设备可以通过网络将各种不同的数据类型（如温度或压力读数）传输到主控制器。\n\n与所有其他网络通信方案一样，连接到总线上的设备被分配一个唯一地址。其中一个节点地址将被指定为负责发起所有网络命令的服务器。常见的\
  \ Modbus 帧格式包括特定于 RTU 的帧、ASCII 字符帧和 TCP 帧。这些不同的帧类型在设备之间不可互操作。\n\n串行通信 Modbus 版本的物理实现通过\
  \ RS-232 或 RS-485 串行通信链路进行。然而，也有一个用于以太网网络的 Modbus 版本。适用于 TCP 帧的 Modbus 规范称为 `Modbus\
  \ TCP/IP`，旨在控制和监控内联网或互联网环境中的 OT 设备。因为不同的 Modbus 协议变体不可互换，所以 Modbus TCP 设备必须与该格式一起使用。TCP\
  \ 端口 502 用于支持 Modbus 客户端和服务器之间的 TCP/IP 连接。\n\n### ProfiNet/ProfiBus\n\n`ProfiNet`，也称为\
  \ `Process Field Net`，是一种基于以太网的工业联网协议，在德国开发，旨在成为一种实时以太网。该协议套件包含三个协议层级，以提供高效控制某些工业过程所需的极高速数据传输。\n\
  \n*   基本 TCP/IP 协议组件（用于生产工厂的 `ProfiNet 基于组件的自动化` [`CBA`]）。\n*   相对快速的 `实时` (`RT`)\
  \ 协议（用于 IO 应用的 `ProfiNet CBA`）。ProfiNet RT 可提供高达每秒 4,000 次的采样率。\n*   极高速的 `等时实时`\
  \ (`IRT`) 传输协议（`ProfiNet IO`）。IRT 的新版本可提供高达每秒 32,000 次的采样率。\n\n`等时协议`使用类似于内置于高速\
  \ USB 端口中的协议的传输技术，以执行流式音频和视频传输。连接到 ProfiNet 网络的设备相互协商以确定兼容的数据包大小。双方确定数据包大小后，设备之间的传输可以以突发模式进行（不同于异步和同步通信中发生的逐帧传输）。\n\
  \n连接到 ProfiNet 网络的每个设备由三种类型的地址标识：\n\n*   `其 MAC 地址`：与其他网络设备一样，此地址印制在硬件组件中，如果更换设备则会改变。\n\
  *   `IP 地址`：IP 地址启用动态寻址技术来标识设备。这些地址的分配可以通过 ProfiNet 的发现和基本配置协议 (DCP) 过程或 IT 网络中使用的\
  \ DHCP 过程执行。DCP 主要用于不具备 DHCP 服务器的网络环境。\n*   `设备名称`：此名称为设备提供固定标识。\n\nProfiNet 提供了一种灵活的高速、高度确定性的工业网络系统，运行在以太网布线上，并以\
  \ 8P8C 或欧式 M12 锁定连接器终止。它已在多个行业领域广泛采用，如制造自动化、楼宇自动化、过程自动化和电力生产/分配行业，以及工业安全控制系统、高可靠性系统和冗余系统。\n\
  \nProfiNet 协议构建在最初由西门子在德国创建的 `ProfiBus` 现场总线协议之上，旨在取代当时老化的 0–20mA 标准。它旨在为工业控制制造商开发产品提供双向现场总线标准。随着时间的推移，它已被扩展和完善为两种不同的\
  \ ProfiBus 变体：\n\n*   `用于“分散”外围设备的 ProfiBus (ProfiBus DP)`：与 ProfiBus 传感器和执行器一起使用的主要\
  \ ProfiBus 版本。通信通过双绞线 RS-485 电缆进行，该电缆同时传输电源和数据。\n*   `用于过程自动化的 ProfiBus (ProfiBus\
  \ PA)`：这种 ProfiBus 变体专门设计用于可能存在爆炸条件的危险区域。这主要基于专用电缆，通过总线以足够低的电流水平直接向现场设备供电，以防止发生事件时引发点燃。\n\
  \n### DNP3\n\n`分布式网络协议` (`DNP3`) 实际上是由 Harris 分布式自动化产品公司开发的一套开放、公共的工业通信协议，旨在为电网系统中的中央\
  \ SCADA 主站与不同类型的远程设备（控制器，如 IED、PLC 和 RTU）之间提供联网功能。它是一种比 Modbus 更新的标准，作为第 2 层协议运行，并包含第\
  \ 4 层和第 7 层组件。虽然它最初是为电力网络开发的，但 DNP3 已找到其在水务 SCADA 系统中的应用。该协议标准的维护、开发和所有权继续由 DNP3\
  \ 用户组负责。\n\n\n\n\n该协议使用起来相当简单。它规定了 27 个基本功能码，可用于主设备和从设备之间的数据交换。有些用于从远程设备获取数据，而其他的则用于配置远程设备的设置。有一个代码保留供远程设备使用，当其操作中发生告警条件时通知主站。TCP\
  \ 端口 `2000` 用于促进网络中 DNP3 设备之间的通信。\n\nDNP3 通常用于在公用事业变电站内提供串行连接，以及变电站与位于远程控制中心的 SCADA\
  \ 主站之间的连接。在变电站内，DNP3 运行在 RS-232/485 串行连接或 TCP/IP 以太网网络上。远距离链路通过使用调制解调器和电话线，或使用前文所述的其他远距离通信技术来实现。\n\
  \nDNP3 的设计初衷是优化 OT 数据和命令从一台设备到另一台设备的传输。这使得 DNP3 容易受到各类传统网络攻击，包括中间人攻击和欺骗攻击。后续的发展为该协议增加了认证功能，以增强\
  \ SCADA 安全性。这些功能包括将 DNP3 协议封装在 SSL/TLS 和 IPSec 协议封装器中。\n\n#### ICCP\n\n*控制中心间通信协议*（*ICCP*）已被全球各地的公用事业单位采用，用于\
  \ SCADA 主站服务器、公用事业控制中心以及跨广域网的公用事业之间的实时数据通信。在美国，该协议用于互联公用事业集团，以改善区域电网参与者之间的生产和分配协调。\n\
  \nICCP 是一个主要运行在 TCP/IP 以太网上的客户端-服务器网络系统。然而，它不提供固有的认证或加密保护，因此必须通过替代方式提供这些功能。\n\n\
  #### OPC\n\n*开放平台通信*（*OPC*）协议标准是一种广泛接受的工业客户端-服务器规范，旨在促进工业控制应用与智能控制设备之间的数据交换。OPC\
  \ 最初旨在将 Microsoft/Windows 产品引入工业控制领域。然而，随着时间的推移，OPC 标准已演进为也可用于非 Microsoft 平台。\n\n\
  开发该协议的目的是创建一个通用结构，SCADA 硬件和软件制造商可据此进行设计。这提高了硬件服务器和 SCADA 软件包（服务器和客户端）的互操作性。\n\n\
  #### BACnet\n\n*楼宇自动化与控制网络*（*BACnet*）协议由美国采暖、制冷与空调工程师学会开发，用于将楼宇自动化设备联网。一些 BACnet\
  \ 网络基于 IP（BACnet/IP），而其他的则是 RS-485、主/从令牌传递（BACnet MS/TP）系统。\n\n符合 BACnet 标准的设备通过这些网络相互通信。典型的\
  \ BACnet 设备包括用于暖通空调控制系统、火灾探测系统、照明系统和门禁控制系统的设备。BACnet 还采用许多符合 BACnet 标准的网络连接设备，如\
  \ BAS 路由器、网关和控制器。TCP 端口 `47808` 用于支持 BACnet/IP 设备之间的 TCP/IP 连接。\n\nBACnet 已被证明存在设计漏洞，使其面临多种不同类型的网络安全攻击——这与大多数\
  \ OT 网络协议的情况一样。一项评估列出了 19 种不同的 BACnet 服务和 5 项 BACnet 功能，它们均易受不同类型的网络安全攻击。\n\n###\
  \ 企业网络协议\n\n由于组织将其 IT 网络建立在以太网技术和*传输控制协议/互联网协议*（*TCP/IP*）协议套件之上，OT 网络工程师和管理员自然也必须处理这些技术。本章剩余部分将详细讨论这些技术。\n\
  \n#### TCP/IP\n\n美国国防部最初开发 TCP/IP 协议作为跨网络传输数据的协议。它被认为是最安全的网络协议之一。由于 TCP/IP 由美国政府开发，无人实际拥有其所有权，因此它被采纳为互联网的传输标准。凭借连接多种类型计算机和服务器的能力，TCP/IP\
  \ 被用于绝大多数网络，是所有当前系统的首选网络协议。\n\n无论使用何种类型的计算设备或软件，信息都必须以 TCP/IP 数据包的形式跨网络移动。该协议要求将数据分组捆绑在一起，称为*网络数据包*。TCP/IP\
  \ 数据包的设计主要是为了允许消息分片和重组。它由两个首部字段（IP 首部和 TCP 首部）以及随后的数据字段组成，如图 2.34 所示。\n\n![图 2.34\
  \ TCP/IP 数据包](img/c02f034.png)\n\n**图 2.34** TCP/IP 数据包\n\nTCP/IP 协议被互联网社区广泛接受，几乎每种计算机操作系统都支持它，包括\
  \ Apple、Android、Windows、UNIX、Linux，甚至网络打印机。它也可用于任何拓扑结构。因此，所有这些计算机类型都可以使用 TCP/IP\
  \ 协议跨网络交换数据。\n\n随着时间的推移，TCP/IP 协议已扩展为包含许多选项，网络技术人员和管理员必须理解这些选项，以确保 TCP/IP 系统的正确配置和运行。首先，TCP/IP\
  \ 协议不是单一协议；它实际上是一套协议，最初由国防部于 1969 年开发。TCP/IP 由两个主要部分组成：传输控制协议 (TCP) 和互联网协议 (IP)。这些协议与许多其他协议协同工作，形成一种称为*协议栈*的结构。\n\
  \n如前所述，网络协议最重要的功能是确保信息到达其预定的网络位置。归根结底，这是 TCP/IP 协议的真正功能。它通过将信息数据包路由到 IP 地址指定的位置来实现这一点。在前一张图中，你应该注意到\
  \ TCP/IP 首部包含两个地址：消息来源的源地址和发送目标的目的地址，如图 2.35 所示。\n\n![图 2.35 TCP/IP 路由](img/c02f035.png)\n\
  \n**图 2.35** TCP/IP 路由\n\n因为人类不善于记忆数字串，计算机通常由名称标识。为了让信息到达人类期望的地址，必须在计算机理解的数字 IP\
  \ 地址和我们赋予的字母数字名称之间进行某种解析。为此，TCP/IP 依赖一组协议和服务，它们代表特殊的高级名称和地址解析功能。\n\n这些协议和服务包括以下内容：\n\
  \n*   *域名系统 (DNS) 服务*：一种配合分层 DNS 命名系统工作的服务，可将可读的域名转换为用于定位连接到网络的计算设备的数字 IP 地址\n\n\
  *   *动态主机配置协议 (DHCP)*：一种由 ISP 和其他网络使用的协议，用于从可用地址的旋转池中自动向用户分配 IP 地址\n\n\n\n\n## 地址解析协议\
  \ (ARP)\n\n**地址解析协议 (ARP)**：该协议/工具用于将 IP 地址转换为 MAC 地址。网络设备使用称为 ARP 缓存的表来存储它们已通信过的其他网络设备的\
  \ ARP 信息（IP 和 MAC 地址）。\n\n由于互联网基本上是一个巨大的 TCP/IP 网络，其中连接到它的任意两台计算机不能拥有相同的地址，因此连接到互联网的网络必须遵循由\
  \ **互联网服务提供商 (ISP)** 分配的特定 IP 寻址方案。然而，只要您的网络未连接到互联网，就可以使用任何 IP 寻址方案。这称为 **专用网络**。\n\
  \n配置专用网络时，您必须设计一个在整个网络中使用的 IP 寻址方案。虽然从技术上讲，您可以在专用网络中使用任何您想要的 IP 寻址方案而无需咨询 ISP，但每个\
  \ IP 类别中都保留了特殊的网络地址范围供专用网络使用。这些是未在互联网上注册给任何人的保留地址。\n\n如果您正在配置专用网络，应使用以下地址选项之一，而不是创建随机的寻址方案。网络上的客户端总数通常决定了您应使用哪种\
  \ IP 寻址类别。可以使用以下专用网络 IP 地址列表：\n\n*   **IP 地址为 `10.0.0.0`，子网掩码为 `255.0.0.0`**：此 A\
  \ 类范围提供超过 1600 万个专用 IP 地址。\n*   **IP 地址为 `169.254.0.0`，子网掩码为 `255.255.255.0`（Microsoft\
  \ AIPA 默认值）**：此 C 类范围提供 254 个专用 IP 地址。\n*   **IP 地址为 `172.(16-32).0.0`，子网掩码为 `255.240.0.0`**：此\
  \ B 类范围提供 65,000 个专用 IP 地址。\n*   **IP 地址为 `192.168.0.0`，子网掩码为 `255.255.0.0`**：此\
  \ C 类范围提供 254 个专用 IP 地址。\n\n此外，请记住，在建立专用 IP 寻址方案时，所有主机必须具有相同的网络 ID 和子网掩码，并且网络上的任意两台计算机不能具有相同的\
  \ IP 地址。\n\n## 域名系统\n\n要在 TCP/IP 网络中与另一台计算机通信，您的计算机必须拥有目标主机的 IP 地址。作为用户，我们在建立连接时通常指定计算机的名称，例如\
  \ Marcraft，而不是 IP 地址。这些名称需要转换为目标计算机的 IP 地址。将计算机名称与 IP 地址匹配的过程称为 **名称解析**。**域名系统\
  \ (DNS)** 可用于为任何 TCP/IP 客户端执行名称解析。\n\nDNS 是在网络中一台或多台服务器上运行的服务。这些服务器拥有数据库，用于为网络执行\
  \ DNS 名称到 IP 地址的解析功能。如果您的网络使用 DNS 进行名称解析，则必须为所有客户端配置一台或多台 DNS 服务器的 IP 地址。DNS 也是互联网使用的名称解析服务。\n\
  \n### DNS 名称解析\n\n每个域都必须有一台 **DNS 名称服务器**，负责将其客户端注册到网络的下一级更高层级。提供域名服务的任何计算机在技术上称为\
  \ **DNS 服务器**。在较大的 IT 网络中，DNS 服务器通常位于公司的数据中心。对于较小的企业和住宅网络，DNS 服务器由其互联网服务提供商作为其服务套餐的一部分提供。\n\
  \n所有 **DNS 服务器** 都维护一个 **DNS 数据库**，列出了它们负责的名称到 IP 地址的映射。当 **DNS 客户端** 向本地 DNS 服务器提交名称解析请求时，服务器将搜索其\
  \ DNS 数据库，并在必要时搜索分层 DNS 系统，直到找到提交给它的主机名或 **完全限定域名 (FQDN)**。此时，它会解析所请求主机名的 IP 地址并将其返回给客户端。\n\
  \n如 图 2.36 所示，简化的 DNS 过程如下：\n\n1.  当您在 Web 浏览器中输入网页地址时，客户端会向特定的计算机名称（例如 `www.marcraft.com`）发出查询（访问请求）。\n\
  2.  本地 DNS 服务器（分配给客户端计算机的 DNS 服务器）检查其内存缓存中是否有该域名。\n3.  如果本地 DNS 服务器无法回答查询，通常会将查询转发到根\
  \ DNS 服务器以寻找匹配项（所有功能正常的 DNS 服务器，包括本地 DNS 服务器，都包含所有根 DNS 服务器 IP 地址的静态列表）。\n4.  根服务器会将本地\
  \ DNS 服务器引荐给一组主要的 .com（域）服务器。反过来，本地 DNS 服务器将从列表中选择一台 .com 服务器并查询 `marcraft.com`\
  \ 的地址。作为响应，.com 域 DNS 服务器会将您引荐给一组子域服务器（如果存在——`Example1.com` 和 `Example2.com`）。然后本地\
  \ DNS 服务器将向 `marcraft.com` 子域 DNS 服务器（或其中之一）查询 `marcraft.com` 的地址。\n5.  根据 `marcraft.com`\
  \ 子域的结构，所选的 `marcraft.com` 服务器可能会将您引荐给一组用于 `marcraft.com` 地址的 `marcraft.com` 子域\
  \ DNS 服务器；如果不存在其他子域，它将返回 `marcraft.com` 的 IP 地址。\n\n![图 2.36 DNS 过程](img/c02f036.png)\n\
  \n**图 2.36** DNS 过程\n\n除了域名跟踪功能外，DNS 系统还将单个计算机的域名解析（链接名称到地址）为其当前的 IP 地址列表。某些 IP\
  \ 地址永久分配给特定的域名，因此每当在互联网上发出该域名时，它总是访问同一个 IP 地址。这称为 **静态 IP 寻址**。然而，大多数 ISP 使用动态 IP\
  \ 寻址方案来分配 IP 地址。\n\n## 动态主机配置协议\n\n**动态主机配置协议 (DHCP)** 是一种互联网协议，可用于使用 TCP/IP 自动向网络上的设备分配\
  \ IP 地址。使用 DHCP 可简化网络管理，因为是软件而非管理员分配和跟踪 IP 地址。因此，许多 ISP 使用 DHCP 的动态 IP 寻址功能为拨号用户提供接入。该协议自动向网络上的设备提供\
  \ IP 地址、子网掩码和默认路由器配置参数以及其他配置信息。\n\n该协议的动态寻址部分还意味着可以将计算机添加到网络中，而无需手动为其分配唯一的 IP 地址。事实上，设备每次连接到网络时都可以被分配不同的\
  \ IP 地址。在某些网络中，设备的 IP 地址甚至可以在其保持连接时发生变化。DHCP 还支持静态和动态 IP 地址的混合使用。\n\nDHCP 是由 **互联网工程任务组\
  \ (IETF)** 开发的开放标准。它是一种客户端-服务器安排，其中 DHCP 客户端联系 DHCP 服务器以获取其配置参数。DHCP 服务器使用适合当前网络结构的参数动态配置客户端。\n\
  \nDHCP 携带的最重要的配置参数是 IP 地址。计算机必须最初被分配一个适合其所连接网络且未分配给该网络上任何其他计算机的特定 IP 地址。\n\n\n\n\
  \n如果计算机移动到新网络，则必须为该新网络分配一个新的 IP 地址。`DHCP` 可用于自动管理这些分配。`DHCP` 客户端支持内置于所有计算机操作系统中。所有计算机服务器操作系统版本均包含\
  \ `DHCP` 的客户端和服务器支持。\n\n虽然 `DHCP` 是 IT 网络环境中备受推崇、节省时间的工具，但在 OT 网络中却未被广泛接受。在这些网络中，`DHCP`\
  \ 的第一个主要缺点是设备每次启动时都可能获得不同的 IP 地址。虽然这是 IT 网络中的常见且可接受的做法，但工业控制系统通常需要控制设备（如 `PLC`）在每次需要通信时都位于同一\
  \ IP 地址。\n\n控制设备不仅通常需要始终保持相同的 IP 地址，而且如果该设备发生故障，其替换设备也需要采用该 IP 地址，以便与控制系统的其他组件正常交互。实现这一点最直接的方法是在将设备安装到网络之前连接到该设备，并使用软件实用程序直接为其配置静态\
  \ IP 地址。第二种选择是从包含通用 `DHCP` 服务器的网络连接到该设备，该服务器已配置为为该设备保留租用的静态 IP 地址。在此类配置中，IP 地址租约预留与设备的\
  \ `MAC` 地址绑定。\n\n## 复习题\n\n以下问题测试您对本章所呈现材料的掌握程度。您可以根据 附录 D 中列出的答案核对您的答案。\n\n1. 为什么异步通信长期以来一直是工业控制系统的主要方法？\n\
