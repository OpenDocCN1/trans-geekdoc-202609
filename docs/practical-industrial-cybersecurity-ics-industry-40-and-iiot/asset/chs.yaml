  \n关于 GICSP 考试的更多信息请参见附录 A。\n\n### 本书涵盖哪些内容？\n\n本书帮助读者准备该领域领先的行业认证——全球工业网络安全专业人员\
  \ (GICSP) 考试，该考试由全球信息保障认证机构 (GIAC) 推出，GIAC 是 SANS 研究所的附属机构。\n\n\n\n\n\n## 实用工业网络安全：ICS、工业\
  \ 4.0 与 IIoT\n\n《实用工业网络安全：ICS、工业 4.0 与 IIoT》一书是一个基础培训体系，旨在提供对工业网络安全挑战、工具和技术的扎实理解，并培养专业网络安全技能组合的基础。这是通过一个循序渐进的过程来实现的，具体如下：\n\
  \n### 第 1 章：工业控制系统\n\n除非你一直在工业过程环境中工作，否则那些环境中涉及的操作、设备、协议和标准对你来说可能很陌生。本章旨在向读者介绍基本工业过程控制操作中涉及的组件和系统的功能。本章后几节涉及常见的工业安全与防护系统。\n\
  \n## 第 2 章：ICS 架构\n\n对于熟悉典型企业/IT 网络的人来说，工业网络在许多方面仍是一个陌生的环境。即使是运行 OT 网络的最基本组件和原则，也不同于传统\
  \ IT 网络中所见的那些。本章向读者介绍基本的 OT 现场设备架构，并对比常见工业网络协议与企业网络协议的基本功能。\n\n### 第 3 章：安全的 ICS\
  \ 架构\n\n本章建立在前一章介绍的基本信息之上，展示这些组件是如何组织起来以构建安全的运营技术（OT）网络架构。这涉及两个主要主题领域——网络分段与安全分区，以及无线网络安全。\n\
  \n## 第 4 章：ICS 模块与要素加固\n\n工业网络安全工作始于硬件加固。然而，它也延伸至本地主机的操作系统、文件系统及其应用程序。本章涵盖六大领域中涉及的\
  \ OT 模块和要素加固技术与实践——端点防护、嵌入式设备安全、操作系统安全、应用安全、IT 和 OT 网络中反恶意软件产品的使用，以及网络安全/加固工作。\n\
  \n### 第 5 章：ICS 网络安全要素\n\n本章开篇部分探讨最基本的网络安全原则——CIA、AAA、不可抵赖性、最小权限原则和职责分离策略。与典型的 IT\
  \ 网络环境不同，数据机密性通常不是与 OT 网络相关的首要安全原则。相反，最重要的原则通常是可用性。ICS 网络是实时环境，实时拥有可用的数据通常比其机密性更重要。\n\
  \n本章中间部分转而探讨针对工业/公用事业环境的威胁知识。这包括对网络安全领域不同参与者的描述，以及针对它们的不同攻击类型的性质。\n\n本章最后几节探讨采用加密技术来加密和保护数据。这些部分涵盖的信息包括数字签名、证书管理、PKI、公钥/私钥、哈希和密钥管理。\n\
  \n## 第 6 章：物理安全\n\n所有安全的开端都是物理安全。尽管它经常不与计算机、网络或网络安全出现在同一文本中，但如果没有物理安全，这些形式的安全就无法存在。本章定义了物理安全，并探讨基础设施安全如何融入网络安全。本章信息将使读者能够区分认证与授权，识别典型的物理访问控制设备，并识别不同类型安全与监控系统及设备的优势与劣势。\n\
  \n## 第 7 章：访问管理\n\n访问控制基本上是一种识别从事特定工作人员的策略，通过某种识别系统对其进行认证，然后仅向他们提供访问所需资产的钥匙。上一章在物理层面探讨了这一点。本章处理逻辑访问控制模型以及与控制企业网络和\
  \ OT 网络访问相关的实践。此处的关键主题包括典型目录服务和用户访问管理程序及策略的覆盖。\n\n## 第 8 章：ICS 安全治理与风险管理\n\n策略、程序和指南是协同工作的治理要素，旨在为员工提供充分指导，以便在组织内执行其任务。本章探讨这些要素及其如何制定以满足组织需求。此处开发的关键\
  \ ICS 主题包括标准、需求、豁免和例外。\n\n本章还探讨组织如何在其策略和程序的开发、部署和维护中管理风险。这包括计算和评估风险因素以确定风险缓解和风险接受策略。当组织进行\
  \ OT 安全评估、风险缓解和安全策略生成计划时，必须解决某些风险领域。您将了解 ICS 网络环境中使用的标准风险管理工具，如风险缓解计划和 PHA 危险与可操作性研究（HAZOP）。\n\
  \n## 第 9 章：ICS 安全评估\n\n安全评估涉及以现实的方式测试网络架构及其策略、程序和指南，以确定其有效性。本章探讨 OT 网络环境中的渗透测试和漏洞利用。这包括熟悉安全测试工具和安全评估中涉及的\
  \ ICS 设备测试策略。您将接触到旨在定位组织网络和计算环境中漏洞的安全评估演练。\n\n### 第 10 章：ICS 安全监控与事件响应\n\n在研究完成、网络设计并实施、安全评估已进行并验证后，必须通过监控和审计网络中表明其正受到威胁或已被攻陷的活动，来提供持续的安全保障。本章以事件、网络和安全监控及日志记录活动的形式探讨持续安全。与这些工作相关的关键主题包括变更管理、补丁的分发与安装、软件重装和固件管理。\n\
  \n本章后半部分探讨实施有效的事件响应计划。在各类现代网络中，认为它们不会受到攻击是天真的——问题不在于*会不会*，而在于*何时*。成功管理这些事件的关键在于拥有一个完善且经过测试的事件响应计划，并了解事件识别、分类、修复/恢复的步骤和技术。\n\
  \n# 第 11 章：灾难恢复与业务连续性\n\n组织必须能够在各类小型紧急情况和大型灾难面前继续运营，以确保组织的健康与延续。这涉及展望未来，制定稳健的灾难恢复计划和业务连续性计划。本章探讨创建这两份相互关联文档的最佳实践。\n\
  \n本书以如何从成功的攻击或自然灾害中恢复的讨论作为结语。应对此类事件的最佳解决方案是具备快速恢复并重返部分进而全面运营的能力。本节探讨不同的系统备份与恢复选项及实践。\n\
  \n\n\n\n\n本书提供了丰富的评估材料。每章末尾都有 15 道开放式/填空题和 10 道多项选择题。这 10 道多项选择题测试你对本章介绍的基本概念的掌握情况，而\
  \ 15 道开放式问题旨在测试理解力和批判性思维。\n\n附录 A 包含了关于从 GIAC 报名和参加 GICSP 考试的具体信息。本课程的范围和顺序是根据全球工业网络安全专业人员\
  \ (GICSP) 考试的目标列表开发的。\n\n附录 B 包含了大量的 GICSP 术语词汇表。\n\n附录 C 包含了本书开发过程中使用的关键参考资料，旨在为您提供素材来源，以补充此处涵盖的主题。\n\
