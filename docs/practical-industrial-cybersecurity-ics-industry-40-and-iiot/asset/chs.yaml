  _\\_\\_ 使人工操作员能够观察不同过程的运行参数，并接管过程以更改参数或进行修正。\n\n10.  哪类自动化过程控制系统专门设计用于监测和控制过程内外已被定义为不安全或潜在不安全的条件？\n\
