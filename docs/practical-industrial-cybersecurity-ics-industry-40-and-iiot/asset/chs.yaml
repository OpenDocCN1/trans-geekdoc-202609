  4. 网络设备\n\n# 8. 在 ICS 环境中实施无线网络的主要缺点是什么？（选择所有适用项。）\n\n1. **可靠性降低**\n2. 连接范围增加\n\
  3. **安全性降低**\n4. **数据延迟**\n\n# 9. 在工业处理环境中，在 OT 网络中实施无线传感器的主要障碍是什么？（选择所有适用项。）\n\n\
  1. **易受电气干扰**\n2. **干扰其他通信信道**\n3. **需要本地电源供应或电池**\n4. **无线传感器往往比较脆弱，在工业环境中不耐用。**\n\
  \n# 10. 哪种无线协议标准被工业控制社区最广泛采用？\n\n1. 蓝牙\n2. **ZigBee**\n3. WiMax\n4. Wi-Fi\n\n# 第\
  \ 4 章\n\nICS 模块与要素加固\n\n## 简介\n\n在计算机和网络环境中，术语*加固*是指使组件或系统更安全的过程。正如您从列出的测试目标中所见，这发生在\
  \ OT/IT 网络的几个不同领域和几个不同层级。在本章中，我们将探讨与 ICS 各个领域加固相关的工具和技术。\n\n*   端点\n*   操作系统\n*\
  \   应用程序\n*   嵌入式 ICS 设备\n*   网络\n*   服务器\n*   网络连接设备\n\n## 端点安全与加固\n\n*端点*被定义为连接到\
  \ TCP/IP 网络的用户计算设备，它使用户能够跨网络访问信息。此称呼通常包括台式机和笔记本电脑，以及平板电脑和智能手机等移动计算设备。\n\n### 用户工作站加固\n\
  \n*计算机加固*工作始于硬件。然而，它们也延伸到本地主机的操作系统、其文件系统及其应用程序。您可以从三个安全层的角度来考虑保护单个 IT 或 OT 设备。\n\
  \n*   *外部边界*是物理设备及其外壳（硬件）周围外部的空间。\n*   *内部边界*应被视为设备的操作系统和应用程序（软件）。\n*   设备的*内部*由无形数据资产组成，例如在设备中以电子方式创建、获取和存储的信息（数据）。\n\
  \n图 4.1 以图形方式说明了这些层。\n\n![图 4.1 三个边界](img/c04f001.png)\n\n**图 4.1** 三个边界\n\n您应该意识到，网络犯罪分子真正想从这些设备中获取的是内部的程序和数据。为了保护这些资产，您必须考虑此类人员如何以及在何处可以访问它们，以便破坏、销毁或窃取它们。对于计算设备和智能控制设备，攻击者可以在这三个一般位置访问这些项目：\n\
  \n*   当它们在内存中时（使用中）\n*   当它们在存储设备中时，如硬盘驱动器和闪存驱动器（静止时）\n*   当它们从一个地方传输到另一个地方时（传输中）\n\
  \n以图 4.1 中描绘的个人计算机为例，考虑如何穿透其机箱以获取内部的无形贵重物品。\n\n保护端点设备的第一层级是控制对它们的访问。您无法破坏、销毁或窃取您无法接触到的东西。这也适用于智能计算和控制设备。因此，第一步是在切实可行的范围内控制对设备的物理访问。\n\
  \n与 IT 环境中的 PC 和服务器一样，自主或半自主的 OT 控制设备（如 `PLC` 或独立微控制器）通常可以放置在安全、可上锁的机柜中，仅限持有钥匙的人员访问。\n\
  \n大多数计算设备外部边界最明显的访问点是通过其基本输入设备，如键盘、鼠标或触摸敏感显示屏。如果有人可以简单地坐在设备前并自由使用其输入设备，他们就有途径访问内部信息。他们所要做的就是对设备进行断电重启并等待其启动。\n\
  \n### BIOS 安全子系统\n\n大多数个人计算机的硬件中内置了一个基本安全工具，它在操作系统启动发生之前提供一些保护。*基本输入/输出系统* (`BIOS`)\
  \ 提供了可通过其 `CMOS` 设置实用程序配置的基本硬件安全选项。图 4.2 显示了一个典型的安全配置屏幕。通常，这些选项包括设置用户密码以控制对系统的访问，以及设置管理密码以控制对\
  \ `CMOS` 设置实用程序的访问。\n\n![图 4.2 CMOS 安全配置](img/c04f002.png)\n\n**图 4.2** CMOS 安全配置\n\
  \n“设置用户密码”选项使管理员能够建立用户在启动过程中必须输入的密码，以完成引导过程并获得对操作系统的访问权限。没有此密码，系统永远不会达到入侵者可用来访问其内部边界和内部信息的操作级别。\n\
  \n但是，此密码不提供对配置用户和管理密码选项的 `CMOS` 设置实用程序的访问。必须使用“设置管理密码”选项来建立可用于访问 `CMOS` 设置实用程序的密码。\n\
  \n安全配置屏幕还可能包括设置病毒检查和备份提醒的选项，这些提醒会在系统启动时定期弹出。除了启用这些设置外，管理员还可以指定通知之间的时间间隔。\n\n`CMOS`\
  \ 设置实用程序中的主要安全选项集之一是那些可用于控制对系统内部边界和内部资产访问的选项。在大多数情况下，这些选项涵盖诸如限制通过资产的物理端口和可移动介质系统允许的访问，以及对系统磁盘驱动器引导扇区的访问等内容。\n\
  \n由于 `CMOS` 密码控制对系统所有部分的访问（甚至在引导过程发生之前），如果用户忘记密码，将会带来一些不便。发生这种情况时，如果不完全重置 `CMOS\
  \ RAM` 的内容，将无法访问系统。\n\n较新的端点基于称为*统一可扩展固件接口* (`UEFI`) 的高级固件基础运行，它是传统 `BIOS` 的高级、更强大的补充。支持\
  \ `UEFI` 的系统可启动至 `Windows` 操作系统。此补充提供了更快的启动速度、对大于 2 TB 磁盘驱动器的支持以及额外的安全功能。\n\n安全启动是一项高级\
  \ `UEFI` 功能，旨在帮助端点抵御恶意软件的攻击和感染。安全启动为操作系统的引导加载程序、关键系统文件和未经授权的 `ROM` 设备提供保护。\n\n`Linux`\
  \ 系统需要第三方包来为其发行版签名 `UEFI` 二进制文件以供使用。\n\n\n\n\n### 额外的外部边界访问加固\n\n除了个人电脑使用的基本输入设备外，大多数计算机系统中还内置了其他几条通往内部边界的路径。即使是非联网的计算和控制设备，也可能通过可移动介质系统和物理访问端口（连接点）受到外部源的利用。\n\
  \n#### 物理端口访问\n\n物理 `hardware ports` 使基本端点能够与可选的可移动设备进行交互，如 图 4.3 所示。它们也构成了潜在的安全威胁，因为怀有恶意的个人可以通过这些端口直接访问计算机的内部通信和处理系统。\n\
  \n![FIGURE 4.3 Physical PC ports](img/c04f003.png)\n\n**图 4.3** 物理 PC 端口\n\n硬件端口提供了对计算机内部通信总线的访问，这些总线将其所有内部组件连接在一起，包括其数据总线、内存和内部存储设备（即获取程序和数据访问权限的三个领域）。图\
  \ 4.4 描绘了典型 PC 内部总线结构的布局。在拥有物理端口连接访问权限的人与系统内部结构之间，唯一的阻隔组件是计算机内部 `chipset` 的一部分——总线控制器接口。该电路的操作由系统的\
  \ BIOS 和操作系统控制。\n\n![FIGURE 4.4 PC chipset](img/c04f004.png)\n\n**图 4.4** PC 芯片组\n\
  \n数据可以通过这些端口下载到可移动介质设备中并迅速带走。同样，恶意程序（如本章后面将介绍的病毒和蠕虫）也可以从可移动介质源上传到机器中。一旦这些程序被引入宿主系统，它们就会感染系统，并可能损坏或破坏存储在其中的数据和程序。\n\
  \n较新端点中使用最广泛的硬件连接端口是 `USB`、`HDMI` 和音频端口。然而，在 OT 计算设备中，你可能仍会遇到较旧的端口类型，例如 `RS-232`\
  \ 和 `RS-485` 串行通信端口。\n\n现代计算设备中最流行的硬件端口是 `通用串行总线 (USB)` 端口。USB 设备可以非常小巧，易于隐藏和携带。因此，它们为将恶意软件注入本地主机计算机和智能控制设备提供了极佳的载体，而这些设备可能受到网络访问的严密保护。基于这个原因，控制对计算设备上\
  \ `USB` 端口的访问，以及控制各个用户对端口的使用权限非常重要。\n\n对于 `USB` 端口，其端口连接的操作由主板 `CMOS 设置实用程序` 中的设置控制。基于前面提到的安全原因，可能有必要访问\
  \ `CMOS 设置实用程序` 以禁用其 `USB` 功能。\n\n还有一些较旧的传统硬件端口，你可能不太常遇到。表 4.1 总结了端点使用的物理端口类型。它们通常位于设备背面，但某些机型为方便使用可能在前面板上提供其中一些端口。图\
  \ 4.5 描述了这些端口的物理外观。\n\n**表 4.1** 传统端口\n\n| 端口 | 连接器 |\n| --- | --- |\n| 键盘 | PS/2\
  \ 6 针 mini-DIN |\n| 鼠标 | PS/2 6 针 mini-DIN |\n| COM1 | DB-9M |\n| LPT | DB-25F |\n\
  | VGA | DE-15F (3 行) |\n| 游戏 | DE-15F (2 行) |\n| 调制解调器 | RJ-11 |\n| 局域网 | BNC/8P8C\
  \ (RJ-45) |\n| 声音 | RCA 1/8″ 迷你插孔或 3/32″ 次迷你插孔 |\n| SCSI | Centronic 50 针 |\n\n\
  ![FIGURE 4.5 Typical I/O port connectors](img/c04f005.png)\n\n**图 4.5** 典型 I/O 端口连接器\n\
  \n如果你确实遇到这些端口，其中可能构成安全风险的包括 `RS-232/422/485` 串行 `COM` 端口、`小型计算机系统接口 (SCSI)` 和 `LPT`\
  \ 并行打印机端口。这些端口都能够处理与系统内部设备的双向通信。\n\n#### BIOS 端口启用功能\n\n系统的 `BIOS` 通常提供设备控制选项，以控制计算机的外部硬件连接端口。通过禁用这些端口，用户和管理员可以帮助确保未经授权的用户无法利用端口获得对系统的未授权访问、将信息传出系统或将恶意软件程序下载到系统中。\n\
  \n除了控制通过 `USB` 端口的访问外，如果系统具备这些接口，`BIOS` 还可能提供对串行端口、并行端口、闪存介质读取器、智能卡插槽、CardBus 插槽和\
  \ `eSATA` 端口的控制，如 图 4.6 所示。\n\n![FIGURE 4.6 Port enabling options](img/c04f006.png)\n\
  \n**图 4.6** 端口启用选项\n\n#### 可移动介质访问\n\n可移动计算机介质带来多重安全风险。这些风险包括因介质的便携性而导致的数据被盗造成的潜在数据丢失，以及将破坏性恶意软件引入宿主系统的潜在可能。\n\
  \n图 4.7 展示了与 PC 系统相关的不同类型的可移动介质。这些通常包括以下内容：\n\n*   磁性存储介质，如外部硬盘驱动器和备份磁带\n*   光学存储介质，如\
  \ `CD` 和 `DVD` 光盘\n*   固态电子存储设备，如外部 (`SSD`) 固态硬盘、`USB` 闪存盘或拇指驱动器、`MMC` 记忆棒和 `SD`\
  \ 卡\n\n![FIGURE 4.7 Removable media systems](img/c04f007.png)\n\n**图 4.7** 可移动介质系统\n\
  \n这三种介质设备类型都通过其驱动器和硬件连接端口提供对计算机内部系统的访问。\n\n##### BIOS 启动设备/顺序控制\n\n大多数 `BIOS` 提供启动设备启用、禁用和排序功能，应利用这些功能来控制计算机如何启动运行。通常，`BIOS`\
  \ 为用户和管理员提供下列类型设备的启用或禁用选项：\n\n*   光盘驱动器\n*   硬盘驱动器\n*   `USB` 设备\n*   `SD` 卡\n*\
  \   `eSATA` 设备\n\n除非有必要例行地从其他设备启动系统，否则除主硬盘驱动器选项外，所有启动选项都应禁用，以提供最佳安全性。\n\n##### Microsoft\
  \ Autorun 功能\n\nMicrosoft 某些版本的操作系统包含一项称为 `Autorun` 的功能，一旦检测到驱动器或读取器中存在介质，它就会自动运行在可移动介质设备上发现的可执行程序。此功能构成了非常严重的安全威胁，因为位于介质上的恶意软件程序可以被设计为自动运行并感染宿主设备。\n\
  \n据统计，在旧版 Windows 系统中，高达 50% 的恶意软件感染归咎于此功能。只需在 Windows 中禁用 `Autorun` 功能（通过下载应用程序将其关闭）即可消除该威胁。另一种替代方案是修改\
  \ Windows 注册表以关闭 `Autorun`。\n\n### 移动设备保护\n\n前一章指出，无线传感器和控制网络已在 OT 环境中取得了一些进展。这些传感器和控制设备使用其他移动设备中常见的传统无线技术，例如\
  \ `Bluetooth`、`Wi-Fi`、近场通信 (`NFC`) 和蜂窝网络。\n\n\n\n\nWi-Fi 和蓝牙的传输范围均有限，但在这些范围内，黑客有可能拦截无线连接，或者至少干扰无线连接。当然，这些网络也带来了前文所述的所有漏洞，这使得它们对黑客更具吸引力。\n\
  \n除了无线技术向工业传感器和控制环境迁移之外，企业中也出现了一种日益增长的趋势，即允许员工自带笔记本电脑、平板电脑和智能手机等端点计算设备进入工作场所。在许多情况下，企业还提供\
  \ Wi-Fi 接入以适应这种 `自带设备` (`BYOD`) 环境。正如将 OT 网络连接到企业网络为外部人员利用此前相对更安全的 OT 环境开辟了新途径一样，连接到\
  \ OT 网络的 `BYOD` 设备敞开了更多的漏洞。\n\n网络管理员和安全人员必须确定这种 `BYOD` 环境是否会给其网络造成安全缺口。例如，与特定 `BYOD`\
  \ 端点（或其特定配置）相关的漏洞可能使未经授权的用户能够通过该设备访问网络，并利用该连接窃取专有或敏感数据。在这些情况下，组织必须在其风险评估中纳入这些额外的漏洞，以确定其对这类政策和做法的风险接受程度。\n\
  \n### 近场通信\n\n`近场通信` (`NFC`) 是一种短距离无线连接协议标准，可用于在设备彼此靠近时发起通信。通信发起后，另一种无线技术（如蓝牙或 Wi-Fi）可能会接管以执行数据交换。这种高频技术非常适合某些安全应用，因为它要求标签（如\
  \ RFID 身份徽章）与读卡设备之间必须近距离接触。这种近距离要求非常重要，因为它可以最大限度地减少未经授权的访问尝试。许多低频（通常为 125 KHz）系统已被用于安全徽章系统。\n\
  \n虽然利用这些系统并非易事，但它们容易被拥有专用硬件和一定技能的人利用。黑客通过靠近佩戴 RFID 徽章的用户，利用自己的读卡器读取目标的徽章信息。一旦捕获到徽章数据，他们就可以制作自己的徽章以绕过访问控制。这可能发生在用户身处食堂、当地咖啡厅，甚至通过藏在办公室或生产设施中的小型\
  \ `IIoT 设备` 时发生。\n\n在互联网上并不难找到制作攻击工具的方案，该工具可插入商用 RFID 读卡器（也很容易获取）。在支持任何 `NFC` 系统之前，网络管理和安全人员审查其安全机制至关重要，因为某些系统比其他系统更脆弱。\n\
  \n### 移动设备安全防护\n\n虽然 `移动设备` 的安全顾虑在非 ICS 应用中当然更大，但所有移动用户在使用移动网络以及在工作场所使用移动设备时都应保持谨慎。\n\
  \n*   除非您正在与设备配对且需要此功能，否则请关闭蓝牙自动发现功能。也请留意蓝牙设备上的其他安全选项。\n*   避免使用公共热点。但是，如果您确实使用它们，请注意潜在的恶意行为，并使用\
  \ `TLS/SSL` 连接，仅在受保护的系统中输入凭据。\n*   关闭自动连接（重新连接）到 Wi-Fi 接入点的功能。\n*   蜂窝网络不太可能被攻破；当需要高安全性时，请使用蜂窝网络。\n\
  *   如果实现了端到端加密，所有无线技术都会更安全。\n\n## 操作系统安全/加固\n\n`操作系统` 是旨在控制和协调计算机系统运行的程序。作为一类，它们无疑是有史以来设计得最复杂的程序之一。在所有基于微处理器的环境中，操作系统从程序或输入源（如计算机用户）接收命令并执行它们以执行某些所需操作。同样，操作系统在近乎同样复杂的软件应用程序和它们运行所在的计算机硬件之间充当中介。\n\
  \n正如 图 4.8 所述，操作系统充当应用程序与计算机硬件之间的桥梁。这些应用程序使用户能够创建与特定应用相关的数据文件，如文字处理、多媒体分发、远程数据通信、业务处理和用户编程语言。\n\
  \n由于操作系统是通往计算机应用程序和数据的电子网关的主要组成部分，您必须了解不同的操作系统通用类型，以及可用于保护它们的工具和技术。\n\n![图 4.8 计算机系统中\
  \ DOS 的位置](img/c04f008.png)\n\n**图 4.8** 计算机系统中 DOS 的位置\n\n### 文件系统安全\n\n`文件管理系统`\
  \ 在保护存储在磁盘、光盘或可移动存储设备上的数据的存在性和完整性方面极为重要。如果文件系统被破坏或损坏，数据将变得不可访问并丢失。此外，如果未经授权的用户获得了对文件系统及其存储数据的访问权限，他们就获得了破坏、销毁或窃取数据的机会。\n\
  \n保护文件系统及其数据的主要工具之一是使用 `访问控制列表` (`ACLs`)。文件系统使用 `ACLs` 向特定用户授予或拒绝对其不同文件的访问权限，并控制授予访问权限后个人可执行的活动类型。例如，在文件管理系统的控制下，您可能被赋予运行文件、读取文件、写入文件或对其执行其他操作的能力。\n\
  \n操作系统的 `ACLs` 还用于控制对其他对象的访问，如 `TCP/UDP` 端口以及 I/O 设备。它们的 `ACL` 表维护记录，标识每个用户对特定系统对象拥有的访问权利。\n\
  \n根据操作系统的不同，资源访问控制可以以 `强制访问控制` (`MAC`) 或 `基于角色的访问控制` (`RBAC`) 的形式实现。UNIX 和 Linux\
  \ 系统通常提供 `MAC` 方法，而 Microsoft Windows 平台提供 `RBAC` 控制。\n\n在 `MAC` 版本中，操作系统决定谁可以做什么以及可以做到什么程度。在\
  \ `RBAC` 下，系统根据用户的授权来限制或允许对对象的访问。`RBAC` 结构通常是大型企业采用的访问控制方法。\n\n在 UNIX 和类 UNIX 操作系统中，开发了一套称为\
  \ `可移植操作系统接口` (`POSIX`) 的互操作性标准，以标准化 UNIX 版本的变体。符合 `POSIX` 的系统（UNIX、Linux 和 macOS\
  \ 系统）支持某种类型的 `ACL` 来管理传统的 UNIX 文件访问权限。\n\n在 Microsoft Windows 环境中，这些功能以 `权限` 的形式分配给文件夹和文件。权限也可以被定义为执行某项操作的特权。在基于\
  \ UNIX 和 Linux 的系统中，为用户分配文件的 `访问权限`。\n\n保护数据的另一个工具是对其进行 `加密`，使其在没有解密密钥的情况下变得不可用。加密/解密过程可以在数据存储和从设备检索时执行，也可以在数据从一个位置移动到另一个位置时执行。\n\
  \n\n\n\n## 数据加密\n\n加密数据涉及获取数据并使用密钥代码（或 `encryption key`）对其进行处理，该密钥定义了数据的原始（`plaintext`）版本是如何被操作的。此概念在图\
  \ 4.9 中进行了说明。\n\n![图 4.9 数据加密](img/c04f009.png)\n\n**图 4.9** 数据加密\n\n任何获得加密密钥的人都可以使用它，通过使用解密算法或\
  \ `decryption key` 的解密过程来解码消息。没有解密密钥的人无法确定原始数据是什么。\n\n一种特别有效的密钥系统是 `Public Key Encryption`（`PKE`，公钥加密）。该技术采用两个密钥来确保加密数据的安全——一个\
  \ `public key`（公钥）和一个 `private key`（私钥）。公钥（人人皆知）用于加密数据，而私钥或密钥（仅指定接收者知晓）用于解密数据。公钥和私钥以这样的方式关联：仅凭拥有公钥无法推导出私钥。\n\
  \n数字设备或网络中的数据加密可以在许多层面发生：\n\n*   作为文件系统级（文件和文件夹级）加密\n*   作为磁盘级加密\n*   作为传输级加密\n\n\
  大多数主要的磁盘操作系统都通过其文件管理系统提供某种类型的数据加密功能。根据操作系统的设计，加密可以应用于设备级别、磁盘（或卷）级别，或文件和文件夹级别。第三方加密应用程序也可用于这些操作系统中。\n\
  \n不同操作系序可用的数据加密服务将在本章后续部分讨论。数据加密技术在第 5 章“ICS 网络安全要点”中有详细介绍。\n\n启用了 `No-Execute`（`NX`，不可执行）技术的操作系统（该技术在某些微处理器中可用）会将内存的特定区域标记为不可执行，以便这些区域中的任何代码都无法被执行。此功能用于防止某些类型的恶意软件将其代码注入这些内存区域并执行以接管系统。这些攻击被称为\
  \ `buffer overflow attacks`（缓冲区溢出攻击），将在下一节中更详细地描述。\n\n操作系统还包含 `isolation mechanisms`（隔离机制），可在主机内存中创建容器，将不同进程相互隔离。这使操作系统能够在与其他进程隔离的情况下运行进程文件系统，并保护其免受意外更改。在\
  \ UNIX/Linux 系统中，change root（`chroot`，更改根目录）操作会改变表面上的根目录。在 Windows 操作系统中，`WIN32\
  \ API` 负责密码认证、可共享对象的自主保护、访问控制以及操作系统文件系统中的权限管理。\n\n## 文件系统攻击\n\n针对操作系统文件系统的典型攻击包括以下几种：\n\
  \n*   `Race condition attacks`（竞争条件攻击）：当攻击者在多用户/多任务环境中利用连续事件的时序，在事件之间插入恶意代码时，就存在竞争条件。\n\
  \n    例如，当操作系统创建临时文件时，存在 `time of check, time of use`（`TOCTOU`，检查时刻，使用时刻）条件。在操作系统检查该文件名是否存在与实际写入文件之间的时间差内，攻击者执行程序，使用临时文件的文件名保存恶意代码包。\n\
  \n    恶意代码可能包含更高的访问权限，以便攻击者可以读取或操作文件，或者它可能包含指向脚本文件的链接，该脚本文件授予对存储管理员密码的密码文件的访问权限。\n\
  \n*   `Using Alternate Data Streams`（`ADS`，备用数据流）`to hide files`（隐藏文件）：高级黑客利用此 NTFS\
  \ 操作系统兼容性功能隐藏 rootkit 或其他黑客工具，以建立一个匿名基地来发起对系统的攻击。\n\n    ADS 功能最初内置于 NTFS 中，旨在为\
  \ Apple 的 HFS 文件系统提供支持，后者有时会将数据“分叉”到不同的文件中。然而，此技术已被采用用于存储文件元数据和提供临时存储。\n\n    如前所述，黑客利用\
  \ ADS 功能将其工具对系统隐藏，因为使用原生用户界面几乎无法检测到。隐藏的 ADS 文件嵌入某个标准操作系统文件后，即可在不被检测为非法操作的情况下执行。ADS\
  \ 操作的唯一迹象是注入隐藏工具的文件上出现非法时间戳。\n\n*   `Performing directory traversals`（执行目录遍历）：这些攻击利用安全性薄弱的软件应用程序访问本不应可访问的文件，以“遍历”到更高级别的文件夹或目录，如图\
  \ 4.10 所示。此类攻击也称为 `backtracking`（回溯）、`directory climbing attacks`（目录攀爬攻击）或 `canonicalization\
  \ attacks`（规范化攻击）。\n\n![图 4.10 目录遍历](img/c04f010.png)\n\n**图 4.10** 目录遍历\n\n黑客利用这种形式的\
  \ `HTTP exploitation`（HTTP 漏洞利用）访问 Web 服务器的目录树。获得访问权限后，他们可以浏览目录树以查看受限文件或在服务器上执行命令。此类攻击使用常见的\
  \ Web 浏览器针对配置不当的 Web 服务器发起。通过仔细的 Web 服务器配置、过滤 Web 浏览器输入以及使用 `vulnerability scanner`（漏洞扫描器）软件，可以最大程度地减少此类攻击。\n\
  \n## 文件系统加固\n\n尽管文件系统是操作系统的一部分，但仍可使用一些特定于文件系统的技术来改进或加固文件系统安全性。\n\n*   第一步是如果可能，在整个组织中采用标准化的文件系统。\n\
  *   考虑将引导/系统文件与共享目录和数据分离，方法是将它们放置在每台服务器和用户计算设备的不同分区中。\n    *   对于 Windows 系统，将引导和系统文件放在\
  \ `C:\\`，将共享文件放在其他驱动器（如 `D:\\` 或 `E:\\`）中。\n    *   对于 Linux 系统，更改 `/etc/fstab`\
  \ 中的挂载选项以限制用户访问。此外，用户可写目录（如 `/home`、`/temp`、`/var` 和 `/temp`）应挂载在其他分区上。\n*   从引导/系统分区以及包含不应共享信息的任何其他分区中移除任何隐藏共享功能。\n\
  *   对于关键文件夹和文件权限，使用单独分配的权限，而不是基于角色的访问控制选项。仅对真正需要跨组共享的信息使用 RBAC 选项。RBAC 和其他逻辑访问控制策略将在本章后面讨论。\n\
  *   在可用的情况下采用文件和文件夹加密选项。\n*   为对组织运营最关键的文件夹和文件建立定期审计和报告机制。\n\n## 操作系统安全选择\n\n由于其普及度，Microsoft\
  \ Windows 成为恶意和恶作剧性质的恶意软件及灰件编写者的最大攻击目标。因此，Windows 承受了与病毒和间谍软件相关的绝大多数攻击。\n\n这一事实导致一些\
  \ Windows 客户转向其他操作系统平台，如 Linux 或 macOS，它们成为恶意软件目标的可能性要小得多。表 4.2 总结了与各种操作系统相关的常见安全功能。\n\
  \n### Linux SystemV 与 Systemd\n\n\n\n\n## 现代 Linux 发行版\n\n现代 Linux 发行版基于两种基本设计之一——`SystemV`\
  \ 和 `Systemd`。`SystemV` 是一个较旧的平台，可追溯到最初的 Linux，而 `Systemd` 是一个较新的平台，许多 Linux 发行版已迁移至此。Systemd\
  \ 设计提供了更快的启动速度和更好的依赖管理。\n\nSystemd 采用现代系统服务管理器，负责管理在后台运行并为其他程序提供功能的 `daemons`（守护进程）。其中一些守护进程用于监控安全事件并提供警报。它们还提供安全功能，用于将服务和应用程序与底层操作系统隔离，以及彼此隔离。\n\
  \nRed Hat、CentOS、Fedora、Amazon、Debian、Ubuntu 和 Mint 等组织已在 Systemd 平台上构建其 Linux 发行版。基于\
  \ SystemV 架构的发行版包括 Alpine、Slackware 和 Linux from Scratch。\n\n### 表 4.2 操作系统安全性比较\n\
  \n| 名称 | 资源访问控制 | 子系统隔离机制 | 集成防火墙 | 加密文件系统 | 无执行 (NX) |\n| --- | --- | --- | ---\
  \ | --- | --- |\n| Linux | POSIX、ACL、MAC | Chroot、基于能力的安全、secomp、SELinux、AppArmor\
  \ | Netfilter、因发行版而异 | 是 | 硬件/模拟 |\n| macOS | POSIX、ACL | Chroot、使用 chflags 设置的\
  \ BSD 文件标志 | Ipfw | 是 | 硬件/模拟 |\n| Windows Server | ACL、权限、RBAC | Win32 WindowStation、桌面、作业对象\
  \ | Windows 防火墙 | 是 | 硬件/模拟 |\n| Windows 客户端操作系统 | ACL、权限、RBAC | Win32 WindowStation、桌面、作业对象\
  \ | Windows 防火墙 | 是 | 硬件/模拟 |\n\n## 操作系统加固\n\n如前所述，防御本地计算机系统免受攻击的第二层级是保护其操作系统。这涉及在开发人员发现操作系统的易受攻击代码段后对其进行更新。操作系统加固通过应用服务包、补丁和更新形式的新编程来实现。\n\
  \n### 服务包\n\n操作系统发布一段时间后，供应商可能会将多项产品改进合并，并为特定的待升级操作系统分发一个编号的 `service pack`（服务包）。关键文件应始终备份，以防服务包或操作系统在安装服务包后无法工作。\n\
  \n### 补丁\n\n`Patches`（补丁，微软也称为 `hotfixes` 热修复）是针对已发布分发的特定操作系统的通用改进。许多补丁和更新纯粹是外观改进和便利的附加功能，而其他补丁则是关键的安全升级，旨在应对特定病毒、发现的威胁或操作系统中发现的弱点。\n\
  \n## 更新\n\n`update`（更新）是指提高操作系统可靠性、安全性或吸引力的服务包或补丁。某些更新可能使操作系统更方便，但不一定更安全。因此，实施前应进行测试。考虑备份关键文件，以防补丁或操作系统在安装后无法工作。\n\
  \n## 常见操作系统安全工具\n\n系统启动后，可以采取一些措施防止未经授权的人员访问操作系统及其应用程序。特别是，如果操作系统未控制系统，则难以访问存储在系统中的信息（这是大多数恶意计算机活动的真实目标）。这些步骤包括：\n\
  \n## 实施本地登录要求\n\n*   建立用户和组账户\n*   设置密码策略\n*   建立锁定策略\n\n### 实施额外的身份验证选项\n\n*  \
  \ 使用生物识别认证设备\n*   使用物理认证设备\n*   使用多因素认证设备\n\n### 使用本地管理工具\n\n*   启用系统审核和事件日志记录\n\
  *   安装 Microsoft sysmon\n*   实施数据加密工具\n*   监管应用软件安全\n\n### 提供远程访问保护\n\n*   建立防火墙设置\n\
  *   配置浏览器安全选项\n*   建立并实施恶意软件防护\n*   应用安全更新和补丁\n\n图 4.11 显示了 Microsoft Windows 控制面板中可用的本地安全策略/安全设置选项。第一组选项包括密码和账户锁定策略选择，用于在本地控制对系统的访问。您还可以为系统审核、用户权利和安全策略实施本地管理策略。\n\
  \n![图 4.11 本地安全策略/安全设置](img/c04f011.png)\n\n**图 4.11** 本地安全策略/安全设置\n\nWindows 防火墙和高级安全工具使本地管理员（或所有者）能够建立和配置本地防火墙。图中的其余工具是安全工具，可建立本地策略以控制本地计算机与外部网络的交互。在以下章节中，我们将检查这些工具，以确定如何实施它们以获得最佳的本地主机安全实践。\n\
  \n**Bastille Linux** 是一套 Linux 加固工具，用于锁定操作系统并配置系统以实现最佳安全性。它由 SuSE、Debian、Gentoo\
  \ 和 HP-UX Linux 及 UNIX 产品的供应商作为发行版的一部分提供。\n\n## 实施本地登录要求\n\n个人计算设备使用的主要用户身份验证工具是\
  \ `username`（用户名）和 `password`（密码）登录。通常，有三种与用户相关的登录类型需要处理：本地计算机登录、特定软件应用程序登录和网络登录。\n\
  \n在本地计算机级别，通常需要本地登录。此级别的登录验证用户使用本地计算机资源、文件和设备的资格。然而，在多个用户可能被允许使用同一台计算机的共享计算机环境中，`local\
  \ user and group credentials`（本地用户和组凭据）通过存储在本地计算机上的 `user accounts database`（用户账户数据库）创建和配置。\n\
  \n这些凭据用于获得对计算机的初始访问权限、控制对其本地资源的访问以及控制对网络资源的访问。在 Windows 环境中，这些账户通过计算机管理下的“本地用户和组”实用程序创建和管理，如图\
  \ 4.12 所示。\n\n![图 4.12 Microsoft 本地用户和组账户](img/c04f012.png)\n\n**图 4.12** Microsoft\
  \ 本地用户和组账户\n\n独立系统首次启动时，会在操作系统的本地账户数据库中自动创建一个 `administrator's account`（管理员账户）。管理员拥有对系统所有硬件和软件资源的权利和权限。管理员反过来创建其他用户，并根据需要授予他们对系统资源的权利和权限。\n\
  \n管理员可以单独处理 `users`（用户），或将用户聚集到 `groups`（组）中以进行统一管理。这样，管理员可以对个人或整个组分配权限或限制。使用组的价值在于，它节省了将通用权限应用于多个用户的时间，而无需逐个应用。\n\
  \n\n\n\n操作系统首次启动时创建的另一个默认组是一种称为 `Guests` 组的账户类型。此默认组通常对系统具有最小化的访问权限，且其所有成员共享同一用户配置文件。Guest\
  \ 用户账户自动成为该组的成员。\n\n本地环境中的每个用户和组都有一个配置文件，描述为其创建的资源和桌面配置。配置文件中的设置可用于限制用户可执行的操作，例如安装、移除、配置、调整或复制资源。\n\
  \n当用户登录系统时，系统会检查其配置文件并根据其信息调整系统。这些凭据用于获得对计算机的初始访问权限，并控制每个用户对其本地资源的访问权限。此外，对某些软件应用程序和其他资源的访问可能由额外的应用程序级密码控制。\n\
  \n### 密码\n\n为了使密码有效，它必须具备一定程度的 `complexity`（复杂性）。其 `entropy`（熵值，不可预测性的度量）必须足以挫败前文提到的各种密码破解技术的企图。\n\
  \n密码的长度直接影响其被破解的难易程度。密码越长，破解难度越大。通常建议密码应由 6 到 9 个字符组成。必须避免使用 5 个或更少字符的密码。如果操作系统允许，可使用更长的密码，前提是员工或客户能够记住它们。\n\
  \n密码的宽度涉及可包含的不同字符类型的数量，包括不属于字母表的字符。数字、特殊字符以及大小写字母的组合能增强密码强度，特别是当操作系统将大写和小写字母视为完全不同的字符时。\n\
  \n在某些操作系统中，密码可以包含控制字符、替代字符甚至空格。理想情况下，管理员在为服务器机房或云访问选择密码时，应从以下所有字符集中选取字符：\n\n*  \
  \ 大写字母，如 `A`、`B`、`C`\n*   小写字母，如 `a`、`b`、`c`\n*   数字，如 `1`、`2`、`3`\n*   特殊字符，如 `$`、`?`、`&`\n\
  *   替代字符，如 `μ`、`∞` 和 `√`\n\n密码的深度涉及猜测其含义的难度。虽然好的密码应易于记忆，但仍应难以猜测。密码的含义不应是通过简单推理即可轻易猜测或推断出来的东西。\n\
  \n一种行之有效的方法是采用短语而非单词进行构思。助记短语常被采用，从而创建出既难以猜测又无需写下来就能记住的密码。然后，可将短语中某些单词的首字母转换为替代字符。例如，数字\
  \ `4` 可用于替换所有使用字母 `f` 的位置。\n\n在美国，美国国家标准与技术研究院（NIST）制定了安全密码创建指南。例如，根据 NIST 标准，用户生成的密码长度应至少为\
  \ 8 个字符，而机器生成的密码最小长度必须为 6 个字符。最大长度应为 64 个字符。\n\n在验证处理过程中，密码应经过哈希和加盐处理。NIST 还建议废弃密码“提示”的使用，改用基于知识的身份验证技术来证明身份。\n\
  \n#### 额外的密码安全\n\n随着骗子窃取密码的手段日益简易，对额外密码安全的需求得到了更多认可。密码最终甚至可以像直接索要一样轻易被获取。人员绝不应与任何人讨论密码，无论这种对话看起来多么无害或合法。\n\
  \n尽管标准的密码保护实践通常足以阻挡潜在入侵者，但某些情况需要更复杂的方法。在这些情况下，可通过加密技术和 `one-time passwords`（`OTPs`，一次性密码）提供额外保护。\n\
  \n`Password encryption`（`hashing`，密码加密/哈希）是获取标准密码并将其打乱，使其对嗅探器、破解者或其他窃听者变得毫无意义的过程。NIST\
  \ 建议在存储或检索密码时使用哈希算法。\n\n一次性密码仅适用于单次交易。虽然这种安全方法非常可靠，但它要求管理员携带存储密码的安全密码管理器，或使用第三方服务为组织的超级用户账户提供\
  \ `privileged identity management`（`PIM`，特权身份管理）。\n\n最佳密码实践包括以下内容：\n\n*   使用一致的命名约定\n\
  *   始终为账户提供初始密码，并要求用户在首次登录时修改\n*   保护密码（不要写在公开场所）\n*   为组织使用密码管理器\n*   不使用默认密码\n\
  *   教育用户创建强密码\n*   在组织的所有层级强制执行密码策略\n\n#### 账户锁定策略\n\n操作系统提供密码 `lockout policy settings`（锁定策略设置），使管理员能够实施密码策略，防止攻击者反复尝试访问系统。这可以防止攻击者使用\
  \ `brute-force attacks`（暴力破解攻击）猜测账户密码从而闯入系统。\n\n暴力破解攻击涉及反复尝试登录以猜测密码。如 图 4.13 所示，典型的锁定策略设置包括以下内容：\n\
  \n*   `Account lockout duration/Failure Reset Interval`（账户锁定时长/失败重置间隔）：在预设的登录失败次数后，账户将被锁定多长时间。将此值设为\
  \ `0` 将阻止账户自动解锁，直到管理员手动重置为止。\n*   `Account lockout threshold/Max Failures`（账户锁定阈值/最大失败次数）：账户被锁定前允许尝试访问的次数。此设置的默认值为\
  \ `0`，即禁用账户锁定功能。NIST 规范要求在用户被锁定前允许 `10` 次失败尝试。\n*   `Reset account lockout counter\
  \ after/Lockout Duration`（重置账户锁定计数器时间/锁定持续时间）：账户锁定计数器归零前可经过的时间量。\n\n![图 4.13 Windows/Linux\
  \ 锁定选项](img/c04f013.png)\n\n**图 4.13** Windows/Linux 锁定选项\n\n#### 计算机锁定\n\n用户登录后绝不应让计算机无人看管。这样做会给他人访问和操纵其计算机、数据及网络敞开大门。所有用户都应接受培训，在离开计算机时（即使仅几分钟）要么\
  \ `log off`（注销）要么 `lock`（锁定）计算机。在管理层面，可配置系统策略，在一段不活动期后（如 7 到 15 分钟）自动注销用户，并要求其重新登录才能使用系统。\n\
  \n锁定计算机可防止入侵并保留当前系统状态。解锁时，系统中处于活动状态的应用程序和数据仍保持打开，使用户能更轻松地继续未完成的工作。还应指导用户确保在下班时注销。这将关闭所有应用程序并确保数据文件已保存。\n\
  \n#### 物理身份验证设备\n\n\n\n当无法像前文所述那样对硬件进行物理锁定时，可以使用一些硬件设备，使个人计算机系统仅供授权用户使用，而其他人无法使用。这些设备包括智能卡和生物识别设备等。\n\
  \n智能卡的可编程性使其能够配合动态密码策略工作，并能与主机计算机来回传递令牌和证书。智能卡系统将用户的秘密 `PIN` 码（仅用户本人知晓的信息）结合起来使用。`Tokens`（令牌）由网络的\
  \ `certificate authority`（证书颁发机构）认证系统生成，以产生唯一的通行码。该通行码用于验证用户身份及其对不同资源的访问权限。\n\n\
  ### 使用生物识别扫描仪进行身份验证\n\n`Biometric scanners`（生物识别扫描仪）正变得越来越复杂，现在包括各种改进型设备，配备可搜索的数据库和支持应用程序。除了作为物理设施访问的身份验证设备外，许多生物识别扫描设备已演变为可用于个人计算机。图\
  \ 4.14 展示了专为 PC 设计的不同指纹扫描仪设备。\n\n![FIGURE 4.14 Fingerprint scanners](img/c04f014.png)\n\
  \n**图 4.14** 指纹扫描仪\n\n与个人计算机配合使用最广泛的生物识别认证设备是指纹扫描仪。一些指纹扫描仪制造商提供微型触控板版本，可置于桌面并通过线缆和\
  \ USB 接口连接到系统。其他指纹扫描仪则内置在钥匙扣中，只需直接插入 USB 端口即可。甚至有些制造商将这些设备直接内置在鼠标顶部。\n\n安装并配置好指纹扫描仪软件后，密码管理器会在后续登录尝试时提示您扫描指纹，而非输入密码。某些型号实际上将扫描的图像和账户访问信息存储在设备上。这使得识别文件能随用户携带，方便其在不同地点使用不同计算机工作。\n\
  \n## 虚拟化\n\n现代计算平台已发展到可以在单一硬件环境中模拟多个硬件平台（如服务器、端点、交换机以及大多数其他网络资源）的程度。这归功于 `virtualization\
  \ software`（虚拟化软件），它使配备多个微处理器或 `multicore processors`（多核处理器）的计算硬件能够支持多个设备的 `virtual\
  \ instances`（虚拟实例），每个实例都能像原始主机硬件一样运行。\n\n例如，单个服务器操作系统可用于托管多个在特定 IP 地址上运行的 Windows\
  \ 和 Linux 操作系统实例。这些虚拟实例也称为 `virtual machines`（`VMs`，虚拟机），可根据需要启用以应对需求和可扩展性，或提供极高的可移植性。\n\
  \n服务器和端点虚拟化涉及在管理程序内部连接不同类型的虚拟设备。`hypervisor`（管理程序/虚拟机监视器）是一种 `virtual operating\
  \ platform`（虚拟操作平台），用于托管其他客户操作系统的实例，如图 4.15 所示。正如图中所示，管理程序主要有两种变体：原生和托管型。原生管理程序作为一项服务内置于主机操作系统中，而托管管理程序是添加到底层主机操作系统之上的第三方产品。\n\
  \n还可以使用在管理程序中创建的 `white-box switches`（白盒交换机，通用虚拟路由和交换实例）在主机内创建虚拟化网络。每个 VM 都会被分配一个虚拟网络适配器，负责处理该\
  \ VM 的网络流量。这些虚拟适配器可以连接到创建的任意虚拟交换机，以在管理程序内形成网络连接（通过管理程序的虚拟交换组件进行 VM 间通信）。\n\n外部虚拟交换机用于将管理程序连接到底层操作系统及其一个或多个物理网络适配器。此交换机使连接到它的虚拟适配器能够与其他物理网络通信。虚拟环境中的路由器功能由\
  \ VM 执行，这些 VM 的操作系统已配置为执行该功能。\n\n![FIGURE 4.15 Hypervisors](img/c04f015.png)\n\n\
  **图 4.15** 管理程序\n\n在主机内创建虚拟网络提供了多项安全优势：\n\n*   **隔离**：除非主机配置为允许其外部物理网络与内部虚拟网络互联，否则虚拟网络默认与物理网络隔离。虚拟网络内的通信永远不会离开虚拟环境。\n\
  *   **分段**：除非主机另有配置，否则虚拟网络内的通信不会离开虚拟环境，因此无需在物理网络或防火墙上配置和维护网络分段。\n*   **防火墙**：在配置为虚拟网络首端的\
  \ VM 上安装基于主机的防火墙，可为虚拟网络与主机的物理网络连接之间提供保护。\n*   **最小权限使用配置**：最小权限是信息安全的一项原则，根据用户或群组为履行职责所需，限制其可访问的资源。\n\
  \n### VM 安全\n\n虚拟化平台、管理程序和 VM 都是软件产品。因此，它们都存在缺陷和漏洞。因此，针对这些产品的基本安全建议与操作系统和应用程序相关的建议相同：\n\
  \n*   对主机和用户实施良好的补丁/服务包/更新管理程序。\n*   移除已知漏洞或有漏洞历史的应用程序。\n*   测试并应用虚拟平台安全补丁。\n\n\
  除了这些基本的虚拟化安全预防措施外，还可以采取许多其他步骤来强化虚拟化计算环境：\n\n*   强化主机设备。实施文件和文件夹权限，控制用户和组，并配置日志记录和时间同步。\n\
  *   保护主机与网络用户之间的通信链路。大多数 VM 平台支持 SSH、SSL 和 IPSec 进行通信。\n*   保护连接在管理程序内的端点设备。大多数\
  \ VM 平台为其虚拟交换机提供 L2 交换控制。这允许以与传统外部网络环境相同的方式监控虚拟平台内的流量。\n*   在 VM 与底层主机之间建立安全机制（VM\
  \ 逃逸漏洞）。这涉及关闭执行正常操作不需要的任何服务。如果不需要某项特定服务，请将其关闭。\n\n### 容器配置完整性\n\n**Containers**（容器）是一种类似于虚拟机的应用程序虚拟化形式。然而，与\
  \ VM 不同，容器不依赖管理程序在物理硬件上运行。它们不需要打包的操作系统即可运行。相反，它们虚拟化主机操作系统，使容器应用程序及其库和依赖项成为容器的唯一组件。这种结构使它们比\
  \ VM 更快、更便携。它还使它们能够在任何环境中独立运行，包括台式机、笔记本电脑和云环境。\n\n容器的优势使其成为混合云和多云环境中的实用工具。其可移植性使它们能够跨公共云环境混合以及组织的数据中心运行。\n\
  \n\n\n虽然容器使云部署更易于实施，但也带来了一系列网络安全问题。大多数组织通常在其云环境中使用的容器数量庞大，且替换或更新频率高，这为大规模漏洞提供了机会。运行的容器越多，潜在攻击面就越大。此外，容器通常基于第三方代码构建，这也随之带来了第三方漏洞。\n\
  \n保护容器的第一步是仔细实施**身份与访问管理 (IAM)**，以控制分配给容器用户的角色和访问权限，以及授予或拒绝权限的条件。一如既往，在为容器分配权限时，遵循*最小权限原则*是个好主意。保护容器的下一步是在部署前对其运行漏洞扫描。您还应为环境中使用的所有镜像创建并使用受信任来源列表。有可用于此目的的开源工具，如\
  \ Notary。请参阅 `www.docker.com/blog/notary-v2-project-update`。最后，强化整个环境，包括主机和所有守护进程。\n\
  \n## 应用软件安全\n\n软件*应用包*作为操作系统的扩展而运行。根据所使用的操作系统类型，应用程序可能直接控制某些系统资源（如打印机和网络接口），而操作系统在后台提供基础支持。在更高级的系统中，操作系统为系统中的所有应用程序提供通用的输入、输出和磁盘管理功能。\n\
  \n某些应用程序包含内置安全工具，可在操作系统提供的级别之外控制对应用程序的访问。然而，许多应用程序在编写时很少考虑安全问题。此类程序的重点是功能性和共享，将安全问题留给操作系统和安全工具。\n\
  \n### 软件漏洞利用\n\n*软件漏洞利用*一词用于描述旨在利用软件产品、操作系统和应用程序中的漏洞或弱点的网络攻击。这些漏洞可能是由于在创建软件时很少或根本不考虑安全问题，也可能是由于软件在发布使用前测试不充分所导致。\n\
  \n计算机软件行业存在两个截然冲突的目标：\n\n*   使产品尽可能开放且易于使用，以便非技术用户也能使用。\n*   使应用程序坚不可摧，永远不会发生任何坏事。软件程序员被要求在同一产品中同时满足这两个目标。\n\
  \n在某些情况下，程序员可能试图创建一个真正开放的产品，而不考虑它可能如何被恶意人员利用。在其他情况下，他们可能缺乏足够的经验来预见其产品可能被如何利用。随着全球程序员队伍的不断壮大，有许多个人拥有测试、操纵和修改编程的大量知识库。这包括*黑帽黑客*。\n\
  \n现代操作系统和应用程序编程非常复杂。程序员在最初开发产品时，可能会犯编码错误，或创建出与开发团队中其他程序员创建的元素无法良好协作的产品部分。他们还可能从开源软件仓库（如\
  \ GitHub）下载有缺陷的代码片段和库。攻击者通常会利用软件漏洞插入并隐藏恶意代码，以破坏服务或操作。\n\n特别是，攻击者可能会修改现有代码，在计算机内存中创建一种称为*缓冲区溢出*的条件，导致行为异常、内存访问错误和/或系统崩溃。系统实际上被禁用，用户无法使用。这种攻击被称为*拒绝服务*或\
  \ *DoS 攻击*。\n\n### 信息泄露\n\nOWASP 十大网络安全漏洞之一被指定为**信息泄露**。信息泄露是指敏感数据暴露的状况。导致数据暴露的最常见原因见于\
  \ HTML 或脚本注释、错误消息、或部署前未清理的源代码，以及配置错误的服务器或应用程序。这些攻击向量为攻击者提供了进入系统或从中提取数据的访问权限。\n\n\
  软件开发团队是恶意攻击者的主要目标。随着软件开发越来越多地在广泛分布的全职、外包/承包团队中进行，软件包中潜在攻击面的数量显著增加。\n\n基于云的计算和存储操作是信息泄露的另一来源。配置错误的云存储桶（云环境中的数据存储区域）为攻击者提供了访问敏感云数据的途径。Azure、GCP\
  \ 和 Amazon S3 等网站上配置不当的云权限可能会使大量数据暴露在互联网上。\n\n此外，GitHub 等网站通常存放配置不当、泄露或共享的代码，这些代码可能为恶意行为者提供本不打算公开的源代码、API\
  \ 密钥和数据。\n\n为防止信息泄露，组织应采取以下活动：\n\n*   为所有软件开发团队标准化编码实践。\n*   集中加密密钥和机密存储实践。\n* \
  \  在账户访问中采用最小权限原则——特别是与基于云的计算或存储相关的账户。\n*   加密存储的数据（静态数据）。\n*   采用外部泄露监控系统，检查暴露的\
  \ GitHub 仓库、配置错误的权限和暴露的云存储桶等攻击面。\n\n### 应用软件更新和补丁\n\n从上一节可以看出，由于产品开发的性质以及软件生产商推向市场的压力，新软件版本似乎永远不完整或不完美。随着软件产品的安全问题被揭露，其生产商被迫为其产品发布*安全补丁*以修复弱点。\n\
  \n安全补丁是为纠正观察到的弱点以防止漏洞被利用而专门发布的更新。微软每月为其产品发布一次安全补丁，并在该月的第二个星期二发布。其他软件开发商使用专门的安全团队，在发现漏洞后尽快开发和发布安全补丁。\n\
  \n出于安全和稳定性原因，您应始终为连接到互联网的计算设备修补操作系统。在大多数组织中，风险管理团队下设一个称为*补丁审查团队*的子团队，负责做出关于应用于 OT\
  \ 设备补丁的决策。该团队在 第 10 章 “ICS 安全监控和事件响应” 的 “控制补丁分发和安装” 一节中有更详细的讨论。\n\n\n\n理想情况下，组织应实施程序，以固定间隔安排软件升级和补丁管理程序。此外，这些程序应规定及时应用安全补丁，并定期实施软件供应商的建议。这些步骤可以大幅限制敌对方针对新发现漏洞（这些漏洞会被立即广泛公开）进行攻击的机会。\n\
  \n然而，在 OT 环境中，软件修改可能受 ICS 供应商的合同控制。其操作系统和应用软件的变更必须遵守其时间表，这涉及广泛的性能测试，以保证满足实时性能要求。在许多\
  \ OT 环境中，控制器通常受处理器性能限制，运行任何未经验证的软件组件（如操作系统补丁或安全软件）都会产生不可接受的高响应延迟，从而威胁过程控制稳定性。因此，其系统无法及时打补丁。这通常导致软件版本过时，且几乎没有恶意软件防护。\n\
  \n## 数据库加固\n\n大多数企业组织最有价值的资产是其信息（数据）。这可能包括从员工信息到客户财务或健康信息等不同类型的数据。因此，信息的分类范围可以从机密、内部到公开。这通常涉及包含机密客户数据的`数据库`以及高度安全的设备、结构、策略和政策。\n\
  \n通常，`数据库`代表大多数组织最有价值的资产，当然也是攻击者极具吸引力的目标。回顾第 3 章“安全 ICS 架构”，这些设备中的资源访问必须经过授权和认证。还应在这些设备上采用数据存储加密。还记得应用级加密是首选，但在应用级加密选项不可用时，应采用文件系统加密。\n\
  \n`数据库`通常位于组织网络内的服务器上。在 OT 网络的情况下，最著名的`数据库`是存储在数据历史服务器上的那些。与企业网络相关的服务器一样，关于`数据库`安全最重要的问题是`数据库`应位于网络中的何处。\n\
  \n正如您在前几章中所学，保护数据历史服务器最常用的方法是将其置于安全的网络结构中，例如 IT 网络和 OT 网络之间的 DMZ，如图 4.16 所示。本章后面详细描述的通用服务器加固工具和技术也应应用于数据历史服务器。\n\
  \n![图 4.16 数据历史服务器安全](img/c04f016.png)\n\n**图 4.16** 数据历史服务器安全\n\n### SQL 注入\n\n\
  也许最常见且最可预防的软件漏洞利用称为 `SQL 注入`。如图 4.17 所示，黑客可能会尝试将 SQL 命令注入面向公众的表单（如登录表单），希望从而获得对底层`数据库`中存储数据的访问权限。\n\
  \n现代 Web 的强大功能很大程度上与在线`数据库`的使用有关，许多 Web 设计师使用 SQL（或类 SQL）`数据库`引擎来驱动它们。网站通常是功能强大的\
  \ Web 应用程序，可能存储大量信息。使用 SQL，您可以轻松地将查询和命令链接在一起，通常只需添加一个分号（`;`）然后加上一个 SQL 命令即可。\n\n\
  想象一个可能根据邮政编码查找资源的 Web 表单。它将使用如下单个查询：\n\n```\nSELECT * FROM Locations WHERE Zip='$zipcode';\
  \ \n```\n\n其中 `$zipcode` 实际上来自用户提供的输入字段。如果黑客输入 `99336; DROP TABLE Locations` 而不仅仅是\
  \ `99336`，则`数据库`可能会链接这些命令并完全删除（drop）`Locations` 表。\n\n![图 4.17 SQL 注入](img/c04f017.png)\n\
  \n**图 4.17** SQL 注入\n\n黑客判断应用程序是否容易受到 `SQL 注入` 的常见方法是在登录表单上寻找单引号漏洞。认证查询可能如下所示：\n\
  \n```\nSELECT ID FROM Users WHERE Username = '$username' \nAND Password = '$password';\
  \ \n```\n\n如果黑客知道或能猜到您有一个名为 `Steve` 的用户，他可以尝试输入以下密码的简单技巧：\n\n```\nsomething' OR\
  \ 'a'='a \n```\n\n请注意，没有开始或结束的单引号，因为应用程序查询将提供它们。现在可能执行的查询如下所示：\n\n```\nSELECT ID\
  \ FROM Users WHERE Username = 'Steve' \nAND Password = 'something OR 'a'='a';\n\
  ```\n\n即使密码不是 `\"something\"`，`'a'` 将永远等于 `'a'`，并且通过使用逻辑 OR，只需其中一个比较匹配即为真。黑客甚至可能不需要通过在用户名字段尝试相同技巧来猜测用户名。\n\
  \n```\nSELECT ID FROM Users where Username = 'Steve' OR 'x'='x' \nAND Password =\
  \ 'something OR 'a'='a';\n```\n\n在这里，黑客猜测了用户名和密码，但这些都不重要，因为 `'x'='x'` 和 `'a'='a'`\
  \ 永远为真。此外，OR 子句确保每个都匹配，黑客将获得访问权限。您可能已经想到我们只需不允许输入单引号。对于用户名和密码字段，该选项可能行得通。但是，如果您请求数字数据，如下所示：\n\
  \n```\nSELECT ID FROM Users where UserID=$inputValue;\n```\n\n数字字段不需要引用，通过简单输入以下信息，查询应该会匹配，因为\
  \ 5 确实等于 5，即使`数据库`中没有等于 8686 的 UserID。\n\n```\n8686 OR 5=5\n```\n\n好消息是，这种情况很容易预防。Web\
  \ 应用程序程序员只需在将每个输入字段包含在查询之前对其进行过滤或清理。这可以通过多种方式完成，但请考虑以下方法：\n\n*   仅允许从白名单输入字符。显然，单引号不在该白名单上。\n\
  *   转义输入字段数据。\n*   解析输入字段数据并禁止 `OR` 和 `||`（当然还有 `DROP`）。\n*   始终给数字输入字段加引号。\n\n\
  这些方法会产生一定影响，对于许多表单可能已经足够。然而，似乎总有一些注入字符串可以绕过输入验证。转义有问题，并且可能会导致某些字段出现问题（考虑姓名字段，用户可能会输入撇号作为其名字的一部分）。如果黑客输入反斜杠（`\\\
  \\`）字符来转义其输入，或使用 Unicode 或其他编码，他们可能最终会破坏您的清理程序。\n\n防止 `SQL 注入` 的最佳方法是使用 `SQL 参数`。现代\
  \ SQL 系统支持参数化查询，其中参数严格作为数据进行求值，不允许任何命令执行。示例如下：\n\n```\nSELECT ID From Users where\
  \ Username='@user' AND Password='@pass';\n```\n\n在代码的某处，服务器将拥有处理这些参数的存储过程，并强制执行严格的数据类型和验证，以确保仅执行作者的代码。程序员在编写查询时仍需小心，并理解表和列不能作为参数。然而，在使用\
  \ SQL 系统时，这被认为是最佳实践。\n\n## 反恶意软件\n\n\n\n## 连接性增强与恶意软件威胁\n\n通过网络和互联网的连接性增强，使得个人电脑容易受到各种类型的\
  \ `malware`（恶意软件）和 `grayware`（灰色软件）的攻击。`Malware` 是指描述那些被设计为具有恶意性质的程序的术语。术语 `grayware`\
  \ 描述的是具有未披露行为或不良行为的程序。\n\n通常会安装多种不同的防御产品，以保护端点及其数据免受未经授权的访问和恶意干扰。最广泛用于这些目的的产品包括：\n\
  \n*   杀毒程序\n*   反间谍软件程序\n\n### 杀毒软件\n\n在大多数情况下，每台计算设备都应具备某种防范计算机病毒的手段。最常见的病毒防护手段是安装病毒扫描（`antivirus`）程序，在磁盘和文件被计算机使用前对其进行检查。多家公司提供第三方病毒防护软件，可配置为以各种方式运行。\n\
  \n如果计算机是非联网的独立设备，让杀毒软件在每次系统启动时运行可能是无益的。让程序检查连接到系统的任何可移动介质会更加切合实际，因为这是计算机唯一可能的非网络入口。\n\
  \n所有连接互联网的计算机，在连接互联网之前都应受到杀毒解决方案的保护。在这些情况下，将软件设置为每次启动时运行更为理想。此外，大多数杀毒软件都包含实用程序，用于检查通过网络或互联网连接下载到计算机的电子邮件和文件。\n\
  \n安装杀毒应用程序后，可将其配置为提供不同级别的病毒防护。您需要配置希望病毒软件在何时以及在何种情况下运行。\n\n对于 OT 控制设备，不存在杀毒补救措施。由于这些设备具有实时操作要求，运行这些应用程序的开销使其无法被使用。病毒防护必须通过其他选项提供。\n\
  \n### 反间谍软件\n\n基本上有两类 `antispyware`（反间谍软件）产品可用——一种是在间谍软件安装后查找并将其移除，另一种是在间谍软件试图自行安装时将其拦截。当这两种方法与关于如何避免间谍软件的用户知识相结合时，都更有机会使计算机免受间谍软件侵害。\n\
  \n`detect-and-remove method`（检测并移除法）是编写起来简单得多的反间谍软件产品类型。因此，有多款商业可用产品采用此方法。与杀毒软件包类似，此类反间谍软件产品依赖现有定义的数据库来识别间谍软件威胁。这些数据库必须频繁更新，以识别已发现的新版本间谍软件。\n\
  \n实时预防型反间谍软件产品不依赖历史数据来识别间谍软件。相反，它们监控特定的配置参数，并在发生可疑安装活动时通知用户。用户随后可以选择允许或阻止安装尝试。一些反间谍软件产品结合了这两种处理间谍软件的方法。\n\
  \n除了安装反间谍软件应用程序外，用户还可以通过多种其他方式对抗间谍软件：\n\n*   安装安全的 Web 浏览器。\n*   使用最新的安全补丁保持浏览器最新，或下载提供最佳安全功能的最新浏览器版本。\n\
  *   与使用防火墙和代理来阻止已知分发间谍软件的网站的 ISP 合作。\n*   仅从信誉良好的网站下载软件，以防止随其他程序附带的间谍软件。\n\n####\
  \ 反恶意软件实施\n\n在几乎所有环境中，组织策略都会要求所有服务器安装实时扫描杀毒应用程序，以及实时反间谍软件程序。特别是，如果服务器是文件服务器，或拥有具有远程访问能力的非管理用户，则需要这些应用程序。\n\
  \n如前所述，任何运行 HTTP/FTP 协议且具有互联网访问权限的计算设备都应安装反恶意软件应用程序。然而，对此要求有两个显著的例外：SQL 服务器和专用邮件服务器。\n\
  \n对于网络上的其他端点，所有此类机器都应安装组织标准的杀毒和反间谍软件程序，并按计划定期运行。所有用户控制的计算设备上，杀毒和恶意软件扫描应至少每周运行一次。除网络或域管理员外，任何人不得被允许停止恶意软件定义更新或扫描。\n\
  \n然而，大多数 OT 网络由多个 `soft targets`（软目标）组成，这些是传感器和控制设备，因极少或没有内置安全功能且极少有添加安全功能的选项而易受干扰。这些组件通常几乎没有内置安全能力，许多可能不具备足够的资源（内存和处理能力）来支持额外功能，例如第三方安全插件。如果它们被直接或虚拟访问，很容易被操纵。\n\
  \n这使得杀毒软件和其他反恶意软件程序不适合用于 OT 计算和控制设备。这些类型的扫描应用程序在运行时是性能占用大户。如前所述，由于 OT 控制器的实时计算要求，这些类型的安全应用程序的存在可能会引入不可接受且可能对设备和人员造成危险的通信和计算延迟。\n\
  \n与其将杀毒软件和其他反恶意软件产品应用于 OT 网络，不如在到达网络 OT 侧的这些设备之前，采用纵深防御策略（防火墙和 DMZ）。\n\n#### 更新反恶意软件\n\
  \n反恶意软件应用程序及其定义文件必须保持最新，以应对每日涌现的大量新恶意软件。一些组织要求杀毒定义至少每天更新一次。与服务器和应用软件产品不同，杀毒软件和其他反恶意软件产品更新安装前不应需要沙箱测试。\n\
  \n## 监控\n\n组织的全局反恶意软件防护系统必须由网络管理员持续 `monitored`（监控），以检测可能表明可疑或恶意活动的事件。发生重大事件时，系统应配置为记录事件并通知管理员（或管理员们）。\n\
  \n事件被报告时，管理员应查阅杀毒或反恶意软件应用程序的日志文件，了解事件的性质和参数。然而，管理员应定期例行审查这些日志文件，以发现即将发生问题的迹象。除了这些日志包含的标准操作数据外，管理员还可以利用日志执行以下操作：\n\
  \n*   识别遇到异常高数量病毒的端点（和用户）。这可能表明该端点的用户是高风险操作者，可能需要额外培训。\n*   将网络端点与特定用户关联。\n*   识别与拥有高风险黑客工具的用户相关的内部威胁。虽然此类软件在某些环境下可能有合法用途，但识别此类用户的能力使识别潜在内部威胁变得更容易。\n\
  *   识别与拥有文件和文件夹名称被识别为不同类型隐藏监控工具（如键盘记录器）的软件的用户相关的内部威胁。\n*   跟踪未能获取更新的端点。\n\n\n\n\n\
  \n## 跟踪端点及其操作系统和引擎版本\n\n在 IT 网络中实施*端点检测和响应*（EDR）应用程序变得越来越普遍。EDR 会在网络的所有端点上部署端点数据收集代理，以对其进行监控并收集其运行数据。这些数据被汇总到一个集中的*安全运营中心*（SOC），在那里进行实时分析。\n\
  \n分析通常会检查每个端点上发生的活动量、与其的连接以及通过它传输的数据。这使得 EDR 能够*诊断*威胁，并根据威胁的性质及其配置参数自动触发响应。\n\n\
  当检测到威胁时，EDR 会采取行动*遏制*攻击。一旦采取了遏制行动并将威胁*沙箱隔离*后，EDR 随后会调查威胁的性质并采取行动*将其消除*。\n\n## 反恶意软件：净化\n\
  \n大多数恶意软件以嵌入在标准文件格式（如 DOC、XLS、PDF、PPT 等）中的活动内容形式分发。攻击者只需将恶意代码（宏、脚本、Web 链接或二进制对象）隐藏在内容中，并通过电子邮件、Web\
  \ 链接或可移动媒体将其传递给目标。恶意软件载荷通常设计为躲避防病毒和其他反恶意软件扫描。\n\n您可能还记得，著名的*震网攻击*^(\\*)使用了这些相同的要素，严重破坏了伊朗推进其核能力的努力。最近，一个被称为*“蜻蜓行动”*的类似行动针对\
  \ OT 网络发起。在此次攻击中，组织的网站被攻陷，来自受信任供应商的文件被感染。当管理员最终用户将这些文件作为受信任的软件执行时，该漏洞利用绕过了所有防火墙、白名单和防病毒安全控制。\n\
  \n反恶意软件厂商开发了新的文件*净化工具*，用于搜索附加在电子邮件中或通过 Web 链接、拇指驱动器和其他可移动媒体引入的文件中的此类对象。当在本不应包含这些对象的文件中发现它们时，工具会*净化*（剥离）文件整体内容中的可利用对象，并将文件的干净版本交付给用户。\n\
  \n净化与传统反恶意软件产品使用的检测/隔离/删除方法不同，后者通过将文件与病毒/恶意软件定义数据库进行比较，以确定标记或放行哪些文件给用户。在大多数情况下，净化与传统反恶意软件工作相结合，以交付真正受信任的净化文件，如图\
  \ 4.18 所示。\n\n在这个三部分的过程中，文件首先通过传统的防病毒/反恶意软件解决方案进行处理，以消除那些明显受感染的文件。通过第一次检查的文件被引入文件净化器，其中会应用专门为指定文件类型设计的算法，以定位隐藏在文件结构中的任何恶意对象。如果检测到恶意代码，它会被从文件中剥离，而不会破坏其内容的完整性。最后，净化后的文件被交付给最终用户。\n\
  \n为了在不影响可用性的情况下保护 OT 网络，净化器通常以与传统 DMZ 相同的方式部署在企业网络和 OT 网络之间，如图 4.19 所述。净化功能可以由 DMZ\
  \ 中工作的服务器提供，或以 DMZ 内（或代替 DMZ）的网络设备形式提供。\n\n![图 4.18 文件净化](img/c04f018.png)\n\n**图\
  \ 4.18** 文件净化\n\n![图 4.19 净化器部署](img/c04f019.png)\n\n**图 4.19** 净化器部署\n\n## 嵌入式设备安全\n\
  \n*嵌入式设备*被定义为在更大系统中提供指定功能的计算设备。在 ICS 环境中，这包括控制器、PLC、RTU 和 IED 等设备，您在前面的章节中已了解过这些设备。然而，根据所讨论的\
  \ OT 网络的确切类型，可能还有其他类型的嵌入式设备需要考虑，例如分析仪、仪表和聚合器（汇聚器）。\n\n工业网络中的计算和控制设备需要与其 IT 对应设备相同类型的本地安全。对工业控制设备（或\
  \ ICS 控制室）的物理访问可为攻击者提供破坏或损坏流程、系统或设备的手段。获得对控制室的物理访问也使攻击者处于更有利的位置，以获取对系统或其设备的逻辑控制。如果达到这种渗透级别，攻击者就有机会控制物理过程。如果他们获得对服务器或\
  \ ICS 主系统的访问权限，他们可能会控制整个 OT 系统。\n\nOT 系统相对于企业网络的一个优势是，其计算和控制设备通常运行在专有操作系统和网络基础设施上，熟悉这些系统的人较少。因此，拥有这些软件和网络类型足够知识的潜在攻击者比企业环境中要少。这被称为*通过隐匿实现安全*。\n\
  \n然而，这也创造了一个环境，即负责这些系统的个人必须具备组件和软件的高级知识，以保持系统正确运行。虽然企业和公开分发的操作系统和应用程序具有相对简单的安装、设置和维护，但\
  \ OT 版本的管理可能要复杂得多。ICS 软件变更必须谨慎进行。\n\n虽然 ICS 行业已经生产了具有原生安全工具的设备以及可添加到现有 OT 网络的安全设备超过\
  \ 10 年，但仍有许多 OT 网络和设备在几乎没有或完全没有安全能力的情况下运行。在许多情况下，ICS 系统包含专门为执行特定任务而设计的组件，或者是在网络安全成为工业控制环境中的一个问题之前开发的组件。\n\
  \n由于 PLC 和 RTU 拥有的自我保护资源极少，因此通过加固其周围的边界来为这些设备提供保护变得非常重要。与企业网络设备一样，该边界的主要重点是通过执行以下操作来防止对\
  \ OT 资产的逻辑访问：\n\n*   将 IT 和 OT 计算设备物理固定在基础设施上（扩展坞、锁定线缆、链条、可上锁的机柜）。\n*   要求强访问控制（复杂密码）。\n\
  *   采用强身份验证方法（智能卡、生物识别扫描仪等）。\n*   在组织的 ICS 部分的所有计算和控制设备上禁用或卸载可移动媒体驱动器和端口（CD/DVD\
  \ 驱动器、USB/FireWire 端口、SD 卡插槽）。ICS 安全策略应禁止在 OT 中（或连接到 OT 的）任何计算/控制设备上使用任何未经授权的可移动媒体，以防止引入恶意软件或无意中丢失或窃取数据。\n\
  *   控制打印输出（处置和销毁策略、碎纸、焚烧）。\n*   控制对备份数据和介质的访问（使用异地存储、上锁的机柜、防火保险柜）。如果攻击者能够访问 ICS\
  \ 备份介质，他们可能会利用其内容。这些利用范围从从认证文件中提取密码到恢复可用于发起不同类型网络攻击的数据。\n*   禁用电源按钮或防止其被未经授权的访问/使用。\n\
  \n\n\n\n\n## 禁用传统企业 IT 软件架构中常用的网络学习和发现工具。\n\n## 电表\n\n任何 `utility meter`（公用事业电表）的主要功能是测量客户对电力、水、燃气等的使用量。除了测量电力外，电力\
  \ `smart meter`（智能电表）还需要识别并与 HAN 组件通信、存储客户和用量数据、显示消费模式，并与公用事业的 WAN 通信。图 4.20 显示了典型智能电表的功能框图。\n\
  \n![FIGURE 4.20 Anatomy of a smart meter](img/c04f020.png)\n\n**图 4.20** 智能电表剖析\n\
  \n使智能电表变得 `smart`（智能）的是嵌入式 `microcontroller`（微控制器）或 `mC`（一种专用微处理器）的存在。该设备按固定时间间隔采集流经电表“主接点”（触点）的电流量数据，根据其编程分析数据，并将数据和结果存储在\
  \ `Flash random access memory (RAM)`（闪存随机存取存储器）区域中。它还处理从公用事业接收的指令，并将来自 `home area\
  \ network (HAN)`（家庭区域网络）的数据转发给公用事业。\n\n电流测量由电流传感器执行，这些传感器检测流经电表的每根导体中的电流水平。传感器将该模拟信息馈送至\
  \ `analog-to-digital converter (ADC)`（模数转换器）电路，该电路生成微控制器可理解的每次测量的数字表示。图 4.21 说明了典型\
  \ A/D 转换器的操作。16 位和 24 位 A/D 转换器版本常用于数字电力仪表（位数越高——也称为 `resolution`（分辨率）——产生的数字表示越精确）。\n\
  \n![FIGURE 4.21 Typical A/D converter operation](img/c04f021.png)\n\n**图 4.21**\
  \ 典型 A/D 转换器操作\n\n微控制器通常还与客户显示设备（如 `liquid crystal display (LCD)`（液晶显示器））连接，可显示客户用量数据或消息。\n\
  \n智能电表的另一个关键组件是其 `Input/Output (I/O) controller`（输入/输出控制器）。该单元负责为其他系统组件与外部世界之间提供物理连接兼容性。具体而言，它将在系统不同数字设备之间移动的并行数据转换为更适合长距离传输的串行比特流。它还接收来自外部的串行数据，并将其转换为与数字设备（如微控制器和\
  \ RAM 模块）兼容的并行数据。\n\nI/O 控制器还为数据进出电表的移动提供硬件协议控制。如图所示，该 I/O 控制器提供了一个支持标准 USB 端口以及\
  \ `Power Line Carrier (PLC)`（电力线载波）连接设备的串行通信端口。\n\n在无线通信的情况下，数据通过发射器/接收器单元在外部世界与\
  \ I/O 控制器之间移动。根据特定电表的设计，发射器/接收器可设计为适用不同的通信解决方案，包括 RF 无线、电力线载波和 `General Packet Radio\
  \ System (GPRS)`（通用分组无线业务）数据通信。\n\n微控制器及其所有智能支持设备运行都需要电力。这些模块从电力主线获取电源，意味着电表会使用来自电网的一部分电力。对于单个电表而言，这种功耗几乎可以忽略不计。然而，当大量建筑物接入电网时，仅为了拥有智能系统就会消耗大量能源。\n\
  \n### 汇聚器\n\n典型的公用事业电网汇聚数千个客户。面对如此庞大的装机量，让每个客户的智能电表直接与公用事业总部的服务器通信在经济和技术上都是不切实际的。取而代之的是使用称为\
  \ `data concentrators`（数据汇聚器）的设备将多个智能电表分组，并聚合其数据传输以传送给中心局的公用事业服务器。每个数据汇聚器创建一个称为\
  \ `neighborhood area network`（邻域网络）或 `NAN` 的结构，如图 4.22 所示。\n\n![FIGURE 4.22 A NAN](img/c04f022.png)\n\
  \n**图 4.22** 一个 NAN\n\n如前所述，`customer data acquisition`（客户数据采集）网络中的通信通常使用无线技术执行——NAN\
  \ 侧使用 Zigbee 或其他低功耗 IEEE 802.15 无线微微网协议，从汇聚器到公用事业服务器则使用 WiMAX、GSM、GPRS 或电信网络。\n\n\
  ### 安全问题\n\n在 OT 网络环境中保护嵌入式设备有许多方法。然而，保护这些系统的一般流程如下：\n\n1.  物理保护每个位置的本地传感器和执行器及其到网络的连接。\n\
  2.  保护每个位置的现场总线和局域控制网络介质。\n3.  保护每个位置的 PLC、RTU 和 IED。在许多情况下，这些设备位于由围栏和锁门保护的无人值守现场站中。\n\
  4.  保护所有现场站点与控制中心之间的长距离通信链路。历史上，SCADA 协议往往不具备大量内置安全功能，因为它们主要是为最大化性能、可靠性、鲁棒性和功能性而设计的。\n\
  5.  保护控制中心的 SCADA 控制器、服务器和历史服务器。虽然这些设备通常部署在安全设施中，但应由高效的补丁管理（加固）策略进行管控。\n6.  如前所述，保护组织\
  \ OT 网络与 IT 网络之间的任何互联。如果这两个网络必须连接，将连接点的数量限制为单一通道。使用防火墙、路由器和 DMZ 来控制两个网络之间的流量流动。\n\
  \n对于公用事业而言，最令人担忧的安全风险之一是位于公用事业与客户分界点处的 `smart meter`（智能电表）。在大型配电网络中，可能有成千上万个此类设备安装在广阔的地理区域内。每个设备都代表了公用事业消费者数据采集网络的一个潜在接入点。每个电表通常也安装在公众可接触到的开放位置。\n\
  \n由于这些网络代表的目标价值足够高，极具吸引力，攻击者可以通过在智能电表附近非法放置兼容的接收设备，捕获其信号，然后解密其内容，从而利用其射频 AMI 传输。\n\
  \n一旦攻击者获得电表通信信道的访问权限，他们可能会利用完整的客户数据采集网络。通过访问该网络，攻击者只需向网络发送一个小脚本，就可能禁用本地公用事业客户的服务。他们还可能利用此信道恶意地以正面或负面方式修改客户数据。\n\
  \n在控制中心或企业办公室设施中，物理安全通常呈现出更多 IT 安全的性质。这些环境中的主要关注点涉及限制对 OT 环境中任何信息资产的物理访问。\n\n* \
  \  未经授权物理访问敏感位置\n*   未经授权物理访问服务器、SCADA 主设备和历史服务器及其上的数据\n*   未经授权物理访问用户计算机、网络设备和数据\n\
  \n\n\n\n与 IT 网络环境类似，ICS 主站、服务器和历史服务器应位于安全区域，用于这些位置身份验证的设备和机制也应受到保护。同样，OT 网络上的任何企业网络连接设备（端点、网络交换机、网关、路由器和介质）应位于安全区域，最好放在只有授权人员才能访问的区域。\n\
  \n正如您所见，SCADA 系统可以部署在工业处理设施的本地控制网络中，也可以跨越大型地理区域部署在分布式过程中（如电网）。这些系统容易受到攻击，攻击方式包括中断其网络通信或伪造其现场设备产生的数据。\n\
  \n如果通信网络中断，控制器将无法确定过程状态，也无法向现场控制器提供正确的控制信息。这可能会产生严重后果，导致过程失控。\n\n同样，如果传感器和现场控制器产生的数据被伪造，控制器将无法采取控制过程所需的纠正措施。过程控制器可能会采取错误或有害的行动。此外，即使是人工操作员，如果无法确定过程的实际状况，也可能无法采取适当的纠正措施。\n\
  \n### 默认配置管理\n\n嵌入式设备的另一个主要隐患是安装后保留设备的默认配置设置。配置不当的设备或系统会为攻击者提供容易得手的目标，形式为轻松获取提升的权限或已知的默认设置。\n\
  \n事实上，默认设置代表最常见的配置漏洞类型。这些漏洞包括：\n\n*   允许默认账户和密码（如默认路由器密码）保持激活状态。\n*   使用默认配置设置（如启用\
  \ TFTP）。\n*   允许使用不充分的软件或硬件配置设置（如启用“用户可修改设置”选项）。\n*   使用为易用性而非安全性设计的配置选项（如启用 AutoRun\
  \ 功能）。\n*   错误配置权限设置，而非使用最小权限或需知原则设置。\n\n为消除这些漏洞，应创建并实施*配置设置管理*（`CSM`）策略及其相关流程，以识别不良和不安全的配置设置。这包括为新增网络设备的配置设置开发质量保证检查流程，以及制定防止未授权用户更改配置的策略。\n\
  \n在美国，*网络安全和基础设施安全局*（`CISA`）提供 `CSM` 工具，作为其*持续诊断与缓解*（`CDM`）计划的一部分。该计划为安全从业者提供网络安全工具、集成服务和仪表板，帮助他们改善网络安全态势。\n\
  \n## 网络加固\n\n*网络加固*是一项主动的、持续的网络管理过程，包括面向网络计算和控制设备的操作系统和应用程序加固。此部分加固过程涉及收紧并正确配置网络服务、协议和访问控制列表。\n\
  \n然而，除了加固网络中的软件外，还必须详细记录并评估其当前配置，以便制定可行的计划进一步提高网络安全性。这包括评估网络的通信介质和连接设备（交换机、路由器、硬件防火墙）。此加固领域涉及的典型步骤包括：\n\
  \n*   根据组织的安全策略保护系统服务器。如果可能，将其放置在受监控的、集中的服务器机房内，并配备双锁门。\n*   检查是否存在规格不符合当前安全目标的网络设备，因此构成网络的易攻击访问点。\n\
  *   验证网络配置能否执行其通信功能，同时仍满足组织安全策略要求的安全级别。确保交换机、防火墙和路由器等设备不再处于默认配置设置。\n*   评估网络安全计划，确保关键设备（如生产服务器）安装在正确的网络段、安全区域或子网中。\n\
  *   在网络连接设备上建立并配置 `ACL`，以根据组织安全策略的要求限制或阻止对资产的访问。\n*   `SSH`/`HTTPS` 访问的身份验证方法。\n\
  *   所有设备的备份配置。\n*   使网络设备保持所有可用和当前补丁的最新状态。\n\n### OT/IT 网络安全\n\n如前所述，IT 功能已成为 OT\
  \ 网络不可或缺的一部分，提供关键接口和交互。当然，这也使得原本依靠默默无闻而保持安全的 OT 网络暴露于与 IT 网络和互联网相关的漏洞中。然而，随着两者相互依赖程度加深，连接这两个网络的趋势持续升级。\n\
  \n不幸的是，大多数 OT 网络构建在大型扁平网络拓扑上，如第 3 章所述。回顾一下，扁平拓扑不实施分段，无法为功能和安全要求不同的网络区域创建安全区域。这使得网络攻击或干扰在初始渗透发生后能在网络中快速传播。\n\
  \n扁平拓扑还使 OT 网络易受网络拓扑图上未显示但对网络化的过程控制系统构成重大威胁的威胁。这些威胁包括但不限于：\n\n*   来自 IT 网络的访问\n\
  *   通过 IT 网络从互联网进行的访问\n*   具有极少或无内置安全功能的 `PLC`、`RTU` 和 `DCS` 设备\n*   因网络未分段导致的设备缺乏隔离\n\
  \n扁平网络的其他重大威胁涉及可能进入工厂并与 OT 网络通信的无线设备，以及将基于 `USB` 的设备引入连接 ICS 的主机的能力。在 OT 环境中，无线网络技术的使用也必须受到严格控制，因为它们使潜在攻击者无需获得物理访问权限，仅需接近无线设备或网络即可控制过程设备和网络结构。\n\
  \n另一方面，OT 网络中任何位置存在 `USB` 接口都为各类恶意软件进入系统敞开了大门。一旦进入 ICS，恶意软件可通过未分段或分段不善的 OT 网络迅速传播。\n\
  \n如果企业网络提供了通往互联网连接的路径，必然会引发关于利用该连接进行远程 ICS 管理和维护的讨论。从成本角度看，从单一来源远程提供这些服务，比在组织可能拥有的每个地点都配备技术高超且薪酬优厚的网络管理员和技术人员要划算得多。\n\
  \n\n\n\n## OT 网络远程访问安全\n\n正如纯 IT 网络一样，在 OT 网络中开放远程访问通道会为未经授权的访问、恶意软件或不当流量进入网络及其设备提供窗口。不同之处在于，OT\
  \ 网络通常拥有较少的安全工具来防止干扰或攻击，或限制其影响范围。\n\n因此，对于涉及 ICS 的任何类型的远程访问功能，强烈建议使用加密协议、强身份验证机制（基于令牌的、多因素认证方案）和\
  \ VPN。被授予 OT 网络远程访问权限的任何个人，都应被要求在企业网络层面和控制 OT 网络访问的网络防火墙层面进行双重身份验证。\n\n当所有这些威胁汇聚在一起时，ICS\
  \ 突然显得非常容易受到攻击，即使是最小的网络干扰也能迅速蔓延至整个 OT 网络，甚至波及远程位置的网段和设备。\n\n为了应对工业控制行业这一日益增长的趋势，NIST\
  \ SP 800-82 r2《工业控制系统 (ICS) 安全指南》在企业网络与 OT 网络融合时，针对网络整体设计提出了三项实际考量：\n\n*   **网络分段与隔离**：逻辑和物理网络分离\n\
  *   **边界防护**：安全分层、权限控制和白名单机制\n*   **防火墙的使用**：流量过滤\n\n## 服务器安全\n\n服务器需要特殊的安全考量和网络部署位置。正如前面的列表所示，组织网络中可能运行着多台不同的服务器，为用户提供各种服务。在大多数情况下，这涉及向多个用户提供至少一项关键服务。因此，组织的用户依赖这些服务器来开展工作。\n\
  \n正如本章前面提到的，网络中的某些服务器（如数据库服务器）可能肩负存储大量数据的任务。其中部分或全部数据可能是关键或机密信息，例如包含医疗、财务或人事记录在内的机密用户信息。它们也可能用于处理和存储专有的组织信息，如商业机密、专利、发明或生产信息。运行操作系统和应用程序的网络服务器必须通过补丁和更新持续维护，以保持其安全性。\n\
  \n基于这些原因，网络服务器代表了攻击者最感兴趣的目标之一。虽然攻击者的部分工作是绕过网络中的所有防护设备，但其行动的获利部分在于访问服务器上存储的数据。因此，服务器在网络安全架构中需要特殊的考量和部署位置。\n\
  \n*   对服务器共享资源的访问应仅限于既有需求又拥有适当授权的用户。应注意确保未经授权的员工无法访问机密资料。\n*   某些类型服务器的网络访问通常应由一个或多个防火墙保护，以限制通往服务器的流量。\n\
  *   使用子网或路由器为不同类型的服务器创建安全的网络段或区域。例如，特定部门（如会计部）可受保护于其自身的安全子网内，并使用其自身的部门服务器资源。\n*\
  \   由于服务器常用于用户身份验证，作为预防措施，服务器的密码应进行哈希处理。\n*   定期审核关键服务器资源，以在潜在问题升级为实际问题之前将其识别出来。\n\
  \n与独立主机安全一样，在确保系统物理访问安全后，服务器安全的下一层级是保护其操作系统和应用软件。这涉及安全地安装、配置和维护服务器操作系统及选定用于服务器的软件包。\n\
  \n最重要的服务器软件组件是操作系统。保护操作系统涉及五个基本步骤。\n\n1.  使用制造商的安装指南安装服务器操作系统。\n2.  对新安装的系统打补丁并更新。操作系统开发商无法知晓特定组织服务器的全部安全需求。此外，每天都会出现新的安全威胁，因此软件创建时与安装时之间存在安全缺口。在投入运行前对新安装应用补丁和更新，应能修复任何已知的当前漏洞。\n\
  3.  配置并加固新操作系统以实施组织的安全策略。配置和加固操作系统涉及的关键步骤包括：\n    *   移除或停止不必要的服务、应用程序和协议。\n   \
  \ *   配置管理员和用户身份验证系统。\n    *   按需配置资源控制。\n4.  安装并配置解决组织安全策略所需的任何额外第三方安全控制。此步骤包括安装和配置网络防护系统，包含：\n\
  \    *   安装和配置反恶意软件产品。\n    *   安装和配置 EDR 产品。\n    *   安装基于主机（服务器）的 IDPS 软件。\n \
  \   *   安装和配置基于主机（服务器）的防火墙。\n    *   安装或配置磁盘加密软件，以防止获得服务器物理访问权限的攻击者窃取存储数据。\n5. \
  \ 测试新安装的安全性，确保其解决了组织的所有安全问题。此步骤涉及使用漏洞扫描和渗透检测工具来测试服务器的安全能力。在服务器的整个生命周期内，此步骤应每年执行一次，以确保其安全能力保持可接受水平。\n\
  \n## 加固服务器操作系统\n\n在服务器上安装好操作系统和所需应用程序后，保护服务器的下一步是采取措施加固整个服务器软件环境的安全配置。加固涉及在仍为网络用户提供可接受的可用性水平的前提下，采取措施关闭尽可能多的已知漏洞。以下是加固服务器操作系统所涉及的步骤：\n\
  \n1.  绘制服务器将服务的网络拓扑图，并确定连接到它的设备。包含其网络上每个本地设备的详细记录，以及其操作系统版本、授权访问人员、预期运行时间和预期网络连接的列表。\n\
  2.  将操作系统提供的安全级别与组织需求进行比较。特别要查找不同服务器上运行的开放服务，以确定是否需要这些服务，例如文件和打印共享功能、无线网络服务、目录服务和电子邮件服务。如果网络上不需要或未使用这些服务，请将其关闭。\n\
  3.  确保网络的操作系统运行着最新的可用更新和反恶意软件支持。\n4.  禁用任何已安装服务器上的来宾账户（除非在特定服务器上启用该账户有正当理由）。\n5.\
  \  重命名默认管理员账户。\n6.  移除或禁用任何未使用的默认账户或用户账户，以及其现有的身份验证设置（用户名和密码）。\n7.  在为网络用户提供服务和访问权限时，采用最小权限原则。\n\
  \n\n\n\n\n### 8. 移除不必要的软件包\n\n从服务器中移除任何不必要的软件包或实用程序，包括远程访问程序、语言编译器和开发工具，以及任何系统和网络开发工具。\n\
  \n### 9. 移除或禁用不必要的网络协议\n\n移除或禁用运行所不需要的任何网络协议（打开的 TCP/UDP 网络端口）。\n\n这些步骤中的每一步都要求服务器管理员在安全需求与用户需求之间取得平衡。理想情况下，服务器应被严格锁定并仅服务于单一功能。然而，随着安全性的提高，功能性会降低。\n\
  \n## 逻辑服务器访问控制\n\n网络管理员还负责通过确定谁有权访问网络服务器、网络连接设备和数据的操作来实施企业策略。在大多数组织中，这是通过网络操作系统的管理工具来实现的，这些工具控制谁有权访问网络及其资源，以及他们可以对这些资源执行什么操作。\n\
  \n管理员可用的标准网络访问控制策略有三种：\n\n*   **强制访问控制 (MAC)**：系统确定哪些用户或组可以访问文件、文件夹和其他资源。\n*   **自主访问控制\
  \ (DAC)**：这些是用户有自由裁量权决定谁可以访问其对象以及访问程度的配置。\n*   **非自主、基于角色的访问控制 (RBAC)**：这基于每个用户在组织中的工作角色。\n\
  \nMAC 策略为网络对象（如文件和文件夹）分配敏感度标签，并根据用户的权限级别授予访问权，如图 4.23 所示。\n\n![FIGURE 4.23 Mandatory\
  \ access control](img/c04f023.png)\n\n**图 4.23** 强制访问控制\n\n如图 4.23 所示，每个用户的访问范围取决于其管理员授予的许可级别。拥有\
  \ `Top Secret`（绝密）许可级别的人员可以访问所有被分配了绝密标签的对象。此外，他们还被允许访问所有具有较低标签的对象，如 Secret（机密）和\
  \ Classified（秘密）对象。\n\n自主访问控制涉及赋予用户自由裁量权以确定哪些对象应受限或共享。每个对象都有一个所有者，负责确定谁可以访问该对象。这就是在对等网络环境中分配权限的方式。\n\
  \n因为每个对象都受权限级别约束，所有者可以选择使某些对象比其他对象更安全。此外，在 DAC 下，访问控制策略可以通过 `identity-based`（基于身份）或\
  \ `user-directed`（用户导向）的方式提供。\n\nRBAC 是一种旨在对所有网络对象和用户进行集中控制的策略。网络管理员被授予指定和实施明确安全策略的权力，以执行组织的指定策略。每个网络用户或组被分配一个或多个角色，如图\
  \ 4.24 所述。\n\n![FIGURE 4.24 Role-based access control](img/c04f024.png)\n\n**图 4.24**\
  \ 基于角色的访问控制\n\n每个角色被分配特定权限，例如对文档文件的 `read`（读取）或 `write`（写入），或对特定对象的 `execute`（执行）、`full\
  \ control`（完全控制）或 `no access`（无访问权限）。服务器负责维护一个 `access control list (ACL)`（访问控制列表）数据库，该数据库跟踪每个用户账户，包括他们可能被分配到的组账户，以及他们对不同对象拥有的权利和权限，如下所示：\n\
  \n### 示例文件 A\n\n*   个别所有者可以读取、写入和执行该文件。\n*   组成员可以读取和写入该文件。\n*   所有其他人只能读取该文件。\n\
  \n![](img/c04uf001.png)\n\n### 示例文件夹 B\n\n*   个别所有者可以读取和写入该文件夹。\n*   组成员只能读取文件夹内容。\n\
  *   所有其他人被拒绝访问该文件夹的任何权限。\n\n![](img/c04uf002.png)\n\n在每种策略类型中，当通过权利和权限分配为用户提供对对象的访问时，应实施\
  \ `principle of least privilege access`（最小权限原则）。根据最小权限规则，每个用户仅被授予执行其工作角色所需的访问级别。始终如一地应用此原则将安全漏洞造成的损害限制在初始任务、进程或用户范围内。\n\
  \n## 加固网络连接设备\n\n不同的 `network connectivity devices`（网络连接设备），如 `switches`（交换机）和 `routers`（路由器），依赖\
  \ MAC 地址作为构建和使用内部 `content addressable memory (CAM)`（内容可寻址存储器）`tables`（表）的基础。设备使用这些表根据预期接收者连接的硬件端口，将它们从一个网段接收到的消息路由到另一个网段上的位置。\n\
  \n许多连接设备通过 `MAC learning and discovery`（MAC 学习和发现）过程构建和维护其 CAM 表。当它们与连接到其物理端口的设备交互时，它们读取消息头以获取发送和接收设备的\
  \ MAC 地址，并将它们连同端口信息一起记录在 CAM 中。\n\n通常针对网络 MAC 层的攻击有两种常见类型：`MAC spoofing`（MAC 欺骗）和\
  \ `MAC broadcast flooding`（MAC 广播泛洪）。虽然 MAC 地址最初旨在作为网络适配器的永久（烧录）唯一标识符，但有可用的软件工具可以用来更改硬件和操作系统之间的这些地址。\n\
  \n虽然能够操纵 IP 到 MAC 地址的关系是 `virtualization`（虚拟化）（如创建基于云的环境）的一个重要方面，但这也为恶意操纵 MAC 地址敞开了大门，这种攻击被称为\
  \ `MAC spoofing`（MAC 欺骗）——更改设备的 MAC 地址以改变其身份，如图 4.25 所示。这些工具和攻击将在本章后面结合针对网络连接设备（如网络交换机）的攻击进行描述。\n\
  \n![FIGURE 4.25 MAC spoofing](img/c04f025.png)\n\n**图 4.25** MAC 欺骗\n\n交换机拥有监控端口，可收集关于其所有连接端口的信息，包括其\
  \ VLAN 端口。这使它们成为想要收集信息的攻击者的主要目标。他们只需识别其中一个连接的 VLAN 交换机即可获取所有其他端口连接的数据。\n\n当前的交换机型号接口通常使用带有\
  \ GUI 的 SSH 或 HTTPS 连接进行配置。对于集中管理，应使用 `Terminal Access Controller Access-Control\
  \ System (TACACS)`（终端访问控制器访问控制系统）、`Remote Access Dial-in User Service (RADIUS)`（远程拨号用户服务）或其他\
  \ `Authentication, Authorization and Accounting (AAA)`（认证、授权和审计）工具进行安全的远程访问控制。本地管理可以使用直接连接的控制台线缆来配置这些接口。\n\
  \n虽然交换机提供防嗅探的好处，但它们可能通过多种类型的第 2 层攻击被利用，例如 MAC、ARP、拒绝服务、中间人和欺骗攻击。\n\n### 交换机端口安全\n\
  \n`Switchport security`（交换机端口安全）是内置于网络交换机中的一项管理功能，允许配置单个物理端口，以便通过该端口的流量可以限制为特定的\
  \ MAC 地址或 MAC 地址列表。这些地址可以通过三种不同的方式定义：\n\n*   **Static secure（静态安全）**：当 MAC 地址（或地址）始终相同时，通常使用此指定。这假设同一设备始终连接到该端口且从不更改。\n\
  \n\n\n\n\n## 动态安全与粘滞安全\n\n*   **动态安全**：当 MAC 地址（或地址）不断变化时采用此模式。在此配置下，可限制端口一次仅学习特定数量的设备（MAC\
  \ 地址）。\n*   **粘滞安全**：此配置允许指定端口接受静态和动态 MAC 地址的组合。学习到的地址会直接添加到交换机的运行配置中。因此，若交换机重启，这些地址将被丢弃。\n\
  \n若违反上述安全端口模式的任一配置参数，将触发**交换机端口安全违规**，交换机将根据其响应配置采取以下四种方式之一进行响应：\n\n*   **保护模式**：若配置了保护模式响应，端口将继续转发已知\
  \ MAC 地址的流量，但丢弃违规发生前未知地址的流量。但不会产生安全通知。\n*   **限制模式**：此模式同样会在违规发生后丢弃未知地址的流量。不过，会记录系统日志消息并发送\
  \ SNMP 消息。\n*   **关闭模式**：配置此模式时，交换机将关闭发生违规的物理端口；该端口不再转发任何数据包。要恢复端口操作，需先禁用再启用该端口。\n\
  *   **关闭 VLAN 模式**：此配置下，交换机仅禁用指定的违规 VLAN。\n\n## 配置交换机 ACL\n\n正如在服务器中配置 ACL 可创建更安全的计算环境一样，保护网络最关键的方面之一是正确配置网络设备中的\
  \ ACL。可配置的 ACL 主要分为两大类。第一类是对象或用户对网络中特定资源拥有的权限列表，称为**自主访问控制列表 (DACL)**。\n\n使用此类 ACL\
  \ 时，访问控制是一项可配置服务（使用权限），用于确定用户可访问、更改或查看的内容。另一类可配置的网络 ACL 是驻留在防火墙或路由器接口上的列表，它允许或拒绝流量通过设备上的特定接口或端口进出网络。\n\
  \n虽然 DACL 允许用户或对象所有者决定其创建的文件或文件夹的权限，但路由器或防火墙接口上的 ACL 通常更具限制性。这些 ACL 是可配置的控制手段，可用于阻止特定方向的一种网络流量，同时允许其他通信通过防火墙或路由器接口。可通过关闭选定端口、限制协议使用，或拒绝单个或一组网络地址（可包含源或目的地址）来配置它们以过滤或阻断流量。\n\
  \n确定允许或拒绝哪些端口、协议或地址，必须基于组织的组织需求。网络安全专业人员必须了解其网络中应处于活动状态的端口和服务。\n\n必须始终注意保护路由器和防火墙的\
  \ ACL 配置文件。这些设备是网络的入口门户，因此是极具诱惑力的攻击目标。因此，应始终拒绝对 ACL 配置设备的直接物理访问和 Telnet 访问。此外，网络的所有\
  \ ACL 配置文件都应备份并与数据文件一起存储在安全位置。\n\n## 配置服务与协议\n\n**协议** 和 **服务** 最初旨在改善网络连接并促进用户间的资源共享。默认情况下，许多旧版操作系统在安装时即启用网络服务和协议。此默认设置方便了最终用户在无需过多考虑安全性的情况下进行连接和通信。\n\
  \n较新的操作系统则设计为安装时禁用服务和协议。所需的任何服务或协议必须由网络管理员在安装期间或之后启用。因此，管理员必须能正确回答以下几个问题，以正确安装操作系统并提供所需的服务和安全级别：\n\
  \n*   网络上当前使用哪些协议和服务？这可能是最关键的问题。管理员应定期检查服务器，以识别绑定且处于活动状态的每个网络连接上的协议列表。\n*   网络上真正需要哪些协议和服务？与第一个问题一样，此问题也至关重要。网络上运行不必要的协议会带来潜在的安全风险。\n\
  *   这些协议或服务在客户端和服务器之间建立了哪些依赖关系或链接？请考虑每个网络协议。若识别出连接协议，请评估其源地址和目的地址，以确保网络所需的关键协议未被禁用。\n\
  *   是否有已启用但无依赖关系且非网络正常运行所需的协议或服务？若有，应将其禁用或移除。服务器上运行的服务或应用越少，交互越少，维护或日志条目越少，从而降低网络的管理开销。\n\
  \n## 网络加固预防措施\n\n在活跃的企业网络中实施更新存在若干潜在困难。虽然保持网络系统加固以抵御攻击很重要，但这并不意味着收到每个产品更新后都应立即直接安装在网络设备上——恰恰相反。在实施任何更改前，应备份所有关键文件夹和组织资源。\n\
  \n由于更新可能存在潜在的编程故障或产生意外/不利条件，您不希望将此缺陷传播到整个网络。同样，您也不希望支持数百个客户端的关键服务器服务因您未在安装前测试更新而停止运行。\n\
  \n为避免此类潜在的破坏性或中断性事件，产品更新应始终先在非生产服务器上测试，然后再在组织网络中实施。您还可以考虑在网络最不繁忙的时间（如夜间或周末）安装应用程序更新。视更新性质而定，可能需要分段关闭网络，以便在不中断运营的情况下完成整个网络的更改。\n\
  \n例如，对于拥有 24 小时网络运营的组织，禁用所有协议的任何类型更新都可能不切实际。在整个网络执行此类更新意味着无可用连接支持正常运营。因此，在此类环境中实施此类更改的唯一有效方法可能是一次更改一个网络段。\n\
  \n## 复习题\n\n以下问题测试您对本章所呈现材料的掌握程度。\n\n1.  确定端点保护的三个边界。\n2.  在生产环境中，为 ICS 控制设备提供物理安全的推荐方法是什么？\n\
  3.  组织对员工自带设备 (BYOD) 接入企业网和 OT 网络环境有哪些顾虑？\n4.  近场通信系统提供相对安全的授权选项。网络安全管理员在使用这些系统时应有哪些顾虑？\n\
  5.  为网络用户配置服务和访问权限时，应用的最重要的网络安全原则是什么？\n\n\n\n\n\n### 6. 列出在主机内创建虚拟网络所提供的安全优势。\n\n\
  ### 7. 与应用安全相关的主要网络安全活动是什么？\n\n### 8. 解释几乎每个组织的安全策略中关于服务器恶意软件防护所包含的两项内容。\n\n###\
  \ 9. 解释针对 OT 设备（如 PLC 和 SCADA 系统）的恶意软件安全策略，与企业网络中制定的策略有何不同。\n\n### 10. SQL 注入攻击的来源是什么？\n\
  \n### 11. 保护 ICS 数据库（如数据历史服务器）最常用的方法是什么？\n\n### 12. \\_\\_\\_\\_\\_\\_\\_\\_\\_\\\
  _\\_ 加密技术采用两个密钥来确保加密数据的安全——一个公钥和一个私钥。公钥（人人皆知）用于加密数据，而私钥或密钥（仅指定接收者知晓）用于解密数据。\n\n\
  ### 13. 描述管理员可配置的两种网络访问控制列表类型，以实施组织的安全策略。\n\n### 14. \\_\\_\\_\\_\\_\\_\\_\\_\\\
  _ 是内置于网络交换机中的一项管理功能，允许配置单个物理端口，以便将该端口的流量限制为特定的 MAC 地址或 MAC 地址列表。\n\n### 15. 对于必须拥有\
  \ ICS 网络远程访问权限的任何账户，应设定哪些要求？\n\n### 16. 在活跃的企业网络中实施任何补丁或更新之前，应采取什么预防措施？\n\n## 考试题\n\
  \n### 1. 以下哪一项不代表攻击者可获取数据的三个常见位置之一？\n\n1. 内存中\n2. 显示器上\n3. 驱动器上\n4. 传输中\n\n### 2.\
  \ 从以下列表中，选择可用于加固大多数计算和控制设备外部边界的操作。（全选适用项。）\n\n1. 配置密码。\n2. 禁用任何不必要的硬件端口。\n3. 配置设备后禁用所有输入端口。\n\
  4. 限制启动选项。\n5. 配置系统后禁用任何显示设备。\n\n### 3. 从以下列表中选择保护移动设备的适当选项。（全选适用项。）\n\n1. 在组织的办公室或生产设施内时，关闭蜂窝连接。\n\
  2. 在组织的办公室或生产设施内时，关闭自动 Wi-Fi 连接。\n3. 在组织的办公室或生产设施内，开启蓝牙自动发现选项。\n4. 在组织的办公室或生产设施内时，关闭\
  \ TLS/SSL 选项。\n\n### 4. 从以下选项中，找出通常属于网络服务器加固步骤的选项。（全选适用项。）\n\n1. 实施本地登录要求。\n2. 实施额外的身份验证选项。\n\
  3. 禁用系统审核和事件日志记录。\n4. 建立防火墙设置。\n5. 自动安装安全更新和补丁。\n\n### 5. 从以下列表中，找出与实施虚拟网络相关的常见安全原则。（全选适用项。）\n\
  \n1. 隔离\n2. 分段\n3. 边界防护\n4. 数据加密\n\n### 6. 嵌入式设备普及带来的主要担忧之一是安装配置不当。从以下列表中，找出针对网络安全威胁加固这些设备的步骤。\n\
  \n1. 保持默认账户和密码处于激活状态。\n2. 启用 TFTP 配置。\n3. 禁用那些为易用性而非安全性设计的配置选项。\n4. 实施最小权限和需知原则的配置设置。\n\
  \n### 7. 哪种访问控制策略规定了哪些用户或组可以访问文件、文件夹和其他网络资源？\n\n1. 强制访问控制 (MAC)\n2. 自主访问控制 (DAC)\n\
  3. 非自主、基于角色的访问控制 (RBAC)\n4. 基于规则的访问控制 (RRBAC)\n\n### 8. 为了为给定网络配置安全的服务和协议设置，必须回答哪些问题？\n\
  \n1. 网络上运行的默认协议和服务是什么？\n2. 哪些协议和服务对网络构成最高的网络安全风险？\n3. 网络上真正需要哪些协议和服务？\n4. 网络上当前正在使用哪些协议和服务？\n\
  \n### 9. 配置托管交换机时，应采取哪些预防措施以加固其防御网络攻击的能力？（全选适用项。）\n\n1. 应使用标准串行电缆直接对其进行配置。\n2. 应将其置于防火墙后方以获得保护。\n\
  3. 应将其配置为访问管理控制台需要密码。\n4. 应通过直接控制台连接或 SSH 连接对其进行配置。\n\n### 10. 在托管交换机上配置交换机端口安全时，哪种安全端口响应模式允许端口继续转发已知\
  \ MAC 地址的流量，但丢弃违规发生前未知地址的流量，且不产生安全通知？\n\n1. 保护\n2. 限制\n3. 关闭\n4. 关闭 VLAN\n\n# 第\
  \ 5 章\n\n## ICS 网络安全要点\n\n## 简介\n\n1982 年，一名名为 Rich Skrenta 的 15 岁高中生编写了第一个已知的计算机病毒。最初这只是个玩笑，病毒被加载到一张软盘上并插入了朋友的\
  \ Apple II 电脑。它附着在一个游戏中，设计为在第 50 次启动游戏时触发。随后屏幕变为空白并显示了一首诗。这仅仅是个开始。随后，病毒进入计算机的 `内存`，每当插入未感染的软盘时，就会被复制到软盘上。\n\
  \n从这个看似无害的开端，计算机 `病毒` 诞生了。只需要一点点恶意意图。尽管病毒并非旨在造成破坏，但恶作剧捉弄朋友和制造挫败感的欲望，足以让作者设计出能够自我复制和传播的病毒。\n\
  \n一旦此类问题变得足够严重，设计者就会开始创建解决方案以防止其发生。这始于创建只读磁盘等安全设备，使得写入磁盘的文件不易被篡改。假设包装未拆封且磁盘未被替换，可以认为只读磁盘是安全的。\n\
  \n随着互联网加速发展并被广泛使用，大门为病毒传播和作恶者实施意图敞开了。这或许不是为了统治世界，但还有许多其他动机驱使人们所为。微软这样表述：“黑客的动机部分源于他们的不可见性。在互联网上，黑客可以‘窥探’公司的私密世界——其网络——并在保持匿名的情况下获取大量信息。”\
  \ 如今更复杂的黑客往往也受丰厚报酬的前景所驱动。\n\n因为存在许多人出于金钱、名声、破坏等诸多原因想要作恶，所以必须有人致力于防止此类事情发生。正如警察保护公民一样，网络安全从业者保护计算机、用户、员工和客户免受伤害。\n\
  \n### 基本安全原则\n\n\n\n\n\n## 在 IT/OT 网络环境中\n\n在 IT/OT 网络环境中，管理员负责实施组织的安全策略。这些策略的设计应反映组织的风险承受水平和风险管理策略。通常，这些策略是基于经过验证的*网络安全原则*（某一专业或群体成员公认的真理原则）设计的。因此，安全从业人员必须了解这些原则、它们的实施方式以及适用场景。本章开篇部分将探讨最基础的网络安全原则。\n\
  \n## 机密性、完整性和可用性\n\n与经典信息安全模型相关的最广为人知的原则之一，基于三个基本目标：机密性、完整性和可用性（CIA）。\n\n*   **机密性**：确保数据保持机密或私密。它通过一组旨在将数据访问权限限制在授权人员范围内的规则来建立。\n\
  *   **完整性**：确保数据准确且可信。数据完整性通过授权和认证工作来建立，以确保只有授权人员才能修改数据。它还通过确保授权更改在需要纠正时可被撤销的机制来维护。\n\
  *   **可用性**：确保数据能够及时、可靠地被访问。高数据可用性通过硬件和网络设计来建立，以确保在需要时数据可用。这涉及指定计算资源和网络架构，旨在尽可能快地将数据传递给用户。它还包括支持架构，在电源故障等情况下保持系统运行。\n\
  \n网络管理员在将组织策略实施到其网络安全架构中时，通常还会遵循另一个称为 AAA 的安全原则。\n\n*   **认证**：涉及确保个人就是他们声称的那个人。\n\
  *   **授权**：在个人通过认证后，批准其访问指定信息。\n*   **审计**：使用日志或其他跟踪工具创建事件跟踪列表。\n\n在一些中小型组织中，网络管理员可能还负责制定公司的*安全策略*，包括物理和逻辑访问控制。正如您在前几章所见，所有安全工作都始于物理访问层面。如果未经授权的人员能够物理接触到网络服务器、介质或连接设备，那么安全性将更容易受到破坏。一旦获得物理访问权限，网络安全级别将大幅降低。\n\
  \n在大型组织中，通常会创建专门的管理角色来处理网络运营的不同方面。这可能包括设立单独的服务器管理员和网络管理员。*服务器管理员*负责服务器计算机的设计、实施和维护，而*网络管理员*为网络及其介质和连接设备提供相同的职能。\n\
  \n管理职责的划分还可能涉及专门的*安全管理员*，其负责执行网络中服务器、主机和连接设备的信息安全任务。在这些环境中，管理职责的分离应尽可能清晰、明确且受控。\n\
  \n## ICS 网络中的可用性\n\n如前所述多次，OT 和 IT 网络的意图和运行方式截然不同。虽然 IT 网络的主要安全原则是为数据提供 CIA，但在工业或公用事业网络中，主要重点应转移到考虑网络中每个资产或系统的各个\
  \ CIA 影响，其中可用性是最重要的方面。基本上，安全原则变为 AIC（首先是可用性，然后在可能的情况下是完整性和机密性），以保持运营持续运行。\n\n工业过程网络的关键要求包括以下内容：\n\
  \n*   **可用性**：许多过程是连续运行的，要求其控制器具有高可用性、可靠性和可维护性评级。可用性通常是工业控制系统中的最高目标，与数据完整性并列。机密性在过程控制系统中传统上一直是次要关注点。这与与\
  \ IT 系统相关的通用 CIA 要求完全相反。\n*   **及时性**：过程控制是一种时间敏感型操作，要求快速响应时间。IT 系统通常没有及时性约束。因此，前线智能过程控制器运行在实时操作系统上。\n\
  \n因此，工业过程控制器的关键要求包括*可用性*、*及时性*、*工业接口*和*物理加固*。\n\n正如上一章所述，当数据在工业过程中延迟时，坏事就会发生。ICS\
  \ 网络任何部分的可用性缺失都会以多种方式对组织产生负面影响：\n\n*   **健康与安全**：因为 OT 网络主要存在于制造、生产和公用事业工厂中，过程机械和人员可能处于同一环境，因缺乏可用性导致的数据丢失可能导致人员伤害以及设备损坏和生产力损失。\n\
  *   **环境问题**：许多工业过程涉及高度危险的化学品和材料，可能破坏环境。例如，如果化学过程中的控制器未能及时接收到管理过程所需的数据，危险或有害化学品可能会释放到环境中。\n\
  *   **生产力**：因数据丢失导致的可用性故障会导致生产力和盈利能力的损失。当生产机械停止运行时，组织正在以生产力和盈利能力的形式损失金钱。\n\n一般来说，可用性保障可以通过使用冗余组件和系统、提升访问控制程序以及高效的备份策略和程序来增强。工业组织执行*过程危害分析*（*PHA*）来量化其与前面列出的各类别相关的风险。\n\
  \n在美国，这些研究是*环境保护局*（*EPA*）风险管理计划以及职业安全与健康管理局（OSHA）过程安全管理标准的关键要求。这些标准要求 PHA 研究涵盖与特定过程相关的所有毒性、火灾和爆炸危害，包括其对人员、公众和环境的潜在影响。第\
  \ 11 章“灾难恢复与业务连续性”中详细描述了 PHA。\n\n## 不可否认性\n\n网络安全领域的另一个主要原则是*不可否认性*。通常，在网络安全环境中，该术语用于指代一种服务，该服务证明数据的完整性和来源（作者身份）。换句话说，认证证明某个对象（如文档或图形）是真实的，且来自声称发送它的人。在网络安全环境中，这涉及使用密码学工具来提供数据完整性的证明。此类工具通常包括以下内容：\n\
  \n\n\n\n\n## 哈希\n\n这是一种用于验证对象完整性的数学方法。将哈希算法应用于对象以生成代表该对象的唯一代码。然后对对象进行加密，并连同哈希代码一起发送。接收时，接收方解密消息和哈希值，并比较这两个哈希值。如果它们一致，则接收方有很大可能性确信消息是原始的且已完整送达。这是一种单向操作。它是不可逆的，且始终涉及固定数量的字符。\n\
  \n## 数字证书（公钥基础设施）\n\n颁发公钥证书是为了提供关于对象所有者身份的信息。它们还包含关于密钥的信息以及认证机构或证书颁发机构（`CA`）的数字签名。如果签名有效，且经审查认证机构被认为是可信的，则该密钥可用于通信，并对安全性抱有很高期望。\n\
  \n## 数字签名\n\n这些是用于验证数字消息或文档真实性的数学算法。在网络安全环境中，数字签名涉及认证、完整性和不可否认性应用。\n\n## 可信第三方（TTP）\n\
  \n这些包括第三方见证人（按需认证）和数字取证分析师（事后认证）。在密码学中，公钥证书是唯一被认可的可信第三方，它们创建了双方都信任第三方的环境。\n\n##\
  \ 最小权限原则\n\n正如多次引用的那样，*最小权限*和*需知*原则被管理员用于建立对不同资产的访问控制级别。该原则是指给予每个用户完成其工作角色所需的最少访问权限，且仅限于他们必须访问的网络区域。\n\
  \n在网络安全领域，该原则必须首先转化为组织政策，然后应用于人员、流程和技术。*国际标准化组织*（`ISO`）`27002` 标准提出了信息安全管理的建议，其中包括将*最小权限*原则作为要采用的访问控制方法之一，以降低对网络和组织的风险。最小权限权利和权限政策通常与职责分离政策一起实施。\n\
  \n## 职责分离\n\n在管理关键数据或特殊任务时，我个人最喜欢的预防性安全措施之一是*职责分离政策*。此类政策旨在确保没有单个个体能够危害系统。在处理政府机构的*机密*和*绝密*信息，或中小企业（`SMB`）或企业组织中的*保密*和*高度机密*信息时，这可能非常有用。\n\
  \n职责分离政策通常以*双人控制*的形式实施。顾名思义，双人控制意味着两个用户必须相互审查并批准对方的工作，才能完成一个项目。实质上，需要两个人才能完成一项分配的任务。尽管这对于许多任务可能不切实际，但对于实施了该措施的任务，它提供了高级别的安全性。\n\
  \n组织绝不应让同一员工执行采购和接收活动。如果员工被授予该流程两端的权限，他们可能能够进行交易并对组织隐瞒，而不被发现。\n\n其他职责分离政策旨在防止个别员工参与任务的不同部分，以免他们获得足够的知识或技能独自完成整个任务。\n\
  \n在项目上将研发工程师分离也是常见做法，使每个小组仅处理项目的一小部分。随着每个小组工作的完成，主管通常会介入，协调他们的工作与另一小组对应人员的工作。这确保了没有单个小组能够复制整个项目。\n\
  \n## 漏洞与威胁识别\n\n在每个场所，网络安全始于政策和程序。在识别出组织的硬件和软件资产后，网络安全政策制定过程的下一步是准确识别这些资产所面临的潜在*漏洞*和*威胁*。这些术语并非同义词：\n\
  \n*   *漏洞*是指任何使网络或其设备暴露于威胁之下的弱点。\n*   *威胁*是指实施意图造成痛苦、伤害、损害或其他敌对行动的潜在可能性。\n\n收集原始威胁信息后，按对组织的关注程度对其进行组织。然后将各种威胁置于具体情境中，描述如果发生这些威胁，将如何影响组织及其运营。即使是看似简单的行为——例如记录密码、未保护服务器机房安全或未正确关闭计算机——也会产生组织必须考虑在内的漏洞。\n\
  \n在网络安全环境中，*威胁识别过程*是一种预防措施，旨在记录可能产生风险因素并影响网络数据机密性、完整性和可用性的漏洞。虽然有许多方法用于识别和列出风险，但该过程应基于通过经验、预测、主题专业知识和其他可用资源相结合收集的信息。这些方法在第\
  \ 8 章“ICS 安全治理与风险管理”中有详细描述。\n\n过去二十年来，随着互联网在全球范围内的指数级增长，黑客文化的刻板印象已越来越深入人心，被认为是利用时间试图绕过计算机安全措施以造成破坏的青少年游手好闲者。然而，这是一种刻板印象，无法为网络安全专业人员提供对不同类型黑客相关威胁的真实理解。\n\
  \n网络安全专业人员准确了解不同威胁行为者类型及其代表的威胁背后的动机非常重要。图 5.1 显示了各类网络黑客行为背后的驱动力。以下部分描述了这些不同的黑客类型和称谓，以及他们的动机。\n\
  \n![图 5.1 攻击动机](img/c05f001.png)\n\n**图 5.1** 攻击动机\n\n### 国家行为体\n\n国家被定义为在一个政府下生活、拥有共同历史、语言或传统的一群人——换句话说，一个国家或*主权国家*。国家间的*间谍活动*并非新鲜事；自人们开始划定国界以来就一直存在。然而，互联互通的网络世界的发展为间谍活动开辟了新的可能性领域。\n\
  \n*网络间谍活动*并非完全是新现象，但各国和组织发现自己正在争分夺秒地追赶最新的工具和技术。现代威胁不仅限于以收集敌对国家情报为目标的网络间谍活动，彻底的攻击甚至秘密破坏财产也极有可能发生，而几乎没有法律或条约来阻止它们。例如\
  \ Stuxnet 病毒等网络攻击，就是互联网无国界世界以及无需承担后果即可在数千英里外造成破坏能力的绝佳例证。\n\n### 网络恐怖分子\n\n\n\n\n\
  ## 网络威胁行为体分类\n\n*Cyberterrorists*（网络恐怖分子）通常不是为了金钱，而是为了推进 *political agenda*（政治议程）或\
  \ *ideology*（意识形态）。其目标是给公众造成伤害和混乱。这类黑客的定义范围很广，也可适用于其他类型的黑客。例如，既以金钱为动机又要推进自己议程的黑客，既可以是\
  \ *cybercriminal*（网络罪犯）也可以是 *cyberterrorist*。虽然这些定义过于宽泛，但这两类黑客都会对系统和网络造成严重破坏，每年造成数十亿美元的损失。\n\
  \n### Cybercriminals（网络罪犯）\n\n*Cybercriminals* 通常由贪婪驱动，寻求 *financial gain*（经济利益）。这类黑客可能是最引人注目的类型，因为他们产生的关注度最高。例如，*CryptoLocker*（一种勒索软件木马）的创建者仅仅是为了钱。他们的产品旨在制造一种局面：你支付大笔赎金以取回信息。一旦付款，他们会提供解密密钥。勒索软件流程的步骤通常涉及以下事件序列：\n\
  \n1.  访问目标计算机，并建立反向 Shell。\n2.  将勒索软件载荷传输到目标并执行。\n3.  执行操作时，载荷会修改 Windows 注册表。此修改将导致漏洞利用在启动时运行。\n\
  4.  删除备份记录。\n5.  加密文件系统内容（使用单一加密，或最近更常见的双重加密）。\n6.  将解密密钥泄露到攻击者的服务器。\n7.  向用户发送/显示勒索通知，附带支付赎金和获取解密工具的说明。\n\
  \n此类勒索软件不幸地很常见，且恢复起来非常麻烦。虽然勒索软件/恶意软件研究人员一直在努力检测勒索软件代码中的缺陷并提供解密密钥工具，但如果你遭遇了勒索软件攻击，也有公司宣传提供勒索软件恢复服务。\n\
  \n然而，攻击者也增加了漏洞利用的复杂性。高级勒索软件漏洞利用可能涉及基于 RSA 和 AES 加密算法组合的双向加密。一种算法用于加密目标数据，另一种用于在发送到服务器前加密解密密钥。这几乎不可能解密，因为它使用了通常用于保护数据的相同加密算法。\n\
  \n*Cybercriminals* 指望目标没有备份数据，因此因数据的内在（或财务）价值而不得不屈从于攻击者的要求。如果你在读到本书这一点之前还没被说服，**备份极其重要！**\n\
  \n勒索软件恢复的最后一线希望是：等待攻击者关闭业务并发布密钥，或被政府机关抓获并发布密钥。请保留被勒索软件锁定的数据，因为这种密钥发布实际上已在多个场合发生过。\n\
  \n### Script Kiddies（脚本小子）\n\n*Script kiddies* 通常是对编程、脚本或网络安全知之甚少的个人。他们通常出于好奇心或同伴压力，利用从互联网（通过论坛或代码仓库）收集的信息来攻击系统、网络或个人用户。大多数\
  \ *script kiddies* 通常不知道他们的攻击程度，也不清楚实际对目标系统做了什么。\n\n*Script kiddies* 通常被认为是缺乏创建精心设计攻击所需技能的青少年。然而，许多成年人仅因缺乏黑客知识和实践而符合\
  \ *script kiddies* 的定义。在某些方面，他们可被视为 *black-hat hackers*（黑帽黑客），因为他们的意图不善，但真正的黑客会反驳这一点，不愿被纳入关于他们的讨论。大多数真正的黑客倾向于不被注意和发现。然而，*script\
  \ kiddies* 通常不知道如何隐藏他们的攻击。\n\n卡内基梅隆大学软件工程研究所发布的一份技术报告（`www.hackmageddon.com/2021/06/08/may-2021-cyberattacks-statistics`）对\
  \ *script kiddies* 定义如下：\n\n> “更不成熟，但不幸的是往往同样危险的互联网安全漏洞利用者。典型的 *script kiddie* 使用现有的、经常是众所周知且易于查找的技术和程序（或脚本）来搜索和利用互联网上其他计算机的弱点——通常是随机的，很少考虑甚至可能根本不了解潜在的有害后果。”\n\
  \n他们使用的许多脚本，以及可用于攻击系统的网络安全软件包和 Linux 发行版，都可以在网上找到。*Script kiddie* 只需在脚本中更改几个参数即可发起攻击。\n\
  \n其中一些工具是用于对网络进行渗透测试的免费应用程序。然而，由于其易于获取和使用，几乎任何人都可以下载这些攻击工具，输入基本参数，并在不真正了解自己在做什么的情况下对网络造成损害或停机。\n\
  \n### Hacktivists（黑客活动家）\n\n*hacktivism*（黑客行动主义）一词自 1980 年代中期以来一直存在，通常用于描述一种服务于某种目的的模棱两可的网络恐怖主义概念。通常，*hacktivists*\
  \ 认为他们的行为和罪行是合理的，无论是通过泄露机密信息，还是做一些原本不会发生的道德上正确的事情。\n\n黑客组织 *Anonymous*（匿名者）于 2003\
  \ 年首次出现，他们经常自称 *hacktivists*，意指他们通过纠正错误和“总体上行善”来服务世界。*Anonymous* 拥有基于理念而非指令运作的去中心化指挥结构。该群体没有明确的哲学或信仰体系，但总体上反对互联网审查，并寻求开展促进其信仰的活动。\n\
  \n## Insider Threats（内部威胁）\n\n虽然网络的主要威胁显然来自互联网，但任何网络内部也存在重大威胁。研究表明，*insider threats*\
  \ 代表了大多数网络组织面临的最大威胁。一些调查结果表明，内部威胁可能占恶意网络活动的 50% 以上（“Insider Threat: The Human Element\
  \ of Cyberrisk”，见 `www.mckinsey.com`）。\n\n网络管理员应保持警惕，意识到这些威胁的重要性。内部威胁往往比其他类型的威胁破坏性更大，因为它们不易被发现的时间更长，且拥有对受信任资源的现成访问权限。不满的员工可能利用其访问权限通过破坏组织某部分功能来攻击网络，或试图以恶意意图访问未授权资源。\n\
  \n内部威胁可能是恶意的，也可能是非恶意的。来自网络内部的恶意威胁动机多种多样，不满或不满意的员工确实会造成不容忽视的风险。从网络安全角度来看，目标主要是将单个内部用户可能造成的损害降至最低。然而，更常见的是因粗心大意或缺乏用户教育而导致的非恶意威胁。\n\
  \n网络钓鱼攻击当然是最常见的内部威胁，但意外损坏或删除，以及数据的不安全处理，也是主要威胁。从家庭或其他外部网络带来的 USB 闪存驱动器等存储介质通常包含恶意软件。*Conficker*\
  \ 蠕虫以闪存驱动器为目标，一旦连接到活动 USB 端口就会自动执行。\n\n\n\n从外部网络带入网络的笔记本电脑、平板电脑甚至手机，带来的风险与 USB 设备相同。此外，它们作为潜在的未授权网络设备，构成了更大的威胁。\n\
  \n内部威胁极难监控，因为它们通常类似于用户每天可能执行的正常活动。因此，它们代表了网络工具难以提供帮助的领域。然而，这些威胁绝不能被忽视。策略（如最小权限和职责分离）、教育（用户、管理员和高管教育）以及整体战略，才是应对此类威胁的关键。\n\
  \n当涉及 `disgruntled administrators`（心怀不满的管理员）时，内部攻击的检测和处理会更加困难。因为这些人员比普通用户拥有对网络资产更大的访问权限和控制权，他们能造成的破坏程度通常大得多。标准的最小权限和职责分离控制，是降低与这些威胁相关的潜在风险的最佳工具。\n\
  \n即使是管理职责，也应设计为共享制，以便即使是管理者也无法独自从头到尾完成关键任务。例如，在资源允许的情况下，管理团队的一名成员应负责创建新用户，而第二名管理员负责建立其权限（但仅在另一名管理者授权后）。\n\
  \n## 事件、事故与攻击\n\n在任何网络的正常运行中，都会发生各种变化，因此管理员必须持续监控网络中的异常情况。异常活动可分为三类：\n\n*   `Cyber\
  \ events`（网络事件）：指网络中的变更、错误或中断。事件可能源于典型的计算机/网络活动，如磁盘驱动器故障、网络硬件故障或用户错误。然而，它们也可能是表明事故即将发生或正在发生的活动。\n\
  \n*   `Cyber incidents`（网络事故）：指在网络或计算环境中产生不利影响、需要采取行动加以缓解的发生情况。该术语也可适用于违反组织安全策略、程序或可接受使用实践的发生情况。\n\
  \n*   `Cyberattacks`（网络攻击）：指试图未经授权访问网络或计算系统服务、资源、数据或完整性的行为。该术语还可延伸至包括任何试图绕过网络或计算环境的安全服务和控制的故意行为。\n\
  \n### 威胁载体\n\n网络威胁行为者创建事故并对某人网络实施攻击的方式有很多。这些方式统称为 `threat vectors`（威胁载体），即威胁用于触达\
  \ `target`（目标）的工具、技术和程序（TTP）。\n\n网络安全专业人员必须了解不同类型的威胁载体如何被用于研究、规划和实施针对目标的网络攻击。这一过程的第一步是了解网络攻击路径。随后是了解不同的攻击方法、技术和工具如何沿该路径被使用。\n\
  \n#### 攻击路径\n\n`attack path`（攻击路径）描述了攻击者研究、规划、实施和执行攻击的过程。虽然对典型网络攻击路径有各种描述，但所有攻击都遵循一个基本的六步或七步流程。\n\
  \n最著名的网络攻击路径描述之一是 `Cyber Kill Chain`（网络攻击链），或称 `Intrusion Kill Chain`（入侵攻击链），详见\
  \ `https://lockheedmartin.com/en-us/capabilities/cyber/cyber-kill-chain.html`。该流程由洛克希德·马丁公司开发，旨在应对被称为\
  \ `advanced persistent threats`（`APTs`，高级持续性威胁）的多年攻击。这些威胁针对非常特定且非常安全的系统，并产生了以非传统网络安全最佳实践方式应对这些威胁的需求。\n\
  \n图 5.2 中呈现的 `Intrusion Kill Chain`（入侵攻击链），聚焦于我们将在本章中讨论的七个阶段：\n\n*   Reconnaissance（侦察）\n\
  *   Weaponization（武器化）\n*   Delivery（投递）\n*   Exploitation（利用）\n*   Installation（安装）\n\
  *   Command and control (C2)（命令与控制）\n*   Actions on objectives（目标行动）\n\n![FIGURE\
  \ 5.2 Cyber Kill Chain](img/c05f002.png)\n\n**图 5.2** Cyber Kill Chain\n\n#### 侦察\n\
  \n在军事应用中，`reconnaissance`（侦察），或称 recon，是指“……对某一区域进行观察以定位敌人或确定战略特征”，或“初步勘测或研究”。黑客在通用攻击策略中使用侦察，与军事用途并无本质区别。\n\
  \n侦察是黑客熟悉目标并开始寻找潜在途径进入目标关键基础设施的第一步，无论是手动还是数字化方式。黑客通常会花费更多时间对目标进行侦察和研究，而非实际利用漏洞。\n\
  \n这段时间投入非常值得，因为它能产出关于目标网络极其有用的信息，使黑客能够专注于更可能产生结果的特定漏洞，伪装其攻击，并限制其在网络上暴露于潜在检测设备的风险。\n\
  \n#### 社会工程学攻击\n\n当我们想到网络漏洞时，通常不会首先想到人为漏洞，但它们是许多网络安全攻击的目标。`Social engineering`（社会工程学）本质上是利用人际互动来规避正常的安全措施。随着传统安全措施的改进和网络漏洞利用难度的增加，黑客正转向物理和心理层面的人为操纵以达成目的。\n\
  \n我们往往对此概念一笑置之，且常觉得用户竟会以此方式受骗令人惊讶，但这些欺骗手段正变得越来越详尽和复杂。有些社会工程学欺骗极其逼真，只有通过极度审慎的审查和适当的培训才能识别。\n\
  \n例如，`phishing`（网络钓鱼）是一种社会工程学技术，它利用情绪反应，通过伪装成可信的组织或个人，试图获取敏感信息（通常是登录凭证或信用卡数据）。这些攻击通常涉及引导用户访问一个外观酷似真品的虚假网站的电子邮件，如图\
  \ 5.3 所示。\n\n![FIGURE 5.3 Social engineering attacks](img/c05f003.png)\n\n**图 5.3**\
  \ 社会工程学攻击\n\n无论攻击者是亲自与受害者交谈还是发送电子邮件，目的都是一样的：从当事人那里提取有价值的信息，以协助社会工程师对目标实体实施进一步攻击。社会工程学最引人入胜的方面之一在于其可能是非技术性的。在社会工程学方面，攻击不一定需要键盘、显示器或\
  \ 1 和 0。\n\n社会工程学几乎完全依赖人际互动，且常利用人类天生乐于助人的本能，诱骗其违背正常安全程序。社会工程学的最终目标是让受害者最终做一些他们平时不会做的事，例如泄露公司外部人员不知晓的秘密信息，如密码、用户名、维护计划等。获取建筑物受限区域的物理访问权限，往往也是社会工程师追求的另一个目标。\n\
  \n社会工程学攻击有多种类型。然而，这些攻击可分为两大类：\n\n*   依赖 `physical techniques`（物理技术）的攻击\n*   依赖 `psychological\
  \ techniques`（心理技术）的攻击\n\n\n\n本章以下各节将讨论与每个类别相关的各种社会工程学技术。\n\n## 物理社会工程学技术\n\n涉及物理行动的社会工程学，通过收集较小的信息片段（如用户名、密码、信用卡号、PIN\
  \ 码等），可能会产生大量信息。成功实施社会工程学的三个关键要素：\n\n*   不要被抓住！\n*   不要露馅！\n*   保持借口简单！\n\n未能满足上述任何一项要求，都可能让你陷入严重麻烦。这些概念在社会工程学框架\
  \ `www.social-engineer.org/framework/general-discussion` 中有详细描述。\n\n### 偷窥\n\n*偷窥*\
  \ 是最简单、最常见的社会工程学攻击之一，可用于潜在受害者身上。在偷窥攻击期间，如 图 5.4 所示，攻击者会瞥视毫无防备的受害者肩膀上方，企图观察或记录他们输入的某些私人信息，如姓名、地址、信用卡号、社会安全号等。\n\
  \n![FIGURE 5.4 Shoulder surfing](img/c05f004.png)\n\n**图 5.4** 偷窥\n\n偷窥可能发生在许多不同场景中，但通常在拥挤区域最为有效，因为在这类环境下攻击行为比在更私密的环境中更不易察觉。常见的偷窥机会包括受害者实施以下行为：\n\
  \n*   在表格或申请书上填写信息字段\n*   在 ATM 机或商店的借记卡机上输入 PIN 码\n*   在办公室或公共场合输入用户名/密码凭据\n* \
  \  在智能手机上输入 PIN 码/密码/安全图案\n*   在飞机上坐在某人后面或旁边，查看电子表格、战略文档、招聘启事或演示文稿\n\n借助双筒望远镜等放大设备，或隐蔽放置且受害者不知情的闭路摄像头，偷窥也可能远距离实施。这两种方法均可让攻击者在观察受害者输入潜在敏感信息时，比直接站在受害者身后面临的被发现威胁小得多。\n\
  \n根据 Secure（欧洲视觉数据安全协会，`https://visualdatasecurity.eu`）发布的一份安全白皮书，对 IT 专业人员的调查产生了以下统计数据：\n\
  \n*   85% 的受访者承认曾在屏幕上看到过他们无权查看的敏感信息。\n*   82% 的受访者承认其屏幕上的信息可能被未授权人员查看。\n*   82%\
  \ 的受访者对其组织内的用户会保护屏幕不被未授权人员查看这一点，几乎没有信心或完全没有信心。\n\n个人可以尝试防止自己成为偷窥的受害者。防止偷窥的常见技术包括：\n\
  \n*   *练习情境感知*：用户需要时刻注意周围环境，尤其是在提供敏感信息时。\n*   *遮挡潜在攻击者的视线*：如果有人可能看着你输入敏感信息，尝试通过遮挡\
  \ PIN 键盘、安装特定角度下遮挡内容的特殊设备，或礼貌地请他们在你输入密码时看向别处来遮挡他们的视线。在笔记本电脑上使用防窥屏，使屏幕只能从正前方查看。\n\
  *   *意识与培训*：根据 Secure 同一项调查，98% 的受访 IT 专业人员同意“教育个人了解整体视觉数据安全威胁及其如何防止泄露非常重要。然而，只有\
  \ 56% 目前制定了某种计划来保障视觉数据安全。”\n\n意识与培训是防范社会工程学攻击最有效的工具。\n\n### 窃听\n\n*窃听* 是指未经当事人同意，秘密聆听私人对话的行为，如\
  \ 图 5.5 所示。你小时候，是否曾躲在某处试图偷听父母谈论你不该听的事情？也许他们在交谈，也许其中一人在打电话。这是窃听的典型例子。\n\n![FIGURE\
  \ 5.5 Eavesdropping](img/c05f005.png)\n\n**图 5.5** 窃听\n\n### 垃圾箱搜寻\n\n如果你听过那句老话“一人垃圾，他人宝藏”，那便是理解垃圾箱搜寻的好方式。在信息技术和道德黑客领域，*垃圾箱搜寻*\
  \ 是潜在攻击者用来检索信息的一种技术，这些信息可用于帮助他们对目标系统或计算机网络发起攻击。\n\n如 图 5.6 所示，垃圾箱搜寻不仅仅局限于在实体垃圾中寻找显而易见的有用信息，例如清洁人员带出的写有密码的便利贴。其他信息，包括电话记录、旧日历或组织架构图，均可用于帮助潜在攻击者通过社会工程学手段进入目标网络。\n\
  \n为防止垃圾箱搜寻成为隐患，建议公司和组织实施信息销毁政策，即所有含敏感信息的纸张在回收前，均须使用交叉切碎机粉碎。\n\n应避免使用条状切碎机，因为它们存在攻击者更容易重组信息并窃取的风险。如存储介质（如硬盘）将来仍需使用，应使用高级数据擦除工具进行擦除。\n\
  \n![FIGURE 5.6 Dumpster diving](img/c05f006.png)\n\n**图 5.6** 垃圾箱搜寻\n\n如果存储介质不再使用，应使用硬盘粉碎机进行物理销毁，或进行消磁。*消磁*\
  \ 是将磁场减弱或尽可能完全消除的过程。由于数据是通过电荷序列写入驱动器的，消磁会使硬盘在未来变得不可读且不可用。\n\n### 搭便车与尾随\n\n*搭便车*\
  \ 是指社会工程师请求目标“帮忙开着门”，从而在无需提供凭证的情况下进入受限区域。这可以通过简单地请求目标并获得许可来完成，如果目标最初拒绝社会工程师进入并要求出示公司徽章等凭证，可能需要一些额外的胁迫手段。\n\
  \n在这些情况下，社会工程师可能会声称他们休息时把徽章落在楼里了，或者上班时把徽章落在家里了。社会工程师也可能为此制作了假徽章，并请求帮忙开着受限区域的门，即使公司政策要求所有员工必须刷徽章才能进入。\n\
  \n许多员工基于人性，会接受社会工程师帮忙开门的请求，并被假凭证欺骗，因此不会要求同事刷徽章以合法进入。\n\n\n\n\n## 尾随进入\n\n*尾随进入*，如图\
  \ 5.7 所示，与“搭便车”类似，社会工程师的最终目标都是获取对公司或组织未授权区域的访问权限。“搭便车”用于描述在目标知情同意下发生的此类行为。\n\n尾随进入是指在目标*不知情*的情况下发生此类行为的术语；攻击者等待某人通过门口，然后在门关闭前抓住门并进入，从而实施未授权访问。\n\
  \n![图 5.7 尾随进入](img/c05f007.png)\n\n**图 5.7** 尾随进入\n\n## 转移注意力\n\n*转移注意力*是一种旨在分散个人监控注意力的战术。通常，制造转移注意力的情况是为了让攻击者能够在不被发现的情况下查看敏感信息，或在不被盘问的情况下进入安全区域。如图\
  \ 5.8 所示，转移注意力通常涉及团队作业，一名攻击者制造干扰，分散个人对资源或入口的监控注意力。\n\n![图 5.8 转移注意力](img/c05f008.png)\n\
  \n**图 5.8** 转移注意力\n\n然而，转移注意力也可以由单个攻击者制造。例如制造某种巨大噪音吸引保安的注意力，促使其前去调查，从而给攻击者留下可乘之机进入入口点。\n\
  \n## 心理社会工程学\n\n*心理工程学*是另一种类型的社会工程学，其最终目标是人的大脑。利用心理学和人性弱点，黑客可以设计多种不同的攻击，诱使人们相信攻击者希望他们相信的内容，并泄露他们通常不会透露的重要信息。\n\
  \n### 借口攻击\n\n《梅里亚姆-韦伯斯特词典》将*借口攻击*定义为“冒充他人以获取私人信息的做法”。社会工程师利用精心编造的谎言，说服受害者提供他们想要的信息或执行特定行为。\n\
  \n例如，在 2007 年的电影《虎胆龙威 4.0》中，演员贾斯汀·朗闯入一辆汽车，并说服受害者——在此案中是 OnStar 的代表——在没有钥匙的情况下启动汽车，他使用了一个临时想出的谎言，旨在激起受害者的情绪反应。\n\
  \n现实生活中的私人调查员经常使用借口攻击来获取机密信息，这些信息可用于说服员工泄露其他个人或私人信息。\n\n例如，一家公司在笔记本电脑上贴有几英尺外可见的唯一资产标签。一名员工在当地咖啡厅休息，社会工程师记下了该设备的资产标签，以及员工佩戴的可见工牌上的姓名。\n\
  \n随后，社会工程师访问公司网站查找该员工的地址，从而也获得了其账户的用户名。接着，他们拨打公司公开网站上发布的服务台电话，请求重置该员工的密码。\n\n社会工程师编造了一个非常悲伤的故事，称今天是有史以来最糟糕的一天；他们无法登录笔记本电脑，非常非常需要帮助。由于社会工程师掌握了用户名和笔记本电脑的资产标签，服务台技术人员便为其重置了密码。\n\
  \n社会工程师还注意到公司为异地员工提供预配置的 VPN 客户端供下载。他们现在通过 VPN 客户端登录网络，获得了海量信息的访问权限，这一切仅仅因为他们掌握了几条通过利用服务台技术人员情绪而获取的信息。\n\
  \n### 网络钓鱼\n\n*网络钓鱼*是一种社会工程学战术，利用欺诈性电子邮件，攻击者发送看似合法的电子邮件，试图从收件人那里收集个人信息。通常，如图 5.9\
  \ 所示，邮件看似来自知名且值得信赖的网站或公司。\n\n![图 5.9 网络钓鱼示例](img/c05f009.png)\n\n**图 5.9** 网络钓鱼示例\n\
  \n常被冒充的公司和网站包括 DHL、Microsoft、WhatsApp、LinkedIn、Amazon、FedEx、Roblox、eBay 和 PayPal，以及美国银行和富国银行等金融机构，还有\
  \ Yahoo、MSN 和 Google 等电子邮件提供商。最新的网络钓鱼冒充品牌榜单可访问 `https://blog.checkpoint.com/2022/01/17/dhl-replaces-microsoft-as-most-imitated-brand-in-phishing-attempts-in-q4-2021`。正如其名称源自的单词\
  \ *fishing*（钓鱼）一样，网络钓鱼攻击试图抛出诱饵，希望人们“上钩”并成为受害者。这一过程在前文的图 5.3 中已有说明。\n\n多年来，网络钓鱼邮件变得非常复杂，许多会重复利用之前成功的网络钓鱼邮件片段。2014\
  \ 年曾发生一起此类事件，当时发现了一起冒充美国国税局 (IRS) 的网络钓鱼邮件诈骗。\n\n在这封邮件中，攻击者利用了收件人渴望收到退税的心理。邮件正文包含一个指向网页的链接，收件人可在该网页指定退税的付款信息，前提是他们提供登录凭证。对该网络钓鱼邮件的进一步分析显示，钓鱼网页上的相同文本早在\
  \ 2006 年就已被使用过。\n\n个人可以采取以下几个步骤来避免网络钓鱼诈骗：\n\n*   对索要敏感信息的电子邮件保持怀疑态度。\n*   切勿回复索要个人信息的电子邮件。\n\
  *   切勿点击疑似网络钓鱼邮件中的链接。\n*   使用会提醒用户已知或疑似钓鱼网站的 Web 浏览器。\n*   自问：\n    *   发件人是否为熟人？\n\
  \    *   你是否预期会收到这封邮件？\n    *   请求是否异常，或要求立即或在短时间内完成任务？\n*   如果上述问题的答案均为“否”，这应触发你以健康的怀疑态度进行审查，核实发件人，检查链接（如有），若有附件，在核实其真实来自发件人之前请勿打开。\n\
  \n### 定向钓鱼\n\n*定向钓鱼*与网络钓鱼类似，都是冒充邮件的欺诈尝试。主要区别在于，网络钓鱼攻击看似随机地发送给广泛目标，而定向钓鱼攻击则针对特定组织或该组织内的特定个人，试图获取对机密数据的未授权访问。定向钓鱼攻击更可能由寻求巨额经济利益、行业机密、军事信息或特定目标访问权限的攻击者实施。\n\
  \n与普通网络钓鱼攻击类似，定向钓鱼邮件看似来自可信来源。定向钓鱼攻击的一个例子是：攻击者发现目标组织的一个网页，其中包含公司联系信息（部分或完整）。\n\n\
  利用推导出的细节使邮件显得真实，攻击者会向联系页面上的目标员工起草一封邮件，看似来自有理由请求机密信息的个人（如公司的网络管理员）。邮件会提示员工向一个伪造页面提供登录凭证，该页面请求用户的用户名和密码，并为攻击者收集这些信息，以便稍后访问网络。\n\
  \n\n\n\n或者，电子邮件可能会提示用户点击一个链接，该链接会在用户不知情的情况下下载间谍软件或其他恶意软件。此恶意软件可能会在用户的系统上安装一个后门，攻击者稍后可利用该后门进入用户的系统。只需一名员工上当受骗，攻击者便可伪装成该受骗员工，并使用额外的社会工程学技术进一步获取对敏感信息和数据的未授权访问。\n\
  \n## 鲸钓攻击\n\n*鲸钓攻击* 是网络钓鱼的另一种子类型，其目标是“高知名度”的最终用户，如企业高管、政客或名人。就像任何网络钓鱼攻击一样，鲸钓攻击的目标是通过伪造的电子邮件和其他社会工程学策略，诱骗个人泄露个人或企业信息和数据。\n\
  \n鲸钓攻击邮件和网站可以高度针对目标进行个性化定制，甚至包括目标的姓名、职位以及从各种来源收集的其他合法相关信息。\n\n术语 *鲸钓攻击* 旨在利用双关语，因为公司中重要人物和高级官员常被称为\
  \ *大鱼* 或 *鲸鱼*。\n\n在企业网络环境中，安全管理员可以通过强制要求企业高管和其他高级员工接受强制性的安全意识培训，来帮助防止成功的鲸钓攻击。遗憾的是，即使有先进的安全防护和意识培训，人们仍然会成为各类网络钓鱼/鱼叉式网络钓鱼/鲸钓攻击邮件的受害者。\n\
  \n## 语音钓鱼\n\n电子邮件并非攻击者试图愚弄个人以提供个人或敏感信息的唯一方法。攻击者还会尝试使用电话从某人那里套取信息。这种利用电话进行网络钓鱼攻击的方法称为\
  \ *语音钓鱼* (*voice-phishing*)。如果攻击者掌握了必要的信息，他们也可以使用这种方法冒充他人并开设新的信用额度。\n\n个人可以通过核实接到可疑来电的电话号码来挫败语音钓鱼尝试。如果有人接到电话，声称来自某个组织（如美国国税局），并要求其回拨并提供信用卡信息，该人应拨打该组织的客户服务电话来核实该请求，而不是回拨给那个可疑号码。\n\
  \n### 短信钓鱼\n\n*短信钓鱼* 或 *Smishing* 与其他网络钓鱼类型的攻击类似，不同之处在于它使用手机短信或 SMS 消息来引诱潜在目标。Smishing\
  \ 攻击旨在诱使个人回复欺诈性广告，以便稍后从潜在受害者那里获取信息。例如，Smishing 攻击消息通常会通过电子邮件从攻击者那里发送，且来源可能显示为电子邮件地址而非电话号码。\n\
  \n在大多数情况下，Smishing 攻击旨在寻找“活跃”号码，以便持续发送消息，并在某个时刻尝试以某种方式提取信息。防御 Smishing 攻击的最佳方法就是简单地不回复该消息，并向运营商举报。如果涉及某个应用程序，请检查该应用程序或网站。\n\
  \n### 域名劫持\n\n*域名劫持* 是一种类似于网络钓鱼的欺诈形式。在域名劫持中，即使用户输入了正确的网站地址，目标也可能被重定向到一个虚假网站。这最常见的是通过\
  \ DNS 缓存投毒攻击来实现的，如 图 5.10 所示，攻击者会将虚假数据引入 DNS 服务器解析器缓存中。\n\n![图 5.10 域名劫持](img/c05f010.png)\n\
  \n**图 5.10** 域名劫持\n\nISP 和主要 DNS 提供商会验证 DNS 响应，以确保它们来自权威来源。然而，许多组织选择运行自己的名称服务器，如果配置不当，它们可能会以这种方式被投毒。\n\
  \n域名劫持还可能涉及攻击者入侵合法网站并更改链接，将其用户重定向到欺诈网站。这甚至可能涉及入侵 *互联网注册商账户*，从而完全更改域名服务器。为注册商账户使用强且唯一的密码对于帮助防止此类攻击非常重要。\n\
  \n### 水坑攻击\n\n*水坑网络攻击* 是针对特定用户群体（如目标组织的成员）在他们可能访问的某个网站位置实施的攻击。这非常类似于狮子在猎物可能前来饮水的水坑附近潜伏。在这类攻击中，攻击者会感染目标用户已知常访问的一个或多个网站。攻击涉及设置网站，使其从网站向目标计算机下载恶意载荷，从而授予攻击者访问其网络的权限。\n\
  \n### 互惠利用\n\n*互惠利用* 是一个拉丁短语，意为“以物易物”。它通常在合同法实践中被提及，指代有价值的事物与另一有价值事物的交换。本质上，互惠利用意味着用一种商品或服务交换另一种。\n\
  \n在道德黑客攻击中，互惠利用的前提也可应用于社会工程学。基本上，攻击者会向社会工程学目标提供某种有价值的东西，希望目标能回报某种有价值的东西，例如敏感信息或对受限区域的访问权限。\n\
  \n这种技术常用于心怀不满的员工，例如因晋升或加薪被忽视的个人。有时，此类员工会接受社会工程师的提议，以报复心理损害其雇主。心怀不满的员工也可被称为 *内部威胁*，因为他们对其工作的组织构成威胁，并能“从内部”对该组织造成危害。已有许多案例显示，网络犯罪分子利用此技术诱导员工在其组织内部释放勒索软件。\n\
  \n### 数字侦察\n\n攻击链侦察阶段的另一个重要组成部分是执行 *数字侦察* 活动。这通常涉及枚举网络、执行漏洞扫描和执行端口扫描。这些工具和技术将在 第\
  \ 9 章 “ICS 安全评估” 中讨论。\n\n### 武器化\n\n完成所有侦察后，攻击过程将进入 *武器化阶段*。在此阶段，收集到的信息被应用于创建用于发动攻击的工具。具体而言，带有后门的\
  \ *漏洞利用代码* 会与 *恶意载荷* 相结合，以便投递给目标。这是杀伤链准备阶段的第二步，完成时间可能从几小时到几个月不等。\n\n洛克希德·马丁将武器化阶段定义为“将\
  \ *远程访问木马* *(RAT)* 与漏洞利用代码结合成可投递的载荷，通常通过一种称为 *武器生成器* 的自动化工具来实现。”RAT 只是授予攻击者对主机远程访问权限的后门，可用于执行各种操作。\n\
  \n在防御方面，洛克希德·马丁建议进行完整的恶意软件分析，以确定载荷是什么以及它是如何构建的。此外，扫描系统以查找武器生成器。检查恶意软件的创建日期以确定其存在多久，从而区分漏洞利用代码是旧还是新。这对于确定恶意软件的能力可能很重要。\n\
  \n### 投递\n\n如 图 5.11 所示，*投递阶段* 通过使用一种或多种不同的入侵方法将载荷传输到目标环境中来实现：\n\n\n\n## 电子邮件附件\n\
  \n## 受感染的闪存驱动器\n\n## 受感染的网站\n\n## 水坑攻击——被攻陷的网站\n\n## 社交媒体互动\n\n这是杀伤链入侵阶段的三个步骤中的第一步。\n\
  \n![图 5.11 有效载荷投递](img/c05f011.png)\n\n**图 5.11** 有效载荷投递\n\n在防御方面，杀伤链中的这一步代表了防御者阻止入侵的第一次机会。理想情况下，这是阻止高比例攻击的阶段。在此级别进行防御工作的关键是收集和分析电子邮件及\
  \ Web 日志，以便进行取证分析。特别是，您需要分析投递系统，并确定其在以组织资源为目标方面所扮演的角色。\n\n## 利用\n\n利用可以针对硬件或软件漏洞，但通常取决于人为漏洞。这包括受害者触发的利用，例如打开电子邮件附件或点击通向恶意软件利用的网站链接。\n\
  \n此类利用的常见 `attack vector`（攻击向量）涉及执行恶意软件，例如通过目标操作系统或其他应用程序中的漏洞执行武器化的远程访问木马（`RAT`），以激活利用。通常，这些\
  \ `RAT` 被用来在系统中创建后门，以便控制从管理任务（如添加用户）到关闭主机、记录击键，甚至开启网络摄像头等各种任务。\n\n如果您密切关注 Microsoft\
  \ 更新，会注意到其中许多是 Windows 以及 Microsoft Office 的安全更新。由于许多 `RAT` 嵌入在 PDF 和 Office 文件中，因此修补\
  \ Office 产品中的漏洞对 Microsoft 至关重要。请务必安装这些更新！\n\n此阶段常用的其他利用包括利用零日漏洞和针对服务器漏洞的攻击者触发型利用。零日漏洞是指软件制造商或普通网络安全人群尚未发现的漏洞。当攻击者发现这些漏洞时，他们能够利用它们，直到制造商为该漏洞发布安全补丁。\n\
  \n在杀伤链利用环节的防御方面，有三条大致的途径可循：\n\n*   人员网络安全培训。这延伸至针对管理员、管理人员、软件和 Web 开发人员以及员工的特定网络培训。\n\
  *   渗透测试并配合定期的网络漏洞扫描。\n*   端点加固工作。端点加固工具和方法在第 4 章“ICS 模块和要素加固”中有详细描述。\n\n## 安装\n\
  \n现在已经获得了访问权限，有必要建立与目标的持久连接。以上一节的示例为例，`RAT` 执行后，链中的下一步是在目标设备上安装后门或植入程序，以便攻击者能够保持对受攻陷系统的访问。他们还可能通过向系统添加服务来创建持久化点，以辅助其持久化方案。这是杀伤链入侵阶段的最后一步，所有这些通常只需几秒钟即可完成。\n\
  \n`RAT` 可以通过多种方式执行，但最简单的示例是创建一个打包为 `.exe` 文件的 `RAT`。由于 Windows 7 默认隐藏已知文件类型的扩展名，在文件末尾追加\
  \ `.doc` 可使其看起来像文档文件。运行该文件实际上会执行木马。\n\n此阶段的防御措施包括安装基于主机的入侵检测和预防技术，以检测并警报/阻止常见的软件安装路径。还必须审核端点进程，以检测异常的文件创建。端点审核在第\
  \ 10 章“ICS 安全监控和事件响应”中有详细介绍。\n\n## 命令与控制\n\n`高级持续性威胁`（`APT`）恶意软件通常需要攻击者手动与恶意软件交互，而大多数恶意软件是自动化的，无需攻击者采取任何行动即可将信息发送回攻击者。\n\
  \n因此，`APT` 恶意软件必须与 `命令与控制`（`C2`）`服务器` 建立双向连接，以建立所谓的 `C2 信道`。此 `C2 信道` 使攻击者能够直接与受攻陷主机交互，这会使威胁变得非常危险，因为攻击者可以对缓解威胁的尝试做出反应。\n\
  \n建立 `C2 信道` 后，攻击者可以从目标窃取知识产权；泄露机密电子邮件、公司记录和员工信息等敏感数据；或渗透并感染整个网络。\n\n然而，`APT` 行动的执行往往比其他类型的网络攻击复杂得多。它们通常始于更常见的攻击，例如\
  \ SQL 或跨站（`VSS`）攻击，以建立对目标的初始渗透。然后安装带有后门 Shell 的木马，以在攻击者和目标之间创建持久存在。\n\n杀伤链中的这一环节代表了防御者通过识别和阻断\
  \ `C2 信道` 来终止攻击的最后机会。该信道通常通过恶意软件分析方法来识别。\n\n## 目标行动\n\n完成前面的步骤后，攻击者可以执行各种目标，例如收集数据并将其发送回\
  \ `C2 服务器`。在我们讨论的许多攻击中，这是攻击者的主要目标之一。数据范围从信用卡信息到公司和政府的机密数据。\n\n此时，攻击已被归类为事件，必须启动组织的事件响应计划（`IRP`）。`IRP`\
  \ 的推进步骤如下：\n\n1.  启动事件响应团队（`IRT`），以识别和验证事件的性质。\n2.  采取措施遏制事件并限制影响范围。\n3.  对事件执行根因分析，以确定导致事件的源头。\n\
  4.  采取措施修复事件。\n5.  采取措施从事件中恢复。\n6.  利用经验教训更新 `IRP`，以防止未来发生类似的利用。\n\n该计划在第 10 章中有详细讨论。\n\
  \n## 攻击方法\n\n术语 `attack method`（攻击方法）和 `attack mode`（攻击模式）用于描述攻击者可能用于攻击资产（网络、计算设备、程序或数据）的方式或技术。以下部分介绍许多不同的攻击方法。\n\
  \n### 广播风暴\n\n当 `broadcast traffic`（广播流量）被每个网络设备重新广播时，持续的广播或 `multicast traffic`（组播流量）会迅速使交换机和路由器过载，并压垮网络。这种活动称为\
  \ `broadcast storm`（广播风暴）或 `network storm`（网络风暴），如图 5.12 所示。\n\n![图 5.12 广播风暴](img/c05f012.png)\n\
  \n**图 5.12** 广播风暴\n\n监控网络中的 `broadcast storms`（广播风暴）很重要。然而，确保网络正确配置也同样重要。如果网络节点直接与多个交换机通信，则查找表可能会混淆，导致数据包在段之间泛洪。这可能代表许多网络中的一个主要弱点。\n\
  \n拥有足够强大、能够快速移动数据并快速学习路由以满足组织需求的硬件也很重要。随着网络速度提升到千兆及更快，所有网络硬件都必须适应该数据速率，这一点变得越来越重要。\n\
  \n\n\n\n## 生成树协议与网络欺骗\n\n### 生成树协议\n\n虽然可以通过分割网络来最小化广播风暴的风险，但创建 `spanning-tree protocol`（`STP`，生成树协议）是为了解决这一问题。STP\
  \ 采用 `spanning-tree algorithm`（`STA`，生成树算法）来识别交换机可能与网络节点有多条通信路径，并管理最优路径，同时仍能回退到次要路径。任务关键型网络必须使用\
  \ STP 来最小化广播风暴。\n\n第 2 层设备采用一种名为生成树协议 (STP) 的协议，为多路径网络（如 图 5.13 所示）中的交换机提供无环路、冗余的链路。它通过配置交换机端口来实现这一点，使其根据所连接的段类型转发或阻塞流量。\n\
  \n![FIGURE 5.13 Multipath switch connections](img/c05f013.png)\n\n**图 5.13** 多路径交换机连接\n\
  \n### 欺骗\n\n字典将 `spoofing` 定义为“欺骗或恶作剧”。在网络安全领域，欺骗用于使设备看起来像另一台设备，且可以通过多种不同方式实现。许多网络漏洞侧重于以某种方式获取有效凭证。显而易见，攻击者伪造或欺骗网络身份并不难。`Masquerade\
  \ attacks`（伪装攻击）可能源于窃取的凭证、欺骗的 IP 或电子邮件地址，或两者兼有。如果攻击者能诱使用户泄露其凭证，他们就能获得该用户的网络权限。多因素认证措施（涉及你知道的、你拥有的或你本身的特征）可以降低伪装攻击的效率，但这些解决方案并不总是切实可行。\n\
  \n### IP 欺骗\n\n`IP header manipulation`（IP 头部操纵），或 `IP spoofing`（IP 欺骗），是一种通过更改\
  \ IP 或 TCP 网络数据包头部部分所含信息来隐藏网络身份的技术。此操作还用于执行多种其他攻击，如中间人 (MITM) 攻击和拒绝服务 (DoS) 攻击。\n\
  \n如果我们检查 图 5.14 中提供的示例 IP 头部，可以看到前 12 字节（顶部三行）数据包含关于数据包的各种信息，如长度、生存时间 (TTL) 和协议\
  \ (IPv4 或 IPv6)。接下来的 8 字节（第 4 行和第 5 行）包含源和目标 IP 地址信息。\n\n![FIGURE 5.14 IP header](img/c05f014.png)\n\
  \n**图 5.14** IP 头部\n\n使用互联网上可用的几种工具之一，攻击者可以轻松修改这些地址，特别是“源地址”字段，使其成为他们想要的任何内容。通过这样做，攻击者可以欺骗网络数据包的源地址，使其看起来像是来自与实际完全不同的位置。这可用于在攻击期间隐藏其身份，或者根据网络防御情况，可能用于从外部访问私有内部网络。\n\
  \n### 防御 IP 欺骗\n\n幸运的是，有几种相当有效的方法可以防御 IP 欺骗：\n\n*   在路由器处过滤网络流量\n*   实施加密和认证\n\n\
  在边界网络路由器上同时实施 `ingress`（入站流量）和 `egress`（出站流量）过滤是防御欺骗攻击的起点。应实施访问控制列表，如 图 5.15 所示，以便阻止私有\
  \ IP 地址（包括组织的内部 IP 地址范围）在下游接口通过。\n\n`downstream interface`（下游接口）是允许流量从互联网进入网络的接口。互联网是世界上最大的公共网络，因此没有正当理由允许私有和内部流量通过路由器的下游接口，因为这是攻击者试图绕过防火墙的常用手段。这也是创建\
  \ VPN 的原因。\n\n路由器的 `upstream interface`（上游接口）允许流量流向不同的子网或互联网。该接口应限制为仅允许来自组织有效 IP\
  \ 范围内的源地址通过。这有助于防止欺骗的网络数据包在互联网上传输。\n\n![FIGURE 5.15 Perimeter network protection](img/c05f015.png)\n\
  \n**图 5.15** 边界网络防护\n\n实施加密和认证也有助于防止欺骗攻击。这些功能包含在 IPv6 中，IPv6 旨在消除所有当前的欺骗攻击威胁。\n\n\
  网络内部还应消除基于主机的认证。基于主机的认证依赖信息（如 图 5.16 所示的 MAC 地址和主机名）向网络进行认证。这些信息不太安全，攻击者也可以轻易伪造。相反，应建立并通过安全的加密连接实施适当的认证措施。\n\
  \n![FIGURE 5.16 Secure authentication](img/c05f016.png)\n\n**图 5.16** 安全认证\n\n###\
  \ MAC 欺骗\n\n`MAC spoofing`（MAC 欺骗）如 图 5.17 所示，是前几章介绍的另一种常见欺骗技术。由于许多安全设备和软件依赖 MAC\
  \ 地址来控制对网络资源的访问，因此能够更改 MAC 地址非常方便。优秀的安全从业人员经常使用此技术来测试安全设备和其他防御措施。\n\n![FIGURE 5.17\
  \ MAC spoofing](img/c05f017.png)\n\n**图 5.17** MAC 欺骗\n\nMAC 欺骗可用于多种目的。然而，最常见的场景之一涉及使用欺骗方法来欺骗网络环境中用于连接互联网的硬件的\
  \ MAC 地址。ISP 通常使用 MAC 地址注册其自己的设备并允许访问其网络。\n\n如果客户购买了新的路由器/调制解调器设备并希望将其用于现有的互联网服务提供商，则必须向\
  \ ISP 注册该设备。客户选择不向 ISP 注册新设备的 MAC 地址，而是通过使用旧设备的地址代替新设备的地址来欺骗旧设备的 MAC 地址。通常，这违反了\
  \ ISP 与客户之间的 EULA（最终用户许可协议），并可能被视为非法行为。\n\n### ARP 欺骗/投毒\n\n要理解 `ARP spoofing`（ARP\
  \ 欺骗），也常称为 `ARP poisoning`（ARP 投毒），我们需要了解为什么需要 ARP 以及它是如何工作的。地址解析协议 (ARP) 用于将 IP\
  \ 地址映射到 MAC 地址。这样，设备就能通过第 2 层设备（如交换机）进行通信。当网络流量到达路由器时，它将使用帧中的 IP 地址信息将数据包从一个网络路由到另一个网络。\n\
  \n例如，设想一个简单的网络，其中两台设备仅由一台交换机隔开。第一台设备（我们称之为 Smith）的 IP 地址为 `10.0.0.10`，MAC 地址为 `AB:CD:EF:12:34:56`。它需要与第二台设备（称为\
  \ Jones）通信。我们恰好知道 Jones 的 IP 地址是 `10.0.0.20`。\n\n由于以太网段仅需使用物理 MAC 地址进行通信，我们需要确定\
  \ Jones 的 MAC 地址。\n\nSmith 将发送一个广播帧，其目标 IP 地址设置为 `FF:FF:FF:FF:FF:FF`。请记住，我们已经知道源\
  \ IP 地址 (`10.0.0.10`)、目标 IP 地址 (`10.0.0.20`) 和源 MAC 地址 (`AB:CD:EF:12:34:56`)。\n\n\
  \n\n\n当交换机接收到广播帧时，如图 5.18 所示，它会将该帧发送回连接到交换机的所有其他设备。Jones 将接收到该帧，并识别出该广播帧是发给它的，因此它会使用广播帧的地址作为目标地址，发回一个\
  \ `反向 ARP` (`RARP`) 帧。\n\n![FIGURE 5.18 ARP](img/c05f018.png)\n\n**图 5.18** ARP\n\
  \n你可能会想知道的下一件事是：“是什么防止了监听网络的人接收广播帧并发回伪造的信息。” 事实是，几乎没有什么防范措施！ARP 欺骗更常见的用例之一是中间人攻击。\n\
  \n### DNS 欺骗\n\n在计算机网络中，域名系统是一个分层的（即多级的）计算机命名系统，可以是集中式的，也可以分布在网络中，无论是私有网络还是公共互联网。DNS\
  \ 的主要职责是将域名（如 `exampledomain.net`）转换为这些域在网络中所在位置的实际 IP 地址。\n\n这样做的原因是域名比 IP 地址更容易让人类用户记忆。想象一下，如果每次想在互联网上通过\
  \ Google 搜索内容，你都必须记住并输入 `216.58.217.142`！你每天访问的所有其他收藏网站也是同理。\n\n如果用于上网的主机计算机不知道所请求域名的\
  \ IP 地址，它必须联系 DNS 服务器并请求其帮助查找，如图 5.19 所示。如前所述，DNS 由多个层级组成，所有层级负责域名的不同部分。\n\n![FIGURE\
  \ 5.19 DNS process](img/c05f019.png)\n\n**图 5.19** DNS 过程\n\n如果其中一台 `DNS 名称服务器`\
  \ (`NSs`) 不知道所有请求的部分，它会继续将请求推送到系统中的下一个更高层级服务器。此过程持续进行，直到请求的域名被完整组装并找到 IP 地址。为了加快此过程，当主机计算机收到所请求域名的\
  \ IP 地址时，它会将该信息存储在其本地 DNS 缓存中，以便下次请求同一域名时立即使用。\n\n假设 DNS 服务器从攻击者处接收到虚假信息，并将其缓存以供客户端系统未来请求使用。该\
  \ DNS 服务器现已被攻陷，被视为遭到投毒。因为 DNS 服务器被投毒，它会为请求的域名返回错误的 IP 地址，进而将流量发送到另一台通常属于攻击者的计算机。\n\
  \n攻击者可利用 DNS 欺骗向受害者发送欺骗性网站，例如虚假的银行网站或其他需要个人登录凭据以获取敏感信息访问权限的网站。这些页面通常设计得非常逼真，难以识别。\n\
  \n受害者将凭据输入登录提示后，网络数据包会被发回给攻击者，攻击者会收集受害者的凭据以备后用。视 DNS 欺骗的复杂程度而定，页面可能会实际将受害者重定向到他们最初寻找的合法网站和域名。或者，可能将他们转向其他预定域名。无论哪种情况，在受害者眼中这可能只是表现为一个“故障”。\n\
  \n尽管最初的 DNS 服务未作任何安全规定，但很快人们就发现它包含多个可被利用的漏洞。为缓解这些漏洞，开发了一套 `DNS 安全扩展` (`DNSSEC`)\
  \ 来保护 DNS 记录。这些扩展基于一个称为 `区域签名` 的过程，即将扩展添加到 DNS 协议中，以提供来源授权、数据完整性和经过认证的不存在证明。这使得\
  \ DNS 攻击（如 DNS 欺骗）难以实施得多。\n\n然而，恶意软件可利用 DNS 流量创建 DoS 攻击、执行命令与控制功能、从网络中窃取数据并执行 `DNS\
  \ 隧道`。在将 OT 网络和 IT 网络相互隔离时，许多管理员并不禁止 DNS 流量。这使得 `DNS 隧道` 可被用于利用 DNS 查询和响应（针对属于攻击者的域名）向网络内外发送数据。据估计，超过\
  \ 90% 的恶意软件依赖 DNS 来渗透和利用目标。\n\n虽然拒绝 OT 网络的所有 DNS 流量是缓解 DNS 相关风险最彻底的解决方案，但在某些情况下需要本地\
  \ DNS。在这些情况下，应将 DNS 配置为拒绝涉及外部域的 DNS 请求。\n\n另一方面，DNS 数据记录工作可用于分析模式并识别网络中的异常。这些技术在保护以极不安全著称的\
  \ SCADA 系统方面特别有帮助：其固件通常不安全，且其通信协议往往缺乏认证和加密组件。但所有连接 SCADA 的设备都必须拥有 IP 地址，这使得它们可以通过\
  \ DNS 过程进行监控。面向客户端的 DNS 防火墙/安全设备可用于监控活动、破坏攻击，并为基于 SCADA 的 OT 网络提供弹性。\n\n## 拒绝服务\n\
  \n`拒绝服务` (`DoS`) `攻击` 是旨在过度使用主机、服务器或网络资源，以使其功能上停止提供服务的攻击。拒绝服务攻击如图 5.20 所示。视攻击的确切性质而定，故障可能是暂时的，也可能是无限期的。`分布式拒绝服务`\
  \ (`DDoS`) `攻击` 涉及使用多个远程系统同时对目标资源发起攻击。\n\n![FIGURE 5.20 A denial-of-service attack](img/c05f020.png)\n\
  \n**图 5.20** 拒绝服务攻击\n\n### DoS 攻击与 DDoS 攻击\n\nDoS 和 DDoS 攻击特别令人头疼，因为它们非常容易实施，且没有办法完全使网络免疫于这些攻击。\n\
  \n最常见的 DoS 攻击类型涉及 `洪水攻击`，即用异常大量的\"垃圾\"外部通信请求（如 `ping` 命令生成的流量）淹没或过载目标服务器或其他网络资源。所有这些垃圾请求要么会将目标的响应速度拖慢到无法使用的地步，要么会阻止资源响应合法的网络流量资源请求。\n\
  \nDoS 攻击针对的实际资源可以是特定目标系统、该系统上的一个端口、计算机网络中的特定组件，或整个网络。DoS 攻击也可以设计为执行恶意软件，耗尽处理器等系统资源，这迟早会使任何系统瘫痪。DoS\
  \ 攻击的最终目标是迫使系统不再像攻击前那样响应合法请求，无论服务是被严重限制还是完全拒绝。\n\n大多数 DoS 攻击成本低廉且难以防御。由于其有效性，它们是脚本小子和技术熟练的黑客青睐的攻击类型。DoS\
  \ 攻击经常源于对另一个个人或组织怀有怨恨的个人或组织。\n\n\n\n\n## DoS 和 DDoS 攻击示例\n\n一个典型的例子是黑客组织 Anonymous\
  \ 据称在 2011 年对索尼发起的 DoS 攻击，导致索尼 PlayStation Network 服务中断一个月。2014 年，他们又遭遇了一次大规模 DoS\
  \ 攻击，黑客组织 Lizard Squad 和 FamedGod 声称对关闭其 PlayStation 和索尼娱乐网络负责。该攻击由网络时间协议（NTP）放大发起，产生的网络流量高达\
  \ 263.35 Gb/s。\n\n### DoS 与 DDoS 攻击对比\n\n如图 5.21 所示，DoS 攻击由一台攻击计算机和一个互联网连接组成，用垃圾数据包淹没服务器（或其他网络资源），试图耗尽其带宽和资源。然而，DDoS\
  \ 攻击使用*许多设备*和*多个互联网连接*来执行相同的过程，以期达到相同的目标。\n\n![图 5.21 DoS 攻击](img/c05f021.png)\n\
  \n**图 5.21** DoS 攻击\n\nDDoS 攻击通常在全球范围内分布，利用*僵尸程序*（*僵尸计算机*）形成所谓的*僵尸网络*。在这些攻击中，如图\
  \ 5.22 所示，一个被称为*僵尸网络控制者*的个体通过各种手段使这组分布式计算机陷入受控状态，以实施 DDoS 攻击。僵尸网络的规模各异，根据攻击范围，可从数百个到数千个，甚至数十万个僵尸程序不等。如前所述，这些攻击可以在互联网上以各种价格租用。\n\
  \n![图 5.22 DDoS 攻击](img/c05f022.png)\n\n**图 5.22** DDoS 攻击\n\n由于攻击系统数量庞大，DDoS 攻击比\
  \ DoS 攻击更难防御。\n\n### 泪滴攻击\n\n*泪滴攻击*是一种 DoS 攻击，向目标系统发送畸形（分片）数据包。旧版操作系统的 TCP/IP 重组机制存在漏洞，导致分片数据包重叠并使主机崩溃。在任何合理的近期操作系统版本或发行版中，此问题均已解决。\n\
  \n### Mirai 僵尸网络攻击\n\n最著名的 DDoS 攻击之一是利用 Mirai 僵尸网络针对全球许多最热门网站发起的。Mirai 僵尸程序旨在搜寻并感染互联网上成千上万个安装不安全的物联网设备，类型涵盖智能恒温器、安全摄像头和其他智能家居设备，以及视频游戏控制器。Mirai\
  \ 软件检查这些设备，寻找制造商默认的用户名/密码组合以获取访问权限。\n\n一旦在僵尸设备上建立了控制权，攻击者只需等待，便可针对目标发起 DDoS 攻击——目标是一个名为\
  \ Dyn 的组织，它是为 Twitter、Netflix、GitHub、HBO、Reddit、PayPal 和 Airbnb 等网站提供 DNS 服务的 ISP\
  \ 和域名服务商。这是一场多向量攻击，涉及来自 600,000 多台受感染设备的协调流量，产生的流量速率超过 1 Tb/s。攻击持续了七天。\n\n规模更大、时间更近的\
  \ DDoS 攻击瞄准了亚马逊云科技（AWS）和 Google Cloud Services 等知名高层组织。2020 年的 AWS 攻击持续了三天，流量速率达到\
  \ 2.3 Tb/s。攻击目标是运行易受攻击的连接技术的 AWS 第三方客户。Google Cloud 攻击的网络流量峰值达到 2.5 Tb/s，持续了三天。\n\
  \n## 拒绝视图攻击\n\n*拒绝视图攻击*，也称为*视图丢失*（*LOV*）事件，会造成操作员无法了解其处理系统或其某个组件的实际状态。在 DOV 攻击中，目的是导致操作员（或控制程序）采取不适当或潜在破坏性的行动。例如，如果攻击者将蠕虫引入系统以感染\
  \ HMI，导致操作员无法看到进程操作，则必须关闭进程、排查视图丢失问题，并将控制系统恢复运行。在美国，核电站曾发生此类事件，导致其停止生产，直到全面恢复控制后才能重新启动。\n\
  \n一种称为*视图操纵*（*MOV*）的类似事件并不隐藏进程状态，而是故意错误地表示它。同样，其意图是导致操作员或控制器采取不适当或危险的行动。例如，如果化学过程上的温度传感器被攻破，并向\
  \ SCADA 系统提供了不准确的值，操作员（或控制器）可能会尝试将温度调整到一个实际上不安全的值。这类活动的效果是使操作员或控制器成为控制场景中的实际攻击向量。\n\
  \n此类攻击也可针对 SCADA 系统的控制端发起。*拒绝控制*（*DOC*）和*控制丢失*（*LOC*）攻击或事件阻止操作员或控制器对关键系统采取纠正措施，从而失去对进程的控制。这些事件可能由网络攻击、组件故障或操作员活动引起。\n\
  \n## Ping 洪水攻击\n\n*Ping 洪水攻击*是最简单的 DoS 攻击之一。它利用一种名为 *ICMP* 的网络协议，该协议常用于测试从设备到网络的连通性。*Ping*\
  \ 和用于 IPv6 主机的 *ping6* 在许多操作系统中作为命令行工具提供，各种软件产品也提供此功能，通常与 traceroute 功能打包在一起。\n\n\
  在日常生活中，你可以使用 `ping` 命令向目标 IP 地址发送 *ICMP 回显请求*。如果收到来自目标地址的回复，你可以放心地假设你能够在网络上通信。不过，这是一个宽泛的假设，并不总是成立。\n\
  \nPing 可以很好地判断主机是否存活，以及你的网络与主机之间的连接质量。然而，ICMP 流量通常被视为低优先级流量，因此繁忙的网络可能会忽略它。\n\nPing\
  \ 有一些可用选项，例如调整数据包大小或不等待回复直接发送，这些可用于制造 *Ping 洪水*，导致 DoS 状况。这种 Ping 洪水肯定会消耗入站带宽。然而，如果网络回复\
  \ ICMP 请求，则出站带宽也会被消耗。\n\nPing 洪水攻击通过大量 ICMP 回显请求淹没受害者来实现。攻击者将发送启用了 flood 选项的 ping，这允许攻击者的网卡在发送另一个回显请求前无需等待受害者的回复。受害者的带宽随即被回显请求淹没，受害者尝试进行响应。理想情况下，入站和出站洪水流量的结合将破坏带宽并导致网络连接问题。\n\
  \n遗憾的是，也有可能恶意发送畸形的 ping 数据包。例如，旧系统无法处理大于 65,535 字节的数据包，任何超过该大小的数据包都会导致计算机崩溃。现代路由器应检查这些数据包的大小和分片，并强制执行规则，防止“死亡之\
  \ Ping”引发任何问题。\n\n\n\n\n由于可能会用 ping 请求淹没网络，ICMP 流量通常会被阻断。大多数防火墙设备可用于完全阻断此类流量。虽然在公共网络上通常允许\
  \ ICMP 流量是良好的做法，但出于多种原因，防火墙阻断本地网络的 ICMP 流量至关重要。事实上，对于大多数网络而言，将防火墙设置为不回复这些请求可能更为可取。\n\
  \n有许多工具可用于发起 ping 洪水攻击。其中之一是 `Low Orbit Ion Cannon (LOIC)`，这是一种基于 GUI 的工具，用于向指定目标发起非常有效的\
  \ ping 洪水攻击。该工具通常会被主机上的防病毒程序阻止，安装它需要设置豁免。\n\n### Smurf 攻击\n\n**Smurf 攻击**是一种用 ICMP\
  \ 数据包淹没网络的 DDoS 攻击。这种攻击在 ping 洪水攻击的基础上增加了反射特性。这种反射特性是通过在攻击中利用更多参与者（称为 **Smurf 放大器**）来创建的。\n\
  \n攻击者通过获取发送者地址（最初是攻击者的地址）并将其设定为受害者的地址来伪造一个 ping 请求数据包，如图 5.23 所示。然后，攻击者将目标地址更改为网络的广播地址。\n\
  \n![FIGURE 5.23 Smurf amplification](img/c05f023.png)\n\n**图 5.23** Smurf 放大\n\n\
  当攻击者发送 ping 请求时，网络上能够响应 ping 请求的 Smurf 放大器将使用受害者的 IP 地址作为目标地址进行回复。由于许多设备都在向受害者回复，受害者会被流量淹没，从而几乎瘫痪。\n\
  \nICMP 隧道也可用于传递恶意数据包。此处的最佳防御是配置网络设备不响应 ICMP 回显请求。另一种选择是直接阻断所有 ICMP 流量以及入站广播流量。\n\
  \n### UDP 洪水攻击\n\n**UDP 洪水攻击**是一种类似于 ping 洪水攻击的 DoS 攻击，它使用 **用户数据报协议 (UDP) 数据包**。由于\
  \ UDP 是无连接的，且缺乏 TCP 那样的错误检查能力，因此它不具备 TCP 的三次握手过程。\n\n在这种攻击中，攻击者会向受害者的随机端口发送大量 UDP\
  \ 数据包。由于这些数据包被发送到特定端口，受害者必须检查是否真的有应用程序在监听这些端口。\n\n当受害者发现没有程序在监听时，它将回复一个 ICMP 目标不可达数据包。在这种情况下，受害者将难以发回所有\
  \ ICMP 数据包，任何其他试图连接受害者的尝试都将被拒绝。此外，攻击者很可能会欺骗用于发送 UDP 数据包的 IP 地址以避免被发现。\n\n**Fraggle\
  \ 攻击**在概念和缓解措施上与 Smurf 攻击类似，只是它使用 UDP 数据包代替 ICMP。\n\n### SYN 洪水攻击\n\n**SYN 洪水攻击**是一种拒绝服务攻击形式，攻击者利用使用\
  \ SYN 和 ACK 消息建立两个主机间可靠连接的 TCP 握手过程。与 UDP 可以丢弃数据包而无需任何错误纠正不同，TCP 使用三次握手来确保消息被正确可靠地发送，如图\
  \ 5.24 所示。\n\n![FIGURE 5.24 SYN flooding](img/c05f024.png)\n\n**图 5.24** SYN 洪水\n\
  \n三次握手的工作原理如下：\n\n1.  客户端希望在自己和服务器之间建立连接。它向服务器发送一个 SYN 消息。\n2.  服务器收到消息并回送一个 SYN\
  \ 确认，表示为 SYN-ACK。\n3.  客户端随后通过向服务器发送一个 ACK 消息来响应 SYN 确认。\n\n在 SYN 洪水攻击中，攻击者利用三次握手过程。攻击者将向服务器发送大量\
  \ SYN 消息，每秒几十个甚至上百个。服务器试图跟上节奏并回送 SYN-ACK 消息给攻击者，但攻击者从不回复 ACK 消息。随后，当合法客户端想要连接服务器时，他们无法做到，因为服务器被\
  \ SYN 消息淹没，无法回复。\n\n因为这也可能看起来像网络拥塞，服务器通常会等待一小段时间再响应，希望拥塞能缓解。真正的恶意攻击将继续耗尽服务器资源，拒绝为其他客户提供服务。此时某些服务器可能会发生故障甚至崩溃。\n\
  \n根据所涉及的操作系统，有针对 SYN 洪水的有效对策。处理 SYN 洪水的一种方法是使用 **计算序列号** 而不是 **状态表**。不幸的是，这种计算可能非常消耗\
  \ CPU，因此这种技术通常涉及实施专用负载均衡器或专门设计用于处理 DoS 攻击的网络设备。\n\n现代防火墙也可以通过丢弃半开连接在一定程度上应对 SYN\
  \ 洪水。然而，大流量的 SYN 洪水通常仍会对网络性能产生明显影响。\n\n## 数据操纵攻击\n\n并非所有攻击都旨在窃取数据；有些仅旨在操纵数据以降低其完整性。许多网络安全专家认为\
  \ **数据操纵** 比传统的数据窃取或物理基础设施攻击是一个更大的问题。这类攻击破坏了组织、客户和政府对其所掌握数据的信心。最终结果是无法基于态势感知数据做出明智的商业决策或军事决策。\n\
  \n例如，Stuxnet 攻击的主要手段基于数据操纵而非窃取。该攻击篡改了伊朗离心机的运行速度数据，导致操作员不知道其系统的真实速度。因此，他们根本不知道离心机面临毁坏的危险。\n\
  \n随着物联网 (IoT) 和工业物联网 (IIoT) 市场在生活的方方面面（包括工业加工和公用事业运营）持续增长，基于数据操纵的攻击机会呈指数级增长。这包括传感器网络、住宅恒温器、胰岛素泵、交换设备等。\n\
  \n因为数据操纵攻击是隐蔽的、有针对性的攻击，且发生在前面描述的网络链的多个环节中，所以组织协调其网络安全工具以检测、调查和缓解网络中覆盖数据的企图非常重要。\n\
  \n## 会话劫持攻击\n\n在 TCP 会话中，身份验证通常仅在会话开始时发生。通常登录网站时会给用户一个 **会话 Cookie** 以标识其后续身份。如果攻击者能够嗅探此连接并获取会话\
  \ Cookie，他们就能访问该网站。这种攻击称为 **会话劫持**，如图 5.25 所示。\n\n![FIGURE 5.25 Session hijacking](img/c05f025.png)\n\
  \n**图 5.25** 会话劫持\n\n**点击劫持攻击**采用欺骗性框架技术，诱使用户点击其内容而非预期内容。这是一种在被黑网站上常用的伎俩，因为它易于实施且回报丰厚，如图\
  \ 5.26 所示。攻击者大多隐藏合法框架，使用户点击攻击者的框架。这常针对社交媒体框架进行。网页开发人员可以在其网页文档中添加少量防框架代码，但这也可能被绕过。\n\
  \n\n\n\n![FIGURE 5.26 Clickjacking](img/c05f026.png)\n\n**FIGURE 5.26** 点击劫持\n\n\
  虽然现代浏览器可防范*跨站脚本攻击* *(XSS)*，但无法完全防御此类攻击。此类攻击与其他许多攻击一样，需要一个被攻破的或以其他方式精心制作的恶意网页，如图\
  \ 5.27 所示。教育用户了解此风险，并手动登录社交媒体而非通过网页链接登录，会有所帮助。托管网页应定期使用诸如 `BeEF` 或 `Metasploit`\
  \ 之类的实用程序扫描此类漏洞，这些工具前文已有描述。\n\n![FIGURE 5.27 Cross-site scripting](img/c05f027.png)\n\
  \n**FIGURE 5.27** 跨站脚本攻击\n\n### 中间人攻击\n\n在中间人攻击中，攻击者监控网络，并根据预期攻击的性质执行不同活动。一种可能是攻击者使用\
  \ ARP 欺骗拦截本应发送给路由器的流量。当受害设备发出广播帧时，如图 5.28 所示，攻击者接收该帧并回送自己的信息，导致受害者误以为攻击者才是信息的真实目的地。\n\
  \n当受害者将信息发送给其预期目的地时，攻击者会接收并收集该信息，随后要么将其转发给真实目的地（这也是其被称为“中间人”的原因），要么回送虚假信息。\n\n![FIGURE\
  \ 5.28 Man-in-the-middle attack](img/c05f028.png)\n\n**FIGURE 5.28** 中间人攻击\n\n从道德黑客的角度来看，中间人攻击可产出大量信息，因为此类攻击可收集并重定向数据。例如，*Linux\
  \ 社会工程学工具包* *(SET)* 可用于复制一个网站，以协助收集访问该网站用户的凭证。SET 是 Kali Linux 中的预装工具，也可从 `https://github.com/trustedsec/social-engineer-toolkit`\
  \ 下载。也可在 Microsoft Windows 机器上安装 SET 工具。\n\n如果用户看到的似乎是他们打算登录的网站并输入了凭证，该虚假网站通常会将他们重定向到真实的登录页面。通常，用户会认为自己凭证输入有误，最终登录到真实网站。\n\
  \n与此同时，中间人已从虚假网站收集了他们的凭证，并利用这些凭证登录真实网站，破坏用户账户。使用 HTTPS 将提供安全通信通道，使攻击者无法收集用户凭证。尽管现代浏览器会在用户即将连接到\
  \ HTTP 网站时发出警报，但仍应培训用户留意识别 HTTPS 而非 HTTP。\n\n*中间人* *(MITM)* 攻击，或*消防队攻击*，是一种会话劫持类型，涉及拦截或嗅探并修改用户间的通信。可将其视为一种网络窃听形式。因此，攻击者通常与其他双方处于同一网络或广播域中，并将代理双方通信，在此过程中插入或篡改数据。在\
  \ SSL 连接中，攻击者可能使用 ARP 欺骗将流量引向攻击者，而非正常的网络路由器。\n\n### 外来软件\n\n你的软件里藏着什么？在生产软件中隐藏恶意内容的想法并不新鲜。你不难想象，商业软件公司可能提供掺杂了高级恶意软件的安全软件，这些恶意软件设计为在特定时间点激活。当然，该软件公司早已准备好恶意软件的“解药”，一旦其淹没安装了该软件的人员、企业和政府机构，便立即上市销售。\n\
  \n你也不难想象，政府和民族国家会与其本地软件生产商合作，在其商业产品中植入恶意软件。恶意软件可能潜伏不确定的时间，等待该政府的指令以执行攻击。\n\n例如，如果一个政府想确保在与另一国家发生敌对行动时拥有优势，他们可能会在为工业过程控制和公用事业市场开发的商业\
  \ SCADA 软件中植入特洛伊木马、后门或其他恶意代码。一旦敌对行动开始，嵌入软件中的攻击即可发动，从另一国家的“棋盘”上移除宝贵资产。2010 年针对伊朗核工业的\
  \ Stuxnet 攻击和 2020 年针对美国联邦机构的 SolarWinds 信息收集攻击，便是此类网络战略的典型案例。\n\n基于此原因，每个国家（及其工业和公用事业组织）都应将任何外国生产或受外国影响的软件视为潜在的国家安全威胁。从战略上讲，这意味着每个组织的采购流程必须评估外国生产软件相关风险，并与本国开发同类产品的经济性进行权衡。\n\
  \n在战术层面，建议由多名程序员对所有外来软件代码进行同行评审和测试。此外，应尽可能使用多种不同的扫描工具扫描这些软件包，以查找嵌入软件中的危险或不必要代码。Microsoft\
  \ 提供安全代码分析工具包，而 Snyk 在 `https://snyk.io` 提供免费源代码检查器。最后，在评估信息安全时，应强制执行行业标准，例如 ISO\
  \ 15408 *通用准则标准* (可在 `www.iso.org/standard/50341.html` 找到)。\n\n## 未授权访问\n\n*未授权访问*被定义为：使用未获许可的访问方法（如他人账户或攻击者创建的账户），获取对资产（建筑物、办公室、机器、服务器、网站、服务、文件夹或文件）的访问权限。在网络安全术语中，这也被称为*灰帽*或*黑帽黑客行为*。\n\
  \n未授权访问涉及外部和内部网络攻击方法。外部攻击涉及在网络上无合法权限的个人（尽管也涉及目标网络内部用户主动或被动串通发起的攻击）。最常见的外部访问攻击基于拥有或猜测有效用户的弱凭证、被盗凭证或丢失凭证。然而，基于通过恶意软件攻击获取的凭证的攻击也相当常见。远程访问、无线连接和调制解调器拨号攻击代表了另一种常见的外部访问攻击面。\n\
  \n另一方面，未授权内部访问攻击由拥有一定级别合法网络访问凭证的入侵者发起。这些访问可能由未获资产权限的 IT 人员、在网络中拥有高权限的非 IT 员工，或使用他人被盗凭证的合法人员发起。\n\
  \n本章以下各节将描述各种未授权访问攻击方法。\n\n### 密码攻击\n\n*密码攻击*均属于*密码破解*、*密码填充*和*密码重用*这些统称范畴。密码破解的目标是在原本不知正确密码的情况下，成功通过密码提示进行身份验证。密码攻击可使用不同方法以多种方式执行：\n\
  \n*   暴力破解攻击\n*   彩虹表\n*   密码捕获\n*   凭证填充\n*   密码喷射\n*   密码重用\n\n\n\n\n\n## 密码攻击与无线攻击\n\
  \n### 暴力破解攻击\n\n**暴力破解攻击**涉及使用工具（如 `John the Ripper`、`ophcrack` 或 `hydra`）针对用户登录运行密码列表。这些工具在企业环境中被合法用于测试员工密码，但攻击者也经常使用这些相同的工具进行同样的操作。\n\
  \n密码列表通常由各类安全人员生成，包含常用密码及其各种变体。在暴力破解攻击中，攻击者利用算力对提供的密码列表中的每个密码进行哈希计算。这可能耗费大量时间。因此，当预期目标使用短小、简单的密码时，这种攻击方法最为适用。\n\
  \n然而，**彩虹表**可提供一种更优雅高效的密码攻击方法。这些是预生成的表格，包含数百万个已哈希的密码。由于大多数主机系统都包含哈希密码文件，因此可以将其与彩虹表提供的哈希内容进行比对，以期找到匹配的密码。\n\
  \n### 密码捕获\n\n**密码捕获**，有时也称为**凭据收集**，是一个非常直接的过程。攻击者必须以某种方式在密码发送过程中将其拦截。一种常见的实现方式是通过中间人攻击或网络钓鱼。\n\
  \n此类攻击最常用的工具是本章前面所述的社会工程学工具包软件。如图 5.29 所示，该软件包含多种不同的模块，可用于执行不同类型的攻击。凭据收集模块使用简单。它通过克隆一个选定的热门网站（或使用提供的网站），然后利用\
  \ `Apache` 进行托管。\n\n![FIGURE 5.29 The Social Engineering Toolkit](img/c05f029.png)\n\
  \n**图 5.29 社会工程学工具包**\n\n当受害者被引导至攻击机器的 IP 地址时，他们将看到克隆的网站并输入用户名和密码，这些信息随即会显示在 SET\
  \ 终端上。随后软件会将他们重定向到实际网站，使其看起来就像只是密码输入错误。与此同时，攻击者已获取其用户名和密码，可随意利用。\n\n要进一步升级该攻击，可将凭据收集攻击与\
  \ DNS 投毒攻击结合，将网站的 DNS 查询定向至攻击机器。这种组合攻击可使用名为 **Ettercap** 的软件工具实现。\n\n在这种组合攻击中，受害者每当输入\
  \ `mywebsite.com`（或所用的任何网站）时，都会被定向至攻击者的网站。若不使用 Ettercap，攻击者就需要设法将攻击机器的 IP 地址提供给受害者。\n\
  \n### 字典攻击\n\n**字典攻击**就是一种系统性的暴力破解攻击，使用字典中的每个单词作为密码。互联网上有许多预编译的字典文件和彩虹表来源，提供可用于攻击目标的用户名/密码组合。某些黑客工具（如\
  \ `Kali Linux`）也提供准备好的用户名/密码列表，可编辑后直接针对指定目标使用。\n\n目前可用的最大此类列表是**多次泄露汇编**（COMB）数据库文件，包含超过\
  \ 32 亿组唯一的 UN/PW 凭据。这些数据收集自全球过去的账户泄露事件，约占当前全球在线人口的 70%。当然，厂商默认的 UN/PW 组合也包含在内，且人们会在不同账户间复用相同密码。该数据库还包含用于运行攻击、查询邮箱和管理数据的\
  \ `bash` 脚本。\n\n通过限制给定时间段内的登录尝试次数，即可轻松防御此类攻击。此外，可在该时段内禁止超过特定尝试次数的用户 IP 地址，直到管理员解除封禁。\n\
  \n击败字典攻击的另一种方案是强制实施严格的密码策略，要求密码不仅仅是字典单词。垃圾邮件发送者常利用此类攻击猜测电子邮件账户密码，以获取账户访问权限并用于垃圾邮件分发。\n\
  \n互联网上有一些公开网站（如 Cybernews 个人数据泄露检查器 `https://cybernews.com/personal-leak-check`），提供已知泄露凭据的信息。应定期查询这些网站，以确保当前使用的\
  \ UN/PW 组合未被泄露。\n\n如前所述，**会话劫持**是通过窃取用户合法互联网会话中的 Cookie 来获取其计算机未授权访问权限的方法。这些 Cookie\
  \ 用于向远程服务器验证计算机身份，并常规存储在用户计算机上以提供网页快速访问。\n\n攻击者可使用数据包嗅探器捕获网络传输中的 Cookie 来窃取。若能通过欺骗手段访问受害者\
  \ PC（使其误信接收的代码来自受信服务器），也可从中窃取 Cookie 信息。一旦攻击者获得 Cookie 信息，即可访问其他特权信息。\n\n使用多因素认证技术和工具，可确保即使攻击者持有\
  \ UN/PW 凭据也无法进入系统。此外，使用密码管理器可采用强密码凭据，从而有效管理用户。\n\n### 无线攻击\n\n由于通信方式的特性，**无线攻击**可能与有线网络攻击截然不同。用户必须将设备物理连接到网络端口才能接入有线网络，因此物理上靠近网络介质至关重要。而对于无线网络，这种物理邻近性则不那么重要。攻击者和合法用户一样，都可以坐在大楼前的停车场连接无线网络。\n\
  \n这种距离变量可通过各种创造性方法放大，例如使用**罐天线**（自制铁罐波导天线），如图 5.30 所示。该设备使无线客户端能连接到比 Wi-Fi 通信预期距离远得多的网络。攻击者可舒适地坐在车内，从安全距离发起攻击。\n\
  \n![FIGURE 5.30 Cantenna](img/c05f030.png)\n\n**图 5.30 罐天线**\n\n正如有线网络安全一样，无线网络安全至关重要。由于无线网络更容易遭到窃听和数据包捕获，加密和安全通信的需求更为迫切。此外，利用弱加密漏洞仅需几秒钟。以下章节将深入探讨无线通信常见的被利用方式。\n\
  \n#### 战争驾驶\n\n**战争驾驶**是在人口密集区域步行或驾车搜寻开放或弱加密无线网络的过程。这通常是道德黑客侦察阶段的首批活动之一。\n\n许多组织不太担心无线网络信号覆盖其建筑物和园区边界之外。\n\
  \n\n\n\n\n## 无线网络安全\n\n### 无线网络发现工具\n\n有许多可用的工具来捕获无线网络信息。这些工具包括软件，如 `NetStumbler`、`inSSIDer`\
  \ 和 `Kismet`，如图 5.31 所示。此类工具能够从无线网络捕获各种数据。此外，许多“寻网族”会向 `WiGLE` 等在线数据库贡献数据，这些数据库追踪并记录他们捕获的数据信息，其中最令人担忧的是某个区域内各个\
  \ `SSID` 所使用的加密类型。\n\n跟踪无线网络在公共场合能被发现多远非常重要。不幸的是，要防止网络信号泄漏到公共区域可能非常困难。不过，根据网络需要的安全程度以及所包含的信息类型，研究限制传输距离的方法以防止无线网络辐射过远可能是值得的。\n\
  \n“寻网”也是完全合法的。这相当于记录门牌号或收听广播电台。在大多数情况下，监听设备不会与网络通信；它们仅收集数据。也有人认为，如果你不想让你的网络信息被收集，你大概就不应该广播它！\n\
  \n![FIGURE 5.31 Kismet](img/c05f031.png)\n\n**图 5.31** Kismet\n\n### 非法接入点\n\n非法接入点可能是一个非常危险的漏洞。然而，在大多数情况下，它们并非蓄意恶意。当无线技术刚开始普及、尚不像现在这样随处可用时，非法接入点往往更为常见。\n\
  \n无法接入 `Ethernet` 端口（或在其位置需要多个 `Ethernet` 端口）的员工可能会被诱导设置非法接入点以方便工作，却不知应配置何种安全设置，也不知这违反了公司政策。\n\
  \n然而，有时非法接入点是由不法分子或渗透测试人员设置的，目的是入侵网络。例如，这些不法分子之一可能设法进入组织的空置会议室，并在他们的网络上设置一个非法接入点。然后，他们只需坐在停车场就能窥探网络、收集信息，或花时间尝试入侵工作站。\n\
  \n一旦攻击者进入网络，其可能性就变得无穷无尽。用户和网络都会遭到破坏，任何类型的攻击都可能发生，从 `DDoS` 攻击到利用各种漏洞。\n\n### WPA\
  \ 密钥破解\n\n为了将无线局域网安全受损的风险降至最低，`电气电子工程师学会` (`IEEE`) 组织在 `IEEE-802.xx` 旗下监督一组无线网络规范。`IEEE\
  \ 802.11x`（也称为 `Wireless Fidelity` 或 `Wi-Fi`）无线标准已被广泛接受，成为企业和住宅网络应用的首选无线网络技术。\n\n\
  使用它们传输个人或其他敏感信息存在许多安全问题。无线网络设备的传输无法简单地局限于住宅或企业的本地环境。虽然大多数无线网络设备的范围通常限制在几百英尺内，但 `RF`\
  \ 信号即使在声明的安全边界之外也很容易被拦截。任何未经授权的移动终端都可以使用 `802.11` 接收器做到这一点。\n\n无线网络安全最广泛使用的协议是 `Wi-Fi\
  \ Protected Access` (`WPA`) 标准、`WPA2` 标准 (`IEEE 802.11i`) 和 `WPA3` 标准协议。\n\n`WPA`\
  \ 协议旨在改进早期已变得易受破解攻击的 `Wi-Fi` 标准。它通过首先验证网络用户，然后提供更强大的加密技术来确保通过它传递的消息的完整性，从而实现了这一点。它是与\
  \ `802.11g` 和 `802.11i` 网络标准一起使用的协议。\n\n`WPA` 协议可以在 `WPA-PSK` 模式（又称 `Pre-Shared\
  \ Key` 或 `WPA-Personal` 模式）下运行。在个人模式下，预共享密钥或口令用于身份验证。`PSK` 选项允许 `WPA` 使用 `预共享密钥`，而不需要单独的\
  \ `证书颁发机构` (`CA`) 计算机来提供用户身份验证。`PSK` 允许在路由器上设置密码并与其他用户共享。\n\n`WPA2` 提供了一种更强的加密方法，其中加密密钥会自动更改（称为\
  \ `重新生成密钥`），并在 `指定的一段时间后`，或在传输了指定数量的数据包后，在设备之间进行身份验证。此方法使用一个口令（也称为 `共享密钥`），必须在无线接入点/路由器和\
  \ `WPA` 客户端中输入。从技术上讲，此共享密钥长度可以在 8 到 63 个字符之间，并可以包含特殊字符和空格。\n\n`WPA` 和 `WPA2` 都采用\
  \ `临时密钥完整性协议` (`TKIP`) 和 `IEEE 802.1x` `可扩展认证协议` (`EAP`) 进行数据加密，以为无线网络提供身份验证和安全性。此组合要求用户使用用户名和密码访问网络。用户登录后，`接入点`\
  \ (`AP`) 会生成一个临时密钥，用于加密 `AP` 和客户端设备之间的数据传输。\n\n`WPA` 和 `WPA2` 攻击基本上分三个步骤进行：嗅探、解析和凭证破解。在嗅探阶段，`Wi-Fi`\
  \ 传输会由无线网络适配器已配置为混杂模式操作的设备进行扫描。在解析过程中，扫描的数据由数据包分析器（如 `Wireshark`）处理，以检查传输数据包中的数据，寻找连接握手序列，特别是寻找包含\
  \ `PTK 认证` 信息的数据包（使用 `EAPOL` 过滤器）。四次握手过程如图 5.32 所示，展示了 `PTK` 密钥的交接。\n\n一旦找到密钥，你可以尝试解密它们，但这需要大量时间和计算能力。相反，黑客只需使用破解工具对密钥运行字典/暴力攻击。在\
  \ `Linux` 中可用的主要工具包括 `John the Ripper`、`Aircrack-ng` 或 `Pyrit/coWPAtty` 组合。在 `Microsoft\
  \ Windows` 环境中，`Aircrack-ng` 和来自 `Elcomsoft` 的 `Wireless Security Auditor` 套件是领先工具，但价格可能相当昂贵。\n\
  \n为了缓解此类活动并保护信息免受 `WPA2` 漏洞的影响，建议采用额外的加密方法，如 `HTTPS` (`SSL` 或 `TPS`)，为传输增加一层额外的安全性。用户在使用任何公共\
  \ `Wi-Fi` 网络工作时也应使用 `VPN`。无论使用 `HTTP` 还是 `HTTPS` 协议，`VPN` 都会加密所有数据。\n\n![FIGURE\
  \ 5.32 WPA four-way handshaking](img/c05f032.png)\n\n**图 5.32** WPA 四次握手\n\n此外，在所有无线客户端安装并认证后，将\
  \ `服务集标识符` (`SSID`) 广播选项设置为禁用，以防止外部人员利用 `SSID` 获取接入点的地址和数据。此外，将 `SSID` 名称从默认值更改为其他值。\n\
  \n如果在服务器机房等安全区域内使用无线网络技术，应采取额外的 `物理加固` 措施来保护机房安全。这可能包括对机房架构进行物理加固，例如对服务器机房的天花板、地板和墙壁进行电气隔离，以防止无线信号泄漏。这通常通过某种形式的\
  \ `法拉第笼` 或 `法拉第屏蔽` 来完成。\n\n\n\n\n\n## 最新的 WPA 版本 (WPA3)\n\n最新的 WPA 版本 (`WPA3`) 采用了一种名为\
  \ `Device Provisioning Protocol` (`DPP`) 的高级连接协议，该协议将连接过程自动化，使其不再依赖共享密码。相反，它使用一种称为**同时认证平等**\
  \ (`SAE`) 的技术，取代了 PSK 模式四次握手连接中使用的共享密钥。此注册过程发送网络注册指令，而无需传输密码。这些消息可以采用二维码或 NFC 标签的形式，以认证设备并授予其网络访问权限。\n\
  \nWPA3 的加密方式与 WPA 和 WPA2 有很大不同，使得 KRACK 攻击和字典攻击等旧式攻击方法失效。它使用 256 位 Galois/Counter\
  \ Mode Protocol (`GCMP-256`) 加密代码，将生成破解该代码所需的所有计算可能性所需的计算次数提高到超过 1 x10⁷⁷ 次。WPA3\
  \ 包含 384 位哈希消息认证模式加密，用于在密钥在路由器和连接设备之间传递时对其进行加密。\n\n## 802.11 信标泛洪\n\n无线接入点定期广播 `beacon\
  \ frames`（信标帧），让附近的客户端知道它们正在广播哪些网络。这些帧还包含无线设备连接到 AP 所需的相关信息，例如 SSID 和 `beacon intervals`（信标间隔），以及可用于将本地时钟设置为网络时间以进行认证的\
  \ `timestamps`（时间戳）。\n\n接入点采用信标间隔来确定信标之间的时间量。增加信标间隔会减少发送的信标数量。相反，减小间隔会增加发送的信标数量。\n\
  \n有许多工具可供黑客利用信标及其漏洞。其中一种工具是 `MDK3`。如 图 5.33 所示，该实用程序支持多种不同的攻击，包括信标泛洪和取消认证攻击，以及其他\
  \ DoS 攻击。\n\n![FIGURE 5.33 MDK3](img/c05f033.png)\n\n**图 5.33** MDK3\n\n`MDK3` 可以发起信标泛洪攻击，如\
  \ 图 5.34 所示，通过为某个网络广播伪造的信标数据包。例如，命令：\n\n```\nmdk wlan1 b -n mynetwork -n -t -c 6\
  \ -s 70\n```\n\n将导致 `mdk3` 对 `mynetwork` 发起信标泛洪攻击（`b` 标志），该网络是一个无线 N 网络（`n` 标志），在信道\
  \ 6 上使用 TKIP 安全协议（`-c 6`），并将以每秒 70 个数据包的速度发送（`-s 70`）。一旦发起攻击，尝试连接到 `mynetwork` 网络的设备将无法连接，直到攻击停止。\n\
  \n![FIGURE 5.34 Beacon flood attack](img/c05f034.png)\n\n**图 5.34** 信标泛洪攻击\n\n##\
  \ 802.11 取消认证泛洪\n\n另一种无线攻击类型是取消认证泛洪攻击，通常称为 `deauth attack`（取消认证攻击）。取消认证攻击涉及攻击者向接入点发送一个\
  \ `deauthentication packet`（取消认证数据包），进而将所有连接到该接入点的设备踢下线。有许多不同的工具可用于执行此攻击，如前所述的 `MDK3`，以及更常用的\
  \ `aireplay-ng` 工具。\n\n如果出于任何原因想阻止客户端连接到无线接入点，取消认证攻击会很有用。例如，经验不足的系统管理员可能会尝试将加密方式更改为安全性较低的方式，希望解决接入点的问题。另一方面，他们可能只是简单地禁用\
  \ AP。\n\n## 密码学\n\n`Cryptography`（密码学）是一个用于描述保护信息和为数据提供不可否认性的概念和方法的术语。许多密码技术涉及密钥的使用。密钥仅仅是一个用于加密或解密信息的数据字符串。密钥的使用方式以及字符串的长度都会影响加密的强度。\n\
  \n加密密钥可以基于仅为加密和解密数据的软件所知的“秘密”字符串，也可以是随机生成的。它也可能是已知因素和随机因素的组合。执行此加密或解密的算法称为 `cipher`（密码/加密算法）。密码可能是一次处理一个字符的\
  \ `stream cipher`（流密码），也可能是一次处理输入字符串的多个块的 `block cipher`（分组密码）。\n\n如果加密和解密使用相同的密钥，则称为\
  \ `symmetric key`（对称密钥）。如果加密和解密使用不同的密钥，则称为 `asymmetric keys`（非对称密钥），即使这些密钥是基于彼此生成的。图\
  \ 5.35 展示了两者的区别。\n\n![FIGURE 5.35 Symmetric vs. asymmetric keys](img/c05f035.png)\n\
  \n**图 5.35** 对称密钥与非对称密钥\n\n`Public-key cryptography`（公钥密码学）使用包含 `public key`（公钥）和\
  \ `private key`（私钥）（或 `secret key`（密钥））的非对称密钥。公钥和私钥是不同的，但私钥可以从公钥计算得出。相反，从私钥计算公钥几乎是不可能的。\n\
  \n这种密码学的强度显然与逆向工程这种计算的难度有关。初始认证过程通常涉及使用私钥处理某些凭据以生成数字签名。后续验证则通过将公钥与此签名进行处理来完成，以验证原始凭据或消息。\n\
  \n公钥密码学用于许多不同的加密协议和系统，包括以下内容：\n\n*   传输层安全和安全套接字层 (`TLS` 和 `SSL`)\n*   安全外壳协议 (`SSH`)\n\
  *   PGP (Pretty Good Privacy，优良隐私协议)\n*   GNU Privacy Guard (`GPG`)\n*   安全/多用途互联网邮件扩展\
  \ (`S/MIME`)\n*   数字签名标准 (`DSS`)\n*   RSA 加密算法\n\n`Symmetric-key cryptography`（对称密钥密码学）对加密和解密使用相同或易于转换的密钥。这些密钥被称为交易双方之间的共享密钥。对称密钥加密用于\
  \ `Advanced Encryption Standard` (`AES`) 加密、`Blowfish`、`RC4`、`3DES` 以及许多其他方案。\n\n\
  简单的流密码安全性较低，因此大多数方案使用 64 位或更高的分组密码。某些方案会通过提及其加密的分组大小（例如 256 位加密）来宣示其强度。原始明文输入也必须进行填充，使其成为分组大小的偶数倍。\n\
  \n对称密钥密码主要容易受到暴力攻击，攻击者根据已知列表或预测性数学方案系统地猜测密钥，因此认证方案应尝试识别这些活动并自动采取适当措施加以阻止。这通常意味着在一段时间内限制认证尝试的次数，这虽然会给用户带来不便，但却是一个必要的功能。\n\
  \n基于密钥的安全方案强度的另一个组成部分是密钥生成中使用的随机性程度。随机密钥可以通过称为 `pseudorandom key generators`（伪随机密钥生成器）的应用程序以算法方式生成。随机化器使用某种\
  \ `entropy`（熵）（或不确定性程度）作为随机化的种子。熵的程度可以测量，通常以位为单位，有时会在加密方案的强度分析中提及。\n\n理想情况下，熵的大小与密钥相同。该熵的来源通常是系统随手可得的数据的组合，可能经过某些乘数或代数方程的转换。例如，随机化器可能会将自过去某个时间以来的毫秒数除以进程\
  \ ID 并填充至指定长度，将这些组合起来。\n\n\n\n\n如果时间是以某种随机方式计算的（例如在 1,001 到 4,017 秒前之间随机选择），且进程\
  \ ID 难以被任何人预测，那么你将获得一个易于生成的随机密钥。某些密钥生成算法使用复杂的数学运算来转换密钥，但熵的核心在于某种伪随机数据源。\n\n最终，最好使用\
  \ 256 位分组密码的非对称密钥，其中密钥由高熵随机数生成器生成。如今，你不太可能经常看到这种情况。对于大规模系统，处理此类计算可能会消耗大量处理器资源，且此类方案的管理可能非常繁琐。\n\
  \n### 加密\n\n`Encryption`（加密）是一种工具，可用于确保如果静态数据被访问或动态数据被未授权方拦截，则无法读取。它正迅速成为保护任何网络几乎必需的步骤。Google\
  \ 在确保每个网页都使用安全加密进行服务和传输方面走在了前列。交换任何类型的财务或详细个人信息的银行和公司，自万维网早期以来就以某种形式使用了加密。\n\n加密无非是将电子数据转换为称为\
  \ `ciphertext`（密文）的形式。这涉及对数据应用秘密代码（密码）以生成乱码消息，如果不知道用于创建它的密码，就无法理解该消息。如果第三方可以轻松地以电子方式捕获密码，那么密码有多安全都无关紧要。\n\
  \n在互联网上，数据会经过许多你可能无法控制的节点。因此，以 `clear text`（明文）形式通过外部网络传输的任何凭据最终都可能落入错误之手。此类传输的发生在\
  \ IT 网络中已大幅减少，但可能仍存在于许多 OT 环境中。这种做法被称为 `packet sniffing`（数据包嗅探），如图 5.36 所示。在任何网络安全方案中，为凭据系统添加加密至关重要。\n\
  \n![图 5.36 查看凭据](img/c05f036.png)\n\n**图 5.36** 查看凭据\n\n任何密码机制都可以采用良好的安全技术。如果存在以下三个条件，则可认为该系统相对安全。\n\
  \n*   凭据绝不以未加密形式存储在任何地方。\n*   加密密钥或机密不存储在任何可被未授权人员访问的非安全位置。密钥存储必须受到保护，方式与存储、传输和备份中的任何其他敏感数据相同。\n\
  *   客户端与服务器之间的连接是安全且加密的。\n\n通过包含更多因素并添加物理因素（如指纹扫描或其他生物识别认证系统），可以使同一系统更加安全。\n\n如果你使用的基于凭据的访问系统未采用良好的安全技术，则必须了解与该活动相关的风险。如果风险极小，则仅要求强密码可能就能提供足够的安全性。\n\
  \n### 数字证书\n\n`Digital certificates`（数字证书），也称为 `public key certificates`（公钥证书），是发送加密消息的发送者就是其声称身份的数字验证。要获取数字证书，你必须向\
  \ `trusted certificate authority`（受信任的证书颁发机构，`CA`）申请。申请人必须创建一个私钥，并向 CA 提供 `certificate\
  \ signing request`（证书签名请求，`CSR`）。\n\n根据所涉及的证书类型，CA 将以某种方式验证你的身份，这可能只是验证该域上的电子邮件账户那么简单，但也可能涉及公开公司文件的验证，甚至个人面谈。\n\
  \n随后，CA 会颁发一个加密的数字证书，其中包含申请人的公钥，以及他们的 `digital signature`（数字签名）和过期日期。当申请人收到加密消息时，必须使用\
  \ CA 的公钥解密附加在消息上的 `digital certificate`（数字证书），并验证该证书是由 CA 颁发的。\n\n接下来，申请人使用 CA 的公钥和标识来加密回复，以表明他们信任此加密。最后，服务器使用其私钥解密响应，以获取将用于数据交换的对称公钥。此过程如图\
  \ 5.37 所示。\n\n![图 5.37 数字证书](img/c05f037.png)\n\n**图 5.37** 数字证书\n\n### 公钥基础设施\n\
  \n`Public Key Infrastructure`（公钥基础设施，`PKI`）支持这些公钥和证书的分发，以基于 CA 签名者的信息实现可信连接和安全数据交换。CA\
  \ 必须从更高级别的 CA 获取自己的证书。在此层级结构的顶端，必须有一个 `root certificate`（根证书）或 `self-signed certificate`（自签名证书）来标识\
  \ `root certificate authority`（根证书颁发机构）。这本质上是该组织的私钥。\n\n#### 证书管理\n\nWeb 浏览器等软件可能包含\
  \ CA 密钥以便于处理证书。但是，它们还应引用 `certificate revocation list`（证书吊销列表，`CRL`）或使用 `Online\
  \ Certificate Status Protocol`（在线证书状态协议，`OCSP`）来查询已吊销的证书。越来越多的浏览器正在采用 OCSP，但仍有一些提供商只是在每次浏览器软件更新时包含一个\
  \ CRL。\n\n`certificate chain`（证书链）是证书的列表，从根证书开始，随后是每个其他证书，其中一个证书的颁发者或签名者是下一个证书的主体。虽然一个证书只能有一个颁发\
  \ CA 签名，但由于可以使用同一个公钥创建多个证书，因此某些证书可能存在不同的证书链。\n\n安全证书应仅从已知且受尊敬的 CA 获取，否则你将面临证书被吊销的风险。CA\
  \ 正越来越多地推行 `Extended Validation`（扩展验证，`EV`）证书，其中实体的身份经过更广泛的验证。EV 证书在强度或结构上与其他证书类型没有区别，但它们意味着更高的信任度，因为被访问的网站归证书持有者所有。\n\
  \nWeb 浏览器通常会有某种视觉指示，表明 SSL/TLS 连接正在使用 EV 证书。这通常涉及使用绿色显示信息。EV 证书通常仅用于接受信用卡或其他私人数据的网站（而非处理电子邮件或其他服务的网站）。\n\
  \n可以生成并使用自签名证书进行加密。这对于测试很有用。但是，客户端软件通常会通知用户该证书不受信任。\n\n#### 密钥管理\n\n`Key management`（密钥管理）是基于密钥的细胞安全系统的关键组件。（注：原文\
  \ \"cytological\" 疑为 \"cryptological\" 即“密码学的” 之误，此处按原文直译）如果安全系统中涉及的密钥不安全，则系统本身也不安全。必须小心保护密钥在其整个生命周期内的安全，包括生成、分发、使用和退役期间。如果密钥在任何这些环节被窃取或复制，就会成为安全威胁。\n\
  \n与网络安全的所有其他方面一样，成功的密钥管理始于组织策略。组织必须建立策略，规定如何交换、存储、使用和退役密钥。NIST 网络安全框架标准要求此类策略建立并指定规则，为密钥和元数据提供\
  \ CIA 保护，以及验证这些项目的来源。\n\n\n\n\n\n## 密钥管理系统 (KMS)\n\n*密钥管理系统* (*KMS*) 应用程序为计算设备和应用程序的密钥创建、存储和分发提供集成管理功能。在服务器端，这些应用程序负责在整个系统中生成、分发和替换密钥。在客户端，它们负责存储和管理密钥。通过开源和专有渠道均可获得各种各样的\
  \ KMS 系统。这些应用程序为密钥从生成到退役和销毁提供端到端保护。\n\n## 哈希\n\n如前所述，在网络安全环境中，*哈希* 是一种加密技术，定义为将数学算法应用于一组数据以生成代表该数据集的数值。应用算法所得的值称为\
  \ *哈希值* 或 *哈希*。\n\n哈希不同于加密，因为其算法的设计旨在使转换过程不可逆地解构。它是一种单向转换。\n\n哈希用于提供多种安全相关功能，包括以下内容：\n\
  \n*   传输文件或消息的完整性验证\n*   密码验证\n*   文件识别\n*   工作量证明\n*   电子签名安全\n\n哈希的经典示例是运行算法为密码生成哈希，随后每次使用密码时都可重新生成该哈希以验证其真实性。将原始哈希放入\
  \ *哈希表* 可创建一种系统，其中实际密码永远无需被查看——只需将新哈希与旧哈希进行比较。\n\n哈希表只是一个查找表，它使用 *哈希函数* 将键映射到值，该函数将键转换为哈希值。无需按顺序搜索数据表以查找特定值，而是可对查找键执行哈希函数，这将返回正在搜索的哈希值的索引。这可以节省大量搜索数据的时间。\n\
  \n*分布式哈希表* *(DHT)* 是一种类似的功能，但键到值的映射分布在网络中不同节点之间。存储此映射的节点可通过哈希该键来找到。\n\n## 资源约束\n\
  \n*资源约束* 是指在可用工具条件下资源所能完成的工作的限制。资源可以包括资金限制、人员数量或能力限制，以及设备或物理基础设施能力限制。\n\n正如你所见，DoS\
  \ 攻击基于限制目标资源，且可通过多种方式实施：\n\n*   淹没网络连接设备以破坏连接并阻止用户访问\n*   消耗目标计算设备的资源（磁盘空间、内存、CPU\
  \ 处理能力或带宽）\n*   篡改设备配置设置\n*   注入计算或网络设备无法处理的数据\n\n## 复习题\n\n以下问题测试你对本章所呈现材料的掌握程度。\n\
