  \n封面设计：Wiley\n\n# 作者简介\n\n**Charles J. Brooks** 目前是 Educational Technologies Group\
  \ Inc. 的联合所有者兼副总裁，也是在线培训公司 eITPrep LLP 的联合所有者。他负责这两个机构的研究和产品开发工作。\n\nCharles 曾任国家教育公司的电子学讲师和技术作家，教授并编写了中等后\
  \ ETG 课程，包括电子学导论、晶体管理论、线性集成电路、数字理论基础、工业电子学、微处理器和计算机外设。\n\nCharles 撰写了多本书籍，包括七版《A+\
  \ 认证培训指南》、《计算机入门完整课程》和《PC 外设故障排除与维修》。他还撰写关于绿色技术、网络、住宅技术集成和 IT 融合方面的内容。\n\n过去八年里，Charles\
  \ 一直在美国及海外为网络安全教师进行演讲和讲师培训。他最近的项目涉及 IT 和 OT 网络安全课程及实验动手实践，包括《网络安全基础——概念与实践》、《网络安全基础——环境与测试》和《工业网络网络安全》。\n\
  \n**Philip A. Craig Jr.** 是 BlackByte Cyber Security, LLC 的创始人，这是一家致力于为美国关键基础设施开发新型网络安全工具和战术的咨询公司。他负责监督美国能源部\
  \ (DOE)、国防高级研究计划局 (DARPA) 和国家农村电力合作协会 (NRECA) 的研究和产品开发，并提供下一代信号隔离技术的专业知识，以保护能源发电、输电和配电系统中的自动化控制。Craig\
  \ 先生曾为核管理委员会 (NRC) 和北美电力可靠性公司 (NERC) 起草法规，并作为联邦合作伙伴关系中的活跃网络响应人员参与事件响应。\n\n# 技术编辑简介\n\
  \n**James R. McQuiggan**，CISSP，SACP，是 KnowBe4 的安全意识倡导者。加入 KnowBe4 之前，McQuiggan 在西门子工作了\
  \ 18 年，担任过多个职位，最近的是西门子歌美飒可再生能源公司的产品与解决方案安全官。在此职位上，他为各企业部门在网络安全标准、信息安全意识和产品网络安全方面提供咨询和支持。除了在西门子的工作外，McQuiggan\
  \ 还是瓦伦西亚学院工程、计算机编程与技术系的兼职教员。\n\n在中佛罗里达社区，他担任中佛罗里达 (ISC)² 分会会长，为网络安全专业人士提供教育和社交机会。\n\
  \n# 致谢\n\n**Charles J. Brooks**\n\n首先，我要感谢 Howard W. Sams 公司的前员工 Greg Michael，是他在\
  \ IBM PC 早期让我参与了微型计算机系统的写作。\n\n一如既往，我要感谢 ETG/Marcraft 的员工们，是你们让优质产品的推出变得轻松。特别感谢产品开发部的\
  \ Cathy Boulay 和 Luke Johns，感谢他们出色地完成了教材和实验手册的准备工作，使其内容充实、版面精美。\n\n\n\n\n\n此外，我要感谢戴尔电脑公司的\
  \ Brian Alley 以及 Philip Craig——前太平洋西北国家实验室（PNNL）成员，现为 BlackByte Cyber Security,\
  \ LLC 的所有者——感谢他们提供的专业知识和指导，使这组书籍及其配套的实验指南得以付梓。\n\n一如既往，我要感谢我的妻子 Robbie，感谢她对这些项目的所有理解、支持和帮助，同时也感谢\
  \ Robert、Jamaica、Michael 和 Joshua。\n\n**Philip A. Craig Jr.**\n\n我将此著作献给那些毕生致力于开发网络安全新方法、保护庞大计算基础设施免受恶意且有时致命的网络攻击后果侵害的同仁们。下一代网络守护者将从本书中获得重要价值，希望其内容能激发他们对未来几年我们将面临的网络挑战投入新的热忱。\n\
  \n我同时也将此成果献给我的妻子 Caralee，多年来她包容我长期滞留国家首都，主要是理解我对网络安全事业承诺的重要性。每年我们在 9 月 11 日庆祝她的生日时，都会被提醒这对我们日常生活意味着什么。\n\
  \n感谢 Marcraft 的领导层，他们的愿识别到了通过动手实践而非仅靠文本进行教学的价值，谢谢你们认可并实施了这种针对我们行业的方法。\n\n# WILEY\
