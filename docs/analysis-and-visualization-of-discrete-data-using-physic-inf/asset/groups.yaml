    \ (R Square): 0.993449\n- 调整 R 方 (Adjusted R Square): 0.99792\n- 标准误差 (Standard\
    \ Error): 0.01515\n- 观测值 (Observations): 4\n\n**方差分析表 (ANOVA Table)**\n\n| 来源\
    \ | df | SS | MS | F | P-value | F crit |\n| :--- | :--- | :--- | :--- | :---\
    \ | :--- | :--- |\n| 回归 | 5 | 0.03542 | 0.00708 | 2.32642 | 0.112296 | 2.7644\
    \ |\n| 残差 | 4 | 0.05265 | 0.01316 | | | |\n| 总计 | 9 | 0.08807 | | | | |\n\n图 2.18.\
    \ 回归分析的水位预测结果。\n\nExcel 宏是 Excel 中使用的一种程序。在 Excel 中，可以使用一种名为 VBA (Visual Basic\
    \ for Applications) 的编程语言创建宏。宏可用于自动化 Excel 中的重复性任务和操作，这在处理大量数据时非常有用。宏还可以用于扩展 Excel\
    \ 的功能。\n\n要创建宏，你需要学习 VBA。要学习 VBA，具备基本的编程知识会很有帮助。但是，即使从未学习过编程的人也可以通过逐步学习来创建宏。\n\
    \n要在 Excel 中使用宏，必须在设置中启用它们。步骤如下：\n\n- 从菜单中打开 [Developer] 并点击 [Macro Security]。\n\
    - 点击 [Macro Settings]。\n- 在宏设置中，选择 [Enable VBA macros]。\n- 点击 [OK] 按钮保存设置。\n\n\
    现在你就可以在 Excel 中使用宏了。\n\n注意：启用宏可能会导致你的计算机运行危险宏的风险。在启用之前，务必确认你要运行的宏来自可信来源。\n\n“Record\
    \ Macro”按钮在 Excel 安装后可能不会立即出现。如果是这种情况，请在 Excel 中启用宏，请遵循以下步骤：\n\n- 打开 [File] 菜单并点击\
    \ [Options]。\n- 从菜单中点击 [Customize Ribbon]。\n- 在“常用命令”列表中，选择 [Developer] 并按下 [OK]\
    \ 按钮。\n- 点击 [OK] 按钮保存设置（图 2.19）。\n\n要在 Excel 中录制宏，请遵循以下步骤：\n\n- 点击 [Developer]\
    \ 选项卡。\n- 点击 [Record Macro] 按钮。\n\n![](img/fa57e7010b16a211d5cf69ebb17e416e_65_0.png)\n\
    \n图 2.19. 如何启用宏。\n\n- (3) 录制开始。你的鼠标和键盘操作现在正在被记录。在 Excel 中执行你的任务。\n- (4) 要结束录制，再次点击\
    \ [Record Macro] 按钮。\n- (5) 出现“Record Macro”对话框。输入已录制宏的名称并点击 [OK] 按钮。\n\n你现在已经在\
    \ Excel 中录制了一个宏。\n\n注意：当你在 Excel 中录制宏时，会自动生成 VBA 代码以复现记录的操作。要运行已录制的宏，请转到 [Developer]\
    \ 选项卡，点击 [Macros] 按钮，选择已录制的宏，或者点击“Run Macro”按钮。\n\nVBA (Visual Basic for Applications)\
    \ 是一种用于 Microsoft Office 应用程序（Excel、Word、Outlook、PowerPoint 等）的编程语言。VBA 可用于自动化\
    \ Excel 中的重复性任务和操作。VBA 也可用于扩展 Excel 的功能。在 Excel 中录制宏时，VBA 会自动生成。但是，你也可以直接编写 VBA。通过直接编写\
    \ VBA，你可以创建更复杂、自定义的宏。要学习 VBA，具备基本的编程知识会很有帮助。但是，即使从未学习过编程的人也可以通过逐步学习来创建 VBA。\n\n\
    VBA 使用与 Visual Basic 类似的语法。VBA 的基本语法包括以下内容：\n\n- 变量：存储数据。它可以存储多种数据类型，包括数字和字符串。\n\
