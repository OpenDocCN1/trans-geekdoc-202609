    结构，并额外可视化 10 个误差与 NN 结构之间的关系。


    ## 4.1.4.1. 一维对流扩散方程


    对流扩散（AD）方程是物理和化学中用于数学建模物质、能量及其他物质流动的方程之一 [35]。该方程描述了物质和能量的流动，同时考虑了对流（流动）和扩散（弥散）。具体来说，对流方程描述物质的流动，而扩散方程描述物质的扩散。该方程在许多物理现象和工程应用中都有使用。通常，基本方程可以表示为：


    $\frac{\partial u}{\partial t} = \nabla \cdot (D \nabla u) - \nabla \cdot (\vec{v}u)
    + R \tag{4.8}$


    其中 $D$ 是扩散系数，$v$ 是对流速度。$R$ 是生成项。第一组实验使用空间一维 AD 方程。假设空间可以用一维表示，问题可以描述如下：


    PDE : $\frac{\partial u}{\partial t} + C \frac{\partial u}{\partial x} - D \frac{\partial^2
    u}{\partial x^2} = 0 \tag{4.9}$


    边界条件: $u|_{x=0} = u_{BC}; u|_{x=\infty} = 0$


    初始条件: $u|_{t=0} = u_0(x)$


    其中 $u_0(x)$ 是阶跃函数。这里，$C$ 是对流向量的 $x$ 分量。此问题的定义域为 $x, t \in [0, 10]$，为了评估结果的准确性，在上述方程中使用了边界条件设为
    $u_{BC} = 1$ 的精确解。


    $$u(x, t) = \frac{1}{2}\mathrm{erfc}\left(\frac{x-Ct}{2\sqrt{Dt}}\right) + \frac{1}{2}\exp\left(\frac{Cx}{D}\right)\mathrm{erf}\left(\frac{x+Ct}{2\sqrt{Dt}}\right)
    \tag{4.10}$$


    $$\mathrm{erfc}(x) = \frac{2}{\sqrt{\pi}}\int_{x}^{\infty}\exp(-t^2)dt$$


    其中 erfc($x$) 是互补误差函数。在此实验中，使用 $C = 1/2$ 和 $D = 1/14$。


    在 AD 方程的精确解中，对定义域 $x \in [0, 10]$ 和 $t \in [0, 10]$ 进行采样，并根据坐标值计算 $u(x, t)$，这被视为伪测量数据。对于这些数据，空间观测点数量为
    $n_x = 256$，时间观测点数量为 $n_t = 101$，数据集大小为 $n_d = 256856$。结果如图 4.3 顶部的彩色映射图所示。偏微分项候选库由四个偏微分项组成，其中包括正确的偏微分项


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_148_0.png)


    图 4.3. 使用扩展库的一维 AD 方程推导结果。


    （以粗体显示），如下所示：


    $$\Phi = \big[\boldsymbol{u}_{xx}; \boldsymbol{u}_{x}, u_{xxx}, u_{txxx}\big]$$


    首先，在 N10 中执行 AD 方程的推导。激活函数为 Sigmoid 函数 sigmoid (x)，训练的数据集数量在 $(n_{d} * 0.8)$ 个点中随机选取。NN
    误差最小的结果如图 4.3 中间的彩色映射图所示。图 4.3 下方的彩色映射图显示了 NN 模型与精确解之间的误差分布 $(\hat{u}-u)$。固定时刻的数据分布
    $\{u(x,t) \, | \, t = 2.5, 5.0, 7.5\}$ 也显示在误差分布下方。此外，图 4.3 的底部一行显示了推导出的 PDE，由于库中候选偏导项数量较多，表明推导误差不足。


    当库中的候选偏微分项仅限于原始 PDE 中包含的项时，推导误差会降低。也就是说，如果偏微分项候选库配置为 $\Phi = \big[u_{x}, u_{xxx}\big]$
    所示的形式，图 4.4 展示了精确解、NN 模型、误差分布、固定时刻的数据分布以及推导出的 PDE。


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_149_0.png)


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_149_1.png)


    | 类型 | 方程 |

    | :--- | :--- |

    | 正确的 PDE | $u_{t} + \frac{1}{2} u_{x} - \frac{1}{4} u_{xx}$ |

    | 识别出的 PDE (干净数据) | $u_{t} + 0.649396u_{x} - 0.001949u_{xx}$ |


    图 4.4. 使用最小库的一维 AD 方程推导结果。


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_150_0.png)


    图 4.5. 使用扩展库的 NN 结构和 $E_{\text{int}}$。


    图 4.5 和图 4.6 展示了在 N10 中计算 AD 方程近似解时 $E_{\text{int}}$ 的平行坐标图。


    ## 4.1.4.2. 一维 KdV 方程


    一维 KdV 方程是一种非线性偏微分方程，表示如下：


    $$u_t + \alpha u u_x + \beta u_{xxx} = 0 \tag{4.11}$$


    其中 $u(x,t)$ 是 $x$ 和 $t$ 的函数，$t$ 是时间，$x$ 是空间。此外，通过对各个变量和 $u$ 应用适当的尺度变换，系数可以重新计算为
    $\alpha = 6$，$\beta = 1$。这里，每个变量的偏导数可以表示为右下角的下标，


    $$u_t + 6uu_x + u_{xxx} = 0. \tag{4.12}$$


    KdV 方程描述浅水波等非线性波现象 [36]。该方程是 Korteweg-De Vries 方程的一维版本，用于描述非线性波现象。这里，非线性波现象是指当影响波传播介质的非线性出现时发生的现象。相反，线性波现象是指波对介质影响为线性的现象。


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_151_0.png)


    图 4.6. 使用最小库的 NN 结构和 $E_{\text {int }}$。


    该方程具有局部非线性和非局域色散，用于描述称为孤子的波的 nonlinear 现象。它也在量子场论、统计力学和数学物理中发挥重要作用。这里，色散是指波根据波长（或频率）具有不同速度的物理现象。


    具体来说，取决于波传播介质的性质，波长较短的波可能比波长较长的波传播得更快，或者波长较长的波可能比波长较短的波传播得更快。这种现象被称为色散。例如，在水中传播的波，其速度取决于波长。在浅水中，波长较长的波减速，当波接近岸边时波高增加。这是波色散的一个例子。色散在光学、声学和电磁波等各种物理现象中发挥着重要作用。色散现象在非线性偏微分方程的分析中也起着重要作用。包含色散项的方程可以描述波变形和波相互作用等现象。


    '
