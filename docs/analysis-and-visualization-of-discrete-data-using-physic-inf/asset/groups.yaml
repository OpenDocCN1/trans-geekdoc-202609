    displacement method and seems less likely to explicitly face PDEs. This section
    describes PDEs on stress analysis assuming a plane stress state.


    Stress analysis is used to understand the elastic response of structures. Elasticity
    refers to the ability of a structure to return to its original state after being
    subjected to load or deformation. The linear stress analysis problem described
    here applies to cases where loads or strains applied to a structure increase gradually.
    It also assumes that the stresses and strains applied to the structure increase
    linearly. In contrast, it can be shown that as the stress and strain applied to
    a structure increase, the response also increases. The linear stress analysis
    problem can be used to determine the stress concentration in a structure which
    corresponds the loads applied to the structure. This allows analyses of structural
    vibration and fracture.


    When solving linear stress analysis problems, the virtual work principle is often
    used in FEM [41]. FEM is a method for numerically analyzing physical systems on
    a computer. The physical system to be analyzed is divided into a finite number
    of elements, and the equilibrium state of the entire system is obtained by solving
    the local equilibrium equations for each element. In FEM, the virtual work method
    is used to find the equilibrium equations for each element. The equilibrium equation
    describes the equilibrium between the resultant and reaction forces in an element.
    The virtual work method is to find the forces applied to the element, compute
    the effect of those forces on the element, and check to see if the results of
    those computations are zero.


    In FEM, the virtual work method is used to solve local equilibrium equations.
    By combining those local equilibrium equations, the equilibrium state of an entire
    system can be obtained. For this reason, the linear stress analysis problems have
    not addressed PDEs.


    A linear stress analysis problem can be expressed as a PDE considering that it
    is described by three equations as follows:


    Equilibrium equation:


    ```

    $$ \begin{bmatrix} \frac{\partial}{\partial x} & 0 & \frac{\partial}{\partial
    y} \\ 0 & \frac{\partial}{\partial y} & \frac{\partial}{\partial x} \end{bmatrix}
    \begin{bmatrix} \sigma_x \\ \sigma_y \\ \sigma_{xy} \end{bmatrix} + \begin{bmatrix}
    f_x \\ f_y \end{bmatrix} = \begin{bmatrix} 0 \\ 0 \end{bmatrix} $$

    ```'
