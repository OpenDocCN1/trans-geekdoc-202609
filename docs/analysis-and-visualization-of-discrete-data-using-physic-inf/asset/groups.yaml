    #### 1.1.2. 名称框和公式栏


    Excel 中的名称框和公式栏（图 1.2）具有以下作用：


    - **名称框**：在 Excel 中，您可以为指定的单元格或区域命名。这称为命名。命名允许您指定单元格或单元格区域。命名的单元格或区域在 Excel 中被称为“名称”。通过指定命名的单元格或区域，您可以更高效地管理数据。Excel
    提供名为“名称框”的功能，允许您通过输入名称来指定命名的单元格或区域。

    - **公式栏**：在 Excel 中，您可以通过输入公式来计算数据。您可以在称为“公式栏”的地方输入公式。公式栏位于 Excel 状态栏中，用于将公式输入单元格。输入公式允许您高效地计算数据。


