    \quad \quad \quad \quad \quad \quad (4.40)$


    $u(x, 0) = f(x)$


    空间分布提供了一条线索，因此我们对等式两边应用傅里叶变换。$u(x, t)$ 是一个二元函数，但这次我们将对 $x$ 进行傅里叶变换。


    $U(k, t) = \frac{1}{\sqrt{2\pi}} \int_{-\infty}^{\infty} u(x, t)e^{-ikx} dx \quad
    \quad \quad \quad \quad \quad (4.41)$


    左边是 $\frac{\partial}{\partial t} U(k, t)$


    右边使用分部积分法进行变换。


    $\frac{1}{\sqrt{2\pi}} \int_{-\infty}^{\infty} \frac{\partial u}{\partial t} e^{-ikx}
    dx = \frac{1}{\sqrt{2\pi}} [u(x, t)e^{-ikx}]_{-\infty}^{\infty} + \frac{ik}{\sqrt{2\pi}}
    \overbrace{\int_{-\infty}^{\infty} u(x, t)e^{-ikx} dx}^{U(k,t)} \quad \quad \quad
    (4.42)$


    因此，$\frac{\partial}{\partial t} U(k, t) = (ik)^2 U(k, t)$


    $U(k, t) = Ae^{-k^2 t}$


    $U(k, 0) = \frac{1}{\sqrt{2\pi}} \int_{-\infty}^{\infty} f(k)e^{-ikx} dx$ 这意味着
    $U(k, 0) = F(k)$


    因此，


    $$\begin{aligned} U(k, t) &= F(k)e^{-k^{2} t} \\ u(x, t) &= \frac{1}{\sqrt{2 \pi}}
    \int_{-\infty}^{\infty} U(k, t)e^{ikx} dk \\ &= \frac{1}{\sqrt{2 \pi}} \int_{-\infty}^{\infty}
    F(k)e^{-k^{2} t+ikx} dk \\ &= \frac{1}{2 \pi} \int_{-\infty}^{\infty} dk \int_{-\infty}^{\infty}
    dx'' f(x'')e^{-k^{2} t+ikx-ikx''} \end{aligned}$$


    现在我们应用高斯积分


    $$\int_{-\infty}^{\infty} e^{-\frac{a}{2} x^{2}} dx = \sqrt{\frac{2 \pi}{a}} \tag{4.43}$$


    于关于 $k$ 的积分。指数函数的幂部分变为如下形式：


    $$\begin{aligned} -k^{2} t+ik(x-x'') &= -t \left(k-\frac{i(x-x'')}{2t} \right)^{2}-\frac{(x-x'')^{2}}{4t}
    \\ &= \frac{1}{2 \pi} \sqrt{\frac{\pi}{t}} \int_{-\infty}^{\infty} dx'' f(x'')
    e^{-\frac{(x-x'')^{2}}{4t}} \end{aligned}$$


    如果 $f(x)=\delta(x)$，则 $\int_{-\infty}^{\infty} dx'' \delta(x'')e^{-\frac{(x-x'')^{2}}{4t}}=e^{-\frac{x^{2}}{4t}}$，因此我们得到如下通解：


    $$u(x, t)=\frac{1}{2 \sqrt{\pi t}} e^{-\frac{x^{2}}{4 t}} \tag{4.44}$$


    这里，$\delta(x)$ 被称为狄拉克 delta 函数，其积分值为 1。


    ## 4.3.2. 偏微分方程的近似解


    获取偏微分方程（PDE）近似解的方法包括有限差分法（FDM）、有限元法（FEM）和粒子方法（PM）。在 FDM 中，通过用差分替换导数来获得近似解 [43]。相反，在
    FEM 中，通过将未知函数展开为已知函数的有限序列，并确定展开中引入的未知常数来获得近似解 [28]。在 FEM 中，使用加权残差法来确定未知常数。PM 是用于数值求解连续体上
    PDE 的一种离散化方法，其中待计算的对象被表示为粒子的集合 [44]。它主要用于流体和结构分析。特别是，在流体分析中，它属于拉格朗日乘子法范畴，具有无需计算对流项的特点。粒子方法设置了一个称为影响半径的参数。影响半径指的是用于查找给定位置局部物理量（如密度、压力梯度值、速度拉普拉斯等）的半径。通常用于统计该半径内的粒子数或对物理量进行加权平均。


    此处描述的利用神经网络（NN）求解 PDE 的方法与 PM 相似，因为它不需要差分网格或有限元。但它的显著区别在于，不需要设置影响半径来计算偏微分项。它与
    FEM 有一些共同点，即在感兴趣区域内的点评估 PDE 残差。通过解释表征 FEM 的加权残差，可以明确其与利用 NN 求解 PDE 方法的区别。


    为了说明加权残差法，本节考察如图 4.37 所示二维解析域 $v$ 中的稳态热传导问题。现在，该问题由以下方程定义 [27]：即，在边界条件 $u = 0$（在
    $s$ 上）下，求解控制方程：$\kappa (u_{xx} + u_{yy}) + Q = 0$（在 $v$ 中），其中 $u$ 是温度，$\kappa$
    是热导率，$Q$ 是单位体积的产热率。


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_186_0.png)


    现在，在域 \(v\) 中，未知函数 \(u\) 使用已知的函数序列 \(u_j\)，\(j = 1, N\) 进行如下近似：


    \[ u = \sum_{j=1}^{n} a_j u_j \tag{4.45} \]


    这里，务必选择在边界 \(s\) 上为零的 \(u_j\)，\(j = 1, N\)。


    \(u_j\) 被称为试函数，而 \(a_j\) 是未知常数。将方程 (4.45) 代入控制方程可得残差


    \[ R(x, y) = \kappa \left( \sum_{j=1}^{n} a_j (u_{j,xx} + u_{j,yy}) \right) +
    Q. \tag{4.46} \]


    如果试函数是稳态热传导问题的精确解，则残差 \(R\) 应该为零。然而，当未知精确解并试图获得近似解时，残差不可能为零。因此，加权残差法确定 \(a_j\)，使得残差在平均意义上为零。即，将残差
    \(R\) 乘以某个权重函数 \(w_i\) 并积分，设其为零。这在方程中表示为


    \[ \iint_v w_i R \, dv = 0, \quad i = 1, n. \tag{4.47} \]


    如果在该方程中使用 \(n\) 个不同的函数作为 \(w_i\)，方程 (4.47) 将变成 \(n\) 个线性方程的序列。可以选择各种权重函数 \(w_i\)，下面展示了两个典型的例子：


    - 配点法


    选择狄拉克 delta 函数作为权重函数。即，


    \[ w_i(\boldsymbol{x}) = \delta(\boldsymbol{x} - \boldsymbol{x}_i). \tag{4.48}
    \]


    然而，\(\boldsymbol{x}\) 是一个坐标向量。该函数具有如下性质：


    \[ \iint_v \delta(\boldsymbol{x} - \boldsymbol{x}_i) R \, dv = R(\boldsymbol{x}_i).
    \tag{4.49} \]


    因此，在此方法中，确定残差 \(R\)，使得残差在给定的 \(n\) 个配点处为零。随着 \(n\) 的增加，残差在更多点处为零，预计整个域最终将变为零。


    利用 NN 求解 PDE 的方法可以归类为配点法。在此处，在域 $v$ 中，在 NN 模型中，未知函数 $u(t, x, y, z)$ 使用已知的激活函数序列
    $\sigma_{i_{j+1}}^{j}(x)$，$j = 0, L$ 进行如下近似：


    $$u(t, x, y, z) = u_{1}^{L+1} = \sigma_{1}^{L}\left(\sum_{i_{L}=1}^{n_{L}} u_{i_{L},
    i_{L+1}}^{L}\sigma_{i_{L}}^{L-1}\left(\sum_{i_{L-1}=1}^{n_{L-1}} w_{i_{L-1}, i_{L}}^{L-1}\cdots
    \times \sigma_{i_{1}}^{0}\left(\sum_{i_{0}=1}^{n_{0}} w_{i_{0}, i}^{0}u_{i_{0}}^{0}\right)\cdots\right)\right)
    \quad (4.50)$$


    $-0$ 代表解释变量的数量，即 $\begin{array}{r} t = u_{0}^{0} \\ x = u_{1}^{0} \\ y = u_{2}^{0}
    \\ z = u_{3}^{0} \end{array}$。


    为了构建 NN 模型，确定权重 $w_{i_{j}, i_{j+1}}^{j}$，$j = 0, L$，使得残差在目标域内的点和边界上在平均意义上为零。由于与
    FEM 不同，它是针对整个域一次性确定的，因此该函数被恰当地命名为全局配点法（GCM）。


    ### 4.3.2.1. 有限元方法（FEM）


    Galerkin 法是 FEM 的关键技术之一，是加权残差法中最著名的方法，由俄罗斯工程师 Galerkin 提出。在此方法中，权重函数 $w_{i}$ 被设为与试函数
    $T_{i}$ 相同，即 $w_{i} = T_{i}$。该方法与变分直接方法密切相关，从某种意义上说，在 FEM 中很重要。


    为了获得 PDE 的近似解，了解偏微分项的求导是如何实现的至关重要。FDM 采用用差分替换偏导数的方法，如前所述，基本使用相邻网格的信息来计算差分。为了进一步提高精度，不仅使用相邻网格的信息，还使用超越相邻网格的信息。在
    FEM 中，通过增加单元中试函数的阶数来提高近似能力。在粒子方法中，通过增加影响半径来提高近似能力。这些方法是局部插值。相反，GCM 是一种全局近似。


    以下是在 Colab 中执行稳态传热方程有限元解法示例代码：


    '
