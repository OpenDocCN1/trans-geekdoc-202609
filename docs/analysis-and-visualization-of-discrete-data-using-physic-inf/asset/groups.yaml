    # 2.1.2. **Format of physical data**


    Before describing the analysis and visualization of geophysical data, the format
    of geophysical data needs to be explained. Roughly stated, the format is the physical
    quantity defined on the point cloud data. In this document, two types of physical
    data are assumed: The first is a physical quantity $u$ that is measured at a certain
    spatial location at a certain fixed time. A typical example is the data $u(t_i,
    x_j, y_j, z_j)$ obtained by a measurement device installed at a spatially fixed
    location $(x_j, y_j, z_j)$ at time $t_i$. If there are N determined time(s) and
    M spatially fixed location(s), the physical data are denoted as follows:


    ```

    $$u(t_i, x_j, y_j, z_j),\quad i=1,N,\quad j=1,M$$

    ```


    u is scalar data defined by discrete spatiotemporal points but can also be vector
    or tensor data, depending on the instrument used for the measurement. When $N
    = 1$ , it means discrete space data.


    The second is data obtained at a specific spatiotemporal location. A typical example
    is data obtained by a mobile device (such as a UAV). If there is (are) N determined
    spatiotemporal point(s), the physical data are denoted as follows:


    ```

    $$u(t_i, x_i, y_i, z_i),\quad i=1,N$$

    ```


    This N is called the number of observations.


    When given physical data, interpolation or approximation is used to compute a
    spatiotemporal model that explains these data well. Interpolation creates a function
    that always passes through the given discrete data, and a typical interpolation
    method is kriging. If the given discrete data are likely to contain noise, it
    does not necessarily explain the original discrete data well. To solve such problems,
    approximations are sometimes used. Approximation does not require passing through
    the given discrete data and determines a function with as low an error as possible.
    A typical approximation method is regression. NN is a type of approximation and
    has more explanatory power than basic linear regression.


