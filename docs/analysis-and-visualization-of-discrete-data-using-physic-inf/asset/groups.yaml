    例如，作为具有精确解的偏微分方程，如果我们关注以下三维平流-扩散方程，该偏微分方程变为：


    $$ u_{t}=-\varepsilon_{x} u_{x}-\varepsilon_{y} u_{y}-\varepsilon_{z} u_{z}+\varepsilon_{xx}
    u_{xx}+\varepsilon_{yy} u_{yy}+\varepsilon_{zz} u_{zz} \quad(4.3) $$


