    \ 工作表中。等高线可用于可视化数据中的趋势和模式。等高线还可用于识别数据中的变化和波动。\n\n## 2.5. 规划求解\n\nExcel 规划求解是 Microsoft\
    \ Excel 中包含的一种优化工具。Excel 规划求解可用于解决最优化问题，包括最小化、最大化和受约束的最优化问题。它还可以通过选择各种优化算法来解决多种问题。\n\
    \nExcel 规划求解提供三种方法（GRG 非线性、LP 单纯形法和遗传算法）。\n\nGRG 非线性 [20] 用于解决非线性最优化问题。GRG 非线性使用称为广义约化梯度（GRG）的方法来解决非线性最优化问题。该方法推断出几个最优解来解决一个问题，然后从中选择最好的一个。GRG\
    \ 非线性的特点是速度极快。另一方面，据说其解可能不精确。因此，如果你追求高精度，应考虑使用不同的算法。\n\n线性最优化问题是指最大化或最小化一个将变量与一个或多个系数线性组合的方程的问题。\n\
    \n例如，以下问题是一个线性最优化问题：找到 x, y 以最大化以下目标函数：\n\n$$z=3 x+4 y$$\n(2.18)\n\n找到满足以下约束条件的\
    \ x, y：\n\n$$x+y \\leq 10$$\n\n$$2 x+y \\geq 5$$\n\n$$x, y \\geq 0$$\n\n为了解决这个问题，通常使用优化方法来评估样本点，并使用这些点估算最优解。例子包括线性规划和单纯形法。\n\
    \n非线性最优化问题是指变量与系数非线性组合以最大化或最小化一个方程的问题。例如，以下问题是一个非线性最优化问题：\n\n找到 x, y 以最大化以下目标函数：\n\
    \n$z = x^{2} + y^{2}$                                                        \
    \                                  (2.19)\n\n找到满足以下约束条件的 x, y：\n\n$x^{2} + y^{2}\
    \ \\le 10$                                                         \n\n$2x + y\
    \ \\ge 5$                                                          \n\n$x, y \\\
    ge 0$                                                            \n\n为了解决这个问题，通常使用牛顿法或最速下降法。非线性最优化问题可能难以解决，因为可能没有解或有多个解。\n\
    \nLP 单纯形法 [21] 用于解决线性最优化问题。LP 单纯形法使用称为线性规划（LP）单纯形法的方法来优化变量的值，以满足目标函数和约束条件。LP 单纯形法的特点是速度极快。它也以其解的准确性为特征。另一方面，如果问题很复杂，应考虑使用其他算法。\n\
    \n线性最优化问题是指最大化或最小化一个将变量与一个或多个系数线性组合的方程的问题。\n\n例如，以下问题是一个线性最优化问题：找到 x, y 以最大化以下目标函数：\n\
