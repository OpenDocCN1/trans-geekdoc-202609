    # 2.7.6. *Line group data analysis using NN application examples*


    We have discussed the visualization of point cloud data using NN as an application
    example. Next, we would like to consider line group data as a visualization target.
    For example, when an appropriate starting point is placed in the flow field obtained
    from a fluid analysis, and massless particles are scattered along the flow field
    from that point, the curve created by the trajectory is called a streamline. By
    setting many starting points in the flow field, a group of streamlines can be
    generated. Sometimes, a display of the enveloping surface that encompasses this
    group of streamlines is required. The display of the enveloping surface is required
    not only for velocity vectors in fluid analysis but also for principal stress
    vectors in structural analysis, magnetic flux density vectors in electromagnetic
    field analysis, and so on.


