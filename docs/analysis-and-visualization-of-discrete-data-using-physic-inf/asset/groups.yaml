    偏导数项是通过前述的自动微分方法从神经网络（NN）模型中获得的。在本课程中，神经网络模型是使用 Google TensorFlow 构建的。TensorFlow
    是一个用于使用机器学习方法（如神经网络 NN 和优化技术）的平台。在这里，我们使用 TensorFlow 中的 GradientTape 库来计算神经网络模型的偏微分项。


    接下来，选择构成偏微分方程（PDE）所需的本质偏导数项。对于神经网络模型，使用自动微分（AD）构建正则化回归方程（RRE）。如果作为偏微分方程，一阶时间偏导数表示为空间偏导数项的线性组合，那么在给定的
    $N_u$ 个时空坐标中的关系通过以下回归方程表示：


    $$ \mathbf{u}_t = \mathbf{\Theta}\boldsymbol{\varepsilon} $$


    其中 $\mathbf{u}_t$ 是由一阶时间偏导数值组成的向量，$\mathbf{\Theta}$ 是由各水平上的空间偏导数值组成的矩阵，$\boldsymbol{\varepsilon}$
    是其空间偏导数值的系数。$\Theta$ 是测量点的数量，即时空坐标的数量 $N_P$。关于在这个回归方程中包含多少时空偏导数候选项并没有明确的标准。因此，利用能够有效应用专家知识的可视化分析至关重要。接下来，向该回归方程添加约束以构建
    RRE。RRE 的一个特征是，在偏导数项的选择过程中，不必要的偏导数项会被自动消除，从而允许选择本质的偏导数项。由于在构建神经网络模型期间 RRE 的值不会变为零，因此这被称为
    RRE 误差（$E_{\mathrm{RRE}}$）。


    $$ E_{\mathrm{RRE}} = \frac{1}{N_P} \| \mathbf{\Theta}\boldsymbol{\varepsilon}
    - \mathbf{u}_t \|_2^2 + \lambda \frac{1}{N_{\boldsymbol{\varepsilon}}} \| \boldsymbol{\varepsilon}
    \|_2^2 \quad \text{(4.1)} $$


