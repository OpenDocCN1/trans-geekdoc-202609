    Next, the partial differential terms that make up the PDE are computed. For the
    NN model, the PDE is constructed using AD. If, as PDE, the first-order time partial
    derivative is expressed as a linear sum of spatial partial derivative terms, the
    regression equation in the following first expresses the relationship in $N_{P}$
    space-time coordinates sampled in the domain in which a solution is to be found:


    ```

    $\bm{u}_{t} = \boldsymbol{\Theta}\bm{\varepsilon}\tag{4.51}$

    ```


    where $\bm{u}_{t}$ is a vector consisting of first-order time partial derivative
    values, $\boldsymbol{\Theta}$ is a matrix consisting of spatial partial derivative
    values at each level, and $\bm{\varepsilon}$ is the coefficient of their spatial
    partial derivative values. $\bm{u}_{t}$, $\boldsymbol{\Theta}$ is the number of
    measured points, that is, the number of space-time coordinates $N_{P}$. Unlike
    the PDE derivation, $\bm{\varepsilon}$ is a constant, not an unknown number. The
    vector consisting of the residuals $\bm{R}$ computed at each coordinate point
    is


    ```

    $\bm{R} = \bm{u}_{t} - \boldsymbol{\Theta}\bm{\varepsilon}.\tag{4.52}$

    ```


    Next, the PDE error ($\mathrm{MSE}_{\mathrm{PDE}}$) is computed from this residual
    vector.


    ```

    $E_{\mathrm{PDE}} = \frac{1}{N_{P}}\|\bm{R}\|_{2}^{2} = \frac{1}{N_{P}}\|\bm{u}_{t}
    - \boldsymbol{\Theta}\bm{\varepsilon}\|_{2}^{2}\tag{4.53}$

    ```


    To evaluate a method to find a solution to PDE, it is important to define the
    error. As errors, the NN model errors ($E_{u}$) and PDE errors ($E_{\mathrm{PDE}}$)
    described previously can be used. We will define the integrated error $E_{\mathrm{int}}
    = E_{u}^{*}E_{\mathrm{PDE}}$ as in the PDE derivation.


