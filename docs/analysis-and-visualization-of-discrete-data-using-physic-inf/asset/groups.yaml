    \ $+0.007119v_{xx}+0.649728v_{yy}-0.009920v_x-0.004846v_y+0.91f/E=0$ |\n\n图 4.27.\
    \ 使用扩展库进行二维应力方程推导的结果。\n\n固定时刻的数据分布 $\\{u(x, y) \\mid y = 0.25, 0.5, 0.75\\}$ 也展示在误差分布下方。此外，图\
    \ 4.27 的底行展示了推导出的 PDE，但由于库中候选偏导项数量过多，推导误差不足。\n\n当将库中的候选偏微分项最小化至仅包含精确项时，推导误差得到改善。也就是说，如果将偏微分项候选库配置为如\
