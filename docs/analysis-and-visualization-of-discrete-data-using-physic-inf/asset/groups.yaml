    目前尚未有研究提出利用物理信息神经网络（PINNs）技术来提高代理模型精度的方法。在以往的代理建模中，预测位置是预先确定的。


    例如，在第 1 章第 1 节中，创建了一个开关磁阻电机（SRM）中定子的数值流体分析模型，并介绍了一个通过改变设计参数来预测定子温度的代理模型。在温度预测方面，该代理模型能够推导出一个可以即时计算且误差小于
    4.2% 的温度代理模型。同时，预测定子以外区域温度的能力仍然是未来需要实现的目标。另一家公司开发了一种有限元模型，用于预测空调压缩机中爆破片的强度，并提出了一种基于物理的代理模型，用于在设计参数变化时预测爆破片的强度。结果表明，该代理模型的强度预测速度比执行基于物理的分析快
    1,000 倍以上。然而，除了灵活性之外，保证物理有效性仍是未来的挑战。


    通过本研究将开发的基于物理并使用 PINNs 的代理建模技术，预计将在社会中得到应用。具体示例描述如下。一旦确认基于物理的代理建模技术在模拟特定城市街区热环境（这需要大量计算时间）方面的有效性，预计该技术将有助于在城市、国家和全球范围内应对全球变暖的减缓和适应措施。全球变暖对策可大致分为减缓措施（即减少温室气体这种全球变暖因果物质的排放）和适应措施（即通过调整自然生态系统和社会经济系统以应对气候变化，从而控制全球变暖的不利影响）。减缓措施通常通过控制大气中温室气体浓度来控制对自然系统和人类系统的影响。另一方面，适应措施的特点在于直接控制全球变暖对特定系统的影响。


    本节重点验证了辐射冷却材料在控制热问题方面的有效性这一案例 [48]。当太阳热量到达地球时，地球会将热量辐射回太空，但部分热量会被温室气体吸收，从而增加气体的能量并导致温度升高。这种辐射材料试图将地球的热量通过大气层作为窗口释放到太空中，预计将成为应对全球变暖的适应措施
    [50]。


    此处描述的代理模型可用于“假设分析”（what-if analysis），这在政策制定中至关重要。具体而言，它能够即时可视化关于在何处采取何种控温措施能降低夏季平均气温的可靠结果。它还可以即时可视化河水位与堤防决堤可能性之间的变化关系。为了在政策制定会议上有效利用代理模型进行数据可视化，有必要设计一个便于市民使用的用户界面。在设计用户界面时，需提前对市民进行访谈，以确定其应有的形态。


    ## 第 6 章


    ## 结语


    本书通过具体案例解释了使用神经网络（NNs）分析和可视化物理数据的方法。第一部分涵盖了与时间无关的空间离散数据，并解释了以下内容：


    - (1) 使用三维 CT 机获取的古代文献数据中的页面信息。

    - (2) 解释了一种从聚变堆电磁场分析结果计算的磁场组中，高精度可视化等离子体区域的方法。随后，利用物理数据解释了以下内容：

    - (1) 使用 NN 推导解释其物理数据的 PDE（偏微分方程）的方法。

    - (2) 如何使用 NN 求解 PDE。


    我们 hoped 本书能为读者解决问题提供启发。现在，我们想通过建议该领域未来的研究方向来结束本书。


    在本书中，我们描述了如何使用 NN 从给定的边界条件物理数据中寻找 PDE 的解。根据开头的定义，物理数据由数据定义所在的时空坐标以及与这些坐标相关的物理数据组成。PDE
    求解方法目前正与常规方法（FDM、FEM、PM 等）进行比较，以确定其归类。但考虑到使用 NN 模型的优势，我们认为未来的方向是将此方法应用于代理模型，因为代理模型最近在计算工程中得到了更广泛的利用。


    在计算工程中，当感兴趣的结果难以轻易计算时，会使用代理模型 [46]。大多数工程设计问题需要数值模拟来评估作为设计变量函数的目标函数。例如，为了找到飞机的最佳机翼形状，工程师会计算各种形状变量（如长度、曲率和材料）下机翼周围的气流。然而，对于许多实际问题，单次数值模拟可能需要几分钟、几小时甚至几天才能完成。因此，诸如设计优化、设计空间探索、敏感性分析和假设分析等常规任务变得难以执行，因为它们需要成千上万甚至数百万次数值模拟评估。减轻这一负担的一种方法是建立近似模型，即代理模型。在过去几年中，使用
    NN 的代理模型被广泛使用。但这些只是不参考描述目标数值模拟的 PDE 的简单近似模型，有时会对确保物理准确性产生担忧。为了找到代理模型的未来方向，需要考虑如何深化其与
    PDE 的关系。


    假设现在运行带有各种边界条件的数值模拟，获取感兴趣区域的物理数据，将边界条件输入 NN 输入层，并将物理数据输入 NN 输出层以构建 NN 模型。当给定未知边界条件时，该
    NN 模型将能够预测物理数据，而不受解释数值模拟的 PDE 影响。这就是当今常用的常规代理模型（见图 6.1 左下角）。除了边界条件，输入获取物理数据的时空坐标所创建的
    NN，可以从任意的时空坐标和边界条件预测物理数据。这被称为高可扩展性代理模型（见图 6.1 下部）。它确实更具可扩展性，但物理有效性仍未被触及。


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_222_0.png)


    图 6.1. 基于物理的代理模型。


    我们在这里提出的问题是：我们是否可以在构建代理模型的过程中 incorporate PDE 残差，以提高代理模型的物理有效性？这个问题有几个答案，但使用 PINNs
    是实现这一目标的一种可靠方法。通过使其学习多种边界条件而创建的 NN 模型，可以提供一个可以指定任意边界条件数据的地方，并且可以保证物理有效性，从而产生所谓的“高精确度”代理模型（见图
    6.1 右下角）。


