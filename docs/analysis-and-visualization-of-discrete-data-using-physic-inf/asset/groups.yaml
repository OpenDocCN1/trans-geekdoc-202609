    # 2.5. Solver


    The Excel Solver is an optimization tool included in Microsoft Excel. The Excel
    Solver can be used to solve optimization problems, including minimum, maximum,
    and constrained optimization problems. It can also be used to solve a wide variety
    of problems by selecting from various optimization algorithms.


    The Excel Solver offers three methods (GRG Nonlinear, LP Simplex, and Evolutionary).


    GRG nonlinear [20] is used to solve nonlinear optimization problems. GRG nonlinear
    solves nonlinear optimization problems using a method called Generalized Reduced
    Gradient (GRG). This method infers several optimal solutions to solve a problem
    and then selects the best one among them. GRG nonlinear is characterized by being
    extremely fast. On the other hand, it is said that the solution may not be exact.
    Therefore, if you seek high accuracy, you should consider using different algorithms.


    A linear optimization problem refers to the problem of maximizing or minimizing
    an equation that linearly combines a variable with one or more coefficients.


    For example, the following problem is a linear optimization problem: Find x, y
    that maximizes the following objective function:


    $$z=3 x+4 y$$

    (2.18)


    Find x, y that satisfy the following constraints:


    $$x+y \leq 10$$


    $$2 x+y \geq 5$$


    $$x, y \geq 0$$


    To solve this problem, optimization methods are usually used to evaluate sample
    points and estimate the optimal solution using those points. Examples include
    linear programming and simplex methods.


    Nonlinear optimization problems refer to problems in which variables are combined
    nonlinearly with coefficients to maximize or minimize an equation. For example,
    the following problem is a nonlinear optimization problem:'
