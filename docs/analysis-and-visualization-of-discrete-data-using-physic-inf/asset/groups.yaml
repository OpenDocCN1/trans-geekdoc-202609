    \ of the residuals $\\bm{R}$ computed at each coordinate point is\n\n$$\n\\bm{R}\
    \ = \\bm{u}_{t} - \\boldsymbol{\\Theta}\\bm{\\varepsilon}.\\tag{4.52}\n$$\n\n\
    Next, the PDE error ($\\mathrm{MSE}_{\\mathrm{PDE}}$) is computed from this residual\
    \ vector.\n\n$$\nE_{\\mathrm{PDE}} = \\frac{1}{N_{P}}\\|\\bm{R}\\|_{2}^{2} = \\\
    frac{1}{N_{P}}\\|\\bm{u}_{t} - \\boldsymbol{\\Theta}\\bm{\\varepsilon}\\|_{2}^{2}\\\
    tag{4.53}\n$$\n\nTo evaluate a method to find a solution to PDE, it is important\
    \ to define the error. As errors, the NN model errors ($E_{u}$) and PDE errors\
    \ ($E_{\\mathrm{PDE}}$) described previously can be used. We will define the integrated\
    \ error $E_{\\mathrm{int}} = E_{u}^{*}E_{\\mathrm{PDE}}$ as in the PDE derivation.\n\
    \n# 4.3.4. *Example of finding solutions to PDEs using PINNs*\n\n## 4.3.4.1. *One-dimensional\
    \ advection-diffusion equation*\n\nThis section compares the results of solving\
    \ a one-dimensional advection-diffusion equation using PINNs with the results\
    \ of solving it using FDM based on their exact solutions. For comparison, in FDM,\
    \ $\\Delta x$, $\\Delta t$ (mesh width) are determined so that the Courant number\
    \ is 1 or less and the average is as large as possible within the domain. Figure\
    \ 4.39 shows the results of comparison with FDM. Of these two methods, the PINN\
    \ method provides the most accurate solution (Figure 4.39).\n"
  mdcn: "\n# 4.3.2.1. 有限元方法 (FEM)\n\n```python\n!pip install fenics\nfrom fenics import\
    \ *\n\n# Create a rectangular mesh\nmesh = UnitSquareMesh(8, 8)\n\n# Define function\
    \ space\nV = FunctionSpace(mesh, \"P\", 1)\n\n# Define boundary condition\nu_D\
    \ = Expression(\"1 + x[0]*x[0] + 2*x[1]*x[1]\", degree=2)\n\ndef boundary(x, on_boundary):\n\
    \    return on_boundary\n\nbc = DirichletBC(V, u_D, boundary)\n\n# Define variational\
    \ problem\nu = TrialFunction(V)\nv = TestFunction(V)\nf = Constant(-6.0)\na =\
    \ dot(grad(u), grad(v))*dx\nL = f*v*dx\n\n# Compute solution\nu = Function(V)\n\
    solve(a == L, u, bc)\n\n# Plot solution\nplot(u)\nplt.show()\n```\n\n这段代码安装了 FEniCS（一个有限元库），创建了一个单位正方形网格，应用后文描述的\
    \ FEM 方法对其进行求解，并绘制了结果。该代码求解了二维泊松方程，通过改变维度数量，还可以求解三维方程等。\n\n## 4.3.2.2. 有限差分方法\
    \ (FDM)\n\n该方法将偏微分方程（PDE）转换为差分形式，并进行数值求解。差分形式通过近似用于评估 PDE 解的连续函数的差值来表达。它通常以差分方程的形式表示。使用差分方法求解的\
    \ PDE 在空间和时间上都是离散的。FDM 使用有限差分近似来求解在离散化空间和时间中的 PDE。请注意，FDM 也用于求解高阶 PDE，但其精度有限。\n\
    \n以下是在 Colab 中求解传热问题的示例代码。该代码旨在利用特定的边界条件和热导率，数值求解非稳态一维传热问题。\n\n```python\nimport\
    \ numpy as np\n# As a boundary condition, set a temperature of 100°C at the left\
    \ end and 0°C at the right end.\nT_left = 100\nT_right = 0\n# Set the thermal\
    \ conductivity.\nk = 0.1\n# Set the space pitch width.\ndx = 0.1\n# Set the time\
    \ pitch width.\ndt = 0.01\n# Set the initial temperature value.\nT = np.zeros((101,\
    \ 101))\n# Compute time evolution.\nfor t in range(1, 10000):\n    for i in range(1,\
    \ 100):\n        T[i, t] = T[i, t-1] + k * dt/dx**2 * (T[i+1, t-1] - 2*T[i, t-1]\
    \ + T[i-1, t-1])\n\n# Apply boundary conditions.\nT[0, t] = T_left\nT[100, t]\
    \ = T_right\n```\n\n该代码将空间和时间划分为步长宽度，并计算它们的温度。空间使用 FDM，时间使用欧拉法来获取温度。这些计算的结果可用于获得稳态传热问题的近似解。\n\
    \n# 4.3.3. 如何使用 PINN 求解偏微分方程 (PDE)\n\n在本书讨论的求解 PDE 的方法中，在构建代表狄利克雷（Dirichlet）边界条件的物理数据的神经网络（NN）模型的同时，计算近似解，并同时最小化\
    \ PDE 残差（图 4.38）。类似于 PDE 推导方法，这种求解 PDE 的方法执行多用途参数优化计算。其中一个目的是从代表狄利克雷边界条件的物理数据中构建\
    \ NN 模型，而需要优化的参数是 NN 权重。换句话说，它寻找使损失函数最小化的参数。另一个目标是通过自动微分，将使用 NN 模型偏导数项计算出的残差与均方误差一起纳入，从而增强损失函数。此外，当给定诺伊曼（Neumann）边界条件时，使用自动微分计算该边界条件，并将其平均平方误差添加到损失函数中。图\
    \ 4.38 展示了仅给定狄利克雷边界条件的情况。\n\n从狄利克雷边界条件中，提取定义了物理数据的时空坐标，并输入到输入层。通过平均 NN 回归的数据与将边界点设为训练对象的物理数据之间的平方误差，计算\
    \ NN 模型误差。通过平均感兴趣的域内给定的 PDE 残差与采样点组，计算 PDE 误差。这两个误差之和用作损失函数来优化 NN 权重参数。使用自动微分（AD）来计算\
    \ PDE 残差。\n\n![](img/fa57e7010b16a211d5cf69ebb17e416e_192_0.png)\n\n## 4.3.3.1.\
    \ 使用 NN 构建模型\n\n构建 NN 模型涉及优化 NN 参数，以最小化量化由狄利克雷边界条件指定的数据与由 NN 模型近似的差异的损失函数。输入是在给定条件的边界处采样的时空坐标\
    \ $(x, y, z, t)$，输出是在该点给出的物理数据 $u$，例如电势、温度和压力。在这种情况下，损失函数仅由边界处的物理数据与 NN 模型回归数据之间的均方误差\
    \ $\\mathrm{MSE}_{u}=\\|\\hat{u}-u\\|_{2}^{2} / N_{p}$ 组成（以下简称“NN 模型误差”）。标记为“$\\\
    sigma$”的圆圈代表 NN 每一层中的一个神经元，其激活函数为 $\\sigma$。此外，$N_{p}$ 表示边界处的物理数据数量。\n\n## 4.3.3.2.\
    \ PDE 残差的计算\n\n使用前述的自动微分（AD），从 NN 模型计算偏导数项。本课程使用 Google TensorFlow 构建 NN 模型。TensorFlow\
    \ 是一个使用机器学习方法（如 NN）和优化技术的平台。这里，使用 TensorFlow 中的 GradientTape 库来计算 NN 模型的偏导数项。\n\
    \n接下来，计算构成 PDE 的偏导数项。对于 NN 模型，PDE 是使用 AD 构建的。如果将一阶时间偏导数作为空间偏导数项的线性之和表示为 PDE，则以下第一个回归方程表示在需要找到解的域内采样的\
    \ $N_{P}$ 个时空坐标中的关系：\n\n$$\n\\bm{u}_{t} = \\boldsymbol{\\Theta}\\bm{\\varepsilon}\\\
    tag{4.51}\n$$\n\n其中 $\\bm{u}_{t}$ 是由一阶时间偏导数值组成的向量，$\\boldsymbol{\\Theta}$ 是由每个层次的空间偏导数值组成的矩阵，$\\\
    bm{\\varepsilon}$ 是其空间偏导数值的系数。$\\bm{u}_{t}$，$\\boldsymbol{\\Theta}$ 是测量点的数量，即时空坐标\
    \ $N_{P}$ 的数量。与 PDE 推导不同，$\\bm{\\varepsilon}$ 是一个常数，而不是未知数。由在每个坐标点计算出的残差 $\\bm{R}$\
    \ 组成的向量是\n\n$$\n\\bm{R} = \\bm{u}_{t} - \\boldsymbol{\\Theta}\\bm{\\varepsilon}.\\\
    tag{4.52}\n$$\n\n接下来，从该残差向量计算 PDE 误差（$\\mathrm{MSE}_{\\mathrm{PDE}}$）。\n\n$$\n\
    E_{\\mathrm{PDE}} = \\frac{1}{N_{P}}\\|\\bm{R}\\|_{2}^{2} = \\frac{1}{N_{P}}\\\
    |\\bm{u}_{t} - \\boldsymbol{\\Theta}\\bm{\\varepsilon}\\|_{2}^{2}\\tag{4.53}\n\
    $$\n\n为了评估求解 PDE 的方法，定义误差至关重要。作为误差，可以使用前述的 NN 模型误差（$E_{u}$）和 PDE 误差（$E_{\\mathrm{PDE}}$）。我们将像\
    \ PDE 推导中一样定义综合误差 $E_{\\mathrm{int}} = E_{u}^{*}E_{\\mathrm{PDE}}$。\n\n# 4.3.4.\
    \ *使用 PINN 求解 PDE 的示例*\n\n## 4.3.4.1. *一维对流扩散方程*\n\n本节比较了使用 PINN 求解一维对流扩散方程的结果与基于其精确解使用\
    \ FDM 求解的结果。为了比较，在 FDM 中，确定 $\\Delta x$、$\\Delta t$（网格宽度），使得库朗数（Courant number）小于或等于\
    \ 1，并在域内尽可能取平均值。图 4.39 显示了与 FDM 比较的结果。在这两种方法中，PINN 方法提供了最精确的解（图 4.39）。\n\n"
