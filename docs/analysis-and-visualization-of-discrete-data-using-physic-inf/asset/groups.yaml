    # 1.2.1. Code cell


    You can enter and execute a Python code in a code cell.


    +   - To create a code cell, click “+Cell” at the top of a Colab page.

    - To enter and run code, select a cell and click the Run button.


    Colab has Python libraries pre-installed, allowing you to program with popular
    libraries like TensorFlow [3], Keras [4], and Numpy [5]. Colab can also perform
    high-speed computation using GPU and can perform deep learning tasks such as machine
    learning and image recognition. Colab also has other functions, such as importing
    external data, saving them in Google Drive, and publishing them to GitHub.


    # 1.2.2. Text cell


    The text cell allows you to write program descriptions, formulas, links, images,
    and more.


    +   - To create a text cell, click “+ Cell” at the top of a Colab page and select
    “Text”.

    - To enter text, select a cell and enter a sentence in it.


    You can use the Markdown notation to format headings, lists, and more. Colab text
    cells are very useful for writing descriptions and documents. In particular, they
    can be used to describe programs and interpret results.'
