    ## 2.3.5. 使用 Excel VBA 实现变量缩减法


    回归分析中描述的变量缩减法通过 VBA 实现。在此实现中，流程是找到 $t$ 值的绝对值中最小的那个值（代替 $p$ 值），然后移除该变量并重复回归分析。在
    $p$ 值为 5% 的水平上，$t$ 值的绝对值通常大于或等于 2，并且彼此呈负相关。


    假设 Excel 工作表的第一列包含因变量数据，第二列及后续列（共对应解释变量的数量）包含解释变量数据。假设第一行的第二列输入了解释变量的数量，第一列输入了样本量。回归分析的结果（解释变量的系数、$p$
    值和 $t$ 值）应与最后一行数据之间空一行，输出到左上角单元格（标记为 Summary）。


    以下是一个将变量缩减法应用于调查结果以缩小显著影响目标函数的目标变量的示例。在此调查中，向 106 名大学一年级学生发放了问卷，要求他们对与大学生满意度和期望水平相关的九个不同项目按区间量表作答。区间量表是一种定量测量量表，它不是顺序量表，两个变量之间的差异是有意义且相等的，而零点的存在是可选的。当您执行变量缩减法的
    VBA 程序时，会发现保留了两个基本项目（图 2.20）。


