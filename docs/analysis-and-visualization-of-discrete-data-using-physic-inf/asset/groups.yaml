    \ the regression analysis using NNs, we use as discrete data the bivariate data\
    \ described in Section 5, paragraph 2. These data are calculated from the bivariate\
    \ function\n\n$$y = x_{1}^{2} + x_{1} + x_{2}^{3} + x_{2}^{2}.$$ (2.26)\n\nThe\
    \ mean squared error of the model\n\n$$y = w_{0} + w_{1}x_{1} + w_{2}x_{2},$$\
    \ (2.27)\n\ncreated by linear regression from 26 discrete data randomly selected\
    \ from $\\{(x_{1}, x_{2})|0 \\leq x_{1} \\leq 1, 0 \\leq x_{2} \\leq 1\\}$, was\
    \ $0.0402$. Using the coefficients $w_{0}, w_{1}, w_{2}$ as parameters, the parameters\
    \ that minimize the mean square error between the spatiotemporal model and the\
    \ given discrete data were calculated using the Excel Solver function.\n\nIn the\
    \ previous section, we discussed specific ways to achieve regression analysis\
    \ using the Solver. In this section, we will use the same data to explain how\
    \ to achieve an NN model by using Solver. A simple NN model can be realized as\
    \ an activation function connected to the output of this linear regression model.\
    \ This time, we use the Sigmoid function\n\n$$\\sigma(x) = \\frac{1}{1 + e^{-x}}$$\
    \ (2.28)\n\nand assume that the output obtained using this function in the Excel\
    \ sheet function is scale converted to\n\n$$y = (y_{max} - y_{min})\\frac{1}{1\
    \ + e^{-(w_{0} + w_{1}x_{1} + w_{2}x_{2})}} + y_{min}$$ (2.29)\n\n$\\Delta y =\
    \ \\frac{(y_{max} - y_{min})}{\\Delta y}$ to calculate the mean squared error\
    \ between $y = \\frac{1}{1 + e^{-(w_{0} + w_{1}x_{1} + w_{2}x_{2})}} + y_{min}$\
    \ and the given discrete data $y_{i}.$\n\n$$\\sum_{i=1}^{26} \\left(y_{i} - \\\
    frac{\\Delta y}{1 + e^{-(w_{0} + w_{1}x_{1} + w_{2}x_{2})}} - y_{min}\\right)^{2}$$\
    \ (2.30)\n"
  mdcn: "\n\n```python\ndef f(x):\n    return x**2\n```\n\n```python\n# Find the minimum\
    \ value\nresult = optimize.minimize(f, x0=0)\nprint(result)\n```\n\n这段代码使用 \"\
    minimize\" 函数来寻找函数 $f(x) = x^{2}$ 的最小值。此外，还有几种类型的优化问题。例如，有寻找最小值和最大值的问题，以及带有约束条件的问题。SciPy\
    \ 库为每种类型提供了相应的函数。通过使用这些对应的函数，你可以解决优化问题。\n\n## 2.7. 神经网络\n\n本文档使用回归模型从物理数据构建时空模型。在该模型中，回归试图尽可能准确地匹配给定的物理数据，但与插值不同，回归模型并不是数据的完美拟合。不过，它确实能从数据中学习特征。在本节中，我们采用神经网络（NNs）作为回归方法。虽然神经网络的多种结构已被提出，但我们在此重点关注全连接神经网络（FCNN）（图\
    \ 2.26）。全连接神经网络由输入层、隐藏层和输出层组成。每一层具有特定数量的神经元。每个神经元的输出值由输入值向量与权重向量的内积计算得出。因此，从输入层到输出层的映射最终产生所需的输出值。全连接神经网络是一种每个神经元都与前一层所有神经元相连的神经网络。它也被称为密集连接神经网络、全连接神经网络或多层感知机（MLP）。\n\
    \n由于每一层都与紧邻的前一层的所有神经元相连，全连接神经网络在输入和输出之间拥有大量的权重参数。这种结构使其能够保留从输入层到输出层的大量参数，因此具有很高的表达能力。然而，过多的层或神经元可能导致学习缓慢或过学习问题。在本文档中，神经网络均指代全连接神经网络。\n\
    \n![](img/fa57e7010b16a211d5cf69ebb17e416e_90_0.png)\n\n在神经网络中，学习是一个利用训练数据自动调整神经网络参数（如权重和偏置）的过程。通过这一过程，神经网络构建了一个由训练数据优化的模型。\n\
    \n神经网络训练分为两个主要步骤：“前向传播”和“反向传播”。前向传播是一个按顺序执行从输入层到输出层过程，输入数据通过网络产生输出的步骤。反向传播是将误差从输出层反向传播到输入层，并更新权重和偏置以最小化误差的步骤。\n\
    \n具体而言，对于训练过程，会定义一种称为损失函数的度量，并更新权重和偏置，以最小化神经网络输出与真实数据（ground truth data）之间的差异。因此，神经网络被调整以适合训练数据。正则化技术、丢弃法（dropouts）以及其他方法也可能被用来防止过学习。\n\
    \n一旦经过充分训练，神经网络就能对未知数据实现较高的预测准确性。神经网络中的学习是一种优化。神经网络中的学习旨在通过使用训练数据并调整权重和偏置等参数来获得最佳预测结果。现在，假设神经网络由\
    \ $L$ 层组成，且第 $i$ 层定义了 $n_{i}$ 个神经元。需要优化的参数数量可按如下方式计算：\n\n$$\\sum_{i=1}^{L+1}(n_{i}+1)n_{i+1}\
    \ \\tag{2.24}$$\n\n在该方程中，$i=1$ 代表输入变量，因此对于时空坐标，$n_{1}=4$。加上 1 是由于将偏置作为一种权重包含在内。此外，$i=L+2$\
    \ 代表输出变量，因此对于标量数据，$n_{L+2}=1$。图 2.26 展示了一个由 $L$ 层组成的神经网络。\n\n权重定义在连接神经元和输出变量的弧线上。对于小型神经网络，我们注重清晰度，并使用\
    \ Excel Solver 解释如何优化权重。在实际应用中，我们将使用第 1 章中介绍的 keras 和其他库。\n\n学习过程搜索使损失函数最小化的参数值，从而最小化神经网络输出与真实数据之间的差异。这个搜索过程使用优化算法（例如梯度下降法）执行。\n\
    \n随着学习的进行，参数会被更新，损失函数的值会减小以获得最优参数。使用这些最优参数，神经网络可以对未知数据实现高预测准确性。\n\n### 2.7.1.\
    \ 通用逼近定理\n\n通用逼近定理是一个定理，指出神经网络可以以任何精度逼近任何连续函数。换句话说，设计得当的神经网络可以为任何给定输入逼近所需的输出。\n\
    \n该定理是神经网络变得广泛使用的原因之一，也是展示其有用性的基础。然而，在实践中，实现起来并不总是容易的，因为它需要足够数量的神经元、适当的算法、数据集等，才能达到定理所建议的任意精度逼近。\n\
    \n通用逼近定理最初由 George Cybenko 和 Edward G. Widrow 在 1989 年的论文 \"Multi-Layer Feedforward\
    \ Networks are Universal Approximators\" 中提出 [23]。该论文发表在《IEEE Transactions on\
    \ Neural Networks and Learning Systems》上，后来成为神经网络理论的重要基础。在这篇论文中，George Cybenko\
    \ 和 Edward G. Widrow 证明了存在可以以任何精度逼近任何连续函数的神经网络。他们表明，该定理使神经网络非常强大，并推动了神经网络的广泛应用。\n\
    \n可以以任何精度逼近任何连续函数的神经网络的存在性证明如下：\n\n-   首先，具有单个 sigmoid 函数的神经网络可以逼近 Lipschitz 连续函数。Lipschitz\
    \ 连续函数是变化率受某个常数限制的函数，可以逼近此类函数。\n-   其次，具有多个 sigmoid 函数的神经网络可以逼近任何 Lipschitz 连续函数。这是因为每一层将前一层输出作为输入，从而允许表示更复杂的函数。\n\
    -   最后，任何连续函数都可以表示为无限多个 Lipschitz 连续函数的和。这意味着可以使用具有多个 sigmoid 函数的神经网络来以任何精度逼近任何连续函数。\n\
    \n因此，Lipschitz 连续函数是一种连续函数，其中存在一个常数 $L$，并且对于函数 $f$，以下方程成立：\n\n$$| f(x) - f(y)\
    \ | \\le L | x - y | \\tag{2.25}$$\n\n在该方程中，$x$ 和 $y$ 代表 $f$ 定义域内的任意两点，$| \\cdot\
    \ |$ 代表绝对值。这个定义表明“$f$ 的值的变化与其自变量的变化成正比且受限于边界”。换句话说，$x$ 和 $y$ 彼此越接近，$f(x)$ 和 $f(y)$\
    \ 之间的差异越小。\n\nLipschitz 连续函数在微积分、泛函分析及其他数学领域中发挥着重要作用。它们也被用于物理、工程和经济学等各个领域。\n\n\
    如上所述，具有单个 sigmoid 函数的神经网络逼近 Lipschitz 连续函数，而具有多个 sigmoid 函数的神经网络可以逼近任何 Lipschitz\
    \ 连续函数。因此，可以以任何精度逼近任何连续函数。\n\n### 2.7.2. 使用神经网络的回归分析\n\n为了说明使用神经网络的回归分析，我们使用第\
    \ 5 章第 2 段描述的双变量数据作为离散数据。这些数据是根据双变量函数计算得出的\n\n$$y = x_{1}^{2} + x_{1} + x_{2}^{3}\
    \ + x_{2}^{2}.$$ (2.26)\n\n由从 $\\{(x_{1}, x_{2})|0 \\leq x_{1} \\leq 1, 0 \\leq\
    \ x_{2} \\leq 1\\}$ 中随机选取的 26 个离散数据通过线性回归生成的模型\n\n$$y = w_{0} + w_{1}x_{1} + w_{2}x_{2},$$\
    \ (2.27)\n\n的平均均方误差为 $0.0402$。使用 $w_{0}, w_{1}, w_{2}$ 作为系数（参数），使用 Excel Solver\
    \ 函数计算了使时空模型与给定离散数据之间的均方误差最小的参数。\n\n在上一节中，我们讨论了使用 Solver 实现回归分析的具体方法。在本节中，我们将使用相同的数据来说明如何使用\
    \ Solver 实现神经网络模型。一个简单的神经网络模型可以通过将此线性回归模型的输出连接到一个激活函数来实现。这次，我们使用 Sigmoid 函数\n\n\
    $$\\sigma(x) = \\frac{1}{1 + e^{-x}}$$ (2.28)\n\n并假设在 Excel 电子表格函数中，使用此函数获得的输出按比例转换为\n\
    \n$$y = (y_{max} - y_{min})\\frac{1}{1 + e^{-(w_{0} + w_{1}x_{1} + w_{2}x_{2})}}\
    \ + y_{min}$$ (2.29)\n\n$\\Delta y = \\frac{(y_{max} - y_{min})}{\\Delta y}$ 以计算\
    \ $y = \\frac{1}{1 + e^{-(w_{0} + w_{1}x_{1} + w_{2}x_{2})}} + y_{min}$ 与给定离散数据\
    \ $y_{i}$ 之间的平均均方误差。\n\n$$\\sum_{i=1}^{26} \\left(y_{i} - \\frac{\\Delta y}{1\
    \ + e^{-(w_{0} + w_{1}x_{1} + w_{2}x_{2})}} - y_{min}\\right)^{2}$$ (2.30)\n\n"
