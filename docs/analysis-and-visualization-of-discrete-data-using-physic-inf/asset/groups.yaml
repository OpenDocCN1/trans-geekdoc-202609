    \n![](img/fa57e7010b16a211d5cf69ebb17e416e_59_0.png)\n\n- 检查“R2”以评估估算回归方程的准确性：在回归分析中，使用一种称为判定系数的度量指标。判定系数衡量回归模型对数据的拟合程度，取值介于\
    \ 0 和 1 之间。值越接近 1，表示回归模型对数据的拟合越好；值越接近 0，表示回归模型对数据的拟合越差。以下方程用于计算判定系数：$R^{2}=1-(S\
    \ S E / S S T)$。在此方程中，SSE 代表残差平方和（回归模型预测值与观测值之差的平方和），SST 代表假设平方和（观测值与均值之差的平方和）。判定系数通常用于评估回归分析的结果。然而，随着解释变量数量的增加，判定系数倾向于增大。因此，必须考虑模型的复杂度。\n\
    \n- 检查估算的回归方程是否具有统计意义（Significance $F$）：Significance $F$ 是回归分析中用于确定回归模型是否比数据拟合得更好的度量指标。Significance\
    \ $F$ 是通过计算残差平方和（SSE）与假设平方和（SST）的比率得到的。SSE 是回归模型预测值与观测值之差的平方和，SST 是观测值与均值之差的平方和。当\
    \ SSE 较小（即回归模型对数据拟合良好）且 SST 较大（即观测值显著偏离均值）时，Significance $F$ 较大。计算 Significance\
    \ F 时，使用以下方程：\n\n$$F = (\\mathrm{SST} - \\mathrm{SSE}) / (\\mathrm{SSE} / (n -\
    \ p - 1)) \\qquad (2.15)$$\n\n在此方程中，n 代表样本量，p 代表解释变量的数量。Significance F 计算数据服从\
    \ F 分布的概率，并将其与显著性水平（通常为 0.05、0.01 等）进行比较，以确定回归模型是否显著拟合数据。如果 Significance F 小于显著性水平，则回归模型显著拟合数据。\n\
    \n- 检查估算系数是否具有统计意义（p 值）：估算系数的绝对值离 0 越远，越容易看出其具有统计意义。如果 p 值很小（通常小于 0.05），则系数为 0\
    \ 的概率很小，这意味着系数为 0 的零假设被拒绝。\n\n- 检查每个解释变量的影响程度（系数）：在回归分析中，使用以下方法来选择用于分析的解释变量：\n\
    \    - 基于先验知识和理论依据，选择被认为显著的解释变量。\n    - 检查解释变量之间的相关系数。相关性高的解释变量可以被剔除，因为它们会使回归模型的解释变得混乱。\n\
    \    - 使用单变量回归分析，检查每个解释变量与目标变量的相关系数。选择相关系数高的解释变量。\n    - 使用多重共线性条件指数比率和 Significance\
    \ F 等度量指标自动选择解释变量。多重共线性条件指数是一种衡量多元回归分析中解释变量之间高度相关状态的指标。\n    - 在解释回归分析结果时，还可以通过检查解释变量的\
    \ p 值和判定系数来评估回归模型对数据的拟合程度。\n\n## 2.3.3.1. 变量缩减方法\n\n变量缩减方法 [18] 常用于回归分析，使用 $p$\
    \ 值来选择有意义的解释变量。在回归分析中，一种称为变量缩减的方法允许我们通过移除不必要的变量来简化模型。这不仅使模型更易于解释，还可以防止过拟合。它还可以用于从物理数据中推导偏微分方程（PDE），这将在后文讨论。通过寻找由若干其他微分项（通常是空间偏微分项）解释一个偏微分项（通常是时间偏微分项）的模型，可以推导出\
    \ PDE。使用变量缩减方法，可以从许多候选项中删除不必要的偏微分项。\n\n基于 $p$ 值的变量缩减是一种使用统计方法来选择与因变量显著相关的回归分析中使用的解释变量的方法。$p$\
    \ 值代表假设成立的概率。基于 $p$ 值的变量缩减方法根据使用该解释变量的回归模型的 $p$ 值，确定每个解释变量是否与因变量显著相关。如果 $p$ 值小于显著性水平（通常为\
    \ 0.05 或 0.01），则该解释变量被解释为与因变量显著相关。因此，如果 $p$ 值高于显著性水平，则该解释变量将从模型中删除。\n\n使用 $p$\
    \ 值的变量缩减方法是一种后向选择方法。它的好处是对变量的添加顺序不太敏感，因为可以同时评估所有解释变量，而不是逐个添加变量。使用 Excel 的数据分析工具，可以将回归分析转换为宏，并在\
    \ VBA 中执行上述步骤，以创建自动变量缩减方法。\n\n## 2.3.3.2. 自回归\n\nExcel 的数据分析工具允许你执行自回归 [19]。AR（自回归）模型是分析时间序列数据的方法之一。自回归模型假设时间序列数据的当前值由过去的数据值决定，并通过建立此类模型来分析时间序列数据的趋势和周期性。自回归模型由以下方程表示：\n\
    \ny(t) = c + varphi _ {1} y(t - 1) + varphi _ {2} y(t - 2) + ... + varepsilon\
    \ (t) \\tag{2.16}\n\n在此方程中，$y(t)$ 表示时间序列数据的当前值，c 表示常数，$\\varphi _ {1}, \\varphi\
    \ _ {2}, ...$ 表示自回归系数，$\\varepsilon (t)$ 表示误差项。自回归系数越大，过去数据值的影响越强。误差项表示时间序列数据中的随机噪声。自回归模型可用于预测或过滤时间序列数据。\n\
    \n要使用 Excel 数据分析工具中的“回归”功能执行自回归，请遵循给定步骤：使用 1990 年 9 月 16 日大淀川日置桥观测点每小时记录的实际水位数据。\n\
