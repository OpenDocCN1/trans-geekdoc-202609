    # ### 1.2. Basic operations of Google Colab (Colab)


    Approximately 1000 rows of data can be processed with Excel; however, in order
    to understand data analysis techniques handling a large amount of data, Google
    Colab is used. Google Colab (Colab) is Google’s cloud environment for data analysis
    [2]. Colab allows you to start analyzing data'
