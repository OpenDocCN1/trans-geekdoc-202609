    # 1.1.8. Introduction of visualization with Excel


    Excel is widely used as a piece of spreadsheet software but it is also suitable
    for visualizing data.


    There are several ways to visualize data in Excel:


    +   Visualization with charts: Excel provides a variety of chart types to help
    you visualize your data with bar, line, pie charts, etc.


    +   Visualization using a pivot table: You can visualize data by using an Excel
    pivot table to aggregate data and convert them to a chart.


    +   Visualization using a spreadsheet: You can use an Excel spreadsheet to organize
    data and visualize them using color coding or formulas.


    +   Visualization using macro: Excel has a macro language called VBA. You can
    use it to create a custom chart or automated visualization tool.


    Before visualizing data in Excel, you may have to organize and process them. Excel
    also has a visualization add-in that allows you to do more detailed visualizations.


    Displaying a chart using Excel:


    +   Creating a chart: Excel has a variety of chart types that allow you to enter
    data and create a chart.


    +   Select data, select Chart from the Insert tab, and select a chart type.


    +   After a chart is created, the data appear in the chart area.'
