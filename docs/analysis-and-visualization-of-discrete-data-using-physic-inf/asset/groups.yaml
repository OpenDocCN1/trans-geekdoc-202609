    (3) The variance of the error term is equal for all i (homoscedasticity):


    var (u_i) = σ²   (2.9)


    Homoscedasticity refers to the fact that the variance of the error term is constant
    regardless of the value of the independent variable. In other words, it means
    that the scatter of the residuals plotted on a scatter plot is constant. If homoscedasticity
    is not met, the regression analysis results may be biased or skewed. For example,
    in regions of high variance, the regression line may deviate significantly from
    the actual values. Conversely, in regions where the variance is small, the regression
    line tends to be closer to the actual value.


    (4) There is no multicollinearity among the explanatory variables: If there is
    a strong correlation between the explanatory variables, multicollinearity may
    occur. In such cases, the estimates of the regression coefficients may become
    unstable. To avoid multicollinearity, measures such as excluding highly correlated
    explanatory variables are necessary.


    (5) Observed values are independent: Regression analysis assumes that the observed
    values are independent. That is, the impact of a certain observed value on the
    model should be independent of other observed values.


    If these assumptions are not met, the results of the regression analysis may be
    biased or skewed. In order to obtain a more accurate predictive model, it is important
    to properly validate the assumptions before performing a regression analysis.


    Assumption 1 is satisfied at the stage of formulating the linear equation. To
