    ### 4.3.5.2. Implementation using FEMAP


    In stress analysis by FEM, a system has been commercialized in which the user
    defines the domain of interest, gives boundary conditions, performs analytical
    computations, and visualizes the results. This section implements stress analysis
    with PINNs using one such system, Finite Element Modeling and Post-Processing
    (FEMAP). FEMAP is a computer software system used for modeling finite element
    analysis (FEA) and visualizing the results. FEMAP provides an easy-to-use FEA
    modeling interface and is suitable for the analysis of complex structures [45].
    FEMAP supports a wide variety of elements and material models and has advanced
    result visualization and analysis functions. Specifically, the commercial system
    FEMAP is used to enter shape data to create mesh. In FEM, a mesh is a geometric
    shape used to divide the domain to be analyzed into multiple smaller elements
    and analyze each element independently to obtain an overall picture. The mesh
    is usually made of triangular or rectangular elements, and the domain to be analyzed
    can be finely divided to increase accuracy. Figure 4.59 shows the details of the
    process (left side) and its user interface (right side). In stress analysis with
    PINNs, the following are required as a pre-treatment:


    - (1) Shape input, boundary conditions, and property settings

    - (2) NN hyperparameter setting and optimization

    - (3) Setting point group density and generation of selected point groups.


    Among the above, FEMAP performs 1 and 3. In PINNs, the mesh itself is not needed,
    but the mesh points generated for the entered shape are used as the selected point
    group. Boundary conditions and property value settings can be used as is. Since
    FEMAP has an external file export function, a user selects the data needed for
    PINNs from the data exported using this function. For 2, the hyperparameters are
    optimized by setting them up in the system we developed. Since PINNs are used
    in this case, the FEMAP solution section (also called “solver”) will not be used.


    Stress analysis with PINNs outputs a displacement vector for each selected point,
    which can be transferred to FEMAP for visualization. The presumption in this case
    is that the mesh has already been defined in FEMAP. Specifically, the file is
    created as an addition to the data exported from FEMAP as a pre-process. FEMAP
    reads this file and performs post-processing. The post-processing consists of
    the following:


    - (4) NN model output

    - (5) NN model visualization


    In the NN model output, data are exported in a form that FEMAP can process, and
    the NN model visualization uses FEMAP functions.


