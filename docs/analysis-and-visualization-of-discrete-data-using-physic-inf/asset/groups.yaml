    A detailed explanation follows: **Cells(1, Target_Col)** represent the cell with
    the column number specified by **Target_Col** in the first row. The **Address**
    property is used to obtain the address of this cell.


    **Cells(1, Target_Col).Address** returns a string, such as `$B$1` for column **B**.


    Next, the string is split into arrays, separated by `$`. For example, **Split(Cells(1,
    Target_Col).Address, `$`)** returns an array like this for column **B**:


    `['''', ''B'', ''1'']`


    The objective of this code is to obtain the column name of the column corresponding
    to the specified column number (Target_Col). By obtaining the column name, you
    can specify a cell from the column name and row number, for example, Range(Col1
    & "2").


    # 2.7.4. Function approximation using NNs


    To explain the function approximation using NNs, we use as discrete data the bivariate
    data described in Section 5, Paragraph 2. To use ExNN, first assume that the Excel
    sheet, the objective variable data is populated in the first column, starting
    from the second row and continuing for as many observations as there are, then,
    assume that the explanatory variable data is populated in the second and subsequent
    columns, starting from the second row, with a number of explanatory variables
    equal to the number of observations. For the structure of the NN used in the calculation,
    we consider'
  - '[PAGE 104]


    the following six structures, all with 2 hidden layers. The numbers represent
    the number of neurons placed in each layer. The number of layers is assumed to
    increase sequentially from left to right, starting from 1.


    +   - Structure 1: 2,2,2,2,1

    - Structure 2: 2,3,3,3,1

    - Structure 3: 2,1,2,3,1

    - Structure 4: 2,2,3,4,1

    - Structure 5: 2,3,2,1,1

    - Structure 6: 2,4,3,2,1

    - Structure 7: 2,3,2,3,1

    - Structure 8: 2,4,3,4,1

    - Structure 9: 2,2,3,2,1

    - Structure 10: 2,3,4,3,1


    Structures 1 and 2 represent a pattern in which the number of neurons is constant
    (constant NN), structures 3 and 4 represent an increase in the number of neurons
    (increasing NN), structures 5 and 6 represent a decrease in the number of neurons
    (decreasing NN), structures 7 and 8 represent the number of neurons once decreasing
    and then increasing (concave NN), and structures 9 and 10 represent the number
    of neurons once increasing and then decreasing (convex NN). The first neuron number
    represents the number of input variables (2 in this case), and the last neuron
    number represents the number of output variables (1 in this case). Figure 2.33
    shows an example of a convex BB structure.


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_104_0.png)'
  - '[PAGE 105]


    For each structure, we use the bivariate data described in Section 5, Paragraph
    2 as discrete data to evaluate the model error of the NN. These data are calculated
    from the bivariate function


    $y=x_1^2+x_1+x_2^3+x_2^2$. (2.32)


    The results show that the model error with convex NNs is the smallest.


    In NNs, the number of neurons per layer is variable. For example, an NN can have
    a structure that gradually reduces (decreasing type), increases (increasing type),
    or keeps constant (constant type) the number of neurons from the input layer.
    There are also other patterns (convex, concave, etc.). As a visualization method
