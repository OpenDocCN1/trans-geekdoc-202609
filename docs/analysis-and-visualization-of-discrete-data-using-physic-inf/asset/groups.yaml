    in adjacent layers. The kth neuron $j$ in the $u_{j}^{l}$th layer is connected
    to the neurons in the $(k-1)$th layer, expressed as:


    ```

    $$u_{j}^{k}=\sigma_{j}^{k-1}\left(\sum_{i=1}^{n_{k-1}} w_{i, j}^{k-1} u_{i}^{k-1}\right)\tag{3.1}$$

    ```


    where $w_{i, j}^{k-1}$ is a weight for units $u_{i}^{k-1}$ to $u_{j}^{k}$, and
    $\sigma_{j}^{k}$ and $n_{k}$ represent an activation function for the jth neuron
    in the $k$ layer and the number of neurons, respectively.


    Let us assume that the sigmoid function $\sigma(x)=1 /\left(1+e^{-x}\right)$ is
    used as the activation function. The calculation is performed with the weight
