    [45]。FEMAP 支持多种单元和材料模型，并具备先进的结果可视化和分析功能。具体而言，使用商业系统 FEMAP 输入形状数据以创建网格。在有限元法中，网格是一种几何形状，用于将待分析域划分为多个较小的单元，并独立分析每个单元以获得整体视图。网格通常由三角形或矩形单元组成，通过对待分析域进行精细划分可以提高精度。图
    4.59 展示了该过程的细节（左侧）及其用户界面（右侧）。在使用 PINNs 进行应力分析时，需要进行以下预处理：


    - (1) 形状输入、边界条件及属性设置

    - (2) 神经网络（NN）超参数设置与优化

    - (3) 设置点群密度并生成选定点群。


    在上述步骤中，FEMAP 执行第 1 步和第 3 步。在 PINNs 中，不需要网格本身，但将用于输入形状的生成的网格点作为选定点群。边界条件和属性值设置可直接使用。由于
    FEMAP 具有外部文件导出功能，用户可从使用该功能导出的数据中选择 PINNs 所需的数据。对于第 2 步，超参数通过在我们开发的系统中进行设置来优化。由于此处使用了
    PINNs，因此不会使用 FEMAP 的求解部分（也称为“求解器”）。


    使用 PINNs 进行应力分析会为每个选定点输出位移向量，这些向量可传输至 FEMAP 进行可视化。此处的假设是网格已在 FEMAP 中定义。具体来说，该文件作为预处理过程从
    FEMAP 导出数据的一个补充而创建。FEMAP 读取此文件并执行后处理。后处理包括以下内容：


    - (4) NN 模型输出

    - (5) NN 模型可视化


    在 NN 模型输出中，数据以 FEMAP 可处理的形式导出，而 NN 模型可视化则使用 FEMAP 功能。


    ## 第 5 章


    ## 基于物理的代理模型


    ### 5.1. 关于 CAE 代理模型


    预期 PINNs 将在计算机辅助工程（CAE）代理模型（SM）构建中发挥重要作用。CAE 代表“计算机辅助工程”，指利用计算机支持设计、分析、仿真及其他工程相关任务的技术和工具
    [45]。Surrogate（代理/替代）一词在此意为替代者，如同替代母亲（代孕）。在 CAE 中，当感兴趣的结果无法高效计算时，就会使用 SM。大多数工程设计问题都需要数值模拟来评估作为设计变量函数的目标函数。例如，为了找到飞机机翼的最佳形状，工程师需针对长度、曲率、材料等各种形状变量计算机翼周围的空气流。然而，对于许多实际问题，单次数值模拟可能需要数分钟、数小时甚至数天才能完成。因此，设计优化、设计空间探索、敏感性分析和假设分析等例行任务变得难以执行，因为它们需要成千上万甚至数百万次数值模拟评估。减轻这种负担的一种方法是使用一种称为
    SM 的近似模型。


    #### 5.1.1. SM 构建示例


    以下介绍了作者进行的两个 SM 构建示例。


    ##### 5.1.1.1. 案例 1：笔记本电脑热管理


    笔记本电脑的温度预测被认为是一项提高 CPU 性能并减小机箱尺寸的关键技术。CPU 封装被表示为由多个热阻组成的热阻网络 [47]，并利用 CPU 封装及其周围空间的仿真结果来识别其热阻值（图
    5.1）。


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_212_0.png)


    图 5.1. CPU 封装的热阻网络。


    具体而言，放置 CPU 封装的计算机机箱被表示为若干边界条件，并为该数量的边界条件计算 CAE 模型。利用这些结果，通过优化方法计算热阻。这种考虑各种情况的热阻网络（称为紧凑模型）在详细
    CAE 模型计算耗时较长时使用，被视为一种 SM。


    ##### 5.1.1.2. 案例 2：开关磁阻电机（SRM）热管理


    本节给出了开关磁阻电机（SRM）温度分析的一个示例。该电机因其结构简单（转子无永磁体和绕组）而成本低廉且适合高速旋转。因此，它被用于各种应用，如家用电器（洗衣机、真空吸尘器）、电动汽车驱动及工业应用。SRM
    的转子配备多个凸极，利用磁阻进行旋转。当转子旋转时，凸极之间流动的空气比普通圆柱形转子产生更多的风损，导致转子表面平均温度升高（图 5.2）。


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_213_0.png)


    图 5.2. 开关磁阻电机（SRM）的结构。


    三维热流体分析软件已用于预测这些温度。迄今为止，使用此软件进行的 CAE 分析在分析大量设计时需要大量的计算时间（计算一个设计大约需要 30 分钟）。使用
    SM 后，每个设计的计算时间缩短为几秒钟，并且能即时提供输出。这使得设计数量可以从几十例增加到数万例。


    在此案例中，为了推导出能在设计阶段即时计算任意点温度预测的温度预测方程，已开发了使用 Excel 分析工具和求解器的以下三种类型的回归分析模型作为 SM：


    - 对于类型 1，仅使用六个参数的一阶项作为变量进行多元回归分析，总共使用包括参数和截距在内的七个系数。

    - 对于类型 2，从总共 27 个参数中选取七个参数 (*S0, R-SU \* S0, G0, S02, G02, R-GU \* G0, G0 \* S0*)
    进行多元回归分析：六个参数的一阶项（6 个）、二阶项（6 个）以及两个变量的乘积项（15 个），这些对转子温升有较大贡献。


    | 参数 | | 最小值 | 最大值 | 水平数 |

    | :--- | :--- | :--- | :--- | :--- |

    | 凸极转子角度 | $S_0$ | 2 | 160 | 2(80) |

    | | $G_0$ | | | |

    | 顶部圆角 | $R_{SU}$ | 0.5 | 8 | 0.5(16) |

    | | $R_{GU}$ | | | |

    | 底部圆角 | $R_{SD}$ | | | |

    | | $R_{GD}$ | | | |


    | | 平均误差 [%] | 最大误差 [%] |

    | :--- | :--- | :--- |

    | 类型 1 | 1.7 | 8.9 |

    | 类型 2 | 1.3 | 8.6 |

    | 类型 3 | 0.6 | 4.2 |


    图 5.3. SRM 温度预测的代理模型。


    - 对于类型 3，使用了 Sigmoid 激活函数和深度学习（一个隐藏层）。


    在这些类型中，类型 3 最准确（图 5.3）。


    ##### 5.1.1.3. Excel 在 SM 构建中的应用


    在统计学中，回归是指当 $Y$ 为连续值时，将模型 $Y = f(X)$ 拟合到数据。另一种说法是在连续尺度上拟合目标变量 $Y$ 与解释变量 $X$ 之间的模型。如果
    $X$ 是一维的，称为简单回归；如果 $X$ 是二维或更高维的，称为多元回归。如果 $Y$ 是离散的，则称为分类。回归分析涉及使用回归方法分析数据，这通常给人带来使用昂贵工具或开发专用程序的印象。本节展示了这实际上是常用
    Excel 分析工具中的一个功能。


    如前所述，Excel 分析工具支持从相关性分析到统计检验和回归分析的所有功能，因此基本分析技术可以通过“分析工具包”（Analysis ToolPak）覆盖。Excel
