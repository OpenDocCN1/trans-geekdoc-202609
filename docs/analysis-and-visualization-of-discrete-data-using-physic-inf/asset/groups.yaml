    \ 4 | 269149348 | 67287337 | 0.1651 |\n| Residual | 5 | 2.038E+09 | 407553100\
    \ | |\n| Summation | 9 | 2.307E+09 | | |\n\nFigure 2.14. Breusch–Pagan test.\n\
    \n(4) In Output Range under Output Options, select the cell in the left corner\
    \ of the area where the results will be output.\n\n(5) Click [OK] to output the\
    \ regression analysis results (Figure 2.15).\n\nRegression analysis can be easily\
    \ performed by using the Data Analysis tools in Excel. From the regression analysis\
    \ results, you will note the impact of the explanatory variables on the objective\
    \ variable. The Data Analysis tools in Excel can also be used to evaluate the\
    \ analysis results with a regression model. The evaluation measures include the\
    \ followings:\n\n![](img/fa57e7010b16a211d5cf69ebb17e416e_59_0.png)\n\n- Check\
    \ “R2” to check the accuracy of the estimated regression equation: In regression\
    \ analysis, a measure called the coefficient of determination is used. The coefficient\
    \ of determination is a measure of how well the regression model fits the data\
    \ and takes values between 0 and 1. A value closer to 1 means that the regression\
    \ model fits the data well, while a value closer to 0 means that the regression\
    \ model does not fit the data well. The following equation calculates the coefficient\
    \ of determination: $R^{2}=1-(S S E / S S T)$. In this equation, SSE represents\
    \ the residual sum of squares (the sum of squares of the difference between the\
    \ value predicted by the regression model and the observed value) and SST represents\
    \ the sum of squares of hypotheses (sum of squares of the difference between the\
    \ observed value and the mean value). The coefficient of determination is often\
    \ used to evaluate the results of regression analysis. However, the coefficient\
    \ of determination tends to increase in value as the number of explanatory variables\
    \ is increased. Therefore, the complexity of the model must be taken into account.\n\
    \n- Check if the estimated regression equation is statistically meaningful (Significant\
    \ $F$): Significance $F$ is a measure used in regression analysis to determine\
    \ whether the regression model fits the data better. Significance $F$ is obtained\
    \ by calculating the ratio of the residual sum of squares (SSE) to the sum of\
    \ squares of hypotheses (SST). SSE is the sum of squares of the difference between\
    \ the value predicted by the regression model and the observed value, and SST\
    \ is the sum of squares of the difference between the observed value and the mean\
    \ value. Significance $F$ is greater when SSE is small (that is, the regression\
    \ model fits the data well) and SST is large (that is, the observed values deviate\
    \ significantly from the mean). To calculate the significance F, use the following\
    \ equation:\n\n$$F = (\\mathrm{SST} - \\mathrm{SSE}) / (\\mathrm{SSE} / (n - p\
    \ - 1)) \\qquad (2.15)$$\n\nIn this equation, n represents the sample size, and\
    \ p represents the number of explanatory variables. Significance F calculates\
    \ the probability that the data follow an F distribution and compares it to a\
    \ significance level (usually 0.05, 0.01, etc.) to determine if the regression\
    \ model significantly fits the data. If the significance F is less than the significance\
    \ level, the regression model is significantly fitting the data.\n\n- Check if\
    \ the estimated coefficient is statistically meaningful (p-value): The larger\
    \ the absolute value of the estimated coefficient from 0, the easier it is to\
    \ see that it is statistically meaningful. If the p-value is small (usually less\
    \ than 0.05), the probability that the coefficient is 0 is small, meaning that\
    \ the null hypothesis that the coefficient is 0 is rejected.\n\n- Check the degree\
    \ of influence of each explanatory variable (coefficient): In regression analysis,\
    \ the following methods are used to select the explanatory variables to be used\
    \ for the analysis:\n    - Select explanatory variables that are considered significant\
    \ based on prior knowledge and theoretical grounds.\n    - Check the correlation\
    \ coefficients among the explanatory variables. Explanatory variables with high\
    \ correlations can be eliminated because they can be confusing in interpreting\
    \ regression models.\n    - Using univariate regression analysis, check the correlation\
    \ coefficient of each explanatory variable with the objective variable. Select\
    \ explanatory variables with high correlation coefficients.\n    - Automatically\
    \ select explanatory variables using measures such as multicollinearity condition\
    \ index ratio and significance F. The multicollinearity condition index is a measure\
    \ that refers to the state of high correlation between explanatory variables in\
    \ multiple regression analysis.\n    - When interpreting the results of a regression\
    \ analysis, you can also assess how well the regression model fits the data by\
    \ checking the p-values and coefficients of determination of the explanatory variables.\n\
    \n## 2.3.3.1. Variable reduction method\n\nVariable reduction methods [18], often\
    \ used in regression analysis, use $p$-values to select meaningful explanatory\
    \ variables. In regression analysis, a method called variable reduction allows\
    \ us to simplify the model by removing unnecessary variables. This not only makes\
    \ the model easier to interpret but also prevents overlearning. It can also be\
    \ used to derive a PDE from physical data, which will be discussed later. A PDE\
    \ can be derived by searching for a model in which a partial differential term\
    \ (often a time partial differential term) is explained by several other differential\
    \ terms (often spatial partial differential terms). Using variable reduction methods,\
    \ it is possible to delete unnecessary partial differential terms from many candidates.\n\
    \nVariable reduction with $p$-values is a method that uses statistical methods\
    \ to select explanatory variables used in regression analysis that are significantly\
    \ related to the explained variable. The $p$-value represents the probability\
    \ that a hypothesis is true. $p$-value-based variable reduction methods determine\
    \ whether each explanatory variable is significantly related to the explained\
    \ variable based on the $p$-value of the regression model using that explanatory\
    \ variable. If the $p$-value is smaller than the significance level (usually 0.05\
    \ or 0.01), the explanatory variable is interpreted as significantly related to\
    \ the explained variable. Therefore, if the $p$-value is above the significance\
    \ level, the explanatory variable is deleted from the model.\n\nThe variable reduction\
    \ method using $p$-values is a type of backward selection method. It has the advantage\
    \ of being less sensitive to the order in which variables are added since all\
    \ explanatory variables can be evaluated simultaneously, rather than adding variables\
    \ one by one. Using the Data Analysis tools in Excel, regression analysis can\
    \ be converted to a macro, and the steps described earlier can be performed in\
    \ VBA to create an automatic variable reduction method.\n\n## 2.3.3.2. Autoregression\n\
    \nThe Data Analysis tools in Excel allow you to perform autoregressions [19].\
    \ An AR (autoregressive) model is one of the methods to analyze time series data.\
    \ Autoregressive models allow you to analyze trends and periodicity of time series\
    \ data by assuming that the current values of time series data are determined\
    \ by past data values and by building such models. The autoregressive model is\
    \ expressed by the following equation:\n\ny(t) = c + varphi _ {1} y(t - 1) + varphi\
    \ _ {2} y(t - 2) + ... + varepsilon (t) \\tag{2.16}\n\nIn this equation, $y(t)$\
    \ represents the current value of the time series data, c represents a constant,\
    \ $\\varphi _ {1}, \\varphi _ {2}, ...$ represent the autoregressive coefficients,\
    \ and $\\varepsilon (t)$ represents the error term. The larger the autoregressive\
    \ coefficient, the stronger the influence of the past data values. The error term\
    \ represents the random noise in the time series data. Autoregressive models may\
    \ be used for predicting or filtering time series data.\n\nTo perform an autoregression\
    \ using Regression in the Data Analysis tools in Excel, follow the given steps:\
    \ Use actual data recorded hourly of the water level of the Oyodo River at the\
    \ Hiwatashi point on September 16, 1990.\n\n(1) Insert time data in the first\
    \ column and water level data in the second column. Time is equally spaced from\
    \ top to bottom (Figure 2.16).\n\n| Time | Water level |\n| :--- | :--- |\n| 9/16/90\
