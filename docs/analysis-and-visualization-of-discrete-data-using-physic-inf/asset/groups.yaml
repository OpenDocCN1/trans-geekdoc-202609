    # 1.1.9. Introduction of PDE derivation with Excel


    This section introduces how to use data analysis (regression analysis) in Excel
    to derive a PDE from the given data; detailed operations will be described in
    subsequent sections. Regression analysis is a method of analyzing the degree of
    impact (weight) of two or more explanatory variables on an objective variable.
    As a concrete example, consider a model that describes the annual sales of a restaurant.
    Each restaurant corresponds to a row in Excel. In each row, enter annual sales
    (unit: 10,000 yen), the number of seats (number), walking time from the nearest
    station (minutes), and presence/absence of breakfast (0, 1). The regression analysis
    tool allows you to easily create a formula that explains annual sales by adding
    a weight to each of the following explanatory variables, and an intercept: Number
    of seats (number), walking time from the nearest station (minutes), and presence/absence
    of breakfast (0, 1) (Figure 1.10).


    This is an introductory exercise for general regression analysis techniques, but
    it provides a tip for developing a data-driven method for deriving a PDE (Figure
    1.11). For example, enter the partial derivatives,


    $u_{t}, u_{x}, u_{y}u_{xx}, u_{yy}$


    | Store | AS: Annual sales (10,000 yen) | NS: Number of seats | WT: Walking time
    from station (minutes) | B: Presence or absence of breakfast (Yes = 1, No = 0)
    | NP: Number of store limited products (pieces) |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | A | 7800 | 54 | 6 | 0 | 2 |

    | B | 8718 | 75 | 3 | 1 | 4 |

    | C | 9401 | 80 | 1.5 | 1 | 5 |

    | D | 8596 | 85 | 4 | 1 | 1 |

    | E | 7235 | 40 | 7 | 0 | 0 |

    | F | 9396 | 76 | 1.5 | 1 | 6 |

    | G | 7749 | 45 | 9 | 0 | 2 |

    | H | 9288 | 70 | 2 | 1 | 6 |

    | I | 7581 | 50 | 7 | 0 | 1 |

    | J | 8434 | 78 | 8 | 1 | 4 |

    | | AS=25*NS-100*WT+350*B+7400 | | | | |

    | | These coefficients are estimated by using the regression analysis | | | |
    |


    Figure 1.10. Explanation of sales using regression analysis.'
