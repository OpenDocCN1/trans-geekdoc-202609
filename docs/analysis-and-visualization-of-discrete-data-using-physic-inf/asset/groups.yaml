    ## 2.5.2. 回归分析的实现


    我们已经讨论了使用 Excel 中的数据分析工具进行回归分析。也可以利用规划求解（Solver）来执行回归分析。


    现在，我们来确定代表回归线的简单回归方程中的误差。假设能够成功拟合 $N$ 个离散点的回归线方程为 $y = \beta_0 + \beta_1 x$。对于第
    $i$ 个点，在 $y$ 轴方向上的误差为 $e_i = y_i - (\beta_0 + \beta_1 x_i)$。该误差的平方和为


    $$\sum_{i=1}^{N} e_i^2 = \sum_{i=1}^{N} (y_i - (\beta_0 + \beta_1 x_i))^2 \quad
    (2.21)$$


    （图 2.23）。


    为了计算使误差最小的方程系数 $(\beta_0, \beta_1)$，我们按照以下步骤使用规划求解（图 2.24）：


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_78_0.png)


    $$\sum_{i=1}^{N} e_i^2 = \sum_{i=1}^{N}(y_i - (\beta_0 + \beta_1x_i))^2$$


    图 2.23. 回归线误差的平方和。


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_78_1.png)


    首先，将五个离散数据点输入 Excel 工作表的 A2:B6 单元格。然后，将误差平方公式 `=($D$2*$A2+$E$2-B2)^2` 输入到 C2 单元格。回归线的斜率和截距
    $((\beta_0, \beta_1))$ 设置为初始值 (D2, E2) = (1,1)，并采用绝对引用。相比之下，坐标值 (A2, B2) 采用相对引用。接下来，向下复制
    C2 单元格中误差平方公式的四行。在 C8 单元格中写入计算这五行误差平方平均值的公式。按照以下步骤执行规划求解：


    - (1) 在 Excel 中点击 [数据] 选项卡，然后点击 [规划求解]。

    - (2) 在“规划求解参数”对话框中，在 [设置目标] 中选择“C8”。

    - (3) 在同一对话框的“目标”选项中，选择 [最小值] 作为目标值。

    - (4) 在同一对话框中，在 [更改可变单元格] 中设置“D2:E2”。

    - (5) 在同一对话框中，对于 [添加约束]，确定回归线无需设置约束条件。

    - (6) 在同一对话框中，取消勾选 [使无约束变量非负]。

    - (7) 在同一对话框中，在“选择求解方法”中选择 [GRG 非线性]。

    - (8) 在同一对话框中，按 [求解] 按钮。


    在“规划求解结果”对话框中，勾选 [保留求解结果]，然后点击 [确定] 按钮。


    现在，通过 5 个点的坐标数据，已得到由规划求解计算出的斜率和截距。将这些结果与 Excel 散点图中显示的回归线的斜率和截距进行比较时，你会注意到结果大致一致。


    对于能够成功拟合 $N$ 个离散点的回归平面，我们首先考虑多重回归方程中的误差。能够成功拟合 $N$ 个离散点的回归平面方程是通过最小化均方误差找到的


    $$\sum_{i=1}^{N} e_{i}^{2} / N = \sum_{i=1}^{N}(z_{i} - (\beta_{0} + \beta_{1}
    x_{i} + \beta_{2} y_{i}))^{2} / N. \tag{2.22}$$


    为了展示一个具体示例，让我们从 $N = 26$ 个点的坐标数据中找出回归平面。


    首先，将 26 个离散点数据输入 Excel 工作表中的单元格区域“B2:C27”。B 列代表 $X$，C 列代表 $Y$。这些坐标数据是从 $\{(x,
    y) \mid 0 \leq x \leq 1, 0 \leq y \leq 1\}$ 中随机选取的。对于 $X$ 和 $Y$，使用以下公式计算 $Z$ 的值并将其输入到
    A 列：


    $$z = x^{2} + x + y^{3} + y^{2} \tag{2.23}$$


    接下来，点击 [数据分析] — [回归]。在 [输入 $X$ 变量范围] 中选择 B 列和 C 列作为解释变量，在 [输入 $Y$ 变量范围] 中选择 A
    列作为目标函数。在 [输出区域] 中选择 G2（参见图 2.25 的上半部分）。检查此时得到的系数（截距、$X$ 的系数和 $Y$ 的系数）是否与通过规划求解最小化均方误差得到的系数相同。


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_80_0.png)


    使用暂时确定的 D2 处的系数（存储在 P18:P20）和坐标数据（存储在 B2:C2）计算以下公式，并将得到的值标记为 Z''：


    ```

    P$18+MMULT (B2:C2, $P$19:$P$20)

    ```


    在 E2 单元格中写入误差平方公式 `(A2-D2)^2`。接下来，向下复制 E2 单元格 25 行以计算误差平方。然后，在 E29 单元格中写入计算这 26
    行误差平方平均值的公式。


    按照以下步骤执行规划求解：


    - 1. 在 Excel 中点击 [数据] 选项卡，然后点击 [规划求解]。

    - 2. 在“规划求解参数”对话框中，在 [设置目标] 中选择“E29”。

    - 3. 在同一对话框的“目标”选项中，选择 [最小值] 作为目标值。

    - 4. 在同一对话框中，在 [更改可变单元格] 中设置“P18:P20”。

    - 5. 在同一对话框中，对于 [添加约束]，确定回归线无需设置约束条件。

    - 6. 在同一对话框中，取消勾选 [使无约束变量非负]。

    - 7. 在同一对话框中，在“选择求解方法”中选择 [GRG 非线性]。

    - 8. 在同一对话框中，按 [求解] 按钮。


    在“规划求解结果”对话框中，勾选 [保留求解结果]，然后点击 [确定] 按钮。


    现在，通过 26 个点的坐标数据，已得到由规划求解计算出的系数。也就是说，使用规划求解从 $N=26$ 个离散点数据 $(X, Y)$（随机选自 $\{(x,
    y)|0 \leq x \leq 1, 0 \leq y \leq 1\}$）创建了线性回归模型。均方误差为 0.0402。将这些结果与 Excel 分析工具中回归分析得到的系数进行比较时，你会注意到它们大致一致（参见图
    2.25 的下半部分）。


