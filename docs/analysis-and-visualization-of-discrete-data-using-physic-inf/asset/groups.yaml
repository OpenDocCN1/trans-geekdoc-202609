    \ 15:00 | 0.27 |\n| 9/16/90 16:00 | 0.27 |\n| 9/16/90 17:00 | 0.27 |\n| 9/16/90\
    \ 18:00 | 0.27 |\n| 9/16/90 19:00 | 0.27 |\n| 9/16/90 20:00 | 0.27 |\n| 9/16/90\
    \ 21:00 | 0.29 |\n| 9/16/90 22:00 | 0.3 |\n\n![](img/fa57e7010b16a211d5cf69ebb17e416e_62_0.png)\n"
