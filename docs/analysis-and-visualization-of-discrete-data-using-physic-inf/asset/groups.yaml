    it is used in various applications such as home appliances (washing machines,
    vacuum cleaners), EV drives, and industrial applications. The rotor of the SRM
    is equipped with multiple protrusions to rotate using magnetic resistance. When
    the rotor rotates, the air flowing between the protrusions causes more wind loss
    than a normal cylindrical rotor, resulting in a rise in the average temperature
    of the rotor surface (Figure 5.2).


