    回归分析的结果也显示了用于移除对目标变量贡献不大的设计变量的指标。因此，这使得创建紧凑模型变得更加容易。图 5.4 展示了使用 Excel 数据分析工具包进行回归分析的结果（三个设计变量）。在结果中，存储设计变量系数及其
    P 值的单元格分别填充了米色和蓝色。


    此外，Excel 规划求解器工具可用于创建精度更高的代理模型（SM）。借助此功能，用户可以无需编程即可执行回归分析和神经网络（NN）建模。如前所述，Excel
    规划求解器是一种功能，它将公式计算的结果设为目标值，指定多个约束条件以获得该结果，并改变任意单元格以寻找最优值。要使用规划求解器，用户必须像启用数据分析工具包一样启用规划求解器加载项。使用与优化相关的数学方法，在指定范围内获取最大值和最小值等。为了设置目标值，指定在目标单元格中输出计算结果的单元格，并将要改变值的单元格组指定为变量单元格。在执行上述步骤后按下“求解”按钮时，目标单元格中将提供最优值。


    要使用 Excel 规划求解器执行回归分析，首先在工作表上计算回归预测值与仿真结果之间差异的误差平方和，并将该结果指定为目标单元格。接下来，通过指定回归分析的每个系数作为变量单元格并运行规划求解器以最小化目标单元格，即可计算回归系数。您可以通过在
    Excel 数据分析工具包中创建相同的模型并检查结果，来验证此计算是否正确。


    要使用 Excel 规划求解器创建 NN 模型，需要应用一个执行非线性变换的激活函数到回归分析的输出上，该输出被用作新的输出。这样就创建了一层 NN 模型。图
    5.5 展示了使用 Excel 规划求解器创建的 NN 模型及其回归分析结果。自变量在规则网格上变化，其目标函数值以三维形式进行可视化。


    使用第二章第七节第三段中描述的扩展神经网络（ExNN），可以通过指定所需的层数和每层的神经元数量来构建深度学习模型。在这种情况下，NN 模型中的目标单元格被称为损失函数。NN
    模型的优势在于从数学角度上它满足通用逼近理论。如前所述，该定理指出“由一个具有有限数量神经元的隐藏层组成的 NN 在某些条件下可以逼近任意连续函数”。这是
    NN 拥有众多应用领域的背景理论。


    ### 5.1.2. 对基于物理学习的期望


    一些计算机辅助工程（CAE）工程师担心代理模型的准确性。这是因为即使 NN 从数学角度来看精度很高，也无法确定其在物理上是正确的。对于 CAE 工程师感兴趣的
    CAE 模型，存在对应的偏微分方程（PDE）；因此，提出了一种利用基于物理学习（PINNs）以实现更高精度的技术。基于物理的学习使用自动微分，首先计算 NN
    模型的任意偏导数值，以计算 PDE 残差。这里，自动微分是指一种高效且准确地计算由计算机程序表示的函数的技术。接下来，通过将 PDE 残差添加到 NN 模型的损失函数中，该技术构建了具有更高物理精度的
    NN 模型。其应用范围正在扩展到从大数据中进行 PDE 推导和寻找解。仅使用 Excel 执行相同任务并非不可能。但是 Excel 将需要使用诸如 Tensorflow
    之类的深度学习框架来高效计算目标变量相对于设计变量的偏导数。


    ## 5.2. 在碳中和（CN）中的应用


    预计 SM 将被用于基于科学发现制定碳中和政策。这是因为基于公民测量的环境数据对计算科学仿真模型进行假设分析（what-if analyses），在实现公民循证决策（EBPM）方面发挥着重要作用。EBPM
    是一种实践，它为明确定义的政策目标使用合理的依据（证据），而不是依赖临时性的事件进行政策规划 [49]。利用与测量与碳中和相关的影响政策效果有重要相关性的数据（如计算模拟）来推动
    EBPM，将增强政策的有效性，并有助于增强公民对政府的信任。


    例如，通过采用具有增强太阳反射性能的遮阳路面、屋顶绿化、墙面绿化等措施，已经实现了热岛现象的控制。基于计算科学的仿真预计将在评估此类遮阳路面的有效性方面发挥重要作用，但尚未供公民使用。解决此问题的一种方案是高度期待面向没有计算模拟经验或知识的普通公众的基于物理的代理模型。


    一旦此类模型可用，即使没有计算模拟的经验或知识，任何对政策制定感兴趣的公民也可以被假定为对假设分析有一些想法。以热问题为例，当许多公民关注建筑材料的热辐射特性及其对温度的影响时，专家会以不同的热辐射特征运行计算模拟，并使用深度学习创建由热辐射特性解释温度的模型。由于该模型允许在无需实际计算模拟的情况下从热辐射特性评估温度，因此可以将其归类为代理模型。使用代理模型，关注热问题的公民可以执行假设分析。代理模型从统计角度提高了精度，但这并不保证物理有效性。


    为了确保物理有效性，可以在代理模型中采用 PINNs。在 PINNs 中，测量环境数据以推导 PDE 等物理模型，然后公民和其他相关方使用各种环境参数求解
    PDE。在 PINNs 中，时空坐标被输入到输入层，并构建由输出层的计算结果及其坐标相关的物理数据组成的损失函数。接下来，对 NN 模型执行自动微分操作，将
    PDE 残差和正则化项添加到损失函数中。此操作允许构建保证具有物理有效性的代理模型。


    这种基于物理的代理模型可用于辅助生成证据以制定环境政策。政策制定始于明确问题，而假设分析在此阶段对于识别问题以及估算影响问题的因素至关重要。虽然气温和热指数等环境数据是我们关注全球变暖问题的焦点，但确定影响它们的因素需要检查物理定律以及直觉和经验。基于物理的代理模型发挥着重要作用，因为并非许多政策制定官员专门从事物理学科。为了在政策制定中利用具有物理有效性的代理模型，有必要将物理适当纳入代理模型中。


