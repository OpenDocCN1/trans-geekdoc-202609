    Next, the essential partial differential terms that make up the PDE are selected.
    For the NN model, the regularized regression equation (RRE) is constructed using
    automatic differentiation (AD). If, as PDE, the first-order time partial derivative
    is expressed as a linear sum of spatial partial derivative terms, the relationship
    in given $N_u$ space-time coordinates is expressed using the following regression
    equation:


    $\mathbf{u}_t = \mathbf{\Theta}\boldsymbol{\varepsilon}$


    where $\mathbf{u}_t$ is a vector consisting of first-order time partial derivative
    values, $\mathbf{\Theta}$ is a matrix consisting of spatial partial derivative
    values at each level, and $\boldsymbol{\varepsilon}$ is the coefficient of their
    spatial partial derivative values. $\Theta$ is the number of measured points,
    that is, the number of space-time coordinates $N_P$. There is no clear standard
    as to how far to include candidates for space-time partial differential terms
    in this regression equation. It is thus important to utilize visual analysis which
    can effectively use knowledge of experts. Next, constraints are added to this
    regression equation to construct RRE. One of the features of the RRE is that in
    the selection of the partial differential term, unnecessary partial differential
    terms are automatically eliminated, allowing the selection of essential partial
    differential terms. This is called the RRE error ($E_{\mathrm{RRE}}$) because
    the value of RRE does not become zero during the construction of the NN model.


    ```

    $$E_{\mathrm{RRE}} = \frac{1}{N_P} \| \mathbf{\Theta}\boldsymbol{\varepsilon}
    - \mathbf{u}_t \|_2^2 + \lambda \frac{1}{N_{\boldsymbol{\varepsilon}}} \| \boldsymbol{\varepsilon}
    \|_2^2 \quad \text{(4.1)}$$

    ```


    Using the coefficient $\hat{\boldsymbol{\varepsilon}}$ of the spatial partial
    derivative obtained by minimizing $E_{\mathrm{RRE}}$, the **PDE derivation error**
    can be defined by the following equation:


    ```

    $$E_{\boldsymbol{\varepsilon}} = \frac{1}{N_{\boldsymbol{\varepsilon}}} \| \hat{\boldsymbol{\varepsilon}}
    - \boldsymbol{\varepsilon} \|_2^2 \quad \text{(4.2)}$$

    ```


    where $\boldsymbol{\varepsilon}$ is known based on the assumption that the PDE
    is given. $N_{\boldsymbol{\varepsilon}}$ is the number of partial differential
    term candidates.


    For example, as a PDE with an exact solution, if we focus on the following three-dimensional
    advection-diffusion equation, the PDE becomes'
