    $(x)$ 以及导数值 $x_t, x_{tt}$。$x_{tt}, x_t, x$ 的回归分析工具允许你分析位置和速度对 $x_{tt}$ 的影响程度。由此，推导出一个描述物理数据的偏微分方程

