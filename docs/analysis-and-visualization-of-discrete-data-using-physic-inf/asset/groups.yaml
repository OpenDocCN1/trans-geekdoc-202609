    # **4.3. Methods for solving a given PDE**


    This book has so far described methods for deriving PDEs from physical data using
    NN models. As discussed earlier, this book assumes that physical data consist
    of the space-time coordinates at which the data are defined and the physical data
    associated with those coordinates. In NN, the space-time coordinates are used
    as input and the physical data as output, and the function that approximates the
    physical data is regressed. This book assumes PDEs with an exact solution and
    regards the exact solution data of the PDE at multiple discrete space-time points
    as pseudo-measurement data. As an application example, for a PDE with an exact
    solution, this book discussed a method to find the original PDE with high accuracy
    by considering the results computed by randomly changing the space-time coordinates
    in the exact solution as the pseudo-measurement data. The relationship between
    the NN hyperparameters (number of layers and neurons) and the accuracy was then
    visualized.


    This section discusses a method for solving a given PDE using NN with boundary
    conditions (Dirichlet or Neumann type) described by space-time discrete points.
    The Dirichlet boundary condition is a type of boundary condition in PDE used when
    the value of a variable is given on the boundary. For example, it is used to describe
    temperature distributions, potential distributions, and fluid velocity distributions.


