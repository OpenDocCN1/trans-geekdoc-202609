    Figure 1.13. Derivation of advection equation.


    As described earlier, if the physical data are obtained and a partial derivative
    can be obtained for each piece of data, a PDE can be derived in a data-driven
    manner using an Excel analysis tool. The above example deals with a PDE consisting
    of linear terms where a constant coefficient is assumed for partial differential
    terms. Even for nonlinear terms where a coefficient is a function of physical
    data, they can be reduced to a regression analysis problem by integrating the
    nonlinear parts with partial differential terms.


    For the partial differential terms, if an exact solution is given, an exact differential
    value can be obtained. If not, the calculation of a differential value becomes
    an issue. One possible strategy is to obtain and differentiate an approximate
    function that distributes physical data continuously in some manner. One such
    approximate function that attracts attention is an approximate function based
    on neural network (NN). This will be discussed in Chapter 2.


    ### 1.2. Basic operations of Google Colab (Colab)


    Approximately 1000 rows of data can be processed with Excel; however, in order
    to understand data analysis techniques handling a large amount of data, Google
    Colab is used. Google Colab (Colab) is Google’s cloud environment for data analysis
    [2]. Colab allows you to start analyzing data immediately on your browser without
    requiring hardware or software. Data analysis in Colab has the following advantages:


    - Eliminates the need to set up hardware or software: Colab allows you to start
    analyzing right away and proceed with analysis without having to worry about preparation
    on a PC or server or installation of necessary tools.

    - Available in a browser so you can access it from any device: Colab runs in a
    browser so you can access it from any device, including your PC, smartphone, and
    tablet.

    - Works with a large amount of data: Colab, which works in Google''s cloud infrastructure,
    can handle large amounts of data.

    - Keeps a history of your work as you can proceed with work in a notebook format:
    Colab allows you to proceed with data analysis in a notebook format, so you can
    keep a history of your work. This enhances repeatability of your work and facilitates
    collaboration.


    Google Colaboratory (Colab for short) is a free cloud service provided by Google,
    where you can use the Jupyter notebook and Python to analyze data and build a
    model for machine learning. The following are some basic Colab operations:


    1. Creating a notebook.

    2. Opening a notebook.

    3. Saving a notebook.

    4. Sharing a notebook.

    5. Connecting a notebook.

    6. Running a notebook.

    7. Downloading a notebook.


    A Colab notebook has a "cell" in which to write text and code. A notebook is composed
    of multiple cells that can be edited directly in a web browser. The Colab notebook
    has two types of cell:


    - Code cell: A cell for writing Python code.

    - Text cell: A cell for describing text that can use Markdown notation to decorate
    your text (Figure 1.14).


    To create a new cell, click “+ Code” or “+ Text” in the menu bar. Alternatively,
    you can also copy and paste existing cells. To run each cell, click to select
    it and then press “Shift + Enter” or click the “➤” Run button in the cell.


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_21_0.png)


    Figure 1.14. Google Colab.


    #### 1.2.1. Code cell


    You can enter and execute a Python code in a code cell.


    - To create a code cell, click “+Cell” at the top of a Colab page.

    - To enter and run code, select a cell and click the Run button.


    Colab has Python libraries pre-installed, allowing you to program with popular
    libraries like TensorFlow [3], Keras [4], and Numpy [5]. Colab can also perform
    high-speed computation using GPU and can perform deep learning tasks such as machine
    learning and image recognition. Colab also has other functions, such as importing
    external data, saving them in Google Drive, and publishing them to GitHub.


    #### 1.2.2. Text cell


    The text cell allows you to write program descriptions, formulas, links, images,
    and more.


    - To create a text cell, click “+ Cell” at the top of a Colab page and select
    “Text”.

    - To enter text, select a cell and enter a sentence in it.


    You can use the Markdown notation to format headings, lists, and more. Colab text
    cells are very useful for writing descriptions and documents. In particular, they
    can be used to describe programs and interpret results.

