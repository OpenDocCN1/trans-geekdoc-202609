    Breusch–Pagan 检验作为方差异质性检验已被广泛提出。


    ### 2.3.2.2. Breusch–Pagan 检验


    Breusch–Pagan 检验 [17] 是一种测试残差中误差项是否独立的方法。具体而言，在回归分析中假设误差项是独立的，但实际上可能并非如此。在这些情况下，Breusch–Pagan
    检验可以检测到误差项不独立。得出的 p 值表明误差项是否独立。


    现在假设多元回归模型表述如下：


    $$y_{i} = \alpha + \beta_{1}x_{1,i} + \beta_{2}x_{2,i} + \cdots + \beta_{k}x_{k,i}
    + u_{i} \quad (2.10)$$


    误差确定如下：


    $$e_{i}=y_{i}-\alpha-\beta_{1}x_{1,i}-\beta_{2}x_{2,i}-\cdots-\beta_{k}x_{k,i}\tag{2.11}$$


    假设平方误差 $e_{i}^{2}$ 由类似的回归模型表示：


    $$e_{i}^{2} &=\delta_{0}+\delta_{1}x_{1,i}+\delta_{2}x_{2,i}+\cdots+\delta_{k}x_{k,i}+v_{i}
    \tag{2.12}$$


    然后，制定以下零假设 $H_{0}$：


    $$H_{0}:\delta_{1}=\delta_{2}=\cdots=\delta_{k}=0\tag{2.13}$$


    $H_{0}$ 的检验通过以下 F 值的 F 检验执行：


    $$\frac{(\mathrm{RSS}-\mathrm{TSS}) / k}{\mathrm{RSS} / (n-(k+1))}=\frac{(\mathrm{ESS})
    / k}{\mathrm{RSS} / (n-(k+1))}\sim F(k, n-(k+1))\tag{2.14}$$


    得出的 p 值表示如果零假设是“残差的方差与解释变量独立（即，满足同方差性）”的情况下，该假设为真的概率。p 值越小，零假设被拒绝的可能性越大，残差的方差取决于解释变量（即，不满足同方差性）。


    如果 p 值较小（通常小于 0.05 或更低），同方差性假设不满足。因此，有必要考虑改进模型或采用不同的统计方法。另一方面，如果 p 值足够大，则认为满足同方差性假设，回归分析的结果可以自信地使用。当我们使用**图
    1.12**中描述的销售额数据，以残差的平方作为目标函数进行回归分析时，我们发现有 F 值为 0.9472，这是相当高的（**图 2.14**）。


