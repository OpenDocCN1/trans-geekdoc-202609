    these laws into the model allows the PINN to make more accurate predictions than
    a conventional NN that does not consider physical constraints. The PINN is trained
    using a combination of supervised and unsupervised learning. The supervised learning
    is used to adapt the model to training data, while the unsupervised learning is
    used to apply physical constraints. This allows the model to learn from both data
    and the underlying laws of physics.


    In the PINN, the training data are spatiotemporal coordinates and physical data.
    The spatiotemporal coordinates are fed into the input layer. The weight parameters
    are optimized so that the NN results fit the physical data. This optimization
    represents supervised learning (Figure 3.1).


    Next, a PDE is constructed that represents the laws of physics from the NN model
    by differential operations. Weight parameters that are not optimized produce PDE
    residuals (Figure 3.2).


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_118_0.png)


    Figure 3.1. Supervised learning in PINNs.


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_119_0.png)


    Figure 3.2. PDE residuals in PINNs.


    To solve a PDE, a boundary condition is needed to fully determine the problem.
    The boundary condition provides information about the behavior of the system at
    the boundary of an analysis domain. In general, the analysis domain of the PDE
    has a boundary. For example, in the case of a two-dimensional PDE, the analysis
    domain is usually a plain with its boundary in the form of a line, circle, curve,
    and so on. This boundary must have the following boundary condition:


    - 1. *Dirichlet condition*: Specifies that the value of a solution is known on
    the boundary. For a temperature equation, for example, the Dirichlet condition
    specifies that a wall or surface temperature is known (Figure 3.3).

    - 2. *Neumann condition*: Specifies that the normal derivative of a solution is
    known on the boundary. For the heat conduction equation, for example, the Neumann
    condition specifies that heat flux is known on a wall or surface (Figure 3.4).


    The boundary condition, which is needed to solve a PDE, is always handled as part
    of the problem. It is important to set the boundary condition properly, failing
    which, one may not obtain a correct solution.


    The boundary condition required to solve a PDE is also constructed from the NN
    model, resulting in residuals. The Neumann condition requires a differential operation.
    The optimization of weight parameters is performed with the aim of zeroing out
    these residuals and represents unsupervised learning. The PINN calculates weight
    parameters that minimize a value obtained by adding these residuals to the loss
    function defined in supervised learning.


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_120_0.png)


    Figure 3.3. Dirichlet condition in PDE.


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_120_1.png)


    Figure 3.4. Neumann condition in PDE.


    Differentiation operations are required to construct a PDE that represents laws
    of physics from the PINN model and the Neumann boundary condition, so one of the
    important technologies that support the PINN is automatic differentiation. Automatic
    differentiation or algorithmic differentiation refers to a technique of analyzing
    a function defined in a program to derive a program that calculates a partial
    derivative value [24]. Even a complex program consists of combinations of basic
    arithmetic operations, such as addition, subtraction, multiplication, and division,
    and basic functions, such as exponential, logarithmic, and trigonometric functions.
    Automatic differentiation takes advantage of this feature to find a solution by
    repeatedly applying the chain rule to these arithmetic operations. Automatic differentiation
    allows you to obtain a partial derivative value automatically with less computational
    effort.


    ## 3.2. Automatic differentiation in NN


    This section describes how to calculate a 1st-order partial derivative with respect
    to an input variable of an FCNN, which is widely used in deep learning [25, 26].
    Figure 3.5 shows the structure of FCNN in PINN.


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_121_0.png)


    This NN is composed of an input layer and an output layer, with a hidden layer
    between them. The neurons in each layer are assumed to be fully connected to those
    in adjacent layers. The kth neuron $j$ in the $u_{j}^{l}$th layer is connected
    to the neurons in the $(k-1)$th layer, expressed as:


    $$u_{j}^{k}=\sigma_{j}^{k-1}\left(\sum_{i=1}^{n_{k-1}} w_{i, j}^{k-1} u_{i}^{k-1}\right)\tag{3.1}$$


    where $w_{i, j}^{k-1}$ is a weight for units $u_{i}^{k-1}$ to $u_{j}^{k}$, and
    $\sigma_{j}^{k}$ and $n_{k}$ represent an activation function for the jth neuron
    in the $k$ layer and the number of neurons, respectively.


    Let us assume that the sigmoid function $\sigma(x)=1 /\left(1+e^{-x}\right)$ is
    used as the activation function. The calculation is performed with the weight
    set to $w_{n_{k}, j}^{k}$ by setting bias for the kth layer to $u_{n_{k}}^{k}=1$.
    The following paragraphs describe how to calculate the 1st-order derivative $\frac{\partial
    u_{i}^{L+1}}{\partial u_{j}^{0}}$ for the input layer $u_{j}^{0}$ and for the
    output layer unit $u_{j}^{L+1}$.


    In the 1st-order derivative calculation, the chain rule is applied to decompose
    $\frac{\partial u_{i}^{L+1}}{\partial u_{j}^{0}}$ to construct an iterative procedure.
    $u_{j}^{k+1}$ is calculated using $u_{i}^{0}, u_{i}^{1}, \ldots, u_{i}^{k}$. Therefore,
    $u_{j}^{k+1}$ can be regarded as a composite function of $u_{i}^{0}, u_{i}^{1},
    \ldots, u_{i}^{k}$, and its partial derivative is calculated using the chain rule.
    A partial derivative with respect to the input variable is calculated by recursively
    applying the chain rule decomposition of the partial derivative to this composite
    function. In this procedure, $\frac{\partial u_{i}^{L+1}}{\partial u_{j}^{k}}$
    is decomposed according to the chain rule for intermediate variable $u_{i}^{1}$,
    and its subexpressions are further decomposed according to the chain rule for
    the intermediate variable $u_{i}^{2}$. The following formula is obtained by recursively
    repeating this decomposition process until the intermediate variable $u_{m_{L}}^{L}$
    is reached.


    $$\begin{gathered}\frac{\partial u_{j}^{L+1}}{\partial u_{i}^{0}}=\sum_{m_{1}=1}^{n_{1}}\left(\sum_{m_{2}=1}^{n_{2}}\left(\sum_{m_{3}=1}^{n_{3}}\left(\cdots\left(\sum_{m_{L}=1}^{n_{L}}\frac{\partial
    u_{j}^{L+1}}{\partial u_{m_{L}}^{L}}\frac{\partial u_{m_{L}}^{L}}{\partial u_{m_{L}-1}^{L-1}}\right)\cdots\right)\\\times
    \frac{\partial u_{m_{3}}^{3}}{\partial u_{m_{2}}^{2}}\frac{\partial u_{m_{2}}^{2}}{\partial
    u_{m_{1}}^{1}}\frac{\partial u_{m_{1}}^{1}}{\partial u_{i}^{0}}\right)\end{gathered}\tag{3.2}$$


    Based on this equation, a procedure is constructed that calculates a partial differential
    by propagating the NN in reverse order.


    For example, when the activation function is the sigmoid function, $\sigma(x)=1
    /\left(1+e^{-x}\right)$, the derivative can be expressed as $\sigma^{\prime}(x)=(1-\sigma)
    \sigma$ using the sigmoid function itself. The derivative between consecutive
    layers is expressed as follows:


    $$\frac{\partial u_{m_{k+1}}^{k+1}}{\partial u_{m_{k}}^{k}} = u_{m_{k+1}}^{k+1}
    (1 - u_{m_{k+1}}^{k+1}) w_{m_k,m_{k+1}}^{k} \quad \quad \quad \quad (3.3)$$


    Then, $\frac{\partial u_{j}^{k+1}}{\partial u_{i}^{k-1}}$ is decomposed according
    to the chain rule for partial differentiation with respect to the variable $u_{m}^{k}$
    in the $k$th layer. That is, a partial differentiation calculation that leaps
    one layer is performed as follows (Figure 3.6):


    $$\frac{\partial u_{m_{k+1}}^{k+1}}{\partial u_{m_{k-1}}^{k-1}} = \sum_{m_{k}=1}^{n_{k}}
    \frac{\partial u_{m_{k+1}}^{k+1}}{\partial u_{m_{k}}^{k}} \frac{\partial u_{m_{k}}^{k}}{\partial
    u_{m_{k-1}}^{k-1}} \quad \quad \quad \quad (3.4)$$


    where the subexpression in Equation (3.4) is calculated from Equation (3.3). Similarly,
    the derivative with respect to the $k-2$th layer variable $u_{m_{k-2}}^{k-2}$


