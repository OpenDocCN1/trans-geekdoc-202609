    < End >\n```\n\n这些消息表明，TensorFlow 被用于从 MNIST 数据集下载数据，并且下载的数据被用于训练 NN（神经网络）模型。该数据集包含手写数字图像及其对应的标签（数字类别）。\n\
    \n该模型使用五个 epoch 进行了训练。在一个 epoch 期间，训练数据集中的所有数据被学习一次。在每个 epoch 结束时，模型返回损失（loss）和正确率。损失是一个衡量模型预测与实际标签之间差异的指标。正确率表示模型正确预测的数据百分比。\n\
    \n最后，显示模型的准确率为 0.9429，这意味着模型可以识别手写数字的准确率约为 94.3%。这是模型使用测试数据集成功准确分类数字的百分比。\n\n\
    TensorFlow 是一个开源机器学习库，提供了用于执行各种机器学习任务的低级 API。Keras 是一个使用 TensorFlow 作为后端的高层 NN\
    \ 深度学习 API。Keras 建立在 TensorFlow 之上，隐藏了 TensorFlow 的低级操作，使得构建和训练 NN 变得更加容易。\n\n\
    ### 1.3. 本文档的组织结构\n\n本书以“基础篇”开始，其中描述了使用 Excel 进行数据分析的方法。在“基础篇”中，我们将解释均值和方差检验、使用\
    \ Excel 分析工具进行回归分析，以及如何使用 Excel 求解器实现 NN。此外，我们将演示自动微分，并介绍如何求解一个简单的 PDE（偏微分方程）。\n\
    \n在接下来的“实践篇”中，我们将解释如何使用 NN 创建时空模型。首先，我们将解释一种可视化由三维 CT 机拍摄的古代文献数据页面信息的方法。然后，我们将把根据融合反应堆电磁场分析结果计算出的磁力线组视为物理数据，并解释如何使用\
    \ NN 可视化等离子体区域。直到此处，处理的都是与时间无关的物理数据。\n\n作为一个高级应用，我们将解释如何使用 NN 推导描述物理数据的 PDE，以及如何使用\
    \ NN 求解该 PDE。最后，我们将演示代理模型（surrogate model）以及一些示例。代理模型通过将大规模数值模拟的条件等参数与物理数据联系起来，简化了\
    \ what-if 分析。\n\n## 第 2 章\n\n## 基础篇\n\n## 2.1. 背景\n\n### 2.1.1. 使用 NN 进行数据分析\n\
    \n本文档主要描述使用 NN 进行物理数据分析。NN 是人类颅神经系统神经元数学模型的组合（图 2.1）。NN 的概念受人类大脑机制（所有神经元之间的互连）的启发。NN\
    \ 指的是创建用于在计算机上表示大脑功能某些特征的数学模型。NN 是机器学习（ML）中的一种建模方法，它模仿人脑的工作机制，并非旨在准确建模大脑中的数十亿个神经元。它只是试图简化它使其可操作。在\
    \ NN 中，当输入数据（数值）时，这些数值通过权重传播到下一层。这类似于人脑中的过程序列，其中突触通过权重连接，神经元产生输出，然后连接到下一层。\n\n\
    NN 的应用领域包括模式识别和数据挖掘（例如，图像识别和推荐系统）。\n\nNN 广泛用于视频网站来分析发布在视频上的评论。具体来说，NN 结合自然语言处理技术执行评论的情感分析、主题分类、垃圾邮件过滤等。情感分析的目标是确定评论属于积极、消极还是中性类别。NN\
    \ 对情感分析很有用，因为它们可以捕捉单词和句子的含义。主题分类确定评论与哪个主题相关。例如，要对关于特定产品或服务的评论进行分类，NN 可以使用与该产品或服务相关的关键词创建分类器。垃圾邮件过滤旨在自动检测由垃圾信息者和机器人自动生成的评论。通过使用\
    \ NN，可以检测垃圾评论的特征模式并自动删除。使用 NN 进行评论分析可以帮助视频平台控制质量并改进产品和服务。\n\n![](img/fa57e7010b16a211d5cf69ebb17e416e_34_0.png)\n\
    \n图 2.1. 关于 NN（https://ledge.ai/neural-network/）。\n\n基于 NN 的方法在机器翻译中的引入极大地提高了翻译准确率。在机器翻译中，NN\
    \ 主要用于一种称为 NMT（神经机器翻译）的方法。NMT 使用一种称为序列到序列（Seq2Seq）模型的 NN 架构，将输入句子编码到潜在语义空间，然后解码以产生输出句子。\n\
    \n具体来说，NMT 使用两个 NN，称为编码器（encoders）和“解码器”（decoders）。编码器接收输入句子作为单词或字符序列，并将其转换为潜在语义空间。解码器接收由编码器创建的潜在语义空间作为输入，并对其进行解码以产生输出句子。在\
    \ NMT 中，编码器和解码器使用诸如 RNN（循环神经网络）、LSTM 和 GRU 等架构。这些架构有助于提高翻译的准确性，因为它们可以处理长序列并考虑翻译所需的上下文。NMT\
    \ 还可能在编码器与解码器之间结合一种称为“注意力”（attention）的机制。注意力是一种机制，它利用编码器的输出来确定编码器的输入句子的哪一部分应对应于解码器生成的句子的哪一部分，因此在翻译长句或复杂句子时非常有用。\n\
    \n在金融领域的股价预测中，NN 被用于基于过去的股价数据、经济指标和其他信息预测未来的股价。一般来说，NN 使用 MLP（多层感知机）和 LSTM（长短期记忆）等深度学习模型。股价预测主要有两种方法。一种是预测时间序列数据，另一种是预测未来趋势，例如股价的涨跌。\n\
    \n预测时间序列数据的目的是利用过去的股价数据和其他信息训练 NN 以预测未来的股价。例如，可以使用 LSTM 通过学习过去股价波动的模式来预测未来的股价。\n\
    \n相反，NN 在预测诸如股价上涨或下跌等趋势时主要被用作分类问题。目标是根据过去的股价波动和其他经济指标预测股价是上涨还是下跌。在这种情况下，使用诸如 MLP（多层感知机）和\
    \ CNN（卷积神经网络）等分类器。\n\n然而，由于许多因素影响股价预测，仅使用单个 NN 模型进行预测是困难的。因此，结合多个模型进行预测的集成学习（ensemble\
    \ learning）通常被使用。\n\n图像识别已成为自动驾驶开发中不可或缺的技术。使用 NN 的图像识别系统已经在实际应用中帮助驾驶员更快、更准确地识别周围物体。在自动驾驶中，NN\
    \ 被用于识别周围物体。一种典型的方法是从相机、雷达、激光雷达和传感器收集数据，并将这些信息作为输入数据输入 NN。然后，NN 从输入数据中提取特征值，并使用它们识别物体并提取位置、速度和方向等信息。一般来说，CNN（卷积神经网络）被广泛用于目标检测和分割。基于深度学习的目标检测模型，如\
    \ YOLO（You Only Look Once）、SSD（Single Shot Detection）和 Faster R-CNN 也被使用。这些模型可以提供快速且准确的目标检测。NN\
    \ 也用于自动化的其他方面，如车辆跟踪、车道识别和交通标志识别。\n\nNN 可以从内镜图像中检测胃癌，使其可用于实际应用中。NN 在图像分析方面取得了优异的结果，并用于各种领域。\n\
    \n为了检测胃癌，将内镜图像输入 NN 以识别最可能存在癌症的区域。具体来说，NN 现在可以自动识别胃内镜图像上最可能存在癌症的区域，并检测 6 毫米或更大的胃癌。\n"
