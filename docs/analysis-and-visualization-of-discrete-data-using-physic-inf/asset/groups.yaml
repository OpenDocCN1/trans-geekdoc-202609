    \n# 第 4 章\n\n# 高级应用篇\n\n## 4.1. 描述物理数据的偏微分方程（PDE）推导\n\n前述章节迄今为止讨论了在 NN 模型中使用偏导数的方法。所讨论的应用之一是可视化一个曲面，该曲面包裹基于核聚变反应堆电磁场模拟结果计算出的大量磁力线。为了进行有效的可视化，在损失函数中添加了一个约束条件，即曲面的法线垂直于磁通量密度向量。本节描述了如何使用\
    \ NN 推导描述与物理量相关的物理数据的 PDE。作为应用示例，本节针对具有精确解的 PDE，描述了如何通过将随机改变时空坐标后计算的结果视为伪测量数据，来高准确度地查找原始\
    \ PDE。\n\nPDE 包含未知多元函数及其偏导数。PDE 用于表述涉及多个变量的函数问题，并通过手动或计算机模型求解。顺便一提，常微分方程（ODE）表示为单变量及其导数的函数。本书假设\
    \ PDE 中物理量的时间偏导数由带有空间偏导数项的线性回归模型表示。但这也适用于其他情况。\n\n传统上，PDE 是根据菲克第一定律或连续性方程等物理定律推导的。例如，平流-扩散方程考虑两种类型的物质流——平流和扩散——并将这些流合成为总流。对该总流应用守恒定律即可推导出平流-扩散方程。这代表了一种演绎式的\
    \ PDE 推导方法。相比之下，本书描述了一种归纳式的方法。\n\n使用现有 PDE 的解释模型对于从流体、大气和宇宙现象等有趣科学事件以及 COVID-19\
    \ 感染等各种新发生事件的ビッグデータ（大数据）中获取洞察至关重要。\n\n当然，从日常现象中发现洞察也同样重要。例如，计算流体动力学（CFD）的使用对于笔记本电脑的散热是必不可少的。本质上，CFD\
    \ 基于对流-扩散方程。例如，在热流体现象中，如果笔记本电脑外壳中的散热效应占主导地位，则可以省略平流项。这是密集板载设计中经常采用的一种决定。在这种情况下，从热流体测量中推导\
