    # ### 5.1.2. Expectations for physics-based learning


    Some CAE engineers are concerned about the SM in terms of its accuracy. This is
    because even if the NN is highly accurate from a mathematical standpoint, there
    is no way to be sure that it is physically correct. For CAE models that CAE engineers
    are interested in, there is a corresponding PDE; thus, a technique that uses physics-based
    learning to achieve even higher accuracy, or PINNs, has been proposed. Physics-based
    learning uses automatic differentiation to first compute arbitrary partial differential
    values for an NN model to compute PDE residuals. Here, automatic differentiation
    refers to a technique for efficiently and accurately computing functions represented
    by computer programs. Next, by adding the PDE residuals to the loss function of
    the NN model, this technique builds an NN model with physically improved accuracy.
    Its range of applications is expanding to PDE derivation and finding solutions
    from big data. It is not impossible to perform the same task using Excel alone.
    But Excel would require the use of a deep learning framework such as Tensorflow
    to efficiently compute the partial derivatives of the objective variable for the
    design variables.


