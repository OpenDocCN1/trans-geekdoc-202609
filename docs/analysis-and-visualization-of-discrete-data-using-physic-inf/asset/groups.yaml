    一维KdV方程存在精确解。许多解析方法已用于求解该方程的精确解。特别是对于初值问题，Hirota方法和基于Miura变换的方法被用于获取精确解。根据具体条件，也存在适用于周期性边界条件和非周期性边界条件的精确解。KdV方程最著名的解之一是孤子（soliton）。孤子对初值问题具有精确解，波形保持不变，且波速和振幅不随时间和空间变化而改变。孤子解的形式如下：


    $$ u(x, t)=2 c_{1}\left[\operatorname{sech}^{2}\left(\frac{x-c_{2} t-c_{3}}{c_{4}}\right)\right]
    $$


    其中 $c_{1}$、$c_{2}$、$c_{3}$ 和 $c_{4}$ 是任意常数，$c_{1}$ 是孤子振幅，$c_{2}$ 是孤子速度，$c_{3}$
    是孤子的初始位置，$c_{4}$ 是孤子宽度。


    该解是通过根据初值问题的初始条件适当选择 $c_{1}$、$c_{2}$、$c_{3}$ 或 $c_{4}$ 获得的。该解对非线性具有很强的稳定性，波形保持不变，且波速和振幅不随时间和空间变化而改变。


    孤子解在多种物理现象中发挥着重要作用，包括波传播、波相互作用和非线性效应。


    在KdV方程的精确解中，对定义域 $x \in[0,10]$ 和 $t \in[0,10]$ 进行采样，并基于其坐标计算 $u(x, t)$。$x$ 的定义域被划分为256部分，并针对每个
    $\Delta t=0.1$ 计算解，将其视为伪测量数据。对于这些数据的空间观测点数为 $n_{x}=256$，时间观测点数为 $n_{t}=101$，数据集大小为
    $n_{d}=256856$。结果如图4.7顶部的彩色映射图所示。偏微分项候选库由九个偏微分项组成，包括正确的偏微分项（**加粗显示**），如下所示：


    $$ \Phi=\left[u_{x}, u_{x x}, \boldsymbol{u}_{x x x}, \boldsymbol{u u}_{x}, u
    u_{x x x}, u u u_{x x x}, u^{2} u_{x}, u^{2} u_{x x}, u^{2} u_{x x x}\right] $$


    首先，在N10中对KdV方程进行推导。激活函数为sigmoid函数，sigmoid $(x)$，训练数据集随机选择 $(n_{d} * 0.8)$ 个点。结果如


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_153_0.png)


    | | |

    | :--- | :--- |

    | 正确的PDE | $u_t + 6 u u_x + u_{xxx} = 0$ |

    | 识别的PDE（干净数据） | $u_t + 1.00009 u u_x = 0$ |


    图4.7. 使用扩展库进行一维KdV方程推导的结果。


    图4.7中间的彩色映射图展示了神经网络误差最小的结果。图4.7底部的彩色映射图显示了神经网络模型与精确解之间的误差分布 $\langle \hat{u} -
    u \rangle$。在误差分布下方还展示了固定时间下的数据分布 $\langle u(x,t) \, | \, t = 2.5, 5.0, 7.5 \rangle$。此外，图4.7的底行显示了推导出的PDE，表明由于库中候选偏导项数量过多，推导误差并不充分。


    当将库中的候选偏微分项限制为原始PDE中包含的项时，推导误差会降低。也就是说，如果偏微分项候选库配置为 $\Phi = [u u_x, u_{xxx}]$
    所示的形式，图4.8展示了精确解、神经网络模型、误差分布、固定时间下的数据分布以及推导出的PDE。


    图4.9和图4.10展示了在N10中计算KdV方程近似解时 $E_{int}$ 的平行坐标。


    ### 4.1.4.3. 一维Burgers方程


    在物理学中，特别是流体动力学中，Burgers方程是一个描述一维非线性波的二阶偏微分方程。这是最简单的


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_154_0.png)


    图4.8. 使用最小库进行一维KdV方程推导的结果。


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_154_1.png)


    图4.9. 使用扩展库的神经网络结构和 $E_{\text{int}}$。


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_155_0.png)


    包含非线性和耗散项的非线性偏微分方程。它首先由Burgers推导出来，并用于模拟河流河道[37]。Lighthill用它来模拟激波现象。他研究了其全局吸引子、惯性流形和近似流形的存在性，并获得了许多有意义的动力学性质。与Navier–Stokes方程不同的是，它去除了压力梯度项，并且不表现出湍流行为。它在工程和应用数学的多个领域中都有出现，包括流体力学、非线性声学、气体动力学和交通流。其形式如下：


    $$u_t + uu_x + \alpha u_{xx} = 0 \tag{4.14}$$


    其中 $\alpha$ 是扩散系数，在此示例中设置为0.1。初始条件为 $u(x, 0) = -\frac{2\alpha}{\phi}\frac{\partial
    \phi}{\partial x} + 4$。在此情况下，$\phi = e^{\frac{-x^2}{4\alpha}} + e^{\frac{-(x-2\pi)^2}{4\alpha}}$。该情况的精确解如下：


    $$u(x, t) = -\frac{0.2\,\partial \phi}{\phi\,\partial x} + 4 \tag{4.15}$$


    $$\phi = e^{\frac{-(x-4t)^2}{0.4(t+1)}} + e^{\frac{-(x-4t-2\pi)^2}{0.4(t+1)}}$$


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_156_0.png)


    与之前的示例不同，训练神经网络模型的数据集是通过使用传统谱方法模拟获得的。上述Burgers方程从初始时间 $t = 0$ 积分到结束时间 $t = \frac{\pi}{5}$。这在空间域
    $x \in [0, 2\pi]$ 中通过101种模式的傅里叶谱离散化以及时间步长为 $\pi / 500$ 的一阶显式Runge–Kutta时间积分器来实现。记录每个
    $\Delta t = \frac{\pi}{500}$ 的解以获得100个观测点。对于这些数据的 $n_x = 101$，$n_t = 100$，$n_d
    = 10100$。


    结果如图4.11顶部的彩色映射图所示。偏微分项候选库构建如下：


    $\boldsymbol{\Phi} = [u_x, \boldsymbol{u}_{xx}, u_{xxx}, \boldsymbol{u}\boldsymbol{u}_{x},
    uu_{xxx}, uu_{xxxx}, u^2u_x, u^2u_{xx}, u^2u_{xxx}]$


    首先，在N10中对Burgers方程进行推导。神经网络误差最小的结果如图4.11中间的彩色映射图所示。图4.11底部的彩色映射图显示了神经网络模型与精确解之间的误差分布
    $(\hat{u} - u)$。


    在误差分布下方还展示了固定时间下的数据分布 $\{u(x,t) \mid t = 2.5, 5.0, 7.5\}$。此外，图4.11的底行


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_157_0.png)


    | | | |

    | :--- | :--- | :--- |

    | | 正确的PDE | $u_t + uu_x + 0.1u_{xx} = 0$ |

    | | 识别的PDE（干净数据） | $u_t + 0.999757uu_x - 0.099821u_{xx} = 0$ |


    图4.12. 使用最小库进行一维Burgers方程推导的结果。


    展示了推导出的PDE，但由于库中候选偏导项数量过多，推导误差并不充分。


    当将库中的候选偏微分项最小化为仅包含精确项时，推导误差得以改善。也就是说，如果偏微分项候选库配置为 $\Phi = [uu_x, u_{xx}]$ 所示的形式，图4.12展示了精确解、神经网络模型、误差分布、固定时间下的数据分布以及推导出的PDE。


    图4.13和图4.14展示了在N10中计算Burgers方程近似解时 $E_{\text{int}}$ 的平行坐标。


    ### 4.1.4.4. 一维Poisson方程


    Poisson方程是一种用于描述某些物理量在时空中的分布的偏微分方程。具体而言，Poisson方程表述如下：


    $\nabla^2 u = -\rho \qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad (4.16)$


    其中 $u$ 是表示物理量分布的标量场，$\rho$ 是源项，例如空间中的电荷密度或质量密度。

