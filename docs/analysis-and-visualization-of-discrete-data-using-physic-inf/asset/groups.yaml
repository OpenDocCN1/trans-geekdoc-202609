    To perform a correlation analysis in Excel, insert the data and then select [Data
    Analysis] on the [Data] tab. Select [Correlation] in the dialog box to perform
    a correlation analysis. Correlation analysis allows you to calculate the relationship
    between two variables, which can then be expressed by a scatter plot or correlation
    coefficient. The correlation coefficient is a measure of how strong the relationship
    is between two types of data. It is expressed in the range of $-1$ to 1. The closer
    it is to 0, the weaker the correlation between variables, and the closer it is
    to 1, the stronger the correlation.


