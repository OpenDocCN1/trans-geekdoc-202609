    No research has been proposed on techniques to improve the accuracy of surrogate
    models using PINNs. In previous surrogate modeling, predictable locations were
    predetermined.


    For example, in Section 1, Paragraph 1, a numerical fluid analysis model of a
    rotor in a switched reluctance motor (SRM) was created, and a surrogate model
    that predicts rotor temperature using varying design parameters was explained.
    In temperature prediction, the surrogate model was able to derive a temperature
    surrogate model that could instantly compute with an error of less than 4.2%.
    Meanwhile, the ability to predict temperature in areas other than rotors remains
    to be achieved in the future. Another company has developed a finite element model
    that predicts the strength of burst plates in air conditioning compressors, and
    a physics-based surrogate model has been proposed to predict the strength of burst
    plates when design parameters are varied. Strength prediction by this surrogate
    model was found to be more than 1,000 times faster than performing a physics-based
    analysis. But the assurance of physical validity in addition to flexibility in
    specifying the location of strength prediction remains a future challenge.


    Physics-based surrogate modeling technology using PINNs, which will be developed
    through this research, is expected to be implemented in society. Specific examples
    are described in the following. Once the effectiveness of the physics-based surrogate
    modeling technique is confirmed for the simulation of the thermal environment
    of a specific city block, which requires a huge amount of computation time, it
    is expected that the technique will contribute to global warming mitigation and
    adaptation measures at the city, national, and global scales. Global warming countermeasures
    can be broadly classified into mitigation, which is the reduction of the emissions
    of greenhouse gases, the causal substances of global warming, and adaptation,
    which is to control adverse effects of global warming by adjusting natural ecosystems
    and social and economic systems in response to climate change. Mitigation measures
    control the effects on natural and human systems in general by controlling atmospheric
    greenhouse gas concentrations. On the other hand, adaptation measures are characterized
    by directly controlling the effects of global warming on specific systems.


    This section focuses on the verification of the effectiveness of radiant cooling
    materials to control heat problems as an example [48]. As the heat from the sun
    reaches the earth, the earth radiates the heat back into space, but some of the
    heat is absorbed by the greenhouse gases, increasing the energy of the gases and
    causing temperatures to rise. This radiative material attempts to release radiant
    heat from the earth into space through the atmosphere as a window and is expected
    to be an adaptive measure for global warming [50].


    The surrogate model described here can be used for what-if analysis, which is
    important in policymaking. Specifically, it allows for instant visualization of
    reliable results regarding where and what kind of heat control measures will reduce
    average summer temperatures. It can also instantly visualize changes in the possibility
    of levee breaches in relation to river levels. In order to effectively visualize
    data using surrogate models in policymaking meetings, it is necessary to design
    a user interface that is easy for citizens to use. In designing the user interface,
    citizens are interviewed in advance to determine what it should look like.


    ## Chapter 6


    ## Closing Remarks


    This book used specific examples to explain the methods for analyzing and visualizing
    physical data using NNs. The first part covered the spatially discrete data in
    which time is irrelevant and explained the following:


    - (1) Page information from ancient literature data captured with a three-dimensional
    CT machine.

    - (2) Explanation of a method for visualizing plasma regions with high accuracy
    from a magnetic field group computed from electromagnetic field analysis results
    in fusion reactors. Then, the following were explained using the physical data:

    - (1) Methods using NN to derive a PDE that explains its physical data.

    - (2) How to solve PDE using NN.


    We hope that this book will provide readers with hints for solving their problems.
    Now, we would like to conclude this book by suggesting some future directions
    for research in this area.


    In this book, we described how to use NN to find solutions to PDEs from physical
    data given as boundary conditions. Based on the definition given at the beginning,
    physical data consist of the space-time coordinates in which the data are defined,
    and the physical data associated with those coordinates. The PDE solution method
    is now in the process of being compared with conventional methods (FDM, FEM, PM,
    etc.) to determine how they are grouped. But considering the merits of using NN
    models, we believe that the future direction is to apply this method to surrogate
    models, which have recently been utilized more in computational engineering.


    In computational engineering, surrogate models are used when the results of interest
    cannot be easily computed [46]. Most engineering design problems require numerical
    simulation to evaluate the objective function as a function of design variables.
    For example, to find the optimal wing shape for an aircraft, engineers compute
    the airflow around the wing for various shape variables such as length, curvature,
    and material. However, for many real-world problems, a single numerical simulation
    may take minutes, hours, or even days to complete. As a result, routine tasks
    such as design optimization, design space exploration, sensitivity analysis, and
    what-if analysis become difficult to perform because they require thousands or
    millions of numerical simulation evaluations. One way to reduce this burden is
    to build an approximate model, called a surrogate model. In the last few years,
    surrogate models using NNs have been widely used. But these are simple approximate
    models that do not refer to the PDE that describes the target numerical simulation,
    and there are sometimes concerns about ensuring physical accuracy. To find a future
    direction for the surrogate model, one needs to consider how to deepen its relationship
    with PDEs.


    Suppose now that a numerical simulation is run with various boundary conditions,
    physical data in the region of interest are obtained, boundary conditions are
    entered into the NN input layer, and physical data are also entered into the NN
    output layer to construct an NN model. This NN model will be able to predict the
    physical data when unknown boundary conditions are given, without being affected
    by PDEs that explain the numerical simulation. This is the conventional surrogate
    model commonly used today (see lower left of Figure 6.1). The NN, which can be
    created by inputting the space-time coordinates that acquire physical data besides
    boundary conditions, can predict physical data from arbitrary space-time coordinates
    and boundary conditions. This is called a highly scalable surrogate model (see
    the lower part of Figure 6.1). It is surely more scalable, but physical validity
    remains untouched.


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_222_0.png)


    Figure 6.1. Physics-based surrogate model.


    The question we are asking here is whether we can incorporate PDE residuals in
    the process of building a surrogate model in order to improve the physical validity
    of the surrogate model? There are several answers to this question, but using
    PINNs is a sure way to achieve this. The NN model created by making it learn multiple
    boundary conditions can provide a place where arbitrary boundary condition data
    can be specified, and physical validity can also be guaranteed, resulting in a
    so-called highly accurate surrogate model (see lower right of Figure 6.1).

