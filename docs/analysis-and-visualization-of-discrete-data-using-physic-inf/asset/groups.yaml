    其中 $\varepsilon$ 表示 $\boldsymbol{\varepsilon}=\left[\varepsilon_{1,0} \ldots \varepsilon_{D,
    0} \varepsilon_{1,1} \ldots \varepsilon_{D, 1} \varepsilon_{2,2} \ldots \varepsilon_{2,
    D} \ldots \varepsilon_{D, D}\right]^{T}$，$\|\cdot\|_{2}^{2}$ 表示向量平方和。上述问题是一个凸优化问题，已提出多种实用算法。示例包括迭代收缩阈值算法、迭代重加权最小二乘法（IRLS）和前向-后向分裂法（F0BOS）。应用正则化回归可以强制某些系数设置为零。


    ### 4.1.3. 误差定义


    对于偏微分方程推导方法的评估，定义误差非常重要。除了神经网络模型误差（$E_{u}$）、正则化回归方程误差（$E_{RRE}$）和偏微分方程推导误差（$E_{\varepsilon}$）之外，对于具有精确解的偏微分方程，还可以定义偏导数项误差（$E_{u_{t},
    x, y, z, \ldots}$），如下所示：


    $$ E_{u_{t}, x, y, z, \ldots}=\|\hat{u}_{t, x, y, z, \ldots}-u_{t, x, y, z, \ldots}\|_{2}^{2}
    / N_{P}, \quad(4.6) $$


    其中 $\hat{u}_{t, x, y, z, \ldots}$ 和 $u_{t, x, y, z, \ldots}$ 分别是通过神经网络模型和精确解计算出的偏导数项。$\hat{u}_{t,
    x, y, z, \ldots}$ 和 $u_{t, x, y, z, \ldots}$ 可以通过自动微分计算，而 $u_{t, x, y, z, \ldots}$
    可以从精确解解析计算。例如，三维平流-扩散方程的精确解如下：


    $$ u(x, y, z, t) = \frac{1}{(4t+1)^{3/2}}e^{-\frac{(x-\varepsilon_x t-c_x)^2}{\varepsilon_{xx}(4t+1)}
    -\frac{(y-\varepsilon_y t-c_y)^2}{\varepsilon_{yy}(4t+1)} -\frac{(z-\varepsilon_z
    t-c_z)^2}{\varepsilon_{zz}(4t+1)}}}\tag{4.7} $$


    其中 $c_x, c_y, c_z$ 是由初始条件确定的常数。在以下文中，偏导数项根据实际情况记为：$u_x = \frac{\partial u}{\partial
    x}$。


    使用神经网络进行偏微分方程推导可以揭示每种误差与神经网络的元参数之间的关系，如层数和每层神经元的数量，以及时空离散点（$N_L, N_N, N_P$）。在参数空间中误差分布的可视化有助于明确能够同时最大化神经网络模型误差和正则化回归方程误差的神经网络结构的需求。因此，神经网络模型、偏微分方程偏导数项、正则化回归方程和偏微分方程推导的误差可以表示为层数（$N_L$）、神经网络模型中神经元数量（$N_N$）以及离散点数量（$N_P$）的函数。


    在三维平流-扩散方程推导的情况下，模型使用神经网络构建，随后使用正则化回归分析选择偏导数项。关于误差评估，当每层神经元数量保持不变且离散点数量也保持恒定时，每种误差作为
    $(N_L, N_N)$ 的函数以热图形式显示，在每个误差最小的点之间存在间隙 [25]。为了解决这个问题，整合了两种参数优化。也就是说，我们开发了一种方法，将
    $E_u$ 和 $E_{RRE}$ 相加以建立单个目标函数（损失函数），并寻找最小化该函数的合适神经网络结构（图 4.2）。在偏微分方程推导中，方程 (4.2)
    中的偏微分方程推导误差 $E_{\varepsilon}$ 也起着重要作用，因此，如果预先知道正确的偏微分方程，我们将定义整合误差 $E_{\text{int}}
    = E_u * E_{PDE} * E_{\varepsilon}$。


    ### 4.1.4. 偏微分方程推导示例


