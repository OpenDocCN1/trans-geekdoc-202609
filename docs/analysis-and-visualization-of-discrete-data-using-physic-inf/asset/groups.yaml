    \ PDE。\n\n使用宇宙学大数据推导 PDE 的技术也被期望对太空科学做出贡献。1917 年，爱因斯坦在他的方程中添加了一个宇宙学项（一种偏导数项），以抵消重力的影响，从而得出了静态解。1929\
    \ 年，埃德温·哈勃发现了宇宙的膨胀，爱因斯坦撤回了宇宙学项的想法。1998 年，超新星的观测表明，宇宙在过去五十亿年间的膨胀一直在加速，而不是减慢。在不久的将来，PDE\
    \ 推导技术应该在为爱因斯坦方程中宇宙学项的存在提供证据方面发挥重要作用。\n\n目前，基于大数据的 PDE 推导研究仍处于初步技术研发阶段。本书假设具有精确解的\
