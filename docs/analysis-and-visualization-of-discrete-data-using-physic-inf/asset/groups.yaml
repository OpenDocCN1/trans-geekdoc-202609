    Range”, specify the cell to which statistics will be output.

    5. After clicking [OK], the results of the *t*-Test are output to the specified
    cell (Figure 2.8).


    Generally, a test of variance is performed prior to performing a test of the mean.
    If the resulting variances are not equal, use the [*t*-test: Two-Sample Assuming
    Unequal Variances] to test the mean. In a *t*-test, the difference from the hypothetical
    mean represents the difference that exists between the population mean (or another
    sample mean) and the sample mean. Often, this value is set to zero. In *t*-testing,
    one-tailed tests and two-tailed tests are the testing methods used for hypothesis
    testing.


    The one-tailed test is used to test whether the hypothetical mean is greater than
    or less than the sample mean. In other words, the one-tailed test determines whether
    the hypothesized mean is on the larger (upper) side or the smaller (lower) side.
    For example, if a drug is hypothesized to have an average 5-kg weight loss effect,
    a one-tailed test would determine whether the drug’s efficacy is greater than
    5 kg.


    A two-tailed test, on the other hand, is used to test whether the hypothesized
    mean is different from the sample mean. In other words, a two-tailed test checks
    whether the hypothetical mean and the sample mean differ in either direction.
    For example, if a drug is hypothesized to have an average weight loss effect of
    5 kg, a two-tailed test would determine whether the drug’s efficacy differs from
    5 kg.


    One-tailed tests and two-tailed tests are used differently depending on the objective
    of the hypothesis test. One-tailed tests are used when testing a hypothesis that
    is restricted in one direction. The calculation of the *p*-value (the probability
    of observing extreme values above the test statistic obtained under the assumption
    that the null hypothesis is true) depends on whether the results are from an upper-
    or lower-tailed test. A two-tailed test, on the other hand, is used when the hypotheses
    may differ in either direction.


