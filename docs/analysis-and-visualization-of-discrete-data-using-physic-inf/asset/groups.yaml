    ## 4.2. 可视化分析技术的应用


    迄今为止，本书已介绍了使用神经网络（NN）从物理数据中推导并求解偏微分方程（PDE）的方法。如前所述，本书假设物理数据由定义这些数据时空坐标以及与这些坐标相关的物理数据组成。在
    NN 中，时空坐标被用作输入，物理数据作为输出，并且对近似物理数据的函数进行回归。然而，以下两个方面在很大程度上仍留给人类处理：


    - (1) 构建何种类型的 NN

    - (2) 如何构建偏微分方程项库


    因此，开发强调视觉探索重要性以及自动构建模型过程的视觉分析（VA）方法是可取的。


    关于结果的准确性，观察到了其与 NN 超参数之间的关系。然而，增加 NN 的复杂性（层数、每层神经元数量等）并不一定能提高准确性。因此，优化 NN 超参数是未来的一个重要问题。除了简单地使用自动化技术外，重要的是构建能够利用用户判断的超参数可视化基础设施。


    在 NN 中，每层的单位数量是可变的。例如，AutoEncoder（自编码器）是一种使用 NN 进行降维的算法，其结构特点是单位数量从输入层开始逐渐减少，然后增加。作为一种自然表示此类参数的可视化方法，NN
    由具有层数（维度）上限的多维坐标点表示。预期效果是执行降维并将误差值映射到二维或三维空间中的可视化方法（图 4.35）。


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_180_0.png)


    图 4.35. NN 超参数的可视化。


    图 4.35 底部行中的单元格矩阵（最后一格为误差值）的每一行中输入了每层的单位数量。在第一行中，NN 由两层组成，表明每层分配了 80 个单位。用户在散点图上交互式地选择低误差的点组（图
    4.35 中有九个），并通过平行坐标进行可视化。平行坐标将多维数据的每个维度分配给一个平行坐标轴，并将其表示为连接每个维度值的折线。最右侧的坐标轴代表误差。该折线是多维空间中的一个坐标点。NN
    标签及其简化表示显示在单元格矩阵左端的左侧。在图 4.35 所示的示例中，选定了与红色点对应的 NN7。这表明对于 NN2 和 NN6，尽管单位数量模式相同且层数更多，但误差却更大。


    ## 4.3. 求解给定偏微分方程的方法


    迄今为止，本书已介绍了使用 NN 模型从物理数据中推导偏微分方程的方法。如前所述，本书假设物理数据由定义这些数据的时空坐标以及与这些坐标相关的物理数据组成。在
    NN 中，时空坐标被用作输入，物理数据作为输出，并且对近似物理数据的函数进行回归。本书假设偏微分方程具有精确解，并将偏微分方程在多个离散时空点的精确解数据视为伪测量数据。作为应用示例，对于具有精确解的偏微分方程，本书讨论了通过考虑将精确解中随机改变时空坐标的计算结果作为伪测量数据，从而以高精度找到原始偏微分方程的方法。随后可视化了
    NN 超参数（层数和神经元数量）与准确性之间的关系。


    本节讨论了使用 NN 求解给定偏微分方程的方法，该方程的边界条件（Dirichlet 或 Neumann 类型）由时空离散点描述。Dirichlet 边界条件是偏微分方程中一种边界条件，用于在边界上给定变量的值。例如，它用于描述温度分布、势分布和流体速度分布。


    Dirichlet 边界条件在数学上表示如下：当在某个区域 $\Omega$ 的边界 $\partial\Omega$ 上给定函数 $u(x)$ 时，表示为


    $$u(x)=g(x), \quad x \in \partial \Omega, \quad (4.31)$$


    其中 $g(x)$ 表示边界上的值，$u(x)$ 表示区域 $\Omega$ 内部的解。


    例如，考虑二维热传导方程


    $$\frac{\partial u}{\partial t} = \alpha \left(\frac{\partial^{2} u}{\partial
    x^{2}} + \frac{\partial^{2} u}{\partial y^{2}}\right), \tag{4.32}$$


    当在矩形区域 $\Omega$ 内的边界上使用 Dirichlet 边界条件给定温度时，表示如下：


    $$u(x, y, t) = g(x, y),\ (x, y) \in \partial \Omega \tag{4.33}$$


    其中 $g(x, y)$ 表示区域 $\Omega$ 边界上的温度，$u(x, y, t)$ 表示区域 $\Omega$ 内的温度。


