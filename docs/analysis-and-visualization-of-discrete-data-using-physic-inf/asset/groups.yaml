    There are various methods for visualizing ordered lattice data. In this section,
    we use the Marching Cubes method, which can effectively visualize isosurfaces.
    The Marching Cubes method approximates the surface of an object in 3D space using
    scalar data defined on a 3D lattice. Specifically, the intersection points with
    isosurfaces are calculated on the ridges of the 3D lattice. Using these points,
    a triangular mesh that approximates the isosurface is calculated to approximate
    the surface of an object in 3D space. This method is widely used in 3D computer
    graphics and visualization of 3D scan data.


    Next, the texture coordinates of the 3D image are interpolated and calculated
    at each vertex of the triangle mesh. Texture coordinates comprise a coordinate
    system used in computer graphics, such as 3D graphics and game engines, to attach
    images or patterns to the surface of objects. Normally, the surface of an object
    is divided into small shapes, such as triangles, and texture coordinates are assigned
    to each shape. Texture coordinates are defined for each shape’s vertex and are
    usually expressed in two-dimensional coordinates. This allows for repeated placement
    and deformation of images or patterns on the surface of an object. Texture coordinates
    are used by a technique called texture mapping. Texture mapping can greatly enhance
    the expressive power of 3D graphics by providing objects with realistic textures
    and details. When mapping three-dimensional images, such as ancient documents,
