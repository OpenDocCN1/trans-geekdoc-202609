    A 3-D plot is suitable when you are interested in three or more parameters. For
    example, it is useful for displaying a bird’s-eye view of temperature data acquired
    at the atmosphere’s latitude, longitude, and height. Such data defined in three-dimensional
    coordinates are sometimes called volume data. Volume data refer to data that represent
    the position, shape, texture, etc., of a point or object in three-dimensional
    space. Volume data are used in a variety of fields, including medical imaging
    such as CT scans and MRIs, science and technology, architecture, design, and gaming.
