  mdcn: "\n例如，如果 Young 模量为 200000 N/mm$^{2}$ 且泊松比为 0.3，我们可以写出混凝土的偏微分方程。体力由施加在边界上的点载荷计算得出。\n\
    \n当定义域和边界条件设置如下时，\n\n$(x,y) \\in [0, 1] \\times [0, 1]$\n$\\left\\{\n\\begin{array}{c}\n\
    \\sigma_{xx}|_{x=0} = 0\\\\\n\\sigma_{xx}|_{x=1} = 0\\\\\n\\sigma_{yy}|_{y=1}\
    \ = (\\lambda + 2\\mu)Q\\sin(\\pi x)\n\\end{array}\n\\right.$\n$\\left\\{\n\\\
    begin{array}{c}\nv|_{x=0} = 0\\\\\nv|_{x=1} = 0\\\\\nu|_{y=0} = 0\\\\\nu|_{y=1}\
    \ = 0\n\\end{array}\n\\right.$\n\n精确解推导如下：此处，$\\mu$ 和 $\\lambda$ 是由 Young 模量 $E$\
    \ 和泊松比 $\\nu$ 定义的拉梅常数，其计算如下：\n\n$\\lambda = \\nu E/(1+\\nu)(1-2\\nu)$\n$\\mu =\
    \ E/(2(1+\\nu))$\n$u = \\cos(2\\pi x) \\sin(\\pi y)$ \n$v = \\sin(\\pi x) Qy^3/4$\n\
    \n在应力方程的精确解中，$x \\in [0, 1]$ 和 $y \\in [0, 1]$ 的定义域被采样，并根据其坐标计算 $u(x,y)$ 和 $v(x,y)$，这些被视为伪测量数据。偏微分项候选库构建如下：\n\
    \n$\\Phi = [u_x, \\mathbf{u}_{xx}, u_{xxx}, v_x, \\mathbf{v}_{xx}, v_{xxx}, u_y,\
    \ \\mathbf{u}_{yy}, u_{yyy}, v_y, \\mathbf{v}_{yy}, v_{yyy}]$\n\n结果展示在图 4.27 的上方色度图中。首先，在\
    \ N10 中进行线性应力方程的推导。NN 误差最小的结果展示在图 4.27 的中间色度图中。图 4.27 的下方色度图展示了 NN 模型与精确解之间的误差分布\
    \ $(\\tilde{u} - u)$ 和 $(\\tilde{v} - v)$。\n\n![](img/fa57e7010b16a211d5cf69ebb17e416e_173_0.png)\n\
    \n| 类别 | 方程 |\n| :--- | :--- |\n| 正确 PDE | $u_{xx}+0.35u_{yy}+0.65u_x+0.91f/E=0$\
