    # 2.1. Background


    # 2.1.1. Data analysis using NNs


    This document describes the analysis of physical data primarily using NNs. An
    NN is a combination of mathematical models of neurons in the human cranial nervous
    system (Figure 2.1). The concept of NN is inspired by the mechanics of the human
    brain (all the interconnections between neurons). NN refers to a mathematical
    model created to represent some of the features of brain function on a computer.
    NN is one of the modeling methods in machine learning (ML) that mimics the workings
    of the human brain without the aim to model the billions of neurons in the brain
    accurately. It simply attempts to simplify it and make it operational. In NN,
    when one inputs data (numerical values), the numerical values are propagated with
    weights to the next layer. This is similar to the sequence of processes in the
    human brain, whereby synapses are connected with weights and neurons produce outputs,
    which are then connected to the next level.


    Areas of use for NNs include pattern recognition and data mining (e.g., image
    recognition and recommendations).


    NNs are widely used in video websites to analyze comments posted on videos. Specifically,
    NNs combine natural language processing techniques to perform sentiment analysis,
    topic classification, spam filtering, etc., of comments. The objective of sentiment
    analysis is to determine whether a comment falls into the positive, negative,
    or neutral category. NNs are useful for sentiment analysis because they can capture
    the meaning of words and sentences. Topic classification determines to which topic
    a comment relates. For example, to classify comments about a particular product
    or service, NNs can create a classifier using keywords related to that product'
