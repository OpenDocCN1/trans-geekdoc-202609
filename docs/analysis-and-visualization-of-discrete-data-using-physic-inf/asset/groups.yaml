    or service. Spam filtering aims to detect automatically generated comments by
    spam and bots. By using NNs, characteristic patterns of spam comments can be detected
    and deleted automatically. Comment analysis using NNs can help video platforms
    control quality and improve products and services.


    The introduction of NN-based methods in machine translation has dramatically improved
    translation accuracy. In machine translation, NNs are mainly used in a method
    called NMT (Neural Machine Translation). NMT uses an NN architecture called the
    Sequence-to-Sequence (Seq2Seq) model to encode input sentences into a latent semantic
    space, which is then decoded to produce output sentences.


    Specifically, NMT uses two NNs called encoders and “decoders”. The encoder receives
    input sentences as sequences of words or characters and converts them into a latent
    semantic space. The decoder receives as input the latent semantic space created
