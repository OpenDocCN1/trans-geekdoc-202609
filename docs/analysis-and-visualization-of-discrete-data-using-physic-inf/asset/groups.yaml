    [35]. This equation describes the flow of matter and energy, taking into account
    both advection (flow) and diffusion (spread). Specifically, the advection equation
    describes the flow of matter, and the diffusion equation describes the diffusion
    of matter. This equation is used for many physical phenomena and engineering applications.
    In general, the basic equation can be expressed as follows:


    $\frac{\partial u}{\partial t} = \nabla \cdot (D \nabla u) - \nabla \cdot (\vec{v}u)
    + R \tag{4.8}$


    $D$ is the diffusivity and $v$ is the advection velocity. $R$ is the generation
    term. The first series of experiments uses a spatial one dimensional AD equation.
    Assuming that the space can be represented in one dimension, the problem can be
    described as follows:


    PDE : $\frac{\partial u}{\partial t} + C \frac{\partial u}{\partial x} - D \frac{\partial^2
    u}{\partial x^2} = 0 \tag{4.9}$


    Boundary condition: $u|_{x=0} = u_{BC}; u|_{x=\infty} = 0$


    Initial condition: $u|_{t=0} = u_0(x)$'
