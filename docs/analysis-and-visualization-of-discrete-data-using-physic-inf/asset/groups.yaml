    or more variables. The correlation coefficient represents the strength of the
    linear relationship between variables and is expressed in the range of $-1$ to
    1. Correlation matrices make it easy to visualize correlations between multiple
    variables. Correlation matrices are sometimes used to check correlations between
    variables using correlation matrices prior to regression analysis. If there are
    strong correlations among explanatory variables or between explanatory variables
    and the objective variable prior to executing the regression analysis, multicollinearity
    problems may occur. Therefore, a correlation matrix is used to avoid that problem.
    When there are strongly correlated variables, the correlation matrix can be used
    to determine which of them to use.


