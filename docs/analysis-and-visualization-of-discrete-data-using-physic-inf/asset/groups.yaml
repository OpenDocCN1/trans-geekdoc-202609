    ## 4.1.4.7. 二维线性应力分析


    在迄今为止讨论的偏微分方程（PDEs）中，目标物理现象仅限于与流体相关的现象。因此，本节将讨论固体中的应力分析。与流体分析不同，应力分析通常使用


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_168_0.png)


    **图 4.25**. 使用扩展库的 NN 结构和 $E_{int}$。


