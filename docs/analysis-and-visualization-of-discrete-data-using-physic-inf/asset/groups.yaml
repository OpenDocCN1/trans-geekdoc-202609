  mdcn: "\n\n![](img/fa57e7010b16a211d5cf69ebb17e416e_14_0.png)\n\n用于打开、保存、打印和共享现有工作簿的命令，以及设置\
    \ Excel 选项。如果你希望 Excel 数据分析工具或求解器作为菜单出现在功能区上，你必须在此处设置相应的选项。在后台视图中，你还可以检查你的 Excel\
    \ 账户或隐私设置。\n\n点击“文件”选项卡将调出后台视图。点击“选项”将显示一个对话框。\n\n### 1.1.5. 自动填充\n\nExcel 中的自动填充功能帮助你高效地输入数据。它根据已经输入的数据自动建议下一个要输入的数据（图\
    \ 1.5）。\n\n例如，假设列中包含月份和日期数据。在“Month”列中输入了“January”、“February”和“March”，在“Day”列中输入了“1st”、“2nd”和“3rd”。如果你在“Month”列的四月单元格中输入“4”，“4”也将自动填入“Day”列的第\
    \ 4 个单元格中。\n\n自动填充功能使你能够更高效地输入数据，因此你可以更高效地进行 Excel 工作。自动填充功能还减少了输入错误，从而提高了数据的可靠性。\n\
    \n![](img/fa57e7010b16a211d5cf69ebb17e416e_15_0.png)\n\n![](img/fa57e7010b16a211d5cf69ebb17e416e_15_1.png)\n\
    \n![](img/fa57e7010b16a211d5cf69ebb17e416e_15_2.png)\n\n![](img/fa57e7010b16a211d5cf69ebb17e416e_15_3.png)\n\
    \n![](img/fa57e7010b16a211d5cf69ebb17e416e_15_4.png)\n\n![](img/fa57e7010b16a211d5cf69ebb17e416e_15_5.png)\n\
    \n图 1.5. 自动填充。\n\n你可以通过拖动轻松输入连续数据，如“January, February, March…”：\n\n- 1. 选中一个填充了数字的单元格。\n\
    - 2. 将鼠标指针移动到粗边框右下角的小方块上。\n- 3. 当鼠标指针形状变成十字时，进行拖动。\n- 4. 点击出现在右下角区域的“自动填充选项”。\n\
    \n### 1.1.6. 相对引用\n\n在 Excel 中，相对引用功能允许当被引用的单元格被移动时，其引用目标自动更改（图 1.6）。\n\n例如，对于一个包含公式“=A1”的单元格，如果你将该单元格向右移动一个单元格，公式将自动重写为“=B1”。这种能够在单元格移动时自动更改其引用目标的功能被称为“相对引用”。\n\
    \n当单元格移动时自动更改其引用目标的“相对引用”功能对于编写公式非常有用。当使用“相对引用”的数据被复制时，复制单元格中的引用目标也会更改，从而允许你高效地管理数据。\n\
    \n![](img/fa57e7010b16a211d5cf69ebb17e416e_16_0.png)\n\n# 1. 目标\n\n![](img/fa57e7010b16a211d5cf69ebb17e416e_16_1.png)\n\
    \n# 2. 选中 D2。\n\n![](img/fa57e7010b16a211d5cf69ebb17e416e_16_2.png)\n\n# 3. 向下拖动。\n\
    \n![](img/fa57e7010b16a211d5cf69ebb17e416e_16_3.png)\n\n# 4. 检查自动填充是否正常工作。\n\n\
    ![](img/fa57e7010b16a211d5cf69ebb17e416e_16_4.png)\n\n# 5. 选中 D3。\n\n![](img/fa57e7010b16a211d5cf69ebb17e416e_16_5.png)\n\
    \n# 6. 检查单元格内容\n\n图 1.6. 相对引用。\n\n使用自动填充来复制公式。\n\n- 1. 如果选中包含公式的 D2 地址，该单元格右下角会出现一个小方块。\n\
    - 2. 向下拖动它，以自动填充其他单元格。\n- 3. 选中 B2 地址。该单元格的内容将显示在编辑栏中。\n\n### 1.1.7. 绝对引用\n\n\
    在 Excel 中，当引用包含“绝对引用”的单元格时，即使单元格移动，该单元格中的引用目标也是固定的。\n\n例如，考虑一个包含公式 =\"$A$1\" 的单元格。如果你将此单元格向右移动一个单元格，移动后的单元格中的引用目标将保持为\
    \ \"=$A$1\" 不变。这种能够在单元格移动后固定其引用目标的功能被称为“绝对引用”。\n\n防止单元格移动后引用目标更改的绝对引用功能对于编写公式非常有用。当使用“绝对引用”的数据被复制时，复制单元格中的引用目标不会更改，从而允许你高效地管理数据（图\
    \ 1.7）。\n\n![](img/fa57e7010b16a211d5cf69ebb17e416e_17_0.png)\n\n图 1.7. 绝对引用。\n\
    \n建议在复制公式时使用绝对引用功能，以保留公式中的单元格地址。\n\n- 1. 选中 B4 地址。这将使单元格被粗边框包围，并在其右下角出现一个小方块。\n\
    - 2. 向下拖动小方块不会触发自动填充工作。\n- 3. 相反，点击选中 B1，即“佣金率”，然后按 F4。\n- 4. 确保列和行编号前缀有“$”，以表示它们是绝对引用。有三种前缀模式：列和行均为绝对引用，仅行为绝对引用，以及仅列为绝对引用。此模式可以通过按\
    \ F4 按钮更改。\n\n要学习如何使用相对引用和绝对引用，显示 A 列数值 × 第 1 行数值的计算结果。\n\n- 1. 从 A 列第 2 行开始，向下输入\
    \ 1 到 9。\n- 2. 从 B 列第 1 行开始，向右输入 1 到 9。\n- 3. 适当使用相对引用和绝对引用，计算所有 9 × 9 个单元格的乘积（图\
    \ 1.8）。具体来说，在 B 列第 2 行输入公式 “=$A2*$B$1”。将此单元格复制到第 10 行，然后将 B 列第 2 到 10 行的所有行一起复制到\
    \ 10 列。\n\n![](img/fa57e7010b16a211d5cf69ebb17e416e_18_0.png)\n\n### 1.1.8. 使用\
    \ Excel 进行数据可视化介绍\n\nExcel 作为一种电子表格软件被广泛使用，但它也适用于数据可视化。\n\n在 Excel 中有几种数据可视化的方式：\n\
    \n- 使用图表进行可视化：Excel 提供多种图表类型，帮助你通过条形图、折线图、饼图等对你的数据进行可视化。\n- 使用数据透视图进行可视化：你可以使用\
    \ Excel 数据透视图来聚合数据并将其转换为图表，从而可视化数据。\n- 使用电子表格进行可视化：你可以使用 Excel 电子表格来组织数据，并使用颜色编码或公式对它们进行可视化。\n\
    - 使用宏进行可视化：Excel 拥有一种称为 VBA 的宏语言。你可以使用它来创建自定义图表或自动可视化工具。\n\n在 Excel 中对数据进行可视化之前，你可能需要对它们进行组织和处理。Excel\
    \ 还有一个可视化加载项，允许你进行更详细的可视化。\n\n使用 Excel 显示图表：\n\n- 创建图表：Excel 拥有多种图表类型，允许你输入数据并创建图表。\n\
    - 选择数据，从“插入”选项卡中选择“图表”，然后选择一种图表类型。\n- 创建图表后，数据将显示在图表区域。\n- 编辑图表：你可以编辑已创建的图表。\n\
    \  - 选中一个图表，然后从“设计”选项卡中选择“图表选项”。\n  - 你可以使用“轴”、“数据系列”和“布局”等选项卡来更改详细的图表设置。\n- 图表设计：你可以更改图表的外观。\n\
    \  - 通过选择一个首选图表，并从“格式”选项卡中选择“形状”、“边框”等，可以更改图表的外观。\n\n下面使用一个具体示例来说明。以下是一个二维函数：$f(x,\
    \ y) = \\sin(x) \\cdot \\cos(2y)$。使用 A 列中的变量值 $(y)$ 和第 1 行中的变量值 $(x)$ 计算 $f(x,\
    \ y)$（图 1.9）。\n\n- 使用自动填充从 A 列第 2 行的单元格向下填充变量值。\n- 使用自动填充从 B 列第 1 行的单元格向右填充变量值。\n\
    \n![](img/fa57e7010b16a211d5cf69ebb17e416e_19_0.png)\n\n图 1.9. 二维函数的等高线图表示。\n\n\
    - 适当使用相对引用和绝对引用计算函数值。\n- 将图表类型设置为“等高线”并显示图表。\n\n### 1.1.9. 使用 Excel 推导偏微分方程介绍\n\
    \n本节介绍如何使用 Excel 的数据分析（回归分析）从给定数据中推导偏微分方程；详细操作将在后续章节中描述。回归分析是一种分析两个或更多解释变量对因变量影响程度（权重）的方法。作为一个具体示例，考虑一个描述餐厅年销售额的模型。每个餐厅对应\
    \ Excel 中的一行。在每一行中，输入年销售额（单位：万日元）、座位数（数量）、从最近车站步行时间（分钟）以及是否有早餐（0, 1）。回归分析工具允许你通过为以下每个解释变量和截距添加权重，轻松创建一个解释年销售额的公式：座位数（数量）、从最近车站步行时间（分钟）以及是否有早餐（0,\
