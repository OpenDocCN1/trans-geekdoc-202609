    sparse regression methods to discover PDEs [31]. For physical problems, the NN
    is learned using available data, and sparse regression methods are used to identify
    sparse terms from the candidate library of partial differential terms that comprise
    the PDE.


    Rudy et al. created a library of simple functions and partial derivatives that
    may appear in an unknown governing equation [32]. They then utilized the advantages
    of methods that promote sparsity and selected candidates that most accurately
    represent the data. Furthermore, Raissi and Karniadakis [33] presented a framework
