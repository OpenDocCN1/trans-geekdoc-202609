    # 2.3.3.1. Variable reduction method


    Variable reduction methods [18], often used in regression analysis, use $p$-values
    to select meaningful explanatory variables. In regression analysis, a method called
    variable reduction allows us to simplify the model by removing unnecessary variables.
    This not only makes the model easier to interpret but also prevents overlearning.
    It can also be used to derive a PDE from physical data, which will be discussed
    later. A PDE can be derived by searching for a model in which a partial differential
    term (often a time partial differential term) is explained by several other differential
    terms (often spatial partial differential terms). Using variable reduction methods,
    it is possible to delete unnecessary partial differential terms from many candidates.


    Variable reduction with $p$-values is a method that uses statistical methods to
    select explanatory variables used in regression analysis that are significantly
    related to the explained variable. The $p$-value represents the probability that
    a hypothesis is true. $p$-value-based variable reduction methods determine whether
    each explanatory variable is significantly related to the explained variable based
    on the $p$-value of the regression model using that explanatory variable. If the
    $p$-value is smaller than the significance level (usually 0.05 or 0.01), the explanatory
    variable is interpreted as significantly related to the explained variable. Therefore,
    if the $p$-value is above the significance level, the explanatory variable is
    deleted from the model.


    The variable reduction method using $p$-values is a type of backward selection
    method. It has the advantage of being less sensitive to the order in which variables
    are added since all explanatory variables can be evaluated simultaneously, rather
    than adding variables one by one. Using the Data Analysis tools in Excel, regression
    analysis can be converted to a macro, and the steps described earlier can be performed
    in VBA to create an automatic variable reduction method.


