    \ | 0.01316 | | | |\n| Total | 9 | 0.08807 | | | | |\n\nFigure 2.18. Water level\
    \ prediction results from regression analysis.\n\nAn Excel macro is a program\
    \ used in Excel. In Excel, macros can be created using a programming language\
    \ called VBA (Visual Basic for Applications). Macros can be used to automate repetitive\
    \ tasks and operations in Excel, which is very useful when processing large amounts\
    \ of data. Macros can also be used to extend the functionality of Excel.\n\nTo\
    \ create macros, you will need to learn VBA. To learn VBA, basic knowledge of\
    \ programming is helpful. However, even those who have never studied programming\
    \ will be able to create macros by learning step by step.\n\nTo use macros in\
    \ Excel, you must enable them in the settings. The steps are as follows:\n\n-\
    \ Open the [Developer] from the menu and click [Macro Security].\n- Click [Macro\
    \ Settings].\n- In the Macro Settings, select [Enable VBA macros].\n- Click the\
    \ [OK] button to save the settings.\n\nYou will now be able to use macros in Excel.\n\
    \nNote: Enabling macros may result in the risk of dangerous macros running on\
    \ your computer. Before enabling, be sure to verify that the macros you are running\
    \ are from trusted sources.\n\nThe “Record Macro” button may not appear in Excel\
    \ immediately after installation. If this is the case, to enable macros in Excel,\
    \ follow the given steps:\n\n- Open the [File] menu and click [Options].\n- Click\
    \ the [Customize Ribbon] from the menu.\n- In the “Popular Commands” list, select\
    \ [Developer] and press the [OK] button.\n- Click the [OK] button to save the\
    \ settings (Figure 2.19).\n\nTo record a macro in Excel, follow the given steps:\n\
    \n- Click the [Developer] tab.\n- Click the [Record Macro] button.\n\n![](img/fa57e7010b16a211d5cf69ebb17e416e_65_0.png)\n\
    \nFigure 2.19. How to enable macros.\n\n- (3) Recording starts. Your mouse and\
    \ keyboard operations are now being recorded. Perform your tasks in Excel.\n-\
    \ (4) To end the recording, click the [Record Macro] button again.\n- (5) The\
    \ “Record Macro” dialog box appears. Enter a name for the recorded macro and click\
    \ the [OK] button.\n\nYou have now recorded a macro in Excel.\n\nNote: When you\
    \ record a macro in Excel, the VBA code is automatically generated to reproduce\
    \ the recorded operation. To run a recorded macro, go to the [Developer] tab,\
    \ click the [Macros] button, and select the recorded macro, or click the “Run\
    \ Macro” button.\n\nVBA (Visual Basic for Applications) is a programming language\
    \ used in Microsoft Office applications (Excel, Word, Outlook, PowerPoint, etc.).\
    \ VBA can be used to automate repetitive tasks and operations in Excel. VBA can\
    \ also be used to extend the functionality of Excel. VBA is automatically generated\
    \ when you record a macro in Excel. However, you can also write VBA directly.\
    \ By writing VBA directly, you can create more complex, customized macros. To\
    \ learn VBA, basic knowledge of programming is helpful. However, even those who\
    \ have never studied programming will be able to create VBA by learning step by\
    \ step.\n\nVBA uses a similar syntax to Visual Basic. The basic syntax of VBA\
    \ includes the following:\n\n- Variables: Stores data. It can store a variety\
    \ of data types, including numbers and strings.\n- Control Syntax: Syntax for\
    \ controlling a program, including If and For statements.\n- Function: Performs\
    \ a specific operation. VBA provides standard functions (e.g., SQR and LEFT functions).\
    \ You can also create your own functions.\n- Statements: A single statement. VBA\
    \ requires a semicolon (;) at the end of a statement.\n\nThese are the basics\
    \ of VBA syntax. In addition, VBA allows you to use methods and properties to\
    \ take advantage of various Excel functions.\n\nFor example, a VBA program that\
    \ calculates the maximum value and its position among multiple data would look\
    \ like this:\n\n```vba\nSub FindMax()\n  Dim data() As Variant 'Array to store\
    \ the data\n  Dim i As Long 'Counter variable\n  Dim maxValue As Variant 'Maximum\
    \ value\n  Dim maxIndex As Long 'Position of the maximum value\n  'Store the data\
    \ in the array\n  data = Array(10, 20, 30, 40, 50)\n  'Find the maximum value\
    \ and its position\n  maxValue = data(0) 'Initialize the maximum value with the\
    \ first element\n  maxIndex = 0 'Initialize the position of the maximum value\
    \ with the first element\n  For i = 1 To UBound(data)\n    If maxValue < data(i)\
    \ Then\n      maxValue = data(i) 'Update the maximum value\n      maxIndex = i\
    \ 'Update the position of the maximum value\n    End If\n  Next i\n  'Display\
    \ the results\n  MsgBox \"The maximum value is \" & maxValue & \", and its position\
    \ is \" & maxIndex & \".\"\nEnd Sub\n```\n"
