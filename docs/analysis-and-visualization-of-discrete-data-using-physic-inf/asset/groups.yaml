    # Chapter 4


    # Advanced Application Section


    # 4.1. Derivation of PDEs describing physical data


    Previous sections have thus far discussed the use of partial differentiation in
    the NN model. One of the applications discussed was the visualization of a curved
    surface which envelops a large number of magnetic field lines computed based on
    simulation results of electromagnetic fields in a fusion reactor. For effective
    visualization, a constraint is added to the loss function that the normal line
    of the curved surface is orthogonal to the magnetic flux density vector. This
    section describes how to derive PDEs that describe physical data tied to physical
    quantities using NN. As an application example, this section targets PDEs with
    exact solutions and describes how to find the original PDEs with high accuracy
    by regarding the results computed by randomly changing the space-time coordinates
    as pseudo-measurement data.


    The PDE contains unknown multivariate functions and their partial derivatives.
    PDEs are used to formulate problems involving functions with several variables
    and are solved manually or using computer models. Incidentally, an ordinary differential
    equation (ODE) is expressed as a function of a single variable and its derivatives.
    This book assumes PDEs in which the time partial derivative of a physical quantity
    is represented by a linear regression model with a spatial partial derivative
    term. But this can be used for other cases as well.


    Traditionally, PDEs were derived according to physical laws such as Fick’s First
    Law or the continuity equation. For example, the advection–diffusion equation
    considers two types of material flows — advection and diffusion — and sums these
    flows into an integrated flow. The law of conservation is applied to this integrated
    flow to derive the advection–diffusion'
  - '[PAGE 138]


    equation. This represents a deductive approach to PDE derivation. In contrast,
    this book describes the inductive approach.


    Explanatory models that use existing PDEs are important to gain insights from
    the big data of interesting scientific events such as fluid, atmospheric, and
    cosmic phenomena, as well as various new occurrences such as COVID-19 infections.


    Of course, it is also important to discover insights from everyday phenomena.
    For example, the use of computational fluid dynamics (CFD) is essential for the
    heat dissipation of laptop computers. Essentially, CFD is based on the convection-diffusion
    equation. For example, in thermo-fluid phenomena, if the heat dissipation effect
    is dominant in a laptop housing, the advection term can be omitted. This is a
    decision often adopted for dense board mounting. In this case, the derivation
    of the PDE from the thermo-fluid measurements plays an important role in determining
    whether an advection term is necessary. There have been significant technological
    advances in the simultaneous measurement of velocity, pressure, and temperature
    [18]. Thus, new PDEs that consist of essential partial differential terms may
    be derived from data measured with respect to the physical phenomena of interest.


    PDE derivation techniques using cosmological big data are also expected to contribute
    to space science. In 1917, Einstein added a cosmological term, a type of partial
    differential term, to his equations to cancel out the effects of gravity, resulting
    in a static solution. In 1929, Edwin Hubble discovered the expansion of the universe,
    and Einstein withdrew the idea of the cosmological term. In 1998, observations
    of supernovae revealed that the expansion of the universe has continued to accelerate
    instead of slowing down over the past five billion years. In the near future,
    PDE derivation techniques should play an important role in providing evidence
    for the existence of a cosmological term in Einstein''s equations.


    Currently, research on PDE derivation from big data is in the initial technical
    research and development phase. This book assumes PDEs with exact solutions, and
    regards the exact solution data of the PDE at multiple discrete space-time points
    as pseudo-measurement data. A space-time model is needed to compute the temporal
    and spatial partial differential terms. For this reason, this book employs a space-time
    model based on NNs derived from physical data (Figure 3.5). NN represents the
    global approximation model. Traditionally, local interpolation models, such as
    finite difference and finite element models, were employed to evaluate partial
    differential terms in PDEs.'
