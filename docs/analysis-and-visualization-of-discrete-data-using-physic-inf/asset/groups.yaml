    $$ E_{\boldsymbol{\varepsilon}} = \frac{1}{N_{\boldsymbol{\varepsilon}}} \| \hat{\boldsymbol{\varepsilon}}
    - \boldsymbol{\varepsilon} \|_2^2 \quad \text{(4.2)} $$


    其中 $\boldsymbol{\varepsilon}$ 基于偏微分方程已知的假设是已知的。$N_{\boldsymbol{\varepsilon}}$
