    ### 4.1.1. Related research


    Complex nonlinear dynamics occur in many scientific and engineering disciplines.
    Therefore, clarifying the underlying differential equations directly from observations
    is a difficult task. The ability to symbolically model complex network systems
    is key to understanding such systems, and this remains an open question in many
    disciplines. It is essential to model the space-time continuum field from given
    physical data to evaluate partial derivatives and reveal the PDE. There are two
    approaches to representing the distribution of data in a field for accurate evaluation
    of partial differential terms: local interpolation and global approximation.


