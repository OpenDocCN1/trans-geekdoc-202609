    ### 2.2.2. F 检验


    在 Excel 中，*F* 检验是一种统计测试，用于确定两个独立样本之间的方差差异是否具有显著性。*F* 检验通过比较两个样本方差的比率来确定它们的均值是否显著不同。当被比较的两个样本具有相同的分布时，*F*
    检验比 t 检验具有更高的检测力。因此，当假设被比较的两个样本具有相同的分布时，经常使用 F 检验。


    在进行统计测试时，需建立原假设和对立假设。原假设指的是“现象不存在”的假设，是在进行测试时假设的条件。对立假设指的是“现象存在”的假设。


    例如，在测试药物是否有效时，原假设设为“药物无效”，对立假设为“药物有效”。测试结果将确定是拒绝还是支持原假设。


    在 *F* 检验中，设定一个称为显著性水平的值。显著性水平是代表“原假设为真的概率”的值。通常，显著性水平被设置为 0.05 或 0.01 等值。例如，如果显著性水平设定为
    0.05，且原假设为真的概率小于 5%，则拒绝原假设。换句话说，原假设被判定为“显著不同”。相反，如果原假设为真的概率大于或等于 5%，则支持原假设。换句话说，判定为“不显著不同”。


    研究者本人可以设定显著性水平。然而，通常使用 0.05 或 0.01。显著性水平越低，拒绝原假设所需的统计显著性越高。相反，显著性水平越高，拒绝原假设所需的统计显著性越低。


