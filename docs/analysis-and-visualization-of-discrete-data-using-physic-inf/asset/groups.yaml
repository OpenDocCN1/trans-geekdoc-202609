    将这些定律纳入模型使物理信息神经网络（PINN）能够比不考虑物理约束的传统神经网络进行更准确的预测。PINN 使用监督学习和无监督学习的结合进行训练。监督学习用于使模型适应训练数据，而无监督学习则用于施加物理约束。这允许模型同时从数据和底层物理定律中学习。


    在 PINN 中，训练数据是时空坐标和物理数据。时空坐标被输入到输入层中。权重参数被优化，使得神经网络的结果符合物理数据。这种优化代表了监督学习（图 3.1）。


    接下来，通过对神经网络模型进行微分操作构建一个偏微分方程（PDE），以代表物理定律。未优化的权重参数会产生 PDE 残差（图 3.2）。


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_118_0.png)


    图 3.1. PINN 中的监督学习。


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_119_0.png)


    图 3.2. PINN 中的 PDE 残差。


    为了解决 PDE，需要边界条件来完全确定问题。边界条件提供了关于分析域边界上系统行为的信息。通常，PDE 的分析域具有边界。例如，对于二维 PDE，分析域通常是一个平面，其边界形式可以是线、圆、曲线等。该边界必须具有以下边界条件：


    - 1. *狄利克雷条件*：规定解在边界上的值已知。例如，对于温度方程，狄利克雷条件规定墙壁或表面温度已知（图 3.3）。

    - 2. *诺伊曼条件*：规定解的法向导数在边界上已知。例如，对于热传导方程，诺伊曼条件规定墙壁或表面上的热通量已知（图 3.4）。


    解决 PDE 所需的边界条件始终作为问题的一部分进行处理。正确设置边界条件非常重要，否则可能无法获得正确的解。


    解决 PDE 所需的边界条件也是从神经网络模型构建的，从而产生残差。诺伊曼条件需要微分操作。权重参数的优化旨在消除这些残差，并代表无监督学习。PINN 计算使由将这些残差加到监督学习定义的损失函数所得值最小化的权重参数。


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_120_0.png)


    图 3.3. PDE 中的狄利克雷条件。


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_120_1.png)


    图 3.4. PDE 中的诺伊曼条件。


    为了构建代表物理定律的 PDE 以及诺伊曼边界条件，PINN 模型需要微分运算，因此支持 PINN 的一项关键技术是自动微分。自动微分或算法微分是指一种分析程序中定义的功能并推导出一个计算偏导数值的技术
    [24]。即使复杂的程序也由基本算术运算（如加、减、乘、除）和基本函数（如指数函数、对数函数、三角函数）的组合组成。自动微分利用这一特性，通过反复对这些算术运算应用链式法则来找到解决方案。自动微分允许您以较少的计算努力自动获得偏导数值。


    ## 3.2. 神经网络中的自动微分


    本节描述了如何计算全连接神经网络（FCNN，在深度学习 [25, 26] 中广泛使用）关于输入变量的 1 阶偏导数。图 3.5 显示了 PINN 中 FCNN
    的结构。


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_121_0.png)


    该神经网络由输入层和输出层组成，中间包含一个隐藏层。假设每层中的神经元与相邻层中的神经元完全连接。第 $k$ 层中的第 $j$ 个神经元 $u_{j}^{k}$
    连接到第 $(k-1)$ 层中的神经元，表示为：


    $$u_{j}^{k}=\sigma_{j}^{k-1}\left(\sum_{i=1}^{n_{k-1}} w_{i, j}^{k-1} u_{i}^{k-1}\right)\tag{3.1}$$


    其中 $w_{i, j}^{k-1}$ 是单元 $u_{i}^{k-1}$ 到 $u_{j}^{k}$ 的权重，$\sigma_{j}^{k}$ 和 $n_{k}$
    分别表示第 $k$ 层中第 $j$ 个神经元的激活函数和中继数。


    假设使用 Sigmoid 函数 $\sigma(x)=1 /\left(1+e^{-x}\right)$ 作为激活函数。通过将第 $k$ 层的偏置设置使得
    $u_{n_{k}}^{k}=1$，并使用权重 $w_{n_{k}, j}^{k}$ 执行计算。以下段落描述了如何计算输入层 $u_{j}^{0}$ 和输出层单元
    $u_{j}^{L+1}$ 的 1 阶导数 $\frac{\partial u_{i}^{L+1}}{\partial u_{j}^{0}}$。


    在 1 阶导数计算中，应用链式法则分解 $\frac{\partial u_{i}^{L+1}}{\partial u_{j}^{0}}$ 以构建迭代过程。$u_{j}^{k+1}$
    使用 $u_{i}^{0}, u_{i}^{1}, \ldots, u_{i}^{k}$ 计算。因此，$u_{j}^{k+1}$ 可以被视为 $u_{i}^{0},
    u_{i}^{1}, \ldots, u_{i}^{k}$ 的复合函数，并使用链式法则计算其偏导数。通过对该复合函数递归应用偏导数的链式法则分解，计算关于输入变量的偏导数。在此过程中，根据中间变量
    $u_{i}^{1}$ 的链式法则分解 $\frac{\partial u_{i}^{L+1}}{\partial u_{j}^{k}}$，其子表达式再根据中间变量
    $u_{i}^{2}$ 的链式法则进一步分解。通过递归重复此分解过程直到达到中间变量 $u_{m_{L}}^{L}$，得到以下公式。


    $$\begin{gathered}\frac{\partial u_{j}^{L+1}}{\partial u_{i}^{0}}=\sum_{m_{1}=1}^{n_{1}}\left(\sum_{m_{2}=1}^{n_{2}}\left(\sum_{m_{3}=1}^{n_{3}}\left(\cdots\left(\sum_{m_{L}=1}^{n_{L}}\frac{\partial
    u_{j}^{L+1}}{\partial u_{m_{L}}^{L}}\frac{\partial u_{m_{L}}^{L}}{\partial u_{m_{L}-1}^{L-1}}\right)\cdots\right)\\\times
    \frac{\partial u_{m_{3}}^{3}}{\partial u_{m_{2}}^{2}}\frac{\partial u_{m_{2}}^{2}}{\partial
    u_{m_{1}}^{1}}\frac{\partial u_{m_{1}}^{1}}{\partial u_{i}^{0}}\right)\end{gathered}\tag{3.2}$$


    基于此方程，构建了一个通过反向传播神经网络来计算偏导数的程序。


    例如，当激活函数是 Sigmoid 函数，$\sigma(x)=1 /\left(1+e^{-x}\right)$ 时，导数可以表示为 $\sigma^{\prime}(x)=(1-\sigma)
    \sigma$，利用 Sigmoid 函数本身。连续层之间的导数表示如下：


    $$\frac{\partial u_{m_{k+1}}^{k+1}}{\partial u_{m_{k}}^{k}} = u_{m_{k+1}}^{k+1}
    (1 - u_{m_{k+1}}^{k+1}) w_{m_k,m_{k+1}}^{k} \quad \quad \quad \quad (3.3)$$


    然后，$\frac{\partial u_{j}^{k+1}}{\partial u_{i}^{k-1}}$ 根据关于第 $k$ 层中变量 $u_{m}^{k}$
    的偏微分链式法则进行分解。也就是说，跳过一个层的偏微分计算如下进行（图 3.6）：


    $$\frac{\partial u_{m_{k+1}}^{k+1}}{\partial u_{m_{k-1}}^{k-1}} = \sum_{m_{k}=1}^{n_{k}}
    \frac{\partial u_{m_{k+1}}^{k+1}}{\partial u_{m_{k}}^{k}} \frac{\partial u_{m_{k}}^{k}}{\partial
    u_{m_{k-1}}^{k-1}} \quad \quad \quad \quad (3.4)$$


    其中，方程 (3.4) 中的子表达式由方程 (3.3) 计算得出。类似地，关于 $k-2$ 层变量 $u_{m_{k-2}}^{k-2}$ 的导数


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_123_0.png)


