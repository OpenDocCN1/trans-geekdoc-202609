    # 1.1.7. Absolute reference


    In Excel, when a cell containing “absolute reference” is referenced, the reference
    destination in the cell is fixed even after the cell moves.


    For instance, consider a cell that contains the formula ="$A$1". If you shift
    this cell to the right by one cell, the reference destination in the moved cell
    will remain unchanged as "=$A$1". The function capable of fixing a reference destination
    in a cell even after the cell is moved is known as “absolute reference”.


    The absolute reference function, which prevents the reference destination in a
    cell from being changed after the cell has moved, is useful for writing formulas.
    When data that use “absolute reference” are duplicated, the reference destination
    in the duplicated cell is not changed, allowing you to manage data efficiently
    (Figure 1.7).'
