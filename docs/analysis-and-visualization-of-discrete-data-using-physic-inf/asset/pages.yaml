  md: 'condition, so one of the important technologies that support the PINN is automatic
    differentiation. Automatic differentiation or algorithmic differentiation refers
    to a technique of analyzing a function defined in a program to derive a program
    that calculates a partial derivative value [24]. Even a complex program consists
    of combinations of basic arithmetic operations, such as addition, subtraction,
    multiplication, and division, and basic functions, such as exponential, logarithmic,
    and trigonometric functions. Automatic differentiation takes advantage of this
    feature to find a solution by repeatedly applying the chain rule to these arithmetic
    operations. Automatic differentiation allows you to obtain a partial derivative
    value automatically with less computational effort.


    # 3.2.  Automatic differentiation in NN


    This section describes how to calculate a 1st-order partial derivative with respect
    to an input variable of an FCNN, which is widely used in deep learning [25, 26].
    Figure 3.5 shows the structure of FCNN in PINN.


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_121_0.png)'
