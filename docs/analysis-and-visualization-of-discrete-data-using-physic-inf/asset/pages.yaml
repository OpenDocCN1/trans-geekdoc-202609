  img_proc: true
- pgno: 51
  md: '+   - Allows for the assessment of how well the model fits:


    In regression analysis, the degree to which a model fits the data can be evaluated.
    Specifically, we can evaluate how well the model fits the data by assessing the
    difference between the measured value and the value predicted from the model.


    +   - The validity of the model can be verified:


    In regression analysis, the validity of the model can be tested. Specifically,
    we can test whether the conditions assumed in the regression analysis are met.


    +   - Multiple explanatory variables can be combined:


    In regression analysis, multiple explanatory variables can be combined. By using
    multiple explanatory variables, complex relationships of effects on the objective
    variable can be modeled. A regression model with multiple explanatory variables
    is called multiple regression. A multiple regression model is a model that considers
    multiple factors simultaneously. The model is assumed to be as follows:


    ```

    y = α + β₁x₁ + β₂x₂ + ··· + βₖxₖ + u (2.8)

    ```


    # 2.3.2. Regression analysis assumptions


    To estimate the value of (xy) based on the observed α and β, the following assumptions
    [16] are made:


    +   (1) The relationship between the explanatory and objective variables is linear:
    Regression analysis assumes that the relationship between the explanatory and
    objective variables is linear. In other words, it is desirable that the data plotted
    on the scatterplot be linearly distributed; if not, a nonlinear regression model,
    etc., should be used.


    +   (2) The error term should follow a normal distribution: Regression analysis
    assumes that the error in the forecast model follows a normal distribution. That
    is, the mean difference between the true and predicted values is assumed to be
    zero and follow a normal distribution with constant variance.'
