    # 2.2.2. F-test


    In Excel, the *F*-test is a statistical test determining whether the difference
    in variances between two independent samples is significantly different. The *F*-test
    compares the ratio of the variances of two samples to determine if their means
    are significantly different. The *F*-test has higher detection power than the
    t-test when the two samples being compared have the same distribution. Therefore,
    it is often used when it is assumed that the two samples being compared have the
    same distribution.


    When conducting a statistical test, formulate null and opposing hypotheses. The
    null hypothesis refers to the hypothesis that “the phenomenon does not exist”,
    which is assumed when conducting a test. The opposing hypothesis refers to “the
    hypothesis that the phenomenon exists”.


    For example, when testing whether a drug is effective, the null hypothesis is
    set as “the drug is not effective” and the opposing hypothesis is “the drug is
    effective”. The test results determine that the null hypothesis is rejected or
    supported.


    In the *F*-test, a value called significance level is set. The significance level
    is a value that represents the “probability that the null hypothesis is true”.
    Usually, the significance level is set to a value such as 0.05 or 0.01. For example,
    if the significance level is set at 0.05, and if the probability of the null hypothesis
    being true is less than 5%, the null hypothesis is rejected. In other words, the
    null hypothesis is judged to be “significantly different”. Conversely, if the
    null hypothesis has a 5% or more probability of being true, the null hypothesis
    is supported. In other words, it is judged as “not significantly different”.


    The researcher themselves can set the significance level. However, 0.05 or 0.01
    is usually used. The lower the significance level, the greater the statistical
    significance required to reject the null hypothesis. Conversely, the higher the
    significance level, the lower the statistical significance required to reject
    the null hypothesis.'
