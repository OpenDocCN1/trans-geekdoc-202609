    # 4.1.4.2. *One-dimensional KdV equation*


    The one-dimensional KdV equation is a type of nonlinear partial differential equation
    that is expressed as follows:


    $$u_t + \alpha u u_x + \beta u_{xxx} = 0 \tag{4.11}$$


    where $u(x,t)$ is the function of $x$ and $t$, $t$ is time, and $x$ is space.
    Also, by applying the appropriate scale transformation to each variable and $u$,
    the coefficients can be recomputed as $\alpha = 6$, $\beta = 1$. Here, the partial
    derivative for each variable can then be expressed as lower right subscripts,


    $$u_t + 6uu_x + u_{xxx} = 0. \tag{4.12}$$


    The KdV equation describes nonlinear wave phenomena such as shallow water waves
    [36]. This equation is a one-dimensional version of the Korteweg-De Vries equation
    and is used to describe nonlinear wave phenomena. Here, a nonlinear wave phenomenon
    refers to a phenomenon that occurs when nonlinearities that affect the medium
    through which the waves propagate appear. In contrast, a linear wave phenomenon
    refers to a phenomenon in which the effect of waves on a medium is linear.'
  merge: -1
  img_proc: true
