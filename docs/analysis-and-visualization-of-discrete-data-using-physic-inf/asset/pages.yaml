    with the difference [43]. In contrast, in FEM, an approximate solution is obtained
    by expanding an unknown function into a finite sequence of known functions and
    determining the unknown constants introduced in the expansion [28]. In FEM, the
    weighted residual method is used to determine the unknown constants. PM is one
