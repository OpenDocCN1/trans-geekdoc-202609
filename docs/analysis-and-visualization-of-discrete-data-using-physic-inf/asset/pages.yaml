    # **2.3.5. Implementation of the variable reduction method using Excel VBA**


    The variable reduction method described in the regression analysis is implemented
    using VBA. In this implementation, the process is to find the smallest absolute
    value of the $t$-value in place of the $p$-value and repeat the regression analysis
    while removing that variable. At the 5% level of the $p$-value, the absolute value
    of the $t$-values will generally be 2 or more and negatively correlated with each
    other.


    Assume that the Excel sheet holds data for the objective variable in the first
    column and data for the explanatory variable in the second and subsequent columns
    for the number of explanatory variables. Assume the first row has the number of
    explanatory variables entered in the second column and the number of sample sizes
    in the first column. The results of the regression analysis (coefficients for
    the explanatory variables, $p$-values, and $t$-values) should be output with the
    top left cell (labeled Summary) spaced one row apart from the last data row.


    The following is an example of applying the variable reduction method to the survey
    results to narrow down the objective variables that significantly affect the objective
    function. In this survey, 106 first-year university students were asked to respond
    to an interval scale on nine different items related to their level of satisfaction
    and expectations of the university. An interval scale is a quantitative measurement
    scale that is not ordinal, the difference between two variables is meaningful
    and equal, and the presence of zero is optional. When you execute the VBA program
    for the variable reduction method, you find that the two essential items remain
    (Figure 2.20).'
