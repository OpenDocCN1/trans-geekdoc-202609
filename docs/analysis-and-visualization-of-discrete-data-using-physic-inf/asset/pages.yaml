- pgno: 38
  md: '# 2.1.2. **Format of physical data**


    Before describing the analysis and visualization of geophysical data, the format
    of geophysical data needs to be explained. Roughly stated, the format is the physical
    quantity defined on the point cloud data. In this document, two types of physical
    data are assumed: The first is a physical quantity $u$ that is measured at a certain
    spatial location at a certain fixed time. A typical example is the data $u(t_i,
    x_j, y_j, z_j)$ obtained by a measurement device installed at a spatially fixed
    location $(x_j, y_j, z_j)$ at time $t_i$. If there are N determined time(s) and
    M spatially fixed location(s), the physical data are denoted as follows:


    ```

    $$u(t_i, x_j, y_j, z_j),\quad i=1,N,\quad j=1,M$$

    ```


    u is scalar data defined by discrete spatiotemporal points but can also be vector
    or tensor data, depending on the instrument used for the measurement. When $N
    = 1$ , it means discrete space data.


    The second is data obtained at a specific spatiotemporal location. A typical example
    is data obtained by a mobile device (such as a UAV). If there is (are) N determined
    spatiotemporal point(s), the physical data are denoted as follows:


    ```

    $$u(t_i, x_i, y_i, z_i),\quad i=1,N$$

    ```


    This N is called the number of observations.


    When given physical data, interpolation or approximation is used to compute a
    spatiotemporal model that explains these data well. Interpolation creates a function
    that always passes through the given discrete data, and a typical interpolation
    method is kriging. If the given discrete data are likely to contain noise, it
    does not necessarily explain the original discrete data well. To solve such problems,
    approximations are sometimes used. Approximation does not require passing through
    the given discrete data and determines a function with as low an error as possible.
    A typical approximation method is regression. NN is a type of approximation and
    has more explanatory power than basic linear regression.


    # 2.1.3. **Physical data visualization**


    Physical data visualization refers to converting physical data into a form that
    is easily understood by humans through its representation in graphs and images.
    This allows us to visually understand the relationships and characteristics of
    the data, which is useful information for data analysis and research.


    There are many ways to visualize physical data.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# 2.1.3.1. 1-D plot


    A 1-D plot is suitable when you are interested in only one parameter, such as
    time series data or statistical data. For example, plotting temperature changes
    along a time axis, with time on the $x$-axis and temperature values on the $y$-axis,
    provides a visual understanding of temperature changes. A 1-D plot includes line
    graphs, histograms, and box plots.


    # 2.1.3.2. 2-D Plot


    A 2-D plot refers to plotting data using two axes ($x$-axis and $y$-axis). A 2-D
    plot is appropriate when you are interested in multiple parameters. For example,
    when examining the relationship between temperature and humidity, you can plot
    temperature on the $x$-axis and humidity on the $y$-axis to visually understand
    the relationship between temperature and humidity. A 2-D plot includes scatter
    plots, scatter plot matrixes, and contour plots.


    # 2.1.3.3. 3-D Plot


    A 3-D plot refers to plotting data using three axes ($x$-, $y$-, and $z$-axes).
    A 3-D plot is suitable when you are interested in three or more parameters. For
    example, it is useful for displaying a bird’s-eye view of temperature data acquired
    at the atmosphere’s latitude, longitude, and height. Such data defined in three-dimensional
    coordinates are sometimes called volume data. Volume data refer to data that represent
    the position, shape, texture, etc., of a point or object in three-dimensional
    space. Volume data are used in a variety of fields, including medical imaging
    such as CT scans and MRIs, science and technology, architecture, design, and gaming.
    Volume data may be stored on a three-dimensional grid or expressed by a tetrahedral
    mesh. To visualize these data, expression methods such as 3D graphs and slice
    images are used. Also, when examining the relationship between temperature, humidity,
    and air pressure, you can plot temperature on the x-axis, humidity on the $y$-axis,
    and air pressure on the $z$-axis to visually understand the relationship. A 3-D
    plot includes isosurface plots and volume renderings.


    Video: Animation visualization of continuous data along a time axis allows for
    a visual understanding of data changes.


    Visualization Software: Visualization can be performed using programming languages
    such as Matplotlib, Python, and R. Specialized software such as Origin [11] and
    Grafana [12] can also be utilized.'
