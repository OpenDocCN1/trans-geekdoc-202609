    ```


    Constitutive equation:


    ```

    \left\{\begin{array}{c} {\sigma_{x}} \\ {\sigma_{y}} \\ {\sigma_{xy}} \end{array}\right\}_{\vec{\sigma}}
    = \frac{E}{1-\nu^2}\left\{\begin{array}{ccc} {1} & {\nu} & 0 \\ {\nu} & 1 & 0
    \\ 0 & 0 & {\frac{1-\nu}{2}} \end{array}\right\}_{D}\left\{\begin{array}{c} {\varepsilon_{x}}
    \\ {\varepsilon_{y}} \\ {\varepsilon_{xy}} \end{array}\right\}_{\vec{\varepsilon}}

    ```


    The equation of balance represents the PDE for the Cauchy stress tensor $\sigma_{ij}$.
    The Cauchy stress tensor is a tensor consisting of nine components, where the
    origin is a certain point O and a micro rectangle made of three coordinate planes
    and three parallel planes around it, and the surface force $(T_x, T_y, T_z)$ coordinate
    component acting on each plane perpendicular to the $x$, $y$, $z$ axis is written
    as $\{ (\sigma_x,\sigma_{xz},\sigma_{xz}), (\sigma_y,\sigma_y,\sigma_{yz}), (\sigma_{zy},\sigma_{zy},\sigma_z)
    \}$. This set of nine stress components is called the point stress or the Cauchy
    stress tensor. Here, $\sigma_{ii}$ is the vertical stress and $\sigma_{ij(i \neq
    j)}$ is the shear stress, the index in $\sigma_{ii}$ indicates the direction of
    action of the component (the same as the normal direction of the plane), the first
    index in $\sigma_{ij(i \neq j)}$ indicates the direction normal to the plane,
    and the second index the direction of action of the component. Also, $f_i$ here
    represents the volumetric force. The volumetric force is an important element
    in the equation for the forces to which a structure is subjected. The volumetric
    force represents the force created by the load applied to a structure. Loads applied
    to a structure include gravity, wind pressure, and earthquakes. These loads are
    called volumetric forces because they act equally on the entire volume of the
    structure.


    In the relationship between strain and displacement, $\vec{u}$ represents the
    displacement vector. $\frac{\partial u}{\partial x}$ and others represent their
    partial derivatives. $\vec{\varepsilon}$ is the strain vector.'
