- pgno: 117
  md: '# Chapter 3

    Practical Part


    So far, we have explained how to create a spatiotemporal model using an NN from
    physical data. In terms of application examples, we have explained the method
    used for visualizing page information from ancient literature data shot utilizing
    a three-dimensional CT machine. In addition, we have explained the method for
    visualizing the plasma region from a magnetic line group calculated from the results
    of analyzing electromagnetic fields in a fusion reactor.


    In this chapter, we will begin by explaining differentiation operations on a spatiotemporal
    model. The ability to perform differentiation operations may improve the accuracy
    of an NN model in some cases, and also enhance the accuracy with which to evaluate
    gradient data, which is important for visualization. It allows you to find an
    essential partial differential term and derive a PDE governing the given physical
    data. You can also solve the given PDE. As described earlier, adding differential
    information increases the added value of the NN model. Since differential information
    is crucial for a PDE that describes physics, we refer to such NN as physics-informed
    neural network (PINN).


    # ### 3.1. About PINNs


    An NN suitable for analyzing physical data is a physics-informed neural network
    (PINN). A PINN is a kind of machine learning model proposed by Raissi et al. that
    incorporates the laws of physics into the structure of an NN itself [28]. This
    allows a model to make predictions that are consistent with the underlying physics
    based on which a system is modeled. A PINN is particularly useful for solving
    problems, such as fluid dynamics, structural dynamics, and electrodynamics problems,
    where the relationship between variables is governed by the laws of physics. Incorporating'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'these laws into the model allows the PINN to make more accurate predictions
    than a conventional NN that does not consider physical constraints. The PINN is
    trained using a combination of supervised and unsupervised learning. The supervised
    learning is used to adapt the model to training data, while the unsupervised learning
    is used to apply physical constraints. This allows the model to learn from both
    data and the underlying laws of physics.


    In the PINN, the training data are spatiotemporal coordinates and physical data.
    The spatiotemporal coordinates are fed into the input layer. The weight parameters
    are optimized so that the NN results fit the physical data. This optimization
    represents supervised learning (Figure 3.1).


    Next, a PDE is constructed that represents the laws of physics from the NN model
    by differential operations. Weight parameters that are not optimized produce PDE
    residuals (Figure 3.2).


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_118_0.png)


    Figure 3.1. Supervised learning in PINNs.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '![](img/fa57e7010b16a211d5cf69ebb17e416e_119_0.png)


    Figure 3.2. PDE residuals in PINNs.


    To solve a PDE, a boundary condition is needed to fully determine the problem.
    The boundary condition provides information about the behavior of the system at
    the boundary of an analysis domain. In general, the analysis domain of the PDE
    has a boundary. For example, in the case of a two-dimensional PDE, the analysis
    domain is usually a plain with its boundary in the form of a line, circle, curve,
    and so on. This boundary must have the following boundary condition:


    +   1. *Dirichlet condition*: Specifies that the value of a solution is known
    on the boundary. For a temperature equation, for example, the Dirichlet condition
    specifies that a wall or surface temperature is known (Figure 3.3).

    2. *Neumann condition*: Specifies that the normal derivative of a solution is
    known on the boundary. For the heat conduction equation, for example, the Neumann
    condition specifies that heat flux is known on a wall or surface (Figure 3.4).


    The boundary condition, which is needed to solve a PDE, is always handled as part
    of the problem. It is important to set the boundary condition properly, failing
    which, one may not obtain a correct solution.


    The boundary condition required to solve a PDE is also constructed from the NN
    model, resulting in residuals. The Neumann condition requires a differential operation.
    The optimization of weight parameters is performed with the aim of zeroing out
    these residuals and represents unsupervised learning. The PINN calculates weight
    parameters that minimize'
