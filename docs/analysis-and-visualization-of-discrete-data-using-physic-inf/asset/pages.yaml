  md: '# ## Chapter 5


    # Physically Based Surrogate Model


    **5.1. About the CAE surrogate model**


    PINNs are expected to play important roles in CAE surrogate model (SM) construction.
    CAE stands for "Computer-Aided Engineering" and refers to technologies and tools
    that utilize computers to support design, analysis, simulation, and other tasks
    related to engineering [45]. Surrogate means a substitute as in surrogate mother.
    In CAE, an SM is used when the results of interest cannot be computed efficiently.
    Most engineering design problems require numerical simulation to evaluate the
    objective function as a function of design variables. For example, to find the
    optimal wing shape for an aircraft, engineers compute the airflow around the wing
    for various shape variables such as length, curvature, and material. However,
    for many real-world problems, a single numerical simulation may take minutes,
    hours, or even days to complete. As a result, routine tasks such as design optimization,
    design space exploration, sensitivity analysis, and what-if analysis become difficult
    to perform because they require thousands or millions of numerical simulation
    evaluations. One way to reduce this burden is to use an approximate model called
    SM.


    **5.1.1. Example of SM construction**


    Two examples of SM construction that the author has performed are introduced in
    the following.


    **5.1.1.1. Case 1: Heat management of laptop computers**


    Temperature prediction for laptop computers is positioned as an essential technology
    to improve CPU performance and reduce the chassis size. The CPU package is represented
    as a thermal resistance network [47] consisting'
  merge: -1
  img_proc: true
- pgno: 212
  md: '![](img/fa57e7010b16a211d5cf69ebb17e416e_212_0.png)


    Figure 5.1. Thermal resistance network for CPU packages.


    of multiple thermal resistances, and the simulation results for the CPU package
    and the space around it are used to identify their thermal resistance values (Figure
    5.1).


    Specifically, the computer chassis in which the CPU package might be placed is
    expressed as several boundary conditions, and a CAE model is computed for that
    number of boundary conditions. Using these results, the thermal resistance is
    computed using optimization methods. This thermal resistance network that takes
    into account various situations (called a compact model) is used when detailed
    CAE models are computationally time-consuming, which is considered a kind of SM.


