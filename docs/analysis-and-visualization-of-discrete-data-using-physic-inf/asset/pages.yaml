    # 4.3.3. How to find solutions to PDEs using PINNs


    In the methods to find solutions to PDEs discussed in this book, approximate solutions
    are computed while constructing an NN model from physical data representing Dirichlet
    boundary conditions and minimizing PDE residuals at the same time (Figure 4.38).
    Similar to the PDE derivation method, this method to find solutions to PDEs performs
    a multi-purpose parameter optimization computation. One of the purposes is to
    construct an NN model from physical data representing Dirichlet boundary conditions,
    and the parameter to be optimized is the NN weights. In other words, it searches
    for parameters that minimize the loss function. Another objective is to enhance
    the loss function by incorporating, through automatic differentiation, the residuals
    computed using the partial derivative terms of the NN model, in addition to the
    mean squared error. In addition, when a Neumann boundary condition is given, automatic
    differentiation is used to compute this boundary condition and its averaged squared
    error is added to the loss function. Figure 4.38 shows the case in which only
    the Dirichlet boundary condition is given.


    From the Dirichlet boundary condition, the space-time coordinates in which the
    physical data are defined are taken out and entered into the input layer. The
    NN model error is computed by averaging the squared error between the data regressed
    by the NN and the physical data with the boundary point set to be trained. The
    PDE error is computed by averaging the PDE residuals given inside the domain of
    interest with the sampled point group. The sum of these two errors is used as
    a loss function to optimize the NN weight parameters. AD is used to compute the
    PDE residuals.'
