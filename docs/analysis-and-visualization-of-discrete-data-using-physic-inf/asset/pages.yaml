    first row, write the following: `Cells(1,5)=str(NROWS + 4)`


    +   - Concatenate strings: To concatenate and assign three character-type data
    NR in the sixth column of the first row, write the following: `Cells(1,6)="B2."+"L"+"20"`


    To search for the explanatory variable data column with the smallest absolute
    value of t-value, write the following in the VBA program.


    ```

    ```vba

    <Begin>

    TMIN = 999999

    For j = 1 To CVARS

    TVAL = Abs(Cells(j + NLINES + 20, 4))

    If TVAL < TMIN Then

    TMIN = TVAL

    IMIN = j

    End If

    Next j

    <End>

    ```

    ```


    CVAR represents the number of explanatory variables, NLINES represents the sample
    size, and TMIN represents the current minimum value. Initially, a large number
    (999999) is assigned. j + NLINES + 20 is the row number on which the t-value is
    written. To delete the column with the smallest absolute value of t-values, write
    the following macro in the VBA program:


    ```

    ```vba

    <Begin>

    TRange = Chr(Asc("B") + IMIN - 1)

    Columns(TRange).Select

    Selection.Delete Shift:=xlToLeft

    CVARS = CVARS - 1

    <End>

    ```

    ```'
