- pgno: 17
  md: '![](img/fa57e7010b16a211d5cf69ebb17e416e_17_0.png)


    Figure 1.7. Absolute reference.


    It is recommended to use the absolute reference function in order to retain the
    cell address in a formula when the formula is copied.


    +   1. Select the B4 address. This will cause the cell to be surrounded by a thick
    frame with a small square appearing at the bottom right.

    2. Dragging the small square downward will not trigger the autofill to work.

    3. Instead, click to select B1, which is the “commission rate”, and press F4.

    4. Make sure the column and row numbers are prefixed with “$” to indicate they
    are absolute references. There are three prefixing patterns: absolute reference
    for both column and row, for row only, and for column only. This pattern can be
    changed by pressing the F4 button.


    To learn how to use relative and absolute references, display the calculation
    results of numbers in column A × numbers in row 1.


    +   1. Enter 1 to 9 downward, starting from row 2 of column A.

    2. Enter 1 to 9 rightward, starting from row 1 of column B.

