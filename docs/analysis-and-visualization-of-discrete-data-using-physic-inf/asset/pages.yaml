    variables. For example, to find the optimal wing shape for an aircraft, engineers
    compute the airflow around the wing for various shape variables such as length,
    curvature, and material. However, for many real-world problems, a single numerical
    simulation may take minutes, hours, or even days to complete. As a result, routine
    tasks such as design optimization, design space exploration, sensitivity analysis,
    and what-if analysis become difficult to perform because they require thousands
    or millions of numerical simulation evaluations. One way to reduce this burden
    is to build an approximate model, called a surrogate model. In the last few years,
    surrogate models using NNs have been widely used. But these are simple approximate
    models that do not refer to the PDE that describes the target numerical simulation,
    and there are sometimes concerns about ensuring physical accuracy. To find a future
    direction for the surrogate model, one needs to consider how to deepen its relationship
    with PDEs.


    Suppose now that a numerical simulation is run with various boundary conditions,
    physical data in the region of interest are obtained, boundary conditions, physical
    data in the region of interest are obtained, bound-

    ary conditions are entered into the NN input layer, and physical data are


    ![](img/fa57e7010b16a211d5cf69ebb17e416e_222_0.png)


    Figure 6.1. Physics-based surrogate model.'
  merge: -1
