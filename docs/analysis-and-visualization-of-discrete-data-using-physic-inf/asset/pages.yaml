    the wall. The plasma is composed of energetic particles produced at high temperatures
    and pressures, and the walls are typically made of cold metal. Therefore, there
    is a difference in temperature and pressure between the plasma and the wall. The
    boundary where this difference occurs is called the “edge”. The edge plays an
    important role in fusion reactors. Among the most important roles are the following:


