  img_proc: true
- pgno: 144
  md: 'as follows:


    ```

    $$u_{t}=-\varepsilon_{x} u_{x}-\varepsilon_{y} u_{x}-\varepsilon_{z} u_{z}+\varepsilon_{xx}
    u_{xx}+\varepsilon_{yy} u_{yy}+\varepsilon_{zz} u_{zz} \quad(4.3)$$

    ```


    Subscripts indicate partial derivatives in time or space. Assuming that the candidate
    partial differential terms in the PDE are partial differential terms up to the
    second order, $u_{t}$ is defined as follows:


    ```

    $$u_{t}=\sum_{i=1}^{D} \varepsilon_{i, 0} u_{x_{i}}+\sum_{i=1}^{D} \sum_{j=1}^{D}
    \varepsilon_{i, j} u_{x_{i} x_{j}} \quad(4.4)$$

    ```


    where $u_{x_{i}}$ and $u_{t}$ represent the partial differential terms due to
    $x_{i}$ and time $t$, respectively, and each is given by automatic differentiation.
    $D$ represents the number of dimensions of the spatial coordinate, which is three
    in this case. The PDE derivation is to estimate the value of the coefficient $\varepsilon_{i,
    j}$. Thus, regularized regression analysis is used to estimate these coefficients.
    This formulates the following least-squares problem for the RRE error:


    ```

    $$\underset{\varepsilon}{\operatorname{argmin}}\left\{\frac{1}{N_{P}} \sum_{N_{P}}\left(u_{t}-\sum_{i=1}^{D}
    \varepsilon_{i, 0} u_{x_{i}}+\sum_{i=1}^{D} \sum_{j \neq i}^{D} \varepsilon_{i,
    j} u_{x_{i} x_{j}}\right)^{2}+\lambda \frac{1}{N_{\varepsilon}}\|\boldsymbol{\varepsilon}\|_{2}^{2}\right\}
    \quad(4.5)$$

    ```


    where $\varepsilon$ denotes $\boldsymbol{\varepsilon}=\left[\varepsilon_{1,0}
    \ldots \varepsilon_{D, 0} \varepsilon_{1,1} \ldots \varepsilon_{D, 1} \varepsilon_{2,2}
    \ldots \varepsilon_{2, D} \ldots \varepsilon_{D, D}\right]^{T}$, and $\|\cdot\|_{2}^{2}$
    denotes the vector sum of squares. The above problem is a convex optimization
    problem for which several practical algorithms have been proposed. Examples include
    the iterative shrinkage threshold algorithm, iteratively reweighted least squares
    (IRLS), and forward-backward splitting (F0BOS). Applying regularized regression
    can force certain coefficients to be set to zero.


    # ### 4.1.3. Definition of error


    It is important to define the error for the evaluation of PDE derivation methods.
    In addition to the NN model error ($E_{u}$), regularized regression equation error
    ($E_{RRE}$), and PDE derivation error ($E_{\varepsilon}$) described so far, the
    partial differential term error ($E_{u_{t}, x, y, z, \ldots}$) can be defined
    for PDEs with exact solutions as follows:


    ```

    $$E_{u_{t}, x, y, z, \ldots}=\|\hat{u}_{t, x, y, z, \ldots}-u_{t, x, y, z, \ldots}\|_{2}^{2}
    / N_{P}, \quad(4.6)$$

    ```


    where $\hat{u}_{t, x, y, z, \ldots}$ and $u_{t, x, y, z, \ldots}$ are partial
    differential terms computed from the NN model and exact solution, respectively.
    $\hat{u}_{t, x, y, z, \ldots} u_{t, x, y, z, \ldots}$ can be'
