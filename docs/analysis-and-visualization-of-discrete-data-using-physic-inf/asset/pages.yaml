    # 4.1.4.5. One-dimensional heat conduction equation


    The heat conduction equation is a partial differential equation that describes
    how heat is transferred inside a material. The heat conduction equation is used
    to describe the temperature distribution of a material.


    In one dimension, the heat conduction equation is expressed as follows:


    $$\frac{\partial u}{\partial t} - D\frac{\partial^2 u}{\partial x^2} = 0 \qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad
    (4.19)$$


    where $u$ represents the temperature distribution inside a material, $t$ represents
    time, and $x$ the coordinates in one-dimensional space. $D$ is the thermal diffusivity,
    which depends on the thermal conduction properties of the material.'
