- pgno: 223
  md: 'also entered into the NN output layer to construct an NN model. This NN model
    will be able to predict the physical data when unknown boundary conditions are
    given, without being affected by PDEs that explain the numerical simulation. This
    is the conventional surrogate model commonly used today (see lower left of Figure
    6.1). The NN, which can be created by inputting the space-time coordinates that
    acquire physical data besides boundary conditions, can predict physical data from
    arbitrary space-time coordinates and boundary conditions. This is called a highly
    scalable surrogate model (see the lower part of Figure 6.1). It is surely more
    scalable, but physical validity remains untouched.


    The question we are asking here is whether we can incorporate PDE residuals in
    the process of building a surrogate model in order to improve the physical validity
    of the surrogate model? There are several answers to this question, but using
    PINNs is a sure way to achieve this. The NN model created by making it learn multiple
    boundary conditions can provide a place where arbitrary boundary condition data
    can be specified, and physical validity can also be guaranteed, resulting in a
    so-called highly accurate surrogate model (see lower right of Figure 6.1).'
  merge: -1
