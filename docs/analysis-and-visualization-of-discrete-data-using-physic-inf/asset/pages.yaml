- pgno: 141
  md: 'from observations is a difficult task. The ability to symbolically model complex
    network systems is key to understanding such systems, and this remains an open
    question in many disciplines. It is essential to model the space-time continuum
    field from given physical data to evaluate partial derivatives and reveal the
    PDE. There are two approaches to representing the distribution of data in a field
    for accurate evaluation of partial differential terms: local interpolation and
    global approximation.


    For the first approach (local interpolation), Bongard et al. proposed methods
    that can automatically generate symbolic equations for nonlinear coupled dynamical
    systems directly from time series data [27]. However, those methods were usable
    only to ODEs. Guo et al. studied the identification of a class of multi-scale
    space-time dynamical systems incorporating multiple spatial scales obtained from
    observations [28, 29]. This approach employed a local interpolation method that
    uses polynomials as basis functions, expands multilevel operators, and estimates
    spatial derivatives using the finite difference method (FDM). The coefficients
    of the polynomials may vary with respect to the spatial domain to represent multi-scale
    features related to system dynamics. They are approximated using B-spline wavelet
    multiple resolution analysis.


    For the second approach (global approximation), Raissi et al. recently employed
    PINNs as the machine learning method. This means that the PDE is derived by introducing
