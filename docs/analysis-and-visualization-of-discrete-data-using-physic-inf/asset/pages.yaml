    There are two types of normal probability plots: normal P-P plot and normal Q-Q
    plot. Here, we will create a normal probability plot (normal Q-Q plot), as shown
    in Figure 2.9. The steps are from 1 to 8 (Reference: https://bellcurve.jp/statistics/blog/15362.html).'
