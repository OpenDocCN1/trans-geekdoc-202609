- pgno: 50
  md: 'and forecasting of data because it can search for statistically significant
    correlations. As we will discuss later, regression analysis can be used to derive
    a PDE. When the explanatory variable is a single variable, it is called simple
    regression, and when there are multiple explanatory variables, it is called multiple
    regression. We will discuss the simple regression model.


    First, assume the following model:


    $$ y = \alpha + \beta x + u $$


    In this equation, $\alpha$ and $\beta$ represent certain constants, and $u$ represents
    a random variable. That is, given $x$, the model assumes that $y$ is determined
    by the deterministic term $\alpha + \beta x$ added to a random shock $u$. $y$,
    $x$, and $u$ are referred to as follows:


    +   - $y$: Explained variable, dependent variable.

    - $x$: Explanatory variable, independent variable.

    - $u$: Error term, disturbance term.


    # 2.3.1. Model characteristics


    The regression analysis model is a statistical method for modeling the relationship
    between an explanatory variable (independent variable) and an objective variable
    (dependent variable).


    +   - The relationship between variables can be expressed by a linear model:


    In regression analysis, the relationship between the explanatory variables and
    the objective variable can be expressed as a linear equation. The linear equation
    can be used to predict the value of the objective variable when given the explanatory
    variables. Although a linear model may seem restrictive, it is possible to capture
    the nonlinear effects of $x$ by including $x^2$ as an explanatory variable or
    by performing variable conversion such as $\ln(x)$.


    +   - The relationship between explanatory and objective variables can be elucidated:


    Specifically, we can examine how the explanatory variables affect the objective
    variables and whether the effect is statistically significant.'
