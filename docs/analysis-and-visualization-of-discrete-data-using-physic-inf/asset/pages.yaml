  md: 'methods for numerically solving PDEs on continua, where the object to be computed
    is represented as a collection of particles [44]. It is mainly used for fluid
    and structural analyses. In particular, in fluid analysis, it belongs to the Lagrange
    multiplier, which has the feature of eliminating the need to calculate the convection
    term. The particle method sets a parameter called radius of influence. The radius
    of influence refers to the radius used to find the local physical quantity (density,
    gradient value of pressure, Laplacian of velocity, etc.) at a given location.
    It is often used to count the number of particles within this radius or to take
    a weighted average of the physical quantity.


    The method to solve PDEs using NNs described here is similar to PM in that it
    does not require a difference grid or finite elements. But it differs significantly
    in that it does not require the radius of influence to be set up to compute the
    partial differential terms. It shares some common points with FEM in that it evaluates
    PDE residuals at points within the region of interest. By explaining the weighted
    residuals that characterize FEM, its difference from the method to solve PDEs
    using NNs is clarified.


    To explain the weighted residual method, this section examines the steady-state
    heat conduction problem in the two-dimensional analytical domain $v$ as shown
    in Figure 4.37. Now, the problem in this case is defined by the following equation
    [27]: That is, governing equation: $\kappa (u_{xx} + u_{yy}) + Q = 0$ (in $v$)
    is solved under the boundary condition: $u = 0$ (on $s$) where $u$ is the temperature,
    $\kappa$ thermal conductivity, and $Q$ heat generation rate per unit volume.


