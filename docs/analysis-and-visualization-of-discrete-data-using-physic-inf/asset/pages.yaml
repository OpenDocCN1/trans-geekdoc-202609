  md: 'time series data by assuming that the current values of time series data are
    determined by past data values and by building such models. The autore- gressive
    model is expressed by the following equation:


    y(t) = c + varphi _ {1} y(t - 1) + varphi _ {2} y(t - 2) + ... + varepsilon (t)
    \tag{2.16}


    In this equation, $y(t)$ represents the current value of the time series data,
    c represents a constant, $\varphi _ {1}, \varphi _ {2}, ...$ represent the autoregressive
    coefficients, and $\varepsilon (t)$ represents the error term. The larger the
    autoregressive coefficient, the stronger the influence of the past data values.
    The error term represents the random noise in the time series data. Autoregressive
    models may be used for predicting or filtering time series data.


