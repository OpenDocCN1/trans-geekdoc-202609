    # 1.1.2. Name box and formula bar


    The name box and formula bar (Figure 1.2) in Excel have the following roles:


    +   • Name box: In Excel, you can name a specified cell or range. This is called
    naming. Naming allows you to specify a cell or a range of cells. A named cell
    or range is called a “name” in Excel. You can manage your data more efficiently
    by specifying a named cell or range. Excel provides a function called “name box”
    that allows you to specify a named cell or range by entering its name.


    +   • Formula bar: In Excel, you can calculate data by entering a formula. You
    can enter a formula in a place called “formula bar”. The formula bar is located
    in the Excel status bar and used to enter a formula into a cell. Entering a formula
    allows you to calculate data efficiently.'
  merge: -1
  img_proc: true
