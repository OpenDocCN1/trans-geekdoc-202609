    The following Breusch–Pagan test has been widely proposed as a test for heterogeneity
    of variance.


    # 2.3.2.2. Breusch–Pagan test


    The Breusch–Pagan Test [17] is a method for testing whether the error terms in
    the residuals are independent. Specifically, the error terms are assumed to be
    independent in a regression analysis, but in reality, they may not be. The Breusch–Pagan
    Test can detect that the error terms are not independent in such cases. The resulting
    p-value indicates whether the error terms are independent or not.


    Assume now that the multiple regression model is formulated as follows:


    ```

    $y_{i} = \alpha + \beta_{1}x_{1,i} + \beta_{2}x_{2,i} + \cdots + \beta_{k}x_{k,i}
    + u_{i} \quad (2.10)$

    ```'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'The error is determined as follows:


    ```

    $$e_{i}=y_{i}-\alpha-\beta_{1}x_{1,i}-\beta_{2}x_{2,i}-\cdots-\beta_{k}x_{k,i}\tag{2.11}$$

    ```


    Assume that the square error $e_{i}^{2}$ is formulated by a similar regression
    model:


    ```

    $$\begin{aligned} e_{i}^{2} &=\delta_{0}+\delta_{1}x_{1,i}+\delta_{2}x_{2,i}+\cdots+\delta_{k}x_{k,i}+v_{i}
    \end{aligned}\tag{2.12}$$

    ```


    Then, formulate the following null hypothesis $H_{0}$:


    ```

    $$H_{0}:\delta_{1}=\delta_{2}=\cdots=\delta_{k}=0\tag{2.13}$$

    ```


    The test for $H_{0}$ is performed by an $F$-test using the following $F$-value:


    ```

    $$\frac{(\mathrm{RSS}-\mathrm{TSS}) / k}{\mathrm{RSS} / (n-(k+1))}=\frac{(\mathrm{ESS})
    / k}{\mathrm{RSS} / (n-(k+1))}\sim F(k, n-(k+1))\tag{2.14}$$

    ```


    The resulting $p$-value indicates the probability that the hypothesis is true
    if the null hypothesis is that “the variance of the residuals is independent of
    the explanatory variable (that is, satisfies the homoscedasticity)”. The smaller
    the $p$-value, the more likely it is that the null hypothesis is rejected, and
    the variance of the residuals depends on the explanatory variable (that is, it
    does not satisfy the homoscedasticity).


    If the $p$-value is somewhat small (usually less than 0.05 or less), the assumption
    of homoscedasticity is not satisfied. Therefore, it is necessary to consider improving
    the model or employing a different statistical method. On the other hand, if the
    $p$-value is sufficiently large, the assumption of homoscedasticity is considered
    to be satisfied, and the results of the regression analysis can be used with confidence.
    When we perform a regression analysis using the square of the residuals as the
    objective function for the sales data described in Figure 1.12, we see that the
    $F$-value is 0.9472, which is sufficiently high (Figure 2.14).


