    Range”, specify the cell to which stats will be output.

    (5) After clicking [OK], the results of the $F$-test are output to the specified
    cell (Figure 2.7).


    The $F$-test is a statistical test method used to compare whether the variances
    of two or more populations are equal. The ratio of the variances of the two populations
    being compared is called the “variance ratio”.


    Specifically, in the $F$-test, independent samples from the two populations are
    obtained, and the variance of each sample is determined. The ratio of these variances
    is then calculated to obtain a value called the $F$-value. Based on whether this
    $F$ value exceeds a certain boundary value, we determine whether the population
    variances are equal.


