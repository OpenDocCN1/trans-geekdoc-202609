  md: '![](img/fa57e7010b16a211d5cf69ebb17e416e_90_0.png)


    In neural networks, learning is the process of automatically adjusting parameters
    such as weights and biases of a neural network using training data. Through this
    process, the neural network builds a model that is optimized by the training data.


    Neural network training is divided into two main steps: “forward propagation”
    and “back propagation”. Forward propagation is a step in which the process from
    the input layer to the output layer is executed in sequence, with the input data
    passing through the network to produce the output. Back propagation is the step
    in which the error is back propagated from the output layer to the input layer,
    updating weights and biases to minimize the error.'
  merge: -1
