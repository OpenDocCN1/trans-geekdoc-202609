  md: 'Now, in the domain \(v\), the unknown function \(u\) is approximated using
    the known sequence of functions \(u_j\), \(j = 1, N\) as follows:


    \[ u = \sum_{j=1}^{n} a_j u_j \tag{4.45} \]


    Here, be sure to select \(u_j\), \(j = 1, N\) that becomes zero on the boundary
    \(s\).


    The \(u_j\) is called the trial function, and \(a_j\) is an unknown constant.
    Equation (4.45) is substituted into the governing equation to obtain the residual


    \[ R(x, y) = \kappa \left( \sum_{j=1}^{n} a_j (u_{j,xx} + u_{j,yy}) \right) +
    Q. \tag{4.46} \]


    If the test function is an exact solution to the steady-state heat conduction
    problem, then the residual \(R\) should be zero. However, when the exact solution
    is not known and an approximate solution is to be obtained, the residual cannot
    be zero. Therefore, the weighted residual method determines \(a_j\) so that the
    residuals become zero in the average sense. That is, the residual \(R\) is multiplied
    by some weighting function \(w_i\) and integrated, which is set as zero. This
    is expressed in the equation as


    \[ \iint_v w_i R \, dv = 0, \quad i = 1, n. \tag{4.47} \]


    If \(n\) different functions are used in this equation as \(w_i\), equation (4.47)
    becomes a series of \(n\) linear equations. Various weight functions \(w_i\) can
    be chosen, and two typical ones are shown in the following:


    +   *   Collocation method


    The Dirac delta function is chosen as the weight function. That is,


    \[ w_i(\boldsymbol{x}) = \delta(\boldsymbol{x} - \boldsymbol{x}_i). \tag{4.48}
    \]


    However, \(\boldsymbol{x}\) is a coordinate vector. This function has the property
    of


    \[ \iint_v \delta(\boldsymbol{x} - \boldsymbol{x}_i) R \, dv = R(\boldsymbol{x}_i).
    \tag{4.49} \]


    Thus, in this method, the residual \(R\) is determined so that the residual becomes
    zero at the specified \(n\) collocation points. As \(n\) increases, the residuals
    become zero at many points, and the entire domain is expected to eventually become
    zero.'
