    # ### 1.3. Organization of this document


    This book begins with the Basic, which describes data analysis methods using Excel.
    In the Basic, we will explain mean and variance testing, regression analysis using
    the Excel analysis tool, and how to implement an NN using the Excel solver. Furthermore,
    we will demonstrate automatic differentiation and introduce how to solve a simple
    PDE.


    In the Practical Part that follows, we will explain how to create a spatiotemporal
    model using an NN. First, we will explain a method for visualizing page information
    from ancient literature data shot with a three-dimensional CT machine. Then, we
    will regard a magnetic line group calculated from the results of analyzing electromagnetic
    fields in a fusion reactor as physical data and explain how to visualize the plasma
    region using an NN. Up to this point, physical data irrelevant to time are handled.


    As an advanced application, we will explain how to use an NN to derive a PDE that
    describes physical data and how to solve the PDE using the NN. Finally, we will
    demonstrate a surrogate model, together with some examples. The surrogate model
    streamlines what-if analysis by linking parameters, such as conditions from large-scale
    numerical simulations, with physical data.'
