- pgno: 91
  md: 'Specifically, for training, a measure called the loss function is defined,
    and weights and biases are updated to minimize the difference between the neural
    network''s output and the ground truth data. Therefore, the neural network is
    adjusted to fit the training data. Regularization techniques, dropouts, and other
    methods may also be used to prevent overlearning.


    Once sufficiently trained, neural networks can achieve high predictive accuracy
    for unknown data. Learning in neural networks is a type of optimization. Learning
    in neural networks aims to obtain optimal prediction results by using training
    data and adjusting parameters such as weights and biases. Now, assume that the
    NN consists of $L$ layers and that $n_{i}$ neurons are defined in layer $i$. The
    number of parameters to be optimized can be calculated as follows:


    ```

    $$\sum_{i=1}^{L+1}(n_{i}+1)n_{i+1} \tag{2.24}$$

    ```


    In this equation, $i=1$ represents the input variable, so $n_{1}=4$ for space-time
    coordinates. The addition of 1 is due to the inclusion of bias as a type of weight.
    Also, $i=L+2$ represents the output variable, so $n_{L+2}=1$ for scalar data.
    Figure 2.26 shows an NN consisting of $L$ layers.


    Weights are defined on arcs connected to the neurons and output variables. For
    small NNs, we focus on clarity and explain how to optimize the weights using the
    Excel Solver. For practical use, we will use keras and other libraries introduced
    in Chapter 1.


    The learning process searches for parameter values that minimize the loss function
    in order to minimize the difference between the output of the neural network and
    the ground truth data. This search process is performed using optimization algorithms
    (e.g., gradient descent method).


    As the learning progresses, the parameters are updated, and the value of the loss
    function is reduced to obtain the optimal parameters. Using these optimal parameters,
    the neural network can achieve high prediction accuracy for unknown data.


    # **2.7.1. Universal approximation theorem**


    The universal approximation theorem is a theorem that states that an NN can approximate
    any continuous function with any precision. In other words, a properly designed
    NN can approximate a desired output for any given input.'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'This theorem is one of the reasons why NNs have become widely used and is the
    basis for demonstrating their usefulness. In practice, however, it is not always
    easy to achieve, as it requires a sufficient number of neurons, appropriate algorithms,
    datasets, etc., to be able to approximate with any precision that the theorem
    suggests.


    The universal approximation theorem was first proposed in 1989 in the paper "Multi-Layer
    Feedforward Networks are Universal Approximators" by George Cybenko and Edward
    G. Widrow [23]. This paper was published in the IEEE Transactions on Neural Networks
    and Learning Systems and later became an important foundation for the theory of
    neural networks. In this paper, George Cybenko and Edward G. Widrow proved that
    there exist neural networks that can approximate any continuous function with
    any precision. They showed that this theorem made neural networks very powerful
    and led to the widespread use of neural networks.


    The existence of a neural network that can approximate any continuous function
    with any precision can be proved as follows:


    +   - First, a neural network with one single sigmoid function can approximate
    a Lipschitz continuous function. A Lipschitz continuous function is a function
    with a rate of change bounded by some constant, and it is possible to approximate
    such a function.

    - Second, a neural network with multiple sigmoidal functions can approximate any
    Lipschitz continuous function. This is because each layer takes the previous layer''s
    output as input, thus allowing more complex functions to be represented.

    - Finally, any continuous function can be represented as the sum of an infinite
    number of Lipschitz continuous functions. This means that a neural network with
    multiple sigmoidal functions can be used to approximate any continuous function
    with any precision.


    Therefore, a Lipschitz continuous function is a continuous function in which a
    constant $L$ exists, and the following equation holds for the function $f$:


    $$| f(x) - f(y) | \le L | x - y | \tag{2.25}$$


    In this equation, $x$ and $y$ represent any two points within the domain of the
    definition of $f$, and $| \cdot |$ represents the absolute value. This definition
    indicates that "the change in the value of $f$ is bounded in proportion to the
    change in its argument". In other words, the closer $x$ and $y$ are to each other,
    the smaller the difference between $f(x)$ and $f(y)$.'
