    $w_{0}w_{1}w_{2}$ as parameters, the parameters that minimize the mean square
    error between the spatiotemporal model and the given discrete data were calculated
    using the Excel Solver function.


    In the previous section, we discussed specific ways to achieve regression analysis
    using the Solver. In this section, we will use the same data to explain how to
    achieve an NN model by using Solver. A simple NN model can be realized as an activation
    function connected to the output of this linear regression model. This time, we
    use the Sigmoid function


    $$\sigma(x) = \frac{1}{1 + e^{-x}}$$ (2.28)


    and assume that the output obtained using this function in the Excel sheet function
