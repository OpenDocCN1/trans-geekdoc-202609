    reflect the electrical behavior of charged particles and the magnetic behavior
    of magnetic materials. In a fusion reactor, electromagnetic coils can be used
    to create an electromagnetic field to confine the plasma. This electromagnetic
    field exists within the container that confines the plasma and serves to anchor
    it. In addition, in a fusion reactor, the temperature inside the plasma must be
    adjusted so that the fusion reaction does not occur inside the plasma. Therefore,
    electromagnetic field simulations are used in fusion reactors to study how to
    confine the plasma and regulate the temperature in the plasma. Next, we will discuss
    the edge and divertor, which play important roles in the structure of a fusion
    reactor.


