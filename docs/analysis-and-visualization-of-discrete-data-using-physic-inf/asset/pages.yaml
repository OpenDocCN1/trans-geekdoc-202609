  md: 'In model compiling, Keras is used to compile the NN model and each instruction
    in the above coding has the following meaning:


    +   * **optimizer=''adam''**: Specifies that the Adam optimizer is used as an
    optimization algorithm to update model parameters. Adam is one type of optimization
    algorithm based on the gradient descent method and is characterized by fast speed
    and fast convergence.

    * **loss=''sparse_categorical_crossentropy''**: Sets a loss function of the model.
    In this case, a sparse version of the cross-entropy loss is used for classification
    tasks. This version is used when the correct answer labels are each indicated
    as a scalar value and encoded as a class index.

    * **metrics=[''accuracy'']**: Sets metrics to evaluate the model. In this case,
    this specifies that the correct answer rate is used to evaluate the model''s performance.
    The correct answer rate represents the percentage of samples for which prediction
    matches the correct answer.


    These settings define how the model learns and determines an optimization algorithm,
    the loss function, and evaluation metrics.


    In model training, Keras is used to train the NN model and each instruction in
    the above coding has the following meaning:


    +   * **x_train**: Represents input data for training. In this case, it contains
    image data of handwritten digits from the MNIST dataset. The input data are entered
    into the input layer of the NN.

    * **y_train**: Represents the correct answer data for training. In this case,
    it contains label data for handwritten digits from the MNIST dataset. The correct
    answer data are represented in a format that corresponds to the number of nodes
    in the output layer of the NN and are used when training the model.

    * **epochs=5**: Specifies the number of model training operations. One epoch means
    that the model is trained with the entire training dataset for one time. In this
    case, the model is trained for five epochs.


    **The model.fit()** method trains the model using the given training dataset.
    More specifically, the training data are split into minibatches and the gradient
    descent method is used for each minibatch to update model parameters. Then, the
    loss function and evaluation metrics for the model are calculated to report the
    progress of training. Splitting training data into minibatches means that a large
    dataset is split into several smaller batches to update model parameters for each
    minibatch. This allows the'
