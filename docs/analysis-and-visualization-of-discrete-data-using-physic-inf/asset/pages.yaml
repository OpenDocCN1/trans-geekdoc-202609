  md: 'on computational science is expected to play an important role in assessing
    the effectiveness of such heat-shielding pavements, but it is not yet available
    for citizens to use. One solution to this issue is a highly anticipated physics-based
    surrogate model for the general public with no experience or knowledge of computational
    simulation.


    Once it becomes available, even without experience or knowledge of computational
    simulation, any citizen interested in policymaking can be assumed to have some
    idea of what-if analysis. In the case of a heat problem, for example, when many
    citizens are interested in the radiative properties of construction materials
    and their impact on the temperature, experts run computational simulations with
    different radiation characteristics and use deep learning to create models that
    explain temperatures by radiation characteristics. This model can be classified
    as a surrogate model because it allows temperatures to be evaluated from radiative
    properties without the need for actual computational simulations. Using the surrogate
    model, citizens interested in heat issues can perform a what-if analysis. The
    surrogate model improves accuracy from a statistical point of view, but this result
    does not guarantee physical validity.


    To ensure physical validity, PINNs may be employed for surrogate models. In PINNs,
    environmental data are measured to derive physical models such as PDEs, and then
    citizens and other interested parties solve the PDEs using various environmental
    parameters. In PINNs, space-time coordinates are fed into the input layer, and
    a loss function is constructed from the calculation results at the output layer
    and the physical data associated with its coordinates. Next, an automatic differentiation
    operation is performed on the NN model to add PDE residuals and regularization
    terms to the loss function. This operation allows the construction of a surrogate
    model with guaranteed physical validity.


    This physics-based surrogate model can be used to assist in generating evidence
    to formulate environmental policy. Policymaking begins with clarifying issues,
    and what-if analysis is essential in this phase to recognize the problem and to
    estimate the factors that affect the problem. While environmental data such as
    temperatures and heat indices are what we focus on in the issue of global warming,
    identifying the factors that influence them requires examination of physics as
    well as intuition and experience. Surrogate models based on physics play an important
    role because not many policymaking officials specialize in physics. In order to
    utilize surrogate models with physical validity in policymaking, it is necessary
    to properly incorporate physics into surrogate models.'
