    # 1.1.3. Ribbon


    The Excel ribbon refers to the tabbed menus that appear in the main Excel window.
    The ribbon has various functions and commands grouped together into a tab according
    to the category. There are various tabs, such as Home and Data. Users can use
    commands in the ribbon to manipulate Excel to create or edit a table.


    The tabs and the area containing the buttons which can be switched by clicking
    a tab are collectively called the “ribbon” (Figure 1.3). You can switch between
    buttons by clicking the tab placed above them.


    # 1.1.4. File tab and Backstage view


    The Excel file tab is a special tab that appears in the upper-left corner of the
    main Excel window. Clicking on the File tab will bring up the Backstage view (Figure
    1.4).


    The Backstage view is a space for managing Excel files and data. The Backstage
    view contains templates for creating a new workbook, as well as'
  merge: -1
