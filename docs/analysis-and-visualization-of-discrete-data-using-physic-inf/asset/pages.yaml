  md: '# 4.3.2.2.  Finite difference method (FDM)


    This method converts the PDE into a difference form and solves it numerically.
    The difference form approximates the difference used to evaluate the solution
    of the PDE to a continuous function. It is usually expressed as a difference equation.
    PDEs solved using the difference method are discretized in both space and time.
    FDM solves PDEs using a finite difference approximation for discretized space
    and time. Note that FDM is also used to solve higher-order PDEs, but with limited
    accuracy.


    The sample code for solving a heat transfer problem in Colab is shown in the following.
    This code is intended to numerically solve unsteady one-dimensional heat transfer
    problems using specific boundary conditions and thermal conductivities.


    ```

    < Start >

    import numpy as np

    # As a boundary condition, set a temperature of 100°C at the left end and 0°C
    at the right end.

    T_left = 100

    T_right = 0

    # Set the thermal conductivity.

    k = 0.1

    # Set the space pitch width.

    dx = 0.1

    # Set the time pitch width.

    dt = 0.01

    # Set the initial temperature value.

    T = np.zeros((101, 101))

    # Compute time evolution.

    for t in range(1, 10000):

    for i in range(1, 100):

    T[i, t] = T[i, t-1] + k * dt/dx**2 * (T[i+1, t-1] - 2*T[i, t-1] + T[i-1, t-1])

    ```'
