    # 3.5. Increasing the accuracy of visualization of magnetic line group data using
    automatic differentiation


    As an example of analysis of line group data using an NN, we have explained the
    construction of an NN model that describe part data on the magnetic lines calculated
    from simulation of the electromagnetic field in a fusion reactor. This model allows
    you to calculate the probability of an arbitrary point being in the plasma region.
    In calculating this probability $u(x,y,z)$, its gradient vector represents the
    normal vector to the plasma region surface. The gradient vector can be easily
    calculated by automatic differentiation. The magnetic flux density vector obtained
    from the electromagnetic field simulation results is parallel to the magnetic
    lines. So, the normal vector to the region surface and the magnetic flux density
    vector can be expected to be orthogonal. At each point on a magnetic line, inner
    products are calculated between the gradient vector and the magnetic flux density
    vector at that point, and then the inner products at all points on the magnetic
    line are added. Assuming that the NN model represents a plasma region, the added
    result is expected to be zero, so the following term is a new error term:


    $$ MSE_{ip} = \frac{1}{N_u} \left\| \begin{pmatrix} \frac{\partial u}{\partial
    x} & \frac{\partial u}{\partial y} & \frac{\partial u}{\partial z} \end{pmatrix}
    \begin{pmatrix} B_x \\ B_y \\ B_z \end{pmatrix} \right\|_2^2 \tag{3.12} $$


    This error term is added to the loss function. When the loss function is small
    enough, the surface enveloping the magnetic lines can be visualized'
