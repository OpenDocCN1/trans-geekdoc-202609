- pgno: 9
  md: '# Chapter 1


    # Introduction


    In this chapter, you will learn practical methods for analyzing physical data
    spatio-temporally defined by discrete points. Physical data refer to data used
    to describe physical or other phenomena. The physical phenomena refer to various
    phenomena that exist in nature. They include, for example, weather, temperature,
    earthquakes, and floods. The physical data are often defined as spatio-temporal
    discrete data. The spatio-temporal discrete data refer to data that are not spatio-temporally
    continuous. When we handle spatio-temporal discrete data, we usually divide the
    spatio-temporal axis into discrete segments so that we can handle data in each
    segment.


    Spatio-temporal discrete data can be used in a variety of fields. For example,
    in the social and natural sciences, spatio-temporal discrete data are sometimes
    used to analyze various phenomena and their continuous changes. In biology and
    geology, spatio-temporal discrete data are sometimes used to analyze phenomena
    that occur in time.


    Physical data can be measured in a variety of ways as follows:


    +   * **Using measuring instruments:** Physical data can be measured directly
    using measuring instruments. For example, a thermometer or a hygrometer can be
    used to measure temperature and a seismometer can be used to measure the vibrations
    of an earthquake.


    +   * **Observation:** Physical data can be obtained by observing phenomena. For
    example, a weather forecast site or app can be used to observe the weather. To
    acquire weather data, you can observe temperature, humidity, wind speed, etc.,
    at meteorological observatories.


    +   * **Using simulations:** Physical data can be obtained by running simulations
    on a computer. For example, you can understand fluid and heat conduction phenomena
    by simulating fluid behavior and heat conduction phenomena.'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'Today, discovering a spatiotemporal model that explains physical data defined
    by spatiotemporal discrete points (hereafter simply referred to as “physical data”)
    is an interesting topic for researchers and practitioners. A key topic in the
    discovery of a spatiotemporal model is the discrete-to-continuous transformation
    to effectively evaluate partial differential terms. More specifically, it is about
    finding a partial differentiable function that adequately approximates physical
    data defined discretely in the time space. A partially differentiable function
    is characterized by a partial derivative at a given point. Partial differentiation
    refers to calculating a derivative with respect to a particular variable in a
    multivariable function at that point. The partial differentiable function, which
    has a partial derivative at a given point, is used to analyze a multivariable
    function. Successfully finding such partial differentiable function enables effective
    visualization and also enables a partial differential equation (PDE) that explains
    a phenomenon to be derived using the results of analysis.


    This document uses Excel to understand the basics of how to analyze physical data.
    Excel is widely used as a piece of spreadsheet software to organize data is suited
    for data analysis. Using Excel has the following benefits:


    +   - *Easy to use:* Excel is commonly pre-installed on most computers and does
    not require additional installation. Moreover, Excel can be used without the need
    for specialized skills.

    - *Has a variety of functions:* Excel has a variety of functions that allow you
    to aggregate data efficiently.

    - *Can create graphs or charts:* Excel can be used to visually display data in
    the form of a graph or chart, which facilitates understanding of data.

    - *Data can be easily imported:* Excel allows you to import data from, for example,
    a CSV or text file.

    - *Can work jointly:* Excel allows multiple people to work jointly, making it
    useful for data analysis projects.


    Excel, which provides an array of benefits, is also widely used in data analysis.
    Next, the basics of Excel will be explained.


    # 1.1. Basic operations of Excel


    Excel is a piece of spreadsheet software developed by Microsoft. The spreadsheet
    software is a tool that allows you to enter and edit data in a tabular format
    for aggregation, analysis, and other purposes. Excel is'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'widely used by individuals and in businesses, and can handle large amounts
    of data, making it suitable for aggregation and analysis. Excel can be used to
    not only create a table but to also create a graph or chart. Additionally, Excel
    has a variety of functions to organize data, allowing you to analyze data and
    calculate formulas. Excel is commonly pre-installed on Windows and Mac OS and
    sold as part of Microsoft Office. It is also available as a cloud service, so
    you can use it from any Internet-connected environment. The data to be analyzed
    are often provided in Excel format. There are quite a few tools capable of reading
    and analyzing Excel data, but Excel itself also contains functions to perform
    analyses. Excel provides tools for determining correlation between data, testing
    for differences in the mean and variance of data, and regression analysis. It
    also serves as an optimization tool. These tools can be used to implement deep
    learning. Excel can be regarded as a tool for preliminary analysis prior to utilizing
    dedicated analysis tools, and it is advisable to become familiar with its functionalities.
    This section describes the basic terminology in Excel and explains how to perform
    what-if analysis using sample data.


    # 1.1.1. Table components


    The main components of an Excel table are as follows (Figure 1.1):


    +   - **Worksheet**: One of the basic building blocks of an Excel document. One
    document has multiple worksheets. One worksheet is usually contained in an Excel
    file, but multiple worksheets may be included.

    - **Cell**: A basic element for entering data in Excel at which a row and a column
    intersect. You can enter text, numbers, and other values in a cell.

    - **Row**: A basic element that divides an Excel worksheet horizontally. A row
    usually contains a single cell. In Excel, you can refer to a row by specifying
    a row number.

    - **Column**: A basic element that divides an Excel worksheet vertically. A column
    usually contains a single cell. In Excel, you can refer to a column by specifying
    the column number.

    - **Row number**: A number that identifies a row in Excel and appears on the left.
    Row numbers typically start from “1”.

    - **Column number**: A number that identifies a column in Excel and appears at
    the top. Column numbers usually start from “A”.


    Each component of a table in Excel plays an important role in creating and manipulating
    a table. When creating a table or entering data, it is'
