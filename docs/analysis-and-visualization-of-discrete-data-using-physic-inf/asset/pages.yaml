    Unfortunately, methods based on the second approach (global approximation) have
    not evaluated errors in the NN model which includes errors in the loss function
    and partial derivative terms, because it has not focused on exact solutions. This
    evaluation is important to find the optimal structure of the NN.


    The PDE derivation described in this book is an inductive method that derives
    a PDE based solely on data collected at multiple space-time locations. In this
    method, two parameter optimization computations are performed. One is to build
    NN models from physical data, and the parameters to be optimized are the NN weights.
    That is, it searches for parameters that minimize the loss function. The other
    is to perform a regularized regression analysis using the partial differential
    terms computed for the NN model; the parameters to be optimized are the coefficients
    to the partial differential terms. That is, it searches for parameters (coefficient
    to the partial differential term) that minimize the regularized regression equation
    error.


    # 4.1.2. PDE derivation using regularized regression analysis


    NN model construction involves optimizing NN parameters through a computation
    process aimed at minimizing the loss function, which quantifies the disparity
    between the "measure" and the "approximation". The input is the space-time coordinates
    $(x, y, z, t)$ and the output is the physical data $u$ linked with that point,
    such as electric potential, temperature, and pressure (Figure 4.1). In this case,
    the loss function consists only of the mean squared error $E_u = \|\hat{u} - u\|_2^2/N_p$
    between the physical data and the data regressed by the NN model (hereinafter
    "the NN model error"). The circle labeled "\sigma" represents a neuron in each
    layer of the NN and its activation function is $\sigma$. Also, $N_p$ represents
    the score. As for the NN, an FCNN where all neurons in each adjacent layer are
    connected is assumed. The NN model parameters add one additional count for the
    number of layers (L), the number of neurons per layer ($N_i, i = 1, \ldots, L$),
    the weights between neurons ($\boldsymbol{\omega}: w_{i,j}^{k}$, $i = 1, \ldots,
    N_k + 1, j = 1, \ldots, N_{k+1}, k = 1, \ldots, L$), and $i$. This is because
    the bias value for each neuron is considered a weight. In NN model building, the
    loss function is minimized by varying these multidimensional parameters.'
