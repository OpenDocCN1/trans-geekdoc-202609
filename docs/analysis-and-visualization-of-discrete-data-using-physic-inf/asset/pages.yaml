    # **2.5.1. *Optimization***


    Optimization means finding the best solution to solve a problem with a certain
    objective. Methods for solving such problems are called “optimization algorithms”.
    Optimization problems are commonly used in a variety of fields, including computer
    science, engineering, and economics.


    For example, a well-known optimization problem is finding the minimum value. In
    this problem, the objective is to find an input that minimizes the value of a
    function. The same is true for the problem of finding the maximum value. In this
    problem, the objective is to find the input that maximizes the value of a function.


    In some optimization problems, conditions may also need to be satisfied. An example
    is when a program needs to be minimized but at the same time must meet the minimum
    specifications required to process a particular set of data. Such a problem is
    called a “constrained optimization problem”.'
