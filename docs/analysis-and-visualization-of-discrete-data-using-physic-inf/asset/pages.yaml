- pgno: 29
  md: 'MNIST data reading: **keras.datasets.mnist.load_data()** is a Keras function
    that downloads and reads the MNIST dataset. MNIST is an image dataset of handwritten
    digits, consisting of 60,000 training images and 10,000 test images.


    **(x_train, y_train)**, **(x_test, y_test)** are the types of variables to receive
    four NumPy arrays returned by a function. **x_train** and **y_train** are NumPy
    arrays representing training images and their corresponding labels (numbers).
    Similarly, **x_test** and **y_test** represent test images and their corresponding
    labels.


    More specifically, **x_train** is a NumPy array containing 60,000 elements, each
    representing a grayscale image of $28 \times 28$ pixels and being an integer value
    between 0 and 255. **y_train** is a NumPy array containing 60,000 elements, each
    being an integer between 0 and 9 and representing a number written in the corresponding
    image. Therefore, **x_test** and **y_test** are similar, in that each NumPy array
    contains 10,000 pieces of test data.


    These arrays are used to define and train a model in Keras.


    In model building, Keras is used to define an NN model and each instruction in
    the above coding has the following meaning:


    +   - **keras.Sequential ():** A class for creating a Sequential model. This is
    a simple model that can be stacked linearly.


    +   - **keras.layers.Flatten(input_shape=(28, 28))**: Defines a flatten layer
    that converts a two-dimensional array of $28 \times 28$ pixels into a one-dimensional
    flat array as an input layer. This means you can arrange the images in a row and
    treat them as input.


    +   - **keras.layers.Dense(128, activation=''relu'')**: Defines dense layers,
    each having 128 neurons. These are fully bonded layers in which all units in the
    previous layer are connected to all units in the next layer. The ReLU activation
    function is applied to these layers to introduce nonlinearity, allowing the model
    to learn more complex functions.


    +   - **keras.layers.Dense(10, activation=''softmax'')**: Defines a dense layer
    having 10 neurons. This is a final output layer which outputs a probability distribution
    for 10 classes. These probabilities are calculated by the softmax function.


    Stacking these layers on the Sequential model defines the NN from the input layer
    to the hidden layer to the output layer. The model receives a handwritten digit
    image of $28 \times 28$ pixels as input and is trained to classify it into one
    of 10 classes.'
