    # 狗狗币


    *   当前价格 - $0.11

    *   市值 - 150 亿美元


    狗狗币最初是在比特币价格飙升后作为一个玩笑发布的。其名称源自互联网上一张展示柴犬的表情包。狗狗币没有硬性上限，因此发行量没有限制。DOGE 用于汇款和支付。


    ![](img/image_rsrc1PC.jpg)


    以上是目前一些最流行、最有价值的加密货币，但鉴于市场的波动性，这些情况可能会发生变化，且经常确实会变。下一章将讨论加密货币是如何挖掘的。


    # 第 8 章：加密货币挖矿详解


    ![](img/image_rsrc1NY.jpg)


    你可以随意问尽可能多的人，看他们如何看待加密货币挖矿。有些人会用仿佛你长了颗脑袋的眼神看着你，而许多其他人会说这只是获取更多加密货币的一种方式。从某种程度上说，确实如此，但它涉及的内容远不止于此。挖矿还关乎验证区块链上的交易，并将它们以区块的形式添加到账本中。不过，它或许最重要的工作是防止双重支付。


    想想你花费的实体法定货币。当你进行购买时，你的银行会更新你的账户，显示款项从你的账户支出并进入另一个账户。加密货币的运作方式相同。当进行加密货币购买时，数字账本会更新，显示从一个账户借记、向另一个账户贷记。然而，数字平台不断遭到黑客攻击或篡改。比特币账本通过创建一种系统克服了这一挑战，在该系统中，交易只能由经过验证的矿工在账本上更新。这确保了这些矿工负责保证双重支付不会发生。


    在矿工维护网络安全的同时，新的加密货币也在被生成。这些币作为奖励发放给矿工，以酬谢他们的工作。因为分布式账本上没有中央权威机构，挖矿对于确保交易得到验证至关重要，因此矿工有参与的动力——如果他们验证了交易，就能获得奖励。共识协议确保只有经过验证的矿工才能进行工作。这被称为**工作量证明**协议，它还能保护网络免受外部攻击。


    ## 工作量证明


    你可以将加密货币挖矿比作开采珍贵宝石或金属。虽然那些矿工会发掘钻石、黄金、白银等，但加密货币矿工则发掘新币并使其进入流通。矿工需要使用强大的机器来解决复杂的数学问题——加密哈希，以赚取提供的奖励。**哈希**
    是代表交易中数据的缩短数字签名，生成它是为了保障公共网络上数据的安全。矿工们相互竞争，以解决每笔交易生成的**哈希值**——最先解出者将交易区块添加到区块链并获得奖励。每个交易区块的**哈希函数**都包含对前一个区块的引用。这一直延续回第一个区块，即**创世区块**，从而形成一条完整的链。这就是为什么网络中的每个节点都能验证和确认区块，并能核实获胜的矿工是否正确解出了哈希值。随着更多矿工加入网络并使用更强大的计算资源，方程变得更难求解。这加剧了竞争，并增加了加密货币的稀缺性。


    ## 如何开始挖矿


    要在任何加密货币区块链上开始挖矿，你需要一台配备正确软件的强大计算机，该软件旨在解决加密方程。在区块链技术的早期，你可以用一台包含简单 CPU 芯片的家用电脑挖掘简单的加密货币。然而，随着这些年难度等级的上升，那些
    CPU 芯片已无法胜任。如今，你需要以下两样东西之一：


    *   一台 **ASIC**（专用集成电路）矿机

    *   一块专用 **GPU**


    GPU 还必须连接到快速、可靠的互联网连接，全天候在线。每个加密货币矿工还必须加入一个在线矿池。


    ## 不同的挖矿方法


    你选择的挖矿方法将决定所需的时间长度。在早期，**CPU 挖矿**是首选方法。然而，它极其缓慢，且因积累微薄利润所需时间过长而不再实用——可能需要数月，而且挖矿设备消耗大量电力和散热成本。成本往往远超利润。


    **GPU 挖矿**现在是一种更常见的方法，在单个挖矿设备中使用一组 GPU 以最大化算力。该设备还需要主板和有效的散热系统。


    **ASIC 挖矿**也越来越流行。ASIC 挖矿设备**仅**设计用于挖掘加密货币，这与 GPU 设备不同，后者还可作为普通（尽管强大）的计算机使用。因此，ASIC
    矿机能产出更多加密货币单位，但价格更昂贵——挖矿难度越大，这些设备被淘汰的可能性就越大。


    **云挖矿**正逐渐占据主导地位，消除了 ASIC 和 GPU 挖矿不断上升的成本。进行云挖矿的人可以利用专用挖矿设施和大型企业的算力。作为个人矿工，你可以找到付费和免费的挖矿托管商，并租用设备一段设定的时间，使其成为一种“甩手掌柜”式的挖矿方式。


    ## 矿池


    虽然你完全可以独自挖矿，但许多人选择加入**矿池**。所有矿工的资源被整合在一起，提供更多算力以增加解出方程并获得奖励的机会。如果矿池成功，奖励将按每位成员贡献的资源比例在所有成员中分配。


    大多数加密货币挖矿应用程序已经内置了矿池，但你也可以选择通过在线联合其他志同道合的爱好者来创建一个矿池。一旦加入矿池，你并不必须一直留在里面——你可以随意在不同矿池之间切换，许多人会因为某些矿池收益更高而转移。然而，许多矿工认为官方矿池更好——它们更可靠，提供技术支持，并由托管公司定期更新。如果你认为加入矿池适合你，可以看看
    **CryptoCompare**，根据盈利能力、可靠性和不同加密货币来比较可用的不同矿池。


    ## 加密货币挖矿值得吗？


    挖矿是否适合你取决于个人选择，有几个因素会影响你的决定。无论你选择哪种类型的挖矿——CPU、ASIC、GPU 或云挖矿——或许最重要的考虑因素是：


    *   挖矿设备产生的**哈希率**

    *   功耗

    *   总成本


    通常，一套好的加密货币挖矿设备价格在 3000 美元到 10000 美元以上不等。它们还会散发大量热量并消耗高额电力。例如，一台典型的 ASIC 矿机每 10
    分钟创建一个比特币，将消耗大约 72 太瓦的电力——1 太瓦足以同时为 100 亿个 100 瓦的灯泡供电，这只是让你了解那有多大功率！随着区块链技术的进步和挖矿难度的增加，功耗数字也会发生变化。你还需要考虑保持设备冷却的成本，尤其是在使用
    ASIC 或 GPU 设备时。最后，你必须考虑你想挖掘的加密货币所面临的难度等级，以决定其中是否有足够的利润空间。


    ## 税务影响


    税收也是你需要考虑的因素。我将在后面的章节中更详细地介绍这一点，但目前你需要知道，加密货币矿工通常在两种情况下需要纳税：


    1.  当他们收到挖矿的加密货币奖励时，以及

    2.  当他们兑换或出售奖励代币或硬币时


    '
