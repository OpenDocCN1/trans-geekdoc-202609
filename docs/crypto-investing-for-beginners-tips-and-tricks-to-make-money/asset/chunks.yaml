    \ You should also have good technical analysis knowledge to ensure you understand\
    \ what the market is doing. \n\nChapter 11 Limiting Losses  \n\nWhile Making Gains\
    \ ![](image_rsrc1NY.jpg)We often hear about cryptocurrency in the news, and many\
    \ will call it a ruthless market. However, much of this reputation has likely\
    \ come from investors who took the leap in 2017, when crypto hype was at its highest.\
    \ Driven by FOMO (fear of missing out) and no small amount of greed, investors\
    \ threw themselves into the market willy-nilly. Most had no understanding of the\
    \ cryptocurrency market's fundamentals and set about buying everything they could.\
    \ Unsurprisingly, a bubble appeared around cryptocurrencies, and Bitcoin reached\
    \ a historical high of $20,000 by the time 2017 ended. However, that wasn't to\
    \ last very long, and the bubble burst in 2018, leading to a lengthy bear market,\
    \ and all those last-minute investors, fueled by greed, paid for it in spades.\
    \ Things have changed somewhat, and the crypto market is looking pretty bright\
    \ at the moment. However, while it's easy to say dive in and invest your money,\
    \ you need to make sure you aren't going to end up with egg on your face, like\
    \ those earlier investors. To help you, I will give you some tips on maximizing\
    \ your gains and minimizing your losses. Maximize Your Gains \n\n1.  Only Invest\
    \ What You Can Afford to Lose \n\nThis is the number one rule in any type of investing,\
    \ be it cryptos, stocks, or any other financial market. Why? There are two reasons\
    \ for this, especially when investing in cryptos: \n\n*   The cryptocurrency market\
    \ is one of the most volatile in the world. \n\n*   The cryptocurrency market\
    \ works 24/7, meaning trading never stops. \n\nOne of the first traps many new\
    \ investors fall into is monitoring prices constantly. All that does is tire you\
    \ out, mentally and physically, causing stress and a much higher chance of making\
    \ the wrong move. Worn-out investors are also more sensitive to that FOMO feeling.\
    \ To not be exposed to that feeling and make poor trading decisions, you should\
    \ only ever invest as much you can comfortably afford to lose without risking\
    \ your life and finances. The best way to do that is to create a budget every\
    \ month. List down all your income and outgoings and how much you have spare each\
    \ month. Then, decide on a figure to invest in the crypto market and stick to\
    \ it rigidly. \n\n2.  Keep Bitcoin as Your Priority Investment \n\nBitcoin is\
    \ constantly in the news, mostly because someone is criticizing it, usually someone\
    \ from the finance world, regulators, or economists. However, some of those attacks\
    \ also come from the crypto world. That's because every other cryptocurrency competes\
    \ with Bitcoin, regardless of how much they say they aren't. Ethereum, Bitcoin\
    \ Cash, Ripple, EOS, or any of the many others are all after one thing - toppling\
    \ Bitcoin from its place at the top. Never forget this and never forget that Bitcoin\
    \ still dominates the market, with a 65% market share. Bitcoin is always the first\
    \ crypto that people think of and is the most decentralized of all cryptocurrencies.\
    \ This all adds up to Bitcoin being the best investment since it has huge potential\
    \ for capital appreciation over the long term and offers deep security for any\
    \ money you invest in it. As such, it should be your investment priority. If you\
    \ can't afford to buy entire Bitcoins, some exchanges will allow you to purchase\
    \ and trade in bits of Bitcoins. \n\n3.  Make Sure Your Crypto Portfolio Is Diversified\
    \ \n\nWhile you should make Bitcoin your priority, you should also diversify your\
    \ portfolio by investing in other cryptocurrencies, especially promising ones.\
    \ Try for a distribution ratio of 70% Bitcoin and 30% Altcoins. From there, you\
    \ can do one of two things - increase your Bitcoin share as you see fit, or reduce\
    \ it and invest in other promising Altcoins. This choice can only be made by assessing\
    \ your current risk aversion and working out what you can afford to invest. If\
    \ you think you can comfortably take more risks, reduce Bitcoin to 60% and up\
    \ your Altcoin investments to 40% of your portfolio, so long as you only choose\
    \ those with a good chance of increasing in the future. You must remember one\
    \ important thing - rebalance your Altcoins regularly and, on occasion, your Bitcoin\
    \ percentage. In this way, you can adapt to economic news and events that impact\
    \ the market and make better profits. \n\n4.  Listen to Warren Buffet on Fear\
    \ and Greed \n\nI don't expect you thought you would see Warren Buffet's name\
    \ in a chapter about maximizing crypto profit. It's no secret that the financial\
    \ world's biggest investors don’t think much of cryptocurrencies. After all, he\
    \ once said that \"Bitcoin is rat poison squared.\" How reassuring is it that\
    \ a man with an $85 billion+ fortune can sometimes be wrong about money! However,\
    \ that same man also said something incredibly smart, something all investors\
    \ should take note of - \"Be fearful when others are greedy and greedy when others\
    \ are fearful.\" Buffet addressed this warning to people investing in traditional\
    \ markets, but it applies to the cryptocurrency market just as well. No matter\
    \ what market you invest in, human psychology is the same. This means that when\
    \ most other investors are in FOMO mode and pushing you to get in there and buy\
    \ some, be very careful. You risk huge disappointment and some not-so-small losses\
    \ if you fall for it. Conversely, when many investors are panicking, perhaps because\
    \ of a news event, and are selling their holdings, be prepared to step out of\
    \ your comfort zone and put greed to work. This is the time when you can make\
    \ some excellent investments that are highly likely to pay off handsomely in the\
    \ future. If in doubt, think back to 2018, when investors chose to purchase Bitcoin\
    \ at the height of the bubble burst when investors were selling to minimize their\
    \ losses. Those who held their investments, known as HODLERS, are now raking in\
    \ huge profits. When the market reached its bottom in December 2018, panicking\
    \ investors were selling for a little over $3,000 per Bitcoin. Those same Bitcoin\
    \ are now worth more than ten times that amount. \n\n5.  Research - And Plenty\
    \ of It "
