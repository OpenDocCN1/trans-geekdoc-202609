    使用钱包本身无费用；唯一的费用与区块链交易相关，这些费用支付给矿工，而非 Trust Wallet。您可以通过 Trust Wallet 直接购买加密货币，尽管平台上仅支持
    **Simplex** 和 **MoonPay** 两个交易所。或者，您可以从任何地方购买加密货币并发送到您的 Trust Wallet。


    ---


    ### Huobi Pro

    **官网**：[`www.huobi.com`](https://www.huobi.com)


    另一款免费钱包，**Huobi Pro** 是一款多链钱包，也被称为轻钱包。这意味着验证交易时不会下载整个区块链，而是使用区块头。


    在功能方面，Huobi Pro 非常全面——对某些用户而言，界面可能显得过于繁杂。它支持超过一千种加密货币，并提供在 **Huobi Global** 交易所或
    P2P 市场直接从其他交易者处购买的选项。它还支持大多数法币，是全球增长最快的公司之一。


    Huobi Pro 提供丰富的安全功能。虽然用户完全控制自己的私钥，但 Huobi 提供担保，并曾在因错误导致损失时向客户退还资金。


    ---


    ### Coinbase Wallet

    **官网**：[`wallet.coinbase.com`](https://wallet.coinbase.com/)


    成立于 2012 年，**Coinbase** 主要是一款移动应用。虽然他们声称支持桌面端，但这仅限于 Chrome 浏览器扩展。Coinbase 在美国受监管并持有牌照，除夏威夷外可在全美各州使用。它与
    **Coinbase 交易所** 绑定，如果您选择 Coinbase 作为交易所，使用起来非常简单。


    最初仅支持比特币，现在 Coinbase 支持包括 **Bitcoin Cash (BCH)**、**Litecoin (LTC)**、**Ethereum
    (ETH)** 在内的多种加密货币，未来预计会增加更多。该应用界面简洁，非常适合新手，但其费用高于许多竞争对手。


    ---


    ### Luno Wallet

    **官网**：[`www.luno.com/wallet/`](https://www.luno.com/wallet/)


    **Luno** 是一家拥有全球实体办公室的成熟公司。它非常适合新用户，只需下载应用并设置账户即可。随后您可以快速购买和交易加密货币。在 Luno 设有实体办公室的地区，您只需前往银行向本地账户存入资金。


    由于 Luno 与某些法币紧密关联，它是使用网上银行管理传统账户人群的绝佳选择。Luno 同时支持网页端和移动端，网页界面与移动应用界面一致。目前加密货币支持范围尚窄，仅支持五种：**Bitcoin**、**Litecoin**、**Ethereum**、**Bitcoin
    Cash** 和 **Ripple (XRP)**。


    ---


    ### Exodus

    **官网**：[`www.exodus.com`](https://www.exodus.com)


    **Daniel Castagnoli** 和 **JP Richardson** 于 2015 年创立了 **Exodus**。它不仅是一个安全钱包，还试图将自己定位为“非极客的加密货币钱包”，意味着任何人都能轻松使用。它声称设计直观，旨在简化这一原本复杂的主题。


    Exodus 被归类为混合钱包，拥有移动端和桌面端两种形式。它最初作为一个基础钱包，允许您通过应用扩展所需功能，例如加入奖励系统、使用实时图表等。最大的缺点是应用系统相对较新，不如我们列出的许多其他钱包全面。


    ---


    ### Trezor

    **官网**：[`trezor.io/`](https://trezor.io/)


    **Trezor** 是由 **SatoshiLabs** 生产的硬件钱包。硬件钱包归类为冷存储，因为它们仅在连接互联网时才上线。有人认为硬件钱包是为“偏执狂”准备的，但实际上，它们是保护加密货币访问安全的更可靠方式。


    Trezor 有两款硬件钱包：**Trezor One**（略低于 $80）和 **Model T**（$250 起）。两者均支持多种加密货币，包括 **Zcash**、**Litecoin**、**Bitcoin**、**Monero**
    和 **Dash**。设置钱包仅需两样东西：**PIN 码**和**恢复种子**。


    ---


    ### Ledger

    **官网**：[`www.ledger.com/`](https://www.ledger.com/)


    **Ledger** 是一家多元化公司，总部遍布全球，是生产硬件钱包的较成功公司之一。同样有两款型号可选：**Nano X**（$179 起）和 **Nano
    S**（$70 起）。


    它们是极其小巧的设备，却都包含支持各自应用所需的必要硬件。Ledger 设备支持超过 **1800 种加密货币**，并能与许多其他钱包良好配合。


    许多人不满的一个功能是增加了 **蓝牙**，因为它不是最安全的通信方式。不过，可以将其禁用。


    ---


    下一章将深入探讨一些更流行的加密货币。


    '
