    # Chapter 5 Exchanges and Brokers


    Now you understand more about cryptocurrency, its advantages and disadvantages,
    and how it and the blockchain work, you''re ready to start your investing journey.
    Most crypto trading and investing occurs online since they are digital assets,
    although there are limited methods to purchase cryptos using cash.


    You should be aware that two primary trading methods are using an exchange or
    a broker. But you should also be aware that there are differences between them.


    ## Exchanges vs. Brokers


    The first thing to note is that an exchange is very similar to a stock exchange
    in its processes. Cryptocurrency exchanges are where buyers and sellers come together
    to trade fiat money and cryptocurrencies. The exchange is an intermediary that
    charges a fee to facilitate the trade. Two common examples of how cryptocurrency
    exchanges are used are using fiat money to buy cryptocurrency and trading different
    cryptos — for example, buying Ether (Ethereum) with BTC (Bitcoin). Every exchange
    has its own trading pairs, so which one you use is entirely down to you and your
    needs.


    Let''s give you an example of how this works. Let''s say you are an investor and
    you put USD onto an exchange. That means you can only use trading pairs related
    to USD, i.e., USD/ETH, USD/BTC, etc. before you can begin trading in any other
    altcoin. Crypto exchanges are the commonest method of trading cryptocurrencies,
    especially where only small amounts of money are used.


    A broker mediates between the market and traders. In simple terms, if you use
    a broker for your crypt trading, you place money into their account. This gives
    you access to their offered products. You are not limited to trading in the fiat
    currency or cryptocurrency you deposited and can use any other trading pair. The
    broker finds the counterparty — the other party in the transaction — and, in some
    cases, may even serve as the counterparty, executing the trade.


    Here''s an example to help you understand. You deposit BTC with a broker but choose
    the Ethereum/XRP pair for leverage trading. You can trade that pair based on how
    many BTC you deposited. If you want to trade in Ethereum/XRP on an exchange, your
    BTC must be exchanged for Ether first.


    So, what are the primary differences? Brokers are better for those trading in
    large amounts of money because they have better liquidity and security. Once your
    money is deposited, you can choose from several opportunities, such as leverage
    positions, depending on what your chosen broker offers. On the other hand, exchanges
    make cryptocurrency trading much easier, using the trading pair''s order book
    dictated by the fiat currency or cryptocurrency deposited. You should remember
    that when you use an exchange, the traded asset is physically delivered, while
    with a broker, you are only trading an underlying asset.


    Another major difference between brokers and exchanges is the target audience.
    Crypto exchanges tend to be more used by crypto HODLers looking for mid or long-term
    investments, purchasing a particular cryptocurrency, and then waiting for the
    price to go up. Brokers tend to be used by speculative investors, who make different
    trades and use the different tools their broker offers. They are usually looking
    at short or mid-term profits and use the broker as a mediator to gain them.


    ## Registration and Verification


    Each exchange will have its registration process. Some only require a customer
    to provide an email address, which they then validate and confirm and ask you
    to set a password. Others, more so those where fiat currency is handled, require
    ID verification. This could be a scanned ID document, a video call, a photo of
    you holding your ID, or it may be a complete KYC process, although this is only
    when you want access to the upper deposit and withdrawal limits. KYC is a Know
    Your Customer process used by financial institutions to identify and verify you
    when you open an account. Binance is the largest exchange, and you can trade without
    full KYC; however, you can only withdraw 2 BTC per day. Verification can take
    hours up to days, so be prepared for this and don''t expect to open an account
    and start trading all in the same day — it may not happen.


    Brokers also have a fairly easy verification process, but it is critical because
    official regulations cover brokers. Mostly, you will need to provide a photo ID
    and proof of where you live, usually a utility bill or rent book. Verification
    also doesn''t take so long with a broker, and you can sign up, deposit, and trade
    all on the same day.


    ## Deposits and Withdrawals


    Crypto exchanges offer two ways to deposit and withdraw. First is fiat money,
    and that isn''t easy — not all exchanges will accept fiat currency, so you need
    cryptocurrency to deposit into your account. Also, fiat currencies tend to attract
    higher fees. Be aware that adding fiat currency to your crypto exchange account
    from a bank account will attract fees, as will using a debit or credit card. In
    terms of withdrawals, fees are higher than those charged for deposits. You must
    also check that your bank will accept crypto exchange transfers — not all do.


    The fees tend to be significantly lower if you deposit and withdraw crypto, especially
    for deposits, because many exchanges will not charge a fee for cryptocurrency
    deposits. Brokers have more options in place for deposits — they will accept debit
    and credit cards, bank accounts, e-wallets, and, of course, crypto, and they don''t
    tend to charge deposit fees. Their withdrawal fees tend to be lower, typically
    between 0% and 3%, whereas some exchanges charge 6%.


    ## Trading


    Exchanges are easy platforms for trading crypto, and most use order books, allowing
    you to do a limit order, market order, or both. Each exchange''s liquidity is
    different, based on DOM (depth of market). Those with high liquidity usually have
    a smaller spread between the purchase and sell orders. Most exchanges only offer
    basic functions, which is usually enough for a newbie or average user. More specialized
    exchanges provide access to high-leverage instruments, like perpetual swaps or
    futures. However, the biggest advantage is that exchanges offer a wide range of
    cryptos for trading purposes.


    Brokers offer additional trading instruments, such as CFD (contract for difference)
    and derivatives. They also provide trading tools to help customers with their
    trades, such as indicators and moving averages. Some even provide automated robots
    and strategies to help traders optimize their risk management and improve their
    trading. In terms of CFD trading, exposure is multiplied by using leverage. For
    example, if a trader''s chosen crypto''s CFD leverage ratio is 1:2, and the price
    shifts 5%, the CFD trader profits or loses 10%, depending on the direction of
    the shift and the position type chosen by the trader. Simply put, CFD traders
    can make significant profits quickly but can also lose money very quickly too.
    Leverage trades are best left to those more experienced.


    ## Security


    Spreads tend to be tighter with brokers than with exchanges and is one of the
    reasons why margin traders use them. You have undoubtedly heard of hacks on crypto
    exchanges, such as the Mt. Gox hack in 2014, which saw thousands of Bitcoins stolen.
    Even the biggest exchanges are targets — Binance was targeted with a KYC hack
    in 2019 when thousands of customers'' verification details were leaked. Crypto
    exchanges will also be a vulnerable point for hacks and scams, and brokers can
    also be targeted. However, brokers are regulated and have some financial protection
    in place for customers, where compensation can be paid should the worst happen.
    Brokers also tend to be thoroughly audited, so keep this in mind when choosing
    where to put your money, and look for those regulated by the FCA or SEC. Brokers
    also hold your money in a traditional bank account, which is also covered by financial
    regulation. Make your choice based on your requirements but bear in mind that
    there is another option — you could store your funds in a hardware wallet, like
    Ledger or Trezor. The reasoning behind this is sound — when you have a wallet,
    you have a private key and can access your funds whenever you want. If you store
    your cryptos on the exchange, you don''t have that private key — the exchange
    does. There''s a cryptocurrency saying here that is highly relevant — "Not your
    keys, not your crypto."


    ## Income


    Brokers and exchanges are similar in many ways but also differ in terms of income
    source. Sure, both charge fees, but they differ in how they approach their clients.
    Exchanges offer a wide range of trading pairs which attract many traders. Those
    pairs offer the exchanges a widespread because the depth of market is quite small
    and liquid. Their fees for withdrawals and trades are usually higher, and sometimes
    deposit fees are higher too. Brokers have much lower trading and withdrawal fees,
    but traded amounts are significantly higher, so the fee amounts could be in the
    same region as those of an exchange.


    ## Comparison Table


    Below is a table showing the major differences between exchanges and brokers,
    and it should make it easier for you to see which is the better fit for your circumstances.

