    # Things to Consider Before Starting


    Up to this point, you''ve learned what cryptocurrency is and how it works. We''ve
    discussed different types of cryptos, looked at how the blockchain works, and
    even looked at some long and short-term strategies you can use. In the last chapter,
    we looked at taxes, so you should now know if you are ready to go ahead with investing
    in crypto. Before you take that final step, I''m giving you a list of things you
    should consider before you go all-in.


    ## Don''t Get Over-Excited


    Starting a new adventure is exciting, no matter what it is, and in some cases,
    getting a head start can put you ahead of everyone else. However, cryptocurrency
    investing is no different from any other type of investment. In fact, perhaps
    more so, it requires strict risk management, discipline, and more than a little
    patience. Crypto investing should never be seen as a scheme to get rich quick
    - sure, you''ve sat with your jaw dropped, watching Bitcoin rise to massive prices
    in the past, but whether that happens again is a different matter. The crypto
    bubble has burst, and the chances of those heady heights being reached again are
    low. Investors know more than they did back in 2017, and their investment decisions
    are taken with a clearer head and more calculation - so should yours be.


    ## Know Your Risk Tolerance


    Before you dive in, ask yourself these questions:


    *   Is cryptocurrency investing the right move for you?

    *   How much money should you invest?

    *   How much can you afford to lose?

    *   Can you stomach the highly volatile nature of the crypto market?

    *   Are you patient enough to wait out the dips?


    The first step in any investment is knowing your risk tolerance, and it revolves
    around your ability to handle risk and your willingness to take that risk. Risk
    tolerance is all about knowing what level of risk you are comfortable with. Given
    that the crypto market is volatile, not least because of the level of speculation
    involved, risk tolerance is one of the most important factors in determining your
    strategies. Let''s face it, as we''ve seen, crypto values can be halved overnight,
    you could lose your private key, hackers can steal deposits from exchanges, and
    so on. However, your tolerance should not be a set percentage of the total amount
    you invest in the market; instead, it must be a percentage of the total amount
    of money invested in your portfolio. In short, it is how much you can afford to
    lose without it affecting your day-to-day life and finances.


    ## Keep Your Crypto Wallet Protected


    When you begin investing in cryptocurrency, you should set up a crypto wallet
    to secure your purchases. There are many types available, and some exchanges even
    provide their own. However, these are not the most secure - there have been instances
    of hacking on these exchanges where significant amounts of crypto have been lost.
    We talked in an earlier chapter about the different types, so make sure you do
    your homework and choose a secure wallet to keep your crypto secure.


    ## Choose the Best Broker or Exchange


    Brokers and exchanges are popular places to purchase and trade crypto, but they
    vary wildly. Some offer only a few cryptos, while others offer a much wider range.
    Some charge low or no transaction fees; others are much higher. Some are more
    secure than others, some allow you to top up your account using fiat currency,
    and others will only allow you to use digital money. We discussed brokers and
    exchanges earlier, so, as with the wallets, do your homework and make sure you
    get one that fits your needs and circumstances. Sometimes, you may be better having
    more than one, or an exchange and a broker, again depending on your requirements.


    ## Decide Whether You Want Long or Short-Term Investing


    This will come down to several factors:


    *   Your risk tolerance

    *   Financial/investment goals

    *   Financial situation now

    *   How much time do you have?


    For example, if you work a full-time job, you won''t want to spend the rest of
    your time worrying about managing a portfolio of short-term investments. You won''t
    have time for a start, and if you spend all your downtime focusing on that, you
    won''t be fit for your main paying job. Long-term investing requires much less
    attention and is often less risky too. Most people opt for a balance between the
    two - a couple of short-term investments and several longer-term ones. And don''t
    forget that long-term investments are also subject to lower rates of tax.


    ## Don''t Dive in at the Deep End


    In other words, start small. If you are just dipping your toes in and haven''t
    yet drawn up a financial plan, there is little point in throwing a whole heap
    of money at the market - that''s a surefire way to lose everything. Set a limit
    - perhaps a couple of hundred dollars - and stick to it. Start with just one crypto,
    too, rather than spreading your money too thin. Also, if this is your first time,
    don''t use all your funds just for crypto; diversify and have a few stock, foreign
    exchange, or exchange-traded funds too. Eventually, you will get your portfolio
    just right and know exactly what you need to invest in and how much.


    ## Know Your Cause and Follow It


    Almost every cryptocurrency available today is based on a blockchain application
    that solves a particular world or social problem. Whether it is providing banking
    to those who can''t get it or are underbanked or helping prevent voter fraud,
    something will suit what you want. When you invest your money in specific crypto
    with an appealing cause, you are helping it achieve its goals. This ensures that
    crypto investing has some meaning to you, and it also helps you choose the cryptos
    you want to invest in from the many available.


    ## Consider Mining


    Many cryptocurrencies rely on mining to go into circulation. Take Bitcoin, for
    example; without mining, there wouldn''t be a Bitcoin currency or market. Mining
    requires network nodes to solve complex problems using electricity and powerful
    computers. If you successfully solve a problem, you earn a crypto reward. However,
    many people find it too expensive because of the investment required to set up
    a mining rig and the electricity required to run it. A lot will depend on the
    crypto''s value. If your setup costs and electricity bill are less than what you
    could make on the crypto, it may be a consideration. Alternatively, you could
    join a mining pool.


    ## Consider Other Assets before Cryptos

    '
  trans: '

    # 开始前需考虑的事项


    到此为止，你已经了解了什么是加密货币以及它是如何运作的。我们讨论了不同类型的加密货币，研究了区块链的工作原理，甚至探讨了一些你可以使用的长期和短期策略。在上一章中，我们探讨了税收问题，因此你现在应该知道自己是否已准备好继续进行加密货币投资。在你迈出最后一步之前，我为你列出了一份在你全力以赴前应考虑的事项清单。


    ## 不要过度兴奋


    开始一项新冒险总是令人兴奋的，无论它是什么，在某些情况下，抢占先机能让你领先于其他人。然而，加密货币投资与其他任何类型的投资并无二致。事实上，或许更甚，它要求严格的风险管理、纪律，以及不止一点点的耐心。加密货币投资绝不应被视为一夜暴富的捷径——当然，你曾目瞪口呆地看着比特币在过去飙升至惊人价格，但那是否会重演则是另一码事。加密货币泡沫已然破裂，再次达到那些令人眩晕高度的可能性很低。投资者比
    2017 年时更懂行，他们的投资决策更加冷静理智、经过深思熟虑——你的也应该如此。


    ## 了解你的风险承受能力


    在全身心投入之前，问自己以下几个问题：


    *   加密货币投资适合你吗？

    *   你应该投入多少资金？

    *   你能承受多少损失？

    *   你能承受加密货币市场高度波动的特性吗？

    *   你有足够的耐心熬过下跌行情吗？


    任何投资的第一步都是了解你的风险承受能力，它围绕着你应对风险的能力和承担风险的意愿。风险承受能力关乎了解你能接受何种程度的风险。鉴于加密货币市场波动剧烈，投机成分不小，风险承受能力是决定你策略的最重要因素之一。面对现实吧，正如我们所见，加密货币价值可能一夜之间腰斩，你可能丢失私钥，黑客可能从交易所窃取存款，等等。然而，你的承受度不应是你投入市场总金额的一个固定百分比；而必须是你投资组合中总投资金额的一个百分比。简而言之，就是你能承受多少损失而不影响你的日常生活和财务状况。


    ## 保护好你的加密货币钱包


    当你开始投资加密货币时，你应该设置一个加密货币钱包来保障你的购买资产安全。有多种类型可供选择，甚至一些交易所也提供自己的钱包。然而，这些并非最安全——曾发生过这些交易所被黑客攻击、导致大量加密货币损失的案例。我们在前面的章节讨论过不同类型，所以请务必做好功课，选择一个安全的钱包来保管你的加密货币。


    ## 选择最佳的经纪商或交易所


    经纪商和交易所是购买和交易加密货币的热门场所，但它们参差不齐。有些仅提供少数几种加密货币，而另一些则提供范围广泛得多的选择。有些收取低廉甚至零交易手续费；另一些则高得多。有些安全性更高，有些允许你使用法币为账户充值，而另一些则只允许使用数字货币。我们之前讨论过经纪商和交易所，所以，就像选择钱包一样，请做好功课，确保选择一个符合你需求和情况的平台。有时，拥有不止一个平台，或者同时拥有一个交易所和一个经纪商会更好，这同样取决于你的需求。


    ## 决定是想进行长期还是短期投资


    这将取决于以下几个因素：


    *   你的风险承受能力

    *   财务/投资目标

    *   当前财务状况

    *   你有多少时间？


    例如，如果你有一份全职工作，你不会想把剩下的时间都花在担心管理短期投资组合上。首先你没那个时间，其次如果你把所有休闲时间都花在上面，你就无法胜任你的主业。长期投资需要的关注度低得多，风险通常也较低。大多数人选择两者平衡——几笔短期投资和几笔长期投资。别忘了长期投资还享受较低的税率。


    ## 不要一头扎进深水区


    换句话说，从小额开始。如果你只是试探性地涉足，尚未制定财务计划，那么把一大笔钱扔进市场毫无意义——那是铁定赔光的捷径。设定一个限额——也许是几百美元——并坚持执行。开始时也只投资一种加密货币，而不是把资金分散得太薄。此外，如果这是你的第一次，不要把所有资金都用于加密货币；要分散投资，也配置一些股票、外汇或交易所交易基金（ETF）。最终，你会把投资组合调整得恰到好处，清楚地知道该投资什么以及投多少。


    ## 明确你的初衷并坚持下去


    如今几乎每一种可用的加密货币都基于一个解决特定世界或社会问题的区块链应用。无论是为那些无法获得或银行服务不足的人提供银行服务，还是帮助防止选举舞弊，总有一款符合你的意愿。当你将资金投入具有吸引力愿景的特定加密货币时，你就在助力其实现目标。这确保了加密货币投资对你有所意义，也帮助你从众多可选项中挑选出你想投资的加密货币。


    ## 考虑挖矿


    许多加密货币依赖挖矿投入流通。以比特币为例；没有挖矿，就不会有比特币货币或市场。挖矿要求网络节点利用电力和强大的计算机解决复杂问题。如果你成功解决一个问题，就能获得加密货币奖励。然而，许多人发现成本太高，因为建立挖矿设备所需的投资和运行所需的电费都很高。很大程度上取决于加密货币的价值。如果你的建造成本和电费账单低于你通过加密货币可能获得的收益，这可能值得考虑。或者，你可以加入一个矿池。


    ## 在加密货币之前考虑其他资产


