    # Chapter 4 How Do Cryptocurrencies Work?


    In the last chapter, we looked at the blockchain and how it works, so it makes
    sense to move on to how cryptocurrencies work. It makes even more sense to start
    with some of the basic terms you will likely encounter in your cryptocurrency
    investing journey.


    ## Basic Terms


    As you already know, cryptocurrencies are usually called digital coins, but they
    are nothing like the physical coins you carry with you every day. The major difference
    is that digital coins are not tied to an authority party, such as a country, government,
    or bank, and are not regulated. Let''s see this in an example. You want to purchase
    the latest best-selling novel, so you head to your local book shop. Here''s how
    it works when you pay with a debit card:


    1.  You pass your card to the store cashier or use the contactless facility most
    stores operate these days

    2.  Your bank details are checked, and the store is essentially asking if you
    have sufficient money to pay for your purchase

    3.  The bank says yes or no after checking its current records

    4.  If you have enough, the bank allows your transaction to go through and updates
    its own records to show the money has moved from your account to another

    5.  Because your bank is the middleman in the transaction, they take a cut from
    the transaction for their troubles


    Now, let''s say you didn''t want the bank involved. Who would keep your records
    for you? Who could you trust not to change them or cheat you out of any money?
    Most people can probably name one person they would trust to do this, but there
    is another alternative - trusting thousands, even millions of people on a network,
    to do it for you. As we saw in the last chapter, blockchain technology is based
    on decentralization, i.e., there is no middleman. When you use cryptocurrencies
    to make a transaction, the technology maintains its own central transactions record.
    Instead of the bank having a copy of your records and updating them, your transaction
    ledger goes to every person on the blockchain network. Every person who has a
    copy of your transaction ledger records your recent purchase as a transaction.
    Here''s how your book purchase works when you use cryptocurrency:


    1.  Instead of passing your debit card over, you give the cashier your cryptocurrency
    details

    2.  The store will then ask all network members to see if you have sufficient
    digital coins for the purchase

    3.  Every network member will look at their records (network members are known
    as nodes - more about that later)

    4.  If you have sufficient coins, every network node agrees to the purchase

    5.  All the nodes will then update their own records

    6.  One random node will be rewarded


    All this means no one organization or person is tracking your digital coins, but
    it also means they are not investigating potential fraud. Bitcoin and other cryptocurrencies
    could not exist if they did not have an entire network of nodes, essentially book-keepers,
    and a small but very important thing called cryptography.


    ## Cryptography


    Cryptography is where the crypto in cryptocurrency comes from, and, in this sense,
    it means "anonymous." The term "cryptography" is derived from the Greek "krypto
    logos," which literally translates to "secret writing." It has long been used
    to send encoded messages - a key is used to encrypt a message, and only the receiver
    knows the key to decrypt it. For example, in 1799, the Rosetta Stone was found
    in Egypt, near Rosetta, by Napoleon''s soldiers and 19th-century scholars decrypted
    the Egyptian hieroglyphics on it. Today, we can send digitally encrypted messages,
    and they are decrypted using algorithms and cryptographic services. Cryptography
    is built-in to cryptocurrencies to ensure anonymity and security. Although digital
    coins are decentralized and unregulated, cryptography is one way they stay secure
    and protect against double-spending. There are three primary encryption methods
    used:


    1.  **Hashing** - in the last chapter on blockchain technology, I told you that
    a hash is similar to a signature. Hash functions take the input data, perform
    an operation, and return an output representative of the input data but of a smaller,
    fixed size. A cryptocurrency hash function is used to solve a mathematical problem
    akin to guessing a padlock combination. Hashing encodes account addresses, maintains
    the blockchain data structure, and ensures that block mining is possible. We''ll
    talk more about mining in chapter 8.

    2.  **Symmetric Encryption Cryptography** - this is the simplest method of cryptographic
    encryption, with just a single secret key for both parties in a transaction. However,
    it does have a disadvantage - anyone involved in the transaction must exchange
    the key, so the sender uses it to encrypt the data, and the receiver uses the
    key to decrypt it.

    3.  **Asymmetric Encryption Cryptography** - this kind of encryption uses a public
    and private key. The receiver''s public key can be used to decrypt data, but the
    sender can only use their private key to encrypt it.


    ## Nodes


    Nodes are the network members, the devices that run the network and keep all the
    transaction records. This is what makes it possible for a blockchain to be decentralized.
    That device may be a desktop or laptop computer, a tablet, smartphone, even a
    printer - the only requirement is that it has a fast internet connection and can
    access the blockchain.


    ## Mining


    The node owners help run the network by contributing electricity and computing
    resources to store transactions and validate them. In the process, they have the
    chance to get a reward and earn the transaction fees. This is called mining, and
    the owners are the miners. However, it''s worth noting that only some cryptocurrencies
    can be mined. Bitcoin can and a few of the other bigger ones, but Ripple, and
    some others, don''t partake in mining because they don''t want their platforms
    dependent on vast amounts of electricity for mining the cryptocurrency. So, here''s
    how the process works:


    *   Miners need to use software to solve mathematical (cryptographic) puzzles
    to add transaction blocks onto the ledger; they compete against one another to
    win bits of the relevant cryptocurrency as a reward.

    *   The reason it is known as mining is that it extracts cryptocurrency.

    *   Anyone can do it, so long as they have a device that connects to the internet
    and the right software. Your device needs to solve the blockchain-generated puzzle
    by guessing a random number.

    *   To do this, your device must calculate multiple 256-bit hashes or 64-character
    strings and make sure they have the right answer - the equation will confirm this.
    This is why a powerful device is needed - the more power it has, the more guesses
    it can take per second, which gives you a much better chance of winning. You earn
    the cryptocurrency reward and add the block of transactions to the chain if you
    win.

    '
