    # 市场回调利于长期投资吗？


    当你“逢低买入”时，你是在加密货币价格下跌时购买，假设它未来会再次上涨。这要求你长期仔细观察市场，以便在加密货币突然跌至显著低价时——这是短期下跌——及时发现。对加密货币感兴趣的任何人都知道
    2018 年的崩盘，当时比特币从 19675 美元暴跌至 5933 美元。如果你在那个较低价格买入，就像许多人所做的那样，这被视为逢低买入。然而，金融市场的本质意味着它们到处波动，给我们带来波动低点和波动高点。寻找回调往往并不容易，因此最好的方法是寻找看跌压力，因为这些往往会带来数个低点。你也可以参考分析师报告，了解专家对价格走势的看法。那些长期从事该行业并拥有专业技术分析知识的人能更好地解读这些报告。最后，考虑使用费用低廉且价格可靠的交易所，作为逢低买入的最佳资源之一。你的成功取决于相关加密货币未来是否有可能再次上涨。同样，比特币是一个绝佳的例子。在大流行期间，其价格崩盘，而那些当时选择买入的人现在正坐享潜在的巨额利润。只有选对投资的加密货币，长期投资才能成功且有效。虽然这需要知识和技巧来了解你在做什么，但考虑到市场行为不可预测且加密货币波动剧烈，也包含一定成分的好运。也许最好的策略之一是长期投资与短期交易相结合，确保你全方位获益。你还应具备良好的技术分析知识，以确保你理解市场在做什么。


    # 第 11 章 在获利的同时限制损失


    我们经常在新闻中听到加密货币，许多人称其为无情的市场。然而，这种名声很大程度上可能源于 2017 年入场的投资者，那时加密货币炒作达到最高点。在 FOMO（错失恐惧症）和贪婪的驱使下，投资者盲目地扎堆进入市场。大多数人不了解加密货币市场的基本面，就开始买入能买的一切。毫不奇怪，加密货币周围出现了泡沫，到
    2017 年底比特币达到 20000 美元的历史高位。然而，这没持续太久，泡沫在 2018 年破裂，导致漫长的熊市，所有那些在最后一刻因贪婪入场的投资者为此付出了惨痛代价。情况已有所改变，加密货币市场目前看起来相当光明。然而，虽然轻易说“冲进去投资”很简单，但你需要确保自己不会像那些早期投资者那样落得个灰头土脸。为了帮助你，我将提供一些关于最大化收益和最小化损失的建议。


    ## 最大化你的收益


    ### 1. 只投资你承担得起损失的资金


    这是任何类型投资的第一铁律，无论是加密货币、股票还是任何其他金融市场。为什么？主要有两个原因，尤其是投资加密货币时：


    *   加密货币市场是世界上**波动性最大**的市场之一。

    *   加密货币市场**全天候 24/7 运行**，意味着交易从未停止。


    许多新投资者陷入的第一个陷阱就是持续监控价格。这只会让你身心俱疲，导致压力，并大大增加做出错误操作的几率。精疲力竭的投资者也更敏感于那种 FOMO 情绪。为避免暴露于这种情绪并做出糟糕的交易决定，你应该只投资你能舒适承受损失而不危及生活和财务的金额。最好的方法是每月制定预算。列出所有收入和支出，以及每月剩余多少。然后，决定一个投资加密货币市场的数字并严格坚持。


    ### 2. 将比特币作为你的优先投资


    比特币经常出现在新闻中，主要是因为有人在批评它，通常来自金融界、监管机构或经济学家。然而，一些攻击也来自币圈内部。这是因为无论其他加密货币如何声称不竞争，它们都在与比特币竞争。以太坊、比特币现金、瑞波币、EOS
    或其他众多币种，都追求同一个目标——将比特币从顶峰拉下来。永远不要忘记这一点，也永远不要忘记比特币仍凭借 **65% 的市场份额**主导市场。比特币永远是人们想到的第一个加密货币，也是所有加密货币中**去中心化程度最高**的。所有这些因素加起来，使比特币成为最佳投资，因为它具有巨大的长期资本增值潜力，并为你投入其中的资金提供深度安全保障。因此，它应该是你的投资优先项。如果你买不起整枚比特币，一些交易所允许你购买和交易比特币的碎片（聪）。


    ### 3. 确保你的加密货币投资组合多元化


    虽然你应该将比特币作为优先项，但也应通过投资其他加密货币（尤其是有前景的）来实现投资组合多元化。尝试 **70% 比特币和 30% 山寨币** 的分配比例。在此基础上，你可以做两件事之一——根据情况增加比特币份额，或减少比特币份额并投资其他有前景的山寨币。这个选择只能通过评估你当前的风险厌恶程度和计算你能承担多少投资来做出。如果你认为能舒适承担更多风险，可将比特币降至
    60%，将山寨币投资提高到投资组合的 40%，前提是你只选择未来有良好增值机会的币种。你必须记住一件重要事——**定期再平衡你的山寨币**，并在必要时**调整比特币比例**。这样，你可以适应影响市场的经济新闻和事件，获得更好的利润。


    ### 4. 听听沃伦·巴菲特关于恐惧与贪婪的教诲


    我料想你没指望在一章关于最大化加密货币利润的内容中看到沃伦·巴菲特的名字。金融界的大佬们不怎么看好加密货币并非秘密。毕竟，他曾说“比特币是老鼠药的平方”。一个拥有
    850 亿美元以上财富的人在金钱问题上有时也会犯错，这有多让人安心！然而，同一个男人也说过一句极其聪明的话，所有投资者都应铭记——“**别人贪婪时我恐惧，别人恐惧时我贪婪**。”巴菲特此言针对传统市场投资者，但同样适用于加密货币市场。无论你投资什么市场，人类心理都是一样的。这意味着当大多数其他投资者处于
    FOMO 模式并推着你冲进去买入时，要非常小心。如果你上当，将面临巨大失望和不小的损失。反之，当许多投资者因新闻事件恐慌并抛售持仓时，准备走出舒适区，让贪婪发挥作用。这是你可以做出极佳投资的时机，极有可能在未来获得丰厚回报。如果拿不准，回想
    2018 年，当泡沫破裂达到高潮、投资者为减少损失而抛售时，有人选择买入比特币。那些坚持持有（即 **HODLers**）的人现在正赚得盆满钵满。当市场在
    2018 年 12 月触底时，恐慌的投资者以略高于 3000 美元/枚的价格抛售比特币。那些比特币现在价值超过那个金额的十倍。


    ### 5. 研究——且要大量研究


