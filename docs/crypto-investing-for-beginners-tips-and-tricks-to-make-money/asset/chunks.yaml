    # Even if the markets are in freefall, you can always find opportunities


    Even if the markets are in freefall, you can always find opportunities - you just
    need to know where to look. Where some might see doom and gloom, keen-eyed investors
    will see a ray of light where they can get the right asset at the right price
    and wait for the profits to come rolling in.


    ## Strategies for Market Dips


    ### Buy the Dip

    One of the most popular ways to do this is to buy the dip. This gets you into
    the market or helps you raise your current position. Even in downtrends, the market
    still fluctuates, and prices still go up at times. Provided you have technical
    analysis skills, you can benefit from using your knowledge to predict those movements,
    buying the lows and selling the highs.


    ### Short Selling

    Another good strategy during market dips is to short sell, which means betting
    that the price will fall on a specific asset.


    ### DeFi Yield Farming and Staking

    DeFi yield farming and staking can also level your returns out, ensuring your
    crypto balance continues to grow when others around you are falling like dominos.


    ### Dollar-Cost Averaging (DCA)

    And again, the fallback is dollar-cost averaging, especially where you think an
    asset is definitely going to rise because this strategy works whether the markets
    rise or fall. In fact, with dollar-cost averaging, you stand to gain more when
    the market is down.


    ## Risk Warning

    Don''t forget that these activities are not for those of a nervous disposition
    and, done wrong, could lose you a lot of money. They could also lead to you spending
    more time than you need to watching price charts and getting further stressed
    out.


    ---


    # Chapter 12: The IDDA Strategy


    ![](image_rsrc1NY.jpg)


    **IDDA** stands for **Invest Diva Diamond Analysis**. Before you go ahead and
    execute your newly drawn-up strategy, you need to use some different methods to
    analyze the markets, and many traders choose just one or two. However, this is
    a dangerous way to go; IDDA suggests using five points to analyze the markets,
    and we''re going to discuss those now:


    ![](image_rsrc1PF.jpg)


    ## Point One - Fundamental Analysis

    This is when you use every news story, economic event, gossip, and the financial
    situation of the crypto you want to invest in and consider potential upcoming
    events that could affect the market. Fundamental analysts use all this data to
    determine whether to invest in an asset by analyzing the political, social, and
    economic forces affecting a crypto''s supply and demand. However, although this
    is all valuable data, it can be overwhelming, but this is what you should be looking
    at:


    *   Company and industry information from sources like `Yahoo Finance`, `Motley
    Fool`, `NASDAQ`, etc.

    *   Economic and current events from sources like `WSJ` and `Barron''s financial
    journals`, `Washington Post`, `New York Times`, `Bloomberg`, `CNBC`, etc.


    However, we all know that the internet is full of scams and avoiding false news
    is imperative. Two of the most common scams are:


    *   Those that promise a get-rich-quick scheme (no such thing in most investing,
    especially not crypto investing)

    *   Pump-and-dumps - promoters purchase specific cryptos, pump the price up by
    creating a lot of hype and then dump it at a high price, thus knocking the price
    back down again.


    You can find plenty of information on avoiding these scams at [`www.sec.gov`](http://www.sec.gov).


    ## Point Two - Technical Analysis

    This requires you to look at the trading charts and analyze the price action history
    and revolves around attempting to predict what a particular crypto''s future might
    hold. The main difference between this and fundamental analysis can be seen in
    a shopping example. A fundamental analyst looking for the right shop to buy a
    wedding present would ask their friends what they think of the products sold in
    several different shops. Then you would visit each store, look at each product
    and decide what to buy. A technical analyst would sit and watch each store. They
    would analyze what each shopper has in their bag, what their facial expressions
    are before and after they shop, and so on, and they would base their decision
    on certain patterns. You know the old saying, "history repeats itself" - that
    is technical analysis in a nutshell. In short, you look for past patterns and
    use them to create a strategy based on the crypto repeating those price movements.
    The best way to do this is to look at each cryptocurrency''s charts as you can
    see price movements and trends quite easily.


    ## Point Three - Market Sentiment Analysis

    This revolves around traders'' attitudes and emotions regarding a particular crypto
    and is the study of the bulls and the bears. When traders expect a price to go
    up, the market sentiment is bullish. Conversely, the sentiment is bearish when
    they expect the price to go down. All traders have their own intuition or feelings,
    so purely studying prices won''t tell you very much. Their opinions are expressed
    in whether they take a bearish or bullish position in the market, thus adding
    to the overall sentiment.


    ## Point Four - Capital Analysis

    This is quite possibly the most important of the five points and is the one most
    ignored by retail traders. Capital analysis requires you to research your risks,
    capital, and potential for reward. This is where calculating risk tolerance comes
    in, one of the most important steps to do before you decide on a trading strategy.
    You must calculate your available capital, leverage that makes the most sense,
    and the spread with your chosen broker; otherwise, you will fall prey to unpredictable
    losses. This kind of thing is also known as risk management. Your trading strategy
    will depend entirely on how much money is in your account and your capital. When
    you enter and exit a trade, your broker requires a fee known as the spread - this
    is the difference between your bid and the ask price. It is not recommended to
    speculate or trade right before a risk event - if you''ve done your fundamental
    analysis, you''ll know what''s what.


    ## Point Five - Overall Analysis

    This is where you get an overall analysis of the previous four points. You need
    to know a couple of things:


    *   First, are 90% or more of the previous points telling you a trade will be
    successful?

    *   Are you comfortable executing the trade, or does your gut tell you to hold
    off?


    We''ve all heard the term "women''s intuition," and there is much research indicating
    that women can tell what someone is feeling through a kind of psychic ability.
    However, where trading is concerned, it doesn''t mean you have to bring your wife/mother/sister
    in to help you because men use their gut feelings too - if you trust yours, it
    will rarely put you wrong. Instinct or intuition can do two things - it can be
    your starting point for analysis and a final indicator of whether you should go
    ahead. The one piece of advice I really can give you here is this - if you are
    not sure, if something is telling you not to do the trade, don''t do it. Never
    execute trades based purely on intuition, and always make sure you don''t confuse
    it with greed and/or fear. Always use all five points to ensure the trade is right
    for you.


    The next chapter will discuss the tax system and crypto investments.

    '
