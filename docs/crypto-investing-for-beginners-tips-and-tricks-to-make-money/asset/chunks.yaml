    | 功能 | 经纪商 | 交易所 |

    | :--- | :--- | :--- |

    | 流动性 | 深度高 | 一般 |

    | 市场深度 | 可能很高 | 有限 |

    | 客户服务 | 经验丰富 | 有限 |

    | 功能 | 面向更有经验的交易者 | 面向普通用户 |

    | 法币 | 支持 | 支持/不支持 |

