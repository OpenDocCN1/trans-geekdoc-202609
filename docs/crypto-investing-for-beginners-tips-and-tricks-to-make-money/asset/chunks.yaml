  fmt: '

    # Open-Source Cryptocurrencies


    Open-Source Cryptocurrencies are classed as open-source, meaning that anyone can
    join in and participate in the network and the mining or harvesting process without
    paying a fee.


    # Public Ledger


    Ledgers are a standard method of keeping records, i.e., recording data and other
    information. A ledger is still used with cryptocurrencies, but it is public. Anyone
    can see a public blockchain and see any transaction that happens on them. It is
    worth knowing that the public ledger is not a given for a blockchain because not
    all will use one. Some choose private ledgers, thus hiding the transactions from
    the public. However, this is contradictory to what blockchains are all about.


    # Smart Contracts


    Also known as digital, blockchain, or self-executing contracts, these are similar
    to a written contract but are entirely digital, removing the middleman you get
    in traditional contracts. Using a smart contract allows you to set up investment
    products, automatic payments, and other similar things without needing to use
    a bank or other central authority. Smart contracts are not written on paper; they
    are written into small computer programs stored on the blockchain and run from
    there. Every transaction through one of these contracts is distributed, and there
    is no central authority in control of any aspect of the transaction. And because
    the blockchain is used to store the program, it makes the smart contract immutable,
    which means it cannot be changed once entered onto the blockchain. However, immutability
    has disadvantages. Because the smart contract cannot be changed in any way, if
    there are any errors in the code, they cannot be fixed. This means that security
    surrounding smart contracts is quite difficult. Some companies choose to audit
    their smart contracts to get around this issue, but that can be expensive. In
    time, we expect the development life cycles to improve and better coding practice
    to help combat these security issues. At the end of the day, although successful
    so far, smart contracts are still very young and have plenty of time to prove
    themselves.


    # Cryptocurrency Forks


    Cryptocurrency forks have the potential to be lucrative. Some of today''s more
    popular cryptocurrencies came about as the result of a cryptocurrency fork or
    split, but what exactly is this? Sometimes, not all the developers on a network
    agree to a rule change or the direction a crypto is heading. Often, they decide
    to split away from the main blockchain and start a fork. Think about the fork
    you eat your meals with - one handle and a few breaches (the tines). That is what
    a cryptocurrency fork is. Some cryptocurrencies are built on open-source software,
    and they all have a protocol that all network members should follow. Some examples
    of the rules the network should follow include:


    *   The size of the transaction blocks

    *   Rewards given to "winning" network participants, harvesters, or miners

    *   How the transaction fees are calculated


    However, it is unlikely that cryptocurrencies will ever finish being developed
    because they are nothing more than projects built on software. As with anything,
    there is always some space for improvement, and developers often release updates
    to increase their crypto''s performance or fix issues. Some may be small updates,
    while others change how a cryptocurrency works - that same crypto they loved when
    they first developed it. In all relationships, we grow strong together, or we
    grow apart. When developers or network members strongly disagree on something,
    they have two options - shut up and stick with what''s what, or move on and create
    a protocol of their own.


    ## Hard vs. Soft Forks


    A fork is never just a fork; it could be a soft fork or a hard one. The majority
    of cryptocurrencies comprise a protocol (the rules) and the blockchain. If some
    of the network decides they want their own protocol, they will copy the original
    code and then change it - this can only be done where a cryptocurrency is fully
    open-source. Once the changes have been put in place, the developers decide where
    they want their fork to start, which will be a specific block number. The network
    will divide when the original cryptocurrency hits that block number on the blockchain.
    Some of the network opt to stay with the original while the rest go to the new
    fork. Each separate network will then start to add new transaction blocks to their
    fork, rendering the two chains incompatible. That is a hard fork, and the two
    resulting blockchains will never interact again, not even to acknowledge the old
    blockchain''s transactions or nodes.


    A soft fork is somewhat different. Think of a relationship that breaks up, but
    the partners stay friends - that''s a soft fork. The developers or network may
    decide to split the blockchain while ensuring that their new protocol changes
    are compatible with the original. Let''s say the developers choose block 800 for
    the soft fork. Most of the network may choose to follow the strong blockchain
    that follows both sets of rules. If a consensus is reached between the two sides,
    the newer rules are implemented across the entire network. Any nodes that choose
    not to follow and continue mining are simply wasting their time and resources.
    The community rejoins, and everyone is happy until the next disagreement rolls
    around.


    ## Free Money


    When a blockchain forks, the new one is based on the old one, so all the transactions
    previously recorded will also be on the fork. Simply put, when the chain forks,
    the developers take a "snapshot" of the ledger at the block they choose for the
    fork to happen, and the new chain is a duplicate of the old one up to that point.
    So, if you held 10 BTC in your wallet at the point the chain forks, you still
    have 10 BTC afterward. So how do you get free money? When a blockchain forks,
    you must hold cryptocurrency on a platform supported by the fork, and it must
    be before the chosen block number before the fork happens - this is classed as
    free money. However, its value depends entirely on the performance of the new
    fork and its subsequent popularity.


    ## Example - Bitcoin vs. Bitcoin Cash


    Bitcoin has been the subject of forks in the past, and one of the best-known occurred
    on 1st August 2017, Bitcoin''s birthday. The developers were in disagreement over
    block sizes - some said it should be increased to 2 MB, while others said it should
    be 32MB. Some of the network fell for the big idea, but the rest just thought
    making the block size that big was crazy. In the end, the two groups split and
    went their own way. Bitcoin Cash was created and got a new symbol - BCH. Those
    who followed the fork and already had BTC holdings were given an identical amount
    in BCH placed in their wallets. Today, BCH is worth just over $287, while BTC
    is worth almost $40,000. It will take time to know if BCH will ever get past the
    value of the original protocol, but the network members who followed did, at least,
    get something for their troubles.


    Next, we start looking at how you can get involved in investing in cryptocurrency,
    by delving into crypto exchanges and brokers.

    '
  trans: '


    # 开源加密货币


    开源加密货币被归类为开源，这意味着任何人都可以加入并参与网络以及挖矿或收割过程，而无需支付费用。


    # 公共账本


    账本是保存记录的标准方法，即记录数据和其他信息。加密货币仍然使用账本，但它是公开的。任何人都可以查看公共区块链，并看到其中发生的任何交易。值得注意的是，公共账本并非区块链的必然属性，因为并非所有区块链都会使用它。有些会选择私有账本，从而向公众隐藏交易。然而，这与区块链的核心理念相悖。


    # 智能合约


    智能合约也被称为数字合约、区块链合约或自执行合约，它们类似于书面合约，但完全数字化，去除了传统合约中的中间人。使用智能合约，你可以设置投资产品、自动支付和其他类似功能，而无需使用银行或其他中央机构。智能合约不是写在纸上的；它们被编写成存储在区块链上的小型计算机程序，并从那里运行。通过这些合约的每一笔交易都是分布式的，且没有中央机构控制交易的任何方面。并且因为区块链被用来存储程序，这使得智能合约具有不可篡改性，意味着一旦记入区块链就无法更改。然而，不可篡改性也有缺点。因为智能合约无法以任何方式更改，如果代码中存在任何错误，它们就无法被修复。这意味着智能合约周围的安全性相当难以保障。一些公司选择审计其智能合约来规避这一问题，但这可能很昂贵。随着时间的推移，我们预计开发生命周期会改进，更好的编码实践将有助于解决这些安全问题。归根结底，尽管目前很成功，智能合约仍处于非常早期的阶段，有大把时间来证明自己。


    # 加密货币分叉


    加密货币分叉有可能带来丰厚利润。当今一些较流行的加密货币都是加密货币分叉或分裂的结果，但这究竟是什么？有时，网络上的并非所有开发者都同意规则变更或加密货币的发展方向。通常，他们会决定脱离主区块链并启动一个分叉。想想你吃饭用的叉子——一个手柄和几个叉齿。这就是加密货币分叉的样子。一些加密货币构建在开源软件之上，它们都有一个所有网络成员都应遵循的协议。网络应遵循的规则示例包括：


    *   交易区块的大小

    *   给予“获胜”网络参与者、收割者或矿工的奖励

    *   交易费用的计算方式


    然而，加密货币不太可能永远完成开发，因为它们无非是构建在软件上的项目。与任何事物一样，总有改进的空间，开发者经常发布更新以提高其加密货币的性能或修复问题。有些可能是小更新，而另一些则会改变加密货币的运作方式——就是他们最初开发时所热爱的那同一个加密货币。在所有关系中，我们要么共同变强，要么渐行渐远。当开发者或网络成员在某事上强烈意见不合时，他们有两个选择——忍气吞声维持现状，或者另起炉灶创建自己的协议。


    ## 硬分叉与软分叉


    分叉从来不只是分叉；它可能是软分叉，也可能是硬分叉。大多数加密货币包含一个协议（规则）和区块链。如果部分网络决定想要自己的协议，他们会复制原始代码然后进行修改——这只有在加密货币完全开源的情况下才能做到。一旦更改到位，开发者决定希望他们的分叉从何处开始，这将是一个特定的区块号。当原始加密货币在区块链上达到该区块号时，网络将会分裂。部分网络选择留在原链，其余的则转向新分叉。每个独立网络随后将开始向其分叉添加新的交易区块，导致两条链不兼容。这就是硬分叉，两条生成的区块链将永不再交互，甚至不会确认旧区块链的交易或节点。


    软分叉则有些不同。想象一段分手但仍做朋友的关系——这就是软分叉。开发者或网络可能决定分裂区块链，同时确保其新的协议更改与原始协议兼容。假设开发者选择第 800
    个区块进行软分叉。大多数网络可能会选择遵循同时遵守两套规则的更强区块链。如果双方达成共识，新规则将在整个网络中实施。任何选择不遵循并继续挖矿的节点只是在浪费时间和资源。社区重新聚合，大家都很开心，直到下一次分歧出现。


    ## 免费的钱


    当区块链分叉时，新链基于旧链，因此之前记录的所有交易也将存在于分叉链上。简单来说，当链分叉时，开发者会在选定分叉发生的区块处对账本进行“快照”，新链是旧链直到该时间点的副本。因此，如果你在链分叉时钱包里持有
    10 个 BTC，分叉后你仍然拥有 10 个 BTC。那么如何获得免费的钱呢？当区块链分叉时，你必须在分叉支持的平台上持有加密货币，且必须在分叉发生前的选定区块号之前持有——这被视为免费的钱。然而，其价值完全取决于新分叉的表现及其后续的受欢迎程度。


    ## 示例 - 比特币 vs. 比特币现金


    比特币过去曾经历过分叉，其中最著名的一次发生在 2017 年 8 月 1 日，比特币的生日。开发者在区块大小上存在分歧——有人主张增加到 2 MB，而另一些人主张
    32 MB。部分网络成员被宏大的想法吸引，但其余的人认为将区块大小设得那么大简直是疯狂。最终，两派分道扬镳。比特币现金由此诞生，并获得了新符号——BCH。那些跟随分叉且已持有
    BTC 的人，在他们的钱包中获得了等量的 BCH。如今，BCH 价值略高于 287 美元，而 BTC 价值接近 40,000 美元。还需要时间来观察 BCH
    是否能超越原始协议的价值，但跟随分叉的网络成员至少为他们的麻烦得到了一些回报。


    接下来，我们将通过深入探讨加密货币交易所和经纪商，来了解如何参与加密货币投资。


    '
