    # Dogecoin


    *   Current Price - $0.11

    *   Market Cap - $15 billion


    Dogecoin was first released as a joke following the Bitcoin runup. Its name was
    taken from a meme on the internet showing a Shiba Inu dog. Dogecoin has no hard
    cap, so there are no limits on how much currency can be issued. DOGE is used to
    send money and make payments.


    ![](image_rsrc1PC.jpg)


    Those are some of the most popular and valuable cryptocurrencies available right
    now but, given the volatility of the market, these can, and often do, change.
    The next chapter will discuss how cryptocurrencies are mined.


    # Chapter 8: Cryptocurrency Mining Explained


    ![](image_rsrc1NY.jpg)


    Ask as many people as you like what they think cryptocurrency mining is. Some
    will look at you like you''ve grown an extra head, while many others will say
    it''s just a way of getting more crypto coins. In a way, it is, but it involves
    so much more. Mining is also about validating transactions on the blockchain and
    adding them in blocks to the ledger. Perhaps its most important job, though, is
    to prevent double-spending.


    Think about the physical fiat currency you spend. When you make a purchase, your
    bank updates your account, showing the payment leaving your account and going
    into another one. It works the same way with cryptocurrencies. When a crypto purchase
    is made, the digital ledger is updated, showing the debit from one account and
    the credit to another. However, digital platforms are constantly being hacked
    or manipulated. The Bitcoin ledger overcame this challenge by creating a system
    where transactions could only be updated on the ledger by verified miners. This
    ensures those miners are responsible for ensuring double-spending cannot take
    place.


    While the miners keep the network secure, new crypto coins are being generated.
    These are given to the miners to reward them for their work. Because there is
    no central authority on a distributed ledger, mining is critical to ensure transactions
    are validated, hence the incentive for the miners to take part - if they validate
    the transaction, they win the reward. A consensus protocol is in place to ensure
    that only those verified miners can do the work. This is known as a **proof-of-work**
    protocol, and it also keeps the network secured against outside attacks.


    ## Proof-of-Work


    You can think of cryptocurrency mining as akin to mining precious gems or metals.
    While these miners will uncover diamonds, gold, silver, etc., cryptocurrency miners
    unearth new coins and bring them into circulation. A miner needs to use a powerful
    machine to solve complicated mathematical problems - cryptographic hashes to earn
    the rewards on offer. A **hash** is a shortened digital signature representing
    the data in the transaction, generated to keep the data on public networks secure.
    Miners compete against one another to solve the **hash value** that each transaction
    generates - the first one to solve it adds the transaction block to the blockchain
    and gets the reward. The **hash function** for each transaction block contains
    a reference to the previous block. This continues right back to the first block,
    known as the **genesis block**, creating an unbroken chain. This is why each network
    node can verify and validate blocks and can verify whether the winning miner correctly
    solved the hash. As more miners join the network and more powerful computation
    resources are used, the equations become more difficult to solve. This increases
    the competition and adds to the cryptocurrency''s scarcity.


    ## How to Start Mining


    To start mining on any cryptocurrency blockchain, you need a powerful computer
    with the right software designed to solve the cryptographic equations. In the
    early days of blockchain technology, you could mine simple cryptocurrencies with
    a home computer containing a simple CPU chip. However, as the difficulty levels
    have risen over the years, those CPU chips no longer do the job. Today, you need
    one of two things:


    *   An **ASIC** (application-specific integrated circuit) miner

    *   A specialized **GPU**


    The GPUs must also be connected to a fast, reliable internet connection 24/7.
    Each cryptocurrency miner must also be part of an online mining pool.


    ## Different Mining Methods


    The mining method you choose will dictate the length of time it takes. In the
    early days, **CPU mining** was the chosen method. However, it is incredibly slow
    and is no longer practical because of the length of time needed to accrue a tiny
    profit - it can take months, and mining rigs use a significant amount of electricity
    and cooling. The cost is often way beyond what the profits are.


    **GPU mining** is now a more common method, using a set of GPUs in a single mining
    rig to maximize the computational power. The rig also requires a motherboard and
    an effective cooling system.


    **ASIC mining** is also becoming popular. ASIC mining rigs are designed ONLY to
    mine cryptos, unlike GPU rigs that can be used as ordinary, albeit powerful, computers.
    Because of this, ASIC miners can produce more crypto units, but they are more
    expensive - the more difficult mining becomes, the more likely it is that these
    rigs will disappear.


    **Cloud mining** is slowly taking over, eliminating the rising costs of ASIC and
    GPU mining. People who do cloud mining can leverage power from dedicated mining
    facilities and large corporations. As an individual miner, you can find paid and
    free mining hosts and rent a rig for a set period, making it a hands-free mining
    method.


    ## Mining Pools


    While you are perfectly at liberty to mine alone, many people choose to join a
    **mining pool**. All the miners'' resources are combined, providing more computational
    power to increase the chances of solving the equation and earning the reward.
    Should a pool succeed, the reward is split among all members, proportionate to
    the level of resources each contributes.


    Most cryptocurrency mining applications already have a mining pool, but you also
    have the option of creating a pool by joining other like-minded enthusiasts online.
    Once you join a pool, you are not tied to staying with it - you can move between
    pools as much as you want, and many people move because some pools earn higher
    rewards. However, many miners feel that the official pools are better - they are
    more reliable, offer technical support, and are updated regularly by the hosting
    companies. If you think joining a mining pool might be for you, have a look at
    **CryptoCompare** to compare the different ones available based on profitability,
    reliability, and different crypto coins.


    ## Is Crypto Mining Worth It?


    Whether mining is right for you is a matter of personal choice, and several factors
    will affect your decision. Regardless of the type of mining you choose - CPU,
    ASIC, GPU, or Cloud - perhaps the most important things to consider are:


    *   The **hash rate** produced by the mining rig

    *   Power consumption

    *   Overall costs


    Typically, a good cryptocurrency mining rig will cost anywhere between $3000 and
    $10000+. They also give off a lot of heat and use high amounts of electricity.
    For example, a typical ASIC miner used to create one Bitcoin every 10 minutes
    will use roughly 72 terawatts of power - 1 terawatt is sufficient to power 10
    billion 100-watt lightbulbs simultaneously, just to give you an idea of how much
    power that is! As blockchain technology gets better and the mining difficulty
    becomes harder, that power consumption figure will change. You also need to factor
    in the costs for keeping the rig cool, especially when using ASIC or GPU rigs.
    Lastly, you must consider the difficulty level surrounding the cryptos you want
    to mine to decide if there is enough profit in it for you.


    ## Tax Implications


    Tax is also something you need to consider. I''ll be covering this in more detail
    in a later chapter, but for now, you need to know that cryptocurrency miners will
    typically have to pay tax in two cases:


    1.  When they receive a crypto reward for mining, and

    2.  When they exchange or sell their reward tokens or coins

