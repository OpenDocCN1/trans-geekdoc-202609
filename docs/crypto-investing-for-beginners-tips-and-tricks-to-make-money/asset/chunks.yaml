    # 新经济体系与加密货币投资指南


    毫无疑问，新的经济体系正在形成一股巨大的浪潮，但无法预测它是否会最终汇聚成一系列由区块链支持的加密货币。其中一个较为著名的项目称为 **Initiative
    Q**。该项目始于 2018 年，最初纯粹是一项社会实验，其经济模型基于一个不争的事实——所有货币之所以有价值，是因为人们持有该货币，且商店接受它作为一种支付形式。**Initiative
    Q** 自诩为“明天的支付网络”，目前正在试验一种名为 **Q** 的货币，这种货币未来可能会出现，也可能不会。早期采用者可以邀请他人并获得 **Q** 作为奖励；这鼓励受邀者进一步邀请更多人，以此类推。该项目背后的理念是：持有
    **Q** 的人越多，就越容易使其成为一种合法货币，从而能够取代法币（如美元），并实现全球通用。


    此类项目既是机遇也是挑战。你可能会偶然发现一个风险极高的未来模型，也可能发现它并不具备你所需的条件。例如，**Initiative Q** 被许多人视为无非是一个传销骗局，因而被当即拒之门外。然而，该项目的风险水平较低，因为除姓名和有效电子邮件地址外，不要求提供其他个人信息。根据公司政策，若项目不成功，数据将被销毁。它是否成功是你必须考虑值得承担的风险，但其他项目会索要更多个人信息，包括银行详细信息——请做些调查，与他人交流，并据此做出明智决定，判断你是否准备好承担该风险。


    ## 8. 分散投资


    分散投资是成功投资组合的关键，但好事也可能做过头。过度分散意味着将资金分散到多种资产上，当价格合适时，你可能会发现资金不足，无法投资于表现最好的资产。对大赢家投入过少意味着回报率低。如果你已对某个加密货币做了充分调查并认为它会成为赢家，考虑将更多投资组合资金配置给它，而不是投资于许多可能表现好也可能表现差的小型项目。有时，要想真正站稳脚跟，唯一的办法就是对几个大型加密货币进行较大额投资，以确保达成目标。


    ## 9. 让情绪主导投资决策


    投资时，无论投资何种资产，你都需要做出一些艰难的决定，这需要严格的自律。当然，你可能会觉得某个加密货币很有魅力，但如果让情绪干扰决策，可能弊大于利。如果你投资的加密货币曾表现优异但现在不再如此，你可能需要决定放手。不要仅因为它曾让你赚钱就继续持有——如果它正在走下坡路，最终会让你亏损，这违背了投资的初衷。投资的核心在于盈利，所以切勿让感性支配理性——至少不能过度。直觉固然重要，但仅凭直觉行事可能导致财务灾难。


    ## 10. 使用 IDDA 方法


    最后，无论你是哪类交易者或投资者，都应始终使用 **IDDA**（见第 12 章）来辅助和指导决策。你需要了解市场并保持极大的耐心，但如果你投入时间，这套策略将带来丰厚回报。没有侥幸可言。仅仅因为你喜欢的电影明星推广某个加密货币，并不意味着你应该倾尽所有资金买入。分析是关键。你可能自认为发现了一个强劲趋势，但那可能仅基于单一时间框架——除非你寻找更多指标确认，否则不能说你已完成了技术分析。在做出投资决策前，确保所有
    **IDDA** 要素都指向同一方向。


    ## 结语


    ![](image_rsrc1NY.jpg)


    感谢您抽出时间阅读我的指南。虽然您可能精通传统市场的交易与投资，但对数字资产进行同类操作则是完全不同的局面。本书旨在为您提供入门所需的信息，包括对加密货币是什么、如何运作以及区块链技术的透彻理解。我们还讨论了为何要投资加密货币、其优缺点，以及可供投资的不同加密货币类型。我们探讨了加密货币挖矿，并考察了短期和长期的交易与投资策略。我们还研究了两个重要课题——如何在最大化收益的同时最小化损失，以及税务问题，随后介绍了
    **IDDA** 策略。最后两章提供了一些建议，您现在应该已掌握开始加密货币投资之旅所需的所有信息。


    临别赠言：如果您缺乏信心或从未进行过任何交易，请考虑开设模拟账户。大多数交易平台都提供此功能，让您在冒真金白银的风险前了解运作机制。最后，**切勿投入超出您舒适承受范围的资金**。


    感谢您购买并阅读/收听本书。如果您觉得本书有用/有帮助，请花几分钟时间在 Amazon.com 或 Audible.com（如果您购买的是有声版）留下评价。

    '
