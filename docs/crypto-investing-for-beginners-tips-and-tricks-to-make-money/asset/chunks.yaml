    Binance 是较为专业的平台之一，允许购买和出售数字货币。这包括以太坊、比特币和其他大型知名币种，以及大量较小的币种——总共约 60 种。佣金较低，且交易越多费用越便宜。交易手续费起步为交易价值的
    0.1%，即每交易 10,000 美元收费 10 美元，此后费率取决于你过去 30 天的交易量。


    *   **佣金** - 交易价值的 0.1% 或更低

    *   **账户最低金额** - 0 美元


    ## Coinbase


    Coinbase 是一个专注于加密货币和直接交易的专业平台，支持超过一百种加密货币。你还可以选择将加密货币存储在提供延时提款功能的保险库中，从而提供额外保护。然而，它们的佣金结构相当繁重。点差加价为
    0.5%，在此基础上还会根据交易金额和资金来源添加交易手续费。加入其专业版平台会更便宜。


    ## Interactive Brokers


    Interactive Brokers 允许以极低的佣金直接交易四种加密货币。你也可以购买以太坊和比特币期货，而非直接购买加密货币。Interactive
    Brokers 还允许在芝加哥商品交易所购买比特币期货。比特币合约费用为 11.02 美元，包含 5 枚硬币；以太坊合约费用为 9.02 美元，包含 50
    枚硬币。它们还提供全方位的投资产品，允许你购买几乎任何在任何交易所交易的资产。


    *   **佣金** - 交易价值的 0.12% 至 0.18% 以及每份期货合约 10.02 美元

    *   **账户最低金额** - 0 美元


    # 最佳加密货币交易所


    以下是你能在网上找到的一些最佳加密货币交易所：


    ## Crypto.com


    作为最大的交易所之一，它也是增长最快的交易所之一。尽管其总部位于香港，但它为美国客户提供了大量支持。它在全球提供超过 90 种加密币和代币的访问权限，为美国客户提供
    50 种。它们还提供极佳的加密储蓄利率，利息每周支付一次，并为你的账户提供借记卡。然而，目前没有桌面平台；它纯粹基于应用程序。费用结构也相当复杂，客户支持有些有限。


    ## Voyager


    Voyager 广受欢迎的平台是最早上市的加密货币交易所之一。与 Crypto.com 一样，它们基于应用程序而非桌面端，并提供免佣金的交易结构。支持大多数主流加密货币，资产利息按诱人的利率支付。最大的优势之一是，当你交易了
    100 美元的加密货币后，可以获得 25 美元的 BTC 奖励。最大的缺点是提款可能需要一天或更长时间。


    ## BlockFi


    作为一个加密投资平台，BlockFi 让你出借持仓并赚取利息。你可以不卖出加密代币和硬币，而是以它们作为抵押品进行借贷。有时它们会提供高达 250 美元的奖金，条件是你存入
    25 美元（推测为 25,000 美元或特定金额，原文为 "deposit 25"）并将其放置一段设定的时间。它们不收取任何佣金或费用，且总部位于美国。BlockFi
    受到全面监管，确保了一定程度的保护。然而，它们支持的加密货币不多，且你只能进行有限次数的免费提款，超出后将开始收费。


    ## Binance


    虽然 Binance 不是列表中最易用的平台，但它是 Neo 和 Cardano 等加密货币的最佳平台之一。它们也是最知名、最稳健的交易所之一。它们的移动应用不是特别好用，但它们有网页平台。还有两个版本——`Binance.com`
    是国际版，拥有许多用于投资的代币和硬币；`Binance.us` 是美国版，提供的内容相对有限，且并非在所有美国州都可用。客户支持略显有限，但与其他平台相比，它们的交易速度很快。


    ## Kraken


    Kraken 是最早的加密货币交易所之一，它们为交易和投资目的提供了一系列不错的代币和硬币选择，并支持保证金交易。不过请注意，Kraken 是一个真正的交易所，可能不像其他顶级平台那样用户友好。它是少数交易
    DOGE 和其他一些高风险代币的平台之一。同样，美国客户可选择的代币和硬币比国际客户少得多。


    ![image_rsrc1P9.jpg](img/image_rsrc1P9.jpg)


    现在你了解了经纪商和交易所的方方面面，是时候了解加密货币钱包了。


