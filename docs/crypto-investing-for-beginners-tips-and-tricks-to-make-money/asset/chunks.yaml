    # 简介


    2009 年，首个加密货币比特币诞生。如今，加密货币已超过 2,000 种，2017 年比特币价值飙升 1300% 以上，引发了主流社会的极大关注。然而，与瑞波币等数字资产相比，比特币的这一涨幅微不足道，后者上涨了
    36,000%。这种回报率是投资者毕生梦寐以求的，但鲜有人能登顶。围绕这些加密货币的炒作引发了兴趣的显著上升，导致许多人选择投资数字资产而非传统股票。2018
    年，加密货币泡沫轰然破裂，高位接盘的后进投资者落得个两手空空。这让新投资者斥其为骗局，纷纷回归传统投资或彻底放弃投资策略。然而，尽管遭遇挫折，加密货币市场仍持续演变并趋于稳定，这才引起了世界上一些最大金融机构的关注。随着更多加密货币被售出，接受其作为支付形式的交易者数量也随之增加，朋友们，这就是加密货币市场至今蓬勃发展的原因和过程。


    这些加密货币基于区块链技术，这是一种新型颠覆性技据，据称其影响力远超互联网的发明。如今区块链的用途远不止加密货币，正如互联网不只是用来发送电子邮件。加密货币的交易和投资过程在许多方面与传统交易投资相似。但它也独具特色，因为加密货币兼具货币（如欧元、美元、英镑）和资产（如公司股票）的属性。这种投资方式在分析加密货币基本面方面截然不同。传统估值方法失效，因为加密货币数据大多不是中心化的。区块链技术的核心理念是其及其加密货币去中心化，因此交易中无中介参与。取而代之的是，一个成员网络被赋予了区块链的控制权。


    这大致勾勒了本书的内容。撰写本书时，我假设你至少听说过加密货币，甚至可能已经迈出了购买的第一步。但你知道它们如何运作吗？你知道如何通过投资获利吗？即使你目前投资股市或其他市场，也不意味着能直接跨入加密货币交易。我相信你拥有电脑并会使用互联网，但在考虑加密货币交易前，你必须确保拥有高速互联网接入——如果你不想在交易中吃亏，这至关重要！除此之外，让你涉足数字资产和加密货币投资交易的，仅需这本书，那么让我们开始吧。


    # 第 1 章 什么是加密货币？


    除非你是圈内人，否则你可能在纳闷什么是加密货币。当然，你听说过比特币——谁没听说过？你可能也听说过以太坊、莱特币、瑞波币等，但不确定它们是什么。


    简单来说，加密货币是数字货币。传统货币（如欧元或美元）可以数字化转账，但这与数字货币截然不同。目前，你可以像使用传统货币进行电子支付一样，用比特币支付某些商品和服务。随着时间的推移，加密货币将变得更加主流，接受它的地方会更多。


    加密货币与传统现金的根本区别在于其底层技术。大多数人只关心手中的现金，而不关心其背后的技术，但传统系统问题重重。这些问题包括：


    *   电汇、信用卡和其他支付系统已过时

    *   中介导致交易缓慢且昂贵

    *   金融领域的全球平等性快速增长

    *   30 亿人无法获得金融服务


    加密货币的初衷是解决这些问题及其他更多问题。


    ## 加密货币


    你目前使用的货币由政府担保、存放在银行。你需要 ATM 或网银向他人转账或取款。加密货币旨在摒弃这一切，依靠区块链技术运行。区块链去中心化，无中介，无单一控制者。取而代之的是，计算机网络确认每笔交易——区块链如何运作将在后续章节详述。首先，让我们进一步了解加密货币。


    ## 什么是货币？


    要被视为有价值，货币需具备以下特征：


    *   足够多的人持有货币

    *   必须被接受为支付形式

    *   必须被社会信任为当前有价值且将保持价值


    早期不存在实体硬币和纸币，人们通过易物贸易交换物品。然而，真实货币的出现——纸币、硬币，甚至我们今日依赖的信用卡——改变了信任模式。交易便利性也是主要因素，货币发明的主要原因之一是黄金条在国家间转移的物流困难。信用卡随之而来，但同样基于政府担保的法币。世界联系越紧密，人们越担心掌权当局是否顾及我们利益。因此，加密货币将提供可行的替代方案。


    ## 加密货币简史


    我们都知道比特币是首个加密货币，其诞生源于中本聪（至今身份匿名）于 2008 年发布的一份白皮书，详述了“电子货币的点对点版本”。此后，诞生了许多其他加密货币，有成有败。比特币及其他加密货币仅通过一种方式创建——挖矿。但这不同于开采贵金属、矿石、宝石的传统方式，加密货币挖矿由强大计算机解决数学谜题完成。本书后文将深入探讨挖矿。2011
    年，有人发现比特币存在缺陷，从而催生了山寨币以改进比特币设计——它们更快、更安全、更匿名等。莱特币是首个山寨币，此后已创建数千种，如今我们有数千种可供选择。稍后我将介绍一些最热门的币种。


    ## 加密货币优势


    以下是加密货币通过去中心化旨在解决的一些问题：


    ### 1. 更便捷的交易


    加密货币交易比传统交易更廉价、便捷、安全。你可以用手机 App、加密钱包或交易所钱包收发加密货币，甚至能在比特币 ATM 购买，随后转入手机 App 或加密钱包，无需银行账户。


    ### 2. 更安全


    加密货币深度依赖区块链和加密技术，确保更高安全性。安全性主要基于算力——算力越高，攻破网络所需算力越大。比特币拥有所有加密货币中最高的算力。失去存储加密货币访问权的唯一真正途径是丢失私钥或私钥被盗——稍后详述密钥。


    ### 3. 可及性


