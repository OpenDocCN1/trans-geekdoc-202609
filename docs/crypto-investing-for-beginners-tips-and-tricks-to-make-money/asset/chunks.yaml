    # 第 5 章 交易所与经纪商


    既然你已更深入地了解加密货币、其优缺点，以及它与区块链的运作方式，你就已准备好开启投资之旅。由于加密货币属于数字资产，大多数加密货币交易和投资都在网上进行，尽管也存在使用现金购买加密货币的有限途径。


    你应该知道，两种主要的交易方式是使用交易所或经纪商。但你也应该意识到它们之间存在差异。


    ## 交易所 vs. 经纪商


    首先要注意的是，交易所的流程与股票交易所非常相似。加密货币交易所是买卖双方聚集在一起交易法币和加密货币的场所。交易所作为中介，收取费用以促成交易。加密货币交易所的两种常见用法是：使用法币购买加密货币，以及不同加密货币之间的交易
    —— 例如，用 BTC（比特币）购买 Ether（以太坊）。每个交易所都有自己的交易对，因此使用哪一个完全取决于你和你的需求。


    让我们举个例子说明其运作方式。假设你是一名投资者，你将 USD 存入某交易所。这意味着在你能开始交易任何其他山寨币之前，你只能使用与 USD 相关的交易对，即
    USD/ETH、USD/BTC 等。加密货币交易所是交易加密货币最常见的方法，尤其是在仅涉及少量资金的情况下。


    经纪商在市场与交易者之间进行调解。简单来说，如果你使用经纪商进行加密货币交易，你将资金存入他们的账户。这使你能够访问他们提供的产品。你不局限于交易你存入的法币或加密货币，可以使用任何其他交易对。经纪商寻找交易对手方
    —— 交易中的另一方 —— 在某些情况下，甚至可能自己充当对手方，执行交易。


    这里有个例子帮助你理解。你向经纪商存入 BTC，但选择 Ethereum/XRP 交易对进行杠杆交易。你可以根据存入的 BTC 数量来交易该交易对。如果你想在交易所交易
    Ethereum/XRP，你的 BTC 必须先兑换成 Ether。


    那么，主要区别是什么？由于经纪商拥有更好的流动性和安全性，它们更适合大额资金交易者。一旦你的资金存入，你可以根据所选经纪商提供的服务，从多种机会中进行选择，例如杠杆头寸。另一方面，交易所让加密货币交易变得更加容易，使用由存入的法币或加密货币决定的交易对订单簿。你应该记住，当你使用交易所时，交易资产会实物交割，而使用经纪商时，你只是在交易标的资产。


    经纪商与交易所的另一个主要区别在于目标受众。加密货币交易所更多地被寻求中长期投资的加密货币 **HODLers**（长期持有者）使用，他们购买特定加密货币，然后等待价格上涨。经纪商更多地被投机性投资者使用，他们进行不同的交易并利用经纪商提供的各种工具。他们通常关注短期或中短期利润，并将经纪商作为获利的中介。


    ## 注册与验证


    每个交易所都有自己的注册流程。有些只要求客户提供电子邮件地址，随后进行验证确认并要求你设置密码。其他交易所，尤其是涉及法币业务的，则要求身份验证。这可能包括扫描身份证件、视频通话、手持身份证拍照，或者可能是完整的
    KYC 流程，尽管这通常只在你想获得更高的存取款额度时才需要。KYC 是金融机构在你开户时用于识别和验证你身份的“了解你的客户”流程。Binance 是最大的交易所，你可以在未完成完整
    KYC 的情况下交易；不过，你每天只能提取 2 BTC。验证可能需要数小时至数天，所以要有心理准备，不要指望开户当天就能开始交易 —— 这不一定能实现。


    经纪商也有相当简便的验证流程，但这至关重要，因为经纪商受官方法规监管。大多数情况下，你需要提供带照片的身份证件和居住证明，通常是水电费账单或租赁合同。经纪商的验证时间也不会太长，你可以在同一天完成注册、存款和交易。


    ## 存款与取款


    加密货币交易所提供两种存取款方式。第一种是法币，但这并不容易 —— 并非所有交易所都接受法币，所以你可能需要存入加密货币。此外，法币往往会产生更高的费用。请注意，从银行账户向加密货币交易所账户添加法币会产生费用，使用借记卡或信用卡也会产生费用。就取款而言，费用高于存款费用。你还必须确认你的银行是否接受加密货币交易所的转账
    —— 并非所有银行都接受。


    如果你存取加密货币，费用往往要低得多，尤其是存款，因为许多交易所不收取加密货币存款费。经纪商提供更多存款选择 —— 他们接受借记卡和信用卡、银行账户、电子钱包，当然也包括加密货币，且通常不收取存款费。他们的取款费往往较低，通常在
    0% 到 3% 之间，而一些交易所收取高达 6% 的费用。


    ## 交易


    交易所是易于使用的加密货币交易平台，大多数使用订单簿，允许你进行限价单、市价单或两者兼施。每个交易所的流动性不同，基于 DOM（市场深度）。流动性高的交易所，买单和卖单之间的价差通常较小。大多数交易所仅提供基础功能，这通常足够新手或普通用户使用。更专业的交易所提供高杠杆工具，如永续合约或期货。然而，最大的优势是交易所提供种类繁多的加密货币供交易。


    经纪商提供额外的交易工具，如 CFD（差价合约）和衍生品。他们还提供交易工具帮助客户进行交易，如指标和移动平均线。有些甚至提供自动化机器人和策略，帮助交易者优化风险管理并改进交易。就
    CFD 交易而言，敞口通过杠杆放大。例如，如果交易者所选加密货币的 CFD 杠杆比率为 1:2，价格波动 5%，则 CFD 交易者将盈亏 10%，具体取决于波动方向和交易者选择的仓位类型。简单来说，CFD
    交易者可以快速获得巨额利润，但也可能非常快地亏损。杠杆交易最好留给经验更丰富的人。


    ## 安全性


    经纪商的点差通常比交易所更紧，这是保证金交易者使用它们的原因之一。你无疑听说过加密货币交易所被黑客攻击的事件，例如 2014 年的 Mt. Gox 黑客事件，导致数千枚比特币被盗。即使是最大的交易所也是攻击目标
    —— Binance 在 2019 年遭遇 KYC 黑客攻击，数千名客户的验证详情泄露。加密货币交易所也将继续成为黑客攻击和诈骗的薄弱环节，经纪商也可能成为目标。然而，经纪商受到监管，并为客户提供一定的财务保护，如果发生最坏的情况，可以获得赔偿。经纪商也往往经过彻底审计，选择资金存放地时请记住这一点，并寻找受
    FCA 或 SEC 监管的经纪商。经纪商还将你的资金存放在传统银行账户中，这也受金融法规保护。根据你的需求做出选择，但请记住还有另一种选择 —— 你可以将资金存储在硬件钱包中，如
    Ledger 或 Trezor。这样做的理由很充分 —— 拥有钱包意味着你拥有私钥，可以随时访问你的资金。如果你将加密货币存放在交易所，你就没有私钥 ——
    交易所掌握着私钥。这里有一句非常相关的加密货币格言 —— “**Not your keys, not your crypto.**”（私钥不在你手中，币就不属于你。）


    ## 收入


    经纪商和交易所在许多方面相似，但在收入来源方面也有差异。当然，两者都收取费用，但他们对待客户的方式不同。交易所提供广泛的交易对，吸引了许多交易者。这些交易对为交易所带来了广泛的价差，因为市场深度相当小且流动性强。他们的取款和交易费用通常较高，有时存款费用也较高。经纪商的交易和取款费用要低得多，但交易金额大得多，因此费用金额可能与交易所处于同一水平。


    ## 对比表


    下表展示了交易所和经纪商的主要区别，应该能让你更容易看出哪种更适合你的情况。


    '
