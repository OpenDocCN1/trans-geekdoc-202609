    # 将损失降至最低


    由于比特币和加密货币市场总体上波动极大，当你开始投资和交易时，必须信任自己的直觉。为确保你大多数时候都能处于有利位置以进行最佳交易，你需要保持信息灵通，而有一条适用于所有投资者的基本规则，尤其是在加密货币领域——**DYOR
    - Do Your Own Research（自行调研）**。因此，首先你必须训练自己如何进行技术分析。这样，你就可以分析想要投资的特定资产的价格预测，而不必依赖他人的分析。你还需要花时间了解想要投资的资产。阅读它们的白皮书，搜遍互联网并查看社交媒体，特别是
    Reddit，因为那里是有用加密货币信息的宝库。因为你将基于自己的研究而非他人的研究做出投资决策，所以你不应为任何投资感到后悔。从那里，你可以轻松地转向下一笔交易，而不会为上一笔交易的结果而恐慌。


    自比特币诞生以来的这些年里，加密货币市场一直像溜溜球一样上下波动，即使在牛市和熊市趋势中也是如此。虽然我们可以诚实地说，到目前为止，加密货币市场的所有跌势之后都伴随着上涨，有时涨幅巨大，但这些下跌会造成无尽的压力，大多数投资者，尤其是新手，发现它们难以驾驭。因为这些是你最有可能遭受最大损失的时候，特别是如果你不小心的话，以下建议将帮助你守住价值，将损失降至最低。


    ## 1. 不要被 FUD 和 FOMO 所左右


    虽然及时了解最新的加密货币趋势和新闻至关重要，但信息过载也是可能的。当市场下跌时，这一点更加明显，此时很容易失去冷静，让本能占据上风，从而做出错误的决定。**FUD**（恐惧、不确定性和怀疑）和
    **FOMO**（错失恐惧症）是加密货币投资中常用的术语，两者都能强烈影响我们在错误的时间买入和卖出。**FUD** 通常围绕负面情绪，通常由利空消息、谣言或知名人士对某资产或市场表达担忧引起。这可能导致一些交易者抛售投资，因为他们预期价格将继续下跌。这会对价格产生负面影响。另一方面，**FOMO**
    更多是关于交易者在看到利好消息后冲昏头脑。他们倾向于忽视基本信号，过于急切地想要跟风入场，瞄准的“飞向月球”可能不过是海市蜃楼。未来是不可预测的，尤其是在加密货币市场，没有任何一个人能给你比你自己调研并做出自己的决定更好的建议。请记住一点——一些发行商和影响者通过制造
    **FOMO** 或 **FUD** 来推动市场朝他们想要的方向发展，从中获利。当你听到或读到关于你感兴趣的加密货币或整个市场的消息时，尝试用多个来源来验证，而不仅仅是一个来源。


    ## 2. 设定明确目标、构建多元化投资组合、仅投入你承担得起的资金


    你可以对某个加密资产充满信心，但如果你投入的资金超出了你的承受能力，你将会陷入巨大的痛苦。没有人想陷入情绪过山车，眼睁睁看着投资组合价格下跌，却还要等待它们回升。此外，任何优秀的投资者投资组合中也会持有多种资产，一些是短期的，一些是长期的，通常是加密货币和股票的混合体。由于市场波动极大且全年无休（24/7，365
    天）运行，投资者应确保在投入任何资金之前就制定好交易策略，包括设定你的入场点和出场点。说句公道话，你可能看到了关于加密货币的每一条信息，但只需一件事——一条推文、一次黑客攻击等——就能让价格自由落体。这就是为什么提前规划至关重要，以便在崩盘发生时减轻损失。在上一章中，我们探讨了一些你可以遵循的策略，**定投（Dollar-Cost
    Averaging，DCA）** 是一种很好的方式，能帮助你在不使用情绪、无需时刻盯着图表的情况下进行交易。**定投** 的核心是定期以小额资金买入和卖出。别忘了——当你持有波动性资产时，很容易发现自己冲动行事。任何类型的交易都是高风险的，特别是当市场处于熊市时期。投资者应设定目标，在潜在收益和潜在损失之间创造平衡。


    ## 3. 长期投资与 HODL（长期持有）


    有句俗语大致是“卖出前都不算亏损”。虽然这不是 100% 正确，但其中有道理。如果你的资产自购买以来价值下跌了，这被称为**未实现亏损**。如果你以低于买入价的价格卖出，它们就变成了**已实现亏损**。多年来，比特币一直处于近乎持续的上升趋势中。即使价格暂时下跌或熊市持续，从历史上看，我们可以看到价格最终会上涨——在加密货币的情况下，这种上涨通常由稀缺性和其他因素驱动。稀缺性是导致许多人相信加密货币价格将继续上涨的一个因素。如果你的投资时间框架是长期的，你可以将负面波动视为暂时的，并等待其过去。长期持有资产，被称为
    **HODL（长期持有）**，是一种久经考验的策略，比特币绝对已证明自己是过去 10 年中最成功的资产。别忘了，在某些国家（如美国），长期持有在税务方面也能帮到你，即持有至少一年比提前卖出更有利。


    ## 4. 做好获利了结或熬过下跌的准备


    也许避免波动并在下跌期间保持安全的最稳妥方法，是将波动性持仓转换为稳定性持仓。这样，你可以锁定余额，将风险降至最低。这也减少了主动管理投资组合的必要性，并在牛市期间降低你的压力水平。**USDC**
    和其他稳定币试图保持其价值固定，在市场下跌时投资一些此类稳定资产，可以将你面临的价格变动风险降至最低。然而，当你同时卖出所有资产时，这被称为**投降（Capitulation）**，如果市场突然再次飙升，这会导致加密货币投资者遭受重大损失。这就是为什么你需要一个计划，详细规定你能接受的大致盈亏水平，**在你承受压力需要做决定之前**就制定好。许多投资者选择在投资组合中使用稳定资产，根据围绕市场撤离和回购策略的节奏进出它们。通过这种方式，只要他们把握好时机，他们的投资组合就会逐渐增值。然而，这并不容易，绝对不适合新投资者；即使是经验丰富的投资者也会把握错时机。


    ## 5. 发现机会

