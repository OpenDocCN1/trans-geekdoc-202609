- raw: 'Depending on which wallet you choose, you will likely get two keys - a public
    and a private key. The public key is created automatically when you set your crypto
    wallet up and is needed to carry out your transactions. It is much like a web
    address, and when you make a purchase, accept a crypto payment or send crypto
    to another wallet, you will need to provide it. The private key is much like a
    password and is the one key you must keep secure. It is used to manage your cryptos,
    and unless you choose a hosted wallet option, it is your responsibility to keep
    the key safe, where no one else can get it. Using Your Crypto Wallet When you
    have decided which wallet to use, you need to set an account up if using a hardware
    wallet or download the software or app needed for the software wallets. You will
    be asked to create the security keys you need to keep somewhere safe, and some
    wallets also offer two-factor authentication for an additional security layer.
    Once your wallet and account are set up, you should transfer the cryptos you have
    purchased from the exchange to your wallet. Using Coinbase as an example, you
    will find an option to let you "send" your cryptos. Then you are asked to provide
    the wallet address and how much crypto to send. Most crypto wallets are free to
    download and offer free crypto storage. However, expect to pay fees for some transactions.
    Hardware wallets are not free but come in at a reasonable cost - however, it is
    a small price to pay for security. Best Crypto Wallets I can''t recommend using
    any specific crypto wallet because it is down to your specific needs. You need
    to consider whether you want one purely for storing your cryptos securely, or
    are you going to be investing, trading, and doing other transactions? To give
    you an idea of what''s available, I will talk about some of the more popular options
    available today. It''s worth noting that the prices quoted were correct at the
    time of writing - to get the up-to-date prices, you''ll need to visit the relevant
    websites. ![](image_rsrc1PB.jpg)Trust Wallet https://trustwallet.com Trust Wallet
    is a hot wallet and a mobile app that is free to download and set up. Originally
    developed by Victor Radchenko, Trust Wallet was acquired in 2018 by Binance and
    is now the official Binance wallet. If you invest in the Binance Coin, the Trust
    Wallet is required. However, it can also handle many other cryptocurrencies and
    offers a great many features to ensure excellent security. You get the option
    of using Google Authentication, Two-Factor Authentication, email or SMS verification,
    among other features. While Trust Wallet is a hot wallet, it offers users the
    security aspects of a cold wallet by storing most of its deposits on a cold storage
    server. There are no fees for using the wallet; the only fees are associated with
    transactions on the blockchain, and those are paid to the miners, not Trust Wallet.
    You can make direct crypto purchases via Trust Wallet, although only two exchanges
    are supported on the platform - Simplex and MoonPay. Alternatively, you can purchase
    your cryptocurrency form wherever you want and send it to your Trust Wallet. Huobi
    Pro [https://www.huobi.com](https://www.huobi.com) Another free wallet, Huobi
    Pro is a multi-chain wallet. It is also referred to as a light wallet, but all
    this means is that the whole blockchain is not downloaded when a transaction is
    verified; instead, it uses the block headers. In terms of functionality, Huobi
    Pro is comprehensive - to some, the interface may seem over-busy. It supports
    more than a thousand cryptocurrencies, and you have the option of direct purchases
    on Huobi Global exchange or the P2P market from other traders. It also supports
    most fiat currencies and is one of the fastest-growing companies globally. Huobi
    Pro offers plenty of security features. While users have sole control over their
    own private keys, Huobi does offer a guarantee and has previously returned funds
    to customers where errors have caused loss. Coinbase Wallet [https://wallet.coinbase.com](https://wallet.coinbase.com/)
    Founded in 2012, Coinbase is primarily a mobile app. Although they say they are
    supported on desktops, this is only an extension on the Chrome browser. Coinbase
    is regulated and licensed in the USA and can be used anywhere in the states except
    for Hawaii. It is tied to the Coinbase exchange, making it simple to use if you
    choose Coinbase as your exchange. Originally only for Bitcoin, Coinbase now supports
    many cryptos, including Bitcoin Cash, Litecoin, and Ethereum, and more are expected
    to be made available in the near future. The app has a simple interface, making
    it ideal for new wallet users, but their fees are higher than many others. Luno
    Wallet [https://www.luno.com/wallet/](https://www.luno.com/wallet/) Luno is a
    well-established company with physical offices worldwide. It is ideal for new
    users and requires nothing more than downloading the app and setting up your account.
    From there, you can purchase and trade crypto very quickly. Where Luno has a physical
    presence, you can simply head to a bank and pay funds into a local account. Because
    Luno is closely tied to some fiat currencies, it is a great choice for people
    who use online banking for their traditional accounts. Luno is both web and mobile-based,
    with the web access looking identical to the mobile app interface. They don''t
    have wide crypto support just yet, with just five for now - Bitcoin, Litecoin,
    Ethereum, Bitcoin Cash, and Ripple. Exodus https://www.exodus.com Daniel Castagnoli
    and JP Richardson founded Exodus in 2015. More than just a secure wallet, Exodus
    is trying to bill itself as a crypto wallet for the non-geeks, meaning anyone
    and everyone can use it easily. It claims to be intuitively designed and tries
    to simplify an otherwise complex topic. Exodus is classed as a hybrid wallet which
    means it has both a mobile and desktop format. It starts as a basic wallet, allowing
    you to extend it with the functionality you want using apps, i.e., you can join
    their rewards system, use live charts, and so on. The biggest downside is that
    the app system is relatively new and isn''t as comprehensive as many others we''ve
    listed. Trezor [https://trezor.io/](https://trezor.io/) Trezor is a hardware wallet
    produced by SatoshiLabs. Hardware wallets are classed as cold storage because
    they go online only when you connect them to the internet. Some say hardware wallets
    are for the paranoid but, in reality, they are a much securer way of keeping access
    to your cryptos safe. There are two types of Trezor hardware wallets, the Trezor
    One costing just under $80 and the Model T costing from $250. They both support
    multiple cryptocurrencies, including Zcash Litecoin, Bitcoin, Monero, and Dash.
    You only require two things to set the wallet up - a pin code and recovery seed. 
    Ledger [https://www.ledger.com/](https://www.ledger.com/) Ledger is a diverse
    company, with HQs spread worldwide, and they are one of the more successful companies
    to produce a hardware wallet. Again, there are two models to choose from, the
    Nano X starting at $179 and the Nano S, starting from $70. They are incredibly
    small devices, yet both contain the necessary hardware to support their respective
    apps. The Ledger devices support more than 1800 cryptocurrencies and work well
    with many other wallets. One feature that many people are not happy about is the
    addition of Bluetooth, given that it isn''t the most secure communication method.
    However, it is possible to disable it. The next chapter will delve into some of
    the more popular cryptocurrencies. '
