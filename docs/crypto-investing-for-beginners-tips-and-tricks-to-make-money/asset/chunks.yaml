- raw: "Long-Term Investing ![](image_rsrc1NY.jpg)While trading can be short or medium\
    \ term, investing tends to be mid to long-term. The idea behind it is to place\
    \ your money into one or more assets and leave it to earn interest or sell it\
    \ when the price is high. Long-term investors can plan for years ahead and grow\
    \ their savings in this way, but the cryptocurrency market does not make long-term\
    \ investing very easy. ![](image_rsrc1PE.jpg)With cryptos, long-term investing\
    \ means investing for at least a year, and it requires far more in-depth knowledge\
    \ than short-term trading. Because your investments should be held for a minimum\
    \ of a year, getting a high return involves a certain amount of risk. Those risks\
    \ are much higher in terms of cryptocurrency, partly because of an unfamiliar\
    \ and fairly new market. However, as time passes, it becomes better-known, and\
    \ some of the larger financial institutions are starting to take notice of it.\
    \ Long-term crypto investment is an excellent opportunity for traditional traders\
    \ who want some portfolio diversification. Long-Term Investing Explained Long-term\
    \ investment strategies typically seek profit by holding assets for a minimum\
    \ of a year but usually more than three. Let's say Company A has a large stake\
    \ in company B but doesn't have a majority of the voting shares. The stake purchase\
    \ cost should go on the balance sheet, and the short-term investments should go\
    \ on the profit/loss sheet. When long-term investments are sold, they would not\
    \ normally have any relation to the profit/loss but, instead, classed as another\
    \ type of comprehensive income. Here's a better example; We have a pair of sisters\
    \ - Belinda and Jane. Each of them has religiously saved $100 per month towards\
    \ their long-term investments. After 20 years, they each have $24,000 to invest\
    \ with an 8% annual return. Belinda began her investments when she was 36 and\
    \ Jane when she was 446. By the time Belinda reaches 56, she will have $131, 613\
    \ and Jane will have $59,295. In this example, the return is double the original\
    \ investment because Belinda started saving ten years before Jane. This shows\
    \ how long-term investments can benefit you far more than short-term ones because\
    \ of the interest accruing every year. When you hold a long-term investment in\
    \ the crypto market, it is called a HODL. This is an incorrectly spelled version\
