    # Long-Term Investing


    While trading can be short or medium term, investing tends to be mid to long-term.
    The idea behind it is to place your money into one or more assets and leave it
    to earn interest or sell it when the price is high. Long-term investors can plan
    for years ahead and grow their savings in this way, but the cryptocurrency market
    does not make long-term investing very easy.


    With cryptos, long-term investing means investing for at least a year, and it
    requires far more in-depth knowledge than short-term trading. Because your investments
    should be held for a minimum of a year, getting a high return involves a certain
    amount of risk. Those risks are much higher in terms of cryptocurrency, partly
    because of an unfamiliar and fairly new market. However, as time passes, it becomes
    better-known, and some of the larger financial institutions are starting to take
    notice of it. Long-term crypto investment is an excellent opportunity for traditional
    traders who want some portfolio diversification.


    ## Long-Term Investing Explained


    Long-term investment strategies typically seek profit by holding assets for a
    minimum of a year but usually more than three. Let''s say Company A has a large
    stake in company B but doesn''t have a majority of the voting shares. The stake
    purchase cost should go on the balance sheet, and the short-term investments should
    go on the profit/loss sheet. When long-term investments are sold, they would not
    normally have any relation to the profit/loss but, instead, classed as another
    type of comprehensive income.


    Here''s a better example; We have a pair of sisters - Belinda and Jane. Each of
    them has religiously saved $100 per month towards their long-term investments.
    After 20 years, they each have $24,000 to invest with an 8% annual return. Belinda
    began her investments when she was 36 and Jane when she was 446. By the time Belinda
    reaches 56, she will have $131, 613 and Jane will have $59,295. In this example,
    the return is double the original investment because Belinda started saving ten
    years before Jane. This shows how long-term investments can benefit you far more
    than short-term ones because of the interest accruing every year.


    When you hold a long-term investment in the crypto market, it is called a `HODL`.
    This is an incorrectly spelled version of the word `HOLD` and became popular after
    the misspelling was posted on Bitcointalk in 2013.


    ## Why Would You Invest Long-Term in a Volatile Market?


    Long-term investments are the most reliable method of maximizing a stable asset''s
    returns. Many traders who don''t know how to do proper technical analysis or have
    little to no knowledge of market behavior tend to rely on long-term investments.
    It does have a distinct advantage if not requiring daily, weekly, or monthly monitoring
    - it can simply be left until the time is right. Long-term investing is considered
    a good way of diversifying a portfolio using emerging markets, like cryptocurrencies,
    while having short-term investments in stocks and other traditional markets.


    ## Suitable Crypto Types for Long-Term Investment


    You can invest in the crypto market in two ways:


    *   `HODL`

    *   Active Trading


    When investors choose the first way, they typically purchase cryptos such as Bitcoin
    and hold them for a long period. They forget about the short-term market fluctuations
    and wait until the price is high enough to maximize profit. Not all cryptos are
    suitable for this type of investment, but some that got through the crypto crash
    in 2018 relatively unscathed are considered the best, given their apparent stability
    and acceptance by investors. Here are five that survived and are considered excellent
    choices for long-term investment:


    *   Bitcoin

    *   Ethereum

    *   Litecoin

    *   Monero

    *   XRP (formerly Ripple)


    Other cryptos worth long-term investments are those that yield dividends. When
    you invest for the long term, you don''t just have to choose cryptos that will
    hopefully rise in price; you can also choose those that pay dividends and hopefully
    rise as well. Some of the best are:


    *   Decred (DCR)

    *   Komodo (KMD)

    *   Navcoin (NAV)

    *   Neblio (NEL)

    *   Neo (NEO)

    *   PIVX (PIVX)

    *   Reddcoin (RDD)

    *   VeChain (VET)


    However, you must be aware that you need a systematic approach to investing in
    the crypto market, and you must have the right strategy to be successful.


    ## Investment Strategy


    No matter what we want in life, having a plan is critical to ensure success. Long-term
    investments are no exception to this. Your strategies must include an investment
    plan covering the following points:


    *   Your investment objectives

    *   How long you plan to hold your investments

    *   Tax implications

    *   Entry/exit plan


    Your strategy must be well-researched and effective, with a history showing it
    provides returns. With crypto investing, though, you need a little bit more, including
    some effective, exclusive strategies. One of the most effective is `HODL`, where
    investors only hold the asset. Another is called dollar-cost-averaging, where
    investors allocate the capital amount at regular intervals. This one is ideal
    for the smaller investors who struggle to get the capital they need in one hit.
    Success is entirely dependent on how you execute your trades and manage your risks.
    The maximum output requires the investors to provide a time for when they intend
    to pull the investment and their risk assessment. In short, a long-term investor
    must know the length of time they want the investment held and their own personal
    risk levels.


    ## How Much Does Long-Term Crypto Investment Cost?


    Long-term investments always work out cheaper than short-term trading, but there
    are some high costs to consider before you dive into the crypto market. Here are
    some of the costs you need to consider in your plan:


    *   **Expense Ratio** - this indicates the operating expenses, such as admin costs.
    To keep costs down, look for cryptos with low ratios.

    *   **Financial Advisory Fees** - this is how much you pay to the professionals
    involved in the trade. Cryptocurrency advisory companies provide rankings or guidance
    that can help you find the right opportunity for investing long-term.

    *   **Compound Interest** - if you use credit cards or loans to raise your capital,
    you must factor compound interest into your plan. If you stand to make less from
    the asset than the interest costs, it''s not worth investing in it.

    '
  trans: '

    # 长期投资


    虽然交易可以是短期或中期的，但投资往往倾向于中长期。其背后的理念是将资金投入一种或多种资产，并让其赚取利息，或在价格高时卖出。长期投资者可以提前数年规划，并以此方式增值储蓄，但加密货币市场并不使长期投资变得容易。


    对于加密货币而言，长期投资意味着至少投资一年，并且比短期交易需要更深入的知识。因为您的投资应至少持有一年，获得高回报涉及一定风险。就加密货币而言，这些风险要高得多，部分原因是这是一个陌生且相当新的市场。然而，随着时间的推移，它变得更为人所知，一些大型金融机构也开始关注它。对于希望进行投资组合多元化的传统交易者来说，长期加密货币投资是一个绝佳的机会。


    ## 长期投资详解


    长期投资策略通常通过持有资产至少一年（但通常超过三年）来寻求利润。假设公司 A 持有公司 B 的大量股份，但没有多数投票权股份。股份购买成本应计入资产负债表，而短期投资应计入损益表。当长期投资被出售时，通常与损益无关，而是被归类为另一种综合收益。


    这里有个更好的例子：我们有一对姐妹——贝琳达和简。她们每人都虔诚地每月存下 100 美元用于长期投资。20 年后，她们各自有 24,000 美元可供投资，年化收益率为
    8%。贝琳达在 36 岁开始投资，简在 46 岁开始。当贝琳达达到 56 岁时，她将拥有 131,613 美元，而简将拥有 59,295 美元。在这个例子中，收益是原始投资的两倍，因为贝琳达比简早十年开始储蓄。这表明，由于每年累积的利息，长期投资比短期投资能让您获益更多。


    当您在加密货币市场持有长期投资时，这被称为 `HODL`。这是单词 `HOLD` 的拼写错误版本，在 2013 年该拼写错误被发布在 Bitcointalk
    上后变得流行起来。


    ## 为什么要在波动市场中进行长期投资？


    长期投资是最大化稳定资产回报的最可靠方法。许多不知道如何进行适当技术分析、或对市场行为知之甚少的交易者，倾向于依赖长期投资。如果不需要每日、每周或每月监控，它确实有一个独特的优势——它可以简单地被搁置，直到时机成熟。长期投资被认为是利用新兴市场（如加密货币）进行投资组合多元化的好方法，同时在股票和其他传统市场进行短期投资。


    ## 适合长期投资的加密货币类型


    您可以通过两种方式投资加密货币市场：


    *   `HODL`

    *   主动交易


    当投资者选择第一种方式时，他们通常会购买比特币等加密货币并长期持有。他们忽略短期市场波动，等待价格足够高以实现利润最大化。并非所有加密货币都适合这种投资类型，但一些在
    2018 年加密货币崩盘中相对安然无恙的货币，因其明显的稳定性和投资者的认可，被认为是最佳选择。以下是五种幸存下来并被认为是长期投资绝佳选择的货币：


    *   比特币

    *   以太坊

    *   莱特币

    *   门罗币

    *   XRP（前身为瑞波币）


    其他值得长期投资的加密货币是那些产生股息的货币。当您进行长期投资时，不仅要选择那些希望价格上涨的加密货币，还可以选择那些支付股息且希望价格也上涨的货币。其中一些最好的包括：


    *   Decred (DCR)

    *   Komodo (KMD)

    *   Navcoin (NAV)

    *   Neblio (NEL)

    *   Neo (NEO)

    *   PIVX (PIVX)

    *   Reddcoin (RDD)

    *   VeChain (VET)


    然而，您必须意识到，投资加密货币市场需要系统的方法，并且必须拥有正确的策略才能成功。


    ## 投资策略


    无论我们在生活中想要什么，制定计划对于确保成功至关重要。长期投资也不例外。您的策略必须包含涵盖以下要点的投资计划：


    *   您的投资目标

    *   您计划持有投资的时间

    *   税务影响

    *   入场/出场计划


    您的策略必须经过充分研究且有效，并有提供回报的历史记录。不过，对于加密货币投资，您还需要更多内容，包括一些有效的独家策略。其中最有效的是 `HODL`，即投资者仅持有资产。另一种称为定投（dollar-cost-averaging），即投资者定期分配资金金额。这对于难以一次性筹集所需资金的小额投资者来说是理想选择。成功完全取决于您如何执行交易和管理风险。最大产出要求投资者提供打算撤资的时间及其风险评估。简而言之，长期投资者必须知道他们想持有投资的时间长度以及他们个人的风险承受水平。


    ## 长期加密货币投资需要多少成本？


    长期投资总比短期交易便宜，但在您涉足加密货币市场之前，仍有一些高昂成本需要考虑。以下是您计划中需要考虑的一些成本：


    *   **费用比率** - 这代表运营费用，如管理成本。为了降低成本，请寻找费用比率低的加密货币。

    *   **财务顾问费** - 这是您支付给交易中涉及的专业人士的费用。加密货币顾问公司提供排名或指导，可以帮助您找到适合长期投资的机会。

    *   **复利** - 如果您使用信用卡或贷款筹集资金，必须将复利纳入您的计划。如果您从资产中获得的收益少于利息成本，则不值得投资。


    '
