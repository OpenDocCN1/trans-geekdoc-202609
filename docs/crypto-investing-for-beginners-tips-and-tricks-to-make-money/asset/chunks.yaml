    people opting to invest in digital assets rather than traditional stocks. In 2018,
    the cryptocurrency bubble burst with a bang, and late investors who paid high
    prices for their investments were left holding empty wallets. That led to new
    investors calling the whole thing a scam and heading back to traditional investments
    or ditching their investment strategy altogether. However, although this was a
    setback, the cryptocurrency market continued to evolve and stabilize, which is
    when some of the largest financial institutions in the world started to pay attention.
    As more cryptocurrency was sold, the numbers of traders accepting them as a payment
    form also rose and that, my friends, is how and why the cryptocurrency market
    flourishes today.


    These cryptocurrencies are based on blockchain technology, a new type of disruptive
    technology that is argued to be far bigger than when the Internet was invented.
    Blockchain is for far more than just cryptocurrencies these days, in the same
    way that the Internet is about far more than just sending emails. The process
    of trading and investing in cryptocurrency is similar in many ways to traditional
    trading and investing. However, it is also unique because cryptos are a cross
    between a currency, such as the Euro, U.S. dollar, or British pound, and an asset,
    such as company stocks. This type of investing really differs in how a cryptocurrency''s
    fundamentals are analyzed. Traditional value measurement methods don''t work because,
    most of the time, the crypto data is not centralized. The primary idea behind
    blockchain technology is that they and their cryptocurrencies are decentralized,
    so no intermediaries play a part in any transaction. Instead, a network of members
    is given control of the blockchain.


    That gives you a rough idea of what this book is about. In writing this book,
    I assume that you have at least heard of cryptocurrency and may even have taken
    the step of buying some. But do you know how they work? Do you know how to make
    money from investing? Even if you currently invest in the stock market or other
    markets, it doesn''t necessarily mean that you can step straight into crypto trading.
    I''m sure you own a computer and know how to use the Internet, but before you
    can even consider crypto trading, you need to ensure that you have high-speed
    internet access – you''ll need it if you don''t want to lose out in trading! Other
    than that, all you will need to dip your feet into investing and trading with
    digital assets and cryptocurrency is this book so let''s get started.


    # Chapter 1 What Is Cryptocurrency?


    Unless you are in the know, you are probably wondering what a cryptocurrency is.
    Sure, you''ve heard of Bitcoin – who hasn''t? You''d likely heard of Ethereum,
    Litecoin, Ripple, and others but aren''t sure what they are.


    In simple terms, cryptocurrency is digital money. Traditional currency, like the
    Euro or U.S dollar, can be digitally transferred, but that''s completely different
    from digital money. Right now, you can use Bitcoin to pay for some goods and services
    in the same way you use traditional money to make electronic payments. In time,
    cryptocurrencies will become more mainstream, and more places will accept them.


    Cryptocurrency really differs from traditional cash in the technology it is built
    on. Most people are only concerned with the cash they have, not the technology
    behind it, but traditional systems have more than their fair share of problems.
    These include:


    *   Wire transfers, credit cards, and other payment systems are outdated

    *   Intermediaries cause transactions to be slow and expensive

    *   Global equality in the financial world is fast-growing

    *   3 billion people do not have access to financial services


    The idea behind cryptocurrency is to solve these problems and many more.


    ## Cryptocurrencies


    The money you currently use is backed by the government and held in banks. You
    need an ATM or internet banking to transfer money to others or get some for yourself.
    Cryptocurrencies aim to do away with all this by relying on blockchain technology.
    Blockchain is decentralized, so there are no intermediaries, and no one person
    is in control. Instead, a network of computers confirms every transaction but
    more about how the blockchain works in a later chapter. First, let''s learn more
    about cryptocurrencies.


    ## What Is Money?


    For money to be considered valuable, it needs to demonstrate the following:


    *   Enough people have money

    *   It must be accepted as a payment form

    *   It must be trusted by society as valuable now and will remain so


    In early times, actual coins and banknotes didn''t exist, and people used to trade
    or barter items. However, when real money came about – those banknotes and coins,
    even credit cards we rely on today – it brought about real changes in the trust
    model. Transaction ease is also a major factor, and one of the primary reasons
    for money being invented was the logistical difficulty in transferring gold bars
    being countries. Credit cards followed, but these are also based around government-backed
    currency, known as fiat money. The more interconnected the world becomes the more
    concern there is about authorities in control and whether they have our interests
    in mind. Because of that, cryptocurrencies are set to provide a viable alternative.


    ## A Brief History of Cryptocurrency


    We all know that Bitcoin was the first cryptocurrency, created after Satoshi Nakamoto,
    who remains anonymous to this day, released a white paper in 2008 detailing a
    "peer-to-peer version of electronic money." Since then, many other cryptocurrencies
    have been created, some successful, some not. Bitcoin and other cryptocurrencies
    are created in one way only – mining. However, rather than the conventional methods
    of mining precious metals, ores, and gems, cryptocurrency mining is done by powerful
    computers solving mathematical riddles. We''ll talk in more depth about mining
    later in the book. In 2011, some people began to notice that Bitcoin was flawed.
    That led to the creation of altcoins to make Bitcoin''s design better – they were
    faster, more secure, and anonymous, among other things. Litecoin was the first
    altcoin, but many thousands more have been created since then, and right now,
    we have thousands to choose from. Later, I''ll introduce you to some of the most
    popular.


    ## Cryptocurrency Benefits


    These are some of the solutions cryptocurrencies aim to solve by being decentralized:


    ### 1. Easier Transactions


    Cryptocurrency transactions are cheaper, easier, and more secure than traditional
    ones. You can use a phone app, crypto, or exchange wallet to send and receive
    crypto, and you can even buy some at Bitcoin ATMs, which can then be transferred
    to your phone app or crypto wallet without needing a bank account.


    ### 2. More Secure


    Cryptocurrencies are heavily based on blockchain and cryptographic technology,
    ensuring they are more secure. The security is based largely on hash rate – the
    higher it is, the more computer power is needed for the network to be compromised.
    Bitcoin has the highest hash rate of all cryptocurrencies. The only real way to
    lose access to your stored cryptocurrency is to lose your private key, or it is
    stolen – more about keys later.


