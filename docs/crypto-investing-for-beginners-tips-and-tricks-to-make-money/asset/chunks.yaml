    # 第 7 章：不同的加密货币


    2009 年，第一种数字货币比特币在万众瞩目中发布。当时，它几乎没有竞争对手，一统天下，但这种情况很快就会改变。到 2011 年，随着底层技术——区块链——的采用开始增加，其他加密货币开始涌现。如今，我们有数千种加密货币可供选择，每一种都提供自己独特的功能和特性。然而，它们大多数都是建立在与比特币相同的原则之上的：


    *   没有任何加密货币受到银行、政府或任何其他中央机构的监管、发行或担保。

    *   它们都是在区块链上创建并通过 P2P 审核的。

    *   许多加密货币通过密码学进行加密。

    *   加密货币被视为资产，通常存储在加密钱包中，钱包可以是硬件或软件。这些钱包允许加密货币所有者管理他们的币并进行交易。


    截至目前，有 6,000 到 10,000 种不同的币可供交易，总市值达 2 万亿美元。


    ## 加密货币的不同类型


    加密货币通常分为两类：


    *   **币**，如比特币和山寨币。

    *   **代币**，平台区块链上的可编程资产。


    这三个词——加密货币、代币、币——经常混用，但你应该了解它们之间的区别，以便理解加密货币。任何不是比特币的区块链货币都是山寨币——稍后会详细介绍。


    ### 币 vs. 代币


    代币和币都是加密货币的形式，但它们的运作方式不同。加密货币币是内置在其区块链中的一种货币形式。例如，`BTC`（比特币）构建于比特币区块链上，而 `ETH`（以太坊）构建于以太坊区块链上。代币也是构建在区块链上的，但它们不是货币。它们是可编程资产，允许用户创建智能合约并执行它们。智能合约用于确立区块链网络之外特定资产的所有权。代币也用于代表某种价值，如货币、电力、数字资产等，并且可以被接收和发送。例如，`BAT`（基本关注代币）是一种用于数字广告的以太坊代币。


    ### 山寨币


    山寨币是“比特币替代品”的简称，是指除比特币以外的任何数字货币。大多数山寨币的创建是为了改进比特币的某些方面，例如包括以太坊、莱特币、USDC、Namecoin
    和 Peercoin。比特币有硬性上限，这意味着流通中的币数量是固定的，其他加密货币也是如此。这确保了需求和感知价值的上升。如今的大多数山寨币共享比特币构建时的基本框架，以及比特币的一些特性。然而，它们都提供了一些不同的东西。有些做着与比特币相同的事情，生成交易区块并验证它们，但它们有不同的流程来完成。其他的则提供全新的功能，例如智能合约。


    ### 代币


    通常，代币是通过 `ICO`（首次代币发行）创建和分发的，这类似于传统的股票发行。代币可以通过以下方式表示：


    *   作为价值代币，如比特币。

    *   作为证券代币，这很像股票。

    *   作为实用代币，用于特定用例。


    所有代币都代表某种价值描述，但它们本身并没有价值。同样，你钱包里的纸质美元可能并不值它面值所说的那么多。然而，代币可以用于在不同事物中进行交易。代币与币的主要区别在于，代币是构建在已为数字货币（如以太坊或比特币）存在的区块链之上的。


    ## 市值排名前 12 位的常见加密货币


    现在来看一些按市值排名较受欢迎的加密货币。市值是在拥挤的市场中识别高价值加密货币的最佳方式之一。


    > **注意** - 价格在撰写时是正确的，但会定期变动。


    ### 1. 比特币 (BTC)


    *   **当前价格** - $39,000

    *   **市值** - $7410 亿


    作为我们今天所知所有加密货币的先驱，比特币仍然是人们提到数字货币时谈论最多的那一个。它于 2009 年诞生，自那以后，它的历程一直是急剧上涨和急剧下跌。2017
    年，当人们开始关注并投资它时，它突然变得更加流行。


    ### 2. 以太坊 (ETH)


    *   **当前价格** - $2584

    *   **市值** - $3100 亿


    以太坊是一个加密货币平台，是加密货币世界中第二大知名的名字。平台上使用的货币是 `ETH`（以太币），你可以用它执行不同的功能。然而，使以太坊如此受欢迎的是它的智能合约功能。


    ### 3. 泰达币 (USDT)


    *   **当前价格** - $1

    *   **市值** - $800 亿


    泰达币被归类为稳定币，其价格将始终为每币 1 美元。所有稳定币都与资产价值挂钩，对于泰达币来说，该资产是美元。交易者在不同加密货币之间转换时，倾向于使用泰达币作为媒介；他们不需要将一种加密货币换回美元再购买另一种，而是使用泰达币稳定币。然而，有人担心泰达币并没有由储备美元安全担保，而是似乎使用了短期无担保债务。


    ### 4. 币安币 (BNB)


    *   **当前价格** - $368

    *   **市值** - $620 亿


    `BNB` 是币安的加密货币币，来自全球最大的加密货币交易所之一。最初，它被创建为一种代币，旨在作为一种支付形式用于享受交易折扣，但现在它可用于购买服务和商品以及进行支付。


    ### 5. USDC (USDC)


    *   **当前价格** - $1

    *   **市值** - $520 亿


    另一种稳定币 `USDC` 与美元挂钩，意味着其价值应保持稳定。其创始人称该币拥有完全储备资产作为支持，这些资产具有等值的公允价值，存储在美国境内受监管的机构中。


    ### 6. 瑞波币 (XRP)


    *   **当前价格** - $0.73

    *   **市值** - $340 亿


    创建于 2012 年，XRP 过去被称为瑞波。它提供了一种以多种现实世界货币进行支付的方式，并在跨境支付中很受欢迎。支付通过无信任机制进行。


    ### 7. Terra (LUNA)


    *   **当前价格** - $102

    *   **市值** - $340 亿


    Terra 平台使用 `LUNA` 货币来支持基于欧元、美元和其他法定货币的稳定币。Terra 确保稳定币价格稳定，并提供对智能合约的支持。


    ### 8. Solana (SOL)


    *   **当前价格** - $82

    *   **市值** - $260 亿


    Solana 相对较新，仅于 2020 年推出。其最大的特点是其交易速度和其网络规模平台的稳健性。`SOL` 硬性上限为 4.8 亿枚。


    ### 9. 卡尔达诺 (ADA)


    *   **当前价格** - $0.80

    *   **市值** - $250 亿


    卡尔达诺平台使用 `ADA` 加密货币，由查尔斯·霍斯金森创立，他是以太坊的联合创始人之一。卡尔达诺使用智能合约来帮助管理数字身份。


    ### 10. Avalanche (AVAX)


    *   **当前价格** - $72

    *   **市值** - $190 亿


    Avalanche 是最快且低成本的基于智能合约的平台之一。其重点主要在于构建 `DApps` 并帮助开发者构建他们自己的定制区块链。交易可以通过平台代币
    `AVAX` 进行处理。


    ### 11. 币安美元 (BUSD)


    *   **当前价格** - $1

    *   **市值** - $180 亿


    另一种由美元支持的稳定币，币安美元来自币安交易所与 Paxos 的合作伙伴关系。`BUSD` 于 2019 年推出，完全受 `NYDFS`（纽约州金融服务部）监管，并运行在以太坊的区块链上。


    ### 12. 狗狗币 (DOGE)


