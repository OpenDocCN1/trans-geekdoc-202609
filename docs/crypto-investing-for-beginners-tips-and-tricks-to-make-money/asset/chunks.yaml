    # Chapter 2: Advantages and Disadvantages


    Cryptocurrencies have been increasing in importance in the last few years, not
    surprising given their potential to disrupt the current financial world in a big
    way. In fact, it may even make us question everything we know about the current
    financial infrastructure, particularly in terms of security and privacy.


    Most would-be investors want to know the advantages of cryptocurrency, but it''s
    also important to know the disadvantages. That way, you can make a fair and informed
    decision.


    ## Advantages


    Cryptocurrencies are relatively new, but there is nothing to suggest they will
    fail. On the contrary, their popularity continues to increase, not least because
    of the benefits they offer. Cryptocurrencies have loads to offer, from the potential
    of decent returns to being able to trade all day, every day, on a highly secure
    platform. These are the main advantages:


    ### High Risk, High Rewards


    There are thousands of cryptocurrencies available for trading, each with its own
    features and quirks. However, they all share some common traits – for example,
    they can all experience sudden spikes and sharp drops in value. Cryptocurrency
    values are mostly driven by supply and demand, resulting in significant returns.
    For example, Ethereum doubled its price between July and December 2021 – great
    returns for anyone who invested when the price was low.


    ### Secure Underlying Technology


    One of the biggest benefits is linked to the supporting infrastructure rather
    than the cryptocurrencies. The blockchain is a decentralized distributed ledger
    where every transaction is publicly tracked. Once a transaction is entered onto
    the blockchain, it can’t be removed. And because thousands of computers store
    the same blockchain, there is no way a hacker can access it and change transactions
    or steal currencies. In that way, all transactions are completely safe.


    ### More Transparent System


    The current financial system has central authorities and intermediaries responsible
    for processing transactions. Whenever a transaction is made, you trust the authority
    or intermediaries to ensure it goes through. When the 2008 recession hit, many
    people wondered if the trust wasn’t, perhaps, misplaced. With cryptocurrencies
    and blockchain technology, we have a viable alternative. Anyone on the network
    can see all transactions – and most blockchains have thousands of people on them
    – allowing you to participate in the financial markets without needing that intermediary
    or central authority.


    ### You Can Trade 24/7


    Another huge advantage is that the cryptocurrency markets don’t close, whereas
    banks and traditional stock markets do. Coins are being mined 24/7, and transactions
    are constantly recorded, so there’s no need to wait for the exchanges to open
    to start buying, selling, and trading in cryptocurrency. This has had a huge impact,
    so much so that the stock exchanges are now thinking about trading outside of
    banking hours, although we may be waiting a while for that to happen. Of course,
    the fact that you can trade 24/7 also means that no matter where you are in the
    world, you can start generating returns regardless of the time of day – or night.


    ### Potential to Beat Inflation


    Because cryptocurrencies are not tied to an economy or other currency, their value
    reflects demand rather than inflation. However, many potential investors are also
    concerned about cryptocurrency inflation, but you don’t have to worry about that.
    Because each cryptocurrency caps the number of coins in circulation, the available
    amount can never get out of hand, which means there is no potential for inflation.
    Bitcoin has a hard cap, which means no more than 21 million will be created, while
    Ethereum has an annual cap of 18 million ETH (Ether). Whether a currency is hard
    or annually capped, inflation is kept away.


    ### Fast Transactions


    Sending payments via cryptocurrency is much faster than traditional payment systems.
    For example, if you send money to the U.S, a traditional institution will take
    up to five days to process it, while wire transfers take 24 hours or more and
    stock trades take three days. With cryptocurrency, the transaction can be settled
    in minutes. When the block containing your specific transaction is added to the
    blockchain, the funds are made available, and the transaction settled.


    ### Lower Transaction Fees


    Transaction costs are typically much lower with cryptocurrency than with traditional
    financial services. For example, a wire transfer could cost $20 to $40, and if
    you need to send money internationally, that cost can rise considerably. While
    there may be occasions when cryptocurrency fees are slightly higher than usual,
    typically due to the level of demand on the blockchain, they are still much lower
    than the fees charged for wire transfers.


    ### Cryptocurrency Is More Accessible


    Around three billion people are currently underbanked or cut off from banking.
    Some of this is a personal choice due to living in a country where the government
    and financial institutions are corrupt. However, cryptocurrency is accessible
    by anyone with a computer or smartphone. It’s easy to set up a cryptocurrency
    wallet faster than opening a bank account, and you don’t need to verify your ID
    or go through credit checks. Cryptocurrency provides the unbanked and underbanked
    a way of using financial services without needing to get past central authorities
    first. Not everyone wants a bank account, mostly because they don’t trust them
    to look after their money, and cryptocurrency ensures your money is safe and you
    can easily send it where it needs to go.


    ### More Security


    Crypto wallets provide you with a public and private key. The public key is just
    that – public – but your private key is what allows you to unlock your wallet.
    If you lose your key, forget it, or someone steals it, they can access your funds,
    and there is no recourse. Keep it safe, and your money is much safer than in a
    traditional bank account. The blockchain also secures transactions by its decentralized
    nature and the fact that transactions need to be verified by the entire network.
    The more nodes (computers) added to the network, the more secure each transaction
    is. Lastly, for the network to be hacked, a significant amount of computing power
    would be required to ensure multiple fraudulent blocks are verified before the
    remainder of the network could verify the accuracy. That kind of power would be
    too expensive in most cases, thus limiting the risk. You''ve no doubt heard of
    hacked accounts, but this is mostly down to insufficient exchange security. This
    is why you should store your cryptocurrency in a secure wallet, not on an exchange.


    ### Better Privacy


    Because there is no requirement to have a bank account to do cryptocurrency transactions,
    your privacy is secure. Transactions may be linked to a public identifier, which
    is your wallet address, but they do not give out any personal information.


    ### More Transparency


    Because every transaction is done on a public, distributed ledger, everyone can
    see the data; they know how much currency was sent, when and from where, and they
    can also see how much is in a given wallet. This ensures fraudulent transactions
    are all but eliminated. Plus, crypto owners can prove they have the currency before
    a transaction is allowed to go through, thus removing the chance of double-spending.


    ## Disadvantages


    So, there are plenty of advantages as you can see but what about the disadvantages?
    Surely, it’s not all gold and glitter? You’re right; it isn’t, so let’s see the
    disadvantages:


    ### Cryptocurrency Isn’t Easy to Understand


    It can take time and no small amount of effort to understand cryptocurrencies,
    especially if you are not a digital whizzkid. And when you try to invest money
    in what you don’t understand, you are taking a huge risk, one that likely won''t
    pay off. This book will help you understand cryptocurrencies, and there are plenty
    of resources online that will help. However, most important is to put time into
    understanding cryptocurrency fully, including all its pros and cons.


    ### They Are Extremely Volatile


    We’ve all seen the price of Bitcoin spike incredibly high – in October 2021, it
    crossed the $60,000 mark, which was great for those who invested at the right
    time. However, by January 2022, the price had plummeted to just over $37,000,
    which happens all the time in cryptocurrency. Significant drops usually follow
    significant spikes, so cryptocurrency may not be your best bet if you are looking
    for a safe investment and a quick return. The cryptocurrency market is highly
    speculative, and because it is much smaller than traditional non-digital markets,
    it is far more vulnerable to fluctuations. In turn, that can destroy a coin’s
    value, which is one of the biggest disadvantages of this modern marvel.


    ### They Are Unproven as Long-Term Investments


    Cryptocurrencies may be popular, but they have only existed for about 12 years.
    That is not long enough to determine their worth as a long-term investment. In
    contrast, the stock market boasts a history going back centuries – the London
    Stock Exchange has been around since 1801 – and gold has a long investment history
    too. No one can tell what will happen with cryptocurrencies in the future, and
    it’s a brave person who heads off into uncharted waters.


    ### There Are Issues with Scalability


    No one would blame you for thinking that digital currencies are fast and, to a
    certain extent, they are. However, at some point, they hit problems that stop
    them from large-scale rollout. The providers have never shied away from admitting
    this, and those behind the Ethereum platform say that the blockchain has limitations
    in capacity, slowing the transaction processing rate. This is nothing short of
    frustrating for those involved in the transactions, and it also has the potential
    to result in financial losses.


    ### Those New to Cryptocurrency May Run into Security Issues


    While cryptos don’t come with the same risk as centralized institutions, they
    are not without problems, especially for new investors. If you lose your private
    key, or it gets stolen, you lose access to all your stored cryptocurrency, and
    there is no way back from that. A private key is not the same as a traditional
    password that you can recover or change if you can’t remember it – if you forget
    it, you can’t get another one. You can also lose your virtual wallet or accidentally
    delete your holdings – again, there is no way back from this. On top of that,
    you have to deal with malicious attempts to get your cryptocurrency, and new investors
    are more vulnerable because they don’t know what to look out for.


    ### No Centralized Authority or Regulation


    While this is a major advantage, some see it as a disadvantage. The FCA (Financial
    Conduct Authority) doesn’t regulate cryptocurrency, so nothing is in place to
    protect your money. Mostly, the banks, governments, and other financial institutions
    see decentralization as a disadvantage because they no longer have control. Cryptocurrency
    is kept secure by its decentralized nature, anonymity, and strong cryptographic
    encryption, making it almost impossible for governments to know who is using it.
    While this is great for the individual, the lack of regulation makes money laundering
    and criminal activity easier.


    ### No Refunds


    Perhaps the biggest drawback is the fact that you cannot get your money back.
    If you pay the wrong person by mistake, it’s tough – your money is gone. Sadly,
    cryptocurrencies have gained a reputation, primarily because of the get-rich-quick
    stories surrounding Bitcoin, which attracts scammers. Because you can’t get your
    money back, scammers can steal it with no recourse.


    ## The Best Cryptocurrency


    It’s impossible to say which cryptocurrency is the best to invest in because it
    is a personal choice. However, there are certain things you should look out for:

    '
