    # IRS Notice 2014-2021 and Crypto Mining Taxation


    In the first case, Notice 2014-2021 has been issued by the IRS to address the
    tax issues surrounding crypto mining. According to the notice, miners must declare
    an amount of gross income for each crypto reward they get; that amount must be
    a fair indication of the coin or token value at the time of receipt. If the mining
    is considered part of a business, the tokens or coins are treated as self-employment
    income and are subject to the relevant taxes. Similarly, if the miner works for
    someone else, their crypto payments are seen as wages and are subject to income
    tax laws, withholding unemployment taxes, Medicare, and social security.


    ## Is Mining Legal?


    Right now, few laws govern cryptos, so, in most countries, it is not clear whether
    mining is legal or not. Under the FinCEN (Financial Crimes Enforcement Network),
    miners are classed as "money transmitters," meaning the laws governing that activity
    may apply to them. For example, cryptocurrency mining is seen as a business in
    Israel and comes under corporate income tax laws. Elsewhere, there is a lot of
    regulatory uncertainty, although some countries, such as the USA and Canada, appear
    to be okay with it. However, other than a few jurisdictions that have made crypto-related
    activities illegal, few countries stop people from mining.


    ## Is Cryptocurrency Mining Sustainable?


    Most cryptocurrency miners have plenty of curiosity and a desire to learn, two
    things that are a must for anyone thinking of joining in. New technologies are
    constantly emerging, and the mining arena is always changing. The miners who get
    the best rewards are those who study and optimize their methods and strategies
    to improve continually. However, some advocates for climate change have voiced
    concerns about the level of fossil fuels crypto mining burns through. Concerns
    like these have led some communities, like Ethereum, to move from a Proof-of-Work
    framework to something more sustainable, such as Proof-of-Stake.


    I haven’t gone into too much detail on mining. For most people considering investing
    in cryptocurrencies, the easiest route is to buy and sell rather than spend thousands
    on setting up a rig where the rewards may be little. To be fair, the only people
    who are really benefiting from mining are those who did it in the early days of
    Bitcoin when the prices were low. The next chapter will dive into some strategies
    for short-term trading.


    # Chapter 9: Strategies for Short-Term Trading


    Investing in cryptocurrencies is a high-risk endeavor, perhaps more so than traditional
    trading. Cryptos are digital assets, a new asset class with a short history, and
    anyone thinking of investing must be aware that their investments can disappear
    quickly.


    As an investor, you should take time to familiarize yourself with the rules and
    regulations surrounding tax and cryptocurrency profits. If you choose the most
    popular short-term strategy, day-trading, crypto sales are subject to short-term
    capital gains tax. Before we look at some strategies, here are some of the pros
    and cons of trading in cryptocurrency:


    ## Pros


    *   If you have access to a crypto exchange, you can freely trade in cryptocurrency.
    Besides verifying who you are and putting money in your account, short-term traders
    have few barriers to their market access. If you want to own Bitcoin but can''t
    afford the current price, you can buy and sell fractions of it.

    *   Crypto markets work 24/7, 365 days a year. There are no limits to buying and
    selling, and you can trade whenever you want to.

    *   Cryptos and blockchain technology are both decentralized, ensuring anonymity
    and no intermediary fees, keeping the cost of transactions low.


    ## Cons


    *   The ease with which you can start trading means it is also easy for newbies
    to lose big money as easily as they can gain big profits.

    *   The market being open 24/7 isn''t always a good thing. It means there are
    few trading patterns to follow, especially if you choose day-trading. You may
    find yourself watching things for much longer than you would in the traditional
    markets to ensure you execute your trade at the right time. Trends are not so
    easy to spot, and a quick session can turn into an all-nighter.

    *   Although FinCEN and other government watchdogs are gradually increasing anti-money
    laundering and KYC requirements, the crypto space is largely unregulated. That
    lack of regulation means that traders and exchanges have no protection from hackers
    and scammers. If your chosen exchange is subject to an attack, unless they have
    insurance (highly unlikely), your funds are likely gone for good.

    *   You are also at risk of wash-sales or pump-and-dump schemes. These happen
    when people pump the price of a cryptocurrency up artificially in a bid to pull
    in traders. When the traders earn their profits, they dump the crypto, and the
    price falls fast.


    ## Let''s Look at Some of the Best Strategies to Get You Started in Short-Term
    Trading


    ### Choose Your Platform


    While it may be tempting to act like a kid in a sweet shop where crypto trading
    is concerned, you must take your time and choose the right platform to trade on.
    Remember that if you are based in the USA, you are limited to domestically regulated
    platforms. Several factors will determine the platform you choose - asset and
    exchange liquidity, fees, etc. - you also need to consider volatility because
    crypt values can spiral up and down without warning. If you are in it for a quick
    profit, you must be in a position to move fast when needed. What doesn''t help
    is that there are so many differences between the crypto exchanges, so here are
    the most important things you need to consider:


    *   **How Long the Exchange Has Been Active** - the longer it has operated, the
    more chance it has of being reliable, stable, and credible.

    *   **The Cryptos Supported** - this is one of the most valuable tools to a trader;
    there is little point in joining an exchange only to find that you have no interest
    in the supported cryptos or it only offers limited support.

    *   **The Fees** - these are charged for each trade and are how the exchange earns
    their money. The fee structures between exchanges will vary - some don''t charge
    any fees for trades of more than $10,000, for example, as an incentive for traders
    interested in large-scale trades.

    *   **Their Deposit Methods** - you need to get money into your exchange account,
    so the payment methods offered are important. Some will accept wires and bank
    transfers, but only a few will allow you to fund your account with a credit card,
    gift card, or PayPal.

    *   **Reviews** - look on the crypt communities to find reviews and feedback on
    exchanges. Most users on these forums will provide honest feedback, be it negative
    or positive.

    *   **Exchange Liquidity** - this covers the ease and speed with which an exchange
    converts assets with no price effect. The best exchanges have high liquidity,
    meaning they can buy and sell immediately with no discernible difference between
    the bid and asking price.


    ### Choose Your Investments


    The exchange is just the first step. Next, you need to decide what you want to
    invest in. If you opt for day-trading, keep volatility in mind - where a market
    condition could put buy-and-hold (long-term) investors off, it could be just what
    a day trader needs to grab a decent profit. New traders are advised to invest
    in the biggest coins or tokens, but this doesn''t always pan out. Critically,
    you need to research what''s available against how much you want to invest and
    determine if it''s worth the risk. You can only do that through careful research
    of a specific coin or token, how it has behaved in the past and what it''s doing
    now. Consider the following when deciding what cryptocurrency to invest in:

