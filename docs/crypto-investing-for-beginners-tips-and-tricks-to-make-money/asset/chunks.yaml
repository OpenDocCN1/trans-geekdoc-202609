    # If you are new to investing


    If you are new to investing, not just in cryptocurrency but in anything, you will
    likely find things somewhat overwhelming. It isn''t always easy to find the right
    investment strategy while educating yourself about the crypto sector, so starting
    with foreign exchange or stocks might be best. Once you are comfortable with the
    ins and outs of investing, then you could consider moving into cryptocurrencies
    and growing your portfolio. Forex trading is often the easiest way to start—trading
    one currency for another, i.e., US dollar for Euro or Japanese Yen.


    ## 10. Make Sure You Have a Support Group


    Most people sit at their computers or phones and trade by themselves, but that''s
    quite lonely, especially when you don''t know anyone else who is doing it. You
    don''t have anyone to talk to, and things can get frustrating, especially when
    everything seems to be against you. Sometimes, you need someone else to tell you
    when to get out of the market. Technical analysis and thorough research can help
    you identify entry and exit points, but it can all be a bit too much when you
    are new to investing. Getting together with others in the same boat as you can
    be very helpful, and there are plenty of forums like Reddit and Telegram channels
    where you can connect with other investors and help each other out. You will also
    find a lot of expert traders on these channels, and they can often point you in
    the right direction. These forums are also useful for helping you find the right
    assets to invest in, finding out about exchanges, and others may even ask questions
    you never even considered—all useful stuff. In fact, I would recommend you join
    these forums before you start investing, just to get an idea of what help is available
    and get advice from those in the know.


    # Chapter 15 Challenges and Opportunities


    Our final chapter introduces you to some of the challenges and opportunities cryptocurrency
    investing can put your way. There is a good reason why I have put these together,
    and that is simply because an obstacle doesn''t always have to be a bad thing—treat
    it right, and it could become an opportunity that leads to profit.


    ## 1. New Cryptocurrencies


    The world''s first cryptocurrency, Bitcoin, is now nearly 24 years old, but while
    it is still the most popular one, plenty of alternatives are available. Good or
    bad, new cryptos are appearing with more and more regularity these days, and that
    isn''t going to change anytime soon. Granted, many of them will fade away to nothing
    and never be seen again, but a handful are likely to go somewhere, and a few may
    even get somewhere near Bitcoin and Ethereum. There could even be one right now,
    waiting to be developed, that could take the world by surprise and displace Bitcoin
    from the number one spot. You can see this as a challenge and an opportunity.
    Cryptocurrency investing requires you to keep an open mind and draw up your vision
    for the future. You need to be able to see through the new cryptos and choose
    those with promising potential, and you can''t do that if you are stuck on only
    the big cryptos.


    ## 2. Find the Economic Data


    This is seen as an industry-wide challenge because, although plenty of organizations
    are dedicated to crypto news, it isn''t easy to find the real economic data driving
    the crypto market. The industry''s economic system has not been developed, which
    means the media appears to have free reign in creating greed, fear, and hysteria
    out of nothing and have nothing solid to back up their claims. You want to steer
    clear of traps like these, so don''t follow a single crypto news organization.
    Instead, follow several but take everything you read with a pinch of salt. And,
    as I said earlier in this book, if you hear or read something about a particular
    crypto, find several other sources that back it up before you take it as gospel.


    ## 3. Market Regulations


    Right now, regulations surrounding cryptocurrency are very new. Although some
    countries have made large strides ahead, giving their residents good opportunities
    to get into the market, others haven''t. Don''t expect things to happen overnight;
    these things take time. Regulation (or a lack of it) is one of the biggest industry
    concerns, but it can work in your favor by allowing you to get in when the crypto
    is at a low price. As more crypto regulation comes in worldwide, those prices
    are likely to rise, especially when governments and banks accept it as an official
    financial instrument.


    ## 4. Hackers


    While most people see hacking as a major challenge, you can see it as an opportunity
    too. Sure, if you get hacked and lose your crypto, it''s a massive challenge,
    but you can take steps to protect yourself from this, i.e., choosing the right
    exchange, transferring your crypto off the exchange to a secure wallet, and so
    on. Hacking is unlikely to disappear anytime soon, but the impact on the crypto
    markets is typically minor, and the resulting negative effects on price are usually
    only temporary. That''s when it becomes an opportunity, though. That''s when you
    can step in and purchase crypto at the lower price, store it in your wallet and
    wait—the prices will go up again. However, the one thing you should never do is
    automatically invest in the company that got hacked. Make sure you do your research
    first and look at the circumstances that led to the hack. If an exchange or crypto
    was hacked in a way that cannot be reversed, there is little point in pouring
    money into it. However, it can create a knock-on effect on other cryptos for no
    specific reason other than sharing the industry. When one crypto falls, it tends
    to affect others too, so do your research before investing your money.


    ## 5. Crypto Bubbles


    The crypto bubble may have burst in 2017, and the crypto markets are settling
    down and stabilizing. That doesn''t mean there won''t be another bubble, though,
    be it a current crypto or a new one. By doing solid and thorough research and
    analyzing different cryptos, you can learn how to identify where a bubble might
    occur, usually when a crypto experiences rapid growth in prices with no explicable
    reason to back it up—basically, market hype is doing its job. That is when you
    should do one of two things—sell any crypto you may hold at a higher price or
    steer clear until everything calms down again. That latter part is where the challenge
    lies, especially when FOMO kicks in.


    ## 6. Down Markets


    One thing that can knock your self-confidence is when your crypto portfolio is
    down, and it can easily sour a positive mindset. However, please don''t allow
    yourself to think that it''s in any way your fault; the markets are constantly
    on the move, and they rise and fall all the time. See it as an opportunity to
    buy other good-performing cryptos at a lower price and build up your portfolio
    without exceeding your risk tolerance. None of it means that you are bad at investing
    and don''t know how to make a profit. On the other hand, when your portfolio is
    up and doing well, it doesn''t automatically translate to you being fantastic
    at what you do and a true master at investing—even experienced investors find
    their portfolios falling at times. The difference is that they have the experience
    to weather the storm, which you need to learn.


    ## 7. New Projects and Cryptocurrencies

