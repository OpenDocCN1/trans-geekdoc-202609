    # Chapter 7: The Different Cryptocurrencies


    In 2009, the first digital currency, Bitcoin, was released to much fanfare. At
    the time, it had little to no competition and reigned supreme, but that would
    soon change. By 2011, other cryptocurrencies began emerging as the adoption of
    the underlying technology, the blockchain, began to rise. Today, we have thousands
    of cryptocurrencies to choose from, and each provides its own unique functions
    and features. However, most of them are built on the same principles as Bitcoin:


    *   No cryptocurrency is regulated, issued, or backed by a bank, government, or
    any other central authority.

    *   They are all created on the blockchain and P2P review.

    *   Many crypto coins are encrypted with cryptography.

    *   Cryptocurrencies are considered assets and are typically stored in a crypto
    wallet which can be hardware or software. These allow the crypto owners to manage
    their coins and trade with them.


    As of now, there are upwards of 6-10,000 different coins you can trade in with
    a total market cap of $2 trillion.


    ## The Different Types of Crypto


    Cryptocurrencies are typically split into two categories:


    *   **Coins**, such as Bitcoin and altcoins.

    *   **Tokens**, programmable assets on the platform''s blockchain.


    The three words - crypto, tokens, coins - are used interchangeably, but you should
    understand the differences between the three so you understand cryptocurrency.
    Any blockchain currency that isn''t Bitcoin is an altcoin - more about those shortly.


    ### Coins vs. Tokens


    Both tokens and coins are forms of cryptocurrency, but they function differently.
    A crypto coin is a form of currency built into its blockchain. For example, `BTC`
    (Bitcoin) is built on the Bitcoin blockchain, and `ETH` (Ethereum) is built on
    the Ethereum blockchain. Tokens are also built on blockchains, but they are not
    currency. They are programmable assets that allow users to create smart contracts
    and execute them. Smart contracts are used to establish who owns specific assets
    not on the blockchain network. Tokens are also used to represent a value of some
    sort, such as money, electricity, digital assets, etc., and can be received and
    sent. As an example, the `BAT` (Basic Attention Token) is an Ethereum token used
    in digital advertising.


    ### Altcoins


    Altcoin is the short form of "alternative to Bitcoin" and is any digital coin
    other than Bitcoin. Most were created to improve on some parts of Bitcoin, and
    some examples include Ethereum, Litecoin, USD Coin, Namecoin, and Peercoin. Bitcoin
    is hard-capped, which means only a set number of coins will ever be in circulation,
    and other cryptocurrencies are the same. This ensures demand and a rise in perceived
    value. Most of today''s altcoins share the basic framework Bitcoin was built on,
    along with some of Bitcoin''s characteristics. However, they all provide something
    different. Some do the same as Bitcoin, producing transaction blocks and validating
    them, but they have a different process to do it. Others offer brand-new features,
    such as smart contracts.


    ### Tokens


    Typically, tokens are created and distributed via an `ICO` (Initial Coin Offering),
    which is similar to a traditional stock offering. Tokens may be represented in
    the following ways:


    *   As value tokens, such as Bitcoins.

    *   As security tokens, which are much like stocks.

    *   As utility tokens, which are for specific use-cases.


    All tokens represent a value of some description, but they are not valuable in
    themselves. In the same way, the paper dollar you have in your wallet may not
    be worth what it says it is. However, a token can be used to carry out transactions
    in different things. The primary way a token is different from a coin is that
    tokens are constructed on blockchains that already exist for digital coins, such
    as Ethereum or Bitcoin.


    ## Top 12 Common Cryptocurrencies


    Now onto some of the more popular cryptocurrencies by market cap. Market cap is
    one of the best ways of identifying the higher valued cryptocurrencies in an over-packed
    market.


    > **NOTE** - prices were correct at the time of writing but are subject to change
    regularly.


    ### 1. Bitcoin (BTC)


    *   **Current Price** - $39,000

    *   **Market Cap** - $741 billion


    As the forerunner of all the cryptocurrencies we know today, Bitcoin is still
    the one that everyone talks about when they mention digital currency. It came
    to life in 2009, and since then, its journey has been one of sharp rises and steep
    falls. In 2017, it suddenly became even more popular when people started to pay
    attention and invest in it.


    ### 2. Ethereum (ETH)


    *   **Current Price** - $2584

    *   **Market Cap** - $310 billion


    Ethereum is a cryptocurrency platform and is the next most popular name in the
    cryptocurrency world. The currency used on the platform is `ETH` (Ether), and
    with it, you do different functions. However, what makes Ethereum so popular is
    the smart contract side of it.


    ### 3. Tether (USDT)


    *   **Current Price** - $1

    *   **Market Cap** - $80 billion


    Tether is classed as a stablecoin, and its price will always be $1 per coin. All
    stablecoins are tied to an asset''s value and, for Tether, that asset is the U.S.
    dollar. Tether tends to be a medium that traders use when moving between cryptocurrencies;
    instead of changing one crypto back into dollars before purchasing another, they
    use the Tether stablecoin. However, there are some concerns that Tether doesn''t
    have safe backing from reserved dollars but, instead, seems to use short-term
    unsecured debt.


    ### 4. Binance Coin (BNB)


    *   **Current Price** - $368

    *   **Market Cap** - $62 billion


    `BNB` is Binance''s crypto coin, and it comes from one of the biggest crypto exchanges
    worldwide. Originally, it was created as a token and was meant to be used as a
    form of payment for discounted trades, but it can now be used to purchase services
    and goods and make payments.


    ### 5. USD Coin (USDC)


    *   **Current Price** - $1

    *   **Market Cap** - $52 billion


    Another stablecoin, `USDC`, is pegged to the U.S. dollar, meaning its value should
    remain stable. Its founders say the coin has fully reserved assets backing it,
    those with an equivalent fair value, stored in regulated institutions within the
    U.S.


    ### 6. XRP (XRP)


    *   **Current Price** - $0.73

    *   **Market Cap** - $34 billion


    Created in 2012, XRP used to be called Ripple. It provides a payment method in
    multiple real-world currencies and is popular in making cross-border payments.
    Payments are facilitated via a trustless mechanism.


    ### 7. Terra (LUNA)


    *   **Current Price** - $102

    *   **Market Cap** - $34 billion


    The Terra platform uses the `LUNA` currency to backstop stablecoins that are based
    on the Euro, dollar, and other fiat currencies. Terra ensures that the stablecoin
    price is stable and offers support for smart contracts.


    ### 8. Solana (SOL)


    *   **Current Price** - $82

    *   **Market Cap** - $26 billion


    Solana is relatively new, only launching in 2020. Its biggest features are its
    transaction speeds and its web-scale platform being so robust. The `SOL` is hard-capped
    at 480 million coins.


    ### 9. Cardano (ADA)


    *   **Current Price** - $0.80

    *   **Market Cap** - $25 billion


    The Cardano platform uses the `ADA` cryptocurrency and was founded by Charles
    Hoskinson, one of Ethereum''s co-founders. Cardano uses smart contracts to help
    manage digital identities.


    ### 10. Avalanche (AVAX)


    *   **Current Price** - $72

    *   **Market Cap** - $19 billion


    Avalanche is one of the fastest and is a low-cost smart contract-based platform.
    Its focus is primarily on building `DApps` and facilitating developers in building
    their own custom blockchains. Transactions can be processed in the platform token,
    `AVAX`.


    ### 11. Binance USD (BUSD)


    *   **Current Price** - $1

    *   **Market Cap** - $18 billion


    Another stablecoin backed by the US dollar, Binance USD comes from a partnership
    between the Binance exchange and Paxos. Launched in 2019, `BUSD` is fully regulated
    by the `NYDFS` (New York Department of Financial Services), and it runs on Ethereum''s
    blockchain.


    ### 12. Dogecoin (DOGE)

    '
