- raw: 'Chapter 3 Blockchain Technology Explained ![](image_rsrc1NY.jpg)Ask 100 people,
    and I guarantee that most of them have heard of Bitcoin, but few have heard of
    blockchain. And most of those who have heard of blockchain believe it only has
    one use – to run Bitcoin. That couldn’t be further from the truth. Yes, Bitcoin
    is the most famous use of the blockchain, but the technology can do so much more.
    In fact, it is set to disrupt just about every industry in the world in the next
    few decades. ![](image_rsrc1P1.jpg)What Is Blockchain? The simple answer is that
    a blockchain is a digital method of storing data. All the data is stored in blocks
    which are then chained together, ensuring the data is immutable, i.e., it cannot
    be changed. All data entered onto the blockchain is publicly available all the
    time, and anyone can see it whenever they want, in the exact way it was entered
    onto the blockchain. That makes it a revolutionary technology because it means
    records can be kept and tracked for just about anything, including identities,
    property rights, medical records, and so on, without the risk of those records
    being tampered with. If I were to go and purchase a house, photograph the property
    rights and add that photo to a blockchain, I would always have proof that I owned
    those property rights at some point in time. That information cannot be changed
    once it goes on the blockchain. That all sounds great, but how does this blockchain
    work? It works like this: Step One – The Transaction Data Let’s make this easy
    and use the Bitcoin blockchain since it was the first one created and the oldest
    one in use right now. Each block on this blockchain has about a megabyte of data
    in it. Right now, the Bitcoin blockchain stores approximately 525,000 MB of data,
    which equates to 525,000 blocks. This data exists in the form of Bitcoin transactional
    data and is a massive record of every Bitcoin transaction that has ever taken
    place, right back to the very first one. For the purposes of the rest of this
    chapter, we will assume that all blockchains store transaction data, although
    many store other digital assets — however, regardless of what is stored, the principles
    on how the blockchain works remain the same. Step Two - Using a Hash to Chain
    the Blocks Let''s say we have several blocks containing transaction data: ![](image_rsrc1P2.jpg)Here
    we have three blocks with transaction data. Right now, they are nothing special,
    akin to documents that each contain some data on transactions and the impact on
    balances. Each block describes up to a megabyte of transactions, and now they
    need to be chained together. This requires each block to have a digital signature,
    all unique, corresponding to the data in the block. A new signature must be generated
    if anything within a block is changed. This process is called hashing and will
    be explained in the next step. Let''s assume there are two transactions in the
    first block, and both total 1 MB (on the real blockchain, 1 MB of data would be
    many more transactions.) This block is given a unique signature referencing the
    string of data in it. Let''s say X32 is the signature – it would look like this:
    ![](image_rsrc1P3.jpg)Now, if one digit in this block were changed, a new signature
    would be generated, and therein lies the primary reason why transactions cannot
    be changed. Block 2 contains the signature from block 1, thus linking them and
    basing block 2 partly on block 1s signature. This goes on throughout the entire
    chain, with each block linked to the previous one through the signature. Now,
    let''s say block 1s data is changed. Instead of Daniel sending Gary 100 BTC, the
    data is changed to read 500 BTC. That means block 1 now contains different data
    and needs a new signature – we''ll call it W10. The problem now is that block
    2 contains the wrong signature for block 1 – it has X32, whereas the new signature
    is W10. As such, the first two blocks are now unchained, which informs the blockchain
    network that data has been changed. The blockchain is designed to be immutable,
    so the network doesn''t verify the change, rejects it, and goes back to the previous
    blockchain record, which was chained to block 2. That is why it is so difficult
    to alter information in the blocks. The only way the change could go ahead undetected
    is block 1''s new signature to replace the one currently in block 2. What happens
    if block 2s data changes? It would need a new signature, too – we''ll call it
    PP4, whereas it was 9BZ. The result is that block 2 is no longer chained to block
    3 and so on throughout the blockchain. Anyone can see every block on a blockchain,
    so for a change to stay undetected, every block must be correctly linked together.
    When a block is altered, every single block that follows it must have a new signature,
    right through to the end of the blockchain. This is virtually impossible to do
    but understanding why requires knowing how these signatures get created. Step
    Three – How to Create the Hash (Digital Signature) Let''s look at a new block
    1, which has just one transaction in it – Tony sends Donald 100 BTC. The block
    now needs a signature, created using a cryptographic hash function, a complex
    formula that turns any input string into a 64-digit output string – completely
    unique. Try it for yourself using [https://passwordsgenerator.net/sha256-hash-generator/](https://passwordsgenerator.net/sha256-hash-generator/).
    If we input the word "Unicorns" into the hash generator, we get the following
    output: C3BFAD747914BB49344B9477A561CD3E0162CACB3E31B55EBE23C0F14DA7A504 If we
    change just one character in that input, even swapping a capital letter for a
    lowercase, adding a period or a space, you get a totally different output. In
    this case, we''ll change the capital letter at the start of the word to a lowercase
    letter, and we get this output: B660C5090EC2685B8BC11100BA183C0243497D95F91F78AAD987686EFB5F06B5
    Change it back to a capital letter, and get the original output. When you use
    a cryptographic hash function, it will always provide the same output when the
    same input is used, but we get a new output when the input is changed. The Bitcoin
    blockchain uses this hash function, with the block data being the input data and
    the signature relating to the block being the output. So, back to our block again
    – Tony sends Donald 100 BTC. ![](image_rsrc1P4.jpg)The data string would look
    something like this: Block 1 Tony -100 Donald +100 Insert this string into the
    hash function and the signature is: 6CC40EDA53664491E8123EFC867A5FC17A8AD946FD190F23E08E56F572FE05E3
    Now that signature gets added to the second block. Now we''ll say that Donald
    sends Simon 100 BTC. Block 2 would look like this: ![](image_rsrc1P5.jpg)The data
    string is now: Block 2 Donald -100 Simon +100 6CC40EDA53664491E8123EFC867A5FC17A8AD946FD190F23E08E56F572FE05E3
    And when this is input into the hashing function, we get this digital signature
    for block 2: 7763361E1940E7FB3C357976D236370E148AD70DF800D9F68DF9BBD0F4078EB9
    The question is, how do these digital signatures prevent a person from inputting
    a new signature for every block when they alter one? The simple answer is that
    the blockchain has specific requirements, which are only met via these signatures.
    This is known as mining and will be explained in the next step. Step Four - Who
    Signs Blocks and When Do Signatures Qualify? I''ll answer the second part of that
    question first - not every signature will qualify. Blocks can only be accepted
    onto the blockchain if the digital signature starts with something specific, i.e.,
    a specific number of consecutive zeros, for example, 10. However, each data string
    is bound to a single unique hash, but what if that hash doesn''t have the 10 zeros
    at the start of it? The only way to ensure that a signature''s block matches the
    requirements the block''s string data must be repeatedly changed until the signature
    starts with the 10 zeros. That said, the transaction data has to stay as it is,
    as does the metadata (the timestamp, block data, and so on). In that case, a tiny
    piece of specific data is placed into each block. This data only has one purpose
    - to be repeatedly changed to find an acceptable signature, and it is called a
    nonce (number used once). This block nonce is a random string containing only
