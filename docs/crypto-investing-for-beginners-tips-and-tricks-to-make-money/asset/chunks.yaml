    # 第 3 章 区块链技术详解


    随机询问 100 个人，我敢保证他们大多数都听说过比特币，但鲜有人听说过区块链。而那些听说过区块链的人，大多认为它只有一种用途——运行比特币。这与事实相去甚远。是的，比特币是区块链最著名的应用，但这项技术的能力远不止于此。事实上，在未来几十年里，它将颠覆世界上几乎每一个行业。


    ## 什么是区块链？


    简单来说，区块链是一种存储数据的数字化方法。所有数据都存储在区块中，然后这些区块被链接在一起，确保数据不可篡改，即无法被更改。录入区块链的所有数据始终公开可用，任何人都可以随时查看，且完全按照录入区块链时的原貌呈现。这使其成为一项革命性技术，因为这意味着几乎任何事物的记录都可以被保存和追踪，包括身份、财产权、医疗记录等，且无需担心这些记录被篡改。假设我去购买一栋房子，拍摄房产权证照片并将该照片添加到区块链上，我将永远拥有证明我在某个时间点拥有这些房产权的证据。一旦信息上链，就无法被更改。


    听起来很棒，但区块链究竟是如何工作的？其工作原理如下：


    ### 第一步——交易数据


    为了便于理解，我们以比特币区块链为例，因为它是首个被创建且目前仍在使用中历史最悠久的区块链。该区块链上的每个区块大约包含 1 兆字节的数据。目前，比特币区块链存储了约
    525,000 MB 的数据，相当于 525,000 个区块。这些数据以比特币交易数据的形式存在，是一份海量的记录，囊括了自第一笔交易以来发生的每一笔比特币交易。为了本章其余部分的叙述方便，我们将假设所有区块链都存储交易数据，尽管许多区块链也存储其他数字资产——然而，无论存储何种内容，区块链的工作原理保持不变。


    ### 第二步——使用哈希值链接区块


    假设我们有几个包含交易数据的区块：


    此处我们有三个包含交易数据的区块。目前，它们毫无特别之处，类似于每份都包含一些交易数据及对余额影响的文档。每个区块描述最多 1 MB 的交易，现在需要将它们链接在一起。这要求每个区块都拥有一个数字签名，且必须唯一，对应该区块内的数据。如果区块内的任何内容发生变化，必须生成一个新的签名。这个过程称为哈希运算，将在下一步中解释。


    假设第一个区块中有两笔交易，总计 1 MB（在真实区块链中，1 MB 数据包含的交易会多得多）。该区块会被赋予一个引用其内部数据字符串的唯一签名。假设 `X32`
    是该签名，它看起来会像这样：


    现在，如果该区块中的一个数字被更改，就会生成一个新的签名，这正是交易无法被篡改的根本原因。区块 2 包含区块 1 的签名，从而将二者链接起来，并使区块 2
    部分基于区块 1 的签名。这一过程贯穿整条链，每个区块都通过签名与前一个区块相链接。


    现在，假设区块 1 的数据被更改了。原本是 Daniel 发送 100 BTC 给 Gary，数据被篡改为 500 BTC。这意味着区块 1 现在包含不同的数据，需要一个新签名——我们称之为
    `W10`。问题在于，区块 2 现在持有的是区块 1 错误的签名——它存的是 `X32`，而新签名是 `W10`。因此，前两个区块现在处于“未链接”状态，这会通知区块链网络数据已被篡改。区块链被设计为不可变，因此网络不会验证该变更，会拒绝它，并恢复到之前链接到区块
    2 的区块链记录。这就是为什么很难更改区块中的信息。除非用区块 1 的新签名替换掉区块 2 中当前的签名，否则该变更无法在未被发现的情况下生效。


    如果区块 2 的数据发生变化会怎样？它也需要一个新签名——我们称之为 `PP4`，而原来是 `9BZ`。结果是区块 2 不再与区块 3 链接，以此类推贯穿整个区块链。任何人都可以看到区块链上的每一个区块，因此，要想让篡改行为不被发现，必须确保每个区块都正确链接在一起。一旦某个区块被篡改，其后每一个区块都必须生成新签名，一直延续到区块链的末尾。这在实际操作中几乎是不可能的，但要理解原因，需要知道这些签名是如何生成的。


    ### 第三步——如何创建哈希值（数字签名）


    让我们看一个新的区块 1，其中只有一笔交易——Tony 发送 100 BTC 给 Donald。该区块现在需要一个签名，该签名通过加密哈希函数创建，这是一种复杂的公式，可将任意输入字符串转换为一个
    64 位的输出字符串——且完全唯一。你可以使用 <https://passwordsgenerator.net/sha256-hash-generator/>
    自行尝试。


    如果我们在哈希生成器中输入单词 "Unicorns"，将得到以下输出：

    `C3BFAD747914BB49344B9477A561CD3E0162CACB3E31B55EBE23C0F14DA7A504`


    如果我们仅更改输入中的一个字符，哪怕只是将大写字母改为小写、添加一个句号或一个空格，都会得到完全不同的输出。在此例中，我们将单词首字母的大写改为小写，得到的输出为：

    `B660C5090EC2685B8BC11100BA183C0243497D95F91F78AAD987686EFB5F06B5`


    改回大写字母，又会得到最初的输出。当你使用加密哈希函数时，相同的输入永远会产生相同的输出，但输入一旦改变，输出就会完全不同。比特币区块链使用的就是这种哈希函数，区块数据作为输入数据，与区块相关的签名作为输出。


    那么，回到我们的区块——Tony 发送 100 BTC 给 Donald。


    数据字符串看起来会像这样：

    ```

    Block 1

    Tony -100

    Donald +100

    ```


    将此字符串输入哈希函数，得到的签名为：

    `6CC40EDA53664491E8123EFC867A5FC17A8AD946FD190F23E08E56F572FE05E3`


    现在该签名被添加到第二个区块中。现在假设 Donald 发送 100 BTC 给 Simon。区块 2 将如下所示：


    数据字符串现在为：

    ```

    Block 2

    Donald -100

    Simon +100

    6CC40EDA53664491E8123EFC867A5FC17A8AD946FD190F23E08E56F572FE05E3

    ```


    将此字符串输入哈希函数，我们得到区块 2 的数字签名：

    `7763361E1940E7FB3C357976D236370E148AD70DF800D9F68DF9BBD0F4078EB9`


    问题是，这些数字签名如何防止某人在篡改一个区块后，为每个后续区块输入新签名？简单的答案是，区块链有特定的要求，只有通过这些签名才能满足。这被称为挖矿，将在下一步中解释。


    ### 第四步——谁对区块签名？何时签名才算合格？


    我先回答这个问题的后半部分——并非所有签名都合格。只有当数字签名以特定内容开头时，区块才能被区块链接受，即以特定数量的连续零开头，例如 10 个。然而，每个数据字符串只对应一个唯一的哈希值，但如果该哈希值开头没有那
    10 个零怎么办？唯一的办法是反复更改区块的字符串数据，直到签名以 10 个零开头。话虽如此，交易数据必须保持原样，元数据（时间戳、区块数据等）也必须保持原样。在这种情况下，一小段特定数据会被放入每个区块。这段数据只有一个目的——被反复更改以寻找合格的签名，它被称为
    **nonce**（一次性数字，number used once）。区块 nonce 是一个仅包含数字的随机字符串。


    总结一下，区块 1 包含三样东西：


    - 交易数据

    - 前一个区块的签名

    - 一个 nonce


    通过反复更改 nonce 并对区块数据进行哈希运算以寻找合格签名的过程，被称为**挖矿**——这就是区块链矿工所做的工作。矿工以电力的形式使用算力，反复更改
    nonce 并对其进行哈希运算，以获得该签名。算力越高，区块组合（nonce）的哈希速度越快，找到合格签名的速度也就越快，这个过程无非是反复试错。参与区块链的任何人都可以进行这个过程——你只需下载相应的挖矿软件并启动它。这样，你就为网络贡献了算力来解决区块的
    nonce。


    如前所述，哈希签名必须以特定数量的零开头——目前这个数字是 19。要找到一个开头有那么多零的哈希值并不容易，需要巨大的算力、大量的时间和不小的运气。有时，矿工会走运，很快找到正确的签名。例如比特币区块链上最近的一个区块。一位算力很小的小矿工找到了正确的签名，而当时网络其余部分的总算力是他的
    7 万亿倍。为了更直观地感受这种概率，中强力球彩票头奖的几率是 2.92 亿分之一——比那位矿工战胜整个网络找到正确答案的难度低 24,000 倍。无论如何，最重要的结论是：找到一个合格的签名并不容易。


    ### 第五步——这一切如何造就了不可变的区块链？


    如前所述，当你更改一个区块时，它会与后续区块“断链”。网络只有在该区块与后续区块链接时才会接受更改后的区块。一次更改意味着所有其他后续区块也需要获得新签名，且必须全部满足特定要求。要确保更改后的每个后续区块都有新签名，需要大量的时间和算力。理论上这可行，但实践中几乎不可能，原因如下。


    假设我们有一个作恶的矿工。他篡改了一个交易区块，现在需要为每个后续区块获取新签名，以便网络接受他篡改的区块。关键在于——在作恶矿工做这件事的同时，网络正在为后续区块生成新签名。这意味着我们的作恶矿工还必须为那些新区块以及在此期间添加到链上的任何其他区块生成新签名。为了让他篡改的区块被接受，他必须确保其后的每个其他区块保持链接，包括在此期间新增的每个区块。除非他拥有比整个网络其他部分加起来显著更多的算力，否则他无法追上。目前，比特币区块链拥有数百万矿工，可以安全地假设一两个作恶矿工的算力远不及网络其余部分的总算力。这意味着他们做出的任何更改永远不会被接受，从而确保了区块链的不可变性。


    然而，正如我们之前提到的，存在一个例外。它被称为 **51% 攻击**，且历史上已发生过。51% 攻击也称为双花攻击。一个或多个矿工试图用他们的比特币进行两次购买，即双重花费。例如，我用
    15 个比特币购买一辆汽车。汽车交付后，我的比特币从我的钱包转移到卖家钱包——这可能需要几天时间。如果我实施 51% 攻击，我有可能撤销这笔交易，既保留我的
    15 个比特币，又得到汽车。这意味着我可以将这些比特币花在别处。完整解释超出了本书范围，但简而言之，这种攻击极不可能再次发生。


    ### 第六步——区块链如何治理以及规则如何确定


    所有区块链都遵循民主治理模型，交易记录的更新基于网络大多数节点的共识。这是由区块链协议自动完成的，方法是遵循最长的区块链记录，前提是大多数节点已就此达成一致。这意味着网络大部分算力被用于延伸最长的区块链版本，这也是篡改区块被拒绝的原因——仅仅因为该区块不再链接到最长链上。众所周知，比特币区块链上的所有交易和钱包余额都是公开的，任何人都可以查看任何钱包或发生过的任何交易。然而，虽然我们可以看到任何人的钱包，但无法知道钱包所有者是谁。他们的隐私依然安全。


    ## 其他加密货币怎么样？


    所有其他加密货币都基于比特币，仅仅是首个数字货币的变体形式。大多数拥有自己的区块链协议，其规则可能与比特币区块链不同。比特币被设计为一种货币，意味着它只有一个目的——作为货币发挥作用。门罗币是另一种具有该功能的加密货币，但其区块链协议上有额外规则，确保门罗币具有更强的隐私性，交易难以追踪。然而，任何加密货币都可以拥有任何价值，完全取决于发行方。有些被称为代币，允许持有者做某些事——例如获得游戏许可、访问社交媒体网站、获取水、电等资源。无论是什么，每一笔代币交易都记录在区块链上，并可通过加密货币交易所在线兑换。简而言之，它们是互联网的货币。


    区块链技术可能颠覆的一个行业例子是股票市场。随着时间的推移，股份和其他公司财产权很可能会以代币形式存储在区块链上。然而，区块链的用途不限于此。它们还可用于存储医疗数据、历史记录、身份信息、税务记录等。这就是为什么区块链技术具有革命性，并将对我们所知的世界产生巨大影响。下一章将探讨加密货币是如何运作的。


    '
