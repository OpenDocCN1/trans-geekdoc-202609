  fmt: '

    # Proof-Of-Work


    Miners who want their transactions and block added to the blockchain must provide
    an answer to a specific puzzle, but it isn''t easy to provide, which is why so
    much computing power is needed. However, it is easy for the rest of the network
    to verify the correct answer in a process known as proof-of-work.


    For example, if you manage to guess a padlock''s combination, it is proof of the
    challenge. It isn''t easy to start with because you need to go through tons of
    combinations, but verification is easy - simply enter the code, and if the padlock
    unlocks, it''s the correct one. The same applies to cryptocurrency mining. The
    miner who solves the problem before any of the others is rewarded. This is a way
    of incentivizing the miner to continue and providing healthy competition between
    them.


    Some cryptocurrencies use proof-of-work to ensure that the network hasn''t been
    manipulated. However, this concept does have downsides where blockchain technology
    is concerned. One of the biggest is the sheer amount of electricity and computing
    power needed to make what amounts to random guesses. Many new cryptocurrencies
    have shunned proof-of-work in favor of a different concept called proof-of-stake.


    # Proof-Of-Stake


    The proof-of-stake concept is different from proof-of-work because you must prove
    ownership of a specific stake or amount of money. That means those with the most
    amounts of crypto have the most mining power, thus getting rid of the requirement
    for vast amounts of computing power. It is easy to prove the calculations in this
    concept, so you have ownership of a percentage of all available cryptos.


    This system also differs in that block rewards are not offered. Instead, the "winning"
    miner is given the transaction fees. This is how the system is many times more
    effective than proof-of-work.


    However, proof-of-stake also has its downsides. You could say that the system
    rewards those who hoard coins. Each miner can only mine the transaction percentage
    related to their cryptocurrency stake. For example, if a proof-of-stake miner
    owns 20% of the total available cryptocurrency, they can mine 10% of the network
    blocks. This limitation provides nodes with an excellent reason to save rather
    than spend their coins. It could also lead to the rich continuing to get rich
    because they can mine a bigger percentage of the network blocks.


    # Proof-Of-Importance


    The proof-of-importance concept first came about with the NEM platform in support
    of its cryptocurrency, XEM. It is similar to proof-of-stake in that nodes are
    only allowed to mine if they hold a specific amount of cryptocurrency. The network
    then scores all those nodes who meet the requirements, creating a block with a
    similar proportion to the score.


    However, nodes don''t score higher just because they have more cryptocurrency.
    Instead, the score considers all sorts of variables to solve the problem of hoarding
    seen with proof-of-stake.


    The NEM community uses harvesting, which Investopedia defines as "Instead of each
    miner contributing its mining power in a cumulative manner to a computing node,
    a harvesting participant simply links his account to an existing supernode and
    uses that account''s computing power to complete blocks on his behalf."


    # Putting It All Together


    To summarize, this is how cryptocurrency works:


    1.  When you use cryptocurrency to purchase something, your network and wallet
    will check your transactions history to ensure you have sufficient crypto to make
    the purchase. This requires your public and private keys, which we''ll discuss
    in chapter 6 when we talk about wallets.

    2.  The transaction gets encrypted, sent to the network, and added to a queue
    where it waits to go on the distributed ledger.

    3.  The mining process adds the transaction to the ledger. The addresses for the
    sender and receiver are hash values or IDs tied to a wallet. These are not linked
    to any particular user ID, allowing the user to remain anonymous.

    4.  In proof-of-work cryptocurrencies, a puzzle must be solved by the network
    miners before the transaction can go on the blockchain. In proof-of-stake, each
    node''s mining power is directly related to the number of coins they hold, rather
    than actual computing power. This solves the issues raised with Bitcoin, where
    vast amounts of electricity and expensive computers were required to guess random
    numbers. Proof-of-information uses different variables to choose which nodes have
    mining power, which solves the hoarding issue raised by proof-of-stake.


    # More Important Cryptocurrency Concepts


    Although I will be going into more detail in the next couple of chapters about
    wallets, exchanges, brokers, and some of the different cryptocurrencies, I will
    cover some more concepts here that you will likely come across. Some other things
    ensure cryptocurrency is different from fiat currency.


    ## Adaptive Scaling


    This is one of the major reasons people choose to invest in cryptocurrency, and
    it means that, as time passes, it gets more difficult to mine a cryptocurrency.
    It also ensures cryptos are good on small scales and large. This is why cryptocurrencies
    have a cap on supply, thus creating scarcity, and, as more coins enter public
    circulation, the mining reward is reduced too. Adaptive scaling ensures that mining
    difficulty rises and falls based on coin popularity and the blockchain, thus ensuring
    cryptocurrencies enjoy market longevity.


    ## Decentralization


    The biggest advantage to the blockchain is that the technology is decentralized,
    meaning no one organization or person controls it. Some say that Ripple, and other
    similar cryptocurrencies, are not really classed as decentralized, and their reasoning
    is that they don''t follow the mining protocol Bitcoin uses. Ripple doesn''t have
    any miners, ensuring the transaction system is faster and more reliable by using
    a centralized blockchain. The Ripple developers chose this route because it wants
    the option of working with some of the larger banks, combining the advantages
    of blockchain technology and cryptocurrency with those of fiat currency.


    There is some debate over whether Ripple and any other cryptocurrency that isn''t
    mined is considered a real cryptocurrency, but that doesn''t stop you from investing
    them, and they can prove to be quite lucrative.


    ## Harvesting


    Harvesting is a method used in place of mining to maintain the network''s integrity.
    The NEM platform designed it to generate XEM, which is their cryptocurrency. Harvesting
    works in this way:


    *   When a transaction is carried out, the first device that sees the transaction
    and verifies it notifies all nearby nodes of it. This creates an information cascade.

    *   This process is how a block is generated. When a miner with 10,000 or more
    XEM generates a NEM block, they are paid by way of the block''s transactions fees.

    '
  trans: '


    # 工作量证明


    希望将其交易和区块添加到区块链的矿工，必须为一个特定谜题提供答案，但这并不容易，这也是为什么需要如此多算力的原因。然而，网络中的其他节点很容易通过一个称为工作量证明的过程来验证正确答案。


    例如，如果你设法猜中了挂锁的密码，这就是对挑战的证明。开始并不容易，因为你需要尝试大量的组合，但验证很简单——只需输入密码，如果挂锁打开了，那就是正确的。加密货币挖矿也是同理。在其他人之前解决问题的矿工将获得奖励。这是一种激励矿工继续挖矿并为他们之间提供良性竞争的方式。


    一些加密货币使用工作量证明来确保网络未被篡改。然而，就区块链技术而言，这一概念也有缺点。最大的缺点之一是进行相当于随机猜测的操作所需的巨大电力和算力。许多新的加密货币摒弃了工作量证明，转而支持一种称为权益证明的不同概念。


    # 权益证明


    权益证明的概念不同于工作量证明，因为你必须证明对特定权益或金额的所有权。这意味着拥有最多加密货币的人拥有最大的挖矿算力，从而消除了对大量算力的需求。在这个概念中，很容易证明计算过程，因此你拥有所有可用加密货币的一定百分比所有权。


    该系统的另一个不同之处在于不提供区块奖励。相反，“获胜”的矿工将获得交易费。这就是该系统比工作量证明高效许多倍的原因。


    然而，权益证明也有其缺点。可以说该系统奖励那些囤积代币的人。每个矿工只能挖掘与其加密货币权益相关的交易百分比。例如，如果一个权益证明矿工拥有总可用加密货币的
    20%，他们只能挖掘 10% 的网络区块。这种限制为节点提供了一个极好的理由去储蓄而非花费他们的代币。这也可能导致富人越来越富，因为他们可以挖掘更大比例的网络区块。


    # 重要性证明


    重要性证明的概念最早出现在 NEM 平台上，用于支持其加密货币 XEM。它与权益证明相似，因为只有持有特定数量加密货币的节点才被允许挖矿。然后网络对所有满足要求的节点进行评分，创建一个与评分成比例的区块。


    然而，节点并非仅仅因为拥有更多加密货币就获得更高分数。相反，评分会考虑各种变量，以解决权益证明中出现的囤积问题。


    NEM 社区使用收割机制，Investopedia 将其定义为：“每个矿工不是以累积的方式将其挖矿算力贡献给计算节点，收割参与者只需将其账户链接到现有的超级节点，并利用该账户的算力代表其完成区块。”


    # 综合概述


    总之，这是加密货币的工作原理：


    1.  当你使用加密货币购买商品时，你的网络和钱包将检查你的交易历史，以确保你有足够的加密货币进行购买。这需要你的公钥和私钥，我们将在第 6 章讨论钱包时详细介绍。

    2.  交易被加密，发送到网络，并添加到队列中，等待记入分布式账本。

    3.  挖矿过程将交易添加到账本中。发送方和接收方的地址是与钱包绑定的哈希值或 ID。这些不关联任何特定的用户 ID，允许用户保持匿名。

    4.  在工作量证明加密货币中，网络矿工必须在交易上链前解开一个谜题。在权益证明中，每个节点的挖矿算力与其持有的代币数量直接相关，而非实际算力。这解决了比特币面临的问题，即需要大量电力和昂贵的计算机来猜测随机数字。重要性证明使用不同的变量来选择哪些节点拥有挖矿算力，从而解决了权益证明引发的囤积问题。


    # 更多重要的加密货币概念


    虽然我将在接下来的几章中详细介绍钱包、交易所、经纪商以及一些不同的加密货币，但我将在这里介绍一些你可能会遇到的更多概念。还有一些其他因素确保了加密货币与法定货币的区别。


    ## 自适应缩放


    这是人们选择投资加密货币的主要原因之一，这意味着随着时间的推移，挖掘加密货币变得更加困难。它还确保加密货币在小规模和大规模上都表现良好。这就是为什么加密货币有供应上限，从而制造稀缺性，并且随着更多代币进入公开流通，挖矿奖励也会减少。自适应缩放确保挖矿难度根据代币受欢迎程度和区块链情况升降，从而确保加密货币享有市场长久性。


    ## 去中心化


    区块链最大的优势在于该技术是去中心化的，意味着没有单一组织或个人控制它。有人认为瑞波币及其他类似加密货币并不真正属于去中心化，他们的理由是它们不遵循比特币使用的挖矿协议。瑞波币没有任何矿工，通过使用中心化区块链确保交易系统更快、更可靠。瑞波币开发者选择这条路线，是因为它希望拥有与大型银行合作的选项，将区块链技术和加密货币的优势与法定货币的优势相结合。


    关于瑞波币及任何其他非挖矿加密货币是否被视为真正的加密货币，存在一些争议，但这并不妨碍你投资它们，它们可能证明相当有利可图。


    ## 收割


    收割是一种用于维护网络完整性的替代挖矿方法。NEM 平台设计它来生成 XEM，即他们的加密货币。收割的工作方式如下：


    *   当一笔交易发生时，第一个看到该交易并验证它的设备会通知所有附近的节点。这创造了一个信息级联。

    *   这个过程就是区块生成的方式。当一位持有 10,000 枚或更多 XEM 的矿工生成一个 NEM 区块时，他们将通过该区块的交易费获得报酬。


    '
