    # Chapter 6 Crypto Wallets Explained


    In the same way that you store physical banknotes and coins in a physical wallet,
    cryptocurrency wallets are where you store your cryptocurrencies and other digital
    assets. Using cryptocurrencies as an investment asset is becoming more popular,
    as is digital payments. If you intend to join this growing trend, you need to
    be aware of what crypto wallets are and how to use them. This chapter will walk
    you through the different types of wallets and some tips on choosing the right
    one for your needs.


    ## What Is a Crypto Wallet?


    Crypto wallets are a method of storing your cryptocurrencies, such as Ethereum
    and Bitcoin, and other digital assets based on the blockchain you may own. These
    wallets allow you to manage your assets, spend them or use them for trading other
    cryptocurrencies. Crypto wallets come in two primary types - hardware and software.
    There are three types of software wallets - web-based, desktop, and mobile, while
    hardware wallets are physical devices used to store your crypto securely offline.
    Let''s look at each one.


    ### Web-Based Wallets


    Web-based wallets are simple to use and are typically hosted by crypto exchanges,
    allowing you to easily buy, store, and sell your cryptos. The wallet provider
    stores your security keys and manages them. Let''s say you use the Coinbase Global
    exchange to purchase your crypto. In that case, your security keys are stored
    in a web wallet that always has a connection to the internet - this is known as
    hot storage. However, this comes with a few security issues. Should the exchange
    get hacked, you risk losing your assets, for example, and an always-on connection
    to the internet will always be a risk. However, web wallets provide easy options
    for managing and purchasing cryptocurrencies.


    ### Mobile Wallets


    Mobile wallets are simply a piece of software on your tablet or smartphone. Some
    are not hosted, which means the responsibility for saving your private key and
    keeping it secure is yours - lose it and you''ve lost access to your assets. Some
    of the more popular choices include Coinbase Wallet, Trust Wallet, and Mycelium.
    Mobile wallets are typically classed as hot storage as you can link them to exchanges,
    but some provide extra offline security or cold storage.


    ### Desktop Wallets


    Desktop wallets are similar to mobile wallets and are small pieces of software
    installed on a desktop computer. Some of the best ones are Exodus, MetaMask, and
    Electrum, and most offer a choice of hot or cold storage.


    ### Hardware Wallets


    Hardware wallets are more secure than software wallets, as they allow you to store
    access to your digital assets on hardware offline. You can connect the wallet
    to your computer via a USB port to do your transactions and transfers and then
    disconnect them to keep your access secure in cold storage. This is the highest
    security level you can get in a crypto wallet, but the responsibility for tracking
    your security keys is yours. Two of the most popular hardware wallets are Trezor
    and Ledger.


    ## How Do Crypto Wallets Work?


    Your cryptocurrencies and other assets are stored on a distributed ledger, and
    you need the internet to access them. Because of that, if you intend long-term
    storage of your cryptos, you need to be mindful of the risks of cybersecurity,
    and setting up your crypto wallet should be your first priority. Crypto wallets
    don''t physically hold cryptocurrency. Instead, cryptos are stored on the blockchain
    because they are digital assets, and the blockchain is a distributed digital ledger
    that stores and manages these assets. Crypto wallets are nothing more than a way
    of storing the "key" that allows you to access your cryptos.


    ### Features:


    *   They give us a long-term method of managing cryptocurrencies.

    *   You can store more than one type of cryptocurrency in a wallet.

    *   You get a public key to help you do your crypto transactions.

    *   Some give you a private key for extra security.

    '
