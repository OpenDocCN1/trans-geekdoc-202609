    # Chapter 13 A Word about Taxes


    The last couple of years have been pretty wild for the cryptocurrency market.
    Over 10% of Americans traded, and more than a few wonder what the score is regarding
    taxes. Many new crypto investors think that they are exempt from tax, but this
    isn''t the case, unfortunately. Anyone who trades in crypto must report conversions,
    sales, payments, and their income from crypto to the state tax authorities and
    IRS where applicable. What makes it harder is that each type of transaction is
    subject to different tax rules. This chapter will cover those rules for you, so
    you are in no doubt what you need to report. Before we move on, though, I must
    tell you that you should speak to a tax professional experienced in crypto taxes
    to ensure you get things right.


    ## Do I Owe Taxes on My Crypto?


    Cryptocurrency is a digital asset and is considered as such in the USA. Because
    of this, it is treated in the same way the IRS treats bonds, stocks, and capital
    assets. This means that any money gained from your crypto is taxed at all different
    rates, dependent on the method used to obtain the crypto and the length of time
    you held it. So, how do you know if you owe any taxes? The most important thing
    is to look at how your crypto was used in the previous year, in this case, 2021.
    A crypto transaction where tax is due is called a "taxable event," while those
    where tax is not due are called "non-taxable events. Let''s break down what each
    involves:


    ### Non-Taxable Events


    *   **Purchasing and Holding Crypto** - you do not need to declare tax on cryptocurrency
    when you just purchase and hold it. That comes later when the crypto is sold and
    you "realize" the gains.

    *   **Donations to Non-Profit or Tax-Exempt Charities** - provided the charity
    is a registered 501(c)(3) organization, you can donate crypto without incurring
    taxes and may even be able to claim charitable deductions.

    *   **Receiving Crypto as a Gift** - if someone gifts you some crypto, you will
    not need to pay tax unless you sell it, stake it, or partake in any other taxable
    activity.

    *   **Giving Crypto as a Gift** - you can gift each recipient $15,000 or less
    per year without needing to pay tax - that amount is higher for a spouse. If you
    go over $15,000, a gift tax return must be filed. However, this doesn''t usually
    generate a tax liability. Whenever you send crypto to another person, and it is
    not classed as paying for a service or goods, it may be considered a gift, even
    if it was intended that way.

    *   **Transferring Between Your Own Wallets/Accounts** - this is not considered
    taxable. In preparation for an eventual trade or sale, it is possible to transfer
    the original cost basis and the date you acquired the asset so you can track your
    tax impact.


    ### Taxable Events - Capital Gains


    *   **Selling Cryptocurrency for Cash** - if you sell your crypto and receive
    U.S. dollars in exchange, you are liable for tax on any amount above what you
    paid for the asset. For example, if you purchased crypto for $1000 and sell it
    for $1500, you must pay tax on the additional $500. However, if you sell for less
    than you paid, you may be able to show it as a loss.

    *   **Converting Crypto to Another Crypto** - for example, you use Bitcoin to
    purchase Ether. Technically, your Bitcoin must be sold before purchasing Ether,
    and the IRS treats this as a taxable sale. If you sell for more than you originally
    paid, you must pay taxes on the price difference.

    *   **Using Crypto to Buy Goods and Services** - any transaction where crypto
    is used to buy a service or goods, tax is due. According to the IRS, there is
    little difference between spending and selling crypto - in these transactions,
    the crypto is sold before it can be exchanged for services or goods, making it
    a taxable transaction.


    ### Taxable Event - Income


    *   **Receiving Payment in Crypto** - if you receive your salary in crypto, you
    are liable for income tax as it is classed as compensation, and you are taxed
    per your tax bracket.

    *   **Receiving Crypto as Payment for Services or Goods** - this is taxable as
    it is treated the same way as a sale. It is classed as income, and you must report
    it as such.

    *   **Mining Cryptocurrency** - if you are a crypto miner and earn rewards/transaction
    frees, you may have to pay taxes. This is based on a fair market value of the
    coins when you receive them. If you are mining crypto as a business concern, it
    must be registered as self-employment income.

    *   **Receiving Staking Rewards** - in the same way as earnings from mining, these
    earnings are taxable, based on a fair market value on the day you receive the
    reward.

    *   **Other Income** - if you hold cryptos and earn a return from them, it is
    considered income and is taxable as such. Although this may be interest paid on
    your holdings, the IRS doesn''t treat it in the same way as interest earned on
    your bank account.

    *   **Receiving an Airdrop** - crypto airdrops are when you receive them as part
    of a giveaway or marketing campaign. This is classed as taxable income and must
    be reported as such.

    *   **Receiving Other Rewards or Incentives** - this could be from incentives,
    friend referrals to certain exchanges, and so on - anything like this must be
    reported as taxable income.


    ## How Much Do I Owe?


    So, you''ve probably determined that you will owe taxes on some of your crypto
    activities. What do you do now? Well, you could estimate your taxes by working
    out your income, losses, and gains.


    ### Calculating Your Income


    As a U.S. taxpayer, you are used to seeing your state and federal income tax deducted
    straight from your pay. Any crypto assets earned as income must be declared as
    income and taxes paid. However, these are not treated the same way as your salaried
    income, i.e., the taxes won''t be automatically deducted, and you must report
    them on your yearly income tax form. The taxes owed on this income is determined
    based on your tax bracket. However, be aware of one thing - if you have earned
    a high level of additional income from your crypto assets, you may be moved up
    a tax bracket or so and will have to pay higher taxes on your earnings. This will
    include your fiat money earnings, such as salary.


    ### Calculating Your Capital Gains and Losses


    Before calculating this, you must know the amount of crypto you had at the start
    of the tax year. This is known as your cost basis. When you purchase crypto, this
    is based on the amount you paid for the asset. However, if your crypto came from
    staking or mining, a fair market value is used to work out the cost basis based
    on when you receive the crypto. In terms of crypto you received as a gift, this
    depends on the cost basis of the person gifting it to you and a fair market value
    on the day you received it. If you sell your cryptocurrency, the cost basis is
    deducted from the sale price to determine if you have made a capital gain (if
    it is more than your cost basis) or a capital loss (when it is less).


    ### Short-Term vs. Long-Term Capital Gains


    These taxes are applied at the state level, where applicable, and federal level
    and may be short or long-term. The length of time you have held your assets will
    determine how much tax you must pay. If you have held them for at least 12 months,
    the tax rate is typically lower than if you held them for less.


    *   **Long-Term Gains** - these are typically taxed at a lower capital gains tax
    rate. At the federal level, these rates are 0%, 15%, and 20% and are based on
    your total income. Those taxpayers in the higher income tax brackets may also
    have to pay a Net Investment Income Tax on income and gains, currently 3.8%.

    *   **Short-Term Gains** - these are typically taxed at your current income tax
    rate, usually a higher rate, which makes it worthwhile holding onto your assets
    for at least a year before selling them.

