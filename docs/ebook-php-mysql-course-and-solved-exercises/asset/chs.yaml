  \n### 第 3 章：PHP 中的循环\n\n欢迎来到 PHP 循环章节！循环是程序开发中必不可少的工具，因为它们可以根据特定条件重复执行指令。无论你是初学者还是经验丰富的开发者，本章都将引导你了解\
  \ PHP 中可用的不同类型的循环，向你展示如何有效地使用它们来自动化任务、浏览数据集合并创建更动态的程序。\n\n我们将在本章中学习的循环包括：\n\n* \
  \  `while` 循环\n*   `do-while` 循环\n*   `for` 循环\n\n我们将重点介绍这些循环中的每一个的用法、优势以及实现的最佳实践。学习完这些循环后，你将发现如何使用它们来浏览和操作数据。\n\
  \n准备好潜入 PHP 循环的迷人世界吧，在这里你将学习如何以精确而优雅的方式操控代码的执行流程。通过掌握循环，你将能够创建更动态、更强大的 PHP 应用程序。那么，废话不多说，让我们一起探索\
  \ PHP 循环的内部运作机制吧！\n\n#### `while` 循环\n\n`while` 循环是 PHP 中的一种控制结构，它允许你在指定条件为真时重复执行一段代码块。其工作原理如下：\n\
  \n**步骤 1**：初始化条件：在进入 `while` 循环之前，需要定义一个条件。该条件是一个布尔表达式，会在循环的每次迭代之前进行求值。\n\n**步骤\
  \ 2**：条件求值：对条件进行求值，以确定其为真还是为假。\n\n**步骤 3**：如果条件为真（即返回 `true`），则执行循环内部的代码块，即“指令”块。一旦该代码块执行完毕，程序返回步骤\
  \ 2 并重新求值条件。\n\n**步骤 4**：如果条件为假（即返回 `false`），则 `while` 循环结束，程序继续执行循环后的代码。\n\n![Image](img/image-48.png)\n\
  \n要有效地使用 `while` 循环，必须确保指定的条件最终会在某个时刻变为假，否则就有创建无限循环的风险。此外，必须在代码块内正确更新条件中使用的变量，以确保条件最终会变为假。\n\
  \n简而言之，`while` 循环允许你在指定条件保持为真时重复执行一段代码块。它是在 PHP 程序中创建灵活控制结构的有力工具。\n\n`while` 循环的基本语法如下：\n\
  \n![Image](img/image-49.png)\n\n下面是一个说明 `while` 循环的示例：\n\n```php\n<?php\n\n$counter\
  \ = 1;\n\n// 使用 while 循环显示 1 到 10 的数字\nwhile ($counter <= 10) {\n    echo \"The\
  \ counter is: $counter <br>\";\n    $counter++;\n}\n\n?>\n```\n\n在这段代码中，我们将 `$counter`\
  \ 变量初始化为值 1。然后我们使用 `while` 循环来显示 1 到 10 的数字。\n\n**步骤 1**：将 `$counter` 变量初始化为 1。\n\
  \n**步骤 2**：`while` 循环中指定的条件是 `$counter <= 10`。只要此条件为真，循环内的代码块就会被执行。\n\n**步骤 3**：每次循环迭代时，块内的代码都会被执行。在本例中，我们使用\
  \ `echo` 显示当前的计数器值。然后，在每次迭代结束时，我们使用 `++` 运算符将 `$counter` 的值加 1。这确保了计数器随每次迭代逐步增加。\n\
  \n重复：只要条件 `$counter <= 10` 保持为真，步骤 2 到 3 就会重复执行。一旦 `$counter` 达到 11，条件变为假，`while`\
  \ 循环结束。\n\n这段代码将使用 `while` 循环显示 1 到 10 的数字。\n\n![Image](img/image-50.png)\n\n`while`\
  \ 循环极其灵活，可用于各种场景。当你需要根据某个条件不定次数地执行一段代码块时，它特别有用。\n\n#### `do...while` 循环\n\n`do...while`\
  \ 循环类似于 `while` 循环，但有一个重要区别：条件是在代码块执行*之后*进行求值的。这意味着代码块*至少会执行一次*，即使条件从一开始就是假的。\n\n\
  `do...while` 循环的工作原理如下：\n\n*   **步骤 1**：首先，循环内的代码块（指令）会在不检查条件的情况下执行第一次。\n*   **步骤\
  \ 2**：检查条件：代码块执行完毕后，对 `while` 关键字后指定的条件进行求值。\n*   **步骤 3**：如果条件为真，则重新执行代码块（指令）。\n\
  *   **步骤 4**：否则，循环结束。\n\n重复：只要 `while` 关键字后指定的条件保持为真，步骤 1 到 3 就会重复执行。\n\n![Image](img/image-51.png)\n\
  \n`do...while` 循环的通用语法如下：\n\n![Image](img/image-52.png)\n\n下面是一个在 PHP 中使用 `do...while`\
  \ 循环的示例：\n\n```php\n<?php\n\n$counter = 1;\n\ndo {\n    echo \"The counter is: $counter\
  \ <br>\";\n    $counter++;\n} while ($counter <= 10);\n\n?>\n```\n\n在本例中，`$counter`\
  \ 变量被初始化为 1。\n\n*   接着，大括号内的代码块被执行。它显示计数器的值。\n*   代码块执行完毕后，对条件 `$counter <= 10`\
  \ 进行求值。只要此条件为真，代码块就会被重新运行。\n*   计数器在每次迭代时递增。\n*   循环重复直到条件变为假，即当 `$counter` 达到值\
  \ 11 时。\n\n由于条件是在每次迭代结束时检查的，因此代码块至少会执行一次，即使初始条件为假。\n\n该代码返回的结果与使用 `while` 循环的前一个示例完全相同。\n\
  \n但请注意，这两个循环的主要区别在于：`do...while` 循环保证代码块至少执行一次，而如果条件从一开始就是假的，`while` 循环可能根本不会执行代码块。\n\
  \n为了说明这一区别，假设我们将变量 `$counter` 初始化为 20。在这种情况下，条件 (`$counter <= 10`) 从一开始就是假的，因为 `$counter`\
  \ 初始化为 20，大于 10。\n\n\n\n\n因此，对于 `while` 循环，循环内部的代码块将永远不会被执行。\n\n然而，对于 `do...while`\
  \ 循环，`do...while` 循环内部的代码块至少会被执行一次，因为条件是在代码块执行后才进行评估的。即使条件（`$counter <= 10`）从一开始就是\
  \ `false`，代码块在检查条件前仍会执行一次。因此，即使 `$counter` 初始化为 `20`，消息也会显示一次。\n\n#### for 循环\n\n\
  `for` 循环是一种控制结构，用于重复执行代码块指定的次数。当你预先知道想要执行的迭代次数时，它特别有用。\n\n`for` 循环的通用语法如下：\n\n![Image](img/image-53.png)\n\
  \n*   **初始化**：这是初始化循环控制变量的地方。\n*   **条件**：在每次循环迭代前评估此条件。如果为 `true`，则执行代码块。否则，循环结束。\n\
  *   **增量**：此步骤在每次迭代时修改循环控制变量。\n\n注意这三个组件由分号（`;`）分隔。\n\n`for` 循环提供了一种简洁的方式来编写需要初始化、条件判断和增量操作的循环。\n\
  \n让我们通过一个具体的例子来更好地理解其工作原理。假设我们要显示从 1 到 5 的数字。\n\n```php\nfor ($i = 1; $i <= 5; $i++)\
  \ {\n    echo $i . \"<br>\";\n}\n```\n\n在该示例中：\n\n*   初始化是 `$i = 1`，我们将控制变量 `$i`\
  \ 初始化为 1。\n*   条件是 `$i <= 5`，只要变量 `$i` 小于或等于 5，循环将继续运行。\n*   增量是 `$i++`，我们在每次迭代时增加\
  \ `$i` 的值。\n\n该代码的结果将显示从 1 到 5 的数字。\n\n![Image](img/image-54.png)\n\n让我们看另一个例子，显示数字\
  \ 7 的乘法表：\n\n```php\nfor ($i = 1; $i <= 10; $i++) {\n    $result = 7 * $i;\n   \
  \ echo \"7 x $i = $result <br>\";\n}\n```\n\n在此代码中，`for` 循环的每次迭代计算 7 与 `$i` 值的乘积并将结果存储在变量\
  \ `$result` 中，然后显示结果。\n\n因此，运行此代码将显示 7 的乘法表。\n\n![Image](img/image-55.png)\n\n示例：\n\
  \n以下示例说明了使用 PHP `for` 循环生成具有不同层级的 HTML 标题标签。循环遍历 1 到 6 的标题层级，并显示带有相应标题层级的句子。\n\n\
  ```php\nfor ($i = 1; $i <= 6; $i++) {\n    echo \"<h$i>Here is the $i level title</h$i>\"\
  ;\n}\n```\n\n执行此代码得到以下结果：\n\n![Image](img/image-56.png)\n\n#### 比较 while 循环和 for\
  \ 循环\n\n虽然 `while` 和 `for` 循环具有不同的语法，但它们都履行相同的角色，即只要给定条件为 `true`，就重复执行代码块。然而，在某些情况下，根据上下文，可能会首选其中一种。\n\
  \n一般来说，`for` 循环的使用频率高于 `while` 循环，但这也可能取决于个别开发者的偏好和习惯。\n\n确实，`for` 和 `while` 循环都执行相同的功能，即只要条件得到验证，就重复执行代码块。但何时应该选择其中一个而不是另一个？\n\
  \n答案很简单：如果你预先知道所需的重复次数，最好使用 `for` 循环。另一方面，如果重复次数是不确定的且取决于某个条件，则 `while` 循环更合适。这使你能够保持更灵活的循环结构，适用于重复次数未预定义的情况。\n\
  \n#### 总结\n\n为了决定使用哪种类型的循环，重要的是确定迭代次数是否预先已知。如果是这种情况，通常首选 `for` 循环。另一方面，如果代码块至少需要执行一次，则\
  \ `do...while` 循环更合适。最后，如果代码块仅基于初始条件执行，则通常使用 `while` 循环。选择最适合每种特定情况需求的循环至关重要。下图说明了\
  \ `for`、`do...while` 和 `while` 循环的用法。\n\n![Image](img/image-57.png)\n\n#### 结论\n\
  \n总之，本章关于 PHP 循环的内容让我们发现了管理程序中重复任务的强大工具。我们探讨了 `while`、`do...while` 和 `for` 循环，以及它们的区别和适用场景。这些结构赋予我们灵活性，可以执行代码块设定的次数，或直到满足某个条件。\n\
  \n我们还讨论了在何种情况下一种循环可能优于另一种，这取决于待解决问题的复杂性。通过理解每种循环的细微差别，并在不同场景中练习其用法，你将能够编写更高效、更易读的程序。\n\
  \n重要的是要注意，本章未涵盖 `foreach` 循环，它将在数组章节中详细学习。同时，请继续探索和实验 `while`、`do...while` 和 `for`\
  \ 循环，因为它们是你 PHP 开发工具箱中的基本要素。\n\n#### 练习\n\n#### 练习 8\n\n编写一个程序，使用 `while` 循环显示从\
  \ 10 到 50 的整数。\n\n#### 练习 9\n\n使用 `for` 循环，编写一个程序计算从 1 到 20 所有整数的乘积（1x2x3x4x5x.....x19x20）。\n\
  \n然后显示结果。\n\n#### 练习 10\n\n使用 `for` 循环，编写 7 的乘法表（1 到 100 所有数字）。该表应以无序列表形式呈现。\n\n\
  #### 练习 11\n\n编写一个程序计算以下求和：\n\n1+3+3² + 3³ + 3⁴ + 3⁵ + ... ... + 3²⁰\n\n### 第 4\
  \ 章\n\n### PHP 函数与生成器\n\n欢迎来到 PHP 函数章节！函数是任何编程语言的重要组成部分，PHP 也不例外。它们使代码能够以模块化方式组织、高效复用，并变得更具可读性和可维护性。\n\
  \n在本章中，我们将深入探讨 PHP 函数的各个方面。我们将从函数的定义和使用介绍开始，包括声明、调用以及参数和返回值的处理。接下来，我们将研究变量和函数的作用域，以及\
  \ PHP 预定义函数的使用。\n\n我们还将深入探讨更高级的主题，例如递归函数、匿名函数、带默认参数的函数和可变参数函数。我们将了解如何包含包含函数的外部文件，以及如何实施良好的函数命名和文档实践。\n\
  \n我们将通过实际例子说明函数的用处，展示它们如何用于解决 PHP 开发中遇到的常见问题。\n\n无论你是初学者还是经验丰富的开发者，本章都将为你提供掌握 PHP\
  \ 中创建和使用函数艺术所需的知识和技能。那么，让我们一起踏上这段探索 PHP 函数的精彩旅程吧！\n\n#### PHP 函数简介\n\n函数是可定义一次并在脚本的多个位置甚至多个不同脚本中复用的\
  \ PHP 代码块。它们将相似的指令和操作分组在一起，使代码更易于管理和维护。在 PHP 中，函数在程序的组织和模块化中起着至关重要的作用。\n\n#####\
  \ 函数的定义：\n\n\n\n\n### PHP 函数\n\nPHP 中的函数是一组执行特定任务的指令，可以接受参数作为输入以自定义其行为。如果需要，它也可以返回一个输出值。函数的定义包括一个\
  \ `name`（名称）、一个 `optional arguments`（可选参数）列表以及一个包含待执行 `instructions`（指令）的函数体。\n\n\
  #### 使用函数的好处\n\n**可复用性**：函数通过将相似的功能组合在一起，避免了代码冗余，使得在不同场景下复用代码变得更加容易。\n\n**模块化**：通过将代码划分为不同的函数，代码变得更易于管理、理解和维护。\n\
  \n**抽象性**：函数抽象了实现细节，使代码更易于理解和修改。\n\n**组织性**：函数可用于通过将相关函数分组来组织代码，使代码更清晰、更具可读性。\n\n\
  #### PHP 函数的通用结构\n\nPHP 函数的通用结构包含以下元素：\n\n![Image](img/image-58.png)\n\n- **function**：在\
  \ PHP 中用于声明函数的关键字。\n- **function_name**：函数的名称，在脚本中必须唯一。\n- **(param1, param2, ...)**：函数可接受作为输入的\
  \ `optional`（可选）参数列表。\n- **{ }**：指示函数体开始和结束的定界符，其中定义了待执行的指令。\n\nPHP 函数的通用结构简单而强大，为在应用程序中创建自定义的、可复用的功能提供了极大的灵活性。\n\
  \n#### 声明和使用函数\n\n##### 无参数函数\n\n如前所述，在 PHP 中，使用 `function` 关键字声明函数，后跟函数名和圆括号，圆括号中可包含可选的函数参数。某些函数执行任务不需要参数。它们定义时圆括号中不带参数。\n\
  \n以下是无参数函数的示例：\n\n```\n<?php\n\n function displayMessage() {  \n\n $message = \"\
  Hello and welcome to the world of PHP.\";  \n\n echo $message;  \n\n }\n\n?>\n```\n\
  \n这段代码定义了一个名为 `displayMessage()` 的函数，它不接受任何参数，声明一个包含字符串 \"Hello and welcome to the\
  \ world of PHP.\" 的变量 `$message`，然后使用 `echo` 显示该变量。但如果你运行这段代码，不会得到任何结果！事实上，在此阶段，虽然函数已定义，但除非在程序的某处调用它，否则不会自动执行。函数调用可以在代码的多个位置进行，从而允许在不同地方复用同一代码块，而无需每次重写。换句话说，需要函数调用来执行其包含的代码块。\n\
  \n要调用 `displayMessage()` 函数，只需将函数的调用行添加到脚本中（函数外部），如下所示：\n\n```\n<?php  \n\n function\
  \ displayMessage() {  \n\n $message = \"Hello and welcome to the world of PHP.\"\
  ;  \n\n echo $message;  \n\n }\n\n displayMessage();  \n\n?>\n```\n\n执行此代码得到以下结果：\n\
  \n![Image](img/image-59.png)\n\n##### 带参数函数\n\n参数是在调用函数时传递给函数的值。这些值可在函数内部用于执行操作。以下是一个接受两个参数的函数示例：\n\
  \n```\n<?php\n\n //Definition of the function that calculates the sum  \n\n function\
  \ addition($a, $b) {  \n\n $sum = $a + $b;  \n\n echo \"The sum is: $sum \" ;  \n\
  \n }  \n\n addition(10, 20); // Call function with arguments  \n\n?>\n```\n\n在本例中，我们定义了一个名为\
  \ `addition()` 的函数，它接受两个参数 `$a` 和 `$b`，代表要相加的两个数字。在函数内部，我们将两个参数相加并将结果存储在变量 `$sum`\
  \ 中。然后，我们使用 `echo` 语句显示结果，并附带一条指示计算出的总和的消息。\n\n定义函数后，我们调用它，传递两个值 10 和 20 作为参数。函数将这两个值相加并显示结果：\"\
  The sum is: 30\"。\n\n![Image](img/image-60.png)\n\n##### 从函数返回值\n\n函数可以在其被调用的位置使用\
  \ `return` 关键字返回一个值。以下是一个计算圆柱体体积的函数示例：\n\n```\n<?php  \n\n //Definition of the function\
  \ that calculates the volume  \n\n function cylinder_volume($radius,$height) { \
  \ \n\n $volume = M_PI * $radius ** 2 * $height;  \n\n return $volume;  \n\n }  \n\
  \n echo cylinder_volume(3,10) ;  \n\n?>\n```\n\n在本例中，`cylinder_volume()` 函数接受两个参数作为输入：圆柱体的半径和高度。然后使用公式计算圆柱体的体积，其中\
  \ π 是数学常数 π。结果存储在变量 `$volume` 中。函数随后使用 `return` 关键字返回该体积值。\n\n当使用 `echo cylinder_volume(3,\
  \ 10)` 调用函数时，它计算半径为 3 单位、高度为 10 单位的圆柱体的体积，然后使用 `echo` 命令显示该体积，在本例中结果为 **282.74**\
  \ 平方单位。\n\n让我们看另一个示例，以表明函数可以被调用任意次数：\n\n```\n<?php\n\n //Definition of the function\
  \ that returns the double of a number  \n\n function double($number) {  \n\n return\
  \ $number * 2;  \n\n }\n\n?>\n```\n\n一旦定义了该函数，就可以在脚本中随时、按需多次调用它。\n\n```\n<?php \
  \ \n\n function double($number) {  \n\n return $number * 2;  \n\n }  \n\n //Function\
  \ calls  \n\n echo double(3); //Calculates the double of 3  \n\n echo \"<br>\" ;\
  \  \n\n echo double(10); //Calculates double 10  \n\n echo \"<br>\" ;  \n\n echo\
  \ double(12); //Calculates the double of 12  \n\n echo \"<br>\" ;  \n\n echo double(87);\
  \ //Calculates double 87  \n\n echo \"<br>\" ;  \n\n echo double(65); //Calculates\
  \ double 65  \n\n echo \"<br>\" ;  \n\n?>\n```\n\n执行此代码得到以下结果：\n\n![Image](img/image-61.png)\n\
  \n##### 带默认设置的函数\n\n在本节中，我们将了解带默认参数的函数。这些函数允许为某些参数定义默认值，意味着调用函数时可以省略这些参数。\n\n以下是定义带默认参数函数的通用语法：\n\
  \n![Image](img/image-62.png)\n\n在该语法中，`$param1` 是必需参数，而 `$param2` 是一个带有默认值的可选参数。\n\
  \n调用函数时，如果未为 `$parametre2` 传递参数，则将使用其默认值。否则，调用时传递的值将替换默认值。\n\n以下是使用带默认参数函数的示例：\n\
  \n```\n<?php\n\n function greet($name = \"My friend\") {  \n\n echo \"Hello, $name!\"\
  ;  \n\n }  \n\n // Function calls with and without parameter specification  \n\n\
  \ greet(); // Display \"Hello, My friend!\"  \n\n echo \"<br>\"; // Line break \
  \ \n\n greet(\"Alice\"); // Display \"Hello, Alice!  \n\n?>\n```\n\n在本例中，`greet()`\
  \ 函数接受一个默认值为 \"My friend\" 的 `$name` 参数。当不带参数调用函数时，它使用该默认值。当传递参数时，它会替换默认值，因此执行此代码得到以下结果：\n\
  \n![Image](img/image-63.png)\n\n带默认参数的函数在定义函数时提供了额外的灵活性，允许开发者指定默认行为，同时保留根据需要自定义它们的可能性。\n\
  \n示例 2：\n\n```\n<?php  \n\n // Function definition   \n\n function display_name($firstname,\
  \ $lastname = \"Mercier\") {  \n\n // Checks if the name is not \"Mercier\".  \n\
  \n if ($lastname != \"Mercier\") {  \n\n echo \"Your last name is $lastname and\
  \ your first name is $firstname\";  \n\n } else {  \n\n echo \"Your first name is:\
  \ $firstname\";  \n\n }  \n\n }  \n\n // call the display_name function with a single\
  \ argument (\"Amandine\")  \n\n display_name(\"Amandine\");  \n\n echo \"<br>\"\
  ;  \n\n?>\n```\n\n\n\n\n// 使用两个参数 (\"Sarah\" 和 \"Smith\") 调用 `display_name` 函数\n\
  \n`display_name(\"Sarah\", \"Smith\");`\n\n?>\n\n这段代码定义了一个 `display_name()` 函数，它接受一个必需参数\
  \ `$firstname` 和一个默认值为 \"Mercier\" 的可选参数 `$lastname`。调用函数时，它会检查 lastname 是否不同于 \"\
  Mercier\"。如果是，则同时显示名和姓，否则仅显示名。\n\n如果运行这段代码，将得到以下结果：\n\n![Image](img/image-64.png)\n\
  \n*   当我们使用单个参数调用函数时 (`display_name(\"Amandine\")`)，它使用名字 \"Amandine\" 和默认姓氏 \"\
  Mercier\"，因此显示 \"Your first name is: Amandine\"。\n*   当我们使用两个参数调用函数时 (`display_name(\"\
  Sarah\", \"Smith\")`)，它使用指定的名字 \"Sarah\" 和姓氏 \"Smith\"，因此显示 \"Your last name is\
  \ Smith and your first name is Sarah\"。\n\n##### 按引用传参的函数\n\n为了引入本节，让我们来看一段将作为参数传递的数字加倍的简单函数代码：\n\
  \n```php\nfunction double($number) {\n    $number *= 2;\n}\n\n$x = 10;\ndouble($x);\
  \ // 调用 double() 函数\necho $x;\n```\n\n这段代码定义了一个名为 \"double\" 的函数，它接受一个参数 `$number`。在函数内部，使用复合赋值运算符\
  \ `*=` 将 `$number` 的值乘以 2。这意味着 `$number` 变量将被加倍。\n\n接下来，变量 `$x` 被初始化为 10。然后使用 `$x`\
  \ 作为参数调用 `double` 函数。\n\n如果运行这段代码，你将得到变量 `$x` 的值。在本例中，你将始终得到 10，因为 `double` 函数使用的是\
  \ `$x` 值的**副本**，而不是对变量本身的引用。\n\n然而，有时你可能需要函数直接修改作为参数传递的变量的值，并使该更改在程序的其余部分保持有效。为此，你可以使用按引用传参的概念。\n\
  \n按引用传参允许函数直接修改作为参数传递的变量的值。要声明按引用传参，请在函数签名中的参数名称前使用 `&` 符号。\n\n如果我们采用上面相同的示例，并在函数参数前添加\
  \ `&` 符号，这将允许 `double` 函数直接修改 `$x` 变量的值，因此在调用函数后显示 `$x` 时将得到 20。\n\n```php\nfunction\
  \ double(&$number) {\n    $number *= 2;\n}\n\n$x = 10;\ndouble($x); // 调用 double()\
  \ 函数\necho $x;\n```\n\n##### 按引用传参函数 vs. 按值传参函数\n\n按引用传参的函数允许你直接修改作为参数传递给函数的变量的值，且该更改在退出函数后仍然有效。与按值传参的函数（它们使用作为参数传递的变量值的副本）不同，按引用传参的函数直接作用于原始变量。\n\
  \n理解按引用传参函数的工作原理：\n\n*   当你调用函数并按**引用**传递参数时，PHP 会将原始变量的内存地址存储在内部引用中。\n*   在函数内部，当你使用此参数时，PHP\
  \ 会使用此内部引用直接访问原始变量并进行必要的修改。\n*   通过此参数对变量所做的任何修改都会直接影响原始变量，因为 PHP 处理的是变量本身的内存地址，而不是其值的副本。\n\
  \n这使得函数能够直接修改原始变量，并且这些修改在退出函数后仍然保留。这就是为什么当你需要修改变量的值并希望该修改在函数外部可见时，会使用按引用传参。\n\n\
  理解按值传参函数的工作原理：\n\n*   当你调用函数并按**值**传递参数时，PHP 会创建原始变量值的**副本**，并将其分配给一个**新的内存位置**以供函数内部使用。\n\
  *   在函数内部，对该按值传递参数所做的任何修改仅影响该**值的副本**，而不会修改函数外部的原始变量。\n*   当函数结束时，按值传递的参数值副本被**销毁**，原始变量保持不变。\n\
  \n这意味着在函数内部对按值传递参数所做的修改仅局限于该函数，在外部不可见。当你希望在函数内部使用变量的值而不修改函数外部的原始变量时，通常使用按值传参。\n\n\
  ##### 具有命名参数的函数\n\n在 PHP 中，函数还可以接受所谓的命名参数，这在调用具有多个参数的函数时提供了更大的灵活性。请看以下代码：\n\n```php\n\
  function infos_display($lastname, $firstname, $age, $isactive){\n    return \"Last\
  \ Name: $lastname, First Name: $firstname, Age: $age, Active: $isactive\";\n}\n\n\
  $person_info = infos_display(\"Dupont\", \"Jean_marc\", 32, True);\necho $person_infos;\n\
  ```\n\n在本例中，我们有一个名为 `infos_display` 的函数，它接受四个参数：`$lastname`、`$firstname`、`$age`\
  \ 和 `$isactive`。然后函数返回由这些参数组成的句子。\n\n然后我们调用此函数，并将返回的值存储在 `$person_info` 变量中，然后显示它。\n\
  \n如果运行这段代码，你将得到类似以下的结果：\n\n![Image](img/image-65.png)\n\n但是，如果在调用函数时不遵守参数的顺序会怎样？\n\
  \n```php\n$person_info = infos_display(32, True, \"Jean-Marc\", \"Dupont\");\necho\
  \ $person_info;\n```\n\n在本例中，我们尝试使用与定义不同的顺序传递参数来调用函数。我们没有遵守函数参数的顺序（姓、名、年龄、是否激活），而是反转了此顺序，并以不同的方式传递值：32\
  \ 代表姓，True 代表名，\"Jean-Marc\" 代表年龄，\"Dupont\" 代表是否激活。\n\n在这种情况下，执行代码将得到以下结果：\n\n\
  ![Image](img/image-66.png)\n\n我们显示个人信息时获得的结果是不正确的。我们没有得到预期的详细信息，而是得到了意外的输出。为了解决这个问题，PHP\
  \ 8 引入了命名参数的概念。实际上，命名参数允许以反转参数顺序的方式调用函数。\n\n使用命名参数，我们可以在调用函数时显式指定每个参数的名称，后跟冒号 (`:`)，再后跟其值。这确保了每个实参都与正确的形参相关联，无论它们在函数调用中传递的顺序如何。因此，即使我们在函数调用中反转了实参的顺序，使用命名参数也能保证函数根据其关联的参数正确处理每个值。以下是如何使用命名参数并解决反转函数参数顺序时可能出现的问题。\n\
  \n```php\nfunction infos_display($lastname, $firstname, $age, $isactive) {\n   \
  \ return \"Last Name: $lastname, First Name: $firstname, Age: $age, Active: $isactive\"\
  ;\n}\n\n$person_info = infos_display(age:32, isactive:True, firstname: \"Jean-Marc\"\
  , lastname: \"Dupont\");\necho $person_info;\n```\n\n当我们执行这段代码时，结果与调用 `infos_display()`\
  \ 函数并遵守参数顺序时获得的结果相同。\n\n![Image](img/image-67.png)\n\n#### PHP 中的类型声明\n\n\n\n\n\
  ### PHP 类型声明与变量作用域\n\n#### PHP 中的类型声明\n\n在 PHP 中，可以指定参数和函数返回值的类型，以提高代码清晰度并保证更好的数据完整性。PHP\
  \ 中可使用两种类型声明：严格类型和弱类型。\n\n##### 弱类型（默认）\n\n默认情况下，PHP 使用弱类型，这意味着函数参数和返回值的数据类型未显式声明。这提供了极大的灵活性，但有时会导致难以检测的错误。\n\
  \n**无类型声明的函数示例：**\n\n```php\n<?php\n\nfunction addition($a, $b) {\n    return $a\
  \ + $b;\n}\n\n$result1 = addition(5, 10);\necho $result1 . \"<br>\";\n\n$result2\
  \ = addition(5, \"10\");\necho $result2 . \"<br>\";\n\n?>\n```\n\n这段 PHP 代码定义了一个名为\
  \ `addition()` 的函数，它接受两个参数 `$a` 和 `$b`，并返回这两个参数的和。随后使用不同的参数调用了该函数两次。\n\n在本例中，`addition()`\
  \ 函数未指定其 `$a` 和 `$b` 参数的类型。它们可以是任意数据类型，函数的结果将取决于传入值的类型。\n\n在第一次调用 `addition(5, 10)`\
  \ 中，两个参数均为整数（`$a = 5` 且 `$b = 10`）。函数返回这两个数字的和（即 15），该值被赋给变量 `$result1`。最后输出 `$result1`\
  \ 的值，屏幕显示 15。\n\n在第二次调用 `addition(5, \"10\")` 中，第一个参数是整数（`$a = 5`），但第二个参数是字符串（`$b\
  \ = \"10\"`）。PHP 在加法运算时执行**自动类型转换**，将字符串 \"10\" 转换为整数。因此，函数同样返回 15（5 和 10 之和），该值被赋给变量\
  \ `$result2`。最后输出 `$result2` 的值，屏幕同样显示 15。\n\n总之，对 `addition()` 函数的两次调用结果相同（均为 15），尽管第二次调用对第二个参数使用了字符串。这是由于\
  \ PHP 在加法运算期间执行了自动类型转换。\n\n##### 严格类型\n\n严格类型随 PHP 7 引入，允许显式指定参数和函数返回值的数据类型。这使得类型不一致可在开发阶段尽早被检测到，有助于减少错误。\n\
  \n要启用严格类型，必须在 PHP 脚本开头声明指令 `declare(strict_types=1);`：\n\n![Image](img/image-68.png)\n\
  \n要声明参数类型，只需在每个参数前指定所需类型；要指定函数返回值的类型，在参数列表后添加冒号（`:`），后跟预期的返回类型。\n\n让我们修改前一个示例，指定参数类型和返回类型：\n\
  \n```php\n<?php\n\ndeclare(strict_types=1);\n\nfunction addition(int $a, int $b):\
  \ int {\n    return $a + $b;\n}\n\n$result1 = addition(5, 10);\necho $result1 .\
  \ \"<br>\";\n\n$result2 = addition(5, \"10\");\necho $result2 . \"<br>\";\n\n?>\n\
  ```\n\n运行此代码将得到类似如下的结果：\n\n![Image](img/image-69.png)\n\n结果首先显示数字 15，对应变量 `$result1`\
  \ 的值。当我们调用 `addition(5, 10);` 时，传入了两个整数，这与声明的类型一致。因此，函数将这两个整数相加并返回一个整数结果，存储在变量 `$result1`\
  \ 中，随后被显示。\n\n然而，在随后的调用 `addition(5, \"10\");` 中，我们传入了一个整数和一个字符串，这与声明的类型 `int` 不符。由于启用了**严格**类型，这会产生一个致命错误，因为提供的数据类型与函数预期的类型不匹配。因此，脚本停止并显示错误，而不会像未启用严格类型时那样自动将字符串转换为整数。\n\
  \n最后请注意，从 PHP 8 起，可以使用联合类型运算符 `|`（竖线）为同一参数指定多种类型。这允许定义参数可接受多种不同的数据类型。例如，若参数可以是整数或字符串，可按如下方式声明：\n\
  \n```php\n<?php\n\nfunction example(int|string $parameter1, float|int $parameter2)\
  \ {\n    // 函数体\n}\n\n?>\n```\n\n在本例中，`$parameter1` 可以是整数或字符串。而 `$parameter2` 可以是浮点数或整数。这为函数参数类型定义提供了更大的灵活性。\n\
  \n#### 变量的作用域\n\n变量作用域是编程中的一个基本概念，它决定了变量在 PHP 脚本中的可用范围。理解变量作用域对于编写结构良好的代码、避免逻辑错误以及确保程序平稳运行至关重要。\n\
  \n在 PHP 中，变量根据其在脚本中的位置不同，可以拥有不同的作用域。有些变量可在脚本的任何位置访问，而另一些则被限制在代码的特定部分。\n\n在本节中，我们将探讨\
  \ PHP 中不同类型的变量作用域，它们的定义和使用方式，以及有效处理它们的最佳实践。我们还将了解与变量作用域相关的常见陷阱及其规避方法。\n\n让我们首先了解\
  \ PHP 中变量作用域背后的主要概念，以及它们如何影响我们的代码编写方式。\n\n##### 全局作用域\n\n在 PHP 中，在任何函数外部声明的变量具有全局作用域。这意味着它们可以在\
  \ PHP 脚本的任何位置访问，无论是在函数内部还是外部。\n\n当变量在任何函数外部声明时，它自动成为全局变量。例如：\n\n```php\n<?php\n\n\
  $global_variable = \"I am a global variable\";\n\nfunction display_global_variable()\
  \ {\n    global $global_variable;\n    echo $global_variable;\n}\n\ndisplay_global_variable();\
  \ // 调用函数\n\n?>\n```\n\n在本例中，`$global_variable` 是一个全局变量，因为它在任何函数外部声明。它可以在 `display_global_variable()`\
  \ 函数内部使用，但前提是必须使用 `global` 关键字。\n\n重要的是要注意，使用全局变量会降低代码的可读性并增加维护难度，因为它们可能在脚本的不同位置被不可预测地修改。因此建议限制全局变量的使用。\n\
  \n执行此代码显示结果：\n\n![Image](img/image-70.png)\n\n**警告**：如果尝试在函数内部使用全局变量而不使用 `global`\
  \ 关键字声明它：\n\n```php\n<?php\n\n$global_variable = \"I am a global variable\";\n\n\
  function display_global_variable() {\n    echo $global_variable;\n}\n\ndisplay_global_variable();\
  \ // 调用函数\n\n?>\n```\n\n在这种情况下，你将得到类似如下的错误消息：\n\n![Image](img/image-71.png)\n\n\
  ##### 局部作用域\n\n在局部作用域中，变量在函数内部声明，只能在该函数内部访问。这些变量仅在函数运行期间存在，函数一结束即被销毁。这意味着它们不能在声明它们的函数外部使用。这种作用域限制有助于避免代码不同部分之间的变量名冲突。\n\
  \n以下示例演示了变量的局部作用域：\n\n```php\n<?php\n\nfunction displayMessage() {\n    $message\
  \ = \"Hello, world!\";\n    echo $message;\n}\n\ndisplayMessage(); // 显示 \"Hello,\
  \ world!\"\n\necho $message; // 尝试访问变量 $message\n\n?>\n```\n\n\n\n\n\n### PHP 中的变量作用域\n\
  \n在本例中，`$message` 变量是在 `displayMessage()` 函数内部声明的，这使其成为该函数的局部变量。此 `$message` 变量无法在其定义所在的函数外部访问。当我们尝试在函数外部显示该变量的值时，会生成一个错误，提示在代码的这一点上无法识别\
  \ `$message` 变量。\n\n![Image](img/image-72.png)\n\n此演示突出了 PHP 中变量的局部作用域。局部变量仅限于声明它们的函数内部，且不能在该函数外部使用。这有助于避免命名冲突，并使代码更加模块化和有条理。\n\
  \n##### 静态作用域\n\n在函数内部创建的局部变量，会在函数执行结束时自动销毁。然而，在某些情况下，我们可能需要在函数的连续调用之间保留该变量的值，以便稍后使用，因此引入了静态作用域的概念。\n\
  \nPHP 中的静态变量作用域允许变量在连续的函数调用之间保留其值。与每次函数调用时都会创建和销毁的局部变量不同，静态变量即使在函数退出后仍保留其值。\n\n\
  请看以下示例：\n\n```php\n<?php\n\nfunction counter() {\n\n    $counter = 0;\n\n    $counter++;\n\
  \n    echo \"Number of function calls : $counter <br>\";\n\n}\n\ncounter();\n\n\
  counter();\n\ncounter();\n\n?>\n```\n\n在本例中，我们有一个名为 `counter()` 的函数，每次调用该函数时，它都会将名为\
  \ `$counter` 的局部变量初始化为零。然后在每次调用时将此变量加 1，并显示当时的函数调用总数。然而，由于 `$counter` 变量每次函数调用时都会被重新定义且属于该函数的局部变量，因此它每次都会被重置为零。因此，每次调用该函数时，显示的调用次数将始终为“1”。\n\
  \n![Image](img/image-73.png)\n\n这突出了这样一个事实：函数中局部变量的作用域仅限于该函数的特定调用，并且局部变量在函数调用完成后会自动销毁。\n\
  \n然而，在某些情况下，我们可能需要在连续的函数调用之间保留该变量的值。为此，只需使用 `static` 关键字声明变量 `$counter` 即可：\n\n\
  ```php\n<?php\n\nfunction counter() {\n\n    static $counter = 0;\n\n    $counter++;\n\
  \n    echo \"Number of function calls : $counter <br>\";\n\n}\n\ncounter();\n\n\
  counter();\n\ncounter();\n\n?>\n```\n\n在本例中，`$counter` 变量使用 `static` 关键字在 `counter()`\
  \ 函数内部声明为静态变量。每次调用 `counter()` 函数时，`$counter` 变量加 1，且其值在函数的连续调用之间**保留**。这样，每次调用都会显示函数的总调用次数，且该次数随每次调用而递增。\n\
  \n![Image](img/image-74.png)\n\n简而言之，PHP 中的变量作用域是一个基本概念，它决定了变量在脚本中的何处以及何时可以被使用。在前文中，我们已经了解了三种变量作用域类型：全局、局部和静态。理解这些不同的作用域对于编写健壮、可维护的代码至关重要。现在让我们来看看这些作用域类型的总结。\n\
  \n##### 全局作用域\n\n*   在任何函数外部声明的变量被视为全局变量。\n*   可以使用 `global` 关键字在任何函数内部使用它们。\n*\
  \   它们的作用域延伸至整个 PHP 脚本。\n*   在函数内部对全局变量所做的更改在函数外部也可见。\n\n##### 局部作用域\n\n*   在函数内部声明的变量被视为局部变量。\n\
  *   它们只能在声明它们的函数内部访问。\n*   局部变量在声明它们的函数结束时立即被销毁（释放内存）。\n*   局部变量可以与全局变量同名，但它们具有局部作用域，不会修改同名的全局变量。\n\
  \n##### 静态作用域\n\n*   静态变量使用 `static` 关键字在函数内部声明。\n*   与普通局部变量不同，静态变量在函数执行结束时不会被销毁。\n\
  *   静态变量的值在连续的函数调用之间得以保留。\n*   对函数的每次后续调用都会保留静态变量的值，其值为上一次调用结束时的值。\n*   静态变量允许你在函数调用之间存储信息，而无需使用全局变量，从而为局部变量的值提供了一定程度的持久性。\n\
  \n![Image](img/image-75.png)\n\n### 生成器：一种特殊的函数类型\n\nPHP 中的生成器是一种特殊的函数，它允许你高效且简洁地创建自定义迭代器。与返回值然后终止的传统函数不同，生成器可以在某个点暂停执行，同时保留其内部状态。这意味着它们可以随着时间的推移产生一系列值，使它们特别适用于处理大量数据或生成无限序列。\n\
  \n定义生成器的语法类似于普通函数，但我们不使用 `return` 关键字来返回值，而是使用 `yield` 关键字。下面是一个生成偶数序列的简单生成器示例：\n\
  \n```php\n<?php\n\nfunction generate_even_numbers($max) {\n\n    for ($i = 0; $i\
  \ <= $max; $i += 2) {\n\n        yield $i;\n\n    }\n\n}\n\n?>\n```\n\n在本例中，函数 `generate_even_numbers()`\
  \ 是一个生成器，它生成不超过给定最大值的偶数序列。当调用此函数时，它不会立即开始执行其代码。相反，它返回一个生成器对象，该对象可以使用 `foreach` 循环或其他迭代方法进行迭代。\n\
  \n以下是如何使用此生成器显示不超过 17 的偶数：\n\n```php\n<?php\n\nfunction generate_even_numbers($max)\
  \ {\n\n    for ($i = 0; $i <= $max; $i += 2) {\n\n        yield $i;\n\n    }\n\n\
  }\n\nforeach (generate_even_numbers(17) as $number) {\n\n    echo $number . \" \"\
  ;\n\n}\n```\n\n这段代码将产生：`0 2 4 6 8 10 12 14 16` ：\n\n![Image](img/image-76.png)\n\
  \n这里有一个更简单的生成器示例，它生成属于给定区间的整数序列：\n\n```php\n<?php\n\nfunction generate_even_numbers2($min,\
  \ $max) {\n\n    for ($i = $min; $i <= $max; $i++) {\n\n        yield $i;\n\n  \
  \  }\n\n}\n\n// 使用生成器显示一系列数字\n\nforeach (generate_even_numbers2(21, 35) as $number)\
  \ {\n\n    echo $number . \" \";\n\n}\n\n?>\n```\n\n这段代码将产生以下结果：\n\n![Image](img/image-77.png)\n\
  \n#### 生成器委托\n\n生成器委托是一个高级概念，它允许一个生成器调用另一个生成器以获取值。这使得解耦值生成逻辑并在新生成器中复用现有生成器成为可能。\n\
  \n以下是生成器委托的示例：\n\n假设我们有两个生成器，一个生成偶数，另一个生成奇数。我们可以创建第三个生成器，使用这两个生成器来生成一个包含偶数和奇数的序列。\n\
  \n```php\n<?php\n\n// 第一个偶数生成器\n\nfunction generate_even_numbers($max) {\n\n   \
  \ for ($i = 0; $i <= $max; $i += 2) {\n\n        yield $i;\n\n    }\n\n}\n\n// 第二个奇数生成器\n\
  \nfunction generate_odd_numbers($max) {\n\n    for ($i = 1; $i <= $max; $i += 2)\
  \ {\n\n        yield $i;\n\n    }\n\n}\n\n// 第三个生成器调用前两个生成器\n\nfunction generate_even_odd_numbers($evenmax,\
  \ $oddmax) {\n\n    yield from generate_even_numbers($evenmax);\n\n    yield from\
  \ generate_odd_numbers($oddmax);\n\n}\n\n// 使用生成器显示一系列偶数和奇数\n\nforeach (generate_even_odd_numbers(20,\
  \ 30) as $number) {\n\n    echo $number . \" \";\n\n}\n\n?>\n```\n\n\n\n\n\n这段代码定义了三个数字生成器：`generate_even_numbers()`、`generate_odd_numbers()`\
  \ 和 `generate_even_odd_numbers()`。\n\n第一个生成器 `generate_even_numbers()` 生成一个不超过指定最大值的偶数序列。第二个生成器\
  \ `generate_odd_numbers()` 生成一个不超过指定最大值的奇数序列。\n\n第三个生成器 `generate_even_odd_numbers()`\
  \ 使用生成器委托（使用 `yield from` 关键字）来调用前两个生成器，并生成一个交替的偶数和奇数序列，直到达到为每个生成器指定的最大值。\n\n接下来，代码使用生成器\
  \ `generate_even_odd_numbers()` 来显示一个数字序列，其中偶数不超过 20，奇数不超过 30。这是通过一个 foreach 循环实现的，该循环遍历生成器生成的值并在屏幕上显示它们。\n\
  \n执行此代码将产生以下结果：\n\n![Image](img/image-78.png)\n\n#### 结论\n\nPHP 函数是基本的编程元素，它们允许将代码分组在一起，使其可复用且模块化。它们提供了一种高效的方式来组织和构建代码，使维护和项目管理更加容易。我们探讨了函数的各个方面，包括它们的声明、调用、参数管理和变量作用域，以及类型声明和命名参数等更高级的概念。\n\
  \n理解函数的工作原理以及如何恰当地使用它们对任何 PHP 开发者至关重要，因为这能够创建更健壮、可扩展且易于维护的应用程序。通过掌握本章介绍的概念，你将能够编写更整洁、更模块化、更高效的代码，这将显著提高你作为\
  \ PHP 开发者的生产力。\n\n#### 练习\n\n#### 练习 12\n\n编写一个函数，测试一个数字是否为 3 的倍数，并根据测试结果显示一条消息。\n\
  \n#### 练习 13\n\n编写一个 PHP 函数，接收三个数字作为输入，并返回这三个数字中最大的一个。\n\n#### 练习 14\n\n编写一个函数，显示找到作为参数给定的两位整数所需的随机数。\n\
  \n### 第 5 章\n\n### PHP 中的数组\n\n数组在编程中起着至关重要的作用，提供了一种强大且灵活的方式来组织和操作数据集。在 PHP 中，数组是多功能的数据结构，可以包含不同类型的有序元素集合，例如数字、字符串甚至其他数组。本章将详细探讨\
  \ PHP 中的数组，从它们的声明和初始化到使用预定义函数进行高级操作。掌握数组对于创建动态、高性能的 Web 应用程序至关重要。\n\nPHP 中的数组是一种数据结构，允许你在单个变量中存储多个值。这些值可以是各种类型，如整数、字符串、布尔值等。数组中的每个值都与一个键关联，该键可以是数字或字符串，具体取决于数组类型。\n\
  \n在 PHP 中，有几种类型的数组。让我们一起探索 PHP 数组的世界，发现它们所提供的所有功能！\n\n![Image](img/image-79.png)\n\
  \n#### 索引数组（数字索引）\n\n索引数组，也称为数字索引数组，是每个元素都与一个数字索引关联的数据结构。这些索引通常从零开始，并为每个额外元素递增 1。索引数组是\
  \ PHP 中最简单的数组形式之一，广泛用于存储有序的数据集合。\n\n在本节中，我们将探讨如何在 PHP 中声明、初始化和操作索引数组。我们还将了解常见操作，如添加、修改、删除和遍历索引数组的元素。通过理解这些基本概念，你将能够在\
  \ PHP 项目中高效地使用索引数组。\n\n##### 索引数组的声明和初始化\n\n在 PHP 中，你可以通过多种方式声明和初始化索引数组。以下是一些示例：\n\
  \n```php\n<?php\n\n // 声明一个空的索引数组  \n\n $empty_array = [];\n\n // 声明并初始化一个带有值的索引数组\
  \  \n\n $numbers = [10, 20, 30, 40, 50];  \n\n // 使用 array() 函数声明一个索引数组  \n\n $lastnames\
  \ = array(\"Emma\", \"Alice\", \"Lina\", \"Sarah\", \"Thomas\");\n\n?>\n```\n\n\
  在本例中，我们定义了三种数组声明类型：\n\n第一种声明：`$empty_array = [];` 声明了一个名为 `$empty_array` 的空索引数组。空方括号\
  \ `[]` 用于在 PHP 中创建一个新的空数组。\n\n第二种声明：\n\n`$numbers = [10, 20, 30, 40, 50];` 声明并初始化了一个名为\
  \ `$numbers` 的索引数组，其值为 `[10, 20, 30, 40, 50]`。值由逗号分隔并包含在方括号 `[]` 中。\n\n第三种声明：\n\n\
  `$lastnames = array(\"Emma\", \"Alice\", \"Lina\", \"Sarah\", \"Thomas\");` 使用 `array()`\
  \ 函数声明了一个名为 `$lastnames` 的索引数组。`array()` 函数通过在括号中将值作为参数指定来创建数组。值由逗号分隔并包含在圆括号 `()`\
  \ 中。\n\n总之，这些索引数组声明展示了在 PHP 中创建和初始化索引数组的不同方式，无论是使用空方括号 `[]` 还是 `array()` 函数。\n\n\
  ##### 访问索引数组的元素\n\n要访问索引数组的特定元素，请使用其对应的数字索引，从 0 开始。语法如下：\n\n![Image](img/image-80.png)\n\
  \n在上面的示例中，如果你想访问 `numbers` 数组的元素，只需使用它们的索引，同时记住第一个元素的索引始终为 0：\n\n```php\n<?php \
  \ \n\n $numbers = [10, 20, 30, 40, 50];\n\n echo $numbers[0].\"<br>\";  \n\n echo\
  \ $numbers[1].\"<br>\";  \n\n echo $numbers[2].\"<br>\";  \n\n echo $numbers[3].\"\
  <br>\";  \n\n echo $numbers[4].\"<br>\";  \n\n?>\n```\n\n如果你执行此代码，将得到以下结果：\n\n![Image](img/image-81.png)\n\
  \n##### 向索引数组添加元素\n\n要向索引数组添加新元素，只需将值赋给一个新索引。PHP 会自动处理正确的索引。以下是如何向前面示例中的 `$numbers`\
  \ 和 `$name` 数组添加新元素的示例：\n\n```php\n<?php  \n\n // 声明并初始化一个带有值的索引数组  \n\n $numbers\
  \ = [10, 20, 30, 40, 50];  \n\n // 使用 array() 函数声明一个索引数组  \n\n $lastnames = array(\"\
  Emma\", \"Alice\", \"Lina\", \"Sarah\", \"Thomas\");  \n\n $numbers[] = 60; // 在数组末尾添加\
  \ 60  \n\n $lastnames[5] = \"Eve\"; // 在数组索引 5 处添加 \"Eve\"  \n\n?>\n```\n\n执行此代码后，数组\
  \ `$numbers` 和 `$names` 变为：\n\n`$numbers` = `[10, 20, 30, 40, 50, 60]` \n\n`$lastname`\
  \ = `[\"Emma\", \"Alice\", \"Lina\", \"Sarah\", \"Thomas\", \"Eve\"]`\n\n##### 修改和删除元素\n\
  \n要修改索引数组中现有的元素，可以通过其索引访问该元素并为其赋予新值。要删除元素，可以使用 `unset()` 函数。\n\n示例：\n\n如果你想修改前面示例中的\
  \ `$number` 数组，将元素 20 替换为 100，只需添加代码行：\n\n```php\n // 通过将第二个元素替换为 100 来修改它\n\n $numbers[1]\
  \ = 100; // 要修改的元素索引为 1\n```\n\n如果你想从 `$lastname` 数组中删除 \"Sarah\" 元素，只需使用 PHP 中预定义的\
  \ `unset()` 函数：\n\n```php\n unset($lastnames[3]); // 删除第四个元素\n```\n\n##### 遍历索引数组\n\
  \n要在 PHP 中遍历索引数组，可以使用各种流程控制结构，例如我们在前一章学习的 `for` 循环，或我们接下来将要学习的 `foreach` 循环。\n\n\
  For 循环：\n\n\n\n\n\n当您预先知道数组中的元素数量时，会使用 `for` 循环。您可以使用索引遍历数组的每个元素。要查明数组中的元素数量，PHP\
  \ 提供了一个名为 `count()` 的函数，它返回作为参数传递的数组中的元素数量。\n\n示例：\n\n```php\n$numbers = [10, 20,\
  \ 30, 40, 50];\n$length = count($numbers);\nfor ($i = 0; $i < $length; $i++) {\n\
  \    echo $numbers[$i] . \"<br>\";\n}\n```\n\n在本例中，我们有一个名为 `$numbers` 的索引数组，包含五个元素：10、20、30、40\
  \ 和 50。`count()` 函数用于获取数组中元素的总数，并存储在 `$length` 变量中。\n\n接下来，使用 `for` 循环通过索引遍历数组的每个元素。变量\
  \ `$i` 初始化为 `0`，只要 `$i` 的值小于 `$length`，循环就会继续。在每次迭代中，索引 `$i` 处的数组元素值会通过 `echo` 显示，后跟一个\
  \ `<br>` 标签以在 HTML 渲染中创建换行。执行此代码将显示以下结果：\n\n![Image](img/image-82.png)\n\n`for`\
  \ 循环非常适合浏览此类数组，且其用法完全得当。然而，我们现在将转向另一种专门为数组设计的循环：`foreach` 循环。\n\n#### Foreach 循环\n\
  \n当您想要遍历数组的每个元素，而不必预先担心知道数组大小时，会使用 `foreach` 循环。`foreach` 循环有两种不同的语法；我们用于遍历索引数组的第一种语法是：\n\
  \n![Image](img/image-83.png)\n\n在此语法中，`$value` 变量在迭代期间直接包含 `$table` 数组中每个元素的值。在这种形式的\
  \ `foreach` 循环中，无法访问元素键。这种 `foreach` 循环语法允许您仅根据值遍历数组元素，而无需检索与每个值关联的键。每次循环迭代时，`$value`\
  \ 变量包含数组中当前遍历元素的值。当仅需要元素的值而无需担心关联键时，这简化了数组遍历的过程。\n\n示例：\n\n```php\n$numbers = [10,\
  \ 20, 30, 40, 50];\nforeach ($numbers as $number) {\n    echo $number . \"<br>\"\
  ;\n}\n```\n\n本例使用 `foreach` 循环遍历 `$numbers` 数组。在此循环中，`$number`（单数形式）代表每次迭代时 `$numbers`\
  \ 数组中的每个元素。实际上，在每次迭代中，`$number` 变量取数组中 `current`（当前）元素的值。因此，在每次循环中，`$number` 的值被显示，后跟一个用于换行的\
  \ `<br>` 标签。此循环便于浏览数组的所有元素，而无需像 `for` 循环那样显式管理索引。此代码的输出结果与使用 `for` 循环获得的结果完全相同。\n\
  \n#### 关联数组\n\n顾名思义，关联数组将键与值关联起来。与通过数字位置访问值的索引数组不同，在关联数组中，值是通过其关联的键来访问的。以下是在 PHP\
  \ 中声明和初始化关联数组的方法：\n\n##### 声明空关联数组\n\n声明空关联数组的方法与声明索引数组相同：\n\n```php\n$empty_associative_array\
  \ = [];\n```\n\n在本例中，我们使用 PHP 的数组语法声明并初始化一个空关联数组。变量 `$empty_associative_array` 被赋值为一个空关联数组，使用空的双方括号，即一个不包含任何键值对的数组。\n\
  \n此声明创建了一个空关联数组，可用于稍后在代码中通过将键与值关联来存储数据。\n\n##### 声明并初始化带值的关联数组\n\n关联数组的工作原理与索引数组相同，不同之处在于每个键关联一个不同的名称而不是数字。让我们以以下图示中的数组为例。我们如何在\
  \ PHP 中声明并初始化此数组？\n\n![Image](img/image-84.png)\n\n用于声明并初始化 `$person` 关联数组的语法如下：\n\
  \n```php\n$person = [\n    \"last_name\" => \"Dupont\",\n    \"first_name\" => \"\
  Amine\",\n    \"age\" => 29,\n    \"gender\" => \"M\",\n    \"country\" => \"France\"\
  \n];\n```\n\n在本例中，我们使用 PHP 的关联数组语法初始化一个关联数组 `$person`。\n\n此语法使用方括号 `[]` 来界定关联数组的开始和结束。在方括号内，数组的每个元素都是一个\
  \ `key-value`（键值）对，其中键后跟 `=>` 符号及其关联的值。键值对之间用逗号分隔。此语法允许您创建一个关联数组，其中每个键关联一个特定值。\n\
  \n键 \"last_name\"、\"first_name\"、\"age\"、\"gender\" 和 \"country\" 通过 `=>` 符号分别关联其对应的值：\"\
  Dupont\"、\"Amine\"、29、\"M\" 和 \"France\"。此表存储一个人的信息，如姓氏、名字、年龄、性别和国家。键用于访问表中的对应值。\n\
  \n##### 使用 array() 函数声明关联数组\n\n声明关联数组的第三种方法是使用 PHP 预定义的 `array()` 函数：\n\n```php\n\
  $grades = array(\n    \"Maths\" => 15,\n    \"Physics\" => 18,\n    \"English_language\"\
  \ => 12\n);\n```\n\n在本例中，我们使用 `array()` 函数初始化一个关联数组 `$grades`。此语法以 `array()` 关键字开始，后跟一个键值对列表。每个键值对通过指定键、后跟\
  \ `=>` 符号及其关联的值来定义。键值对之间用逗号分隔。此语法允许您创建一个关联数组，其中每个键关联一个特定值。\n\n因此，`$grades` 数组包含三个元素：\"\
  Maths\" 关联分数 15，\"Physics\" 关联分数 18，\"English_language\" 关联分数 12。键用于访问表中的对应值。\n\n\
  ##### 访问关联数组中的元素\n\n要访问关联数组中的特定元素，我们在方括号中使用对应的键。\n\n例如，要访问 `$person` 关联数组中的 \"first_name\"\
  \ 元素，我们使用 `$person[\"first_name\"]`。\n\n如果您在脚本中添加以下代码行，将检索并显示名字：\"Amine\"。\n\n```php\n\
  echo $person[\"first_name\"]; //retrieves and displays the first name: Amine\n```\n\
  \n要访问 `$grades` 数组中的数学成绩，我们使用 `$grades[\"Maths\"]`。\n\n```php\necho $grades[\"Maths\"\
  ]; //retrieve and display the Maths grade: 15\n```\n\n##### 向关联数组添加元素\n\n我们可以通过向新键赋值来向关联数组添加新元素。\n\
  \n例如，要向关联数组 `$person` 添加值为 \"amine.dupont@example.com\" 的 \"email\" 元素，我们使用：\n\n\
  ```php\n$person[\"email\"] = \"amine.dupont@example.com\";\n```\n\n要显示数组的所有元素，我们可以使用\
  \ PHP 中预定义的 `print_r()` 函数：\n\n```php\n$person = [\n    \"last_name\" => \"Dupont\"\
  ,\n    \"first_name\" => \"Amine\",\n    \"age\" => 29,\n    \"gender\" => \"M\"\
  ,\n    \"country\" => \"France\"\n];\n$person[\"email\"] = \"amine.dupont@example.com\"\
  ;\necho \"<pre>\";\nprint_r($person);\necho \"</pre>\";\n```\n\n\n\n\n在这段代码中，我们有一个名为\
  \ `$person` 的关联数组，包含五个键值对，分别表示一个人的不同信息：姓氏、名字、年龄、性别和国家。接着，使用语法 `$person[\"email\"\
  ] = \"amine.dupont@example.com\";` 向数组中添加了一个值为 \"amine.dupont@example.com\" 的新键\
  \ \"email\"。\n\n`print_r()` 函数用于显示 `$person` 数组的内容。通过用 HTML 标签 `<pre>` 和 `</pre>`\
  \ 包裹该函数，结果将在浏览器中以格式化、更易读的方式显示。\n\n如下图所示，运行此代码的结果将显示 `$person` 数组的完整内容，包括新添加的 \"\
  email\" 键，所有键值对均以可读格式呈现。\n\n![Image](img/image-85.png)\n\n##### 修改关联数组中的元素\n\n要更改关联数组中某个元素的值，只需向对应的键重新赋一个新值即可。\n\
  \n例如，要更改 `$person` 关联数组中该人的年龄，我们使用：\n\n```php\n$person[\"age\"] = 40;\n```\n\n执行这行代码后，`$person`\
  \ 数组中 \"age\" 元素的值变为 40。\n\n##### 从关联数组中删除元素\n\n要从关联数组中删除特定元素，我们使用 PHP 预定义的 `unset()`\
  \ 函数，并传入要删除元素的键。\n\n例如，要从 `$person` 关联数组中删除 \"gender\" 元素，我们使用：\n\n```php\nunset($person[\"\
  gender\"]);\n```\n\n##### 遍历关联数组\n\n关联数组是一种数据结构，其中每个元素都与一个键关联，而不是数字索引。这允许使用显式键而不是数字索引来访问值。\n\
  \n以下是遍历关联数组的一些方法：\n\n###### 使用 foreach 循环\n\n`foreach` 循环是遍历关联数组特别有效的工具。它允许你轻松浏览数组中的每个键值对。我们已经见过它用于索引数组。现在让我们探索如何将此循环用于关联数组。这是\
  \ `foreach` 循环的第二种语法：\n\n![Image](img/image-86.png)\n\n在此语法中，我们有：\n\n*   `$table`：表示要遍历的表（数组）。\n\
  *   `$key`：表示数组中当前元素的键。\n*   `$value`：表示数组中当前元素的值。\n\n`foreach` 循环遍历数组的每个元素，将每个元素的键和值分别赋给变量\
  \ `$key` 和 `$value`。循环内部的指令将针对数组的每个元素执行一次。\n\n这是一个示例：\n\n```php\n<?php\n\n$person\
  \ = [\n    \"last_name\" => \"Dupont\",\n    \"first_name\" => \"Amine\",\n    \"\
  age\" => 29,\n    \"gender\" => \"M\",\n    \"country\" => \"France\"\n];\n\nforeach\
  \ ($person as $key => $value) {\n    echo \"Key: $key, Value: $value <br>\";\n}\n\
  \n?>\n```\n\n在此示例中，我们有一个名为 `$person` 的关联数组，即我们之前创建的那个。\n\n`foreach` 循环用于遍历 `$person`\
  \ 数组。在循环的每次迭代中，数组中每个元素的**键**和**值**分别存储在 `$key` 和 `$value` 变量中。\n\n在 `foreach` 循环内部，我们使用\
  \ `echo` 函数显示数组中每个元素的键和值。键使用 `$key` 变量显示，值使用 `$value` 变量显示。\n\n因此，对于 `$person` 数组的每个元素，此循环都会显示相应的键，后跟其值，中间用逗号分隔，然后换行，以便在浏览器中获得更好的可读性。\n\
  \n结果：\n\n![Image](img/image-87.png)\n\n#### 多维数组\n\n简单数组以线性方式存储简单数据（数字、字符串等），而多维数组是一种复杂的数据结构，其中每个元素本身可以是一个数组。这些数组对于表示表格数据、矩阵或其他需要多层组织的复杂数据结构非常有用。以下图所示的多维数组为例。该表显示了法国、加拿大、摩洛哥和西班牙的首都和人口。\n\
  \n![Image](img/image-88.png)\n\n通过分析此多维表的结构，我们可以推断它是作为一个国家列表构建的，其中每个国家由一个包含三个元素的子表表示：国家名称、首都和人口数量。\n\
  \n以下是表中每个元素的组织方式：\n\n*   每个子表的第一个元素是国家名称。\n*   第二个元素是国家的首都。\n*   第三个元素是国家的人口数量。\n\
  \n这样，每个子表代表一个国家及其相关特征，所有这些子表被组合在一个主表中，形成完整的多维数组。在 PHP 中有几种声明和初始化此数组的方法。\n\n#####\
  \ 方法 1：使用 `array()` 函数创建数组\n\n```php\n<?php\n\n$info_country = array(\n    array(\"\
  France\", \"Paris\", 67),\n    array(\"Canada\", \"Ottawa\", 38),\n    array(\"\
  Morocco\", \"Rabat\", 40),\n    array(\"Spain\", \"Madrid\", 47)\n);\n\n?>\n```\n\
  \n##### 方法 2：使用方括号语法 `[]`\n\n```php\n<?php\n\n$info_country = [\n    [\"France\"\
  , \"Paris\", 67],\n    [\"Canada\", \"Ottawa\", 38],\n    [\"Morocco\", \"Rabat\"\
  , 40],\n    [\"Spain\", \"Madrid\", 47]\n];\n\n?>\n```\n\n这两种方法是等价的，产生相同的结果。它们都定义了一个包含四个子数组的多维数组，每个子数组代表一个国家及其关联信息（名称、首都、人口数量）。唯一的区别在于所用的语法：第一种方法使用\
  \ `array()` 函数，而第二种使用 PHP 的简短数组语法，即方括号表示法 `[]`。\n\n**主**表的每个元素都是一个索引数组，包含特定国家的信息，并代表上图表格中的一行。每个数组的第一个元素代表国家名称，第二个元素代表首都，第三个元素代表人口数量。\n\
  \n为了可视化该表的结构化内容并更好地理解其布局，我们可以使用 `print_r()` 函数，并用 HTML `<pre>` 标签将其包裹：\n\n```php\n\
  <?php\n\n$info_country = array(\n    array(\"France\", \"Paris\", 67),\n    array(\"\
  Canada\", \"Ottawa\", 38),\n    array(\"Morocco\", \"Rabat\", 40),\n    array(\"\
  Spain\", \"Madrid\", 47)\n);\n\necho \"<pre>\";\nprint_r($info_country);\necho \"\
  </pre>\";\n\n?>\n```\n\n执行此代码时，显示的结果将类似于下图。该结果清晰地展示了多维数组的结构。主数组由第一个 \"Array ( )\"\
  \ 表示，包含四个索引从 0 到 3 的子数组。这些子数组中的每一个都包含三个索引从 0 到 2 的元素。\n\n![Image](img/image-89.png)\n\
  \n##### 访问多维数组的元素\n\n以多维数组 `$info_country` 为例，要访问其元素，可以使用数字索引，然后访问其单个元素。例如，要访问法国的首都，可以使用以下语法：\n\
  \n```php\n// 访问法国的首都\n$capital_france = $info_country[0][1];\necho $capital_france;\
  \ // 显示 \"Paris\"\n```\n\n在此示例中，`$info_country[0]` 返回对应法国的第一个子表，而 `$info_country[0][1]`\
  \ 访问该子表的第二个元素，即首都（巴黎）。\n\n例如，要访问摩洛哥的人口数量，可以使用以下语法：\n\n```php\n// 访问摩洛哥的人口数量\n$population_morocco\
  \ = $info_country[2][2];\necho $population_morocco; // 显示 40\n```\n\n\n\n在本例中，`$info_country[2]`\
  \ 返回对应摩洛哥的第三个子表，而 `$info_country[2][2]` 访问该子表的第三个元素，即摩洛哥的人口数量。\n\n##### 二维关联数组\n\
  \n在 `$country` 表的示例中，行和列都使用索引，这有时会导致元素的指定产生歧义。为了解决这个问题，我们可以不使用索引作为列的标识，而是使用键，以获得更好的可读性和更直观的表格理解。\n\
  \n![Image](img/image-90.png)\n\n要在 PHP 中声明并初始化此数组，我们可以使用**方括号**表示法 `[]` 或 `array()`\
  \ 函数：\n\n**方法 1：**\n\n```php\n$country_information = array(\n\n array(\"country\"\
  \ => \"France\", \"capital\" => \"Paris\", \"inhabitants\" => 67),\n\n array(\"\
  country\" => \"Canada\", \"capital\" => \"Ottawa\", \"inhabitants\" => 38),\n\n\
  \ array(\"country\" => \"Morocco\", \"capital\" => \"Rabat\", \"inhabitants\" =>\
  \ 40),\n\n array(\"country\" => \"Spain\", \"capital\" => \"Madrid\", \"inhabitants\"\
  \ => 47)\n\n);\n```\n\n**方法 2：**\n\n```php\n$country_information =[\n\n [\"country\"\
  \ => \"France\" , \"capital\" => \"Paris\" , \"inhabitants\" => 67],\n\n [\"country\"\
  \ => \"Canada\" , \"capital\" => \"Ottawa\" , \"inhabitants\" => 38],\n\n [\"country\"\
  \ => \"Morocco\" , \"capital\" => \"Rabat\" , \"inhabitants\" => 40],\n\n [\"country\"\
  \ => \"Spain\" , \"capital\" => \"Madrid\" , \"inhabitants\" => 47]\n\n];\n```\n\
  \n这两种方法，无论是使用简写语法 `[...]` 还是 `array()` 函数，在结果方面都是等效的。它们都创建了一个包含相同数据的多维数组。主要区别在于所使用的语法：\n\
  \n- 简写语法 `[...]` 更加简洁现代，因其增强的可读性而常被首选。\n- `array()` 函数较旧且较冗长，但仍被广泛使用，在某些情况下可能是必要的，特别是在动态构建数组时。\n\
  \n简而言之，这两种方法均有效，可根据编码偏好和特定项目需求进行选择。\n\n这两段代码均定义了一个名为 `$country_information` 的多维数组。该数组的每个元素本身都是一个关联数组，包含特定国家的信息。每个子数组将一个键（`country`、`capital`、`inhabitants`）与对应的值关联（第一个子数组为\
  \ `France`、`Paris`、`67`，以此类推）。因此，`$country_information` 是一个关联数组的集合，每个数组代表某个特定国家的信息。\n\
  \n要访问此类多维数组的元素，我们使用数字索引访问上层数组，然后使用关联键访问内部元素。\n\n例如，要访问第一个国家的首都，请使用：\n\n```php\n\
  echo $country_information[0][\"capital\"]; // 显示 \"Paris\"\n```\n\n同样，要访问第三个国家的人口数量：\n\
  \n```php\necho $country_information[2][\"inhabitants\"]; // 显示 40\n```\n\n#####\
  \ 遍历多维数组\n\n要在 PHP 中遍历多维数组，我们通常使用 `foreach` 循环的组合。正如我们之前所见，多维数组由嵌套数组组成，每个数组层级都可以使用\
  \ `foreach` 循环单独遍历。\n\n让我们以之前看到的 `$country_information` 表为例：\n\n```php\n<?php\n\n\
  $country_information =[\n\n [\"country\" => \"France\" , \"capital\" => \"Paris\"\
  \ , \"inhabitants\" => 67],\n\n [\"country\" => \"Canada\" , \"capital\" => \"Ottawa\"\
  \ , \"inhabitants\" => 38],\n\n [\"country\" => \"Morocco\" , \"capital\" => \"\
  Rabat\" , \"inhabitants\" => 40],\n\n [\"country\" => \"Spain\" , \"capital\" =>\
  \ \"Madrid\" , \"inhabitants\" => 47]\n\n];\n\nforeach ($country_information as\
  \ $country) {\n\n foreach ($country as $key => $value) {\n\n echo \"$key: $value\
  \ <br>\";\n\n }\n\n echo \"<br>\";\n\n}\n\n?>\n```\n\n这个嵌套的 `foreach` 循环首先遍历 `$country_information`\
  \ 数组的每个元素，然后在每次迭代中，遍历与当前国家关联的数组的每个内部元素（键值对）。`echo` 指令用于显示每个键值对。如果您运行此代码，将获得类似以下的结果：\n\
  \n![Image](img/image-91.png)\n\n#### 结论\n\n在本章中，我们详细探讨了 PHP 中数组操作的各个方面，数组是编程中的基本数据结构。我们学习了如何声明和初始化数组、访问其元素、使用循环遍历它们，以及理解不同的数组类型，如索引数组、关联数组和多维数组。\n\
  \n我们还研究了常见的数组操作，如添加、修改和删除元素，以及在数组中组织和操作数据的最佳实践。\n\n最后，我们探索了高级数组功能，如多维数组和关联数组，并学习了如何在\
  \ PHP 程序中有效地使用它们。\n\n通过将这些知识与我们之前探讨的概念（如函数和循环）相结合，我们现在对 PHP 中的数组操作有了扎实的理解，这将使我们能够创建健壮且动态的\
  \ PHP 应用程序。\n\n#### 练习\n\n#### 练习 15\n\n编写一个 PHP 脚本，将姓名列表存储在数组中，然后以项目符号列表的形式显示这些姓名。\n\
