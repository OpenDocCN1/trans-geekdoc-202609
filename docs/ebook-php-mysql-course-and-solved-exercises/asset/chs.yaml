  ##### 修正\n\n```php\n<?php\n\nclass Vehicle {\n\n    private $brand;\n\n    private\
  \ $model;\n\n    private $year;\n\n    private $price;\n\n    public function __construct($brand,\
  \ $model, $year, $price) {\n        $this->brand = $brand;\n        $this->model\
