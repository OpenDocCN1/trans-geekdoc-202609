  \ `Person` 对象并调用 `presentation` 方法。\n\n### 第 15 章\n\n### 数据封装与建模\n\n在本章中，我们将探讨 PHP\
  \ 面向对象编程（OOP）中封装的基本概念，以及它在数据建模和管理中的作用。封装是 OOP 的支柱之一，它由将数据（属性等）和作用于该数据的方法组合在一个称为类的单一实体中组成。这种方法通过控制访问和操作来保证数据的完整性和安全性。\n\
  \n我们还将继续研究属性和方法的不同可见性级别，如 `public`、`private` 和 `protected`，以及它们对封装的影响。通过理解这些可见性级别，你将能够设计结构良好且安全的类，同时促进代码复用和应用程序维护。\n\
  \n最后，我们将通过封装来研究数据建模，实现模型类以高效地表示信息系统中的实体和关系。你将学习如何使用 getter 和 setter 来控制对属性的访问，保证数据一致性并简化对象管理。\n\
  \n通过将封装与其他 OOP 概念（如继承和多态）相结合，我们将在后续章节中进一步开发这些概念，你将能够创建健壮、灵活的 Web 架构，以满足现代 IT 项目不断变化的需求。\n\
  \n#### 封装：保护数据和方法\n\n在 PHP 面向对象编程中，封装是指将数据（属性等）和用于操作它们的动作组合在一个类中。\n\n封装对于限制从类外部访问属性非常重要。为了确定谁可以访问我们类的各种属性、方法和常量，我们使用访问限制器，也称为可见性级别，由关键字\
  \ `public`、`private` 和 `protected` 表示。\n\n##### 封装原则\n\n封装涉及类属性和方法的可见性及可访问性。\n\n\
  创建新类时，确定哪些属性和方法必须可以从类外部访问至关重要。\n\n正如我们在上一章所见，使用 `public` 关键字定义的属性、方法或常量可在任何地方访问，无论是在类内部还是外部。使用\
  \ `private` 关键字定义的属性、方法或常量只能在定义它们的类内部访问。\n\n在即将到来的继承章节中，我们将发现使用 `protected` 关键字定义的属性、方法或常量可在定义它们的类内部访问，也可在继承自此类的子类中或在父类本身中访问。\n\
  \n按照惯例，属性声明为 `private`，因为直接访问类属性是有风险的。要访问这些属性，我们使用公共方法。\n\n在大多数情况下，我们使用 `public`\
  \ 关键字定义方法，使用 `protected` 或 `private` 关键字定义属性。但应注意，这一原则并非绝对，可能会根据每个应用程序的具体需求而有所不同。\n\
  \n#### 定义和使用 getter 与 setter 方法\n\n在本节中，我们将探讨面向对象编程中的一个基本概念：getter 和 setter。这些方法也称为访问器和修改器，用于访问对象的属性（getter）并以受控方式修改这些属性（setter）。\n\
  \nGetter 用于检索对象属性的值，而 setter 用于设置或修改这些值。\n\n我们将研究如何在 PHP 类中定义这些方法，以及它们的实际用途，以封装数据、控制访问并保证应用程序内的数据一致性。\n\
  \n让我们回到 `Users` 类，看看如何定义和使用 getter 和 setter 方法：\n\n```php\n<?php\n\nclass Users\
  \ {\n\n    private $name;\n\n    private $age;\n\n    // 属性 $name 的 Getter\n\n \
  \   public function getName() {\n\n        return $this->name;\n\n    }\n\n    //\
  \ 属性 $name 的 Setter\n```\n\n\n\n\npublic function setName($newName) {\n\n    $this->name\
  \ = $newName;\n\n}\n\n// $age 属性的 Getter\n\npublic function getAge() {\n\n    return\
  \ $this->age;\n\n}\n\n// $age 属性的 Setter\n\npublic function setAge($newAge) {\n\n\
  \    $this->age = $newAge;\n\n}\n\n}\n\n这段 PHP 代码定义了一个包含两个私有属性的 `Users` 类：`$name`\
  \ 和 `$age`。随后声明了四个方法：\n\n**`getName()`：** 这是 `$name` 属性的 getter。它用于获取 `$name` 属性的值。\n\
  \n**`setName($newName)`：** 这是 `$name` 属性的 setter。它用于为 `$name` 属性设置新值。\n\n**`getAge()`：**\
  \ 这是 `$age` 属性的 getter。它用于获取 `$age` 属性的值。\n\n**`setAge($newAge)`：** 这是 `$age` 属性的\
  \ setter。它用于为 `$age` 属性定义新值。\n\nGetter 用于从类外部访问私有属性值，而 setter 用于以受控方式修改这些值。通过这种方式，类通过允许对属性进行受控访问来保证数据封装。\n\
  \n为了演示 `Users` 类的 getter 和 setter 方法的用法，让我们将以下代码集成到 `index.php` 文件中：\n\n```php\n\
  <?php\n\nrequire_once \"Users.php\";\n\n// 实例化 User 对象\n\n$user1 = new Users();\n\
  \n// 使用 getter 和 setter 方法\n\n$user1->setName(\"Alice\");\n\n$user1->setAge(25);\n\
  \necho \"User name: \" . $user1->getName() . \"<br>\";\n\necho \"User age: \" .\
  \ $user1->getAge();\n```\n\n这段 PHP 代码演示了 `Users` 类的 getter 和 setter 方法的用法。首先，使用\
  \ `require_once` 引入 `Users` 类。接着，以 `$user1` 为名实例化一个新的 User 对象。分别使用 `setName()` 和\
  \ `setAge()` 方法设置用户的姓名和年龄。最后，使用 `getName()` 和 `getAge()` 方法检索并显示用户的姓名和年龄。当你运行 `index.php`\
  \ 文件时，将获得类似以下的结果：\n\n![Image](img/image-178.png)\n\n##### 使用 getter 和 setter 的优势\n\
  \n在面向对象编程中使用 getter 和 setter 有几个优势：\n\n**封装性：** getter 和 setter 用于控制对对象属性的访问。通过将属性定义为私有或受保护，并提供公共方法来访问和修改它们，我们能保证对数据操作有更大的控制权，从而促进封装。\n\
  \n**数据验证：** Setter 可以包含检查和验证，以确保分配给属性的数据是有效的。例如，你可以检查某个值是否在特定范围内、是否符合特定格式等。\n\n\
  **灵活性：** 通过使用 getter 和 setter，你可以轻松修改类内部处理数据的方式，而无需修改使用该类的客户端代码。这使得对象管理具有更大的模块化和灵活性。\n\
  \n**代码复用：** getter 和 setter 通过将数据操作逻辑封装在类内部，促进了代码复用。这减少了代码重复并增强了代码的可维护性。\n\n设想一下，在\
  \ `Users` 类中，我们想要确保分配给用户的年龄是一个正整数。下面是一个使用 getter 和 setter 进行数据验证的示例：\n\n```php\n\
  <?php\n\nclass Users {\n\n    private $age;\n\n    // 带验证的 $age 属性 Setter\n\n  \
  \  public function setAge($newAge) {\n\n        // 检查年龄是否为正整数\n\n        if (is_int($newAge)\
  \ && $newAge >= 0) {\n\n            $this->age = $newAge;\n\n        } else {\n\n\
  \            // 年龄无效时，显示错误消息\n\n            echo \"Age must be a positive integer\
  \ \";\n\n        }\n\n    }\n\n    // $age 属性的 Getter\n\n    public function getAge()\
  \ {\n\n        return $this->age;\n\n    }\n\n}\n```\n\n在这段代码中，公共 `setAge()` 方法是一个带验证的\
  \ setter，用于设置年龄值。它接受一个参数 `$newAge`，首先使用 `is_int()` 函数并检查 `$newAge` 是否大于或等于零，以此判断它是否为正整数。如果是，则将该值赋给当前对象的\
  \ `$age` 属性。否则，显示一条错误消息，指明年龄必须为正整数。\n\n公共 `getAge()` 方法是一个用于获取年龄值的 getter。它只是简单地返回当前对象\
  \ `$age` 属性的值。\n\n使用这种模式可确保年龄值始终有效，从而避免数据错误。示例如下：\n\n```php\n<?php\n\nrequire_once\
  \ \"Users.php\";\n\n// 实例化 Users 对象\n\n$user1 = new Users();\n\n// 使用 setter 设置年龄\n\
  \n$user1->setAge(30); // 有效，因为 30 是正整数\n\n// 使用 getter 获取年龄\n\necho \"User's age:\
  \ \" . $user1->getAge(); // 将显示 : User's age: 30\n\necho \"<br>\";\n\n// 尝试使用 setter\
  \ 设置无效值\n\n$user1->setAge(-10); // 显示 : Age must be a positive integer.\n\n// 尝试无效值后使用\
  \ getter\n\necho \"User's age: \" . $user1->getAge(); // 显示 : User age: 30 (年龄未被修改)\n\
  ```\n\n在这段代码中，我们使用 setter `setAge()` 将用户年龄设置为 30。此操作成功，因为 30 是正整数。\n\n我们使用 `getAge()`\
  \ getter 获取用户年龄并在屏幕上显示。在这种情况下，将显示 \"User age: 30\"。\n\n接着，我们再次尝试使用 setter `setAge()`，但这次使用无效值\
  \ -10。由于该值无效，setter 显示错误消息 \"Age must be a positive integer.\"。\n\n最后，我们再次使用 `getAge()`\
  \ getter 显示用户年龄。由于之前尝试使用无效值未能修改年龄，此指令将再次显示 \"User age: 30\"。\n\n执行此代码时，将获得以下结果：\n\
  \n![Image](img/image-179.png)\n\n#### 类构造函数\n\n在 PHP 面向对象编程中，构造函数在对象的创建和初始化中起着至关重要的作用。构造函数是类的一个特殊方法，当该类的新对象被实例化时会自动调用。其主要目的是执行设置对象初始状态所需的初始化任务。\n\
  \n构造函数允许你定义从创建那一刻起对象属性应如何配置，提供了一种便捷的方式，确保对象以一致且有效的状态被创建。换句话说，它提供了一种手段，确保对象所需的数据从一开始就可用且已正确初始化。\n\
  \n在本节中，我们将详细探讨 PHP 构造函数的概念，考察其语法、实际用法以及对数据建模和对象管理的影响。我们将学习如何在类中定义和使用构造函数，以及与其实现相关的最佳实践。通过理解构造函数的角色和重要性，PHP\
  \ 开发人员将更有能力设计健壮的类和结构良好的面向对象应用程序。\n\n##### 创建类构造函数\n\n下面是一个演示在 `Users` 类中创建和使用构造函数的实际示例：\n\
  \n```php\n<?php\n\nclass Users {\n\n    private $name;\n\n    private $firstname;\n\
  \n    private $age;\n\n    private $email;\n\n    // Users 类的构造函数\n\n    public\
  \ function __construct($name, $firstname, $age, $email) {\n\n        $this->name\
  \ = $name;\n\n        $this->firstname = $firstname;\n\n        $this->age = $age;\n\
  \n        $this->email = $email;\n\n    }\n\n    // 用户姓名的 Getter\n\n    public function\
  \ getName() {\n\n        return $this->name;\n\n    }\n\n    // 用户名字的 Getter\n\n\
  \    public function getFirstname() {\n\n        return $this->firstname;\n\n  \
  \  }\n\n    // 用户年龄的 Getter\n\n    public function getAge() {\n\n        return\
  \ $this->age;\n\n    }\n\n    // 用户邮箱地址的 Getter\n\n    public function getEmail()\
  \ {\n\n        return $this->email;\n\n    }\n\n}\n```\n\n\n\n这段 PHP 代码定义了一个名为 `Users`\
  \ 的类。该类包含四个私有属性：`$name`、`$firstname`、`$age` 和 `$email`。它还有一个**构造函数**。构造函数是一种特殊方法，其名称始终为\
  \ `__construct()`。当创建一个新的 `Users` 对象时，该方法会被自动调用。其主要作用是在实例化类时，使用提供的值来初始化对象的属性。\n\n\
  以下是构造函数的详细工作原理：\n\n参数：构造函数接受四个参数：`$name`、`$firstname`、`$age` 和 `$email`。这些参数代表对象属性的初始值。\n\
  \n属性初始化：在构造函数内部，使用 `$this->` 运算符将参数值赋给对象对应的属性。例如，`$this->name = $name;` 将 `$name`\
  \ 参数的值赋给正在构建的对象的 `$name` 属性。\n\n除了**构造函数**，`Users` 类还有四个名为 getter 的公共方法：`getName()`、`getFirstName()`、`getAge()`\
  \ 和 `getEmail()`。这些方法分别用于获取私有属性 `$name`、`$firstname`、`$age` 和 `$email` 的值。它们用于以受控且安全的方式从类外部访问对象数据。\n\
  \n##### 实例化时的使用\n\n当你使用构造函数创建一个新的 `Users` 对象时，必须提供参数值。例如，如果你编写 `$user1 = new Users(\"\
  Dupont\", \"Alice\", 30, \"dupont.alice@example.com\");`，构造函数将使用指定的值被调用，并将这些值赋给\
  \ `$user1` 对象的相应属性。在 `index.php` 文件中，插入以下代码：\n\n```php\n<?php\n\nrequire_once \"\
  Users.php\";\n\n// 使用构造函数实例化 Users 类\n\n$user1 = new Users(\"Dupont\", \"Alice\"\
  , 30, \"dupont.alice@example.com\");\n\n// 显示用户信息\n\necho \"User name: \" . $user1->getName()\
  \ . \"<br>\";\n\necho \"User first name : \" . $user1->getFirstname() . \"<br>\"\
  ;\n\necho \"User's age: \" . $user1->getAge() . \"<br>\";\n\necho \"User email:\
  \ \" . $user1->getEmail();\n```\n\n这段代码演示了使用构造函数实例化 `Users` 类的过程。当我们创建一个新的 `Users`\
  \ 对象时，将姓氏 \"Dupont\"、名字 \"Alice\"、年龄 30 和电子邮件 \"dupont.alice@example.com\" 传递给构造函数。这些值随后被用于初始化\
  \ `Users` 对象的相应属性。\n\n接下来，我们使用 getter 来获取用户信息并将其显示在屏幕上。我们分别使用 `getName()`、`getFirstName()`、`getAge()`\
  \ 和 `getEmail()` 方法获取用户的姓氏、名字、年龄和电子邮件地址，并在浏览器中显示它们。\n\n运行此代码时，你将得到以下结果：\n\n![Image](img/image-180.png)\n\
  \n#### 结论\n\n在本章关于面向对象编程中封装与数据建模的内容中，我们探讨了在应用程序中构建和保护数据所涉及的基本概念。我们从封装开始，它包含将数据及相关方法分组在类中，同时定义可见性级别以控制对这些元素的访问。\n\
  \n随后，我们详细研究了 getter 和 setter 方法，它们提供了一种安全且受控的方式来访问和修改类的私有属性。通过使用这些方法，我们了解了如何保证数据完整性，并通过防止直接访问私有属性来加强封装。\n\
  \n我们还考察了使用 getter 和 setter 的优势，特别是在灵活性、可维护性和代码安全性方面。通过使用特定方法访问数据，我们可以轻松实现数据验证和处理逻辑，同时保持封装性并最大程度降低数据损坏的风险。\n\
  \n最后，我们探讨了构造函数在创建对象和初始化其属性方面的关键作用。通过定义合适的构造函数，我们可以确保对象一创建就被正确配置，从而使我们的类使用起来更安全、更一致。\n\
  \n总之，封装和数据建模是面向对象编程中的关键概念，它们支持设计健壮、模块化且易于维护的应用程序。通过理解并应用这些原则，开发人员可以创建更高效、更可靠的软件系统，确保数据在其整个生命周期中的保护与完整性。\n\
