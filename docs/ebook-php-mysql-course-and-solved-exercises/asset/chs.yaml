  \n##### 修正：使用 while 循环\n\n```php\n<?php\n\nfunction find_number($number) {\n   \
  \ $Number_of_prints = 0;\n    $Random_number = -1;\n\n    while ($Random_number\
  \ != $number) {\n        $Random_number = random_int(0, 100);\n        $Number_of_prints++;\n\
