  img_proc: true
- pgno: 294
  md: 'C is correct. Security suites are a type of software that offers multiple security
    and management-related functions. Also called “multilayered security,” security
    suites ensure a level of consistency and interoperability that having separate
    disparate, single-function applications cannot offer.


    A, B, and D are incorrect. A is incorrect because cross-training helps employees
    at tasks normally performed by their peers. This helps personnel, but systems
    need to be more “interoperable.” B is incorrect because developing custom APIs
    is not a practical or sustainable solution to ensuring security services working
    together. D is incorrect because although a security appliance performs multiple
    security functions, it is a hardware solution, not a software one.


    +   5. A company has recently implemented Elasticsearch, Logstash, and Kibana
    (ELK) as a central part of its SIEM. Which company has gained in their SIEM that
    were likely missing before? (Select two.)


    +   A. Data outsourcing


    +   B. Data aggregation


    +   C. Data correlation


    +   D. Data automation


    B and C are correct. The aggregation and correlation of data are both well handled
    by ELK, or the three applications known fully as Elasticsearch, Logstash, and
    Kibana. With so many varied types of data, from a myriad of source applications
    and devices, it becomes quickly overwhelming to a person to collect, review, and
    analyze all this data to glean information from it.


    A and D are incorrect. A is incorrect because data outsourcing is not what’s being
    done. D is incorrect because although “data automation” could describe what is
    done, this is not the recognized term.


    +   6. Which of the following is not a key concern for organizations relying on
    an outsourcing firm?


    +   A. Sufficient vetting


    +   B. Access to sensitive data by non-employees


    +   C. Redundancy of efforts


    +   D. Agreement on incident-handling responsibilities and decision-making


    C is correct. When you’re dealing with outsourcing, the redundancy of efforts
    is not the problem.'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'A, B, and D are incorrect. A is incorrect because it is difficult to sufficiently
    vet and clear the presumed many outsourced employees. B is incorrect because outsourcing
    means granting access to sensitive data and access to internal networks, both
    of which mean strict access control is required. D is incorrect because an organization
    and the outsourcing firm may both attempt to handle an event or incident, without
    considerable planning and practice for a variety of events.


    +   7. A recent incident at a company revealed that a normal employee has been
    using special network-analyzing software to capture and read internal e-mails.
    What control could be put in place to immediately stop this?


    +   A. E-mail signatures


    +   B. Cryptography


    +   C. Two-factor login authentication


    +   D. Network segmentation between departments


    +   B is correct. If cryptography were in place to protect e-mail while in transit,
    attempts to capture and read would prove futile.


    +   A, C, and D are incorrect. E-mail signatures, such as inserting contact information
    at the bottom of every message, do no good in ensuring confidentiality. Two-factor
    login authentication is an improvement in protecting logging in to the system.
    However, e-mail would continue to be sent in the clear. Network segmentation would
    be to some degree, such as segmenting network traffic between departments. However,
    we don''t know if the sniffing employee is reading their own department''s e-mail.


    +   8. Compensating controls are available from both personnel and technology
    categories. Which of the following are technology-based controls? (Choose all
