    +   ☑ C is correct. The utility netstat is on the workstation and is already a
    part of the operating system. Netstat is a command-line utility for viewing network
    statistics, such as what connections and protocols are in use. The command-line
    switch -a will display all connections and listening ports.


    +   ☑ A, B, and D are incorrect. A is incorrect because tcpdump is a packet capturing
    utility. The -i is for specifying an interface. B is incorrect because Nikto is
    a utility for scanning web vulnerabilities. The command-line switch -host will
    set the target host by IP or hostname. D is incorrect because the utility nbtstat
    informs you about NetBIOS connections. Although both nbtstat and netstat are available
