- pgno: 293
  md: '# D. Process management


    +   A is correct. Continual process improvement is a defining characteristic of
    a mature organization.


    +   B, C, and D are incorrect. These wrong answers are worded to mirror the maturity
    levels of the process appraisal program, Capability Maturity Model Integration
    (CMMI). When an organization’s maturity is evaluated, the program’s representative
    levels, escalating in increasing maturity, are as follows: Initial, Managed, Defined,
    Quantitatively Managed, and Optimizing. Optimizing, as the final, most mature
    level, represents the practice of continually improving processes.


    +   3. An incoming CIO starts their first day on the job by reading and becoming
    familiar with the company’s security policies. The CIO dusts off policies about
    the management of pagers, fax machines, and CRT monitors, among other policies
    that seem to apply to technology no longer applicable to the business’s goals
    and operations today. What might the incoming CIO add to their to-do list to address


    +   A. Retirement of processes


    +   B. Automated reporting


    +   C. Deputy CIO


    +   D. Scheduled reviews


    +   D is correct. Given the outdated policies, it seems the organization is lacking
    any review of security policies. Holding regularly or periodically scheduled security
    reviews validates policies as effective and relevant.


    +   A, B, and C are incorrect. A is incorrect because the retirement of processes
    is correct concerning the relevance and practicality of processes, but not when
    dealing with policies. B is incorrect because automated reporting addresses the
    feeling of sending alerts or notifications by a security monitoring product after
    its analysis shows a team’s attention is warranted. C is incorrect although having
    a deputy CIO might be useful, adding another management level wouldn’t directly
    affect the outdated policies.


    +   4. What software approach can ensure that the security and management functions
    of an organization can operate and cooperate together?


