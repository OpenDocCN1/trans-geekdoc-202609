- pgno: 309
  md: 'A, B, and C are incorrect. Regression testing is applicable, but because this
    is the first release of the app, we would not call this regression testing. Interception
    proxy is a software tool, not a person’s role, used to discover similar vulnerabilities
    by being inserted between two devices. The interception proxy will act as a go-between
    monitoring device. An analyst can examine the traffic for any vulnerabilities.
    Up to now, Arya has been a user determined to discover issues. If Arya transitions
    to the security team, she would no longer be ‘just a user’ but as a team member
    to validate issues discovered by user testing. Normally, before an application
    is released, it is tested by a handful of users. These early users will report
    on what should be changed before the application goes to a wider audience.


    +   7. Considering the issues discovered to date, what phase of software development
    was likely missing during the application lifecycle?


    +   A. Security requirements definition


    +   B. Stress testing


    +   C. Security regression testing


    +   D. Operations and Maintenance


    +   E. User acceptance testing


    A is correct. It seems the developer did very little security testing prior to
    the application’s release. If security requirements had been submitted and followed
    closely over the course of development, many of these issues have been avoided.
    Truly, these are dark times.


    B, C, D, and E are incorrect. Stress testing involves trying to break an application
    by making it work harder than intended. Regression testing is testing the application
    after a modification to ensure any vulnerabilities were not introduced. Operations
    and Maintenance is the continued care of the application after its release, so
    this option doesn’t actually apply to the question. User acceptance testing describes
    how an application gets tested by a handful of users, prior to release. Early
    users can report what should be changed before the application goes to a wider
    audience.


    +   8. What detailed guides published by the CIS are equivalent to the Security
    Technical Implementation Guides published by the Defense Information System Agency
    and other government entities?


    +   A. Regression reports


    +   B. Benchmarks


    +   C. Security requirements definitions'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'D. Secure coding best practice guides


    +   B is correct. The Center for Internet Security Benchmarks are detailed configuration
    guides that are comparable to the STIGs published by the DISA and other government
    agencies. These guides are free to download, are available for desktop, mobile,
    server, and network devices, and cover both hardware and virtual platforms. They
    are highly recommended for anyone to review and understand.


    +   A, C, and D are incorrect. A regression report would detail what, if, security
    vulnerabilities had appeared due to a modification to software. A security requirements
    definition is a key document that details the security expectations for software.
    Ideally, this should be drafted in parallel to the software’s early requirements
    and definitions documents. Secure coding best practice guides are not a particular
    publication of CIS.


    +   9. The Center for Internet Security has organized focus groups and built consensus
    to formulate a group of 20 “CIS Controls.” These controls are separated in groups
    of Basic, Foundational, and Organizational. What is the intended aim of these
    controls?


    +   A. Employee-controlled access


    +   B. Software development best practices


    +   C. Wireless access control


    +   D. System design recommendations


    +   D is correct. The CIS Controls are system design recommendations, grouped
    into three categories: Basic, Foundational, and Organizational. These consensus-based
    best practices provide a set of actionable recommendations, intended for anyone
    responsible for information security.


    +   A, B, and C are incorrect. Although employee-controlled access, software development,
    and wireless access controls are all very important, they each represent just
    one area to be covered by the CIS Controls.'
