- pgno: 282
  md: 'method.


    +   A, C, and D are incorrect. There doesn''t seem to be any indication of a man-in-the-middle
    attack. Rootkits would be significantly harder to detect or without specialized
    tools, and privilege escalation isn''t the primary issue. However, after the XSS
    attack, perhaps the session information gleaned from the attack might contribute
    to privilege escalation layer, meaning the attacker might use the opportunity
