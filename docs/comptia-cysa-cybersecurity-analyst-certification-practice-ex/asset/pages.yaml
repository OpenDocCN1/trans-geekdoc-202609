  md: "# Preparing the Incident Response Toolkit\n\nThis chapter includes questions\
    \ on the following topics:\n\n+   - How digital forensics is related to incident\
    \ response\n- Basic techniques for conducting forensic analysis\n- Familiarity\
    \ with a variety of forensic utilities\n- How to assemble a forensic toolkit\n\
    \nWhen a cybersecurity analyst conducts an incident response, the analyst cannot\
    \ possibly anticipate whether or not the outcome might lead to legal action or\
    \ prosecution. As a result, every incident responded to must be handled as a forensic\
    \ investigation. A forensic investigation follows specific phases, requiring the\
    \ analyst to take careful notes and handle all evidence with complete accountability.\
    \ To carry this out, the analyst must obviously be prepared and possess the skills\
    \ required to conduct the investigation.\n\nPerhaps as important as the analyst's\
    \ skills are the analyst's tools. Only with the kit containing the necessary tools,\
    \ documentation, and supportive hardware can the analyst progress through the\
    \ phases of the forensic investigation. This chapter covers the topics concerned\
    \ with building that forensic kit.\n\n# QUESTIONS\n\n+   1. What ensures accountability\
    \ of evidence handling by documenting the handoff from person to person of important\
    \ forensic material?\n   A. Handoff form\n   B. Analysis management form\n   C.\
    \ Evidence management log\n   D. Chain of custody form\n2. Which of the following\
    \ is developed as part of an incident response plan, but has practical value in\
    \ a forensic kit?\n   A. Rainbow tables\n   B. Call/escalation list"
