- pgno: 121
  md: '# # Implementing Vulnerability Management Processes


    This chapter includes questions on the following topics:

    * The requirements for a vulnerability management process

    * How to determine the frequency of your vulnerability scans

    * The types of vulnerabilities found in various systems

    * Considerations for configuring tools for scanning


    Vital to strong security is being able to identify and understand the vulnerabilities
    in your environment. Identifying vulnerabilities requires knowing how to search
    and what to search for. To do this, you will need scan tools and methods as well
    as a process to identify them. Lastly, you need to effectively keep track of what
    vulnerabilities you find. Understanding vulnerabilities starts with what you''re
    doing now—learning and applying the principles of information security.


    The cybersecurity analyst can find and understand vulnerabilities in general,
    but to manage vulnerabilities requires knowing the business they affect. This
    means understanding how the business''s systems interact with one another, what
    data they use, and what processes are required for the business to function. Once
    some vulnerability might be eliminated at one company but another company''s operations
    must allow the vulnerability to stay. The vulnerabilities you might face are caused
    by the nature of your business and your data. (Wouldn''t turning off all the servers
    eliminate many vulnerabilities?) Regulatory requirements and policy requirements
    will impact vulnerability management further. In this chapter, implementing a
    vulnerability management process is at the core of the questions provided.


