- pgno: 328
  md: "original producer of FirePOWER appliances, which Cisco absorbed as part of\
    \ its acquisition of Sourcefire in 2013.\n\nUsing the following scenario to answer\
    \ Questions 12 and 13:\nA special-purpose workstation connects with several external\
    \ hosts during the normal workday. On the rare occasion, a connection triggers\
    \ an alert on a network intrusion detection system or some other security device\
    \ reveals malicious traffic is detected. This is because none of the external\
    \ nodes are under the company’s control or security policy. Because this is a\
    \ necessary function of this particular workstation, the potential for malicious\
    \ traffic is an an acceptable risk.\n\n+   12. What should be the first line of\
    \ defense to protect the workstation from a security incident?\n    A. Antivirus\n\
    \    B. Firewall\n    C. HIDS\n    D. Network-based IDS\n\n+   A is correct. (AV)\
    \ on the host should be an obvious first line of defense. AV should be already\
    \ present, at a minimum.\nB, C, and D are incorrect. A perimeter-based firewall\
    \ is the first line of defense from a packet’s perspective. In this case, the\
    \ workstation is initiating connections, and traffic (malicious or not) is already\
    \ past the firewall. Unless the firewall was an application-layer firewall or\
    \ an NGFW, we can assume malware might make it to the workstation unobstructed.\
    \ If an HIDS was installed on the workstation or an IDS was in line between the\
    \ firewall and workstation, either of them would catch the malware. But either\
    \ is also only a monitoring device, with no response. We have to assume someone\
    \ is monitoring IDS alerts and, if warranted, would terminate any connection at\
    \ the firewall or network-based, an IDS will not actively defend the workstation\
    \ like an antivirus application.\n\n+   13. The new CISO has decided the workstation\
    \ must connect via VPN to improve security. What, if any, change in controls should\
    \ be considered?\n    A. Adding an HIPS\n    B. Ensuring the CA is up to date\n\
    \    C. Capturing packet headers\n    D. No change in controls needed"
  merge: -1
  img_proc: true
- pgno: 329
  md: '+   A is correct. If a VPN is used between the workstation and a foreign node
    (which is a very dangerous idea, by the way), then all traffic is now encrypted
    and unviewable by the company’s own network security devices. Any host-based IDS
    or IPS can view the traffic as it leaves or enters the endpoint. Therefore, adding
    a HIPS is the correct choice.


    +   B, C, and D are incorrect. Ensuring the Certificate Authority (CA) is up to
    date is fine regarding the certificate''s validity and strength, but it does nothing
    to help control security on the workstation. Capturing packet headers, presumably
    from the host, would only document the source and destination address information.
    No payload or possibly malicious traffic would be monitored.


    14. What network-monitoring application is the following rule useful for?

    alert tcp $EXTERNAL_NET any -> $HOME_NET any (msg:"You''re gonna need a bigger
    boat"; content:"dun dun"; depth:5; nocase; detection_filter: track by_src, count
    3, seconds 2);


    # A. Metasploit


    +   B. Web proxy


    +   C. Network General


    +   D. Snort


    +   E. Most firewalls


    +   D is correct. The provided example is a Snort rule. Functionally, the rule
    will detect and alert on packets containing “dun dun” in their content at a depth
    of five octets, and sensing three such packets within two seconds from a single
    source. (Although this is likely not practical in the real world, I think coastal
    data centers should include it in their Snort set.) Snort installations may come
    with 2000 stock rules in various readable text files. Various sets of rules are
    available for depend on your environment, OS platform, or applications running.


    +   A, B, C, and E are incorrect. The Metasploit framework is bit as powerful
    and flexible as Snort, but it relies on modules and not (rules) to exploit the
    identified target. A web proxy functions more like a caching server, but monitors
    traffic for the likely purpose of content filtering. Network General is the original
    commercial packet sniffer product, from back in the late 1980s. Packet sniffers,
    as they were back then, did not employ rules, today’s most common sniffers are
    also packet analyzers. Firewalls, in general, use rules to determine what type
    of traffic and response to if such traffic is detected. However, the structure
    and parameters of the provided rule in the question are unique to Snort.'
  merge: -1
  img_proc: true
