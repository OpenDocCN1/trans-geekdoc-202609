  md: '# IN-DEPTH ANSWERS


    +   1. In terms of skill and determination, what type of adversary is regarded
    as the most capable and resourceful?


    +   A. Script kiddie


    +   B. Advanced persistent threat


    +   C. Haxor


    +   D. Zero-day


    +   B is correct. The advanced persistent threat (APT) is by far the most skilled,
    most resourceful of threats.


    +   A, C, and D are incorrect. A is incorrect because a script kiddie is the name
    for someone who is inexperienced, like a child (kiddie), and only knows how to
    run a script. C is incorrect because a "haxor," or hacker, is generally someone
    who possesses some skill, but acts alone, without massive resources behind them.
    D is incorrect because zero-day threats are neither skilled nor resourceful; the
    zero-day is dangerous because it is a new threat with no known mitigation.


    +   2. A company has recently installed an IDS that''s capable of detecting a
    broad set of malicious traffic and operates on signature-based identification.
    Which of the following types of threats will this IDS identify? (Choose all that
    apply.)


    +   A. Zero-day


    +   B. Threats labeled by CVE


    +   C. Unknown threats


    +   D. EICAR file


    +   E. Known threats


    +   B, D, and E are correct. If an IDS is signature-based, you can assume it''s
    not capable of detecting unknown malware or detecting anomalous behavior. Threats
    with a CVE ID number very likely have a known signature assigned to them. The
    EICAR file is a well-known test for malware detection. Known threats, as you can
    tell by the name, will have a signature.


    +   A and C are incorrect. A is incorrect because a zero-day is likely unknown
    to a signature-based device. C is incorrect because unknown threats, as obvious
    by the name, are unknown to a signature-based device.


    +   3. A cybersecurity team is responding to an incident. To help prioritize their
    actions,'
  merge: -1
