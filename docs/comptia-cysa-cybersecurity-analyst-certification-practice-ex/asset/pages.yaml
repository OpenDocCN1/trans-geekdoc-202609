    +   10. The networking connections display one external, foreign IP address with
    an active connection. What device or application would be the first choice to
    corroborate this finding as well as to stop it?


    +   A. Antivirus


    +   B. Firewall


    +   C. Antimalware


    +   D. IPS


    +   B is correct. If there is a connection between an internal system and an external
    system, the connection passes through the firewall. The firewall is a network
    perimeter device that will either deny or allow a connection to take place, depending
    on the rules you instruct the firewall to follow.


    +   A, C, and D are incorrect. Antivirus would stop certain malware, such as a
    virus or worm, from spreading from your machine or infecting your machine. Antimalware
    stops more pervasive and insidious malware. An intrusion prevention system (IPS)
    would detect bad traffic on the network and possibly respond by blocking the traffic.


