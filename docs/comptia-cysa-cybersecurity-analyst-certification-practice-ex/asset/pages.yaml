- pgno: 298
  md: '12. As mentioned earlier, Walter and Donnie need to be “qualified” to review
    logs of particular departmental systems, even though all of the bureau’s departments
    are now merged together. This causes added administrative overhead for each new
    system brought online. What change control process is failing?


    +   A. Retirement of process


    +   B. Separation of duties


    +   C. Procedural training


    +   D. Scheduled reviews


    +   A is correct. Because the reasoning behind the process is outdated, and the
    process serves little value today, that process should be retired. This activity
    of reviewing and removing obsolete processes is called “retirement of process.”


    +   B, C, and D are incorrect. Separation of duties helps prevent collusion and
    conflict of interests. Procedural training is not a real term to be used here.
    Scheduled reviews describe a review of policies to ensure they are still relevant
    and effective for their purpose and for the business.


    13. The bureau has processed the new log review application. However, the task
    of integrating this application in current systems is quite challenging and specialized.
    Integration requires a high level of experience in database optimization, which
    only Walter possesses, at an intermediate level. The integration process is described
    by the vendor as “quick and painless” because all their sales engineers are skilled
    and experienced in the requisite knowledge. What might be the best action to take,
    and who will be involved?


    +   A. Training (vendor Donnie)


    +   B. Dual control (vendor and Walter)


    +   C. Separation of duties (Donnie and Walter)


    +   D. Consultant (vendor)


    +   D is correct. Hiring the application vendor is the correct solution. Hiring
    a consultant is often done because they possess specialized knowledge. In this
    case, the vendor knows how to integrate the software far more easily than the
    bureau’s own staff does. This makes the software vendor a third party, in service
    to the bureau for the time period necessary to install the application. In this
    temporary role, no doubt the vendor will need to sign an NDA to mitigate the risk
    of sensitive information being exposed during their service.


    +   A, B, and C are incorrect. Training Donnie to perform the integration is likely'
