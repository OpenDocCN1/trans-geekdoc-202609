- pgno: 307
  md: 'A, B, and D are incorrect. SANS Institute is an authority on security—be it
    web, application, system, or network—but does not specialize in web security.
    CMMI is the Capability Maturity Model Integration, the well-known, five-level
    maturity model from the Software Engineering Institute, a federally funded research
    and development center at Carnegie-Mellon University. The Center for Internet
    Security (CIS) is a nonprofit organization that excels in enhancing security with
    its collaborative approach.


    +   To reduce the number of modifications soon after an application’s release,
    what practice is to verify the application will be used as developers expected?


    +   A. Stress testing


    +   B. Static code analysis


    +   C. User acceptance testing


    +   D. Manual peer review


    +   C is correct. Before an application gets released, it’s common to have it
    tested by a handful of users. These early users will report on what should be
    changed before the application goes to a wider audience. This is called user acceptance
    testing.


    +   A, B, and D are incorrect. Stress testing involves pushing the application
    to its limits to see what breaks or fails first. Static code analysis is an automated
    form of reviewing code without having to run the program. This is typically performed
    by a specialized application. Manual peer review is a slower but methodical code
    review done by the developers’ peers. This code review allows others to catch
    the simple errors or typos that developers might too easily skip over from being
    familiar with the code


