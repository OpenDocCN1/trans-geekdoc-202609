- pgno: 279
  md: 'C. Relative to services, endpoints are vulnerable to replay attacks.


    D. Compared to personnel, endpoints are more difficult to lock down.


    +   C is correct. In terms of authentication, endpoints are particularly vulnerable
    to replay attacks.


    +   A, B, and D are incorrect. Servers are typically authenticated by certificates,
    as defined by the X.509 standard. The use of PKI certificates makes authenticating
    servers fairly straightforward, but not on a massive scale. Endpoints do not require
    authentication by token. Also, endpoints are not more difficult to secure when
    dealing with larger numbers. An administrator might argue that with volume licensing,
    standardized images, and group policy, a large number of workstations can be relatively
    simple to lock down. Personnel are by far the most difficult to “lock down” when
    you consider that human error and the tendency to want help are constant vulnerabilities
    to personnel.


    4. Which of the following context-based authentication methods is likely to reveal
    someone attempting to brute-force an account using an automated script?


    A. Time


    B. Frequency


    C. Location


    D. Behavior


    +   B is correct. If someone is using an automated script to guess someone’s credentials
    via brute force, the frequency of attempts will be far greater than a person could
    reasonably perform.


    +   A, C, and D are incorrect. Whether by script or not, the time of those attempts
    isn’t mentioned. The location may or not be the same, making the brute-force attack
    could be performed locally or remotely. The behavior aspect does not apply here,
    because the attacker hasn''t logged on. Behavior means monitoring a user’s activity,
    such as websites visited and applications used.


    5. A company utilizes a resource for storing employee credentials, otherwise known
    as an identity repository. In general, all employees have their network access
    validated by a central server. Although most employees work in the headquarters
