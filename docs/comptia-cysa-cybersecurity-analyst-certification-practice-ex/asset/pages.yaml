- pgno: 107
  md: 'A and B are incorrect. A is incorrect because IDS is an example of a technical
    control. B is incorrect because the RADIUS server is also a technical control.


    +   5. The company has employed the same encryption methods for a considerably
    long time. As a new security analyst, you question the effectiveness and strength
    of the encryption. What is the best recommendation for how to proceed?


    +   A. Conduct a technical control review of encryption as a technical control.


    +   B. Conduct an operational control review of encryption as an operational control.


    +   C. Perform a risk assessment of the encryption strength.


    +   D. Perform a vulnerability assessment of the server and the data now encrypted.


    +   A is correct. Encryption is a technical control. Conducting a technical review
    is the best course of action when the long-term effectiveness of a technical control
    comes into question.


    +   B, C, and D are incorrect. B is incorrect because encryption is a technical
    control, not an operation control. C is incorrect because performing a risk assessment
    is important, but is only part of a technical control review. D is incorrect because
    performing a vulnerability assessment of the encryption in use might not provide
    a valid representation of the encryption’s effectiveness.


