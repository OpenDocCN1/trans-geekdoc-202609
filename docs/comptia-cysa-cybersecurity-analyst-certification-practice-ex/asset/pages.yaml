- pgno: 34
  md: '# # Applying Reconnaissance Techniques


    This chapter includes questions on the following topics:

    * Approaches to conducting reconnaissance

    * Tasks involved in identifying and reconno a target

    * Variables affecting reconnaissance efforts

    * Common tools used for discovery or reconnaissance


    As a cybersecurity analyst, you''ll need the knowledge and skills to carry out
    a variety of tasks. Those tasks include configuring and using threat detection
    tools, performing data analysis, as well as interpreting the results to identify
    vulnerabilities, threats, and risks to an organization. The end goal is to secure
    and protect the resources within the organization. Those resources include the
    servers, network, and data as well as the user accounts accessing and using it
    all.


    Protecting resources starts with vulnerability management, and knowing what weaknesses
    exist and applying appropriate measures to minimize them. Risk management is an
    ongoing process. To begin, you need to identify and evaluate assets—or in the
    attacker''s perspective, the targets. The first part, identifying what targets
    exist, is done through reconnaissance. To perform reconnaissance, you need to
    apply several techniques and employ a variety of tools. And that is what this
    chapter is all about.


    # ## QUESTIONS


    +   1. Which of the following is not an example of reconnaissance or gathering
    information of the target company through open source intelligence?


    +   A. Using LinkedIn and other social media to gather e-mail addresses of top
    executives


    +   B. Performing passive reconnaissance by capturing packets and scanning ports


    +   C. Monitoring job sites to learn what technologies are used


    +   D. Performing DNS harvesting of company network data from external DNS servers'
  merge: -1
  img_proc: true
