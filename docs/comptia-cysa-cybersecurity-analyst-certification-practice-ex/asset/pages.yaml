  md: 'D is incorrect. A company’s marketing campaign is not intellectual property.
    Instead, a marketing campaign would likely be labeled “corporate confidential.”


    11. An analyst reviews DLP logs of sensitive documents attached to outgoing emails.
    The analyst discovers a sent document titled “Hilltop Organization Chart,” Hilltop
    Cabinets. The document was sent to Hilltop’s primary competitor, a company called
    Sanctuary Sinks. What type of data does this incident cover?


