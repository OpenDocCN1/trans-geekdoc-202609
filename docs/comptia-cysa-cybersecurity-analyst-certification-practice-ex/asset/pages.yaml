- pgno: 7
  md: '# ABOUT THE AUTHOR


    **Jeff Parker** is a certified trainer and consultant who loves breaking, fixing,
    and re-breaking his home lab. His career in information security spans from engineer
    consulting with HP in Boston, to IT risk management with Deutsche Post in Prague,
    Czech Republic, and ending now in Canada, where he most teaches how security can
    succeed alongside business goals.


    Jeff is a believer in CySa+ certification for IT professionals who can recognize
    and respond to information security issues. Over many years, he has earned (and
    let lapse) several certifications, including the MCSE, CCNA, MCNE, and three from
    SANS Institute. Jeff does maintain his CISSP (since 2004), as well as the CompTIA
    IT+ and Project+ certifications. But his new favorite is, of course, CySA+.


    # About the Technical Editor


    **Brice Kelly Sparks** is the Test Directorate Information System Security Manager
    for the U.S. Missile Defense Agency and has more than 30 years experience in the
    cybersecurity field. Kelly''s experience includes 20 years in the U.S. Air Force,
    specializing in electronic systems security assessment, information operations,
    electronic warfare training, and operations security. Prior to joining the Missile
    Defense Agency, he served as the principal cybersecurity analyst with Dynetics,
    Inc., for nine years, specializing in certification and accreditation, network
    vulnerability assessment, and penetration testing, providing service to multiple
    Department of Defense and commercial technology clients. He has more than eight
    years teaching experience as an adjunct faculty member at the University of Alabama
    in Huntsville, the U.S. Air Force Information Operations School, and the U.S.
    Navy Network Security and Vulner course. Kelly has an A.S. in intelligence analysis
    from the Community College of the Air Force, a B.S. in computer science from Park
    University, and an M.S. in network security from Capitol Technical University.
    Kelly also holds the CISSP certification.


    # About the Contributor


    **Bobby E. Rogers** is an information security engineer working as a contractor
    for Department of Defense agencies, helping to secure, certify, and accred their
    information systems. Bobby has a master’s degree in information assurance (IA)
    and is'
  merge: -1
  img_proc: true
