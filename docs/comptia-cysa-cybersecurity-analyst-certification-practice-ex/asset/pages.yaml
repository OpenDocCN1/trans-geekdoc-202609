- pgno: 236
  md: '# # Selecting the Best Course of Action


    This chapter includes questions on the following topics:


    +   - How to diagnose incidents by examining network symptoms

    - How to diagnose incidents by examining host symptoms

    - How to diagnose incidents by examining application symptoms


    Unfortunately, in the real world, when issues appear, they are not isolated but
    rather mixed together with the routine chaos and normal “buzz” of a production
    environment. Moreover, issues might not come one at a time. Instead, one issue
    might overlap with another, at least due to symptoms and timing. Your challenge,
    should you choose to accept it as a certified CySA+, is to diagnose those issues.
    This chapter is focused on diagnosing problems and determining the myriad of symptoms
    that point us them.


    Diagnosing a problem, or incident, starts with identifying what’s wrong or different
    in your environment. Obviously, to must identify what first have a solid understanding
    of what’s right or normal in your environment. That “normal” is also called the
    baseline. The steps on how to get a baseline are not covered in detail in this
    chapter, because it’s assumed that the baseline for your environment is already
    established and understood. This should be done before an incident occurs in order
    for you to have a point of comparison. So, on the assumption you have something
    to compare it to, you can diagnose your incident by what’s changed in your environment.


    What this chapter covers diagnosing your full environment, including the network,
    the hosts, and their applications. Each of these areas offers a variety of telltale
    behaviors and points to examine. This chapter focuses on the assortment of symptoms
    found in these areas.


    # QUESTIONS


    +   1. Which of the following bandwidth-consumption behaviors strongly indicates
    something suspicious?


    +   A. Higher-than-normal bandwidth, every day, at the same time'
