- pgno: 212
  md: 'an analyst requests a list of essential business processes from the CIO. Select
    from the following factors which one analyst is most concerned with to prioritize
    the team''s response.


    +   A. Downtime


    +   B. System process criticality


    +   C. Recovery time


    +   D. Economic


    B is correct. System process criticality is the factor that defines whether or
    not business processes are essential.


    A, C, and D are incorrect. A is incorrect because the downtime factor involves
    how much downtime is allowable. C is incorrect because recovery time, which is
    related to downtime, describes how quickly business processes will be recovered.
    D is incorrect because economic factors include direct and indirect financial
    impacts.


    +   4. Of the following metrics, which ones rely on a company being able to endure
    a certain amount of downtime? (Choose all that apply.)


    +   A. Designated acceptable downtime (DAD)


    +   B. Key performance indicators (KPIs)


    +   C. Maximum tolerable downtime (MTD)


    +   D. Recovery time objective (RTO)


    C and D are correct. Both the MTD and RTO presume a company can survive to some
    degree. The MTD is the maximum tolerable downtime before an organization''s essential
    systems suffer critically, while the recovery time objective (RTO) describes the
    period of time when a company strives to recover from a disaster before suffering
    significant damage.


    A and B are incorrect. A is incorrect because D is a fictional term. B is incorrect
    because KPIs have nothing to do with downtime.


    +   5. Multiple factors can affect the severity of an incident. Which of the following
    factors does not necessarily impact an incident''s severity?


    +   A. Downtime


    +   B. Probability of corruption


    +   C. MTD


    +   D. System process criticality'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'E. None of the above


    B is correct. There is no direct correlation between measuring an incident''s
    severity and the probability of corruption.


    A, C, D, and E are incorrect. A is correct because downtime directly affects the
    severity of the incident. C is incorrect because MTD, or maximum tolerable downtime,
    affects an incident''s severity. D is incorrect because system process criticality
    is how essential a business process is—a direct factor on how severe the impact
    caused by an incident is. E is incorrect because B is a correct answer.


    +   6. The many factors that affect incident severity, which of the following
    takes the cybersecurity team the longest time to detect issues for or determine
    the scope of its impact?


    +   A. Data integrity


    +   B. System process criticality


    +   C. Recovery time


    +   D. Type of data


    A is correct. Certainly in relation to the other answers, it takes much longer
    to determine whether data was wasn''t altered by an attacker or incident.


    B, C, and D are incorrect. B is incorrect because system process criticality is
    known and discussed immediately after the incident. C is incorrect because recovery
    time is known on everyone''s mind right away if an incident causes downtime. D
    is incorrect because the type of data (for example, HIPAA or PHI) is known and
    considered in parallel with incident recovery.


    +   7. What is the desired relationship when comparing RTO and MTD?


    +   A. The RTO should be longer than the MTD.


    +   B. The RTO should be shorter than the MTD.


    +   C. The MTD and RTO should be roughly the same length.


    +   D. The MTD should be close to zero as possible.


    +   E. The RTO needs to be twice the MTD.


    +   F. The MTD needs to be twice the RTO.


    B is correct. The recovery time objective should be shorter than the maximum tolerable
    downtime.


    A, C, D, E, and F are incorrect. Each of these incorrect answers offers a wrong
    or ridiculous statement about the relationship between RTO and MTD.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '+   8. The United States Privacy Act of 1974 created rules regarding the collection,
    storage, and use of what kind of data?


    +   A. Financial


    +   B. Intellectual property


    +   C. PII


    +   D. Payment card information


    +   C is correct. Personally identifiable information (PII) is protected by the
    U.S. Privacy Act of 1974.


    +   A, B, and D are incorrect. A is incorrect because financial information is
    not protected by the U.S. Privacy Act of 1974 but instead by Sarbanes-Oxley and
    the Graham-Leach Bliley Act. B is incorrect because intellectual property (IP)
    is not protected by the U.S. Privacy Act of 1974 but instead by local or state
    laws governing IP. D is incorrect because payment card information is governed
    by PCI DSS


    +   9. Which of the following is not a PCI DSS goal or requirement?


    +   A. Regularly monitor and test networks.


    +   B. Maintain an information security policy.


    +   C. Build and maintain a secure network and systems.


    +   D. Enforce employee security awareness training.


    +   E. Protect cardholder data.


    +   D is correct. Security awareness training is not a PCI DSS requirement.


    +   A, B, C, and E are correct. All answers are requirements of the Payment Card
    Industry Data Security Standard.


    +   10. Select from the following types that fall under the term “intellectual
    property.” (Choose all that apply.)


    +   A. The patent behind a company’s best-selling product


    +   B. Your favorite shoe company’s trademark


    +   C. The secret recipe of a chicken flavoring


    +   D. The details about a company’s marketing campaign


    +   A, B, and C are correct. A is correct because patents are intellectual property.
    B is incorrect because a trademark is intellectual property. Finally, C is correct
    because a secret recipe is a company’s trade secret, which is also intellectual
    property.'
