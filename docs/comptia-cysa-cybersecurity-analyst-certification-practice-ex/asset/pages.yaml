    +   22. Which of the following are key challenges to analyzing wireless networks?
    (Choose all that apply.)


    +   A. High confidence in the hardware addresses of wireless devices


    +   B. Recognizing what devices are authorized


    +   C. Having an inventory of all WAPs


    +   D. Determining whether the network is in ad-hoc or infrastructure mode


    A and B are correct. A is correct because the hardware or MAC addresses of wireless
    devices are fairly simple to modify. Most operating systems provide this ability
    without requiring special software. B is correct because wireless devices are
    so commonplace that the number of connected devices changes constantly—especially
    in an environment with a bring-your-device (BYOD) policy.


    C and D are incorrect. C is incorrect because having an inventory of the company''s
    wireless access points (WAPs) should be fairly simple. It''s assumed that the
    company installed the access points, so that baseline is far more straightforward
    than having a comprehensive list of all wireless devices connected to the WAPs.
    D is incorrect because the administrator (or should) should know how the wireless
    network is set up.'
