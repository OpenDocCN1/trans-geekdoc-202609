- pgno: 259
  md: '# Frameworks, Policies, Controls, and Procedures


    This chapter includes questions on the following topics:


    +   - Common information security management frameworks

    - Common policies and procedures

    - Considerations in choosing controls

    - How to verify and validate compliance


    Before a security analyst can complain they are too busy, the analyst needs to
    understand why they are busy. Before the first configuration change is made and
    before any management tool is used, the organization needs to know what it wants
    to enforce and monitor. Before the environment can be secured, there needs to
    be documented steps on how to carry that out. These answers and much more are
    provided by the organization’s policies and procedures. The policies state the
    “why,” while the procedures specify the “how.”


    When an organization is tackling the question of how best to marry security and
    business in the environment, frameworks can provide an overarching approach. Other
    frameworks can be used that focus on service management or security for government
    systems, for example. A variety of frameworks is available, as you will find in
    this chapter as we delve into policies and procedures.


    # QUESTIONS


    1. The Cyber Security Framework published by NIST includes the CSF Core. The Core
    organizes cybersecurity activities into five main functions. Which of the following
    answers lists these five functions in the correct order?


    +   - A. Identify, Protect, Detect, Respond, Recover

    - B. Detect, Identify, Respond, Recover, Protect

    - C. Identify, Detect, Respond, Recover, Protect

    - D. Detect, Identify, Recover, Respond, Protect'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'E. Identify, Protect, Detect, Recover, Respond


    +   2. Which of the following frameworks is an architectural framework that defines
    business requirements from a security perspective, and then continues building
    levels of detail for the practical implementation?


    +   A. ITL


    +   B. TOGAF


    +   C. SABSA


    +   D. COBIT


    +   3. A company wants to protect its information according to the varied levels
    of how sensitive the information is as well as the potential for damage if that
    information is lost. What sort of policy would most benefit the company?


    +   A. Data classification


    +   B. Data backup


    +   C. Data ownership


    +   D. Data retention


    +   4. Which of the following requirements would you not expect to find in a password
    policy?


    +   A. Prohibited types of words


    +   B. Minimum password age


    +   C. Technology solution


    +   D. Types of characters to be used


    +   5. Which of the following comprises and presents the Information Security
    Management System (ISMS) standards?


    +   A. The Open Group Architecture Framework


    +   B. IT Governance Institute


