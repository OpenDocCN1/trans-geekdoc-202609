- pgno: 51
  md: 'D is correct. Port scanner would quickly reveal what ports (and the services
    behind them) are open and listening on devices on the scanned network.


    A, B, and C are incorrect. A and B are incorrect because an IDS/HIDS (but not
    an IPS) should alert on valid services instead of only detected malware traffic.
    C is incorrect because reviewing firewall logs and router ACLs will tell about
    flagged traffic attempts and permitted traffic, but provides little information
    about services and the systems providing them.


    +   21. When you''re capturing packets on a wireless network versus a wired network,
    which of the following statements are true? (Choose all that apply.)


    +   A. Using promiscuous mode to view all packets applies on both wired and wireless
    networks.


    +   B. Being in monitor mode allows for the capture of all 802.11 activity, without
    connection to the access point.


    +   C. Wireless signals can be relatively limited beyond a physical presence such
    as a fence.


    +   D. Strong, secure encryption provides no protection against data exposed eavesdropping.


    +   A and B are correct. A is correct because promiscuous mode, if supported by
    the wireless card, is what allows the card to process all 802.11 activity, not
    just traffic targeted to that card. B is correct because monitor mode allows the
    same visibility to all activity, even without being connected to an access point.


    +   C and D are incorrect. C is incorrect because wireless signals are generally
    not affected by thin physical structures such as fences. The distance from the
    access point has more of an effect on signal strength. D is incorrect because
    strong encryption does indeed protect against eavesdropping when data is gathered.
    The signal can be collected, but encryption ensures confidentiality.'
