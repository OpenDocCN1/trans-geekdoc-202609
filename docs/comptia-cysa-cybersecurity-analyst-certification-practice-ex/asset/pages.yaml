  md: 'A. Ensure the OS and applications patched.


    B. Increase the size of the hard drive; add more memory.


    C. Create the contractor new account.


    D. Back up your data and perform a fresh, updated system install.


    +   D is correct. Given the older system was probably poorly managed and behind
    patch management, the system might have been compromised. Best approach is to
    wipe it and start with a new, up-to-date install if the system has the resources.


    +   A, B, and C are incorrect. A is incorrect because although the OS and/or applications
    are likely not up to date on patching, it might be too late for course of action.
    B is incorrect because increasing the hard drive and memory space is a good idea
    once the system has a fresh install. C is incorrect because creating a new account
    will not solve the system performance problems.


