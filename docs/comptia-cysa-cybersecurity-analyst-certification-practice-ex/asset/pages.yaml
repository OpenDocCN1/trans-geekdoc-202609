    What type of analysis are you performing now?


    +   A. Trend


    +   B. Heuristics


    +   C. Packet capture


    +   D. Spatial trend


    B is correct. The scenario portrays a new, unknown behavior. From that, you know
    you cannot rely on known threats. This will require heuristics analysis.

    A, C, and D are incorrect. A is incorrect because careful trend analysis might
    only show effects of the malware, but won’t disclose the malware itself. C is
    incorrect because packet capture analysis is helpful after you know what'
