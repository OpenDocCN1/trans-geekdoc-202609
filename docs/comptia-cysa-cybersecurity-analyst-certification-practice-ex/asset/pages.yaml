- pgno: 283
  md: '+   B is correct. Because auto-provisioning means creating an account on the
    fly, the service provider (SP) is completely trusting the identity provider''s
    assertion that the user is allowed to hold an account. Therefore, the identity
    provider (IDP) cannot be compromised; otherwise, trust is easily abused.


    +   A, C, and D are incorrect. It''s best to never trust the consumer or user.
    The service provider is of course important, the burden falls much on the identity
    provider to be trustworthy. Network access is important to keep secure, as always,
    but no more when auto-provisioning is used.


    +   11. A company recently implemented a self-service password reset mechanism.
    Although this saves the administrators hours of time dealing with forgotten passwords,
    a new problem has started. Administrators have noticed brute-force attacks on
    the password reset page. Even though the password reset page is visible outside
    the company, the attacks are always valid e-mails, so the administrator suspects
    an insider is responsible. What might be the source of the problem on the reset
    page?


    +   A. Error messages for invalid input


    +   B. Website source code


    +   C. Constant availability


    +   D. Instructions on reset page usage


    +   A is correct. Having different error messages for an invalid username and
    invalid password only serves to ensure a username is valid. Confirming the attacker
    that a username is valid means they can spend more time brute-forcing the password.


    +   B, C, and D are incorrect. Learning that only valid usernames are being attacked
    tells you that the website source code and availability are not the weakness.
