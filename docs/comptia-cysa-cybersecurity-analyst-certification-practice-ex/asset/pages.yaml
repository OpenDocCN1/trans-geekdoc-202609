  md: '# D. IHL


    C is correct. TTL stands for Time To Live, the value set for how many hops a packet
    has to go through before ending and expiring. The starting value for TTL varies
    based on operating system, but the more popular OSs use a value of 255 or 128.


    A, B, and D are incorrect. A is incorrect because the fragment offset facilitates
    breaking up a packet into smaller, individually transmitted units. B is incorrect
    because the Type of Service field helps set a priority or quality of service to
    keep the packet. D is incorrect because the Internet Header Length value just
    denotes the length of the header.


