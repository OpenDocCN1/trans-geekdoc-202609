    \ operations\n\nImplementing the right compensating control is the focus of this\
    \ chapter. The purpose of a compensating control is to mitigate the risk already\
    \ assessed in your environment. But how do you know the control is providing the\
    \ value you desired? You measure a control’s effectiveness through analysis of\
    \ the affected systems or area. Depending on the actual system or type of control,\
    \ you might be analyzing logs, gauging the difference between prior to the control\
    \ being implemented and afterward. Able to analyze data—whether in the form of\
