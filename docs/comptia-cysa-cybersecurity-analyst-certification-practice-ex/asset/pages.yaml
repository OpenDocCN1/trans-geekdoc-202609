    a capable, application-layer firewall.


    +   A, B, and C are incorrect. A is incorrect because it is a false to claim the
    application-layer firewall is unable to identify higher-layer data. B is incorrect
    because, although an IDS/IPS would help, the firewall''s shortening is the primary
    issue here. C is incorrect because the rules are likely not able to address the
    application-layer issue.


    +   19. If an attacker is using nmap to map the network topology, which of the
    returned states of the port scans provides the least information?


    +   A. Unfiltered


    +   B. Filtered


    +   C. Closed


    +   D. Open


    +   B is correct. Filtered state means the nmap probe scan was unable to reach
    the port, or hear back whether the port was open or closed. This would make the
    attacker’s efforts most difficult in mapping the network topology in order to
    understand the various network areas such DMZ, perimeter devices, and other key
    network components.


    +   A, C, and D are incorrect. A is incorrect because unfiltered nmap was able
    to reach the port but unable to determine conclusively whether it was open or
    closed. The unfiltered state only applies when an ACK scan is being performed,
    often to map firewall rules. C is incorrect because closed means the port was
    reached and decidedly closed. D is incorrect because open means the port was reached
    and concluded to be open or listening.


    +   20. What would be an appropriate tool for performing service discovery on
    a large network?


    +   A. An IDS (but no IPS) placed anywhere on the servers’ local subnet


