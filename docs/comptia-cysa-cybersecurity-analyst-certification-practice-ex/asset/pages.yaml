    infecting systems by exploiting a previously unknown vulnerability. Wildfire identifies
    and exfiltrates spreadsheet documents with large dollar amounts. The documents
    are covertly sent to a known and powerful adversarial country. What is this type
    of malware called?


    +   A. APT exploit


    +   B. Zero-day exploit


    +   C. Financial exfiltration malware


    +   D. Economic threat


    B is correct. Malware that works on exploiting a previously unknown vulnerability
    is called a zero-day exploit.


    A, C, and D are incorrect. A is incorrect because such an exploit is not called
    an APT exploit just because of the nation from which it supposedly originated.
    C and D are incorrect because these are not normal terms, despite what the question’s
