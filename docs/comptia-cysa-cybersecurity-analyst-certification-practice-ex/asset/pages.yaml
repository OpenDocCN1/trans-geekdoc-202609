- pgno: 106
  md: 'A, D, and E are incorrect. A is incorrect because the IT security director
    is not senior enough to accept liability for possible negative impacts from testing.
    Similarly, D is incorrect because the role of cybersecurity analyst is not senior
    enough. E is incorrect because approval is absolutely necessary. Without approval,
    penetration testing is unethical, if not illegal.


    +   3. Guidelines are to be drawn prior to any penetration testing can begin,
    and they determine the exact nature and scope of the testing. What are these guidelines
    called?


    +   A. Penetration TTP (Tactics, Techniques, and Procedures) document


    +   B. ROE (rules of engagement)


    +   C. Scope and Invoicing document


    +   D. Discovery


    +   B is correct. Having the rules of engagement (ROE) is an absolute necessity
    before beginning any phase of a penetration test. The ROE determine what is within
    bounds, out of bounds, with whom to communicate, and so on. Most importantly,
    the approved rules of engagement function as your “get out of jail free” card,
    containing that without them, the penetration test is illegal.


    +   A, C, and D are incorrect. A is incorrect because TTP does not reference a
    standard document, but instead refers to the general techniques and processes
    of conducting the test. C is incorrect because there is no standard document called
    a “Scope and Invoicing” document. D is incorrect because discovery is an early
    phase of a penetration test, not procedural document.


    +   4. The company CEO recently came back from a conference about cybersecurity.
