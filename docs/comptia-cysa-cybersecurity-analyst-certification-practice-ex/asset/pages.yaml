- pgno: 45
  md: '+   7. A small business is concerned about the threat of social media profiling
    on its employees. Which of the following actions could you take to best mitigate
    the threat?


    +   A. Demonstrate phishing examples to the users.


    +   B. Increase the level of detail in the system logs.


    +   C. Review the social media application logs with management.


    +   D. Review job site listings with HR and systems administrators.


    +   A is correct. Phishing e-mails are a common result of targeted social media
    profiling. Showing the dangers of phishing might improve their social profiles.


    +   B, C, and D are incorrect. B is incorrect because system logs provide reflection
    of social media profiling. C is incorrect because management is already aware
    of the problem, and reviewing application logs accomplishes little here. D is
    incorrect because job site listings are not the problem.


    +   8. Which of the following is not an example of a virtualization technology?


    +   A. Containers


    +   B. Software-defined networking


    +   C. Mirroring


    +   D. Hypervisors


    +   C is correct. Mirroring describes a technique of fault tolerance in storage,
    in the case of switch ports, it describes copying network traffic. Mirroring is
    not a virtualization technology.


    +   A, B, and D are incorrect. Containers, software-defined networking (SDN),
    and hypervisors are all virtualization technologies.


    +   9. Which of the following is a Type 2 hypervisor?


    +   A. VMware Player


    +   B. Microsoft Hyper-V


    +   C. VMware ESX


    +   D. Kernel-based Virtual Machine


    +   A is correct. VMware Player is a Type 2 hypervisor, which means it runs within
    an operating system.


    +   B, C, and D are incorrect. Microsoft''s Hyper-V, VMware ESX, and Kernel-based
    Virtual Machine are all Type 1 hypervisors, also called bare-metal hypervisors
    because the software runs directly on the “bare metal” hardware,'
  merge: -1
  img_proc: true
- pgno: 46
  md: '+   10. Which of the following is not an actual cloud computing technology?


    +   A. IaaS


    +   B. SaaS


    +   C. PaaS


    +   D. SDN


    D is correct. Although SDN (or software-defined networking) is a virtualization
    technology, it is not necessarily in the cloud.


    A, B, and C are incorrect. A is incorrect because Infrastructure as a Service
    (IaaS) describes utilizing a complete infrastructure from a service provider.
    B is incorrect because Software as a Service (SaaS) describes user access to specific
    applications from a service provider. C is incorrect Platform as a Service (PaaS)
    describes running a platform on top of a server operating system.


    +   11. You are tasked with scanning across the network space192.168.2.x and identifying
    what operating systems are presently running. Select the correct tool and command-line
    switch necessary to determine what operating systems are running on that subnet.


