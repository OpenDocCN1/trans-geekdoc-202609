- pgno: 216
  md: '13. What is the particular criminal threat when data related to a company’s
    intent to integrate with another company is mishled?


    +   A. Leaked information could lead to trading based on privileged knowledge.


    +   B. Shareholders of both companies could vote to stop the merger.


    +   C. Leaked trade secrets could lead to increased competition.


    +   D. Violations of HIPAA requirements.


    +   A is correct. Leaked information about a merger in progress or even a desired
    could lead to a stockholder deciding to trade their shares. Trading based on privileged
    information is a crime called insider trading.


    +   B, C, and D are incorrect. B is incorrect, even if shareholders became privy
    to the knowledge, they wouldn’t get a chance to vote until the decision was legally
    eligible to be put up for a vote. C is incorrect because trade secrets wouldn’t
    be shared between the companies to be merged until the deal was done. There should
    be no threat to either company’s trade secrets. D is incorrect because there was
    no mention of personal health information (PHI).


    14. Which of the following factors determines some noted event will be considered
    a security incident?


    +   A. Downtime


    +   B. Scope of impact


    +   C. Economic


    +   D. Types of data affected


    +   B is correct. Scope of impact is the official determination that has an event
    crossing the boundary into a defined security incident.


    +   A, C, and D are incorrect. A is incorrect because downtime is a serious outcome
    of an incident, but it is not the trait that distinguishes an incident from an
    event. C is incorrect because the economic effects of an incident are typically
    not measurable in the short term compared to other factors. D is incorrect because
    the types of data, especially those under regulatory protection, often distinguish
    a severe incident from a moderate one. This is not a factor that can push an event
    into being an incident.


    15. In the context of long-term effects from a security incident, particularly
    to a company’s reputation and ability to gain potential business, which factor
    is the most impactful on an incident’s severity?


    +   A. Recovery time'
