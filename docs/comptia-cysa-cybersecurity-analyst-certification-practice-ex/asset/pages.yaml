    +   9. A vice president''s workstation is actually racing, so you investigate
    the laptop personally. You carefully review the system''s application and security
    logs. You confirm the antivirus is running and nothing is quarantined. You evaluate
    the running processes and find nothing out of the ordinary. After using command-line
    utilities to confirm no strange network connections, you feel somewhat frustrated
    to find nothing to report. What action should you take?


    +   A. Return the laptop to the vice president and report that all are fine.


    +   B. Reinstall and update the antivirus to rescan the system.


    +   C. Assume the laptop has a rootkit and wipe the system immediately.


    +   D. Use tools external to the laptop to explore the suspicion of a rootkit.


    +   D is correct. Despite suspicious behavior, local tools reporting nothing wrong
    is a strong suggestion to explore deeper with offline tools. Using tools stored
    on media outside the system, and if possible without the OS running, can improve
    visibility without allowing the potential rootkit to mask itself.


    +   A, B, and C are incorrect. Returning the laptop might be what the VP would
    like, but this is not acceptable until some closer examination. Because a rootkit
    is resident under the operating system and running applications, reinstalling
    the antivirus would only give you a false sense of security. Although a rootkit
    might be the suspicion, such a suspicion is typically not enough to warrant wiping
