    +   D. Cross-training


    +   E. Network design


    +   A, B, and E are correct. Automated log review and reporting, load balancers,
    and network design are technology-based compensating controls. Technology-based
    controls provide the speed, automation, and opportunities to minimize the impact
    of human error and complacency.'
  merge: -1
  img_proc: true
