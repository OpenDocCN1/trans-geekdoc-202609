- pgno: 324
  md: 'D is correct. Celebrite''s flagship product, the Universal Forensic Extraction
    Device (UFED), is a handheld device for facilitating data extraction while also
    employing write blocking.


    A, B, C, and E are incorrect. EnCase is by far the most popular forensic product
    used by law enforcement. However, its mobile device capabilities are not close
    to those of UFED. The tool FTK Imager is another well-known forensic tool for
    law enforcement for data preview and volume imaging, but is not useful for mobile
    devices. As a side note, FTK has a utility—the Mobile Phone Examiner Plus (MPE+)—that
    apply here, but MPE+ wasn''t given as an answer option. The Windows utilities
    originally created by Sysinternals (now owned by Microsoft) are powerful tools
    for security analysts, but their capabilities offer nothing particular to mobile
    devices. Helix is the only forensic tool that provides value specific to mobile
    devices. However, to date, Helix''s mobile utilities are still not as robust and
    versatile as those offered by Celebrite.


    +   6. As a safety measure, a finance manager has been archiving the small company''s
    finance folder every evening, keeping the backup off the server. One early morning,
    the manager asks you there is any way to ensure that the files have not changed
    since they were archived the night before. What tools can you use to demonstrate
    no changes have been made? (Choose all that apply.)


    +   A. md5sum


    +   B. tcpdump


    +   C. shasum


    +   D. Vega


    +   E. ZAP


    A and C are correct. To verify the collection of files remain, the finance manager
    should archive the files again and then compare hashes made from the two archives.
    A hash is a value computed from the precise structure of a file. Only if the archives
    are exactly alike will the hash values be exactly alike. The two utilities that
    create hash values are md5sum and shasum.


    B, D, and E are incorrect. The utility tcpdump is a command-based packet capture
    and analysis tool. For use on different platforms, but arguably best on Linux/Unix
    systems, tcpdump is ideal for capturing packets off the network, not for comparing
    files and archives. Instead, Vega is an interception proxy, so it sits between
    a user and the resources the user seeks to access. The proxy will monitor access
    requests'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'and possibly act on them, depending what its user wants to do. Vega, written
    in Java, offers automated scanning, injection discovery, and XSS vulnerability
    discovery. ZAP is an interception proxy like Vega. However, ZAP is considerably
    more popular because of its easier learning curve and intuitive interface. Interception
    proxies are a special type of tool in that they act both as an analyzer and an
    exploit tool, like a man-in-the-middle attack.


    +   The in-house development team is proud of their newest XML application. They
    claim that if you can break the application by entering data in like a user would,
    they will buy you lunch. Seeing how you are hungry, what tool do you reach for?


    +   A ModSecurity


    +   B Kiwi Syslog


    +   C Cain & Abel


    +   D Untidy


    +   D is correct. Untidy is a fuzzing tool, meaning its purpose is to send unexpected
    input to an application with the intent of breaking or crashing it. Input values
    vary in type and size, from slightly “off” to vastly different from what the application
    expects. Untidy works with XML and modifies before inputting it. Currently, Untidy
    is part of the Peach Fuzzer project. Peach Fuzzer is a suite of fuzzing tools
    that rely on XML-based modules, which their designers call “pits.” The pits are
    what configure the control how to conduct the test.


    +   A, B and C are incorrect. ModSecurity is a monitoring and control toolkit
    that benefits from the OWASP Core Rule Set (CRS), a set of detection rules tailored
    for web application attacks. Kiwi Syslog, like ModSecurity, is also a monitoring
    tool. However, Kiwi functions just short of an actual SIEM, and instead contends
    on regulatory compliance issues. Cain & Abel is a password-cracking tool, and
    although it does perform brute-force attempts, it would not be able to operate
    with the developer’s new XML input.


