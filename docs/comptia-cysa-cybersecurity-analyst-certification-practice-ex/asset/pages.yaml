- pgno: 292
  md: '# 14. B


    # IN-DEPTH ANSWERS A


    +   1. You''re the manager of a small team of information security specialists.
    The team recently ended a challenging period of a few incidents and one forensic
    investigation involving law enforcement. Given that the incidents and investigation
    are finished, the team seems to be struggling considerably. In fact, you notice
    that the patch rollout cycle is inconsistent, occasionally taking twice as long
    as it should. What might you consider to be most helpful to the team?


    +   A. Succession planning


    +   B. Awarding team members for dedication


    +   C. Mandatory vacation


    +   D. Cross-training


    +   C is correct. After the described recent workload, the team is likely tired
    and weary. Further, as the narrative explained about the inconsistent patch management
    cycle, the team has grown complacent. In this case, mandatory vacation is required
    to ensure team members get the needed rest.


    +   A, B, and D are incorrect. A is incorrect because succession planning is an
    organization''s planned transition of responsibilities from the current person
    to the successor. In this case, succession planning would be useful if current
    personnel decided to leave, but such planning should have already been done. B
    is incorrect because recognition, while nice and appreciated, will do little to
    subside the team''s exhaustion and complacency. D is incorrect because cross-training
    is certainly useful in order to mitigate the loss of skills when a specialist
    is absent (such as on mandatory vacation), but implementing training at this time
    would only add to the team''s workload. Mandatory vacation should come first.


    +   2. Over time, the specific needs on systems, applications, and business processes
    will change. How an organization approaches and accomplishes these changes depends
    on the maturity of the organization. In the context of continual changes, what
    distinguishes a mature organization from other organizations?


    +   A. Process improvement


    +   B. Process definition


    +   C. Process documentation'
