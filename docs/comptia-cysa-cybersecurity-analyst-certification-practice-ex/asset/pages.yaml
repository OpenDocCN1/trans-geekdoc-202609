  md: '# A. RADIUS


    # B. TACAS+


    # C. LDAP


    # D. XTACACS


    +   A is correct. The Remote Authentication Dial-In User Service (RADIUS) uses
    UDP, not TCP. Additionally, RADIUS allows the use of a “shared secret” across
    the network. For both these reasons, using an unreliable or untrusted network
    is highly discouraged if the company is wanting to use RADIUS.


