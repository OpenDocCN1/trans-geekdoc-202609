  md: 'nslookup (Windows) is for DNS resolution and information, but it provides little
    information outside of DNS-related statistics. The utility ifconfig (Linux/Unix)
    or ipconfig (Windows) will provide configuration and static information about
    the network interface, but it provides little information related to packets.


    +   4. Which of the following vulnerability scanners is the open source and free
    of the commercially licensed scanner Nessus?


    +   A. Nikto


    +   B. OpenVAS


    +   C. Nexpose


    +   D. Qualys


    +   E. Microsoft Baseline Security Analyzer


    +   B is correct. OpenVAS is open source and free to use. Originally forked from
    the Nessus project, OpenVAS is similarly structured and capable.


    +   A, C, D, and E are incorrect. All of the vulnerability scanners collect and
    analyze the data, but their scope and pricing differ. Nikto is also a vulnerability
    scanner, unlike Nessus, Nikto is a command-line utility and specific to web servers.
    As such, Nikto works very quickly but is not intuitive as GUI-based tools. Nexpose,
    like Nessus and Nikto, is also a vulnerability scanner. While Nessus is more useful
    for managing vulnerabilities, it can integrate directly with Metasploit, making
    Nexpose something of an exploitative tool as well. Qualys commercially licenses
    its vulnerability scanner QualysGuard. Lastly, the Microsoft Baseline Security
    Analyzer is free, but only capable of scanning Windows endpoints and servers.


    +   5. A recent incident has led to law enforcement (LE) taking several employees''
    mobile devices. LE requires data extraction from these devices, while ensuring
    no changes to the data can be made during extraction. Given the scope of effort,
    and how it''s done on company-managed devices, LE asks for your suggestion on
