  md: '# Securing a Corporate Network


    This chapter includes questions on the following topics:


    +   * Penetration testing

    * Reverse engineering

    * Training and exercises

    * Risk evaluation


    Keeping the corporate environment secure can be a formidable task. Assuming the
    cybersecurity team has already hardened the network and hosts as covered in earlier
    chapters, there is already an established level of assurance of the environment''s
    security. The next task is maintaining or raising that level. Fortunately, there
    are approaches and practices that work well.


    Penetration testing can be a highly effective process at identifying and prioritizing
    needs to improve security at a company''s environment. Penetration testing, beginning
    with top-level authorization and ending with a full briefing to management, pushes
    the cybersecurity analyst to react and defend against attacks without the real-world
    exposure of an attack. Coordinated training and exercises, along with other means
    of risk evaluation, will raise the environment''s security level. Also discussed
    in this chapter are processes and practices to raise assurance in present hardware
    and software.


