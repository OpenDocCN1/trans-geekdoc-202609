- pgno: 284
  md: 'A, B, and D are incorrect. Session hijacking generally happens because the
    session key was captured and replayed to impersonate the valid client. Regardless
    of whether session keys are very long or contain any special characters, they
    can and will be captured. Only encryption between the client and server can thwart
    the key being captured. Having a very short timeout would likely only result in
    frustrated clients.


    +   Because the user appreciates how important security is when banking online,
