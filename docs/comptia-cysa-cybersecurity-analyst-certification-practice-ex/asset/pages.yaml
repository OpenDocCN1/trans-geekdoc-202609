    +   5. A very honest user tells Jon that if a user enters a single quote, followed
    by “OR 1=1” in the password field, they can make the application reply with the
    hours of any employee. What part of software development did Sam likely overlook?


    +   A. Parameter validation


    +   B. Input validation


    +   C. Stress testing


    +   D. Session tokens not randomized


    +   B is correct. Input validation is the coding practice of verifying that a
    user’s input falls within the expected range in size, character types, and format.


    +   A, C, and D are incorrect. Parameter validation is the coding practice of
    verifying the information passed is what the application expects. It’s similar
    to input validation, but parameter validation might also check in from another
    portion of the application or another application entirely. Stress testing involves
    pushing the application to its limits to see what breaks or fails first. Lastly,
    session tokens not being randomized is incorrect as session tokens are not relevant
    to the attack.


    +   6. Another honest user, Arya, reports that if she changes the user ID in the
    URL to someone else’s ID, she can get the paycheck for that person’s week. The
    same user claims by changing other parameters in the URL, she can make the server
    reveal much information about itself and the application. If you could hire her
    Arya to perform security analysis work, what type of work would her experience
    seem to match?


    +   A. Regression testing


    +   B. Interception proxy


    +   C. User acceptance testing


    +   D. Vulnerability scanning


    +   D is correct. Arya seems determined to find vulnerabilities in this web application.
    She successfully attempted URL manipulation as well as found information leaks.
    In this case, URL manipulation was able to make the application return another
    person’s paycheck amount. Web application vulnerability scanning would encompass
    these and many other checks, including cross-site scripting (XSS), improper use
    of HTTPS, improper authentication, and more.'
