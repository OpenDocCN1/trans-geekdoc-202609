- pgno: 78
  md: '# Responding to Network-Based Threats


    This chapter includes questions on the following topics:


    +   - Practices for network and host hardening

    - Deception techniques for improving security

    - Common types of access controls

    - Trends in threat detection and endpoint protection


    If only making a network secure required the push of a button. Alas, it doesn’t.
    The security analyst will be continually occupied with securing the network. Even
    after writing policy, hardening a configuration, and reviewing logs, the analyst
    must still make time to respond to threats as they become known. A secure network
    is not as much an end goal as it is a constant journey. The analyst’s first goal
    is to ensure the network performs as the business needs, with minimal risk to
    confidentiality, integrity, and availability. The business needs for the network
    might be fairly stable, but the risks to the network are changing all the time.


    To manage those risks and threats to the network, the cybersecurity analyst can
    respond with a variety of controls and techniques. Those controls and techniques
    range from additional hardware and software, to changes to the configuration and
    topology. Clearly, responding to network threats is a vital portion of being a
    cybersecurity analyst, and this chapter covers this important portion of the exam.


