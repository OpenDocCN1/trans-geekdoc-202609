  md: '# C. Location


    # D. Behavior


    +   C is correct. Location is understood to be the most difficult techniques to
    falsify of the four context-based approaches to authentication. Context-based
    authentication by location means using someone physical location, presumably via
    GPS, to determine whether that person should be authenticated.


    +   A, B, and D are incorrect. Time-based authentication would be fairly straightforward
    to forge. Frequency is determined by a reasonable assessment of how often someone
    attempts to authenticate. Naturally, if someone attempts 30 times a second, this
    couldn’t possibly be the correct person. Behavior-based authentication is possible
    after learning someone’s routine and expected performance. It would be difficult,
    but not impossible if you knew the target user well.


    +   2 Your company plans to employ single sign-on for services and web-based applications.
    It needs to choose a federated identity technology for authorization and, if possible,
    authentication. Which of the following technologies satisfy the company’s needs?
    (Choose all apply.)


    +   A. SAML


    +   B. Active Directory Federated Services


    +   C. OAuth2


    +   D. OpenID


    +   A, B, and C are correct. Security Assertion Markup Language (SAML) is commonly
    used for both authentication and authorization. AD Federated Services is used
    for both authentication and authorization, primarily in Windows environments.
    The OAuth2 protocol is used generally for authorization, commonly for services.
    Although OAuth2 is used inside of authentication protocols, it''s technically
    not a standalone replacement. In any case, the company requires authorization,
    not authentication.


    +   D is incorrect. OpenID is commonly used for authentication. However, unlike
    SAML, OAuth2, and AD Federated Services, OpenID cannot be used for authorization.


    +   3 When you’re securing endpoints, what is their main vulnerability in comparison
    to other identities with regard to authentication?


    +   A. Relative to servers, securing the endpoints is difficult to scale.


    +   B. Compared to applications, endpoints can only rely on token-based authentication.'
