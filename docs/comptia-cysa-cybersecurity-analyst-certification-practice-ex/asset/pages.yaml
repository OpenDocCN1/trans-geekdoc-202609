- pgno: 190
  md: '# The Incident Response Process


    This chapter includes questions on the following topics:


    +   - The stakeholders during incident response

    - Containment techniques

    - Eradication techniques

    - Response validation

    - Corrective actions

    - The purpose of communication processes


    The best-case scenario in responding to the unexpected requires a prepared plan
    and developed process. Inevitably the cybersecurity analyst will need to respond
    to an incident. An incident could mean discovering a compromised machine from
    long ago, or the incident could be ongoing, bringing the analyst and adversary
    face to face in real time. Technical steps, as part of a staged process, must
    be taken. This chapter covers the entire spectrum of the incident response process,
    from initial containment to the final response and corrective actions. Communication
    in incident handling is the communication done all along the way. Key to incident
    response is communication—from how the incident is first announced to how the
    lessons learned are shared after the fact. Communication in incident response
    is multifaceted, with key stakeholders at several levels all wanting to know what’s
    going on, what’s being done, and what it will take to not allow the incident happen
    again.


    # QUESTIONS


    +   1. Which of the following is not considered an important stakeholder during
    incident response?


    +   A. The organization’s legal department.


    +   B. Human resources.


    +   C. Marketing.


    +   D. Management.


    +   E. All are important stakeholders in incident response.'
