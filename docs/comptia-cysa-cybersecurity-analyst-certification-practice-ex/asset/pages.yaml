    10. In regard to stopping unauthorized software from being installed on a system,
    which approach is the most effective?


    +   A. Software blacklisting


    +   B. Standardized desktop images and privileges


    +   C. Software whitelisting


    +   D. Host-based intrusion detection and antivirus


    +   C is correct. Whitelisting, or allowing only explicitly listed applications,
    is the most restrictive method.


    +   A, B, and D are incorrect. A is incorrect because blacklisting particular
    software as "bad" or unauthorized is effective, but this method relies on knowing
    every potential piece of software. B is incorrect because having a standard image
    is good at the start, but if privileges are not restricted, then software could
    be installed. D is incorrect because using a host-based IDS and antivirus is very
    safe at stopping malware, but not necessarily restricting safe-but-unauthorized
    software.


