- raw: 'AI can be categorized into narrow AI, which is task-specific, and general
    AI, which can perform any intellectual task a human can.


    ## dos.


    La IA puede clasificarse en IA restringida, que es específica de una tarea, e
    IA general, que puede realizar cualquier tarea intelectual que pueda realizar
    un ser humano.


    ## tres.


    El aprendizaje automático es un subconjunto de la IA en el que las máquinas mejoran
    su rendimiento a partir de la experiencia.


    ## three.


    Machine Learning is a subset of AI where machines improve their performance from
    experience.


    ## tres.


    El aprendizaje automático es un subconjunto de la IA en el que las máquinas mejoran
    su rendimiento a partir de la experiencia.


    ## cuatro.


    El aprendizaje profundo, otro subconjunto del aprendizaje automático, utiliza
    redes neuronales multicapa para analizar diversos factores de los datos.


    ## four.


    Deep Learning, a further subset of Machine Learning, uses multi-layered neural
    networks to analyze various factors of data.


    ## cuatro.


    El aprendizaje profundo, otro subconjunto del aprendizaje automático, utiliza
    redes neuronales multicapa para analizar diversos factores de los datos.


    ## cinco.


    La IA tiene aplicaciones en diversos campos, como la sanidad, las finanzas, la
    automoción y el entretenimiento.


    ## five.


    AI has applications in various fields such as healthcare, finance, automotive,
    and entertainment.


    ## cinco.


    La IA tiene aplicaciones en diversos campos, como la sanidad, las finanzas, la
    automoción y el entretenimiento.


    ## seis.


    El Procesamiento del Lenguaje Natural (PLN) es una tecnología de IA que permite
    a las máquinas entender y responder al lenguaje humano.


    ## six.


    Natural Language Processing (NLP) is an AI technology enabling machines to understand
