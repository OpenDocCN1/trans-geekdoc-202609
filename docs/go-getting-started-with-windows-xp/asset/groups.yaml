  - '[PAGE 56]


    # Objective 4

    Create a New Folder


    Information you create in a computer program is stored in the computer''s memory,
    which is a temporary storage location. This data will be lost if the computer
    is turned off. To keep the information you create, you must save it as a file
    on one of the drives available to you. For example, a five-page term paper that
    you create in a word processing program such as Microsoft Word, when saved, is
    a *file*. Files can be stored directly on a drive, but more commonly are stored
    in a folder on the drive. A *folder* is a container for programs and files and
    is represented on the screen by a picture of a common paper file folder.


    Use folders to organize the location of your programs and files so that you can
    easily locate them for later use. Folders and files must be created and stored
    on one of the drives attached to your computer. Your available drives fall into
    three categories: 1) the nonremovable hard drive, also called the local disk,
    inside the computer; 2) removable drives that you insert into the computer such
    as a 3 ½ inch floppy disk, a ZIP disk, a flash drive, or a writable CD; or 3)
    a shared network drive connected to your computer through a computer network,
    such as the network at your college.


    # Activity 1.4 Creating a New Folder


    In Activity 1.4, you will create a folder on one of the three types of drives
    available to you—the local disk (hard drive), a removable drive (USB flash drive,
    ZIP disk, 3 ½ inch floppy disk, or some other type of removable drive), or a network
    drive. If you are using a computer in a college lab, you may have space assigned
    to you on a shared network drive. You can create these folders on any drive that
    is available to you. The following activity assumes that you are saving your file
    to a USB flash drive.


    **1** Insert your USB flash drive or other removable drive. If an action dialog
    box displays asking what you want Windows to do, click **Cancel**. On the taskbar,
    click the **Start** button, and then click **My Computer** to open the **My Computer**
    window. In the **My Computer** title bar, click the **Maximize** button if the
    window is not already maximized.


    A *dialog box* is a window that displays and that asks you to make a decision
    about an individual object or topic.'
