  - '[PAGE 12]


    # # About the Authors


    **Shelley Gaskin**, Series Editor, is a professor of business and computer technology
    at Pasadena City College in Pasadena, California. She holds a master’s degree
    in business education from Northern Illinois University and a doctorate in adult
    and community education from Ball State University. Dr. Gaskin has 15 years of
    experience in the computer industry with several Fortune 500 companies and has
    developed and written training materials for custom systems applications in both
    the public and private sector. She is also the author of books on Microsoft Outlook
    and word processing.


    **Robert L. Ferrett** recently retired as the director of the Center for Instructional
    Computing at Eastern Michigan University, where he provided computer training
    and support to faculty. He has authored or co-authored more than 70 books on Access,
    PowerPoint, Excel, Publisher, WordPerfect, and Word. Before writing for the *GO!
    Series*, Bob was a series editor and author for the *Learn Series*. He has a bachelor’s
    degree in psychology, a master’s degree in geography, and a master’s degree in
    interdisciplinary technology from Eastern Michigan University. Bob’s doctoral
    studies were in instructional technology at Wayne State University. For fun, Bob
    teaches a four-week computers and genealogy class and has written genealogy and
    local history books.


    **John Preston** is an Associate Professor at Eastern Michigan University in the
    College of Technology, where he teaches microcomputer application courses at the
    undergraduate and graduate levels. He has been teaching, writing, and designing
    computer training courses since the advent of PCs and has authored and co-authored
    over 70 books on Microsoft Word, Excel, Access, and PowerPoint. He is a series
    editor for the Learn 97, Learn 2000, and Learn XP books. Two books on Microsoft
    Access that he co-authored with Robert Ferrett have been translated into Greek
    and Chinese. He has received grants from the Detroit Edison Institute and the
    Department of Energy to develop Web sites for energy education and alternative
    fuels. He has also developed one of the first Internet-based microcomputer applications
    courses at an accredited university. He has a bachelor’s degree from the University
    of Michigan in Physics, Mathematics, and Education and a master’s degree from
    Eastern Michigan University in Physics Education. His doctoral studies were in
    Instructional Technology at Wayne State University.


    **Sally Preston** is president of Preston & Associates, which provides software
    consulting and training. She currently teaches computing in a variety of settings,
    which gives her ample opportunity to observe how people learn, what works best,
    and what challenges are present when learning a new software program. This diverse
    experience provides a complementary set of skills and knowledge that blends into
    her writing. Prior to writing for the *GO! Series*, Sally was a co-author on the
    *Learn* series since its inception and has authored books for the *Essentials*
    and *Microsoft Office User Specialist (MOUS) Essentials* series. Sally has a master’s
    in business administration from Eastern Michigan University. When away from her
    computer, she is often found planting flowers in her garden.'
  - '[PAGE 13]


    # Visual Walk-Through of the GO! System


    The GO! System is designed for ease of implementation on the instructor side and
    ease of understanding on the student. It has been completely developed based on
    professor and student feedback.


    The GO! System is divided into three categories that reflect how you might organize
    your course—Prepare, Teach, and Assess.


    # Prepare


    # Transition Guide


    New to GO!–We''ve made it quick and easy to plan the format and activities for
    your class.


    ![](img/9fe65c86ec4bc221ab72a7112a60115a_13_0.png)


    # Syllabus Template


    Includes course calendar planner for 8-,12-, and 16-week formats.


    ![](img/9fe65c86ec4bc221ab72a7112a60115a_13_1.png)'
  - '[PAGE 14]


    # Assignment Sheet


    One per chapter.

    Lists all possible assignments; add to and delete from this simple Word table
    according to your course plan.


    ![](img/9fe65c86ec4bc221ab72a7112a60115a_14_0.png)


    # File Guide to the GO! Supplements


    Tabular listing of all supplements and their file names.


    ![](img/9fe65c86ec4bc221ab72a7112a60115a_14_1.png)


    # NEW


    # Assignment Planning Guide


    Description of GO! assignments with recommendations based on class size, delivery
    mode, and student needs. Includes examples from fellow instructors.


    ![](img/9fe65c86ec4bc221ab72a7112a60115a_14_2.png)'
  - '[PAGE 15]


    # Student Data Files


    Music School Records discovers, launches, and develops the careers of young artists
    in classical, jazz, and contemporary music. Our philosophy is to not only shape,
    distribute, and sell a music product, but to help artists create a career that
    can last a lifetime. Too often in the music industry, artists are forced to fit
    their music to a trend that is short-lived. Music School Records doesn’t just
    follow trends, we take a long-term view of the music industry and help our artists
    develop a style and repertoire that is fluid and flexible and that will appeal
    to audiences for years and even decades.


    The music industry is constantly changing, but over the last decade the changes
    have been enormous. New forms of entertainment such as DVDs, video games, and
    the Internet mean there are more competition for the leisure dollar in the market.
    New technologies give consumers more options for buying and listening to music,
    and they are demanding high quality recordings. Young consumers are comfortable
    with technology and want the music they love when and where they want it, no matter
    where they are or what they are doing.


    Music School Records embraces new technologies and the sophisticated market of
    young music lovers. We believe that providing high quality recordings of truly
    talented artists make for more discerning listeners who will cherish the gift
    of music for the rest of their lives. The expertise of Music School Records includes:


    +   - Insight into our target market and the ability to reach the desired audience

    +   - The ability to access all current sources of music income

    +   - A management team with years of experience in music commerce

    +   - Innovative business strategies and artist development plans

    +   - Investment in technology infrastructure for high quality recordings and
    business services

    +   - Initiative and proactive management of artist careers


    ![](img/9fe65c86ec4bc221ab72a7112a60115a_15_0.png)


    # Online Study Guide for Students


    Interactive objective-style questions based on chapter content.


    ![](img/9fe65c86ec4bc221ab72a7112a60115a_15_1.png)


    # PowerPoint Slides


    ![](img/9fe65c86ec4bc221ab72a7112a60115a_15_2.png)'
  - '[PAGE 16]


    # Learning Objectives and Student Outcomes


    Objectives are clustered around projects that result in student outcomes. They
    help students learn how to solve problems, not just learn software features.


    # Project-Based Instruction


    Students do not practice features of the application; they create real projects
    that they will need in the real world. Projects are color coded for easy reference
    and are named to reflect skills the students will be practicing.


    # A and B Projects


    Each chapter contains two instructional projects—A and B.


    Each chapter opens with a story that sets the stage for the projects the student
    will create; the instruction does not force the student to pretend to be someone
    or make up a scenario.


    Each chapter has an introductory paragraph that briefs students on what is important.


    ![](img/9fe65c86ec4bc221ab72a7112a60115a_16_0.png)


    ![](img/9fe65c86ec4bc221ab72a7112a60115a_16_1.png)'
  - '[PAGE 17]


    **Visual Summary**

    Shows students upfront what their projects will look like when they are done.


    **Project Summary**

    Stated clearly and quickly in one paragraph.


    **File Guide**

    Clearly shows students which files are needed for the project and the names they
    will use to save their documents.


    **Objective**

    The skills the student will learn are clearly stated at the beginning of each
    project and color coded to match projects listed on the chapter opener page.


    **Teachable Moment**

    Expository text is woven into the steps— at the moment students need to know it—
    not chunked together in a block of text that will go unread.


    **Screen Shots**

    Larger screen shots.


