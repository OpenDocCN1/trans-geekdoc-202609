  - '[PAGE 91]


    **Paint** A Windows program in which graphics are created or edited.


    **Pointer** See mouse pointer.


    **Pointing** Positioning the tip of the pointer in the center of an icon or other
    screen object.


    **Quick Launch toolbar** An area to the right of the Start button that contains
    shortcut icons for commonly used programs.


    **Recycle Bin** A storage area for files that have been deleted; files can be
    recovered from the Recycle Bin or permanently removed.


    **Restore** Using the Restore Down button to return a window to the size it was
    before it was maximized.


    **Right-click** The action of clicking the right mouse button.


    **ScreenTip** A small box that displays useful information when you perform various
    mouse actions such as pointing to screen elements or dragging.


    **Scroll box** The box in the vertical and horizontal scroll bars that can be
    dragged to reposition the document on the screen.


    **Shortcut menu** A context-sensitive menu that displays commands and options
    relevant to the selected object.


    **Sizing handle** A small square or circle in the corners and the middle of the
    sides of a graphic that can be used to increase or decrease the size of the graphic.


    **Start button** The button on the left side of the taskbar that is used to start
    programs, change system settings, find Windows help, or shut down the computer.


    **Status area** Another name for the notification area on the right side of the
    taskbar.


    **Submenu** A second-level menu activated by selecting a menu option.


    **System tray** Another name for the notification area on the right side of the
    taskbar.


    **Task pane** A pane that opens on the side of a window that is used to display
    commonly used tools.


    **Taskbar** The area of the screen that displays the Start button and the name
    of any open documents. The taskbar may also display shortcut buttons for other
    programs.


    **Thumb drive** A small storage device that plugs into a computer USB port; also
    called a USB drive or a flash drive.


    **Thumbnail** A miniature representation of the contents of a picture file.


    **Title bar** Displays the program icon, the name of the document, and the name
    of the program. The Minimize, Maximize/Restore Down, and Close buttons are grouped
    on the right side of the title bar.


    **Toolbars** Rows of buttons, usually located under a menu bar, from which you
    can perform commands using a single click.


    **USB drive** A small storage device that plugs into a computer USB port; also
    called a thumb drive or a flash drive.


    **Vertical scroll bar** The bar at the right side of a window that enables you
    to move up and down to view information that extends beyond the top and bottom
    of the screen.


    **Wildcard** A character, such as an asterisk, that can be used to match any number
    of characters in a file search.


    **Window** A box or screen that displays information or a program. Windows usually
    consist of title bars, toolbars, menu bars, and status bars. A window will always
    have a Minimize button and a Close button.


    **Windows** When spelled with a capital W, refers to the operating system that
    runs your computer.


    **Wordpad** A simple word processing program that comes with Windows XP.'
