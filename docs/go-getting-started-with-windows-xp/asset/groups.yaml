    # Objective 2


    # Resize, Move, and Scroll Windows


    When a window opens on your screen, it generally opens in the same size and shape
    as it was when last used. If you are using more than one window at a time, you
    can increase or decrease the size of a window, or move a window so that you can
    see the information you need.


    As you work within a program, the information you create will often grow larger
    than the screen can display. When the information in a window extends beyond the
    lower or right edges of the window, scroll bars display at the lower and right
    side of the window. Using the horizontal scroll bar, you can move left and right
    to view information that extends beyond the left or right edge of the screen.
    Using the vertical scroll bar, you can move up and down to view information that
    extends beyond the top or bottom of the screen.


    # Activity 1.2 Resizing, Moving, and Scrolling Windows


    In Activity 1.2, you will open, resize, and move the My Computer window. You will
    also use the scroll bars in the My Computer window to view information that does
    not fit on the screen.


    +   1. On the Windows desktop, double-click the My Computer icon to open the My
    Computer window. Alternatively, right-click the icon and click Open.

    +   2. Check to see if the My Computer window opened as shown in 1.12, or if it
    opened and fills the entire screen. If the My Computer window fills the entire
    screen, on the right side of the title bar, click the Restore Down button.

    +   3. Move the pointer to the lower right corner of the window to display the
    diagonal resize pointer, and then compare your screen with Figure 1.12.


    When the mouse pointer is in this shape, you can use it to change the size and
    shape of a window.'
