  mdcn: "\n\n## GO！\n与\n## Windows® XP 一起\n入门指南\n附赠 CD\n![](img/9fe65c86ec4bc221ab72a7112a60115a_0_0.png)\n\
    PEARSON\nPrentice Hall\nGaskin • Ferrett • Preston • Preston\n\n## 学生\n### 如何查找学生数据文件\n\
    以完成本书中的项目\n\n本书中的项目要么从新建的空白文件开始，要么从已为你启动的学生数据文件开始。\n\n学生数据文件可以从随书附带的 CD-ROM 或\
    \ *GO!* 网站上获取。\n\n![](img/9fe65c86ec4bc221ab72a7112a60115a_1_0.png)\n\n### 来自\
    \ CD-ROM 的文件\n\n按照每个项目中的具体指示，导航到 CD-ROM，然后根据项目中的说明保存并重命名文件。\n\n![](img/9fe65c86ec4bc221ab72a7112a60115a_1_1.png)\n\
    \n### 来自 www.prenhall.com/go 的文件\n\n- 1. 决定要将学生数据文件存储在哪里。\n  - 如果要存储在计算机的硬盘或网络驱动器上，建议在该驱动器上创建一个名称合适的文件夹。\n\
    \  - 如果要存储在可移动存储设备（如 U 盘、Zip 磁盘或软盘）上，请立即插入该设备。\n- 2. 在 Web 浏览器中，转到 **www.prenhall.com/go**。\n\
