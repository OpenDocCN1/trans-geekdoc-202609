    **另一种方法**


    **重命名文件夹**


    如果您在有机会命名文件夹之前不小心按了 Enter，仍可以重命名它。右键单击文件夹，从快捷菜单中单击“重命名”，输入新名称，然后按 Enter。或者，您可以单击文件夹一次，暂停，然后再次单击文件夹。


