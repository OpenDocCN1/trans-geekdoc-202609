    # More Knowledge


    # Recovering Deleted Files


    If you accidentally delete a file from the hard disk drive that you want to keep,
    there is a good chance you can recover it. Windows temporarily stores files deleted
    from your hard drive in a Recycle Bin, which you can find on the desktop or in
    the My Computer Folders pane. You can open the Recycle Bin in the same way you
    open a file folder. If the discarded files have not been permanently removed,
    right-click the file name in the Contents pane, and then click Restore in the
    shortcut menu.


    # Activity 1.7 Capturing an Image of a Screen


    Windows includes a screen capture utility that enables you to capture an image
    of your screen and then print it or save it as a file.


    1 On your keyboard, locate and press PrtScr.


    The Print Screen key on your keyboard is commonly located near the right side
    of the top row of keys. This key captures an image of the entire screen and places
    it in a temporary storage area called the Clipboard. Items in the Clipboard can
    be placed in a document using the Paste command.


    2 Click the **Start** button , point to **All Programs**, point to **Accessories**,
    and then click **WordPad**. If necessary, maximize the WordPad window.


    **WordPad** is a simple word-processing program that comes with Windows XP.


    3 In the WordPad window, type **Firstname Lastname** using your own name. Press
    Enter two times.'
