  md: "\n**Paint** A Windows program in which graphics are created or edited.\n\n\
    **Pointer** See mouse pointer.\n\n**Pointing** Positioning the tip of the pointer\
    \ in the center of an icon or other screen object.\n\n**Quick Launch toolbar**\
    \ An area to the right of the Start button that contains shortcut icons for commonly\
    \ used programs.\n\n**Recycle Bin** A storage area for files that have been deleted;\
    \ files can be recovered from the Recycle Bin or permanently removed.\n\n**Restore**\
    \ Using the Restore Down button to return a window to the size it was before it\
    \ was maximized.\n\n**Right-click** The action of clicking the right mouse button.\n\
    \n**ScreenTip** A small box that displays useful information when you perform\
    \ various mouse actions such as pointing to screen elements or dragging.\n\n**Scroll\
    \ box** The box in the vertical and horizontal scroll bars that can be dragged\
    \ to reposition the document on the screen.\n\n**Shortcut menu** A context-sensitive\
    \ menu that displays commands and options relevant to the selected object.\n\n\
    **Sizing handle** A small square or circle in the corners and the middle of the\
    \ sides of a graphic that can be used to increase or decrease the size of the\
    \ graphic.\n\n**Start button** The button on the left side of the taskbar that\
    \ is used to start programs, change system settings, find Windows help, or shut\
    \ down the computer.\n\n**Status area** Another name for the notification area\
    \ on the right side of the taskbar.\n\n**Submenu** A second-level menu activated\
    \ by selecting a menu option.\n\n**System tray** Another name for the notification\
    \ area on the right side of the taskbar.\n\n**Task pane** A pane that opens on\
    \ the side of a window that is used to display commonly used tools.\n\n**Taskbar**\
    \ The area of the screen that displays the Start button and the name of any open\
    \ documents. The taskbar may also display shortcut buttons for other programs.\n\
    \n**Thumb drive** A small storage device that plugs into a computer USB port;\
    \ also called a USB drive or a flash drive.\n\n**Thumbnail** A miniature representation\
    \ of the contents of a picture file.\n\n**Title bar** Displays the program icon,\
    \ the name of the document, and the name of the program. The Minimize, Maximize/Restore\
    \ Down, and Close buttons are grouped on the right side of the title bar.\n\n\
    **Toolbars** Rows of buttons, usually located under a menu bar, from which you\
    \ can perform commands using a single click.\n\n**USB drive** A small storage\
    \ device that plugs into a computer USB port; also called a thumb drive or a flash\
    \ drive.\n\n**Vertical scroll bar** The bar at the right side of a window that\
    \ enables you to move up and down to view information that extends beyond the\
    \ top and bottom of the screen.\n\n**Wildcard** A character, such as an asterisk,\
    \ that can be used to match any number of characters in a file search.\n\n**Window**\
