    # # Objective 5

    ## Copy, Move, Rename, and Delete Files


    Recall that Windows manages your data files because your files are stored on the
    drives attached to your computer. Copying files from one folder to another is
    a frequent data management task. For example, you may want to make a backup copy
    of important information, copy a file from a CD to a local disk, or copy information
    from your local disk drive to a removable drive. Copying files and folders works
    the same regardless of the type of drive—removable drive, local disk drive, or
    shared network drive.


    Performing other operations on files, such as deleting them or moving them, also
    works the same regardless of the type of drive. As you accumulate files, you will
    likely need to delete some to reduce clutter on your hard drive. You may also
    want to move documents into other folders on another drive to **archive** them—place
    them somewhere for long-term storage. Finally, you may want to change the names
    of files or folders to make the names more descriptive. All of these tasks are
    functions of your Windows operating system.


    # ### Activity 1.5  Copying Files and Folders


    In Activity 1.5, you will copy files onto your removable drive and into the folders
    you created in Activity 1.4.


    +   1. Be sure the **My Computer** window is displayed, and that the **Folders**
    button on the toolbar is selected and the **Folders** task pane is displayed on
    the left. Place the student CD that came with this book in the CD drive. In the
    **Folders** task pane, click the **expand button (+)** to the left of the **CD
    drive** to display the contents of the drive. If a go2007_introle dialog box opens,
    click Cancel.


    The folders and files in the CD drive display, and the expand button changes to
    a **collapse button (-)**. Expanded items are in view and collapsed items are
    hidden from view. The **expand button** indicates that additional items are available
    but hidden from view.


    > > **Note — If Your Student Files Are in a Different Location**

    > >

    > > Some instructors will place the student files in a folder on a shared network
    drive, or in a file-sharing folder in a course Web site. If you are instructed
    to use files from another source, follow the instructions below, substituting
    your file location for the CD drive.'
