    ## Windows XP 第一章


    ### 匹配

    将第二列的每个术语与其在第一列的正确定义匹配。在正确定义前面的空白行上写下该术语的字母。


    - 1. 包含“开始”按钮、代表打开程序的按钮以及会激活程序的其他按钮的栏。

    - 2. 当你移动鼠标或其他指向设备时移动的箭头、I 形光标或其他符号，用以指示屏幕上的位置或位置。

    - 3. 显示信息的框，通常由标题栏、菜单栏、状态栏和工具栏组成，并且始终具有最小化按钮。

    - 4. 窗口顶部的区域，显示文件名，同时包含最小化、最大化/还原和关闭按钮。

    - 5. 上下文相关命令的列表——在处理所选对象时常用的命令——通常通过右键单击屏幕项目激活。

    - 6. 开始按钮右侧的区域，包含常用程序的快捷方式图标。

    - 7. 任务栏右侧的区域，显示时钟和系统通知，并在其中显示通知以告知您正在后台发生的进程，例如防病毒软件检查、网络连接和其他实用程序。

    - 8. 文档窗口底部的水平栏，提供有关窗口中当前查看内容的当前状态的信息，例如文档的页码。

    - 9. Windows 的功能，使您能够查看超出屏幕边缘的文本。

    - 10. 用于将相关文件保存在一个位置的 Windows 对象。

    - 11. 可反复用于读取和保存文件的光盘。

    - 12. 文件的三个或四个字母的结尾——可能显示也可能不显示——用于标识文件类型。

    - 13. 用于在文件搜索中代替多个字符的星号 (*) 或其他字符所给出的术语。

    - 14. 图片文件内容的微型表示，用于“我的电脑”中的一种文件视图。

    - 15. 减小文件的大小。


    - A CD-RW

    - B Compress

    - C File extension

    - D Folder

    - E Mouse pointer

    - F Notification area

    - G Quick Launch toolbar

    - H Scroll bar

    - I Shortcut menu

    - J Status bar

    - K Taskbar

    - L Thumbnail

    - M Title bar

    - N Wildcard

    - O Window


    ### 填空

    在提供的空格中写出正确的单词。


    - 1. A(n) **图标** 是图形表示，可让你运行程序或使用程序功能。

    - 2. Windows XP 是 **操作系统** 的一个例子，它协调计算机的活动。

    - 3. 任务栏左端的 **开始** 按钮用于运行程序、更改系统设置或查找帮助。

    - 4. 当同时打开多个文档或程序时，你可以通过单击 **任务栏** 中的相应按钮在它们之间切换。

    - 5. A(n) **子菜单** 是使用菜单命令访问的二级菜单。

    - 6. 当你删除文件时，它会被存储在名为 **回收站** 的临时区域中，从中通常可以恢复。

    - 7. 一个要求你对单个对象或主题做出决定的框称为 a(n) **对话框**。

    - 8. 显示鼠标在屏幕上的位置或位置的箭头、I 形光标或其他符号称为鼠标 **指针**。

    - 9. 当你右键单击对象时，会显示 a(n) **快捷** 菜单。

    - 10. 通常显示在菜单栏下方并使用按钮激活命令的栏称为 a(n) **工具栏**。

    - 11. 要使窗口填满屏幕，请使用标题栏中的 **最大化** 按钮。

    - 12. 你可以通过单击 **最小化** 按钮在不关闭的情况下隐藏程序或文档。

    - 13. 在“我的电脑”中，你可以通过单击 **查看** 列标题按字母顺序对文件名进行排序。

    - 14. 你计算机上的主要存储设备是 ______ 磁盘驱动器。

    - 15. 文件扩展名由文件名的最后三个或四个字符组成，表示用于创建该文件的程序。


    ## 词汇表

    **活动窗口** 当两个或多个窗口打开时，鼠标指针移动、命令或文本输入发生的窗口。


    **地址栏** 显示当前文件或文件夹的路径；在 Internet Explorer 中，还显示活动网页的地址。


    **归档** 将文件备份并存储在主硬盘以外的其他位置。


    **CD-R** CD-ROM 光盘的另一种名称。


    **CD-ROM** 紧凑型光盘只读存储器的缩写；一种用于永久存储数据且可从中读取和打开文件的光学存储设备。


    **CD-RW** 可重复使用的光盘，可用于读取和保存文件。


    **单击** 一次按下鼠标左键（或主键）。


    **剪贴板** Windows 中的临时存储区域，存储最近复制的项目。


    **关闭按钮** 标题栏中关闭窗口或程序的按钮。


    **折叠按钮** 文件夹左侧的小减号 (–) 按钮，单击可隐藏该文件夹中的项目。


    **压缩** 减小文件大小的过程。


    **上下文相关命令** 与您正在进行的活动相关的命令；通常通过右键单击屏幕项目激活。


    **桌面** 运行 Windows 和程序的基本屏幕，由程序图标、任务栏、开始按钮和鼠标指针组成。


    **对话框** 要求您对单个对象或主题做出决定的框。对话框没有最小化按钮。


    **双击** 在保持鼠标静止的同时快速连续两次单击鼠标左键的动作。


    **拖动** 将某物从屏幕上的一个位置移动到另一个位置的动作；拖动操作包括在所需时间或位置释放鼠标按钮。


    **驱动器** 使用 Windows 文件系统格式化的存储区域，具有 C 等驱动器号。


    **编辑模式** Windows 模式，可让你更改文件或文件夹的名称，并在所有 Windows 程序中以相同方式工作。


    **展开按钮** 文件夹左侧的小加号 (+) 按钮，单击可显示该文件夹中的项目。


    **文件** 您保存并存储在驱动器上的数据，例如 Word 文档或 PowerPoint 演示文稿。


    **文件扩展名** 文件名中句点右侧的字符，告诉计算机使用哪个程序打开文件；扩展名可以显示或隐藏。


    **闪存驱动器** 一种小型便携式数字存储设备，连接到计算机的 USB 端口；也称为拇指驱动器、跳跃驱动器或 USB 驱动器。


    **软盘驱动器（或软盘驱动器）** 微型计算机的原始存储设备，可在软盘上实现便携式永久存储。


    **文件夹** 存储区域，在屏幕上由纸质文件文件夹的图片表示，用于存储文件或其他文件夹。


    **图形用户界面（GUI）** 一种计算机界面，您通过使用图形和点按技术与计算机交互；GUI 将文档显示为最终形式的外观。


    **硬盘驱动器** 计算机内部的大型磁盘驱动器，也称为本地磁盘。


    **水平滚动条** 窗口底部的栏，可让您左右移动以查看超出屏幕左右边缘的信息。


    **图标** 您可单击以打开该对象的对象的图形表示。


    **左侧窗格** 在“我的电脑”窗口中，左侧显示信息和常用工具的窗格。


    **本地磁盘** 计算机内部的大型磁盘驱动器，也称为硬盘。


    **最大化** 将窗口大小增加到填满屏幕。


    **菜单** 类别内的命令列表。


    **菜单栏** 标题栏下方列出菜单类别名称的栏。


    **最小化** 在不关闭的情况下将窗口从屏幕上移除；最小化的窗口可以通过单击任务栏中的相关按钮重新打开。


    **鼠标指针** 显示鼠标在屏幕上的位置或位置的箭头、I 形光标或其他符号；也称为指针。


    **我的电脑** 一个窗口，可让你访问计算机上的文件和文件夹。


    **通知区域** 任务栏右侧的区域，可让您了解正在后台发生的进程，例如防病毒软件、网络连接和其他实用程序；还显示时间。


    **操作系统** 协调计算机活动的指令集；Microsoft Windows XP 是一个操作系统。

