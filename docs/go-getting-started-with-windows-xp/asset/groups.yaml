    - 6. 在任务栏上，单击**开始**按钮，指向**所有程序**，指向**附件**，然后单击**计算器**。指向**计算器**窗口标题栏，然后将计算器窗口拖到屏幕左侧附近。注意，两个打开的程序都会显示在任务栏上。


    “我的电脑”是一个程序，可帮助你管理和组织连接到计算机的驱动器空间。计算器是一个执行基本运算的程序。两个程序各自占据一个窗口，计算器程序位于“我的电脑”窗口前面。计算器成为**活动窗口**。当打开两个或更多窗口时，活动窗口就是插入点移动、命令或文本输入所发生的窗口。


    - 7. 单击**我的电脑**窗口的任意位置，注意**我的电脑**窗口移到前面，如图 1.20 所示。


    ## 图 1.21


    任务栏中的“画图”按钮


    任务栏中的“计算器”按钮


    任务栏中的“我的电脑”按钮


    ![](img/9fe65c86ec4bc221ab72a7112a60115a_55_0.png)


    在**画图**标题栏上，单击**关闭**按钮 [X]。在**计算器**标题栏上，单击**关闭**按钮 [X]。在**我的电脑**窗口标题栏上，单击**关闭**按钮
    [X]。


    ## 更多知识

    ## 同时打开多个程序窗口


    随着你对 Microsoft Office 越来越熟悉，同时打开多个窗口的能力会变得更加有用。例如，如果你希望从两个文字处理文档中获取信息来创建第三个文档，可以打开全部三个文档，并使用任务栏在它们之间切换，将文本从一份文档复制并粘贴到另一份文档。或者，你可以从
    Excel 中复制图表并粘贴到 Word 中，也可以将一个数据表粘贴到 PowerPoint 中。你甚至可以在两个窗口中同时打开同一个文档。


    ## 目标 4

    创建新文件夹


    你在计算机程序中创建的信息存储在计算机内存中，内存是一种临时存储位置。如果关闭计算机，这些数据将会丢失。若要保留你创建的信息，必须将其保存为文件，存放在你可用的某个驱动器上。例如，你在
    Microsoft Word 等文字处理程序中创建的 5 页学期论文，保存后就是一个*文件*。文件可以直接存储在驱动器上，但更常见的是存储在驱动器上的文件夹中。*文件夹*是程序和文件的容器，在屏幕上显示为一个普通纸质文件夹的图片。


    使用文件夹来组织你的程序和文件的位置，以便日后轻松找到它们。文件夹和文件必须在你计算机所连接的某个驱动器上创建和存储。你可用的驱动器分为三类：1) 计算机内部不可移动的硬盘驱动器，也称为本地磁盘；2)
    插入计算机的可移动驱动器，如 3.5 英寸软盘、Zip 磁盘、U 盘或可写光盘；或 3) 通过网络连接到计算机的共享网络驱动器，例如你所在学校的网络。


    ## 活动 1.4 创建新文件夹


    在活动 1.4 中，你将在你可用三类驱动器之一上创建一个文件夹：本地磁盘（硬盘驱动器）、可移动驱动器（U 盘、Zip 磁盘、3.5 英寸软盘或其他类型的可移动驱动器）或网络驱动器。如果你使用的是学校机房中的计算机，你可能会在共享网络驱动器上有分配给自己的空间。你可以在任何可用的驱动器上创建这些文件夹。以下活动假定你将文件保存到
    U 盘。


    - 1. 插入你的 U 盘或其他可移动驱动器。如果显示一个操作对话框，询问你希望 Windows 做什么，请单击**取消**。在任务栏上，单击**开始**按钮，然后单击**我的电脑**以打开**我的电脑**窗口。在**我的电脑**标题栏上，如果窗口尚未最大化，请单击**最大化**按钮。


    *对话框*是一个显示的窗口，要求你对某个对象或主题做出决定。


