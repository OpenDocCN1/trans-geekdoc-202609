  mdcn: "\n**画图** 用于创建或编辑图形的 Windows 程序。\n\n**指针** 请参阅鼠标指针。\n\n**指向** 将指针尖端定位在图标或其他屏幕对象的中心。\n\
    \n**快速启动工具栏** 开始按钮右侧的区域，包含常用程序的快捷图标。\n\n**回收站** 已删除文件的存储区域；文件可以从回收站恢复或永久删除。\n\n\
    **还原** 使用还原最小化按钮将窗口返回到最大化之前的大小。\n\n**右键单击** 单击鼠标右键的操作。\n\n**屏幕提示** 在执行各种鼠标操作（如指向屏幕元素或拖动）时显示有用信息的小框。\n\
    \n**滚动框** 垂直和水平滚动条中的框，可拖动以重新定位屏幕上的文档。\n\n**快捷菜单** 上下文相关菜单，显示与所选对象相关的命令和选项。\n\n\
    **尺寸柄** 图形角落和边中部的小正方形或圆圈，可用于增大或减小图形大小。\n\n**开始按钮** 任务栏左侧的按钮，用于启动程序、更改系统设置、查找 Windows\
    \ 帮助或关闭计算机。\n\n**状态区域** 任务栏右侧通知区域的另一个名称。\n\n**子菜单** 通过选择菜单选项激活的二级菜单。\n\n**系统托盘**\
    \ 任务栏右侧通知区域的另一个名称。\n\n**任务窗格** 在窗口侧面打开的窗格，用于显示常用工具。\n\n**任务栏** 显示开始按钮和任何打开文档名称的屏幕区域。任务栏还可能显示其他程序的快捷按钮。\n\
    \n**拇指驱动器** 插入计算机 USB 端口的小型存储设备；也称为 USB 驱动器或闪存驱动器。\n\n**缩略图** 图片文件内容的微型表示。\n\n\
    **标题栏** 显示程序图标、文档名称和程序名称。最小化、最大化/还原和关闭按钮组合在标题栏右侧。\n\n**工具栏** 通常位于菜单栏下方的按钮行，可通过单击执行命令。\n\
