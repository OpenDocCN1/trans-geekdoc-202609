    # Glossary


    **Active window** The window in which the mouse pointer movements, commands, or
    text entry occur when two or more windows are open.


    **Address bar** Displays the path of the current file or folder; also, in Internet
    Explorer, displays the address of the active Web page.


    **Archive** To back up files and store them somewhere other than the main hard
    drive.


    **CD-R** Another name for a CD-ROM disc.


    **CD-ROM** The acronym for Compact Disc-Read Only Memory; an optical storage device
    used to permanently store data and from which you can read and open files.


    **CD-RW** A compact disc that can be reused to read and save files.


    **Click** To press the left (or primary) mouse button once.


    **Clipboard** A temporary storage area in Windows that stores the most recently
    copied item.


    **Close button** The button in a title bar that closes a window or a program.


    **Collapse button** A small minus (–) button to the left of a folder that you
    click to hide the items in that folder.


    **Compress** A process to reduce the size of a file.


    **Context-sensitive command** A command associated with activities in which you
    are engaged; often activated by right-clicking a screen item.


    **Desktop** The basic screen from which Windows and programs are run, and which
    consists of program icons, a taskbar, a Start button, and a mouse pointer.


    **Dialog box** A box that asks you to make a decision about an individual object
    or topic. Dialog boxes do not have Minimize buttons.


    **Double-click** The action of clicking the left mouse button twice in rapid succession
    while keeping the mouse still.


    **Drag** The action of moving something from one location on the screen to another;
    the action of dragging includes releasing the mouse button at the desired time
    or location.


    **Drive** An area of storage that is formatted with the Windows file system and
    that has a drive letter such as C.


    **Edit mode** A Windows mode that enables you to change the name of a file or
    folder, and works the same in all Windows programs.


    **Expand button** A small plus (+) button to the left of a folder that you click
    to display the items in that folder.


    **File** Data that you save and store on a drive, such as a Word document or a
    PowerPoint presentation.


    **File extension** The characters to the right of the period in a file name, and
    that tell the computer the program to use to open the file; extensions can be
    displayed or hidden.


    **Flash drive** A small, portable, digital storage device that connects to a computer''s
    USB port; also called a thumb drive, jump drive, or USB drive.


    **Floppy disk drive (or floppy drive)** The original storage device for a microcomputer,
    which enables portable, permanent storage on floppy disks.


    **Folder** A storage area, represented on the screen by a picture of a paper file
    folder, used to store files or other folders.


    **Graphical user interface (GUI)** A computer interface with which you interact
    with the computer through the use of graphics and point-and-click technology;
    GUIs show documents as they will look in their final form.


    **Hard drive** A large disk drive inside your computer, also referred to as a
    Local Disk.


    **Horizontal scroll bar** The bar at the bottom of a window that enables you to
    move left and right to view information that extends beyond the left and right
    edges of the screen.


    **Icon** A graphic representation of an object that you can click to open that
    object.


    **Left pane** In the My Computer window, a pane at the left that displays information
    and commonly used tools.


    **Local Disk** A large disk drive inside your computer, also referred to as a
    hard disk.


    **Maximize** To increase the size of a window to fill the screen.


    **Menu** A list of commands within a category.


    **Menu bar** The bar beneath the title bar that lists the names of menu categories.


    **Minimize** Removing the window from the screen without closing it; minimized
    windows can be reopened by clicking the associated button in the taskbar.


    **Mouse pointer** The arrow, I-beam, or other symbol that shows the location or
    position of the mouse on your screen; also called the pointer.


    **My Computer** A window that gives you access to the files and folders on your
    computer.


    **Notification area** The area on the right side of the taskbar that keeps you
    informed about processes that are occurring in the background, such as antivirus
    software, network connections, and other utility programs; also displays the time.


    **Operating system** A set of instructions that coordinates the activities of
    your computer; Microsoft Windows XP is an operating system.'
