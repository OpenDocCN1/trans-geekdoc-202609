    ## 更多知识

    ### 文件关联和压缩程序


    当你单击“压缩(zipped)文件夹”命令时，可能会看到一个对话框。因为每种文件类型都需要与一个程序关联，你的计算机可能已经将 .zip 扩展名的文件与 WinZip
