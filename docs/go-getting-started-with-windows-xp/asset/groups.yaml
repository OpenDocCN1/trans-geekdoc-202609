    列宽被调整大小。您可以使用调整大小指针调整右侧窗格中的所有列大小。


    **更多知识**


    **计算机存储设备**


    硬盘（本地磁盘）通常在您的计算机上以 C:\（有时还有 D:\、E:\ 等用于其他驱动器）的表示法标识。*软盘驱动器* 在软盘上提供存储，通常在您的计算机上以
    3½ Floppy (A:) 的表示法标识。软盘驱动器已过时——许多计算机不再配备软盘驱动器。Zip 驱动器也使用可移动磁盘，其存储的信息比软盘多。*闪存驱动器*——也称为
    *USB 驱动器* 或 *拇指驱动器*——是小型存储设备，可插入计算机的通用串行总线（USB）端口，该端口是计算机与打印机、鼠标、键盘或 USB 驱动器等外围设备之间的连接。


    您可能还可以通过另一种类型的存储设备访问文件，即 *CD-ROM 光盘*。CD-ROM 代表 Compact Disc-Read Only Memory（只读存储器光盘）。如果您使用存储在
    CD-ROM 上的文件，则需要从光盘打开文件，然后将其保存到可写驱动器，或将文件从 CD-ROM 光盘复制到另一张磁盘然后打开它。CD 驱动器可以在两种类型的
    CD 之一上存储信息——一种可写入但不可擦除的 CD——*CD-R*——或一种可多次写入和擦除的 CD——*CD-RW*。


    ## 目标 5


    ### 复制、移动、重命名和删除文件


    请记住，Windows 管理您的数据文件，因为您的文件存储在连接到计算机的驱动器上。从一个文件夹复制文件到另一个文件夹是频繁的数据管理任务。例如，您可能想要制作重要信息的备份副本，将文件从
    CD 复制到本地磁盘，或将信息从本地磁盘驱动器复制到可移动驱动器。复制文件和文件夹的方式与驱动器类型无关——可移动驱动器、本地磁盘驱动器或共享网络驱动器。


    对文件执行其他操作，例如删除它们或移动它们，也与驱动器类型无关。随着文件积累，您可能需要删除一些以减少硬盘上的杂乱。您可能还想将文档移动到另一个驱动器上的其他文件夹中以
    **归档** 它们——将它们放在某个地方进行长期存储。最后，您可能想要更改文件或文件夹的名称，使名称更具描述性。所有这些任务都是 Windows 操作系统的功能。


    #### 活动 1.5 复制文件和文件夹


    在活动 1.5 中，您将复制文件到您的可移动驱动器并复制到您在活动 1.4 中创建的文件夹中。


    - 1. 确保显示 **我的电脑** 窗口，并且工具栏上的 **文件夹** 按钮已选中，并且左侧显示 **文件夹** 任务窗格。将随书附带的学员 CD 放入
    CD 驱动器中。在 **文件夹** 任务窗格中，单击 **CD 驱动器** 左侧的 **展开按钮 (+)** 以显示驱动器的内容。如果出现 Go! 2007
    Intro 对话框，请单击“取消”。


    CD 驱动器中的文件夹和文件显示出来，展开按钮更改为 **折叠按钮 (-)**。展开的项目可见，折叠的项目隐藏在视图之外。**展开按钮** 表示有其他项目可用但隐藏在视图之外。


    > **注意 — 如果您的学员文件位于不同位置**

    >

    > 一些讲师会将学员文件放在共享网络驱动器上的文件夹中，或放在课程网站的文件共享文件夹中。如果您被指示使用来自其他来源的文件，请按照以下说明进行操作，将文件位置替换为
    CD 驱动器。

