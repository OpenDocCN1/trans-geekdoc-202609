    If you do not change the file location, the file will be extracted to the folder
    that contains the zipped file.


    13 In the **Extraction Wizard** dialog box, click the **Next** button to accept
    the default location.


    14 In the **Extraction Wizard** dialog box, clear the **Show extracted files**
    check box, and then click **Finish**. Close the Lightning.zip window.


    The Show extracted files option is useful when you are sending files to a different
    location and want to move to that location when the Extraction Wizard closes.


    The file is extracted and placed in a folder along with the compressed file, as
    shown in Figure 1.51.


    Figure 1.51


    ![](img/9fe65c86ec4bc221ab72a7112a60115a_84_0.png)


    Original compressed folder


    New folder


    15 On the menu bar, click **Tools**, and then from the displayed menu, click **Folder
    Options**. Near the top of the **Folder Options** dialog box, click the **View**
    tab. Under **Advanced settings**, locate the **Hide extensions for known file
    types** check box. Click to select the check box. Click **OK** to turn off the
    file extensions.


    16 Close the **Removable Media** window.


    ## More Knowledge

    ### File Associations and Compression Programs


    You may see a dialog box when you click the Compressed (zipped) Folder command.
    Because every file type needs to be associated with a program, your computer may
    already associate files that have the .zip extension with a third-party program
    such as WinZip. The dialog box will ask whether you want to designate Compressed
    (zipped) Folders as the program for handling ZIP files (compressed files that
    have a .zip extension). If you are working in a lab, ask the lab manager how to
    answer this question. If you are working at home, click Yes, unless you want to
    use another program to compress your files.


    ## Windows XP

    ### Chapter one


    ## Summary


    You will find that a working knowledge of Windows functions is useful as you create
    files in various programs like those in Microsoft Office. In this chapter, you
    practiced setting up, organizing, and navigating the Windows desktop. You adjusted
    window size and moved windows. You created folders to store your documents and
    then copied, moved, renamed, and deleted files. Finally, you compressed files
    to save space.


