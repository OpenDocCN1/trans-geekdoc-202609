    \n## 编辑来信\n\n尊敬的教师和学生：\nGO! 系列的主要目标有两方面。第一个目标是帮助教师在更短的时间内教授他们想要的课程。第二个目标是让学生掌握使用计算机作为工具来解决商务问题的技能，既为了他们自己，也为了他们可能受雇的组织。\n\
    \nGO! 系列最初由系列编辑 Shelley Gaskin 创建，并随 Microsoft Office 2003 的发布而出版。她的想法源于多年使用那些无法满足当今多元化课堂需求的教科书，这些教科书对学生来说过于混乱。Shelley\
    \ 通过确保我们坚持开发优质教学和实用课堂工具的愿景，继续提升该系列。\n\n但我们也需要你的意见和想法。\n\n随着时间的推移，GO! 系列根据使用该系列的教师和学生的直接反馈而发展。我们是倾听的出版商。为了出版一本适合你的教科书，我们必须继续倾听这些反馈。与你交流并听取你使用\
    \ GO! 的故事对我来说很重要。你的声音可以带来改变。\n\n我希望这封信能激励你给我写一封电子邮件，分享你对使用 GO! 系列的看法。\n\nStephanie\
