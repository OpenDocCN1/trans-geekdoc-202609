- pgno: 99
  md: '# GO!


    # Teach the Course You Want in Less Time!


    # THE GO! STORY...


    As a professor for over 15 years, GO! Series author Shelley Gaskin used many different
    Microsoft® Office texts only to find that none of them addressed all of the challenges
    of today''s classroom and diverse student body—that''s why she created the GO!
    System.


    # EASE of IMPLEMENTATION...


    The GO! System was developed with everyday classroom realities in mind. The primary
    goal of the System, aside from the obvious one of teaching Microsoft® Office 2007
    skills and concepts, is ease of implementation using any delivery method, including
    traditional lecture, self-paced, or online.


    # STUDENT SUCCESS...


    The GO! System teaching approach is focused on student success. Students work
    through engaging real-life projects that are clearly written and logically arranged.
    The GO! System ensures that students learn computer skills and concepts without
    getting lost or confused by misleading instruction.


    # NEW for Office 2007!


    +   - myitlab–assessment and training software specific to the GO! Series

    +   - Audio-Visual EDDs–electronic versions of the EDDs with full animation and
    audio

    +   - End of Chapter–new types of assignments, including group running cases,
    and more mastering and problem-solving projects

    +   - Workshops–mini projects that reinforce key concepts, such as formulas in
    Excel and design skills in PowerPoint®

    +   - “There’s More You Can Do!”–additional exercises that students can use to
    learn about and practice all of the new features of Microsoft® Office 2007


    ![](img/9fe65c86ec4bc221ab72a7112a60115a_99_0.png)


    # Student CD Inside!


    The enclosed Student CD contains all of the project files needed to complete the
    projects in this book.


    ![](img/9fe65c86ec4bc221ab72a7112a60115a_99_1.png)


    # Companion Web site!


    www.prenhall.com/go


    This interactive Web site is designed to reinforce and help students test their
    understanding of the concepts found in this GO! textbook.


    ![](img/9fe65c86ec4bc221ab72a7112a60115a_99_2.png)'
