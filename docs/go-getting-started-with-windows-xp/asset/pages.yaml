    # Windows Screen Elements


    | Element | Description |

    |---|---|

    | Desktop | The working area of the Windows XP screen consisting of program icons,
    a taskbar, and a Start button. |

    | Icon | A graphic representation of an object that you can select and open, such
    as a drive, a disk, a folder, a document, or a program. |

    | Mouse pointer | The arrow, I-beam, or other symbol that moves when you move
    the mouse or other pointing device, and that indicates a location or position
    on your screen—also called the pointer. |

    | My Computer icon | An icon that represents the computer on which you are working,
    and that provides access to the drives, folders, and files on your computer. |

    | Quick Launch toolbar | An area to the right of the Start button that contains
    shortcut icons for commonly used programs. |


    (Continued)'
