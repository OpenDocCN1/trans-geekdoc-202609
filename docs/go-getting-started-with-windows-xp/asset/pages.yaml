- pgno: 35
  md: "# Objective 1\nGet Started with Windows XP\n\nWindows XP is an *operating system*—software\
    \ that controls the hardware attached to your computer including its memory, disk\
    \ drive space, attached devices such as printers and scanners, and the central\
    \ processing unit. Windows XP and earlier versions of Windows are similar; they\
    \ use a *graphical user interface (GUI)*. A GUI uses graphics or pictures to represent\
    \ commands and actions and lets you see document formatting on the screen as it\
    \ will look when printed on paper. **Windows**, when spelled with a capital W,\
    \ refers to the operating system that runs your computer.\n\nStarting Windows\
    \ is an automatic procedure; you turn on your computer, and after a few moments\
    \ the version of Windows installed on your computer displays. Some versions require\
    \ that you log in, and some do not. If you are using a different version of Windows,\
    \ some procedures used in this chapter may work differently. Windows XP is available\
    \ in two versions: a Professional Edition and a Home Edition. For basic tasks,\
    \ the two versions work the same. The Professional version includes security and\
    \ other features necessary in large organizations.\n\n**Alert!**\n\n**Does your\
    \ screen differ?**\nThis chapter uses Windows XP Home Edition. When you see the\
    \ word Windows, it will often be accompanied by the version, such as Windows 98,\
    \ Windows NT, Windows 2000, or Windows XP, which is the version introduced in\
    \ this chapter. These operating systems are similar and use graphics or pictures\
    \ to represent commands and actions. Different versions may result in screens\
    \ that differ from those shown in this chapter. Your screen may also differ because\
    \ of the setting options that have been selected for your computer.\n\n# Activity\
    \ 1.1 Getting Started with Windows XP\n\nIn Activity 1.1, you will start Windows,\
    \ use the mouse, and use the Start button to open the Windows Calculator program.\n\
    \n+   1. Turn on your computer and wait for the **Windows** program to display,\
    \ or follow the log-on instructions required for the computer you are using. For\
    \ example, you may have to click a name on a Welcome screen, or enter a user ID\
    \ or password. If this is your home computer and you are the only user, it is\
    \ likely that you need do nothing except wait for a few moments.\n+   \n+    \
    \  The Windows *desktop*, which is the working area of the Windows XP screen,\
    \ displays. The working area is called a desktop because on it you can place electronic\
    \ versions of things you have on your regular desk. The screen look will vary,\
    \ depending on which version of Windows you are using and what you have on your\
    \ own desktop.\n+   2. Compare your Windows desktop with Figure 1.2 and then take\
    \ a moment to study the Windows elements identified in the table in Figure 1.3."
  merge: -1
  img_proc: true
