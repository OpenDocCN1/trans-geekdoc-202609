  md: '# Rubric


    A matrix that states the criteria and standards for grading student work. Used
    to grade open-ended assessments.


    # GO! with Help


    Students practice using the Help feature of the Office application.


    # You and GO!


    A project in which students use information from their own lives and apply the
    skills from the chapter to a personal task.


    # Outcomes-Based Assessments


    # Rubric


    The following outcomes-based assessments are open-ended measurements. That is,
    there is no one specific, correct result; your result will depend on your approach
    to the information provided. Make Professional Quality your goal. Use the following
    scoring rubric to guide you in how to approach the problem and then to evaluate
    how well your approach solves the problem.


    The categories Software Mastery, Content, Format and Layout, and Process represent
    the knowledge and skills you have gained that you can apply to solving the problem.
    The levels of performance Professional Quality, Approaching Professional Quality,
    or Needs Quality Improvements help you and your instructor evaluate your results.


    Rubric matrix with columns Your completed project is of Professional Quality if
    you, Your completed project is Approaching Professional Quality if you, Your completed
