- pgno: 6
  md: '# Letter from the Editor


    Dear Instructors and Students,

    The primary goal of the GO! Series is two-fold. The first goal is to help instructors
    teach the course they want in less time. The second goal is to provide students
    with the skills to solve business problems using the computer as a tool, for both
    themselves and the organization for which they might be employed.


    The GO! Series was originally created by Series Editor Shelley Gaskin and published
    with the release of Microsoft Office 2003. Her ideas came from years of using
    textbooks that didn’t meet all the needs of today’s diverse classroom and that
    were too confusing for students. Shelley continues to enhance the series by ensuring
    we stay true to our vision of developing quality instruction and useful classroom
    tools.


    But we also need your input and ideas.


    Over time, the GO! Series has evolved based on direct feedback from instructors
    and students using the series. We are the publisher that listens. To publish a
    textbook that works for you, it’s critical that we continue to listen to this
    feedback. It’s important to me to talk with you and hear your stories about using
    GO! Your voice can make a difference.


    My hope is that this letter will inspire you to write me an e-mail and share your
    thoughts on using the GO! Series.


    Stephanie Wall

    Executive Editor, GO! Series

    stephanie_wall@prenhall.com'
  merge: -1
  img_proc: true
