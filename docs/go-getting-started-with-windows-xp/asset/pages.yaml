- pgno: 1
  md: '# # Students


    # ## How to Find the Student Data Files

    to Complete the Projects in This Book


    Projects in this book begin either with a new blank file or from a student data
    file that has already been started for you.


    The student data files can be accessed from the enclosed CD-ROM or from the *GO!*
    Web site.


    ![](img/9fe65c86ec4bc221ab72a7112a60115a_1_0.png)


    # ### Files from the CD-ROM


    As specifically directed in each project, navigate to the CD-ROM, and then save
    and rename the file according to the instructions in the project.


    ![](img/9fe65c86ec4bc221ab72a7112a60115a_1_1.png)


    # ### Files from www.prenhall.com/go


    +   1. Decide where you want to store your student data files.

    +      - If you are storing on the hard drive of your computer or on a network
    drive, you may want to create a folder with an appropriate name on that drive.

    +      - If you are storing on a removable storage device such as a USB flash
    drive, Zip disk, or floppy disk, insert the device now.

    +   2. From your Web browser, go to **www.prenhall.com/go**.

    +   3. From the list of books provided, point to the title of this book, click
    the active link and then follow the instructions as specified on the Web site.'
  merge: -1
  img_proc: true
