    # Project 5Q — Go! with Help


    The Word Help system is extensive and can help you as you work. In this chapter,
    you used the Quick Access Toolbar on several occasions. You can customize the
    Quick Access Toolbar by adding buttons that you use regularly, making them quickly
    available to you from any tab on the Ribbon. In this project, you will use Help
    to find out how to add buttons.


    +   - Start Word. At the far right end of the Ribbon, click the Microsoft Office
    Word Help button. In the Word Help dialog box, click the Search button and, then
    click Offline Word Help.

    +   - In the Type words to search for box, type Quick Access Toolbar and then
    press Enter.

    +   - From the list of search results, click Customize the Quick Access Toolbar.

    +   - Click each of the links to find out how to add buttons from the Ribbon and
    from the Options dialog box.

    +   - When you are through, Close the Help window, and then Close Word.


    End You have completed Project 5Q'
