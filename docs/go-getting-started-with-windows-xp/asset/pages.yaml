  md: '# Matching


    # Windows XP

    chapter one


    Match each term in the second column with its correct definition in the first
    column. Write the letter of the term on the blank line in front of the correct
    definition.


    +   1. A bar that contains the Start button, buttons representing open programs,
    and other buttons that will activate programs.

    +   2. The arrow, I-beam, or other symbol that moves when you move the mouse or
    other pointing device, and that indicates a location or position on your screen.

    +   3. A box that displays information and usually consists of a title bar, menu
    bar, status bar, and toolbars, and that always has a Minimize button.

    +   4. The area at the top of a window that displays the file name and also contains
    the Minimize, Maximize/Restore Down, and Close buttons.

    +   5. A list of context-sensitive commands--commands that are commonly used when
    working on the selected object—usually activated by right-clicking a screen item.

    +   6. An area to the right of the Start button that contains shortcut icons for
    commonly used programs.

    +   7. The area on the right side of the taskbar where the clock and system notifications
    display, and where notifications display that keep you informed about processes
    that are occurring in the background, such as antivirus software checking, network
    connections, and other utility programs.

    +   8. A horizontal bar at the bottom of the document window that provides information
    about the current state of what you are viewing in the window, for example the
    page number of a document.

    +   9. The Windows feature that enables you to view text that extends beyond the
    edges of the screen.

    +   10. A Windows object used to keep related files stored together in one location.

    +   11. A compact disc that can be used over and over again to read and save files.

    +   12. The three- or four-letter ending to a file—that may or may not display—and
    that identifies the file type.

    +   13. The term given to an asterisk (*) or other character used to substitute
    for several characters in a file search.

    +   14. A miniature representation of the contents of a picture file, used in
    one of the file views in My Computer.

    +   15. To reduce the size of a file.


    +   A CD-RW

    +   B Compress

    +   C File extension

    +   D Folder

    +   E Mouse pointer

    +   F Notification area

    +   G Quick Launch toolbar

    +   H Scroll bar

    +   I Shortcut menu

    +   J Status bar

    +   K Taskbar

    +   L Thumbnail

    +   M Title bar

    +   N Wildcard

    +   O Window'
  merge: -1
  img_proc: true
