    # Objective 3


    # Maximize, Restore, Minimize, and Close Windows


    You can **maximize** a window, which enlarges the window to occupy the entire
    screen, and you can **restore** a window, which reduces the window to the size
    it was before being maximized. You can also **minimize** a window, which reduces
    the window to a button on the taskbar, removing it from the screen entirely without
    actually closing it. When you need to view the window again, you can click the
    taskbar button to bring it back into view.


    # Activity 1.3 Maximizing, Restoring, Minimizing, and Closing a Window


    In Activity 1.3, you will maximize, restore, minimize, and close the My Computer
    window.


    1 In the upper right corner of the **My Computer** window, on the **My Computer**
    title bar, point to the **Maximize** button [□], and then compare your screen
    with Figure 1.17.


    The Maximize button is the middle button in the group of three. When you point
    to it, a ScreenTip displays. Recall that a ScreenTip describes a button or screen
    element.'
