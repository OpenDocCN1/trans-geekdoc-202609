  \ Forest`，`RF`）。\n- **Stacking（堆叠）：** 它使用另一个模型（元模型）组合多个模型的预测结果。例如堆叠泛化（`Stacked Generalization`）。\n\
  ## 可解释人工智能 (XAI)\n在当今以网络为中心的世界，结合 EL 模型的 XAI 有助于以准确性和可信度预测心脏病。XAI 有助于描述 AI 模型是如何做出决策的。这一新发现的人工智能分支在疾病预测方面具有一些改进。图\
  \ 3\n\n\n- **药物发现与开发：** 在药物发现和开发中，XAI 模型起着至关重要的作用。\n\n\n图 4 XAI 的功能。[](#ch2.xhtml#R_fig2_4)\n\
  采用 XAI 有许多原因，其中一些是：\n- 它有助于偏差检测。\n- 它有助于改进现有模型。\n\n\nXAI 技术可以如图 5\n\n- **模型无关方法\
  \ (Model-agnostic Methods)：** 任何模型都可以使用这些方法开发。一些现有模型包括：\n    - `SHAP`（`Shapley 加性解释`）：它使用博弈论来解释对预测的贡献。\n\
  \    - 决策树（Decision Trees）：它提供清晰的决策。\n- **可视化技术 (Visualization Techniques)：** 这些方法以视觉方式提供预测。一些现有模型包括：\n\
  \    - 局部依赖图（Partial Dependence Plots）：它描述单个特征的影响。\n\nEL 是一种基于 ML 的技术，在最大化准确率的同时使用多个模型预测心脏病。如果任何单一模型无法准确分类，通过其他模型的帮助可以生成更准确的结果。当\
  \ XAI 结合时，它提供了高精度和透明度。EL 可以在保持其他因素不变的情况下对心脏病进行预测。\n\n## 目标\n\n该集成框架的关键目标不仅是建立心脏病预测系统，还为了解释\
  \ AI 系统判断图像健康还是不健康的过程。尽管 AI 现在被广泛应用于医疗，但很大一部分人口对其深度参与仍持有怀疑和不安。因此，为了在人类中建立信任，需要解释这些\
  \ EL 方法的内部过程。借助 AI 预测系统，诊断过程不仅更加便宜，而且降低了复杂性。\n\n医疗领域 XAI 的主要目标：\n- **领域意义 (Domain\
  \ Sense)：** 解释符合领域应用。\n- **简洁性 (Parsimony)：** 描述越简单越好。\n- **信任/性能 (Trust/Performance)：**\
  \ 预测算法必须达到预期水平。\n\n\n\n\n## 模型复杂度\nEL 模型比单一经典机器学习（ML）模型更复杂，因为它们使用了多个单一分类器模型来进行心脏病预测。在某些情况下，即使使用了可解释人工智能（XAI）技术，这种复杂性可能会增加理解模型预测目的的难度。\n\
  \n### 数据集要求\n\n### 计算成本\n\n### 泛化性\n众周知，心脏病是最复杂的疾病类型，且不同人群中可能存在多种类型。因此，如果训练数据集中缺乏泛化性，对于预测心脏病可能会是另一个挑战。\n\
  \n### XAI 方法的选择\n\n### 比较问题\n\n### 在临床环境中的应用\n\n## 文献综述\n本研究识别了若干现有的研究类型。\n### 综述\n\
  \n\n\n\nB-LIME 是传统 `LIME` 技术的增强版本，它提高了可解释性并保留了时间依赖性 (Abdullah et al., 2023)。\n\n\
  研究通过混合 `DL` 模型（`CNN-GRU`）评估了用于心律失常分类的 `B-LIME`。结果证明了其在提供 ECG 数据更可靠且显著的解释方面优于 `LIME`。研究提出了一种集成\
  \ `EL` 和量子 `ML` 来描述模型的预测能力 (Abdulsalam et al., 2023)。作者还引入了 `SHAP` 来改进该模型。介绍了一种使用\
  \ `LIME` 和 `SHAP` 的机器学习解释性模型，用于解释医疗应用中的预测结果 (Ahmed et al., 2024)。该研究还强调了 `LIME`\
  \ 和 `SHAP` 的优缺点。逻辑回归模型实现了 86% 的测试准确率。通过 `XAI` 方法在可解释模型中强调了用于检测心脏疾病的特征贡献 (Asih et\
  \ al., 2023)。\n在另一项研究中，作者描述了 `XGBoost`、`RF`、`SVM` 和 `Naive Bayes` 如何有效地改进早期检测和诊断，并指出\
  \ `SHAP` 和 `LIME` 等方法在医学环境中至关重要，强调了特征可解释性的需求 (Assegie et al., 2023)。在 `XDL` 范式下设计了一个用于\
  \ CVD 早期检测的框架。它证明了在识别心肌梗死和房颤等状况方面的用途，并通过将 `XDL` 框架整合到临床流程中，在道德考虑获得了良好的准确性和特异性 (Ayodele\
  \ et al., 2024)。在其中一项研究中，作者利用集成方法分析了能够增强预测能力的各种 `ML` 算法 (Bizimana et al., 2024)。该研究还阐明了改进的基于可解释学习的技术，这些技术实现了\
  \ 96.00% 的显著准确率。\n在另一项研究中，作者提出了一种利用 12 导 ECG 信号分类九种心律失常类型的 `XDL` 模型。它将多种深度学习 (`DL`)\
  \ 架构与基于 `SHAP` 的可解释性分析进行比较，以识别每种心律失常类型最相关的 ECG 及其信号段，强调了 `XAI` 在增强模型透明度和临床信任方面的作用\
  \ (Chukwu & Moreno-Sanchez, 2024)。通过使用各种特征选择方法解决了维度问题，并强调了 `ML` 模型对透明度和更好性能的需求 (Das\
  \ et al., 2023)。一种基于示例和特征的 `XAI` 技术已应用于心脏病数据集，通过分析和比较 AI 医疗应用中不同的可解释性方法来提高信任度、透明度和公平性\
  \ (Dave et al., 2020)。\n研究考虑了多种策略和方法，包括用于 CVD 预测的逻辑回归和 `SVM`（支持向量机）。通过对不同算法及其准确率进行对比分析，确定了不同方法的性能和效率\
  \ (Deokar & Pradhan, 2024)。一项研究比较并解释了 `SHAP` 和 `LIME` 对特征的影响 (Doumard et al., 2022)。该研究还讨论了这些方法的局限性和优势。在另一项研究中，作者采用\
  \ `ANOVA`、`卡方检验`和互信息进行特征选择 (El-Sofany et al., 2024)。使用 `SMOTE` 用于模型预测，并通过 `XAI`\
  \ 技术进行解释。在其中一项研究中，作者探索了具有特征选择意义的多种 `ML` 算法的快速演进，以增强模型性能 (Ghose et al., 2024)。该研究还建议应用专家见解和领域知识来增强\
  \ `ML` 的预测性。在另一项研究中，作者将 `XGBoost` 和 `AdaBoost` 等复杂的集成方法与 `SHAP` 和 `LIME` 等可解释模型相结合\
  \ (Gulhane & Sajana, 2024)。提出了一种结合 `SHAP` 和 `CatBoost` 的框架，以强调对 CVD 相关风险因素的早期检测\
  \ (Jha et al., 2025)。这项研究检查了 `XAI` 应用范围，强调了 `ML` 如何涵盖此类预测中的透明度。\n开发了一种改进检测 LVEF\
  \ 的 ECG 分析可解释性的 `XAI` 模型 (Katsushika et al., 2023)。该研究在 ECG 和超声图数据集上训练了 `RF` 模型，应用\
  \ `SHAP` 来识别决策标准。模型提取了六个有助于分类的关键 ECG 发现，在审查临床适用性的决策过程后改进了心脏病专家的解释性。一项研究涉及使用 `XAI`\
  \ 方法来发现特定年龄的风险标记并对其进行评估 (Kiran et al., 2025)。\n其中一项研究强调了 AI 系统的伦理影响以及向 `XAI` 方法增强透明度的趋势\
  \ (Kommineni et al., 2024)。建议采用以患者为中心的 AI 诊断方法，赋予患者理解和询问结果的能力。该研究鼓励透明 AI 系统的道德原则，并调查了\
  \ XAI 模型的性能指标。在其中一项研究中，作者通过结合领域知识来改进 R 峰的时间检测，提出了一种改进的 `CNN` 架构 (`Kovalchuk et al.,\
  \ 2025](#ch2.xhtml#ref2_21))。它解释了使用临床相关特征的决策达到了 99.43% 的高分类准确率，展示了透明度的提升。\n### 临床背景下的数据挖掘与机器学习\n\
  数据挖掘和 `ML` 技术通过转化检查海量数据集的能力来影响医疗保健 (Laftah et al., 2024)。通过纳入集成方法，混合模型增强了预测精度，达到了\
  \ 88.7%。其中一项研究解释了在旧数据集上应用 `SHAP` 增强模型预测的 `XAI`  (Loh et al., 2021)。在另一项研究中，作者使用\
  \ `SHAP` 开发了一个预测模型来评估老年心衰竭的风险因素 (Luo et al., 2024)。在研究论文中提出了一种基于 ECG 的心脏病的 `RF`\
  \ 和 `XGBoost` 的双树解释器模型 (Majhi et al., 2024)。\n研究得出结论，带有 `EWT`（经验小波变换）的 `XGBoost`\
  \ 模型优于其他模型，证明了可解释 AI 在医学诊断中的有效性。研究处理了准确诊断和分类 COVID-19 及肺癌的 AI 方法 (Mane et al., 2024)。在研究中，评审人员详细阐述了使用逻辑回归、`MLP`\
  \ 分类器、神经网络和集成方法将 `XAI` 和 `ML` 应用于心脏病的诊断和检测 (Mariam & Aha et al., 2024)。\n提出了一种混合策略，通过带有贝叶斯优化的集成分类器，将\
  \ `XAI` 技术作为阐明模型预测和 `ML` 模型可解释性的辅助 (Mienye & Jere, 2024)。通过对已描述的心衰（`HF`）生存模型的科学证据，阐明了对透明\
  \ AI 解决方案（特别是精准医学）日益增长的需求 (Moreno-Sanchez, 2023)。此类复杂的 AI 模型被解释为使用 `XAI` 解决方案具有解释性。在关于\
  \ `XAI` 的研究中，作者利用 AI 和自然语言处理 (`NLP`) 开发 AI 驱动的健康机器人，在任务中模仿人类代理 (Muneer et al., 2024)。\n\
  还纳入了 `XAI` 方法。在另一项研究论文中，作者检查了使用 `XAI` 和 `ML` 预测心脏病的情况 (Ozdemir, 2024)。在这项研究中，`SVM`\
  \ 提供了最佳性能，并在 `KNN`（k 近邻）算法中发现了最高的准确率分。`SHAP` 和 `LIME` 等可解释方法有助于确定特征的重要性，`XGBoost`\
  \ 模型在得出准确率方面表现优于其他模型。使用 `XAI` 进行心肌发作预测的关键特征已确定 (Paudel et al., 2023)。通过 `SHAP` 赋予重要性来增强\
  \ `ML` 预测 (Pawar et al., 2024)。通过 `LIME` 赋予重要性来解释 `ML` 分类器的决策集 (Qaisrani et al.,\
  \ 2024](#ch2.xhtml#ref2_32))。这项工作指出，当决策树与其他技术结合时，对于心脏疾病的检测是有效的 (Salih et al., 2023)。这里展示了\
  \ `SHAP` 达到 96.5% 的整体准确率 (Sathi et al., 2024)。`k-mode` 聚类在预测心脏疾病方面的有效性已讨论 (Titti\
  \ et al., 2024)。它还包含了 `Naive Bayes` 和 `XGBoost` 用于自动心脏疾病检测系统，通过实施结合 `ML` 和 `XAI`\
  \ 的复杂混合预测模型。\n\n\n## 研究空白\n通过综述发现，现有的大多数工作都使用电子病历（EMR）数据作为输入，利用集成机器学习（ML）开发预测模型。因此，使用可解释人工智能（XAI）技术的解释仅针对简单的数值数据。只有少数工作将\
  \ ECG 图像作为输入，通过某些深度学习（DL）方法进行预处理并训练以构建预测模型。随后，利用 XAI 技术（`SHAP` 和 `LIME`）对模型性能进行描述。因此，需要引入作为心血管疾病（CVD）预测更方便且易获取资源的\
  \ ECG 图像，并设计一种能够构建更高准确率模型的集成机器学习方法。由于隐私考虑，医疗数据存在局限，结果可能会面临数据过拟合的问题。为了解决这个问题，本文提出的工作增加了更多的输入数据值，并构建了一个具有预期结果合理性的集成框架。这不仅能解决模型中的过拟合问题，还能通过清晰的原理验证结果，并理解预测模型的输出。\n\
  ## 拟议框架\n本文描述了用于心脏疾病预测的结合 XAI 的 EL 模型联合框架。\n### 框图\n`图 6` 展示了所建议联合模型的框图。该模型分为三个基本阶段。\n\
  ![Fig. 6 联合模型的框图。 ⏎](img/fig2_6_B.jpg)\n图 6 联合模型的框图。 ⏎\n*   数据处理\n*   结果理解\n###\
  \ 数据处理\n在此阶段，收集并处理输入数据以消除输入数据集中的噪声，并选择前 10 个特征。为了具有更好的可理解性，该阶段再次细分为三个部分。\n*   **ECG\
  \ 图像数据输入模块：** 首先从网络资源收集 ECG 图像。然后将 ECG 图像分为两部分：1) 健康 ECG 图像，即无心脏疾病的人员；2) 不健康 ECG\
  \ 图像，即患有心脏疾病或有心脏病史的人员。\n\n\n\n\n\n\n2. 将去噪后的图像调整为标准尺寸（1*255），以便进行一致处理和精确分析。\n4.\
  \ 将 ECG 图像转换为灰度格式，通过降低其强度级别来简化图像数据。\n6. 读取每种 ECG 类型（健康和不健康）的 CSV 文件。\n\n\n\n\n\n\
  \n\n*   **包装法（Wrapper Methods）：** 这些方法通过实际训练模型并测试不同特征组合如何影响性能来选择特征。这就像在配方中尝试另一种混合比例以发现最佳配方。后向消除、正向选择和递归特征消除是一些示例。虽然这些方法更准确，但由于需要反复构建模型，速度可能较慢。\n\
  \n\n### 模型执行\n\n此阶段定义了基于所选特征实现联合模型的程序。执行模型工作流分为四个部分。\n\n*   **数据划分：** 在此阶段，数据集被分为两个子集。一个子集用于模型训练，另一个用于模型测试。此处输入数据集按\
  \ `80:20` 比例划分。\n*   **基模型选择：** 基模型选择是机器学习中选择初始模型的程序。这里的基模型通常指作为特定问题基础的现有通用模型。该模型可能未针对领域进行优化，但它是进一步更改、微调或特定训练的更好选择。在机器学习中，基模型可能涉及选择根算法或方法（例如\
  \ `决策树` 和 `KNN`）以进行构建。\n*   **集成模型形成：** 集成模型形成意味着汇多个单一分类器模型用于心血管疾病预测。因此，任何模型的弱性能都可以通过另一个模型的强性能来补偿，从而产生更高的准确率。\n\
  *   **测试模型并评估性能：** 在成功训练 EL 模型后，对所有人进行测试。通过分析 `F 分数`、`准确率`、`ROC`、`PR 曲线`等指标对模型性能进行评估。通过这种比较分析可以得出结论：准确率最高的模型预测效果最好。\n\
  \n### 结果理解\n\n此阶段根据决定性的特征选择描述了结果背后的原理。对于结果的理解，它被细分为三个部分。\n\n*   **可解释接口：** 机器学习模型有助于预测心脏疾病。但为了建立对模型的信任，`XAI`\
  \ 辅助辅助描述预测背后的机制。\n*   **研究结果的验证与分析：** 这一步通过对 `SHAP` 和 `LIME` 模型生成的结果进行合理性证明来完成。\n\
  \n\n\n\n\n# 算法 2：用于心脏病检测的带 XAI 的联合集成学习模型\n**输入：** 健康与健康的 ECG 图像数据集。\n**开始：** 按照算法\
  \ **1.** 中的描述对输入图像进行预处理。\n**对于每个样本图像**\n应用机器学习算法（`KNN`、`Decision Tree`、`XGBoost`、`Voting\
  \ Classifier` 和 `Random Forest`）。\n1. 根据置换显著性评分，结合嵌入式特征选择方法选择十个重要特征。\n3. 绘制 `PR`\
  \ 和 `ROC` 曲线。\n**结束**\n收集最准确的结果。\n**执行**\n针对特定实例（`index = 5`）使用 `LIME` 和 `SHAP`\
  \ 生成可解释结果，**同时**（验证最合适的结果）。\n**结束**\n**输出：** 心脏病可能性（以健康/不健康的百分比表示）。\n## 结果仿真\n结果是根据所提出的联合算法进行仿真的。\n\
