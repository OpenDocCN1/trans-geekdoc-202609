  \ 达到 96.15%，Jaccard 指数为 93.02%。它还将 `HD` 减少到 5.30 mm 并将 `ASSD` 提高到 0.055 mm，证明了其捕捉肝边界复杂细节的能力。`Attention\
  \ U-Net` 通过添加注意力门来关注相关区域，其 `DSC` 为 96.32%，Jaccard 指数为 93.50%，且 `HD` 显著减少至 3.93 mm，凸显了其增强分割精度的能力，特别是在关键区域。`Unet2`\
  \ 作为一种基于 transformer 的架构取得了更好的结果，`DSC` 为 96.50%，Jaccard 指数为 93.83%，`HD` 进一步减少到 3.15\
  \ mm，证明了 transformer 在捕捉全局上下文以实现更准确分割方面的优势。`TransUNet` 模型结合了 transformer 和卷积层，报告的\
  \ `DSC` 为 96.81%，Jaccard 指数为 94.40%，`HD` 进一步下降到 3.00 mm。该模型在区域重叠和边界精度方面均有明显改进。`SwinUNet`\
  \ 是另一个基于 transformer 的模型，性能优于以往的方法，`DSC` 为 97.10%，Jaccard 指数为 94.91%，`HD` 为 2.82\
  \ mm。其 `RVD` 为 0.080， `ASSD` 为 0.015 mm 反映了在分割准确性和边界定义方面的显著进展。\n\n最后，`EDiNA-UNet`\
  \ 产生了最高的整体效能，`DSC` 为 97.20%，Jaccard 指数为 94.92%，略超过了 `SwinUNet`。此外，它将 `HD` 减少到 2.62\
  \ mm，并实现了所有模型中最低的 `RVD`（0.048）以及 0.014 mm 的 `ASSD`，表明了高度准确的边界分割和最小的体积误差。这些结果强调了所提模型准确分割肝脏的增强能力，特别是在处理复杂边界细节和获得高重叠准确率方面。\n\
  \n与以往方法相比，`EDiNA-UNet` 模型在多个评估指标上表现出显著改进。其 `DSC` 提升了 0.40%，凸显了预测区域与真实区域之间更准确的重叠。此外，Jaccard\
  \ 指数增加了 0.31%，表明交并比有所提高，分割精度更高。该模型还将 `HD` 减少了 0.34 mm，显示出更紧密的边界匹配并最大限度地减少了最大边界不匹配。此外，`RVD`\
  \ 减少了 0.048，确保了更准确的体积分割，尺寸预测误差更小。最后，`ASSD` 减少了 0.004 mm，实现了更精细的边界分割以及预测表面与实际表面之间更好的对齐。这些进步证实了\
  \ `EDiNA-UNet` 模型在医学图像分割（特别是肝脏分割任务）中的稳健性和精确性。这些改进虽然是渐进的，但反映了模型在分割质量方面增强的精度的准确性，特别是在肝脏结构的边界和肿瘤区域存在处。`HD`\
  \ 和 `ASSD` 的改进表明了卓越的边界分割，这是准确界定肝脏的一个重要特征，因为即使微小的边界不匹配也会显著影响临床结果。\n\n## 定性结果\n\n\
  分割结果的定性视觉表示如图 3 和 图 4 所示，对 `EDiNA-UNet` 在肝脏分割任务中相对于基线模型的性能提供了全面评估。这些图表明，`EDiNA-UNet`\
  \ 擅长捕捉肝边界的细粒细节，显著减少了现有方法常见的过分割和欠分割误差。该模型的卓越性能归功于其创新的空洞邻域注意力机制，该机制动态调整感受野，以关注多个尺度上的相关空间特征。对局部精度和全局上下文感知的双重关注导致了分割准确度的提高，特别是对于肝脏等复杂的解剖结构，使\
  \ `EDiNA-UNet` 成为诊断和治疗计划等临床应用的非常有前景的工具。\n\n![图 3 采用不同方法的分割](img/fig6_3.jpg)\n\n\
  图 3 采用不同方法的分割](#ch6.xhtml#R_fig6_3)\n\n在图 3 中，分割结果以绿色轮廓表示真实值，红色轮廓表示每个方法的预测分割。轮廓之间的重叠程度是分割准确性的视觉指标，密切对齐表示高精度，而差异则显示了过分割或欠分割。`UNet`\
  \ (Ronneberger 等, 2015) 和 `UNet++` (Zhou 等, 2015) 显示出明显的偏差，红色轮廓经常超出绿色真实值，表明在肝脏上下边缘存在过分割。`AttentionUNet`\
  \ (Oktay 等, 2019) 产生了欠分割，红色轮廓未达到真实值边界，特别是在肝叶边缘，表明其方法过于保守。`MultiResUNet` (Ibtehaz\
  \ & Rahman, 2019) 虽有改进，但在形状不规则的区域仍存在过分割和欠分割误差。`UNeTr` (Hatamizadeh 等, 2021) 提供了更强的整体重叠，尽管存在微小的边界误差，而\
  \ `TransUNet` (Jieneng 等, 2021) 和 `SwinUNet` (Hu 等, 2023) 进一步减少了误差，`SwinUNet` 仅显示出轻微欠分割。相比之下，`EDiNA-UNet`\
  \ 展示了极好的重叠，红色轮廓即使在肝叶等挑战性区域也能精确遵循真实值，这得益于其自适应扩张机制。\n\n\n\n\n\n图 4 通过在原始 CT 肝脏图像上叠加真值（ground\
  \ truth）和预测值分割提供了更详细的可视化，使用颜色编码区域来突出性能。蓝色区域表示预测与真值完美对齐的准确分割，绿色区域代表假阴性（漏过的肝脏区域），红色区域表示假阳性（过度分割区域）。`UNet`\
  \ 和 `UNet++` 在肝脏边缘显示出明显的红色区域，表示过度分割，同时叶边缘附近的绿色区域反映了分割不足。`AttentionUNet` 的叠加图以绿色区域为主，表明漏掉了肝脏组织，而\
  \ `MultiResUNet` 显示出更平衡但仍不完美的结果。`UNeTr` 和 `TransUNet` 减少了误差，以蓝色为主，但在边界处有小的红色和绿色区域。`SwinUNet`\
  \ 表现良好，大部分为蓝色区域且绿色区域极少，但 `EDiNA-UNet` 脱颖而出，几乎完全是蓝色的叠加，表明即使在复杂的边界区域也具有极高的分割准确性，假阳性或假阴性极少。\n\
  \n![图 4 使用不同方法的分割结果。](img/fig6_4_C.jpg)\n\n图 4 使用不同方法的分割结果。](#ch6.xhtml#R_fig6_4)\n\
  \n来自图 3 和 4 图的定性结果强调了 `EDiNA-UNet` 在肝脏分割方面的卓越性能，特别是其精确勾勒复杂解剖边界的能力。图 3 中紧密的轮廓对齐以及图\
  \ 4 中主要的蓝色叠加凸显了其减少分割误差的有效性，在临床环境中，准确的肝脏分割对于肿瘤检测、手术规划和疾病进展监测等应用至关重要。与 `UNet`、`UNet++`\
  \ 甚至基于 transformer 的 `SwinUNet` 等基线模型相比，`EDiNAUNet` 的自适应注意力机制提供了更稳健、更通用的解决方案，解决了\
  \ `CNNs` 和 transformers 的局限性。通过减少过度分割和分割不足误差，`EDiNA-UNet` 确保了更可靠的分割，可能提高医学影像应用中的诊断准确性和治疗效果。\n\
  \n### 消融实验\n\n### 自适应膨胀的影响\n\n在消融实验中，研究了 `EDiNA-UNet` 模型中自适应膨胀的影响。将固定的膨胀率 `δ` =\
  \ 2 与自适应膨胀调度方法进行了比较。使用固定膨胀时，模型实现了 `DSC` 96.60%、`Jaccard` 94.12%、`HD` 3.04 mm、`RVD`\
  \ 0.072 和 `ASSD` 0.020 mm 的百分比值。相比之下，自适应膨胀方法显著提升了这些指标，使 `DSC` 增加了 0.60%，`Jaccard`\
  \ 指数增加了 0.80%，同时减少了边界误差，证明了动态调度增强了模型更有效地分割不同尺度区域的能力。\n\n### 跳跃连接的数量\n\n接下来，分析了连接编码器层和解码器层的跳跃连接数量的变化如何影响\
