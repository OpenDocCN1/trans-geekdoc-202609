  \ | - | `Chamomilla` (99.7%), `Eupatorium perfoliatum` (71%)\n\n### 计算成本分析\n\n我们使用的每种向量化方法都有不同的计算特征。TF-IDF\
  \ 计算量轻级且速度快，因为它不需要深度神经网络。Word2Vec 需要一些初始训练，但在推理时效率很高，因为它生成的是相对低维的嵌入。它的架构简单。另一方面，BERT\
  \ 由于其 Transformer 架构，计算成本很大。GloVe 嵌入是预训练的，消除了每次查询的训练时间。但由于其固定大小，它们消耗内存。`glove.6B.300d.txt`\
  \ 文件为 1.04 GB。\n\n\n\n\n总而言之，由于计算需求较低，`TF-IDF` 和 `Word2Vec` 是实时药物建议的有效选择。`TF-IDF`\
  \ 的简单性在该特定数据集上并未损害其准确性。`Word2Vec` 在资源效率和准确性之间取得了良好的平衡。通过调整其超参数，我们在保持低计算成本的同时增强了模型的准确性。\n\
  \n## 讨论\n\n本研究中，用户提供的症状描述以自由格式文本的形式显示。与传统的基于表单的系统相比，这提供了一种更直观、自然的输入方式。通过这种方法，人们可以用自己的话描述症状，而不受严格格式或预定义字段的限制。由于自由格式文本非常接近患者在现实医疗就诊期间通常描述症状的方式，其灵活性显著提升了整体用户体验。我们建议系统的主要优点之一是使用了自然语言输入，它允许人们以各种方式交流健康问题。\n\
  \n我们的评估结果显示，`TF-IDF` 在药物建议的准确性方面超过了所有其他技术，它实现了 100% 的准确率。这是一种直接的向量化方法。对于需要快速准确预测的实时应用，尽管\
  \ `TF-IDF` 是一个非常简单的框架，但它仍然是一个极佳的选择。由于其计算高效且资源需求低，系统可以快速处理用户输入。因此，我们的系统非常适用于那些需要即时反馈的场景，例如用户希望获得及时指导的医疗保健应用。\n\
  \n此外，我们提出的系统解决了早期研究中可见的缺陷。例如，Priyadarshi and Saha (2020) 使用网络爬取技术为他们的研究收集数据。网络爬取需要从大量网页中提取信息，这是一个耗时的过程，特别是在处理海量数据时。还有其他问题，如网速慢、网络中断。此外，由于网络源本质上的不可靠性，通过网络爬取收集的数据经常存在错误。另外，网页可能会频繁变化，导致信息过时或链接失效，这使得爬取过程更加困难。\n\
  \n另一方面，我们建议的系统采用了更可靠的策略，即建立在权威且良好的来源之上。我们使用了由 `Allen` 和 `Nash` 等知名顺势疗专家编写的著作。这些资源被广泛接受，并在顺势疗领域已使用了多年。专家们通过参考这些书籍来提供精确且经过验证的建议。通过依赖此类可靠来源，我们的系统极大地减少了因频繁网络爬取导致的错误和不一致性。\n\
  \n### 应用与未来潜力\n\n该系统具有进一步开发为聊天人的潜力，我们计划在未来对此开展工作。这种工具将对个人有益，特别是对于难以接触顺势疗顾问的农村地区。同西药（Allopathic\
  \ medicines）是有效的，但有时会导致副作用或长期影响。与这些不同，顺势疗法药物由高度稀释形式的天然物质制成，度地减少了副作用。这使得顺势药物更加安全。此外，由于顺势药物价格更便宜，它将显著使经济困难的社区受益。从长远来看，可以安排护理人员到特定地区，协助那些无法独立使用系统的人以确保更广泛的访问性。该系统作为顺势疗顾问的决策支持工具也具有巨大潜力，帮助他们更高效地为患者处方。\n\
  \n## 局限性\n\n尽管提出的顺势疗药物预测系统具有创新性，但仍存在若干局限性。主要的担忧之一是它对 `Word2Vec`、`TF-IDF`、`BERT`\
  \ 和 `Glove` 等向量化方法的依赖。它们可以根据文本相似性分析症状，但无法完全理解底层的医学细微差别。这些技术未能捕捉顺势疗法所要求的复杂性和个体差异。在该领域，药物的处方通常基于精确的个性化症状模式和患者的整体体质。\n\
  \n系统缺乏全面的训练数据进一步加剧了这一问题。这可能导致偏见或不完整的药物建议，特别是对于数据集中未充分代表的罕或复杂病例。`TF-IDF` 在本研究中表现优异，但它确实有缺点。它将每个文本视为“词袋”，而忽略了术语之间的顺序上下文或语义关系。这一局限性可能会影响它理解词序起作用的细微描述的能力。\n\
  \n另一个主要局限性是系统在泛化和可解释性方面的挑战。预测模型像黑箱一样。这是因为系统提供了相似性评分，而没有为建议的药物提供临床依据。这种透明度的缺乏会损害对系统的信任，因为从业者和患者都需要理解建议治疗背后的逻辑。此外，系统无法考虑动态症状、情绪因素或环境影响，而这些在顺势疗法的诊断和治疗中至关重要。\n\
  \n这些缺陷凸显了持续进行人工监督的必要性。这证明了咨询合法的顺势疗实践师以验证并个性化最终治疗方案的重要性。对于我们模型的评估，我们依赖于医学知识范围有限的书籍。因此，虽然系统可以协助识别药物的阶段，但它不能替代顺势疗实践所需的临床判断和专业知识。\n\
  \n## 结论\n\n我们的研究展示了利用自然语言处理（NLP）创建一种根据患者报告症状选择个性化顺势疗药物的新方法的可行性。它使用了源自权威顺势疗参考文献的广泛策划数据集。评估结果表明，在所有评估的向量化技术中，`TF-IDF`\
  \ 与 `Cosine Similarity` 指标结合时产生了最准确的预测。观察测试结果可以得出，尽管 `TF-IDF` 非常简单，但它是处理这项特定任务的有效方法。这些发现表明，使用自然语言处理可以使顺势疗药物建议更加准确高效。\n\
  \n在未来的发展中，可以探索 `TF-IDF` 与 `Word2Vec` 等其他高级向量化方法的结合以创建元嵌入（meta-embeddings）。这具有增加症状表示精度的潜力。此外，系统升级为对话聊天机器人可能为更灵活、用户友好的解决方案打开大门，因为它将提高系统的交互性。总而言，我们提出的系统可以升级以加强患者与顺势疗专业人员之间的联系。\n\
