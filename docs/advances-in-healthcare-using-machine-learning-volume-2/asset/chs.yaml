  \ | 27.9 | 28.2 | 23.4 | 62.6 |\n\n糖尿病会导致糖尿病患者产生眼病。这是一种视力问题 (Rahimy, 2018)，会导致严重的视力障碍\
  \ (Tufail et al., 2019)。糖尿病可能引发青光眼、白内障和糖尿病视网膜病变。日益强调定期体检和使用专业设备进行疾病诊断，这对医护人员的影响不言而喻。为了加速、替换或促进诊断过程，自动化技术是更优的选择。这些自动化技术的收益超过了其他算法。\n\
  \n\n\n\n\n*   虽然目前有多种方法用于病变诊断和视网膜病变分类，但它们没有同时考虑每个病变的识别。\n*   许多研究人员已将多种分类器用于视网膜病变筛查，并注意到流行的分类器需要大量的添加时间和频繁的迭代。\n\
  *   关注进一步排名：可以通过根据严重程度或分级对视网膜状况进行分类来增强这一点。\n\n详细区块指定了主动图像处理和深度教育程序的必要性，旨在从视网膜底图像中分类出清晰轮廓，以组织和发现糖尿病视网膜病变。该探索代表了所的复杂声明以及研究思路\
  \ (Gulshan et al., 2016)）。它还强调了进行这项调查所采用的研究策略。\n\n## 研究目标\n\n根据前一节已展示的实践，目前为人知的目标基于研究计划第一阶段获取的文献。它们是：\n\
  \n1. 开发多种信息良好的系统及其检测疾病的可能方法。\n2. 了解不同视网膜病变的分类效果如何，以及在常见的视网膜图像中是否能发现病变。\n3. 演进并执行新的计算方案并识别多种视网膜病变状况。\n\
  4. 根据一系列指标、理想的准确率、精确率和减少的处理时间，对计划模型在视网膜病变检测中的表现进行估计、验证和优化。\n\n### 分割方法\n\n模板匹配和数学形态学被应用于红病变的系统化分类、检测和分割。分类的常用步骤是预处理、初始候选检测、特征提取。预处理对于从背景中增强红病变非常重要\
  \ (Fleming et al., 2006)。归一化和色调校正方法 (Walter et al., 2007) 被应用于预处理。为了将微动脉与其他点状结构区分开\
  \ (Fleming et al., 2006) 应用了分水变换。使用可变带宽来评估核密度 (Walter et al., 2007)、模板匹配 (Bae et\
  \ al., 2020 用于提取出血)。使用 Radon 变换算子检测不同的圆形结构 (Giancardo et al., 2010)。对于病变检测，使用了小波变换\
  \ (Quellec et al., 2008) 和支持向量机 (`SVM) (Adal et al., 2017)。阈值操作用于通过 Lazar and Hajdu\
  \ (2012) 制作微动脉的评分图来检测微动脉。(Rocha et al., 2011) 使用了视觉词汇表来跳过预处理或后处理步骤，并检测病变内部的感兴趣点。为了识别微动脉，转向截面轮廓在图像的驻留最大像素上进行评估。接着，根据其奇异的大小、形状和高度检测到峰值\
  \ Lazar and Hajdu (2012)。为了检测微动脉，巧妙地使用了带有特征提取技术 (Viola & Jones, 2001) 和独特分割方法的霍夫变换\
  \ (Lazar & Hajdu, 2012)。这使用基于波轮的增强技术 (Kar & Maity, 2017) 将红病变从背景分离。通过结合使用拉普拉斯和高斯滤波器的相应材料改进了红病变的检测\
  \ (Zhou et al., 2017)。使用无监督分类方法检测了微动脉 (Zhou et al., 2017)。暗色实体过滤开发，同于奇异频谱分析，用于限制图像中的虚假希望。\n\
  \n### 红病变分割方法\n\n建议的方法有两个阶段。在第一阶段，使用嵌套 U-Net 进行红病变分割 (Zhou et al., 2018)。在第二阶段，通过子重复分类完成假阳性数量的减少。推荐方案的框图显示在\
  \ 图 1，然后在随后的章节中澄清了策略的细节。\n\n### 预处理\n\n红病变的自动检测由于低图像对比度、光照不均匀和微动脉的极小结构而变得珍贵 (Lin\
  \ et al., 2017)。血管的交叉处与红病变相似，并会导致假阳性。在经典图像分析中，形态学 (Fleming et al., 2006)、模式匹配 (Giancardo\
  \ et al., 2010)、截面轮廓分析 (Quellec et al., 2008) 以及多尺度过滤 (Wang et al., 2016) 被探索用于红病变检测。使用分水变换从其他结构中挖掘了微动脉\
  \ (Bae et al., 2020)。多种形状的出血通过 Radon 算子检测到红病变 (Giancardo et al., 2010)。Wang et al.,\
  \ 2016) 执行了截面文件的奇异频谱分析。小波变换 (Giancardo et al., 2010) 和基于波轮的方法 (Kar & Maity, 2017)\
  \ 也被探索用于红病变检测。深度神经网络被训练从视网膜底图像中诊断极端病变，Wang et al., 2016) 应用卷积神经网络 (`CNN`) 基于块分类检测出血，其中负块从没有出血的图像中提取，正块则仅从出血位置提取\
  \ (Van Grinsven et al., 2016)。\n\n通过能量性地选择分类错误的负样本使训练变得更快。这种方法在块级别工作，不是端到端训练的。我们展示了一个在图像级别工作的单阶段检测框架，它是端到端的。该架构依靠一个用于形成特征图的支柱和带有跳跃连接的特征金塔网络\
  \ (`FPN`) (LIN et al., 2017)，以有效结合低分辨率特征与开发分辨率图像特征。最后集成了分类和回归头以识别红病变及其位置。FPN 解决了以前架构的若干限制，并在多个尺度上创建了具有强语义的特征金塔。该投影网络可以在所有可能的尺度上图像级别进行训练，并适用于广泛的红病变\
  \ (Tufail et al., 2017; Ting et al., 2017)。对比度限制适应直方图均衡化 (`CLAHE`) 被用于使多种红病变更加可见，如\
  \ 图 2 所示。\n\n\n\n\nU-Net++ (Zhou et al., 18) 网络包含一个用于健康图像分割的编码器路径和解码器路径。解码器提取语义、高层和发展特征，而编码器则提取低层和可接受的特征图。在推荐的网络中，多个密集\
  \ CNN 块连接在解码器和编码器路径之间。编码器和解码器路径的混合用于分割 U-Net++ (Zhou et al., 18) 架构中的红色病变。为了获得更好的分割结果，高层和低层信息是必要的，这实际上由\
  \ U-Net++ (Zhou et al., 18) 完成。该网络的主路（即上采样和下采样）所示图 3。一系列卷积块用作编码器和解码器路径之间的跳跃连接。网络总共使用了\
  \ 21 个块，每个块由两个卷积层构建。六个卷积块使用单次填充和 `3 × 3` 的卷积核大小 (Gulshan et al., 2016)。除了每个编码器块后的最后一个卷积块外，最大池化操作通过\
  \ `2 × 2` 的过滤器大小和步长大小二执行。特征图尺寸在下采样轨道上从 64 增长到 2,048 (Zhou et al., 18)\n\n![Fig 3\
  \ 所提分割方法的架构。](img/fig5_3_C.jpg)\n\nFig 3 所提分割方法的架构。\n\n尺寸沿编码器路径从 `256 × 256` 减小到\
  \ `8 × 8`。五个卷积块 (Dalal & Triggs, 2005) 类型解码器路径，每个块后续允许一类上采样和拼接 (Felzenszwalb et\
  \ al., 2009)。横向上，解码器路径的特征图尺寸从 2048 减少到 64，图像尺寸从 `8 × 8` 增加到 `256 × 256`。解码器和编码器之间的压缩卷积块使用了并行填充。在编码器和解码器的最顶端使用了四个密集卷积块，在沿着网络滑动路径移动后，密集卷积块的数量减少了一个。水平路径中的每个块都通过跳跃连接进行起来\
  \ (Ying et al., 2013)。该块执行与解码器路径并行的上采样操作。前一个密集卷积块的输出在每个密层的每个卷积块之前，通过拼接操作，在微小的压缩卷积块之后，被加到上采样产物附近。密集块准确地汇合了编码器和解码器特征图，使其在语义上等同。该网络的主要关注点是极少假阴性申请的红色病变分割\
  \ (Felzenszwalb et al., 2008)。\n\n在上述图中，`W^(ij)` 代表对应块的输出，`w^(ij)` 是其输出，其中 `i` 代表沿解码器的下行块，`j`\
  \ 表示带有跳跃连接的密集块。`j = 0` 的块获得输出，因为其先前的编码器块后续是最大池化。`j = 1` 的块收集来自最大池化之后的上一个编码器的输出。对于\
  \ `j > 1`，卷积块通过跳跃连接从上一个卷积块收集 `j` 个贡献，并从上采样之后的密层再收集一个贡献。结果是，每个块都获得了在其先前的块之后的特征图。在网格的最终阶段，特征图是通过输入图像在网络所有可能的路径中广播后创建的，如公式\
  \ (1), (2) 所示 (Liu et al., 2016; Jiang et al., 2022)。\n\n```\nw^(ij) = Γ({w^(i,\
  \ j-1)}) for j=0, i>0\n```\n```\nw^(ij) = Γ([w^(i, k)]) + μ(w^(i, j-1)) for i, j>0\n\
  ```\nΓ 代表复合，`{}` 代表最大池化，`[]` 代表拼接，`μ` 代表上采样。\n\nRes-Net-18 (Ou et al., 2019) 通常被用于图像分类。Res-Net\
  \ (Ou et al., 2019) 专门用于图像中不含红色病变的红色划痕子图像分类。已经看到 `80 × 80` 是该网络使用的最佳子图像尺寸。Res-Net\
  \ 架构由 18 层卷积层组成，卷积层大小为 `3 × 3`。在下行路径上，从 64 增加到 512。Res-Net 的后一层是全连接的。在每个编码器块除了第一个层外，都使用了跳跃连接\
  \ (Ou et al., 2019) 所提的残差块如公式 (3) (4) 所示：\n\n![Fig 4 残差块。](img/fig5_3.jpg)\n\nFig\
  \ 4 残差块。\n\n```\nH(x) = F(x) + x\n```\n```\nF(x) = H(x) - x\n```\n这里，`x` 和 `H(x)`\
  \ 分别代表输入和输出。\n\n网络从浅层学习如纹理、物体边缘、物体结构，从深层学习如语义和空间特征。观察到在 Res-Net (Dalal & Triggs,\
  \ 2005) 中，大部分丢失了低层特征。但残差块通过跳跃连接改进了输出。\n\n### 训练\n\nMESSIDOR 数据集 (Talukdar et al.,\
  \ 2023) 用于训练该网络。每幅图像被分为八部分，并调整大小为 `256 × 256`。ADAM (Kingma & Ba, 2014) 优化器用于训练网络，在\
  \ 1 到 50 个 epoch 内保持 `0.00001` 的学习率；然后，在 50 到 80 个 epoch 内学习率降低为 `0.000001`。评估网络时使用了\
  \ `80 × 80` 的尺寸尺寸。网络训练了最多 60 个 epoch。使用 `0.01` 的学习率和 `0.6` 的能量进行随机梯度下降 (SGD) (Ruder\
  \ et al., 2016)。也观察到每 15 个 epoch 后学习率减少 `0.0001`。\n\n### 数据库描述\n\n在训练过程中，使用了 MESSIDOR\
  \ 数据集 (Talukdar et al., 2023)，它在互联网上广泛可用。网络来自抓取。MESSIDOR 数据集 (Talukdar et al., 2023)\
  \ 总共有 1200 张彩色眼底图像。这些图像是用无散瞳相机以 45 度视角拍摄的。图像尺寸为 `1440 × 960`、`2240 × 1488` 或 `2304\
  \ × 1536` 像素。在 1200 张图像之外，有 742 张属于 DR 的 1、2、3 级分组。网络仅使用了 572 张图像，170 个用于验证结果。\n\
  \n\n\n\n\n`DIARETDB1` 数据集 (Kälviäinen & Uusitalo, 2007) 总共有 89 张眼部彩色眼底图像。在 89 张图像中，有\
  \ 84 张包含至少一种无性性或非增殖性糖尿病视网膜病变，其余 5 张是正常的健康图像。这些照片是使用 50 度视角拍摄的。四位专业医生对公开的 `DIARETDB1`\
  \ 真值进行了标注，因此它被用于糖尿病视网膜检测。在这项工作中，在眼科医的指导下，重新定义了红色病变的边界。\n\n## 结果与讨论\n\n### 指标\n\n\
  所提网络的作用和对立系统通过等式 (5–9) 中给出的灵敏度、准确率、精确率、特异性和 F1 分数等传统指标进行估计。\n\n…(5) \n\n```\n\\\
  text{Sensitivity} = \\frac{TP}{TP + N}\n```\n\n…(6) \n\n```\n\\text{Specificity}\
  \ = \\frac{TN}{TN + FP}\n```\n\n…(7) \n\n```\n\\text{Accuracy} = \\frac{TP + TN}{TP\
  \ + TN + FP + FN}\n```\n\n…(8) \n\n```\n\\text{Precision} = \\frac{TP}{TP + FP}\n\
  ```\n\n…(9) \n\n```\n\\text{Precision} = \\frac{2TP}{2TP + FP + FN}\n```\n\n为了进行验证，连通分量级验证如下（Zhang\
  \ et al., 2011; Playout et al., 2019）。在图 5 中，红色和绿色轮廓显示了真值，表示未来方法预测的病变。在联合评估中，考虑连通分量中的真阳像素与真值之间的最小重叠比例\
  \ 0.2，而不是包含分类后的像素。如果重叠比例小于 0.2，则投影病变的非重叠部分可测量为假阳性像素。真值的非重叠部分被视为假阴性像素；松弛部分被测量为真阴性。特别是当红色病变边界未被识别时，使用模块级认证来评估常规指标。\n\
  \n![图 5 预测病变与真值的重叠。](img/fig5_5_C.jpg)\n\n图 5 预测病变与真值的重叠。\n\n### 分割结果\n\n为了评估计划网络的常规情况并与其他方法的结果进行比较，使用了\
  \ `DIARETDB1` (Kalviainen & Uusitalo, 2007) 数据集。在 89 张图像中，有 28 张用于预训练网络的微调，剩余的 61\
  \ 张图像用于报告结果。来自 `DIARETDB1` 的精确图像数量用于预训练，并报告了 `U-Net` (Oktay et al., 2018) 和 `attention\
  \ U-Net` (Oktay et al., 2018) 的结果。所提网络架构在灵敏度和精确率方面显示出显著的改进（表 2）。灵敏度提高到 8.87%，完成了\
  \ `U-Net` (Oktay et al., 2018)，精确率提高到 8.83%，高于 `attention U-Net` (Oktay et al.,\
  \ 2018)。\n\n表 2 红色病变分割的性能计算。\n\n| 使用的分割架构 | 灵敏度 | 特异性 | 准确率 | 精确率 | F1 分数 |\n| ---\
  \ | --- | --- | --- | --- | --- |\n| `U-Net` (Ronneberger et al., 2015) | 79.92\
  \ | 99.66 | 99.47 | 67.88 | 73.41 |\n| --- | --- | --- | --- | --- | --- |\n| `Attention\
  \ U-Net` (Oktay et al., 2018) | 85.10 | 99.61 | 99.49 | 62.67 | 72.17 |\n| `Multi-Task`\
  \ (Playout et al., 2019) | 87.79 | 99.88 | 99.83 | 78.95 | 81.94 |\n\n![图 7 预测病变与真值的重叠。](img/fig5_7.jpg)\n\
  \n图 7 预测病变与真值的重叠。(a), (d), (g); `U-Net` 的结果 (b), (e), (h); 以及所提方法的的结果 (c), (f),\
  \ (i)。\n\n![图 8 分割对比。](img/fig5_8.jpg)\n图 8\n\n## 结论\n\n所提系统有潜力协助眼科医生。该技术使用少量的图像来训练网络。因此，通过这些少的信息，该方法可以产生准确的结果。所建议的性能可以以少量的假阴性候选成功从眼底图中分割红色病变。在该技术中，假阳性的数量也减少了很多。尽管如此，仍需对网络进行深入的研究以减少假阳性和假阴性的数量。除了小型红色病变的分割外，还有改进预处理技术的可能性。本文未涉及新生血管的检测和分割，这是本工作的局限性。该方法可以以少量的假阳性有效分割微动脉瘤。这种低成本的建议方法可用于早期检测糖尿病视网膜病变\
  \ (DR)，从而可以防止由此导致的失明。这种计算机辅助诊断方法在眼科医生为 NPDR 患者做出决策时可能起着动态作用。\n\n## 参考文献\n\nAdal,\
