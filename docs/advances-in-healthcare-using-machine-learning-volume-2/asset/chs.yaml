  ## 糖尿病视网膜病变简介\n\n\n\n\n\n人口平均年龄正在上升，许多国家的成年人数量不断增加，且随着社会经济水平和生活理念的变化，非传染性疾病和残疾的发病率呈现不稳定趋势。成年居民的正常生活受到视力障碍或丧的严重影响。视力障碍患者往往生活痛苦，且劳动力市场参与率较低。视觉损伤和盲症\
  \ (Seoud et al., 2015) 伴随着较高的跌倒风险、更早进入护理的机会以及触觉缺失。总之，受人口增长影响，从感觉缺失到视力丧失的人数正在增加。各国之间视力问题的根源存在显著。因此，早产视网膜病变是工人国家的主要原因，而糖尿病视网膜病则是底层国家的主要原因。成年居民视力障碍的核心原因之一仍然未矫正的屈光不正。盲人数为。由于无法获得常规检查和治疗，近视、青光眼和白内障等眼病可能会恶化，使日常生活面临挑战。需要眼部修复的人应该能够获得治疗而不必遭受痛苦。慢性失明的主要原因是糖尿病视网膜病变、高血压、早产视网膜病变、维生素缺乏、年龄相关性黄斑变性\
  \ (`AMD`)、砂眼病和急性青光眼。年龄相关性失明和糖尿病导致的失明在全球范围内都在增长。\n\n世界上有超过 23 亿视力障碍者，其中数十亿人因为无法获得支持而被迫生活在危险或明显的情况下。在至少十亿病例中（约占这些病例的一半），视力流是可以避免的或被忽视的，这也是许多\
  \ 50 岁以上人群失明的主要原因 (Lancet Global Health, 2020)。图 1 显示了 1530 万例皮质白内障、350 万例急性青光眼、230\
  \ 万例屈光异常、180 万例 `AMD` 以及 86 万例患有 (Shaw et al., 2010) 糖尿病视网膜病变的病例。\n\n![Fig 1 失明的主要原因](img/fig5_1_C.jpg)\n\
  \n图 1 失明的主要原因。](#ch5.xhtml#R_fig_1)\n\n糖尿病视网膜病变是最常见的视网膜疾病，也是最严重的眼睛疾病之一 (Sivamasundari\
  \ & Niranjana, 2023)。它是全球视力丧失的主要原因 (Anjana, R.M. et al., 2011)。此外，表 1 展示了世界卫生组织（WHO）六个地区盲人的分布，按障碍总数（单位：百万）统计\
