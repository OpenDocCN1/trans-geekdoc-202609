  \ 0.014 |\n| 16 | 96.50 | 93.80 | 3.20 | 0.100 | 0.028 |\n\n\n\n\n对跳跃连接（skip connections）的分析进一步强调了它们在增强分割性能方面的关键作用。跳跃连接能够整合低层空间细节与高层语义属性，允许模型在编码和解码过程中保留重要的细节。结果显示，跳跃连接的数量与分割准确率之间存在显著相关性，三个跳跃连接产生了最佳的整体性能（`DSC`\
  \ 为 97.20%，`HD` 为 2.62 mm，`ASSD` 为 0.014 mm）。这些发现表明，浅层与深层特征融合之间的最佳平衡会导致更准确的分割结果。`DiNA`机制的引入被证明对提高模型学习和利用局部上下文特征的能力非常有效。通过关注邻近区域，`NA`模块与标准的自注意力机制相比，增强了特征区分能力并带来了更准确的分割。使用\
  \ `DiNA` 的改进结果（`DSC` 为 97.20%，`Jaccard` 为 94.92%）凸显了在医学图像分割任务中专门针对局部上下文注意力机制的重要性，在这些任务中，详细且精确的分割至关重要。\n\
  \n对批大小（batch size）和训练轮数（epochs）的消融实验提供了关于训练过程的进一步见解。较批大小虽然计算密集，但产生了更好的梯度更新并提高了分割准确率。此外，训练\
  \ 75 个 epoch 在学习和过拟合之间提供了最佳平衡，而在 100 个 epoch 时观察到收益递减。这强调了调整批大小和训练计划对于高效有效模型训练的重要性。将\
  \ `EDiNA-UNet` 与现有的先进模型如 `UNet`、`UNet++`、`Multi ResUNet`、`AttentionUNet` 和 `SwinUNet`\
  \ 相比，该模型在所有性能指标上均优于这些方法。具体而言，`EDiNA-UNet` 实现了最高的 97.20% `DSC` 和最低的 2.62 mm `HD`，展示了其以卓越的精度精确分割医学图像的能力。多个创新组件——自适应扩张、跳跃连接和邻域注意力（Neighborhood\
  \ Attention）——的整合对这一性能做出了巨大贡献，使 `EDiNA-UNet` 成为解决医学图像分割挑战的复杂解决方案。\n\n尽管取得了这些积极结果，但仍存在局限性。由于注意力机制和自适应特征，该模型的计算需求比简单的架构更高。这在计算资源有限的环境中部署时可能会带来挑战。为了进一步增强\
  \ `EDiNAUNet`，未来的工作可以探索集成 `Dynamic Sparse Attention`，它选择性地关注最相关的空间特征，在保持分割准确率的同时显著减少计算开销。这种方法可以优化内存使用和推理速度，增强模型对实时应用和资源受限环境的适用性。此外，为了提高泛化和鲁棒性，应该在\
  \ `LiTS` 之外的多种医学图像数据集对 `EDiNA-UNet` 进行评估，包括多器官分割和不同的成像模态。在具有不同噪声水平、对比变化和分辨率的数据集上进行测试将有助于理解模型的适应性，并确保更广泛的临床适用性。`EDiNA-UNet`\
  \ 的成功为医学图像分割的进一步发展创造了新机会，特别是在基于注意力的模型和自适应特征提取领域。\n\n## Conclusion\n\n`EDiNA-UNet`\
  \ 通过结合自适应扩张、跳跃连接和 `DiNA` 机制，为医学图像分割引入了一种新方法。通过大量实验，该架构已证明其在多个指标上实现卓越性能的效果，包括 `DSC`、`Jaccard\
  \ Index`、`HD`、`RVD` 和 `ASSD`。改进在边界精度和复杂解剖结构的分割上尤为明显。消融实验进一步强调了自适应扩张和优化跳跃连接的重要性，这对模型的准确性和鲁棒性贡献巨大。与现有模型如\
  \ `UNet`、`UNet++`、`Multi ResUNet` 和 `SwinUNet` 相比，尽管模型具有这些优势，但其中等的复杂性可能会给计算资源有限的环境带来挑战。未来的研究可以探索在保持分割准确率的同时提高效率的方法，可能通过模型压缩或更轻级的注意力机制。总体而言，`EDiNA-UNet`\
  \ 医学图像分割领域取得了进展，为医学成像中基于注意力模型的发展铺定了道路。\n\n## References\n\n*   Alzubaidi, L., Zhang,\
