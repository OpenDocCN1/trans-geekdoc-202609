  \ (pp. 3–11)。Springer International Publishing.\n\n# 6 用于 CT 图像肝脏分割的 EDiNA-UNet\n\
  \nKumar S.S.\n\n## 用于 CT 图像肝脏分割的 EDiNA-UNet\n\n## 引言\n\n在 CT 图像中进行肝脏分割是诊断成像中的关键一步，对于诊断相关疾病、规划治疗和支持手术程序起着至关作用\
  \ ([Elmpt & Landry, 2018])。肝瘤、硬化和其他肝脏病变需要精确的分割以确保准确的评估、手术规划和随访。放射科医生的人工分割虽然准确，但耗费大量人力，且受个人水平的影响。\n\
  \n因此，需要能够在各种临床环境中提供可靠、准确且可重复结果的自动分割技术。然而，肝脏分割面临许多挑战。肝脏的解剖结构复杂，具有不规则的形状、多变的纹理，并邻近胃、肾脏和肺，这使得边界变得困难\
  \ ([Kumar et al., 2013])。此外，肝瘤的外观在尺寸、形状和位置上存在差异，进一步增加了分割的难度。硬化等病理的存在改变了肝脏纹理，增加了额外的复杂性。因此，分割模型必须对这些变化具有韧性，同时确保高准确性。\n\
  \n机器学习，特别是深度学习的最新进展改变了医学图像分割 ([Kumar & Vinod Kumar, 2024])。卷积神经网络 (`CNNs`) 是这些进展的关键催化剂，归功于它们通过分层卷积进行图像特征提取的有效性。`U-Net`\
  \ ([Ronneberger et al., 2015]) 是医学图像分割领域著名的 `CNN` 架构之一，以其编码器-解码器结构而称，可以通过跳跃连接精确捕捉局部和全局特征。`U-Net`\
  \ 及其变体已成为基础模型，在各种医学任务中取得了良好的性能。\n\n虽然 `CNN` 显著提高了分割准确性，但在捕捉全局上下文信息方面存在限制。`CNN` 使用固定大小的感受野难以处理长程依赖和复杂的边界，特别是在肝脏等形状和纹理在患者之间差异巨大的器官上。已经提出了几种方法（如空洞卷积和金字塔池化）通过扩大感受野来解决这个问题，但它们在捕捉图像完整全局上下文方面仍显不足。\n\
  \n\n\n\n过去几年中，基于 Transformer 模型由于其利用自注意力机制建模长程依赖的有效性，在计算机视觉领域脱颖而出。Transformer 最初用于自然语言处理（NLP）领域，现已被有效地应用于视觉任务，催生了如\
  \ Vision Transformer (ViT) (Dosovitskiy et al., 2020) 等架构。`ViT` 通过将图像分为一系列补丁（patches）来处理图像，应用注意力机制捕捉整个图像的全局上下文。然而，尽管在分类任务中取得了成功，纯\
  \ Transformer 模型在分割等密集预测任务中面临挑战，因为这些任务对细粒度细节和局部信息非常关键。\n\n结合 CNN 和 Transformer 优势的混合模型证明是解决两种方法局限性的一种前景方法。这些方法利用了\
  \ CNN 的局部特征提取能力，同时利用 Transformer 获取全局上下文和长程依赖。该方法在增强分割模型性能方面展现出巨大潜力，特别是在肝脏分割等复杂任务中。\n\
  \n通过在 U-Net 架构中集成 Transformer 块 (Wei et al., 2023; Hatamizadeh et al., 2021)，该模型旨在高效收集细粒度的局部细节和更广泛的全局上下文，解决了纯\
  \ CNN 或基于 Transformer 模型的限制。在此基础上，本章引入了增强型扩张邻域注意力网络（EDiNA-UNet），这是一种专门为肝脏分割设计的新型混合模型。`EDiNA-UNet`\
  \ 结合了一种自适应扩张调度机制，动态调整网络内的扩张率，允许更有效地捕捉局部细节和全局上下文。这一创新提升了分割准确率，在 LiTS 数据集上达到了 97.2%\
  \ 的 Dice 相似系数 (DSC)。除了 DSC 之外，`EDiNA-UNet` 在其他关键评估指标上也取得了优异，包括相对体积差 (RVD)、Jaccard\
  \ 指数、豪斯夫距离 (HD) 和平均对称表面距离 (ASSD)。这些指标进一步验证了该模型在分割肝脏结构方面的稳健性和准确性。\n\n`EDiNA-UNet`\
  \ 的主要贡献有三点：\n\n-   **自适应扩张邻域注意力 (ADiNA)：** 与现有使用固定注意力窗口或全局注意力的 Transformer 模型不同，`EDiNA-UNet`\
  \ 引入了具有动态调整扩张因子的 `DiNA` 块。这使得模型能够根据特征复杂度定制感受野，与静态方法相比，改进了对变化的解剖结构的分割效果。\n\n-   **平衡的局部-全局特征捕捉：**\
  \ 基于 CNN 的模型擅长局部细节但在长程依赖方面表现困难，而纯 Transformer 以牺牲计算效率为代价优先考虑全局上下文，`EDiNA-UNet` 集成了两者的优势。其自适应扩张确保了高效捕捉细微细节（如肝脏边缘）和全局上下文（如器官关系）。\n\
  -   **计算效率：** 通过将注意力限制在扩张邻域而非整个图像，`EDiNA-UNet` 降低了 `ViT` 等全局注意力模型的计算复杂度，与资源密集型方案相比，它在医学影像应用中更具性。\n\
  \n现有方法通常在局部精度和全局感知之间权衡，或者产生高昂计算成本。例如，`U-Net` 变体缺乏长程依赖机制，而 Transformer 模型要么忽略了细微细节，要么需要过多的资源。`EDiNA-UNet`\
  \ 通过一种可扩展、高效的架构填补了这些空白，能够适应肝脏分割任务的需求。\n\n本章结构如下：第 2 节对医学分割领域的研究进行了深入回顾，重点讨论了 CNN、Transformer\
  \ 模型和混合架构。第 3 节详细介绍了本研究采用的方法，包括数据集、预处理技术、`EDiNA-UNet` 架构以及实现策略。第 4 节给评估结果，展示了更新后的指标、消融实验和可视化。第\
  \ 5 节探讨了发现的意义以及所提方法的新颖性，第 6 节以未来研究的建议结束。\n\n## 文献综述\n\nCNN (Alzubaidi et al., 2021)\
  \ 一直一直是医学分割进展的基础，使自动分割任务取得了突破性进展。CNN 最初通过全卷积网络 (FCNs) (Long et al., 2015) 被引入像素级预测，该网络通过用卷积层取代全连接层，实现了密集的端到端学习。这种架构为后续医学影像中的基于\
  \ CNN 模型奠定了基础，特别是在对准确勾勒至关重要的分割任务中。\n\n该领域中影响最大的架构之一是 `U-Net` (Ronneberger et al.,\
  \ 2015)，它引入了独特的编码器-解码器架构，并具有跳跃连接（skip connections），能够恢复编码阶段丢失的空间细节。这些跳跃连接允许解码器将高级抽象特征与低级空间细节相结合，从而获得更准确的分割。`U-Net`\
  \ 已成为医学图像分割任务的标准，其在处理小数据集方面的有效性以及优异的性能备受推崇。已引入多种 `U-Net` 变体以增强原始架构。`U-Net++` (Zhou\
  \ et al., 2015) 引入了嵌套跳跃路径，精炼了特征融合过程并提升了分割性能，特别是在结构复杂的图像上。同样，Multi ResUNet (Ibtehaz\
  \ & Rahman, 2019) 整合了多分辨率融合，使模型能够同时捕捉多个层面的特征，从而获得更稳健的分割。Attention U-Net (Oktay et\
  \ al., 2019) 采取了不同的方法，通过集成注意力机制在勾勒过程中强调最相关的特征，进一步提高了难以分割区域的准确性。Lv et al. (2022))\
  \ 引入了改进的 ResU-Net，将传统的卷积模块替换为残差模块以增强特征学习；而 Manjunath and Kwadiki (2022)) 提出了改进的\
  \ ResUNet，它是 `U-Net` 和 `ResNet` 的混合体，用残差块取代标准卷积块以简化 CNN 训练。\n\n\n\n\n尽管有了这些进展，CNN\
  \ 仍然面临一个重大的局限：固定的感受野。这限制了它们捕捉远距离依赖的能力，而这对于分割肝脏等复杂结构至关重要。空洞卷积 (Yu et al., 2015) 等技术的引入是为了在保持分辨率的同时增大感受野，而金字塔池化结构\
  \ (Zhao et al., 2017) 有助于在多尺度上聚合上下文信息。然而，这些方法仍然无法满足更复杂的分割任务所需的全局上下文。Lei et al. (2022)\
  \ 引入了可变形编码器-解码器网络 (`DefED-Net`)，它结合了可变形卷积和 `Ladder-ASPP` 模块。这种设计实现了空间信息的自适应组织以及各种尺度上下文细节的提取。可变形卷积允许网络灵活地修改卷积核，而与传统的空洞空间金字塔池化相比，`Ladder-ASPP`\
  \ 模块改进了上下文学习，特别是在 CT 勾勒方面。\n\nTransformer 最初由 Vaswani et al. (2017) 提出，已成为计算机视觉任务的强大框架，包括医学图像分割。Transformer\
  \ 利用自注意力机制能够对远距离依赖进行建模，这是 CNN 难以实现的。ViT (Dosovitskiy et al., 2020) 是第一个将 Transformer\
  \ 应用图像处理的模型，通过将图像表示为 patch 序列，使模型能够捕捉整个图像的全局上下文。这种从局部到全局特征学习的转变对于需要对图像进行整体理解的任务（包括肝脏分割）特别有利。然而，ViT\
  \ 的计算复杂度很高，特别是对于包括分割在密集预测任务，而且由于缺乏对局部特征的固有归纳偏，与基于 CNN 的模型相比，其在捕捉复杂细节方面的效果通常较弱。\n\
  \n为了解决这些局限性，研究者提出了许多基于 Transformer 的模型。Swin Transformer (Liu et al., 2021) 引入了一种结构化的基于窗口的注意力机制，将图像划分为不重叠的窗口，允许更高效的计算并更好地保留局部信息。LeViT\
  \ (Ben et al., 2021) 通过减少计算开销进一步优化了 transformer 模型，使其适用于实时应用。Wei et al. (2023) 开发了\
  \ `HRSTNet`，用 transformer 块替换了卷积层，以促进不同分辨率特征图之间的无缝流。尽管这些改进，纯 transformer 模型在分割中仍面临挑战，即平衡全局上下文与细节。整合\
  \ CNN 和 transformer 的混合模型成为了一种前景良好的解决方案，结合了两种架构的优点。这些模型利用 CNN 捕捉细粒度特征，同时利用 transformer\
  \ 模型建模远距离依赖。TransUNet (Jieneng et al., 2021) 将 transformer 编码器与 CNN 解码器配，transformer\
  \ 获取全局上下文，CNN 完善局部细节。Swin-Unet (Hu et al., 2023) 使用 Swin Transformer 块重构了整个 U-Net\
  \ 架构，高效提取全局和局部细节。Hatamizadeh et al. (2021) 引入了集成 Transformer 技术 (`UNeTr`)，通过跳跃连接连接编码器和解码器，促进了统一的语义分割框架。Li\
  \ et al. (2023) 开发了 `RDCTransUNet`，一种结合了带有分组卷积的 `ResNeXt50` 变体，展示了残差学习与先进组件的协同作用。Qi\
  \ et al. (2024 提出了 `AD-DUNet`，一种使用 `Axial Transformers` 处理远距离依赖并使用级联空洞卷积进行局部特征提取的双分支设计。Ou\
  \ et al. (2024) 开发了 `ResTransUNet`，专注于在编码过程中最大化特征捕捉。Ren et al. (2025) 引入了 `LGMA-Net`，利用来自脉冲神经系统的\
  \ `SNP` 卷积块独特地捕捉全局和局部上下文。\n\n进一步的创新增强了混合方法。Chen et al. (2023) 引入了 `DRAUNet`，一种基于深度残差注意力的\
  \ U-Net，结合了通道和空间注意力 (`DAM`) 以增强特征依赖关系并强调相关区域。Liu et al. (2023) 引入了 `GCHA-Net`，采用全局注意力模块\
  \ (`GAM`) 处理远距离关系，以及局部注意力模块 (`LAM`) 专注于肝脏区域。Wang et al. (2021) 提出了 `SAR-U-Net`，在每个编码卷积层后应用挤压激励\
  \ (`SE`) 块以重新校准通道特征响应。Cao and Cheng (2025) 提出了 `SACU-Net`，一种形状感知 U-Net，通过重新设计的跳跃路径整合空间-通道注意力来桥接编码器和解码器之间特征表示的差异。Xia\
  \ et al. (2024) 开发了一种多视图融合方法，使用双边自注意力 (`DSA`) 捕捉跨 2D 切片的远距离依赖，处理空间和通道。\n\n为了应对数据不足等特定挑战，He\
  \ et al. (2022) 引入了一种改进的基于 GAN 的 3D U-Net，在生成对抗网络 (`GANs`) 中集成了半监督优化算法。Wei et al.\
  \ (2021) 提出了 `GAN Mask-CNN`，将 `GANs` 与 `Mask R-CNN` 集，使用 `GANs` 处理噪声特征并使用 k-means\
  \ 聚类方法优化锚点选择。Li et al. (2023) 开发了 `Eres-UNet++`，一种基于 `Res-UNet++` 的深度监督网络，使用残差块改进特征提取并解决肝脏图像中的边界模糊问题。Devidas\
  \ et al. (2023) 开发了 `LiM-Net`，利用 2Net 骨干的多级、多尺度特征提取以及密集跳跃连接来增强特征融合。Tinglan et al.\
  \ (2025) 引入了 `DEMF-Net`，在跳跃连接中引入多尺度特征融合 (`MSFF`) 模块以捕捉全局特征，而 Qian et al. (2024)\
  \ 提出了 `UNet_sharp`，结合密集和全尺度跳跃连接以实现多尺度特征合并。\n\n本章在这些进展的基础上，特别是基于 Dilated Neighborhood\
  \ Attention Transformer (Ali & Humphrey, 2022)，引入了 `EDi-UNet`。提出的模型包含了一种自适应空洞调度机制，动态调整扩张率以改进对局部细节和全局上下文的捕捉。这种创新允许更准确的肝脏分割，解决了由疑似区域和复杂肝脏解剖带来的挑战。\n\
  \n## 方法论\n\n提出的方法使用 `LiTS` 数据集评估了用于肝脏区域提取的 `EDi-UNet` 架构。本节详细介绍了使用数据集、处理步骤以及 `EDi-UNet`\
  \ 模型的架构，包括 transformer 块中新的自适应空洞调度。\n\n## 数据集\n\n\n\n\n本研究使用的 LiTS 数据集 (Bilic et\
  \ al., 2023) 是一种广泛认可的基准数据集，常用于 ISBI 2017 和 MICCAI 2017 等医学图像分割挑战。它包含 131 张腹部 CT\
  \ 图像，每张图像都配有专家标注的肝脏掩码，为肝脏分割任务提供了丰富的数据源。数据集包含了来自不同机构的扫描，确保了成像方案、肝脏形态和肿瘤外观的多样性，这有助于其在模型开发中的通用性。数据集总共包含\
  \ 58,014 张横断面 CT 切片，每张分辨率为 512 × 512 像素。每个卷的切片数量差异很大，范围从 42 到 1,026 张，为模型训练和测试提供了大型且多样化的数据集。面内体素分辨率在\
  \ 0.55 mm 到 1.0 mm 之间，层间距在 0.45 mm 到 6.0 mm 之间，确保了数据集能够捕捉详细且多样的肝脏结构。\n\n为了本研究，数据集被分为三个子集：训练集、验证集和测试集。训练组包含\
  \ 91 个病例，总共 29,775 张切片；验证集包含 10 个病例，总共 3,602 张切片；测试集包含 20 个病例，14,854 张切片。这种划分确保了对模型性能的稳健评估。LiTS\
  \ 数据集的多样性和丰富性使得模型能够泛泛适用于不同的成像方案、肝脏形态和肿瘤结构，使其医学领域分割任务的理想选择。\n\n### 数据预处理\n\n为了给模型训练预处理数据集，使用了基于\
  \ Dilated-UNet 方法的预处理流水线。预处理的目标是隔离肝脏感兴趣区域、归一化图像强度并对图像进行重采样以实现高效计算，同时保留关键的解剖细节。该流水线采用了几个步骤来实现这些目标。\n\
  \n第一步涉及亨斯菲德单位（HU）裁剪。CT 扫描中的 HU 值被裁剪在 –200 到 200 的范围内。此过程旨在排除无关的结构，如骨骼 (`HU > 400`)\
  \ 和空气 (`HU < – 1000`)，主要关注肝脏区域，肝脏通常落在 50–70 的 HU 范围内。通过收窄 HU 范围，模型可以集中在感兴趣区域，有助于更准确的分割。接下来，对像素强度进行了归一化。使用最小最大值归一化将强度归一化到\
  \ –1 到 1 的范围。这确保了数据集中所有图像强度值一致，使模型能够从标准化数据中提取信息。归一化对于提高模型性能至关重要，因为它减少了由于不同来源扫描之间强度水平引起的变异。预处理的最后一步是重采样。使用双线性插值将每张\
  \ 512 × 512 CT 切片下采样到 256 × 256 分辨率。重采样减少了训练所需的计算负载，同时没有损害对准确分割至关重要的解剖特征。\n\n没有应用任何额外的数据增强方法（包括旋转和翻转），因为\
  \ LiTS 数据集在肝脏形状和成像方案方面本身包含高度的多样性。数据集的多样性保证了模型在训练过程中会遇到广泛的变化，减少了对增强的需求。\n\n### EDi\
  \ NA-UNet 架构\n\nEDiNA-UNet 是一种专为医学图像分析（如肝脏分割）定制的高级分割模型。该模型通过集成基于 的注意力机制与扩张邻域注意力（dilated\
  \ neighborhood attention），增强了传统的 U-Net，提升了网络高效捕捉细粒度局部细节和广泛全局上下文特征的能力。EDiNA-UNet\
  \ 架构构建在分层编码器-解码器框架上，如图 1\n\n图 1 EDiNA-UNet 架构，包含编码器、瓶颈层、解码器和跳跃连接。⏎\n\nDiNA 机制不同于传统的\
  \ transformer，后注意力机制通常在整个输入上全局运行。相反，DiNA 将注意力限制在局部区域或邻域。这种局部邻域注意力结合扩张操作，在扩大感受野的同时保持了计算效率。此外，扩张因子决定了注意力期间考虑的邻域大小，并在网络的不同深度自适应调整。这确保了模型能够调整其感受野以适应所遇特征的复杂性和规模，允许更有效的特征学习和分割。通过引入自适应扩张并利用\
  \ transformer 的注意力学习能力，EDiNA-UNet 可以有效应对医学图像中器官和肿瘤形状、大小和位置的变化。\n\nEDiNA-UNet 中的编码器从不同尺度从输入图像提取特征表示，同时逐步降低空间分辨率。它由以下阶段组成：块嵌入与位置编码、扩张邻域注意力块和邻域聚合。\n\
  \n过程从块嵌入和位置编码开始。预处理后的输入图像（通常是 2D CT 切片，例如 256 × 256 像素）被分解为不重叠的块（例如 4 × 4 像素）。每个块通过展平转换为向量，然后发送到嵌入层，该层将其转换为高维特征表示，允许模型在块级别处理图像信息。为了确保模型保留空间上下文，位置编码被整合到块嵌入中。位置编码保留了医学图像的空间结构，使模型能够理解每个块在图像中的位置。这确保了块的相对位置被编码和学习，这是使用\
  \ transformer 进行有效医学图像分割的关键步骤。\n\n\n\n\n在编码器中，每个阶段都利用 `DiNA` 块，该块的设计是将注意力机制聚焦在每个\
  \ patch 周围的限制局部区域内。与传统的 Transformer 模型不同（后者的注意力是在整个图像上全局运行的），`DiNA` 块将注意力限制在每个 patch\
  \ 周围较小的预定义区域内。这种局部注意力使得模型能够捕捉图像中相邻区域之间复杂的空间关系，这对于医学图像分割任务特别有价值。通过聚焦于较小的局部区域，模型可以更好地保留细粒度的空间细节，这对于准确分割复杂结构至关重要。注意力机制本质上学习了局部邻域内不同区域是如何连接的，以及它们是如何相互影响的，从而确保重要特征的提取和保留。所提模型中的\
  \ `DiNA` 块所示图 2。\n\n![Fig. 2 DiNA Transformer blocks.](img/fig6_2_B.jpg)\n\n图 2\
  \ DiNA Transformer 块。](#ch6.xhtml#R_fig6_2)\n\n然而，虽然局部注意力对于保留细节至关重要，但它可能无法捕捉理解较大的解剖结构或图像内远程关系所需的广泛背景。为了解决这一局限性，扩张注意力（Dilated\
  \ Attention）被集成到 `EDiNA` 块中。这种方法通过引入扩张因子将邻域注意力扩展到直接相邻 patch 之外。扩张通过跳过中间的某些 patch\
  \ 来工作，有效地扩大了感受野。这种扩张注意力机制允许模型同时关注详细的局部特征和更广泛的上下文信息（如周围的器官组织）。通过在网络的不同深度处改变扩张率，模型可以适应所学习特征的复杂性，确保它既能捕捉到小的细节结构，又能捕捉到更大、更复杂的解剖上下文。\n\
  \n`EDiNA` 块中局部注意力和扩张注意力的整合对于医学图像分割而言尤为强大。它使模型能够在对详细空间准确性的需求与理解这些细节所处的广泛背景的需求之间平衡。例如，在分割肝脏时，模型可以关注肝脏边缘的精细细节，同时考虑周围的肝脏组织及其与其他附近结构之间的关系。这种双层注意力机制实现了更精确且具有感知感知能力的分割，提高了模型在处理医学成像数据复杂性方面的整体性能。扩张因子\
  \ `δ` 根据特征图的复杂性在编码器的各个层中进行动态调整。编码器通过块合并（patch merging）或下采样操作逐渐减少特征图的空间维度。在每个阶段，空间分辨率减半（例如从\
  \ 256 × 256 减到 128 × 128），而特征维度增加。这允许模型在高分辨率处捕捉低级细节，在低分辨率处捕捉抽象特征，对于准确分割不同尺寸的器官和病变非常重要。\n\
  \n`DiNA` 块是 `EDiNA-UNet` 架构的核心创新，它结合了基于 Transformer 的自注意力优势与通过扩张实现的局部上下文建模。该块通过将注意力机制限制在每个\
  \ patch 周围的邻域，然后应用扩张来扩大邻域的大小同时降低计算复杂度。自注意力机制计算查询 patch 与相邻 patch 之间的注意力得分。通过应用扩张，感受野得到扩大，允许模型在不需要计算开销巨大的全局注意力的情况下，同时学习短程和远程关系。带有扩张的注意力计算可以表示：\n\
  \n...(1)  \n\n```\n$${DiNA}(Q,{K},{V};\\\\delta) = {soft}\\\\max\\\\left( \\frac{QK^{T}}{\\\
  \\sqrt{d\\_{k}}} + M\\\\_{\\delta} \\\\right)V$$\n```\n\n其中：\n\n* `Q` 代表查询矩阵（对应输入\
  \ patch）。\n* `K` 和 `V` 表示键矩阵和值矩阵。\n* `M[δ]` 是扩张掩码，控制哪些 patch 被认为在扩张邻域内。\n* `δ` 是扩张因子，控制邻域内\
  \ patch 之间的间距。\n\n`DiNA` 块聚焦于每个 patch 周围的预定义区域，确保模型关注局部空间依赖关系。扩张允许这些局部邻域增长，确保模型能够从遥远但相关的区域聚合信息，这对于解剖结构通常相互连接的医学图像分割至关重要。\n\
  \n`EDiNA-UNet` 中的扩张因子是自适应的，这意味着它根据网络层级和处理的特征表示的复杂性而变化。早期层关注扩张极微的较小邻域，以捕捉局部像素级细节，而深层则使用较大的扩张因子来捕捉更多的全局信息。自适应扩张调度由以下关系控制：\n\
  \n...(2)  \n\n```\n$$\\delta\\\\_{l} = \\\\delta\\\\_{\\text{base}} + \\\\beta\\\
  \\frac{l}{L}f\\\\_{\\text{complexity}}\\\\left( F\\\\_{l} \\\\right)$$\n```\n\n\
  其中：\n\n* `δ[base]` 是基础扩张因子。\n* `β` 是一个缩放因子，控制扩张因子随深度增加的速率。\n* `l` 是当前层的索引。\n* `L`\
  \ 代表总层数。\n* `f[complexity]` 是一个复杂性函数，根据特征图 `F[l]` 的方差或复杂性调整扩张。\n\n这种动态扩张允许模型在处理更深层时逐渐增加其感受野，确保捕捉精细和粗糙的图像细节以进行准确分割。在空间维度最小的瓶颈层（bottleneck\
  \ layer），`EDiNA-UNet` 捕捉图像最抽象和高级的表示。应用多个具有高扩张因子的 `DiNA` 块，确保模型捕捉图像遥远区域之间的远程依赖。这对于医学成像特别重要，因为准确的分割既需要局部精度和全局上下文感知。\n\
  \n解码器镜像编码器，但执行相反的任务：对特征图进行上采样以在原始分辨率重建分割掩码。解码器由以下组件组成：块扩展（Patch Expansion）、跳跃连接（Skip\
  \ Connections）和 `DiNA` 块。解码器通过逐步将 patch 扩展回原始大小来反转采样过程。这是通过转置卷积或插值技术实现的，增加了每个阶段的空间分辨率。连接相关编码器层和解码器的跳跃连接确保了在解码过程中保留了高级上下文信息和低级细节。这些连接对于维持医学图像分割中准确边界划分所需的细粒度空间细节至关重要。解码器还使用了扩张因子逐渐减小的\
  \ `DiNA` 块。与编码器中扩张增加以捕捉全局上下文的情况相反，解码器侧重于随着空间分辨率增加而精炼局部细节。\n\n解码器的最后一层产生原始输入分辨率（256\
  \ × 256 像素）的分割图。`sigmoid` 函数用于二分类分割任务（例如肝脏分割）。输出是一个像素级预测图，其中每个像素都被识别为属于特定类别（例如肝脏或背景）。\n\
  \n## 实现\n\n\n\n\nEDiNA-UNet 采用 `Python` 和 `TensorFlow` 深度学习库执行。为了提高计算效率和可扩展性，模型在\
  \ `Google Compute Engine` 后端进行训练和评估，利用了 `T4 GPU`，这提供了一个高效且强大的硬件环境，确保了稳健的训练性能。模型开发和验证的本地环境由一个\
  \ `11th Gen Intel® Core™ i5–1135G7` 处理器（主频为 `2.40 GHz`）配合 `16 GB` 内存组成，并在 `Windows\
  \ 11` 上运行。该开发环境用于配置模型参数、初始调试并确保在云端基础设施上训练之前平稳运行。对于模型的优化和学习过程，采用了 `Dice Loss` 函数作为主要目标函数，以评估生成的分割掩码与地面真值标签（ground\
  \ truth labels）之间的交集情况。该指标特别适用于图像分割任务，有助于确保准确的区域界定，特别是在分割 CT 扫描中的肝等复杂解剖结构时。\n\n\
  为了增强模型性能并降低 `Dice Loss`，使用的优化器为 `Adam`，初始学习率为 `0.0001`。该优化器的自适应学习率和基于动量的策略促进了整个训练过程中高效且平滑的收敛。为了进一步解决过拟合风险并改进收敛，EDiNA-UNet\
  \ 集成了动态调整学习率的方法和早停机制。学习率使用名为 `ReduceLROnPlateau` 的调度器进行自适应调整，如果 `validation loss`\
  \ 在连续四个轮次（epochs）内没有改进，则以 `0.1` 的因子降低学习率。这使得模型即使在训练后期进展变缓时也能继续精炼其权重。此外，还实施了早停机制，当\
  \ `validation loss` 连续十个轮次未获提升时结束训练，有助于防止过拟合并增强对新数据的泛化能力。这些方法使模型能够在有效训练和泛化之间保持平衡，同时避免陷入局部最优解。\n\
  \n为了确定 EDiNA-UNet 的最优超参数，在 `LiTS` 数据集的子集上采用了结合 `grid search`（网格搜索）与 `5-fold cross-validation`（五折交叉验证）的系统方法。考虑的超参数包括初始学习率、批量大小以及\
  \ `ReduceLROnPlateau` 调度器的参数（例如 `patience` 和 `factor`），以及早停等待时间。`grid search` 探索了一范围数值：初始学习率\
  \ `[0.001, 0.0001, 0.00001]`、批量大小 `[4, 8, 16]`、`ReduceLROnPlateau` 等待时间 `[2, 4,\
  \ 6]` 以及早停等待时间 `[5, 10, 15]`。对于每种组合，模型均经过训练并以 `Dice Coefficient` 作为主要性能指标，同时监控 `validation\
  \ loss` 以确保泛化性。`5-fold cross-validation` 通过将数据分为五个子集确保稳健性，每折使用四部分进行训练，一部分进行验证，并对折输出取平均值以减轻数据划分带来的偏差。Table\
