  \n# 1 用于疾病诊断的机器学习方法：宫颈癌预测的案例研究\n\nSambit Ranjan Pattanayak^(¹)\n\nDOI: [10.1201/9781003716686-1](https://dx.doi.org/10.1201/9781003716686-1)\n\
  \n机器学习（`ML`）帮助医疗部门识别和预测疾病。通过检查庞大的医疗数据库寻找隐藏的趋势改变了疾病的诊断。每年有数百人死于宫颈癌。正确且准确的诊断决定了生活质量和治疗效果。宫颈癌死亡率和发病率的降低取决于准确性的提高和检测的加速。使用\
  \ `ML` 预测宫颈癌可能有助于改善医疗治疗并降低费用。传统诊断技术的低敏感性和低特异性可能导致延迟或误诊。本案例研究展示了 `ML` 如何改进宫颈癌的检测并减少错误。本文描述了基于存储在\
  \ UCIML 仓库中的宫颈癌疾病数据集的两部分实验。序列特征选择允许在数据集上评估多种 `ML` 方法。各种集成学习方法有助于增强实验的第一阶段。因此，我们使用相同的数据获得了更好的预测结果：`F1-score`\
  \ 为 `96.97%`、准确率为 `95.45%`、精确率为 `94.12%`、敏感性为 `100%`、特异性为 `92.85%`。最后，实证研究给出了 `AUC`\
  \ 值为 `0.982` 的 `ROC` 曲线。\n\n## 引言\n\n腺癌是女性中最常见的癌症，而妇科恶性肿瘤起源于女性生殖道。诊断出妇科恶性肿瘤的女性往往因这些致命且损害身体的疾病导致预期寿命缩短。宫颈癌是妇科癌症中最常见的形式，给全球女性带来了重大的健康挑战，特别是在贫困国家。其他妇科恶性肿瘤包括卵巢癌、阴道癌、外阴癌和子宫癌。人颈被一层非常薄的细胞结构层。当细胞变成恶性、迅速复制并最终形成肿瘤时，就会发生宫颈癌。各种妇科状况与不同癌症类型的增加有关。宫颈癌的早期迹之一是月经异常，可能表现为点滴、不规则、沉重感或其他非典型特征。研究人员进行了一项交叉研究以收集更多关于妇科恶性肿瘤的信息。宫颈癌影响生殖器官，是女性最常见的恶性肿瘤。它是女性死亡的第四大原因。宫颈癌主要归因于人乳瘤病毒（`HPV`）；然而，如果早期发现，它是可以管理的并能被有效检测和治疗\
  \ (Zhang et al., 2021; Conceição et al., 2019)。\n\n### 医疗领域的机器学习 (ML)\n\n机器学习正在通过提供先进的疾病检测、预后和治疗定制能力来改变医疗保健行业。`ML`\
  \ 技术可以发现传统分析方法忽略的大数据集中的趋势和关联。通常比人类放射学家更快，基于大量医学图像数据集的 `ML` 模型可以以惊人的准确率检测异常。这些模型提供的早期疾病检测（包括癌症）有助于极大改善患者预后。此外，`ML`\
  \ 应用结合了患者风险因素和治疗反应，允许医疗从业人员设计更定制、更高效的治疗计划来应对特殊需求 (Atoum et al., 2023; Sahu et al.,\
  \ 2023)。\n\n`ML` 通过更好的诊断、运营效率优化和成本降低来转变医疗环境。在 `ML` 的驱动下，预测分析能够准确预测医院资源管理、人员分配和患者入院率。很大归功于\
  \ `ML`，电子健康记录（`EHRs`）正在发生变化。对 `EHRs` 进行 `ML` 分析可能会揭示患者健康的有趣模式，改善预防性治疗的管理，并协助慢性疾病的管理。此外，一种称为自然语言处理（`NLP`）的机器学习分支正在帮助分析临床笔记并提取相关数据，从而增强患者护理。研究表明，在医疗、医学研究、患者治疗和通用系统效率中加入\
  \ `ML` 可以带来显著进展 (Pati et al., 2021, 2022)。\n\n### 用于宫颈癌诊断的机器学习\n\n`ML` 因其更准确、高效和早期的疾病检测能力已成为宫颈癌诊断的强有力武器——这改变了传统认知。`ML`\
  \ 算法可以发现在使用医学影像、病史和各种临床特征的人类临床医生可能忽略的趋势和联系。在筛查期间识别宫颈缺陷至关重要，深度学习（`DL`）、支持向量机（`SVMs`）和随机森林（`RFs`）在评估涂片测试和阴道镜图像等程序方面具有巨大的潜力\
  \ (Chen et al., 2013; Tanimu et al., 2022)。\n\n\n\n\n\n在宫颈癌诊断中，迫切需要通过 `ML` 个性化医疗方法。因此，药物的定制取决于每位患者的特定特征。集成学习（`EL`）方法从多个方面提高了稳健性和诊断准确性。将决策树的可解释性与神经网络的预测能力相结合，使集成技术能够同时获得极准确性和有意义的分析。此外，`ML`\
  \ 模型可以根据新数据不断训练并调整其行为，从而增强其有效性，并确保与医学研究的最新进展保持同步。在宫颈癌方面，这种适应性非常有益，因为成功的治疗和更高的生存率取决于精确且快速的诊断。医疗专业人员和\
  \ `ML` 研究人员共同努力，可能会为对抗宫颈癌提供原创思路（Sitarz et al., 2020; William et al., 2018）。\n\n\
  ## 研究空白与动机\n\n早期关于宫颈癌的研究显示，关于早期干预结果的证据仍然匮乏。因此，需要进一步的研究来确定该问题的整体影响。宫颈癌的检测和诊断从 `ML`\
  \ 中受益匪浅。这是因为它可以在海量数据中发现人类无法轻易察觉的趋势。后续取自以往研究的数据有助于阐明研究的可变性。可以用于改进性能结果的两种方法是欠采样和过采样。准确聚合多个变量使得要保证符合多种数据模态（包括遗传、科学和成像数据）变得具有挑战性。\n\
  \n更严格的特征选择技术有助于改进模型性能并剔除多余元素。利用技术知识预测宫颈癌已使巨大的进展成为可能。另一方面，在临床实践整合、统计质量和模型解释性方面仍然存在某些未解决的问题。纠正这些缺陷可能会提高\
  \ `ML` 模型在治疗、诊断和理解宫颈癌方面的准确性和实用用性。通过 `ML` 技术实现的早期疾病识别无疑能够实现及时干预。`ML` 技术在分析和处理海量、复杂数据方面优于传统的统计方法。考虑到新型生物标志物的可能性和需要识别的疾病模式，这尤为相关。改进我们目前的治疗方法和目标，可以帮助我们通过\
  \ `ML` 更好地理解宫颈癌治疗。\n\n## 研究问题 (RQs)\n\n这项介绍性研究可能解决以下研究问题（`RQs`）。\n\n`RQ1`：`ML` 或\
  \ `EL` 算法会提高准确性吗？如果是，哪一个对于预测和诊断早期宫颈癌更有效？\n\n`RQ2`：当与优化技术结合时，是否可以使用其他特征选择技术来提高准确性？\n\
  \n`RQ3`：是否有方法可以减少数据训练和测试所需的时间？\n\n## 目标\n\n工作中，我们使用 `UCI-ML` 仓库的宫颈癌疾病数据集进行了两阶段实验。在第一阶段，我们通过评估十种\
  \ `ML` 算法的有效性，将数据集应用于信息增益（`IG`）技术。这些算法包括极端梯度提升（`XGB`）、自适应提升（`ADB`）、梯度提升（`GDB`）、`SVM`、线性判别分析（`LDA`）、逻辑回归（`LR`）、k\
  \ 近邻（`KNN`）、朴素贝叶（`NB`）、决策树（`DT`）和 `RF`。为了增强初始方法的预测能力，我们在第二阶段实现了基本的集成技术：硬投票、软投票和加权平均。\n\
  \n### 贡献\n\n这项研究工作的主要贡献如下：\n\n* 提出了一种两阶段框架，通过 `IG` 将特征选择与集成学习技术相结合，比以往研究中独立分类器有所改进。\n\
  * 基准测试了十种常用的 `ML` 算法，在统一的实验设置下对其进行系统比较，并强调了模型之间的性能差异。\n* 通过整合特征选择、基础分类器和集成方法，为宫颈癌预测提供了一个在之前工作中未被充分探索的完整流水线。\n\
  * 识别并分析了数据集中弱或无关特征的存在及其对分类器性能的影响——这是类似研究中经常被忽视的方面。\n* 证明了集成模型在提高早期检测准确性方面的可行性和有效性，有助于医疗专业人员做出及临床决策。\n\
  \n### 论文结构\n\n整个文档结构由下列出的组件组成。第 2 节介绍了相关研究语料库的概述。第三部分探讨了建议的特征选择和分类方法的理论和数学基础，并附带对数据的全面分析。第四部分描述了该范式运行的基础。第\
  \ 5 节提供了研究结果的详细总结。第六部分概述了研究内容及其阐述的目标。\n\n\n\n\n为了寻找宫颈癌复发的概率（`Tseng et al., 2014`），研究人员建议在中山医学大学医院肿瘤数据集上应用\
  \ `SVMs`、`C5.0` 和极端学习机（`ELMs`）等机器学习方法。研究人员通过这些技术获得了 `92.44%` 的平均分类率。研究人员使用机器学习方法对宫颈癌病例进行了分类。这项工作应用了\
  \ `Gaussian NB`、`DT`、`LR`、`SVM` 和 `KNN` 等技术。\n\n作者（`Choudhury et al., 2018`）报告，所有五个可靠性指标——敏感性、`accuracy`、`precision`\
  \ 和 `F-measure`——均超过了 `97.0%`。其他指标还包括 `precision` 和 `accuracy`。有人使用来自委内瑞拉卡加斯大学医院的数据评估了一个宫颈癌检测系统。研究人员使用了基于机器学习的分类方法和增强的特征选择。评估了五种机器学习算法：`C5.0`、`RF`、`Ctree`、`SVM`\
  \ 和 `KNN`。曲线下面积（`AUC`）为 `91.0%`（`Nithya & Ilango, 2019`），其中一种算法的得分达到了 `100%` 的完美水平。\n\
  \n研究人员使用了 Herlev 数据集并开发了一种准确率为 `99.5%` 的宫颈癌检测方法。达到此目的的 DL 和 ML 技术包括自动编码器（`AEs`）、多层感知器（`MLPs`）、卷积神经网络（`CNNs`）和\
  \ 极端学习机（`ELMs`，`Ghoneim et al., 2020`）。为了创建一个数据挖掘模型，研究人员应用了如朴素贝叶斯（`NB`）、`C4.5` 深度神经网络（`DT`）、`KNN`、`RF`、`MLP`\
  \ 和简单逻辑回归（`SLR`）等机器学习方法。\n\n委内瑞拉的卡加斯大学医院提供了用于确定宫颈癌风险变量的数据。据报道，该医院声称 `recall`、`precision`\
  \ 和 `accuracy` 准确率为 `96.4%`（`Razali et al., 2020`）。我们使用这种方法来识别宫颈癌的风险变量。\n\n研究人员利用沙希德·贝哈斯蒂医学大学的数据库，开发了一种用于宫颈癌预测的监督机器学习方法。该系统在运行过程中产生的准确率为\
  \ `95.55%`、敏感性为 `90.48%`、特异性为 `100%`、`AUC` 为 `95.20%`。与 Asadi 等人（2020）的研究一致，我们选择使用\
  \ `Quest`、`C&R Tree`、`RBFANNs`、`SVM` 和 `MLP-ANNs`。\n\n研究人员通过将 `ResNet-50`、`ResNet-152`、`VGG-16`\
  \ 和 `VGG-19` 与 `SIPaKMed` 宫颈涂片图像集结合，开发了一种用于宫颈癌诊断的 DL 算法模型。根据作者介绍，`F1 score` 为 `95.0%`、`accuracy`\
  \ 率为 `94.89%`、`precision` 率为 `90%`，而 `recall` 率为 `100%`。\n\n研究人员测试了四种算法——`XGB`、`SVM`、`RF`\
  \ 和 `ResNet50`——将宫颈摄影图像用于宫颈癌分类。梨华女子大学机构审查委员会批准了这些算法。来自凤洞医院的数据显示，`accuracy`、`precision`、曲线下面积和\
  \ `recall` 分别为 `91.05%`、`93.10%`、`97.00%` 和 `89.0%`。\n\n为了创建一个宫颈癌检测模型，加利州大学欧尔文分校机器学习库的研究人员使用了\
  \ `RFs`、人工神经网络和脉冲神经网络等其他机器学习技术（`Mehmood et al., 2021`）。作者表示，该模型以 `93.6%` 的准确率、`0.07%`\
  \ 的误差范围、`6.4%` 的假阳性率和 `100%` 的假阴性评估率达到了目标。\n\n利用基于机器学习的统计分析，研究人员根据来自 UCI 机器学习库和\
  \ Kaggle 的数据构建了一个宫宫颈癌诊断模型。在几种机器学习技术中，该模型包含了 `Random Tree (RT)`、分裂点和属性减少分类器（`SPAAC`）、`KStar`\
  \ 和 `RF`。评估的指标包括 `AUC` (`99.0%`）、`recall` (`98.0%`）、`specificity` (`95.0%`）、`precision`\
  \ (`99.0%`）、`sensitivity` (`99.0%`) 和 `accuracy` (`99.16%`)（`Ali et al., 2021`）。\n\
  \n利用来自 UCI 机器学习库的数据和机器学习技术，研究人员创建了一种 `DT` 方法来对宫颈癌模型进行分类。Tanjuu 等人（2022）研究了以下指标：`F-measure`\
  \ (`75.01%`)、`accuracy` (`95.29%`)、`sensitivity` (`85.71%`)、`specificity` (`96.15%`)、`precision`\
  \ (`66.67%`)、`AUC` (`74.46%`)。\n\n研究人员报告了一种准确率为 `92%` 的结合 `CNN`、`SVM` 和 `ResNet\
  \ 101` 的宫颈癌检测方法，该方法利用了来自 Herlev 大学医院和丹麦理工大学的数据。除了 `AUC`、`F1-score`、敏感性和 `accuracy`\
  \ 的测量外（`Alquran et al., 2022`），研究人员还展示了使用嘉岭提供的认证折射率液体数据集，并评估了光电方法-机器学习模型的可行性。这些技术包括\
  \ `RF`、`XGB`、`NB` 和 `CNN`。考虑到 Herlev 宫颈涂片，`recall`、`accuracy`、敏感性和特异性均为 `DL` 模型。\n\
  \n\n\n\n| Kruczkowski et al., 2022 || RF, XGB, NB, CNN || 基于 Cargille 数据集的认证折射液体\
  \ || 准确率: 92%精确率: 93.0%召回率: 93.0%F-score: 92.0% |\n\n| Singh & Goyal, 2023 || SGD,\
  \ MLP, PAC, LR, SVMLK, SVM RBF, DT, RF, GNB, GBT, KNN || Herlev 宫涂片图像数据集 || 准确率:\
  \ 100%精确率: 100%召回率: 100%F-score : 100%CPU 时间: 0.14 |\n\n## 方法与材料\n\n网站的相关信息有助于人们预测患者当前的健康状况。改变模型参数产生了可以接受的结果。测试数据有助于评估模型的性能。本部分将介绍编译、灭菌和训练预后数据的步骤。\n\
  \n### 宫颈癌数据集 (CCDD)\n\nUCI-ML 仓库产生了本研究中使用的宫颈癌数据集 (CCD)。该数据集包含 72 次发生记录和 20 个属性——其中\
  \ 19 个是独立因素——这是一个更大数据集的子集（UCI 机器学习仓库，2023）。表 2 和 图 1 显示了 20 个特征中作为因变量（或标签类）的一个变量。该数据集经过了二分类处理；不存在缺失值。数据集中的值\
  \ 0 表示患者未患宫颈癌；值 1 表示患者患有宫颈癌。\n\n表 2 所用 CCDD 数据集的概述。[⏎]](#ch1.xhtml#R_tab1_2)\n\n\
  | 数据集名称 || 实例数量 || 特征数量 | 类别类型数据 |\n| --- | --- | --- | --- |\n| 宫颈癌数据集 (CCDD) ||\
  \ 72 || 19 | 0–501–22 |\n| --- | --- | --- | --- |\n\n\n\n采用数据准备技术对于确保机器能够解释原始数据至关重要。在现实世界中，患者数据可能是错误的、不完整的或持续不一致的。用于数据准备的方法可能为这些问题提供可能的解决方案。在实施过程的此时，后续阶段将涉及数据预处理技术的使用。由于该数据集包含信息的歧性和模糊性，插补是至关重要的。为了确保神经网络不产生错误的泛化，从数据集中排除可能包含敏感患者信息的某些特征是必须的。元组的管理可以在不需要定义类的情况下执行。如果默认值不可用，可以手动分配备用类标签。使用属性定义是用于填补空白的替代方法。需要复杂的方法来利用属性方法插补缺失值。因此，数据集依赖于人工执行的插补。归一化过程有几个优点。每次更新都显著提高了模型的数值稳定性并缩短了训练长度。当数据必须处于特定范围内时，将采用最小-最大缩放方法作为归一化技术。尽管机器学习方法更容易归一化，但线性系统通常分配零或接近零的微小随机值。我们可以通过最初对列包含的属性进行归一化来获得正态分布。为了实现这一目标，特征值被标准化为均值零和标准差一。与最小-最大缩放相比，归一化可以在识别并适应离群值的同时同时降低敏感性。利用\
  \ `scikit-learn` 类似于 `MinMaxScaler` 的 `StandardScaler` 是执行归一化的替代工具。`StandardScaler`\
  \ 的默认设置仅针对训练数据设计，不适用于测试数据或其他数据类型。\n\n### 特征选择技术：信息增 (IG)\n\n选择用于诊断宫颈癌特征的有效方法是信息增（IG）或\
  \ InfoGain。使用特定指标衡量的 IG 是特征在分类问题中关于某个类别的信息的程度（Kumawat et al., 2023; Jahan et al.,\
  \ 2021; Byskov Petersen et al., 2020; Ghasemi et al., 2024）。DT 方法利用它来确定哪些特征最适合数据划分。投影新数据实例的类标签需要产生显著知识增益的特征具有更高的相关性。通过使用划分前和划分后类分布的熵，可以找到从\
  \ 0（表示无增益）到 1（代表最大增益）的信息增。互信息（通常被称为信息增）衡量了特征的存在与否如何影响目标变量预测的准确性。该值取决于对目标链接值值的了解程度。互信息衡量了“输入变量”与“输出/目标变量”之间的相互作用程度。具有较大比例关系特性的特征可以考虑用于模型构建，而关系百分比较低（独立特征）的可以排除。该指标评估了关于特定临床特征或测试结果（`U`）相对于宫颈癌（`V`）的熵或不确定性的减少，可以用公式\
  \ (1) 给出：\n\n```\n(1) \nIG(V,U)=F(V)-F(V|U)\n```\n\n此外，符号 `F(V)` 表示目标变量的熵，因此衡量了数据集的无序程度或不确定性。`F(V|U)`\
  \ 显示了在包含 `U` 的知识的情况下目标变量的条件熵。因此这代表了在考虑 `U` 之后剩余的不确定性。\n\n\n\n\n本研究讨论的机器学习算法所使用的若干分类技术已简要总结(Lu\
  \ et al., 2020; Pati et al., 2023; Nayak et al., 2023; Al Mudawi & Alazeb, 2022)。逻辑回归模型的参数（通常称为线性组合系数）可以通过回归分析建立。这是通过\
  \ `LR` 方法实现的，`LR` 在统计学中表示事件发生似然性的对数。线性概率分类器 `NB` 假设特征之间存在条件独立性，因此证明了它们与其所属的特定目标类别之间的联系。为了解决问题，这些可扩展分类器需要大量的信息，或者由线性参数定义的预测。有时，最大间隔模型是一种结合了分类和回归方法的监督学习模型，该模型即\
  \ `SVM`。结合其可能的理论检验，`SVMs` 在各种任务（包括结构化问题预测）中的适应性极大地增加了它们的使用频率。线性判别分析 (LDA) 改编自 Fisher\
  \ 线性判别法，用于许多统计领域，以找到区分或表征各种类别事件或对象的特征组合。人们发现 `LDA` 与方差分析 (ANOVA) 之间存在显著的相似之处。回归分析的目标是将单一因变量描述为若干独立变量或指标的线性混合。`DT`\
  \ 是一种表示特定类型回归树的监督学习方法。该方法允许目标变量取连续值，通常表示为实数。`DT` 的一个子类型被称为回归树，它允许目标变量取连续值（通常为实数）。在训练过程中，`EL`\
  \ 方法的变体 `RF` 技术会生成多个 `DTs`。该方法被用于回归、分类以及若干其他应用。在分类任务中，`RF` 生成的输出是经多数投票者选择的类别。在回归活动中，会提供每棵树的平均预测值。`KNN`\
  \ 同时应用于回归和分类领域。无论情况如何，输入都是来自指定数据集的 `k` 个最近训练样本。`KNN` 分类方法利用局部近似来推迟计算，直到函数评估完成。在训练每个新模型以最小化其前一个模型的损失函数（如\
  \ `cententropy` 或均方误差）之后，`GDB` 通过合并许多弱学习器来构建一个健健的学习器。这是通过指示每个新模型最小化损失函数来实现的。在统计分类中，`ADB`\
  \ 是一种元算法，通过采用多种算法学习策略来增强性能。这是增强分类器的最终结果，源于学习算法的合并输出。聚合权重标志着这一产出。`XGB` 相比于单一决策树表现出优越的准确性；然而，这种优势损害了\
  \ `DTs` 有的可解释性特征。\n\n### 采用的 EL 方法\n\n加权平均以及软投票和硬投票 (Sahoo et al., 2024; Aljrees,\
  \ 2024; Sarwar et al., 2015; Panigrahi et al., 2023) 是本研究中使用的少数基础 `EL` 技术之一。`EL`\
  \ 是一种 `ML` 方法，通过结合许多学习器（包括神经网络或回归模型）的输出来产生更准确的预测。集成模型是许多独立模型的合成，它们组合在一起产生的预测准确性高于任何单一模型。在加权集成下，根据模型的性能对模型分配不同的权重，因此模型的预测结果将根据这些权重进行合并。\n\
  \n**主要优点：** 一种基于性能的加权方法赋予了性能更好的模型更高的价值，从而提高了准确性。其巨大优势之一是可选组合多个具有不同权重的模型。权重调优过程的一个缺点是需要进行细致的权重调整，这可能是困难且耗费时的。维护和更新许多模型是一项资源密集型活动，有时被称为计算开销。在数学中，“平均”的概念非常重要；可以认为一个数量等于所有可用数量之和除以数字的总数。在加权平均中，每个数量被分配一个随机权重，然后用该权重乘以该数量以计算平均值。分配给这些数量的随机权重可以是任何其他实体或说明所给数值重要性的优先级数字。对于所采用的\
  \ `N` 个模型，令 `P[i]`, `c` 是第 `i` 个模型对类别 `c` 的初始预测概率。来自所有输入 `N` 个模型的类别 `c` 的平均预测概率\
  \ `P[c]` 可以定义为公式 (2)。\n\n(2)\n\n$$P_{c} = \\frac{\\\\sum\\limits\\_{i = 1}^{N}w\\\
  _{i}P_{i,c}}{\\sum\\limits\\_{i = 1}^{N}w_{i}}$$\n\n某些模型始终表现出优越的性能并对最终估计产生更大的影响。投票集成通过多数投票（分类）或平均值（回归）合并许多模型的预测结果。这种方法用于分类。硬投票（多数投票）和软投票（加权概率）都是可行的方案。\n\
  \n**优点：简单有效：** 易于实现且通常能增强性能。减少并整合许多模型以减轻个体偏差。这种现象被称为过拟合。\n\n**缺点：等权重：** 这种简单的投票方法均等地对待所有模型，可能无法始终产生最优结果。\n\
  \n**应用：** 一种增强分类任务中模型健壮性的方法，作为初步集成策略。一种分类器类型是“软投票”，它根据其他分类器的预测概率对输入数据进行分类。随后将分配给值的权重应用于每个分类器以获得正确结果。对于所采用的\
  \ `N` 个模型，令 `P[i]`, `c` 是模型对类别 `c` 的预测概率。来自所有输入 `N` 个模型的类别 `c` 的平均预测概率 `P[c]` 可以定义为公式\
  \ (3)。\n\n(3)\n\n$$P_{c} = \\\\sum\\limits\\_{i = 1}^{N}P_{i,c}$$\n\n(4)\n\n$$P[c]\
  \ = M(P[1], P[2], P[3], P[4],…P[N])$$\n\n其中：`M` 是所有模型 `i` ϵ `N` 中频繁出现的类别，`P[c]`\
  \ 是最终预测概率，`P[i]`, `c` 是所有模型的预测概率。\n\n## 提工作\n\n\n\n\n\n针对子宫颈癌数据集的拟议研究包含了旨在增强评估指标的两阶段实验。评估指标涵盖了子宫颈癌评估中的准确率、精确率、特异性、灵敏度、F1\
  \ 分数和 AUC 值。在实验的第一步中，我们针对之前描述的数据集采用了一种整合了 `IG` 方法和 10 种不同 `ML` 分类技术的模型。此外，在随后的阶段，我们通过整合关键的\
  \ `EL` 技术增强了 `ML` 分类器结果的预测。这些方法随后根据之前获得的预测进行实施。`Algorithm 1` 和 图 2 都展示了前述独特混合模型的表示形式。\n\
  \n\n\n### 算法 1：所提的 AI 驱动子宫颈癌预后模型\n\n**输入：** 子宫颈癌疾病数据集 (`CCDD`)\n\n**输出：** 二分类\n\n\
  1. 从 UCI-ML 仓库收集子宫颈癌疾病数据集。\n2. 开始使用位数法进行缺失值填充：\n    1. 识别缺失值及其对应的特征 (`j`)\n    2.\
  \ `f[i][j] = median f[1,j], f[2,j], f[3,j],...,f[n][j]`，其中 `f[i][j]` 是第 `j` 个特征的缺失值\n\
  \    3. 用 `f[i][j]` 替换缺失值\n4. 按 80:20 的比例将数据集分为训练子集和测试子集。\n5. 使用 `IG` 作为特征选择方法，利用所有可用特征\
  \ (`F`) 对训练数据进行过滤。\n6. 应用分类器 `RF`, `DT`, `SVM`, `LR`, `KNN`, `LDA`, `NB`, `GB`,\
  \ `AB` 和 `XGB`。\n7. 对所有基础学习器的初始预测进行评估。\n8. 将 `EL` 分类器应用于初始预测，以开发 `EM`（集成模型）：\n \
  \   1. `WA`（加权平均法）\n    2. `HV`（硬投票）\n    3. `SV`（软投票）\n9. 将测试数据应用于已开发的模型，即 `EM-WA`,\
  \ `EM-HV`, `EM-SV`。\n10. 评估 `EM-WA`, `EM-HV`, `EM-SV` 的模型性能。\n11. 评估两种混合模型，并选择最适合你的一个。\n\
  \n## 结果与讨论\n\n所提设备基于运行 Ubuntu 20.04 系统的 Intel Core i7 桌面电脑，配备 32GB 内存和 1TB  固态硬盘存储。使用用\
  \ `Python` 开发的 Jupyter notebook 进行实验。2 × 2 混淆矩阵包含四个部分。这些部分由字母 `T1`、`F1`、`T0` 和 `F0`\
  \ 表示，分别代表真阳性和假阴性。这种对模型性能的评估考虑了多个方面，其中准确率是最重要的。公式 (5) 到 (9) 描述了 F1 分数 (`FS`)、准确率\
  \ (`Ac`)、精确率 (`Pr`)、灵敏度 (`Se`) 和特异性 (`Sp`) 的定义。还包含了对应 ROC 曲线的 AUC 值。本研究中的性能指标是使用以下公式计算的\
  \ (Rout et al., 2022; Kharya et al., 2024; Panda et al., 2025; Sahu et al., 2025)）。\n\
  \n(5)\n$$Ac = \\frac{T\\_{1} + F\\_{1}}{T\\_{1} + F\\_{1} + T\\_{0} + F\\_{0}}$$\n\
  \n(6)\n$$Pr = \\frac{F\\_{1}}{T\\_{1} + F\\_{1}}$$\n\n(7)\n$$Se = \\frac{T\\_{1}}{T\\\
  _{1} + F\\_{0}}$$\n\n(8)\n$$Sp = \\frac{F\\_{1}}{F\\_{1} + T\\_{0}}$$\n\n(9)\n$$FS\
  \ = \\frac{2 \\times T\\_{1}}{2 \\times T\\_{1} + F\\_{1} + F\\_{0}}$$\n\n本研究包含两个阶段实验查询。首先，我们采用\
  \ `IG` 特征选择方法创建一个增强数据集，旨在提高预测的准确性。在应用于子宫颈癌数据集后，这 10 种传统的 `ML` 方法产生了表 3 所示的结果。下面的枚举包含了许多可用的混合方法\
  \ (HA)：`HA-A` (LR + IG), `HA-B` (NB + IG), `HA-C` (SVM + IG), `HA-D` (LDA + IG),\
  \ `HA-E` (DT + IG), `HA-F` (RF + IG), `HA-G` (KNN + IG), `HA-H` (GB + IG), `HA-I`\
  \ (AB + IG) 和 `HA-J` (XGB + IG)，代表了不同的逻辑回归模型。图 3、图 4、图 5、图 6 和 图 7 展示了关于第一阶段预期结果的研究发现。`HA-A`\
  \ 的精确率为 87.50%，灵敏度为 87.50%，特异性为 92.85%，F1 分数为 87.50%，准确率为 90.90%。`HA-B` 达到了 86.67%\
  \ 的准确率，灵敏度为 75.00%，特异性为 92.65%，精确率为 85.71%。`HA-C` 的特异性为 74.92%，准确率为 100%，灵敏度为 62.50%。它们的准确率为\
  \ 96.36%，特异性为 74.92%，F1 分数为 74，代表 92%。`HA-D` 达到了 93.33 的 F1 分数，准确率为 95.45%，精确率为\
  \ 100%，灵敏度为 87.50%，特异性为 100%。`HA-E` 达到了 86.36% 的准确率，灵敏度为 75.00%，特异性为 87.50%，精确率为\
