  \ SHAP 摘要图中，可以很容易理解特征值如何影响模型预测。\n## 基础数据集上随机森林算法的瀑布模型解释\n图 22 所示的 SHAP 瀑布模型代表了随机森林算法在基础数据集一个实例上的局部解释可视化，该实例（`index\
  \ = 5`）被视为一个可解释的元组，用于预测心脏病概率。\n![Fig. 22 基础数据集上随机森林算法的 SHAP 瀑布模型。⏎](img/fig2_22_B.jpg)\n\
  图 22 基础数据集上随机森林算法的 SHAP 瀑布模型。⏎\n此处，左侧的灰色瀑布代表预测值 `f(x) = 0.13`，基准期望值为 `E[f(X)] =\
  \ 0.674`。单个特征的贡献（以灰色负值显示）使预测值从期望值降低到最终输出。这意味着这些特征对预测主要有负面影响。右侧的黑色瀑布代表预测值 `f(x) =\
  \ 0.87`，基准期望值为 `E[f(X)] = 0.326`。单个特征的贡献（以黑色正值显示）将预测从期望值增加到最终输出。这意味着这些特征对预测主要有正影响。第一幅图像的特征导致预测下降（负\
  \ SHAP 值），使得最终输出低于预期；而第二幅图像的特征则将预测向上推（正 SHAP 值），产生高于预期的最终输出。这对于分析特征重要性、调试机器学习模型以及确保模型的可解释性非常有帮助。\n\
  ## 使用增强数据集进行综合分析\n由于基础数据集在结果存在过拟合问题，因此使用增强数据集进行了综合分析。\n## 基础数据集上随机森林算法的 LIME 解释\n\
  随机森林算法的工作原理可以通过 LIME 模型来解释。图 23 代表了随机森林算法在增强数据集一个实例上的 LIME 解释，该实例（`index = 5`）被视为一个可解释的元组，用于心脏病概率的预测。\n\
  ![Fig. 23 增强数据集上随机分类算法的 LIME 解释。⏎](img/fig2_23_B.jpg)\n图 23 增强数据集上随机分类算法的 LIME 解释。⏎\n\
  该图像展示了借助 LIME（局部可解释模型无关解释）对分类模型的局部解释可视化。解释可以分为四部分：1) 预测概率，2) 特征对预测的贡献，3) 特征值表，以及\
  \ 4) “不健康”（Unhealthy）类的局部解释。对于预测概率，存在两个类别：健康（Healthy）和不健康（Unhealthy）。此处，左上角代表与 `index\
  \ 5` 相关的类别概率值，健康：`0.73`，不健康：`0.27`。图片正中间描述了特征对预测的贡献。该图显示了哪些特征对分类产生了正负面影响。左侧的特征促进健康预测。右侧的特征促进不健康预测。每个特征旁的数值范围描述了特征值的阈值条件。图中在右角列出了特征及其对应值。此处，黑色高亮了支持“健康”预测的特征，灰色高亮了支持“不健康”预测的特征。在图的下部定义了“不健康”类的局部解释。在图中，水平条代表对不健康预测贡献最大的特征。此处，左侧条表示对不健康预测的负贡献，右侧条表示远离不健康预测的正贡献。因此，可以说随机森林（RF）以\
  \ 73% 的概率预测该样本图像为健康，其中特征 37, 42, 44, 46, 48, 49, 79 和 92 贡献于健康类。\n## 增强数据集上随机森林算法的\
  \ SHAP 解释\n联合预测模型的工作也可以借助 SHAP 来解释。图 24 所示的 SHAP 摘要图展示了在增强数据集的心脏病预测中，使用随机森林算法时每个特征如何对联合模型预测的全局解释可视化。\n\
  ![Fig. 24 增强数据集上随机森林算法的 SHAP 摘要图解释。⏎](img/fig2_24_B.jpg)\n图 24 增强数据集上随机森林算法的 SHAP\
  \ 摘要图解释。⏎\n此处 x 轴定义了 SHAP 值，代表每个特征如何影响预测；y 轴定义了特征数量或特征索引（数值标签如 131, 46, 93, 4 等）。正的\
  \ SHAP 值将预测向上推（趋向正类或更高分），负的 SHAP 值将其向下推（趋向负类或较低分）。在图 24 中，灰点表示低特征值，黑点表示高特征值。因此，从这张摘要图中，可以很容易理解高值（黑色）将模型推向健康，低值（灰色）将其推向不健康，而特征\
  \ 125 对模型预测的影响最大。\n## 增强数据集上随机森林算法的瀑布模型解释\n图 25 所示的 SHAP 瀑布模型代表了随机森林算法在增强数据集一个实例上的局部解释可视化，该实例（`index\
  \ = 5`）被视为一个可解释的元组，用于心脏病概率的预测。此处，左侧的灰色瀑布代表预测值 `f(x) = 0.04`，基准期望值为 `E[f(X)] = 0.353`。特征大多具有负\
  \ SHAP 值，意味着它们将模型预测从期望值降低到更低的最终输出。最大的特征具有 -0.06 的负影响，其他特征也逐步向下推数值。右侧的黑色瀑布代表预测值 `f(x)\
  \ = 0.96`，基准期望值为 `E[f(X)] = 0.647`。特征具有正 SHAP 值，意味着它们将模型预测提高到期望值以上。影响最大的特征增加了 +0.06，其他特征也逐步做了正贡献以达到最终输出。\n\
  ![Fig. 25 增强数据集上随机森林算法的 SHAP 瀑布模型。⏎](img/fig2_25_B.jpg)\n图 25 增强数据集上随机森林算法的 SHAP\
  \ 瀑布模型。⏎\n\n\n众周知 `LIME` 提供局部或单实例解释，因此它所需的计算时间较少，而 `SHAP` 既提供局部也提供全局解释。由于这个原因，它的计算时间比\
  \ `LIME` 长。`LIME` 和 `SHAP` 在基础和增强数据集上的解释效率和执行时间对比见图 26。\n![Fig. 26 LIME 和 SHAP 在计算效率和执行时间方面的对比。\
  \ ⏎](img/fig2_26_B.jpg)\n图 26 `LIME` 和 `SHAP` 在计算效率和执行时间方面的对比。⏎\n在此，下方的黑色点表示根据 `LIME`\
  \ 的解释效率得分的执行时间，上方的灰色点代表根据 `SHAP` 的解释效率得分的执行时间。从图 26 可以看出，`LIME` 对于两个数据集的取耗时均小于 1\
  \ 秒，而 `SHAP` 基础数据集大约需要 580 秒，增强数据集大约需要 2,900 秒。因此可以得出，在 `SHAP` 的情况下，执行时间随输入数据数据量的增加而增加。所以，当执行时间差异至关重要时（例如任何实时健康监测系统或远程医疗应用），可以选择\
  \ `LIME` 进行解释，否则 `SHAP` 是解释的最佳选择。\n从结果中可以看出，从两个数据库获得的显著特征对应于标准 ECG 联以及如图 11 所示的\
  \ ST 偏移、R 峰幅度和 QRS 宽度等形态特征，对疾病预测贡献最大，并可以通过 `XAI` 方法进行验证和解释。\n## 在心脏病预测中优化参数卓越性的研究结果\n\
  参数优化是构建有效且强大的 `EL` 模型以生成准确、可靠且理解结果的关键因素。通过结合单个基础 `ML` 算法的优势，可以增强模型的性能。所提出的模型将输入数据分为两个子集：一个健康数据集，另一个是不健康数据集。因此，这些输入子集数量之间的差异最小化了过拟合问题并最大化了泛化能力。结果证明了使用\
  \ `EL` 方法评估性能指标时的这种平衡。在实现参数卓越性方面，确定预测性的 10 个最显著特征是首要因素。这些决策性特征对预测概率的重要性和个体贡献可以通过\
  \ `SHAP` 和 `LIME` 等 `XAI` 方法进行证明。这种联合模型在 `XAI` 的帮助下做出决策，并根据影响预测结果的重要性评分识别出如 ECG\
  \ 联和形态特征等关键特征。这种在获得一致结果时的可解释性、透明度和信任度增加了基于 `AI` 的诊断模型的可靠性。此外，嵌入的特征选择方法允许临床医生验证模型结果，使\
  \ `AI` 建议在医学领域更具适用性。`Random Forest` 模型通过最优特征数量表现优，有助于提高稳定性和减少方差。研究还考察了数据集预处理和特征选择方法对参数卓越性的影响。结果显示，选择和提取决策性特征增加了模型的解释性和计算效率，并缩短了训练时间。因此，结果证实了通过\
  \ `EL` 优化参数卓越性并使用 `XAI` 技术理解结果可以在心脏病预测中获得更好的性能和可解释性，促进了医疗保健领域更有效、透明和可靠的 `AI` 驱动诊断。\n\
  ## 局限性\n数据质量不足、类别不平衡、隐私和数据安全是该领域的一些问题。尽管具有解释能力，`LIME` 和 `SHAP` 也有某些局限性。`LIME` 只能用于局部解释，而\
  \ `SHAP` 提供局部和全局解释。因此，`SHAP` 的计算成本随大型复杂数据集而增加，且结果并未针对所有情况进行优化。有时由于随机数据采样，`LIME`\
  \ 的结果可能是不稳定的。\n## 未来方向\n未来计划结合 `ML` 和 `DL` 两种方法，将 `EMR` 数据与患者的 ECG 集成。其他 XAI 方法如\
  \ `Grad-CAM` 和 `LRP` 也可以纳入解释性研究，因为它们对于使用 `DL` 方法进行模型预测非常高效。此外，将结合 `IoT`（物联网）设备开发真实世界的部署，以测试联合模型的实用性。这种\
  \ `AI` 与医学知识的融合产生了一个可靠、一致且透明的系统，使医疗人员能够做出坚定的 `AI` 驱动决策，从而彻底改变医疗保健行业。\n## 结论\n心脏病的早期检测和精确预测是医学领域非常重要的因素。这种\
  \ `EL` 与 `XAI` 的结合方法不仅使医疗人员能够对患者做出快速决策，还帮助用户以非常透明且更易的方式理解关键解释。这项研究证明，`EL` 方法（`RF`、`XGBoost`\
  \ 和 `Voting Classifier`）通过结合 `KNN` 和 `Decision Tree` 等基础 `ML` 模型增强了预测准确性。它还整合了 `SHAP`\
  \ 和 `LIME` 等 `XAI` 方法来描述和证明算法获得的结果，并指导医学专家对患者采取及时行动。\n## 参考文献\n*   Abdullah, T.A.A.,\
