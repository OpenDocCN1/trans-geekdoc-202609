  \ and Review, `8`(2), 809-817。\n\n\n# 用于早期识别唐综合征患者的 3 AI 技术\nSifat Kaur⁴\nEmail:\
  \ jibs-sdhingra@jgu.edu.in¹; gurleen21@iiserb.ac.in²; dhlindquist@jgu.edu.in³; sonia.rani@jgu.edu.in⁴;\
  \ vaisakh.sb@tropmet.res.in⁵; manmeet.singh@utexas.edu⁶\nDOI: [10.1201/9781003716686-3](https://dx.doi.org/10.1201/9781003716686-3)\n\
  唐综合征（DS）是一种遗传性神经发育障碍，取决于患者的年龄、染色体数量和种族，由 21 号染色体三体引起。早期检测可以为受影响的人提供及时的干预和更好的生活质量。尽管遗传和临床诊断已取得进展，但对非侵入性、可扩展且自动化的方法仍有巨大需求。本文引入的创新点是使用了一种基于深度学习（DL）模型\
  \ `EfficientNetV2` 的具有高效率和可扩展性的卷积神经网络架构，该模型通过迁移学习对儿童患者的面部特征分析进行了有效训练，用于唐综合征病例的识别。这是一个完整的系统提议，将开发的深度学习模型与面部表情数据集的训练相结合，使检测既快速又无误。所设计的框架有助于心理健康专业人员的诊断过程，为临床决策库提供了一个强有力的工具。我们的研究在唐综合征面部分析领域取得了显著进展，通过建立可靠的计算基准解决了了以往的局限性。实施细节、代码和预训练模型已开放，以促进这一关键领域的进一步研发。\n\
  ## 引言\n唐综合征（DS）在全球范围内每 700 个活出生儿中就有一个 (Antonarakis, 2017)，是一种由于额外 21 号染色体引起的疾病。它通常伴有智力障碍、面部特征以及精神或智力发育延迟，这些障碍往往会影响个人的生活质量。早期诊断至关重要，因为它可能导致早期干预，从而改善健康、认知功能和社会整合的长期结果。最近的研究\
  \ (Gill et al., 2022) 显示了人工智能（AI）驱动的面部分析在诊断自闭症等神经发育障碍方面的潜力。但尚未对唐综合征开展类似的研究；因此，这是在使用先进\
  \ AI 方法处理这种心理健康状况时的一个关键空白之一。传统上，唐综合征的诊断通过基因检测和临床观察。然而，这些方法有时侵入性强、成本昂贵，且在大多数地方无法获得，特别是在资源有限的地方。此外，`AI`\
  \ 和 `ML`（机器学习）通过 `CNNs`（卷积神经网络）展现了前景，特别是 (Sahu et al., 2022)。`EfficientNetV2` 是一个更高效、更准确的新一代。\n\
  ### 贡献\n本研究以以下新颖方式对唐综合征领域做出贡献：\n1. **在唐综合征检测任务中引入 `EfficientNetV2`：** 本研究属于首批将 `EfficientNetV2`\
  \ 用于面部分析的研究，这与传统的侵入性基因检测不同。\n3. **多样平衡表型数据集：** 与文献中依赖同质化数据集的不同，此处使用的数据在我们对肤色、发质等精细控制的表示中进行了平衡。多样化的表示增加了该模型对普通变的适用性。\n\
  5. **移动应用中的实用性：** 我们的设计关注唐综合征的实时移动端检测，允许在移动应用层面实现延迟和效率。这将对唐综合征的广泛采用产生真实影响。\n\n\n\
  \n\n\n医学影像应用，包括癌症检测、糖尿病患者视网膜病变评估以及神经系统疾病评估，在人工智能和深度学习方法的帮助下已经取得了显著进展（Barua et al.,\
  \ 2022; Gupta et al., 2022; Uddin et al, 2019）。这种复杂、准确且详细的模式捕捉机制的一个典型例子是 `CNNs`\
  \ 以及后来的 `Vision Transformers`。近期，`EfficientNet` 架构（包括 `EfficientNetV2` (Simonyan\
  \ & Zisseman, 2014)）被开发出来，以实现不同计算规模下的模型效率，这使得该架构能够在高资源临床环境以及低资源移动环境中可行运行。这种进展为 AI\
  \ 应用于更具挑战性的领域（如传统上具有主观性的儿童期神经发育障碍诊断）奠定了坚实的基础。\n## 神经发育障碍诊断中的 AI\n\n从历史上看，`DS` 的诊断依赖遗传检测方法（如核型分析和染色体微阵列分析）以及基于物理特征的临床观察（Lalonde\
  \ et al., 2020; Gill & Buvya, 2024; Cao et al., 2012）。尽管这些方法有效，但它们存在若干局限性，例如侵入性、高成本以及在低资源环境下的可用性有限。此外，`DS`\
  \ 面部特征的微妙性和变异性增加了基于视觉诊断的复杂性，使得对客观且扩展诊断工具的需求增加。\n## 唐综合征诊断的 AI 方法\n\n在儿童医疗保健中使用 AI\
  \ 的伦理考量重要到不忽视，特别是在患者隐私、知情同意和公平获取方面。Gupta et al. (2022) 和 Szegedy et al. (2016) 的研究强调了\
  \ AI 诊断中匿名数据、稳健的隐私控制和伦理透明的必要性。我们的研究遵循这些原则，确保患者数据隐私，使用多样化数据集以避免表型偏差，并使我们的模型适用于移动应用程序，从而解决了该领域的伦理和实践需求。\n\
  \n总之，尽管 AI 在检测神经发育和遗传性疾病方面显示出巨大潜力，但专门为 `DS` 诊断定制的稳健且可扩展的解决方案研究不足。为此，本文开发的方法提高了现有\
  \ AI 方法的效率，同时进一步泛化了其结果，并提供了一种解决以往研究观察某些局限性的新范式。\n\n## 数据集与方法论\n在本节中，我们将讨论用于本研究的数据集和方法论。\n\
  \n## 数据集\n本研究使用的数据是 3,000 张面部图像（图 1），这些以平衡的方式编制；其中一半是诊断为 `DS` 的儿童，另一部分是健康对照组。此外，照片中儿童的年龄从\
  \ 0 到 15 岁，涵盖了与 `DS` 早期诊断相关的时期。\n\n![图 1 监督学习数据中带有相应标签的图像示例 [4]。](images/fig3_1_B.jpg)\n\
  \n图 1 监督学习数据中带有相应标签的图像示例 [4]。](#ch3.xhtml#R_fig3_1)\n\n该数据集通过使用相同数量的佩戴和未佩戴眼镜的儿童图像，考虑了可能的偏差，并确保数据集保持了肤色、眼色和发型的平衡分布（图\
  \ 2）。这意味着学习是泛化的，而不是被无关的表型特征所偏偏。本研究使用的方法论是收集和预处理面部表情的一种详细且平衡的方法。尽管“儿童”一词通常涵盖 0-18\
  \ 岁年龄组，但本研究主要使用了 0-15 岁的照片。这是因为许多数据集缺乏精确的年龄信息，而且确定 `DS` 个体的年龄也具有挑战性。此外，由于大多数 `DS`\
  \ 儿童存在视觉问题并可能佩戴眼镜，因此数据集是完美平衡的。它包含了佩戴眼镜的 `DD` 儿童图片，而另一部分是健康儿童的图片文件（佩戴和未佩戴眼镜的均有），以避免模型在决策过程中产生偏差。\n\
  \n![图 2 唐综合征数据的不同特征描述](img/fig3_2_B.jpg)\n\n图 2 唐综合征数据的不同特征描述](#ch3.xhtml#R_fig3_2)\n\
  \n## 方法论\n该方法论包含以下部分：\n\n#### 数据准备\n\n\n\n\n\n第一步涉及将图像预处理为相同的尺寸和格式。所有图像都被调整为 `224\
  \ x 224` 像素，这是一个常用的尺寸，它在细节和计算效率之间取得了平衡，并被转换为灰度图以简化计算过程，同时保留图像中所有必要的特征以确保分类的准确性。\n\
  \n### 数据增强\n\n为了使模型具有更强的抗过拟能力并在多种面部表情和方向上具有泛化性，我们使用了数据增强。这些方法包括旋转、上下移动、向左或右移动、剪切和水平翻转。所有增强参数都是人工挑选的，旨在模拟真实的变化，而不是扭曲对唐综合征（DS）至关重要的特征。\n\
  \n### 使用的深度学习模型\n\n我们使用了几种深度架构来开发一个基于面部图像的唐综合征检测强基准（见图 3）。每个模型都是根据其在图像分类任务中的独特优势和效能选择的。下面我们描述了每个模型，并进一步说明了它们在我们研究中的具体功能。\n\
  \n![图 3 描述用于检测唐综合征患者的基于云计算的 AI 基准开发的框架。⏎](img/fig3_3_B.jpg)\n\n图 3 描述用于检测唐综合征患者的基于云计算的\
  \ AI 基准开发的框架。⏎\n\n1. **VGG16:** 它是牛津大学视觉几何小组发明的深度 CNN 之一（Szegedy et al., 2016）。它仅由逐层堆叠深度的简单\
  \ `3 × 3` 卷积层组成，并通过最大池化处理尺寸缩小。VGG16 在图像识别和分类方面非常有效，因为它结合了深度和非常统一的架构。在我们研究中，采用 VGG16\
  \ 主要是因为其强大的特征提取能力。在 ImageNet 数据集上预训练的版本为可能有助于识别 DS 的特征提供了坚实的基础。\n\n2. **GoogLeNet\
  \ (Inception V1):** GoogLeNet（或 Inception V1）引入了一种新的 Inception 模块，该模块在网络的同一层内使用不同尺寸的卷积滤波器，以捕获不同尺度下的特征细节（Szegedy\
  \ et al., 2015）。该模型比其他架构深得多，但由于其结构设计最小化了参数数量，运行所需的计算更少。在我们的研究中，GoogLeNet 捕捉了面部特征的重要模式，这些模式对于识别唐综合征至关重要。\n\
  \n3. **Inception V3:** 它是 GoogLeNet 的变体并得到了进一步改进，包含了增强功能，例如分解卷积以减少连接和操作，然后引入了批归一化（`He`\
  \ et al., 2016）。该模型促进了深度网络更易训练，因为优化的结构加速了过程并提高了准确性。在我们的应用中，面部图像输入图像的高分辨率能力使其非常适合提取微小特征。\n\
  \n4. **.ResNet18:** 它是残差网络（Residual Networks）家族的一员，该网络通过跳跃连接（快捷连接）来跳过某些层（Xie et\
  \ al., 2017）。这种设计消除了梯度消失问题，使得模型可以更深而不丢失性能。ResNet18 是 ResNet 模型的一个相对较浅的版本，因此在复杂性和性能之间取得了良好的平衡，非常适合我们实验中的快速迭代。\n\
  \n5. **Wide ResNet:** 它用每层更多的通道替换了标准的 ResNet，从而通过加宽网络而不是增加其深度（Sandler et al., 2018）。这种适应在不显著增加与深度网络相关的计算成本的情况下增强了学习能力。在这项研究中，采用\
  \ Wide ResNet 是为了提高模型在学习和表示复杂关系方面的能力，而无需扩展深度。\n\n6. **SqueezeNet:** 它在 ImageNet\
  \ 上获得了与 AlexNet 相同的准确率，但参数减少了 `50x` 倍，且模型尺寸小得多（Tan & Le, 2021）。在这里利用了压缩和扩展层来激进地减少网络中特征的维度。反，这在保持准确性的同时节省了模型尺寸和计算量。此类应用对于我们的研究非常有用，因为我们可能需要将它们部署在移动或其他低功耗设备上。\n\
  \n7. **DenseNet:** 它对卷积网络中的特征复用想法进行了泛化（Liu et al., 2021）。它从一层前馈到所有其他层，因此之前所有层的特征图都会馈入每一层。因此它最大地允许网络层之间的流动，从而能够最好捕捉数据中的模式，有助于诊断\
  \ DS。\n\n8. **ResNeXt:** 这是 ResNet 网络架构的扩展，包括分组卷积（Swanson, 1997）。与仅包含相同深度标准卷积的网络相比，这些卷积大幅减少了参数数量。由于这一特性，MobileNet\
  \ 非常适用于那些有关键延迟要求的应用，例如移动应用程序。\n\n10. **EfficientNetV2:** 它是基础 EfficientNet 模型的高级形式，在优化参数的同时，其训练速度也得到了优化，并随着参数保持了高效的训练速度（Simonyan\
  \ & Zisseman, 2014）。在目前的研究中，其架构缩放特性使得对模型和计算维度进行有效控制。\n\n11. **Swin Transformer:**\
  \ 该架构通过在后续层移动这些窗口之前，在局部窗口内计算自注意力，将 Transformer 适配于视觉（Zagoruyko & Komodakis, 2016）。它结合了\
  \ CNN 和 Transformers 的优势，在捕捉图像的全局和局部依赖关系方面表现优异，这在复杂的医学影像分析中非常重要。\n\n#### 模型开发\n\n\
  本文采用了 EfficientNetV2 模型，因为它具有可扩展的架构和在图像分类任务中的领先性能（Simonyan & Zisseman, 2014）。该模型最初提供了在\
  \ ImageNet 数据集上预训练的权重。后者利用迁移学习机制显著加速了学习速度，并由于预习的特征表示改进了最终性能。\n\n### 训练\n\n训练使用随机梯度下降优化器进行训练，学习率为\
  \ `0.001`，动量为 `0.9`。对于二分类问题，使用的传统损失函数是交叉熵损失函数。它训练了 `50` 个 epoch，批大小为 `32`。此外，还引入了早停机制，如果连续十个\
  \ epoch 在验证集上的准确率没有提高，则停止训练，以防止过拟合。表 1 描述了预训练深度学习模型使用的参数。\n\n| 训练次数 | 10 |\n| ---\
  \ | --- |\n\n\n\n\n\n| 优化器 | 随机梯度下降 |\n| :--- | :--- |\n| 损失函数 | 交叉熵损失 |\n| 学习率\
  \ | 0.001 |\n| 动量 | 0.9 |\n\n### 验证与测试\n\n数据集被分为训练集 (80%)、验证集 (10%) 和测试集 (10%)。验证集用于在训练期间监控模型性能并调整超参数。训练完成后，在未见的测试集上对模型性能进行评估，以衡量其泛化能力。通过测试数据集上的准确率来衡量模型的有效性。\n\
  \n### 针对临床和移动端的特定特定实现\n\n为了确保所提模型在现实场景中的实用性，我们探索了其在临床和移动环境中的部署。由于我们注意到许多临床环境计算资源匮乏，特别是在偏远或低资源地区，我们的模型进行了优化，侧重于轻量化部署且不牺牲准确率。我们使用了\
  \ `EfficientNetV2` 架构，因为它被认为在手机和平板等低处理能力设备上，在实现高准确率和减少计算需求之间取得了最佳平衡。\n\n*   **移动应用兼容性：**\
  \ 模型测试了使用 `TensorFlow Lite` 在 Android 和 iOS 平台上的部署，这使得医疗保健人员和护理人员能够通过简单的移动应用程序进行唐综合征的初步筛查。该应用程序使用设备的摄像头捕捉面部图像并进行实时处理，提供关于是否建议进一步临床检测的即时反馈。\n\
  *   **临床应用与集成：** 在临床使用方面，该模型被设计为集成到电子健康记录 (EHR) 中，以便医疗人员将基于 AI 的唐综合征诊断支持电子整合到患者档案中。该功能有助于医疗服务提供者对唐综合儿童特征可能细微的病例进行早期及时的诊断。\n\
  \n### 超参数调优\n\n针对我们的 `EfficientNetV2` 模型以及本研究中基准测试的其他模型的超参数，我们基于网格搜索和交叉验证执行了大量的超参数调优过程，以最大化模型的准确率和泛化能力，并尽可能缩短训练时间。一些主要参数包括学习率、批量大小\
  \ (batch size)、动量和迭代次数 (epochs)。\n\n*   **学习率：** 测试了 10⁻⁴ 到 10⁻² 范围内的多种不同学习率，确定用于梯度下降优化的有效学习率为\
  \ 0.001。选择此值是为了在训练时提供稳定的收敛并最大限地减少震荡。\n*   **批量大小：** 16、32 和 64。32 的批量大小在计算效率和模型性能之间达到了最佳平衡点。较小的批次倾向于引入噪声并减慢收敛，而大得多的批次需要更多的内存，且性能获益微乎其微。\n\
  *   **动量：** 测试了 0.5–0.9 之间的动量值，以避免震荡并加速收敛。发现 0.9 的值是最佳的，因为它能让模型收敛而不产生过冲。\n*   **迭代次数：**\
  \ 我们使用了耐心值为 10 次迭代的早停策略 (early stopping)。这避免了在设定的最大 50 次迭代内发生过拟合，尽管大多数模型在早停作用下于\
  \ 30 次迭代内就已在最大收敛。我们通过查看交叉验证的结果选择了这一参数。没有迹象表明准确率的提升会超过 50 次迭代。\n\n## 结果\n\n我们的实验结果证明了部署的深度学习模型在通过面部图像识别唐综合征方面的有效性（图\
  \ 4）。\n\n![images/fig3_4_B.jpg]\n\n图 4 不同模型在检测唐综合征患者测试数据上的准确率。(#ch3.xhtml#R_fig3_4)\n\
  \n模型根据其在测试集上的准确率进行评估，测试集占总数据集的 10%。注意的是，`EfficientNetV2` 和 `Wide ResNet` 达到了最高的测试准确率，均为\
  \ 95.11%，强调了它们在处理复杂图像分类任务时的稳健性。`VGG16` 紧随其后，准确率为 94.67%，而 `GoogLeNet` 和 `ResNetl8`\
  \ 等模型表现出略低但具有竞争力的准确率，分别为 93.78% 和 93.11%。性能指标表明，架构更深或更复杂的模型并不一定优于更或更高效的模型，强调了根据数据和任务的特定特性进行模型选择的重要性。\n\
  \n表 2 显示了深度学习预训练架构在唐综合征图像测试数据上的性能。测试数据选取为唐综合征患者所有图像的 10%。\n\n表 2 用于检测唐综合征患者的不同深度学习模型性能。(#ch3.xhtml#R_tab3_2)\n\
  \n| 序号 | 模型 | 测试准确率 (%) | 敏感性 (召回率) | 特异性 |\n| :--- | :--- | :--- | :--- | :---\
  \ |\n| 1 | `VGG16` (Szegedy et al., 2016) | 94.67 | 95.77 | 90.29 |\n| 2 | `Googlenet`\
  \ (Szegedy et al., 2015) | 93.78 | 95.77 | 89.87 |\n| 3 | `Inception V3` (He et\
  \ al., 2016) | 92.22 | 93.42 | 90.29 |\n| 4 | `Resnetl8` (Xie et al., 2017) | 93.11\
  \ | 93.89 | 91.98 |\n| 5 | `Wide Resnet` (Sler et al., 2018) | 95.11 | 93.89 | 93.67\
  \ |\n| 6 | `Squeezenet` (Tan & Le, 2021) | 91.11 | 89.20 | 93.25 |\n| 7 | `Densenet`\
  \ (Liu et al., 2021) | 93.11 | 95.30 | 91.14 |\n| 8 | `Resnext` (Swanson, 1997)\
  \ | 93.33 | 96.24 | 91.56 |\n| 9 | `Mobilenet` (Cayli, 2023) | 91.33 | 95.77 | 95.78\
  \ |\n| 10 | `Efficient Netv2` (Simonyan & Zisseman, 2014) | 95.11 | 94.83 | 93.2\
  \ |\n| 11 | `Swin Transformer` (Zagoruyko & Komodakis, 2016) | 93.11 | 94.37 | 92.40\
  \ |\n\n我们的实验揭示，`EfficientNetV2` 和 `Wide ResNet` 的高性能指标与 Cao et al.(12) 的结果一致，他们证明了\
  \ EfficientNet 架构通过复合缩放优化了准确率和效率。同样，Uddin et al. (2019)) 证明了 Wide ResNet 模型由于宽度的增加而具有优越的性能，这使得它们拥有更多的特征图来捕捉数据中的复杂模式。我们的发现支持了这些结果，因为网络的深度和宽度都有助于对细节进行更复杂的分析，例如医学诊断中。相比之下，我们的实验在\
  \ Swin Transformer 上的成功有助于日益增长的文献 ([Szegedy et al., 2016))，这表明 Transformer 可以很好地处理图像数据上的全局依赖关系。\n\
  \n\n\n\n这种能力在医学影像和诊断中最为有用，例如，对 `DS` 等疾病的诊断通常取决于那些看似细微但分布在整个面部区域的特征。研究将儿童面部分析加入 Transformer\
  \ 模型的应用列表中，证明了它们可以与 `CNN` 形成互补：能够捕捉不同类型的空间层次结构和依赖关系。我们测量了延迟和计算成本，以评估模型在移动端使用的实用性。`EfficientNetV2`\
  \ 的轻量化架构在保持较低内存占用的情况下实现了高准确率，使其适用于移动端使用。在中端移动设备上，推理时间低于 `0.5` 秒，因此在实时应用的实际应用中是高效的。因此，我们的发现不仅与近期关于先进深度架构和技术在图像识别中强大能力的研究相一致，还将这些发现扩展到了儿童医学诊断中。通过尖端\
  \ AI 技术，我们的研究为改进 `DS` 的早期诊断和干预策略做出了贡献，这可能会改善患者的预后和质量。\n\n## 结论与未来工作\n\n我们的研究表明，即使是如\
  \ `EfficientNetV2`、`Wide ResNet` 和 `Swin Transformer` 等先进的 AI 基准模型在通过儿童患者面部图像诊断唐氏症方面也是准确的。高准确率和稳健的性能是使其在神经发育障碍早期诊断过程中具有价值的两个因素。我们的研究通过采用最先进的深度学习技术，弥补了现有诊断方法论的空白，并为增强患者护理和干预策略提供了一条良好的途径。此外，在\
  \ `Android` 和 `iOS` 平台上基于我们的 AI 基准开发移动应用程序，在诊断工具的广泛传播和获取方面展现了巨大的前景。\n\n通过将训练好的模型集成到用户友好的界面中，医疗保健专业人员、护理人员甚至患者本人都可以利用\
  \ AI 的力量及时识别 `DS`，以便进行早期干预和支持。此类移动应用程序可以作为临床环境中的非常有用的工具，也可以用于社区健康倡议和欠发达地区的远程医疗服务。除了其直接的临床应用外，基于\
  \ AI 的 `DS` 诊断工具的出现为心理健康研究和实践的更大背景做出了贡献。这些工具以非侵入性、高效且易于获取的方式，引导了神经发育疾病更早的干预策略，能够真正影响受影响个体的生活。\n\
  \n此外，此类工具产生的数据也将有助于开展大规模流行病学研究和纵向研究，从而对 `DS` 及相关疾病的患病率、进展和结果提供见解。未来的工作将使用更多数据集，例如\
  \ (Iandola et al., 2016)。本文标志着利用 AI 技术解决医疗领域此类重大问题（特别是神经发育障碍）的重要一步。通过将量子云计算上的尖端深度学习方法与现实临床需求相结合\
  \ (Minitab 1995)，我们证明了 AI 如何转变诊断过程并改善患者结果。在我们努力有效改进这些方法时，其波动将在心理健康研究、临床实践和公共健康倡议中产生巨大的影响，开启全民个性化且易于获取的医疗的新时代。\n\
  \n## 局限性\n\n虽然本研究为利用 AI 进行 `DS` 的非侵入性识别提供了良好的潜力，但必须承认研究中的某些缺点。\n\n1. **数据集的局限性：**\
  \ 尽管表型具有多样性，但在分布上是平衡的；然而，某些人口统计数据或面部特征分布（如稀有族族）注定会缺失此类此类数据集，影响其泛化能力。\n2. **图像诊断的偏差：**\
  \ 由于仅凭面部图像无法提供完整的 `DS` 诊断，模型存在风险。\n3. **移动部署的挑战：** 为了在不受控环境中获得可靠性能，模型的未来变体可以包含一些针对光线不佳的先进预处理措施。\n\
  4. **缺乏纵向数据：** `DS` 是一种随患者终生演变的动态疾病。使用纵向数据将会有帮助。\n\n\n\n\n\n*   Cao, X., W. Ye,\
