  \ American Journal of Medicine, 134(3), 361-369。\n\n# 10 解决数据集成挑战的语义网：医疗保健语义数据织\n\
  \nSivaranjani S.\n\n电子邮件：`ranjanisankar05@gmail.com`\n\nDOI：`10.1201/9781003716686-10`\n\
  \n本章介绍了一个将语义网技术集成到临床试验数据管理中的全面框架，以增强数据操作性、验证和智能检索。与依赖孤立关系数据库的传统方法不同，该框架采用了结构化的语义网技术栈，包含\
  \ `RDF`、`JSON-LD`、`SHACL` 验证、`SPARQL` 查询和基于 `SWRL` 规则的推理。通过将临床试验数据映射到 `SNOMED CT`\
  \ 和 `UMLS` 等全局本体上，该框架确保了数据的无缝集成和推理能力。此外，还应用了 AI 增强工具，如大语言模型 (`LLMs`) 和检索增强生成 (`RAG`)\
  \ 进行上下文感知的数据检索，从而提升临床研究成果。所提方法通过确保数据质量控制、实现自动推理以及促进跨数据源的知识提取，解决了现有局限性。这种结构化方法为改进临床试验数据管理提供了有效的解决方案，有助于实现更好的决策、预测分析以及跨医疗保健系统的操作性。\n\
  \n## 引言\n\n在医疗保健系统中，语义网在管理和共享知识、解决操作性问题以及增强跨系统数据集成方面发挥着至关重要的作用。对于临床试验数据，语义网技术被广泛认为是带有本体的链接数据应用。它能够丰富临床信息，实现与其他系统的无缝集成，并在各种平台之间进行高效的数据检索。最重要的是，它确保了临床数据是机器可读且有意义的，从而促进了更好的访问性和分析。\n\
  \n在全球范围内实现临床试验术语标准化是至关重要的，而这项技术提供了实现标准化的核心框架。通过整合来自多个源的数据，它有效地解决了操作性挑战，允许医疗保健和研究机构之间无缝数据交换。与传统方法（数据访问限于特定用户）不同，将语义网与临床试验数据集成可以实现全球范围访问。此外，语义搜索增强了对临床试验数据的有效检索，包括患者人口统计详情、治疗类型和程序、药物及剂量。\n\
  \n这种结构化方法允许研究人员识别临床试验数据中的模式和趋势，这在传统方法中通常是不可能的。通过利用语义网，医疗专业人员和研究人员可以做出数据驱动的决策，改进临床结果和药物开发。\n\
  \n## 相关工作\n\nKadim 等人 (2023) 开发了 `AsthmaOntoApp`，这是一个基于本体和 `SWRL` 的哮喘诊断和治疗建议 Web\
  \ 应用。该系统利用 `Protégé` 和 `OWL`（网络本体语言）对哮喘相关知识建模，并应用 `SWRL` 规则根据患者症状和风险因素推断诊断并建议治疗。该应用程序由知识库、查询模块、推理模块、诊断模块和治疗建议模块组成，确保了哮喘管理的结构化和自动化。对\
  \ 59 名哮喘诊断患者的测试显示，诊断准确率为 94.91%，治疗建议准确率为 90.9%，诊断执行耗时 3.6 秒，治疗建议耗时 15.4 秒。他们的研究强调了基于本体的推理在临床决策支持中的效率和适应性，但指出了在现有医疗保健系统中实施时规则完备性方面的挑战（Barkia,\
  \ 等， 2022）。\n\n\n\n\n\nKoroleva et al. (2019) 提出了一种基于预训练语言表示的深度学习方法，用于衡量临床试验结果的语义相似性。他们的研究利用了一个框架，通过利用\
  \ `BERT`、`BioBERT` 和 `SciBERT` 等模型来自动评估结果相似性，这对于检测结果切换和提高对核心结局集（COSs）的遵循程度至关重要。他们的研究评估了多种方法，包括基于字符串、基于本体论和基于向量的相似性度量，并将其与深度学习技术进行了比较。结果结果显示，`BioBERT`\
  \ 的性能优于其他模型，实现了 93.38% 的最高 F 值，证明了其在处理特定领域临床文本方面的有效性。然而，他们的研究也强调了挑战，例如难以区分语义接近但截然不同的结果、对高质量训练数据的依赖，以及在更广泛的临床领域进行进一步验证的必要性。他们的发现表明，深度学习模型为临床试验数据一致性提供了一种可扩展且高效的解决方案，但仍需进一步完善以解决特定领域的复杂性\
  \ (Patricoski, et al., 2022)。\n\nCarl et al. (2024) 对临床肿瘤学中的大语言模型（LLMs）进行了全面分析。他们的研究检查了\
  \ 34 篇论文中 LLMs 的各种方法论、应用和性能指标，特别关注了这些模型处理肿瘤学相关查询的效率。结果表明，由于方法论、提示技术和特定肿瘤学子领域的差异，性能存在显著不同。综述强调了\
  \ LLMs 在支持患者信息管理、治疗规划和基于临床记录的响应预测方面的潜力，强调了它们在增强医患互动中的作用。尽管具有这些优势，高错误率、信息过时和方法论不一致等挑战仍然存在，这在很大程度上是因为缺乏\
  \ LLMs 的标准化报告指南。该研究强调了完善评估框架和开发统一指南的必要性，以促进 LLMs 在临床肿瘤学中的无缝采用。\n\nVanitha et al.\
  \ (2023) 引入了一种混合方法，将基于本体论的 (Wang, et al., 2022) 推理与支持向量机（`SVM`）分类器相结合，对热带气旋（TC）路径进行分类。他们的研究提出了气旋路径本体（TCTRO），通过\
  \ `SWRL`（语义网规则语言）促进语义推理。从本体推导出的见解有助于优化分类的特征选择。提出的模型根据路径形状将气旋路径分为四种类型：直线、准直线、弯曲和蜿蜒形。使用\
  \ `IBTrACS` 数据集（1980-2019）进行性能评估表明，经增强的 `SVM` 分类器实现了 98.3% 的准确率，超过了 `Random Forest`\
  \ 和 `KNN` 等传统分类器。虽然该研究强调了本体驱动分类的有效性，但也强调了需要结合额外的气象属性，以提高对气旋登陆的预测能力。\n\nAmith et\
  \ al. (2021) 开发了一种使用 `SWRL` 处理知情同意权限的本体驱动方法。他们的研究扩展了知情同意本体（`ICO`），以支持生物医学研究中管理和结构化同意相关信息的自动推理。通过利用\
  \ `SWRL` 规则，该框架可以检测知情同意文档中的隐含关联，增强其语义表示。该研究检查了来自“All of Us”研究计划的四个用例，展示了 `ICOs`\
  \ 如何通过链接特定的参与者、行动和条件来应用。发现强调了基于本体论的推理在完善软件系统内同意管理方面的优势。然而，作者也强调了某些局限性，包括规则覆盖的缺失以及对权限相关结构进行进一步标准化的必要性。\n\
  \nKhan et al. (2017) 引入了 `SAFE`，这是一个基于 `SPARQL` 的查询联合系统，旨在确保医疗和生命科学中 `RDF` 数据立方具有策略感知的访问控制。他们的研究解决了在保持数据安全和所有权的同时，整合来自各种来源的敏感临床数据的问题。`SAFE`\
  \ 框架包含了一种优化的源选择方法，通过过滤掉未经授权和无关的数据源来增强查询执行。通过利用图级访问控制，系统根据用户权限限制对数据集的访问。使用真实临床数据的实证评估表明，`SAFE`\
  \ 增强了查询性能和安全性，与传统的联合引擎相比显著缩短了执行时间。尽管具有优势，该研究也承认了频繁更新数据的挑战，以及处理大规模分布式临床数据集时提高可扩展性的需求。\n\
  \nCorrea et al. (2010) 开发了 `AGUIA`，这是一个通过语义网技术管理临床试验数据的自主图形用户界面（`GUI`）组装系统。该系统利用资源描述框架（`RDF`）和自底向本体驱动方法动态生成处理多种生物医学数据集的\
  \ Web 界面`AGUIA` 利用 `S3DB` 框架，通过将领域本体组件与图形规则链接来实现自动生成 GUI。该研究证明了系统在安德森斯森癌症中心整合临床、人口统计和生物分子数据的能力，确保了改进的数据互操作性和用户适应性。结果强调了\
  \ `AGUIA` 根据预定义的本体结构自动组装多个用户特定界面的能力，从而减少了手动开发工作。然而，局限性包括可扩展性挑战，以及在处理复杂且不断变化的生物医学本体时进一步完善的需求。\n\
  \n## 语义网概述\n\n在当今这个新兴的世界中，存在大量非结构化或无意义的数据，语义网在将原始数据转换为意义信息方面发挥着非常重要的作用。它确保数据是互联的且可以被机器理解，从而促进更好的知识表示。语义网技术通常被称为链接数据（Linked\
  \ Data），因为它连接了各种数据集，将其转换为结构化的知识网络。它是万维网（`WWW`）的扩展，通过提供关于内容或数据的元数据（描述数据），使机器能够有效地处理和解释数据。\n\
  \n## 语义网框架工具\n\n\n\n\n语义网（Semantic Web）由一组强大的技术栈组成，能够实现高度结构化、机器可理解的数据链接和推理。这些工具支持将非结构化的临床试验数据转换为有意义的知识，促进智能数据检索和决策。本节概述了关键的框架工具和层——从结构化数据格式、唯一标识符到本体论集成和人工智能（AI）增强的推理——用于构建医疗领域的可互操作、智能系统。这些工具强制语义一致性并支持动态知识推理的能力，使其成为下一代临床应用至关重要的工具。此外，它们与标准化医学词汇的兼容性确保了数据在不同平台上是可重用、可查询且互操作的。这些技术共同构成了语义生态系统的基础，支持可扩展、自动化和智能化的医疗数据管理。最常用的语义网框架工具如下：\n\
  \n![Fig. 1 Semantic Web Framework Tools.](img/fig10_1_B.jpg)\n\n图 1 语义网框架工具。\n\n\
  下面，我们将详细解释语义网框架在临床试验数据和 AI 增强检索系统中是如何运作的。架构中的每一层都起着特定的作用，例如数据互操作性、推理、完整性和智能检索。\n\
  \n### 结构化互联数据网\n\n这是基础层，是结构化和机器可理解知识表示的基础。这一层使得跨多个源的临床试验数据相互关联，它们不再是孤立，而是以链接和语义结构化数据的形式存储。通过实施\
  \ `RDF` 和链接数据（linked-data）原则，该层增强了跨源的无缝集成和数据互操作性。在存在多个患者数据的数据库中，通过此层可以使用唯一标识符（`URIs`）将所有数据链接，允许研究人员、临床医生等跟踪患者在多次试验中的参与情况，维护数据的一性和安全性。这种结构化表示增强了数据的可用性，使\
  \ AI 驱动的推理成为，并确保临床知识可以在不同平台之间轻松共享。\n\n### 文档格式类型\n\n文档格式层定义了各种结构化数据格式，用于以语义和互操作的方式存储、交换和构成临床试验信息。该层确保了来自不同来源（如医院、制药公司和研究机构）的数据以标准化格式存储，以便在语义网框架内进行无缝集成和检索。\n\
  \n对于语义数据表示，基于 `RDF` 的格式如 `JSON-LD`、`RDF-JSON`、`RDF-XML` 和 `RDF-Turtle` 被广泛使用。这些格式允许临床试验数据以机器可读的方式结构化，促进了生物医学数据库与本体之间的互操作性。此外，对于特定领域的医疗应用，标准化格式如快速医疗互操作性资源\
  \ (`FHR`)、分析数据模型 (`ADaM`) 和研究数据表模型 (`SDTM`) 至关重要。这些格式在临床数据管理和监管提交中被广泛采用，确保试验数据符合全球标准。\n\
  \n通过使用这些结构化格式，可以高效地查询、推理临床试验数据并与现有生物医学知识图谱链接，实现医疗研究中 AI 驱动的洞察和高级决策。\n\n### 句子标识符\n\
  \n这是一个关键层，在链接生物医学实体方面起着重要作用，确保临床试验数据被唯一标识并在语义网框架内可访问。它们依赖于 `HTTP IRIs`（国际资源标识符）和\
  \ `URIs`（统一资源标识符）来为患者、试验、药物等不同生物医学概念分配唯一且高度持久的标识符。\n\n通过使用这些 `URIs` 和 `IRIs`，临床试验数据中的每个实体都可以被全局引用，从而允许在多个医疗和研究平台之间进行无缝的数据检索、集成和共享。例如，试验中特定药物可能有一个\
  \ `URI` 将其链接到 `SNOMED CT`，确保其在不同研究中被无歧地引用。这种方法消除了歧义，增强了数据一致性，并实现了异构医疗系统之间的互操作。此外，`URIs`\
  \ 和 `IRIs` 使生物医学实体之间创建语义关系成为可能，为高级临床研究和 AI 驱动的医疗应用提供了智能查询和推理。\n\n### 抽象语言\n\n该语义网框架了一种使用\
  \ `RDF` 显示数据的标准化方法，以主体–谓语–对象（Subject–Predicate–Object）格式组织信息。这种基于三元组的模型形成了链接数据的基础，确保数据既机器可读又具有语义意义。在这种结构中，主体表示实体（如患者或临床试验），谓语定义关系（如“具有症状”或“属于治疗”），对象表示关联的值（如“瘙痒”或“癌症”）。例如，临床试验数据集可能包含\
  \ `RDF` 三元组（`(Patient123 – belongstoTreatment – Cancer)`），它以这种方式明确将患者与其医疗状况链接，使\
  \ AI 系统和应用程序能够轻松查询、分析和检索结果。通过使用这种基于图的表示，抽象语言层允许数据在多个源之间互操作、结构化和集成，从而在医疗、临床试验和数据分析等领域实现高级推理、语义搜索和\
  \ AI 驱动的洞察。\n\n### 知识查询语言\n\n语义网框架中的查询语言层负责从知识库中高效检索和分析结构化数据。它允许用户和启用 AI 的系统从本体、链接数据知识图谱中检索准确的有意义的洞察。类似于仅在关系型数据库上运行的\
  \ `SQL`，语义网数据库是为图结构设计的，其中数据以三元组（主体、谓语、对象）的形式存在。语义网生态系统中使用的主要查询语言包括 `SPARQL`、`DL\
  \ Query` 和 `SQWRL`，它们根据所需的复杂性和推理能力提供不同的用途。\n\n*   **SPARQL (RDF 知识库的协议和查询语言)**：它是基于\
  \ `RDF` 的知识图谱的高度标准化查询语言，允许用户检索、过滤和操作语义数据。它类似于 `SQL`，但专为关系显式定义的图数据模型查询设计。例如，通过使用\
  \ `SPARQL`，我们可以显示所有属于癌症治疗的患者列表。\n\n*   **DL Query (描述逻辑查询)**：`DL Query` 用于基于本体的系统，根据语义分类检索信息。它通常应用于\
  \ Protégé 等工具中基于 `OWL` 的本体中，用户可以根据其逻辑描述动态查询个体和概念。例如，检索所有“高风险患者”，其中高风险是从基于本体的规则高效推理得出的。它实现了超越传统查询的复杂推理，允许用户根据推理关系而非仅仅是显式事实来检索数据。\n\
  \n\n\n\n- **SQWRL (一种用于 OWL 本体的基于规则查询机制)** 这种语言是一种用于 OWL 本体的规则查询语言，构建在 SWRL 之上。它通过允许用户对知识库执行推理驱动的查询来扩展\
  \ OWL，通常整合了逻辑规则。我们只能查询推理输出，以避免在此创建规则。例如，识别超过 60 岁并参与临床试验的患者。因此，SQWRL 根据年龄标准了分类为“高风险”的患者列表。\n\
  \n### 字典 (Dictionaries)\n\n这一层提供了更标准、更有组织的词汇，通过结构化分类系统定义数据元素的含义和关系。这一层是最重要的一层，能够避免互操作性问题，并增强自动化推理、跨临床试验、AI\
  \ 驱动的知识图谱以及生物医学研究的语义一致性。通过实现定义良好的本体，可以将多个源的数据进行链接、对齐，并能以最有意义的方式进行查询。以下是有助于此层次的字典格式：\n\
  \n- **SKOS (一种用于语义数据的知识管理系统)**\n\n    该系统主要用于管理和创建受控分类法、词汇表和主题表，这些工具讨论了概念之间的层次关系和关联关系。在临床试验中，SKOS\
  \ 可用于根据结构化词表对疾病、药物分类和试验阶段进行分类。\n\n    #1 SKOS 将“慢性病 (ChronicDisease)”定义为“癌症 (Cancer)”下的扩展概念，并有一个更具体的子类别“肺癌、乳腺癌、前腺癌”。\n\
  \n- **OWL (网络本体语言)**\n\n    OWL 通过类、属性和用于推理的规则定义正式本体。OWL 为 AI 驱动的推理和知识的自动分类提供了一个丰富的框架。在临床试验中，OWL\
  \ 可用于疾病分类和患者状况，从而为医生、研究人员等提供智能查询和决策支持：\n\n    #2 描述了如果任何个体被诊断为患任何类型的癌症，则将其归类到更广泛的癌症（Cancer）类别。\n\
  \n- **RDFS (RDF 模式)**\n\n    RDFS 的目的是通过更结构化的方式定义类、属性和层次结构来扩展 RDF。它们提供了定义模式和关系所需的的基础词汇知识。在临床试验数据中，RDFS\
  \ 可用于定义医疗医学概念之间的关系，例如将患者、疾病和患者正在接受的治疗连接起来。\n\n    #3 描述了 RDFS 表示，告知“患者 (Patient)”是“人\
  \ (Person)”的子类，确保每个患者都被识别为本体中的一个个体。\n\n- **RDF/XML (XML 格式的资源描述框架)**。RDF 表示提供了一种高度结构化的基于\
  \ XML 的格式，用于存储和交换 RDF 数据。这种格式确保了需要 XML 表示的系统之间的互操作性和数据交换。它们可以用于电子健康记录 (EHR) 和医疗保健领域的监管提交。\n\
  \n    #4 表示显示 Patient123 有有糖尿病 (Diabetes)”状况，该状况以 XML 兼容格式进行结构化。\n\n- **Turtle (一种简化的\
  \ RDF 序列化格式)**。Turtle 格式是一种易读的格式，用于高效编写 RDF 三元组，并简化知识图谱的创建和集成。它用于存储结构化的临床试验数据以进行语义查询。\n\
  \n    #5 描述上述 turtle 结构解释了“Patient123 患糖尿病”，使用更简单的 RDF 格式编写。\n\n### 知识推理语言 (Knowledge\
  \ Inference Language)\n\n语义网框架中的知识推理语言层对于强制数据验证、逻辑推理和基于本体的推理至关重要。它确保系统内的结构化知识遵循预定义的逻辑限制和规则，允许基于语义关系进行智能决策。这一层在临床试验、AI\
  \ 驱动的应用和知识图谱中特别有用，这些领域需要自动验证和推理。规则语言层中使用的三种主要技术如下：\n\n- **SWRL (语义网规则语言) – 应用逻辑规则**\n\
  \n    SWRL 是一种强大的基于规则的语言，允许在 OWL 本体上定义逻辑条件和推理。它通过启用 IF-THEN 逻辑来扩展 OWL，可以根据现有关系自动推理新知识。通过使用\
  \ SWRL 规则，我们可以根据患者的年龄和医疗状况识别参与临床试验的患者。\n\n    ## 6 推导出如果患者年龄大于 60 岁，规则会自动将该患者分类为高风险患者；这种方法非常准确，知识将存储在\
  \ RDF 文件本身。因此，SWRL (Fadillah, et al., 2024) 有助于实时分类、使用内置的 `SWRLB` 函数进行聚合以及临床环境中的决策支持。\n\
  \n- **SHACL (形状约束语言) – RDF 数据验证** SHACL 用于通过对数据实施结构性约束来验证 RDF 图。它确保数据遵循预定义的模式，防止知识库中的不一致和错误。SHACL\
  \ 确保每个临床试验记录都有有效的试验 ID，且至少有一个患者与其关联。\n\n    #7 描述了 SHACL 形状表明每个临床试验（Clinical Trial）必须至少有一个\
  \ Trial ID（字符串）和至少一个参与者。这防止了数据缺失或不完整，确保知识库中只存储有效的试验记录 (Kober, et al., 2022)。\n\n\
  - **OWLReady2 – 基于本体的动态推理** OWLReady2 是一个基于 Python 的框架，允许在 OWL 本体上动态执行推理。它将本体推理与实时\
  \ AI 应用集成。该包根据属性自动将药物分类到类别中。#8 推导出如果某种药物会导致嗜睡，系统会自动推断它是止痛药。\n\n    定义规则后，本体将应用推理，这意味着如果一个\
  \ `Drug (药物)` 有副作用 `Drowsiness (嗜睡)`，根据逻辑规则它将被分类为 `Painkiller (止痛药)`。\n\n### 本体层\
  \ (Ontology Layer)\n\n语义网框架中的本体层在标准化医学概念方面起着至关重要的作用，确保临床试验、医疗保健和生物医学研究中的互操作性、一致性和智能推理。本体提供了结构化词汇，以机器可理解的格式定义疾病、治疗、程序和关系。通过使用标准的临床试验本体，不同的数据集可以在各种医疗系统之间无缝地集成、查询和分析。在许多全球本体中，下面描述了三种主要的本体。\n\
  \n- **SNOMED CT (一种用于医疗保健数据的全球认可的医学词表)**\n\n    SNOMED CT 是一种全球认可的医学术语标准，提供了一套完整的临床状况、程序和观察结果。它通过定义医学概念之间的精确关系，实现了医疗保健应用中的语义互操作性。SNOMED\
  \ 本体用于标准化临床试验中提到的疾病和程序。\n\n    #9 表示解释了癌症（Cancer）被归类在慢性病（Chronic Diseases）下，并与其\
  \ SNOMED CT 代码 `363346000` 相关，确保了不同系统间术语的一致性 (Hong, et al., 2021)。\n\n- **UMLS (一种用于生物医学和临床术语的知识表示模型)**\n\
  \n\n\n\n\nUMLS（统一医学语言系统）是一个全球性的本体论，它整合了各种医学术语，将不同分类系统（例如 `SNOMED CT`、`MeSH`、`ICD-10`）中的对应概念关联起来。它提供了医学术语之间的语义关系，允许研究人员在不同本体之间映射等效术语。该本体被用于在多个本体之间映射等效疾病名称，以实现互操作性。\n\
  \n#10 “癌症”与其在 `SNOMED CT` (363346000)、`ICD-10` (El 1) 和 `MeSH` (D003920) 中的等效表示相关联，确保不同的医疗机构能够正确识别同一概念。\n\
  \n还有其他全球本体论，其中仅解释了两个，剩下的我们将进一步介绍。\n\n## AI 集成层\n\nAI 集成层利用人工智能驱动的工具在语义网框架内实现智能数据检索、自动推理和决策支持。通过整合以下内容，它增强了临床研究、医疗分析和知识管理：\n\
  \n*   `LLMs`（大语言模型）：实现自然语言理解和上下文洞察。\n*   `RAG`（检索增强生成）：将语义搜索与生成式 AI 结合，实现准确的知识检索。\n\
  *   `Vector Databases`（`FAISS`、`ChromaDB`）：支持对非结构化生物医学数据的快速相似搜索。\n*   `LangChain`：促进\
  \ AI 驱动的检索工作流，将语义搜索与结构化本体数据集成。\n\n此层桥起了人工智能与语义网技术，允许在临床试验、知识图谱和医疗应用中进行智能、上下文和自动决策\
  \ (Jiang, et al., 2022)。\n\n## 语义网工具\n\n语义网使用各种工具和框架进行推理、验证、查询、集成和层次化数据表示。这些工具在从链接数据中提取知识方面起着至关重要的作用，对于决策制定、知识图谱构建、临床或生物医学研究等。以下是创建知识库的语义网工具：\n\
  \n1.  `Protégé`：这是一个广泛使用的本体开发工具，用于可视化基于 `OWL` 的本体。\n2.  `Apache Jena`：这是一个旧的 `Java`\
  \ 框架，已用于构建语义网应用，并支持 `RDF`、`SPARQL`、`OWL` 和推理引擎。\n3.  `TopBraid Composer`：使用此工具开发语义网本体和语义网应用，它实现了数据集成和推理。\n\
  4.  `RDF4J`：这是一个高性能的 `JAVA` 框架，用于处理 `RDF` 数据，用于查询和存储知识图谱。\n\n这些工具有助于创建、管理和查询链接数据，促进生物医学研究、临床试验和企业知识管理等领域的自动推理、AI\
  \ 集成和决策支持系统的发展。\n\n### Protégé 中的语义网\n\n`Protégé` 是一款强大的软件应用程序，用于构建层次类关系，以创建机器可理解的知识图谱。它完全用\
