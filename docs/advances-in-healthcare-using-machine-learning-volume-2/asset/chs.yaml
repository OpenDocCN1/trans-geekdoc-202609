  \n通过利用基于模型估计的 `ML` 技术，宫颈癌诊断方法可能会变得更加自动化、精确和高效时。为了更方便地检测宫颈癌，必须改进个性化的筛查方法。仔细检查高风险的人群并考虑相关因素是检测中的关键步骤。这些基于模型的估算的目标是减少幸存者的心理压力。目前，对宫颈癌的更好理解取决于早期识别。利用一系列分类算法和特征选择过程已经产生了比以前方法更好的结果。本文展示了使用\
  \ `UCI Machine Learning Repository` 的结果。以逐渐选择的属性为起点，使用该数据集运行了 10 种 `ML` 方法。在实验的第一阶段，应用了若干\
  \ `EL` 技术。这些策略包括 `hard voting`、`soft voting` 和加权平均法。我们改进后的结果 F1 分数为 96.97%，准确率为\
  \ 95.45%，精确率为 94.12%，敏感性为 100%，特异性为 92.85%。得出这些结论使用了相同的数据集。研究结果提供了更多证明，所提范式是创新的。为了辅助经验分析，文章已更新\
  \ ROC 曲线和相关的 0.982 AUC 值。本所提研究的目标是帮助医学专家在早期识别这种特定癌症，以便快速完成治疗。本研究尝试使用 `ML` 技术识别和诊断宫颈癌。每项研究都有优缺点。如果结果良好，必须考虑一些因素。由于研究完全基于单一数据集，可能无法完全捕捉到现实世界的多样性和不可预测性。EL\
  \ 模型增加了准确性，但不易于理解。作为示例来阐明预测的模型被称为可解释智能。遗憾的是，这种方法尚未应用于临床环境。这项工作具有进一步开发的潜力，通过结合 `ML`\
  \ 算法实现高度诊断。\n\n## 参考文献\n\n* Al Mudawi, N. and Alazeb, A. (2022). A model for predicting\
