  \n## 利益冲突\n\n作者不存在利益冲突。\n\n\n\n\n顺疗疗法是一种基于人体内在自愈机制信念，以及并将症状视为内部失衡指标的解读的医学体系。利用顺疗疗法的原理，我们提出的系统寻求为医疗保健提供一种创新的替代途径。通过采用自然语言处理（`NLP`）技术，我们的系统旨在赋予个体获取初步医疗指导的能力，而无需立即依赖专医生。我们使用机器学习技术开发了一种新颖的顺疗药物推荐系统。由于目前没有综合的数据集，我们最初的重点是构建一个庞大的数据集，将症状与相应的顺疗法治疗关联起来。该系统的工作原理是收集用户报告的症状，并利用我们源自权威顺疗法参考文献的新型数据集，通过\
  \ `NLP` 方法预测最合适的药物。我们的目标是建立一种先进的医疗保健解决方案，能够根据每个患者的症状概谱提供个性化的顺疗法治疗建议。该系统具有可靠、高效且具有成本效益的潜力。\n\
  \n## 引言\n\n顺疗疗法是一种替代疗法。“顺疗疗法”（Homeopathy）一词源于希腊语单词“homios”和“pathos”，分别意味着“相似”和“痛苦”。它建立在人体自然具有自愈能力的原理之上。它还基于症状指示内在内部失衡的信念。自\
  \ 18 世纪引入以来，顺疗疗法在印度稳步普及，到 2016 年，已有超过 20 万顺疗师在执业，这使其成为那里第三种受欢迎的医疗保健方法（Ernst, 2016）。目前，顺疗药物以多种形式存在，如药丸、滴剂、乳膏等。它们通常由植物、矿物或各种动物产品的高度稀释物质制成。许多人将其传统医学的补充疗法使用。\n\
  \n随着顺疗疗法的普及不断增长，迫切需要一种更高效、有效的系统，根据患者的症状（更具体地说，是异常生理状况）推荐合适的顺疗药物。本研究提出了一种创新的方法，利用先进的机器学习（`ML`）和自然语言处理（`NLP`）技术帮助个体对顺疗治疗做出知情决策，特别是在获得认证医疗专业人员有限的情况下。我们提出了一种顺疗药物推荐系统，使用统计方法根据给定的症状描述建议最佳的顺疗治疗。建议的系统通过询问用户症状并使用\
  \ `ML` 算法进行分析来工作。我们努力中的一个主要挑战是缺乏将特定的顺疗药物与其解决的症状相关联的数据集。为了应对这一挑战，我们艰苦地构建了一个全面的数据集，将症状与相应的顺疗药物关联起来。数据取自流行的顺疗参考书。该系统使用这一新型数据集并根据提供的症状预测最合适的顺疗药物。该框架使用了\
  \ `NLP` 向量化技术（`Word2Vec`、`BERT`、`GloVe`、`TFIDF`）和相似性测量技术（`Cosine Similarity`）。我们的目标是创建一个智能医疗保健系统，能够根据每个患者的独特概谱提供个性化的顺疗药物建议。那些倾向于通过避免小病医疗帮助而忽视健康的人可以从该系统中受益。本研究旨在弥合传统顺疗实践与技术进步之间的差距，以便让更广泛的受众能够理解顺疗治疗。\n\
  \n### 动机\n\n诊断和治疗疾病的传统方法通常耗时且昂贵。当患者无法获得医疗专家时，情况会变得糟糕。克服这一挑战的一种实用策略是开发一种人工智能驱动的系统来诊断疾病和处方药物。该领域已经见过大量的研究，但对顺疗法的自动化系统的关注少于全医医学。我们的研究旨在填补这一空白，强调了对人工智能（`AI`）驱动的顺疗医疗保健解决方案研究的需求。顺疗疗法由于其成本比西医低而被更广泛使用，因此我们开展这项研究的动机。`NLP`\
  \ 能够解释患者描述的症状，同时考虑到其严重程度和背景。这一功能使系统能够精确记录症状并为患者提供个性化的药物建议。通过使用这种 AI 工具可以确保人们获得及时且适当的治疗建议。\n\
  \n### 贡献\n\n受推荐顺疗药物的自动化系统需求的驱动，我们专注于开发一种使用 `NLP` 的解决方案，通过分析用户报告的症状来提供药物建议。本研究的主要贡献是：\n\
  \n*   汇编了一个庞大且精细策划的数据集，将症状映射到相应的顺疗药物。为此，使用了两本备受推崇和广泛引用的顺疗文献以确保信息的真实性。值得注意的是，此前没有系统利用过这些特定来源进行此类工作。\n\
  *   利用 `NLP` 和统计模型实现了一种新颖的顺疗系统，用于分析自然语言症状描述。\n*   评估了各种 `NLP` 向量化技术，如 `Word2Vec`、`BERT`、`GloVe`\
  \ 和 `TF-IDF`，以确定分析症状和推荐药物的最有效方法。\n*   对向量化技术进行系统比较，以确保系统同时实现高准确率和低计算成本，适用于部署在资源受限的环境中。\n\
  *   引入了一个可靠、高效且成本效益的系统，独特地造福顺疗从业者和信徒。这具有特别意义，因为大多数现有的自动化医疗系统集中在西医上，之前的研究对顺疗法的关注极少。\n\
  \n## 文献综述\n\n顺疗疗法由 18 世纪的德国医生萨缪尔·哈哈尼曼（Samuel Hahnemann）建立。他拒绝了当时的医学实践，因为他认为它们有害且无效。因此，他开发了顺疗疗法，作为一种更安全、更自然的治疗方法。这种药物体系建立在“同类相治”（like\
  \ cures like）原理的基础上，即引起健康人症状的物质被用于治疗具有相当症状的疾病（Fisher, 2012）。这些药物经过了大幅稀释，被认为能刺激人体固有的自愈能力。顺疗疗法相信人体内在自愈的能力，将疾病症状视为人体生命力失衡或干扰的自然反应（Ely\
  \ et al., 1999）。顺疗治疗根据个人症状进行精细定制，旨在恢复平衡并激活人体的自愈机制。\n\n\n\n自动医疗诊断和临床决策支持系统一直是几十来的研究课题。这些系统包含了专家系统，依赖于包含相关信息、规则和关联的知识库。此外，某些系统采用\
  \ ML 技术，从过去的临床病史中获取见解以预测结果。Corny et al. (2020) 将 ML 与基于规则的专家系统结合，构建了一个混合临床决策支持系统。他们的系统通过针对高风险患者，以良好的准确率对处方进行检查。他们的目标是使处方错误的拦截变得更加可靠。Bhoi\
  \ et al. (2021) 开发了一个名为 `PREMIER` 的两阶段个性化药物推荐系统。他们使用电子健康记录（`EHR`）数据进行药物推荐。他们还使用了患者病史和处方信息。药物相互作用和共发生情况被建模为图谱，以便更好地理解药物之间的关系。Asghari\
  \ Varzaneh and Hosseini (2023) 提出了一种用于糖尿病诊断的模糊专家系统。他们通过 Harris 霍克斯优化算法优化了模糊逻辑规则。\n\
  \n有些研究专注于临床问答系统。这些系统的灵感源于医生通过提问收集患者信息以诊断的实践。例如，`WatsonPaths` 由 Lally et al. (2017)\
  \ 开发。它通过对图模型进行概率推理，提供了医疗诊断和治疗建议。它将基于场景的问题拆解为更小的子问题。此外，研究人员努力使用 `MedEx` (Xu et al.,\
  \ 2010), `cTAKES` (Savova et al., 2010) 和 `MetaMap` (Aronson & Lang, 2010) 等工具从\
  \ `EHRs` 中提取信息。这些工具通过解释非结构化临床文本提供决策支持。\n\n研究人员探索了从社交媒体平台提取医学相关信息。这承认了在线健康信息寻求的普及。他们使用监督技术检测疾病报告事件，并使用无监督方法识别在线医学文本中的医学实体。基于深度学习的方法也被用于从健康寻求者的问题中推断可能的疾病。近年来，`NLP`\
  \ 已应用于各种健康和患者护理相关领域。为了增强临床决策和定制化的癌症治疗方案,Jensen et al. (2017) 创建了一个系统，利用电子病历中的非结构化文本数据预测疾病进展。Luo\
  \ et al. (2021) 在中医（`TCM`）文本相似性任务中使用带有 `ERNIE-pretrained` 字符向量和双向长短期记忆（`BLSTM`）网络的双向时间孪生网络（`BTSN`）来捕捉上下文语义。Mai\
  \ et al. (2023) 创建了一个决策支持系统。医学获得了大部分关注。尽管如此，关于顺疗法的一些工作，如 Subbulakshmi and Saha (2022)]\
  \ 也建立了系统。\n\n## 数据集\n\n数据集的信息取自关于顺疗法的两本书：`Keynotes And Characteristics With Comparisons\
  \ of Some the Leading Remedies of the Materia Medica` 和 `Leaders In Homopathic Therapeutics`。这两本书分别于\
  \ 1871 年和 1899 年出版。这些文本被认为是顺疗法领域的基石。`Keynotes And Characteristics` 突出了各种药物的主要症状（`keynotes`）和整体属性（`characteristics`）。它为我们提供了关于药物独特性质的关键见解。它有助于药物的区分及其在治疗目的中的选择。而\
  \ `Leaders In Homopathic Therapeutics` 更详细地解释了流行药物的临床用途。它包含了对指征、倾向和特征症状的深入分析。这两本书的作者分别为\
  \ Henry Clay Allen 和 E. B. Nash。我们仔细学习了这些书籍，为研究收集重要信息。此外，我们还咨询了医学专家以更好地理解症状。这些咨询还帮助我们对症状之间的细微差别有了更细致的理解，有助于我们对数据进行分类和分析。我们对这些数据进行了相应的清洗和处理，以确保其准确性和可靠性。\n\
  \n\n\n\n然而，我们在研究中选择了 Allen 和 Nash 的 `Materia Medica`（药物动力学）。这是因为他们在书中对顺势法疗法提供了系统的阐述。Allen\
  \ 的书包含了对药物的精确描述，侧重于它们的生命症状和临床指征。Nash 的书则通过他在顺势法药物方面的实践见解补充了这一点。他尝试通过比较的方法，使人们更深入地理解药物之间的关系及其在临床环境中的应用。这些文本共同确保了全面的视角。这两本书的结合完美契合了我们研究的分析需求。\n\
  \n表 1 显示了从这两本书中收集信息的药物数量。数据集的结构是，每本书都由一个单独目录表示。在这些目录中，有多个文本文件，每个文件专门针对特定的药物。对于`Keynotes\
  \ and Characteristics`（要点与特征）一书，共有 150 个文本文件，每个文件提供了一种特定药物的详细描述。同样，`Leaders in Homoeopathic\
  \ Therapeutics`（顺势法治疗的先驱）包含 211 个文本文件，每个文件提供关于不同药物的全面信息。这种组织化的结构便于访问和管理信息以进行进一步分析。\n\
  \n表 1 从顺势法文本中提取的药物计数。⏎\n\n| 书名 | 作者 | 提取的药物数量 |\n| --- | --- | --- |\n| 药物动力学中某些领先药物的要点与特征及比较\
  \ | Henry Clay Allen | 150 |\n| --- | --- | --- |\n| 顺势法治疗的先驱 | Eugene Beauharnais\
  \ Nash | 211 |\n\n## 机器学习方法\n\n### Word2Vec (词向量化)\n\n这种自然语言处理（NLP）方法将单词转换为词嵌入（数值向量）。它基于这样一个观点：含义相似的词倾向于出现在相似的上下文中。Word2Vec\
  \ 是一个浅层神经网络，包括一个输入层、一个隐藏层和一个输出层。Word2Vec 的两种主要架构是 Skip-gram 和连续袋模型 (CBOW)。Skip-gram\
  \ 预测给定目标周围的词。而 CBOW 通过观察其周围的上下文词来预测当前单词。在这种结构中，出现得较近的词被赋予更大的权重 (Abubakar & Umar,\
  \ 2022)。输入层获取目标词周围上下文词独热编码向量 (`v[e]`) 的平均值。在隐藏层或投影层中，产生向量 `v[h] = W ◊ v[e]`，其中 `W`\
  \ 是维度为 `V` × `E` 的权重矩阵（`V` 为词汇量，`E` 为嵌入维度）。该向量是上下文的密集表示。在输出层中，执行以下操作：`u = W ^T ◊\
  \ h`。给定上下文，向量 (`u`) 的每个分量 (`u[x]`) 代表单词 (`x`) 作为目标单词的未归一化对数概率。最终输出代表词汇表中每个单词作为目标单词的概率，是通过\
  \ softmax 函数（公式 1）获得的，该函数计算了单词 (`x`) 为预期单词的概率。\n\n```\nif (condVar > someVal) {console.log(\"\
  xxx\")}\n```\n\n### TF-IDF (词频-逆文档频率)\n\n该方法评估一个单词对于集合或语料库中某个文档的重要性。它是通过将术语在文档中的频率乘以该术语在语料库中频率的倒数计算得。词频\
  \ (TF) 衡量术语在文档中出现的频率，而逆文档频率 (IDF) 衡量术语跨整个语料库中的稀有程度。高 TF-IDF 分表示该单词在特定文档中频繁但在整个语料库中稀有，表明它对该文档具有很高的信息量。\n\
  \n### BERT (基于 Transformer 的双向编码表示)\n\nBERT 是一种基于 Transformer 的模型，用于自然语言处理。它利用 Transformer\
  \ 架构来理解句子中的单词上下文。BERT 的双向性允许它同时查看前后的单词。原始 BERT 在大型文本语料库上进行了预训练。预训练使用了两个特定任务。在掩码语言模型（MLM）中，文本中的某些单词被随机掩盖，模型被训练根据上下文预测这些掩码单词。句子预测（NSP）判断一个句子是否在逻辑上跟随另一个。这有助于模型理解关系。嵌入层是模型的初始部分，将输入标记转换为固定大小的向量。\n\
  \n### GloVe (词表示全局向量)\n\nGloVe 通过分析大型语料库中的词共现频率来生成词嵌入。它利用了全局统计数据。它构建了一个共现矩阵 (`M`)，其中每个元素代表两个单词在特定上下文窗口内出现的频率。通过对该矩阵进行分解，GloVe\
  \ 生成了词向量或嵌入，反映了词之间的统计关系。这些嵌入在多维空间中将语义相关的词聚集在一起。不相似的词则距离得较远。在训练过程中，优化代价函数，使得生成的词向量能够保持词共现概率的比率。\n\
  \n### 余弦相似度\n\n余弦相似度衡量两个向量之间角的余弦值。它用于确定两个文档或单词之间的相似性。值为 1 表示向量相同，而值为 0 表示它们正交。\n\
  \n\n\n\n\n该技术用于确定内积空间中两个非零向量的不可区分性。从本质上，它衡量的是两个向量之间角的余弦值。两个向量（`P` 和 `Q`）之间的余弦相似度计算使用公式\
  \ 5。余弦相似度得分为 1 表示向量指向相同方向或相同；分分为 0 表示向量正交或垂直，没有相似性；分分为 –1 表示向量方向相反且完全不相似。\n\n…(5)\
  \  \n\n$$\\\\text{cosine~similarity} = \\\\frac{P \\\\cdot Q}{\\left\\\\| P \\\\\
  right\\\\}\\\\left. \\\\cdot \\\\right|\\\\left. Q \\\\right\\\\|}$$\n\n## 提议的方法\n\
  \n图 1 展示了所提系统的实现过程。该系统首先接收用户以疾病症状自由文本描述形式给的输入。通过一个包含发热、咳嗽、头痛、鼻血、疼痛等常见症状的数据库，系统从用户的描述中提取相关症状。在阶段\
  \ 1 中，这些提取的症状被用作关键词在顺势疗法药物集中进行搜索，检索与这些关键词关联的药物。在阶段 2 中，原始用户输入与阶段 1 提取的文本数据一起嵌入。然后，进行相似性分析，识别并向用户推荐与其输入相似度得分最高的两种药物。两个阶段均使用\
  \ `Python` 3 实现。各阶段描述如下：\n\n![Fig. 1 所提系统的流程图。⏎](img/fig11_1_B.jpg)\n\n图 1 所提系统的流程图。⏎\n\
  \n### 阶段 1：基于关键词过滤药物\n\n**数据清洗：** 数据集经过了大量的预处理和清理以标准化文本。这一过程涉及处理在标准顺势疗法书中发现缩写、换行和特殊符号。换行符被替换为空格。进行了特定的文本替换，例如将\
  \ `>` 替换为 `better`，将 `<` 替换为 `worse`。此外，包含句号的缩写（如 `Arn.`、`Ar.`）可能会在后续步骤的句子分词中产生问题，已被替换为完整术语\
  \ `Arnica Montana`。\n\n**用户输入：** 用户提供的症状描述是一段包含其症状全面且细致描述的文本。通过允许用户自然地表述症状，这种方法提高了交互的友好性和直观性。此外，它还允许报告广泛的症状，包括结构化输入表单可能无法涵盖的内容。\n\
  \n**数据预处理：** 这是任何 NLP 流程中的重要步骤，用于提高后续步骤的准确性。它将原始文本转换为可以有效分析的标准化格式。我们对用户输入的症状描述文本进行了预处理。这是使用自然语言工具包\
  \ (`NLTK`）完成的。我们使用 `Punkt` 分词器将句子分成单个单词，以便单元更易于管理。然后，为了保持全文一致性，我们删除了所有标点符号并将每个单词转换为小写。经过此处理后，`Haemorrhages`、`haemorrhages`\
  \ 和 `HAEMORRHAGES` 等词被视为相同。接下来，我们过滤掉常见的停用词，如 `the`、`is`、`in` 等。这些词在语言中非常频繁，但没有很大的上下文意义。删除这些词有助于我们关注更有意义的内容。最后，我们使用\
  \ `WordNet` 进行词形还原，将每个单词还原为其根形式或基础形式。\n\n**搜索关键词：** 采用了一种系统方法，从用户提供的症状描述中收集的标记中提取关键症状（关键词）。此步利用了一个包含患者通常提到的最常见症状的数据库，如\
  \ `fever`、`pyrexia`、`cough`、`pain`、`headache` 等。将标记直接与症状数据库中的条目进行比较以提取关键词。之后，将这些识别出的症状或关键词与顺势疗法药物数据集中的条目进行匹配。通过一个综合函数，搜索数据集中的每个文本文件，以识别指定症状的实例。在搜索操作期间，识别了包含这些症状的相关句子，以及关联的药物名称。这些搜索结果随后被组织成一个\
  \ `dataframe`，作为进一步处理的结构化格式。这个简洁的 `dataframe` 为后续的 NLP 步骤奠定了基础。生成的数据框包含了各种药物的详细信息以及配套的症状描述。例如，表\
  \ 2 提供了当用户输入 `fever` 和 `cough` 时该数据框的快照。\n\n表 2 来自 2 个症状（发热和咳嗽）的数据框样本数据点。⏎\n\n|\
  \ 药物 || 症状描述 |\n| --- | --- |\n| Terebinth | 作为疟疾的预防药物推荐… |\n| --- | --- |\n| Apis\
  \ mellifica | 间歇性热；下午 3 点寒战，伴有渴，… |\n| Mercurius biniodide | 左侧喉炎和腺疾病；… |\n| Phosphoric\
  \ acid | 这是极强度的磷酸，… |\n| Staphisagria | 发热；发作前几天极度饥饿。 |\n\n### 阶段 2：带有统计分析的上下文映射\n\
  \n**数据框文本预处理：** 新生成数据框的预处理方式与用户输入相同。数据框中 `Symptom Description` 列的文本通过删除停用词、词形还原并将整个文本转换为小写进行归一化。\n\
  \n**向量表示：** 数据框的预处理文本以及用户输入被转换为数值形式，以便应用机器学习算法。我们采用了四种替代方法：`Word2Vec`、`TF-IDF`、`BERT`\
  \ 和 `GloVe`。使用 `Gensim` 库中的 `Word2Vec` 的 `CBOW` 架构将每个单词转换为基于单词上下文的语义向量。使用 `sklearn`\
  \ 的 `TF-IDF` 向量化器计算数值评分，反映单词在整个数据框和输入中的权重。在测试了若干超参数配置以观察其对模型的影响后，我们选择了最平衡计算成本和模型效果的值。这种实验方法让我们更好地了解每个参数对最终结果的影响。表\
  \ 3 显示了 `Word2Vec` 和 `TF-IDF` 的参数和值。利用 Hugging Face 的 `Transformers` 库中的 `bert-base-uncased`\
  \ 模型，将文本的语义内容压缩为数值向量。`GloVe` 嵌入将单词转换为固定长度的向量，然后取平均值以设置代表整个句子语义的单个向量。我们使用了 `glove.6B.300d.txt`\
  \ 文件，它是在包含 60 亿词的 300 维向量的数据集上训练的。\n\n| 技术 || 参数 | 数值 |\n| --- | --- | --- |\n|\
  \ Word2Vec | vector\\_size | 100 |\n| --- | --- | --- |\n| window | 5 | |\n| min\\\
  _count | 1 | |\n| workers | 4 | |\n| TF-IDF | ngram\\_range | (1, 1) |\n| token\\\
  _pattern | r“(?u)\\\\b\\\\w\\\\w+\\\\b” | |\n| norm | l2 | |\n\n\n\n\n\n### 基于相似性分析的药物推荐\n\
  \n采用了 `cosine similarity` 指标来评估两个文档之间的相似性（即 `dataframe` 中的每条症状描述与用户提供的患者症状描述）。它有助于量化用户描述的症状与与不同物质相关的已知症状之间的匹配程度。该指标衡量的是多维空间中文本向量所形成角度的余弦值。趋于\
  \ 1 的余弦值意味着角度越小，相似度越高。每个用户输入都与数据集中的所有数据点（包括与特定药物相关的症状）进行了比较。计算相似性后，选择最相似的两个数据点或药物作为最终输出，方法与\
  \ `dataframe` 一。\n\n## 结果\n\n为了评估每种向量化技术的有效性，我们测试了 17 条作为用户输入的症状描述。测试结果如表 4。每一项代表一种独特的症状描述，源自数据集中的药物描述。我们参考数据集对预测结果进行了评估。\n\
