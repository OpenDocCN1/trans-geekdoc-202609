  \ `Fourier Transform` 对于平稳信号非常强大，但在处理非平稳生物医学信号时显得不从心。`Wavelet Transform` 通过提供多分辨率方法克服了这一问题，能够同时捕捉时间和频率信息，这对于\
  \ `ECG` 和 `EEG` 等信号的去噪和特征提取具有极价值（Rafiee et al., 2011）。`Empirical Mode Decomposition\
  \ (EMD)` 作为一种数据驱动的非线性方法，可以将信号分解为本征模态函数 (`IMFs`)，非常适合分析非平稳生物医学信号。然而，`EMD` 受到模式混合的影响，这个问题通过`集合经验模态分解\
  \ (EEMD)` 解决，该方法通过添加白噪声来稳定分解过程。`Singular Value Decomposition (SVD)` 也被用于 `EEG` 等多通道信号降噪的强大工具。这些传统技术为生物医学信号处理定了基础，但在实时、自适应场景下面临局限性，而\
  \ `ML` 已成为一种变革性力量脱颖而出。\n\n`ML` 方法通过提供自适应、数据驱动的模型来学习噪声信号的底层结构，彻底改变了生物医学信号去噪（Subasi,\
  \ 2019）。`Denoising Autoencoders (DAEs)` 是最有效的工具之一，它们利用神经网络通过学习数据的鲁棒内在特征，从噪声输入中重建清洁信号。`DAEs`\
  \ 在各种生物医学应用中表现出色，特别是在噪声不可预测且复杂的场景下。广泛用于图像处理的 `Convolutional Neural Networks (CNNs)`\
  \ 由于其能够学习数据中空间和时间模式的能力，在生物医学信号去噪中也找到了用武。`CNNs` 在实时监控系统中特别有效，例如用于 `ECG` 和 `PPG` 信号采集的可穿戴设备，这些信号往往受到运动伪迹的污染。`Support\
  \ Vector Machines (SVMs)` 虽然通常用于分类，但也应用于基于回归的去噪方法，在有限的数据集上提供高性能的去噪。`SVMs` 对于较小的生物医学数据集具有优势，因为它们可以处理高维特征空间，并在存在噪声的情况下仍提供稳健的结果。`Independent\
  \ Component Analysis (ICA)` 是一种稳健的技术，用于将混合信号分离为统计独立分量，使其对于消除 `EEG` 记录中的眼动和肌肉噪声等伪迹特别有效。`ICA`\
  \ 已证明在脑机接口应用中至关重要，在这些应用中精确的信号解释是关键。`Principal Component Analysis (PCA)` 通过降低生物医学信号的维度来补充\
  \ `ICA`，这在大规模数据集中特别有用。`PCA` 可以通过过滤掉低阶主成分来去噪，在保留信号核心特征的同时有效减少噪声。\n\n`Long Short-Term\
  \ Memory (LSTM)` 作为一种循环神经网络 (`RNN`)，由于其捕捉长程时间依赖的能力，在生物医学信号去噪中具有独特优势。`LSTMs` 对于 `ECG`\
  \ 和 `EEG` 等时间序列数据特别有效，其去噪过程受益于对跨越时间序列模式的学习。通过整合记忆单元，`LSTMs` 可以随时间保留相关信息，使其非常适合生理信号实时监控等应用，在这些应用中噪声是动态变化的。Generative\
  \ Adversarial Networks (GANs)` 已成为一种很有前景的生物医学信号去噪方法，利用生成器和判别器之间的对抗训练来生成高质量、无噪声的信号。`GANs`\
  \ 在增强生物医学图像和信号质量方面显示出巨大潜力，尽管面临训练不稳定和需要大型数据集等挑战。尽管存在这些挑战，`GANs` 已成功应用于提高 `EEG` 和\
  \ `ECG` 信号的质量，为增强诊断和监控提供了新的可能。最后，`Reinforcement Learning (RL)` 引入了一种自适应的生物医学信号去噪方法。与静态传统模型不同，`RL`\
  \ 通过与环境交互进行动态学习。基于 `RL` 的模型可以根据性能反馈实时调整其去噪策略，使其在可穿戴设备和其他实时监控系统中的应用中高效高效。`RL` 适应变化信号条件的能力能够提高去噪的准确性和稳健性，特别是在信号特征频繁波动的情况下。\n\
  \n本章全面探讨了生物医学信号分解和去噪的传统及现代技术，强调了 `ML` 在该领域日益增长的。。`Fourier Transform`、`Wavelet Transform`、`EMD`\
  \ 和 `SVD` 等传统方法是生物医学信号处理的基础，但正日益被先进的 `ML` 技术所补充，这些技术提供了更自适应和可扩展的解决方案。`Denoising\
  \ Autoencoders`、`CNNs`、`SVMs`、`ICA`、`PCA`、`LSTMs`、`GANs` 和 `RL` 代表了生物医学信号去噪的未来，为处理噪声信号提供了更准确高效的方法。随着\
  \ `ML` 继续进化，这些技术与传统信号处理方法的整合可能会导致诊断准确性、治疗效果和整体患者护理的进一步提高。本章为研究人员、工程师和医疗专业人员提供了资源，帮助他们理解生物医学信号去噪现状及其对未来医疗的影响。\n\
  \n## 生物医学信号\n\n生物医学信号是人体内部生理过程产生的电、化学或机械信号。这些信号提供了关于人体功能和健康状态的重要信息。常见示例包括监测心脏活动的\
  \ `ECG` 和追踪脑部活动的 `EEG`。对这些信号的分析对于诊断、监测和治疗各种医疗状况至关重要。生物医学信号可以是连续的（如血压或心率），也可以是离散的（如血样中特定细胞的计数）。这些信号的特征包括幅度、频率和波形携带了关键信息，可以通过分析来了解正常的生理功能或检测异常。\n\
  \n生物医学数据来自多种来源，可以大致分为以下几类：\n\n1. **电信号**：由人体电活动产生，包括：\n    * **ECG (心电图)**：监测心脏电活动。\n\
  \    * **EEG (脑电图)**：捕捉脑电活动。\n    * **EMG (肌电图)**：测量肌肉电活动。\n\n2. **机械信号**：与人体机械运动有关，例如：\n\
  \    * **PPG (光电脉搏波)**：监测组织微血管血容量的变化。\n    * **呼吸信号**：追踪呼吸模式和肺功能。\n\n3. **化学信号**：通过生化学分析检测，包括：\n\
  \    * **血糖**：用于糖尿病管理。\n    * **激素水平**：分析以评估内分泌功能。\n\n4. **成像数据**：通过各种成像技术获取，如：\n\
  \    * **MRI (磁共振成像)**：提供器官和组织的详细图像。\n    * **CT (计算机断层扫描)**：结合射线图像创建人体横截面。\n\n\
  5. **基因组和蛋白质组数据**：源自基因和蛋白质分析，这些数据类型对于理解分子机制和个性化医疗至关重要。\n\n\n\n\n每种数据类型在健康状况监测和诊断中都有特定的用途，当它们被整合到综合分析中时，通常互为补充。\n\
  \nPPG 信号是一种光学信号，用于测量组织微血管床血容量的变化，通常使用放置在皮肤上的光源和光电探测器获取。PPG 广泛应用于可穿戴设备和临床环境中的监测心血管健康，为评估心率、血氧饱和度（Sp02）和其他生命体提供了非侵入的方法。PPG\
  \ 信号在心血管监测中的意义在于能够提供心血管系统的连续实时数据。这些信号对于检测和管理心律失常、高血压和外周血管疾病等状况非常有价值。通过分析 PPG 信号的振幅、波形和频率成分，医生可以深入了解血流、动脉硬度和整体心血管功能。\n\
  \n此外，信号处理技术（如小波收缩和 ML 算法）的进步提高了基于 PPG 的监测系统的准确性和可靠性。这些创新能够更精确地检测心血管动力学的微妙变化，使 PPG\
  \ 成为现代医疗中心血管疾病早期诊断和持续管理的重要工具。\n\n## 信号分解\n\n信号分解是信号处理中的一个基础过程，涉及将复杂信号分解为更简单的成分。这种技术对于分析生物医学信号至关重要，因为这些信号通常由多个重叠的成分组成，例如不同的频带或噪声元素。分解允许从信号中提取有效信息，提高诊断和治疗决策的准确性。\n\
  \n### 傅里叶分解\n\n傅里叶变换是一种强大的数学工具，用于将时域信号分解为其相应的频率成分。这种分解允许我们在频域中分析信号，这对于理解底层的周期性、识别主频以及从信号中过滤噪声特别有用（Gomez-E.\
  \ et al., 2020）。时域信号 `x(t)` 的傅里叶变换 `X(f)` 定义为：\n\n*X*(*f*) = ∫[ − ∞]^∞*x*(*t*)*e*^(*j*2*π**f**t*)*d**t*\n\
  \n### 小波分解\n\n小波分解对于分析非平稳信号（如生物医学信号）特别有用，这类信号的频率成分随时间变化。与使用正弦基函数的傅里叶分解不同，小波分解使用的是经过缩放和平移的母波\
  \ `c(t).`\n\n连续小波变换 (CWT) 定义为：\n\n$$Wx(a,b) = \\frac{1}{\\\\sqrt{a}}{\\int\\_{-\
  \ \\\\infty}^{\\infty}x}(t)\\psi^{\\*}\\left( \\frac{t - b}{a} \\right)dt$$\n\n\
  其中：\n\n* `a` 是尺度参数，控制小波的宽度。\n* `b` 是平移参数，决定小波的位置。\n* `ψ\\*(t)` 是母波 `ψ(t)` 的复共轭。在实际应用中，通常使用离散小波变换\
  \ (DWT)：\n\n$$Wx(m,n) = {\\\\sum\\limits\\_{k = - \\\\infty}^{\\infty}x}(k)\\psi^{\\\
  *}\\left( \\frac{k - n}{2^{m}} \\right)$$\n\n其中：\n\n* `m` 代表分解层（与尺度 a 相关）。\n* `n`\
  \ 代表平移索引。\n\n小波分解允许在不同尺度上分析信号，同时提供时间和频率信息。离散小波变换 (DWT) 将信号分解为代表低频成分的近似系数和捕捉高频成分的细节系数，跨越多个层次\
  \ (Patil & Chavan, 2012; Brechet et al., 2007; Nielsen et al., 2006)。\n\n### 经验模态分解\
  \ (EMD)\n\nEMD 是一种数据驱动技术，用于将信号分解为固有模态函数 (IMF)，这些简单的振荡模式。与傅里叶或小波分解不同，EMD 不需要预定的基函数，使其特别适用于非线性和非平稳信号（Yousefi\
  \ 2019；Schiecke et al., 2015）。\n\nEMD 以迭代方式从原始信号 `x(t)x(t)x(t)` 中提取 IMF，遵循以下步骤：\n\
  \n* 定位信号的所有局部极大值和极小值。\n* 在极大值之间插值形成上包络，在极小值之间插值形成下包络。\n* 计算这两个包络的平均值。\n* 从原始信号中减去该平均值以得到细节信号。\n\
  * 如果得到的细节信号符合 IMF 标准，则将其提取为 IMF；否则，重复该过程。数学上，信号 `x(t)` 可以表示为：\n\n$$x(t) = {\\\\\
  sum\\limits\\_{i = 1}^{N}I}MF\\_{i}(t) + r\\_{N}(t)$$\n\n其中：\n\n* `IMFi` 是固有模态函数。\n\
  * `rN` 是 `N` 次迭代后的残差信号。\n\n### 集成经验模态分解 (EEMD)\n\nEEMD 是一种为了克服标准 EMD 局限性而开发的先进信号处理技术。它特别适用于分析非线性非稳信号，例如生物医学信号。通过解决\
  \ EMD 内有的模式混合问题，改进了分解的可靠性和稳健性 (Colominas et al., 2014)。\n\nEEMD 算法涉及以下步骤：\n\n1.\
  \ **加性白噪声：** 向原始信号 `x(t).` 中加入少量白噪声。这为第 `i` 次实现生成了一个新信号 `xi`：\n\n*x**i* = *x*(*t*) + *ϵ**i*\n\
  \n其中：`ϵi` 是均值为零且标准差较小的白噪声。\n\n2. **应用 EMD：** 对加入噪声的信号 `xi` 应用标准 EMD 以获取其 IMF：\n\n\
  $$x\\_{i}(t) = {\\\\sum\\limits\\_{k = 1}^{K}I}MF\\_{k,i}(t) + r\\_{i}(t)$$\n\n\
  其中：`IMFk,i` 是第 `i` 次实现的 IMF，`ri` 是残差信号。\n\n3. **集成平均：** 对 `N` 次不同的实现（即不同的噪声添加）重复步骤\
  \ 1 和 2。对于每个 IMF，在所有实现上取集成平均值：\n\n$$IMF\\_{k}(t) = \\frac{1}{N}{\\\\sum\\limits\\\
  _{i = 1}^{N}I}MF\\_{k,i}(t)$$\n\n集成平均有助于消除添加的噪声同时保留信号特征。\n\n4. **最终分解：** 原始信号 `x(t)`\
  \ 然后被分解为：\n\n$$x(t) = {\\\\sum\\limits\\_{k = 1}^{K}I}MF\\_{k}(t)t)$$\n\n其中：`IMFk`\
  \ 是通过 EEMD 获得的最终 IMF，`r(t)` 是最终残差。\n\n### 奇异值分解 (SVD)\n\nSVD 是一种矩阵分解技术，常用于多维生物医学信号，例如从功能磁共振成像\
  \ (fMRI) 或脑电图 (EEG) 获取的信号。SVD 将矩阵 `X` 分解为三个矩阵 (Schanze, 2018, 2017)：\n\n*X* = *U**Σ**V*[*T*]\n\
  \n其中：\n\n* `U` 和 `V` 是包含左奇异向量和右奇异向量的正交矩阵。\n* `∑` 是一个包含奇异值的对角矩阵，奇异值代表了每个成分的幅度。\n\n\
  SVD 在生物医学信号处理中的降噪、特征提取和降维非常有用。\n\n## 机器学习在生物医学信号分解与去噪中的应用\n\n\n\n\n\n机器学习（ML）技术在生物医学信号分解和去噪领域已变得日益有效，提供了自适应、数据驱动的方法，其性能优于传统的信号处理方法（Suhasi,\
  \ 2019）。这些机器学习技术能够提取相关特征、去除噪声，并以更高的精度对 `ECG`、`EEG`、`PPG` 和 `EMG` 等复杂的生物医学信号进行分解。生物医学信号处理中的机器学习利用了可以从训练数据中学习模式、结构和噪声特征的算法。这些模型可以应用于新数据以提高信号质量，从而在生物医学应用中实现更好的诊断、监测和预测。基于机器学习的去噪方法通常依赖于从噪声和清洁信号的大型数据集进行学习，以优化滤波器或分解器，从而在不失真关键信息的情况下使噪声最小化。一些流行的技术包括监督学习、无监督学习和深度学习模型（图\
  \ 1）。\n\n![图 1 生物医学信号去噪技术。](img/fig4_1_B.jpg)\n\n图 1 生物医学信号去噪技术。\n\n## 去噪自编码器 (DAEs)\n\
  \nDAEs 是一种神经网络，旨在从噪声输入中重建清洁信号或数据。它们是基础自编码器的扩展，自编码器用于高效编码的无监督学习。DAEs 在生物医学信号处理中特别有用，因为数据中的噪声可能源于各种来源，例如传感器不准确、环境干扰或运动伪影。它们已成功应用于\
  \ `ECG`、`EEG` 和 `EMG` 等信号的去噪，提高了用于诊断和分析目的的生物医学数据质量（Chiang et al., 2019; Nurmaini\
  \ et al., 2020）。\n\n自编码器是用于将输入数据压缩为低维表示（编码），然后从该表示重建原始输入（解码）的神经网络，其目标是最小化输入与重建输出之间的差异。与标准自编码器不同，DAEs\
  \ 专门训练用于去除输入中的噪声。这是通过在训练期间故意添加噪声，并教网络从损坏的输入中恢复清洁的原始数据来实现的。这种方法鼓励网络学习捕获数据核心结构的鲁棒特征，提高其对新噪声数据的泛化能力。\n\
  \nDAE 的目标是从噪声版本 `x[noisy]` 重建原始清洁信号 `x`。网络的目标是最小化清洁信号与去噪输出之间的重建损失：\n\n`L(x, x̂)` = `∥x−x̂∥²`\
  \  \n\n其中：`x` 是清洁信号，`z` 是 DAE 的输出，代表去噪后的信号，且损失函数通常是原始信号与重建信号之间的均方误差 (MSE)。\n\nDAEs\
  \ 的架构与标准自编码器相同，主要区别在于训练过程，在输入中添加了噪声（图 2）。该架构包含：\n\n![图 2 编码去噪算法的结构。](img/fig4_2_B.jpg)\n\
  \n图 2 编码去噪算法的结构。\n\n*   **输入层：** 噪声输入信号 `x[noisy]`，包含信号和不希望的噪声。\n*   **隐藏层（编码器）：**\
  \ 这些层将噪声输入转换为压缩的潜在表示。层数和神经元的数量取决于数据的复杂性。\n*   **潜在空间：** 信号本质特征的紧凑表示，由编码器学习。\n* \
  \  **隐藏层（解码器）：** 这些层将潜在表示映射回原始数据空间。\n*   **输出层：** 生成去噪后的信号，它是原始清洁信号的近似。\n\n### DAE\
  \ 的优势\n\n*   DAEs 能够从噪声和清洁信号的大型数据集中学习来优化滤波器。\n\n### DAE 的局限性\n\n*   DAEs 可能对特定的噪声产生过拟合。\n\
  \n## 卷积神经网络 (CNNs)\n\n\n\n\n\nCNN 的最后一层在分类任务中通常是 softmax 层，它将输出转换为每个类别的概率：\n\n$$P(y\
  \ = k \\mid x) = \\frac{\\exp\\left( z\\_{k} \\right)}{{\\sum\\limits\\_{j}{ex}}\\\
  left( z\\_{j} \\right)}$$  \n\n其中：`z[k]` 是类别 `k` 的输出。\n\n## CNN 的优势\n\n* CNN 通过使用局部连接的小型滤波器来利用局部空间特征，这意味着它关注输入的小区域斑块（patches）。与全连接网络相比，这减少了连接的数量。\n\
  * 相同的滤波器（权重集）应用于整个输入，减少了可训练参数和参数的数量。\n* CNN 自动学习层级化的特征，从浅层的低级边缘和纹理，到深层的高级形状和物体。\n\
  * 池化层帮助 CNN 对对输入数据的微小平移具有不变性，使其对特征位置的变化具有鲁棒性。\n\n## 支持向量机 (SVM)\n\nSVM 是一种监督学习算法，用于分类、回归和离群检测等任务。SVM\
  \ 在高维空间中特别强大，并且当维度超过样本数量时表现良好。其核心优势在于识别能够最好分离不同类别数据点的最优超平面。SVM 的主要目标是找到一个超平面，以最大的间隔（margin）尽可能地划分不同类别的数据点。该超平面由一组支持向量确定，支持向量是距离超平面最近的数据点。间隔（即超平面与最近数据点之间的距离）被最大化，以创建一个稳健的决策边界。\n\
  \n* `线性 SVM`：在数据线性可分的情况下，SVM 尝试找到一个划分类别的超平面（2D 中的直线，3D 中的平面或更高维的等效物）（见图 4）。\n\n\
  \    ![图. 4 线性与非线性 SVM 架构。⏎⏎](img/fig4_4_C.jpg)\n\n    图 4 线性与非线性 SVM 架构。⏎\n\n*\
  \ `非线性 SVM`：对于非线性可分的数据，SVM 可以使用 `kernels`（内核）将数据投影到高维空间，使数据在该空间内变得线性可分（见图 4）。\n\n\
  SVM 可以通过支持向量回归 (SVR) 应用生物医学信号去噪。在此背景下，SVR 的目标是对噪声信号拟合模型，并预测出更平滑、更干净的原始信号版本（Venkatesh\
  \ 等，2018；Kaur 等，2021）。\n\n### (a) 用于去噪的 SVR\n\n在基于 SVR 的去噪中，噪声生物医学信号被视为一个回归问题。算法学习一个捕捉信号底层结构的模型，同时忽略噪声（Liu\
  \ 等，2019）。\n\n* 噪声信号表示为 `snoise`。\n* SVR 旨在找到一个函数 `f(t)` 来尽可能近似真实信号 `sclean`，使噪声成分最小化。\n\
  * SVR 中的优化问题与 SVM 类似，但它侧重于通过最小化指定范围内的误差（ε不敏感损失函数）来拟合信号。\n\n优化目标变为：\n\n$$\\frac{1}{2}\\\
  left\\| w \\right\\||^{2}\\text{~subject~to~}\\left| {f\\left( x\\_{i} \\right)\
  \ - y\\_{i}} \\right| \\leq \\epsilon\\forall\\_{i}$$  \n\n其中：`y[i]` 代表目标信号值，ϵ 定义了真实信号值周围的容忍间隔，用于考虑噪声影响。\n\
  \n### (b) 用于非线性信号去噪的内核技巧\n\n在许多情况下，由于生理过程的复杂性，生物医学信号呈现出非线性模式。通过应用内核函数将信号映射到高维空间，可以将\
  \ SVR 扩展到非线性去噪。常见的内核包括（Constantin 等，2006）：\n\n* `径基函数 (RBF) 内核`：对信号中的非线性模式有效。\n\
  * `Polynomial 内核`：适用于具有多项式趋势的信号。\n\n通过应用这些内核，SVR 可以捕捉复杂的信号结构，并比传统的线性方法更有效地去噪。\n\n\
  SVM 还可以用于分类和去除生物医学信号中的伪迹（不必要的噪声成分）。例如，在 EEG 信号中，肌肉伪迹或眼动闪烁是常见的噪声源。SVM 可以通过训练来区分清洁信号段和受伪迹污染的段。涉及的步骤包括：\n\
  \n* 从信号中提取有助于区分噪声段和清洁段的相关特征。这些特征可能包括时域特征（例如均值、方差）或频域特征（例如功率谱密度）。\n* 在标记为 `clean`\
  \ 或 `noisy`（噪声）段的标记数据上训练 SVM 分类器。\n* 将训练好的 SVM 应用于新信号数据，以识别并移除或修正噪声段，留下更干净的信号。\n\
  \n## 使用 SVM 进行生物医学信号去噪的优势\n\n* SVM 可以处理大型且复杂的特征空间，使其适用于具有复杂噪声模式的生物医学信号。\n* 使用非线性内核允许\
  \ SVM 适应不同类型的噪声和信号。\n* SVM 的间隔最大化使其对离群值具有鲁棒性。\n\n## SVM 去噪中面临的挑战\n\n* 基于 SVM 的去噪性能高度依赖于内核的选择和超参数（例如，正则化参数\
  \ `C`、内核宽度 `γ`）。\n* SVM 训练需要标记数据，且在某些应用中，获取真值（清洁信号）可能是具有挑战性的。\n\n### 独立成分分析 (ICA)\n\
  \n独立成分分析 (ICA) 是一种计算技术，用于将多变量信号分离为加性的独立成分。它在生物医学信号处理中特别有用，可以从感兴趣的真实信号中分离出源或伪迹。ICA\
  \ 假设观测信号是独立源的线性混合，并旨在恢复这些源（James & Hesse, 2004 等，2004；Naik & Kumar, 2011）。\n\nICA\
  \ 将信号矩阵 `X` 分解为统计上相互独立的成分。对于一组 `n` 个观测信号 `X={x[1], x[2],..., x[n]}`，ICA 试图找到一个变换矩阵\
  \ `W`，使得生成的成分 `S={s[1], s[2],..., s[n]}` 尽可能统计独立。从数学上看，ICA 模型可以表示为：\n\n*X = AS*\n\
  \n其中：`X` 是 m × `n` 的观测信号矩阵，`A` 是 m × m 的混合矩阵，`S` 是 m × n 的独立成分矩阵。ICA 的目标是从 `X` 估计\
  \ `A` 和 `S`。恢复的成分 `S` 代表原始独立源，混合矩阵 `A` 描述了这些源如何组合形成观测信号（见图 5）。\n\n![图. 5 独立成分分析架构。⏎](img/fig4_5_B.jpg)\n\
  \n图 5 独立成分分析架构。⏎\n\n## ICA 的类型\n\n1. `FastICA`：FastICA 因其高效性和简单性是一种受欢迎的算法。它使用固定点迭代法来化非高斯性，通常基于峰度或负熵（Langlois\
  \ 等，2010）。其步骤为：\n* **中心化**：从数据中减去均值以确保均值为零。\n* **白化**：转换数据以使其具有单位方差和零协方差。\n\n\n\n\
  \n\n- **旋转：** 应用旋转以最大化统计独立性，通常使用非高斯性度量。\n- **Infomax ICA：** Infomax ICA 通过最大化估计源的熵来实现独立性。它采用了一种基于神经网络的方法，来优化估计信号与观测信号之间的信息（熵）度量。\n\
  - **JADE（特征矩阵联合近似对角化）：** JADE 使用多个矩阵的联合对角化来估计混合矩阵和独立分量。对于源并非严格独立但可以进行近似对角化的情况，它是非常有效的。\n\
  \n## ICA 去噪的优势\n\n- ICA 对于去除传统滤波方法可能无法处理的复杂且混合噪声源特别有效。\n- ICA 提供了清晰的源分离，使其更容易识别和移除特定类型的伪迹或噪声。\n\
  - ICA 设计用于处理非高斯分布，因此适用于许多不符合高斯噪声模型的生物医学信号。\n\n## ICA 去噪面临的挑战\n\n- ICA 依赖于源在统计上相互独立的假设，这在实践中并不总是成立的。\n\
  - 识别哪些分量对应于噪声或伪迹可能是主观的，可能需要专家知识。\n- ICA 算法的计算量很大，特别是对于大型数据集或实时应用。\n\n## 主成分分析 (PCA)\n\
  \nPCA 是一种用于降维和特征提取的统计方法。在生物医学信号去噪中，PCA 通过将数据投影到低维空间来有效区分信号成分和噪声，在该空间中，主成分（PCs）捕捉了最大的方差。\n\
  \nPCA 将原始数据转换为一个新的坐标系，其中轴（主成分）代表方差最大的方向。其主要目标是识别捕捉数据中最显著模式的 PC，并在保留重要信息的同时降低维度。给定具有\
  \ `n` 个观测值和 `p` 个特征的数据集 `X`，PCA 执行以下步骤（Ye & Anne, 2004; Castells et al., 2007）：\n\
  \n- 从数据中减去每个特征的均值以确保均值为。\n- 计算中心化数据的协方差矩阵 `C` 以理解特征之间的关系。\n\n```\n$$C = \\frac{1}{n\
  \ - 1}X^{T}X$$\n```\n\n- 计算协方差矩阵的特征值和特征向量。特征向量（主成分）指示了方差最大的方向，而特征值表示每个方向上的方差量。\n\
  - 将数据转换到 PC 上，以获得一组在降低维度中表示数据的新特征。\n\nPCA 可以表述为：\n\n```\nX = W ⋅ Z\n```\n\n其中：`X`\
  \ 是原始数据矩阵，`W` 是特征向量（PCs）矩阵，`Z` 是投影数据矩阵（在 PC 上的得分）。主成分从协方差矩阵 `C` 的特征向量中获得。每个 PC 都是原始特征的线性组合。\n\
  \n在生物医学信号去噪中，PCA 利用捕捉数据中最大方差的 PC 来识别并移除信号中的噪声成分（Martis et al., 2012）。应用 PCA 去噪的关键步骤是：\n\
  \n- **数据采集：** 采集原始生物医学信号，其中可能包含真实信号和噪声。\n- **预处理：** 对数据进行中心化处理，并在必要时进行归一化预处理。这一步骤确保了\
  \ PCA 的正确应用。\n- **应用 PCA：** 对预处理后的数据执行 PCA 以获取 PC 及其对应的特征值。\n- **识别主成分：** 分析特征值以识别捕捉最大方差的\
  \ PC。通常，特征值较高的成分代表数据更显著的特征，而特征值较低的成分可能对应于噪声。\n- **重建信号：** 使用选定的 PC 重建信号。这通常涉及保留真实信号的高端成分，并丢弃与噪声相关的下游成分。\n\
  - **逆变换：** 将数据转换回原始空间以获得去噪后的信号。\n\n## PCA 去噪的优势\n\n- PCA 降低了数据的维度，可以简化后续分析并提高计算效率。\n\
  - PCA 专注于保留捕捉最大方差的成分，这通常包含了信号的显著特征同时去除了噪声。\n- 通过减少成分数量，PCA 可以在保留基本信息的同时压缩数据，使其更容易处理和分析。\n\
  \n## PCA 去噪面临的挑战\n\n- PCA 假设特征之间存在线性关系。在某些情况下，生物医学信号可能表现出 PCA 无法完全捕捉的非线性特性。\n- 识别哪些\
  \ PC 对应于噪声具有挑战性的。这通常需要领域知识和仔细的分析。\n- PC 是原始特征的线性组合，在特定的生物医学应用背景下可能并不总是具有可解释性。\n\n\
  ##与其他技术的比较\n\n- **PCA vs ICA：** 虽然 PCA 专注于捕捉方差和降维，但 ICA 分离独立源，对于噪声源在统计上独立的情况有效。ICA\
  \ 可能更适用于噪声和信号源以复杂方式混合场景。\n- **PCA vs 小波变换：** 小波变换提供了时频分析，对于非平稳信号有效。相比之下，PCA 执行全局降维，可能不如小波那样有效地捕捉局部特征。\n\
  \n## 长短期记忆 (LSTM)\n\n生物医学信号（如 ECG、EEG 和 PPG）经常受到来自各种生理和外部源噪声的影响。虽然低通滤波器或小波变换等传统去噪方法在有效，但在处理复杂、非线性非平稳噪声时面临局限性。LSTM\
  \ 作为一种 RNN，已成为生物医学信号去噪流行且可靠的解决方案，因为它们能够建模序列数据并捕捉短期和长期依赖。这使得它们特别适用于生物医学信号固有的时间动态。LSTM\
  \ 网络专门设计用于克服传统 RNN 的缺点，例如梯度消失和爆炸问题。梯度消失问题导致标准 RNN 无法学习长期依赖，而这对于生物医学信号等时间序列数据至关重要。LSTM\
  \ 通过引入一个可以长时间保留信息的记忆单元，以及一个调节信息流入流出记忆单元的门控机制来解决这个问题（Yildrin, 2018）（图 6）。\n\n![图\
  \ 6 LSTM 架构结构。](img/fig4_6_B.jpg)\n\n图 6 LSTM 架构结构。[#ch4.xhtml#R_fig4_6)\n\n###\
  \ LSTM 单元的关键组件\n\nLSTM 单元包含多个控制信息如何更新的的组件：\n\n- **遗忘门：** 决定从记忆中丢弃哪些信息。\n\n```\n\
  f[t] = σ(W[f] ⋅⌊h[t-1], x[t]⌋ + b[f])\n```\n\n其中：`f[t]` 是遗忘门的输出（应该丢弃多少过去的信息），`W[f]`\
  \ 是权重矩阵，`h[t-1]` 是上一个时间步的隐藏状态，`x[t]` 是当前输入，`b[f]` 是偏置项，`σ` 是 sigmoid 函数，它将输出限制在\
  \ 0 和 1 之间。\n\n- **输入门：** 控制哪些新信息应该存储在记忆中。\n\n\n\n\n\n$i[t] = \\sigma(W[i] \\cdot\
  \ \\lfloor h[t-1], x[t] \\rfloor + b[i])$\n\n#### 图 6 更新细胞状态：\n\n$$\\begin{array}{l}\
  \ {\\widetilde{C}t = \\tanh\\left( {W_{c} \\cdot \\left\\lfloor {h_{t - 1},x_{t}}\
  \ \\right\\rfloor + b_{c}} \\right.} \\\\ {C_{t} = f_{t}*C_{t - 1} + i_{t}*\\widetilde{C}t}\
  \ \\\\ \\end{array}$$\n\n这一步通过考虑遗忘门和新计算的候选值 $\\tilde{C}[t]$ 来更新细胞状态 $C[t]$。\n\n\
  #### 输出门：决定细胞状态的哪些部分将作为下一个隐藏状态输出。\n\n$$\\begin{array}{l} {o_{t} = \\sigma\\left(\
  \ {W_{o} \\cdot \\left\\lfloor {h_{t - 1},x_{t}} \\right\\rfloor + b_{o}} \\right.}\
  \ \\\\ {h_{t} = o_{t}*\\tanh\\left( C_{t} \\right)} \\\\ \\end{array}$$\n\n隐藏状态\
  \ $h[t]$ 根据更新后的细胞状态和输出门的控制产生。\n\n这些门中的每一个都有其待学习的权重和偏置，并通过激活函数进行操作（通常门通常使用 sigmoid\
  \ 函数，细胞状态使用 tanh 函数）。这些门共同允许 LSTM 决定何时记忆或遗忘信息，从而有效地对长期依赖进行建模。通过使用这种门控机制，LSTM 能够学习记忆数据中的哪些部分以及丢弃哪些部分，这使得它们在处理具有时间依赖性的生物医学信号时特别有效（Kusuma\
  \ & Jothi, 2022; Hosny et al., 2020）。\n\n由于各种内部和外部因素，生物医学信号本质上往往包含噪声：\n\n*   生理伪迹，例如\
  \ EEG 信号中的肌肉运动或眨眼。\n*   外部噪声，例如 ECG 或 PPG 信号中的电磁干扰。\n*   采集生物医学信号的可穿戴设备中的运动伪迹（例如使用\
  \ PPG 的心率传感器）。\n\n传统的去噪技术（如带通滤波或小波去噪）可以很好地处理平稳噪声，但可能难以处理生物医学信号中出现的非平稳、随变化的噪声。相反，LSTM\
  \ 擅长处理非平稳信号，因为它们具有建模复杂时间关系的能力和动态内存管理能力。\n\n基于 LSTM 的生物医学信号去噪涉及几个关键步骤：\n\n#### (a)\
  \ 预处理\n\n1.  **归一化：** 在将生物医学信号输入 LSTM 之前，对数据进行归一化是非常重要的可以通过可以通过信号缩放到特定范围（例如 [0,\
  \ 1]）来实现，以确保 LSTM 能够有效处理数据并避免数值不稳定。\n2.  **分段：** 根据信号的长度，可以将其分为若干段。\n\n#### (b)\
  \ 模型训练\n\n1.  **设计 LSTM 架构：** 架构的设计用于处理信号的时间依赖性。\n2.  **损失函数：** 常用的损失函数是 `MSE`，它最小化预测信号与实际清洁信号之间的差异。\n\
  3.  **过程：** 使用 `Adam` 或 `RMSprop` 等优化器对模型进行训练。\n\n#### (c) 推理与后处理\n\n一旦 LSTM 模型训练完成，就可以用于对新信号去噪。在获得去噪信号后，可以应用平滑等后处理步骤，以确保信号没有残留噪声。\n\
  \n#### LSTM 在生物医学去噪中的应用\n\nLSTM 已经应用于广泛的去噪任务：\n\n*   **EEG 去噪：** EEG 信号经常受到眨眼和肌肉活动等伪迹的污染。LSTM\
  \ 已用于从信号中分离出这些成分。\n    *   示例：LSTM 网络帮助脑机接口 (BCI) 识别时间依赖性。\n*   **ECG 去噪：** ECG\
  \ 信号经常受到运动伪迹和基线漂移的干扰。LSTM 证明过滤这类噪声是有效的，允许进行准确的心跳检测。\n    *   示例：模型可以在移除基线漂移的同时保留有关心脏电活动的关键信息。\n\
  *   **PPG 去噪：** 常用于可穿戴健康监测的 PPG 信号在活动期间容易受到运动伪迹的影响。LSTM 已通过学习时间关系对这些信号进行去噪。\n  \
  \  *   示例：LSTM 模型提高了可穿戴设备中心率和血氧饱和度测量的可靠性。\n\n#### LSTM 用于生物医学信号去噪的优势\n\n*   LSTM\
  \ 可以对生物医学信号中的短期和长期依赖进行建模，使其成为捕捉随时间变化的趋势的理想选择。\n*   与假设噪声和信号之间存在线性关系的传统滤波技术不同，LSTM\
  \ 可以模拟非线性相互作用。\n*   LSTM 模型直接从数据中学习去噪信号，减少了对人工干预和参数微调的需求。\n*   LSTM 能够在过滤噪声的同时保留关键的信号特征（如\
  \ ECG 波形或 EEG 模式）。\n\n#### 使用 LSTM 进行生物医学去噪的挑战\n\n*   LSTM 需要大量的清洁信号和噪声信号对进行训练。在生物医学领域获取此类数据集可能具有挑战性。\n\
  *   LSTM 的计算成本比传统滤波器高，这在需要实时去噪时可能是一个限制。\n*   LSTM 可能会过拟合训练数据，特别是当训练集较小或包含泛化不良好的特定类型噪声时。\n\
  \n### 生成对抗网络 (GANs)\n\n\n\n\nGAN 是一种深度学习模型，旨在生成模拟给定分布的新数据。它们由两个主要部分组成：1) 试图创建真实数据的\
  \ `generator`（生成器），2) 试图区分真实数据与生成数据的 `discriminator`（判别器）。近年来，由于 GAN 能够模拟复杂的数据分布并学习在没有显式监督的情况下去除噪声，它们已应用于各种领域，包括生物医学信号去噪（Singh\
  \ & Pradhan, 2020；Wang 等，2022）。\n\n生物医学信号（如 `EEG`、`ECG` 和 `PPG`）往往受到各种噪声的污染，包括生理伪迹、运动伪迹和外部干扰。对这些信号进行去噪对于提高医疗应用中的诊断准确性和可靠性至关重要。传统的去噪技术（如傅里叶变换、小波变换或线性滤波器）可能无法捕捉复杂的噪声模式。GAN\
  \ 通过学习底层的信号分布并自动过滤噪声，提供了一种更灵活、数据驱动的去噪方法。\n\n## GAN 结构\n\nGAN 由两个神经网络组成：一个生成器 (`G`)\
  \ 和一个判别器 (`D`)，它们在博弈论框架下同时训练：\n\n*   **生成器 (G)：** 生成器的作用是产生尽可能真实的伪（去噪后）数据。在生物医学信号去噪的背景下，生成器接收噪声输入信号并尝试输出该信号的去噪版本。\n\
  *   **判别器 (D)：** 判别器的作用是区分真实的（清洁）生物医学信号与生成器生成的伪（去噪后）信号。它是一个二分类器，输出给定输入是真实的还是生成的。\n\
  \n生成器的目标是通过产生与真实、清洁信号无 ever 区分的信号来欺骗判别器。另一方面，判别器则试图正确识别哪些信号是伪的（去噪的），哪些是真实的。\n\n\
  GAN 使用生成器与判别器之间的极大小游戏（minimax game）进行训练。生成器的目标是最小损失，而判别器则试图最大化损失。损失函数可以如图 7 所示所示。对于生物医学信号去噪，GAN\
  \ 架构可以调整如下（An 等，2022）：\n\n![Fig. 7 用于生物医学信号去噪的 GAN 生成器和判别器架构。](img/fig4_7_B.jpg)\n\
  \n图 7 用于生物医学信号去噪的 GAN 生成器和判别器架构。⏎\n\n## 架构细节\n\n1.  **生成器架构：** 生成器通常设计为 `encoder-decoder`（编码器-解码器）网络，其中噪声生物医学信号被输入编码器，编码器将信号压缩到潜空间。解码器随后以去噪的形式重建信号。生成器的关键特征包括：\n\
  \    *   **卷积层 (Convolutional Layers)：** 为了捕捉噪声生物医学信号中的局部模式，生成器通常使用卷积层。这些层可以学习检测噪声模式并将其过滤掉。\n\
  \    *   **跳跃连接 (Skip Connections)：** 这些连接类似于 `U-Net` 架构中使用的连接，允许模型保留早期层中的重要信号特征，确保关键的生物医学信号特征在去噪过程中不会丢失。\n\
  \    *   **激活函数 (Activation Functions)：** 生成器中常使用非线性激活函数（如 `ReLU` 或 `LeakyReLU`）来建模噪声输入与清洁输出之间的复杂关系。\n\
  \n2.  **判别器架构：** 判别器通常是一个 `CNN`，用于分类给定信号是真实的（清洁）还是伪的（去噪的）。判别器的结构通常涉及：\n    *   **卷积层\
  \ (Convolutional Layers)：** 为了从生物医学信号中提取特征，判别器使用卷积层。这些层允许判别器学习真实清洁信号中的模式，将其与生成的信号区分开。\n\
  \    *   **全连接层 (Fully Connected Layers)： 在特征提取后，全连接层结合特征并分类信号是真实的还是生成的。\n\n3. \
  \ **损失函数修改：** 在标准 GAN 中，损失函数专注于分类真伪数据。对于去噪应用，通常会引入额外的损失项以确保生成的信号接近原始清洁信号。这被称为 `reconstruction\
  \ loss`（重建损失）：\n\n```\nL*[recon] = E*[x*[clean], x*[noisy]]||G*(x*[noisy])−x*[clean]||²\n\
  ```\n\n该损失衡量了清洁信号与 GAN 生成的去噪信号之间的 `MSE`。将此与对抗损失结合，有助于生成器产生更真实、准确的去噪信号。\n\n## 训练过程\n\
  \n训练用于生物医学信号去噪的 GAN 是一个微妙的过程因为它因为它平衡生成器和判别器的性能。典型的训练程序交替训练生成器和判别器：\n\n1.  **训练判别器：**\
  \ 判别器在真实的（清洁）信号和生成的（去噪）信号对上进行训练。它学习分类每个信号是真实的还是生成的。\n2.  **训练生成器：** 训练生成器产生能够欺骗判别器分类为真实的去噪信号。生成器的损失函数结合了对抗损失（来自判别器）和重建损失（来自清洁信号）。\n\
  3.  **优化：** 使用随机梯度下降 (`SGD`) 或其变体（如 `Adam`）优化生成器和判别器。由于训练的对抗性质，调优学习率并平衡生成器与判别器的更新对于稳定训练至关重要。\n\
  \n## 应用\n\nGAN 已成功应用于多种生物医学信号，在减少噪声的同时保留关键信号特征方面表现出强大的性能。\n\n1.  **EEG 信号去噪：** `EEG`\
  \ 信号经常受到肌肉伪迹、眼动和电干扰的污染。GAN 已被用于去噪这些信号，保留了对于脑机接口 (`BCIs`) 和癫痫诊断等应用至关重要的底层脑活动模式。\n\
  \    *   **示例：** 可以训练基于 GAN 的模型移除身体活动期间 `EEG` 信号中的肌肉伪迹，从而提高记录脑信号的质量并提高神经解码算法的准确性。\n\
  \n\n\n\n## 2. ECG 信号去噪\nECG 信号经常受到来自运动伪迹、基线漂移和电干扰等源噪声的污染。`GANs` 可以有效去除这些类型的噪声，同时保留\
  \ QRS 波和其他用于心脏诊断的关键特征。\n\n* **示例：** `GANs` 已用于过滤可穿戴 ECG 设备中的运动伪迹，产生更干净的信号，从而改进了动态监测中对心律失常和其他心脏疾病的检测。\n\
  \n## 3. PPG 信号去噪\nPPG 信号用于可穿戴心率监测器和脉氧仪，容易受到运动和环境干扰噪声的影响。`GANs` 可以对 `PPG` 信号去噪，提高心率和血氧饱和度测量的准确性。\n\
  \n* **示例：** 在健身追踪器的 `PPG` 数据上训练的 `GAN` 模型可以对运动期间捕捉到的信号去噪，减少运动伪迹并产生更可靠的健康指标。\n\n\
  ### GAN 在生物医学信号去噪中的优势\n* `GANs` 能够对复杂的非线性噪声模式进行建模，而传统的去噪技术（例如 `linear filters`、`wavelet\
  \ transforms`）难以处理这些模式。这使得它们特别适用于生物医学信号，因为这类噪声可能源于广泛的生理和外部来源。\n* 与依赖预定义滤波器和对噪声性质假设的传统方法不同，`GANs`\
  \ 直接从数据中学习。这种数据驱动的方法使它们能够适应不同类型的噪声，提供更具鲁棒性且泛化性的去噪解决方案。\n* `GANs` 为生物医学信号去噪提供了一个端到端的框架，整个过程——从噪声输入到清洁输出——都是自动学习的。这减少了对手动特征提取和参数调优的需求，简化了去噪流程。\n\
  * `GANs` 的主要优势之一是它们能够在去除噪声的同时保留重要的信号特征（例如 `ECG` 信号中的 `P-waves` 和 `QRS complexes`，或者\
  \ `EEG` 信号中的 `spike trains`）。这确保了去噪后的信号仍然具有诊断价值。\n\n### 使用 GAN 进行生物医学信号去噪面临的挑战\n\
  尽管前景广阔，但 `GANs` 在生物医学信号去噪方面面临着若干挑战：\n* 由于 `generator`（生成器）和 `discriminator`（分类器）的对抗性质，`GANs`\
  \ 以难以训练而闻名。如果 `discriminator` 变得过于强大，`generator` 可能难以改进，导致去噪性能低下。反之，如果 `generator`\
  \ 变得太强，`discriminator` 将无法学习，导致模式崩溃（mode collapse），即 `generator` 只产生极有限的输出种类。\n\
  * 训练 `GANs` 通常需要大量成对的噪声信号和清洁生物医学信号。在许多临床环境中，获取此类数据非常困难，特别是对于罕见或难以捕捉的生理事件。此外，不同患者和环境之间噪声类型的变异性使得\
  \ `GAN model` 泛化到新数据变得具有挑战性。\n* 虽然 `GANs` 可以产生高质量的去噪信号，但其实现这一点的底层过程通常是不透明的。这种解释性的缺乏在临床应用中可能是一个缺点，因为在临床应用中，理解和解释去噪过程的能力对于监管批准和医生的信任至关重要。\n\
  * `GANs` 的训练计算开销大，需要强大的硬件（例如 `GPUs`）和大量的时间来收敛。在实时生物医学监测应用中，这可能是一个限制因素，特别是对于可穿戴设备等资源受限设备。\n\
  \n## 用于自适应生物医学信号去噪的强化学习 (RL)\n`RL` 为生物医学信号去噪提供了一种前景良好的自适应方法，其中 `agent`（智能体）与环境交互，并通过试错学习最佳去噪策略。该框架允许系统动态学习并适应随时间变化的噪声水平、噪声模式和信号特征。基于\
  \ `RL` 的自适应去噪技术对于 `ECG`、`EEG`、`EMG` 和 `PPG` 等生物医学信号特别有用，这些信号根据生理状况表现出非平稳噪声和变异性。\n\
  \n在 `RL` 中，`agent` 通过接收环境提供的奖励反馈来做出决策。`agent` 的目标是通过采取导致预期结果的操作来实现时间累计奖励的最大化。在生物医学信号去噪的背景下，`agent`\
  \ 学习对噪声信号应用各种去噪操作（`actions`），以最大化提高去噪信号的质量（`reward`）。\n\n用于自适应去噪的强化学习的关键组件包括 (Mahmud\
  \ et al., 2018; Alolaiwy et al., 2021):\n* **Agent：** 决策如何处理噪声信号的去噪算法或系统。\n* **Environment：**\
  \ 生物医学信号（例如 `ECG` 或 `EEG`）及其噪声特性，这些特征随时间或跨不同段变化。\n* **Actions：** 应用信号的去噪技术或滤波器（例如\
  \ `thresholding`、`wavelet shrinkage`、`adaptive filtering`）。\n* **State：** 噪声生物医学信号的当前表示（例如\
  \ `time-frequency features`、`noise characteristics` 或统计属性）。\n* **Rewards：** 信号质量或去噪性能的衡量标准，例如信噪比（`SNR`）、`MSE`\
  \ 或与清洁参考信号的相关性。\n\n### 生物医学信号去噪的 RL 工作流\n基于 `RL` 的去噪系统通过与环境的迭代交互工作，其中 `agent` 随时间学习并改进其性能。典型工作流包括以下步骤：\n\
  1. **初始化：** `agent` 从噪声生物医学信号开始，并根据其当前的 `policy`（策略）应用初始去噪操作。\n2. **观测与状态表示：** `agent`\
  \ 通过分析生成的信号来观察操作结果，例如去除了多少噪声或保留了哪些特征。环境的 `state`（代表信号当前状况）会被更新。\n3. **奖励计算：** `agent`\
  \ 根据去噪信号的质量接收 `reward`。例如，如果 `SNR` 提高或信号更接近清洁参考，则给予更高奖励。`reward function` 鼓励 `agent`\
  \ 优先考虑导致更好去噪的结果。\n4. **动作选择（策略）：** `agent` 根据其当前的 `policy` 选择下一个去噪操作，该策略可能是探索性的（尝试新操作）或利用性的（使用良好的操作）。随着\
  \ `agent` 从之前的操作和奖励中学习，`policy` 会不断进化。\n5. **训练智能体（更新策略）：** `agent` 使用强化学习算法（例如\
  \ `Q-learning`、`Deep Q-Networks` 或 `Policy Gradient Methods`）调整其 `policy`，根据积累的奖励和观察的状态改进未来的决策。\n\
  \n此过程不断重复，直到 `agent` 收敛到适用于信号和噪声特征的最优去噪策略。\n\n### RL 用于自适应去噪的优势\n* **动态适应：** 基于\
  \ `RL` 的去噪系统能够实时适应变化的噪声条件或非平稳信号特征。这对于随时间或不同生理状态表现变异的生物医学信号特别有用。\n* **无需固定滤波器：**\
  \ 与依赖固定滤波器（例如 `wavelet` 或 `Fourier-based techniques`）的传统去噪方法不同，`RL` 允许动态决策。`agent`\
  \ 可以学习针对给定信号段哪种去噪技术最有效，并自适应地应用。\n\n\n\n\n\n- **自学习能力：** `RL` 系统可以在无需预先了解精确噪声类型或特征的情况下，学习对生物医学信号去噪。随着时间的推移，智能体会越来越擅长识别噪声模式，并采取正确的操作来减轻噪声。\n\
  - **多准则优化：** `RL` 中的奖励函数可以设计为平衡多个目标，例如降噪、保留关键信号特征以及提高计算效率。这使得基于 `RL` 的去噪对于特定的生物医学应用具有高度的可定制性。多种强化学习算法可以被用于信号去噪：\n\
  - **Q-learning：** 一种广泛使用的 `RL` 算法，它为每个状态-动作对学习一个值函数，代表在特定状态下采取某个动作的预期奖励。对于信号去噪，`Q-learning`\
  \ 可以帮助智能体根据信号的噪声特性选择最佳的去噪技术。\n- **深度 Q 网络 (DQN)：** 这这种将 `Q-learning` 与深度神经网络相结合，允许智能体处理高维状态，例如生物医学信号复杂的时频表示。`DQN`\
  \ 可以帮助智能体处理更复杂的信号，如多通道 `EEG` 或复杂的 `ECG` 模式。\n- **策略梯度方法：** 这些方法直接优化策略，允许在连续动作空间中进行更灵活的决策。当去噪动作涉及连续参数调整时（例如选择最佳噪声阈值或自适应滤波器设置），策略梯度方法非常有用。\n\
  \n### 基于 RL 的自适应生物医学去噪示例\n\n多种生物医学信号类型都可以从基于 `RL` 的自适应去噪中受益：\n\n- **ECG 去噪：** `ECG`\
  \ 信号经常受到肌肉收缩、呼吸和电干扰产生的噪声污染。基于 `RL` 的去噪系统可以学习根据上下文（例如运动期间与休息期间）自适应地消除不同类型的噪声，同时保留\
  \ `P-QRS-T` 波复合体等诊断特征。\n- **EEG 去噪：** `EEG` 信号受到各种伪迹的影响，如眼动、肌肉活动和环境噪声。`RL` 可以动态调整去噪参数以消除这些伪迹，同时保留用于\
  \ `BCIs` 或癫痫检测的重要神经活动模式。\n- **PPG 去噪：** `PPG` 信号通常用于可穿戴设备中的心率和血氧监测，对运动伪迹非常敏感。基于\
  \ `RL` 的去噪可以适应运动强度并实时消除伪迹，确保生理测量的准确性。\n\n## 结论\n\n本章探讨了生物医学信号分解和去噪的关键方法论和 `ML` 技术，强调了它们在提高诊断准确性、治疗效果和整体医疗健康结果方面的重要性。生物医学信号（如\
  \ `ECG`、`EEG` 和 `PPG`）通常包含关于生理过程的价值信息，但它们通常会被各种来源的噪声污染。因此，有效的去噪方法对于确保医疗保健人员准确提取和解释相关特征至关重要。传统的信号分解技术，如傅里叶变换、`Wavelet\
  \ Transform`、`EMD`、`EEMD` 和 SVD，提供了提供了将复杂的生物医学信号分解为简单组件的基础工具。这些方法在广泛的应用中被证明是有效的，但受限于无法动态适应现实生物医学信号的高度变异性和非平稳性。\n\
  \n将 `ML` 集成到生物医学信号处理标志着该领域的一个变革性步骤。数据驱动的方法如 `DAEs`、`CNNs`、`SVMs`、`ICA` 和 `PCA` 为生物医学信号去噪提供了可扩展、自适应的解决方案，推向了信号清晰度和特征提取方面的实现边界。特别是，`DAEs`\
  \ 利用深度学习来学习复杂的噪声模式并有效消除它们，而 `CNNs` 凭借其捕捉数据中空间和时间关系的能力，在实时信号处理环境中具有卓越的性能。`SVMs` 尽管传统上用于分类，但在去噪应用中也显示出强大的性能，特别是在数据有限的场景下。分别关注盲源分离和降维的\
  \ `ICA` 和 `PCA` 也对伪迹消除和噪声降低做出了贡献，特别是对于像 `EEG` 和 `EMG` 等多通道信号。\n\n如 `LS TM` 网络和 `GANs`\
  \ 等高级方法代表了生物医学信号去噪的下一个前沿。`LSTMs` 具有捕捉时间序列数据长期依赖关系的能力，特别适用于连续实时监控场景（如 `ECG` 和 `EEG`\
  \ 分析）中的去噪应用。`GANs` 通过其对抗学习框架为生成高质量去噪信号提供了一种新方法，尽管它们在训练复杂和数据需求方面面临挑战。最后，`RL` 为生物医学信号去噪引入了一种创新的自适应框架，提供了一种从反馈中学习并随时间改进的动态实时方法。这在可穿戴健康监测设备中特别有用，因为噪声和信号的性质可能会发生不可预测的变化。\n\
  \n展望未来，生物医学信号去噪的未来在于传统信号处理技术与机器学习的持续融合。虽然 `ML` 提供了处理复杂非平稳信号的自适应、数据驱动解决方案，但传统方法的稳健性和可解释性仍然具有价值。这些方法的整合可能会导致具有更高精度、实时自适应性和改进诊断能力的复杂去噪框架的发展。然而，挑战依然存在，包括训练\
  \ `ML` 模型需要更大的数据集以及 `GANs` 和 `LSTMs` 等深度学习架构的计算需求。随着这些问题的解决，生物医学信号去噪领域将继续进化，为临床和工程师提供增强的工具，最终有助于更好的护理和更准确的诊断。\n\
