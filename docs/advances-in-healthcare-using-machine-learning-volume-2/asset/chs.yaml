  _1`](https://doi.org/10.1007/978-3-030-00889-5_1).\n\n# 7 针对极少标注组织病理图像高效肿瘤检测的自监督补块对比学习\n\
  \nDr. Janarthanam S^(⁸)\n\n邮箱: slakshmisvv@gmail.com²\n\nDOI: [10.1201/9781003716686-7](https://dx.doi.org/10.1201/9781003716686-7)\n\
  \n在面对标注数据有限时，本文探索了用于组织病理图像肿瘤检测的创新自监督补块对比学习方法。数字病理学通过计算方法取得了显著进展，但对大量专家标注的需求仍然是一个重大的瓶颈。我们提出了一个全面的框架，通过对图像补块（patches）进行对比学习，利用组织病理图像中固有的结构和上下文信息。通过利用补块之间的空间关系和视觉相似性，我们的方法使模型能够在不需要详尽像素级标注的情况下学习有意义的表示。跨多种癌症类型的实验结果表明，我们的方法可以在减少高达\
  \ 75% 标注需求的同时，保持与全监督方法相当的性能。我们进一步分析了所学习的表示，揭示了它们捕捉了临床相关的组织学模式和细胞形态。所提技术为病理学家和医疗系统提供了一条实用的途径，用于开发显著减轻标注负担的稳健计算机辅助诊断工具，可能加速\
  \ AI 辅助癌症诊断的临床应用，并解决数字补块对比学习中不同重要程度的状态。\n\n## 引言\n\n数字病理学代表了癌症诊断的一种变革性方法，它能够以前所未有的规模和细节对组织学标本进行计算分析。病理学家对组织样本的传统显微镜检查仍然是癌症诊断的金标准，但在可扩展性、观察者差异以及整合基因组和分子信息的日益增长的性方面面临着挑战\
  \ (Al-Saadi et al., 2022 )。机器学习方法，特别是深度学习模型，在分析组织病理图像方面取得了巨大成功，可能增强诊断的准确性和效率。部署计算病理学面临的持续挑战源于“标注瓶颈”，它严重限制了发展。这些\
  \ AI 系统需要大量的标注才能有效运行，这需要经过高度训练的病理学家在全扫描切片（WSIs）中勾勒感兴趣区域。\n\n这一密集过程涉及识别细胞、组织结构和疾病模式\
  \ (Sahasrabudhe, M. et al., 2023)。这种过程所需的精度是不同寻常的，因为病理学家必须在细胞层面做出判断，这项任务需要专业的知识和大量的时间投入。瓶颈造成了一个悖论的情况：为了最终通过这些\
  \ AI 系统节省专家的时间，他们首先必须投入无数小时对它们进行训练。这对资源的影响是巨大的，将专业病理学家从直接护理工作中抽离出来执行枯燥的标注工作，这加剧了本就紧张的资源压力。\n\
  \n此外，机器学习系统通常需要数千个标注示例才能达到临床可行的性能，这使得工作量呈指数级增长。经济挑战同样巨大，因为专家病理学的时间代表了宝贵的医疗资源，使得许多机构无法负担大规模标注项目的费用。其后果不仅限于开发的滞后。由于标注限制导致的数据集较小往往会导致\
  \ AI 系统性能下降，特别是在检测罕见病变或细微变化方面。\n\n这是临床转化的一个重大障碍，因为系统在投入患者护理之前必须表现出卓越的可靠性。此外，标注过程引入了基于所选病例和标注病理学家个人解释的潜在偏差。标注瓶颈是计算病理学进展的关键速率限制因素，需要创新解决方案（如半监督学习方法、主动学习技术或众包策略）来克服这一限制，并实现广泛的临床应用，从而改变病理实践并最终改善患者预后。\n\
  \n自监督学习代表了解决计算病理学标注瓶颈的变革性方法，使 AI 系统能够无标记或少数标记的数据中学习有意义的表示 (Thorat et al., 2024)。在这些技术中，对比学习在包括组织病理在内的视觉领域展现出极大的前景。对比学习的基本原理是训练模型在不需要明确专家标注的情况下，区分相似和不相似的图像区域。基于补块的对比学习方法通过将来自同一张切片的不同区域视为语义相关，而将来自不同切片的区域视为不相似，从而利用了这种固有的组织结构。\n\
  \n\n\n\n最近的研究证明了这种方法的有效性。Liu 等人 (2023) 开发了一种多实例对比学习框架，该框架在仅使用 10% 标记数据进行微调的情况下，实现了与有监督方法相当的性能。同样，Wang\
  \ 等人 (2022a) 引入了一种分层对比学习方法，能够同时捕捉局部和全局组织特征，显著提升了在肿瘤分类任务中的性能。这种益处不仅限于减少对标注的需求。Ciga\
  \ 等人 (2022b) 表明，自监督模型在不同的机构和染色方案之间表现出更好的泛化性，解决了计算病理学中的一个关键挑战。此外，Chen 等人 (2023c)\
  \ 发现，基于对比学习的表示通过关注临床相关的组织区域增强了可解释性。(Li, W, Wang, L., & Rajpoot, N. 2022) 通过利用组织病理学数据的内在结构，对比学习方法为开发具有显著减少标注需求的稳健计算病理学工具提供了一条充满前景的途径，可能加速其临床转化。\n\
  \n组织病理学图像的计算分析面临着几个独特的挑战：\n\n*   **十亿像素图像：** 全切片图像通常包含数十亿像素，使得在没有专门技术的情况下，传统的深度学习方法在计算上是不可行的行的。\n\
  *   **多尺度信息：** 相关的诊断特征存在于多个尺度上，从亚细胞结构到组织级结构模式。\n*   **显著变异性：** 由于癌症亚型、肿瘤异质性和患者差异等因素，在肿瘤或正常组织类别内部存在巨大差异。\n\
  *   **实验室间差异：** 组织制备、染色方案和扫描设备的差异导致了影响模型泛化的领域偏移。\n*   **语境依赖性：** 细胞和组织特征的解释很大程度上取决于其周围的环境和空间关系。\n\
  *   **标注稀缺：** 专家病理学医生的时间有限且昂贵，这对标记训练数据的数量形成了根本性限制。\n\n这些挑战使得我们需要新的方法，能够从有限的标注中高效学习，同时捕捉组织病理标本中存在的复杂模式和关系。本章介绍了组织病理学图像处理中的自监督补片对比学习框架，特别强调了肿瘤检测。本章内容安排如下：在“组织病理学中的计算方法”中，回顾了自监督学习和计算病理学的相关研究。我们基于补片的对比学习方法在“建议的方法论”中介绍。数据集和实验设置描述在“实验设置：数据集”中。发现和比较显示在“结果与讨论部分”中。未来方向、限制和临床意义涵盖“对计算病理学的意义”中。第\
  \ 7 节以几个重要的观察和建议结束。\n\n## 组织病理学中的计算方法\n\n计算方法在组织病理学中的应用在过去十年发生了显著变化。早期方法依赖于手工设计的特征，旨在捕捉特定的形态特征，如细胞核的大小、形状和纹理。这些传统技术通常涉及对核心或其他结构的分割，然后提取并分类特征。随着深度学习的引入，卷积神经网络（或\
  \ `CNNs`）成为组织病理学图像处理极其有效的工具。(Cruz-Roa 等人，2018) 展示了使用 `CNNs` 识别组织病理学图像中乳癌的早期应用之一。\n\
  \nKohlberger, T. 等人 (2019) 的后续工作证实了深度学习在各种组织病理学任务（包括癌症分级、转移检测和组织分割）中的有效性。基于补片的全切片图像分析方法的代表了重大突破。由于其十亿像素的尺寸，直接处理\
  \ `WSIs` 在计算上是不可行的。为了进行分析，图像通常被分成较小的部分。为了实现在切片级标注上的极少监督学习，创建了多实例推理（`MIL`）技术，将补片级的估计聚合为切片级的诊断。最近的工作越来越多地关注基于注意力的模型，这些模型可以识别诊断相关的区域。Campanella\
  \ 等人 (2019) 证明了深度学习模型可以在仅有切片级标签的情况下在 15,000 张切片上进行训练，在前列腺癌和基底细胞检测中达到与病理学家水平相当的准确率。\n\
  \n### 自导计算机视觉学习\n\n自监督学习通过允许神经网络从海量的未标记数据中提取有意义的表示，这种能力对于标注成本高贵的医学影像特别有价值，它彻底改变了计算机视觉。这种范式最初关注于预定义任务，即巧妙的自生成监督信号，例如预测图像旋转、从图像补片中解决拼图以及从灰度输入中恢复图像颜色。这些机制迫使网络在没有人类提供标签的情况下理解图像的语义和结构，为表示学习奠定了基础\
  \ (Azizi 等人, 2023)。\n\n随着对比学习方法的出现，该领域经历了巨大的转型，这种方法基于根本上不同的原理：通过比较进行学习。Chen 等人 (2020c)\
  \ 引入的开创性 `SimCLR` 框架建立了一种范式，网络学习识别同一图像的不同增强增强视图应该具有相似的表示，而来自不同图像的视图应该是不相似的。这种正负配对机制被证明非常有效，催化了该领域的快速发展\
  \ (Li 等人，2022)。随后的创新解决了 `SimCLR` 的局限性，特别是对大批量大小的依赖。`MoCo` 引入了动量编码器和动态字典，使得在保持一致性能的同时能够更高效的训练。\n\
  \n\n\n随着 `BYOL` 和 `SimSiam` 的演进，研究人员发现了一个惊惊讶：此前被认为至关重要的显式负样本对于有效的对比学习来说并非绝对必要，这挑战了关于这些方法工作原理的根本假设（Wang\
  \ et al., 2022）。尽管这些方法在自然图像数据集上取得了令人瞩目的结果，但医学影像（尤其是病理组织学）面临着独特的挑战，需要针对领域进行适配。病理组织学图像具有复杂的组织结构、多尺度相关特征以及特殊的染色变异，这些与自然图像有显著不同。Koohbanani\
  \ 等人 (2023) 的近期工作表明，通过对对比学习方法进行调整以考虑组织特异性特征，可以提高在下游诊断任务中的性能。同样，Zhang 等人 (2022) 表明，将分级组织结构感知整合到对比框架中，能够更好地捕捉病理诊断的多分辨率特性。这些将自监督学习范式适配于于病理组织学独特特征的改进，为开发标注高效的计算病理学工具提供了一个充满前景的方向，这些工具可以克服限制当前监督方法的巨大资源限制。\n\
  \n## 医学影像中的自监督学习\n\n自监督学习已成为利用无标记医学影像数据的强大范式，特别是解决了计算病理学中的标注瓶颈问题。这种方法通过巧妙地从数据本身生成监督信号，使模型能够在没有专家标注的情况下学习有意义的表示。这些技术在医学影像中的演进，代表了向更高效的医疗保健应用\
  \ AI 系统迈出的重要一步。\n\nThorat 等人 (2024) 将旋转预测和对比学习方法应用于胸部 X 光的开创性工作。他们的全面评估表明，在标记数据有限的情况下，使用这些自监督技术预训练的模型显著优于传统的监督方法。他们报告说，仅使用\
  \ 20% 的可用标记数据，肺炎分类准确率就提升了 15%，说明了自监督学习在减少标注需求方面的潜力。这项研究提供了具体的证据，证明针对领域适配的自监督方法可以有效解决医学领域的标注瓶颈。\n\
  \nTaleb 等人 (2020) 的早期工作引入了 `3D CutAndPaste`，这是一种专门为体学医学数据设计的创新辅助任务。该方法要求模型判断子体积是否正确放置在整体体积内，这项任务需要对三维解剖结构及其空间关系有全面的理解。他们在脑\
  \ ATM 体积上的实验表明，使用这种技术预训练的模型对正常解剖配置开发了稳健的表示，有助于异常检测等下游任务（Patel, S., et al., 2022）。特别在病理组织学中，已经开发了若干种创新的自监督方法来利用\
  \ `WSIs` 的独特特性。Gildenblat 等人 (2021) 利用放大率预测任务作为自监督，利用了病理组织学图像的多尺度特性。他们的方法强制网络理解跨越不同放大倍数的一致性组织特征，从\
  \ 40x 下的细胞细节到 5x 下的架构模式，有效地捕捉了病理组织学检查的层级性质。\n\nLi 等人 (2022) 通过拼图解决框架探索了组织结构内的空间关系。通过将病理组织图像分割成补丁并挑战网络重建原始排列，这种方法要求模型同时理解局部模式及其语境安排。他们的实验证明，使用这种技术预训练的模型增强了对组织结构的感知能力。\n\
  \nCiga 等人 (2021) 的一项关键发现表明，在未标记的病理组织学上进行自监督预训练在多个任务中始终优于 ImageNet，强调了领域特定特征即使在没有显式监督的情况下学习也具有价值。这挑战了使用自然图像数据集进行医学图像分析的标准做法。他们在多个癌症任务上的实验显示，与\
  \ ImageNet 相比平均提升了 8.3%。\n\n对比学习框架在病理组织学应用中展现出特别的前。Wang 等人 (2022) 专门为病理组织学适配了 `MoCo`\
  \ 框架，展示了癌症分类的显著改进。他们的方法修改了标准的数据增强流水线，在创建具有足够挑战性的正对的同时保留了与诊断相关的特征，解决了直接将自然图像对比技术应用于医学影像的关键局限性。Lu\
  \ 等人 (2021) 开发了 `CLAM (Contrastive Learning for Multiple Instance Learning)`，这是一个专门为计算病理学设计的框架，解决了从弱监督全切片图像中学习的独特挑战（即只有切片级标签，而诊断相关的特征可能仅占总面积的一小部分）。\n\
  \n尽管取得了这些进展，大多数现有方法仍运行在单一尺度上，没有充分利用病理学分析的基础多尺度性质和空间上下文。全面的病理学评估需要整合多个放大倍率的信息。Fernandez-Perez\
  \ 等人 (2024) 的近期工作通过开发多尺度对比学习方法解决了这一局限性，该方法在学习不同放大倍率表示的同时，保留了它们的层级关系。他们新的损失函数明确强制了不同尺度表示之间的一致性，模拟了病理学家整合跨放大信息的方式。与单尺度方法相比，他们的方法在肿瘤检测敏感性上提升了\
  \ 12%。\n\n同样，Zhang 等人 (2024) 提出了一种感知上下文的对比学习框架，显式建模了相邻组织区域之间的空间依赖。他们的方法结合了空间注意力机制，根据语境关系对不同区域的重要性进行权重，更好地捕捉了病理学家在诊断中使用的复杂模式。在结肠癌和乳腺癌数据集上的评估表明，这种感知上下文的方法显着提高了模型识别依赖于空间上下文的细微诊断特征的能力。\n\
  \n\n\n\n最近，Kumar R. 等人 (2024) 提出了一种专门为组织病理学设计的分层对比学习框架，该框架整合了局部细胞特征和全局架构特征。他们的方法使用了一种多分支架构，同时在细胞、组织和器官层面上学习表示，并采用一种新颖损失函数来强制这些分层层级之间的一致关系。在多种癌症类型上的实验表明，这种分层方法能够更好地捕捉组织病理诊断中的多尺度特性，与传统的单尺度对比方法相比，准确率提升了\
  \ 9.7%。\n\n## 提议的方法论\n\n所提出的基于极少标注的自监督补块构建学习（`SSPC`）方法通过利用自监督对比学习，解决了在有限标记数据下组织病理图像中进行肿瘤检测的挑战。\n\
  \n该方法由三个主要阶段组成：首先，该方法采用了一种基于补块（patch）的对比学习框架，模型学习区分同一组织补块的增强版本（正样本对）与不同的组织补块（负样本对）。这是通过专门设计的对比损失函数实现的，该函数最大化了正样本对表示之间的一致性，同时推开负样本对的表示。此阶段不需要人工标注，允许模型从大型未标记的组织病理数据集中学习有意义的组织表示。\n\
  \n![图 1 提议系统的架构图。](img/fig7_1_B.jpg)\n\n图 1 提议系统的架构图。\n\n其次，使用来自对比学习阶段的预训练编码器通过极少量的标注图像进行微调。作者在编码器上实现了一个轻量级分类头，并训练其将补块分类为肿瘤或非肿瘤。这种迁移学习方法利用了在自监督期间学习到的丰富特征表示，以显著更少的标记示例实现了高准确率。\n\
  \n第三，该方法结合了多分辨率补块采样策略，同时捕捉局部细胞细节和更广泛的组织架构。这解决了与肿瘤识别相关的组织病理特征的多尺度特性。该方法还包括了针对组织病理学定制的特殊数据增强，例如染色归一化和颜色抖动，这些提升了模型对组织制备变的鲁棒性。实验结果表明，该方法实现的肿瘤检测性能与全监督方法相当或更优，但仅需\
  \ 10-20% 的标记数据，这使其在专家标注昂贵且有限的医学背景下特别具有价值。\n\n我们将组织病理图像中的高效肿瘤检测问题表述为：给定一组有限的标注全切片图像（WSIs）`D[L]`\
  \ = `(x[i], y[j])[i=1]^(M)` 和一组更大的未标记 WSIs `D[U]` = `(x[i], y[j])[i=1]^(N)`，其中 `M\
  \ << N`，我们的目标是开发一个利用标记和未标记数据的框架来训练一个模型 `f[θ]`，使其能够准确检测新 WSI 中的肿瘤区域。每个 WSI `X` 都非常大（通常为\
  \ 50,000 x 50,000 像素或更大），必须作为一组较小的补块进行处理。我们将从 WSI `X` 中提取的补块集记为 `x[1]`、`x[2]`、...\
  \ `x[k]`，每个补块 `x[k]` 是一个小的图像区域（例如 256 x 256 像素）。标记 WSI 的标注 `Y` 可以在不同粒度上提供：\n\n*\
  \   切片级标签，指示肿瘤的存在或否。\n*   肿瘤边界的标注。\n*   像素级分割掩码，精确勾勒肿瘤区域。\n\n我们的方法旨在通过利用自监督补块对比学习，在最大化检测性能的同时最小化所需的标注工作。\n\
  \n我们的框架由三个主要阶段组成：\n\n*   **自监督预训练：** 我们在未标记的组织病理图像上使用补块对比学习预训练特征提取器，以学习捕捉组织形态和结构有意义的表示。\n\
  *   **表示分析与精炼：** 我们分析学习到的表示以确保它们捕捉了与诊断相关的特征，并精炼模型以强调临床上重要的模式。\n*   **高效微调：** 我们利用极少标记数据微调模型。\n\
  \n## 补块提取与预处理\n\n由于其巨大的尺寸和多分辨率特性，WSIs 在计算病理学中面临独特的挑战。所描述的方法采用了一种复杂的方法，从这些吉像素图像中高效提取并预处理多尺度补块，以在不同生物学层级捕捉信息。WSIs\
  \ 以金字塔格式存储，具有多个分辨率级别，模拟了病理学家放大和缩小的检查过程。所描述的工作流从组织检测开始以消除背景，将计算资源集中在诊断相关的组织区域。这一关键预处理步骤防止了在无信息区域上浪费资源，并解决了\
  \ WSI 中固有的类别不平衡问题，背景通常占据图像的大部分 (Mahmood 等，2024)。\n\n在 20 倍倍率（0.5 µm/像素）下提取 256 x\
  \ 256 像素的补块代表了捕捉足够细胞细节与计算效率之间的仔细平衡。相邻补块之间 50% 的重叠（128 像素步长）确保了空间连续性，并提供了补块边界的上下文信息，对于保留可能破碎的重要组织结构至关重要。正如\
  \ Zhang 和 Wang (2024) 所示，这种重叠策略提高了模型捕捉跨多个补块的连续特征（如浸润性肿瘤模式）的能力，如图 2 所示。\n\n![图 2\
  \ 组织病理学多尺度对比学习。⏎](img/fig7_2_B.jpg)\n\n图 2 组织病理学多尺度对比学习。⏎](#R_fig7_2\n\n在相同位置中心提取\
  \ 10 倍和 5 倍倍率的对应补块的多尺度方法创建了分层表示，捕捉了详细的细胞形态和更广泛的架构模式。\n\n这种多分辨率策略符合病理学家的诊断工作流，他们通常会在不同倍率下检查组织。Chen\
  \ 等人 (2024a) 显示，与单尺度方法相比，整合此类层次信息的模型在肿瘤分类任务中实现了更高的准确率。\n\nMacenko 染色归一化的应用解决了计算病理学中的一个基础挑战，因为不同实验室和扫描仪之间的染色和颜色分布存在差异。这一预处理步骤增强了学习表示跨机构和扫描方案的泛化能力。Pati\
  \ 等人 (2024) 的最新工作表明，在染色归一化补块上训练的模型在测试外部数据集时，性能比在未归一化数据上训练的模型提高了 15-20%，这强调了该归一化步骤对于开发稳健且具有临床价值的算法的关键性。\n\
  \n空间感知 — 负样本\n\n\n\n\n我们将实例判别任务（Pradeep Singh, Balasubramanian Raman, 2025）应用到补丁（patch）级别，将每个补丁视为唯一的实例，同时考虑其空间上下文。对于给定的锚点补丁\
  \ `x[a]`，我们通过对同一补丁应用数据增强来创建正对，通过从不同位置或不同的全切片图像（WSI）采样补丁来创建负对。正补丁对 `(x[a], *x[p])*`\
  \ 与负补丁集 `x[n]` 的对比损失函数定义为：\n\n(1)\n\n$$L\\_{cont}(x\\_{a},x\\_{p},\\\\left\\\\{\
  \ x\\_{n} \\\\right\\}) = - \\\\log\\\\frac{\\\\exp(sim(z\\_{a},z\\_{p})/\\\\tau)}{\\\
  exp(sim(z\\_{a},z\\_{p})/\\\\tau) + \\text{Σ}\\_{n}\\\\exp(sim(z\\_{a},z\\_{n})/\\\
  \\tau)}$$\n\n其中：`z` 代表补丁的编码表示，`sim (u, v) = u^T` 是余弦相似度，`τ` 是控制分布集中度的温度参数。我们方法中的一个关键创新是空间感知负采样策略。在组织病理学中，由于空间连续性，相邻补丁通常共享相似的组织特征，而远远的补丁可能代表完全不同的组织类型。为了考虑到这种空间关系，我们对负对采用了基于距离的采样策略。\n\
  \n(2)\n\n$$p(x\\_{n})\\\\alpha\\\\exp( - \\\\frac{d{((i,j),(i\\_{n},j\\_{n}))}^{2}}{2\\\
  \\sigma^{2}})$$\n\n其中：`d((i,j),(i„j„))` 是补丁位置之间的欧几距离，`σ` 是控制采样空间范围的参数。该策略确保模型学习区分可能出现在相邻的视觉相似组织区域，这对于准确的肿瘤边界检测至关重要，如图图\
  \ 3 所示。\n\n![Fig. 3 组织病理补丁的空间感知负采样策略。⏎](img/fig7_3_B.jpg)\n\n图 3 组织病理补丁的空间感知负采样策略.⏎\n\
  \n### 多尺度对比学习\n\n生物学中的对比学习可以通过引入捕获跨生物层次信息的多尺度表示来增强。这种方法认识到生物系统同时在多个尺度上运行，从分子到细胞再到组织到有机体。\n\
  \n多尺度对比学习框架的工作原理如下：\n\n1. 在不同分辨率下提取特征（例如，亚细胞结构、整个细胞、组织区域）。\n2. 跨尺度的特征对齐。\n3. 定义对比无关生物实体的负对。\n\
  \n这种方法使模型能够学习在跨生物尺度上保持连贯性的嵌入，同时区分无关的实体。生成的表示既可以捕获细粒度的分子细节，也可以捕获更广泛的组织级模式。\n\n通过学习这些跨尺度的表示，模型可以更好地理解分子变化如何传播到细胞表型、细胞行为如何转化为组织功能，以及组织结构如何与有机体结果相关，最终为对复杂的生物系统提供更全面的理解。对于最高倍率下的每个锚点补丁\
  \ `x[a]`，我们通过考虑以下因素创建一个层次正对集：\n\n* 相同倍率下同一补丁的增强版本\n* 较低倍率下的特征\n* 相同倍率下高重叠的相邻补丁。\n\
  * 这种多尺度对比学习强制模型对齐不同倍率之间的表示，学习捕获详细细胞形态和更广泛组织架构的尺度不变性特征。多尺度对比损失定义为：\n\n(3)\n\n*L*[*m**s*] = *λ*[1]*L**c**o**n**t*,ↆ{*x*[*n*]}) + *λ*[2]*L**c**o**n**t*,ↆ{*x*[*n*]}) + *λ*[3]*L**c**o**n**t*,ↆ{*x*[*n*]})\n\
  \n* 其中：`x[p]^(*a**u**g*)`、`x[p]^(*s**c**a**l**e*)` 和 `x[p]^(*n**b**r*)` 分别代表增强、多尺度和相邻正对，`λ[1]`、`λ[2]`\
  \ 和 `λ[3]` 是权重系数。\n\n## 动量编码器和内存库\n\n为了能够使用大量负样本进行高效训练，我们采用了类似于 MoCo 的动量编码器架构。动量编码器通过在线编码器的移动平均进行更新：\n\
  \n(4)\n\n*θ*[*m*]←*m**θ*[*m*]+(1−*m*)*θ*[*q*]\n\n其中：`θ[m]` 和 `θ[q]` 分别是动量编码器和在线编码器的参数，`m\
  \ ∈ [0, 1]` 是动量系数。我们维护一个来自之前批编码补丁的内存库，允许提供大量且一致的负样本集。这对于组织病理数据尤为重要，因为 WSI 内部及之间的变异性很大。\n\
  \n### 网络架构\n\n所提方法的网络架构由三个部分组成：\n\n* **编码器网络**：我们使用 ResNet-50 主干作为编码器网络，以适应组织病理图像的特定特征。编码器将每个补丁\
  \ `x` 映射到高维特征表示 `h = fθ`。\n* **投影头**：根据 Chen 等 (2022b)，我们使用投影头 `g[o]` 将 `h` 映射到低维空间\
  \ `z = gϕ` 应用对比损失。投影头由带有 ReLU 激活函数的 MLP 组成。\n* **预测头**：对于下游检测任务，我们添加任务特定的预测头 `p[ψ]`，将编码表示\
  \ `h` 映射到所需的输出（用于分类的肿瘤概率或用于像素级的分割掩码）。\n\n在自监督预训练期间，仅训练编码器和投影头。对于下游任务，编码器权重从预训练模型初始化，预测头在可用标注数据上进行训练。\n\
  \n### 少量标注的高效微调\n\n在自监督预训练后，我们使用有限的可用标注对模型进行微调以检测肿瘤。我们采用了多种策略来最大化微调的效率：\n\n### 用于高效病理标注的主动学习\n\
  \n主动学习是优化数字医学标注过程的一种强大策略，特别是在处理 WSI 时。这种方法策略性地识别并优先考虑最有价值的区域进行专家标注，从而用最少的人力实现模型的改进。该过程从将预训练模型部署到未标记\
  \ WSI 数据集开始。系统并不是随机选择区域进行标注，而是利用预测的不确定性指标来识别模型缺乏信度的区域。这些不确定性测量可以通过多种方法获得，例如熵值、预测方差或置信度阈值，每种方法都突出了模型难以做出确定分类的区域。\n\
  \n\n\n当识别出这些高不确定性区域时，它们会被系统地排队等待病理学家进行审查。这种针对性的方法确保了病理学家宝贵的时间集中在最具挑战性和信息量丰富的组织区域上。所选区域通常代表了边界病例、罕见表型或异常形态模式，这些这些是模型尚未从之前的训练数据中充分学习到的。通过对这些特定区域进行标注，病理学家为模型提供了精炼决策边界所需的精确信息。在接收到这些高不确定性区域的标注后，模型将重新训练，并将新标记的数据整合到其知识库中。更新后的模型随后分析剩余的未标记区域，识别出新的高不确定性区域。这创建了一个迭代反馈循环，每轮标注都能解决模型最显著的知识空白。这种方法带来的效率提升是巨大的。传统的标注方法可能需要对整个切片进行详尽审查，或者进行随机采样，这在易于分类的区域浪费了精力。相比之下，主动学习将标注资源集中在对模型改进贡献最大的诊断挑战性区域。研究表明，主动学习策略仅需随机采样方法所需\
  \ 20-30% 的标注工作，即可达到相当的模型性能。此外，这种方法自然地引导标注过程指向边缘病例和罕见表型，而这些病例在训练数据中可能代表性不足。这有助于解决医学数据集中常见的类别不平衡问题，并提高模型在不同病理表现中的稳健性，最终为临床部署创建出更可靠的\
  \ AI 系统。\n\n## 通过带伪标签的半监督学习优化病理学 AI\n\n带伪标签的半监督学习为计算病理学中最顽顽固的挑战之一提供了一种优雅的解决方案：即海量可用\
  \ WSI（全切片图像）数据与病理学家能够可行标注的有限区域之间的巨大差异。这种方法系统地利用丰富的未标记组织区域来增强模型性能，同时兼顾了手动标注的限制。\n\
  \n该方法始于一个仅在病理学家核实的标注上训练的基础的基础模型。虽然这些标注代表了训练数据的金标准，但它们通常只覆盖了 WSI 中总组织区域的一小部分。半监督方法并没有丢弃剩余的未标记区域，而是将这些区域从限制转化为模型增强的机会（Gildenblat\
  \ et al., 2021）。初始模型虽然不完美，但具备足够的判别能力，对每个切片的未标记区域做出合理的预测。当模型对未标记区域生成预测时，会发生一个关键的过滤步骤。系统应用置信度阈值将高置信度预测与不的分开。只有超过这些仔细校准的置信度阈值的预测会被转换为伪标签。这种选择性方法确保了只有最可靠的模型预测会被纳入训练信号，在扩大训练量的同时维持数据质量。置信度阈值本质上起着质量控制机制的作用，在最大化可用训练数据和最小化可能降低模型性能的错误标签之间取得平衡。\n\
  \n随后的重训练阶段巧妙地结合了原始的病理学家生成的标注（真实标签）和高置信模型伪标签。这个组合数据集允许模型从规模更大、更多样化的示例中学习，同时将其学习锚定在专家核实的地面真值上。训练过程通常对真实标签和伪标签实施不同的加权策略，通常为病理学家核实的标注分配更高的权重，以防止来自伪标签的潜在错误传播。该方法的一个特别复杂的方面是在整个迭代训练过程中对置信度阈值的自适应调整。随着模型性能的提高，系统可以自适应地增加阈值要求，确保在后续迭代中只有越来越可靠的预测才成为伪标签。这种动态阈值调整代表了一种自我调节机制，随着模型的演化维持伪标签的质量。某些实现结合了课程学习原理，随着模型能力的成熟，逐渐引入更具挑战性的伪标签。\n\
  \n这种方法的益处不仅限于增加训练数据量。伪标签通过在以高置信度正确识别罕见形态模式或代表性不足的类别时，按比例纳入更多此类示例，自然地解决了类别不平衡问题。该方法通过让模型接触到比仅通过手动标注所能更多的组织多样性和上下文变化，还增强了模型的泛化能力。从实际实现的角度来看，这种方法极地提高了标注效率。病理学家可以将他们的专业知识专注于标注代表性区域或挑战性病例，而伪标签机制则能有效地将他们的见解传播到类似的组织区域。结果是，模型尽管只接收了总组织区域部分的专家标注，但其表现就像在经过全标注的\
  \ WSI 上训练的一样。这种半监督方法代表了一种最大化利用 WSI 中每个像素效用的原则策略，将部分标注的挑战转化为一个利用专家知识和计算模式识别的复杂学习框架，以推进计算病理学的诊断准确性。\n\
  \n### 一致性正则\n\n为了进一步提高有限标注微调的稳健性，我们通过强制同一块的不同增强版本之间产生一致预测来应用一致性正则：\n\n(5)\n\n```\n\
  L_cons = \\frac{1}{B}\\sum_{i = 1}^{B}\\| p_{\\psi}(f_{\\theta}(x_{i})) - p_{\\\
  psi}(f_{\\theta}(x'_{i}))\\|^{2}\n```\n\n其中：`x[i]` 是块 `x[i]` 的增强版本，`B` 是批量大小。总微调损失是标注数据上的监督损失和一致性损失的加权组合：\n\
  \n(6)\n\n```\nL_finetune = L_sup + λ[cons]L_con\n```\n\n其中：`λ[cons]` 控制一致性正则项的贡献。\n\
  \n## 基于空间相干性细化的高级分块肿瘤检测\n\n\n\n\n由于全幅切片图像（WSI）吉像素级的尺寸，在其中进行肿瘤区域检测和精确勾勒面临着巨大的计算挑战。一种带有策略性后处理的复杂基于补块的方法提供了一种平衡计算效率与诊断准确性的有效解决方案。该方法首先通过将每个\
  \ WSI 系统地在最高可用放大率下划分为重叠的补块（patches）。这种高分辨率方法确保了准确识别肿瘤所需的关键细胞细节和细微形态特征能够得以保留。重叠补块提取策略至关重要，因为它缓解了本会在补块边缘发生的边界伪影。通常，补块与相邻区域的重叠率为\
  \ 25-50%，对边界区域进行了冗余分析，这在这些交界处形成了一种集成预测的形式。\n\n这些提取出的补块随后通过微调后的深度学习模型进行单独处理，该模型已通过前述主动学习和半监督方法进行了优化。模型在补块级别执行语义分割，为每个像素分配一个肿瘤概率分。这种并行处理方法能够高效利用计算资源，因为补块可以分布在多个图形处理器（GPU）上进行同步分析。\n\
  \n对于包含数万个补块的吉像素 WSI，这种并行化将处理时间从潜在的几天减少到几分钟或几小时，该方法在临床上可行。随后的聚合阶段尤为微妙。在重建整个 WSI 的完整肿瘤概率图时，系统必须协调重叠区域处可能冲突的预测。加权平均机制通过根据预测在每个补块内的空间位置分配不同的重要性，解决了这一挑战。位于补块中心附近的像素获得较高的权重，这是基于一项经验观察：卷积神经网络通常在感受野的中心产生更可靠的预测，因为那里拥有完整的上下文信息。这种以中心为权重的聚合方案在整个切片上创建了一个平滑融合的概率图，同时最大限度地减少了边缘伪影。\n\
  \n尽管聚合过程非常复杂，但生成的概率图可能仍包含基于病理组织学原理的不一致之处或不符合逻辑的模式。引入条件随机场（CRF）作为后处理步骤，通过结合空间上下文信息和关于肿瘤形态的先验知识来解决这些问题。CRF\
  \ 运行的基础是：除非被强视觉边界隔开，否则相邻像素应该具有相似的标签。它将肿瘤检测表述为一个能量最小化问题，其中能量函数包含了深度学习模型的预测（一元势）和相邻区域之间的空间关系（二元势）。这种\
  \ CRF 精炼通过强制若干与病理相关的约束，显著增强了最终分割的生物学合理性。它确保了肿瘤边界光滑并遵循实际组织过渡，而不是产生锯齿状的人工勾勒。该方法还消除了与周围组织上下文不一致的孤立假阳性像素或小区域。此外，它保留了肿瘤边界处的细微结构细节，这些细节在补块聚合过程中可能会丢失，从而实现了更准确的肿瘤边缘评估。\n\
  \n从临床实施的角度来看，该方法具有几个实际的优势。基于补块的方法允许在处理进行时对结果进行渐进式可视化，使病理学家能够在算法继续分析切片其余部分时开始审阅初始区域。该框架还自然地适应了多分辨率分析，可以在较低放大率下进行初步筛选，随后对可疑区域在更高分辨率下进行分析，进一步提高了计算效率。由\
  \ CRF 精炼确保的空间一致性使得产出的分割结果与病理学家的预期更加贴近，可能增加临床接受度。此外，准确的边界勾勒有助于对肿瘤特征（如大小、形状和浸润模式）进行定量评估，提供了客观指标，可以补充病理学家的定性评估，并可能对预后评分系统做出贡献。\n\
  \n## 实验设置：数据集\n\n我们在代表不同癌症类型的多个病理学数据集上评估了我们的方法：\n\n-   **CAMELYON16:** 用于淋巴结乳腺转移检测的基准数据集。它包含\
  \ 400 张全幅图像（270 张用于训练，130 张用于测试），具有转移区域的像素级标注。\n-   **TCGA-BRCA:** 来自癌症基因组谱的乳腺浸润性癌数据集，包含来自\
  \ 1097 名患者的 1099 张 WSI。我们使用了带有病理学家标注的子集，其中包含肿瘤、间质和正常组织的标注。\n-   **BACH:** 乳腺癌组织学挑战数据集，由\
  \ 400 张高分辨率 H&E 染色显微图像组成（包括 100 张正常、100 张良性、100 张原位癌和 100 张浸润癌），具有图像级标签。\n-   **DigestPath:**\
  \ 用于胃癌检测的数据集，包含 250 张具有区域像素级标注的 WSI。\n\n对于每个数据集，我们创建了三种不同标注数量的实验设置：\n\n-   **极低资源:**\
  \ 5%的训练数据标注。\n-   **低资源:** 10%的数据标注。\n-   **中等资源:** 20%的训练数据标注。\n\n剩余的未标记数据用于自监督预训练。\n\
  \n## 评估指标\n\n使用以下指标：\n\n-   **受试者工作曲线下积 (AUROC):** 衡量区分肿瘤和正常组织的能力。\n-   **F 分数:**\
  \ 精率和召回率的调和平均数，提供了平衡衡量。\n-   **Dice 系数:** 用于分割任务，衡量预测区域与真实值之间的重叠度。\n-   **Frechet\
  \ 距离 (FID):** 通过比较模型与监督基线的特征分布来衡量学习表示的质量。\n-   **少样本适应性能:** 评估模型在极少量标记示例（1、5 和 10\
  \ 样本）情况下适应新癌症类型的速度。\n\n### 基准方法\n\n我们将提出的方法与以下基准方法对比\n\n1. **全监督:** 使用所有可用标注数据从头训练的\
  \ ResNet-50。\n2. **ImageNet 预训练:** 在 ImageNet 上预训练并在病理学数据集上微调的 ResNet-50。\n3. **旋转预测:**\
  \ 基于预测补块旋转角度的自监督方法。\n4. **SimCLR:** 使用批内负样本的对比学习框架。\n5. **MoCo v2:** 带有改进增强策略的动量对比学习方法。\n\
  6. **BYOL:** 一种通过自引导学习表示而不需要负样本的自监督方法。\n7. **SwAV:** 使用在线聚类的自监督方法。\n8. **SelfPath:**\
  \ 专门为病理学设计的自监督方法，结合了多个预训练任务。\n\n为了公平比较，所有方法使用相同的 ResNet-50 骨干网络，并在标注子集上微调之前使用相同的未标记数据进行预训练。\n\
  \n### 消融实验\n\n\n\n\n\n为了分析我们框架中每个组件的贡献，我们进行了消融实验：\n\n1. **补丁采样策略：** 比较随机采样与我们的层次化多样性感知采样。\n\
  2. **数据增强策略：** 比较标准数据增强与我们的组织特异性数据增强。\n3. **对比损失函数：** 评估我们的多尺度对比损失与标准对比损失相比的影响。\n\
  4. **难负样本挖掘：** 评估难负样本挖掘对表示质量的贡献。\n5. **微调策略：** 比较不同的微调策略（全量微调、冻结特征、逐渐解冻）。\n\n所有消融实验均在\
  \ CAMELYON16 数据集上进行，使用 10% 的标注数据\n\n## 结果与讨论\n\n### 高级肿瘤检测方法的性能分析\n\n我们肿瘤检测方法的的对比性能分析表明，其在多个数据集和标注场景下均具有卓越的效能。如表\
  \ **1，**所示，所提方法始终优于现有方法，在低资源设置下的表现尤为令人深刻。\n\n表 1 不同数据集和标注设置下肿瘤检测的 AUROC。⏎\n\n| Method\
