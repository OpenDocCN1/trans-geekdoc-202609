  \n### 将 Protégé 应用于数据\n\n在我们的案例中，`SPARQL` 将用于从患者人口统计学、试验成功率和副作用中检索和聚合数据。此外，通过 `Protégé`，可以推断结论并提供更好的决策支持。\n\
  \n### 语义网中的临床试验数据\n\n语义网中的临床试验数据通常来自政府数据库、私立医院数据库或研究机构。这些数据量巨大且分散。在印度、美国和俄罗斯等发达国家，临床试验针对的是特定群体而非全体。这些数据集具有高度机密性，因为它们包含了个人信息、病史和其他敏感细节，需要严格的安全处理。\n\
  \n将临床试验数据集成到语义网有助于创建知识图谱，允许研究人员和医疗专业人士获取决策有意义的见解。通过结构化和链接临床试验数据，更容易实现：\n\n*   跨试验的数据聚合。\n\
  *   分析参与特定药物或疫苗试验的参与者比例。\n*   通过对齐全球临床试验本体来增加互操作性。\n\n将这些数据推入本体可以确保与现有的医学和临床标准无缝集成，减少互操作性挑战。支持临床试验的一些知名本体包括\
  \ `SNOWMED`、`ADAM`、`STDM` 等。\n\n## 方法论\n\n将语义网技术集成到临床试验数据管理涉及多个阶段，确保数据转换、验证、查询、推理和最终应用。该方法论系统地组织了从原始临床数据预处理到其在临床决策支持系统（`CDSS`）中应用的过程。\n\
  \n每个阶段的设计旨在确保数据互操作性、维护准确性并支持为了临床见察的智能推理。后续章节描述了将临床试验数据处理为本体驱动知识框架的顺序方法。\n\n### 数据预处理\n\
  \n临床试验数据集通常从政府存储库、私立医院数据库或研究机构获取。这些数据集包含结构化（关系数据库）和非结构化（自由文本文档）信息，在集成到语义网框架之前需要仔细的预处理。以下是数据预处理的关键点：\n\
  \n1.  处理缺失值：缺失数据（如患者人口统计数据或试验结果）会导致推理和查询的不一致。采用了标准的填充方法或排除技术。\n2.  消除冗余和重复记录：由于多个医院数据源，临床数据集经常包含重复的试验记录。实施了去重技术。\n\
  \n\n\n\n\n### 3. **医学术语标准化：** 临床数据必须映射到全球标准，如 `SNOMED CT`、`UMLS` 或 `ICD-10`，以确保跨医疗系统的一致性解释。\n\
  \n### 4. **数据格式化与编码：** 将数据转换为机器读格式，以确保与基于 `RDF` 的本体具有兼容性，以便进一步处理。\n\n预处理完成后，清洗后的结构化数据将用转换为适用于语义网框架的格式。\n\
  \n### JSON 到 JSON-LD 的第二阶段转换\n\n预处理后的数据主要以 `JSON` 格式存储，被转换为 `JSON-LD`（用于链接数据的 JavaScript\
  \ 对象表示法），以符合链接数据原则。`JSON-LD` 通过以下方式增强语义表示：\n\n*   为资源附加唯一标识符 (`IRIs`)。\n*   定义数据实体之间的结构化关系。\n\
  *   支持直接集成到基于 `RDF` 的本体中。\n\n例如，`JSON` 中的标准患者记录表示为：\n\n在 `JSON-LD` 中，它变为：\n\n这种结构化格式建立了语义链接，允许在本体驱动的系统中进行高效的查询和推理。\n\
  \n### 第三阶段：将 JSON-LD 推入本体\n\n一旦临床试验数据以 `JSON-LD` 格式表示，就会被摄入本体中。使用 `Protégé` 设计的本体包括：\n\
  \n*   用于表示医学实体的 `Classes`（类）和 `Subclasses`（子类）（例如 `Patient`、`Clinical Trial`、`Drug`）。\n\
  *   定义实体之间关系的 `Object Properties`（例如 `has Diagnosis`、`participates InTrial`）。\n\
  *   用于将属性与实体关联的 `Data Properties`（例如 `age`、`test Result`）。\n*   每个患者记录被转换为一个 `OWL`\
  \ 个体并与相关的医学概念链接，确保跨数据集的知识互操作性。\n\n### 第四阶段：映射到全球本体\n\n为了确保语义一致性和数据互操作性，本体与全球医学本体对齐（Alahmar,\
  \ et al., 2022），例如：\n\n*   `SNOMED CT`（用于疾病和临床程序）。\n*   `UMLS`（用于标准化医学术语）。\n*  \
  \ `LOINC`、`ICD-10`、`RxNorm`（用于实验室检查、疾病分类和药物相互作用）。\n\n例如，一项 2 型糖尿病的临床试验映射到 `SNOMED\
  \ CT` 代码 `44054006`，确保其在各种医疗知识库中被识别。此阶段对于实现临床数据跨不同平台的全球访问至关重要。\n\n### 第五阶段：SHACL\
  \ 验证（确保数据质量）\n\n在执行查询或推理之前，本体需要经过 `SHACL`（形状约束语言）验证，以确保结构正确性和数据一致性。这一步对于验证临床试验数据符合预定义约束防止潜在错误至关重要。`SHACL`\
  \ 验证的关键方面包括：\n\n*   验证强制属性，如患者记录、试验 ID 医学观察。\n*   强制结构约束以维护实体间的逻辑一致性。\n*   确保数据实例之间关系的完整性，避免连接缺失。通过\
  \ `SHACL` 验证，本体得到了精炼和结构化，确保随后的查询和推理产生准确的结果。\n\n### 第六阶段：SPARQL 执行（查询知识库）\n\n一旦通过验证，本体将作为知识库，可以使用\
  \ `SPARQL`（SPARQL 协议和 RDF 查询语言）进行查询。`SPARQL` 支持临床试验数据、患者记录和医学观察的结构化检索，同时支持超越传统数据库查找的语义查询。\n\
  \n### 第七阶段：SWRL 验证（应用推理）\n\n为了增强决策，采用了语义网规则语言 (`SWRL`) 来定义 `if-then` 规则。`SWRL` 的关键组件包括：\n\
  \n*   为试验数据定义基于规则的逻辑。\n*   通过推理引擎（例如 `Pellet`）应用逻辑约束。\n*   基于现有数据导出新的医学见。\n\n###\
  \ 第八阶段：最终应用集成\n\n最后阶段涉及将处理过的、验证的和推理知识集成到现实应用中（Senevirat, et al., 2023）。这种集成的关键方面包括：\n\
  \n*   连接 `CDSS` 以辅助医疗专业人员。\n*   将结构化知识存储在 `MongoDB`、`GraphDB` 等数据库。\n*   为研究人员和医生生成报告。\n\
  \n此阶段将结构化的临床试验数据转换为可操作的知识，增强了语义网框架的实用性和影响。\n\n\n\n\n在转换之前，数据进行了如下清洗和结构化处理：\n\n*\
  \   处理了缺失值（例如，缺失的患者 ID）。\n*   删除了冗余或重复的记录。\n*   纠正了术语不一致的问题（例如，药名、剂量单位）。\n\n## 2\
  \ 从 JSON 到 JSON-LD 的转换\n\nJSON-LD 通过在兼容本体论的格式中定义实体之间的关系，增强了语义互操作性。它能够实现：\n\n*  \
  \ 命名个体（例如，`Patient_001` 被定义为 `#NamedIndividual`）。\n*   类层次结构（例如，“TrialParticipants”是“Patients”的子类）。\n\
  *   对象属性（例如，`Patient_001` 链接到 `Drug_Treatment_A`）。\n*   数据属性（例如，`Patient_001` 具有整数类型的“Age”）。\n\
  \n上述 JSON-LD 格式确保了临床试验数据是结构化的、机器可读的，并且在医疗和研究系统之间具有互操作性。\n\n![Fig 3 JSON-LD 表示。](img/fig10_3_C.jpg)\n\
