  \n![Fig 4 本体表示。](img/fig10_4_C.jpg)\n\n图 4 本体表示。\n\n### 映射到全局本体\n\n为了避免映射时的互操作性问题，我们将临床数据与全局本体（global\
  \ ontologies terminologies）的术语进行映射，以便我们创建的本体可以被全球访问。全球标准本体包括 SNOMED CT（用于医学状况和程序）、ADaM\
  \ 和 SDTM（用于试验数据标准化）等。详细描述见表 2。\n\n表 2 全局本体概览。\n\n| 全局本体 | 描述 | 关键组件 |\n| --- | ---\
  \ | --- |\n| OBI (生物医学调查本体) | 标准的生物医学调查、实验和工作流。 | 生物样本（如血液、组织）、实验方法（如 PCR）、实验室仪器（如显微镜）。\
  \ |\n| CHEBI (生物学利益化学实体) | 为化学化合物及其生物学作用提供结构化词表。 | 化学化合物（如葡萄糖、血红蛋白）、分子相互作用（如药物代谢）、生物应用（如抗生素）。\
  \ |\n| SNOMED CT (医学系统化命名——临床术语) | 用于医疗保健中疾病分类、程序和症状的标准术语。 | 疾病分类（如肺癌、贫血）、医疗程序（如\
  \ MRI、活检）、症状（如发热、关节疼痛）。 |\n| ADaM (分析数据模型) | 为临床试验分析提供结构化模型。 | 试验结果的标准化数据集、患者人口统计学数据。\
  \ |\n| SDTM (研究数据制表模型) | 定义临床试验数据如何结构化以提交给监管机构。 | 临床事件、干预措施、研究人群特征。 |\n\n### SHACL\
  \ 验证\n\n当数据推入本体时，会执行 SHACL（形状约束语言）验证以确保数据类型的完整性。这是一种用于验证 RDF 文件的语言。这提高了数据的一致性、准确性和互操作性。所有临床试验实体都被定义为形状图（shape\
  \ graphs），并根据验证前使用的特定条件集、数据聚合等对其进行验证。对于临床试验数据，我们使用 `SHACL` 来验证 `Patient ID`、`Age`、`Sex`\
  \ 等。例如，如果 I 组的年龄在 0–18 岁之间，如果突然出现 19，我们的形状将通过一条不一致的消息发出警报。\n\n验证患者人口统计数据的示例见表 3。\n\
  \n表 3 SHACL 形状和条件。\n\n| SHACL 形状 | 强制执行的条件 |\n| --- | --- |\n| PatientShape | 验证临床试验具有唯一的\
  \ ID、赞助商、药物信息和患者参与详情。 |\n| ClinicalTrialShape | 确保患者年龄在允许范围内（18–99 岁）并链接到至少一项临床试验。\
  \ |\n| DrugShape | 检查每种药物是否都有定义的名称、制造商和批准的剂量范围。 |\n| AdverseEffectShape | 确保记录不良反应的严重程度和相关药物。\
  \ |\n| InvestigatorShape | 确认研究者拥有有效的医疗执照并与至少一项临床试验相关。 |\n\n![Fig 5 SHACL 示例。](img/fig10_5.jpg)\n\
  \n图 5 SHACL 示例。\n\n上述形状表明，年龄应该是整数，而不是浮点数或小数。当年龄在 18–99 之间时应为负数或小于 18，如果年龄大于 99，将显示错误消息。\n\
  \n### SPARQL 执行\n\n在通过 SHACL 完全验证数据后，SPARQL（Riazanov et al., 2013）用于从知识库中执行或提取有意义的决策。它是一种用于操作本体中\
  \ RDF 数据的检索语言。特别在临床试验数据中，SPARQL 用于提取人口统计数据、药物治疗以及试验详情。类似于 `SQL`（结构化查询语言），它用于临床数据的\
  \ `INSERT`、`UPDATE`、`DELETE`、`ALTER` 函数。\n\n例如，如果你想查看参与试验的性别类型，下面的代码片段将解释：\n\n![Fig\
  \ 6 SPARQL 示例。](img/fig10_6.jpg)\n\n图 6 SPARQL 示例。\n\n上述查询检索所有推入 `SEX` 的个体，无论性别如何，`SEX`\
  \ 列表将被检索，上述查询的执行结果为：\n\n![Fig 7 SPARQL 结果。](img/fig10_7.jpg)\n\n图 7 SPARQL 结果。\n\
  \n因此，SPARQL 是一种高效的查询语言，可以提供 `Count`、`Mean`、`Median`、`Model` 等即时聚合。要计算给定临床试验人群中的男性和女性人数，请查看下方的规则。\n\
  \n### SWRL 规则\n\n在使用 SPARQL 进行聚合后，临床试验数据知识推理的下一步涉及应用 SWRL 规则。SWRL 通过定义 IF-THEN 逻辑对本体进行推理，允许我们从现有知识库中推导出新见解。这在临床试验中特别有用，用于推理患者状况、预测诊断和验证医疗数据。\n\
  \n使用 Python 中的 `OWLReady2`，我们可以动态将 SWRL 规则推入本体的规则选项卡，并使用 `Pellet` 推理机执行推理。推理机应用逻辑条件来增强本体知识。\n\
  \n在我们的用例中，`LabTest005` 被归类为 `AI Diagnostic` 并具有特定的对象属性断言，如 `Test performed on: TestSample005`、`Conducted\
  \ by: LowStandardLab`，其数据属性为 `Test ID: “T005”`、`Test Name: “Lung Function Test”`、`Test\
  \ Result: “Abnormal”`。当我们对此条件应用 SWRL 时，我们可以定义肺功能测试标记为“异常”且由低标准实验室进行时，推理患者的高风险状况。\n\
  \n\n\n\n以下是编写在本体内部用于推理的静态规则。我们也可以通过在 `Python` 中集成 `SWRL` 并使用 `OWLReady2` 包来实现动态化。以下是本体内部的一条规则：\n\
  \n# 11 在 `Rule` 标签页下编写规则后，你必须运行 `drools` 并点击 `Drools->OWL`，然后在本体中启动 `Pellet` 推理器，随后知识将在特定的个体或类下自动进行推理（Sharma,\
  \ et al., 2024）。\n\n以下是通过上述规则生成的知识推理片段：\n\n![Fig. 8 SWRL 结果。](img/fig10_8_B.jpg)\n\
  \n图 8 SWRL 结果。\n\n当此规则应用时，任何与 `LabTest005` 关联的患者如果满足以下条件，将被分类为 `HighRiskPatient`：他们进行了肺功能测试；测试结果异常；测试由低标准实验室进行。通过使用\
  \ `SWRL`，我们可以确保异常测试结果被动态标记，并帮助医生/研究人员尽早识别高风险患者。推理出的知识还可以使用 `SPARQL` 进行聚合和进一步分析。\n\
  \n在基于 `SWRL` 的推理之后，接下来的关键步骤包括使用 `SPARQL` 提取推理知识以进行高级查询、将结构化结果存储在 `MongoDB` 或 `Triplestore`\
  \ 中以便无缝检索数据，并根据原始临床数据验证推理结果以确保准确性。此外，还会为医疗人员生成详细报告，辅助决策。最后，这些见解被集成到 `CDSS` 中，实现了实时\
  \ AI 驱动的预测，并提高了临床试验和医疗分析的效率。\n\n## 与现有方法的比较\n\n本文的主要贡献通过将语义网技术集成到临床试验数据中得到了体现。与仅依赖结构化关系型数据库和孤立数据系统的传统方法不同，所提框架利用了全面的语义网栈，包括\
  \ `RDF`、`JSON-LD`、`SHACL` 验证、`SPARQL` 查询和基于 `SWRL` 规则的推理。与现有方法相比，这种方法提供了几项创新贡献：\n\
  \n1. **增强数据互操作性**\n   所提系统通过将临床试验数据映射到全局本体（如 `SNOMED CT` 和 `UMLS`）实现了无缝数据集成。这解决了以往系统依赖缺乏标准表示的领域数据库的局限性。\n\
  \n2. **改进数据验证和质量控制**\n   通过应用 `SHACL` 验证，该框架强制执行数据完整性，确保临床数据符合预定义的结构约束。这种验证过程最小化了经常困扰传统系统的不一致和不准确问题。\n\
  \n3. **智能推理机制**\n   `SWRL` 规则的引入实现了自动推理和知识推理，增强了决策支持和预测分析。传统方法通常缺乏从现有数据集中推理新知识的能力，这限制了它们在实时临床决策中的可用性。\n\
  \n4. **可扩展性与灵活性**\n   系统处理结构化和非结构化数据格式（包括 `JSON-LD` 和 `RDF`）的能力为集成多样化数据源提供了灵活性。现有方法通常需要数据预处理或格式转换，这增加了处理开销。\n\
  \n5. **AI 增强的检索**\n   将 AI 技术（如 `LLMs` 和 `RAG`）与语义网框架相结合，为上下文感知检索和预测分析提供了一种新方法。这对于依赖简单关键词查询或预定义数据库模式的传统技术来说，是一项显著改进。\n\
  \n## 局限性\n\n尽管在临床试验管理中使用语义网有许多优势，但本研究也存在相当的局限性：\n\n- 系统高效处理大规模临床数据的能力受到计算复杂性的限制，特别是在本体上进行推理时。\n\
  - 虽然已尝试集成全局本体（例如 `SNOMED CT`、`UMLS`），但由于医学术语的不一致性，完全的互操作性仍然是一项挑战。\n- 临床试验数据涉及敏感患者信息，需要先进的加密和访问控制，这些均未得到充分涵盖。\n\
  - 用于推理的 `SWRL` 规则可能无法覆盖所有临床场景，需要进一步的完善和扩展。\n- `SPARQL` 查询执行和 `SHACL` 验证会引入处理开销，可能会影响性能。\n\
  - 虽然讨论了 AI 驱动的工具（如 `LLMs`、`RAG`），但它们在语义推理中的大规模实现超出了研究范围。\n\n## 未来工作与扩展\n\n为了解决已局限性并扩展研究范围，可以将以下方法作为未来工作以及本研究的扩展：\n\
  \n- 扩展 `SWRL` 规则并集成额外的领域本体，以提高推理准确性和决策支持。\n- 实现查询缓存、索引和联邦 `SPARQL` 执行，以增强处理复杂查询的性能。\n\
  - 利用深度学习模型和检索增强生成 (`RAG`) 进行 AI 驱动的推理、预测分析和个性化医疗建议。\n- 为临床试验开启多语言语义搜索功能，以支持全球研究社区。\n\
  - 实现基于本体的知识图谱的实时更新，以适应新的临床发现和不断演变的医学标准。\n\n## 结论\n\n这种临床试验数据管理的变革性方法证明了对大量生物医学数据进行结构化、链接和推理是可能的。随着临床研究的不断发展，对标准化、机器可读和互操作数据的需求变得至关重要。临床试验数据不仅可用，由本体、知识图谱、AI\
  \ 驱动检索和基于规则的推理支持的语义网框架确保了它们也是智能的，从而实现了无缝集成、自动推理和增强决策。\n\n\n\n\n\n## 参考文献\n\n*  \
