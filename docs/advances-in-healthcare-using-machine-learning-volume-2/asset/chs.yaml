  | **SelfPath** | 0.886 | 0.907 | 0.933 | 0.849 | 0.862 |\n| **Proposed Method**\
  \ | 0.912 | 0.935 | 0.952 | 0.878 | 0.891 |\n\n极低资源场景（5% 标注数据）凸显了我们方法最显著的优势。在 CAMELYON16\
  \ 上，AUROC 为 0.912，我们的方法大幅超过了此前最先进的 `SelfPath` (0.886)。考虑到对病理学工作流的实际影响（其中标注时间是一个关键瓶颈），这种性能差异变得更有意义。\n\
  \n所提方法随标注百分比增加的性能曲线展示了其在利用有限标签方面的极高效率。在标注数据为 20% 时，我们的方法方法在 CAMELYON16 上实现了 0.952\
  \ 的 AUROC，这几乎等同于需要五倍标注工作的全监督基准（0.964）。这代表了计算病理学的一项关键进展，在保持诊断级结果的同时，有效减轻了 80% 的标注负担。这种持续的性能优势不仅限于\
  \ CAMELYON16，还扩展到 TCGA-BRCA 和 DigestPath 等更有挑战性的数据集。在仅有 10% 标注数据的 TCGA-BRCA 上，我们的方法实现了\
  \ 0.878 的 AUROC，显著优于所有自监督替代方案。类似的模式在 DigestPath 数据集中也比出现，我们的方法在 10% 标注数据下的 AUROC\
  \ 为 0.891，大幅超过了次优基准线。\n\n这种性能特征验证了我们结合了多尺度对比学习、用于策略性标注选择的主动学习以及带有伪标签的半监督学习的集成方法。结果表明，我们的方法有效地弥补了全监督性能与有限标注场景之间的差距，解决了计算病理学中的一个基础性挑战。通过在大幅减少病理医生投入的同时实现高质量肿瘤检测，我们的方法代表向实用的、广泛部署的组织病理学分析\
  \ AI 系统迈出了重要一步。\n\n### 肿瘤分割性能详细分析\n\n表 2 所示的结果证明了所提方法在多个组织病理学数据集上像素级肿瘤分割的有效性。当仅使用\
  \ 10% 的标注数据时，新方法始终优于所有基准方法，同时显著缩小与利用 100% 可用标注数据的全监督学习之间的差距。\n\n表 2 肿瘤分割的 Dice 系数。⏎\n\
  \n| Method || CAMELYON16 (10%) || TCGA-BRCA (10%) || DigestPath (10%) |\n| --- |\
  \ --- | --- | --- |\n| **Fully Supervised (100% data)** | 0.964 | 0.921 | 0.939\
  \ |\n| **Supervised (limited data)** | 0.832 | 0.767 | 0.762 |\n| **ImageNet Pretrained**\
  \ | 0.867 | 0.802 | 0.803 |\n| **MoCo v2** | 0.904 | 0.843 | 0.855 |\n| **SelfPath**\
  \ | 0.907 | 0.849 | 0.862 |\n| **Proposed Method** | 0.935 | 0.878 | 0.891 |\n\n\
  在 CAMELYON16 上，我们的方法在 10% 标注数据下实现了 0.935 的 Dice 系数，比 `SelfPath` (0.907) 高出 0.028。对于\
  \ TCGA-BRCA，它达到了 0.878，而 `SelfPath` 为 0.849。在 DigestPath 中，该方法实现了 0.891，而 `SelfPath`\
  \ 为 0.862。\n\n## 空间感知负采样\n\n![Fig. 4 Tumor Detection Performance across Different\
  \ Datasets and Annotation Settings](img/fig7_4_B.jpg)\n\nFig. 4 不同数据集和标注设置下肿瘤检测的性能\n\
  \n\n\n\n\n通过表 3 中的 Frechet Inception Distance (`FID`) 指标对表征质量进行评估，为该方法在所有测试组织病理学数据集上的优越性提供了有力的证据。`FID`\
  \ 衡量了给定方法的特征分布与全监督基准之间的相似性，数值越低，表示表征与在完全监督下学习到的表征越接近。\n\n表 3 不同方法的特征分布与全监督基准之间的\
  \ Frechet Inception Distance (`FID`)。⏎\n\n|  方法 | CAMELYON16 | TCGA-BRCA | DigestPath\
  \ |\n| --- | --- | --- | --- |\n| ImageNet Pretrained | 31.42 | 35.67 | 38.24 |\n\
  | Rotation Prediction | 29.18 | 32.91 | 35.83 |\n| SimCLR | 22.36 | 25.78 | 28.42\
  \ |\n| MoCo v2 | 21.47 | 24.32 | 27.19 |\n| BYOL | 21.53 | 24.89 | 27.65 |\n| SwAV\
  \ | 22.14 | 25.46 | 28.13 |\n| SelfPath | 20.81 | 23.75 | 26.58 |\n| Proposed Method\
  \ | 17.25 | 19.83 | 22.41 |\n\n该方法在所有数据集上均一致获得最低的 `FID` 分：CAMELYON16 上为 17.25，TCGA-BRCA\
  \ 为 19.83，DigestPath 为 22.41。这些结果相比之前的最先进方法 `SelfPath` 有了显著改进，`SelfPath` 在相应数据集上获得的\
  \ `FID` 值分别为 20.81、23.75 和 26.58。这意味着与 `SelfPath` 相比，表征质量提升了 17.1%、16.5% 和 15.7%。\n\
  \n数据揭示了表征学习方法之间清晰的层次结构。简单的预训练方法，如 ImageNet 迁移学习（`FID` 31.42-38.24）和旋转预测（`FID` 29.18-35.83），对于组织病理任务产生的特征表征最有效。更复杂的自监督学习方法显示出明显的改进，对比学习方法（`SimCLR`、`MoCo\
  \ v2`）和非对比方法（`BYOL`、`SwAV`）在跨数据集的 `FID` 值达到了 21 到 28 之间。\n\n三个数据集上一致的模式表明这些发现具有稳健性。CAMELYON16\
  \ 数据集各方法始终显示最低的 `FID` 值，其次是 TCGA-BRCA 和 DigestPath，表明这些数据集具有不同程度的复杂度。然而，无论数据集难度如何，该方法的相对性能提升均保持一致。这些\
  \ `FID` 结果与表 2 中的分割性能良好相关，支持了更高质量的表征直接转化为下游任务性能的提升这一结论。该方法实现的 `FID` 大幅降低解释了其在有限标记数据下优越的分割能力。\n\
  \n通过在仅使用 10% 标记数据的情况下学习与全监督更相似的表征，该方法有效地弥合了有限监督与全监督场景之间的差距。这种增强的表征质量表明，该方法成功利用了组织病理图像的内在结构，提取出意义特征以捕捉对于准确肿瘤检测和分割至关重要的微妙组织特征。\n\
  \n### 跨癌症迁移学习中少样本适应性能分析\n\n表 4 中提出的少样本适应实验为该方法在组织病理学背景下的跨领域迁移性提供了关键见解。通过评估在 CAMELYON16（乳腺癌淋巴结转移）上预训练并适配\
  \ DigestPath（结直肠癌）的模型，这些实验评估了跨截然不同组织类型和癌症形态的泛化能力。\n\n表 4 从 CAMELYON16 到⏎ 的少样本适应性能\
  \ (AUROC)\n\n| 方法 | 1-shot | 5-shot | 10-shot |\n| --- | --- | --- | --- |\n| ImageNet\
  \ Pretrained | 0.632 | 0.703 | 0.742 |\n| MoCo v2 | 0.675 | 0.739 | 0.776 |\n| SelfPath\
  \ | 0.683 | 0.747 | 0.783 |\n| Proposed Method | 0.721 | 0.782 | 0.815 |\n\n该方法在所有测试场景下均表现出卓越的少样本适应性能。每类仅需一个示例（1-shot），它就达到了\
  \ 0.721 的 AUROC，大幅优于 `SelfPath` (0.683)、`MoCo v2` (0.675) 和 ImageNet 预训练 (0.632)。这比之前的最佳方法提升了\
  \ 3.8 个百分点，比标准 ImageNet 预训练提升了惊人的 8.9 个百分点。\n\n随着每类示例数量增加到 5 和 10 个 shot，这种性能优势得以维持。在\
  \ 5-shot 适应下，该方法达到了 0.782 的 AUROC，而 `SelfPath` 达到 0.747。在 10-shot 适应下，该方法实现了 0.815，而\
  \ `SelfPath` 为 0.783。跨样本数量的一致性能优势表明了该方法的强大迁移能力。\n\n### 组织病理学自监督学习框架的消融研究\n\n表 5\
  \ 中提出的消融研究为所提框架中各个组件的相对贡献提供了宝贵见解。通过使用仅 10% 标记数据的 CAMELYON16 数据集，这些实验系统地评估了每个架构和方法选择对整体性能的影响。完整的方法实现了最高\
  \ AUROC (0.935)，作为基准。当移除单个组件时，性能持续下降，证实了每个元素对框架的有效性都有意义贡献。最大的性能下降出现在移除组织特定增强时（AUROC\
  \ 降至 0.908，下降了 2.7 个百分点）以及消除分层采样时（产生 0.912 的 AUROC，减少了 2.3 个百分点）。\n\n\n\n\n\n组织特异性增强的显著影响凸显了领域适应数据变换的重要性，这种变换尊重了组织病理图像的独特特性，在这些图像中，某些颜色变化和组织结构具有诊断意义。同样，分层采样策略的强大贡献也强调了在组织病理分析中捕捉多尺度组织上下文的价值。\n\
  \n其他组件虽然仍然，但在移除后显示出的影响较为温和。多样性感知采样 (0.917)、多尺度对比损失 (0.921)、硬负样本挖掘 (0.924) 和逐渐解冻\
  \ (0.929) 都对整体性能有增量贡献。这表明了一个设计良好的框架，其中多个互补机制共同工作以增强表示学习。这些发现强调，通用的自监督学习方法在组织病理等专门的医学成像背景下，需要进行重大的领域特定适应才能达到最佳性能。消融实验表明，我们框架的每个组件对整体性能都有贡献。组织特异性增强和分层采样策略的影响最大，凸显了在组织病理自监督学习中进行领域特定设计选择的重要性。\n\
  \n### 组织病理自监督学习计算效率分析\n\n表 6 中提供的计算效率对比为各种组织病理图像分析方法的资源需求提供了重要的实践见解。该分析对于确定在临床环境中部署这些方法的现实可行性至关重要。与其他自监督学习方法相比，所提的方法表现出合理的计算效率。其\
  \ 45.3 小时的预训练时间与 `SelfPath` (44.5 小) 和 `MoCo v2` (42.7 小) 相当，同时比全监督学习 (50.5 小) 和\
  \ `SimCLR` (48.2 小) 都更高效。这表明所提架构中的额外组件并未显著增加训练时长。\n\n表 6 不同方法的计算需求。⏎\n\n| 方法 | 预训练时间\
  \ (小时) | GPU 内存 (GB) | 推理时间 (ms/ patch) |\n| :--- | :--- | :--- | :--- |\n| 全监督\
  \ (100% 数据) | 50.5 | 11.2 | 8.3 |\n| SimCLR | 48.2 | 18.6 | 8.4 |\n| MoCo v2 | 42.7\
  \ | 13.4 | 8.3 |\n| SelfPath | 44.5 | 14.2 | 8.5 |\n| Ours | 45.3 | 15.7 | 8.4 |\n\
  \n在 GPU 内存消耗方面，该方法需要 15.7 GB，与 `MoCo v2` (13.4 GB) 和 `SelfPath` (14.2 GB) 相比是中等增加，但仍然比\
  \ `SimCLR` (18.6 GB) 内存得多。这种内存使用的增加归因于多尺度对比损失的实现，它同时处理多个分辨率层面的特征表示。\n\n最重要的是，每个\
  \ patch 8.4 ms 的推理时间与其他方法几乎相同（范围在 8.3-8.5 ms 之间）。这表明在训练期间增强的表示学习不会损害部署期间的运行效率，这对于临床集成是一个关键考虑因素，因为在临床上对包含成千上万个\
  \ patch 的全切片图像进行快速分析是非常关重要的。\n\n### 对计算病理学的意义\n\n我们的结果证明，自监督学习可以大幅减少开发模型的标注负担。利用未标记数据的能力在病理学中特别有价值，因为那里有大量的数字化切片库，但标注却稀缺。此外，通过特征可视化展示的模型的可解释性可以通过提供对预测依据的见解，帮助建立病理学家之间的信任。\n\
  \n### 自监督学习局限性分析\n\n识别出的局限性对所提出的自监督学习方法 Zoph et al. (2020) 提供了平衡的性评估。对领域泛化的关注凸显了医学成像中的一个根本挑战；虽然该方法展示了令人深刻的跨癌症适应性，但跨扫描仪类型和染色方案等不同技术因素的稳健性尚未得到充分验证。\n\
  \n该方法对罕见肿瘤亚型的有效性是另一个未知。目前对常见癌症类型的评估可能无法很好转化为具有独特形态学特征的罕见恶性肿瘤，特别是在特征性可能不足的小样本学习场景中。自监督预训练的计算需求构成了实际实施的障碍。\n\
  \n\n\n\n\n所提出的框架通过减少对大量人工标注的依赖同时保持诊断准确性，解决了计算病理学中的一项关键挑战。这种方法有望加速临床环境中 AI 辅助诊断系统的开发和部署，最终提高癌症检测率和患者预后。随着数字病理学的不断演进，能够最小化标注需求并最大化性能的方法，将在计算工具的广泛应用中发挥日益重要的作用。我们的自监督对比学习框架代表了迈向这一目标的重要一步，为更高效、更有效的\
  \ AI 辅助癌症诊断铺平了道路。\n\n## 未来方向\n\n概述的未来方向代表了超越当前自监督学习框架、推进计算病理发展的战略性重要途径。多模态整合通过在组织病理学图像的基础上结合补充的基因组和临床数据，可以显著增强诊断能力。主动学习方法通过智能选择高价值补块供专家标注，具有进一步减少标注销的潜力。联邦学习框架在实现多机构协作的同时，解决了关键的数据隐私忧虑。利用跨序列切片的时间学一致性，可以为疾病进展的动力学提供宝贵的见解。最后，人机协作系统的开发代表了一条务实的路径，它将自监督模型的计算能力与不可替代的病理学家专家知识相结合，以优化临床环境下的工作效率和诊断准确性。\n\
