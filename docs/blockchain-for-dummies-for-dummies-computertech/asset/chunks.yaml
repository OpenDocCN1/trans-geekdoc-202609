    # Diving into the Bitcoin Blockchain


    The Bitcoin blockchain is one of the largest and most powerful blockchains in
    the world. It was designed primarily to send Bitcoin, the cryptocurrency. So,
    naturally, in order to create a message in the Bitcoin blockchain, you must send
    some Bitcoins from one account to another.


    When you send Bitcoins from one account to another, a transaction history is recorded
    in the Bitcoin blockchain. After a transaction has been entered, the information
    can’t be removed — your message will be around as long as Bitcoin is in existence.
    This concept of permanence is powerful — it’s the most important characteristic
    of any blockchain.


    You have several ways of adding extra little messages inside your transaction,
    but sometimes these methods don’t always produce easily readable messages. In
    this section, I explain how to build the message directly into the Bitcoin transaction.


    Embedding the data into the Bitcoin address ensures that it will be easily readable.
    You can do this by utilizing a Bitcoin vanity address. Think of a vanity address
    like a vanity license plate on a car. Six-letter Bitcoin vanity addresses can
    be obtained for free; longer ones cost money. The longer the vanity address, the
    more costly it is.


    In this project, you create two Bitcoin wallets, add funds to one of them, obtain
    a vanity address, and send a little Bitcoin between your accounts.


    ![tip](Image00003.jpg)If you already have a Bitcoin wallet with funds in it, you
    can skip the first section and use that wallet.


    ## Creating your first Bitcoin wallet


    A Bitcoin wallet address is composed of 32 unique characters. It allows you to
    send and receive Bitcoins. Your private key is a secret code associated with your
    Bitcoin address that lets you prove your ownership of the Bitcoins linked with
    the address.


    ![warning](Image00006.jpg)Anyone with your private key can spend your Bitcoins,
    so never share it.


    Your first Bitcoin wallet needs to be linked to a credit card or bank account.
    I recommend using one of the following Bitcoin wallets:


    * **Coinbase (** [ `www.coinbase.com` ](https://www.coinbase.com) **)**

    * **Xapo (** [ `www.circle.com` ](https://www.circle.com) **)**


    To set up your first wallet, just go to one of these URLs and create an account.
    It just takes a few minutes. When you have your account open, add a little money
    to it so you can experiment — $5 is a great starting point.


    ## Creating a second Bitcoin wallet


    To receive the Bitcoins you’ll send, you need to make a second Bitcoin wallet.
    For this second wallet, don’t use a Circle or Coinbase wallet — they don’t have
    the functionality you need for this purpose.


    The easiest Bitcoin wallet to use for this project is the Blockchain.info wallet.
    Follow these steps to create it:


    1. **Go to the Blockchain.info website (** [ `www.blockchain.info` ](http://www.blockchain.info)
    **).**

    2. **Click Wallet.**

    3. **Click Create Your Wallet.**

    4. **Enter an email address and password.**


    ## Generating a Bitcoin vanity address


    A Bitcoin vanity address is like having a personalized license plate for your
    car. It is a Bitcoin address that has a string of numbers or letters that appeals
    to you. A vanity address is optional, but a fun way to see your message in Bitcoin.
    There are a several free ways to create a Bitcoin wallet vanity address. My favorite
    is BitcoinVanityGen.com. To create your vanity address using BitcoinVanityGen.com,
    follow these steps:


    1. **Go to the BitcoinVanityGen.com website (** [ `www.bitcoinvanitygen.com` ](http://www.bitcoinvanitygen.com)
    **).**

    2. **Enter six letters into the Type Letters field.**


    Bitcoin only allows for small messages, and your vanity address will make up the
    content of your message, which you can easily read in Bitcoin.


    ![tip](Image00003.jpg)Choose something cool because you can reuse your address
    whenever you want after it has been created.


    3. **Click Generate.**

    4. **Click Email.**

    5. **Enter your email address.**


    BitcoinVanityGen.com emails you when your vanity address has been found.


    6. **Click the link in the email from BitcoinVanityGen.com.**


    You’ll be given your new vanity address and the private key associated with the
    address.


    7. **Copy your address and private key, and keep them in a safe place.**


    You will need your address and private key for the next section.


    ![warning](Image00006.jpg)Never share your private keys! Save your private key
    and a public key someplace safe. Use your public key to receiving or send Bitcoins.
    (You can share your public Bitcoin keys as much as you want.) The private key
    is the actual keys to your Bitcoins. If your private key is stolen or lost, you’ve
    lost your coins forever.


    ![remember](Image00004.jpg)Cryptocurrency is unforgiving. Start off with small
    amounts of money when you’re learning how to use these systems.


    ## Transferring your vanity address


    In this section, you transfer your vanity address to a wallet. Transferring it
    will allow you to manage your address, and send and receive Bitcoins easily. Follow
    these steps to get started :


    1. **Log into your Blockchain.info wallet (see “** [**Creating a second Bitcoin
    wallet**](#text00006.html#c03-sec-0004) **,” earlier in this chapter).**


    [Figure 3-3](#text00006.html#c03-fig-0003) shows The settings page at blockchain.info.


    2. **Click Settings and then click Addresses.**

    3. **Next to Imported Addresses, click Manage Addresses.**


    The screen shown in [Figure 3-1](#text00006.html#c03-fig-0001) appears.


    4. **Click Import Address, enter your private key, and click Import.**


    You’ve now created an address that allows anyone to read your vanity address when
    you send or receive Bitcoins.


    ![ FIGURE 3-1:  Managing your addresses.](Image00010.jpg)


    [FIGURE 3-1:](#text00006.html#rc03-fig-0001) Managing your addresses.


    ## Making an entry into the Bitcoin blockchain


    Now that you have two Bitcoin wallets, you can make an entry into the Bitcoin
    blockchain. You do that by sending Bitcoins between your two wallets. Here’s how
    (the specifics vary from one wallet to the next, but this is the general idea):


    1. **Log into the Bitcoin wallet that you added the initial funds to (see “**
    [**Creating your first Bitcoin wallet**](#text00006.html#c03-sec-0003) **,” earlier
    in this chapter).**


    It prompts you to enter the recipient.


    2. **Navigate to the page where you can send money, and copy and paste your vanity
    address (see “[Generating a Bitcoin wallet vanity address](#text00006.html#c03-sec-0005)
    ”) into the address field.**

    3. **Enter a small amount of money that you would like to send, and then click
    Send.**


    Congratulations! You’ve just sent your first permanent message! You have forever
    engraved your message into the history of Bitcoin.


    If you enjoyed learning how to do this and want to take your knowledge further,
    you can access a helpful online tutorial on sending Bitcoin messages at [ `www.blockchainpie.com/blockchain-tutorial-bitcoin-message`
    ](http://www.blockchainpie.com/blockchain-tutorial-bitcoin-message) .


    ![technicalstuff](Image00005.jpg)A Bitcoin transaction normally takes ten minutes
    to be confirmed, but could take several hours. The larger the value of the transaction,
    the longer you should wait. An unconfirmed transaction has not yet been included
    in the blockchain and is still reversible.


    ## Reading a blockchain entry in Bitcoin


    In the preceding section, I show you how to create a small permanent message in
    Bitcoin. Data on the Bitcoin blockchain is not encrypted because the data needs
    to be confirmed by the nodes. This means it will be easy to find the message that
    you created in the last project.


    ![tip](Image00003.jpg)If you’ve just made the transfer of Bitcoins between your
    two wallets, wait about 10 or 15 minutes before following these steps.


    1. **Go to the Blockchain.info website (** [ `www.blockchain.info` ](http://www.blockchain.info)
    **).**

