- raw: "Singaporean leadership has shown interest in partnering with India to develop\
    \ a smart city as well as a new capital for Andhra Pradesh, a state in the southeast.\
    \ It’s setting up committees to analyze the potential for collaboration in India’s\
    \ plan to build 100 new cities, as well as further developing the infrastructure\
    \ across 500 existing towns and cities.\n\nIndia’s minister of urban development\
    \ has been in talks with both Singapore’s current prime minister and its former\
    \ prime minister. He has been seeking Singapore’s expertise in smart cities, particularly\
    \ focusing on intelligent transport systems, enhanced water management, and e-governance.\
    \ The minister of urban development has also been examining Singapore’s public\
    \ housing schemes, as well as their private housing regulations. Funding structures\
    \ for transport infrastructure have been looked at as well.\n\n Indian authorities\
    \ have also engaged a team of Singaporean experts to assist the development of\
    \ a satellite town in Himachal Pradesh. The 49-acre (20-hectare) project aims\
    \ to help decongest Shimla, a town that has had a massive population rise in the\
    \ past few decades. The Singaporeans will assist in educational, residential,\
    \ and commercial aspects of the town under development.\n\nBoth Singapore and\
    \ Malaysia have shown interest in investing in another satellite town near Jathia\
    \ Devi. The Singaporean government is undertaking a study that will assess various\
    \ options. The state government of Himachal Pradesh is looking at developing five\
    \ satellite towns near existing cities, using a private–public funding model.\n\
    \nSingapore’s Ascendas-Singbridge launched its eighth IT park in India. The 59-acre\
    \ (24-hectare) International Tech Park Gurgaon is expected to have its first building\
    \ completed in the middle of the year. The $400 million project aims to offer\
    \ 8 million square feet of business space to help accommodate India’s burgeoning\
    \ IT sector.\n\n### China’s big data problem\n\nBlockchain technology is widely\
    \ being discussed in China as a way to enhance the reliability of big data. People\
    \ are looking at it as a way to solve the trust issue involved in sharing data\
    \ between two or more parties that don’t have aligned incentives. Blockchain technology\
    \ offers many new solutions to track ownership, origin, and authenticity.\n\n\
    Peernova is a promising U.S. company that is tackling big data problems. It previously\
    \ focused on Bitcoin mining but pivoted into the blockchain space and raised $4\
    \ million from Zhejiang Zhongnan Holdings Groups, a construction company from\
    \ China. Peernova plans to use blockchain technology to query traditional databases\
    \ and track changes.\n\nThe use cases are to verify any changes to subsets of\
    \ large data stores and use the more efficient and complete cryptographic audits\
    \ instead of a traditional auditor to provide a reference point for a company.\
    \ It hopes to help hedge funds calculate the tax liability of their investments\
    \ by using blockchain to trace the history of money that has been invested over\
    \ the years.\n\nDalian Wanda, the biggest real estate developer in China, is also\
    \ getting into the blockchain game. It has teamed up with big data software company\
    \ Cloudera to launch a blockchain project called Hercules. It sees the potential\
    \ to use blockchain technology to make predictions derived from big data actionable\
    \ for managers as they’re occurring, moving managers from reactive to proactive\
    \ in situations like  modifications to their protocols, as well as monitor user\
    \ behavior within their systems.\n\nDalian Wanda and Cloudera aim to keep developing\
    \ Hercules and integrate their technology into a variety of industries that rely\
    \ on IT and big data. Project Hercules will act as an open-source suite that supports\
    \ the needs of businesses. It makes it easier for organizations to deploy and\
    \ manage blockchain apps on large data clusters.\n\nYou might find it odd to see\
    \ a digital mining company partner with a traditional construction company to\
    \ tackle auditing issues for hedge funds, or real estate companies working with\
    \ big data to solve issues for system administrators, but this is the wild west\
    \ of the blockchain world. The shortage in blockchain talent and the high demand\
    \ for blockchain projects and investment are fueling this environment.\n\n## The\
    \ Battle for the Financial Capital of the World\n\nBlockchain technology has come\
    \ into its own since breaking into the public consciousness with a plethora of\
    \ news coverage in 2015. Many startups have been working on beta and pre-launch\
    \ builds since then, with nearly 2,000 new blockchain startups forming overnight\
    \ in 2016. Many of these will finally go to market sometime in 2017 and 2018 in\
    \ Singapore, Dubai, and London where the regulatory bodies welcome innovation\
    \ and compete to be the financial mecca of the world. This isn’t just about fintech\
