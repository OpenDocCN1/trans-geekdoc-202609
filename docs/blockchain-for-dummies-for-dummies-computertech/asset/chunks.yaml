    \ **,” earlier in this chapter).**\n\n    [Figure 3-3](#text00006.html#c03-fig-0003)\
    \ shows The settings page at blockchain.info.\n\n2.  **Click Settings and then\
    \ click Addresses.**\n\n3.  **Next to Imported Addresses, click Manage Addresses.**\n\
    \n    The screen shown in [Figure 3-1](#text00006.html#c03-fig-0001) appears.\n\
    \n4.  ** Click Import Address, enter your private key, and click Import.**\n\n\
    \    You’ve now created an address that allows anyone to read your vanity address\
