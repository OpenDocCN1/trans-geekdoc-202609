    ![check](Image00001.jpg)**Starting to make your own blockchain identity**


    ![check](Image00001.jpg)**Monetizing your information through smart contracts**


    It’s easy to focus on the most prominent blockchain projects and industry impacts,
    but blockchain technology has already begun to touch all aspects of society.


    In this chapter, I lead you through some of the more interesting and unusual applications
    of blockchain technology that you may not have suspected. Some of the most exciting
    transformations will occur within government systems, new trust layers for the
    Internet, and new industries created by blockchains. Here, you discover the most
    impressive changes that are taking place now and how these transformations will
    affect your life and the industry you work in, as well as the governments and
    agencies that protect you.


    ## Lean Governments


    A few small nations have realized that if they are going to compete in a global
    economy, they have to offer more and do it in a way that does not burden their
    citizens. In order to compete, they’ve shifted many of the traditional ideas around
    what it means to provide citizenship. In a world that is moving from hard borders  to
    very porous ones, where people have the power to choose where they live and what
    country they call home, these small countries are doing well.


    Citizenship is becoming a commodity that can be purchased, with each nation offering
    different advantages. Countries are moving away from the passive citizenship model,
    where you’re born a citizen of a country, to one where you choose citizenship
    based on the advantages that that country offers.


    Under this new model, citizenship is no longer tied to a physical location. Government
    can exist without borders or a physical location. Old models see citizenship as
    a location that can be invaded and overruled by another nation or sources within,
    such as a revolution.


    Blockchain technology and other top-grade innovations are being embraced in these
    areas — first, because they makes it possible and, second, because they help reduce
    the weight on government by creating more efficient systems that citizens can
    access quickly anywhere in the world, even if the physical territory is overrun.


    Singapore, Estonia, and China have all been market leaders in these types of initiatives.
    The Smart Nation project of Singapore and e-Residency of Estonia are unique systems
    that strive to reduce the paperwork and wait times of citizens and increase the
    efficiency of shared resources. China’s efforts to reduce fraud have changed the
    dynamics for the blockchain space.


    ### Singapore’s Smart Nation project'
