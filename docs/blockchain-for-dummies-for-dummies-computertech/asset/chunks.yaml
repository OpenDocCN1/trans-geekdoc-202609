  fmt: '

    Factom has been structured this way for commercial applications because members
    of one industry don’t need to download all the irrelevant data about an unrelated
    industry. For example, verifying that all documents related to a mortgage have
    been accounted for does not also require downloading years of stock exchange history.


    The Factom blockchain also spreads itself out to secure its network against data
    corruption. Every few minutes, it creates a small anchor into Bitcoin and Ethereum.
    This does two key things:


    * **First and most important, it prevents the servers building the Factom blockchain
    from undetectably rewriting history.** Because the servers can’t control Bitcoin
    or Ethereum, any history they had recorded is permanent.

    * **It prevents the Factom servers from showing two different versions of the
    blockchain to different people.** Personal customization of web pages is something
    that Amazon and Facebook routinely do. Showing conflicting histories of business
    transactions to different companies is a recipe for misunderstanding. Because
    there is only one Bitcoin blockchain, that prevents altered versions of history
    from being created.


    ## Building on Factom


    Factom was created for applications to be built on top of it. It’s built for scale,
    speed, and low cost. It was created to take to the security of the Bitcoin blockchain
    and make that permanence available to more than what can fit in its limited space.


    ### Authenticating documents and building identities using APIs


    Factom has come out with a set of application programming interfaces (APIs) that
    can be used by development teams to manage and authenticate documents and build
    identities for people and things. You still need a developer to help you, and
    they’re designed for enterprise integration, not ideal for a small project at
    this point.


    There are two core offerings for the general public:


    * **Apollo:** Apollo is your publish and authentication option. It allows users
    to feed massive amounts of data into Factom and then refer to it as needed, historically.
    It would be an ideal place to publish an archive of your website or updates to
    your protocols, for example.

    * **Iris:** Iris is the platform used to build an identity. It’s the underlying
    technology behind the IoT identity project for the Department of Homeland Security.
    It builds on the Apollo platform for record management.


    You can use the APIs without needing to set up a blockchain or run a cryptocurrency
    wallet. It takes the headache out of the process and is ideal for those who are
    worried about the regulatory gray zone that cryptocurrency still falls under.


    ### Getting to know the Factoid: Not a normal token


    Factom has a unique value token system, which uses something called the Factoid.
    The Factoid is a digital commodity that is tradable on some exchanges. It isn’t
    a currency in the same sense as Bitcoin. Factoids can be converted by the owner
    into *entry credits* (nontransferable tokens that are used to purchase publishing
    power within the Factom network). This transaction is one-way and it can’t be
    undone. Factoids are effectively burned and are removed from circulation.


    Factoids fluctuate in price depending on speculation and utility. Entry credits,
    on the other hand, have a stable price that is maintained at US$0.001. This makes
    the fees paid to publish a predictable cost.


    The Factom team issued some number of tokens during the crowd sale to raise funds
    for the core Factom development. At this point, the Factom network has not reached
    full federation of 32 nodes as outlined in the whitepaper. When the Factom networks
    reaches 32 nodes, the network will begin rewarding federated nodes and audit nodes
    with new tokens.


    *Federated nodes* are nodes that are elected by the network to maintain consensus
    and validate transactions. Audit nodes check the honesty of these nodes and will
    take one of their positions as a federated node if any given federated node goes
    offline or breaks one of the system rules.


    The issuance of new Factoids to the servers coupled with the extinguishing of
    the Factoids by the users represents a value transfer. The users are effectively
    paying for the operation of the servers.


    ### Anchoring your application


    Blockchain technology has opened the doors for new products and services. The
    blockchains themselves serve as the base layer that old technology can reinvent
    itself with or innovation can be built against. Each blockchain has its own unique
    properties that make it ideal for specific applications.


    Factom is particularly good at securing information, but it still has limitations:
    the size of each entry, and the fact that the more you publish, the more it costs.
    Factom is ideal for storing large files in a cloud solution and then using pointers
    within Factom to locate those files for your application.


    Factom is primarily being used as a system to manage documents, and data, and
    build identity. It integrates with other blockchains, and it can be used to create
    an oracle for your smart contract.


    ### Publishing on Factom


    Factom was built by developers for developers. It requires utilizing your terminal
    and downloading special software to both use your wallet and make entries into
    the network.


    The team at Factom has been working hard to build a robust system first. They
    have documentation that will walk you through the process and a GitHub repository
    with all their open-source software for you to review and even contribute to.
    Efforts have been made to make Factom more individual consumer friendly, but that’s
    still some time away.


    ![tip](Image00003.jpg) FreeFactomizer is one of my favorite apps built by a Factom
    fan. It’s very simple to use and allows you to check out the basic functionality
    of Factom without being a developer, opening a terminal, or doing any coding.
    It creates a hash of data that you enter into a text box or when you upload a
    file. It then gathers other hashes of documents submitted by other visitors. Every
    ten minutes, it combines all these hashes into an entry in the Factom blockchain.
    It offers a simple proof of existence.


    ![remember](Image00004.jpg) FreeFactomizer is a free service provided by an individual.
    It costs money to supply this service and may not be available in the future.
    There is also no warranty of any kind.


    To use FreeFactomizer, follow these steps.


    1. **Go to** [www.freefactomizer.com](http://www.freefactomizer.com).


    [Figure 7-3](#text00011.html#c07-fig-0003) shows the FreeFactomizer home page.


    2. **Upload a document to be hashed.**


    Use an unimportant document — one that doesn’t contain sensitive information —
    because this service is not warranted or secure.


    3. **Click Factomize the File Signature.**


    You’re given a time estimate for how long it will take for the file to be added
    to Factom.


    4. **Wait for the file to be added to Factom.**


    It take at least ten minutes for your file to be bundled with other documents
    and data. When this process is complete, FreeFactomizer will provide you a link
    back to Factom Explore.


    5. **Check the entry by using Factom Explore, a search tool for the Factom database
    that allows you to look up entries.**


    Another option to try is to uploading the document again. It will send back a
    note like this: “->Signature already registered.” This means that they have added
    it already to Factom.


    ![ FIGURE 7-3:  FreeFactomizer is a great way to try out the Factom blockchain.](Image00022.jpg)


    [FIGURE 7-3:](#text00011.html#rc07-fig-0003) FreeFactomizer is a great way to
    try out the Factom blockchain.


    Congratulations! You’ve just stored a fingerprint of data in Factom and explored
    its core functionality.


    ### Building transparency in the mortgage industry


    A blockchain document management service, Factom Harmony is the company’s first
    commercial product. It’s targeted for mortgage originators, the institutions that
    issue loans to consumers for homes.

