    # Bitcoin is a good investment

    Bitcoin is a new and interesting evolution in how people trade value. It isn’t
    backed by any single government or organization, and it’s only worth something
    because people are willing to trade it for goods and services. People’s willingness
    and ability to utilize Bitcoin fluctuates a lot. It’s an unstable investment that
    should be approached cautiously.


    ## Bitcoin: The New Wild West

    The Bitcoin world is much like the early days of the Wild West. It’s best to approach
    cautiously until you figure out who the good guys and bad guys are and which saloon
    serves the coldest beer. If you fall victim to a scam, you’ll have little to no
    protection.


    ![technicalstuff](Image00005.jpg)Bitcoins fall within the definition of *commodity*
    under the U.S. Commodity Exchange Act and are considered a currency in many European
    countries, but there is little to no oversight.


    In this section, I list three of the common scams that are prevalent in the cryptocurrency
    world. They all revolve around stealing your coins and look a lot like traditional
    cons you might already be familiar with. This list isn’t exhaustive, and crooks
    are nothing if not creative, so be very cautious when using Bitcoins. You never
    know what’s around the next corner.


    ### Fake sites

    Websites that look like exchanges or web wallets but are fakes have plagued some
    of the top Bitcoin websites. This type of scam is common in the Bitcoin world
    and on the web in general. Scammers hope to make money by stealing login information
    from users or misleading them into sending Bitcoins.


    ![tip](Image00003.jpg)Always double-check the URL and only use secure websites
    (those that start with `https://`) to avoid this problem. If a website or claim
    seems doubtful, check to see if it’s listed on Badbitcoin.org ([`www.badbitcoin.org`](http://www.badbitcoin.org)).
    This is not an exhaustive list, but has many of the bad players listed.


    ### No, you first!

    “Send me your Bitcoins, and then I’ll ship you the goods.” Smells fishy, right?
    Scams like this are similar to money wire fraud. In this type of fraud, an individual
    pretends to sell you something but never delivers.


    The semi-anonymous nature of Bitcoins — combined with the inability to do a charge
    back — make it tough to get your money back. Plus, governments do not currently
    offer protection for Bitcoin transactions, so you’re up that proverbial creek
    without a paddle.


    Fraudsters will try to win your trust by sending fake IDs or even impersonating
    other people you may know. Always double-check the information they send you.


    ![tip](Image00003.jpg)The best way to dodge this sort of scam is to listen to
    your instinct and never put more Bitcoins at risk than you’re willing to lose.
    If there is a way to verify the identity of the person offline, do so.


    ### Get-rich-quick schemes

    Crazy get-rich-quick schemes have proliferated the cryptocurrency world. The good
    news is: It’s easy to recognize them if you know what to look for.


    Often, you’ll be promised massive returns, and there is some kind of recruitment
    and indoctrination process. This process could include things like sales training,
    asking you to recruit your friends and family, and promising that this is a risk-free
    investment and that you’ll never lose your money.


    The bottom line: If a scheme looks too good to be true, it probably is. No matter
    what, take a hard look at how the investment is generating value outside of what
    you’ll receive from your investment. If there is no clear and rational reason
    that a significant amount of value is generation rate, it’s a scam.


    ![tip](Image00003.jpg)Run all investments by a lawyer and a CPA. They can help
    you understand your risks and tax implications.


    ## Mining for Bitcoins

    You can get started earning Bitcoins in a variety of ways. Mining for Bitcoin
    is how to earn Bitcoins by participating in the network. It’s usually handled
    by special mining hardware that is expensive and specialized. The equipment also
    needs Bitcoin mining software to connect to the blockchain and your *mining pool*
    (a collaboration of many miners jointly work together and then splitting the rewards
    of their efforts).


    Here are three standard ways to explore mining Bitcoin:

    * `Bitcoin-QT`: The `Bitcoin-QT` client is the original software written by Satoshi
    Nakamoto. You can download it at [`https://bitcoin.org/en/download`](https://bitcoin.org/en/download).

    * `CGminer`: `CGminer` is one of the most popular mining software. It is open
    source and available for Windows, Linux, and OS at [`www.github.com/ckolivas/cgminer`](http://www.github.com/ckolivas/cgminer).

    * `Multiminerapp`: The `Multiminerapp` is an easy Bitcoin client to run. You can
    download it at [`www.multiminerapp.com`](http://www.multiminerapp.com).


    ![remember](Image00004.jpg)Bitcoin is a very competitive environment, and unless
    you buy specialized mining equipment, you may never earn any Bitcoins. I don’t
    endorse or recommend any particular mining equipment in this book because the
    industry is constantly changing and quickly out of date. Expect to pay between
    $500 and $5,000 per machine on average. Amazon.com is a good place to look. They
    have a large offering and many customer reviews to help guide you.


    Cloud mining allows you to start earning bitcoins in an industrious afternoon,
    without the need to download software or buy equipment. Just follow these steps:

    1. **Go to** [`https://hashflare.io/panel`](https://hashflare.io/panel).

    ![warning](Image00006.jpg)The return on investment for cloud mining can be negative.
    Review your option carefully to make sure it is a positive investment.

    2. **Scroll down the home page and click the Buy Now button under SHA-256 Cloud
    Mining.**

    ![tip](Image00003.jpg)When I wrote this book, this option had the highest return
    on investment and the lowest startup cost. Take the time to reassess this on your
    own because this might have changed.

    3. **Go through the sign-up process.**

    4. **Link your bitcoin address.**

    If you haven’t established a bitcoin address, turn to [Chapter 3](#text00006.html#a1)
    and follow the directions to create a bitcoin wallet. You’ll need to do this in
    order to claim your mining rewards.

    5. **Buy a small amount of mining power.**

    This will allow you to join the bitcoin network.

    6. **Join a mining pool.**

    This step allows you to get a faster mining reward than mining on your own. It
    pools the resources of several miners and then shares the prize between the pool.


    Congratulations! Now just sit back and wait for your mining rewards to start rolling
    (or dripping) in.


    ## Making Your First Paper Wallet

    A *paper wallet* is a paper copy of your public and private key for your Bitcoins.
    Because they’re completely offline, paper wallets are one of the most secure ways
    to hold Bitcoins when done correctly. The advantage is that your private key is
    not stored digitally, so it isn’t subject to hacking. Making a paper wallet is
    fairly easy. Just follow these steps:

    1. **Go to** [`www.bitaddress.org`](http://www.bitaddress.org).

    2. **Move your mouse around the screen until the amount of randomness shows 100%.**

    3. **Click the Paper Wallet button.**

    This gives the option to create a paper wallet that you can print.

    4. **In the Addresses to Generate field, enter 1.**

    You can make several wallets at once, if you need to, but you might as well just
    start with one to get the hang of it.

    5. **Click the Generate button.**

    [Figure 4-2](#text00008.html#c04-fig-0002) shows a paper wallet I created.

    6. **Click the Print button.**

    ![warning](Image00006.jpg)Do not let anyone watch you create your paper wallet.
    This isn’t something you want to do at a public computer. Make sure to use a printer
    that is private and not connected to the Internet so you’re not at risk of your
    private keys being hacked.


    ![ FIGURE 4-2:  A paper wallet.](Image00016.jpg)

