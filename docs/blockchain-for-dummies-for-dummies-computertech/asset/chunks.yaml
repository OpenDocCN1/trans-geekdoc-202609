    \ more than 100 member companies and have several projects in incubation. Their\
    \ first few projects include `Explorer`, a web application to view and query blocks,\
    \ and `Fabric`, a plug-and-play blockchain application builder. They also have\
    \ `Iroha` and `Sawtooth`, which are modularized blockchain platforms.\n\nIn this\
    \ chapter, I explore the three key projects that are under incubation at Hyperledger.\
    \ You get a deep understanding of what the future of commercialized blockchain\
    \ will be for your company and industry. This knowledge will help you as you explore\
    \ what technologies to utilize and which to avoid, saving you development time\
    \ and resources.\n\n### Getting to Know Hyperledger: Dreams of a Hyper Future\n\
    \nAt the end of 2015, the Linux Foundation formed the Hyperledger project to develop\
    \ an enterprise-grade and open-source distributed ledger framework. They hoped\
    \ to focus the blockchain community on building robust, industry-specific applications,\
    \ platforms, and hardware systems to support businesses.\n\nThe Linux Foundation\
    \ saw that there were many different groups building blockchain technology without\
    \ a cohesive direction. The industry was duplicating effort and the tribalism\
    \ was leading teams to solve the same problem twice. The foundation knew from\
    \ its experiences that if this technology was to realize its full potential, an\
    \ open-source and collaborative development strategy was desperately needed.\n\
    \nThe Hyperledger project is led by Executive Director Brian Behlendorf, who has\
    \ decades of experience dating back to the original Linux Foundation and Apache\
    \ Foundation, as well as being a CTO of the World Economic Forum. So it’s not\
    \ surprising that Hyperledger has been well received. Many of the top business\
    \ and industry leaders have joined the project, including Accenture, Cisco, Fujitsu\
    \ Limited, IBM, Intel, J.P. Morgan, and Wells Fargo. It has also attracted many\
    \ of the top blockchain organizations.\n\nR3, a consortium supporting the banking\
    \ industry, has contributed its financial transaction architectural framework.\
    \ Digital Asset, the software company, gave the Hyperledger mark and some of its\
    \ enterprise-grade code. The Factom Foundation is also contributing enterprise-grade\
    \ code and developer resources. IBM and many other organizations are contributing\
    \ code and other resources to the project.\n"
  trans: "\nThe DigiByte team believes that DiguSign will be very valuable to lawyers,\
    \ healthcare providers, and in financial services arenas where it’s important\
    \ to keep a clear version history for contracts and a clear established time line\
    \ on what documents were provided when and to whom.\n\n![提示](img/Image00003.jpg)\
    \ 您可能能够将您的 DiguSign 账户链接到您的云存储提供商，例如 Google Docs、Dropbox 和 OneDrive。在此之前，每个文档都必须单独上传到\
    \ DiguSign。DiguSign 提供了此服务的免费测试版本，允许您创建三个免费的区块链支持文档或合同。\n\nDiguSign 仍处于早期测试阶段，但它已经允许您存储、非正式公证和验证数字文档。\n\
    \n![技术细节](img/Image00005.jpg) DiguSign 通过将哈希嵌入到 DigiByte 区块链交易中来发布您文档的 `SHA256`\
    \ 哈希。该交易随后被安全地保存在 DigiByte 区块链中。\n\n设置您的账户，请按照以下步骤操作：\n1. **前往** [ `www.digusign.com`\
    \ ](http://www.digusign.com) **并注册一个 DiguSign 账户。**\n2. **将您的文档上传到 DiguSign。**\n\
    \   您有创建文档或合同模板的选项。\n3. **选择创建文档的选项。**\n4. **在您的文档上配置所有必需的签名和其他字段。**\n5. **输入您希望电子签署您文档的个人的电子邮件地址。**\n\
    6. **选择“安全最终版本”选项。**\n   当所有各方都签署了文档后，您需要通过点击“安全最终版本”将最终版本发送到 DigiByte 区块链。\n\n\
    您已创建了文档的近乎永久的指纹，您可以随时参考。\n\n## 在游戏中赚取 DigiBytes\n\nDigiByte 将游戏社区对数字代币的偏爱与区块链技术联系起来。游戏玩家熟悉在游戏中使用数字货币，因此\
    \ DigiByte 团队认为，利用其加密货币代币作为激励用户参与的方式是一个容易的转变。\n\nDigiByte 已设置通过玩游戏如 Counter Strike、League\
    \ of Legends 和 World of Warcraft 来赚取 DigiByte 代币的选项。这些奖励是通过游戏公司的赞助提供的，并且不会占用用户的\
    \ GPU 功率进行挖矿。\n\nDigiByte 为游戏公司创造了一个有趣的机会，可以建立额外的激励模式来获取新玩家并留住现有玩家。它还为游戏玩家找到了一种巧妙的方式，将他们在数字世界中赢得的奖品转化为可以在现实世界中花费的金钱。\n\
    \n您可以通过 DigiByte 游戏网站赚取 DigiBytes。每天，DigiByte 提供多个任务，让您有机会获得所谓的 `XP`。`XP` 然后以固定的日利率转换为\
    \ DigiBytes。您可以玩 World of Warcraft 或其他提供的任何游戏，并获得游戏报酬 DigiBytes。\n\n然后您可以在交易所（如\
    \ Poloniex）上用比特币交易 `DGB` 代币。并且您可以轻松地将比特币兑换成其他货币。虽然有几层分离，但这是一条清晰有趣的获得报酬的途径！\n\n\
    通过游戏赚取 DigiBytes 的设置相当容易。您不会通过挖矿来赚取代币，但开始时也不需要打开命令行。只需按照以下步骤操作：\n1. **前往** [ `www.digibytegaming.com`\
    \ ](http://www.digibytegaming.com) **。**\n2. **创建一个新账户。**\n   DigiByte 允许社交登录，使设置快速简便。\n\
    3. **验证您的账户。**\n   检查您的电子邮件以获取链接。\n4. **前往** [ `www.battle.net` ](http://www.battle.net)\
    \ **。**\n   从这里，您可以创建一个配置文件以链接到您的 DigiByte 账户。此配置文件将在 World of Warcraft 和 DigiByte\
    \ 之间充当桥梁。\n5. **在您的计算机上设置 World of Warcraft。**\n   如果您已经玩这款游戏，您可以在此步骤中连接您的游戏密钥。\n\
    6. **返回** [ `www.digibytegaming.com` ](http://www.digibytegaming.com) **。**\n\
    7. **点击 World of Warcraft 选项。**\n8. **连接您的 Battle.net 账户。**\n9. **打开您的 World of\
    \ Warcraft 应用程序并开始游戏。**\n\n您现在在游戏时正在赚取 DigiBytes！\n\n# 第 3 部分\n\n## 强大的区块链平台\n\
    \n本部分内容 …\n确定最大的企业区块链联盟 Hyperledger，以及它对您的行业和组织的影响和益处。\n了解 Microsoft 的区块链工作以及通过其网络服务为您提供的核心工具。\n\
    评估 IBM Bluemix 项目以及区块链技术与人工智能结合的影响。\n\n## 第 9 章\n\n### 掌握 Hyperledger\n\n本章内容\n\
    **探索四个关键的 Hyperledger 项目**\n**深入 PoET 算法**\n**发现 Chaincode 智能合约**\n**理解 Sumeragi**\n\
    \nHyperledger 是一个由软件开发人员和技术爱好者组成的社区，他们正在构建区块链框架和平台的行业标准。他们的作品很重要，因为他们是推动区块链行业进入主流和商业采用的主要团体。Hyperledger\
    \ 是企业团队的“安全”部署平台。\n\n该组织及其独特项目每天都在增长。截至本文撰写时，他们拥有超过 100 家成员公司，并有多个项目处于孵化阶段。他们最初的几个项目包括\
    \ `Explorer`，一个用于查看和查询区块的 Web 应用程序，以及 `Fabric`，一个即插即用的区块链应用程序构建器。他们还拥有 `Iroha`\
    \ 和 `Sawtooth`，它们是模块化区块链平台。\n\n在本章中，我探讨了 Hyperledger 下孵化的三个关键项目。您将深入了解商业化区块链的未来对您公司和行业的影响。这种知识将在您探索要使用哪些技术以及要避免哪些技术时帮助您，节省开发时间和资源。\n\
    \n### 认识 Hyperledger：Hyper 未来的梦想\n\n2015 年底，Linux 基金会成立了 Hyperledger 项目，以开发企业级和开源分布式账本框架。他们希望让区块链社区专注于构建强大的、特定行业的应用程序、平台和硬件系统来支持企业。\n\
    \nLinux 基金会看到有许多不同的团体在没有凝聚方向的情况下构建区块链技术。该行业存在重复劳动，部落主义导致团队两次解决同一个问题。基金会从经验中知道，如果这项技术要实现其全部潜力，迫切需要开源和协作开发策略。\n\
    \nHyperledger 项目由执行董事 Brian Behlendorf 领导，他拥有数十年的经验，可追溯到最初的 Linux 基金会和 Apache\
    \ 基金会，并且是世界经济论坛的首席技术官。因此，Hyperledger 得到广泛认可也就不足为奇了。许多顶级商业和行业领袖已加入该项目，包括 Accenture、Cisco、Fujitsu\
    \ Limited、IBM、Intel、J.P. Morgan 和 Wells Fargo。它还吸引了许多顶级区块链组织。\n\nR3，一个支持银行业的联盟，已贡献了其金融交易架构框架。软件公司\
    \ Digital Asset 提供了 Hyperledger 标记和部分企业级代码。Factom 基金会也在贡献企业级代码和开发人员资源。IBM 和许多其他组织也在为该项目贡献代码和其他资源。\n"
