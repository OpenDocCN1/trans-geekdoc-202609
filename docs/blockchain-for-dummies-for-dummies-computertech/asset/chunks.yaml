  trans: "\nCryptoDelegates 使 Utility 和 Contract Cryplets 能够运行。它们通过在你的智能合约虚拟机中创建功能钩子充当适配器。它们从你的智能合约代码中调用\
    \ Cryptlet，进而为交易创建安全且真实的封装。\n\n# 在 Azure 生态系统中构建\n\nAzure 是一个数字生态系统和云计算平台。它使企业能够直接与其云合作伙伴和\
    \ SaaS 连接。反过来，这使企业能够以互联、可靠和安全的方式传输其数据。\n\n微软的 Azure 云平台是第二大基础设施即服务（IaaS）平台。它是您云计算和数据存储的可靠且安全的避风港。在\
    \ Azure 中，有一项名为 ExpressRoute 的服务，可为用户提供直接连接 Azure 的方式。反过来，这可以防止在公共互联网上广泛存在的性能和安全问题。\n\
    \n2015 年，微软决定使用以太坊和 Hyperledger 区块链系统扩展其 Azure 生态系统。Azure Blockchain as a Service\
    \ 的首个产品由以太坊提供支持。以太坊是一个图灵完备的区块链框架，用于构建应用程序。微软旨在基于区块链技术和 Hyperledger 构建更多产品。它还在发展\
    \ Azure 市场，同时将其转变为面向 Azure 客户的门户。\n\n微软的 Azure Stack 程序包含 Azure 快速入门模板，该模板借助 Azure\
    \ 资源管理器部署各种 Azure 资源，以帮助您完成更多工作。Azure 资源管理器允许客户将业务资源作为一个组进行操作。它使他们能够以协调且单一的操作部署、删除或更新解决方案中的所有资源。\n\
    \nAzure 快速入门模板可用于各种环境，如生产、暂存和测试。通过 Azure 资源管理器，客户可获得标记、审计和安全方面的多项功能。这些功能帮助用户在部署后管理其资源。\n\
    \n微软的 Project Bletchley 是其区块链架构，与其已提供的成熟企业技术融合。它为 Azure 提供区块链后端和市场。\n\nBletchley\
    \ 的生态系统是微软采取的一种方法，旨在以安全有效的方式将区块链或分布式账本网络带给更广泛的受众。他们希望帮助构建真实的解决方案并解决实际的业务问题。\n\n\
    ## 在 Azure 上开始使用 Chain\n\nChain 是一家提供区块链技术解决方案的公司，已在 Azure 上发布其 Chain Core Developer\
    \ Edition。Chain Core Developer Edition 是该公司分布式账本平台的开源免费版本。它使您能够在授权的区块链网络上发行和转移资产。\n\
    \n通过其测试网，您的开发人员可以加入或启动区块链网络、访问深入的技术教程和文档，并构建金融应用程序。他们还可以在 Chain 的测试网上运行自己的原型，或在\
    \ Azure 上创建自己的个人网络。\n\n### 安装 Chain 的分布式账本\n\nChain Core Developer Edition 附带代码示例、Java\
    \ SDK 和入门指南。此外，它还提供仪表板界面以及适用于 Linux、Mac 和 Windows 的安装程序。\n\n按照以下步骤安装您的 Chain Core\
    \ Developer Edition：\n\n1. 导航至 Chain 的安装页面 `https://chain.com/docs/core/get-started/install`。\n\
    2. 从列表中选择您的操作系统。\n3. 点击下载。\n4. 打开 Chain 程序。\n5. 运行 Chain Core 安装程序。\n\nChain 提供了一个\
    \ SDK，可为您和您的开发人员提供软件开发工具，以便创建区块链应用程序和资产。\n\n### 创建您自己的私有网络\n\n您可以在 Azure 中创建私有以太坊联盟区块链网络。您应该能够在没有开发人员帮助的情况下自行完成。只需按照以下步骤操作：\n\
    \n1. 注册或登录您的 Azure 账户。\n   有免费试用选项和按需付费选项，可让您轻松尝试 Azure。\n2. 前往 `https://goo.gl/Ixu5of`。\n\
    3. 点击部署到 Azure。\n   ![警告](img/Image00006.jpg) Azure 资源管理器模板由 Azure 社区成员创建。微软不对安全性、兼容性或性能进行审查。\n\
    4. 填写表单。\n5. 点击购买。\n\n恭喜！您现在拥有了一个私有以太坊联盟区块链网络。\n\n### 在 Azure 的 Chain 上使用金融服务\n\
    \nChain 推出了其开源免费的开发者平台。它包括一个测试网络，由微软、Chain 和加密货币与合约倡议（3CI）运营。3CI 是 Chain 推出的平台，提供区块链技术解决方案，即\
    \ Chain Core Developer Edition。\n\n该平台使您能够在经过身份验证的区块链网络上发行和转移资产。这是领先的金融公司与 Chain\
    \ 共同的努力。各种金融应用程序可通过 Chain Core 开发。\n\n许多新颖的创新产品计划在此平台上推出。范围涵盖支付、银行、保险和资本市场。此外，Visa\
    \ 已与 Chain 合作，以开发一种安全、快速且简单的方式在全球范围内处理企业对企业（B2B）支付。\n\n## 在 Azure 上部署区块链工具\n\n\
    Azure 还有其他几种有用的区块链技术和工具实现，您可能会觉得有用。本节我介绍了 Azure 的四个核心区块链工具和项目，包括其以太坊实现；Cortana，一款分析机器学习工具；Azure\
    \ 的数据可视化工具 Power BI；以及其 Active Directory（AD）工具。后三者并非专门的区块链工具，但可与您的 Azure 区块链项目一起使用。\n\
    \n本节为您提供有关您可以使用 Azure 构建的内容以及可帮助项目成功的一些工具的思路。\n\n### 在 Azure 上探索以太坊\n\n以太坊区块链现已作为服务在微软的\
    \ Azure 平台上提供。该计划由 ConsenSys 和微软合作提供。Solidity 是他们创建的一个新项目，可让您开始在以太坊上构建去中心化应用程序。了解更多信息请访问\
    \ `https://marketplace.visualstudio.com/items?itemName=ConsenSys.Solidity`。\n\n\
    以太坊区块链即服务（EBaaS）使企业开发人员和客户能够在云上开发区块链环境，并可一键启动。\n\n当您在 Azure 上部署以太坊区块链时，Azure 最初提供两种工具：\n\
    * BlockApps：半私有和私有的以太坊区块链环境\n* Ether.Camp：内置开发者环境\n\nBlockApps 也可以部署到以太坊的公共环境中。这些工具允许基于智能合约快速开发应用程序。\n\
    \n以太坊是一个灵活且开放的系统，可根据客户的不同需求进行定制。有关以太坊的更多信息，请阅读第 5 章（`#text00009.html#a1`）。\n\n\
    ### Cortana：您的分析机器学习工具\n\nCortana 是一款基于云系统的强大分析机器学习工具。它是一款完全托管的云服务，使用户能够轻松快速地构建、组织和共享预测分析解决方案。它为用户提供许多好处。\n\
    \n通过查看 Cortana Intelligence 提供的分析，您可以通过预测下一个大趋势比竞争对手更早采取行动。这种灵活快速的软件可让您为行业构建快速解决方案，并根据您的特定需求进行定制。\n"
