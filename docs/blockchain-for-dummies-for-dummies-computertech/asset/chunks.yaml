    \ that you added the initial funds to (see “** [**Creating your first Bitcoin\
    \ wallet**](#text00006.html#c03-sec-0003) **,” earlier in this chapter).**\n\n\
    \    It prompts you to enter the recipient.\n\n2.  **Navigate to the page where\
    \ you can send money, and copy and paste your vanity address (see “[Generating\
    \ a Bitcoin wallet vanity address](#text00006.html#c03-sec-0005) ”) into the address\
    \ field.**\n\n3.  **Enter a small amount of money that you would like to send,\
