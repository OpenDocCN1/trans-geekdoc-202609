- raw: "In this section, you dive into building your first blockchain. You build it\
    \ in two steps. The first step is to prepare your computer to create your private\
    \ blockchain. Don’t worry — it’s made easier with tools from Docker and work that\
    \ has been done by talented developers on GitHub. The second step is building\
    \ your blockchain inside your Docker terminal.\n\n### Preparing your computer\n\
    \nYou need to download some software on to your computer in order to try this\
    \ blockchain project. Start by downloading the Docker Toolbox. Go to [ `www.docker.com/toolbox`\
    \ ](http://www.docker.com/toolbox) to download the correct version for your operating\
    \ system.\n\nNext, download GitHub Desktop. Go to [ `http://desktop.github.com`\
    \ ](http://desktop.github.com) . After you’ve installed GitHub Desktop, create\
    \ a GitHub account at [ `www.github.com` ](http://www.github.com) by clicking\
    \ Sign Up and entering a username, email address, and password, and then clicking\
    \ the Sign Up for GitHub button.\n\n Now you need to create a place to store your\
    \ blockchain data. Create a folder on your computer’s desktop called  `ethereum`\
    \  . You’ll use this folder to hold your future repository and other files. Follow\
    \ these steps to complete the process:\n\n1.  **Open GitHub Desktop.**\n\n2. \
    \ **Sign into the GitHub Desktop application on your computer with your new GitHub\
    \ account.**\n\n3.  **Return to your web browser and go to** [ `www.github.com/Capgemini-AIE/ethereum-docker`\
    \ ](https://www.github.com/Capgemini-AIE/ethereum-docker) **.**\n\n    You see\
    \ the page shown in [Figure 3-4](#text00006.html#c03-fig-0004) .\n\n4.  **Click\
    \ the Clone or Download button.**\n\n    You’ll be given two choices: Open in\
    \ Desktop or Download Zip (see [Figure 3-5](#text00006.html#c03-fig-0005) ).\n\
    \n5.  **Select the Open in Desktop option.**\n\n    The GitHub Desktop application\
    \ will reopens.\n\n    **In the GitHub Desktop application, navigate to the project\
    \ folder**  `ethereum`  **and click Clone.**\n\n![ FIGURE 3-4:  Navigate to this\
    \ page at GitHub.](Image00013.jpg)\n\n [FIGURE 3-4:](#text00006.html#rc03-fig-0004)\
    \  Navigate to this page at GitHub.\n\n![ FIGURE 3-5:  Open in Desktop.](Image00014.jpg)\n\
    \n [FIGURE 3-5:](#text00006.html#rc03-fig-0005)  Open in Desktop.\n\nCloning from\
    \ GitHub copies the information you need to build your new blockchain. Follow\
    \ the steps in the next section to get started building your private blockchain.\n\
    \n### Building your blockchain\n\nYou’re going to use the free Docker Quick Start\
    \ Terminal tool to build your blockchain. It gives you access to a virtual machine,\
    \ cutting down the time required to set up and debug your system. Because of these\
    \ features, it lets you create a stable environment for your blockchain, so you\
    \ don’t have to worry about the settings on your machine, and you can get up and\
    \ running faster.\n\nFollow these steps:\n\n1.  **Launch Docker on your computer\
    \ using the Docker Quick Start Terminal.**\n\n    ![tip](Image00003.jpg)The Quick\
    \ Start Terminal should be located with your applications or on your desktop.\n\
    \n    The Docker application launches a terminal you will use to build your blockchain.\n\
    \n2.  **Change directories in the terminal to**  `ethereum`  **.**\n\n    The\
    \ files you create making the new blockchain will go into the desktop file you\
    \ made in the preceding section. You need to give a command to the terminal in\
    \ order to change directories. If you’re on a Mac or running Linux, enter the\
    \ following command:\n\n    `cd ~ /Desktop/ethereum/ethereum-docker/`\n\n    \
    \ If you’re on a PC, enter the following command:\n\n    `cd ~ \\Desktop\\ethereum\\\
    ethereum-docker\\`\n\n    ![tip](Image00003.jpg)If these commands don’t work for\
    \ some reason, search the web for tutorials that explain how to change directories\
    \ for your type of system.\n\n    Now you can utilize the Ethereum–Docker files.\n\
    \n3.  **Create one standalone Ethereum node by entering the following command\
    \ into your terminal:**  \n\n    `docker-compose -f docker-compose-standalone.yml\
    \ up -d`\n\n    This one line of code will have created the following:\n\n   \
    \ *   One Ethereum bootstrapped container\n\n    *   One Ethereum container that\
    \ connects to the bootstrapped container\n\n    *   One Netstats container with\
    \ a web UI to view activity in the cluster\n\n4.  **Take a look at your new blockchain\
    \ by opening a web browser and going to**  `http://$(docker-machine ip default):3000`\
    \  **.**\n\nCongratulations! You’ve built your own private blockchain. If you’re\
    \ so inclined, say a word of thanks to Graham Taylor and Andrew Dong, who put\
    \ a lot of time into creating the Ethereum–Docker integration.\n\n Part 2\n\n\
    # Developing Your Knowledge\n\nIN THIS PART …\n\nDiscover the beginning of blockchain\
    \ technology with the Bitcoin blockchain.\n\nClarify your knowledge of the Ethereum\
    \ network, and expand your understanding of decentralized autonomous organizations\
    \ and smart contracts.\n\nIdentify the core concepts of the Ripple network and\
    \ how it exchanges almost any type of value instantly.\n\nEvaluate the Factom\
    \ blockchain and its ability to secure data and systems.\n\nDig into the high-speed\
    \ DigiByte blockchain, and learn about some of the fun applications being built\
    \ around blockchain technology.\n\nChapter 4\n\n# Beholding the Bitcoin Blockchain\n\
    \nIN THIS CHAPTER\n\n![check](Image00001.jpg)**Understanding where the Bitcoin\
    \ blockchain came from**\n\n![check](Image00001.jpg)**Straightening out some myths\
    \ about Bitcoin**\n\n![check](Image00001.jpg)**Staying safe when using Bitcoin**\n\
    \n![check](Image00001.jpg)**Mining for Bitcoins**\n\n![check](Image00001.jpg)**Making\
    \ a paper wallet to hold your Bitcoins**\n\nWarning! After reading this chapter,\
    \ you may become hooked on this cool emerging technology. Read at your own peril.\n\
    \nBitcoin demonstrates the purest aspects of blockchain technology. It’s the baseline\
    \ that all other blockchains are compared to and the framework that nearly all\
    \ have drawn upon. Knowing the basics of how the Bitcoin blockchain operates will\
    \ allow you to better understand all the other technology you encounter in this\
    \ ecosystem.\n\nIn this chapter, I fill you in on the fundamentals of how the\
    \ Bitcoin blockchain operates. I offer safety tips that will make your Bitcoin\
    \ experience smoother and more successful. I also show you practical things you\
    \ can start doing now with Bitcoin. In these pages, you find out how to mine the\
    \ Bitcoin token, giving you a new way to get your hands on Bitcoins without buying\
    \ them. Finally, you discover how to transfer your tokens to paper wallets, and\
    \ other practical ways to keep your tokens safe online.\n\n## Getting a Brief\
    \ History of the Bitcoin Blockchain\n\nBitcoin and the concept of its blockchain\
    \ were first introduced in the fall of 2008 as a whitepaper and later released\
    \ as open-source software in 2009. (You can read the Bitcoin whitepaper at [ `www.bitcoin.org/bitcoin.pdf`\
    \ ](http://www.bitcoin.org/bitcoin.pdf) .)\n\nThe author who first introduced\
    \ Bitcoin in that 2008 whitepaper is an anonymous programmer or cohort working\
    \ under the name of Satoshi Nakamoto. Nakamoto collaborated with many other open-source\
    \ developers on Bitcoin until 2010. This individual or group has since stopped\
    \ its involvement in the project and transferred control to prominent Bitcoin\
    \ core developers. There have been many claims and theories concerning the identity\
    \ of Nakamoto, but none of them have been confirmed as of this writing.\n\nRegardless,\
    \ what Nakamoto created is an extraordinary peer-to-peer payment system that enables\
    \ users to send Bitcoin, the value transfer token, directly and without an intermediary\
    \ to hold the two parties accountable. The network itself acts as the intermediary\
    \ by verifying the transactions and assuring that no one tries to cheat the system\
    \ by spending Bitcoins twice."
