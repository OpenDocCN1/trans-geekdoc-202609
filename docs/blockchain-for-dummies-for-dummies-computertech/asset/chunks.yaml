- raw: "    The hash in blockchain is created from the data that was in the previous\
    \ block. The hash is a fingerprint of this data and locks blocks in order and\
    \ time.\n\n    ![technicalstuff](Image00005.jpg)Although blockchains are a relatively\
    \ new innovation, hashing is not. Hashing was invented over 30 years ago. This\
    \ old innovation is being used because it creates a one-way function that cannot\
    \ be decrypted. A hashing function creates a mathematical algorithm that maps\
    \ data of any size to a bit string of a fixed size. A bit string is usually 32\
    \ characters long, which then represents the data that was hashed. The Secure\
    \ Hash Algorithm (SHA) is one of some cryptographic hash functions used in blockchains.\
    \ SHA-256 is a common algorithm that generates an almost-unique, fixed-size 256-bit\
    \ (32-byte) hash. For practical purposes, think of a hash as a digital fingerprint\
    \ of data that is used to lock it in place within the blockchain.\n\n*   **Network:**\
    \ The network is composed of “full nodes.” Think of them as the computer running\
    \ an algorithm that is securing the network. Each node contains a complete record\
    \ of all the transactions that were ever recorded in that blockchain.\n\n    \
    \ The nodes are located all over the world and can be operated by anyone. It’s\
    \ difficult, expensive, and time-consuming to operate a full node, so people don’t\
    \ do it for free. They’re incentivized to operate a node because they want to\
    \ earn cryptocurrency. The underlying blockchain algorithm rewards them for their\
    \ service. The reward is usually a token or cryptocurrency, like Bitcoin.\n\n\
    ![tip](Image00003.jpg)The terms *Bitcoin* and *blockchain* are often used interchangeably,\
    \ but they’re not the same. Bitcoin has a blockchain. The Bitcoin blockchain is\
    \ the underlying protocol that enables the secure transfer of Bitcoin. The term\
    \ *Bitcoin* is the name of the cryptocurrency that powers the Bitcoin network.\
    \ The blockchain is a class of software, and Bitcoin is a specific cryptocurrency.\n\
    \n## Blockchain Applications\n\nBlockchain applications are built around the idea\
    \ that network is the arbitrator. This type of system is an unforgiving and blind\
    \ environment. Computer code becomes law, and rules are executed as they were\
    \ written and interpreted by the network. Computers don’t have the same social\
    \ biases and behaviors as humans do.\n\nThe network can’t interpret intent (at\
    \ least not yet). Insurance contracts arbitrated on a blockchain have been heavily\
    \ investigated as a use case built around this idea.\n\nAnother interesting thing\
    \ that blockchains enable is impeccable record keeping. They can be used to create\
    \ a clear timeline of who did what and when. Many industries and regulatory bodies\
    \ spend countless hours trying to asses this problem. Blockchain-enabled record\
    \ keeping will relieve some of the burdens that are created when we try to interpret\
    \ the past.\n\n## The Blockchain Life Cycle\n\nBlockchains originated with the\
    \ creation of Bitcoin. It demonstrated that a group of individuals who had never\
    \ met could operate online within a system that was desensitized to cheat others\
    \ that were cooperating on the network.\n\n The original Bitcoin network was built\
    \ to secure the Bitcoin cryptocurrency. It has around 5,000 full nodes and is\
    \ globally distributed. It’s primarily used to trade Bitcoin and exchange value,\
    \ but the community saw the potential of doing a lot more with the network. Because\
    \ of its size and time-tested security, it’s also being used to secure other smaller\
    \ blockchains and blockchain applications.\n\nThe Ethereum network is a second\
    \ evolution of the blockchain concept. It takes the traditional blockchain structure\
    \ and adds a programming language that is built inside of it. Like Bitcoin, it\
    \ has over 5,000 full nodes and is globally distributed. Ethereum is primarily\
    \ used to trade Ether, make smart contracts, and create decentralized autonomous\
    \ organizations (DAOs). It’s also being used to secure blockchain applications\
    \ and smaller blockchains.\n\nThe Factom network is the third evolution in blockchain\
    \ technology. It utilizes a lighter consensus system, incorporates voting, and\
    \ stores a lot more information. It was built primarily to secure data and system.\
    \ Factom operates with federated nodes and an unlimited number of auditing nodes.\
    \ Its network is small, so it anchors itself into other distributed networks building\
    \ bridges across the carries blockchains.\n\n## Consensus: The Driving Force of\
    \ Blockchains\n\nBlockchains are powerful tools because they create honest systems\
    \ that self-correct without the need of a third party to enforce the rules. They\
    \ accomplish the enforcement of rules through their consensus algorithm.\n\nIn\
    \ the blockchain world, *consensus* is the process of developing an agreement\
    \ among a group of commonly mistrusting shareholders. These are the full nodes\
    \ on the network. The full nodes are validating transactions that are entered\
    \ into the network to be recorded as part of the ledger.\n\n[Figure 1-2](#text00004.html#c01-fig-0002)\
    \ shows the concept of how blockchains come to agreement.\n\n![ FIGURE 1-2:  How\
    \ blockchains work.](Image00008.jpg)\n\n [FIGURE 1-2:](#text00004.html#rc01-fig-0002)\
    \  How blockchains work.\n\nEach blockchain has its own algorithms for creating\
    \ agreement within its network on the entries being added. There are many different\
    \ models for creating consensus because each blockchain is creating different\
    \ kinds of entries. Some blockchains are trading value, others are storing data,\
    \ and others are securing systems and contracts.\n\n Bitcoin, for example, is\
    \ trading the value of its token between members on its network. The tokens have\
    \ a market value, so the requirements related to performance, scalability, consistency,\
    \ threat model, and failure model will be higher. Bitcoin operates under the assumption\
    \ that a malicious attacker may want to corrupt the history of trades in order\
    \ to steal tokens. Bitcoin prevents this from happening by using a consensus model\
    \ called “proof of work” that solves the Byzantine general’s problem: “How do\
    \ you know that the information you are looking at has not been changed internally\
    \ or externally?” Because changing or manipulating data is almost always possible,\
    \ the reliability of data is a big problem for computer science.\n\nMost blockchains\
    \ operate under the premise that they will be attacked by outside forces or by\
    \ users of the system. The expected threat and the degree of trust that the network\
    \ has in the nodes that operate the blockchain will determine the type of consensus\
    \ algorithm that they use to settle their ledger. For example, Bitcoin and Ethereum\
    \ expect a very high degree of threat and use a strong consensus algorithm called\
    \ *proof of work.* There is no trust in the network.\n\nOn the other end of the\
    \ spectrum, blockchains that are used to record financial transactions between\
    \ known parties can use a lighter and faster consensus. Their need for high-speed\
    \ transactions is more important. Proof of work is too slow and costly for them\
    \ to operate because of the comparatively few participants within the network\
    \ and immediate finality need for each transaction.\n\n## Blockchains in Use\n\
    \nHundreds of blockchains and blockchain applications are in existence today.\
    \ The whole world has become obsessed with the ideas of moving money faster, incorporating\
    \ and governing in a distributed network, and building secure applications and\
    \ hardware.\n\nYou can see many of these public blockchains by going to a cryptocurrency\
    \ exchange.\n\n[Figure 1-3](#text00004.html#c01-fig-0003) shows the altcoin exchange\
    \ for Poloniex ( [ `https://poloniex.com` ](https://poloniex.com) ), a cryptocurrency\
    \ trading platform.\n\n![ FIGURE 1-3:  The altcoin exchange platform.](Image00009.jpg)\n\
    \n [FIGURE 1-3:](#text00004.html#rc01-fig-0003)  The altcoin exchange platform."
