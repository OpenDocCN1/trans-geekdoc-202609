    \ lets companies make payments and offer prizes of just about any size to anyone\
    \ in the world. It will be exciting to see DigiByte marketing expand beyond the\
    \ gaming industry.\n\n## Mining on DigiByte\n\nDigiByte uses five mining algorithms\
