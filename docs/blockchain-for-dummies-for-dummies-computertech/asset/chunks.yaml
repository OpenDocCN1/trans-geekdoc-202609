  trans: '

    DigiByte 的一个独特之处在于其五个独立的算法，每个算法平均占新区块的 20%。这意义重大，因为大多数区块链仅运行一种算法，只有最快的节点才能赢得代币。


    DigiByte 的五种算法各自适应不同类型的矿工，这使得 DigiByte 协议对更多用户更具吸引力，并提高了去中心化程度。由于该协议的方法，攻击者需要控制约
    60% 的总网络算力才会造成任何问题。这意味着至少控制一种算法的 93% 以及另外四种算法的 51%（相比之下，比特币运行一种算法，容易受到 51% 攻击）。51%
    攻击概念是比特币区块链最严重的弱点之一。如果比特币网络中超过 51% 的矿工被一个团体控制，他们就可以操纵比特币区块链。如果网络被攻破，代币将失去价值，网络内所保护的数据也将被破坏。


    本章深入探讨 DigiByte 区块链的实际应用和未来，并解释该技术的实用用途。


    ## 了解 DigiByte：快速的区块链


    DigiByte，也称为加密货币 DGB，是一条专注于游戏、支付和安全的区块链。该公司总部位于香港，由 Jared Tate 创立。Tate 拥有军事和早期计算机科学背景，多年来一直参与比特币。
    在对比特币核心的开发感到沮丧后，他于 2014 年推出 DigiByte，并筹集了种子轮资金以扩展其在支付和贸易方面的工作。


    DigiByte 团队完成了许多其他项目都在利用的出色工作。目前，DigiByte 每秒处理 300 笔交易。 作为对比，比特币大约每秒处理七笔交易。该团队对项目有许多鼓舞人心的目标，包括到
    2021 年达到 Visa 惊人的交易速度。


    DigiByte 是分布最广的网络之一，在 82 个国家拥有超过 8,000 个节点。它与比特币类似，可以快速且成本极低地在两方之间转移价值。它也与比特币具有部分相同的功能，即可以在其区块链中保护少量信息。通过这种机制，它允许您以比比特币更快的速度保护数据、文档和合同。


    DigiByte 的亲和团队也努力让其项目更有趣。团队通过平台提供游戏奖品，并为在推特上说好话的人提供奖励。DigiByte 有 GitHub 仓库，并是
    MIT 许可证下的开源项目。


    DigiByte Gaming 是 DigiByte 的一个部门，是一个在游戏环境中利用加密货币以促进新型数字广告的平台。它拥有超过 10,000 名不断增长的用户群。这是一种许可营销形式，其中活动和激励措施通过加密货币奖品和赏金推动品牌参与。能够进行几乎无国界的安全微支付，为这种营销平台提供了非常有趣的竞争优势。


    无国界的参与使公司能够触达更广泛的受众。加密货币还让公司能够向世界任何人支付款项并提供几乎任何规模的奖品。看到 DigiByte 营销扩展到游戏行业之外将令人兴奋。


    ## 在 DigiByte 上挖矿


    DigiByte 使用五种挖矿算法来处理交易。每种算法占网络中创建的所有区块的 20%。这一系统使 DigiByte 成为独特且多样化的区块链。


    DigiByte 团队认为，通过允许平台上更多类型的挖矿可以获得更大的优势。在只有单一算法的系统中，只有最快和最新的技术才能获胜。这造成了一种技术和速度的自相残杀式军备竞赛。由于它允许各种不同类型的机器成功赢得代币，DigiByte
    系统对多样性和参与度更开放。


    以下是 DigiByte 五算法系统的简要分解：


    * SHA-256 ([`https://dgb-sha.theblocksfactory.com`](https://dgb-sha.theblocksfactory.com))：要使用
    DigiByte 的 SHA-256 挖矿选项，必须拥有 ASIC 挖矿设备。

    * Scrypt ([`https://dgb-scrypt.theblocksfactory.com`](https://dgb-scrypt.theblocksfactory.com))：你可以使用
    ASIC 挖矿设备或 GPU 来运行 DigiByte 的 Scrypt。

    * Qubit ([`http://dgb-qubit.theblocksfactory.com`](http://dgb-qubit.theblocksfactory.com))：Qubit
    是用于挖矿 DigiByte 的 GPU 算法。

    * Skein ([`http://dgb-skein.theblocksfactory.com`](http://dgb-skein.theblocksfactory.com))：Skein
    是用于挖矿 DigiByte 的 GPU 算法。

    * Groestl ([`http://dgb-groestl.theblocksfactory.com`](http://dgb-groestl.theblocksfactory.com))：Groestl
    是用于挖矿 DigiByte 的 GPU 算法。


    DigiByte 算法的多样性通过降低成功进入网络的门槛激励更多个人参与挖矿。这种多样性带来的去中心化吸引了网络的许多有趣用途。加密货币矿工经常会重新利用过时的比特币挖矿设备在
    DigiByte 网络上使用，在那里他们仍能找到其用途。


    本节深入探讨如何获得被称为 DGB 的 DigiByte 代币。你可以挖矿加密货币并在以后使用。


    ![提示](img/Image00003.jpg) 如果你有旧的比特币挖矿设备，可以用它来赚取 DGB。


    在挖矿 DGB 之前，你应该计算挖矿是否会盈利。请按以下步骤操作：


    1. 前往 [`www.coinwarz.com/calculators`](http://www.coinwarz.com/calculators)。


    在这里，你可以找到一个计算器来估算挖矿多种不同加密货币的回本时间。


    图 8-1 显示了 CoinWarz 的成本和盈利能力计算器工具。


    2. 在“Pool Fees %”字段中输入 3。


    这对参与矿池成本的较高估算。通常范围在 0.5% 到 3% 之间。


    3. 在“Hardware Costs (USD)”字段中输入 500。


    专用挖矿设备的成本差异很大。一个不错的平均成本估算是 500 美元。


    4. 在“Hash Rate (KH/s)”字段中输入 470000。


    这是对机器每秒哈希速度的估算，单位为千哈希/秒（KH/s），即每秒 1,000 次哈希计算。在特定区块链上挖矿的哈希率越高，挖矿该类型加密货币就越困难。


    ![技术细节](img/Image00005.jpg) 你也可能会看到兆哈希/秒（MH/s），即每秒 100 万次哈希计算；吉哈希/秒（GH/s），即每秒
    10 亿次哈希计算；太哈希/秒（TH/s），即每秒 1 万亿次哈希计算；以及拍哈希/秒（PH/s），即每秒 1 千万亿次哈希计算。


    5. 点击计算。


    计算器将为你提供参与加密货币挖矿的成本和盈利能力的概念。


    ![图 8-1：成本和盈利能力计算器。](img/Image00024.jpg)


    图 8-1： 成本和盈利能力计算器。


    ## 在 DigiByte 的 DiguSign 上签署文档


    由 DigiByte 团队创建的 DiguSign 是传统云存储和电子签名服务的有趣替代方案。DiguSign 采用了这些应用的基本功能，并增加了区块链技术的永久性和可验证性。它允许你对文档进行数字签名，然后将其安全地存储在
    DigiByte 区块链中。

    '
