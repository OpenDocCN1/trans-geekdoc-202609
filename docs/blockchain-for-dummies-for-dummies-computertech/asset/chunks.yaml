- raw: "## Diving into the Bitcoin Blockchain\n\nThe Bitcoin blockchain is one of\
    \ the largest and most powerful blockchains in the world. It was designed primarily\
    \ to send Bitcoin, the cryptocurrency. So, naturally, in order to create a message\
    \ in the Bitcoin blockchain, you must send some Bitcoins from one account to another.\n\
    \n When you send Bitcoins from one account to another, a transaction history is\
    \ recorded in the Bitcoin blockchain. After a transaction has been entered, the\
    \ information can’t be removed — your message will be around as long as Bitcoin\
    \ is in existence. This concept of permanence is powerful — it’s the most important\
    \ characteristic of any blockchain.\n\nYou have several ways of adding extra little\
    \ messages inside your transaction, but sometimes these methods don’t always produce\
    \ easily readable messages. In this section, I explain how to build the message\
    \ directly into the Bitcoin transaction.\n\nEmbedding the data into the Bitcoin\
    \ address ensures that it will be easily readable. You can do this by utilizing\
    \ a Bitcoin vanity address. Think of a vanity address like a vanity license plate\
    \ on a car. Six-letter Bitcoin vanity addresses can be obtained for free; longer\
    \ ones cost money. The longer the vanity address, the more costly it is.\n\nIn\
    \ this project, you create two Bitcoin wallets, add funds to one of them, obtain\
    \ a vanity address, and send a little Bitcoin between your accounts.\n\n![tip](Image00003.jpg)If\
    \ you already have a Bitcoin wallet with funds in it, you can skip the first section\
    \ and use that wallet.\n\n### Creating your first Bitcoin wallet\n\nA Bitcoin\
    \ wallet address is composed of 32 unique characters. It allows you to send and\
    \ receive Bitcoins. Your private key is a secret code associated with your Bitcoin\
    \ address that lets you prove your ownership of the Bitcoins linked with the address.\n\
    \n![warning](Image00006.jpg)Anyone with your private key can spend your Bitcoins,\
    \ so never share it.\n\nYour first Bitcoin wallet needs to be linked to a credit\
    \ card or bank account. I recommend using one of the following Bitcoin wallets:\n\
    \n*   **Coinbase (** [ `www.coinbase.com` ](https://www.coinbase.com) **)**\n\n\
    *   **Xapo (** [ `www.circle.com` ](https://www.circle.com) **)**\n\nTo set up\
    \ your first wallet, just go to one of these URLs and create an account. It just\
    \ takes a few minutes. When you have your account open, add a little money to\
    \ it so you can experiment — $5 is a great starting point.\n\n### Creating a second\
    \ Bitcoin wallet\n\nTo receive the Bitcoins you’ll send, you need to make a second\
    \ Bitcoin wallet. For this second wallet, don’t use a Circle or Coinbase wallet\
    \ — they don’t have the functionality you need for this purpose.\n\nThe easiest\
    \ Bitcoin wallet to use for this project is the Blockchain.info wallet. Follow\
    \ these steps to create it:\n\n1.  **Go to the Blockchain.info website (** [ `www.blockchain.info`\
    \ ](http://www.blockchain.info) **).**\n\n2.  **Click Wallet.**\n\n3.  **Click\
    \ Create Your Wallet.**\n\n4.  **Enter an email address and password.**\n\n###\
    \ Generating a Bitcoin vanity address\n\nA Bitcoin vanity address is like having\
    \ a personalized license plate for your car. It is a Bitcoin address that has\
    \ a string of numbers or letters that appeals to you. A vanity address is optional,\
    \ but a fun way to see your message in Bitcoin. There are a several free ways\
    \ to create a Bitcoin wallet vanity address. My favorite is BitcoinVanityGen.com.\
    \ To create your vanity address using BitcoinVanityGen.com, follow these steps:\n\
    \n1.  **Go to the BitcoinVanityGen.com website (** [ `www.bitcoinvanitygen.com`\
    \ ](http://www.bitcoinvanitygen.com) **).**\n\n2.  **Enter six letters into the\
    \ Type Letters field.**\n\n    Bitcoin only allows for small messages, and your\
    \ vanity address will make up the content of your message, which you can easily\
    \ read in Bitcoin.\n\n    ![tip](Image00003.jpg)Choose something cool because\
    \ you can reuse your address whenever you want after it has been created.\n\n\
    3.  **Click Generate.**\n\n4.  **Click Email.**\n\n5.  **Enter your email address.**\n\
    \n    BitcoinVanityGen.com emails you when your vanity address has been found.\n\
    \n6.  **Click the link in the email from BitcoinVanityGen.com.**\n\n    You’ll\
    \ be given your new vanity address and the private key associated with the address.\n\
    \n7.  **Copy your address and private key, and keep them in a safe place.**\n\n\
    \    You will need your address and private key for the next section.\n\n ![warning](Image00006.jpg)Never\
    \ share your private keys! Save your private key and a public key someplace safe.\
    \ Use your public key to receiving or send Bitcoins. (You can share your public\
    \ Bitcoin keys as much as you want.) The private key is the actual keys to your\
