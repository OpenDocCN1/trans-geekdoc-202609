    \ (USD) field, enter** 500**.**\n\n    The cost of specialized mining equipment\
    \ varies widely. A good average cost estimate is $500.\n\n4.  **In the Hash Rate\
    \ (KH/s) field, enter** 470000**.**\n\n    This is the estimate of how fast your\
    \ machine can hash in kilohashes per second (KH/s), or 1,000 hash computations\
    \ per second. The higher the hash  rate for mining on a particular blockchain,\
    \ the more difficult it is to mine that type of cryptocurrency.\n\n    ![technicalstuff](Image00005.jpg)You\
    \ may also see megahashes per second (MH/s), or 1 million hash computations per\
    \ second; gigahashes per second (GH/s), or 1 billion hash computations per second;\
    \ terrahashes per second (TH/s), or 1 trillion hash computations per second; and\
    \ petahashes per second (PH/s), or 1 quadrillion hash computations per second.\n\
    \n5.  **Click Calculate.**\n\n    The calculator will give you an idea about the\
    \ costs and profitability of engaging in cryptocurrency mining.\n\n![ FIGURE 8-1:\
    \  The cost and profitability calculator.](Image00024.jpg)\n\n [FIGURE 8-1:](#text00012.html#rc08-fig-0001)\
    \  The cost and profitability calculator.\n\n## Signing Documents on DigiByte’s\
    \ DiguSign\n\nDiguSign, created by the DigiByte team, is an interesting alternative\
    \ to traditional cloud storage and e-signature services. DiguSign takes the basic\
    \ functionality of these applications and adds the permanence and the verifiability\
    \ of blockchain technology. It allows you to digitally sign documents and then\
    \ secure them in the DigiByte blockchain."
