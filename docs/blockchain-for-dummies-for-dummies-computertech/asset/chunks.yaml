- raw: " Blockchains do a few straightforward things:\n\n*   They move value and trade\
    \ value quickly and at a very low cost.\n\n*   They create nearly permanent data\
    \ histories.\n\nBlockchain technology also allows for a few less-straightforward\
    \ solutions such as the ability to prove that you have a “thing” without revealing\
    \ it to the other party. It is also possible to “prove the negative,” or prove\
    \ what is missing within a dataset or system. This feature is particularly useful\
    \ for auditing and proving compliance.\n\n[Table 2-1](#text00005.html#c02-tbl-0001)\
    \ lists common uses cases that are suited for each type of blockchain.\n\n[ TABLE\
    \ 2-1](#text00005.html#rc02-tbl-0001) Table Head\n\n| **Primary Purpose** || **Type\
    \ of Blockchain** |\n\n| --- | --- |\n\n| Move value between untrusted parties\
    \ || Public |\n\n| --- | --- |\n\n| Move value between trusted parties || Private\
    \ |\n\n| Trade value between unlike things || Permissioned |\n\n| Trade value\
    \ of the same thing || Public |\n\n| Create decentralized organization || Public\
    \ or permissioned |\n\n| Create decentralized contract || Public or permissioned\
    \ |\n\n| Trade securitized assets || Public or permissioned |\n\n| Build identity\
    \ for people or things || Public |\n\n| Publish for public recordkeeping || Public\
    \ |\n\n| Publish for private recordkeeping || Public or permissioned |\n\n| Preform\
    \ auditing of records or systems || Public or permissioned |\n\n| Publish land\
    \ title data || Public |\n\n| Trade digital money or assets || Public or permissioned\
    \ |\n\n| Create systems for Internet of Things (IoT) security || Public |\n\n\
    | Build systems security || Public |\n\nThere may be exceptions depending on your\
    \ project, and it is possible to use a different type of blockchain to reach your\
    \ goal. But in general, here is how to break down different types of networks\
    \ and understand their strengths and weaknesses:\n\n*   **Public networks** are\
    \ large and decentralized, anyone can participate within them at any level — this\
    \ includes things like running a full node, mining cryptocurrency, trading tokens,\
    \ or publishing entries. They tend to be more secure and immutable then private\
    \ or permissioned networks. They’re often slower and more expensive to use. They’re\
    \ are secured with a cryptocurrency and have limited storage capacity.\n\n*  \
    \ **Permissioned networks** are viewable to the public, but participation is controlled.\
    \ Many of them utilize a cryptocurrency, but they can have a lower cost for applications\
    \ that are built on top of them. This feature makes it easier to scale project\
    \ and increase transaction volume. Permissioned networks can be very fast with\
    \ low latency and have higher storage capacity over public networks.\n\n*   **Private\
    \ networks** are shared between trusted parties and may not be viewable to the\
    \ public. They’re very fast and may have no latency. They also have a low cost\
    \ to run and can be built in an industrious weekend. Most private networks do\
    \ not utilize a cryptocurrency and do not have the same immutability and security\
    \ of decentralized networks. Storage capacity may be unlimited.\n\nThere are also\
    \ hybrids between these three core types of blockchains that seek to find the\
    \ right balance of security, auditability, scalability, and data storage for applications\
    \ built on top of them.\n\n### Drawing a blockchain decision tree\n\nSome of the\
    \ decisions you face while working on a blockchain project within your organization\
    \ can be difficult and challenging. It pays to take time making decisions that\
    \ involve\n\n*   **Uncertainty:** Many of the facts around blockchain technology\
    \ may be unknown and untested.\n\n*   **Complexity:** Blockchains have many interrelated\
    \ factors to consider.\n\n*   **High-risk consequences:** The impact of the decision\
    \ may be significant to your organization.\n\n*   ** Alternatives:** There may\
    \ be alternative technologies and types of blockchains, each with its own set\
    \ of uncertainties and consequences.\n\n*   **Interpersonal issues:** You need\
    \ to understand how blockchain technology could affect different people within\
    \ your organization.\n\nA decision tree is a useful support tool that will help\
    \ you uncover consequences, event outcomes, resource costs, and utility of developing\
    \ a blockchain project.\n\nYou can draw decision trees on paper or use a computer\
    \ application. Here are the steps to create one for uncovering other challenges\
    \ around your project:\n\n1.  **Get a large sheet of paper.**\n\n    ![tip](Image00003.jpg)The\
    \ more choices there are, and the more complicated the decision, the bigger the\
    \ sheet of paper you’ll need.\n\n2.  **Draw a square on the left side of the paper.**\n\
    \n3.  **Write a description of the core goal and criteria for your project in\
    \ that square.**\n\n4.  **Draw lines to the right of the square for each issue.**\n\
    \n5.  **Write a description of each issue along each line.**\n\n    ![tip](Image00003.jpg)Assign\
    \ a probability value to encounter each issue.\n\n6.  **Brainstorm solutions for\
    \ each issue.**\n\n7.  **Write a description of each solution along each line.**\n\
    \n8.  **Continue this process until you’ve explored each issue and discovered\
    \ a possible solution for each.**\n\nHave teammates challenge and review all your\
    \ issues and solutions before finalizing it.\n\n### Making a plan\n\nAt this point,\
    \ you should have a clear understanding of your goals, obstacles, and what blockchain\
    \ options you have available.\n\nHere’s a simple road map for building your project:\n\
    \n1.  **Explain the project to key stakeholders and discuss its key components\
    \ and foreseen outcomes.**\n\n2.  ** Write up a project plan.**\n\n    This is\
    \ a living set of documents that will change over the life of your project.\n\n\
    3.  **Develop the performance measurements, scope statement, schedule, and cost\
    \ baselines.**\n\n4.  **Consider creating a risk management plan and a staffing\
    \ plan.**\n\n5.  **Get buy-in and define roles and responsibilities.**\n\n6. \
    \ **Hold a kickoff meeting to begin the project.**\n\n    The meeting should cover\
    \ the following:\n\n    *   Vision for the project\n\n    *   Project strategy\n\
    \n    *   Project timeline\n\n    *   Roles and responsibilities\n\n    *   Team-building\
    \ activities\n\n    *   Team commitments\n\n    *   How your team will make decisions\n\
    \n    *   Key metrics the project will be measured against\n\n![remember](Image00004.jpg)After\
    \ you complete your project, you aren’t done! Go back and analyze your successes\
    \ and failures. Here are some questions to ask yourself:\n\n*   Are my key stakeholders\
    \ happy?\n\n*   Did the project stay on schedule?\n\n*   If not, what caused it\
    \ to be delayed?\n\n*   What did I learn from this project?\n\n*   What do I wish\
    \ I had done differently?\n\n*   Did I actually create new value for my company\
    \ or save money?\n\n![tip](Image00003.jpg)You may want to return to this chapter\
    \ when you have a deeper knowledge of blockchain technology and you’re developing\
    \ a plan to build a project.\n\nChapter 3\n\n# Getting Your Hands on Blockchain\n\
    \nIN THIS CHAPTER\n\n![check](Image00001.jpg)**Creating and using a Bitcoin wallet**\n\
    \n![check](Image00001.jpg)**Creating a simple smart contract**\n\n![check](Image00001.jpg)**Deploying\
    \ a private blockchain**\n\nBlockchains are very powerful tools and are positioned\
    \ to change how the world moves money, secures systems, and builds digital identities.\
    \ If you aren’t a core developer, you probably won’t be doing any in-depth blockchain\
    \ development in the near future. That said, you still need to understand how\
    \ blockchains work and what their core limitations are, because they’ll be integrated\
    \ into many everyday online interactions — from how businesses pay people to how\
    \ governments know that their systems and data are intact and secure.\n\nThis\
    \ chapter helps you get started in the blockchain world. You’ll get acquainted\
    \ with many of the most important aspects of working with blockchains and cryptocurrencies,\
    \ yet you’ll be working with tools that keep you at a comfortable distance from\
    \ the intimidating and complex inner workings of blockchains. This chapter also\
    \ helps you establish the basic crypto accounts that you need in later chapters."
  fmt: "\nBlockchains do a few straightforward things:\n\n* They move value and trade\
    \ value quickly and at a very low cost.\n* They create nearly permanent data histories.\n\
    \nBlockchain technology also allows for a few less-straightforward solutions such\
    \ as the ability to prove that you have a “thing” without revealing it to the\
    \ other party. It is also possible to “prove the negative,” or prove what is missing\
    \ within a dataset or system. This feature is particularly useful for auditing\
    \ and proving compliance.\n\n[Table 2-1](#text00005.html#c02-tbl-0001) lists common\
    \ uses cases that are suited for each type of blockchain.\n\n| Primary Purpose\
    \ | Type of Blockchain |\n|---|---|\n| Move value between untrusted parties |\
    \ Public |\n| Move value between trusted parties | Private |\n| Trade value between\
    \ unlike things | Permissioned |\n| Trade value of the same thing | Public |\n\
    | Create decentralized organization | Public or permissioned |\n| Create decentralized\
    \ contract | Public or permissioned |\n| Trade securitized assets | Public or\
    \ permissioned |\n| Build identity for people or things | Public |\n| Publish\
    \ for public recordkeeping | Public |\n| Publish for private recordkeeping | Public\
    \ or permissioned |\n| Preform auditing of records or systems | Public or permissioned\
    \ |\n| Publish land title data | Public |\n| Trade digital money or assets | Public\
    \ or permissioned |\n| Create systems for Internet of Things (IoT) security |\
    \ Public |\n| Build systems security | Public |\n\nThere may be exceptions depending\
    \ on your project, and it is possible to use a different type of blockchain to\
    \ reach your goal. But in general, here is how to break down different types of\
    \ networks and understand their strengths and weaknesses:\n\n* **Public networks**\
    \ are large and decentralized, anyone can participate within them at any level\
    \ — this includes things like running a full node, mining cryptocurrency, trading\
    \ tokens, or publishing entries. They tend to be more secure and immutable then\
    \ private or permissioned networks. They’re often slower and more expensive to\
    \ use. They’re are secured with a cryptocurrency and have limited storage capacity.\n\
    * **Permissioned networks** are viewable to the public, but participation is controlled.\
    \ Many of them utilize a cryptocurrency, but they can have a lower cost for applications\
    \ that are built on top of them. This feature makes it easier to scale project\
    \ and increase transaction volume. Permissioned networks can be very fast with\
    \ low latency and have higher storage capacity over public networks.\n* **Private\
    \ networks** are shared between trusted parties and may not be viewable to the\
    \ public. They’re very fast and may have no latency. They also have a low cost\
    \ to run and can be built in an industrious weekend. Most private networks do\
    \ not utilize a cryptocurrency and do not have the same immutability and security\
    \ of decentralized networks. Storage capacity may be unlimited.\n\nThere are also\
    \ hybrids between these three core types of blockchains that seek to find the\
    \ right balance of security, auditability, scalability, and data storage for applications\
    \ built on top of them.\n\n## Blockchain Decision Framework\n\n### Drawing a blockchain\
    \ decision tree\n\nSome of the decisions you face while working on a blockchain\
    \ project within your organization can be difficult and challenging. It pays to\
    \ take time making decisions that involve\n\n* **Uncertainty:** Many of the facts\
    \ around blockchain technology may be unknown and untested.\n* **Complexity:**\
    \ Blockchains have many interrelated factors to consider.\n* **High-risk consequences:**\
    \ The impact of the decision may be significant to your organization.\n* **Alternatives:**\
    \ There may be alternative technologies and types of blockchains, each with its\
    \ own set of uncertainties and consequences.\n* **Interpersonal issues:** You\
    \ need to understand how blockchain technology could affect different people within\
    \ your organization.\n\nA decision tree is a useful support tool that will help\
    \ you uncover consequences, event outcomes, resource costs, and utility of developing\
    \ a blockchain project.\n\nYou can draw decision trees on paper or use a computer\
    \ application. Here are the steps to create one for uncovering other challenges\
    \ around your project:\n\n1. **Get a large sheet of paper.**\n   ![tip](Image00003.jpg)\n\
    \   The more choices there are, and the more complicated the decision, the bigger\
    \ the sheet of paper you’ll need.\n2. **Draw a square on the left side of the\
    \ paper.**\n3. **Write a description of the core goal and criteria for your project\
    \ in that square.**\n4. **Draw lines to the right of the square for each issue.**\n\
    5. **Write a description of each issue along each line.**\n   ![tip](Image00003.jpg)\n\
    \   Assign a probability value to encounter each issue.\n6. **Brainstorm solutions\
    \ for each issue.**\n7. **Write a description of each solution along each line.**\n\
    8. **Continue this process until you’ve explored each issue and discovered a possible\
    \ solution for each.**\n\nHave teammates challenge and review all your issues\
    \ and solutions before finalizing it.\n\n### Making a plan\n\nAt this point, you\
    \ should have a clear understanding of your goals, obstacles, and what blockchain\
    \ options you have available.\n\nHere’s a simple road map for building your project:\n\
    \n1. **Explain the project to key stakeholders and discuss its key components\
    \ and foreseen outcomes.**\n2. **Write up a project plan.**\n   This is a living\
    \ set of documents that will change over the life of your project.\n3. **Develop\
    \ the performance measurements, scope statement, schedule, and cost baselines.**\n\
    4. **Consider creating a risk management plan and a staffing plan.**\n5. **Get\
    \ buy-in and define roles and responsibilities.**\n6. **Hold a kickoff meeting\
    \ to begin the project.**\n   The meeting should cover the following:\n   * Vision\
    \ for the project\n   * Project strategy\n   * Project timeline\n   * Roles and\
    \ responsibilities\n   * Team-building activities\n   * Team commitments\n   *\
    \ How your team will make decisions\n   * Key metrics the project will be measured\
    \ against\n\n![remember](Image00004.jpg)\nAfter you complete your project, you\
    \ aren’t done! Go back and analyze your successes and failures. Here are some\
    \ questions to ask yourself:\n\n* Are my key stakeholders happy?\n* Did the project\
    \ stay on schedule?\n* If not, what caused it to be delayed?\n* What did I learn\
    \ from this project?\n* What do I wish I had done differently?\n* Did I actually\
    \ create new value for my company or save money?\n\n![tip](Image00003.jpg)\nYou\
    \ may want to return to this chapter when you have a deeper knowledge of blockchain\
    \ technology and you’re developing a plan to build a project.\n\nChapter 3\n\n\
    # Getting Your Hands on Blockchain\n\nIN THIS CHAPTER\n\n![check](Image00001.jpg)**Creating\
    \ and using a Bitcoin wallet**\n\n![check](Image00001.jpg)**Creating a simple\
    \ smart contract**\n\n![check](Image00001.jpg)**Deploying a private blockchain**\n\
    \nBlockchains are very powerful tools and are positioned to change how the world\
    \ moves money, secures systems, and builds digital identities. If you aren’t a\
    \ core developer, you probably won’t be doing any in-depth blockchain development\
    \ in the near future. That said, you still need to understand how blockchains\
    \ work and what their core limitations are, because they’ll be integrated into\
    \ many everyday online interactions — from how businesses pay people to how governments\
    \ know that their systems and data are intact and secure.\n\nThis chapter helps\
    \ you get started in the blockchain world. You’ll get acquainted with many of\
    \ the most important aspects of working with blockchains and cryptocurrencies,\
    \ yet you’ll be working with tools that keep you at a comfortable distance from\
    \ the intimidating and complex inner workings of blockchains. This chapter also\
    \ helps you establish the basic crypto accounts that you need in later chapters.\n"
  trans: "\n区块链做几件直接的事情：\n\n* 它们快速且以极低成本移动价值并交易价值。\n* 它们创建近乎永久的数据历史记录。\n\n区块链技术还允许一些不太直接的解决方案，例如能够证明你拥有一个“事物”而无需向另一方透露它。还可能“证明否定”，或证明数据集中或系统中缺少的内容。此功能对于审计和证明合规性特别有用。\n\
    \n表 2-1 列出了适合每种区块链类型的常见用例。\n\n| 主要用途 | 区块链类型 |\n|---|---|\n| 在不信任的各方之间转移价值 | Public\
    \ |\n| 在信任的各方之间转移价值 | Private |\n| 在不同事物之间交易价值 | Permissioned |\n| 交易相同事物的价值 |\
    \ Public |\n| 创建去中心化组织 | Public or permissioned |\n| 创建去中心化合约 | Public or permissioned\
    \ |\n| 交易证券化资产 | Public or permissioned |\n| 为人和事物建立身份 | Public |\n| 用于公共记录保存的发布\
    \ | Public |\n| 用于私人记录保存的发布 | Public or permissioned |\n| 执行记录或系统的审计 | Public\
    \ or permissioned |\n| 发布土地所有权数据 | Public |\n| 交易数字货币或资产 | Public or permissioned\
    \ |\n| 创建物联网 (IoT) 安全系统 | Public |\n| 构建系统安全 | Public |\n\n可能存在例外，具体取决于你的项目，并且可以使用不同类型的区块链来实现你的目标。但总的来说，以下是如何分解不同类型的网络并了解其优势和劣势：\n\
    \n* **公共网络**规模大且去中心化，任何人都可以参与其中，无论级别如何——这包括运行完整节点、挖矿加密货币、交易代币或发布条目等。它们往往比私有或许可网络更安全且不可变。它们通常使用起来更慢更昂贵。它们由加密货币保护并且存储容量有限。\n\
    * **许可网络**可供公众查看，但参与受控。其中许多使用加密货币，但它们为其上构建的应用程序提供的成本可能更低。此功能使扩展项目和增加交易量变得更容易。许可网络可以非常快，延迟很低，并且与公共网络相比具有更高的存储容量。\n\
    * **私有网络**在信任方之间共享，可能不供公众查看。它们速度非常快，可能没有延迟。它们运行成本低，可以在一个勤奋的周末内构建。大多数私有网络不使用加密货币，也没有去中心化网络相同的不可变性和安全性。存储容量可能无限。\n\
    \n这三种核心区块链类型之间还存在混合类型，旨在为其上构建的应用程序找到安全性、可审计性、可扩展性和数据存储之间的正确平衡。\n\n## 区块链决策框架\n\
    \n### 绘制区块链决策树\n\n在组织内部开展区块链项目时，你面临的一些决策可能很困难且具有挑战性。花时间做出涉及以下方面的决策是值得的\n\n* **不确定性：**\
    \ 区块链技术周围的许多事实可能未知且未经测试。\n* **复杂性：** 区块链有许多相互关联的因素需要考虑。\n* **高风险后果：** 决策对你的组织的影响可能很大。\n\
    * **替代方案：** 可能存在替代技术和类型的区块链，每种都有其自身的不确定性和后果。\n* **人际问题：** 你需要了解区块链技术如何影响组织内的不同人员。\n\
    \n决策树是有用的支持工具，可帮助你发现开发区块链项目的后果、事件结果、资源成本和效用。\n\n你可以在纸上绘制决策树或使用计算机应用程序。以下是创建用于发现项目其他挑战的步骤：\n\
    \n1. **准备一张大纸。**\n   ![提示](img/Image00003.jpg)\n   选择越多，决策越复杂，你需要的纸张就越大。\n2. **在纸的左侧画一个正方形。**\n\
    3. **在该正方形中写下项目核心目标和标准的描述。**\n4. **为每个问题向正方形右侧画线。**\n5. **沿着每条线写下每个问题的描述。**\n\
    \   ![提示](img/Image00003.jpg)\n   为遇到每个问题分配一个概率值。\n6. **为每个问题集思广益解决方案。**\n7. **沿着每条线写下每个解决方案的描述。**\n\
    8. **继续此过程，直到你探索了每个问题并为每个问题发现了可能的解决方案。**\n\n在最终确定之前，请让团队成员挑战并审查你所有的問題和解决方案。\n\n\
    ### 制定计划\n\n到这一步，你应该清楚地了解你的目标、障碍以及可用的区块链选项。\n\n以下是构建项目的简单路线图：\n\n1. **向关键利益相关者解释项目并讨论其关键组成部分和预期成果。**\n\
    2. **撰写项目计划。**\n   这是一套会随着项目生命周期而变化的活文档。\n3. **制定绩效测量、范围说明书、进度和成本基线。**\n4. **考虑创建风险管理计划和人员配置计划。**\n\
    5. **获得认可并定义角色和职责。**\n6. **召开启动会议以开始项目。**\n   会议应涵盖以下内容：\n   * 项目愿景\n   * 项目策略\n\
    \   * 项目时间线\n   * 角色和职责\n   * 团队建设活动\n   * 团队承诺\n   * 团队如何做决策\n   * 项目将据此衡量的关键指标\n\
    \n![记住](img/Image00004.jpg)\n完成项目后，你还没完！回去分析你的成功和失败。以下是一些自问的问题：\n\n* 我的关键利益相关者满意吗？\n\
    * 项目是否按计划进行？\n* 如果没有，是什么导致了延迟？\n* 我从这个项目中学到了什么？\n* 我希望自己做得不同的地方是什么？\n* 我是否真正为我的公司创造了新价值或节省了资金？\n\
    \n![提示](img/Image00003.jpg)\n当你对区块链技术有更深入的了解并正在制定构建项目的计划时，你可能希望重返本章。\n\n第 3 章\n\
    \n# 亲手实践区块链\n\n本章内容\n\n![检查](img/Image00001.jpg)**创建和使用比特币钱包**\n\n![检查](img/Image00001.jpg)**创建简单的智能合约**\n\
    \n![检查](img/Image00001.jpg)**部署私有区块链**\n\n区块链是非常强大的工具，有望改变世界转移资金、保护系统和构建数字身份的方式。如果你不是核心开发者，近期可能不会进行任何深入的区块链开发。话虽如此，你仍然需要了解区块链的工作原理及其核心限制，因为它们将被整合到许多日常在线互动中——从企业如何向人们付款到政府如何知道其系统和数据完整且安全。\n\
    \n本章帮助你入门区块链世界。你将熟悉使用区块链和加密货币的最重要方面，但你将使用让你远离区块链令人生畏和复杂的内部运作的工具。本章还帮助你在后续章节中建立所需的基本加密账户。\n\
    \n"
