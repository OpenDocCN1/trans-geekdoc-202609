- raw: "Centralization comes with certain inherent security risks, such as data corruption\
    \ and theft. Blockchains combat this by creating a decentralized system that is\
    \ based on mutual distrust of all the participants that keep each other in check.\n\
    \nIn order to create such a system, you create a distributed ledger that uses\
    \ cryptocurrency (like Bitcoin, Ethereum, or Factom), where each participant is\
    \ both the user of the system and responsible for its maintenance and upkeep.\n\
    \n### Crowdfunded coverage\n\nSimilar to standard crowdfunding initiatives, the\
    \ idea is to pool resources from numerous entities or persons in order to cover\
    \ for an unexpected shortcoming in an insurance plan. For example, a retirement\
