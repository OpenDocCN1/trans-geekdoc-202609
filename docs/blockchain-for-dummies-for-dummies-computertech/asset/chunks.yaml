    # IBM Watson on Bluemix and Blockchain Integration


    IBM’s supercomputer, `Watson`, is also available on the `Bluemix` platform. `Watson`
    is a cognitive computing artificially intelligent computer system. It can analyze
    structured and, more impressively, unstructured data at incredible speed.


    ![warning](Image00006.jpg) This technology is still developing, and customers
    have complained about its true ability to understand unstructured written language.


    `Watson` can answer questions posed to it through natural language and learn as
    it absorbs more information. The implication of this technology, when married
    with blockchain technology, is astounding. One of the first implementations is
    within the `IoT` space. There is a strong need to secure data that is emitted
    from these devices and then make it actionable and intelligent.


    `Watson`’s Cognitive computing is simulating human thought processes and using
    the `MQTT` protocol. Like a human mind, it grows over time. Its self-learning
    systems use data mining, pattern recognition, and natural language processing
    to mimic the way your brain works. `Watson` processes at a rate of 80 teraflops
    per second (one teraflop is a trillion floating-point operations). To put this
    into context, that replicates — and in some cases surpasses — a high-functioning
    human’s ability to answer questions. `Watson` is able to do this by accessing
    90 servers with a combined data store of more than 200 million pages of information,
    which it processes against six million logic rules. `Watson` is about the size
    of ten refrigerators, but it’s been getting smaller and faster.


    [Figure 11-2](#text00016.html#c11-fig-0002) shows the how `IBM` `Watson` relates
    different aspects of blockchain and `IBM` systems. Dive deeper at `IBM` [`https://goo.gl/12Q6no`](https://goo.gl/12Q6no).


    ![ FIGURE 11-2:  How Bluemix integrates clients, peers, and IBM Watson.](Image00028.jpg)


    [FIGURE 11-2:](#text00016.html#rc11-fig-0002)  How `Bluemix` integrates clients,
    peers, and `IBM` `Watson`.


    `IBM` is applying these amazing capabilities to `IoT` data feeds that utilize
    `Chaincode` implementation. `Chaincode` is a `Hyperledger` smart contract system.
    Here’s how `Watson`-enabled blockchain for `IoT` devices will work:

    * `IoT` devices send data to your private blockchain ledgers for inclusion in
    shared transactions as a tamper-resistant record marked in time.

    * Partners and third-party service providers can access and supply `IoT` data
    as well, without the need for central control and management.

    * All parties can sign and verify data, limiting disputes and ensuring each partner
    is held accountable for their individual performances.


    This is a simple implementation that does not take advantage of all the functionality
    and capabilities of `Watson`. `Watson`’s ability to learn and make suggestions,
    and update out-of-date information will truly make it a powerful blockchain-enabled
    application in the future.


    You can integrate `Watson`’s `IoT` Platform with `Fabric` from `Hyperledger`.
    This integration allows you to execute `Chaincode` contracts through cognitive
    computing oracles. `Watson`’s `IoT` platform has built-in capability that lets
    you add selected `IoT` data to your own private blockchain to create an oracle.
    This helps you protect the data from being viewed by unauthorized third parties.


    When you’ve established a `Bluemix` workspace, you can add selective services,
    including the `IoT` Platform that integrates several technologies. `Fabric` is
    the blockchain technology that provides the private blockchain infrastructure
    for distributed peers that replicates the device data and validates the transaction
    through secure contracts.


    `Watson` `IoT` Platform translates existing device data, from one or more device
    types, into the format needed by the smart contract APIs. `Watson`’s `IoT` Platform
    filters out irrelevant device data and only sends the required data to the contract.
    [Figure 11-3](#text00016.html#c11-fig-0003) shows the how `IBM` `Watson` integrates
    with `IoT` devices and APIs. `Watson` acts as the `Chaincode` oracle and allows
    you to control what information is known to the parties involved in the contract.
    This functionality is important for privacy.


    ![ FIGURE 11-3:  The Watson/API/device flow.](Image00029.jpg)


    [FIGURE 11-3:](#text00016.html#rc11-fig-0003)  The `Watson`/API/device flow.


    ## Building Your Starter Network on Big Blue


    `IBM`’s blockchain technology and `IoT` Platform offer new promising tools and
    can be leveraged to address many problems facing companies that are trying to
    scale:

    * **Security:** The huge volume of data that’s collected from millions of devices
    raises information privacy concerns. Also, hacked `IoT` devices have been used
    by nefarious organizations to cripple websites with distributed denial of service
    attacks.

    * **Cost:** The high volume of messages, data generated by the devices, and analytical
    processes are going up as more devices come online and utilize that data.

    * **Architecture:** Centralized cloud platforms remain a bottleneck in end-to-end
    `IoT` solutions and a central point of attack.


    `IBM`’s open-standards-based distributed `IoT` networks can solve many of the
    problems associated with today’s centralized, cloud-based `IoT` solutions. Connected
    devices communicate directly with distributed ledgers. Data from those devices
    is then be used by third parties to execute smart contracts, reducing the need
    for human monitoring.


    The `IBM` `Watson` `IoT` Platform with a `Fabric` integration replicates data
    across a private blockchain network and eliminates the need to have all `IoT`
    data collected and stored centrally. Decentralized blockchain networks also improve
    the security of `IoT` devices. Unique digital identities are built for each device
    over time. This new way of creating and securing identity is exceptionally hard
    to spoof.


    These new blockchain identities allow `IoT` devices to sign transactions that
    allow smart contracts to execute. A practical application of this would be an
    insurance product that was fed data from a smart car on the driving behavior of
    different individuals. The car would send data to be published in `Fabric`; the
    insurance product built with `Chaincode` would then recognize the new data and
    the identity of your car and update your policy.


    The possibilities are nearly endless, and `IoT` has introduced huge opportunities
    for businesses and consumers, especially in the areas of healthcare, warehousing,
    transportation, and logistics.


    There are three main tiers of `IBM` cloud-supported `IoT` solutions that meet
    the needs of different `IoT` business problems:

    * **Devices Gateway:** Device Gateway is for smart devices or sensors that collect
    data about the physical world. This could be things like weather sensors, temperature
    monitoring for refrigerated containers, or vital statistics data for a patient.
    These `IoT` devices send their data through the Internet for analysis and processing.

    * **IBM Watson IoT Platform:** `IBM` combines its supercomputer with its `IoT`
    Platform to collect data from `IoT` devices and then analyze the data and take
    subsequent actions to solve problems. `Watson` provides machine learning, machine
    reasoning, natural language processing, and image analysis that enhance the ability
    to process the unstructured data collected from the sensors.

    * **IBM Bluemix:** `Bluemix` is an open-standards-based cloud platform for building,
    running, and managing applications and services. It supports `IoT` applications
    by making it easy to include analytical and cognitive capabilities in those applications.


    Creating and configuring your `IBM` Blockchain fabric is easy. You won’t even
    need the help of your developer! Once you’ve finished configuring your blockchain,
    you can integrate with the `Watson` `IoT` Platform. Follow these steps to have
    it up and running in a few minutes:

    1. **In the Bluemix account dashboard, click Use Services or APIs.**

    2. **In the Application Services section of the service catalog, click Blockchain.**

    3. **Verify your blockchain selections.**

    '
  trans: '

    # IBM Watson 在 Bluemix 上的区块链集成


    IBM 的超级计算机 `Watson` 也可在 `Bluemix` 平台上使用。`Watson` 是一种认知计算的人工智能计算机系统。它可以以惊人的速度分析结构化数据，更令人印象深刻的是非结构化数据。


    ![警告](img/Image00006.jpg) 这项技术仍在发展中，客户对其真正理解非结构化书面语言的能力提出了投诉。


    `Watson` 可以通过自然语言回答向其提出的问题，并在吸收更多信息时学习。当这项技术与区块链技术结合时，其影响令人惊叹。首批实现之一是在 `IoT` 领域。存在强烈需求来保护这些设备发出的数据，然后使其可操作且智能。


    `Watson`’s 认知计算正在模拟人类思维过程并使用 `MQTT` 协议。就像人类大脑一样，它会随着时间增长。其自学习系统使用数据挖掘、模式识别和自然语言处理来模仿你的大脑工作原理。`Watson`
    的处理速度为每秒 80 teraflops（一次 teraflop 为一万亿次浮点运算）。为了便于理解，这复制了——在某些情况下甚至超过了——高功能人类回答问题的能力。`Watson`
    能够通过访问 90 台服务器来实现这一点，这些服务器的综合数据存储超过 2 亿页信息，并将其与六百万条逻辑规则进行处理。`Watson` 大约有十台冰箱那么大，但它一直在变得更小更快。


    图 11-2 展示了 `IBM` `Watson` 如何关联区块链和 `IBM` 系统的各个方面。在 `IBM` 处深入了解 [`https://goo.gl/12Q6no`](https://goo.gl/12Q6no)。


    ![图 11-2：Bluemix 如何集成客户端、同行节点和 IBM Watson。](img/Image00028.jpg)


    图 11-2：  `Bluemix` 如何集成客户端、同行节点和 `IBM` `Watson`。


    `IBM` 正将这些令人惊叹的能力应用于利用 `Chaincode` 实现的 `IoT` 数据流。`Chaincode` 是 `Hyperledger` 智能合约系统。以下是
    `Watson`-enabled 区块链为 `IoT` 设备的工作方式：

    * `IoT` 设备将数据发送到您的私有区块链账本，以便作为带时间标记的防篡改记录纳入共享交易。

    * 合作伙伴和第三方服务提供商也可以访问和提供 `IoT` 数据，而无需中央控制和管理。

    * 所有各方都可以签署和验证数据，限制争议并确保每个合作伙伴对其各自的表现负责。


    这是一个简单的实现，并未充分利用 `Watson` 的所有功能和能力。`Watson`’s 学习和提出建议以及更新过时信息的能力将真正使其成为未来功能强大的区块链启用应用程序。


    您可以将 `Watson`’s `IoT` Platform 与 `Hyperledger` 的 `Fabric` 集成。此集成允许您通过认知计算预言机执行
    `Chaincode` 合约。`Watson`’s `IoT` platform 具有内置功能，可让您将选定的 `IoT` 数据添加到自己的私有区块链中以创建预言机。这有助于您保护数据免受未经授权的第三方查看。


    建立 `Bluemix` 工作区后，您可以添加选定的服务，包括集成多种技术的 `IoT` Platform。`Fabric` 是区块链技术，为分布式对等节点提供私有区块链基础设施，复制设备数据并通过安全合约验证交易。


    `Watson` `IoT` Platform 将一种或多种设备类型现有的设备数据转换为智能合约 API 所需的格式。`Watson`’s `IoT` Platform
    过滤掉无关的设备数据，只向合约发送所需数据。图 11-3 展示了 `IBM` `Watson` 如何与 `IoT` 设备和 API 集成。`Watson`
    充当 `Chaincode` 预言机，并允许您控制合约相关各方所知的信息。此功能对于隐私至关重要。


    ![图 11-3：The Watson/API/device flow。](img/Image00029.jpg)


    图 11-3：  `Watson`/API/设备流程。


    ## 在 Big Blue 上构建您的入门网络


    `IBM`’s 区块链技术和 `IoT` Platform 提供了新的有前景的工具，可用于解决试图扩展的公司面临的许多问题：

    * **安全：** 从数百万设备收集的海量数据引发了信息隐私问题。此外，被黑客入侵的 `IoT` 设备已被不法组织用来通过分布式拒绝服务攻击瘫痪网站。

    * **成本：** 随着更多设备上线并利用该数据，消息、设备生成的数据和分析流程的高量也在增加。

    * **架构：** 中心化云平台在端到端 `IoT` 解决方案中仍然是瓶颈，也是攻击的中心点。


    `IBM`’s 基于开放标准的分布式 `IoT` 网络可以解决当今中心化、基于云的 `IoT` 解决方案所关联的许多问题。连接的设备直接与分布式账本通信。来自这些设备的数据随后可被第三方用于执行智能合约，减少了对人工监控的需求。


    `IBM` `Watson` `IoT` Platform 与 `Fabric` 集成可在私有区块链网络中复制数据，并消除了需要集中收集和存储所有 `IoT`
    数据的需求。去中心化的区块链网络还提高了 `IoT` 设备的<|message|>安全性。每个设备的唯一数字身份会随着时间的推移而建立。这种创建和保护身份的新方式极难伪造。


    这些新的区块链身份允许 `IoT` 设备签署交易，从而允许智能合约执行。其实际应用是为智能汽车的驾驶行为数据提供动力的保险产品。汽车会发送数据以发布到 `Fabric`；使用
    `Chaincode` 构建的保险产品随后会识别新数据和您汽车的身份并更新您的保单。


    可能性几乎是无穷无尽的，而 `IoT` 为企业和消费者带来了巨大的机会，尤其是在医疗保健、仓储、运输和物流领域。


    有三种主要的 `IBM` 云支持的 `IoT` 解决方案层级，可满足不同的 `IoT` 业务问题需求：

    * **Devices Gateway:** Device Gateway 用于收集有关物理世界数据的智能设备或传感器。这可能是天气传感器、冷藏集装箱的温度监控或患者的生命体征数据。这些
    `IoT` 设备通过互联网发送其数据以进行分析和处理。

    * **IBM Watson IoT Platform:** `IBM` 将其超级计算机与其 `IoT` Platform 结合起来，从 `IoT` 设备收集数据，然后分析数据并采取后续行动来解决问题。`Watson`
    提供机器学习、机器推理、自然语言处理和图像分析，增强了处理传感器收集的非结构化数据的能力。

    * **IBM Bluemix:** `Bluemix` 是一个基于开放标准的云平台，用于构建、运行和管理应用程序和服务。它通过使在这些应用程序中包含分析和认知能力变得容易来支持
    `IoT` 应用程序。


    创建和配置您的 `IBM` Blockchain fabric 很简单。您甚至不需要开发人员的帮助！一旦完成区块链配置，您就可以与 `Watson` `IoT`
    Platform 集成。按照以下步骤在几分钟内将其投入运行：

    1. **在 Bluemix 账户仪表板中，单击使用服务或 API。**

    2. **在服务目录的 Application Services 部分，单击 Blockchain。**

    3. **验证您的区块链选择。**

    '
