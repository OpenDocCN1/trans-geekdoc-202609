    \ Because of this protocol’s approach, attackers would need to gain control of\
    \ around 60 percent of the total network hash rate to cause any problems. This\
    \ would entail control of at least 93 percent of one algorithm and 51 percent\
    \ of the other four (as compared to Bitcoin, which is running one algorithm and\
