    participation.


    Here is a quick breakdown of the five-algorithm system of DigiByte:


    * SHA-256 ([`https://dgb-sha.theblocksfactory.com`](https://dgb-sha.theblocksfactory.com)):
    You must have ASIC mining equipment to utilize the SHA-256 mining option for DigiByte.

    * Scrypt ([`https://dgb-scrypt.theblocksfactory.com`](https://dgb-scrypt.theblocksfactory.com)):
    You can use ASIC mining equipment or GPU to run Scrypt for DigiByte.

    * Qubit ([`http://dgb-qubit.theblocksfactory.com`](http://dgb-qubit.theblocksfactory.com)):
    Qubit is a GPU algorithm to mine DigiByte.

    * Skein ([`http://dgb-skein.theblocksfactory.com`](http://dgb-skein.theblocksfactory.com)):
    Skein is a GPU algorithm to mine DigiByte.

    * Groestl ([`http://dgb-groestl.theblocksfactory.com`](http://dgb-groestl.theblocksfactory.com)):
    Groestl is a GPU algorithm to mine DigiByte.


    The multiplicity of DigiByte’s algorithms incentivizes more individuals to participate
    in mining by lowering the barrier to enter the network successfully. The decentralization
    that resulted from this diversity has attracted many interesting uses for the
    network. Cryptocurrency miners will often repurpose outdated Bitcoin mining equipment
    to use on the DigiByte network where they can still find utility for it.


    This section dives into how to gain some of the DigiByte tokens, known as DGB.
    You can mine the cryptocurrency and use it later.


    ![tip](Image00003.jpg) If you have old Bitcoin mining equipment, it can be used
    to earn DGB.


    Before mining DGB, you should calculate if mining will be a profitable endeavor.
    Follow these steps:


    1. Go to [`www.coinwarz.com/calculators`](http://www.coinwarz.com/calculators).


    Here, you find a calculator to estimate the payback time for mining many different
    cryptocurrencies.


    [Figure 8-1](#text00012.html#c08-fig-0001) shows the cost and profitability calculator
    tool from CoinWarz.


    2. In the Pool Fees % field, enter 3.


    This is a high estimate on the cost to participate in a mining pool. It often
    ranges between 0.5 percent and 3 percent.


    3. In the Hardware Costs (USD) field, enter 500.


    The cost of specialized mining equipment varies widely. A good average cost estimate
    is $500.


    4. In the Hash Rate (KH/s) field, enter 470000.


    This is the estimate of how fast your machine can hash in kilohashes per second
    (KH/s), or 1,000 hash computations per second. The higher the hash rate for mining
    on a particular blockchain, the more difficult it is to mine that type of cryptocurrency.


    ![technicalstuff](Image00005.jpg) You may also see megahashes per second (MH/s),
    or 1 million hash computations per second; gigahashes per second (GH/s), or 1
    billion hash computations per second; terrahashes per second (TH/s), or 1 trillion
    hash computations per second; and petahashes per second (PH/s), or 1 quadrillion
    hash computations per second.


    5. Click Calculate.


    The calculator will give you an idea about the costs and profitability of engaging
    in cryptocurrency mining.


    ![ FIGURE 8-1:  The cost and profitability calculator.](Image00024.jpg)


    [FIGURE 8-1:](#text00012.html#rc08-fig-0001) The cost and profitability calculator.


    ## Signing Documents on DigiByte’s DiguSign


    DiguSign, created by the DigiByte team, is an interesting alternative to traditional
    cloud storage and e-signature services. DiguSign takes the basic functionality
    of these applications and adds the permanence and the verifiability of blockchain
    technology. It allows you to digitally sign documents and then secure them in
    the DigiByte blockchain.

