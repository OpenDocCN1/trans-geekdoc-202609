- raw: ' One of 21’s devices is an embeddable mining chip, called BitShare. It can
    be embedded into an Internet-connected device as a standalone chip or integrated
    into an existing chipset as a block of IP. The BitShare generates a stream of
    digital currency for use in a wide variety of applications.


    21 does four other things as well. It has


    *   A downloadable app that is a fast way to get Bitcoin in any country, without
    a bank account or credit card


    *   A marketplace where you can buy or sell API calls for Bitcoin with developers
    around the world, as well as add Bitcoin micropayments with one line of code


    *   A dashboard that can monitor your Bitcoin earnings and network activity


    *   A system that lets you connect with developers and host your machine-payable
    APIs


    ## Anonymous Transactions on Dash


    Dash ( [ `www.dash.org` ](http://www.dash.org) ) is the first cryptocurrency modeled
    after Bitcoin. The developers of Dash wanted to add more privacy to their transactions.
    (On the Bitcoin network, anyone can review your transaction history.) So, Dash
    allows you to keep your funds and financial transactions private. It does this
    through a mixing protocol, which anonymizes transactions by mixing transactions
    of several parties, merging their funds together in a way where they can’t be
    uncoupled. This is done through a decentralized network of servers called *masternodes.*


    Dash plans to be the first protection-driven cryptographic cash with fully encoded
    exchanges and private block transactions. Dash debit cards can be utilized at
    any ATM around the world or in stores. They can also be designated into various
    monetary standards, such as dollars, euros, or pounds.


    Dash has the following features:


    *   **Privacy:** It keeps all your payments, transactions, and balances private
    so that nobody can track you.


    *   **Speed:** It uses InstantX technology with a masternode network to complete
    transactions within seconds.


    *   **Security:** Advanced encryption and trusted protocols make the system safe.


    *   ** Global reach:** Darksend makes it a comprehensive system that enables you
    to send money worldwide quickly and anonymously.


    *   **Low fees:** The money transfer transactions cost only a few cents.


    Dash also offers two wallets — an online version and one you can download to your
    computer.


    ## ConsenSys: Decentralized Applications


    ConsenSys ( [ `www.consensys.net` ](http://www.consensys.net) ) was created by
    one of the founders of Ethereum. It builds decentralized applications, enterprise
    blockchain solutions, and various developer tools for the Ethereum blockchain
    ecosystems.


    ConsenSys is working with Microsoft to create an open-source blockchain identity
    system. This partnership came from the need set out by the United Nations ID2020,
    the goal of which is to curb crimes against humanity that come from a lack of
    identification. The plan is to have a legal identity for every person by the year
    2020.


    ConsenSys has developed the uPort identity solution, with integrated support for
    reputation systems and transactional security. The uPort system allows individuals
    to manage their identity elements in a portable and persistent manner on the Ethereum
    blockchain.


    Users in less developed areas of the world can bootstrap their identities and
    reputations.


    RepSys adds to the functionality of the uPort system. It enables people, organizations,
    and “things” to attest to the conduct of their counterparties on various kinds
    of transactions. Think of it sort of like Amazon reviews for identity. uPort holds
    the reputation attributes. These can both be official things like government-issued
    IDs, as well as Facebook pages. ConsenSys is also building in KYC solutions so
    that financial institutions can offer financial services.


    ## About the Author


    Tiana Laurence is a co-founder of Factom, Inc., and was an early Bitcoin enthusiast.
    Her passion is growing great companies. A serial entrepreneur, Tiana started her
    first business at 16. She loves helping young aspiring entrepreneurs learn about
    business and technology. Tiana has a BA in Business and Leadership from Portland
    State University. When Tiana is not working on her businesses or being nerdy,
    she can be found running or rock climbing in Austin, Texas.


    ## Dedication


    This one is for Crystal and Jessica, for all the support and encouragement they
    gave me as I was writing this book.


    ## Author’s Acknowledgments


    This book is the product of many people’s ideas and work. It would not have been
    possible without the open and supportive blockchain and cryptocurrency world.
    I’d like to thank specifically Paul Snow, Peter Kirby, Brian Deery, and David
    Johnston for the countless hours spent teaching me about blockchain and cryptography.
    I’d also like to thank Abhi Dobhal, Lawrence Rufrano, Ryan Fugger, Charley Cooper,
    Alyse Killeen, Jeremy Kandah, Clemens Wan, Greg Wallace, Brian Behlendorf, Amir
    Chetrit, Jared Tate, Casey Lawlor, and Scott Robinson for the direction and guidance
    in the evolving blockchain space and for taking time out of their busy lives to
    review and sanity-check my work.


    This book also took a lot of editing. I’m not kidding it really took a lot of
    editing. My project editor, Elizabeth Kuball, did a great job keeping me on task
    and on schedule, and Steve Hayes, my executive editor, made the whole book possible.
    I’d also like to thank Scott Robinson again for his thorough technical review
    and excellent suggestions, as well as editor Pat O’Brien and all the other behind-the-scenes
    people, who did thankless jobs to bring this book about. I’m forever in their
    debit.


