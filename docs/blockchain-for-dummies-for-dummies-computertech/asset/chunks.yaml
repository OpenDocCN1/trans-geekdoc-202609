    Centralization comes with certain inherent security risks, such as data corruption
    and theft. Blockchains combat this by creating a decentralized system that is
    based on mutual distrust of all the participants that keep each other in check.


    In order to create such a system, you create a distributed ledger that uses cryptocurrency
    (like Bitcoin, Ethereum, or Factom), where each participant is both the user of
    the system and responsible for its maintenance and upkeep.


    ## Crowdfunded coverage

    Similar to standard crowdfunding initiatives, the idea is to pool resources from
    numerous entities or persons in order to cover for an unexpected shortcoming in
    an insurance plan. For example, a retirement insurance plan could kick in only
    at the age of 65, but a person could be forced to retire early because of unforeseen
    circumstances, and additional funds would be needed by the unfortunate individual.


    Economic disparity has grown over the years, and numerous underinsured or uninsured
    people could benefit from such a system. Crowdfunding can potentially provide
    benefits to all three parties in question:

    * **Insurers** gain increased revenue because more people are interested in their
    plans. They gain access to a greater portion of the underinsured population. In
    addition, the insuring company could improve its brand recognition — it could
    be seen as a company that cares.

    * **Donors** could benefit from possible tax exemptions, if the structure of the
    campaign allows it, or they could gain other benefits, such as discounts or free
    services.

    * **Seekers** (those looking for insurance) obviously stand to gain the most,
    as they can get better protection and more affordable coverage.


    Cognizant proposed interesting insights to crowdfunding insurance in its whitepaper.
    You can find it at [ `https://goo.gl/u3Kd3U` ](https://goo.gl/u3Kd3U).


    ## The implications of DAO insurance

    DAOs are corporate entities that have no full-time employees, but are able to
    perform all the functions that a standard corporation can. The ability to create
    such an entity stems directly from the improvement in blockchain algorithms, which
    has happened over the last few years and has created what is commonly known as
    blockchain 2.0.


    A DAO is, in essence, a form of an advanced smart contract. The DAO is able treat
    DAO as a corporation where all its individual policy users are shareholders, while
    the corporation itself never is in direct control of any particular group or individual.


    In the same manner, a DAO is never under control of the developers, and they don’t
    issue or deny policies. It’s strictly a peer-to-peer insurance model. Although
    vulnerabilities regarding identity verification still exist, this system will
    be improved, and in reality, the same issues exist even in the current, centralized
    insurance systems.


    # Chapter 15

    ## Government

    ### IN THIS CHAPTER

    ![check](Image00001.jpg)**Reading blockchain documents**

    ![check](Image00001.jpg)**Building smart cities**

    ![check](Image00001.jpg)**Creating hack-proof identity**


    In this chapter, I introduce you to the exciting innovations that are taking place
    inside governments and the companies that support them with innovative blockchain
    projects.


    Everyday business is affected by scams and fraud, and this chapter explains how
    governments are fighting back against cybercrime and identity theft. You also
    find out about smart cities initiatives, which will be critical to economic growth
    and sustainability — many are using blockchain technology to bridge technological
    gaps.


    ### The Smart Cities of Asia

    *Smart cities* are taking advantage of modern technology to enhance infrastructure
    function, and safety, and improve things like traffic and air quality. The business
    of becoming a smart city is booming, and almost every larger municipality has
    embraced the smart city concept.


    Blockchain is especially useful when integrated with the Internet of Things (IoT)
    used by smart cities. Several interesting projects are being piloted now for commercial
    deployment. The U.S. Department of Homeland Security is exploring securing IoT
    devices used by Customs and Border Protection (CBP). Companies such as Slock.it
    are allowing connected objects to use the blockchain to enter into smart contracts;
    its first product was a blockchain-enabled smart lock, which could be used be
    Airbnb customers. The integration of these technologies allows devices to use
    their sensors to set up smart contracts. This same technology could be used by
    city parking meters.


    [Figure 15-1](#text00021.html#c15-fig-0001) shows the home page of Singapore’s
    Smart Nation project. Singapore has been courting startups from around the world
    to develop new technology in its “regulatory sandbox.” It’s a welcome invitation
    to blockchain technology companies that have been operating in the *gray zone*
    (where there is not a clear regulatory framework established), however many countries,
    like Singapore are taking direct action to define the space and let companies
    know what is allowed and not allowed.


    ![ FIGURE 15-1: Singapore’s Smart Nation project.](Image00030.jpg)


    [FIGURE 15-1:](#text00021.html#rc15-fig-0001) Singapore’s Smart Nation project.


    Blockchain technology could also be used to share information between networks
    in a smart city securely. Many cities are exploring how to use blockchain to alleviate
    traffic jams. Singapore’s Smart Nation project hopes to use the mobile phones
    of its citizens to measure the conditions of their bus rides, and then analyze
    the data to see when roads need to be upgraded. Singapore has been a leader in
    smart city development and has begun developing smart cities in other countries.


    In this section, I walk you through some of the many blockchain efforts that are
    taking place in Asia.


    #### Singapore satellite cities in India

    The Indian government launched its Smart Cities Mission in 2015, with the intention
    of building 100 new smart cities. Many of these developments will be in the Delhi
    Mumbai Industrial Corridor, which is a 620-mile (1,000km) stretch between Delhi
    and Mumbai. Infrastructure worth $11 billion has already been planned across 33
    cities, and much of the development will be funded through a public–private model.
    The project is expected to attract $90 billion in foreign investment, which will
    be used to create business parks, manufacturing zones and smart cities, all of
    which will be situated along a delegated rail freight corridor.


    These smart cities are being developed as India’s economy industrializes and the
    population becomes more urbanized. State intervention in the form of centrally
    planned cities is necessary in order to prevent the existing cities from becoming
    overcrowded and unlivable. India is particularly vulnerable to climate change
    because of its immense and impoverished population. Because of this, it’s important
    that these cities are sustainable and smart. They need low-energy housing materials,
    intelligent grids, planned transportation, integrated IT systems, e-governance,
    and innovative water harvesting.


    Singapore is a prime example of an intelligently planned city. Despite the high
    population density, it has excellent infrastructure and a high quality of life.
    Many of Singapore’s private organizations have the knowledge and resources that
    are needed to develop India’s smart cities. In collaboration with the Indian government,
    the private sector would be able to provide the capital, skills, and technology
    that are necessary for such large plans.


    Andhara Pradesh and the Monetary Authority of Singapore have announced a financial
    technology (fintech) innovation partnership, with a primary focus on blockchain
    and digital payments. Singapore aims to develop a marketplace for fintech solutions
    in India.

