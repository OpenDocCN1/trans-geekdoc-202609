    Industries inside of China are looking to blockchains to solve many of the same
    problems seen in other parts of the world. They’ve been quick to use blockchains
    to supplement what they’ve already been doing, adding layers of certainty to things
    like Internet of Things (IoT) and notarization. Whereas Western countries have
    a more distributed and decentralized power structure, China has a more centralized
    one. This allows China to move quickly to both regulate and innovate.


    China Ledger, a blockchain coalition with support from the Chinese National Assembly,
    the ruling body of China, is a good example of swift action by both regulatory
    bodies and industry. China Ledger has attracted Anthony Di Iorio and Vitalik Buterin,
    both Ethereum founders. It also has support from Bitcoin core developer Jeff Garzik
    and UBS Innovation Manager Alex Baltin.


    ## The developing world: Roadblocks to blockchain

    The future is here — it’s just not distributed. This is especially true in developing
    countries, which often have a greater need for technology, yet don’t have the
    same resources or the right political environment to allow those innovations to
    take root. Some small countries try protectionist measures that block the importation
    of goods that could be made within their borders; other countries mistrust the
    quality and benevolence of products and services that come from the outsides sources
    as well. On a darker note, some political systems benefit too greatly from the
    inefficiencies and ambiguities that their legal system has in place to change.


    Hernando de Soto Polar is a Peruvian economist and author who has spoken widely
    on an informal economy and the importance of business and property rights. One
    of the prominent issues that keeps the developing world undeveloped is *dead capital.*
    The property which is informally held and not legally recognized or the current
    systems in place cannot be trusted. For owners of this land, it is difficult or
    impossible to finance and sell. The uncertainty also decreases the value of the
    assets. The western world has been able to borrow against assets and sell them
    relatively freely. This has driven innovation and economic prosperity.


    The technology that is enabled by blockchains could change that reality for developing
    countries very quickly. Clear ownership records for land would mean that it would
    be sellable and financeable. This would make the beachfront property of Colombia
    irresistible. Irreversible payments and true known identity would open credit
    and commerce in new ways.


    Many startups and hackers have come together to try to make this future vision
    a reality. Even larger global players like the World Bank have had repeated meeting
    about blockchain and its impact in the developing world. Bitcoin and blockchain
    are making inroads in Africa where local currencies and infrastructure are deeply
    mistrusted. BitPesa, a payment and trading platform servicing many countries in
    Africa, has begun expanding to the UK and Europe. It has also started widening
    its service offerings to things like payroll.


    As many roadblocks as developing countries have toward development and innovation,
    they also have advantages that western countries will never overcome. The lack
    of existing infrastructure in developing countries makes it easier for them to
    leapfrog Western nations. This was evident in the proliferation of cellphones
    in developing countries. Developing countries also don’t have the same regulatory
    bodies and consumer protections. This is particularly attractive for blockchain
    startups that fall into the gray zone in western countries. Developing countries
    often have fewer decision makers, making it easier to meet people who have the
    power to change.


    # Chapter 14

    ## Insurance

    ### IN THIS CHAPTER


    ![check](Image00001.jpg)**Building new business**


    ![check](Image00001.jpg)**Tailoring individual insurance**


    ![check](Image00001.jpg)**Creating new insurance markets**


    ![check](Image00001.jpg)**Cutting costs in unexpected ways**


    Blockchain insurance technology is situated to change how individuals and companies
    buy and obtain insurance coverage, and it’s coming faster than you might think!
    You need to understand the implications of these new technologies that are just
    now on the horizon.


    In this chapter, I explain how these new technologies work and their core limitations.
    I show you how Internet of Things (IoT) devices will collaborate with insurance
    providers. I also describe how self-executing blockchain contracts will shape
    policies and company structures.


    This chapter prepares you for the fundamental changes in technology that may shift
    the burden of proof. After reading this chapter, you’ll be able to make more educated
    decisions about blockchain-based insurance coverage and payments. You’ll understand
    how the cost of coverage will affect you and the different types of coverage that
    will become available to you in the future.


    ### Precisely Tailoring Coverage

    IoT devices, immutable data, decentralized autonomous organizations (DAOs), and
    smart contracts are all shifting the development of insurance for consumers. The
    convergence of all these technologies is possible because of the development of
    blockchains.


    Blockchains do a few things really well that will allow for two major shifts in
    how insurance will be bought and sold in the future: Individuals will be able
    to gain more custom coverage, and new markets will open up that weren’t possible
    before due to costs.


    #### Insuring the individual

    Insurance built around the individual will allow for a significant shift of priorities.
    Asset management will be less critical, and the insurers will be able to focus
    on risk calculation and matching supply and demand.


    You could create a marketplace platform that insures customers. There are many
    ways that you could organize this new business. One possibility would be an on-demand
    marketplace where users post their requests, either standardized by custom smart
    contract or by Chaincode contract. If you haven’t read about these types of new
    self-executing digital contracts, check out [Chapter 5](#text00009.html#a1) on
    Ethereum and [Chapter 9](#text00014.html#a1) on Hyperledger.


    With this type of model, you, as the insurer, could calculate the premium for
    the specific demand, based on historical data and other risk calculation factors
    in your risk model. If the customer is satisfied with the offer, the customer
    can bid or subscribe, depending on the demand model being utilized.


    This new type of insurance could be adopted by peer-to-peer (P2P) or crowd-funded
    insurance or a traditional insurance company that adopts the technology. Either
    way, both are created in a decentralized cryptocurrency ledger with the use of
    smart contracts/Chaincode, which guarantee the payment from the customer to the
    investor and vice versa if an incident occurs. Blockchain is key here, because
    it enables a few things that weren’t feasible or secure a few years ago.


    Blockchains create near frictionless transfer of value meaning micropayments are
    feasible because the transaction fees are so low. You can now open up new markets
    that did not have a working monetary system or legal system or instances where
    the cost of transactions and disputes outweighed the benefit of offering coverage.


    You can use DAOs, with smart contracts, to govern large groups at a fraction of
    the cost and time. You could use this model to incorporate and administer your
    new company, and possibly crowd-fund insurance platforms.


    The self-executing nature of smart contracts could also illuminate many of the
    cost of claims adjustment and third parties that help with the processing and
    collection of funds.

