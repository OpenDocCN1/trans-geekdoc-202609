    # Factom Harmony


    Factom Harmony (shown in [Figure 7-4](#text00011.html#c07-fig-0004)) works by
    converting various imaging systems utilized by banks into a blockchain vault for
    documents. It creates and manages entries in real-time as the mortgage is processed.
    Then it secures a record of the data within Factom, allowing metadata to be shared
    transparently and points to confidential data between trusted parties.


    ![Illustration courtesy of Factom, Inc. ¶  FIGURE 7-4:  Factom Harmony.](Image00023.jpg)


    Illustration courtesy of Factom, Inc. ¶  [FIGURE 7-4:](#text00011.html#rc07-fig-0004)  Factom
    Harmony.


    In simple terms, Factom Harmony is a document catalog that sits on an imaging
    system. It’s a radical improvement over the existing systems because individuals
    who get involved years later can be sure that the records they’re handed are identical
    to the ones that originated the loan. No longer do mortgage buyers need to trust
    the fastidiousness of the many intermediaries between origination and themselves.


    Factom is hoping to capture some of the value that comes from eliminating costs
    associated with document assembly. Banks and other originators currently spend
    immense amounts of time ensuring audits and record reviews are only conducted
    using the correct set of records and data. This often breaks down when multiple
    stakeholders coordinate while interacting with loan documents across disparate
    sources.


    ## Securing data on the blockchain: The digital vault


    Factom Harmony (see the preceding section) provides the ability to store the specific
    data and documents, used for decision and compliance, to a permanent blockchain,
    while at the same time sharing that data with any party that needs it. Data that
    has been stored within this system has a clear version history. Missing data is
    also evident. It was designed for scenarios like audits, lawsuits, foreclosures,
    loan trading, securitization, and regulatory reviews.


    Core technology limitations, during the decade leading up to the 2008 market crash,
    were focused on speed, throughput, checklist management, and document collection.
    The systems were not designed to collect records and the associated data in a
    manner that permanently preserves evidence of the decisions and actions.


    Today’s regulatory environment requires business to be far more diligent in their
    efforts to document and maintain the records and data associated with every decisions.
    Any deficiencies in the documentation of the process are often attributed to malice.
    Without the ability to perfectly preserve the evidence of the data and the decisions
    associated with it.


    ## How Harmony works with Factom technology


    Factom’s technology is a combination of blockchain technology, digital signatures,
    and a set of cryptographic functions developed by the U.S. National Institute
    of Standards and Technology (NIST). A series of data points is preserved along
    with a cryptographic proof on other blockchains that allows users to preserve
    the data and documents for future use. This process creates an electronic catalog
    of files that can be accessed and validated at any time by any authorized parties.


    Using the `SHA-256` cryptographic function, Factom generates a hash of each document
    and data file stored within the Factom blockchain. The hash creates cryptographic
    proof that a file has never been altered or changed.


    ![remember](Image00004.jpg)A `hash` is a kind of “fingerprint” for a set of data
    that represents the contents of a file but without the risk of the data being
    exposed.


    Additionally, Harmony generates and stores a set of key meta-data points along
    with the hash for every document and data file associated with the record. Within
    the metadata documents and data files are associated and linked using the same
    cryptographic tools. This metadata along with the file hashes is written to the
    Factom blockchain.


    ## Using blockchain as a public witness


    Factom creates multiple public witnesses for the data that it secures. Its blockchain
    is tiny in comparison to the behemoths such as Bitcoin and Ethereum. Their system
    does not have mining as part of the consensus mechanism. Currently, the system
    is not even producing any new tokens. The larger and more decentralized a blockchain,
    the more secure it is from a successful attack.


    Mining cryptocurrency is what most public blockchains do to secure themselves.
    It’s what incentives nodes to join the network.


    Factom overcomes this obstacle with a clever method that gives it compounded security.
    It anchors the data placed in the Factom blockchain within Bitcoin and Ethereum.
    This is done every ten minutes through hashing. They take the full data set and
    hash it until there is only one hash that can represent the whole Factom blockchain.


    # Verifying physical documents: dLoc with Factom


    Smartrac, the world’s leading developer, manufacturer, and supplier of RFID transponders,
    inlays, prelaminates, and semifinished cards partnered with Factom. Out of this
    partnership, a new way of securing physical objects with blockchains was created.
    This product and service is called dLoc. dLoc was designed as a sticker that can
    be placed on almost anything. It has special utility for paper-based documents
    such as breeder documents.


    dLoc is an end-to-end secure document management system that uses both hardware
    and software. dLoc’s adhesive Smartrac encoded Near Field Communication (NFC)
    transponder sticker with an embedded chip is placed on documents or other goods
    and then secures them using the Factom blockchain.


    ![technicalstuff](Image00005.jpg)NFC communication protocols allow two electronic
    devices, to establish connection when brought near each other.


    By combining cloud-based software with Factom’s technology, an immutable identity
    is created over time for just about anything. People with certain levels of clearance
    can access and validate the physical document using the dLoc mobile app.


    dLoc also allows issuing agencies or entities to turn their offline documents
    into digital instances that can be easily connected to the existing digital systems
    and bridge the gap between the offline and online worlds. This solution can be
    applied to a broad range of documents such as birth certificates, land titles,
    court, and medical records.


    dLoc represents the first practical document authentication system that uses the
    Factom blockchain to solve the data integrity gap between the physical and digital
    world. It’s the first reliable way to secure information on paper-based documents
    with digital data using blockchain technology. dLoc’s data and identity authentication
    solution hold great promise for both public and private sectors, where paper-based
    documents are widely used.


    ![remember](Image00004.jpg)dLoc does not eliminate fraud. People will be people
    and find ways to bypass, circumvent, and steal. This technology makes it much
    more challenging and costly to do so. At this point, someone can buy a new identity
    or forge goods almost anywhere. And in some cases, these identities are indistinguishable
    from authentic documents and commodities.


    dLoc was created as a way to extend the impossibility of blockchain technology
    to physical objects and documents. They have also created a system that can notify
    you if your identity is being tampered with and the possibility of doing something
    about it.


    # Chapter 8: Digging into DigiByte


    ## IN THIS CHAPTER


    ![check](Image00001.jpg)**Getting to know DigiByte**


    ![check](Image00001.jpg)**Starting to mine on DigiByte**


    ![check](Image00001.jpg)**Gaming for tokens**


    DigiByte is the blockchain that is owning the gaming space. It’s a unique system
    that works well with many interesting applications, from gaming to document management.
    The team at DigiByte has discovered the right mix of speed, accessibility, and
    utility for blockchains.

