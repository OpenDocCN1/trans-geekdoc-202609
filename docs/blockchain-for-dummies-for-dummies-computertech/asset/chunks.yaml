- raw: '*   **Interoperability of assets:** In the future, Fabric may also have some
    of the same functionality as the Ripple network (see [Chapter 6](#text00010.html#a1)
    ). It has imagined use cases where companies could exchange assets in low-liquidity
    markets by matching demands between multiple parties. Instead of settling for
    market limits on direct trading between two parties, a chain network connects
    buyers with sellers and finds the best match across multiple asset classes. Hyperledger
    looks to be well positioned in the future to trade derivatives. You can read more
    about this work at [ `http://events.linuxfoundation.org/sites/events/files/slides/TradingDerivatives_LinuxCon_2016.pdf`
    ](http://events.linuxfoundation.org/sites/events/files/slides/TradingDerivatives_LinuxCon_2016.pdf)
    .


    ## Investigating the Iroha Project


    Hyperledger’s Iroha project is building on the work completed in the Fabric project.
    It’s meant to complement Fabric, Sawtooth Lake, and the other projects under Hyperledger.
    Hyperledger added the Iroha project to incubation because the other projects didn’t
    have any infrastructure projects written in C++. Not having a C++ project severely
    limited how many people could benefit from the work on Hyperledger and the number
    of developers who could contribute to the project.


    In addition, most blockchain development at this point has been at the lowest
    infrastructure level, and there has been little to no development work on user
    interaction or mobile applications. Hyperledger believes that Iroha is necessary
    for the popularization of blockchain technology. This project fills the gap in
    the market by bringing in more developers and providing libraries for mobile user
    interface development.


    At the time of this writing, Iroha is a very new project and has not integrated
    with Fabric or Sawtooth Lake. Hyperledger has plans to expand functionality to
    work with the other blockchain projects soon. Its iOS, Android, and JavaScript
    libraries will provide supportive functions like digitally signing transactions.
    It will be very useful for commercial app development, and it will add new layers
    of security and business models only possible with blockchain technology.


    ### Introducing Sumeragi: The new consensus algorithm


    Blockchains have systems that allow them to first agree on a single version of
    the truth and then record that agreed-upon truth in their ledger. An agreement
    system is called a *consensus.*


    A consensus is complicated. Grasping the nuances of how and why consensuses act
    in the way they do is well beyond the scope of this book. It’s also far more then
    you’ll ever need as a business professional. What *does* matter for you are the
    consequences of different consensus mechanisms and how they affect what you’re
    doing on that particular blockchain. I’m highlighting Iroha’s consensus, Sumeragi,
    because it’s very different from traditional blockchains.


    Here are a few key things that make Sumeragi different:


    *   **Sumeragi does not have a cryptocurrency.**


    *   **Nodes that start consensus are added into the system by the Fabric member
    services.** Nodes build a reputation over time based on how they’ve interacted
    with the ledger. This is a permission blockchain run by known entities.


    *   ** New entries are added to the ledger in a unique way.** The first node that
    starts consensus, called the *leader,* broadcasts the entry to a group of other
    nodes; those nodes then validate. If they don’t validate, the first node will
    rebroadcast after a predetermined duration of time. The broadcasting element is
    similar to how Ripple’s consensus works.


    Depending on your use case for blockchain, Iroha may be positive or negative.
    If you’re worried about censorship, Iroha may not be right for you. In this case,
    you’ll be better off looking at a blockchain that is censorship resistant. If
    you’re worried about other players on the network committing arbitrage, Iroha
    may also not be right — further investigation is needed. If you want to know all
    the players in your blockchain, Iroha may be exactly what you’re looking for.


    ### Developing mobile apps


    ![tip](Image00003.jpg)Skip this section if you aren’t part of the app development
    space.


    Iroha is built for the web and mobile app developers so they can access the strengths
    of the Hyperledger systems. The Iroha team saw that having a distributed ledger
    wasn’t useful if there were no applications utilizing it.


    Iroha has a development path for the following encapsulated C++ components:


    *   Sumeragi consensus library


    *   Ed25519 digital signature library


    *   SHA-3 hashing library


    *   Iroha transaction serialization library


    *   P2P broadcast library


    *   API server library


    *   iOS library


    *   Android library


    *   JavaScript library


    *   Blockchain explorer/data visualization suite


    One of the major hurdles of the blockchain industry has been in making systems
    user-friendly. Iroha has created open-source software libraries for iOS, Android,
    and JavaScript and made common API functions convenient to call. It’s still early
    in development, but Iroha is a good resource to explore for business use cases.


    ## Diving into Sawtooth Lake


    Sawtooth Lake by Intel is another distributed ledger project in Hyperledger. It’s
    focused on being a highly modular platform for building new distributed ledgers
    for companies.


    ![warning](Image00006.jpg)As of this writing, the release version has software
    that is only *simulating* the consensus. It doesn’t provide security for your
    project and should only be utilized for testing out new ideas.


    Sawtooth Lake does not operate with a cryptocurrency. It maintains the security
    of the platform by allowing businesses to create private blockchains. These businesses
    running private blockchains then share the burden of computational requirements
    of the network. In its documentation, Sawtooth Lake states that this type of setup
    will ensure universal agreement on the state of the shared ledger.


    Sawtooth Lake has taken the basic model of blockchains and turned it on its head.
    Most blockchains have three elements:


    *   A shared record of the current state of the blockchain


    *   A way of inputting new data


    *   A way of agreeing on that data


    Sawtooth Lake merges the first two into a signal process they call a *transaction
    family.* This model is best in use cases where all the participating parties have
    a mutual benefit to having a correct record.


    Intel has allowed its software to be flexible enough to accommodate custom transaction
    families that reflect the unique requirements of each business. It also built
    three templates for building digital assets:


    *   **EndPointRegistry:** A place to record items in a blockchain


    *   **IntegerKey:** A shared ledger that is used for supply chain management


    *   **MarketPlace:** A blockchain trading platform for buying, selling, and trading
    digital assets


    ### Exploring the consensus algorithm: Proof of Elapsed Time


    The consensus algorithm for Sawtooth Lake is called Proof of Elapsed Time (PoET).
    It was built to run in a secure area of the main processor of your computer, called
    a trusted execution environment (TEE). PoET leverages the security of the TEE
    to prove that time has passed by time-stamping transactions.


    Other consensus algorithms have some kind of time-stamping element as well. The
    way they ensure the records have not been changed is through publicly publishing
    their blockchains as proof that it has not been altered. The published ledger
    acts as a public witness that anyone can roll back and check. It’s sort of like
    publishing an ad in a newspaper to prove something happened.'
