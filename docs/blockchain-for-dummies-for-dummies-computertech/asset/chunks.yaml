    Keep this in mind while using exchanges, and follow the best practices laid out
    in this book to keep your tokens safe. Do a little research on the exchange you’re
    using to see what security measures it has in place.


    Finally, just use exchanges to move your funds in and out. Don’t use the exchange
    as a place to store value. Instead, hold significant amounts of crypto in cold
    storage or in a laminated paper wallet with several copies.


    ## Beware Wi-Fi

    If your router wasn’t set up correctly, it’s possible for someone to see a log
    of all your activity. If you’re on a public network, assume that the owner of
    the network can see your activity.


    ![warning](Image00006.jpg) Only use trusted Wi-Fi networks and make sure you’ve
    changed the password on your router to something as secure as a password. Most
    Wi-Fi router passwords are set to a factory default of “admin” and can easily
    be taken over by a third party.


    ## Identify Your Blockchain Dev

    Blockchain technology is new, and there just aren’t that many people who have
    a lot of experience when it comes to building blockchain applications.


    If you’re thinking about hiring a developer to help you with a project, check
    out her GitHub and see what work she’s done before you get started. She may not
    need to be experienced with blockchain specifically, but if she isn’t, she should
    be a very experienced developer outside of the blockchain world.


    There aren’t many resources out there yet to help developers when they get stuck.
    Inexperienced developers may struggle more and take longer to develop your application.


    ## Don’t Get Suckered

    The blockchain industry as a whole does not have the same protection and security
    measures that banks and other financial institutions have, and there are not the
    same laws for your protection and financial welfare. There is no consumer protection
    and no FDIC bank insurance of funds from the government. If you get robbed or
    conned, you may not be able to turn to anyone for help.


    Also, the industry has had a lot of hype in the last few years without much delivery
    of things of real value. The year 2016 saw over a thousand new blockchain companies
    pop up overnight claiming expertise. When you’re looking at developing a project
    and trying to decide if it’s worth the investment, it’s always a good idea to
    take a minute and make sure it even makes sense. Ask yourself the following questions:

    * Is there real value generated?

    * Is the value created in the way that benefits you?

    * Are there other more tested technologies that could be used to accomplish the
    same thing with the same efficiency or better?


    Blockchain technology holds a lot of promise and power and, as such, should be
    approached thoughtfully and carefully.


    ## Don’t Trade Tokens Unless You Know What You’re Doing

    Cryptocurrencies are very volatile and will swing wildly in value at any given
    time and sometimes for no discernable reason. Many of the cryptocurrencies have
    little depth, and trading large amounts can crash the market value. Working with
    published blockchains means that you’ll likely need to hold some amount of the
    currency to utilize them.


    Don’t get caught up in trading the tokens unless you take the time to understand
    the market well. If you do choose to trade the tokens, don’t forget to report
    this activity to your CPA. You may need to report your gains or loses on your
    income tax return.


    Chapter 19


    # Ten Top Blockchain Projects


    IN THIS CHAPTER


    ![check](Image00001.jpg)**Diving into novel blockchain initiates**


    ![check](Image00001.jpg)**Discovering global blockchain implementations**


    New blockchain startups are emerging every day. Entrepreneurs have seen opportunities
    to capitalize on the very powerful tools blockchains offer to move money faster,
    secure computer systems, and build digital identities.


    In this chapter, I introduce you to some of my favorite projects and companies.
    After reading this chapter, you’ll have an idea of some of the amazing things
    happening within the blockchain software space. You may even get some ideas about
    what you could do yourself!


    ## The R3 Consortium

    Many banks have invested in building blockchain prototypes — many for Know Your
    Customer (KYC) requirements for anti-money laundering and prototypes for reducing
    the cost of exchanging money. They have to overcome several challenges, including
    the security of private information and the regulatory gray zone of cryptocurrencies.


    R3 (`www.r3cev.com`) is an innovative company that has built a consortium with
    more than 75 of the world’s leading financial institutions to integrate and take
    advantage of new blockchain technology. R3 is improving cross-border exchange,
    lowering the cost of auditing, and improving the speed of interbank fund transfer
    and settlement.


    R3’s three pillars are as follows:

    * **Financial-grade blockchain:** R3 has developed the base layer technology that
    supports a global financial institution’s needs.

    * **Research and development:** R3 has created a bilateral research center that
    is testing and creating industry standards for commercial-grade blockchain technology.

    * **Product development:** R3 works in close collaboration with institutions to
    create products that solve problems up and down the value chain.


    R3 has developed a blockchain platform for financial institutions called Corda.
    Corda is a distributed ledger platform designed to manage and synchronize financial
    agreements between regulated financial institutions. Unlike most blockchains that
    broadcast their transactions to the whole network, transactions may execute in
    parallel, on different nodes, without either node being aware of the other’s transactions.
    The history of the network is on a need-to-know basis.


    Key features of Corda include the following:

    * **Controlled access:** Only parties with a legitimate need to know can see the
    data.

    * **No central controller.**

    * **Regulatory and supervisory observer nodes.**

    * **Validation by parties to the transaction rather than a broader pool of unrelated
    validators.**

    * **Support for a variety of consensus mechanisms.**

    * **No native cryptocurrency.**


    ## T ZERO: Overstocking the Stock Market

    T ZERO is a platform that integrates blockchain technology with existing market
    processes to reduce settlement time and costs and increase transparency, efficiency,
    and auditability. T ZERO is able to do this because it’s modular and adaptable.


    T ZERO is a subsidiary of Overstock.com, focusing on the development and commercialization
    of fintech-based technologies based on cryptographically secured, decentralized
    ledgers. Since its inception in October 2014, T ZERO (`www.t0.com`) has established
    working commercial blockchain products.


    It partnered with Keystone Capital Corporation, an independent broker-dealer located
    in California to create the first public issuance of blockchain equities. Together
    they provide brokerage services for users that trade blockchain securities.


    Patrick Byrne, Overstock’s founder and CEO, led this initiative. The opaque business
    practices of Wall Street have opened up market opportunities for a clear and trustworthy
    trading platform where consumers know what they’re buying and the costs involved.
    The SEC declared parent company Overstock.com’s S-3 filing effective, giving Overstock.com
    the ability to issue blockchain shares in a public offering. It also partnered
    with the Industrial and Commercial of Bank of China (ICBC), the world’s largest
    bank, to test the platform.


    Byrne achieves this through Medici, Overstock.com’s majority-owned financial technology
    subsidiary. Medici focuses on applying blockchain technology to solving significant
    financial transaction problems. Its first initiative is to clean up securities
    settlement.


    ## Blockstream’s Distributed Systems

