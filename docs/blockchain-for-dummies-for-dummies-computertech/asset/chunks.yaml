- raw: "Furthermore, the Cortana learning tool is secure and scalable. Cortana offers\
    \ data value, irrespective of the complexity and size of the data. And, most of\
    \ all, Cortana allows you to interact with smart agents, so that you can get closer\
    \ to your consumers in more natural, practical, and useful ways. The Cortana Intelligence\
    \ Suite is helpful in various sectors, including manufacturing, financial services,\
    \ retail, and healthcare.\n\n### Visualizing your data with Power BI\n\nPower\
    \ BI, which is offered by Microsoft, is a powerful service based on the cloud\
    \ system. It covers the latest business intelligence services and tools of Microsoft.\
    \ This service assists data scientists in envisioning and sharing insights from\
    \ the data of their organizations.\n\n The Power BI data visualization course,\
    \ which is provided online by edX, is part of the Microsoft Professional Program\
    \ Certificate in Data Science. This cloud-based service is rapidly gaining popularity\
    \ among data science professionals.\n\nPower BI helps you to visualize and connect\
    \ your data. In this course, students learn how to connect, import, transform,\
    \ and shape their data for business intelligence. Additionally, the Power BI course\
    \ teaches you how to create dashboards and share them with business users on mobile\
    \ devices and the web.\n\n### Managing your access on Azure’s Active Directory\n\
    \nAzure Active Directory (AD) is a broad access and identity management solution.\
    \ It provides a wide set of facilities, which allow you to supervise access to\
    \ cloud and on-premises resources and applications. This includes various Microsoft\
    \ online services, such as Office 365, in addition to numerous non-Microsoft SaaS\
    \ applications.\n\nOne of the main features of Azure AD is that you can handle\
    \ access to its resources. These resources can be external to the directory, like\
    \ Software as a Service (SaaS) applications, on-premises resources or SharePoint\
    \ sites, and Azure services, or they can be internal to the directory, such as\
    \ permissions for managing objects through directory roles.\n\nChapter 11\n\n\
    # Getting Busy on IBM Bluemix\n\nIN THIS CHAPTER\n\n![check](Image00001.jpg)**Preparing\
    \ for artificial intelligence blockchain apps**\n\n![check](Image00001.jpg)**Building\
    \ your IBM Fabric**\n\n![check](Image00001.jpg)**Creating smart contracts**\n\n\
    ![check](Image00001.jpg)**Deploying an Internet of Things solution**\n\nIn this\
    \ chapter, I introduce you to IBM’s blockchain initiatives, which IBM is merging\
    \ with its other groundbreaking technologies, such as Bluemix, a full Platform\
    \ as a Service (PaaS) for application building, and Watson, its super computer.\n\
    \nBlockchain technology creates a near-frictionless value exchange. Artificial\
    \ intelligence accelerates the analysis of massive amounts of data. The merging\
    \ of the two capabilities will be a paradigm shift that affects the way we do\
    \ business and secure our connected electronic devices.\n\nIf you’re involved\
    \ in the Internet of Things (IoT), healthcare, warehousing, transportation, or\
    \ logistics industries, you will benefit from the information in this chapter.\
    \ Also, if you’re an entrepreneur and would like to learn about the new capabilities\
    \ that come with the integration of artificial intelligence (AI) and blockchain\
    \ on a scalable app platform, this chapter is for you.\n\n## Business Blockchain\
    \ on Bluemix\n\nIBM is now offering blockchain technology that integrates with\
    \ its traditional offerings, such as IBM Bluemix. Bluemix is an open-standards,\
    \ cloud-based PaaS for building and managing applications. IBM has integrated\
    \ a blockchain stack  from Hyperledger, which is part of the Lynx foundation and\
    \ is establishing best practices in blockchain technology.\n\nYou’ll want to prepare\
    \ for rapid and fundamental changes within IBM’s blockchain initiatives. The technology\
    \ is very new and still under incubation, both within IBM and Hyperledger.\n\n\
    Hyperledger has several different subprojects in development. As of this writing,\
    \ IBM is using Fabric, but it may open up Bluemix to other projects. Fabric is\
    \ open source and under active development within Hyperledger. It’s not quite\
    \ ready for commercial purposes — as of this writing, it’s in incubation status.\n\
    \nYou can start testing Fabric on Bluemix by using Hyperledger Fabric v0.6. However,\
    \ IBM warns against running any valuable transactions directly on Fabric v0.6\
    \ or any earlier version.\n\n### Your isolated environment\n\nBluemix is the newest\
    \ cloud offering from IBM. It’s an implementation of IBM’s open cloud architecture\
    \ based on Cloud Foundry, an open-source PaaS.\n\nBluemix enables you to rapidly\
    \ and easily come up with applications, deploy them, and manage them. Bluemix\
    \ offers enterprise-level services that can integrate with applications without\
    \ needing to know how to install or to configure them.\n\n[Figure 11-1](#text00016.html#c11-fig-0001)\
    \ shows how IBM relates different aspects of blockchain and IBM systems. You can\
    \ find out more at [ `https://goo.gl/12Q6no` ](https://goo.gl/12Q6no) .\n\n![\
    \ FIGURE 11-1:  How IBM Bluemix and IoT are merged with IBM Watson.](Image00027.jpg)\n\
    \n [FIGURE 11-1:](#text00016.html#rc11-fig-0001)  How IBM Bluemix and IoT are\
    \ merged with IBM Watson.\n\nIBM Bluemix provides four core things:\n\n*   Computing\
    \ infrastructure based on your apps’ architectural needs\n\n*   The ability to\
    \ deploy apps to a Bluemix public or dedicated cloud\n\n*   Dev tooling, such\
    \ as code editors and managers\n\n*   Access to third-party open-source tools\
    \ in their service section\n\nBluemix gives you everything you need to build your\
    \ app. It’s now offering blockchain infrastructure to test as well.\n\nThey have\
    \ a service for integrating your applications with the Bluemix blockchain. As\
    \ of this writing, there are two pricing models. A free account gets you what\
    \ you need to test your idea. You get four peers and a cert authority to sign\
    \ transactions, as well as a dashboard with logs, controls, and APIs. You also\
    \ get a few sample apps with source code to experiment with.\n\n The enterprise\
    \ plan is priced at $10,000 a month and offers higher security and speed than\
    \ the free model.\n\n### Bluemix use cases\n\nTwo remarkable entrepreneurial pioneers\
    \ are using Bluemix and the Hyperledger Fabric integration:\n\n*   **Wanxiang:**\
    \ The largest China-based automotive components company, Wanxiang is working with\
    \ IBM to deploy a private blockchain. They’re embedding property rights into things\
    \ like electric cars. The goal is to reduce the costs to consumers for leasing\
    \ equipment. Wanxiang will use its blockchain technology to track the lifespan\
    \ of the components and refurbish used batteries. Bluemix will take care of everything\
    \ else.\n\n*   **KYCK!:** The financial technology (fintech) startup KYCK! is\
    \ utilizing IBM’s blockchain integration as a novel way to address “know your\
    \ customer” (KYC) needs for brokerages. This expense is limiting and costly for\
    \ banks and other financial services. KYC is done to prevent money laundering\
    \ and illicit trade, and to combat terrorism. KYCK! is building a video conference\
    \ and encrypted document submissions platform. It will allow brokers to work with\
    \ and authenticate clients the company has not met in person.\n\n IBM has also\
    \ built out three simple Chaincode applications that let you play with the IBM\
    \ Blockchain network:\n\n*   **Marbles:** Marbles is an application that demonstrates\
    \ transferring marbles between two users. It lets you see how you can move assets\
    \ on a blockchain.\n\n*   **Commercial Paper:** Commercial Paper is a blockchain\
    \ trading network implemented on IBM Blockchain. You can create new commercial\
    \ papers to trade, buy and sell existing trades, and audit the network.\n\n* \
    \  **Car Lease:** Car Lease is a lot like the Marbles demo. It’s designed to allow\
    \ you to interact with assets. You can create, update, and transfer. It also allows\
    \ a third party to view the history.\n\n## Watson’s Smart Blockchain"
