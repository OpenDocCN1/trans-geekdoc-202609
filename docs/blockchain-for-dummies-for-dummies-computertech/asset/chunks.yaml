    ![tip](Image00003.jpg) The security landscape will constantly be evolving with
    new bugs. Reviewing all new best practices is imperative. Manage the amount of
    money you’re putting at risk and roll out contracts slowly and in phases. Ethereum
    is a new technology, and mature solutions are not yet built.


    ## Building smarter smart contracts

    Smart contract programming requires a different mind-set than standard contract
    writing. There is no third party to make things right if the contract executes
    in a way that you didn’t expect or intend. The immutable and distributed nature
    of blockchains makes it tough to change an unwanted outcome.


    ![remember](Image00004.jpg) Your contract will have flaws and may fail. Build
    safety valves into your contracts so you can respond to bugs and vulnerabilities
    as they come up. Smart contracts also need an off switch that let you pull the
    plug and pause your contract when things are going wrong.


    ![tip](Image00003.jpg) If your contract is big enough, offer bug-hunting bounties
    that incentivizes the community to find vulnerabilities and flaws in your contract.


    As with many things, the complexity of your contract also increases the likelihood
    of errors and attack vectors. Keep your contract logic simple. Build out small
    modules that hold each section of the contract. Creating a contract in this manner
    will help you compartmentalize any issues.


    ## Finding bugs in the system

    Don’t reinvent the wheel by building your own tools such as random number generators.
    Instead, leverage the work that the community has already done and that has been
    well tested.


    ![warning](Image00006.jpg) You can only control for things within your own contract.
    Be cautious of external contract calls. They can execute malicious code and take
    away your control.


    The Ethereum community has an excellent known bug list and even more helpful tips
    on how to build secure smart contracts on its GitHub page at [`https://github.com/ethereum/wiki/wiki/safety`](https://github.com/ethereum/wiki/wiki/safety).


    Chapter 6


    # Regarding the Ripple Blockchain


    ### IN THIS CHAPTER

    ![check](Image00001.jpg) **Looking at the origins of the Ripple blockchain**


    ![check](Image00001.jpg) **Getting to know the Ripple blockchain**


    ![check](Image00001.jpg) **Exploring the Ripple network**


    Ripple is the one of the most interesting blockchains for moving and trading value
    globally. The Ripple protocol allows for the fungibility of any type of asset
    — even between two unlike assets and in nonliquid markets. It does all this at
    extremely low cost, with exceptionally high security, and in record time. The
    Ripple infrastructure is being implemented as the framework for new modern banking
    and trading.


    This chapter looks at the important nuances of the technology behind the Ripple
    blockchain. I explain the finer point of how Ripple is revolutionizing banking
    and fintech globally. I also fill you in on the practical uses of the Ripple blockchain
    and specific safety tips for working with Ripple protocol.


    This chapter prepares you to trade many different types of value globally. Here,
    you discover why this technology is important for your industry and how to get
    started using the Ripple protocol today. You also find out how to set up an account
    that trades on the Ripple protocol and scams to avoid when operating in this ecosystem.


    ![tip](Image00003.jpg) If you aren’t looking for a large-scale solution for a
    corporation that is exempt or can obtain a banking license, you may want to skip
    this chapter because Ripple primarily servicing financial institutions.


    ## Getting a Brief History of the Ripple Blockchain

    The Ripple project is older than Bitcoin. It has gone through several iterations,
    but the original implementation was created by the Canadian developer Ryan Fugger
    in 2004. Fugger’s first iteration was a decentralized monetary system that allowed
    individuals and communities to set up their own money.


    Jed McCaleb, Arthur Britto, and David Schwartz later add to Ryan’s work through
    a company called OpenCoin. Their work helped add more blockchain-like features
    such as a digital currency system in which transaction chains are published by
    consensus among members of the network.


    Chris Larsen, the first CEO of Ripple, was the founder of several companies including
    E-Loan and Prosper, both of which were disruptive organizations that changed the
    consumer lending market. He joined Ripple in August 2012 and led it until 2016.


    Ripple has since grown to be a large venture-backed startup. It has some of the
    biggest names in the investing world backing them, Google Ventures and Andreessen
    Horowitz just to name a few. As of 2016, Ripple had raised more than $93 million
    in venture funding. Ripple is also politically active and sits on the Federal
    Reserve’s Faster Payments Task Force Steering Committee and co-chairs the W3C’s
    Web Payments Working Group. It has offices in San Francisco, New York, London,
    Luxembourg, and Sydney. Many of the founding team have since left Ripple and started
    new projects.


    Ripple has been very disruptive in the banking industry and has seen substantial
    pushback for its efforts. In 2015, FinCEN fined Ripple $700,000 for Secrecy Act
    violations. The fine was for selling XRP to Roger Ver, a well-known Bitcoin investor,
    and failing to file a suspicious activities report because Ver has a felony conviction
    for selling fireworks on eBay. After the fine, DBS Bank and the Oversea-Chinese
    Banking Corporation Limited began refusing banking services to Ripple Singapore.
    It is believed that this happened because these banks felt that issuing assets
    on blockchains posed more regulatory risk than reward for them. Since then, Ripple
    has shifted its focus to primarily serving global and regional banks.


    Today Ripple is a global financial settlement solution that enables banks and
    consumers to exchange value. Similar to Bitcoin, the Ripple protocol lowers the
    total cost of settlement by allowing users to transact directly and instantly.
    It’s built on a distributed open-source Internet protocol, uses a blockchain,
    and has a native currency called *ripples.*


    Ripple’s distributed financial technology enables users to send real-time international
    payments across its networks. Using Ripple, global markets can meet demand for
    fast, low-cost, and on-demand global payment services.


    Ripple is particularly good at cross-border payments and exchanging value between
    two unlike things. Ripple has created a global network of financial institutions,
    market makers, and consumers. You can now exchange just about any type of value
    anywhere in the world and instantly. Ripple is the new foundation for the *Internet
    of Value.* The idea behind the Internet of Value is that value such as money,
    cars, land, and commodities can all live and be traded completely online and without
    intermediaries that facilitate the process. Protocols, such as Ripple, facilitate
    the trade and fill in the role of intermediary.


    ## Ripple: It’s All About Trust

    Ripple is an exchange network and a trading platform with a blockchain backend.
    Institutions use the protocol to clear transactions through Ripple’s distributed
    ledger. They can also settle obligations through Ripple’s distributed funds exchange.


    There are two main ways to interact on the Ripple network:

    *   The financial users of the system participate in the network by issuing, accepting,
    and trading assets to facilitate payments.

    *   The node operators participate in the network by keeping track of transactions
    and coming to consensus about the validity and ordering of those transactions
    with the other nodes in the network.


    ![tip](Image00003.jpg) The terms *node* and *computer* are often used interchangeably.
    Both terms refer to the machines and code that are used to run the network.

