  trans: '

    区块链技术并没有消除对音乐厂牌和分销商的需求。然而，如果他们不想被适应这种更高效模式的新公司取代，就需要迅速行动，就像 Netflix 打破了 Blockbuster
    一样。


    # 第 5 部分

    ## 十项精华部分

    本部分内容 …

    发现十个免费的区块链资源，帮助你跟上技术和行业的发展。

    在加密货币和区块链世界工作时，识别十条永远不应违反的规则。

    了解更多关于塑造行业未来的十大区块链项目和组织的信息。


    ### 第 17 章

    #### 十个免费的区块链资源

    本章内容

    ![check](img/Image00001.jpg)**发现免费的区块链教育资源**

    ![check](img/Image00001.jpg)**参与区块链社区**

    ![check](img/Image00001.jpg)**及时了解最新的区块链新闻**

    ![check](img/Image00001.jpg)**加深对其他区块链资源的了解**

    本章中，我概述了区块链生态系统中的有趣免费资源，这些资源将帮助你保持信息灵通并参与社区。在这里，你可以找到用于创建 *oracles*（允许智能合约执行的数据源）的免费工具、扩展你知识的视频，以及正在塑造行业未来的组织。


    ##### Factom University

    Factom, Inc. 是一家为 Factom 开源网络提供服务的区块链公司。它为大型企业和政府构建定制的区块链应用。它还为美国抵押贷款行业构建了区块链即服务产品。

    Factom University ( [ `www.factom.com/university` ](http://www.factom.com/university)
    ) 由 Factom, Inc. 创建，是一个不断增长的知识库，旨在向个人教授区块链技术、Factom 平台和 API。它由视频和教程组成，可将你从新手带到专家。Factom
    University 计划推出证书课程，敬请期待！


    ##### Ethereum 101

    Ethereum 是一个开源众筹项目，构建了以太坊区块链。它是该领域最重要的项目之一，因为它开创了在区块链内构建编程语言的先河。由于其内置的编程语言，以太坊网络允许你创建智能合约、创建去中心化组织并部署去中心化应用。

    Ethereum 101 ( [ `www.ethereum101.org` ](http://www.ethereum101.org) ) 是由以太坊社区成员发起的网站。它是关于区块链技术和以太坊网络的高质量教育内容的精选存储库。以太坊社区总监
    Anthony D’Onofrio 负责监督该项目。


    ##### Build on Ripple

    Ripple 提供全球金融结算解决方案。其分布式结算网络基于任何人皆可使用的开源技术构建。Ripple 警告称，其区块链功能仅应由持牌金融机构使用。

    Ripple 已为在其平台上构建开发了强大的知识库（ [ `www.ripple.com/build` ](http://www.ripple.com/build)
    ）。该知识库主要面向开发者。Ripple 还为金融监管机构提供一些资源。即使你不是监管者，也值得一读，因为它提供了区块链技术带来的法律责任方面的一些见解。


    ##### Programmable Money by Ripple

    Steven Zeiler 是 Ripple 的员工，他制作了一系列 YouTube 视频，讲解如何使用 JavaScript 在 Ripple 网络上创建可编程货币。该系列面向
    JavaScript 程序员。截至本文撰写时，有十个视频将指导你完成开发过程。请在 [ `https://goo.gl/g8vFPL` ](https://goo.gl/g8vFPL)
    查看该 YouTube 系列。


    ##### DigiKnow

    DigiByte 是一个受比特币启发的去中心化支付网络。它允许你通过互联网转移资金，并提供比比特币更快交易和更低费用。该网络也对希望挖掘其原生代币的人开放。

    DigiByte 的创始人 Jared Tate 在 YouTube 上创建了一个名为 DigiKnow 的视频系列，教你几乎所有使用 DigiByte 所需的知识。以下是他第一部视频的链接，其中他向你讲解区块链的工作原理基础以及
    DigiByte 网络如何创造价值： [ `https://youtu.be/scr6BzFddso` ](https://youtu.be/scr6BzFddso)
    。


    ##### Blockchain University

    Blockchain University 是一个教育网站，向开发者、经理和企业家教授区块链生态系统。它提供公共和私人培训项目、黑客松和演示活动。其项目以解决方案导向的设计思维和实践体验培训为特色。你可以在加利福尼亚州山景城找到
    Blockchain University，或访问 [ `http://blockchainu.co` ](http://blockchainu.co) 。


    ##### Bitcoin Core

    Bitcoin Core ( [ `https://bitcoin.org` ](https://bitcoin.org) ) 最初由中本聪用来托管其关于比特币协议的白皮书。它是比特币核心协议教育材料和原始比特币软件可下载版本的所在地。

    该网站致力于保持比特币的去中心化和对普通人的可访问性。

    ![remember](img/Image00004.jpg)它是一个社区运营的项目，并非所有内容都由核心团队管理。在浏览该网站时请牢记这一点。


    ##### Blockchain Alliance

    Blockchain Alliance 由 Blockchain Chamber of Digital Commerce 和新闻组织 Coincenter
    创立。它是区块链社区、执法机构和监管机构之间的公私合作。他们共同的目标是使区块链生态系统更安全并促进技术进一步发展。他们通过提供教育、技术援助以及关于比特币和其他数字货币以及使用区块链技术的相关定期信息会议来打击区块链上的犯罪活动。

    你可以在 [ `www.blockchainalliance.org` ](http://www.blockchainalliance.org) 了解更多关于他们的活动或加入他们的组织。


    ##### Multichain Blog

    Multichain 是一家帮助组织快速在区块链上构建应用的公司。他们提供一个平台，可在私有区块链上发行数百万种资产，你也可以通过他们的工具跟踪和验证网络上的活动。除了其工具集和平台之外，他们还在区块链领域具有思想领导力。

    这些是我最喜欢的他们博客（ [ `www.multichain.com/blog` ](http://www.multichain.com/blog) ）的文章：

    * 四个真正的区块链用例（ [ `www.multichain.com/blog/2016/05/four-genuine-blockchain-use-cases/`
    ](http://www.multichain.com/blog/2016/05/four-genuine-blockchain-use-cases/) ）

    * 谨防不可能的智能合约（ [ `www.multichain.com/blog/2016/04/beware-impossible-smart-contract/`
    ](http://www.multichain.com/blog/2016/04/beware-impossible-smart-contract/) ）

    * 智能合约与 DAO 爆炸（ [ `www.multichain.com/blog/2016/06/smart-contracts-the-dao-implosion/`
    ](http://www.multichain.com/blog/2016/06/smart-contracts-the-dao-implosion/) ）

    * 理解零知识区块链（ [ `www.multichain.com/blog/2016/11/understanding-zero-knowledge-blockchains/`
    ](http://www.multichain.com/blog/2016/11/understanding-zero-knowledge-blockchains/)
    ）


    ##### HiveMind

    Paul Sztorc 创立了 Truthcoin，这是一个点对点预言机系统和比特币的预测市场。它利用存储预测市场状态数据的权益证明侧链。比特币可以通过 HiveMind
    支持金融衍生品和智能合约，HiveMind 是在 Truthcoin 白皮书基础上开发的平台。请在 [ `http://bitcoinhivemind.com`
    ](http://bitcoinhivemind.com) 查看他们的资源和教育材料。


    ### 第 18 章

    #### 区块链上永远不应打破的十条规则

