- raw: "CryptoDelegates allow Utility and Contract Cryplets to function. They act\
    \ as adaptors by creating functional hooks in your smart contract virtual machines.\
    \ They call the Cryptlet from the code of your smart contract, which in turn creates\
    \ a secure and authentic envelope for transactions.\n\n## Building in the Azure\
    \ Ecosystem\n\nAzure is a digital ecosystem and cloud computing platform. It connects\
    \ enterprises directly with their cloud partners and SaaS. This, in turn, allows\
    \ enterprises to transfer their data in an interconnected, reliable, and secure\
    \ way.\n\nThe Azure cloud platform of Microsoft is the second biggest Infrastructure\
    \ as a Service (IaaS) platform. It’s a reliable and safe haven for your cloud\
    \ computing and data storage. In Azure, there is a service known as ExpressRoute,\
    \ which provides consumers a way to directly connect to Azure. This, in turn,\
    \ prevents the performance and security issues that are widely seen in the public\
    \ Internet.\n\nIn 2015, Microsoft decided to expand its Azure ecosystem using\
    \ the Ethereum and Hyperledger blockchain systems. The first offering of Azure\
    \ Blockchain as a Service is powered by Ethereum. Ethereum is a Turing-complete\
    \ blockchain framework for build applications. Microsoft aims to build more offerings\
    \ based on the blockchain technology and Hyperledger. It’s also growing the Azure\
    \ marketplace, while transitioning to a portal for customers on Azure.\n\nMicrosoft’s\
    \ Azure Stack program incorporates Azure Quickstart Templates, which deploy the\
    \ various Azure resources with the help of the Azure Resource Manager in order\
    \ to help you get more work done. The Azure Resource Manger allows customers to\
    \ work with their business resources as a group. It enables them to deploy, delete,\
    \ or update all the resources in their solution in a coordinated and single operation.\n\
    \n Azure Quickstart Templates can work for various environments, like production,\
    \ staging, and testing. Through Azure Resource Manager, customers get several\
    \ features for tagging, auditing, and security. These features help consumers\
    \ to manage their resources after deployment.\n\nMicrosoft’s Project Bletchley\
    \ is their blockchain architecture that is merged with established enterprise\
    \ technologies they were already offering. It gives Azure a blockchain backend\
    \ and marketplace.\n\nBletchley’s ecosystem is an approach taken by Microsoft\
    \ in order to bring forward blockchain or distributed ledger networks to a wider\
    \ audience in a safe and effective manner. They want to help build authentic solutions\
    \ and address actual business problems.\n\n## Getting Started with Chain on Azure\n\
    \nChain, which provides blockchain technology solutions, released its Chain Core\
    \ Developer Edition on Azure. Chain Core Developer Edition is an open-source and\
    \ free version of the company’s distributed ledger platform. It enables you to\
    \ issue as well as transfer assets on authorized blockchain networks.\n\nThrough\
    \ its test net, your developers can join or start a blockchain network, access\
    \ in-depth technical tutorials and documentation, and build financial applications.\
    \ They can also run their own prototypes on the Chain’s test net or create their\
    \ own personal network on Azure.\n\n### Installing Chain’s distributed ledger\n\
    \nChain Core Developer Edition accompanies code samples, a Java SDK, and getting-started\
    \ guides. In addition, it comes with a dashboard interface and installers for\
    \ Linux, Mac, and Windows.\n\nFollow these steps to install your Chain Core Developer\
    \ Edition:\n\n1.  **Navigate to Chain’s install page at** [ `https://chain.com/docs/core/get-started/install`\
    \ ](https://chain.com/docs/core/get-started/install) **.**\n\n2.  **Choose your\
    \ operating system from the list.**\n\n3.  **Click Download.**\n\n4.  **Open the\
    \ Chain program.**\n\n5.  **Run the Chain Core installer.**\n\nChain has an SDK\
    \ available that gives you and your developer the software development tools that\
    \ allows the creation of blockchain applications and assets.\n\n### Creating your\
    \ own private network\n\nYou can create a private Ethereum Consortium Blockchain\
    \ network in Azure. You should be able to do this on your own without the help\
    \ of a developer. Just follow these steps:\n\n1.  **Sign up for or log into your\
    \ Azure account.**\n\n    There is a free trial option and a pay-as-you-go option\
    \ that make it easy to try out Azure.\n\n2.  **Go to** [ `https://goo.gl/Ixu5of`\
    \ ](https://goo.gl/Ixu5of) **.**\n\n3.  **Click Deploy to Azure.**\n\n    ![warning](Image00006.jpg)Azure\
    \ Resource Manager templates are created by members of the Azure community. Microsoft\
    \ doesn’t screen for security, compatibility, or performance.\n\n4.  **Complete\
    \ the form.**\n\n5.  **Click Purchase.**\n\nCongratulations! You now have a private\
    \ Ethereum Consortium Blockchain network.\n\n### Using financial services on Azure’s\
    \ Chain\n\nChain launched its open-source and free developer platform. It includes\
    \ a test network, which is operated by Microsoft, Chain, and the Initiative for\
    \ Cryptocurrencies and Contracts (3CI). 3CI is the platform launched by Chain,\
    \ which provides blockchain technology solutions and is Chain Core Developer Edition.\n\
    \nThis platform enables you to issue as well as transfer assets on authenticated\
    \ blockchain networks. It’s an effort among leading financial companies and Chain.\
    \ Various financial applications can be developed via Chain Core.\n\nMany new\
    \ innovative products are planned to be launched on this platform. The range covers\
    \ payments, banking, insurance, and capital markets. Additionally, Visa has partnered\
    \ with Chain in order to develop a secure, fast, and simple way to process business-to-business\
    \ (B2B) payments worldwide.\n\n## Deploying Blockchain Tools on Azure\n\nAzure\
    \ has several other useful implementations of blockchain technology and tools\
    \ that you might find useful. I cover four of Azure’s core blockchain tools and\
    \ projects in this section, including its Ethereum implementation; Cortana, an\
    \ analytics machine learning tool; Azure’s data visualization tool, Power BI;\
    \ and its Active Directory (AD) tool. The last three are not specifically blockchain\
    \ tools, but they can be used with your Azure blockchain project.\n\nThis section\
    \ gives you an idea of what you can build with Azure and some of the tools available\
    \ to make your project a success.\n\n### Exploring Ethereum on Azure\n\nEthereum\
    \ Blockchain is now available as a service on Microsoft’s Azure platform. This\
    \ initiative is offered by ConsenSys and Microsoft in partnership. Solidity is\
    \ a new project that they created that allows you to start building your decentralized\
    \ application on Ethereum. Find out more at [ `https://marketplace.visualstudio.com/items?itemName=ConsenSys.Solidity`\
    \ ](https://marketplace.visualstudio.com/items?itemName=ConsenSys.Solidity) .\n\
    \nEthereum Blockchain as a Service (EBaaS) enables enterprise developers and clients\
    \ to develop a blockchain environment on the cloud and can be spun up with one\
    \ click.\n\n When you’re deploying Ethereum blockchain on Azure, Azure offers\
    \ two tools initially:\n\n*   **BlockApps:** A semiprivate and private Ethereum\
    \ blockchain environment\n\n*   **Ether.Camp:** A built-in developer environment\n\
    \nBlockApps can also be deployed into the public environment of Ethereum. These\
    \ tools allow rapid development of applications based on a smart contract.\n\n\
    Ethereum is a flexible and open system, which can be customized to meet the varied\
    \ needs of customers. Read more about Ethereum in [Chapter 5](#text00009.html#a1)\
    \ .\n\n### Cortana: Your analytics machine learning tool\n\nCortana is a powerful\
    \ analytics machine learning tool based on cloud systems. It’s a fully managed\
    \ cloud service that enables users to easily and quickly build, organize, and\
    \ share predictive analytics solutions. It provides many benefits to consumers.\n\
    \nBy reviewing the analytics provided by Cortana Intelligence, you can take action\
    \ sooner than your competitors by predicting the next big thing. This flexible\
    \ and fast software allows you to build quick solutions for your industry, which\
    \ are tailored to your particular needs."
