- raw: "The DigiByte team believes that DiguSign will be very valuable to lawyers,\
    \ healthcare providers, and in financial services arenas where it’s important\
    \ to keep a clear version history for contracts and a clear established time line\
    \ on what documents were provided when and to whom.\n\n![tip](Image00003.jpg)You\
    \ may be able to link your DiguSign account to your cloud storage providers, such\
    \ as Google Docs, Dropbox, and OneDrive. Until then, each document must be individually\
    \ uploaded to DiguSign. DiguSign has a free testing version for this service that\
    \ allows you to create three free blockchain-backed documents or contracts.\n\n\
    DiguSign is still in early testing, but it already allows you to store, unofficially\
    \ notarize, and validate digital documents.\n\n![technicalstuff](Image00005.jpg)DiguSign\
    \ publishes a SHA256 hash of your document by embedding the hash into a DigiByte\
    \ blockchain transaction. That transaction is then secured in the DigiByte blockchain.\n\
    \nTo set up your account, follow these steps:\n\n1.  **Go to** [ `www.digusign.com`\
    \ ](http://www.digusign.com) **and sign up for a DiguSign account.**\n\n2.  **Upload\
    \ your document to DiguSign.**\n\n    You’re given the option for creating a document\
    \ or contract template.\n\n3.  **Choose the option to create a document.**\n\n\
    4.  **Configure all the required signatures and other fields on your document.**\n\
    \n5.  **Enter the emails of the individuals whom you would like to e-sign your\
    \ document.**\n\n6.  **Select the Secure Final Version option.**\n\n    When all\
    \ parties have signed the document, you need to send the final version to the\
    \ DigiByte blockchain by clicking Secure Final Version.\n\nYou’ve created a near\
    \ permanent fingerprint of your document that you can reference at any time.\n\
    \n## Earning DigiBytes While Gaming\n\nDigiByte has made the connection between\
    \ the gaming community’s affinity for digital tokens and blockchain technology.\
    \ Gamers are familiar with using digital currencies within games, so the DigiByte\
    \ team believes that it’s an easy jump to utilize its cryptocurrency token as\
    \ a way to incentivize user engagement.\n\nDigiByte has set up options to earn\
    \ DigiByte tokens by playing games such as Counter Strike, League of Legends,\
    \ and World of Warcraft. The awards are provided through sponsorships by gaming\
    \ companies and do not draw on a user’s GPU power to mine.\n\nDigiByte has created\
    \ an interesting opportunity for gaming companies to build in added incentive\
    \ models to gain new players and retain existing ones. It has also found a clever\
    \ way for gamers to translate the prizes they win in a digital world into money\
    \ they can spend in the physical world.\n\nYou can earn DigiBytes through the\
    \ DigiByte gaming website. Every day, DigiByte offers multiple Quests that give\
    \ you the opportunity to gain what are called *XP.* XP then translate into DigiBytes\
    \ at a set daily rate. You can play World of Warcraft or any of the other games\
    \ offered, and get paid DigiBytes for playing.\n\nThen you can trade the DGB token\
    \ on exchanges, such as Poloniex, for Bitcoin. And you can easily turn Bitcoin\
    \ into other currencies. There are a few layers of separation, but it’s a clear\
    \ fun path to getting paid!\n\nGetting up and running to earn DigiBytes through\
    \ gaming is fairly easy. You won’t be mining to earn tokens, but you won’t need\
    \ to open command line to get started either. Just follow these steps:\n\n1. \
    \ **Go to** [ `www.digibytegaming.com` ](http://www.digibytegaming.com) **.**\n\
    \n2.  **Create a new account.**\n\n    DigiByte allows for social login, making\
    \ it fast and easy to set up.\n\n3.  **Verify your account.**\n\n    Check your\
    \ email for the link.\n\n4.  **Go to** [ `www.battle.net` ](http://www.battle.net)\
    \ **.**\n\n    From here, you can create a profile to link to your DigiByte account.\
    \ This profile will act as a bridge between World of Warcraft and DigiByte.\n\n\
    5.  ** Set up World of Warcraft on your computer.**\n\n    If you already play\
    \ this game, you can connect your game key in this step.\n\n6.  **Return to**\
    \ [ `www.digibytegaming.com` ](http://www.digibytegaming.com) **.**\n\n7.  **Click\
    \ the World of Warcraft option.**\n\n8.  **Connect your Battle.net account.**\n\
    \n9.  **Open your World of Warcraft application and start playing.**\n\nYou’re\
    \ now earning DigiBytes while you play!\n\n Part 3\n\n# Powerful Blockchain Platforms\n\
    \nIN THIS PART …\n\nAscertain the largest business blockchain consortium, Hyperledger,\
    \ and what benefits and impact it will have for your industry and organization.\n\
    \nUnderstand Microsoft’s blockchain efforts and core tools available to you through\
    \ its network offerings.\n\nEvaluate the IBM Bluemix project and the implications\
    \ of blockchain technology combined with artificial intelligence.\n\nChapter 9\n\
    \n# Getting Your Hands on Hyperledger\n\nIN THIS CHAPTER\n\n![check](Image00001.jpg)**Exploring\
    \ four key Hyperledger projects**\n\n![check](Image00001.jpg)**Diving into the\
    \ PoET algorithm**\n\n![check](Image00001.jpg)**Discovering Chaincode smart contracts**\n\
    \n![check](Image00001.jpg)**Understanding Sumeragi**\n\nHyperledger is a community\
    \ of software developers and technology enthusiasts who are building industry\
    \ standards for blockchain frameworks and platforms. Their work is important because\
    \ they’re the main group shepherding the blockchain industry into the mainstream\
    \ and commercial adoption. Hyperledger is the “safe” deployment platform for enterprise\
    \ teams.\n\nThe organization and their unique project are growing every day. As\
    \ of this writing, they have more than 100 member companies and have several projects\
    \ in incubation. Their first few projects include Explorer, a web application\
    \ to view and query blocks, and Fabric, a plug-and-play blockchain application\
    \ builder. They also have Iroha and Sawtooth, which are modularized blockchain\
    \ platforms.\n\nIn this chapter, I explore the three key projects that are under\
    \ incubation at Hyperledger. You get a deep understanding of what the future of\
    \ commercialized blockchain will be for your company and industry. This knowledge\
    \ will help you as you explore what technologies to utilize and which to avoid,\
    \ saving you development time and resources.\n\n## Getting to Know Hyperledger:\
    \ Dreams of a Hyper Future\n\nAt the end of 2015, the Linux Foundation formed\
    \ the Hyperledger project to develop an enterprise-grade and open-source distributed\
    \ ledger framework. They hoped to focus the blockchain community on building robust,\
    \ industry-specific applications, platforms, and hardware systems to support businesses.\n\
    \nThe Linux Foundation saw that there were many different groups building blockchain\
    \ technology without a cohesive direction. The industry was duplicating effort\
    \ and the tribalism was leading teams to solve the same problem twice. The foundation\
    \ knew from its experiences that if this technology was to realize its full potential,\
    \ an open-source and collaborative development strategy was desperately needed.\n\
    \nThe Hyperledger project is led by Executive Director Brian Behlendorf, who has\
    \ decades of experience dating back to the original Linux Foundation and Apache\
    \ Foundation, as well as being a CTO of the World Economic Forum. So it’s not\
    \ surprising that Hyperledger has been well received. Many of the top business\
    \ and industry leaders have joined the project, including Accenture, Cisco, Fujitsu\
    \ Limited, IBM, Intel, J.P. Morgan, and Wells Fargo. It has also attracted many\
    \ of the top blockchain organizations.\n\nR3, a consortium supporting the banking\
    \ industry, has contributed its financial transaction architectural framework.\
    \ Digital Asset, the software company, gave the Hyperledger mark and some of its\
    \ enterprise-grade code. The Factom Foundation is also contributing enterprise-grade\
    \ code and developer resources. IBM and many other organizations are contributing\
    \ code and other resources to the project."
