- raw: "DAPPs were created to replace centralized management of assets and organizations.\
    \ This structure has a lot of appeal because many people believe that absolute\
    \ power corrupts absolutely. For those who are fearful of losing control, this\
    \ type of structure has massive implications.\n\nEtheria ( [ `www.etheria.world`\
    \ ](http://www.etheria.world) ), a Minecraft-like game, is an interesting example\
    \ of this technology at work (see [Figure 5-1](#text00009.html#c05-fig-0001) ).\
    \ The game can’t be censored or taken down and will exist as long as Ethereum\
    \ does. When things are created within Ethereum, even if there were good cause\
    \ to remove a structure or organization, it’s practically impossible to do so.\n\
    \n![ FIGURE 5-1:  The world’s first immortal digital game, Etheria.](Image00017.jpg)\n\
    \n [FIGURE 5-1:](#text00009.html#rc05-fig-0001)  The world’s first immortal digital\
    \ game, Etheria.\n\n### The power of decentralized autonomous organizations\n\n\
    DAOs are a type of Ethereum application that represents a virtual entity within\
    \ Ethereum. When you create a DAO, you can invite others to participate in the\
    \ governance of the organization. The participants can remain anonymous and never\
    \ meet, which could trigger Know Your Customer (KYC) rules (the process a business\
    \ must go through to verifying the identity of its clients) and anti-money laundering\
    \ (AML; the laws and regulations designed to stop the practice of generating income\
    \ through illegal means) compliance issues.\n\n DAOs have been created for raising\
    \ funds for investing, but they could also be designed for civic or nonprofit\
    \ purposes. Ethereum gives you a basic framework for governance. It’s up to the\
    \ organizers to determine what’s being governed. Ethereum has created templates\
    \ for you to help in the creation of DAOs.\n\n[Figure 5-2](#text00009.html#c05-fig-0002)\
    \ shows a depiction of the organization of an Ethereum application.\n\n![ FIGURE\
    \ 5-2:  Ethereum.org blockchain application depiction.](Image00018.jpg)\n\n [FIGURE\
    \ 5-2:](#text00009.html#rc05-fig-0002)  Ethereum.org blockchain application depiction.\n\
    \nHere’s how DAOs basically work:\n\n1.  A group of people writes a smart contract\
    \ to govern the organization.\n\n2.  People add funds to the DAO and are given\
    \ tokens that represent ownership.\n\n    This structure works kind of like stock\
    \ in a company, but the members have control of the funds from day one.\n\n3.\
    \  When the funds have been raised, the DAO begins to operate by having members\
    \ propose how to spend the money.\n\n4.  The members vote on these proposals.\n\
    \n5.  When the predetermined time has passed and the predetermined number of votes\
    \ has accrued, the proposal passes or fails.\n\n6.  Individuals act as contractors\
    \ to service the DAO.\n\nUnlike most traditional investment vehicles, where a\
    \ central party makes decisions about investments, the members of a DAO control\
    \ 100 percent of the assets. They vote on new investments and other decisions.\
    \ This type of structure threatens to displace traditional financial managers.\n\
    \nDAOs are built with code that can’t be changed on the fly. The appeal of this\
    \ is that malicious hackers can’t monkey with the funds in a traditional sense.\
    \ Hackers can still find ways to execute the code in unexpected ways and withdraw\
    \ funds. The immutable nature of a DAO’s code makes it nearly impossible to fix\
    \ any bugs once the DAO is live in Ethereum.\n\n## Hacking a Blockchain\n\nEthereum\
    \ has never been hacked. The hard fork in 2016 due to the DAO hack mentioned in\
    \ the “[With great power comes … great power](#text00009.html#c05-fea-0001) ”\
    \ sidebar was not an actual hack of the system, but confusingly is often referred\
    \ to as a hack. Ethereum worked perfectly. The problem was it was too perfect.\
    \ It became necessary to restart the system when a large amount of money and a\
    \ majority of its users were threatened.\n\nThe only way to correct an action\
    \ on a blockchain like Ethereum is to do a *hard fork,* which allows for a fundamental\
    \ change to the protocol. A hard fork makes previously valid blocks and transactions\
    \ invalid. Ethereum did this to protect the funds that were being pulled out of\
    \ the first DAO by a user. The DAO hack was conceptually, one of the largest bug\
    \ bounties ever.\n\nThat said, many scams and hacking attempts occur in the cryptocurrency\
    \ space. Most of these attacks target centralized exchanges and applications.\
    \ Many  hackers want to steal cryptocurrency. It has real value and isn’t protected\
    \ in the same ways that regular money is protected by governments. The anonymous\
    \ nature of cryptocurrency also makes it appealing to crooks. Catching and prosecuting\
    \ these individuals is difficult. The cryptocurrency community is fight back,\
    \ however, and creating new measures to protect themselves.\n\n![remember](Image00004.jpg)Hacking\
    \ one place is significantly easier and cheaper than trying to overcome a decentralized\
    \ network. When you read about hacking in the blockchain world, it’s likely just\
    \ a website or a cryptocurrency wallet that has been hacked, not the whole network.\n\
    \n### Understanding smart contracts\n\nEthereum smart contracts are like contractual\
    \ agreements, except there is no central party to enforce the contract. The Ethereum\
    \ protocol “enforces” smart contracts by attaching economic pressure. They can\
    \ also enforce implementation of a requirement if it lives within Ethereum, because\
    \ Ethereum can prove certain conditions were or were not met. If it doesn’t live\
    \ within Ethereum, it’s much harder to enforce.\n\n![warning](Image00006.jpg)Ethereum\
    \ smart contracts are not yet legally enforceable and may never be because the\
    \ perception is that you don’t need outside authorities enforcing agreements.\
    \ Legal systems are controlled by governments. As they stand now, governments\
    \ are central authorities — some with more or less consent and democratic principles.\
    \ Within an Ethereum smart contract, each participant has an inalienable vote.\n\
    \nEthereum smart contracts do not include artificial intelligence. This is a cool\
    \ possibility in the near future. But for now, Ethereum is just software code\
    \ that runs on a blockchain.\n\nEthereum smart contracts are not safe. The DAO\
    \ hack is a great example of the type of dangers that can occur. It is still early\
    \ days, and putting a lot of money into an unproven system isn’t smart. Instead,\
    \ experiment with small amounts until all the bugs have been worked out of new\
    \ contracts.\n\n### Discovering the cryptocurrency Ether\n\nEther is the name\
    \ of the cryptocurrency for the Ethereum blockchain. It was named after the substance\
    \ that was believed to permeate all space and make the universe possible. In that\
    \ sense, Ether is the substance that makes Ethereum possible. Ether incentivizes\
    \ the network to secure itself through proof-of-work mining, like how the token\
    \ Bitcoin incentivizes the Bitcoin network. Ether is needed to execute any code\
    \ within the Ethereum network. When utilized to execute a contract in Ethereum,\
    \ Ether is referred to as *gas.*\n\n Executing the code within a smart contract\
    \ also costs some amount of ether. This feature gives the token added utility.\
    \ As long as individuals want to use Ethereum for applications and contracts,\
    \ ether will hold a value beyond speculation.\n\nThe wild growth in the value\
    \ of ether has made it a popular token to speculate on. It’s widely traded on\
    \ exchanges around the world. Some new hedge funds are looking at it as an investment\
    \ vehicle. However, the volatile nature and low market depth make ether a risky\
    \ investment.\n\n## Getting Up and Running on Ethereum\n\nIn this section, I walk\
    \ you through how to get started in the Ethereum blockchain ecosystem. Before\
    \ you can build anything on Ethereum, you need an Ethereum wallet.\n\n![remember](Image00004.jpg)Your\
    \ wallet will hold your Ethereum tokens call *ether.* Ether is the cryptocurrency\
    \ that allows you to create smart contracts inside Ethereum. This is sometimes\
    \ referred to as *gas.*"
