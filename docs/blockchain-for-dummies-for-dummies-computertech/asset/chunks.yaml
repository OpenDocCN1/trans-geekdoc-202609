  trans: "\n# Ripple 消费者钱包关闭与 GateHub 指南\n\nRipple 已停止在其面向消费者的门户 Ripple Trade 上开设新的消费者钱包账户。在很大程度上，Ripple\
    \ 也已下架了其所有的面向消费者产品。为消费者提供服务的监管负担过重，且由金融犯罪执法网络（FinCEN）关于虚拟货币领域参与者需根据联邦法律注册为货币服务企业的要求的裁决所明确。\n\
    \n来自面向消费者门户的网络增长不会与 Ripple 的银行网络增长相匹敌。目前，Ripple 正将精力集中在为大型企业客户提供服务上。银行才是真正需要在对它们有利可图的规模上使用\
    \ Ripple 所能提供服务的机构。\n\n作为消费者，你可以通过第三方访问 Ripple。Ripple 提及的钱包是 GateHub。\n\nGateHub\
    \ 钱包存储你所有的不同货币；允许你发送资金；并允许你直接从钱包在 Ripple 网络上交易黄金、白银、XRP 和比特币。它还会在你的不同货币随市场波动时显示其净资产价值。\n\
    \nGateHub 会要求你进行身份识别，设置账户需要一些时间。当你的账户运行起来后，你将能够探索 Ripple 网络的强大功能。\n\n按以下步骤在 GateHub\
    \ 上开始使用：\n\n1. 访问 [`www.gatehub.net`](http://www.gatehub.net)。\n2. 点击注册。\n3. 输入你的电子邮件地址和密码，然后点击注册。\n\
    4. 将你的恢复密钥保存在安全的地方。\n5. 验证你的电子邮件。\n6. 验证你的身份。\n\nGateHub 会验证你的身份并要求提供电话号码、姓名、照片和支持文件。\n\
    \n在你提供个人信息后，GateHub 将审核你的账户，你即可通过 Ripple 协议进行交易。\n\n此时你可以从你的比特币钱包向新账户发送资金。\n\n\
    如果你想在 Ripple 上构建任何东西，你需要是一名程序员或至少能获得程序员的帮助。Ripple 拥有出色的文档和支持团队来帮助你入门。\n\n![warning](img/Image00006.jpg)Ripple\
    \ 的设计目的是更快、更便宜地转移资金。经济的这一领域受到非常严格的监管。Ripple 明确表示它只是能够让你执行这些任务的软件。完全由你自己来理解并遵守法规。\n\
    \n如果你仍对在 Ripple 网络上构建自定义项目感兴趣，他们会为你提供支持。开始的最佳方式是直接前往 Ripple 构建页面 ([`https://ripple.com/build/`](https://ripple.com/build/))。如果你想更深入地了解\
    \ Ripple 网络，请查看其 GitHub 上的 [`https://github.com/ripple`](https://github.com/ripple)。\n\
    \n## 谨慎使用 Ripple\n\n![remember](img/Image00004.jpg)Ripple 与其他通过加密货币运作的区块链一样，存在许多危险。在加密货币世界中工作时请使用常识，并遵循本书中描述的其他所有安全最佳实践。它确实是新的西部荒野，充满机遇与风险。\n\
    \n![warning](img/Image00006.jpg)以下是 Ripple 独有的一些风险：\n\n* **不道德交易：** 如前所述，Ripple\
    \ 的创建是为了比任何其他网络更便宜、更快地在全球范围内转移价值。Ripple 的结构采用市场集群运作。这些市场拥有受信任的节点共同确认交易。这些群体之间有时存在微小的价格差异，而这些价格差异会吸引不道德交易。\n\
    \n* **交易操纵：** 特别是 Ripple 网络，容易出现 *套利*（在不同市场同时买卖资产以利用同一资产价格差异）的情况，因为它拥有多种货币和多个市场，而精明的程序员可以操纵交易的顺序。Ripple\
    \ 上已知的两种形式如下：\n\n    * **有利的套利交易放置：** 在账本关闭前利用多个市场之间的价格差异。账本每五秒关闭一次，因此交易员使用套利机器人来利用市场。这些机器人会达成一组合适的交易，利用市场之间的微小不平衡，并将交易推入账本中的最佳位置。交易员随后通过获取这些市场价格的差额获利。\n\
    \n    * **大额交易前置：** Ripple 共识中的结构和延迟使网络暴露于一种新型的大额交易前置风险。这之所以可能，是因为网络中的每个节点都会向其他受信任节点广播交易。在此期间，机器人会监控所有交易，寻找抢在大额交易前面的机会。\n\
    \n        机器人会买下初始报价以完成大额购买，然后再以更高价格卖给原始所有者。同时，机器人还会重新定位账本中的交易以使此操作成为可能。这种行为的净结果是原始所有者在交易中获得的价值更少。\n\
    \n        ![tip](img/Image00003.jpg)你可以在 [`http://availableimagination.com/exploiting-ripple-transaction-ordering-for-fun-and-profit/`](http://availableimagination.com/exploiting-ripple-transaction-ordering-for-fun-and-profit/)\
    \ 了解更多关于此漏洞的信息。\n\nRipple 在防止漏洞进入其网络方面做得非常出色，并向程序员提供公开悬赏，通过查找错误、漏洞和安全隐患来赚取报酬。这两种漏洞在不久的将来很可能会被修复。\n\
    \n# 第 7 章 寻找 Factom 区块链\n\n本章内容\n\n![check](img/Image00001.jpg)**在 Factom 中创建条目**\n\
    \n![check](img/Image00001.jpg)**深入链结构**\n\n![check](img/Image00001.jpg)**在区块链上揭示身份**\n\
    \n![check](img/Image00001.jpg)**了解 Factom 的使用情况**\n\nFactom 区块链是一种强大的工具，将帮助行业规模化区块链技术。它与其他公共区块链不同，具有独特的属性，使其非常适合发布数据流和保护系统。Factom\
    \ 区块链背后还有一家公司——Factom, Inc.——它主导其开发并在协议之上构建工具和产品。\n\nFactom 软件正被集成到管理人和物身份和安全性的系统中。他们也在整合和连接其他区块链和区块链技术。区块链之间的链接提高了\
    \ Factom 的安全性，并使其他区块链更具互操作性。\n\n本章解释了 Factom 的工作原理，介绍了其独特属性，并提供了易于遵循的说明，帮助你开始使用它。阅读本章后，你将理解\
    \ Factom 区块链技术的许多核心概念，并了解它将在你的区块链项目中增加价值的地方。\n\n现在可能是提到我担任 Factom, Inc. 的联合创始人兼首席营销官的时候了。虽然我的目标是客观，但我对\
    \ Factom 的热情很难掩饰。\n\n## 信任问题\n\n从核心来看，区块链是关于允许不同实体在无需相互信任其数据安全或业务流程的情况下进行合作和协作。历史上，受信任的中介或行业联盟使这种情况成为可能，但它们具有高昂的运营成本，并且只是将信任转移到另一方。区块链将信任转移到一个冷漠的第三方网络，最终转移到数学上。\n"
