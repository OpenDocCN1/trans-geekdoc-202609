- raw: " The legality of all this is still in question. Determining privacy concerns\
    \ and consumer rights is difficult. The country also has its own regulations and\
    \ disclosures. However, when those regulations are met, the insurance industry\
    \ and the consumer’s experience with insurance will shift substantially.\n\n###\
    \ The new world of micro insurance\n\n*Micro insurance* is insurance to protect\
    \ low-income people against risk, such as accident, illness, and natural disaster.\
    \ It has become more feasible through blockchain technology.\n\nWhen thinking\
    \ about micro insurance, pay attention to two categories (which can go hand in\
    \ hand):\n\n*   Insurance targeted to low-income households, farmers, and other\
    \ entities where the insurance is designed around specific needs — typically,\
    \ a low-premium and index-based insurance\n\n*   Insurance that deals with low-value\
    \ products or services\n\nThe biggest issue with these types of contracts within\
    \ traditional insurance models is that their handling costs are disproportionately\
    \ high and make it unattractive to serve these markets.\n\nThe low-friction attribute\
    \ of blockchains allows them to move value at extremely low cost, nearly instantly\
    \ anywhere in the world, with no charge backs, opens up the opportunity of serving\
    \ more people and at lower costs.\n\nThe key advantage of blockchain is that the\
    \ creation of smart contracts allows for secure transactions without any middleman,\
    \ so insurance has significantly lower costs.\n\nThe blockchain micro insurance\
    \ principle is simple and consists of four steps:\n\n1.  Lending/insuring agreement\
    \ proposal\n\n    A person can offer to lend his property through his insurance\
    \ provider, if the property is digitally registered. The offer can be sent to\
    \ the potential user, either through the insurance company channels or via a public\
    \ platform such as Facebook.\n\n2.   Agreement review\n\n    The borrower can\
    \ then review the proposal that he received and accept or decline it. The offer\
    \ is kept in the public records, and if the borrower accepts the proposal, he\
    \ can purchase the insurance through standard payment channels, and the process\
    \ moves to the third step.\n\n3.  Agreement signature and notarization\n\n   \
    \ If both parties are on the same page, the insurance is paid for and the borrower\
    \ receives the property in question, the agreement is digitally signed and notarized\
    \ onto a blockchain. This makes it virtually tamper-proof. All the transaction\
    \ information is safely stored with a clear audit trail if it’s ever needed.\n\
    \n4.  Confirmation tokens\n\n    Both parties receive special digital tokens that\
    \ serve as the proof of identity for the agreement in question. These tokens are\
    \ used to cryptologically confirm that both parties have signed the agreement.\n\
    \nBesides this ease of use, smart contracts allow for index-based insurance, which\
    \ is very useful for agricultural insurance and other fields where the values\
    \ depend greatly on dynamic factors that can be accurately documented by trusted\
    \ third parties. In this particular case, insured farmers can receive automated\
    \ payouts when particular conditions, such as drought, are reported by verified\
    \ meteorological databases, thus further reducing potential service cost.\n\n\
    ## Witnessing for You: The Internet of Things\n\nBlockchains enable the creation\
    \ of a new type of identity for both people and things. They build on a traditional\
    \ model where a certificate authority issues a certificate. For people, that certificate\
    \ would be a document such as a birth certificate or a driver’s license. But “things”\
    \ have similar certificates that help consumers validate quality and authenticity.\n\
    \nThese types of certificates have been knocked off for years. More and more sophisticated\
    \ security has gone into their creation, but this increases the cost. Blockchains\
    \ allow for the recording of these traditional certificates in an unalterable\
    \ history that anyone can look up and reference. An added feature is the ability\
    \ to update those records as new events occur.\n\nIoT devices can now publish\
    \ all kinds of data autonomously to their records and update the current state\
    \ they’re in. Now that IoT devices can speak for themselves and have their histories\
    \ and identities published and sharable with third parties, insurance will be\
    \ just one of the many industries affected.\n\n### IoT projects in insurance\n\
    \nIoT will likely have significant impact in three areas of your life: the connected\
    \ car, the connected home, and the connected self.\n\nThe IoT is, at its core,\
    \ a disruptive technology and, as such, it’ll change the shape of a broad range\
    \ of industries, such as automotive original equipment manufacturers (OEMs), home\
    \ security, and cable and mobile providers. In that mix are insurance companies\
    \ — in particular, the ones that work with property and casualty (P&C) policies.\n\
    \nThe data gathered by the sensors in the new appliances and devices, along with\
    \ the automation and additional control options, will lead to new possibilities\
    \ when it comes to new companies emerging in the insurance industry. Combined\
    \ with the blockchain decentralized ledgers and smart contracts, the whole process\
    \ could be automated to a level that would’ve been impossible before.\n\n![warning](Image00006.jpg)The\
    \ new, always online, lifestyle that comes with such a radical shift in technology\
    \ removes some of the existing risks, but it introduces new ones, the most important\
    \ of which is information security. All this means that the risk factors will\
    \ have to be recalculated. For example, self-driving cars will have reduced risk\
    \ of accident due to the absence of human error, but the reliability of the technology\
    \ will be in question until we have enough data from real-world application.\n\
    \n### Implications of actionable big data\n\nBig data has been a thing since 2000,\
    \ and nowadays it’s a $200 billion industry and of particular importance to the\
    \ financial sector. However, big data comes with a number of problems that only\
    \ grow with its presence in the everyday world:\n\n*   **Control:** If you have\
    \ a big multinational enterprise or a consortium, the issue of data sharing becomes\
    \ fairly significant. Version control is imperfect, and it can sometimes be really\
    \ difficult to tell which is the latest, most up-to-date copy.\n\n*   **Data trustworthiness:**\
    \ How do you prove if you’re the creator of said data, or someone else is? What\
    \ happens with corrupted data?\n\n*   **Data monetization and transfer:** How\
    \ can you transfer, buy, or sell rights to any data, and be sure that it’s the\
    \ only copy there is?\n\n*   **Data changing:** How do you ensure that data is\
    \ not being changed when it’s not supposed to?\n\n All these problems are solvable\
    \ using cryptocurrency and blockchain. The large challenge that the industry is\
    \ working through now is scaling blockchain technology to accommodate the cost\
    \ and data storage demands of enterprises.\n\n## Taking Out the Third Party in\
    \ Insurance\n\nOne of the greatest advantages that blockchain tech introduces\
    \ into the modern finance world is the smart contracts that allow for business\
    \ transactions without the involvement of a third party, such as banks or intermediaries.\n\
    \nPut simply, a *smart contract* is a protocol that allows for two parties to\
    \ record their transaction into a blockchain. These contracts can be used for\
    \ pretty much anything, from exchange of physical goods (that have digital signatures)\
    \ to exchange of information or money.\n\nThe key security feature here is that,\
    \ unlike the ordinary financial database, the information is distributed to and\
    \ verified by all the computers in the network, making it decentralized. The data\
    \ is unique and not able to be copied; the audit trail is immutable.\n\n### Decentralized\
    \ security\n\nAt the core of current business models is something that could be\
    \ called the *centralized trust paradigm,* in which middlemen such as bankers,\
    \ brokers, and lawyers coordinate and ensure the veracity of financial transactions\
    \ and exchanges of goods."
