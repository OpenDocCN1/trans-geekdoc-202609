    区块链中的哈希是从前一个区块中的数据创建的。哈希是该数据的指纹，并按顺序和时间锁定区块。


    ![技术细节](img/Image00005.jpg) 虽然区块链是相对较新的创新，但哈希并不是。哈希是在 30 多年前发明的。这种旧的创新之所以被使用，是因为它创建了一个无法解密的单向函数。哈希函数创建了一种数学算法，将任意大小的数据映射到固定大小的位字符串。位字符串通常长
    32 个字符，然后表示被哈希的数据。安全哈希算法（`SHA`）是区块链中使用的一些密码学哈希函数之一。`SHA-256` 是一种常见的算法，可生成几乎唯一、固定大小的
    256 位（32 字节）哈希。出于实际目的，将哈希视为数据的数字指纹，用于将其锁定在区块链中。


    *   **网络：** 网络由“全节点”组成。将其视为运行保护网络的算法的计算机。每个节点都包含该区块链中曾记录过的所有交易的完整记录。

    节点遍布世界各地，任何人都可以运营。运营全节点困难、昂贵且耗时，因此人们不会免费这样做。他们被激励运营节点，因为他们想赚取加密货币。底层区块链算法对其服务给予奖励。奖励通常是代币或加密货币，例如
    Bitcoin。


    ![提示](img/Image00003.jpg) 术语 `Bitcoin` 和 `blockchain` 常常被互换使用，但它们并不相同。Bitcoin
    有一个区块链。Bitcoin 区块链是实现 Bitcoin 安全转移的基础协议。术语 `Bitcoin` 是为 Bitcoin 网络提供动力的加密货币的名称。区块链是一类软件，而
    Bitcoin 是一种特定的加密货币。


    ## 区块链应用

    区块链应用建立在网络是仲裁者的思想之上。这种类型的系统是一个无情且盲目的环境。计算机代码成为法律，规则按其编写的方式执行，并由网络解释。计算机不具有与人类相同的社会偏见和行为。


    网络无法解读意图（至少目前还不能）。在区块链上仲裁的保险合约作为围绕这一思想构建的用例受到了深入研究。


    另一个有趣之处是区块链使无懈可击的记录保存成为可能。它们可用于创建谁在何时做了什么的清晰时间线。许多行业和监管机构花费无数时间试图评估这一问题。区块链支持的记录保存将减轻我们在试图解读过去时产生的部分负担。


    ## 区块链生命周期

    区块链起源于 Bitcoin 的创建。它证明了一群从未谋面的人可以在一个对欺骗合作者不敏感的系统内在线协作。


    原始的 Bitcoin 网络是为了保护 Bitcoin 加密货币而构建的。它大约有 5,000 个全节点，并在全球范围内分布。它主要用于交易 Bitcoin
    和交换价值，但社区看到了利用该网络做更多事情的潜力。由于其规模和经时间检验的安全性，它还被用于保护其他较小的区块链和区块链应用。


    Ethereum 网络是区块链概念的第二次演进。它采用传统的区块链结构并在其内部添加了一种编程语言。与 Bitcoin 一样，它拥有超过 5,000 个全节点，并在全球范围内分布。Ethereum
    主要用于交易 Ether、创建智能合约和创建去中心化自治组织（DAOs）。它还被用于保护区块链应用和较小的区块链。


    Factom 网络是区块链技术的第三次演进。它利用更轻的共识系统，纳入投票，并存储更多信息。它主要用于保护数据和系统。Factom 使用联邦节点和无限数量的审计节点运行。其网络规模较小，因此将其锚定到其他分布式网络中，在各种区块链之间建立桥梁。


    ## 共识：区块链的驱动力

    区块链是强大的工具，因为它们创建了诚实的系统，能够在无需第三方强制执行规则的情况下自我纠正。它们通过共识算法实现规则的执行。


    在区块链世界中，`consensus` 是在通常互不信任的一组股东之间达成一致的过程。它们是网络上的全节点。全节点正在验证输入网络以作为账本一部分记录的交易。


    图 1-2 显示了区块链如何达成一致的概念。


    ![图 1-2：区块链的工作原理。](img/Image00008.jpg)


    图 1-2：  区块链的工作原理。


    每个区块链都有自己的算法，用于在其网络内就正在添加的条目达成一致。创建共识的模型有很多种，因为每个区块链都在创建不同类型的条目。一些区块链在交易价值，其他区块链在存储数据，还有一些在保护系统和合约。


    例如，Bitcoin 在其网络成员之间交易其代币的价值。代币具有市场价值，因此与性能、可扩展性、一致性、威胁模型和故障模型相关的要求会更高。Bitcoin
    在假设恶意攻击者可能想要破坏交易历史以窃取代币的前提下运行。Bitcoin 通过使用一种名为 `proof of work` 的共识模型来防止这种情况的发生，该模型解决了拜占庭将军问题：“你如何知道你正在查看的信息未被内部或外部更改？”由于更改或操纵数据几乎总是可能的，数据的可靠性是计算机科学中的一个大问题。


    大多数区块链在假设它们会被外部力量或系统用户攻击的前提下运行。预期的威胁以及网络对运营区块链的节点的信任程度将决定它们用于结算账本的共识算法类型。例如，Bitcoin
    和 Ethereum 预期威胁程度非常高，并使用一种名为 `proof of work` 的强大共识算法。网络中没有信任。


    在光谱的另一端，用于记录已知各方之间金融交易的区块链可以使用更轻、更快的共识。它们对高速交易的需求更为重要。由于网络中参与者相对较少以及每笔交易都需要立即确定性，Proof
    of work 对它们来说太慢且成本太高。


    ## 区块链的应用

    如今存在数百个区块链和区块链应用。整个世界都痴迷于更快地转移资金、在分布式网络中组建和治理、以及构建安全应用和硬件的想法。


    你可以通过访问加密货币交易所看到其中许多公共区块链。


    图 1-3 显示了 Poloniex（[`https://poloniex.com`](https://poloniex.com)）的山寨币交易所，这是一个加密货币交易平台。


    ![图 1-3：山寨币交易所平台。](img/Image00009.jpg)


    图 1-3：  山寨币交易所平台。

