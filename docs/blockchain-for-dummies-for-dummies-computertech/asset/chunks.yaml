    在本节中，您将深入了解如何构建您的第一个区块链。您将分两步构建它。第一步是准备您的计算机以创建私有区块链。不要担心——Docker 工具和 GitHub 上才华横溢的开发者所做的工作让这一过程变得更简单。第二步是在
    Docker 终端内构建您的区块链。


    ## 准备您的计算机

    您需要在计算机上下载一些软件以尝试此区块链项目。首先下载 Docker Toolbox。前往 [`www.docker.com/toolbox`](http://www.docker.com/toolbox)
