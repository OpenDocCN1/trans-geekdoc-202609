    Downloading the Ethereum wallet can take some time, but the interface is very
    intuitive and the instructions provided throughout the process are easy to follow.


    ![tip](Image00003.jpg)Within the Ethereum wallet, you can win test ether to build
    your test contracts and organizations. You don’t need to mine ether to learn how
    it works.


    ## Mining for ether

    Ethereum is kept running by a network of computers all over the world that are
    processing the contracts and securing the network. These computers are sometimes
    referred to as *nodes,* and they’re mining crypto Ether.


    In order to reward individuals for the time and cost involved in mining, there
    is a prize of five ethers about every 12 seconds. The prize is given to the node
    that was able to create the latest block in the Ethereum blockchain.


    All new blocks have a list of the latest transactions. The proof-of-work consensus
    algorithm guarantees that prizes are won most often by nodes with the most computational
    power. Computers that aren’t as powerful can win, too — it just takes longer.
    If you want to try your hand at mining ether, you can do it with your home computer,
    but it will take a very long time to successfully mine a block and win ether.


    ![warning](Image00006.jpg)Mining ether is not for the technical novice. You need
    to be familiar with `command line`. If you don’t have a clue what `command line`
    is, you probably want to skip this process. Also, be sure to follow the most up-to-date
    instructions on the Ethereum GitHub (`http://github.com/ethereum`).


    ## Setting up your Ethereum wallet

    To set up your Ethereum wallet, follow these steps:


    1. **Go to** `www.ethereum.org`.


    2. **Click the Download button.**

    You have to scroll down the page a bit to find the button.

    ![tip](Image00003.jpg)Be sure to save the Ethereum wallet download someplace you
    can find it later.


    3. **Open the Ethereum wallet.**


    4. **Click Use Test Net.**

    Here you get set up to mine test ether. This process is much less time-consuming
    then real ether mining, but it still takes some time.


    5. **Create a strong password.**

    Don’t forget to save your password someplace safe.


    6. **Click through the startup menu.**

    The Ethereum team has a few tutorials that are interesting to review while you’re
    waiting on your test net to download. The download may take ten minutes or so.


    7. **Choose** `Develop ⇒ Start Mining`.

    Don’t skip this step. You need the ether for later projects.


    You’ve just set up your wallet, and you’re earning test ether for your future
    smart contract projects.


    ## Building Your First Decentralized Autonomous Organization

    DAOs will change how the world does business in the future. They allow anyone
    in the world to create a new type of company online that is governed by pre-agreed-upon
    rules that are then enforced through the blockchain network. Creating a DAO is
    easier than you might think. In this section, you build your first test DAO. I
    break this project into three sections: build, congress, and governance.


    ![remember](Image00004.jpg)In order to successfully complete your test DAO, you
    need to have set up your Ethereum wallet and done some mining on the Ethereum
    test net (see the preceding section).


    Follow these steps to create your first test DAO:


    1. **Go to** `www.ethereum.org/dao`.


    2. **Scroll down the page to the Code box (shown in** [**Figure 5-3**](#text00009.html#c05-fig-0003)
    **) and copy the code.**


    3. **Open the Ethereum wallet you made earlier.**

    You’ll develop your DAO in your Ethereum wallet.


    ![ FIGURE 5-3:  The Code box.](Image00019.jpg)

    [FIGURE 5-3:](#text00009.html#rc05-fig-0003)  The Code box.


    ### Test net and congress

    The next phase of your DAO project is setting up the framework for your DAO. Follow
    these steps:


    1. **In your Ethereum wallet, choose** `Develop ⇒ Network ⇒ Test Net`.


    2. **Click the** `Contracts` **tab and then click** `Deploy Contract`.

    The Ethereum team has set up a few test templates for DAOs.


    3. **Paste the code you copied in the preceding section into the** `Solidity`
    **code box.**


    4. **From the Contract Picker, choose** `Congress`.


    5. **Pick some variables when prompted to do so.**

    Here are your options:

    * The *minimum quorum* for proposals is the fewest votes a proposal needs to have
    before it can be executed.

    * The *minutes for debate* is the shortest amount of time, in minutes, that needs
    to pass before it can be executed.

    * The *margin of votes* for a majority. Proposals pass if there are more than
    50 percent of the votes plus the margin. Leave it at 0 for a simple majority.


    ### Governance and voting

    Now you’re going to name and set up the governance of your DAO. You need to set
    up a *minimum quorum* for proposals (how many votes a new proposal needs to have
    before it is passed). You also set up the *margin of votes for a majority* (how
    many votes a plan needs to pass) and the time allotted for discussing new plans.


    1. **Name your new DAO.**

    This is kind of like naming a company.


    2. **For Debate Times, select 5 minutes.**

    This is how long new proposals are open for conversation.


    3. **Leave Margin of Votes for Majority set to 0.**

    This sets up how the democracy of your contract works.


    4. **Confirm the price of the DAO.**

    You’ve mined some Ether in the test net via your wallet when you first set up
    it up. If you skipped that step, go back and do it now. You need a little of the
    test net Ether to build your DAO.


    5. **Click Deploy and type your password.**

    The DAO may take some time to deploy. When you arrive at your new dashboard, scroll
    down, and you’ll be able to see your DAO being produced.


    6. **Click the New icon.**

    A new unique icon will generate that represents your DAO.


    Congratulations! You’ve created your first DAO.


    ## Uncovering the Future of DAOs

    Smart contracts and decentralized organizations hold a lot of promise. The pure
    democratic and hyper-rational nature of them is very appealing. However, at this
    point, there are more possibilities then knowns, and each contract that is created
    could be groundbreaking or a massive flop.


    If you approach Ethereum as the new frontier that it is, you’ll have more success.
    The Ethereum network has more benefits than drawbacks if you’re careful. But expecting
    everything to work flawlessly and all the participants to act with integrity will
    open you up to greater losses. Ethereum has its share of bandits, not to mention
    those friendly enthusiasts who would like you to succeed.


    The smart contract hacks of 2016 have highlighted the importance of security and
    properly reviewing contracts. It also illustrated that there are people with integrity
    that who fight to fix issues.


    Reading this book is only the beginning. It will give you a sound bases to build
    your knowledge of Ethereum, but as with all new technologies, Ethereum is quickly
    evolving. Keep reviewing best practices and security measures.


    In the following sections, I mention some things to keep in mind as you build
    your first few DAOs, build smart contracts, and debug your new blockchain systems.


    ### Putting money in a DAO

    Don’t trust large sums of money to untested and contracts and contracts that haven’t
    been fully vetted. Large contracts are more often targeted by hackers. The DAO
    hack described earlier in this chapter (see the sidebar “[With great power comes
    … great power](#text00009.html#c05-fea-0001) ”) showed that even well thought-out
    contracts have unexpected weaknesses.


    ![remember](Image00004.jpg)Although, smart contracts and blockchains let you conduct
    business with anyone around the world, it’s still the early days. You can mitigate
    your risk by working only with known and trusted parties.

    '
  trans: '

    下载以太坊钱包可能需要一些时间，但界面非常直观，整个过程中提供的说明也很容易遵循。


    ![tip](img/Image00003.jpg)在以太坊钱包中，你可以赢取测试以太币来构建你的测试合约和组织。你不需要挖矿以太币就能了解其工作原理。


    ## 挖矿以太币

    以太坊由遍布全球的计算机网络维持运行，这些计算机正在处理合约并保护网络。这些计算机有时被称为 *节点*，它们正在挖矿加密以太币。


    为了奖励参与挖矿所花费的时间和成本，大约每 12 秒会有一笔五枚以太币的奖励。奖励授予能够创建以太坊区块链最新区块的节点。


    所有新区块都包含最新交易的列表。工作量证明共识算法保证奖励最常被计算能力最强的节点赢得。计算能力较弱的计算机也能获胜，只是需要更长时间。如果你想尝试挖矿以太币，可以用家用电脑来做，但成功挖出一个区块并赢得以太币需要非常长的时间。


    ![warning](img/Image00006.jpg)挖矿以太币不适合技术新手。你需要熟悉 `command line`。如果你不知道 `command
    line` 是什么，你可能最好跳过这个过程。另外，请务必遵循以太坊 GitHub (`http://github.com/ethereum`) 上的最新说明。


    ## 设置你的以太坊钱包

    设置你的以太坊钱包，请按照以下步骤操作：


    1. **前往** `www.ethereum.org`。


    2. **点击下载按钮。**

    你需要向下滚动页面一点才能找到按钮。

    ![tip](img/Image00003.jpg)请务必将以太坊钱包下载保存到以后能找到的地方。


    3. **打开以太坊钱包。**


    4. **点击使用测试网。**

    在这里你将设置好挖矿测试以太币。这个过程比真实以太币挖矿花费的时间少得多，但仍然需要一些时间。


    5. **创建强密码。**

    不要忘记将密码安全地保存在某个地方。


    6. **点击浏览启动菜单。**

    在等待测试网下载时，以太坊团队提供了一些有趣的教程可以查看。下载可能需要十分钟左右。


    7. **选择** `Develop ⇒ Start Mining`。

    不要跳过这一步。你需要以太币用于后面的项目。


    你刚刚设置好了钱包，并且正在为未来的智能合约项目赚取测试以太币。


    ## 构建你的第一个去中心化自治组织

    DAO 将改变世界未来的商业方式。它们允许世界上的任何人在线创建一种新型公司，该公司受事先商定的规则管理，然后通过区块链网络执行。创建 DAO 比你想象的要容易。在本节中，你将构建你的第一个测试
    DAO。我将此项目分为三个部分：构建、议会和治理。


    ![remember](img/Image00004.jpg)为了成功完成你的测试 DAO，你需要设置好以太坊钱包并在以太坊测试网上进行一些挖矿（参见前一节）。


    按照以下步骤创建你的第一个测试 DAO：


    1. **前往** `www.ethereum.org/dao`。


    2. **向下滚动页面到代码框（显示在** **图 5-3** **中）并复制代码。**


    3. **打开你之前创建的以太坊钱包。**

    你将在以太坊钱包中开发你的 DAO。


    ![图 5-3：代码框。](img/Image00019.jpg)

    图 5-3：  代码框。


    ### 测试网和议会

    你 DAO 项目的下一个阶段是设置 DAO 的框架。请按照以下步骤操作：


    1. **在你的以太坊钱包中，选择** `Develop ⇒ Network ⇒ Test Net`。


    2. **点击** `Contracts` **标签，然后点击** `Deploy Contract`。

    以太坊团队为 DAO 设置了一些测试模板。


    3. **将你在前一节中复制的代码粘贴到** `Solidity` **代码框中。**


    4. **从合约选择器中，选择** `Congress`。


    5. **在提示时选择一些变量。**

    以下是你的选项：

    * 提案的 *最低法定人数* 是提案在执行前所需的最低投票数。

    * *辩论分钟数* 是在提案可以执行之前需要经过的最短时间（以分钟为单位）。

    * 多数票的 *投票差距*。如果投票数超过 50% 加上差距，则提案通过。将它保留为 0 以实现简单多数。


    ### 治理和投票

    现在你要为你的 DAO 命名并设置治理。你需要为提案设置 *最低法定人数*（新提案在通过前需要的投票数）。你还需要设置 *多数票的投票差距*（计划通过所需的投票数）以及讨论新计划所分配的时间。


    1. **为你的新 DAO 命名。**

    这有点像为公司命名。


    2. **对于辩论时间，选择 5 分钟。**

    这是新提案开放讨论的时间长度。


    3. **将多数票的投票差距保留为 0。**

    这设置了你的合约的民主运作方式。


    4. **确认 DAO 的价格。**

    你在第一次设置钱包时已通过钱包在测试网上挖了一些以太币。如果你跳过了那一步，现在回去做。你需要一点测试网以太币来构建你的 DAO。


    5. **点击部署并输入你的密码。**

    DAO 的部署可能需要一些时间。当你到达新的仪表板时，向下滚动，你将能够看到你的 DAO 正在生成。


    6. **点击新图标。**

    将生成一个代表你的 DAO 的新唯一图标。


    恭喜！你创建了你的第一个 DAO。


    ## 探索 DAO 的未来

    智能合约和去中心化组织蕴含着巨大的潜力。它们纯粹的民主和超理性的本质非常有吸引力。然而，在这一点上，未知的事物比已知的可能性更多，每一个创建的合约都可能是开创性的，也可能是彻底的失败。


    如果你把以太坊当作它所代表的新前沿来对待，你会取得更大的成功。如果你谨慎行事，以太坊网络的优点会多于缺点。但期望一切完美运行并且所有参与者都诚信行事会让你面临更大的损失。以太坊也有它的一份强盗，更不用说那些希望你成功的好心爱好者了。


    2016 年的智能合约黑客攻击凸显了安全性和正确审查合约的重要性。它也说明了有正直的人在努力解决问题。


    阅读这本书只是开始。它将为你建立以太坊知识提供坚实的基础，但与所有新技术一样，以太坊正在快速发展。继续审查最佳实践和安全措施。


    在以下章节中，我提到了一些你在构建前几个 DAO、构建智能合约以及调试新的区块链系统时需要牢记的事情。


    ### 在 DAO 中投入资金

    不要将大量资金信任给未经测试的合约和未完全审查的合约。大型合约更常成为黑客的目标。本章前面描述的 DAO 攻击（参见侧边栏 “权力越大……权力越大 ”）表明，即使是经过深思熟虑的合约也存在意想不到的弱点。


    ![remember](img/Image00004.jpg)尽管智能合约和区块链让你可以与世界各地的人做生意，但现在仍然是早期阶段。你可以通过只与已知和值得信赖的合作伙伴合作来降低风险。

