  trans: "\n所有这一切的合法性仍有疑问。确定隐私问题和消费者权利是困难的。各国也有各自的法规和披露要求。然而，一旦满足这些法规，保险行业以及消费者对保险的体验将发生实质性转变。\n\
    \n## 微保险的新世界\n\n*微保险*是对低收入人群提供风险保障的保险，如事故、疾病和自然灾害。通过区块链技术，它变得更加可行。\n\n思考微保险时，请注意两类（可以并行存在）：\n\
    *   面向低收入家庭、农民和其他实体的保险，其中保险围绕特定需求设计——通常是低保费和基于指数的保险\n*   处理低价值产品或服务的保险\n\n这些类型合同在传统保险模式下最大的问题是其处理成本不成比例地高，使得服务这些市场变得不具吸引力。\n\
    \n区块链的低摩擦属性使其能够以极低的成本、几乎瞬间在世界任何地方转移价值，且无拒付，从而开辟了服务更多人群并降低成本的机会。\n\n区块链的关键优势在于智能合约的创建允许在没有中间人的情况下进行安全交易，因此保险的成本显著降低。\n\
    \n区块链微保险原则很简单，由四个步骤组成：\n1.  借贷/投保协议提案\n    一个人可以通过其保险提供商提供其财产的借贷，前提是该财产已进行数字注册。提议可以发送给潜在用户，要么通过保险公司渠道，要么通过\
    \ Facebook 等公共平台。\n2.   协议审查\n    借款人随后可以审查收到的提案并接受或拒绝。提议保存在公共记录中，如果借款人接受提案，他可以通过标准支付渠道购买保险，流程进入第三步。\n\
    3.  协议签署和公证\n    如果双方意见一致，保险费用支付完毕且借款人收到相关财产，协议将被数字签名并公证到区块链上。这使其几乎防篡改。所有交易信息都安全存储，并附有清晰的审计轨迹以备需要时查阅。\n\
    4.  确认代币\n    双方都会收到特殊的数字代币，作为相关协议的身份证明。这些代币用于密码学确认双方已签署协议。\n\n除了这种易用性之外，智能合约还允许基于指数的保险，这对于农业保险和其他价值高度依赖可由受信任第三方准确记录的动态因素的领域非常有用。在这种特定情况下，当经核实的气象数据库报告特定条件（如干旱）时，被保险农民可以收到自动赔付，从而进一步降低潜在服务成本。\n\
    \n## 为你作证：物联网\n\n区块链使为人和物创建新型身份成为可能。它们建立在传统模式之上，在该模式中，证书颁发机构签发证书。对于个人而言，该证书是出生证明或驾驶执照等文件。但“物”也有类似的证书，帮助消费者验证质量和真实性。\n\
    \n这些类型的证书多年来一直被仿冒。投入到其创建中的安全措施越来越复杂，但这也增加了成本。区块链允许以任何人都可以查阅和引用的不可更改的历史记录形式记录这些传统证书。附加功能是可以随着新事件的发生更新这些记录。\n\
    \n物联网设备现在可以自主向其记录发布各种数据并更新其当前状态。现在物联网设备可以为自己发声，并将其历史和身份发布并与第三方共享，保险将只是受影响的众多行业之一。\n\
    \n### 保险中的物联网项目\n\n物联网可能在生活的三个领域产生重大影响：互联汽车、互联家居和互联自我。\n\n物联网从根本上说是一种颠覆性技术，因此它将改变一系列行业的面貌，例如汽车原始设备制造商（OEM）、家庭安全以及有线和移动服务提供商。其中包括保险公司——特别是那些从事财产和意外险（P&C）业务的公司。\n\
    \n新电器和设备中传感器收集的数据，加上自动化和额外的控制选项，将为保险行业出现的新公司带来新的可能性。结合区块链分布式账本和智能合约，整个流程可以实现自动化，达到以前不可能实现的水平。\n\
    \n![警告](img/Image00006.jpg)\n这种激进的技术转变带来的全天候在线生活方式消除了一些现有风险，但也引入了新的风险，其中最重要的是信息安全。所有这些意味着风险因素必须重新计算。例如，由于没有人为错误，自驾车将降低事故风险，但直到我们拥有足够的实际应用数据，技术的可靠性仍将受到质疑。\n\
    \n### 可操作大数据的含义\n\n大数据自 2000 年以来就已存在，如今它是一个 2000 亿美元的产业，对金融部门尤为重要。然而，大数据带来了许多问题，随着其在日常生活中的存在，这些问题只会增加：\n\
    *   **控制：** 如果你拥有一个大型跨国企业或财团，数据共享问题变得相当重要。版本控制不完善，有时很难分辨哪个是最新的、最更新的副本。\n*   **数据可信度：**\
    \ 如何证明你是所说数据的创建者，还是其他人？损坏的数据会怎样？\n*   **数据货币化与转移：** 如何转移、购买或出售任何数据的权利，并确保它是唯一的副本？\n\
    *   **数据变更：** 如何确保数据在不应该更改时不会被更改？\n\n所有这些问题都可以通过加密货币和区块链解决。行业现在面临的巨大挑战是将区块链技术扩展到满足企业成本和数据存储需求的程度。\n\
    \n## 在保险中剔除第三方\n\n区块链技术为现代金融世界带来的最大优势之一是智能合约，它允许在没有银行或中介等第三方参与的情况下进行业务交易。\n\n\
    简单来说，*智能合约*是一种协议，允许双方将交易记录到区块链中。这些合约几乎可用于任何用途，从具有数字签名的实物商品交换到信息或货币交换。\n\n这里的关键安全特性是，与普通金融数据库不同，信息分布在网络中的所有计算机上并由其验证，使其去中心化。数据是唯一的且无法复制；审计轨迹不可变。\n\
    \n### 去中心化安全\n\n当前商业模式的核心可以称为*集中信任范式*，其中银行家、经纪人、律师等中间人协调并确保金融交易和商品交换的真实性。\n"
