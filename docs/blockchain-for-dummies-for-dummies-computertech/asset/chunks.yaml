  trans: "\nDAPPs 是为取代资产和组织的集中化管理而创建的。这种结构具有很大的吸引力，因为许多人相信绝对权力导致绝对腐败。对于担心失去控制的人来说，这种结构具有巨大的影响。\n\
    \nEtheria ([`www.etheria.world`](http://www.etheria.world))，一款类似 Minecraft 的游戏，是这种技术应用的一个有趣示例（参见\
    \ 图 5-1）。该游戏无法被审查或关闭，只要以太坊存在就会存在。当事物在以太坊内部创建时，即使有正当理由移除某个结构或组织，实际上也几乎不可能做到。\n\n\
    ![ 图 5-1： 世界上第一个不朽的数字游戏，Etheria。](img/Image00017.jpg)\n\n图 5-1： 世界上第一个不朽的数字游戏，Etheria。\n\
    \n## 去中心化自治组织的力量\n\nDAOs 是一种以太坊应用类型，在以太坊内代表一个虚拟实体。当你创建一个 DAO 时，可以邀请他人参与组织的治理。参与者可以保持匿名且从不相见，这可能会触发了解你的客户（KYC）规则（企业必须履行的验证客户身份的过程）和反洗钱（AML；旨在阻止通过非法手段获取收入的做法的法律和法规）合规问题。\n\
    \nDAOs 已被创建用于筹集投资资金，但也可以为公民或非营利目的而设计。以太坊为治理提供了一个基本框架。具体治理内容由组织者决定。以太坊已创建模板来帮助创建\
    \ DAO。\n\n图 5-2 显示了以太坊应用组织结构的一个示意图。\n\n![ 图 5-2： Ethereum.org 区块链应用示意图。](img/Image00018.jpg)\n\
    \n图 5-2： Ethereum.org 区块链应用示意图。\n\nDAOs 基本工作原理如下：\n\n1. 一群人编写智能合约来管理组织。\n2. 人们向\
    \ DAO 投入资金并获得代表所有权的代币。\n   这种结构有点像公司的股票，但成员从第一天起就控制资金。\n3. 资金筹集完成后，DAO 开始运作，成员提出资金使用方案。\n\
    4. 成员对这些提案进行投票。\n5. 当预定的时间过去且预定的投票数达到时，提案通过或失败。\n6. 个人作为承包商为 DAO 提供服务。\n\n与大多数传统投资工具不同，传统投资工具中由中央机构决定投资，而\
    \ DAO 的成员控制 100% 的资产。他们对新投资和其他决策进行投票。这种结构威胁到传统金融管理者的地位。\n\nDAOs 是用无法即时更改的代码构建的。其吸引力在于恶意黑客无法以传统方式篡改资金。黑客仍可能找到以意想不到的方式执行代码并提取资金的方法。DAO\
    \ 代码的不可变性使其在 DAO 在以太坊上线后几乎不可能修复任何错误。\n\n## 区块链的黑客攻击\n\n以太坊从未被黑客攻击。2016 年因 DAO\
    \ 攻击而进行的硬分叉，该攻击在 “权力越大……权力越大” 侧边栏中提到，并不是对系统的实际攻击，但令人困惑的是常被称作黑客攻击。以太坊运行完美。问题在于它太完美了。当大量资金和大多数用户受到威胁时，有必要重启系统。\n\
    \n在像以太坊这样的区块链上纠正操作的唯一方法是进行 *hard fork,* 它允许对协议进行根本性更改。硬分叉会使之前有效的区块和交易无效。以太坊就是这样做的，以保护用户从第一个\
    \ DAO 中提取的资金。从概念上讲，DAO 攻击是有史以来最大的漏洞赏金之一。\n\n尽管如此，加密货币领域仍发生许多诈骗和黑客攻击。大多数攻击针对的是中心化交易所和应用。许多黑客想要窃取加密货币。它具有真实价值，并且不像普通货币那样受到政府的同样保护。加密货币的匿名性也使其对罪犯具有吸引力。抓捕和起诉这些个人很困难。然而，加密货币社区正在反击，并创建新的保护措施。\n\
    \n![记住](img/Image00004.jpg)攻击一个地方比试图攻破一个去中心化网络要容易得多，也便宜得多。当你读到区块链世界中的黑客攻击时，很可能只是某个网站或加密货币钱包被黑，而不是整个网络。\n\
    \n### 了解智能合约\n\n以太坊智能合约类似于合同协议，只是没有中央机构来执行合同。以太坊协议通过附加经济压力来“执行”智能合约。如果要求存在于以太坊内部，它们也可以强制执行要求，因为以太坊可以证明某些条件是否满足。如果不在以太坊内部，执行起来就困难得多。\n\
    \n![警告](img/Image00006.jpg)以太坊智能合约目前尚未具有法律执行力，也可能永远不会具有，因为人们认为不需要外部权威来执行协议。法律体系由政府控制。就目前而言，政府是中央权威机构——有些拥有或多或少的同意和民主原则。在以太坊智能合约中，每个参与者都拥有不可剥夺的投票权。\n\
    \n以太坊智能合约不包括人工智能。这在不久的将来是一个很酷的可能性。但目前，以太坊只是运行在区块链上的软件代码。\n\n以太坊智能合约并不安全。DAO 攻击是可能发生危险类型的绝佳例子。仍处于早期阶段，将大量资金投入未经证实系统并不明智。相反，请用少量资金进行实验，直到新合约的所有错误都被排除。\n\
    \n### 发现加密货币 Ether\n\nEther 是以太坊区块链的加密货币名称。它以被认为渗透所有空间并使宇宙成为可能的物质命名。从这个意义上说，Ether\
    \ 是使以太坊成为可能的物质。Ether 通过工作量证明挖矿激励网络保护自身，就像代币比特币激励比特币网络一样。在以太坊网络中执行任何代码都需要 Ether。当用于在以太坊中执行合约时，Ether\
    \ 被称为 *gas.*\n\n执行智能合约中的代码也会花费一定数量的 ether。这一特性为代币增加了额外的效用。只要个人希望使用以太坊进行应用和合约，ether\
    \ 就会具有超出投机的价值。\n\nether 价值的狂野增长使其成为一个热门的投机代币。它在全球各地的交易所广泛交易。一些新对冲基金将其视为投资工具。然而，其波动性和低市场深度使其成为一种风险投资。\n\
    \n## 在以太坊上入门\n\n在本节中，我将指导你如何在以太坊区块链生态系统中入门。在以太坊上构建任何东西之前，你需要一个以太坊钱包。\n\n![记住](img/Image00004.jpg)你的钱包将持有你的以太坊代币，称为\
    \ *ether.* Ether 是允许你在以太坊内部创建智能合约的加密货币。这有时被称为 *gas.*\n"
