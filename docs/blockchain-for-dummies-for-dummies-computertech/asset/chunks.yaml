    Blockchain technology doesn’t remove the need for music labels and distributors.
    However, they’ll need to act quickly if they don’t want to be displaced by new
    companies that adapt this more efficient model, just as Netflix disrupted Blockbuster.


    # Part 5

    ## The Part of Tens

    IN THIS PART …

    Discover ten free blockchain resources that will help you stay up to speed on
    the technology and the industry.

    Identify ten rules to never break while working within the cryptocurrency and
    blockchain world.

    Find out more on the top ten blockchain projects and organizations that are shaping
    the future of the industry.


    ### Chapter 17

    #### Ten Free Blockchain Resources

    IN THIS CHAPTER

    ![check](Image00001.jpg)**Discovering free blockchain education resources**

    ![check](Image00001.jpg)**Getting involved in the Blockchain community**

    ![check](Image00001.jpg)**Staying up to date on the latest blockchain news**

    ![check](Image00001.jpg)**Deepening your knowledge of other blockchain resources**

    In this chapter, I outline interesting free resources across the blockchain ecosystem
    that will help you stay informed and get involved in the community. Here, you
    can find free tools for making *oracles* (the data feeds that allow smart contracts
    to execute), videos that will expand your knowledge, and organizations that are
    shaping the future of the industry.


    ##### Factom University

    Factom, Inc., is a blockchain company that services the Factom open-source network.
    It builds custom blockchain applications for large corporations and governments.
    It has also built a blockchain as a service product for the U.S. mortgage industry.

    Factom University ( [ `www.factom.com/university` ](http://www.factom.com/university)
    ) was created by Factom, Inc., and is a growing knowledge base created to teach
    individuals about blockchain technology, the Factom platform, and APIs. It consists
    of videos and tutorials that will take you from novice to expert. Factom University
    has plans to launch a certificate program, so stay tuned!


    ##### Ethereum 101

    Ethereum is an open-source crowdfunded project that built the Ethereum blockchains.
    It’s one of the most important projects in the space because it has pioneered
    building a programing language within a blockchain. Due to its built-in programing
    language, the Ethereum network allows you to create smart contracts, create decentralized
    organizations, and deploy decentralized applications.

    Ethereum 101 ( [ `www.ethereum101.org` ](http://www.ethereum101.org) ) is a website
    started by the members of the Ethereum community. It’s a curated repository for
    high-quality educational content about blockchain technology and the Ethereum
    network. Anthony D’Onofrio, Ethereum’s Director of Community, oversees the project.


    ##### Build on Ripple

    Ripple provides global financial settlement solutions. Its distributed settlement
    network is built on open-source technology that anyone can use. Ripple cautions
    that its blockchain capabilities should only be used by licensed financial institutions.

    Ripple has developed a robust knowledge base for building on its platform ( [
    `www.ripple.com/build` ](http://www.ripple.com/build) ). This knowledge base is
    geared primarily for developers. Ripple also offers some resources for financial
    regulators. It’s worth a read even if you aren’t a regulator, because it gives
    some insight into legal labilities that come up with blockchain technology.


    ##### Programmable Money by Ripple

    Steven Zeiler is a Ripple employee who developed a YouTube series on how to create
    programmable money on the Ripple network using JavaScript. This series is geared
    for JavaScript programmers. As of this writing, there are ten videos that will
    talk you through development. Check out the YouTube series at [ `https://goo.gl/g8vFPL`
    ](https://goo.gl/g8vFPL) .


    ##### DigiKnow

    DigiByte is a decentralized payment network inspired by Bitcoin. It allows you
    to move money over the Internet and offers faster transactions and lower fees
    than Bitcoin. The network is also open to those who want to mine its native token.

    The founder of DigiByte, Jared Tate, created a video series on YouTube, called
    DigiKnow, that teaches you just about everything you need to know to utilize DigiByte.
    Here is a link to his first video, where he walks you through the basics of how
    blockchains work and how the DigiByte network adds value: [ `https://youtu.be/scr6BzFddso`
    ](https://youtu.be/scr6BzFddso) .


    ##### Blockchain University

    Blockchain University is an educational website that teaches developers, manager,
    and entrepreneurs about the blockchain ecosystem. It offers public and private
    training programs, hackathons, and demo events. Its programs are solution-oriented
    design thinking and hands-on experiential training. You can find Blockchain University
    in Mountain View, California, or at [ `http://blockchainu.co` ](http://blockchainu.co)
    .


    ##### Bitcoin Core

    Bitcoin Core ( [ `https://bitcoin.org` ](https://bitcoin.org) ) was originally
    used by Satoshi Nakamoto to host his whitepaper on Bitcoin protocol. It’s home
    to educational material on Bitcoin core protocol and downloadable versions of
    the original Bitcoin software.

    The site is dedicated to keeping Bitcoin decentralized and accessible to the average
    person.

    ![remember](Image00004.jpg)It’s a community-run project, and not all the content
    is managed by the core team. Keep this in mind while perusing the site.


    ##### Blockchain Alliance

    The Blockchain Alliance was founded by the Blockchain Chamber of Digital Commerce
    and the news organization Coincenter. It’s a public-private collaboration by the
    blockchain community, law enforcement, and regulators. They share a common goal
    to make the blockchain ecosystem more secure and to promote further development
    of technology. They do this by combat criminal activity on the blockchain by providing
    education, technical assistance, and periodic informational sessions regarding
    Bitcoin and other digital currencies and those utilize blockchain technology.

    You can learn more about their events or join their organization at [ `www.blockchainalliance.org`
    ](http://www.blockchainalliance.org) .


    ##### Multichain Blog

    Multichain is a company that helps organizations rapidly build applications on
    blockchains. They offer a platform that can issue millions of assets on a private
    blockchain and you can also track and verify activity on your network through
    their tools. Beyond their toolset and platform, they’ve been thought leaders in
    the blockchain space.

    These are my favorite posts from their blog ( [ `www.multichain.com/blog` ](http://www.multichain.com/blog)
    ):

    * Four genuine blockchain use cases ( [ `www.multichain.com/blog/2016/05/four-genuine-blockchain-use-cases/`
    ](http://www.multichain.com/blog/2016/05/four-genuine-blockchain-use-cases/) )

    * Beware the impossible smart contract ( [ `www.multichain.com/blog/2016/04/beware-impossible-smart-contract/`
    ](http://www.multichain.com/blog/2016/04/beware-impossible-smart-contract/) )

    * Smart contracts and the DAO implosion ( [ `www.multichain.com/blog/2016/06/smart-contracts-the-dao-implosion/`
    ](http://www.multichain.com/blog/2016/06/smart-contracts-the-dao-implosion/) )

    * Understanding zero knowledge blockchains ( [ `www.multichain.com/blog/2016/11/understanding-zero-knowledge-blockchains/`
    ](http://www.multichain.com/blog/2016/11/understanding-zero-knowledge-blockchains/)
    )


    ##### HiveMind

    Paul Sztorc founded Truthcoin, a peer-to-peer oracle system and prediction marketplace
    for Bitcoin. It utilizes a proof-of-work sidechain that stores data on the state
    of prediction markets. Bitcoin can support financial derivatives and smart contracts
    through HiveMind, the platform developed out of the Truthcoin whitepaper. Check
    out their resources and education materials at [ `http://bitcoinhivemind.com`
    ](http://bitcoinhivemind.com) .


    ### Chapter 18

    #### The Ten Rules to Never Break on the Blockchain

    IN THIS CHAPTER

