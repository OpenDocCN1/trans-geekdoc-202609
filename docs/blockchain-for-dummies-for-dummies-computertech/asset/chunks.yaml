    2. **Enter your vanity address in the Search box and press Enter.**

    The transaction page appears.

    That''s all it takes to find your transaction and read the massage that you built
    into the address.


    ## Using Smart Contracts with Bitcoin

    A `smart contract` is autonomous software that can make financial decisions. The
    blockchain world is abuzz about smart contracts because they''re both amazing
    and terrifying in their implications for how the world economy operates.


    In simple terms, a smart contract is a written contract that has been translated
    into code and build as complex if-then statements. The contract can self-verify
    that conditions have been met to execute the contract. It does this by pulling
    trusted data from outside sources. Smart contracts can also self-execute by releasing
    payment data or other types of data. They can be built around many different types
    of ideas and do not need to be financial in nature. Smart contracts can do all
    this while remaining tamper resistant from outside control.


    Blockchain technology allowed smart contracts to come into existence because smart
    contracts offer the permanence and corrupt resistances that were once provided
    only by paper, ink, and a trusted authority to enforce it all. Smart contracts
    are a revolution in how we conduct business. They ensure that a contract will
    be executed as it was written. No outside enforcement is needed. The blockchain
    acts as the intermediary and enforcer.


    Smart contracts are a big deal because when machines start executing contracts,
    it becomes difficult or impossible to undo. It also brings up an important nature
    of these instruments that can''t be overlooked and my first law of smart contracts:
    *She who controls the data, controls the contract.* All smart contracts verify
    an external data feed to prove performance and release payment to the correct
    party.


    ![warning](Image00006.jpg)Although smart contracts are a revolutionary new technology,
    they can''t yet interpret the *intent* of the parties entering into the contract.
    Legal contracts in our society rely on people to interpret what the parties entering
    into the contract meant. Computers (at least so far) can only understand code,
    not the intent of the parties.


    ### Building your first smart bond

    A `smart bond` is a type of smart contract that can hold and release an object
    of value on its own, while also monitoring payments in various currencies using
    spot price data feeds. Many different types of smart contracts exist, and new
    ones are being invented every day.


    Follow these steps to build your first smart bond:

    1. **Go to the SmartContract website ([`www.smartcontract.com`](http://www.smartcontract.com)).**

    2. **Click Sign Up.**

    The Sign Up page appears.

    3. **Enter an email address and password and click Create an Account.**

    SmartContract sends you an email with a confirmation link.

    4. **Click the link in the email sent to you by SmartContract to verify your account
    and log in.**

    5. **Click Create Contract.**

    6. **Click the Smart Bond tab (see [**Figure 3-2**](#text00006.html#c03-fig-0002)).**

    7. **Click the Create Contract button.**

    You''re ready to build your first if-then statement.

    8. **Click the Smart Terms tab.**

    Smart contracts verify an outside data feed to prove the performance of your contract
    and trigger the release of payment. Here you choose the conditions that will trigger
    your smart contract.

    9. **Choose Performance Monitoring.**

    Performance monitoring will look to see if an action has been taken outside of
    the contract. In your case, this will be the movement of funds from one account
    to another.

    10. **In the If Payment To field, enter one of your Bitcoin addresses (created
    earlier in this chapter).**

    11. **In the Is field, enter a small dollar amount that you would like to transfer
    from one Bitcoin address to the other.**

    12. **In the By Expiration Date field, enter a date a few days from now.**

    This sets the time parameters that the contract will use to monitor outside sources.

    13. **Click the Description tab (see [**Figure 3-3**](#text00006.html#c03-fig-0003)).**

    14. **In the Smart Contract Title field, enter a name for your contract.**

    15. **In the Brief Description field, enter — you guessed it! — a brief description
    of the contract.**

    The description should act as a brief summary of the agreement''s purpose. Here
    you can also attach a legal document or other data, such as a image.

    16. **Click the Attachments section.**

    ![warning](Image00006.jpg)Smart contracts are new technology and can have hiccups.
    It is best to only attach things that are unimportant and that you''d be okay
    exposing publicly.

    17. **Click Attach Documents.**

    You can attach an image or a PDF.

    18. **Click the Sign & Send tab.**

    19. **In the Address field, enter your email address to send yourself the contract.**

    20. **Click the Finalize Contract button.**

    Now your contract will be monitoring the Bitcoin blockchain to monitor whether
    you send funds to the Bitcoin wallet address that you listed earlier.

    21. **Return to your Bitcoin wallets and send funds between the two wallets.**

    Make sure to use the address and a little more than the amount that you listed
    on the contract in Steps 10 and 11. When the contract you created sees the record
    of the transaction of the Bitcoin blockchain, you''ll be notified by email.

    ![remember](Image00004.jpg)The Bitcoin network will take a cut of the transaction,
    so add a little more to it so that it will meet the terms of the contract. For
    example, if you set the contract to $5, send $5.15 just to be safe.


    ![ FIGURE 3-2:  The Smart Bond tab.](Image00011.jpg)

    [FIGURE 3-2:](#text00006.html#rc03-fig-0002)  The Smart Bond tab.


    ![ FIGURE 3-3:  The Description tab.](Image00012.jpg)

    [FIGURE 3-3:](#text00006.html#rc03-fig-0003)  The Description tab.


    ### Checking the status of your contract

    You can check the status of your contract at any time by following these steps:

    1. **Log into your SmartContract account at [`www.smartcontract.com`](http://www.smartcontract.com).**

    2. **Go to your Contract Dashboard.**

    After your transaction has been completed, the contract will show as complete.
    Your contract status is located below the Contract Dashboard.

    ![remember](Image00004.jpg)Give the Bitcoin network 10 to 15 minutes to process
    your transaction before checking the status of it.


    ## Building a Private Blockchain with Docker and Ethereum

    Private blockchains hold the promises of both having the benefits of a private
    database and the security of blockchains. The idea is most appealing for two reasons:

    * **Private blockchains are great for developers because they allow them to test
    ideas without using cryptocurrency.** The developers'' ideas can remain a secret
    as well, because the data has not been published publicly.

    * **Large institutions can capitalize on the security and permanence of blockchain
    technology without their transactions being public the way they are in traditional
    blockchains.**


    ![tip](Image00003.jpg)Most of this book assumes you''re just learning about blockchain
    for the first time and have little to no programing skills, but this section requires
    some knowledge of GitHub, Docker, and how to use your computer''s terminal. If
    you need a quick recap on coding before you dive in, I recommend *Coding For Dummies*
    by Nikhil Abraham (Wiley) for a great overview on coding for nontechnical people.
    If you don''t plan to ever be hands-on with blockchain technology, you might want
    to skip the rest of this chapter.

