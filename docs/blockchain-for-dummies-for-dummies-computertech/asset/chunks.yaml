- raw: "Blockchains are moving beyond the trading value market and are being incorporated\
    \ into all sorts of industries. Blockchains add a new trust layer that now makes\
    \ working online secure in a way that was not possible beforehand.\n\n### Current\
    \ blockchain uses\n\nMost up-and-running blockchain applications revolve around\
    \ moving money or other forms of value quickly and cheaply. This includes trading\
    \ public company stock, paying employees in other countries, and exchanging one\
    \ currency for another.\n\n Blockchains are also now being used as part of a software\
    \ security stack. The U.S. Department of Homeland Security has been investigating\
    \ blockchain software that secures Internet of Things (IoT) devices. The IoT world\
    \ has some of the most to gain from this innovation, because it’s especially vulnerable\
    \ to spoofing and other forms of hacking. IoT devices have also become more pervasive,\
    \ and security has become more reliant on them. Hospital systems, self-driving\
    \ cars, and safety systems are prime examples.\n\nDAOs are another interesting\
    \ blockchain innovation. This type of blockchain application represents a new\
    \ way to organize and incorporate companies online. DAOs have been used to organize\
    \ and invest funds via the Ethereum network.\n\n### Future blockchain applications\n\
    \nLarger and longer-run blockchain projects that are being explored now include\
    \ government-backed land record systems, identity, and international travel security\
