- raw: "Factom, Inc., is a company that builds blockchain software on top of the open-access\
    \ Factom blockchain. Factom’s recordkeeping software works at a high level by\
    \ publishing encrypted data or a cryptographically unique fingerprint of that\
    \ data to the Factom blockchain (shown in [Figure 7-1](#text00011.html#c07-fig-0001)\
    \ ). Additional measures are taken to secure the network by publishing a hash\
    \ of the whole Factom blockchain every ten minutes in multiple other public blockchains.\
    \ This extra publishing feature makes Factom different from most public blockchains.\n\
    \n![Illustration courtesy of Factom, Inc. ¶  FIGURE 7-1:  The structure of the\
    \ Factom blockchain.](Image00020.jpg)\n\nIllustration courtesy of Factom, Inc.\
    \ ¶  [FIGURE 7-1:](#text00011.html#rc07-fig-0001)  The structure of the Factom\
    \ blockchain.\n\nThe concept of the protocol was presented as a whitepaper in\
    \ 2014 to address scalability issues of Bitcoin. As decentralized applications\
    \ began securing themselves in Bitcoin, it became clear that entering data into\
    \ the Bitcoin blockchain was prohibitively expensive at scale, and the Bitcoin\
    \ couldn’t handle high transactional volumes. There was no way to metaphorically\
    \ get 10 pounds of data into the 5-pound Bitcoin bag.\n\nThe Factom protocol was\
    \ designed to address the cost and volume limitations of other blockchains. The\
    \ primary objective was to secure data and systems. Because of this objective,\
    \ Factom is often described as a *publishing engine.* It allows users to  write\
    \ data to its ledger for a small fee. These entries are limited to 10 kibibytes\
    \ and have a fixed cost that is less expensive and has more capacity for transaction\
    \ volume by an order of magnitude compared to blockchains that use proof of work.\n\
    \nAn important concept to understand is that the Factom blockchain is built in\
    \ layers and chains. The layers have to do with how the data is structured. They\
    \ use Merkle trees to leave cryptographic proof that any given data was published\
    \ within Factom. The cryptographic proof, called a *Merkle root* (32 random characters\
    \ that can represent a whole tree of individual data), is then published into\
    \ other public blockchains like Ethereum. This is redundant security that other\
    \ blockchains don’t offer.\n\n![technicalstuff](Image00005.jpg)A Merkle tree is\
    \ a mathematical tree constructed by hashing paired data and then pairing and\
    \ hashing the results until a single hash remains, known as the Merkle root. This\
    \ cryptographic proof was named after Ralph Merkle in 1979.\n\nOrganizing data\
    \ into chains helps with scalability. Chains allow applications to only pull the\
    \ data that they’re interested in from the Factom blockchain, without needing\
    \ to download the full data set. How they work is very simple: You can publish\
    \ your data into an existing chain within Factom, or you can create a new chain.\
    \ The chain ID is then used in the subsequent items you publish as a way to trace\
    \ back the data you care about.\n\n### The purpose of the Factom blockchain: Publishing\
    \ anything\n\nFactom is a publishing platform. At its core, it was designed to\
    \ publish and validate any data. All other tools on it are built around these\
    \ simple functionalities. Factom can handle transactions that are up to 10 kibibytes;\
    \ larger transactions need special structuring and require multiple entries. Alternatively,\
    \ a hash that represents the data can also be published.\n\nBecause the Factom\
    \ protocol is open source, the system acts as a public utility. It’s a place where\
    \ anyone can publish anything and be secured by the Factom blockchain. Not surprisingly,\
    \ some individuals have published obscene content, but the limit on entry size\
    \ means they can’t publish much. And spam is curbed in the system by charging\
    \ a small amount per entry. So if you want to swear in the blockchain, it’ll cost\
    \ you.\n\nFactoids are the Factom network cryptocurrency. Decentralized systems\
    \ need a reward mechanism to incentivize participants. Having this closed system\
    \ requires cooperation, and builds the long-term network value creation. Factoids\
    \ can be  traded and purchased like any of the other 700 cryptocurrencies on the\
    \ cryptocurrency market. In the end, Factoids are used to purchase entry credits\
    \ for the Factom Network.\n\nThe cost of an entry is fixed, while the cost of\
    \ a *Factoid* fluctuates. As a Factoid increases in value, the user can buy more\
    \ entry credits. This system allows users to be separated from tradable tokens\
    \ and maintains fixed cost for consumers while allowing for a free market on the\
    \ speculation of Factoids. This functionality was built into the initial release\
    \ of Factom to allow heavily regulated industries and governments to utilize blockchain\
    \ technology without dirtying their hands with tradable tokens.\n\nAs of early\
    \ 2017, the Factom Network sees about 40,000 entries a day. These include things\
    \ like the Russell 3000 Index and a record of altcoin prices each day. These records\
    \ are used as historical references and can be utilized as input to smart contracts\
    \ or to prove history.\n\nStoring and accessing of data today is mostly a solved\
    \ problem in the industry. Computer backups can be replicated and archived on\
    \ a massive scale. A big problem that remains is determining which document is\
    \ the most recent revision, especially across different organizations. With a\
    \ blockchain-based document management system, organizations can ensure that they’re\
    \ using the same documents as their partners.\n\n### Incentives of federation\n\
    \nMany blockchains, such as Bitcoin and Ethereum, use a “proof of work” consensus.\
    \ In this kind of a blockchain, the consensus algorithm is how a blockchain comes\
    \ to agreement on new data entered into the system. The consensus system examines\
    \ whether new data is valid. Public blockchains need a robust system because anyone\
    \ can add data to a blockchain. Their consensus mechanism is the rule set that\
    \ determines what makes a block valid and what chain should be trusted.\n\nProof\
    \ of work has many characteristics that make it very attractive. It can often\
    \ require a capital investment into specialized computer hardware and access to\
    \ electricity (the cheaper, the better). This means that the only requirement\
    \ to join as an authority in the system is to burn electricity with commodity\
    \ hardware. It also means that in order to rewrite history, an equivalent amount\
    \ of energy must be re-burned. This expense makes rewriting history unprofitable\
    \ and, thus, unlikely.\n\n Proof of work is excellent at securing blockchains.\
    \ On the other hand, it consumes vast sums of energy and is expensive to operate.\
    \ It’s a cannibalistic arms race where the fastest computers win, and each additional\
    \ gigahash added to the network increases the challenge.\n\nThe more data contained\
    \ in each block, the more difficult it is to validate. Proof-of-work systems like\
    \ Bitcoin also requires the full blockchain to validate a specific data point\
    \ in the system. For others to prove the transaction you made in the Bitcoin blockchain\
    \ is valid, they must have all of Bitcoin’s blockchain downloaded. Currently,\
    \ that takes several days.\n\nFactom steps back from the question, “Is an entry\
    \ valid?” The question instead is, “Has the entry been paid for?” The users of\
    \ the system are the ones validating entries. Factom also structures data in subchains\
    \ that can be parsed individually to prove the validity of any entry without downloading\
    \ the full blockchain.\n\n[Figure 7-2](#text00011.html#c07-fig-0002) shows a diagram\
    \ of the Factom chain structure.\n\n![Illustration courtesy of Factom, Inc. ¶\
    \  FIGURE 7-2:  The Factom chain structure.](Image00021.jpg)\n\nIllustration courtesy\
    \ of Factom, Inc. ¶  [FIGURE 7-2:](#text00011.html#rc07-fig-0002)  The Factom\
    \ chain structure."
  fmt: '

    # Factom Blockchain Overview


    Factom, Inc., is a company that builds blockchain software on top of the open-access
    Factom blockchain. Factom’s recordkeeping software works at a high level by publishing
    encrypted data or a cryptographically unique fingerprint of that data to the Factom
    blockchain (shown in [Figure 7-1](#text00011.html#c07-fig-0001) ). Additional
    measures are taken to secure the network by publishing a hash of the whole Factom
    blockchain every ten minutes in multiple other public blockchains. This extra
    publishing feature makes Factom different from most public blockchains.


    ![Illustration courtesy of Factom, Inc. ¶  FIGURE 7-1:  The structure of the Factom
    blockchain.](Image00020.jpg)


    Illustration courtesy of Factom, Inc. ¶  [FIGURE 7-1:](#text00011.html#rc07-fig-0001)  The
    structure of the Factom blockchain.


    The concept of the protocol was presented as a whitepaper in 2014 to address scalability
    issues of Bitcoin. As decentralized applications began securing themselves in
    Bitcoin, it became clear that entering data into the Bitcoin blockchain was prohibitively
    expensive at scale, and the Bitcoin couldn’t handle high transactional volumes.
    There was no way to metaphorically get 10 pounds of data into the 5-pound Bitcoin
    bag.


    The Factom protocol was designed to address the cost and volume limitations of
    other blockchains. The primary objective was to secure data and systems. Because
    of this objective, Factom is often described as a `publishing engine`. It allows
    users to write data to its ledger for a small fee. These entries are limited to
    10 kibibytes and have a fixed cost that is less expensive and has more capacity
    for transaction volume by an order of magnitude compared to blockchains that use
    proof of work.


    An important concept to understand is that the Factom blockchain is built in layers
    and chains. The layers have to do with how the data is structured. They use Merkle
    trees to leave cryptographic proof that any given data was published within Factom.
    The cryptographic proof, called a `Merkle root` (32 random characters that can
    represent a whole tree of individual data), is then published into other public
    blockchains like Ethereum. This is redundant security that other blockchains don’t
    offer.


    ![technicalstuff](Image00005.jpg)

    A Merkle tree is a mathematical tree constructed by hashing paired data and then
    pairing and hashing the results until a single hash remains, known as the Merkle
    root. This cryptographic proof was named after Ralph Merkle in 1979.


    Organizing data into chains helps with scalability. Chains allow applications
    to only pull the data that they’re interested in from the Factom blockchain, without
    needing to download the full data set. How they work is very simple: You can publish
    your data into an existing chain within Factom, or you can create a new chain.
    The chain ID is then used in the subsequent items you publish as a way to trace
    back the data you care about.


    ## The purpose of the Factom blockchain: Publishing anything


    Factom is a publishing platform. At its core, it was designed to publish and validate
    any data. All other tools on it are built around these simple functionalities.
    Factom can handle transactions that are up to 10 kibibytes; larger transactions
    need special structuring and require multiple entries. Alternatively, a hash that
    represents the data can also be published.


    Because the Factom protocol is open source, the system acts as a public utility.
    It’s a place where anyone can publish anything and be secured by the Factom blockchain.
    Not surprisingly, some individuals have published obscene content, but the limit
    on entry size means they can’t publish much. And spam is curbed in the system
    by charging a small amount per entry. So if you want to swear in the blockchain,
    it’ll cost you.


    Factoids are the Factom network cryptocurrency. Decentralized systems need a reward
    mechanism to incentivize participants. Having this closed system requires cooperation,
    and builds the long-term network value creation. Factoids can be traded and purchased
    like any of the other 700 cryptocurrencies on the cryptocurrency market. In the
    end, Factoids are used to purchase entry credits for the Factom Network.


    The cost of an entry is fixed, while the cost of a `Factoid` fluctuates. As a
    Factoid increases in value, the user can buy more entry credits. This system allows
    users to be separated from tradable tokens and maintains fixed cost for consumers
    while allowing for a free market on the speculation of Factoids. This functionality
    was built into the initial release of Factom to allow heavily regulated industries
    and governments to utilize blockchain technology without dirtying their hands
    with tradable tokens.


    As of early 2017, the Factom Network sees about 40,000 entries a day. These include
    things like the Russell 3000 Index and a record of altcoin prices each day. These
    records are used as historical references and can be utilized as input to smart
    contracts or to prove history.


    Storing and accessing of data today is mostly a solved problem in the industry.
    Computer backups can be replicated and archived on a massive scale. A big problem
    that remains is determining which document is the most recent revision, especially
    across different organizations. With a blockchain-based document management system,
    organizations can ensure that they’re using the same documents as their partners.


    ## Incentives of federation


    Many blockchains, such as Bitcoin and Ethereum, use a “proof of work” consensus.
    In this kind of a blockchain, the consensus algorithm is how a blockchain comes
    to agreement on new data entered into the system. The consensus system examines
    whether new data is valid. Public blockchains need a robust system because anyone
    can add data to a blockchain. Their consensus mechanism is the rule set that determines
    what makes a block valid and what chain should be trusted.


    Proof of work has many characteristics that make it very attractive. It can often
    require a capital investment into specialized computer hardware and access to
    electricity (the cheaper, the better). This means that the only requirement to
    join as an authority in the system is to burn electricity with commodity hardware.
    It also means that in order to rewrite history, an equivalent amount of energy
    must be re-burned. This expense makes rewriting history unprofitable and, thus,
    unlikely.


    Proof of work is excellent at securing blockchains. On the other hand, it consumes
    vast sums of energy and is expensive to operate. It’s a cannibalistic arms race
    where the fastest computers win, and each additional gigahash added to the network
    increases the challenge.


    The more data contained in each block, the more difficult it is to validate. Proof-of-work
    systems like Bitcoin also requires the full blockchain to validate a specific
    data point in the system. For others to prove the transaction you made in the
    Bitcoin blockchain is valid, they must have all of Bitcoin’s blockchain downloaded.
    Currently, that takes several days.


    Factom steps back from the question, “Is an entry valid?” The question instead
    is, “Has the entry been paid for?” The users of the system are the ones validating
    entries. Factom also structures data in subchains that can be parsed individually
    to prove the validity of any entry without downloading the full blockchain.


    [Figure 7-2](#text00011.html#c07-fig-0002) shows a diagram of the Factom chain
    structure.


    ![Illustration courtesy of Factom, Inc. ¶  FIGURE 7-2:  The Factom chain structure.](Image00021.jpg)


    Illustration courtesy of Factom, Inc. ¶  [FIGURE 7-2:](#text00011.html#rc07-fig-0002)  The
    Factom chain structure.

    '
  trans: '

    # Factom 区块链概述


    Factom, Inc. 是一家在开放访问的 Factom 区块链之上构建区块链软件的公司。Factom 的记录软件通过将加密数据或该数据的密码学唯一指纹发布到
    Factom 区块链（显示在 图 7-1 中）来工作。为确保网络安全，还会每十分钟在多个其他公共区块链中发布整个 Factom 区块链的哈希。这种额外的发布功能使
    Factom 与大多数公共区块链不同。


    ![说明图由 Factom, Inc. 提供 ¶  图 7-1：Factom 区块链的结构。](img/Image00020.jpg)


    说明图由 Factom, Inc. 提供 ¶  图 7-1：  Factom 区块链的结构。


    该协议的概念于 2014 年以白皮书的形式提出，以解决比特币的可扩展性问题。随着去中心化应用开始在比特币上实现自身安全，很明显，随着规模扩大，将数据输入比特币区块链的成本高得令人望而却步，而且比特币无法处理高交易量。形象地说，没有办法将
    10 磅的数据装进 5 磅的比特币袋子里。


    Factom 协议旨在解决其他区块链的成本和容量限制。主要目标是保护数据和系统。由于这一目标，Factom 通常被描述为一个 `publishing engine`。它允许用户以少量费用将数据写入其账本。这些条目限制为
    10 千字节，并且具有固定成本，与使用工作量证明的区块链相比，成本更低，交易量容量高出一个数量级。


    一个重要的概念是 Factom 区块链是分层和链式构建的。层级与数据的结构方式有关。它们使用 Merkle 树来留下密码学证明，证明任何给定数据已在 Factom
    中发布。这种密码学证明称为 `Merkle root`（可以代表整棵单个数据树的 32 个随机字符），然后发布到以太坊等其他公共区块链中。这是其他区块链不提供的冗余安全。


    ![技术说明](img/Image00005.jpg)

    Merkle 树是由对配对数据进行哈希处理，然后对结果进行配对和哈希，直到只剩下一个哈希为止的数学树，被称为 Merkle root。这种密码学证明以 Ralph
    Merkle 命名，始于 1979 年。


    将数据组织成链有助于可扩展性。链允许应用程序仅从 Factom 区块链中提取它们感兴趣的数据，而无需下载完整的数据集。它们的工作方式非常简单：你可以在 Factom
    中将数据发布到现有链中，也可以创建新链。然后链 ID 用于你后续发布的内容，作为追溯你关心的数据的方式。


    ## Factom 区块链的目的：发布任何内容


    Factom 是一个发布平台。其核心设计用于发布和验证任何数据。其上的所有其他工具都围绕这些简单功能构建。Factom 可以处理高达 10 千字节的交易；更大的交易需要特殊结构并需要多个条目。或者，表示数据的哈希也可以被发布。


    由于 Factom 协议是开源的，该系统充当公共设施。这是一个任何人都可以发布任何内容并由 Factom 区块链保护的地方。不出所料，一些个人发布了淫秽内容，但条目大小限制意味着他们无法发布太多内容。而且系统通过对每个条目收取少量费用来遏制垃圾信息。所以如果你想在区块链上咒骂，你需要付费。


    Factoids 是 Factom 网络的加密货币。去中心化系统需要奖励机制来激励参与者。这种封闭系统需要合作，并建立长期网络价值创造。Factoids 可以像加密货币市场上其他
    700 种加密货币一样进行交易和购买。最终，Factoids 用于购买 Factom 网络的条目积分。


    条目的成本是固定的，而 `Factoid` 的成本则波动。随着 Factoid 价值的增加，用户可以购买更多条目积分。该系统允许用户与可交易代币分离，并在允许
    Factoids 投机自由市场的同时为消费者保持固定成本。这一功能被构建到 Factom 的初始版本中，以便受严格监管的行业和政府能够利用区块链技术，而无需沾染可交易代币。


    截至 2017 年初，Factom 网络每天约有 40,000 条条目。其中包括罗素 3000 指数和每天的山寨币价格记录。这些记录用作历史参考，可用作智能合约的输入或证明历史。


    存储和访问数据在今天在行业中在很大程度上已是一个解决的问题。计算机备份可以大规模复制和归档。仍然存在的一个大问题是确定哪个文档是最新的修订版，尤其是在不同组织之间。借助基于区块链的文档管理系统，组织可以确保它们使用与合作伙伴相同的文档。


    ## 联邦的激励机制


    许多区块链，如比特币和以太坊，使用“工作量证明”共识。在这种区块链中，共识算法是区块链就系统输入的新数据达成一致的方式。共识系统检查新数据是否有效。公共区块链需要一个健全的系统，因为任何人都可以向区块链添加数据。它们的共识机制是决定什么使区块有效以及应信任哪条链的规则集。


    工作量证明具有许多使其非常有吸引力的特征。它通常需要对专用计算机硬件进行资本投资以及电力接入（越便宜越好）。这意味着加入系统作为权威的唯一要求是用通用硬件消耗电力。这也意味着为了改写历史，必须重新消耗等量的能源。这种开销使改写历史变得无利可图，因此不太可能。


    工作量证明在保护区块链方面非常出色。另一方面，它消耗大量能源，运营成本高昂。这是一场食人族军备竞赛，最快的计算机获胜，网络中每增加一个吉哈希，挑战就会增加。


    每个区块包含的数据越多，验证就越困难。如比特币等工作量证明系统也需要完整的区块链来验证系统中的特定数据点。为了让他人证明你在比特币区块链中进行的交易有效，他们必须下载比特币的整个区块链。目前，这需要几天时间。


    Factom 回避了“条目是否有效？”这个问题。问题反而是“条目是否已付费？”系统的用户是验证条目的人。Factom 还将数据结构化为子链，可以单独解析以证明任何条目的有效性，而无需下载完整的区块链。


    图 7-2 显示了 Factom 链结构的图表。


    ![说明图由 Factom, Inc. 提供 ¶  图 7-2：Factom 链结构。](img/Image00021.jpg)


    说明图由 Factom, Inc. 提供 ¶  图 7-2：  Factom 链结构。

    '
