  trans: '

    ## 资产互操作性


    未来，`Fabric` 也可能具有与 `Ripple` 网络相同的部分功能（参见 第 6 章）。它设想了在低流动性市场中，公司可以通过在多方之间匹配需求来交换资产的用例。与其满足于双方之间直接交易的市场限制，链网络将买家与卖家连接起来，并在多个资产类别中寻找最佳匹配。`Hyperledger`
    在未来交易衍生品方面似乎处于有利地位。你可以在 [`http://events.linuxfoundation.org/sites/events/files/slides/TradingDerivatives_LinuxCon_2016.pdf`](http://events.linuxfoundation.org/sites/events/files/slides/TradingDerivatives_LinuxCon_2016.pdf)
    阅读更多关于这项工作的内容。


    ## 调查 Iroha 项目


    `Hyperledger` 的 `Iroha` 项目是在 `Fabric` 项目完成的工作基础上构建的。它旨在补充 `Fabric`、`Sawtooth Lake`
    以及 `Hyperledger` 下的其他项目。`Hyperledger` 将 `Iroha` 项目加入孵化，因为其他项目没有用 `C++` 编写的任何基础设施项目。没有
    `C++` 项目严重限制了能从 `Hyperledger` 工作中受益的人数以及能够为项目做出贡献的开发人员数量。


    此外，目前大多数区块链开发都在最低的基础设施层面上进行，用户交互或移动应用程序的开发工作几乎没有。`Hyperledger` 认为 `Iroha` 对于区块链技术的普及是必要的。该项目通过吸引更多开发人员并提供移动用户界面开发的库来填补市场空白。


    在撰写本文时，`Iroha` 是一个非常新的项目，尚未与 `Fabric` 或 `Sawtooth Lake` 集成。`Hyperledger` 计划很快扩展功能以与其他区块链项目协同工作。其
    `iOS`、`Android` 和 `JavaScript` 库将提供诸如数字签名交易等支持功能。它将对商业应用开发非常有用，并将增加只有区块链技术才能实现的新的安全层和商业模式。


    ### 介绍 Sumeragi：新的共识算法


    区块链具有系统，使其首先就单一的真实版本达成一致，然后将该已达成一致的真实记录在其账本中。一种协议系统称为 *共识*。


    共识很复杂。理解共识如何以及为何以这种方式行事的细微差别远远超出了本书的范围。对于商业专业人士来说，这也远比你需要的多。对你 *确实* 重要的是不同共识机制的后果以及它们如何影响你在特定区块链上的操作。我重点介绍
    `Iroha` 的共识 `Sumeragi`，因为它与传统区块链非常不同。


    以下是使 `Sumeragi` 不同的一点关键内容：


    * `Sumeragi` 没有加密货币。

    * 启动共识的节点由 `Fabric` 成员服务添加到系统中。节点根据它们与账本的交互方式随着时间的推移建立声誉。这是由已知实体运行的许可区块链。

    * 新条目以独特的方式添加到账本中。启动共识的第一个节点，称为 *领导者,* 将条目广播给其他节点组；这些节点随后进行验证。如果它们未验证，第一个节点将在预定时间后重新广播。广播元素与
    `Ripple` 的共识工作原理相似。


    根据你对区块链的用例，`Iroha` 可能是积极的也可能是消极的。如果你担心审查，`Iroha` 可能不适合你。在这种情况下，你最好寻找一个抗审查的区块链。如果你担心网络上的其他参与者进行套利，`Iroha`
    可能也不合适——需要进一步调查。如果你想知道区块链中的所有参与者，`Iroha` 可能正是你正在寻找的。


    ### 开发移动应用


    ![提示](img/Image00003.jpg)如果你不是应用开发领域的人员，请跳过本节。


    `Iroha` 是为 Web 和移动应用开发者构建的，以便他们能够访问 `Hyperledger` 系统的优势。`Iroha` 团队认为，如果没有应用程序利用它，分散式账本就没有用处。


    `Iroha` 对以下封装的 `C++` 组件有开发路径：


    * `Sumeragi` 共识库

    * `Ed25519` 数字签名库

    * `SHA-3` 哈希库

    * `Iroha` 交易序列化库

    * `P2P` 广播库

    * `API` 服务器库

    * `iOS` 库

    * `Android` 库

    * `JavaScript` 库

    * 区块链浏览器/数据可视化套件


    区块链行业的主要障碍之一是使系统用户友好。`Iroha` 为 `iOS`、`Android` 和 `JavaScript` 创建了开源软件库，并使常见的 API
    函数调用变得方便。开发仍处于早期阶段，但 `Iroha` 是探索业务用例的良好资源。


    ## 深入了解 Sawtooth Lake


    英特尔的 `Sawtooth Lake` 是 `Hyperledger` 中的另一个分布式账本项目。它专注于成为一个高度模块化的平台，用于为公司构建新的分布式账本。


    ![警告](img/Image00006.jpg)截至本文撰写时，发布版本中的软件仅 *模拟* 共识。它不会为你的项目提供安全性，只能用于测试新想法。


    `Sawtooth Lake` 不使用加密货币运行。它通过允许企业创建私有区块链来维护平台的安全性。这些运行私有区块链的企业随后分担网络计算需求的负担。在其文档中，`Sawtooth
    Lake` 指出这种类型的设置将确保对共享账本状态的普遍一致。


    `Sawtooth Lake` 颠覆了区块链的基本模型。大多数区块链有三个要素：


    * 区块链当前状态的共享记录

    * 输入新数据的方式

    * 就该数据达成一致的方式


    `Sawtooth Lake` 将前两者合并为一个单一流程，他们称之为 *交易家族.* 该模型最适合所有参与方都从正确记录中获得共同利益的用例。


    英特尔允许其软件足够灵活，以适应反映每个企业独特要求的自定义交易家族。它还构建了三个用于构建数字资产的模板：


    * `EndPointRegistry`：在区块链中记录项目的场所

    * `IntegerKey`：用于供应链管理的共享账本

    * `MarketPlace`：用于买卖和交易数字资产的区块链交易平台


    ### 探索共识算法：Proof of Elapsed Time


    `Sawtooth Lake` 的共识算法称为 Proof of Elapsed Time (`PoET`)。它被构建为在计算机主处理器的安全区域中运行，称为受信任执行环境
    (`TEE`)。`PoET` 利用 `TEE` 的安全性通过对交易进行时间戳来证明时间已经流逝。


    其他共识算法也有某种时间戳元素。它们确保记录未被更改的方式是通过公开发布其区块链作为未被篡改的证明。已发布的账本充当公共证人，任何人都可以回滚并检查。这有点像在报纸上刊登广告来证明某事发生了。

