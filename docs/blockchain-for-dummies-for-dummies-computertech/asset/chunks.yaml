- raw: "Downloading the Ethereum wallet can take some time, but the interface is very\
    \ intuitive and the instructions provided throughout the process are easy to follow.\n\
    \n![tip](Image00003.jpg)Within the Ethereum wallet, you can win test ether to\
    \ build your test contracts and organizations. You don’t need to mine ether to\
    \ learn how it works.\n\n### Mining for ether\n\nEthereum is kept running by a\
    \ network of computers all over the world that are processing the contracts and\
    \ securing the network. These computers are sometimes referred to as *nodes,*\
    \ and they’re mining crypto Ether.\n\nIn order to reward individuals for the time\
    \ and cost involved in mining, there is a prize of five ethers about every 12\
    \ seconds. The prize is given to the node that was able to create the latest block\
    \ in the Ethereum blockchain.\n\nAll new blocks have a list of the latest transactions.\
    \ The proof-of-work consensus algorithm guarantees that prizes are won most often\
    \ by nodes with the most computational power. Computers that aren’t as powerful\
    \ can win, too — it just takes longer. If you want to try your hand at mining\
    \ ether, you can do it with your home computer, but it will take a very long time\
    \ to successfully mine a block and win ether.\n\n ![warning](Image00006.jpg)Mining\
    \ ether is not for the technical novice. You need to be familiar with command\
    \ line. If you don’t have a clue what command line is, you probably want to skip\
    \ this process. Also, be sure to follow the most up-to-date instructions on the\
    \ Ethereum GitHub ( [ `http://github.com/ethereum` ](http://github.com/ethereum)\
    \ ).\n\n### Setting up your Ethereum wallet\n\nTo set up your Ethereum wallet,\
    \ follow these steps:\n\n1.  **Go to** [ `www.ethereum.org` ](http://www.ethereum.org)\
    \ **.**\n\n2.  **Click the Download button.**\n\n    You have to scroll down the\
    \ page a bit to find the button.\n\n    ![tip](Image00003.jpg)Be sure to save\
    \ the Ethereum wallet download someplace you can find it later.\n\n3.  **Open\
    \ the Ethereum wallet.**\n\n4.  **Click Use Test Net.**\n\n    Here you get set\
    \ up to mine test ether. This process is much less time-consuming then real ether\
    \ mining, but it still takes some time.\n\n5.  **Create a strong password.**\n\
    \n    Don’t forget to save your password someplace safe.\n\n6.  **Click through\
    \ the startup menu.**\n\n    The Ethereum team has a few tutorials that are interesting\
    \ to review while you’re waiting on your test net to download. The download may\
    \ take ten minutes or so.\n\n7.  **Choose Develop ⇒   Start Mining.**\n\n    Don’t\
    \ skip this step. You need the ether for later projects.\n\nYou’ve just set up\
    \ your wallet, and you’re earning test ether for your future smart contract projects.\n\
    \n## Building Your First Decentralized Autonomous Organization\n\nDAOs will change\
    \ how the world does business in the future. They allow anyone in the world to\
    \ create a new type of company online that is governed by pre-agreed-upon rules\
    \ that are then enforced through the blockchain network. Creating a DAO  is easier\
    \ than you might think. In this section, you build your first test DAO. I break\
    \ this project into three sections: build, congress, and governance.\n\n![remember](Image00004.jpg)In\
    \ order to successfully complete your test DAO, you need to have set up your Ethereum\
    \ wallet and done some mining on the Ethereum test net (see the preceding section).\n\
    \nFollow these steps to create your first test DAO:\n\n1.  **Go to** [ `www.ethereum.org/dao`\
    \ ](http://www.ethereum.org/dao) **.**\n\n2.  **Scroll down the page to the Code\
    \ box (shown in** [**Figure 5-3**](#text00009.html#c05-fig-0003) **) and copy\
    \ the code.**\n\n3.  **Open the Ethereum wallet you made earlier.**\n\n    You’ll\
    \ develop your DAO in your Ethereum wallet.\n\n![ FIGURE 5-3:  The Code box.](Image00019.jpg)\n\
    \n [FIGURE 5-3:](#text00009.html#rc05-fig-0003)  The Code box.\n\n### Test net\
    \ and congress\n\nThe next phase of your DAO project is setting up the framework\
    \ for your DAO. Follow these steps:\n\n1.  **In your Ethereum wallet, choose Develop ⇒   Network ⇒   Test\
    \ Net.**\n\n2.  **Click the Contracts tab and then click Deploy Contract.**\n\n\
    \    The Ethereum team has set up a few test templates for DAOs.\n\n3.  ** Paste\
    \ the code you copied in the preceding section into the Solidity code box.**\n\
    \n4.  **From the Contract Picker, choose Congress.**\n\n5.  **Pick some variables\
    \ when prompted to do so.**\n\n    Here are your options:\n\n    *   The *minimum\
    \ quorum* for proposals is the fewest votes a proposal needs to have before it\
    \ can be executed.\n\n    *   The *minutes for debate* is the shortest amount\
    \ of time, in minutes, that needs to pass before it can be executed.\n\n    *\
    \   The *margin of votes* for a majority. Proposals pass if there are more than\
    \ 50 percent of the votes plus the margin. Leave it at 0 for a simple majority.\n\
    \n### Governance and voting\n\nNow you’re going to name and set up the governance\
    \ of your DAO. You need to set up a *minimum quorum* for proposals (how many votes\
    \ a new proposal needs to have before it is passed). You also set up the *margin\
    \ of votes for a majority* (how many votes a plan needs to pass) and the time\
    \ allotted for discussing new plans.\n\n1.  **Name your new DAO.**\n\n    This\
    \ is kind of like naming a company.\n\n2.  **For Debate Times, select 5 minutes.**\n\
    \n    This is how long new proposals are open for conversation.\n\n3.  **Leave\
    \ Margin of Votes for Majority set to 0.**\n\n    This sets up how the democracy\
    \ of your contract works.\n\n4.  **Confirm the price of the DAO.**\n\n    You’ve\
    \ mined some Ether in the test net via your wallet when you first set up it up.\
    \ If you skipped that step, go back and do it now. You need a little of the test\
    \ net Ether to build your DAO.\n\n5.  **Click Deploy and type your password.**\n\
    \n    The DAO may take some time to deploy. When you arrive at your new dashboard,\
    \ scroll down, and you’ll be able to see your DAO being produced.\n\n6.  **Click\
    \ the New icon.**\n\n    A new unique icon will generate that represents your\
    \ DAO.\n\nCongratulations! You’ve created your first DAO.\n\n## Uncovering the\
    \ Future of DAOs\n\nSmart contracts and decentralized organizations hold a lot\
    \ of promise. The pure democratic and hyper-rational nature of them is very appealing.\
    \ However, at this point, there are more possibilities then knowns, and each contract\
    \ that is created could be groundbreaking or a massive flop.\n\nIf you approach\
    \ Ethereum as the new frontier that it is, you’ll have more success. The Ethereum\
    \ network has more benefits than drawbacks if you’re careful. But expecting everything\
    \ to work flawlessly and all the participants to act with integrity will open\
    \ you up to greater losses. Ethereum has its share of bandits, not to mention\
    \ those friendly enthusiasts who would like you to succeed.\n\nThe smart contract\
    \ hacks of 2016 have highlighted the importance of security and properly reviewing\
    \ contracts. It also illustrated that there are people with integrity that who\
    \ fight to fix issues.\n\nReading this book is only the beginning. It will give\
    \ you a sound bases to build your knowledge of Ethereum, but as with all new technologies,\
    \ Ethereum is quickly evolving. Keep reviewing best practices and security measures.\n\
    \nIn the following sections, I mention some things to keep in mind as you build\
    \ your first few DAOs, build smart contracts, and debug your new blockchain systems.\n\
    \n### Putting money in a DAO\n\nDon’t trust large sums of money to untested and\
    \ contracts and contracts that haven’t been fully vetted. Large contracts are\
    \ more often targeted by hackers. The DAO hack described earlier in this chapter\
    \ (see the sidebar “[With great power comes … great power](#text00009.html#c05-fea-0001)\
    \ ”) showed that even well thought-out contracts have unexpected weaknesses.\n\
    \n![remember](Image00004.jpg)Although, smart contracts and blockchains let you\
    \ conduct business with anyone around the world, it’s still the early days. You\
    \ can mitigate your risk by working only with known and trusted parties."
