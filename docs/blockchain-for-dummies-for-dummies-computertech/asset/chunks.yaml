    \ to estimate the payback time for mining many different cryptocurrencies.\n\n\
    \    [Figure 8-1](#text00012.html#c08-fig-0001) shows the cost and profitability\
    \ calculator tool from CoinWarz.\n\n2.  **In the Pool Fees % field, enter** 3**.**\n\
    \n    This is a high estimate on the cost to participate in a mining pool. It\
