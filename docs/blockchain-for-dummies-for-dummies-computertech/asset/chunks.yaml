    ## Mining on DigiByte


    DigiByte uses five mining algorithms to process transactions. Each algorithm accounts
    for 20 percent of all blocks created on the network. This system makes DigiByte
    a unique and diverse blockchain.


    The DigiByte team saw that there was greater advantage to gain by allowing more
