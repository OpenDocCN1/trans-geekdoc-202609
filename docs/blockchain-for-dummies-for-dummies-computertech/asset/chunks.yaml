    # Chapter 10

    ## Applying Microsoft Azure

    IN THIS CHAPTER


    ![check](Image00001.jpg)**Building new applications**


    ![check](Image00001.jpg)**Bridging your systems**


    ![check](Image00001.jpg)**Authenticating new systems**


    ![check](Image00001.jpg)**Deploying private Ethereum**


    In this chapter, you get a preview of the exciting innovations that are taking
    place inside of Microsoft’s `Azure` platform and how these changes can improve
    your business’s efficiency and create new opportunities for products and services.


    This chapter helps you compete for, collaborate with, and service customers in
    a global economy. Blockchain technology is opening new markets and changing business
    models. Microsoft is working hard to make it an assessable technology for traditional
    business.


    This chapter also explains innovative blockchain bridges that are being built
    to allow you to connect and scale your existing systems. You find out how to deploy
    your own blockchain inside `Azure` and the keys elements to making a safe and
    hassle-free transition to blockchain systems for your business.


    ### Bletchley: The Modular Blockchain Fabric

    Project `Bletchley` concentrates on offering architectural building blocks for
    enterprise customers within a *consortium blockchain ecosystem* (a members-only,
    permissioned networks for members to execute contracts). `Bletchley`’s blockchain
    fabric platform is powered by `Azure`, the cloud computing platform for Microsoft.
    Project `Bletchley` addresses the following:

    * Digital identity

    * Private key management

    * Customer privacy

    * Data security

    * Operations administration

    * System interoperability


    In Project `Bletchley`, `Azure` provides the cloud layer for blockchain, serving
    as the platform where applications can be built and delivered. It will be availability
    in 24 regions globally. `Azure` is combining its traditional products such as
    hybrid cloud capabilities, extensive compliance certification portfolio, and enterprise-grade
    security to various blockchains. Microsoft wants to make it easier for the existing
    clients to quickly adopt blockchain technology, especially in controlled industries
    such as healthcare, financial services, and government.


    [Figure 10-1](#text00015.html#c10-fig-0001) shows project `Bletchley`’s `Blockstack
    Core v14`, a new decentralized web of server-less applications where users can
    control their data.


    ![ FIGURE 10-1: Blockstack Core v14.](Image00025.jpg)


    [FIGURE 10-1:](#text00015.html#rc10-fig-0001) Blockstack Core v14.


    `Azure` will work with several blockchain protocols. They are part of `Hyperledger`
    project and unspent transaction output (`UTXO`)–based protocols. This means that
    the `Azure` platform doesn’t utilize a cryptocurrency and may be more appealing
    to enterprise customers. They’ll also have integrations with more sophisticated
    protocols, including `Ethereum`, that do utilize a cryptocurrency to secure the
    network.


    #### Cryptlets for encrypting and authenticating

    Project `Bletchley` is built around two ideas:

    * `Blockchain middleware`: Cloud storage, identity management, analytics, and
    machine learning

    * `Cryptlets`: Secure execution for interoperation and communication between Microsoft
    `Azure`, `Bletchley`’s ecosystem, and your own technology


    `Cryptlets` are built as off-chaincode components, written in any language, executed
    within a trusted container, and communicated over a secure channel. `Cryptlets`
    can be used in smart contracts and `UTXO` systems, when additional functionality
    or information is needed.


    `Cryptlets` bridge the gap in security between on- and off-chain execution of
    programs, operating when additional secure information is needed. They’re what
    lets your customer relationship management (`CRM`) or trading platform connect
    with your cloud storage and then be secured with `Ethereum`, for example.


    `Bletchley`’s middleware works in tandem with `Cryptlets` and existing `Azure`
    services, like `Active Directory` and `Key Vault`, and other blockchain ecosystem
    technologies, to deliver a complete solution and ensure the reliable operation
    of your blockchain integration.


    [Table 10-1](#text00015.html#c10-tbl-0001) shows the difference between an oracle
    and a `Cryptlet`. from the Devcon 2 presentation on `Bletchley`.


    [TABLE 10-1](#text00015.html#rc10-tbl-0001) Cryplets vs. Oracles


    | || `Cryptlets` || `Oracles` |

    | --- | --- | --- |

    | Verification requirements || Requires trust with verification with a trusted
    host (HTTPS), a trusted Cryptlet key, and a trusted enclave signature. || Requires
    trust but no formal verification. |

    | --- | --- | --- |

    | Infrastructure || Standard infrastructure. You achieve hardware-based isolation
    and attestation via enclaves available globally in `Azure`. `Bletchley` `Cryptlet`
    software development kit (`SDK`) frameworks (Utility and Contract) are available
    to help you get started quickly creating and consuming `Cryptlets`. || Customized
    infrastructure. You can write and host separately. Establishing trust is difficult.
    Oracles have been platform specific, and documentation is currently very sparse.
    |

    | Developer use || Many language options are available, and they are blockchain
    agnostic. || Tied to their own blockchain and few language options. |

    | Marketplace availability || A marketplace is available for publishing and discovery.
    || No common marketplace is available for publishing and discovery. |


    `Cryptlets` are built by developers and sold in `Bletchley`’s marketplace. They
    address many different functionality sets that are essential to building distributed
    ledger-based applications. The market is growing to meet the demands of customers
    who need the necessary functionality, such as secure execution, integration, privacy,
    management, interoperability, and a full set of data services.


    #### Utility and Contract Cryptlets and CrytoDelegates

    There are two types of `Cryptlets`:

    * `Utility`: `Utility` `Cryptlets` provide encryption, timestamping, external
    data access, and authentication. They create a more sound and trusted transactions.

    * `Contract`: `Contract` `Cryptlets` are full delegation engines. They can function
    as autonomous agents or bots. They provide all the execution logic that a smart
    contract normally does but outside of a blockchain.


    `Contract` `Cryptlets` are tied to smart contracts and are created when your smart
    contract is published. They run in parallel with your virtual machine and have
    greater performance over traditional smart contracts built inside blockchains
    because they don’t require as much cryptocurrency to execute. They’re most attractive
    to noncryptocurrency blockchains users where chaincode and smart contracts are
    signed by known parties.


    [Figure 10-2](#text00015.html#c10-fig-0002) shows a depiction of a Cryplet container
    and the secure communication path to your smart contract.


    ![ FIGURE 10-2: A Cryplet container.](Image00026.jpg)


    [FIGURE 10-2:](#text00015.html#rc10-fig-0002) A Cryplet container.

