  trans: "\nHyperledger 的技术指导委员会确保这些不同技术之间的稳健性和互操作性。希望跨行业、开源协作能够推动区块链技术发展，并通过在众多组织之间分摊研发成本，创造数十亿美元的经济价值。\n\
    \nHyperledger 正在识别并解决区块链技术生态系统中缺失的重要特性和需求。它也在推动跨行业的分布式账本开放标准，并为开发者贡献以构建更好的区块链系统提供开放空间。\n\
    \nHyperledger 的项目生命周期与 Linux Foundation 相似。首先提交提案，然后被接受的提案进入孵化阶段。当项目达到稳定状态时，它将毕业并进入活跃状态。迄今为止，所有\
    \ Hyperledger 项目都处于提案或孵化阶段。每个项目都由大型企业或初创公司领导。例如，Fabric 由 IBM 领导，Sawtooth 由 Intel\
    \ 领导，Iroha 由初创公司 Soramitsu 领导。\n\nHyperledger 与许多开源项目一样，使用 GitHub ( [ `www.github.com/hyperledger`\
    \ ](http://www.github.com/hyperledger) ) 和 Slack ( [ `https://slack.hyperledger.org`\
    \ ](https://slack.hyperledger.org) ) 来与每个项目的工作团队保持联系。这些是获取最新更新并了解这些项目开发进展的绝佳场所。\n\
    \n# 专注于 Fabric\n\nHyperledger 的第一个孵化项目 Fabric 是一个许可区块链平台。它像大多数区块链一样维护数字事件的账本。这些事件被结构化为交易并在不同参与者之间共享。交易是在没有加密货币的情况下执行的。供你深入了解该主题的可选资源位于\
    \ [ `https://trustindigitallife.eu/wp-content/uploads/2016/07/marko_vukolic.pdf`\
    \ ](https://trustindigitallife.eu/wp-content/uploads/2016/07/marko_vukolic.pdf)\
    \ 。\n\n所有交易都是安全、私密和保密的。Fabric 只能由参与者达成共识后进行更新。一旦记录被输入，就永远无法更改。\n\nFabric 是一种关注可扩展性并符合法规的企业解决方案。所有参与者必须向会员服务注册身份证明才能访问系统。Fabric\
    \ 发出与拥有参与者无法关联的派生证书交易，从而在网络上提供匿名性。此外，每笔交易的内容都经过加密，以确保只有预期的参与者可以看到内容。\n\nFabric\
    \ 具有模块化架构。你可以通过实现其协议规范来添加或移除组件。其容器技术可以处理智能合约开发的大多数主流语言。\n\n另一方面，比特币允许任何人匿名参与，并且社区一直在寻找实现抗审查和赋能被剥夺权利者的方式。比特币也主要为其加密货币代币的流通和安全性而设计。因此，将比特币的最佳实践与\
    \ Fabric 进行比较可能是不公平的。\n\n## 在 Fabric 中构建你的系统\n\nFabric 的可访问性已投入大量工作，但它仍然只有技术娴熟的人才能接近。\n\
    \nHyperledger 已详细说明了其技术将针对的多个用例。未来不久，你将能够通过直观的用户界面在所述用例上使用 Fabric。目前，你可以在核心开发者的帮助下开发和测试所列用例。\n\
    \n## 深入链码开发\n\n两个当事人之间的合同可以通过 Chaincode 翻译成 Hyperledger Fabric 上的代码。Chaincode\
    \ 是 Hyperledger 对以太坊智能合约的版本。它以双方都可信赖的方式自动化合同中达成的协议。\n\nChaincode 如以太坊的智能合约一样是图灵完备的。目前，你可以让一名\
    \ Java 开发者为你构建链码合约。Fabric 团队已准备了一些常见用例，例如数字货币和发送短信，作为核心框架的一部分。\n\nFabric 团队也在探索其他有趣的业务用例，这些用例在撰写本文时尚未完成，但到你阅读本文时可能已可用。\n\
    \nHyperledger 仍处于早期开发阶段，其项目大约落后于以太坊的工作两年。然而，每个项目都有大量团队和资源投入：\n\n*   **业务合同：**\
    \ Hyperledger 已想出同时拥有公共合同和私有合同的方法。私有合同在两个或多个当事人之间，并包含机密信息。公共合同可供任何花时间在 Hyperledger\
    \ 中搜索的人查看。例如，你可能会使用公共合同来公开提供出售产品，或作为征求合同投标的方式。\n\n    这些合同的构成比传统合同更复杂，因为仲裁和第三方执行被取消了。此外，还需要参与合同的个人的身份验证。而且，大多数合同都是独特的，无法标准化。合同越复杂，从其原始意图被破坏的地方就越多。Hyperledger\
    \ 正在努力创建一个合同管理系统，以帮助增强 Chaincode 的可扩展性。\n\n*   **制造供应链：** 供应链管理是正在 Fabric 上探索的有趣的区块链方案。最终装配商可以管理在创建产品时使用的所有零部件和物资。此功能将使你能够响应需求并能够追溯每个部件的来源至原始生产商。在产品召回的情况下，很容易找到罪魁祸首，或在部件被利用前判断每个部件的真实性。\n\
    \n    Fabric 在准备好用于此用例之前还需要更多开发，因为它需要让供应链中的每个人都能轻松访问。Fabric 团队正在研究一项标准协议，以允许供应链网络上的每个参与者输入并跟踪在特定产品上生产和使用的编号部件。\n\
    \n    完成后，此用例将允许随时对每个产品的生产进行深度搜索。这可能在任何一件物品的生产中深入十层或更多。消费者然后可以确定由其他组件商品和物资构成的任何制成品的来源。这可能对消费产生有趣的社会影响。\n\
    \n*   **证券和资产：** 证券和其他资产非常适合区块链，因为它们可以自动化第三方执行的许多功能。Fabric 将允许资产的所有利益相关者直接访问该资产及其构成和历史，绕过现在持有该信息的中间商。Fabric\
    \ 还会将资产的结算时间加快至接近实时。\n\n*   **直接通信：** 未来，Fabric 也可被用作公司发布公告和要约的场所。例如，如果一家公司想要筹集资金并需要在实时通知所有股东要约的完整细节，它就可以做到。像以太坊的去中心化自治组织（DAO）一样，股东可以做出决策并执行它们。他们的决策将被实时处理和结算。这将使股东会议和投票变得更加容易和快速。\n"
