    ## 21

    21 的其中一种设备是可嵌入的挖矿芯片，名为 BitShare。它可以作为独立芯片嵌入到联网设备中，或作为 IP 区块集成到现有芯片组中。BitShare
    可为各种应用生成数字资产流。


    21 还做另外四件事。它拥有

    * 可下载的应用程序，可在任何国家快速获取比特币，无需银行账户或信用卡

    * 一个市场，你可以在其中与全球开发者用比特币买卖 API 调用，并通过一行代码添加比特币微支付

    * 一个仪表板，可监控你的比特币收益和网络活动

    * 一个系统，让你能与开发者连接并托管你的机器可支付 API


    ## Dash 上的匿名交易

    Dash ( [`www.dash.org`](http://www.dash.org) ) 是首个以比特币为蓝本的加密货币。Dash 的开发者希望为交易增加更多隐私。（在比特币网络上，任何人都可以查看你的交易历史。）因此，Dash
    允许你将资金和财务交易保持私密。它通过混合协议实现这一点，该协议通过混合多个参与者的交易，将其资金合并在一起，使其无法分离。这是通过名为 *masternodes*
    的去中心化服务器网络完成的。


    Dash 计划成为首个以保护为驱动的加密现金，具有完全编码的兑换和私有区块交易。Dash 借记卡可在全球任何 ATM 或商店使用。它们也可以指定为各种货币标准，如美元、欧元或英镑。


    Dash 具有以下功能：

    * **Privacy:** 它将你的所有付款、交易和余额保持私密，以便无人可以追踪你。

    * **Speed:** 它使用 InstantX 技术与 masternode 网络在数秒内完成交易。

    * **Security:** 先进的加密和可信协议使系统安全。

    * ** Global reach:** Darksend 使其成为一个全面的系统，使你能够快速且匿名地向全球发送资金。

    * **Low fees:** 资金转账交易仅需几美分。


    Dash 还提供两种钱包——在线版本和可下载到电脑的版本。


    ## ConsenSys：去中心化应用

    ConsenSys ( [`www.consensys.net`](http://www.consensys.net) ) 由以太坊创始人之一创建。它构建去中心化应用、企业区块链解决方案以及面向以太坊区块链生态系统的各种开发者工具。


    ConsenSys 正与微软合作创建开源区块链身份系统。此次合作源于联合国 ID2020 提出的需求，其目标是遏制因缺乏身份识别而导致的人类罪行。计划是在
    2020 年前为每个人提供合法身份。


    ConsenSys 开发了 uPort 身份解决方案，集成了声誉系统和交易安全支持。uPort 系统允许个人以便携且持久的方式在以太坊区块链上管理其身份要素。


    世界上欠发达地区的用户可以建立自己的身份和声誉。


    RepSys 增强了 uPort 系统的功能。它使个人、组织和“物”能够证明其交易对手在各种交易中的行为。可以将其视为身份的亚马逊评价。uPort 持有声誉属性。这些既可以是官方事物，如政府颁发的身份证件，也可以是
    Facebook 页面。ConsenSys 还在构建 KYC 解决方案，以便金融机构提供金融服务。


    ## 关于作者

    Tiana Laurence 是 Factom, Inc. 的联合创始人，也是早期的比特币爱好者。她的热情在于培育伟大的公司。作为一名连续创业者，Tiana
    在 16 岁时创办了第一家企业。她喜欢帮助年轻有志创业者学习商业和技术。Tiana 拥有波特兰州立大学商业与领导学学士学位。当 Tiana 不在工作或沉迷于技术时，你可以在德克萨斯州奥斯汀的跑步或攀岩中找到她。


    ## 献词

    这本书献给 Crystal 和 Jessica，感谢她们在写作过程中给予我的所有支持和鼓励。


    ## 作者致谢

    本书是许多人想法和工作的结晶。如果没有开放且支持的区块链和加密货币世界，本书就不可能实现。我要特别感谢 Paul Snow、Peter Kirby、Brian
    Deery 和 David Johnston 花无数小时教我区块链和密码学。我还要感谢 Abhi Dobhal、Lawrence Rufrano、Ryan
    Fugger、Charley Cooper、Alyse Killeen、Jeremy Kandah、Clemens Wan、Greg Wallace、Brian
    Behlendorf、Amir Chetrit、Jared Tate、Casey Lawlor 和 Scott Robinson 在不断发展的区块链领域给予我的指导，并在百忙之中抽出时间审阅和校对我的工作。


    本书的编辑工作也花了很多时间。我不是开玩笑，真的花了很多编辑时间。我的项目编辑 Elizabeth Kuball 很好地让我保持任务和进度，而我的执行编辑
    Steve Hayes 使整本书成为可能。我还要再次感谢 Scott Robinson 详尽的技术审阅和优秀建议，以及编辑 Pat O’Brien 和所有幕后人员，他们做了无名的辛苦工作才让本书面世。我永远欠他们一份人情。


