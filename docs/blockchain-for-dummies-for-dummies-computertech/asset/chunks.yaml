- raw: "2.  **Enter your vanity address in the Search box and press Enter.**\n\n \
    \   The transaction page appears.\n\nThat’s all it takes to find your transaction\
    \ and read the massage that you built into the address.\n\n## Using Smart Contracts\
    \ with Bitcoin\n\nA *smart contract* is autonomous software that can make financial\
    \ decisions. The blockchain world is abuzz about smart contracts because they’re\
    \ both amazing and terrifying in their implications for how the world economy\
    \ operates.\n\nIn simple terms, a smart contract is a written contract that has\
    \ been translated into code and build as complex if-then statements. The contract\
    \ can self-verify that conditions have been met to execute the contract. It does\
    \ this by pulling trusted data from outside sources. Smart contracts can also\
    \ self-execute by releasing payment data or other types of data. They can be built\
    \ around many different types of ideas and do not need to be financial in nature.\
    \ Smart contracts can do all this while remaining tamper resistant from outside\
    \ control.\n\nBlockchain technology allowed smart contracts to come into existence\
    \ because smart contracts offer the permanence and corrupt resistances that were\
    \ once provided only by paper, ink, and a trusted authority to enforce it all.\
    \ Smart contracts are a revolution in how we conduct business. They ensure that\
    \ a contract will be executed as it was written. No outside enforcement is needed.\
    \ The blockchain acts as the intermediary and enforcer.\n\nSmart contracts are\
    \ a big deal because when machines start executing contracts, it becomes difficult\
    \ or impossible to undo. It also brings up an important nature of these instruments\
    \ that can’t be overlooked and my first law of smart contracts: *She who controls\
    \ the data, controls the contract.* All smart contracts verify an external data\
    \ feed to prove performance and release payment to the correct party.\n\n![warning](Image00006.jpg)Although\
    \ smart contracts are a revolutionary new technology, they can’t yet interpret\
    \ the *intent* of the parties entering into the contract. Legal contracts in our\
    \ society rely on people to interpret what the parties entering into the contract\
    \ meant. Computers (at least so far) can only understand code, not the intent\
    \ of the parties.\n\n### Building your first smart bond\n\nA *smart bond* is a\
    \ type of smart contract that can hold and release an object of value on its own,\
    \ while also monitoring payments in various currencies using spot price data feeds.\
    \ Many different types of smart contracts exist, and new ones are being invented\
    \ every day.\n\nFollow these steps to build your first smart bond:\n\n1.  **Go\
    \ to the SmartContract website (** [ `www.smartcontract.com` ](http://www.smartcontract.com)\
    \ **).**\n\n2.  **Click Sign Up.**\n\n    The Sign Up page appears.\n\n3.  **Enter\
    \ an email address and password and click Create an Account.**\n\n    SmartContract\
    \ sends you an email with a confirmation link.\n\n4.  **Click the link in the\
    \ email sent to you by SmartContract to verify your account and log in.**\n\n\
    5.  **Click Create Contract.**\n\n6.  **Click the Smart Bond tab (see** [**Figure\
    \ 3-2**](#text00006.html#c03-fig-0002) **).**\n\n7.  ** Click the Create Contract\
    \ button.**\n\n    You’re ready to build your first if-then statement.\n\n8. \
    \ **Click the Smart Terms tab.**\n\n    Smart contracts verify an outside data\
    \ feed to prove the performance of your contract and trigger the release of payment.\
    \ Here you choose the conditions that will trigger your smart contract.\n\n9.\
    \  **Choose Performance Monitoring.**\n\n    Performance monitoring will look\
    \ to see if an action has been taken outside of the contract. In your case, this\
    \ will be the movement of funds from one account to another.\n\n10.  **In the\
    \ If Payment To field, enter one of your Bitcoin addresses (created earlier in\
    \ this chapter).**\n\n11.  **In the Is field, enter a small dollar amount that\
    \ you would like to transfer from one Bitcoin address to the other.**\n\n12. \
    \ **In the By Expiration Date field, enter a date a few days from now.**\n\n \
    \    This sets the time parameters that the contract will use to monitor outside\
    \ sources.\n\n13.  **Click the Description tab (see** [**Figure 3-3**](#text00006.html#c03-fig-0003)\
    \ **).**\n\n14.  ** In the Smart Contract Title field, enter a name for your contract.**\n\
    \n15.  **In the Brief Description field, enter — you guessed it! — a brief description\
    \ of the contract.**\n\n     The description should act as a brief summary of\
    \ the agreement’s purpose. Here you can also attach a legal document or other\
    \ data, such as a image.\n\n16.  **Click the Attachments section.**\n\n     ![warning](Image00006.jpg)Smart\
    \ contracts are new technology and can have hiccups. It is best to only attach\
    \ things that are unimportant and that you’d be okay exposing publicly.\n\n17.\
    \  **Click Attach Documents.**\n\n     You can attach an image or a PDF.\n\n18.\
    \  **Click the Sign & Send tab.**\n\n19.  **In the Address field, enter your email\
    \ address to send yourself the contract.**\n\n20.  **Click the Finalize Contract\
    \ button.**\n\n     Now your contract will be monitoring the Bitcoin blockchain\
    \ to monitor whether you send funds to the Bitcoin wallet address that you listed\
    \ earlier.\n\n21.  **Return to your Bitcoin wallets and send funds between the\
    \ two wallets.**\n\n     Make sure to use the address and a little more than the\
    \ amount that you listed on the contract in Steps 10 and 11. When the contract\
    \ you created sees the record of the transaction of the Bitcoin blockchain, you’ll\
    \ be notified by email.\n\n     ![remember](Image00004.jpg)The Bitcoin network\
