    # Ripple Protocol Overview


    A financial participant must trust the issuers of assets they hold, and a node
    operator must trust the other nodes in its validator list not to collude to block
    valid transactions from being confirmed. It is all about trust and aligned incentives
    for cooperation.


    The Ripple network finds a trusted path to exchange all the different types of
    value within its distributed network. The cryptocurrency for Ripple, XRP, is used
    to facilitate trade between unlike things of values that have a low trading volume
    or no trusted path. Between the nodes, the network, and the financial participant,
    Ripple has built the basic infrastructure that optimizes the modern payment process
    and exchanges globally.


    In this section, I cover the core functions that the Ripple protocol enables for
    the banking industry.


    ## Core Functions


    There are two critical functions the Ripple network provides:


    ### It acts as a common ledger to connect banks and payment networks

    This allows banks and payment networks to clear transactions in five seconds.
    It also gives users continuous connectivity between each other, and has constant
    monitoring of the flow of transactions across the network.


    ### It acts as a neutral transaction protocol

    Ripple transfers value bilaterally for the same type of value. For cross-currency
    transactions, Ripple sources funds from its marketplace of liquidity providers.
    This is a big deal, because liquidity is a major problem for many markets.


    Banks are very excited about this technology because it allows them to move away
    from intermediaries and clearinghouses to a faster, cheaper, and less risky system.
    Banks have dramatically sped up the process of cross-border payments by removing
    the need for paper and intermediaries.


    Ripple also helps banks reduce risk and cut operational costs of foreign exchange
    operations by enabling them to directly transact with other banks globally and
    sourcing liquidity from Ripple’s open marketplace of third parties.


    ## Advantages


    The main advantages Ripple offers are the following:


    * Real-time payments

    * Comprehensive transaction traceability

    * Near-instant reconciliation

    * The ability to convert almost any type of currency, commodity, or token


    ## Seeing How Ripple Differs from Other Blockchains


    Ripple, like Bitcoin, is neutral and decentralized software. Almost anyone can
    use Ripple as an open standard to facilitate connectivity and interoperability.


    Ripple is significantly different from Bitcoin in its structure and the way the
    network operates. Ripple is finding the most efficient exchange route, structuring
    transactions as debts, and using its cryptocurrency as the exchange mechanism
    between the different types of value that are traded on the Ripple network.


    Ripple is all about trust, whereas other blockchains, for the most part, are about
    trustless systems. In Bitcoin, any two parties can send one another Bitcoin tokens
    and the network then validates that no one is cheating in that transaction. Part
    of the way Bitcoin balances every block of transactions is to check to make sure
    that all the tokens involved have only been spent once.


    Another significant difference is that Ripple does not use proof-of-work consensus.
    The Ripple team has eliminated the large power burden needed by most blockchains
    to secure themselves. In doing so, Ripple uses significantly less electricity
    and is faster than traditional blockchains. You can dive deeper into how Ripple
    works by checking out the whitepaper at [`https://ripple.com/files/ripple_consensus_whitepaper.pdf`](https://ripple.com/files/ripple_consensus_whitepaper.pdf).


    Ripple works very differently from other blockchains. One of the most noteworthy
    differences is how the network is decentralized and comes to consensus. The nature
    of decentralization in Ripple is subtle. A node can put any other nodes it wants
    into its validator list in order to listen to what transactions those nodes want
    to confirm. The only requirement is that there is sufficient overlap between each
    node’s validator lists, so the network doesn’t accidentally come to multiple different
    consensuses.


    Ripple manages that by having each node maintain its own validator list, including
    Ripple’s own nodes. This ensures that there is sufficient overlap. As a node’s
    network grows, the node’s list will include more and more validators from well-known
    trustworthy and independent institutions around the world. Over time, Ripple’s
    consensus process will become more and more decentralized.


    Beyond how decentralization and consensus work on Ripple, here are some other
    important ways in which Ripple differs from Bitcoin:


    ### Ripple is in the middle

    Ripple is software that acts as middleware between financial products and institutions.
    If you plan to use the Ripple network, you’ll likely need to be a licensed money
    services provider or mobile money operator.

    The Bitcoin protocol is open for anyone to utilizes as he or she sees fit. Regulation
    may change, but at this time, you don’t have to be licensed to use Bitcoin.

    Any developers can get up and running on Ripple, but using the Ripple software
    may be illegal if you aren’t licensed to do so. This is one of the reasons that
    Ripple targets large financial institutions as their users. Bitcoin can be used
    by everyone, and it’s specifically useful for small transactions.


    ### Ripple is based on a consensus algorithm rather than mining

    It uses probabilistic voting among trusted nodes. This type of consensus allows
    the nodes to come to agreement and confirm transactions in five seconds. With
    Bitcoin, a transaction may take hours.


    ### Assets inside of Ripple, except XRP (the native token of Ripple), exist as
    debts

    Bitcoin on the other hand only accounts for the transfer of the Bitcoin token
    between Bitcoin addresses. Outside markets assess the value of the Bitcoin token.


    ### The supply of XRP is set at 100,000,000,000, and Ripple owned and created
    all 100 billion XRP units at the outset of the network

    They then distributed the XRP to owners of the company and others.

    Bitcoin creates new Bitcoin tokens every time it creates a new block. The new
    tokens are awarded to nodes that win the blocks during consensus. Over time, the
    supply increases. Algorithmically, Bitcoin is set to stop making new Bitcoins
    when it hits 21 million.


    ### Ripple protects itself from spam and denial-of-service attacks by requiring
    a minimum transaction cost

    The standard transaction fee is 0.00001 XRP, which is called ten drops.

    The Ripple protocol will increase the number of drops required, if higher-than-normal
    transaction volumes are seen. This is similar to how Bitcoin protects itself from
    spam, but there is no minimum fee. Bitcoin miners will probably ignore your transaction
    and it won’t be confirmed without including one.


    ### XRP does not need a “trust path” to be traded

    Because of this, it facilitates trade when there is no path between two parties.
    You would need to do an XRP exchange in the middle to facilitate the trade with
    untrusted parties or low-liquidity markets.

    Bitcoin on the other hand is a trustless system. It allows any two parties to
    trade, even if the parties don’t know or trust one another — but the trade is
    limited to the Bitcoin token. This extra feature in Ripple allows users to exchange
    just about anything.


    ### Ripple picks the nodes used to secure their consensus system for their network

    It isn’t quite as open as Bitcoin, where anyone can participate fully in the network.
    This means that Ripple is somewhat centralized, but it will become more decentralized
    over time.


    ## Unleashing the Full Power of Ripple

    '
  trans: '

    # Ripple 协议概述


    金融参与者必须信任其持有的资产的发行方，而节点运营商必须信任其验证者列表中的其他节点不会串谋阻止有效交易被确认。这完全关乎信任以及合作的激励一致性。


    Ripple 网络在分布式网络内寻找交换各种不同类型价值的信任路径。Ripple 的加密货币 XRP 用于促进交易量低或没有信任路径的价值不相同时物的交易。在节点、网络和金融参与者之间，Ripple
    建立了优化现代支付流程和全球兑换的基础设施。


    在本节中，我将介绍 Ripple 协议为银行业提供的核心功能。


    ## 核心功能


    Ripple 网络提供两个关键功能：


    ### 充当连接银行和支付网络的共同账本

    这使得银行和支付网络能够在五秒内清算交易。它还使用户之间保持持续连接，并对网络中交易的流动进行持续监控。


    ### 作为中立的交易协议

    Ripple 对同一种价值进行双边价值转移。对于跨境货币交易，Ripple 从其流动性提供商市场中获取资金。这意义重大，因为流动性是许多市场的重大问题。


    银行对这项技术非常兴奋，因为它使他们能够摆脱中介和清算所，转向更快、更便宜、风险更低的系统。银行通过消除纸质文件和中介的需要，极大地加快了跨境支付流程。


    Ripple 还通过使银行能够直接与全球其他银行交易并从 Ripple 开放的第三方市场获取流动性，帮助银行降低风险并削减外汇操作的运营成本。


    ## 优势


    Ripple 的主要优势如下：


    * 实时支付

    * 全面的交易可追溯性

    * 近乎即时的对账

    * 能够转换几乎任何类型的货币、商品或代币


    ## Ripple 与其他区块链的不同之处


    Ripple 与比特币一样，是中立且去中心化的软件。几乎任何人都可以将 Ripple 作为开放标准来促进连接性和互操作性。


    Ripple 在结构和网络运行方式上与比特币有显著不同。Ripple 寻找最有效的兑换路径，将交易结构化为债务，并使用其加密货币作为在 Ripple 网络上交易的各种价值之间的交换机制。


    Ripple 完全关乎信任，而其他区块链在很大程度上关乎无信任系统。在比特币中，任何两个参与方都可以相互发送比特币代币，网络随后验证交易中没有人作弊。比特币平衡每个交易块的方式之一是检查所有涉及的代币是否只被花费过一次。


    另一个显著区别是 Ripple 不使用工作量证明共识。Ripple 团队消除了大多数区块链为确保自身安全所需的大量电力负担。因此，Ripple 使用的电力显著更少，且比传统区块链更快。你可以通过查阅白皮书深入了解
    Ripple 的工作原理，链接为 [`https://ripple.com/files/ripple_consensus_whitepaper.pdf`](https://ripple.com/files/ripple_consensus_whitepaper.pdf)。


    Ripple 与其他区块链的工作方式非常不同。其中最值得注意的区别之一是网络如何实现去中心化和达成共识。Ripple 中去中心化的性质很微妙。节点可以将任意其他节点放入其验证者列表中，以便监听这些节点希望确认的交易。唯一的要求是每个节点的验证者列表之间有足够的重叠，以防止网络意外达成多个不同的共识。


    Ripple 通过让每个节点维护自己的验证者列表（包括 Ripple 自身的节点）来管理此事。这确保了足够的重叠。随着节点网络的增长，节点的列表将包含来自全球知名、可信且独立机构的越来越多验证者。随着时间的推移，Ripple
    的共识过程将变得越来越去中心化。


    除了 Ripple 上去中心化和共识的工作方式外，以下是 Ripple 与比特币不同的其他重要方式：


    ### Ripple 处于中间

    Ripple 是作为金融产品和机构之间中间件的软件。如果你计划使用 Ripple 网络，你很可能需要成为持牌的货币服务提供商或移动货币运营商。

    比特币协议对任何人开放，可按其意愿使用。监管可能会发生变化，但目前你不需要持牌即可使用比特币。

    任何开发者都可以快速在 Ripple 上运行，但如果你没有获得许可，使用 Ripple 软件可能违法。这就是 Ripple 将大型金融机构作为其用户的原因之一。比特币可供所有人使用，且特别适用于小额交易。


    ### Ripple 基于共识算法而非挖矿

    它使用受信任节点之间的概率投票。这种共识类型允许节点在五秒内达成一致并确认交易。而在比特币中，一笔交易可能需要数小时。


    ### Ripple 内部的资产，除 XRP（Ripple 的原生代币）外，均以债务形式存在

    另一方面，比特币仅核算比特币地址之间比特币代币的转移。外部市场评估比特币代币的价值。


    ### XRP 的供应量设定为 100,000,000,000，Ripple 在网络启动之初拥有并创建了全部 1000 亿个 XRP 单位

    随后他们将 XRP 分配给公司所有者和其他人。

    比特币每次创建新区块时都会创建新的比特币代币。新代币奖励给在共识期间赢得区块的节点。随着时间的推移，供应量增加。从算法上讲，比特币设定在达到 2100 万时停止制造新比特币。


    ### Ripple 通过要求最低交易成本来保护自己免受垃圾邮件和拒绝服务攻击

    标准交易费用为 0.00001 XRP，称为十滴。

    如果看到高于正常的交易量，Ripple 协议将提高所需滴数的数量。这与比特币保护自己免受垃圾邮件的方式类似，但没有最低费用。比特币矿工可能会忽略你的交易，如果不包含费用就不会被确认。


    ### XRP 交易不需要“信任路径”

    因此，当双方之间没有路径时，它可促进交易。你需要在中间进行 XRP 兑换，以促进与不受信任的各方或流动性低的市场之间的交易。

    另一方面，比特币是一个无信任系统。它允许任何两个参与方交易，即使各方彼此不认识或不信任——但交易仅限于比特币代币。Ripple 的这一额外功能允许用户交换几乎任何东西。


    ### Ripple 选择用于保护其网络共识系统的节点

    它并不像比特币那样开放，任何人都可以完全参与网络。这意味着 Ripple 在某种程度上是中心化的，但随着时间的推移它将变得更加去中心化。


    ## 释放 Ripple 的全部潜力

    '
