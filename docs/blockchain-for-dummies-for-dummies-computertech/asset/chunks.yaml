- raw: "    *   **Check your space.** If you have more than the default dev space,\
    \ verify that you’re deploying the service in the intended space.\n\n    *   **Check\
    \ your app.** Leave it unbound.\n\n    *   **Check your service name.** Change\
    \ the name to something that’s easy to remember.\n\n    *   **Check your selected\
    \ plan.** Select the free plan.\n\n4.  **Click Create.**\n\nYour IBM Blockchain\
    \ will deploy to Bluemix and give you two peer nodes initially.\n\nThere is huge\
    \ potential for developing cost-saving IoT applications using blockchain. Distributed\
    \ ledgers with embedded smart contracts can improve security and trust, and automate\
    \ processes. The IBM Watson IoT Platform can be combined with Bluemix-based blockchain\
    \ services to provide a ready-to-deploy platform for blockchain-based and open-standards-based,\
    \ IoT applications.\n\n![tip](Image00003.jpg)The development and testing of these\
    \ implementations are straightforward but will require the support of a developer.\n\
    \nFollow these steps to set up your first project:\n\n1.  **Set up your private\
    \ blockchain infrastructure on Bluemix.**\n\n    You need a developer to set up\
    \ the integration of your private blockchain based on the IBM Blockchain service.\n\
    \n2.  **Develop and deploy smart contracts in the blockchain based on device data.**\n\
    \n    An example of this would be to have a contract modify payment of the shipments\
    \ of goods if it was delivered after its due date.\n\n3.  **Connect your devices\
    \ to the IBM Watson IoT Platform.**\n\n    You need to have your developer connect\
    \ the sensors/gateway to the Watson IoT Platform. When that’s done, the IoT devices\
    \ will send data to be filtered, aggregated, and published to your blockchain.\n\
    \n4.  **Integrate your IoT device’s data with the blockchain distributed ledger.**\n\
    \n    Have your developer integrate the Watson IoT Platform so it can send data\
    \ to IBM Blockchain services running in Bluemix.\n\n5.  ** Install your monitoring\
    \ UI.** \n\n    1.  Enable blockchain in the Settings tab.\n\n    2.  Configure\
    \ the connection to the Blockchain service.\n\n    3.  Click the Add button and\
    \ fill in the Blockchain service details in the pop-up dialog box.\n\n    4. \
    \ Confirm all your changes.\n\n    5.  Select the blockchain menu to map the device\
    \ data. You may need your developer’s support here.\n\n    6.  Follow the wizard\
    \ and provide the required inputs to finish mapping the device data to the blockchain\
    \ contract.\n\n6.  **Deployed the Chaincode ID.**\n\n    When the real-time data\
    \ arrives, smart contracts are executed on the data. Based on the outcome, a transaction\
    \ is completed and recorded in the digital ledger and then shared with all peers.\n\
    \n7.  **Develop client applications for end users.**\n\n    A few challenges need\
    \ to be overcome on the IBM system and in the early IoT blockchain development.\
    \ Many IoT devices have limited computing power or are hard to modify. Encrypting\
    \ and verifying data requires processing power and may cause issues with battery\
    \ life.\n\nNow you can create your own Chaincode contract. You may need the help\
    \ of your developer because it requires using GitHub and GoLang. Here’s a high-level\
    \ overview of the process so you can see the needs of this type of project:\n\n\
    1.  **Create a GitHub project.**\n\n    This is where you’ll store your smart\
    \ contracts.\n\n2.  **Set up a local Hyperledger development and testing environment.**\n\
    \n    You need to install a few things on your computer including Docker, Pip,\
    \ Git client, Go, and Xcode for Mac users. Review [Chapter 3](#text00006.html#a1)\
    \ for instructions on how to set up Docker.\n\n3.  **Download the IBM sample smart\
    \ contracts.**\n\n    ![tip](Image00003.jpg)This step is optional but will make\
    \ building your first contract easier.\n\n4.  **Create a test smart contract.**\n\
    \n5.  ** Build out your contract executables.**\n\n    Your contract must convert\
    \ an executable. The sample has the contract executables built in.\n\n6.  **Test\
    \ the contract in the Hyperledger sandbox.**\n\n7.  **Deploy the contract in GitHub.**\n\
    \nCongratulations! You’ve set up your IBM contract. You can go back later and\
    \ map the contract to an IoT device in your Bluemix dashboard.\n\n Part 4\n\n\
    # Industry Impacts\n\nIN THIS PART …\n\nUnderstand the future of the financial\
    \ services industry when it utilizes blockchain technology to move money around\
    \ the world quickly and inexpensively.\n\nClarify your knowledge of global real\
    \ estate as it relates to blockchain technology.\n\nIdentify opportunities in\
    \ the insurance industry to reduce fraud and increase profits through new insurance\
    \ instruments.\n\nExamine the large-industry implications of permanent systems\
    \ within government organizations and legal frameworks.\n\nClarify other large\
    \ global trends in blockchain technology and how they’ll shape the world you live\
    \ in and the everyday tools you use.\n\nChapter 12\n\n# Financial Technology\n\
    \nIN THIS CHAPTER\n\n![check](Image00001.jpg)**Discovering future global bank\
    \ trends**\n\n![check](Image00001.jpg)**Uncovering new investment vehicles**\n\
    \n![check](Image00001.jpg)**Exposing risk in the banking blockchain**\n\n![check](Image00001.jpg)**Developing\
    \ new financing strategies**\n\nThe first to adopt blockchain technology were\
    \ banks, governments, and other financial institutions — and they’re the fasting-growing\
    \ blockchain users, too. The powerful tools that are being built to manage and\
    \ move money will reshape our world in new and unexpected ways, so it makes sense\
    \ that financial technology (fintech) would jump onboard.\n\nThis chapter gives\
    \ you the inside scoop on what governments are currently doing with blockchain\
    \ technology and how it will affect you. Fintech touches your life every day,\
    \ whether you’re aware of it or not.\n\nIn this chapter, I introduce you to future\
    \ banking trends, new regulations, and the new tools that can help you move money\
    \ faster and cheaper. I also explain new types of investment vehicles and other\
    \ blockchain innovations. Finally, I warn you about potential risks of investments\
    \ involving virtual currency and new blockchain-technology-enabled financial products.\n\
    \n## Hauling Out Your Crystal Ball: Future Banking Trends\n\nBanking was the first\
    \ industry to recognize the threat of Bitcoin and then the potential of blockchain\
    \ to transform the industry. The banking sector is highly regulated, and the fees\
    \ to organize and operate as a bank are expensive. These heavy  regulations have\
    \ been an insulating and protective shield for the whole industry, as well as\
    \ a burden. The application of fast, efficient, digital money that doesn’t carry\
    \ the cost of handling cash and that is traceable as it moves through the financial\
    \ system was an intoxicating and threatening proposal. The idea that value can\
    \ be held outside the control of central authorities also piqued the interest\
    \ of financial institutions and governments that back currencies.\n\nInitially,\
    \ these financial institutions and governments tried to squelch blockchain with\
    \ regulation. Today, they’re embracing blockchain through investment across the\
    \ board.\n\nIn 2013 and 2014, the U.S. Securities and Exchange Commission (SEC)\
    \ issued a warning to investors about the potential risks of investments involving\
    \ virtual currency. The warning was that investors might be enticed with the promise\
    \ of high returns and would not be skeptical enough of the new investment space\
    \ that was so novel and cutting-edge. According to the SEC, digital currency was\
    \ one of the top ten threats to investors. Today, the SEC stands ready to engage\
    \ with companies and investors as cryptocurrency gains traction within all industries."
