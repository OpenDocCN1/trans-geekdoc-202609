- raw: "Blockstream ( [ `www.blockstream.com` ](http://www.blockstream.com) ) has\
    \ an excellent reputation in providing blockchain technologies and has a primary\
    \ focus on distributed systems. Blockstream offers hardware and software solutions\
    \ to organizations utilizing blockchain-based networks.\n\nBlockstream Elements\
    \ is the core software platform of the company and a segment of an open-source\
    \ project. It offers several resources and a highly productive protocol for blockchain\
    \ developers.\n\nBlockstream’s major field of innovation is in sidechains, which\
    \ scale the utility of existing blockchains, enhancing their privacy and functionality\
    \ by adding features like smart contracts and confidential transactions. Sidechains\
    \ avoid liquidity shortages that many cryptocurrencies experience. Sidechains\
    \ also permit digital assets to be transferred between different blockchains.\n\
    \nSidechains make it possible to practically trade company shares on a blockchain\
    \ without worrying about transaction cost or slow network speeds. Distributed\
    \ asset  management infrastructure can also leverage the Bitcoin network, permitting\
    \ individuals and organizations to issue different asset classes.\n\nBlockstream\
    \ also has worked to create the Lightning Network, a system that lets Bitcoin\
    \ support micropayment without slowing down the network. The Lightning Network\
    \ support high volumes of small payments using proportional transaction fees and\
    \ operating very fast. It’s developing more Bitcoin Lightning prototypes and creating\
    \ consensus and interoperability.\n\n## OpenBazaar’s Blockchain\n\nOpenBazaar\
    \ ( [ `www.openbazaar.org` ](http://www.openbazaar.org) ) is an open-source project\
    \ that built a decentralized network for peer-to-peer digital commerce. Instead\
    \ of traditional models where buyers and sellers go through a centralized service,\
    \ like Amazon or eBay, the OpenBazaar platform connects them directly. They also\
    \ utilize Bitcoin’s cryptocurrency to cut out fees and restrictions.\n\nYou need\
    \ to download and install the OpenBazaar program on your computer. It then connects\
    \ you to other people looking to buy and sell goods and services. It’s a peer-to-peer\
    \ network that is not controlled by any company or organization. After you download\
    \ the app, it’s easy to set yourself up as a buyer or seller. When you’re ready\
    \ to purchase something, just do a search and see what comes up. It’s kind of\
    \ like an anarchist’s version of eBay.\n\nOpenBazaar may sound a lot like Silk\
    \ Road, but it isn’t. Unlike on Silk Road, users are not anonymous. They can be\
    \ tracked easily with their IP addresses, which makes it very unattractive for\
    \ criminals. You can pull seller location data from the OpenBazaar API and map\
    \ the position of all the participants in the network. There are a few ways to\
    \ hide your location, and more private messaging is being explored, but currently,\
    \ there is little to no illicit trade on the network.\n\nOpenBazaar is working\
    \ to appeal to major merchants and independent retailers. Those who can handle\
    \ Bitcoin transactions and want to save money could gain a competitive advantage\
