  trans: "\n### 检查您的空间。\n如果您拥有超过默认的开发空间，请验证您是否将服务部署在预期的空间中。\n\n### 检查您的应用。\n保持未绑定状态。\n\
    \n### 检查您的服务名称。\n将名称更改为易于记住的内容。\n\n### 检查您选择的计划。\n选择免费计划。\n\n### 单击创建。\n您的 `IBM\
    \ Blockchain` 将部署到 `Bluemix` 并最初提供两个对等节点。\n\n开发节省成本的物联网应用具有巨大潜力。嵌入智能合约的分布式账本可以提高安全性和信任度，并自动化流程。`IBM\
    \ Watson IoT Platform` 可以与基于 `Bluemix` 的区块链服务结合，提供可即时部署的平台，用于基于区块链和开放标准、物联网应用。\n\
    \n![提示](img/Image00003.jpg)\n这些实现的开发和测试很直接，但需要开发人员的支持。\n\n## 按照以下步骤设置您的第一个项目\n\
    1. **在 Bluemix 上设置您的私有区块链基础设施。**\n   您需要一名开发人员来设置基于 `IBM Blockchain` 服务的私有区块链集成。\n\
    2. **基于设备数据在区块链中开发和部署智能合约。**\n   例如，可以让合约在货物交付逾期后修改运费支付。\n3. **将您的设备连接到 IBM Watson\
    \ IoT Platform。**\n   您需要让开发人员将传感器/网关连接到 `Watson IoT Platform`。完成此操作后，物联网设备将发送数据以进行过滤、聚合并发布到您的区块链。\n\
    4. **将您的物联网设备数据与区块链分布式账本集成。**\n   让开发人员集成 `Watson IoT Platform`，使其能够向在 `Bluemix`\
    \ 中运行的 `IBM Blockchain` 服务发送数据。\n5. **安装您的监控 UI。**\n   1. 在 `Settings` 选项卡中启用区块链。\n\
    \   2. 配置到 `Blockchain` 服务的连接。\n   3. 单击 `Add` 按钮并在弹出对话框中填写 `Blockchain` 服务详细信息。\n\
    \   4. 确认所有更改。\n   5. 选择区块链菜单以映射设备数据。此处您可能需要开发人员的支持。\n   6. 按照向导操作并提供所需输入，以完成将设备数据映射到区块链合约。\n\
    6. **部署 Chaincode ID。**\n   当实时数据到达时，智能合约会在数据上执行。根据结果，完成一笔交易并记录在数字账本中，然后与所有对等节点共享。\n\
    7. **为终端用户开发客户端应用程序。**\n   在 `IBM` 系统和早期的物联网区块链开发中需要克服一些挑战。许多物联网设备计算能力有限或难以修改。加密和验证数据需要处理能力，可能导致电池寿命问题。\n\
    \n现在您可以创建自己的 `Chaincode` 合约。您可能需要开发人员的帮助，因为它需要使用 `GitHub` 和 `GoLang`。以下是该流程的高层次概述，以便您了解此类项目的需求：\n\
    \n## 创建您的 Chaincode 合约\n1. **创建 GitHub 项目。**\n   这是您存储智能合约的地方。\n2. **设置本地 Hyperledger\
    \ 开发和测试环境。**\n   您需要在计算机上安装一些东西，包括 `Docker`、`Pip`、`Git` 客户端、`Go`，以及 Mac 用户的 `Xcode`。请查阅\
    \ 第 3 章 以了解如何设置 `Docker` 的说明。\n3. **下载 IBM 示例智能合约。**\n   ![提示](img/Image00003.jpg)\n\
    \   此步骤是可选的，但会使构建第一个合约变得更容易。\n4. **创建测试智能合约。**\n5. **构建您的合约可执行文件。**\n   您的合约必须转换为可执行文件。示例中已内置合约可执行文件。\n\
    6. **在 Hyperledger 沙箱中测试合约。**\n7. **在 GitHub 中部署合约。**\n恭喜！您已设置好 `IBM` 合约。您稍后可以返回并在\
    \ `Bluemix` 仪表板中将合约映射到物联网设备。\n\n# 第 4 部分\n\n## 行业影响\n\n本部分内容…\n了解金融服务行业在利用区块链技术快速且低成本地在全球范围内转移资金时的未来。\n\
    \n澄清您对全球房地产与区块链技术相关的知识。\n\n识别保险行业通过新保险工具减少欺诈和增加利润的机会。\n\n审视政府组织和法律框架中永久性系统对大型行业的影响。\n\
    \n澄清区块链技术的其他大型全球趋势，以及它们将如何塑造您生活的世界和您日常使用的工具。\n\n# 第 12 章\n\n## 金融科技\n\n本章内容\n\n\
    ![检查](img/Image00001.jpg) **发现未来全球银行趋势**\n\n![检查](img/Image00001.jpg) **发现新的投资工具**\n\
    \n![检查](img/Image00001.jpg) **揭示银行区块链中的风险**\n\n![检查](img/Image00001.jpg) **开发新的融资策略**\n\
    \n最早采用区块链技术的机构是银行、政府和其他金融机构——它们也是增长最快的区块链用户。用于管理和转移资金的强大工具将以新颖且出乎意料的方式重塑我们的世界，因此金融科技（fintech）加入其中也就不足为奇了。\n\
    \n本章为您提供政府目前正在使用区块链技术进行的内部信息以及它将如何影响您。无论您是否意识到，金融科技每天都在影响您的生活。\n\n在本章中，我向您介绍未来的银行趋势、新法规以及可以帮助您更快、更便宜地转移资金的新工具。我还解释了新型投资工具和其他区块链创新。最后，我警告您涉及虚拟货币投资和新区块链技术支持的金融产品的潜在风险。\n\
    \n### 拿出您的水晶球：未来银行趋势\n\n银行业是第一个认识到 `Bitcoin` 对行业的威胁，然后认识到区块链改造行业的潜力的行业。银行业监管严格，作为银行组织和运营的费用昂贵。这些严格的监管既是整个行业的绝缘和保护盾，也是负担。快速、高效的数字资金的应用，不产生处理现金的成本，并且在金融系统中流动时可追踪，这是一个令人陶醉且具有威胁性的提议。价值可以脱离中央当局控制的想法也引起了支持货币的金融机构和政府的兴趣。\n\
    \n最初，这些金融机构和政府试图通过监管来扼杀区块链。今天，他们正在全面通过投资拥抱区块链。\n\n在 2013 年和 2014 年，美国证券交易委员会（`SEC`）向投资者发出警告，提醒他们涉及虚拟货币投资的潜在风险。警告称，投资者可能会被高回报的承诺诱惑，而对如此新颖和前沿的新投资领域不够怀疑。据\
    \ `SEC` 称，数字货币是投资者面临的十大威胁之一。今天，随着加密货币在各行业中获得关注，`SEC` 已准备好与公司和投资者展开合作。\n"
