- raw: "Factom has been structured this way for commercial applications because members\
    \ of one industry don’t need to download all the irrelevant data about an unrelated\
    \ industry. For example, verifying that all documents related to a mortgage have\
    \ been accounted for does not also require downloading years of stock exchange\
    \ history.\n\n The Factom blockchain also spreads itself out to secure its network\
    \ against data corruption. Every few minutes, it creates a small anchor into Bitcoin\
    \ and Ethereum. This does two key things:\n\n*   **First and most important, it\
    \ prevents the servers building the Factom blockchain from undetectably rewriting\
    \ history.** Because the servers can’t control Bitcoin or Ethereum, any history\
    \ they had recorded is permanent.\n\n*   **It prevents the Factom servers from\
    \ showing two different versions of the blockchain to different people.** Personal\
    \ customization of web pages is something that Amazon and Facebook routinely do.\
    \ Showing conflicting histories of business transactions to different companies\
    \ is a recipe for misunderstanding. Because there is only one Bitcoin blockchain,\
    \ that prevents altered versions of history from being created.\n\n## Building\
    \ on Factom\n\nFactom was created for applications to be built on top of it. It’s\
    \ built for scale, speed, and low cost. It was created to take to the security\
    \ of the Bitcoin blockchain and make that permanence available to more than what\
    \ can fit in its limited space.\n\n### Authenticating documents and building identities\
    \ using APIs\n\nFactom has come out with a set of application programming interfaces\
    \ (APIs) that can be used by development teams to manage and authenticate documents\
    \ and build identities for people and things. You still need a developer to help\
    \ you, and they’re designed for enterprise integration, not ideal for a small\
    \ project at this point.\n\nThere are two core offerings for the general public:\n\
    \n*   **Apollo:** Apollo is your publish and authentication option. It allows\
    \ users to feed massive amounts of data into Factom and then refer to it as needed,\
    \ historically. It would be an ideal place to publish an archive of your website\
    \ or updates to your protocols, for example.\n\n*   **Iris:** Iris is the platform\
    \ used to build an identity. It’s the underlying technology behind the IoT identity\
    \ project for the Department of Homeland Security. It builds on the Apollo platform\
    \ for record management.\n\nYou can use the APIs without needing to set up a blockchain\
    \ or run a cryptocurrency wallet. It takes the headache out of the process and\
    \ is ideal for those who are worried about the regulatory gray zone that cryptocurrency\
    \ still falls under.\n\n### Getting to know the Factoid: Not a normal token\n\n\
    Factom has a unique value token system, which uses something called the Factoid.\
    \ The Factoid is a digital commodity that is tradable on some exchanges. It isn’t\
    \ a currency in the same sense as Bitcoin. Factoids can be converted by the owner\
    \ into *entry credits* (nontransferable tokens that are used to purchase publishing\
    \ power within the Factom network). This transaction is one-way and it can’t be\
    \ undone. Factoids are effectively burned and are removed from circulation.\n\n\
    \ Factoids fluctuate in price depending on speculation and utility. Entry credits,\
    \ on the other hand, have a stable price that is maintained at US$0.001. This\
    \ makes the fees paid to publish a predictable cost.\n\nThe Factom team issued\
    \ some number of tokens during the crowd sale to raise funds for the core Factom\
    \ development. At this point, the Factom network has not reached full federation\
    \ of 32 nodes as outlined in the whitepaper. When the Factom networks reaches\
    \ 32 nodes, the network will begin rewarding federated nodes and audit nodes with\
    \ new tokens.\n\n*Federated nodes* are nodes that are elected by the network to\
    \ maintain consensus and validate transactions. Audit nodes check the honesty\
    \ of these nodes and will take one of their positions as a federated node if any\
    \ given federated node goes offline or breaks one of the system rules.\n\nThe\
    \ issuance of new Factoids to the servers coupled with the extinguishing of the\
    \ Factoids by the users represents a value transfer. The users are effectively\
    \ paying for the operation of the servers.\n\n### Anchoring your application\n\
    \nBlockchain technology has opened the doors for new products and services. The\
    \ blockchains themselves serve as the base layer that old technology can reinvent\
    \ itself with or innovation can be built against. Each blockchain has its own\
    \ unique properties that make it ideal for specific applications.\n\nFactom is\
    \ particularly good at securing information, but it still has limitations: the\
    \ size of each entry, and the fact that the more you publish, the more it costs.\
    \ Factom is ideal for storing large files in a cloud solution and then using pointers\
    \ within Factom to locate those files for your application.\n\nFactom is primarily\
    \ being used as a system to manage documents, and data, and build identity. It\
    \ integrates with other blockchains, and it can be used to create an oracle for\
    \ your smart contract.\n\n### Publishing on Factom\n\nFactom was built by developers\
