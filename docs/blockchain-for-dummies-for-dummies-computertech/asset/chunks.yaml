    SwiftMail uses wallet address similar to a Bitcoin wallet that is kept on an application
    on your computer. They are 32 random characters with no metadata to scrap, and
    users can create new ones quickly, just as you do with Bitcoin. The emails themselves
    are 256-bit, end-to-end encryption making intercepted data useless to thieves.


    ![remember](Image00004.jpg) Currently, downloads for SwiftMail are only available
    for Android, Linux and Windows systems. There is no Apple-friendly version of
    this software yet. Don’t download the wrong version.


    Other projects in this space, including 21 ([`www.21.co`](http://www.21.co)),
    are working on giving email a blockchain backend. They’ve created email that charges
    people outside your network a fee to send you email. Then they give you the option
    to keep the money or donate it to charity.


    ## Owning your identity


    One of the fundamental tenets that blockchain enthusiast talks about is the personal
    responsibility of owning the data that you create and that identifies you uniquely.
    This concept might seem straightforward, but most people don’t own or control
    the data that represents their identities.


    Most of the control is held by centralized databases that are vulnerable to hacking.
    These databases hold the information, and certificate authorities validate that
    the information is correct and unaltered. In the information age, your data is
    your identity. The more distributed the data is, the higher the likelihood that
    it will fall into the hands of those who want to misuse it.


    Blockchain-based identity places control of identity in the hands of the individuals
    or corporations that that the identity represents. Central databases and certificate
    authorities are not necessarily replaced. Data still needs a secure home, and
    it still makes sense to have third parties validate the authenticity of documents.


    The value in changing the order of responsibility around identity is that it becomes
    harder to steal, hold hostage, or manipulate the underlying documents that represent
    your identity. Information is shared as needed without exposing unnecessary information.


    ## Oracle of the Blockchain


    Blockchain technology doesn’t solve for the problem that information must come
    from somewhere. It’s also important that the information can be relied on. It’s
    the human element that can’t yet be removed from the equation when you want to
    act on a contract within a blockchain system.


    There is no central authority to police or enforce honesty in a blockchain system.
    Predicting the future honesty of authors of information is impossible. The logical
    conclusion is that each transaction must cost less than the cost to rebuild reputation.
    The reputations of trusted authors are built over time, and the longer an author
    is honest and correct, the more valuable the author’s reputation becomes. This
    concept is similar to the value of a name brand.


    In this section, I explain how artists and creatives are using blockchain technology
    to monetize their work through blockchain technology.


    ### Trusted authorship


    Smart contracts and chain codes have created a new opportunity for knowledgeable
    individuals and corporations to monetize their information. These types of systems
    need trusted sources of information to execute against. These trusted sources
    could be rating agencies, weather outlets, or just about anything else.


    You could also connect IoT devices to a blockchain infrastructure and have them
    create their own voices and identities on a blockchain network. They need to build
    trust over time and can still be corrupted at any given point. Past honesty doesn’t
    prevent future dishonesty or the corruption of a source of information.


    Not all smart contracts or chain codes are self-contained or execute against infallible
    sources. The more practical and applicable business use case requires information
    to be derived from sources outside the known universe of any given blockchain
    network. Several startups are attacking this problem from different angles.


    Factom has created Acolyte, a service that allows users to build a reputation
    over time for the information they provide to the network. Smart contract builders
    can subscribe and compensate oracles that are created. They can also rate them
    for their trustworthiness.


    From a dramatically different angle, Augur, another blockchain startup, has pioneered
    the idea of prediction markets. Augur is a platform that rewards users for predicting
    future real-world events such as election or corporate buyouts. The bets are made
    by trading virtual shares in the outcome of events. Users make money by buying
    shares in the correct outcomes. The cost of the shares fluctuates based on how
    the community feels about the likelihood of the event acutely happening. Augur
    is similar to a betting website. Anyone can make a prediction. Anyone can create
    a prediction market for any given event. This would allow you as a business owner,
    for example, to take a poll on what people think is most likely to occur. It may
    also uncover inside information that authors would like to be able to capitalize
    on.


    ### Intellectual property rights


    One of the hardest-hit industries that is struggling with intellectual property
    rights is the music industry. Artists at the top are squeezed out economically
    by the many intermediaries that rely on their creative work. Small artists can’t
    make music a primary source of income because they only see a small fraction of
    the revenue. Mega-stars make it on the sheer volume of fans.


    The Internet has made it easier for artists of all sizes to share their work.
    At the same time, it has made it even harder for people to make a comfortable
    living doing what they love. The music industry food chain is a long, and each
    intermediary takes a small piece of the pie and adds to the length of time that
    it takes for funds to finally reach the artist. Often, the artist will wait up
    to 18 months or more to see any money and may only get $0.000035 per instance
    of her music being streamed. This situation is a best-case scenario in our current
    market, with no one defrauding the artist.


    Blockchain has been introduced as a way to help lighten the massive financial
    burden on creatives. Cryptocurrency could be used to reduce transaction fees associated
    with credit cards and fraud. It would also open up new markets in developing countries
    that don’t have regular access to credit cards.


    An even more interesting but less straightforward possibility would be migrating
    the whole music industry ecosystem onto a blockchain system that utilized smart
    contracts or chain code to facilitate immediate payment for utilization. It could
    also clarify ownership of licenses and make it easier for consumers to license
    music for commercial use.


    Several projects are working on this issue and looking to promote a healthy, sustainable,
    and frictionless ecosystem — one that does not displace market player but does
    allow artists to gain a bit more from their hard work.


    UjoMusic is beta testing its platform that lets users sell and license music directly.
    It utilizes the Ethereum network, smart contracts for execution, and Ether (the
    Ethereum cryptocurrency) for payment. You can download a whole song or just the
    vocal and instrumental stems for commercial or noncommercial use. The musicians
    are then paid immediately with Ether.


    Peertracks is another blockchain startup that’s working on changing the music
    industry. It’s a music streaming website that allows users to download and discover
    new artists. It does this through its peer-to-peer network called MUSE and the
    creation of individual artist tokens. These tokens work like other cryptocurrency
    and fluctuate in value depending on the popularity of the artist.

