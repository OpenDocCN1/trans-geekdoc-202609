    # Blockstream


    Blockstream ([`www.blockstream.com`](http://www.blockstream.com)) 在提供区块链技术方面享有极佳的声誉，并且主要专注于分布式系统。Blockstream
    为利用区块链网络的组织提供硬件和软件解决方案。


    Blockstream Elements 是公司的核心软件平台，也是开源项目的一个分支。它为区块链开发者提供多种资源和一个高效的生产协议。


    Blockstream 的主要创新领域在于侧链，侧链扩展了现有区块链的实用性，通过添加智能合约和保密交易等功能来增强其隐私性和功能性。侧链避免了许多加密货币所经历的流动性短缺。侧链还允许数字资产在不同的区块链之间转移。


    侧链使得在区块链上实际交易公司股票成为可能，而无需担心交易成本或缓慢的网络速度。分布式资产管理基础设施也可以利用比特币网络，使个人和组织能够发行不同类型的资产。


    Blockstream 还参与创建了闪电网络，这是一个让比特币支持微支付而不会减慢网络速度的系统。闪电网络使用按比例的交易费用并以非常快的速度运行，支持大量小额支付。它正在开发更多比特币闪电原型并创建共识和互操作性。


    ## OpenBazaar 的区块链


    OpenBazaar ([`www.openbazaar.org`](http://www.openbazaar.org)) 是一个开源项目，构建了一个用于点对点数字商业的去中心化网络。与买家和卖家通过亚马逊或
    eBay 等中心化服务进行交易的传统模式不同，OpenBazaar 平台让他们直接连接。他们还利用比特币加密货币来消除费用和限制。


    你需要在电脑上下载并安装 OpenBazaar 程序。它随后会将你连接到其他想要买卖商品和服务的人。这是一个不受任何公司或组织控制的点对点网络。下载应用后，设置自己作为买家或卖家非常容易。当你准备好购买某物时，只需进行搜索即可查看结果。它有点像无政府主义者的
    eBay 版本。


    OpenBazaar 听起来可能很像丝绸之路，但它并非如此。与丝绸之路不同，OpenBazaar 的用户并非匿名。他们可以通过 IP 地址轻松追踪，这使得罪犯对其毫无吸引力。你可以从
    OpenBazaar API 中提取卖家位置数据并绘制网络中所有参与者的位置。有几种方法可以隐藏你的位置，并且正在探索更私密的通信方式，但目前网络上几乎没有非法交易。


    OpenBazaar 正在努力吸引大型商家和独立零售商。能够处理比特币交易并希望节省成本的人可能会在竞争中获得竞争优势。


    ## Code Valley：找到你的程序员


    Code Valley ([`www.codevalley.com`](http://www.codevalley.com)) 将代码开发的传统模式颠覆。它自称是“世界编译器”。Code
    Valley 为开发者提供了一个市场工具，使其能够通过 Code Valley 所称的“代理”与其他开发者协作构建软件。


    系统中每个代理都会为客户项目返回一段代码。Code Valley 还为企业家创建了一个开放市场。


    在 Code Valley，客户可以访问一个全球开发者网络，这些开发者愿意并能够为他们构建软件。Code Valley 的运作方式类似于 Upwork 等在线自由职业网站。该系统中的开发者可以从客户那里赢得构建软件的机会。客户必须反过来仔细挑选可以从事其项目的人员。


    Code Valley 在某种程度上也像数据访问对象（DAO），即当新项目创建时，会触发一个隐藏且类似蜂巢的软件编译器的形成。客户的应用由许多不同的代理与编译器协作构建。Code
    Valley 正在利用区块链技术将软件创建工业化。


    ## Bitfury 的数字资产


    Bitfury Group ([`www.bitfury.com`](http://www.bitfury.com)) 起初是一家比特币矿业公司，但已转型为一家全方位服务的区块链技术公司。Bitfury
    为企业和政府开发软件并创建硬件解决方案，以便在区块链之间转移资产。


    Bitfury 完全致力于改善比特币区块链生态系统。其技术有助于高效管理数字资产。它使用硬件和软件解决方案为私有和公共区块链交易提供额外安全保障。


    Bitfury 处理私有和公共区块链交易。它还帮助客户进行区块链分析。Bitfury 利用比特币交易不可变且始终公开可查看的历史记录，并对交易历史进行高级数据分析。政府已利用此类工作追踪比特币区块链上的犯罪活动。


    Bitfury 还参与闪电网络的开发。闪电网络是比特币区块链的叠加网络，使即时微交易成为可能。


    Bitfury 还在开发一项产权登记系统。格鲁吉亚共和国已与 Bitfury 合作登记土地所有权。所有权记录被记录在区块链上，以确保历史记录处于不可更改的状态。在发展中国家，安全的财产转移在经济上将是有益的。


    ## 任何币种都可 ShapeShift


    ShapeShift ([`www.shapeshift.io`](http://www.shapeshift.io)) 是交换区块链资产和加密货币最快的方式之一。用户可以使用此服务在几秒钟内交易数字货币。用户无需担心安全问题——没有登录。通过其系统，ShapeShift
    显著降低了代币被盗的风险。


    ShapeShift 遵循严格的“无法币”政策。在金融服务行业，*法币* 并不是指可爱的小意大利汽车；相反，它是区分政府发行货币的一种方式。在 ShapeShift
    上，用户不允许使用银行账户或借记卡或信用卡购买加密货币。ShapeShift 可在世界各地使用，除了朝鲜和纽约州。


    使用 ShapeShift 非常容易。你访问网站，指定想要交换的货币类型，并指定要将交换后的代币发送到的钱包。ShapeShift 为你交换代币，将其接收到账户中，然后发送到你指定的目的地。


    多个市场来源决定 ShapeShift 使用的汇率，并且它始终保持不变，与所交换货币的价值无关。你也可以直接在 ShapeShift 内转换比特币和其他加密货币。


    ShapeShift 提供许多独特的功能和工具，如 Shifty Button 和 ShapeShift Lens，可让用户使用任何替代加密货币购买商品，并直接快速地接收和交换山寨币支付。


    ## 21 上的机器可支付应用


    21 Inc. ([`www.21.co`](http://www.21.co)) 是区块链领域资金最充足的区块链公司之一，已筹集超过 1.16 亿美元。Andreessen
    Horowitz、Data Collective、Khosla Ventures、RRE Ventures 和 Yuan Capital 都是向 21 投资的风险投资公司之一。


    21 正在构建软件和硬件，使通过 HTTP 使用比特币变得容易。它促进快速的机器对机器支付。用户可以通过 HTTP 发送、接收和实施微支付。21 还允许用户在其系统上编写机器可支付应用。

