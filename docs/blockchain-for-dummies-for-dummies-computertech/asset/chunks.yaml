    ![tip](img/Image00003.jpg) 安全态势将随着新漏洞不断演变。审查所有新的最佳实践至关重要。管理您所承担风险的资金金额，并分阶段缓慢推出合约。Ethereum
    是一种新技术，成熟的解决方案尚未建立。


    ## 构建更智能的智能合约

    智能合约编程需要与标准合约编写不同的思维方式。如果合约以您未预期或未打算的方式执行，就没有第三方来纠正。区块链不可变且分布式的特性使得改变不想要的结果变得困难。


    ![remember](img/Image00004.jpg) 您的合约会有缺陷并且可能失败。在合约中内置安全阀，以便您在漏洞和脆弱性出现时做出响应。智能合约也需要一个关闭开关，让您在事情出错时切断电源并暂停合约。


    ![tip](img/Image00003.jpg) 如果您的合约足够大，请提供漏洞赏金，以激励社区发现合约中的漏洞和缺陷。


    就像许多事情一样，合约的复杂性也会增加错误和攻击向量的可能性。保持合约逻辑简单。构建包含合约每个部分的小模块。以这种方式创建合约将有助于您将任何问题进行区隔。


    ## 在系统中查找漏洞

    不要通过构建自己的工具（如随机数生成器）来重复造轮子。相反，利用社区已经完成并且经过充分测试的工作。


    ![warning](img/Image00006.jpg) 您只能控制合约内部的事情。请谨慎对待外部合约调用。它们可以执行恶意代码并夺走您的控制权。


    Ethereum 社区在其 GitHub 页面上有出色的已知漏洞列表，以及更多关于如何构建安全智能合约的有用提示，网址为 [`https://github.com/ethereum/wiki/wiki/safety`](https://github.com/ethereum/wiki/wiki/safety)。


    第 6 章


    # 关于 Ripple 区块链


    ### 本章内容

    ![check](img/Image00001.jpg) **了解 Ripple 区块链的起源**


    ![check](img/Image00001.jpg) **认识 Ripple 区块链**


    ![check](img/Image00001.jpg) **探索 Ripple 网络**


    Ripple 是用于全球转移和交易价值的最有趣的区块链之一。Ripple 协议允许任何类型的资产具有可互换性——即使是在两种不同资产之间以及在非流动性市场中。它以极低的成本、极高的安全性和创纪录的时间完成所有这些。Ripple
    基础设施正被实施为新现代银行和交易的框架。


    本章探讨 Ripple 区块链背后技术的重要细微差别。我解释 Ripple 如何在全球范围内彻底改变银行和金融科技的精细之处。我还向您介绍 Ripple 区块链的实际用途以及使用
    Ripple 协议时的具体安全提示。


    本章将帮助您在全球范围内交易多种不同类型的价值。在这里，您将了解这项技术对您所在行业的重要性以及如何立即开始使用 Ripple 协议。您还将了解如何在 Ripple
    协议上设置交易账户以及在该生态系统中运营时应避免的诈骗。


    ![tip](img/Image00003.jpg) 如果您不是正在寻找面向可以豁免或能够获得银行牌照的企业的大规模解决方案，您可能希望跳过本章，因为 Ripple
    主要服务于金融机构。


    ## 获取 Ripple 区块链的简要历史

    Ripple 项目比 Bitcoin 更早。它经历了多次迭代，但原始实现由加拿大开发者 Ryan Fugger 于 2004 年创建。Fugger 的首次迭代是一个去中心化货币系统，允许个人和社区建立自己的货币。


    Jed McCaleb、Arthur Britto 和 David Schwartz 后来通过一家名为 OpenCoin 的公司对 Ryan 的工作进行了补充。他们的作品帮助增加了更多类似区块链的功能，例如一种数字货币系统，其中交易链由网络成员通过共识发布。


    Chris Larsen，Ripple 的首任 CEO，是多家公司的创始人，包括 E-Loan 和 Prosper，这两家公司都是改变消费者借贷市场的颠覆性组织。他于
    2012 年 8 月加入 Ripple 并领导至 2016 年。


    此后 Ripple 发展成为一家大型风险投资支持的初创公司。它得到了投资界一些最知名的大牌支持，Google Ventures 和 Andreessen Horowitz
    只是其中几个名字。截至 2016 年，Ripple 已筹集超过 9300 万美元的风险投资。Ripple 也在政治上活跃，并担任美联储 Faster Payments
    Task Force Steering Committee 的成员，并共同主持 W3C 的 Web Payments Working Group。它在旧金山、纽约、伦敦、卢森堡和悉尼设有办事处。许多创始团队成员此后已离开
    Ripple 并开始了新的项目。


    Ripple 在银行业非常具有颠覆性，并因其努力而受到实质性抵制。2015 年，FinCEN 因违反保密法而对 Ripple 处以 70 万美元罚款。该罚款是因向知名
    Bitcoin 投资者 Roger Ver 出售 XRP 而未提交可疑活动报告，因为 Ver 因在 eBay 上出售烟花而有重罪定罪。罚款后，DBS Bank
    和大华银行有限公司开始拒绝为 Ripple 新加坡提供银行服务。据信这种情况发生是因为这些银行认为在区块链上发行资产带来的监管风险大于回报。此后，Ripple
    将重点转向主要服务于全球和区域银行。


    今天 Ripple 是一项全球金融结算解决方案，使银行和消费者能够交换价值。与 Bitcoin 类似，Ripple 协议通过允许用户直接且即时交易来降低结算总成本。它建立在分布式开源互联网协议之上，使用区块链，并拥有一种名为
    *ripples* 的原生货币。


    Ripple 的分布式金融技术使用户能够通过其网络实时发送国际支付。使用 Ripple，全球市场可以满足对快速、低成本和按需全球支付服务的需求。


    Ripple 在跨境支付和在两种不同事物之间交换价值方面特别出色。Ripple 创建了一个由金融机构、做市商和消费者组成的全球网络。您现在可以在世界任何地方即时交换几乎任何类型的价值。Ripple
    是 *Internet of Value* 的新基础。Internet of Value 的理念是，价值如货币、汽车、土地和商品都可以完全在线存在和交易，而无需促进该过程的中介。Ripple
    等协议促进交易并填补中介的角色。


    ## Ripple：一切都关于信任

    Ripple 是一个具有区块链后端的交换网络和交易平台。机构使用该协议通过 Ripple 的分布式账本清算交易。他们还可以通过 Ripple 的分布式资金交易所结算义务。


    在 Ripple 网络上交互主要有两种方式：

    *   系统的金融用户通过发行、接受和交易资产来促进支付，从而参与网络。

    *   节点运营商通过跟踪交易并与其他网络节点就这些交易的效力和排序达成共识来参与网络。


    ![tip](img/Image00003.jpg) 术语 *node* 和 *computer* 通常可以互换使用。两者都指用于运行网络的机器和代码。


    '
