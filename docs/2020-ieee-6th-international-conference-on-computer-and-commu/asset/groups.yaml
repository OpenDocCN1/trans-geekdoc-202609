    # 面向拟态 SaaS 云的安全等级导型部署算法


    司宜轩*，胡洪潮²,刘岩²，梁浩

    ¹（中原网络安全研究院）

    ²（国家数字系统工程与技术研发中心）

    中国，郑州

    e-mail: nsy999@163.com


    摘要—静态云计算环境极易成为攻击目标，导致数据被窃取或泄露，给用户带来更大的安全威胁。为了提高云计算环境的安全性，本文基于拟态防御的思想提出了一种针对不同安全等级
    SaaS 的异构资源分配算法，并采用了动态异构冗余策略。实验结果表明，在不同的安全等级下，成功率和防御能力存在差异。随着安全性的提升，虚拟机攻击的成功率逐渐降低，而部署开销逐渐增加。


    **关键词—**云计算；安全等级；资源分配


    # I. 引言


    云计算提供了按需付费的资源访问。许多成本是根据使用时长计算的。美国国家标准与技术研究院（NIST）定义了云计算的基本模型：软件即服务（SaaS）、平台即服务（PaaS）和基础设施即服务（IaaS）[1]。此外，SaaS
    易于使用，是目前最流行的云交付形式。为了给用户提供高质量的服务，SaaS 服务通常从私有云或公共云供应商处租赁。随着 SaaS 服务的快速扩展，优化 SaaS
    云中的资源分配至关重要 [3]。


    电子健康中的保护方法包括加密方法和非加密方法。

    然而，不同用户对虚拟机的安全性有不同的需求。例如，普通用户只需要虚拟机提供服务，而不担心隐私泄露。但也有用户对虚拟机的安全性支付更高的费用，例如金融、医疗和军事领域。为了解决这一问题，本文引入拟态防御技术
    [11]，提出了一种针对不同安全等级 SaaS 的异构资源分配算法。服务提供者可以提供不同的安全服务以满足用户需求。不同安全等级下异构虚拟机的部署方式不同，导致了虚拟机部署成本的差异。这比传统的虚拟机部署更有效，提高了云计算环境的可用性。


    # II. 相关工作


    静态同质的云计算环境因其管理简单、成本低而被广泛使用。然而，由于系统的异构性，更容易检测信息和窃取数据，从而对云环境带来安全威胁 [13]。虚拟化的隔离使得攻击难以被检测
    [14] 且难以提高云计算环境的安全性。在此基础上，通过动态切换目标可以进一步增强虚拟机的安全性。通过不断改变虚拟机及其虚拟机操作系统的位置，防止虚拟机遭受侧信道攻击
    [15] 和检测攻击 [16]。已有大量的经验和研究。攻击者利用各种方法攻击云计算的安全问题。网络防御策略包括被动防御和主动防御。被动防御技术主要由防火墙和入侵检测系统代表。被动防御基于已知知识来检测并拦截威胁特征和攻击行为。传统被动防御策略的缺点是无法准确获取先知识，且难以抵抗未知攻击。以移动目标（MTD）和拟态防御技术为代表的主动防御技术改变了网络防御的规则，从根本上改变了计算环境的周期，增加了攻击者的检测难度，并在程度上增强了网络安全。然而，MTD
    具有局限性。当攻击者成功进入目标主机时，MTD 无法识别并防御可利用的漏洞信息。(1) 安装后门。攻击者利用从用户处发现的操作系统漏洞信息在用户主机上安装后门。(4)
    攻击者与用户主机建立连接，并在用户不知情的情况下远程访问用户主机上的后门。(5) 窃取数据。攻击者与用户主机建立连接，利用内置操作系统命令监视用户内部网络并进行窃取。


    拟态防御技术基于动态机制，使环境更加动态化和不确定。同时，引入了攻击机制来创建和轮换攻击行为的虚拟主机，进一步提高了计算环境的安全性 [18]。


    在攻击链中，漏洞挖掘是攻击者的关键步骤。攻击者可以成功挖掘出目标主机的操作系统漏洞，根据漏洞对目标主机进行攻击。静态单一的环境将导致失败。攻击者可以根据发现的漏洞在网络上发起大规模攻击，通过开销训练多台机器的直觉。


    虚拟防御被设计为异构且冗余。一组拟态虚拟机由多个异构虚拟机组成。异构虚拟机执行相同的服务并将结果输出给代理，由代理对输出进行判断。异构冗余策略可以提高系统的故障能力和数据可靠性。


    # III. 攻击链中的威胁


    # IV. 算法描述


    # A. 虚拟机安全等级分类


    当虚拟机丢失机密性、完整性或发生安全违规时即视为违反。根据《联邦和信息系统安全分类》（FIPS PUB 199）[20]，虚拟机的安全等级分为以下三个等级：


    | 检测 | 漏洞挖掘 | 控制 | 窃取数据 |

    | :--- | :--- | :--- | :--- |

    | 发送带有恶意 URL/附件的邮件 | 利用操作系统操作系统漏洞 | 在目标主机上安装后门 | 从...建立连接 | 访问其他计算机获取全部数据 |


    图 1 攻击链。


    第一级，安全等级为 1，这意味着该虚拟机的内容是开放且透明的，没有隐私或安全担忧。泄露机制无法保护此类虚拟机的价值。此时，用户不要求供应商保护此类机器。即使该虚拟机被攻击者攻击，也不会造成损失的。


    第二级，安全等级为 2，这意味着此类虚拟机涉及敏感信息，供应商需要投入资源保护此类虚拟机免受攻击，因为一旦这类机器不安全，攻击者会产生严重的负面影响并带来损失。此类虚拟机的安全性处于
    1 级和 3 级之间，具有安全性，但如果这种虚拟机的成本大于机器的价值，用户可以选择放弃这种虚拟机。


    如 [19] 所示，图展示了网络链。圆圈表示攻击链的状态，相应的描述说明了每个阶段采取的操作。


    攻击发起的过程如下：(1) 检测阶段。攻击者向用户发送恶意 URL 或附件以收集目标虚拟机的信息。(2) 漏洞挖掘，攻击者根据收集的信息利用用户系统并


