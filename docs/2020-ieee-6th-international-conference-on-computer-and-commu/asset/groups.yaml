    Abstract—Static cloud computing environment is likely to become the target of
    attacks, causing data to be stolen or leaked, posing a greater security threat
    to users. In order to improve the security of the cloud computing environment,
    a heterogeneous resource allocation algorithm for SaaS with different security
    levels is proposed based on the idea of mimic defense and adopts the dynamic heterogeneous
    redundancy strategy. Experimental results show that under different security levels,
    the success rate and defense are different. As the security increases, the success
    rate of virtual machine attacks is gradually reduced, while the deployment overhead
    is gradually.


    **Keywords—**cloud computing; security level; resource allocation


    # I. INTRODUCTION


    Cloud computing provides access to resources on a pay-as-you-go basis. Many costs
    are calculated based on the duration of use. The National Institute of Standard
    and Technology defines the basic models of cloud computing: Software as a Service
    (SaaS), Platform as a Service (PaaS) and Infrastructure as a Service (IaaS), [1].
    Moreover, SaaS is easy to use and is currently the most popular form of cloud
    delivery. In order to provide users with high quality of service, SaaS services
    are often leased from private or public cloud providers. With the rapid expansion
    of SaaS services, it is essential to optimize resource allocation in the SaaS
    cloud [3].


    protection methods in the electronic health include cryptographic methods and
    non-cryptographic methods.

    However, different users have different security requirements for virtual machines.
    For example, ordinary users only need virtual machines to provide services and
    are not worried about privacy breach. But there are also users who pay more to
    the security of virtual machines, such as financial, medical and military fields.
    To address this problem, this paper mimic defense technology [11], to propose
    a heterogeneous resource allocation algorithm for SaaS with different security
    levels. Service providers can provide different security services to meet the
    needs of users. The deployment of heterogeneous resource of virtual machines under
    different security levels is different, resulting in different costs for deploying
    virtual machines. This is more effective than traditional virtual machine deployment
    and improves the availability of cloud computing environment.


