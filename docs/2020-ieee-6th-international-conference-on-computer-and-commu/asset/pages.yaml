    attacked with without a rotation strategy. This experiment is aimed at detection
    attacks. In the attack, the attacker first detects the user''s virtual machine,
    judges the operating system based on the information detected, and then launches
    attacks. As shown in Figure 6, for non-rotating strategies. When an attacker launches
    an attack after the rotation, the attacker''s detected information becomes invalid.
    For the rotating strategy, the user rotates the virtual machine before the attack
    launches. At this time, the attacker can no longer determine the operating system
    based on vulnerability. The experimental results show that rotation strategy can
    effectively improve the security of the operating system.


