    # Chapter 1


    # Computing Systems


    # Introduction


    Introducing kids to computing systems should be done thoughtfully, with tasks
    and activities that make your learners feel empowered and engaged. Consider creating
    “Tech Boss” name tents for your learners, and think about ways to facilitate a
    growth mindset. Set them up for success by explicitly teaching how to use a mouse
    or a touchpad and how to tell the difference between software and hardware. Teach
    your learners to be safe online and help them to feel confident with independent
    exploration and coding. Teach your learners the Input/Output song. Consider some
    of the robots and/or physical computing options to increase the fun, and start
    your learners off right. Teach them to troubleshoot with the help of “Troubleshooting
    Tasha”. You’ll find ideas and templates for all of this and more in Chapter 1.
    Use this chapter as a touchstone from which to help your learners launch a lifelong
    love of computers and technology. Note that although I’ll often refer to learners
    (plural) throughout this text, the majority of the content can be used for one-on-one
    teaching, too.


    # Getting Started


    When teaching little kids how to select appropriate software for tasks, you’ll
    need to start with the basics. Defining software is a good first step. Keep it
