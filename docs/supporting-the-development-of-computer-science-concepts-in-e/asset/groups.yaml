    如果你与一群人合作，更精确的方法是统计第一轮所有参与者的结果，统计小组结果中每种颜色的平均值，并利用此进行预测。一旦他们算出实际数字，你的学习者就可以将这些数字与他们的预测进行比较。这些步骤：提问、进行研究、做出预测/假设并验证该假设，即**科学方法**的步骤。在预测、统计、比较和分析的辛苦工作之后，举办一个
    M&M''s 吃糖派对来庆祝。可以考虑播放他们可能是巨人乐队专辑 *Here Come the 123s* 中的一些曲目，而你的学习者则享用他们的 M&M''s。


    ## 结论


    我希望第 3 章已经激发你举办一场精彩的机器人舞会，肚子里塞满了 M&M''s（或其他零食），同时欣赏你漂亮的图表。也许这已经让你对学习更多关于网页设计、录制消息（甚至是播客？）以及使用科学方法产生了兴趣。别停下来！第
    4 章更深入地探讨了计算机科学的支柱：**算法**和编程的基础。


    ## 算法与编程


    ### 简介


    第 4 章深入探讨了**算法**和**编程**，这些是计算机科学的支柱性主题。使用本章来教你的学习者关于**分解**、**迭代**、**算法**、**序列**、**变量**、**调试**、**循环**、**归属**、**二进制**和**密码**。通过尽早进行分类、键盘输入和结对编程，为你的学习者奠定成功的基础。一起唱
    *调试之歌*，别忘了使用二进制写下你们的“秘密代码”！


    ### 编程——支架式教学与其他注意事项


    ### 分类


    与最年幼的学习者一起，使用分类活动来强化模式识别，这是编程和**调试**所需的关键技能。在教年幼的学习者收纳材料时，以不同的方式将用品分类到箱子和筐中，正面贴上单词和照片，指示物品应如何分类，并支持初级阅读。定期更换这种方式，帮助他们学习不同的分类模式/方法。


    例如，按数字、带数字的积木、边数或你认为最适合你材料的字母、形状和颜色，来存放积木、美术用品和其他材料。这也可以用松果和树叶等天然物品，以及游戏室或教室材料来完成。考虑以这种方式组织你的学习环境。通过搜索“Montessori
    sorting”可以找到无数建议和玩具。


    通过询问 *他们* 应该如何对物体或用品进行分类，以便在某些活动中更容易找到或使用，来让你的学习者产生归属感。例如，问你的学习者：“如果我想画一幅我房子的图片，我该如何整理绘画用品，以便能快速找到我想要使用的颜色？”让任务变得更快更简单是计算机如此强大和有用的主要原因之一。用日常任务来**支架式教学**这个想法，有助于年幼的学习者开始以这种方式思考。


    ### 结对编程


    在教孩子编程时，让他们结对工作。这种学习方法应用到编程中被称为**结对编程**。具体是这样的：两个孩子会一起工作，并频繁切换角色。一个孩子先写代码——被称为“驾驶员”。另一个孩子——叫“领航员”——会检查代码并提出意见。对于年幼的孩子，你可以每隔五分钟设置一个计时器，提醒他们切换角色。随着学习者年龄增长，他们会变得更擅长独立切换角色。刚开始进行结对编程时，你需要监督学习者，确保两人都积极参与，并在指定的时间间隔切换角色。你可能还需要告诉学习者谁应该先担任哪个角色。


    ### 键盘输入技能


    年幼的学习者应先使用积木式编程学习编程背后的概念。ScratchJr 应用非常适合 5–7 岁的孩子，之后他们应该过渡到 Scratch（面向 8–16 岁开发）。当你的学习者成为
    Scratch 大师后，就可以加入文本编程了。


    年长的学习者需要了解如何在键盘上输入符号，才能成功使用文本编程语言。由于大多数学生在一年级结束时开始更流畅地阅读，这是教二年级学生的一个好技能。此外，为了让孩子们成功进行文本编程，他们需要掌握基本的打字/键盘输入技能。


    在尝试文本编程之前，还应涵盖高级打字技能，例如如何输入符号（如括号 ( )、大于号 > 和小于号 < 符号、反斜杠 \\ ）以及大写字母。Typing Club
    (typingclub.com) 是一个学习打字技能的绝佳免费资源。作为指导学生的成年人（家长/监护人或教师），你需要提醒他们将手指放在主行上，这样之后他们就能不看手快速高效地打字了。


    通常建议从 HTML/CSS 或 Python 开始学习文本编程。查看本书的资源部分，了解推荐的书籍和网站来学习这些内容。你也可以在我的网站 (authorjuliedarling.com)
    上找到这些资源的链接。在《小小计算机科学家》中，角色“在命令行中使用 Python”。命令行是一种直接向计算机输入指令的方式，而不是使用鼠标从下拉菜单中点击和选择。这种文本界面通常能让你工作更快，并对计算机有更多控制权。在
    PC 上，通过找到“命令提示符”来访问；在 Mac 上，通过找到“终端”来访问。要小心！因为命令行给了你更多控制权，如果你出错，可能会真的搞砸事情（例如，永久删除重要数据或弄乱格式）。


    ### 算法与编程——算法——抽象


    > CSTA K-2 标准 1A-AP-08：通过创建和遵循算法（一组分步说明）来建模日常流程，以完成任务。

    >

    > “组合是将较小的任务组合成更复杂任务的过程。学生可以为制作简单食物、刷牙、准备上学、参与清理时间创建和遵循算法。”


    简单来说，算法是按特定顺序完成的一系列步骤。教授算法的好方法是教你的学习者一个最喜欢的食谱。对于年幼的学习者，这可以是只需要组装的食谱，例如徒步混合坚果。将视觉和书面说明结合在一起，也能强化初级读者的字母和单词识别。


    将步骤写下来也有助于更好地展示计算机科学中算法的样子（与仅仅给出口头指令相比）。使用这个传统的徒步混合坚果食谱。根据口味和过敏情况进行调整，并考虑使用你选择的食材添加步骤照片。


    ### 简单的徒步混合坚果食谱


    取出一个 1 杯量杯，以及一个带密封盖的大型可重复使用容器（可装下四杯）或一个一加仑塑料袋（滑拉式或拉链式封口最适合摇晃食材并保持新鲜）。


    准备好你的食材：


    - 葡萄干

    - M&M''s

    - 花生（或其他脆脆的东西）

    - Cheerios 麦片


    使用量杯量出每种食材一杯，然后一次将一种加入容器中。


    密封盖子（或袋子顶部），检查确保盖好紧，然后剧烈摇晃混合食材。享用吧！这种徒步混合坚果非常适合徒步旅行或其他探险时携带。


    教师和家长/监护人也可以与年幼的学习者合作，为各种日常流程创建可视化/书面的**算法**并张贴出来——例如准备睡觉、准备上学、学校日程安排、学习站以及轮换方式等。请务必保持简单——年幼的孩子一次只能成功遵循少数几条指令。一次不超过三条是一个好经验法则（尽管这可以在变成常规后逐步增加）。年龄较大的学习者可以遵循步骤更多、复杂度更高的指令。与所有学习一样，想办法让这件事既有创意又有趣。


    一次引入其中一项流程，并继续将它们称为“算法”——例如，“我们的睡前算法是什么？首先我们刷牙……”让你的学习者告诉你每个流程/算法的步骤是什么。年幼的学习者可以指向流程的视觉步骤/提示，以强化步骤和顺序。如果从头写所有这些感到繁琐，可以考虑借助
    **AI** 网站（如 GoblinTools (https://goblin.tools)）将任务分解为步骤。之后，你可以轻松地进行调整并添加来自学校或家庭的照片。


    问问你的学习者，如果你刷完牙 _然后_ 才把牙膏挤在牙刷上，会发生什么。讨论算法/日常流程中步骤的顺序在现实生活中 _和_ 向计算机下指令时都很重要。步骤顺序错误会导致流程/程序无法得到你想要的结果。


