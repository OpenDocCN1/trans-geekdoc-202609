  mdcn: "\n\n## 早期儿童计算机科学概念发展的支持\n\n面向家长和教育工作者的实用指南\n\n撰文：朱莉·达琳\n\n插图：D. J. 库尔斯\n\n\
    Pruffrock Press 出版物\n\n![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_0_0.png)\n\n##\
    \ 早期儿童计算机科学概念发展的支持\n\n《早期儿童计算机科学概念发展的支持：面向家长和教育工作者的实用指南》为计算机科学提供了坚实的理解，为你的早期学习者奠定成功基础！\n\
    \n本指南提供介绍词汇、巩固概念的游戏，以及可打印的活动，帮助早期学习者以引人入胜且适合年龄的方式理解计算机科学。\n\n这本全面的指南涵盖了计算机科学的基础（整合了计算机科学教师协会\
    \ K-2 标准），并包含关于二进制、密码、使用命令行、编程语言、排序、计算机系统和网络工作原理基础、什么是黑客攻击、如何避免网络钓鱼，以及如何成为一名良好的数字公民并在网上保持安全的信息。\n\
    \n为了有效使用，本书应与图画书《小黑客》和《小计算机科学家》一起购买。三本书可以作为一套购买，即《早期儿童计算机科学概念发展》[978-1-032-47108-2]。\n\
    \n朱莉·达琳是安娜堡 STEAM 学校的教师/图书管理员。她拥有密歇根大学信息科学硕士学位，并且是树莓派认证教育工作者。朱莉教授技术已有 20 多年。\n\
    \nD. J. 库尔斯是一位作家、插画师和设计师，热爱书籍、户外探险和老爷车。她原本来自华盛顿州，现在在密歇根州东南部享受骑行、探索和小镇家庭生活。\n\n\
    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_2_0.png)\n\n## Taylor & Francis\n\nTaylor\
    \ & Francis Group\n\nhttp://taylorandfrancis.com\n\n## 早期儿童计算机科学概念发展的支持\n\n面向家长和教育工作者的实用指南\n\
    \n撰文：\n朱莉·达琳\n\n插图：\nD. J. 库尔斯\n\n2025 年首次出版\n由 劳特利奇 出版\n纽约第三大道 605 号，纽约，NY 10158\n\
