    ## Chapter 1


    ## Computing Systems


    ## Introduction


    Introducing kids to computing systems should be done thoughtfully, with tasks
    and activities that make your learners feel empowered and engaged. Consider creating
    “Tech Boss” name tents for your learners, and think about ways to facilitate a
    growth mindset. Set them up for success by explicitly teaching how to use a mouse
    or a touchpad and how to tell the difference between software and hardware. Teach
    your learners to be safe online and help them to feel confident with independent
    exploration and coding. Teach your learners the Input/Output song. Consider some
    of the robots and/or physical computing options to increase the fun, and start
    your learners off right. Teach them to troubleshoot with the help of “Troubleshooting
    Tasha”. You’ll find ideas and templates for all of this and more in Chapter 1.
    Use this chapter as a touchstone from which to help your learners launch a lifelong
    love of computers and technology. Note that although I’ll often refer to learners
    (plural) throughout this text, the majority of the content can be used for one-on-one
    teaching, too.


    ## Getting Started


    When teaching little kids how to select appropriate software for tasks, you’ll
    need to start with the basics. Defining software is a good first step. Keep it
    simple. Explain that software tells the computer what to do, just like grown-ups
    tell kids what to do. However, unlike kids, computers have to do what you tell
    them. They don’t get bored, frustrated, or tired—they just follow instructions.


    ### Script for Explaining Software


    Explain to your learners that in a classroom, a teacher might tell you to raise
    your hand and wait until you’re called on, before asking your question (have them
    practice raising their hands. “Yes! Just like that.”). A grown-up at home might
    tell you that you need to brush your teeth before you go to bed (have them pretend
    to brush their teeth—“Don''t forget your teeth in the back!”). Sometimes you don’t
    want to raise your hand or brush your teeth, or maybe you just forget. Say: “Have
    you ever forgotten to raise your hand or forgotten to brush your teeth?” Allow
    some time for your learners to respond. “I have too! We’re human and that’s okay.
    We practice and get better at it, right?”


    Explain: “Computers don''t have any feelings about what they’re told. They don''t
    forget and they don''t have to practice. They just follow instructions. With a
    computer, you get to act like you’re the grown-up, and you get to tell it what
    you want it to do. You get to be the boss. Isn''t that fun?! First, though, you
    have to learn how to boss the computer. You need to know what it can and can’t
    do. A computer can only do what it’s programmed to do.” This is a good point at
    which to do a quick check for understanding. Ask your learners: “Does a computer
    know how to do everything?” They will likely yell out “no!” since you already
    gave them this answer. You can also ask for thumbs up for “yes”, thumbs down for
    “no”, or thumbs to the side if they “aren’t sure”.


    ## TECH BOSS


    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_14_0.png)


    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_14_1.png)


    ### “Tech Boss” Name Tents


    Consider making table tent name cards for your learners to use. Referring to your
    learner as a “Tech Boss” gives them a sense of ownership and allows them to realize
    that they’re in charge of their device (instead of the other way around, even
    if it sometimes feels that way).


    These table tents can also be used as a visual cue if your learners are working
    together and taking turns when using devices or robots. The learner whose turn
    it is to type or select options can have their “Tech Boss” table tent on display,
    and their partner can have their table tent face down. You could use a timer;
    five minutes may be a good amount of time, depending on the task and age of your
    learners. When the timer counts down to zero, the partners switch tasks and table
    tent positions.


    ### Setting Your Learners Up for Success


    Say: "Is it okay to make mistakes sometimes?" (Wait for your learners to answer
    in the affirmative). Ask: "Do you think I ever make any mistakes?" You could share
    a personal story about a (perhaps humorous) mistake you made and how you fixed
    it. Next ask: "What can we do if we make a mistake, or if we don’t understand
    something right away?" Guide your learners in responses such as: we try again,
    we see what we can do to fix it, we get better with practice, we ask for help
    from a friend, parent, or teacher, etc.


    ### Growth Mindset


    Pointing out that it’s okay to make mistakes, and that we get better with practice
    is part of modeling a “growth mindset” (Dweck, 2007). Developing a “growth mindset”
    (as opposed to a “fixed mindset”) is a critical part of any type of learning and
    should be continuously encouraged:


    > This growth mindset is based on the belief that your basic qualities are things
    you can cultivate through your efforts, your strategies, and help from others.
    Although people may differ in every which way—in their initial talents and aptitudes,
    interests, or temperaments—everyone can change and grow through application and
    experience.


    (Dweck, 2007)


    In my classroom, I publicly point out when I make mistakes and model how to fix
    them. For example, when I click on the wrong link or button, I’ll invite my learners
    to help me problem-solve. I’ll say something like “Oops I clicked on the wrong
    link! What can I do to fix it?” I’ll often share examples of when I wasn’t great
    at something but got better with practice. For example, “Did you know that when
    I first started learning how to type, I only used my pointer fingers and I was
    SUPER slow? How do you think I got faster at typing?”


    ### Teach Kids How to Use the Mouse and Touchpad


    Ask: “Does anyone know how you open up this program? How do we make it start?”
    You’ll need to demonstrate that they click on the icon. This may be a single or
    double click depending upon the device. Little kids will need practice with this.
    Have them practice with you by pretending to click with their pointer finger on
    a table. Pointer fingers lifted, tell your learners to “single click, click one
    time”, then “double click, click two times quickly”. Make it into a game where
    you have them tap their fingers once or twice each time you call either one out.
    Mix up the order in which you declare single or double clicks. Have your learners
    take turns calling out “single/ double click” and having the other kids respond
    by “clicking” with their fingers on the table.


    Once they feel confident with this, introduce right clicking. Young learners may
    still be figuring out how to tell their right from their left, so start by explaining
    the difference between their pointer finger and their ring finger. Say: “Your
    pointer finger is the left click, your middle finger is the right click.” Add
    “right click” to your clicking practice game. If anyone is still struggling with
    which finger to use, you could have them trace their hand onto a piece of paper
    and label their pointer finger “left click” and their middle finger “right click”
    (or just “L” and “R”).


    Once your learners have mastered all of this, they could try it on an unplugged/disconnected
    mouse, and then finally with a connected mouse to open the program of their choice
    (hooray!) If your learners are using devices that have track/touch pads, they
    may need to practice right-clicking using both their middle and ring fingers together
    with a two-finger press. Make sure to **scaffold** this. Reinforce that on computers
    we call the pictures an “icon” or “**thumbnail**”。Have your learners repeat that
    back to you: “What do we call this [point]? What else could we call it?”


    ### Cursors Can Be a Surprise at First


    Young learners often initially have trouble figuring out how to make the cursor
    move the way they want it to. Many devices for young learners have touch screens
    (which I would highly recommend starting with). When they first encounter a mouse,
    they may try to pick it up off the table to get the cursor to go to the top of
    the screen, and usually won’t know what to do with the mouse to keep moving the
    cursor once they’ve reached the edge of their table. They won’t know to pick the
    mouse up in the air, move it, and then set it back down again. If your learners
    are working on a touchpad, they will need to learn to pick up their fingers instead
    of the mouse.


    You’ll need to model this for them and have them practice, again with an unplugged
    mouse at first. This can be a game too. Say: “Forward, away from you means up!”
    and have them move their mouse forward while repeating back to you “up!”; “Back,
    toward you means down!” and have them move their mice back while saying “down!”
    Then you could call directions out randomly: “Up! Up! Right! Down! Left! Left
    again! How do you keep going left?” Observe to make sure they’re “driving their
    mice” in the correct direction and spend a little more time on anything giving
    them trouble. Once your learners have mastered these skills, it’s time to help
    them start exploring their devices.


    This should also work with learners using a touchpad. You’ll want to exaggerate
    how you’re picking your finger up and placing it back on the touchpad (and point
    out when you’re using two fingers) so they can understand what you’re doing.


    ### Computing Systems—Devices—Inclusion


    > **CSTA K-2 Standard 1A-CS-01:** Select and operate appropriate software to perform
    a variety of tasks, and recognize that users have different needs and preferences
    for the technology they use.

    >

    > “People use computing devices to perform a variety of tasks accurately and quickly.
    Students should be able to select the appropriate app/program to use for tasks
    they are required to complete. For example, if students are asked to draw a picture,
    they should be able to open and use a drawing app/program to complete this task,
    or if they are asked to create a presentation, they should be able to open and
    use presentation software. In addition, with teacher guidance, students should
    compare and discuss preferences for software with the same primary functionality.
    Students could compare different web browsers or word processing, presentation,
    or drawing programs.”


    ### Script for Exploring Programs and Apps


    Say: “How do we know what your device can do?” This is going to elicit a variety
    of responses, many of which could be correct. You’ll need to guide this conversation.
    The specific details will vary depending upon what kind of devices your learners
    have access to.

