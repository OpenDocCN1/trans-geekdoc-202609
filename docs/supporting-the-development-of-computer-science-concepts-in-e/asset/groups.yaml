    If you wanted to extend this lesson with older learners, you could follow up by
    asking: “Is there a way we could add parts or change pieces of this printer so
    it _could_ print giant posters?” If yes, this is an aspect of hacking, making
    a device or program do something that it wasn’t initially designed to do.


    ## Monitors


    Tap on the side of a monitor. Say “Does this seem hard or soft?” Ask: “Does that
    make it hardware?” (Yes!) Ask: “What is this?” (A computer monitor/screen.) Explain:
    “A computer monitor is the screen that shows you what you’re working on, and allows
    you to see what you can do with this computer.”


    If you’re working with slightly older or more advanced learners, you can continue:
    “What you can use this computer for is limited by the software loaded onto it.
    Can you put additional software on this device by downloading/installing software/applications?
    Absolutely! Can you delete applications/software that are already installed? Yep!
    You can do that too. However, you should make sure you’re not deleting something
    important or installing something that could have **malware**, especially if the
    computer doesn’t belong to you. Can I add more monitors, so I have more space
    to see what I’m working on with my computer? Yes!”


    If you’ve been following these scripts straight through, that’s a lot of listening
    for younger learners. Depending on the age of your learners, consider breaking
    up the scripts into one new idea per day. Follow that up with a brain break, a
    song, or a game that will allow your learners to move. The _Input/Output Hokey
    Pokey_ is a good choice because it connects to learning about hardware and software.


    ## Input/Output Hokey Pokey


    Sing these lyrics to the tune of the classic children’s song _The Hokey Pokey_:


    - You plug your mouse in [pretend to plug it in]

    - You plug your keyboard in [pretend to plug it in]

    - You type the words in [pretend to type]

    - And you flex your hands about [open and close your hands]

    - You do the input/output and you boss your tech around [turn around in place]

    - That’s what it’s all about! [clap three times in rhythm with your words]


    - You plug your printer in [pretend to plug it in]

    - You print your words out [pretend to grab paper]

    - You print your picture out [pretend you’re holding documents in each hand]

    - And you show them all about! [hold your pretend documents up]

    - You do the input/output and you boss your tech around [turn around in place
    as you’re saying this line]

    - That’s what it’s all about! [clap three times]


    - You do the innn-put, output [sway in place]

    - You do the innn-put, output [sway in place]

    - You do the innn-put, output [sway in place]

    - That’s what it’s all about! [clap three times]


