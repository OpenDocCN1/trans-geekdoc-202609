    computer science and technology program resources.


    +   **GoblinTools** (https://goblin.tools). An AI website for breaking down tasks
    into steps. Describe the task, then click on the magic wand to break that task
    down into discrete steps. This is a perfect tool to use to teach algorithmic thinking.


    +   **Hello Ruby** (www.helloruby.com/play). Free downloadable activities for
    learning computer science concepts.


    +   **Here come the 123s by They Might be Giants** (www.theymightbegiants.com/here-come-the-123s).
    Fun, educational songs for children that can be used to reinforce counting and
    other mathematical concepts.


    +   **HTML with a Caveman** (www.youtube.com/@supercampusjr9058). Silly videos
    from SuperCampus Jr for teaching younger learners beginning HTML.


    +   **Moon Hack** (https://moonhack.com). An annual free two-week, international
    coding event, for ages 8–15.


    +   **Scratch** (https://scratch.mit.edu). A free web-based, block-based coding
    site aimed at ages 8 and up.


    +   **ScratchJr** (www.scratchjr.org). A free app designed to teach children ages
    5–7, block-based coding.


    +   **SciGirls** (https://pbskids.org/scigirls). A PBS Kids girl-focused STEM
    site that includes videos, games, and more.'
