    # The Impacts of Technology


    Tell your learners: “Now that you have some idea about how powerful computers
    and the Internet are (and really this is what a smartphone is—a computer that
    can fit in your pocket), what kind of programs, robots or technology could you
    invent? I’d love to have a robot that could clean my whole house, an app that
    can instantly translate books and papers written in any language, a teleportation
    machine, and a flying car of course! Who doesn’t want a flying car?!


    This would be a great opportunity to introduce some new and emerging technology
    such as virtual reality, artificial intelligence (A.I.), or augmented reality.


    Pick one to give a brief overview (see the Glossary if you need the basics) and
    ask your learners to think about the ways in which these could impact learning
    and our day-to-day lives. Can you use virtual reality to see what life is like
    in other countries? During historical times? What about on other planets? Yes
    to all of these! How about A.I.? What happens when computers are taught how to
    learn? Can they take people’s jobs? Sometimes. Do they do as good a job as humans?
    Not always, but sometimes they do an even better job. Can they be used to improve
    our daily lives? Often in some way. Think about what you might want to teach a
    computer or robot to do. That’s at the heart of AI. Finally, consider augmented
    reality. What could you superimpose into the real world, using devices, to enrich
    it and make it more interesting or educational?


    Have your learners use the Extension Activity: Invent New Technology to think
    about a new technology they could invent. If you have the time and supplies, you
    could even encourage them to build a model out of cardboard, blocks, or something
    else. When it’s finished, have them tell other people about their amazing invention
    or through a digital means, maybe using an online collaborative tool!


    Sharing work through online collaborative tools or learning management systems
    is useful for a variety of reasons. These tools allow kids to share work they
    feel proud of and to collaborate with others. This includes collaborating with
    kids who may live far away and might provide diverse perspectives. This is powerful
    and should be encouraged. With young learners, this could mean sharing a photo
    of a work they’ve created with a family member, using Seesaw. With older learners,
    it could mean connecting with an authentic audience, through a website, video
    post, blog post, or podcast, about an issue that’s important to them.'
