  - '[PAGE 89]


    **Safe-mode** is where you start your computer with only a few items running.
    Safe-mode is used to diagnose issues with your computer.


    **Scaffolding** is where you offer support when teaching kids a concept that they
    may have difficulty learning without the extra support. For example, you can scaffold
    using correct terminology by providing a word bank.


    **Scratch** is a block-based visual programming language. Scratch is integrated
    into a whole community of sites and apps and was created to teach kids ages 8–16
    to code.


    **ScratchJr app** is a visual programming language that uses puzzle piece-style
    blocks of code to (drag and drop) to write a program. ScratchJr was designed for
    emergent readers ages 5–7.


    **The Scientific Method** involves a logical progression of steps used to find
    the solution to a question or problem. These include asking questions, doing research,
    making a prediction/hypothesis, and testing that hypothesis.


    **Search engine** is the software that allows users to search the Internet using
    keywords (as opposed to having to type in the exact URL). Common search engines
    include Google, Yahoo, Bing, and DuckDuckGo.


    **Sequences** are a series of instructions followed in a certain order.


    **Snap!** is block-based coding similar to Scratch. It was designed by UC Berkeley
    and touts “advanced features” for “serious study of computer science”.


    **Spyware** is a type of malware that runs in the background, secretly collecting
    sensitive data, without the user’s consent.


    **STEM** stand for Science, Technology, Engineering, and Mathematics.


    **STEAM** stand for Science, Technology, Engineering, Arts, and Mathematics.


    **Strings** are a type of data, used in programming languages, that includes letters,
    words, numbers, or characters. These are often enclosed in quotation marks—for
    example, “Hello world!” They can be used for a variety of tasks, including composing
    messages.


    **Thumbnail** (see Icon).


    **Trees** are a way to organize hierarchical data structures. The starting point
    of the tree is called a “root”. For example, in web design, the root of the tree
    would be <html>. Everything else that comes after this is “descended from” this
    root.


    **Trojan Horse** named after the ancient Greek story about the fall of the city
    of Troy, is when malware is disguised as a legitimate program. Once downloaded,
    the malware causes harm.


    **Upstander** is a term that, in digital citizenship, refers to someone who witnesses
    someone being mean online, and they take action and stand up for the person who’s
    being bullied by confronting the victim or offering support in some other way.'
  - '[PAGE 90]


    URL stands for Uniform Resource Locator, also known as a website address. Each
    web page on the Internet has its own unique URL. These usually start with http://www.


    Variable(s) is a placeholder for something in a computer program that could change.


    Virtual reality is a simulated 3-D experience used to make a computer-generated
    environment immersive. Usually, 3-D glasses or headsets are required to experience
    virtual reality. Some virtual reality is not recommended for kids under age 13.
    Younger kids are more likely to experience adverse effects such as eye strain
    and fatigue. Long-term research on this is not yet available, but for anyone using
    a VR headset, time limits are recommended.


    Virus is a type of malware that modifies programs by “infecting” them with its
    own malicious code.


    Virus scanners are part of antivirus software. When you run antivirus software,
    it searches through your system to locate and remove malware.


    Web browser is a software application that allows you to access the Internet.
    Some common web browsers include Google Chrome, Firefox, Microsoft Edge, and Safari.


    Wi-Fi is a system that uses radio waves to send Internet connectivity to devices,
    without the use of cords.


    Worm is a type of malware characterized by its ability to replicate independently
    once it breaches a system.'
