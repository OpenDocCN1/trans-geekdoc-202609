    ## 算法与编程扩展活动 3：创建随机密码


    通过从字母表的不同起点开始来更改密钥，并使用更安全的“秘密代码”写下你的名字！


    ### 大写字母到偏移二进制—密钥


    | 字母 | 二进制 | 字母 | 二进制 |

    | :--- | :--- | :--- | :--- |

    | A | 01000001 | N | 01001110 |

    | B | 01000010 | O | 01001111 |

    | C | 01000011 | P | 01010000 |

    | D | 01000100 | Q | 01010001 |

    | E | 01000101 | R | 01010010 |

    | F | 01000110 | S | 01010011 |

    | G | 01000111 | T | 01010100 |

    | H | 01001000 | U | 01010101 |

    | I | 01001001 | V | 01010110 |

    | J | 01001010 | W | 01010111 |

    | K | 01001011 | X | 01011000 |

    | L | 01001100 | Y | 01011001 |

    | M | 01001101 | Z | 01011010 |


    ## 算法与编程—变量—抽象


    CSTA K-2 标准 1A-AP-10：使用序列和简单循环开发程序，以表达想法或解决问题。


    > “编程被用作创建反映广泛兴趣的产品的工具。控制结构指定程序中指令执行的顺序。序列是程序中指令的顺序。例如，如果在编程简单动画故事时对话没有按正确顺序排列，故事就讲不通。如果编程机器人的命令顺序不正确，机器人就无法完成所需的任务。循环允许多次重复一段代码序列。例如，在展示蝴蝶生命周期的程序中，可以将循环与移动命令结合起来，让角色进行持续但受控的移动。”


    向年幼学习者教授的一项基本技能是故事的顺序。在学校，他们会阅读图画书或童话，并被要求识别故事的开头、中间和结尾。在有机会自己写（和/或画）故事时，孩子们通常会获得相同的结构。这项技能（按顺序排列事件/步骤）可以迁移到培养计算机科学技能。


    ## 教学序列


    在编程中，给出指令的顺序（序列）对程序的成功至关重要。回顾之前提到的刷牙示例（在刷牙后才把牙膏挤在刷子上），或者其他学习者可以与之建立具体现实生活联系的事物。


    另一个场景可能是：如果你的大人本应开车送你去约会玩耍？而不是他们通常做的事，他们开车去约会地点，然后打开车门把你放进安全座椅。问题出在哪里？你的大人需要按什么顺序采取哪些步骤才能送你去约会地点？一旦你从学习者那里得到成功的答案，就请他们举出自己因步骤顺序错误而产生问题的示例。通过陈述来结束这节课：“你遵循这些步骤的顺序很重要，不是吗？在计算机科学中，我们称按特定顺序排列步骤为序列。你能把这个词说给我听吗？”


    ## 教学循环


    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_65_0.png)


    理解如何编写高效代码的第二个重要概念是使用 **循环**。循环是使代码更高效的一种方式。不必多次重复同一行代码，只需创建一个循环即可。这就是说“拍手一次，拍手一次，拍手一次，拍手一次”和说“拍手四次”之间的区别。你可以使用这个示例来演示循环，然后陈述：“当我只说拍手四次时，是不是更快更简单？在计算机科学中，这样编写代码称为
    _循环_。把这个词说给我听（循环）。”如果你与稍大一点的学习者一起工作，可以让他们自己想出使用循环可以提高效率的示例，以检查理解情况。


    ## 算法与编程—模块化—计算问题


    CSTA K-2 标准 1A-AP-11：将解决问题所需的步骤分解为精确的指令序列。


    “分解是将任务分解为更简单任务的行为。学生可以分解制作花生酱果冻三明治所需的步骤、刷牙、画图形、让角色在屏幕上移动或解决编程应用中的关卡。”


    ## 介绍分解的脚本


    问你的学习者：“你喜欢蛋糕吗？你知道怎么做蛋糕吗？如果你在教室里，请学习者赞成举大拇指，反对举下大拇指，不确定的话举到一边。你只是弹个手指就完成了吗？不是！你必须知道要遵循哪些步骤以及按什么顺序。


    “你是一次性完成所有这些步骤吗？那样的话你需要非常多只手臂。我只有两只手臂，即使有两只手臂，我也一次只能处理一个步骤。那么，你知道我该怎么做吗？我必须将蛋糕制作食谱分解为一次一个步骤。你以前这样做过吗？


    “如果我漏掉一个步骤或犯了一个错误会怎样？如果我在蛋糕里加了一杯盐而不是一杯糖会怎样？给学习者一些回应的机会，并确保他们明白用盐代替糖不会好吃。我们需要检查每个步骤，以确保不犯错误，否则蛋糕可能会做得难吃。


    “你知道我们在编程中也这样做吗？你必须一次只进行一个步骤，并且必须检查每个步骤。在编程中，检查我们的步骤以确保我们做得对，这被称为调试。当你编写代码时犯错误，就意味着你的代码会难吃吗？不是！这意味着它可能无法工作，或者可能无法按你想要的方式工作。


    为了让这节课保持轻松愉快，你可以继续引用“难吃的代码”和“好吃的代码”。当你的学习者成功时，你可以告诉他们写出了超级好吃的代码。


    这也是一个很好的机会，向学习者展示如何逐步查看代码，方法是在 ScratchJr、Scratch 上演示，或者与较大的学习者一起使用代码怪物 (www.crunchzilla.com/code-monster)
    之类的工具。


    另一种加强学习 **分解**（将某事物分解为其组成部分，例如制作蛋糕所涉及的原料和步骤）的方法是让年幼的学习者查看一幅图画，并按形状将其分解。使用 *学习分解*
    讲义让年幼的学习者进行一些练习。


    ## 学习分解


    姓名


    在下面的图片中，写出你看到以下形状的数量。


    - 圆形

    - 三角形

    - 矩形


    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_68_0.png)


    ## 算法与编程—程序开发—测试


    CSTA K-2 标准 1A-AP-12：制定描述程序事件序列、目标和预期结果的计划。


    > “制定程序将做什么的计划可以澄清创建程序所需的步骤，并可用于检查程序是否正确。学生可以创建规划文档，例如故事地图、分镜图或序列图形组织者，以说明他们的程序将做什么。此阶段的学生可能在教师的帮助下完成规划过程。”


    年幼的学习者习惯于动手操作：绘画、学习握铅笔，并将想法写在纸上。学习如何创建程序也不应有所不同。


    鼓励你的学习者使用他们偏好的方法规划程序——这可能是分镜图、图形组织者或编程日志。年龄较小的学习者可以画出预期结果的图片。年龄较大的学习者可以创建包含序列的更多细节。指导年龄较大的学习者使用符号（例如，使用乘法符号“x”表示循环），并记录哪些有效、哪些无效以及他们打算下次尝试什么。


    ## 算法与编程—程序开发—沟通


    CSTA K-2 标准 1A-AP-13：在开发程序时使用他人的想法和创作时，应给出署名。


    > “使用计算机伴随着一定的责任。学生应当为他人创建的作品（如图片、音乐和代码）署名。如果向全班展示作品，署名可以口头进行；如果在班级博客或网站上分享作品，署名可以书面或口头进行。此阶段的适当署名不需要正式引用，例如参考文献或参考书目文档。”


    在成为合乎道德的技术使用者的过程中，即使是年龄最小的学习者也应当在使用或引用他人作品时给予署名。首先问年幼的学习者：“你在哪里找到这个精彩的 [无论是什么]？”，并指出如何查找作者、艺术家、编码者或组织名称等信息。如果你正在与正在发展阅读/写作能力的学习者一起工作，你可以让他们口头告诉你哪个作品是哪个朋友制作的。例如：“你知道是谁做了这个吗？给他们署名真的很重要。”对于阅读/写作能力进步的学习者，让他们练习通过编写简化的引用作品版本来给予署名，例如“照片由
    Aiza 拍摄”、“音乐由 Zuri 创作”或“代码由 Tasha 编写”。


