    Ask: “What can I do with this physical document? Can I hand it to you to look
    at? Could you draw on it or add details?” Next ask: “What about this digital copy
    of the invitation? Which one could I email to your grown-ups so that they can
    read about the robot dance party, right now? Which one could you carry home to
    show them?” Have your learners give their own examples of the advantages to each
    kind of data, the physical vs. digital invitation, and why they might choose to
    create it one way instead of the other (or when might it be a good idea to make
    both).


    Consider following up this lesson with an actual robot dance party. Your learners
    could dress like robots and/or dance like robots. You could even create a playlist
    of themed songs, “The Robots,” “It’s More Fun to Compute,” and “Home Computer”
    by Kraftwerk and “We Are the Robots” by Yo Gabba Gabba! Are all good choices.
    “Do the Funky Robot” by Bounce Patrol is also fun. You should be able to find
    all of these by Googling; however, I also have a selection of Robot Dance Party
    resources linked on my website (authorjuliedarling.com).


    # # Data: Extension


    As your learners get older and develop a good understanding of using data, point
    out file extensions (.pdf, .mp3, .docx). Explain that the file extension tells
    you what type of data that file contains. Understanding different types of files
    and file extensions is necessary for more sophisticated tasks such as uploading,
    downloading, and converting files.


    You’ll also want to talk about how data is stored and retrieved. Explain the differences
    between storing data on “the cloud” (on your Google Drive, for example), on your
    local drive on your school or home computer, on a shared drive, or on an external
    storage device. Include why you’d want to create backups of important data (just
    in case a file is corrupted or accidentally deleted).


    As your learners get more skilled, it’s also useful to teach them about how to
    organize data so it’s easily found, how to use logical naming conventions, and
    why saving groups of data in folders is useful. For example, while writing these
    books, I saved each book in a separate folder. The folder and manuscript for _Little
    Computer Scientists_ were called “Little Computer Scientists” and although I kept
    earlier versions of the manuscript, I named each version with a number (_v.7 Little
    Computer Scientists_, for example), so that I could easily find the most recent
    version. Organizing and naming data can transfer into other computer science skills
    too—web design, for example.


    # # HTML/Web Design: First Steps


    When designing websites, the web designer needs to figure out which links to add
    to the navigation menu and/or sidebar, what to name them, and how to organize
    those linked pages, so that people can locate them easily. This coupled with an
    understanding of HTML and CSS (and perhaps JavaScript) can develop into a web
    design career.


    Google Sites is an easy, free place for kids to practice HTML basics. Google Sites
    is connected to your Google account. Choose a new blank site, so it’s easier to
    see what you’ve made. In order to practice using HTML, locate the right-hand navigation
    where it says “Insert”. From here, you can access “Embed”. Choose “Embed code”,
    type in your HTML, then click “Insert” in the bottom left corner.'
