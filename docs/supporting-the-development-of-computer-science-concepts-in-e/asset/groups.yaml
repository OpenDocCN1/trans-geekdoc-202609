    ## 简介：如何使用本书


    《早期儿童计算机科学概念发展支持：家长与教育者实用指南》面向 4–8 岁儿童编写；然而，许多活动对稍大一点的学习者（最高 10 岁）也同样有效。本书采用的标准是计算机科学教师协会（CSTA）K–2
    年级计算机科学标准（经许可转载）。扩展活动基于作者教授技术 20 多年的经验。这些活动可供已经掌握内容并渴望学习更多内容的儿童使用。


    如果你刚开始教你的孩子或学生学习**计算机科学**，可以考虑按顺序使用本书。你也可以根据需要或兴趣跳着读，利用目录找到想要的主题。


    考虑将本指南与配套绘本 *Little Computer Scientists* 和 *Little Hackers* 搭配使用，通过有趣的故事和引人入胜的图片进行朗读，介绍计算机科学概念和词汇。你可以在我的网站
