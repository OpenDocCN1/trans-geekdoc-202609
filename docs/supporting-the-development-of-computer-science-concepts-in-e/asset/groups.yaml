    ## Computing Systems—Troubleshooting—Testing, Communicating


    > CSTA K-2 Standard 1A-CS-03: Describe basic hardware and software problems using
    accurate terminology.

    >

    > “Problems with computing systems have different causes. Students at this level
    do not need to understand those causes, but they should be able to communicate
    a problem with accurate terminology (e.g., when an app or program is not working
    as expected, a device will not turn on, the sound does not work, etc.). Ideally,
    students would be able to use simple troubleshooting strategies, including turning
    a device off and on to reboot it, closing and reopening an app, turning on speakers,
    or plugging in headphones. These are, however, not specified in the standard,
    because these problems may not occur.”


    If your learners are anything like mine, when something goes wrong with their
    device, they start by saying it’s “glitching” (or some similar catch-all phrase).
    “Glitch” is a useful word to indicate that something is going wrong. However,
    the first step for teaching kids how to successfully troubleshoot is to get them
    to be specific when describing the problem. The Troubleshooting Tasha to the Rescue
    handout on the following page includes useful steps for guiding troubleshooting
    (led by our mascot Troubleshooting Tasha). Consider using this as a tool to help
    scaffold troubleshooting with your learners.


    ### Troubleshooting Tasha to the Rescue!


    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_27_0.png)


