    ## 算法与编程—变量—抽象


    CSTA K-2 标准 1A-AP-09：通过使用数字或其他符号来表示信息，模拟程序存储和操作数据的方式。


    > "现实世界中的信息可以在计算机程序中表示。学生可以使用竖起大拇指/竖下大拇指来表示是/否，在编写算法时使用箭头来表示方向，或者使用数字、表意文字或其他符号来编码和解码单词，以表示字母或单词。"


    **变量**是计算机程序中可变事物的占位符。这是一个较大年龄学习者更容易掌握的抽象概念。不过，你也可以为年龄较小的学习者打下基础并介绍词汇。电子游戏中的积分/金币（积分/金币的数量会变化）是一个非常适合喜欢玩游戏的孩子的例子。


    ### 用杯子和果冻豆教授变量


    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_59_0.png)


    你也可以使用一杯果冻豆，向不同年龄段的学习者演示这个概念。给学习者一个小杯子，放入五颗果冻豆。告诉学习者，你的变量是 5。让他们选一颗果冻豆（任意一颗）并从杯子里拿出来（如果喜欢那个味道，可以吃掉）。让他们数一数还剩下多少颗果冻豆（4）。让他们大声说出：*变量是
    4*。重复此过程（可以变换一下，比如指导他们一次吃/拿走两颗而不是一颗，等等），直到杯子里所有的果冻豆都被拿走。


    重新开始，添加更多果冻豆（从不同的数字开始，比如 3），并重复该过程。告诉你的学习者：“我们的变量一直在变化，但它不会自行改变。是什么导致变量增加/减少？”
    当学习者年龄更大且在发展上合适时，你可以使这堂课更深入。关于何时深入讲解变量，一个很好的经验法则是针对初中阶段的学生（6–8 年级）。


    ## 跳房子跳跃算法


    在操场上玩跳房子游戏，重温**算法**/指令。如果附近的操场上没有现成的跳房子模板，你可以用粉笔画出来。每个方格应该足够大，让学习者穿鞋的脚能舒适地跳进去，但又不能太大，以至于单脚跳时也能跳到下一个方格的中心。传统的跳房子场地通常长这样：


    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_60_0.png)


    将学习者分成两人一组，或者如果你是直接与一名学习者一起工作，可以轮流进行。准备一个可以扔进跳房子方格的东西。这可以是一块石头、瓶盖，或者你手头有的任何东西。确定谁先开始，并让他们将物体扔进一个方格（在某些游戏版本中，你按顺序扔物体，先从方格
    1 开始，然后是方格 2，等等）。一个人跳，另一个人给跳跃者提供指令/算法。每个方格内只允许一只脚，跳跃者不能触碰边缘。跳跃者不能跳过方格，一旦捡起物体，他们就需要手里拿着物体，按逆序沿着方格跳回来。


    指令/算法可能是这样的：“用右脚跳进方格 1，现在右脚跳进 2，同时左脚跳进 3”等等。指令必须快速下达，否则你的跳跃者会失去平衡（这才有趣）！一旦捡起物体（通常是在弯腰并单脚保持平衡时），执行指令的人必须转身跳回方格
    1，同样不得触碰任何方格的外侧线，同时仍需按顺序遵循数字。如果他们摔倒或触碰外侧线（或者教练给出错误的指令，或者他们没有遵循正确的指令），他们可以重新开始再试一次（或者让别人来试——任一规则都可以）。一旦某人成功，就轮到下一个人。从传统的跳房子游戏开始，然后考虑换一种方式。


    由于这个游戏用于教学算法（与传统跳房子不同），让教练变换算法/指令。挑战教练给出能让跳跃者更快到达物体、降低其失去平衡的可能性、或增加挑战性的指令。如果他们跳房子跳得非常好，能不能倒着跳来做？跳跃者应严格遵循指令。如果教练没有给出正确的指令，跳跃者就无法成功，他们需要调试。


    一旦你的学习者掌握了这个，可以考虑让他们报名 Code.org 上的计算机科学基础课程。这个免费的、针对性的课程涵盖 4–11 岁，包括为“非阅读者”设计的课程。课程既有趣又吸引人，既包含在线选项，也包含“非联机”选项。如果这个平台对你和你的学习者效果良好，Code.org
    提供的课程可以一直教授计算机科学技能，直至高中。


    ## 二进制


    二进制是计算机的“语言”。它由 1（信号开启）和 0（信号关闭）组成。计算机芯片由晶体管组成，晶体管像微小的开关一样工作。如果电流流过晶体管，则为信号开启，即
    1。如果没有电流流过晶体管，则为信号关闭，即 0。二进制也称为机器代码。计算机的中央处理器（CPU）只能理解用二进制/机器代码编写的信息。


    由于二进制代码对计算机科学至关重要，值得教给学习者相关词汇，并引入“一个事物可以代表另一个事物”的概念。在《小小计算机科学家》中，读者被鼓励尝试使用二进制写出他们的“密码”名字。一年级（5–6
    岁）的学生就可以做到这一点。此外，最小的学习者可以用二进制“拍手”（张开手表示 0，拍手表示 1）。二进制也可以通过开关灯（开为 1，关为 0）来演示。让学习者在你开关灯时读出二进制数字序列，然后交换角色，让他们来拨动开关，这样会更有趣。使用“代码扩展活动
    2：使用二进制为你的代码编程”来帮助学习者用二进制写出他们的名字。对于年龄较小的学习者，我发现如果他们先圈出名字中的字母，这样能更快找到他们想要的二进制代码，会很有帮助。


    如果你想更深入地教孩子关于密码和加密的知识，（更具体地说，如何用不同的字母、数字或符号替换传统字母表字母来编写秘密代码），最简单的方法是给字母表编号，然后用数字替换字母。使用“代码扩展活动
    1：使用数字为你的代码编程”来帮助你的小年龄段学习者做到这一点。另一种传统选择称为凯撒（移位）密码，即移动字母表中的字母（例如，如果移位 1，你会把 A 写成
    B，B 写成 C，依此类推）。


    ## 代码扩展活动 1：使用数字为你的代码编程


