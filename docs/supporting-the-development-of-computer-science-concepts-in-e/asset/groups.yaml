    +   **Canva** (www.canva.com). Free, web-based graphic design tool for making
    invitations, posters, and more. Includes templates.


    +   **Code.org** (https://code.org). Free, comprehensive computer science curriculum
    for K-12 educators.


    +   **Code Club** (https://codeclub.org). Resources for running a Code Club for
    ages 9 and up. Includes free project guides for Scratch, Python, and HTML/CSS.


    +   **Code Monster by Crunchzilla** (www.crunchzilla.com/code-monster). A free,
    web-based interactive resource for learning the basics of JavaScript.


    +   **Common Sense Education** (www.commonsense.org/education). Free resources
    that can be used to effectively teach about Internet safety and digital citizenship
    in an age-appropriate way.


    +   **CS First** (https://csfirst.withgoogle.com/s/en/home). Google for Education
    computer science curriculum. Free, web-based and includes “unplugged” activities.


    +   **Experience AI** (https://experience-ai.org). Educational resources on artificial
    intelligence and machine learning aimed at ages 11–14.


    +   **Girls Who Code** (https://girlswhocode.com). Resources for clubs (focused
    on girls and non-binary students but open to all) for grades 3rd–5th and 6th–12th.
