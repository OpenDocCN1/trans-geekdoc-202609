    ### Script to Teach About Debugging


    Once your learners are familiar with the vocabulary from this song, give them
    a little more context for what debugging means by explaining the origin of the
    term. Admiral Grace Hopper made the term “debugging” famous when she was working
    with a team trying to figure out why their computer was delivering errors. When
    they opened up the hardware, they found a moth stuck inside. The moth was causing
    errors! Once they removed the moth and literally “debugged” their computer, they
    were able to fix the problem (National Geographic, 2020).


    Ask your learners: “Every time you have a problem with your computer, is it because
    there’s a moth inside of it? What do you think?” Tell them respond with a thumbs
    up for yes, thumbs down for no, thumbs to the side if they aren’t sure. “No, that’s
    just what we call it now; we call computer problems bugs in honor of that moth.
    Debugging means that we are finding and fixing the problem.”


    Finally, give your learners some live examples of finding and fixing errors, debugging
    code. Code Monster (www.crunchzilla.com/code-monster) is a great tool to use for
    this. As you follow the tutorial, you can purposely make a mistake and let your
    learners help you find and fix it. You could also read them Little Computer Scientists
    to reinforce this skill.


    ## Algorithms and Programming—Program Development—Communicating


    > CSTA K-2 Standard 1A-AP-15: Using correct terminology, describe steps taken
    and choices made during the iterative process of program development.

    >

    > “At this stage, students should be able to talk or write about the goals and
    expected outcomes of the programs they create and the choices that they made when
    creating programs. This could be done using coding journals, discussions with
    a teacher, class presentations, or blogs.”


    ### Script for Teaching the Iterative Process


    Ask: “When you first do something, do you always get it right that first time?
    (No!) Of course not. You have to practice, try different things, practice in different
    ways. For example, have you ever put together a puzzle? Do you have different
    strategies for finding which pieces fit together? What do you do if you think
    a puzzle piece goes in one spot, but it doesn’t fit? Do you throw it on the ground
    and cry? (No!) You try a different spot, or if you’re getting frustrated, you
    take a short break and come back to it later, right? This is what you do when
    your code doesn’t work too.


    “Trying different things and making changes until you get it right (or make it
    better) is called iteration. That’s a big word. Can you say that back to me?”
    Give a demo: “This doesn’t work the way I want it to, I’m going to try something
    else—what’s that big word I used again (iteration)?” “Right! I’m going to try
    a new iteration to see if it works better. I’m experimenting!


    It’s like creating a rough draft, then working on it more, to make it better.
    When you’re trying these different iterations, keep track of what you tried, what
    worked (and what didn’t) in a journal. We could share what we tried to our class
    as a group, or (especially if we’re learning from home) we could create a blog
    or a video to help others learn from our iterations/experiments!


    ### Destigmatizing Mistakes Encourages Growth


    Iteration is incredibly important because it helps to destigmatize mistakes. It’s
    not a bad thing to fail or make a mistake. Normalize mistakes, and take the stigma
    out, by calling them iterations. This helps kids feel safer about taking more
    risks, which leads to innovation (and a growth mindset). Teach kids that when
    they have a goal and they try something new, they should think about whether that
    choice got them closer or further away from their goal. If it pushed them further
    away, did they discover something interesting? Do they want to stick with their
    original goal or change it up? Celebrate students taking risks and getting outside
    of their comfort zones.

