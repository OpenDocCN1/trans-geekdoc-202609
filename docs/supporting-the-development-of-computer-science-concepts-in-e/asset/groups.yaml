    ## 扩展—网络—一些基础


    在《小小计算机科学家》中，朋友们设置了一个局域网（LAN，local area network），以便他们都可以一起在 Minecraft 中构建。局域网的常见用途是家中通过
    Wi-Fi 连接的设备。另一个例子是学校：计算机和打印机是网络的一部分，以便轻松共享文件，每个人都可以访问打印机。联网设备非常方便且有趣。然而，与许多有趣的事物一样，它们也可能带来安全风险。例如，如果有人访问您所有设备都连接在一起的网络，他们现在可能会入侵所有这些联网设备。这就是为什么我们使用防火墙，有时还会使用安全路由器和交换机来降低被入侵的可能性（也是为什么在使用公共免密码
    Wi-Fi 时需要格外小心）。


    互联网本身也被视为一个网络。这个网络通常被称为“云”。使用《云涂色页》向学习者展示可能连接到云的设备类型。


    ### 云


    下面画出的物体都可以连接到互联网。这就是它们被称为物联网（或简称 IOT）的原因。


    互联网是世界上最大的网络。它通常被称为**云**（虽然你肉眼看不见它——你必须想象它的样子）。使用云来访问或控制这些物体称为**云计算**。你可以把它想象成一朵悬浮在你头顶的大云，所有物体——物联网——都连接到它上面。


    给你认出的物体上色。接下来，按你想象的方式给云上色。


    数一下你认出的物体数量。在这里写下那个数字：___


    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_39_0.png)


    （涂色页来自 William Lau 的《计算机科学涂色书》。经许可复制。）


    ## 结论


    网络和网络安全是微妙且不断发展的学科，因此用大体笔触来教授这些内容很有帮助。对于年幼的学习者，温和地介绍安全概念及其必要性就足够了。网络和网络安全工作仍然供不应求；对这些主题感兴趣的学习者应被鼓励继续探索。希望你享受了玩“点击点击恶意软件！”和“红灯/绿灯密码安全游戏”以及唱“愚蠢密码歌曲”。第
    3 章将乐趣延续下去，通过机器人舞会和绘图（也许还要吃！）M&M’s（或你喜欢的零食）来进行数据与分析。


    ## 参考文献


    Lau, W. (2020). 《计算机科学涂色书：计算机科学的温和有趣入门》。William Lau.


    ## 第 3 章


    ### 数据与分析


    ### 引言


    教你的学习者通过融入机器人舞会和绘图（也许还有吃）M&M’s（或你喜欢的零食）等有趣活动来享受**数据**分析。使用本章中的课程来教授数字与物理（或实时数据）的区别，各自的优势和用途，如何进行预测，以及科学方法。


    ### 数据与分析—存储—抽象


    > CSTA K-2 标准 1A-DA-05：使用计算设备存储、复制、搜索、检索、修改和删除信息，并将存储的信息定义为数据。

    >

    > “计算设备存储和处理的所有信息都称为数据。数据可以是图像、文本文档、音频文件、软件程序或应用、视频文件等。当学生使用软件在计算设备上完成任务时，他们将操纵数据。”


    当孩子们最初学习数据时，他们需要被明确地教授不同类型的数据叫什么，如何区分不同类型的数据，以及如何保存和检索文件。在与你最年幼的学习者开始这些主题时，尽可能将数字世界与他们可以触摸和操纵的有形物理对象联系起来很有用。


    例如，可以考虑准备同一张照片的打印版和数字版、一份数字和打印的书面文档，以及一个麦克风，你可以对着它实时讲话，然后将你的声音数字化录制以供回放。在比较和对比这些内容时，还要有用地解释什么时候拥有数字与物理（或实时）数据表示是有帮助的（反之亦然）。


    ## 活动：比较和对比数字数据与物理/实时数据


    提前准备好你的数据和有形对象：


    - 同一张照片的数字版和实体版。

    - 一个麦克风（可以是设备内置的）和某种录音软件，准备好录制你的声音——Voice Memo、Voice Recorder 或基于网页的 Vocaroo (https://vocaroo.com)
    都可以。

    - 一份文档的实体版和数字版。这可以只是你的学习者名单、一段书面句子或段落（在 Microsoft Word、Google Docs 或对你最合适的任何工具中），并附有打印副本。


    或者，如果你想要更精致一些，可以设计一个有趣的活动（远足、聚会）邀请函。Canva (www.canva.com) 是我最喜欢用来设计邀请函的工具之一。


    这些数据比较可以一次性完成，也可以在几天内逐一处理——无论什么对你和你的学习者最合适。


    ### 比较数字照片数据与实体照片数据的脚本


    向你的学习者发放一张实体照片，并在设备上显示同一张照片的数字版本，让所有人都能看到。让他们说出他们注意到的数字照片和打印照片之间相同和不同的地方。倾听他们的回答，澄清任何误解。告诉他们照片是一种可以看到的数据。


    区分并命名实体版和数字版。询问他们认为每种类型各有什么优势：“我用这个[指向]实体照片能做什么，而用这个[指向]数字照片做不到”（反之亦然）。引导对话，帮助你的学习者思考数字版本的照片处理和复制。与之形成对比的是，打印副本随时可访问，而数字副本可能需要电池/电源，或者可能需要互联网连接，具体取决于它是如何存储/保存的。


    ### 比较实时音频数据与录制音频数据的脚本


    打开你喜欢的语音录音软件，准备就绪。Voice Memo、Voice Recorder 或基于网页的 Vocaroo (https://vocaroo.com)
    都可以。因为 Vocaroo 是基于网页的，因此在任何有互联网连接的设备上都可用，本脚本将以 Vocaroo 为例。


    不录制的情况下对你的学习者大声说一句话，例如：“我今天非常兴奋能给你们讲授计算机科学！我很高兴你们都在这里。我大声说出来是因为我希望你们实时听到。有没有办法我可以把这条消息保存为录制的数据，这样你们以后可以再次听到？即使我不在这里？”给你的学习者一个回应的机会。


    接下来，打开你的音频录音软件。向你的学习者讲解你正在做什么。例如：“我现在正在打开这个音频录音软件。我将用它来录制我的声音。语音录音，就像照片一样，是一种数据。我用来创建这个音频[指向你的耳朵]数据的软件叫做
    Vocaroo。你能重复一遍吗？你可以使用任何有互联网连接的设备访问 Vocaroo。你只需在谷歌等**搜索引擎**中输入 Vocaroo，或输入**网址**，vocaroo.com。我马上就要用它来录制我的声音了。看到那个红色的麦克风图标了吗[指向屏幕上的它]？当我准备好时，我只需点击它并开始说话。请确保关闭_你们_的声音，这样_这次_只录制我的声音。准备好了吗？3-2-1
    声音关闭。”


    “我正在点击红色麦克风开始录制……现在[点击红色麦克风图标]……我今天非常兴奋能给你们讲授计算机科学！我很高兴你们都在这里[按下中央的红色方块图标停止录制]。当
    Vocaroo 录制我的声音时，它向我显示了一个方块内闪烁的红色方块。你看到了吗？你注意到我点击了中间的那个大红色方块（方块内的方块）来停止并保存录制吗？你还注意到屏幕上有什么吗？让我们点击左侧的这个刷新按钮[点击带箭头的红色圆圈图标]重新开始录制，再看一遍。注意这样做会_擦除_第一次录制。我马上会向你展示如何_保存_你的录制。”


    '
