    # Extension—Networking—Some Basics


    In Little Computer Scientists, the friends set up a LAN (local area network),
    so that they can all build together in Minecraft. A common use for a LAN is the
    devices linked through Wi-Fi in your house. Another example is in school: computers
    and printers are part of the network so that files can be shared easily, and everyone
    can access the printers. Networked devices can be super convenient and fun. However,
    as with many things that are fun, they can also pose a security risk. For example,
    if someone accesses the network where your devices are all linked together, they
    now could potentially hack into all these linked devices. This is why we use firewalls
    and sometimes secure routers and switches to make hacking less likely (and why
    you need to be extra careful when using public, password-free Wi-Fi).


    The Internet itself is also considered a network. This network is often called
    “the cloud”. Use The Cloud Coloring Page to show your learners the kinds of devices
    that could be connected to the cloud.'
  - '[PAGE 39]


    # The Cloud


    The objects drawn below can all connect to the Internet. That''s why they''re
    called the Internet of Things (or IOT for short).


    The Internet is the biggest network in the world. It''s often called **the cloud**
    (although you can''t see it with your eyes—you have to imagine what it looks like).
    Using the cloud to access or control these objects is called **cloud computing**.
    You can imagine it like a big cloud floating above your head with all the objects—the
    Internet of Things—connecting to it.


    Color in the objects you recognize. Next, color the cloud however you imagine
    it.


    Count the number of objects you recognize. Write that number here: ___


    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_39_0.png)


    (Coloring page from Computer Science Colouring Book by William Lau. Reproduced
    with permission.)'
  - '[PAGE 40]


    # Conclusion


    Networking and cybersecurity are nuanced and ever-evolving subjects, so it’s helpful
    to teach these using broad strokes. For young learners, gently introducing the
    concept of security, and why it’s necessary, is sufficient. Networking and cybersecurity
    jobs continue to be in high demand; learners who find these topics interesting
    should be encouraged to continue exploring these. I hope you’ve enjoyed playing
    Click Click Malware! and The Red Light/Green Light Password Security Game and
    singing The Silly Password Song. Chapter 3 keeps the fun going, with data and
    analysis using Robot Dance Parties and graphing (and maybe eating!) M&M’s (or
    your preferred treat).


    # Reference


    Lau, W. (2020). Computer Science Colouring Book: A Gentle and Fun Introduction
    to Computer Science. William Lau.'
