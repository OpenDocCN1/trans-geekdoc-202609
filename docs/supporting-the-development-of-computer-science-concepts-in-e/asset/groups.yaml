    \ on the bottom of the screen and tell them to click on that once they’ve got\
    \ a recording that they like.\n\n![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_44_0.png)\n\
    \nFigure 3.3 Image of the save & share screen on the Vocaroo website.\n\nThis\
    \ will give them several options including copying the link to the recording (so\
    \ that they can paste it into your LMS to turn in), emailing it, downloading it\
    \ as an .MP3 file, creating and saving a **QR code** to access it, and more. Direct\
    \ your learners to the option that works best for them.\n\n![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_44_1.png)\n\
    \nFigure 3.4 Image of the additional sharing options on the Vocaroo website.\n\
    \nConclude this lesson by repeating your initial statement: “I’m super excited\
    \ to teach you about computer science today! I’m so glad you’re all here. I’ve\
    \ said this out loud to you, and now I’ve recorded it too, because I really want\
    \ you to hear that message, how glad I am that you’re here with me today! In this\
    \ lesson we learned about data. What’s the difference between when I spoke that\
    \ sentence to you *without* recording it versus when I recorded it?” Give your\
    \ learners a chance to respond, then continue: “What are some things that I can\
    \ do with the audio recording that I can’t do when I just speak out loud (without\
    \ recording it)?”\n\nPoint out that when you say the sentence live, your learners\
    \ can see your body language and facial expressions. This makes it easier for\
    \ them to see how glad you are to teach them. However, the audio recording of\
    \ that message can be saved and shared, which can be very useful, too—especially\
    \ for sharing the recording with someone who isn’t here today.\n\nHave your learners\
    \ come up with their own examples for why voice recordings are useful. If you’re\
    \ working one-on-one, your learner could just tell you about their ideas directly.\
    \ If you’re working with a big group, this is a good opportunity to “pair and\
    \ share” by having your learners pair up with one or two other kids next to them,\
    \ and take turns sharing their ideas with each other. To conclude this lesson,\
    \ call on a few learners to share with the group. If you want to reinforce the\
    \ mechanics of the lesson, you could even have them record their favorite thoughts\
    \ and save and share those.\n\n# Script for Comparing Digital Document Data vs.\
    \ Physical Document Data\n\nCreate an invitation. Print a copy and have a digital\
    \ copy displayed in a place that your learners can easily see. Feel free to use\
    \ the example below. You can access a copy of the sample invitation on my website\
    \ (authorjuliedarling.com).\n\nGreet your learners and tell them that you’re super\
    \ excited to invite them to a robot dance party (or whatever your invitation says).\
    \ Tell them that you’ve created this invitation so that they can remember the\
    \ details, the time and place, so that they don’t miss it. Explain that this invitation\
    \ is a type of data called a document.\n\n## You're Invited to a Robot Dance Party!!!\n\
    \n| Field | Details |\n|-------|---------|\n| Date: | |\n| Time: | |\n| Location:\
    \ | |\n\n![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_46_0.png)\n\nAsk: “What can\
    \ I do with this physical document? Can I hand it to you to look at? Could you\
    \ draw on it or add details?” Next ask: “What about this digital copy of the invitation?\
    \ Which one could I email to your grown-ups so that they can read about the robot\
    \ dance party, right now? Which one could you carry home to show them?” Have your\
    \ learners give their own examples of the advantages to each kind of data, the\
    \ physical vs. digital invitation, and why they might choose to create it one\
    \ way instead of the other (or when might it be a good idea to make both).\n\n\
    Consider following up this lesson with an actual robot dance party. Your learners\
    \ could dress like robots and/or dance like robots. You could even create a playlist\
    \ of themed songs, “The Robots,” “It’s More Fun to Compute,” and “Home Computer”\
    \ by Kraftwerk and “We Are the Robots” by Yo Gabba Gabba! Are all good choices.\
    \ “Do the Funky Robot” by Bounce Patrol is also fun. You should be able to find\
    \ all of these by Googling; however, I also have a selection of Robot Dance Party\
    \ resources linked on my website (authorjuliedarling.com).\n\n## Data: Extension\n\
    \nAs your learners get older and develop a good understanding of using data, point\
    \ out file extensions (.pdf, .mp3, .docx). Explain that the file extension tells\
    \ you what type of data that file contains. Understanding different types of files\
    \ and file extensions is necessary for more sophisticated tasks such as uploading,\
    \ downloading, and converting files.\n\nYou’ll also want to talk about how data\
    \ is stored and retrieved. Explain the differences between storing data on “the\
    \ cloud” (on your Google Drive, for example), on your local drive on your school\
    \ or home computer, on a shared drive, or on an external storage device. Include\
    \ why you’d want to create backups of important data (just in case a file is corrupted\
    \ or accidentally deleted).\n\nAs your learners get more skilled, it’s also useful\
    \ to teach them about how to organize data so it’s easily found, how to use logical\
    \ naming conventions, and why saving groups of data in folders is useful. For\
    \ example, while writing these books, I saved each book in a separate folder.\
    \ The folder and manuscript for _Little Computer Scientists_ were called “Little\
    \ Computer Scientists” and although I kept earlier versions of the manuscript,\
    \ I named each version with a number (_v.7 Little Computer Scientists_, for example),\
    \ so that I could easily find the most recent version. Organizing and naming data\
    \ can transfer into other computer science skills too—web design, for example.\n\
    \n## HTML/Web Design: First Steps\n\nWhen designing websites, the web designer\
    \ needs to figure out which links to add to the navigation menu and/or sidebar,\
    \ what to name them, and how to organize those linked pages, so that people can\
    \ locate them easily. This coupled with an understanding of HTML and CSS (and\
    \ perhaps JavaScript) can develop into a web design career.\n\nGoogle Sites is\
    \ an easy, free place for kids to practice HTML basics. Google Sites is connected\
    \ to your Google account. Choose a new blank site, so it’s easier to see what\
    \ you’ve made. In order to practice using HTML, locate the right-hand navigation\
    \ where it says “Insert”. From here, you can access “Embed”. Choose “Embed code”,\
    \ type in your HTML, then click “Insert” in the bottom left corner.\n\n![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_48_0.png)\n\
    \nFigure 3.5 A Google Sites screenshot demonstrating where HTML can be hand entered.\n\
    \nThere are a plethora of book and online resources for learning HTML. For young\
    \ learners just starting out, I like the “HTML with the Caveman” videos from SuperCampus\
    \ Jr (www.youtube.com/@supercampusjr9058).\n\n## Data and Analysis—Collection\
    \ and Visualization and Transformation—Communicating, Abstraction\n\n> CSTA K-2\
    \ Standard 1A-DA-06: Collect and present the same data in various visual formats.\n\
    > \n> “The collection and use of data about the world around them is a routine\
    \ part of life and influences how people live. Students could collect data on\
    \ the weather, such as sunny days versus rainy days, the temperature at the beginning\
    \ of the school day and end of the school day, or the inches of rain over the\
    \ course of a storm. Students could count the number of pieces of each color of\
    \ candy in a bag of candy, such as Skittles or M&M’s. Students could create surveys\
    \ of things that interest them, such as favorite foods, pets, or TV shows, and\
    \ collect answers to their surveys from their peers and others. The data collected\
    \ could then be organized into two or more visualizations, such as a bar graph,\
    \ pie chart, or pictograph.”\n\n## Activity: Use “Fun Size” Candy to Teach Kids\
    \ to Graph Data\n\nTeaching kids to analyze data using “fun size” bags of Skittles\
    \ or M&M’s is my favorite way to teach this skill because it’s extremely engaging\
    \ for kids. However, before you even introduce this lesson, you’ll want to make\
    \ sure that your learners understand that they cannot eat the candy until they’ve\
    \ completed the analysis (and maybe even shown the results to you, too). If your\
    \ learners are anything like mine, you’ll need to repeat this direction several\
    \ times before handing out the candy, and perhaps have them repeat it back to\
    \ you: “When can you eat your candy?” (Not until the end when you say it’s okay).\n"
  mdcn: "\n\n![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_43_0.png)\n\n图 3.1 Vocaroo 网站录制按钮图片。\n\
    \n点击红色刷新按钮，并指出录制按钮右侧的秒数计数器以及左侧的暂停按钮。说明秒数计数器告诉你录制时长（以秒为单位），屏幕左侧带有两条线的方框即为暂停按钮。暂停按钮用于在想要休息时暂停录制；准备好后，可再次点击它以继续同一录制。\n\
    \n![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_43_1.png)\n\n图 3.2 Vocaroo 网站录制进行中的图片。\n\
    \n如果您正在与年龄较大的学习者一起工作，可能希望在此处停下来，给他们尝试录制自己声音的机会。您需要确保他们能在自己的设备上轻松访问 Vocaroo。在黑板上写上“Vocaroo”，或通过\
    \ **学习管理系统**（LMS）分享链接。\n\n最后，您需要确保向学习者解释如何保存和共享他们的语音录音/音频数据。指引他们找到屏幕底部写有“Save\
    \ & Share”的绿色矩形图标，并告诉他们在得到喜欢的录音后点击该图标。\n\n![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_44_0.png)\n\
    \n图 3.3 Vocaroo 网站“保存和共享”界面图片。\n\n这将为他们提供多个选项，包括复制录音链接（以便粘贴到您的 LMS 中提交）、通过电子邮件发送、将其下载为\
    \ .MP3 文件、创建并保存 **二维码** 以便访问等。指导学习者选择最适合自己的选项。\n\n![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_44_1.png)\n\
    \n图 3.4 Vocaroo 网站额外共享选项图片。\n\n结束本课时，重复你开头说的话：“我今天非常兴奋能给你们讲解计算机科学！非常高兴大家都来了。我刚才大声对你们说过了，现在我也把它录下来了，因为我真的希望你们听到这段话，知道我有多高兴今天能和大家在一起！在本课中，我们学习了数据。我*未录制*就对你说这句话，与录制后对你说，有什么区别？”\
    \ 给学习者回应机会，然后继续：“音频录音能让我做哪些事情，而只是大声说出来（未录制）却做不到？”\n\n指出，当你当面说出这句话时，学习者可以看到你的肢体语言和面部表情。这使他们更容易看出你有多高兴能教他们。然而，该消息的音频录制可以保存和共享，这也非常有用——尤其是当需要与今天不在场的人分享录音时。\n\
    \n让学习者自己举例说明语音录音的用途。如果是一对一辅导，学习者可以直接向你讲述他们的想法。如果是面对大组，这是一个很好的“两两分享”机会：让学习者与旁边的一两个孩子配对，轮流分享各自的想法。结束本课时，请几位学习者向全组分享。如果你想巩固本课内容，甚至可以让他们录制自己最喜欢的想法，并保存和分享这些录音。\n\
    \n# 比较数字文档数据与物理文档数据的教学脚本\n\n制作一份邀请函。打印一份副本，并将数字副本显示在学习者容易看到的地方。随意使用下面的示例。您可以在我的网站（authorjuliedarling.com）上获取示例邀请函的副本。\n\
    \n欢迎学习者，并告诉他们你非常兴奋能邀请他们参加机器人舞会（或邀请函上写的任何内容）。告诉他们，你创建这份邀请函是为了让他们记住详细信息、时间和地点，以免错过。解释，这种邀请函是一种称为文档的数据。\n\
    \n## 你受邀参加机器人舞会！！！\n\n| 字段 | 详细信息 |\n|------|----------|\n| 日期： | |\n| 时间： | |\n\
    | 地点： | |\n\n![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_46_0.png)\n\n提问：“我可以用这份物理文档做什么？我可以把它递给你查看吗？你可以在上面画画或添加细节吗？”\
    \ 接着提问：“这份邀请函的数字副本呢？我现在可以把哪一份通过电子邮件发送给你的监护人，让他们立即了解机器人舞会的情况？你可以带哪一份回家给他们看？” 让学习者自己举例说明两种数据（物理邀请函与数字邀请函）各自的优势，以及他们为什么可能会选择其中一种方式而不是另一种（或者什么时候制作两种都是个好主意）。\n\
    \n您可以考虑用一场真实的机器人舞会作为本课的后续活动。学习者可以装扮成机器人和/或像机器人一样跳舞。您甚至可以创建一个主题歌曲播放列表，Kraftwerk\
    \ 的“The Robots”、“It’s More Fun to Compute”和“Home Computer”，以及 Yo Gabba Gabba!\
    \ 的“We Are the Robots” 都是不错的选择。Bounce Patrol 的“Do the Funky Robot”也很好玩。您应该能够通过谷歌搜索找到所有这些歌曲；此外，我的网站（authorjuliedarling.com）上也链接了一系列机器人舞会资源。\n\
    \n## 数据：扩展\n\n随着学习者年龄增长，并对数据使用有良好理解后，请指出文件扩展名（.pdf、.mp3、.docx）。解释文件扩展名告诉你文件包含什么类型的数据。理解不同类型的文件和文件扩展名是执行上传、下载和转换文件等更高级任务所必需的。\n\
    \n您还应讨论数据如何存储和检索。解释将数据存储在“云端”（例如您的 Google Drive）、学校或家用计算机的本地驱动器上、共享驱动器上或外部存储设备上的区别。包括为何需要为重要数据创建备份（以防文件损坏或意外删除）。\n\
    \n随着学习者技能提高，教他们如何组织数据以便轻松找到、如何使用逻辑命名约定，以及为什么将数据组保存在文件夹中很有用也很有价值。例如，在撰写这些书籍时，我将每本书保存在单独的文件夹中。文件夹和手稿\
    \ _小小计算机科学家_ 都称为“小小计算机科学家”，尽管我保留了手稿的早期版本，但我为每个版本都加上了数字命名（例如 _v.7 小小计算机科学家_），以便轻松找到最新版本。组织和命名数据也可以迁移到其他计算机科学技能中——例如网页设计。\n\
    \n## HTML/网页设计：初步步骤\n\n在设计网站时，网页设计师需要确定在导航菜单和/或侧边栏中添加哪些链接、如何命名它们，以及如何组织这些链接页面，以便人们能够轻松找到它们。结合对\
    \ HTML 和 CSS（或许还有 JavaScript）的理解，这可以发展成为网页设计职业。\n\nGoogle Sites 是孩子们练习 HTML 基础知识的一个简单免费平台。Google\
    \ Sites 与您的 Google 账户关联。选择一个全新的空白站点，这样更容易查看您制作的内容。为了练习使用 HTML，请找到右侧导航中写有“插入”的位置。从此处，您可以访问“嵌入”。选择“嵌入代码”，输入您的\
    \ HTML，然后点击左下角的“插入”。\n\n![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_48_0.png)\n\n\
    图 3.5 Google Sites 截图，演示了可以手动输入 HTML 的位置。\n\n有大量书籍和在线资源可供学习 HTML。对于刚开始学习的年轻学习者，我喜欢\
    \ SuperCampus Jr 的“HTML with the Caveman”视频（www.youtube.com/@supercampusjr9058）。\n\
    \n## 数据与分析——收集和可视化与转换——沟通，抽象\n\n> CSTA K-2 标准 1A-DA-06：以各种视觉格式收集和展示相同的数据。\n> \n\
    > “收集和使用关于周围世界的数据是日常生活的一部分，并影响着人们的生活方式。学生可以收集天气数据，例如晴天与雨天、上学开始时和结束时的温度，或暴雨过程中的降雨英寸数。学生可以数一数一袋糖果（如\
    \ Skittles 或 M&M's）中各种颜色糖果的数量。学生可以制作关于他们感兴趣事物的调查，例如喜欢的食物、宠物或电视节目，并从同龄人和其他人那里收集调查答案。收集到的数据随后可以组织成两种或更多可视化形式，例如柱状图、饼图或图画图。”\n\
    \n## 活动：使用“趣味装”糖果教孩子们绘制数据图表\n\n使用“趣味装”Skittles 或 M&M's 糖果袋教孩子们分析数据是我教授这项技能的最爱方式，因为这对孩子们来说极具吸引力。然而，在介绍本课之前，您需要确保学习者明白，在完成分析（甚至可能向您展示结果）之前，他们不能吃糖果。如果您的学习者和我的一样，您需要在分发糖果前多次重复这个指示，并可能让他们复述一遍：“你什么时候可以吃糖果？”（只有在最后我说可以的时候才能吃）。\n\
    \n"
