    # Extension Activity: Make a Digital Graph of Your Data


    If you''re working with older learners, you can use the data collected on their
    papers to create digital bar graphs and pie charts using Excel or Google Sheets
    (or whatever works best for you) to display the results. If you''re working with
    a group, they could also compare their numbers and maybe even find the mean, medium,
    and average number of each color.


    To create a pie chart with the data in Google Sheets, have your learners do the
