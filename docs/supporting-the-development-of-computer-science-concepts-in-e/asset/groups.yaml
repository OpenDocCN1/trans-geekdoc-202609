    ## When to Teach This


    This activity requires a basic understanding of counting, writing, or typing numbers
    (1–10) and identifying and writing or typing the names of colors. This would likely
    work well starting at the mid-point or end of Kindergarten (around age 5½). Older
    learners also find this engaging and could create more sophisticated graphs with
    their data using Excel or Google Sheets.


    ## To Scaffold in Advance


    If you''re working with younger learners, scaffold this part by providing a word
    bank with the names of the colors found in the “fun size” candy of your choice,
    written somewhere easily viewable, or feel free to copy the Use “Fun Size” M&M’s
    to Create a Bar Graph handout. Consider writing the names of the colors using
    those colors. For example, write “green” in green, “red” in red, etc. to assist
    with word recognition.


    It''s also useful to have a number line either at the desk/work station(s) or
    posted on the wall that your learners can consult as they count their candies.


    Note that food activities can sometimes be problematic. Before buying the candy,
    make sure you''re not going to run into allergen issues. If food allergies or
    other dietary restrictions are a problem, consider doing this activity with colorful
    beads or something similar.


    ## Gather Your Materials


    For this activity you''ll need:


    - One “fun size” bag of candy for each learner.

    - One piece of graphing paper, one piece of plain paper (or two pieces of plain
    paper if you don’t have graphing paper) or the Use “Fun Size” M&M’s to Create
    a Bar Graph handout.

    - A pencil for each learner and drawing tools (crayons, colored pencils, or markers)
    in colors corresponding to the candy colors (blue, brown, green, orange, red,
    yellow).

    - A word bank of the candy colors (for younger learners) written in the corresponding
    colors.

    - A number line (for younger learners, optional).

    - A ruler if your learners will be creating graphs on plain paper (optional).

    - Devices with software for graphing your digital data (for older learners).


    ## Script for Teaching


    Hand out one “fun size” candy pack to each learner and remind your learners again
    that they should not eat the candy until the activity is done. Hand out the papers
    and tell them that they can open up their candy and dump it out on top. Instruct
    your learners to group the candy into piles, by color. Once the candies have been
    separated by color, have them write the name of the color next to each pile (they
    could write these color names using the color, if they wished—for example, “green”
    using a green colored pencil). If you’re using the Use “Fun Size” M&M’s to Create
    a Bar Graph handout, you can skip the step of writing down the names of the colors
    (but your learners could still color the words with the corresponding color, if
    learning colors is a skill they’re working on).


    Next, have them count how many candies they have in each color pile. Demonstrate
    this by telling your learners to count the first pile, write the number of candies
    on the paper next to the name of the color, then count that same pile a second
    time to check their work. If they get a different count the second time, have
    them check again. They could also work with a friend to check each other’s work.


    Once they’re confident that their count is correct, they can draw a bar graph
    (or use the one on the handout) and color in the number of boxes that correlate
    to the number of candies in each color. For example, if they have three red M&M’s,
    they should color (using red) in the row labeled “red” columns 1, 2, and 3. Have
    them repeat this process until they’ve graphed all of their M&M’s.


