    # Conclusion


    I hope you and your learners enjoyed singing *The Debugging Song*, wrote lots
    of secret codes using binary, and found all the parts of the citation using the
    scavenger hunt. I hope you utilized algorithms to both make delicious trail mix
    and navigate a hopscotch court. I hope you used iterations to take risks and improve
    or discover new things. Most importantly, I hope you and your learners had fun.
    Now that you understand the basics of algorithms and programming, it’s time to
    address some of the *Impacts of Computing*. In our final chapter, we’ll cover
    some of these impacts including online safety, **digital citizenship**, and **cyberbullying**.


