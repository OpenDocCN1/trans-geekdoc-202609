    know the answer to these questions:


    ### Question 1: What isn''t working?


    ### Question 2: When isn''t it working (all the time or just on this one site/app/situation)?


    ### Question 3: What can we do to try to fix it?


    With some practice - you too can become a Troubleshooting Superhero!


    Use this space to draw yourself wearing a cape while fixing your device.


    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_28_0.png)


    ## Conclusion


    Chapter 1 contains everything you need to start your learners off on their computer
    science adventure in a thoughtful and joyful way. Continue to use the tools contained
    in this chapter to assist your learners as they progress with their knowledge
    of software, hardware, troubleshooting, coding, robotics, and physical computing.
    Peruse the Resources section in the back of this book for additional recommended
    materials.


