    # Algorithms and Programming


    # Introduction


    Chapter 4 digs deeply into **algorithms** and **programming**, topics at the backbone
    of computer science. Use this chapter to teach your learners about **decomposition**,
    **iteration**, **algorithms**, **sequences**, **variables**, **debugging**, **loops**,
    **attribution**, **binary**, and **ciphers**. Set your learners up for success
    by starting early with sorting, keyboarding, and pair programming. Sing *The Debugging
    Song* together and don’t forget to write your names in “secret code” using binary!


    # Programming—Scaffolding and Other Considerations


    # Sorting


    With your youngest learners, use sorting activities to reinforce pattern recognition,
    a crucial skill needed for programming and **debugging**. When teaching your young
    learners to put materials away, sort supplies into boxes and bins in different
    ways, with words and photographs on the front to indicate which way items should
    be sorted, and to support emergent reading. Switch this up periodically to help
    them learn different patterns/ways of sorting.


    For example, store blocks, art supplies, and other materials by numbers, blocks
    with numbers, number of sides, or whatever you think would work best with your
    materials, letters, shapes, and colors. This could be done with found objects
    (pine cones and leaves), as well as playroom or classroom materials. Consider
    structuring your learning environment this way. You can find endless suggestions
    and toys by Googling “Montessori sorting”.


    Give your learners a sense of ownership by asking *them* how objects or supplies
    should be sorted to make them easy to find, or easy to use, for certain activities.
    For example, ask your learners: “If I want to draw a picture of my house, how
    can I organize the drawing supplies so I can find the colors I want to use, quickly?”
    Making tasks quicker and easier is one of the main reasons computers are so powerful
    and useful. **Scaffolding** this idea with everyday tasks helps young learners
    start thinking this way.


    # Pair Programming


    When teaching kids about programming, have them pair up to work on tasks. This
    method of learning when applied to programming is called **pair programming**.
    Here’s how it works. Two kids will work together, frequently switching roles.
    One kid will start by writing the code—they’re called the “driver”. The other
