  - '[PAGE 1]


    # Supporting the Development of Computer Science Concepts in Early Childhood


    Supporting the Development of Computer Science Concepts in Early Childhood: A
    Practical Guide for Parents and Educators provides a solid understanding of computer
    science that sets your early childhood learner up for success!


    The guide provides ways to introduce vocabulary, games to reinforce concepts,
    and printable activities that help early childhood learners understand computer
    science in an engaging, age-appropriate way.


    This comprehensive guide covers the foundation of computer science (integrating
    the Computer Science Teachers Association K-2 standards) and includes information
    about binary, ciphers, using the command line, programming languages, sequencing,
    the basics of how computer systems and networks work, what hacking is, how to
    avoid phishing, and how to be a good digital citizen and stay safe online.


    For effective use, this book should be purchased alongside the picture books Little
    Hackers and Little Computer Scientists. All three books can be purchased together
    as a set, Developing Computer Science Concepts in Early Childhood [978-1-032-47108-2].


    Julie Darling is a teacher/librarian at the Ann Arbor STEAM school. She has a
    Master of Science in Information from the University of Michigan and is a Raspberry
    Pi certified educator. Julie has been teaching technology for more than 20 years.


    D. J. Cools is a writer, illustrator, and designer with a passion for books, outdoor
    adventure, and old cars. Originally from Washington State, D. J. enjoys cycling,
    exploring, and small-town family life in Southeastern Michigan.'
