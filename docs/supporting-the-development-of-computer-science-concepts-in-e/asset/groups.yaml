    ## 显示器


    轻拍显示器的侧面。说：“这看起来是硬的还是软的？”问：“那这就是硬件吗？”（是的！）问：“这是什么？”（电脑显示器/屏幕。）解释：“电脑显示器就是显示你正在处理内容的屏幕，并让你看到你可以用这台电脑做什么。”


    如果你正在与稍大或更高级的学习者一起工作，可以继续说：“你可以用这台电脑做什么，取决于上面加载的软件。你可以通过下载/安装软件/应用程序在这个设备上添加额外的软件吗？当然可以！你可以删除已经安装的应用程序/软件吗？当然！这也可以做。但是，你应该确保自己没有删除重要的东西，也没有安装可能含有
    **恶意软件** 的东西，尤其是如果这台电脑不属于你。我可以添加更多显示器，这样我就有更多空间来查看我在电脑上处理的内容吗？可以！”


    如果你一直连续照着这些脚本讲，对年龄较小的学习者来说，听太多了。根据学习者的年龄，可以考虑把脚本拆分成每天一个新想法。之后安排一次大脑休息、一首歌或一个能让学习者活动起来的游戏。_输入/输出霍基波基舞_
    是个不错的选择，因为它与学习硬件和软件相关。


    ## 输入/输出霍基波基舞


    按经典儿歌 _霍基波基舞_ 的曲调唱这些歌词：


    - 你把鼠标插进去 [假装插入]

    - 你把键盘插进去 [假装插入]

    - 你输入文字 [假装打字]

    - 你随意晃动双手 [张开并合拢双手]

    - 你进行输入/输出，掌控你的科技 [原地转圈]

    - 这就是全部的意思！[跟着节奏拍三下手]


    - 你把打印机插进去 [假装插入]

    - 你把文字打印出来 [假装抓纸张]

    - 你把图片打印出来 [假装双手各拿着文件]

    - 你把它们都展示出来！[举起你假装的文件]

    - 你进行输入/输出，掌控你的科技 [念这行时原地转圈]

    - 这就是全部的意思！[拍三下手]


    - 你做输入，输出 [原地摇摆]

    - 你做输入，输出 [原地摇摆]

    - 你做输入，输出 [原地摇摆]

    - 这就是全部的意思！[拍三下手]


    ## 扩展——物理计算与机器人


    **物理计算** 这个词有时与机器人技术互换使用，因为两者都可以包含带有传感器、灯光、显示器、电机和其他输入/输出的设备。这些功能使这些设备非常吸引人，也是增强你的计算机
    **STEAM** 或 **STEM** 课程的好方法。


    出于实际目的，我大致将两者区分开来；“机器人”下列出的大多是自成一体的设备，而“物理计算”下列出的产品则有多个部件，可以根据需要添加和/或组装。我还为高级/年龄较大的学习者包括了几个选项，以提供一些关于下一步去向的想法。如果你在学校工作，且组织没有为这些提供资金，可以考虑申请一笔补助金。在我目前的学校，我的同事们通过
    Bosch Best Grant (www.bestteachergrant.org) 取得了很大成功。


    物理计算和机器人涵盖了为不同年龄段设计的各种设备，具有各种功能和价格点。这可能会有点令人不知所措。购买前请务必做一些研究（如果可能的话，最好亲手试用），如果你在学校工作，可以考虑先只购买一台，然后再决定是否购买全班一整套。这一台设备或套件可以先作为选择/活动站，直到你确定什么最适合你的空间和你的年龄组。下面你会找到目前市场上一些不错选择的简要概述。


    ### 机器人/机器人技术概览


    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_23_0.png)


    - **Bee-Bot/Blue-Bot** ($$$) 推荐适合 3–8 岁。可以无屏幕使用。新款 Bee-Bot 和所有 Blue-Bot 型号包含“看并说”（语音和感知）。

    - **Botley** ($) 推荐适合 5 岁及以上。无屏幕，不需要额外设备即可运行，只需遥控“发射器”。包含活动套装。

    - **Code & Go Robot Mouse** ($) 推荐适合 4 岁及上。使用双面编码卡片进行无屏幕编程。

    - **Edison Robot** ($$) 推荐适合 4–16 岁。机器人小车。可以使用从条形码（适合最小的学习者）到“Edblocks”、“EdScratch”，最后到“EdPy”的年龄/技能进阶进行编程。

    - **Ozobot Evo** ($$–$$$) 推荐适合 5 岁及以上。可以使用彩色线条（颜色代码）或基于积木的编程（Ozoblockly）进行编程。可以有或没有屏幕地使用。

    - **Sphero Bolt** ($$$) 推荐适合 8 岁及以上（也可用于年龄较小的孩子）。色彩鲜艳、可编程的机器人球。比 Sphero mini 更大，功能更多。

    - **Sphero Mini** ($$) 推荐适合 8 岁及以上（也可用于年龄较小的孩子）。色彩鲜艳、可编程的机器人球。

    - **Wonder Workshop Dash** ($$$) 推荐适合 6–11 岁。使用 Blockly。


    ### 物理计算概览


    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_24_0.png)


    **Arduino** ($$–$$$) 套件推荐适合 11 岁及以上。可用于高级儿童和更复杂的项目。套件包含各种部件。对于喜欢 Makey Makey 的孩子来说，这是一个很好的进阶选择。


    **LEGO® Education Spike™ Essential** ($$$$) 套件专为 1–5 年级课堂使用而设计。建议每两名学习者配备一套。课程与计算机科学标准对齐。LEGO®
    还为 PreK–K（Coding Express）和初中（Spike™ Prime）提供课程/套件。


    Makey Makey ($$) 推荐适合 8 岁及以上。STEM“发明套件”。使用鳄鱼夹连接现实世界中的导电物体（你的身体、香蕉等）。


    Micro:bit ($) 推荐适合 8–14 岁。兼容 Microsoft MakeCode、Python 和 Scratch。


    Raspberry Pi ($$–$$$) 可用于高级儿童和更复杂的项目。套件包含各种部件。对于喜欢 Makey Makey 的孩子来说，这是一个很好的进阶选择。类似于
    Arduino，但有自己的操作系统。


    VEX ($$$–$$$$) 拥有各种产品，价格范围不同。“123”推荐适合幼儿园及以上，“GO”推荐适合 3 年级及以上，“IQ”推荐适合 6 年级及以上。套件功能多样，专为课堂使用而设计。


    ## 关于学习编程方式的说明


    物理计算/机器人选择可以用来学习不同的编程方式。起初可能看起来复杂，但基本上有三种学习编程的方式形成进阶：(1) 初读者调整方式，(2) 基于积木的编程，(3)
    基于文本的编程。


    ### 初读者调整方式


    我的首选推荐是 ScratchJr 应用程序，它通过拖放拼图风格的拼块来教授编程概念，为初读者提供有用的视觉调整。其他幼儿早期产品（在机器人/机器人技术概览部分中描述）使用诸如语音命令、卡片或彩色线条等功能。这些功能让我们年龄最小的学习者在学习阅读的同时也能取得成功。


    ### 基于积木的编程


    基于积木的编程选项包括 Scratch、Blockly 和 Snap！这些也允许学生拖放拼图风格的代码块，教授编程原理。此外，它们还包含书面详细信息/说明。基于积木的编程被推荐为学习编程的第一步（适合大约
    7 或 8 岁及以上的学习者），前提是学习者也能独立阅读。


    ### 基于文本的编程


    基于文本的编程适用于已经理解编程基本原理的学习者。基于文本的编程涉及输入实际编程语言的文本命令。学习者准备好进行这种编程的年龄取决于先前知识和动机。这可能早在
    8 岁，具体取决于学习者试图掌握哪种编程语言以及他们之前接触编程内容的程度。Python 和 HTML/CSS 被认为是很好的入门方式。相比之下，我不建议从
    C++ 开始。


