  - '[PAGE 23]


    # Extension—Physical Computing and Robots


    The term **physical computing** is sometimes used interchangeably with robotics
    as both can include devices with sensors, lights, displays, motors, and other
    inputs/outputs. Such features make these devices incredibly engaging, and they’re
    a great way to enhance your computer **STEAM** or **STEM** curriculum.


    I’ve loosely separated the two for practicality; most of what’s listed under “robots”
    is a self-contained unit, while the products listed under “physical computing”
    have multiple pieces that can be added and/or assembled as desired. I’ve also
    included a few options for advanced/older learners, for some ideas about where
    to go next. If you work in a school and you don’t have funding for these through
    your organization, consider writing a grant. In my current school, my colleagues
    have had great success with the Bosch Best Grant (www.bestteachergrant.org).


    Physical computing and robotics encompass a variety of devices created for a range
    of ages, with an assortment of capabilities and price points. It can be a bit
    overwhelming. Make sure to do some research (hands on, if possible) before purchasing,
    and if you work in a school, consider just purchasing one before committing to
    a whole class set. This single device or kit could be used as a choice/station
    until you’ve determined what would work best in your space and with your age group.
    Below you’ll find a brief overview of some good choices currently on the market.


    # Robots/Robotics Overview


    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_23_0.png)'
  - '[PAGE 24]


    +   **Bee-Bot/Blue-Bot** ($$$) recommended for ages 3–8. Can be used screen-free.
    New models of Bee-Bot and all models of Blue-Bot include “see and say” (voice
    and perception).


    +   **Botley** ($) recommended for ages 5 and up. Screen-free, you don’t need
    additional devices to make it work, just the remote “transmitter”. Includes an
    activity set.


    +   **Code & Go Robot Mouse** ($) recommended for ages 4 and up. Code without
    screens using double-sided coding cards.


    +   **Edison Robot** ($$) recommended for ages 4–16. Robot car. Can be coded using
    an age/skill progression from barcodes (for youngest learners) to “Edblocks”,
    “EdScratch”, and finally “EdPy”.


    +   **Ozobot Evo** ($$–$$$) recommended for ages 5 and up. Can be programmed using
    colored lines (color codes) or block-based programming (Ozoblockly). Can be used
    with or without screens.


    +   **Sphero Bolt** ($$$) recommended for ages 8 and up (can be used with younger
    kids). Colorful, programmable robot ball. Bigger and with more features than the
    Sphero mini.


    +   **Sphero Mini** ($$) recommended for ages 8 and up (can be used with younger
    kids). Colorful, programmable robot ball.


    +   **Wonder Workshop Dash** ($$$) recommended for ages 6–11. Uses Blockly.


    # Physical Computing Overview


    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_24_0.png)


    **Arduino** ($$–$$$) kits recommended for ages 11 and up. Can be used for advanced
    kids and more sophisticated projects. The kits include a variety of parts. A good
    next step for a kid who enjoyed Makey Makey.


    **LEGO® Education Spike™ Essential** ($$$$) kits designed for classroom use for
    grades 1–5. Recommendation of one kit for every two learners. Curriculum aligned
    to computer science standards. LEGO® also has lessons/kits for PreK–K (Coding
    Express) and middle school (Spike™ Prime).'
  - '[PAGE 25]


    Makey Makey ($$) recommended for ages 8 and up. STEM “invention kit”. Uses alligator
    clips to connect to conductive objects in the real world (your body, bananas,
    and more).


    Micro:bit ($) recommended for ages 8–14. Compatible with Microsoft MakeCode, Python,
    and Scratch.


    Raspberry Pi ($$–$$$) Can be used for advanced kids and more sophisticated projects.
    The kits include a variety of parts. A good next step for a kid who enjoyed Makey
    Makey. Similar to Arduino, but has its own operating system.


    VEX ($$$–$$$$) has a variety of products with a range of prices. “123” is recommended
    for K and up, “GO” for Grades 3 and up, and “IQ” for grades 6 and up. The kits
    are versatile. They are designed for classroom use.


    # A Note About Ways to Learn to Code


    The physical computing/robot choices can be used to learn different ways of coding.
    It may seem complex at first, but essentially there are three different ways to
    learn about coding that form a progression: (1) adaptations for emergent readers,
    (2) block-based coding, and (3) text-based coding.


    # Adaptations for Emergent Readers


    My first recommendation is the ScratchJr app, which offers useful visual adaptations
    for emergent readers by teaching the concepts of coding with drag and drop, jigsaw-style
    puzzle pieces. Additional early childhood products (described in the Robots/Robotics
    Overview section) use features such as commands using your voice, cards, or colored
    lines. These allow our youngest learners to be successful as they’re also learning
    to read.


    # Block-based Coding


    Block-based coding options include Scratch, Blockly, and Snap! These also allow
    students to drag and drop jigsaw-style blocks of code which teach the principles
    of coding. Additionally, they include written details/instructions. Block-based
    coding is recommended as a first step for learning how to code (starting around
    ages 7 or 8 and up) for learners who can also read independently.


    # Text-based Coding


    Text-based coding is for learners who already understand the basic principles
    of coding. Text-based coding involves typing the text commands of the actual programming
    language. The age at which learners are ready for this depends upon prior knowledge
    and motivation. This could be as early as age 8, depending on which programming
    language your learners are attempting to master and how much prior exposure to
    coding content they’ve had. Python and HTML/CSS are considered good ways to start.
    In contrast, I would not recommend starting with C++.'
