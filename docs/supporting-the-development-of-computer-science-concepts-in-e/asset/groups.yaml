    # Algorithms and Programming—Variables—Abstraction


    CSTA K-2 Standard 1A-AP-10: Develop programs with sequences and simple loops,
    to express ideas or address a problem.


    > “Programming is used as a tool to create products that reflect a wide range
    of interests. Control structures specify the order in which instructions are executed
    within a program. Sequences are the order of instructions in a program. For example,
    if dialogue is not sequenced correctly when programming a simple animated story,
    the story will not make sense. If the commands to program a robot are not in the
    correct order, the robot will not complete the task desired. Loops allow for the
    repetition of a sequence of code multiple times. For example, in a program to
    show the life cycle of a butterfly, a loop could be combined with move commands
    to allow continual but controlled movement of the character.”


    One of the basic skills that young learners are taught is the sequence of a story.
    In school, they’re read picture books or fairy tales and are asked to identify
    the beginning, middle, and end of the story. When given the opportunity to write
    (and/or draw) their own stories, kids are often given this same structure. This
    skill (putting events/steps in order) can be transferred to developing skills
    in computer science.


    # Teaching Sequences


    In programming, the order in which the instructions are given (the sequence) is
    important to the success of the program. Revisit the tooth-brushing example from
    earlier (putting the toothpaste on the brush after brushing your teeth), or something
    else that your learners can make a concrete, real-life connection to.


    Another scenario could be: what if your grown-up is supposed to drive you to a
    play date? Instead of what they normally do, they drive to the play date, then
    open the car door to put you in your car seat. What’s the problem? What steps,
    in what order, does your grown-up need to take to get you to your play date? Once
    you’ve received successful answers from your learners, ask them for their own
    examples of problems that are created by taking steps out of order. Conclude this
    lesson by stating: “The order that you follow these steps is important, isn’t
    it? In computer science we call putting steps in a certain order the sequence.
    Can you say that word back to me?”


    # Teaching Loops


    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_65_0.png)'
  - '[PAGE 66]


    A second important concept in understanding how to write effective code is by
    using **loops**. Loops are a way of making your code more efficient. Instead of
    repeating the same line of code several times, you can simply create a loop. This
    is the difference between saying “Clap your hands one time, clap your hands one
    time, clap your hands one time, clap your hands one time” and “Clap your hands
    four times”. You can demonstrate loops by using this example, then stating: “It’s
    faster and easier when I just said clap your hands four times, isn’t it? In computer
    science writing code that way is called a _loop_. Say that word back to me (loop).”
    If you’re working with slightly older learners, you can do a check for understanding
    by asking them to come up with their own examples of when they could improve efficiency
    by using loops.


    # Algorithms and Programming—Modularity—Computational Problems


    CSTA K-2 Standard 1A-AP-11: Decompose (break down) the steps needed to solve a
    problem into a precise sequence of instructions.


    "Decomposition is the act of breaking down tasks into simpler tasks. Students
    could break down the steps needed to make a peanut butter and jelly sandwich,
    to brush their teeth, to draw a shape, to move a character across the screen,
    or to solve a level of a coding app."


    # Script to Introduce Decomposition


    Ask your learners: “Do you like cake? Do you know how to make a cake? If you’re
    in a classroom, ask your learners to give you a thumbs up for yes, down for no,
    to the side if they’re not sure. Do you just snap your fingers and it’s done?
    No! You have to know which steps to follow and in which order.


    “Do you do these steps all at once? You would need SO many arms to do that. I
    only have two arms and I can really only handle one step at a time, even with
    my two arms. So, you know what I have to do? I have to break down the cake making
    recipe into one step at a time. Have you done that before?


    “What if I miss a step or make a mistake? What would happen if I added a cup of
    salt to my cake instead of a cup of sugar? Give your learners a chance to respond
    and make sure they understand that salt instead of sugar wouldn’t taste good.
    We need to check each step to make sure we don’t make a mistake, or our cake could
    turn out yucky.


    “Did you know that we do this with coding too? You have to take it one step at
    a time, and you have to check each step. With coding, checking our steps to make
    sure we’re doing it right is called debugging. Does making a mistake when you
    write code mean that your code will taste yucky? No! It will mean it might not
    work, or maybe it doesn’t work how you want it to.


    To keep this lesson lighthearted, you could continue to reference “yucky code”
    and “yummy code”. When your learners are successful, you could tell them they
    wrote super yummy code.'
