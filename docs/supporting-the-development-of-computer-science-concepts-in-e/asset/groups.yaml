    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_20_0.png)


    # # Computing Systems—Hardware and Software—Communicating


    CSTA K-2 Standard 1A-CS-02: Use appropriate terminology in identifying and describing
    the function of common physical components of computing systems (hardware).


    “A computing system is composed of hardware and software. Hardware consists of
    physical components. Students should be able to identify and describe the function
    of external hardware, such as desktop computers, laptop computers, tablet devices,
    monitors, keyboards, mice, and printers.”


    Teaching kids about hardware is important, but simply having them memorize facts
    is too dry. It’s important to take this slowly. Allow kids to physically handle
    the items when possible and use games, songs, and humor to make learning more
    engaging.


    # ## Scripts for Teaching Hardware


    # ### Computer Mouse


    Start by showing your learners an external, corded mouse. Say: “Does anyone know
    what this is called? Look, it has a tail! But in this case, since it connects
    to a computer, this part [point at the cord], is actually called'
  - '[PAGE 21]


    a cord.” If your learners don’t guess correctly, explain that it’s a computer
    mouse. Have them repeat back “computer mouse”.


    Give it a gentle tap with your finger. Ask: “Does this seem hard or soft?” Let
    them handle it to see that it’s hard. Pass it around. Once everyone has had a
    chance to touch it, ask: “Do you think it’s *hardware* or *software*?” Next ask:
    “What do I use this for?” If your teaching style is to be a little silly, you
    could say something like “Do I wear it as a hat? Do I use it as a belt? How about
    an earring? No?”


    After you’ve had a laugh with your learners, bring it back to the lesson: “What
    *do* I use this for, then (if not as a fashion accessory)?” Explain that a computer
    mouse is like an extension of your finger or your hand. Mice are especially useful
    if you’re not using a device with a touch screen. If you haven’t played the mouse/cursor
    games from earlier in this chapter, explain that when you move your mouse along
    a flat surface, the pointer on the screen of your device moves in the same direction.
    When you tap (click) on the top, left side of your mouse, it clicks on the screen.
    If you click on the right side of your mouse, it often gives you extra options.
    If you *have* played the mouse/cursor games, you can invite a learner to demonstrate
    how mice work!


    # Desktop vs. Laptop Computers


    When teaching your learners the difference between desktop and laptop computers,
    it’s useful to have an example of at least one of each kind in the room. Say:
    “I have two (or however many) computers here.” Tap on the side of each one. “Is
    this hard or soft? Does that make these computers *hardware*?” (Yes!)


    Differentiate between laptop and desktop computers by saying: “One of these is
    a laptop computer (point), one of these is a desktop computer (point). Which do
    you think would be more comfortable on my lap?” Have your learners point. “This
    smaller one here, right? It’s a laptop computer, because I can put it on *top*
    of my *lap* to use it. Which one is better left on the desk?” Have your learners
    point. “This heavier one (possibly with more parts, depending on the type of computer)
    right? I’m going to leave that one on the *top* of my *desk* when I’m using it.
    It would be really uncomfortable on my lap! That’s why it’s called a *desktop*
    computer because you’re going to want to keep it on your desk when you use it!”


    # Printer


    Tap on the side of a printer (your learners should be getting used to this by
    now). Say: “Does this seem hard or soft?” Ask: “Does that make it hardware?” (Yes!)
    Ask: “What is this?” (A printer.) “What does it do?” (Prints documents when you
    “tell” it to.) Explain that some printers only print in black and white, while
    others can *also* print in color. Point out that printers are only built to handle
    certain sizes of paper. A running theme you should keep coming back to is that
    everything in computer science is defined by the ways in which hardware and software
    are built and programmed. These are their limitations. You could ask: “Could I
    build a printer that printed really big sheets of paper—giant posters, for example?”
    (Sure!) “Can this printer do that?” (No, because it wasn’t built to do that.)'
