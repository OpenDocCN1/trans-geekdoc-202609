    # Algorithms and Programming—Program Development—Testing


    CSTA K-2 Standard 1A-AP-12: Develop plans that describe a program’s sequence of
    events, goals, and expected outcomes.


    > "Creating a plan for what a program will do clarifies the steps that will be
    needed to create a program and can be used to check if a program is correct. Students
    could create a planning document, such as a story map, a storyboard, or a sequential
    graphic organizer, to illustrate what their program will do. Students at this
    stage may complete the planning process with help from their teachers."


    Young learners are used to working with their hands: drawing, learning to hold
    a pencil, and putting their thoughts down on paper. Learning how to create programs
    should be no different.


    Encourage your learners to plan out their programs using their preferred method—this
    could be a storyboard, graphic organizer, or coding journal. Younger learners
    could draw a picture of an expected outcome. Older learners could create more
    details that include the sequence. Coach older learners to use notations (i.e.,
    the multiplication symbol “x” to indicate loops) and to keep track of what worked,
    what didn’t, and what they plan to try next.


    # Algorithms and Programming—Program Development—Communicating


    CSTA K-2 Standard 1A-AP-13: Give attribution when using the ideas and creations
    of others while developing programs.


    > "Using computers comes with a level of responsibility. Students should credit
    artifacts that were created by others, such as pictures, music, and code. Credit
    could be given orally, if presenting their work to the class, or in writing or
    orally, if sharing work on a class blog or website. Proper attribution at this
    stage does not require a formal citation, such as in a bibliography or works cited
    document."


    In becoming ethical technology users, even our youngest learners should be taught
    to give credit when using or referencing someone else''s work. Start by asking
    young learners: “Where did you find this fantastic [name whatever it is]?” and
    pointing out how to find information such as author, artist, coder, or the name
    of the organization. If you’re working with emergent readers/writers, you can
    have them tell you orally which work was made by which friend. For example: “Do
    you know who made this one? It’s really important to give them credit.” For learners
    who are progressing with reading/writing, have them practice giving credit by
    writing a simplified version of citing works such as “photo by Aiza”, “music by
    Zuri”, or “code by Tasha”.'
