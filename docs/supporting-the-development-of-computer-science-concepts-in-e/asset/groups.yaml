    # Software Extension: Explaining Operating Systems


    When determining if software is compatible with (works with) your device, the
    first consideration is which operating system your device is running. The operating
    system’s job is to manage all of the software and hardware running on your device.
    The three most commonly used operating systems are Microsoft Windows (most PCs),
    MacOS (Apple products), and Linux (open source). Use the Operating Systems coloring
    page on the next page to introduce operating systems to your learners.'
