    purple, you can use CSS to do that—quickly!


    - **Icon/thumbnail** is the tiny, clickable picture (which sometimes also includes
    text), that provides an idea for what the program or file is.


    - **Internet of Things (IOT)** are devices that can be controlled through the
    Internet. This includes computers, phones, appliances, lights, and more.


    - **Iteration** is part of the engineering design process whereby you continue
    to improve your design to fix problems and make improvements. This applies to
    improving or fixing your code.


    - **JavaScript** is a web programming language for creating dynamic/interactive
    website content.


    - **Key** is the tool used to encrypt or decrypt data—for example, when encoding
    or decoding a secret code.


    - **LAN stands for Local Area Network.** This is a way of connecting devices together
    to form a network. It’s often used to allow several people to access the same
    information. One intriguing use of a LAN is to set one up so that your kids can
    play Minecraft with their friends. As they get older, they can learn to do this
    themselves. Another example of a LAN is a Wi-Fi router in a house. This is a LAN
    that connects the devices that you use at home which could include computers,
    televisions, smart speakers, smart thermostats, smart appliances, etc.


    - **Learning management system (LMS)** are systems such as Google Classroom, Canvas,
    Blackboard, or Seesaw (a limited learning management system that’s considered
    a better fit for early elementary-aged kids). They are tools used to organize
    and share resources with students, quickly and easily.


    - **Loops** are programming instructions that are repeated until a certain condition
    is met.


    - **Machine code** (see Binary).


    - **Malware** also called malicious software, is a program that’s designed to
    cause harm. Different types of malware do different things, including slowing
    down your device, sending spam emails that infect other devices (viruses), stealing
    your personal data, or even preventing you from accessing anything on your device
    until you pay the hacker money (ransomware).


    - **Micro:bit** is a physical computing device, sometimes referred to as a “tiny
    computer”.


    - **Mouse over/mouse hover** is when you move your mouse/cursor over something,
    but don’t click. Mousing over something on a computer often results in displaying
    additional information before you click. This is a useful skill (and time saver)
    to teach to young learners.


    - **Multi-factor authentication** is a method of making your account more secure.
    When this is enabled, the first “factor” is your password, the next “factor” could
    be a verification code that was texted or emailed to you, biometrics such as voice,
    fingerprint, face or retina scan, etc.


    - **Open Source** is where anyone can see the code. Anyone is also allowed to
    use it and edit it.


    - **Operating systems** manage all of the software and hardware running on your
    device. The three most commonly used operating systems are Microsoft’s Windows,
    MacOS, and Linux.


    - **Pair programming** is when two people pair up to code together. One takes
    the role as the “driver” and writes the code while the other person, the “navigator”,
    will check the code and give input. The driver and the navigator switch roles
    frequently.


    - **Penetration testing** also called “pen testing”, is when a cybersecurity expert
    launches a fake cyberattack to locate vulnerabilities.


