    # # Why I Wrote These Books:


    # ## Early Elementary Teaching Resources and Inclusion in Computer Science


    I was inspired to write this series—*Little Computer Scientists*, *Little Hackers*,
    and *Supporting the Development of Computer Science Concepts in Early Childhood*—because
    I’ve taught technology in the K–12 setting for more than 20 years, and although
    there are a host of books for teaching technology and computer science concepts
    for kids ages 8 and up, i’ve been unable to find good, comprehensive books for
    teaching these concepts to early elementary kids. It is my sincerest hope that
    you’ve found that here.


    In addition, despite all of the resources and initiatives aimed at capturing the
    interest of those identifying as female and **BIPOC** folks in STEM, fewer of
    these folks are continuing into STEM careers. In investigating why, I stumbled
    across a body of research indicating that part of the issue (for those identifying
    as female) is due to gender stereotyping. Even more troubling is that these stereotypes
    start as early as age 6 (Master et al., 2021). We know that representation matters,
    that it helps defy the stereotypes. This three-book series—*Little Computer Scientists*,
    *Little Hackers*, and *Supporting the Development of Computer Science Concepts
    in Early Childhood*—written for kids ages 4–8, is my humble contribution to help
    address this. I very much hope that all young learners can see themselves reflected
    in the pages.


    Thank you so much for reading my books! You can find additional resources on my
    website: authorjuliedarling.com.


    # ## Reference


    Master, A., Meltzoff, A., & Cheryan, S. (2021, November 22). Gender stereotypes
    about interests start early and cause gender disparities in computer science and
    engineering. **PNAS** 118(48), e2100030118. https://doi.org /10.1073/pnas.2100030118.'
  - '[PAGE 84]


    # Glossary, Resources and Index


    # Glossary


    This glossary includes terms in bold found throughout the text as well as other
    terms you may encounter when exploring computer science with your learners.


    **Abstraction** is separating out details that aren’t needed from those that are
    for your task at hand. Abstraction is useful for making complex ideas and concepts
    easier. It’s zooming out and looking at the big picture instead of getting distracted
    by every detail. In computer science, abstraction makes it easier to understand
    code by focusing on core features instead of small details.


    **Algorithm** is a set of steps done in a certain order used to complete a task
    or solve a problem. A recipe is an example of an algorithm.


    **Arrays** are data structures that allow you to store a related (same data type)
    collection of data such as lists of numbers or names.


    **Artificial intelligence (AI)** is when computer systems are capable of learning
    and problem solving. It is an emerging field of computer science. AI allows computers
    to perform tasks that previously only humans were capable of.


    **Attribution** is giving credit to the author or artist of a work.


    **Augmented reality** is when you enhance the real-world environment with virtual
    elements. Pokémon GO is an example of augmented reality, because the Pokémon GO
    characters are superimposed on your view of the real world, through your camera.


    **Binary** is the “language” of computers. It is made up of 1’s (signal on) and
    0’s (signal off). Computer chips are made up of transistors that act like tiny
    switches. If an electrical current is flowing through the transistor, it is a
    signal on, or 1. If no electrical current is flowing through the transistor, it
    is a signal off, or 0. Binary is also called “machine code”. The central processing
    unit (CPU) of a computer can only understand information written in binary/machine
    code.


    **BIPOC** stands for Black, Indigenous, and People of Color.


    **Blockly** is a block-based visual programming language similar to Scratch.


    **Boolean expressions** have two options “true” or “false”. This could also be
    “yes” or “no” or “1” and “0”. For example, if you’re taking a quiz and you get
    the right answer, that would be a “true” or “yes” or “1”; if you get the wrong
    answer, it’s “false” or “no” or “0”.


    **Brute-force attack** is when a hacker attempts to gain access to your account
    by trying every possible password combination. If your password is short (e.g.,
    a four-digit number) or a word found in a dictionary, it’s more vulnerable to
    brute-force attacks.'
