    ## 何时教授此活动


    本活动要求学习者具备计数、书写或输入数字（1–10）以及识别、书写或输入颜色名称的基本理解。此活动可能最适合从幼儿园中段或期末开始（约 5½ 岁）。年龄较大的学习者也会觉得这很有趣，并可以使用
    Excel 或 Google 表格 用他们的数据创建更复杂的图表。


    ## 事先搭建支架


    如果你正在与年龄较小的学习者一起工作，可以通过提供包含你选择的“趣味装”糖果中颜色名称的单词库来搭建这部分内容，将单词库写在容易看到的地方，或者随意复制“使用‘趣味装’M&M''s
    制作条形图”讲义。考虑使用这些颜色来书写颜色名称。例如，用绿色写“green”，用红色写“red”，等等，以协助单词识别。


    在学习者数糖果时，让他们可以查阅的课桌/工作站或墙上贴有数字线也很有用。


    请注意，食物活动有时可能会带来问题。在购买糖果之前，请确保不会遇到过敏原问题。如果食物过敏或其他饮食限制是个问题，可以考虑使用彩色珠子或类似物品来进行此活动。


    ## 收集材料


    本活动需要：


    - 每位学习者一袋“趣味装”糖果。

    - 一张方格纸，一张白纸（如果没有方格纸则用两张白纸）或“使用‘趣味装’M&M''s 制作条形图”讲义。

    - 每位学习者一支铅笔，以及与糖果颜色相对应的绘画工具（蜡笔、彩色铅笔或记号笔）（蓝色、棕色、绿色、橙色、红色、黄色）。

    - 糖果颜色的单词库（针对年龄较小的学习者），用相应颜色书写。

    - 数字线（针对年龄较小的学习者，可选）。

    - 如果学习者将在白纸上制作图表，则需要一把尺子（可选）。

    - 用于绘制数字数据图表的软件设备（针对年龄较大的学习者）。


    ## 教学脚本


    向每位学习者发放一包“趣味装”糖果，并再次提醒他们在活动完成前不要吃糖果。发放纸张，并告诉他们可以打开糖果，将其倾倒在上面。指导学习者按颜色将糖果分成堆。糖果按颜色分开后，让他们在每堆旁边写下颜色名称（如果他们愿意，可以用相应的颜色书写这些颜色名称——例如，用绿色铅笔写“green”）。如果你使用“使用‘趣味装’M&M''s
    制作条形图”讲义，可以跳过写下颜色名称的步骤（但如果学习颜色是他们正在练习的技能，学习者仍然可以用相应颜色给单词上色）。


    接下来，让他们数出每个颜色堆中有多少颗糖果。通过指导学习者数第一堆，将糖果数量写在纸上颜色名称旁边，然后再次数同一堆来检查工作，来演示这一点。如果第二次的计数不同，让他们再检查一遍。他们也可以和朋友互相检查彼此的工作。


    一旦他们确信计数正确，就可以画出条形图（或使用讲义上的条形图），并涂色与每种颜色糖果数量相对应的方框数量。例如，如果他们有三颗红色的 M&M''s，应该（使用红色）在标记为“red”的行中涂色第
    1、2、3 列。让他们重复此过程，直到他们将所有 M&M''s 都画在图上。


