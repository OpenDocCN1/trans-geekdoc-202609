- pgno: 58
  md: 'Having the steps written out also helps to better model what algorithms in
    computer science look like (as opposed to simply giving oral instructions). Use
    this traditional trail mix recipe. Tweak for taste and allergies, and consider
    adding photographs of the steps, using your chosen ingredients.


    # # Simple Trail Mix Recipe


    Take out a 1-cup measuring cup and either a large reusable container, with a tight-fitting
    lid (that can fit four cups) or a one-gallon plastic baggie (slider or zip-style
    closures work best for shaking the ingredients and keeping them fresh).


    Gather your ingredients:


    +   * Raisins

    +   * M&M''s

    +   * Peanuts (or something else crunchy)

    +   * Cheerios cereal


    Use your measuring cup to measure out one cup of each ingredient and add these
    (one at a time) to your container.


    Seal the lid (or top of the baggie), check it to make sure it''s on nice and tight,
    and shake vigorously to mix ingredients together. Enjoy! This trail mix is great
    for taking with you when you go hiking or on other adventures.


    Teachers and parents/guardians can also work with younger learners to create visual/written
    **algorithms** to post about various routines—getting ready for bed, getting ready
    for school, the agenda for the school day, stations and the way that you rotate
    through, etc. Make sure to keep these simple—young kids can only successfully
    follow a few instructions at a time. No more than three at a time is a good rule
    of thumb (although this can be built upon as it becomes routine). Older learners
    can follow instructions with more steps and that have a greater level of complexity.
    As with all learning, find ways to make this creative and fun.


    Introduce each of these routines one at a time and continue to refer to them as
    “algorithms”—for example, “What’s our algorithm for getting ready for bed? First
    we brush our teeth...” Have your learner tell you what the steps are for each
    part of the routine/algorithm. Younger learners can point to visual steps/cues
    for the routines, to reinforce the steps and the order. If this feels tedious
    to write these all out from scratch, consider an assist from an **AI** site, such
    as GoblinTools (https://goblin.tools) to break your task down by steps. From there
    it’s easy to tweak and add your own photos from school or home.


    Ask your learner what would happen if you brushed your teeth _and then_ put the
    toothpaste on your toothbrush. Discuss how the order of the steps in your algorithms/routines
    are important both in real life _and_ when giving instructions to your computer.
    Doing steps in the wrong order will result in a routine/program that doesn''t
    get your desired results.'
