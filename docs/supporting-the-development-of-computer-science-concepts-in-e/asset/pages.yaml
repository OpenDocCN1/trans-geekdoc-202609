  md: 'Point out that the software accessible in the dock, or on the desktop, isn’t
    everything on the device. Show your learners how to find the programs/apps on
    their devices. If you’re teaching your child one-on-one, you could sit next to
    them and point out how they find the software/apps loaded on their device. If
    you’re on a Mac, one method you can use is to select Finder–Applications. On a
    PC, you’ll likely go to Start–Settings–Apps. On an iPad, you’ll go to the home
    screen and swipe until you get to the App Library. If you’re instructing a class,
    it’s useful to display the device on a big screen (you may need a document camera
    to do this), so that your learners can see what you’re doing.


    Ask: “What do you think all of these apps do? Is there a way to tell?” Point out
    that the programs/apps have pictures, called icons or thumbnails, and that on
    most devices when you “mouse over” (bring your cursor on top of, but don’t click—this
    is sometimes also called “mouse hover”) the programs/apps, writing usually appears.
    This written description gives you a little more information about what that program/app
    does.


    Point out an intuitive example, the musical note for a music app is a good one.
    But what if you still can’t tell what the program does after mousing over the
    icon? In order to learn more about programs/apps, that your grown-ups have told
    you are okay to use, you may need to open them.


    Teaching kids how to independently explore their devices and use the correct terminology
    gives them confidence. This leads to mastery which in turn piques their interest
    in learning more. Teach kids to use computers for creating. Give them some choices
    of which apps/programs to use. Provide them with a few examples of what they could
    create using these apps/programs, to help them succeed.


    # Safety First


    It’s also important to teach your learners to explore safely. Talk with them about
    what to do if they encounter anything that’s scary or makes them feel worried.
    Common Sense Education (www.commonsense.org/education) has great, free resources
    that can be used to facilitate productive, age-appropriate discussions about this.
    The most important takeaways are that your learners should never tell strangers
    online information about themselves (name, address, phone number, school they
    attend), and they should immediately get a trusted adult if they encounter anything
    that makes them feel uncomfortable, scared, or worried.


    I’ll often ask my students, “Would you walk up to a stranger in a park and tell
    them your name, address and phone number?” They know not to do this, so I’ll continue
    by asking, “What about someone who messages you online?” Often, I’ll need to clarify
    that it’s okay for your grown-ups to give your address to a friend for a play
    date, but that it’s super important to remember that it’s your grown-up who’s
    giving this address to someone. Kids should never give this information out without
    asking their grown-ups first.


    # Selecting Programs and Apps


    Now that your learners have some idea of the programs/apps on their devices, and
    basic guidance about online safety, it’s time to teach them how to select a program/app
    based upon the task they’re trying to accomplish. Start by giving them a tour
    of their device and pointing out which app/program they would use for which task.
    “If I want to create a digital drawing, which of these apps would I choose? What
    if I want to write a story? How about if I want to learn to code? What if I just
    want to know what the weather is like outside today?”'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Make sure to point out that different programs/apps can be used to accomplish
    similar tasks. Ask: “Why might someone choose one over another?” Point out that
    some programs/apps are web-based and therefore need the Internet to work. So,
    what do you do if you don’t have access to the Internet or if your Internet tends
    to be spotty? That would be a good reason to use the program/app that isn’t web-based.
    Maybe you just like one of them better; if they do basically the same task, would
    that be an okay reason to choose one app over another? Absolutely!


    # Software Extension: Explaining Operating Systems


    When determining if software is compatible with (works with) your device, the
    first consideration is which operating system your device is running. The operating
    system’s job is to manage all of the software and hardware running on your device.
    The three most commonly used operating systems are Microsoft Windows (most PCs),
    MacOS (Apple products), and Linux (open source). Use the Operating Systems coloring
    page on the next page to introduce operating systems to your learners.'
