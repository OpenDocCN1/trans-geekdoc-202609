  md: "# Chapter 3\n\n# Data and Analysis\n\n# Introduction\n\nTeach your learners\
    \ to enjoy **data** analysis by incorporating fun activities such as Robot Dance\
    \ Parties and graphing (and perhaps eating) M&M’s (or your preferred treat). Use\
    \ the lessons in this chapter to teach the difference between digital and physical\
    \ (or live data), advantages and uses for each, how to make predictions, and the\
    \ Scientific Method.\n\n# Data and Analysis—Storage—Abstraction\n\n> CSTA K-2\
    \ Standard 1A-DA-05: Store, copy, search, retrieve, modify, and delete information\
    \ using a computing device and define the information stored as data.\n> \n> “All\
    \ information stored and processed by a computing device is referred to as data.\
    \ Data can be images, text documents, audio files, software programs or apps,\
    \ video files, etc. As students use software to complete tasks on a computing\
    \ device, they will be manipulating data.”\n\nWhen kids are first learning about\
    \ data, they will need to be explicitly taught what to call different types of\
    \ data, how to differentiate between types of data, and how to save and retrieve\
    \ files. When starting these topics with your youngest learners, it’s useful to\
    \ connect the digital world to tangible, physical objects that they can touch\
    \ and manipulate, whenever possible.\n\nFor example, consider having a printed\
    \ and digital copy of the same photo, a digital and printed written document,\
    \ and a microphone that you can speak into live and then record your voice digitally\
    \ to play back. When comparing and contrasting these, it’s also useful to explain\
    \ when it’s helpful to have a digital vs. a physical (or live) representation\
    \ of the data (and vice versa).\n\n# Activity: Compare and Contrast Digital Data\
    \ vs. Physical/Live Data\n\nPrepare your data and tangible objects in advance:\n\
    \n+   - Digital and physical copies of the same photograph.\n+   - A microphone\
    \ (this can be the one built into your device) and some sort of recording software,\
    \ ready to record your voice—Voice Memo, Voice Recorder, or web-based Vocaroo\
    \ (https://vocaroo.com) would all work well.\n+   - A physical and digital copy\
    \ of a document. This could just be a list of the names of your learners, a written\
    \ sentence or paragraph (in Microsoft Word, Google Docs. or whatever works best\
    \ for you) with printed copies."
