- pgno: 81
  md: 'Common Sense Education has great, free, age-appropriate resources that can
    be used to teach digital citizenship and Internet safety skills. These include
    lesson plans, videos, and more. Start with these, but don’t stop there. Once your
    learners have been introduced to the basic concepts and terminology, continue
    to address these skills as they directly apply to each lesson, using that touchstone
    of acting kind and gentle in all ways.


    # # Online Safety


    At each level, learners should be taught to avoid sharing the following with strangers:
    their full names, personal emails, physical addresses, phone numbers, the school
    they attend, and the city they live in. Many schools have a Safety Patrol program,
    where older kids help younger kids with navigating crosswalks, getting to buses,
    and generally staying safe. In addition to regular instruction from teachers and
    parents, it would also be useful to develop an Online Safety Patrol where older
    kids help to mentor younger kids about what information they need to keep safe
    and remind them how to be kind online, too.


    # # Digital Citizenship and Cyberbullying


    As online interactions, collaborations (including Internet-based gaming), and,
    later, social media use intensifies, continuing to reinforce to kids how to spot
    when someone is being unsafe or unkind online, and what to do about it, becomes
    increasingly important.


    As anyone who has ever read online comments knows, people become more emboldened
    when interacting digitally. Anonymity and the perceived distance provided by digital
    communication make some people downright cruel. Cyberbullying is rampant online
    and my learners, as early as second grade, have reported witnessing it or even
    experiencing it directly, making it an important skill to cover (age-appropriately)
    with all kids.


    Start by asking your learners to define cyberbullying. Young learners sometimes
    have trouble differentiating between cyberbullying and being rude, so you’ll need
    to give them examples of each. Using all caps to shout at someone, although rude,
    isn’t cyberbullying, but a group of people calling someone names and saying bad
    things about them online is. Another clear case of cyberbullying is when someone
    uses a photo or video of someone else to publicly shame or embarrass them.


    For young learners, you could give an example: “What if you tripped and fell,
    and you felt embarrassed about it? That would feel bad, right? What if someone
    took a video of you tripping and falling and shared it with other people who continued
    to spread it? That would be much worse. That’s cyberbullying.”


    Teach your learners to be upstanders instead of bystanders. A bystander is someone
    who witnesses a bullying behavior, either in person or online, and doesn’t participate
    (but also doesn’t do anything about it). An upstander, by contrast, is someone
    who does something to support the person being bullied. They take action and stand
    up for the person who’s being bullied by confronting the bully or offering support
    in some other way. This could be something simple like checking in with the victim,
    listening to how the incident made them feel, and letting them know that you thought
    it was wrong and that you’re on their side.'
