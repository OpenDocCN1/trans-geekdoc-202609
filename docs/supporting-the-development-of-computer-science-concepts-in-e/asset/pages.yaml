  md: '# Glossary, Resources and Index


    # Glossary


    This glossary includes terms in bold found throughout the text as well as other
    terms you may encounter when exploring computer science with your learners.


    **Abstraction** is separating out details that aren’t needed from those that are
    for your task at hand. Abstraction is useful for making complex ideas and concepts
    easier. It’s zooming out and looking at the big picture instead of getting distracted
    by every detail. In computer science, abstraction makes it easier to understand
    code by focusing on core features instead of small details.


    **Algorithm** is a set of steps done in a certain order used to complete a task
    or solve a problem. A recipe is an example of an algorithm.


    **Arrays** are data structures that allow you to store a related (same data type)
    collection of data such as lists of numbers or names.


    **Artificial intelligence (AI)** is when computer systems are capable of learning
    and problem solving. It is an emerging field of computer science. AI allows computers
    to perform tasks that previously only humans were capable of.


    **Attribution** is giving credit to the author or artist of a work.


    **Augmented reality** is when you enhance the real-world environment with virtual
    elements. Pokémon GO is an example of augmented reality, because the Pokémon GO
    characters are superimposed on your view of the real world, through your camera.


    **Binary** is the “language” of computers. It is made up of 1’s (signal on) and
    0’s (signal off). Computer chips are made up of transistors that act like tiny
    switches. If an electrical current is flowing through the transistor, it is a
    signal on, or 1. If no electrical current is flowing through the transistor, it
    is a signal off, or 0. Binary is also called “machine code”. The central processing
    unit (CPU) of a computer can only understand information written in binary/machine
    code.


    **BIPOC** stands for Black, Indigenous, and People of Color.


    **Blockly** is a block-based visual programming language similar to Scratch.


    **Boolean expressions** have two options “true” or “false”. This could also be
    “yes” or “no” or “1” and “0”. For example, if you’re taking a quiz and you get
    the right answer, that would be a “true” or “yes” or “1”; if you get the wrong
    answer, it’s “false” or “no” or “0”.


    **Brute-force attack** is when a hacker attempts to gain access to your account
    by trying every possible password combination. If your password is short (e.g.,
    a four-digit number) or a word found in a dictionary, it’s more vulnerable to
    brute-force attacks.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '**Bystander** is a term that in digital citizenship refers to someone who witnesses
    someone being mean online, and although they don''t participate in the unkind
    behavior, they also don''t do anything to help.


    **Ciphers** are a way of rearranging letters (or uses other substitutions) to
    disguise a message.


    **The Cloud** refers to everything (e.g., objects, devices) that connects through
    the Internet. The cloud is the biggest network in the world. Using the cloud to
    connect your devices through the Internet is referred to as cloud computing.


    **Code** refers to symbols, letters, words, and numbers that represent something
    else. Some examples include a secret code, Morse code, or computer code.


    **Coding** is writing a set of instructions that a computer can understand. This
    is often used synonymously with programming, but programming includes design,
    testing, maintenance, and more.


    **The command line** is a way to type instructions directly into the computer
    (instead of using your mouse to click and select from a drop-down menu). This
    text-interface often allows you to work more quickly and gives you more control
    over your computer.


    **Computational thinking** is a set of skills for solving problems that includes
    decomposition, abstraction, pattern recognition, debugging, iteration and algorithmic
    design.


    **Computer science** is the study of computational systems and includes computer
    networks, artificial intelligence, application development, video game development,
    and more.


    **Conditions** (sometimes called selections) are decision-making instructions
    given as part of the computer program. They''re essentially a coding flowchart
    that gives If-then instructions. For example, if it''s raining (this is TRUE),
    then we''ll have indoor recess; if it''s raining (this is a FALSE–it''s *not*
    raining), then we will play outside.


    **A corrupted file** is a file that''s been damaged or is not performing as it
    should.


    **CSS (Cascading Style Sheets)** (see HTML).


    **Cyberbullying** is when someone (or a group of people) uses a digital tool (social
    media, the comments section on an online site, a gaming site) to bully someone
    else.


    **Cybersecurity** is the field dedicated to keeping computers and systems safe.
    Cybersecurity professionals are sometimes referred to as “white hat hackers” or
    “ethical hackers”.


    **Data** refers to all information stored and processed by a computer. This includes
    computer instructions, numbers (prices, quantities, measurements), text (names,
    addresses), images (photos, painting, drawings), audio (voice, music), and video
    (movies, animations).


    **Databases** are used to effectively store and search for large amounts of data.
    An example of a database is the U.S. Library of Congress digital collections database,
    where you can locate primary source documents for historical events.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '**Data structures** are the ways in which data are stored for easy access.
    These include arrays, trees, and databases.


    **Debugging** is finding and fixing mistakes or problems in computer programs.


    **Decomposition** is breaking something down into smaller pieces, steps, or tasks.
    This is a useful skill for finding solutions and problem solving. Breaking code
    into smaller chunks can make the code easier to understand.


    **Deep learning** (see AI).


    **Digital citizenship** is being safe, responsible, kind, and respectful online.


    **Emergent readers** refers to kids who are learning to read. This could be our
    youngest learners who are learning to recognize the letters of the alphabet and
    the sounds the letters make or kids who can recognize some words but aren’t yet
    independent readers.


    **File extensions** are the letters at the end of a file name, following the period.
    These tell you what kind of file you’re working with.


    **Functions** are a way to chunk blocks of code. This makes it easy to reuse common
    code blocks. Grouping code together in this way also allows programmers to read,
    write, and debug code more quickly and easily. Some programming languages have
    built-in functions, which are called methods.


    **Hackers** aren’t always up to no good. There are three categories of hacking:
    white hat, gray hat, and black hat. **White hat hacking** is what cybersecurity
    experts do. They work to find and fix vulnerabilities and try to prevent other
    hackers from getting in. **Gray hat hacking** is when someone hacks into systems
    (without permission) in order to raise awareness and expose vulnerabilities (this
    is also called hacktivism). **Black hat hacking** is when someone hacks into a
    system (without permission) with the intent to do damage and/or steal information.


    **HTML (HyperText Markup Language) and CSS (Cascading Style Sheets)** are the
    basic building blocks of web design. HTML is used to structure the content of
    web pages, CSS is used to format the content, that will then cascade through the
    whole page (as opposed to having to make changes on each line of code). For example,
    if all the title headings on your page are green and you want to change them to
    purple, you can use CSS to do that—quickly!


    **Icon/thumbnail** is the tiny, clickable picture (which sometimes also includes
    text), that provides an idea for what the program or file is.


    **Internet of Things (IOT)** are devices that can be controlled through the Internet.
    This includes computers, phones, appliances, lights, and more.


    **Iteration** is part of the engineering design process whereby you continue to
    improve your design to fix problems and make improvements. This applies to improving
    or fixing your code.


    **JavaScript** is a web programming language for creating dynamic/interactive
    website content.'
