    You: "Now our program is working!" (pump your fist in the air) Kids: "Now our
    program is working!" (kids repeat gesture) You: "Now our program is working!"
    (pump your fist in the air) Kids: "Now our program is working!" (kids repeat gesture)


    You: "Because we debugged" (brush off each shoulder as you say this) Kids: "Because
    we debugged" (kids brush off each shoulder) You: "Because we debugged" (brush
    off each shoulder as you say this) Kids: "Because we debugged" (kids brush off
    each shoulder)


    # Script to Teach About Debugging


    Once your learners are familiar with the vocabulary from this song, give them
    a little more context for what debugging means by explaining the origin of the
    term. Admiral Grace Hopper made the term “debugging” famous when she was working
    with a team trying to figure out why their computer was delivering errors. When
    they opened up the hardware, they found a moth stuck inside. The moth was causing
    errors! Once they removed the moth and literally “debugged” their computer, they
    were able to fix the problem (National Geographic, 2020).


    Ask your learners: “Every time you have a problem with your computer, is it because
    there’s a moth inside of it? What do you think?” Tell them respond with a thumbs
    up for yes, thumbs down for no, thumbs to the side if they aren’t sure. “No, that’s
    just what we call it now; we call computer problems bugs in honor of that moth.
    Debugging means that we are finding and fixing the problem.”'
