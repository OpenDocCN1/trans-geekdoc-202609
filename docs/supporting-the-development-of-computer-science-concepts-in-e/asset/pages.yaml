- pgno: 36
  md: '# # Cybersecurity Extension: Using Games


    Once your learners understand the basics, you’ll want to progress with more information
    about **cybersecurity** and Internet safety. Research shows that using games and
    songs and reinforcing content in different ways (showing, telling, and adding
    movement) helps kids to remember more of what they learn. Even with more serious
    topics, do your best to engage with the material in fun ways whenever possible.
    Consider the Click Click Malware! Game.


    # # Click Click Malware!


    Use the traditional children’s game Duck Duck Goose to reinforce that clicking
    on an unknown website can cause your computer to get infected with malware. Just
    as in the traditional game, have your learners sit in a circle with their bodies
    facing in toward each other.


    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_36_0.png)


    The designated “mouse” (who could wear mouse ears) will tap each kid gently on
    the head. In this way, they will “click” (tap) each “website” (kid’s head). Instead
    of saying “duck” or “goose” with each tap (as in the traditional game), the mouse
    will say “click” or “malware”.


    When the mouse taps a kid’s head and says “malware”, that kid will jump up and
    try to tag/infect the mouse (computer), and the mouse will try to run around the
    circle of kids and sit in the malware’s spot...before getting tagged. If the mouse
    makes it back to the spot without getting tagged, they’re “safe” (they could yell
    out “virus quarantined” or “anti-virus software worked”) and the malware gets
    to switch roles and act as the mouse. If the original mouse does *not* make it
    to the open/safe spot before getting tagged, they have to start over as the mouse
    and try again. With older learners, instead of just “malware”, they could name
    specific types of **malware**: **virus**, **worm**, **spyware**, **ransomware**,
    etc.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Cybersecurity Extension: Introducing Vocabulary


    In order for kids to understand more about any subject, they need to understand
    the terminology used. This is part of the intent of the companion picture books
    Little Computer Scientists and Little Hackers. As your learners progress, explain
    the following.


    When your computer has malware (virus, spyware, worm), you may be able to fix
    the issue by **rebooting** your computer using **safe-mode**. This means that
    you would restart the computer in such a way that you’re only running the most
    basic programs your computer needs to run. This way of restarting your device
    helps you to identify and fix potential problems (which includes but isn’t limited
    to malware). In order to figure out how to reboot using safe-mode on your device,
    Google “reboot”, “safe-mode”, and your specific type of device (e.g., “Macbook
    Air”).


    A **quarantined virus** is a virus that has been confined to a safe area where
    it can’t infect the rest of your device. You do this using anti-virus software.
    A **Trojan Horse**, named after the ancient Greek story about the fall of the
    City of Troy, is when malware is disguised as a legitimate program. Once downloaded,
    the malware causes harm. This is another type of virus that can be quarantined
    using anti-virus software. Some examples of currently recommended (as of the writing
    of this book) anti-virus software are Avira, McAfee, Bitdefender, Malwarebytes,
    and Norton Antivirus.


    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_37_0.png)


    Speaking of hacking, **hackers** aren’t always up to no good. There are three
    categories of hacking: white hat, gray hat, and black hat. **White hat hacking**
    is what cybersecurity experts do. They work to find and fix vulnerabilities and
    try to prevent other hackers from getting in. This is also referred to as “ethical
    hacking”. Launching a fake cyberattack to find vulnerabilities is called **penetration
    testing** or “pen testing” for short. **Gray hat hacking** is when someone hacks
    into systems (without permission), in order to raise awareness and expose vulnerabilities
    (this is also called hacktivism). **Black hat hacking** is when someone hacks
    into a system (without permission) with the intent to do damage and/or steal information.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Extension—Networking—Some Basics


    In Little Computer Scientists, the friends set up a LAN (local area network),
    so that they can all build together in Minecraft. A common use for a LAN is the
    devices linked through Wi-Fi in your house. Another example is in school: computers
    and printers are part of the network so that files can be shared easily, and everyone
    can access the printers. Networked devices can be super convenient and fun. However,
    as with many things that are fun, they can also pose a security risk. For example,
    if someone accesses the network where your devices are all linked together, they
    now could potentially hack into all these linked devices. This is why we use firewalls
    and sometimes secure routers and switches to make hacking less likely (and why
    you need to be extra careful when using public, password-free Wi-Fi).


    The Internet itself is also considered a network. This network is often called
    “the cloud”. Use The Cloud Coloring Page to show your learners the kinds of devices
    that could be connected to the cloud.'
  merge: -1
  img_proc: true
