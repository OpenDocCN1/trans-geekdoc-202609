- pgno: 45
  md: 'Conclude this lesson by repeating your initial statement: “I’m super excited
    to teach you about computer science today! I’m so glad you’re all here. I’ve said
    this out loud to you, and now I’ve recorded it too, because I really want you
    to hear that message, how glad I am that you’re here with me today! In this lesson
    we learned about data. What’s the difference between when I spoke that sentence
    to you *without* recording it versus when I recorded it?” Give your learners a
    chance to respond, then continue: “What are some things that I can do with the
    audio recording that I can’t do when I just speak out loud (without recording
    it)?”


    Point out that when you say the sentence live, your learners can see your body
    language and facial expressions. This makes it easier for them to see how glad
    you are to teach them. However, the audio recording of that message can be saved
    and shared, which can be very useful, too—especially for sharing the recording
    with someone who isn’t here today.


    Have your learners come up with their own examples for why voice recordings are
    useful. If you’re working one-on-one, your learner could just tell you about their
    ideas directly. If you’re working with a big group, this is a good opportunity
    to “pair and share” by having your learners pair up with one or two other kids
    next to them, and take turns sharing their ideas with each other. To conclude
    this lesson, call on a few learners to share with the group. If you want to reinforce
    the mechanics of the lesson, you could even have them record their favorite thoughts
    and save and share those.


    # Script for Comparing Digital Document Data vs. Physical Document Data


    Create an invitation. Print a copy and have a digital copy displayed in a place
    that your learners can easily see. Feel free to use the example below. You can
    access a copy of the sample invitation on my website (authorjuliedarling.com).


    Greet your learners and tell them that you’re super excited to invite them to
    a robot dance party (or whatever your invitation says). Tell them that you’ve
    created this invitation so that they can remember the details, the time and place,
    so that they don’t miss it. Explain that this invitation is a type of data called
    a document.'
  merge: -1
  img_proc: true
