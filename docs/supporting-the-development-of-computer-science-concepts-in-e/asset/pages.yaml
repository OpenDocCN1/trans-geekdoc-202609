  md: "storage issue with older technology. You would have to store all of your cassettes,\
    \ CDs, and/or records somewhere in your home.”\n\nIf you have a worn-out cassette\
    \ tape, you could use this to talk about how physical ways to store music can\
    \ break or wear out (this is another chance to revisit storing data—in this case,\
    \ music in the cloud). You could even show your learners what happens if the tape\
    \ from a cassette is pulled out, how you can use a pencil to try winding it back\
    \ into the cassette tape case, and that this doesn’t always fix it. Point out\
    \ that the advantage to physical means of storing music is that you own the CD\
    \ or record forever, as long as you have space to store it and it doesn’t get\
    \ damaged. Contrast this with having to pay for a streaming service every month\
    \ for continued access to the music you want to listen to.\n\n# Impacts of Computing—Social\
    \ Interactions—Collaboration\n\n> CSTA K-2 Standard 1A-IC-17: Work respectfully\
    \ and responsibly with others online.\n> \n> “Online communication facilitates\
    \ positive interactions, such as sharing ideas with many people, but the public\
    \ and anonymous nature of online communication also allows intimidating and inappropriate\
    \ behavior in the form of cyberbullying. Students could share their work on blogs\
    \ or in other collaborative spaces online, taking care to avoid sharing information\
    \ that is inappropriate or that could personally identify them to others. Students\
    \ could provide feedback to others on their work in a kind and respectful manner\
    \ and could tell an adult if others are sharing things they should not share or\
    \ are treating others in an unkind or disrespectful manner on online collaborative\
    \ spaces.”\n\n**Digital citizenship** is important to teach concurrently with\
    \ computer science skills and includes being safe, responsible, kind, and respectful\
    \ online. Use the same terminology that you use with your learners when teaching\
    \ these skills face to face. In my classroom, I’ve simplified this to two basic\
    \ rules. In all things we strive to be kind and gentle.\n\nAny action that isn’t\
    \ kind or gentle will garner redirection or, possibly, an alternative way of accessing\
    \ the content. For example, if someone can’t be gentle with the computer (or when\
    \ an older learner is playing an online game instead of working on the given assignment),\
    \ they’ll be given an “unplugged” alternative version of the activity.\n\nOnce\
    \ I see that they’ve mastered the expectation of being kind and gentle, by telling\
    \ me and showing me what that means, they get the chance to choose between the\
    \ online and “unplugged” activity. Learners (with my help) continue to work at\
    \ consistently meeting the expectation of treating ourselves, each other, and\
    \ the equipment with kind and gentle words and actions.\n\nYou can follow those\
    \ general guidelines too, but I’d recommend also using Common Sense Education\
    \ (www.commonsense.org/education)."
