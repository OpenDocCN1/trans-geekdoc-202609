- pgno: 56
  md: '# Algorithms and Programming


    # Introduction


    Chapter 4 digs deeply into **algorithms** and **programming**, topics at the backbone
    of computer science. Use this chapter to teach your learners about **decomposition**,
    **iteration**, **algorithms**, **sequences**, **variables**, **debugging**, **loops**,
    **attribution**, **binary**, and **ciphers**. Set your learners up for success
    by starting early with sorting, keyboarding, and pair programming. Sing *The Debugging
    Song* together and don’t forget to write your names in “secret code” using binary!


    # Programming—Scaffolding and Other Considerations


    # Sorting


    With your youngest learners, use sorting activities to reinforce pattern recognition,
    a crucial skill needed for programming and **debugging**. When teaching your young
    learners to put materials away, sort supplies into boxes and bins in different
    ways, with words and photographs on the front to indicate which way items should
    be sorted, and to support emergent reading. Switch this up periodically to help
    them learn different patterns/ways of sorting.


    For example, store blocks, art supplies, and other materials by numbers, blocks
    with numbers, number of sides, or whatever you think would work best with your
    materials, letters, shapes, and colors. This could be done with found objects
    (pine cones and leaves), as well as playroom or classroom materials. Consider
    structuring your learning environment this way. You can find endless suggestions
    and toys by Googling “Montessori sorting”.


    Give your learners a sense of ownership by asking *them* how objects or supplies
    should be sorted to make them easy to find, or easy to use, for certain activities.
    For example, ask your learners: “If I want to draw a picture of my house, how
    can I organize the drawing supplies so I can find the colors I want to use, quickly?”
    Making tasks quicker and easier is one of the main reasons computers are so powerful
    and useful. **Scaffolding** this idea with everyday tasks helps young learners
    start thinking this way.


    # Pair Programming


    When teaching kids about programming, have them pair up to work on tasks. This
    method of learning when applied to programming is called **pair programming**.
    Here’s how it works. Two kids will work together, frequently switching roles.
    One kid will start by writing the code—they’re called the “driver”. The other
    kid—the “navigator”—will check the code and give input. With younger kids, you’ll
    want to set a timer at five-minute intervals to remind them to switch roles. As
    your learners get older, they’ll get better at switching roles independently.
    When first starting pair programming, you’ll need to monitor your learners to
    make sure they’re both actively participating'
  merge: -1
  img_proc: true
- pgno: 57
  md: "and switching roles at the designated intervals. You may also need to tell\
    \ your learners who should start in which role.\n\n# **Keyboarding Skills**\n\n\
    Younger learners should start learning the concepts behind coding using block-based\
    \ coding. The ScratchJr app is great for ages 5–7, at which point they should\
    \ progress to Scratch, which was developed for ages 8–16. Once your learners have\
    \ become Scratch masters, it’s time to add text-based coding.\n\nOlder learners\
    \ will need to understand how to type symbols on a keyboard in order to be successful\
    \ with text-based coding languages. Since most students start reading more fluently\
    \ at the end of first grade, this is a good skill to teach to second graders.\
    \ In addition, in order for kids to be successful with text-based coding, they\
    \ need to master basic typing/keyboarding skills.\n\nAdvanced typing skills such\
    \ as how to type symbols (e.g., parenthesis ( ), greater-than > and less-than\
    \ < signs, backslash \\\\ ) and capital letters should be covered before text-based\
    \ programming is attempted. Typing Club (typingclub.com) is a great, free resource\
    \ to use to learn typing skills. As the adult (parent/guardian or teacher) guiding\
    \ your students, you’ll need to remind them to keep their fingers on the home\
    \ row, so that later on they’ll be able to type quickly and efficiently, without\
    \ looking at their hands.\n\nIt’s generally recommended to start learning text-based\
    \ coding by starting with HTML/CSS or Python. See the Resources section of this\
    \ book for recommended books and sites to use to learn these. You can also find\
    \ links to these resources on my website (authorjuliedarling.com). In Little Computer\
    \ Scientists, the characters “use Python in the command line”. The command line\
    \ is a way to type instructions directly into the computer instead of using your\
    \ mouse to click and select from a drop-down menu. This text-interface often allows\
    \ you to work more quickly and gives you more control over your computer. On a\
    \ PC, it’s accessed by locating “command prompt”; on a Mac, it’s accessed by locating\
    \ “terminal”. Be careful with this! Because the command line gives you more control,\
    \ if you make mistakes, you can really mess things up (e.g., permanently deleting\
    \ important data or messing up formatting).\n\n# **Algorithms and Programming—Algorithms—Abstraction**\n\
    \n> CSTA K-2 Standard 1A-AP-08: Model daily processes by creating and following\
    \ algorithms (sets of step-by-step instructions) to complete tasks.\n> \n> “Composition\
    \ is the combination of smaller tasks into more complex tasks. Students could\
    \ create and follow algorithms for making simple foods, brushing their teeth,\
    \ getting ready for school, participating in clean-up time.”\n\nAn algorithm,\
    \ to put it simply, is a series of steps completed in a certain order. A great\
    \ way to teach about algorithms is to teach your learners a favorite recipe. For\
    \ younger learners, this could be a recipe that just requires assembly, such as\
    \ trail mix. Having visual and written instructions, together, reinforces letter\
    \ and word recognition for emergent readers, too."
