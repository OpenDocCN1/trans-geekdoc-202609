- pgno: 44
  md: 'If you’re working with older learners, you may want to stop here and give them
    the opportunity to try recording their own voices. You’ll want to make sure they
    can get to Vocaroo easily on their devices. Have “Vocaroo” written on the board
    or share the link through a **learning management system** (LMS).


    Lastly, you’ll want to make sure to explain to your learners how to save and share
    their voice recordings/audio data. Direct them to the green rectangular box icon
    that says “Save & Share” on the bottom of the screen and tell them to click on
    that once they’ve got a recording that they like.


    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_44_0.png)


    Figure 3.3 Image of the save & share screen on the Vocaroo website.


    This will give them several options including copying the link to the recording
    (so that they can paste it into your LMS to turn in), emailing it, downloading
    it as an .MP3 file, creating and saving a **QR code** to access it, and more.
    Direct your learners to the option that works best for them.


    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_44_1.png)


    Figure 3.4 Image of the additional sharing options on the Vocaroo website.'
