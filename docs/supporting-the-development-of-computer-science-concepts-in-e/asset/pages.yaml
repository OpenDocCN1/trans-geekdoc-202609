  md: '# Setting Your Learners Up for Success


    Say: "Is it okay to make mistakes sometimes?" (Wait for your learners to answer
    in the affirmative). Ask: "Do you think I ever make any mistakes?" You could share
    a personal story about a (perhaps humorous) mistake you made and how you fixed
    it. Next ask: "What can we do if we make a mistake, or if we don’t understand
    something right away?" Guide your learners in responses such as: we try again,
    we see what we can do to fix it, we get better with practice, we ask for help
    from a friend, parent, or teacher, etc.


    # Growth Mindset


    Pointing out that it’s okay to make mistakes, and that we get better with practice
    is part of modeling a “growth mindset” (Dweck, 2007). Developing a “growth mindset”
    (as opposed to a “fixed mindset”) is a critical part of any type of learning and
    should be continuously encouraged:


    > This growth mindset is based on the belief that your basic qualities are things
    you can cultivate through your efforts, your strategies, and help from others.
    Although people may differ in every which way—in their initial talents and aptitudes,
    interests, or temperaments—everyone can change and grow through application and
    experience.


    (Dweck, 2007)


    In my classroom, I publicly point out when I make mistakes and model how to fix
    them. For example, when I click on the wrong link or button, I’ll invite my learners
    to help me problem-solve. I’ll say something like “Oops I clicked on the wrong
    link! What can I do to fix it?” I’ll often share examples of when I wasn’t great
    at something but got better with practice. For example, “Did you know that when
    I first started learning how to type, I only used my pointer fingers and I was
    SUPER slow? How do you think I got faster at typing?”


    # Teach Kids How to Use the Mouse and Touchpad


    Ask: “Does anyone know how you open up this program? How do we make it start?”
    You’ll need to demonstrate that they click on the icon. This may be a single or
    double click depending upon the device. Little kids will need practice with this.
    Have them practice with you by pretending to click with their pointer finger on
    a table. Pointer fingers lifted, tell your learners to “single click, click one
    time”, then “double click, click two times quickly”. Make it into a game where
    you have them tap their fingers once or twice each time you call either one out.
    Mix up the order in which you declare single or double clicks. Have your learners
    take turns calling out “single/ double click” and having the other kids respond
    by “clicking” with their fingers on the table.


    Once they feel confident with this, introduce right clicking. Young learners may
    still be figuring out how to tell their right from their left, so start by explaining
    the difference between their pointer finger and their ring finger. Say: “Your
    pointer finger is the left click, your middle finger is the right click.” Add
    “right click” to your clicking practice game. If anyone is still struggling with
    which finger to use, you could have them trace their hand onto a piece of paper
    and label their pointer finger “left click” and their middle finger “right click”
    (or just “L” and “R”).


    Once your learners have mastered all of this, they could try it on an unplugged/disconnected
    mouse, and then finally with a connected mouse to open the program of their choice
    (hooray!) If your learners are using devices that have track/touch pads, they
    may need to practice right-clicking using both their middle and ring fingers'
