- pgno: 49
  md: '# When to Teach This


    This activity requires a basic understanding of counting, writing, or typing numbers
    (1–10) and identifying and writing or typing the names of colors. This would likely
    work well starting at the mid-point or end of Kindergarten (around age 5½). Older
    learners also find this engaging and could create more sophisticated graphs with
    their data using Excel or Google Sheets.


    # To Scaffold in Advance


    If you''re working with younger learners, scaffold this part by providing a word
    bank with the names of the colors found in the “fun size” candy of your choice,
    written somewhere easily viewable, or feel free to copy the Use “Fun Size” M&M’s
    to Create a Bar Graph handout. Consider writing the names of the colors using
    those colors. For example, write “green” in green, “red” in red, etc. to assist
    with word recognition.


    It''s also useful to have a number line either at the desk/work station(s) or
    posted on the wall that your learners can consult as they count their candies.


    Note that food activities can sometimes be problematic. Before buying the candy,
    make sure you''re not going to run into allergen issues. If food allergies or
    other dietary restrictions are a problem, consider doing this activity with colorful
    beads or something similar.


    # Gather Your Materials


    For this activity you''ll need:


    +   - One “fun size” bag of candy for each learner.

    +   - One piece of graphing paper, one piece of plain paper (or two pieces of
    plain paper if you don’t have graphing paper) or the Use “Fun Size” M&M’s to Create
    a Bar Graph handout.

    +   - A pencil for each learner and drawing tools (crayons, colored pencils, or
    markers) in colors corresponding to the candy colors (blue, brown, green, orange,
    red, yellow).

    +   - A word bank of the candy colors (for younger learners) written in the corresponding
    colors.

    +   - A number line (for younger learners, optional).

    +   - A ruler if your learners will be creating graphs on plain paper (optional).

    +   - Devices with software for graphing your digital data (for older learners).


    # Script for Teaching


