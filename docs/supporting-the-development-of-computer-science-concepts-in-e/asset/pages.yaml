  md: "together with a two-finger press. Make sure to **scaffold** this. Reinforce\
    \ that on computers we call the pictures an “icon” or “**thumbnail**”. Have your\
    \ learners repeat that back to you: “What do we call this [point]? What else could\
    \ we call it?”\n\n# # Cursors Can Be a Surprise at First\n\nYoung learners often\
    \ initially have trouble figuring out how to make the cursor move the way they\
    \ want it to. Many devices for young learners have touch screens (which I would\
    \ highly recommend starting with). When they first encounter a mouse, they may\
    \ try to pick it up off the table to get the cursor to go to the top of the screen,\
    \ and usually won’t know what to do with the mouse to keep moving the cursor once\
    \ they’ve reached the edge of their table. They won’t know to pick the mouse up\
    \ in the air, move it, and then set it back down again. If your learners are working\
    \ on a touchpad, they will need to learn to pick up their fingers instead of the\
    \ mouse.\n\nYou’ll need to model this for them and have them practice, again with\
    \ an unplugged mouse at first. This can be a game too. Say: “Forward, away from\
    \ you means up!” and have them move their mouse forward while repeating back to\
    \ you “up!”; “Back, toward you means down!” and have them move their mice back\
    \ while saying “down!” Then you could call directions out randomly: “Up! Up! Right!\
    \ Down! Left! Left again! How do you keep going left?” Observe to make sure they’re\
    \ “driving their mice” in the correct direction and spend a little more time on\
    \ anything giving them trouble. Once your learners have mastered these skills,\
    \ it’s time to help them start exploring their devices.\n\nThis should also work\
    \ with learners using a touchpad. You’ll want to exaggerate how you’re picking\
    \ your finger up and placing it back on the touchpad (and point out when you’re\
    \ using two fingers) so they can understand what you’re doing.\n\n# # Computing\
    \ Systems—Devices—Inclusion\n\n> **CSTA K-2 Standard 1A-CS-01:** Select and operate\
    \ appropriate software to perform a variety of tasks, and recognize that users\
    \ have different needs and preferences for the technology they use.\n> \n> “People\
    \ use computing devices to perform a variety of tasks accurately and quickly.\
    \ Students should be able to select the appropriate app/program to use for tasks\
    \ they are required to complete. For example, if students are asked to draw a\
    \ picture, they should be able to open and use a drawing app/program to complete\
    \ this task, or if they are asked to create a presentation, they should be able\
    \ to open and use presentation software. In addition, with teacher guidance, students\
    \ should compare and discuss preferences for software with the same primary functionality.\
    \ Students could compare different web browsers or word processing, presentation,\
    \ or drawing programs.”\n\n# # Script for Exploring Programs and Apps\n\nSay:\
    \ “How do we know what your device can do?” This is going to elicit a variety\
    \ of responses, many of which could be correct. You’ll need to guide this conversation.\
    \ The specific details will vary depending upon what kind of devices your learners\
    \ have access to."
