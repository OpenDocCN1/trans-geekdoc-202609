  md: '# Chapter 5


    # Impacts of Computing


    # Introduction


    This final chapter of our book covers some of the impacts of computing. Chapter
    5 discusses cyberbullying and explains the difference between being an upstander
    and a bystander. Details about how to create an Old Technology Petting Zoo and
    the opportunity to imagine new technology are both included, too. Use this chapter
    to get kidss and, depending on what they come up with, ask them a few guiding
    questions: “Do your grown-ups use their phones to figure out directions to places?
    What about the Internet—do they ever Google the answer to questions? Do they send
    emails to people?” Younger learners may not know, but older learners are likely
    aware that these uses are prolific and helpful. Next, ask your learners what happens
    if devices aren’t working. What if the Wi-Fi goes out, the power is down, or the
    phone dies? What happens to the directions, emails, shows, and games?


    Ask your learners: “Did you know that for most of human existence, none of these
    devices existed? What do you think humans did before phones? How about before
    the Internet? Before television shows and movies? What would you do if these things
    disappeared?”'
