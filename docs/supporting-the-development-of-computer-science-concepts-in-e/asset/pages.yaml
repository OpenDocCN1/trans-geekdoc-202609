  md: '# Introduction: How to Use This Book


    Supporting the Development of Computer Science Concepts in Early Childhood: A
    Practical Guide for Parents and Educators was written with kids ages 4–8 in mind;
    however, many of the activities are also effective with slightly older learners
    (up to age 10). The standards used in this book are the Computer Science Teachers
    Association (CSTA) Computer Science standards for grades K–2 (reproduced with
    permission). Extension activities are based upon the author’s experience with
    teaching technology for more than 20 years. These activities can be utilized by
    kids who’ve already mastered the content and are excited for more.


    If you’re just starting out teaching **computer science** to your child or your
    students, consider using this book linearly. You could also choose to jump around
    based upon need or interest, using the table of contents to find the topic you
    want.


    Consider pairing this guidebook with the companion picture books, *Little Computer
    Scientists* and *Little Hackers*, for read-alouds that introduce computer science
    concepts and vocabulary using fun stories and engaging pictures. You can find
    additional resources on my website: authorjuliedarling.com.'
