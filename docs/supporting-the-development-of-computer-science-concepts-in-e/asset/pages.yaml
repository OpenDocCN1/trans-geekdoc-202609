  md: '# The Silly Password Song


    Keep your password safe. Shh Shh Shhhhh [hold finger to lips]

    Keep your password safe! Shh Shh Shhhhh [hold finger to lips]

    Don''t tell your brother

    Don''t tell each other

    Keep your password safe! Shh Shh Shhhhh [hold finger to lips]


    Make your password long [stretch your arms out]

    Make your password long [stretch your arms out]

    Make your password long [stretch arms] to make it strong [bicep curl]

    Make your password long [stretch your arms out]

    Keep your password safe. Shh Shh Shhhhh [hold finger to lips]


    Change your password a lot [stretch your fingers out and move them like you''re
    typing]

    Change your password a lot [stretch your fingers out and move them like you''re
    typing]

    Change your password a lot, don''t let it get caught! [act like you''re snatching
    something out of the air]

    Change your password a lot [stretch your fingers out and move them like you''re
    typing]

    Keep your password safe. Shh Shh Shhhhh [hold finger to lips]


    # Cybersecurity Extension: More Secure Passwords


    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_33_0.png)


    Figure 2.1 An example of a secure password.


    If you''re working with older kids, teach them that a secure password is a password
    that is long (the longer the better) and contains a combination of letters (capital
    and lower-case), numbers, and symbols. In addition, your password is much more
    secure if unique passwords are used for each account (and unique usernames too,
    when possible). You should avoid using easily guessable information such as birth
    dates, family or pet names, or the word "password".


    Having said that, a secure password also needs to be one you can remember. Current
    best practice recommends 3–4 random words and a symbol. This is much easier to
    recall, making people less likely to write down their passwords in easily discoverable
    places.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'Another good rule of thumb is to substitute out some letters for numbers or
    symbols. If you do this consistently, it''s easy to remember. For example, replacing
    the letter O with a zero (0) or a letter S with a dollar sign ($) will make the
    password more secure. Using this format, I could write “less is more” like this:
    le$$i$m0re.


    An additional recommendation (when possible) is to create unique passwords for
    each login and keep them safe in a password manager such as PassKeep. Password
    managers save your login credentials, making them secure and eliminating the need
    for memorization (although you’ll still need to memorize the one you use to access
    the password manager).


    Not following these tips makes your password more susceptible to a brute-force
    attack. An example of a brute-force attack is when a black hat hacker attempts
    to gain access to your account by trying every possible password combination.
    If your password is short (e.g., a four-digit number) or a word found in a dictionary,
    it''s more vulnerable to brute-force attacks.'
  merge: -1
  img_proc: true
