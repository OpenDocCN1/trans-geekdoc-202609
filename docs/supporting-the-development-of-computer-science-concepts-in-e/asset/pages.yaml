- pgno: 42
  md: 'Or if you want to get fancy, you could make an invitation for something fun
    (a field trip, a party) that you design. Canva (www.canva.com) is one of my favorite
    tools to use for designing invitations.


    These data comparisons can be done all at once, or you could address them one
    at a time over the course of several days—whatever works best for you and your
    learners.


    # # Script for Comparing Digital Photo Data vs. Physical Photo Data


    Hand a physical photo out to your learners and display the same digital version
    of the photo on a device so that it’s visible to all. Ask them to name what they
    notice that’s the same and what they notice that’s different between the digital
    and printed photo. Listen to their responses and clarify any misconceptions. Tell
    them that the photo is a type of data that you can see.


    Differentiate and name the physical and digital copies. Ask them what they think
    the advantages of having each type are: “What can I do with this [point] physical
    photo that I can’t do with this [point] digital photo” (and vice versa). Guide
    the conversation to help your learners think about photo manipulation and reproduction
    with the digital version. Contrast that with how the printed copy will be accessible
    all the time, whereas the digital copy could require batteries/power or maybe
    an Internet connection, depending on how it’s stored/saved.


    # # Script for Comparing Live Audio Data vs. Recorded Audio Data


    Open up your preferred voice recording software, so that’s ready to go. Voice
    Memo, Voice Recorder, or web-based Vocaroo (https://vocaroo.com) would all work
    well. Because Vocaroo is web-based and therefore available on any device with
    an Internet connection, this script will use Vocaroo as the example.


    Say a sentence out loud to your learners without recording it—for example: “I’m
    super excited to teach you about computer science today! I’m so glad you’re all
    here. I’m telling you this out loud because I want you to hear it, live. Is there
    a way I could save this message as recorded data, so you can hear it again later?
    Even if I’m not here?” Give your learners a chance to respond.


    Next, open up your audio recording software. Narrate to your learners what you’re
    doing. For example: “I’m opening up this audio recording software right now. I’m
    going to use it to record my voice. Voice recordings, just like photos, are a
    type of data. The software I’m using to create this audio [point to your ear]
    data is called Vocaroo. Can you repeat that back to me? You can access Vocaroo
    with any device that has an Internet connection. You just type Vocaroo into a
    **search engine** like Google, or type in the **URL**, vocaroo.com. I’m going
    to use it to record my voice in just a moment. See the red microphone icon [point
    to it on the screen]? When I’m ready, I just click on that and start talking.
    Make sure to turn _your_ voices off, so only my voice is getting recorded _this
    time_. Ready? 3-2-1 voices off.”


    “I’m clicking on the red microphone to start my recording...now [click on the
    red microphone icon]...I’m super excited to teach you about computer science today!
    I’m so glad you’re all here [press the red square icon in the center to stop you’re
    recording]. While Vocaroo was recording my voice, it showed me a flashing red
    square within a square. Did you see that? Did you notice that I clicked that big
    red box (within a box), in the center to stop and save my recording? What else
    did you notice on my screen? Let’s start our recording over by clicking on this
    refresh button on the left [click on the red circle with the arrow icon] and look
    again. Notice that doing this will _erase_ the first recording. I’ll show you
    how to _save_ your recording in a moment.”'
  merge: -1
  img_proc: true
