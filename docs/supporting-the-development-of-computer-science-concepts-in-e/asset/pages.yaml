- pgno: 13
  md: '# Chapter 1


    # Computing Systems


    # Introduction


    Introducing kids to computing systems should be done thoughtfully, with tasks
    and activities that make your learners feel empowered and engaged. Consider creating
    “Tech Boss” name tents for your learners, and think about ways to facilitate a
    growth mindset. Set them up for success by explicitly teaching how to use a mouse
    or a touchpad and how to tell the difference between software and hardware. Teach
    your learners to be safe online and help them to feel confident with independent
    exploration and coding. Teach your learners the Input/Output song. Consider some
    of the robots and/or physical computing options to increase the fun, and start
    your learners off right. Teach them to troubleshoot with the help of “Troubleshooting
    Tasha”. You’ll find ideas and templates for all of this and more in Chapter 1.
    Use this chapter as a touchstone from which to help your learners launch a lifelong
    love of computers and technology. Note that although I’ll often refer to learners
    (plural) throughout this text, the majority of the content can be used for one-on-one
    teaching, too.


    # Getting Started


    When teaching little kids how to select appropriate software for tasks, you’ll
    need to start with the basics. Defining software is a good first step. Keep it
    simple. Explain that software tells the computer what to do, just like grown-ups
    tell kids what to do. However, unlike kids, computers have to do what you tell
    them. They don’t get bored, frustrated, or tired—they just follow instructions.


    # Script for Explaining Software


    Explain to your learners that in a classroom, a teacher might tell you to raise
    your hand and wait until you’re called on, before asking your question (have them
    practice raising their hands. “Yes! Just like that.”). A grown-up at home might
    tell you that you need to brush your teeth before you go to bed (have them pretend
    to brush their teeth—“Don''t forget your teeth in the back!”). Sometimes you don’t
    want to raise your hand or brush your teeth, or maybe you just forget. Say: “Have
    you ever forgotten to raise your hand or forgotten to brush your teeth?” Allow
    some time for your learners to respond. “I have too! We’re human and that’s okay.
    We practice and get better at it, right?”


    Explain: “Computers don''t have any feelings about what they’re told. They don''t
    forget and they don''t have to practice. They just follow instructions. With a
    computer, you get to act like you’re the grown-up, and you get to tell it what
    you want it to do. You get to be the boss. Isn''t that fun?! First, though, you
    have to learn how to boss the computer. You need to know what it can and can’t
    do. A computer can only do what it’s programmed to do.” This is a good point at
    which to do a quick check for understanding. Ask your learners: “Does a computer
    know how to do everything?” They will likely yell out “no!” since you already
    gave them this answer. You can also ask for thumbs up for “yes”, thumbs down for
    “no”, or thumbs to the side if they “aren’t sure”.'
