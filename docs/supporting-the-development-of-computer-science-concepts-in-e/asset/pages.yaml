- pgno: 79
  md: '# ## Script to Discuss the Drawbacks of Technology


    Ask your learners: “Now that we’ve discussed how cool computers and technology
    can be, are there any drawbacks? Do you think people talk more or less to each
    other in real life, when they have the option to use devices to watch shows and
    play games? Do you think that’s a good or bad thing? Did you know that too much
    time on devices can sometimes make your eyes hurt? What are some fun activities
    that you can do when you need a break from technology? Perhaps go outside, play
    with blocks, do a puzzle, or read a (physical) book?”


    # ## Extension Activity: Old Technology Petting Zoo


    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_79_0.png)


    If you really want to expand upon this topic, consider hosting an “Old Technology
    Petting Zoo”. Although it takes a lot of preparation, this is an incredibly fun
    and powerful way to give your learners a chance to experience the progression
    of technology. You could try to show multiple technologies or just one to start
    with. This could always be expanded upon later.


    If you want something a bit less labor intensive, compare writing with a pencil,
    typing on a typewriter, or using a device/computer to write something with your
    hands or your voice (voice to text). Ask your learners how they could send these
    written messages to someone far away.


    If you have more lead time, consider showing kids ways in which listening to music
    has evolved. You could borrow or perhaps even buy if you can find them inexpensively
    at yard sales or thrift stores, items such as a record player, Walkman, portable
    CD player, boom box, radio, different generations of iPods, and a device with
    a streaming service such as Spotify. (Maybe you can even get your hands on an
    8-track player or Victrola, or if not, show a video of these). This lesson is
    super powerful if you can find these in working condition, and your learners can
    actually listen to (age-appropriate) music. Conclude the activity by comparing
    and contrasting ways in which these music playing devices can be used and the
    music can be shared.


    # ## Some Ideas for Comparing and Contrasting Technology for Playing Music


    Ask questions such as: “Could you share music with friends? What about friends
    who live far away? You can easily do this with music-streaming services such as
    Spotify, but you and your friend both have to subscribe to that service. People
    used to burn CDs and make “mix tapes” (a mix of songs on cassette tapes), but
    most people had less access to artists and songs than you can find now on streaming
    services. There’s also a'
  merge: -1
  img_proc: true
