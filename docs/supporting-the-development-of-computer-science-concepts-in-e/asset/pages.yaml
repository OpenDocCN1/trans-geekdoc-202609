  md: '# # Algorithms and Programming—Variables—Abstraction


    CSTA K-2 Standard 1A-AP-09: Model the way programs store and manipulate data by
    using numbers or other symbols to represent information.


    > "Information in the real world can be represented in computer programs. Students
    could use thumbs up/down as representations of yes/no, use arrows when writing
    algorithms to represent direction, or encode and decode words using numbers, pictographs,
    or other symbols to represent letters or words."


    **Variables** are a placeholder in a computer program for something that could
    change. This is an abstract concept that is easier for older learners to grasp.
    However, you can lay the groundwork and introduce vocabulary with your younger
    learners, too. Points/coins in video games (with the number of points/coins changing)
    is an example that works well for gamer kids.


    # ### Teaching Variables Using Cups and Jelly Beans


    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_59_0.png)


    You could also demonstrate this concept with a range of ages using a cup and jelly
    beans. Give your learners a small cup and put five jelly beans in it. Tell your
    learners that your variable is 5. Tell them to choose a jelly bean (any jelly
    bean) and take it out of the cup (they could eat it if it’s a flavor they like).
    Have them count how many jelly beans are left (4). Have them tell you out loud
    that *the variable is 4*. Repeat (maybe change it up and instruct them to eat/remove
    two jelly beans instead of one, etc.) until all of the jelly beans have been removed
    from the cup.


    Begin again by adding more jelly beans (start with a different number, like 3)
    and repeat the process. Tell your learners: “Our variable keeps changing, but
    it doesn’t change on its own. What is causing the variable to increase/decrease?”
    As your learners get older and when it’s developmentally appropriate, you can
    make this lesson more nuanced. A good rule of thumb for when to go in depth into
    variables is to approach this with middle school aged students (grades 6–8).'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# # Hopscotch Jumping Algorithm


    Revisit **algorithms**/instructions on a playground with a game of hopscotch.
    If you don''t have a hopscotch template available on a nearby playground, you
    can draw it with chalk. Each square should be big enough that your learner''s
    shoe-clad foot can hop comfortably inside, but small enough that it''s also possible
    to reach the center of the next square when hopping on one foot. A traditional
    hopscotch court usually looks something like this:


    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_60_0.png)


    Pair your learners up in groups of two, or if you''re working directly with your
    learner, you can take turns. Get something to throw into the hopscotch squares.
    This could be a rock, bottle cap, or whatever you have on hand. Figure out who''s
    going first and have them throw the object into a square (in some versions of
    the game, you throw the object sequentially, starting in square 1, then square
    2, etc.). One person hops and the other person gives the person hopping the instructions/algorithm.
    Only one foot is allowed in each square, and the hopper can''t touch the edges.
    The hopper can''t skip squares and once the object has been retrieved, they need
    to follow the squares back in reverse order with the object in their hand.


    Algorithm/instructions could sound like this: "Hop your right foot into square
    1, now right foot in 2, left foot in 3 at the same time" etc." The instructions
    have to come fast or your jumper will lose their balance (which makes it exciting)!
    Once the object is retrieved (often while leaning down and balancing on one foot)
    the person following instructions has to turn around and hop back to square 1,
    again without touching the outside lines of any of the squares, while still continuing
    to follow the numbers sequentially. If they fall or touch the outside lines (or
    the coaches give faulty instructions, or they don''t follow the correct instructions),
    they can start over and try again (or give someone else a try—either rule works).
    Once one person has been successful, it''s someone else''s turn. Start with the
    traditional hopscotch game, then consider switching it up.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'Since this game is for teaching algorithms (as opposed to traditional hopscotch),
    have the coach change up the algorithm/instructions. Challenge the coach to give
    instructions that get the hopper to the object faster, that make it less likely
    for them to lose their balance, or that make it more challenging. If they’re really
    good at hopscotch, can they do it jumping backwards? The hopper should follow
    the instructions exactly. If the coach isn’t giving correct instructions, the
    hopper can’t be successful and they need to debug.


    Once your learners have mastered this, consider enrolling them in a CS Fundamentals
    course on Code.org. This free, targeted curriculum spans ages 4–11 and includes
    lessons for “pre-readers”. The lessons are fun and engaging, and include both
    online and “unplugged” options. If this platform works well for you and your learners,
    Code.org includes curriculum to teach computer science skills all the way through
    high school.


    # Binary


    Binary is the “language” of computers. It’s made up of 1s (signal on) and 0s (signal
    off). Computer chips are made up of transistors that act like tiny switches. If
    an electrical current is flowing through the transistor, it is a signal on, or
    1. If no electrical current is flowing through the transistor, it is a signal
    off or 0. Binary is also called machine code. The central processing unit (CPU)
    of a computer can only understand information written in binary/machine code.


    Since binary code is essential to computer science, it’s worth teaching your learners
    the vocabulary and introducing the concept that something can stand for something
    else. In Little Computer Scientists, readers are encouraged to try writing their
    names in “secret code” using binary. Students as early as first grade (ages 5–6)
    can do this. Additionally, our youngest learners can “clap” in binary (open hands
    for 0, clap for 1). Binary can also be demonstrated by flipping a light on (1)
    and off (0). Make this fun by having your learners read the binary number sequence
    to you while you flip the light off and on, then switch roles and have them flip
    the switch. Use Codes Extension Activity 2: Use Binary for Your Code to help your
    learners write their name in binary. For younger learners, I find it’s helpful
    if they circle the letters in their names first, so it’s easier for them to find
    the binary code they want, quickly.


    If you want to dig deeper into teaching kids about codes and ciphers, (and more
    specifically how you write secret codes by subbing out a different letter, number,
    or symbol for the traditional alphabet letters), it’s easiest to start by simply
    numbering the alphabet and switching out numbers for the letters. Use Codes Extension
    Activity 1: Use Numbers for Your Code to help your young learners do just this.
    Another traditional option is called the Caesar (shift) cipher where you shift
    the letters of the alphabet (e.g., if you shift by 1 you would write A as B, B
    as C and so on).'
