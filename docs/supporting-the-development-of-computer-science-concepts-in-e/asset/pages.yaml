  md: '# Extension—Physical Computing and Robots


    The term **physical computing** is sometimes used interchangeably with robotics
    as both can include devices with sensors, lights, displays, motors, and other
    inputs/outputs. Such features make these devices incredibly engaging, and they’re
    a great way to enhance your computer **STEAM** or **STEM** curriculum.


    I’ve loosely separated the two for practicality; most of what’s listed under “robots”
    is a self-contained unit, while the products listed under “physical computing”
    have multiple pieces that can be added and/or assembled as desired. I’ve also
    included a few options for advanced/older learners, for some ideas about where
    to go next. If you work in a school and you don’t have funding for these through
    your organization, consider writing a grant. In my current school, my colleagues
    have had great success with the Bosch Best Grant (www.bestteachergrant.org).


    Physical computing and robotics encompass a variety of devices created for a range
    of ages, with an assortment of capabilities and price points. It can be a bit
    overwhelming. Make sure to do some research (hands on, if possible) before purchasing,
    and if you work in a school, consider just purchasing one before committing to
    a whole class set. This single device or kit could be used as a choice/station
    until you’ve determined what would work best in your space and with your age group.
    Below you’ll find a brief overview of some good choices currently on the market.


    # Robots/Robotics Overview


    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_23_0.png)'
