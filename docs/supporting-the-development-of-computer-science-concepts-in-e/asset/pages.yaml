  md: '# Algorithms and Programming—Program Development—Testing


    CSTA K-2 Standard 1A-AP-14: Debug (identify and fix) errors in an algorithm or
    program that includes sequences and simple loops.


    "Algorithms or programs may not always work correctly. Students should be able
    to use various strategies, such as changing the sequence of the steps, following
    the algorithm in a step-by-step manner, or trial and error to fix problems in
    algorithms and programs."


    Young learners likely aren’t familiar with the term “debug”. Consider introducing
    this vocabulary with a fun chant/song.


    # The Debugging Song


    ![](img/acd1c0fd0d1eaf5ac33f196d3d3a4d01_72_0.png)


    Introduce the concept of debugging to your learners with this call-and-response,
    “repeat after me” song. Start by telling your learners: “This is a ‘repeat after
    me’ song” and have them say that back.


    Note: words can be sung or spoken depending on your preference.


    +   - You: “Quit bugging me” (slap your thigh)

    +   - Kids: “Quit bugging me” (kids slap their thighs)

    +   - You: “Quit bugging me” (slap your thigh)

    +   - Kids: “Quit bugging me” (kids slap their thighs)


    +   - You: “We’ve got to debug” (brush off each shoulder as you say this)

    +   - Kids: “We’ve got to debug” (kids brush off each shoulder)

    +   - You: “We’ve got to debug” (brush off each shoulder as you say this)

    +   - Kids: “We’ve got to debug” (kids brush off each shoulder)'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'You: "We''ve got to find the problem" (bring your hand up to your forehead,
    above your eyes, like you''re searching for something) Kids: "We''ve got to find
    the problem" (kids repeat gesture) You: "We''ve got to find the problem" (bring
    your hand up to your forehead, above your eyes, as if you''re searching for something)
    Kids: "We''ve got to find the problem" (kids repeat gesture)


    You: "We''ve got to debug" (brush off each shoulder as you say this) Kids: "We''ve
