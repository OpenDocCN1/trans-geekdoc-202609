  md: '# Chapter 2


    # Networks and the Internet


    # Introduction


    Young learners are trusting by nature. They need to be taught when and how to
    be cautious. When introducing login credentials, you’ll need to first teach your
    learners what a username and password is (a.k.a. login credentials). Be sure to
    follow that by explaining why we use these and who they should (and shouldn’t)
    share them with. Use the handout Login Credentials: Check for Understanding with
    your older learners. Play Click! Click! Malware and the Red Light/Green Light:
    Password Security Game to make it fun. Sing The Silly Password Song together.
    Convey a basic understanding of how networking works, with The Cloud Coloring
    Page.


    # Networks and the Internet—Cybersecurity—Communicating


    CSTA K-2 Standard 1A-NI-04: Explain what passwords are and why we use them, and
    use strong passwords to protect devices and information from unauthorized access.


    > "Learning to protect one’s device or information from unwanted use by others
    is an essential first step in learning about cybersecurity. Students are not required
    to use multiple strong passwords. They should appropriately use and protect the
    passwords they are required to use."


    # Script for Teaching Login Credentials


    Explain that a username is the way you tell a device (or app/website) that it’s
    you. It connects you to your stuff (saved documents, email, saved games, and more).
    Your username usually doesn’t change. A username is your special tech name. For
    safety, it should not be the same as your real name. Make sure your learners know
    that your username is okay to share with some people, but to check with a trusted
    adult first.


    Explain that your password is the second part of accessing your device (or app/website)
    and it should be extra secret. Have your learners come up with some ideas for
    why they think this is important. I usually take some time to explain that if
    someone has your password, they can get into your stuff and mess around with it.
    Just like it’s not fun if someone goes into your room and messes up your stuff,
    it’s also not fun when someone gets into your stuff on your device and messes
    it up. We want to avoid that.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '“Your password is between you, your device, and your trusted grown-ups.” Pause
    here and review who is and isn’t a trusted grown-up. “Is your teacher a trusted
    grown-up? How about your neighbor? Your best friend? What about your grown-ups
    at home? Does your teacher need to know your username and password for a computer
    that you use at home? (No). Does your grown-up at home need to know about your
    username and password for school devices? (Yes, especially if you bring these
    home to do homework).” You may want to review this a few times so that they get
    the hang of it. If your style is to be silly, you could also ask if your dog,
    cat, bird, or the squirrel outside the window need to know your login credentials.


    # # Red Light/Green Light: Password Security Game


    Play the Red Light/Green Light game, and use it to reinforce when to keep passwords
    safe. In the traditional game, one person stands on one side of a space such as
    a gym, field, or playground (the “caller”) and everyone else is on the other side.
    When the caller says “green light!” everyone runs toward them, trying to reach
    them first. When the caller says “red light!” everyone has to stop. Anyone who
    does not stop quickly enough (or runs when they hear “red light!”) has to go back
    to the starting point. You can call “green light” or “red light” consecutively
    to mix things up. The person who reaches the caller first gets to become the new
    caller.


    To use this game to teach kids when it’s okay to share passwords, instead of yelling
    out “red light!” and “green light!” yell out the names/titles of people that should
    or should not know a kid’s password. You could have a list (images and written
    words) for the caller to use, with columns and/or green or red text to help indicate
    who is and is not a safe person to share passwords with. Names and titles can
    be reused within the same game, if need be.


    Some “red light” examples could be: your neighbor, your friend, your cousin, a
    stranger, someone you just met. Some “green light” examples could be: your teacher,
    your school librarian, your grown-ups, your guardian, your dog, your cat, yourself.
    Talk through which answers are “red” and “green” with your learners in advance
    of the game and make sure to tailor this to your community. With my younger learners,
    I always use the term “grown-ups” to talk about their trusted adults at home since
    not all of my students live with a mom and dad, and “grown-ups” is more inclusive.
    With my older learners, I say “trusted adult” for the same reason.


    Again, you could add various animals to make it silly, as long as you tell your
    learners in advance which category these animals are in (a bird that can repeat
    passwords back isn’t a good animal to share your password with, but any other
    animal could be a “green light”).


    Tell your learners that, unlike your username, your password should change from
    time to time. It should also be changed right away if someone who is not a trusted
    adult uses it (such as another kid). When teaching older learners, I elaborate
    that sometimes you might get a message (usually an email) that someone else may
    have accessed your account. This is another situation when changing your password
    and maybe enabling multi-factor authentication is an important action to take.
    When multi-factor authentication is enabled, the first “factor” is your password,
    but another “factor” is required, such as a verification code that was texted
    or emailed to you, or biometrics such as voice, fingerprint, face or retina scan,
    etc. If you’re pretty confident that'
