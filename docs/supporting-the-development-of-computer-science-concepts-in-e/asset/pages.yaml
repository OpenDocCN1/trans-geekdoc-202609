  md: 'a fake account login page is opened, and you unknowingly input your login credentials
    into a login page that the scammer controls. Now the scammer has your credentials
    and account information.


    **Physical computing** is sometimes used interchangeably with robotics as both
    can include devices with sensors, lights, displays, motors, and other inputs/outputs.
    For our purposes, I’ve differentiated “physical computing” as objects that have
    multiple pieces that can be added and/or assembled as desired.


    **Pop-ups** are advertisements (and other messages) that pop up on your screen.
    Sometimes they’re simply advertisements. However, one type of black hat hacking
    is to create a pop-up ad that tells users they have a virus on their computer
    and that they need to download software to clean the system. However, when they
    download that software, instead of cleaning the system, it installs a virus. Another
    common tactic is not to install a virus, but to tell the user the device is infected
    with malware and instruct the user to call a telephone number that the scammer
    answers. Then s/he will trick the user into installing software that allows the
    scammer to control the user’s device. Lots of pop-ups suddenly appearing is often
    a sign that there is malware installed on your computer. When your computer is
    suddenly running more slowly than usual, that can also be indicative of a malware.


    **Programming** (see Coding).


    **Python** is a popular software coding language (named after the BBC comedy series
    _Monty Python’s Flying Circus_). It has many applications including: artificial
    intelligence, machine learning, game design, creating websites and data analytics,
    making it quite versatile. Python is considered a “high-level” programming language,
    which means it’s easy for people to read and write. This is part of what makes
    it a good programming language for beginners. In addition, you can run each line
    of code to check for errors, making it easier to troubleshoot. A good progression
    for kids learning to code is to start with ScratchJr, progress to Scratch, and
    then explore Python and/or HTML/CSS.


    **QR code** is a “quick response” barcode which, when scanned, links to some sort
    of data or information.


    **Quarantined virus** is a virus that has been confined to a safe area where it
    can’t infect the rest of your device. You do this using antivirus software.


    **Ransomware** is a type of malware that keeps you from accessing your files,
    unless you pay money to the malicious hacker.


    **Raspberry Pi** is an inexpensive personal computer that can fit in the palm
    of your hand. There are a variety of accessories that you can connect to your
    Raspberry Pi. Some of these are for usability: for example, a power supply, monitor,
    mouse, keyboard, and micro-SD card. Some of these are for innovation: for example,
    a camera, or the “Sense Hat” which allows you to track your environment for variations
    in pressure, humidity, movement, and more, and use the built-in LEDs (light-emitting
    diodes, which look like little light bulbs, but are actually considered tiny semiconductors)
    to see this data. Python is a good language to use with a Raspberry Pi (you can
    also use Scratch).


    **Rebooting** is restarting your computer.


    **Root** (see Tree).'
