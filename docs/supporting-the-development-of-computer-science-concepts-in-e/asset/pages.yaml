    \ boss your tech around [turn around in place as you’re saying this line]\n+ \
    \  That’s what it’s all about! [clap three times]\n+   \n+   You do the innn-put,\
    \ output [sway in place]\n+   You do the innn-put, output [sway in place]\n+ \
    \  You do the innn-put, output [sway in place]\n+   That’s what it’s all about!\
    \ [clap three times]"
