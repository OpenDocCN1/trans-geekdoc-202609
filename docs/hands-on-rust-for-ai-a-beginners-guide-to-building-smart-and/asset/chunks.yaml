    # 构建与运行


    一旦你写好了代码并包含了任何必要的库，`Cargo` 就可以将所有内容编译成一个可以运行的程序。它就像有一个内置的技师，能够组装你 AI 的所有部分并让其顺畅运行。


    让我们来看看 `Cargo` 的实际操作（假设你已经安装了 Rust）：


    1. **创建一个新项目**：打开终端并导航到你想要创建项目的目录。然后输入以下命令：


    ```bash

    cargo new my_first_ai_project

    ```


    这将创建一个名为 `my_first_ai_project` 的新目录，其中包含 Rust 项目的基础基础结构。


    2. **探索项目**：使用 `cd my_first_ai_project` 进入新创建的目录。你会发现一个名为 `Cargo.toml` 的文件，它是项目的配置文件。此外，还有一个名为
    `src` 的文件夹，你可以在其中编写 Rust 代码。


    3. **添加依赖项**：假设你想在你的 AI 项目中使用一个库来处理图像数据。你可以在 `crates.io` 上搜索此类库，然后使用 `Cargo` 将它们添加到你的项目中。例如，要添加一个名为
    "image" 的流行图像处理库，你可以运行以下命令：


    ```bash

    cargo add image

    ```


    这将下载 "image" 库并配置你的项目使用它。


    4. **构建与运行**：一旦你写好了代码并添加了任何依赖项，就可以使用 `Cargo` 来编译并运行你的程序。具体命令取决于你的操作系统，但通常你可以运行：


    ```bash

    cargo run

    ```


    这将编译你的代码并执行你的程序。


    记住：`Cargo` 是管理 Rust 项目必不可少的工具，特别是在处理外部库时。随着你深入探索 AI 开发，`Cargo` 将成为你保持项目井井有序且高效的得力伴侣。


    顺便说一下，官方的 `Rustlings` 课程为 Rust 编程和 `Cargo` 提供了一个非常棒的实战介绍。快去看看它的互动练习，并尝试构建小型 Rust
    项目吧！


    # 第 3 章：机器学习基础 - 核心：揭开 AI 背后的魔法


    恭喜你！你已经掌握了 Rust 编程的基础知识，准备好进入机器学习（ML）迷人的世界了。将机器学习想象为赋予 AI 应用随时间推移进行学习和改进的秘诀。在本章中，我们将揭示机器学习背后的核心概念，让你从一个好奇的编码者转变为机器学习爱好者！


    想象一下：你不断向朋友展示你最喜欢的犬种的照片。神奇的是，他们开始能够自己识别出那个品种了！这就像是机器学习。机器学习算法可以从数据（如那些狗的照片）中学习，并利用这些知识对它们以前没见过的新数据做出预测或决策。很酷，对吧？


    以下是机器学习配方中的关键要素：


    1. **数据，光荣的数据**：机器学习算法是数据饥渴的！你给它们的数据越多，它们学习和表现得就越好。这些数据可以是从图像、文本到数字和传感器读取的任何内容。将其想象为滋养你的机器学习模型并帮助它变得更明的食物。


    2. **强大的算法**：算法是一组告诉计算机如何处理数据的指令。有许多不同的机器学习算法，每种都有自己的优缺点。为你的项目选择合适的算法至关重要。


    3. **训练过程**：一旦你有了数据，就是训练的时候了！想象一下在教你的朋友识别模式。同样，你将数据喂给算法。


    4. **预测与决策**：训练完成后，机器学习算法利用这些知识对它们以前没见过的新数据做出预测或决策。就像你的朋友现在可以识别出特定的犬种一样。


    5. **评估与改进**：评估你的模型非常重要。如果结果不理想，你可以返回并调整过程以提高性能。


    ## 机器学习的优势


    机器学习正在彻底改变各个领域，原因如下：


    - **自动化**：机器学习可以使曾经被认为是复杂的任务自动化，从而释放人类的时间。

    - **改进决策**：机器学习模型分析海量数据，从而做出更好的决策。

    - **个性化体验**：机器学习可以根据个人喜好提供个性化体验，让技术变得更具吸引力。


    ## 准备好进一步探索了吗？


    本章提供了机器学习的层层概述。随着你对这本书的阅读，我们将深入探讨特定的算法和技术，让你具备构建自己的智能应用的技能。


    ### 3.1 理解不同类型的机器学习（监督学习 vs 无监督学习）


    欢迎回来，AI 爱好者！在上一章中，我们探索了机器学习的基础。现在，让我们深入一步，揭示不同类型的机器学习算法——这些是我们工具箱中的工具。在这里，我们将关注两个主要类别：监督学习和无监督学习。想象你正在帮助朋友整理他们凌乱的房间。你采取的方法取决于他们是否给了你指令（监督），或者你需要自己去想办法（无监督）。


    #### 监督学习


    想象你的朋友准确地告诉你在哪里把书、衣服和玩具放在哪里（标记数据）。这就是监督学习的实际应用！你喂给算法的数据是有标记的，这意味着每个数据都有一个对应的答案或类别。


    以下是监督学习的工作原理：


    - **准备**：你收集已经标记过的数据。例如，你可能有一组图像数据集，其中每张照片都标记为“猫”、“狗”或“鸟”。

    - **训练**：在标记数据上对算法进行训练。这就像你的朋友向你展示房间里什么东西放在哪里。算法学习识别数据与相应标签之间的模式和关系。

    - **预测**：训练完成后，可以使用该模型来预测新的、未见数据的标签。就像你现在可以看一个新物品并判断它是书、衬衫还是玩具一样，模型也可以可以分析新图像并预测它们可能包含的内容。


