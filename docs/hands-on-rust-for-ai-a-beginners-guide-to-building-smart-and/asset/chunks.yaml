  trans: '

    现在想象你朋友的房间乱七八糟，而他们没有给你提供任何指令（未标记数据）。这就是无监督学习！你提供给算法的数据没有预定义的标签或类别。其目标是让算法从数据本身发现隐藏的模式和结构。


    以下是无监督学习的工作原理：


    1. **数据探索**：算法分析未标记的数据，寻找模式和关系。想象你在整理朋友的房间，将相似的物品（衣服、书籍、玩具）归为类，尽管它们没有被显式地标记。

    2. **发现**：算法可能会识别数据中的聚类或分组。例如，它可能会发现一类主要是红色衣服的聚类，另一类是蓝色玩具的聚类，以此此类推。


    ### 无监督学习的实际应用


    无监督学习适用于以下任务：


    ● **客户细分**：将具有相似特征的客户分组，以进行针对性的营销活动。

    ● **推荐系统**：识别用户行为中的模式，以推荐他们可能喜欢的产品或内容。

    ● **异常检测**：发现数据中的异常模式，例如检测金融数据中的欺诈交易。


    ### 选择合适的工具


    你选择的机器学习类型取决于你正试图解决的问题。如果你有标记数据并想进行预测，那么监督学习是一个很好的选择。如果你有未标记数据并想发现隐藏的模式，那么无监督学习是正确的出路。


    ### 核心总结


    通过理解监督学习和无监督学习，你已经解锁了机器学习工具箱中的两项强大工具。在下一章中，我们将探索其他令人兴奋的算法，并深入探讨使用 `Rust` 构建智能应用程序的世界！


    ## 3.2 你将遇到的常见机器学习算法（探究内部机制）


    欢迎回来，AI 学徒！我们一直在深入研究机器学习这个迷人的世界，探索不同类型的算法。现在，让我们更近地观察一些你在机器学习之旅中会遇到的常见算法。你可以将它们想象成机器学习工具箱中的全明星球员，每种算法都有其自己的优势和特长。


    以下是你经常会见到的的一些重量级算法：


    ● **线性回归**：想象一条能够完美拟合一堆散乱数据点的直线。`Linear regression` 是一种监督学习算法，用于寻找这条线，允许你根据新的数据点进行预测。例如，你可以用它根据面积来预测房价。

    ● **逻辑回归**：与线性回归类似，但用于不同的任务。这种监督学习算法用于分类问题，即你想要预测某物所属的类别（例如，是垃圾邮件还是不是垃圾邮件）。想象将袜子分成两堆：白色和彩色的。`Logistic
    regression` 在机器学习世界中帮助完成这类任务。

    ● **决策树**：想象一个带有问题和答案的流程图，通向最终决策。`Decision trees` 是一种使用树形结构对数据分类的监督学习算法。它们通过对数据提出系列问题来得出预测。想象一个电影推荐的决策树：“你喜欢动作电影吗？是的？那么尝试一下这部科幻电影吧！”

    ● **K 近邻算法 (KNN)**：这种监督学习算法依赖于群体智慧。对于一个新数据点，它会在训练数据中找到最近的 `K` 个邻居（相似的数据点），并根据这些邻居的多数来预测标签。想象向朋友寻求电影推荐——`KNN`
    就像向口味相似的 `K` 个近朋友索要建议。

    ● **支持向量机 (SVMs)**：这些监督学习算法以其处理复杂数据和高维（许多特征）的能力而闻名。`SVMs` 在数据中不同类别之间寻找最佳分割线。想象用一条清晰的分界线将电子邮件分为垃圾邮件和非垃圾邮件——这正是
    `SVMs` 以更复杂的方式做的事情。

    ● **K-Means 聚类**：这种无监督学习算法是发现未标记数据中组组（聚类）的大师。它通过将相似的数据点归类来帮助发现隐藏的模式。想象将一筐五颜六纷的水果分成橙子、苹果和香蕉几堆——`K-means
    clustering` 为机器学习数据执行类似的操作。


    记住：这只是机器学习算法这一广阔且迷人世界的一个一角。随着你 AI 之旅的不断，你将遇到更多专门的算法，每种算法都有其独特的能力。


    ### 选择合适的算法


    在选择算法时，没有一个一不变的答案。最佳选择取决于你试图解决的特定问题、你拥有的数据类型以及想要的结果。不过，别担心！随着经验的增加，会有许多资源帮助你应对这一决策过程。


    ### 前行之路


    通过理解这些流行算法，你已经向使用 `Rust` 构建自己的智能应用程序迈出了重要的一步！下一章将使你具备将所有内容整合的知识——我们将探索如何使用 `Rust`
    库在你的项目中实现机器学习算法。准备好在你的 AI 作品中释放机器学习的力量吧！


    ## 3.3 复习机器学习所需的数学（数字让 AI 运转！）（基础线性代数和微积分概念）


    系好安全帽，AI 架构师们！使用机器学习构建智能应用程序涉及一些数学概念。但不要恐慌！我们在这里讨论的不是高级微积分。只需要对线性代数的基础理解和一些关键的微积分概念就会对你理解幕后魔法如何运作非常有帮助。将数学想象成让我们能够与机器学习算法通信并让它们发挥最佳作用的语言。


    以下是你经常会遇到的数学要点分解：


    ● **线性代数**：数学的一个分支处理 `vectors`（想象成数字的有序列表）和 `matrices`（类似于数字网格）。它们看起来像是组织数字的高奇方式，但它们是机器学习中极其强大的工具。例如，你可以用
    `vectors` 表示数据点，用 `matrices` 存储它们之间的关系。

    ○ 担心，你不需要成为数学天才！你将主要对 `vectors` 和 `matrices` 进行基本运算，如加、减、乘。想象将购物清单相加（`vectors`）或将来自不同传感器的数据放入表格（`matrix`）。

    ● **微积分**：这个数学领域关注变化率以及事物随时间积累的情况。虽然你不需要超级复杂的微积分，但理解一些核心概念将非常有帮助。

    ○ **导数**：它们告诉你某物变化有多快。想象计算汽车的速度（位置的变化率）——`derivatives` 对于机器学习中使用的各种函数来说也是如此。

    ○ **基础求导法则**：对于求不同函数的导数有一些基本规则。你不需要背下所有规则，但理解这一概念将是有益的。


    ### 为什么数学对机器学习很重要？


    机器学习算法依赖数学来执行计算、识别模式并做出预测。例如，线性代数有助于表示数据和关系，而微积分有助于优化学习过程并精调算法。想象建造房子——你需要一张蓝图（数学）来指导你建造一个坚固且实用的结构（机器学习模型）。


