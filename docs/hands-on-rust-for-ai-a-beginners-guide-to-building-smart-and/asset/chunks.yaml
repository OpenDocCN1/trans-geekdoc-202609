    \ rating of a movie, use a float.\n\n### Putting it all Together: Functions -\
    \ The Power of Reusability\n\nImagine you're building a complex robot. Certain\
    \ tasks, like moving its arms or making sounds, might be repeated throughout the\
    \ robot's code. Functions in Rust allow you to group these reusable blocks of\
    \ code, making your program more organized.\n\nHere is a simple example of a function:\n\
    \n```rust\nfn greet(name: &str) {\n    println!(\"Hello, {}!\", name);\n}\n\n\
    fn main() {\n    greet(\"Bob\");\n}\n```\n\nLet's break this down:\n\n* `fn greet(name:\
    \ &str)`: This defines a function named `greet` that takes one argument, a string\
    \ slice `name`. The `&str` indicates that the function borrows the string data\
    \ instead of taking ownership of it.\n* `println!(\"Hello, {}!\", name);`: This\
    \ line inside the function prints a greeting message, inserting the value of the\
    \ `name` argument.\n* `fn main()`: This is the main function, the entry point\
    \ of our program.\n* `greet(\"Bob\")`: Here, we're calling the `greet` function\
    \ and passing the string `\"Bob\"`.\n\n## 2.3 Managing Your Rust Projects: Introducing\
    \ Cargo (The Package Manager)\n\nImagine you're building a self-driving car. You\
    \ wouldn't want to reinvent the wheel (literally!), right? In the world of programming,\
    \ there are pre-written pieces of code called libraries that can save you time\
    \ and effort. Rust has a fantastic tool called Cargo that helps you manage your\
    \ projects, including downloading and using these libraries.\n\nHere's a breakdown\
    \ of Cargo's superpowers:\n\n* **Package Management**: Think of Cargo as your\
    \ personal assistant for external code. It lets you find and download pre-written\
    \ libraries from a giant online registry called crates.io. These libraries contain\
    \ code for various tasks, saving you from writing everything from scratch.\n*\
    \ **Project Organization**: As your AI projects grow, keeping things organized\
    \ becomes crucial. Cargo helps structure your project's code and dependencies\
    \ (the libraries it relies on) in a clear and maintainable way.\n"
  trans: "\n\n# 引言\n\n也许现在直接着手安装软件让你觉得有些无从。这完全没！Rust 的妙之处在于，你可以在投入完全安装之前先尝试一下。Rust\
    \ Playground（Rust 游练场）是一个非常强大的在线工具，让你能够直接在网络浏览器中实验 Rust 代码，而无需在机器上进行任何设置。把它想象成一个代码沙箱——一个无需下载即可玩耍和学习的安全空间！\n\
    \n以下是开始使用 Rust Playground 的方法：\n\n1. **前往 Playground**：打开你喜欢的网络浏览器并导航到 `https://play.rust-lang.org/`。这将带你进入\
    \ Rust Playground 网站。\n2. **编写你的代码**：Playground 拥有一个大型编辑窗口，你可以在其中编写 Rust 代码。它类似于一个代码编辑器，但一切都直接在浏览器中完成。\n\
    3. **运行与实验**：写好代码后，点击窗口顶部的“Run”（运行）按钮。Playground 将编译并执行你的代码，并将输出直接显示在编辑窗口下方。如果代码中有任何错误，Playground\
    \ 将突出显示它们，并提供实用的信息指导你修复它们。\n\n### 让我们尝试一个简单的例子：\n\n1. 在 Playground 的编辑窗口中粘贴以下代码：\n\
    \n```rust\nfn main() {\n    println!(\"Hello, from the Rust Playground!\");\n\
    }\n```\n\n2. 点击“Run”按钮。\n\n如果一切正确，你应该能在代码下方看到显示“Hello, from the Rust Playground!”的消息。这证明你已成功地在浏览器中直接编写并运行了第一个\
    \ Rust 程序！\n\n### Playground 的优势\n\nRust Playground 为初学者提供了几个优势：\n\n* **无需安装**：不需要下载或安装任何软件——你可以立即开始编码！\n\
    * **即时反馈**：Playground 会立即运行你的代码并显示输出或任何错误。这允许快速的实验和学习。\n* **界面简单**：Playground\
    \ 拥有简洁且易于使用的界面，让你轻松专注于编写代码，而不会被信息淹没。\n* **实验自由**：可以随意玩弄代码、更改内容并观察它们如何影响输出。Playground\
    \ 是一个学习和犯错的安全空间，不会产生任何后果。\n\n### 在 Playground 之外\n\n虽然 Playground 是入门的绝佳工具，但最终你可能想深入研究\
    \ Rust 开发。在这种情况下，在你的机器上安装 Rust 将解锁更多功能，并允许你处理更大的项目。但目前，Playground 是涉足 Rust 编码世界并熟悉基础知识的完美方式。\n\
    \n所以，启动你的网络浏览器，前往 Rust Playground，开始编写一些 Rust 代码吧！有一个整个 AI 应用世界等待你去构建，而 Playground\
    \ 是你 Rust 学习之旅中极佳的第一步。\n\n## 2.2 学习 Rust 基础：你 AI 项目的构建块（变量、数据类型、通过函数整合一切）\n\n\
    恭喜你搭建好了 Rust 开发环境，无论是在 Playground 中还是在你自己安装的设置中！现在，让我们深入研究 Rust 编程的核心构建块，它们将成为你未来\
    \ AI 项目的基础。把这些想象成砖块和砂浆——在构建你惊叹的 AI 杰作之前，你需要它们！\n\n### 存储信息：变量\n\n想象你正在制造一辆自动驾驶汽车。汽车需要存储的一个关键信息是它的当前速度。在\
    \ Rust 中，我们使用变量来存储此类信息。变量就像一个命名的容器，存放特定的值。\n\n以下是在 Rust 中创建变量的方法：\n\n```rust\n\
    let speed: i32 = 50;\n```\n\n让我们来拆解一下：\n\n* `let`：这个关键字告诉 Rust 我们正在创建一个变量。\n*\
    \ `speed`：这是变量的名称。\n* `i32`：这指定了数据类型。\n* `=`：这是赋值运算符，将值赋给变量。\n* `50`：这是正在存储的值。\n\
    \n### 实验变量\n\n```rust\nlet speed: i32 = 50;\nlet speed = 60;\nlet name = String::from(\"\
    Alice\");\n```\n\n### 数据类型：对工作的正确工具\n\n在盖房子时，你不会用锤子来拧螺丝。同样，在 Rust 中，使用正确的数据类型可以保持代码的整洁。你会遇到以下数据类型：\n\
    \n* **整数 (`i32`)**：用于存储整数。\n* **浮点数 (`f32`, `f64`)**：存储带有小数点的数字。\n* **布尔值 (`bool`)**：存储逻辑值，`true`（真）或\
    \ `false`（假）。\n* **字符串 (`String`)**：存储文本。\n\n### 选择正确的类型\n\n思考你想在变量中存储什么类型的信息。如果是参加派对的人数（整数），使用整数类型。如果是电影的平均评分，使用浮点类型。\n\
    \n### 整合一切：函数——可重用的力量\n\n想象你正在构建一个复杂的机器人。某些任务，如移动手臂或发出声音，可能会在代码中反复出现。Rust 中的函数允许你组织这些可重用的代码块，让你的程序更有组织。\n\
    \n这是一个函数的简单示例：\n\n```rust\nfn greet(name: &str) {\n    println!(\"Hello, {}!\"\
    , name);\n}\n\nfn main() {\n    greet(\"Bob\");\n}\n```\n\n让我们来拆解一下：\n\n* `fn\
    \ greet(name: &str)`：这定义了一个名为 `greet` 的函数，它接受一个参数，字符串切片 `name`。`&str` 表示函数引用字符串数据而不是获取其所有权。\n\
    * `println!(\"Hello, {}!\", name);`：函数内部的这一行打印欢迎消息，并插入参数 `name`的值。\n* `fn main()`：这是主函数，是程序的入口。\n\
    * `greet(\"Bob\")`：在这里我们调用 `greet` 函数并传递了字符串 `\"Bob\"`。\n\n## 2.3 管理你的 Rust 项目：介绍\
    \ Cargo（包管理器）\n\n想象你正在制造一辆自动驾驶汽车。你肯定不想重新发明轮子（字面意思），对吧？在编程世界中，有一些预写的代码片段被称为库，它们可以节省你的时间和精力。Rust\
    \ 有一个名为 Cargo 的优秀工具可以帮助你管理项目，包括下载和使用这些库。\n\n以下是 Cargo 的超能力分解：\n\n* **包管理**：把 Cargo\
    \ 想象成你外部代码的个人助手。它允许你从名为 crates.io 的巨大在线注册表中查找并下载预先写的库。这些库包含了各种任务的代码，免得你从零开始编写。\n\
    * **项目组织**：随着你 AI 项目的增长，保持良好变得至关重要。Cargo 帮助你将项目代码和依赖（它依赖的库）组织成清晰且易于维护的结构。\n\n"
