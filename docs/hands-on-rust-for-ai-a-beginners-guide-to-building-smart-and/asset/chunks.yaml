    ## 6.1 什么是深度学习？（简单易懂的神经网络解析）


    ### 深度学习：灵感来自大脑的超级学习


    想象你的大脑是一台学习机器，在不断地建立连接并识别模式。深度学习就是受这种概念启发的的人工智能！它使用了人工神经网络，这些网络就像我们大脑中相互连接的神经元的简化版本。


    将这些神经网络想象成分层结构。信息从一层流到另一层，就像接力赛一样。每一层都执行一个简单的步骤，而它们组合在一起就可以学习一些非常惊不起的事情——比如识别照片中的人脸、翻译语言，甚至驾驶汽车！


    以下是深度学习核心思想的分解：


    * `人工神经元`：这些是神经网络的构建块。它们接收信息。

    * `层`：神经网络是堆叠而成的。信息在通过这些层时会发生转换。

    * `训练`：深度学习通过接触数据来学习。


    ### 为什么深度学习如此强大？


    深度学习之所以强大，是因为：


    * 它们可以从海量数据中学习。

    * 它们可以处理复杂的问题。

    * 它们可以不断改进。


    ### 深度学习的应用：


    深度学习已经以许多酷的方式应用，例如：


    * `自动驾驶汽车`：深度学习帮助汽车在道路上导航。

    * `人脸识别`：深度学习可以识别照片和视频中的人物。

    * `医疗诊断`：深度学习可以分析医学图像来帮助医生。

    * `语音助手`：深度学习驱动了 Siri 和 Alexa 等虚拟助手。


    ### 准备好深入探索了吗？


    深度学习是一个巨大且令人兴奋的领域。


