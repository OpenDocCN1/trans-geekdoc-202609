- pgno: 52
  md: '+   • Thread


    +   • We-Mo


    In some ways, BLE, ZigBee, Z-Wave, and Thread are similar. They are all wireless
    technologies that use mesh networks to wirelessly connect and network IoT devices
    while not involving a cellular or Wi-Fi signal. However, they differ in the frequency
    they use, and they vary in operation and therefore the variety of devices they
    will require support at a given time. We-Mo, however, needs Wi-Fi, which eliminates
    the requirement for a hub or controller, and permits devices to attach directly
    via the net. Two of the massive disadvantages of this technique are that it needs
    a lot more power and processing capability than alternative, lower-energy choices.


    Again, this can only be a brief list; the quantity of protocols is in depth. Each
    has its advantages and downsides; however, since there is no single common standard,
    businesses should confirm the correct protocol for every use case and make sure
    the technologies they select are compatible with their overall platform. As standards
    are still evolving, it is going to be advantageous to exchange or upgrade the
    method.


    # ## 2.5.3 Networking Challenges


    Beyond the various completely different protocols and disparate hardware, there
    are basic networking challenges that have got to be addressed to make IoT-enabled
    devices a reality. The primary step is to make sure that information is flowing
    quickly and reliably. Security is additionally crucial, as IoT devices are often
    evolving into targets for hackers and cyber terrorists. Once devices connect,
    they have to certify information should be encrypted, and they ought to communicate
    their presence and activity.


    Power consumption and bandwidth present alternative distinctive challenges. During
    a scenario where thousands of devices are communicating with each other, frequent
    communication and transmission may be a drain on battery-operated devices. In
    those cases, minimal, economical power usage is vital. During a scenario where
    thousands of devices are communicating over wireless networks, bandwidth will
    become a priority, and costs will increase quickly. The goal should be to keep
    IoT information streams as compact and economical as possible.


    # ## 2.5.4 Best Practices in the Era of IoT


    Within the IT world, best practices are generally described as procedures that
    are well known and considered to be the most effective. Nowadays there’s an absence
    of best practice to help businesses write code, manage the life cycle of certain
    IoT-related hardware and software systems, and address the distinctive kinds of
    breaches that may occur, together with intrusions that are initiated at the device
    level. Without best practices as a road map, programmers and IT professionals
    are traveling in unmapped waters. Consider the Mirai botnet attack in October
    2016. Throughout this incident, IT professionals saw firsthand how prolific a
    breach can be. Although the incident was damaging, many things were learned, together
    with the importance of getting an IoT security strategy and the concept of fast
    response.'
