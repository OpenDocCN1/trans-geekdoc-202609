    # 10.4 METHODOLOGY


    Figure 10.1 shows the proposed geospatial data classification model. Even though
    diverse application-related classification models can be developed using geospatial
    data, the main intention of this research proposal is to know about the kind of
    industry such as micro industries, macro industries, mid-scale industries, large-scale
    industries, small-scale and very large-scale industries that suit a specific location.
    This is because a multitude of factors influence the location decisions of firms
    and industries, including proximity to raw material supplies, availability of
    labor, good communications and nearness to markets. Here, geospatial data will
    be utilized for accomplishing the experiment, from which the X and Y co-ordinate
    are traced that is related to the latitude and longitude information, respectively.
    As there is a huge quantity of data it is given to the Hadoop framework for the
    purpose of handling that big data. Normally, the Hadoop framework is an Apache
    open-source framework written in java that allows distributed processing of large
    datasets across clusters of computers using simple programming models. Hadoop
    framework allows the user to'
