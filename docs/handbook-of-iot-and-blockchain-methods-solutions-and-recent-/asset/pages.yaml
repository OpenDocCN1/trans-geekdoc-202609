    # 1.3 CHALLENGE TO IMPLEMENTATION OF BLOCKCHAIN IN IOT


    # 1.3.1 ABSENCE OF IOT-CENTRIC CONSENSUS PROTOCOL


    A consensus protocol is a technique or a set of rules and regulations that make
    all the full nodes finalize on an arrangement over the sequence of transactions.
    There are various categories of consensus protocols being currently utilized in
    a variety of blockchain applications, for example, PoS, Proof of Work (PoW), Practical
    Byzantine Fault Tolerance (PBFT), etc. A few of the commonly used consensus protocols
    are deliberated upon in the following paragraphs of this chapter. Makhdoom [16]
    shows the contrariety of a few of the widely known and used blockchain consensus
    protocols in a thorough and exhaustive manner. The established consensus protocols
    such as Proof of Stake (PoS), Proof of Work (PoW), IOTA, Proof of Elapsed Time
    (PoET) are fabricated for permissionless blockchains, with an emphasis on financial
    transactions, whereas PoS and PoET have the potential to be used in permissioned
    blockchains.


    The universal problem with these consensus protocols is the probabilistic nature
    of the consensus process and that it fails to terminate in a perdurable committed
    block. This further explains their vulnerability to blockchain forks [17]. One
    of the major contributors to deferred transaction verification is an absolute
    absence of consensus finality that is not at all sustainable for the various real
    / near-real-time IoT systems that demand instantaneous transaction verification
    and completion. Furthermore, examining the various consensus protocols, we find
    that a certain type of hardware is required by PoET in which the region allocating
    wait time necessitates being a trusted entity.


    A number of ambiguities are yet to be resolved when it comes to IOTA since it
    is still in the open beta testing phase particularly regarding its performance
    efficacy and security. A number of questions pertaining to whether IOTA would
    be an effective micro-payment method or its compatibility with contracts as in
    HFB (Hyperledger-Fabric blockchains) and Ethereum and its capability of providing
    data confidentiality are still unanswered.


    Meanwhile, a number of other consensus protocols like the Delegated Byzantine
    Fault Tolerance (DBFT), Practical Byzantine Fault Tolerance (PBFT), HoneyBadger
    et al. are based on the Byzantine Fault Tolerance (BFT) protocol which is a group
    of state machine reduplication protocols. By replicating the services on a multitude
    of nodes it provides security against arbitrary faults. Despite BFT being the
    preferred protocol for permissioned-type blockchains, it has several shortcomings.
    BFT-based protocols have a high vulnerability toward DoS attacks owing to their
    languid timing assumptions with the exception of HoneyBadger BFT [18]. Not only
    does the feeble synchrony negatively alters the system’s productivity, but the
    liveliness characteristic of languid synchronous protocols is also unsuccessful
    as the feeble timing assumptions get contravened when vitriolic networks launch
    DoS attacks.'
