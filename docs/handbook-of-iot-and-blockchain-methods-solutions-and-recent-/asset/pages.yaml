    # 1.1 INTRODUCTION AND MOTIVATION


    # 1.1.1 INTERNET OF THINGS


    The last two decades have been catalyzed by developments on a myriad of technological
    fronts and these developments have severely affected the way in which society
    functions. Technology has been increasingly integrated with our way of living
    and daily life, ranging from the moment we wake up at home and use smart home
    appliances to the usage of integrated technology in the workplace to health monitoring
    and analytics of our sleep. This development has asymmetrically changed the way
    industries perceive and use technology and with the incumbent developments they
    have been trying more and more to integrate them into their operations for efficiency.
    The reports suggest that the estimated count of connected IoT devices is set to
    rise to 50 billion by the end of this decade [1]. The ecosystem involves a myriad
    of elements such as: IoT devices, sensors, actuators, network elements (servers,
    routers etc.) and associated industrial machinery. In this pursuit of connecting
    conventional devices across networks and over the internet, the Internet of Things
    and Web of Things (WoT) have been pivotal in catalyzing and catering to this need.
    IoT as an emerging technology offers novel solutions and optimizing paradigms
    to both conventional and unconventional industrial operations. One such example
    of this innovative behavior is the case of innovative transportation in the field
    of Intelligent Transportation Systems (ITS) where IoT and associated technology
    have provided the ability for smart traffic management and traffic prediction
    through monitoring and predicting traffic location.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'As discussed above, the Internet of Things or IoT encompasses a global network
    of nodes and devices that are addressable uniquely via standard communication
    protocols. The Internet of Things, which has witnessed a dramatic surge in the
    recent past, has had an immense impact on every aspect of human lives, ranging
    from wearable gear to sensors monitoring ecological changes in remote locations
    to regulating physical metrics in manufacturing processes. The set of devices
    or the “Things” which share a common resemblance in order to directly or indirectly
    connect to the Internet, operate within the confines of their functionality and
    exchange, analyze, process and deliver data in the common language; these sets
    of devices working in tandem are defined as “Internet of Things”. Although large
    swathes in advancement in technology have unequivocally reduced human intervention
    and have significantly integrated devices with the real world, the big question
    of privacy and protection in IoT devices has been left largely unaddressed and
    now presents a potential threat to the cyber landscape. The lack of a standard
    IoT framework safeguarding privacy across all platforms has been attributed to
    varied communication protocols, a multitude of programming languages and differing
    levels of distributed computing in devices, networking and perceiving data in
    real-time systems [2].


    The developers and research community have been meticulously working to develop
    tailor-made frameworks and structures for specific platforms. In its pursuit of
    this, the community has encountered several challenges pertaining to hardware
    which involve energy efficiency, ranging from the lightweight computation of devices
    and sensors to virtual threats including encryption attacks which occur on system
    vulnerabilities and tend to impede system integrity. Privacy is another concern
    that many nations across the globe have echoed. Policy measures such as the EU’s
    General Data Protection Regulation (EU GDPR) have already been enforced with stringent
    rules for privacy yet there exist several challenges on the regulatory and technological
    front which this chapter touches upon in its first section. Industries such as
    healthcare, which incorporates one of the largest numbers of IoT devices, are
    especially under threat as revealed in the analysis by the Ponemon Institute and
    IBM. The most severe example of this is the case of Singapore, when an attack
    on SingHealth exposed the data of more than 1.5 million patients. The aforementioned
    cyber threats present us with a unique conundrum.


    # 1.1.1.1 IoT Architecture


    Every IoT system implemented globally is different; however, the data process
    flow and general architecture have some similarity. The first element is “Things”;
    this entails the nodes/devices that sense data from the environment via embedded
    sensors and actuators and are connected to the internet via appropriate gateways.
    The second layer includes the data acquisition systems and gateways that are responsible
    for gathering large amounts of raw and processed data (filtration, amplification
    and other associated electronic signal conditioning), and convert it into a digital
    form that is ready for further analysis. The third layer is where data visualization
    and intelligent control steps in, through which the processed data is transferred
    for long-term storage to data centers and cloud-based facilities which form the
    fourth layer.'
  merge: -1
  img_proc: true
