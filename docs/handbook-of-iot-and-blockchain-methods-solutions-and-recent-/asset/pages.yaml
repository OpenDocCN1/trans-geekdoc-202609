    # 4.6 CHALLENGES


    # 4.6.1 DIGITIZATION


    Driving licenses can be put online in a cryptic form only to check validity and
    if there have been any challans in the past due to traffic violation. This would
    allow insurers to decide premium based on the driving history of the person. The
    problem with this solution is that all the driver’s license data is not available
    in one online database that is accessible and compatible with other databases.


    Firstly all data would have to be digitized with a collaborative architecture.
    This is an exercise that has been undertaken in many developed economies and efforts
    for this are under way in India as well.


    # 4.6.2 PROPERTY RECORDS COMPLETE


    Property records on blockchain would ensure that there is no amendment to land
    ownership without consent (and in some cases, corresponding payment to the seller).
    The problem with this approach is that it is only prospective. In order to be
    retrospective, the land records have to be clean in the first place. In the absence
    of this, the legacy data cannot be digitized on to blockchain. While this may
    seem very simple it is not so. Even some of the best States in Government of India’s
    Ease of Doing Business Ranking do not have even two years’ worth of property records
    and transactions digitized<sup>13</sup>. Property is fraught with disputes, some
    in civil courts and others in criminal courts. It is mortgaged, pledged and rented.
    There are cases subject to Wills, Gift Deeds and Sale Deeds. This leads to too
    many ownership disputes. If this is not free of errors and disputes, it cannot
    be put on the blockchain as they would then be immutable.


    # 4.6.3 NEED FOR SCALE


    The benefits will only arise once the entire platform is on the system. We need
    everyone to use it. Imagine using emails only to find out that you need to take
    a print of each communication, respond in writing and each response will then
    be digitized. It would not add any value, right? Similarly blockchain will add
    value if all processes are present on it. Therefore the need for scale is high
    to unlock value.


