  md: 'Fortunately, developers of Ethereum are aware of these issues and they are
    making some important changes. Let us consider the possible solutions:


    # i. Proof of Stake


    Ethereum blockchain uses a proof-of-work consensus approach. When working on a
    proof, miners must utilize extra computing power available to them to solve really
    complex puzzles. If you have a very powerful hardware device, you have the best
    chance of winning a mine bonus. Everyone tries to solve the puzzle at once, and
    finally the miner who solves it first will be the winner.


    Proof of Stake is a very different approach because not all the miners try to
    solve one problem at a time. Instead, they operate one after the other. They are
    selected at random. However, you need to use a certain number of ethers to choose
    from.


    The number of transactions they can reduce/check depends on the amount they decide.
    If a miner has a hundred ETH, he can deduct a hundred ETH worth of transactions
    in total. As per the scenario, this means that they can mine mines until the value
    of the transaction is reduced to the amount they have determined.


    The proof-of-stake approach brings various benefits to the Ethereum blockchain
    network. The first is an increase in energy efficiency. A proof-of-work network
    requires a lot of energy because miners all work on the same puzzles and waste
    their computing power. On the other hand, proof-of-stake works with a single system,
    which means that overall, very little energy is consumed.


    The future of Ethereum with a proof-of-stake approach also minimizes the risk
    of centralization. Moreover, proof-of-work allows different groups of miners to
    pool their available resources to improve their total mining reward odds. But
    the problem here is that a few people, especially those who control large pools
    of miners, have a lot of impact on the network. However, proof-of-use makes it
    very difficult to achieve.


    The Proof of Work by Ethereum Developers is called the “Casper Project” led by
    Vlad Zamfir.


    # ii. Plasma


    During August 2017, Vitalik Buterin announced the Plasma project for the very
    first time. This project is being developed initially to address the scalability
    issues which are being faced by Ethereum. Plasma is basically a protocol that
    actually eliminates the need for the Ethereum blockchain network to process unwanted
    data. This is done by creating a second level above the main block chain.


    Smart contracts can still be processed. However, they will be published on the
    blockchain once the deal is over. This significantly reduces the amount of processing
    the blockchain needs to validate transactions and also saves much disk space.'
