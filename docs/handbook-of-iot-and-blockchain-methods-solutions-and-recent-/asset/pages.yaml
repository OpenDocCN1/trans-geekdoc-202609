    # 2.6 SECURITY THREATS OF IOT


    The Internet of Things (IoT) delivers substantial advantages to end-users. However,
    it also brings new security challenges. Part of the central security issue is
    that connected devices share implicit trust. This shared trust between connected
    devices means the devices automatically transmit their information to every alternative
    straight away upon recognition while not initially running any malware detection
    tests. The worst-case eventualities of those IoT security dangers lead to physical
    harm or maybe the loss of life.


    Connected devices are creating pleasant experiences for consumers; however, they
    also represent current targets for hackers. The Internet of Things (IoT) and cyber-criminal
    activity share two vital traits: they are mostly invisible to the eye, and they
    surround us at any given moment.


    As additional organizations use a combination of sensors and complicated software
    system applications to create smart homes, smart workplace environments, and even
    smart cities, the results typically feel magic. Lights turn on after you enter
    a room. A piece of machinery proactively requests an upgrade to stop breaking
    down. A retail store automatically restocks a shelf before customers become annoyed
    over missing things. These are all ways in which the IoT makes technology omnipresent
    and seamless. Unfortunately, the foremeost prospering cybercriminals behave in
    an almost identical way. Hacking databases, attacking websites, and stealing passwords
    seldom involves a face-to-face encounter. Once technology becomes essential, the
    security problems associated with the technology tend to mount. Over time, these
    problems have transitioned from email to text messages, from desktop PCs to smartphone
    and currently to the IoT.


    The Internet of Things (IoT) may be a quickly growing phase of the internet. Whereas
    different parts of the internet are dependent on individuals exchanging data,
    IoT allows devices to gather data, transmit data and receive data. It is easier
    to think about IoT as similar to online, email or social networks; however, rather
    than connecting individuals, it connects smart machines.'
