    # 8.5 COMPARISONS AND RESULTS ANALYSIS


    In this section, all the potential defenses are summarized in Table 8.1 along
    with the statistics of comparisons among them. From the aforementioned Table,
    it is confirmed that the locking defense provides the best assurance for security
    issues in blockchain, followed by the obfuscation defense.


    Depending on their business strategy and budget, companies and industry firms
    can choose any one or multiple aforementioned techniques to protect the blockchain
    against different known and existing attacks.


    Symbols used in Table 8.1 meanings:


    +   - Yes means both detection and prevention possible.

    +   - Yes* means detect and prevent those Trojans inserted only after fabrication,
    but not those before fabrication.

    +   - No means cannot detect, also not prevent.

    +   - No* means only detection, but not prevention.


    # 8.5.1 DISCUSSION ABOUT CRITICAL INFRASTRUCTURES FOR SECURING BLOCKCHAIN


    Because all the aforementioned techniques have their own pros and cons, one proposed
    direction is to use each for the highest HT coverage. For example, an RE-based
    scheme can guarantee a golden blockchain required for test time and run-time golden
    blockchain models. Side-channel and functional testing approaches are able to
    detect large and small HTs respectively that were inserted during chip fabrication.
    Runtime approaches can finally conclude to work as a last scheme of defense.


    # 8.6 CONCLUSIONS


