- pgno: 53
  md: 'As the IoT continues to proliferate, there are guaranteed to be growing pains.
    Hardware can still advance and improve. The software system can become a lot more
    refined. New standards, protocols and connectivity choices can become much more
    prevalent. However, businesses should ensure that their new capabilities stay
