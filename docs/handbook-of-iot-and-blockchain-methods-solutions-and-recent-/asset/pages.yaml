  md: 'Stornetta tried to create a system to prevent tampering of time-stamped documents.
    However, blockchain finally came into existence in 2008 due to Satoshi Nakamoto''s
    white paper “Bitcoin: A Peer-to-Peer Electronic Cash System”. For implementing
    blockchain, we need to be familiar with its key attributes. Some of the prerequisites
    for blockchain development include knowledge of one or more object-oriented programming
    languages and basic understanding of topics like cryptography and data structures.
    We then discussed consensus algorithms and how they provide a mechanism to reach
    an agreement among nodes in the blockchain network. Now since blockchain is difficult
    to implement from scratch and even more difficult to test due to the requirement
    of blockchain accounts and currencies, we can use tools and platforms which ease
    the process of blockchain development.


    After discussing blockchain in detail we discussed Ethereum, its future and technologies
    associated with it. Ethereum was launched in 2015 and is a blockchain open-source
    software platform that uses its own cryptocurrency ether. It enables the creation
    and implementation of Smart Contracts and Distributed Applications (“Dapps”) without
    time consuming, fraud, scrutiny or third-party intrusion. Ethereum is not just
    a platform, but a programming language (Turing Complete) that works on the blockchain,
    helping developers to create and publish distributed applications. In Ethereum
    transactions are based on smart contracts which are like normal contracts but
    are also autonomous in nature. These transactions are executed in Ethereum Virtual
    Machine or EVM just like Java-JVM. Each machine in the network or internet on
    which EVM instance is active and listening to method calls is known as node. Every
    transaction request is mined on all nodes. This virtually makes the Ethereum network
    a distributed supercomputer. The smart contracts which are used in Ethereum are
    generally written in solidity language. Smart contracts can be created using Golang,
    Lisk, etc. A Smart contract is essentially a protocol to digitally facilitate,
    verify and enforce the negotiation or performance of a contract.


