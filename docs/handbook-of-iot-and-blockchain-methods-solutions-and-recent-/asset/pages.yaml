  md: 'If a blockchain network implements a Proof-of-Work (PoW) consensus mechanism,
    then it should have the proper security measures to avoid a 51% attack to be carried
    out. A few viable options are to be vigilant of mining pools, implementation of
    merged mining on a blockchain network with a higher hash rate, or utilizing a
    different consensus mechanism.


    # 8.3.15 Race Attack


    When a hacker sends two conflicting transactions in succession rapidly into the
    bitcoin network, this is known as race attack. This attack is comparatively easy
    to accomplish in blockchains which have utilized PoW as consensus algorithm. The
    dealer who receives payment instantly with ''0/unconfirmed'' status is vulnerable
    to reversal of transaction. An attacker performs a transaction by sending coins
    to the dealer directly, however, he will not wait for confirmation from the dealer
    and instantly sends a conflicting transaction (with the same coin used before
    for the dealer) to himself to the rest of the blockchain network. It is more likely
    that the conflicting transaction which happened later will be mined into a block
    and accepted by bitcoin nodes as valid node.


    # 8.3.16 Finney Attack


    An attacker first finds a dealer who accepts unconfirmed transactions. Then he
    performs a transaction to himself with the same amount to be sent to the dealer
    and find the block; however, he does not broadcast the block. Once the above step
    is completed the attacker will send the same amount to the dealer and wait till
    the item gets delivered. Finally, he broadcasts his previous block with the original
    transaction in it. This block will include the transaction that sent the coins
    to himself, hence the unconfirmed payment to the dealer will be invalidated. Moreover,
    the attacker will regain his coins and also the item for free.


    # 8.3.17 Vector76 Attack


    Vector76 attack otherwise known as one-confirmation attack. This attack is an
    amalgamation of the race attack and the Finney attack such that a transaction
    that even has one confirmation is still reversible. It is one of the variations
    of the double-spending attack. The attacker performs double spending by using
    the privately mined block during exchange. The wallet service such as exchange
    of cryptocurrency is vulnerable to this attack because of the acceptance of direct
    connections. If the Vector76 attack is successful then the attacker has to sacrifice
    one block because by not broadcasting it and only by broadcasting the attacked
    node.


    # 8.3.18 Alternative History Attack


    This attack occurs when an attacker initiates a transaction by sending coins to
    the dealer. Concurrently, the attacker will mine an alternative block privately
    which includes a conflicting double-spending transaction. The dealer will deliver
    the item to'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'the attacker after waiting for m confirmations. Right away, if the attacker
    finds more than m blocks untie his chain and gets his coins back again; If not,
    he keeps trying to continue extending his chain of blocks with the hope of being
    able to catch up with the network. When the attacker is not ever able to extend
    his private blockchain compared to the public blockchain, then the attack fails.


    # 8.3.19 Selfish Mining Attack


    A selfish mining attack happens when an attacker (selfish miner in this case),
    does not broadcast a valid solution to the rest of the network. Rather than act
    like a regular miner and publish blocks to the network instantly after finding
    them, the attacker selectively releases blocks, or publishes many blocks all at
    once thus forcing the rest of the network to discard their blocks and lose revenue.
    The primary motives of selfish mining are to obtain an unfair reward which is
    bigger than their share of computer power spent, and confuse other honest miners
    and lead them to waste their resources in the wrong direction as shown in the
    Figure 8.8.


    # 8.3.20 System Hacking


    It is relatively hard to hack and tamper the records stored in a blockchain; however,
    the programming codes and systems that implement its technology can be vulnerable.
    The largest Tokyo-based bitcoin exchange, i.e., MtGox, was hacked in March 2014,
    and bitcoins worth $700 million were stolen. The reason behind this attack was
    ill-maintained and outdated codes which allowed hackers to perform double-spend.
    More recently, a DAO (Decentralized Autonomous Organization) that holds large
    quantities of Ethereum was exploited through a software vulnerability and the
    hacker stole $50 million worth of Ethereum [19].


    ![](img/cd1801130f8a9057bd2f396e8025ba69_157_0.png)


    FIGURE 8.8 Selfish Mining Attack Simplified.'
