  md: '![](img/cd1801130f8a9057bd2f396e8025ba69_54_0.png)


    # 2.6.1 Vulnerability


    The most basic and easy-to-pick threat to IoT devices is their vulnerability.
    Corporations providing IoT solutions begin with addressing this issue initially
    before looking at the underlying software system. We are also compelled to perceive
    that vulnerability is often of two types: hardware and software. Hardware vulnerability
    is commonly hard to discover or penetrate. However, it is even harder to repair
    or overhaul the injury. Software vulnerability points toward a poorly written
    algorithmic program or a line of code with a backdoor. This backdoor will simply
    give access to intruders prying for such opportunities.


    # 2.6.2 Easy Exposure


    This can be one of the most basic problems faced by the IoT business. Any device,
    if unattended or exposed to troublemakers, is an open invitation to discomfort.
    In most cases, IoT devices are not flexible to third-party exposure; they either
    expose or are simply accessible to anyone.'
