  md: '+   - Claim report

    +   - Damage report

    +   - Internal processing

    +   - Bill submission by mechanic

    +   - Verification

    +   - Payment


    For each claim, the company wants to assess


    +   - Whether the same car was insured

    +   - Whether the driver had a valid driver''s license

    +   - Whether the documents of the car are in order

    +   - Whether a police report, if needed, had been filed

    +   - Whether this damage existed before the insurance period

    +   - Whether this damage existed after the insurance period

    +   - Whether an independent party has seen the claim⁵

    +   - Whether the correct claim has been filed by the mechanic

    +   - Whether the part that had to be repaired was replaced or repaired

    +   - Whether the prices of the parts are as per notified prices

    +   - Whether the bills are for the right car

    +   - Whether the dates on the bills and those on the claim match


    Assessing all these basic things requires matching and verifying documents. This
    is subject to human error and malicious intent in some cases, to counter which
    it happens at multiple levels. While these checks seem simple, they are not so.
    Also, the number of claims processed by an insurance company is too huge for it
    to be done efficiently. There are anecdotes that a public sector general insurance
    company took over three days to verify that the vehicle for which a claim was
    made was in fact covered by the company.


    In case this data were available in a digitized format, verification could be
    coded and conducted effortlessly. On blockchain, this could be immutable and distributed,
    which would ensure transparency.


    # ## 4.3.6 SUPPLY CHAIN


    When goods are moved from the producer to the user, or when high-value items are
    resold, one major concern is their genuineness. Organic fruits and vegetables
    command a premium. The resale value of a Rolex is very high. Wine from certain
    vineyards is valued more. How can the end-user be assured of the origin of these
    products? Blockchain is being considered as a major solution.


    If at each stage of processing or change in ownership through agents and transporters,
    the data is fed on to a blockchain, the end-user can simply scan the product and
    verify the origins. This would require the producer to enter all relevant details
    of the product on the blockchain and affix a code or engrave a microcode on the
    product that can be scanned and the information would be made public. This makes
    blockchain a good application wherever counterfeit goods are a problem. This'
  merge: -1
