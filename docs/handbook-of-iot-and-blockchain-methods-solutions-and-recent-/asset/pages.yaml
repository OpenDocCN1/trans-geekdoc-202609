  md: 'Scalability pertaining to the number of validator nodes is another challenge
    that comes with BFT-based protocols as the testing mechanism is not usually implemented
    post 20 nodes [19]. This shortcoming can be overcome by executing Algorand [20]
    that implements a system of random selection of a small-sized committee for every
    step of the consensus protocol to address scalability. This random selection is
    done through the mechanism of Verifiable Random Functions (VRF). Committee size
    is contingent on two constraints in Algorand:


    +   i. 1/2g + b ≤ Tstep.τstep

    +   ii. g > Tstep.τstep


    Where


    +   g = number of honest committee members;

    +   b = number of malicious committee members;

    +   T = number of votes required for consensus;

    +   τ = expected committee size.


    Furthermore, BFT-based consensus protocols are proficient in obscuring non-deterministic
    faults that eventuate at f=(n–1)/3 replicas, where


    +   f = number of faulty nodes

    +   n = number of total nodes


    Proof of Work (PoW) and BFT-based consensus protocols differ largely on the basis
    of availability which is an important necessity in IoT systems. On one hand where
    PoW does not determine whether a certain unresolved transaction will be present
    in the next bloc or not, PBFT on the other turns out to be particularly exorbitant
    when it comes to message complexity. Hence the sustainability of a huge number
    of IoT systems should be the focus of any future solution that is based on blockchain
    and should also be in accordance with the wireless communication rules of the
