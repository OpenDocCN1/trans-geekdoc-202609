    +   2. Proof of Elapsed Time: PoET is one of the best and fairest consensus algorithms
    that is used with a permissioned blockchain network to find out the next miner.
    In this technique, every node is equally likely to be the next miner. All participating
    entities are required to wait for a random amount of time. This random wait time
    is generated by every node. The node which wakes up first after being in sleep
    mode (i.e., shortest wait time) for this designated time is chosen as the next
    miner. This miner add a new block to the blockchain and transmits the necessary
    information across the network.


    +   3. Proof of Stake: This algorithm is an alternative to PoW. Instead of checking
    which node has more computational power to solve a problem, it works on stake.
    Stake here is the amount of currency a miner is willing to lock up for a certain
    amount of time. All the nodes of the network verify the blocks by placing a bet
    on it if they think that a certain block should be added to the chain. The nodes
    get rewards proportionate to their bets and their stakes increase accordingly.
