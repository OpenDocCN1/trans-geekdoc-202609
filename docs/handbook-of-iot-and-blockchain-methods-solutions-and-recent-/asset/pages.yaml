    This situation is exacerbated in the absence of audit and verification mechanisms,
    particularly in the case of systems handling sensitive information such as but
    not limited to financial and economic transactions. The problem of double spending
    is solved by enabling blockchain technology in a peer-to-peer network where there
    is an absence of a trust-based system. Blockchain enables verification of transactions
    by a group of unreliable actors. This aims to provide an immutable, distributed,
    secure, transparent and auditable ledger. The chain may be accessed openly allowing
    access to all transactions since the genesis transaction of the system. The protocol
    structures a chain of blocks that are linked to its previous block by a reference,
    thus forming a chain. Figure 1.2 describes the blockchain mechanism along with
    the use of a reference hash.


    In order to support and operate the blockchain, network peers provide functionality
    which can include functions such as storage, wallet, and service and mining. Based
    on their functionality they can be part of different networks. Table 1.2 compares
    common types of nodes in bitcoin networks. Further, it does so establishing a
    consensus-based mechanism in which the nodes vote via their CPU power on the computation
    of a proof of work in the form of a hash for a given block which is based on the
    work that came previously.


    # 1.1.3 GENERATIONS OF BLOCKCHAIN


    Currently we are witnessing a critical shift toward distributed applications.
    This enables decentralized data sharing via secure transactions. This section
