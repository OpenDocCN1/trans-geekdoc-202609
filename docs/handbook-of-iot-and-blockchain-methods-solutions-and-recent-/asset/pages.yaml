    +   The first block in the chain is called the Genesis block. Each new block in
    the chain is linked to the previous block.


    # 7.8.3.1 Understanding SHA256 Hash


    A block also has a hash. This can be understood as a fingerprint which is unique
    to each block. It identifies a block and all of its contents, and it is always
    unique, just like a fingerprint. So once a block is created, any change inside
    the block will cause the hash to change.'
