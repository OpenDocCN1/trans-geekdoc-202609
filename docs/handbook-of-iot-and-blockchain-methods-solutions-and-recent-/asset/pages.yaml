    or zero to improve the quality of processing the data. The major challenges that
    need to be overcome here are less accessibility, less convergence and limitations
    in speed. With keyword-based matching algorithms [3] fast access and accurate
    service estimation was available; it also had pros as utilization of data demand
    patterns in different regions and time windows, and had the capacity to monitor
    EO data services from different geolocations. It had introduced the cloud-computing
    capabilities to facilitate EO data access and also optimized the cloud-computing
    data framework with spatiotemporal data access patterns. The cons of this method
    are that it needs deep learning technologies to improve access pattern prediction
    capabilities, had limitations in memory and resource allocation, more complex
    to cloud-computing infrastructures and the selection of appropriate cloud-computing
    services has become a barrier to cloud adoption in EO big data science. Moreover,
    in the case of the time-aware task scheduling algorithm [4] there was maximization
    in green energy usage and minimization in grid energy cost; it used all the wind
    power to transfer bulk data at each time slot and had reduction in energy cost.
    The major drawbacks were that it only focused on work load scheduling in a single
    green datacenter, and it had a more complicated scheduling and needs an optimal
    routing and bandwidth allocation for each task. Then, with the agglomerative clustering
    algorithms and density-based clustering algorithm [5] there was maximization in
    plug-in fitness function that captured the notion of interestingness of clusters,
    generic neighboring relationships increased the number of merging candidates;
    it had provided powerful region discovery capabilities and had demonstrated the
    capabilities of GAC-GEO in real-world case studies involving an earthquake dataset.
    It had drawbacks such as; with the round-robin approaches there was no improvement
    in fitness function, the selection of parameters were made without backtracking,
    it had no capability to identify arbitrarily shaped clusters, it had had high
    variance and high correlation with respect to non-spatial attribute(s). Furthermore,
    in the case of Swarm and artificial immune system-based intelligence techniques
    [6] it had advantages such as better classification of images, good quality of
    geospatial feature extraction and the spectral signature of each category is calculated
    using the training data. It had drawbacks such as high computational complexity
    and had no capacity to cover the land cover feature. Moreover with the Affinity
    propagation (AP) algorithm [7] there were advantages with GPU for spatial cluster
    analysis; it had the capacity to track the data that does not lie in a continuous
    space and had handled big data in an accurate way. It had challenges as low scalability,
    memory constraints, AP does not specify a predefined arbitrary number of clusters
    in advance so that dynamic scheduling was made and it also does not satisfy the
    triangle inequality. Moreover, with the K-means clustering algorithm [8] there
    was reduction in the latency period and it had increased throughput, it had adequate
    storage for data visualization and analysis, it had the capacity of local processing
    that had led to the reduction in data size, lower latency, high throughput, and
    power-efficient systems. All these were features of this algorithm and it had
    challenges in the case of cloud computing as it was not reserved for long-term
    analysis and it required efficient big data analysis and processing. In order
    to overcome all these challenges, there is a necessity to propose an optimal solution
    for geospatial big data processing.
