    # 7.8 INTRODUCTION OF BLOCKCHAIN


    # 7.8.1 WHAT IS BLOCKCHAIN?


    A blockchain is a record of transactions. The name comes from its structure, in
    which individual records, called blocks, are linked together in a single list,
    called a chain. Blockchains are used for recording transactions made with cryptocurrencies,
    and have many other applications.


    Each transaction added to a blockchain is validated by multiple computers. These
    systems, which are configured to monitor specific types of blockchain transactions,
    form a network. They work together to ensure that each transaction is valid before
    it is added to the blockchain. This decentralization of computers ensures a single
    system cannot add invalid blocks to the chain.'
