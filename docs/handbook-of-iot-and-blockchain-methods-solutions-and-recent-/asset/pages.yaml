    [14]. RE is rigorously applied to disassemble a device in different ways such
    as cloning, duplicating, and reproduction. In this subsection, the RE of blockchain
    systems is acquired by extracting their internal physical structures and information
    using destructive techniques for secret information detection by foreign attackers.


