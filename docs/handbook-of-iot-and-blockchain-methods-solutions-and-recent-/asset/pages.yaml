    # 7.8.3 GENESIS BLOCK


    +   A blockchain is a chain of blocks which contain information. The data which
    is stored inside a block depends on the type of blockchain.


    +   For example, A bitcoin block contains information about the sender, receiver,
    and number of bitcoins to be transferred.


    Blockchain is chain of Blocks that contains Data


