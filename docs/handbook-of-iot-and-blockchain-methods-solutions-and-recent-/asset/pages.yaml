    # ## 8.2 RELATED WORK ON BITCOIN SCALABILITY TRADE-OFF


    Scalability is the strength of a system, process, or network to handle an increasing
    number of tasks with time, or its potential to be enhanced to adjust to that growth.
    For example, a network is considered scalable if it is capable of growing its
    total output when load is increased and resources such as hardware are merged
    with the system. Scalability is a substantial factor in computer systems, for
    example, databases, networking, and routers.


    Bitcoin scalability trade-off refers to the discussion regarding the constraints
    on the number of transactions a bitcoin network can handle to process and execute
    successfully. It is related to the fact that records (known as blocks) in the
    bitcoin blockchain are limited in size and frequency. Blocks of bitcoin contain
    the transactions on the bitcoin network. The on chain transaction processing capacity
    of the bitcoin network is limited by the average block creation time of ten minutes
    and the block size limit. These jointly constrain the throughput of network. The
    transaction processing capacity maximum is estimated between 3.3 and 7 transactions
    per second. There are various proposed and activated solutions to address this
    issue efficiently.


    Enhancing the transaction processing limit of a network demands various improvements
    to the technical principles of bitcoin, in a process known as a fork. Forks can
    be classified into two types: soft fork and hard fork.


    # ### 8.2.1 SOFT FORK


    A soft fork is any change of rules that enable recognition of newly produced blocks
    as valid by the old software. Thus it is backward-compatible. A soft fork is also
    able to split the blockchain when newly generated blocks not considered valid
    by the non-upgraded software and the new rules.


    # ### 8.2.2 HARD FORK


    In contrast to a soft fork, a hard fork is a software upgrade introducing new
    rules to the network, thus abolishing the old software that is not able to recognize
    new blocks as valid [3]. In case of a hard fork, all nodes meant to work in accordance
    with the new rules need to update their software.


    If one group of nodes continues to follow the non-upgraded old software while
    the other group of nodes uses the new updated software, a split will take place.
    For'
