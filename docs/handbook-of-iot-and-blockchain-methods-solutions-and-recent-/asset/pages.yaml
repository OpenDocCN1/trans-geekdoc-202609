  img_proc: true
- pgno: 87
  md: 'Any error or malfeasance on part of someone with access to ownership records
    can lead to a lot of monetary loss and frustration. It is not easily possible
    to trace these changes to correct these. Title suits can take years to get resolved
    and in the interim period the property is useless.


    If the two processes could be linked in a secure and verifiable way, it would
    solve a lot of problems. While some states have tried to link land registry through
    digitization and making the records open, blockchain can add a layer of security
    for land owners.


    # 4.3.4 HEALTHCARE


    Having and maintaining medical records is beneficial for patients. They help doctors
    diagnose things better and prescribe a smoother medical route. It would lead to
    fewer experiments (by knowing what the patient has already gone through). Tracking
    of blood pressure and heart rate in our phones can provide a snapshot of the patient''s
    wellbeing to a trained doctor. Family history would allow a doctor to target tests
    better and to monitor progress.


    Accumulation of these benefits is prevented by privacy concerns associated with
    Electronic Medical Records. Health data is used by companies for designing solutions
    and to study the impact of interventions vis-à-vis a control group.


    Data can be used for marketing new drugs to people which is at the boundary of
    ethically accepted practices. This data can also be used to malign someone or
    to prevent them from taking up public office. Because of all these use cases and
    concerns regarding medical data its cost on the black market is very high. Anecdotal
    evidence suggests that medical data is thousands of times costlier than credit
    card data. This reflects a clear gap in the market. If there were a secure way
    for people to share anonymized data in exchange for money or credit (that can
    be used on the platform, in the form of tokens) it could be a win-win situation.


    De-identification of data is a key component. Blockchain would ensure anonymity
    and control. The patient can decide who can view what component of the report
    and whether the updated content would be accessible. Cryptocurrency can ensure
    that people who consent get paid for sharing it.


    # 4.3.5 INSURANCE


    Insurance is one industry that requires a lot of documentation and verification.
    This is done multiple times. Insurance companies go to great lengths to ensure
    that they are paying the right person with the right set of documents for a covered
    event that happened during the insured period. All this verification takes time
    and effort. Efforts duplicated at different levels to ensure there is no wrong-doing
    on the part of the insured, inspector, processing staff and others.


    Car insurance typically involves the following steps:


    +   • Insurance cover

    +   • Event which in this case is an accident

    +   • Claim

    +   • Claim verification'
