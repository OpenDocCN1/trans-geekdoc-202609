- pgno: 7
  md: '# # Preface


    Blockchain technology is receiving growing attention from various organizations
    and researchers as it provides magical solutions to the problems associated with
    classical centralized architecture. Blockchain, whether public or private, is
    a distributed ledger with the capability of maintaining the integrity of transactions
    by decentralizing the ledger among participating users.


    On the other hand, the Internet of Things (IoT) represents a revolution of the
    internet which can connect nearly all environment devices over the internet to
    share their data to create novel services and applications for improving our quality
    of life. Although the centralized IoT system provides countless benefits, it raises
    several challenges. Resolving these challenges can be done by integrating IoT
    with blockchain technology.


    This book will provide an overview of IoT and Blockchain concepts, IoT Solutions
    with Blockchain in the current business scenario and many more.'
  merge: -1
  img_proc: true
