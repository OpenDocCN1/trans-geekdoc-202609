    latency in it. An important point to be noted is that latency is an intrinsic
    characteristic of the blockchain technology but in traffic and road situations,
    real- time information is of paramount significance for nodes connected to a VaNeT.


    # 1.4.5 SECURITY AND PRIVACY OF DATA


    Nathan and Zyskind [27] propose a data management prototype for a distributed
    network that provides protection and safeguard measures on problems related to
    data proprietorship, transparency and auditability. Ethos is a bitcoin-based system
    for transmission of personal information manufactured by Viral Communications,
    MIT Media Lab [28]. Ethos’s compatibility for its use in IoT systems is something
    that presently still needs evaluation. A distributed computational protocol named
    Enigma has also been developed with the purpose of preserving privacy [29]. Enigma
    further allows very limited access to the entire data by its nodes through the
    deployment of a multi-entity computation that has a secret-sharing validation
    protocol. This type of system has the added advantage of decentralized storage
    and reduced memory necessity for embedded devices.


    For its efficacious execution in IoT systems, Enigma still necessitates analyses
    for the overhead transmission and computation. It is important that any solution
    for decentralized computation and safe data transmission are in accordance with
    the respective country’s law for wireless communication since most of the IoT
    devices transmit through wireless media only. Even though such decentralized computational
    schemes seem quite efficacious, their productivity with respect to bandwidth efficiency
    still requires evaluation. In conclusion, any future data transmission and sharing
    systems based on blockchain should keep in mind these shortcomings.


    # 1.5 CONCLUSION AND FUTURE SCOPE OF WORK


    Technologies such as blockchain have disrupted the entire fintech market and even
    though it has created a lot of controversies, the technology is going to get more
