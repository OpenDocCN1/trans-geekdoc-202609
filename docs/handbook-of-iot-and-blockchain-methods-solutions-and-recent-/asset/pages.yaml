    # 2.1 INTRODUCTION


    Healthcare changes dramatically as a result of technological developments, from
    anesthetics and antibiotics to magnetic resonance imaging scanners and radiation
    therapy. Future technological innovation is going to keep remodeling healthcare,
    however, whereas technologies (new drugs and treatments, new devices, new social
    media support for healthcare, etc) can drive innovation, human factors can remain
    one of the persistent limitations of breakthrough. No predictions will satisfy
    everyone. There are no two ways regarding healthcare; technological developments
    in healthcare have saved innumerable patients and are continuously raising our
    quality of life. Not solely that, however; technology within the medical field
    has had a huge impact on nearly all processes and practices of healthcare professionals.


    Advancements in medical technology have allowed physicians to better diagnose
    and treat their patients since the start of the professional practice of medicine.
    Because of the continual development of technology within the medical field, many
    lives are saved and also overall quality of life continues to increase over time.
    Although medical culture is comparable, there are dramatic technological changes,
    and truly, these changes would be exhausting to explain. Does anybody even know
    how an infusion pump works? They used to be clockwork and currently nearly everything
    contains a computer and includes a color screen and plenty of buttons. Implanted
    defibrillators that use telephone networks and internet sites to keep cardiologists
    up thus far with their patients are simply magic. New pharmaceuticals that change
    moods, change'
