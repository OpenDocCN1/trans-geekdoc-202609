    # 4.1 WHAT ARE WE TRYING TO SOLVE?


    Blockchain is a distributed immutable ledger that is encrypted. It is immutable
    for two reasons: time stamp and the encryption of preceding content. This looks
    simple enough. On face value, this does not solve much. Google sheets can be tweaked
    to become an immutable ledger with open access. We only need to find a way to
    introduce one-way encryption so that only the owner of the original node knows
    the verification.


    It is surprising how hard it is to find all these in one system. Decentralization
    has been made possible in the past decade due to better internet penetration.
    Earlier, it would not be accessed in real time. Encryption has become very important
    in the past few decades and privacy is being equated with a fundamental right.
    People would not want someone to know their health records, their expenses, their
    purchases and so on. Some western jurisdictions have taken a very strong stance
    toward privacy and penalized corporates for their lapse.


    Cambridge Analytica was a famous scandal highlighted in the light of the US Elections
    in 2016 where data from Facebook and other sources was used to target advertising
    in a way that it is said to have affected the outcome of the elections.


    Opportunity flows from needs. Privacy is a need and cryptography is a solution.
    To recall, cryptography is one-way encryption. This means that all areas where
    privacy is required are places where blockchain has a natural application. Similarly,
    any place where ledgers are involved would have an application of blockchain.
    These cases might or might not require encryption. Immutability provides trust
    to any transaction. A buyer does not have to trust the seller (and with encryption,
    the buyer does not even need to know the seller). Transparency is needed wherever
    there is money involved and when the rest of the process is not in the hands of
    the initiator.


    From this we deduce that health, finance, real-estate and governance can unlock
    value through implementation of blockchain.


    Blockchain is at the back end in any process and no one gets (or needs) to see
    it. To understand this better, turn to WhatsApp. When you send a message to a
    new person you get a message saying that all messages are encrypted. This does
    not mean that the person at the other end cannot understand your message. It means
    that during transmission it is encrypted. Communication between the receiver and
    sender is not different, it is only the journey through the medium that is encrypted.
    Similarly, in the case of blockchain, the components and user interface are not
    affected by this. Just the log of all transactions is maintained on the blockchain
    and one can be assured of privacy.


    # 4.2 SOME USEFUL DISTINCTIONS


    # 4.2.1 DIFFERENCE BETWEEN BLOCKCHAIN AND CRYPTOCURRENCY


    One is to put things in an immutable way, the other is to have that as currency.
    Cryptocurrency, as we know it, is currency that is based on the blockchain.'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'These can be understood as concentric circles where cryptocurrency is a token
    based on blockchain.


    # 4.2.2 PUBLIC VERSUS PRIVATE


    A public blockchain is one in which anyone can participate in any capacity whereas
    in a private blockchain the owner of the blockchain defines who all can participate
    and in what capacity. This means private blockchains are ‘permissioned’ blockchains
    where only participants selected by the owner of the blockchain can verify the
    information.


    Since public blockchains involve anonymity, most of the blockchain solutions that
    are being developed for internal use by corporates would be private blockchains.
    Solutions for governance would have a combination of both where some data is available
    to the public and some other data is accessible based on permissions.


    # 4.3 POSSIBLE APPLICATIONS


    # 4.3.1 FINANCE


    Since blockchain shot to fame with the bull run of bitcoin, the first application
    of blockchain is that of payments.


    # 4.3.1.1 Know Your Customer


    According to the Report of Steering Committee on Fintech1 putting Know Your Customer
    (KYC) and Anti-Money Laundering (AML) systems on blockchain would reduce costs
    and effort by banks to comply with these requirements.


    Similarly bill discounting could be made a lot easier. If a manufacturer has a
    work order, they could put it on the platform and a bank could verify the work
    order and discount the bill, providing finance to the manufacturer. In case of
    default the record of the buyer would reflect this and would be for all to verify.
    These records would also allow people to have a credit history, which is valuable
    for lending institutes.


    # 4.3.1.2 Cross-Border Transfer


    If you want to transfer money to a relative in another country, the payment is
    routed through multiple banks and intermediaries that receive, collate, net-off
    and transfer the money. This leads to a long time and consequently high cost in
    such a transfer. Application of blockchain in these cases would lead to intra-day
    and inter-bank liquidity. Use of digital tokens would further expedite the payment
    process but this assumes cryptocurrency (and not just blockchain). Some banks
    have worked with Ripple to explore inter-bank-cross-border transactions. Ripple
    is a cryptocurrency that reduces settlement times to less than a few minutes from
    a couple of days.


    # 4.3.1.3 Securities Transactions


    Stock market trading is famous for T+2 settlement and T+0 settlement. T+2 means
    it takes securities two days after the day of trade to reach the account of the
    buyer. Similar T+0 means the securities are transferred to the account of the
    buyer on the'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'same date. T+0 is available mostly in cases where the buyer has a bank account
    with the intermediary. This way the monetary transaction and the reverse securities
    transaction are done by the same intermediary for the same person. This cuts down
    on the KYC time. Application of blockchain would radically decrease settlement
    time for securities.


    # 4.3.1.4 International Trade


    Payments in international trade are the most important because of lack of trust
    between traders. Banks through ‘Letters of Credit’ (LC) bridge this gap to an
    extent. The Punjab National Bank Scam² involving Nirav Modi highlighted the lack
    of reliability of these LCs. Blockchain is a secure and fast way of ensuring that
    the issuing bank and the honoring bank would know about the intent and actions
    of relevant members.


    # 4.3.2 Smart Contracts


    A smart contract is a way by which conditions are fed to a machine and money is
    blocked therein. When the coded event occurs, payment is automatically transferred.
    This is similar to what PayPal was for e-commerce. Since all this is on a blockchain,
    there is little doubt about the payment. An external and independent source confirms
    the occurrence of the event. This source is called Oracle. A service that tracks
    flights is an Oracle in case of flight insurance. Similarly, the Met³ declares
    certain districts as flood affected or drought affected. In case of crop insurance
    this could be used to trigger compensatory payments by the government.


    In case of sports betting, the payment risk is assumed by the broker. If someone
    were to use ESPN or another sports application as an Oracle, then all wagers could
    be coded as smart contracts and counter-party risk would be assayed.


    The scope for blockchain implementation in this is huge. Contract-related litigation
    is a huge component of Ease of Doing Business in any jurisdiction. Contracts have
    two sides, performance and payment. If either or both of those can be secured
    then the other can be tamed. In case of smart contracts, the payment is blocked
    and the performance is evidenced by an Oracle. This would lead to fewer disputes
    causing more and better trade.


    Litigation, non-execution, non-payment. If we guarantee one side then the other
    would be solved automatically.


    # 4.3.3 PROPERTY


    Property Records are the most precious possession of most citizens. Any error
    in these could lead to revocation of property rights, problems in insurance claims
    and at time of sale/hypothecation. There is only one ownership record for all
    properties, and that is with the government. The process of change in ownership
    of property through sale/purchase/mortgage and the process of change in records
    are each carried out in different offices and come under different departments
    in certain cases. While property sale/purchase is a revenue item, that of land
    ownership is a record item. This divorce further adds to incorrect and incomplete
    updating of records.'
