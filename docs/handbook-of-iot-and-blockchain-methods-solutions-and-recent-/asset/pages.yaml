  md: '# ## 9.7 HOW TO BUILD TRUST IN IOT


    To build trust in IoT environment we have to ensure the following:


    # ### 9.7.1 ENABLE DEVICE AUTHENTICATION


    To ensure secure participation in the Internet of Things, each and every connected
    device needs a unique identification in the network. We have a number of methods
    to prove an identity to the IoT devices such as passwords, biometrics, digital
    certificates etc. However, when we focus on providing the secure ID the choice
    of device depends on the capabilities of the device [9].


    In environments where our main point of consideration is only security and safety,
    a hardware-based authentication provides the best means to establish and maintain
