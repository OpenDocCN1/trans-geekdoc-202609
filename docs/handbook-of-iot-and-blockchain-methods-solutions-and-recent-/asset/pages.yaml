    # 9.1 INTERNET OF THINGS (IOT) SECURITY TECHNOLOGIES


    Creating a security framework [6] in IoT is purely problem specific i.e. depending
    on the case a specific security measure may be taken for improving security in
    IoT and to fix the shortcomings. Based on usage, it is possible to differentiate
    six main directions of security solutions for IoT.


    In general among the greatest of the Internet of Things security issues, scientists
    suggest the following points are maximal in maintaining security. These issues
    include authentication problems, lack of proper data encryptions and security
    analytics, vulnerability of networks, and problems with the application program
    interface. The best part of security management is that these issues are successfully
    handled by the IoT experts to make it more user friendly and reliable, and each
    of them has a specific approach in terms of IoT security.


    # 9.2 IOT SECURITY FOR NETWORKS


    The best approach to creating a safe network with the collaboration of IoT is
    to connect it to a pre-installed backend system while maintaining security. To
    achieve the highest level of sophistication in the environment we combine traditional
    approaches of data protection such as antivirus and firewalls with protocols,
    standards, and complex device capabilities for specified uses.'
