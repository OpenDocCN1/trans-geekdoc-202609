    region discovery.


    In 2017, Goel et al. [6] presented a dual algorithm; one was a hybridized version
    of two nature-inspired algorithms such as the Bat algorithm and Charged System
    for the purpose of better classification of the images and the second algorithm
    was the Clonal Selection Algorithm for Search for the purpose of feature extraction
    of geospatial big data as the geospatial feature extraction was crucial for remote
    sensing. Furthermore, the data set became more complex because of the usage of
    multispectral satellite images; this complexity further increased the number of
    dimensions for the classification problem. Moreover, this suggested that the proposed
    nature-inspired algorithm was good at classification of the land covers of satellite
    images. The evaluation of the efficiency of the proposed algorithms was made with
    the dataset of multispectral satellite images in order to prove that the proposed
    algorithm was better than the existing one.


    In 2017, Shi et al. [7] suggested the affinity propagation (AP) algorithm as a
    novel machine learning algorithm for the purpose of classification of geospatial
    images related to the earth observations. The AP had a restriction access in handling
    large data. Moreover, the serial computer program took a long time to complete
    the AP calculation. Therefore multi-core and many-core computer architectures
    were accompanied by application accelerators by parallel combination of developing
    tasks and data levels; this was done for the purpose of guaranteeing and achieving
    scalable geocomputation. Moreover, for spatial cluster analysis, this AP algorithm
    was parallelized with the processing unit (GPU). This parallelization produced
    an optimal solution for the issues of big geospatial data processing and its broader
    impact for the GI Science community.


    In 2018, Barik et al. [8] proposed a mist computing-based framework for the purpose
    of data mining and analyzing of the geospatial big data. The prototype here was
    built by utilizing the Raspberry Pi, an embedded microprocessor. The testimony
    of the developed MistGIS framework was carried by the preliminary analysis including
    K-means clustering and overlay analysis. The outcomes proved that mist computing
    had the capacity to assist fog and cloud computing and it too guaranteed the analysis
    of big data in geospatial applications.


    # 10.3 PROBLEM DEFINITION


    The literature has come out with several techniques for the EO based on geospatial
    data processing as shown in Table 10.1. However, they require more improvements
    because of lack of several features in data processing. Geo-reCAPTCHA [1] had
    generated geographic information from earth observation data and had the eligibility
    to distinguish between a human and a machine in case of data processing. It had
    reduced spam and viruses. The major drawbacks here were high data errors, low
    reliability and low quality. Moreover in a few cases it is very difficult to read
    data from clusters and requires more time to decipher. In case of the space-time
    prism model [2], common ontological problems were solved by template solutions.
    It had less spatial autocorrelation that essentially quantified the correlation
    parameters within'
