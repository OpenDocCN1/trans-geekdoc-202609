  md: '# 10 Geospatial Data Classification using Sequential Pattern Mining with Modified
    Deep Learning Architecture


    Sunil Kumar Sahoo and Brojo Kishore Mishra


    GIET University, Gunupur, India


    # CONTENTS


    +   10.1 Introduction .................................................... 165

    +   10.2 Related Works .................................................... 166

    +   10.3 Problem Definition ................................................ 168

    +   10.4 Methodology ....................................................... 171

    +   10.5 Expected Outcome .................................................. 172


    # 10.1 INTRODUCTION


    Advances in geographic information systems (GIS) provide an opportunity to gather,
    store, edit, query, verify, share and manifest geographically referenced information.
    In the case of earth science, a huge amount of data has been collected at various
    levels of granularity and this geospatial data is always big data [9][10]. At
    present, analysis of geospatial big data allows users to scrutinize huge amounts
    of geospatial data as this geospatial big data is spatial data sets that are beyond
    the capacity of current computing systems. For instance, the National Oceanic
    and Atmospheric Administration’s (NOAA) satellites gather ocean, coast and atmospheric
    data of the global ecosystem for understanding and predicting changes in the Earth’s
    environment [11]. The growth of this spatial data leads researchers to conduct
    further researches on spatial data mining techniques in a highly automated fashion.


    Spatial data mining (SDM) is utilized for the extracting and mining of hidden,
    implicit, valid, novel and interesting spatial or non-spatial patterns or rules
    from'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'large-amount, incomplete, noisy, fuzzy, random, and practical spatial databases
    [12] [13]. The efficiency of the SDM is based on the mining algorithm only. Moreover,
    one of the issues related to the SDM is that the geological data is typical spatial
    data, which includes geological, geophysical, geochemical, and remote sensing
    [14]. Big data is still not a clearly defined term and it has been defined differently
    from technological, industrial, research or academic perspectives. So, for solving
    these issues, the big data is classified as structured and unstructured datasets
    with massive data volumes that cannot be easily captured, stored, manipulated,
    analyzed, managed or presented by traditional hardware, software or database technologies
    since big data is often described by its unique characteristics [15].


    Geospatial big data can be characterized by the following [22]: (a) Volume: Records
    sensed imagery data in Petabytes. Increase in data sets produces massive issues
    in storage (b) Variety: Includes the map data, imagery data, geo-tagged text data,
    structured and unstructured data, raster and vector data, (c) Velocity: imagery
    data with frequent revisits at high resolution, continuous streaming of sensor
    observations, Internet of Things (IoT), real-time GNSS trajectory and social media
    data all require matching the speed of data generation and the speed of data processing
    to meet demand (d) Veracity: much of geospatial big data is from unverified sources
    with low or unknown accuracy; the level of accuracy varies depending on data sources,
    raising issues about quality assessment of source data and how to “statistically”
    improve the quality of analysis results. (e) Visualization: This helps analysts
    identifying patterns (such as outliers and clusters), leading to new hypotheses
    as well as efficient ways to partition the data for further computational analysis.
    (f) Visibility: the emergence of cloud computing and cloud storage has now made
    it possible to efficiently access and process geospatial big data in ways that
    were not previously possible [16][17]. The variation in the format of data collection
    and increase in the volume of data are a challenging issue to geospatial data
    processing as it creates issues in storing, managing, processing, analyzing, visualizing
    and verifying the quality of data [18][21]. Moreover, the verification in the
    quality of geospatial big data and data products delivered to end-users is another
    challenging issue in quality control. On the other hand, fitness of uses or purposes
    appears more valid or should be advocated in the context of big data [19][20].


    # 10.2 RELATED WORKS


    In 2015, Hillen et al. [1] proposed the Geo-reCAPTCHA (Completely Automated Public
    Turing test to tell Computers and Humans Apart) in order to gather user-generated
    geographic information (UGCI) from earth observation data, as the UGCI was utilized
    for geography and geographic information science (GIScience). The Geo-reCAPTCHA
    approach was mainly based on assessing the time and quality of the resulting geographic
    information. Most of the problems related to the building digitization were solved
    within a short amount of time (19.2 s on average) and the accuracy of digitization
    in geospatial data was improved to 82.2%. Moreover, Geo-reCAPTCHA had high performance
    when compared to the reCAPTCHA. Thus, Geo-reCAPTCHA was a data-rich channel belonging
    to crowd-sourced geographic information.'
