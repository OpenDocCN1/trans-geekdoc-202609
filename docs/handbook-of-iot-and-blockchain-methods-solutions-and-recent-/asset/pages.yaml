  md: '# IOT ARCHITECTURE


    ![](img/cd1801130f8a9057bd2f396e8025ba69_16_0.png)


    # FIGURE 1.1 IoT general Architecture.


    These four layers are illustrated in Figure 1.1 of this chapter. The figures entail
    a five-layer architecture that comprises of:


    +   1. Business Layer

    +   2. Application Layer

    +   3. Service Management Layer

    +   4. Object Abstraction Layer

    +   5. Perception Layer


    The business layer is responsible for the management of all activities, services
    and development of business models, graphs, and flowcharts based on the data it
    receives from the application layer. Further, this layer is responsible for supporting
    the decision-making aspect, based on big data analysis and determining the course
    of action. The application layer is responsible for service delivery and acts
    as an interface to the business layer. Furthermore, it is responsible for providing
    a control mechanism for accessing data and provides global management of the application
    based on objects’ information processed in middleware. The service management
    layer is responsible for the pairing of services with their requester based on
    addresses and names, and for processing received data, making decisions and delivering
    the required services over network wire protocols. Furthermore, it is tasked to
    receive and process data from other layers. The object abstraction layer is responsible
    for the transfer of data produced by the objects to the service management layer.
    Also, it is responsible for transmitting data between devices and from devices
    to the receiver. Lastly, the object or perception layer is responsible for collecting
    sensor data in addition to digitizing and transferring data to the object abstraction
    layer. The details of the architecture and associated aspects are described in
    online literature [3–7].'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'TABLE 1.1

    Vulnerability in IoT device


    | Assailability in IoT Device | Type of Vulnerability |

    |---|---|

    | Hardware layer | a) Lack of tamper resistance<br>b) Weak embedded crypto algorithms<br>c)
    Weak hardware implementations |

    | Software layer | a) Firmware Layer<br>b) Operating system<br>c) Application
    layer |

    | Communication protocols | a) Link & network layer protocol threats<br>b) Application
    layer protocol threat<br>c) Network design flaws |

    | Key Management | a) Absence of support for public key exchange<br>b) Easily
    extractable communication keys<br>c) Employing of common or no key |


    Attacks that focus on IoT devices that have resource constraints have increased
    significantly in the past few years. The vulnerabilities in the security sector
    of the IoT technologies used are incessantly being identified; these technologies
    are used in both industrial and home environments such as sensors, industrial
    actuators, home appliances, medical devices, etc. The current state of affairs
    is exacerbated by defects in application, hardware chips that are faulty, and
    tamperable devices along with misconfigurations.


    This section aims to use a risk-like approach to examine cyber attacks with respect
    to IoT-enabled devices, so as to highlight its existing threat landscape and isolate
    hidden and covert attack paths taken against critical infrastructure.


    In IoT-enabled cyber attacks, the device is the amplifier or the enabler of an
    attack; the perpetrator identifies and takes advantage of inherent vulnerabilities
    related to one or multiple layers of the device so as to achieve his/her goal.
    We classify IoT vulnerabilities in two primary classes: “Embedded Vulnerabilities”
    and “Network Vulnerabilities”.


    # 1.1.1.2 Distinguishing IoT from Conventional Networks


    Since its inception, IoT has experienced significant development in parallel to
    conventional networks. In comparison to the internet the network connection is
    established via physical links between web pages. Conventional networks are relatively
    more mature and well established on the technological front and can communicate
    via natural languages with efficacy. This is the reason which substantiates the
    prevalence of traditional networks and ease of their operation. In the IoT domain
    the standardization efforts are in their infancy and currently require skilled
    programming experts to implement an application.


    # 1.1.2 BLOCKCHAIN: AN OVERVIEW


    Blockchain is defined as a “public, permanent, appended-only distributed ledger”
    [8]. The issue of trust in information systems is extremely complex and quite
    prevalent.'
