    # 4.6.5 SMART CONTRACTS


    **Oracles:** smart contracts require Oracles. These Oracles are assumed to be
    sources of truth for a contract to get executed. For smart contracts to be a reality,
    we would need many more Oracles. We would also need more reliable and consistent
    Oracles. For example, flight.com is a reliable source for flight data. However,
    it can get hacked. There might be an internal maintenance issue. The server might
    be down or it could have bugs. Since it is owned privately, one cannot rule out
    any interference. These issues hamper trust.


    **Non-repudiability** of smart contracts is a welcome feature in many cases. However,
    in certain cases it can prove to be problematic. If someone were inebriated or
    under duress while they were writing a smart contract, it could have difficult
    consequences. The best software from the biggest companies also suffers from bugs.
    It is inconceivable that no smart contracts would have bugs. Further, both parties
    may agree to dissolve the contract, or there could be a *force majeure*. In these
    cases we would need an escape chute from the non-repudiable smart contract which
    is not possible currently.


