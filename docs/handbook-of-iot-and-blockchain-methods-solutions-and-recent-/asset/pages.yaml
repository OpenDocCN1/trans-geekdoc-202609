    # 2.6.3 Threats


    Threats are often of two types: an individual''s threat or a natural threat. Any
    threat arising from natural occurrences like earthquakes, hurricanes, floods,
    or fires will cause severe injury to IoT devices. We regularly take a backup or
    produce contingency plans to safeguard information. However, any injury caused
    to the devices physically cannot be repaired.


    Nowadays, IoT solutions have matured over time. Devices, today, have evolved to
    be waterproof. It will be a long journey before IoT solution suppliers come up
    with something that is fireproof or earthquake-proof. On the contrary, we tend
    to do everything in our power to curb any human threats to IoT devices. These
    threats are typically malicious attacks.


    # 2.6.4 Insecure Web Interface


    The security issues relating to the Internet of Things are that the built-in IoT
    allows the end-user to interface with devices while at the same an attacker or
    intruder may also gain an unauthorized access to these devices.


    Some of the security issues are listed below.


    +   - Account enumeration

    +   - Weak default credentials

    +   - Credentials exposed in network traffic

    +   - Cross-site scripting (XSS)

    +   - SQL-injection

    +   - Session management

    +   - Weak account lockout settings.


    The solution to the above problems is


    +   - Default passwords and default usernames must be changed during initial setup.

    +   - Ensuring password-recovery mechanisms are robust and do not supply an attacker
    with information indicating a valid account.

    +   - Ensure that web interface is not susceptible to XSS, SQLi or CSRF.

    +   - Ensure that credentials are not exposed in internal or external network
    traffic.

    +   - Weak passwords should not be allowed.

    +   - Account lockout after 3–5 failed login attempts.


    # 2.6.5 Insufficient Authentications


    This area deals with mechanisms insufficient to authenticate IoT devices. These
    give rise to such issues as'
  merge: -1
  img_proc: true
- pgno: 56
  md: '+   • Lack of password complexity.

    +   • Poorly protected credentials.

    +   • Lack of two-factor authentication.

    +   • Insecure password recovery.

    +   • Privilege escalation.

    +   • Lack of role-based access control.


    The solution to the above problems is


    +   • Ensure that strong passwords are required.

    +   • Ensuring granular access control is in place when necessary.

    +   • Ensuring credentials are properly protected.

    +   • Implement two-factor authentications where possible.

    +   • Ensuring those password-recovery mechanisms are secure.

    +   • Ensuring re-authentication is required for sensitive features.

    +   • Ensuring options are available for configuring password controls.


    # ## 2.6.6 Insecure Network Devices


    Here are some of the problems related to the insecure network devices with IoT:


    +   • Vulnerable services

    +   • Buffer overflow

    +   • Open ports via UPnP

    +   • Exploitable UDP services

    +   • Denial-of-service

    +   • DoS via network device fuzzing.


    The solution to the above problems is


    +   • Ensuring only necessary ports are exposed and available. Ensuring services
    are not vulnerable to buffer overflow and fuzzing attacks.

    +   • Ensuring services are not vulnerable to DoS attacks which can affect the
    device itself or other devices and/or users on the local network or other networks.

    +   • Ensuring network ports or services are not exposed to the internet via UPnP
    for example.


    # ## 2.6.7 Lack of Transport Encryption


    This area deals with the data or information being exchanged in an unencrypted
    format.


    +   • Unencrypted services via the internet.

    +   • Unencrypted services via the local network.

    +   • Poorly implemented SSL/TLS.

    +   • Misconfigured SSL/TLS.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'The solution to the above problems is


    +   - Ensuring data is encrypted using protocols such as SSL and TLS while transiting
    networks.

    +   - Ensuring other industry-standard encryption techniques are utilized to protect
    data during transport if SSL or TLS are not available.

    +   - Ensuring only accepted encryption standards are used and avoid using proprietary
    encryption protocols.


    # ## 2.6.8 Privacy Concerns


    Collection of unnecessary personal information is the main concern of patients.
    The information of patients should be legal and it should not be accessed by any
    third party.


    Some points should be kept in mind while dealing with privacy threats. They are
    listed below:


    +   - Ensuring only data critical to the functionality of the device is collected.

    +   - Ensuring that any data collected is of a less sensitive nature.

    +   - Ensuring that any data collected is de-identified or anonymized.

    +   - Ensuring any data collected is properly protected with encryption.

    +   - Ensuring the device and all of its components properly protect personal
    information.

    +   - Ensuring only authorized individuals have access to collected personal information.

    +   - Ensuring that retention limits are set for collected data.

    +   - Ensuring that end-users are provided with “Notice and Choice” if data collected
    is more than what would be expected from the product.


    # ## 2.6.9 Insecure Cloud Interface


    This point concerns security issues related to the cloud interface used to interact
    with the IoT devices.


    +   - Account enumeration.

    +   - No account lockout.

    +   - Credentials exposed in network traffic.


    The solution to the above problem is


    +   - Default passwords, default usernames to be changed during initial setup.

    +   - Ensuring user accounts cannot be enumerated using functionality such as
    password reset mechanisms.

    +   - Ensuring account lockout after 3–5 failed login attempts.

    +   - Ensuring the cloud-based web interface is not susceptible to XSS, SQLi or
    CSRF.'
