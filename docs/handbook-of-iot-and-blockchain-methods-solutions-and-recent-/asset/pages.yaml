  md: 'the emergence of blockchain in form generation starting from Blockchain 1.0
    to Blockchain 4.0.


    # 1.1.3.1 Blockchain 1.0: Bitcoin and Cryptocurrency


    The first ever recognized generation of blockchain can be attributed to the rise
    of distributed ledger in form a virtual currency/coin, Bitcoin. The virtual coin
    enabled users to perform financial transactions over the internet. In addition,
    the currency is also referred to as “cryptocurrency” as it uses two keys to enable
    and authenticate the transaction:


    +   - Public Key: for verification of the legitimacy of the transaction

    +   - Private Key: for signing the transaction (enablement)


    The Bitcoin ledger is composed of states of ownership of all existing bitcoin
    users informed of transactions between states, and output of any transaction state
    is essentially the transactional value if the transaction was successful. The
    copy of the above finite-length state transition system is maintained as a ledger
    record by the nodes of the network. The roles of third parties were eliminated
