    # 6.2.4 SOLIDITY AND OTHER TECHNOLOGIES


    Ethereum transactions are based on smart contracts which are like normal contracts
    and are automatically binding. There are several languages in which smart contracts
    can be coded. One of the famous languages is Solidity. Ethereum transactions are
    executed on Ethereum Virtual Machine (EVM) just like Java and JVM. Each machine
    running EVM is referred to as a node in the Ethereum blockchain.


    The working of any Ethereum-based application is as follows:


    +   a. First a smart contract is written using Solidity etc.

    +   b. Then it is converted into Bytecode which is further converted to processor-level
    opcodes by EVM.

    +   c. Then this contract is sent to the Ethereum network as a transaction.

    +   d. Subsequently this transaction is mined by all nodes. Now this smart contract
    is deployed on the network and a public address is allocated to it.

    +   e. In order to interact with this contract, a transaction is sent to its address,
    specifying function which has to be invoked.

    +   f. This method call is then saved in blockchain after the transaction is mined.
    A cost is associated with every method call. This cost is computed as ‘Gas’ and
    its price is expressed in ‘Ether’ and paid by the sender of the transaction.'
