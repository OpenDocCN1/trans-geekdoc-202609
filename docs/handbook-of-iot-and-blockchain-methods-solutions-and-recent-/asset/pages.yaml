  md: 'it allows increased transparency and efficiency in the exchange of almost anything.
    It reduces cost and promotes trust among parties. To sum up, blockchain has the
    ability to change how the world works and it has the potential to be called the
    most ground-breaking technology of this century.


    Despite being such a revolutionary technology, many people still do not have a
    clear idea about what it is and how it works. The true potential of this technology
    lies in awareness of it. So this is precisely the agenda of this chapter i.e.,
    what exactly is blockchain and why does it seem to have such limitless applications?
    This chapter explains blockchain''s significance and implications along with an
    outline of a brief history behind it, starting with Section 1.1.1 which gives
    a general idea about blockchain. Then we shall try to understand the origin of
    blockchain in Section 1.1.2. Further, Section 1.1.3 briefly discusses its implementation.


    # 6.1.1 WHAT IS BLOCKCHAIN?


    Blockchain is a way of recording transactional data or tracking assets. Assets
    can be tangible or intangible. Practically, anything of value can be tracked using
    a blockchain network with lesser costs and improved transparency. Blockchain is
    a database distributed across a network, where the nodes of the network are in
    sync with each other. All the nodes have the exact same copy of the blockchain.
    There is no single entity or authority which is in charge of controlling the database.
    Any modification to this database is done after broad agreement from the participants
    of the network. This database is append-only i.e. data can only be added to the
    database, and only after agreement from all participating entities [1].


    With reference to past events, when various people had to depend on the same data,
    they relied on a trusted third party to control the origin of data. But with the
    emergence of blockchain, these groups of entities can agree on events without
    the requirement of a third party.


    Blockchain is basically a decentralized ledger, building a linked list of records,
    called blocks, across a point-to-point network where every block contains a certain
    number of transactions. The order of the blocks in the chain specifies the order
    in which the transactions take place. Each block consists of:


    ![](img/cd1801130f8a9057bd2f396e8025ba69_108_0.png)


    FIGURE 6.1 Centralized versus Decentralized systems.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '![](img/cd1801130f8a9057bd2f396e8025ba69_109_0.png)


    # FIGURE 6.2 Structure of a Block.


    +   1. Cryptographic hash of the previous block

    +   2. The timestamp

    +   3. Transactional data


    In other words, the blockchain functions as an open, shared, trusted public chain
    that maintains a continuously growing list of transaction data between two entities
    efficiently and in a verifiable and persisting manner.


    Due to the structure of each block, blockchain is resistant to modification of
    data. If someone tries to change the transaction history in some block, then all
    the blocks from that block until the current block will have to be modified and
    this will have to be reflected in every duplicate of the blockchain on the network.
    Since the hash in the next block is a function of the contents of this block,
    the next block will also have to be changed. This change will result in a different
    block hash. The same process will have to be circulated to the latest block in
    the chain. Maintaining the blockchain becomes extremely difficult once it is modified.
    The computing power required to accomplish this is colossal. But these days we
    have computers with very high processing powers and for such computers, calculating
    hundreds of thousands of hashes is a matter of a few seconds. So, to avoid tampering
    with data, blockchains use a technique called Proof of Work (PoW) which requires
    miners (nodes in the network) to solve a computational problem. The time and effort
    required to solve the problem is very high as compared to the time required to
    verify the result of the problem. Once a miner finds a solution to a block, it
    broadcasts the block to the network. All the other nodes verify this solution
    and the block is added to the chain. PoW has become a widely used consensus algorithm
    and is used by many cryptocurrencies [2].


    Now let’s try to understand the working of the blockchain with the assistance
    of an example:


    Suppose a person X wants to give ₹10,000 to Y. Without blockchain, X would send
    a request to his bank to initiate a transaction of ₹10,000 from his account to
    Y’s account. This request will contain the sender’s and receiver’s account details
    along with the transaction amount. The bank would check a few things such as if
    X actually has ₹10,000 in his account. If everything works out fine, the bank
    would transfer ₹10,000 from X’s account to Y’s account.'
