  md: '+   2. Distributed: Every node has a copy of the blockchain. So, if someone
    tries to tamper with the data, he/she will have to modify data in all the copies
    of blockchain stored at every node in the blockchain network. This prevents all
    of the information from being tampered with at the same time. Unless hackers can
    tamper with the transaction records on millions of nodes, they will not be able
    to successfully falsify the blockchain data.


    +   3. Immutable: Any transaction data, once added to the blockchain cannot be
    modified. Data can only be added to the blockchain in a time-sequential order.
    It is considered practically impossible to change any data.


    +   4. Consensus: This is the attribute which gives blockchain the power of decentralization.
    The ledger is updated by consensus. No central authority is in charge of making
    changes to the ledger. Any updates made to the blockchain are verified against
    strict conditions and added to the blockchain only after a consensus has been
    reached among the nodes in the network.


    +   5. Security and reliability: There is no single point of failure in the blockchain
    system due to decentralization. There is no part of the system that has the ability
    to cease functioning of the entire system, if it fails. Also, there are no weak
    points in the network from where information can be tampered with. This avoids
    malicious attacks, thus improving overall reliability of the blockchain. Furthermore,
    transactions are digitally signed and encrypted, which ensures high security.


