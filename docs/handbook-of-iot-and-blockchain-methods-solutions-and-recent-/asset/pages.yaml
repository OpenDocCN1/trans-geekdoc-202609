  md: 'In 2015, Kepler et al. [2] proffered the time geography for the purpose of
    querying and integrating multiple spatial–temporal data sources and this framework
    was designed under the perception of the space–time prism and this was based on
    the constraints and interactions between entities in space and time. This research
    primarily developed the space–time prisms and then applied it to the Web of Data
    to get efficient spatial–temporal aspects. This research mainly focused on monitoring
    the environment with the space–time prisms and thus the spatial–temporal and semantic
    reasoning was obtained with the geospatial information and this information was
    gathered directly from distributed data sources.


    In 2018, Xia et al. [3] accessed three earth observations (EO), namely fast access,
    accurate service estimation and global access with the help of accessing big data.
    Moreover, the research explored the spatial pattern, temporal pattern and spatio-temporal
    pattern of user-data interactions. With the help of these patterns, geospatial
    information was gathered by overcoming the drawbacks associated with the spatiotemporal
    patterns when end-users access EO data. This research also solved the problems
    associated with the utilization of spatiotemporal patterns for facilitating better
    EO big data access with the help of three spatiotemporal optimization strategies;
    they are (i) spatiotemporal indexing to accelerate data access, (ii) spatio-temporal
    service modeling to improve data access accuracy and (iii) spatiotemporal cloud
    computing to enhance global access. This research had a better framework in the
    optimization of EO big data access and was also vulnerable to other multidisciplinary
    geographic data and information research.


    In 2018, Lu et al. [4] projected the GreenBDT: Renewable-aware scheduling of bulk
    data transfers for geo-distributed sustainable datacenters for the purpose of
    minimization of grid energy cost for bulk data transfers between sustainable and
    green datacenters and for maximizing the usage of renewable energy. GreenBDT was
    made possible with the heuristic algorithm in order to solve the MaxGreen-Min-Cost
    problem. This algorithm is employed with the following constraints; in case available
    wind power was not enough for the transfer all the bulk data, then the wind energy
    was utilized for the interGD BDTs or in case of insufficient wind power, then
    the inter-GD BDTs used optimal demand division and routing selection to minimize
    the energy cost caused by grid power. This research further revealed that validation
    with the real-life network topology optimized the scheduling for inter-datacenter
    bulk data transfers individually. This further suggested that the renewable energy
    was maximized. More securitized results proved that with real-life network topology,
    existing wind power and electricity prices, with maximum renewable energy, reduced
    the cost of energy savings when compared to the existing bulk data transfer strategies.


    In 2011, Jiamthapthaksin et al. [5] formulated the generic agglomerative clustering
    framework for the purpose of generalizing agglomerative clustering in the geo-referenced
    datasets (GAC-GEO) by using three plug-in components. The fitness function of
    the plug-in is maximized with the GAC-GEO agglomerates as it had the capacity
    to capture the notion of interestingness of clusters. This further enhanced the
    typical agglomerative clustering algorithms by using fitness functions support
    task-specific clustering, whereas generic neighboring relationships increase the
    number of merging candidates. This shows that the existing agglomerative clustering
    algorithms were considered as the specific cases of GAC-GEO. The proposed framework
    was'
