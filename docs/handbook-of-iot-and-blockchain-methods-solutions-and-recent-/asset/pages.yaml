    # 9.11.1 PAXOS


    The first ever consensus algorithm, Paxos, was proposed by Lamport with the objective
    of choosing a single value under crash or network fault. The idea behind Paxos
    is very simple: All the nodes in the network have been categorized into three
    types; namely the proposers, the acceptors and the learners. Everyone is a learner
    in the network that learns the consensus value. The proposer initially prepares
    a proposal with a proposal number known as a prepare message and sends it to the
    acceptors. This proposal number forms a timeline and the biggest number is considered
    up to date. Each acceptor compares received proposal number with current known
    values for each proposer’s proposal message. If it gets a higher number, then
    it accepts the proposal or otherwise declines it. Then the acceptor prepares a
    response message of the following form: Prepare response where the proposal number
    is the biggest number the acceptor has seen and accepted values are the already
    accepted values from another proposer. Next a vote is taken based on the majority
    decision. The proposer checks whether the majority of the acceptors have rejected
    the proposal. If yes, then the proposer updates'
