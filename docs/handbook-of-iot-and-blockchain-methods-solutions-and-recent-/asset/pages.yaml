  md: '![](img/cd1801130f8a9057bd2f396e8025ba69_184_0.png)


    # FIGURE 10.1 Block diagram of Geospatial industrial data classification.


    quickly write and test distributed systems with big data. Then, from the map reduced
    data, vegetation indices like simple ratio vegetative index, normalized difference
    vegetative index, Kauth–Thomas Tasseled cap and Infrared Index Transformation,
    as well as geographic location will be generated. Next to this data formation,
    sequential pattern mining will be performed, and those patterns will be assigned
    as the features. Furthermore, extracted features will be subjected to a deep learning
    architecture termed Deep Belief Network (DBN) [23], which predicts the type of
    industries a location suits. As a main contribution, the weight of DBN will be
    optimized by a renowned optimization algorithm called Modified Flower Pollination
    Algorithm (FPA), so that the classification accuracy will be maximum. FPA [24]
    is a meta-heuristic algorithm inspired by the pollination process of flowers.
    In order to maximize prediction accuracy, the error between the predicted and
    actual outcome will be intended to minimize, which is considered the main objective
    function of this current research.


    # 10.5 EXPECTED OUTCOME


    The proposed prediction model will be carried out in the JAVA programming platform,
    and investigation will be carried out. In the analysis part, the performance of
    the proposed model will be compared over the existing models in terms of Type
    I and Type II measures.


