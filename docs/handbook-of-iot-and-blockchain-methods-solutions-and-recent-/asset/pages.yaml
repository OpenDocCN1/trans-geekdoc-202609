- pgno: 90
  md: '+   - Public blockchain needs decentralized verification such as in the case
    of bitcoin. People who verify the transaction and get some bitcoins are called
    miners. A complex mathematical problem is posed to verifiers and solving these
    problems takes up a lot of energy. Decentralization may help in keeping this process
    less cumbersome.

    +   - Low scalability: To be used as a means of payment, the number of transactions
    that can be processed has to be much higher. At its peak, it would take bitcoin
    more than a day to verify a transaction.

    +   - High cost: The cost of verifying transactions through the Proof of Work
    protocol is very high. The report says that 19 US households could be powered
    for a day by the electricity it takes to mine one bitcoin. If such currency mining
    is not prohibited in India, it would be catastrophic. Developed nations such as
    Canada have had to buy power in the open market. India is already power starved.

    +   - Irreversibility: All transactions on blockchain are irreversible. While
    this gives it credibility, it penalizes mistakes. Anyone who has worked at a bank
    would tell you that mistakes are common even while transferring money.

    +   - Security: Wallets and even exchanges have been prone to cyber-attacks thereby
    causing a security concern.

    +   - Password: If one forgets the Private Key, there is no recourse. Currently,
    we have the provision of verifying the identity of the person and regenerating
    a PIN or an OTP. No central authority exists in case of cryptocurrencies.

    +   - Monetary policy: cannot be enforced by central banks. This can cause unchecked
    inflation.

    +   - Cross-border control over currency: cannot be exercised as there is no central
    clearing house.

    +   - Anonymity: in transactions is causing cryptocurrencies to be used for criminal
    activities; from financing narcotics, as in the case of Silk Road, to terrorism.


    Given the disadvantages, IMC proposes the enactment of a law to prohibit trading
    and mining cryptocurrencies and a fine of up to Rs 25 Cr and imprisonment of as
    much as ten years for anyone dealing in them. However, it does recommend official
    digital currency with the status of a legal tender and appropriately regulated
    by the Reserve Bank of India.


    # 4.4.2 REPORT OF THE STEERING COMMITTEE ON FinTech RELATED ISSUES


    The report of the Steering Committee on FinTech Related Issues, also within the
    Department of Economic Affairs, Ministry of Finance has taken a much softer view
    on the issue. It has encouraged the use of blockchain and has noted global interest
    in cryptocurrency. They acknowledge that virtual currencies through Initial Coin
    Offerings are revolutionizing fintech. it also talks about utility tokens and
    their potential to enable various industries.'
