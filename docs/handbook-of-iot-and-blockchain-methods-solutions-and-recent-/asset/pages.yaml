  md: '# 8.3.21 ILLEGAL ACTIVITIES


    An illicit group of people can utilize the blockchain network or platform to perform
    various illegal activities. For instance, the Silk Road website was an online
    marketplace for illegal drug where sellers and buyers whose identities are anonymous
    did business using bitcoin (Hong 2015). Cryptocurrency that uses blockchain technology
    may also facilitate money laundering. Although bitcoin is not yet treated as a
    fiat currency, it makes it possible to create an “underground” channel for illegal
    movement of funds within its network.


    # 8.3.22 IDENTITY THEFT


    Although Blockchains preserve anonymity and privacy, the security of assets depends
    on safeguarding the private key, a form of digital identity. If one’s private
    key is acquired or stolen, no third party can recover it. Consequently, all the
    assets this person owns in the blockchain will vanish, and it will be nearly impossible
    to identify the thief. The consequences may be more devastating than identity
    theft in the offline world, where third-party institutions (e.g., credit card
    companies) or central authorities safeguard transactions, control risks, detect
    suspicious activities, or help find culprits. Also, current cryptography standards
    are not completely uncrackable (Swan 2015). With the advent of quantum computing,
    it is not impossible for cryptographic keys to be cracked quickly, demolishing
    the foundation of blockchain technology (Crosby et al. 2016).


    # 8.4 POTENTIAL DEFENSES AGAINST SECURITY THREATS ON BLOCKCHAIN


    Potential defenses which assure security against man-in-the-middle-attacks, hardware
    Trojans, etc., include the following schemes:


    +   • **Watermarking:** Someone requests a transaction directly known as client
    or via something called a wallet. The transaction directly request from the client
    will deliver either a commit or by a process at the server where the transaction
    initiated known as the master. In watermarking, the original client’s digital
    signature is provided with the request. Watermarks are able to assure ownership
    as these are much more difficult to identify and modify. Unfortunately, the watermarking
    technique is not able to guarantee security against hardware Trojans.


    +   • **Metering:** In this technique, both the public signature of wallet/master
    and the client’s digital signature are added to the transaction request as processing
    constraints. This metering scheme is not also able to assure protection against
    hardware Trojans as the attacker is able to create and hide a malicious Trojan
    in the circuit due to availability of the design functionality.


    +   • **Side-channel fingerprinting:** This scheme is able to detect hardware
    Trojans easily as the manufactured parametric characteristics, such as power,
    area, delay, and block characteristics of the transaction are compared with those
    of'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'statistical model. Any significant variation/deviation would be considered
    to be a Trojan. Side-channel fingerprinting is not able to assure authenticity
    or piracy, counterfeiting, or reverse-engineering attacks.


    +   • Reverse Engineering (RE): This technique can also be constructively utilized
    to detect hardware Trojans. For RE, the state-of-the-art of blockchain should
    be made aware by the researcher to become successful in the detection of HTs inserted
    by foreign attackers. A typical RE flow should pass through de-packaging, delayering,
    and image processing of a blockchain.


    Mainly, its design and blocks are uncovered by RE scheme following the aforementioned
    steps is studied with a golden one (this means with no attack).


    This RE approach is both time-consuming and also destructive in nature. Hence,
    the RE technique is less applicable for HTs detection [20]. RE is generally used
    to assure about the Trojan-free blockchain used in the golden blockchain model
    development required for test time and runtime golden blockchain models.


    +   • Code analysis: The code of blockchain functionality is analyzed to detect
    for any hardware Trojans inserted into the system. Also, any secured encryption
    algorithm and hash functions can be used for the confidentiality of transaction
    and hence protect from Trojan attacks on blocks. Code analysis is not able to
    protect the blockchain against piracy, reverse engineering, and counterfeiting
    attacks.


    +   • Obfuscation: A code-obfuscation technique can be used by the blockchain
    designer for the mystification of transactions. This obfuscation is able to prevent
    hardware Trojan attacks indirectly as attackers would not be able to insert meaningful
    and stealthy hardware Trojans in such an obfuscated transaction sequences. Obfuscation
    is able to prevent hardware Trojans and reverse engineering, but not piracy or
    counterfeiting.


    +   • Locking: A blockchain designer is able to add locks (i.e., digital multiplexers)
    which manage and control the flow of transactions among blocks or other blockchain
    components. These transactions will proceed further in a correct manner if and
    only if the correct secret key is applied, otherwise wrong


