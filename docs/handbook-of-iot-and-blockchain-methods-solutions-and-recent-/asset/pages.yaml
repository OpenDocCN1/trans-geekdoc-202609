    # ## 8.1 INTRODUCTION


    Among recently technological advances, blockchain technology is an emerging new
    approach in the domain of information technologies. Blockchain is the use of advanced
    cryptographic proficiencies to implement a distributed system by a decentralized
    ledger of all existing transactions across a peer-to-peer (P2P) network, and allow
    fast processing of transactions in potentially trustless surroundings. It has
    firmly caught the imagination of cryptonerds, researchers, central bankers, and
    programmers, as well as politicians. By design, blockchain is a distributed decentralized
    tamper-proof ledger of records. Using blockchain technology, parties can control
    transactions without the need for a central certifying authority. Its potential
    applications allow fund transfers, voting, settling trades, and many other attractive
    uses. In blockchain, a transaction is the set of hash of the previous digitally
    signed transaction and the public key of the next owner. Each transaction is signed
    with a private key, and is verified by the public key [1], as shown in Figure
    8.1. Its working principle:


    +   1. Anyone can request a transaction.

    +   2. The requested transaction should broadcast to a P2P connection consisting
    of computers called nodes.

    +   3. The nodes validate the transaction and the user''s status using existing
    known algorithms.


    ![](img/cd1801130f8a9057bd2f396e8025ba69_146_0.png)


    **FIGURE 8.1** Network of transactions in a blockchain.'
