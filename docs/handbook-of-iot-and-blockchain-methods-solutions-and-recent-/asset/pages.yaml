    # ## 2.4.3 TECHNOLOGY DEPENDENT


    Once the workers have adapted to the new manner of labor, there comes a further
    drawback. It is not uncommon for a computer system to face technical errors. The
    healthcare informatics system is no exception. This drawback is particularly crucial
    within the Accident & Emergency (A&E) Department. Varied departments within the
