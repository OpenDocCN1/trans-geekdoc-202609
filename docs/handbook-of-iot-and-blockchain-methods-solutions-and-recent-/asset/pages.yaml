    # 9.11.2 Raft


    The Raft algorithm is designed as an easy alternative to Paxos. The basic idea
    behind Raft is that nodes collectively select a leader and rest of the nodes become
    followers. The leader is responsible for state transition log replication across
    the followers. Record entries flow in only one direction from the leader to the
    followers. Unlike Paxos, here each node can be at any of the three states namely
    leader, candidate and follower at any particular time. The Raft algorithm runs
    in rounds which are known as term. Each term starts with an election where one
    or more candidates strive to become leader. Initially, we have a set of follower
    nodes, who look out for a leader. If within a certain time interval they do not
    find one, then the leader election process starts. In this election phase, some
    of the followers volunteer to become a leader and request votes from all other
    nodes. Then these candidate nodes send request messages to other followers of
    the system for a vote. When a node receives the request, it compares the term
    and index in the received message with corresponding current known values. Like
    Paxos, the followers vote for one of the candidates and based on the majority
    of votes, a leader is selected. Then in the next part, the elected leader will
    propose values which the followers will choose so that the system can reach consensus.
    The leader sends out heartbeats (signals) to all followers at regular intervals
    in order to maintain its authority. Compared with Paxos and PBFT, this algorithm
    has high efficiency and clarity. Hence it has been extensively employed in distributed
    systems. The Raft algorithm achieves the same safety performance as Paxos and
    is better suited in real-life implementation and comprehension. As mentioned,
    the Raft algorithm cannot support byzantine nodes and can stand up to failure
    of 50% of nodes. As in the case of permissioned blockchain, nodes are verified
    members. Hence, it is more essential to resolve crash faults rather than Byzantine
    faults for private blockchain.


