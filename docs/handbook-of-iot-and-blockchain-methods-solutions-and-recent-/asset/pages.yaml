    Depending on the density of the mesh network, there may be many different links
    available to other mesh nodes or none at all. Unstructured mesh networks are usually
    implemented with non-line-of-sight radios (NLOS) using low frequency and low bandwidth
    radios operating, for example, in the UHF bands, such as 400 MHz or in the license-free
    band at 900 MHz.


    Unstructured wireless mesh networks leverage one single channel shared by all
    the radios. Therefore, the higher the number of hops a transmission requires,
    the lower the overall throughput of the network will be.


    Structured wireless mesh networks are planned networks typically implemented using
    multiple radios at each node location and multiple directional antennas. A ring
    topology using multiple directional wireless links is commonly used in a structured
    wireless mesh network to enable each radio to seamlessly reroute traffic through
    different paths in the event of node or link failures.


    Structured wireless mesh networks are often used for mission-critical applications
    such as wireless video surveillance, public safety, and industrial automation.


    They provide the ideal network architecture in case a site requires a highly reliable
    and available wireless network for a broadband application such as video, voice
    and data streaming. Each link in a structured wireless mesh network operates on
    an independent channel and, therefore, the number of hops for a specific transmission
    does not affect the overall throughput of the network.


    Wireless mesh networks have been studied in academia since the early 90s, initially
    mainly with military applications in mind, and then they started to get significant
    commercial traction between 2005 and 2010.


