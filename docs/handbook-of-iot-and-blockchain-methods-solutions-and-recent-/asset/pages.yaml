- pgno: 89
  md: 'extends to pharmaceuticals as well as durables. Companies such as Walmart and
    Pfizer have conducted successful pilots with this technology.⁶


    # 4.3.7 GOVERNANCE


    Government is the biggest spending entity in the country. Most of it is mired
    in processes. Tracking that money is a headache for most government departments
    themselves. The subsidies and grants disbursed by the Central Government pass
    through multiple hands before reaching the beneficiary. Blockchain can enable
    tracking of government funds and it is open to audit at all times by anyone who
    may wish to see it. Any claims made by beneficiaries can be quickly resolved by
    verifying them on the blockchain. Transparency and immutability would be very
    useful in ensuring that the money reaches the right people.


    # 4.4 GOVERNMENT''S TAKE


    The government is yet to formulate a concrete policy on the issue. There have
    been two reports that have examined blockchain and cryptocurrency. There is consensus
    on the use of blockchain and exploring its application in governance. In the 2018
    Budget speech, the then Finance Minister Shri Arun Jaitely clarified the stand
    of the government in Parliament.⁷ He said a distributed ledger system or the blockchain
    technology allows organization of any chain of records or transactions, without
    the need of intermediaries. The government will explore use of blockchain technology
    proactively for ushering in a digital economy.


    The contentious point was regarding cryptocurrency. The Government constituted
    an Inter-Ministerial Committee (IMC)⁸ in November 2017 under the Chairmanship
    of Secretary, Economic Affairs comprising Secretary, Ministry of Electronics and
    Information Technology, chairman of Securities Exchange Board of India and other
    members to study the issues related to virtual currencies and propose specific
    action to be taken in this matter.


    # 4.4.1 SUMMARY OF IMC REPORT


    While some countries have outrightly banned cryptocurrencies and some others have
    used them for barter transactions and even as a means of payment, no country has
    yet considered cryptocurrencies as a legal tender.


    The Inter-Ministerial Committee (IMC) set up by the Indian Government to study
    the issues related to virtual currencies and propose specific actions, recently
    recommended that all private crypto currencies should be banned in India except
    the ones issued by the Government.


    While the Committee suggests that the Government keep an open mind on digital
    official currency and has highlighted the positive aspects of Distributed Ledger
    Technology (DLT) and its uses in banks and financial firms, it has proposed banning
    of all private cryptocurrencies given the risks associated with them.


    The disadvantages of virtual cryptocurrencies have been further explained below
    with sources and rationale.'
