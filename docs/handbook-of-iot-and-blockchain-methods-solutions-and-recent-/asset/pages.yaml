    # iii. Sharding


    Sharding was also developed to solve scalability problems, similar to the plasma
    protocol. Before we understand what sharding is, let us try to understand the
    actual problem. Currently, every node which is connected to the Ethereum blockchain
    network must check each and every transaction that goes through the network. For
    example, if you need to review a hundred transactions in the next block, each
    node should check every hundred transactions.


    While this technique is good for security measures, the speed of the network is
    the same as that of the connected individual nodes. The parts do things differently.
    After installation, the network is divided into various smaller parts and each
    part is known as shard. Each and every shard has distinct transaction histories
    in which each node operates on its own. Since each node is not required to verify
    each transaction, it is expected that it will significantly increase the number
    of transactions which can be handled by Ethereum blockchain.


    We know that Ethereum can cost more if one of the above solutions is successfully
