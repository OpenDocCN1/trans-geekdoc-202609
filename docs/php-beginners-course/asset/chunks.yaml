  trans: "\n\n输出：\n\nmyVar 存在\n\n```php\n<?php\n  $myVar = \"123\";\n\n  if (isset($otherVar))\
    \ {\n    echo \"myVar exists\";\n  }\n  else {\n    echo \"myVar does not exists\"\
    ;\n  }\n?>\n```\n\n输出：\n\notherVar 不存在\n\n### 用例分析 (switch / case)\n\n假设我们有一个变量，并想要检查许多不同的内容。我们已经知道了\
    \ `if`、`elseif` 和 `else` 的功能。然而，这可能会很快变得混乱；此外，编写冗余代码来只检查单个变量更为简单。这里有一个实用的函数 `switch\
    \ case`，其编写如下：\n\n```php\n<?php\n  $username = $_GET[\"username\"];\n  switch\
    \ ($username) {\n    case \"Klaus\":\n      echo \"Hello administrator!\";\n \
    \     break;\n    case \"Dagmar\":\n      echo \"Hello sister!\";\n      break;\n\
    \    case \"Bill Gates\":\n      echo \"Hello richest man in the world!\";\n \
    \     break;\n    default:\n      echo \"Hello visitor!\";\n      break;\n  }\n\
    ?>\n```\n\n正如我们看到的，`switch` 函数的头部与 `if` 函数非常相似；它只是没有定义参数。之后，每个多个 case 块必须以 `break`\
    \ 结束；这会中断跳转到其他 case 的检查。\n\n如果在任何一种情况下都不满足条件，将执行 `default` 块。如果你不使用 `break`，你可能会对两个或多个\
    \ case 代码块运行相同的代码：\n\n```php\n<?php\n  $username = $_GET[\"username\"];\n  switch\
    \ ($username) {\n    case \"Klaus\":\n    case \"Dagmar\":\n      echo \"Hello\
    \ administrator!\";\n      break;\n    case \"Bill Gates\":\n      echo \"Hello\
    \ richest man in the world!\";\n      break;\n    default:\n      echo \"Hello\
    \ visitor!\";\n      break;\n  }\n?>\n```\n\n### 用于重复性任务的循环 (While / For / Foreach)\n\
    \n#### While() 循环\n\n通常，我们的脚本需要重复执行某些任务。例如，按照特定的顺序进行某种编号：\n\n```php\n<?php\n \
    \ $number = 1;\n  while ($number < 100) {\n    echo $number . \"<br />\";\n  \
    \  $number++;\n  }\n?>\n```\n\n这个短脚本返回从 1 到 99 的每个数字。它被用于所谓的 `while()` 循环。`while()`\
    \ 循环的头部用于像 `if` 函数一样指定条件。只要条件为真或调用了 `break` 命令，循环就会重复。该脚本还有一个小技巧。它继承自 C 语言：`++`\
    \ 将值增加 1，`--` 将其减少 1。这里是另一个相同的例子，只是这次它写在准无限循环中，因为条件永远真。循环一直运行直到遇到 `break`；命令被取消：\n\
    \n```php\n<?php\n  $number = 1;\n  while (true) {\n    echo $number . \"<br />\"\
    ;\n    $number++;\n    if ($number > 99) {\n      break;\n    }\n  }\n?>\n```\n\
    \n#### For() 循环\n\n对于固定的数字，有一种更美丽的循环：`for()` 循环。`for()` 循环的功能如下：`for (起始值; 条件;\
    \ 重复)`。这里有一个简短的示例：\n\n```php\n<?php\n  for ($x = 1; $x < 100; $x++) {\n    echo\
    \ $x . \"<br />\";\n  }\n?>\n```\n\n这将产生与使用 `while()` 循环相同的输出。函数的第三个参数指定了在每次循环后执行的命令。在这种情况下，将变量\
    \ `$x` 的值增加 1。该变量只能在循环内部使用。\n\n#### Foreach() 循环\n\n还有另一种遍历数组的循环：`foreach()`。这里有一个关于如何使用它的的示例：\n\
    \n```php\n<?php\n  $valueArray = array(2,4,16,32);\n  foreach ($valueArray as\
    \ $index => $value) {\n    echo $value . \"<br />\";\n  }\n?>\n```\n\n输出：\n2\n\
    4\n16\n32\n\n在函数内部，变量 `$index` 和 `$value` 是可用的。通过 `$index`，你可以确定你进入了数组中的哪个条目（从\
    \ 0 开始计数），或者如果你定义了数组的索引，你可以在循环内部获取它。变量名可以自由定义；但在循环块内部应该清楚变量的用途。如果你在循环中不需要数组索引（例如，你只想按顺序输出值），那么更加简单了：\n\
    \n```php\n<?php\n  $valueArray = array(2,4,16,32);\n  foreach ($valueArray as\
    \ $value) {\n    echo $value . \"<br />\";\n  }\n?>\n```\n\n## 第 3 天\n\n### 日期和时间（谁拨了钟？）\n\
    \n#### DATE()\n\n使用 `date(format, time)` 函数，你可以以格式化的形式打印特定的时间。第一个参数指定格式，而第二个可选参数指定特定的时间。如果第二个参数不存在，则显示当前的服务器时间。这里有一个示例：\n\
    \n```php\n<?php\n  echo date(\"Y-m-d\");\n?>\n```\n\n输出（假设当前日期）：\n2023-10-27\n\
    \n`time()` 函数返回当前时间，以 `Y-m-d` 格式：\n\n```php\n<?php\n  echo date(\"Y-m-d\", time());\n\
    ?>\n```\n\n`time()` 函数返回的是时间戳。\n\n#### microtime()\n\n`date()` 函数的 `microtime()`\
    \ 参数。`microtime()` 返回当前的当前的时间戳。你可以使用 `date()` 函数来格式化它：\n\n```php\n<?php\n  $time\
    \ = microtime(true);\n  echo date(\"Y-m-d H:i:s\", $time);\n?>\n```\n\n输出：\n2023-10-27\
    \ 10:30:05\n\n#### mktime()\n\n`mktime(秒, 分, 时, 日, 年)` 用于指定一个特定的时间：\n\n```php\n\
    <?php\n  echo date(\"Y-m-d\", mktime(0, 0, 0, 12, 2016));\n?>\n```\n\n输出：2016-12-01\n\
    \n#### strtotime()\n\n`strtotime(\"日期文本\")` 将人类可读文本转换为 `date()` 函数格式的 `time()`：\n\
    \n```php\n<?php\n  echo date(\"Y-m-d\", strtotime(\"May 17th\"));\n?>\n```\n\n\
    输出：2023-05-17\n\n你甚至可以从实际时间点进行一些计算：\n\n```php\n<?php\n  echo date(\"Y-m-d\", strtotime(\"\
    next Friday\"));\n?>\n```\n\n"
- fmt: "\nYear, in accordance with ISO8601. This is the same value as `Y`, except\
    \ when the ISO calendar week (`W`) belongs to the previous or next year, in which\
    \ case that year is used.\n\nExample: 1999 or 2003\n\n`Y`\nFour-digit year\nExample:\
    \ 1999 or 2003\n\n`y`\nYear, double-digit\nExample: 99 or 03\n\n### Time\n`a`\n\
    Lowercase ante meridiem (morning) and post meridiem (afternoon)\n`am` or `pm`\n\
    \n`A`\nCapital letters: ante meridiem (morning) and post meridiem (afternoon)\n\
    `AM` or `PM`\n\n`B`\nSwatch Internet Time\nFrom 000 to 999 per day\n\n`g`\nHour\
    \ in 12-hour format, without leading zeros\n1 to 12\n\n`G`\nHour in 24-hour format,\
    \ without leading zeros\n0 to 23\n\n`h`\nHour in 12-hour format, with leading\
    \ zeros\n01 to 12\n\n`H`\nHour in 24-hour format, with leading zeros\n00 to 23\n\
    \n`i`\nMinutes, with leading zeros\n00 to 59\n\n`s`\nSeconds, with leading zeros\n\
    00 to 59\n\n`u`\nMicroseconds\nExample: 654321\n\n### Time zone\n`e`\nName of\
    \ the time zone\nExample: `UTC`, `GMT`, `Atlantic/Azores`\n\n`I` (upper case 'i')\n\
    A date in the daylight (summer) time\n1 if it is in daylight time, otherwise 0.\n\
    \n`O`\nDifference to Greenwich time (GMT) in hours\nExample: +0200\n\n`P`\nDifference\
    \ to Greenwich time (GMT) in hours with colon between hours and minutes\nExample:\
    \ +02:00\n\n`T`\nAbbreviation for time zone\nExample: `EST`, `MDT`\n\n`Z`\nTime\
    \ zone offset in seconds. The offset for time zones west of UTC is always negative\
    \ and for time zones east of UTC it is always positive.\n-43200 to 50400\n\n###\
    \ Complete date/time\n`c`\nISO 8601 date\n2004-02-12T15:19:21+00:00\n\n`r`\nAccording\
    \ to RFC 2822 formatted date\nExample: Thu, 21 Dec 2000 16:01:07 +0200\n\n`U`\n\
    Seconds since the Unix epoch (1 January 1970, 00:00:00 GMT)\n\n### Text functions\
    \ (String operations)\n\nIn PHP, there are a large number of functions for manipulating\
    \ text, such as splitting a longer string and assemble it different again, search\
    \ for characters, and more. I wish to show you the key functions, so that you\
    \ can solve almost all the problems of the manipulation of strings. There are\
    \ many other functions, which would be beyond the scope of this book for beginners.\
    \ But you can find some links at the end of the book to sites where all available\
    \ PHP functions are explained.\n\n#### `str_replace`\nA function that is commonly\
    \ used is `str_replace`. This function looks at a text after the occurrence of\
    \ a particular string and replaces it. The first parameter is the text to replace,\
    \ the second is the one to be used instead of this text, and the third is the\
    \ text be searched in. The function returns the complete text with replaced needles.\
    \ As an optional parameter, you could specify the number of replacements to performed.\
    \ Here is an example for application:\n\n```php\n<?php\n$myText = \"I am learning\
    \ to program Java\";\necho $myText;\n$myText = str_replace(\"Java\", \"PHP\",\
    \ $myText);\necho \"<br />\";\necho $myText;\n?>\n```\nOutput:\nI am learning\
    \ to program Java\nI am learning to program PHP\n\n#### `substr`\nAnother text\
    \ function that is used frequently is `substr()`. This is the abbreviation for\
    \ substring. It allows you to detach a part of a string. The first parameter that\
    \ the function expects is the string, the second is point – counting from 0, to\
    \ get returned for the first character from part of your text (substring) – as\
    \ as optional parameter, the third one is length of returned string. Here is another\
    \ example:\n\n```php\n<?php\n$myText = \"I am learning to program PHP\";\necho\
    \ $myText;\n$myText = substr($myText, 5, 8);\necho \"<br />\";\necho $myText;\n\
    ?>\n```\nOutput:\nI am learning to program PHP\nning to le\n\n#### `strtolower`\n\
    This function returns a given string in lowercase:\n\n```php\n<?php\n$myText =\
    \ \"I am learning to program PHP\";\necho $myText;\n$myText = strtolower($myText);\n\
    echo \"<br />\";\necho $myText;\n?>\n```\nOutput:\nI am learning to program PHP\n\
    i am learning to program php\n\n#### `toupper`\nThis function returns a given\
    \ string in uppercase:\n\n```php\n<?php\n$myText = \"I am learning to program\
    \ PHP\";\necho $myText;\n$myText = strtoupper($myText);\necho \"<br />\";\necho\
    \ $myText;\n?>\n```\nOutput:\nI am learning to program PHP\nI AM LEARNING TO PHP\n\
    \n#### `strpos`\nWith this function, you can search for a particular character\
    \ or string within a text. This is used, for example, in combination with the\
    \ above stated `substr`. The first parameter you need to pass is the text be searched,\
    \ while the second one is the string searched. It is entered in the format `strpos(string,\
    \ search term, from character)`. Here's an example:\n\n```php\n<?php\n$myText\
    \ = \"I am learning to program PHP\";\necho strpos($myText, \"learn\");\n?>\n\
    ```\nOutput:\n5\n\n#### `strrpos`\nIt is entered in the format `strrpos(string,\
    \ search term, from character)`. This function is used as `strpos` to find a specific\
    \ string within a text, but the last occurrence of the string searched is returned:\n\
    \n```php\n<?php\n$myText = \"I am learning to program PHP\";\necho strrpos($myText,\
    \ \"m\");\n?>\n```\nOutput:\n23\n\n#### `strlen`\nThis function returns the length\
    \ of a string.\n\n```php\n<?php\n$myText = \"I am learning to program PHP\";\n\
    echo strlen($myText);\n?>\n```\nOutput:\n28\n\n#### `explode`\nSometimes, you\
    \ would use the `explode()` function in your projects. This splits a string by\
    \ a delimiter into an array. You could, for example, multiply values from a text\
    \ file with the piped `|` standing in a row, and then read as follows:\n\n```php\n\
    <?php\n$myText = \"value1|value2|value3\";\n$valueArray = explode(\"|\", $myText);\n\
    var_dump($valueArray);\n?>\n```\nOutput:\narray(3) { [0]=> string(5) \"value1\"\
    \ [1]=> string(5) \"value2\" [2]=> string(5) \"value3\" }\n\n#### `implode`\n\
    With the `implode` function, you can accomplish exactly the opposite: You can\
    \ create a string from an array, while each value has the possibility to separate,\
    \ on request, by means of a separator (glue).\n\n```php\n<?php\n$meinArray = array(\"\
    Hello\", \"World,\", \"how\", \"are\", \"you?\");\n$text = implode(\" \", $meinArray);\n\
    echo $text;\n?>\n```\nOutput:\nHello World, how are you?\n\n### Write your own\
    \ functions\nWe have already learnt a lot of useful functions that are included\
    \ in PHP. But it is also possible to write your own functions. A PHP function\
    \ must always consist of a name and optionally specified parameters. Here is an\
    \ example of two functions to which we give a numerical value and a value for\
    \ the sales tax. So a net to gross amount and vice versa is calculated:\n\n```php\n\
    <?php\nfunction toNetto($amount, $vat_percent = 20) {\n  $amount_netto = $amount\
    \ / (100 + $vat_percent) * 100;\n  return $amount_netto;\n}\nfunction toBrutto($amount,\
    \ $vat_percent = 20) {\n  $amount_brutto = $amount * (100 + $vat_percent) / 100;\n\
    \  return $amount_brutto;\n}\n$amount = 1000;\n$amount_brutto = toBrutto($amount);\n\
    echo $amount_brutto;\necho \"<br />\";\necho toNetto($amount_brutto);\n?>\n```\n\
    Output:\n1200\n1000\n\nIn this example, we have included some of the same special\
    \ features of functions. A function is defined with the preceding word function.\
    \ Our two functions have two parameters each: One is for the amount and the tax\
    \ rate; the second parameter is present in the function definition, which is already\
    \ filled with the value 20. This means that the parameter is optional and if it\
    \ is not specified when calling the function, the value specified in the definition\
    \ is used. Let us, for example, convert an amount of the Austrian VAT (20%) to\
    \ the German VAT (19%), which goes with our two functions easily:\n\n```php\n\
    <?php\nfunction toNetto($amount, $vat_percent = 20) {\n  $amount_netto = $amount\
    \ / (100 + $vat_percent) * 100;\n  return $amount_netto;\n}\nfunction toBrutto($amount,\
    \ $vat_percent = 20) {\n  $amount_brutto = $amount * (100 + $vat_percent) / 100;\n\
    \  return $amount_brutto;\n}\n$price_austria = 1256;\n$price_netto = toNetto($price_austria);\n\
    $price_germany = toBrutto($price_netto, 19);\necho round($price_germany, 2);\n\
    ?>\n```\nOutput:\n1245.53\n\nWith the `round()` function at the end we make the\
    \ number better readable.\n"
