- fmt: "\nIn our previous first PHP script, we wrote the text \"Hello World!\". Now\
    \ we would not set the text right behind the `echo` command, but save it first\
    \ in a variable and then the `echo` command should give us the content of this\
    \ variable.\n\n```php\n<?php\n  $myText = \"Hello World!\";\n  echo $myText;\n\
    ?>\n```\n\nIn PHP variables are preceded by a dollar sign (`$`). The variable\
    \ name is arbitrary, but it must not contain spaces, but only small and uppercase\
    \ letters, numbers and underscores.\n\nTo print the contents of several variables\
    \ in succession, they must be separated by a point:\n\n```php\n<?php\n  $part1\
    \ = \"Hello \";\n  $part2 = \"World!\";\n  echo $part1 . $part2;\n?>\n```\n\n\
    This gives the same output as in our first example. We can also output text blocks\
    \ with variables together:\n\n```php\n<?php\n  $part1 = \"Hello\";\n  echo $part1\
    \ . \" World!\";\n?>\n```\n\nIf you are looking for errors in a program, use the\
    \ command `var_dump` any time to find out by means of the function, the nature\
    \ of the information within a variable:\n\n```php\n<?php\n  $part1 = \"Hello\"\
    ;\n  var_dump($part1);\n?>\n```\n\nOutput:\n`string(5) \"Hello\"`\n\nThis means\
    \ that the contents of our variable is of type \"string\" and contains a string\
    \ with 5 characters, namely \"Hello\".\n\n### Comment the code\n\nIf our scripts\
    \ are only a few lines long, it is easy to recognize at first glance what a code\
    \ block does. However, as soon as the script becomes longer, it may be necessary\
    \ to leave comments within the program code, so that everyone who reads the code\
    \ later immediately knows what the following lines of code object are.\n\nThere\
    \ are single-line and multi-line comments in PHP. Line comments start with two\
    \ forward slashes `//`. Anything written after the two slashes on the current\
    \ line is no longer treated as a code.\n\nMulti-line comments begin with a slash\
    \ and a star, `/*`, and end with a star and a slash, `*/`.\n\nHere is another\
    \ example:\n\n```php\n<?php\n  // I am a single line comment\n  echo \"I am code\"\
    ;\n  /*\n  I\n  am\n  a\n  multiline\n  comment\n  */\n?>\n```\n\nThis script\
    \ outputs only the following text:\n`I am code`\n\nA good programmer should, of\
    \ course, always have as a goal writing a program code that reveals all purposes\
    \ on its own. This can be achieved, for example, by logical variable and function\
    \ names. Variables termed `$a`, `$b`, and `$c` indicate ‘less than’ if the variables\
    \ are named `$total_price`, `$sales_tax`, and `$gross_price`.\n\nNevertheless,\
    \ for example, it is helpful if you write meaningful comments when you are programming\
    \ complex algorithms or codes. You could divide the program code via comments\
    \ in several blocks.\n\nSo, should a program block start with the comment,\n\n\
    ```php\n/*****************\nprocess user input\n*****************/\n```\n\nand\
    \ the next block is labelled as follows:\n\n```php\n/*****************\nperform\
    \ calculations\n*****************/\n```\n\nand the last block, for example, is\
    \ as follows:\n\n```php\n/*****************\noutput results\n*****************/\n\
    ```\n\nthen any programmer, who wants to update the calculations, knows immediately\
    \ in which area of the code he has to look.\n\n### Arithmetic operations (basic\
    \ arithmetic)\n\nIf you save only numbers in variables instead of letters, then\
    \ you can calculate with these.\n\nHere is an example (in this example, the HTML\
    \ code `<br />` is used, which is indicated in the browser as a line break):\n\
    \n```php\n<?php\n  $number1 = 2;\n  $number2 = 3;\n  $addition = $number1 + $number2;\n\
    \  $subtraction = $number1 - $number2;\n  $multiplication = $number1 * $number2;\n\
    \  $division = $number1 / $number2;\n  echo \"Number 1: \" . $number1;\n  echo\
    \ \"<br />\";\n  echo \"Number 2: \" . $number2;\n  echo \"<br />\";\n  echo \"\
    <br />\";\n  echo \"Addition: \" . $addition;\n  echo \"<br />\";\n  echo \"Subtraction:\
    \ \" . $subtraction;\n  echo \"<br />\";\n  echo \"Multiplication: \" . $multiplication;\n\
    \  echo \"<br />\";\n  echo \"Division: \" . $division;\n?>\n```\n\nThis script\
    \ has the following output in the browser:\n`Number 1: 2`\n`Number 2: 3`\n`Addition:\
    \ 5`\n`Subtraction: -1`\n`Multiplication: 6`\n`Division: 0.66666666666667`\n\n\
    There is an alternative spelling for simple arithmetic:\n\n```php\n<?php\n  $value1\
    \ = 2;\n  $value2 = 3;\n  $value1 = $value1 + $value2;\n  $value2 = $value2 *\
    \ $value2;\n  echo $value1;\n  echo \"<br />\";\n  echo $value2;\n?>\n```\n\n\
    It gives the same output as following:\n\n```php\n<?php\n  $value1 = 2;\n  $value2\
    \ = 3;\n  $value1 += $value2;\n  $value2 *= $value2;\n  echo $value1;\n  echo\
    \ \"<br />\";\n  echo $value2;\n?>\n```\nOutput:\n`5`\n`9`\n\nAs a small task,\
    \ you could write a script that calculates the following: One website has 30,000\
    \ visitors daily. An ad-blocking-in is used by 60% of the visitors. In other words,\
    \ 40% of the visitors see a banner on our website. For 1,000 clicks, we get €200.\
    \ How much do we earn per month (calculated as 30 days)? Use all values in the\
    \ variables; then you can calculate very fast how much we could earn when our\
    \ website has 100,000 visitors daily. The answer is on the next page. As a solution,\
    \ you should get the following: €240 and €800. Example solution:\n\n```php\n<?php\n\
    \  $dailyVisitors = 30000;\n  $sees = $dailyVisitors * 0.4; // 60% blocked\n \
    \ $clickratio = 0.1;\n  $earnings = 200; // per 1000 clicks\n  $clicks = $ads\
    \ * $clickratio;\n  echo ($clicks / 1000) * $earnings;\n?>\n```\n\n### Combining\
    \ several variables (arrays)\n\nIf you have several variables to represent a number\
    \ of similar values, it makes sense to include them in an array. Here are two\
    \ examples that have the same output:\n\n```php\n<?php\n  $value1 = 2;\n  $value2\
    \ = 4;\n  $value3 = 8;\n  $value4 = 16;\n  $value5 = 32;\n  echo $value1 . \"\
    <br />\";\n  echo $value2 . \"<br />\";\n  echo $value3 . \"<br />\";\n  echo\
    \ $value4 . \"<br />\";\n  echo $value5 . \"<br />\";\n?>\n```\n\n```php\n<?php\n\
    \  $valueArray = array(2,4,8,16,32);\n  echo $valueArray[0] . \"<br />\";\n  echo\
    \ $valueArray[1] . \"<br />\";\n  echo $valueArray[2] . \"<br />\";\n  echo $valueArray[3]\
    \ . \"<br />\";\n  echo $valueArray[4] . \"<br />\";\n?>\n```\n\nBoth have the\
    \ following output:\n`2`\n`4`\n`8`\n`16`\n`32`\n\nYou can access the values of\
    \ an array by using `$array[index]`. The entries are numbered in ascending order\
    \ from 0 to the number of elements. You can also set the index by yourself:\n\n\
    ```php\n<?php\n  $myArray = array(\"index1\" => \"value1\");\n  echo $myArray[\"\
    index1\"];\n  echo \"<br />\";\n  $myArray[\"index1\"] = \"value2\";\n  echo $myArray[\"\
    index1\"];\n?>\n```\n\nOutput:\n`value1`\n`value2`\n\nLater, we will learn how\
    \ to automate the output of all the values in an array in succession and process\
    \ them. This is useful in arrays that contain dozens of entries.\n\n#### Sort\
    \ arrays\n\nIf we fill an array dynamically and we want to sort the values alphabetically,\
    \ there is a simple function: `sort()`.\n\n```php\n<?php\n  $myArray = array(\"\
    Zita\", \"Anton\", \"Hans\");\n  // unsorted output\n  echo $myArray[0];\n  echo\
    \ \"<br />\";\n  echo $myArray[1];\n  echo \"<br />\";\n  echo $myArray[2];\n\
    \  // Sort array\n  sort($myArray);\n  echo \"<br /><br />\";\n  // Sorted output\n\
    \  echo $myArray[0];\n  echo \"<br />\";\n  echo $myArray[1];\n  echo \"<br />\"\
    ;\n  echo $myArray[2];\n?>\n```\n\nOutput:\n`Zita`\n`Anton`\n`Hans`\n`Anton`\n\
    `Hans`\n`Zita`\n\n#### Multidimensional arrays\n\nAn array could, again, contain\
    \ as a value, another array:\n\n```php\n<?php\n  $myArray = array();\n  $myArray[\"\
    index1\"] = array(\"value1\", \"value2\");\n  $myArray[\"index2\"] = array(\"\
    value3\", \"value4\");\n  echo $myArray[\"index1\"][0];\n  echo \"<br />\";\n\
    \  echo $myArray[\"index2\"][1];\n?>\n```\n\nOutput:\n`value1`\n`value4`\n\nSo,\
    \ you could save coordinates and read them, for example, as a coordinate system\
    \ with X, Y:\n\n```php\n<?php\n  //...\n  echo $chessboard[10][2];\n?>\n```\n\n\
    This would depend on how your script is constructed. For example, you could show\
    \ the pitch in the 10th row and the second column.\n\n## Day 2\n\n### Fill variables\
    \ with user information (GET / POST)\n"
  raw: "In our previous first PHP script, we wrote the text \"Hello World!\". Now\
    \ we would not set the text right behind the echo command, but save it first in\
    \ a variable and then the echo command should give us the content of this variable.\n\
    \n<?php\n\n  $myText = \"Hello World!\";\n\n  echo $myText;\n\n?>\n\nIn PHP variables\
    \ are preceded by a dollar sign ($). The variable name is arbitrary, but it must\
    \ not contain spaces, but only small and uppercase letters, numbers and underscores.\n\
    \nTo print the contents of several variables in succession, they must be separated\
    \ by a point:\n\n<?php\n\n  $part1 = \"Hello \";\n\n  $part2 = \"World!\";\n\n\
      echo $part1 . $part2;\n\n?>\n\nThis gives the same output as in our first example.\
    \ We can also output text blocks with variables together:\n\n<?php\n\n  $part1\
    \ = \"Hello\";\n\n  echo $part1 . \" World!\";\n\n?>\n\nIf you are looking for\
    \ errors in a program, use the command var\\_dump any time to find out by means\
    \ of the function, the nature of the information within a variable:\n\n<?php\n\
    \n  $part1 = \"Hello\";\n\n  var\\_dump($part1);\n\n?>\n\nOutput:\n\nstring(5)\
    \ \"Hello\"\n\nThis means that the contents of our variable is of type \"string\"\
    \ and contains a string with 5 characters, namely \"Hello\".\n\n### Comment the\
    \ code\n\nIf our scripts are only a few lines long, it is easy to recognize at\
    \ first glance what a code block does. However, as soon as the script becomes\
    \ longer, it may be necessary to leave comments within the program code, so that\
    \ everyone who reads the code later immediately knows what the following lines\
    \ of code object are.\n\nThere are single-line and multi-line comments in PHP.\
    \ Line comments start with two forward slashes //. Anything written after the\
    \ two slashes on the current line is no longer treated as a code.\n\nMulti-line\
    \ comments begin with a slash and a star, /\\*, and end with a star and a slash,\
    \ \\*/.\n\nHere is another example:\n\n<?php\n\n  // I am a single line comment\n\
    \n  echo \"I am code\";\n\n  /\\*\n\n  I\n\n  am\n\n  a\n\n  multiline\n\n  comment\n\
    \n  \\*/\n\n?>\n\nThis script outputs only the following text:\n\nI am code\n\n\
    A good programmer should, of course, always have as a goal writing a program code\
    \ that reveals all purposes on its own. This can be achieved, for example, by\
    \ logical variable and function names. Variables termed $a, $b, and $c indicate\
    \ ‘less than’ if the variables are named $total\\_price, $sales\\_tax, and $gross\\\
    _price.\n\nNevertheless, for example, it is helpful if you write meaningful comments\
    \ when you are programming complex algorithms or codes. You could divide the program\
    \ code via comments in several blocks.\n\nSo, should a program block start with\
    \ the comment,\n\n/\\* \\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\\
    *\\*\n\nprocess user input\n\n\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\\
    *\\*\\*\\*\\* \\*/\n\nand the next block is labelled as follows:\n\n/\\* \\*\\\
    *\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\n\nperform calculations\n\
    \n\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\* \\*/\n\nand the\
    \ last block, for example, is as follows:\n\n/\\* \\*\\*\\*\\*\\*\\*\\*\\*\\*\\\
    *\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\n\noutput results\n\n\\*\\*\\*\\*\\*\\*\\*\\*\\\
    *\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\* \\*/\n\nthen any programmer, who wants to update\
    \ the calculations, knows immediately in which area of the code he has to look.\n\
    \n### Arithmetic operations (basic arithmetic)\n\nIf you save only numbers in\
    \ variables instead of letters, then you can calculate with these.\n\nHere is\
    \ an example (in this example, the HTML code <br /> is used, which is indicated\
    \ in the browser as a line break):\n\n<?php\n\n  $number1 = 2;\n\n  $number2 =\
    \ 3;\n\n  $addition = $number1 + $number2;\n\n  $subtraction = $number1 - $number2;\n\
    \n  $multiplication = $number1 \\* $number2;\n\n  $division = $number1 / $number2;\n\
    \n  echo \"Number 1: \" . $number1;\n\n  echo \"<br />\";\n\n  echo \"Number 2:\
    \ \" . $number2;\n\n  echo \"<br />\";\n\n  echo \"<br />\";\n\n  echo \"Addition:\
    \ \" . $addition;\n\n  echo \"<br />\";\n\n  echo \"Subtraction: \" . $subtraction;\n\
    \n  echo \"<br />\";\n\n  echo \"Multiplication: \" . $multiplication;\n\n  echo\
    \ \"<br />\";\n\n  echo \"Division: \" . $division;\n\n?>\n\nThis script has the\
    \ following output in the browser:\n\nNumber 1: 2\n\nNumber 2: 3\n\nAddition:\
    \ 5\n\nSubtraction: -1\n\nMultiplication: 6\n\nDivision: 0.66666666666667\n\n\
    There is an alternative spelling for simple arithmetic:\n\n<?php\n\n  $value1\
    \ = 2;\n\n  $value2 = 3; \n\n  $value1 = $value1 + $value2;\n\n  $value2 = $value2\
    \ \\* $value2;\n\n  echo $value1;\n\n  echo \"<br />\";\n\n  echo $value2;\n\n\
    ?>\n\nIt gives the same output as the following:\n\n<?php\n\n  $value1 = 2;\n\n\
      $value2 = 3; \n\n  $value1 += $value2;\n\n  $value2 \\*= $value2;\n\n  echo\
    \ $value1;\n\n  echo \"<br />\";\n\n  echo $value2;\n\n?>\n\nOutput:\n\n5\n\n\
    9\n\nAs a small task, you could write a script that calculates the following:\n\
    \nOne website has 30,000 visitors daily.\n\nAn ad-blocking plug-in is used by\
    \ 60% of the visitors. In other words, 40% of the visitors see a banner advertisement\
    \ on our website. Of these 40% visitors, 10% click on the banners. For every 1,000\
    \ clicks, we get €200.\n\nHow much do we earn per month (calculated as 30 days)?\n\
    \nUse all values in the variables; then you can calculate very fast how much we\
    \ could earn when our website has 100,000 visitors daily.\n\nThe answer is on\
    \ the next page.\n\nAs a solution, you should get the following: €240 and €800.\n\
    \nExample solution:\n\n<?php\n\n  $dailyVisitors = 30000;\n\n  $seesads = 0.4;\
    \ // 60% get blocked\n\n  $clickratio = 0.1;\n\n  $earnings = 200; // per 1000\
    \ clicks\n\n  $ads = $dailyVisitors \\* $seesads;\n\n  $clicks = $ads \\* $clickratio;\n\
    \n  echo ($clicks / 1000) \\* $earnings;\n\n?>\n\n### Combining several variables\
    \ (arrays)\n\nIf you have several variables to represent a number of similar values,\
    \ it makes sense to include them in an array.\n\nHere are two examples that have\
    \ the same output:\n\n<?php\n\n  $value1 = 2;\n\n  $value2 = 4;\n\n  $value3 =\
    \ 8;\n\n  $value4 = 16;\n\n  $value5 = 32;\n\n  echo $value1 . \"<br />\";\n\n\
      echo $value2 . \"<br />\";\n\n  echo $value3 . \"<br />\";\n\n  echo $value4\
    \ . \"<br />\";\n\n  echo $value5 . \"<br />\";\n\n?>\n\n<?php\n\n  $valueArray\
    \ = array(2,4,8,16,32);\n\n  echo $valueArray\\[0\\] . \"<br />\";\n\n  echo $valueArray\\\
    [1\\] . \"<br />\";\n\n  echo $valueArray\\[2\\] . \"<br />\";\n\n  echo $valueArray\\\
    [3\\] . \"<br />\";\n\n  echo $valueArray\\[4\\] . \"<br />\";\n\n?>\n\nBoth have\
    \ the following output:\n\n2\n\n4\n\n8\n\n16\n\n32\n\nYou can access the values\
    \ of an array by using $array\\[index\\]. The entries are numbered in ascending\
    \ order from 0 to the number of elements. You can also set the index by yourself:\n\
    \n<?php\n\n  $myArray = array(\"index1\" => \"value1\");\n\n  echo $myArray\\\
    [\"index1\"\\];\n\n  echo \"<br />\";\n\n  $myArray\\[\"index1\"\\] = \"value2\"\
    ;\n\n  echo $myArray\\[\"index1\"\\];\n\n?>\n\nOutput:\n\nvalue1\n\nvalue2\n\n\
    Later, we will learn how to automate the output of all the values in an array\
    \ in succession and process them. This is useful in arrays that contain dozens\
    \ of entries.\n\n#### Sort arrays\n\nIf we fill an array dynamically and we want\
    \ to sort the values alphabetically, there is a simple function: sort();\n\n<?php\n\
    \n  $myArray = array(\"Zita\", \"Anton\", \"Hans\");\n\n  // unsorted output\n\
    \n  echo $myArray\\[0\\];\n\n  echo \"<br />\";\n\n  echo $myArray\\[1\\];\n\n\
      echo \"<br />\";\n\n  echo $myArray\\[2\\];\n\n  // Sort array\n\n  sort($myArray);\n\
    \n  echo \"<br /><br />\";\n\n  // Sorted output\n\n  echo $myArray\\[0\\];\n\n\
      echo \"<br />\";\n\n  echo $myArray\\[1\\];\n\n  echo \"<br />\";\n\n  echo\
    \ $myArray\\[2\\];\n\n?>\n\nOutput:\n\nZita\n\nAnton\n\nHans\n\nAnton\n\nHans\n\
    \nZita\n\n#### Multidimensional arrays\n\nAn array could, again, contain as a\
    \ value, another array:\n\n<?php\n\n  $myArray = array();\n\n  $myArray\\[\"index1\"\
    \\] = array(\"value1\", \"value2\");\n\n  $myArray\\[\"index2\"\\] = array(\"\
    value3\", \"value4\");\n\n  echo $myArray\\[\"index1\"\\]\\[0\\];\n\n  echo \"\
    <br />\";\n\n  echo $myArray\\[\"index2\"\\]\\[1\\];\n\n?>\n\nOutput:\n\nvalue1\n\
    \nvalue4\n\nSo, you could save coordinates and read them, for example, as a coordinate\
    \ system with X, Y:\n\n<?php\n\n  \\[...\\]\n\n  echo $chessboard\\[10\\]\\[2\\\
    ];\n\n?>\n\nThis would depend on how your script is constructed. For example,\
