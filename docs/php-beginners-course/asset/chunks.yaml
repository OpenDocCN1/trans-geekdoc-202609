    ## 序言


    ### 欢迎！


    你想快速学习 `PHP` 吗？本书是正确的选择。你将学习 `PHP` 的基础知识。


    从在你的电脑上搭建服务器开始。随后，你将学习如何运行第一个 `PHP` 脚本。然后你将学习如何使用数据库。


    ### 先决条件


    不需要特殊知识。如果你想学习 `PHP`，我假设你了解一些 `HTML`。


    在硬件方面，你需要一台带有显示器、键盘的电脑。由于我们要开发网站，当然需要连接互联网。


    你可以使用任何操作系统。本书将向你介绍如何在 `Windows`、`Linux` 和 `MacOS` 上安装现代文本编辑器，并提供一些示例。


    ### 第一天


    ### PHP – 定义与历史


    `PHP` 是一种主要用于开发动态网页的脚本语言。`PHP` 脚本在服务器上执行，而不是在访问者的浏览器中执行。


    `PHP` 由 Rasmus Lerdorf 于 1995 年开发。他的目标是为一组常用的 Perl 脚本创建一个简单的替代品。这就是个人首页工具（PHP）的由来。不久后，他用
    `C` 语言重新创建了这个工具集。今天，`PHP` 仍然用 `C` 开发。


    1998 年，Andi Gutmans 和 Zeev Suraski 与 Lerdorf 合作，从零创建了 `PHP 3`，使其可用，特别是在蓬勃发展的电子商务领域。Gutmans
    和 Suraski 创立了 Zend Technologies 公司，该公司贡献了 `PHP 4` 的大部分部分。


    2004 年，`PHP5` 增强了对面向对象的支持，并大大提高了 `PHP` 解释器的速度。


    十年后，2015 年发布了 `PHP 7`。它由一个全新的引擎驱动，速度极快。`PHP 6` 被跳过了，因为计划执行的项目从未完成，因此开发者们专注于一个全新的内核。大多数脚本的执行速度比
    `PHP 5` 快一倍。大多数旧的 `PHP 5` 脚本只需要少量修改即可在 `PHP 7` 中运行。本书中的脚本均已更新为完全兼容的版本。


    ### 搭建开发环境（Windows, Linux 或 Mac OS）


    #### Windows


    在 Windows 上，预制的服务器包让安装服务器变得极其简单。对于开发，我倾向于使用 `Xampp` 软件包（`www.apachefriends.org`）。


    '
- fmt: '

    Download the installer for Windows and run the installation. I recommend to keep
    `C:/xampp/` as the default folder path. If you install the package under `C:/Programs/XAMPP/`,
    the server may make problems because the necessary file permissions are not set
    correctly. During the installation, it will be asked whether the individual server
    components should be installed as a service in the operating system. You must
    not do so, otherwise the server will constantly run in the background (until you
    stop the services manually), consume resources, and will be continuously available
    over the network.


    ### Linux


    In Linux, it would be better to install an Apache web server and a MySQL server
    using the Package Manager and to perform the configuration manually. But, for
    this book, I recommend that the beginners use a prepared package from `www.apachefriends.org`,
    which has all the necessary server features and PHP extensions. Beneath the download
    links, you will find the Linux installation instructions and some tips on how
    you can start and stop the server quickly.


    ### MacOS


    There are `Apachefriends.org` packages even for MacOS. But I prefer the package
    of `MAMP` for MacOS users. Its operation is similar but has given me fewer problems.
    The application is available for free under `www.mamp.info`. There is also a paid
    Pro version, but we do not need this for our first programming experience. After
    downloading the setup file, please install `MAMP` in your `Application` folder.


    All the abovementioned server packages contain a directory with the label `htdocs`.
    We will use this to store files that can be accessed via a browser from the server.
    So, open your browser and enter the following URL: `http://127.0.0.1`


    Under MacOS, you have to enter the port number of the server (the default number
    is `4444`, so the entire URL should be: `http://127.0.0.1:4444`)


    You should be greeted from your server package’s website (`XAMPP` / `MAMP`) and
    receive some information about the server.


    `127.0.0.1` always leads to the local computer. This means that the browser tries
    to find a local web server. Alternatively, you could use `http://localhost`. This
    should lead to the same result.


    ### Text editors


    Each operating system has a lot of good text editors. However, in this case, `Microsoft
    Office Word` or `LibreOffice Writer` cannot be regarded as text editors because
    they save a lot of information about the page and text formatting apart from the
    text. A text editor saves the exact characters of the entered text as it appears
    in the editor. Modern editors colour text to make it more readable. The colouring
    will not be saved, but shown dynamically when you reopen the file. This function
    is called `syntax highlighting`. Syntax is the term used to describe the code,
    and highlighting it in a text editor means that various commands and functions
    of a programming language are coloured.


    There are also Integrated Development Environments (IDEs), which help a lot to
    write and manage the program code and all other parts of a software project. IDEs
    automatically detect cross-references to functions in the program code and can
    display the recently used functions while writing notes.


    There are large IDE projects, which are available as open source items, or under
    different licenses for all operating systems. Many developers use the IDEs `Eclipse`
    (`www.eclipse.org`) or `NetBeans` (`www.netbeans.org`).


    If you have a low-performance computer or want to quickly test some short PHP
    scripts, then I recommend using the text editor `jEdit`, which has been developed
    as an open source software and can be downloaded from `www.jedit.org`. In the
    larger Linux distributions, `jEdit` is available via a Software Channel (Package
    Manager) in a somewhat outdated version.


    For this book, it does not matter whether you are using an IDE or a simple text
    editor. If you are going to be a professional PHP developer, you will come in
    contact with an IDE sooner or later.


    In order to issue a specific recommendation, I would personally suggest that you
    write the first scripts in a text editor like `jEdit`, and more advanced scripts
    into the surface of an IDE, only after finishing a handful of small PHP projects.


    ### The first PHP program (Welcome the whole world)


    We will now write our first small PHP script.


    Open the text editor of your choice and type in the following lines of code:


    ```php

    <?php

    echo "Hello World!";

    ?>

    ```


    Save this text in the `htdocs` folder inside the web server installation and name
    the file `hello.php`.


    Already the file extension `.php` shows that there is a PHP script on one file.
    Our script begins with the line `<?php` are PHP code and not `1`, which our server
    will recognize that the following lines to `?>` output, but to be first processed
    by our PHP interpreter.


    In the world of programming, there are so-called interpreters and compilers. Compilers
    first process a complete program code and generate a finished program in machine
    language that can be supplied clean packed, for example in an `.exe` or `.app`
    file to the customer. This process is called `compiling`. The compilation of complex
    projects can sometimes take a long time. Especially in the field of dynamic web
    development the visitors don’t want to wait to long for the site to be fully assembled.
    So PHP is always interpreted fresh out of the code, that is, on every page request
    the code line by line and went for quasi live assembled the page (it is still
    only the finished page delivered to the visitors).


    In our short code example, we find also the line `echo "Hello World!";` which
    is our original script. Each command within PHP is terminated with a semicolon
    `;`, which is located at the end of the line. A command could be long over several
    lines, then only the last line is terminated with a semicolon. The `echo` command
    returns in PHP a text string to the visitor''s browser. Strings must be enclosed
    by quotation marks, so that PHP knows what’s a command and what’s a string. Whether
    single or double quotes are used, in most cases, does not matter.


    When we call now following in our browser the following address


    http://127.0.0.1/hello.php` (or `http://127.0.0.1:4444/hello.php` depending on
    the operating system)


    our script from PHP gets executed.


    If the server is set up correctly and the PHP script could be executed, then the
    following output is displayed within the browser:


    Hello World!


    If this is the case for you, congratulations on your first PHP script.


    If not, it could be a possible source of error that either the server is not running
    or has disabled itself, or that the semicolon is missing at the end of the line
    of code with the `echo` command.


    ### Variables (information stores)


    One of the key components of a modern programming language are variables. These
    serve as small information stores. Variables can store values of various kinds.
    E.g. text characters (called `String`), numbers (without decimal digits they are
    named `Integer`, with Decimal or `Float`), a date or a number of other values.


    In many programming languages you to define which type of values you want to save
    when you create a variable. So there are `Char` variables that can store text
    strings only, or so-called `integer` variables, where you can store numbers. PHP
    is dynamic in variable types. You don’t need to specify whether a variable can
    only store numbers, characters, or else a certain type of information. A variable
    in PHP can also first contain a text and later in the script only a sequence of
    numbers.


    Later in this text you will learn how to anticipate or control the variable program
    runoff depending on the current value of a variable.

