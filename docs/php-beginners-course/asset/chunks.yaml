    下载 Windows 安装程序并运行安装。我建议将 `C:/xampp/` 保为默认文件夹路径。如果你将包安装在 `C:/Programs/XAMPP/`
    目录下，服务器可能会出现问题，因为必要的文件权限没有正确设置。在安装过程中，系统会询问是否应将各个服务器组件作为操作系统的服务进行安装。你不应该这样做，否则服务器将在后台持续运行（直到你手动停止服务），消耗资源，并在网络上持续可用。


    ### Linux


    在 Linux 中，最好使用软件包管理器（Package Manager）安装 Apache Web 服务器和 MySQL 数据库服务器，并手动进行配置。但对于这本书来说，我建议初学者使用从
    `www.apachefriends.org` 获取的预编译包，它包含了所有必要的服务器功能和 PHP 扩展。在下载链接下方，你将找到 Linux 安装说明以及一些关于如何快速启动和停止服务器的提示。


    ### MacOS


    针对 MacOS 甚至有 `Apachefriends.org` 的程序包。但我更倾向于让 MacOS 用户使用 `MAMP` 程序包。它的操作虽然类似，但给我带来的问题更少。该应用程序可以在
    `www.mamp.info` 免费获取。它还有一个付费的 Pro 版本，但我们初次编程体验不需要它。下载安装文件后，请将 `MAMP` 安装在你的 `Application`
    文件夹中。


    上述所有服务器包都包含一个标记为 `htdocs` 的目录。我们将使用它来存储可以通过浏览器从服务器访问的文件。因此，打开你的浏览器并输入以下 URL：`http://127.0.0.1`


    在 MacOS 下，你必须输入服务器的端口号（默认数字为 `4444`，因此整个 URL 应该为：`http://127.0.0.1:4444`）


    你将看到来自服务器包网站（`XAMPP` / `MAMP`）的欢迎，并收到一些关于服务器的信息。


    `127.0.0.1` 总是本地计算机。这意味着浏览器尝试寻找本地 Web 服务器。或者，你可以使用 `http://localhost`。这应该产生相同的结果。


    ### 文本编辑器


    每个操作系统都有很多文本编辑器。然而，在这种情况下，`Microsoft Office Word` 或 `LibreOffice Writer` 不能被视为文本编辑器，因为它们除了文本之外还保存了大量关于页面和文本格式的信息。文本编辑器按照输入文本在编辑器中显示的样式保存精确的字符。现代编辑器会对文本着色以提高其可读性。这种颜色不会被保存，而是在你重新打开文件时动态显示。这种功能被称为
    `语法高亮`（syntax highlighting）。语法是用于描述代码的术语，在文本编辑器中高亮它意味着编程语言的各种命令和函数被涂上了颜色。


    还有集成开发环境（IDE），它们对于编写和管理程序代码以及软件项目的所有其他部分非常有帮助。IDE 会自动检测程序代码中函数的交叉引用，并在编写注释时显示最近使用的函数。


    有很多大型 IDE 项目，它们以开源项目的形式提供，或者通过不同的许可证适用于所有操作系统。许多开发者使用 IDE `Eclipse`（`www.eclipse.org`）或
    `NetBeans`（`www.netbeans.org`）。


    如果你有一台性能较低的电脑，或者想快速测试一些短小的 PHP 脚本，我建议使用文本编辑器 `jEdit`，它是作为开源软件开发的，可以从 `www.jedit.org`
    下载。在较大的 Linux 发行版中，可以通过软件通道（软件包管理器）获取版本较旧的 `jEdit`。


    对于这本书来说，你正在使用 IDE 还是简单的文本编辑器并不重要。如果你打算成为一名专业的 PHP 开发者，迟早会接触到 IDE 的。


    为了给出具体的建议，我个人建议你先用像 `jEdit` 这样的文本编辑器编写第一个脚本，在完成几个小型 PHP 项目后，再将更高级的脚本进入 IDE 的界面中。


    ### 第一个 PHP 程序（欢迎整个世界）


    现在我们来编写第一个小型 PHP 脚本。


    打开你喜欢的文本编辑器并输入以下代码行：


    ```php

    <?php

    echo "Hello World!";

    ?>

    ```


