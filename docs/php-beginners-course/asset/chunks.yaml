  trans: "\n\n# 将代码拆分到多个文件\n\n到目前为止，我们只编写了少于 100 行的短脚本。一旦你处理由数万行代码组成大型项目时，单个文件内的代码很快就会变得混乱。例如，将函数集合外包到另一个\
    \ `.php` 文件并将其集成到我们的主项目文件中会更有意义。\n\n因此，我们创建了两个文件：\n\n`functions_accounting.php`\n\
    \n```php\n<?php\n\n  function toNetto($amount, $vat_percent = 20) {\n    $amount_netto\
    \ = $amount / (100 + $vat_percent) * 100;\n    return $amount_netto;\n  }\n\n\
    \  function toBrutto($amount, $vat_percent = 20) {\n    $amount_brutto = $amount\
    \ * (100 + $vat_percent) / 100;\n    return $amount_brutto;\n  }\n?>\n```\n\n\
    `vat_calculator.php`\n\n```php\n<?php\n  include \"functions_accounting.php\"\
    ;\n  $price_austria = 1256;\n  $price_netto = toNetto($price_austria);\n  $price_germany\
    \ = toBrutto($price_netto, 19);\n  echo $price_germany;\n?>\n```\n\n例如，除了我们的 `vat_calculator.php`\
    \ 之外，如果 `functions_accounting.php` 文件位于 `functions` 文件夹中，我们必须按照以下方式指定：\n\n```php\n\
    <?php\n  include \"functions/functions_accounting.php\";\n  $price_austria = 1256;\n\
    \  $price_netto = toNetto($price_austria);\n  $price_germany = toBrutto($price_netto,\
    \ 19);\n  echo $price_germany;\n?>\n```\n\n你也可以在服务器上指定绝对路径，如下：\n\n```php\n<?php\
    \ \n  include \"/var/www/web1/html/functions/functions_accounting.php\";\n?>\n\
    ```\n\n但是，如果你这样做，当你将脚本传输到不同的服务器时，路径可能会发生。\n\n# 第 4 天\n\n## 使用数据库存储和读取信息\n\n现在，我们可以查询、处理和输出大量信息。然而，我们仍然缺少一项重要功能：存储和检索数据的技术。大多数\
    \ PHP 项目使用 SQL 数据库。在每个数据库中，数据存储在表中。就像 Excel 一样，每个表由列和行组成。我们将学习如何访问它们。\n\n### 在\
    \ PHP 中连接数据库\n\n首先，我们需要从 PHP 脚本连接数据库。如果你没有按照第一章所述修改服务器的基础安装，则可以使用 `root` 用户访问数据库服务器。否则，你可能需要在服务器管理软件中分配密码。以下是连接到数据库服务器的示例：\n\
    \n```php\n<?php\n  $mysqli=new mysqli('localhost','root','password','my_db');\n\
    \  $mysqli->close();\n?>\n```\n\n`mysqli` 对象期望服务器、用户名和密码。服务器通常是 `localhost`。在脚本结束时，应尽早关闭\
    \ MySQL 连接以节省资源。\n\n### 创建新数据库\n\n如果我们成功连接到数据库服务器，我们需要选择一个数据库进行工作。大多数 Web 开发者使用图形化数据库管理工具。通过\
    \ XAMPP、MAMP 和默认预配置的 Web 服务器，这可以在 `http://localhost/phpmyadmin/` 或 `http://localhost/phpmyadmin/`\
    \ 获取。\n\n然而，我们想在脚本中直接尝试创建一个新数据库：\n\n```php\n<?php\n  $mysqli=new mysqli('localhost','root','');\n\
    \  $result=$mysqli->query(\"CREATE DATABASE test\");\n  $mysqli->close();\n  var_dump($result);\n\
    ?>\n```\n\n你已经知道了连接和断开 MySQL 服务器的功能。示例中的新函数是 `$mysqli->query`。通过查询，你告诉 MySQL 要做什么。然而，总是返回一个请求可以执行的结果。如果你运行脚本多次，只有第一次运行会收到成功消息，然后会收到指示数据库名称已分配错误消息。\n\
    \n### 选择我们的数据库\n\n如果我们知道了数据库名称，我们需要指定脚本使用它：\n\n```php\n<?php\n  $mysqli=new mysqli('localhost','root','','test');\n\
    ?>\n```\n\n使用的数据库定义为最后一个参数。所有后续查询现在发送到所选数据库。\n\n### 创建表\n\n现在我们想要创建一个表，例如存储个人记录：\n\
    \n```php\n<?php\n  $mysqli=new mysqli('localhost','root','','test');\n  $result\
    \ = $mysqli->query(\"\n  CREATE TABLE IF NOT EXISTS persons (\n    id int(10)\
    \ unsigned AUTO_INCREMENT,\n    firstname varchar(50),\n    lastname varchar(50),\n\
    \    PRIMARY KEY (id)\n  )\");\n  var_dump($result);\n?>\n```\n\n这个查询稍微复杂。我们告诉\
    \ MySQL 创建一个名为 `persons` 的表（如果它不存在）。在创建列时，我们必须指定它们的类型。与 PHP 不同，数据库服务器必须确切知道值是文本、数字还是其他类型。\n\
    \n我们创建一个类型为 `Integer(10)` 的 `id` 列。整数是不带符号的数字。`unsigned` 属性意味着不存储符号，因此将没有负号。此外，我们使用\
    \ `AUTO_INCREMENT` 表示当我们向表中插入新行时，`ID` 列与最后一个最高条目相比自动增加 1。因此，我们获得了一个连续的数字，可以在表的最后行中将其指定主键。每个表必须有一个主键。这对于每个表行必须是唯一的，以便主键允许你始终访问特定的表行。括号\
    \ `(10)` 中的数字定义了数字的长度最大为十位，因此最大数字是 `9,999,999,999`。\n\n我们还为两种可变字符（`VARCHAR`）类型的名字和姓名各创建了一个列。这意味着我们还不知道要存储的字符串长度将是多少，但我们将其限制在最多\
    \ 50 个字符。或者，我们可以使用 `TEXT` 类型，它对字符数量没有限制，但消耗的内存多得多。\n\n### 向数据库写入数据\n\n在我们创建表之后，现在将向其填充第一条数据：\n\
    \n```php\n<?php\n  $mysqli=new mysqli('localhost','root','','test');\n  $result\
    \ = $mysqli->query(\"INSERT INTO persons (firstname, lastname) VALUES ('Hans',\
    \ 'Meier');\");\n  var_dump($result);\n?>\n```\n\n如果你现在在 PhpMyAdmin 中查看表，将看到刚刚添加的条目。\n\
    \n向表中插入数据有 `INSERT INTO` SQL 语句，后面是表名和填充的字段，然后是 `VALUES` 语句以及与指定字段相同的值。如果你想向表插入多行，只需要写一次\
    \ `VALUES` 并用逗号分隔各个行值：\n\n```php\n<?php\n  $mysqli=new mysqli('localhost','root','','test');\n\
    \  $result = $mysqli->query(\"INSERT INTO persons (firstname, lastname) VALUES\
    \ ('Max', 'Meier'),('Maria', 'Mauser');\");\n  var_dump($result);\n?>\n```\n\n\
    ### 从数据库中检索数据\n\n在我们表中写入了一些行之后，我们想在脚本中再次查询它们。这是通过 `SELECT` 语句实现的：\n\n```php\n\
    <?php\n  $mysqli=new mysqli('localhost','root','','test');\n  $result = $mysqli->query(\"\
    SELECT firstname, lastname FROM persons;\");\n?>\n```\n\n"
- fmt: "\n```php\nwhile ($row = $result->fetch_array()) {\n    echo $row[\"firstname\"\
    ] . \" \" . $row[\"lastname\"] . \"<br />\";\n}\n?>\n```\n\nThe `SELECT` statement\
    \ will still be your faithful companion when you write PHP `/SQL` scripts. A data\
    \ query using `SELECT` is followed by the table columns; alternatively you could\
    \ also write a `*`, if you want to query all table columns. This is followed by\
    \ the `FROM` statement and the name of the table from which the data is to be\
    \ queried.\n\nAfter we have submitted the query, we use the function, `$result->fetch_array()`\
    \ to run the result until we can no longer get any more rows. From each line,\
    \ we access the entries, first name, and last name.\n\nAt this point, it is important\
    \ to know how to access a particular entry in the table by optionally extending\
    \ the `SELECT` statement with a condition clause, `WHERE`:\n\n```php\n<?php\n\
    \  $mysqli=new mysqli('localhost','root', '','test');\n  $result = $mysqli->query('SELECT\
    \ firstname, lastname FROM persons WHERE firstname = \"Hans\";');\n  while ($row\
    \ = $result->fetch_array()) {\n    echo $row[\"firstname \"]. \" \" . $row[\"\
    lastname\"]. \"<br />\";\n  }\n?>\n```\n\nNow, we get only rows returned, where\
    \ in the column, first name, the value is Hans. Likewise, we could now query a\
    \ specific `ID`. With this knowledge, you already have the ability to permanently\
    \ store data and process it with another PHP script in the future.\n\nThere are\
    \ hundreds of books to understand the many other `SQL` statements and how to create\
    \ efficient databases or resource-conserving queries. This is very important especially\
    \ for projects with hundreds of thousands of table rows and dozens of queries\
    \ per minute. At the end of the book, you will find some good tips and links to\
    \ free knowledge sources about `SQL`.\n\n## Delete data from the database\n\n\
    The deletion of data a database is nearly the same SQL statement like the `SELECT`.\
    \ You can choose which data should be deleted by filtering it with the `WHERE`\
    \ clause.\n\n```php\n<?php\n  $mysqli=new mysqli('localhost','root', '','test');\n\
    \  $result = $mysqli->query('DELETE FROM persons WHERE firstname = \"Hans\";');\n\
    ?>\n```\n\nAll lines from the database, where the field `firstname` is Hans, will\
    \ be deleted. So be careful to double check your `WHERE` clause.\n\n## File operations\
    \ (read / write files)\n\nIn order to import text files into PHP or write to them,\
    \ they have to be integrated into the script with the use of a filehandler:\n\n\
    ```php\n<?php\n  $myFile = \"myfile.txt\";\n  $filehandler = fopen($myFile, \"\
    r\");\n?>\n```\n\nThe `fopen` function returns the desired filehandler. As a first\
    \ parameter, the function expects a filename if the file is in the same directory\
    \ as the PHP script or the relative path to the file. As a second parameter, the\
    \ function expects the access mode to the file. This specifies whether we want\
    \ to have read access with a filehandler for a file or whether we can describe\
    \ or alter it with our own content.\n\nThese are the following access modes for\
    \ `fopen()`:\n\n- `'r'` Read only, place the file pointer at the beginning\n-\
    \ `'r+'` Read and write, place the file pointer at the beginning\n- `'w'` Write\
    \ only, truncates file to zero length or creates a new file\n- `'w+'` Read and\
    \ write, truncates file to zero length or creates a new file\n- `'a'` Append only,\
    \ place file pointer at the end of file\n- `'a+'` Append and write, place file\
    \ pointer at the end of file\n- `'x'` Create and write only; returns false if\
    \ the file exists\n- `'x+'` Create and write only; returns false if the file exists\n\
    \n### Save to a file\n\nTo create a new file or extend an existing one, we could\
    \ use the following:\n\n```php\n<?php\n  $myFile = \"myfile.txt\";\n  $filehandler\
    \ = fopen($myFile, \"a\");\n  fwrite($filehandler, \"I am a line\\n\");\n  fclose($filehandler);\n\
    ?>\n```\n\n### Reading from a file\n\nIn the above script, `fwrite` is used to\
    \ write content to the file. To read from a file, we use the following:\n\n```php\n\
    <?php\n  $myFile = \"myfile.txt\";\n  $filehandler = fopen($myFile, \"r\");\n\
    \  $contents = fread($filehandler);\n  fclose($filehandler);\n?>\n```\n\n### Delete\
    \ a file\n\nIf you want to delete a file, you can use the `unlink` function:\n\
    \n```php\n<?php\n  $myFile = \"myfile.txt\";\n  unlink($myFile);\n?>\n```\n\n\
    ## Day 5\n\n### Write clean code (which is still understandable in a year)\n\n\
    Before you acquire an unclean programming style, I would like to give you some\
    \ tips on how to write a ‘clean’ code on your way as a programmer.\n\nOn the one\
    \ hand, it is extremely important, as has already been described in the chapter\
    \ on variables, to use appropriate and self-describing variables and function\
    \ names. Nothing is more disappointing than to read variables like `$a`, `$b`,\
    \ or `$x` in an unknown code because they do not show what will be stored in them.\n\
    \nUse tab stops in your code writing.\n"
