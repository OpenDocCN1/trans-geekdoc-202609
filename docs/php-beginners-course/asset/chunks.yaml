    年份，符合 ISO8601 标准。这与 `Y` 的值相同，除非 ISO 日历周（`W`）属于上一年或下一年，在这种情况下使用该年份。


    示例：1999 或 2003


    `Y`

    四位数的

    示例：1999 或 2003


    `y`

    两位数年份

    示例：99 或 03


    ### 时间

    `a`

    小写的上午（morning）和下午（afternoon）

    `am` 或 `pm`


    `A`

    大写的：上午（morning）和下午（afternoon）

    `AM` 或 `PM`


    `B`

    瑞士网络时间 (Swatch Internet Time)

    每天 000 到 999


    `g`

    12 小时制小时，不带前导零

    1 到 12


    `G`

    24 小时制小时，不带前导零

    0 到 23


    `h`

    12 小时制小时，带前导零

    01 到 12


    `H`

    24 小时制小时，带前导零

    00 到 23


    `i`

    分钟，带前导零

    00 到 59


    `s`

    秒，带前导零

    00 到 59


    `u`

    微秒

    示例：654321


    ### 时区

    `e`

    时区名称

    示例：`UTC`, `GMT`, `Atlantic/Azores`


    `I` （大写 ''i''）

    夏令时间（夏季）日期

    如果是夏令时间为 1，否则为 0。


    `O`

    与格林威治时间 (GMT) 的小时差

    示例：+0200


    `P`

    与格林威治时间 (GMT) 的小时差，小时和分钟之间有冒号

    示例：+02:00


    `T`

    时区缩写

    示例：`EST`, `MDT`


    `Z`

    以秒为单位的时区偏移。UTC 西侧时区的偏移始终为负，UTC 东侧时区的偏移始终为正。

    -43200 到 50400


    ### 完整日期/时间

    `c`

    ISO 8601 日期

