  trans: "\n在我们之前的第一个 PHP 脚本中，我们写了文本 \"Hello World!\"。现在我们不再直接将文本紧跟在 `echo` 命令后面，而是先将其保存在变量中，然后让\
    \ `echo` 命令输出该变量的内容。\n\n```php\n<?php\n  $myText = \"Hello World!\";\n  echo $myText;\n\
    ?>\n```\n\n在 PHP 中，变量以美元符号 (`$`) 开头。变量名是任意的，但不能包含空格，只能包含大小写字母、数字和下划线。\n\n要连续打印几个变量的内容，它们必须用点（`.`）进行分隔：\n\
    \n```php\n<?php\n  $part1 = \"Hello \";\n  $part2 = \"World!\";\n  echo $part1\
    \ . $part2;\n?>\n```\n\n这与我们第一个示例的输出相同。我们也可以将变量和文本一起输出：\n\n```php\n<?php\n  $part1\
    \ = \"Hello\";\n  echo $part1 . \" World!\";\n?>\n```\n\n如果你在程序中寻找错误，可以随时使用 `var_dump`\
    \ 命令通过该函数来找出变量内信息的性质：\n\n```php\n<?php\n  $part1 = \"Hello\";\n  var_dump($part1);\n\
    ?>\n```\n\n输出：\n`string(5) \"Hello\"`\n\n这意味着我们变量的内容类型是 \"string\"（字符串），并且包含一个有\
    \ 5 个字符的字符串，即 \"Hello\"。\n\n### 代码注释\n\n如果我们的脚本只有几行长，一眼就能看出某个代码块的作用。然而，一旦脚本变得很长，就有必要在程序代码中加入注释，这样以后阅读代码的人就能立即知道接下来的几行代码对象。\n\
    \nPHP 中有单行注释和多行注释。单行注释以两个正斜杠 `//` 开始。当前行中两个斜杠之后编写任何内容都不再被视为代码。\n\n多行注释以斜杠和星号 `/*`\
    \ 开始，以星号和斜杠 `*/` 结束。\n\n这是另一个示例：\n\n```php\n<?php\n  // 我是一条单行注释\n  echo \"I am\
    \ code\";\n  /*\n  I\n  am\n  a\n  multiline\n  comment\n  */\n?>\n```\n\n该脚本只输出以下文本：\n\
    `I am code`\n\n当然，一个优秀的程序员应该始终以编写能够自我揭示所有用途的代码为目标。这可以通过逻辑变量名和函数名来实现。变量 `$a`、 `$b`\
    \ 和 `$c` 表示“小于”，但如果变量命名为 `$total_price`、 `$sales_tax` 和 `$gross_price` 则意义明确。\n\
    \n尽管如此，例如，在编写复杂算法或代码时，编写有意义的注释是有帮助的。你可以通过注释将程序代码分为几个块。\n\n那么，一个程序块应该以注释开头：\n\n\
    ```php\n/*****************\n处理用户输入\n*****************/\n```\n\n接下来的块标记如下：\n\n\
    ```php\n/*****************\n执行计算\n*****************/\n```\n\n最后一个块（例如）如下：\n\n\
    ```php\n/*****************\n输出结果\n*****************/\n```\n\n那么任何想要更新计算逻辑的程序员都能立即知道他需要在代码的哪个区域进行查找。\n\
    \n### 算术运算（基础算术）\n\n如果你只在变量中保存数字而不是字母，那么就可以对这些数字进行计算。\n\n这是一个示例（在此示例中使用了 HTML\
    \ 代码 `<br />`，它在浏览器中显示为换行）：\n\n```php\n<?php\n  $number1 = 2;\n  $number2 = 3;\n\
    \  $addition = $number1 + $number2;\n  $subtraction = $number1 - $number2;\n \
    \ $multiplication = $number1 * $number2;\n  $division = $number1 / $number2;\n\
    \  echo \"Number 1: \" . $number1;\n  echo \"<br />\";\n  echo \"Number 2: \"\
    \ . $number2;\n  echo \"<br />\";\n  echo \"<br />\";\n  echo \"Addition: \" .\
    \ $addition;\n  echo \"<br />\";\n  echo \"Subtraction: \" . $subtraction;\n \
    \ echo \"<br />\";\n  echo \"Multiplication: \" . $multiplication;\n  echo \"\
    <br />\";\n  echo \"Division: \" . $division;\n?>\n```\n\n该脚本在浏览器中输出：\n`Number\
    \ 1: 2`\n`Number 2: 3`\n`Addition: 5`\n`Subtraction: -1`\n`Multiplication: 6`\n\
    `Division: 0.666666666667`\n\n这里是简单算术的另一种写法：\n\n```php\n<?php\n  $value1 = 2;\n\
    \  $value2 = 3;\n  $value1 += $value2;\n  $value2 *= $value2;\n  echo $value1;\n\
    \  echo \"<br />\";\n  echo $value2;\n?>\n```\n输出：\n`5`\n`9`\n\n作为一个小任务，你可以写一个脚本来计算：网站每天有\
    \ 30,000 个访客。有 60% 的访客看到了广告。换句话说，40% 的访客看到了我们的横幅。对于 1000 次点击，我们获得 200 欧元。我们每月赚多少（按\
    \ 30 天计算）？如果网站每天有 100,000 个访客，答案应该是 240 欧元和 800 欧元。示例如下：\n\n```php\n<?php\n  $dailyVisitors\
    \ = 30000;\n  $sees = $dailyVisitors * 0.4; // 60% 广告\n  $clickratio = 0.1; //\
    \ 每 1000 次点击\n  $earnings = 200;\n  echo ($sees / 1000) * $earnings;\n?>\n```\n\
    \n### 合并多个变量（数组）\n\n如果你有多个变量来表示相似的值，将它们包含在数组是有意义的。这里有两个输出相同的示例：\n\n```php\n<?php\n\
    \  $value1 = 2;\n  $value2 = 4;\n  $value3 = 8;\n  $value4 = 16;\n  $value5 =\
    \ 32;\n  echo $value1 . \"<br />\";\n  echo $value2 . \"<br />\";\n  echo $value3\
    \ . \"<br />\";\n  echo $value4 . \"<br />\";\n  echo $value5 . \"<br />\";\n\
    ?>\n```\n\n```php\n<?php\n  $valueArray = array(2,4,8,16,32);\n  echo $valueArray[0]\
    \ . \"<br />\";\n  echo $valueArray[1] . \"<br />\";\n  echo $valueArray[2] .\
    \ \"<br />\";\n  echo $valueArray[3] . \"<br />\";\n  echo $valueArray[4] . \"\
    <br />\";\n?>\n```\n\n两者的输出都是：\n`2`\n`4`\n`8`\n`16`\n`32`\n\n你可以通过 `$array[index]`\
    \ 访问数组的值。条目从 0 到元素数量升序编号。你也可以自己设置索引：\n\n```php\n<?php\n  $myArray = array(\"index1\"\
    \ => \"value1\");\n  echo $myArray[\"index1\"];\n  echo \"<br />\";\n  $myArray[\"\
    index1\"] = \"value2\";\n  echo $myArray[\"index1\"];\n?>\n```\n\n输出：\n`value1`\n\
    `value2`\n\n以后，我们将学习如何自动连续输出数组中的所有值并处理它们。这对于包含几十个条目的数组非常有用。\n\n#### 排序数组\n\n如果我们动态地填充数组并希望按字母顺序对值，有一个简单的函数：`sort()`。\n\
    \n```php\n<?php\n  $myArray = array(\"Zita\", \"Anton\", \"Hans\");\n  // 未排序输出\n\
    \  echo $myArray[0];\n  echo \"<br />\";\n  echo $myArray[1];\n  echo \"<br />\"\
    ;\n  echo $myArray[2];\n  // 排序数组\n  sort($myArray);\n  echo \"<br /><br />\"\
    ;\n  // 排序后的输出\n  echo $myArray[0];\n  echo \"<br />\";\n  echo $myArray[1];\n\
    \  echo \"<br />\";\n  echo $myArray[2];\n?>\n```\n\n输出：\n`Zita`\n`Anton`\n`Hans`\n\
    `Anton`\n`Hans`\n`Zita`\n\n#### 多维数组\n\n数组再次可以包含另一个数组作为其值：\n\n```php\n<?php\n\
    \  $myArray = array();\n  $myArray[\"index1\"] = array(\"value1\", \"value2\"\
    );\n  $myArray[\"index2\"] = array(\"value3\", \"value4\");\n  echo $myArray[\"\
    index1\"][0];\n  echo \"<br />\";\n  echo $myArray[\"index2\"][1];\n?>\n```\n\n\
    输出：\n`value1`\n`value4`\n\n所以，你可以保存坐标并读取它们，例如像 X, Y 坐标系一样：\n\n```php\n<?php\n\
    \  //...\n  echo $chessboard[10][2];\n?>\n```\n\n这取决于你的脚本如何构建。例如，你可以显示第 10 行第\
    \ 2 列的棋子。\n"
- fmt: "\nSo far, although we have had our variables always filled with values within\
    \ the code, the result has not been a dynamic website. We now want to receive\
    \ information from ‘outside’.\n\nFor a user to send to our PHP script data, there\
    \ are, among other things, two simple methods: `POST` and `GET`.\n\n`POST` information\
    \ is transmitted, for example, in an appropriately configured form to our server\
    \ when the user is registered for, when he makes a new forum entry. Then, there\
    \ is the `GET` information, which is received via invoked URL. You must have noticed\
    \ the long URLs in web shops, which include many letters and numbers and automatically\
    \ generated parts.\n\n## Identify and read GET variables\n\n`GET` variables are\
    \ passed as parameters in an URL:\n\n`http://www.myurl.com/script.php?variable1=value1&variable2=value2&variable3=value3`\n\
    \nThe number of variables and values is virtually not limited, but old browsers\
    \ and a lot of servers have a limit of 1024 characters in the URL.\n\nWhen this\
    \ URL is called in the browser, the computer first attempts to address the call,\
    \ `www.myurl.at`. The file is then requested from the server, `script.php`, and\
    \ three variables are received. The first variable has a question mark (`?`),\
    \ the other variables, an ampersand (`&`).\n\nLet us expand our welcome script\
    \ to a dynamic component to greet our visitors in my name:\n\n```php\n<?php\n\
    \  $vistorsname = $_GET['name'];\n  echo \"Hello \".$vistorsname;\n?>\n```\n\n\
    Save the script, for example, under the name `hello2.php` in your `htdocs` folder.\n\
    \nWithin PHP, there are always some automatically existing variables. There are,\
    \ for example, an array called `$_GET` and one named `$_POST` from which the transmitted\
    \ `GET` and `POST` information can be read. These variables are arrays, and the\
    \ name of the values are the array index.\n\nIf you now call the script by the\
    \ URL,\n\n`http://127.0.0.1/hello2.php?name=Klaus`\n\nthe following text appears\
    \ in the browser:\n\nHello Klaus\n\nCongratulations! You have, now, programmed\
    \ your first dynamic website and you are a bit ahead of other programmers who\
    \ can write only simple HTML.\n\n## Identify and read POST variables\n\nWould\
    \ you query longer texts, including special characters, so that you could get\
    \ on with the transmission via `GET` variables in the URL problems? For such purposes,\
    \ there is the `POST` method, which is used as follows:\n\nmy_form.html\n```html\n\
    <form method=\"POST\" action=\"read_form.php\">\n  <textarea name=\"myText\"></textarea>\n\
    \  <input type=\"submit\" value=\"Send\" />\n</form>\n```\n\nread_form.php\n```php\n\
    <?php\n  $myText = $_POST[\"myText\"];\n  echo nl2br($myText);\n?>\n```\n\nIn\
    \ the first file, we define a form by HTML. Each form element from which we want\
    \ to get information, gets the property (tag attributes) `name=...’`. This enables\
    \ us to extract all information through the global variable, `$_POST`, in our\
    \ second file.\n\nSince we use a text box with multiple lines, we have, on the\
    \ issue, in our PHP script the function `nl2br`, which stands for a new line to\
    \ break or to make line breaks in the text.\n\n## Conditions, program control\
    \ (IF/ELSE/ELSEIF)\n\nWe can, already, according to the user input, output dynamic\
    \ text but we cannot run our script depending on user input. In programming, there\
    \ are many cases, which can be written as follows: when the user, `A`, enters\
    \ exactly something, do this, otherwise, do that.\n\n```php\nif ($input == \"\
    A\") {\n  do this;\n}\nelse {\n  do that;\n}\n```\n\n`If`, followed by a condition\
    \ written within normal parentheses `()`, the following code is only executed\
    \ when the condition in the parentheses `()` is met. The code block after the\
    \ parentheses should be written within two brackets `{}`. If the conditions inside\
    \ the parentheses are not applied, the `else` block, also bounded by braces, will\
    \ be executed.\n\nOne can combine `if` and `else` also to successively query multiple\
    \ conditions and even attach an `else` clause if none of previous conditions are\
    \ true:\n\n```php\nif ($input == \"A\") {\n  do this;\n}\nelseif ($input == \"\
    A\") {\n  do this;\n}\nelse {\n  do that;\n}\n```\n\nConditions are compared with\
    \ different characters. If a variable has a certain value, you have to write two\
    \ actual signs `==`. If you write just one equal sign `=`, the program will simply\
    \ store the value on the right side of the quotation mark in the variable.\n\n\
    Other conditions are defined as follows:\n- `==` equals\n- `!=` not equal\n- `>`\
    \ greater\n- `<` less\n- `>=` greater than equal\n- `<=` less than or equal\n\n\
    Several conditions can be linked with double ampersand, `&&`. A double vertical\
    \ line `||` would mean an OR operation. Thus, `$a == 1 && $b == 1` would mean\
    \ that both the variables, `$a` and `$b`, must contain the value 1. If one variable\
    \ had another value, the `else` clause would be executed.\n\n`$a == 1 || $b ==\
    \ 1` would mean that either the variable, `$a` or the variable, `$b` or both the\
    \ variables must contain the value 1. You can combine multiple conditions by putting\
    \ them in further parentheses:\n\n`if (($a == 1 && $b == 1) || $c == 1)` would\
    \ mean that either `$a` and `$b` must have the value 1 or `$c` must have the value\
    \ 1.\n\nTo make the benefits of the `if-else` function more understandable, here\
    \ is an example:\n\n```php\n<?php\n  $username = $_GET[\"username\"];\n  $password\
    \ = $_GET[\"password\"];\n  if ($username == \"admin\" && $password == \"mystrongsecretpassword\"\
    ) {\n    echo \"Welcome Administrator!\";\n  }\nelseif ($username == \"admin\"\
    \ && $password != \"mystrongsecretpassword\") {\n    echo \"Hello administrator,\
    \ unfortunately, you have entered the password incorrectly!\";\n  }\n  else {\n\
    \    echo \"Error: The login data entered were incorrect!\";\n  }\n?>\n```\n\n\
    In the script above, first, the values from the `GET` array are stored in variables.\
    \ Of course it would also be possible to use the `GET` array directly in the `if`-function,\
    \ but that would make the code more complicated.\n\nIf a visitor in the URL has\
    \ transmitted the correct login information, we welcome him as an administrator,\
    \ otherwise, we will check if he has, at least, entered the user name correctly.\
    \ If the username and password are incorrect, we will give an error message.\n\
    \nOutput when calling `script.php?username=admin&password=mystrongsecretpassword`:\n\
    Welcome Administrator!\n\nOutput when calling `script.php?username=admin&password=xxx`:\n\
    Hello administrator, unfortunately, you have entered the password incorrectly!\n\
    \nOutput when calling `script.php?username=abc&password=xxx`:\nError: The login\
    \ data entered were incorrect!\n\nIf the contents of a variable do not matter,\
    \ and we just want to check if a variable has any content, then we can accomplish\
    \ this as follows:\n\n```php\n<?php\n  $myTrueValue = \"myTest\";\n  if ($myTrueValue)\
    \ {\n    echo 1;\n  }\n  else {\n    echo 0;\n  }\n  echo \"<br />\";\n  $myTrueValue\
    \ = \"\";\n  if ($myTrueValue) {\n    echo 1;\n  }\n  else {\n    echo 0;\n  }\n\
    ?>\n```\n\nOutput:\n1\n0\n\nIn the first query, if the variable has a content,\
    \ then the `if` block and not the `else` block is executed. In the second review,\
    \ the variable is empty. When you do not test any condition like `==` or `!=`,\
    \ it is checked whether the variable is empty or contains a Boolean value. A Boolean\
    \ value consists in programming as a variable or a value of true or false, it\
    \ can also be written as 1 or 0.\n\nHere, the previous example is slightly extended:\n\
    \n```php\n<?php\n  $myTrueValue = \"myTest\";\n  if ($myTrueValue) {\n    echo\
    \ 1;\n  }\n  else {\n    echo 0;\n  }\n  echo \"<br />\";\n  $myTrueValue = false;\n\
    \  if ($myTrueValue) {\n    echo 1;\n  }\n  else {\n    echo 0;\n  }\n  echo \"\
    <br />\";\n  $myTrueValue = 0;\n  if ($myTrueValue) {\n    echo 1;\n  }\n  else\
    \ {\n    echo 0;\n  }\n?>\n```\n\nOutput:\n1\n0\n0\n\nFurthermore, it is often\
    \ important to know whether a variable exists at all and is, therefore, initialised\
    \ in the program already:\n\n```php\n<?php\n  $myVar = \"123\";\n  if (isset($myVar))\
    \ {\n    echo \"myVar exists\";\n  }\n  else {\n    echo \"myVar does not exist\"\
    ;\n  }\n?>\n```\n"
