  trans: "\n\n```php\nwhile ($row = $result->fetch_array()) {\n    echo $row[\"firstname\"\
    ] . \" \" . $row[\"lastname\"] . \"<br />\";\n}\n?>\n```\n\n当你编写 PHP `/SQL` 脚本时，`SELECT`\
    \ 语句将仍然是你忠实的伴侣。使用 `SELECT` 进行数据查询时，后面跟着的是表列；或者，如果你想查询表的所有列，也可以使用 `*`。其之后是 `FROM`\
    \ 语句以及要从中查询数据的表名。\n\n在我们提交查询后，我们使用函数 `$result->fetch_array()` 来运行结果，直到我们无法获取更多行。从每一行中，我们访问条目：名（first\
    \ name）和姓（last name）。\n\n此时，了解如何通过可选扩展 `SELECT` 语句的条件子句 `WHERE` 来访问表中的特定条目是非常重要的：\n\
    \n```php\n<?php\n  $mysqli=new mysqli('localhost','root', '','test');\n  $result\
    \ = $mysqli->query('SELECT firstname, lastname FROM persons WHERE firstname =\
    \ \"Hans\";');\n  while ($row = $result->fetch_array()) {\n    echo $row[\"firstname\
    \ \"]. \" \" . $row[\"lastname\"]. \"<br />\";\n  }\n?>\n```\n\n现在，我们只获取返回的行，即在\
    \ `firstname` 列中值为 Hans 的行。同样，我们现在可以查询特定的 `ID`。有了这些知识，你已经具备了永久存储数据并在未来使用另一个 PHP\
    \ 脚本对其进行处理的能力。\n\n有数百本书书籍可以让你理解许多其他的 `SQL` 语句以及如何创建高效的数据库或节省资源的查询。这对于具有数十万行数据和每分钟几十次查询的项目来说非常重要。在书的最后，你将找到关于\
    \ `SQL` 免费知识来源的好建议和链接。\n\n## 从数据库中删除数据\n\n从数据库中删除数据的 SQL 语句与 `SELECT` 几乎相同。你可以通过\
    \ `WHERE` 子句过滤数据来选择删除哪些数据。\n\n```php\n<?php\n  $mysqli=new mysqli('localhost','root',\
    \ '','test');\n  $result = $mysqli->query('DELETE FROM persons WHERE firstname\
    \ = \"Hans\";');\n?>\n```\n\n数据库中所有 `firstname` 字段为 Hans 的行都将被删除。因此，请务必仔细检查你的\
    \ `WHERE` 子句。\n\n## 文件操作（读取/写入文件）\n\n为了将文本文件导入 PHP 或向其写入，必须使用文件句柄（filehandler）将其集成到脚本中：\n\
    \n```php\n<?php\n  $myFile = \"myfile.txt\";\n  $filehandler = fopen($myFile,\
    \ \"r\");\n?>\n```\n\n`fopen` 函数返回的文件句柄。作为第一个参数，如果文件与 PHP 脚本在同一目录下，函数期望文件名或文件的相对路径。作为第二个参数，函数期望文件的访问模式。这指定了我们是想通过文件句柄获取文件的读取权限，还是可以使用我们自己的内容对其进行描述或修改。\n\
    \n以下是 `fopen()` 的可用访问模式：\n\n- `'r'` 只读，将文件指针放在文件开头\n- `'r+'` 读和写，将文件指针放在文件开头\n\
    - `'w'` 只写，将文件截断为零长度或创建一个新文件\n- `'w+'` 读和写，将文件截断为零长度或创建一个新文件\n- `'a'` 只追加，将文件指针放在文件末尾\n\
    - `'a+'` 追加和写，将文件指针放在文件末尾\n- `'x'` 只创建和写；如果文件存在则返回 false\n- `'x+'` 只创建和写；如果文件存在则返回\
    \ false\n\n### 保存到文件\n\n要创建一个新文件或扩展现有文件，我们可以使用以下代码：\n\n```php\n<?php\n  $myFile\
    \ = \"myfile.txt\";\n  $filehandler = fopen($myFile, \"a\");\n  fwrite($filehandler,\
    \ \"I am a line\\n\");\n  fclose($filehandler);\n?>\n```\n\n### 读取文件\n\n在上面的脚本中，`fwrite`\
    \ 用于文件写入内容。要从文件中读取，我们使用以下代码：\n\n```php\n<?php\n  $myFile = \"myfile.txt\";\n \
    \ $filehandler = fopen($myFile, \"r\");\n  $contents = fread($filehandler);\n\
    \  fclose($filehandler);\n?>\n```\n\n### 删除文件\n\n如果你想删除文件，可以使用 `unlink` 函数：\n\n\
    ```php\n<?php\n  $myFile = \"myfile.txt\";\n  unlink($myFile);\n?>\n```\n\n##\
    \ 第 5 天\n\n### 编写整洁的代码（一年后仍然易读）\n\n在你养成不整洁的编程风格之前，我想给你一些关于如何在程序员道路上编写“整洁”代码的建议。\n\
    \n一方面，正如在变量章节中所描述的，使用适当且自描述的变量和函数名是极其重要的。在未知代码中读取 `$a`、`$b` 或 `$x` 等变量是非常令人失望的，因为它们没有显示其中将存储什么内容。\n\
    \n在编写代码时使用制表符（tab stops）。\n\n"
- fmt: "\n# Principle: Never trust data coming from outside\n\nIf you follow this\
    \ principle, you have already won half the battle against crackers and hackers.\
    \ Regarding the mistrust of external data, I mean you should validate the input\
    \ data to see if it corresponds to the expected format. This means that, if a\
    \ number is to be entered, it is best to check if the function is numeric (`$input`),\
    \ whether it is really a number, or whether an e-mail address is set up as it\
    \ should (exactly one `@` character and a domain must be specified at the end).\
    \ This brings us to the next topic.\n\n## Protection against SQL Injections\n\n\
    An SQL injection is a way manipulate an SQL Query so that it does something other\
    \ than what it was meant for. This happens if you do not filter the entered data.\n\
    \nSuppose we have the following script to offer a login functionality for a web\
    \ page:\n\n```php\n<?php\n\n  $username = $_GET[\"username\"];\n  $password =\
    \ $_GET[\"password\"];\n  $sql = \"SELECT \\* FROM users WHERE username = \"\"\
    \".$username.\"\" AND password = \"\" . $password .\"\" \";\n  $mysqli=new mysqli('localhost','root','',\
    \ 'test');\n  $result = $mysqli->query($sql);\n  echo \"Found the following user(s):\
    \ \";\n  while ($row = $result->fetch_array()) {\n    echo $row[\"username\"].\
    \ \"<br />\";\n  }\n\n?>\n```\n\nThis functionality has no problem if the users\
    \ are just entering their username or password. But, unfortunately, there are\
    \ technically savvy crackers who look for such simple logins, some use automated\
    \ bots to find these logins, and try to enter the following:\n\nUsername: admin\n\
    Password: `\" OR 1=1`\n\nIf we pass this text unfiltered into our SQL query, we\
    \ get the following SQL statement:\n\n`SELECT \\* FROM users WHERE username =\
    \ \"admin\" AND password = \"\" OR 1=1`\n\nSince `1` is always equal to `1`, a\
    \ result is always returned. So the cracker is logged in as admin or even adds\
    \ his users:\n\nUsername: x\nPassword: x\"; INSERT INTO users (username, password)\
    \ VALUES (\"mynewuser\", \"mypassword\");`\n\nThe SQL would be:\n\n`SELECT \\\
    * FROM users WHERE username = \"x\" AND password = \"x\"; INSERT INTO users (username,\
    \ password) VALUES (\"mynewuser\", \"mypassword\");`\n\nBoth SQL statements would\
    \ be executed and the cracker would have already created a new user account. Theoretically,\
    \ he could also send a `DELETE` command and thus destroy our database or, for\
    \ example, change the password of the administrator.\n\nBut how can you protect\
    \ yourself against this?\n\nEither you filter the specified data for only allowed\
    \ characters (`a-z`, `A-Z`, `0-9`) or you ‘escape’ the input data. This means,\
    \ all special characters as well as the entire string are encapsulated by apostrophes\
    \ and are thus made ‘harmless’. There is the ready-made function `$mysqli->real_escape_string()`,\
    \ which gets a string as parameter and returns a safe escaped version of it.\n\
    \nExample:\n\n`$password =$mysqli->real_escape_string($password);`\n\n## Keep\
    \ your passwords encrypted\n\nSomething even large global companies have had to\
    \ learn through bitter experience the need to always store passwords always encrypted\
    \ in the database. There are encryption methods that encrypt only in one direction\
    \ and generate so-called hashes from arbitrarily long strings. These are strings\
    \ of a previously known length. PHP delivers its own well tested hashing library\
    \ since PHP 5.5. You can use it e.g. with the function `password_hash($password,\
    \ ALGORITHM)`.\n\n```php\n<?php\n\n  $password = \"password123\";\n  $hash = password_hash($password,\
    \ PASSWORD_BCRYPT);\n  echo $password;  \n  echo \"<br />\";\n  echo $hash;\n\n\
    ?>\n```\n\nOutput (the hash may differ from server to server and generated every\
    \ time):\n\n`password123`\n`$2y$10$K6JP7Lfu2.wjuEGLzCact.8GZaok5oSWhH49.TzTZm5/PPfDzXYMW`\n\
    \nThe hash can no longer be deciphered in plaintext. Now you can save these password\
    \ hashes in your database. Every time a user wants to log in, you use the `password_hash()`\
    \ function to generate the hash for the data the user put in. If the hashes are\
    \ the same, the user entered the correct password. If a hacker wants to steal\
    \ your database, he would need a lot of time to try all his word lists, because\
    \ the `password_hash()` function needs some time to generate the hashes. You can\
    \ add an optional `$options` parameter and define that a more complex method of\
    \ hashing should be used so that the hashing gets even slower and is harder to\
    \ crack.\n\n## Add salt to your passwords\n\nAnother security aspect is to protect\
    \ oneself against users with unsafe passwords. Statistics from large user databases\
    \ show that a considerable percentage of the users always use the same passwords,\
    \ as, for example, as `asdf123`, `password`, `1234567890`. If a cracker gets our\
    \ username with the hashes, it would be easy for him to match the hashes against\
    \ the 1000 most commonly used passwords on the Internet. To prevent this, I recommend\
    \ adding a long random string for each project, such as ‘afdsoin23oidvnio3iosdvn09832jknlsd’.\n\
    \nIf a user logs in again and uses the password ‘password’, we store the hash\
    \ for ‘passwordafdsoin23oidvnio3iosdvn09832jknlsd’.\n\n### Website tips\n\n**PHP**\n\
    `www.php.net/manual/`\n\n**SQL**\n`www.w3schools.com/php/`\n\n**MySQL**\n`dev.mysql.com/doc/`\n\
    \n### Book tips\n\n**PHP and MySQL for Dynamic Sites, Fourth Edition: Visual Quick\
    \ Guide**\nby Larry Ullman, Peachpit Press, ISBN 0321784073\n\n***Head First PHP\
    \ & MySQL: A Brain-Friendly Guide***\nby Lynn Beighley and Michael Morrison, O'Reilly\
    \ Media, ISBN-10 0596006306, ISBN-13 978-0596006303\n\n**PHP Objects, Patterns,\
    \ and Practice**\nby Matt Zandstra, ISBN-13 978-1430260318, ISBN-10 1430260319\n\
    \n**Wikibook PHP Programming**\n`https://en.wikibooks.org/wiki/PHP_Programming`\n\
    \n## Epilogue\n\nI hope you enjoyed the introduction to the world of web development\
    \ with PHP and MySQL and you are now ready to implement your first own small projects.\n\
    \nIf you need ideas about to try next: you could use the knowledge this course\
    \ provides, for example, to create a guest book for a website, or a small script\
    \ that displays a different greeting, depending on the day of the week and the\
    \ time.\n"
