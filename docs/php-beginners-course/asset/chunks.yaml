    \ breaks must be passed to fwrite using \\\\n. \n\n#### Reading from a text file\n\
    \nWe would like to read this file now into our php script:\n\n<?php\n\n  $myFile\
    \ = \"myfile.txt\";\n\n  $filehandler = fopen($myFile, \"r\");\n\n  $contents\
    \ = fread($filehandler, filesize($myFile));\n\n  fclose($filehandler);\n\n  echo\
    \ nl2br($contents);\n\n?>\n\nIn the above script, the PHP function, fread(), is\
