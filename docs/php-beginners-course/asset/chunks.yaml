    \n  $myFile = \"myfile.txt\";\n\n  $filehandler = fopen($myFile, \"r\");\n\n?>\n\
    \nThe fopen function returns the desired filehandler. As a first parameter, the\
    \ function expects a filename if the file is in the same directory as the PHP\
    \ script or the relative path to the file. As a second parameter, the function\
    \ expects the access mode to the file. This specifies whether we want to have\
    \ read access with a filehandler for a file or whether we can describe or alter\
    \ it with our own content.\n\nThese are the following access modes for fopen():\n\
    \n'r' Read only, place the file pointer at the beginning\n\n'r+' Read and write,\
    \ place the file pointer at the beginning\n\n'w' Write only, place the file pointer\
    \ at the beginning; if the file exists, then empty it\n\n'w+' Read and write,\
    \ place the file pointer at the beginning; if the file exists, then empty it\n\
    \n'a' Write only, place the file pointer at the end\n\n'a+' Read and write, place\
    \ the file pointer at the end\n\n'x' Write only, if the file already exists, then\
    \ return an error\n\n'x+' Read and write, if the file already exists, then return\
    \ an error\n\n'c' Write only, place the file pointer at the beginning; if the\
    \ file exists, then do not empty\n\n'c+' Read and write, place the file pointer\
    \ at the beginning; if the file exists, then do not empty.\n\n#### Save to a text\
    \ file\n\nIn the following script, the PHP function, frwite(), is used, which\
    \ first gets our filehandler, and as a second parameter, we have to specify the\
    \ content which should be added to the file.\n\nTo create a new file or extend\
    \ an existing one, we could use the following script:\n\n<?php\n\n  $myFile =\
    \ \"myfile.txt\";\n\n  $filehandler = fopen($myFile, \"a\");\n\n  fwrite($filehandler,\
    \ \"I am a new line.\\\\nI am a second new line.\\\\n\");\n\n  fclose($filehandler);\n\
