- fmt: "\n# Split the code in several files\n\nSo far, we have written only short\
    \ scripts of less than 100 lines. Once you work on larger projects that are partly\
    \ made up of tens of thousands of lines of code, it can soon become confusing\
    \ within a file. It makes more sense, for example, to outsource function collections\
    \ in another `.php` file and integrate them into our main project file.\n\nSo,\
    \ we create two files:\n\n`functions_accounting.php`\n\n```php\n<?php\n\n  function\
    \ toNetto($amount, $vat_percent = 20) {\n    $amount_netto = $amount / (100 +\
    \ $vat_percent) * 100;\n    return $amount_netto;\n  }\n\n  function toBrutto($amount,\
    \ $vat_percent = 20) {\n    $amount_brutto = $amount * (100 + $vat_percent) /\
    \ 100;\n    return $amount_brutto;\n  }\n?>\n```\n\n`vat_calculator.php`\n\n```php\n\
    <?php\n  include \"functions_accounting.php\";\n  $price_austria = 1256;\n  $price_netto\
    \ = toNetto($price_austria);\n  $price_germany = toBrutto($price_netto, 19);\n\
    \  echo $price_germany;\n?>\n```\n\nIf, for example, in addition to our `vat_calculator.php`,\
    \ the file `functions_accounting.php` are located in the folder `functions`, we\
    \ would have to specify it with the following:\n\n```php\n<?php\n  include \"\
    functions/functions_accounting.php\";\n  $price_austria = 1256;\n  $price_netto\
    \ = toNetto($price_austria);\n  $price_germany = toBrutto($price_netto, 19);\n\
    \  echo $price_germany;\n?>\n```\n\nYou could also specify full absolute paths\
    \ on the server, such as the following:\n\n```php\n<?php \n  include \"/var/www/web1/html/functions/functions_accounting.php\"\
    ;\n?>\n```\n\nHowever, if you do this, the path may never change and you may have\
    \ problems when you transfer your script to a different server.\n\n# Day 4\n\n\
    ## Storing and reading information with a database (MySQL)\n\nNow, we can query,\
    \ process and output a lot of information. However, we still lack an important\
    \ feature of programming: the storage of data and a technique to retrieve it in\
    \ future. Most PHP projects use an SQL database.\n\nWithin each database, data\
    \ is stored in tables. Like MS Excel, each table consists of individual columns\
    \ and rows. We will learn how to access the individual values in this chapter.\n\
    \n### Connect to a database within PHP\n\nFirst, we need to connect to a database\
    \ server from our PHP script.\n\nIf you have not modified the basic installation\
    \ of the server, as described in the first chapter, then the database server access\
    \ is possible using the user `root` and without a password. Otherwise, you may\
    \ need to assign a password in the server management software.\n\nHere is an example\
    \ of how to connect and reconnect to the database server:\n\n```php\n<?php\n \
    \ $mysqli=new mysqli('localhost','my_user','my_password','my_db');\n  $mysqli->close();\n\
    ?>\n```\n\nThe `mysqli` object expects as parameter, the server, the username\
    \ on the MySQL server, and the password. The server is usually `localhost` if\
    \ the MySQL server is installed on the same machine as the Apache web server.\
    \ By default, MySQL connections are automatically closed at the end of a script,\
    \ so `$mysqli->close()` is not necessary. If we want to program cleanly and know\
    \ that from a certain point in the script no connection is necessary, we should\
    \ close it, as soon as possible, to save resources.\n\n### Create a new database\n\
    \nIf we are successfully connected to our database server, we need to select a\
    \ database to work with. Most web developers usually work with graphical database\
    \ management tool. With XAMPP, MAMP and the most preconfigured webserver on the\
    \ Internet, PhpMyAdmin is installed by default. This is available at `http://localhost/phpmyadmin/`\
    \ or `http://localhost/phpMyAdmin/`.\n\nHowever, we like to try to create our\
    \ new database directly within our script:\n\n```php\n<?php\n  $mysqli=new mysqli('localhost','root','');\n\
    \  $result=$mysqli->query(\"CREATE DATABASE test\");\n  $mysqli->close();\n  var_dump($result);\n\
    ?>\n```\n\nYou already know the functions of connecting and disconnecting to the\
    \ MySQL server. The new function in the example is `$mysqli->query`. By queries,\
    \ you tell MySQL what to do. Such queries, as in our example, can also be instructions\
    \ to update something in our database. However, a result is always returned as\
    \ whether the request could be executed. If you run the script more than once,\
    \ you will receive a success message only on the first run, then there will be\
    \ error messages indicating that the given database name has been assigned.\n\n\
    ### Select our database\n\nIf we know what our database is called, we need to\
    \ specify the script to use it:\n\n```php\n<?php\n  $mysqli=new mysqli('localhost','root','','test');\n\
    ?>\n```\n\nThe database which should be used is defined as the last parameter.\
    \ All following queries are now sent to the selected database.\n\n### Create tables\n\
    \nNow we want to create a table, for example, to store personal records:\n\n```php\n\
    <?php\n  $mysqli=new mysqli('localhost','root','','test');\n  $result = $mysqli->query(\"\
    \n  CREATE TABLE IF NOT EXISTS persons (\n    id int(10) unsigned AUTO_INCREMENT,\n\
    \    firstname varchar(50),\n    lastname varchar(50),\n    PRIMARY KEY (id)\n\
    \  )\");\n  var_dump($result);\n?>\n```\n\nThis query is a bit more complex. We\
    \ tell MySQL to create a table named `persons`, if it does not already exist.\
    \ When creating the columns, we must specify which type they will be. Unlike PHP,\
    \ the database server must know exactly whether a value is a text, a number or\
    \ any other type.\n\nWe create the column `id` of type `Integer(10)`. Integers\
    \ are numbers without commas. The `unsigned` attribute means that no sign is to\
    \ be stored, so there will be no minus sign. Furthermore, we use `AUTO_INCREMENT`\
    \ to indicate that the `ID` column automatically increases by the value of 1 compared\
    \ to the last highest entry when we insert a new row into the table. Thus we have\
    \ a consecutive number that we can use as the primary key as we specify it in\
    \ the last line of the table. Each table must have a primary key. This must be\
    \ unique for each table row so that the primary key allows you to always address\
    \ a specific table row. The number ten in the brackets `(10)` defines that the\
    \ number can have the length of maximum ten digits, so the maximum number is `9,999,999,999`.\n\
    \nWe also create a column for the first names and one before the last names of\
    \ both the variable character (`VARCHAR`) types. This means that we do not yet\
    \ know what the length of the string to be stored will be, but we limit it to\
    \ a maximum of 50 characters. Alternatively, we could use the type `TEXT`, which\
    \ has no limitation on a certain number of characters but consumes considerably\
    \ more memory.\n\n### Write data to the database\n\nAfter we have created our\
    \ table, we will now fill it with the first data:\n\n```php\n<?php\n  $mysqli=new\
    \ mysqli('localhost','root','','test');\n  $result = $mysqli->query(\"INSERT INTO\
    \ persons (firstname, lastname) VALUES ('Hans', 'Meier');\");\n  var_dump($result);\n\
    ?>\n```\n\nIf you now look at the table in PhpMyAdmin, you will see the entry\
    \ you just added.\n\nTo insert data into a table, there is the `INSERT INTO` SQL\
    \ statement, followed by the table name and the fields to be filled, which is\
    \ followed by the `VALUES` statement, and the values in the same order as the\
    \ fields specified. If you would like to insert more than one line into the table,\
    \ you only need to write `VALUES` once and separate the individual line values\
    \ with the words:\n\n```php\n<?php\n  $mysqli=new mysqli('localhost','root','','test');\n\
    \  $result = $mysqli->query(\"INSERT INTO persons (firstname, lastname) VALUES\
    \ ('Max', 'Meier'),('Maria', 'Mauser');\");\n  var_dump($result);\n?>\n```\n\n\
    ### Retrieve data from the database\n\nAfter we have written some lines in the\
    \ table, we would like to query them again in our script. This is done with the\
    \ SQL statement, `SELECT`:\n\n```php\n<?php\n  $mysqli=new mysqli('localhost','root','','test');\n\
    \  $result = $mysqli->query(\"SELECT firstname, lastname FROM persons;\");\n?>\n\
    ```\n"
