  trans: "\n到目前为止，尽管我们已经在代码中为变量填充了值，但结果并不是一个动态网站。现在，我们想要从“外部”接收信息。\n\n为了让用户向我们的 PHP\
    \ 脚本发送数据，除此之外还有两种简单的方法：`POST` 和 `GET`。\n\n`POST` 信息的传输方式，例如，当用户注册或发布新论坛帖子时，通过一个配置恰当的表单发送到我们的服务器。然后是\
    \ `GET` 信息，它是通过调用的 URL 接收的。你可能已经注意到网商店中那些很长的 URL，它们包含许多字母、数字和自动生成的参数。\n\n## 识别并读取\
    \ GET 变量\n\n`GET` 变量作为参数传递在 URL 中：\n\n`http://www.myurl.com/script.php?variable1=value1&variable2=value2&variable3=value3`\n\
    \n变量和值的数量几乎不受限制，但旧版浏览器和许多服务器对 URL 的长度有 1024 个字符的限制。\n\n当在浏览器调用此 URL 时，计算机首先尝试访问地址\
    \ `www.myurl.at`。随后从服务器请求文件 `script.php`，并接收到三个变量。第一个变量带有问号（`?`），其他变量带有和符号（`&`）。\n\
    \n让我们将欢迎脚本扩展为一个动态组件，以我的名义问候访问者：\n\n```php\n<?php\n  $vistorsname = $_GET['name'];\n\
    \  echo \"Hello \".$vistorsname;\n?>\n```\n\n将脚本保存，例如在你的 `htdocs` 文件夹中命名为 `hello2.php`。\n\
    \n在 PHP 中，始终存在一些自动生成的变量。例如，有一个名为 `$_GET` 的数组，另一个名为 `$_POST` 的数组，可以从其中读取传输的 `GET`\
    \ 和 `POST` 信息。这些变量是数组，值的名称就是数组的索引。\n\n如果你现在通过 URL 调用脚本，\n\n`http://127.0.0.1/hello2.php?name=Klaus`\n\
    \n浏览器中将出现以下文本：\n\nHello Klaus\n\n恭喜你！你现在编写了你的第一个动态网站，并且比其他只会写简单 HTML 的程序员领先了一步。\n\
    \n## 识别并读取 POST 变量\n\n你是否会想要查询包含特殊字符的较长文本，以便在 URL 的问题中通过 `GET` 变量继续传输？为了这些目的，有\
    \ `POST` 方法，其用法如下：\n\nmy_form.html\n```html\n<form method=\"POST\" action=\"read_form.php\"\
    >\n  <textarea name=\"myText\"></textarea>\n  <input type=\"submit\" value=\"\
    Send\" />\n</form>\n```\n\nread_form.php\n```php\n<?php\n  $myText = $_POST[\"\
    myText\"];\n  echo nl2br($myText);\n?>\n```\n\n在第一个文件中，我们通过 HTML 定义了一个表单。我们想要从中获取信息的每个表单元素都获得一个\
    \ `name=...` 属性（标签属性）。这使得我们能够在第二个文件中通过全局变量 `$_POST` 提取所有信息。\n\n由于我们使用了多行文本框，因此我们在\
    \ PHP 脚本中对应使用了 `nl2br` 函数，它代表将换行转换为换行符或在文本中实现换行。\n\n## 条件、程序控制 (IF/ELSE/ELSEIF)\n\
    \n我们已经可以根据用户输入输出动态文本，但无法根据用户输入来运行脚本。在编程中，有很多情况可以写成如下：当用户 `A` 正好输入某些内容时，执行此操作，否则执行另一个操作。\n\
    \n```php\nif ($input == \"A\") {\n  do this;\n}\nelse {\n  do that;\n}\n```\n\n\
    `If` 后面跟着一个在普通括号 `()` 内编写的条件，如果条件满足，执行大括号内的代码；否则，执行 `else` 部分的代码。\n"
- fmt: "\nOutput:\n\nmyVar exists\n\n```php\n<?php\n  $myVar = \"123\";\n\n  if (isset($otherVar))\
    \ {\n    echo \"myVar exists\";\n  }\n  else {\n    echo \"myVar does not exists\"\
    ;\n  }\n?>\n```\n\nOutput:\n\notherVar does not exists\n\n### Case analysis (switch\
    \ / case)\n\nLet us suppose we have a variable and want to check for many different\
    \ contents. We already know the function of `if`, `elseif` and `else`. However,\
    \ it may quickly become confusing; moreover, it is easier to write a redundant\
    \ code to check only a single variable. There is the practical function `switch\
    \ case` which is programmed as follows:\n\n```php\n<?php\n  $username = $_GET[\"\
    username\"];\n  switch ($username) {\n    case \"Klaus\":\n      echo \"Hello\
    \ administrator!\";\n      break;\n    case \"Dagmar\":\n      echo \"Hello sister!\"\
    ;\n      break;\n    case \"Bill Gates\":\n      echo \"Hello richest man in the\
    \ world!\";\n      break;\n    default:\n      echo \"Hello visitor!\";\n    \
    \  break;\n  }\n?>\n```\n\nAs we see, the head of the `switch` function is pretty\
    \ similar to the `if` function; it just has no parameters defined. Thereafter,\
    \ each multiple case block must be completed with a `break`; that breaks the review\
    \ on to other cases.\n\nIf, in neither case, the condition is met, the `default`\
    \ block is executed. If you do not use breaks, you could run the same for two\
    \ or more case code blocks:\n\n```php\n<?php\n  $username = $_GET[\"username\"\
    ];\n  switch ($username) {\n    case \"Klaus\":\n    case \"Dagmar\":\n      echo\
    \ \"Hello administrator!\";\n      break;\n    case \"Bill Gates\":\n      echo\
    \ \"Hello richest man in the world!\";\n      break;\n    default:\n      echo\
    \ \"Hello visitor!\";\n      break;\n  }\n?>\n```\n\n### Loops for repetitive\
    \ tasks (While / For / Foreach)\n\n#### While() Loop\n\nOften, there are tasks\
    \ for our script to be repeated many times. This could be, for example, a kind\
    \ of numbering in a particular order:\n\n```php\n<?php\n  $number = 1;\n  while\
    \ ($number < 100) {\n    echo $number . \"<br />\";\n    $number++;\n  }\n?>\n\
    ```\n\nThis short script gives back each number 1 to 99. It is used in so-called\
    \ `while()` loop. The header of the `while()` loop is used to specify a condition\
    \ as an `if` function. The loop is repeated as long as the condition is true or\
    \ till break, a command is invoked. The script also has a small gimmick. It took\
    \ over from C: `++` increases the value by +1, `--` reduces it to -1. Here is\
    \ another example of the same, only this time, it is written in quasi-infinite\
    \ loop because the condition is true. The loop runs until there is break; the\
    \ command is cancelled:\n\n```php\n<?php\n  $number = 1;\n  while (true) {\n \
    \   echo $number . \"<br />\";\n    $number++;\n    if ($number > 99) {\n    \
    \  break;\n    }\n  }\n?>\n```\n\n#### For() Loop\n\nFor fixed numbers, there\
    \ is a much more beautiful loop: the `for()` loop. The function of the `for()`\
    \ loop is as follows: `for (start value; condition; repeat)`. Here is a brief\
    \ example:\n\n```php\n<?php\n  for ($x = 1; $x < 100; $x++) {\n    echo $x . \"\
    <br />\";\n  }\n?>\n```\n\nThis would result in the same output as we had with\
    \ `while()` loop. The third parameter of the function specifies a command to be\
    \ executed after each loop. In this case, increase the value of variable `$x`\
    \ by 1. The variable can be used only within the loop.\n\n#### Foreach() loop\n\
    \nThere is another loop to work through arrays: `foreach()`. Here is an example\
    \ of how this is used:\n\n```php\n<?php\n  $valueArray = array(2,4,16,32);\n \
    \ foreach ($valueArray as $index => $value) {\n    echo $value . \"<br />\";\n\
    \  }\n?>\n```\n\nOutput:\n2\n4\n16\n32\n\nWithin the function, the `$index` and\
    \ `$value` variables are available. With `$index`, you can determine which entry\
    \ you have entered within the array (counted from 0 ascending), or if you have\
    \ defined the index of an array, you have this within the loop. The names of the\
    \ variables are freely definable; but it should be clear within the loop block\
    \ what the variables are used for. If you do not need the array index within the\
    \ loop, for example, as you only want to output the values in sequence, it is\
    \ even easier:\n\n```php\n<?php\n  $valueArray = array(2,4,16,32);\n  foreach\
    \ ($valueArray as $value) {\n    echo $value . \"<br />\";\n  }\n?>\n```\n\n##\
    \ Day 3\n\n### Date and Time (Who has turned the clock?)\n\n#### DATE()\n\n the\
    \ function `date(format, time)`, you can print a certain time in a formatted form.\
    \ The first parameter specifies the format, while a second optional parameter\
    \ states a specific time. If the second parameter is absent, the current server\
    \ time is shown below. Here is an example:\n\n```php\n<?php\n  echo date(\"Y-m-d\"\
    );\n?>\n```\n\nOutput (if the actual server time is 24 December 2016):\n2016-12-24\n\
    \nThe second parameter must be specified in the PHP `time()` format: this output\
    \ would be the same:\n\n```php\n<?php\n  echo date(\"Y-m-d\", time());\n?>\n```\n\
    \nThe `time()` function returns the desired time as a number. The value is always\
    \ the number of seconds after the UNIX time. This began on 1 January 1970 through\
    \ 00:00:00 GMT.\n\n#### microtime()\n\nMore precisely, but not suitable for the\
    \ `date()` function, is the function of `microtime()`. The parameter can specify\
    \ optionally whether you want to receive the return value as point number. The\
    \ function returns the current date in the UNIX time in the exact number of microseconds.\
    \ This is, for example, useful for measuring how long a script has run in order\
    \ to find programs that would still have potential for optimization:\n\n```php\n\
    <?php\n  $start = microtime(true);\n  /*\n  Two dummy variables, so that we can\
    \ generate some computing time for the script:\n  */\n  $dummyVariable1 = 1;\n\
    \  $dummyVariable2 = 3;\n  $x = 0;\n  while ($x < 1000000) {\n    $x++;\n    $dummyVariable1\
    \ *= $dummyVariable2;\n    $dummyVariable1 = $dummyVariable1 / $dummyVariable2;\n\
    \  }\n  $end = microtime(true);\n  echo \"Runtime: \" . ($end - $start);\n?>\n\
    ```\n\nThis has, for example, the output:\nRuntime: 0.086302995\n\n#### Give a\
    \ point in time to DATE() with mktime()\n\nIf you want to specify a certain time,\
    \ you have to do this with `mktime(hour, minute, second, month, day, year)`:\n\
    \n```php\n<?php\n  echo date(\"Y-m-d\", mktime(0,0,0,12,24,2012));\n?>\n```\n\n\
    It would have the same output.\n\n#### strtotime()\n\nTo forestall a function\
    \ from the chapter of text, I shall tell you `strtotime(\"date in text\")`. With\
    \ this, you can convert one written text in human readable form of a certain time\
    \ in the `time()` format for the `date()` function:\n\n```php\n<?php\n  echo date(\"\
    Y-m-d\", strtotime(\"May 17th, 2012\"));\n?>\n```\n\nSome examples of such conversions\
    \ are as follows:\n`strtotime(\"now\")`\n`strtotime(\"2012-05-17\")`\n\nYou can\
    \ even do some simple calculations from the actual point in time:\n`strtotime(\"\
    next Friday\")`\n`strtotime(\"last Monday\")`\n`strtotime(\"+1 day\")`\n`strtotime(\"\
    +1 week 2 days 3 hours 4 seconds\")`\n\n**The following formats are possible:**\n\
    \n- `d`: Day of the month, two digits with leading zeros (01 to 31)\n- `D`: Weekday,\
    \ truncated to three letters (Mon to Sun)\n- `j`: Day of the month without leading\
    \ zeros (1 to 31)\n- `l` (lower case 'L'): Full weekday (Sunday to Saturday)\n\
    - `N`: Numeric representation of the day of the week according to ISO 8601 (1\
    \ Monday to 7 Sunday)\n- `w`: Numeric day of the week (0 Sunday to 6 Saturday)\n\
    - `z`: The day of the year (starting from 0 0 to 365)\n- `W`: ISO 8601 week number\
    \ of year, weeks starting on Monday (Example 42)\n- `F`: Month as a whole word\
    \ (January to December)\n- `m`: Month as a number, with leading zeros (01 to 12)\n\
    - `M`: Month name with three letters (Jan to Dec)\n- `n`: Month number without\
    \ leading zeros (1 to 12)\n- `t`: Number of days of that month (28 to 31)\n- `L`:\
    \ Leap year or not (1 if leap year, 0 otherwise)\n- `o`: Year (four digits)\n"
