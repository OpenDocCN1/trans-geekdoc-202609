    \ specify how much of the file should be read.\n\nWe simply pass the size of the\
    \ file, to be read, using the practical filesize() function. With the function,\
    \ nl2br(), the line endings from a text file can be converted to HTML-<br/>.\n\
    \n### Manage sessions\n\nIf we want to recognize a returning visitor, it is necessary\
    \ to use the so-called sessions. Within sessions, variables can be stored, and\
    \ they can be used across files. If we start a session for a visitor, a unique\
    \ identification number, the session ID, is generated.\n\nIf we want to open a\
    \ session for a visitor, it is enough to simply call the function session\\_start().\
    \ You can then set values in the $\\_SESSION global array. If the same session\
    \ is to be reused on the next call, it is sufficient to call it session\\_start()\
    \ at the beginning of the script. In the visitor’s browser is stored a cookie\
    \ with the session ID; the values of the $\\_SESSION array are stored on the server\
    \ in a temporary cache. If you want to end the session securely, you must use\
    \ the session\\_destroy() function.\n\nHere is an example of how to use sessions:\n\
    \nsession1.php\n\n<?php\n\n  session\\_start();\n\n  $\\_SESSION\\[\"username\"\
    \\] = \"Walter\";\n\n  echo \"Hello \" . $\\_SESSION\\[\"username\"\\];\n\n?>\n\
    \nsession2.php\n\n<?php\n\n  session\\_start();\n\n  if (isset ($\\_SESSION\\\
    [\"username\"\\])) {\n\n    echo \"Hello \" . $\\_SESSION\\[\"username\"\\];\n\
    \n  }\n\n  else {\n\n    \"First please open the page session1.php!\";\n\n  }\n\
    \n?>\n\nAfter the call of session\\_start() in the second file, the same content\
    \ of the $\\_SESSION array is usable as in the first file.\n\n## Day 5\n\n###\
    \ Write clean code (which is still understandable in a year)\n\nBefore you acquire\
    \ an unclean programming style, I would like to give you some tips on how to write\
    \ a ‘clean’ code on your way as a programmer.\n\nOn the one hand, it is extremely\
    \ important, as has already been described in the chapter on variables, to use\
    \ appropriate and self-describing variables and function names. Nothing is more\
    \ disappointing than to read variables like $a, $b, or $x in an unknown code because\
    \ they do not show what will be stored in them.\n\nUse tab stops in your code\
    \ writing. Individual programming studios sometimes have a somewhat different\
    \ form, but many OpenSource projects have the following syntax style:\n\nfunction\
    \ name (parameter) {\n\n  code block\n\n}\n\nThat is, a space between function\
    \ name, a space after the parenthesis with the parameters followed by a curved\
    \ parenthesis. The code block of the function is inserted by a tab step, and the\
    \ closing curved bracket is again at the height of the function name. This makes\
    \ it very easy to see where a function starts and stops.\n\nDo not save with comments.\
    \ You do not have to comment on any one-line If query, but a certain structure\
    \ for longer scripts is essential.\n\nDo not write a code twice, that is, avoid\
    \ redundancy. Once a code is used several times, write a function. This increases\
    \ the clarity of the code and saves valuable memory space. In addition, you need\
    \ to make corrections or extensions only at one code point.\n\n### Security within\
    \ PHP scripts\n\nHere are some of the most important tips to give you some idea\
    \ on how to make your PHP scripts safer:"
