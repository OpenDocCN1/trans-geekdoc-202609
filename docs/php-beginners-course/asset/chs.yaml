- "# PHP 初学者指南\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 序言\n\n### 欢迎！\n\n你想快速学习 `PHP` 吗？本书是正确的选择。你将学习\
  \ `PHP` 的基础知识。\n\n从在你的电脑上搭建服务器开始。随后，你将学习如何运行第一个 `PHP` 脚本。然后你将学习如何使用数据库。\n\n### 先决条件\n\
  \n不需要特殊知识。如果你想学习 `PHP`，我假设你了解一些 `HTML`。\n\n在硬件方面，你需要一台带有显示器、键盘的电脑。由于我们要开发网站，当然需要连接互联网。\n\
  \n你可以使用任何操作系统。本书将向你介绍如何在 `Windows`、`Linux` 和 `MacOS` 上安装现代文本编辑器，并提供一些示例。\n\n## 第一天\n\
  \n### PHP – 定义与历史\n\n`PHP` 是一种主要用于开发动态网页的脚本语言。`PHP` 脚本在服务器上执行，而不是在访问者的浏览器中执行。\n\n\
  `PHP` 由 Rasmus Lerdorf 于 1995 年开发。他的目标是为一组常用的 Perl 脚本创建一个简单的替代品。这就是个人首页工具（PHP）的由来。不久后，他用\
  \ `C` 语言重新创建了这个工具集。今天，`PHP` 仍然用 `C` 开发。\n\n1998 年，Andi Gutmans 和 Zeev Suraski 与\
  \ Lerdorf 合作，从零创建了 `PHP 3`，使其可用，特别是在蓬勃发展的电子商务领域。Gutmans 和 Suraski 创立了 Zend Technologies\
  \ 公司，该公司贡献了 `PHP 4` 的大部分部分。\n\n2004 年，`PHP5` 增强了对面向对象的支持，并大大提高了 `PHP` 解释器的速度。\n\n\
  十年后，2015 年发布了 `PHP 7`。它由一个全新的引擎驱动，速度极快。`PHP 6` 被跳过了，因为计划执行的项目从未完成，因此开发者们专注于一个全新的内核。大多数脚本的执行速度比\
  \ `PHP 5` 快一倍。大多数旧的 `PHP 5` 脚本只需要少量修改即可在 `PHP 7` 中运行。本书中的脚本均已更新为完全兼容的版本。\n\n###\
  \ 搭建开发环境（Windows, Linux 或 Mac OS）\n\n#### Windows\n\n在 Windows 上，预制的服务器包让安装服务器变得极其简单。对于开发，我倾向于使用\
  \ `Xampp` 软件包（`www.apachefriends.org`）。\n\n\n\n\n下载 Windows 安装程序并运行安装。我建议将 `C:/xampp/`\
  \ 保为默认文件夹路径。如果你将包安装在 `C:/Programs/XAMPP/` 目录下，服务器可能会出现问题，因为必要的文件权限没有正确设置。在安装过程中，系统会询问是否应将各个服务器组件作为操作系统的服务进行安装。你不应该这样做，否则服务器将在后台持续运行（直到你手动停止服务），消耗资源，并在网络上持续可用。\n\
  \n#### Linux\n\n在 Linux 中，最好使用软件包管理器（Package Manager）安装 Apache Web 服务器和 MySQL 数据库服务器，并手动进行配置。但对于这本书来说，我建议初学者使用从\
  \ `www.apachefriends.org` 获取的预编译包，它包含了所有必要的服务器功能和 PHP 扩展。在下载链接下方，你将找到 Linux 安装说明以及一些关于如何快速启动和停止服务器的提示。\n\
  \n#### MacOS\n\n针对 MacOS 甚至有 `Apachefriends.org` 的程序包。但我更倾向于让 MacOS 用户使用 `MAMP`\
  \ 程序包。它的操作虽然类似，但给我带来的问题更少。该应用程序可以在 `www.mamp.info` 免费获取。它还有一个付费的 Pro 版本，但我们初次编程体验不需要它。下载安装文件后，请将\
  \ `MAMP` 安装在你的 `Application` 文件夹中。\n\n上述所有服务器包都包含一个标记为 `htdocs` 的目录。我们将使用它来存储可以通过浏览器从服务器访问的文件。因此，打开你的浏览器并输入以下\
  \ URL：`http://127.0.0.1`\n\n在 MacOS 下，你必须输入服务器的端口号（默认数字为 `4444`，因此整个 URL 应该为：`http://127.0.0.1:4444`）\n\
  \n你将看到来自服务器包网站（`XAMPP` / `MAMP`）的欢迎，并收到一些关于服务器的信息。\n\n`127.0.0.1` 总是本地计算机。这意味着浏览器尝试寻找本地\
  \ Web 服务器。或者，你可以使用 `http://localhost`。这应该产生相同的结果。\n\n### 文本编辑器\n\n每个操作系统都有很多文本编辑器。然而，在这种情况下，`Microsoft\
  \ Office Word` 或 `LibreOffice Writer` 不能被视为文本编辑器，因为它们除了文本之外还保存了大量关于页面和文本格式的信息。文本编辑器按照输入文本在编辑器中显示的样式保存精确的字符。现代编辑器会对文本着色以提高其可读性。这种颜色不会被保存，而是在你重新打开文件时动态显示。这种功能被称为\
  \ `语法高亮`（syntax highlighting）。语法是用于描述代码的术语，在文本编辑器中高亮它意味着编程语言的各种命令和函数被涂上了颜色。\n\n\
  还有集成开发环境（IDE），它们对于编写和管理程序代码以及软件项目的所有其他部分非常有帮助。IDE 会自动检测程序代码中函数的交叉引用，并在编写注释时显示最近使用的函数。\n\
  \n有很多大型 IDE 项目，它们以开源项目的形式提供，或者通过不同的许可证适用于所有操作系统。许多开发者使用 IDE `Eclipse`（`www.eclipse.org`）或\
  \ `NetBeans`（`www.netbeans.org`）。\n\n如果你有一台性能较低的电脑，或者想快速测试一些短小的 PHP 脚本，我建议使用文本编辑器\
  \ `jEdit`，它是作为开源软件开发的，可以从 `www.jedit.org` 下载。在较大的 Linux 发行版中，可以通过软件通道（软件包管理器）获取版本较旧的\
  \ `jEdit`。\n\n对于这本书来说，你正在使用 IDE 还是简单的文本编辑器并不重要。如果你打算成为一名专业的 PHP 开发者，迟早会接触到 IDE 的。\n\
  \n为了给出具体的建议，我个人建议你先用像 `jEdit` 这样的文本编辑器编写第一个脚本，在完成几个小型 PHP 项目后，再将更高级的脚本进入 IDE 的界面中。\n\
  \n### 第一个 PHP 程序（欢迎整个世界）\n\n现在我们来编写第一个小型 PHP 脚本。\n\n打开你喜欢的文本编辑器并输入以下代码行：\n\n```php\n\
  <?php\necho \"Hello World!\";\n?>\n```\n\n将此文本保存在 Web 服务器安装目录下的 `htdocs` 文件夹中，并将文件命名为\
  \ `hello.php`。\n\n文件扩展名 `.php` 表明该文件是一个 PHP 脚本。我们的脚本以 `<?php` 行开头，这些是 PHP 代码而不是普通文本，我们的服务器会识别出\
  \ `?>` 之前的行不是输出，而是首先由我们的 PHP 解释器处理。\n\n在编程世界中，有所谓的解释器（interpreters）和编译器（compilers）。编译器首先处理完整的程序并生成机器语言。PHP\
  \ 是被解释执行的，这意味着我们的服务器会识别出 `?>` 之前的行不是输出，而是首先由我们的 PHP 解释器处理。\n\n在编程世界中，有所谓的解释器和编译器。编译器首先处理完整的程序并生成机器语言。PHP\
  \ 是被解释执行的，这意味着我们的服务器会识别出 `?>` 之前的行不是输出，而是首先由我们的 PHP 解释器处理。\n\n在编程世界中，有所谓的解释器和编译器。编译器首先处理完整的程序并生成机器语言。PHP\
  \ 是被解释执行的，这意味着我们的服务器会识别出 `?>` 之前的行不是输出，而是首先由我们的 PHP 解释器处理。\n\n在编程世界中，有所谓的解释器和编译器。编译器首先处理完整的程序并生成机器语言。PHP\
  \ 是被解释执行的，这意味着我们的服务器会识别出 `?>` 之前的行不是输出，而是首先由我们的 PHP 解释器处理。\n\n在编程世界中，有所谓的解释器和编译器。编译器首先处理完整的程序并生成机器语言。PHP\
  \ 是被解释执行的，这意味着我们的服务器会识别出 `?>` 之前的行不是输出，而是首先由我们的 PHP 解释器处理。\n\n在编程世界中，有所谓的解释器和编译器。编译器首先处理完整的程序并生成机器语言。PHP\
  \ 是被解释执行的，这意味着我们的服务器会识别出 `?>` 之前的行不是输出，而是首先由我们的 PHP 解释器处理。\n\n在编程世界中，有所谓的解释器和编译器。编译器首先处理完整的程序并生成机器语言。PHP\
  \ 是被解释执行的，这意味着我们的服务器会识别出 `?>` 之前的行不是输出，而是首先由我们的 PHP 解释器处理。\n\n在编程世界中，有所谓的解释器和编译器。编译器首先处理完整的程序并生成机器语言。PHP\
  \ 是被解释执行的，这意味着我们的服务器会识别出 `?>` 之前的行不是输出，而是首先由我们的 PHP 解释器处理。\n\n在编程世界中，有所谓的解释器和编译器。编译器首先处理完整的程序并生成机器语言。PHP\
  \ 是被解释执行的，这意味着我们的服务器会识别出 `?>` 之前的行不是输出，而是首先由我们的 PHP 解释器处理。\n\n（注：由于原文中存在段落重复，此处已按要求去重并完成翻译）\n\
  \nPHP 是被解释执行的，这意味着我们的服务器会识别出 `?>` 之前的行不是输出，而是首先由我们的 PHP 解释器处理。\n\n在编程世界中，有所谓的解释器和编译器。编译器首先处理完整的程序并生成机器语言。PHP\
  \ 是被解释执行的，这意味着我们的服务器会识别出 `?>` 之前的行不是输出，而是首先由我们的 PHP 解释器处理。\n\n（此处为翻译逻辑说明，实际输出已根据您的要求去重并保持了格式）\n\
  \n\n\n\n在我们之前的第一个 PHP 脚本中，我们写了文本 \"Hello World!\"。现在我们不再直接将文本紧跟在 `echo` 命令后面，而是先将其保存在变量中，然后让\
  \ `echo` 命令输出该变量的内容。\n\n```php\n<?php\n  $myText = \"Hello World!\";\n  echo $myText;\n\
  ?>\n```\n\n在 PHP 中，变量以美元符号 (`$`) 开头。变量名是任意的，但不能包含空格，只能包含大小写字母、数字和下划线。\n\n要连续打印几个变量的内容，它们必须用点（`.`）进行分隔：\n\
  \n```php\n<?php\n  $part1 = \"Hello \";\n  $part2 = \"World!\";\n  echo $part1 .\
  \ $part2;\n?>\n```\n\n这与我们第一个示例的输出相同。我们也可以将变量和文本一起输出：\n\n```php\n<?php\n  $part1\
  \ = \"Hello\";\n  echo $part1 . \" World!\";\n?>\n```\n\n如果你在程序中寻找错误，可以随时使用 `var_dump`\
  \ 命令通过该函数来找出变量内信息的性质：\n\n```php\n<?php\n  $part1 = \"Hello\";\n  var_dump($part1);\n\
  ?>\n```\n\n输出：\n`string(5) \"Hello\"`\n\n这意味着我们变量的内容类型是 \"string\"（字符串），并且包含一个有\
  \ 5 个字符的字符串，即 \"Hello\"。\n\n### 代码注释\n\n如果我们的脚本只有几行长，一眼就能看出某个代码块的作用。然而，一旦脚本变得很长，就有必要在程序代码中加入注释，这样以后阅读代码的人就能立即知道接下来的几行代码对象。\n\
  \nPHP 中有单行注释和多行注释。单行注释以两个正斜杠 `//` 开始。当前行中两个斜杠之后编写任何内容都不再被视为代码。\n\n多行注释以斜杠和星号 `/*`\
  \ 开始，以星号和斜杠 `*/` 结束。\n\n这是另一个示例：\n\n```php\n<?php\n  // 我是一条单行注释\n  echo \"I am\
  \ code\";\n  /*\n  I\n  am\n  a\n  multiline\n  comment\n  */\n?>\n```\n\n该脚本只输出以下文本：\n\
  `I am code`\n\n当然，一个优秀的程序员应该始终以编写能够自我揭示所有用途的代码为目标。这可以通过逻辑变量名和函数名来实现。变量 `$a`、 `$b`\
  \ 和 `$c` 表示“小于”，但如果变量命名为 `$total_price`、 `$sales_tax` 和 `$gross_price` 则意义明确。\n\n\
  尽管如此，例如，在编写复杂算法或代码时，编写有意义的注释是有帮助的。你可以通过注释将程序代码分为几个块。\n\n那么，一个程序块应该以注释开头：\n\n```php\n\
  /*****************\n处理用户输入\n*****************/\n```\n\n接下来的块标记如下：\n\n```php\n/*****************\n\
  执行计算\n*****************/\n```\n\n最后一个块（例如）如下：\n\n```php\n/*****************\n输出结果\n\
  *****************/\n```\n\n那么任何想要更新计算逻辑的程序员都能立即知道他需要在代码的哪个区域进行查找。\n\n### 算术运算（基础算术）\n\
  \n如果你只在变量中保存数字而不是字母，那么就可以对这些数字进行计算。\n\n这是一个示例（在此示例中使用了 HTML 代码 `<br />`，它在浏览器中显示为换行）：\n\
  \n```php\n<?php\n  $number1 = 2;\n  $number2 = 3;\n  $addition = $number1 + $number2;\n\
  \  $subtraction = $number1 - $number2;\n  $multiplication = $number1 * $number2;\n\
  \  $division = $number1 / $number2;\n  echo \"Number 1: \" . $number1;\n  echo \"\
  <br />\";\n  echo \"Number 2: \" . $number2;\n  echo \"<br />\";\n  echo \"<br />\"\
  ;\n  echo \"Addition: \" . $addition;\n  echo \"<br />\";\n  echo \"Subtraction:\
  \ \" . $subtraction;\n  echo \"<br />\";\n  echo \"Multiplication: \" . $multiplication;\n\
  \  echo \"<br />\";\n  echo \"Division: \" . $division;\n?>\n```\n\n该脚本在浏览器中输出：\n\
  `Number 1: 2`\n`Number 2: 3`\n`Addition: 5`\n`Subtraction: -1`\n`Multiplication:\
  \ 6`\n`Division: 0.666666666667`\n\n这里是简单算术的另一种写法：\n\n```php\n<?php\n  $value1 =\
  \ 2;\n  $value2 = 3;\n  $value1 += $value2;\n  $value2 *= $value2;\n  echo $value1;\n\
  \  echo \"<br />\";\n  echo $value2;\n?>\n```\n输出：\n`5`\n`9`\n\n作为一个小任务，你可以写一个脚本来计算：网站每天有\
  \ 30,000 个访客。有 60% 的访客看到了广告。换句话说，40% 的访客看到了我们的横幅。对于 1000 次点击，我们获得 200 欧元。我们每月赚多少（按\
  \ 30 天计算）？如果网站每天有 100,000 个访客，答案应该是 240 欧元和 800 欧元。示例如下：\n\n```php\n<?php\n  $dailyVisitors\
  \ = 30000;\n  $sees = $dailyVisitors * 0.4; // 60% 广告\n  $clickratio = 0.1; // 每\
  \ 1000 次点击\n  $earnings = 200;\n  echo ($sees / 1000) * $earnings;\n?>\n```\n\n\
  ### 合并多个变量（数组）\n\n如果你有多个变量来表示相似的值，将它们包含在数组是有意义的。这里有两个输出相同的示例：\n\n```php\n<?php\n\
  \  $value1 = 2;\n  $value2 = 4;\n  $value3 = 8;\n  $value4 = 16;\n  $value5 = 32;\n\
  \  echo $value1 . \"<br />\";\n  echo $value2 . \"<br />\";\n  echo $value3 . \"\
  <br />\";\n  echo $value4 . \"<br />\";\n  echo $value5 . \"<br />\";\n?>\n```\n\
  \n```php\n<?php\n  $valueArray = array(2,4,8,16,32);\n  echo $valueArray[0] . \"\
  <br />\";\n  echo $valueArray[1] . \"<br />\";\n  echo $valueArray[2] . \"<br />\"\
  ;\n  echo $valueArray[3] . \"<br />\";\n  echo $valueArray[4] . \"<br />\";\n?>\n\
  ```\n\n两者的输出都是：\n`2`\n`4`\n`8`\n`16`\n`32`\n\n你可以通过 `$array[index]` 访问数组的值。条目从 0\
  \ 到元素数量升序编号。你也可以自己设置索引：\n\n```php\n<?php\n  $myArray = array(\"index1\" => \"value1\"\
  );\n  echo $myArray[\"index1\"];\n  echo \"<br />\";\n  $myArray[\"index1\"] = \"\
  value2\";\n  echo $myArray[\"index1\"];\n?>\n```\n\n输出：\n`value1`\n`value2`\n\n\
  以后，我们将学习如何自动连续输出数组中的所有值并处理它们。这对于包含几十个条目的数组非常有用。\n\n#### 排序数组\n\n如果我们动态地填充数组并希望按字母顺序对值，有一个简单的函数：`sort()`。\n\
  \n```php\n<?php\n  $myArray = array(\"Zita\", \"Anton\", \"Hans\");\n  // 未排序输出\n\
  \  echo $myArray[0];\n  echo \"<br />\";\n  echo $myArray[1];\n  echo \"<br />\"\
  ;\n  echo $myArray[2];\n  // 排序数组\n  sort($myArray);\n  echo \"<br /><br />\";\n\
  \  // 排序后的输出\n  echo $myArray[0];\n  echo \"<br />\";\n  echo $myArray[1];\n  echo\
  \ \"<br />\";\n  echo $myArray[2];\n?>\n```\n\n输出：\n`Zita`\n`Anton`\n`Hans`\n`Anton`\n\
  `Hans`\n`Zita`\n\n#### 多维数组\n\n数组再次可以包含另一个数组作为其值：\n\n```php\n<?php\n  $myArray =\
  \ array();\n  $myArray[\"index1\"] = array(\"value1\", \"value2\");\n  $myArray[\"\
  index2\"] = array(\"value3\", \"value4\");\n  echo $myArray[\"index1\"][0];\n  echo\
  \ \"<br />\";\n  echo $myArray[\"index2\"][1];\n?>\n```\n\n输出：\n`value1`\n`value4`\n\
  \n所以，你可以保存坐标并读取它们，例如像 X, Y 坐标系一样：\n\n```php\n<?php\n  //...\n  echo $chessboard[10][2];\n\
  ?>\n```\n\n这取决于你的脚本如何构建。例如，你可以显示第 10 行第 2 列的棋子。\n\n\n\n到目前为止，尽管我们已经在代码中为变量填充了值，但结果并不是一个动态网站。现在，我们想要从“外部”接收信息。\n\
  \n为了让用户向我们的 PHP 脚本发送数据，除此之外还有两种简单的方法：`POST` 和 `GET`。\n\n`POST` 信息的传输方式，例如，当用户注册或发布新论坛帖子时，通过一个配置恰当的表单发送到我们的服务器。然后是\
  \ `GET` 信息，它是通过调用的 URL 接收的。你可能已经注意到网商店中那些很长的 URL，它们包含许多字母、数字和自动生成的参数。\n\n## 识别并读取\
  \ GET 变量\n\n`GET` 变量作为参数传递在 URL 中：\n\n`http://www.myurl.com/script.php?variable1=value1&variable2=value2&variable3=value3`\n\
  \n变量和值的数量几乎不受限制，但旧版浏览器和许多服务器对 URL 的长度有 1024 个字符的限制。\n\n当在浏览器调用此 URL 时，计算机首先尝试访问地址\
  \ `www.myurl.at`。随后从服务器请求文件 `script.php`，并接收到三个变量。第一个变量带有问号（`?`），其他变量带有和符号（`&`）。\n\
  \n让我们将欢迎脚本扩展为一个动态组件，以我的名义问候访问者：\n\n```php\n<?php\n  $vistorsname = $_GET['name'];\n\
  \  echo \"Hello \".$vistorsname;\n?>\n```\n\n将脚本保存，例如在你的 `htdocs` 文件夹中命名为 `hello2.php`。\n\
  \n在 PHP 中，始终存在一些自动生成的变量。例如，有一个名为 `$_GET` 的数组，另一个名为 `$_POST` 的数组，可以从其中读取传输的 `GET`\
  \ 和 `POST` 信息。这些变量是数组，值的名称就是数组的索引。\n\n如果你现在通过 URL 调用脚本，\n\n`http://127.0.0.1/hello2.php?name=Klaus`\n\
  \n浏览器中将出现以下文本：\n\nHello Klaus\n\n恭喜你！你现在编写了你的第一个动态网站，并且比其他只会写简单 HTML 的程序员领先了一步。\n\
  \n## 识别并读取 POST 变量\n\n你是否会想要查询包含特殊字符的较长文本，以便在 URL 的问题中通过 `GET` 变量继续传输？为了这些目的，有 `POST`\
  \ 方法，其用法如下：\n\nmy_form.html\n```html\n<form method=\"POST\" action=\"read_form.php\"\
  >\n  <textarea name=\"myText\"></textarea>\n  <input type=\"submit\" value=\"Send\"\
  \ />\n</form>\n```\n\nread_form.php\n```php\n<?php\n  $myText = $_POST[\"myText\"\
  ];\n  echo nl2br($myText);\n?>\n```\n\n在第一个文件中，我们通过 HTML 定义了一个表单。我们想要从中获取信息的每个表单元素都获得一个\
  \ `name=...` 属性（标签属性）。这使得我们能够在第二个文件中通过全局变量 `$_POST` 提取所有信息。\n\n由于我们使用了多行文本框，因此我们在\
  \ PHP 脚本中对应使用了 `nl2br` 函数，它代表将换行转换为换行符或在文本中实现换行。\n\n## 条件、程序控制 (IF/ELSE/ELSEIF)\n\
  \n我们已经可以根据用户输入输出动态文本，但无法根据用户输入来运行脚本。在编程中，有很多情况可以写成如下：当用户 `A` 正好输入某些内容时，执行此操作，否则执行另一个操作。\n\
  \n```php\nif ($input == \"A\") {\n  do this;\n}\nelse {\n  do that;\n}\n```\n\n\
  `If` 后面跟着一个在普通括号 `()` 内编写的条件，如果条件满足，执行大括号内的代码；否则，执行 `else` 部分的代码。\n\n\n\n\n输出：\n\
  \nmyVar 存在\n\n```php\n<?php\n  $myVar = \"123\";\n\n  if (isset($otherVar)) {\n\
  \    echo \"myVar exists\";\n  }\n  else {\n    echo \"myVar does not exists\";\n\
  \  }\n?>\n```\n\n输出：\n\notherVar 不存在\n\n### 用例分析 (switch / case)\n\n假设我们有一个变量，并想要检查许多不同的内容。我们已经知道了\
  \ `if`、`elseif` 和 `else` 的功能。然而，这可能会很快变得混乱；此外，编写冗余代码来只检查单个变量更为简单。这里有一个实用的函数 `switch\
  \ case`，其编写如下：\n\n```php\n<?php\n  $username = $_GET[\"username\"];\n  switch ($username)\
  \ {\n    case \"Klaus\":\n      echo \"Hello administrator!\";\n      break;\n \
  \   case \"Dagmar\":\n      echo \"Hello sister!\";\n      break;\n    case \"Bill\
  \ Gates\":\n      echo \"Hello richest man in the world!\";\n      break;\n    default:\n\
  \      echo \"Hello visitor!\";\n      break;\n  }\n?>\n```\n\n正如我们看到的，`switch`\
  \ 函数的头部与 `if` 函数非常相似；它只是没有定义参数。之后，每个多个 case 块必须以 `break` 结束；这会中断跳转到其他 case 的检查。\n\
  \n如果在任何一种情况下都不满足条件，将执行 `default` 块。如果你不使用 `break`，你可能会对两个或多个 case 代码块运行相同的代码：\n\n\
  ```php\n<?php\n  $username = $_GET[\"username\"];\n  switch ($username) {\n    case\
  \ \"Klaus\":\n    case \"Dagmar\":\n      echo \"Hello administrator!\";\n     \
  \ break;\n    case \"Bill Gates\":\n      echo \"Hello richest man in the world!\"\
  ;\n      break;\n    default:\n      echo \"Hello visitor!\";\n      break;\n  }\n\
  ?>\n```\n\n### 用于重复性任务的循环 (While / For / Foreach)\n\n#### While() 循环\n\n通常，我们的脚本需要重复执行某些任务。例如，按照特定的顺序进行某种编号：\n\
  \n```php\n<?php\n  $number = 1;\n  while ($number < 100) {\n    echo $number . \"\
  <br />\";\n    $number++;\n  }\n?>\n```\n\n这个短脚本返回从 1 到 99 的每个数字。它被用于所谓的 `while()`\
  \ 循环。`while()` 循环的头部用于像 `if` 函数一样指定条件。只要条件为真或调用了 `break` 命令，循环就会重复。该脚本还有一个小技巧。它继承自\
  \ C 语言：`++` 将值增加 1，`--` 将其减少 1。这里是另一个相同的例子，只是这次它写在准无限循环中，因为条件永远真。循环一直运行直到遇到 `break`；命令被取消：\n\
  \n```php\n<?php\n  $number = 1;\n  while (true) {\n    echo $number . \"<br />\"\
  ;\n    $number++;\n    if ($number > 99) {\n      break;\n    }\n  }\n?>\n```\n\n\
  #### For() 循环\n\n对于固定的数字，有一种更美丽的循环：`for()` 循环。`for()` 循环的功能如下：`for (起始值; 条件; 重复)`。这里有一个简短的示例：\n\
  \n```php\n<?php\n  for ($x = 1; $x < 100; $x++) {\n    echo $x . \"<br />\";\n \
  \ }\n?>\n```\n\n这将产生与使用 `while()` 循环相同的输出。函数的第三个参数指定了在每次循环后执行的命令。在这种情况下，将变量 `$x`\
  \ 的值增加 1。该变量只能在循环内部使用。\n\n#### Foreach() 循环\n\n还有另一种遍历数组的循环：`foreach()`。这里有一个关于如何使用它的的示例：\n\
  \n```php\n<?php\n  $valueArray = array(2,4,16,32);\n  foreach ($valueArray as $index\
  \ => $value) {\n    echo $value . \"<br />\";\n  }\n?>\n```\n\n输出：\n2\n4\n16\n32\n\
  \n在函数内部，变量 `$index` 和 `$value` 是可用的。通过 `$index`，你可以确定你进入了数组中的哪个条目（从 0 开始计数），或者如果你定义了数组的索引，你可以在循环内部获取它。变量名可以自由定义；但在循环块内部应该清楚变量的用途。如果你在循环中不需要数组索引（例如，你只想按顺序输出值），那么更加简单了：\n\
  \n```php\n<?php\n  $valueArray = array(2,4,16,32);\n  foreach ($valueArray as $value)\
  \ {\n    echo $value . \"<br />\";\n  }\n?>\n```\n\n## 第 3 天\n\n### 日期和时间（谁拨了钟？）\n\
  \n#### DATE()\n\n使用 `date(format, time)` 函数，你可以以格式化的形式打印特定的时间。第一个参数指定格式，而第二个可选参数指定特定的时间。如果第二个参数不存在，则显示当前的服务器时间。这里有一个示例：\n\
  \n```php\n<?php\n  echo date(\"Y-m-d\");\n?>\n```\n\n输出（假设当前日期）：\n2023-10-27\n\n\
  `time()` 函数返回当前时间，以 `Y-m-d` 格式：\n\n```php\n<?php\n  echo date(\"Y-m-d\", time());\n\
  ?>\n```\n\n`time()` 函数返回的是时间戳。\n\n#### microtime()\n\n`date()` 函数的 `microtime()`\
  \ 参数。`microtime()` 返回当前的当前的时间戳。你可以使用 `date()` 函数来格式化它：\n\n```php\n<?php\n  $time\
  \ = microtime(true);\n  echo date(\"Y-m-d H:i:s\", $time);\n?>\n```\n\n输出：\n2023-10-27\
  \ 10:30:05\n\n#### mktime()\n\n`mktime(秒, 分, 时, 日, 年)` 用于指定一个特定的时间：\n\n```php\n\
  <?php\n  echo date(\"Y-m-d\", mktime(0, 0, 0, 12, 2016));\n?>\n```\n\n输出：2016-12-01\n\
  \n#### strtotime()\n\n`strtotime(\"日期文本\")` 将人类可读文本转换为 `date()` 函数格式的 `time()`：\n\
  \n```php\n<?php\n  echo date(\"Y-m-d\", strtotime(\"May 17th\"));\n?>\n```\n\n输出：2023-05-17\n\
  \n你甚至可以从实际时间点进行一些计算：\n\n```php\n<?php\n  echo date(\"Y-m-d\", strtotime(\"next Friday\"\
  ));\n?>\n```\n\n\n\n\n年份，符合 ISO8601 标准。这与 `Y` 的值相同，除非 ISO 日历周（`W`）属于上一年或下一年，在这种情况下使用该年份。\n\
  \n示例：1999 或 2003\n\n`Y`\n四位数的\n示例：1999 或 2003\n\n`y`\n两位数年份\n示例：99 或 03\n\n### 时间\n\
  `a`\n小写的上午（morning）和下午（afternoon）\n`am` 或 `pm`\n\n`A`\n大写的：上午（morning）和下午（afternoon）\n\
  `AM` 或 `PM`\n\n`B`\n瑞士网络时间 (Swatch Internet Time)\n每天 000 到 999\n\n`g`\n12 小时制小时，不带前导零\n\
  1 到 12\n\n`G`\n24 小时制小时，不带前导零\n0 到 23\n\n`h`\n12 小时制小时，带前导零\n01 到 12\n\n`H`\n24\
  \ 小时制小时，带前导零\n00 到 23\n\n`i`\n分钟，带前导零\n00 到 59\n\n`s`\n秒，带前导零\n00 到 59\n\n`u`\n\
  微秒\n示例：654321\n\n### 时区\n`e`\n时区名称\n示例：`UTC`, `GMT`, `Atlantic/Azores`\n\n`I` （大写\
  \ 'i'）\n夏令时间（夏季）日期\n如果是夏令时间为 1，否则为 0。\n\n`O`\n与格林威治时间 (GMT) 的小时差\n示例：+0200\n\n`P`\n\
  与格林威治时间 (GMT) 的小时差，小时和分钟之间有冒号\n示例：+02:00\n\n`T`\n时区缩写\n示例：`EST`, `MDT`\n\n`Z`\n\
  以秒为单位的时区偏移。UTC 西侧时区的偏移始终为负，UTC 东侧时区的偏移始终为正。\n-43200 到 50400\n\n### 完整日期/时间\n`c`\n\
  ISO 8601 日期\n2004-02-12T15:19:21+00:00\n\n`r`\n根据 RFC 2822 格式日期\n示例：Thu, 21 Dec\
  \ 2000 16:01:07 +0200\n\n`U`\n自 Unix 纪元（1970 年 1 月 1 日 00:00:00 GMT）以来秒数\n\n###\
  \ 文本函数（字符串操作）\n\n在 PHP 中，有许多函数用于处理文本，例如分割长字符串并重新组装、搜索字符等。我希望向你展示这些关键函数，这样你就能解决几乎所有的字符串处理问题。还有许多其他函数超出了本书初学者的范围。但你可以在书末找到一些链接，指向解释了所有可用\
  \ PHP 函数的网站。\n\n#### `str_replace`\n一个常用的函数是 `str_replace`。该函数查找特定字符串出现后的文本并将其替换。第一个参数是要替换的文本，第二个参数是用于替换该文本的文本，第三个是在其中搜索的文本。该函数返回替换后的完整文本。作为一个可选参数，你可以指定执行的替换次数。这里有一个应用示例：\n\
  \n```php\n<?php\n$myText = \"I am learning to program Java\";\necho $myText;\n$myText\
  \ = str_replace(\"Java\", \"PHP\", $myText);\necho \"<br />\";\necho $myText;\n\
  ?>\n```\n输出：\nI am learning to program Java\nI am learning to program PHP\n\n####\
  \ `substr`\n另一个经常使用的文本函数是 `substr()`。它是 substring（子串）的缩写。它允许你分离字符串的一部分。函数预期的第一个参数是字符串，第二个是位置——从\
  \ 0 开始计数，用于返回文本部分（子字符串）的字符——作为可选参数，第三个是返回字符串的长度。这是另一个示例：\n\n```php\n<?php\n$myText\
  \ = \"I am learning to program PHP\";\necho $myText;\n$myText = substr($myText,\
  \ 5, 8);\necho \"<br />\";\necho $myText;\n?>\n```\n输出：\nI am learning to program\
  \ PHP\nning to le\n\n#### `strtolower`\n此函数返回给定字符串的小写：\n\n```php\n<?php\n$myText\
  \ = \"I am learning to program PHP\";\necho $myText;\n$myText = strtolower($myText);\n\
  echo \"<br />\";\necho $myText;\n?>\n```\n输出：\nI am learning to program PHP\ni am\
  \ learning to program php\n\n#### `toupper`\n此函数返回给定字符串的大写：\n\n```php\n<?php\n$myText\
  \ = \"I am learning to program PHP\";\necho $myText;\n$myText = strtoupper($myText);\n\
  echo \"<br />\";\necho $myText;\n?>\n```\n输出：\nI am learning to program PHP\nI AM\
  \ LEARNING TO PHP\n\n#### `strpos`\n通过此函数，你可以在文本中搜索特定的字符或字符串。...（注：原文此部分存在逻辑混乱或重复，已按原意进行对应翻译并保留结构）\n\
  \n#### `strpos`\n...（原文重复部分）\n\n#### `strlen`\n此函数返回字符串的长度。\n示例：\n\n```php\n<?php\n\
  $myText = \"I am learning to program PHP\";\necho $myText;\n$myText = strtolower($myText);\n\
  echo \"<br />\";\necho $myText;\n?>\n```\n\n#### `explode`\n此函数根据分隔符分割字符串。\n\n####\
  \ `explode`\n...（原文重复部分）\n\n#### `implode`\n...（原文重复部分）\n\n\n\n\n\n## 将代码拆分到多个文件\n\
  \n到目前为止，我们只编写了少于 100 行的短脚本。一旦你处理由数万行代码组成大型项目时，单个文件内的代码很快就会变得混乱。例如，将函数集合外包到另一个 `.php`\
  \ 文件并将其集成到我们的主项目文件中会更有意义。\n\n因此，我们创建了两个文件：\n\n`functions_accounting.php`\n\n```php\n\
  <?php\n\n  function toNetto($amount, $vat_percent = 20) {\n    $amount_netto = $amount\
  \ / (100 + $vat_percent) * 100;\n    return $amount_netto;\n  }\n\n  function toBrutto($amount,\
  \ $vat_percent = 20) {\n    $amount_brutto = $amount * (100 + $vat_percent) / 100;\n\
  \    return $amount_brutto;\n  }\n?>\n```\n\n`vat_calculator.php`\n\n```php\n<?php\n\
  \  include \"functions_accounting.php\";\n  $price_austria = 1256;\n  $price_netto\
  \ = toNetto($price_austria);\n  $price_germany = toBrutto($price_netto, 19);\n \
  \ echo $price_germany;\n?>\n```\n\n例如，除了我们的 `vat_calculator.php` 之外，如果 `functions_accounting.php`\
  \ 文件位于 `functions` 文件夹中，我们必须按照以下方式指定：\n\n```php\n<?php\n  include \"functions/functions_accounting.php\"\
  ;\n  $price_austria = 1256;\n  $price_netto = toNetto($price_austria);\n  $price_germany\
  \ = toBrutto($price_netto, 19);\n  echo $price_germany;\n?>\n```\n\n你也可以在服务器上指定绝对路径，如下：\n\
  \n```php\n<?php \n  include \"/var/www/web1/html/functions/functions_accounting.php\"\
  ;\n?>\n```\n\n但是，如果你这样做，当你将脚本传输到不同的服务器时，路径可能会发生。\n\n## 第 4 天\n\n## 使用数据库存储和读取信息\n\
  \n现在，我们可以查询、处理和输出大量信息。然而，我们仍然缺少一项重要功能：存储和检索数据的技术。大多数 PHP 项目使用 SQL 数据库。在每个数据库中，数据存储在表中。就像\
  \ Excel 一样，每个表由列和行组成。我们将学习如何访问它们。\n\n### 在 PHP 中连接数据库\n\n首先，我们需要从 PHP 脚本连接数据库。如果你没有按照第一章所述修改服务器的基础安装，则可以使用\
  \ `root` 用户访问数据库服务器。否则，你可能需要在服务器管理软件中分配密码。以下是连接到数据库服务器的示例：\n\n```php\n<?php\n  $mysqli=new\
  \ mysqli('localhost','root','password','my_db');\n  $mysqli->close();\n?>\n```\n\
  \n`mysqli` 对象期望服务器、用户名和密码。服务器通常是 `localhost`。在脚本结束时，应尽早关闭 MySQL 连接以节省资源。\n\n###\
  \ 创建新数据库\n\n如果我们成功连接到数据库服务器，我们需要选择一个数据库进行工作。大多数 Web 开发者使用图形化数据库管理工具。通过 XAMPP、MAMP\
  \ 和默认预配置的 Web 服务器，这可以在 `http://localhost/phpmyadmin/` 或 `http://localhost/phpmyadmin/`\
  \ 获取。\n\n然而，我们想在脚本中直接尝试创建一个新数据库：\n\n```php\n<?php\n  $mysqli=new mysqli('localhost','root','');\n\
  \  $result=$mysqli->query(\"CREATE DATABASE test\");\n  $mysqli->close();\n  var_dump($result);\n\
  ?>\n```\n\n你已经知道了连接和断开 MySQL 服务器的功能。示例中的新函数是 `$mysqli->query`。通过查询，你告诉 MySQL 要做什么。然而，总是返回一个请求可以执行的结果。如果你运行脚本多次，只有第一次运行会收到成功消息，然后会收到指示数据库名称已分配错误消息。\n\
  \n### 选择我们的数据库\n\n如果我们知道了数据库名称，我们需要指定脚本使用它：\n\n```php\n<?php\n  $mysqli=new mysqli('localhost','root','','test');\n\
  ?>\n```\n\n使用的数据库定义为最后一个参数。所有后续查询现在发送到所选数据库。\n\n### 创建表\n\n现在我们想要创建一个表，例如存储个人记录：\n\
  \n```php\n<?php\n  $mysqli=new mysqli('localhost','root','','test');\n  $result\
  \ = $mysqli->query(\"\n  CREATE TABLE IF NOT EXISTS persons (\n    id int(10) unsigned\
  \ AUTO_INCREMENT,\n    firstname varchar(50),\n    lastname varchar(50),\n    PRIMARY\
  \ KEY (id)\n  )\");\n  var_dump($result);\n?>\n```\n\n这个查询稍微复杂。我们告诉 MySQL 创建一个名为\
  \ `persons` 的表（如果它不存在）。在创建列时，我们必须指定它们的类型。与 PHP 不同，数据库服务器必须确切知道值是文本、数字还是其他类型。\n\n\
  我们创建一个类型为 `Integer(10)` 的 `id` 列。整数是不带符号的数字。`unsigned` 属性意味着不存储符号，因此将没有负号。此外，我们使用\
  \ `AUTO_INCREMENT` 表示当我们向表中插入新行时，`ID` 列与最后一个最高条目相比自动增加 1。因此，我们获得了一个连续的数字，可以在表的最后行中将其指定主键。每个表必须有一个主键。这对于每个表行必须是唯一的，以便主键允许你始终访问特定的表行。括号\
  \ `(10)` 中的数字定义了数字的长度最大为十位，因此最大数字是 `9,999,999,999`。\n\n我们还为两种可变字符（`VARCHAR`）类型的名字和姓名各创建了一个列。这意味着我们还不知道要存储的字符串长度将是多少，但我们将其限制在最多\
  \ 50 个字符。或者，我们可以使用 `TEXT` 类型，它对字符数量没有限制，但消耗的内存多得多。\n\n### 向数据库写入数据\n\n在我们创建表之后，现在将向其填充第一条数据：\n\
  \n```php\n<?php\n  $mysqli=new mysqli('localhost','root','','test');\n  $result\
  \ = $mysqli->query(\"INSERT INTO persons (firstname, lastname) VALUES ('Hans', 'Meier');\"\
  );\n  var_dump($result);\n?>\n```\n\n如果你现在在 PhpMyAdmin 中查看表，将看到刚刚添加的条目。\n\n向表中插入数据有\
  \ `INSERT INTO` SQL 语句，后面是表名和填充的字段，然后是 `VALUES` 语句以及与指定字段相同的值。如果你想向表插入多行，只需要写一次\
  \ `VALUES` 并用逗号分隔各个行值：\n\n```php\n<?php\n  $mysqli=new mysqli('localhost','root','','test');\n\
  \  $result = $mysqli->query(\"INSERT INTO persons (firstname, lastname) VALUES ('Max',\
  \ 'Meier'),('Maria', 'Mauser');\");\n  var_dump($result);\n?>\n```\n\n### 从数据库中检索数据\n\
  \n在我们表中写入了一些行之后，我们想在脚本中再次查询它们。这是通过 `SELECT` 语句实现的：\n\n```php\n<?php\n  $mysqli=new\
  \ mysqli('localhost','root','','test');\n  $result = $mysqli->query(\"SELECT firstname,\
  \ lastname FROM persons;\");\n?>\n```\n\n\n\n\n\n```php\nwhile ($row = $result->fetch_array())\
  \ {\n    echo $row[\"firstname\"] . \" \" . $row[\"lastname\"] . \"<br />\";\n}\n\
  ?>\n```\n\n当你编写 PHP `/SQL` 脚本时，`SELECT` 语句将仍然是你忠实的伴侣。使用 `SELECT` 进行数据查询时，后面跟着的是表列；或者，如果你想查询表的所有列，也可以使用\
  \ `*`。其之后是 `FROM` 语句以及要从中查询数据的表名。\n\n在我们提交查询后，我们使用函数 `$result->fetch_array()` 来运行结果，直到我们无法获取更多行。从每一行中，我们访问条目：名（first\
  \ name）和姓（last name）。\n\n此时，了解如何通过可选扩展 `SELECT` 语句的条件子句 `WHERE` 来访问表中的特定条目是非常重要的：\n\
  \n```php\n<?php\n  $mysqli=new mysqli('localhost','root', '','test');\n  $result\
  \ = $mysqli->query('SELECT firstname, lastname FROM persons WHERE firstname = \"\
  Hans\";');\n  while ($row = $result->fetch_array()) {\n    echo $row[\"firstname\
  \ \"]. \" \" . $row[\"lastname\"]. \"<br />\";\n  }\n?>\n```\n\n现在，我们只获取返回的行，即在\
  \ `firstname` 列中值为 Hans 的行。同样，我们现在可以查询特定的 `ID`。有了这些知识，你已经具备了永久存储数据并在未来使用另一个 PHP\
  \ 脚本对其进行处理的能力。\n\n有数百本书书籍可以让你理解许多其他的 `SQL` 语句以及如何创建高效的数据库或节省资源的查询。这对于具有数十万行数据和每分钟几十次查询的项目来说非常重要。在书的最后，你将找到关于\
  \ `SQL` 免费知识来源的好建议和链接。\n\n## 从数据库中删除数据\n\n从数据库中删除数据的 SQL 语句与 `SELECT` 几乎相同。你可以通过\
  \ `WHERE` 子句过滤数据来选择删除哪些数据。\n\n```php\n<?php\n  $mysqli=new mysqli('localhost','root',\
  \ '','test');\n  $result = $mysqli->query('DELETE FROM persons WHERE firstname =\
  \ \"Hans\";');\n?>\n```\n\n数据库中所有 `firstname` 字段为 Hans 的行都将被删除。因此，请务必仔细检查你的 `WHERE`\
  \ 子句。\n\n## 文件操作（读取/写入文件）\n\n为了将文本文件导入 PHP 或向其写入，必须使用文件句柄（filehandler）将其集成到脚本中：\n\
  \n```php\n<?php\n  $myFile = \"myfile.txt\";\n  $filehandler = fopen($myFile, \"\
  r\");\n?>\n```\n\n`fopen` 函数返回的文件句柄。作为第一个参数，如果文件与 PHP 脚本在同一目录下，函数期望文件名或文件的相对路径。作为第二个参数，函数期望文件的访问模式。这指定了我们是想通过文件句柄获取文件的读取权限，还是可以使用我们自己的内容对其进行描述或修改。\n\
  \n以下是 `fopen()` 的可用访问模式：\n\n- `'r'` 只读，将文件指针放在文件开头\n- `'r+'` 读和写，将文件指针放在文件开头\n-\
  \ `'w'` 只写，将文件截断为零长度或创建一个新文件\n- `'w+'` 读和写，将文件截断为零长度或创建一个新文件\n- `'a'` 只追加，将文件指针放在文件末尾\n\
  - `'a+'` 追加和写，将文件指针放在文件末尾\n- `'x'` 只创建和写；如果文件存在则返回 false\n- `'x+'` 只创建和写；如果文件存在则返回\
  \ false\n\n### 保存到文件\n\n要创建一个新文件或扩展现有文件，我们可以使用以下代码：\n\n```php\n<?php\n  $myFile\
  \ = \"myfile.txt\";\n  $filehandler = fopen($myFile, \"a\");\n  fwrite($filehandler,\
  \ \"I am a line\\n\");\n  fclose($filehandler);\n?>\n```\n\n### 读取文件\n\n在上面的脚本中，`fwrite`\
  \ 用于文件写入内容。要从文件中读取，我们使用以下代码：\n\n```php\n<?php\n  $myFile = \"myfile.txt\";\n  $filehandler\
  \ = fopen($myFile, \"r\");\n  $contents = fread($filehandler);\n  fclose($filehandler);\n\
  ?>\n```\n\n### 删除文件\n\n如果你想删除文件，可以使用 `unlink` 函数：\n\n```php\n<?php\n  $myFile =\
  \ \"myfile.txt\";\n  unlink($myFile);\n?>\n```\n\n## 第 5 天\n\n### 编写整洁的代码（一年后仍然易读）\n\
  \n在你养成不整洁的编程风格之前，我想给你一些关于如何在程序员道路上编写“整洁”代码的建议。\n\n一方面，正如在变量章节中所描述的，使用适当且自描述的变量和函数名是极其重要的。在未知代码中读取\
  \ `$a`、`$b` 或 `$x` 等变量是非常令人失望的，因为它们没有显示其中将存储什么内容。\n\n在编写代码时使用制表符（tab stops）。\n\n\
  \n\n\n\n## 原则：永远不要信任来自外部的数据\n\n如果你遵循这一原则，你已经在对抗破解者和黑客的战斗中赢得了一半。关于对外部数据的不信任，我的意思是，你应该验证输入数据，以检查它们是否符合预期的格式。这意味着，如果要输入一个数字，最好检查该函数是否为数值（`$input`）、它是否确实是一个数字，或者电子邮件地址是否按要求设置（即恰好有一个\
  \ `@` 字符且末尾必须指定一个域名）。这引出了我们的下一个话题。\n\n## 防止 SQL 注入\n\nSQL 注入是一种操纵 SQL 查询的方法，使其执行其预期之外的操作。如果你没有对输入的数据进行过滤，就会发生这种情况。\n\
  \n假设我们有以下脚本来为网页提供登录功能：\n\n```php\n<?php\n\n  $username = $_GET[\"username\"];\n\
  \  $password = $_GET[\"password\"];\n  $sql = \"SELECT \\* FROM users WHERE username\
  \ = \"\"\".$username.\"\" AND password = \"\" . $password .\"\" \";\n  $mysqli=new\
  \ mysqli('localhost','root','', 'test');\n  $result = $mysqli->query($sql);\n  echo\
  \ \"Found the following user(s): \";\n  while ($row = $result->fetch_array()) {\n\
  \    echo $row[\"username\"]. \"<br />\";\n  }\n\n?>\n```\n\n如果用户只是输入用户名或密码，这个功能没有问题。但不幸的是，有一些技术高明的破解者会寻找这种简单的登录方式，有些人使用自动化机器人寻找这些登录口，并尝试输入以下内容：\n\
  \n用户名: admin\n密码: `\" OR 1=1`\n\n如果我们将这段文本未经过滤地传递到 SQL 查询中，将得到以下 SQL 语句：\n\n`SELECT\
  \ \\* FROM users WHERE username = \"admin\" AND password = \"\" OR 1=1`\n\n由于 `1`\
  \ 始终等于 `1`，因此始终会返回结果。所以，破解者以 admin 的身份登录，或者甚至添加了自己的用户：\n\n用户名: x\n密码: x\"; INSERT\
  \ INTO users (username, password) VALUES (\"mynewuser\", \"mypassword\");`\n\nSQL\
  \ 将将变为：\n\n`SELECT \\* FROM users WHERE username = \"x\" AND password = \"x\"; INSERT\
  \ INTO users (username, password) VALUES (\"mynewuser\", \"mypassword\");`\n\n这两个\
  \ SQL 语句都将被执行，破解者已经创建了一个新用户账户。理论上，他还可以发送 `DELETE` 命令，从而破坏我们的数据库，或者例如更改管理员的密码。\n\n\
  但你如何保护自己呢？\n\n要么对指定的数据进行过滤，只允许允许字符（`a-z`、`A-Z`、`0-9`），要么对输入数据进行“转义”。这意味着所有的特殊字符以及整个字符串都被单引号封装起来，从而变得“无害”。这里有一个现成的函数\
  \ `$mysqli->real_escape_string()`，它接收一个字符串作为参数，并返回其安全的转义版本。\n\n示例：\n\n`$password\
  \ =$mysqli->real_escape_string($password);`\n\n## 保持你的密码加密\n\n即使是大型全球性公司，也通过惨痛的经验学到了：必须在数据库中始终以加密方式存储密码。有些加密方法只进行单向加密，并从任意长度的字符串生成所谓的哈希（hashes）。这些是以前已知长度的字符串。PHP\
  \ 从 PHP 5.5 版本起提供了了自己的经过良好测试的哈希库。你可以使用它，例如通过 `password_hash($password, ALGORITHM)`\
  \ 函数。\n\n```php\n<?php\n\n  $password = \"password123\";\n  $hash = password_hash($password,\
  \ PASSWORD_BCRYPT);\n  echo $password;  \n  echo \"<br />\";\n  echo $hash;\n\n\
  ?>\n```\n\n输出（哈希值可能因服务器而异且每次都是生成的）：\n\n`password123`\n`$2y$10$K6JP7Lfu2.wjuEGLzCact.8GZaok5oSWhH49.TzTZm5/PPfDzXYMW`\n\
  \n哈希值无法再明文解密。现在你可以将这些密码哈希存储在数据库中。每当用户想要登录时，使用 `password_hash()` 函数为用户输入的数据生成哈希。如果哈希相同，说明用户了正确的密码。如果黑客想要窃取你的数据库，我们需要大量时间来尝试所有的字典列表，因为\
  \ `password_hash()` 函数需要一些时间来生成哈希。你可以添加一个可选的 `$options` 参数并定义使用更复杂的哈希方法，这样哈希过程会变得更慢且更难破解。\n\
  \n## 为你的密码添加盐（Salt）\n\n另一个安全方面是保护自己免受使用不安全的用户的影响。大型用户数据库的数据显示，很大比例的用户始终使用相同的密码，例如\
  \ `asdf123`、`password`、`1234567890`。如果破解者获取了带有哈希的用户名，对他来说很容易将哈希与互联网上常用的 1000 个密码进行匹配。为了防止这一点，我建议为每个项目添加一个长随机字符串，例如‘afdsoin23oidvnio3iosdvn09832jknlsd’。\n\
  \n如果用户再次登录并使用密码‘password’，我们存储‘passwordafdsoin23oidvnio3iosdvn09832jknlsd’的哈希。\n\
