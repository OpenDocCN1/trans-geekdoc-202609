  \n## 结语\n\n希望你喜欢这个使用 PHP 和 MySQL 进入 Web 开发世界的介绍，并且现在已经准备好实现你自己的第一个小项目了。\n\n如果你需要关于接下来尝试什么的的想法：你可以利用本课程提供的知识，例如为网站创建一个留言板，或者编写一个根据星期和时间显示不同问候语的小脚本。\n\
  \n\n\n\n\n或者，建立一个用于收集签名或投票的页面如何？该页面可以将数据写入数据库，但在此之前应该检查电子邮件地址和/或特定的姓氏与名字组合是否已经存在。\n\
