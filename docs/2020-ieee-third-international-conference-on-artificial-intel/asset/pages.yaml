  md: "# Convolution-based Machine Learning To Attenuate Covid-19's Infections in\
    \ Large Cities\n\nAbstract—In this paper a nonlinear mathematical model based\
    \ on convolution theory and translated in terms of Machine Learning is presented.\
    \ Specifically, peaks are assumed as the rate of infections at large cities. In\
    \ manner, once the free parameters are identified then we can predict the spread\
    \ of the virus in order to construct the algorithm that would yield the best estimates\
    \ as to carry out health services as well as predict dates of infection. The distributions\
    \ are modeled by the Dirac-Delta function spike is used to make the numerical\
    \ convolutions. The approach is illustrated with a case of outbreak depending\
    \ on free parameters simulating the implementation of new rules to detect the\
    \ infections.\n\n# I. INTRODUCTION\n\nRecently, the appearance of Corona Virus\
    \ Disease (Covid-19) in sharp [1] has alerted the global health operations to\
    \ the need of robust schemes of recovery and survival. Furthermore, the rate of\
    \ pandemic in many countries is reaching its end, it is rather to know about what\
    \ we have learned from world-wide datasets [2]. In fact, as all surveillance systems\
    \ in all affected countries, the understanding of data would reveal inherent differences\
    \ among them because the multifaceted nature of difficulties as to the arrival\
    \ of the virus, as well as the level of their recovery as soon as the conditions\
    \ have been applied. These restrictions imply the constraint against the fast\
    \ spread of strain in all cities either middle or large [3]. In this paper, attention\
    \ is paid on theoretical and computational study of Covid-19 pandemic. As seen\
    \ from the figure, the relationship between cases and deaths shows strong fluctuations,\
    \ reinforces the hypothesis that in more cases (countries) the dynamics of spread\
    \ and subsequent infections by Covid-19 is proved to be strongly [4] to randomness,\
    \ that would follow a random pattern as stated does become a fundamental argument\
    \ as consequence of the convolution of various variables [5]. This paper suggests\
    \ the identification of- parameters in a mathematical model of convolution that\
    \ involves the Dirac-Delta function. The fact for using this function\n\nis because\
    \ spike property that makes them a candidate to model the intervention to reduce\
    \ the increasing of infections in a certain period [6]. In commonly in epidemics\
    \ one expects a set of roles coming from the epidemiology as: Role of the Epidemic\n\
    \n+   * Identify the strain and its main properties.\n* Estimate possible impact\
    \ on people\n* Identify the strength of the public health services [7][8]\n* Take\
    \ decisions to opt the correct pharmacology.\n\nUnder the assumption that the\
    \ behavior of outbreak is out detected by mainly rates, a quasi-realistic-mathematical\
    \ model went has the following properties:\n\n+   * Estimate Probabilities of\
    \ the velocity for virus spreading\n* Adjudicate for all possible scenarios before\
    \ decision\n* Determine with high precision the resources to be used in the first\
    \ weeks\n* Estimate the effect and after the implementation of the algorithm.\n\
    \nIn this manner one expects that any algorithm based on Machine Learning [9]\
    \ is able to yield results that follow the Tom Mill' [10] criteria given by [1],\
    \ Task,(2) and Experiments [3]. We establish a support for the dynamics of infection\
    \ in particular, once the parameters have been extracted, all of them are related\
    \ to relatively to definition of epidemiology [11]. Special attention is paid\
    \ on the impact of such parameters on the accumulation of infections for short\
    \ and long periods.\n\nIn concrete, this paper employs the convolution together\
    \ to a nonlinear Dirac-Delta function $\\delta(a,\tau)\\delta(a,\tau)$, whose\
    \ integration can be:\n\n```\n$N(t) = \\sum_{l=1}^{k} \\int_{0}^{t} B(\\beta)\\\
    delta(a,\\tau)d\\tau \\quad (1)$\n```\n\nwith $B(\\beta)$ a detected beta and\
    \ $\\alpha$, the parameters. This paper is structured as follows: In second section,\
    \ the machinery is presented within and in third section the Mitchell's criteria\
    \ are implemented. From then realistic from official data. Finally the conclusion\
    \ of paper is drawn."
