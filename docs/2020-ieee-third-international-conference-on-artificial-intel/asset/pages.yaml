    These phases can be explained in terms of risk''s probabilities.


    # A. Experience as Probability of Risk


    As seen in [20] this is a solid theoretical backbone that defines a probability
    distribution through the Dirac-Delta function. Thus one can also adaptate to the
    operation of convolution of the probability. Of course details are specified by
    the scope of novelty. Unless one cannot consider the unconditional probability
    given by:


    ```

    $N(t) = \int J_n(t,u)D[f(u,\beta_m)]du \quad (17)$

    ```


    With $J_n(t,u)$ the integer-order Bessel function. Of these polynomials are based
    on their oscillatory property that to some extent applies to the evolution of
    a pandemic that exhibits ups and downs.


    In Fig.1 are plotted the probability distributions from the convolution given
