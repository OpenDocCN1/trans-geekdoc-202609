    \ & \\text{simple} \\ \\sum_{i=1}^{n} a_i \\delta($\\tau-\\\\alpha_i$) & \\text{multi-parameter}\
    \ \\end{cases} \\quad (11)\n```\n\nwhere the terminology “multi-parameter” express\
