    # Convolution-based Machine Learning To Attenuate Covid-19''s Infections in Large
    Cities


    Abstract—In this paper a nonlinear mathematical model based on convolution theory
    and translated in terms of Machine Learning is presented. Specifically, peaks
    are assumed as the rate of infections at large cities. In manner, once the free
    parameters are identified then we can predict the spread of the virus in order
    to construct the algorithm that would yield the best estimates as to carry out
    health services as well as predict dates of infection. The distributions are modeled
    by the Dirac-Delta function spike is used to make the numerical convolutions.
    The approach is illustrated with a case of outbreak depending on free parameters
    simulating the implementation of new rules to detect the infections.


    # I. INTRODUCTION


    Recently, the appearance of Corona Virus Disease (Covid-19) in sharp [1] has alerted
    the global health operations to the need of robust schemes of recovery and survival.
    Furthermore, the rate of pandemic in many countries is reaching its end, it is
    rather to know about what we have learned from world-wide datasets [2]. In fact,
    as all surveillance systems in all affected countries, the understanding of data
    would reveal inherent differences among them because the multifaceted nature of
    difficulties as to the arrival of the virus, as well as the level of their recovery
    as soon as the conditions have been applied. These restrictions imply the constraint
    against the fast spread of strain in all cities either middle or large [3]. In
    this paper, attention is paid on theoretical and computational study of Covid-19
    pandemic. As seen from the figure, the relationship between cases and deaths shows
    strong fluctuations, reinforces the hypothesis that in more cases (countries)
    the dynamics of spread and subsequent infections by Covid-19 is proved to be strongly
    [4] to randomness, that would follow a random pattern as stated does become a
    fundamental argument as consequence of the convolution of various variables [5].
    This paper suggests the identification of parameters in a mathematical model of
    convolution that involves the Dirac-Delta function. The fact for using this function
    is because spike property that makes them a candidate to model the intervention
    to reduce the increasing of infections in a certain period [6]. In commonly in
    epidemics one expects a set of roles coming from the epidemiology as: Role of
    the Epidemic:


    - Identify the strain and its main properties.

    - Estimate possible impact on people.

    - Identify the strength of the public health services [7][8]

    - Take decisions to opt the correct pharmacology.


    Under the assumption that the behavior of outbreak is out detected by mainly rates,
    a quasi-realistic-mathematical model went has the following properties:


    - Estimate Probabilities of the velocity for virus spreading.

    - Adjudicate for all possible scenarios before decision.

    - Determine with high precision the resources to be used in the first weeks.

    - Estimate the effect and after the implementation of the algorithm.


    In this manner one expects that any algorithm based on Machine Learning [9] is
    able to yield results that follow the Tom Mill'' [10] criteria given by [1], Task,(2)
    and Experiments [3]. We establish a support for the dynamics of infection in particular,
    once the parameters have been extracted, all of them are related to to definition
    of epidemiology [11]. Special attention is paid on the impact of such parameters
    on the accumulation of infections for short and long periods.


    In concrete, this paper employs the convolution together to a nonlinear Dirac-Delta
    function $\delta(a, \tau)\delta(a, \tau)$, whose integration can be:


    $$N(t) = \sum_{l=1}^{k} \int_{0}^{t} B(\beta)\delta(a,\tau)d\tau \quad (1)$$$$


    with $B(\beta)$ a detected beta and $\alpha$, the parameters. This paper is structured
    as follows: In second section, the machinery is presented within and in third
    section the Mitchell''s criteria are implemented. From then realistic from official
    data. Finally the conclusion of paper is drawn.


    # II. THE MATHEMATICAL APPROACH


    Consider the beginning of an outbreak by a time-dependent distribution from Eq.(1)
    given by B$(\tau, u$), then one can argue that there exists an operation of convolution
    given by: distribution displays peaked morphologies as consequence of the random
    accumulation of strain in the shortest times [13]. In this way one requires the
    implementation of a set of functions that models the effect of rapid interventions
    [14]. Therefore it is possible to use the Wiener-Dirac data in a convolution operation


    $$B(\tau) = \int dB(\tau, u)H(u). \quad (2)$$


    When B$(\tau, u)$ as with H$(u)$ depends on parameters, then Eq.(2) agrees such
    as:


    $$B(\tau, u) = \int dB(\tau, u)H(u). \quad (3)$$


    $$B(\tau, u) = \int dB(\tau, u)H(u). \quad (4)$$


    $$B(\tau, u) = \int dB(\tau, u)H(u). \quad (5)$$


    $$B(\tau, u) = \int dB(\tau, u)H(u). \quad (6)$$


    $$B(\tau, u) = \int dB(\tau, u)H(u). \quad (7)$$


    $$B(\tau, u) = \int dB(\tau, u)H(u). \quad (8)$$


    $$B(\tau, u) = \int dB(\tau, u)H(u). \quad (9)$$


    $$B(\tau, u) = \int dB(\tau, u)H(u). \quad (10)$$


    Clearly the question is: what mechanism to solve the Dirac-Delta equation written
    in Eq.(8) when an universal function or polynomial is involved? As in [15] there
    is possible to evaluate infection of this type. Neither inpraess in can agree
    in the adhoc manner a polynomial that relates to real data and to make an approximation
    that agrees the morphology of infections A. The Spike of Dirac-Delta function
    exhibits notable applications in various disciplines and fields to that property
    is connected to Eq.(8) $f(t) = f(\tau)\delta(t-\tau)$. As explained in Eq.(10)
    the logic extension demand another interpretation of that Eq.(8) can be written
    as: $f(\tau) = \delta(\tau-\alpha) = \sum_{i=1}^{n} a_i \delta(\tau-\alpha)$ where
    one can formate the general definition of $f(\tau) = f(\tau)\delta(\tau-\alpha)
    = \sum_{i=1}^{n} a_i \delta(\tau-\alpha)$ for which in the case of the $\delta(t-\tau)$
    - the resolving convolution gives out the form $f(t)t^{-1/2}$ which makes up to
    the results, demonstrating the strain of the infection depends on $1/t$. It is
    also possible to express $f(\tau)$ to suggest to rewrite in (1) in a general case


    $$f(\tau) = \begin{cases} \delta(\tau-\alpha) & \text{simple} \\ \sum_{i=1}^{n}
    a_i \delta(\tau-\alpha) & \text{multi-parameter} \end{cases} \quad (11)$$

