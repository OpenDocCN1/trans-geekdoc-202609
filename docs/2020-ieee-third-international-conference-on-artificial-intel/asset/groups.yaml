    # III. THE MACHINE LEARNING MODELING


    # A. The Tom Mitchell''s Criteria


    The science of Machine Learning gives offers multiple paths to solve complex problems.
    In this paper, the interest of using this technology is essentially the requirement
    of implement intelligent systems that can enhance the human decisions with a minimal
    and minimal risk. Clearly this is in accordance with view of Epidemiological that
    epidemics may help us recover a solid resilience as fast as recovering due to
    the consequences that appear and after the strain has entered to. In this book,
    Tom Mitchell defines that any system can be perceived as one that satisfies the
    following characteristics:


    +   * All system has a task that reflects that the system justifies its existence.
    This translated in terms of epidemic process one that has initialized and the
    strain is identified, the system or public health operator has master to minimize
    the spread of viruses in people as well as recover


    +   * All system has a performance to tackle the task Once the task is defined
    then the system requires to design a strategy to successfully surpass the phases
    that the task will. This performance will employ computational methodologies in
    both the quantitative results and the interpretation of them. In the territory
    of Epidemiology one can see that the performance targets are to assess the capabilities
    of the health centers in order to provide medical assistance to the confirmed
    infections. In reality, local official might also suggest social regulation such
    as quarantine, curfew and promote rules of distancing among people.


    +   * All system acquires Once the performance has been applied and the system
    is able to evaluate whether this application was success or failure then there
    is chance to recognize the mechanisms that have lead to solve the task. Here are
    the manifestations of success or fail. In this, epidemics, it is that the proposed
    rules should exhibit notable differences with respect to before and after. For
    example, given a number of N along a period, then after the social rules would
    expect that a fraction M with M < N for a subsequent period.


    In manner one can associate a mathematical model that encompasses these criteria
    whose either is of reducing the number of infections in the shortest periods without
    affecting the ordinary mechanisms that sustain the societies. Therefore one can
    construct a formalism targeting the minimization of infections through concrete
    strategies that involve each with a minimal objective.


    # B. The Machine Learning Formalism


    Eq(10) appears as a candidate for modeling the Mitchell''s criteria. In this manner
    one can tentatively to provide a mean to enhance each of Eq(10). To accomplish
    this one can formulate the Mitchell''s criteria as a convolution such:


    ```

    $E(t) = \int T(s)P(s,t)ds \quad (12)$

    ```


    by which the function P(s,t) recognized as performance on the free parameters
    a and b respectively. Furthermore, more more than a limited problem, one might
    expect to match a multi-parameter problem in the system as:


    ```

    $E(t,a,b) = \int T(s,a)P(s,t,b)ds \quad (13)$

    ```


    ```

    $EMN(t,a,b) = \sum_{m=1}^{N} T(s,a_m)P(s,t,b_m)ds \quad (14)$

    ```


    Clearly one can also consider those scenarios that are strongly restricted to
    the value of M and N, who are not have a duplicate sum. From it the definition
    of Machine Learning method calculated from the design of number of free parameters
    it can be written as:


    ```

    $E = E_{(M+1)(N+1)}(a_{1,1},b_{1,1}), \dots, E_{(M+1)(N+1)}(a_{M,N},b_{M,N}) \quad
    (15)$

    ```


    In Fig. 1 the product of task and performance function of time for a short period.
    For this exercise the random distributions through Gaussian processes were employed.
    It is plotted as bivariate. As stated that the usage of the product of task and
    performance is in essence proportional to the number of infection under the theory
