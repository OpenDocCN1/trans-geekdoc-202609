    ## IV. 应用与仿真


    考虑等.(14)。它可以被投影到完全由流行病学规则主导的领域，例如任何到达者的行为和流行率。通过这种方式，我们与等.(14) 关联起来，例如代表 Covid-19。通过知道狄拉克-δ
    函数（Dirac-Delta function）的“尖峰”属性，当这些函数在其参数中包含它时，确定这些函数的零是可行的，零的多项式会将凹谷提升为狄拉克-δ
