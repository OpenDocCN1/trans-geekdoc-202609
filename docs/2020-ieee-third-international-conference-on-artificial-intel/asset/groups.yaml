    # 基于卷积的机器学习以缓解大城市新冠肺炎感染


    摘要——本文提出了一种基于卷积理论并用机器学习术语表达的非线性数学模型。具体而言，峰值被假设为大型城市的感染率。以此，一旦确定了自由参数，我们就可以预测病毒的传播，从而构建算法，为开展医疗服务提供最佳估计并预测感染日期。分布通过狄拉克δδ函数（Dirac-Delta
    function）脉冲进行建模，并用于数值卷积。通过一个取决于自由参数的爆发案例说明该方法，模拟了检测感染新规则的实施。


    # I. 引言


    近期，新冠病毒（Covid-19）的迅速出现 [1] 警醒了全球卫生部门需要稳健的恢复和生存方案。此外，许多国家的流行病发生率已接近尾声，了解我们从全球数据集
    [2] 中学到了什么尤为重要。事实上，正如所有受影响国家的监测系统一样，对数据的理解将揭示它们内在的差异，因为病毒到达的困难具有多性，以及在应用条件后恢复水平的差异。这些限制约束了病毒株在所有中大城市中的快速传播
    [3]。本文关注新冠肺炎大流行的理论和计算研究。如图所示，病例与死亡人数之间的关系显示出强烈的波动，加强了以下假设：在更多病例（国家）中，新冠肺炎的传播动态和随后的感染被证明对随机性具有强
    [4]，这种随机性遵循随机模式，并作为各种变量卷积后的基本论点 [5]。本文建议在涉及狄拉克δδ函数的卷积数学模型中识别参数。使用该函数的原因是其脉冲特性，使其成为模拟特定时期减少感染增加干预的候选模型
    [6]。在流行病中，人们通常预期来自流行病学的一系列角色，如：疫情的角色：


    - 识别病毒株及其主要属性。

    - 估计对人类可能产生的影响。

    - 识别公共卫生服务的强度 [7][8]

    - 做出决策以选择正确的药物治疗。


    在爆发行为主要由比率检测到的假设下，一个准真实的数学模型具有以下属性：


    - 估计病毒传播速度的概率。

    - 在决策前判定所有可能的情景。

    - 高精度地确定前周内将使用的资源。

    - 估计算法实施前后的效果。


    通过这种方式，预计任何基于机器学习 [9] 的算法都能产生符合 Tom Mill'' [10] 标准的结果，该标准给出 [1]、任务 (2) 和实验 [3]。我们建立了感染动态的特殊支持，特别是一旦提取了参数，它们都与流行病学的定义有关
    [11]。特别关注了此类参数对短短期感染累积的影响。


    具体而言，本文将卷积与非线性狄拉克δδ函数 $\delta(a, \tau)\delta(a, \tau)$ 结合，其积分可以：


    $$N(t) = \sum_{l=1}^{k} \int_{0}^{t} B(\beta)\delta(a,\tau)d\tau \quad (1)$$


    其中 $B(\beta)$ 为检测到的 beta 和 $\alpha$，这些是参数。本文结构如下：在第二节中介绍了机制，在第三节中实施了 Mitchell
    标准。然后根据官方数据进行真实推演。最后得出了本文的结论。


    # II. 数学方法


    考虑由等式 (1) 给出的来自 B$(\tau, u)$ 时间相关分布的爆发开始，那么可以认为存在由以下给出的卷积操作：由于病毒株在最短时间内随机累积，分布显示出峰值形态
    [13]。因此，需要实施一组模拟快速干预效果的函数 [14]。因此，可以在卷积操作中使用维纳-狄拉克数据：


    $$B(\tau) = \int dB(\tau, u)H(u). \quad (2)$$


    当 B$(\tau, u)$ 与 H$(u)$ 依赖于参数时，等式 (2) 符合如下：


    $$B(\tau, u) = \int dB(\tau, u)H(u). \quad (3)$$


    $$B(\tau, u) = \int dB(\tau, u)H(u). \quad (4)$$


    $$B(\tau, u) = \int dB(\tau, u)H(u). \quad (5)$$


    $$B(\tau, u) = \int dB(\tau, u)H(u). \quad (6)$$


    $$B(\tau, u) = \int dB(\tau, u)H(u). \quad (7)$$


    $$B(\tau, u) = \int dB(\tau, u)H(u). \quad (8)$$


    $$B(\tau, u) = \int dB(\tau, u)H(u). \quad (9)$$


    $$B(\tau, u) = \int dB(\tau, u)H(u). \quad (10)$$


    显然的问题是：当涉及通用函数或多项式时，如何求解等式 (8) 中的狄拉克δδ方程？在 [15] 中可以评估这种类型的感染。无法以特设方式与真实数据相关的多项式，并做出符合感染形态
    A 的近似。狄拉克δδ函数的脉冲在各个学科和领域表现出显著的应用，该属性与等式 (8) $f(t) = f(\tau)\delta(t-\tau)$ 连接。如等式
    (10) 所示，逻辑扩展要求对等式 (8) 进行另一种解释，可以写为：$f(\tau) = \delta(\tau-\alpha) = \sum_{i=1}^{n}
    a_i \delta(\tau-\alpha)$，其中可以格式化通用定义 $f(\tau) = f(\tau)\delta(\tau-\alpha) = \sum_{i=1}^{n}
    a_i \delta(\tau-\alpha)$，对于 $\delta(t-\tau)$ 的情况——求解卷积给出形式 $f(t)t^{-1/2}$，这使得结果证明了感染的强度依赖于
    $1/t$。也可以表示 $f(\tau)$ 以建议在一般情况下重写为 (1)：


    $$f(\tau) = \begin{cases} \delta(\tau-\alpha) & \text{简单} \\ \sum_{i=1}^{n} a_i
    \delta(\tau-\alpha) & \text{多参数} \end{cases} \quad (11)$$


    '
