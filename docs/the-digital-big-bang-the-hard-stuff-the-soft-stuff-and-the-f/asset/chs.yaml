- "# 数字大爆炸：硬核挑战、软性因素与网络安全的未来\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n321. 306\n322. 307\n\n\
  \n\n\n\n\n\n\n\n\n*献给我的家人，Yvonne, Bennett, Kristen 和 Jackson Quade，他们是我生活的“基本元素”。*\n\
  —Phil Quade，Fortinet 首席安全官 (CISO)\n\n## 关于作者\n\nPhil Quade 是 Fortinet 的首席安全官（CISO）。Quade\
  \ 拥有三十多年的网络情报、防御和攻击经验，曾在美国国家安全局（NSA）以及美国网络司令部、中央情报局（CIA）等合作伙伴组织从事外国、政府和商业行业工作。\n\
  \nQuade 负责 Fortinet 的信息和产品安全，领导 Fortinet 联邦和关键基础设施业务的战略与扩张，并担任 Fortinet 高级企业客户的战略顾问。在加入\
  \ Fortinet 之前，Quade 曾担任 NSA 局长网络事务助理及 NSA 网络任务部队负责人，负责与白宫的网络安全事务关系。此前，Quade 还曾担任\
  \ NSA 信息保证局首席运营官，管理与机密信息系统保护相关的日常活动。在 NSA 任职期间早期，他曾担任多种职位，包括信息作战技术中心高级技术组负责人、美国参议院专业人员、国家情报局长办公室外派人员、密码分析师和计算机科学家。\n\
