  \ 在斯坦福大学获得电气工程硕士学位，在清华大学获得电子工程学士和硕士学位。他是美国工程科学院院士。Xie 作为网络威胁联盟（Cyber Threat Alliance）董事会成员以及世界论坛网络安全中心（Center\
