  * Renee Tarun\n* Ken Xie\n* Michael Xie\n\n# 致谢\n\n尽管我是本书的作者，但这本书是更广泛团队努力的结果。如果没有领域领导者专家的贡献，这本书是不可能的。所有的贡献者都是大思想家和优秀的网络公民。\n\
  \n首先，我要感谢 Ken Xie 和整个 Fortinet 团队，他们支持我创作这本书，并给了我探索和编写这些话题的机会。\n\n特别感谢我的同事 Sandra\
  \ Wheatley-Smerdon，她是发起这项网络安全“大历史”探索的关键人物。\n\n# 引言\n\n![](img/flastuf001.png)\n\n\
  当人类未能承认物理和化学的基本原理时，会经历巨大的失望和灾难。在解决问题和改进技术时，我们必须顺应而非违背质量、力、能量和化学反应定律——这些定律始于宇宙大爆炸。\n\
  \n就像物理世界一样，网络安全也有自己的基本原理：速度和连接。当组织被复杂的营销或新产品吸引注意力而忽视了这些基本原理时，我们就会承担后果。我们最终得到的只是解决部分问题、或者在现实世界条件的测试下直接失效（或让我们无法工作）的解决方案。\n\
  \n这部分是因为，直到为止，网络安全一直被视为*业务的成本*，而不是*实现更大目标的基础性原语和规则*。为了建立一个在现在有效并在未来更快速、更连接的世界中持续有效的网络安全基础，我们必须开始像对待科学一样对待网络安全。我们必须理解它的基本元素以及它们是如何相互作用的。\n\
  \n\n\n\n\n早期互联网构建于几十年前，旨在服务一个小规模、紧密且以学术为主的社区。它的建立基于在改变游戏规则的速度原则以及对连接性重要性的深刻理解之上。对于最初那小群受信任的用户来说，不需要安全和隐私，因此它们并未包含在原始设计需求中。尽管安全和隐私在当今极速惊人的全球网络中已经证明了其重要性，但随着互联网的成熟，它们并未能跟上步伐。\n\
  \n虽然我们现在的连接程度比历史上任何任何时候都呈指数级增长，指尖即可即时获取信息，但网络攻击者——而非防御者——才是那些掌握速度和连接性并使其处于优势的人。速度和连接性作为通信基石为我们服务良好，但在网络安全方面往往辜负了我们，因为我们未能在这两个基础元素之上建立网络安全的基础。\n\
  \n在在竞争异常激烈的商业格局中，网络安全基础不仅能保护你，让你成为对坏分子来说不那么吸引力的目标，还能为你所连接的所有个人和组织投射上一层保护光环。\n\n\
  当我们基于对基础元素及其如何协同工作的全面理解来构建网络安全时，我们就能激励并鼓励网络安全领域的科学革命和演变，这将使我们变得好得多。\n\n我们处于对人类社会基本元素产生新理解的边缘。正如世界已经意识到经济安全高度依赖化石燃料的稳定流动，国家安全依赖于对核武器的保护一样，今天我们理解，在我们超互联的世界里，如果没有理解并掌握网络安全科学，就没有全球性的安全。\n\
  \n但网络安全真正的历史类比——“数字大爆炸”的故事开始得要早得多。让我们回溯近 140 亿年前的大爆炸，即我们今天所知的宇宙的开端。\n\n## 宇宙大爆炸：物理宇宙的诞生与随之出现的人类社会\n\
  \n在我们所知的时间起点，大约 140 亿年前，能量和物质在一个无法想象的辉煌时刻诞生了。那些核心构建区块组合成原子，几百万年后又出现了更复杂的组合（分子）。\n\
  \n数十亿年后，在无数恒星诞生又消灭之后，我们的太阳系由那些早已死去的恒星炉的残骸形成。物理学家和化学家研究大爆炸的基础元素及其相互作用，部分是为了解释事物是如何构成的，以及它们是如何运行的。\n\
  \n其中一些复杂的配置融合成我们所说的`生命`。我们研究生命以及它如何从最原始的状态演变，以发现我们从何而来，并帮助我们在给定的宇宙中繁荣发展，而不是与大母亲作斗。\n\
  \n从这些众多生物中最终出现的人类，最终形成了复杂的规则和社会，这些社会在广泛的一系列阶段或时代中演变。尤瓦尔·诺亚·哈拉里在《人类简史》中将其列举如下：\n\n\
  *   认知革命（约公元前 70,000 年，`Homo sapiens` 进化出想象力时）\n*   农业革命（约公元前 10,000 年，农业的发展）\n\
  *   人类的统一（人类政治组织向一个全球性帝国的逐渐整合）\n*   科学革命（约公元后 1500 年，客观科学的出现）\n\n在这些每一个时代中，人类在理解环境方面取得了相对巨大的跨越，有时甚至直接塑造了环境。\n\
  \n\n如果我们把大爆炸作为类比，就可以通过物理世界来理解它是如何运作的。在数字世界中，互联网就是开端。\n\n1969 年 10 月 29 日，第一条信息通过最终成为互联网的网络发送出去。原本打算发送的单词\
  \ `login`，但 UCLA 的研究人员将字母 `L` 和 `O` 发给了斯坦福大学的一个团队。今天它每天产生 `2.5 quintillion` 个比特。\n\
  \n\n在宇宙大爆炸之后，过了数十亿年，人类才出现并开始理解它。在人类历史上，最有意义的时代是科学革命，这与其说是因为它成就了什么，不如说是因为留下了什么。正是在科学革命时期，我们终于承认自己并非无所不知。对无知的承认推进了知识的追求。它允许我们定义现代物理学和化学定律；以数据驱动的方式解释自然元素如何相互作用；并发现忽视这些法则的危险。它激励我们去填补那些以前认为没有义务去填充的数据空白。\n\
  \n例如，750 年前的世界地图上绘有精细的中洋漩涡、海怪物——“此处有巨龙”——以及大陆内部的山脉。绘图者的错误思维以及想要警告海洋探索危险的愿望，导致制图者填充了他们不知道的内容。相比之下，科学时代的地图绘有大片空白区域，显示出我们在哪里没有数据。直到我们承认自己对地平线之外的事物实际上一无所知，我们才开始探索那些区域并填充缺失的碎片，从而导致了对我们世界更深入的理解。\n\
  \n对基本原理的好奇驱动减少了对未知的恐惧，并促进了物理世界科学教育的黄金时代。\n\n现在我们必须在网络安全领域实现同样的跨越。我们需要停止对网络威胁（无论是真实的还是想象的）感到颤抖，并投入定义如何导航和掌握这些威胁的正业。\n\
  \n\n\n\n随着分组交换的出现——将信息划分为较小的数据块进行传输然后重新组合，这种技术最初作为一种冷战战略被开创——这种通信变成了一种可行但极度受限的现实。\n\
  \n\n互联网的先驱们在速度和连接性方面是完全正确的——这等于数字大爆炸中的物质和能量。他们的目标是建立一个安全的、分布的、广泛的计算机通信系统，并且他们实现了这一目标。\n\
  \n## 我们错误的地方\n\n由于信息的数字传输在用户和数据量上都受到严格限制，`ARPAnet` 的使用受一种共同信任感的约束，而这种信任是由安全审查、专业问责制以及完全缺乏匿名性来告知并执行的。\n\
  \n\n在这种对信任的假设下，事情变得偏离轨道。这种假设阻碍了安全性（特别是可靠的身份验证）的并行发展，而这些技术本可以支持让互联网产生变革性影响的速度和连接性。\n\
  \n随着 1992 年《科学与先进技术法案》的通过，研究和学术机构开始使用这种早期的互联网。安全缺陷是众所周知的，但拥有访问权限的机构范围仍然很小且紧密。直到\
  \ 1993 年以及第一个网页浏览器的发布，互联网接入才成为主流。在那个时刻，互联网及其安全性（或缺乏安全性）具有了更重大的意义。\n\n这种深植于互联网基因中的信任假设，在公众可以上线的那一刻，变成了一个巨大的问题。在一个日益庞大且匿名的网络上，这种信任很快从指导哲学转变为最大的弱点。随着越来越多人的涌入，互联网迅速变成了一个新发现的陆大陆，充满了天真的用户、系统和网络，供人数字欺诈、敲诈或仅仅为了证明其可行而进行利用和黑客。\n\
  \n自那些首次黑客攻击以来，网络安全领域一直努力追赶和弥补。在缓解这种弱点（即错误的信任假设和缺乏强力身份验证）的同时，平衡速度和连接性的核心收益和基础，仍然是今天网络安全面临的持久挑战。\n\
  \n## 对现状的诚实评估\n\n尽管互联网拥有惊人的速度和海量的数据，但它是令人震惊的脆弱且易出错的。我们正在支撑它，有时使用极其荒谬复杂的方案，有时仅仅依靠数字冰棍棒和白胶，对于高端应用，则使用强力胶带。\n\
  \n互联网是快速、匿名、强大且有利的——所有因素都加速了它的使用和部署——同时它极易受到恶意利用，具有可怕的犯罪和破坏潜力。各级复杂程度组织持续发生的泄露事件说明了我们面临着多么巨大的问题。\n\
  \n\n网络犯罪最令人惊讶（或至少是讽刺）的地方可能是，这一技术协作和人类连接的杰作竟然如此频繁地被用来满足人类冲动。分布式拒绝服务（`DDoS`）攻击、钓鱼邮件和不断演变的诈骗操纵接收者，以实现大规模盗窃和勒索。从数据损坏到身份盗窃，从恶意软件到中间人攻击，网络安全必须缓解和防止的犯罪范围之广，而且似乎还在不断扩大。攻击不仅由犯罪发起，还由流氓国家发起。随着时间的推移，这些攻击变得更具破坏性，实施难度也降低。\n\
  \n网络犯罪范围的扩大是我们不断扩张的全球攻击面的直接反映——以及威胁日益商品化。个人和组织必须防御的数字犯罪准入门槛比以往任何时候都低。今天，购买网络攻击可能像买杯咖啡一样简单，往往更便宜。我们必须保护自己免受对我们社会结构近乎持续的无声数字攻击，这一切都在日益互联的世界表面下暗涌着。\n\
  \n今天，网络安全与国家安全、甚至全球安全之间几乎没有区别。正如我们在报道的恶意网络活动中屡次看到的——通常是在关于险些避开攻击的惊悚报告中——几乎任何人从任何地方都能在最基础的层触及我们。\n\
  \n\n事关重大，是时候向科学革命借鉴一招了：\n\n| 科学革命 | 网络安全科学革命 |\n| :--- | :--- |\n| 承认我们的无知（重新绘制地球地图）。\
  \ | 承认我们错误的地方（身份验证）。 |\n| 使用不断增加的策略来成为物理领域的主人（航海、飞行、探索太空）。 | 实施稳步加强的策略，以成为网络领域的主人。\
  \ |\n| 用好奇心取代恐惧。 | 用严谨的基础策略取代过时的假设和策略，并在此基础上构建出高级策略。 |\n\n我们需要停止期望网络运营商能够持续领先于日益复杂的攻击。你追不上光速。\n\
  \n我们可以通过像物理学家和化学家一样思考，通过假设和勾勒掌握网络空间领域所需的定理和证明来实现更好的网络安全。然而，尽管这些基础知识至关重要，但它们很容易被短视近未来、将短期利益置于长期稳定可持续性之上的数字文化忽视或忘记。网络安全是一场马拉松——而不是冲刺。\n\
  \n随着我们连接性的扩展和加深，这些基础的强度和不可攻克性变得更加明显。而且变得更加必要。\n\n随着数字连接、网络物理接口（在物联网中）以及机器学习和人工智能的指数级增长，将网络安全视为一种科学和业务赋能手段，而不是仅仅是业务成本，比以往任何时候都重要。\n\
  \n我们必须揭示基础科学原理与网络安全最佳实践之间的联系。在互联网初期，拥有哪些基础原语和规则是有益的？如果它们当时已经到位，情况会有何不同？我们如何根据基本力量的性质和准确假设来创建更好的网络安全形式？\n\
  \n将网络安全视为一种科学可以成为支撑创新的极其强大且有效的方式。它使我们能够专注于有效利用互联网的速度和连接的力量，以及我们在本书后面将讨论的另一种不可改变的力量：人类的易错性和需求。\n\
  \n尝试让网络安全更加科学化是一个大胆的目标，但在我们看来，通过正确的愿景和工程，是可以实现的。通过这样做，我们可以进一步延伸速度和连接的力量，使其在数字世界中繁荣发展。与其遭受数十亿后类似于宇宙大爆炸的由于太阳死亡导致行星融化的灾难，让我们理解、定义并在网络安全科学的法则内工作。\n\
  \n正如前面提到的，网络安全最基本的力量是速度和连接性。我们的解决方案必须为支持和利用这些力量而构建。\n\n\n\n\n尽管在历史上安全往往会拖慢进度，但没有速度的安全是一个注定失败的买卖。同样，安全的强弱取决于链条中最薄弱的一环，因此安全必须实现连通——具体而言，就是通过整合你的防御体系来发挥你的优势。这比常见的替代方案要好得多的核心策略：期望自己的弱点比对手最强的方法还要好。要不仅实现最优的甚至是基本功能的网络安全，我们必须具备速度、连通性和集成化的网络安全。\n\
  \n在接下来的章节中，我们将探索必须塑造我们方法的速度和连通性的科学力量（请参见 图 1）。我们必须展示如何通过网络安全来利用并放大这些力量，提供更高精度的防御，以应对日益复杂的威胁攻击者和网络犯罪分子。\n\
  \n![图 1 速度和连接性构成了数字大爆炸的核心。](img/flastf001.png)\n\n`图 1` 速度和连接性构成了数字大爆炸的核心。\n\n我们将探索如何基于准确的假设，创建一种更科学的网络安全方法。我们将探测我们面临的现代问题的本质，并观察科学世界的经验如何延伸到网络空间，引导我们对网络安全演变的本质和秩序得出某些必然的、拓展思维的结论。\n\
  \n本书分为几个部分。第一部分 探讨了速度和连通性的数字核心。\n\n第二部分 详细介绍了身份验证、补丁和培训领域的基础缺陷，第三部分 讨论了访问控制、加密和分段的基本策略。\n\
  \n第四部分 涵盖了高级策略，包括可见性、检查和故障恢复，第五部分 列出了我们必须考虑的高级维度，包括复杂性管理、隐私保护和人类的弱点。\n\n本着互联网发明的精神，本书是一项协作成果。对于所提到的每个主题，我们将听取来自当今跨行业跨学科的顶尖网络安全专家的见解，他们汇聚在一起提供自己的洞察。\n\
  \n我们将成功定义为：使安全领域的创新速度能够跑赢对手实施其阴谋的不可避免的尝试。\n\n我们希望，通过关注网络安全科学的基本和基础原则，本书将赋予那些战斗者力量，让他们在未来的多年里获得更有效、更高效且一致的胜利。\n\
  \n\n![](img/p01uf001.png)\n\n宇宙大爆炸与数字大爆炸之间的核心相似之处在于它们的起源。宇宙大爆炸释放了物质和能量这两个核心力量，并不可避免地将它们连接在一起，这种方式塑造并驱动了我们的整个生存。互联网的发明利用技术创新将速度和连通性（数字大爆炸中等同于物质和能量的核心力量）焊接成一种通信手段，这种手段是强大到具有改变人类未来的潜力。\n\
  \n由于速度和连通性是互联网的两个主要元素，利用它们的优势并管理它们的风险必须是任何有效安全策略的主要元素。\n\n但往往，网络安全与速度和连通性是对立的。\n\
  \n互联网创造了一种改变游戏规则的，提高了信息速度和业务处理速度——更快发送数据，加速我们与他人连接和通信的速度。还记得通过邮寄磁盘来发送数据的日子吗？从早期的学术用途开始，那种连接已经不断增长。现在，这种连接包含了大规模业务和个人利益，包含了我们最敏感的健康和财务信息，并属于私营和公共部门。或者我们可能将该连接用于纯粹的娱乐。\n\
  \n我们现在发送和接收甚至是海量数据的速度是惊人的，而且每天都在加快。我们可以搜索冷门知识，并在几秒钟内得到答案；与世界各地的人实时通信；并只需点击一下即可购买产品。无论其用途和应用如何，今天的数字数据传输系统设计时就比当时的任何其他手段都要快，而且它们一直超过了这一目标。\n\
  \n但在此之前，这种速度对于防御者来说是一个问题。防御系统通常会消耗 CPU 周期，强制通信减慢。当这种情况发生时，用户通常会简单地关闭安全功能，使网络及其数据容易受到攻击者的侵害。要取得成功，我们的安全策略必须基于利用“以互联网速度办事”这一核心哲学。\n\
  \n\n互联网的创造是协作力量的证明。研究人员意识到，通过比较和结合他们的努力并获取远程计算资源，他们可以获得更具洞察力的结果。\n\n由此产生的架构围绕着丰富且韧性的连通性进行设计。随着它的成熟，互联网满足了对速度和连通性的深度需求——组织、财务、物理、心理，甚至是情感的——这催化了它前所未有的扩散。\n\
  \n但这种高度渴望的连通性也打开了攻击的大门。攻击者很快发现他们可以利用连通性来为自己服务，在不需要靠近实际目标的情况下实现恶意影响。对手现在可以从多个地方发起攻击，将他们的多方面火力集中在弱点上。也许这正是网络安全的核心困境：如果你能与每个人连接，那么任何人都可以接触你。\n\
  \n防御者应该采取同样的架构方法：设计利用连通性的安全性。\n\n\n正如宇宙大爆炸的能量和物质基本力量必须仔细管理以实现预期结果一样，数字宇宙中的速度和连通性也是如此。例如，分裂的原子可以做这些事情之一：\n\
  \n*   爆炸并加热整个城市——通过核电站产生的清洁电力在夏天提供冷气，冬天提供暖\n*   加热并爆炸整个城市——通过核武器产生火焰和冲击波\n\n网络安全实施必须足够高效，以便始终能够最高可能的安全速度以及最大的连通范围和规模。\n\
  \n尝试构建不维持速度和连通性的网络安全解决方案将失败，就像一个试图忽视物理和化学定律的工程师一样。正如互联网的通信基础设施基于快速通信机制的连接织物，支撑通信的安全织物也必须基于集成安全策略。由于速度和连通性是互联网的两个主要元素，利用它们的优势并管理它们的风险必须是任何有效安全策略的主要元素。\n\
  \n\n![](img/c01uf001.png)\n\n速度必须被视为并对待如它本身的基本元素。但根据其本质，安全会拖慢速度。当你从事安全行业时，你从根本上是在从事一种减慢人的行业，而这是一个糟糕的行业。安全必须利用速度的力量来保护信息，同时以相同的速率防御网络攻击。\n\
  \n简单来说，所有的网络安全必须极快。\n\n\n\n没有速度的安全是一项注定失败的交易。事实上，缓慢的安全往往意味着没有安全。良好的安全策略必须基于对速度的，具体包括：\n\
  \n*   实时检测和缓解攻击的原始速度\n*   具备更多传感器、更多数据和更多洞察的处理能力，以更高效地解析数据并发现系统功能中最细微的异常\n*   前向兼容性，为实施未来的解决方案留出余地，这些解决方案可能涉及更大的速度\n\
  \n良好的安全策略在实现这些目标的同时，必须对用户已经预期并要求的速度产生尽可能小的影响。这是因为除了对速度的运营考量外，还有一个现实层面的原因：用户是不愿意等待的。\n\
  \n这种用户的不耐烦，加上不以速度为基本组成部分的网络安全技术，导致了一个持续性的后果：缓慢的安全解决方案会被关闭，要么是因为它们太笨重，要么是因为它们根本跟不上。一个缺乏速度并被关闭的安全解决方案无法提供任何益处。因此，缓慢的网络安全技术变成了比收益更大的阻碍。\n\
  \n如果组织被迫采用无法满足快速数据传输需求和标准的工具，很可能这些组织不仅会变得不安全，而且会将这种不安全性带到它们共享的每一个连接点，危及其他组织。\n\n\
  承认安全与速度之间固有的冲突，要求我们战略性地设计如何、何地以及何时减速，同时尽可能地维持和保持速度与效率。\n\n当涉及到网络安全时，没有速度就一切虚有。然而，用户会拥抱一种以速度为核心组成部分的解决方案。\n\
  \n\n*Roland Cloutier, ADP*\n\n在为网络安全等复杂问题提供具体的参考模型时，上下文是王道。即使作为安全从业人员，我们也面临着海量信息、情报、数据点以及需要采取行动或决策的异常信息的冲击，但我们往往缺乏背景信息来理解环境设置，而这些设置有助于我们做出明智决策。\n\
  \n\n当我们开始讨论速度作为处理网络安全的约束性策略和指导原则时，我们必须花时间去真正理解“速度”作为多维度组成部分的含义及其影响和背景——它涉及威胁、我们保护的对象、我们如何保护，以及它对我们成功能力的影响。\n\
  \n事实上，速度正处于网络前沿的核心。作为一个术语，它可以被视为名词（衡量物体运动的速率），也可以被视为动词（描述运动的动作）。无论哪种，当与技术防御相结合时，是速度决定了我们的计划、行动以及通常是结果。是速度支持了与剩余风险措施相应的优先级衡量。也是速度影响了成本、服务和紧迫性等基础程序的考量。\n\
  \n\n\n生活在以光速运行的商业、社会和全球经济的数字连接生态系统中，意味着决定我们如何保护以及保护什么的因素和问题就像一个活的生物体。它总是在以许多不同的方式进行思考、消费和增长。首先，你工作的环境并不是一个封装在保护架构中的、受控且管理的系统和软件架构。\n\
  \n### 战略必要性\n\n你可能认为，为了适应速度的变化，你只需要移动更快、行动更快。虽然在某些情况下确实如此，但在面对动态变化时，比起用更速度来对抗速度，有更好的方法来实现运营加速和追求卓越。我们如何思考、行动以及对我们的保护组合和运营进行配置，都是在速度时代向运营赋能动态转变的关键方面。\n\
  \n\n\n\n在你决定如何最好应用新发现的战略工具之前，你必须了解“何时以及如何”使用这些工具的背后的“为什么”。每家企业、行业和组织都是不同的。你需要保护组织的原因以及你保护它的方式至关重要。你所所为的动机会影响你的组织风险偏好，定义你的风险风险价值，并为关键决策点提供参考，例如所需的准确性与速度及财务投入之间的权衡。通过标准化的风险流程，或者即使是简单的与业务领导者坐下来讨论网络安全失败的下游残余影响，将有助于告知并塑造你的任务参数。你是关键基础设施的一部分吗？知识产权损失会摧毁你的业务吗？你控制之外的业务生态系统会造成不可修复的损害吗？这些问题以及许多其他问题应该是你描述你的“安全业务”以及你的任务重点的基石元素。反之，当你开始考虑不利于你的速度以及帮助你加速效能的速度时，深入理解与以下五个关键规划领域保持一致的任务紧迫性，将确保你在所运营的超互联和高速世界中取得成功：\n\
  \n1. **了解你的环境。** 你的成功取决于你在所运营环境中取得成功的直接能力。为了做到这一点，你需要通过透明度、知识和访问权限来了解你的环境。这包括关键元素，例如了解你的关键资产、通过全面的配置管理数据库（`CMDB`）对部署的资源和技术进行整体理解，以及详细说明信息如何在业务中流动的数据流图。同样重要的是对你的第三方生态系统、供应链，以及你的服务实际上如何成为客户供应链的集成部分的理解。通过这种透明度来快速理解任何给定事件影响的能力，是能够快速思考和行动的基本组成部分。\n\
  \n2. **高速行驶下安全驱动。** 你的业务成功取决于市场反应速度和响应速度。你的工作是确保每个人安全到达。这种对速度的赋能感，或者像汽车的刹车一样让你的业务有信心跑得更快，需要成熟的风险流程。有效的风险计划具有分级的风险考量和行动，创建了广泛的灵活性区间，并允许基于预先选择且知情的风险公式进行决策，这些公式充当指导原则。花费时间开发这些机制并让它们成熟，教育你的业务，同样重要的是教育你的团队，将赋能并使组织各层识别并促进快速的基于业务的风险决策。\n\
  \n3. **提前计划。** 你的对手资金充足，利用了比你更快的能力和决策护栏。就像老式的枪战一样，最先将子弹射向目标的人获胜。这意味着你需要习惯基于积累的知识而非绝对值来进行快速决策，并在你身边准备一个由预设决策、行动和计划组成的“弹药带”。例如，如果你发生了一个控制率低于\
  \ `x%` 的勒索软件事件，你会关闭数据中心吗？如果你正遭受金融犯罪攻击，你会报警吗？如果是的话，打哪个机构？他们的电话是多少？简单的努力，如桌面演练或定义预先计划的合作伙伴，将显著增强你在危机时刻的快速反应能力。由你的领导层同意的预置决策也确保了你的业务在需要时理解、支持并期待你提供清晰的行动和领导力。\n\
  \n4. **洞察大局。** 你需要远视的威胁建模。我认为每个人都会同意，看到一列飞驰而来的火车比被它撞倒要好。不幸的是，太多人过度狭隘地关注自己的运营环境，从没有足够的时间抬头看看轨道上驶来的火车。利用情报服务、信息共享伙伴关系以及其他让你看到业务之外相邻行业（如竞争对手或对齐生态系统）的机制，是衡量和准备尚未影响你业务的问题潜在影响的极佳方法。这大大增强了你准备、计划和应对情况及机会的时间，而这些机会往往因为孤立的行为而被错失。\n\
  \n5. **充分利用有限资源。** 管理一个投资回报率（`ROI`）有限、无利润且团队较小的业务需要不同的方法。并不是每个行业都具有核电站那样的任务关键性或金融部门那样的财务资源，我们大多数人永远不会。但仅仅因为我们无法建立大型运营团队，并不意味着我们没有可以提出的让我们更敏捷、更有适应性的方法。例如，有时少即是多。通常，我们使用的许多服务并非持续聘用，因此维护它们相关的成本或维护所需的技能被浪费了。为什么不考虑对这些服务的第三方外包支持呢？这不仅适用于有限的服务。如果有机会利用提供商生态系统以更低的成本交付核心服务，或者使用自动化和云服务来维护更实时且易管理的运营部分，为什么不考虑一下呢？有时，使用简化能力而非整个方案，可以让你拥有对最关键问题做出快速反应所需的能力，同时保持对你的业务合理的损益（`P&L`）。\n\
  \n### 赛车科学：加速、减速、硬刹车以及何时应用每种\n\n人类对速度的自然吸引力从我们能够直立行走起就是我们历史的一部分。无论是步行穿越陆地，还是乘船在水上，或是被动物拉着，速度都是我们祖先生存计划、社会结构和持续智力追求的一部分。在现代，数十亿美元被投入到几乎所有的竞技运动中。但速度与人类之间最复杂的整合之一是人与汽车之间。无论是为了在赛道上的高速刺激运动，还是在陆地上的惊人公路赛，还是作为那些通过快速驾驶来保护和拯救生命的人们生存的一部分，人们已经擅长快速驾驶汽车了。\n\
  \n与其他任何事情一样，将车辆操控到超过常态的速度有科学、技能和方法，而不理解这一点通常会产生毁灭性的影响。例如，不理解在弯道的哪一点加速或刹车会导致你的车辆翻滚，不理解运动物体的动态力会导致你失去控制，而不理解加速度惯性延迟会让你输掉比赛。\n\
  \n在网络安全领域，对于管理在速度面前保持有效的目标的领导者来说也是如此。有工具、技能和科学方法可以创建一种有效的方法，使组织能够快速移动并防御不断变化的对手。许多元素可以帮助你实现该目标，但以下是你可以今天就开始开始使用的实用技能。\n\
  ### 力量倍增要素\n\n\n\n\n\n自数百年前组织化军事理论出现以来，军队一直使用`力倍增`（force multiplication）这一术语。这个概念相对直接：通过对你的核心运营能力（人员）应用额外的资产，来加速并扩大其效能。例如，赋予一支军队情报资产，其运营影响将比拥有这些信息之前更大。赋予陆军\
  \ `GPS` 定位能力，他们将比在拥有该技术之前拥有相同数量核心资源时行动得更快、更准确。\n\n作为数字基础设施领导力领域的实践者，你可以通过同样的`力倍增`方法，使你的组织能够从战略上重点关注对速度的需求。通过对齐对你任务范围影响最大的速度要素，你可以增加杠杆来成倍提升资源的能力。也许是情报、自动化或新技术的。在某些情况下，也可能是使用第三方或访问数据的能力。无论何种，你都有机会通过简单应用资源元素、资源组合和资源对齐来操纵并加速你当前的能力，以满足对速度的需求。\n\
  \n\n关于运动规律的著作已经有很多了，通过对运动和速度的研究，科学取得了巨大进步。基本的运动定律仍然适用，“运动中的物体保持运动”这一原理的真理是不容疑的。在速度、网络安全、领导力和你的工作背景下，快速行动的能力始基本的行动能力。在这个领域，`惯性`与能力和速度随时间的增长是背道而驰的。通常，我们因为资金、资源有限，或者只是希望每次计划都\
  \ 100%完整，而等了太久才为组织配备能力。这种方法没有帮助，也没有必要，因为它不可避免地导致在最需要的时候已经太晚无法开始创建必要的能力。\n\n在面对速度时开发运营有效性的简单工具，是创建与你的任务范围对齐的支持服务、资源和能力，这些能力将在预防、检测、响应和恢复的核心领域最适用。这种想法并不是要创建\
  \ 100%完美的这些能力，而是拥有一个基准运营框架、知识和理解，随着时间的推移进行完善和使用。通过维护这种聚合的线级能力，确保你和组织理解它，将其加入你的作战概念，并不仅知道如何应用它而且知道如何培养它，你就可以比从零开始更快地实施资源。尽管它们在正常运营中可能很微小，但你快速培养它们并更快地应用它们的能力，将远大于你不得不从头开始的情况。\n\
  \n\n组织在快速执行能力中往往缺失的关键能力是其优先级排序的能力。尽管在我们的世界中，许多（如果不是大多数）事情似乎同等关键，但现实是始终存在行动和关注的顺序和优先级排序，意识到这一点对于做出实现速度的明智、知情且理性的决策至关重要。作为运营领导者，你应该随时准备好这三个优先级列表，并进行更新，准备在你的决策过程中使用：\n\
  \n*   **关键资产保护优先级**：这些是运行你业务的资产、系统、流程或功能。如果你只有 `$100.00` 可以花费，你会花在什么上？讨论应该涵盖你的业务，以确保你理解进入市场需要什么、什么让你的业务运营以及哪些关键资产对你的公司具有最高价值。\n\
  *   **风险优先级排序**：这个列表完全取决于你的关注。哪些项目对于解决你的风险价值最关键？在哪些方面可以降低优先级以影响其他优先级，在哪些方面可以移动资源以更快速地扩展？\n\
  *   **紧急行动防御协议**：这些是针对出现问题时预先协商/决定的行动。用俗话来说，为了救头，我可以切掉身体的哪个部分？当灾难性问题发生时，需要及时决策防止进一步灾难。谁可以命令关闭某条业务线，何时？哪些阈值需要自动行动，例如关闭数据中心？如果需要，谁有权报警执法部门？最关键的部分是将这些难以做出的决策记录在纸上，包括什么会触发它们，并确保整个业务对如何执行这些决策达成共识。\n\
  \n### 上路并提速\n\n在一个数字化赋能意味着以惊人的速度产生数字影响的时代，很难忘记坏人只需要对一次，而我们负责每次都正确。那些使我们能够保护业务或机构（特别是在大规模范围内）的“所有这些事情”的教育、创新、规划、说服、实施和管理，并不适用于`速度`这个词。但这正恰我们必须重新调整我们的、同样重要的是重新调整我们决策的方式。\n\
  \n\n测试你的流程，以确保它们满足你的任务优先考虑以及你的运营环境所需的速度要求。在它们经过测试之前，理论只是理论。除非你测试、扩展并确保你以快速速度适应和响应的能力，否则你将在虚假的预期上运行，这永远不会有好的结果。\n\
  \n\n增量地增加能力以驱动加速。也许是在数据收集中使用自动化，或者使用自动化分析来处理这些数据。也许是舍弃不是你优先级列表部分的旧技术、程序或服务，让你行动得更快。无论何种，首先理解你为什么要进行更改，然后创建一个衡量标准以确保这种变化是有意义且有效的。最后，要求你自己和你的组织负责维护那项新能力。\n\
  \n\n验证是将所有元素整合在一起的艺术。一旦你的组织接受了教育、完成了配置并准备好高速度运行，是时候验证它了。通过对问题、事件、决策或你的业务或机构中发生的几乎任何事情进行桌面演练\
  \ (`TTXs`)没有什么比这能更好地实时防止潜在灾难的发生。事实上，这些不仅是极佳的学习和调整机会，而且是非常好的团队建设活动。知道我可以信任自己的技能以及同事的技能，这注入了巨大的信心，反过来帮助我们所有人奔跑、行动和执行得更快。\n\
  \n\n\n\n\n在这个全新的数字业务生态系统中，没有任何事物是停滞不前的。“自满会害人”是军事和执法人员接受训练的首要内容之一。如果你的状况正在变化，但你的工具、技术、实践和能力没有变化，那么你将在任何战斗中都处于劣势。请通过实施生命周期方法来审查并改进你的适应能力，以避免自满，并成为一个以速度为基础的组织。\n\
  \n\n这一切并非在真空中发生。你应用这些原则、在速度赋能环境中运行以及在下一代数字生态系统中提供服务的能力都取决于人。你以及你业务增长的一部分，将是理解人的优缺点，以及他们随时间推移执行和适应的能力。如果速度不作为战略的约束性组成部分，它就没有用武之地，因为一个在缺乏深思熟虑、明确目标且良好规划的情况下尝试的组织将会失败。\n\
  \n最后，请将你的网络安全运营成功建立在对周围数字世界进行思考、理解、计划和执行时对速度的优势应用之上。\n\n## 关于贡献者\n\nRoland Cloutier\
  \ – ADP 高级副总裁兼首席信息安全官\n\n作为 ADP 的员工副总裁兼首席安全官 (CSO)，Roland Cloutier 为全球最大的人力资本管理解决方案提供商之一带来了全球保护和安全领导的理解和知识。Cloutier\
  \ 在军事、执法和商业领域拥有超过 25 年的经验，是公司和企业安全、网络防御计划开发以及业务运营保护领域的顶尖专家。在 ADP，Cloutier 负责全球网络安全、信息保护、风险、员工保护、危机管理和调查性安全运营的职能和运营责任。\n\
  \n在加入 ADP 之前，Cloutier 曾担任 EMC 的副总裁兼 CSO，在那里他领导了其全球业务运营的保护工作，包括跨商业和政府部门所有信息、业务风险、危机管理和调查性安全运营的领导。他曾担任\
  \ AimNet Solutions 的网络安全副总裁。他在军事和联邦执法部门拥有超过 14 年的经验，涉及全球航领域保护、欺诈和挪用调查以及特殊活动保护，其中包括在\
  \ 1996 年亚特兰大夏季奥运会的任职。\n\n\n*Scott Charney, Microsoft*\n\n有一句古谚警告说：“犹豫不决者失败。”换句话说，速度是至关重要的。事实上，速度通常被视为积极的信号，涵盖了从兴奋（快车）到竞争优势（更快的股票交易），再到更高效率（飞机优于汽车）的一切。是的，可能有缺点（“忙中出错乱”），但我们仍然向前冲。\n\
  \n在信息技术领域，速度通常等同于生产力的提高。摩定律指出密集集成电路中的晶体管数量大约每两年翻一倍，这允许我们在更短的时间内处理更多数据。从光纤到 5G，更快的传输速度让我们在更短时间内访问更大的数据集。机器学习和人工智能允许我们利用其他技术，并承诺做出更好、更快的决策。\n\
  \n尽管这描绘了一幅美好的蓝图，但关于速度还有另一句格言，它引发了对风险的思考。虽然“犹豫不决者失败”可能是事实，但我们经常被警告要“三思而后行”。也就是说我们在做决策时需要慢下来并更加谨慎。\n\
  \n那么，我们在决策时应该慢下来并更加谨慎吗？这取决于背景。在这些金融交易的背景下，速度提供了巨大的益处。\n\n\n在这些金融交易的背景下，速度提供了巨大的益处。\n\
  \n\n\n\n自动驾驶汽车已开始在主要城市的街道上行驶，它们提供了一系列益处，包括更安全的街道、更高效的车辆利用（从而减少拥堵）、提高老年人的出行机活性等。数据收集和分析速度同样至关重要，尤其是当车辆需要分析拥挤了其他汽车、自行车、行人和交通灯的道路上的数据时。此外，此类技术不仅要利用云端（可以在云端存储和分析来自多个源的数据），还必须能够做出“本地”决策，以避免在云端和本地设备之间传输数据所带来的延迟（这被称为“智能云端/智能边缘”模型）。\n\
  \n与此同时，随着技术的成熟并可能受到攻击，我们将面临许多新的风险。事实上，截至 2018 年 12 月 17 日，加利福尼亚州车辆管理局已收到了 124 份自动驾驶车辆碰撞报告，并有关于研究人员黑入自动化车辆的报道。尽管如此，虽然自动驾驶汽车可能并非完全“安全”，但如果设计得当，它们无疑会更加“安全”：自动驾驶汽车处理数据的速度远快于人类，它们在紧急情况下不会恐慌，而且不太可能被手机分心。\n\
  \n\n在第三种场景——即国际关系和自主致命性武器中，速度可能会对人类本身构成威胁。诚然，这是一个非常具有张力的陈述，但在军事背景下考虑技术的未来时，这并非危言耸听。问题在于，人类的时间尺度已从几天缩短到了几分钟。从那以后，网络战能力的引入可以说进一步缩短了响应时间。正如离任的联合参谋长部主席约瑟夫·邓福德（Joseph\
  \ Dunford）将军所说，“战争的速度已经改变，安全环境变得更加不可预测、危险且不可容忍。由于速度的增加，我们的决策过程必须适应，这需要对敌方的威胁和意图有清晰的理解。在冲突中，直接对抗将带来战斗，意外将带来胜利。”速度可能会对人类本身构成威胁。诚然，这是一个非常具有张力的陈述，但在军事背景下考虑技术的未来时，这并非危言耸听。\n\
  \n\n\n集成防御——这是所有其他领域和保护领域高端安全策略的核心要素——往往是一个经常被忽视的网络安全基础。过多的单点解决方案提供的防御不足，导致网络一旦被攻破就会变得脆弱。这种“马奇诺线”式的防御，无论多么复杂，如果只关注将攻击者挡在网络之外，注定会失败，正如其同名防御在\
  \ 1940 年的失败一样——只不过速度要快得多。\n\n连接性的必要性反映了网络安全中速度的重要性：集成程度越低，产生的漏洞就越多。为了实现有效的网络安全，防御者应该采取与早期互联网架构师（以及随随其后的攻击者）相同的集成化方法。支撑安全性的架构必须与整个互联网灵活集成机制的协作结构相匹配。网络安全架构师必须设计能够利用所有防御组件连接性的安全性。通过利用防御组件之间的连接性，防御者可以从组织内部和外部调度一整个安全人员团队。\n\
  正如安全必须利用并实现速度一样，它必须具备并强化强大的连接性。\n\n通过设计良好的安全措施，防御者可以实现网络安全的核心使命：实现并保护安全连接，并允许或拒绝对信息的访问。采用这种集成防御的防御者将获得优势。\n\
  ## 管理物联网时代日益加剧的连接性\n\nBrian Talbert，阿拉斯加航空\n\n在过去的几年里，数字连接的范围、规模和深度急剧增加，以至于它从根本上改变了我们对“连接”本身含义的认知和定义。\n\
  \n虽然安全和信息技术领域之外的许多人仍在谈论人类之间交流背景下更高层次的数字连接，但首席信息安全官（CISO）及其团队明白，那仅仅是当今超连接世界表面的一层微小且可见的波纹。物体与机器之间的连接才是连接性的宏大图景——这种规模每天都在呈指数级增长，现在已触及无法衡量和无法想象的边界。而且，正如许多\
  \ IT 团队所证实的那样，它变得越来越难以管理——至少仅凭人力如此。\n\n这是因为，随着物联网（`IoT`）的增长，如今大多数的连接发生在设备之间。为了提高效率、降低成本并增加便利，从摄像头到灯泡，再到家用电器，一切都被赋予了数字能力，允许这些事物连接到互联网并相互连接以共享相关信息。\n\
  \n这是一种新常态的功能水平，由消费者需求驱动了动能：随着越来越多的智能设备制造，越来越多的人开始期望新设备具备这种能力。越来越多的公司争相着利用技术来增强其产品线——无论他们是否具有这方面的经验。\n\
  \n如今，`IoT` 包含超过 84 亿台设备——预计到 2020 年部署的设备将达到 204 亿台。\n\n然而，消费者和制造商往往没有意识到 `IoT` 设备的便利性是以代价换取的。而且代价是巨大的：一个极其扩张的攻击面，由数百万个安全性极微的设备组成，而这些设备是由在数字技术安全方面缺乏经验的公司制造的。\n\
  \n许多 `IoT` 设备很容易被破解以获取网络访问权限，或者它们可以被链联起来极大增强攻击能力。再叠加用于管理这些设备的云服务，结果就是产生了一个极易受到攻击的漏洞水平。由于设备本身的安全性极低，这种攻击在不需要太多专业知识的情况下具有极强的破坏性。你不需要成为土木工程师就能推多米诺骨牌，也不需要成为网络犯罪大师就能将\
  \ `IoT` 转化为僵尸网络。\n\n以 `Mirai` 僵尸网络为例。2016 年 10 月，一次大规模拒绝服务攻击导致美国东海岸大部分地区失去互联网访问。由于攻击规模之大、破坏性之强——每秒\
  \ 1.1 TB 数据的数字海啸——当局最初怀疑这是某个流氓国家或敌对国家的战争行为。结果发现那是几个拥有初级黑客技能的大学生，为了在《我的世界》（Minecraft）中获得更多竞争优势。\n\
  \n这表明了当今连接格局的规模、力量和风险。\n\n`Mirai` 通过扫描开放端口，利用了 `IoT` 设备（特别是路由器、摄像头、DVR 和打印机）的组合力量，然后通过几行代码循环\
  \ 61 种常见的未更改默认密码来接管这些设备。在最初的 20 小时内，它捕获了 65,000 台设备——每 76 分钟数量翻一倍，增长到 30 万次感染的峰值。总计有\
  \ 164 个国家受到影响。\n\n随着 `IoT` 的持续扩散，IT 团队现在面临着组织内部两个主要的连接性挑战。他们必须应对普通终端用户带入的设备，例如有人放在桌子上的连接扬声器。他们还必须保护业务用设备，如安防摄像头、办公设备和设施设备。\n\
  \n尽管面临巨大的挑战，但对于 IT 团队来说，重要的是意识到：在大多数情况下，人们使用这些设备并非不顾安全性。这是一项新技术，人们只是并不知道它带来的风险。尽管如此，无论意图如何，IT\
  \ 必须在验证之前将每台设备都视为不可信的。\n\n这些结果导致了极具复杂性和规模巨大的问题。随着 `IoT` 表面积的增大，其定义也变得越来越模糊。当成千上万的设备可以访问网络时，很难辨别网络从何处开始、何时结束——而且它成为了任何可以绕过设备有限安全性的人的访问点。\n\
  \n不幸的是，在这样一个复杂且不断扩展的环境中，许多组织缺乏所需的可见性。结果是，他们不知道自己不知道什么，更不用说如何保护他们检测到的所有内容了。\n\n随着这种新现实的加剧，它对更好的可见性工具、网络访问控制以及更强大的威胁检测、预测和响应能力产生了首要需求。但即使部署了这些重要的防御措施，也远远不够。`IoT`\
  \ 的规模之庞大，仅凭人类是无法管理和缓解的。\n\n\n\n\n该程序必须包含良好的安全策略和架构审查流程。但它还必须面对一个新的现实：软件工程师和应用程序开发人员不能再假设他们构建的内容是基于天然安全且私密的底层网络之上的。安全编码实践必须深度植根于哲学、流程和部署流水线之中，以至于它们直接成为开发者自然实践的一部分。这里的标准很高，这些人员必须理解从用户身份验证到数据混淆以及安全数据传输的一切。组织将很快意识到需要开发可重复的模式，以及具有一致、标准化且可重用的安全代码库。\n\
  \n简而言之，解决连接挑战将要求从编码层面直到整个组织进行更深层次的合作与协作。要有效实现这一点，既需要资金也需要专业知识。正如许多首席信息安全官（CISO）及其团队所知，这是一个他们必须向\
  \ C 级决策者、甚至是董事会倡导并推广的严峻现实。\n\n尽管组织和文化变革可能是令人令畏的，但从你所在的地方开始并向前推进至关重要。如果一家公司在这些领域缺乏经验和专业知识，可能会产生推迟计划的倾向。但采取微小的第一步总比无所事事好。来自信赖顾问的外部协助通常会被证明是有价值的，即使只是提供一个组织可以遵循的路线图。根据需要寻找那些外部专家和倡导者，然后调整其服务以适应可用预算。至少，这样做将开始构建战略合作伙伴网络，这种网络未来将变得越发必要且弥足珍贵。\n\
  \n资金限制是所有 CISO 及其团队必须面对的现实，但保障企业安全的成本往往仅根据硬性分配——即所需的工具、时间和资源——来考虑。无形资产和机会成本也必须被考虑在内。投入构建下一个应用程序功能的投资回报，是否大于不可避免的泄露及其造成的声誉和品牌损害的成本？对于任何组织来说，这些都是复杂且具有挑战性的问题，但这些是所有公司都应该更倾向于回答的问题。\n\
  \n与不断扩张和复杂化、随着越来越多的消费级设备外扩展的网络复杂性和挑战相比，这些问题就显得微不足道。然而，组织拖延得越久，前行的道路可能就越困难。\n\n需要关注这些领域的明显迹象是：意识到你尚未这样做。太多的公司将泄露作为指标——可能并不理解其中涉及的巨大风险。如果你还没有实施安全编码实践，如果你还没有寻找未授权的\
  \ IoT 设备接入网络，你已经落后于时代了。你拥有容易被攻击的设备和代码几乎是肯定的。你不确定这一点的事实表明了风险可能有多巨大——并揭示了可见性及其提供的洞察力对于战略性地管理和缓解\
  \ IoT 时代日益加剧的连接性是何等关键。\n\n## 关于贡献者\n\nBrian Talbert – 阿拉斯加航空网络与连接解决方案总监\n\nBrian\
  \ Talbert 领导阿拉斯加航空的网络安全工程部门。Brian 负责战略方向和平台开发，保护每年运送 3300 万乘客前往 115 多个目的地的基础设施。在加入阿拉斯加航空之前的\
  \ 20 年里，Brian 曾在领先的服务提供商和企业工作，构建了推动信息安全技术的解决方案和组织。\n\n## 网络空间：理解这一切\n\n*Chris Inglis，前美国国家安全局（NSA）副局长*\n\
  \n`Cyber`（网络）。很少有词在不同语言和文化中被如此广泛使用。它被用作名词和形容词，这五个字母传达的意义比任何语言中绝大多数同类词都要多。由于该术语用途广泛，许多涉及“网络”的讨论未能实现人类通信中最简单的目标，即确保参与者在尝试交流时理解或指代相同的内容。\n\
  \n为此，本节为理解“网络”作为一个物理场所的基本要素奠定了基础——后文称为“网络空间”（cyberspace）。注意的是，`cyberspace` 术语包括但不限于硬件、软件和相互连接的总和，这些内容统称为互联网。\n\
  \n科学革命中那些充满好奇心的先驱者所做出的最重要的事情之一，是在智力上（有时是字面上的）剥离一个常见的物体——叶子、寄生虫、山坡——以更好地了解它是由什么组成的，以及它的部分是如何连接的，试图理解每一层是如何运作并帮助治理整体的。\n\
  \n\n各种作家认为网络空间不是一个领域，因为它是人为的，因此缺乏由自然规律、时间和空间的不可变规律所产生的领域所固有的持久且不变的属性。将网络空间视为一个领域的论据在于一个简单的事实：整体而言，它具有独特的属性，只有通过将“网络”作为一个独立的实体来研究才能对其进行理解或刻意改变。它是一个整合了各种技术和人类行为的中心点，同时它也作为实现广泛协作和集的资源。\n\
  \n\n在任何其他礼貌的对话中提到 `cyberspace` 一词，听者的脑海中会立即浮现出一团杂乱的技术、电线、人员，以及跨越时空的穿梭或存储在海量存储设备阵列中的通信。由此产生的技术、人员和程序的“乱麻”提供了如此复杂且不分出的景观，以至于在对话语境下，进一步使用\
  \ `cyber` 一词可能意味着任何意思，而且往往确实如此。因此，理清网络空间的组成部分并描述它们的特征、它们对整体效果的贡献以及它们之间的关系至关重要。这反产生一种分类法或路线图，允许在整体语境下对网络空间的离散方面进行专注讨论。\n\
  \n本节尝试在语境下，按照以下方向描述网络空间的离散方面：物理地理、通信路径、控制逻辑和存储、设备以及人员。需要注意的是，网络空间并非以此方式构建的，就像人类从胚胎到成年并不是按照《格氏解剖学》（`Gray's\
  \ Anatomy`）中列出的分类法生长一样。但这里的目标是理解网络空间的独特特性以及它在各种场景下可能如何运行，而不是描述如何重新构建它。\n\n\n###\
  \ 地理层\n\n\n\n人类对地理的知识通常让我们对事物如何从一个地方移动到另一个地方，以及各种活动的管理机构如何在广阔地理区域分配产生理解或感知。哪个学生没有背过“两点之间最短距离是直线”这一公理？然而，尽管这种想法令人感到安慰，网络空间对这一规则的认知非常模糊，它发现仅根据物理距离在全球范围内盲目路由通信是低效的。也就是说，在美国工作日的中间，一封从纽约发送到旧金山的电子邮件将与由于金融交易和转账的巨额流量、货运商与供应商之间的物流协调、个人通信，甚至是当时\
  \ YouTube 上最火的“猫咪弹钢琴”视频热潮竞争带宽，并可能通过其他国家从纽约发送到旧金山。\n\n运行在数百万台控制网络空间存储设备和路径的计算机上的软件，不断感知各种路由的状态，有时会将通信通过利用率不高的路径绕地球发送，以便以最快的时间到达仅几英里之外的目的地。如果不了解告知网络空间路由的非正式但有影响力的规则，意味着用户可能会对其通信所经过的路径以及在存储期间直到所有者访问之前实际所在地感到永远惊讶。在大多数情况下，这种反直觉的现象代表了用户偏好的功能，因为路由和存储的细节由自动处理，不需要用户掌握和指导技术、通信路线和流量流的复杂方面。但对于那些假设其数据是安全的（免受窥视或其他风险），因为它们存储或路由通过完全在用户视野范围内的技术和路径的用户来说，其缺点是显而易见的。\n\
  \n地理层的经验也让我们对谁负责什么产生了感知。网络空间无法忽视这样一个现实：治理人类事务的法律、政策和条约几乎总是与地理相关联。在试图理清哪些法律适用于跨国共享的财产，或者更重要的是，什么管辖权适用于在毫秒内跨越空间和时间但在几秒后又采取不同路线的活动时，这种现实变得特别具有挑战性。\n\
  \n一个案例有助于说明这一挑战。如果 A 国（例如，虚构国家 Inglisia）的人入侵了 B 国（虚构国家 Quadeland）的一台计算机，并使用那台被黑掉的机器攻击第三国（美国）的计算机，那么适用哪种法律和财产权？拥有美国境内机器的受害者是否可以出手并反黑\
  \ Quadeland 的机器？如果是这样，适用的是美国法律还是 Quadeland 的法律？如果受害者是第四国的居民呢？这样，基于地理的规则会迅速崩溃，并需要一种允许用户跨边界工作的模型，该模型必须满足各个司法管辖区法律中所体现的对隐私、尽职调查和其他用户预期的最高公约数。网络空间中的管辖权问题直到现在才与网络空间的物理（基于地理的）和实际（真实如何运作的）现实达成调和。\n\
  \n\n顶层反映了人是网络空间不可或缺的组成部分的事实。事实上，人（而非技术）解释了网络空间动态、不断变化的本质，因为用户在使用其各种能力时，其方式背离甚至困扰了组件、软件和系统设计者的预期。\n\
  \n讨论的模型中这一层伴随着几个重要的意义。首先，虽然宪法、法律和政策通常根据人们的国籍或物理位置向其分配权利，但网络空间是根据在网络空间中形成并验证的身份来分配访问和特权的。一个狗对另一只狗说“在互联网上，没人知道你是一只狗”的老笑话，在该领域的广阔范围内仍然基本成立。尽管一个人在物理世界和虚拟世界之间的状态通常会达成调和，但在确定访问网络空间及通过网络空间资源的权限时，网络空间的规则占据主导地位。这一现实使得物理世界中定义的法律应用于其数字孪生体变得极具挑战性，特别是当网络空间中的身份被伪造，或者由于用户使用旨在掩盖其身份的应用程序（以便其行为可以在不归属的情况下被采取，有时被称为“匿名”功能）而导致身份是不确定的。这并不是说物理世界中定义的区别并不重要，或者它们在网络空间中没有管辖权，仅仅是由于目前网络能力的限制，识别用户或分配归属是困难的，有时是不可能的。这种困难对于任何归属网络空间行为的愿望具有重大意义，以便实现对谁采取了某项行为的识别，并为给予行为相应的奖励或后果提供依据。\n\
  \n\n该模型的电路层描绘了通信在网络空间内部从一个地方移动到另一个地方的字面路径。与展开模型中的地理层和人类层相结合，这一层代表了曾经被称为电信领域的总和。\n\
  \n\n随着互联网开始使用这些通信方法传播其网络，并随着全球通信者的传输、存储和展示手段在多样性、范围和规模上呈指数级增长，电信领域发生了几个重大的变革。\n\n\
  首先，关于通信何时以及如何在两个通信者之间的空间流动的决定被委托给了日益嵌入通信和存储设备中的计算机。\n\n其次，通信被存储起来供预期接收者以后检索，或作为发送者的“网上”资源。\n\
  \n\n\n\n最后，通信的丰富性不断增加，以至于某次通信不再仅仅是领域之外思想或价值观的简单反映。通信无论是在传输中还是存储中，开始具有自身的价值，通常作为思想、财富和财产的独特表现。财务转账、现金账户、公司秘密和图片现在都存储在网络空间中，且`通常在物理世界中没有备份`。彩色矩形纸、打印的股票证书和存折作为代表金融资产主要手段的时代已经过去了（20\
  \ 世纪 70 年代广泛使用的 `passbook` 一词，对于在那之后出生的人来说可能完全是生的）。存折已被 0 和 1 取代，这些数字仅在网络空间中被存储、交易、赚和丢失。\n\
  \n\n控制逻辑层代表了嵌入在构成网络空间物理基础设施的数十亿设备、计算机和其他智能组件中的逻辑。虽然这种逻辑的传播和无处不在使得人们无法从字面上观察到该层的物理表现，但它的影响是同样真实的，而且更重要的是，它对于理解网络空间基本属性的行为至关重要。事实上，网络空间在路由、存储、关联和重新路由日益庞大且复杂的信息流方面的非凡效率，几乎完全取决于将这些任务委托给嵌入在该层中的逻辑。\n\
  \n这一层使得计算机能够在没有人类干预的情况下相互交互，它们通过做出无数选择，以维持通过网络空间互连的数十亿人类用户和机器用户之间连贯且有序的交互。这种结果产生了越来越多被称为“物联网”，或\
  \ `IoT` 的事物：机器与机器相互交互，所有机器都经过了编程，以预测并超越人们的预期，而这些人们往往很少直接参与、甚至不理解其中涉及的技术复杂性。\n\n\n\
  设备层完善了模型。这也许是网络空间中最可见的组件，因为设备将用户连接到网络空间内部及提供的可用服务。它们包括个人计算设备、智能手机、台式电脑、平板电脑和导航单元——一种不断增长且多样化的硬件、软件和无处不在的应用组合。它们的作用是根据用户的偏好和设计者的规范捕捉、呈现和操纵信息。重要的是，后一种影响因素并不总是显而易见的，因为这些设备捕捉和传输的信息远超通信本身，以便更好地实现对其所有者所托的数据的路由、存储和恢复（例如，所谓的\
  \ `metadata`，包括路由信息和其他属性，如 `geolocation`、所使用的操作系统和系统软件的规范等）。\n\n随着这些设备变得越来越移动化（使使用它们的人保持与网络空间及其系列服务的连接，无论设备或用户的位置如何），曾经将设备与人或位置关联的简单任务已变成一项复杂得多的事情。服务提供商对其商品收费的基础经济模型也随之发生了，通过将按次和基于位置的费用替换为固定费用计划（仅需对用户访问全球任何地方的全球通信服务收取费用），实现了更强的用户和设备灵活性。根据设备物理位置确定隐私规则或产权状态的法律制度，现在必须处理数据、设备和人之间复杂的调和工作，尽管它们在物理上位于三个（或更多）不同的地点，但它们之间可能活跃且丰富地相互关联。结合一个人使用多个设备（通常是同时使用）的现实，与个人相关的操作可能在网络空间中表现为在全球多个地点同时运行的人格集合。其结果是一个依赖于物理世界向虚拟世界微弱映射的法律制度，而且在决定什么构成了合理行为以及超出这些行为的可接受后果时，对于应该采用哪个国家的规则存在模糊性。\n\
  \n## 垂直维度与视频的重要性\n\n尽管任何对网络空间的静态表示可能是不完善的，但模型现在已经完整了。模型的组件以分层的方式排列，使得整个网络空间看起来就像被捕捉在一张快照中。虽然在理解网络空间的构建模块时，孤立考虑任何特定层是有用的，但只有通过分析用户和过程利用网络空间实现其最终目的时，层之间的相互作用，才能理解其操作。也就是说，虽然很容易察觉到网络空间允许一个用户与另一个用户直接通信（这种活动可能被认为是在模型的人层之间水平发生的），但现实是用户在与他们的设备交互。那些设备通过受控制逻辑等严重影响的通信路径相互连接，从而产生了一种比水平方向更具垂直方向的数据流和动作流——在分层堆栈中上下流动。尽管人们倾向于将网络空间视为主要由堆栈的各个组件（中间三层）组成，但只有通过考虑这些层及其与外两层（人类和地理）之间的亲密关系，才能理解整体。\n\
  \n\n### 启示\n\n从整体考虑时，该模型提供了一种理解其组成部分由于相互作用而产生的属性的方法。四个关键属性脱颖而出：\n\n### 不仅仅是技术\n\n\
  尽管人们很容易将网络空间仅仅视为技术，但如果不考虑人类、地理以及与之伴的政策和实践的影响，就不可能理解预测或有意义地影响其操作。\n\n\n\n网络空间的特征是人员、技术和数据在指数级上的大规模汇聚。该模型表明，这种汇聚发生在任何给定的层以及所有层级之间。更重要的是，当你连接到网络空间时，可以理解为整个网络空间都在与你连接。安全专业人员努力减少或减轻非必要的连接，但连接的动力是网络空间内一种不可阻挡的力量。这导致了\
  \ `IoT` 一术语越来越多的使用，用以描述一种看似不可避免的趋势，即万物互联——冰箱、汽车、电厂等，所有所有事物都连接到、并在网络空间中进行连接。因此，系统设计人员和用户关于是否以及如何连接的选择，必须由对汇聚影响的预先考虑，而不是采取“等我处理那里时再解决那个问题”的方法（用户在连接时就*会遇到*那个问题了）。此外，如前所述，在一个根据物理位置适用不同且独特规则的世界里，汇聚与地理并不容易融合。网络空间需要跨越这些边界进行协作和规范化，尽管根据地理位置行使管辖权对当地预期行为和后果的清晰说明，将是地区间和解的宝贵首付款。\n\
  \n## 财富、宝藏及更多\n\n网络空间字面上确实包含了财富和宝藏，而不仅仅是引用或协调其管理。鉴于同步人类和系统的愿望与行动所带来的巨大效率，网络空间越来越多地用于协调和执行关键系统的基本功能，从发电到金融市场，从外交、协作，甚至是战争的进行。正如美国海军学院网络中心的马马克·哈格罗特（Mark\
  \ Hagerott）博士提到的，人类事务正发生着变革，在这种变革中*感知、思考*和*行动*（即使在物理空间中）正越来越多地委托给服务于整个网络空间范围内人类活动的硬件和软件网。人类对结果施加理性控制的自然欲望，只有在我们超越制定关于技术的规则，转而为人类、技术和系统之间的互动制定更广泛的治理规则时（考虑到根根于地理的规则和政策），才能获得成功。\n\
  \n## 永恒变化，永不安全\n\n在硅片革命的 50 年里，技术在极大提高处理能力、带宽和用户体验方面的卓越表现，被广泛认为是时代的标志性代表（有时被称为硬件的摩尔定律，但软件、可视化和协作也共同推动网络空间容量达到新高度，并呈指数级增长）。较少受到关注的事实是，特征、功能和行为的变化是由一群虚拟的企业家自下而上驱动，与自上而下的驱动一样多甚至更多。这种结果以及用户行为和软件的不同步变化（这些通常滞后或领先于硬件变化），使得几乎不可能对网络空间定义并施加一种关于事物如何运行、更不用说如何工作的全面且持久的描述。对于那些等待其喜爱的技术提供者带来下一个奇迹的人来说，这可以被地视为一种特性，但同样的属性也使得防御网络空间内拥有的财富和宝藏，以及依赖网络空间韧性和完整性的关键系统和过程，变成了一场徒劳的捕兵追逐。技术、软件或用户行为的任何变化都预示着覆盖整个系统的安全织层可能出现裂痕。这种不可避免且不同步变化的现实提供了一个根本性的选择：即在网络空间的持续转型中，安全被视为首要特征还是次要特征。\n\
  \n\n\n\n由于互联网代表了人类进化史上最令人震惊的创新之一，其发明者往往备受推崇，以至于他们令人惊叹的短视也受到了宽容。但当我们停下来反思时，令人费解的是，这些极具远见的计算机科学家——他们对数字连接的力量和可能性的洞察足以改变历史的进程——竟然会忽略或未能解决关于他们发明品的最基础的问题：如果这东西真的流行起来了怎么办？\n\
  \n\n今天，几乎每一个网络安全专家和高管都生活在这一答案带来的混乱之中。当一个专为少数学者和工程师的小圈子设计并使用的通信平台，迅速扩展到全球数十亿公共使用时，随之而来的是难以想象的挑战，以及本该得到更有效解决的基础性问题。\n\
  \n例如，身份验证。如果这真的流行起来了：\n\n*   我们如何可能验证谁是谁、什么是什么？\n*   我们如何能验证用户身份，以便在这一庞大的网络中规定并限制他们的访问权限？\n\
  *   我们将如何对软件到操作系统、操作系统到硬件、或软件到软件之间进行身份验证？\n*   在一个围绕信任原则构建的系统中，当什么都不可信时，会发生什么？\n\
  \n例如，维护。如果这真的流行起来并扩散到高层军事和学术用例范围之外：\n\n*   谁将成为警察、医生、土木工程师和维护人员？\n*   我们将如何能招募、培训并持续、有计划地提升劳动力所需的技能，以确保这项创新的正常运行？\n\
  *   我们将如何对这部分劳动力进行分层、组织和分类——在一个没有足够的人力资源来保护和维护的庞大超连接系统中，其潜在的后果是什么？\n\n例如，保护。在这个人类连接的数字乌托邦中：\n\
  \n*   我们是否面临着变成数字反乌托邦的风险——一个崩溃的信息状态，为最肆无忌惮的人创造了真空？\n*   我们是否正在创造一种极其高效的传染模型——一个由欺诈、骗局和漏洞组成的不稳定的潜在链反应？\n\
  *   我们将如何能识别漏洞并提供必要的解决方案来缓解它们？\n*   我们将如何分发这些解决方案，由谁来实施，我们又如何确保执行是正确的？\n\n这些未解决的问题导致了内植在互联网安全\
  \ DNA 中的固有漏洞。反过来，这些漏洞导致了反复的破解模式，为了获得满意的性能而接受了某种程度的安全。结果就是产生了深根蒂固的弱点，这些弱点塑造了数字攻击的范式。正如我们在接三个章节中看到的，这些基本的结构性缺陷是几乎所有攻击的共同点，并在网络安全领域创造了最棘手的挑战。\n\
  \n当我们分析这些深根蒂固的漏洞在全球范围内扩散时发生了什么时，网络安全更大、的轨迹变得清晰了。\n\n*   如果修复措施被忽略或处理失败，责任是否仍局限于那些没有采取建议改进的人那里？\n\
  *   或者，在一个超连接系统中，一个个人或组织的错误是否会创建一个立脚点和避风港，从那里攻击他人？\n\n网络运营商不需要在猜测外部威胁方面具有卓越的洞察力，也不需要在检测网络入侵方面无处不在。正如第二部分中的章节所示，如果他们能掌握身份验证、补丁和用户培训问题，他们就能制定出一种成功的网络安全策略。\n\
  \n# 3 身份验证\n\n![](img/c03uf001.png)\n\n身份验证是验证个人、系统或实体身份的安全性过程。从互联网的最初——无论从哲学上还是数字基础设施上——身份验证都是一个被忽视的必要需求。这种忽视造成了一个普遍的弱点，这种弱点已经演变为黑客的主要方法。\n\
  \n由于互联网是在一个孤立的社区内开始并发展的——受到严密控制的塑造——对于现代安全从业者来说，身份验证的滞后是可以理解的。为什么要关注验证每个人的身份呢？\n\
  \n*   缺乏可靠的身份验证自互联网诞生以来一直是安全的性梦。\n*   身份验证的需求是多层次的：人到硬件、软件到操作系统、操作系统到硬件、软件到软件。\n\
  *   身份验证失败是几乎每一次泄露、犯罪和利用的共同点。\n\n当从科学的角度来对待网络安全时，我们必须考虑到思想的演变。这种演变代表了科学的精炼——既包括科学过程本身，也包括它揭示的信息和事实。\n\
  \n想想在 1500 多年里，天文学是基于托勒密的地心说——即太阳、星星和其他所有行星都绕地球运行的理论。虽然从回溯来看很容易否定这种理论，但重要的是要认识到，包括柏拉图和亚里士多德在世界上最受尊敬的思想家，他们的工作基于此。\n\
  \n接受地心说并不是缺乏智力或洞察力。相反，驱动该理论的中心错误，以及作为常识的离心力维持了它。直到哥白尼在 1543 年去世前发表了《天球运行》，日心模型才开始被采用。这一观点又花了一个多世纪的时间才获得更广泛的支持，最终让天文学取得了许多重大的进展。\n\
  \n同样，网络安全必须严谨地识别错误的前提，这样我们才不会投入时间、精资源设计注定失败的解决方案。网络安全中一个非常清晰的错误例子就是身份验证不足。\n\n在我们解决这个问题之前——有效地验证人到机器、软件到硬件、进程到操作系统等——我们永远在通过其他必要的策略和机制来对这一漏洞进行补偿。\n\
  \n\n\n\n\n想象一下你的电子邮件账户中存储的海量个人数据，其中包含了关于你以及你认识许多人的最敏感、最具身份标识的信息——这些信息可以追溯多年。这可能包括银行账户、医疗记录、你及家人的社会安全号码、税收文件等。\n\
  \n一个被猜中或骗取的密码就能解锁所有内容。一旦攻击者获得了访问权限，他们针对该信息存档中每个连接进行更有针对性、更复杂且更有计划性的攻击的能力将呈指数级增长。目前的统计数据估计，全球每发送的\
  \ 131 封邮件中就有一封包含恶意软件或恶意链接。只需一封邮件就能导致泄露。\n\n现在想象你不是一个个人，而是一个组织——拥有 100、1,000 或 10,000\
  \ 名员工。所有用户都拥有电子邮件账户、笔记本电脑、平板电脑、智能手机和其他移动设备，这些设备提供了访问网络上最关键任务数据的切入点，从现场服务器到多云网络。\n\
  \n对于那些负责防止企业级、国家级甚至全球安全级别攻击的网络安全专家和高管来说，身份验证——兼顾速度和规模——仍然是最大的挑战之一。网络钓鱼、叉式网络钓鱼、捕鲸鱼攻击、SQL\
  \ 注入、分布式拒绝服务（`DDoS`）、暴力破解和中间人攻击的频率和破坏都在增加，这是有原因的。\n\n通过更强大的身份验证，我们可以反击。\n\n## 身份验证、数据完整性、不可否认性、可用性和机密性：安全的五支柱\n\
  \n*Mike McConnell，前国家情报总监*\n\n1994 年，我担任国家安全局（`NSA`）局长刚满一年，网景（Netscape）的创建者就将用于网络登录和通信的旧复杂系统变成了世界网。几乎一夜之间，这一切成为了，因为国际无线电通信（主要是卫星）被海底光纤电缆（约\
  \ 1990 年）所取代，电缆不仅能处理语音和数据，还能处理爆炸增长的网络流量（如互联网）需求。这些网络的实现得益于处理速度大幅提升的数字处理（计算机和路由器）。今天，超过\
  \ 95%的互联网流量通过光纤传输传输。\n\n在此之前，`NSA`主要侧重于拦截和分析在天线之间通过大气传输外国情报目标的无线电通信。这意味着要在正确的频率、正确的地点以及正确的（通常是简短的）时间范围内进行扫描。一切都必须对时并对齐以捕捉通信。\n\
  \n当光纤线缆网络通信爆炸式增长时，数据拦截从捕获运动数据（数据从天线到天线的传输）扩展到包括“静态数据”，即数据以数字形式存储，而不是打印在纸上并存放。由于组织现在以数字形式在计算机中存储这些信息，使得它们即使在“静态”状态下也变得脆弱。这意味着我们改变了收集外国情报的方式和地点。\n\
  \n幸运的是，当时`NSA`拥有全美最密集的数学和计算机科学博士，专注于密码学、数学、安全代码、破译和代码编写等领域。而且那时，我们的计算能力超过了世界上其他地区的总和。因此我们很快意识到，可以通过互联网访问存储在计算机上的信息。\n\
  \n尽管这个想法很有趣，但也面临一些挑战。美国法律规定，在美国领土上方大气中收集的外国目标数据是自由捕猎的，因为没有隐私预期。所以我们可以随意拦截从一个天线移动到另一个天线的外国目标数据。但随着互联网的兴起，我们的外国目标开始通过光纤线路通过电子邮件进行通信，而不是无线电波。而且当时根据《外国情报监视法》，收集这些数据（即使是来自美国境外国目标）也需要搜令。\n\
  \n我们通过侧重于网络利用技术来访问外国的静态数据来做出应对。目标是进入网络，定位感兴趣的设备，获取我们需要的目标信息，然后离开。这就是信号情报在 20 世纪\
  \ 90 年代的发展方式。由于`NSA`的两大主要任务之一是破解代码以利用外国目标，我们发现打开计算机、获取数据且不留指纹是容易的。\n\n但`NSA`任务的另一面是编写代码：保护所有机密信息，以确保外国实体无法侵入并夺取我们的数据。在\
  \ 1987 年的《计算机安全法》中，国会要求`NSA`提供保护所有机密信息的代码，而国家标准局（1988 年变为美国标准与技术研究院 `NIST`）被赋予了保护政府未分类信息的使命。目前没有任何联邦机构负责保护私营部门关键基础设施的安全。\n\
  \n但向数字光纤线缆通信的转变不仅影响了政府。关键基础设施和数据（例如我们私营金融部门管理的数据）也开始暴露。国家没有银行就无法运作，因为国家必须有一个可靠的交换媒介和一个管理这些内容的可靠系统，以确保商业和社会能够有效运行。中断银行服务将产生严重的国家后果。\n\
  \n随着信息技术和数字处理的爆炸，银行业正向一种环境移动：他们在那里以 0 和 1 的形式存储财富，交易以光速发生。在很短的时间内，美国变成了最脆弱的国家，因为我们对新型数字基础设施的依赖程度最高。\n\
  \n意识到这一点后，我开始关注`NSA`两大主要任务中“编写代码”的一侧，以理解我们如何能够保护那些关键基础设施——如金融、能源、交通和电信——这些基础设施被政府认为对国家的持续运行和福祉至关重要。\n\
  \n\n\n\n他解释道：“在美国政府中唯一有权下达核攻击命令的人是美国总统。如果你在海上的潜艇上，或者被埋在导弹发射井中收到了指令，你最需要知道的一件事是什么？那就是该指令是真实的，并且是来自美国总统。有一套系统可以验证这一点。如果下达了指令，你拆开一个代码包，而随指令发来的代码必须与你手中持有的代码匹配。”通过代码和加密，我们实现了数学上的确定性。\n\
  \n接着他问我第二个重要的事情是什么。我说：“那必须是乱码文本。”他说：“不。第二重要的是**数据完整性**（data integrity）。一旦导弹操作员验证了发射代码，万一由于某些行为者或错误改变了其中一个数字，或者将你目标设定中的小数点向右或向左移动了一个位该怎么办？你就会击中错误的城市。数据完整性确保了交易过程中没有任何内容被更改，因为通过适当的加密，操作人员可以用数学上的确定性对其进行验证。”\n\
  \n“第三个是什么？”他问。“嗯，现在我猜是**机密性**（confidentiality），”我回答道。他再次说：“好吧，你猜错了。下一个是**不可否认性**（nonrepudiation）。”他解释道，“想象一下总统下达了核打击指令，行动执行了，后来国会发现总统犯了错。不可否认性意味着他不能说不是他干的。这意味着你不能否认你下达过该指令的事实。”\n\
  \n我说：“既然你已经给了我认证（authentication）、数据完整性、不可否认性、可用性（availability）和机密性的列表，我猜下一个是可用性，意味着一个过程不仅始终是可用的，而且它在无限长的时间内都以相同的方式运行。”我是对的。接着他说了一句我永远不会忘记的话：“在核武器指挥与控制中，我们甚至不担心机密性。事实上，我们可能希望对方也知道，因此指令甚至可能以明文发送。”\n\
  \n这就是我对信息安全的启蒙。\n\n从那时起，我开始思考信息安全。在军队中，我们使用对称密钥加密和需要查阅及验证的代码。但在数字世界的早期，我们都通过计算机连接网络发送信息，包括价值巨大的数据，并使用\
  \ 0 和 1 来代表财富、研发成果、知识产权或专有业务信息。所有这些宝贵数据都在网络中传输，而大多数组织甚至还没有考虑过认证、数据完整性和不可否认性的概念。\n\
  \n正那时我也开始意识到这个国家极其脆弱，因为没有办法将国家安全方法应用到私营部门。但私营部门拥有并运行着国家 90% 到 95% 的电信和信息系统。\n\n\
  我体内的经济学家灵魂开始从银行的角度来思考这堂课。如果你从东京向纽约转账 1 亿美元，这笔交易的认证部分至关重要。发送者和接收者真的是他们声称的身份吗？这意味着认证是必不可少的。你也可以对数据完整性提出同样的观点。你不希望移动一个数字，因为\
  \ 1 亿美元可能会突然变成 10 亿。最后，不可否认性也变得至关重要。\n\n正那时我也开始意识到这个国家极其脆弱，因为没有办法将国家安全方法应用到私营部门。但私营部门拥有并运行着国家\
  \ 90% 到 95% 的电信和信息系统。\n\n### 通信的艺术\n\n这些通信可以从四个维度来考虑：通信、利用通信、防御通信，最后是降级或破坏通信。\n\n\
  目标是让这些实体共享信息、理解信息、评估信息，然后对信息做出决策，无论是面对面还是远距离的。下一个元素是拦截这些通信，以知道双方在谈论什么。其目的可能是恶意的，可能是合法的，甚至是自卫。但无论如何，目标都是通过拦截来理解这些通信。\n\
  \n这种活动正是为什么第三个元素——防御通信——如此关重要的原因。除了为了阅读他人信件而破解代码，我们还需要改进加密技术，以防止他人阅读我们的信件。\n\n现在，通信还有第四个元素，即不仅是为了被动分析而利用系统，而是为了破坏数据和其他关键资源。它驱动了国家级网络战能力的产生。\n\
  \n### 实现信息完整性\n\n如果外部人员可以在没有归因或认证的情况下进入信息系统并提取信息，国家、企业和个人都面临风险。无论是在总统命令核攻击的背景下，还是从日本到纽约转账\
  \ 1 亿美元的合法交易记录中，认证、数据完整性和不可否认性都是必不可少的。\n\n\n\n\n问题是，我们如何实现并维护信息的完整性？挑战之一在于，如何让行政部门和国会意识到我们所面临问题的规模。我们需要政策和立法框架，使我们能够在数字世界建立同等水平的身份验证、数据完整性和不可否认性，而这种水平目前仅在需要驾照或护照进行验证的面对面互动中才具备。事实是，过去我们通过物理签名或印章所获得的认证程度，要比现在在数字世界中使用\
  \ 0 和 1 要高得多。\n\n另一个挑战是，在涉及这些问题时，并非所有人都有相同的目标。在联合国安理会的五个常任国中，英国、法国和美国希望利用互联网进行思想和创意的自由交流，以告知其公民、促进贸易并让世界变得更好。然而，另外两个常任理事国中国和俄罗斯则希望监控其公民并控制他们对信息的访问，这也允许他们评估公民对政党路线的遵循程度。\n\
  \n当某些国家运行目标显然不同时，我们该如何建立一种全球性的能力来确保身份验证、数据完整性和不可否认性，从而鼓励思想的自由、安全流动？银行业可能是所有行业中做得最好的。他们建立了一个信息共享与分析中心，前十大银行的首席安全官都彼此相识，并有一个交流想法的论坛。这种方法不仅需要复制到其他行业，还需要实现自动化，以便组织能够以网络速度交换威胁和漏洞信息。\n\
  \n更具严峻性的挑战是，随着技术和网络的融合，不同行业将不再能够孤立地管理其安全。一旦你驾驶着一辆智能汽车进入智能城市，一系列奇设备就会开始相互作用。导航、将银行信息与收费道路或停车位绑定的能力、实时访问路况信息，以及通过重新规划交通和灯光来应对城市中拥挤的区域，都需要在所有这些元素之间具备无缝的身份验证能力。数字企业也面临着同样的挑战：精通技术的消费者、云和物联网（IoT）网络、信息技术（IT）与运营技术（OT）的融合，以及融合了用户个人生活与职业生活、并加载了数百个可能被利用应用程序的智能设备。\n\
  \n使用身份验证不当且不安全的访问点，意味着攻击者可能访问关键基础设施和资源，在这些地方他们可能会降低、更改或破坏关键信息。这就是网络战的本质。启用并保障这一新一代互联系统不仅需要立法，还需要采用开放标准和协议，以便这一过程在组织内部以及组织之间更有效地进行。这是因为一切都处于同一个互联基础设施上，这使得身份验证、数据完整性和不可否认性比以往任何时候都更加关键。\n\
  \n## 贡献者简介\n\nMike McConnell – 前国家情报总监\n\nMcConnell 在 1996 年以海军将将衔从海军退役后，加入了 Booz\
  \ Allen  way，并领导了该公司信息保障与情报业务的发展。\n\n2007 年，应乔治·W·布什总统之担任第二任国家情报总监（DNI），他担任了 `DNI`，这是一个内阁级别的职位，并在布什和奥巴马总统期间担任白宫国家安全委员会成员。2009\
  \ 年，McConnell 回到 Booz Allen 担任执行副总裁，领导公司的情报业务。他于 2014 年 7 月从 Booz Allen 退休，目前担任高级执行顾问。\n\
  \nMcConnell 的职业跨越了 45 多年，专注于国际和外国情报问题。自 1992 年至 1996 年担任 `NSA` 局长以来，他的重点一直是提高全球企业和政府机构的网络安全态势，以更好地保护他们免受黑客、犯罪分子、恐怖分子以及专注于经济间谍活动或破坏重要数据的国家的侵害。他继续与国防部、国土安全部和国家安全局保持紧密合作。\n\
  \n## 身份验证与信任模型\n\nShannon Lietz, Intuit\n\n当网络首次出现时，身份验证是一个相对简单的过程。事物要么在边界内，要么在边界外。这很简单。不久后，对手就能攻破公共网络，因此防火墙变成了必需品。不久之后，虚拟专用网络（`VPNs`）诞生了。今天，网络具有更强的互动性和复杂性，需要多级身份验证才能访问资源。大多数资源都需要独立的身份验证。一些用户对随之产生的生产力挑战抱怨，于是创建了单点登录以减轻这一问题。但现在，应用程序之间需要相互身份验证以完成更复杂的操作。最后，我们必须应对\
  \ `IoT`。遗憾的是，这仅仅是一个开始。\n\n即使访问的概念也变得非常复杂。例如，人们现在正在用数字门锁取代家中的钥匙锁。他们想在开门之前看看是谁来访。他们想防止包裹被盗窃，因此向快递服务提供特殊的访问代码。他们希望当家庭成员离开或回来时，数字锁能通过消息以及可能的照片或视频片段通知他们。他们还希望能够远程锁门、开关报警器。\n\
  \n这种程度的访问控制和赋能是在近期智能家居技术创新之前是不可能的。所有这些活性之所以可能，是因为数字钥匙从根本上与物理钥匙不同。然而，它引入了新的风险。在应对新风险的同时扩展信任，需要将数字锁与额外工具结合，如数字摄像头、感应灯和集成式数字报警系统。这种通过组合控制措施来安全扩展信任的理念，对于理解身份验证至关重要。现在的身份验证需要工具和技术来增强识别验证，设备识别、多因素身份验证、隔离、监控、标记和动态加密等控制只是这些新需求元素的几个例子。事实是，仅仅依靠身份验证已经不够了。游戏规则已经改变，是时候升级了。\n\
  \n### 将身份验证与访问密钥或令牌结合的力量\n\n将身份验证与提供不同访问权限的访问密钥或令牌相结合，可以允许组织创建一个带有身份验证的边界，即使传统的边界可能已不存在。网络边缘已变得弹性且具有渗透性，使得传统的边缘安全措施不再有效。然而，如果应用得当，身份验证与其它技术相结合，可以作为一种防火墙，帮助保护无边界的环境。\n\
  \n\n\n\n这种方法的影响无论如何评估都不为过。现代或基于信任的身份验证使我们能够构建响应响应的环境；将安全控制深层引入网络；并开发更好、更具个性化的应用程序，以便我们完成更多工作。然而，要扩展到互操作性和互连的下一个水平，你需要在网络架构中构建一种内在的信任能力。\n\
  \n## 代理能力 (Brokerage Capabilities)\n\n为了实现这一点，现代身份验证还需要代理能力，能够代表那些需要身份验证的人和事物进行断言和代理。这不仅仅是简单的授予或拒绝访问，而是更深入到为什么授予访问、应该应用访问的程度以及何时应该调整访问级别。例如，当设备运行良好时，它被允许获得新的信任级别以执行某些操作；当它运行不佳时，就不再被允许执行这些操作。这很简单。但如果我们把访问与密钥或令牌相结合，这些密钥或令牌被断言可以启用更具体的交互，例如根据应用程序需求和用法得出的更好、更细粒度的意图代表用户交换访问呢？在这种情况下，身份验证本身与其说是理解你是谁以及你是否应该拥有访问权限，不如说是扩展到了支持你的生态系统中。\n\
  \n通过这种方式，数字生态系统源于身份验证与数字版权管理的结合，随着技术变得日益复杂，这种结合已无处不在。信任是基于系统 `on behalf of` 终端用户及其意图授予的密钥或令牌交换建立的。拥有一组扩展到其他设备、应用程序和进程的密钥，使得身份验证能够为你做更多事情。如果一个设备或进程与你的身份相关密钥，那么对于网络而言，该设备\
  \ `is` 你，你将能够以以前所未有的方式进行扩展。\n\n相比之下，在传统的单体身份验证方法中，你可能导航到一个系统，输入密码，并通过一组硬编码的权限被授予访问权限。\n\
  \n今天，这已经不够了。你可能有数百个与你的身份相关的身份验证密钥，以及一组你希望代表你启用的意图。你可能只有一个密码或令牌来获取这些密钥的访问，但一旦获取了，这些密钥将根据各种因素决定你是否可以访问网络资源。\n\
  \n在某些情况下，开发者正在构建能够对访问做出动态决策的应用程序，这意味着传统的授权机制已经无法跟上。\n\n当你将这些身份验证密钥绑定到微服务时，它们可以根据信任为应用程序、工作流或类似资源提供不同程度的访问。因为你有更多的身份验证密钥，你也拥有了更多的开启/关闭开关，使你能够在不损害网络完整性的情况下完成工作，即使某个密钥由于某些原因需要关闭。\n\
  \n除了访问资源外，身份验证还可以扩展到服务和功能，使我们能够在特定组织的限制之外与数字世界进行交互。本质上，零信任环境对于现代身份验证范式至关重要。这需要动态身份验证密钥连接到流动的数量的授权和参数，以便我们能够在今天正在创建的超连接数字环境（如智能家居、智能汽车和智能城市）中访问资源并进行交易。当然，这是一个新兴领域，它需要构建某种能够轻松跨越不同网络和系统的开放密钥架构（open\
  \ key fabric）。\n\n## 个人之外的身份验证 (Authentication Beyond Individuals)\n\n特别是，身份验证必须扩展到个人之外。随着网络设备变得越来越智能，它们能够越来越多地\
  \ `on behalf of` 个人甚至群体进行自主运行。我们还将看到由软件引导的应用程序之间的直接关系，完全根据这些设备代表的身份配置来提供特定的、定制的服务。这意味着我们需要零信任身份验证，通过允许将范围权限作为身份的一部分来携带，将信任扩展到不仅仅是人类。\n\
  \n建立和采用开放标准对于转向新的身份验证范式至关重要。`OpenID` 和 `OAuth` 等项目正在兴起，因为身份必须扩展到特定网络或网络段之外。用户想要智能钱包、身份验证，以及动态创建随他们在工作生活和个人生活之间移动的合同的能力。尽管这看起来可能很笨拙，但\
  \ `blockchain` 等技术可能在实现这一功能方面发挥作用。`blockchain` 可能通过投票或众包机制提供处理信任边界的方法，这种机制允许建立信任的多种方式。讽刺的是，向更加个性化的身份验证、身份、访问和授权的动力之所以存在，是因为随着网络的增长、扩展和互连，我们很快将无法在没有现代身份验证的情况下信任网络。\n\
  \n一旦我们无法再信任网络，我们需要动态身份验证密钥、枚举和日志来保护个人及其资源，这在实际上是一层非常个人化且移动的安全毯。如果我们不再信任网络，也意味着我们需要从根本上重新思考诸如\
  \ `SSL (Secure Socket Layer)`、`TLS (Transport Layer Security)` 以及类似的基于网络的安全功能，这些功能以前以某种懒惰的方式实现了身份验证。使加密作为下一级别的身份验证能力发挥作用，需要它的运行方式不再绑定到网络，而是绑定到它被允许共享的数据和身份。\n\
  \n处理这一点的方法是将身份验证绑定到诸如应用级加密 (`ALE`) 之物，这使得应用程序本身决定加密什么、如何加密以及如何保护数据，以便当数据必须通过敌对环境时，身份验证可以动态确定其加密范围。在在该连接的另一端，信任允许你使用现代身份验证方案解密这些信息。当然，所有这些将需要基于开放标准为消费产品添加新的安全功能。驱动力是消费者要求更简单的方法来持有和传输敏感数据，以便他们利用数字能力做更多事情，例如让软件代表他们运行。\n\
  \n\n\n\n考虑所有登录 Facebook、LinkedIn 和 Google 的用户，他们随后使用这些个人资料登录其他应用程序和服务。这是一个以我们以前从未考虑过的方式，扩展了极其脆弱的人类身份识别的例子。当你穿过整个身份空间时，你会发现“信任”是唯一的出路。\n\
  \n### 作为安全验证生态系统的代理人机构\n\n我们不得不转向一种安全验证生态系统，在该生态系统中，经过认证的第三方代理人机构可以断言、识别、验证并扩展信任。这些代理人机构将成为我们所有人工作和生活的互联生态系统的骨干，他们通过安排更高层次的信任，使我们能够利用现在跨越多个环境的应用程序和服务。\n\
  \n随着这种规模的扩大，我们很快将面临与广泛层级信任相关的问题，这些信任将向着我们尚未构想的各种方向延伸。为了实现这一点，我们必须使用开放共识模型来应对相关挑战。\n\
  \n协作正迅速成为今天解决问题的关键组成。科学已经达到了这样一个阶段：个人的专业知识已不足以将研究前沿推向下一个水平。同样，在超连接、智能设备和大数据的世界中解决业务问题需要不同的团队通力合作。这就是为什么我们看到越来越多的\
  \ DevOps 和 DevSecOps 团队推动协作来解决复杂问题。而且我们看到对共享的需求日益增长，这正在推业务模式以及支持它们的身份验证的边界。\n\n\
  然而，一旦开始推动协作，问题就变成了：“你能信任谁？”协作与身份验证是密不可分的。作为扩展团队的一部分解决问题，需要个人、设备和应用程序根据各种因素（如身份和授权凭据，结合群体人数评分，甚至是你的显性目标）加入一个信任环。能够通过一个使用目标的系统进行身份验证，然后找到其他具有相似、相关目标的人，将动态地创建信任环，使我们能够移动得更快。只有那些值得信任的人才能参与协作至关重要的环境。我不希望在准备好测试我的想法之前，就得与目标相反的人打交道。\n\
  \n前进最大的障碍之一是我们已经让身份验证变得相当复杂了。它是身份。它是认证。它是授权。它是 `IdM`（身份管理）和 `IAM`（身份和访问管理）流程。这种碎片化的身份验证思维方式将干扰我们创建一个基于网的系统，该系统可以根据动态需求集打开和锁定信任圈。这将一种与我们目前使用的任何机制都不同的身份验证机制。\n\
  \n我一直在研究那些投资于更高端、更先进安全性的公司，与那些选择更基础、传统的低端保护公司的对比。目前为止的数据非常迷人。投资于先进安全措施的公司不仅通过提高生产力和更有效的协作实现了更高端的收入，而且在他们运营的行业中获得了更具实质性的份额。我相信未来是非常光光前景的。然而，只有通过利用身份验证代理和信任模型等机制，我们才能实现我们正在创造的互联世界的潜力。适应和采纳这些新模型的能力将决定哪些组织和系统不仅能够繁荣，而且能够生存。\n\
  \n## 贡献者简介\n\nShannon Lietz – Intuit DevSecOps 负责人\n\nShannon Lietz 是一位屡获殊荣的创新者，拥有二十多年的经验，致力于先进的安全防御和下一代安全解决方案。作为\
  \ Intuit 的 DevSecOps 负责人，Lietz 负责制定和推动公司的安全工程策略以及用于产品创新的云安全支持。她热衷于在大环境中领导安全转型和变革管理，利用\
  \ Agile 和 Rugged 原则。在加入 Intuit 之前，Lietz 曾任职于多家财富 500 公司，最著名的索尼和 ServiceNow，在这些公司她支持了从事先进安全计划的关键任务团队。她还是一位连续创业者，也是\
  \ DevSecOps、HackerGirl 和 Rugged Software 等领域的狂热博客和传教士。\n\n# 4 补丁\n\n![](img/c04uf001.png)\n\
  \n补丁是对已知问题的修复。补丁是开发者在意识到（或被告知）某个漏洞时发布的微小软件。\n\n补丁是修复这些问题并加固这些暴露的漏洞以防止其被利用的过程。补丁是防御所谓的“已知的未知”（由前国防部长唐纳德·鲁姆斯菲尔德广为人知的术语所描述的）的第一道防线。\n\
  \n尽管网络安全专业人员必须对新的、演变的和新兴威胁（包括“已知的未知”和“未知的未知”）保持警惕，但大多数网络攻击都是黑客利用已知但未打补丁的漏洞的结果。\n\
  \n正如航天器设计师如果忽视物理定律（重力、热力学、加速度、惯性等）如何损害他们的设计及其性能，就注定会失败一样，那些忽视补丁“法则”的人也是如此。不打补丁是自杀性的行为。\n\
  \n`cyberhygiene`（网络卫生）这个词被发明是为了将定期打补丁规范化，使其类似于定期洗澡；这是一种几乎没有人推脱的基本行为。\n\n在绝大多数环境中，打补丁带来的收益远大于痛苦。听医生的话。定期且无情地打补丁。\n\
  \n补丁是安全防御的一个生动例子，它危险地平衡在人类基本弱点的支点上。当开发人员发布软件或安全更新、错误修复或或服务包时，该发布本质上是买一送二的：一个高度特定的警告用户面临风险，同时也提供了缓解该风险的解决方案。接收者随后未能安装补丁——出于对业务连续性的考虑、遗忘，或仅仅认为网络攻击只会发生在别人身上——这一事实特别令人担忧。后果是严重的。\n\
  \n最近记忆中一些最具破坏性的网络攻击，包括 Heartbleed、WannaCry、NotPetya、Equifax 泄露、Spectre 和 Meltdown，都利用了已经发布补丁的漏洞。在其他情况下，即使在攻击已知后也没有安装安全补丁，攻击也加剧了。\n\
  \n当然，在网络或企业层面进行补丁比在个人层面要复杂得多。对于人手短缺、精力耗尽且压力巨大的 IT 团队来说，打补丁是一项西西弗斯任务，需要以极其艰辛的坚持将数千块巨石推上数千座山丘。即使是一个较小的企业组织通常也在不同的系统上运行大量的不同软件程序——有些是当前的，有些是遗留的，有些是购买的，有些是构建的。所有的都会产生漏洞。\n\
  \n与网络安全的许多其他方面一样，打补丁需要艰难的决策和用于引导它的连贯策略。没有这种策略，IT 团队除了打补丁之外很难做其他事情——而且漏洞仍然存在。\n\n\
  补丁的困难揭示了 IT 和安全团队被迫扮演的守门员位置：为失败承担所有责任，却对胜利获得很少赞誉。\n\n\n\n\n\n在全球经济背景下，日常生活依赖于一个比维护和防御它的人类资源要庞得多的数字基础设施。我们在补丁失败方面所学到的教训，揭示了人性弱点所导致后果的一个令人担忧的真相。\n\
  \n驱动人们无法或不愿进行补丁的人性易错性，是更大问题和挑战的征兆。在一个规模和复杂性不断增加的数字驱动的世界里，我们必须面对这些问题。要精通网络安全，我们必须攻克补丁挑战，并开发安全解决方案，以某种方式克服人类忽视补丁这一基本需求的倾向。\n\
  \n## 补丁：一项日益严峻的挑战与所需的纪律\n\n*Chris Richter，CenturyLink 全球安全服务前副总裁*\n\n几乎所有成功的攻击和网络入侵都始于攻破一个漏洞系统，而该系统的补丁或更新已经发布了几个周、几个月，有时甚至是多年。然而，关于补丁最大的误区之一是，认为它是保护组织免受网络攻击的可选性任务。使用昂贵的硬件和软件技术控制来保护网络资源免受病毒和恶意软件的侵害，似乎引起了大量的关注，并占据了安全预算的大部分份额。但根据最近的研究，几乎一半的受损设备通常完全没有恶意软件。这些系统被攻破仅仅是为了建立网络立足点，而它们是因为一个本可以打补丁的漏洞而被利用。理解并处理与漏洞相关的风险至关重要。\n\
  \n在过去的几年里，我们看到围绕缺乏补丁一致性和纪律的问题，出现了一个日益严重的问题。原因之一是寻找安全人才正变得越来越困难。网络安全领域的职位空缺远多于填补岗位的人。负责补丁和设备管理以及跟踪补丁计划的人员很快就会耗尽精力。这是一项枯燥、重复且不怎么有趣的工作，因此很难找到坚持下去的人。此外，对系统进行补丁和更新很难做到，特别是在运行环境中，问题不仅在于让一个潜在的关键设备下线以进行更新，还在于如果该补丁导致了其他更严重的问题，会对业务产生的影响。例如，某些应用程序可能会因为\
  \ IT 部门没有测试应用补丁与该应用程序的兼容性而直接停止运行。但更重要的问题可能是，由于我们的基础设施变化速度快，要维持一个常规补丁计划也具有挑战性。如今的架构设计变化迅速，设备需要打补丁，而补丁可能会对可用性构成风险。\n\
  \n我曾参与过关于补丁挑战的讨论。“如果我们因为没能给设备打补丁而丢失数据会怎样？但是，如果补丁弄坏了系统，导致我们处于几小时或几天的停机状态怎么办？我们会被罚款或失去客户吗？这对我们的品牌、声誉或底线会有什么影响？我们对股东的责任是什么？”\n\
  \n物联网（`IoT`）的出现使这个问题更具挑战性。我最近与一个拥有超过 100,000 个 IP 地址的机构合作，这些地址连接到虚拟和物理设备上，而他们并不知道这些设备的存在。如果你甚至不知道某个设备是否存在，你就无法监控它，也更不知道必须给它打补丁。你还不知道设备上有什么数据、这些数据的价值是多少、设备位于何处，或者它有多旧。所有这些都是黑客可以利用的风险因素。\n\
  \n数字市场的变化加剧了这个问题，要求组织在资源有限、资金更少的情况下，移动得更快、做得更多，特别是在安全领域。所有这些因素共同创造了一场完美的风暴，攻击者借此利用这些弱点。我们已经一次又一次看到。影响广泛的黑客攻击和知名泄露事件充斥着新闻，其中许多直接与糟糕的安全治理和补丁纪律有关。\n\
  \n## 建立安全治理框架\n\n当然，打补丁并不是孤立发生的。它必须是更大安全框架的一部分，该框架包含不同的功能，这些功能与补丁管理协同工作。数据发现和资产发现是任何补丁管理计划的关键组成部分。价值最高的资产需要在其周围构建最严格的安全控制。但在保护这些资产之前，你必须首先确定哪些系统最重要、它们位于何处、存储了什么数据、哪些设备和应用程序连接到它们，以及它们包含的数据类型和年龄，这些信息通常难以确定。但这些信息对于建立一个基于优先级的补丁系统，或者在出现没有可用补丁的零日漏洞时在周围安装其他安全控制措施是至关重要的。\n\
  \n遗憾的是，太多的组织没有稳固的框架。即使他们有框架，也是他们写成文档后将其存档，再也没有再审查过。因此，很少有组织在真正管理其安全框架的执行情况。首席安全官（CSO）往往很难跨越组织了解这些资产在哪里，对其进行分类，然后建立资产估值，以便开始在其周围构建控制措施。但只有在建立框架之后，真正的工作才能开始。\n\
  \n安全治理框架并不复杂。我喜欢并且许多 CSO 赖的一个是 `NIST 网络安全框架`。它用通俗的英语编写，而不是技术术语。这是一个很好的起点，而且是免费的。然而，有了这个框架，你也必须遵循指南和原则，这正是工作所在的地方。而且它必须随着环境的变化而适应。这是一个日益增长的问题，因为有这么多设备和应用程序连接并分布在网络中。加上多个云环境和虚拟设备，问题呈指数级增长。\n\
  \n当然，让补丁比以往任何时候都更重要的因素是，我们现在防御的网络与几年前完全不同。过去，我们可以更容易地保护未打补丁的系统，或者花时间给设备打补丁，因为我们将它们隐藏在外部对手之外。那时，我们不信任边界外的任何东西。但现在边界基本消失了，即使它存在，也是漏洞百出的，你仍然必须假设组织内部的每个系统都以某种方式被破解了，无论你是否对其打了补丁。\n\
  \n我看到的另一个挑战是，我们管理人员和维持遵守安全治理框架（包括补丁等实践）所需纪律的能力正在下降。考虑由于合并或收购而产生的“影子 IT”增长。当不同的组织将网络整合时，它们会继承不同类型的框架，通常还伴随着某个领域松散的安全纪律。这些新网络可能已经感染了恶意软件，或者有自己糟糕的补丁政策。但业务正受到股东的推，要求快速增长收入，因此管理团队最不想做的就是通过实施严谨的安全和纪律来放慢速度。当你的组织认为安全阻碍了收入增长时，很难取得成功。\n\
  \n\n\n\n\n这种常见的误解正是为什么安全框架需要成为整个组织的核心治理文档，并需要获得高层的支持。这样，当你因并购开始扩展网络或整合技术格局时，每个人在收敛和清理安全问题方面都能达成共识，因为你已经将这些费用计算在了交易成本中。\n\
  \n### 自动化与补丁\n\n弥补补丁等关键但繁琐活动差距的方案之一是自动化。自动化将整个整个 IT 领域（包括安全领域）发挥着至关重要的作用。这是我们能够跟上变化速度的唯一途径。但在补丁方面，如前所述，最令人担忧的问题之一是补丁有时会破坏应用程序。我见过安全专业人员为了保持应用程序运行而接受未打丁系统的风险。即使是经验丰富的安全人员也会评估风险，确定网络攻击者利用它的概率，然后将其与由于补丁破坏应用导致应用下线的风险进行平衡。\n\
  \n对于那些补丁破坏应用程序的概率极小或不会产生干扰的系统，你可以也应该实现自动化补丁。但对于那些运行关键应用程序的系统，中断数据访问或破坏应用程序的风险对公司造成的损害比潜在漏洞更大，它们采用自动化的速度将很缓慢，如果启用的话。归根结底，风险是否比下线更糟糕。泄漏的威胁是否比系统完全崩溃更糟糕？这是风险分类过程的一部分。然而，解决这些挑战已超出了当今自动化技术的范围。\n\
  \n我见过补丁导致整个全球网络崩溃。有人被解雇。有人人头落地。这损害了业务和声誉，并且花了很长时间才恢复。但这通常是补丁纪律性差以及在将补丁应用到生产系统之前未能进行测试的结果。安全控制绝不应该减慢业务。（可用性是\
  \ CIA 三要素之一，同机密性和完整性。）\n\n尽管如此，因为担心会导致应用程序崩溃而未能修复系统补丁并不是一个好的理由。测试过程应该在冗余、容错的系统上运行，你可以在投入生产之前测试补丁。这需要将关键应用程序或设备放置在技术人员或自动化可以用于补丁测试的系统上。自动化系统甚至可以检测到故障，并可能考虑解决该问题的方案。如果没有，它可以标记出来由人类来解决。这种做法需要冗余，以便在将补丁应用于生产系统之前对其进行测试。\n\
  \n### 处理无法打补丁的设备\n\n组织越来越多地部署了根本无法补丁的设备。例如，`IoT` 设备已成为许多组织的真实挑战。如果打补丁不是一个选项，那么这些设备必须被隔离。你必须将它们放置在离散网络上，与持有关键数据的网络和虚拟局域网（`VLANs`）逻辑隔离。IT/运营技术（`OT`）融合面临着类似的挑战。部署在完全隔离网络上的工业控制系统（`ICS`）和监控控制数据采集（`SCADA`）设备现在由于通过\
  \ IT 网络而暴露在漏洞之中。\n\n但你必须从内部或外部合格的风险评估专家开始进行可靠的风险评估，他们可以遍历数据发现与分类、网络架构、应用程序位置、云的使用、访问控制等。每个组织都应该评估的清单很长。然后你需要建立一个持续的治理计划（作为安全框架的一部分），用于执行安全检查并重新检查安全态势和配置。\n\
  \n一旦建立了这些，你就会理解哪些需要打补丁，哪些是不需要担心打补丁的，以及对于无法打补丁的系统，哪些应用程序和系统应该隔离在单独的网络上。\n\n## 关于贡献者\n\
  \nChris Richter – CenturyLink 全球安全服务前副总裁\n\nChris Richter 是一位独立的网络安全顾问，专门帮助组织构建和调整安全框架以应对数字化转型计划。Richter\
  \ 编写了多 IT 安全文章，是 *Security 2020* 的作者，并经常在有关外包安全服务的会议上演讲。最近，Richter 担任 CenturyLink\
  \ 的全球安全服务副总裁，负责公司的全球托管和专业安全服务业务。在此之前，他担任 Level 3 安全服务高级副总裁以及 Savvis（CenturyLink\
  \ 公司）的安全服务副总裁。\n\nRichter 在 IT 领域拥有 30 多年的经验，曾在多家技术产品和服务组织中担任托管安全、IT 咨询和销售的多个领导职位。通过帮助组织将其风险管理计划和安全控制重新架构，转向外包、虚拟化和共享的基础设施服务，Richter\
  \ 帮助许多 IT 组织在降低网络安全成本的同时提升了整体防御态势。\n\n## 征服或被征服\n\nRenee Tarun, Fortinet*\n\n正如不断扩张的宇宙一样，网络安全格局也在不断增长和变化。随着对更加互联世界的追求、新型先进技术的出现以及物联网（`IoT`），越来越多的设备正以前所未有的速度连接在线。这种增长为对手创造了一个更大的竞技场，因为它扩大了他们访问潜在攻击向量的途径，包括应用程序和系统设计中的各种安全漏洞或弱点。无论你的组织是学术机构、私营公司还是政府实体，没有人能对这些漏洞产生免疫。\n\
  \n零日漏洞（或未知的漏洞）在媒体和威胁研究人员中引起了关注。然而，对于攻击者来说，开发零日攻击是耗资且耗时的。现实是，大多数攻击并不需要攻击者付出巨大的创造力或努力。今天大多数成功的攻击利用了软件和系统中未打补丁的已知漏洞，这让攻击者占据了上风。\n\
  \n我们需要改变策略，让好人占据优势。我们需要演进补丁范式，让组织快速、大规模地为系统打补丁减轻负担。这将需要供应商和组织克服许多技术和文化挑战，但这是可能的。\n\
  \n对于许多组织来说，打补丁的挑战在于补丁太多而时间太少。每年发现的漏洞数量以及相关的补丁数以数千计，并不断上升。这为 IT 人员造成了巨大的困境，因为打补丁只是他们为了维持网络和系统运行所负责的众多活动中的一个方面。\n\
  \n为什么这些漏洞最初会存在？答案很简单：只要循环中还有人类编写计算机必须遵循的软件程序，代码中就永远存在漏洞的风险。\n\n### IT 从开发者开始\n\n\
  \n\n\n\n开发者糟糕的编码实践会导致系统和应用程序出现安全漏洞。此外，当今大多数开发者都依赖开源和第三方库来协助其开发工作。这些库往往会引入漏洞，而开发者可能没有意识到他们所使用的库有软件更新，导致整个应用程序中存在大量未修补的漏洞。\n\
  \n为了减少产品中漏洞的数量，供应商和开发者需要在其开发生命周期内采取主动的方法。这首先需要对开发者进行安全编码实践的培训，以及他们如何将这些实践应用于其开发工作中。此外，市场上有很多自动化漏洞扫描器，可以在应用程序发布前扫描其漏洞。此外，质量保证测试应该包含除标准功能审查之外的\
  \ `security-review`（安全审查）。\n\n## 补丁对运营的影响\n\n组织面临的另一个补丁困境是：“如果没坏，就不要修它”。对原本运行正常的系统进行补丁可能会导致若干潜在的运营影响，这使得组织不愿打补丁。供应商可以通过接下来概述的多种方式提供帮助。\n\
  \n### 无需重启或重新启动\n\n部署大多数补丁需要停止并重启应用程序，甚至需要完全重启系统，才能完全安装补丁。考虑到当今业务对互联互通和“始终在线”的需求，由于担心收入损失、客户服务能力以及组织整体生产力的下降，让关键系统离线任何时间对组织来说都变得越来越具有挑战性。供应商需要设计新的补丁部署方法，允许补丁在无需重启和重启系统及应用程序的情况下生效。\n\
  \n### 将补丁与新功能分离\n\n供应商发布的大多数补丁不仅包含漏洞的修复，还包含新的或增强的系统或应用程序功能。某些组织不想安装补丁，是因为新功能不受欢迎，或者与其他系统或流程不兼容。某些补丁很大，会给组织的网络带来性能压力。供应商必须改变这种“全有全无”的补丁应用方法，并寻找分段补丁的方法，允许组织根据需要选择他们想要应用的部分（例如，安全修复与新功能进行区分）。\n\
  \n### 提供回滚补丁的能力\n\n尽管对补丁进行了所有的测试，但几乎无法对现有的每一个设备和软件配置进行测试。因此，旨在修复系统的补丁不可避免地最终会导致其崩溃。例如，工业控制系统通常使用遗留系统，这些系统不仅老旧而且昂贵，因此配备备用机来测试补丁并不总是可行的，这使得一旦出现问题，打补丁就具有风险。类似于数据库中的\
  \ `rollback`（回滚）功能允许你撤销操作并将数据库恢复到之前的状态，需要一种简单的机制，在应用程序或系统产生意外的负面影响时撤销补丁。\n\n## 组织的优先事项\n\
  \n单凭供应商无法解决整个补丁困境。当供应商发布补丁时，组织必须采取积极行动尽自己的职责，确保这些补丁得到及时应用，因为对于对手利用未修补系统来说，时间总是在流逝的。打补丁必须是组织的首要任务。\n\
  \n组织内的每一个人都需要理解补丁在维护系统稳定和防止入侵方面所起的关键作用。打补丁确实会占用其他重要项目的时间和资源，这些项目的投资回报可能更直接且更容易代码量化，但组织必须考虑替代方案。对手通过这些未修补的系统可能造成的损害，以及修复这些损害的成本，可以轻易超过所投入的资源成本。\n\
  \n## 不要让你的门处于未锁状态\n\n在系统中存在未修补的漏洞就像为试图闯入你家的小偷留了一扇没上锁的门。如果你知道小偷会试图闯入你的家，你就不会把门留在未锁状态。同样，打补丁是防止对手利用漏洞入侵系统的必要手段。打补丁还是不打补丁的决定取决于风险管理。这可能是\
  \ IT 高管和系统管理员必须做出的最艰难的决定之一。一方面，打补丁可能非常有挑战；但另一方面，如果选择不打补丁，对组织将是有害的。在当今环境下，对抗破坏和入侵需要包含良好基础防护的多层防御。打补丁是良好基础防护的重要元素。这是一个持续的过程，但忽视打补丁会产生系统防御中最薄弱的环节。通过纪律性的关注和合理的规划，打补丁并不困难。如果你想保护你的组织，就让打补丁成为优先事项——你的收入、品牌和声誉都取决于此。\n\
  \n关于 贡献者\n\nRenee Tarun – Fortinet 信息安全副总裁\n\nRenee Tarun 是 Fortinet 信息安全的副总裁。她负责安全合规与治理、企业安全以及产品安全。\n\
  \n在此之前，她担任美国国家安全局（NSA）网络安全主管的助理以及 NSA 网络任务组主管，在该职位上，她通过获取、投资和监督资源；定义和整合任务能力，以及塑造机构战略和国家级政策，推动\
  \ NSA 执行其网络安全和网络相关任务。\n\n\n\n\n\n作为美国国家安全局（NSA）信息保障局首席运营官的助理，她的重点领域包括国家安全局和国防部（DoD）网络安全及相关学科的战略、规划、整合和关系管理。\n\
  \nTarun 曾在一个由国防部和国土安全保障部（DHS）组成的联合组织中担任高级网络战略师，负责协调美国政府范围内网络问题的运营规划、政策和战略的联合工作。\n\
  \n她曾担任国防部信息与身份保障助理副部长下“数据与网络保护”组合以及“运营韧性”组合的负责人。之前的任职包括计算机科学家、信息技术专家以及各种政策、计划和资源类工作。\n\
  \nTarun 担任乔治·梅森大学 Volgenau 工程学院议事会成员，通过解决劳动力开发需求、行业预期和就业趋势，在学院与专业社区之间建立协同作用效应。\n\
  \n# 5 培训\n\n![](img/c05uf001.png)\n\n我们需要更多的网络安全人员。自动化和人工智能的兴起引发了一种奇特而讽刺的论调：“数字技术正在消除工作”，这一论调在许多文章、评论文章和博客中被反复回响。\n\
  \n但有充分证据表明，人工智能和自动化的创新正在为人类的洞察力和专业知识创造更大的价值和机会，而不是减少。在我看来，技术正在创造工作，而不是消除工作。许多这些职位仍然空缺。\n\
  \n在没有任何一个领域比网络安全领域更能体现这一点——那里的职位远多于填补岗位的人。网络安全领域的失业率稳定在 0%，没有迹象表明将会发生变化——事实上，恰恰相反。\n\
  \n每年产生一百万个新的网络安全工作。预计未来几年这一数字将增加到 500 万或 600 万。最近，网络安全招聘公告增长了 74%，其中一半职位未被招聘。\n\n\
  随着网络安全人才溢价的，成本也随之增加。强大的组织能够为员工支付更高的工资，而较小的组织则因价格过高被排除——这给它们的现有团队带来了更大的压力，并扩大了攻击面。\n\
  \n最初构建和维护现在被称为互联网的小型信息平台的人是博士级的计算机科学家和工程师。人们很少考虑到各个层次对专业知识和技能组合的需求的演变和升级。\n\n当我们向一个极其复杂的数字未来飞速冲刺时，我们需要一种模式，使网络安全不再完全依赖少数专家的“魔术”。\n\
  \n中世纪可以从中吸取教训，当时出现了行会模式——工匠（男工女女）被称为学徒、帮工和大师——以满足当时技术对人才的需求。这需要铁匠、锁匠、织工工、建筑师等许多其他人。行会模式最早记录于罗马帝国，它的有效性足以在罗马帝国灭落后生存生存，并在今天仍以某些形式存在。大量的学徒从较少的帮工那里学习，而这些帮工最终会加入人数更少的大师行列。而且，这种模型远非一个在历史垃圾堆中勉强维持的、或仅供从事体力劳动的人使用的模型，它在一些最重要、最复杂的环境中被有力且高效地使用，包括关键基础设施中的运营技术人员以及全球高精网络安全组织中。\n\
  \n我们需要创建一个网络安全劳动力行会，建立并维持一个具有不同大师等级的劳动力，随着时间的推移而成长，并培训人才专注于与其专业水平相匹配的任务。这种行会模式可以同时为没有计算机科学学位的人士创造通往高薪工作的社会阶梯，并增加这一长期面临劳动力缺口领域网络安全专家的人数和专业水平。\n\
  \n网络安全大师不会被赋予执行网络安全中重要但相对简单的日常任务——那是一种机会成本。学徒不会被期望对付外国情报机构——这不是一场公平的战斗。学徒将有机会学习并不断晋升，目标是最终成为大师。这样一个网络安全劳动力行会将创造一个持久的劳动力队伍，每个层次的专业知识都适合自己的任务。\n\
  \n通过一个在网络安全劳动力行会内获得技能并提升到下一水平的大规模劳动力，我们可以克服这个严重人手不足的行业挑战。我们可以扭转效率低下和效果不佳不断升级的趋势。我们可以阻止灾难。\n\
  \n## 通过持续培训的环境填补技能缺口\n\n*Chris McDaniels, CT Cubed, Inc.*\n\n当今组织面临的最重大挑战之一是网络安全技能缺口。合格专业人士太少，无法填充所有可用职位，而且还没有合适的流程来创造这些职位。为了应对这一挑战，技术安全培训是任何业务战略的关键组成部分，特别是对于托管安全服务提供商（MSSP）来说，他们需要一支庞大、多元且熟练的安全人员。但现实是，在任何非生产或模拟环境中，培训都很困难。坦率地说，我没有见过多少模拟环境能提供足够的刺激并辅以真实的问题集，从而提供超出初级或入门级职位所需的高质量培训。\n\
  \n相反，我看到对培训效果很好的方法是从一套你的分析师和工程师能够理解的基础知识、词汇和术语开始的。这需要一些书本知识，以便每个人都说同一种语言，并熟悉相同的基础和奠基性概念。但真正的培训价值来自于将分析师或工程师直接投入生产环境，让他们在比他们经验丰富且达到更高熟练水平的人的指导下去解决实际问题。让人们体验挑战、提出解决方案，并拥有能够告诉他们“好的，你思维过程中到目前为止都是很好的。这里是你需要做的”的导师是非常重要的。这种导师制（在他们犯下灾难性错误之前）是最好的培训类型。\n\
  \n### 使技能以适应新环境\n\n一旦在组织内部建立了有效且持续的培训氛围，应对新问题和挑战就会变得更容易。例如，当你有一组新的云问题时，云本身可能是新的，但底层技术都是相同的。你只是不再需要处理问题的物理部分了。许多技能是可以迁移的。对于一个精明的\
  \ Linux 系统管理员来说，管理一台位于你分公司通信间里的 Linux 服务器，与管理一台位于亚马逊云服务（`AWS`）某处的服务器在本质上没有区别。\n\n\
  挑战在于理解适应云环境的解决方案所具有额外能力或局限性。你需要关注这些差异，而拥有一个灵活的导师流程意味着每个人都可以通过利用团队中云专家的技能来跟上进度。这是我认为大多数组织都忽视的培训策略。\n\
  \n\n\n\n五年后我们所有人都会谈论的最重要的安全技术，在今天甚至闻未闻过。由于格局变化如此快，你必须给人们留出时间，让他们在这些技术实施期间出去琢磨它们，然后回来成为该领域的专家专家，并在他们遇到该技术时指导他人。\n\
  \n## 寻找合适的人选\n\n在使用这种模型时，选择合适的人比他们可能拥有的教育背景或认证更重要。你想要寻找具有特定心态的人，他们充满好奇心并想要钻研新技术。我们积极招募并留住这些人，并确保他们在工作日期间有时间出去获取新知识，并期望他们带回给更广泛的分析师和工程师的知识能让所有人都变得更好。\n\
  \n我们积极将这种方法应用于我们的学徒计划——我们招募对 IT 或网络安全经验完全零要求的人员。到目前为止，我见过最成功的实习生之一实际上是一个 Lyft 司机，他曾送过一位\
  \ MSSP（托管安全服务提供商）老板的车。在与司机聊天时，老板问：“你在家里做什么？” 司机回答说他一直在研究 `Python`。这引起了老板的好奇心，他问司机使用的是哪个版本。那个\
  \ Lyft 司机震惊了，心想：“我车后座的这家伙是谁？这里正在发生什么？”\n\n他们聊了一会儿，司机解释说他从亚特兰大搬到菲尼克斯是为了进入网络安全领域，因为他听说那里有一些机会，但他不知道具体如何开始。老板向司机索要简历，司机在当天晚些将简历转给了我。我给那个家伙打了电话，他有着我认为正确的态度。几周后，他进入学徒计划中的一个安全运营中心（SOC），开始积累专业知识。\n\
  \n我告诉他：“所有人都会看着你并说：‘这行不通。你没有计算机科学学位。你没有多年的经验。’但我希望你花一两周时间只是去跟进一些同事，看看你接触到的所有不同工具集。最后，你会选择其中一个或两个，我们将让你深入研究它们，并获得你能得到的所有专业知识。”\n\
  \n这不是一个学术环境。我们的优势在于，我们管理着北美一些最关键网络的生产环境网络。尽管我们没有让这个新入者执行任何可能影响客户环境的任务，但他获得的接触是尽可能真实的。他观察那些管理真实网络的专家，观察他们如何处理真实用户、真实任务以及他们必须执行的业务运营。\n\
  \n两周结束后，他告诉我他想深入研究某个特定的解决方案。随后在接下来的一个月里，他阅读了他能找到的每一份文献，在我们为其预留的环境中运行该解决方案，以便他可以使用更高级的功能。在\
  \ 30 天内，他变得非常博学。他还没有达到我们三级人员的水平，但他所在班次的的许多同事如果对该解决方案有疑问，就会开始向他请教。他获得了真正的小众专业知识，而不仅仅是书本知识。他实际上可以以合逻辑的方式使用该系统。在他精通了该工具集后，他又转向了下一个。\n\
  \n## 挑战高级分析师\n\n对于我们更资深的分析师来说，挑战在于让他们保持投入。我非常相信自主性的力量，因此我们每周都留出时间让他们通过开发新技术的技能来投资自己。我们还鼓励他们尽可能地自动化和编排。我告诉我们的团队，第一个能够完全通过自动化让自己失业的人，我仍然会付工资。那个人可以做任何他们想做的事。目前还没有人接受我的提议，但他们正在尝试。\n\
  \n与此同时，他们被允许研究新概念，以便理解他们在工程和分析世界可能面临的所有不同问题。即使一个项目在没有成功的情况下结束了（例如在投入时间后未能得出解决方案），我们也不认为那是失败。我们认为，投资学习没有解决问题的方法会让我们发现可以解决问题的方法近了一步。\n\
  \n## 建立广泛的技能\n\n我们采用这种模型的原因之一是，客户使用许多不同的技术栈，以至于没有一个人能精通所有技术。为了应对这一挑战，我们指定了客户领域专家（SME）和特定的工具集专家。我们还有许多不同的部门都为网络安全做出了贡献，例如云端安全团队；连接和端点专家；以及网络入侵检测系统（IDS）、入侵防护系统（IPS）和下一代防火墙专家。如果人们在所在的领域已经尽了所能，或者只是在寻找改变，我们鼓励他们在公司内部流动。\n\
  \nMSSP 做得另一件非常好的事情是运行混合模式，他们将实体分析师派往客户现场，让他们在环境中走并与该客户团队整合。他们的大多数人开始于拉斯维加斯、菲尼克斯或波特兰的运营中心，但当旧金山、夏洛特或洛杉矶出现机会时，他们会举手去当现场工程师。有些人会那样做一两年，然后他们带着全新的视角和技能回到这里。\n\
  \n## 为什么学徒模型有效\n\n这是一种与传统的学术模型截然不同的方法。让人们逃避网络安全领域的原因之一是，他们进入计算机科学或网络安全课程后，面对的第一件事就是：“欢迎来到网络安全\
  \ 101。今天我们来讨论十六进制加减法。’我不理解这背后的逻辑。我认为这等同于想学开车，但在你的第一天，教练就说：‘我们要拆解这台发动机，看看活塞是如何工作的。’\n\
  \n我们正在做的是使用一种追溯数百年的经典培训模式，它遵循从学徒到技师再到大师的路径。在那种模式下，在驾驶学校的第一天，我会说：“这里是方向盘，这里是油门，这里是刹车。这是如何从空挡换到挡。明天我们只需要直行。”这就是我们在学徒计划中采取的心态。\n\
  \n## 激励导师\n\n最初，我遭许多高级分析师的反对，他们认为：“这些新人进来后只会成为负担。我必须花所有时间照顾他们。”我的回答是：“列出一个你每天必须做\
  \ 10 次或每周要做 10 次的重复性任务。识别出一个不能真正最好地发挥你才华的任务。”\n\n他们识别出某些需要人们手动执行我们无法自动化的任务。大多数时候，这是在追踪误报，因为百次中就有一次不是误报，所以我们不能自动清除它们。\n\
  \n\n\n\n于是我说：“如果我们训练其中一个学徒来专门做这件事会怎么样？” 他们的反应是：“我一点也不讨厌那样。”当然，在最初的 10 次或 1,000 次里，他们是在完全受监督的状态下执行任务的。然后，我们制定一个成功标准，将其视为一项可培训的任务，并在他们展现出熟练程度时给予他们通过，以便他们可以在无监督的状态下完成。一旦你让他们掌握了这项任务，你就可以转向下一个任务。在非常微小的技术栈子集上获得实践经验，是任何培训计划的关键组成部分。你无法在教室环境中复制这一点。\n\
  \n## 定义层级和阶段\n\n这种方法需要大量的准备工作。培训不能随心行事，因为你可能会招到一个拥有许多细微技能但な对大问题没有连贯理解的人。因此，我们定义了专家的标准，并将其分解为可用的层级和阶段。初级阶段分为三个级别，我们记录了我们期望初级一级人员能够完成的工作，然后是初级二级、初级三级依此类推。他们会获得一份应该能够做的事情列表，他们可以做到，也可以做不到。这非常简单明了。然后，我们对中级和高级也做同样的事情。\n\
  \n在高级层级，我们期望个人能够处理几乎任何问题。他们应该能够在独自一人、不受监督的情况下，管理周围的一群人，并处理我们作为一个组织经历过的任何问题。即使是对于我们尚未遇到的问题，我们也期望他们能够进行故障排除并找到解决方案。一旦我们开始进入团队领导和经理职位，当然，事情开始变得有些模糊。要给某人一份关于领导力或管理能力的任务列表是很困难的。但你必须通过初级层级一路做上来。\n\
  \n所有这些中可能最重要的教训是，为了使任何培训或内部管理过程有效，，你必须在开始时定义你的问题，建立清晰的发展路径，并在过程的每一步分配导师。这正是许多机构失败的地方。他们继承了一个存在了很久的系统，这个系统非常松散，而且对于完成某项工作需要什么或者一旦你达到了这些预期后会发生什么，没有任何详尽的记录。许多人似乎没有纪律来整合这样的东西，因此他们饱受团队人手不足和工作过度的苦恼。而这一切都是因为他们没有建立起流程来解决自己的安全技能差距问题。\n\
  \n## 贡献者简介\n\nChris McDaniels – CT Cubed, Inc. 执行官\n\nChris McDaniels 是网络安全咨询公司\
  \ CT Cubed, Inc. 的执行官。他曾担任一家全国托管安全服务提供商的首席安全官，McDaniels 还是美国空军退役士兵，拥有超过 16 年防御企业网络的网络安全运营经验。除了著名的美国空军武器学校网络战术武器教官课程的优秀毕业生和讲师外，McDaniels\
  \ 还拥有计算机科学学士学位和工商硕士学位。他在领导网络安全运营方面拥有丰富经验，包括指导美国空军计算机应急响应小组的入侵防御与响应小组。在创立 CT Cubed,\
  \ Inc. 之前，McDaniels 担任美国空军红队的对抗性网络整合主管和培训主管，通过模拟现有的和新兴的网络空间威胁，对美国空军、联合部队和联盟战斗员进行指导和培训。\n\
  \n## 员工培训是网络安全的关键\n\n*Mo Katibeh, At&T*\n\n问问任何业务领导者什么让他们彻夜难眠，如果网络安全不是他们的首要回答之一，我会感到非常惊讶。这并不新鲜；多年来一直如此。但我认为许多人担心的是一种能够绕过他们所有精细安全规划的复杂攻击。许多人担心的是一种能够绕过他们所有精细安全规划并使其运营陷入停滞的复杂攻击，不是通过最新的、最复杂的攻击。\n\
  \n人们意识到了诈骗和钓鱼，但他们仍然点击恶意链接和感染文件（来自他们不认识的人）或来自极具说服力的来自朋友或同事的邮件。那么为什么公司不尽所全力地防止这种情况？答案通常分为三类。\n\
  \n第一种担心是这些努力成本太高。但针对员工的单次成功攻击成本很容易超过任何你可能实施的培训计划或技术。第二种担心是培训花费太多精力。然而，我认为你的数据和运营安全值得付出任何精力。至于第三种担心，即这些努力没有作用，我完全不同赞同。这是一个真实的案例。\n\
  \nAT&T 在一家精品金融服务公司遭受钓鱼事件后与其合作过。这并不是只是某个无意识的用户点击了猫咪视频。它是经过精心策划和执行的。从表面上看，这封恶意邮件看起来是真的。它来自公司的一位高管，使用了该人的姓名和电子邮件地址。邮件充满了细节，使其听起来很合法。所以，当发送者在信息结束处请求海外账户转账\
  \ 100,000 美元时，没有人怀疑过它。直到两周后真正的客户询问那笔未付款项。\n\n那个网络窃贼利用伪装的电子邮件地址和从员工社交媒体帐户中获取的数据创建了一个极具说服力的请求。结果，一位经验丰富的投资经理在无意中成为了一场六位数抢劫的帮凶（《AT&T\
  \ 网络 报告，第一卷》）。然而，关于如何识别钓鱼或针对性钓鱼攻击（事实证明这就是这种攻击）以及如何应对异常请求（例如向离岸账户转账 100,000 美元）的定期培训，可能会节省大家的时间、资金和沮丧。\n\
  \n## 无处不在\n\n为了使安全有效，它必须是全面的。它需要覆盖组织的所有区域。安全对我们 AT&T 来说是一个巨大的关注，因为我们是一个持续的目标。每天、每小时、每分钟，我们都面临着破坏我们业务、窃取信息或对我们的网络造成破坏的持续尝试。为什么？谁知道呢？这并不重要！无论是那些想要成名的黑客、被雇佣窃取商业机密的人，还是仅仅想看世界毁灭的人，我们的关注点保持不变，因为公司的健康取决于此。\n\
  \n保护我们多样化的运营要求我们创建多层安全机制。我们使用先进的连接技术让我们的运营变得更好更高效，因为企业、消费者和员工信任我们保护他们的数据。我们还与公司合作，帮助他们制定改进自身安全态的战略计划，并帮助他们执行这些计划。我们帮助他们在网络安全事件的后果中恢复。\n\
  \n组织面临的威胁是多样的，我们致力于帮助他们跟上步伐。在我们自己的组织内部，我们通过员工培训和意识计划来实现这一点。\n\n\n\n\n\n我们可能已经进入了一个这样的世界：遭受网络安全事件的企业数量已经多于未遭受事件的企业数量。（2015\
  \ 年，约有 62%的组织承认曾遭受过数据入侵。《AT&T 网络安全洞察报告》第 3 卷。）\n\n# 问题的规模\n\n如果我们是一个目标，那就意味着我们的员工也是目标。这对于每个组织都是如此，而这正是对话需要改变和演变的地方。事实是，任何组织任何网络安全风险缓解策略的关键部分都取决于员工。多项研究报告，绝大多数数据泄露都与员工行为有关。事实上，91%的网络攻击和随之产生的数据泄露始于一封钓鱼邮件。（参见\
  \ [`cofense.com/enterprise-phishing-susceptibility-report`](https://cofense.com/enterprise-phishing-susceptibility-report)）。根据《AT&T\
  \ 网络安全洞察报告》第 1 卷，约 78%的员工不遵守安全策略，且有 25%到 30%的员工仍然会点击可疑链接（《AT&T 网络安全洞察报告》第 4 卷）。\n\
  \n然而，电子邮件钓鱼只是组织和员工需要关注的问题冰山一角。“影子 IT”（Shadow IT）是一个神秘的术语，指的是你组织中的人们可能每天都在做。当员工想要完成工作，但他们并不觉得自己拥有所有可用工具来这样做时，他们会做什么？他们会变得主动并下载一个。这就是影子\
  \ IT。\n\n可能是另一个网络浏览器，因为公司批准的浏览器无法与特定的网站或应用程序兼容。可能是一个文件压缩工具或照片编辑器。或者，他们需要一种传输超过电子邮件附件大小限制的大文件的方法。这并不重要。\n\
  \n重要的是，IT 部门对员工正在使用这些工具和在线服务无所不知。结果是，补丁可能不是用户的首要考虑，导致漏洞随之渗透。大多数组织可能并不知道这种现象发生的规模有多大。根据《AT&T\
  \ 网络安全洞察报告》第 1 卷，约 81%的业务部门线受访者承认在过去使用过影子 IT。在 2013 年至 2015 年之间，在影子 IT 变得现在这样流行之前，其财务影响估计为\
  \ 7.4 亿美元（《AT&T 网络安全洞察报告》第 4 卷）。\n\n社交媒体的使用是另一个充斥钓鱼威胁的渠道。它也可以被有意或无意地用于将公司秘密广播给更广泛的外部受众。同样，员工流动性的增加已成为日益增长的漏洞。在任何地方和任何时间工作的能力对于生产力和效率至关重要，但它可能引入的风险也是巨大的。\n\
  \n这两个趋势的一部分都涉及允许员工使用自己的设备处理业务功能。虽然在员工拥有的单一设备上混合个人和业务活动变得越来越普遍，但这样做会放弃控制权并引入新的风险。例如，使用移动设备存储未加密数据可能会导致数百万美元的监管罚款。更糟糕的是，近\
  \ 40%的用户承认在过去的 12 个月里他们的移动设备偶尔或频繁地遭到破解（《AT&T 网络安全洞察报告》第 4 卷）。\n\n# 教育员工以降低风险\n\n\
  我的方法是推广“我们同舟共济”的现实，因为事实确实如此。网络犯罪社区有一支军队，所以我们需要一支军队。当技巧和策略扩展到工作场所之外时也会有所帮助。我们通过关注一种我们描述为“边学边参与”的方法来实现这一切。我们通过定期发布有趣且相关的话题来保持员工参与，例如检测可疑链接、保留敏感文档以及练习安全的社交媒体行为，这些他们可以在工作中也可以家里应用。\n\
  \n对我们来说，让员工参与意味着在视频和图像中加入具有吸引力的视觉效果。我们发现，加入游戏元素可以更好地让员工参与到娱乐且具操作性的目标中。我们还制作了海报、举办了现场活动，甚至设计了一个平易近人的卡通吉祥，它体现了我们希望通过该计划实现的所有目标。\n\
  \n结果说明了一切。当 AT&T 启动该计划时，链接钓鱼是我们最常见的问题，大多数组织也是如此。根据 AT&T 首席安全官 Tony Tortorici 的说法，在我们的计划启动后的两年里，我们看到钓鱼事件显著减少。\n\
  \n但对我们实有效的方法可能并不是适用于每个组织的正确处方。并不是所有人都需要优先考虑相同的威胁，也不是所有人都需要解决相同的问题。公司文化也起着巨大的作用。语调、沟通的频率和内容都取决于你组织内部什么是“正常”的。\n\
  \n\n\n\n\n# 威胁格局\n\n威胁格局的持续演变特性使得建立基础性元素至关重要。这让你能够易地评估、重新评估并激活你的战略。\n\n虽然计划应该是你的组织所独有的，但我们从那些能够在构建成功的意识计划方面取得实质进展的客户那里，看到并听到了一些共同点。以下是一些常用的实施方法：\n\
  \n## 从顶层开始\n\n虽然要让培训和意识活动发挥作用需要全员参与，但员工对安全的认同是从高层开始的。我们发现，当首席执行官、董事会成员和高高管都以身作则时，产生的影响最大。他们需要公开拥这些政策，以员工能够理解和产生共鸣的方式进行讨论，并做到行合一。实现这一点的关键部分是帮助你的执行团队理解网络安全意识的真实价值，并确保他们愿意为有效的培训和意识计划投入资金和时间。\n\
  \n## 分享安全责任\n\n国际标准化组织（`ISO`）作为一个独立的标准组织，发布了信息安全管理体系（`ISMSs`）建议，称为 `ISO 27001`。该建议的一部分要求组织建立一个涵盖组织各部门（包括领导层）成员的指导小组。`ISMS`\
  \ 文档是一个很好的起点。美国国立标准技术研究院（`NIST`）也提供了最佳实践指南。\n\n## 培训你的用户\n\n教导人们如何避免钓鱼攻击以及如何安全使用社交媒体等主题的安全意识课程是一个很好的起点。然而，为了让这类培训行之成效，它必须兼具吸引力和相关性。你还应该考虑通过意识活动来加强培训，这些活动可以包括定期的海报、电子邮件和其他电子信息，甚至是需要快速确认的短视频信息片。\n\
  \n## 自我教育并传授给他人\n\n虽然这次讨论集中在企业及其为员工准备应对网络安全威胁和挑战的能力上，但实际上对话的范围要大得多。这些主题和行为可以也应该延伸到职场之外。寻求为了个人利益而窃取你信息的恶意行为者通常针对的是软目标，无论是大型企业、小微企业还是你本人。在几乎每种，人类都是任何安全策略中最薄弱的一环。\n\
  \n承担起责任，教育自己如何最好避免成为受害者，然后将这些信息——以及热情——分享给他人。这种方法也可以在个人生活中为你省去很多麻烦，我确信许多身份盗用受害者都能证明这一点。例如，我妻子刚刚发短信问我：“嘿，我刚收到了这条信息。我应该点击它吗？”我告诉她：“不要。别。。永远点。”\n\
  \n群体免疫是许多曾困扰人类的可怕疾病不再存在的原因。大家共同努力仍然是预防许多困扰现代社会问题的最佳方式。然而，要让我们的网络——以及数字生活——免受网络攻击的影响，需要的不仅仅是简单的疫苗。它需要创新，以及对新技术的接受和采用。但最重要的是，这意味着学习。学习你自己在哪里很脆弱，做出简单的行为改变，然后将这些见解分享给他。\n\
  \n## 关于贡献者\n\nMo Katibeh – `At&T` 首席营销官\n\nMo Katibeh 的背景包括他最近担任 `AT&T` 高级解决方案高级总裁，在那里他负责网络安全、数字、云、`Wi-Fi`\
  \ 和现场服务解决方案的业务方案。\n\n\n\n\n单凭网络安全证书是不够的。认证需要与经验挂钩。这种联系在其他专业领域已经是一项常见做法。一个例子是项目管理专业人士（PMP®）认证。除了通过考试外，PMP®\
  \ 认证还需要具备最低的教育水平以及在领导和指导项目方面的最低年限经验。网络安全认证也应该遵循类似的路径。最近，少数网络安全认证已开始包含经验要求，这是向正确方向迈的一步。\n\
  \n总的来说，我们必须将注意力从目前网络安全或厂商安全认证那种“背诵并重复”的信条转移出来，转而关注全人的培养。认证和经验帮助我们识别潜在的技能组合，但网络安全专业人员的整体思维往往是决定其成功的关键因素。理想情况下，具有网络安全思维的人应该具有强烈的好奇心，将问题视为挑战，并结合逻辑和直觉来识别风险并开发解决方案以中和威胁。在优秀导师的帮助下培养和发展这些特质至关重要。\n\
  \n## 导师的重要性\n\n组织不应低估在其安全培训环境中建立成功的导师关系的重要性。对于培训者来说，培训也是一种心态。成为导师意味着愿意分享所学知识和经验的收益。指导需要投入大量的时间和精力，但富有成效的导师关系对双方都是积极且有回报的。一个成功的导师计划应该导致文化转变，即传承知识，并重视终身学习和持续的职业发展。\n\
  \n## 利用 IT 经验\n\n在未来几年中，我们面临着劳动力市场的紧张和经验丰富的网络安全专业的短缺。组织发现，安全职位的空缺时间比公司其他类型的职位长得多。解决这种短缺的方法之一是考虑培训已经在\
  \ IT 邻领域具有经验的候选人。如果他们已经了解路由基础知识，教他们如何排查防火墙故障要容易得多。\n\n这种跨培训策略不仅适用于初级职位。在 IT 架构和工程中开发的许多技能已经包含了安全基础知识。例如，开放组架构框架（TOGAF）允许组织设计、评估和构建成功的架构。一个精通\
  \ `TOGAF` 原则的天才 IT 架构师或工程师应该能够成功转型为安全架构师。一种培训心态有助于从个人和组织层面促进这些转型。\n\n组织必须重视导师制，并将网络安全作为培训的重点，而个人必须利用他们天生的好奇心并实践，除非请求是不道德或非法的，否则予以满足。\n\
  \n反复拒绝安全请求可能会导致部门之间陷入“我们与他们”的对立局面，最终降低组织的生产力。安全培训的一个重要部分应该是与整个业务部门以及我们的业务伙伴建立协作工作关系。我们需要理解业务伙伴的实际需求是什么，以便我们能够尽我们所能的方法确保他们的安全。\n\
  \n解释与安全控制相关的“为什么”非常重要。为什么某个特定的安全控制对公司、利益相关者、个人的角色或功能很重要？潜在的后果是什么？还有其他解决方案吗？通过有效的沟通，网络安全专业人员可以从被视为障碍转变为被视为业务成功的伙伴。\n\
  \n## 培养全人\n\n网络安全培训不仅仅是一个证书或学位。它是一种心态，专注于培养全人，最大化他们的天赋优势，并授权他们以创新的方式参与并团队做出贡献。这关乎利用导师的力量，培养在技术快速演进过程中努力与时俱新的终身学习者。这关于有效的沟通，能够与业务中的其他部门合作，将风险降低到可接受的水平。总的来说，网络安全培训关乎你的团队成员、他们带来的特质，以及对培养全人的关注。\n\
  \n## 关于贡献者\n\nDave Rankin – *信息安全副总裁* — Verisign\n\n\n\n\n作为信息安全副总裁，Dave Rankin\
  \ 负责 Verisign 信息安全计划的所有方面工作，以及信息治理、风险和合规性（GRC）。此外，他还在专注于关键基础设施和安全的重点论坛上代表 Verisign。Rankin\
  \ 拥有超过 25 年跨越多个技术领域的经验，在商业、防务、军事、金融、咨询和培训等多个行业展现了独特的业务与 IT 专家知识结合。\n\n在加入 Verisign\
  \ 之前，Rankin 在雷神公司（Raytheon）工作了九年，曾担任两家雷神业务公司的首席信息安全官（CISO）以及雷神英国联合公司的首席信息官（CIO）。他曾在安永（Ernst\
  \ & Young）、计算机协会（Computer Associates）和房美美（Fannie Mae）担任领导职务。在过去的工作中，他设计并实施了巴哈国际证券交易所的\
  \ IT 安全基础设施，实现了该国历史上首次远程交易。\n\nRankin 是美国空军退役军人，国防部首个网络信息战中队的创始成员，专注于保护美国及其中东前线地点的\
  \ IT 安全态势。\n\n# 第 3 节：基础策略：不让我们失望的可靠策略\n\n![](img/p03uf001.png)\n\n身份验证棘手的解决的缺陷和固有挑战持续为网络犯罪提供了巨大的机会。在我们能够彻底解决身份验证问题——即有效地对人到机器、软件到硬件、进程到操作系统等进行身份验证之前——我们将永远在通过其他关键策略和机制来弥补这一漏洞。\n\
  \n与此同时，一切并非不可挽救。加密学、高保真访问控制以及敏捷的宏观和微分段可以提供大量的网络安全。这些策略中的每一种都处于持续、快速的演进和迭代过程中，以应对日益复杂的风险。这三种策略已被证明即使面对最高明的攻击，也具有令人印象深刻的防御能力。加密基于难以解决的数学原理，通常用于帮助过滤试图虚假身份验证的人。访问控制限制人员只能访问其工作所需的资产。分段基于在防火墙中实现的构建良好的计算机科学，用于为资产提供额外安全，因为还没有人成功发明出不可逾越的防御。\n\
  \n加密学、访问控制和分段之间存在相互关系，可以补偿不理想的身份验证。这三者都是访问控制的形式。此外，加密学超越了显而易见的用途（加密数据），还保护了访问控制和分段内部使用的机制。\n\
  \n这些基础策略中的每一个都能从简单的基础知识构建到具有高度战术复杂性的解决方案。它们共同成为了对抗网络犯罪极其有效的工具。但像所有防御一样，它们会随着时间的推移而削弱，特别是在面对快速、持续的创新时。加强它们的第一步是理解它们为何至关重要。\n\
  \n# 6：加密学\n\n![](img/c06uf001.png)\n\n加密学利用最基础的数学原理来保护数据。加密学惊人地强大、近乎神秘且持久——其首次使用记录可以追溯到古希腊。\n\
  \n加密学是保护分段的保护层，并在允许或拒绝访问方面起着关键作用。它在保持信息私密、检测信息变化（完整性）以及建立对个人或过程身份的信任（身份验证）方面也发挥着作用。\n\
  \n加密学被许多人视为奥技术是编码信息的强大方式。今天地球上所有的计算机都必须花费比宇宙年龄还要长的时间，才能破解一个经过正确加密的 `Triple-DES`\
  \ 消息。\n\n但随着量子计算离成为运营现实越来越近，加密学重要应用的保护能力将会失去。如果加密学失败了，分段和访问控制也将随之失败。\n\n正确实施的强加密是安全社区可用的少数“银弹”灵药之一。\n\
  \n加密学基于某些数学属性，这些属性使得计算一个值变得很容易，但实际上很难计算其逆过程。加密工作原理的类比在学习过质数的中学数学课上很容易找到。将两个 9 位的质数相乘在纸笔上是轻而易举的，但要弄清楚哪两个未知的质数相乘得到一个\
  \ 18 位的数字是非常困难的。尽管创建该乘积轻而易举，但反转这一过程极其困难。\n\n尽管今天数据保护中使用的两种主要加密形式——对称加密和非对称加密之间存在根本差异，但它们都利用了一种数学技术，这种技术在正确实施时会产生极其强大的东西。\n\
  \n对称加密允许发送者和接收者使用单个共享秘密密钥私密地相互传递信息，将数据扰乱成对任何没有该密钥的其他人来说没有意义的形式。非对称加密通常用于为对称加密建立秘密密钥（并用于许多其他重要目的），它采用不同的技术：许多人使用“公钥”来加密数据，但只有单独的“私钥”能够解密（即使用两个不同的密钥）。非对称加密的一个良好类比是组合锁：任何人都可以关闭锁（上锁），但只有一个人知道如何解锁它。\n\
  \n在正确实施和初始化后，两种形式的加密对于试图通过循环解密密文的所有可能的数字组合来破解它们的暴力攻击都具有令人印象深刻的韧性。\n\n这种韧性有多强？\n\n\
  如果黑客获得一台足够先进的计算机，能够以每秒一个密钥的速度对 128 位密钥发起暴力攻击，那么大约需要 149 万亿才能猜出破解对称加密所需的所有可能的密钥。宇宙本身才有\
  \ 137 亿年的历史。\n\n然而，创新的加速速度和力量可能会侵蚀数学真理的保护力量基础。我们曾经认为不可动摇的东西现在必须重新审视。随着量子计算指日可待——某些预测将在\
  \ 20 年或更早出现——`Shor's algorithm` 和 `Grover's algorithm` 等公式的部署可能会使非对称加密的安全性降低。\n\n\
  作为一种科学、实践和学科，网络安全只有少数“银弹”。目前，加密学是罕见的例外，是一种简单而强大的方式，可以为防御洪流般的网络攻击提供实质性的保护。尽管加密学目前仍然是网络安全最强大的工具之一，但我们必须为明天将面临的风险做好准备。\n\
  \n## 加密学：网络安全的支柱\n\nTaher Elgamal, Salesforce*\n\n\n\n\n不可否认，量子计算——据人推测，在 20 年内至少会被国家机构和数字企业高层开始初步采用——可能会破坏当今的一些加密标准。尽管认为像如今备受青觎的数据（如信用卡号和带有到期日的财务数据）在量子计算实现时早已过时，这似乎令人宽慰，但某些信息仍然具有相关，包括社会安全码、抵押贷款和医疗信息、贸易秘密和专利信息。这意味着，如今的加密数据如果存储约\
  \ 20 年，可能会被未来的量子计算机破解并泄露。\n\n任何一种情况意味着，我们应该为量子计算机存在的未来做好计划。\n\n但是，我们不应该花费大量的精力去争论某种潜在的迫临毁灭，而应该关注现在正在发生的实际密码学挑战。解决这些挑战将让我们比现在安全得多，并将指导并催化我们越发需要的“敏捷密码学”（agile\
  \ cryptography）的发展。\n\n遗憾的是，关注当前问题并不涉及某种“登月计划”——那种大胆的、带有高度品牌色彩的外部任务，无论成功与都能带来声誉资产。相反，它要求我们——既作为一个行业，也作为数字信息和连接的全球用户——对我们如何保护和消费数据进行内部反思。毕竟，天才是\
  \ 1% 的灵感加上 99% 的汗水。如果我们对密码学严严的数学和科学理论投射某种神秘主义，以逃避加深理解其所需的严谨工作，那是错误的。\n\n### 付出巨大代价获得远超价值的回报\n\
  \n回溯密码学作为网络安全基本方面被采纳的起点是有帮助的——这一过程最初由于由于开发加密算法缺乏资金激励而受到阻碍，但由于遵循标准组织认可并被时代最大公司采用的做法变得非常容易，因此变得更加高效。\n\
  \n与许多网络安全基础（它们似乎在跟上数据和威胁的飞猛发展方面一直挣扎）不同，自现代互联网诞生以来，加密一直是数据保护的核心。在强烈的创新浪潮中，它依然保持了惊人的韧性。\n\
  \n但密码学也是一门高度专业且极具个人色彩的学科，需要深厚的知识才能正确实施和部署。由于它是一门如此专业且复杂的数学科学，这种深层知识掌握在较小的密码学家群体手中。\n\
  \n那个问题——巨大的收益结合极少数的专家——意味着密码学往往由那些在该领域经验较少的人部署得并不完美，但看起来仍然运行尚正常。这造成了严重的漏洞，而那些认为密码学具有魔法般不可破译性的人（无论它是如何部署或实施的）则完全忽视了这些漏洞。\n\
  \n因此，许多首席信息安全官（CISO）在无意中且不知情的情况下实施了加密，但未能利用密码学的基本优势。这在组织层面制造了风险。为了减缓这种无意中鲁莽的实施，理解密码学的优势及其现代历史同样至关重要。\n\
  \n从网络安全的诞生之初，密码学就是最早嵌入安全套接层（`SSL`）的工具之一，现在被称为 `TLS`。它是对一个仍然驱动着安全的真理所给出的持久久逸的解决方案：互联网的开放性也是一种弱点，没有加密，就没有手段创建机密性、完整性和身份验证。密码学的这一核心优势当然至关重要——而且它收了许多关注——但实施正是许多人失败的地方。\n\
  \n在 `GDPR` 时代，加密的实施才是关键。虽然机密性很重要，但确保与正确的双方进行身份验证同样重要。用于完整性和身份验证的加密算法——称为`非对称加密算法`——受量子计算影响的风险最大。\n\
  \n### 在坚实的基础上进行构建\n\n密码学的迷之处在于，从理论上讲，它提供了安全的三个关键方面：机密性、完整性和身份验证。作为一种数学理论，密码学极其强大。但正如扫一眼最臭名昭著的泄露事件所证明的，密码学的实施极其难以正确。当实施错误时，它会创建一个不受保护的数据纸牌屋，并以惊人的速度和规模倒塌。\n\
  \nHeartbleed 是 2014 年对 `OpenSSL` 密码学库一个安全漏洞的大规模泄露，这可能是最著名的例子。它既不是病毒（尽管它曾被错误地识别），也不是密码学本身的失败，它是一个编程错误，该错误利用了密码学的实施方式使其形同虚设。\n\
  \n很难想象比这更有戏剧性的吸取教训的方式，但尽管如此，一些组织——甚至是大型组织——仍然没有侧信道攻击和编程错误对其密码学构成的威胁。\n\n\n\n更具挑战性的事实是，加密编程是一项稀缺的技能，而行业对专家的需求日益增长——这个行业本身就面临着人才匮乏的困扰。考虑到加密的必要性和益处，即使是最资深的工程师，也经常错误地实现加密系统，这种情况正变得越来越常见。这反映并不是工程师的能力问题，但没有人希望世界上最顶尖的心脏医生来给自己做脑手术。就像大多数重要的事情一样，要做到正确需要专业知识和对细节的关注；加密的力量正证明了正确实现中极其细微的精确性。\n\
  \n令人震惊的是，即使是最微小或简单的人为错误也会让加密系统变得如此脆弱——从粗心地地将明文密钥留在某处文件系统中，到疏忽了对缓冲区的错误实现。即使是不了解加密算法之间存在巨大差异也可能产生巨大的影响；即使是最好的加密算法，如\
  \ `RSA` 或 `Diffie-Hellman`，也存在一组永远不应使用的弱初始化设置。但如果组织选择的加密库没有彻底检查这些内容，就可能使用其中某个错误的密钥或配置，导致系统处于不安全状态。\n\
  \n漏洞也存在于为加密本身提供支持的函数中。随机数生成通常是最受关注的，因为使用弱随机初始化的强加密会暴露密钥中的模式，从而削弱加密的强度。有一整套源自密码分析的方案论来实现这种随机化，因为如果没有它，密钥本身就可能是弱的。\n\
  \n这些因素共同作用，导致了这样局面：非加密专家的人员执行了不当的实现，营造了加密生效的假象，却掩盖了可以被大规模利用的侧信道漏洞。将其视为形成我们当前加密危机的“完美风暴”吧——并作为对如果不加纠正，未来到来的风暴将多么严峻的性一角。\n\
  \n这就是为什么最复杂的加密组织的科学家在构建加密系统时要能够防止单点故障。他们竭尽全力，但仍然为最坏的情况做打算。\n\n### 现在就敏捷！\n\n但通过建立安全机制，允许我们敏捷地升级到下一个安全加密标准，我们不仅可以准备好应对出现的问题，还能准备迎接明天的挑战。\n\
  \n必须理解，这种纠正必须在行业层面发生，但也必须在组织层面，即在首席信息安全官（CISO）及其团队之间进行。他们将处于更有利的位置来激发并实施这种纠正，并将驱动敏捷加密的迭代。尽管现在的挑战非常重要，但随着标准和算法的变化，其重要性只会增加。而且，没错，尚待量子计算正在塑造着我们接受加密敏捷性作为一种新数字现实的节奏。\n\
  \n以下是 CISO 和首席技术官（CTO）做出改变的方法。\n\n第一步——无论从顺序还是重要性来说——每个组织都必须指派一名成员专门理解公司加密足迹的基本结构。尽管，除了实力最强大的公司外，任何公司都不可能拥有专门的加密专家团队，但他们都这样做，这说明了加密的重要性。尽管如此，每家企业仍然需要一个了解部署了哪个版本的\
  \ `OpenSSL` 的员工，并且能够就新设备的加密和安全性向供应商提出正确的问题。这个角色也为外部顾问提供了一个宝贵的联系人，他们可以成为高效且有效的资源，以更好地理解和评估系统加密的强度。如果没有这个角色，下一步将变得困难得多，甚至是不可能的。而这本身就已经极具挑战性了。\n\
  \n组织必须对现有的系统进行审计，以确定他们实际上在何时使用了加密。找到所有这些系统并汇总所使用的不同算法和库是极其耗力且费心的工作。对于大多数公司来说，加密无处不在——在硬件和软件中，在当前和过旧的版本中，有些功能正常，有些无效——而且几乎没有关于部署了什么以及何时部署的记录。这产生的问题会让\
  \ CISO 头大。\n\n使用了哪些库和算法？密钥存储在哪里？必须保留多久？如何确保安全？如何访问以升级和更新？这些都是具有切实业务影响和相关风险的严重问题，然而许多公司没有方法回答这些问题。到目前为止，还没有流程可以自动化这种审计——尽管这将是一个非常有价值且利润丰厚的贡献。（准备就绪；预备；出发，创新者们。）\n\
  \n一旦组织有了专门的专业人员审计其加密情况，他们在看到揭示的结果时可能必须硬起头皮。这通常包括旧的、损坏的算法；留下安全漏洞的配置；软件中的缺陷；以及物联网\
  \ (`IoT`) 设备日益蔓延，这些设备具有某种程度的加密，但从未更改过密码。理解并准备应对这些情况造成的风险和意外状况，对于维护网络安全至关重要——是在现在，而不是将来。\n\
  \n### 抗量子性\n\n对于处理危机的人来说，有一句广为人知的格言：准备应对危机的最佳时间是在危机发生之前。没有什么比让问题滋生增长更能加剧损害。\n\n\n\
  \n\n对于密码学而言，对量子计算机可用性的推测过度关注让许多人认为在未来几年内他们有时间处理这些问题。但这是一个本应该已经开始的过程。当机构开始着手时，它所揭示的复杂性的深度和强度可能会带来一个令人不快且似乎无止境的惊喜。如果这导致某些机构推迟了对其加密方案的评估，他们应该提醒自己：如果在加密功能正常的情况下目前都已具有挑战性，那么想象一下在没有加密的情况下尝试必要的下一步将会是种什么。\n\
  \n换句话之，现在构建的加密敏捷性（cryptographic agility）可以同时解决量子前和后量子计算机的风险。\n\n虽然有许多更先进的用例实现非常罕见——包括可以改进身份验证的零知识证明、可以增强存储和使用密钥安全性的多方计算，以及各种同态加密或功能加密技术——但对于最常用加密方案的用户来说，他们面临的挑战是一个需要立即且广泛关注的问题。当然，任何单一机构都无法独立解决这个问题——但每个机构都必须准备好成为解决方案的一部分。那些不采取行动的人可能在事后太晚的时候才会意识到，量子计算的到来并不是密码学危机的开始。它也不会是结束。\n\
  \n## 贡献者\n\nTaher Elgamal – Salesforce 首席技术官\n\nTaher Elgamal 是网络安全领域的行业资。他是 `Elgamal\
  \ Digital Signature` 方案的发明，该方案是 `Digital Signature Algorithm (DSA)` 的基础。在担任 `Netscape\
  \ Communications` 首席科学家期间，他是 `SSL` 的推动者。Elgamal 曾获得 2009 年 `RSA` 大会的终成就奖。\n\nElgamal\
  \ 担任 `Salesforce` 的安全首席技术官。在 1995 年加入 `Netscape` 之前，他是 `Securify` 的创始人兼首席执行官，并在\
  \ 1998 年担任 `RSA Security Inc.` 的工程总监。Elgamal 曾担任并正担任许多公共和私立董事会的成员。他还曾在并正担任许多安全和软件公司的顾问委员会。\n\
  \nElgamal 拥有斯坦福大学的电气工程 `MS` 和 `PhD` 学位，以及开罗大学的电气工程 `BS` 学位。\n\n## 密码学：好、坏与未来\n\n\
  *Dan Boneh, 斯坦福*\n\n密码学是保护计算机系统中信息的重要工具。它用于保护在计算机网络中传输的数据以及存储在长期存储中的数据。它用于访问控制和数据隐私，更广泛地说，它对谁可以读取和写入什么数据提供了某些控制。密码学对于商业至关重要——没有它，企业无法与其他企业以及其客户进行在线交易，甚至企业之间也无法交易。没有密码学，计算机系统的实用性将远比现在低得多。\n\
  \n尽管密码学取得了巨大成功，但在实践中很难正确部署。一个处理敏感信息的系统可能是用户友好且可靠的。然而，如果加密做得不正确，系统可能完全容易受到攻击。在漏洞被利用之前，没有人知道该漏洞的存在。正如我们所看到的，看似微小的错误也可能导致完全的破解。即使是泄露少量信息的错误也可能被攻击者利用并导致彻底攻破。\n\
  \n在这里我们探索为什么密码学如此难以做对以及解决这一问题的方法。我们将观察一些常见的错误以及密码学在实践中经常失败的方式。通常来说，失败分为以下三类：\n\n\
  - **设计中的错误**，导致部署的加密系统或协议的安全性没有设计者预期的那么高。例如，我们将查看 Web 加密协议设计中的某些导致攻击的问题。\n- **实现中的错误**，即方案设计良好，但实现偏离了设计，这种偏离既不影响正常运行，又让系统暴露在攻击风险之下。一个很好的例子是加密库中一个广为人知的名为“goto\
  \ error”的漏洞，它让某些系统暴露在攻击之下。\n- **侧信道攻击**，即攻击者通过测量侧信信息来破坏系统，例如系统响应请求的时间或计算响应结果时消耗的电量。。这些信息通常足以发起攻击。\n\
  \n在接下来的三个章节中，我们将逐一查看这些类别并讨论密码学界解决这些问题的方法。\n\n### 设计加密系统和协议\n\n在过去的几十年里，已经很清楚了，我们不能通过遵循一套简单的准则来设计加密协议，并希望最终设计是安全的。相反，密码学领域已经从一门艺术变成了一门严谨的科学，每一个提议的加密系统和协议都必须伴随着严谨的安全论证。\n\
  \n通过例子来说说明是最好的。考虑公钥加密。在这里，用户 `Alice` 生成一对密钥，一个称为公钥，另一个称为私钥。她将私钥留给自己，并将公钥公开。任何获得\
  \ `Alice` 公钥的人都可以通过运行加密算法来发送加密消息，该算法以公钥和消息为输入并输出 `ciphertext`。`ciphertext` 然后发送给\
  \ `Alice`，她可以使用私钥对其进行解密。特别是，`Alice` 运行解密算法，以她的私钥和 `ciphertext` 为输入并输出 `decrypted\
  \ message`（解密消息）。`decryption algorithm` 还可能输出一个特殊的“拒绝”符号，以表示收到的 `ciphertext` 格式错误。这三组算法组合——密钥生成、加密和解密——被称为公钥加密算法。\n\
  \n在我们构建公钥加密并论证它是安全的之前，我们需要定义什么是安全的加密。事实证明这比预期的要困难得多，并花费了多年时间，直到一种被广泛接受的名为`选择密文安全性`（chosen\
  \ ciphertext security）的定义出现。我们在这里给出完整的定义，但只需说明：如果攻击者即使要求 `Alice` 解密除挑战密文 `ct` 以外的任何选择密文，无法获得关于解密\
  \ `ct` 的任何新信息，那么该公钥加密就是选择密文安全的。\n\n现在我们知道了要在尝试构建什么，下一个问题是如何构建选择密文安全的公钥加密。多年来，已经设计了许多此类方案并部署在现实系统中。这些方案的一个重要特性是，它们伴随着一个定理，该证明证明了事实：如果存在一个高效的选择密文攻击者破解了方案，那么也存在一个高效算法可以解决某个困难的计算问题，例如大整数分解或计算离散对数。因此，如果我们愿意接受没有高效算法可以解决该困难问题，那么该方案就不存在选择密文攻击。这类定理被称为方案的安全性证明。如果我们能够无条件地证明选择密文安全性——即不需要假设某个问题是困难的——那就好了，但目前这超出了我们的能力范围。\n\
  \n\n\n\n通常情况下，加密设计的工作流程如下：第一步：定义一个安全模型，描述我们正试图防御的攻击者。第二步：提出一个具体的构造。第三步：在假设某些特定计算假设的情况下，证明该方案在给定的安全模型是安全的。通常这些步骤需要反复迭代，以确保模型是充分的、构造是实用的，并且定理是可以被证明的。\n\
  \n多年来，我们了解到这三个步骤对于一个健全的加密设计是必不可少的。遗憾的是，正如我们在下一节中看到的，这些步骤仅仅是开始，其本身不足以确保安全。\n\n###\
  \ Bleichenbacher 攻击\n为了结束本节，让我们来看一个优雅攻击的示例，它展示了微小的信息泄露如何完全破坏一个加密协议。该攻击适用于一种广泛使用的公钥加密标准，称为\
  \ `RSA-PKCS1` 模式 2。该标准规定了密钥生成、加密和解密的工作原理。解密分为若干步。在第一步中，解密器使用其私钥对给定的密文应用名为 `RSA inversion`（RSA\
  \ 取逆）的过程。接下来，它检查结果数据是否以字符“02”开头，如果不是，解密器输出“reject”（拒绝）。如果是，解密器会再执行几个简单的步骤并输出结果消息。\n\
  \n1998 年，Daniel Bleichenbacher 展示了这种广泛使用的标准并不是选择密文安全的，并提出了一种实际的攻击。为了了解这种攻击是如何工作的，假设攻击者拦截了一个用\
  \ Alice 公钥加密的密文 `ct`。攻击者想要解密这个密文，但他没有 Alice 的私钥。事实证明，攻击者可以很容易创建一个新的密文 `ct'`，其中 `ct'`\
  \ 的 `RSA inversion` 是 `ct` 的 `RSA inversion` 的两倍。攻击者现在可以将这个新密文 `ct'` 发给 Alice 并观察她的响应。如果\
  \ Alice 返回一条信息密文格式错误的消息，攻击者就得知 `ct'` 的 `RSA inversion` 不以字符“02”开头。如果她返回任何其他错误信息，攻击者就得知\
  \ `ct'` 的 `RSA inversion` 确实以“02”开头。\n\n这有什么用？这种微小的信息泄露看似微不足道，但它可以被用于完全解密密文 `ct`。为了做到这一点，攻击者创建了一个密文序列，每个密文都与\
  \ `ct` 相关，但其 `RSA inversion` 是 `ct` 的 `RSA inversion` 的某个已知倍数。他将这些密文每一个发送给 Alice\
  \ 进行解密并观察她的响应。在约 400 万次查询后，攻击者获取了 `ct` 的完整解密结果。四百万查询似乎是一个很大的数字，但如果 Alice 是一个 Web\
  \ 服务器，那么四百万次查询可以在几分钟内处理完毕，正如实践中所证明的那样。这是一个看似无关的信息泄露如何完全破坏系统的精彩例子。\n\n有很多方法可以解决这种漏洞。推荐的方法是转向已被证明是选择密文安全的加密方案。如今，需要公钥加密的系统使用\
  \ `ElGamal` 公钥加密方案的变体，该变体在标准计算假设下是选择密文安全的。\n\n### 实现加密\n\n正如上一节讨论的，加密安全的建模和证明是必要的第一步，但对于确保安全来说还远远不够。即使加密系统设计得很好，仍然可能出现实现漏洞。以下是几个例子：\n\
  \n### 弱的随机源\n加密学很大程度上取决于本地生成的随机性。这个问题要困难得多，尽管得益于嵌入式硬件引入了新的熵源，该领域也取得了进展。问题在于在许多低端设备上，密钥是不安全的。最近的研究显示，此类设备往往会生成相关的密钥。由于熵池非常小，任何人都可以从公钥中恢复私钥。防御这一问题的唯一方法是确保设备在需要时拥有足够的熵。幸运的是，许多现代处理器包含了可以按需提供熵的硬件生成器。\n\
  \n### 缺失的检查\n为了防御来自潜在来源的数据，加密系统通常包含许多必须执行的检查。例如，在解密密文或验证数字签名时，如果数据未能通过检查（如上一节讨论的检查“02”），则拒绝该数据。一个相当常见的错误是某些此类检查被丢弃或实现不当。例子包括：`goto\
  \ error` 漏洞（由于该漏洞导致证书检查被意外跳过）、`RSA-PKCS1` 签名方案的攻击（跳过了关键步骤），以及验证证书链的攻击（未实现重要步骤）。在所有这些情况下，系统运行正常，但完全脆弱。\n\
  \n### 故障攻击\n假设一个实现整数乘法的软件库有一个隐藏 Bug：该库对所有输入都能计算正确的乘积，唯独对某一组数字会得到错误的乘积。这种 Bug 很难通过测试发现，因为冲突的输入在测试期间可能永远不会遇到。尽管如此，这种\
  \ Bug 可能会导致密钥的完全暴露。考虑一个持有秘密密钥的设备。若干研究显示，攻击者可以向设备发送恶意输入来触发该 Bug。结果是设备计算了错误的结果，这使得攻击者能够提取秘密密钥。\n\
  \n### 糟糕的优化\n开发者喜欢编写优化的代码，这理所应当。然而，优化加密代码是非常危险的，因为优化可能会导致漏洞。一个著名的案例是 `ROCA 攻击`，它是\
  \ `RSA-PKCS1` 密钥生成代码中的一个毁灭性漏洞，该漏洞是针对密钥生成算法进行优化的直接结果。它让密钥生成更快了，但生成的密钥是不安全的：仅凭公钥就可以计算出私钥。\n\
  \n\n\n\n\n即使加密规范是完善的且实现没有 Bug，系统仍然可能因为一种被称为**侧信道攻击**的巧妙攻击类型而变得不安全。侧信道是指运行系统在执行加密算法时泄露的信息。一些侧信道攻击示例包括：\n\
  \n*   `Timing Attacks`（计时攻击）。测量系统运行加密算法所需的时间。\n*   `Power Attacks`（功率攻击）。测量系统执行加密算法时使用的功率。\n\
  *   `E/M Attacks`（电磁攻击）。测量处理器执行加密算法时产生的电磁辐射。\n*   `Log Analysis`（日志分析）。检查写入日志文件的错误信息。\n\
  \n这些攻击非常有效。例如，在某些情况下，计时攻击可以提取服务器的密钥，即使测量并不十分精确。同样，通过测量系统的功耗，攻击者有时可以直接从功耗图中读取密钥的比特位。对测量信息进行更微妙的利用被称为\
  \ `differential power analysis`（差分功率分析），即使在测量噪声很大的情况下也可以用于提取密钥比特位。\n\n防御侧信道攻击非常困难。许多加密库尝试通过确保每个操作耗费固定时间来防御计时攻击。防御功率和电磁攻击则更加困难。许多防御措施要么因为额外的硬件需求导致设备更昂贵，要么因为软件复杂性增加而导致系统变慢。\n\
  \n可以可以说，理解侧信道攻击的完整威力并设计出成本效益的防御措施，仍然是一个非常活跃的研究领域。\n\n## 高级加密学\n\n到目前为止，我们主要关注加密的核心：数据机密性、数据完整性和用户身份认证。但加密还可以做更多。最后这一节简要讨论了更高级的能力，其中某些看起来像魔法一样。有些已经准备就绪并正在部署，而另一些则尚在未来。\n\
  \n`Zero-Knowledge Proofs`（零知识证明）。让一方 Alice 证明某个事实是真实的，而不泄露关于该事实的任何其他。任何人都可以验证该证明并被信服。作为一个简单的例子，假设\
  \ Alice 用 Bob 的公钥加密了一个零到五之间的数字。令 `ct` 为生成的密文。她想向 Claire 证明 `ct` 确实是零到五之间数字的加密，但不告诉\
  \ Claire 这个数字是多少。她可以通过提供给 Claire 一个确认这一事实的零知识证明来实现。Claire 可以验证该证明并被信服，而无需了解关于 `ct`\
  \ 解密的任何信息，除了它是一个零到五之间的数字。加密学中最令人惊讶的结果之一是，Alice 能向 Claire 证明的任何事实，她也可以以零知识向 Claire\
  \ 证明。这一结果对数据隐私具有深远影响；Alice 可以说服某些数据满足某些属性，而不泄露关于数据的任何其他信息。\n\n`Multiparty Computation`（多方计算）。减少了对信任方的的需求。一个简单的例子是密封竞标拍卖。通常竞标者私密地将投票提交给受信的第三方拍卖师，由其宣布胜利者。但竞标者如何信任拍卖师会保持他们的报价保密并诚实地宣布胜利者呢？多方计算是一种技术，可以将任何可以使用受信第三方解决的问题转换为参与者之间的交互协议，从而消除受信第三方。在协议结束时，参与者知道了最终结果，但关于他们的初始输入不会泄露其他信息。特别是，他们可以作为参与者之间的交互协议运行密封竞标。宣布胜利者，但关于报价的任何信息都不会被披露。\n\
  \n`Functional Encryption`（函数加密）。展示了解密并不是一个全有全无的命题。可以给某人提供一个“功能性”私钥，该密钥可以揭示明文的某些信息而不泄露其他。例如，考虑一个过滤垃圾邮件的服务。如果给\
  \ Bob 的邮件是用 Bob 的公钥加密的，那么除非 Bob 提供秘密解密密钥，否则该服务无法工作。问题在于，服务随后可以明文读取整封邮件。Bob 可以改为给服务提供一个功能性私钥，用于计算“这是否为垃圾邮件”谓词并输出是或否。垃圾过滤器可以使用这个功能性私钥测试解密后的邮件是否为垃圾邮件，而无需了解关于邮件内容的任何其他信息。尽管函数加密有一些非凡的应用，但我们还没有一种足够高效以供实际使用的通用方案。这仍然是一个活跃的研究领域。\n\
  \n`Post-Quantum Cryptography`（后量子加密）。确保加密在未来多年内继续保持强效。量子计算机利用量子物理定律来解决某些被认为经典计算机无法攻克的问题。其中一个问题就是破解现有的公钥方案。这对于加密数据的安全具有重大影响；今天使用公钥加密方案（如\
  \ ElGamal 加密）加密的数据，一旦足够大的量子计算机建成将被解密。我们不知道这种量子计算机何时可用，或者是否会出现，但有些人预计几十年后就会准备就绪。这意味着今天加密的数据在那时可能会暴露，这让处理高度敏感长期数据的组织感到担忧。为了应对这一风险，我们可以更新公钥加密算法，使其即使攻击者配备了大型量子计算机，它们仍然保持安全。据我们所知，目前有若干抵抗此类攻击的已知技术，我们预计它们将在几年内由美国国家标准与技术研究院\
  \ (`NIST`) 标准化。届时，关注长期机密性的组织可以使用经典安全加密和后量子安全加密对数据进行双加密。因此，量子计算机只是短期风险。一旦后量子加密被广泛使用，它们将不再构成风险。加密将会生存。\n\
  \n## 结论\n\n我们鼓励部署加密的公司开发足够的内部专业知识，以正确设计和验证他们部署的方案。有许多资源可以学习更多关于现实世界的加密。书籍包括 Jonathan\
  \ Katz 和 Yehuda Lindell 写的 *Introduction to Modern Cryptography* (Chapman and Hall,\
  \ 2014)，以及 Dan Boneh 和 Victor Shoup 写的 *A Graduate Course in Applied Cryptography*\
  \ (Stanford, 2017)。\n\n虽然加密是一个重要的工具，但记住它只是计算机安全这个更广泛领域的一个方面是很重要的。完全可能，一个产品正确地实现了其加密，但由于软件漏洞或与加密无关的设计缺陷，导致整个系统是完全不安全的。计算机安全问题复杂得多，只有通过对其策略和解决方案采取与加密至关重要的同样的精确度，才能解决，但这是本书中其他章节的话题。\n\
  \n## 关于贡献者\n\nDan Boneh – 斯坦福大学计算机科学系\n\n\n丹·波恩（Dan Boneh）是斯坦福大学的计算机科学教授，在那里担任应用密码学小组负责人并在计算机安全实验室担任主任。波恩的研究重点是密码学在计算机安全中的应用。他的工作包括具有新属性的密码系统、网络安全、区块链密码学以及密码分析。他在该领域发表了超过\
  \ 150 篇论文，并曾是 2014 年 ACM 奖、2013 年哥德尔奖、RSA 数学奖以及六项最佳论文奖的获得者。2016 年，他当选为美国工程院院士。\n\
  \n# 7 访问控制\n\n![](img/c07uf001.png)\n\n作为下文介绍的有效分的并行与补充，访问控制能够根据数据集的价值、重要性以及泄露后的风险，有效地保护特定的数据集。访问控制在我们的文化历史中根深蒂固；拥有食物或工具等物品的人希望通过使用门、柜子、钥匙、锁、链条等许多其他机制来限制他人对其物品的访问。访问控制迅速扩展到地理边界，以及——可能更甚——由共同意识形态、神学、身份和信仰定义的边界。广义的访问控制在当今头条新闻中体现在控制边界、移民和公民权的机制上。\n\
  \n网络安全的业务在于授予或拒绝人员获取资产的权限。代理有时代表人员——软件、进程、硬件——但这些每项都是为了满足人的需求。资产可以是数据——0 和 1——也可以是计算——操控\
  \ 0 和 1 的力量。访问控制提供了一种手段，确保人员、进程和技术只接触他们本应该接触的资产。\n\n在一个完美认证的世界里，访问控制仅仅是一个已知、经过批准且验证的人员通过不可逾越的守卫访问资产的机制。问题在于，认证是互联网失败的基础之一。这意味着我们无法验证某个人是“已知且经过批准的”。更糟糕的是，很难找到一个“不可逾越的守卫”。\n\
  \n此外，访问控制的核心是一种务实的悲观认知：访问控制是有缺陷的。你会被攻破的。然而，健全的策略并不赞同宿命论。有效的访问控制让对手实现其阴险目的变得尽可能困难。\n\
  \n在科学方法中，你非常注重符合学科的规则和细节。在网络安全中也是如此。正确地执行访问控制——保持严谨并关注策略和细节——等同于正确执行实验室测试。如果没有对细节的稳健关注，再周密的策略也无法成功。\n\
  \n但一种新策略不需要取代之前所有的策略。虽然许多人以“零和创新”的缺陷理解来看待安全，即每项进展都取代之前的成果，但访问控制与边界保护的概念直接相关。\n\n\
  对于今天保护数字边界的组织来说，网络保护也带来了一系列新问题：我们如何定义在一个边界无法定义的网络中包含访问的需求？这些定义是如何传达和执行的？这种执行过程何时会产生多于保护的漏洞？\n\
  \n访问控制并不回答这些问题，但它确实提供了一个回答这些问题的过程。如何回答这些直接反映了业务用户和决策者内部的对齐情况，也是公司数据安全整体效能的有力指标。这些就是网络安全科学方法的细节——必要的严谨性。\n\
  \n访问控制是物品保护和国家边界保护的战略安全演进，无论在复杂性还是保护程度上都是如此，它是安全应当促进而非阻碍业务这一最佳实践的关键驱动因素。通过有效的访问控制，组织可以创建更加灵活和易于更改的安全协议，适用于适应和扩展以应对快速变化的威胁和机会。\n\
  \n## 在挑战性性中管理访问\n\n*Erik Devine, Riverside Health*\n\n要求访问网络资源的用户、设备和应用程序日益增加，是许多\
  \ IT 团队苦于管理的挑战。医疗保健行业是许多组织面临的访问控制挑战不断增加的完美例子，不仅是因为他们的网络环境如此复杂，还因为管理不当的访问会导致严重后果。\n\
  \n大多数医疗机构可以被视为两个完全不同的业务：行政和医疗。行政端关注业务流程和财务问题。医疗团队关注提供关键健康服务，如急诊治疗、手术、扫描和 X 光片；受控药物的管理以及其他医疗治疗。这两组都受到法规的严格限制，以保护患者隐私。\n\
  \n在这样的环境中管理访问需要在安全、隐私与提供救命服务之间不断取得平衡。你不能把访问控制得太紧，否则人们可能无法获得所需的护理；你不能放得太松，因为你处理的是敏感信息。\n\
  \n另一个复杂性是处理医院工作人员之外需要访问的个人和群体的需求。许多人是核心业务的重要部分，例如卫星医院、附属诊所和诊所或账单服务。其他人员，如实验室、专业顾问和专科医生，因为他们提供了内部不具备的专业服务而需要访问。在河岸（Riverside），我们对管理的数据库有超过\
  \ 300 个不同的外部连接。\n\n当然，这种挑战并非医疗行业所独特。今天许多组织都有各种具有合法需求访问网络资源和数据的用户——这就是为什么“一刀切”的访问控制方法不再适用。\n\
  \n### 从何开始？\n\n最重要的第一步是确定你的组织面临最大的风险。如果你有要求授权用户限制访问的高级数据，那是一个很自然的开始点。但在你业务的其他部分实施访问控制要复杂得多，因为确定你的最高风险涉及许多因素。\n\
  \n### 确定用户角色\n\n访问控制通常从确定网络用户的角色开始，并将他们拥有的访问权限与他们应该拥有的权限进行比较。你可以通过与供应商和行业同行的交流开始发现这些。一旦你确定了外科医生应该拥有什么种访问权限（例如），就可以将其与已有的措施进行比较。这是一项关键的练习，因为你可能会让网络暴露在不必要的风险中，或者可能会限制创新以及产生更好结果的能力。\n\
  \n### 进行第三方审计\n\n系统审计让分析师看到你的网络上有什么，谁有权访问这些资源。审计应该定期进行，因为随着网络变得更加互联，部署的许多设备的角色自然开始扩大。通常只有在系统审计之后，你才能理解网络上不同系统是如何互连的。绘制这些连接和系统交互对于帮助你在提供资源访问时识别潜在风险至关重要。\n\
  \n### 与利益相关者交谈\n\n\n\n\n\n管理访问的下一步是清晰地理解你的利益相关者的需求。这要求你使用他们的语言；否则，他们无法理解你，你也无法理解他们。结果是，你可能被迫施加他们并不喜欢的控制措施，而他们可能会通过实施“影子\
  \ IT”（shadow IT）来作为回应。突然之间，你所做的一切都付诸东流，因为他们找到了绕过你控制措施的方法。既然如此，何必进行这场争斗呢？\n\n与其忙于快速把事情做完，不如慢一点把每件事都做对——因为你可能会发现，虽然你“做得很好”，但现在却留下了这么多后门和变通方案，以至于你会怀疑起初为什么要费这些精力。既然决定要做这些工作，还不如获得一个好的结果。\n\
  \n例如，在医院中，医护人员使用的临床语言与行政部门使用的业务语言完全不同。理解这些语言有助于建立正确的控制措施和访问权限。人力资源、财务、销售、市场、研发以及公司中任何其他部门的情况也是如此。\n\
  \n听取人们所说的他们需要什么，其技巧之一在于能够退后一步并决定哪些请求是关键的。这带给我最重要的见解之一是，许多传统的访问控制（如将用户绑定到特定的网络分段或特定资源）在医院是行不通的。例如，医疗提供人员喜欢更换班次或在医院的不同区域互相替工作。此外，我们还有临时医生和护士，他们可能偶尔来在自己的专业领域进行实践，然后离开几个月。除非你配备了正确的灵活控制措施，否则你会在凌晨\
  \ 4 点接到电话，对方说：“X 医生需要访问权限，但他因为忘记了密码而无法进入。噢，他现在立刻需要，因为他要进手术室。”\n\n满足这些需求始于理解人们试图做什么以及他们试图访问什么资源——这从以非技术性的方式理解他们的工作流开始。这是否需要花多一点时间，意味着我们不能足够快地处理工单？是的。但它也为我们提供了以前没有的信息。一旦你了解了情况，你不仅可以解决问题，而且如果问题再次发生，你可以反应得更快。\n\
  \n当然，这需要双方权衡。这涉及到向用户教育风险和风险管理。过去，当首席信息官（CIO）试图强制实施如双重身份验证之类的时，会有 20 或 30 名医生举手摊手说：“我一年赚一百万美元。我不想随身带着手机来验证我的访问。”而且很多时候，IT\
  \ 部门的反应是“好的，我们为你把它关掉”，这恰恰是错误的反应。但通过对风险和法规进行定期沟通，当 CIO 说“我们之所以这样做是因为这很重要”时，用户就能看到价值。这是一个巨大的转变，这是因为我们对风险相关的成本进行过对话。\n\
  \n### 保护 IOT 访问\n\n访问控制问题远不止于人员。如果你像大多数公司一样，你环境中开始增殖的设备数量正在增长。如果你像大多数公司一样，你环境中开始增殖的设备数量正在增长。如果你像大多数公司一样，你环境中开始增殖的设备数量正在增长。如果你像大多数公司一样，你环境中开始增殖的设备数量正在增长。如果你像大多数公司一样，你环境中开始增殖的设备数量正在增长。如果你像大多数公司一样，你环境中开始增殖的设备数量正在增长。如果你像大多数公司一样，你环境中开始增殖的设备数量正在增长。如果你像大多数公司一样，你环境中开始增殖的设备数量正在增长。如果你像大多数公司一样，你环境中开始增殖的设备数量正在增长。如果你像大多数公司一样，你环境中开始增殖的设备数量正在增长。\n\
  \n访问控制问题远不止于人员。如果你像大多数公司一样，你环境中开始增殖的设备数量正在增长。物联网（`IoT`）正在增长。如果你像大多数公司一样，你环境中开始增殖的设备数量正在增长。如果你像大多数公司一样，你环境中开始增殖的设备数量正在增长。如果你像大多数公司一样，你环境中开始增殖的设备数量正在增长。\n\
  \n访问控制问题远不止于人员。物联网（`IoT`）正在增长。如果你像大多数公司一样，你环境中开始增殖的设备数量正在增长。如果你像大多数公司一样，你环境中开始增殖的设备数量正在增长。\n\
  \n### 处理权限变更\n\n在我的世界，医生会获得认证，然后有人会找 IT 部门。在我的世界，医生会获得认证，然后有人会找 IT 部门请求访问新数据、资源。这种请求可能会触发我们这边大量的验证。我们需要核实这名医生确实发生了变动。然后我们需要知道她是否还需要以前拥有的资源。同样，一名护士将从一个楼层转到另一个提供完全不同护理水平的楼层，例如从放射科到\
  \ ICU。我们需要知道他是否还需要放射科的访问权限。他会在接下来的六个月里在 ICU 工作然后回到放射科吗？当一个个人开始积累不同级别的权限时会有什么影响？如果想要解决这些问题，就必须理解这些挑战。\n\
  \n我们的做法是监控用户以理解他们的行为。这名护士通常是在 ICU 工作（同时涉及 ICU 和放射科），还是只在放射科，因为他从未去过 ICU？这是很多医生和护士会做的——他们注册、完成所有的培训和认证，然后从没有出现过。这时，问题变成了：“我们现在该怎么办？我们需要禁用那些\
  \ 30 或 60 天未使用的账户吗，还是启用其他东西？”\n\n### 增强访问控制地址变更\n\n遗憾的是，在历史上，我们把访问控制的负担过多地放在了终端用户身上。我们需要增强访问，让使用户不再需要记住一长串复杂的密码。生物识别、单点登录、感应式卡片以及一系列其他工具可以帮助访问，这样你就可以对控制实施更严格的标准，同时给用户提供一个不需要他们记忆所有内容的工具。我认为每位首席信息安全官（CISO）都能同意，我们宁愿为终端用户提供一个卡片或指纹识别器，也不愿让他们把密码写在便利签上贴在电脑到处。\n\
  \n\n\n\n\n我们需要考虑的不仅仅是初始访问。在需要时，访问控制必须能够扩展到整个关键网段。用户的访问权限在不断变化——这意味着你的访问控制和策略不能是僵化的。你必须确保人员能够对正确的数据获得适当的访问。在我们医院里，一个单一提供者可能需要跨越两三百个安全点，而这些点都防御着不同的威胁，而且这种情况只会变得越来越复杂。\n\
  \n因此，任何访问控制策略的目标都需要将人类需求转化为技术，以简化流程，以便用户和设备能够跟上数字化需求。诸如单点登录、`tap-and-go` 或 `biometrics`\
  \ 等解决方案不仅需要确保用户确实是他们所称的身份，还要确保他们能够尽可能快速、无缝地进入系统，安全地访问完成工作所需的资源。在我工作的领域，这可能实际上关乎生命。\n\
  \n## 关于作者\n\n`Erik Devine` – `Riverside Health` `CISO`\n\n`Erik Devine` 拥有二十多年的经验，在信息技术和安全领域内发现新的创新和解决方案方面表现优异。他担任\
  \ `IT` 和安全领导者已有 15 年。`Devine` 目前的重点是在医疗保健领域培养信息安全文化，同时平衡临床和研究工作流，以帮助改善患者疗和医疗创新。\n\
  \n`Devine` 还热衷于开发安全框架和防御技术，并在整个企业和社区中传播安全意识。\n\n## 访问控制的系统方法\n\n*George Do, Equinix*\n\
  \n在我看来，访问控制是实现网络安全基本目标的第一要边界机制，该目标是将坏人拒之门外，同时让合法用户进入并执行他们需要做的一切。这听起来很简单，但事实证明这实际上非常困难。\n\
  \n挑战在于，很难确定请求网络资源的用户和设备的意图。由于网络攻击者和恶意软件会极力不被识别，访问控制允许我们把合法用户与坏人区分开来。在历史上，我们在访问点使用\
  \ `passwords` 来做到这一点。这似乎是解决该问题的简单方案：如果你知道 `password`，你可能就是合法用户并可以进入；如果你不知道，你就不是，也进不去。\n\
  \n问题在于，用户讨厌 `passwords`。这是因为良好的 `passwords` 很难创建，更难记忆。但它们不仅对用户不利，对安全也没有好处，因为它们很难保护。因为\
  \ `passwords` 难以记忆，用户倾向于使用替代方案，如生日、宠物或孩子的名字、大学吉祥物、旧地址以及类似的记忆设备——这违背了要求复杂 `passwords`\
  \ 的初衷。\n\n密码控制往往容易被绕过，因为人们倾向于使用相同的模式。公开的社交媒体信息使得它们很容易被破解，即使不是这样，它们也容易通过社会工程学或网络钓鱼从用户那里骗取。在你所有的员工中，黑客只需要其中一个，这意味着有决心的黑客通常可以很快拿到\
  \ `password`，而当他们拿到它时，他们就有了对连接设备的访问权限，然后是你的网络，从那里开始一切就结束了。\n\n### 访问控制是许多安全策略中的薄弱环节\n\
  \n快速查看不断增加的网络入侵事件数量，你就会发现访问控制是一个需要更多关注的安全卫生领域。但大多数组织忽视了它，因为他们认为他们目前的 `password scheme`\
  \ 是足够的，或者认为诸如 `multifactor authentication` 或 `biometrics` 等选项太贵、太繁琐或太复杂。\n\n传统的，网络中的一切要么是静态的，要么被仔细地锁定和管理，只有一个需要保护的访问点。然而，我们今天生活在一个充满颠覆性的世界，网络对访问控制的依赖超过以往任何时候。虚拟设备不断启动和关闭，组织以创新的速度向网络加入\
  \ `IoT` 设备，网络应用程序以以前所未有的速度开发和更新，人们越来越多地使用个人设备进行工作，通过远程或本地将其连接到网络。\n\n这种日益增长的复杂性对访问控制产生了严重影响。组织昨天保护其信息资产的方法与他们今天需要这样做非常不同。不仅有更多设备需要验证，而且在曾经有清晰边界的地方，现在要么已经广泛分布，要么根本没有边界。\n\
  \n由于今天的分布式网络由混合多云、高度移动的员工和设备，以及融合的 `IT` 和 `OT` 环境组成，它们往往处于不断变化之中。因此，与其通过严格的边界来控制访问，每个网络层现在通常都有自己的登录方式。你通过\
  \ `VPN` 登录网络，登录网络域，通过用户门户登录云服务，并登录设备、应用程序和操作系统。这些访问点中的每一个都有犯罪分子可以利用的相关弱点。结果就是黑客的天堂。\n\
  \n除了让访问核心资源变得日益复杂外，安全从业人员还必须同时保护和监控所有访问点。进一步使问题复杂的是所有需要访问的非用户设备。虚拟机、网络应用程序以及不断扩大的终端和\
  \ `IoT` 设备集让许多网络接不应交。除了一组 `IP addresses`，大多数组织对在任何时刻网络上的内容几乎一无所知。挑战在于如何将一个统一的访问控制过程（包括策略和访问点）封装在这样的动态环境周围，以便你能够一如既往保护所有入口，包括那些不断变化的入口。\n\
  \n### 从何开始\n\n如果你是一个进入这种局面的新任 `CISO`，你的第一个问题可能是“我该从哪里开始？”以下是三个帮助你开始的步骤：\n\n1.  不要恐慌。无论你继承的网络有多复杂，只要你将其拆解成易于消化的部分，这就是可以解决的问题。\n\
  2.  确定公司的“皇冠明珠”是什么在哪里。它们可能是你的企业资源计划 (ERP) 系统、客户关系管理 (CRM) 系统，或者运行数据中心的系统。例如，Equinix\
  \ 拥有 200 多个数据中心，由可编程逻辑控制器 (PLCs)、数据采集与监控控制 (SCADA) 系统和应急指挥系统 (ICS) 组成。所有这些设备对于我们数据中心和客户的正常运行至关重要。这些是我们的皇冠明珠，因此当我成为\
  \ `CISO` 时重点在这里。\n3.  从中心向外工作。从对业务最关键的数据、服务和技术开始——那些你无法负担故障的。然后你开始对这个核心应用 `multifactor\
  \ authentication`，结合强加密和极大量的日志记录与监控。当你向外扩展到最不利的环境（通常是连接了打印机和 iPad 的不可信网段）时，你可以开始放宽这些安全控制。\n\
  \n### 首先保护最关键的资产\n\n锁定和加强你最关键资产是一个多步骤的过程。我首先在这些资产所在的网段上部署网络访问控制 (`NAC`)。如果那里出现任何新事物，我希望\
  \ `NAC` 解决方案能立即提醒我。\n\n\n\n\n其次，尽可能地将该区域视为一个“黑网络”。这意味着你需要对其进行设计，使其仅在非常严格且严格控制的协议下，才与该网段以外的任何对象进行通信。这包括将保护该网络部分的防火墙规则锁定到第\
  \ `n` 级。\n\n接下来，你需要实施 `uber-auditing`。该网络部分的防火墙、服务器和其他设备需要记录任何人或任何设备在任何时间、任何地方进行的每一次活动、身份验证或登录尝试。这些日志随后需要被转发到一个独立的系统中，因为如果黑客侵入系统，他们要做的第一件事就是尝试擦除这些日志。如果你将这些记录存储在其他地方，要做到这一点就会困难得多。然后，这些日志需要被输入到管理和分析系统中，例如安全信息和事件管理（`SIEM`）系统，以确保能够持续访问事件、进行事件关联并获得易读的分析。\n\
  \n当然，该网络网段通常还需要管理和管理访问。这种访问需要经过配置，以便让管理任务可以在不引入额外风险的情况下运行。这将需要来自已知且高度安全设备的加密和监控访问，并结合多因素身份验证来确保用户的身份。\n\
  \n### 良好的安全需要时间\n\n如果你正在建立一个全新的网络，实施这些过程会容易得多。然而，当你需要保护一个运行了很久且存在许多访问控制问题的网络时，大多数首席安全官（CISO）的直觉反应是关闭大门。但你会发现，锁定访问通常会开始导致故障，而且往往这些故障往往非常重要。相反，你需要从开始应用一套允许大部分（甚至是全部）流量通过的规则集。但你要记录一切：谁在和谁通信，通信了什么。然后，你需要从源到目的地分析每个连接、应用程序和工作流，并问诸如“该连接合法吗？”以及“如果我们拦截它会发生什么？”。\n\
  \n取决于网络的大小和复杂性，你可能需要几周或更长时间来监控和追踪所有的流量线程和连接。只有这样，你才能谨慎地关闭大门，因为你首先建立了一个基准并对其进行了处理。\n\
  \n### 实施持续监控\n\n访问控制并非始于或于网关。它需要超越这一点，这要求为每个应用程序、工作流以及网络或 IoT 设备构建配置文件。每个配置文件都需要包含基准信息，例如该设备或应用程序仅使用某些协议、仅在特定端口上通信，或仅与少数已知源通信。\n\
  \n一旦建立了基准，访问控制意味着如果出现任何偏离该基准的情况，安全团队都应该立即收到警报，因为这是异常。这并不意味着设备或应用程序已被攻破。也许是网络其他地方添加了你未考虑到的新应用程序或新设备。但它可能意味着有人正在侵入该网段，甚至是某个用户或黑客在某处作了未经授权的更改，而你正看到该攻破的连锁反应。无论如何，任何基准的变化都足够关键，会让安全团队收到警报，以便他们评估发生了什么以及为什么。\n\
  \n当然，考虑到今天网络中发生的快速变化，即使是这种程度的基准监控和评估也可能是不够的。\n\n\nGeorge Do 在信息安全领域已工作 20 多年，专注于多个领域，包括全球信息和网络安全计划的开发与转型。他在执行\
  \ IT 治理/风险/合规（GRC）、信息安全框架、系统和网络安全、事件响应（IR）、系统取证与调查、入侵检测与防护、渗透测试以及安全防火墙技术方面拥有丰富的经验。他于\
  \ 2019 年加入 Equinix，从零开始开发了一项全新的全球信息安全计划，以确保业务风险得到充分管理。在加入 Equinix 之前，Do 曾在 Exodus、Savvis、CenturyLink\
  \ 和 Tivo 担任高级安全职位，特别是作为首席安全架构师，为客户提供咨询以确保其组织安全。他还曾在美国国家航空航天局（NASA）工作，保护政府信息资产，包括实施防火墙和入侵检测系统、公钥基础设施（PKI），以及整个机构级事件响应能力的开发与完善。\n\
  \n# 8 分段\n\n![](img/c08uf001.png)\n\n敏捷的宏观和微分段已取代边界防御，成为首要的网络安全策略。这种分段将安全放置在最需要的地方：即资产周围。分段使得攻破特定资产变得困难得多，并在威胁者设法成功时极大地限制了泄露造成的损害。\n\
  \n回首过去，在数字革命之前，庞大、复杂且高度互联的网络就已经存在了。尽管数字创新者往往关注未来，但从历史中即使是是最古老的权力、结构和连接系统的兴衰记录中，也能汲取到强大且宝贵的教训。\n\
  \n在二世纪中叶鼎盛时期，罗马帝国跨越了 300 万平方英里，在当时仅有 3 亿人口的世界中，人口超过了 6000 万。帝国由 25 万条道路连接——其中超过\
  \ 5 万条经过了铺装——通过罗马工程师的非凡创新改变了欧洲。罗马军队横跨陆海，战斗力拥有近 50 万名士兵和水员。但随着帝国不断向边界之外延伸，越过莱茵河和多瑙河的西边缘，进入匈族、法兰克人、萨克逊人和西哥哥特人的领土，其广阔吞噬了这支强大军队防御其不断扩张的边界的能力。帝国已变得过于臃肿，无法无法抵御入侵者的侵害。\n\
  \n与此同时，野蛮部落开始利用罗马人自身的创新（尤其是钢））来对抗帝国，以突破边界，并在罗马边界深处建立更强大、更稳定且更具可持续性的据点。在鼎盛时期 100\
  \ 年后，罗马帝国崩溃了，那些无法征服的所谓“野蛮人”站在罗马城的废墟之上。\n\n罗马的衰落与不断扩张且难以保护的数字文明中的信息防御之间存在相似之处。其中最重要的是主导网络安全前\
  \ 50 年的边界防御策略。组织在其资产的最外围建立了一道宏大的物理和虚拟屏障，并在那里进行所有的防御。\n\n该策略的一项重要改进被称为多种名称，包括“主动网络防御”——在近实时的态感知指导下，在网络空间相关的时间内检测并缓解威胁，多年来一直占据主导。\n\
  \n但即使有了改进，边界防御的强度也取决于其最弱的环节。过去的访问授权是一个高风险的二元决策（是或否），而今天更具分段性的访问控制能力允许 IT 团队在数据驱动的世界中扮演他们所需的角色——即业务推动者。虽然这需要对谁必须访问网络以及为什么有更深入理解，但实施分段访问控制催化了更连接、更协作的数据保护和数据使用方法。\n\
  \n\n\n\n实施良好的加密技术、合理的访问控制和安全的分段，可以为互联网基础性缺陷这一问题提供一个足够完善的解决方案。\n\n## 成功的分段并非隔离，而是协作\n\
  \n*Colin Anderson, Levi Strauss & Co.*\n\n在网络安全领域，有效的分段往往决定了你的公司是出现在《华尔街日报》的头版还是底版。这是因为，在过去的几年里，分段的重要性一直贯被写在各大媒体的标题中。\n\
  \n在涉及数亿消费者隐私信息泄露，以及巨额内部和外部成本的头版事件中，最令人震惊的或许是其原始的简单。这引发了一个问题：一个虚假的钓鱼邮件或一个被盗的密码，如何会导致数百万甚至数十亿美元的损失，并让无数消费者面临身份盗用和欺诈的风险？我们该如何降低这种风险？\n\
  \n## 答案是分段\n\n分段背后的战略原则并不新鲜。其目标是减少攻击者可能攻破资产数量，最大限度地减少潜在的攻击足迹。如果没有适当的分段，低安全区域的一个弱点就会让犯罪分子能够访问网络中最核心、任务关键型且价值最高的数据。\n\
  \n随着大型企业遍布全球以及网络攻击的日益商品化，一个事实是：你无法将所有人隔在之外。攻击者会进入。但你可以选择这些威胁主体能够访问的内容，以及他们在进入内部后可以去向哪里。在他们进入时限制其行为的能力，将产生决定性的影响。\n\
  \n如果没有分段，你的整个网络强度取决于其最薄弱的那个点——一旦该点被攻破，攻击者就有能力在网络中“漫游”。他们可以穿过你的网络，从非军事区（`DMZ`）等较公共区域开始，迅速移动到高安全区域。或者他们缓慢移动到该区域；攻击者在规避检测方面变得越来越精明，避开你团队的视线——步步逼近你可能存放财务数据、HR\
  \ 信息和其他关键资产的网络区域。\n\n当组织选择不投资分段，或者当他们实施错误时，会使他们面临更严重的业务影响。这可能不是一个容易讨论的话题，但与其讨论不实施分段的代价，讨论仔细实施分段的成本显然要谨慎得多。\n\
  \n## 分段可能是昂贵且具有破坏性的\n\n实施和执行分段策略是一系列具有挑战性、复杂且细致的决策（或者坦率地说，是妥协）。\n\n可以可以说，现在已经没有所谓的低风险访问点了。这种认知催生了所谓的`零信任模型`。你必须专门允许（`allow`）资产和应用程序相互通信。例如，你不再将所有控制措施都放在网络边缘的`firewall`上，而是将这些控制措施移动到网络核心，并创建策略、限制和分段，以限制攻击从一个资产跳转到另一个资产的能力。\n\
  \n通过极高粒度的分段来实现这种`零信任模型`是一个伟大的目标。但并没有什么“一键按钮”可以让你到位。这个过程是艰难、艰辛且具有破坏性的。\n\n通常，那种规模的破坏性仅仅是无法接受的——这正是决策和妥协开始的地方。明智且有效地做出这些决策需要深度知识，如果没有全组织的协作，这种知识几乎是不可能的。\n\
  \n简单来说，分段需要一种多方利益者参与的方法。为了尽可能地减少剧烈的挫败感和工作流缓慢，需要你的网络团队、基础设施和系统团队以及应用程序团队之间的强力协作。这是因为要让分段生效，人们的工作方式需要发生改变。\n\
  \n如果你正在发起需要人们完全重新思考和校准工作方式的努力，你只需要深入了解他们现在的工作方式。这包括部门、团队、职能以及内部和外部利益相关者，从`C-suite`到入级员工。更不用说理解特定应用程序和系统的运行机制，以及分段将如何影响它们。他们的合作伙伴是谁？一个应用程序需要与哪些应用程序或服务器通信？你想在特定应用程序周围建立什么样的信任圈？要做到这一点，你通常需要深入协议层面，即应用程序的精细运行机制——这需要许多不同领域共同工作。\n\
  \n通常，成功的程度取决于该过程的业务务实程度及其所实现的最终结果。简而言之，所有利益相关者都需要看到从中能获到什么。\n\n## 寻找双赢\n\n例如，一个经常被忽视的因素是外部供应商成本——特别是多路复用交换（`MPLS`）的成本。分段在节省`MPLS`成本方面可以带来巨大的投资回报率（ROI）。全球网络向电信服务提供商支付着数字般的账单。分段允许你将这些通信限制在一个小范围系统内，减少对网络某些昂贵电路的负载。\n\
  \n在这种情况下，分段不仅指数级地减少了潜在风险，还通过将跨越网络的流量保持在那些真正需要通信的人员内部，从而减少了数百万美元的电信账单。这不仅让`CISO`能够有战略性地在最需要的资产周围投入控制措施和资源，还加强了内部的共同目标感和协作。\n\
  \n不要低估这种认同的重要性；没有它，分段将变得困难得多困难得多。\n\n分段的核心是一个融合过程。它类似于在采用`DevOps`思维的公司中看到的融合，在这些公司中，哲学、流程、实践和协议被结合在一起，以更快的速度交付应用程序和服务，让工程师既负责开发也负责支持运行其应用程序的系统。\n\
  \n分段要求团队融合技能并兼任多职。\n\n通常，基础设施的人员在作为领域专家时感到最舒适——并认为自己最有价值。这是他们的身份认同。“我是一个网络人员。”“我是一个服务器人员。”“我是一个应用人员。”\n\
  \n当你开始创建软件定义的分段网络时，这些技能必须汇聚到一个个人身上，这个人需要了解一点网络知识、一点他/她正在开发的应用程序知识，以及一点运行该应用程序的系统知识。这些技能必须汇聚，因为他们正在创建允许其系统与其他系统通信的规则。\n\
  \n如果你认为弄清楚技术的细粒度细节具有挑战性，那等你涉及到人的部分吧。即使有执行领导层的支持，如果没有自下而上的认同和承诺，也很很难成功。个体工程师将开始拖延，进展将非常缓慢，这将是一场长而艰辛的斗争。\n\
  \n那些对此存异或忽视此点的`CISOs`必须意识到，他们不能独自完成任务。网络不能由安全团队在真空中完成分段。必须有一种战略性的方法来融合团队、技能集以及未来支持分段网络的人员。\n\
  \n\n\n\n考虑到参与分段过程中涉及的人员复杂性。首先，你需要在你正在围绕其构建网络的任何一组应用程序方面拥有专家。例如，如果你正在使用 `VMware`，你就需要了解\
  \ `VMware` 并知道如何围绕一组系统创建这些策略的系统人员。如果你在使用任何类型的网络硬件——防火墙、路由器——你可能需要引入你的网络专业人员。这取决于你如何进行你的分段旅程。而且这无疑是一场旅程——关于如何最好地开展这一旅程，需要进行一些学习。\n\
  \n这就是为什么，在涉及分段时，第一步是从小处着。从开发环境或 `QA` 环境开始，学习你可能希望如何在更广泛的网络范围内从整体上处理分段。找到一个你熟悉的开发者或了解其行为的应用程序，这样你就可以为该特定应用程序创建正确类型的策略，并在其周围创建一个较小的区域。\n\
  \n一旦你掌握了基础知识，并理解了你所使用的技术的工作原理以及应用程序的行为（以及它们所需的端口和协议），你就必须转向设计工作。识别出你的财务系统；假设你创建了一个财务系统运行并相互通信的网段或区域，并且在该特定区域内为你所有的财务系统创建了一个小型软件定义网络。然后，你处理下一个区域和下一个。如何吃掉大大象？一次吃一口。分段网络也是如此。\n\
  \n有些人可能想从他们风险最高的资产、即最重要的资产开始，并围绕这些资产创建区域。另一些人可能更规避风险，从低风险资产（即不那么具有任务关键性的资产）开始，这样他们就可以从中学习，然后承担更高风险的领域。\n\
  \n但请记住：这些都是组织内部的事务，而这只是挑战的一部分。\n\n当今大多数公司都拥有庞大且不断增长的合作伙伴生态系统，帮助他们交付不同的业务服务。我们都有这些合作伙伴，因此，理解这些合作伙伴需要什么访问权限并确保他们只能访问所需的内容至关重要。要实现这一点需要良好的访问控制，允许某人进入你的网络，但只让他们去他们需要去的地方。\n\
  \n例如，对于外包开发合作伙伴，可以创建一个虚拟桌面环境，允许外部人员通过 `VPN` 进入并落到沙箱环境中。他们将拥有工作所需的信息和代码，但他们处于一个他们无法离开的沙箱中。强有访问控制将识别谁正在进入网络，而良好的分段将创建护栏，允许他们高效地完成工作，而无法窥探和查看那里还有其他东西。\n\
  \n而这也许不仅是分段，而且整个网络安全的指导性战略方法。安全必须是业务的推动者，而不是阻碍。为了实现这一点，安全必须看起来是无缝的。分段，这种创建缝隙的过程，必须以让终端用户感觉无缝的方式进行。这需要一些艰难的决定，但让这一原则成为你的指南。\n\
  \n对于访问你的系统进行购买、产生收入或塑造利润的客户和利益相关者来说，这些高层次的分段不可见是非常重要的。这通常需要那些刚刚经历了艰辛、充满挑战的开发过程，并对其工作内容和工作方式做出重大变化的团队付出额外的努力和克服。\n\
  \n这更有理由重点关注团队管理和激励的方式，从初始设计到执行再到新分段系统的持续维护。一个分段良好的网络是团队工作和协作的隐形杰作。尽管这已成为一项日益基础的要求，但这并不会让任务变得更容易，所以要像对待技术一样细心地、周全地管理人员。人对于其成功至关重要。在日益动荡和快速变化的数字格局中，正如许多网络安全基础知识一样，分段在许多层都具有挑战性。但正如标题所证明的——并且将来会再次证明——这是值得的。\n\
  \n## 关于贡献者\n\nColin Anderson – Levi Strauss & Co. 首席安全官 (CISO)\n\n在 Levi Strauss\
  \ & Co.。Anderson 管理一个国际团队，负责信息风险管理、监管合规和 IT 企业风险管理，该全球组织年销售额达 50 亿美元，在 42 个国家拥有\
  \ 2700 多家自营和加盟零售店。此前，Anderson 曾担任 400 亿美元北美超市 `Safeway` 的 CISO。在 `Safeway` 之前，他在\
  \ `Commerce One` 主信息安全，并在 `Bank of America Capital Markets` 主网络工程，负责为其美洲股票交易平台提供\
  \ 100%的可用性。Anderson 是信息风险管理和合规主题的频繁演讲者，也是非营利零售网络安全组织 `R-CISC` 的选举独立非执行董事。\n\n##\
  \ 为什么我们需要网络分段\n\n*Hussein Syed, RwjBarnabas Health*\n\n人们倾向于抗变化，这就是为什么适应数字化转型对某些组织来说是如此痛苦。几十年来，网络几乎保持不变。一切都是一个扁平的网络，人们在上面接入自己的设备。最终，这些网络变得太大，无法有效管理。随后，创建了虚拟局域网（`VLANs`），通过将大型庞大的单体网络拆分为更小、更易管理的子网来解决性能问题。\n\
  \n当时的威胁也非常少。但随着这种情况的开始发生，安全领域将 `VLANs` 视为保持不同网络元素隔离开的方法，以便处理各种层级敏感信息的设备可以在单个网络上共存，而不会危及关键资源或增加风险。\n\
  \n但现在，这是几十年来第一次，网络正经历着根本性的变化。它们正在向云端迁移，它们需要适应日益增长的移动用户和物联网（`IoT`）设备，传统的边界正在侵蚀。在这样的环境中，网络分段对于防御数据和资源变得更加关重要。\n\
  \n### 分段的驱动因素\n\n网络分段有三个主要的驱动因素。\n\n第一个是将网络分解为更小、更易管理的网段。大多数 IT 团队都在努力应对当今网络的规模管理。IT\
  \ 网络和运营技术（`OT`）网络正在融合。他们必须跨越远程办公室、移动设备和多云环境分发资源。组织正以前所未有的速度向网络添加 `IoT` 设备。\n\n为了使情况更加复杂，组织内部不同的业务部门拥有这些许多网络化资源。IT\
  \ 可能控制计算基础设施；物理安全或设施管理可能持有 `OT` 环境；而在医疗保健等场所，互联的办公室和诊所可能需要与 IT 甚至 `OT` 资源整合连接，但由完全不同的组织拥有和管理。\n\
  \n与其尝试将所有复杂性作为单一网络进行管理，不如将其分解为逻辑段，这意味着你可以实施更细粒度的控制。这让管理员监控了一个更小的设备和用户集合，以便他们能够更快、更容易地检测并响应异常行为。\n\
  \n\n\n下一个驱动因素是`保护`可能无法与其他系统以相同安全级别或控制运行的系统。某些安全控制会影响特定系统的性能或功能，特别是在 OT 环境中。网络分段有助于防止恶意活动、内部威胁和恶意软件在整个网络中传播，同时由于你的遏制范围更小，可以限制可能发生的损害。\n\
  \n分段还允许不同的网络段和资源按照管理员和用户所需的方式进行运行。例如，在我工作的医疗保健领域，网络上的医疗物联网 (MIoT) 设备数量呈爆炸式增长。其中某些设备造价数百万美元，且技术性极强。它们可能需要与制造商建立实时后端支持连接，以实时排除故障。此外，从这些设备收集的数据经常需要分发给外部专家进行分析。虽然此类连接可能是必要的，但它们也给你的网络其他部分带来了风险。通过对它们进行分段，它们仍然可以使用现有基础设施，而你可以将该风险与其他网络部分隔离开。\n\
  \n第三个大驱动因素是分段创建了一个`更干净的环境`，特别是在较大的网络中。分段通常能为某些系统产生更好的性能和吞吐量，仅仅是因为流量流量。\n\n### 理解数据流\n\
  \n实施、管理和保护分段网络所需的关键信息是系统之间是如何通信的、谁需要连接到访问这些系统的应用程序，以及这种访问是如何发生的。\n\n理解这些使你能够建立分层认证，以授权人员、设备和应用程序如何连接到系统。它还允许你保持应用程序服务器和数据库服务器隔离，例如，用户永远不知道数据库服务器位于何处。他们只能通过应用程序连接它。这种方法让你更轻松地实施数据库活动监控，以确保没有通过应用程序层发生入侵，而不是直接访问数据库。\n\
  \n### 安全横向数据流\n\n当然，并不是所有资源都想停留在网络段内。打印服务、应用程序和数据库服务通常需要在不同分段之间水平化运行。在分段环境中应对这一挑战需要理解这些资源的数据流，并识别它们需要与哪些系统通信。你还需要知道哪些用户或客户端需要连接到这些系统。\n\
  \n系统仍然必须通过与其他系统通信来工作，这意味着即使你隔离了它们，它们也需要被集成。集成系统的优之处在于，你不需要手动建立协议。如果用户或设备在某处生成数据，并且你的数据治理规则定义得当，那么这些数据就可以出于任何目的安全地从一个系统移动到另一个系统。但如果你没有充分记录该信息流，就会出现通信中断，导致某人无法获取需要的内容，突然之间，“不伤害”的原则就付之脑后。\n\
  \n一旦你理解了数据如何在资源之间移动，你就可以在它们周围创建一种不同的分段围栏。在某些情况下，你在极端隔离中运行系统，使得一个系统永远无法与另一个系统通信，因为没有需要。\n\
  \n在其他情况下，你根据应用程序的配置建立限制通信，允许某些应用程序、端口或协议在系统之间通信，但不允许其他任何内容。风险随后可以隔离到特定的资源集中，以便你对它们进行有效监控。\n\
  \n这种创建水平环境的需求也是采用微隔离的主要驱动因素之一。随着不同的客户端迁移到访问公共数据中心和其他资源，微隔离根据定义的配置（例如，允许哪些类型的通信）来保护访问。\n\
  \n### 管理复杂性\n\n随着网络的演进，它们也变得越来越复杂。在医院中，你有患者和医生在环境中进出，还有需要访问的远程实验室和诊所。这些许多用户也具有高度移动性，增加了额外的复杂性。问题随变成了，你如何在分段环境中管理所有这一切？\n\
  \n其中一部分归结于认证和访问控制。软件定义网络是另一种允许管理员在更高级别应用控制的方法。再次，如果你理解你的数据流、客户端是谁或是什么，以及通信应该如何进行，你就可以安全地为那些资源提供对系统的受控访问。\n\
  \n例如，如果有一个有一个访问或传输敏感数据的应用程序，你必须理解客户端是如何连接到该应用程序的，以便你对其进行充分的分段。也许用户通过 Web 层使用浏览器进行连接。然后，你可以添加数字证书和客户端证书以获得更好的访问控制。你可以定义，只有带有客户端证书的计算机在登录该系统之前才能连接到该系统。\n\
  \n但由于该系统位于不同的环境中，用户甚至无法`ping`该系统，因为它是完全隔离的——这也意味着如果恶意软件或索索软件进入网络，它们将无法连接到该系统，因为它们看不到它。\n\
  \n### 管理泄露\n\n构建有效的分段策略需要大量的文档记录，说明数据如何以及在哪里流动，以及应用程序和系统是如何连接和交互的。你必须维持跨分段的可视性。最终，某些攻击将从一个分段渗透另一个分段，良好的取证将能够通过网络分段追踪该攻击。这样，你就可以快速理解它影响了多少设备、攻击源于何处以及目标是什么、在哪里。拥有这种横向视图对于良好的故障排除和安全分析至关重要。\n\
  \n你不仅需要每个网络段的可视性。所有分段的统一可视性至关重要。这可能需要安装工具来收集实时信息，不仅是特定网络段的信息，而是跨所有分段。这些信息必须定期交付到配置管理系统或安全信息和事件管理\
  \ (`SIEM`) 解决方案，以便进行分析和关联；这样如果发生了什么，你就会收到报警。\n\n### 监控网络健康\n\n你需要能够持续评估整个网络的健康状况。这意味着允许监控系统访问网络段但不访问其他内容。防火墙访问列表可用于定义系统\
  \ X 可以对特定网络段具有可视性，以回传你的威胁数据、向设备传递反病毒更新，或向你的控制系统发送有关需要调查的活动的警报。\n\n你还需要确保永远不会限于一次只能看到网络的一部分。相反，你必须能够看到网络段\
  \ X 中的事件，并立即将其与网络段 Y 和 Z 中发生的问题关联起来，这表明你面临着更大的问题。要做到这一点，你需要一种方法从所有源收集日志到一个地方，对它们进行关联，并将它们与外部威胁情报挂钩以识别威胁。配置管理数据库\
  \ (`CMDB`) 和 `SIEM` 工具在建立和维护这种可视性方面发挥着至关重要的作用。\n\n### 分段遗留网络\n\n\n\n当然，将分段作为新网络的一部分来实现是相对简单的。挑战在于，这种情况很少发生。大多数时候，你是在将分段策略应用于一个由新技术和老旧技术混合而成的遗留网络。在某些情况下，你最终不得不对所有内容进行重新架构设计，这可能是具有挑战性的，因为你总是希望尽可能利用现有的技术。这就是基于防火墙的分段发挥重要作用的地方。内部分段防火墙可用于将扩展的网络划分为较小的网络，允许你缓慢地将系统移动其中。你应该从小处开始，并以仅监控模式运行你的操作，以便你开始理解系统的行为以及它们可能出现故障的地方。然后，通过理解或剖析这些系统并记录其数据通信模式，你可以逐渐在环境中转向更高级的分段手段。\n\
  \n这需要时间和耐心，因为该网络正在运行中。你还需要获得执行层和利益相关者的支持，这样当出现故障或系统停止通信时，你对会有多少时间或容错空间有个数。在返回重新尝试之前，你应该制定一个计划，以便在事情出错时进行回滚、重新评估和重新组织。\n\
  \n### 接触关键利益相关者\n\n这里的关键是让利益相关者参与对话，以便他们理解分段的必要性。受过教育的人根据信息做出决策。他们必须熟悉新兴威胁和不断变化的威胁格局。他们必须理解，组织不再拥有几分钟或几小时的时间来检测某些情况，因为网络、设备和威胁的速度都快得多。\n\
  \n你还需要尽可能地收集信息，以改进你的决策过程。你的用户、利益相关者和系统管理员了解数据需要如何流动，以及他们的系统何时、何地如何进行通信。一旦你获取了这些信息，就可以设计一个分段环境，使其对用户的影响降至最低。你必须记住，到达最终阶段是一个迭代的过程。\n\
  \n这不是一个技术问题。一旦你理解了人员和流程，技术就会提供帮助。如果你把这个顺序搞反了，那么你就会面临问题。\n\n### 核心要点\n\n分段的主要优势是更整洁的环境、更易于管理以及提高的安全性。从技术的角度来看，你可以更快地完成工作。如果你正确布局了架构基础，你可以更快速地实施解决方案，因为你不需要考虑一个新事物如何影响网络中的所有其他事物。在较小的环境中进行故障排除也有显著优势。分段环境中的变量更少，你对它们有更好的控制，从而使你具备快速实施解决方案的能力。\n\
  \n如果你处于高度受监管的环境中，记录并确保符合监管要求会变得更容易，因为分段环境简化了满足安全控制或策略的流程。分段还最小化了一个环境中发生不利事件的影响，因为你的其他分段环境可以继续运行，这对于任何希望在当今数字市场中竞争的组织来说都是关重要的。\n\
  \n## 关于贡献者\n\nHussein Syed – RwjBarnabas Health 首席信息安全官\n\n在 RWJBarnabas Health，Hussein\
  \ Syed 负责安全以及组织的 HIPAA 合规性和安全治理计划。Syed 及其团队负责该医疗保健系统的信息安全工作。该公司是新泽西州最大的整合医疗保健系统，每年为超过\
  \ 500 万名患者提供治疗和医疗。\n\nSyed 的知识和方法是通过多年在利用技术和业务流程的各种环境中工作发展而来的。他的经验使其在信息安全专长方面积累了丰富的资历。他负责\
  \ Barnabas Health 的数据安全，这是一个受 HIPAA 监管的环境，包含八个全站局域网、两个数据中心、30,000 多个终端以及用于临床、业务和研究领域的约\
  \ 800 个应用程序。\n\nSyed 拥有 22 多年的 IT 经验，其中 15 年从事信息安全。他是新泽西州医疗保健信息管理系统协会（NJHIMSS）安全与隐私工作组的成员，并担任多家安全公司的安全顾问委员会。他曾在\
  \ Gartner、NJHIMSS 和可信计算小组的活动上发表过，并参加了其他与安全相关的活动。\n\n# 第 4 节：高级策略：复杂的网络安全运营\n\n![](img/p04uf001.png)\n\
  \n当我们加深和扩大对天空中和地球环境的审查时，我们对宇宙、星球以及自身的理解发生了革命性的变化。随着太空可视性的提高，我们理解了（并继续更好地理解）我们从哪里来，现在在哪里，以及我们要去向哪里。在我们的地球上也是如此：我们正在研究和检查那些往往被隐藏在视野之外的复杂细节，以便我们更好地理解它们潜在的益处以及它们可能伤害我们的方式。\n\
  \n我们还在积极为失败做计划。在我看来，从长期来看，我们对太空的探索是为了在太阳死亡并毁灭地球时（所有恒星都会膨胀并不可避免地熄灭）保护人类。考虑到这一点，太空探索（除了近期的科学利益外）最终是为了寻找另一个恒星周围的新行星，以便在太阳烧毁地球的生命、水和大气层之后居住。我们已经通过派遣宇航员进入月球、派遣机器人进入其他行星，并将将派遣宇航员前往火星，开始了这些渐进且必要的步骤。但在我们将任何人送到月球或将机器人送到火星及更远地区之前，我们必须先绕地球。所以，每当我们思考太空中追求看似基础的事物的价值时，我们需要记住基础的事物通向高级的事物。\n\
  \n这就是本书第四部分（p04.xhtml）的重点：基于我们目前为止讨论的坚实基础，研究我们需要掌握的更高级的技术。\n\n将网络安全视为一门科学的力量最清晰地展现出来，特别是当网络安全架构围绕速度和连接构建时，并且加密、访问控制和分段的基础策略已经到位时。有了这个坚实且韧性的基础，并且基础策略已经到位，你就可以利用更先进的技术（包括可见性、检查和故障恢复）来实现那些一直向往但似乎一直遥不可及的强大目标。\n\
  \n随着这些日益复杂复杂的技术的出现，其产生的影响不仅仅是更大的益处。先进技术还带来了更复杂的风险程度，这需要更先进的安全技术和解决方案。如果没有科学应用基础方法的韧性基础，网络安全策略在未来将像设计不当的悬索桥一样崩溃。网络安全策略将无法承受快速创新和支持这些创新所需安全实践的重量。\n\
  \n\n\n在庞大的混合部署网络上实现可见性——这些网络被不断增加的移动接入点所扩展和穿透——变得比以往任何时候都具有挑战性。接入点的增加意味着机会的增多。犯罪分子试图用日益具有说服力的骗术来抓住这些机会。允许入侵的恶意软件现在经常性地隐藏在大量的电子邮件和附件中，这些附件通过诈骗手段，诱导用户在不经意的情况下安装。在某封匆忙阅读且看似无害的邮件上快速点击一下，就可能导致让一个组织陷入崩溃。更复杂、更分散的网络需要更先进、更高效的检测能力。此外，我们必须准备好应对潜伏在角落的威胁，以及网络犯罪分子通过精细制不断不断完善、持续攻击的恶意软件。检测是让安全团队能够先发阻止攻击的保障。有效的安全策略消除了孤立战术（即单一安全功能大多处于孤立状态），并利用多种技术（检测是关键技术之一）协同工作。\n\
  \n在打好基础之后，在第四部分中探索的高级策略——可见性、检测和故障恢复——构成了一个强大的侧翼。这些策略共同实现了一种极有效的防御，消除了威胁者运作的阴影，让组织能够快速检测到他们的踪迹，并以极高的效率消除任何造成的损害。\n\
  \n# 9 可见性\n\n![](img/c09uf001.png)\n\n可见性的运行基于一个简单的原理：你无法防御你看不见的东西——你更无法有效防止来自那些真正处于数字模糊位置的攻击和攻击者的侵害。\n\
  \n可见性是网络安全不可或缺的一部分，但在过去的十年里经历了剧烈的范式转变。连接设备的数量、类型，以及它们来去的流动性，要求更加重视可见性。网络上设备数量的大幅增加了攻击面。你需要知道它们在哪里以及是什么。网络上设备的多样化既创造了复杂性，也创造了机会。你希望知道可以使用哪些工具来防御自己，以及哪里可能脆弱。由于无线和便携计算，设备的移动性和灵活性使得静态和基于查询的分析立即过时。你需要实时状态。\n\
  \n如果没有可见性，任何针对攻击的防御都沦为运气和巧合。\n\n随着越来越多的网络运营商认识到需要增强检测和响应能力以改进网络保护，这产生了一个具有许多复杂答案的简单问题：什么是网络？多云部署和\
  \ DevOps 方法分散了组织的数据，而不断增加的移动性创造了指数级增长的接入点。在这种背景下，实现可见性的传统方法——查看日志文件或任何基于查询的分析——已过时，无法扩展或无法达到实现有效所需的速度。供应商已涌入这一真空领域以满足可见性需求。但结果往往是清晰度降低而非增加，因为安全团队淹没在海量数据中，这些数据往往掩盖相关信息的作用多于揭示信息的作用。\n\
  \n相反，网络运营商不得不用一种方法重新定义网络，这种方法少是“内向外”（即组成组织资产的信息），而更多是“外向内”（在何处以及如何访问专有数据）。简单来说，网络现在必须被定义为其攻击面的完整范围。这种重新想象从根本上改变了可见性，使其从看到网络全景的能力转变为能够更好地理解和检测威胁（无论是其本质还是行为）的能力。因此，可见性的有效性越来越取决于赋予当今业务速度和触及能力的战略洞察和态势感知类型。\n\
  \n现在由于规模和速度的原因，无法时刻查看所有内容——因此问题变成了“应该看什么以及何时看？”清楚地回答这个问题可以在组织各层建立共识，通过根据资产的价值和重要性来保护资产，提供真正有效且高效的网络安全。这种清晰的优先级排序使得对如何最好地扩展和深化可见性的问题可以采取更具战略性的方法。\n\
  \n正如我们将在接下来的章节中看到的，这种战略方法现在对于实现有效的可见性至关重要。随着从加密到隐私法规的所有因素都极大地增加了可以看到什么、允许看到什么以及持续多久的复杂性，可见性的力量部分源于洞察的精深程度，部分源于工具的创新。安全领域有一句理常说：你无法保护你看不见的东西——但随着可见性的本质为了满足当今的安全需求而发生变化，这一陈调也可能发生变化。一个更合适的指南可能是：“你看不见你不知道去寻找的东西。”\n\
  \n## 可见性：识别网络攻击的病原体、风险因素和症状\n\n*Michael Chertoff，前美国国土安全部部长*\n\n尽管可见性在书中被视为一种“高级”策略，但对网络的可见性是任何有效网络安全和风险管理计划的关键要素。如果你对自己的信息系统网络缺乏清晰的认识，要检测、预防或响应网络安全事件是极其困难的甚至是不可能的。在网络空间范围内，就像在医学中，通常需要多种类型的信息来成功识别、诊断、治疗或预防网络攻击。这包括对以下内容的观察：\n\
  \n*   病原体（恶意软件、病毒、拒绝服务攻击或对漏洞利用）\n*   风险因素（网络或应用架构中的根本性缺陷，导致你易受攻击，例如有缺陷的代码、未修补的漏洞或开放的端口）\n\
  *   症状（异常大量数据离开网络、大量数据突然被加密、与可疑服务器通信、或网络性能下降）\n\n简而言之，缺乏对网络关键元素、功能和活动的可见性，将使任何企业都面临可能具有毁灭性的网络攻击的脆弱性。所有这些信息不仅对于检测潜在攻击至关重要，对于响应和预防攻击也至关重要。虽然整个网络和技术堆栈的可见性非常重要，但我将重点关注四个关键的可见性领域，这些领域可能让安全人员对潜伏在其系统中的潜在威胁有最深的理解：设备可见性、软件和代码可见性、网络活动可见性以及访问可见性。\n\
  \n虽然对其中任何一个方面实现完全可见性本身可能不足以让公司防御网络威胁，但所有四个方面的可见性将为大多数企业提供抗争的机会。安全高管应当与其技术团队合作，确保其企业对网络的这些关键方面具有可见性。\n\
  \n### 设备可见性\n\n\n\n\n\n企业在网络上需要的第一种可见性是设备可见性，这本身要求理解底层网络以及过去十年发生的剧烈变化。曾经一个边界清晰、相对简单的网络，现在变得更具流动性：设备分布在不同的物理位置，软件承担了许多传统的网络功能，并且许多过去在本地运行的各种应用程序也开始采用云服务。每一台计算机、打印机、IP\
  \ 电话、移动设备、交换机、服务器、网络设备、智能电视、虚拟机以及无数其他物联网 (IoT) 设备，都根据网络配置的不同，利用网络在网络内部以及向更广泛的互联网传输数据。这可能导致网络暴露给攻击者使用的机器，他们以此传播恶意软件、窃取价值数据、运行僵尸网络或管理勒索软件。\n\
  \n因此，对于任何成功的网络安全工作来说，对连接设备的网络可见性都是必要的。一个被破解且对你的网络拥有不受限制访问权限的设备可以作为攻击者的切入点和立足点，允许他们传播恶意代码并破坏网络上的其他设备。这种意识也是适当网络设计的前提条件，允许组织将任务关键型机器与备份打印机隔离，限制设备访问某些网络端口和协议，并监控设备活动以发现异常。\n\
  \n知道哪些设备连接到网络是一个良好的开始，但还不够。每学学年，学校不仅要确保学生名单准确，还会验证学生的接种记录。同样，你必须了解有关连接设备的详细信息，包括其配置和软件版本。此类信息允许技术专业人员快速识别哪些设备可能容易受到利用的攻击，并让他们有机会确保网络上的所有设备都在运行最新且已打补丁的软件和固件。过时固件和软件中的漏洞是攻击者寻求入侵网络的频繁目标。\n\
  \n### 代码的可见性\n\n代码的可见性本质上将设备可见性进一步进了一步，不仅询问设备运行的是哪个版本的软件或固件，还询问该软件或固件中包含了什么。该软件或固件中嵌入了哪些第三方或开源组件？正在使用哪些版本的组件？这些组件有哪些漏洞，以及如何解决？这些都是重要的问题，攻击者日益依赖底层代码库的缺陷（这些缺陷对许多开发者来说长期以来被忽视）作为进行更广泛攻破的起点。\n\
  \n对于商业现成软件，这似乎非常简单：软件供应商定期更新其产品以解决漏洞。实际上，事实并非如此简单。许多供应商依赖于其控制之外的开源或第三方代码库，并且可能没有努力确保这些组件（如\
  \ `JavaScript` 或 `SQL` 函数）保持最新并修复了已识别的漏洞。\n\n对于开源、定制或内部开发的软件，问题变得显著复杂得多，因为确保所有涉及代码都是最新的责任变得更加复杂，且承担这一责任的人也更少。许多开发者习惯于直接从仓库（大多数是基于互联网的）“拉取”底层代码库，而不会过多考虑拉取的代码是否是新的，或者是否解决了潜在的危险漏洞。同样重要的是记住，大多数软件开发者并非安全专业人士，可以理解的是，他们会考虑开发需求，而不是组织\
  \ CISO（首席信息安全官）的安全性考量。在这些情况下，公司需要与以下方面合作：\n\n* 与他们的供应商合作，确保底层代码库是最新版本\n* 与他们的程序员合作，确保他们拉取的库是安全且最新的\n\
  * 与他们的安全团队合作，对软件和代码进行审计和扫描，以识别潜在威胁\n\n这可以理解为这是最难解决的可见性问题之一。许多企业依赖大量的自定义构建和设计的程序，这些程序调用了数十甚至数百个开源或第三方提供的代码库。放弃开源代码并不是一种可行的、甚至是推荐的解决方案。企业需要采取多管齐下的方法来解决这个问题，建立开发流程以对第三方和开源代码进行进一步审查，进行更增强的软件成分分析，并在整个生命周期内扩大对代码漏洞自动测试的使用。在开发领域，这被称为开发安全运维，通常简短为\
  \ `DevSecOps`。\n\n### 活动的可见性\n\n对网络活动清晰的可见性可以为企业提供极其实用的潜在威胁图谱，提供预警潜在威胁所需的数据，以及快速高效修复任何出现的问题所需的信息。其中一些信息是由运行在企业网络上的任意技术或服务自动收集的。然而，并非所有服务和技术都收集相同的数据，也无法提供预防、检测和响应潜在威胁所需的保真度。在\
  \ IT  背景下，许多技术和系统默认仅记录最小程度的日志，需要更改基础配置以收集最有价值的数据。\n\n同样，公司网络上的大部分活动超出了单个应用程序或服务器基本日志功能的范围。理想情况下，企业应该积极监控其网络流量，试图识别潜在威胁或入侵的异常和指标。例如，向异常服务器传输的加密流量、经过用于构建服务的系统的关键知识产权数据，或员工手机连接到关键命令与控制服务器。\n\
  \n行为分析和机器学习工具越来越具有价值，它们可以检测出人类难以察觉的细微异常行为。即使网络活动没有违反规则或看起来明显可疑，偏离正常网络的行为也可能成为存在不法活动的提示。\n\
  \n详细的文件访问日志、用户账户日志、文件历史日志、归档的网络流量数据和其他指标，也是数据泄露响应人员极具价值的信息，帮助他们确定哪些数据可能被泄露以及是由谁泄露的。企业对其安全信息和事件管理\
  \ (`SIEM`) 能力进行投资也将受益匪浅，使其安全人员能够更好地将企业关于网络活动的大量数据与潜在威胁或可疑活动关联起来。\n\n### 身份与访问的可见性\n\
  \n\n\n\n身份和访问的可视性在许多方面是网络活动可见性的子集。《2018 年 Verizon 数据泄露报告》指出，使用受损的凭据是攻击者在网络安全漏洞中利用最多的行为，紧随其的是其他身份相关的泄露，包括特权滥用。用户凭据虽然与用户或个人相关，但其实际的作用与你的汽车或房屋钥匙非常相似。将酒店比作云服务的物理世界类比：你可以进入自己的房间，但无法进入酒店保险箱或建筑控制系统。相反，尽管钥匙可能被分配给你，但任何拿到钥匙的人都可以像你一样轻松进入你的房间。为了妥善管理访问，你首先需要知道发给了你多少钥匙，并确保如果你的朋友想用钥匙，你可以确保他们确实是使用者。\n\
  \nIT 身份验证尝试的可视性同样重要。访问尝试是从分配的用户家中发出的，还是来自俄罗斯农村一个偏远的小镇？他们是在尝试访问通常的邮件数据还是关键财务数据？这些因素可以帮助企业判断凭据是否确实由其预期的人使用。对此类信息的可见性可以帮助企业确保只有那些应该访问关键信息的人才能获得访问权限。\n\
  \n## 结论\n\n关键技术构建模块的可视性对于企业充分防御其系统的能力至关重要。保护网络已经足够困难——如果没有对网络上的设备、代码、活动和访问进行适当的可视化，这几乎是不可能的。就像几乎任何学科一样，你掌握的信息越多，识别和应对威胁就越容易。\n\
  \n## 关于贡献者\n\nMichael Chertoff – 前美国国土安全部部长\n\nMichael Chertoff 领导着 Chertoff Group，这是一家全球咨询服务公司，通过应用安全专业知识、技术洞察和政策情报，帮助客户建立韧性组织、获得竞争优势并加速增长。在此职位上，他为全球客户提供如何有效管理网络安全风险的建议，同时结合人员、流程和技术的合理组合来实现其安全目标。他担任几家安全公司的董事会成员，并是安全和风险管理问题的频繁演讲者。2005\
  \ 年至 2009 年期间，Chertoff 担任美国国土安全部部长。在职业生涯早期，他曾担任美国第三巡回上诉法院的联邦法官，以及美国司法部刑事局局长。他是书籍《爆炸的数据：在数字时代夺回我们的网络安全》（*Exploding\
  \ Data: Reclaiming Our Cybersecurity in the Digital Age*, Atlantic Monthly Press,\
  \ 2018）的作者。\n\n## 20/20 洞察：重新定义可视性以打击现代犯罪集团\n\nTim Crothers, Target*\n\n在所有网络安全基础知识中，可以说是可视性让首席信息安全官（CISO）及其团队在努力追赶安全和威胁创新的速度。尽管没有某种“银弹”可以用来维持这种速度或达到最佳可视性水平，但视角的细微转变可以提供帮助。通过不将自己局限于可视性的传统定义，我们能够重新想象可视性的含义，这种方式不仅有效得多，而且更加高效并更符合现代网络安全。\n\
  \n我们许多人长期以来使用的类比是，可视性就像监控摄像头：我们知道网络中既有正当活动也有恶意活动，而可视性是我们部署的区分这两者的机制。在 20 世纪 90 年代后期和\
  \ 21 世纪初，这完全合乎逻辑。我们的企业 IT 系统通常与互联网或其他外部系统的连接非常少且非常特殊，因此可视化能力可以集中在组织环境的边界，就像前线的哨兵塔一样。\n\
  \n但随着个人设备开始被大量利用，组织停止在自己的数据中心托管 IT 并转向云服务，产品团队开始开发容器化应用程序，其中多个不同的业务系统可以共享单个 IP 地址；可视性的基本原则和实践必须改变。但仅仅因为需要这种变化，并不意味着它一定发生了——或者说它改变得足够充分、足够快。直到\
  \ 2000 年代中期，我们用于实现可视性的机制简单再无法在现代 IT 基础设施中提供清晰的可视化了。尽管许多组织在更新可视化能力方面落后了，但网络犯罪分子在更新其方法方面绝没有落后。\n\
  \n认识到这一现实揭示了关键的人性动态，而这些动态在主要关注技术的网络安全讨论和决策中时而会被忽视。当我们开始结合对人类行为的更深层次的理解时，我们发现我们使用那些技术的能力——甚至我们选择使用哪些技术——发生了巨大的变化。\n\
  \n我们的对手一直必须快速演进战术和能力。我们知道安全供应商正在不断改进防御。而且他们所犯的犯罪是他们的业务，所以他们没有奢侈使用数年前的方法。\n\n网络犯罪分子就像按\
  \ 100% 佣金工作的销售员。如果他们没有成功窃取，就没有饭吃——所以他们处于持续不断的、无情的攻击和迭代状态。他们的焦点像激光般锁定在实现发现并窃取可变现信息的目标上——没有审批流程、项目积压、季度预算和目标或任何其他业务目标来减慢他们的速度或分散他们对单一目标的注意力。而企业组织努力建立“学习文化”，成功的网络犯罪集团则以此为理所当然的。\n\
  \n结果，那些落后或未能意识到维持创新速度必要性的组织发现，他们不仅在自身网络中部署的实际技术上落后于趋势，而且在威胁者及其使用的攻击方法上落得更远。\n\n\
  遗憾的是，许多组织甚至没有看到或考虑其后果。从 2012 年（云部署真正兴起）到 2014 年（更多组织开始转向敏捷开发模式），IT 经历了转型，而许多安全团队维持着以网络主机和应用程序模型为中心的老方法。这为攻击者创造了可以利用的巨大差距。\n\
  \n随着 DevOps 方法变得更加普遍和更加敏捷，这种差距变得越来越大。试图使用旧模型拉取所有数据进行模式匹配的信息安全团队很快发现，这种方法无法扩展。数据量太大了，移动得太快了。与其在草堆中寻找针，他们发现自己现在是在成千上万个动态生成的草堆中寻找针，这些草堆的寿命只有\
  \ 15 分钟，然后就消失。\n\n\n\n\n\n这在很大程度上取决于我们选择观察哪里——以及一种理解，即在涉及到可见性时，更多并不等同于更好。更好才是越好。这就是为什么，为了提高可见性，我们必须首先关注攻击者的需求。\n\
  \n### 理解攻击者的需求\n\n如果我们了解网络犯罪分子成功所需的条件，就能知道他们需要执行哪些活动。例如，如果目标是窃取知识产权，大多数攻击者会从恶意邮件之类的开始。但如果他们成功了，那仅仅是他们的开始。虽然诱骗用户点击恶意链接并在其笔记本电脑上安装恶意软件相对容易，但该用户极可能无法直接访问攻击者想要窃取的知识产权。\n\
  \n攻击者获得了一个脆弱但通常并不重要的系统的访问，但必须横跨网络来获取他们真正寻找的东西。这了权限提升和横向移动的过程。大多数黑客实现这一目标的方法是收集本地缓存的凭据，并利用这些凭据遍历整个环境。\n\
  \n在这里，我们看到了重新定义可见性的力量：它不再仅仅是像安全摄像头那样被动地观察能力，而是一个不断发展的过程，通过开发洞察并基于这种深层次的理解采取行动。\n\
  \n### 战略防御与欺骗\n\n了解攻击者在追求什么使我们能够从持续的“打地鼠”式防御，转变为更具战略性的攻势活动。当我们理解了他们正在寻找本地缓存的凭据以及寻找的原因时，就可以设置一个陷阱。我们可以在本地主机上运行一个脚本，缓存虚假的管理员凭据——因为知道收集凭据没有任何合法的业务用途——并等待他们上钩。已经访问网络的网络犯罪分子在尝试之前，没有办法知道所捕获的凭据是否有效，而当他们尝试时，就会触发一系列警报和故障保护机制，阻止他们进一步行动。\n\
  \n这些通常被称为欺骗技术（deception techniques），但它们恰属于我们今天需要的这种战略性的、基于情报的可见性类型。如果可见性不是为了检测威胁以减轻损害的能力，那么它的意义何在？\n\
  \n对于那些在可见性技术上已经落后的组织来说，这种类型的安全活动可能遥不可及。但通过对他们所需的安全能力获得更具可操作性的洞察，将帮助他们比任何任何都更有效、更高效地弥补这一差距——而且重要的是，成本更低。\n\
  \n### 情报的力量\n\n庆幸的是，实现这一目标有一个明确的第一步：从情报开始。从情报开始。然后，再次从情报开始。虽然大多数组织无法负担请一个资深的前“三字母机构”特工团队来为他们收集威胁情报，但对于各种规模的公司来说，知识分享并不缺少。由于对于遭受攻击的组织来说，公开说明发生的情况是一项令人沮丧且适得其反的法律责任，共享信息通常需要一对一的沟通。一份简单的相互不披露协议将允许组织进行更开放的交流。此外，还有许多组织和同行小组致力于报告和评估威胁趋势。这里的关键在于不要看细节，而要看被利用的模式。威胁活动者的主题是什么？随后，这对你的组织意味着什么？威胁活动者也是人。作为人，他们和我们所有人一样，会有习惯和模式。\n\
  \n通过这种知识和情报驱动的可见性方法——知道在看哪里以及寻找什么——安全改进将是巨大的。例如，如果你是一家连锁餐厅，而你看到像 `Carbanak/FIN7`\
  \ 这样庞大的网络犯罪集团正系统地通过钓鱼邮件攻击你行业的其他公司，这些邮件带有具有强混淆和反沙箱能力的恶意 `JavaScript`，那么你对这类攻击的可见性将呈指数级增长——而且通常是零外部成本。研究那些通过窃取来维持生存的网络犯罪分子战术，可以揭示你可以用来更有效地防御自己组织的模式。\n\
  \n### 主动可见性\n\n先知杜缪胜于未然——因为拥有更好的威胁可见性使你能够构建并部署一系列低成本且高效率的预防、检测和响应能力。这种更深层次的洞察还将使你能够更有效地优先考虑你的安全需求：你将对黑客使用的最新技术、特定类型的恶意软件和工具，以及黑客如何对目标组织进行渗透的方法有更细粒度的知识。通过与战略合作伙伴、利益相关者以及竞争对手共享知识——因为针对你垂直领域内另一公司的网络犯罪绝不应被视为竞争优势——其他东西开始显现，并将网络犯罪分子的主要属性反用于他们。\n\
  \n威胁活动者之所以有效是因为他们的韧性。由于他们精疲力竭、孤注一掷的模式，他们必须不懈地攻击。但在每次攻击之前，必须进行大量的准备工作——包括创建钓鱼邮件、专门针对目标设计恶意软件以及为命令控制服务器注册域名等其他准备工作。尽管他们看起来是无情且无穷无尽的，但攻击者也是人——他们不断地重复相同的任务和操作。这意味着他们不可避免地陷入了模式中。他们注册域名时使用的假名会被重复使用或开始变得相似；域名揭示了他们计划攻击哪家公司的线索；他们通过将恶意软件上传到\
  \ Google 的 `VirusTotal` 或类似的仓库来精调恶意软件。对之前的攻击进行严谨的数据分析揭示了这些模式。组织分享的知识越多，他们识别这些模式并从被动状态转变为主动状态的能力就越大。\n\
  \n那种知识共享和协作不需要任何成本的——而且对整个团队的态势感知具有光环效应，这是提高可见性的另一种形式。而且它不仅限于外部利益相关者。\n\n### 内部协作\n\
  \n所有组织都应该确保没有产生效率低下的或盲点的内部孤岛。安全团队构建的网络可见性框架织物可以被网络团队用于故障排除，被运营团队用于审查性能，并用于一系列其他用途。同样，几乎所有组织都有运营或开发团队使用的数据馈，安全团队可以用不同的方式利用这些数据，这些数据能对应用程序和系统的使用情况产生巨大的洞察。洞察只是可见性的另一种说法。\n\
  \n尽管与跨行业和跨组织的安全团队合作是有益的，但与公司的非安全团队协作也有巨大的益处。对于必须在预算和分配上审慎的业务来说，这不仅可以获得更好的安全结果，而且是对组织资金更明智、更高效的使用。在确定你需要什么可见性之前，首先检查你已经拥有哪些可见性——它可能比你想象的要多。\n\
  \n在技术驱动的文化中，很容易陷入一种只看到巨大飞跃式进步的思维方式中。这些跳跃是令人兴奋和满足的——特别是对于那些分配预算并寻找可靠投资回报的人来说。但它们很快会导致收益递减——或者更糟，产生虚假的安全感。\n\
  \n\n\n\n单纯为了可见性而追求更高水平的可见并不等同于更有效的安全。事实上，过度的可见性可能会让你更难清晰地看到最危险的威胁。浪费时间和精力查看无关数据，只会为犯罪分子提供更有效地“在眼皮底下”隐藏的能力。可见性的渐进、稳步增长不仅是可行且值得赞赏的——它们还可能带来更好的安全性。如果这种增长是由洞察和理解驱动的，即使可见性从\
  \ 1% 增加到 5%，也能带来显著优的结果。\n\n这种观点和方法将成为可见性领域更加基础的基础。随着越来越多的 IT 团队利用开源技术以及新的业务系统和基础设施方法，我们现在看到的这种速度将继续增加。随着这种变化速度的加快，我们从过去的证据知道，对手会竭尽全力跟上这种速度。比其他事情最重要的，威胁攻击者在跟赶竞赛中击败防御者的能力，成了我们最大的风险。阻止他们的关键在于理解他们要去哪里以及他们计划如何到达那里。使用新的可见性方法在他们到达之前将其切断，可以成为那场竞赛中的关键工具。\n\
  \n## 关于贡献者\n\nTim Crothers – Target 网络安全副总裁\n\nTim Crothers 是一位资深安全领导者，拥有超过 20 年构建和运行信息安全计划、大型复杂事件响应和入侵调查，以及威胁和漏洞评估的经验。他在网络威胁情报、反向工程、计算机取证、入侵检测、入侵防护以及应用六西格玛方面拥有深丰富的经验。他目前担任\
  \ Target 网络安全副总裁，致力于通过创新的技术和方法推动安全、检测和响应以及红蓝。\n\n### 可见性的挑战\n\n*Daniel Hooper, PIMCO*\n\
  \n今天大多数组织面临的首要挑战不仅是处理已知的（如 `WannaCry` 这样的威胁），还有处理未知的。由于技术的泛滥，网络中数据所在的位置变得复杂。\n\n\
  ### 可见性不仅仅是技术\n\n首席安全官（CISO）面临的主要挑战之一是预见即将到来的变化。实现这一点不仅需要技术，还需要接入业务的正确领域并与各个部门建立关系。\n\
  \n### 与利益相关者建立关系\n\n与公司管理层建立关系通常可以让你洞察他们所需的资源以及他们的开发计划。这包括参与指导小组和委员会，并与评估云供应商的职能负责人建立关系。\n\
  \n### 胡萝卜与大棒\n\n\n\n\n\n应对这一挑战需要采取“胡萝卜加大棒子”并行的策略。通过让管理层了解共享信息可以让他们获得让工作更轻松的 IT 服务（如单点登录、多因素身份验证、联邦\
  \ ID、用于跟踪登录的 `Active Directory Services`、技术集成、加速新技术或服务的审批等），从而让你能够跟上新技术和资源的步伐。\n\
  \n“棒子”不需要太严厉。从教育人们开始，告诉他们为什么不能仅仅因为操作简单就随意启动一个新的聊天程序。向他们解释保护员工和客户信息的责任，并让他们明白任何安全疏漏都是大家的问题。帮助他们理解为什么在提出需求时需要寻求技术团队。\n\
  \n促进这一进展的一种方法是将安全团队的成员整合到各个业务部门中。这有助于你的团队直观人们采购了什么以及为何采购，并可以帮助防止一些糟糕的意外。同时，可以从这些团队中精选出领先的开发者，邀请他们与渗透测试人员并肩坐，这样他们就能看到自己正在开发或订阅的应用是如何被黑掉的。没有什么比看着某人实时拆解自己的应用程序更能让开发者迅速投入其中。对业务人员也可以采取同样的措施。让他们熟悉安全如何影响他们所分享的信息，将是非常赋能的。\n\
  \n## 升级你的安全团队\n\n我做过的一件事是减少技术人员的招聘，转而聘用能够与业务沟通的人才。虽然我以前聘用红队成员和黑客，但我现在真正需要的是具有某些技术背景的人，让他们让他们站在部门负责人面前进行业务层面的对话。例如，我需要有人能用业务语言解释我们为防止国家级和企业内部人员窃取或攻击我们企业数据的努力，而不是使用技术术语。\n\
  \n这导致了双管齐下的 IT 团队，采用集中化和去中心化的模型：\n\n1. 集中化 IT 团队提供经典的安全支持：\n* 负责补丁、维护、环境清理等的核心团队。无论网络变得多么先进，公司总在运行一些遗留设备，并结合补偿性措施来保护其底层的漏洞。\n\
  * 该团队负责确保网络持续符合公司和监管要求，了解环境中部署了哪些设备，持续监控安全态，并配置和管理已部署的安全及相关设备。\n\n2. 分布式 IT 团队与人打交道：\n\
  * 这需要专家能够协调、整合、制定报告方案，并在业务层面响应事件和请求。他们还承担着学习用户日常操作的任务，以便识别恶意行为者的指标。\n* 他们还管理着“胡萝卜加大棒子”的策略。他们的工作不仅仅是用政策来惩罚人们，还要让他们对信息安全如何与其角色相关而感到兴奋。\n\
  \nIT 团队与各公司部门之间的这种互动需要是双向的。\n\n## 安全技术如何？\n\n安全等式的另一半是你投入后端的安全防护。要记住，安全不是一个功能，也不是一个产品。安全漏洞的存在是因为你部署的某个或多个产品中存在根本性错误。安全技术需要做两件事：它需要补偿设备或系统固有的缺陷，并且它需要提高可见性。\n\
  \n最大的挑战之一是你能够实现的可见性范围。跨越整个内部网络范围的单点视图可见性更消耗产品和人力，但如果你不想落得像 Equifax 那样的下场，这是必要的。\n\
  \n`WannaCry` 是一个完美的案例。五月的一个周五下午，我们开始看到关于新威胁的新闻报道。我们检查了 `Wikileaks` 和其他来源（好吧，我们是极客，喜欢看这些东西），但我们还没有意识到这是蠕虫式恶意软件。一旦我们意识到并下载了适当的补丁，我们实际上花了大约五天时间才找出环境中所有需要打补丁的设备在哪里。\n\
  \n我们无法立即理解部署了哪些资源以及它们位于何处，这凸显了我们更及时地获取关键信息的需求。这需要在我们所有的桌面电脑和 `Windows` 服务器上投资并部署新工具组合。那是简单的一部分。为\
  \ `Linux` 服务器实施类似的解决方案花费了更长的时间。而且对于 `Solaris`、`Oracle`、`Hadoop` 和类似技术，仍然没有简单的解决方案。在这些情况下，解决方案变成了一种昂贵的补偿性安全技术的组合。\n\
  \n显而易见的是，组织和供应商都需要在人员、时间和产品上投入更多资金，以实现更快速的威胁识别、针对缺失补丁的环境查询以及漏洞行为识别。\n\n## 能力重叠的挑战\n\
  \n创新是酷的。使用用户和实体行为分析 (`UEBA`) 跟踪用户行为目前非常火热。但我们现在开始看到随处都有这种功能。挑战不在于产品的整合，而在于工具的功能重叠。\n\
  \n同样，某些邮件网关现在已经添加了内置型数据泄露防护能力，以帮助组织识别潜在的内部威胁。但其他解决方案也构建了该技术。对于其他在同一台机器上同时运行且重叠竞争的安全技术也是如此。某些技术甚至在运行\
  \ `PowerShell` 脚本时互相拦截，这导致必须在内部对你实际拥有的技术进行白名单。随着这些技术开始相互干扰，它们实际上会让 CISO 团队感到混乱，需要更多资金来许可额外的功能，而这些功能仍然无法提供完整的端到端解决方案。这意味着在教育、培训和额外解决方案上的支出更多。\n\
  \n## 阻碍完整解决方案的问题\n\n部署全面安全策略最大的挑战在于，无论从人员还是技术角度来看它都是昂贵的。我最近聘佣了一个人，仅仅是为了监控 `Qualys`\
  \ 然后将数据整合在一起。并不是每个人都愿意每年花费几十万美元来做这些。组织可以很容易地说该服务实际上没有连接到网络，或者我们已经有了补偿性措施。结果，某些领导者可能看不到此的价值。\n\
  \n技巧在于与你的团队建立优先级。首先从处理好基础和原则开始：我们进行扫描吗？这包括手机和会议室电脑吗，还是仅包括核心资产？到此为止吗？新闻中最近的一起泄露分析指出，黑客在运行\
  \ `Windows XP` 的打印服务器上收集数据，然后将其存储在那里最后进行外泄。不幸的是，运营团队拥有那台打印机，所以他们没有检查。目前仍然需要知道设备归谁所有，建立定期的扫描流程以及在出现问题时知道该联系谁的协议。\n\
  \n\n\n\n\n当然，这说起来容易做起来难。要确保你始终在扫描正确的内容，或者确保你拥有并部署的所有设备都经过定期清点和分析，是众所周知的困难。此外，维护你发起的任何程序和相关工具也至关重要，除非它们被更好或更全面的解决方案所取代。最近，在投入大量精力保护移动设备后，我们松了劲了。最近的扫描显示，我们现在有许多不合规设备。这很容易发生，甚至在你自己的团队也是如此。只需将注意力转移到火的问题上，而让其他问题在背景中冒烟，你就会发现自己正在多线作战扑灭洪水。\n\
  \n### 实现动态平衡\n\n可见性以及与其相关的身份和访问管理问题是一个巨大的投资领域。遗憾的是，威胁管理解决方案的投入往往超过了它。这就是为什么首席信息安全官（CISO）最关键的工作之一是在人员、技术和承包商之间平衡支出——例如管理顾问、专业服务和渗透测试。然而，如果已经配备了适当的工具和控制措施，许多卫生工作可以非常有效益地外包，因为这些功能是可重复且易于衡量的。这允许你调整人员和技术的资源模型，从而将有限的人力资源重新分配给高阶活动，并随着技术的收敛或新的、更容易整合到你现有安全策略中的关键工具出现时，调整技术方案。\n\
  \n## 关于作者\n\nDaniel Hooper – PIMCO 全球信息安全官\n\nDaniel Hooper 是一位丰富的信息安全专业人士，目前负责\
  \ PIMCO 识别、评估和管理信息安全风险计划的整体战略和方向。2014 年，他将该角色从技术改进扩展到与全球团队紧密合作，以管理监管预期、向客户沟通并向董事会提供资金支持。\n\
  \nHooper 此前曾在德勤（Deloitte）、Loop Technology、Infoshield、e-Secure、NETELLER 和 IBM 工作过。在德勤期间，他从澳大利亚业务部调往美国，在那里，他领导了从零开始建立企业级信息安全职能，开发了高层\
  \ IT 安全战略，为一家全球金融服务客户建立了 IT 风险管理计划，增强了现有的 IT 风险和控制自评估方法以使其与现有的公司风险管理计划一致，并参与了全范围的\
  \ IT 控制态现状评估，以确定与 IT 风险和安全相关的重点关注领域。\n\n# 10 检查\n\n![](img/c10uf001.png)\n\n检查是一项保障措施，允许安全团队通过发现潜伏的“已知未知”来预防性地阻止攻击：即你知道存在但不知道具体在何处的已尝试或已实现的网络入侵。当当时的科技精英承认他们掌握的知识没有预想中那么多时，挑战未经证实的假设，并积极寻找填补知识空白时，科学时代诞生了。当这一概念从科学方法论转向国家战略时，正如当时的美国总统里根简洁地所说：“要信任，也要核实（Trust,\
  \ but verify）。”虽然里根指的是利用严谨的手段——特种传感器和多源分析——来发现那些我们的敌手并无意让其被发现的内容，并确保普遍遵守武器条约，但任何严谨的网络安全从业人员都应该使用同样的的策略和方法论。对潜在的恶意网络内容进行严谨的检查——无论它是伪装在邮件附件中还是隐藏在合法流量中——都是网络安全战略的关键。\n\
  \n犯罪分子一直利用双重性、操纵和策略通过网络钓鱼获取访问权限。但现在，他们越来越多地使用多态恶意软件——即从未以当前形式出现过、为了规避检测而改变形式的附件。这意味着我们寻找已知模式的标准检测技术可能会漏掉这些。\n\
  \n相反，对这些附件进行更深层次的检查已成为应对混淆多态恶意软件的关键工具。具体来说，可疑附件会在被称为 `sandboxes`（沙箱）的封闭区域内接受检查，并在其中对其行为进行分析。沙箱已被证明是在入侵发生前中它的极佳手段。最复杂的沙箱会拦截其检查并发现为恶意的附件的传输，还会生成指标分发到网络上的其他节点。通过对邮件附件进行恶意性评估——在安全的封闭环境中执行它们，然后对其进行恶意性检查——安全运营人员可以清除并防止这些恶意附件到达目标。\n\
  \n### 加密流量（SSL） face 临的挑战\n\n我们该如何解决这个问题？我们不能给网络运营人员提供两个糟糕的选择：\n\n*   使用 `SSL` 解密所有内容但无法扫描恶意活动；或者\n\
  *   默认关闭 `SSL` 以实现网络所有者必要的可见性，从而放弃使用加密来躲避敌人的优势。\n\n这两种方案都是不可行的。但通常情况下，`SSL` 检查被关闭是因为网络安全行业很大程度上未能承认网络两个核心要素之一——速度（另一个是连通性）。在大多数情况下，网络安全架构师构建的能力将检查负担置于了过载的\
  \ CPU 上，并将通信拖慢到无法接受的。\n\n加密网络无意中为攻击者提供了他们启动和维持隐蔽控制网络内恶意节点所需的掩护。有了网络加密（安全套接层，或 `SSL`），那些检查分析几乎毫无用，因为位被扰乱成了无意义的字符串。尽管加密保护了合法用户的机性和完整性，并促进了此类用户之间的信息共享，加密也隐藏了恶意用户的活动，并为他们创造了路径。由此产生的风险不言而喻。由于无法检查，无处不在的加密使网络安全运营人员被迫“盲飞”，导致网络安全性无法衡量地降低。\n\
  \n\n\n\n这正是科学为我们服务之处：通过创建一种拥抱速度这一核心基础的检测能力。由于内容检测是一项基本的网络安全策略，计算机科学家和工程师能够且必须创建速度优化的方法来实现它。\n\
  \n随着国家级力量、网络犯罪分子和违职员工的技术日益泛滥，且他们试图隐藏在邮件附件和常规加密流量的噪声中，检测仍然是发现精心隐藏的隐蔽活动的核心工具。今天，检测的网络安全策略以及其包含的所有战术工具已变得越来越重要，实施起来也越来越困难。但仅仅因为困难，并不意味着它不值得做。\n\
  \n## 阴影内外：检测所提供的可见性不仅局限于技术本身\n\n*Ed Amoroso, TAG Cyber*\n\n任何关于检测安全原则的讨论都必须从理解以下一点开始：即检测意味着可见性。这不仅让检测与网络安全的总体使命和目的紧密相连，也符合其从参考监视演变为极其复杂的安全基础的演变过程。\n\
  \n在起初，网络安全比现在要简单得多。简单来说，用户请求访问资源，由某种形式的“安全机制”决定他们是否有权访问该资源。如果获得授权，就允许进入；如果没有获得授权，则将其拒之门。\n\
  \n在过去的几十年里，我们取得了巨大的进步，但这仍然是信息保护的核心概念。如果一切运行得完美，就不需要检测了——无论是作为一种普遍实践，还是为了在这个日益由数字技术连接的世界中应对由于不完美而产生的无尽复杂性。\n\
  \n这些复杂性的出现几乎是瞬间。在 20 世纪 80 代，我们这些在蓬勃的网络安全领域工作的人注意到，“允许访问或拒绝访问”这种二元安全决策往往会产生两个并非理想的额外结果：一个是，未获得授权的用户被允许访问；另一个是，获得授权的人被拒绝了。我们都查阅了用户手册，并最终确认这并不是它应有的工作方式。\n\
  \n结果，创新被催化了。检测应运而生。\n\n在一个快速发展且不断迭代的学科中，很容易陷入一种简单化的叙事，将一切描绘成对前代技术的指数级改进。事实更为复杂，且不那么线性。特别是检测的演进，揭示了网络安全最佳实践与其从早期起就在解决的结构性缺陷之间深层的相互联系。\n\
  \n卓越且富有远见的网络安全先驱多萝·丹宁（Dorothy Denning）推动了许多改变规则的创新——她直觉地预判了她称为“网络空间法外之徒”的新兴威胁。她在\
  \ 1975 年提出了《安全信息流晶格模型》，该模型至今仍在使用。20 世纪 80 代中期，她在 SRI 国际研究院期间，开发了一种入侵检测模型，通过收集审计跟踪信息来发现指示威胁的异常——这仍然现代安全系统的基础。直到今天，大多数网络安全系统都包含一个前端功能组件，通过接入信息来确定某些目标属性。检测结构化数据通常比检测非结构化数据更简单，但在大多数企业环境中，两者都至关重要。\n\
  \n随后的几年展开的创新过程——快速、进取且日益复杂——已经从最初简单的“是或否”的访问许可，扩展到通过日志文件收集数据，再到我们今天所拥有的。过去与现在的区别，就像轻木滑翔机的皮筋动力螺旋桨与波音\
  \ 777 GE90 喷气发动机之间的区别。它以你可以想象的所有可能方式取得了进展。\n\n网络安全创新的无缝性和连续性——所有创新都深度相互关联——往往使得人们难以确定特定的里程碑和转折点。但我们可能正处于一个将被视为根本性转变的转折点。\n\
  \n随着人工智能效率和能力的快速提高，我们看到机器学习已经很好地契合了整体网络安全目标，特别是检测目标。正如可见性对于安全至关重要一样，检测对于机器学习也是基础。\n\
  \n这是因为有效的机器学习取决于收集某物的大量样本，所有样本的变量都略有不同，然后教系统如何考虑这些差异。如果我们输入 1,000 张不同的猫咪照片，然后输入一张它从未见过的猫的照片，机器学习允许系统推断出：“这与已接入的信息一致；它是一只猫。”\n\
  \n同样，我们现在可以通过检测和接入样本，并利用机器学习的力量程序程序系统来识别病毒：“这是一个病毒，它位于一个名为 `malware.exe` 的文件中。它具有这些属性。”AI\
  \ 可以识别出，如果 `malware.exe` 具有这些属性，那么包含在 `malware.exe`、`1malware.exe` 甚至 `zebrasam.malware.exe`\
  \ 中的相同属性很可能同样指示恶意软件。\n\n得益于杰弗里·辛顿（Geoffrey Hinton）的推动以及他在多伦多大学在人工神经网络领域的突破性工作，基于广泛的检测样本来检测和正确评估变体，使得基于\
  \ AI 进行判断的能力成为可能。这与旧方法相比是一个巨大的飞跃——旧方法是在终端应用安全防护，通过针对所有可能的恶意软件文件名和位置缓存的海量列表对信息进行解析。\n\
  \n然而，AI 并不是安全的“万灵药”。运行这些算法需要巨大的计算能力，这就是为什么许多公司在云端处理样本，并根据机器学习进行渲染。尽管 AI 已经非常先进——并且其力量和复杂性将继续增长——它仍然始于最初的接入和检测过程。\n\
  \n最终，大多数机器学习都涉及人类向检测引擎输入数据——因此它仍然容易受到检测固有的障碍的影响。某些障碍源于技术。而且，根据贯穿网络安全历史的另一个线索，某些障碍与个人用户和组织的自然人性缺陷密不可分。\n\
  \n从技术角度来看，妥善检测的主要挑战是，由于视角问题或通过加密或掩码实施，直接观测并不总是可能的。一个例子涉及互联网上 HTTPS 的使用增加，这减少了检测网络数据包的采集表面。检测的互补挑战是，间接观测需要授权信息流通过中间件进行。一个例子涉及查看事件日志以确定某些目标系统的属性；这在本地访问策略下可能是不允许的。\n\
  \n进一步使挑战复杂并使检测变得指数级困难的，是检测与另一个安全基础之间的关系。\n\n\n\n\n尽管经常有相反的说法，但加密学确实增加了检查的复杂度——事实如此。事实上，加密学的教科书目标是将检查范围缩小到那些经过适当授权了解解密过程和机密的人员。至少，这引入了在任何检查之前提前获取这些信息的负担；最极端的情况下，它可能让检查变得不可能。一个例子是许多安全团队希望在网络中实施的“线缆”（bump-in-the-wire）处理。在这些采用加密的情况下，为了摄取任何有用信息，在该检查点处需要进行密钥管理的解密。\n\
  \n## 技术与结构性挑战\n\n尽管检查在技术方面具有挑战性，但与经常出现的许多人际问题相比，这些挑战可能显得相形见��。首先是开始时所需的清晰度，这要求一套详尽的分类法。是谁在进行检查——是制造商或构建者检查已构建的内容；是检查自身行为的程序；还是更常见的情况，如网络分接器或数据包嗅获器之类的检查设备正在收集某些外部的信息？检查的是什么——数据是结构化的还是非结构化的，是静态的还是快速移动的？它是清晰的、加密的、掩码的还是模糊的？仅仅这些基本因素——单单这些，更不用说它们所有可能组合的变量和排列——就能产生巨大的复杂性，必须建立并应对这些复杂性。\n\
  \n然后人为因素介入了，这让一切变得复杂得多。\n\n## 监控困境\n\n事实是，检查是一种监控，这一点不可避免。与其他形式的监控一样，它的部署方式引发了巨大的问题、担忧和不安。执行检查的人如何回答关于部署的问题，是决定其有效性的一个不可置信的因素——往往以他们没有预到的方式。\n\
  \n随着检查向外扩展，这些担忧也随增加。当然，外部检查面临着巨大且显而易见的挑战。安全团队判断内部用户是否使用了双重身份验证很容易——只需进入身份访问管理系统并提取日志即可。但供应商、供应商和其他第三方是不允许的，这使得间接检查变成了一种困难且高风险的信任练习，组织必须相信第三方的口言，他们他们遵守安全协议。快速查看许多引发头条新闻的泄露事件就可以发现这种方法是多么地无效。在企业级层面，供应商的供应商也有供应商，形成了一个日益难以检查的风险链。\n\
  \n## 内部因素与影子 IT\n\n安全团队通常理解这些动态。较少被认知的是使内部检查实践复杂的人为因素。然而，如果将术语替换为“员工监控”，复杂程度就会变得清晰一些。例如，如果检查是在流量层进行的，风险就很小，因为很少有人受到记录访问某地流量的\
  \ IP 地址和位置的影响。检查越得越深，出现的问题就越多。\n\n但即使在每位员工的 PC 上安装检查每次击键的监视软件，也存在着大量的变量。如果员工在呼叫中心工作，接听电话处理特定范围的客户服务、销售或其他问题，那么可能完全没人在意。\n\
  \n但在大多数企业中，人们使用 PC 进行创意工作、写作、研究、演示文稿制作或任何涉及独立思考的工作，考虑不周或执行不当的检查技术可能会产生真实问题，并使网络变得不安全。\n\
  \n这类工作环境中的员工在意识到 IT 部门运行监视软件时，他们的第一件事就是获取一个 `Gmail` 或 `Dropbox` 账户，以隐藏他们想要保持私密的任何活动迹。这可以是从搜索\
  \ Google 或在社交媒体上消磨时间，到发送个人邮件，再到在 `LinkedIn` 上申请新工作。他们习惯了在工作和个人 PC 之间拆分活动，这已经由于工作与生活边界的侵蚀和自带设备（BYOD）而变得常态化。无论是为了秘密还是效率，专有信息开始通过个人账户甚至内存盘从组织中流出，没有任何线索痕迹，甚至没有正在发生的迹象。\n\
  \n结果是一个极其脆弱的影子 IT 基础设施，它创造了一个巨大的“未知之未知”网络，以及一种根深蒂固的数据使用模式，使得保护网络变得几乎不可能。一个完全处于检查范围之外的第二个计算环境开始增长。如果有人认为情况不是这样，欢迎来到地球星球。\n\
  \n## 透明的前行之路\n\n避免这种情况的方法是，确保你所做的检查和监控是在操作系统的内核 API 系统调用层进行的。这意味着必须向员工清晰且透明地解释这一点，他们通常认为检查意味着\
  \ IT 团队会读他们给妈妈或配偶的邮件——而不是寻找高级持续性威胁的迹象。这是一个根源于人性真相的误解。\n\n检查与所有形式的安全一样，是取决于上下文的。人们对于在家里或办公室使用安全工具的想法，与对凌晨\
  \ 2 点地铁站平台监控摄像头的感觉完全不同。IT 团队必须以利用这种人性的方式来解释——并重要的是，部署——检查工具和技术。\n\n应该帮助并鼓励员工理解，大多数泄露事件是他们无法检测的——当恶意软件通过他们的\
  \ PC 外泄数据时，检查工具将为他们清白。这涉及到对检查的根本性重新定位，将其视为保护员工的东西，而不是侵犯他们隐私的监控技术。\n\n无法为透明使用检查提供清晰且有力的论点的组织，面临着失去所有数据的风险——这些数据将变成影子状态，即使是最强大、复杂的\
  \ `AI` 和机器学习创新也无法触及。检查是缓解我们面临的日益的安全风险的基础且强大的工具。但无论它在检测和识别技术风险方面变得多么强大，我们永远不能让它忽视它可能产生的人为风险。记住，检查意味着更大的可见性。这种可见性不应该——也不需要——仅仅局限于它所保护的网络，甚至是员工本身。它还应该对其部署可能催化的行为和反应产生更深刻的洞察。就像网络安全一样，最有效的检查技术始于对问题的识别，并提供一个缓解而非加剧问题的解决方案。\n\
  \n## 关于贡献者\n\nEd Amoroso – TAG Cyber LLC 首席执行官\n\nEd Amoroso 领导着 TAG Cyber，全球网络安全咨询、培训、咨询和媒体服务公司，支持全球数百家公司。他最近从\
  \ AT&T 退休，在那里工作了 31 年，始于贝尔实验室的 `UNIX` 安全研发，并在 2004 年至 2016 年担任 AT&T 的高级副总裁兼首席安全官。\n\
  \nAmoroso 是六本网络安全书籍的作者，并在同行评审和主要出版物上发表了数十篇主要研究和技术论文及文章。\n\n\n\n\n他拥有迪金森学院的物理学学士学位，以及斯蒂文斯理工学院的计算机科学硕士和博士学位，并毕业于哥伦比亚商学院。他在网络安全和媒体技术领域拥有\
  \ 10 项专利，曾担任 M&T 银行董事会成员以及美国国家安全局顾问委员会（NSAAB）成员。他曾与四届总统政府合作，负责国家安全、关键基础设施保护和网络安全政策方面的工作。\n\
  \n# 检查的根本性\n\n*Michael Johnson, Capital One*\n\n在科学中，理论由随时间收集的事实支持。这意味着，仅仅`assert`（断言）某事是真的是不够的，你必须`provide\
  \ evidence`（证明）它是真实的。科学方法在我们生活的每个方面都大有益。\n\n这种方法对于网络安全也同样至关重要。通过适当的网络分、最小权限访问控制、密钥管理、强端点管理、多因素身份验证和加密来正确构建你的环境是一回事；你还必须假设人们不可避免地会犯错，从而落入攻击者的陷阱，并且网络对手会试图隐藏在网络噪声中，或尝试利用当今架构、系统和流程的复杂性。\n\
  \n我们可以做出这些假设，是因为从自古以来，犯罪分子一直生活在阴影中，而他们的交易工具往往隐藏在显眼处。恶意网络分子也不例外。例如，在网络空间中，恶意代码通常隐藏在电子邮件附件中。此外，对手利用网络自身的特征——加密以隐藏其活动，甚至使用如\
  \ `Windows PowerShell` 等原生系统命令——来模糊其活动并规避检测。\n\n## 定义检查\n\n检查是一种防御策略，旨在检测和识别网络内部的威胁，从而提供及时的拦截手段。这些威胁可能包括对手或未经授权的用户、违规痕迹（未经授权的访问或未经授权的资产，无论是硬件还是软件），或发生在环境内的未经授权活动（作为潜在受侵害的指标）。\n\
  \n检查是任何网络安全策略的根本方面。机构定期检查进出（或频率较低的跨越）网络的内容，寻找隐蔽命令与控制活动的证据、如金钱和知识产权之类的被盗资产，以及恶意内部人员。\n\
  \n然而，实施全面的检查策略面临着两个实质性挑战。第一是寻找已进入环境中对手迹象具有具有后性。当你识别出恶意行为者时，可能已经造成了重大损失。第二是实时检查跨环境的每一比特信息所不可避免的网络性能下降。这些限制可以通过采用技术和手段来解决，以提高性能并缩小泄露与检测之间的差距。\n\
  \n## 检查技术\n\n可以使用多种技术、手段和策略实施检查。网络安全控制和主动安全安全旨在应对组织可能面临的各种网络威胁，并识别可能存在于系统中的任何对手：\n\
  \n* `Cybersecurity controls`（网络安全控制）提供保护和防御措施，以避免、对抗或减少由于针对相应漏洞攻击导致的数据丢失或网络可用性降低。大多数网络安全控制涉及对内容的主动检查。\n\
  \n    网络安全控制有多个阶段，必须作为有效策略的一部分进行实施。它们包括\n\n    * 预防性控制，防止对手或未经授权的用户访问基础设施或数据。\n\
  \    * 检测性控制，识别环境内的威胁，提供及时的拦截手段。这些威胁可以包括对手或未经授权的用户、违规痕迹（未经授权的访问或未经授权的资产，无论是硬件还是软件），或发生在环境内的未经授权活动（作为潜在受侵害的指标）。\n\
  \    * 补偿或缓解控制，旨在确保系统设计意图或原始控制的实现。\n    * 审计控制，确保保护要求或“护栏”已建立并按预期运行。\n    * 监控控制，提供了解原始控制何时失效的早期手段。\n\
  \n* `Active cybersecurity capabilities`（主动网络安全能力）用于识别可能已经渗透我们系统的对手。我们通过以下策略使用这些能力：\n\
  \n    1. 追溯（Hunt）：迭代搜索网络和数据集，以检测规避现有控制的威胁。\n    2. 欺骗（Deception）：了解对手的策略、技术和程序（TTPs），然后通过蜜罐和其他形式的欺骗来误导并影响他们的行动，以方有利。\n\
  \    3. 反情报（Counterintelligence）：关注组织的高价值资产，专门寻找已知对手的 TTPs。\n    4. 取证（Forensics）：从受侵害中收集并保存证据，以理解对手对漏洞的使用，从而确保任何被成功使用的方法都不会再次成功。\n\
  \n## 内容检查\n\n对内容的深度检查进一步扩展了寻找入侵者或恶意资产迹象的传统检查策略。它涉及捕获跨网络传输应用程序、交易或工作流的数据包，并分析其内容以寻找恶意行为模式和敏感数据。\n\
  \n内容检查分为两大大类：静态分析和动态分析。静态分析包括识别妥协指标，而动态分析则在多个细节级别进行，例如指令跟踪或在沙箱中观察到的执行副作用。\n\n新工具和技术对内容和数据的检查产生了强烈影响：\n\
  \n* `Machine learning`（机器学习）利用静态分析和动态分析，通过识别有关被分析代码和内容的额外统计信息获得最佳结果。美国能源部国家实验室的研究表明，同时使用静态和动态分析的机器学习性能比仅使用其中一种更好，并且通常能比基于特征的防病毒软件更有效地检测零日恶意软件（见\
  \ `https://arxiv.org/pdf/1404.2462.pdf`）。\n\n\n\n\n\n- `Sandboxes`（沙箱）或“爆破室”应该是任何严肃的网络安全架构的一部分。几年前，它们成为一种重要的工具，用于检测隐藏在邮件附件、从网络下载的文件或应用程序中，或通过外部引入的内容或设备（如受感染的优\
  \ 盘）引入的恶意内容。通过对此类附件进行恶意性评估——即在安全的、受限环境中执行它们，然后检查其是否存在恶意证据——安全操作人员可以清扫并防止这些恶意附件到达其目标目标。\n\
  \n## 加密的挑战\n\n现在近四分之三的网络流量已通过加密，其中大部分使用 `SSL`。结果是许多正在使用的传统分析工具已几乎失效，因为需要揭露比特位被隐藏起来无法进行检查。虽然几乎每个人都认为更多的加密意味着更高的安全性，但\
  \ `SSL` 加密带来了一种权衡，导致网络运营商变得“盲目”。\n\n与检查加密流量相关的另一个问题是，考虑到当今数字业务环境的需求，大多数大多数解决方案都太慢了。缓慢的解决方案迫使网络运营商之间做出选择：要么放慢客户的通信速度，要么由于不检查部分或全部加密流量，而未能确保这些通信（及其他通信）安全的尽职调查。\n\
  \n网络安全厂商是此处的要罪魁祸首。太多的网络安全解决方案未能遵循互联网的组织原则：速度。没有速度的安全是一项注定失败的交易。用户希望安全是无摩擦的，当被迫做出决定时，组织几乎总是选择性能而非保护。\n\
  \n## 检查的未来\n\n检查的未来取决于关键资产和策略的发展。这包括增加对侧重静态和动态分析的机器学习的开发和采用、跨组织边界安全共享安全信息，以及通过消除对手以非意图方式使用字段或流的机会来对抗威胁。\n\
  \n在这者中，`information sharing`（信息共享）面临着最严峻的挑战。2015 年，美国国土安全部资助了一项关于跨组织边界安全信息共享的研究，旨在更方便、更快速地识别环境内的异常行为。如果我们不知道所看到的内容是由于特有的，还是遍布许多机构的类似攻击的一部分，那么分析数据包对我们毫无益处。\n\
  \n然而，为了实现这一点，我们必须设计更有效地利用跨组织观察的“网络效应”的方法，同时保护专利信息。遗憾的是，最大的障碍之一是许多组织认为共享（包括保护知识产权的重要性）存在固有风险，因此他们不共享。尽管有些公司正尝试开发指标和威胁的数据库，但欧盟关于隐私的新严格规章（将网络流量定义为\
  \ `PII`）使得创建和采用共享模型特别具有挑战性。然而，在某些非常基本的方面，我们同舟共济。因此，网络安全不应被简单视为一种竞争优势，而应被视为社区服务，信息共享让每个人更安全。\n\
  \n利用网络本身作为`countering threats`（对抗威胁）的手段也显示了真正的前景。对手利用隐藏数据进行秘密通信，包括嵌入的恶意软件、信号和命令控制策略。美国能源部（`DoE`）国家实验室\
  \ 2002 年发表的研究侧重于通过重写或以其他方式更改网络包来对抗内部威胁，这种方式可以在保持公开信息完整性的同时，破坏任何添加恶意或隐藏内容的机会（参见 `[www.cs.colostate.edu]`）。\n\
  \n## 结论\n\n检查是任何网络安全策略的基本要求。然而，在当今市场中竞争需要传统检查策略无法提供的速度和适应性。应对这些挑战需要多种策略。首先，`information\
  \ sharing` 允许安全团队专注于特定的挑战。其次，组织不能完全依赖网络安全来解决他们的问题。从工程上尽可能地消除网络中的问题是至关重要的第一步。这包括研究防止恶意内容附加到数据之上的技术。最后，组织需要更换无法以业务速度运行的现有安全工具。\n\
  \n\n\n\n随着速度加速了数字业务的发展，一个实施不当或构思不周的故障恢复计划，造成的损失往往比泄露本身还要严重。组织不仅要应对泄露带来的巨额成本以及重新加固网络的需求，还必须在危机后负面情绪蔓延、销售额和消费者信心流失的低迷期，以及在网络受阻甚至无法运行的情况下完成这些工作。即使是经验最丰富的网络安全专家及其团队，也会发现这一系列条件是极具挑战性的。正如你可以利用速度和集成来实现网络网络及其整体防御的自动化加固一样，你也可以实现其在故障条件下的韧性自动化。\n\
  \n正如常所说，准备危机的最佳时机是危机发生之前，而衡量这种准备程度的关键在于持续评估网络的韧性质量。通过实施全面的分段策略，我们可以利用高程度的自动化和集成来主动加固和防御我们的网络，并维持那种韧性标准。这是迈向“保持在爆炸发生之前（left\
  \ of boom）”迈出的坚实一步——即拥有一个未被破坏的网络，并竭尽全力通过以适当的速度演进安全性来保持这种状态。如果组织发现自己处于“爆炸之后（right\
  \ of boom）”，自动化可以使其能够从已知的安全副本进行重新生成，使网络安全、高效地恢复运行。这消除了对手在攻击期间利用持续渗透力量的能力，并允许企业的核心服务立即恢复运行。\n\
  \n与任何严肃的战略性现实一样，故障恢复需要全面的预计划，以及对计划本身进行持续的审计和维护。但正如我们在本章中看到的，改进事件监控、加强再生资源以及对演变威胁具有更强适应能力的益处不仅限于故障恢复。它们还驱动了安全大幅提升，从而极大减少了从泄露中恢复的概率和频率。\n\
  \n尽管所有这些技术都要求对先的基础知识进行可靠部署，但它们现在对网络安全同样至关重要——正如我们将在后续章节中看到的那样。\n\n正如我们衡量服务质量一样，我们需要衡量`quality\
  \ of resilience（韧性质量）`，并在风险过高时在网络相关的时间范围内进行调整。对于我们不可避免地发现自己处于“爆炸之后”的时刻，我们需要能够在几分钟内而非几天内恢复到已知的安全状态并运行。\n\
  \n## 准备、响应与恢复\n\n*Thad Allen, Booz Allen Hamilton*\n\n我想先从几年前在一次联合演讲活动上，从著名记者 Tom\
  \ Friedman 那里获得的见解开始：\n\n- 无论你面对的是什么问题，都有三种力量正在汇聚，使世界变得更加复杂。\n\n### 技术\n\n第一种力量是技术——使用最广泛的定义——从生物到纳米再到量子。技术进步是如此之快，以至于它们淘汰了现有的法律框架和国际协议。标准的办事方法已经快到跟不上技术的发展。结果是技术、法律和治理结构变得错位，导致了如\
  \ FBI 在圣贝纳迪诺枪击案后解锁智能手机时面临的挑战。\n\n互联网和社交媒体的广泛使用让人们能够进入此前存在进入障碍的复杂局面。当政府过去部署军队作战时，你只有在军事领袖发送派遣报告后才能知道他们的胜负。但当武装部队于\
  \ 1992 年登陆马加迪沙时，CNN 进行了直播。这是一个具有创创意义的事件。新的现实是，越来越多你无法控制的人和设备将在你的物理或网络空间环境中运行，增加了风险和复杂性。\n\
  \n大多数风险加剧因素（如复杂性本身）产生的问题是单一实体（无论是个人、公司还是政府机构）无法解决的。相反，复杂问题的解决方案必须共同产生——不仅要跨越水平和垂直边界，还要跨越外部边界，例如政府与私营部门之间、跨越国界，或者业务竞争对手之间。\n\
  \n### 环境变化\n\n第二种力量是环境变化。建筑世界与自然环境之间的交叉比以往任何时候都多，导致事件的频率、严重性、复杂性和后果更大。高人口密度和低洼沿海地区的建筑就是常见的例子。然而，在进入非洲中部地区开发和利用资源之前，埃博拉病毒一直局限于孤立的果蝠群。当建筑环境与自然环境相互作用时，我们不仅创造了新的通信链路，还创造了新的风险和意外的问题。\n\
  \n### 全球化\n\n第三种力量我称为大写的“全球化”。我指的不是经济和贸易的全球化。我指的是一切的全球化。今天，每个人都可以获取任何信息，包括不准确的信息。现在，我们在互联网上阅读内容的真实性和有效性的责任完全取决于读者。由于人们没有时间、培训或倾向去核实信息，他们倾向于退缩到围绕极化观点建立的志同道合的部落中，在那里没有人愿意弯协或妥协。\n\
  \n这三种力量的结合产生了新的风险加剧因素，个人、公司甚至政府根本没有准备好应对这种程度的复杂性。这种未能将复杂性作为风险加剧因素面对并提前准备的行为，意味着我们最终应用旧的范式、旧的理论以及旧的战术、技术和程序（TTPs），无法应对挑战。\n\
  \n自然世界中的例子数不胜数，无论是卡特里娜飓、海地地震、BP 石油泄漏、全球干旱和野火，还是密苏里州朱普林的龙卷风。同样的问题存在于网络空间，表现为越来越多的组织在重大网络安全泄露时，从内部和外部未能做出充分反应。\n\
  \n### 统一行动\n\n应对这些挑战始于理解此类事件的模式，然后决定问题的哪些部分属于哪些个人。由于可能涉及许多不同的实体——而且你需要这些人来应对当今挑战的复杂性——你能做的下一个关键的事情是确保这些个人致力于统一行动。一旦事件发生，这个人员必须能够迅速产生一份问题声明。他们需要确保尽管形势复杂，他们清楚问题究竟是什么，以及他们试图解决的问题范围。这听起来很简单，但实际上可能比你想象的要困难得多。\n\
  \n\n我曾参与过各种类型的练习和“兵演习”，这些活动试图在事件发生之前应对复杂情况。虽然预测确切事件是不可能的，但所有这些挑战在短时间内汇聚，可能会让人出人意料的措手不及，尤其是当你还没有考虑过它可能影响你组织的所有方式时。问题之一在于，组织的设计在日常运营中其实并不是为了应对这类挑战而设计的。如果你观察一家公司的运作方式，你会发现努力的线条是分离的，各个团队都专注于组织自己的某一部分，而只有极少数的人在非常高且有时是肤浅的水平上进行统筹。他们组织架构上无法做的事情，就是处理一场对整个公司构成生存威胁的灾难性事件。\n\
  \n人们倾向于纠结于**归因**。如果你有六名军事人员站在一片玉米田里试图去往某处，突然响了一声枪响，其中一名士兵倒下了，你最想知道的第一件事是什么？是那声枪响来自哪里。但在网络安全事件中，你可能永远不知道。即使你最终发现了，所需的时间也将比你采取行动的决策窗口长得多。但组织不可避免地会在初期投入大量宝贵的时间资源试图解决那个问题，而不是处理许多需要他们立即关注的大挑战。\n\
  \n在较大的组织中，问题变得更加复杂。当缺乏归因时，团队倾向于假设这可能是他们的问题，并开始独立做出反应。在世界最大的组织之一——美国联邦政府案例中，美国网络司令部（`United\
  \ States Cyber Command`）会假设重大事件是一个防御问题。NSA（国家安全局）和 CIA 会认为这是一个国家安全问题。FBI 会认为这是一个执法问题，他们必须开始保留证据并建立监管链。同样，国土安全部（`Homeland\
  \ Security`）也会参与进来，因为威胁可能涉及关键基础设施。由于缺乏单一实体来整合和协调国家响应，管辖权斗争、跨部门沟通和重复努力很可能会发生。\n\n\
  每个机构都倾向于做他们认为符合国家及其分配任务最佳利益的事。私营企业也无例外。遗憾的是，这种方法并不能产生自然的整合、努力的统一、对问题复杂性的妥善评估或最佳前进路线——除非有人把这些人聚在一起并对他们进行组织。正确理解问题、在组织范围内建立努力的统一、优先考虑工作以及应对数十种其他挑战，都成了重大挑战，许多组织和领导在起步就失败了，因为他们没有接受过那种思维方式的训练。\n\
  \n## 响应与准备\n\n一个事件通常有两个响应层面。从技术角度来看，在非常短的时间内必须完成很多工作。随后是长期的恢复计划，包括评估损害程度并确保每个人都在做正确的事情，以便进行法医分析。这些在其他地方都有详尽的记录。\n\
  \n但另一个层面要求人们立即关注供应链、品牌、公关和股东信誉等问题。这需要大量的预计划。我见过某些事件，尽管技术响应可能是按部执行的，但响应的其他部分是如此低效，以至于严重损害了组织的恢复能力，特别是在公众认知方面。你需要一个计划来划分功能性的努力线条，并且每个人都必须参与其中。\n\
  \n你还需要进行两个层准备。第一个是进行风险评估，以识别你组织的潜在风险，例如数据泄露导致犯罪分子在暗网（`Dark Web`）上出售客户的个人信息。然后你需要对这些风险进行优先级排序并使用**帕累托法则**（`Pareto\
  \ principle`）。帕累托法则指出，事件约 80% 的影响来自 20% 的原因。所以，如果你在堪萨斯州，就不必担心地震；如果你在旧金山，就不必担心龙卷风。然后你为最可能发生的事件建立响应准则，制定计划并练习执行。每当你进行测试、桌面演习或兵演习时，你都要试图弄坏你的系统——因为你希望在别人发现如何做这一点之前先把它弄坏。\n\
  \n另一个层面的准备是为了应对意外事件的“黑天鹅”。要做到这一点，你必须建立一套你组织中每一个人都理解的基本原则。这样，当你面对困难的问题时，每个人都应该知道有些事情是必须做的，而有些事情是不应该做的。但你不想做的是一说：“这是一个非常困难的问题”，然后像我以前在海岸卫队时的那样，把它放进“太难了”柜子里。即使是最意料的挑战，也包含可以拆解为通用功能并提前考虑的元素，然后分配给你组织中的人员或实体。\n\
  \n### 中央响应小组\n\n建立一个定期会会的中央响应小组是成功响应事件的关键。该团队除了个人专业知识外，最重要的特征是观点的多样性。你的响应小组需要像一支爵士乐团而不是交响乐团，使用能够即兴发挥的人员。我称他们为“猎犬”。这种能力来自情商，包括对你擅长什么、不擅长什么以及让你愤怒的事保持极其诚实和坦率的能力。最后一点尤为重要，因为当你发脾气时，你就把控制权交给了别人，结果可能会破坏你所有的其他努力。这种诚实的评估在规划和准备阶段至关重要。微小的决策会突然变得极其重要。例如，谁将成为公司发言人？CEO\
  \ 会面对镜头吗？你必须判断这个人是否真的有资格担任公司的门面，因为大多数时候并不是他。\n\n\n\n处理灾难性事件最终取决于能否保持自己的方向。海上的船只依靠多个数据点之间的交点来确定位置。如果你能确定到某处陆地点的距离和方位，你就知道自己处于那条线上的某处——这可能并没有太大帮助。然而，一旦你能够确定到指向另一个陆地点的方位，你就有很有把握认为自己可能正处于那条线的交汇处。但如果你有三条线交于同一点，在航海术语中这被称为“精确定位（good\
  \ fix）”。\n\n这一原则也适用于危机管理。你能做的最重要的事情就是对问题进行“精确定位”。只有这样，你才能规划前行的道路。然而，只有通过适当的规划和建设，并依靠一个具有高情商、强大多样性且有能力且意愿发表见解的团队，你才能实现这一点。当他们都同意某个解决方案时，你就知道自己找到了前行的道路。\n\
  \n## 关于贡献者\n\nThad Allen – Booz Allen Hamilton 高级执行顾问\n\nThad Allen 曾担任该公司司法部和国土安全部的高级执行副总裁。Allen\
  \ 以擅长整合政府与非政府实体以应对重大挑战而闻名，这种方法采用“全政府”模式，旨在实现努力的统一。\n\n2010 年，奥巴马总统选择 Allen 墨西哥湾“深水地平”油溢事故统一响应的国家事件指挥。Allen\
  \ 与美国环境保护署、国土安全部、国防部、内政部、商务部、卫生和人类服务部、州地方实体以及英国石油（BP）密切合作，致力于实现响应工作的统一。\n\n在担任美国海岸卫队第\
  \ 23 任任指挥官之前，Allen 曾担任海岸卫队总参谋。2005 年，他被任命为美国政府在卡特里娜和里塔飓风过后整个墨西哥湾沿岸地区响应和恢复工作的主要联邦官员。\n\
  \n在海岸卫队的其他任命还包括大西洋区司令，在 2001 年“9·11”袭击事件后，Allen 领导了该地区的武装力量。\n\n## 网络事件恢复\n\nSimon\
  \ Lambe，皇家邮政\n\n媒体在让人们意识到安全违规方面非常有用。几年前，人们还对自己的网络安全事件守口如瓶。只有通过行业内的人脉才能得知这些情况，但很大程度上遵循“奇彻姆豪规则”，所以你不会广泛讨论它们。“如果会议或其部分在奇彻姆豪规则下举行，参与者可以自由使用所获得的信息，但不能泄露发言者或其他任何参与者的身份或所属机构，”——《奇彻姆豪规则》，伦敦皇家国际事务研究所。\n\
  \n但现在，媒体和公司的公开回应强化了这样一个事实：安全事件不仅是概率，更是必然发生的事件。这改变了当这些事件发生时，我们应该如何思考和讨论这些事件。\n\n\
  应对网络安全事件挑战的方法之一是改变心态。在一个发生这么多事件的世界里，某种形式的系统破解是不可避免的，因此我怀疑我们是否应该将安全事件定义为一种失败。在许多方面，只有当你未能尽可能减少影响，或者没有以所需的及适当水平进行恢复时，它才是一个失败。你从第一天起就开始准备，这样当安全事件发生时，你可以及时捕捉它、最小化影响、优雅地恢复，并为下一次事件吸取训。\n\
  \n### 为网络事件做准备\n\n对成功的攻击和系统破解的意识日益提高正在影响高层管理人员。在许多组织中，发生网络安全事件时，本能是恐慌——这就是为什么帮助你的执行管理人员理解安全事件一直在发生至关重要。我的安全团队做了大量工作，通过演练表或工作坊为公司领导做好准备。这始于召集必要的利益相关者，模拟你的组织可能会经历各种事件。\n\
  \n在最初的研讨会中，你还没有所有的答案，甚至可能桌旁坐的并不全是正确的人。但目标是在完成完那几次会议后，能够理解你需要识别的关键利益相关者、流程和协议中的关键差距。\n\
  \n角色扮演是关键。例如，我可能会分配一名安全团队成员创建看起来像是试图提取信息或盗取财务数据的电子邮件。然后我们使用这些邮件作为演练表，让情况更具现实感，而不是在抽象层面上讨论威胁。这很重要，因为当事件发生时，人们可能会感到紧张和担忧，但我不想让他们感到恐惧，因为恐惧会导致决策瘫痪和相互推责。在实际事件发生之前进行多次演习可以防止这种情况的发生。\n\
  \n准备工作中的下一个关键环节是确保你所有的通信团队都达成一致。你需要确保正确的信息已准备好发送，并且你已经制定了计划来控制某些特定的发言人。你需要知道他们将说什么，并确定领导团队希望向员工、客户和媒体投射什么样的形象。在事件发生之前与外部顾问接触也是一个好主意。\n\
  \n### 事件后规划\n\n最后，你需要理解如何尽快让你的业务恢复到稳定运行。诸如事后取证分析等有时会阻碍你的恢复速度，因此你应该预见到这些需求。调查人员通常会告诉你不要碰受影响的设备或系统，因为他们需要进行取证分析。虽然这种担心可以理解，但现实是，他们必须足够迅速以收集任何相关信息——这要求已经具备正确的技术能力、取证工具和取证人员。\n\
  \n同时，你应该已经将取证过程作为恢复策略的一部分，这样你就可以让受影响的系统和业务恢复正常，并使业务能够运行。这就是有效安全管理的核心；它是以尽可能快速和安全的方式处理事件，让你回到正常。适当的规划可能包括将数据和备份存储在境外并在关键系统中建立冗余。这些和类似的策略可以大大缩短恢复时间。\n\
  \n从专业安全的角度来看，为安全事件做准备最困难的部分是量化风险。我总是避免用绝对的话讨论威胁或威胁响应。相反，我会说“在我看来”或“据我所知，我们认为……”，以便我们在看到情况变化时保持沟通渠道畅通，特别是在信息和情报波动时。让利益相关者经常听到你识别某些新事件或数据点，并解释这是组织需要考虑的内容，这种定期沟通有助于建立共识：管理安全事件只是日常安全运营的一部分。这样，当情况发生重大变化时，你可以直接给所有相关利益相关者打电话，告知他们正在升级处理安全事件，而不会引起恐慌。\n\
  \n\n\n不幸的是，由于各种原因，许多安全专业人员在事件发生任何时候都倾向于立即按下大红色的恐慌按钮。这种方法不仅会产生大量的噪音，还会导致“威胁疲劳”。因此，当重大事件真正发生（即你实际上需要启动重大预案时），你看起来就会像是在“虚报假虎”，因为你每两周就会触发两次警报。\n\
  \n### 做好准备：事件监控\n\n缩短从发现事件到恢复之间的时间是事件准备的关键要素。要实现这一目标需要全面的资产管理和活跃的事件监控，这其中有两个方面是每位首席信息安全官（CISO）都应该了解的。\n\
  \n缩短从发现事件到恢复之间的时间是事件准备的关键要素。要实现这一目标需要全面的资产管理和活跃的事件监控，这其中有两个方面是每位首席信息安全官（CISO）都应该了解的。\n\
  \n第一是，能够识别触发的事件并将其与背景噪音区分开。这需要你了解什么是“正常”的业务流程。这需要通过资产管理来了解哪些资产是关键的，并根据数据对业务的风险建立适当的控制模型。\n\
  \n第二是，对于大多数组织来说，事件监控的另一个核心组件是建立基准，以发现异常行为。对于大型组织来说，有效的事件监控需要一个安全运营中心，将本地情报与外部情报源相结合，以识别攻击。\n\
  \n### 适应演进中的网络\n\n许多组织面临的另一个挑战是，长期以来它们的网络是相对静态且可预测的。他们的安全策略是围绕在边界放置防火墙，我称之为“壳”方法。安全边界是坚固且强大的，你只需要监控通过边界的内容；然而，一旦破壳，内部就是脆弱且不受保护的。\n\
  \n但在过去的几年里，由于移动设备、物联网（IoT）和云的影响，这种边界正在迅速消失。今天，你需要采取一种以数据为中心的安全方法，而不是依赖传统的边界。从务实的角度来看，这意味着根据数据对组织构成的风险建立适当的控制。\n\
  \n### 修复资源\n\n组织从网络安全事件中恢复时面临的最重大障碍之一是否有足够的资源来完成工作。我们在两年前重新调整了团队，设立了专门的事件管理职能。该团队的作用是第一线分诊。他们不仅处理已触发的事件，还在事件演变成重大问题之前进行寻找。我们还要求他们确保我们随时准备联系第三方合作伙伴。然而，虽然第三方在特定主题上可以提供非常好的专家知识，但归根结底，我们的内部人员最了解公司及其运作方式、哪些是关键系统、哪些利益相关者需要通知等等，这就是为什么我建议混合模式。\n\
  \n## 结论\n\n你无法在重大安全漏洞发生时才解决它。你必须为意外做好准备。\n\n最终，对网络安全事件的有效响应取决于公司的文化。在涉及信息安全时，我们需要避免使用“失败”这个词，因为这些事件将会发生。无论人们如何努力，它们都会发生在每个人身上，无论是小事件还是大事件。重要的是你如何为这些事件做好准备，以及你能多快地从中成功恢复。\n\
  \n\n\n虽然宇宙大爆炸和随后的生命演化引发了关于创造者、创造以及宇宙起源和目的等无法回答的问题，但我们确切地知道互联网是如何创建的、由谁创建的以及目的是什么。数字大爆炸的科学和网络安全基础知识绝不能忽视其创造者和运营者的作用与需求：即人类。从人类的黎明到启蒙时代，历经工业革命、数字革命以及即将到来的信息-物理融合时代，人类高阶的知识和发明塑造了人类生存的轨迹。尽管如此，我们看到，创新的力量从未完全脱离过人性的引力拉扯。\n\
  \n这种人性包括了我们网络安全培养皿中不稳定的“自由基”，它们不断阻止着这片原始汤演化成繁荣的有机体。除了目前为止讨论的技术元素外，我们必须承认人类脆弱性、隐私和复杂性的根本性作用。人会疲劳。他们会犯错。他们受到的培训不足。人们将继续破坏我们系统的安全性，因此我们必须积极、智能地利用机器来补偿人类的局限性。此外，安全与隐私之间并不是一个伪选择题。在我们接受这不是安全*或*隐私而是两者兼得这一事实之前，可持续的高阶网络安全将无法繁荣。\n\
  \n随着我们进入网络安全科学探索的最后一个章节，宇宙与数字大爆炸的相似之处也揭示了关于人类卓越适应和创新能力的真理——以及这些创新带来的积极和负面影响之间的拉锯。我们物种的一个定义性属性是我们无法调和的矛盾。我们是高度社交的，聚集在一起形成高度互联社会和社会系统。我们也可以具有惊人的敌意并倾向于冲突。我们最优秀的头脑为了人类的利益不勤工作，但他们的一些工作也被用于贪婪和剥削。\n\
  \n这在数字宇宙中确实如此。从一开始，我们就看到，一种由协作驱动并极大赋能协作的技术也成为了犯罪活动甚至战争的工具。网络安全可以成为缓解断层和结构性缺陷的手段，正是这些缺陷让我们壮的数字技术也造成了巨大的伤害。\n\
  \n这些技术日益扩展到不仅计算机之间 0 和 1 的处理。信息-物理融合正在发生，我们触碰的事物、穿戴的事物甚至我们自身正在成为网络空间的一部分（例如建筑自动化、物联网\
  \ [IoT] 健身追踪器和医疗植入物）。\n\n这种融合导致了问题：\n\n*   这种增加的连接性、功能性和数据——特别是在 `IoT`、机器学习和人工智能时代的相对早期——会增加还是减少我们整体的幸福感和生产力？\n\
  *   从网络安全的角度来说，这些不可思议的科学成就是否能让我们一劳永逸地进行系统更新，修补自数字连接出现以来威胁攻击者所利用的互联网 DNA 设计缺陷？\n\n\
  让我们希望如此。但希望不是策略，更不是科学。我们将在接下来的章节中看到，这些技术将最可能在贡献安全挑战的同时也解决这些挑战。\n\n人类会持续地让机器失败；对此我们无能为力。但如果机器期待完美，机器就会持续地让人类失败，而对此我们有很多事情可以做。\n\
  \n# 12 复杂性管理\n\n![](img/c12uf001.png)\n\n哥白尼和伽利略提出了特殊的模型来解释太阳系中的每一个光点，极大地简化了之前的模型。这种对复杂系统的简单模型为探索和解决太空真正的未知数开启了大门。当年的科学家们不再浪费时间去为他们观察的行星和恒星网络运动寻找极其复杂的解释。网络安全也是如此：我们必须消除与管理网络安全相关的复杂性。这样我们就可以专注于发现和掌握高阶问题，例如释放人类去追求更先进、困难得多的问题。\n\
  \n\n\n\n幸运的是，我们正处于这样一个时刻：对掌握复杂性管理的重要性和紧迫感日益增强，这为我们整理好杂乱无章的现状创造了机会。这种秩序带来了灵活性和灵捷性。组织可以根据最可能面临的特定威胁选择安全工具，并将这些工具与安全团队的实际资源对齐。其结果是安全配置要高效得多，而且在战略上更有优势，能够对泄露事件提供最有效的响应。这种方法还创造了更轻、更合适的技术足迹。正如在本章的贡献中所看到的，这种更简单、更轻量的方法让\
  \ IT 团队关注他们最可能遇到的特定风险，从而实现 IT 与业务本身更紧密的集成。正如我们将看到的，尽管有各种复杂网络安全的外部因素，但管理复杂性是一项内部工作。如果操作得当，结果就是复杂性减少，网络安全成功的机会增加。\n\
  \n# 转变思维来管理复杂性\n\nMichael Daniel，网络威胁联盟 (Cyber Threat Alliance)\n\n尽管一家公司管理其 IT\
  \ 一来并非易事，但今天发生的变化似乎显得尤为令人困惑。在很短的时间内，我们从一个有线桌面电脑世界变成了万物互联的世界，其中任何设备都可以连接到互联网，通常是无线连接。企业网络仍然包含传统的\
  \ IT 设备，如公司拥有的桌面电脑和笔记本电脑，但至少它已扩展到不属于公司的平板电脑和智能手机。在许多企业环境中，网络进一步扩大，纳入了我们现在称为“物联网”(IoT)\
  \ 的设备，但很快我们将将其直接统称为“互联网”。这个扩展后的网络将包括从汽车、冰箱到灯泡、摄像头的所有设备，而在业务端，则包括从库存管理工具、设备传感器到你可以想象的任何设备。\n\
  \n通过有线桌面电脑维护网络安全已经很困难了，但这种超连接网络的出现使其变得更具挑战性。特别是，这种扩展的环境构成了新的挑战，因为这些设备之间都各不相同。它们运行不同类型的软件，具有不同类型的协议和不同程度的保护，然而它们又都连接在了一起。潜在的攻击面不仅在规模上大幅增加，而且攻击表面的变性和异质性也增加了。\n\
  \n与此同时，你的组织可能对这些海量设备日益依赖。过去只是微小困扰的故障，现在现在可能是灾难性的。仔细且严谨地管理这一环境的需求正在增加而非减少。然而，传统的“技术优先”或“城堡与护城河”网络安全方法——这些方法在有线桌面电脑世界可能不起作用或仅勉够用——在新的物联网世界中正迅速变得显而过时。\n\
  \n在尝试应对这一挑战时，许多组织专注于寻找纯技术性的解决方案。他们希望有一种单一的技术工具可以解决挑战并让问题消失。但正如管理业务或组织的任何其他复杂方面一样，单靠一个工具是无法完成这项工作的。它需要整合来自许多不同学科的方法来触及问题，并摆脱这种思维：即由于这个问题是由\
  \ IT 环境产生的，因此解决方案必须来自 IT。换句话说，作为一名 `CIO` 或 `CISO`，你不再仅仅是在管理 IT 和安全；你是在管理复杂性。\n\n\
  ## 开始阶段\n\n那么，你如何管理这种复杂性呢？第一步是显式地对齐你的业务目标和网络安全运营。由于网络安全本身不是终极目的，你需要确保你的网络安全活动能够促进并支持公司的业务活动，而不是抑制它们，并确保你的投资有助于包含复杂性，而不是增加它。它们从业务角度来看也必须合理。你必须理解你实际上追求某个特定的网络安全项目的原因，而不仅仅是因为它是一个新的、亮闪发光的新事物，或者是网络安全会议上流行的最新流行术语。尽管这一点可能看起来显而易见，但组织的业务部门和安全部门之间往往存在脱节。当发生脱节发生时，组织的各个部门最终会朝不同的方向拉扯，而不是通力合作。\n\
  \n第二步是改变你对问题的思维，并说服组织的其他部分接受这种新方法。在旧的思维方式中，网络安全涉及通过技术将入侵者挡在你的网络之外。如果你的组织陷入了这种思维定式，你玩的是一场永远无法赢得的游戏。相反，你需要将网络安全视为你必须管理的长期风险，并将目标视为使你的组织能够运行，同时防止入侵者实现他们的目标。从这个角度来看，问题发生了转移，你可以通过多种方式应用各种工具来管理你的网络复杂性。\n\
  \n## 关键挑战\n\n一旦你将网络安全目标与业务运营对齐，并开始改变组织的思维，你将开始遇到一系列新挑战。虽然这些挑战很困难，但并非不可逾越，而且大多数问题已经存在解决方案。\n\
  \n第一个挑战是如何在这种新的思维下组织你的工作。谈论风险管理固然很好，但如何做呢？最有效的答案是采用风险管理框架。目前存在几个框架；一个很好的例子是由美国国家标准与技术研究院\
  \ (NIST) 发布的《改进关键基础设施网络安全框架》。该框架不是安装防火墙的操作指南，也不限于管理关键基础设施的风险。相反，它为你提供了一种组织化的、逻辑化的方法来思考你的数字环境是如何布局的、你将采取的步骤，以及如何用高层管理理解的语言对其进行交流。它还能让你更清晰地定义组织内高层人员需要做的风险权衡。\n\
  \n第二个挑战是跨组织缺乏沟通。很多时候，业务部门的人不理解为什么安全人员想做某些事情。安全端也是如此，安全团队完全不理解为什么营销部门或研发部门不直接实施那些看起来非常显而易见且合理的网络安全措施。为了克服这一挑战，你需要确保你很好地掌握了组织各个部分的目标和目的。你必须理解他们的观点，以及为什么他们的业务运营是这样安排的。如果你能从理解和阐述他们的需求开始，你就可以促进关于风险的沟通和讨论，这通常能让大家在缓解和管理识别出的风险方面得出一个明智得多的后续方案。\n\
  \n\n\n\nCISO（首席信息安全官）最关键的功能不是选择使用哪一个“闪烁的黑盒子”。最有效的 CISO 会确保所有人都在目标、风险和风险管理框架方面达成共识。他们促进业务部门之间的对话，以确保业务目标和安全风险得到正确的管理。例如，如果有人正在开发一项新功能，且该功能需要部署在一个尚未锁定的环境中，那么网络安全人员——如果他们理解业务需求——就可以与这些人员合作，确保该环境结构得当，并设置适当的沙箱，这样他们能够在实现业务目标的同时，不会让整个组织面临更大的风险。\n\
  \n我的经验是，当一组人所做在另一组人看来完全不负责任时，通常是因为他们不理解另一方所处的环境，或者不理解对方的目标。如果你能将这些对齐，需要跨越的鸿沟通常比人们想象的要小得多。然而，如果这种沟通不畅和误解持续存在，你就会遇到更大的问题——你的复杂性就会增加。在这种情况下，个人或业务小组往往会开始构建自己的“影子\
  \ IT”，在您甚至没有察觉的情况下增加您的风险。他们可能会想出绕过关键安全措施的变通方法，因为他们认为这些程序正在干扰业务目标。\n\n如果 CISO 和网络安全政策没有承认并考虑到人们实际的工作方式，人们将会找到绕过它们的方法。这就是为什么建立和维护\
  \ CISO 与其他业务部门之间的通信渠道是如此重要。只有通过开放、定期的沟通和正确的心态，你才能提高组织的网络安全水平。\n\n### 管理复杂性\n\n当然，一旦你解决了挑战中的人为因素——让每个人参与进来并确保他们都看到自己有共同的目标和对安全的共同需求——你仍然面临着不同的环境和需求，这些需求通常需要单独的安全管理方法。业务\
  \ IT 系统、运营技术 (OT) 系统以及你的云环境创造了不同的需求，而任何连接的 IoT 设备都会带来自己的问题。你可能还拥有一支高流动性的员工队伍，应用程序和消费者希望立即访问数据。\n\
  \n归结底，这种复杂性意味着你无法提前考虑到所有可能的需求、配置或威胁。这就是你的网络安全风险管理框架再次发挥作用的地方。例如，之前提到的网络安全框架为你提供了一种针对你面临的风险选择正确工具的方法。它让你能够根据实际风险选择并实施特定类型的程序、业务规则和技术，并采用适用于你网络结构的最佳实践，例如身份和凭证管理。风险管理框架还驱动你理解你的信息环境、你为什么拥有这些数据、你用它们做什么以及你应该保留它们多久。\n\
  \n这些关于数据、信息和过程的问题极其重要。例如，作为一个网络安全人员，我经常告诉组织，最好的数据是你**不拥有**的数据，因为我不需要保护它。你真的应该仔细考虑你正在存储什么类型的数据以及你为什么要存储它。这种理解会带你回到与各种业务运营团队建立的人际联系中，因为有时，真正最有帮助的不是另一项技术，而是业务流程解决方案。通过在可能的情况下调整业务流程并建立正确的政策，你可以将精力集中在技术上，让技术真正能为你提供最大投资回报的地方，而不仅仅是技术堆栈中另一个闪烁的黑盒子。\n\
  \n之所以这至关重要，是因为你希望确保自己不仅仅是对当前的网络安全态势进行增量式改变，而是从整体角度审视你的整个网络安全解决方案和策略。当新问题出现时——例如网络中增加了一个新的\
  \ IoT 或移动设备，且没有现成的解决方案可以完全处理它——许多组织会去购买一种可以处理它的新技术解决方案。然而，他们很少考虑这种新的移动设备安全解决方案如何与他们现有的其他技术集成。你最终得到的是这种叠加效应，你创建了一层又一层的安全，却不知道它们是如何相互作用的。攻击者利用的正是这些缝隙、重叠和漏洞。因此，新解决方案并没有解决问题，反而增加了你的复杂性。这种问题比人们想象的要大、更普遍，尤其是在大型组织中。\n\
  \n### 管理快速变化\n\n当然，复杂性也可能在组织的业务端增加。许多组织正在经历快速的数字化转型，完全拥抱从模拟流程和纸质存储的转变。然而，当转变发生时，它开启了全新的风险并创造了新的复杂性。例如，在过去，窃取所有人事记录或研究文件是不可能的，因为入侵者需要一辆卡车；而现在，他们可以快速窃取所有这些信息而无人知晓。\n\
  \n\n\nCISO（首席信息安全官）的工作并不是阻止这种转变。然而，CISO 的职责是确保高管理层能够就这些变化将如何影响组织的 IT 复杂性及其风险进行讨论。每个人都需要理解，尽管快速推动变革是有益的，但同时也伴随着复杂性和风险的潜在成本，这些需要被纳入高管理层所做决策的考量。为了正确权衡这些问题，你的组织需要理解他们愿意承担多少风险。业务转型的节奏往往是由追求收益的愿望驱动的，而忽视了副作用（人员对变化的抵触之外）。然而，如果你能从管理复杂性的角度来处理问题，就可以引导数字化转型，让你的组织在捕获收益的同时妥善地控制风险。\n\
  \n如果你没有管理好数字化转型工作，结果可能会造成实际损害，因为随着事情变得越来越复杂，复杂就会变成新的常态。接着，你就会进入下一个更复杂的阶段。与此同时，你的\
  \ IT 团队在过程中会变得越发劳累，特别是如果你没有确保每个人都达成共识，以便你可以在调整业务目标时无需在 IT 端增加额外的复杂性。那时，复杂性就可能失控。\n\
  \n### 应急响应\n\n最后，有效的复杂性管理包括制定一个良好的应急响应计划，并定期进行演练。无论你在检测、预防和遏制复杂的网络威胁方面表现得有多出色，在某一个时刻你都会遇到真实的事件。你需要准备好正确的协议来处理这些突发事件。\n\
  \n因为今天的环境如此复杂，你永远无法预先考虑到每一种意外的情况或结果。这听起来可能违背直觉，但在那种环境下，规划过程反而变得更加重要。它可以帮助你确保自己已经具备应对突发事件的容量和能力。几乎可以肯定，当真实的事件发生时，它并不会按照计划进行。但那正是规划过程发挥作用的地方——正如德怀特·艾森豪（Dwight\
  \ Eisenhower）的名言所：“计划一无用处，规划才切。”此外，规划提供了一种有条的方法，从一开始就让所有参与执行计划的人员加入——思考整个响应过程的样貌，确定所需的能力，并对角色和职责建立理解。这并不是说你就能轻易地执行应急响应，但如果你正确地经过了规划过程，该过程也将使你在响应能力上具备适应性和活性。这需要建立一个协作规划团队，了解你的资源，规划角色和职责，进行角色扮演，并安排合适的人到位，这样当安全事件最终发生时，每个人都知道自己的工作和指挥链，以避免恐慌和资源僵结。\n\
  \n我如何强调最后一点都不为过。在日益复杂的环境中，拥有灵活性和足够广泛的技能储备，以便在事情偏离轨道时能够即时修改计划（特别是在你没有预料发生的地方），是你武器库中最为关键的工具之一，也可能是最难获得的。实现这种状态，是区分卓越\
  \ CISO 与平庸 CISO 的分水岭。\n\n## 结论\n\n管理复杂性是……嗯，这本身就很复杂。它需要技术、业务和人际技巧，并结合自适应和灵活的思维。这很困难，有时这种复杂性会暂时脱离你的控制。然而，凭借正确的心态和工具集，你可以管理组织的网络安全复杂性。这是一件好事，因为今天的世界在这件事上并没有给你选择。\n\
  \n## 关于贡献者\n\n迈克尔·丹尼尔（Michael Daniel）——网络威胁联盟（CTA）总裁兼首席执行官\n\nMichael Daniel 领导网络威胁联盟（CTA）团队并监督组织的运营。在\
  \ 2017 年 2 月加入 CTA 之前，Daniel 曾于 2012 年 6 月至 2017 年 1 月担任奥巴马总统特别助理以及国家安全委员会工作人员处的网络安全协调员。在此职位上，Daniel\
  \ 领导了国家网络安全战略的制定，并确保美国政府与私营部门、非政府组织和其他进行有效合作。\n\n## 复杂性的七个步骤\n\n杰·冈萨雷斯（Jay Gonzales），三星*\n\
  \n组织面临的最大挑战之一，是管理它们在实施数字化转型时引入的多层复杂性。网络正在经历剧烈变化：工作流、软件和基础设施正转向虚拟化、多云环境以及下一代办公场所。自带设备（BYOD）和物联网（IoT）设备正席卷网络。越来越多的用户通过不断变化的应用程序访问关键资源，而敏捷开发正在改变这些应用程序的发布频率。与此同时，CISO\
  \ 的角色正在从技术专家转变为业务顾问。\n\n这只是开始。三星拥有我们需要保护的行政、销售和营销团队。但我们还是一个大型研发机构，拥有多个进行研究、开发或测试的实验室，每个都有独特且不断变化的资源需求。更复杂的是，这些许多团队需要共享资源。因此，保护我们的环境涉及持续识别网络上的活动，确定新的资源和技术是集成到网络中，还是与网络隔离，并实施适当的控制措施以确保核心业务功能不受损害。\n\
  \n### 1. 减少现有复杂性\n\n我们的挑战并非孤例。一个越来越多的 CISO 正在问自己的问题是：“我如何利用现有的资源来应对这种复杂性？”为了回答这个问题，以下是我建议的七点：\n\
  \n### 2. 调整你的政策\n\n\n\n\n一旦你识别了网络中所有的组件和设备，下一步就是建立一套流程，以便处理针对策略豁免的具体请求。如果你的安全策略是指令性的，那么管理豁免将更具挑战性。如果你的策略无法适应不断变化的业务需求，人们就会找到绕过这些策略的方法。\n\
  \n建立能够支持宏观/微观对话的策略，这些对话是当今网络保持整体性并向前发展所必需的。当有人需要执行其团队特定规则之外的事情时，你应该能够用“我们能提供什么帮助？”作为回应。\n\
  \n该行业正在经历从指令性策略向交互性策略的范式转变，首席信息安全官（CISO）现在更多地考虑广泛的目标和目标，而不是具体的规则。因此，当你为所有人制定规则时，你不需要准确告诉他们具体要用哪种锁、放在哪里，或者谁应该持有钥匙。你只需要设定他们需要锁门的预期，只要门锁上了，你就没问题。\n\
  \n### 3. 应用分段\n\n大多数网络最初的设计都是基于强边界策略的。安全团队会在关键资源面前部署安全设备，例如非军事化区 (`DMZs`)、服务器群和数据中心。内部网络的其余部分在很大程度上不受保护，或者充满了需要管理和配置的设备。\n\
  \n今天，为 `IoT` 设备等物品建立内部控制不再需要实施防火墙。相反，分段和微分段在不影响可见性的情况下提供了保护。内部分段可以根据需求动态隔离区域，而微分段在中心化管理时，可以极大地减少由设备部署带来的复杂性。\n\
  \n### 4. 实施 NAC\n\n一旦你了解网络上存在什么，并实施了分段以隔离区域和资源，接下来的工作就是跟踪持续的变化，包括任何新增的设备。即使在分段内部，你也需要知道添加了哪些设备以及它们应该如何分类。\n\
  \n网络访问控制 (`NAC`) 确保当有人将新设备或系统上线时，你清楚它是什么种设备以及将用于何种用途。如果 `NAC` 系统将其标记为不符合策略，它就会被隔离，直到有人完成补丁或更新流程。这种方法有助于保持网络所需的流流动性，而不会给安全人员增加额外的成本或负担。\n\
  \n### 5. 采用自动化\n\n动态访问控制只是自动化这一宏大概念的一部分。安全团队中的许多人力资源都致力于琐事的任务，如管理和更新设备配置、设备入网、读取日志或应用补丁——这就是为什么减少复杂性的下一步是尽可能让这些过程实现自动化。\n\
  \n如果你可以自动化某些低级任务，例如能够运行脚本提取特定事件的日志，那么意味着你可以将原来做那项工作的人分配到更关键的任务上。然而，实施自动化面临的最大挑战出现在人们不了解流程、流程不成熟，或者人们纯粹不遵守流程的时候。\n\
  \n### 6. 管理人员\n\n要解决建立和执行流程的挑战，需要与公司内部的其他团队和部门进行互动。在许多组织中，CISO 最重要的工作不是监督安全技术和技术团队，而是与其他小组建立同级关系，以便在问题发生之初就着手解决，而不是等它们演变成更大的问题。\n\
  \n这种方法至关重要的原因之一是，在许多组织中，安全团队对网络操作没有直接监督权。为了应对这一挑战，安全团队要么简单地强加安全规则，要么走向 IT 部门说：“嘿，发生这种情况了。变了什么？什么时候批准的？”\n\
  \n但这是一个非常低效的过程，尤其是当今的攻击和交易都以数字速度发生时。需要的是通过与业务部门负责人建立关系，抢在这些挑战之前。事实是，每个团队都有自己的需求、要求和挑战，在你尝试在他们已经无法做的事情之上增加负担，或者在他们已经在挣扎的事情上增加压力之前，你需要理解他们。\n\
  \n为了领先这些挑战，我定期与实验室负责人举行会议，询问诸如“发生了什么变化？”然后我可以解释我们正在尝试做什么并询问：“这对你产生什么影响？”\n\n这种互动至关重要。当你不与各种业务领导和部门负责人沟通时，你最终是在尝试管理一些你一无所知的东西——而不是去收集信息、建立关系并说：“我们想帮助你们，但你们需要帮助我们。”如果你不知道他们在做什么就实施了新协议，它可能会以意想不到的方式影响他们，而你最终将不得不面对后果。\n\
  \n这时用户也开始将你视为“阻碍者”而非“促进者”。在许多组织中，这意味着只要安全团队一出现，他们就假设你已经做出了决定，并纳闷为什么还要开会。他们开始寻找方法绕过你所设立的限制。\n\
  \n当我刚到这里工作时，大家总是说：“哦哦，Jay 来了。他会说不的。我们还不如别试了。”但在展示了我真心想帮助他们成功后，他们的态度变了：“嘿，我有这个主意。我们可以这样做行吗？我知道这项安全策略规定了这些内容，但尽管有策略限制，我们仍然能够做到其他事情。”这就是为什么我认为，管理复杂性最关键的方面是管理业务内部的关键关系。\n\
  \n但光说说是不够的。如果没有对每个人的需求和目标清晰的理解，对话会很快变成“这行不通。请修复它。”遗憾的是，“请修复它”并没有为我的团队提供任何工作范围，因为我不知道哪里出了问题。这些关系需要通过定义的需求来增强。当每个人的需求都记录在案时，管理团队之间的互动会变得更容易，因为你可以快速识别问题以及修复它们所需的精力范围。\n\
  \n### 7. 管理文化复杂性\n\n管理复杂性时，一个有趣的挑战有时出现在国际或全球性组织中，当地与海外团队之间存在文化脱节。在情况下，某些复杂性可能仅仅是内部政治和文化的结果。\n\
  \n\n\n例如，一个安全团队可能非常关注合规性并由合规驱动。他们的预期可能包括使用清单并询问：“你做了这些事情吗？是或否？”，然后对某个团队或业务部门进行评分：“你因为没有做\
  \ A、B 和 X，所以你失败了。”来自另一种文化的团队可能认为合规性仅仅是一个起点，他们需要在此基础上添加大量内容。\n\n应对这些挑战需要进行开放的对话，并通过当地领导层的支持来促进。这些交流的目标是帮助其他团队理解你们的网络安全目标是什么，你们的当地文化期望你们的网络安全团队做什么，以及他们的努力如何为业务服务。目标是帮助他们看到，如果结果是相同的（意味着组织是安全的），那么每个团队实现这些目标的流程应该是次要的。\n\
  \n这是一种长长的说法，意指你可能需要处理的某些复杂性并不总是聚焦于技术的。它更多倾向于让从基层到高管管理层的每一个人都准确地理解你们团队存在的意义、他们对他们的期望是什么、他们为了满足本地和公司安全需求正在做什么，以及他们成功所需的哪些工具和权限。\n\
  \n### 结论：安全永远不能成为瓶颈\n\n最终，安全的目标不仅仅是保护业务，而是使其能够向前发展。为了实现这一点，安全不能成为那些需要完成的任务的瓶颈。\n\
  \n最重大的挑战首先是，识别每一个对网络运行有利益的群体；其次是，识别出你不知道正在发生的事情；最后，识别出找到方法在环境中让事物运行起来的用户组，特别是当这涉及绕过设备、策略或协议时。这实际上是件好事，因为你不仅理解了这些小组为了工作需要什么，以及你的安全策略在何时变成了瓶颈，最重要的是，发现了你的安全实施中存在哪些漏洞。\n\
  \n如果你发现一个已经想出如何绕过系统工作的团队，你需要从他们那里学习。你最不想做的事情——尤其是当某些东西已经运行且运行符合预期时——就是切断他们的联系。相反，要学习他们为什么需要他们他们的事情，并找到一种不绕过安全手段来实现这种需求。这可能需要要求他们移动到一个更受控的环境中，或者可能仅仅涉及将他们与其他人隔离开。\n\
  \n最终，减少和管理复杂性始于询问：“你想做什么？”“你需要做什么？”以及“你需要的什么工具来让它运行得更好？”对于那些已经有了变通方案的团队，一个很好的问题可能是：“你是如何在不告诉任何人你需要什么的情况下让它运行起来的？”这可能比你所做的任何事情都能告诉你更多关于你的安全策略的信息。\n\
  \n## 关于作者\n\nJay Gonzales – 三星半导体公司首席信息安全官\n\nJay Gonzales 在过去的 18 年里一直从事网络安全工作。他的背景和经验主要在政府部门，在那里他担任了\
  \ 13 年现役海军陆战队，专注于信息保证和计算机网络防御 (`IA/CND`)，另外在海军刑事调查局 (`NCIS`) 工作了三年。在担任目前的职位之前，Gonzales\
  \ 曾是 HP 全球网络安全团队的风险经理。\n\nGonzales 在政府文官系统中担任过多个角色。他最初担任 `NCIS` 网络安全联络员，直接分配给海军\
  \ `CIO`，提供定期的网络威胁情报简报，并为海军和陆战队更新部门级的网络安全政策。他还为国防部关键基础设施保护政策的规划提供了直接支持。此外，Gonzales\
  \ 曾担任阿富汗内政部顾问，为喀布的阿富汗国家警察部队制定了一项 IT 教育和培训计划。\n\n# 13\n\n## 隐私\n\n![](img/c13uf001.png)\n\
  \n隐私引发了激烈的政策辩论、抗议，以及对数字组织实施过的最广泛、最严厉的监管。虽然许多人将欧盟的《通用数据保护条例》(`GDPR`) 视为零年里程碑，但事实是，隐私问题对于功能性社会来说一直是根本性的。\n\
  \n同样，隐私保护必须是所有网络安全努力不可或缺的一部分。\n\n正如那些没有考虑到速度这一基本要素的安全技术和协议会被直接关闭或放弃，导致网络完全不受保护一样，缺乏隐私保护也会催生类似的反应。如果用户感到隐私面临风险，他们就会找到简单的变通方法，创建一个庞大且脆弱得多的影子\
  \ IT 基础设施，这些由设备和系统组成，大多数 IT 团队甚至看不见它们，更不用保护它们了。如果你打算以速度和规模开展网络安全，那么你也需要以速度和规模进行隐私风险的检测和缓解。\n\
  \n随着我们前进，我们的数字创新将如何影响现代生活最基本的方面之一——我们作为个人对隐私和自主的渴望以及权利？随着后 `GDPR` 时代的开启，试图保护个人免受我们对数字创新的集体拥抱之伤害，我们看到即使隐私也受到人类矛盾和过度复杂这种人性缺陷的影响。\n\
  \n讽刺的是，为了有效保护一个由 0 和 1 二进制代码产生的信息系统，我们往往在安全和隐私之间传达“非黑即白”的选择。成功地确保我们的网络万安全，取决于在这两种力量之间找到正确的平衡。\n\
  \n当安全专家放弃对这种平衡的追求时（往往是为了他们认为能为组织创建更强安全性的做法），他们通常会适得其反的效果。虽然有些 IT 团队急于指责终端用户，但责任在他们自己，并且可以直接归因于要求用户遵守一种无法维持且不可持续的虚假选择的失误。\n\
  \n出于伦理和务实性的考虑，安全专家绝不能强迫人们在安全和隐私之间做出选择。没有隐私的安全往往根本不是安全——而且对组织来说，比确保隐私的合理妥协和折中要危险得多。\n\
  \n除了这种简单的因果关系外，还有许多理由将隐私考量置于所有安全努力的中心。平衡的隐私方法告知并赋能了各种安全技术——从加密级别到检查、认证和可见性技术，这仅仅是其中的几个。保护隐私的网络安全解决方案更强大、更复杂。\n\
  \n隐私权被强大的数字公司践踏的认知导致了 `GDPR` 以及其他法规的兴起，这些法规给所有安全基础增加了极其复杂的复杂性。这些监管法规创造了巨大的挑战——甚至是令人困惑的矛盾——全球的\
  \ IT 团队现在每天必须应对。\n\n同样清楚的是，过度重视隐私的补偿反应往往会产生更大的风险，甚至会将更多敏感的个人信息暴露给网络犯罪分子，他们非常乐意利用可见性的降低来实施信息窃取。\n\
  \n## 不要慌！安全专家必须学会迎接隐私的新时代\n\n*Kevin Miller, MGM Resorts International*\n\n\n\n\n\
  当安全专业人士正拼命保护驱动数字业务的不断扩张的技术格局时，社会和法律的剧烈变化可能会从根本上改变他们的职责，而且似乎是突然发生的。但不必恐慌。如果安全专业人士拥抱这些变化，结果将是非常积极的。\n\
  \n我们已经习惯了关于大型组织遭受数据泄露破坏的新闻报道。这些泄露事件不仅影响了数千百万客户，还会因巨额罚款、法律费用和安全升级成本影响企业的底线。更重要的是，这些泄露导致了永久性的品牌损害和客户信任的丧失。从这里，网络安全已成为一种关键的业务风险。高管领导和董事会成员现在经常要求那些深闭在\
  \ IT 部门内部、此前被忽视且资金不足的安全部门提供更新报告。\n\n大头新闻和管理层对网络安全的紧迫关注很容易掩盖一个迫在眉睫的国际隐私法。但当一个企业接替另一个企业占据头条时，隐私的新纪元在欧洲黎明——这里拥有\
  \ 5 亿居民的世界最大市场，也是全球最大的贸易集团，占全球进出口额的 16%。\n\n### GDPR 的兴起\n\n2018 年 5 月，欧盟的《通用数据保护条例》`GDPR`\
  \ 正生效。该法律取代了 1995 年的《数据保护指令》，该指令要求所有 28 个成员国通过自己的数据保护法。这导致了法规的杂乱，且往往相互冲突。`GDPR`\
  \ 旨在“统一”整个欧洲的数据隐私法。\n\n该法律的 99 条条款和 173 条序言规定了人员的权利以及在欧盟（EU）提供商品和服务的企业的责任。个人现在被保证了解收集了关于他们的哪些信息以及这些信息将如何被使用、访问和纠正这些信息的权利、删除信息的权利（即“被遗忘权”），甚至还有反对某些类型处理的权利。个人拥有的权利取决于最初收集这些信息的原因（被称为“处理的合法依据”）。`GDPR`\
  \ 的例外非常狭窄、具体且稀少。它们包括执法和国家安全事务、科学分析，以及严格用于个人或家庭活动的数据。\n\n### 范围与问责\n\n这项复杂且影响深远的法律的适用范围刻意设计得巨大。它适用于在欧盟提供商品或服务的每个组织，从非营利组织到草根初创公司到全球性企业，无论是否有支付。即使一个组织只是“设想提供服务”（例如，拥有一个针对欧盟居民并接受欧元支付的网站），该法律也适用。而且\
  \ `GDPR` 适用于整个供应链。与第三方（如供应商和供应商）共享的个人信息也受这些要求的约束。\n\n问责制是 `GDPR` 的主要特征之一，代表了那些必须遵守法律的人员在心态上的重大转变。虽然这不是一个新概念，但\
  \ `GDPR` 第 `24` 条中的问责原则要求组织不仅要实施“适当的技术和组织措施”，还要“证明”其对该条例的合规性。`GDPR` 中有 39 条条例要求提供合规证明，这对于许多企业安全团队来说是一项完全的新任务。\n\
  \n### 执行与影响\n\n这项法规第一次以强大的执行方案的形式具有了真正的“牙齿”。在 `GDPR` 执行日期之前的几个月里，新闻标题警告称，违规的罚款可能高达\
  \ 2,000 万欧元或全球年度营业额的 4%（以较高者为准）。人们广泛预计，巨额罚款将仅对公然违规的行为征收，但如此巨大的罚金很容易让一家没有大量资源的公司破产。\n\
  \n幸运的是，欧洲数据保护机构提供了一些冷静的观点。`第 29 条工作组`（代表负责执行 `GDPR` 的每个欧盟成员国当局）的主席将执行日期称为“一个起点”以及“我们开始合作的方式的里程碑”。他们一直强调参与和透明度，而不是截止日期和罚款。但尽管如此，一家价值十亿美元的公司可能面临\
  \ 4,000 万美元的罚款——这足以引起全球董事会的关注。从安全专业人士的角度来看，希望这将影响业务领导者重新考虑他们数据保护工作的优先级。\n\n虽然 `GDPR`\
  \ 的范围和影响确实巨大，但许多问题将只有通过执法和诉讼才能解决。有一点非常明确：被视为个人数据的范围已经扩大。`GDPR` 将个人信息广泛地定义为“任何与已识别或可识别的自然人相关的信息”。虽然该法规没有规定构成个人信息的确定列表，但\
  \ `GDPR` 提供了一些清晰度：“可识别的自然人是指直接或间接被识别的人，特别是通过参考诸如姓名、识别码、位置数据、在线标识符或特定个人物理、生理、遗传、精神、经济、文化或社会身份的某个或多个因素来识别。”对于一个即使只收集少量客户信息的企业来说，那是需要保护的大量信息！\n\
  \n在 `GDPR` 时代，组织必须知道他们收集了什么信息以及为什么——这说起来容易做起来难。以前被认为如此无害而可以包含在名片上的信息，现在都是受保护的数据——姓名、邮寄地址、电子邮件、电话号码和员工证上的照片。即使是一家小公司，维护的信息也不仅来自客户，还来自当前和潜在员工、承包商、供应商、服务商、经销商等。在遵守\
  \ `GDPR` 时，任何涉及个人数据的流程都必须被考虑。\n\n为了使合规变得更加复杂，满足 `GDPR` 的要求涉及两个截然不同但同样困难的问题：隐私和数据安全。对于欧盟居民来说，`GDPR`\
  \ 最可见的结果将围绕隐私。首先，许多组织不得不重写他们的隐私政策以满足法律要求。例如，隐私政策现在必须包含关于收集了哪些个人信息以及原因、共享了哪些信息以及与谁共享，以及个人如何行使权利的特定信息。法律甚至坚称政策必须易于理解（无法律术语）且易于阅读。许多怀疑者认为律师无法胜任这项任务！\n\
  \n\n\n\n\n无论在何处收集数据，组织必须对其计划如何使用数据保持透明——这就是法律所谓的“公平处理通知”。通用数据保护条例（GDPR）对基于个人同意收集的信息有特殊规定，要求必须是“自愿提供的、特定的、知情的且明确的”。在\
  \ GDPR 下，预勾选的“我同意”复选框不再被接受。结果是，公司必须重新检查每个接收个人信息的流程，并确保已落实了正确的通知措施。对许多人来说，这是一项艰巨的任务。\n\
  \n### 目的限制与遗留系统\n公司不仅必须对计划如何使用数据保持透明，还必须确保在保留数据期间，这些数据不会被用于任何其他目的。这被称为“目的限制”原则，对企业\
  \ IT 系统的影响可能是巨大的。数据不仅必须受到保护，而且在其整个生命周期内必须以某种方式维持其原始目的。事实的是，许多遗留 IT 系统在设计之初并不是为了保留此类元数据，更不用说对其进行操作了。\n\
  \n### 数据主体访问请求 (DSARs)\n根据 GDPR，个人对其数据拥有某些权利，每个组织都必须能够在 30 天内免费满足请求。这些请求被称为数据主体访问请求\
  \ (DSARs)。虽然在理论上很容易理解，但为了满足“被遗忘权”请求而删除数据绝非易事。一家公司可能有数百个应用程序连接到成千上万个数据库，其中数百万条个人信息记录。他们不能在不使整个系统面临故障风险的情况下简单地删除某个人的数据。更令事情困难的是，尽管个人可能希望从直接营销列表中删除，但他们可能仍希望公司对他们多年前购买的产品履行保修。\n\
  \n### 数据搜索的挑战\n例如，当公司收到来自 Katherine Miller 的信息请求时，该怎么办？他们显然不想将信息发送给错误的人。对公司的数据库（营销、薪资、客户、忠诚俱乐部、客户服务等）进行搜索可能会产生几十或上百个可能的匹配项——例如\
  \ Katie Miller 和 K. Miller。不要忘记在 Katherine 结婚前收集的信息。某些记录可能包含多年前的邮政地址，某些带有当前或过去的电话，以及大量的电子邮件地址。一些大公司预计每月会收到近\
  \ 250 个请求。什么构成了“彻底”的搜索？执行搜索需要多长时间？重要的是，需要多少人来执行这些搜索？这些绝非琐碎的问题。\n\n### 跨境数据传输\n撇开隐私，许多组织在确保数据安全方面面临的挑战同样巨大。虽然具有安全意识的组织多年一直在保护个人数据，但对于新接触\
  \ GDPR 的机构来说，存在着重重障碍。例如，法律仅在目的地被认为具有“充分”保护水平的情况下，才允许向欧盟境外传输、处理和存储数据（称为 `cross-border\
  \ data transfer`）。对于欧盟而言，美国的数据保护法被认为是不充分。尽管有几种方法（如约束性企业规则或美欧隐私盾）可以让公司遵守这一规则，但对于全球性公司来说，遵守这一点绝非易事。在云计算时代，选择特定数据的存储位置并不容易，而且往往是不可能的。这将是一个持续的斗争。\n\
  \n### 数据最小化与加密\n当然，如果你不保留数据，就不需要保护它。安全专业人员长期以来视为最佳实践，但 GDPR 特别提出了“数据最小化”以减轻合规负担。只应收集和处理完成任务绝对需要的数据。任何非本质数据都不应被收集，如果收集了，也应该将其删除。加密和存储限制也是法律中的重要概念。加密一直存在，基本上所有可以加密的内容都应该加密。存储限制简单意味着“保留和销毁”。公司可能需要或想要保留数据有很多原因。例如，政府通常要求将税务信息保留多年。但不再需要的数据应该被删除。定义良好的数据保留和销毁政策非常有帮助，而实施该政策的程序至关重要。\n\
  \n### 匿名化与伪匿名化\nGDPR 还鼓励使用几种数据处理技术，可以减轻安全团队的工作。`anonymization`（匿名化）过程并不新鲜。但不幸，它只在某些有限的情况下具有实用性，因为它涉及消除所有能够唯一识别个人的数据。如果你真的对数据进行了匿名化，大部分价值就会消失——对业务、对消费者等等。让我们面对现实吧；人们重视诸如定向广告之类的个性化体验，只要它不至于让人毛骨悚然。\n\
  \n比匿名化一级是所谓的 `pseudonymization`（伪匿名化），这是一个发音非常别扭的词。在这种情况下，个人身份信息与其他数据分开，但以某种方式关联，以便个人可以被重新识别。这是一个相对新且聪明的概念，需要时间才能整合到业务应用程序中。\n\
  \n### 数据保护官的兴起\nGDPR 甚至影响了许多安全、法律和业务风险团队的结构。法律将组织内部的隐私提升到了一个高度，使得某些处理大量个人数据的组织需要聘用另一位名为数据保护官\
  \ (DPO) 的高级领导者。这是一个新角色，旨在独立监督公司的数据保护战略，并担任与当地 GDPR 监管机构的联系人。预计全球将聘佣多达 75,000 名 DPO。\n\
  \n### CISO 角色的演变\n到目前为止，我们看到了 GDPR 将如何从根本上改变欧盟以及整个全球范围内对隐私和数据保护的监管方式。我们也看到了这项新法律将如何影响在当地开展业务的大型和小公司。剩下的是讨论如何在领域中实际实现这些目标。GDPR\
  \ 如何影响 CISO 角色？对于普通公司来说，合规之路将是怎样的？GDPR 合规真的可行吗？\n\n在许多公司，CISO 角色是一个相对新的 IT 职位，通常向\
  \ CIO（首席信息官）汇报。许多第一代 CISO 来自 IT 背景，具有很强的技术性。但这种情况正在发生变化。全球隐私和传统业务日益数字化的趋势正推动 CISO\
  \ 成为一名“业务”领导者。许多 CISO 现在向总法律顾问、首席运营官、首席执行官，甚至直接向董事会审计委员会汇报。\n\n这种变化有充分的。被赋予 GDPR\
  \ 合规任务的 CISO 发现自己与人力资源、法律、销售和营销部门的合作比与 IT 部门更多。这并不是说 IT 不起核心作用。它确实如此！但许多 IT 组织在采用开发和运维的最佳实践时，已经在改进其数据安全标准。对于企业资源计划\
  \ (ERP) 等传统的关键任务本地化应用程序，云技术的使用也迫使其进行更高水平的安全审查。\n\n\n\n\n许多组织缺乏的是对业务所消耗和处理的数据具有意义的理解。人力资源部门从新员工处收集了哪些信息？营销部门是否正确记录了直接营销的同意书？公司电子邮件系统是否被用于与供应商发送和接收未加密的个人信息？是否遵循了公司的保留和销毁政策？哪些欧盟数据被传输并存储在美国？该组织是否真的满足了美国/欧盟隐私盾的要求？\n\
  \n首席信息安全官（CISO）完全可以是提出这些问题并帮助组织找到答案的人。感到无从从是很正常的，但向前行的最佳方法是采用循序渐进、有条的方法。而且你需要变得非常擅长文档工作！\n\
  \n## 我们从哪里开始？\n\n首要工作是绘制数据流图。与业务团队坐在一起，在白板上画出流程。提出开放式问题，以便充分理解业务需求。这些映射可以帮助所有人理解数据流周围的所有细节：谁提供了信息、收集了哪些数据、存储在何处、如何使用、在何处共享、谁有权访问这些信息，以及数据最终会发生什么。受监管严格的业务可能已经拥有这些信息，但很多公司并没有。\n\
  \n一旦你拥有了流程图，或者至少是重要的流程图，你就必须确定你的“合法处理依据”。CISO 可能能对此做出一个知情的推测，但合法依据的问题最好留给法务部门。法律依据回答了这样一个问题：“是什么赋予了组织收集这些信息的法律权利？”尽早了解这一点很重要，因为你需要设计控制措施，以适应那些高度依赖这一决策的个体的权利。你可能还需要在数据进入系统时对其“分类”，这会影响你在后续步骤对控制措施的选择。请记住，`GDPR`\
  \ 对根据个人同意而收集的信息制定了许多规则。最好尽量少使用同意授权（例如，在直接营销中）。\n\n接下来，对每个工作流进行缺口分析。不要深陷于细节中。相反，对每个工作流进行高层分析，并评估流程中的每一步。你可能决定对传输中的数据进行加密，而无需担心将如何实现。此时，你正在记录既是要求（根据\
  \ `GDPR` 和其他法规）又是理想（为了实施最佳实践）的内容。如果你不熟悉 `GDPR` 的细节，请咨询你的法务团队或外部专家。这部复杂的法律中有很多要求。寻求帮助并不可耻。\n\
  \n有了缺口分析后，你现在可以评估工作流的风险并进行优先级排序。并非所有工作流都是相同的。它们通常根据信息量和敏感性而异。特别敏感的工作流包括关于未成年人的信息，或涉及种族或族裔、宗教信仰、性取向、工会身份等信息。大公司可能有数百个工作流，因此优先级排序是关键，这能让你避免感到无从从心。在此阶段记录风险所有权和风险接受情况。代表业务承担风险并不是\
  \ CISO 的工作。风险属于信息所有者，这一步是让这些风险透明化（可见化）的绝佳机会。\n\n## 设计和构建控制措施\n\n现在你终于准备好进入了对大多数技术人员来说最有趣的部分：设计和构建控制措施。先从小型、简单的流流开始以磨练你的技能，然后处理更复杂的流程。\n\
  \n*注：提示词后半部分提供的源文本包含大量重复/混乱的句子。我根据要求清理了结构，以保持符合要求的设计过程的核心叙述。*\n\n从小型、简单的工作流开始以磨练你的技能，然后处理更复杂的流程。\n\
  \n\n\n\n\nKevin Miller (CIPP/E, CISSP, CRISC) 担任位于内华达州拉斯维加斯的全球娱乐公司——万盛度假酒店集团（MGM\
  \ Resorts International）隐私副总裁。他曾是多本关于 Juniper 和 Cisco 技术书籍的作者。他的隐私背景包括在国际办公家具制造商\
  \ Herman Miller 担任 `CISO` 期间，开发了一项 `GDPR` 合规计划。Miller 在网络架构和工程方面拥有深厚的背景，并拥有南卡罗来纳州查斯顿学院的计算机科学学士学位。\n\
  \n## 更严厉的隐私法规正驱动着我们所需的话题与创新\n\nPeter Keenan，全球金融服务公司\n\n欧盟《通用数据保护条例》（`GDPR`）从通过到执行之间的时间差，激发了许多信息安全专家去讨论“隐私的新时代”。但在金融服务行业，近\
  \ 30% 的员工专注于维持对各项法规的合规性，涵盖从《银行保密法》中的反洗钱法律到经济合作与发展组织（`OECD`）制定的政策；我们长期以来一直认识到，隐私保护不仅是有效安全的核心，也是赢得客户信任和推动业务成功的基石。\n\
  \n不可否认，`GDPR` 的强度和严重程度代表了全球企业看待和处理个人信息方式的根本性转变。我们也无法否认，由 `GDPR` 驱动的讨论对于进步至关重要，而且事实上是必要的。但在导致其法典化之前的大规模辩论中——更不用说全球公司为了合规在数据保护方面做出的巨大改变——一种特定的叙事似乎占据了主导地位。\n\
  \n这个故事线很简单：私营部门强大的企业和组织正在践踏隐私保护原则。因此，它们需要通过严格的法规受到约束，以保护个人信息。尽管这被某些人视为对西岸科技和社交媒体公司的直接警告，但\
  \ `GDPR` 的影响实际上要广泛得多。诚然，`GDPR` 设定的道路是重要的，但它并不代表数字隐私原则的“零年”。\n\n从历史角度看，“最小特权”概念一直是设计信息安全计划的指导准则。在最基础的层面上，最小特权意味着只有需要查看某信息的人才能看到它。根据任何合理的标准，这正是隐私的定义。它也体现在信息保护的\
  \ `CIA Triad` 模型中：机密性、完整性和可用性。机密性限制对信息的访问，完整性确保信息的准确性，可用性促进授权人员访问这些信息的能力。这是一个在 `GDPR`\
  \ 实施之前就早已存在的模型。\n\n这并不是说 `GDPR` 是多余或不必要的——远非如此。\n\n最近，公司偏离隐私和安全核心原则的易易程度已被广泛报道。尽管判断信息政策是否符合公司价值观超出了大多数\
  \ IT 团队的范畴，但许多信息安全涉及风险管理，因此也涉及风险沟通能力。结果，我们看到不仅强有力的隐私法规是保护消费者的有效工具，它们还保护组织，往往是使其免受其自身的伤害。\n\
  \n这种做法的一个说明性例子是 Facebook，该组织因其在美国人口中巨大的影响力而被选中，并用以凸显在个人信息价值不断增长的背景下所产生的隐私担忧。Facebook\
  \ 的基本商业模式已被大众熟知。它被应用于各种社交媒体平台以及不同的行业。Facebook 接收人们自愿提供的数据，然后以各种方式出售或变现这些信息。\n\n\
  尽管这种情况越来越罕见，但仍有一些人在注册社交媒体服务时并不了解此类做法。为什么？答案很简单：因为没人读最终用户许可协议（`EULA`）。他们只是简单点击接受。\n\
  \n他们还能怎么做呢？`EULAs` 包含了数千字晦涩的法律术语，除了无法说明问题外毫无作用。2012 年，经认定，平均一个人需要 76 个完整的 8 小时工作日才能读完一年内注册的所有服务的\
  \ `EULAs`。每个人只是点击按钮接受条款。如今，我们这样做时几乎不会再次思考。\n\n但如果将这种根深蒂固的盲目点击选框的行为放在个人数据价值不断增长的背景下。消费者的条件化行为和他们数据的价值共同为组织产生了一种强大的引力——这些组织负有增加利益者利润的义务——使他们认为这种情况是一个不可思议的盈利机会。\n\
  \n考虑一下你的银行关于你拥有多少深层次的个人信息。它包括从你账户里的金额到你的信用卡交易、在线购物、健康信息、婚姻状况，通常甚至包括你的位置。你的银行活动可以以极其细微的细节揭示你生活的各个方面。\n\
  \n只需在没人阅读的 `EULA` 中插入仅仅两行文本，该金融机构变现所有上述信息就是完全合法的。将此乘以数百万客户，其潜在利润是惊人的。某些金融机构从其拥有的数据中获得的利润可能比它们从核心功能（如利率）中获得的更多。而这本质上全是捡掉的钱。\n\
  \n当然，不仅仅是银行。电话公司、有线电视供应商和互联网服务提供商（`ISPs`）也是如此，这只是可能获利的其中几个。今天，各各行业都有非常巨大且强大的公司在提供主要服务的过程中吸收了大量的个人数据。像\
  \ `GDPR` 这样的隐私法规消除了变现这些信息的能力。从本质上说，这通过减少因追求所有可能的利润的诱惑或义务而产生的张力，保护了组织免受其自身的伤害。\n\n\
  \n\n\n\n在金融服务行业，公司将客户服务外包给全球的呼叫中心，在此过程中，向成千上万公司从未认识或直接雇佣的人授予了海量数据的权限。如果 C 级层对出售这些数据的诱惑足够强烈，想象一下这对于在发展中国家呼叫中心工作的人来说，这种引力会有多大。\n\
  \n正如我们在许多知名案例中看到的，存在着一个巨大的被盗数据黑市，犯罪分子每条记录仅需支付几分钱。由于互联网最初的设计，“非不可否认性”（即将个人与特定行为关联起来的能力）在应用于网络语境时是一个充满复杂性的问题。在一个没有引渡条约的国家，一个人完全可以把每个清醒的都花在尝试诈骗，而被捕的概率微乎其微，几乎没有被起诉的机会。\n\
  \n无论未被发现的隐私信息泄露是从内部还是外部发起的，它都是一个规模巨大且影响深远的问题症状。随着网络的扩展，以及访问点和真正需要访问的人的增加，首席信息安全官（CISO）想要遵循信息安全的核心原则——**你必须了解你的环境**——正变得越来越困难。\n\
  \n金融服务行业在如何向前发展方面可以提供见解。这也代表了一个利用快速创新的技术和日益严格的隐私法规来创造更高安全性的机会。在这方面，特别是金融服务行业有一个领域远领先于时代。\n\
  \n十年前，信用卡公司就构想出了许多其他行业和垂直领域现在才开始学习做的事。他们能够快速识别卡片是否被盗并立即切断。这得益于高度复杂的异常检测技术：从**点异常**（检测正常信用卡使用情况的单个离群值），到**上下文异常**（考虑其他相关信息以评估活动），再到**集体异常**（审查单独看可能不会引起注意，但通过共同出现可能共同预示异常的实例）。\n\
  \n这种高度关注背后的动力无疑是财务性的。美国商户每年因信用卡欺诈损失约 1,900 亿美元。将这一数字仅减少一两个百分点，就意味着节省了数十亿美元。随着机器学习和人工智能领域的创新和改进，检测异常的能力也将提高。希望机器学习很快就能个人信息保护和其他隐私问题中找到更广泛的应用。\n\
  \n虽然“了解你的环境”这一原则通常意味着了解你的硬件和软件，但现在它必须包括了解在任何时刻你的网络上存有什么信息。随着隐私法规的增长，公司了解自己持有哪些数据将变得越来越重要。如果你没有对关键信息进行识别和分类，对其进行有效保护的机会本质上是随机的。部署\
  \ AI 来实现有效的信息分类将变得日益必要。\n\n这是感谢 `GDPR` 和 `OECD` 法规的另一个原因：作为业务的推动者。尽管这些法规要求大规模的内部调整，并且往往与现有的反洗钱法律相悖（或至少是相互矛盾的），但它们在将安全问题提升到\
  \ C 级层方面非常有效。高管和董事会的高水平关注会驱动整个组织产生更有效的信息安全政策和分配。\n\n高管关注的增加不仅能够通过 AI 和其他技术更有效地部署数据分类，还将信息安全置于它应该所在的位置：所有业务决策和倡议的核心。太多的组织开发了工具和业务流程，然后手忙脚乱地以此设计安全协议。随着越来越多的公司使用敏捷的\
  \ `DevOps` 生产策略，安全将成为开发流水线每一点的考虑因素。\n\n随着安全的核心角色日益成为业务运营中被接受的常识，IT 与信息安全之间的空间将逐渐减小。这种收敛演化的结果是引入健全的隐私实践，这些实践对某些行业来说可能是新颖且看似繁琐的，但这些实践长期以来一直是我们金融服务行业遵循的认可原则。\n\
  \n在许多方面，这些隐私原则是由 `OECD` 法规定义的。它们包含了对收集限制的严格准则，包括收集数据的相关性和收集的特定目的、个人获知其数据是否被收集的权利，以及对透明度和问责制的需求。尽管\
  \ `GDPR` 中存在矛盾（例如它对系统备份的角色缺乏具体规定，或者为了遵守反洗钱法律而需要保留信息），但其法规的精神是一致的。\n\n不可否认，`GDPR`\
  \ 虽然仅代表隐私法规的开始，但它引发了某些公司处理个人信息方式的地震性变化。然而，那些抗议最激烈的反而是最需要改变的组织。\n\n希望通过合规的过程，他们将理解到更强大的隐私法规会导致更有效的信息安全、实践和技术。最终，他们可能会认同我们在金融服务行业的愿景：更强大的隐私政策带来更安全的组织、受到更好保护的客户以及更大的业务成功。\n\
  \n### 作者介绍\n\nPeter Keenan – `CISO`, 全球金融服务公司\n\nPeter Keenan 负责一家全球领先的财务咨询和资产管理公司的全球信息安全战略和计划，该公司业务遍布数十国。在担任此职位之前，Keenan\
  \ 曾在花旗银行全球信息安全团队工作。他在花旗最近的角色是信息风险治理负责人。在此工作中，他领导了负责全球开发和维护信息安全策略的团队。在花旗工作五年之前，Keenan\
  \ 在信息安全和技术领域拥有 19 年经验。这包括在普华永道的 `Threat and Vulnerability Management`咨询部门担任六年的董事经历。他还花了十多年时间管理自己的咨询公司，专门为军事、情报和商业客户在全球范围内设计、构建和运营安全的高可用数据中心和网络。\n\
  \n\n\n\n与其任何事物相比，人类的易错性是网络犯罪的真相和动力。无论我们的网络安全工作多么复杂，人类的弱点中总会有某些方面可以被利用。但也许这一事实也驱动了我们不断创新和改善自身状况的坚定动力。正如莎士在《朱利叶斯·凯撒》中所写的：“亲爱的布鲁塔斯，错误不在于我们的星际，而在于我们自己。”\
  \ 我想补充的是，在网络安全科学中，适用于我们缺点的真理同样适用于我们的解决方案。\n\n我们经常在部署后发现，人类的弱点——从简单的生理疲劳和粗心，到更变幻莫定的认知偏误、选择偏误、虚假确定性和空想性——是系统内在的弱点。这反映了创新惊人的速度——在短短\
  \ 50 年里，我们的数字和技术进步已经超越了作为源头的人脑的能力。\n\n我们三磅重的大脑极其强大且敏捷。它超过 850 亿个神经元拥有约 60 亿伏的电荷。随着时间的推移，我们的大脑进化到能够应对人类面临的情况。问题就在于：我们大脑在数百万年的生存过程中已经过优化，而网络安全的诞生还不到\
  \ 50 年前。\n\n人类的设计并不是为了处理超出特定复杂程度的事务。当我们神经系统限制器的能力和人类弱点的局限受到数字世界（特别是网络安全）复杂性的挑战时，产生的结果就是一些最具挑战性和最持续性的安全漏洞。因此，网络安全经常因为人类操作员的决策失误或认知能力不足而遭受损失。\n\
  \n但这正是发明计算机的原因：为了处理人类无法应对的复杂程度和规模。这也是为什么我们如此坚定且警觉地致力于这种能力的完善和普及：为了以仅凭人类努力无法的速度和规模实现创新和效率。所以，我们不应该惊讶，已经达到了这样一个地步：网络安全链中最薄弱的环节往往不是硬件或软件，而是“湿性硬件”（wetware）：我们称大脑的含有\
  \ 75%水分、三磅重的器官。\n\n人类的易错性将继续成为网络安全机器中的幽灵，产生安全风险。然而，如果安全领导者能够识别并处理人类的弱点，他们将能够更好地控制这些风险。\n\
  \n在网络安全方面，数字安全的某些核心领域其庞大的规模和速度需要机器学习。我们也可以也应该利用机器来通过寻找人类决策或行动中的弱点，帮助补偿人类的易错性。\n\n\
  数字和人类信息处理——虽然不同但都至关重要——必须进行清晰且具有战略性的界定，以避免矛盾的混乱。当我们加速进入一个由网络空间与物理便利汇聚所定义并主导的时代（例如\
  \ `IoT`、自动化、实时分析、`AI`）时，我们必须意识到人类的弱点不仅是一个必须接受的安全弱点，也是一种既可以被补偿也可以被利用的东西。通过让自己毫不移地专注于人类头脑究竟能做什么和不能做什么，我们将更清楚地认识到某些任务最适合人类思维的高级直觉和创造性理解。\n\
  \n人工智能和机器学习的真正潜力最生动地揭示不是通过它们能做什么，而是通过它们不能做什么。通过理解何时应用人类思维的力量，何时应用高级自动化的力量，我们已经做好了准备。\n\
  \n## 克服人类弱点：人与技术的力量\n\n人类的易错性将继续成为网络安全机器中的幽灵，产生安全风险。然而，如果安全领导者能够识别并处理人类的弱点，他们将能够更好地控制这些风险。\n\
  \n在网络安全方面，数字安全的某些核心领域其庞大的规模和速度需要机器学习。我们也可以也应该利用机器来通过寻找人类决策或行动中的弱点，帮助补偿人类的易错性。\n\n\
  数字和人类信息处理——虽然不同但都至关重要——必须进行清晰且具有战略性的界定，以避免矛盾的混乱。当我们加速进入一个由网络空间与物理便利汇聚所定义并主导的时代（例如\
  \ `IoT`、自动化、实时分析、`AI`）时，我们必须意识到人类的弱点不仅是一个必须接受的安全弱点，也是一种既可以被补偿也可以被利用的东西。通过让自己毫不移地专注于人类头脑究竟能做什么和不能做什么，我们将更清楚地认识到某些任务最适合人类思维的高级直觉和创造性理解。\n\
  \n人工智能和机器学习的真正潜力最生动地揭示不是通过它们能做什么，而是通过它们不能做什么。通过理解何时应用人类思维的力量，何时应用高级自动化的力量，我们已经做好了准备。\n\
  \n### 技术解决方案的需求\n\n现实是，你无法阻止人们犯错。这就是人类本性。7%到 11%的人经常在我们的钓鱼演练中失败。在这些人中，很大一部分的人甚至交出了他们的凭据。我们需要技术解决方案来补偿这些问题。在钓鱼攻击的情况下，我们实施了多因素身份验证，并设置了防火墙之外没有其他登录方式，这意味着当人们向外部攻击者提供凭据时，我们现在会收到警报。\n\
  \n\n\n显而易见，依赖 AI 来筛选海量的重复数据是有价值的。但一旦 AI 完成了工作，你仍然需要人类来审视哪些内容是可操作的。这是因为 AI 目前对语境的处理还不够出色。没有语境，数据就意义其微。在一种语境下完全正常的行为，在另一种语境下可能是灾难性的，你真的不希望\
  \ AI 系统混淆这两者。例如，一个名为 `Wireshark` 的网络嗅探器工具是大多数技术人员工具包的标准组成部分。在技术人员的工作站或笔记本电脑上，`Wireshark`\
  \ 并不是问题。但如果你在一个包含信用卡数据的服务器上发现了 `Wireshark`，那可能就是一个大问题。正是语境导致了差异。\n\n因此，安全往往取决于判断。自动化可以减少噪音，让我们能够集中在重要的事情上。但只要\
  \ AI 无法在好坏之间做出明确的判断，它就需要被标记出来交给人类处理，因为语境对人类来说仍然容易评估得多。\n\n### 人际技巧的需求\n\n这是技术层面的，但\
  \ CISO（首席信息安全官）必须处理许多需要人际技巧而非技术技能的问题。在太多的公司里，安全部门被称为“业务终结之地”，或者“首席执行官办公室（CE-No.\
  \ Office）”。在我们的组织中，我们被视为一个可以寻求帮助的地方。而这是一个很难实现的目标。\n\n我对员工下出的首要指令是：永远、永远不要对请求说“不”。相反，你始终要用“好的，如果……”开启对话。例如，“好的，如果我们把你关进一个只会让你弄得满身血的房间，你可以做一些非常、非常、非常愚蠢的事情。”你必须允许业务进行，但要以管理风险的方式进行。\n\
  \n这始于建立关系，让人们把安全部门视为他们可以寻求帮助的地方。当然，我的工作是确保业务安全。但如果人们避开我们，他们就会更容易伤害自己。我必须通过建立帮助他人实现目标的声誉，让自己平易近人。对于安全团队来说，这通常需要改变组织思维。\n\
  \n要记住的第一点是，如果某件事在我们看来很愚蠢，那可能是因为我们不理解那个人想要实现什么。安全组织需要转变视角，从请求者的角度来看问题，因为他们想做的事情对他们来说总是是合理的。他们只是不理解为什么不能以那种特定的方式做那件事。指导我的员工用“好的，如果……”来回答每一个问题，这迫使我的团队进入一种思维框架，即如果客户要求此项，他们一定是因为某些我们尚不了解的原因才这么做。\n\
  \n像影子 IT（Shadow IT）这样的问题并不是人们试图行为不当的结果，而是人们觉得无法来我们这里解决问题，所以他们自己为之。在他们的经验中，要么 IT\
  \ 部门会说“不”，要么就是花太长时间。而现实是，他们可以在几分钟内用信用卡购买服务。因此，创建一个乐于助人且投入的环境有助于解决组织内部这种自找麻烦的挑战。当人们看到安全是平易近人且乐于助人的时，他们采取影子\
  \ IT 或自搞其事的动力就会减少。\n\n然而，某些人仍然会选择影子 IT，这就是为什么我们必须保持警惕。即便如此，你仍然需要理解，人们有时会为了正确的理由做错误的事。这就是为什么我预先与云服务商进行了谈判，确保如果我们公司的任何人购买了他们的云服务，这些服务必须符合最低配置标准，并且我们会收到警报。这样，如果有人想跑，那没关系，因为我们知道他们无法受伤，因为我们已经没收剪刀。\n\
  \n我们的目标不是限制人们做什么。相反，我们只是想尝试引导他们的行为进入正确的“泳道”。在前端，我们需要人们把我们看作是协作、乐于助人且提供咨询的。但在幕后，我们像每个安全组织一直以来一样不且偏执。但我们不让外人看到太多这些，因为那让我们看起来很狡诈且不可信。不信任滋生不信任。因此，我们明确表示，我们信任每个人，但也会进行验证。\n\
  \n许多转入 CISO 职位的人可能不理解工作中人性的那部分，但它是最重要的部分。如果人们认为你是乐于助人且提供咨询的，那么当你告诉他们不应该做某事时，他们很有可能会信任你。他们理解你并不是试图限制他们的行为。你只是想帮助他们以更成功的方式完成。他们实际上会相信你，并花力尝试取悦你，因为你对他们太有帮助了。\n\
  \n## 义务的力量\n\n人类是有趣的生物。我们受义务的支配。每当你去汽车展厅，你会发现销售员总是为你提供水或咖啡。总是如此。那是因为我们天生就把礼物视为一种义务的形式。所以从潜意识里，如果有人送我们礼物，我们会觉得有必要报答。而销售员要做的就是试图说服你通过买车来报答。\n\
  \n这可以很容易地转化为 CISO 的角色。如果你与某人合作过并给了他们一个成功的业务结果，他们通常会认为自己有义务。所以当安全部门的人以后走过来说：“嘿，这件事我真的需要你帮我”时，他们更有可能说“没问题”。\n\
  \n我非常喜欢的一个克里奥尔语词。它是“lagniappe”。它的意思是多加一码，或者是那份额外的小礼物。如果你买了一打甜甜圈，他们又在盒子里多放了一个，那就是\
  \ lagniappe。所以当我们在安全领域做任何事情时，我都会尝试加入 lagniappe。\n\n如果我必须收回某些东西，例如人们对 `Gmail` 的访问权限，我会给他们一个单登录门户，这样当他们使用\
  \ `Office 365` 时，他们甚至想要旧的 `Gmail` 了，因为一切都很顺畅。也许为从外部登录的人提供多因素身份验证。但当他们到达那里时，他们有一个单登录门户，所以他们不再需要记住报销系统或\
  \ HR 系统的任何密码。\n\n我总是尝试增加 lagniappe 这种价值。这是我最喜欢的词之一，因为它意味着那种让人们说“噢，真不错”的意外惊喜。\n\n\
  当然，理解威胁趋势和最新的安全技术是工作中极其重要的一部分。但工作中人性的部分至关重要，而且往往被忽视。人们总是记得与你的最后互动，胜过记得其他事情。如果他们的最后互动是愉快的且乐于助人的，那就是他们记住你的方式。这让你保护业务的工作变得容易得多。\n\
  \n## 关于贡献者\n\nKevin Kealy – 英创科技 CISO\n\n自称为“安全怪癖王子”的 Kevin Kealy 声称他大规模污染了 `Google`，并说他不是那个老兵或警察局长，他不唱《爸爸》，绝对不是那个死掉。他拥有伦敦大学信息安全硕士学位。\n\
  \n他有一本书已出版，另一本也即将出版。他经常演讲——有些人可能认为太频繁了——关于安全和技术话题，是这些及其他话题受邀的评论员。\n\n\n\nKealy 在互联网领域工作了多年，同时也涉足\
  \ IP 语音传输（VoIP）、道德黑客、网络架构和审计缓解。他在 VoIP 安全方面的开发拥有两项专利，但除非与安全有关，否则他似乎无法在任何事情上集中注意力太久。他合著了多本关于互联网、取证和数字证据可信性等主题的书。\n\
  \nKealy 曾担任过面向客户和开发角色，在 AT&T 实验室工作了 16 年。他曾担任一家财富 500 强支付公司、一家大型健身连锁和一家大型户外零售商的首席安全官（CISO），并担任过其他公司的临时首席安全官（CSO）或首席信息官（CIO）。他目前是\
  \ Ingram Micro 的 CISO。\n\n# 通过设计克服人性的脆弱\n\nTheresa Payton，Fortalice\n\n无论是网络设计不当、设备配置错误、应用程序漏洞，还是人们仅仅点击了糟糕的链接或邮件附件，人类从设计上来说，往往是任何网络中最薄弱的一环。这里有一条可怕且心碎的标题，展示了我们持续未能主动应对人为错误所付出的代价：“邮件错误导致芝加哥学校员工丢业”。2018\
  \ 年 6 月 15 日，芝加哥公立学校的一名员工在意外发送一封群发邮件后失去了工作，该邮件中包含一个指向机密表格的链接，泄露了 3700 名学生和家庭的个人信息。如果\
  \ IT 社区尽到其职责，那个错误绝不会发生。\n\n几十年来，安全问题日益严重，这由许多因素造成。一个重要的考虑因素是，网络犯罪的利润极其丰厚，因此依靠网络犯罪维持自己和家庭生活的人数正在增加。国家支持的威胁也在增长，而且它们不仅针对美国政府，还针对企业甚至个人公民。当你将创新的技术堆叠在旧的基础设施之上时，你面对的是真实且复杂的安全挑战。现在不是我们依靠人类作为最后防线的时候。\n\
  \n尽管我们已经知道这一点几十年了，但今天的安全从根本上仍然是破碎的，我们所做的一切实际上是在让成功规避攻击变得更加困难。例如，当我们最初开始使用互联网时，我们只需要一个好记的用户名和密码，而且为了记住，我们把它做得非常简单。这就是为什么许多人会使用宠物的名字、学校吉祥物、毕业年份或家庭昵号作为密码。没有人告诉过我们我们需要保护自己正在使用的邮箱地址。没有人说过“不要随手把地址给给任何人”或“不要注册所有那些免费优惠券”。\n\
  \n人们泄露自己的邮箱地址，接下来的事情，你就会发现他们被那些没有继承人的尼日利亚王子欺骗了，或者他们中了百慕大大彩票。但这不应该感到意外。诈骗者自远古以来一直在利用人类信任的脆弱性。但对于解决这个问题，我们无所事事，除了说：“你知道吗？你们的密码应该更难被别人猜，”——顺便说一句，这意味着它们对你来说也难记忆。哦，不要重复使用你的密码。此外，你的用户名要更有创意，噢，顺便提一下，你的邮箱地址现在关联了从社交媒体到银行账户的一切。问题只是在不断恶化。\n\
  \n## 为什么我们一直把解决安全问题的责任推到用户身上？\n\n现在是时候让我们说“好吧，人类是最薄弱的一环”了。我们点击链接，我们收到一封带有可爱熊猫附件的邮件并点击它，或者有人给我们一个\
  \ U 盘我们就直接插进去。我们不小心向许多人分发了不该提供的秘密数据。我们已经知道这一点。\n\n那么，为什么那个芝加哥公立学校的员工最初被允许发送秘密数据链接呢？我们知道那种数据不应该离开组织。为什么邮件系统不简单地说：“这个电子表格中有个人身份信息（PII），你正要将其发送到外部？这大不许可，”或“你真的确定要发送这个吗？”当然，IT\
  \ 行业会告诉芝加哥公立学校系统：“我们有这个问题的解决方案。这被称为数据泄露防护（DLP）。让我们为您定制该解决方案，费用是您年度预算的数倍。”\n\n这不仅关乎终端用户表现出的弱点。我们的\
  \ IT 团队面临同样的问题。例如，人类被要求阅读并关联数百个日志文件以发现问题，这就像是在针堆里找针，结果是可预见的。人性的脆弱被反复证明是我们面临的最严重的安全威胁之一，而且它永远不会消失。\n\
  \n企业和消费者实际上在驱动这种不良行为。当我从弗吉尼亚大学读完研究生学位毕业时，我们追求的是高效代码、无错误代码，并将错误发送到不同的地方，以这样我们就不会有这些开放式事件。这完全关乎安全、高效且没有错误。今天的问题是，由于对解决方案进入市场的需求加速，在我们设计应用和产品时，安全不再是白板会议的一部分——它变成了一个事后考虑的问题，只有在完成所有其他工作后才会实施，而且通常仅仅表现为要求用户\
  \ ID 和密码。充其量量是多因素身份验证。\n\n这是因为企业和消费者有要求。他们说：“我要快。我想要最酷的、最先进、最棒的。。同时，我不想为它付很多钱，我只想让它好用。哦，我不想读说明书。”人们只希望插上就能用。这些现实并不需要改变：安全社区需要拥抱人类心理并交付安全。\n\
  \n结果是，我们每年都会经历发生过的最大、最恶劣的泄露事件！尽管在世界上见过的最先进安全技术上投入了 1 万亿美元，但美国人事管理局（OPM）、Equifax、索尼、Target、Anthem\
  \ 等都遭到了攻破。为什么？因为我们建立目前的网络安全方法是围绕保护旧的数字常规的：我们仍然在身份卡上磁条（约 20 世纪 70 年代），我们继续尝试为“用户\
  \ ID 和密码”建造更好的捕鼠器（约 20 世纪 70-80 年代），并且我们使用相同的方法保护邮箱账户（约 20 世纪 90 年代）。\n\n购买需求的这种转变创造了一个在设计上不安全的迭代循环。这就是为什么开发端必须发生类似的意识形态转变，要求软件程序员和安全工程师设计设计考虑安全，这样人类培训不再是我们应对人为错误的最后防线。我们必须转变范式，不再仅仅信任人类选择一个好的密码或不点击恶意链接，因为我们人都知道那行不通。\n\
  \n## 在针对人性脆弱进行规划和设计时，我们需要考虑以下现实：\n\n- 网络犯罪的威胁导致组织对网络安全的兴趣大幅增加，公司花费数十亿美元保护自己免受快速变化的当前和潜在未来威胁。\n\
  - 网络分子倾向于寻找机构防御中最薄弱的点，这通常意味着针对客户。\n\n\n\n\n*   随着资金流动性的不断增强，网络攻击者对移动性攻击向量的威胁可能会增加。\n\
  *   企业网络和系统也是网络攻击的恒定目标。虽然黑客可能为了窃取贵贵数据、消费者记录、账户凭据或贸易秘密，但现实是，近 80% 的网络攻击始于欺骗用户。\n\
  *   新技术的引入，如云存储、IoT 设备、软件即服务（SaaS）的采用以及用户连接到网络的移动设备的增长，共同驱动着数字化转型，使组织能够在当今互联的市场中更有效地进行竞争。虽然这些额外的功能和设备提供了许多益处，但它们也引入了新的漏洞，这并不意外。\n\
  *   在这一切中，人类仍然是任何安全防御中最脆弱的环节。不仅 95% 的安全漏洞是由于我们没有准备好防范的复杂攻击，而且人为失误也导致了 95% 或以上的泄露事件。\n\
  \n### 解决方案：针对人类心理的设计\n\n永远不要信任技术的安全性，这样你永远不会失望。\n\n今天几乎所有的技术都是开放的。它们必须如此。如果你刚刚购买的智能手机、平板电脑、智能手表、游戏系统或其他昂贵的设备无法轻松连接到在线资源或自动更新，你会感到沮丧。你之所以感到沮丧是因为你花了很多钱。从设计上来说，这些设备是开放平台，允许你快速下载最新的应用、更新操作系统、执行敏感交易、加载安全补丁等。但因为它们是开放可供更新的，所以无论我们做什么，它们也容易受到黑客攻击。\n\
  \n这些设备之所以如此脆弱的原因之一是，我们建立了非常晦涩的规则来遵守，例如使用 12 位不重复的数字或字母密码等，这些规则如此复杂，实际上帮助了攻击者进入，并将合法用户挡在外面。我们努力设计了更像“促进者”的安全系统，并制定了让人们在获取工作所需的网络访问时受到限制的规则。自然地，他们会寻找绕过这些路障的方法。\n\
  \n当我被要求为总统执行办公室设计安全战略时，我知道，如果我们想保护他们的隐私和安全（在很多情况下也保护国家安全），我们就必须解决员工的心思和问题。在入职的前\
  \ 90 天内，我产生了两个关键问题，我知道我必须回答它们，否则我们可能会面临重大的灾难：\n\n*   尽管拥有才华横溢的安全团队并在安全方面投入了大量，为什么泄露事件仍在发生？\n\
  *   为什么尽管经过了数小时无聊的计算机化培训和安全活动，我们仍然会犯错并点击被利用的链接？\n\n对我来说变得很清晰，我们需要一种新的思维，这种思维要终结无聊的计算机化培训课程，并且在我们没有尝试用创新来对抗风险中的人为因素之前，禁止购买最新的安全工具。这种新方法的底层路径由一个核心原则驱动：**为人类而设计**。\n\
  \n这种思维方式与当你家里有年幼、好奇的孩子时，安装儿童防护或安全用品是类似的。你仍然会告诉他们“不要碰”，但以防万一他们真的碰了，你已经考虑到他们的考虑并在房子里设计了安全。同样，我们需要使用这一基本原则为员工设计安全防护。我们已经知道用户会访问免费\
  \ Wi-Fi、重复使用密码，并响应那些欺骗他们交信息的电子邮件——事实上，他们会打破所有的安全规则，因为他们不是安全人员。\n\n顺便说一下，我要告诉你们一个小秘密：安全员工也会违反规则！他们在查看日志文件或配置或修复几十台设备时会感到无聊和粗心。他们会离开端口或创建后门，以便在他们不在办公室时以后完成一些工作。在最坏的情况下，他们的用户名是\
  \ `admin`，密码是 `admin`。\n\n### 获胜的安全策略\n\n我的整个职业都在关注网络安全挑战，我发现，如果我们想在应对网络犯罪挑战中获得并保持领先地位，安全专业人员和整个安全行业需要采取六种关键方法：\n\
  \n*   **生活就像快乐餐。** 让某人做他们可能不想做的事，通常需要在他们的午盒里增加一份“奖品”。你必须从赢得你试图保护和试图塑造其行为的人的心思开始。你通过被视为促进者和问题解决者来实现这一点。你仔细倾听，承诺解决他们的问题，然后提供比你承诺的更多的回报。这样，当你需要他们的帮助处理安全问题时，他们已经有动力支持你了。\n\
  *   **分段以保护它。** 一个开放的网络只存在于观察者的眼中。虽然你可以设计网络，让人们访问工作所需的工具，但你还需要建立清晰的网络分段。这样，当攻击者不可避免地攻破一个设备或一组设备时，你已经有了控制措施来保护关键数据和资源，特别是当该威胁试图横向扩散时。\n\
  *   **重新设计访问。** 用户名、密码甚至多重认证访问控制正接近其生命周期的结束。在许多情况下，那个过期日期早已已经达到。需要根据许多标准重新考虑访问，包括位置、设备类型，甚至是行为分析。如果用户尝试访问他们以前从未请求过的某些数据，或者尝试从新位置连接（无论来自世界的另一个地方，还是仅仅来自建筑另一侧的配线间），这样做应自动触发额外的控制措施。一旦授予任何访问，该设备需要自动重定向到特定的网络分段，并在那里可以进行记录、跟踪、监控甚至隔离。\n\
  *   **实施数字粉碎策略。** 当东西被删除或丢弃时，它需要真的被删除。我们不仅需要对旧的或不再有用或相关的数字数据处置遵循严格的规则，而且这个过程必须自动化，以免人为失误导致关键信息留在某个硬盘上等待被盗取或利用。\n\
  *   **建立真正的教育和意识计划。** 大多数安全培训计划都是它们最大的敌人。与其让整个公司通过同样的无聊的计算机化培训（CBT）安全计划，不如针对不同的小组和工作功能定制计划。为参与者创造奖励。让小组聚在一起进行面对面的培训，并使其成为他们期待的活动。将轻松且有回报的报告机制纳入你的安全意识策略中。虽然人类的脆弱性是一个真实的问题，但人类也可以成为关键的安全盟友。\n\
  \n\n\n\n\n-   尽可能利用自动化和机器学习。诸如 `AI`、自动化和机器学习等技术可以成为关键的人类安全网。将尽可能多的冗余、无聊、繁琐、劳动密集型工作交给机器，以释放人类精力，让他们从事他们更擅长的高级处理工作。如果人们可能会点击恶意邮件附件，请在风险到达他们手中之前识别并消除它。如果人们为了规避复杂的密码要求而创建易于破解的密码，请利用行为分析和现有数据提供更好的安全性，同时确保他们访问工作所需的资源时尽可能简单、顺畅无缝。\n\
  \n## 关于作者\n\nTheresa Payton – Fortalice 创始人兼首席执行官\n\nTheresa Payton 是网络安全与情报、网络犯罪和欺诈领域的权威。作为白宫首位女性首席信息官（CIO），她曾为总统及\
  \ 3000 名员工管理 IT 业务。在进入白宫工作之前，Payton 曾在银行业担任高级高管，拥有 16 年解决方案解决方案经验。Payton 于 2008\
  \ 年创立了 Fortalice，并为政府和私营部门组织提供专业知识，帮助他们提升安全态势。Payton 还曾作为 CBS 门剧《猎人》（Hunted）中的情报行动副指挥出现。《Security》杂志将她评为安全领域前\
  \ 25 位最具影响力的人之一，她近期被 IFSEC Global 评为全球第 4 位最具影响力的安全专家。\n\n# 未来\n\n![](img/bapp01uf001.png)\n\
  \n人类是如何从几万年前的木矛，进化到能够将人类送到月球并往回的？还有哪种动物以这种速度进步的？这种变化速度对数字大爆炸和网络安全意味着什么？\n\n在有记载的人类历史很久以前，人类大脑发生了一些变化。许多科学家认为，无论是随机还是环境引起的突变改变了我们大脑的生理结构，为我们之间进行更稳健的交流和更抽象的思考开启了大门。或者情况恰恰相反：交流和抽象思考的能力增长到了临界点，加速了大脑生理结构的变化。无论何种情况，我们的未来都被永远改变了。\n\
  \n数字大爆炸已经并持续继续作为一种类似的加速器，以惊人的速度驱动着我们的未来。虽然有些人仅仅因为未知而恐惧未来，但另一些人则担心技术将超越人类——合成人将会出现，并超过大脑奇妙生理结构的发展。但这是一本关于科学的书，而不是关于恐惧的书。我们不需要恐惧未来或服务于未来的技术；我们的发明本质上既不是善，也不是恶。人类有责任也有机会引导技术的应用向善的方向发展。\n\
  \n在网络安全领域，成功——或“善”——的定义是什么？是 70 亿人在线但安全性不足，还是只有 20 亿人在线但安全性足够？哪种更好？我不知道。网络安全不太成为伟大的平等器，让每个人都获得相同程度的安全，但它应该是一场让所有船都浮起来的海潮——平均安全水平应该提高。本书的前几个章节确定了所需的要素和公式，如果严谨地使用，将实现广泛可及的高质量安全。但我们如何将这些要素扩展到数十亿人身上？\n\
  \n我们又如何衡量对科学严谨性的采纳——即围绕速度和连接这两个核心要素进行优化、承认长期存在的缺陷、实施基础和高级策略以及拥抱高阶维度——是否真正落实？让我们看看一些可能的方法，一些通往未来的指南针，以达到目标。\n\
  \n## 统一的力量\n\n创建一个广泛可及、高质量且可扩展的安全世界，始于利用 70 亿多人的智慧和动力。\n\n我们该如何做到这一点？！\n\n这并没有你想象的那么困难。我们可以回顾过去，了解以前在大规模上是如何完成类似任务的。\n\
  \n通过某种方式，社会实现了从小部落到管理数亿人的实体的治理跨越。通用价值观可以作为统一的力量，并塑造人们的行为。值得注意的是，价值观并不带有价格标签——这需要资本投入。价值观也可以被创造。一旦被创造并采纳，它们将成为稳定性的来源。当然，价值观的自愿采纳是关键。\n\
  \n一个很好的例子可能是环保主义，这是一个人类相信保护地球的责任，且行为准则已经建立并被遵循的概念。我们需要“网络空间环保主义”，一套共同的信念、准则和经历——一种安全文化。要改变文化，我们需要改变人们的经历。\n\
  \n建立价值观是至关重要的，就像大爆炸之后一样。此类价值观的例子包括政府不应攻击彼此的基础设施、不应窃取知识产权并与国际执法部门合作。迄为止，我们尚未创建并就这些问题，并因此遭受痛苦。这种情况必须改变。\n\
  \n## 关系\n\n社交媒体是答案吗？社交媒体允许信息以一百年前无法想象的方式流动。这是一件好事。但一些人可能认为，社交媒体也严重侵蚀了我们建立的关系强度。在线\
  \ 500 个所谓“朋友”或连接的支持，可能远不如一百年前从 10 个朋友那里获得的支持。我们在网络空间的关系需要产生后果——无论好坏——就像我们在其他领域的关系一样。\n\
  \n## 知性的乐观主义\n\n如果没有对未来具有更好潜力的洞察和乐观，数字化转型将永远受到阻碍。网络犯罪和敌对国家不会消失，因此需要网络安全领导层为平台建立信任，让那些寻求在网络空间大展宏图的人看到充满前景。\n\
  \n信用卡行业是一个很好的例子。零售商信任今天使用的信用卡明天会有款项。同样，个人也信任如果发生了最坏的情况（尽管采取了合理措施信用卡号仍被泄露），他们的责任和风险也是有限且较小的。结果是零售商、个人以及作为中介的银行都受益，导致支出增加、便利、快乐和利润增长——这些转化为对未来的信心。\n\
  \n埃莉诺·罗斯福曾说：“我们在每一次真正停下来面对恐惧的经历中，获得了力量、勇气和信心……我们必须做那些我们认为做不到的事。”互联网信任的未来将一砖一瓦地建立。这种信任的技术基础科学在之前的章节中已经描述，而紧随其后的是更广泛的网络保险的使用，以补偿意外。我们需要技术和保险方面的解决方案来创造并维持未来的信任。\n\
  \n## 对事实与智慧的追求\n\n\n\n\n科学往往被描绘为瞬间的突破，但也许最重要的突破既不是突然的，也不是显而易见的飞跃。这一关键的突破是一次刻意的后退——当科学家们意识到他们并没有所有的答案时。在过去的几个世纪里，领导者通过声称拥有独特见解来治理国家，并利用这种权力来控制那些被标记为无知的人。但今天，科学家们承认他们不知道宇宙大爆炸之前存在什么，并因此不懈懈地追求知识。\n\
  \n其前提是，我们需要将网络安全视为一门科学，并利用这种理解来开启更光明的未来。这意味着我们必须诚实地承认，我们有许多未知且需要解决的问题。我们不应该满足于“盲人之地由独眼人领路”。将网络安全视为科学的迷之处在于，科学的既定真理是不争议的。这些真理不需要选出胜者，而且对于边界是中立的，无论你是否相信它们，事实都如此。\n\
  \n回顾历史，科学——例如生物研究——曾被用于完全不同的目的：军事导向与经济导向。尽管如此，网络安全科学——例如解决互联网身份验证问题——可以并且应该继续进行。网络安全科学既应该在成就上是安全的，又要渴望发现新的智慧、减少无知并找到更好的方法。\n\
  \n## 服务于人类的机器\n\n我们离改变定义人类特质的能力还有多远？今天，很少有人会反对为残疾者提供关节、为稳定心跳提供起搏器，或为瘫痪者提供脑波检测传感器。今天，我们已经能够改变人类的基因组成来改变生长的物理方向。在动物身上，科学家已经发现了不仅控制物理特征、还控制某些行为的基因。\n\
  \n改变人类组成、重编程我们的行为以及获得看似无尽的计算和存储能力以做出决策的能力，可能是一个新物种的基石，这种物种由计算机化的人类组成——更聪明、更强壮、更有道德。我们可能离决定如何将人类智能和意识存储在计算机中以过虚拟生活（或者如果这太太大了，就是为了在肉体版本受损时作为备份副本）。\n\
  \n令人陶醉的内容（双关语在此）。\n\n那些担心 AI 的人害怕，计算机不仅将比人类更敏捷、思考更深，而且计算机还将创造出取代人类的，无论是通过创造机器人接管物理世界的空间，还是通过主宰关键资源供自己使用（例如运行所需的电力和冷却所需的水）。\n\
  \n在网络安全领域，我们使用通过故事的工具来构建我们的策略和架构，就像古代文明编织复杂的故事来解释善胜于恶的重要性一样。但我们不应该让关于潜在黑暗未来的叙事——网络空间的恐吓战术或恐怖故事——来驱动我们的网络安全行为。我们需要从那些谈论网络安全善恶的网络安全传教士手中解脱出来。相反，我们需要将网络安全与科学家的语言联系起来，通过精确的科学术语识别行为和数据流，让定义网络安全政策的人类意图被自动翻译成机器语言。\n\
  \n未来的路标是服务于人类的技术。\n\n今天，网络安全主要被视为一个自我舔舐的冰淇淋筒：你实施安全是为了更好的安全。要取得成功，网络安全必须实现飞跃——从被视为一种必要的恶（一种业务成本）转变为一种以更高效率或更有效性开展业务的手段。具有变革性。就像人类发现他们可以通过将速度与机翼相结合，将一种功能——速度——转化为完全不同的功能——升力一样。飞机就是这样发明的，我们也学会了在物理世界中飞行。在数字世界，我们需要通过将网络安全与所有者的战略意图相结合，发明出等同于飞机的产品。\n\
  \n将意图注入安全是一场重大革命，它将允许安全策略和解决方案能够增长、扩展并动态且经济地适应，以解决今天的速度和规模问题，同时成为经济和个人成功的基础。基于意图的安全遵守并执行网络安全科学——即规则和公式——以快速和规模创建安全、可靠的网络安全科学。最终结果将是机器服务人类，而不是人类服务机器。\n\
  \n安全持续演进有许多路径。希望在灾难性事件中幸存是非常危险的。更理想、更谨慎的做法是现在尽可能为你的环境进行未来化规划，并为未来的灵感和灵活性留出机会。\n\n\
  ## 结论\n\n在宇宙大爆炸中幸存的生物、思想和技术的特征有一个共同点：耐力、敏捷、灵感、智慧、进化的意愿，最重要的是对科学规律的外部强制性服从（“你无法欺骗大自然”）。在我们以数据为中心的未来，网络安全科学应该成为基础。\n\
  \n\n\n` 标签中似乎中断了（只包含了前两个部分），我将根据你提供的完整逻辑，对你给出的文本部分进行了深度翻译。\n\n以下是翻译后的译文：\n\n[content]\n\
  深度学习是机器学习（ML）的一种形式，数据通过自我调整的数学网络进行过滤，这些网络灵感部分源于大脑中神经元的结构。这种学习方式也被称为神经网络（ANN），它可以从海量数据中识别出模式和异常。\n\
  * ML 使用数据来优化计算机做出预测或执行任务的方式。系统可以学习如何进行预测，然后自主做出决策。\n* AI（人工智能）使系统能够模仿人类行为做出智能选择。\n\
  \n这些层层协同工作并互为补充，使系统能够处理海量数据、筛选并检测重要信息，然后做出反应。实现这一点的关键在于使用恰当的方法来训练 AI 和 ML。对于网络安全而言，三种方法最有前景：\n\
  \n* `Supervised Learning`（监督学习）这种初始模型通过向 AI 输入大量的标记数据来开始训练，清晰地识别每个标记数据集的特征，然后反复将这些特征应用于未标记的数据。\n\
  * `Unsupervised Learning`（无监督学习）在下一阶段，算法没有已知的解集可以遵循。相反，它会识别第一阶段学到的模式，使其能够在没有人工帮助的情况下对数据进行标记。此时，可以缓慢引入新数据，迫使它处理以前未见过的数据并做出新的决策。\n\
  * `Reinforcement Learning`（强化学习）随后，通过使用未标记文件对系统性能进行评分，对监督和无监督学习的结果进行“测试”，并对良好的结果给予系统“奖励”。然后，训练将持续在这三种学习策略之间循环进行。\n\
  \n仅仅让 AI 和 ML 系统运行起来就是一项极其艰巨的任务。但让 AI 和 ML 系统在现实世界中运行则更加困难。任何告诉你它们运行起来像魔法一样的人，都没有拥有一套能够抵御网络安全战场上复杂困境的系统。事实是，AI\
  \ 和 ML 需要导轨和人工监督，这样它们才能发挥魔力，同时在魔力失效时识别出何时需要人类智力或基于规则的方法。在 Fortinet（飞塔），我们实现 AI 和\
  \ ML 应用于现实网络安全系统的旅程已经走了六年。虽然我们对取得的进展感到满意，但显然，网络安全领域没有任何一个领域不会被 AI 和 ML 改变。我们还有很多需要学习，并期待这段旅程。\n\
  \n### 作者简介\n\nMichael Xie – Fortinet 创始人兼首席技术官\n\nMichael Xie 在网络安全行业拥有 15 年以上的经验。此前他曾担任\
  \ NetScreen 的软件总监和架构师。他荣获了《Everything Channel》CRN 发的 2009 年技术创新奖。他还被安永业评为 2006 年北加州年度企业家，并被\
  \ 2004 年 `VARBusiness` 杂志评为顶级技术创新者。Xie 拥有曼尼托巴大学的电气与计算机工程硕士学位，以及清华大学的汽车工程硕士学位。\n\n\
  ## 网络安全的未来\n\n*Ken Xie, Fortinet*\n\n这本书代表了一个里程碑，因为它如此清晰地解释了网络安全的历史，并为行业下一阶段要做的工作奠定了基础。在我的整个职业生涯中，我一直在致力于通过解决方案解决\
  \ Phil Quade 和贡献者在书中描述的挑战。我们见证了速度和连接性如何驱动互联网的采用并创造了巨大的价值，也看到了网络安全必须如何服务并放大这些力量，而不是成为阻碍。\n\
  \n当我们创立 Fortinet 时，Michael 和我对网络安全如何真正与驱动互联网成功的力量保持一致、解决文中描述的基础缺陷，并超越已呈现和分析的基础及高级策略中已取得的成就有了愿景。\n\
  \n我们相信，安全将越来越多地整合到基础设施和应用程序中，基于由意图驱动的智能自动化控制的安全织网（security fabric）。我们对新安全框架的愿景将提供一种架构，既能与速度和连接的力量保持一致，又能跟上不断将互联网用途扩展到新领域的步伐。通过\
  \ AI 和自动化，这一愿景接纳并协调了解决基础缺陷的技术，形成了安全织网。\n\n如果我们能正确实现这一点，我们将不再是追赶者。相反，我们将拥有一个新互联网的基础——这种网络在每一层都设计了真正的安全性，不仅处理技术层面，也解决了人类脆弱性、隐私和复杂性管理等高阶挑战。\n\
  \n这无疑是一项艰巨的任务，但我们认为，基于书中讲述的故事，我们现在可以指引一条质质的网络安全架构道路，这种架构将成为全新互联网的基础。\n\n### 网络安全的三代演变\n\
  \n网络安全领域的格局现在已经达到了我们可以开始思考所有组件如何协同工作的程度。这之所以可能，是因为我们现在拥有实现了基础和高级策略的解决方案，涵盖了许多基础缺陷。这些解决方案作为控制点，允许我们检测并引导底层终端、网络和其他计算基础设施正在发生的情况。\n\
  \n网络安全并非一开始就有如此广泛的解决方案。27 年前我在斯坦福大学读研期间创立第一家安全公司时，第一代安全侧重于连接。防火墙作为最初的控制点被放置在网络边缘，控制谁和什么可以连接网络。几年后，这些防火墙与\
  \ VPN 结合以加密流量，随后出现了 `IDS` 和 `IPS` 工具以更好地监控和保护流量，因为威胁已变得复杂。\n\n但这些新的安全解决方案是资源型的，这对业务运营产生了影响。这就是为什么几年后我构建了第一台基于\
  \ `ASIC` 的防火墙设备，从底层开始重新设计了防火墙。`ASIC`（专用集成电路）是用于网络安全处理的特殊芯片。正如 `NVIDIA` 设计了图形处理器（`GPU`）、`Google`\
  \ 设计了张量处理单元（`TPU`）一样，这种定制的 `ASIC` 让防火墙的运行速度比纯软件快了 10 到 100 倍，使组织能够在不兼顾性能或保护的情况下运行业务。\n\
  \n\n\n\n# 网络安全的演变\n\n第二代网络安全始于威胁开始针对应用程序。内容变得更加丰富和强大。连接之间传输的不再仅仅是文本或被动文档，而是可以被编程成为攻击载体的内容。Fortinet\
  \ 的成立是为了为机构提供第二代防火墙，这种防火墙能够识别、检查并保护应用层事务的安全——这是第一代防火墙无法做到的。对内容的全面检查（后来被称为统一威胁管理）被证明是极度消耗资源的，其所需的计算能力是仅检查网络路由的所需计算能力的\
  \ 100 倍。为了跟上这一步伐，人们开发了可以提供 100 倍性能提升的 ASIC 驱动硬件。然而，大多数安全实践仍然保持不变，因为网络边界仍然定义明确，设备仍然由自己拥有并控制，且流量规模是可预测的。\n\
  \n另一个重大转变已经发生。由于我们许多人拥有移动设备，并且在许多领域工作（而不局限于公司的蚕茧内部），因此不再可能假设防火墙内部的所有操作者都是好的。防火墙内的每个人、每台设备都被视为威胁。在这个时代，防火墙保护的边界消失了，信任区域也不复存在。我们需要一个复杂得多的环境——一种安全织网（security\
  \ fabric），它整合并协调各种能力，通过响应式协同工作来满足我们的需求。速度和连接性正推动互联网进入海量领域，包括物联网（IoT）、医疗设备、大量的移动应用程序等。这些每个领域都将拥有可以作为控制点的解决方案，而且这些方案也是软件定义的。这些控制点和相关基础设施也将成为安全织网的一部分，利用智能且强大的网络安全使每个领域变得更加安全。\n\
  \n第三代网络安全正作为一种更智能、更协调的安全织网逐渐变为现实。为了处理零信任网络安全范式，安全织网必须适应并在威胁出现时将其遏制。这种智能使得能够从创建网络连接之初就考虑安全问题，而不是将网络安全作为事后补救。虽然显而易见的是这些每个领域都有各自的网络安全挑战，但显而易见的是一种通用方法正在出现。安全织网将成为这种方法，从对响应式集成和编排能力的愿望，转向全新的网络安全架构，这种架构将需要在多个维度上取得进展。\n\
  \n## 在新基础设施中构建安全性所需的硬件和软件\n\n互联网始终是分布式的，在某种程度上，网络安全也是分布式的。但移动应用程序、5G、软件定义广域网（SD-WAN）以及边缘计算和云计算的兴起，导致了数据和计算在互联网上的分布急剧扩张。任务关键型运营技术代表了另一个前沿。大多数数据不再留留在可以被边缘防火墙保护的公司网络内部。相反，全球网络和数据通过无边界业务、互联家庭和日益自主的设备连接了一切，包括交易、服务社交互动。\n\
  \n由于数据是当今业务的新货币，它比以往任何时候都是更有价值的目标。在这样的世界中，缩短检测和响应威胁的时间，同时在分布式环境中提供清晰的可可见性和保护是至关重要的。同时，机构还需要遵守更严格的法规，例如新的隐私法。而这一切正发生在全球网络安全人才短缺的背景下。\n\
  \n为了应对这些挑战，世界需要第三代：一种安全驱动的网络，其设计旨在跟踪数据和工作负载在互联网络和设备的灵活生态系统之间的移动。机构还需要能够通过单一视角查看并保护所有基础设施和设备，从端点和物联网设备到本地物理和虚拟系统，再到复杂的多云生态系统。\n\
  \n这种第三代安全必须为机构提供迫切需要的东西：以清晰且详细的方式表达他们希望的网络安全策略内容。这些策略将不仅仅是像第一代和第二代防火墙那样阻止访问。相反，它们将是处理零信任世界所需的复杂情况和响应的高级策略。结果将不再是一个护城河，而更像体内的免疫系统，移动并拦截并中和威胁。\n\
  \n为了实现这一目标，巨大的网络安全处理能力必须构建在互联网的分布式节点中。目前，许多网络安全处理是在运行应用程序的相同硬件上进行的。如果我们假设应用程序和网络安全组件将共享计算资源，我们很快就会碰壁。\n\
  \n\n\n\n引入这种程度的智能将使一种全新的安全意识运而生。我可以想象一种安全威胁指数，它可以指示互联网各个部分的安全性，并用红色标记为**危险**、黄色标记为**有问题**、绿色标记为**安全**。在建立连接时，路由算法可以感知安全，并选择一条通过互联网最安全部分的网络路径。在这个新的世界里，还可以想象许多其他形式的指标和优化方案。\n\
  \n## 基于意图的安全编排安全织网的力量\n\n互联网的大规模扩张和分布很快将使第二代安全技术显得不从心。安全织网（security fabric）作为持续新的的基础，能够跟上\
  \ 5G 等技术颠覆的步伐。但还需要另一个维度。\n\n正如刚才指出的，计算能力必须分布在整个互联网中，网络安全组件才有足够的能量执行其工作。但请记住，我们拥有一日益增长的组件集合，这些组件在每一层都将变成更大、更具可编程性的基础设施。每一个组件都会应用于每一个流量数据包吗？\
  \ 显然，这是不可行的。我们必须拥有由 AI 和机器学习驱动的编排大脑，它能够计算出如何控制安全织网，以在任何实例提供所需的安全。正如 Michael 的贡献所指出的，如果没有对\
  \ AI 的精深掌握，我们将无法应对网络安全当前的挑战。\n\n在关于网络安全的讨论中，经常被忽视的一点是，组织不同部门所需的安全策略类型之间存在巨大差异。分布式工作场所或分支机构所需的安全策略和修复措施，可能与保护总部关键任务系统和知识产权（IP）皇冠明珠的要求完全不同。\n\
  \n此外，安全系统必须具备扩展的能力，利用安全织网来预测黑客的行动、实时分析活动流量并检查非结构化数据。它们还需要自动关联从专业安全设备中收集的情报识别信息，以建立行为和模式的基准。这种对资源的持续监控和协调，使得集成安全解决方案能够预判安全威胁，并在资源被破坏之前对恶意意图做出响应，无论这些事件发生在何处。\n\
  \n现代网络安全系统必须能够接受高层指令，然后将该意图翻译成安全织网执行的战术。这就是基于意图的安全的使命：允许高层的意图表达通过网络安全解决方案和安全织网基础设施的复杂配置来实现。在我看来，编排大脑应如下运行工作：\n\
  \n1. 以各种方式对计算格局进行标记和识别，以便我们能够对其进行陈述。例如，我们可以将所有低风险服务器标记为绿色，所有中风险标记为黄色，所有高风险标记为红色。\n\
  2. CISO（首席信息安全官）随后可以告诉编排大脑对绿色黄色服务器应用某些策略，对红色服务器应用不同的策略。\n3. 编排大脑随后配置所有网络安全组件和基础设施以实施这些策略。\n\
  \n这只是基于意图的分段（intent-based segmentation）力量的简单表达。在实践中，编排大脑能够将网络安全实践提升到更高水平。提供给 CISO\
  \ 以描述其意图的策略语言可以包含涉及编排许多不同组件和基础设施的概念和剧本（playbooks）。用于自动化监控、响应和修复的的概念和剧本的丰富描述可以被定义和使用，以便用简单的术语描述意图。例如，基于意图的安全可以为边界安全、资产隔离、合规性和风险缓解等高级需求创建剧本。本质上，CISO\
  \ 被提供了一种声明式语言来表达所愿。编排大脑则指示安全织网如何实现它。\n\n随着我们对数据驱动的数字连接的依赖增加——从多云网络到移动设备和物联网（IoT）——安全必须从威胁防御转向更具挑战性的任务：保护超连接，因为传统的孤立系统和基础设施开始融合。由基于意图的安全编排的安全织网可以利用对安全基础知识、业务需求和人类行为的深度理解，来实现这种演变。这就是为什么书中书中解释的基础知识对于顶尖的\
  \ CISO 和行业领袖来说，比以往任何时候都具有相关性。\n\n## 关于作者\n\nKen Xie —— Fortinet 创始人兼首席执行官\n\n网络安全专家和成功的企业家，Ken\
