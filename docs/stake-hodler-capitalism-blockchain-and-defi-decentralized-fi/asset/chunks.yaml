    # Chapter 6: Ways to Mine Your Bitcoin on Your Own


    There are three ways to get Bitcoin: by purchasing on an exchange, collecting
    them for goods and services, and mining new ones. Bitcoin acts like cash, but
    it can be mined like gold. "Mining" is a term used for the discovery of new Bitcoins
    – just like discovering gold. It is the validation of Bitcoin transactions compiled
    into one block with a fixed size and added to the blockchain. For instance, Cynthia
    purchases a TV from an online retailer with a Bitcoin. To make sure her Bitcoin
    is real, miners perform a computational operation that is specific to each blockchain
    to validate transactions and add new blocks of transactions. The validation process
    is more complicated than that, but to keep it simple, we will think of it in the
    simplest words as validation of transactions. All the transactions are compiled
    in blocks with a virtual padlock called the "blockchain." Miners then run the
    software to find the key suitable for opening this padlock to add new blocks.
    When their computer finds this key, the box will open, and the transactions will
    become verified. The reward for finding the suitable key fit to unlock the padlock
    amounts to 12.5 newly generated Bitcoins; that value halves every certain number
    of blocks due to the predefined rules for Bitcoin created by its pseudonymous
    inventor Satoshi Nakamoto. According to a top site for the latest genuine Bitcoin
    transactions, the present number of trials it takes to find the key is around
    1,789,546,951.05. Regardless of the huge number of trials, the reward of 25 Bitcoin
    is offered about every 10 minutes. However, mining solo nowadays is demoralizing
    because the process of looking for blocks is so popular, and the difficulty of
    finding a block is high to the point that you may have to set aside your machine
    for about three years before it can generate any coins. Pooled mining, on the
    other hand, is far more productive. This allows you to split the work amongst
    a group of people. All you need to do is work for shares in a block, and when
    it is mined and appended to the blockchain, you get a percentage of the block
    based on the number of people or users you worked alongside, with lesser fees
    inclusive.


    Here are some steps to take so that you can start mining your Bitcoin with ease.


    ## Get a Wallet


    You have the choice of either storing your wallet locally or online. You need
    to use or download a fairly huge blockchain file of about 320GB; downloading and
    updating a local wallet may be a no-no. The method which you decide to use to
    keep your Bitcoins depends totally on your personal preference. There is no perfect
    wallet type as they all have their upsides and downsides; however, privacy advocates
    would prefer a local wallet. The moment you have created whichever wallet you
    like, you get an address like `1BEkUGADFbrEShQb9XJ`. This is a direct way to send
    your Bitcoins to your wallet, so take note of it. You can find the wallet address
    under linked accounts in Coinbase.


    ## Join a Pool


    You have to work with other miners on available blocks before you can mine a pool.
    Each pool is distinguished mostly by the fees they charge by block and the number
    of users. Pools with fewer users could also have a slower time to discover blocks
    that need to be mined, but pools with many users usually end in smaller payments.
    There are simple guidelines for most services to avoid being overwhelmed. Also,
    ensure that you enter your wallet address into the pool info. This will make sure
    that you get your Bitcoins.


    ## Get a Miner


    There are various mining options for different forums, and OSX users may find
    themselves in a bit of a pickle. Miners make use of spare GPU cycles to power
    the mining operation. Miners use these cycles to help take care of user-to-user
    processes related to Bitcoins. Therefore, you are handling the network as well
    by doing "work." You can research more about this to get a clearer picture. And
    to give you a starting point, look up `ASICs` (Application Specific Integrated
    Circuits).


    ## Keep Your Mind on the Prize – Your Money


    Bitcoins are vastly simple to use and mine. You may think that you may be able
    to throw lots of machines together and gather Bitcoins like sand, but this is
    not so. The more Bitcoins are discovered, the more difficult they are to find.
    You will understand what you are up against by using one of the online profitability
    calculators for Bitcoin or Ethereum mining. In summary, if it costs more to run
    your hardware than you profit in Bitcoins, then you are likely doing something
    wrong.


    # Conclusion


    DeFi circles around applications referred to as `DApps`, which means Decentralized
    Applications. These applications go ahead to do financial functions on digital
    ledgers known as the blockchain, a technology that was first employed by Bitcoin
    but has since become broader than it used to be. Instead of transactions being
    made with and by a centralized intermediary such as a cryptocurrency exchange,
    transactions are done directly between people, however, with the aid of smart
    contract programs. `DApps` are accessed through a Web3 browser extension or application
    like `MetaMask`, allowing users to interact with the Ethereum blockchain through
    a website. Furthermore, most of these `DApps` can connect and work in unison to
    create detailed financial services. For instance, a Stable-coin holder can turn
    assets into a liquidity pool. Others will borrow from this pool by putting in
    additional collateral, usually more than the loan amount. Then, the protocol necessarily
    changes interest rates based on the time-to-time claim for the asset. Decentralization
    means the absence of a central exchange. Smart contract programs used for the
    DeFi policies themselves are operated with the aid of open-source software courtesy
    of a community of developers and programmers. An example of a DeFi policy is `Uniswap`.
    This is a decentralized exchange or `dex` that operates on the Ethereum blockchain
    and permits the trading of hundreds of various digital tokens that are produced
    on the Ethereum blockchain. Instead of depending on centralized market makers
    to fill orders, `Uniswap`’s algorithm encourages users to create liquidity pools
    for the tokens by producing trading fees for the people providing liquidity. While
    the users entirely control the `Uniswap` platform, a development team is in charge
    of writing software for its deployment. Direct purchases are not the only kind
    of transaction or contract controlled by big companies; other financial applications
    like loans, insurance, derivatives, betting, crowdfunding, to mention but a few,
    are also in their grasp. Therefore, taking away the middlemen from all these kinds
    of transactions is one of the main objectives of DeFi.


    We have covered the latest cryptocurrencies, such as crypto farming and DeFi products.
    What else can this advanced economic revolution bring? We don’t know what new
    applications will come in the future based on these current components. However,
    unreliable liquidity protocols and other DeFi products are at the forefront of
    economics, crypto-economics, and computer science. DeFi’s money market can undoubtedly
    help create a more open and accessible financial system that anyone with an internet
    connection can access, which will bridge the gap between our lives on earth and
    rely on the human factor to potentially reach living on Mars. At the same time,
    we generate passive income from yield farming on earth-based securities. In future
    parts of the "Stake Hodler Capitalism" book series, we intend to cover many applications
    of blockchain in depth including smart contracts, Internet of Things, Retail,
    Agriculture, and Manufacturing.

    '
