- raw: 'Pros ●        Improved correctness by taking away human participation in verification.
    ●        Reduces costs by taking away the intermediary verification. ●       Decentralization
    makes it difficult to meddle with and also ensures a hundred percent uptime. ●       
    Transactions are safe, personal, and productive. ●        Transparent technology.
    ●       It provides a banking choice and way to safeguard private information
    for citizens of countries with erratic or undervalued democracies. Cons ●       
    Significant energy consumption and pollution from mining. ●        Low TPS (Transactions
    Per Second) when compared to VISA and other systems. ●        A long history of
    illicit activities utilizing cryptocurrencies that are based on Blockchain. ●       
    Absence of regulations and formal regulatory bodies. Blockchain Advantages Accuracy
    of the chain A network of thousands of computers (node) verifies all transactions
    on this network. This eradicates almost all human participation in the verification
    process, leading to a reduced amount of human error and a correct information
    record. Should a computer on the network make an inputting mistake, the error
    would only reflect a copy of the blockchain. Before the error can spread to the
    rest of the blockchain, it would require to be made by at least 51%, which is
    a majority of the network’s computers—which is likely impossible for a large and
    growing network as of Bitcoin’s. Efficient transaction settlement time It can
    take a few days for transactions put through a central authority to be settled.
    For instance, if you try to deposit a check on Friday evening, the funds may not
    reflect in your account until Monday morning. While financial institutions function
    during business hours - five days a week, blockchain works 24/7 yearlong without
    a break. Transactions can be finished in as little as ten minutes and can be considered
    safe after just a few hours.  Private transactions Many blockchain networks function
    as public databases; this means that anyone with a strong internet connection
    can see a list of the network’s transaction history. Although users can check
    details about transactions made, they can pinpoint information about the users
    making those transactions. It is common to think that blockchain networks like
    Bitcoin are anonymous and confidential, and secure. This means that when a user
    makes an exchange in public, their one-of-a-kind code called a [public key](https://www.investopedia.com/terms/p/public-key.asp)
     is documented on the blockchain instead of their personal information. If a person
    has purchased Bitcoin on an exchange that needs identification, then the person’s
    identity is still connected to their blockchain address, but a transaction, even
    when tied to a person’s name, does not expose any personal information. Disadvantages
    of Blockchain Although there are major gains to the blockchain, there are also
    major challenges to adopting this. The difficulties or obstacles to the application
    of blockchain are not just technicalities. The true challenges are political and
    regulatory mostly, not to mention the thousands of hours of custom software design
    and invisible  programming needed to incorporate blockchain to present business
    networks. Here are some of these challenges: Technology cost Although blockchain
    existence saves users money on transaction fees, the technology is not entirely
    free. The “proof of work” algorithm and system that Bitcoin uses to verify transactions
    digest huge amounts of computational power. In the physical world, the millions
    of computers on the Bitcoin network are almost equal to what Denmark consumes
    every year. Regardless of the costs of mining Bitcoin, users still increase their
    electricity bills to approve transactions on the blockchain. When miners include
    a block to the Bitcoin blockchain, they are gifted with enough Bitcoin to make
    their time and energy count. For blockchains that do not use cryptocurrency, miners
    would like to be paid or otherwise encouraged to verify transactions. Certain
    solutions to these issues are starting to arise. For instance, Bitcoin mining
    farms have been set up to use solar power, excess natural gas from fracking sites,
    or wind farms’ power. That would help face the drop in block rewards as we get
    near mining all the 21 million bitcoins in existence. Speed inefficiency Bitcoin
    is the best example of the potential inefficiencies of blockchain. Bitcoin’s PoW
    (proof of wor) system takes about ten minutes to include a new blockchain block.
    At that speed, it’s calculated that the blockchain network can only take care
    of about seven transactions per second (TPS). Although other cryptocurrencies
    such as Ethereum function better than Bitcoin, they are still restricted by blockchain.
    Legacy Visa systems, for  context, can process up to 24,000 TPS. Solutions to
    this problem have been in development for years. Currently, some blockchains are
    bragging over 30,000 transactions per second. Illegal activities On the blockchain
    network, users are protected from hacks and preserves privacy. However, it also
    gives a chance for illegal trading and activity on the blockchain network. The
    most cited instance of blockchain being used for illicit transactions is probably
    the [Silk Road](https://www.investopedia.com/terms/s/silk-road.asp) , an online
    “dark web” drug marketplace operated from February 2011 until October 2013 when
    the FBI shut it down. '
  fmt: '

    # Pros


    - Improved correctness by taking away human participation in verification.

    - Reduces costs by taking away the intermediary verification.

    - Decentralization makes it difficult to meddle with and also ensures a hundred
    percent uptime.

    - Transactions are safe, personal, and productive.

    - Transparent technology.

    - It provides a banking choice and way to safeguard private information for citizens
    of countries with erratic or undervalued democracies.


    # Cons


    - Significant energy consumption and pollution from mining.

    - Low TPS (Transactions Per Second) when compared to VISA and other systems.

    - A long history of illicit activities utilizing cryptocurrencies that are based
    on Blockchain.

    - Absence of regulations and formal regulatory bodies.


    # Blockchain Advantages


    ## Accuracy of the chain


    A network of thousands of computers (node) verifies all transactions on this network.
    This eradicates almost all human participation in the verification process, leading
    to a reduced amount of human error and a correct information record. Should a
    computer on the network make an inputting mistake, the error would only reflect
    a copy of the blockchain. Before the error can spread to the rest of the blockchain,
    it would require to be made by at least 51%, which is a majority of the network’s
    computers—which is likely impossible for a large and growing network as of Bitcoin’s.


    ## Efficient transaction settlement time


    It can take a few days for transactions put through a central authority to be
    settled. For instance, if you try to deposit a check on Friday evening, the funds
    may not reflect in your account until Monday morning. While financial institutions
    function during business hours - five days a week, blockchain works 24/7 yearlong
    without a break. Transactions can be finished in as little as ten minutes and
    can be considered safe after just a few hours.


    ## Private transactions


    Many blockchain networks function as public databases; this means that anyone
    with a strong internet connection can see a list of the network’s transaction
    history. Although users can check details about transactions made, they can pinpoint
    information about the users making those transactions. It is common to think that
    blockchain networks like Bitcoin are anonymous and confidential, and secure. This
    means that when a user makes an exchange in public, their one-of-a-kind code called
    a [public key](https://www.investopedia.com/terms/p/public-key.asp) is documented
    on the blockchain instead of their personal information. If a person has purchased
    Bitcoin on an exchange that needs identification, then the person’s identity is
    still connected to their blockchain address, but a transaction, even when tied
    to a person’s name, does not expose any personal information.


    # Disadvantages of Blockchain


    Although there are major gains to the blockchain, there are also major challenges
    to adopting this. The difficulties or obstacles to the application of blockchain
    are not just technicalities. The true challenges are political and regulatory
    mostly, not to mention the thousands of hours of custom software design and invisible
    programming needed to incorporate blockchain to present business networks. Here
    are some of these challenges:


    ## Technology cost


    Although blockchain existence saves users money on transaction fees, the technology
    is not entirely free. The “proof of work” algorithm and system that Bitcoin uses
    to verify transactions digest huge amounts of computational power. In the physical
    world, the millions of computers on the Bitcoin network are almost equal to what
    Denmark consumes every year. Regardless of the costs of mining Bitcoin, users
    still increase their electricity bills to approve transactions on the blockchain.
    When miners include a block to the Bitcoin blockchain, they are gifted with enough
    Bitcoin to make their time and energy count. For blockchains that do not use cryptocurrency,
    miners would like to be paid or otherwise encouraged to verify transactions. Certain
    solutions to these issues are starting to arise. For instance, Bitcoin mining
    farms have been set up to use solar power, excess natural gas from fracking sites,
    or wind farms’ power. That would help face the drop in block rewards as we get
    near mining all the 21 million bitcoins in existence.


    ## Speed inefficiency


    Bitcoin is the best example of the potential inefficiencies of blockchain. Bitcoin’s
    PoW (proof of wor) system takes about ten minutes to include a new blockchain
    block. At that speed, it’s calculated that the blockchain network can only take
    care of about seven transactions per second (TPS). Although other cryptocurrencies
    such as Ethereum function better than Bitcoin, they are still restricted by blockchain.
    Legacy Visa systems, for context, can process up to 24,000 TPS. Solutions to this
    problem have been in development for years. Currently, some blockchains are bragging
    over 30,000 transactions per second.


    ## Illegal activities


    On the blockchain network, users are protected from hacks and preserves privacy.
    However, it also gives a chance for illegal trading and activity on the blockchain
    network. The most cited instance of blockchain being used for illicit transactions
    is probably the [Silk Road](https://www.investopedia.com/terms/s/silk-road.asp),
    an online “dark web” drug marketplace operated from February 2011 until October
    2013 when the FBI shut it down.

