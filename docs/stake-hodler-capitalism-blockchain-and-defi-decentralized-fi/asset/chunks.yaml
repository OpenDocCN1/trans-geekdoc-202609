- raw: 'Differences between DeFi and Open Banking When we talk about open banking,
    it is referred to as a banking system by which third-party financial enablers
    are provided with safe access to financial data through APIs. This helps with
    the connection of data and accounts between financial institutions and banks.
    It permits new kinds of goods and services within the conventional financial system.
    On the other hand, DeFi recommends a completely new financial system free of the
    present infrastructure. Sometimes, DeFi is referred to as Open Finance. For instance,
    while open banking could permit the surveillance of all conventional financial
    instruments in one application by getting data from various banks and institutions
    securely, DeFi, on the other  hand, could allow the surveillance of the completely
    new financial instruments and the new ways of communicating with them. You can
    also refer to DeFi as “Lego money” because you can pile up dApps to increase your
    returns. For instance, you could purchase a stable-coin like the DAI, then go
    ahead to lend it out on Compound for the sole purpose of earning interest. The
    fun fact, you don’t need to look for any other gadgets as long as you have got
    your smartphone, then you are good to go. Although most DApps found today are
    niche, still future applications may greatly influence daily life and activities.
    For instance, you will be able to buy a car or a house on a DeFi program under
    a mortgage agreement where you have to pay back for a stipulated time (months
    or years). The deeds or paperwork would be put up in a tokenized form on a blockchain
    record as collateral, and if by any means you stopped giving up your repayments,
    then the deeds or paperwork would naturally belong to the new owner, which is
    the lender. Due to a sense of lawyers or banks, the entire procedure of buying
    and selling the house or car becomes cheaper. Why the Hype? First, DeFi has been
    able to excel in this space with regulators behind the curve. For example, in
    conventional unsecured lending, there is the need for legitimacy in that the lenders
    and borrowers become acquainted (know one another’s identities) and that the lender
    has the right to assess the borrower’s financial sheet to be sure of their tendency
    to repay the debt owed. However, in DeFi, such requirements are not necessary.
    Rather, they are all about reciprocating trust and maintaining privacy. Now, regulators
    have to weigh the fragile balance between suppressing innovation and flunking
    to protect the society from risks like people putting their money into a space
    that isn’t regulated or banks and other financial organizations that are not capable
    of making a living as intermediaries. However, it seems that embracing change
    is the more sensible way to go, as is currently happening today. The US Securities
    and Exchange Commission (SEC) made an important change towards adopting DeFi by
    authorizing an Ethereum-based fund, Arca, for the first time in July 2020. Since
    one of the major challenges concerning financial invention is the aggressive setting
    created by old regulations written for a foregone era, this change is very important
    and welcomed. Some of these regulations had caused some DeFi projects not to succeed,
    including the major ones like New-Jersey-based Basis, which refunded 133 million
    USD to investors in 2018 when it was finalized that it couldn’t work within the
    SEC rules.  Second, the mainstream players are getting involved, hence the rise
    of DeFi. Most high-street financial organizations are starting to approve of DeFi,
    and are looking for ways to take part in it. For instance, 75 of the world’s largest
    banks are trialing blockchain technology to accelerate payments as a fraction
    of the Interbank Information Network. This is initiated by JP Morgan, ANZ, and
    Royal Bank of Canada.  Also, dominant asset management funds are beginning to
    take DeFi seriously. The most well-known that falls under this category is Grayscale,
    the world’s biggest crypto investment account. It is managing over 5.2 billion
    USD of crypto investments, including 4.4 billion USD of Bitcoin. The third is
    the impact of COVID-19. The pandemic has steered global interest rates even lower
    than it was before. Some jurisdictions like the Eurozone and the likes are now
    in the negative region. Others, including the US and UK, could probably come next
    if care is not taken in the expansionary monetary and fiscal policies being implemented
    to combat the surge in unemployment rates induced by layoffs due to COVID-19.
    In this mood, DeFi gives much higher returns are potentially offered to savers
    than the high-street financial organizations. For instance, Compound has been
    offering a yearly interest rate of 6.75% to those who save with Stable-coin Tether.
    In this case, not only do you receive interest on your savings, but you also get
    to be a recipient of COMP tokens, which is an additional attractive incentive.
    With DeFi, you don’t have to worry about having a bank account; have a smartphone
    in your possession, and finance will be opened to you on a platter of gold. Lastly,
    there has been an increase in people putting their money into DeFi tokens because
    people refuse to be left behind and denied their exponential growth potential.
    We see lots of unreasonable exuberance these days because many tokens are worth
    nothing or nearly nothing when viewed practically. Whether you agree or not, we
    are headed towards a new financial breakthrough that is more free and decentralized
    than ever before. The big question is; how do we best steer its development with
    checks and balances to reduce the risks and circulate the probable advantages
    as broadly as possible? This is the challenge that threatens to fruit in the next
    few years. Benefits of DeFi Decentralized finance uses the Ethereum blockchain’s
    major standards to maximize financial security and translucency, open liquidity
    and growth opportunities, and consent to an integrated and organized economic
    system. Programmability Smart contracts that are extremely programmable automate
    performance and encourage new financial tools and digital investments. Immutability
    Change-proof data coordination across a blockchain’s decentralized architecture
    heightens safety and audibility. Interoperability Ethereum’s comparable software
    stack makes sure that DeFi policies and applications are designed to incorporate
    and complement one another. Developers have the flexibility to create on top of
    existing policies, customized interfaces and integrate third-party applications
    with DeFi. Hence, people often refer to it as the money Legos. Transparency All
    transactions are broadcasted to and validated by the users on the network on the
    public Ethereum blockchain. It is important to note that Ethereum addresses are
    encrypted keys that are pseudo-anonymous. The degree of translucency around data
    transactions is highly desirable due to its rich data insights and high availability
    provided by a network that is accessible year-round with no downtime. Ethereum
    and DeFi policies running on it are also created with open source code available
    for everyone to see, audit, and  create. Permissionless Contrary to conventional
    finance, DeFi is characterized by its open and does not require permission to
    access. Anybody with a crypto wallet and an internet connection can gain access
    to DeFi applications on Ethereum regardless of their location and often without
    any reduced amount of funds expected. Self-custody Using a Web3 wallet like MetaMask
    to communicate with permissionless financial applications and policies makes DeFi
    market parties always control their data assets and regulation. Advantages of
    DeFi Usually, finance depends on banks acting as a middle man and courts to judge
    if the need arises. However, DeFi applications do not need arbitrators or intermediaries.
    This is because the code dictates the solution of every possible dispute that
    may ensue, and the users make sure to control their funds all the time properly.
    This method reduces the cost affiliated with giving and making use of these products
    and gives way for a more frictionless financial operation. The moment these new
    financial services are installed onto the blockchain, there is the expelling of
    single failure points. Afterward, the data is documented on the blockchain and
    circulated across multiple nodes, eliminating the probable shut down of service,
    something not so easy to accomplish. The fact that the frameworks for DeFi applications
    can be created beforehand makes using one less complex and secure. Another important
    merit of such an accessible ecosystem is the simplicity of access for users who,
    on a norm, would have no access to any financial services. Since the usual financial
    system depends on the intermediaries to make profits, their services are usually
    nonexistent in locations with low-income constituencies. However, the costs are
    majorly lessened with DeFi, and individuals with low-income can also be beneficiaries
    from this faster range of financial services. DeFi and Potential Risks DeFi, as
    good as it may sound, also faces some challenges that should be discussed with
    individuals that may be interested. This is to make you aware of what you are
    getting into properly. Before moving on to this section, it’s worth also mentioning
    the potential dangers of DeFi. One of the biggest risks is errors, bugs, and vulnerabilities
    in smart contracts and protocol changes that can affect existing contracts. For
    the same reason, consumers need additional insurance to reduce the risk of potential
    problems. Also, you should always check how decentralized your DeFi project is
    and what the shutdown procedure is when something goes wrong.  An individual may
    have an admin key that can disable the protocol, or there may be a contactless
    management system that makes such decisions. Also, it would help if you always
    considered the more systematic risks that may arise from, for example, sudden
    depreciation of the price of an asset. This can lead to cascading liquidations
    through multiple DeFi protocols. Network and congestion charges can also be an
    issue. This is especially true if we avoid liquidation and try to provide more
    security on time. The upcoming Ethereum 2.0 and Tier 2 scaling solutions can help
    solve this problem. It also has subtle features or changes that apply to one of
    the protocols, leading users to take less obvious actions that can cascade across
    multiple protocols. A good example of this is the recent increase in Compound
    protocols’ composition, which forced consumers to engage in seemingly unprofitable
    loans at high-interest rates, profitable due to the additional COMP’s compensation.
    These situations can be very dangerous, but as you have already noticed, they
    make the entire ecosystem more powerful and less sensitive to similar situations
    in the future. DeFi is a fascinating and lively space full of opportunities, but
    it’s important to remember that this is still a fairly new and emerging industry.
    Therefore, it is a game that has high risk and high reward. DeFi, unlike most
    tech companies, is almost a real mess for the traditional financial industry.
    DeFi does not rely on old techniques and procedures. It is based on new rails.
    Currently, most financial products can only be made by banks. DeFi is open source,
    does not require authentication, and enables Internet-like collaboration. DeFi
    is primarily based on Ethereum, which uses more interoperability protocols, but
    we can see that more projects will be built on different chains in the future. 
    Here are some of them boldly highlighted: ●        Poor performance Blockchains
    are naturally slower than their centralized partners, extending to the applications
    founded on top of them. Therefore, there is a need for the DeFi application developers
    to take note of these restrictions and improve their products accordingly. ●         User
    errors The liability is transferred from the intermediaries to the users by DeFi
    applications. This means that you are in control all by yourself due to the lack
    of central authority, which can quickly become negative for many users. To design
    a product with little or minimal risk of user error is a specifically hard challenge
    to overcome, especially when the products are placed on top of rigid blockchains.
    ●        Bad user experience At the moment, making use of DeFi applications needs
    extra effort on the part of the user. DeFi applications must deliver a substantial
    advantage that motivates and encourages users to change over from the conventional
    system ways. This will help them become a central component of the international
    financial system. ●        Chaotic ecosystem Finding the perfect and most suitable
    application for a particular use case can be quite challenging. However, users
    should find the time and possess the ability to discover the best scenarios at
    all times. The difficulty does not arise only when building the applications but
    also when thinking about how they can fit into the wider DeFi ecosystem. '
  fmt: "\n# Differences between DeFi and Open Banking\n\n当我们谈论开放银行时，它是指一种银行系统，通过该系统，第三方金融服务提供商可以通过\
    \ API 安全地访问金融数据。这有助于金融机构和银行之间的数据和账户连接。它允许在传统金融体系内出现新型产品和服务。\n\n另一方面，DeFi 提议了一套完全摆脱现有基础设施的新金融系统。有时，DeFi\
    \ 也被称为开放金融。\n\n例如，开放银行可以通过安全地从各个银行和机构获取数据，允许在一个应用程序中监控所有传统金融工具；而 DeFi 则可以允许监控全新的金融工具以及与它们交互的新方式。\n\
    \n你也可以把 DeFi 称为“乐高钱”，因为你可以堆叠 dApps 来增加收益。例如，你可以购买一种稳定币，如 DAI，然后将其借出到 Compound\
    \ 上以赚取利息。有趣的是，只要你拥有智能手机，就不需要寻找任何其他设备。\n\n虽然目前大多数 DApps 都比较小众，但未来的应用程序可能会极大地影响日常生活和活动。例如，你将能够在\
    \ DeFi 程序上通过抵押协议购买汽车或房屋，并在规定时间（几个月或几年）内偿还。契约或文书将以代币化形式作为抵押品记录在区块链上，如果你停止偿还，契约或文书将自动归属新主人——即贷方。由于省去了律师或银行的环节，买卖房屋或汽车的整个流程变得更便宜。\n\
    \n## Why the Hype?\n\n首先，DeFi 能够在监管滞后的领域取得突破。例如，在传统的无担保借贷中，需要确立合法性，即贷方和借方相互了解（知道彼此的身份），并且贷方有权评估借方的财务状况以确定其偿还债务的倾向。然而，在\
    \ DeFi 中，这些要求并非必要。相反，DeFi 侧重于相互信任和隐私保护。现在，监管机构必须在抑制创新和未能保护社会免受风险（如人们将资金投入不受监管的领域，或银行和其他金融组织无法作为中介生存）之间权衡微妙的平衡。然而，拥抱变革似乎是更明智的选择，这正是当前正在发生的事情。\n\
    \n2020 年 7 月，美国证券交易委员会（SEC）授权了基于以太坊的基金 Arca，这是朝着采纳 DeFi 迈出的重要一步。由于阻碍金融创新的主要挑战之一是由为过往时代编写的旧法规造成的激进环境，这一变革非常重要且受欢迎。其中一些法规导致一些\
    \ DeFi 项目无法成功，包括总部位于新泽西的 Basis 等主要项目，该项目在 2018 年确定无法在 SEC 规则下运作后，向投资者退还了 1.33\
    \ 亿美元。\n\n其次，主流机构的参与推动了 DeFi 的崛起。大多数主流金融机构开始认可 DeFi，并寻找参与方式。例如，全球 75 家最大的银行正在试验区块链技术，以加速支付，这是银行间信息网络的一部分。该倡议由摩根大通、澳新银行和加拿大皇家银行发起。\n\
    \n此外，主流资产管理基金开始认真对待 DeFi。最著名的是 Grayscale，世界上最大的加密投资账户。它管理着超过 52 亿美元的加密投资，其中包括\
    \ 44 亿美元的比特币。\n\n第三是 COVID-19 的影响。大流行将全球利率推向了比以往更低的水平。一些司法管辖区（如欧元区）已进入负利率区域。如果不加注意实施扩张性货币和财政政策以应对\
    \ COVID-19 导致的裁员引发的失业率飙升，其他地区（包括美国和英国）可能会紧随其后。在这种环境下，DeFi 为储户提供的潜在回报远高于主流金融机构。例如，Compound\
    \ 为使用稳定币 Tether 储蓄的用户提供 6.75% 的年化利率。在这种情况下，你不仅能获得储蓄利息，还能获得 COMP 代币作为额外的吸引人激励。使用\
    \ DeFi，你不需要担心拥有银行账户；拥有智能手机，金融服务就会向你敞开大门。\n\n最后，越来越多的人投资 DeFi 代币，因为人们不想错过其指数级增长的潜力。我们看到很多非理性繁荣，因为从实际角度来看，许多代币毫无价值或价值极低。无论你是否同意，我们正朝着一个比以往更自由、更去中心化的金融新突破迈进。大问题是：我们如何最好地引导其发展，通过制衡机制来降低风险，并尽可能广泛地分配潜在优势？这是未来几年面临的挑战。\n\
    \n# Benefits of DeFi\n\n去中心化金融利用以太坊区块链的主要标准，以最大化金融安全性和透明度，开放流动性和增长机会，并支持一个整合且有序的经济系统。\n\
    \n## Programmability\n\n高度可编程的智能合约自动化执行，并催生新的金融工具和数字投资。\n\n## Immutability\n\n\
    跨区块链去中心化架构的防篡改数据协调增强了安全性和可审计性。\n\n## Interoperability\n\n以太坊兼容的软件栈确保 DeFi 协议和应用程序被设计为相互整合和互补。开发人员可以灵活地在现有协议之上构建、自定义界面，并将第三方应用程序与\
    \ DeFi 集成。因此，人们常称之为“金钱乐高”。\n\n## Transparency\n\n所有交易都在公共以太坊区块链上广播，并由网络上的用户验证。值得注意的是，以太坊地址是伪匿名的加密密钥。由于全年无休、无停机的网络提供的丰富数据洞察和高可用性，围绕数据交易的高度透明度极具吸引力。运行在其上的以太坊和\
    \ DeFi 协议也是用开源代码创建的，可供所有人查看、审计和构建。\n\n## Permissionless\n\n与传统金融不同，DeFi 的特点是开放且无需许可即可访问。任何拥有加密钱包和互联网连接的人都可以访问以太坊上的\
    \ DeFi 应用程序，无论其身处何地，且通常没有最低资金要求。\n\n## Self-custody\n\n使用像 MetaMask 这样的 Web3 钱包与无许可的金融应用程序和协议交互，使\
    \ DeFi 市场参与者始终掌控其数据资产和权限。\n\n# Advantages of DeFi\n\n通常，金融依赖银行作为中介和法院作为仲裁。然而，DeFi\
    \ 应用程序不需要仲裁者或中介。这是因为代码规定了解决可能出现的每一种争议的方案，用户始终确保妥善控制自己的资金。这种方法降低了提供和使用这些产品的相关成本，并为更顺畅的金融操作铺平了道路。\n\
    \n一旦这些新金融服务部署到区块链上，单点故障就被消除了。随后，数据记录在区块链上并分布在多个节点上，消除了服务关闭的可能性，这在传统系统中很难实现。DeFi\
    \ 应用程序框架可以预先创建，这使得使用它们更简单、更安全。\n\n这种可访问生态系统的另一个重要优势是，对于通常无法获得任何金融服务的用户来说，访问变得简单。由于传统金融系统依赖中介获利，其服务通常在低收入地区不存在。然而，DeFi\
    \ 大幅降低了成本，低收入个人也能从这更广泛的金融服务中受益。\n\n# DeFi and Potential Risks\n\n尽管 DeFi 听起来不错，但也面临一些挑战，有必要与感兴趣的人讨论，以便让你充分了解其中的风险。\n\
    \n在进入这一部分之前，值得一提的是 DeFi 的潜在危险。最大的风险之一是智能合约和协议变更中的错误、漏洞，这些可能影响现有合约。出于同一原因，消费者需要额外的保险来降低潜在问题的风险。此外，你应该始终检查你的\
    \ DeFi 项目有多去中心化，以及出现问题时的关闭程序是什么。个人可能拥有可以禁用协议的管理员密钥，或者可能存在无接触管理系统来做出此类决定。\n\n此外，你还应始终考虑可能出现的系统性风险，例如资产价格突然贬值。这可能导致通过多个\
    \ DeFi 协议的级联清算。网络拥堵和 Gas 费也可能是一个问题。如果我们试图避免清算并及时提供更多安全性，这尤其明显。即将到来的以太坊 2.0 和 Layer\
    \ 2 扩容解决方案可以帮助解决这个问题。\n\n协议的微妙特性或变更也可能导致用户采取不那么明显的行动，这些行动可能级联影响多个协议。一个很好的例子是最近\
    \ Compound 协议合成器的增加，迫使消费者从事表面上看不盈利的高利率贷款，但由于额外的 COMP 补偿而变得有利可图。这些情况可能非常危险，但正如你已经注意到的，它们使整个生态系统更强大，并对未来类似情况的敏感度降低。\n\
    \nDeFi 是一个迷人且充满活力、机会无限的领域，但重要的是要记住，这仍然是一个相当新兴的行业。因此，这是一场高风险、高回报的游戏。\n\nDeFi 不像大多数科技公司，它几乎是传统金融行业的一场真正的混乱。DeFi\
    \ 不依赖旧技术和程序。它基于新轨道。目前，大多数金融产品只能由银行创建。DeFi 是开源的，无需认证，并实现了类互联网的协作。DeFi 主要基于以太坊，后者使用更多互操作性协议，但我们可以预见未来会有更多项目构建在不同的链上。\n\
    \n以下是一些大胆强调的要点：\n\n- **Poor performance**  \n  区块链天生比其中心化对手慢，这延伸到建立在其之上的应用程序。因此，DeFi\
    \ 应用程序开发人员需要注意这些限制并相应地优化其产品。\n\n- **User errors**  \n  DeFi 应用程序将责任从中介转移给用户。这意味着由于缺乏中央权威，你完全独自掌控，这对许多用户来说可能迅速变成负面因素。设计一个用户错误风险极小或最小的产品是一个特别难以克服的挑战，特别是当产品建立在僵化的区块链之上时。\n\
    \n- **Bad user experience**  \n  目前，使用 DeFi 应用程序需要用户付出额外的努力。DeFi 应用程序必须提供实质性优势，以激励和鼓励用户从传统系统方式转变过来。这将帮助它们成为国际金融体系的核心组成部分。\n\
    \n- **Chaotic ecosystem**  \n  为特定用例找到完美且最合适的应用程序可能相当具有挑战性。然而，用户应该花时间并具备随时发现最佳场景的能力。困难不仅在于构建应用程序，还在于思考它们如何融入更广泛的\
    \ DeFi 生态系统。\n"
  trans: "\n# DeFi 与开放银行的区别\n\n当我们谈论开放银行时，它是指一种银行系统，通过该系统，第三方金融服务提供商可以通过 API 安全地访问金融数据。这有助于金融机构和银行之间的数据和账户连接。它允许在传统金融体系内出现新型产品和服务。\n\
    \n另一方面，DeFi 提议了一套完全摆脱现有基础设施的新金融系统。有时，DeFi 也被称为开放金融。\n\n例如，开放银行可以通过安全地从各个银行和机构获取数据，允许在一个应用程序中监控所有传统金融工具；而\
    \ DeFi 则可以允许监控全新的金融工具以及与它们交互的新方式。\n\n你也可以把 DeFi 称为“乐高钱”，因为你可以堆叠 dApps 来增加收益。例如，你可以购买一种稳定币，如\
    \ DAI，然后将其借出到 Compound 上以赚取利息。有趣的是，只要你拥有智能手机，就不需要寻找任何其他设备。\n\n虽然目前大多数 DApps 都比较小众，但未来的应用程序可能会极大地影响日常生活和活动。例如，你将能够在\
    \ DeFi 程序上通过抵押协议购买汽车或房屋，并在规定时间（几个月或几年）内偿还。契约或文书将以代币化形式作为抵押品记录在区块链上，如果你停止偿还，契约或文书将自动归属新主人——即贷方。由于省去了律师或银行的环节，买卖房屋或汽车的整个流程变得更便宜。\n\
    \n## 为何如此火热？\n\n首先，DeFi 能够在监管滞后的领域取得突破。例如，在传统的无担保借贷中，需要确立合法性，即贷方和借方相互了解（知道彼此的身份），并且贷方有权评估借方的财务状况以确定其偿还债务的倾向。然而，在\
    \ DeFi 中，这些要求并非必要。相反，DeFi 侧重于相互信任和隐私保护。现在，监管机构必须在抑制创新和未能保护社会免受风险（如人们将资金投入不受监管的领域，或银行和其他金融组织无法作为中介生存）之间权衡微妙的平衡。然而，拥抱变革似乎是更明智的选择，这正是当前正在发生的事情。\n\
    \n2020 年 7 月，美国证券交易委员会（SEC）授权了基于以太坊的基金 Arca，这是朝着采纳 DeFi 迈出的重要一步。由于阻碍金融创新的主要挑战之一是由为过往时代编写的旧法规造成的激进环境，这一变革非常重要且受欢迎。其中一些法规导致一些\
    \ DeFi 项目无法成功，包括总部位于新泽西的 Basis 等主要项目，该项目在 2018 年确定无法在 SEC 规则下运作后，向投资者退还了 1.33\
    \ 亿美元。\n\n其次，主流机构的参与推动了 DeFi 的崛起。大多数主流金融机构开始认可 DeFi，并寻找参与方式。例如，全球 75 家最大的银行正在试验区块链技术，以加速支付，这是银行间信息网络的一部分。该倡议由摩根大通、澳新银行和加拿大皇家银行发起。\n\
    \n此外，主流资产管理基金开始认真对待 DeFi。最著名的是 Grayscale，世界上最大的加密投资账户。它管理着超过 52 亿美元的加密投资，其中包括\
    \ 44 亿美元的比特币。\n\n第三是 COVID-19 的影响。大流行将全球利率推向了比以往更低的水平。一些司法管辖区（如欧元区）已进入负利率区域。如果不加注意实施扩张性货币和财政政策以应对\
    \ COVID-19 导致的裁员引发的失业率飙升，其他地区（包括美国和英国）可能会紧随其后。在这种环境下，DeFi 为储户提供的潜在回报远高于主流金融机构。例如，Compound\
    \ 为使用稳定币 Tether 储蓄的用户提供 6.75% 的年化利率。在这种情况下，你不仅能获得储蓄利息，还能获得 COMP 代币作为额外的吸引人激励。使用\
    \ DeFi，你不需要担心拥有银行账户；拥有智能手机，金融服务就会向你敞开大门。\n\n最后，越来越多的人投资 DeFi 代币，因为人们不想错过其指数级增长的潜力。我们看到很多非理性繁荣，因为从实际角度来看，许多代币毫无价值或价值极低。无论你是否同意，我们正朝着一个比以往更自由、更去中心化的金融新突破迈进。大问题是：我们如何最好地引导其发展，通过制衡机制来降低风险，并尽可能广泛地分配潜在优势？这是未来几年面临的挑战。\n\
    \n# DeFi 的优势\n\n去中心化金融利用以太坊区块链的主要标准，以最大化金融安全性和透明度，开放流动性和增长机会，并支持一个整合且有序的经济系统。\n\
