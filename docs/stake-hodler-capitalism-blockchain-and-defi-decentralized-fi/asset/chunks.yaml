    that the joy comes from the journey and the most rewarding feeling comes from
    helping other people. Blockchain has had its fair share of disruption in our lives
    since Oct. 31st, 2008, which is the date Satoshi Nakamoto the creator of bitcoin,
    published his paper titled “A Peer-to-Peer Electronic Cash System.” Nevertheless,
    bitcoin has had its direct effect on my life. I started delving into blockchain
