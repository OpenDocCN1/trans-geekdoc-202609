    # 第 5 章：去中心化金融中的收益耕作是什么意思？


    随着令人兴奋的新金融领域的不断发展，消费者参与协议增长的趋势日益增加。无论是简单地将加密货币引入 `Compound`，还是参与 `Maker` 的清算拍卖等更复杂的操作，DeFi
    都正在开辟令人兴奋的新被动收入机会。收益耕作技术正在不断演变和实验中，但其影响令人惊叹。在普通互联网上，除非你向网站所有者提供激活交易所需的足够数据，否则无法购买产品；但在
    DeFi 中，你甚至无需透露姓名或任何个人信息即可借款。DeFi 应用不在乎这些，因为它有提供的抵押品来担保债务（例如，在 `Compound` 平台上，10
    美元的贷款将需要约 20 美元价值的抵押品）。如果你遵循此建议并决定尝试，你可以在操作后立即（比如 10 分钟后）将一切改回原状。然而，这对于对收益耕作独特优势感到好奇的人来说，仍然是一次很好的体验。


    那么，为什么要把钱借给已经有钱的人呢？大多数人这样做是为了某种交易。最明显的例子是做空市场（在价格下跌时获利）。这对于那些想要质押代币同时又想在市场上进行交易的人来说也很棒。


    ## 你不需要很多钱来经营银行吗？


    这是真的，而在 DeFi 中，这笔钱主要来自互联网上的陌生人。这就是为什么它为这些去中心化银行应用吸引空仓 `HODLers` 提供了一种聪明的方式。流动性是所有这些产品面临的主要问题。换句话说，有多少资金被质押在智能合约中？对于某些产品类型，拥有流动性时产品体验最佳。正如
    `Electric Capital` 高级合伙人 `Avichal Garg` 所说，它们不是从风险投资家或债务投资者那里借款，而是从消费者那里借款。


    以 `Uniswap` 为例。`Uniswap` 代表自动做市商或 `AMM`（DeFi 的另一个术语）。简而言之，`Uniswap` 是一个基于 Web
    的机器人系统，随时准备买卖任何拥有市场的加密货币。`Uniswap` 几乎为每个以太坊代币提供一个或多个交易对。在后台，这意味着 `Uniswap` 可以假装直接用两种代币进行交易。这对消费者来说更容易，但一切都基于一个包含两种代币的资金池。而且这些交易对在更大的资金池中表现更好。


    ## 资金池意味着什么？


    让我们看看 `Uniswap` 如何运作，以展示为什么更多资金会有帮助。假设存在 `USDC` 和 `DAI` 的市场。这两种代币都是稳定币，但它们有不同的价值存储机制，且每枚代币价值
    1 美元。这通常发生在任一代币中。`Uniswap` 在单个交易对中显示的每个代币价格，基于资金池中每个代币的余额。例如，如果有人需要创建 `USDC/DAI`
    资金池，为了简化，双方必须存入相同数量。对于只有 2 美元 `USDC` 和 2 个 `DAI` 的资金池，价格是 1 美元兑 1 `DAI`。但想象一下有人存入
    1 `DAI` 并取出 1 美元。然后资金池中将有 1 美元和 3 个 `DAI`。资金池将保持平衡。经验丰富的投资者可以轻松通过投资 1 美元赚取 1.5
    `DAI`，获利 0.5 美元。这是 50% 的套利，也是有限流动性问题。顺便说一句，这就是为什么 `Uniswap` 价格通常是正确的，因为交易者在更大的市场中发现一些偏差，并非常快速地进行套利交易。然而，如果资金池中有
    500,000 `USDC` 和 500,000 `DAI`，1 `DAI` 兑 1 `USDC` 的交易对相对价格影响很小。这就是流动性如此有用的原因。


    资产可以锁定在 `Compound` 平台上以获得少量利润。收益耕作似乎吸引了更广泛的散户投资者，而寻求最大化利润方法的专业投资者则是从事收益耕作的人。DeFi
    产生了相关效应，因此市场需要额外的流动性。`Uniswap` 通过对每笔交易收取少量费用来解决这个问题。这是通过略微减少每笔交易金额并将其留在资金池中来完成的（因为
    `DAI` 扣除手续费后以 0.997 美元交易，使资金池总额增加 0.003 美元）。当有人向资金池注入流动性时，这有助于流动性提供者从资金池中获得份额。如果该资金池有很多交易，你赚取的佣金更多，每个流动性资金池的价值也会上升。这又把我们带回到了代币上。添加到
    `Uniswap` 的流动性以代币形式显示，而不是账户。


    加密货币收益耕作是一种利用一种加密货币生成更多加密货币的方式。这完全依赖于使用 DeFi 应用程序，将你的钱借给通过智能合约中一组预定义步骤使用资金的其他人。作为你服务的回报，你以加密货币的形式获得佣金。这看起来很简单，不是吗？好吧，可能不像你想象的那样。成功的收益农民利用非常复杂的系统或策略。他们定期在不同的借贷市场之间移动加密货币以最大化利润。他们对所使用的最佳耕作策略也会非常保密。为什么？他们透露策略越多，策略的有效性就越低。收益耕作是去中心化金融
    (DeFi) 的森林地块，农民们在这里竞争种植最好的作物。


    DeFi（去中心化金融）运动一直处于区块链创新的前沿。是什么让 `dApps` 如此特别？它们未经授权，因此任何拥有互联网连接和辅助钱包的人都可以与它们交互。此外，`dApps`
    消除了对托管人或经纪人的需求。我可以强制它工作；为什么我可以使用资产？那么，高产农民是如何获得收益的？我将在下面解释所有内容。


    ## 收益耕作：概述


    盈利性收益耕作也称为流动性挖矿，利用加密货币赚取利息。简单来说，这意味着质押加密货币并获得质押金额的利息。从某种意义上说，这个过程在本质上非常类似于代币质押，但由于许多后台复杂性，其运作方式不同。通常，被称为流动性提供者
    (`LPs`) 的用户向流动性资金池注入资金，发挥着巨大作用。流动性资金池只是一个存入资金的智能合约。`LPs` 因向资金池提供流动性而获得补偿。奖励可以通过底层
    DeFi 平台产生的佣金或其他来源获得。一些流动性资金池用多种代币奖励。这些奖励代币将被存入其他流动性资金池，你可以在其中获得奖励。你已经可以看到一个极其复杂的策略是多么快地出现。然而，基本思想是流动性提供者投资流动性资金并获得回报。


    收益耕作通常使用以太坊的 `ERC-20` 代币进行，奖励通常也是 `ERC-20` 代币类型。然而，未来这可能会改变。为什么？目前，大部分此类活动发生在以太坊生态系统中。然而，跨链连接和其他类似改进未来可能使
    DeFi 应用程序从底层区块链平台解耦。这意味着任何智能合约都将与支持该合约功能的任何区块链兼容。农民通常会在不同协议之间大量转移资金，以寻找高收益。因此，DeFi
    平台也可以提供其他金融激励以吸引更多资金到平台。像中心化证券交易所一样，流动性吸引更多流动性。


    ## 是什么引发了产品繁荣？


    对收益耕作的突然兴趣可能与 `Compound` 代币 (`COMP`) 的推出有关，`COMP` 是一种复杂的金融生态系统管理代币。控制代币赋予持有者治理权。但如何分发这些代币以使网络尽可能去中心化？启动去中心化区块链的常见方法是以流动性激励的方式，以算法方式分发这些控制代币。这意味着流动性提供者将挖掘新代币，并为协议提供流动性。虽然该公司并未发明收益耕作，但
    `COMP` 的发布使这种加密货币分发模型更加流行。从那时起，其他 DeFi 项目提供了创新计划，为生态系统带来流动性。


    ## 什么是 TVL（总锁定价值）？


    衡量 DeFi 耕作整体健康状况的最佳方法是监控 `TVL`（总锁定价值）。它衡量有多少加密货币被锁定在 DeFi 借贷平台和其他类型的货币市场中。从某种意义上说，`TVL`
    是流动性资金池的总流动性。它是衡量 DeFi 健康状况和整个耕作市场的有用指标。它也是比较不同 DeFi 协议“市场份额”的有效衡量标准。跟踪 `TVL`
    的好地方是 `DeFi Pulse`。你可以看到哪些平台在 DeFi 上拥有最多的 `ETH` 或其他质押加密资产。这可以提供当前收益耕作情况的概览。自然，更高的质押价值会导致更高的收益耕作操作。你可以用
    `ETH`、`USD` 甚至 `BTC` 来估算 `TVL` 的价值。每种方式都提供了对 DeFi 货币市场状况的不同视角。


    ## 收益耕作如何发生


    收益耕作与自动做市商 (`AMM`) 模型密切相关。它通常包括流动性提供者 (`LPs`) 和流动性资金池。流动性提供者将资金投入流动性资金池。该资金池生成一个交易平台，用户可以在其中进行借贷或代币交换。使用这些平台会收取佣金，并根据流动性资金中的权益支付给流动性提供者。尽管如此，操作可能非常不同。这是一项新技术。你无疑会看到改进现有操作的新方法。除了费用之外，向流动性资金注入现金的另一个激励可能是新代币分发。例如，你无法在公开市场上少量购买加密货币。相反，它可以通过向特定资金池提供流动性来生成。所有分发规则取决于协议的独特实现。流动性提供者根据他们向资金池提供的流动性多少来获得收入。存入的资金通常是由美元支持的稳定币；不过，这可能会有所不同。去中心化金融中常用的稳定币包括
    `DAI`、`USDT`、`USDC`、`BUSD` 等。一些协议使用代表存入智能合约或系统中的代币的代币。例如，如果你向 `Compound` 添加 `DAI`，你将获得
    `cDAI` 或 `Compound DAI`。将 `ETH` 存入 `Compound`，你将获得 `cEthereum`。可能涉及多层实现。你可以将 `cDAI`
    发送到另一个创建第三个代币的协议，该代币代表 `cDAI` 代表 `DAI` 等。这些链可能非常复杂且难以跟踪，但你可以在开始时遵循简单的 1:1 方法。


    ## 收益耕作的盈利能力如何估算？


    收益耕作的盈利能力通常按年估算。这是对你一年内可以预期收益的估计。常用的衡量标准是年利率 (`APR`) 和年化收益率 (`APY`)。两者的区别在于 `APR`
    不考虑复利，而 `APY` 考虑。将这些情况结合起来意味着直接再投资你的利润以产生更多利润。尽管如此，`APR` 和 `APY` 可以互换使用。值得记住的是，这些只是估算和预测。由于高度竞争和快速增长的市场，很难准确衡量短期回报，因为奖励可能会迅速变化。如果某种策略在一段时间内有效，许多农民将抓住机会，并可能停止产生高收益。由于
    `APR` 和 `APY` 来自传统市场，DeFi 可能需要编写自己的衡量标准来计算收入。由于 DeFi 的快节奏，估算你的周收益或日收益可能更有意义。


    ## DeFi 和抵押品存款


    如果你从事资产业务，通常必须提供抵押品来偿还贷款。这充当贷款的保险单。相关性如何？这取决于你发送资金的协议，但你可能需要关注安全水平。如果担保价值低于协议要求的阈值，公开市场的保护可能会被撤销。可以做些什么来避免清算？可以添加额外的代币。同样，每个平台都有自己的规则，即其强制性抵押率。此外，你通常使用嵌套或超额抵押的概念。这意味着贷方必须存入比他们想要借入的更多的资金。这最小化了市场上资产价格突然下跌的风险，否则会触发从系统中移除大量抵押品。所以，假设你使用的借贷协议需要
    200% 的担保率。这意味着每存入 100 美元价值，你可以借入 50 美元。然而，通常添加比必要更多的抵押品更安全，以进一步降低清算风险。也就是说，许多系统使用非常高的并行比率（例如
    750%），使整个平台相对免受清算风险。


    ## 收益耕作固有的危险


    作为一名收益农民取得成功并非易事。最有利可图的增长策略非常复杂，仅推荐给高级用户。此外，收益耕作更适合那些能够质押大量加密货币的人，被称为“巨鲸”。你必须知道自己在做什么，以免亏钱。除了你质押资金的清算外，让我们看看与收益耕作相关的另一个风险。收益耕作的一个明显危险是智能合约。由于
    DeFi 的性质，小团队在有限预算下创建和开发许多协议。这可能增加感知合约错误的风险。即使是由信誉良好的审计公司审计的大型协议，仍然不断发现弱点和错误。区块链的防篡改和不可变性质可能导致资金无限期地锁定在有缺陷的智能合约中。但随着每天都有更多智能合约平台被创建，我们可以轻松看到新创业公司创建一个抽象层，在合约发布到区块链之前给你一个测试期。在将资金质押到智能合约时应考虑这一点。


    DeFi 最大的优势之一也是其最大的问题之一。这就是可组合性问题。让我们看看这是如何发生的。如前所述，DeFi 协议是免费的，可以轻松集成。这意味着整个 DeFi
    生态系统高度依赖于每个构建模块。这也意味着应用程序是可组合的，并且可以轻松协同工作。为什么这很危险？好吧，如果其中一个构建模块不能正常工作，整个生态系统都会受到影响。这是对农民和流动性资金池最大的风险之一。你必须信任存入你资金的协议以及系统中所有其他交互的内部组件。


    ## 加密货币收益耕作平台和协议


    我们如何获得收益耕作奖励？没有特定的固定流程来进行高收益耕作。策略会随时间变化。策略和规则因平台而异，每个平台都有其独特的风险。作为新手收益农民，第一件事是熟悉去中心化流动性协议的操作。基本前提是当你将资金投资于智能合约时，你会获得回报。但实际操作可能差异很大。因此，通常建议新手在不了解规则和风险管理策略的情况下，不要投资超出承受损失范围的资金。话虽如此，我们现在将讨论收益耕作最流行的平台。这不是一个详尽的列表；它只是一组对开发你的收益耕作策略很重要的协议。


    ### Compound Finance (COMP)


    `COMP` 是一个算法货币交易所，消费者可以在其中借贷和质押资产。任何拥有以太坊钱包的人都可以将资产质押到 `Compound` 流动性资金池，并立即获得质押金额的奖励。价格根据供需进行算法调整。`COMP`
    是收益耕作技术中最重要的协议之一。


    **收益耕作 Compound 平台使用：** `Maker`、`Composite`、`Curve` 和 `InstaDapp`。


    *   通过使用稳定币优化计划来增加你的 `COMP` 资产。

    *   通过 `Oasis Borrow` (`Maker`) 插入 `ETH` 打开金库并接收 `DAI`。

    *   在 `InstaDapp` 中打开你的 DeFi 智能账户并插入 `DAI`。

    *   将新添加的 `DAI` 移动到 `InstaDapp Composite` 部分。

    *   使用 `InstaDapp` 的“Maximize Profit COMP”功能，利用为 `DAI` 资产提供的 `DAI` 排名。

    *   选项：`DAI` 直接连接

    *   注意：使用 `InstaDapp` 策略时，如果安全性低于阈值，可能会被抛弃。使用此策略时推荐的比率是 60%。


    ### MakerDAO


    `Maker` 是一个去中心化借贷平台，支持创建 `DAI`，一种算法锚定美元价值的稳定币。用户可以打开 `Maker Vault` 锁定 `ETH`、`BAT`、`USDC`
    或 `WBTC` 等安全资产。他们可以针对质押的担保品生成 `DAI` 作为贷款。这笔借款金额会随时间累积利息，称为稳定费，由 `MKR` 代币持有者决定。收益农民可以利用
    `DAI Mint Maker` 进行他们的收益耕作策略。


    ### Synthetix


    `Synthetix` 是一个合成资产协议。任何人都可以安全地存入或质押 `Synthetix Network Token` (`SNX`) 或 `ETH`
    并发行合成资产。什么是合成资产？几乎所有东西都有稳定的价格流动。这允许你将几乎任何金融资产添加到 `Synthetix` 平台。`Synthetix` 可以使用所有类型的资产进行即将到来的收益耕作。如果你计划为你的收益耕作策略利用长期黄金持仓，合成资产可以是合适的选择。


    ### Aave


    `Aave` 是一个去中心化借贷和质押协议。利率根据当前市场条件进行算法调整。贷方收到代币以换取资金。这些存入的加密货币在存入后立即开始赚取利息并累积复利。`Aave`
    还可以使用其他高级功能，如闪电贷。`Aave`，一个去中心化借贷和借贷协议，被农作物种植者广泛使用。


    ### Uniswap


    `Uniswap` 是一个 `DEX`（去中心化交易所）协议，允许你交换无需信任的代币。流动性提供者质押等值的两种不同代币以创建交易平台。交易者可以针对这个流动性资金池进行交易。作为提供流动性的回报，流动性提供者获得资金中发生的交易费用。`Uniswap`
    因其无麻烦的性质，是一个广泛用于无需信任交换代币的协议。使用 `Uniswap` 或类似方法是一种对收益耕作有用的策略。


    ### Curve Finance


    `Curve Finance` 是一个专门为高效交换固定货币而设计的去中心化交易所协议。与其他类 `Uniswap` 协议不同，`Curve` 允许用户以相对较低的滑点交换昂贵的固定币种。正如你可能猜到的，`Curve`
    资金池是框架的重要组成部分，因为它富含用于收益耕作的稳定币。`Curve` 是一个流行的自动做市商平台，提供了一种非常高效的赎回代币方式，同时保持低费用。它通过仅支持仅资产流动性资金池来保持较低的滑点。虽然这种方法降低了提供代币资金池的流动性提供者的费用，但
    `Curve` 通过与外部 DeFi 协议集成并以 `CRV` 和利率代币的形式提供奖励来鼓励参与。


    ### Curve Bitcoin 的收益耕作


    该平台利用 `Ren Protocol`、`Curve`、`Synthetix` 和 `Balancer` 获得 `SNX`、`REN`、`BAL` 和 `CRV`
    以保障 `Curvepool sBTC` 流动性。


    *   使用 `Ren Bridge` 将比特币转移到以太坊

    *   将新获得的 `renBitcoin` 存入 `Curvepool SBitcoin`

    *   通过 `Mintr` 在 `LP Rewards` 板块提交 `SBTC` 票据

    *   以 `SNX` / `REN` 平衡代币的形式获取价格

    *   在资产负债表上获得 `SNX` 和/或 `REN` 奖励


    **Curve 平台上的 CRV 流动性挖矿** 利用 `Curve`、`Synthetix`、`Protocol Ren` 和 `yEarn`。通过 `Curve`
    和 `Curve DAO` 流动性指标系列增加你的 `CRV` 收入。


    *   向七个 `Curve` 流动性资金池之一支付抵押品。

    *   希望参与比特币资金池的人使用 `Ren` 协议将 `BTC` 转移到以太坊。

    *   通过 `Curve` 评估投资流动性代币。

    *   为了增加流动性，我们利用 `Curve DAO` 保障 `CRV` 并将其锁定。

    *   为 `sUSD` 和 `sBTC` 资金池寻找额外激励，如 `SNX` 和 `REN`。


    `Curve` 是一个自动做市商平台，在许多方面类似于 `Uniswap` 和 `Balancer`，不同之处在于它仅支持包含行为相似资产的流动性资金池，例如固定币种，或将类似资产打包为
    `wBTC` 和 `tBTC`。这种方法使 `Curve` 能够使用更高效的算法，并在任何去中心化以太坊交易所上提供最低的费用、滑点和波动损失。


    ### Balancer


    `Balancer` 是一个 `Uniswap` 和 `Curve` 流动性协议。然而，主要区别在于流动性资金可以调整代币的分布。这允许流动性提供者创建他们自己的平衡资金池，而不是
    `Uniswap` 要求的 50/50 分割。像 `Uniswap` 一样，`LPs` 获得流动性资金中发生的交易费用。凭借构建流动性的灵活性，`Balancer`
    是农作物生长策略的重要创新者。


    ### Balancer 流动性挖矿


    该平台将你的资金连接到 `Balancer` 的流动性资金池以赚取 `BAL` 控制代币。使用像 `Predictions exchange` 这样的预测表来确定哪个资金池根据总百分比获得最多的
    `BAL`，其中 1 是最高可能比率。


    *   访问 [`pools.balancer.exchange/#/`](https://pools.balancer.exchange/#/) 以在选定的资金池中投入资金。

    *   专业提示：推荐暂时减少损失的资金池。这包括 1:1 链接的资金池，如 `sETH/wETH`、`sBTC/wBTC` 和 `DAI/USDC`。


    ### Yearn Finance


    `Yearn.finance` 是一个用于 `Aave`、`Compound` 等信贷服务的去中心化聚合器生态系统。它旨在通过算法找到最有利可图的贷款服务并优化加密货币借贷。一旦存入，现金会被转换为代币，并定期再平衡以最大化利润。`Yearn.finance`
    对于寻找自动选择最佳策略协议的农民很有用。


    '
