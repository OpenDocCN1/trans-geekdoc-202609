    # Chapter 3: Introduction to Smart Contracts


    > “Smart contracts…guarantee a very, very specific set of outcomes. There’s never
    any confusion, and there’s never any need for litigation”.

    > – Jeff Garzik, owner of blockchain services Bloq


    Smart Contracts are simply programs that run on the Ethereum blockchain. It is
    a set of code (functions) and data (states) located at a certain Ethereum blockchain
    address. Smart contracts are a form of an Ethereum account. What it implies is
    that it contains a fund balance and can activate transactions across the network.
    Nonetheless, it cannot be controlled by a network member. Instead, it is programmed
    and distributed across the network and works as pre-set or pre-coded. User accounts
    can interact with smart contracts by sending transactions that perform functions
    defined in the smart contract. Smart contracts specify rules as regular contracts,
    and these get enforced automatically using code. Smart contracts assist with the
    exchange of money, property, shares, or anything valuable in a transparent, non-conflict
    way while forgoing the services of a middleman. Specific output is guaranteed
    with the correct input. This logic is coded in the vending machine the same way
    it is coded into a smart contract. Anyone can sign smart contracts and use them
    on the web. All that is required of you is to learn to code in smart contract
    language and have enough ETH to use the contract. Using a smart contract is technically
    a transaction, so you have to pay for gas in the same way you pay for a simple
    ETH transfer. However, the gas cost of using the contract is much higher. Ethereum
    provides a coder-friendly language for writing smart contracts called “Solidity.”


    ## Solidity


    Solidity is an object-oriented coding language for writing smart contracts. The
    great thing about Ethereum is that smart contracts can be programmed in a relatively
    developer-friendly language. If you have experience with Python or JavaScript,
    you can find a smart contract framework to use with a familiar syntax. Smart contracts
    regulate the behavior of accounts in the Ethereum platform. Solidity is inspired
    by C++, Python, and JavaScript and is structured for the Ethereum Virtual Machines.
    It is mainly used to perform smart contracts on various blockchain platforms such
    as Ethereum. It was developed by Christian Reitwissner, Alex Beregsazi, and several
    former Ethereum key contributors to enter smart contracts on blockchain platforms.
    The Solidity programming language is primarily intended for code development and
    implementation of the Ethereum virtual machine. Furthermore, smart contracts establish
    the rules and penalties surrounding an agreement in the same way that a conventional
    contract does, but it also enforces those obligations automatically.


    ## Vyper


    Vyper allows you to program on Ethereum, a blockchain-based virtual machine that
    permits smart contracts’ design and execution without the need for centralized
    or trusted intermediaries. It was developed to improve after Solidity, another
    smart contract language for Ethereum, by restricting unsafe practices and increasing
    readability. Vyper finds to run the security and audits of smart contracts efficiently.
    Vyper is an experimental, contract programming language just like python and statically
    written. Like objects in the OOP, every contract has state variables, functions,
    and similar data types. Contract-particular characteristics are event notifies
    listeners, custom global variables, and global constants. Some Ethereum contract
    instances are crowdfunding, voting, and blind auctions, to mention but a few.
    Nonetheless, it must be compiled before use so that the Ethereum VM can deduce
    and store the contract. Smart contracts are publicly available on Ethereum and
    can be considered an open API. This means that other smart contracts can call
    their smart contracts to expand their functionality greatly. Contracts may also
    activate other contracts. By itself, smart contracts cannot send HTTP requests
    and therefore cannot accept “actual” event information. This is intentional because
    the use of external information can undermine the consensus important to security
    and decentralization.


    ## The Operation Process of a Smart Contract


    The smart contract is an automated computer code for executing all or part of
    a contract. It is commonly saved on a platform that is built on the blockchain.
    Such a code may only represent a contract between the parties, or it may be used
    to support a standard textual contract and comply with specific provisions, like
    the transfer of funds from one party to the other. The multiple blockchain nodes
    can thus benefit from the blockchain’s durability, security, and immutable nature.
    This mockup equally implies that the code essentially executes when a fresh block
    is integrated into blocks or blockchain chains. At the beginning of the transaction,
    if the participating persons indicate that certain parameters are fulfilled, the
    code automatically performs the action initiated by these parameters. The code
    will only do this when a transaction is initiated. When there is no such transaction,
    the code will do nothing until such a time a transaction is initiated or activated.
    Most smart contracts are coded using a coding language close in syntax to many
    widely used programming languages for computer programs like Solidity. Presently,
    the factors and the approval measurements of smart contracts must be specified.
    It also needs to be set as objective goals. What this means is things like, if
    “A” happens, follow step “B.” So, a smart contract’s actual work is a very basic
    task, like routinely transferring some cryptocurrencies from a single party’s
    wallet to another’s wallet based on certain criteria. As the blockchain grows
    and streamlines or the number of assets transferred to the chain increases, smart
    contracts will get more sophisticated and handle complex transactions. More on
    Smart Contracts’ applications will be covered in “Stake Hodler Capitalism: Smart
    Contracts and DApps.” Developers already combine several steps in the transaction
    process to create more advanced smart contracts. However, it will take at least
    a few years for the code to define more subjective legal standards, like the party’s
    compliance with reasonable commercial operating standards or the need for compensation
    and compensation provisions. There already many law firms hiring developers so
    they can participate in the new era of contractual agreements. Before smart contracts
    are implemented on any blockchain, another essential thing required is to pay
    the contracts’ execution fees. For instance, if a smart contract is to be executed
    in the Ethereum blockchain, the contract procedures are commonly performed on
    the Ethereum Virtual Machine (EVM), and the parties to the contract pay for the
    transaction using the Ethereum crypto coin called “gas” or ether. The more complicated
    a smart contract is, depending on the transaction stages, the higher the amount
    of gas you have to pay to fulfill the smart contract. Therefore, gas is currently
    an important gateway to avoiding EVM congestion with overly complex or multiple
    smart contracts.


    Presently, Smart contracts are great for routinely carrying out two types of “transactions.”
    The first one is ensuring that money is paid for certain triggers, and the second
    one is to impose sanctions on financial terms if specific laid down contract terms
    are not fulfilled. In each of these two instances, once smart contracts are deployed,
    and work begins, no human intervention or a judiciary intervention is necessary.
    This minimizes the operational and execution cost of the contract system. For
    instance, smart contracts can remove the need for the operational holes known
    as procure-to-pay. If a consignment reaches a warehouse and goes through the required
    scanning process, the smart contract immediately launches the application for
    the necessary authorization and, upon receipt, can instantly transfer money from
    the buyer to the seller. The seller will receive their payments faster, and there
    wouldn’t be any need for dunning, and the buyer will minimize the cost of payment.
    This can affect the need for working capital and streamline financial transactions
    for the two transacting parties. Once enforced, smart contracts can be encoded
    to disable access to an internet-based asset if payment is not received. For instance,
    accessing specific content may be automatically withdrawn if no payment is made.
    According to Vitalik Buterin, a 27-year-old programmer of Ethereum, he explained
    the smart contract in this way. In a smart contract system, an asset or a currency
    is transferred into a program which then executes this code, and at some point,
    it automatically validates a condition and determines if the asset should go to
    person X or back to person Y, or if it should be instantly reimbursed to the person
    who sent it or some mixture of both. The decentralized ledger also keeps and duplicates
    the document, which permits it a certain security and immutability. For example,
    if you rent an apartment from someone, you can do this via the blockchain by making
    payments in cryptocurrency. Then, you will get a receipt held in your virtual
    contract with your landlord, who in return gives you the digital entry key that
    comes to you on a particular date. Suppose the key does not come in on time; the
    blockchain will release a refund. However, if the key is sent before the rental
    date, the function will keep it stored, thereby releasing both the key and fee
    to you and your landlord respectively when the specified date comes. The system
    functions on the If-then premise and is often witnessed by hundreds of people,
    so you can rest assured to expect a flawless delivery. If your landlord gives
    you the key, then he is sure to be paid. If you send several amounts in Bitcoins,
    you will receive the key. The document is instantly canceled after the time, and
    the code cannot be disturbed or touched without the knowledge of both of you since
    all participants are always notified of whatever exchange goes on. You can utilize
    smart contracts for any situation ranging from financial derivatives, contract
    breaches, financial services, insurance premiums, property law, credit enforcement,
    legal procedures to crowdfunding agreements.


    ## How can you use smart contracts?


    According to Jerry Cuomo, the Vice President for blockchain technologies at IBM,
    smart contracts can be used across all areas ranging from financial services,
    health care, insurance, etc. Here are ways through which smart contracts can be
    utilized:


    ### Government


    With smart contracts, citizens no longer have to worry about their votes being
    rigged because it will calm all concerns by producing a long-lasting, tamperproof
    and secure system. Ledger-protected votes would need to be decoded and needs a
    lot of computing power to gain access to it. Since no one can possess that much
    computing power as is directed to it, it would need the godlike computing power
    to hack or infiltrate the system. Also, smart contracts could pull low voter turnout
    up. Many inactivities originate from an imbalanced system that includes queuing,
    showing your identity, and filling out forms. Volunteers can even transfer voting
    online, and a thousand will turn out as a group to vote for their leaders.


    ### Management


    Not only is a single ledger provided as a source of trust by the blockchain, but
    probable complications in communication and workflow are also due to its accuracy,
    transparency, and automated system. Usually, business operations have to adapt
    to and fro while patiently waiting for the approvals after the internal and external
    bodies are finished sorting themselves. A blockchain ledger optimizes this, and
    it also cuts out any issues that may naturally happen with the independent procedure,
    which may lead to expensive lawsuits and delays in settlements.


    ### Automobile


    There is no argument that we are moving forward from the lazy pre-human vertebrates
    we were to the extremely smart robots. If we think of a future where all things
    are automated, we will realize that we are almost there with the existence of
    smartphones, smart glasses, and even smart cars. This aspect is where smart contracts
    can be of help. For instance, let us use the self-autonomous or self-parking vehicles
    as a case study. In this aspect, smart contracts can put in place an oracle of
    some sort that can tell whose fault it was in a crash; the driver, the sensor,
    or other parts in the vehicle. With the aid of smart contracts, an automobile
    insurance company could authorize prices differently based on where and in what
    conditions customers are operating their automobiles. More on Smart Contracts
    applications in the second part of the series “Stake Hodler Capitalism: Smart
    Contracts and DApps.”


    ### Real estate


    More money can be made through smart contracts. On a norm, you would need to pay
    an intermediary such as an agent or a newspaper to advertise and then pay again
    so that you can confirm if the person has paid the rent and followed through with
    the remaining process, this is for someone who wants to rent out their apartment.
    With smart contracts, the ledger reduces your costs. All you have to do is pay
    with Bitcoin and encode your contract on the ledger. Everyone can see what you
    have done, and you achieve instant fulfillment. Brokers, realtors, hard money
    lenders, and others connected with the property game get to make a profit.


    ### Healthcare


    Personal health records can be encoded and classified on the blockchain with a
    private key that would give entry to only specific individuals selected beforehand.
    The same method can be used to ensure that research is performed through HIPAA
    laws securely and confidentially. Furthermore, receipts of surgeries can be stored
    on a blockchain and automatically sent to insurance providers as evidence of delivery.
    The ledger can also be used for general healthcare management like overseeing
    drugs, regulating obedience, testing results, and organizing healthcare rations.


    ## Benefits of Smart Contracts


    Smart contracts are a key edge for Ethereum and other cryptocurrency ecosystems
    over ordinary fiat currencies. Here are some of the things that can be gotten
    or gained from using smart contracts:


    ### Autonomy


    Since you are the one agreeing, there is no need to depend on a broker, lawyer,
    or any other middleman for confirmation. Apropos also takes away the dangers of
    being manipulated by a third party. Since the job is automatically done by the
    network, instead of by one or more people, probably biased, or individuals that
    can make a mistake, your interest is secured.


    ### Trust


    Your data and files are encrypted on a shared ledger, so there is no way someone
    can say someone lost or misplaced them. You can always trust to find it whenever
    you need it.


    ### Backup


    It is possible for your bank lost your savings account. However, this is not the
    case on the blockchain, as you are in very good hands. Since every one of your
    friends got your back, your documents are duplicated many times over and over.


    ### Safety


    You don’t have to worry about security because your documents are safe with cryptography
    and websites’ encryption. Hacking is not an option, and it would take an extremely
    craze and talented, smart hacker to crack the code and infiltrate your documents
    on this platform.


    ### Speed


    To manually process documents, you will have to spend lots of time and paperwork
    before accomplishing this feat. On the other hand, smart contracts use software
    code to automate assignments, therefore cutting hours off taking care of business
    processes or any other documented stuff.


    ### Savings


    Since the presence of an intermediary is taken away from the picture, smart contracts
    save you money by this exemption. For instance, you may have to pay a broker or
    notary to witness your exchange or help you monitor it.


    ### Accuracy


    Computerized contracts are known for their speed and cheapness and their ability
    to avoid the errors that come from filling out piles of forms. Here, errors are
    very much non-existent or extremely minimized.


    ## Problems of Smart Contracts


    > “Smart Contracts are where the rubber meets the road for businesses and blockchain
    technology. While a few highly specialized distributed financial services use
    cases for blockchain have appeared-for example, payment ledger services for the
    Yangon Stock Exchange in Myanmar. Its services on top of the blockchain that is
    interesting. The Yangon Exchange solves distributed settlements in a trading system
    that only synchronizes trades twice a day. But the autonomous execution capacities
    of smart contracts extend the transactional security assurance of blockchain into
    situations where complex, evolving context transitions are required. And it’s
    this possibility that has Amazon, Microsoft, Azure, and IBM Bluemux rolling out
    Blockchain-as-a-service (Baas) from the cloud”.

    > – Patrick Hubbard, Head Greek, SolarWinds.


    Smart contracts are far from perfect, even as wonderful and awesome as they sound.
    For instance, software defects can cause serious issues, the government can have
    a hard time regulating such contracts, the government may also have issues on
    ways to tax these smart contract transactions, there may also be the problem of
    sending the wrong code according to the rental example aforementioned or sending
    the right code, but your apartment gets condemned (I.e., made to become public
    use without your permission) before the arrival of the rental date. Some of these
    things could be revoked in court, but the blockchain is a different issue. The
    contract proceeds no matter what happens until the stipulated end time. The challenges
    of smart contracts when the thought of goes on and on. Although experts are trying
    to correct them and make them perfect, these important issues discourage some
    likely users from hopping.


    ## Blockchains where smart contracts processes can go through


    ### Bitcoin


    Bitcoin is the perfect place for performing Bitcoin transactions; however, it
    has limited ability to process smart contracts.


    ### Side Chains


    This is another name for blockchains that run adjoining to Bitcoin, and they have
    a broader range to offer for processing contracts than that of Bitcoin.


    ### NXT


    NXT is a common blockchain forum that has a limited choice of templates for smart
    contracts. You have to use whatever resource you are given because you cannot
    code independently of these resources.


    ### Ethereum


    Ethereum is a known blockchain platform that is the most advanced for coding and
    processing smart contracts. You are given the liberty to code whatever you desire
    but would have to pay for computing power with “ETH” tokens. Smart contracts have
    no end to the number of industries they can influence from healthcare, real estate,
    and even the law. The list of its potentials goes on and on.

