    # Chapter 4: Ethereum and DeFi


    目前，绝大多数甚至所有的 DeFi 项目都构建在 Ethereum 之上。Ethereum 是一个去中心化区块链，允许其他去中心化区块链应用（dApps）基于智能合约构建，其中一些应用可以拥有可交换的代币。Compound
    是主要处理去中心化金融服务（储蓄和借贷加密货币）的协议之一。其核心原因在于功能强大的 Ethereum 智能合约平台，它提供了稳健性，使你能够编写包含 DeFi
    应用所需所有逻辑的高级智能合约。此外，Ethereum 拥有所有智能合约平台中最先进的生态系统。数千名开发者每天创建新应用，最大的价值在于创造额外网络效应的智能合约。


    在 Ethereum 区块链上用于智能合约的广泛采用的编程语言之一是 `Solidity`。`Solidity` 允许创建包含 DeFi 应用所需所有逻辑的高级智能合约。此外，Ethereum
    拥有智能合约平台中最发达的系统，每天都有越来越多的开发者构建和创建新应用，且锁定在智能合约中的价值最多，从而产生额外的网络效应。这非常完美，因为 Ethereum
    的智能合约平台提供了更大的灵活性，并在满足特定条件时即时执行交易。像 `Solidity` 这样的 Ethereum 智能合约编程语言是专门为开发和部署此类智能合约而创建的。


    例如，如果用户想在周四给朋友汇款，仅当 `weather.com` 显示温度飙升至 85 华氏度时才执行。另一个例子是根据玉米期货（即期货证券）价格调整农田租金。此类规则和条款可以包含在智能合约中。大量
    DeFi 应用运行在 Ethereum 上，智能合约是它们的核心。


    ## Popular DeFi Apps: Lending and borrowing


    ### MakerDAO


    `MakerDAO` 是迈出 DeFi 运动第一步的主要项目之一。`MakerDAO` 成立于 2015 年，允许用户生成 `DAI`，这是世界上第一种有抵押的中性货币，也是领先的去中心化稳定币。它还允许用户质押抵押品以获取贷款。`DAI`
    是一种通过激励机制追踪美元价格的固定币。`DAI` 也可用于在 `MakerDAO` 平台上储蓄，并可用于贷款，这是金融体系的支柱之一。


    DeFi 正试图创建一个全新的经济生态系统，该系统无需许可且透明。借贷或质押只是该生态系统的一部分。其他重要功能包括稳定币、去中心化交易所、衍生品、保证金交易和保险。


    `DAI` 是一种稳定的加密货币，试图利用建立在 Ethereum 平台上的自动化智能合约系统，维持其价值接近美元（USD）。`DAI` 在 `MakerDAO`
    的治理结构下维持和运行，`MakerDAO` 是一个去中心化自治组织（DAO），由控制 `MKR` 代币的持票人组成，他们可以对智能合约的特定参数变更进行投票，以保持
    `DAI` 的稳定。`DAI` 和 `MakerDAO` 这对组合被视为获得大规模关注和采用的首要 DeFi 项目。


    截至 2020 年 6 月，`Compound Finance` 开始用一种名为 `COMP` 代币的新加密货币单位，向其平台上的借贷双方提供补偿，这除了正常的借款人利息支付外。`COMP`
    代币用于控制 `Compound` 平台，但也可在交易所交易。很快，其他平台纷纷效仿，从而催生了被称为“收益耕作”或“流动性挖矿”的现象。`COMP` 是一个平台，观察者在平台内不同资金池之间、以及不同平台之间转移加密资产，以增加其总收益，包括利息和费用，但额外代币的价值作为收集的奖励。


    ### DAI Overview


    `DAI` 基于由 `MakerDAO` 智能合约以 dApp 形式启用的超安全抵押和赎回程序。质押 `Ether`（或其他支持作为抵押品的加密货币）的用户，可获得相当于存款金额的贷款，并获得新铸造的
    `DAI`。目前，`Ether` 的抵押率设定为 150%。这意味着如果你质押价值 150 美元的 `Ether`，最多可获得 100 `DAI`（约 100
    美元）的贷款。如果抵押品价值低于此比例，借入金额将通过智能合约自动偿还。反之，如果价值上涨，你可以借入额外的 `DAI`。因此，偿还贷款并累积利息后，归还的
    `DAI` 会自动销毁，从而可以提取抵押品。因此，`DAI` 的美元价值由 `MakerDAO` 智能合约持有的底层抵押品的美元价值支撑。


    通过调节支持抵押品、抵押品条款以及 `MakerDAO` `DAI` 的借贷或质押利率，可以调节流通中的 `DAI` 数量，这同样会影响其总体价值。`MKR`
    代币持有者保留使用代码提出并实施这些变量变更的权利。治理代币持有者可以对建议的变更进行投票，但权重因持有票数而异。`MKR` 代币同样是 `MakerDAO`
    平台上的投资工具。除了贷款金额外，借款人支付的额外利息用于回购并销毁或最终从市场撤回 `MKR` 代币。此过程旨在创造与贷款金额相对应程度的 `MKR` 通缩。


    ## Stable-coin


    `Stable-coin` 是一种加密货币，旨在相对于“固定”资产篮子或资产，降低固定价格 `Bitcoin` 的波动性。`Stable-coin` 可以与加密货币、法币或大宗商品（如贵金属或工业金属）挂钩。由货币、大宗商品或法币支持的稳定币被称为有抵押稳定币，而与算法关联的稳定币被称为铸币税（无抵押）。


    `Stable-coins` 是与加密货币社区外部资产挂钩的加密货币，例如美元或欧元。主要目标是稳定价格。


    ### Backed Stable-coin


    资产支持型加密货币的优势在于，代币由加密货币领域之外波动的资产稳定。由于 `Bitcoin` 和 `Altcoins` 高度相关，加密货币持有者若不退出市场或寻求资产支持型
    `Stable-coin` 避险，就无法避免大幅价格下跌。此外，如果这些代币以善意管理并具有资产赎回机制，由于套利机制，它们不太可能低于底层实物资产的价值。并行稳定化面临与底层资产相同的波动性和风险。如果固定币以去中心化方式受保护，它们相对免受掠夺，但中心化托管可能导致盗窃或信任丧失。


    #### Commodity Asset-backed Stable-coin 的主要特点：


    *   一种或多种物品具有价值，可根据需要兑换（或多或少）。

    *   你拥有来自非监管个人、公开公司或受监管金融机构的付款承诺。

    *   用于维持固定锚定的商品数量，必须反映固定供应量的流通供应量。


    由大宗商品支持的固定商品所有者，可按兑换率赎回份额以接管实物资产。维持 `Stable-coins` 稳定性的成本是存储和保护底层原材料的成本。以 `Digix
    Gold Tokens (DGX)` 等为例。


    ### Fiat-backed


    此类 `Stable-coin` 的价值基于受监管的第三方金融机构手中持有的支持货币价值。对兑付可用性的信心对价格稳定至关重要。法币支持型代币可在证券交易所交易，并可从发行方赎回。`Stable-coins`
    稳定性的其他关键因素包括维持储备成本、法律合规、监管机构要求的许可，以及维护审计师和业务基础设施。


    由法币支持的加密货币是最常见的类型，也是最早发布到市场上的固定币类型。


    **法币支持型加密货币的特点：**


    *   其价值按固定汇率锚定一种或多种货币（通常是美元、欧元和瑞士法郎）。

    *   通过银行或其他作为支持 `Stable-coins` 货币储存库的受监管金融机构进行线下通信。

    *   用于支持 `Stable-coin` 的货币数量必须等于流通中的 `Stable-coin` 数量。


    ### With Cryptocurrency


    加密货币支持型 `Stable-coins` 接受加密货币作为抵押品，概念上类似于法币支持型 `Stable-coin`。然而，两者的关键区别在于：法币抵押通常发生在链下，而支持此类
    `Stable-coin` 的加密货币区块链是通过智能合约以去中心化方式创建的。在大多数情况下，当固定价值下跌时，通过锁定抵押品偿还债务更有利，这样消费者可以在智能交易中借贷。为避免突然中断，如果抵押品过接近提款金额，可用智能合约取消消费者贷款。


    **比特币支持型加密货币的主要特点：**


    *   `Bitcoin` 的固定价值由另一种加密货币或加密货币组合提供。

    *   绑定通过智能合约在链上完成。

    *   固定 `Bitcoin` 分配通过智能合约在链上调节。

    *   通过引入额外手段、激励以及抵押品实现价格稳定。


    此类固定币的技术实现比法币支持型更复杂和多功能，增加了因智能合约代码错误（Bug）而被利用的风险。因为模块在链上运行，不受第三方监管，从而创造了去中心化解决方案。此类
    `Stable-coin` 潜在的问题在于底层抵押品价值和托管平台的变化。固定币的复杂性和间接支持可能限制其使用，因为很难理解价格是如何提供的。由于加密货币市场高度波动和高度趋同的性质，必须维持非常大的抵押品以确保稳定性。


    ## Decentralized Exchange


    `DEX`（去中心化交易所）是一种加密货币交易所，支持在线直接进行点对点加密货币交易，安全且无中介。通过去中心化交易所进行的交易中，区块链通常取代了监控去中心化总账安全和资产转移的常规第三方组织（如银行、证券经纪人、在线支付门户、当局等）。常见工作方式包括使用智能合约或重新提交订单，但存在许多其他选项和不同程度的去中心化。


    借助在线交易所，用户可以将货币兑换为其他货币，无论是美元兑 `Bitcoin` 还是 `DAI`。`DEXs` 是连接用户直接交易的高级热门交易所，确保无需中介处理资金即可进行有前景的加密货币交易。去中心化交易所降低了交易所被黑客攻击导致资产被盗的风险，因为用户无需将资产转移到交易所。高级交易所还可通过冲刷防止价格操纵或虚假交易量，且比需要了解客户身份（KYC）的交易所更匿名。


    有迹象表明，去中心化交易所面临交易量低和市场流动性不足的问题。`Project 0x` 是一个用于创建具有独特流动性的去中心化交易所的协议，正试图解决这一问题。


    ### Disadvantages


    由于没有了解你的客户（KYC）流程且交易不可逆，如果用户被黑客攻击并获取其密码或私钥，将导致用户流失。尽管流动性基金 `DEX` 是最广泛使用的，但可能存在一些缺陷。`DEX`
    流动性基金最常见的问题是价格滑点和抢跑交易。


    价格下降是由于自动做市商（AMM）的性质造成的。交易规模越大，对价格的影响越大。例如，如果使用恒定乘积 AMM，所有交易必须保持乘积 `XY = k` 恒定，其中
    `x` 和 `y` 是资金池中两种加密货币（或代币）的数量。输入规模 `Δx` 越大，最终 `y/x` 比率越低，从而决定兑换价格。此问题通常对大公司或小流动性池很重要。


    抢跑交易是一种特殊的公共区块攻击形式，参与者（通常是矿工）在看到即将发生的交易时，推进自己的交易（如操作交易费），使初始交易利润降低。改善恒定乘积 AMM
    抗压强度的想法最早由 `Vitalik Buterin` 在一篇文章中讨论。一种可能的解决方案是允许交易不立即完成，而是持续一段时间（如 5 分钟），在这种情况下流动性逐渐转移到资金池而不产生最高价格。这消除了持续行程的问题，因为一线工作人员无法从长时间工作中获益。它还有助于防止价格滑点，因为中介和其他交易者可以并行行动，干扰对手交易者。


    ### Degrees of Decentralization


    去中心化交易所可能仍具有中心化组件，这意味着交易所的某些控制权仍掌握在中心化机构手中。一个很好的例子是 `IDEX` 阻止纽约州用户在平台上下单。2018
    年 7 月，据报 `Bancor` 的去中心化证券交易所被黑客攻击，在资金被冻结前造成 1350 万美元资产损失。高级交易所运营商可能面临国家监管机构的法律后果。例如
    `EtherDelta` 创始人于 2018 年 11 月向美国证券交易委员会（SEC）支付罚款，因其运营私人证券交易所。


    ## Compound


    此类别还有其他几个重要的 DeFi 产品。主要的是 `Compound`。撰写时，`Compound` 是借贷类别中最大的 DeFi 项目，协议中锁定资产约
    6.3 亿美元。`Compound` 是一种算法自主利率协议，允许用户提供 `Ethereum` 或 `Tether` 等资产并开始赚取利息。提供的资产也可作为抵押品，使其所有者能够借入其他资产。


    用户间借贷策略是 DeFi 生态系统中应用最广泛的应用之一。例如，`Compound` 利用一种算法自主利率协议，支撑并构成了 `PoolTogether`、`Dharma`
    和 `Argent` 等一长串 DeFi 平台的基础。通过在 Ethereum 上提供利率市场，`Compound` 允许用户对其提供给借贷池的加密货币赚取利息。`Compound`
    智能合约自动匹配借贷双方，然后根据借入资产与供给投资的百分比计算利率。


    `Compound` 是 DeFi 领域指数级机会的清晰例证。合并到 `Compound` 策略的产品越多，加密投资获得利息的机会就越多，即使在闲置时也是如此。


    `Compound` 为某些加密货币提供贷款，如 `DAI`、`Ether (ETH)`、`USD Coin (USDC)`、`Ox (ZRX)`、`Tether
    (USDT)`、`Wrapped BTC (WBTC)`、`Basic Featured Token (ATM)`、`Augur (REP)` 和 `Sai
    (SAI)`。任何加密货币所有者或持有者都可以直接借贷加密货币，无需浪费时间、精力和金钱与传统金融中介沟通。如果你拥有上述加密货币，你可以发送、锁定、存入和借贷。它们都代表
    `Compound` 协议所需的金额。


    在 `Compound` 中锁定加密货币等同于将钱存入储蓄账户，但它使用基于区块链的去中心化协议。他们不把钱存入银行，而是发送加密货币到钱包。你立即开始赚取加密货币利息，就像借钱给银行一样。回报率用与借入相同的符号表示。换句话说，发送
    `BAT` 赚取 `BAT` 利息，发送 `DAI` 赚取 `DAI`。


    你发送的加密货币将添加到一个巨大的资金池中，该资金池由全球数千人发送的相同标志的 `Compound Protocol` 智能合约组成。等式的另一面是贷款。在
    `Compound` 中锁定加密货币允许你以此获得贷款。一些平台不需要信用检查，因此世界上任何拥有加密货币的人都可以申请贷款，并在申请人满足特定条件时获得即时批准。


    `Compound` 依据资产质量决定你可借入的金额。例如，如果你将价值 500 美元的 `Bitcoin` 转换为 1000 `COMPS`，且 `Compound`
    将 `Bitcoin` 的贷款限额（也称为抵押因子）设为 50%，你可以借入 `Compound` 协议支持的其他加密货币 250 美元（见上文列表）。就像从银行借钱一样，你必须为借入的钱支付利息。所以我们有存款和贷款，两者都与利率有关。当你质押时，你赚取利息。你为借入的贷款支付利息。让我们谈谈这些利率是如何通过一个精心设计、架构优美的系统自动计算和应用的。


    无论你是借贷还是做生意，你首先必须用 `Compound` 兑换加密货币。这样，你将收到代表你加密货币余额的复合代币（`cTokens`）。该代币和许多其他代币在
    Ethereum 区块链上作为 `ERC-20` 创建。`ERC-20` 代币是基于区块链的加密货币市场中最大的优势和创新之一。在赚取（或支付）利息时，它可以像任何其他
    Ethereum 代币一样在 DeFi 生态系统中转移、出售或编程给其他 Dapps。将这些代币视为使用公钥和私钥在 Ethereum 区块链上管理数字资产。


    利率取决于每个市场中可用的加密货币（或流动性）数量，并实时随供需反映当前市场状况。显示的利率列为年利率，每次 Ethereum 区块产生时收取一次。根据 `Cryptopedia`（无日期）引用的年化百分比，每
    15 秒，`cToken` 的价值增加 `1/2102400`（每年 15 秒区块数）。


    ## 其他 DeFi 类别


    另一个流行的 DeFi 项目是 `AAVE`。明智地使用智能合约和特定激励，我们可以创建与美元挂钩的稳定币，而无需在现实世界中存储美元。还有许多其他非算法虚拟币，如
    `USDT`、`USDC` 或 `PAC`。最大的问题是它们是中心化的，因为它们由负责存储底层等值资产（即美元或其他资产）的公司支持。然而，稳定币已获得流行，并常用于
    `Compound` 或其他 DeFi 应用中。


    与中心化加密货币不同，去中心化交易所或 `Dex` 允许以完全去中心化和未经授权的方式交换加密货币，且不阻止代币存储。流动性池去中心化交易所的例子有 `Uniswap`、`Khyber`、`Balancer`
    和 `Bancor`。`Links` 和 `Idex` 是订单簿系统的例子。


    ### Derivatives


    与传统金融一样，衍生品是其价值由底层资产回报决定的合约。DeFi 在此领域的主要应用是 `Synthetixs`，一个提供链上各种资产访问的去中心化平台。衍生品是其价值由一个或多个称为基础（底层资产）的变量价值决定的产品。该基础实体可以是资产、指数或利率，通常仅称为“基准”。


    衍生品可用于多种目的，包括对冲价格波动风险（保险）、增加价格波动敞口以进行投机，或获取难以交易的资产或市场。基于 Ethereum 的智能合约有助于创建代币化衍生品，其价值源自底层投资的成功，合作伙伴协议通过代码硬编码。DeFi
    衍生品也可以代表法币、债券、大宗商品甚至加密货币等现实世界投资。


    最常见的金融衍生品包括期货、期权、互换，以及合成抵押品和信用互换等转换。大多数衍生品在场外交易（OTC）或芝加哥商品交易所等交易所交易，而大多数保险合约作为一个单独的行业开发。衍生品是金融工具主要组成部分列表中的第一位；其他两个是权益和负债（即债券和抵押贷款）。


    衍生品是两方或多方之间的合同协议，定义了各方之间的支付条款（特别是日期、金额和底层变量的定义、各方的合同义务和名义金额）。资产包括股票、大宗商品、债券、利率和货币，但也可以是其他衍生品，提供另一个层级，使准确估值复杂化。


    ### Margin Trading


    传统金融中的保证金交易者可以通过向经纪人借款来杠杆交易——这构成了贷款的抵押品，而 DeFi 保证金交易则由去中心化、非托管借贷协议（如 `Compound`、`Fulcrum`
    和 `dYdX`）提供支持。由于传统经纪商的智能合约自动化，一些人已开始转向 DeFi 生态系统中日益自主的货币市场。


    ### Insurance


    保险是传统金融的另一部分，可在去中心化金融中复现。它提供支付保费的赔偿保证。DeFi 领域最广泛使用的保险应用之一是针对智能合约错误和存款保护。该领域最流行的
    DeFi 项目是 `Nexus`、`Mutual` 和 `Opyn`。


    DeFi 仍是一个新兴领域，伴随智能合约 Bug 和漏洞等风险。一些创新的保险替代方案已进入市场，帮助用户购买保险以保护其持仓。`Nexus Mutual`
    是提供的解决方案之一。它提供智能合约保障，防范智能合约代码的非故意使用。


    DeFi 生态系统中另一个非常重要但不局限于金融的部分是 `Oracle` 服务，专注于向智能合约外部提供稳定数据流。该领域最流行的项目是 `Chainlink`。这些几乎存在于
    DeFi 生态系统的每个主要部分中。它也可以以多种方式组合。你可以把它想象成“乐高钱”，因为你可以在现有模块之上构建更复杂的 DeFi 产品。


    ### Identity


    结合基于区块链的身份系统，去中心化金融协议为曾被锁定在外的用户提供了进入真实全球经济体系的途径。DeFi 解决方案有助于最小化无额外资金个人所需的超额抵押，并通过声誉和财务活动等特质协助用户的信用度，而非收入和所有权等传统数据点。DeFi
    世界鼓励个人身份信息的数据隐私，以及自由访问。因此，任何拥有互联网连接的人都可以自由访问 DeFi 应用，同时保留对其数据和投资的控制权。


    ### Gaming


    DeFi 的可组合性为产品开发者创造了机会，将 DeFi 策略直接集成到跨垂直领域的平台组合中。基于 Ethereum 的游戏因其内置经济和创新激励标准，已成为去中心化金融的著名用例。例如，`PoolTogether`
    是一个无损失的审计储蓄彩票，允许用户通过存入 `DAI` 稳定币购买数字彩票，随后资金被汇集并借给 `Compound` 货币市场协议赚取利息。


    DeFi 策略的主要设计原则之一是兼容性，指不同系统组件可以轻松连接和互操作。从大量集成的 DeFi 应用中可以看到，可组合代码在社区中产生了强大的网络效应，并持续在其他人创造的事物基础上构建。许多人将
    DeFi 开发过程比作搭积木。因此，它有一个著名的昵称“Money Legos”。


    Ethereum 开发者和产品团队现在可以使用完整的工具包和所需的安全集成来构建和启动 DeFi 策略，特别是来自 `Truffle` 的智能合约工具、`Infura`
    的 API 套件和 `Diligence` 的安全工具。


    ### Data and analytics


    由于围绕交易数据和网络活动的卓越透明度，DeFi 策略为金融机会和风险控制的数据发现、分析和决策提供了独特优势。新的去中心化金融应用的爆发式增长刺激了各种工具和仪表板的出现，如
    `DeFi Pulse` 和 `CoDeFi data`。这有助于用户追踪 DeFi 策略上的锁定价值、检查平台风险，并区分收益和流动性概念。`CoDeFi
    data` 负责区分 DeFi 策略中的收益、流动性和其他因素。


    ### DAOs


    去中心化自治组织（`DAO`）根据编码在 Ethereum 区块链上的透明规则进行协作，从而消除了对中心化组织要素的需求。DeFi 领域其他流行协议如 `Maker`
    和 `Compound` 已启动 `DAO` 以筹集资金、管理财务运营，并将管理权下放给社区。


    ### Compliance and know-your-transaction (KYT)


    在传统金融中，遵守反洗钱（AML）和反恐融资（CFT）取决于了解你的客户（KYC）指南。在 DeFi 领域，Ethereum 的去中心化基础设施支持下一代合规分析，关注参与地址的行为而非参与者身份。这种了解你的交易（`KYT`）工具使我们能及时评估风险，并防御欺诈和其他金融犯罪。


    ### Asset management


    `MetaMask`、`Argent` 和 `Gnosis Safe` 等加密钱包使你能轻松安全地与去中心化应用交互，执行从买卖、转移加密货币到为数字投资赚取利息的所有任务。在
    DeFi 中，你是自己加密资金的保管人。这意味着你在 DeFi 领域拥有自己的数据并完全自主控制。例如，`MetaMask` 将你的种子短语、密码和私钥以加密布局本地存储在你的设备上，因此只有你能访问你的账户和数据。


    ### Market places


    DeFi 策略在在线市场集合方面显著增加，允许用户从用户到用户在国际上交换产品和服务。这些包括从自由编程工作、数字收藏品或非同质化代币到实际珠宝和服装的所有内容。


    ### Payments


    用户间支付可以说是 DeFi 领域乃至整个区块链生态系统的基础用例。区块链技术的设计使得用户可以在没有中介的情况下安全直接地交易加密货币。DeFi 支付解决方案为银行服务不足和无银行账户的人群构建了更自由的经济体系，并帮助大型金融机构简化市场基础设施，更好地服务批发和零售客户。


    ### Prediction markets


    基于区块链的预测市场汇聚大众智慧，帮助用户对事件结果进行投票和价值交换。市场价格随之成为事件几率的众包指标。一个流行的 DeFi 博彩平台例子是 `Augur`；它强调基于选举结果、经济事件、体育比赛等的预测市场。


    ### Saving


    许多 DeFi 应用提供计息账户，当封装进 `Compound` 等借贷池策略时，基于与供需挂钩的动态利率，收益可能比传统储蓄账户呈指数级增长。一些流行的储蓄应用有
    `Argent`、`Dharma` 和 `PoolTogether`，后者是一个无损失储蓄游戏，玩家无论输赢都能拿回所有钱。围绕这些创新储蓄工具爆发的一项活动是“收益耕作”。收益耕作指用户在各种流动性协议中移动闲置加密投资以增加回报。围绕
    DeFi 收益耕作的狂热激励了大量表情包的产生。


    ### Staking


    随着 Ethereum 网络通过 Ethereum 2.0 阶段 0 过渡到权益证明共识算法，用户现在有机会质押 `ETH` 并获得奖励，无论是作为验证者还是通过质押服务提供商。`Eth2`
    上的质押类似于计息储蓄账户，质押者获得利息——作为在区块追加到区块链前评估 `Ethereum` 协议区块的奖励。


    ### Tokenization


    这是去中心化金融的基础之一，也是 Ethereum 区块链的原生功能。代币不仅为网络提供动力，还开启了多样化的经济可能性。简单来说，代币是在区块链上开发、授予和管理的数字资产。代币被构建为安全且即时可移动，并编程有一系列内置功能。从代表分割化房产的房地产证券代币，到激励使用特定应用的平台专用代币，基于
    Ethereum 的代币已成为全球用户访问、交换和存储价值的安全数字选择。


    ### Trading


    在 DeFi 领域，交易包含一系列衍生品交易、保证金交易和代币互换。这发生在一个不断增长和融合的交易、流动性池和市场网络中。去中心化交易所上的加密交易者受益于更低的交易费用、快速的交易结算和对其资产的完全所有权。


    ## DeFi vs. CeFi


    让我们比较 DeFi 和 `CeFi`（即中心化或传统金融）的关键区别，但如果你之前已经做过，请点击分享按钮让这个频道成长。

