- raw: 'Chapter 5: What Does Yield Farming In Decentralized Finance (DeFi) Mean? As
    the exciting new financial sector’s progress continues, consumers’ trend to participate
    in protocol growth has increased. Whether it’s as simple as introducing a cryptocurrency
    to Compound for something more complex, like participating in Maker’s liquidation
    auction, DeFi is opening up exciting new passive income opportunities. The yield
    farming technique is evolving and experimental, but the implications are amazing.
    On the general internet, you can’t buy a product unless you give the website owner
    enough data required to activate the transaction, but with DeFi, you can borrow
    money without even disclosing your name or any personal information. The DeFi
    app doesn’t care because it has the collateral it provides to secure the debt
    (e.g., a $10 loan will require collateral worth about $20 on the Compound platform).
    If you follow this advice and decide to experiment with it, you can change everything
    back as soon as you do it, say after 10 minutes. However, it is still a good experience
    for someone who’s all curious about the unique benefits Yield farming offers.
    So, why lend money to people who already have it? Most people do this for some
    sort of trading. The most obvious example is shorting the market (to make a profit
    when the price drops). It’s also great for those who want to stake tokens and
    at the same time engage in trading in the marketplace. Don’t You Need A Lot of
    Money To Run A Bank? This is true, and on DeFi, this money comes primarily from
    strangers on the internet. That’s why it provides a smart way for these decentralized
    banking apps to attract empty HODLers. Liquidity is a major issue for all of these
    products. In other words, how much fund was staked in the smart contract? For
    some product types, the product experience is best with liquidity. Instead of
    borrowing from venture capitalists or debt investors, they borrow from consumers,
    says Avichal Garg, Senior Partner at Electric Capital. Use Uniswap, for example.
    Uniswap stands for Automated Market Maker or AMM (another term for DeFi art).
    In short, Uniswap is a web-based robotic system that is constantly ready to buy
    and sell any crypto coin that has a marketplace. Uniswap has one or more marketing
    pairs for almost every Ethereum token. Behind the scenes, this means that Uniswap
