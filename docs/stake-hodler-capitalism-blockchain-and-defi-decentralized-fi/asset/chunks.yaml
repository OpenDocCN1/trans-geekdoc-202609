    # 第 6 章：自行挖掘比特币的方法


    获取比特币主要有三种途径：在交易所购买、通过提供商品和服务收取、以及挖掘新币。比特币的功能类似现金，但其获取过程却像黄金一样可以“挖掘”。“挖矿”是发现新比特币的术语——就像发现黄金一样。它是将比特币交易验证并编译成固定大小的区块，然后添加到区块链的过程。例如，辛西娅用一个比特币从在线零售商处购买了一台电视。为了确保她的比特币是真实的，矿工会执行特定于各个区块链的计算操作，以验证交易并添加新的交易区块。验证过程比这更复杂，但为保持简单，我们可以简单地将其理解为交易验证。所有交易都被编译在带有虚拟挂锁的区块中，这个挂锁被称为“区块链”。然后矿工运行软件寻找打开此挂锁的合适密钥以添加新区块。当他们的计算机找到这个密钥时，箱子就会打开，交易也就得到了验证。找到适合解锁挂锁的密钥的奖励是
    12.5 个新生成的比特币；由于其化名发明者中本聪预设的比特币规则，该价值每一定数量的区块就会减半。根据一个提供最新真实比特币交易的顶级网站显示，目前寻找密钥所需的尝试次数约为
    1,789,546,951.05 次。尽管尝试次数巨大，但约每 10 分钟就会提供 25 个比特币的奖励（编者注：原文此处奖励数字与前文 12.5 不符，译文保留原文数字）。然而，如今独自挖矿令人沮丧，因为寻找区块的过程非常流行，且寻找区块的难度极高，以至于你可能需要让机器运行约三年才能产出任何币。相比之下，矿池挖矿的效率要高得多。这允许你将工作分配给一群人。你只需为区块中的份额工作，当区块被挖出并追加到区块链时，你将根据共同工作的人数或用户数获得区块奖励的百分比，并包含较低的费用。


    以下是一些步骤，助你轻松开始挖掘比特币。


    ## 获取钱包


    你可以选择将钱包存储在本地或在线。你需要使用或下载一个约 320GB 的相当庞大的区块链文件；下载和更新本地钱包可能并不现实。你决定用哪种方式保管比特币完全取决于个人偏好。没有完美的钱包类型，因为它们都有各自的优缺点；不过，隐私倡导者会倾向于本地钱包。当你创建好心仪的钱包时，你会得到一个类似
    `1BEkUGADFbrEShQb9XJ` 的地址。这是将比特币直接发送到你钱包的途径，请务必记下它。你可以在 Coinbase 的关联账户下找到钱包地址。


    ## 加入矿池


    在你能进行矿池挖矿之前，必须与其他矿工一起处理可用的区块。每个矿池主要由其收取的区块费用和用户数量来区分。用户较少的矿池发现待挖区块的速度可能较慢，但用户众多的矿池通常分配到的收益较小。大多数服务都有简单的指南以避免过载。此外，请确保将你的钱包地址填入矿池信息中。这将确保你收到比特币。


    ## 获取挖矿软件


    不同平台有各种挖矿选项，OSX 用户可能会发现自己处于棘手的境地。矿工利用闲置的 GPU 周期来为挖矿操作提供动力。矿工利用这些周期来帮助处理与比特币相关的用户间流程。因此，通过做“工作”，你也在维护网络。你可以进一步研究以获得更清晰的认识。作为起点，请查阅
    `ASICs`（专用集成电路）。


    ## 盯紧目标——你的钱


    比特币的使用和挖掘非常简单。你可能以为可以堆砌大量机器像捡沙子一样收集比特币，但事实并非如此。发现的比特币越多，寻找它们就越困难。通过使用比特币或以太坊挖矿的在线盈利计算器，你将了解面临的挑战。总之，如果运行硬件的成本高于你从比特币中获得的利润，那么你很可能做错了什么。


    # 结论


    DeFi（去中心化金融）围绕着被称为 `DApps` 的应用程序展开，即去中心化应用。这些应用在被称为区块链的数字账本上执行金融功能，区块链技术最初由比特币采用，但此后已发展得比过去广泛得多。交易不再由中心化中介（如加密货币交易所）发起和处理，而是在人们之间直接进行，不过借助了智能合约程序。`DApps`
    通过 Web3 浏览器扩展或应用程序（如 `MetaMask`）访问，允许用户通过网站与以太坊区块链交互。此外，大多数 `DApps` 可以相互连接并协同工作，以创建详细的金融服务。例如，稳定币持有者可以将资产转入流动性池。其他人则通过提供额外抵押品（通常超过贷款金额）从该池中借款。随后，协议会根据对资产的实时需求自动调整利率。去中心化意味着没有中心化交易所。用于
    DeFi 策略的智能合约程序由开发者和程序员社区借助开源软件运行。DeFi 策略的一个例子是 `Uniswap`。这是一个运行在以太坊区块链上的去中心化交易所（`dex`），允许交易数百种在以太坊区块链上生成的各种数字代币。`Uniswap`
    不依赖中心化做市商来撮合订单，其算法通过为提供流动性的人产生交易费用，鼓励用户为代币创建流动性池。虽然用户完全控制 `Uniswap` 平台，但开发团队负责编写其部署软件。直接购买并非唯一被大公司控制的交易或合约类型；贷款、保险、衍生品、博彩、众筹等其他金融应用也掌握在他们手中。因此，消除所有这些交易类型中的中间商是
    DeFi 的主要目标之一。


    我们涵盖了加密货币耕作和 DeFi 产品等最新加密货币形式。这场先进的经济革命还能带来什么？基于这些现有组件，我们不知道未来会出现什么新应用。然而，不可靠的流动性协议和其他
    DeFi 产品正处于经济学、加密经济学和计算机科学的最前沿。DeFi 的货币市场无疑有助于创建一个更开放、更易访问的金融系统，任何拥有互联网连接的人都可以访问，这将弥合我们地球上的生活与依赖人类因素潜在实现火星生活之间的鸿沟。同时，我们通过地球证券的收益耕作产生被动收入。在未来的“股权持有者资本主义”系列丛书中，我们打算深入涵盖区块链的许多应用，包括智能合约、物联网、零售、农业和制造业。


