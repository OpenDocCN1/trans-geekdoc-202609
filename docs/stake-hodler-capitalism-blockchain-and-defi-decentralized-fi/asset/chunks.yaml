- raw: 'Chapter 4: Ethereum and DeFi  Let’s start by specifying that presently, most
    if not pretty much all of the DeFi projects are built on Ethereum. Ethereum is
    a decentralized blockchain that allows other decentralized blockchain applications
    (dApps) to be built on smart contracts, and some of these apps can have their
    exchangeable tokens. The compound is one of the protocols that primarily deal
    with decentralized financial services that save and lend cryptocurrency. The main
    reason for this is the fairly powerful Ethereum smart contract platforms that
    provide the robustness that allows you to write smart high-level contracts containing
    all the necessary logic for your DeFi application. Additionally, Ethereum has
    the most advanced ecosystem for all smart contract platforms. Thousands of developers
    create new applications every day, and the greatest value lies in smart contracts
    that create additional networking effects. One of the widely adopted programming
    languages for smart contracts on Ethereum Blockchain is called Solidity. Solidity
    allows the creation of advanced smart contracts containing all the necessary logic
    for the DeFi applications. Besides, Ethereum has the most developed system amongst
    smart contract platforms, with an increasing number of developers building and
    creating new applications every day and the most value locked in a smart contract,
    creating an additional network effect. This is perfect because Ethereum’s platform
    for smart contracts gives more room for flexibility, and it instantly performs  transactions
    if specific conditions are met. Ethereum smart contracts programming languages
    like Solidity are particularly created for developing and deploying such smart
    contracts. For example, if a user wants to send their money to a friend on a Thursday,
    only if the temperature skyrockets to 85 degrees Fahrenheit, according to weather.com.
    Another example would be changing your agricultural land rent prices based on
    corn futures (i.e., futures security) prices. Rules and clauses like this can
    be included in a smart contract. Lots of DeFi applications run on Ethereum with
    smart contracts at the center of them all. Popular DeFi Apps: Lending and borrowing
    MakerDAO MakerDAO was one of the primary projects to take the first step in the
    DeFi movement. MakerDAO was founded in 2015 and allowed consumers to produce DAI,
    the world’s first supported neutral currency and a leading decentralized stable
    coin. It also allows users to stake collateral to collect loans. DAI is a fixed
    coin that uses incentives to track prices in US dollars. DAI can also be used
    to save money on the MakerDAO platform. It can be used for loans which is one
    of the pillars of the financial system. DeFi is trying to create a whole new economic
    ecosystem that doesn’t require permission and is transparent. Borrowing and lending
    or staking is just part of this ecosystem. Other important features are fixed
    coins, decentralized exchanges, derivatives, margin trading, and insurance. DAI
    is a stable crypto coin that tries to maintain its worth near the US dollar value
    (USD) using an automated smart contract system built on the Ethereum platform.
    DAI is sustained and operates under  the governance structure of MakerDAO, which
    is a Dex Autonomous Organization (DAO) made up of MKR-controlled ticket holders
    who can vote on the alterations to specific parameters of smart contracts to keep
    DAI stable. The duo systems, DAI and MakerDAO, are regarded as the foremost and
    primary DeFi to gain massive attention and adoption. As of June 2020, Compound
    Finance started compensating lenders and borrowers on its platform with units
    of a new cryptocurrency referred to as COMP token in addition to the normal interest
    payments to lenders. This COMP token is used to control Compound’s platform but
    can also be traded on exchanges. Soon, other platforms followed the lead, thereby
    launching the prodigy known as ‘yield farming’ or ‘liquidity mining.’ COMP is
    a platform where observers shift cryptocurrency assets among different pools in
    a platform and among different platforms to increase their total yield, including
    interest and fees, but the value of additional tokens is collected prizes. DAI
    Overview DAI is based on overly secure security and redemption procedure enabled
    by MakerDAO smart contracts in the dApp form. Consumers who stake Ether (or any
    other crypto coins supported as collateral) may obtain a loan worth the deposited
    amount and get the freshly created DAI. Currently, Ether’s security ratio is set
    to 150%. This means that if you stake $150 worth of Ether, you can obtain a loan
    up to 100 DAI (approximately $100). If the collateral value falls below this percentage,
    the borrowed amount is routinely repaid through a smart contract. Conversely,
    if the cost increases, you can borrow extra DAI. As a result, the returned DAI
    are automatically extinguished upon loan repayment and interest accrual, making
    it possible to withdraw the collateral. Thus, DAI’s USD value is supported by
    the underlying collateral’s USD value held by the smart contracts of MakerDAO.
    Through the regulation of the supporting collateral, the terms of the collateral,
    and the borrowing or staking interest rate for MakerDAO’s DAI can regulate the
    amount of DAI in circulation, which equally influences its overall value. MKR
    token holders reserve the right to suggest and implement changes to these variables
    using the code. Governance token holders can vote on suggested changes, but the
    degree varies and depends on the number of tickets they hold. The MKR token is
    equally an investment tool in the MakerDAO platform. Along with the loan amount,
    the lender’s additional interest is utilized to purchase and burn or finally withdraw
    the MKR tokens from the market. This procedure is intended to create MKR deflation
    to the degree that corresponds to the loaned amount.  Let’s talk about each one
    of the categories one by one besides MakerDAO that we just mentioned. Stable-coin
    Stable-coin is a cryptocurrency designed to reduce fixed-priced Bitcoins’ volatility
    compared to “fixed” asset baskets or assets. Stable-coin can be linked to cryptocurrency,
    fiat currency, or commodities (e.g., precious or industrial metals). Soluble stables
    in currency, commodities, or fiat currency are known to be hedged, and the stables
    associated with the algorithm are called seigniorage (non-backed). Stable-coins
    are cryptocurrencies linked to an asset outside of the  cryptocurrency community,
    for instance, the dollar or euro. The main objective here is to stabilize the
    price. Backed Stable-coin The advantage of asset-based cryptocurrency is that
    coins are stabilized by assets that fluctuate outside the cryptocurrency space.
    Since Bitcoin and Altcoins are highly correlated, cryptocurrency holders cannot
    avoid significant price declines without leaving the market or seeking refuge
    in an asset-based Stable-coin. Additionally, if these coins are managed in good
    faith and have an asset redemption mechanism, they are unlikely to be lower than
    the underlying physical asset’s value due to arbitration. Parallel stabilization
    is subject to the same volatility and risk as to the underlying asset. If fixed
    coins are protected in a decentralized way, they are relatively immune to predation,
    but having a central archive can lead to theft or trust loss.  Commodity Asset-backed
    Stable-coin’s main backup features: • One or more items are worth and can be exchanged
    as needed (more or less). • You have a promise to pay from an unregulated person,
    an open company, or a regulated financial institution. • The number of goods used
    to maintain a fixed mooring must reflect the fixed supply’s circulating supply.
    Owners of commodities backed by fixed commodities can take over real assets by
    redeeming their shares at a conversion rate. The cost of maintaining Stable-coins
    stability is the cost of storing and protecting the underlying raw material. Take
    Digix Gold Tokens  (DGX) and others as an example. Fiat-backed The value of this
    type of Stable-coin is based on the value of supported currencies in the hands
    of regulated third-party financial institutions. Confidence in the availability
    of treatment in this situation is very important to the stability of the price.
    Fiat-backed inserts can be traded on the stock exchange and redeemed from the
    issuer. Other key factors in Stable-coins stability are the cost of maintaining
    reserves and legal compliance, licensing required by regulators, and maintaining
    the auditors and business infrastructure. Cryptocurrencies supported by fiat currencies
    are the most common and were the first types of fixed coins to be released on
    the market. Features of fiat-backed cryptocurrencies: • Its value is fixed in
    one or more currencies (usually US dollars, euros, and Swiss francs) at a fixed
    rate. • Communication takes place offline through banks or other regulated financial
    institutions that act as a repository of currencies used to support Stable-coins.
    • The amount of currency used to support Stable-coin must be equal to the Stable-coin
    in circulation. With Cryptocurrency Cryptocurrency-based Stable-coins accept cryptocurrency
    as security and is conceptually similar to fiat-based Stable-coin. However, a
    key difference between the two interpretations is that while fiat collateral generally
    occurs outside the chain, the  cryptocurrency used to support this type of Stable-coin
    blockchain is created using smart contracts decentralized approach. In most cases,
    it is more profitable to pay off the debt when the fixed value drops by blocking
    collateral so that consumers can borrow on smart transactions. To avoid sudden
    interruptions, you can cancel a consumer’s loan with a smart contract if the collateral
    gets too close to the withdrawal amount. The main features of Bitcoin backed cryptocurrency
    are: • Bitcoin’s fixed value is provided by another cryptocurrency or cryptocurrency
    portfolio. • Binding is done on the chain through smart contracts. • Fixed Bitcoin
    distribution is regulated within the chain through smart contracts. • Achieve
    price stability by introducing additional means and incentives as well as collateral.
    This type of filing coin’s technical implementation is more complex and versatile
    than fiat-based filing lines, increasing the risk of exploitation due to the smart
    contract code’s errors (bugs). Because modems operate in chains, they are not
    subject to third-party regulations that create decentralized solutions. A potentially
    problematic aspect of this type of Stable-coin is the change in underlying security
    value and hosting platforms. The complexity and indirect support of fixed coins
    can limit their use because it can be difficult to understand how the price is
    offered. Due to the highly volatile and highly convergent nature of the cryptocurrency
    market, very large collateral must also be maintained to ensure stability.  Decentralized
    Exchange DEX (Decentralized Exchange) is one type of cryptocurrency  exchange
    that enables direct peer-to-peer transactions with cryptocurrencies online, securely,
    and without intermediaries. In transactions made through decentralized exchanges,
    the blockchain is usually replaced by the usual third-party organizations that
    monitor decentralized general ledgers’ security and asset transfers (e.g., banks,
    securities brokers, online payment portals, authorities, etc.). Common work methods
    include using smart contracts or resubmitting orders, but many other options are
    possible and varying degrees of decentralization. With the aid of online exchanges,
    users can exchange currencies for other currencies, be it in U.S. dollars for
    either Bitcoin or DAI. DEXs are the classy and hot exchanges that connect the
    users directly to ensure a promising trade on cryptocurrencies without dependence
    on an intermediary to work on their money. Decentralized exchanges reduce the
    risk of stealing from hacked exchanges as consumers do not need to transfer their
    assets to the exchange. Advanced exchanges can also prevent price manipulation
    or counterfeit trading volumes through flushing and are more anonymous than active
    customer recognition. Know your customer (KYC) exchanges. There are signs that
    decentralized exchanges are suffering from low trading volumes and market liquidity.
    Project 0x, a protocol for creating decentralized exchanges with funky liquidity,
    is trying to solve this problem.  Disadvantages Since there is no Know your customer
    (KYC) process and the transaction is irreversible, you will lose users if they
    are hacked and  their passwords or private keys are obtained. Although liquidity
    fund DEX is the most widely used, it may have some drawbacks. The most common
    problems with DEX liquidity funds are price cuts and performance gains. The decline
    in prices is due to the nature of Automated Market Makers (AMM). The larger the
    transaction, the more it affects the price. For example, if you use a consistent
    AMM product, all transactions must keep product XY = k constant where x and y
    are the number of two cryptocurrencies (or tokens) in the pool. The larger the
    input size Δx, the lower the final y/x ratio, giving the exchange price. This
    issue is usually important for large companies or small liquidity pools. A frontal
    launch is a special form of public block attack where participants (usually miners)
    proceed with their transactions (e.g., play with transaction fees) when they see
    an impending transaction, making the initial transaction less profitable. Ideas
    for improving the tensile strength of permanent AMM products were first discussed
    in a post by Vitalik Buterin. One possible solution is to allow transactions that
    do not complete immediately but last for some time (e.g., 5 minutes), in which
    case the liquidity is gradually transferred to the pool without the highest price.
    This eliminates the problem of continuing travel because frontline workers cannot
    benefit from long work. It also helps prevent price slippage, as mediators and
    other traders can act in parallel, interfering with counter traders. Degrees of
    Decentralization Decentralized exchanges may still have a central component, which  means
    that some control over the exchange remains in central institutions’ hands. A
    good example is that IDEX prevents New York State users from placing orders on
    the platform. In July 2018, it was reported that Bancor’s decentralized stock
    exchange was hacked, causing $13.5 million in asset loss before funds were frozen.
    Advanced exchange operators can obtain legal consequences from state supervisory
    authorities. An example is the founder of EtherDelta, who paid a fee with the
    US in November 2018. The Securities and Exchange Commission operates a privately
    held stock exchange. Compound There are a few other important DeFi products in
    this category. The main one is compound. Compound at the time of writing is the
    biggest DeFi project in the lending category, with around six hundred and thirty
    million dollars worth of assets locked in the protocol. The compound is an algorithmic
    autonomous interest rate protocol that allows users to supply assets like Ethereum
    or Tether and start making interest. Supplied assets can also act as collateral
    to enable their owners to borrow other assets. User-to-user lending and borrowing
    policies are some of the most vastly used applications in the DeFi ecosystem.
    For instance, Compound utilizes an algorithm with autonomous interest rate protocol
    which combines with and underlies a long list of DeFi platforms such as PoolTogether,
    Dharma, and Argent. By providing interest rate markets on Ethereum, Compound permits
    users to gain interest in crypto, which they have been supplied with to the lending
    pool. The Compound smart contracts automatically fit  the borrowers and lenders,
    then calculate the interest rate based on the percentage of borrowed assets to
    supply investments. The compound is a clear example of the exponential opportunity
    of the DeFi domain. The more products are merged to the Compound policies, the
    more crypto investments will gain interest even when inactive. The compound provides
    loans for certain cryptocurrencies such as Housing (DAI), Ether (ETH), USD Coin
    (USDC), Ox (ZRX), Tether (USDT), Wrapped BTC (WBTC), and Basic Featured Token
    (ATM), Augur (REP), and Sai (SAI). Any cryptocurrency owner or hodler can lend
    and borrow cryptocurrency directly without wasting time, effort, and money spent
    communicating with traditional financial intermediaries. If you own the cryptocurrencies
    mentioned above, you can send, block, deposit, and borrow. They all mean the desired
    amount for the compound protocol. Locking cryptocurrency with Compound is the
    same as putting money in a savings account, but it uses a blockchain-based decentralized
    protocol. Instead of depositing money in the bank, they send cryptocurrencies
    to wallets. You start earning interest in cryptocurrency instantly, just like
    you’re lending to a bank. The rate of return is indicated by the same symbol as
    borrowed. In other words, sending BAT earns interest on BAT, and sending DAI earns
    DAI. The cryptocurrency you send is added to a huge fund from the same sign of
    The Compound Protocol’s smart contracts sent by thousands of others worldwide.
    On the other side of the equation is the loan. Blocking cryptocurrency in Compound
    allows you to get a loan on it. Some platforms do not require credit checks, so
    anyone in the world with  cryptocurrency can apply for loans and get instant approval
    when the applicant meets certain conditions.  The compound is the quality of the
    assets that determine the amount you can borrow according to. For example, if
    you convert $500 worth of Bitcoin to 1,000 COMPS and Compound has set Bitcoin’s
    loan limit (also known as a security factor) to 50%, you can lend $250 to other
    cryptocurrencies supported by the Compound protocol (see list top). Like when
    you borrow money from a bank, you have to pay interest on the money you borrow.
    So we have deposits and loans, and both have to do with interest rates. When you
    stake, you earn interest. You pay interest on a loan you borrow. Let’s talk about
    how these rates are automatically calculated and applied using a well-crafted
    system that is beautifully architected. Whether you are borrowing or doing business,
    you must first exchange the cryptocurrency with Compound. This way, you will receive
    a complex token(s) (cTokens) representing your cryptocurrency balance in return.
    That token and many other tokens are created on Ethereum’s blockchain as an ERC-20.
    ERC-20 tokens are one of the biggest advantages and innovations in the blockchain-based
    cryptocurrency market. When earning (or paying) interest, it can be transferred,
    sold, or programmed to other Dapps in the DeFi ecosystem just like any other Ethereum
    token. Treat these tokens as if they were managing digital assets on the Ethereum
    blockchain with public and private keys. Interest rates depend on how much cryptocurrency
    (or liquidity) is available in each market and in real-time with supply and demand
    to  reflect current market conditions. The interest rates displayed are listed
    as annual interest rates and are charged each time an Ethereum block is broken.
    Every 15 seconds, cToken’s value increases by 1/2102400 (15-second blocks per
    year) from the annual percentage quoted by Cryptopedia (n.d) at the time.  Another
    popular DeFi project is AAVE. Use smart contracts and specific incentives wisely.
    We can create Stable-coins linked to US dollars without having to store dollars
    in the real world. There are many other non-algorithmic dummy coins such as USDT,
    USDC, or PAC. The biggest problem is that they are centralized because they’re
    backed by a company responsible for storing underlying equivalent assets being
    U.S. dollars or other assets. However, Stable-coins have gained popularity and
    are often used as a compound or other in DeFi applications. Unlike central cryptocurrencies,
    decentralized exchanges or Dex allow cryptocurrencies to be exchanged in a completely
    decentralized and unauthorized manner without preventing coin storage. Examples
    of liquidity pools decentralized exchanges are Uniswap, Khyber, Balancer, and
    Bancor. Links and Idex are examples of book ordering systems. Derivatives Like
    traditional finance, derivatives are contracts whose value is determined by the
    return on the underlying asset. DeFi’s main application in this space is Synthetixs,
    a decentralized platform that provides access to various assets on the chain.
    Derivatives are products whose value is determined by the value of one or more
    variables called the base (the underlying asset). This base entity can be an asset,
    an index, or an interest rate and is often referred to only  as “baseline.” Derivatives
    can be used for various purposes, including insurance (hedge) against price movements,
    increased exposure to price movements to speculation, or access to difficult-to-trade
    assets or markets. Ethereum-based smart contracts help create tokenized derivatives
    whose value is obtained from an underlying investment’s success, through which
    partners’ agreements are hardwired in code. DeFi derivatives can also indicate
    real-world investments like flat currencies, bonds, commodities, and even cryptocurrencies.
    The most common financial derivatives include futures, options, swaps, and conversions
    such as synthetic collateral and credit swaps. Most derivatives are traded on
    OTC exchanges or exchanges such as the Chicago Mercantile Exchange, while most
    insurance contracts are developed as a separate industry. Derivatives are first
    on the list of main components of financial instruments; the other two are equities
    and liabilities (i.e., bonds and mortgages). Derivatives are contractual agreements
    between two or more parties that Define the terms to be paid between the parties
    (especially the date, amount, and Definition of the underlying variables, the
    parties’ contractual obligations, and fictitious amounts).  Assets include stocks,
    commodities, bonds, interest rates, and currencies, but they can also be other
    derivatives, providing another tier that complicates accurate valuations. Margin
    Trading While margin traders in conventional finance can influence their trades
    by borrowing funds from a broker – that forms the collateral for a loan, DeFi
    margin trading, on the other hand, is powered by decentralized, non-custodial
    lending policies like Compound, Fulcrum, and dYdX. Due to conventional brokerage’s
    smart contract automation, some have started to shift to the increasingly autonomous
    money markets’ in the DeFi ecosystem. Insurance Insurance is another part of traditional
    finance that can be reproduced in decentralized finance. It provides a guarantee
    of compensation for payment of insurance premiums. One of the most widely used
    insurance applications in the DeFi space is for instances of smart contract error
    and deposit protection. The most popular DeFi projects in this area are Nexus,
    Mutual, and Opyn. DeFi is still an upcoming domain with attendant risks surrounding
    smart contract bugs and breeches. Some creative insurance alternatives have come
    to the market to assist users with purchasing coverage to protect their holdings.
    Nexus Mutual is one of the solutions provided. It gives a Smart Contract Cover
    which safeguards against unintentional uses of the smart contract code. Another
    very important but not very limited financial part of the DeFi ecosystem is Oracle’s
    services focused on delivering stable data streams outside of smart contracts.
    The most popular project in this area is chain link. These are found in almost
    every major part of the DeFi ecosystem. It can also be combined in several ways.
