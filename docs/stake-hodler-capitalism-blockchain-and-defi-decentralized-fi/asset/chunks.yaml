    # 优点


    - 通过消除人工参与验证，提高了正确性。

    - 通过消除中介验证，降低了成本。

    - 去中心化使其难以被篡改，并确保了 100% 的正常运行时间。

    - 交易安全、私密且高效。

    - 技术透明。

    - 为民主体制不稳定或被低估国家的公民提供了银行选择和保护私人信息的方式。


    # 缺点


    - 挖矿带来的巨大能源消耗和污染。

    - 与 VISA 及其他系统相比，TPS（每秒交易数）较低。

    - 基于区块链的加密货币被用于非法活动的历史悠久。

    - 缺乏法规和正式的监管机构。


    # 区块链优势


    ## 链的准确性


    由数千台计算机（节点）组成的网络验证该网络上的所有交易。这消除了验证过程中几乎所有人工参与，从而减少了人为错误并确保了信息记录的准确性。如果网络中的一台计算机出现录入错误，该错误仅会反映在区块链的一个副本上。在该错误扩散到其余区块链之前，它需要由网络中至少
    51% 的计算机（即大多数）犯下——对于像比特币这样庞大且不断增长的网络来说，这几乎是不可能的。


    ## 高效的交易结算时间


    通过中心化机构处理的交易可能需要几天才能结算。例如，如果您尝试在周五晚上存入支票，资金可能要等到周一早上才会反映在您的账户中。虽然金融机构在工作时间运营——每周五天，但区块链全年无休，每天
    24 小时运行。交易最快可在十分钟内完成，仅需几小时即可视为安全。


    ## 私密交易


    许多区块链网络作为公共数据库运行；这意味着任何拥有强互联网连接的人都可以查看网络的交易历史记录列表。虽然用户可以查看交易的详细信息，但他们无法确定进行这些交易的用户的身份信息。人们普遍认为比特币等区块链网络是匿名、保密且安全的。这意味着当用户进行公开交易时，记录在区块链上的是他们独一无二的代码——称为[公钥](https://www.investopedia.com/terms/p/public-key.asp)，而不是他们的个人信息。如果一个人在需要身份验证的交易所购买了比特币，那么该人的身份仍与其区块链地址相关联，但即使交易与某人的名字挂钩，也不会暴露任何个人信息。


    # 区块链的劣势


    尽管区块链有重大收益，但采用它也面临重大挑战。区块链应用的困难或障碍不仅仅是技术细节。真正的挑战主要是政治和监管方面的，更不用说将区块链整合到现有业务网络中所需的数千小时定制软件设计和隐形编程工作。以下是其中一些挑战：


    ## 技术成本


    虽然区块链的存在为用户节省了交易费用，但该技术并非完全免费。比特币用于验证交易的“工作量证明”算法和系统消耗了巨大的计算能力。在现实世界中，比特币网络上数百万台计算机的能耗几乎等同于丹麦每年的消耗量。尽管挖掘比特币成本高昂，用户仍不断增加电费账单以在区块链上批准交易。当矿工向比特币区块链添加一个区块时，他们会获得足够的比特币奖励，使其投入的时间和精力得到回报。对于不使用加密货币的区块链，矿工需要获得报酬或其他激励来验证交易。针对这些问题的某些解决方案开始出现。例如，比特币挖矿场已建立起来，利用太阳能、压裂场所的多余天然气或风力发电场的电力。随着我们接近挖完所有
    2100 万枚比特币，区块奖励减半，这将有助于应对收益下降的问题。


    ## 速度低效


    比特币是区块链潜在低效性的最佳例证。比特币的 PoW（工作量证明）系统添加一个新区块链区块大约需要十分钟。按这个速度，据估计区块链网络每秒只能处理约七笔交易（TPS）。虽然以太坊等其他加密货币表现优于比特币，但它们仍受限于区块链。作为背景参考，传统
    Visa 系统每秒可处理多达 24,000 笔交易。针对这一问题的解决方案已开发多年。目前，一些区块链声称每秒可处理超过 30,000 笔交易。


    ## 非法活动


    在区块链网络上，用户免受黑客攻击并保护隐私。然而，这也为区块链网络上的非法交易和活动提供了机会。区块链被用于非法交易的最常被引用的例子可能是[丝绸之路](https://www.investopedia.com/terms/s/silk-road.asp)，一个从
    2011 年 2 月运营到 2013 年 10 月被 FBI 关闭的在线“暗网”毒品市场。


