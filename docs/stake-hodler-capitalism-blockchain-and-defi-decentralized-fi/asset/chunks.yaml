    2008 年 10 月 31 日以来，区块链在我们的生活中掀起了不小的变革，这一天是比特币创造者中本聪发表了题为《比特币：一种点对点的电子现金系统》的论文。尽管如此，比特币也直接影响了我的生活。2017
    年，当我产生研究区块链相关生态项目的想法时，我开始深入钻研区块链；那也是我爱上区块链和 DeFi 的时刻。在《质押持有者资本主义》书系中，我们将深入探讨为什么我和许多其他人会对区块链、加密货币和去中心化金融着迷到近乎痴迷的地步。


    # 第 1 章：DeFi 应用：区块链中的终极杀手级应用


    无论你是否听说过 DeFi（去中心化金融）的炒作，它已经开始直接成为我们日常生活的一部分。在本章中，我们将把 DeFi 的组成部分拆解为更小、更易消化吸收的子部分。


    ## 什么是 DeFi？


    DeFi 或去中心化金融，是由不同研究人员发起的一场运动，旨在创建一个全新的开源金融系统，任何人都可以在不需要受信任的中介机构或中央权威机构（如银行、经纪公司或交易所）的情况下访问。加密货币以运行在区块链或公共账本技术上而闻名，这些技术专门作为其骨干实现；由加密货币形成的这些较小生态系统各自提供的优势是难以想象的。比特币（尽管许多人目前将其视为类似黄金的价值存储）仍然是第一个、最知名且最好的例子。支付可以通过比特币网络进行，即一个由去中心化的独立节点组成的网络来确认交易。为实现这一点，DeFi
    在很大程度上依赖密码学、区块链和智能合约。在被称为去中心化金融之前，这一整个概念被称为“开放金融”。智能合约是 DeFi 的主要构建模块。在 DeFi 平台上，大多数人被允许向他人借贷资金、使用衍生品对少数资产的价格变动进行投机、交易加密货币、规避风险，并通过类储蓄账户赚取利息。DeFi
    应用提供较高的风险回报比，但参与其中一些项目本身就可能是高风险的。筛选出最优质的项目是一个繁琐的过程，但理解基本面将帮助你为区块链和 DeFi 做出最佳投资决策。加密货币的运作方式与我们拥有的传统银行系统相似。在支付方面，我们可以用区块链实现相同的结果。区块链相对于传统银行系统的杀手级优势在于其不可篡改和去中心化的特性。去中心化能给你提供
    100% 的正常运行时间，而这是当今传统支付系统无法做到的。区块链的不可篡改性保证了欺诈的消除。比特币（尽管现在许多人将其视为类似黄金的价值存储）仍然是第一个也是最好的例子。爱丽丝可以用比特币支付给鲍勃，而无需依赖银行等金融中介机构。相反，支付可以通过比特币网络进行，即一个由去中心化的独立节点组成的网络来确认交易。回顾一下，为了实现这一切，DeFi
    在很大程度上依赖密码学、区块链和智能合约。如果你不知道什么是智能合约或它是如何简单运作的，不用担心。我们将在本书第 3 章介绍智能合约。如果你想更深入地了解智能合约，可以查阅本系列丛书第
    2 部分：《质押持有者资本主义：智能合约与 DApps》。


    ## 密码学


    加密被认为是密码学的核心组成部分。更广泛地说，加密是创建和分析一种协议，防止第三方或公众读取或访问通过通信媒介存储或传输的数据。加密定义的可读格式是一个黑盒：你输入一段数据并使用密钥对其进行编码，这个过程无法逆转，除非拥有两方或多方可共享的唯一密钥。现代加密的核心是信息安全的各个方面，如数据机密性、完整性、真实性和不可抵赖性。现代密码学处于数学、计算机科学、电子工程、通信学和物理学的交叉点。密码学应用包括电子商务、芯片借记卡、数字货币、计算机密码学和军事通信。在现代之前，密码学几乎等同于将可读知识转换为不可读废话的密码学。加密消息发送者仅为其预期接收者使用解码器，使攻击者无法访问。在密码学文献中，通常使用爱丽丝（“A”）代表发送者，鲍勃（“B”）代表预期接收者，伊夫（“Block”，通常指窃听者
    Eve）代表攻击者。自第一次世界大战期间转轮加密机的发展和第二次世界大战期间计算机的出现以来，加密技术变得更加复杂，其应用也更加多样化。现代密码学主要基于数学理论和计算机科学实践。密码学算法基于计算机安全假设设计，使攻击者难以利用此类算法。理论上无法攻破设计良好的此类系统，但在实践中，量子计算机有可能做到，但这超出了本书范围。目前，让我们把密码学的使用视为存储和传递数据最安全的方式。因此，如果设计良好，这些电路被称为“数据保险箱”。由于整数分解算法改进和更快计算技术等理论进步，这些设计必须不断审查并在必要时修正。虽然理论上即使拥有无限计算能力也无法破解安全电路（如一次性密码本），但这些电路在理论上是最难破解的，但在实践中比安全电路计算机难用得多。加密技术的进步在信息时代引发了许多法律和隐私问题。由于密码学有可能被用于间谍活动、非法活动和其他伪造应用，许多政府将其归类为武器，并限制甚至禁止其使用和出口。例如，Skype
    使用 AES（高级加密标准）加密算法的专有自定义实现。如果你不知道 AES 的含义，重要的是要理解密码学正是在这个信息时代保障我们隐私和安全的东西。一些允许使用加密的司法管辖区可能要求立法者披露与调查相关文件的加密密钥。加密在数字版权管理和数字媒体版权侵权纠纷中也发挥着重要作用。情报和执法机构长期以来对加密感兴趣。机密通信可能是犯罪或欺诈行为。因此，加密有着冲突的法律问题历史，特别是随着低成本计算机的出现，使高质量加密更广泛可用。在一些国家，甚至内部使用加密也受到限制。直到
    1999 年，法国严格限制其境内的密码学，但后来废除了许多规定。中国和伊朗仍要求加密许可证。许多国家对加密的使用有严格限制，特别是在创建通信渠道方面。虽然在美国家庭使用加密是合法的，但围绕加密的法律问题冲突很多。最重要的问题之一是加密软件和工具的出口。也许是因为二战期间密码学的重要性，以及预期密码学将继续对国家安全至关重要。二战后，在美国向国外销售或分发加密技术是非法的。加密被指定为额外的军事装备并列入美国军用物资清单。在个人电脑、非对称密钥算法（如公钥方法）和互联网出现之前，这不是大问题。然而，随着互联网的增长和联网及计算设备变得更容易获得，高质量的加密方法已在全球范围内为人所知。


    # 第 2 章：区块链


    区块链是一种特殊的数据库。在存储信息方面，它与典型数据库不同。区块链以相互链接的区块形式存储数据。它将信息收集成组（也称为区块），这些组包含信息集合。区块有一定的存储容量，填满后，它们会绑定到先前填满的区块上，形成一个称为“区块链”的数据链。新添加区块之后的所有新信息被收集到新形成的区块中，填满后添加到链上，这一过程无限持续。区块链在其正式定义中看起来很复杂，但让我们将概念分解为简单的可读语言。区块链是一串相互连接的小环节。每个环节包含信息，无论是双方确认的交易还是其他数据（如智能合约、视频、音乐或任何其他形式的数据）。要理解区块链，首先需要了解什么是数据库。数据库是电子存储在计算机系统上的信息集合。数据库中的信息或数据通常以表格格式组织，以便轻松查找和筛选特定信息。使用电子表格而不是数据库来存储信息有什么区别？电子表格是为少量用户或群体设计的，他们可以存储和访问有限量的信息。然而，数据库旨在存储更多信息，这些信息可以被许多用户同时快速、轻松地访问、筛选和操作。大型数据库通过在强大的计算机服务器上托管数据来实现这一点。有时，这些服务器可以由数百或数千台计算机构建，以提供多用户同时访问数据库所需的处理能力和内存，并以最高效的所需访问时间进行。虽然许多人可以访问电子表格或数据库，但它们通常由指定人员拥有，这些人员对其工作及其中的工作拥有完全控制权。当新数据进入区块链时，它会被插入一个新区块。当一个区块填满数据时，它会被固定到前一个区块，数据按时间顺序链接。可以在区块链上存储不同类型的数据，但最常见的用途是比特币和其他加密货币中的交易账本。说到比特币，区块链以去中心化方式使用，因此没有个人或团体拥有控制权，而是所有用户共同维护控制。去中心化区块链防篡改；因此，这意味着记录的信息是不可逆的。对于比特币，这意味着每个人都在持续直观地记录交易。大多数人未能理解的关键方面是：这些区块是如何被追加到区块链上的。答案是通过挖矿。用最简单的话说，挖矿是在区块被追加到区块链之前验证其合法性。该过程由自愿选择（在比特币的情况下）执行此操作的参与节点完成，作为回报，它们获得区块奖励。我们将在第
    6 章详细介绍挖矿。现在我们已经理清了概念定义，你可能会问，但区块链与数据库的区别是什么？以下是一些不同之处：


    ## 存储结构


    常规数据库与区块链的一个显著区别在于数据的结构方式。区块链将数据或信息编译成组，也称为区块，这些区块携带信息集合。区块具有特定的存储能力，填满后，会绑定到先前填满的区块上，进而建立一个称为“区块链”的数据链。所有这些新添加区块之后的新信息被存储到新形成的区块中，一旦填满也会被添加到链上。虽然数据库将其数据结构化为表格，但区块链顾名思义将其数据结构化为区块，随后链接在一起。因此，所有区块链都可以称为数据库，但并非所有数据库都可称为区块链。当在去中心化性质下强制执行时，该系统也自然地形成了一个不可逆的数据时间线。区块一旦填满，就被固定下来，并自动成为该时间线的一部分。链中的每个区块在成为链的一部分时都会被提供一个精确的时间戳。


    ## 去中心化


    与数据库一样，比特币需要一组计算机来存储其区块链。对于比特币，区块链只是一种数据库类型，它以一系列相互链接的区块存储了所有曾经存在的比特币交易。在比特币的案例中，不同于大多数数据库，这些计算机并不都位于同一屋檐下，每台计算机或计算机集群由不同的个人或群体运营。假设一家公司拥有约
    10,000 台计算机的服务器，其数据库存储了所有客户的账户信息。这家公司拥有包含所有这些计算机的仓库，并完全控制和访问每台计算机及其包含的所有信息。同样，比特币由数千台计算机组成；然而，单个计算机或计算机池存放其区块链。这些计算机位于不同的地理位置，并由不同的人或群体运行。比特币网络中的这些计算机被称为节点。在此标准下，比特币的区块链以去中心化方式使用。然而，私有和中心化区块链中，组成其网络的计算机由单一实体拥有和控制。这些私有区块链可根据您的业务需求实施，在为您提供区块链优势的同时，将数据暴露给公众的风险降至最低。提供私有区块链解决方案的平台示例包括
    IBM Blockchain、Azure Blockchain 和 AWS（亚马逊云服务）区块链解决方案。在区块链中，每个节点都拥有区块链自诞生以来的完整数据历史。对于比特币，数据是所有比特币交易的完整历史。如果某个节点的数据有误，它可以利用其他数千个节点作为参考来纠正自己。这样，网络中的单个节点将无法更改其中保存的任何信息。因此，涵盖比特币区块链的每个区块中的交易历史是不可更改的。如果一个用户干扰比特币的交易记录，所有剩余节点将轻松交叉引用并指出信息不正确的节点。该系统有助于建立准确透明的事件顺序。对于比特币，此信息类似于交易清单；然而，区块链也可能存储不同的法律合同、州身份或公司的产品库存。去中心化网络的部分计算能力需要就所述变更达成一致，才能改变系统运作方式或所存储的信息。这确保了发生的任何变更都符合大多数（如果不是全部）人的最大利益。


    ## 透明性


    由于比特币区块链的去中心化性质，所有交易都可以透明地看到，无论是拥有个人节点还是使用区块链浏览器，后者允许任何人实时查看交易。每个节点都有其独特的链副本，随着新区块被验证添加而刷新。因此，如果你愿意，你有能力追踪比特币去向何方。例如，过去被黑客攻击的加密货币交易所，以及持有比特币的用户失去了一切。虽然黑客可能未知，但他们带走的比特币可以轻松追踪。因此，如果这些黑客攻击中被盗的比特币被转移或花费在别处，原所有者将能够追踪它们。还有一个称为“标记币”的概念，这类似于通过某种颜色标记从银行被盗的钱。


    ## 区块链有多安全？


    区块链技术从不同角度考虑安全性和信任问题。首先，最近的区块始终按直线顺序存放。它们总是被添加到区块链的“末端”。如果你仔细观察比特币的区块链，你会注意到每个区块在链上都有一个位置，这被称为“高度”。此外，区块高度目前已达到约
    656,197 个区块。一旦一个区块被包含在区块链末端，要想反转并更改该区块的内容就变得非常困难，除非大多数用户同意进行该操作。这是因为每个区块都由其哈希值组成，看起来像这样


