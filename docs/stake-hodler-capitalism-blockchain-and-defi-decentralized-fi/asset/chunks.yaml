    Note: When using InstaDapp’s strategy, it can be thrown if the security is below
    the threshold. The recommended ratio when using this strategy is 60%. MakerDAO
    Maker is a decentralized lending platform that supports the creation of DAI, a
    Stable-coin that is algorithmically linked to the value of the US dollar. Users
