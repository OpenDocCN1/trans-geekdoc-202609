    # # How to Make 5G Communications “Invisible":

    Adversarial Machine Learning for Wireless Privacy


    Brian Kim¹, Yalin E. Sagduyer², Kemal Davlioglu², Tugba Erpek², and Sennur Ulukus¹


    *Department of Electrical and Computer Engineering, University College Park, MD
    20742, USA

    ²Intelligent Automation, Inc., Rockville, MD 20855, USA


    **Abstract—**We consider the problem of hiding communications from an eavesdropper
    that uses a deep learning (DL) classifier to detect whether any transmission is
    present or not. We show that transmitters can fool error to the receiver of an
    eavesdropper, while covert jamming can introduce adversarial perturbations to
    the received signal as noise. We show that this adversarial perturbation causes
    the eavesdropper to misclassify signals as noise with high probability and we
    further show that any 5G communications can be effectively hidden from an eavesdropper
    if it uses a DL classifier to detect transmissions.


    this paper covers the covert communications from an adversarial machine learning
    (AML) point of view. AML studies the problem of machine learning (ML) in the presence
    of adversaries that may attempt to manipulate or training processes of ML algorithms
    [7–9]. In computer vision, where the origin of AML has been a growing interest
    in applying AML to wireless communications, including exploratory (inference),
    causal (poisoning), evasion, and spoofing attacks [10–16].


    # ### I. INTRODUCTION


    Information privacy is a fundamental problem in wireless communications due to
    the open and shared nature of wire medium. A covert communication consists of
    a transmitter-receiver pair that aims to hide communications from the transmitter
    to the receiver. The receiver must determine whether there is any transmission
    or not. Information privacy preventing unauthorized decoding has been extensively
    studied from both security and information-theoretical studies [1], [2]. In this
    paper, we consider an eavesdropper that pursues the second objective, namely detecting
    an ongoing transmission. When a transmission is detected, others such as jamming
    can be used to block the communication.


    Covert communication has been studied in terms of hiding information where the
    main goal has to reduce the signal-to-noise ratio (SNR) of the adversary [3],
    [4]. A foundational bound has been established for the total transmit power over
    a given number of channels while keeping communications covert, known generally
    as the square-root law [5]; see also for related work.


    We consider an eavesdropper with a deep learning (DL) classifier that has inaccuracy
    in detecting received signals from noise. We introduce a cooperative jammer (CJ)
    that has been extensively used in physical layer security [17–19]. In this paper,
    the CJ transmits the error at the same time as the transmitter with the purpose
    of misclassifying the eavesdropper’s classifier. This is considered covert jamming
    to prevent an eavesdropper from distinguishing an ongoing transmission from noise.


    We use the CJ as the source of adversarial perturbation to fool the eavesdropper’s
    classifier. A large perturbation added by the CJ can easily fool the classifier,
    while also increase the interference and the bit error rate (RATE) at the intended
    receiver to undesirable levels. Under the approach of setting being considered
    in [27], where the transmitter adds perturbations to its signal to fool a machine
    classifier while maintaining its performance, our focus is on covert communications
    assisted by a CJ, who positions the front impact on the eavesdropper to classify
    received signal as noise while reducing the network performance. It is much more
    challenging to fool a classifier into misclassifying a signal as noise (as considered
    in this type) of inserting such jamming attacks (as considered in [27]). For our
    evaluation, we use various modulation schemes (QPSK and QAM) and show that we
    could effectively hide these signals from an eavesdropper that and uses a DL classifier
    to detect transmissions.


    This is supported by the U.S. Army Research Office under contract W911NF-C-0090.
    The content of the information does not necessarily reflect the position or policy
    of the U.S. Government, and no official endorsement should be intended.


    978-3-7816-3126-9/20/$19.00 ©2020 IEEE

    763

    ilaromar 2020'
