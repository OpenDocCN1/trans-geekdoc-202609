    # ## Reliability of Communications


    The BER for 5G communications is shown in Fig. 7. When $d_{cc} = 1$ dB and $N
    = 5$, the Gaussian noise-based perturbation has better performance compared to
    the proposed perturbation and a similar result is also observed for other SNR
    values. The proposed perturbation by the CJ not only increases the success of
    correctness, but also has effect on the BER performance of the receiver compared
    to the Gaussian noise-based perturbation for 5G communications. We further observe
    that the noise-based perturbation performs better than the proposed adversarial
    perturbation when $d_{cc}=0.5$ dB, $d_{a}=1.5$ dB.


    # ## CONCLUSION


    We considered a communication system in which 5G devices use their CJ signature
    to generate a label for the eavesdropper to classify the ongoing transactions
    as noise. Following the AML approach, CJ was designed to generate the perturbation
    with the FGM method to combat channel effects. For both modified signals and spoofed
    5G, we showed that the CJ can generate a perturbation that causes misclassification
    by the eavesdropper (from signal to noise) with high success, while the BER at
    the receiver is only slightly affected. On the other hand, CJ with Gaussian noise
    is not successful in fooling the classifier. These results demonstrate the feasibility
    of using CJ as an evasion attack against a DL classifier by an adversary.


