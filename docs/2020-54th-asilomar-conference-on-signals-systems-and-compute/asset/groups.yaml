    end\n$\\theta \\leftarrow \\theta - \\gamma \\delta_{\\theta}$\n```\n\n![](img/1c9877e90b513c63096e0d8f3f8eceab_2_0.png)\n\
    \n图. 2. 当 $d_{ce}=d_{cr} = 1$ 时窃听者的成功率。\n\nCJ 传输的高斯噪声。此外，我们改变 CJ 的位置以研究拓扑和通道的影响。我们假设二进制数据在接收端均匀且独立地生成。分类器是一个卷积神经网络（CNN）。该\
    \ CNN 在两个维度 (2,16) 上处理 16 相/Q I/O 数据样本。CNN 包含一个卷积核大小为 (1,3) 的卷积层，丢弃率为 0.1。隐藏层使用激活函数，输出层使用\
    \ softmax 激活以产生信号标签。我们使用带有 Adam 优化器的反向传播算法通过交叉熵损失训练 CNN。据此实现了 CJ。我们假设窃听者已经通过 CJ\
    \ 知晓信号。因此，分类器仅用两个标签：信号和噪声进行训练。对于每种信号类型，我们使用数据集训练不同的分类器，该数据集包含 20000 个符号，并分为 16\
    \ 个 QPSK 块。节点之间的通道建模为：从节点 $i$ 到节点 $j$ 的通道增益为 $d_{ij}$，其中 $d_{ij}$ 是 $i$ 和 $j$\
    \ 之间的距离，衰减系数 $\\gamma$ 是路 损耗。通过仿真，我们设置 $d = 1$ 且 $\\gamma = 2.8$。我们参考 [25] 引入其他通道方法，包括阴影效应和小尺度衰落等衰落效应。\n\
    \n![](img/1c9877e90b513c63096e0d8f3f8eceab_2_1.png)\n\n图. 3. 当 $d_{ce} = 0.5$\
    \ 且 $d_{cr} = 1$ 时窃听者的成功率。\n\n我们使用 [24] 中的扰动噪声指标 (PNR) 来捕捉 CJ 相对于噪声的相对扰动。PNR 越高，窃听者分类器的准确性就越高。随着\
    \ PNR 的增加，CJ 生成的扰动更容易被窃听者检测，并增加接收端的误码率 (BER)。\n\n显示了窃听者分类器处 CJ 生成的扰动信号。x 轴是 PNR（以\
    \ dB 为单位），y 轴是成功率（以百分比表示），表示实现无线通信隐蔽性的成功，即窃听者分类器加上扰动噪声。我们观察到，随着信号 SNR 的增加，CJ 需要更多的扰动才能窃听者处引起误分类。16QAM\
    \ 信号比 QPSK 信号更容易受到扰动的影响，使其分类更困难。此外，我们观察到两种信号的扰动在达到某些 PNR 值后，成功率都会突然下降。相反，基于高斯的扰动对所有\
    \ SNR 值的分类器影响均忽略不计。我们观察到功率高斯噪声降低了信号的 SNR，当信号 SNR 为 3 dB 时，高斯噪声（实际上的高斯噪声类信号）被分类为窃听者。\n\
    \n# V. 不同模型信号性能评估\n\n## A. 通信的鲁棒性\n\n我们的目标是通过发射器隐藏固定调制方案（即 QPSK 或 16QAM）的信号。我们考虑的第一种拓扑是\
    \ $d_{ce}=d_{cr}=1$。在图 2 中，我们——\n\n在图 3 中，$d_{ce}=0.5$ 且 $d_{cr}=1$（接近），CJ 与接收端之间的距离被接收，CJ\
    \ 与窃听者之间的距离与图 2 相比。随着信号 SNR 的增加，CJ 需要更大的功率才能在窃听者处引起误分类，我们在图 2 中也观察到了这一点。由于 CJ\
    \ 和窃听者之间路损效应的降低，\n\n![](img/1c9877e90b513c63096e0d8f3f8eceab_3_0.png)\n\n![](img/1c9877e90b513c63096e0d8f3f8eceab_3_1.png)\n\
    \n![](img/1c9877e90b513c63096e0d8f3f8eceab_3_2.png)\n\n图 5 显示了当 $d_{ce}=0.5$ 且\
    \ $d_{cr}=1$ 时，不同类型和 SNR 值的接收端 BER 性能。我们观察到，相同 SNR 值下，高斯噪声和对抗扰动下的 BER 性能由于 CI\
    \ 和 CJ 之间影响的增加而下降。因此，如果 CI 更靠近窃听者，CJ 可以在不增加功率的情况下产生导致误分类的扰动。这促使控制 CJ 位置以提高预期接收端的性能。这促使使用\
    \ AML 代替传统的干扰 ([28]) 来攻击窃听者。\n\n## B. 通信的可靠性\n\n图 4 显示了当 $d_{ce}=d_{cr}=1$ 时，不同调制和\
    \ SNR 值的接收端 BER 性能。16QAM 调制信号比 QPSK 调制信号更容易受到扰动的影响。其原因是 16QAM 传输的比特比 QPSK 多，点点之间的距离更小，导致在给定\
    \ SNR 下产生较大的 BER。此外，随着 SNR 的增加，BER 如预期般下降。通过观察到的对抗扰动，我们发现 BER 在达到某些 PNR 值后趋于饱和，因为可以使用小于最大功率的生成成功的扰动。例如，为了达到\
    \ QPSK 调制信号 15% 的目标 BER，PNR 选择为 3dB，收敛成功率为 65%。此外，我们观察到在低 PNR 区域，基于噪声的扰动结果优于对抗扰动，且随着\
    \ PNR 的增加 BER 会下降。\n\n# VI. SG 通信的性能评估\n\n我们考虑物理通信，在 CJ 干扰存在，用户设备 (UE) 向基站 (gNB)\
    \ 发送上行信号。使用 MATLAB 生成共享信道信号。传输块由循环冗余校验 (CRC) 生成，低稀疏校验码 (LDPC) 用于前向纠错。输出由带有循环前缀\
    \ (CP) 的 OFDM 波形生成，其中载波在通过信道后进行 QPSK 解调、LDPC 和 CRC 解。\n\n## A. 通信概述\n\n图 6 显示了收敛成功。正如我们在之前的\
    \ QPSK 调制和 16QAM 调制图中所示，在高 SNR 区域，提出的干扰优于高斯噪声。我们还观察到，当 CJ 和窃听者之间的距离增加时，CJ 需要更大的功率来分类窃听者。\n\
    \n![](img/1c9877e90b513c63096e0d8f3f8eceab_4_0.png)\n\n图 7. 接收端高斯通信 BER 性能。\n\n\
    ## 通信的可靠性\n\n图 7 显示了通信 BER。当 $d_{cc}=1$ dB 且 $N=5$ 时，基于噪声的扰动不仅提高了正确性，还对接收端的 BER\
    \ 性能产生了影响。我们进一步观察到，当 $d_{cc}=0.5$ dB，$d_{a}=1.5$ dB 时，基于噪声的扰动优于对抗扰动。\n\n## 结论\n\
    \n我们考虑了一种使用 CJ 生成噪声的通信系统。遵循 AML 方法，对于修改后的信号和伪造信号，我们显示 CJ 可以产生导致窃听者误分类的扰动，而接收端的\
    \ BER 仅受到轻微影响。另一方面，带高斯噪声无法欺骗分类器。这些结果证明了使用 CJ 进行对抗分类器攻击的可行性。\n\n## 参考文献\n\n[1]\
