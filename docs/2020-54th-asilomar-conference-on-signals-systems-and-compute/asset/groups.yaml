    # 如何让 5G 通信“隐形”：用于无线隐私的对抗机器学习


    Brian Kim¹, Yalin E. Sagduyer², Kemal Davlioglu², Tugba Erpek², and Sennur Ulukus¹


    *美国马里兰州大学帕克大学分校电气与计算机工程系，MD 20742

    ²美国马里兰州罗克维尔 Intelligent Automation 公司，MD 20855


    **摘要—** 我们考虑了从深度学习（DL）分类器检测是否存在传输的窃听者隐藏通信的问题。我们证明了发射机可以欺骗窃听者的接收端，而隐蔽干扰可以将对抗扰动作为噪声引入接收到的信号中。我们展示了这种对抗扰动会导致窃听者以高概率将信号误分类为噪声，并进一步证明了如果窃听者使用
    DL 分类器检测传输，任何 5G 通信都可以从其视线中有效隐藏。


    本文从对抗机器学习（AML）的角度涵盖了隐蔽通信。AML 研究的是存在可能试图操纵或干扰机器学习算法训练过程的攻击者时的机器学习（ML）问题 [7–9]。在计算机视觉领域，AML
    的起源是对将 AML 应用于无线通信日益增长兴趣，包括探索性（推理）、因果性（投毒）、规避和欺骗攻击 [10–16]。


    ## I. 引言


    由于无线介质的开放和共享特性，信息隐私是无线通信中的一个基础问题。隐蔽通信由一对发射机-接收机组成，旨在隐藏从发射机到接收机的通信。接收机必须确定是否存在传输。防止未经授权解码的信息隐私已从安全信息理论角度得到了广泛研究
    [1], [2]。在本文中，我们考虑一个追求第二个目标的窃听者，即检测正在进行的传输。一旦检测到传输，可以使用干扰阻塞通信。


    隐蔽通信已在隐藏信息方面得到了研究，其主要目标必须是降低攻击者的信噪比（SNR）[3], [4]。在保持通信隐蔽的同时，针对给定的信道数量总发射功率已建立了一个基础界限，这通常被称为平方根律
    [5]；另见相关工作。


    我们考虑一个具有深度学习（DL）分类器的窃听者，该分类器在检测从噪声中接收的信号时存在不准确性。我们引入了在物理层安全中被广泛使用的协作干扰器（CJ）[17–19]。本文中，CJ
    与发射机同步传输误差，目的是误分类窃听者的分类器。这被视为隐蔽干扰，旨在防止窃听者将正在进行的传输与噪声区分开来。


    我们使用 CJ 作为对抗扰动的源来欺骗窃听者的分类器。CJ 添加的大扰动可以轻易欺骗分类器，但同时会将目标接收处的干扰和比特率（RATE）增加到不可接受的水平。根据
    [27] 中考虑的方法（即发射机对其信号添加扰动以欺骗机器分类器同时保持其性能），我们的重点是受 CJ 辅助的隐蔽通信，CJ 重点影响窃听者将接收到的信号分类为噪声，同时降低网络性能。欺骗分类器将信号误分类为噪声（如本文考虑的）比插入此类干扰攻击（如
    [27] 中考虑的）要困难得多。在评估中，我们使用了各种调制方案（QPSK 和 QAM），并证明了我们可以从使用 DL 分类器检测传输的窃听者处有效隐藏这些信号。


    本研究由美国陆军研究办公室根据合同 W911NF-C-0090 支持。信息内容并不反映美国政府的立场或政策，不应视为任何官方背书。


    ![](img/1c9877e90b513c63096e0d8f3f8eceab_1_0.png)

    图 1. 系统模型。


    由于来自 CJ 的扰动不仅在窃听者处产生干扰，在接收处也是如此，因此 CJ 通过使用固定功率预算确定其 $\delta$，以导致窃听者的误分类，同时该预算也限制了接收处的
    BER。最后，CJ 通过求解以下优化问题首先确定 $\delta$：


    $$\arg \min_{\delta} ||\delta||_2 \text{ s.t. } l(r_{te}, \delta) \neq l(r_{te},
    \delta^*), ||\delta|| \leq P_{max}$$


    选择 CJ 的扰动是为了在成功欺骗窃听者的条件条件下，最小化扰动强度，以及一个可以转换为接收处 BER 的扰动功率上限。我们证明了高斯噪声不足以构成对抗攻击，并开发了一种算法来优化
    CJ 的扰动，以便轻松覆盖我们为不同调制类型和 5G 通信所演示的通信。


    $\delta^{(4)}$ 在接收处的 BER 中求解，可以通过相应地设置 $P_{max}$ 来捕获。由于求解方程 (4)，计算领域已经提出了不同的方法来近似对抗扰动，例如快速梯度法
    [7]。FGM 通过在 $x$ 处线性化 DNN 分类器的损失函数（其中 $y$ 是标签向量）来构建对抗样本，在计算上是高效的。对于优化，我们考虑了有目标攻击，即
    CJ 的扰动旨在将接收信号误分类为噪声，同时降低网络性能。


    ## II. 系统模型


    我们考虑一个由发射机、接收机和窃听者组成的无线系统，如图 1 所示。发射机发送 $x \in \mathcal{C}$，调制类型为 $g: \{0,1\}
    \to \mathcal{C}$，其中 $m$ 是二进制消息。窃听者接收到 $r_{te} = h_{te}x + n_{te}$，其中 $h_{te} =
    [h_{te1}, ..., h_{tep}] \in \mathcal{C}^p$ 是信道，$n_{te}$ 是高斯噪声。接收机接收到 $r_{tr} =
    h_{tr}x + n_{tr}$，其中 $h_{tr}$ 是信道，$n_{tr}$ 是高斯噪声。CJ 扰动 $\delta \in \mathcal{C}$
    以导致窃听者的误分类，产生 $r_{te}(\delta) = h_{te}(x+\delta) + n_{te}$。


    ## III. CJ 的对抗扰动


    在本节中，我们使用 (4) 中的 FGM 描述 CJ 的白盒。对于目标攻击，我们对 $\delta$ 优化 $l(r_{te}, \delta^*)$，其中
    $y$ 是 one-hot 解码类。我们将 $y$ 固定为噪声，因为 CJ 总是尝试添加扰动来欺骗窃听者认为是接收信号。我们使用 FGM 线性化损失 $l(r_{te},
    \delta) = l(r_{te}, 0) + \nabla_{\delta}l(r_{te}, 0)^T\delta$，然后通过设置 $\delta =
    -\alpha\nabla_{\delta}l(r_{te}, 0)$ 来最小化它，其中 $\alpha$ 是一个将对抗功率限制在 $P_{max}$ 的缩放因子。之后，如果误分类满足功率约束，CJ
    将保持接收处的 BER。扰动功率可以进一步调整以满足目标 BER 水平。


    ## IV. 仿真设置


    我们分析了 CJ 实现正确性的成功以及对接收处 BER 的相应影响。我们将此扰动与对比


    '
