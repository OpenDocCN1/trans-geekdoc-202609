    # B. Reliability of Communications


    The BER performance at the receiver for different modulation and SNR values is
    shown in Fig 4 when $d_{ce}=d_{cr}=1$. We is more susceptible to the perturbation
    of 16QAM-modulated signal than that of QPSK-modulated signal. The reason is that
    the 16QAM transmits more bits than QPSK, the distances between星座 points are smaller,
    which leads to a larger BER for a given SNR. Moreover, as the SNR increases, the
    BER decreases as expected. With the observed adversarial perturbation, we observe
    that the BER saturates after some PNR value because the successful perturbation
    can be generated using less power than maximum power. The CI can be used to determine
    the maximum PNR to satisfy the BER at the receiver. For example, to meet the target
    BER of 0.15 for QPSK-modulated signal, the PNR is selected at 8dB when SNR is
    3 and the resulting success of convergence is 65%. Furthermore, we observe that
    the Gaussian noise-based perturbation results lower than adversarial perturbation
    in the low PNR region, the BER between two CJ schemes decreases when the PNR increases,
    and the adversarial perturbation results in a smaller BER in the high PNR region.


    # VI. PERFORMANCE EVALUATION FOR SG COMMUNICATIONS


    As a full-fledged waveform, we consider the 5G physical layer communications where
    5G User Equipment (UE) transmits an uplink signal to the base station (gNB) in
    the presence of the jamming from the CJ. MATLAB Lab is used to generate 5G signals
    that include the transport (shared channel, UL-SCH) and frequency channel. The
    transport block is generated by cyclic redundancy check (CRC) code and low-density
    parity-check (LDPC) code is used for forward error correction. The output codewords
    are generated by OFDM waveform with Cyclic Prefix (CP) prefixes, where the subcarrier
    is 15 kHz. Target code rate and the I/O samples are shaped after the signal passes
    through the channel. Eavesdropper attempts to detect the received signals from
    noise, the receiver attempts to decode the signals by removing the CP and performing
    FT, channel equalization, QPSK demodulation, LDPC and CRC decoding.


    # A. Overview of Communications


    The success of convergence for 5G is shown in Fig. 6. As we have seen in the previous
    figures for QPSK-modulated and 16QAM-modulated signals, proposed jamming outperforms
    the Gaussian noise interference in high SNR region for 5G communication signals.
    Also, we observe that more power is needed for CJ to classify the eavesdropper
    when the distance between the CJ and the eavesdropper increases.'
