    Since the perturbation from the CJ not only creates interference at the eavesdropper,
    also at the receiver, the CJ determines its $\delta$ to cause misclassification
    of the eavesdropper using fixed power budget that also limits the BER at the receiver.
    Finally, the CJ first determines $\delta$ by solving the following optimization
    problem:


    ```

    $$\arg \min_{\delta} ||\delta||_2\n l(r_{te}, \delta) \neq l(r_{te}, \delta^*))
    \n ||\delta|| \leq P_{max}$

    ```


    The perturbation of the CJ is selected to minimize the strength of the perturbation
    to the condition of successfully fooling the eavesdropper, and an upper bound
    on the perturbation power that can translate to the BER at the receiver. We show
    that Gaussian noise is not enough of adversarial attack and we develop an algorithm
    to optimize perturbations for the CJ to easily cover communications that we demonstrate
    for different modulation types and 5G communications.


    The $\delta^{(4)}$ is solved in the BER, at the receiver that can be caught by
    setting $P_{max}$ accordingly. Since solving is (4), different methods have been
    proposed in computation to approximate the adversarial perturbations like the
    fast gradient method [7]. The FGM is computationally efficient for crafting adversarial
    examples by linearizing the loss function of a DNN classifier at $x$ where $y$
    is the label vector. For optimization, we consider a targeted attack, where the
    perturbation of the CJ aims to decrease the loss of the function class noise and
    cause a specific misclassification, from signal to noise, at the eavesdropper
    there on an actual transmission. We perturb the problem from AML and aim to fool
    a target class in wireless communication environment. Despite the perturbation,
    we constrain the BER at the receiver to stay below certain level while satisfying
    the power constraint of the CJ, in the states of the optimization problem (4).
    We assume that the CJ communicates with the transmitter and knows the transmitted
    signal from the transmitter.


    # II. SYSTEM MODEL


    We consider a wireless system consisting of a transmitter, a receiver, and an
    eavesdropper as shown in Fig. 1. The transmitter sends $x$ complex symbols $x
    \in \mathcal{C}$, with a binary sequence $m \in \{0,1\}$; $x = g(m)$, where $g:
    \{0,1\} \to \mathcal{C}$ and $g$ represents the modulation type of the transmitter.
    The transmitter''s signal received at node $j$ (where $j$ is either the receiver
    or the eavesdropper) is


    ```

    $r_{tj} = h_{tj}x + n_{tj} = h_{tj}x + n_{tj}, \quad j \in \{r,e\}$

    ```


    where $h_{tj} = [h_{tj1}, \..., h_{tjp}] \in \mathcal{C}^p$ and $n_{tj}$ is the
    channel and Gaussian noise from the transmitter to node $j$, respectively. Upon
    receiving the signal, the receiver dec the message with the BER given


    ```

    $P_e(m|r_{tj}) = \frac{1}{q} \sum_{\hat{m} \neq m} p(\\hat{m}|r_{tj}), \quad (2)$

    ```


    where $m$ is a decoded value and $\hat{m}$ is an indicator function. The eavesdropper
    tries to detect the wireless message using a pre-trained DL-based classifier,
    a deep neural network (DNN), $f(\theta;x): \mathcal{C} \to \mathcal{R}^p$, where
    $\theta$ is the set of parameters and $l$ is assigned $l = \argmax_k f(\theta;x)$
    where $f(\theta;x)$ is the output of classifier $f$ to the th class.


    To communicate between between the transmitter and its receiver, the CJ perturbs
    transmitter signal $\delta \in \mathcal{C}$ to cause misclassification at the
    eavesdropper by changing the label of the received signal from signal to noise.
    Thus, if the transmitter transmits $x$, the adversarial received at node $j$ is


    ```

    $r_{tj}(\delta) = h_{tj}(x+\delta) + n_{tj}, \quad j \in \{r,e\}$

    ```


    where $h_{tj} = [h_{tj1}, \..., h_{tjp}] \in \mathcal{C}^p$ is the channel from
    CJ to node $j$.


    # III. ADVERSARIAL PERTURBATION FOR THE CJ


    In this section, we describe the white-box for the CJ using trained FGM from (4).
    For the targeted attack, we optimize $l(r_{te}, \delta^*)$ with respect to $\delta$
    where $y$ is one-hot decoding class. We fix $y$ as noise since the CJ always tries
    to add perturbation to fool the eavesdropper as received signal. We use FGM to
    linearize the loss $l(r_{te}, \delta) = l(r_{te}, 0) + \nabla_{\delta}l(r_{te},
    0)^T\delta$ and then minimize it by setting $\delta = -\alpha\nabla_{\delta}l(r_{te},
    0)$, where $\alpha$ is a scaling factor to constrain the adversarial power to
    $P_{max}$. After that, if misclassification satisfies the power constraint, the
    CJ will keep the BER at the receiver. The perturbation power can further be adjusted
    to meet a target BER level. The determining of the CJ''s perturbation signal are
    presented in Algorithm 1.


    # IV. SIMULATION SETUP


    We analyze the success of correctness achieved by the CJ and the corresponding
