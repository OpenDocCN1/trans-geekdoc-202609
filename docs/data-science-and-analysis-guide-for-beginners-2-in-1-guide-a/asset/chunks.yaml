    Jupyter Notebooks 被广泛应用于学术界、工业界研究领域，涵盖了从数据分析、可视化到机器学习模型开发的各种任务。它们通过允许用户以可重现的格式共享工作来促进协作。`JupyterHub`
    和 `Google Colab` 等平台提供了运行 Jupyter Notebooks 的云端服务，使得更广泛的受众无需本地安装即可访问。总体而言，Jupyter
    Notebooks 已经成为交互式计算和数据驱动探索人员工具箱中不可或缺的一部分。


    ## 3.3 使用 Matplotlib 和 Seaborn 进行数据可视化


    数据可视化是数据分析的一个关键方面，Python 中的 `Matplotlib` 和 `Seaborn` 库已成为创建信息丰富且视觉吸引力强的图表图的首选工具。


    **Matplotlib**: `Matplotlib` 是一个多功能的 2D 绘图库，能够在 Python 中创建各种静态、动画和交互式可视化。它提供了一个低级接口，用于构建各种类型的图表，包括线图、散点图、柱状图、直方图等。`Matplotlib`
    的灵活性允许用户自定义图表的每个方面，从轴标签到数据点的颜色和样式。虽然强大，但 `Matplotlib` 在某些任务中有时会显得冗长，用户可能需要编写更多代码来实现特定的样式或创建复杂的可视化效果。


    **Seaborn**: `Seaborn` 构建在 `Matplotlib` 之上，为创建美观的统计图表提供了一个高级接口。它带有多个内置主题和色板，使得用户可以用最少的代码轻松创建专业的图表。`Seaborn`
    简化了复杂统计可视化的创建，例如热图、小提琴图和对矩阵图，而这些内容仅用 `Matplotlib` 实现可能需要花费更多精力。该库还与 `Pandas` DataFrames
    无缝集成，为处理表格数据的用户提供了极大的便利。


    `Matplotlib` 和 `Seaborn` 结合在一起为 Python 数据可视化提供了一个强大的组合。`Matplotlib` 为创建各种图表提供了基础，而
    `Seaborn` 在此基础上提供了更符合用户友好且更具视觉吸引力的界面。用户经常交替使用这两个库，使用 `Matplotlib` 进行细粒度控制，使用 `Seaborn`
    进行快速且优雅的可视化。


    无论是用于探索性数据分析，还是向更广泛的受众传播结果，`Matplotlib` 和 `Seaborn` 对数据驱动叙事的有效性都有显著贡献。它们与 Jupyter
    Notebooks 的集成也使其成为数据科学社区的热门选择，通过可视化促进了数据的交互和迭代探索。


    ## 3.4 数据分析 SQL 简介


    SQL，即结构化查询语言，是一种用于管理和操作关系型数据库的领域特定语言。在数据分析中，`SQL` 是查询、聚合和转换存储在关系型数据库管理系统（RDBMS）中数据的强大工具。它提供了一种标准化且高效的交互方式，是数据专业人士、分析师以及任何涉及结构化数据工作的人的必备技能。


    `SQL` 的基本方面之一是使用 `SELECT` 语句从数据库中检索数据。该语句允许用户指定想要检索的列，使用条件（`WHERE` 子句）应用过滤器并对结果进行排序。`SQL`
    还支持多种聚合函数，如 `COUNT`、`SUM`、`AVG`、`MIN` 和 `MAX`，这些对于总结和分析数据至关重要。


    `SQL` 不仅仅关于查询数据；它还通过 `INSERT`、`UPDATE` 和 `DELETE` 等语句允许修改数据库。这种能力对于需要清洗和预处理数据、创建衍生特征或更新现有记录的数据分析师来说是重要的。


    `JOIN` 操作是 `SQL` 的另一个强大功能，允许用户根据表之间指定的特定关系从多个表中合并数据。这在处理信息分布在多个表中的规范化数据库时尤为重要。


    对于数据分析师来说，理解 `SQL` 的基础提供了高效访问和操作大型数据集的能力。它通常与其他工具和编程语言结合使用，允许数据库查询无缝集成到数据分析工作流中。许多流行的关系型数据库系统，如
    `MySQL`、`PostgreSQL` 和 `SQLite` 都使用 `SQL` 作为与其交互的主要语言。学习 `SQL` 不仅增强了数据分析技能，还为更高级的数据库管理和优化任务奠定了基础。


    # 第 4 章：数据科学基础统计学


    ### 4.1 描述性统计


    描述性统计是统计学的一个分支，涉及数据的收集、分析、解释、展示和组织。其主要目的是提供数据集主要特征的简要总结，为对数据的模式、趋势和特征提供洞察。描述性统计是理解和对总体或样本做出推断的基础。


    常见的集中趋势量，如 `mean`（平均值）、`median`（中位数）和 `mode`（众数），是描述性统计的关键组件。这些度量提供了关于数据分布中心位置的直。。例如，`mean`
    对极端值敏感，而 `median` 对离群值具有抗性，提供了关于集中趋势的不同视角。


    变异性量，如 `range`（范围）、`variance`（方差）和 `standard deviation`（标准差），量化了数据点围绕集中趋势的离散程度。较大的
    `standard deviation` 表示变异性更大，而较小的标准差则表明数据集更具一致性。


    频率分布和直方图是描述性统计中常用的图形表示方法，用于说明数据集中数值的分布。这些可视化提供了数据形状和特征的快速概述，有助于识别模式和离群值。


    描述性统计在数据分析的初期起着至关重要的作用，在进行更高级的统计分析之前提供数据主要特征的快照。它们对于以意义且可解释的方式总结数据至关重要，帮助研究人员和分析师根据现有信息得出有意义的结论并做出明智决策。


    ### 4.2 推断统计


    推断统计是统计学的一个分支，涉及根据从总体提取的样本对总体得出结论并做出推断。与总结和描述数据集主要特征的描述性统计不同，推断统计利用概率论对更大的群体进行预测或概括。


    推断统计的过程通常从建立假设开始。假设是对总体参数的陈述或假设，推断统计帮助根据样本数据评估该假设为真的概率。推断统计的常用技术包括假设检验和估计。


    假设检验涉及评估零假设（代表无效应或无差异的陈述）相对于替代假设。通过将样本数据与零假设进行比较，统计学家可以确定观察结果是否具有统计学意义，还是随机产生的。常见的统计检验，如
    `t-tests`、`chi-square tests` 和方差分析 (`ANOVA`）被用于各种场景下的假设检验。


