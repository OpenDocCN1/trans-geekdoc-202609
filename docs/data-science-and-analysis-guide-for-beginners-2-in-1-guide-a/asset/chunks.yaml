    Training a neural network involves adjusting the weights associated with each
    connection to minimize the difference between the predicted output and the actual
    output. This process is typically done using a training dataset with known input-output
    pairs. A loss function quantifies the error between predictions and actual outcomes,
    and optimization algorithms, like gradient descent, iteratively update the weights
    to minimize this error.


    Activation functions are critical in introducing non-linearity to the model, allowing
