    # 监督学习


    在监督学习中，算法会被提供一个标记的训练数据集，这意味着输入数据与相应的输出标签配对。目标是让算法学习输入特征与目标标签之间的映射或关系。在训练过程中，算法会调整其参数，以最小化预测值与实际标签之间的差异。一旦训练完成，模型就可以对新的未见数据进行预测。监督学习中的常见任务包括分类（即算法将输入分配到预定义的类别）和回归（即算法预测连续输出）。监督学习的应用示例包括垃圾邮件检测、图像识别和房价预测。


    监督学习是机器学习中的一种范式，其中算法被提供一个标记的训练数据集。这意味着数据集中的每个输入都与相应的输出标签配对，为算法提供了正确答案的清晰指引。监督学习的主要目标是让算法学习输入特征与目标标签之间的映射或关系。


    在训练阶段，算法根据其预测与训练数据中实际标签之间的差异迭代地调整其参数。该过程涉及最小化差异（通常称为损失或误差），以提高模型预测的准确性。这种调整允许算法泛化其学习结果，并对新的未见数据做出准确预测。


    监督学习涵盖了各种任务，其中两个基本类别是分类和回归。在分类中，算法被训练用于将输入分配到预定义的类别或类。这被广泛应用于垃圾邮件检测等场景，其中邮件被分类为垃圾邮件或非垃圾邮件。另一方面，回归涉及预测连续输出，使其适用于预测等任务，例如根据各种特征预测房价。


    监督学习在现实世界的应用既多样又具有影响力。例如，图像识别系统利用监督学习将图像归类到特定的类别，从而实现从人脸识别到自动驾驶汽车的各种应用。在金融领域，监督学习可用于预测股价；在医疗保健领域，它可以帮助根据患者数据诊断医疗状况。监督学习的多功能性使其成为解决跨领域广泛问题的强有力工具。


    # 无监督学习


    与监督学习相反，无监督学习处理的是未标记的数据，算法必须在没有显式引导的情况下识别数据中的模式、关系或结构。其目标通常是探索数据的内在结构，或将相似的数据点聚集在一起。聚类是一种常见的无监督学习任务，算法根据相似性对数据点进行分组。另一个任务是降维，算法在保留基本信息的同时减少输入特征的数量。无监督学习对于发现隐藏模式和从非结构化数据中获取见解非常有价值。应用包括客户细分、异常检测和主题建模。


    无监督学习与监督学习形成对比，因为它涉及处理未标记的数据，算法必须在没有标记输出显式引导的情况下，自主地识别模式、关系或结构。无监督学习的主要目标通常是探索数据的内在结构，或根据内在相似性将相似的数据点聚集在一起。


    聚类是无监督学习中的重要任务，算法根据共同特征将数据点自主分类为不同的组或簇。这一过程允许算法识别数据中的自然分组，即使这些分组不是预定义的或预先已知的。这对于揭示复杂数据集中的隐藏结构或关系可能特别有价值。


    无监督学习的另一个常见任务是降维，算法旨在减少输入特征的数量同时保留关键信息。在数据集具有大量特征的场景下，这将是有益的，因为它有助于简化分析并降低过拟合的风险。


    无监督学习在发现隐藏模式和从非结构化数据中获取见解方面发挥着至关重要的作用。无监督学习的应用包括客户细分，将相似的客户行为聚集在一起以制定针对性的营销策略。异常检测是无监督学习的另一个出色领域，因为它可以识别数据集中的异常模式或离群值。此外，无监督学习被用于主题建模，涉及在没有预先了解主题的情况下，在文档集中发现潜在主题。


    无监督学习是探索性数据分析的有效工具，可以在没有显式标签或引导的数据集中发现有意义的见解。其多功能性使其适用于需要理解数据结构以做出决策的各种领域。


    监督学习和无监督学习在不同场景下都有其优势和应用。监督学习适用于输出已知的任务，并可用于训练。另一方面，无监督学习在处理未标记数据或探索数据底层结构时非常有价值。在实践中，两者的结合被称为半监督学习，也被用于利用标记和未标记数据的优势。在监督和无监督学习之间的选择取决于机器学习项目的特定目标以及数据的性质。


    ## 5.3 模型训练与评估


    模型训练和评估是机器学习流程中不可不可缺的步骤，其目标是创建可以对新的未见数据做出准确预测的模型。这些过程涉及在标记数据集上训练机器学习算法、微调其参数，并使用量化预测能力的指标对其进行评估。


    模型训练：在训练阶段，机器学习算法学习训练数据中存在的模式和关系。数据集通常被分为两个子集：用于训练训练集和用于调整超参数以防止过拟的验证集。训练期间，算法根据输入特征和相应的目标标签调整其内部参数。目标是最小化预测输出与实际标签之间的差异。训练数据的质量和代表性会显著影响训练后模型的性能。


    '
