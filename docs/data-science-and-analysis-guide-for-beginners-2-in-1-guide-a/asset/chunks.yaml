    # 5.2 Types of Machine Learning: Supervised vs. Unsupervised


    Machine learning is broadly categorized into different types based on the nature
    of the learning process and the availability of labeled data. Two fundamental
    types are supervised learning and unsupervised learning.


    ## Supervised Learning


    Supervised learning is a paradigm in machine learning where an algorithm is provided
    with a labeled training dataset. This means that each input in the dataset is
    paired with corresponding output labels, providing the algorithm with a clear
    indication of the correct answers. The primary objective in supervised learning
    is for the algorithm to learn a mapping or relationship between the input features
    and the target labels.


    During the training phase, the algorithm iteratively adjusts its parameters based
    on the discrepancies between its predictions and the actual labels in the training
    data. The process involves minimizing the difference, often referred to as the
    loss or error, to enhance the accuracy of the model''s predictions. This adjustment
    allows the algorithm to generalize its learning and make accurate predictions
    on new, unseen data.


    Supervised learning encompasses various tasks, with two fundamental categories
    being classification and regression:


    - **Classification**: The algorithm is trained to assign inputs to predefined
    categories or classes. This is widely used in applications such as spam detection,
    where emails are classified as either spam or non-spam.

    - **Regression**: Involves predicting a continuous output, making it suitable
    for tasks like forecasting, such as predicting house prices based on various features.


    The real-world applications of supervised learning are diverse and impactful:

    - **Image recognition**: Utilize supervised learning to classify images into specific
    categories, enabling applications ranging from facial recognition to autonomous
    vehicles.

    - **Finance**: Can be employed to predict stock prices.

    - **Healthcare**: Can aid in the diagnosis of medical conditions based on patient
    data.


    ## Unsupervised Learning


    Unsupervised learning stands in contrast to supervised learning, as it involves
    working with unlabeled data, where the algorithm must autonomously identify patterns,
    relationships, or structures without explicit guidance in the form of labeled
    output. The primary objective of unsupervised learning is often to explore the
    inherent structure of the data or to group similar data points together based
    on intrinsic similarities.


    - **Clustering**: A prominent task within unsupervised learning where the algorithm
    autonomously categorizes data points into groups or clusters based on shared characteristics.
    This process allows the algorithm to identify natural groupings within the data,
