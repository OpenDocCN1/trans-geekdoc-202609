    # 5.2 机器学习的类型：监督学习与无监督学习


    根据学习过程的性质和标记数据的可用性，机器学习大致可分为不同类型。其中两种基本类型是监督学习和无监督学习。


    ## 监督学习


    监督学习是机器学习中的一种范式，其中算法获得一个带有标签的训练数据集。这意味着数据集中的每个输入都与相应的输出标签配对，为算法提供了正确答案的明确指示。监督学习的主要目标是让算法学习输入特征与目标标签之间的映射或关系。


    在训练阶段，算法根据其预测值与训练数据中实际标签之间的差异迭代地调整其参数。该过程涉及最小化差异（通常称为损失或误差），以提高模型预测的准确性。这种调整允许算法泛化其学习结果，并对新的、未见过的数据做出准确预测。


    监督学习涵盖了多项任务，其中两个基本类别是分类和回归：


    - **分类**：算法经过训练，将输入分配到预定义的类别或类别中。这被广泛应用于垃圾邮件检测等场景，例如将邮件归类为垃圾邮件或非垃圾邮件。

    - **回归**：涉及预测连续输出，使其适用于预测等任务，例如根据各种特征预测房屋价格。


    监督学习的现实应用是多样且影响深远的：

    - **图像识别**：利用监督学习将图像分类为特定类别，实现从面部识别到自动驾驶汽车的各种应用。

    - **金融**：可以预测股票价格。

    - **医疗保健**：可以根据患者数据辅助诊断医疗状况。


    ## 无监督学习


    无监督学习与监督学习形成对比，因为它涉及处理标记数据，算法在没有标记输出显式引导的情况下，必须自主识别模式、关系或结构。无监督学习的主要目标通常是探索数据的内在结构，或根据内在相似性将相似的数据点分在一起。


    - **聚类**：无监督学习中的一项重要任务，算法根据共同特征自主地将数据点分类为组或簇。这一过程允许算法识别数据中的自然分组，即使这些分组不是预先定义或已知的。

    - **降维**：一种算法旨在保留核心信息的同时减少输入特征数量的任务。这在数据集具有大量特征的场景中是有益的，因为它有助于简化分析并降低过拟合的风险。


    无监督学习在发现隐藏模式和从非结构化数据中获取见解方面起着至关作用。应用包括：

    - **客户细分**：将相似的客户行为分组，以便制定针对性的营销策略。

    - **异常检测**：识别数据集中的异常模式或离群值。

    - **主题建模**：在预先不知道主题的情况下，从文档集中发现潜在主题。


    ## 比较


    监督学习和无监督学习在不同场景下都有其优势和应用。监督学习非常适用于目标输出已知且可用于训练的任务。另一方面，在处理未标记数据或探索数据底层结构时，无监督学习具有价值。在实践中，还会使用这两种类型的结合体，即半监督学习，以同时利用标记和未标记数据的优势。在监督学习和无监督学习之间的选择取决于机器学习项目的特定目标以及可用数据的性质。


    # 5.3 模型训练与评估


    模型训练和评估是机器学习流水线中不可或缺的步骤，其目标是创建能够对新的、未见的数据做出准确预测的模型。这些过程涉及在标记数据集上训练机器学习算法、微调其参数，并使用量化其预测能力的指标来评估其性能。


    ## 模型训练


    在训练阶段，机器学习算法学习训练数据中存在的模式和关系。数据集通常被分为两个子集：用于训练模型的训练集，以及用于调整超参数和防止过拟合的验证集。在训练期间，算法根据输入特征和相应的目标标签调整其内部参数。目标是最小化预测输出与实际标签之间的差异。训练数据的质量和代表性会显著影响训练后模型的性能。


    '
