  trans: '


    # 模型训练与评估


    在训练过程中，算法根据训练集中的特征及其对应的目标标签迭代调整其内部参数。其目标是最小化模型生成的预测输出与训练数据中实际标签之间的差异。通常采用诸如`gradient
    descent`等优化算法来寻找能够产生最准确预测的最优参数集。


    ## 训练阶段


    训练数据的质量和代表性显著影响所训练模型的性能和泛化能力。多样化且经过良好的训练数据集可以增强模型在各种场景和条件下识别模式的能力。相反，有偏差或不足的训练数据可能导致模型在真实世界数据上表现不佳，或表现出非意图的偏差。


    在训练阶段微调超参数是另一个关键方面。这些超参数（例如`learning rates`或`regularization terms`）会影响模型的学习过程和整体性能。`validation
    set`有助于选择超参数，使其在良好拟合训练数据与有效泛化到新的未见数据之间取得平衡。


    训练阶段是机器学习中的基础性步骤，算法在此阶段学习根据训练数据中的模式进行预测。将数据仔细划分为`training and validation sets`，结合迭代的参数调整和超参数调优，对于开发在真实场景中具有良好泛化能力和稳健性能的模型至关重要。


    ## 模型评估


    模型训练完成后，需要对其评估，以衡量其在新的未见数据上的泛化性能。这是通过一个模型在训练过程中未遇到的单独`test dataset`完成的。该测试集的目的是模拟真实场景，并评估模型对其从未遇到过的数据进行预测的有效性。


    合适评估指标的选择取决于所处理机器学习问题的性质。


    ### 分类任务

    对于分类任务（目标是将输入归类为不同的类别或标签），常见指标包括`accuracy`、`precision`、`recall`和`F1 score`。`accuracy`衡量预测的整体准确性，`precision`评估在所有预测正例中正确预测的正例的比例，`recall`评估在实际正例中捕获所有正例的能力，而`F1
    score`则将`precision`和`recall`合并为一个单一指标。


    ### 回归任务

    在回归任务中（目标是预测连续的数值），通常使用如`mean absolute error (MAE)`或`mean squared error (MSE)`等指标进行评估。`MAE`代表预测值与实际值之间的平均绝对差，提供了一种预测准确性的直观衡量。另一方面，`MSE`计算预测值与实际值之间的平均平方差，强调了较大误差的影响。


    评估指标的选择应与机器学习项目的特定目标和需求保持。例如，在某些应用中，根据假阳性或假阴性的后果，`precision`可能比`recall`更关键，反之亦然。理解每个指标的细微差别并选择与项目目标相关的指标，对于获得模型性能全面且有效的评估至关重要。


    ## 过拟合与欠拟合


    模型训练和评估中的两个常见挑战是`overfitting`和`underfitting`，两者都会显著影响模型对新的未见数据的泛化能力。


    ### 过拟合

    当模型过度学习训练数据时，就会发生过拟合，它不仅捕捉了底层模式，还捕捉了特定训练集的噪声和特殊特征。结果是模型在训练数据上的性能可能异常高，但无法有效泛化到新数据，导致在真实场景中表现不佳。当模型在训练集上表现良好但在单独的测试集上表现差时，通常识别为`overfitting`。


    ### 欠拟合

    相反，当模型过于简单且未能捕捉训练数据中固有的模式时，就会发生欠拟合。这导致模型在训练集和测试集上的表现都很差。`underfitting`可能表明模型缺乏识别数据内部有意义关系的复杂性或能力。


    ### 平衡技术

    平衡`overfitting`和`underfitting`之间的权衡对于构建泛化良好的模型至关重要。采用了多种技术来应对这些挑战：

    - **正则化方法**：例如对模型参数添加惩罚以抑制复杂性，通常用于缓解`overfitting`。

    - **交叉验证**：将数据集划分为多个子集的技术，允许模型在数据的不同部分上进行训练和评估，从而为泛化性能提供更稳健的评估。

    - **超参数调优**：寻找正确平衡点的重要策略。通过调整超参数（如`learning rates`或`regularization strengths`），数据科学家可以精调模型的复杂性，以便在训练和测试数据上均达到最优性能。


    ## 交叉验证


    交叉验证是一种技术，通过将数据划分为多个子集、在这些子集的不同组合上训练模型并在每次迭代中评估其性能来评估模型性能。这有助于确保模型性能在数据集的不同部分之间保持一致，并降低对特定`training-validation
    split`产生过拟合的风险。


    '
