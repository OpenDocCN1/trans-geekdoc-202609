    另一方面，估计涉及使用样本数据来估计总体的未知参数。置信区间提供了一个值范围，真实的总体参数可能以一定的置信水平落在该范围内。这使得研究人员能够表达与其估计相关的不确定性，并对总体的特征提供更细致的理解。


    推断统计广泛应用于研究、质量控制、金融等许多其他领域，在这些领域中，必须根据有限的数据对总体做出预测或概括。它要求对概率论、采样方法和适当的统计技术有深入理解，以确保推断的可靠性和有效。然而，这些推断的准确性和有效性取决于分析中所用样本数据的质量和代表性。


    # 4.3 概率分布


    概率分布是描述随机实验或过程中不同结果出现概率的数学函数。它们是概率论和统计学的基础，提供了一种模拟不确定性并量化各种事件发生概率的方法。概率分布主要有两种类型：离散型和连续。


    ### 离散概率分布

    在离散概率分布中，随机变量只能取不同的、分离的值。概率质量函数（`PMF`）定义了每个可能结果的概率。离散概率分布的示例包括二项分布（它模拟了在固定次数的独立试验中，且每次成功的概率相同，成功的次数）和泊松分布（它描述了在固定时间或空间间隔内发生的事件数量）。


    ### 连续概率分布

    另一方面，连续概率分布涉及可以在范围内取任何值的随机变量。概率密度函数（`PDF`）规定了随机变量落在某个特定区间的概率。正态分布（也称为高斯分布或钟形曲线）是一种广泛使用的连续概率分布，它是对称的，并以均值和标准差为特征。连续分布的其他示例包括均匀分布和指数分布。


    ### 关键概念

    概率分布以某些关键概念为特征：


    - **均值（期望）**：一种集中趋势的度量，代表随机变量的平均值。

    - **方差和标准差**：衡量概率分布离散程度或扩散程度的指标。

    - **偏度和峰度**：描述分布形状的额外指标。偏度表示不对称性，而峰度则衡量分布的“尾部特征”。


    概率分布在统计建模、假设检验和决策中起着至关重要的作用。它们为理解各种过程中的内在的不确定性提供了一种形式体系，并有助于基于概率推理做出明智预测。不同的应用和场景可能要求使用特定的概率分布，以最好地捕捉数据特征或正在建模的底层随机过程特征。


    # 4.4 假设检验


    假设检验是一种统计方法，用于根据样本数据对总体进行推断并得出结论。该过程涉及建立假设、收集和分析数据，以及评估观察结果是否提供了足够的证据来接受或拒绝零假设。零假设通常代表无效应、无差异或无关系的陈述，而备择假设则断言特定效应、差异或关系的存在。


    假设检验的一般程序涉及以下步骤：


    1. **假设的建立**：将零假设（`H0`）述为默认假设，并建立备择假设（`H1`）表示相反的情况或正在调查的影响。

    2. **选择显著性水平（α）**：显著性水平用 `α` 表示，代表在零假设实际上成立的情况下将其拒绝的概率。`α` 的常见选择是 `0.05` 和 `0.01`，分别表示有
    5% 或 1% 的机会犯第一类错误。

    3. **收集数据并进行测试**：收集数据并根据数据的性质和要检验的假设选择合适的统计检验。常见的统计检验包括 `t-检验`、`卡方检验`和 `ANOVA`（方差分析），取决于研究设计和目标。

    4. **计算检验统计量和 P 值**：从样本数据计算检验统计量，并确定 `p-value`。`p-value` 代表在假设零假设成立的情况下获得与观测数据极端结果概率。

    5. **决策规则**：如果 `p-value` 小于显著性水平（`α`），则拒绝零假设而接受备择假设。如果 `p-value` 大于 `α`，则不拒绝零假设。

    6. **得出结论**：根据决策规则对结果的统计显著性得出结论。如果拒绝了零假设，则表明有足够的证据支持备择假设。


    假设检验广泛应用于科学研究、质量控制各个领域，用于评估假设的有效性、比较组别或检查变量之间的关系。它为根据经验证据做出明智决策提供了一种系统且客观的方法。

