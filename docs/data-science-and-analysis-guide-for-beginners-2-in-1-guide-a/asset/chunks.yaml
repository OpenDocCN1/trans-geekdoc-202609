    推断统计学的过程通常从建立假设开始。假设是对总体参数的一种陈述或假设，而推断统计学则帮助根据样本数据评估该假设为真的概率。推断统计中的常用技术包括假设检验和估计。


    假设检验涉及对`零假设`（null hypothesis，即代表无效应或无差异的陈述）进行相对于备择假设的评估。通过将样本数据与零假设比较，统计学家可以确定观察结果是否具有统计学意义，或者它们是否可能是偶然发生的。在各种场景下，常用的统计检验方法如`t-tests`、`chi-square
    tests`和方差分析`ANOVA`）被用于假设检验。


    另一方面，估计涉及使用样本数据来估计总体的未知参数。`置信区间`（Confidence intervals）提供了一个值范围，在该范围内，真实的总体参数可能以特定的置信水平落入。这允许研究人员表达与其估计相关的不确定性，并对总体的特征提供更细致的理解。


    推断统计学广泛应用于研究、质量控制、金融等许多领域，在这些领域中，根据有限的数据对总体进行预测或概括是必要的。它要求对概率论、采样方法和适当的统计技术有深入理解，以确保推断的可靠有效。然而，这些推断的准确性和有效性取决于分析中所用样本数据的质量和代表性。


    ## 4.3 概率分布


    概率分布是描述随机实验或过程中不同结果概率的数学函数。它们在概率论和统计学中是基础，提供了一种模拟不确定性并量化各种事件概率的方法。概率分布主要有两种类型：离散和连续型。


    ### 离散概率分布

    在离散概率分布中，随机变量只能取不同的、离散的值。`概率质量函数 (PMF)` 定义了每个可能结果的概率。离散概率分布的示例包括`二项分布`（binomial
    distribution），它模拟了在成功概率相同的固定次数独立试验中成功的次数；以及`泊松分布`（Poisson distribution），它描述了固定时间或空间间隔内发生的事件数量。


    ### 连续概率分布

    另一方面，连续概率分布涉及可以在范围内取任何数值的随机变量。`概率密度函数 (PDF)` 规定了随机变量落在特定区间的概率。`正态分布`（normal distribution，也称为`高斯分布`或钟形曲线）是一种广泛使用的连续概率分布，它具有对称性，并以均值和标准差为特征。其他连续分布的示例包括`均匀分布`和`指数分布`。


    ### 关键概念

    概率分布以某些关键概念为特征：


    - **均值（期望）**：一种中心趋势的度量，代表随机变量的平均值。

    - **方差和标准差**：衡量概率分布离散程度（或离散程度）的度量。

    - **偏度和峰度**：描述分布形状的额外度量。偏度表示不对称性，而峰度衡量的是分布的“尾部特征”。


    概率分布在统计建模、假设检验和决策中起着至关重要的作用。它们为理解各种过程中的内在不确定性提供了一种形式方法，并有助于基于概率推理做出明智的预测。不同的应用和场景可能需要使用特定的概率分布，以最好捕捉数据特征或正在建模的底层随机过程特征。


    ## 4.4 假设检验


    假设检验是一种统计方法，用于根据样本数据对总体进行推断并得出结论。该过程涉及建立假设、收集和分析数据，以及评估观察结果是否提供了足够的证据来接受或拒绝零假设。零假设通常代表无效应、无差异或无关系的陈述，而备择假设则断言特定效应、差异或关系的存在。


    假设检验的一般程序涉及以下步骤：


    1. **建立假设**：将零假设（`H0`）作为默认假设，并建立备择假设（`H1`）表示相反的情况或正在研究的效应。

    2. **选择显著性水平 (α)**：显著性水平用`α`表示，代表当零假设真实时将其拒绝的概率。`α`的常用选择是`0.05`和`0.01`，分别表示犯第一类错误的概率为
    5% 或 1%。

    3. **收集数据并进行检验**：收集数据并根据数据的性质和所要检验的假设选择合适的统计检验。根据研究设计和目标，常用的统计检验包括`t-tests`、`chi-square
    tests`和`ANOVA`。

    4. **计算统计量和 P 值**：从样本数据中计算统计量，并确定`p-value`。`p-value`代表在假设零假设为真的情况下，获得与观测数据同样极端结果的概率。

    5. **决策规则**：如果`p-value`小于显著性水平（`α`），则拒绝零假设而接受备择假设。如果`p-value`大于`α`，则不拒绝零假设。

    6. **得出结论**：根据决策规则对结果的统计学意义得出结论。如果拒绝了零假设，说明有足够的证据支持备择假设。


    假设检验广泛应用于科学研究、质量控制和各个领域，用于评估假设的有效性、比较组组或检查变量之间的关系。它为基于经验证据做出明智决策提供了一种系统且客观的方法，帮助研究人员和分析师从数据中得出意义的结论。


    ## 第 5 章：机器学习基础


    ### 5.1 机器学习简介


    机器学习（ML）是人工智能（AI）的一个领域，侧重于开发算法和统计模型，使计算机能够在没有显式编程的情况下执行任务。机器学习的核心在于允许系统从经验中学习并改进，使其能够进行预测、识别模式并适应新数据。


    机器学习已应用于多个领域，包括图像和语音识别、自然语言处理、推荐系统、欺诈检测和自动驾驶汽车。机器学习的成功依赖于大规模、高质量数据集的可用、强大的计算资源以及算法和模型的不断改进。


    流行的机器学习框架和库，如`TensorFlow`、`PyTorch`和`scikit-learn`，促进了机器学习模型的开发和部署，使更广泛的研究人员、开发者和数据科学家能够使用。随着机器学习的不断进步，预计对工业和日常生活的影响将不断扩大，塑造技术和决策的未来。

