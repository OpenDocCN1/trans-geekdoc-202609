    Jupyter Notebooks 由单元组成，每个单元可以包含代码、Markdown 文本或原始内容。这种基于单元的结构允许以模块化和组织化的方式展示思想和代码。用户可以单独执行代码单元，从而实现分步探索和调试。Markdown
    单元的集成支持包含格式化文本、标题和图像，使其易于创建文档完备且具有视觉吸引力的报告。


    得益于 Python 的 `Matplotlib`、`Seaborn` 或 `Plotly` 等库，笔记本内可视化结果的实时渲染增强了 Jupyter 的交互性。此外，Jupyter
    支持各种扩展和集成，允许用户自定义其环境并整合诸如拼写检查、代码性能分析和版本控制等功能。


    Jupyter Notebooks 广泛应用于学术界、工业和研究领域，涵盖从数据分析、可视化到机器学习模型开发的各种任务。它们通过允许用户以可重复的格式共享工作，促进了协作。`JupyterHub`
    和 `Google Colab` 等平台提供了运行 Jupyter Notebooks 的云端服务，使得更广泛的用户群体无需本地安装即可访问。总体而言，Jupyter
    Notebooks 已成为从事交互式计算和数据驱动探索的人士不可或缺的工具包。


    ### 3.3 使用 Matplotlib 和 Seaborn 进行数据可视化


    数据可视化是数据分析的关键方面，Python 中的 `Matplotlib` 和 `Seaborn` 等库已成为创建信息丰富且视觉吸引力强的的图表的首选工具。


    **Matplotlib**：`Matplotlib` 是一个多功能的 2D 作图库，能够在 Python 中创建各种静态、动画和交互式可视化。它提供了一个低级接口来构建各种类型的图表，包括线图、散点图、柱状图、直方图等。`Matplotlib`
    的灵活性允许用户自定义图表的每一个方面，从坐标轴标签到数据点的颜色和样式。尽管功能强大，但 `Matplotlib` 在某些任务中有时会非常繁琐，用户可能需要编写更多代码来实现特定的样式或创建复杂的视化效果。


    **Seaborn**：`Seaborn` 构建在 `Matplotlib` 之上，为创建美观的统计图表提供了高级级接口。它带有几个内置主题和调色板，可以使用极少的代码轻松创建看起来专业的图表。`Seaborn`
    简化了复杂统计可视化的创建，例如热图、小提琴图和对矩阵图，这些内容仅用 `Matplotlib` 实现可能需要更多精力。该库还与 `Pandas` DataFrames
    无缝集成，为处理表格数据的用户提供了极大便利。


    `Matplotlib` 和 `Seaborn` 共同为 Python 数据可视化提供了一个强力组合。`Matplotlib` 为创建各种图表提供了基础，而
    `Seaborn` 在此基础上构建，提供了更符合用户习惯且具有视觉吸引力的界面。用户经常交替使用这两个库，使用 `Matplotlib` 进行细粒度控制，使用
    `Seaborn` 进行快速且优雅的可视化。


    无论是用于探索性数据分析还是向更广泛的观众传递结果，`Matplotlib` 和 `Seaborn` 都对数据驱动叙事的有效性贡献巨大。它们与 Jupyter
    Notebooks 的集成也使其成为数据科学社区的流行选择，便于通过可视化对数据进行交互和迭代探索。


    ### 3.4 数据分析 SQL 简介


    `SQL` 或结构化查询语言，是一种用于管理和操作关系型数据库的领域特定语言。在数据分析背景下，`SQL` 是查询、聚合和转换存储在关系型数据库管理系统 (`RDBMS`)
    中数据的强大工具。它提供了与数据库交互的标准且高效的方法，是数据专业人员、分析师以及任何涉及结构化数据工作的人的基本技能。


    `SQL` 的基本方面之一是可以使用 `SELECT` 语句从数据库中检索数据。该语句允许用户指定他们想要检索的列，使用条件（`WHERE` 子句）应用过滤器并对结果排序。`SQL`
    还支持各种聚合函数，如 `COUNT`、`SUM`、`AVG`、`MIN` 和 `MAX`，这些对于汇总和分析数据至关重要。


    `SQL` 不仅仅关于查询数据；它通过 `INSERT`、`UPDATE` 和 `DELETE` 等语句修改数据库。这种能力对于需要清洗和预处理数据、创建派生特征或更新现有记录的数据分析师来说是重要的。


    `JOIN` 操作是 `SQL` 的另一个强大功能，允许用户根据表之间的指定关系从多个表中合并数据。这在处理信息分布在多个表中的规范化数据库时尤为重要。


    对于数据分析师来说，理解 `SQL` 的基础提供了高效访问和操作大型数据集的能力。它通常与其他工具和编程语言结合使用，允许将数据库查询无缝集成到数据分析流中。许多流行的关系数据库系统，如
    `MySQL`、`PostgreSQL` 和 `SQLite`，使用 `SQL` 作为与数据交互的主要语言。学习 `SQL` 不仅增强了数据分析技能，还为……奠定了基础。


    ## 第 4 章：数据科学基础统计学


    #### 4.1 描述性统计


    描述性统计是统计学的一个分支，涉及数据的收集、分析、解释、展示和组织。其主要目的是提供数据集主要特征的摘要，为数据的模式、趋势和特征提供洞察。描述性统计是理解并对总体或样本推推理的基础。


    常见的集中趋势度量，如 `mean`（平均值）、`median`（中位数）和 `mode`（众数），是描述性统计的关键组件。这些度量提供了数据分布中心位置的感知。例如，`mean`
    对极端值敏感，而 `median` 对离群值不敏感，从而提供了关于集中趋势的不同视角。


    变异性度量，如 `range`（范围）、`variance`（方差）和 `standard deviation`（标准差），量化了数据点围绕集中趋势的离散程度。较大的
    `standard deviation` 表示变异性大，而较小的标准差则表明数据集更具一致性。


    频率分布和 `histograms` 是描述性统计中常用的图表表示形式，用于说明数据集中值的分布。这些可视化提供了数据形状和特征的快速概览，有助于识别模式和离群值。


    #### 4.2 推断统计


    推断统计是统计学的一个分支，涉及根据从总体中抽取的样本数据对总体得出结论并进行推理。与描述性统计总结和描述数据集的主要特征不同，推断统计使用概率论对更大的群体进行预测或概括。


    '
