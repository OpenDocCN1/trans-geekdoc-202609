    # ## 2.6.3 Lighting Standards


    A central objective of colorimetry is the measurement of the characteristics of
    colors in reality, and one of those important characteristics is lighting. For
    this reason, CIE defines a set of lighting standards, two of which are of special
    importance in the field of digital color models.

    These two standards are as follows:


    +   * D50. It corresponds to a temperature of 5,000 K and imitates the lighting
    produced by a spotlight. D50 serves as a reference for reflection produced by
    images, mainly for printing applications.


    +   * D65. It corresponds to a temperature of 6,500 K and simulates the lighting
    present on a day in the morning. D65 is used as a reference device for image reproduction.
    Such is the case for monitors.


    These standards have a dual purpose; on the one hand, they serve as a specification
    of ambient lighting for color observation, while on the other hand, they serve
    to determine the white point taken as a reference (Table 2.1) for the different
    color models emitted by the CIE diagram.


    # ## 2.6.4 Chromatic Adaptation


    The capture of a color that defines a space occurs in direct relation to the white
    point taken as a reference for the formation of the other colors. Consider that
    there are two different white points that form the reference of two different
    color spaces. These points are defined as follows:


    ```

    \(\boldsymbol{w}_1 = (X_{W1}, Y_{W1}, Z_{W1})\)


    \(\boldsymbol{w}_2 = (X_{W2}, Y_{W2}, Z_{W2})\) (2.46)

    ```


    Therefore, to find equivalencies between the two systems, it will be necessary
    to perform some transformations known as chromatic adaptation.'
