    # ## 1.2 Fundamental Morphological Operations


    The operations of reduction and increment are two of the fundamental morphological
    operations performed by filters, which are closely related to the physical processes
    of erosion and dilation [2]. There is an interesting relationship between both
    processes and those described qualitatively in the last section. Since dilation
    is conceived as growth and erosion as the loss of area or volume, they would be
    perfect analogies of the operations. Under such conditions, it could be said that
    adding a layer of pixels to a structure in an image would dilate the structure,
    while removing a layer of pixels from a structure would erode it.


    # ### 1.2.1 The Structure of Reference


    Similar to the operation of a linear filter, it is necessary to define a matrix
    of coefficients for the operation of a morphological filter. Therefore, it is
    necessary to characterize a matrix called a reference structure. The reference
    structure contains only elements 0 and 1. The content of this structure can be
    defined as follows:


    ```

    H(i, j) \in {0, 1} (1.1)

    ```


    This structure has, like the filter coefficient matrix, its own coordinate system,
    with the reference point (see Figure 1.6) at its origin.1


    # ### 1.2.2 Point Set


    For the formal description of morphological operations, it is more practical to
    describe images as sets whose elements can be referenced by two-dimensional coordinates.
    For example, a binary image _I_(_x_, _y_) consists of a set of points'
