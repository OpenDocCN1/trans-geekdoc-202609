    It is important to observe that there is a correction between the rank and the
    number of elements formulated in $e_w^x$ and $e_w^y$. This correlation can also
    be seen in the objective function of the elements $d_w^x$ and $d_w^y$. This fact
    is because in such formulations, the idea is to associate how an increment in
    rank is related in terms of the number of elements. With this association, it
    can be detected that the point $p_{min}$ represents the location where an increment
    in the cluster rank is greater than the variation in the number of elements. $p_{min}$
    separates all groups produced by MS into two sets: (A) relevant and (B) irrelevant
    groups (see Figure 5.6b). Significant groups involve the clusters that contain
    the greatest number of pixel characteristics. For this reason, they maintain the
    representative visual information of the segmented image. Irrelevant groups must
    be merged with other nearby clusters since their elements are too few so that
    they cannot be considered as meaningful. Under such conditions, the groups $C_a,...,C_d$
    are representative, only if they are part of Group A. ($C_a,...,C_d \in$ Group
    A). Likewise, the clusters $C_q,...,C_t$ are irrelevant, in case of they are identified
    as a part of Group B ($C_q,...,C_t \in$ Group B). Representative clusters are
    kept while irrelevant clusters are merged.


    The idea of the merging process is to integrate a cluster $C_v$ that is visually
    irrelevant (it contains so few elements) with a cluster $C_z$ that is representative
    according to their number of elements. This integration is only possible when
    both clusters $C_v$ and $C_z$ maintain similar characteristics. The similarity
    of two clusters depends on the distance between their respective cluster centers
    $\mathbf{x}_w^* - \mathbf{z}_*$. Under this merging process, the elements of every
    irrelevant cluster $C_v$ ($v \in$ Group B) are combined with the elements of the
    representative cluster $C_z$ ($z \in$ Group A), so that the length of their respective
    centers $\mathbf{x}_w^* - \mathbf{z}_*$'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'is the smallest possible considering all the representative clusters. As a
    consequence, the cluster \(C_z\) absorbs the elements of \(C_v\) (\(C_z = C_z
    \cup C_v\)). Therefore, the merged versions of the clusters from group A represent
    the final clustering information. To represent the final segmentation results,
    since each cluster center \(\mathbf{x}^*_q\) includes three dimensions for the
    intensity feature \(^{1*}x_q\) and two for the variance feature \(^{2*}x_q\) or
    non-local mean \(^{3*}x_q\), all elements of \(C_q\) are designed to have the
    same grayscale value indicated by \(^{1*}x_q\).


    # 5.4.6 Computational Process


    The MS segmentation scheme is conceived as an iterative process in which several
    procedures are executed. In Algorithm 5.1, these procedures are defined as pseudo-code.
    The MS method adopts as input an image of dimensions \(M \times N\) (line 1).
    In the first stage (line 2), the local variance \(\mathbf{V}(x,y)\) for every
    pixel \((x,y)\) by using a \(3 \times 3\) window is computed. Afterward, the non-local
    mean characteristic \(\mathbf{N}(x,y)\) of each pixel position \((x,y)\) is computed
    (line 3). Then, the feature space of three dimensions is produced by combining
    all features (line 4) intensity, local variance and non-local means \(\mathbf{F}(x,y)
    = [\mathbf{I}(x,y)\;\mathbf{V}(x,y)\;\mathbf{N}(x,y)]\). Under the next step,
    the reduced group \(\mathbf{O}\) is generated (line 6) by sampling different feature
    points of \(\mathbf{F}\). After this process, two groups are produced \(\mathbf{O}\)
    and \(\tilde{\mathbf{O}}\). With the set \(\mathbf{O}\), the three-dimensional
    standard deviations \(\sigma_1\), \(\sigma_2\), and \(\sigma_3\) of data \(\mathbf{O}\)
    are estimated (line 7). Considering all standard deviations \(\sigma_1\), \(\sigma_2\),
    and \(\sigma_3\), the configuration elements \(h_1, h_2, h_3, \delta_1, \delta_2\),
    and \(\delta_3\) for the MS method are estimated (line 8). Afterward, MS is applied
    (line 9). Once the MS scheme is executed over the dataset \(\mathbf{O}\), it obtains
    a group of \(c\) cluster centers \(\{\mathbf{x}^*_1, ..., \mathbf{x}^*_c\}\) and
    a list of data \(\mathbf{X}_i = (\mathbf{o}_a, ..., \mathbf{o}_g)\) for every
    cluster center \(\mathbf{x}^*_i\) where all pixel features are defined for each
    cluster \((\mathbf{o}_a, \mathbf{o}_g \in C_i)\).


    With the clustering results of MS, its partial results should be processed to
    involve the inactive data from \(\tilde{\mathbf{O}}\) (lines 10–14). Under this
    process, to each inactive data \(\hat{\mathbf{o}}_k \in \tilde{\mathbf{O}}\),
    it is designated to the cluster \(C_i\) of the nearest operative element \(\mathbf{o}_a\).
    Afterward, an objective function \(\mathbf{f}\) is defined, which considers the
    rise of the number of data in terms of its significance (line 15). From the information
    contained in \(\mathbf{f}\), the knee location \(v_{min}\) is identified (line
    16). Knowing the value of \(v_{min}\), the total number of groups is divided (line
    17) into two cluster elements: representative elements (Group A) and irrelevant
    elements (Group B). Then, in the merging procedure (lines 18–21), the pixel feature
    of every cluster \(C_j\) (\(j \in\) Group B) is combined with the pixel characteristics
    of the group \(C_a\) (\(a \in\) Group A), where \(C_a\) represents an element
    of Group A so that the length of the cluster centers \(\mathbf{x}^*_j - \mathbf{x}^*_a\)
    is the smallest possible. Likewise, the pixel characteristics of \(C_a\) will
    also involve the pixel features of \(C_a\) (\(C_a = C_a \cup C_j\)). Finally,
    the output of the scheme is the final stored cluster elements of Group A. Figure
    5.7 shows the flow chart that summarizes the computational process of the MS method.
    The flow chart also relates each computational step to its correspondence lines
    from Algorithm 5.1.'
