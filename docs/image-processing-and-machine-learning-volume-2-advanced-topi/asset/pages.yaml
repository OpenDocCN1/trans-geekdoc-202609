  md: '# 1.4.3 Properties of the Open and Close Operations


    Both opening and closing operations are idempotent. This means that you could
    perform the operation multiple times and still get the same result as if you performed
    it just once, that is:


    $(I \circ H) \circ H = I \circ H$


    $(I \bullet H) \bullet H = I \bullet H$


    Another important property that both operations possess is duality. This property
    means that an opening operation with values of one (1) is equivalent to applying
    the closing operation with values of zero (0). This is defined as follows:


    $I \circ H = \overline{(\overline{I} \bullet H)}$


    $I \bullet H = \overline{(\overline{I} \circ H)}$


    # 1.4.4 The Hit-or-Miss Transformation


    This transformation is useful for identifying certain pixel configurations. The
    hit-or-miss transform of $I$ and $H$ is denoted as $I \otimes H$. In the expression,
    $H$ is a reference structure that involves a pair of reference structures $H =
    (H_1, H_2)$. The hit-or-miss transform is defined in terms of two reference structures
    as follows:


    $I \otimes H = (I \ominus H_1) \cap (I'' \ominus H_2)$


    Figures 1.17 and 1.18 show how the hit-or-miss transformation can be used for
    detecting pixel patterns in an image. In this example, the configuration to detect
    is a cross of pixels.


    In the final operation, the intersection ($\cap$) represents the logical AND operation.
    The name “hit-or-miss” that the transform has comes from the fact of the operations
    that are carried out in the operation. That is, in the first erosion ($H_1$),
    all the positions that coincide with the reference structure (success) are detected,
    while in the second erosion ($H_1$), the positions where there is no coincidence
    (failure) are detected.


