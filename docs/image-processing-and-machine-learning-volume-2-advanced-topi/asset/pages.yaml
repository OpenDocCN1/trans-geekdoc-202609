    # ## 5.4.3 Operation of the MS Algorithm


    # ### 5.4.3.1 MS Setting


    Having produced the dataset **O**, the MS is applied to it. In the operation of
    the MS, two important parameters must be configured: the kernel support range
    _h_ and the step length \(\delta\). As the MS method processes the information
    of a three-dimensional solution space \(\left[ \mathbf{I}(x, y) \mathbf{V}(x,
    y) \mathbf{NL}(x, y) \right]\), both elements correspond to vectors of three dimensions
    _h_ and \(\delta\) with a magnitude for every dimension _h_ = [_h_<sub>1</sub>,
    _h_<sub>2</sub>, _h_<sub>3</sub>]; \(\delta\) = [\(\delta_1\), \(\delta_2\), \(\delta_3\)]
    where each of dimensions 1, 2, and 3 corresponds to the intensity value **I**(_x_,
    _y_), the local variance **V**(_x_, _y_), and the non-local mean **N**(_x_, _y_)
    feature, respectively. These factors are configured automatically by means of
    an analysis of the set **O**. The study considered to determine the correct configuration
    is based on Scott’s rule introduced in [43]. Under this scheme, the extent of
    both elements _h_ and \(\delta\) are strongly associated with the standard deviation
    \(\sigma\) of the data in **O** = {**o**<sub>1</sub>, ..., **o**<sub>s</sub>}.
    Every element from \(\mathbf{o}_i \in \mathbf{O}\) is characterized as **o**<sub>_i_</sub>
    = {_o_<sub>_i,_1</sub>, _o_<sub>_i,_2</sub>, _o_<sub>_i,_3</sub>}, where _o<sub>i
    j</sub>_ symbolizes the _j_-th variable of the _i_-th candidate solution (\(j
    \in 1, \dots, 3\)). Therefore, the standard deviation for each dimension \(\sigma_j\)
    is computed by Equation 5.13.


    ```

    \(\sigma_j = \sqrt{\frac{1}{s} \sum_{i=1}^s \left( o_{i,j} - \bar{o}^j \right)^2}\)
    \tag{5.13}

    ```


    where \(\bar{o}^j\) corresponds to the averaged value such that \(\bar{o}^j =
    \left( \frac{1}{s} \right) \sum_{i=1}^s o_{i,j}\).


    With these values, the factors _h_ and \(\delta\) are configured as it is indicated
    by Equation 5.14.'
