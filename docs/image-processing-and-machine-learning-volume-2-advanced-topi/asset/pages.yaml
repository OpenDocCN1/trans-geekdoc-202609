    Dithering is a process used in the printing and advertising industries to give
    a grayscale visual impression by using marking points of different sizes with
    a different distribution density. In the case of grayscale images, applying dithering
    will form a binary image of black points on a white background or vice versa.
    The size of the pixels applied in the process varies from small dots in light
    areas to increasing their size in dark areas. Light areas could be obtained by
    tracing a white region contaminated by a distribution of black points, while a
    dark area is obtained by defining a black area and contaminating some white points.
    Evidently, the density of points has a determining effect on the dithering process.
    The main problem with an algorithm that implements dithering is the balance between
    the precision of visual perception and the complexity of the number and size of
    points. MATLAB implements the `dither` function to implement the dithering process.
    This algorithm is based on the scheme developed by Floyd and Steinberg. The general
    syntax of this function applied to grayscale images:


    ```

    `bw = dither(gray) ;`

    ```'
