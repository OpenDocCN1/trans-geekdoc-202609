  md: "3. When a geometric transformation demands the creation or elimination of pixels,\
    \ it will be necessary to have a criterion that allows for establishing the way\
    \ in which these pixels will be treated in such a way that artifacts do not appear.\n\
    \nWhen an image is reduced in size, obviously some of the original pixels will\
    \ be lost as a result of the geometric transformation. This problem can cause\
    \ aliases. The aliasing effect can be considered as a problem caused by image\
    \ reduction, which has the consequence of adding artifacts to the transformed\
    \ image that are not present in the original image.\n\nThere are some methods\
    \ that reduce this effect; one of the best, according to its speed and effectiveness\
    \ ratio, is adding a low-pass filter to the image processing chain. The effect\
    \ of the filter will attenuate the problem of artifacts without causing excessive\
    \ computation weight; this is especially important when it comes to an artificial\
    \ vision system that performs real-time processing.\n\n# 3.5 Functions for Geometric\
    \ Transformation in MATLAB\n\nThis section describes the functions for implementing\
    \ geometric transformations contained in the MATLAB image processing toolbox.\
    \ A geometric transformation (as seen throughout this chapter) modifies the spatial\
    \ relationships between pixels in an image by using operators that map pixel coordinates\
    \ in an input image to new coordinates in the resulting image.\n\nTo change the\
    \ size of an image in MATLAB, the imresize function is implemented. The general\
