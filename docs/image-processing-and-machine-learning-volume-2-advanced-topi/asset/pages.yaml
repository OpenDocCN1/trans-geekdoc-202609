    # ## 2.2 Histogram of an RGB Image


    Histograms are distributions that describe the frequency with which the values
    contained in the image occur [6]. Each value of the histogram is defined as


    ```

    h(i) = the number of pixels in the image with the defined value i

    ```


    for all \(0 \le i < K\) values, where \(K\) is the maximum permissible value to
    describe the data present in the image. This is formally expressed as follows¹:


    ```

    h(i) = card\{(u, v) | I(u, v) = i\}

    ```'
