  md: '# ## 2.14.2 Edge Detection in Color Images Using MATLAB


    For the vectorial calculation of the gradient of a color image, there is no direct
    function implemented in the image processing toolbox. Therefore, the algorithm
    described in the previous section will have to be implemented.


    In this subsection, the implementation of two functions is described. The first
    one is the algorithm for the vectorial calculation of the gradient of a color
    image, while the second one represents the calculation of the gradient of a color
    image, calculating it individually at each plan. This last program has been done
    in order to make a comparison of both methods and show that vector processing
    is more robust.


    Program 2.2 shows the full implementation of the gradcol function that computes
    the vector color gradient M(x, y), and its direction θ(x, y), from an RGB image.


    ```

    ```matlab

    %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

    %Function that allows the vector gradient of a color

    %image from an RGB (rgb) image, the function returns

    %the vector gradient value Gv and its address D

    %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

    function [Gv, Di]=gradcol(rgb)

    %Coefficient matrices for the calculation of the

    %horizontal and vertical gradient (Equation 2.76)

    hx=[1 2 1;0 0 0; -1 -2 -1];

    hy=hx'';

    %RGB is decomposed into its different planes

    R=rgb(:,:,1);

    G=rgb(:,:,2);

    B=rgb(:,:,3);

    %The gradients of each of the planes are obtained,

    %in the horizontal and vertical x y directions.

    Rx=double(imfilter(R,hx));

    Ry=double(imfilter(R,hy));

    Gx=double(imfilter(G,hx));

    Gy=double(imfilter(G,hy));

    Bx=double(imfilter(B,hx));

    By=double(imfilter(B,hy));

    %The cross product defined in 2.79 are performed

    gxx=Rx.^2+Gx.^2+Bx.^2;

    gyy=Ry.^2+Gy.^2+By.^2;

    gxy=Rx.*Ry+Gx.*Gy+Bx.*By;

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 107
  md: '```

    %Get the address from 0 to pi/2 eps is used to avoid

    %division by zero when gxx and gyy are equal

    Di=0.5*(atan(2*gxy./(gxx-gyy+eps)));

    %The magnitude of the gradient M(x,y) is obtained for

    %the directions from 0 to pi/2

    G1=0.5*((gxx+gyy)+(gxx-gyy).*cos(2*A)+2*gxy.*sin(2*A));

    %Address solutions are extended up to pi

    Di=Di+pi/2;

    %The value of M(x,y) is calculated again for

    these directions.

    G2=0.5*((gxx+gyy)+(gxx-gyy).*cos(2*A)+2*gxy.*sin(2*A));

    %The square root is extracted from the gradients

    G1=G1.^0.5;

    G2=G2.^0.5;

    %The maximum of the two gradients is obtained and by

    %means of the mat2gray function it is scaled to the

    interval [0,1]

    Gv=mat2gray(max(G1,G2));

    %The address is also scaled from [0,1]

    Di=mat2gray(Di);

    ```


    Program 2.3 shows the complete implementation of the gradplan function that calculates
    the magnitude of the gradient of a color image. In this implementation, the gradient
