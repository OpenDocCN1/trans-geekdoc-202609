- pgno: 229
  md: 'For example, if you have a matrix A with several columns representing different
    variables, you can use the following code:


    ```

    R = corr(A);

    ```


    This will return a matrix R where the element in the i,j position gives the correlation
    between the i-th and j-th columns of A. Note that the corr function uses the Pearson
    correlation coefficient by default, which assumes that the data is normally distributed
    and linear relationship between the variables. If your data does not meet these
    assumptions, you may consider using other types of correlation.


    Covariance and correlation are two concepts that are closely related. Covariance
    is a measure of the degree to which two variables vary together. A positive covariance
    indicates that the variables tend to increase or decrease together, while a negative
    covariance indicates that the variables tend to move in opposite directions. The
    unit of measurement for covariance is the product of the units of the two variables.


    Correlation, on the other hand, is a standardized measure of the degree to which
    two variables are related. It is the ratio of the covariance of the two variables
    to the product of their standard deviations. Correlation takes on a value between
    -1 and 1, with -1 indicating a perfect negative linear relationship, 0 indicating
    no relationship, and 1 indicating a perfect positive linear relationship.


    Both covariance and correlation are useful for understanding the relationship
    between two variables, but correlation is generally more useful for comparing
    the strength of the relationship between different pairs of variables because
    it is standardized and independent of the unit of measurement. You can compute
    the covariance matrix from a given correlation matrix by using the formula


    ```

    S = D R D (6.15)

    ```


    where R is the correlation matrix, D is a diagonal matrix of standard deviations,
    and C is the covariance matrix.


    Considering that the mean X value of the elements in Table 6.1 are (19.05, 1.57)'',
    the eigenvalues of S are defined as lambda1 = 57.44 and lambda2 = 0.42. The corresponding
    normalized eigenvectors are e1 ~= (0.99, 0.09)'' and e2 ~= (0.09, -0.99)''. Therefore,
    the principal components of S have the following components:


    ```

    Y1 = e1''(X - Xbar) = 0.99(X1 - 19.05) + 0.09(X2 - 0.42)

    Y2 = e2''(X - Xbar) = 0.09(X1 - 19.05) - 0.99(X2 - 0.42). (6.16)

    ```


    The variance of a principal component is defined by the eigenvalue of S.


    ```

    var(Y1) = lambda1 = 57.44 and var(Y2) = lambda2 = 0.42. (6.17)

    ```'
