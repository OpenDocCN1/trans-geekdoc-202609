    # 5.4.5 Merging of Not Representative Groups


    After the execution of MS, several groups are generated. Nevertheless, some of
    them are not visually representative. Such clusters are insignificant with regard
    to the number of included elements. Therefore, it is important to eliminate such
    clusters through their combination. The idea is to merge clusters with low concentrations
    with other groups that share similar characteristics in order to maintain the
    visual information. The objective is to keep the cluster with “enough density”
    while the remainder is merged.


    To determine the number of data points that define a representative group is comparable
    to identifying the knee point in system engineering. The knee position describes
    the “right decision point” at which the relative magnitude of an element is no
    longer meaningful in terms of its contribution. There are not several methods
    for identifying knee points listed in the literature [60,61]. Among them, in this
    chapter, we employ the scheme presented in Ref. [60] due to its simplicity. In
    this method, a group **E** of c components are generated (**E** = (**e**<sub>1</sub>,...,
    **e**<sub>c</sub>). Every element **e**<sub>w</sub> = \(\left( e_w^x, e_w^y \right)\)
    relates the cluster information as indicated by Equation 5.17.


    \(e_w^x = \frac{w}{c}; \quad e_w^y = \frac{|\mathbf{X}_k^{New}|}{\sum_{i=1}^c
    |\mathbf{X}_i^{New}|}, \quad w = f\left( \left| \mathbf{X}_k^{New} \right| \right);
    \quad k \in 1,...,c;\) (5.17)


    where \(|\mathbf{X}_k^{New}|\) symbolizes the number of data within the cluster
    C<sub>k</sub>. \(f\left( \left| \mathbf{X}_k^{New} \right| \right)\) represents
    a function, which calculates the rank of \(\mathbf{X}_k^{New}|\) according to
    the number of elements. Under this formulation, the value of one (\(f\left( \left|
    \mathbf{X}_{high}^{New} \right| \right) = 1\)) is delivered when the group C<sub>high</sub>
    presents the highest number of data. Likewise, the maximal index (\(f\left( \left|
    \mathbf{X}_{low}^{New} \right| \right) = c\)) is designed to the cluster C<sub>low</sub>,
    which contains a minimal number of elements (where high, low \(\in 1,...,c\)).
    The information represented by **e**<sub>w</sub> corresponds to the element distribution
    of the group density. Under such conditions, the element **e**<sub>1</sub> represents
    the group with the highest density level, while the element **e**<sub>c</sub>
    corresponds to the group with the lowest concentration of features (see Figure
    5.6a).


    Assuming **e**<sub>w</sub> (\(w \in 1,...,c\)), an objective function **d**<sub>w</sub>
    = \(\left( d_w^x, d_w^y \right)\) is defined. This function links the increment
    \(e_w^y\) in terms of the significance of the contribution \(e_w^x\). **d**<sub>w</sub>
    is estimated as indicated in Equation 5.18.


    \(d_w^x = e_w^x; \quad d_w^y = e_w^y + e_w^x;\) (5.18)'
