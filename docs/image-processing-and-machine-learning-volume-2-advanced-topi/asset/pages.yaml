- pgno: 219
  md: '# 6

    Singular Value Decomposition

    in Image Processing


    # 6.1 Introduction


    In general terms, the singular value decomposition (SVD) decomposition represents
    a generalization of the mathematical concept of the Fast Fourier Transform (FFT)
    [1]. The FFT is the basis of many classical analytical and numerical results.
    However, its operation assumes idealized configurations or data. On the other
    hand, SVD decomposition is a more generic technique based entirely on data [2].


    In different areas of knowledge, complex systems produce information that can
    be organized in high-dimensional arrays. For example, an experiment can be organized
    into a time series of data that represents a matrix with columns containing all
    the outcome measures. On the other hand, if the data at each instant of time is
    multidimensional, as in the case of an aerodynamic simulator, it is possible to
    reorganize the data in a high-dimensional matrix, forming the columns of the measurements
    of the simulation. Similarly, the pixel values in a grayscale image can be stored
    in a matrix, or these images can be rearranged into large column vectors in a
    matrix to represent the entire image. Although it may not seem like it, the data
    generated by these systems can be simplified by extracting the dominant patterns
    that explain the contained information, and that could make the high dimension
    irrelevant. SVD decomposition is a numerically robust and efficient method to
    extract these patterns from these data. In this chapter, we will introduce the
    SVD decomposition, and we will explain how to apply the SVD in images by means
    of several examples.


    As an example, let''s consider images, which contain a large number of measurements
    (pixels) and are, therefore, high-dimensional vectors. However, most images are
    highly compressible, which means that the relevant information can be represented
    in a much smaller subspace of dimensions. Physical systems also provide compelling
    examples of the low-dimensional structure that sums up a high-dimensional space.
    Although high-fidelity system simulations require thousands of degrees of freedom,
    there are often overriding structures that allow them to be reduced to just a
    few.'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'The SVD provides a systematic way of determining a low-dimensional approximation
    to high-dimensional data in terms of dominant patterns. This technique is data-driven
    in that patterns are discovered only from data, without the addition of expert
    knowledge or intuition. The SVD is numerically stable and provides a hierarchical
    representation of the data in terms of a new coordinate system defined by dominant
    correlations within the data. Furthermore, the SVD is guaranteed to exist for
    any matrix, unlike proper decomposition.


    SVD decomposition has many applications beyond the dimensional reduction of data.
    It is also used to compute the pseudo-inverse of non-square matrices. In this
    way, solutions to indeterminate or over-determined matrix equations of the type
    Ax = b are provided. SVD decomposition can also be used to denoise data sets.


    It is assumed that there is a large data set such as X ∈ R^{m×n}:


    $$\mathbf{X} = [\mathbf{x}_1, ..., \mathbf{x}_m]$$ (6.1)


    The columns of each element x_i ∈ R^n can represent the values of simulations
    or experiments. The column values could contain the grayscale pixels of images
    that have been reordered into vectors. The values of these vectors could also
    consist of the state of a physical system that is evolving in time, such as the
    speed of the system at a set of discrete points.


    The index i represents the set number i of measurements contained in X. It is
    important to note that the dimension n of each vector stored in X is very large,
    in the order of thousands of degrees of freedom. Each vector x_i is known as a
    sample, and m is the number of samples in X. In general, for many systems n >>
    m, which results in a tall and tiny matrix.


    The SVD decomposition is a matrix decomposition that is unique and can be extracted
    for every matrix X ∈ R^{m×n}:


    $$\mathbf{X} = \mathbf{U}\Sigma\mathbf{V}$$ (6.2)


    where U ∈ R^{n×n} and V ∈ R^{m×m} are defined as unitary matrices having orthonormal
    columns. Σ ∈ R^{m×n} is a matrix consisting of positive values on the diagonal
    and zeros outside the diagonal.


    If the condition n ≥ m is fulfilled, the matrix has a maximum of m non-zero elements
    on its diagonal, and it can be written as:


    $$\Sigma = \left[ \begin{array}{c} \bar{\Sigma} \\ 0 \end{array} \right]$$ (6.3)


    With this formulation, it is possible to represent the matrix X using a simpler
    version of the SVD decomposition. This version, also known as the economic version,
    is formulated under the following model:


    $$\mathbf{X} = \mathbf{U}\Sigma\mathbf{V} = [\bar{\mathbf{U}} \quad \mathbf{U}^{\perp}]
    \left[ \begin{array}{c} \bar{\Sigma} \\ 0 \end{array} \right] = \bar{\mathbf{U}}
    \bar{\Sigma} \mathbf{V}$$ (6.4)'
