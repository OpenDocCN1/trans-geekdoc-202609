    # 2.3.5 Conversion from RGB to HSV


    For the conversion of the RGB to HSV color model, the values of the RGB color
    planes are determined, which are typically between 0 and 255. The calculations
    for the conversion consider the following procedure.


    Assuming that:


    ```

    C = max(R, G, B)

    C = min(R, G, B)

    C_{dif} = C_{max} - C_{min}

    ```


    If all the R, G, and B color components have the same value, then it is a gray-scale
    element. Considering this C_{dif} so S = 0, with this, the value of the hue is
    indeterminate.


    If the values of the color planes are normalized such that:


    ```

    R'' = (C_{max} - R) / C_{dif}   G'' = (C_{max} - G) / C_{dif}   B'' = (C_{max}
    - B) / C_{dif}

    ```'
