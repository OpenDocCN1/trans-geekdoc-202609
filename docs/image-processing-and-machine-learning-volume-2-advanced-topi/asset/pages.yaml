  md: 'Histograms correspond to the most straightforward approach for producing feature
    maps in two-dimensional segmentation schemes. They are especially helpful when
    standard parametric models are inadequate. In their construction, the available
    data elements are spatially divided into disjoint sections or bins, while their
    concentration is determined by counting how many data objects fall into each region.
    Although histograms are easy to operate, they present critical disadvantages such
    as low precision and density discontinuity [40].


    The nonparametric kernel density estimator (KDE) is an interesting approach to
    building an unknown feature map. KDE presents many attractive characteristics,
    such as differentiability properties, asymptotic regularity, and continuity and
    well-known mathematical foundations [41,42]. KDE methods, different from histograms,
    generate feature maps with better capacities, such as accuracy and smoother properties.
    Under the operation of KDE, the spatial concentration of each feature is calculated
    by using symmetric functions (kernel functions) that estimate the weighted accumulation
    of local elements. Many kernel functions have been introduced for their operation
    in KDE methods. In general, Gaussian functions are the models most widely used
    in KDE approaches. On the other hand, the Epanechnikov function [43] represents
    another interesting alternative for KDE. This kernel produces the best accuracy
    in the computation of the density map when the number of available elements is
    very limited [43].


    Mean-shift (MS) represents an iterative method used generally for clustering applications
    [44]. In its operation, MS uses two stages [45]. In the first step, the density
    map of the feature distribution is produced. This process is performed with the
    application of a KDE method. Then, through a search strategy, the MS detects the
    locations with the highest concentration. Such points represent the local maximal
    elements of the density map.


    The reliable and robust performance of MS has promoted its application in different
    scenarios, such as image segmentation [46] and image filtering [47]. For segmentation
    purposes, MS identifies similar sections joining pixels that are related to similar
    local maximal values of the density map. Many segmentation methods based on the
    MS scheme have been proposed in the literature. Any examples involve the method
    introduced in [48], where it incorporates a tree-based method with a MS scheme
    for the effective segmentation of boats in infrared images. Another interesting
    proposal has been introduced by Park et al. [49]. In this approach, a segmentation
    technique is produced through the combination of MS and a Gaussian mixture formulation.


    Disregarding its good results, MS presents a critical flaw: its computational
    overload [43,50]. Through its operation, MS estimates the feature map at each
    point by using the contributions of all the available elements. Furthermore, the
    cluster assignment process is achieved with the iteration of a scheme based on
    the gradient method for each point contained in the feature map. These limitations
    make the use of MS prohibited in'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'segmentation applications where the feature map is integrated by multiple characteristics,
    such as those described by histograms of two dimensions. For this reason, the
    MS segmentation algorithms consider only the use of grayscale values (one-dimensional
    data) with other computational techniques [43].


    Under techniques based on one-dimensional and two-dimensional schemes, important
    details in images cannot be correctly segmented. In such conditions, the use of
    more pixel characteristics allows the classification of fine image details, since
    the possibilities of associating pixel characteristics increase. However, the
    employment of more characteristics (dimensions) in the density map expands the
    computational overload of the MS approach significantly. For this reason, the
    diminution of computational time in the MS technique permits it to expand its
    segmentation capabilities through the handling of multi-dimensional feature maps.


    One widely used technique to diminish the investment cost of a computational approach
    is the consideration of only a random subgroup of elements from all available
    data. The idea behind it is to examine the operation of the process by using a
    very small, representative number of data instead of the whole information. After
    that, the partially produced results are extrapolated to involve information not
    used with the approach. Under such conditions, the reduction of the CC is determined
    by the portion of elements used in the operation of the approach in comparison
    with the total available data. Therefore, to obtain lower CCs, the number of used
    elements needs to be reduced until the approach presents a bad performance in
    terms as it has been operated with the complete dataset. This methodology has
    been considered in several schemes, such as the random sample consensus (RANSAC)
    [51] or the random hough transform (RHT) [52], among others.


    In this chapter, a segmentation method for intensity images based on the MS (MS)
    method [44] is explained. In this chapter, it is considered a three-dimensional
    density map that involves the information of the intensity value, the non-local
    mean [53], and the local variance of each pixel from the image. In the process
    of MS, it first generates a density map. This map is produced through the use
    of an Epanechnikov kernel function [43], which allows us to model a density map
    accurately, even with a few data. Then, considering as an initial point the location
    of each feature position, a gradient ascent technique is employed to detect the
    local maxima, which corresponds to its cluster center. To reduce the CC provoked
    by the use of a three-dimensional map, by using schemes that have been successfully
    employed to avoid expensive computations [51,52], the MS scheme is operated considering
    only a representative group of elements randomly sampled from the complete image
    data [50]. For this purpose, two sets of data are produced: operative elements
    (the reduced data employed in the MS operation) and inactive elements (the remainder
    of the available data). Therefore, the results obtained with the operative set
    of elements are generalized to include the not-used'
