    # ## 5.3 Density Attractors Points


    The objective in the determination of a feature map \(\hat{f}(\mathbf{x})\) corresponding
    to a certain data set is to detect the points \(\mathbf{x}_i^*\), which corresponds
    to the central cluster points that better represent the probability distribution
    for the modeled data of \(\hat{f}(\mathbf{x})\). The elements \(\mathbf{x}_i^*\)
    model the local maxima points existent in the computed feature map \(\hat{f}(\mathbf{x})\).
    These points can be identified by using an optimization approach based on gradient
    techniques. Assuming a group \(\mathbf{X}\) of \(d\) points (\(\mathbf{X} = \{
    \mathbf{x}_1, ..., \mathbf{x}_d \}\)), a random element \(\mathbf{x}_j\) is sampled
    (\(j \in 1, ..., d\)). Afterward, a new position \(\mathbf{x}_j^{t+1}\) is estimated
    in the direction to the gradient \(\nabla\hat{f}(\mathbf{x}_j)\) with regard to
    the density. This process is executed as the maximal local position \(\mathbf{x}_i^*\)
    has been obtained. This procedure can be modeled as indicated by Equation 5.7.


    ```

    \(\mathbf{x}_j^{t+1} = \mathbf{x}^t + \delta \cdot \nabla\hat{f}(\mathbf{x}_j^t),
    \quad (5.7)\)

    ```


    where \(t\) represents the iteration number currently in operation and \(\delta\)
    is the step length. In the MS operation, the gradient at any data \(\mathbf{x}\)
    with regard to its density is estimated by calculating the derivate of the PDF
    as it is modeled by Equation 5.8.


    ```

    \(\nabla\hat{f}(\mathbf{x}) = \frac{\partial}{\partial x} \hat{f}(\mathbf{x})
    = \frac{1}{nh} \sum_{i=1}^n \frac{\partial}{\partial x} K\left(\frac{x-x_i}{h}\right)
    \quad (5.8)\)

    ```


    In Equation 5.8, \(n\) corresponds to the data dimension for \(\mathbf{x} = (x_1,
    ..., x_n)\). With the application of the gradient technique to all \(d\) points
    in the dataset \(\mathbf{X}\), many elements will be concentrated at the same
    local maximum \(\mathbf{x}_i^*\). Such data will then be assigned to the cluster
    \(C_i\). After this process, as a result, a list of \(c\) attractor points \(\{\mathbf{x}_1^*,
    ..., \mathbf{x}_c^*\}\) is obtained, where each point \(\mathbf{x}_i^*\) represents
    a group of elements \(\mathbf{X}_i = (\mathbf{x}_a, ..., \mathbf{x}_g)\) that
    are drawn by \(\mathbf{x}_i^* (\mathbf{x}_a, \mathbf{x}_g \in C_i)\). Figure 5.4
    shows a representation of the gradient method to detect the local optima. In this
    figure, the contour illustration of \(\hat{f}(x_1, x_2)\) is shown. Therefore,
    beginning at locations \(\mathbf{x}_p\), \(\mathbf{x}_q\), and \(\mathbf{x}_r\),
    new points are estimated considering orientation as the largest increment of the
    density map \(\hat{f}(x_1, x_2)\). This process is repeated until the local optima
    of \(\mathbf{x}_1^*, \mathbf{x}_2^*\), and \(\mathbf{x}_3^*\) have been obtained.'
