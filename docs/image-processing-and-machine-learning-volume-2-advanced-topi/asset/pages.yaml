  md: 'have little or no correlation or similarity due to the lighting conditions.
    A possibility to avoid this problem consists of considering the local differences
    of these pixel values in relation to their averages instead of only the intensity
    values of the pixels [5]. Therefore, Equation 4.7 is reformulated as follows:


    ```

    $$ C_L(r, s) = \frac{ \sum_{(i,j) \in R} \left( I(r+i, s+j) - \bar{I}(r, s) \right)
    \cdot \left( R(i, j) - \bar{R} \right) }{ \left[ \sum_{(i,j) \in R} \left( I(r+i,
    s+j) - \bar{I}(r, s) \right)^2 \right]^{1/2} \cdot \left[ \sum_{(i,j) \in R} \left(
    R(i, j) - \bar{R} \right)^2 \right]^{1/2} } $$

    ```


    where \(\bar{I}(r, s)\) and \(\bar{R}\) are defined as follows:


    ```

    $$ \bar{I}(r, s) = \frac{1}{N} \sum_{(i,j) \in R} I(r+i, s+j) \qquad \bar{R} =
    \frac{1}{N} \sum_{(i,j) \in R} R(i, j) $$

    ```


    where N corresponds to the number of elements in the reference image R(i, j).
    Equation 4.8 is known in the field of statistics as the correlation coefficient.
    The correlation coefficient cannot be considered as a global correlation index
    that evaluates the general data set but rather a local factor that considers only
    sections explicitly determined by the size of the reference image. The range of
    values in which the correlation coefficient fluctuates is [-1,1], where the value
    of 1 represents the highest similarity index, while -1 represents that I(x, y)
    and R(i, j) are totally different.


    The denominator of Equation 4.8 contains the expression:


    ```

    $$ \sigma_R^2 = \sum_{(i,j) \in R} (R(i, j) - \bar{R})^2 = \sum_{(i,j) \in R}
    (R(i, j))^2 - N \cdot \bar{R}^2 $$

    ```


    Equation 4.10 corresponds to the variance of the pattern R(i, j). This value is
    constant in the processing of the values of C_L(r, s), so it should only be calculated
    once. Through the substitution of this factor in Equation 4.8, the expression
    would be reformulated as follows:


    ```

