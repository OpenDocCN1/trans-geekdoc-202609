    elements from F(x,y). The objective is to obtain a small amount of similar data
    results, as the MS has been operated with the complete dataset. For this purpose,
    the whole set of characteristics F is classified into two sets: operative elements
    O and inactive elements Ō. The set of operative data O includes the elements considered
