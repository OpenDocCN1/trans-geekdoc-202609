    # 2.4 The YUV, YIQ, and YCbCr Color Models


    The YUV, YIQ, and YCbCr color models are used for image standardization in the
    field of television. The YUV and YIQ models are the basis of the color encoding
    used in the NTSC and PAL systems, while the YCbCr model is part of the standard
    for digital television. In all these color models, the components that define
    it consist of three planes: that of light and two other so-called chromatic components,
    which encode color differences in them. Through this definition of color, it is
    possible to have compatibility with previous black-and-white television systems
    and, at the same time, allow the use of signals that handle color images. Because
    the human eye is unable to distinguish sharpness in colors with such precision
    and, conversely, is more sensitive to brightness, the bandwidth for defining color
    components can be significantly reduced. This situation is used by color compression
    algorithms, such as the JPEG format, which has an RGB to YCbCr converter as part
    of the algorithm. However, although the YCbCr model is widely used in image processing,
    mainly in compression applications, the YUV and YIQ models are not used to the
    same degree.


    # 2.4.1 The YUV Model


    The YUV model represents the basis for color coding in both America''s NTSC and
    Europe''s PAL video systems. The luminance component is defined from the RGB components
    by the equation:


    Y(x, y) = 0.299R(x, y) + 0.587G(x, y) + 0.114B(x, y) (2.28)


    where it is considered that the RGB values were already corrected by the Gamma
    factors Gamma($\gamma_{PAL} = 2.2$ and $\gamma_{NTSC} = 2.8$) necessary for television
    reproduction. The UV components are linear factors of the difference between the
    luminance value and the red and blue color planes of the RGB model. These values
    are defined as follows:


    U(x, y) = 0.492(B(x, y) - Y(x, y)) V(x, y) = 0.877(R(x, y) - Y(x, y)) (2.29)


    Considering the equations defined both for the luminance (Y(x, y)) as well as
    for the chromatic components (U(x, y), V(x, y)), it can be defined as the transformation
    matrix:'
