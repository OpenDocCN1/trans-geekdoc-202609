    # ## 4.1.3 The Normalized Cross-Correlation


    In practice, the assumption that _A_ (_r_, _s_) remains approximately constant
    in the image is not fulfilled. Therefore, the result of the correlation is highly
    dependent on the intensity changes of the image _I_ (_x_, _y_) [4]. The normalized
    cross-correlation _C<sub>N</sub>_ (_r_, _s_) compensates for this dependence through
    the consideration of the total energy of the image. The normalized cross-correlation
    is defined as follows:


    ```

    \( C_N(r,s) = \frac{C(r,s)}{\sqrt{A(r,s) \cdot B}} = \frac{C(r,s)}{\sqrt{A(r,s)
    \cdot \sqrt{B}}} \)

    \( = \frac{\sum_{(i,j)\in R} I(r+i,s+j) \cdot R(i,j)}{\left[\sum_{(i,j)\in R}
    \left(I(r+i,s+j)\right)^2\right]^{1/2} \cdot \left[\sum_{(i,j)\in R} \left(R(i,j)\right)^2\right]^{1/2}}
    \)

    (4.7)

    ```


    Since the values of both the image _I_ (_x_, _y_) and the reference _R_ (_i_,
    _j_) are positive, the resulting values of _C<sub>N</sub>_ (_r_, _s_) are within
    the interval [0,1]. A value of _C<sub>N</sub>_ (_r_, _s_) = 1 represents a maximum
    index of similarity between _R_ (_i_, _j_) and the section of the image _I_ (_x_,
    _y_) with which it corresponds. The value produced by the normalized cross-correlation
    has the advantage that it can be used as a standard similarity index.'
