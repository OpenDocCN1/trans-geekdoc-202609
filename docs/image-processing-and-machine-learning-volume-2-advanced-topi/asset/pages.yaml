    d’Éclairage,” which is today the basis of most of the calibrated models used today.


    The color model was developed from numerous measurements performed under strict
    conditions. The model consists of three virtual primary colors X, Y, and Z, which
    are chosen in such a way that all colors and combinations can be described by
    positive components. The colors defined by this scheme'
