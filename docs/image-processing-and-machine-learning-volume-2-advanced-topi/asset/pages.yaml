  md: '![](img/fa2d7e8bd88af7122f764c748b0a3723_221_0.png)


    FIGURE 6.1

    Process of the (a) generic SVD decomposition and the (b) simple decomposition.


    Figure 6.1 visually shows the process of the generic SVD decomposition and the
    simple decomposition. The columns that belong to the matrix $\mathbf{U}^\perp$
    correspond to vectors in the space that are complementary and orthogonal to the
    vectors that correspond to the matrix $\bar{\mathbf{U}}$. The columns of matrix
    $\mathbf{U}$ are known as the singular vectors on the left of the original matrix
    X. On the other hand, the columns of matrix $\mathbf{V}$ are known as the singular
    vectors on the right, which correspond to the original matrix $\mathbf{X}$. Finally,
    the elements of the main diagonal of the matrix $\bar{\mathbf{\Sigma}} \in \mathbb{R}^{m
    \times m}$ are called singular values. It is common to order eigenvalues from
    largest to smallest. An eigenvalue with a higher value implies that it better
    explains the variability of the original data stored in $\mathbf{X}$ than one
    with a lower value. The range that $\mathbf{X}$ has must be equal to the number
    of singular values in $\bar{\mathbf{\Sigma}}$ distinct from zero.


    # 6.2 Computing the SVD Elements


    The SVD represents one of the most important concepts in different areas of science
    and engineering. The computation of the SVD is so important that'
