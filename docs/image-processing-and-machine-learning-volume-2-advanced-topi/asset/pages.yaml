    by truncating the matrices at different levels for these matrices. To observe
    the levels of comprehension, r = 15, 50, 100 will be chosen. To see the approximations,
    the MATLAB code of Program 6.1 should be executed.


    There are two important elements of Program 6.1 that must be explained. The first
    and very important one is to convert the values that represent the pixels of the
    image into floating point numbers. Images are typically'
