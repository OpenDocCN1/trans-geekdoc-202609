- pgno: 215
  md: 'information from complex data distributions. Under such conditions, it is possible
    to group difficult pixel data, such as texturized regions or areas of noise. The
    third factor is the operation of blending clusters with a minimal number of elements.
    Under this operation, noise pixels can be joined to the object to which they actually
    belong. Therefore, the segmentation results have a better capacity to include
    imprecise information corresponding to pixels contaminated by common noise. In
    spite of its interesting results, the MULTI-SEGM scheme maintains a limitation.
    Such a disadvantage represents the complexity of its processes. In comparison
    with other schemes that consider simple histogram computations, the operations
    involved in the MULTI-SEGM are difficult to understand. This fact can limit its
    use to practitioners and application engineers. However, its segmentation results
    justify the use of these mechanisms, mainly when the method is used in segmentation
    images that demand complex clustering scenarios.


