    a search strategy where the optimal displacement $(r,s)$ is found as quickly as
    possible. Finally, it must be decided what the minimum value of similarity that
    ensures a reliable match between both images is. Each of these points will be
    discussed in the following sections.


    # 4.1.1 Distance between Patterns


    To determine the point where there is the maximum coincidence between $I(x,y)$
    and $R(i,j)$, it is necessary to identify the distance between the displaced reference
    $R_{r,s}$ and the corresponding section of the image for each position $(r,s)$
    (see Figure 4.2). To measure the distance between two two-dimensional elements,
    there are different indexes. Only the most important ones will be described below.


    The sum of the differences:


    ```

    $d_A(r,s) = \sum_{(i,j)\in R} |I(r+i, s+j) - R(i,j)| \quad \text{(4.1)}$

    ```'
