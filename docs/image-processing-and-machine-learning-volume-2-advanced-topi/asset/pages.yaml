    Different from spatial filters (Chapter 2), it is generally impossible to create
    two-dimensional isotropic² filters H from one-dimensional reference structures
    Hx and Hy. This is due to the fact that the morphological operation that is established
    between both reference structures always produces a new square reference structure
    and is, therefore, not isotropic.


    The most commonly used method for the implementation of morphological filters
    in large dimensions is the iterative application of the same reference structure
