    # PROGRAM 2.3 GRADPLAN FUNCTION THAT CALCULATES

    THE MAGNITUDE OF THE GRADIENT INDEPENDENTLY

    FOR EACH PLANE DEFINED IN THE COLOR IMAGE


    ```

    %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

    %Function that allows the gradient computation of each

    plane

    % of an RGB (rgb) image. The function returns the

    gradient value Gp

    %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

    function [Gp]=gradplan(rgb)

    % Coefficient matrices for calculating the horizontal

    % and vertical gradient (Equation 2.69)

    hx=[1 2 1;0 0 0; -1 -2 -1];

    hy=hx’;

    %The image RGB is divided into different planes

    R=rgb(:,:,1);

    G=rgb(:,:,2);

    B=rgb(:,:,3);

    % The gradients of each plane are obtained.

    ```'
