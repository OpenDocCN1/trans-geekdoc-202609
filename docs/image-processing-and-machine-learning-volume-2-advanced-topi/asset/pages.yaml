    **FIGURE 5.2**

    Distinct kernel functions: Normal kernel \( K_G(x) \) and Epanechnikov kernel
    \( K_E(x) \).


    On the other hand, the Epanechnikov kernel \( K_E(x) \) (see Figure 5.2) [43]
    is an alternative for KDE due to its interesting properties. \( K_E(x) \) is defined
    in Equation 5.5.


    ```

    \( K_E(x) = \begin{cases} \left( \frac{3}{4} \right)(1 - x^2) & \text{if } |x|
    \le 1 \\ 0 & \text{otherwise} \end{cases} \quad (5.5) \)

    ```


    A generic form to assess the modeling accuracy of a kernel scheme is the evaluation
    of the mean-squared error (MSE) generated between the density feature map \( f(\mathbf{x})
    \) to be modeled and the estimated density \( \hat{f}(\mathbf{x}) \) obtained
    for a determined kernel formulation. This modeling precision can be computed using
    Equation 5.6.


    ```

    \( MSE\left( \hat{f}(\mathbf{x}) \right) = \frac{1}{n} \sum_{i=1}^n \left( \hat{f}(\mathbf{x}_i)
    - f(\mathbf{x}_i) \right)^2 \quad (5.6) \)

