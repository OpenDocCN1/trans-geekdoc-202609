    # ## 2.3.3 Reducing Saturation of a Color Image


    To reduce the saturation of an RGB image, the grayscale image is extracted, and
    a linear interpolation is performed on the differences between the color plane
    and the intensity version. Such a process can be expressed as follows:


    ```

    \left( \begin{array}{c} R_D(x, y) \\ G_D(x, y) \\ B_D(x, y) \end{array} \right)
    = \left( \begin{array}{c} E(x, y) \\ E(x, y) \\ E(x, y) \end{array} \right) +
    Fac \cdot \left( \begin{array}{c} R(x, y) - E(x, y) \\ G(x, y) - E(x, y) \\ B(x,
    y) - E(x, y) \end{array} \right)

    (2.12)

    ```


    where \( Fac \in [0, 1] \) is a factor that controls the result obtained. The
    gradual increase in \( Fac \) characterizes the desaturation of the color image.
    A value of \( Fac = 0 \) removes each coloration and produces an image of intensity;
    with a value of \( Fac = 1 \), the plane values remain unchanged. Figure 2.8 shows
    examples of color images that have had their saturation reduced using different
    values of the factor \( Fac \).


    # ## 2.3.4 HSV and HSL Color Model


    In the HSV color model, color information is represented through three components:
    Tonality (Hue), Saturation (Saturation), and Value (Value). This color model is
    also known as HSV and is mainly used by Adobe products [8]. The HSV model is traditionally
    represented through an inverted pyramid (Figure 2.9), where the vertical axis
    represents the value (V), the horizontal distance taking the V-axis as a reference
    corresponds to the saturation, and the angle that is established as a point of
    rotation by the V-axis defines the tonality. The point that corresponds to black
    in the HSV model is located at the peak of the inverted pyramid, and the point
    that corresponds to white is located in the central part of the base of the pyramid.
    The three basic colors, red, green, and blue, and their respective combinations
    of yellow, cyan, and magenta, are distributed at the base of the pyramid.


    The HSL color model (Hue, Luminance, and Saturation, “Hue,” “Luminance,” “Saturation”)
    is very similar to the HSV model, even identical in the Hue value. The luminance
    and saturation parameters correspond to the vertical axis and the radius that
    is established between the luminance axis and the value of the color in question.
    Despite the similarity of both models, the way of calculating the value of the
    parameters is very different'
