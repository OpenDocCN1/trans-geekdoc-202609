    # 2.4.2 The YIQ Model


    A variant of the YUV system is the YIQ system, where \(I\) implies the phase and
    \(Q\) the quadrature. The values of \(I\) and \(Q\) are derived from the values
    of \(U\) and \(V\), applying a geometric transformation, where the \(U\) and \(V\)
    planes are rotated 33° and mirror-inverted. This is defined as follows:


    \(\begin{bmatrix} I(x, y) \\ Q(x, y) \end{bmatrix} = \begin{bmatrix} 0 & 1 \\
    1 & 0 \end{bmatrix} \begin{bmatrix} \cos \beta & \sin \beta \\ -\sin \beta & \cos
    \beta \end{bmatrix} \begin{bmatrix} U(x, y) \\ V(x, y) \end{bmatrix}\) (2.32)


    where \(\beta = 0.576\) (33). The component represents the same value as the one
    defined in the YUV model. This YIQ model is better compared to the bandwidth needed
    for YUV color rendering. However, its use was practically eliminated by the YUV
    model.


    # 2.4.3 The YCbCr Model


    The YCbCr color space is a variant of the YUV model used as a standard for color
    coding in digital television. The chromatic components are similar to their \(U\)
    and \(V\) counterparts. That is, they are conceived as differences between the
    luminance value and the \(R\) and \(B\) color planes. However, unlike the \(U\)
    and \(V\) planes, different factors are used that affect the existing difference.
    The equations used to calculate this color model are the following:


    \(Y(x, y) = w_R R(x,y) + (1 - w_B - w_R) G(x,y) + w_B B(x,y)\)


    \(C_b = \frac{0.5}{1 - w_B}(B(x,y) - Y(x,y))\) (2.33)


    \(C_r = \frac{0.5}{1 - w_R}(R(x,y) - Y(x,y))\)'
