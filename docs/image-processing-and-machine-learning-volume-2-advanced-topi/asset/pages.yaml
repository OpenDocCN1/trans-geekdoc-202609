    x_3 + a_{22} \cdot y_3 + a_{23}

    ```


    This system has a solution under the condition that the three points \(\begin{pmatrix}
    x_1, x''_1 \end{pmatrix}\), \(\begin{pmatrix} x_2, x''_2 \end{pmatrix}\) and \(\begin{pmatrix}
    x_3, x''_3 \end{pmatrix}\) must be linearly independent, which means that they
    must not be located on the same line. Solving this system of equations, we get:'
