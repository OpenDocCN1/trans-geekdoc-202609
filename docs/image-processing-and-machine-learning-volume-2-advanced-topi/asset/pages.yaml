    # ## 2.1.3 Indexed Images


    An indexed image can contain a restricted number of colors, making this type of
    image attractive for the representation of graphics or images of the GIF or PNG
    type, which are characterized by being light from the point of view of storage
    [5]. An indexed image has two components: a data array and a color map. The color
    map is a matrix of dimensions \(n\times3\). The length \(n\) of the palette is
    equal to the number of colors that it defines. They refer to the colors used to
    define the images. At the same time, each column specifies the value of the RGB
    color components defined in that line. Considering the above, an indexed image
    uses a direct mapping of the intensity pixels contained in the data matrix to
    the values contained by the color palette. The color of each pixel is determined
    by the integer value of the data array, which will actually be the index pointing
    to the colormap.


    An indexed image is stored using the data array and the palette that defines its
    contained colors. This is important as the values contained in the data array
    have no meaning in the absence of the color palette. Figure 2.5 shows the relationship
    between the data matrix and the color palette.'
