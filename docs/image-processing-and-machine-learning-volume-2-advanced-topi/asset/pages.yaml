- pgno: 57
  md: '# 2.2.1 Histogram of RGB Images in MATLAB


    When analyzing RGB images, it is particularly important to be able to display

    the color content, characterized as the distribution of the data contained in

    each of the different R, G, and B planes. The traditional way of performing

    this task would be to find the histogram of each one of the planes, just as if

    it were an image of intensity. However, although this process allows us to

    find out important characteristics of the color distribution, it is not possible

    to adequately observe this distribution so that the contents of the different

    planes can be compared. Therefore, it is suggested to perform a function that

    allows the histogram of the different planes to be graphed in a concatenated

    manner. Program 2.1 shows the configuration of this function.


    ```

    PROGRAM 2.1 THE PROGRAM IN MATLAB

    TO PLOT THE HISTOGRAM OF THE R, G, AND

    B PLANES IN AN INTERCALATED WAY


    %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

    %Function that allows graphing the histograms of

    %the different planes R, G and B in a concatenated way

    %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

    function varargout = rgbhist(I)


    %It is verified that image I is

    %RGB, that is, that it has 3 planes

    if (size(I, 3) ~= 3)

    error(''The image must be RGB'')

    end


    %256 values are set representing

    %the allowable data type depth

    nBins = 256;

    %Find the histograms for each plane R G B

    rHist = imhist(I(:, :, 1), nBins);

    gHist = imhist(I(:, :, 2), nBins);

    bHist = imhist(I(:, :, 3), nBins);

    %the graphic object is created

    figure

    hold on

    %Histogram information is displayed.

    h(1) = stem(1:256, rHist);

    h(2) = stem(1:256 + 1/3, gHist);

    h(3) = stem(1:256 + 2/3, bHist);

    %A color is established for each of them

    %that correspond to the value they represent.

    set(h(1), ''color'', [1 0 0])

    set(h(2), ''color'', [0 1 0])

    set(h(3), ''color'', [0 0 1])

    ```'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# 2.3 Color Models and Color Space Conversions


    The RGB color model, from the programmer perspective, is a simple way of representing
    data, which is totally oriented to the way colors are displayed on a computer.
    Although the RGB model is very simple, it hardly considers how colors are captured,
    in addition to being highly sensitive to changes in lighting [7].


    Because important color characteristics such as hue, lighting, and others are
    implicitly defined in the RGB model, it makes it difficult to consider these factors
    in images that are specified in this color model. Alternative models such as HSV
    facilitate the characterization of these properties since, in HSV, features such
    as saturation, lightness, and hue are explicitly found as parts of the model.


    Figure 2.7 shows, as an example, the distribution of colors in an image in the
    RGB and HSV color models. The description of their relationships, common characteristics,
    and differences will be discussed later.


    # 2.3.1 Converting an RGB Image to Grayscale


    The conversion from an RGB image to a grayscale is done through a calculation
    that results from considering an equivalent combination of the values


    ![](img/fa2d7e8bd88af7122f764c748b0a3723_58_0.png)


    ![](img/fa2d7e8bd88af7122f764c748b0a3723_58_1.png)


    ![](img/fa2d7e8bd88af7122f764c748b0a3723_58_2.png)


    FIGURE 2.7

    Color distributions of an image in different color models. (a) Original image,
    (b) distribution in the RGB model, and (c) distribution in the HSV model.'
