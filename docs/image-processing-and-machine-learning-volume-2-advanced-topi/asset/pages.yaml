    For each index, a MATLAB® program is implemented. The implementation vmethodology
    of these indexes exemplifies the way to develop more complex algorithms to identify
    patterns using techniques that use distance measures as similarity criteria. Program
    4.1 shows how to calculate the sum of differences between an image and a reference
    pattern.'
