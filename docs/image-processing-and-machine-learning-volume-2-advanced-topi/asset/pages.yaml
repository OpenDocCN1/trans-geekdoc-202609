    # ## 6.4 SVD for Image Compression


    The approximation property of a data set that presents an SVD decomposition can
    be used to compress images [4]. This property represents the fact that large data
    sets maintain consistent patterns that allow approximating the total data set
    with only the presence of these patterns. Images represent large data sets with
    consistent patterns and redundant information. A grayscale image can be thought
    of as a real-valued matrix \(\mathbf{X} \in \mathbb{R}^{m \times n}\), where \(n\)
    and \(m\) represent the number of rows and columns, respectively.


    Assume the image shown in Figure 6.3. This image has a resolution of 960x1208
    pixels. To observe the effects of compression, the image will be broken down into
    its SVD components. In this way, assuming that the image is stored in the MATLAB
    variable I1, the following MATLAB commands are executed:


    ```

    X=I1 ;

    [ S , V , D]=svd (X) ;

    ```


