  md: '# # 4


    Comparison and Recognition of Images


    When it is necessary to compare one image with another or to identify if a certain
    pattern is contained in an image, the question is: How can the similarity between
    two certain images be evaluated? Evidently, it can be defined in a simple way
    that two images I1 and I2 are equal, if the difference between both images I1
    – I2 is zero.


    The difference between two images can be useful for detecting changes in consecutive
    images that have constant illumination. However, this very simple way of defining
    the comparison is far from being reliable in determining an index of similarity
    between images [1]. This is due to the fact that a simple change in the global
    illumination of the image, a displacement of the contained object, or a small
    rotation can cause the difference I1 – I2 to present a considerable value [2].
    Despite this high difference, both images, in the opinion of a human observer,
    are the same. The comparison between images, therefore, cannot be considered a
    simple problem and formulates one of the most interesting research topics in image
    processing and computer vision [3].


    The chapter describes the different similarity measures used for image comparison.


    # ## 4.1 Comparison in Grayscale Images


    First, the problem of finding a reference image R(i, j) (Pattern) in a grayscale
    image I(x, y) will be addressed. The task is to find the pixel (u, v) of the image
    I(x, y) in which there is an optimal match between the contents of the segment
    of I(x, y) and the reference image R(i, j). If Rr,s(i, j) = R(i – r, j – s) is
    defined as a displacement (r, s) in the horizontal and vertical directions, then
    the problem of comparing images in grayscale can be stated as follows:


    Defining I(x, y) as the image that probably contains a given pattern R(i, j).
    We must find the displacement(r, s) where the evaluation of similarity between
    the pattern R(i, j) and the image segment that covers R(i, j) is maximum (see
    Figure 4.1).


    In order to design an algorithm that solves the previous problem, it is necessary
    to consider three important situations: First, an appropriate definition of a
    measure of similarity between the two images is needed. Second,'
