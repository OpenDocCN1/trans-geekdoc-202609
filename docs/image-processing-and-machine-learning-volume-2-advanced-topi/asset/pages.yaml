    # 6.7 Principal Components through Correlation


    It is also possible to calculate the principal components through the correlation
    matrix \(\mathbf{R}\). In order to exemplify this concept, consider the data in
    Table 6.1. Then, by using the function \(\text{corr}\), the following matrix is
    found:


    ```

    \(\mathbf{R} = \begin{pmatrix} 1 & 0.72 \\ 0.72 & 1 \end{pmatrix}\)

    ```


    \(\mathbf{R}\) has as eigenvalues \(\lambda_1 = 1.72\), \(\lambda_2 = 0.28\) and
    as eigenvectors


    ```

    \(\mathbf{e}_1 = (0.71, 0.71)'' \quad \text{and} \quad \mathbf{e}_2 = (-0.71,
    0.71)''.\)

    ```


    Therefore, the principal components from \(\mathbf{R}\) are calculated as follows:


    ```

    \(Y_1 = \mathbf{e}_1''\mathbf{Z} = 0.71Z_1 + 0.71Z_2\)

    \(Y_2 = \mathbf{e}_2''\mathbf{Z} = -0.71Z_1 + 0.71Z_2,\)

    ```


    where \(Z_1 = (X_i - 19.05) / 7.55\), \(Z_2 = (X_2 - 1.57) / 0.94\), and \(\mathbf{Z}
    = (Z_1, Z_2)''\) is the standardized vector \(\mathbf{X}\).'
