    \end{pmatrix}\), \(\begin{pmatrix} x_2, x''_2 \end{pmatrix}\) and \(\begin{pmatrix}
    x_3, x''_3 \end{pmatrix}\), where \(x_i = (x_i, y_i)\) corresponds to the points
    of the original image while \(x''_i = (x''_i, y''_i)\) corresponds to the transformed
    image. The parameters of the transform are obtained from the solution of the following
    system of equations:


    ```

    x''_1 = a_{11} \cdot x_1 + a_{12} \cdot y_1 + a_{13} \qquad y''_1 = a_{21} \cdot
    x_1 + a_{22} \cdot y_1 + a_{23}

