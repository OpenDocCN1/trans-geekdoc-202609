- pgno: 105
  md: 'An important observation results from the fact that both $R$, $G$, and $B$,
    as well as the values of $g_{xx}$ $g_{yy}$ and $g_{xy}$ are functions that depend
    on $x$ and $y$. Considering the previous notation, Di Zenso showed that the direction
    where the maximum value of change of the color vector $c(x, y)$ is found as a
    function of $(x, y)$ is defined as follows:


    $\theta(x, y) = \frac{1}{2} \tan^{-1} \left[ \frac{2g_{xy}}{(g_{xx} - g_{yy})}
    \right]$ (2.80)


    While the maximum value $M(x, y)$ of the gradient occurs in the $\theta(x, y)$
    direction. $M(x, y)$ is calculated as follows:


    $M(x, y) = \left\{ \frac{1}{2} \left[ (g_{xx} + g_{yy}) + (g_{xx} - g_{yy}) \cos(2\theta)
    + 2g_{xy} \sin(2\theta) \right] \right\}$ (2.81)


    It is important to note that both $\theta(x, y)$ and $M(x, y)$ produce matrices
    of the same dimension as the color image whose edges need to be found.


    Because $\tan(\alpha) = \tan(\alpha \pm \pi)$, if $\theta$ is a solution of Equation
    2.80, then $\theta_A + \pi / 2$ is also a solution. Considering this, it is true
    that $M_{\theta}(x, y) = M_{\theta+\pi/2}(x, y)$. Assuming this property, $M(x,
    y)$ should be calculated only in the middle of the interval $[0, \pi]$. Therefore,
    the other values can be found by recalculating the values of $M(x, y)$, but this
    time considering $\theta + \pi / 2$. If the calculation is carried out as described
    in the previous procedure, there will be two matrices with the values of the gradients
    $M_{\theta}(x, y)$ and $M_{\theta+\pi/2}(x, y)$. For the final calculation, the
    maximum of the two will be considered. Figure 2.32 shows the vector gradient magnitude
    and direction calculated from the algorithm described above.


