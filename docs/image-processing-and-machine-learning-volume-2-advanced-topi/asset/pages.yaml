- pgno: 210
  md: 'A close inspection of Figure 5.8 demonstrates that the MULTI-SEGM method maintains
    a better visual perception compared with the other methods. In all images, even
    texturized elements are clearly segmented, while the other algorithms are unable
    to integrate such structures. This remarkable performance is a consequence of
    its segmentation mechanism, which involves the use of different pixel characteristics.
    This extension means that texturized elements or components with bad illumination
    conditions can be segmented as homogeneous regions. In spite of the good results
    of the MS method, there are situations in which elements of a small cluster are
    assigned to other big clusters, producing artificial results. This fact is generated
    because the distance between their centers is high (even this distance is the
    minimal found among the representative clusters). This problem could be solved
    by considering a permissible threshold from which it is better to join irrelevant
    clusters than merge them with representative clusters.


    Table 5.2 exhibits the performance results of all methods for images \(I_1 - I_{10}\)
    from Figure 5.8. The table reports the performance indexes in terms of \(AD\),
    \(FSIM\), \(MD\), \(NK\), \(MSE\), \(NAE\), \(SC\), \(SSIM\), and \(PSNR\) and
    CC Considering Table 5.2, it is evident that the MS method presents better performance
    index values than the other segmentation schemes. In general terms, the approaches
    CS, PSO, and SFS present bad segmentation results. This fact demonstrates that
    these schemes require execution at different times in order to present consistent
    information. If they are executed only once, the probability of getting a suboptimal
    solution is high. As a result of this condition, these methods frequently generate
    inconsistent performance values. In the case of the FCM method, it presents a
    competitive performance in most of the indexes. Nevertheless, it exhibits worse
    segmentation results in comparison with the MS MULTI-SEGM method. According to
    Table 5.2, except for the PSO, the MS method produces the lowest CC compared with
    other segmentation techniques. Therefore, it can be said that the MS MULTI-SEGM
    presents the best trade-off between accuracy and velocity.


    After an analysis of Tables 5.1 and 5.2, it is observed that the MS MULTI-SEGM
    scheme presents the best-averaged values among the considered algorithms. Its
    results have demonstrated that it reaches the best values with regard to the \(AD\),
    \(FSIM\), \(MD\), \(NK\), \(MSE\), \(NAE\), \(SC\), \(SSIM\), and \(PSNR\) indexes.
    The approaches the CS and the SFS present the second place in terms of most of
    the performance indexes, while the PSO and FCM methods produce the worst results.
    According to the CC, it is evident that the PSO scheme is the fastest method to
    obtain a segmented image, while the MULTI-SEGM is the method that exhibits the
    next best performance. On the other hand, SFS, CS, and FCM techniques obtain the
    highest CC values. The main reason for the excessive use of the computational
    time of the SFS, CS is the high amount of necessary iterations for obtaining a
    competitive result. In these approaches, a high number of function evaluations
    is required before convergence. Likewise, the FCM method consumes a considerable
    elapsed time due to the number of operations in which it divides its segmentation
    processes.'
