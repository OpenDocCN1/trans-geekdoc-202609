    The imerode function implements the erosion operation, and its basic syntax is
    as follows:


    ```

    IR=imerode(I,H)

    ```


    where I is the image to which the erosion is applied using H as the reference
    structure. IR is the eroded image. If I is a binary image then IR will also be
    binary, while if I is an image of IR intensity, it will be too.


    In order to show how to use the dilation and erosion functions, an example has
    been conducted. In this example, the morphological gradient (Section 1.5.2) of
    a grayscale image is implemented. Assuming that I is the image from which you
    want to extract the morphological gradient, the following commands are used:


    ```

    >>H=strel(''square'',3);

    >>I1=imdilate(I,H);

    >>I2=imerode(I,H);

    >>IG=I1-I2;

    ```


    where H is the reference structure that is generated considering a square shape
    of dimension 3. When dilation and erosion are obtained using the same image and
    the same reference structure, a subtraction is produced between the dilated and
    eroded versions of the image, thus finding the morphological gradient of I.


    # 1.6.3 MATLAB Functions Involving the Open and Close Operations


    The imopen and imclose functions implement the opening and closing operations.
    The basic syntaxes of these functions are as follows:


    ```

    IR=imopen(I,H)

    IR=imclose(I,H)

    ```


    where I is the image to which the opening or closing is applied using H as a reference
    structure. IR is the resulting image, if I is a binary image, then the result
    IR is binary, while if I is a grayscale image, the resulting IR element is also
    an intensity image. The reference structure H can be obtained by using the strel
    function.'
