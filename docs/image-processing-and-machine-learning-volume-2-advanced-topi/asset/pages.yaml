  md: 'contained in each color plane that constitutes it. In its simplest form, this
    equivalent value could be established as the average of the values of the three-color
    components, such that:


    ```

    \( E_p \left( x,y \right) = \frac{R \left( x,y \right) + G \left( x,y \right)
    + B \left( x,y \right)}{3} \tag{2.6} \)

    ```


    The subjective lighting, typical of the RGB model, makes images with a large value
    in the red and/or green component have a dark appearance (in the grayscale image
    converted by Equation 2.6). The opposite effect occurs in those pixels where the
    content of the blue plane is large, showing a lighter appearance in its grayscale
    version. In order to solve this problem, it is considered as a better approximation
    to Equation 2.6 to calculate a linear combination of all the planes, defined as
    follows:


    ```

    \( E_{lin} \left( x,y \right) = w_R R \left( x,y \right) + w_G G \left( x,y \right)
    + w_B B \left( x,y \right) \tag{2.7} \)

    ```


    where \( w_R, w_G, \text{and} \ w_B \) are the coefficients that define the transformation,
    which according to the criteria used in TV for color signals are considered as
    follows:


    ```

    \( w_R = 0.299 \quad w_G = 0.587 \quad w_B = 0.114 \tag{2.8} \)

    ```


    Another suggested alternative in ITU-BT.709 for digital color coding considers:


    ```

    \( w_R = 0.2125 \quad w_G = 0.7154 \quad w_B = 0.072 \tag{2.9} \)

    ```


    Being formal, Equation 2.6 can be considered a special case of Equation 2.7.


    An important consideration is the Gamma distortion produced in the TV signals
    that affect in a non-linear way, making the values shown in Equations 2.8 and
    2.9 not correct. In numerous works, this problem is faced by defining the weights
    of the linear transformation as follows:


    ```

    \( w_R = 0.309 \quad w_G = 0.609 \quad w_B = 0.082 \tag{2.10} \)

    ```


