  md: '# 1.2.4 Erosion


    The quasi-inverse operation of dilation is erosion [4], which is expressed in
    set notation as follows:


    $I \ominus H = \{(x'', y'') = (x'' + i, y'' + j) \in P_I(i, j), \forall (i, j)
    \in P_H\} \quad (1.6)$


    This formulation refers to the fact that for each point $(x'', y'')$ in the image,
    the result involves the points for which all possible values $(x'' + i, y'' +
    j)$ are found in $I$. Figure 1.9 shows an example of the erosion performed between
    an image $I$ and the reference structure $H$.


    $I \oplus H = \{(1,1) + (0,0), (1,1) + (0,1),$

    $(1,2),(0,0) + (1,2) + (0,1),$

    $(2,1) + (0,0),(2,1) + (0,1)\}$


    ![](img/fa2d7e8bd88af7122f764c748b0a3723_21_0.png)


    **FIGURE 1.9** Example of erosion. The image $I$ is eroded through the reference
    structure $H$. From this process, it can be seen how the pixel in $I$ with coordinates
    $(1,1)$, when it is added to the elements $(0,0)$ and $(0,1)$ of the reference
    structure, obtains. As a result, points $(1,1)$ and $(1, 2)$ are part of image
    $I$. Therefore, the outcome of the erosion will be one at position $(1,1)$. For
    the other pixels of the image, this condition is not fulfilled.'
