    The imadjust function maps the intensity values of each rgb plane to new intensity
    values for each of the color planes in the new image newrgb. The operation is
    performed in such a way that the values low_in and high_in are linearly transformed
    to those specified by low_out and high_out. Those values below low_in or above
    high_in are simply redefined to those values. When you want to use the full range
    to specify the transformation, you use the empty array [] as a parameter, which
    would mean specifying [0,1]. All the values of the limits that define the transformation
    must be considered normalized in the interval of [0,1]. Figure 2.26 shows the
    mapping parameters and their relationship in the transformation of the output
    image.


