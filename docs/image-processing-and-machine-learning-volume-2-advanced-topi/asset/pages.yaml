  md: 'On the other hand, V(x, y) is the variance magnitude at position (x, y), produced
    by considering a window of size h×h. Therefore, the feature vector F(x, y) at
    the location (x, y) is represented by a three-dimensional structure defined by
    Equation 5.12.


    $$ \mathbf{F}(x,y)=[\mathbf{I}(x,y) \quad \mathbf{V}(x,y) \quad \mathbf{NL}(x,y)]
    $$ (5.12)


    In F(x,y), all the values of grayscale I(x,y), variance V(x,y), and non-local
    mean NL(x,y) are normalized within the values [0,1].

    The variance V(x,y) of contiguous pixels represents one of the simplest methods
    to evaluate the data dispersion. A low value corresponds to a homogeneous region,
    while a high magnitude could represent texturized objects. The non-local means
    NL(x,y) feature considers the mean of similar pixels in terms of their grayscale
    value. Under this characteristic, the resemblance among pixels presents better
    robustness in the presence of noise by assuming the comparison with regions and
    not with only pixels. With the use of NL(x,y), it is possible to identify if a
    pixel belongs to a homogeneous region with a specific intensity. Since this feature
    reduces the possible noise content within a region, its use presents high robustness.
    Therefore, with the integration of these three characteristics I(x,y), NL(x,y),
    and V(x,y) is possible to find pixel associations that allow for segmenting complex
    elements such as texturized regions or poorly illuminated components, etc.


    # 5.4.2 Operative Data Set


    The cost of processing the M×N features from the image through MS is prohibitive
