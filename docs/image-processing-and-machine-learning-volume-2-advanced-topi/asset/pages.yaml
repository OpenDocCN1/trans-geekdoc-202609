  md: '# ## 4.4 Chamfer Index Relationship


    Once the distance transformation is explained through the Chamfer, it is possible
    to use it as a comparison index between binary images. The Chamfer ratio index
    Q(r,s) uses the distance transformation to locate the point where a binary image
    and a binary reference pattern have the maximum similarity.


    The similarity criterion in the Chamfer relation index method is based on the
    sum of the distance values of each pixel of the image segment that is compared
    in relation to the reference pattern. With this, the total distance necessary
    to move a segment of the image is computed in order to find a maximum similarity.


    In the method, the binary reference pattern Rb(i,j) is displaced on the image
    Ib(r,s). Then, in each pixel within the neighborhood of Rb(i,j), the sum of the
    distances of the pixels in the image Ib(r,s) is calculated. This formulation can
    be defined as follows:


    $$Q(x,y) = \frac{1}{K} \sum_{(i,j) \in FG(R)} D(r+i, s+j)$$ (4.21)


    where K = |FG(R)| corresponds to the number of pixels of the value of one contained
    in the pattern Rb(i,j).


    The complete process of calculating the Chamfer ratio index Q(r,s) is summarized
    in Algorithm 4.3. If at a certain position of Ib(r,s), all the pixels of the pattern
    Rb(i,j) whose value is one, coincide with those of the covered section of the
    image Ib(r,s), the sum of the distances will be zero, which represents a perfect
    similarity between both elements. The more pixels of value one of the pattern
    Rb(i,j) do not have correspondence with those of the image Ib(r,s), the sum of
    the distances will have a considerable value, which would imply a greater difference
    between the contents of information between Ib(r,s) and Rb(i,j). The best similarity
    index is reached at the point where Q(r,s) has its minimum value. This can be
    formulated as follows:


    $$p_{opt} = (r_{opt}, s_{opt}) = \min(Q(r,s))$$ (4.22)


    If the binary image shown in Figure 4.16a is considered as an example and Figure
    4.16b as a reference pattern, the calculation of the Chamfer ratio index Q(r,s)
    would be represented by Figure 4.16c, while Figure 4.16d represents the surface
    of Q(r,s).


    In Figure 4.16c and d, it can be observed how the calculation of the value of
    the Chamfer relation index gives a similarity indicator that varies smoothly.
    The red points show the locations where there is a better similarity between'
  merge: -1
  img_proc: true
