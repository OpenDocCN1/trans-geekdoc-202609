- pgno: 175
  md: 'directly, the difference found between them is irregular despite the complete
    similarity or complete difference between the image and the pattern to be detected
    [ 8].


    The problem with the direct comparison of binary images is that even small differences
    between the two images, due to shifts, rotations, or distortions, produce strong
    differences [ 8]. Therefore, the question is how binary images can be compared
    in such a way that the comparison is tolerant to small deviations. The objective
    is then not to consider the number of pixels belonging to the object of the image
    that does not coincide with the reference image but to use a geometric measure
    that allows knowing how far or how close two patterns are similar.


    # 4.3.1 The Transformation of Distance


    A possible solution to this problem consists of determining in each pixel how
    far it is geometrically from the nearest pixel whose value is one. Under such
    conditions, a measure of the minimum displacement can be found. This value is
    necessary to determine when a pixel can overlap with another [ 9]. Considering
    a binary image $I_b(x,y)$, the following data sets are described:


    ```

    $$FG(I) = \{ p | I(p) = 1 \}$$ (4.13)

    ```


    ```

    $$BG(I) = \{ p | I(p) = 0 \}$$ (4.14)

    ```


    where $FG(I)$ considers all the pixels of the image whose value is one, while
    $BG(I)$ considers the pixels whose value is zero. The distance transformation
    $D(\boldsymbol{p})$ of $I_b(x,y)$ is defined as follows:


    ```

    $$D(\boldsymbol{p}) = \min_{p'' \in FG(I)} dist(\boldsymbol{p}, p'')$$ (4.15)

    ```


    For all points $\boldsymbol{p} = (x,y)$, where $x = 0, ..., N-1$ and $y = 0, ...,
    M-1$ (if considered as dimensions of the image $M \times N$). If a pixel $\boldsymbol{p}$
    has a value of one, then $D(\boldsymbol{p}) = 0$. This is because no displacement
    is necessary for that pixel to overlap a nearby pixel of value 1.


    The function $dist(\boldsymbol{p}, p'')$ defined in Equation 4.14 evaluates the
    geometric distance between two coordinates $\boldsymbol{p} = (x,y)$ and $p'' =
    (x'',y'')$. Examples of appropriate distance functions are the Euclidean distance:


    ```

    $$d_E(\boldsymbol{p}, p'') = \boldsymbol{p} - p'' = \sqrt{(x-x'')^2 + (y-y'')^2}$$
    (4.16)

    ```


    Or the Manhattan distance:


    ```

    $$d_M(\boldsymbol{p}, p'') = |x-x''| + |y-y''|$$ (4.17)

    ```'
