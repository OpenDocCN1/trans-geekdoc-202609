- pgno: 100
  md: 'is to improve the sharpness of an image, then it is necessary to preserve the
    low-frequency information of the original plane and emphasize the details present
    in the plane through the Laplacian filter. To achieve this effect, it is required
    to subtract from the original plane a scaled version of the plane filtered by
    the Laplacian filter. Under such conditions, the plane with improved sharpness
    can be produced by the following equation:


    ```

    I(x,y)_B = I(x,y) - w \cdot \nabla^2 I(x,y) \quad (2.67)

    ```


    Figure 2.30 illustrates the idea that an image is sharpened by making the presence
    of its edges more apparent. To facilitate the explanation, the one-dimensional
    case is considered.


    The effect of improving the sharpness of a plane can be carried out in a single
    process. Considering $w = 1$, the process can be modeled as follows:


    ```

    I(x,y)_B = I(x,y) - (1) \cdot \nabla^2 I(x,y) \quad (2.68)

    ```


    ![](img/fa2d7e8bd88af7122f764c748b0a3723_100_0.png)


    **FIGURE 2.30** Sharpening by applying the second derivative. By subtracting a
    factor from the second derivative of the function, it allows you to maximize the
    presence of the contours in the image.'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'and considering that the Lapacian (see Section 1.5) has the structure defined
    as follows:


    \(\nabla^2 I(x,y) = I(x+1, y) + I(x-1, y) + I(x, y+1) + I(x, y-1) - 4I(x, y)\)
    \tag{2.69}


    The final formulation can be defined as follows:


    \(I(x, y)_B = 5I(x, y) - [I(x+1, y) + I(x-1, y) + I(x, y+1) + I(x, y-1)]\) \tag{2.70}


    Or, expressed in a filter, the matrix of coefficients is defined by the following
    filter:


    \(I(x, y)_{Bettered} = \begin{bmatrix} 0 & -1 & 0 \\ -1 & 5 & -1 \\ 0 & -1 & 0
    \end{bmatrix}\) \tag{2.71}


    # ## 2.13.4 Sharpening Color Images with MATLAB


    To improve the sharpness of a color image by using a spatial filter, the same
    process previously described for smoothing color images is carried out, that is:


    +   1. Each plane of the color image is extracted.

    +   2. Each component is individually filtered using the filter defined in Equation
    2.63.

    +   3. The results of each plane are merged again to generate the new, sharper
    color image.


    The function used in MATLAB to perform spatial filtering is `imfilter`; its syntax,
    parameters, and details were discussed in Volume 1, Chapter 2, Section 2.9.3,
    so it is only used in this section.


    Next, as an example, the set of commands used in MATLAB to improve the sharpness
    of an RGB color image is exposed. In this process, the filter defined in Equation
    2.69 is used. To carry out this example, it is considered that the input image
    is stored in the `RGB` variable. Therefore, the commands that need to be executed
    to improve the sharpness are the following:


    ```

    1   >>R=RGB(:, :, 1);

    2   >>G=RGB(:, :, 2);

    3   >>B=RGB(:, :, 3);

    ```'
