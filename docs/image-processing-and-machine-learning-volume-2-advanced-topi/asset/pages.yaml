    Sometimes it is important to represent grayscale images in RGB format, mainly
    when you want to highlight some region of intensity with a color that contrasts
    and identifies. To generate this type of image, the grayscale value obtained (by
    using one of the models listed in Equations 2.6–2.10) is assigned to each of the
    planes in such a way that:'
