- pgno: 206
  md: 'For the experimental tests, the Multi-Segm algorithm was executed in the 300
    images of the Berkeley Segmentation Dataset, and its results are related to those
    generated by the PSO [30], the CS [38], the SFS [37], and the Fast and Robust
    Fuzzy C-Means Clustering Algorithm (FCM) [8]. The first three schemes represent
    the most popular segmentation approaches based on metaheuristic principles. On
    the other hand, the FCM algorithm is a state-of-the-art clustering method used
    for segmentation purposes. According to the literature, it presents one of the
    most accurate results when it faces complex segmentation problems [8,37]. In the
    comparisons, the configuration of every method is carried out considering its
    reported guidelines. In the comparative study, the configuration of each technique
    is set regarding their reported values, which have demonstrated experimentally
    obtaining the best performance assuming their reported references. The experiments
    have been conducted on the MATLAB® platform on a PC i7 with 6 GHz and 8 GB of
    RAM memory. The code of every segmentation scheme used in the comparisons has
    been collected from the authors and is publicly available. In the test, each algorithm
    has been executed independently while the corresponding results are registered.


    # 5.5.2 Performance Criterion


    To measure the performance of the techniques used for the study, nine different
    indexes have been considered: Average Difference (AD), Feature Similarity Index
    (FSIM), Maximum Difference (MD), Normalized Cross-Correlation (NK), Mean-Squared
    Error (MSE), Normalized Absolute Error (NAE), Structural Content (SC), Structural
    Similarity Index Measurement (SSIM), and Peak Signal-to-Noise Ratio (PSNR), and
    Computational Cost (CC). The first nine performance indexes evaluate the quality
    of the segmentation results, whereas CC considers the evaluation of the computational
    overload. These performance indexes use the ground truth R (Reference) of each
    image I to evaluate the quality of the segmentation for each image from the Berkley
    dataset.


    To determine the AD, the AD between the segmented image I and its reference image
    is computed, thus assessing the resemblance between both images. AD can be computed
    as indicated in Equation 5.20.


    ```

    AD = \frac{1}{MN} \sum_{i=1}^M \sum_{j=1}^N \mathbf{I}(i,j) - \mathbf{R}(i,j)
    \quad (5.20)

    ```


    FSIM describes a perception-based measure that is used to compare the segmented
    image I and its reference image using a local structure by the obtention of the
    phase congruency (PC) and gradient elements (GM). The local similarity $S_{PC}
    (\mathbf{I}, \mathbf{R})$ between both images is calculated by Equation 5.21.


    ```

    S_{PC} (\mathbf{I}, \mathbf{R}) = \frac{2 \cdot \mathbf{I} \cdot \mathbf{R} +
    T_1}{\mathbf{I}^2 \cdot \mathbf{R}^2 + T_1} \quad (5.21)

    ```'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'where \( T_1 \) is a small positive constant (Commonly 0.01). The gradient
    extent is estimated through convolutional masks for the resulting image \( \mathbf{I}
    \) and its respective reference \( \mathbf{R} \), determining \( \mathbf{GI} \)
    and \( \mathbf{GR} \), respectively. Hence, a local gradient map is determined
    by Equation 5.22.


    \(\nS_{GM} (\mathbf{GI},\mathbf{GR}) = \frac{2 \cdot \mathbf{GI} \cdot \mathbf{GR}
    + T_1}{\mathbf{GI}^2 + \mathbf{GR}^2 + T_1} (5.22)\)


    Once \( S_{PC} \) and \( S_{GM} \) are computed, the FSIM determined using Equation
    5.23.


    \(\nFSIM = \frac{\sum_{j=1}^2 S_{PC} \cdot S_{GM} \cdot I_j}{\mathbf{GI}^2 \cdot
    \mathbf{GR}^2 + T_1} (5.23)\)


    For determining the \( MD \), the maximal difference between a resulting image
    \( \mathbf{I} \) and its reference \( \mathbf{R} \) is computed by using Equation
    5.24.


    \(\nMD = \max_{\forall i, j \in M \times N} |\mathbf{I}(i,j) - \mathbf{R}(i,j)|
    (5.24)\)


    The \( MSE \) is used to determine the affinity of segmented image \( \mathbf{I}
    \) regarding its reference \( \mathbf{R} \) by the subtraction of the pixel intensity
    of the image \( \mathbf{I} \) with the elements of its image \( \mathbf{R} \)
    and then determining the averaged value of the error. The RMS is computed using
    the model of Equation 5.25.


    \(\nMSE = \frac{1}{MN} \sum_{i=1}^M \sum_{j=1}^N \left( \mathbf{I}(i,j) - \mathbf{R}(i,j)
    \right)^2 (5.25)\)


    The \( NAE \) determines the affinity of segmented image \( \mathbf{I} \) regarding
    its reference \( \mathbf{R} \) computing the normalized absolute differences generated
    by Equation 5.24.


    \(\nNAE = \frac{\sum_{i=1}^M \sum_{j=1}^N |\mathbf{I}(i,j) - \mathbf{R}(i,j)|}{\sum_{i=1}^M
    \sum_{j=1}^N \mathbf{R}(i,j)} (5.26)\)


    The \( NK \) computes the similarities between the resulting image \( \mathbf{I}
    \) and its reference \( \mathbf{R} \) with regard to their correlation. Thus,
    \( NK \) is estimated under Equation 5.27.


    \(\nNK = \frac{\sum_{i=1}^M \sum_{j=1}^N \mathbf{I}(i,j) \cdot \mathbf{R}(i,j)}{\sum_{i=1}^M
    \sum_{j=1}^N \mathbf{R}(i,j)} (5.27)\)'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'The SC uses the computation autocorrelation to evaluate similarity through.

    It is computed by Equation 5.28.


    ```

    \[\begin{equation*}\begin{aligned}SC &= \frac{\sum_{i=1}^M\sum_{j=1}^N\mathbf{I}(i,j)^2}{\sum_{i=1}^M\sum_{j=1}^N\mathbf{R}(i,j)^2}
    \tag{5.28}\\\end{aligned}\end{equation*}\]

    ```


    The SSIM uses the segmented image **I** and its reference **R** to determine the
    similarity between both images. Considering the image \(\mathbf{I}=\{p_1,\dots,p_{M\times
    N}\}\) symbolizes the resulting pixels and \(\mathbf{R}=\{r_1,\dots,r_{M\times
    N}\}\) the reference information, the SSIM can be determined by Equation 5.29.


    ```

    \[\begin{equation*}\begin{aligned}SSIM &= \frac{(2\mu_I\mu_R+Q_1)(2\sigma_{IR}+Q_2)}{(\mu_I^2+\mu_R^2+Q_1)(\sigma_I^2+\sigma_R^2+Q_2)}
    \tag{5.29}\\\end{aligned}\end{equation*}\]

    ```


    where \(Q_1\) and \(Q_2\) are two small positive values (typically 0.01). \(\mu_I\)
    and \(\mu_R\) are the mean values of the images **I** and **R** data, respectively.
    \(\sigma_I\) and \(\sigma_R\) symbolize the variance of both images, respectively.
    The factor \(\sigma_{IR}\) represents the covariance of the segmented and reference
    data.


    The PSNR describes the highest feasible pixel value of an image \(MAXI\) with
    its corresponding similarity with regard to the PSNR magnitude. The PSNR can be
    determined by Equation 5.30.


    ```

    \[\begin{equation*}\begin{aligned}PSNR &= 20\cdot\log_{10}\left(\frac{MAXI}{RMSE}\right)
    \tag{5.30}\\\end{aligned}\end{equation*}\]

    ```


    The segmentation schemes compared in this study correspond to complex methods
    with several stochastic processes. Therefore, it is difficult to carry out a complexity
    test from a deterministic perspective. Under such conditions, in our test, the
    CC is considered to evaluate the computational overload. It represents the seconds
    invested for each algorithm during its operation.


    # ## 5.5.3 Comparison Results


    In this subsection, the comparison of the performance is presented considering
    different segmentation techniques that are used over the 300 images extracted
    from the Berkley dataset. The main objective is to determine the efficiency, effectivity,
    and accuracy of each method in the segmentation process. In Table 5.1, the average
    values of every examined index in the group of 300 images from BSDS300 are presented.
    Considering that the PSO, CS, and SFS use the number of classes to segment as
    input parameters, they are fixed to four levels. This number of classes has been
    considered to maintain compatibility with the results presented for such methods
    in their respective references.'
