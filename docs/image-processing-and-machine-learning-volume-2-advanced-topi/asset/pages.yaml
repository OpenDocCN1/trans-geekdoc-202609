    # 5.4.1 Feature Definition


    Consider that $\mathbf{I}(x,y)$ represents a \(M \times N\) image whose gray levels
    are ranged from 0 to 255 for each spatial coordinate \((x,y)\). The MS method
    operates in the feature space. Therefore, each pixel of the image maintains three
    different characteristics \(\mathbf{F}(x,y)\), such as the intensity value \(\mathbf{I}(x,y)\),
    the non-local mean \(\mathbf{NL}(x,y)\), and the local variance \(\mathbf{V}(x,y)\).


    The non-local means [53] characteristic for a certain pixel \((x,y)\) estimates
    the weighted average amount of all the pixels within the image in relation to
    their local means values. Consider \(\mathbf{I}(x,y)\) and \(\mathbf{I}(p,q)\)
    the corresponding gray-scale values of the pixel positions \((x,y)\) and \((p,q)\),
    respectively. Therefore, the non-local means \(\mathbf{NL}(x,y)\) in position
    \((x,y)\) can be calculated as defined in Equation 5.9.


    $$\mathbf{NL}(x,y) = \frac{\sum_{p=1}^M \sum_{q=1}^N \mathbf{I}(p,q) \cdot w((p,q),(x,y))}{\sum_{p=1}^M
    \sum_{q=1}^N w((p,q),(x,y))}$$


    where \(w((p,q),(x,y))\) is a weighting value that corresponds to the result of
    a Gaussian function defined by Equation 5.8.


    $$w((p,q),(x,y)) = e^{-\frac{|\mu(p,q) - \mu(x,y)|^2}{\sigma}}$$


    where \(\sigma\) corresponds to the standard deviation. \(\mu(p,q)\) and \(\mu(x,y)\)
    represents the local mean values at pixels positions \((p,q)\) and \((x,y)\),
    considering a neighborhood NE of \(m \times m\). Such values are estimated according
    to Equation 5.11.


    $$\mu(p,q) = \frac{1}{m \times m} \sum_{(i,j) \in \text{NE}} \mathbf{I}(i,j) \qquad
    \mu(x,y) = \frac{1}{m \times m} \sum_{(i,j) \in \text{NE}} \mathbf{I}(i,j)$$'
