  md: 'Depending on which of the color planes has a higher value, an auxiliary variable
    \(H''\) can be calculated such that:


    \(H'' = \begin{cases} B'' - G'', \ & \text{if } R = C_{max} \\ R'' - B'' + 2,
    \ & \text{if } G = C_{max} \\ G'' - R'' + 4, \ & \text{if } B = C_{max} \end{cases}
    \quad (2.15)\)


    The resulting value of \(H''\) is in the interval from [-1 to 5], for which it
    will be necessary to normalize this variable, whose auxiliary represents the tonality,
    so that its interval is from 0 to 1. Under such conditions, the following process
    is applied:


    \(H = \frac{1}{6} \cdot \begin{cases} (H'' + 6), \ & \text{if } H'' < 0 \\ H'',
    \ & \text{otherwise} \end{cases} \quad (2.16)\)


