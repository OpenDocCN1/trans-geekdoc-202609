    To diminish the computation of the process, the MS method is executed by using
    a subset of pixel characteristics, which include only a quite reduced number of
    elements from all available information. Therefore, two groups of data are defined:
    operative elements (the amount of data considered in the MS execution) and inactive
    elements (the rest of the data). In this chapter, instead of Gaussian functions,
