- pgno: 222
  md: 'most programming languages or computer packages implement a function for its
    extraction [3].


    In MATLAB®, the svd function is the function implemented to calculate the complete
    or generic SVD decomposition of a matrix X.


    ```

    [S, V, D]=svd(X) ;

    ```


    It is also possible to calculate the simple version of the SVD decomposition using
    the following command:


    ```

    [S, V, D]=svd(X, ''econ'') ;

    ```


    # 6.3 Approximation of the Data Set


    The most important feature of the SVD decomposition is that it allows obtaining
    from a high-dimensional data set X an optimal approximation X̃ in a lower dimension.
    With the results obtained by the SVD decomposition, it is possible to obtain an
    approximation of rank r of the data set, which represents the result of only considering
    the first r different vectors and discarding the rest n – r.


    The use of SVD decomposition has been generalized to spaces between functions.
    Therefore, Eckart-Young established a theorem that formulates the approximation
    of the decomposition through the truncation of the dimensions. The optimal approximation
    X̃ for the truncation r of the data matrix X, in the sense of least squares, is
    established through the following formulation:


    ```

    min ||X - X̃|| = ŨΣṼ   (6.5)

    ```


    where the matrices Ũ and Ṽ represent the first r column and row vectors of the
    matrices U and V. While the matrix Σ̃ contains the block of the first r × r elements
    of the original matrix Σ. In this way, the approximate data vector X̃ will be
    defined considering only the integration of the first r elements of each matrix
    U, V, and Σ. This can be formulated as follows:


    ```

    X̃ = Σ σi ui vi = σ1 u1 v1 + ... + σr ur vr   (6.6)

    ```


    where ui represents column i of matrix U and vi constitutes row i of matrix V.
    While σi corresponds to the value i of the main diagonal of matrix Σ. The approximation
    process by truncation for the SVD decomposition can be visualized in Figure 6.2.'
