    # 2.11 Color Image Processing


    This section studies the main image processing operations applicable to color
    images. In order to adequately discuss the techniques used in color image processing,
    operations will be classified into three groups: linear color transformations,
    spatial processing, and vector operations.


    The category of linear transformations refers to operations carried out exclusively
    on the pixels of the image in each of the different planes that define its color.
    This type of processing is similar to the ones discussed in Chapter 1, with the
    difference that, in this case, the operations were applied to only one grayscale
    image. In the current context, these operations are applied to each of the color
    planes, so in theory, each of the operations seen in Chapter 1 can be used for
    color images, with the exception that they are performed separately for color
    images.


    Spatial processing operations involve those operations that consider not only
    the pixel in question but also those that are in a certain neighborhood around
    it. This type of processing is closely related to that seen in Chapter 2, except
    that in the case of color images, the processing is performed on each of the color
    planes. Considering the above, most of the operations explained in Chapter 2,
    such as filtering, can be applied to this type of image.


    While both pixel-level and spatial processing specify operations that are performed
    on each plane, in vector processing, each operation involves the participation
    of each of the color components simultaneously. To carry out vector processing,
    each pixel of the image is represented as a vector, which in the case of an image
    in the RGB model would be:'
