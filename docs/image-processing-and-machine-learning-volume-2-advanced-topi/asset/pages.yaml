    ```


    \( d_E^2(r,s) = \sum_{(i,j)\in R} \left( I(r+i, s+j) - R(i,j) \right)^2 \)


    \( = \underbrace{\sum_{(i,j)\in R} (I(r+i, s+j))^2}_{A(r,s)} + \underbrace{\sum_{(i,j)\in
    R} (R(i,j))^2}_{B} - \underbrace{2 \sum_{(i,j)\in R} I(r+i, s+j) \cdot R(i,j)}_{C(r,s)}
    \) (4.4)


    The part B in Equation 4.4 represents the sum squared of all values of the reference
    image \( R(i, j) \). Since these values do not depend on the offset \( (r, s)
    \), this factor is constant throughout the processing of Equation 4.4. Therefore,
    \( B \) could be ignored for the evaluation. The expression \( A(r, s) \) represents
    the sum of the values of the image pixels corresponding to the squared \( R(i,
    j) \). The value \( A(r, s) \) clearly depends on the offset \( (r, s) \). \(
    C(r, s) \) corresponds to the so-called cross-correlation (\( I \otimes R \))
    between \( I(x, y) \) and \( R(i, j) \). This cross-correlation is defined as
    follows:


    \( (I \otimes R)(r, s) = \sum_{i=-\infty}^{\infty} \sum_{j=-\infty}^{\infty} I(r+i,
    s+j) \cdot R(i, j) \) (4.5)


    Since the elements outside the dimensions of images \( I(x, y) \) and \( R(i,
    j) \) are considered zero, Equation 4.5 can be rewritten as follows:


    \( \sum_{i=0}^{a_R-1} \sum_{j=0}^{d_K-1} I(r+i, s+j) \cdot R(i, j) = \sum_{(i,j)\in
    R} I(r+i, s+j) \cdot R(i, j) \) (4.6)


    Correlation is fundamentally the same operation as convolution, except that in
    convolution, the kernel of the operation is inverted on itself.


    If the factor \( A(r, s) \) in Equation 4.4 remains approximately constant throughout
    the image \( I(x, y) \), it would mean that the energy in the image is uniformly
    distributed. Thus, the maximum value of the correlation \( C(r, s) \) corresponds
    to the point of the image \( I(x, y) \) where the reference image \( R(i, j) \)
    has the maximum coincidence. In this case, the minimum value of \( d_E^2(r, s)
    \) can only be calculated by means of the maximum value of the \( I \otimes R
    \) correlation.'
