    # 2.12 Linear Color Transformations


    The techniques discussed in this section are based on individual pixel processing,
    performing this operation on each of the planes that define the image. This processing
    is similar to that discussed in Chapter 1 on grayscale images. The type of processing
    of these operations has the following model:


    ```

    $c_i = f_i(p_i) \quad i = 1, 2, 3.$

    ```


    where \( p \) is the value of the pixel plane \( i \) that will be processed by
    the function \( f_i \), giving, as a result, the value of the pixel \( c \) for
    the same plane \( i \).


    The set of operations of this type that can be applied to color images includes
    most of those described in Chapter 1. For grayscale images, only in this case,
    the grayscale image will correspond to each plane of the image. Therefore, only
    those operations that, due to their importance, are considered in this section.


    The linear transformation in an image can be defined as the relationship between
    the different intensity values present in the color planes of the image. The change
    in color intensity, on the other hand, is related to the way in which the intensity
    values are distributed in each plane in such a way that if they are concentrated
    more toward small intensity values, the image will be seen with less color content.
    On the contrary, if the intensity values are concentrated toward high-intensity
    values, the image will have a higher color content. The generic operator \( f(\cdot)
    \) that is used to linearly transform color in an image can be defined as follows:


    ```

    $c_i = f_i(x,y) = o \cdot p_i + b$

    ```


    where \( o \) modifies the value of the contrast of the intensity values of the
    plane \( i \) while \( b \) modifies the value of the brightness or illumination.
    Figure 2.25 shows graphically the different modifications made by manipulating
    \( o \) and \( b \).'
