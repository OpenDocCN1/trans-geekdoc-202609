    # ## 2.6 Colorimetric Models


    Calibrated color models are used to reproduce colors accurately, regardless of
    the display device. This need is found in virtually every stage of image processing,
    from rendering to printing. This problem cannot be considered trivial. It is difficult
    to print an image on a color printer and to obtain an exact resemblance to the
    pattern to be printed. All these problems are mostly due to the strong device
    dependency that occurs in the reproduction and handling of images.


    All the color models discussed above are related to the physical measurements
    of the output devices used in displaying the images, such as the phosphor of television
    picture tubes or the configurable parameters of laser printers. To generate colors
    with different output modalities, which produce completely identical images regardless
    of the display device used, a color model is necessary that considers the independence
    of representation. These models are called colorimetric or calibrated.


