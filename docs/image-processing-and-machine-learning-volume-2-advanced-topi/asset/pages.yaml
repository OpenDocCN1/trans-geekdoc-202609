- pgno: 110
  md: '# # Geometric Operations in Images


    Geometric operations are widely used in practice, especially in current and modern
    graphical user interfaces and video games [1]. In fact, there are no graphic applications
    that do not have zoom capabilities to highlight small aspects of the images. Some
    examples of geometric operations such as displacement, rotation, scaling, and
    distortion are shown in Figure 3.1.


    In the area of computer graphics, the topic of geometric operations is also important,
    whether for the representation of textures, 3-D environments, or simply for the
    representation of environments in real time [2]. However, although this type of
    operation seems trivial, to obtain a good result, it is necessary, even in modern
    computers, to consume a considerable amount of machine time.


    Fundamentally, a geometric operation applied to an original image produces the
    following transformation in a target image:


    ```

    I(x,y) → I′(x′, y′)

    ```


    where not only the value of the pixel is changed but also its position in the
    new image. To do this, a coordinate transformation is first needed in the form
    of a geometric transformation, such that:


    ```

    T : ℝ² → ℝ²

    ```


    which, for each coordinate of the image I(x, y) original image x = (x, y), indicates
    in which new position x′ = (x′, y′) of the image I′(x′, y′) must match. That is:


    ```

    x → x′ = T(x)

    ```


    As the previous expressions show, the coordinates that participate both in the
    original image and those calculated through the transformation T(x) are considered
    as points on a surface of real numbers ℝ × ℝ, as well as of the continuous type.
    However, the main problem with geometric transforms is that the coordinates in
    the images actually correspond to a discrete array of the type ℤ × ℤ, so the computed
    transformation x′ from x will not exactly'
  merge: -1
  img_proc: true
