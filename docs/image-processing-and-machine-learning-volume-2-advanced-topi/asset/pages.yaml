    # 2.8 The CIE L*a*b* Model


    The L*a*b* model was developed under the idea of linearizing the position change
    versus tonality change relationship, thus improving the way in which humans perceive
    these changes, making the model more intuitive. In this color model, the space
    is defined by three variables, L*, which represents brightness, and the hue components
    a* and b*. The value of a* defines the distance along the red-green axis, while
    the value of b* represents the distance along the blue-yellow axis, those axes
    specified in CIEXYZ space. The three components that define the space are relative
    to a white point defined as C_ref = (X_ref, Y_ref, Z_ref), where a non-linear
    correction (similar to the Gamma correction) is also used.


    # 2.8.1 Transformation CIEXYZ → L*a*b*


    The specification for the conversion of the CIEXYZ model to the L*a*b* space is
    defined according to ISO 13655:


    ```

    L* = (118 · Y'') – 16

    a* = 500 · (X'' – Y'')

    b* = 200 · (Y'' – Z'')

    ```


    where


    ```

    X'' = f₁( X / X_ref )

    Y'' = f₁( Y / Y_ref )

    Z'' = f₁( Z / Z_ref )

    ```'
