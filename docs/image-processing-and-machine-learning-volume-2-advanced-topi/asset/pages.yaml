    # 3.2 Reassignment of Coordinates


    Until now, in the manipulation of geometric operations, it has been considered
    that the coordinates of the image are continuous, that is, of real value. However,
    the value of the elements of an image is indexed discreetly, using only integer
    values. Considering the above, a non-trivial problem of geometric transformations
    is to find the correspondence of coordinates between the original image and the
    transformed image (without loss of information produced by the assignment or rounding
    of the coordinates).


    Based on a geometric transformation T(x,y) that operates on a source image I(x,y)
    to produce a result image I''(x'',y''), and where all coordinates are discrete,
    x,y ∈ Z and x'',y'' ∈ Z, it is possible to use two different methods which differ
    in the sense in which they perform the transformation. These methods are called
    Source-Destination Mapping and Destination-Source Mapping.


    # 3.2.1 Source-Destination Mapping


    In this first approach, for each pixel of the source image I(x,y), its corresponding
    position in the transformed (destination) image I''(x'',y'') is calculated. The
    computed coordinates x'',y'' normally do not correspond to integer or discrete
    values (see Figure 3.11), so it is necessary to decide which intensity value of
    the original image I will correspond to that of the transformed image I''. The
    solution to this problem is not trivial, so that a method that allows finding
    the correct value from intermediate intensities (interpolation) could be required.


    The main problem with this method is that, depending on the geometric transformation
    T(x,y), there will be elements in the transformed image I''(x'',y'') that do not
    have correspondence with those of the original image I(x,y). For example, in the
    case of magnification of the original image, there will be gaps in the intensity
