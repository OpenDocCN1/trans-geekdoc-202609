    # ## 1.6 MATLAB Functions for Morphological Operations


    MATLAB® has a large number of functions that allow the implementation of most
    of the morphological operations discussed in this chapter [8]. This section explains
    one by one the functions that allow executing morphological operations as well
    as some auxiliary functions.'
