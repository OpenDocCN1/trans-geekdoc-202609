    # ## 5.2 Kernel Density Estimation (KDE)

    and the Mean-Shift Method


    There is a complete association between KDE and clustering. The objective of KDE
    is to build the probability function of data distribution by analyzing its point
    concentration, which could also be employed for classification purposes. KDE represents
    a set of nonparametric schemes that do not consider any particular probability
    approach to modeling the probability density function. Instead, KDE computes the
    probability density directly for every element in the dataset.


    MS [44] is a computational method that has generally been considered for clustering.
    In its operation, each element x contained in the feature space, it is designed
    as a cluster Ci, whose central point xi* represents the local maximum of the density
    map. Accordingly, beginning at location x, a new position is determined following
    the orientation of the highest increment of the feature map until the nearest
    local maximal concentration xi* has been reached. The computation process of the
    MS consists of two stages. As a first step, the construction of a density map
    is achieved. This process is carried out through the use of a KDE scheme. Then,
    a search process that considers the gradient ascent as a basis is applied to detect
    the high local concentration points (local maxima) over the density map [55].


    # ## 5.2.1 Concentration Map Generation


    The nonparametric KDE is the most useful approach to generating an unknown density
    feature map. In the operation of a KDE scheme, the concentration in every location
    is estimated by using kernel functions that consider the collection of weighted
    near elements. A kernel model K is characterized as an asymmetric, non-negative
    kernel element K, such as it is defined in Equation 5.1.


    $$ K(\mathbf{x}) \ge 0; K(-\mathbf{x}) = K(\mathbf{x}); \int K(\mathbf{x})d\mathbf{x}
    = 1 $$


    Considering a group of n characteristics {x1, x2,..., xn}, the density function
    \hat{f}(\mathbf{x}), can be determined in terms of K, as shown in Equation 5.2.


    $$ \hat{f}(\mathbf{x}) = \frac{1}{nh} \sum_{i=1}^n K\left(\frac{\mathbf{x}-\mathbf{x}_i}{h}\right)
    $$'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'where h corresponds to the support region of K.


    The simplest kernel model is the discrete kernel function $K_D$, which calculates
    the respective concentration in a specific location by counting the number of
    data elements within a window of size $h$. $K_D$ is defined in Equation 5.3.


    $$ K_D \left( \frac{\mathbf{x}-\mathbf{x}_i}{h} \right) = \begin{cases} 1 & \text{if
    } \left( \frac{\mathbf{x}-\mathbf{x}_i}{h} \right) \le h \\ 0 & \text{Otherwise}
    \end{cases} $$ (5.3)


    Figure 5.1 presents the KDE considering the discrete kernel $K_D$ for several
    magnitudes of the value $h$ over a one-dimensional dataset. In the figure, the
    stack height represents the frequency at which the data are concentrated. As it
    is indicated in Figure 5.1a, if $h$ presents a small value, the resulting probability
    density shows several local maximal points. Nevertheless, as the value of $h$
    increases from 0.25 to 2, the number of modes is reduced until $h$ gets high enough
    to produce a distribution with only one mode (unimodal).


    Even though different kernel models have been used in KDE methods, the Gaussian
    function $K_G(x)$ represents the most popular kernel scheme in KDE approaches.
    The Gaussian or normal function is characterized by Equation 5.4, whereas its
    representation is illustrated in Figure 5.2.


    $$ K_G ( x ) = \left( \frac{1}{\sqrt{2\pi}} \right) e^{\left( \frac{-x^2}{2h}
    \right)} $$ (5.4)


    ![](img/fa2d7e8bd88af7122f764c748b0a3723_191_0.png)


    **FIGURE 5.1** Probability density estimation by using the discrete kernel $K_D$
    by using different values of $h$. (a) $h = 0.5$, (b) $h = 1.0$, and (c) $h = 2.0$.'
