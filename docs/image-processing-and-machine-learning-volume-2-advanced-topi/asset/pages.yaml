    detected.


    # 4.3.2 Chamfer Algorithm


    The Chamfer algorithm is an efficient method for calculating distance transformations
    [10] and uses two processing loops that operate sequentially, in which the distance
    calculation propagates through the image in different directions. In the first
    loop, the calculation of the distance is made from the upper left corner downwards,
    while in the second, the calculation of the distance is propagated from the lower
    right corner upwards (in the opposite direction to the first). In calculating
    the distances for each of the loops, two different masks are used, where each
    of them corresponds to each of the loops:


    ```

    M^I = \begin{bmatrix} m_2^I & m_3^I & m_4^I \\ m_1^I & \times & . \\ . & . & .
    \end{bmatrix}  M^D = \begin{bmatrix} . & . & . \\ . & \times & m_1^D \\ m_4^D
    & m_3^D & m_2^D \end{bmatrix} (4.18)

    ```


    The values of the masks M<sup>I</sup> and M<sup>D</sup> correspond to the geometric
    distances between the current point × and its relevant neighbors. The values of
    M<sup>I</sup> and M<sup>D</sup> depend on the selected distance function dist(**p**,
    **p''**). Algorithm 4.2 describes the computation of the distance transform D(x,
    y) from a binary image I<sub>b</sub> (x, y) using Chamfer method.'
