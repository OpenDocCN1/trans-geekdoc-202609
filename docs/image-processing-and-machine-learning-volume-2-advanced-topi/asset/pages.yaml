    $(x_0, y_0)$ is produced in two steps considering the neighboring pixels defined
    at points A, B, C, and D. First through linear interpolation, points E and F are
    obtained considering the distance between the point to be interpolated and the
    adjoining pixel $a = (x_0 - u_0)$, then the vertical interpolation is performed,
    obtaining the intermediate points between E and F by means of the distance $b
