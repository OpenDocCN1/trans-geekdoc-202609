    possible way to interpolate a discrete function.


    A discrete function, as seen in Chapter 13, has a limited bandwidth whose maximum
    value is characterized by half the sampling frequency ω_s / 2 with which it was
    obtained. In the same way, it was investigated in Chapter 13 how these signals,
    both in the space domain and in the frequency domain, present periodicity. In
    view of the above, if you only want to take one version of the spectrum F̅(ω),
