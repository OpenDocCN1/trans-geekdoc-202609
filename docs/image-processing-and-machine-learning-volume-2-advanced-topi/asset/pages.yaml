- pgno: 97
  md: '# 2.13 Spatial Processing in Color Images


    The essential feature of the linear transformation operations discussed in the
    previous section was that the new pixel value finally calculated depends exclusively
    on the original pixel value of each plane and is located in the same position
    in the planes of the new image. Although it is possible to perform many effects
    on images using pixel operations, there are conditions under which it is not possible
    to use them to generate certain effects, such as in the case of image smoothing
    or edge detection. Spatial processing of color images can be considered as an
    operation where the newly computed pixel depends not only on the original pixel
    but also on other pixels that are in a given neighborhood relative to it. Evidently,
    this processing considers that the operations are carried out independently on
    each color plane that defines the image. Figure 2.28 shows the process of a special
    operation on a color image.


    This type of processing is closely related to the operations from Chapter 2, except
    that in the case of color images, the processing is performed on each color plane.
    Considering the above, most of the operations explained in Chapter 2, such as
    filtering, can be applied to this type of image. Therefore, only those operations
    that, due to their importance, are considered the most common will be discussed.


    # 2.13.1 Color Image Smoothing


    As has been discussed in Chapter 2, in an intensity image or a color image, regions
    or pixels can experiment with an abrupt change locally in the value


    ![](img/fa2d7e8bd88af7122f764c748b0a3723_97_0.png)


    FIGURE 2.28 Spatial processing of a color image. The processing is performed using
    a coefficient matrix that defines a processing region that operates on each color
    plane.'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'of one plane. Conversely, there are also regions or pixels in each plane where
    the intensity of the image remains constant. One way of smoothing a color image
    is that each pixel in each plane is simply replaced by the average of its neighbors
    in a region around it.


    Therefore, to calculate the pixel value of the smoothed plane \(I(x, y)\), the
    pixel of the original plane \(I''(x, y)\) is used plus its eight neighboring pixels
    \(p_1, p_2 \dots, p_8\) and the arithmetic average of these nine values is calculated:


    \(I''(x, y) \leftarrow \frac{p_0 + p_1 + p_2 + p_3 + p_4 + p_5 + p_6 + p_7 + p_8}{9}\)
    (2.64)


    In coordinates relative to the plane, the above formulation could be expressed
    as follows:


    \(I''(x, y) \leftarrow \frac{1}{9} \cdot \left[ \begin{matrix} { I(x-1, y-1) }
    & { + } & { I(x, y-1) } & { + } & { I(x+1, y-1) } & { + } \\ { I(x-1, y) } & {
    + } & { I(x, y) } & { + } & { I(x+1, y) } & { + } \\ { I(x-1, y+1) } & { + } &
    { I(x, y+1) } & { + } & { I(x+1, y+1) } \\ \end{matrix} \right]\) (2.65)


    which could be described in compact form as follows:


    \(I''(x, y) \leftarrow \frac{1}{9} \cdot \sum_{j=-1}^{1} \sum_{i=-1}^{1} I(x+i,
    y+j)\) (2.66)


    This calculated local average refers to all the typical elements present in a
    filter. Actually, this filter is an example of one of the most used types of filters,
    the so-called linear filter. In the case of color images, this process must be
    executed for each plane of the image that defines it.


    # ## 2.13.2 Smoothing Color Images with MATLAB


    To smooth a color image using a spatial filter, the following process is performed:


    +   1. Each plane of the color image is extracted.

    +   2. Each color plane is individually filtered using the same filter structure.

    +   3. The results of each plane are merged again to produce the new smoothed-out
    color image.


    The function used in MATLAB to perform spatial filtering is `imfilter`; its syntax,
    parameters, and details are discussed in Volume 1, Chapter 2, Section 2.9.3. Under
    such conditions, it will only be used in this section.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'Next, as an example, the series of commands used in MATLAB to smooth an RGB
    color image is exposed. In the example, a Box filter (Volume 1, Chapter 2) of
    dimension 7x7 is used. It is also considered that the image to smooth is stored
    in the variable RGB. Therefore, the commands that should be executed to smooth
    the image are the following:


    ```

    1 >>R=RGB(:,:,1);

    2 >>G=RGB(:,:,2);

    3 >>B=RGB(:,:,3);

    4 >>w=(ones(7,7)/49);

    5 >>Rf=imfilter(R,w);

    6 >>Gf=imfilter(G,w);

    7 >>Bf=imfilter(B,w);

    8 >>RGBf(:,:,1)=Rf;

    9 >>RGBf(:,:,2)=Gf;

    10 >>RGBf(:,:,3)=Bf;

    ```


    Commands from 1 to 3 separate each of the planes and assign them to the variables
    R, G, and B. Command 4 generates the spatial filter coefficient matrix, which,
    as can be seen, is an average whose region of influence is of dimension 7x7 (for
    more details, see Volume 1, Chapter 2). Commands 5–7 conduct the spatial filtering
    on each plane using the filter defined in command 4. Finally, in commands from
    8 to 10, the filtered planes are joined to form the new smoothed image. Figure
    2.29 shows the results of these commands over a color image as an example.


    # ## 2.13.3 Sharpness Enhancement in Color Images


    If the Laplacian operator is applied to each plane of a color image, we will obtain
    the edges in the context of that plane. However, if what is desired


    ![](img/fa2d7e8bd88af7122f764c748b0a3723_99_0.png)


