  md: '# # Mean-Shift Algorithm for Segmentation


    # ## 5.1 Introduction


    Segmentation represents one of the main steps in computer vision for dividing
    an image into distinct, non-overlapping regions, considering a certain criterion
    of similarity. The efficiency of several image processing methods, such as content-based
    retrieval, object recognition, and semantic classification, is determined by the
    quality of the used segmentation method.


    However, the appropriate segmentation of a region or objects from a complex image
    is considered a complicated task. Recently, many interesting segmentation schemes
    have been proposed in the literature. These approaches can be divided into methods
    such as graph-based [1–3], histogram-based [4,5], contour detection-based [6],
    Markov random field-based [7], fuzzy-based [8,9], thresholding-based [10,11],
    texture-based [12], clustering-based [13,14], and principal component analysis
    (PCA)-based [15]. Among such schemes, histogram-based and thresholding-based segmentation
    methods correspond to the most widely used techniques in computer vision. Thresholding-based
    approaches include methods such as bi-level and multi-level segmentation. The
    operation of such algorithms depends on the number of regions to be segmented.
    Multi-level techniques are generally required when images contain more than two
    areas to be discriminated against. Depending on their operation mechanism, multi-level
    thresholding techniques can be classified into six groups [9] such as clustering-based
    methods, object attribute-based methods, histogram-based methods, object attribute-based
    methods, local methods and spatial methods, and entropy-based methods.


    In histogram-based schemes, pixels are segmented through an analysis of several
    aspects of one-dimensional histograms, such as peaks, curvatures, valleys, etc.
    Nevertheless, since histograms with only one dimension do not relate local information
    among pixels, these schemes present in general an inadequate performance. To enhance
    the effects generated by one-dimensional histograms, several pixel features have
    been integrated to provide more information. One example includes techniques based
    on histograms of two dimensions for image thresholding segmentation introduced
    by Abutaleb [16]. Under this approach, each intensity pixel value is related'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'to its location to generate a two-dimensional histogram. From its results,
    it is evident that such a scheme gives better results in comparison to one-dimensional
    histogram-based methods. Once the concept of integrating several pixel characteristics
    has been introduced, many methods have included this concept for producing new
    segmentation approaches [17–21].


    Multi-feature approaches such as two-dimensional histograms operate on information
    that combines intensity pixel values with their local pixel positions [16,22].
    Therefore, each data piece integrates two elements: pixel intensity and its position.
    Under these schemes, the information of the diagonal in a two-dimensional histogram
    maintains important information about homogeneous regions to discriminate objects
    from the background. Differently, elements outside the diagonal represent heterogeneous
    sections in the image, corresponding to edges, texturized regions, or noise. The
    integration of pixel characteristics for segmentation purposes has also considered
    the combination of pixel intensity and its gradient information, as proposed in
    Ref. [23]. In spite of its good results, it has been demonstrated [24] that in
    different contexts, this scheme produces unsatisfactory results in comparison
    to gray-position schemes. Another interesting multi-feature approach is reported
    in Ref. [25], where a two-dimensional map is considered. In the scheme, the grayscale
    values and the results obtained by the application of a non-local means filter
    are integrated. Although all these techniques present competitive results, they
    also present an adverse characteristic associated with their high computational
    cost (CC) [25]. This problem is a consequence of the complexity of the search
    spaces in which the thresholding values must be found.


    Metaheuristic computation schemes have been extensively employed as a way to face
    classical optimization formulations [19,21]. They are computational tools based
    on natural or social principles which are used to optimize formulations [26],
    as outlined by their high complexity. Metaheuristic approaches have already been
    employed for segmentation purposes, considering several mechanisms [17,19–21,27].
    Likewise, these methods have also been proposed for multi-feature segmentation
    considering the approach based on histograms in two dimensions. Some examples
    involve methods such as Differential Evolution (DE) [28], Genetic Algorithms (GA)
    [29], Particle Swarm Optimization (PSO) [30,31], Artificial Bee Colony (ABC) [32],
    Simulated Annealing (SA) [33], Swallow Swarm Optimization (SSO) [34], Ant Colony
    Optimization (ACO) [35], Electromagnetics-like (EM) optimization [36], Stochastic
    Fractal Search (SFS) [37], and Cuckoo Search (CS) [38]. All of these approaches
    maintain one critical difficulty: the number of regions has to be established
    before their operation [25,39]. This flaw severely restricts their utilization
    when the type and main elements of the image are unknown. Segmentation schemes
    that consider metaheuristic algorithms produce excellent results with regard to
    the values of the optimization function that associates the segmentation task
    with a cost function. However, such results are not always reflected in the visual
    quality [25]. Another conflicting aspect of these methods is their high computational
    overload.'
