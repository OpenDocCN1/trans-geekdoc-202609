  md: '# 2.8.3 Determination of Color Difference


    The L*a*b* color model is designed to produce a consistent color change per position
    change. This high linearity allows, through the vector difference, to find a criterion
    that allows evaluating the difference in the color plane. The difference between
    two different colors Col1 and Col2 is, concretely, defined as the Euclidean distance
    between them. The Euclidean distance between both colors is defined as follows:


    ```

    Dist (Col_1, Col_2) = Col_1 - Col_2

    = \sqrt{(L^*_1 - L^*_2)^2 + (a^*_1 - a^*_2)^2 + (b^*_1 - b^*_2)^2}

    ```


    # 2.9 The sRGB Model


    Color spaces based on the CIE model, such as L*a*b*, are display-independent and
    generally show a very wide gamut, thus allowing virtually all hues defined in
    the CIEXYZ space to be represented. The sRGB (standard RGB) model was developed
    precisely with the idea of having these advantages by being based on the CIEXYZ
    model. The sRGB model is composed not only of the color vector that defines the
    RGB primary colors but also implicitly includes the definition of the white point
    taken as a reference. Despite the above characteristics, the sRGB model has a
    much smaller Gamut compared to the L*a*b* model. Several formats for storing images
    are defined using this color model. Among them, we have EXIF or PNG.


    The components of this model are obtained from the CIEXYZ model through a linear
    transformation determined by the matrix M_RGB and defined as follows:


    ```

    \begin{bmatrix} R \\ G \\ B \end{bmatrix} = M_{RGB} \cdot \begin{bmatrix} X \\
    Y \\ Z \end{bmatrix}

    ```


    where


    ```

    M_{RGB} = \begin{bmatrix} 3.2406 & -1.5372 & -0.4986 \\ -0.9689 & 1.8758 & 0.0415
    \\ 0.0557 & -0.2040 & 1.0570 \end{bmatrix}

    ```


    In the same way, the opposite conversion could be found:


    ```

    \begin{bmatrix} X \\ Y \\ Z \end{bmatrix} = M_{RGB}^{-1} \cdot \begin{bmatrix}
    R \\ G \\ B \end{bmatrix}

    ```'
