  md: '# 1.4.1 Opening


    The opening is defined as an erosion followed by a dilation, using the same reference
    structure for both operations [6]. The opening operation is defined as follows:


    $I \circ H = (I \ominus H) \oplus H$ (1.12)


    In the opening, the first operation (erosion) causes all the pixels in the image
    with a value of one (that are smaller than the reference structure) to be removed.
    Structures remaining in the image will, through dilation, be smoothed and enlarged
    to approximately equal to their original size (before applying erosion). Figure
    1.16 shows the effect of the opening operation using a disk-shaped reference structure
    when considering different disk sizes $r$ (see Figure 1.16b).


    # 1.4.2 Closing


    The sequence of dilation followed by erosion, using the same reference structure,
    is called the closing [6]. This operation is formally defined as follows:


    $I \bullet H = (I \oplus H) \ominus H$ (1.13)


    Through the closing operation, the holes detected inside the objects of the image,
    which are also smaller than the reference structure, are filled. Figure 1.16 shows
    the effect of the closing operation using a disk-shaped reference structure when
    considering different sizes of the disk $r$ (see Figure 1.16b).


    ![](img/fa2d7e8bd88af7122f764c748b0a3723_27_0.png)


