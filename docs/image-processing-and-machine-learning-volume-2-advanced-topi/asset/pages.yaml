- pgno: 184
  md: 'In Figure 4.17, it can be seen that, like other algorithms in this chapter,
    the points of maximum similarity represent the upper left corner of a window that
    has the same dimension as the reference pattern.


    The Chamfer relation index method for binary image comparison cannot be considered
    a magic method, capable of identifying practically any binary pattern, but it
    works well under certain restrictions on specific applications. This method presents
    problems when the pattern to be recognized is scaled, rotated, or has some type
    of distortion.


    As the Chamfer ratio index method is based on the distance of pixels whose value
    is one, its results are highly sensitive to noise and random artifacts contained
    in the image. A possible solution to reduce this problem is to use, instead of
    the linear sum of the distances (Equation 4.21), the root means square of the
    distance values produced. This model can be defined by the following equation:


    ```

    Q_{rms}(r,s) = \sqrt{\frac{1}{K} \sum_{(i,j)\in FG(R)} (D(r+i, s+j))^2} \tag{4.23}

    ```


