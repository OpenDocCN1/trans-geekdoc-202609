    # 2.14 Vector Processing of Color Images


    Until now, in the previous sections, the operations were carried out considering
    the planes independently. However, there are cases in which it is necessary to
    work with the entire vector of intensity values in all planes simultaneously.
    There is an important set of operations that require direct processing of the
    data vector. In this section, only the case of edge detection in color images
    will be described since this application is considered one of the most common.


    ![](img/fa2d7e8bd88af7122f764c748b0a3723_102_0.png)


    FIGURE 2.31 Color image whose sharpness has been enhanced by using a Laplacian
    filter. (a) Original image and (b) image with enhanced sharpness obtained after
    executing the set of MATLAB® commands described above.'
