    # 1.1.1 Neighborhood Types between Pixels


    In both types of operations, it is necessary to determine the way in which two
    pixels establish a neighborhood relationship between them. Two types of neighborhoods
    can commonly be distinguished.


    +   * **Neighborhood 4**. Under this approach, a neighborhood is considered to
    exist if a pixel is in direct relation to a neighboring pixel that is above, below,
    to the left, or to the right of the pixel in question (Figure 1.5a).

    +   * **Neighborhood 8**. Under this approach, a neighborhood is considered to
    exist if a pixel, in addition to the relationships specified by neighborhood 4,
    also has a direct relationship with the pixels diagonal to it (Figure 1.5b).'
