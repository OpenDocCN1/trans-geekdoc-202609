- pgno: 15
  md: '# 1 Morphological Operations


    The median filter has the ability to modify the two-dimensional structures present
    in the image. Among these changes, we can mention the elimination of the corners
    of structures, rounding them, or eliminating points or thin structures such as
    lines or small artifacts (see Figure 1.1). Therefore, the median filter selectively
    reacts to the shape of local image structures. However, the operation of this
    filter cannot be used in a controlled way; that is, it cannot be used to modify
    structures considering a particular method.


    Morphological filters were originally conceived to be used on binary images, that
    is, on images whose pixels only have two possible values, 1 and 0, white and black
    [1]. Binary images are found in a large number of applications, especially in
    document processing.


    In the following, we will define the pixels of the structure as those corresponding
    to one and the pixels of the background as those corresponding to zero.


    # 1.1 Shrinkage and Growth of Structures


    Starting from the fact mentioned above, the median filter 3 × 3 can be applied
    to binary images to reduce large structures and eliminate small ones. Therefore,
    the median filter can be used to eliminate structures whose size is smaller than
    the size of the median filter (in the case of example 3 × 3).


    ![](img/fa2d7e8bd88af7122f764c748b0a3723_15_0.png)


    FIGURE 1.1 Median filter 3 × 3 used on a binary image. (a) Original image and
    (b) result after filter operation.'
  merge: -1
  img_proc: true
- pgno: 16
  md: "![](img/fa2d7e8bd88af7122f764c748b0a3723_16_0.png)\n\nFIGURE 1.2 By successively\
    \ reducing and subsequently enlarging structures in an image, it is possible to\
    \ remove small elements.\n\nFrom these results, the question arises: Is there\
    \ an operation that can be used to modify elements within an image through the\
    \ use of the size and shape of a defined structure?\n\nThe effects of the median\
    \ filter can be considered interesting. However, its effect on the image, although\
    \ it can eliminate small structures, is also capable of affecting large structures.\
    \ Another approach that can be considered better and capable of controlling the\
    \ image structures is based on the following principle (see Figure 1.2):\n\n+\
    \   1. First, all structures in the image are reduced, with the result that small\
    \ structures are simply eliminated.\n+   \n+   2. Through shrinkage, small structures\
    \ are eliminated while large ones remain.\n+   \n+   3. Later, the reduced structures\
    \ are enlarged until the large structures recover their original size.\n\nFrom\
    \ Figure 1.2, it is evident that for the elimination of small structures, it is\
    \ only necessary to define two different operations: reduction and increment.\
    \ Reduction allows the pixels of the last layer of the object that is in contact\
    \ with the background to be eliminated (Figure 1.3). In the operation of increment,\
    \ a layer of pixels (belonging to the background) is added to the structure in\
    \ such a way that it grows in size (Figure 1.4)."
