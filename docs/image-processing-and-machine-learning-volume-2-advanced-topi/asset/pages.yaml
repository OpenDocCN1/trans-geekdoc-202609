  md: '# 3.3 Interpolation


    Interpolation refers to the method by which the values of a function are calculated
    at those points where there are no exact relationships between the value of the
    function and the point that represents it [7]. In geometric transformations performed
    on images, it is necessary to use the interpolation process in the transformation
    $T(x,y)$. Through the transformation $T(x,y)$ (or $T^{-1}(x,y)$) values of the
    transformed image will be calculated, which will not have an exact correspondence
    with the original, so the use of an interpolation method makes it obvious.


    # 3.3.1 Simple Interpolation Methods


    To illustrate the interpolation methods, the one-dimensional case will be analyzed
    first for simplicity, so it will be considered that there is a discrete signal
    $g(u)$ like the one described in Figure 3.13a. To interpolate the values of the
    discrete function at any of the intermediate $x \in \mathbb{R}$ positions, different
    approaches can be used. The simplest approximation is to assign to the value of
    $x$, the value of the closest neighbor $u_0$ to its position in a discrete way
    if it is defined, that is:


    $\hat{g}(x) = g(u_0)$


    ![](img/fa2d7e8bd88af7122f764c748b0a3723_139_0.png)


    FIGURE 3.13

    Interpolation of a discrete signal. (a) Discrete signal, (b) nearest neighbor
    interpolation, and (c) linear interpolation.'
