    The averaged results in terms of the indexes AD, FSIM, MD, NK, MSE, NAE, SC, SSIM,
    and PSNR, and CC are registered in Table 5.1 for all 300 images from the Berkley
    BSDS300 dataset. Low values denote a better performance for all metrics except
    for FSIM, NK, SSIM, and PSNR, which corresponds to the opposite effect. According
    to Table 5.1 the FSIM and SSIM metrics that evaluate the number of structures,
    such as edge information of the segmented image, reveals that the MS MULTI-SEGM
    method presents the best performance in preserving the relevant information and
    significant structures present in the ground truth making it suitable for feature-related
    processing tasks. As can be seen from Table 5.1, our MS method obtains the lowest
    MSE elements. Low MSE values also determine a minimum distortion or error in the
    segmented image. Results from Table 5.1 demonstrate that the PSNR value from the
    MS scheme is comparatively higher, which evaluates the quality of the segmented
    image in terms of its noisy content. From the results, it is also remarkable that
    the MS method maintains one of the lowest CC compared with other segmentation
    techniques. In fact, the PSO method, which maintains the worst performance results,
    is the only scheme that surpasses the MULTI-SEGM algorithm. After an analysis
    of Table 5.1, it is observed that the MS MULTI-SEGM scheme presents the best-averaged
    values among the considered algorithms. The approach FCM presents second place
    in terms of most of the performance indexes, while the PSO, CS, and SFS produce
    the worst results.


