    According to both tables, although the PSO maintains a small computational overload,
    its performance in terms of AD, FSIM, MD, NK, MSE, NAE, SC, SSIM, and PSNR indexes
    is the worst. Under such conditions, it can be said that the MS method provides
    the best balance with regard to quality and velocity. Besides the quantitative
    evaluation, a qualitative analysis is an important part of producing consistent
    conclusions when evaluating the performance of segmentation schemes. The objective
    of the qualitative analysis is to evaluate the visual quality and the presence
    of annoying distortions or other artifacts in the results attributed to a deficient
    operation of the used algorithms. Analyzing Figure 5.8, in general, the MS scheme
    is able to efficiently segment the images even in case of noise or texturized
    objects.


    The remarkable results of the MS method are attributed to three important elements.
    One of them is the use of a small data set for its operation instead of the complete
    dataset. This mechanism allows for reducing the segmentation process without decreasing
    its resultant quality. As a consequence, it is possible to obtain excellent segmentation
    quality by investing a small amount of time (which would be required to compute
    the complete dataset). The second factor is the use of the MS algorithm and the
    Epanechnikov kernel function. With these incorporations, it is possible to obtain
    consistent clustering'
