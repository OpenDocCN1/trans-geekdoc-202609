  md: '# 1.6.4 The Transformation of Success or Failure (‘Hit-or-Miss’)


    In the hit-or-miss transformation (Section 1.4.4), a reference structure composed
    of two elements ($H_1$ and $H_2$) is used. Under such conditions, the hit-or-miss
    transformation is defined as follows:


    ```

    $I \circledcirc H = (I \circledcirc H_1) \cap (I^c \circledcirc H_2)$ (1.23)

    ```


    The image processing toolbox implements the hit-or-miss transform using the bwhitmiss
    function, whose syntax is described by:


    ```

    IR=bwhitmiss(I, H1, H2);

    ```


    where IR is the image obtained as a result of this transformation, while H1 and
    H2 are the reference structures described in Equation 1.19.


    # 1.6.5 The bwmorph Function


    The bwmorph function implements a variety of useful operations based on combinations
    of dilations and erosions. The basic syntax of this function is:


    ```

    IR= bwmorph(I, operación, n );

    ```


    where IR is a binary image. operation is a string element that specifies the operation
    to be performed. n is a positive integer that indicates the number of times the
    operation is repeated. The term n is optional, and when it is omitted, it means
    that the operation is performed only once. Table 1.2 describes the set of operations
    that can be executed under the bwmorph function. Several of these operations have
    already been discussed in this chapter. The bwmorph function can also be considered
    as a function that quickly implements several morphological operations without
    the need to separately build the reference structure. Conversely, in the case
    of erosion and dilation, the operations are performed, defining explicitly the
    reference structure.


