    If we are interested in reproducible training runs, we need to seed the random
    generator before training with dropout (analogous to seeding the random generator
    before dropout). During inference, we need to disable dropout to guarantee deterministic
    results – each deep learning framework has a specific setting for that.


    ![Figure 10.2. Dropout randomly drops a subset of the hidden layer nodes in each
    forward pass during training](resources/figures----random-sources-dropout.png)


    Figure 10.2. Dropout randomly drops a subset of the hidden layer nodes in each
    forward pass during training


    ### Different runtime algorithms


    The most intuitive or simple implementation of an algorithm or method is not always
    the one that we use in practice. For example, when training deep neural networks,
    we often use efficient alternatives and approximations to gain speed and resource
    advantages during training and inference.


    A popular example is the convolution operation used in convolutional neural networks.
    There are several ways we can implement the convolution operation:


    1. The classic direct convolution: The common implementation of discrete convolution
    via an elementwise product between the input and the window, followed by summing
    the result to get a single number.

    2. FFT-based convolution: Uses Fast Fourier Transform (`FFT`) to convert the convolution
    into an element-wise multiplication in the frequency domain.

    3. Winograd-based convolution: An efficient algorithm for small filter sizes,
    like `3x3`, that reduces the number of multiplications required for the convolution.


    These algorithms have different trade-offs in terms of memory usage, computational
    complexity, and speed.


    When running deep neural networks on GPUs, by default, libraries such as `cuDNN`
    (CUDA Deep Neural Network library), which are used in `PyTorch` and `TensorFlow`,
    can choose different algorithms for performing convolution operations. While these
    approximations yield similar results, subtle numerical differences can accumulate
    during training and cause the training to converge to slightly different local
    minima.


    ### Hardware and drivers


    Training deep neural networks on different hardware can also result in different
    results due to small numeric differences even though the same algorithms are used,
    and the same operations are executed. These differences may sometimes be due to
    different numeric precision for floating point operations. However, small numeric
    differences may arise due to hardware and software optimization, even at the same
    precision. For instance, different hardware platforms may have specialized optimizations
    or libraries that can slightly alter the behavior of deep learning algorithms.


    > “Across different architectures, no `cuDNN` routines guarantee bit-wise reproducibility.
    For example, there is no guarantee of bit-wise reproducibility when comparing
    the same routine run on `NVIDIA Volta™` and `NVIDIA Turing™`, `NVIDIA Turing`,
    and `NVIDIA Ampere` architecture.”


    ### Randomness and Generative AI


    Besides the various sources of randomness mentioned above, certain models can
    also exhibit random behavior during inference that we can describe as randomness
    by design. For instance, generative image and language models may create different
    results for identical prompts to create a diverse sample of results. For image
    models, this is often so that users can select the most accurate and aesthetically
    pleasing image. For language models, this is often to vary the responses, for
    example, in chat agents, to avoid repetition.


    The intended randomness in generative image models during inference is often due
    to sampling different noise values at each step of the reverse process – in diffusion
    models, a noise schedule defines the noise variance added at each step of the
    diffusion process.


    Autoregressive large language models like `GPT` tend to create different outputs
    for the same input prompt. The `ChatGPT` UI even has a “Regenerate response” button
    for that. The ability to generate different results is due to the sampling strategies
    these models employ. Techniques such as top-k sampling, nucleus sampling, or temperature
    scaling influence the model’s output by controlling the degree of randomness.
    This is a feature, not a bug, since it allows for diverse responses and prevents
    the model from producing overly deterministic or repetitive outputs.


    Top-k sampling works by sampling tokens from the top `k` most probable candidates
    at each step of the next-word generation process. For instance, given an input
    prompt, the language model produces a probability distribution over the entire
    vocabulary (the candidate words) for the next token. Each token in the vocabulary
    is assigned a probability based on the model’s understanding of the context. The
    selected top-k tokens are then renormalized so that the probabilities sum to 1.
    Finally, a token is sampled from the renormalized top-k probability distribution,
    and it is appended to the input prompt. This process is repeated for the desired
    length of the generated text or until a stop condition is met.


    ![Figure 10.3. Illustration of the top-k sampling process used in generative large
    language models](resources/figures----random-sources-top-k.png)


    Figure 10.3. Illustration of the top-k sampling process used in generative large
    language models


    Nucleus sampling (also known as top-p sampling) is related to top-k sampling,
    which also aims to balance diversity and coherence in the output. Nucleus and
    top-k sampling mainly differ in selecting the candidate tokens for sampling at
    each step of the generation process. Top-k sampling selects the `k` most probable
    tokens from the probability distribution produced by the language model, regardless
    of their probabilities. The value of `k` remains fixed throughout the generation
    process.


    Nucleus sampling, on the other hand, selects tokens based on a probability threshold
    `p`. Then, it accumulates the most probable tokens in descending order until their
    cumulative probability meets or exceeds the threshold `p`. In contrast to top-k
    sampling, the size of the candidate set (nucleus) can vary at each step.


    ![Figure 10.4. Illustration of the nucleus process used in generative large language
    models](resources/figures----random-sources-top-p.png)


    Figure 10.4. Illustration of the nucleus process used in generative large language
    models


    Temperature scaling is a technique used to control the sharpness of the distribution
    by modifying the logits (values returned by the output layer) based on a temperature
    parameter `T`. A higher temperature (`T > 1`) flattens the distribution, making
    the model more likely to explore diverse tokens. In comparison, a lower temperature
    (`0 < T < 1`) sharpens the distribution, focusing the model on the most probable
    tokens. Temperature scaling can be combined with top-k or nucleus sampling to
    balance diversity and coherence in text generation.


    **> Reader quiz:**


    **10-A** Suppose we trained a neural network with top-k or nucleus sampling where
    `k` and `p` are hyperparameter choices. Can we make the model behave deterministically
    during inference without changing the code?


    **10-B** Can you think of scenarios where deterministic dropout behavior during
    inference is desired?

