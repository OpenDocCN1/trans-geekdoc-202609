  trans: '


    与 `BERT` 不同，我们不需要使用特殊的 `[CLS]`，但其基本概念与对编码器风格模型进行微调以进行分类是类似的。我们添加一个分类头（一个全连接层和一个
    softmax 激活函数），并在第一个输出标记的嵌入（最终隐藏状态）上对其进行训练。（这等比于使用 `[CLS]` 标记嵌入。）


    ### 回答 19-A


    *在什么情况下使用上下文学习（in-context learning）比微调（finetuning）更有意义，反之亦然呢？*


    如果我们无法访问模型，那么上下文学习就是很有用的。此外，如果我们想让模型适应某些它未经过训练的相似任务，上下文学习也是很有用的。


    相比之下，`finetuning` 用于将模型适应到新的目标领域。例如，假设模型在通用语料库上进行了预训练，而我们希望将其应用于金融数据或文档。在这种情况下，在来自目标领域的数据上对模型进行微调是有意义的。


    注意，上下文学习也可以与微调后的模型结合。例如，当一个预训练的语言模型在特定任务或领域上经过微调后，上下文学习可以利用模型根据输入中提供的上下文生成响应的能力，相比于没有微调的上下文学习，这种方法针对目标领域可能更加准确。


    ### 回答 19-B


    *在前缀微调（prefix tuning）、适配器（adapters）和 LoRA 中，我们如何确保模型保留（而不是忘记）原始知识？*


    这是通过隐式实现的。在前缀微调、适配器和 `LoRA` 中，通过冻结核心模型参数，同时引入适应新任务的其他可学习参数，保留了预训练语言模型的原始知识。


    ### 回答 20-A


    *查看上图中说明 BERTScore 计算的第 5 步，我们发现“cat”的两个嵌入之间的余弦相似度不是 1.0，其中 1.0 表示最大余弦相似度。这是为什么？*


    如果我们使用独立处理每个单词的嵌入技术（例如 `Word2Vec`），我们本预期“cat”嵌入之间的余弦相似度应为 1.0。然而，在这种情况下，我们使用的是
    transformer 模型来生成嵌入。Transformers 在生成嵌入向量时使用自注意力机制，会考虑整个上下文（即输入文本）。由于单词“cat”出现在两个不同的句子中，`BERT`
    模型为这两个“cat”实例生成了不同的嵌入。


    ### 回答 20-B


    *在实践中，我们可能会发现 BERTScore 不是对称的。这意味着交换候选句和参考句可能会导致特定文本产生不同的 BERTScore。我们如何解决这个问题？*


    交换候选文本和参考文本的效果与跨列计算最大余弦相似度分数（如上图第 5 步所示）相对于跨行相同，这会导致特定文本产生不同的 BERTScore。这就是为什么在实践中
    `BERTScore` 通常被计算为类似于 `ROUGE` 的 F1 分数。即，我们以一种方式计算 `BERTScore`（召回率），另一种方式（精确率），然后计算调和平均数（F1
    分数）。


    # 第 4 章：生产、现实世界与部署场景


    ### 回答 21-A


    *假设你使用随机森林模型训练了一个股票交易推荐分类器，并将股票的移动平均值作为特征。现在，由于每天都有新的股票数据产生，你正在考虑如何每天更新分类器以保持最新。你应该采用无状态训练（stateless
    training）还是无状态重训练（stateless retraining）的方法来更新分类器？*


    随机森林通常基于 `CART` 决策树，无法随着新数据的到来而轻易更新。因此，无状态训练方法是唯一可行的方案。另一方面，假设我们切换到使用递归神经网络等神经网络模型。在这种情况下，有状态的方法（stateful
    approach）可能更有意义，因为神经网络可以根据新数据进行快速更新。（不过，在决定哪种方法效果之前，最初并排比较有状态系统和无状态系统总是个好主意。）


    ### 回答 21-B


    *假设你部署了一个可以回答用户查询的大语言模型（transformer），如 `ChatGPT`。对话界面包含“点赞”和“点踩”按钮，以便用户可以根据生成的查询给出直接反馈。在收集用户反馈时，你并没有在新的反馈到达时立即更新模型。然而，你计划每月至少发布一次新模型或更新的模型。这是无状态重训练还是有状态重训练的良好选择？*


    在这里，有状态重训练方法最有意义。与其在现有数据（包括用户反馈）的组合上训练新模型，不如根据用户反馈更新模型更有意义。大型语言模型通常以自监督的方式进行预训练，然后通过监督学习进行微调。训练大型语言模型非常昂贵，因此通过有状态重训练更新模型比从头开始训练更有意义。


    ### 回答 22-A


    *最近的一个趋势是预测分析在医疗领域的使用增加。例如，假设你的医疗提供者开发了一个 AI 系统，分析患者的电子健康记录并提供生活方式改变或预防措施的建议。为此，提供者要求你每天监控并共享健康数据（如脉搏和血压）。这是一个以数据中心的
    AI 示例吗？*


    根据提供的信息，尚不清楚这是否是一个以数据中心的方法。AI 系统严重依赖数据输入来进行预测和建议，但对于任何机器学习方法都是如此。要确定这种方法是否为以数据中心的
    AI 的示例，我们需要知道 AI 系统是如何开发的。如果 AI 系统是通过使用固定模型并精炼训练数据开发的，那么这可以认为是以数据中心的方法；否则，它只是普通的机器学习和预测建模。


    ### 回答 22-B


    *假设你训练了一个卷积神经网络，特别是 `ResNet-34`，来分类 `CIFAR-10` 和 `ImageNet` 数据集中的图像。为了减少过拟合并提高分类准确性，你正在尝试不同的数据增强技术，如图像旋转和裁剪。这种方法是以数据中心的吗？*


    如果我们保持模型不变——这意味着重用相同的 `ResNet-34` 架构——并只更改数据增强方法以研究其对模型性能的影响，我们可以认为这是一种以数据为中心的方法。然而，数据增强也是任何现代机器学习流水线中作为例常执行的，单单使用数据增强并不意味着它就是以数据为中心的方法。在现代定义下，以数据为中心的方法意味着我们在保持其余建模和训练流水线不变的同时，积极研究各种增强数据集技术之间的差异。


    ### 回答 23-A


    *第 7 题涵盖了几种不同的多 GPU 训练范式，以加速模型训练。理论上，使用多个 GPU 也可以加速模型推理。然而，在实践中，有几个原因导致这种方法通常不是最高效或最实用的。你想出这些原因是什么吗？*


    例如，在推理中使用多 GPU 策略的一个缺点是 GPU 之间额外的通信开销。然而，对于推理任务，由于它们不需要梯度计算和更新，其规模相对于训练来说要小得多，GPU
    之间通信的时间可能会超过通过并行化节省的时间。


