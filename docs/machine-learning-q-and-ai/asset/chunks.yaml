    \n8 sh_translation}\"\n```\n\nPrompt tuning is a resource-efficient alternative\
    \ to parameter finetuning. However, the performance of prompt tuning is usually\
    \ not as good as full model finetuning, as it does not update the model’s parameters\
    \ for a specific task, potentially limiting its ability to adapt to task-specific\
    \ nuances. Furthermore, prompt tuning can still be labor intensive since it requires\
    \ either human involvement comparing the quality of the different prompts^([26](#chap46.xhtml#fn-auto-prompt-engineer))\
    \ – this is often known as *hard* prompting since the input tokens are not differentiable.\
    \ In contrast, *soft* prompting strategies such as *prefix tuning* optimize embedded\
    \ versions of the prompts, which we will discuss in the next section on *parameter-efficient\
    \ finetuning*.\n\nYet another way to leverage a purely in-context learning-based\
    \ approach is indexing^([27](#chap46.xhtml#fn-indexing-link)). In the context\
    \ of LLMs, we can think of indexing as a workaround based on in-context learning\
    \ that allows us to turn LLMs into information retrieval systems to extract information\
    \ from external resources and websites. Here, an indexing module parses a document\
    \ or website into smaller chunks, embedded into vectors that can be stored in\
    \ a vector database. Then, when a user submits a query, the indexing module computes\
    \ the vector similarity between the embedded query and each vector stored in the\
    \ database. Finally, the indexing module retrieves the top k most similar embeddings\
    \ to synthesize the response.\n\n![Figure 19.4. LLM-indexing to retrieve information\
    \ from external documents.](resources/figures----transformer-finetuning-indexing.png)\n\
    \nFigure 19.4. LLM-indexing to retrieve information from external documents.\n\
    \n**Parameter-Efficient Finetuning**\n\nIn recent years, many methods have been\
    \ developed to adapt pretrained transformers more efficiently for new target tasks.\
    \ These methods are commonly referred to as parameter-efficient finetuning (PEFT),\
    \ with the currently most popular methods^([28](#chap46.xhtml#fn-more-peft)) summarized\
    \ in the figure below.\n\n![Figure 19.5. The main categories of parameter-efficient\
    \ finetuning techniques with the most popular examples.](resources/figures----transformer-finetuning-categories.png)\n\
    \nFigure 19.5. The main categories of parameter-efficient finetuning techniques\
    \ with the most popular examples.\n\nThe prompt tuning approach mentioned in the\
    \ previous section (*In-Context Learning and Prompt Tuning*) is often also referred\
    \ to as “hard” prompt tuning to distinguish it from other “soft” prompting methods^([29](#chap46.xhtml#fn-soft-prompting)).\
    \ As described earlier, we modify the discrete input tokens in hard prompt tuning.\
    \ In soft prompt tuning, we utilize trainable parameter tensors instead.\n\nThe\
    \ main idea behind soft prompt tuning is to prepend a trainable parameter tensor\
    \ (the “soft prompt”) to the embedded query tokens. The prepended tensor is then\
    \ tuned to improve the modeling performance on a target dataset using gradient\
    \ descent. In pseudo-code, soft prompt tuning can be described as follows,\n\n\
    ```\n1 x = EmbeddingLayer(input_ids)\n2 x = concatenate([soft_prompt_tensor, x],\n\
    3                  dim=seq_len)\n4 output = model(x)\n```\n\nwhere the `soft_prompt_tensor`\
    \ has the same feature dimension as the embedded inputs produced by the embedding\
    \ layer.\n\nPrefix tuning^([30](#chap46.xhtml#fn-prefix-tuning-paper)) is a popular\
    \ prompt tuning method related to the soft prompt tuning approach mentioned above.\
    \ The main difference between soft prompt tuning and prefix tuning is that in\
    \ prefix tuning, we prepend trainable tensors (soft prompts) to each transformer\
    \ block instead of only the embedded inputs, as illustrated in the next figure\
    \ and pseudocode below:\n\n```\n 1 def transformer_block_with_prefix(x):\n 2 \
    \    soft_prompt = FullyConnectedLayers(\n 3       soft_prompt)  # Prefix\n 4\
    \     x = concatenate([soft_prompt, x],  # Prefix\n 5                      dim=seq_len)\
    \      # Prefix\n 6     residual = x\n 7     x = SelfAttention(x)\n 8     x =\
    \ LayerNorm(x + residual)\n 9     residual = x\n10     x = FullyConnectedLayers(x)\n\
    11     x = LayerNorm(x + residual)\n12     return x\n```\n\nThe advantage of prefix\
    \ tuning is that it can stabilize the training.\n\n![Figure 19.6. Outline of prefix\
    \ tuning.](resources/figures----transformer-finetuning-prefix.png)\n\nFigure 19.6.\
    \ Outline of prefix tuning.\n\nBoth soft prompt tuning and prefix tuning are considered\
    \ parameter-efficient since they only require training the prepended parameter\
    \ tensors, not the LLM parameters themselves.\n\nAdapter methods are related to\
    \ prefix tuning in that they add additional parameters to the transformer layers.\
    \ In the original adapter method^([31](#chap46.xhtml#fn-adapter-method)), additional\
    \ fully connected layers were added after the multihead self-attention and existing\
    \ fully connected layers in each transformer block, as illustrated in the figure\
    \ below. Only the new adapter layers are updated when training the LLM using the\
    \ adapter method, while the remaining transformer layers remain frozen. Since\
    \ the adapter layers are usually small – the first fully connected layer in an\
    \ adapter block projects its input into a low-dimensional representation and the\
    \ second layer projects it back into the original input dimension – the adapter\
    \ method is usually considered parameter-efficient.\n\n![Figure 19.7. A comparison\
    \ between a regular transformer block (left) and a transformer block with adapter\
    \ layers.](resources/figures----transformer-finetuning-adapters.png)\n\nFigure\
    \ 19.7. A comparison between a regular transformer block (left) and a transformer\
    \ block with adapter layers.\n\nIn pseudo-code, the adapter method can be written\
    \ as follows:\n\n```\n 1 def transformer_block_with_adapter(x):\n 2     residual\
    \ = x\n 3     x = SelfAttention(x)\n 4     x = FullyConnectedLayers(x)  # adapter\n\
    \ 5     x = LayerNorm(x + residual)\n 6     residual = x\n 7     x = FullyConnectedLayers(x)\n\
    \ 8     x = FullyConnectedLayers(x)  # adapter\n 9     x = LayerNorm(x + residual)\n\
    10     return x\n```\n\nLow-rank adaptation (LoRA)^([32](#chap46.xhtml#fn-lora-paper))\
    \ is another popular PEFT method worth considering. *Low-rank* adaptation refers\
    \ to reparameterizing pretrained LLM weights using low-rank transformations.\n\
    \nLow-rank transformation is a technique to approximate a high-dimensional matrix\
    \ or dataset using a lower-dimensional representation. The lower-dimensional representation\
    \ (or low-rank approximation) is achieved by finding a combination of fewer dimensions\
    \ that can effectively capture most of the information in the original data^([33](#chap46.xhtml#fn-low-rank-transformation))."
