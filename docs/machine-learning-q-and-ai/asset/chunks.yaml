    w^{(3)}\_{1} w^{(4)}\_{1}\],](resources/leanpub_equation_55.png)，第二个通道的权重为![\\mathbf{W}\_2
    = [ w^{(1)}\_{2} w^{(2)}\_{2} w^{(3)}\_{2} w^{(4)}\_{2}\].](resources/leanpub_equation_56.png)。


    为了获得这种计算的更好视觉效果，查看 Q11 是很有用的^chap46.xhtml#fn-scenario1)。


    **这有什么用？**


    局部连接、权重共享和分层处理的结合导致了空间不变性，使得无论特征在图像中的位置如何，都能识别它。让我们通过平移不变性进一步说明这一点，它是空间不变性的一种特例，我们只关注物体的移动而非旋转。


    增加步长如何影响等效性？填充如何影响层之间的等效性？


    ## Q13. Transformer 的数据集


    Q：为什么视觉 Transformer（ViT）通常比卷积神经网络（CNN）需要更大的训练集？


    答：每个机器学习算法和模型都编码了特定的假设或先验知识。这些假设通常被称为归纳偏置（inductive biases）。某些归纳偏置是使算法可行的变形，有些基于领域知识，有些两者兼有。CNN
    在设计中硬编码了更多的归纳偏置，因此通常需要较少的数据。从某种意义上说，ViT 的自由度更高，必须从数据中学习某些偏置（假设这些偏置有助于优化目标）。


    ### 归纳偏置


    为了更好地理解 CNN 的归纳偏置，我们如下：


    1. **局部连接**：CNN 中隐藏层中的每个单元只连接到前一层的一部分神经元。我们可以通过假设相邻像素比远处的像素更相关来证明这种限制是合理的。

    2. **权重共享**：通过卷积层，我们在整个图像中使用同一组较小的权重（卷积核或滤波器）。这反映了这样一种假设：相同的滤波器用于图像的不同部分检测相同的模式。

    3. **分层处理**：CNN 由多个卷积组成，用于从图像中提取特征。随着网络从输入层到输出层，低级特征被组合成日益复杂的特征，最终识别更复杂的物体和形状。此外，这些层中的卷积滤波器学习不同抽象层特定模式和特征。

    4. **空间不变性**：这指的是即使输入信号在空间域内移动，模型的输出也保持一致。这种特性源于局部连接、权重共享和上述分层处理的结合。


    '
