    Or, we could use it as an alternative to back translation, prompting it to rewrite
    a sentence, as shown in the figure below.


    ![Figure 16.1. Using ChatGPT to rewrite sentences.](resources/figures----data-augmentation-chatgpt.png)


    Figure 16.1. Using ChatGPT to rewrite sentences.


    ### When to use data augmentation?


    The data augmentation techniques discussed above, like synonym replacement, word
    deletion, and word position swapping, are commonly used in tasks such as text
    classification, sentiment analysis, and other NLP tasks where the amount of labeled
    data might be limited.


    However, when it comes to pretraining large language models (LLMs), they are usually
    trained on such a vast and diverse dataset that these augmentation techniques
    might not be used as extensively. This is because LLMs aim to capture the statistical
    properties of the language, and the vast amount of data they are trained on often
    provides a sufficient variety of contexts and expressions.


    However, in the finetuning stages of LLMs, where a pretrained model is adapted
    to a specific task with a smaller, task-specific dataset, data augmentation techniques
    might become more relevant again, mainly if the task-specific labeled dataset
    size is limited.


    16-A Could the use of text data augmentation help with privacy concerns?


    16-B What are some instances where data augmentation may not be beneficial for
    a specific task?




    ## Q17. “Self”-Attention


    **Q:** The scaled-dot product attention mechanism proposed by the original transformer
    architecture in the influential *Attention Is All You Need*^([12](#chap46.xhtml#fn-attention-is-all-you-need))
    paper is often referred to as self-attention. Why is it called “self”-attention,
    and how is it different from regular attention?


    **A:** It’s called self-attention because it’s an attention mechanism for all
    the elements of the same set. In contrast, the original attention developed for
    recurrent neural networks (RNNs) is applied between two different sequences, the
    encoder and the decoder embeddings.


    **Attention in RNNs**

