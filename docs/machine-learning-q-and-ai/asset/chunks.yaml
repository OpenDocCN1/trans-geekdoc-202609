- raw: 'Translation invariance is a specific case of spatial invariance where the
    output remains the same after a shift or translation of the input signal in the
    spatial domain. Now, convolutional layers and networks are not truly translation
    invariant but achieve a certain level of translation equivariance.


    What is the difference between translation invariance and equivariance? Translation
    invariance means that the output does not change with an input shift, while translation
    equivariance implies that the output shifts with the input in a corresponding
    manner. In other words, if we shift the input object to the right, the results
    will be correspondingly shifted to the right, as illustrated in the figure below.


    ![Figure 13.1. An illustration of equivariance demonstrated by depicting how an
    image transforms under various translations of the relevant object.](resources/figures----equivariance.png)


    Figure 13.1. An illustration of equivariance demonstrated by depicting how an
    image transforms under various translations of the relevant object.


    As mentioned earlier, CNNs achieve translation equivariance through a combination
    of their local connectivity, weight sharing, and hierarchical processing properties.
    The figure below depicts a convolutional operation to illustrate the local connectivity
    and weight-sharing priors.


    ![Figure 13.2. Illustration of translation equivariance where a convolutional
    filter captures the input signal (the two dark blocks) irrespective of where it
    is located in the input.](resources/figures----cnn-vit-2.png)


    Figure 13.2. Illustration of translation equivariance where a convolutional filter
    captures the input signal (the two dark blocks) irrespective of where it is located
    in the input.


    For comparison, a fully connected network such as a multilayer perceptron lacks
    this spatial invariance or equivariance. To illustrate this point, let us picture
    a multilayer perceptron with one hidden layer. Each pixel in the input image is
    connected with each value in the resulting output. If we shift the input by one
    or more pixels, a different set of weights will be activated, as illustrated in
    the figure below.


    ![Figure 13.3. Fully connected layers have a unique weight for each input position,
    and specific weights will not be activated in the same way if the input location
    changes.](resources/figures----cnn-vit-1.png)


    Figure 13.3. Fully connected layers have a unique weight for each input position,
    and specific weights will not be activated in the same way if the input location
    changes.


    Like fully connected networks, the ViT architecture (and transformer architecture
    in general) lacks the inductive bias for spatial invariance or equivariance^([5](#chap46.xhtml#fn-relative-embeddings)).
    For instance, the model produces different outputs if we place the same object
    in two different spatial locations within an image. This is not ideal, as the
    semantic meaning of an object remains the same based on its location. Consequently,
    it must learn these invariances directly from the data. To facilitate the learning
    of useful patterns present in CNNs, pretraining over a larger dataset is required.


    **ViTs can still outperform CNNs**


    Now, the hard-coded assumptions via the inductive biases listed above reduce the
    number of parameters in CNNs substantially compared to fully connected layers^([6](#chap46.xhtml#fn-q13-q11)).
    Vice versa, ViTs tend to have larger numbers of parameters than CNNs, which require
    more training data.


    ViTs may underperform compared to popular CNN architectures without extensive
    pretraining, but they can perform very well with a sufficiently large pretraining
    dataset. In contrast to language transformers, where unsupervised pretraining
    (i.e., self-supervised learning^([7](#chap46.xhtml#fn-q11-q2))) is a preferred
    choice, vision transformers are often pretrained using large labeled datasets
    such as ImageNet, which provides millions of labeled images for training, and
    regular supervised learning.


    An example is the comparison made in the original ViT paper^([8](#chap46.xhtml#fn-vit-pretraining-size))
    between ResNet, a convolutional network, and the original ViT architecture for
    various dataset sizes used in pretraining. The research revealed that the ViT
    architecture outperformed the convolutional network only after pretraining on
    at least 100 million images.


    **Do ViTs learn differently?**


    Note that ViTs are not free from any inductive biases. For example, vision transformers
    “patchify” the input image to process each input patch individually. Here, each
    patch can attend to all other patches so the model learns relationships between
    far-apart patches in the input image.


    ![Figure 13.4. An illustration of how a vision transformer operates on image patches.](resources/figures----cnn-vit-3.png)


    Figure 13.4. An illustration of how a vision transformer operates on image patches.


    The *patchify* inductive bias is important because it allows ViTs to scale to
    larger image sizes without increasing the number of parameters in the model, which
    can be computationally expensive. By processing smaller patches individually,
    ViTs can efficiently capture spatial relationships between image regions while
    benefiting from the global context captured by the self-attention mechanism.


    And this raises another question: how and what do ViTs learn from the training
    data? ViTs learn more uniform feature representations across all layers, with
    self-attention mechanisms enabling early aggregation of global information. In
    addition, the residual connections in ViTs strongly propagate features from lower
    to higher layers, in contrast to the more hierarchical structure of CNNs^([9](#chap46.xhtml#fn-vit-see)).


    ViTs tend to focus more on global than local relationships because the self-attention
    mechanism in ViTs allows the model to consider long-range dependencies between
    different parts of the input image. Consequently, the self-attention layers in
    ViTs are often considered low-pass filters that focus more on shapes and curvature.


    In contrast, the convolutional layers in CNNs are often considered high-pass filters
    that focus more on texture. But we should note that convolutional layers can act
    as both high-pass and low-pass filters, depending on the learned filters at each
    layer. High-pass filters detect an image’s edges, fine details, and texture, while
    low-pass filters capture more global, smooth features and shapes. CNNs achieve
    this by applying convolutional kernels of varying sizes and learning different
    filters at each layer.


    **ViTs or CNNs?**


    ViTs have recently begun outperforming CNNs if enough data is available for pretraining.
    However, this doesn’t make CNNs obsolete, as methods such as EfficientNetV2 are
    less memory- and data-hungry.


    Moreover, recent ViT architectures don’t solely rely on large datasets, parameter
    numbers, and self-attention. Instead, they have taken inspiration from CNNs and
    added soft convolutional inductive biases^([10](#chap46.xhtml#fn-convit)) or even
    complete convolutional layers^([11](#chap46.xhtml#fn-vit-conv)) to get the best
    of both worlds.


    In conclusion, vision transformer architectures without convolutional layers generally
    have fewer spatial and locality inductive biases than convolutional neural networks.
    Consequently, vision transformers need to learn data-related concepts such as
    local relationships among pixels. Thus, vision transformers require more training
    data to achieve good predictive performance and produce acceptable visual representations
    in generative modeling contexts.


    **\> Reader quiz:**


    **13-A**


    Consider the *patchification* of the input images illustrated in the figure above.
    The size of the resulting patches controls a computational and predictive performance
    tradeoff. The optimal patch size depends on the specific application and desired
    trade-off between computational cost and model performance. Do smaller patches
    typically result in higher or lower computational costs?


    **13-B**'
