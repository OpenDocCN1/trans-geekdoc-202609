    1. `ROUGE-N`: 该指标衡量候选摘要与参考摘要之间 `N-grams` 的重叠程度。例如，`ROUGE-1` 查看单个单词（`1-grams`）的重叠情况，而
    `ROUGE-2` 则考虑 `2-grams`（双词组）的重叠。


    2. `ROUGE-L`: 该指标衡量候选摘要与参考摘要之间的最长公共子序列（`LCS`）。它捕捉了单词的最长共同出现顺序子序列，这些序列之间可能存在间隔。


    3. `ROUGE-S`: 该指标衡量跳跃双词对（skip-bigrams）的重叠情况，跳跃双词对是指中间具有灵活数量单词的对。对于捕捉不同词序句子之间的相似性非常有用。


    ROUGE 与 `BLEU` 具有相似的缺点。与 `BLEU` 一样，`ROUGE` 不考虑同义词或改写。它衡量的是候选摘要与参考摘要之间的 n-gram
    重叠，这可能导致语义相似但词汇不同的句子获得较低分。尽管如此，了解 `ROUGE` 仍然很有价值，因为 2021 年计算语言学会议上介绍新摘要模型的论文都使用了
    `ROUGE` —— 根据 [*Repairing the Cracked Foundation: A Survey of Obstacles in Evaluation
    Practices for Generated Text*](https://arxiv.org/abs/2202.06935)，这些论文中有 69% 只使用了
    `ROUGE`。


    ## BERTScore


    `BERTScore` 可用于翻译和摘要，比 `BLEU` 和 `ROUGE` 等传统指标更好地捕捉语义相似性。特别是，它对改写更具鲁棒性。


    对于熟悉生成式视觉模型起始分数（inception score）的读者，`BERTScore` 采用了类似的方法，使用预训练模型的嵌入。在这里，`BERTScore`
    通过利用 `BERT` 模型产生的上下文嵌入来衡量候选文本与参考文本之间的相似性。


    我们可以通过以下步骤总结 BERT 分的计算：


    1. 通过你想要评估的大语言模型（`PaLM`、`LLaMA`、`GPT`、`BLOOM` 等）获取候选文本

    2. 将候选文本和参考文本分词为子词（最好使用与训练 `BERT` 相同的 `tokenizer`）

    3. 使用预训练的 `BERT` 模型为候选文本和参考文本中的所有 token 创建嵌入

    4. 然后，将候选文本中的每个 token 嵌入与参考文本中的所有 token 嵌入进行比较，计算它们的余弦相似度

    5. 将候选文本中的每个 token 与参考文本中余弦相似度最高的 token 对齐

    6. 通过对候选文本中所有 token 的相似度得分取平均值来计算最终的 `BERTScore`


    感兴趣的读者可以在[补充材料](https://github.com/rasbt/MachineLearning-QandAI-book.）中找到计算示例


    ![图 20.3. 如何计算 BERTScore 的插图。](img/figures----bertscore.png)


    图 20.3. 如何计算 BERTScore 的插图。


    由于其上下文嵌入，`BERTScore` 对改写更鲁棒，并能更好地捕捉语义相似性。然而，由于需要使用预训练的 `BERT` 模型进行评估，它的计算开销更大。


    需要注意的是，虽然 `BERTScore` 提供了一个实用的自动评估指标，但它并非完美，应该与其他评估技术（包括人工判断）结合使用。


    ## 结论


    上述涵盖的所有指标都是替代指标或代理指标，用于评估模型在衡量完成目标时与人类表现对比的方面的用处。如前所述，评估 `LLMs` 的最佳方法是分配人类评分员来判断结果。然而，由于这通常成本昂贵且难以扩展，我们使用上述指标来估计模型性能。引用
    `InstructGPT` 论文中的话：


    > “公共 NLP 数据集并没有反映我们语言模型的使用情况。. . . [它们]”


    '
