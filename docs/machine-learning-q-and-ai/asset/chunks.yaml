  trans: "\n\n*   增强后的句子：“The quickly jumped over the lazy dog.”（删除了“cat”）\n\n此外，应该仔细选择删除率，以确保文本在单词被删除后仍然保持逻辑通顺。\n\
    \n### 词位置交换\n\n词位置交换（也称为词洗乱或置换）是另一种文本数据增强方法，它通过交换或重新排列句子中单词的顺序，来创建句子的新版本。\n\n\
    让我们再次使用之前的句子“The cat quickly jumped over the lazy dog”作为例子。通过交换某些单词的位置，我们可能会得到以下结果：\n\
    \n*   原始句子：“The cat quickly jumped over the lazy dog.”\n*   增强后的句子：“Quickly the\
    \ cat jumped the over lazy dog.”\n\n虽然这些句子在英语中听起来可能不符合语法或很奇怪，但它们仍然可以为数据增强提供价值的训练信息。这是因为模型仍然可以识别重要的词以及它们彼此之间的关联。\n\
    \n然而，这种方法也有其局限性。例如，过度洗乱单词或以某些方式洗乱可能会剧烈改变句子的意思或使其变得完全毫无意义。\n\n### 句子洗乱\n\n句子洗乱是一种数据增强技术，通过重新排列段落或文档内的整个句子来创建输入文本的新版本。这种技术在处理文档级分析或段落级理解的任务中特别有用，例如文档分类、主题建模或文本摘要。\n\
    \n与上述词位置交换、单词删除和同义词替换等技术相比，句子洗乱保持了单个句子的内部结构。尽管如此，它改变了它们在更广泛语境中的顺序。\n\n相比之下，上述基于词的方法（如词位置交换）如果应用不当，可能会导致句子不符合语法或完全改变其含义，因为在许多语言中，词汇的选择或顺序对句子的含义至关重要。\n\
    \n当句子的顺序对文本的整体含义不重要时，句子洗乱是有用的。但如果句子之间在逻辑或时间顺序上是连接的，它可能效果不好。例如，考虑以下段落：\n\n*   “我去了超市。”\n\
    *   “然后，我买了做披萨的材料。”\n*   “之后，我做了一些美味的披萨。”\n\n当按照如下方式重新洗乱时，它破坏了叙事的逻辑和时间进展性：\n\n\
    *   “之后，我做了一些美味的披萨。”\n*   “然后，我买了做披萨的材料。”\n*   “我去了超市。”\n\n### 噪声注入\n\n噪声注入是一个统术语，包含了上述其他用于创建文本变体的技术，例如同义词替换、词洗乱、单词删除和句子洗乱。然而，它也可以指代插入随机字母、字符或拼写错误等字符级技术。这些技术的示例所示：\n\
    \n*   随机字符插入：“The cat qzuickly jumped over the lazy dog.”（在单词“quickly”中插入了一个“z”）。\n\
    *   随机字符删除：“The cat quickl jumped over the lazy dog.”（从单词“quickly”中删除了“y”）。\n\
    *   引入输入错误：“The cat qickuly jumped over the lazy dog.”（在“quickly”中引入了拼写错误，将其改为“qickuly”）。\n\
    \n这些修改对于涉及拼写检查和文本修正的任务是有益的。但也可以帮助模型对不完美的输入更具鲁棒性。\n\n### 回译\n\n回译是创建文本变体最广泛的技术之一。在这里，句子首先从原始语言翻译成一种或多种不同的语言，然后翻译回原始语言。来回翻译通常会产生与原句语义相似的句子，但在结构、词汇或语法上引入细微的变化。这在不改变整体含义的情况下，为训练生成额外的、多样化的示例。\n\
    \n让我们以熟悉的句子“The cat quickly jumped over the lazy dog”为例，看看使用德语作为中间语言的回译示例：\n\n\
    *   首先，我们将句子翻译成德语。我们可能会得到：“Die Katze sprang schnell über den faulen Hund.”\n*\
    \   然后，我们将该句子翻译回英语。我们可能会得到：“The cat jumped over the lazy dog.”\n\n请注意，回译引起的句子变化程度取决于所使用的语言和机器翻译模型。在这种情况下，句子保持非常相似。尽管如此，在其他情况下或其他语言之间，你可能会看到单词或结构的显著变化。\n\
    \n此外注意，这种方法需要可靠的机器翻译模型，并且确保回译句子保留核心含义。\n\n### 合成数据\n\n合成数据是一个统术语，包含了上述所有技术，如回译、替换、单词删除、词位置交换、句子洗乱和噪声注入等。所有这些方法都是通过对现有数据进行细微更改来生成新数据。\n\
    \n现代合成数据技术现在包括使用大语言模型（LLMs），例如 GPT-4。我们可以使用这些模型通过“完成句子”或“生成示例句子”等提示词从零生成新数据。或者，我们可以将其作为回译的替代方案，让其重写句子，如下所示：\n\
    \n![图 16.1 使用 ChatGPT 重写句子](img/figures----data-augmentation-chatgpt.png)\n\n\
    图 16.1 使用 ChatGPT 重写句子。\n\n### 何时使用数据增强？\n\n上述数据增强技术（如同义词替换、单词删除和词位置交换）通常用于文本分类、情感分析等标注数据可能有限的\
    \ NLP 。\n\n然而，对于预训练大语言模型（LLM），通常在如此巨大且多样化的数据集上训练，这些增强技术可能不会被广泛使用。这是因为 LLM 旨在捕捉语言的统计特性，而它们训练的大量数据通常提供了足够的上下文和表达。\n\
    \n但在 LLM 的微调阶段（使用较小的特定任务数据集适配预训练模型），数据增强技术可能会再次变得重要，特别是当特定任务标记数据集有限时。\n\n16-A\
    \ 使用文本数据增强有助于解决隐私问题吗？\n\n16-B 在哪些情况下数据增强对特定任务可能没有帮助？\n\n\n\n\n\n\n\n Q17. “自”注意力\n\
    \n**Q:** 在具有影响力的《Attention Is All You Need》^(12) 论文中，原始 Transformer 架构提出的缩放点积注意力注意力机制通常被称为自注意力。为什么它被称为“自”注意力？它与普通注意力有什么区别？\n\
    \n**A:** 它被称为自注意力，是因为它是针对同一集合中所有元素的注意力机制。相比之下，最初为循环神经网络（RNN）开发的注意力机制应用于两个不同的序列，即编码器和解码器嵌入。\n\
    \n**RNN 中的注意力机制**\n\n"
