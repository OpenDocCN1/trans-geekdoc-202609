  trans: '

    此外，管理多个 `GPUs` 意味着更高的设备和能源成本。在实践中，针对单 `GPU` 或 CPU 性能优化模型通常更具价值。如果有多个 `GPUs` 可用，那么在不同的
    `GPUs` 上并行处理多个样本，通常比通过多个 `GPUs` 处理同一个样本更有意义。


    ### 回答 23-B


    *向量化（Vectorization）和循环分块（loop tiling 或 loop blocking）是优化涉及数组元素操作的两种不同策略。你会在什么情况下使用哪一个？*


    循环分块通常与向量化结合使用。例如，在应用循环分块后，每个分块（tile）都可以使用向量化操作进行处理。这允许我们对已经在缓存中的数据使用 `SIMD` 指令，从而提高这两种技术的有效性。


    ## 第 5 章：预测性性能与模型评估


    ### 回答 25-A


    *假设我们想预测一名足球运动员在特定赛季的进球数。这是一个可以用可以用序数回归或泊松回归解决的问题吗？*


    如果我们尝试预测球员的进球数（例如基于过去赛季的数据），那么这是一个 `Poisson regression`（泊松回归）问题。另一方面，我们也可以对不同的球员应用
    `ordinal regression`（序数回归）模型，按预计的进球数对他们进行排名。然而，由于进球差是恒定的且可以量化的（例如，3 个和 4 个球之间的差异与
    15 个和 16 个球之间的差异相同），因此对于 `ordinal regression` 模型来说并不是一个理想的问题。


    ### 回答 25-B


    *假设你要求某人根据偏好顺序对他们最后观看的三部电影进行排序。忽略该数据集对于机器学习来说有点太小这一事实，哪种方法最适用于这类数据？*


    这是一个排序问题，类似于 `ordinal regression` 问题，但存在一些差异。由于我们只知道电影的相对顺序，因此，成对排名算法（pairwise
    ranking algorithm）可能比 `ordinal regression` 模型更合适的解决方案。


    然而，如果要求此人在一个尺度上为每部电影分配数值标签（例如 1 到 5 分，类似于亚马逊上的星级评分系统），那么就可以在此类数据上训练并使用 `ordinal
    regression` 模型了。


    ### 回答 27-A


    *假设我们考虑使用平均绝对误差 (`MAE`) 作为均方根误差 (`RMSE`) 衡量机器学习模型性能的替代方案，其中*


    ![\\mathrm{MAE}=\\frac{1}{n} \sum\_{i=1}^n\left|y^{(i)} - \hat{y}^{(i)}\right|](img/leanpub_equation_139.png)


    *以及*


    ![\\mathrm{RMSE}= \sqrt{\frac{1}{n} \sum\_{i=1}^n\left(y^{(i)} - \hat{y}^{(i)}\right)²}.](img/leanpub_equation_140.png)


    *然而，一位同事认为 `MAE` 不是度量空间中的适当度量，因为它涉及绝对值，所以我们应该倾向于使用 `RMSE`。这个观点正确吗？*


    由于 `MAE` 基于距离的绝对值，它自然地符合第一个标准：它不能为负数。此外，如果交换数值 ![y](img/leanpub_equation_141.png)和
    ![\\hat{y};](img/leanpub_equation_142.png)，`MAE` 是相同的，因此它满足第二个标准。三角形不等式呢？类似于 `RMSE`
    等于欧几里得距离或 `L2` 范数，`MAE` 类似于两个向量之间的 `L1` 范数。由于所有向量范数都满足三角形不等式(10)，我们的同事是不正确的。


    此外，即使 `MAE` 不是适当的度量，它仍然是有效的。


    ### 回答 27-B


    *基于你的回答，由于 `MAE` 比 `RMSE` 更关注异常值，我们应该更倾向于使用 `RMSE` 吗？*


    `RMSE` 对较大的误差赋予更大的权重。然而，由于进球差是恒定的且可以量化的（例如，3 个和 4 个球之间的差异与 15 个和 16 个球之间的差异相同），因此对于
    `ordinal regression` 模型来说并不是一个理想的问题。


    由于 `MAE` 比 `RMSE` 更关注异常值，然而，它们在在许多研究中都是通用的(11)。


    ### 回答 28-A


    *假设我们考虑使用留一交叉验证（leave-one-out cross-validation，`LOOCV`）来提供更多的训练数据，其中 `k` 等于训练样本的数量。`LOOCV`
    是 k 折交叉验证的一个特例。由于每个验证折只包含单个训练样本，`LOOCV` 的准确率总是 0% 或 99%。这真的是一个问题吗？*


    这取决于我们是否只关心估计的方差。在这种情况下，由于每个验证折只包含单个训练样本，`LOOCV` 并不非常有用。


    ### 回答 28-B


    *我们讨论了模型选择和模型评估作为 k 折交叉验证的两个用例。你能想到其他用例吗？*


    k 折交叉验证的另一个用例是模型集成。例如，在 5 折交叉验证中，我们训练五个不同的模型。然而，与其在训练集上训练一个最终模型，我们可以将这五个模型组合成集成。


    ### 回答 29-A


    *对抗预测任务的良好的性能基准是什么？*


    作为性能基准，一个好主意是实现零规则分类器，即多数类分类器。由于我们通常的训练数据多于测试数据，我们可以计算一个始终预测 `Is test? False`
    的模型的性能，如果我们把原始数据集分为 70% 的训练数据和 30% 的测试数据，准确率应为 70%。如果在对抗数据集上训练的模型显著超过了这一基准（例如
    80%），那么我们可能有一个严重的差异问题需要调查。


    ### 回答 29-B


    *由于训练集通常大于测试集，对抗验证经常导致预测平衡问题（我们有更多“Is test?”等于 false 的样本）。这是一个问题吗？如果是，我们如何减轻它？*


    总的来说，这不是一个大问题，因为我们主要感兴趣的是相对于随机基准的强偏差。也就是说，如果我们对抗验证模型的准确率与基准（而不是 50% 的准确率）进行比较，那么应该没有问题。然而，可能更好的考虑马修相关系数或
    ROC 或 精率-召回率曲线下面等评估指标，而不是准确率。


    ### 回答 30-A


    *考虑到构建一个利用图像检测类似于 iPad 的平板设备外壳制造缺陷的机器学习模型，我们可以获得以下数据：*


    * 数百万未标记的各种计算设备（包括手机、平板电脑和电脑）的图像。

    * 数千张已标记的手机照片，显示各种类型的损坏。

    * 数百张与目标任务（检测平板设备制造缺陷）相关的标记图像。


    *我们应该如何使用自监督学习或迁移学习来处理这个问题？*


    '
