    # 引言


    平移不变性（Translation invariance）是空间不变性的特定情况，即输出在输入信号发生空间域发生平移后保持不变。现在，卷积层和网络并非真正的平移不变，而是实现了某种程度的平移等变性（translation
    equivariance）。


    平移不变性和等变性之间有什么区别？


    平移不变意味着输出不随输入的移动而改变，而平移等变性意味着输出会相应地随输入移动。换句话说，如果我们将输入对象向右移动，结果也将相应地向右移动，如图所示。


    ![图 13.1. 通过描述图像在相关对象不同平移下的变换来展示等变性的说明。](img/figures----equivariance.png)


    图 13.1. 通过描述图像在相关对象不同平移下的变换来展示等变性的说明。


    如前所述，CNN 通过其局部连接、权重共享和分层处理属性的结合实现了平移等变。下图描述了一个卷积操作，用来说说明局部连接和权重共享先验。


    ![图 13.2. 平移等变性的插图，其中卷积滤波器无论输入信号位于何处都能捕捉到它（两个深色块）。](img/figures----cnn-vit-2.png)


    图 13.2. 平移等变性的插图，其中卷积滤波器无论输入信号位于何处都能捕捉到它（两个深色块）。


    相比之下，全连接网络（如多层感知机）缺乏这种空间不变性或等变性。为了说明这一点，让我们想象一个有一个隐藏层的多层感知机。输入图像中的每个像素都与最终输出中的每个值连接。如果我们将输入移动一个或多个像素，将激活一组不同的权重，如图所示。


    ![图 13.3. 全连接层为每个输入位置拥有唯一的权重，如果输入位置改变，特定的权重将不会以相同的方式激活。](img/figures----cnn-vit-1.png)


    图 13.3. 全连接层为每个输入位置拥有唯一的权重，如果输入位置改变，特定的权重将不会以相同的方式激活。


    与全连接网络一样，ViT 架构（以及一般的 Transformer 架构）缺乏空间不变性或等变的归纳偏置^(5)。例如，如果我们在图像中两个不同的空间位置放置同一个对象，模型会产生不同的输出。这并不理想，因为对象的语义意义应根据其位置而保持不变。因此，它必须直接从数据中学习这些不变性。为了便于学习
    CNN 中存在的有用模式，需要在更大的数据集上进行预训练。


    ## ViTs 仍然可以优于 CNNs


    现在，通过上述归纳偏置进行的硬编码假设与全连接层相比大幅减少了 CNN 的参数数量^(6)。相反，ViTs 的参数量通常比 CNN 大，因此需要更多训练数据。


    在没有大量预训练的情况下，ViTs 的表现可能不如流行的 CNN 架构，但在足够大的预训练数据集上，它们的表现会非常好。与无监督预训练（即自预训练）很常见的语言
    Transformer 不同，视觉 Transformer 需要更多的标注数据。为了便于学习 CNN 中存在的有用模式，需要在更大的数据集上进行预训练。


    与无监督预训练（即自预训练）很常见的语言 Transformer 不同，视觉 Transformer 需要更多的标注数据。为了便于学习 CNN 中存在的有用模式，需要在更大的数据集上进行预训练。


    ## ViTs 的学习方式不同吗？


    现在，通过上述归纳偏置进行的硬编码假设与全连接层相比大幅减少了 CNN 的参数数量^(6)。相反，ViTs 的参数量通常比 CNN 大，因此需要更多训练数据。


    在没有大量预训练的情况下，ViTs 的表现可能不如流行的 CNN 架构，但在足够大的预训练数据集上，它们的表现会非常好。与无监督预训练（即自预训练）很常见的语言
    Transformer 不同，视觉 Transformer 需要更多的标注数据。为了便于学习 CNN 中存在的有用模式，需要在更大的数据集上进行预训练。


    现在，通过上述归纳偏置进行的硬编码假设与全连接层相比大幅减少了 CNN 的参数数量^(6)。相反，ViTs 的参数量通常比 CNN 大，因此需要更多训练数据。


    ## ViTs 还是 CNNs？


    如果有足够的数据进行预训练，ViTs 最近已开始超越 CNNs。然而，这并不意味着 CNN 过时了，因为像 EfficientNetV2 这样的方法对内存和数据的需求较少。


    此外，最近的 ViT 架构并不完全依赖大型数据集、参数数量和自注意力。相反，它们从 CNN 中汲取灵感，并添加了软卷积归纳偏置^(10) 甚至完整的卷积层^(11)
    以兼顾两者的优势。


