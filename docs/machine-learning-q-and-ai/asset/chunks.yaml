- raw: 'Over the years, the machine learning community developed several approaches
    for meta-learning. To further complicate matters, meta-learning can refer to different
    processes.


    Meta-learning is one of the main subcategories of few-shot learning (mentioned
    above). Here, the focus is on learning a *good* feature extraction module. The
    feature extraction module converts support and query images into vector representations.
    These vector representations are optimized for determining the predicted class
    of the query example via comparisons with the training examples in the support
    set. (This form of meta-learning is illustrated in [Q3](#chap14.xhtml#q3), Figure
    13.)


    Another branch of meta-learning, unrelated to the few-shot learning approach above,
    is focused on extracting meta-data (also called meta-features) from datasets for
    supervised learning tasks. The meta-features are descriptions of the dataset itself.
    For example, these can include the number of features and statistics of the different
    features (kurtosis, range, mean, etc.).


    The extracted meta-features provide information for selecting a machine learning
    algorithm for the given dataset at hand. Using this approach, we can narrow down
    the algorithm and hyperparameter search spaces, which helps reduce overfitting
    when the dataset is small.


    ![Figure 30.5. Illustration of the meta-learning process involving the extraction
    of meta-data.](resources/figures----metalearning.png)


    Figure 30.5. Illustration of the meta-learning process involving the extraction
    of meta-data.


    **8) Weakly supervised learning**


    Weakly supervised learning is a procedure where we use an external label source
    to generate labels for an unlabeled dataset. Often, the labels created by a weakly
    supervised labeling function are more noisy or inaccurate than those produced
    by a human or domain expert; hence, the term *weakly* supervised.


    Often, we can develop or adopt a rule-based classifier to create the labels in
    weakly supervised learning – these rules usually only cover a subset of the unlabeled
    dataset.


    ![Figure 30.6. Illustration of weakly supervised learning.](resources/figures----weak-supervision.png)


    Figure 30.6. Illustration of weakly supervised learning.


    Imagine the context of email spam classification as an example of a rule-based
    approach for data labeling. In weak supervision, we could design a rule-based
    classifier based on the keyword “SALE” in the email subject header line to identify
    a subset of spam emails. Note that while we may use this rule to label certain
    emails as spam-positive, we should not apply this rule to label emails without
    SALE as non-spam but leave those either unlabeled or apply a different rule to
    these^([13](#chap46.xhtml#fn-pu-learning)).


    In short, weakly supervised learning is an approach for increasing the number
    of labeled instances in the training set. Hence, other techniques, such as semi-supervised,
    transfer, active, and zero-shot learning, are fully compatible with weakly supervised
    learning.


    **9) Semi-supervised learning**


    Semi-supervised learning is closely related to weakly supervised learning described
    above: we create labels for unlabeled instances in the dataset. The main difference
    between weakly supervised and semi-supervised learning is *how* we create the
    labels^([14](#chap46.xhtml#fn-weak-semi)).


    In weak supervision, we create labels using an external labeling function that
    is often noisy, inaccurate or only covers a subset of the data. In semi-supervision,
    we do not use an external label function but leverage the structure of the data
    itself.


    ![Figure 30.7. Illustration of semi-supervised learning.](resources/figures----semi-supervised.png)


    Figure 30.7. Illustration of semi-supervised learning.


    In semi-supervised learning, we can, for example, label additional data points
    based on the density of neighboring labeled data points, as illustrated in the
    figure below.


    While we can apply weak supervision to an entirely unlabeled dataset, semi-supervised
    learning requires at least a portion of the data to be labeled. In practice, it
    is possible first to apply weak supervision to label a subset of the data and
    then use semi-supervised learning to label instances that were not captured by
    the labeling functions.


    **10) Self-training**


    Self-training is a category that falls somewhere between semi-supervised learning
    and weakly supervised learning. In self-training, we train a model or adopt an
    existing model to label the dataset. This model is also referred to as a *pseudo-labeler*.


    Since the model used in self-training does not guarantee accurate labels, self-training
    is related to weakly supervised learning. Moreover, while we use or adopt a machine
    learning model for this pseudo-labeling, self-training is also related to semi-supervised
    learning.


    An example of self-training is knowledge distillation, discussed in [Q6](#chap17.xhtml#q6).


    **11) Multi-task learning**


    Multi-task learning trains neural networks on multiple, ideally related tasks.
    For example, suppose we are training a classifier to detect spam emails; here,
    spam classification is the main task. In multi-task learning, we can add one or
    more related tasks the model has to solve. These additional tasks are also referred
    to as *auxiliary tasks*. If the main task is email spam classification, an auxiliary
    task could be classifying the email’s topic or language.


    Typically, multi-task learning is implemented via multiple loss functions that
    have to be optimized simultaneously – one loss function for each task. The auxiliary
    tasks serve as an inductive bias, guiding the model to prioritize hypotheses that
    can explain multiple tasks. This approach often results in models that perform
    better on unseen data^([15](#chap46.xhtml#fn-multi-task-ref)).


    There are two subcategories of multi-task learning: (1) multi-task learning with
    *hard* parameter sharing and (2) multi-task learning with *soft* parameter sharing^([16](#chap46.xhtml#fn-multi-task-ruder)).


    ![Figure 30.8. Illustration of the two main types of multi-task learning. For
    simplicity, the figure depicts only two tasks, but multitask learning can be used
    for any number of tasks.](resources/figures----multitask-learning.png)


    Figure 30.8. Illustration of the two main types of multi-task learning. For simplicity,
    the figure depicts only two tasks, but multitask learning can be used for any
    number of tasks.


    The figure above illustrates the difference between hard and soft parameter sharing.
    In hard parameter sharing, only the output layers are task-specific, while all
    tasks share the same hidden layers and neural network backbone architecture. In
    contrast, soft parameter sharing uses separate neural networks for each task,
    but regularization techniques such as distance minimization between parameter
    layers are applied to encourage similarity among the networks.


    **12) Multi-modal learning**


    While multi-task learning involves training a model with multiple tasks and loss
    functions, multi-modal learning focuses on incorporating multiple types of input
    data.


    Common examples of multi-modal learning are architectures that take both image
    and text data as input^([17](#chap46.xhtml#fn-multi-modal-unlimited)). Depending
    on the task, we may employ a matching loss that forces the embedding vectors ([Q1](#chap12.xhtml#q1))
    between related images and text to be similar, as shown in the figure below.


    ![Figure 30.9. Illustration of multi-modal learning with a matching loss that
    forces embeddings from different types of inputs to be similar.](resources/figures----multimodal-learning-1.png)


    Figure 30.9. Illustration of multi-modal learning with a matching loss that forces
    embeddings from different types of inputs to be similar.'
