    ticket`, even demonstrated improved generalization performance compared to the
    original (large and dense) network.


    ## Practical implications and limitations


    Suppose it is possible to identify smaller subnetworks that have the same predictive
    performance as their up to 10x larger counterparts. In that case, this can have
    significant implications for both neural training and inference. Given the ever-growing
    size of modern neural network architectures, this can help with cutting training
    costs and the infrastructure required for training. Additionally, smaller networks
    are more cost-effective and have lower latency when used for inference, making
    them a valuable option for many applications.


    Sounds too good to be true? Maybe. If the `winning tickets` can be identified
    efficiently, this would be very useful in practice. However, as of this writing,
    there is no way to find the `winning tickets` without training the original network.
    If we include the pruning steps, this is even more expensive than a regular training
    procedure. Moreover, it was later found that the original weight initialization
    may not work for finding `winning tickets` for larger-scale networks, and additional
    experimentation with the initial weights of the pruned networks is required.


    However, the good news is that `winning tickets` do exist, and even if it’s currently
    not possible to identify these without training their larger neural network counterparts,
    they can be used for more efficient inference after training.


