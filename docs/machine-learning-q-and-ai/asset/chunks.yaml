    \ expenses.\n\nThe various model- and training-related techniques to reduce overfitting\
    \ can be grouped into three broad categories: adding regularization, choosing\
    \ smaller models, and building ensemble models. The following paragraphs outline\
    \ the key ideas and techniques from each category.\n\n### Regularization\n\nWe\
    \ can interpret regularization as a penalty against complexity. Classic regularization\
    \ techniques for neural networks include `![L_2](resources/leanpub_equation_0.png)`regularization\
    \ and the related weight decay method. We implement `![L_2](resources/leanpub_equation_1.png)`regularization\
    \ by adding a penalty term to the loss function that is minimized during training.\
    \ This added term represents the size of the weights, for instance, the squared\
    \ sum of the weights. The formula below shows an `![L_2](resources/leanpub_equation_2.png)`regularized\
    \ loss:\n\n![\\\\text {RegularizedLoss }=\\text { Loss }+\\frac{\\lambda}{n} \\\
    sum\\_j w\\_{j}^{2},](resources/leanpub_equation_3.png)\n\nwhere `[\\lambda](resources/leanpub_equation_4.png)`\
    \ is a hyperparameter that controls the regularization strength.\n\nDuring backpropagation,\
    \ the optimizer minimizes the modified loss, now including the additional penalty\
    \ term, which leads to smaller model weights and can improve generalization to\
    \ unseen data.\n\nWeight decay is similar to `![L_2](resources/leanpub_equation_5.png)`regularization,\
    \ but it is applied to the optimizer directly rather than modifying the loss function.\
    \ Since weight decay has the same effect as `![L_2](resources/leanpub_equation_6.png)`regularization,\
    \ it is often used.\n\n### Dropout and early stopping\n\nDropout reduces overfitting\
    \ by randomly setting some of the hidden units to zero. Early stopping is a technique\
    \ where we stop training when the performance on the validation set begins to\
    \ decline.\n\n`![L_2](resources/leanpub_equation_5.png)`regularization, but it\
    \ is applied to the optimizer directly rather than modifying the loss function.\
    \ Since weight decay has the same effect as `![![L_2](resources/leanpub_equation_6.png)`regularization,\
    \ it is often used.\n\n### Smaller models\n\nThe bias-variance theory suggests\
    \ that reducing size^([22](#chap46.xhtml#fn-bias-variance)) can improve. The intuition\
    \ behind it is that, as a rule of thumb, the smaller the model, the less it is\
    \ to memorize noise.\n\n### Pruning\n\nPruning involves removing parameters from\
    \ the model to reduce its capacity. Iterative pruning is a technique where we\
    \ iteratively remove parameters and retrain the model to maintain its performance.\
    \ \n\n### Knowledge distillation\n\nKnowledge distillation is a technique where\
    \ we transfer knowledge from a large, more complex `teacher` to a smaller `student`.\
    \ The training objective is to minimize both (a) the cross entropy between the\
    \ outputs and class labels and (b) the difference between its outputs and teacher\
    \ outputs (measured using Kullback Leibler divergence).\n"
