    Also, the deletion rate should be carefully chosen to ensure the text still makes
    sense after words have been removed.


    **Word position swapping**


    Word position swapping, also known as word shuffling or permutation, is another
    method of text data augmentation where the positions of words in a sentence are
    swapped or rearranged to create new versions of the sentence.


    Let’s use the previous sentence, “The cat quickly jumped over the lazy dog,” as
    an example again. By swapping the positions of some words, we might get the following:


    *   Original sentence: “The cat quickly jumped over the lazy dog.”


    *   Augmented sentence: “Quickly the cat jumped the over lazy dog.”


    While these sentences may sound grammatically incorrect or strange in English,
    they can still provide valuable training information for data augmentation. This
    is because the model can still recognize the important words and their associations
    with each other.


    However, this method has its limitations. For example, shuffling words too much
    or in certain ways can drastically change the meaning of a sentence or make it
    completely nonsensical.


    **Sentence shuffling**


    Sentence shuffling is a data augmentation technique where entire sentences within
    a paragraph or a document are rearranged to create new versions of the input text.
    This technique is particularly useful in tasks that deal with document-level analysis
    or paragraph-level understanding, such as document classification, topic modeling,
    or text summarization.


    In contrast to the abovementioned techniques, such as word position swapping,
    word deletion, and synonym replacement, sentence shuffling maintains the internal
    structure of individual sentences. Still, it changes their order within the broader
    context.


    In contrast, the word-based methods above, like word position swapping, can make
    sentences grammatically incorrect or change their meaning entirely if not applied
    carefully, as word choice or order is often critical to the meaning of sentences
    in many languages.


    Sentence shuffling is useful when the order of sentences is not crucial to the
    overall meaning of the text. Still, it may not work well if the sentences are
    logically or chronologically connected. For example, consider the following paragraph:


    *   “I went to the supermarket.”


    *   “Then, I bought ingredients to make pizza.”


    *   “Afterwards, I made some delicious pizza.”


    When reshuffling it as follows, it disrupts the logical and temporal progression
    of the narrative:


    *   “Afterwards, I made some delicious pizza.”


    *   “Then, I bought ingredients to make pizza.”


    *   “I went to the supermarket.”


    **Noise injection**


    Noise injection is an umbrella term that includes other techniques above to create
    variation in the text, such as synonym, replacement, word shuffling, word deletion,
    and sentence shuffling. However, it may also be used to refer to character-level
    techniques such as inserting random letters, characters, or typos. Examples of
    these techniques are shown below:


    *   **Random character insertion:** “The cat qzuickly jumped over the lazy dog.”
    (Inserted a “z” in the word “quickly”.)


    *   **Random character deletion:** “The cat quickl jumped over the lazy dog.”
    (Deleted “y” from the word “quickly”.)


    *   **Typo introduction:** “The cat qickuly jumped over the lazy dog.” (Introduced
    a typo in “quickly”, changing it to “qickuly”.)


    These modifications are beneficial for tasks that involve spell-checking and text
    correction. But it can also help make the model more robust to imperfect inputs.


    **Back translation**


    Back translation is one of the most widely used techniques to create variation
    in texts. Here, the sentence is first translated from the original language into
    one or more different languages and then back into the original language. Translating
    back and forth often results in sentences semantically similar to the original
    sentence but introduces slight variations in structure, vocabulary, or grammar.
    This generates additional, diverse examples for training without altering the
    overall meaning.


    Let’s take the familiar sentence “The cat quickly jumped over the lazy dog” and
    look at an example of back translation using German as our intermediary language:


    *   First, we translate the sentence into German. We might get: “Die Katze sprang
    schnell über den faulen Hund.”


    *   Then, we translate this German sentence back into English. We could get: “The
    cat jumped quickly over the lazy dog.”


    Please note that the degree of change in the sentence through back translation
    depends on the languages used and the specifics of the machine translation model.
    In this case, the sentence remained very similar. Still, in other cases or with
    other languages, you might see more significant changes in wording or sentence
    structure while still maintaining the same overall meaning.


    Also note that this method requires access to reliable machine translation models
    or services, and care must be taken to ensure that the back-translated sentences
    retain the essential meaning of the original sentences.


    **Synthetic data**


    Synthetic data generation is an umbrella term that includes the abovementioned
    techniques, such as back translation, synonym replacement, word deletion, word
    position swapping, sentence shuffling, noise injection, and so forth. All these
    methods generate new data by making small changes to existing data, maintaining
    the overall meaning while creating something new.


    Modern techniques to generate synthetic data now also include using LLMs, for
    example, GPT-4. We can use these models to either generate new data from scratch
    by using “complete the sentence” or “generate example sentences” prompts, among
    others. Or, we could use it as an alternative to back translation, prompting it
    to rewrite a sentence, as shown in the figure below.


    ![Figure 16.1. Using ChatGPT to rewrite sentences.](resources/figures----data-augmentation-chatgpt.png)


    Figure 16.1. Using ChatGPT to rewrite sentences.


    **When to use data augmentation?**


    The data augmentation techniques discussed above, like synonym replacement, word
    deletion, and word position swapping, are commonly used in tasks such as text
    classification, sentiment analysis, and other NLP tasks where the amount of available
    labeled data might be limited.


    However, when it comes to pretraining large language models (LLMs), they are usually
    trained on such a vast and diverse dataset that these augmentation techniques
    might not be used as extensively as in other, more specific NLP tasks. This is
    because LLMs aim to capture the statistical properties of the language, and the
    vast amount of data they are trained on often provides a sufficient variety of
    contexts and expressions.


    However, in the finetuning stages of LLMs, where a pretrained model is adapted
    to a specific task with a smaller, task-specific dataset, data augmentation techniques
    might become more relevant again, mainly if the task-specific labeled dataset
    size is limited.


    **\> Reader quiz:**


    **16-A**


    Could the use of text data augmentation help with privacy concerns?


    **16-B**


    What are some instances where data augmentation may not be beneficial for a specific
    task?


    ## Q17. “Self”-Attention


    **\> Q:**


    The scaled-dot product attention mechanism proposed by the original transformer
    architecture in the influential *Attention Is All You Need*^([12](#chap46.xhtml#fn-attention-is-all-you-need))
    paper is often referred to as self-attention. Why is it called “self”-attention,
    and how is it different from regular attention?


    **\> A:**


    It’s called self-attention because it’s an attention mechanism for all the elements
    of the same set. In contrast, the original attention developed for recurrent neural
    networks (RNNs) is applied between two different sequences, the encoder and the
    decoder embeddings.


