    ## Q28. *k*-折交叉验证中的 *k*


    > **问：**


    `k`-折交叉验证是评估机器学习分类器的常用选择，因为它让我们能够利用所有训练数据来模拟机器学习算法在新数据上的可能表现。选择一个较大的 `k` 值具有哪些种优点和缺点？


    > **答：**


    我们可以将 `k`-折交叉验证看作是在数据有限时模型评估的一种折中方案。在机器学习模型评估中，我们关注的是模型的泛化性能——即模型在新数据上的表现如何。


    在 `k`-折交叉验证中，我们通过将训练数据划分为 `k` 个验证轮次和折叠来将其用于模型选择和评估。如果我们有 `k` 折，就有 `k` 次迭代，从而产生
    `k` 个不同的模型。因此，通过使用 `k`-折交叉验证，我们通常通过计算 `k` 个模型的平均性能来评估特定超参数配置的性能。这种性能反映或近似了在评估后在完整训练数据集上训练的模型的性能^(4。


    ![图 28.1. 用于模型评估的 k-折交叉验证图，k=5。五个验证折叠和模型的平均性能可以近似最终模型的性能。](img/figures----k-fold-explanation.png)


