- raw: 'In contrast to BERT, we do not need to use a special \[CLS\], but the fundamental
    concept is similar to finetuning an encoder-style model for classification. We
    add a classification head (a fully connected layer and a softmax activation) and
    train it on the embedding (the final hidden state) of the first output token.
    (This is analogous to using the \[CLS\] token embedding.)


    **Answer 19-A**


    *When does it make more sense to use in-context learning over finetuning and vice
    versa?*


    In-context learning is useful if we don’t have access to the model. Besides, in-context
    learning is useful if we want to adapt the model to similar tasks that the model
    wasn’t trained to do.


    In contrast, finetuning is useful for adapting the model to a new target domain.
    For example, suppose the model was pretrained on a general corpus, and we want
    to apply it to financial data or documents. Here, it would make sense to finetune
    the model on data from that target domain.


    Note that in-context learning can be used with a finetuned model as well. For
    example, when a pretrained language model is finetuned on a specific task or domain,
    in-context learning then leverages the model’s ability to generate responses based
    on the context provided within the input that may be more accurate given the target
    domain compared to in-context learning without finetuning.


    **Answer 19-B**


    *In prefix tuning, adapters, and LoRA, how can we ensure that the model preserves
    (and not forgets) the original knowledge?*


    This is done implicitly. In prefix tuning, adapters, and LoRA, the original knowledge
    of the pretrained language model is preserved by keeping the core model parameters
    frozen while introducing additional learnable parameters that adapt to the new
    task.


    **Answer 20-A**


    *Looking at step 5 in the previous figure illustrating the BERTScore computation,
    we see that the cosine similarity between the two embeddings of “cat” are not
    1.0, where 1.0 indicates a maximum cosine similarity. Why is that?*


    If we used an embedding technique that processes each word independently, for
    example, Word2Vec, we would expect the cosine similarity between the “cat” embeddings
    to be 1.0. However, we are using a transformer model to produce the embeddings
    in this case. Transformers use self-attention mechanisms^([9](#chap46.xhtml#fn-q20q-q17))
    that consider the whole context (i.e., input text) when producing the embedding
    vectors. Since the word “cat” is used in two different sentences, the BERT model
    produces a different embedding for these two instances of “cat.”


    **Answer 20-B**


    *In practice, we might find that the BERTScore is not symmetric. This means that
    switching the candidate and reference sentence could result in different BERTScores
    for specific texts. How could we address this?*


    Switching the candidate and reference texts has the same effect as calculating
    the maximum cosine similarity scores across columns (as shown in step 5 of the
    previous figure) versus rows, which can result in different BERTScores for specific
    texts. That’s why the BERTScore is often computed as an F1 score similar to ROUGE
    in practice. I.e., we calculate the BERTScore one way (“recall”) and the other
    (“precision”) and then compute the harmonic mean (F1 score).


    **Chapter 4. Production, Real-World, And Deployment Scenarios**


    **Answer 21-A**


    *Suppose you train a classifier for stock trading recommendation using a random
    forest model, including the moving average of the stock price as a feature. Now,
    since new stock market data arrives daily, you are thinking about how to update
    the classifier daily to keep it up to date. Should you take a stateless training
    or stateless retraining approach to update the classifier?*


    Random forests, typically based on CART decision trees, cannot be readily updated
    as new data arrives. Hence, a stateless training approach would be the only viable
    option. On the other hand, suppose we switched to using neural network models
    such as recurrent neural networks. In that case, a stateful approach could make
    more sense since the neural network could be readily updated on new data. (However,
    in the beginning, comparing stateful and stateless systems side by side is always
    a good idea before deciding which method works best.)


    **Answer 21-B**


    *Suppose you deployed a large language model (transformer) such as ChatGPT that
    can answer user queries. The dialogue interface includes a “thumbs up” and “thumbs
    down” button so that users can give direct feedback based on the generated queries.
    While collecting the user feedback, you are not updating the model immediately
    as new feedback arrives. However, you are planning to release a new or updated
    model at least once per month. Is this a good candidate for stateless or stateful
    retraining?*


    A stateful retraining approach makes the most sense here. Instead of training
    a new model on a combination of existing data, including user feedback, it makes
    more sense to update the model based on user feedback. Large language models are
    usually pretrained in a self-supervised fashion and then finetuned via supervised
    learning. Training large language models is very expensive, so updating the model
    via stateful retraining makes sense rather than training it from scratch again.


    **Answer 22-A**


    *A recent trend is the increased use of predictive analytics in healthcare. For
    example, suppose your healthcare provider developed an AI system that analyzes
    patients’ electronic health records and provides recommendations for lifestyle
    changes or preventive measures. For this, the provider requires you to monitor
    and share your health data (such as pulse and blood pressure) daily. Is this an
    example of data-centric AI?*


    From the information provided, it is unclear whether this is a data-centric approach.
    The AI system relies heavily on data inputs to make predictions and recommendations,
    but that’s true for any machine learning approach for AI. To determine whether
    this approach is an example of data-centric AI, we need to know how the AI system
    was developed. If the AI system was developed by using a fixed model and refining
    the training data, this could qualify as a data-centric approach; otherwise, it’s
    just regular machine learning and predictive modeling.


    **Answer 22-B**


    *Suppose you train a convolutional neural network, specifically a ResNet-34, to
    classify images in the CIFAR-10 and ImageNet datasets. To reduce overfitting and
    improve classification accuracy, you are experimenting with different data augmentation
    techniques, such as image rotation and cropping. Is this approach data-centric?*


    If we are keeping the model fixed – that means reusing the same ResNet-34 architecture
    – and only changing the data augmentation approach to investigate its influence
    on the model performance, we could consider this a data-centric approach. However,
    data augmentation is also routinely done as part of any modern machine learning
    pipeline, and the use of data augmentation alone does not imply whether it’s a
    data-centric approach. A data-centric approach, under the modern definition, suggests
    that we actively study the difference between various dataset-enhancing techniques
    while keeping the remaining modeling and training pipeline fixed.


    **Answer 23-A**


    *[Q7](#chap18.xhtml#q7) covered several different multi-GPU training paradigms
    to speed up the model training. Using multiple GPUs can, in theory, also speed
    up model inference. However, in practice, there are several reasons why this approach
    is often not the most efficient or practical one. Can you think of what these
    reasons are?*


    For instance, one downside of using multi-GPU strategies for inference is the
    additional communication overhead between the GPUs. However, for inference tasks,
    which are relatively small compared to training since they don’t require gradient
    computations and updates, the time it takes to communicate between GPUs could
    outweigh the time saved by parallelization.'
