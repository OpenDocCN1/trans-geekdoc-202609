    \ their use in active learning ineffective. So, what are some other methods to\
    \ obtain confidence scores using deep neural networks for active learning?\n\n\
    Besides mitigation techniques for the overconfident scores from a neural network’s\
    \ output layer, we can also consider various ways of ensembling to obtain confidence\
    \ scores. For instance, instead of disabling `dropout` during inference, we can\
    \ leverage `dropout` to obtain multiple different predictions for a single example\
    \ to compute the predicted label uncertainty.\n\nAnother option is to construct\
    \ model ensembles from different segments of the training set using `k-fold cross-validation`,\
    \ as discussed in the ensemble section of [Q6](#chap17.xhtml#q6).\n\n# Appendix\
    \ B: List of Questions\n\nBelow is a list of all questions for readers who prefer\
    \ a quick, spoiler-free overview before reading the book.\n\n## Chapter 1. Neural\
    \ Networks and Deep Learning\n\n*   **Q1.** In deep learning, we often use the\
    \ terms `embedding vectors`, `representations`, and `latent space`. What do these\
    \ concepts have in common, and how do they differ?\n\n*   **Q2.** What is self-supervised\
    \ learning, when is it useful, and what are the main categories of approaches?\n\
    \n*   **Q3.** What is few-shot learning? And how does it differ from the conventional\
    \ training procedure for supervised learning?\n\n*   **Q4.** What is the `lottery\
    \ ticket hypothesis`, and if it holds true, how can it be useful in practice?\n\
    \n*   **Q5.** Suppose we train a neural network classifier in a supervised fashion\
    \ and notice that it suffers from overfitting. What are some of the common ways\
    \ to reduce overfitting in neural networks through the use of altered or additional\
    \ data?\n\n*   **Q6.** Suppose we train a neural network classifier in a supervised\
    \ fashion and we already employ various dataset-related techniques to mitigate\
    \ overfitting. How can we change the model or make modifications to the training\
    \ loop to further reduce the effect of overfitting?\n\n*   **Q7.** What are the\
    \ different multi-GPU training paradigms, and what are their respective advantages\
    \ and disadvantages?\n\n*   **Q8.** What are the main factors that have contributed\
    \ to the success of `transformers`?\n\n*   **Q9.** What are the popular categories\
    \ of deep generative models in deep learning (also called `generative AI`), and\
    \ what are their respective downsides?\n\n*   **Q10.** What are the common sources\
    \ of randomness when training deep neural networks that can cause non-reproducible\
    \ behavior during training and inference?\n\n## Chapter 2. Computer Vision\n\n\
    *   **Q11.** How do we compute the number of parameters in a convolutional neural\
    \ network? Suppose we are working with a convolutional network with 2 convolutional\
    \ layers with kernel size 5. The first convolutional layer has 3 input channels\
    \ and 5 output channels. The second convolutional layer has 5 input and 12 output\
    \ channels. The stride of these convolutional layers is 1. \n\nFurthermore, the\
    \ network has 2 pooling layers with kernel size 3 and stride 2. Lastly, the network\
    \ has 2 fully connected hidden layers with 192 and 128 hidden units each, where\
    \ the output layer is a classification layer for 10 classes. The architecture\
    \ of this network is illustrated in the figure below. What is the number of trainable\
    \ parameters in this convolutional network?\n\n*   **Q12.** Under which circumstances\
    \ are fully connected and convolutional layers equivalent?\n\n*   **Q13.** Why\
    \ do vision transformers (ViTs) generally require larger training sets than convolutional\
    \ neural networks (CNNs)?\n\n## Chapter 3. Natural Language Processing\n\n*  \
    \ **Q13.** What are the main factors that have contributed to the success of `transformers`?\n\
    \n*   **Q15.** What is the distributional hypothesis in NLP?\n\n*   **Q16.** What\
    \ are common data augmentation techniques for text?\n\n*   **Q17.** The scaled-dot\
    \ product attention mechanism proposed by the original `Attention All You Need`\
    \ paper is often referred to as self-attention. Why is it different from regular\
    \ attention?\n\n*   **Q18.** What are the differences between encoder- and decoder-based\
    \ transformers?\n\n*   **Q19.** What are the different ways we can use and finetune\
    \ large language models (LLMs)?\n\n*   **Q20.** What are standard metrics for\
    \ evaluating the quality of text generated by language models?\n\n## Chapter 4.\
    \ Production, Real-World, And Scenarios\n\n*   **Q21.** What is the difference\
    \ between stateless and stateful training workflows?\n\n*   **Q22.** What is data-centric\
    \ AI, how does it compare to the conventional modeling paradigm, and how do we\
    \ decide it’s the right fit for a project?\n\n*   **Q23.** What are techniques\
    \ to speed up model inference without changing the model architecture and without\
    \ sacrificing accuracy?\n\n## Chapter 5. Predictive Performance and Model Evaluation\n\
    \n*   **Q25.** Consider `Poisson regression` and `ordinal regression`; when do\
    \ we use which over the other?\n\n*   **Q27.** What are the three properties of\
    \ a distance function that make it a `proper` metric?\n\n*   **Q28.** `K-fold\
    \ cross-validation` is a common choice for evaluating machine learning classifiers\
    \ because it lets us use all training data to simulate how well a machine learning\
    \ algorithm might perform on new data. What are the advantages and disadvantages\
    \ of choosing a large `k`?\n\n*   **Q29.** You trained a model that performs much\
    \ better on the test dataset than on the training dataset. Since a similar model\
    \ configuration worked well on a similar dataset before, you suspect something\
    \ might be unusual with the data. What are some approaches and mitigation issues\
    \ looking into training and test set discrepancies?\n\n*   **Q30.** Suppose we\
    \ plotted a learning curve and found that the machine learning model overfits\
    \ and could benefit from more training data. Name different approaches for dealing\
    \ with limited labeled data in supervised machine learning settings.\n"
