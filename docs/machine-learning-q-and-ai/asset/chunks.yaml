  trans: '

    我们如何计算卷积神经网络中的参数数量？假设我们正在处理一个包含 2 个卷积层的卷积网络，卷积大小为 5。第一个卷积层有 3 个输入通道和 5 个输出通道。第二个卷积层有
    5 个输入通道和 12 个输出通道。这些卷积层的步长（stride）均为 1。


    此外，该网络有 2 个池化层，卷积大小为 3，步长为 2。最后，网络有 2 个全连接隐藏层，分别包含 192 和 128 个隐藏单元，输出层是一个 10 分类的分类层。该网络的架构如图所示。这个卷积网络中有多少可训练参数？


    ![图 11.1。具有两个卷积层和两个全连接层的卷积神经网络示意图。](img/figures----cnn-size-1.png)


    图 11.1。具有两个卷积层和两个全连接层的卷积神经网络示意图。


    > **> A：**


    我们可以从左到右解决这个问题，计算每一层的参数数量，然后将这些计数相加得到总参数量。每一层的可训练参数由权重和偏置单元组成。


    在卷积层中，权重的数量取决于卷积核的宽度、高度以及输入和输出通道的数量。偏置单元的数量仅取决于输出通道的数量。为了逐步演示计算过程，假设我们的卷积核宽度和高度为
    5，1 个输入通道和 1 个输出通道，如图所示。在这种情况下，我们有 26 个参数，因为通过卷积核有![5\times 5 =25](img/leanpub_equation_23.png)个权重加上一个偏置单元。计算输出值或像素![z](img/leanpub_equation_24.png)的公式为![z
    = b + \sum\_j w\_j x\_j](img/leanpub_equation_25.png)，其中![x\_j](img/leanpub_equation_26.png)代表输入像素，![w\_j](img/leanpub_equation_27.png)代表卷积核的权重参数，![b](img/leanpub_equation_28.png)是偏置单元。


    ![图 11.2。只有一个输入通道和一个输出通道的卷积层。参数数量为 25。](img/figures----cnn-size-2.png)


    图 11.2。只有一个输入通道和一个输出通道的卷积层。参数数量为 25。


    现在，假设我们有 3 个输入通道，如图所示。在这种情况下，我们对每个输入通道执行上述操作![\\sum\_j w\_j x\_j](img/leanpub_equation_29.png)计算输出值，然后加上偏置单元。对于
    3 个输入通道，这将涉及到三个不同的卷积核和三组权重：![z = \sum\_j w^{(1)}\_{j} x\_j + \sum\_j w^{(2)}\_{j}
    x\_j + \sum\_j w^{(3)}\_{j} x\_j + b.](img/leanpub_equation_30.png)。由于我们有 3 组权重
    ![(w^{(1)}, w^{(2)}, \text{ and } w^{(3)} \text{ for } j=\[1, \dots, 25\])](resources/leanpub_equation_31.png)，因此在该卷积层中有![3
    \times 25+1=76](img/leanpub_equation_32.png)个参数。


    ![图 11.3。只有三个输入通道和一个输出通道的卷积层。参数数量为 76。](img/figures----cnn-size-3.png)


    图 11.3。只有三个输入通道和一个输出通道的卷积层。参数数量为 76。


    我们每个输出通道使用一个卷积核，每个卷积核对于给定的输出通道都是唯一的。因此，如果我们如图所示将输出通道的数量从 1 扩展到 5，参数的数量将增加 5 倍。换句话说，如果一个输出通道的卷积核有
    76 个参数，那么 5 个输出通道所需的 5 个卷积核将有![5 \times 76 = 380](img/leanpub_equation_33.png)个参数。


    ![图 11.4。具有三个输入通道和五个输出通道的卷积层。参数数量为 76。](img/figures----cnn-size-4.png)


    图 11.4。具有三个输入通道和五个输出通道的卷积层。参数数量为 76。


    现在，回到本节开头所示的神经网络架构，我们如下计算卷积层中的参数数量。例如，第一个卷积层有 3 个输入通道、5 个输出通道，卷积大小为 5。因此，它的参数数量为![5
    \times (5\times 5 \; \ \times 3) + 5 = 380](img/leanpub_equation_34.png)。


    第二个卷积层有 5 个输入通道、12 个输出通道，卷积大小为 3，有![12 \times (3\times 3 \; \ \times 5) + 12 =
    552](img/leanpub_equation_35.png)个参数。由于池化层没有任何可训练参数，我们可以不计算它们。

