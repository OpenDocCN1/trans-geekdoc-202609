- raw: 'We can think of ensemble methods as asking a committee of experts: members
    in a committee often have different backgrounds and experiences. While they tend
    to agree on basic decisions, they can overrule bad decisions by majority rule.
    This doesn’t mean that the majority of experts is always right, but there is a
    good chance that the majority of the committee is more often right, on average,
    than every single member.


    Ensemble methods are more prevalent in classical machine learning than deep learning
    because it is more computationally expensive to employ multiple models than relying
    on a single one. Or in other words, deep neural networks require significant computational
    resources, making them less suitable for ensemble methods. (It’s worth noting
    that while we previously discussed Dropout as a regularization technique, it can
    also be considered an ensemble method that approximates a weighted geometric mean
    of multiple networks^([29](#chap46.xhtml#fn-understanding-dropout)).)


    Popular examples of ensemble methods are random forests and gradient boosting.
    However, using majority voting or stacking, for example, we can combine any group
    of models: an ensemble may consist of a support vector machine, a multilayer perceptron,
    and a nearest neighbor classifier.


    A popular technique that is often used in industry is to build models from *k*\-fold
    cross-validation. *K*\-fold cross-validation is a model evaluation technique where
    we train and evaluate a model on *k* training folds. We then compute the average
    performance metric across all *k* iterations to estimate the overall performance
    measure of the model. After evaluation, we can train the model on the entire training
    dataset, or the individual models can be combined as an ensemble, as shown in
    the figure below.


    ![Figure 6.3. Illustration of k-fold cross-validation for creating model ensembles.](resources/figures----k-fold.png)


    Figure 6.3. Illustration of k-fold cross-validation for creating model ensembles.


    **Other methods**


    The non-exhaustive list above includes the most prominent examples of techniques
    to reduce overfitting. Additional techniques that can reduce overfitting are skip-connections
    (for example, found in residual networks), look-ahead optimizers, stochastic weight
    averaging, multitask learning, and snapshot ensembles.


    Techniques that aim to reduce overfitting from a data perspective are discussed
    in Q5.


    **Choosing regularization techniques**


    Improving data quality is an essential first step in reducing overfitting. However,
    for recent deep neural networks with large numbers of parameters, more than improving
    data quality is required to achieve an acceptable level of overfitting. Therefore,
    data augmentation and pretraining, along with established techniques such as dropout
    and weight decay, remain crucial methods to reduce overfitting.


    In practice, we need to employ more than one technique to reduce overfitting.
    Instead, we can and should combine the abovementioned techniques for an additive
    effect. To achieve the best results, selecting these techniques should be treated
    as a hyperparameter optimization problem^([30](#chap46.xhtml#fn-well-tuned)).


    **\> Reader quiz:**


    **6-A**


    Suppose we are using early-stopping as a mechanism to reduce overfitting. In particular,
    we are using a modern variant that creates checkpoints of the best model (for
    instance, the model with highest validation accuracy) during training so that
    we can load it after the training has completed – this is a mechanism that can
    be enabled in most modern deep learning frameworks.


    Now, a colleague recommends tuning the number of training epochs instead. What
    are some of the advantages and disadvantages of each approach?


    **6-B**


    Ensemble models have been established as a reliable and successful method for
    decreasing overfitting and enhancing the reliability of predictive modeling efforts.
    However, there is always a trade-off. What are some of the drawbacks associated
    with ensemble techniques?


    ## Q7. Multi-GPU Training Paradigms


    **\> Q:**


    What are the different multi-GPU training paradigms, and what are their respective
    advantages and disadvantages?


    **\> A:**


    The multi-GPU training paradigms can be categorized into two groups: (1) dividing
    data for parallel processing with multiple GPUs and (2) dividing the model among
    multiple GPUs to handle memory constraints when the model size surpasses that
    of a single GPU.


    Data parallelism falls into the first category, model parallelism and tensor parallelism
    fall into the second category, and techniques like pipeline parallelism borrow
    ideas from both categories. In addition, current software implementations such
    as DeepSpeed^([31](#chap46.xhtml#fn-deepspeed)), Colossal AI^([32](#chap46.xhtml#fn-colossal)),
    and others blend multiple approaches into a hybrid technique.


    **Model parallelism**


    Model parallelism (also referred to as *inter op parallelism*) is perhaps the
    most intuitive form of parallelization across devices. For example, suppose you
    have a simple neural network that only consists of 2 layers: a hidden layer and
    an output layer. Here, we keep one layer on one GPU and the other layer on another
    GPU. Of course, this can scale to an arbitrary number of layers and GPUs.


    This is a good strategy for dealing with limited GPU memory where the complete
    network does not fit into one GPU. However, there are more efficient ways of using
    multiple GPUs because of the chain-like structure (layer 1 on GPU 1 ![\\rightarrow](resources/leanpub_equation_7.png)layer
    2 on GPU 2 ![\\rightarrow](resources/leanpub_equation_8.png)…).


    A major disadvantage of model parallelism is that the GPUs have to wait for each
    other – they cannot efficiently work parallel as they depend on each other’s outputs.


    **Data parallelism**


    Data parallelism has been the default mode for multi-GPU training for several
    years. Here, we divide a minibatch into smaller microbatches. Then, each GPU processes
    a microbatch separately to compute the loss and loss gradients for the model weights.
    After the individual devices process the microbatches, the gradients are combined
    to compute the weight update for the next round.


    An advantage of data parallelism over model parallelism is that the GPUs can run
    in parallel – each GPU processes a portion of the training minibatch, a microbatch.
    However, a caveat is that each GPU requires a full copy of the model. This is
    obviously not feasible if we have large models that don’t fit into the GPU’s VRAM.


    **Tensor parallelism**


    Tensor parallelism (also referred to as *intra op parallelism*) is a more efficient
    form of model parallelism (*inter op parallelism*). Here, the weight and activation
    matrices are spread across the devices instead of distributing whole layers across
    devices. Specifically, the individual matrices are split, so we split an individual
    matrix multiplication across GPUs.


    ![Figure 7.1. Comparison of model parallelism (left), data parallelism (center),
    and tensor parallelism (right). In model parallelism, we put different layers
    onto different GPUs to work around GPU memory limitations. In data parallelism,
    we split batch across GPUs to train copies of the model in parallel, averaging
    gradients for the weight update afterwards. In tensor parallelism, we split matrices
    (inputs and weights) across different GPU for parallel processing when models
    are too large to fit into GPU memory.](resources/figures----multi-gpu-model-data-parallel.png)'
