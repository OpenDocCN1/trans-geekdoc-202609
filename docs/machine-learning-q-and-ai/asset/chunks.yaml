    ## Q13. Large Training Sets for Vision Transformers


    Q: Why do vision transformers (ViTs) generally require larger training sets than
    convolutional networks (CNNs)?


    A: Each machine learning algorithm and model encodes a particular set of assumptions
    or prior knowledge. These assumptions are commonly referred to as inductive biases.
    Some inductive biases are workarounds to make algorithms more feasible, others
    are based on domain knowledge, and some are both. CNNs have more inductive biases
