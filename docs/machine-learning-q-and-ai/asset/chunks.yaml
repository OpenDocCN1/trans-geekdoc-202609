    ![图 2.5. 对比学习中遇到的图像对。](img/figures----self-supervised-contrastive-example.png)


    图 2.5. 对比学习中遇到的图像对。


    扰动后的猫图像仍然显示的是同一只猫，因此我们希望网络产生相似的嵌入向量。然后，我们还会考虑从训练集中随机抽取的一张图像（例如，一只大象，但同样，网络并不知道标签）。对于猫-象这一对，我们希望网络产生不相似的嵌入^(8)。通过这种方式，我们隐含地强制网络捕捉图像的核心内容，同时对微小差异和噪声具有一定的感知性。


    接下来的图总结了扰动图像场景下对比学习的核心概念。注意，模型被显示了两次——这被称为 `siamese network`（孪生网络）结构。本质上，同一个模型被使用了两次实例：首先，为原始训练示例生成嵌入；其次，为样本的扰动版本生成嵌入。


    ![图 2.6. 对比学习概述。](img/figures----self-supervised-contrastive.png)


    图 2.6. 对比学习概述。


    上述段落概述了对比学习背后的原理，但存在许多不同的变体。广而言之，我们可以将其分为 `sample` 样本对比方法和 `dimension` 维度对比方法。上面，我们描述了
    `sample`对比方法^(9)，我们关注的是学习嵌入以最小化/最大化训练对之间的距离。而 `dimension`-对比方法^(10) 则侧重于仅让相似训练对的嵌入表示中的某些变量相似，同时最大化其他变量的距离。


    > **读者测试：**


    > **2-A**


    > 我们如何将自监督学习应用于视频数据？


    > **2-B**


    > 自监督学习可以用于表示为行和列的表格数据吗？如果是的话，我们如何处理这个问题？


    ## Q3. 少样本学习 (Few-Shot Learning)


    > **Q:**


    什么是少样本学习？它与传统的监督学习训练过程有何不同？


    > **A:**


    少样本学习是监督学习的一种，适用于样本量很小且样本与类别比例极低的训练集。在普通的监督学习中，我们通过迭代训练集来训练模型，模型始终看到一组固定的类别。在少样本学习中，我们处理一个支持集（support
    set），并从中创建多个训练任务以组合成训练阶段（episodes），每个训练任务由不同的类别组成。


    在监督学习中，我们在训练数据集上拟合模型并在测试数据集上进行评估。通常，训练集每个类包含较多的示例。例如，在监督学习语境下，一个微型数据集是 Iris 数据集，每个类有
    50 个示例。对于深度学习模型，即使是像 `MNIST` 这样每个类有 5k 个训练示例的数据也被认为是非常小的。


    在少样本学习中，每个类的示例数量要少得多。我们通常使用 `N`-way K-shot 术语，其中 `N` 代表类别数，`K` 代表每个类别的示例数。最常见的值是
    `K=1` 或 `K=5`。例如，在一个 5-way 1-shot 问题中，我们有 5 个类，每个类只有 1 个示例。下图为了说明目的展示了一个 3-way
    1-shot 设置。


    ![图 3.1. 少样本学习中训练任务的插图。](img/figures----few-shot-1.png)


    图 3.1. 少样本学习中训练任务的插图。


    与其将模型拟合到训练数据集，不如将少样本学习思考为“学习学习”。与监督学习不同，我们没有训练数据集，而是一个所谓的支持集。从支持集中，我们采样出训练任务，以模拟预测期间的场景场景。例如，对于
    3-way 1-shot 学习，一个训练任务由 3 个类组成，每个类有 1 个示例。每个训练任务都带有一个待分类的查询图像（query image）。模型在来自支持集的若干训练任务上进行训练；这被称为一个阶段（episode）。


    然后，在测试期间，模型接收到的一个新任务，其类别与训练期间看到的类别不同^(11)。同样，任务是分类查询图像。测试任务与训练任务相似，不同之处在于测试期间没有任何类别与训练期间遇到的类别重叠。


    ![图 3.2. 训练期间遇到的类别与测试期间遇到的类别插图。](img/figures----few-shot-2.png)


    图 3.2. 训练期间遇到的类别与测试期间遇到的类别插图。


    少样本学习有许多不同的类型和分类。在常见的元学习（meta-learning）中，训练本质上是更新模型参数，使其能够很好地 `adapt` 到新任务。从高层次来说，一种少样本学习策略是学习一个产生嵌入的模型，我们可以通过对支持集的图像进行近邻搜索找到目标类别。


    ![图 3.3. 少样本学习方法的插图，其中模型学习如何从支持集中产生良好的嵌入，并通过寻找最相似的嵌入向量来分类查询图像。](img/figures----few-shot-3.png)


    图 3.3. 少样本学习方法的插图，其中模型学习如何从支持集中产生良好的嵌入，并通过寻找最相似的嵌入向量来分类查询图像。


    > **读者测试：**


    > **3-A**


    > 我们如何划分 `MNIST` 数据集（包含 10 个类的 50,000 个手写数字）以用于单样本（one-shot）分类场景？


    > **3-B**


    > 你能想到一些少样本学习的现实世界应用或用例吗？


    ## Q4. 彩票假设 (The Lottery Ticket Hypothesis)


    > **Q:**


    什么是 `彩票假设`？如果它成立，它在实践中有什么用？


    > **A:**


    根据彩票假设^(12)，一个随机初始化的神经网络可以包含一个子网络，该子网络在训练后在测试集上的精度可以达到原始网络相同的水平。


    下图更直观地展示了彩票假设的训练过程。我们将逐一通过步骤来帮助这一概念。


    ![图 4.1. 彩票假设训练过程的插图。](img/figures----lottery-1.png)


    图 4.1. 彩票假设训练过程的插图。


    我们从一个大型神经网络（1）开始，将其训练到收敛（2），这意味着我们尽力使其在目标数据集上表现最好——例如，最小化训练损失并最大化分类准确率。这个大型神经网络像往一样使用小的随机权重初始化。


    接下来，我们剪枝神经网络的权重参数（3），将其从网络中移除。我们可以通过将权重置零来创建稀疏权重矩阵^(1314)。


    在剪枝步骤之后，我们将权重重置为步骤 1 中使用的原始小的随机值。


    '
