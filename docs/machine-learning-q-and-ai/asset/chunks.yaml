    ## Q29. 训练集与测试集的不一致


    > **问：**


    你训练了一个模型，它在测试数据集上的表现远好于在训练数据集上的表现。由于之前类似的模型配置在类似的数据上运行良好，你怀疑数据可能存在异常。对于训练和测试差异，有哪些处理方法和解决问题的方法？


    > **答：**


    在更详细地调查数据集之前，我们应该检查数据加载和评估代码中的技术问题。例如，一个简单的健全检查是临时用训练集替换测试集并重新评估模型。在这种情况下，我们应该看到训练和测试集的性能是一致的。如果我们发现了差异，那么代码中可能有
    Bug——根据我的经验，此类 Bug 通常与错误的洗牌或不一致（往往是缺失）的数据归一化有关。


