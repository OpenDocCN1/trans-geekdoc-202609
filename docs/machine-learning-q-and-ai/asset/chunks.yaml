- raw: 'The encoder part in the original transformer, illustrated in the preceding
    figure, is responsible for understanding and extracting the relevant information
    from the input text. It then outputs a continuous representation (embedding) of
    the input text that is passed to the decoder. Finally, the decoder generates the
    translated text (target language) based on the continuous representation received
    from the encoder.


    Over the years, various encoder-only architectures have been developed based on
    the encoder module of the original transformer model outlined above. Notable examples
    include BERT^([18](#chap46.xhtml#fn-bert-q18)) and RoBERTa^([19](#chap46.xhtml#fn-roberta-q18)).


    BERT (**B**idirectional **E**ncoder **R**epresentations from **T**ransformers)
    is an encoder-only architecture based on the Transformer’s encoder module. The
    BERT model is pretrained on a large text corpus using masked language modeling
    (illustrated in the figure below) and next-sentence prediction tasks.


    ![Figure 18.2. Illustration of the masked language modeling pretraining objective
    used in BERT-style transformers.](resources/figures----encoder-decoder-masked.png)


    Figure 18.2. Illustration of the masked language modeling pretraining objective
    used in BERT-style transformers.


    The main idea behind masked language modeling is to mask (or replace) random word
    tokens in the input sequence and then train the model to predict the original
    masked tokens based on the surrounding context.


    Next to the masked language modeling pretraining task illustrated in the figure
    above, the next-sentence prediction task asks the model to predict whether the
    original document’s sentence order of two randomly shuffled sentences is correct.
    For example, two sentences, in random order, are separated by the \[SEP\] token:


    *   \[CLS\] Toast is a simple yet delicious food \[SEP\] It’s often served with
    butter, jam, or honey.


    *   \[CLS\] It’s often served with butter, jam, or honey. \[SEP\] Toast is a simple
    yet delicious food.


    The \[CLS\] token is a placeholder token for the model, prompting the model to
    return a *True* or *False* label indicating whether the sentences are in the correct
    order or not.


    The masked language and next-sentence pretraining objective^([20](#chap46.xhtml#fn-q2-q18))
    allow BERT to learn rich contextual representations of the input texts, which
    can then be finetuned for various downstream tasks like sentiment analysis, question-answering,
    and named entity recognition.


    RoBERTa (**R**obustly **o**ptimized **BERT** **a**pproach) is an optimized version
    of BERT. It maintains the same overall architecture as BERT but employs several
    training and optimization improvements, such as larger batch sizes, more training
    data, and eliminating the next-sentence prediction task. These changes resulted
    in RoBERTa achieving better performance on various natural language understanding
    tasks than BERT.


    **Decoders**


    Coming back to the original transformer architecture outlined at the beginning
    of this section, the multi-head self-attention mechanism in the decoder is similar
    to the one in the encoder, but it is masked to prevent the model from attending
    to future positions, ensuring that the predictions for position *i* can depend
    only on the known outputs at positions less than *i*. As illustrated in the figure
    below, the decoder generates the output word by word.


    ![Figure 18.3. Illustration of the next-sentence prediction task used in the original
    transformer.](resources/figures----encoder-decoder-nextword.png)


    Figure 18.3. Illustration of the next-sentence prediction task used in the original
    transformer.


    This masking (shown explicitly in the figure above, although it happens internally
    in the decoder’s multi-head self-attention mechanism) is essential to maintain
    the autoregressive property of the transformer model during training and inference.
    The autoregressive property ensures that the model generates output tokens one
    at a time and uses previously generated tokens as context for generating the next
    word token.


    Over the years, researchers have built upon the original encoder-decoder transformer
    architecture and developed several decoder-only models that have proven to be
    highly effective in various natural language processing tasks. The most notable
    models include the GPT family.


    The GPT (**G**enerative **P**re-trained **T**ransformer) series are decoder-only
    models pretrained on large-scale unsupervised text data and finetuned for specific
    tasks such as text classification, sentiment analysis, question-answering, and
    summarization. The GPT models, including GPT-2, GPT-3^([21](#chap46.xhtml#fn-q18-gpt3)),
    and the more recent GPT-4, have shown remarkable performance in various benchmarks
    and are currently the most popular architecture for natural language processing.


    One of the most notable aspects of GPT models is their emergent properties. Emergent
    properties refer to the abilities and skills that a model develops due to its
    next-word prediction pretraining. Even though these models were only taught to
    predict the next word, the pretrained models are capable of text summarization,
    translation, summarization, question answering, classification, and more. Furthermore,
    these models can perform new tasks without updating the model parameters via in-context
    learning, which is discussed in more detail in [Q19](#chap31.xhtml#q19).


    **Encoder-Decoder Hybrids**


    Next to the traditional encoder and decoder architectures, there have been advancements
    in the development of new encoder-decoder models that leverage the strengths of
    both components. These models often incorporate novel techniques, pre-training
    objectives, or architectural modifications to enhance their performance in various
    natural language processing tasks. Some notable examples of these new encoder-decoder
    models include BART^([22](#chap46.xhtml#fn-q18-bart)) and T5^([23](#chap46.xhtml#fn-q18-t5)).


    Encoder-decoder models are typically used for natural language processing tasks
    that involve understanding input sequences and generating output sequences, often
    with different lengths and structures. They are particularly good at tasks where
    there is a complex mapping between the input and output sequences and where it
    is crucial to capture the relationships between the elements in both sequences.
    Some common use cases for encoder-decoder models include text translation and
    summarization.


    **Terminology and Jargon**


    All of these methods, encoder-only, decoder-only, and encoder-decoder models,
    are sequence-to-sequence models (often abbreviated as *seq2seq*). Note that while
    we refer to BERT-style methods as encoder-only, the description *encoder-only*
    may be misleading since these methods also *decode* the embeddings into output
    tokens or text during pretraining.


    In other words, both encoder-only and decoder-only architectures are “decoding.”
    However, the encoder-only architectures, in contrast to decoder-only and encoder-decoder
    architectures, are not decoding in an autoregressive fashion. Autoregressive decoding
    refers to generating output sequences one token at a time, conditioning each token
    on the previously generated tokens. Encoder-only models do not generate coherent
    output sequences in this manner. Instead, they focus on understanding the input
    text and producing task-specific outputs, such as labels or token predictions.


    **Conclusion**


    In brief, encoder-style models are popular for learning embeddings used in classification
    tasks, encoder-decoder-style models are used in generative tasks where the output
    heavily relies on the input (for example, translation and summarization), and
    decoder-only models are used for other types of generative tasks including Q&A.
    Since the first transformer architecture emerged, hundreds of encoder-only, decoder-only,
    and encoder-decoder hybrids have been developed, as summarized in the figure below.'
