- raw: 'A classic example that highlights the differences between these approaches
    is the comparison of the naive Bayes classifier, a generative model, and the logistic
    regression classifier, a discriminative model. Both classifiers estimate the class
    label probabilities *p(y | x)* and can be used for classification tasks.


    Logistic regression is considered a discriminative model because it directly models
    the conditional probability distribution *p(y | x)* of the class labels given
    the input features, without making assumptions about the underlying joint distribution
    of inputs and labels.


    Naive Bayes, on the other hand, is considered a generative model because it models
    the joint probability distribution *p(x, y)* of the input features *x* and the
    output labels *y*. By learning the joint distribution, a generative model like
    naive Bayes captures the underlying data generation process, which enables it
    to generate new samples from the distribution if needed.


    Nowadays, when we speak of *deep* generative models or sometimes also *deep generative
    AI*, we often losen this definition to include all types of models capable of
    producing realistic-looking data (typically, text, images, videos, and sound).
    The remainder of this section will briefly discuss the different types of deep
    generative models used to generate such data.


    **Energy-based Models**


    EBMs are a class of generative models that learn an energy function, which assigns
    a scalar value (energy) to each data point. Lower energy values correspond to
    more likely data points. The model is trained to minimize the energy of real data
    points while increasing the energy of generated data points. Examples of EBMs
    include Deep Boltzmann Machines^([46](#chap46.xhtml#fn-deep-boltzmann)).


    Somewhat similar naive Bayes and logistic regression, Deep Boltzmann Machines
    (DBMs) and Multilayer Perceptrons (MLPs) can be considered as generative and discriminative
    counterparts, with DBMs being more focused on capturing the data generation process
    and MLPs being more focused on modeling the decision boundary between classes
    or mapping inputs to outputs.


    A Deep Boltzmann Machine consists of multiple layers of hidden nodes (as shown
    in the figure below). But besides using a different learning algorithm (contrastive
    divergence instead of backpropagation), DBMs also differ from MLPs in that they
    consist of binary nodes (neurons) instead of continuous ones.


    ![Figure 9.1. A 4-layer Deep Boltzmann Machine with 3 stacks of hidden nodes.](resources/figures----deep-generative-boltzmann.png)


    Figure 9.1. A 4-layer Deep Boltzmann Machine with 3 stacks of hidden nodes.


    Suppose we are interested in generating images. A DBM can learn the joint probability
    distribution over the pixel values in a simple image dataset like MNIST. To generate
    new images, the DBM then samples from this distribution by performing a process
    called Gibbs sampling. Here, the visible layer of the DBM represents the input
    image. To generate a new image, start by initializing the visible layer with random
    values, or alternatively, use an existing image as a seed. Then, after completing
    several Gibbs sampling iterations, the final state of the visible layer represents
    the generated image.


    Deep Boltzmann machines are among the oldest deep generative models and are mentioned
    for historical reasons, but they are not very popular for generating data nowadays.
    The disadvantages of DBMs are that they are expensive and more complicated to
    train as well as the lower expressivity compared to other models described below,
    which generally results in lower-quality generated samples.


    **Variational Autoencoders**


    Variational Autoencoders (VAE)^([47](#chap46.xhtml#fn-vae)) are built upon the
    principles of variational inference and autoencoder architectures. Variational
    inference is a method for approximating complex probability distributions by optimizing
    a simpler, tractable distribution to be as close as possible to the true distribution.
    Autoencoders are unsupervised neural networks that learn to compress input data
    into a low-dimensional representation (encoding) and subsequently reconstruct
    the original data from the compressed representation (decoding) by minimizing
    the reconstruction error.


    The VAE model consists of two main submodules, as summarized in the figure below:
    an encoder network and a decoder network. The encoder network takes, for example,
    an input image and maps it to a latent space by learning a probability distribution
    over the latent variables. This distribution is typically modeled as a Gaussian
    with parameters (mean and variance) that are functions of the input image. The
    decoder network then takes a sample from the learned latent distribution and reconstructs
    the input image from this sample. The goal of the VAE is to learn a compact and
    expressive latent representation that captures the essential structure of the
    input data while being able to generate new images by sampling from the latent
    space^([48](#chap46.xhtml#fn-q1-q9)).


    ![Figure 9.2. Illustration of the encoder and decoder submodules of an autoencoder
    where x’ represents the reconstructed input x. In a standard variational autoencoder,
    the latent vector is sampled from a distribution that approximates a standard
    Gaussian distribution.](resources/figures----deep-generative-vae.png)


    Figure 9.2. Illustration of the encoder and decoder submodules of an autoencoder
    where *x’* represents the reconstructed input *x*. In a standard variational autoencoder,
    the latent vector is sampled from a distribution that approximates a standard
    Gaussian distribution.


    Training a VAE involves optimizing the model’s parameters to minimize a loss function
    composed of two terms: a reconstruction loss and a Kullback Leibler (KL)-divergence
    regularization term. The reconstruction loss ensures that the decoded samples
    closely resemble the input images, while the KL-divergence term acts as a surrogate
    loss that encourages the learned latent distribution to be close to a predefined
    prior distribution (usually a standard Gaussian).


    To generate new images, we then sample points from the latent space’s prior (standard
    Gaussian) distribution and pass them through the decoder network, which generates
    new, diverse images that look similar to the training data.


    Disadvantages of VAE are the complicated loss function consisting to separate
    terms and the often low expressiveness, which can result in blurrier images compared
    to other models such as generative adversarial networks described below.


    **Generative Adversarial Networks**


    While both Generative Adversarial Networks (GANs)^([49](#chap46.xhtml#fn-gan-paper))
    and VAEs are latent variable models that generate data by sampling from a learned
    latent space, their architectures and learning mechanisms are fundamentally different.


    GANs consist of two neural networks, a generator, and a discriminator, that are
    trained simultaneously in an adversarial manner. The generator takes a random
    noise vector from the latent space as input and generates a synthetic data sample
    (for example, an image)^([50](#chap46.xhtml#fn-vae-vs-gan)). The discriminator’s
    task is to distinguish between real samples from the training data and fake samples
    generated by the generator, as illustrated in the figure below.


    ![Figure 9.3. The components of a GAN model, where the discriminator predicts
    whether its inputs are real or generated by the generator.](resources/figures----deep-generative-gan.png)


    Figure 9.3. The components of a GAN model, where the discriminator predicts whether
    its inputs are real or generated by the generator.


    The generator aims to produce samples that are indistinguishable from real data,
    while the discriminator aims to accurately identify whether a sample is real or
    generated. This adversarial process leads to a generator capable of producing
    high-quality and diverse samples.'
