- raw: "Figure 7.1. Comparison of model parallelism (left), data parallelism (center),\
    \ and tensor parallelism (right). In model parallelism, we put different layers\
    \ onto different GPUs to work around GPU memory limitations. In data parallelism,\
    \ we split batch across GPUs to train copies of the model in parallel, averaging\
    \ gradients for the weight update afterwards. In tensor parallelism, we split\
    \ matrices (inputs and weights) across different GPU for parallel processing when\
    \ models are too large to fit into GPU memory.\n\nThere are several ways we can\
    \ implement tensor parallelism. For example, using basic principles of linear\
    \ algebra, we can split a matrix multiplication across two GPUs in a row- or column-wise\
    \ fashion, as illustrated in the figure below. (Note that this concept can be\
    \ extended to an arbitrary number of GPUs.)\n\n![Figure 7.2. Illustration how\
    \ we can distribute matrix multiplication across different devices. For simplicity,\
    \ the figure depicts two GPUs, but the concepts extends to an arbitrary number\
    \ of devices.](resources/figures----multi-gpu-linearalg.png)\n\nFigure 7.2. Illustration\
    \ how we can distribute matrix multiplication across different devices. For simplicity,\
    \ the figure depicts two GPUs, but the concepts extends to an arbitrary number\
    \ of devices.\n\nAn advantage of tensor parallelism is that we can work around\
    \ memory limitations similar to model parallelism. And at the same time, we can\
    \ also execute operations in parallel, similar to data parallelism.\n\nA small\
    \ weakness of tensor parallelism is that it can result in high communication overhead\
    \ between the multiple GPUs across which the matrices are split or sharded. For\
    \ instance, tensor parallelism requires frequent synchronization of the model\
    \ parameters across the devices, which can slow down the overall training process.\n\
    \n**Pipeline parallelism**\n\nPipeline parallelism can be seen as a form of model\
    \ parallelism that tries to minimize the sequential-computation bottleneck. In\
    \ that sense, we can think of pipeline parallelism as a form of model parallelism\
    \ that enhances the parallelism between the individual layers sitting on different\
    \ devices. However, note that it also borrows ideas from data parallelism, such\
    \ as splitting minibatches further into microbatches.\n\nHow does it work? During\
    \ the forward pass, the activations are passed similar to model parallelism, however,\
    \ the twist is that the gradients of the input tensor are passed backwards to\
    \ prevent the devices from being idle. In a sense, pipeline parallelism is a sophisticated\
    \ hybrid between data and model parallelism, which is described in more detail\
    \ in the GPipe paper^([33](#chap46.xhtml#fn-gpipe)) or DeepSpeed pipeline parallelism\
    \ tutorial^([34](#chap46.xhtml#fn-deepspeed-pipeline)).\n\n![Figure 7.3. A conceptual\
    \ illustration of pipeline parallelism, which aims to reduce the idle time of\
    \ GPUs compared to regular model parallelism.](resources/figures----multi-gpu-pipeline.png)\n\
    \nFigure 7.3. A conceptual illustration of pipeline parallelism, which aims to\
    \ reduce the idle time of GPUs compared to regular model parallelism.\n\nA disadvantage\
    \ of pipeline parallelism is that it may require significant effort to design\
    \ and implement the pipeline stages and associated communication patterns. Additionally,\
    \ the performance gains from pipeline parallelism may not be as substantial as\
    \ those from other parallelization techniques, such as pure data parallelism,\
    \ especially for small models or in cases where the communication overhead is\
    \ high.\n\nPipeline parallelism is definitely an improvement over model parallelism,\
    \ even though it is not perfect, and there will be idle bubbles. However, for\
    \ modern architectures that are too large to fit into GPU memory, it is nowadays\
    \ more common to use a blend of data parallelism and tensor parallelism (as opposed\
    \ to model parallelism) techniques.\n\n**Sequence parallelism**\n\nSequence parallelism\
    \ is a new concept developed for transformer models^([35](#chap46.xhtml#fn-sequence-parallelism)).\
    \ One shortcoming of transformers is that the self-attention mechanism (the original\
    \ scaled-dot product attention) scales quadratically with the input sequence length.\
    \ There are, of course, more efficient alternatives to the original attention\
    \ mechanism that scales linearly^([36](#chap46.xhtml#fn-efficient-transformers-1)[37](#chap46.xhtml#fn-efficient-transformers-2));\
    \ however, they are less popular, and most people prefer the original scaled-dot\
    \ product attention mechanism.\n\nSequence parallelism splits the input sequence\
    \ into smaller chunks that can be distributed across GPUs to work around memory\
    \ limitations as illustrated in the figure below.\n\n![Figure 7.4. A conceptual\
    \ illustration of sequence parallelism, which aims to reduce computation memory\
    \ constraints of self-attention mechanisms.](resources/figures----multi-gpu-sequence.png)\n\
    \nFigure 7.4. A conceptual illustration of sequence parallelism, which aims to\
    \ reduce computation memory constraints of self-attention mechanisms.\n\nSequence\
    \ parallelism is less well-studied than other parallelization techniques. However,\
    \ conceptually, it would have similar advantages and disadvantages as tensor parallelism.\
    \ It enables us to train larger models when memory is a constraint due to the\
    \ sequence length; however, it also introduces additional communication overheads.\
    \ On the other hand, it also shares shortcoming of data parallelism where we have\
    \ to duplicate the model and make sure it fits into the device memory.\n\nAnother\
    \ disadvantage of sequence parallelism (depending on the implementation) for multi-GPU\
    \ training of transformers is that breaking up the input sequence into smaller\
    \ subsequences can decrease the model’s accuracy – mainly when the model is applied\
    \ to longer sequences.\n\n**Which techniques should we use in practice?**\n\n\
    Practical recommendations depend on the context. If we train small models that\
    \ fit onto a single GPU, then data parallelism strategies may be the most efficient.\
    \ Performance gains from pipeline parallelism may not be as significant as those\
    \ from other parallelization techniques such as data parallelism, especially for\
    \ small models or in cases where the communication overhead is high.\n\nIf models\
    \ are too large to fit into the memory of a single GPU, we need to explore model\
    \ or tensor parallelism. Tensor parallelism is naturally more efficient since\
    \ the GPUs can work in parallel – there is no sequential dependency as in model\
    \ parallelism.\n\nModern multi-GPU strategies typically combine data parallelism\
    \ and tensor parallelism (popular examples include DeepSpeed stages 2 and 3^([38](#chap46.xhtml#fn-deepspeed-stages))).\n\
    \n**\\> Reader quiz:**\n\n**7-A**\n\nSuppose we are implementing our own version\
    \ of tensor parallelism, which works great when we train our model with an SGD\
    \ (standard stochastic gradient descent) optimizer.  \n\nHowever, when we try\
    \ the Adam^([39](#chap46.xhtml#fn-adam)) optimizer, we encounter an out-of-memory\
    \ device. What could be a potential problem explaining this issue?\n\n**7-B**\n\
    \nSuppose we don’t have access to a GPU and are considering using data parallelism\
    \ on the CPU. Is this a good idea?\n\n## Q8. The Keys to Success of Transformers\n\
    \n**\\> Q:**\n\nWhat are the main factors that have contributed to the success\
    \ of transformers?\n\n**\\> A:**\n\nIn recent years, transformers have emerged\
    \ as the most successful neural network architecture, particularly for various\
    \ natural language processing tasks. In fact, transformers are now on the cusp\
    \ of becoming state-of-the-art for computer vision tasks as well.  \n\nThe success\
    \ of transformers can be attributed to several key factors, including their attention\
    \ mechanisms, ability to be parallelized easily, unsupervised pretraining, and\
    \ high parameter counts.\n\n**Attention mechanism**"
  fmt: '

    Figure 7.1. Comparison of model parallelism (left), data parallelism (center),
    and tensor parallelism (right). In model parallelism, we put different layers
    onto different GPUs to work around GPU memory limitations. In data parallelism,
    we split batch across GPUs to train copies of the model in parallel, averaging
    gradients for the weight update afterwards. In tensor parallelism, we split matrices
    (inputs and weights) across different GPU for parallel processing when models
    are too large to fit into GPU memory.


    There are several ways we can implement tensor parallelism. For example, using
    basic principles of linear algebra, we can split a matrix multiplication across
    two GPUs in a row- or column-wise fashion, as illustrated in the figure below.
    (Note that this concept can be extended to an arbitrary number of GPUs.)


    ![Figure 7.2. Illustration how we can distribute matrix multiplication across
    different devices. For simplicity, the figure depicts two GPUs, but the concepts
    extends to an arbitrary number of devices.](resources/figures----multi-gpu-linearalg.png)


    Figure 7.2. Illustration how we can distribute matrix multiplication across different
    devices. For simplicity, the figure depicts two GPUs, but the concepts extends
    to an arbitrary number of devices.


    An advantage of tensor parallelism is that we can work around memory limitations
    similar to model parallelism. And at the same time, we can also execute operations
    in parallel, similar to data parallelism.


    A small weakness of tensor parallelism is that it can result in high communication
    overhead between the multiple GPUs across which the matrices are split or sharded.
    For instance, tensor parallelism requires frequent synchronization of the model
    parameters across the devices, which can slow down the overall training process.


    ### Pipeline parallelism


    Pipeline parallelism can be seen as a form of model parallelism that tries to
    minimize the sequential-computation bottleneck. In that sense, we can think of
    pipeline parallelism as a form of model parallelism that enhances the parallelism
    between the individual layers sitting on different devices. However, note that
    it also borrows ideas from data parallelism, such as splitting minibatches further
    into microbatches.


    How does it work? During the forward pass, the activations are passed similar
    to model parallelism, however, the twist is that the gradients of the input tensor
    are passed backwards to prevent the devices from being idle. In a sense, pipeline
    parallelism is a sophisticated hybrid between data and model parallelism, which
    is described in more detail in the GPipe paper^([33](#chap46.xhtml#fn-gpipe))
    or DeepSpeed pipeline parallelism tutorial^([34](#chap46.xhtml#fn-deepspeed-pipeline)).


    ![Figure 7.3. A conceptual illustration of pipeline parallelism, which aims to
    reduce the idle time of GPUs compared to regular model parallelism.](resources/figures----multi-gpu-pipeline.png)


    Figure 7.3. A conceptual illustration of pipeline parallelism, which aims to reduce
    the idle time of GPUs compared to regular model parallelism.


    A disadvantage of pipeline parallelism is that it may require significant effort
    to design and implement the pipeline stages and associated communication patterns.
    Additionally, the performance gains from pipeline parallelism may not be as substantial
    as those from other parallelization techniques, such as pure data parallelism,
    especially for small models or in cases where the communication overhead is high.


    Pipeline parallelism is definitely an improvement over model parallelism, even
    though it is not perfect, and there will be idle bubbles. However, for modern
    architectures that are too large to fit into GPU memory, it is nowadays more common
    to use a blend of data parallelism and tensor parallelism (as opposed to model
    parallelism) techniques.


    ### Sequence parallelism


    Sequence parallelism is a new concept developed for transformer models^([35](#chap46.xhtml#fn-sequence-parallelism)).
    One shortcoming of transformers is that the self-attention mechanism (the original
    scaled-dot product attention) scales quadratically with the input sequence length.
    There are, of course, more efficient alternatives to the original attention mechanism
    that scales linearly^([36](#chap46.xhtml#fn-efficient-transformers-1)[37](#chap46.xhtml#fn-efficient-transformers-2));
    however, they are less popular, and most people prefer the original scaled-dot
    product attention mechanism.


    Sequence parallelism splits the input sequence into smaller chunks that can be
    distributed across GPUs to work around memory limitations as illustrated in the
    figure below.


    ![Figure 7.4. A conceptual illustration of sequence parallelism, which aims to
    reduce computation memory constraints of self-attention mechanisms.](resources/figures----multi-gpu-sequence.png)


    Figure 7.4. A conceptual illustration of sequence parallelism, which aims to reduce
    computation memory constraints of self-attention mechanisms.


    Sequence parallelism is less well-studied than other parallelization techniques.
    However, conceptually, it would have similar advantages and disadvantages as tensor
    parallelism. It enables us to train larger models when memory is a constraint;
    however, it also introduces additional communications. On the other hand, it also
    shares shortcoming of data parallelism where we have to duplicate the model and
    make sure it fits into device.


    ### Which techniques should we use in practice?


    Practical recommendations depend on the context. If we train small models that
    fit onto a single GPU, then data parallelism strategies may be the most efficient.
    Performance gains from pipeline parallelism may not be as significant as those
    from data parallelism, especially for small models or in cases where the communication
    overhead is high.


    If models are too large to fit into the memory of a single GPU, we need to explore
    model or tensor parallelism. Tensor parallelism is naturally more efficient since
    the GPUs can work in parallel – there is sequential dependency as in model parallelism.


    Modern multi-GPU strategies typically combine data parallelism and tensor parallelism
    (popular examples include DeepSpeed stages 2 and 3^([38](#chap46.xhtml#fn-deepspeed-stages))).


    **Reader quiz:**


    **7-A**


    Suppose we are implementing our own version of tensor parallelism, which works
    great when we train our model with an `SGD` (standard stochastic gradient descent)
    optimizer. However, when we try the `Adam`^([39](#chap46.xhtml#fn-adam)) optimizer,
    we encounter an out-of-memory device. What could be a potential problem explaining
    this issue?


    **7-B**


    Suppose we don’t have access to a GPU and are considering using data parallelism
    on the CPU. Is this a good idea?


    ## Q8. The Keys to Success of Transformers


    **\> Q:**


    What are the main factors that have contributed to the success of transformers?


    **\> A:**


    In recent years, transformers have emerged as the most successful neural network
    architecture, particularly for various natural language processing tasks. In fact,
    transformers are now on the cusp of becoming state-of-the-art for computer vision
    tasks as well.


    The success of transformers can be attributed to several key factors, including
    their attention mechanisms, ability to be parallelized easily, unsupervised pretraining,
    and high parameter counts.


    **Attention mechanism**

