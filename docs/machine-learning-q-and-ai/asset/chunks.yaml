  trans: "\n\n```\n1 1) \"Translate the German sentence '{german_sentence}' int o\
    \ English: {english_translation}\"\n2) \"German: '{german_sentence}' | English:\
    \ {english_translation}\"\n3) \"From German to English: '{german_sentence}' ->\
    \ {english_translation}\"\n```\n\n提示调优（prompt tuning）是参数微调（parameter finetuning）的一种资源高效的替代方案。然而，提示调优的通常不如全模型微调，因为它没有针对特定任务更新模型参数，这可能会限制其适应任务特定细微差别的能力。此外，提示调优仍然是耗费人力的，因为它可能需要人工参与来比较不同提示的质量——由于输入标记是不可微的，这通常被称为`hard`\
    \ 提示（硬提示）。相比之下，`soft` 提示（软提示）策略如`prefix tuning`前缀调优）优化提示的嵌入版本，我们将在下一节关于`参数高效微调`（parameter-efficient\
    \ finetuning）中讨论这一点。\n\n另一种利用纯上下文学习（in-context learning）方法的方法是索引（indexing）。在大型语言模型（LLMs）的语境下，我们可以将索引视为一种基于上下文学习的变通方法，允许我们将\
    \ LLMs 转换为信息检索系统，以从外部资源和网站中提取信息。在这里，索引模块将文档或网站解析为较小的块，并将其嵌入为可以存储在向量数据库中的向量。然后，当用户提交查询时，索引模块计算嵌入查询与数据库中存储的每个向量之间的向量相似性。最后，索引模块检索前\
    \ k 个最相似的嵌入以合成响应。\n\n![图 19.4. 从外部文档检索信息的 LLM 索引。](img/figures----transformer-finetuning-indexing.png)\n\
    \n图 19.4. 从外部文档检索信息的 LLM 索引。\n\n## 参数高效微调\n\n近年来，已经开发了许多方法，以更有效地将预训练的 Transformer\
    \ 适配到新的目标任务。这些方法通常被称为参数高效微调（PEFT），目前最流行的方法总结在下图中。\n\n![图 19.5. 参数高效微调技术的主要类别及最流行的示例。](img/figures----transformer-finetuning-categories.png)\n\
    \n图 19.5. 参数高效微调技术的主要类别及最流行的示例。\n\n上一节中提到的提示调优方法（*上下文学习与提示调优*）通常也被称为“硬”提示调优，以与其他“软”提示方法区分开来。如所述，在硬提示调优中，我们修改离散的输入标记。在软提示调优中，我们使用可训练的参数张量。\n\
    \n软提示调优的核心思想是在嵌入查询标记之前添加一个可训练的参数张量（“软提示”）。然后通过梯度下降对添加的张量进行调优，以提高其在目标数据集上的建模性能。在伪代码中，软提示调优可以描述如下：\n\
    \n```\n1 x = EmbeddingLayer(input_ids)\n2 x = concatenate([soft_prompt_tensor,\
    \ x],\n                  dim=seq_len)\n3 output = model(x)\n```\n\n其中 `soft_prompt_tensor`\
    \ 的特征维度与嵌入层产生的嵌入输入维度相同。\n\n前缀调优（prefix tuning）是一种流行的提示调优方法，与上述软提示调优方法相关。软提示调优和前缀调优的主要区别在于，在前缀调优中，我们在每个\
    \ Transformer 块中添加可训练的张量（软提示），而不仅仅是嵌入输入，如下图和下面的伪代码所示：\n\n```\n 1 def transformer_block_with_prefix(x):\n\
    \ 2     soft_prompt = FullyConnectedLayers(\n 3       soft_prompt)  # Prefix\n\
    \ 4     x = concatenate([soft_prompt, x],  # Prefix\n 5                      dim=seq_len)\
    \      # Prefix\n 6     residual = x\n 7     x = SelfAttention(x)\n 8     x =\
    \ LayerNorm(x + residual)\n 9     residual = x\n10     x = FullyConnectedLayers(x)\n\
    11     x = LayerNorm(x + residual)\n12     return x\n```\n\n前缀调优的优势是它可以稳定训练。\n\
    \n![图 19.6. 前缀调优概述。](img/figures----transformer-finetuning-prefix.png)\n\n图 19.6.\
    \ 前缀调优概述。\n\n两种方法都被认为是参数高效的，因为它们只需要训练添加的张量，而不是 LLM 参数。\n\n适配器方法（Adapter methods）与前缀调优相关，因为它们在\
    \ Transformer 层中添加了额外的参数。在原始适配器方法中，在每个 Transformer 块的多头自注意力和连接层之后添加了额外的连接层，如下。在使用适配器方法训练\
    \ LLM 时，只更新新的适配器层，而其余 Transformer 层保持冻。由于适配器层通常很小——适配块中的第一个连接层将输入投影到低维表示，第二个层将其投影回原始输入维度——适配器方法通常被认为是参数高效的。\n\
    \n![图 19.7. 普通 Transformer 块（左）与带有适配器的 Transformer 块的对比。](img/figures----transformer-finetuning-adapters.png)\n\
    \n图 19.7. 普通 Transformer 块（左）与带有适配器的 Transformer 块的对比。\n\n在伪代码中，适配器方法可以写为：\n\n\
    ```\n 1 def transformer_block_with_adapter(x):\n 2     residual = x\n 3     x\
    \ = SelfAttention(x)\n 4     x = FullyConnectedLayers(x)  # adapter\n 5     x\
    \ = LayerNorm(x + residual)\n 6     residual = x\n 7     x = FullyConnectedLayers(x)\n\
    \ 8     x = FullyConnectedLayers(x)  # adapter\n 9     x = LayerNorm(x + residual)\n\
    10     return x\n```\n\n低秩自适应（LoRA）是另一种值得考虑的流行 PEFT 方法。低秩自适应指的是使用低秩变换重新参数化预训练的\
    \ LLM 权重。\n\n低秩变换是一种使用低维表示来近似高维矩阵或数据集的技术。低维表示（或低秩近似）通过找到能够有效捕捉原始数据大部分信息的少数维度组合来实现。\n\
    \n"
