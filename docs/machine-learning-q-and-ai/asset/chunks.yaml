    ## Q2. 自监督学习（Self-Supervised Learning）


    > **Q:**


    什么是自监督学习？它在什么时候有用？主要的方法类别有哪些？


    > **A:**


    自监督学习是一种预训练程序，它让神经网络能够以有监督的方式利用大型未标记数据集。


    自监督与迁移学习有关。假设我们对训练一个图像分类器来对鸟类进行分类。在迁移学习中，我们会在 ImageNet^4 上先预训练一个卷积神经网络。在通用的 ImageNet
    数据集上预训练后，我们将取预训练好的模型^5，并在包含感兴趣鸟类的较小、更具体的目标数据集上对其进行训练。


    ![图 2.1. 传统迁移学习的插图。](img/figures----self-supervised-transfer.png)


    图 2.1. 传统迁移学习的插图。


    自监督学习是迁移学习的替代方法，我们不是在有标记但 `unlabeled`（未标记）数据上预训练模型。我们考虑一个没有标签信息的未标记数据集。然后，我们找到一种从数据集结构中获取标签的方法，为神经网络制定一个预测任务。这些自监督训练任务也称为
    `pretext tasks`（代理任务）。


    ![图 2.2. 预测模型的自监督学习流水线概述。与上一图相比，区别在于我们在步骤 1 中如何获取标签。](img/figures----self-supervised-1.png)


