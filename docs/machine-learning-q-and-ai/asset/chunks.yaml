  trans: '

    由于测试集的性能远好于训练集，我们可以排除过拟合。更有可能是训练数据和测试数据的分布之间存在显著差异。这些分布差异可能会影响特征。在这里，绘制训练或测试数据的目标或标签分布是一个好主意。例如，一个常见问题是在数据集划分为训练集和测试集之前没有正确洗乱，导致测试集缺少某些标签。对于小型表格数据集，使用直方图比较训练和测试数据的分布是行的，但对于图像和文本数据更为复杂。检查训练-测试集差异的一种相对简单且通的方法是`对抗验证`。


    对抗验证是一种识别训练数据和测试数据之间相似度的技术。在对抗验证中，我们首先将训练集和测试集合并为一个数据集。然后创建一个区分训练和测试数据的二分类目标。例如，我们可以使用一个新的标签，为训练数据分配
    `0`，为测试数据分配 `1`。然后我们使用 `k`-折交叉验证或将数据集重新分为训练集和测试集，并像常一样训练机器学习。理想情况下，我们希望模型表现糟糕，这表明训练和测试数据的分布是相似的。另一方面，如果模型在预测`测试`标签时表现良好，则表明训练和测试数据之间存在差异，我们需要进一步调查。


    ![图 29.1. 检测训练和测试集差异的对抗验证工作流。](img/figures----adversarial-validation.png)


    图 29.1. 检测训练和测试集差异的对抗验证工作流。


    如果使用对抗验证检测训练-测试集差异，有哪些缓解措施？如果我们处理表格数据集，可以逐个移除特征以看看是否能帮助解决问题——这是因为伪特征有时与目标高度相关。对于这一点，我们可以使用顺序特征选择算法^(9)
    配合更新的目标：例如，最小化最大化分类准确率。对于移除特征并非易事的情况（例如图像和文本数据），我们还可以研究移除与测试集不同的训练实例是否可以解决差异问题。


    **读者测试：**


    **29-A**


    对抗任务良好的性能基准是什么？


    **29-B**


    由于训练数据集通常大于测试数据集，对抗验证往往会导致预测平衡问题（我们拥有更多等于`假`的示例）。这是一个问题吗？如果是，我们该如何缓解它？


    ## Q30. 限制标签数据


    **> Q:**


    假设我们绘制了学习曲线^(10)并发现机器学习模型过拟合，可以从更多训练数据中受益。列出监督学习设置中处理限制标签数据的解决方法。


    **> A:**


    除了收集更多数据外，还有几种与正则监督学习相关的方法，我们可以在限制标签数据中使用。


    ### 1) 标记更多数据


    收集额外的训练示例通常提高模型性能^(11)的最佳方法。然而，这在实践中通常不可行。下面列出了各种替代方法。


    ### 2) 数据自助法 (Bootstrapping)


    与`Q5,数据减少过拟合`中讨论的话题类似，通过生成修改（增强）或人工（合成）训练示例对数据进行“自助”，有助于提升预测模型的性能。


    当然，提高数据质量也可以提高模型的预测性能，正如`Q22,数据为中心的 AI`中讨论的那样。


    ### 3) 迁移学习


    迁移学习描述了在通用数据集（例如 ImageNet）上训练模型，然后对预训练的目标数据集进行微调（例如由不同鸟类组成的特定数据集）。迁移学习通常在深度学习背景下进行，此时可以更新权重。这与基于树的方法形成对比，因为大多数决策树算法是非参数模型，不支持迭代训练或参数更新^(12)。


    ![图 30.1. 迁移学习的插图。](img/figures----small-data-supervised-transfer.png)


    图 30.1.迁移学习的插图。


    ### 4) 自监督学习


    与迁移学习类似，自监督学习模型在微调到数据有限的目标任务之前，在不同的任务上进行预训练。然而，与迁移学习不同，自监督学习通常依赖于从无标记数据中直接和自动提取的标签信息。因此，自监督学习也称为无监督预训练。常见的例子包括语言建模中的“下一个词”（例如
    GPT 使用）或“掩码词”（例如 BERT 使用）预测。或者，计算机视觉中一个直观的例子是图像补全：预测随机移除的图像部分。（关于自监督学习的更多信息，请参见`Q2`。）


    ![图 30.2. 自监督学习图像补全的插图。](img/figures----small-data-supervised-selfsupervised.png)


    图 30.2. 自监督学习图像补全的插图。


    ### 5) 主动学习


    在主动学习中，我们通常在学习过程中引入标注者或用户反馈。然而，主动学习不是预先标记整个数据集，而是包含一种建议标记无数据的方案，以最大化机器学习模型的性能。


    `主动学习`的名称是指模型在此过程中`主动`选择数据进行标记。例如，主动学习的最简单形式是选择预测不确定性高的数据由人类标注员（也称为“专家”）进行标记。


    ![图 30.3. 主动学习的插图。](img/figures----small-data-supervised-active.png)


    图 30.3.主动学习


    ### 6) 少样本学习


    在少样本学习场景下，我们通常处理极小的数据集，每个类通常只有几个示例。在研究背景下，1 样本（每个类 1 个示例）和 5 样本（每个类 5 个示例）非常常见。少样本学习的一个极端情况是零样本学习，即不提供标签。最近流行的一个零样本学习例子是
    GPT-3 相关的语言模型。在这里，用户必须通过输入提示词提供所有必要信息，如下所示。


    ![图 30.4. ChatGPT 零样本分类的插图。](img/figures----zero-shot-chatgpt.png)


    图 30.4. ChatGPT 零样本分类的插图。


    ### 7) 元学习


    我们可以将元学习理解为“学习学习”——我们开发学习机器学习算法如何更好地从数据中学习的方法。

    '
