    ![图 12.1. 具有四个输入和两个输出的全连接层。](img/figures----fc-cnn-equivalent-1.png)


    图 12.1. 具有四个输入和两个输出的全连接层。


    上图的全连接层由八个权重和两个偏置单元组成。第一个输出节点可以通过以下点积计算：![w\_{1, 1} \times x\_1 + w\_{1, 2} \times
    x\_2 + w\_{1, 3} \times x\_3 + w\_{1, 4} \times x\_4 + b\_1.](img/leanpub_equation_41.png)同样地，我们可以通过计算第二个输出单元![w\_{2,
    1} \times x\_1 + w\_{2, 2} \times x\_2 + w\_{2, 3} \times x\_3 + w\_{2, 4} \times
    x\_4 + b\_2](img/leanpub_equation_42.png)。


    ### 场景 1：卷积核大小等于输入大小


    让我们从第一个场景开始：卷积滤波器的尺寸等于感受野的大小。回想 Q11，我们如何计算具有一个输入通道和多个输出通道的卷积核中的参数数量。我们的卷积核大小为![2\times
    2,](img/leanpub_equation_43.png)，一个输入通道和两个输出通道。输入大小也为 `2\times 2`，它是前图所示四个输入的重塑版本。


    ![图 12.2. 具有 $2\times2$ 卷积核的卷积层，其等于输入大小且有两个输出通道。](img/figures----fc-cnn-equivalent-2.png)


    图 12.2. 具有![2times2](img/leanpub_equation_44.png)卷积核的卷积层，其等于输入大小且有两个输出通道。


    如果卷积核的维度等于输入大小（如图上所示），则卷积层中没有滑动窗口机制。对于第一个输出通道，我们有一组权重：


    ![\\mathbf{W}\_1 = \begin{bmatrix} w\_{1, 1} & w\_{1, 2}\\\\ w\_{1, 3} & w\_{1,
    4} \\end{bmatrix}.](img/leanpub_equation_45.png)


    对于第二个输出通道，我们有一组权重：


    ![\\mathbf{W}\_2 = \begin{bmatrix} w\_{2, 1} & w\_{2, 2}\\\\ w\_{2, 3} & w\_{2,
    4} \\end{bmatrix} ](img/leanpub_equation_46.png)


