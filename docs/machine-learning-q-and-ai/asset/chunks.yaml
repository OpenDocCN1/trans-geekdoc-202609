    the reverse diffusion process is used to generate a new image ![x](resources/leanpub_equation_21.png)starting
    with the noise tensor ![z\_n](resources/leanpub_equation_22.png)sampled from a
    Gaussian distribution$


    While both diffusion models and flow-based models are generative models aiming
    to learn complex data distributions, they approach the problem from different
    angles: flow-based models use deterministic invertible transformations, while
    diffusion models use the above-mentioned stochastic diffusion process.


    Recent projects, such as *Stable Diffusion*^([53](#chap46.xhtml#fn-stable-diffusion-ref))
    in 2022, established new state-of-the-art performance in in generating high-quality
    images with realistic details and textures. Moreover, diffusion models are easier
    to train than GANs. But their downside is that they are slower to sample from,
    since they require running a series of steps in sequential steps similar to flow-based
    models and autoregressive models.


    ## Consistency Model


    Consistency models train a neural network to map a noisy image to a clean one.
    The network is trained on a dataset of pairs of noisy and clean images. The network
    learns to identify the patterns in the clean images that are modified by the noise.
    Once the network is trained, it can be used to generate reconstructed images from
    noisy images in one step.


    The consistency model training employs an ordinary differential equation (ODE)
    trajectory, a path that a noisy image follows as it is gradually denoised. The
    ODE trajectory is defined by a set of differential equations that describe how
    the noise in the image changes over time, illustrated in the figure below.


    ![Figure 9.7. Illustration of consistency models that learn to map any point form
    a probability flow ODE, which smoothly converts data to noise, to the input.](resources/figures----deep-generative-consistency.png)


    Figure 9.7. Illustration of consistency models that learn to map any point form
    a probability flow ODE, which smoothly converts data to noise, to the input.


    As of this writing, consistency models are the most recent type of generative
    AI model. Based on the original paper proposing this method^([54](#chap46.xhtml#fn-consistency-model-paper)),
    consistency models rival diffusion models in terms of image quality. Moreover,
    consistency models are faster than diffusion models because they do not require
    an iterative process to generate images but generate images in a single step.


    However, while consistency models allow for faster inference, they are still expensive
    to train because they require a large dataset of pairs of noisy and clean images.


    ## Conclusion


    Deep Boltzmann machines are interesting from a historical perspective. Flow-based
    and autoregressive models are nice for estimating exact likelihoods. However,
    other models are usually the first choice when it comes to generating high-quality
    images.


    Particularly VAEs and GANs were battling each other hard when generating high-fidelity
    images over the years. However, in 2022, diffusion models have begun taking over
    image generation almost entirely. Consistency models are a promising alternative
    to diffusion models, but it will remain to be seen whether they become more widely
    adopted to generate state-of-the-art results.


    ‘However, the trade-off here is that sampling from diffusion models is generally
    slower. This is because it involves a sequence of noise-removal steps that must
    be run in order, similar to autoregressive models. This can make them less practical
    for some applications requiring fast sampling.


    **> Reader quiz:**


    ** 9-A**


    How would you evaluate the quality of the images generated by an generative AI
    model?


    ** 9-B**


    Given the description of consistency models above, how would you use them to generate
    new images?


    ## Q10. Sources of Randomness


    **> Q:**


    What are the common sources of randomness when training deep neural networks that
    can cause non-reproducible behavior during training and inference?


    **> A:**


    When training or using machine learning models such as deep neural networks, several
    sources of randomness can lead to different results every time we train or run
    these models, even though we use the same overall settings. Some of these effects
    are accidental, and some of these are intended. The following sections will categorize
    and discuss these various sources of randomness^([55](#chap46.xhtml#fn-random-supp)).


    ### Model weight initilization


    All common deep neural network frameworks, including `TensorFlow` and `PyTorch`,
    randomly initialize the weights and bias units at each layer by default. This
    means that the final model will be different every time we start the training.


    In practice, it is thus recommended to run the training (if the computational
    resources permit) at least a handful of times: Sometimes, unlucky initial weights
    can cause the model not to converge or converge to a local minimum corresponding
    to poorer predictive accuracy.


    ![Figure 10.1. Different starting weights can lead to different final weights
    after the training converges.](resources/figures----random-sources-weights.png)


    Figure 10.1. Different starting weights can lead to different final weights after
    the training converges.


    However, it is possible to turn the random weight initialization into a deterministic
    random initialization by seeding the random generator. For example, if we seed
    the random generator with a seed such as `123`, the weights will still be initialized
    with small random values. Still, the neural network will be initialized with the
    same small random weights whenever someone tries to reproduce the results.


    ### Dataset sampling and shuffling


    When we train and evaluate machine learning models, we usually start by dividing
    a dataset into a training and a test set. This requires random sampling since
    we have to decide which examples we put into a training set and which examples
    we put into a test set.


    Furthermore, we may use model evaluation techniques such as k-fold cross-validation
    or holdout validation, which means that we split the training set into a training,
    a validation, and a test dataset^([56](#chap46.xhtml#fn-details-model-eval)),
    which are also sampling procedures that are influenced by randomness.


    However, it is possible to turn the random weight initialization into a deterministic
    random initialization by seeding the random generator. For example, if we seed
    the random generator with a seed such as `123`, the weights will still be initialized
    with small random values. Still, the neural network will be initialized with the
    same small random weights whenever someone tries to reproduce the results.


    Unless we use a fixed random seed, we get a different model each time we partition
    the dataset or tune or evaluate the model using k-fold cross-validation since
    the training partitions will differ.


    ### Nondistic algorithms


    We may include random components and algorithms depending on the architecture
    and hyperparameter choices. A popular example is dropout^([57](#chap46.xhtml#fn-q10-dropout-ref)).
    Dropout works by randomly setting a fraction of a layer’s units to zero during
    training, which helps the model learn more robust and generalized representations.
    This “dropping out” is typically applied at each training iteration with a probability
    `p`, a hyperparameter that controls the fraction of units dropped out. Typical
    values for `p` are in the range of 0.2 to 0.8.

