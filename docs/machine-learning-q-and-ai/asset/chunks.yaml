    1.从技术上讲，神经网络的所有中间层输出都可以产生嵌入向量。取决于训练目标，输出层也可能产生有用的嵌入向量。为了简单起见，上面的卷积神经网络图仅将倒数第二层与嵌入相关联。


    读者练习题的解答位于书末的附录中。


    Wikipedia 摘要：[`en.wikipedia.org/wiki/AlexNet`](https://en.wikipedia.org/wiki/AlexNet)。原始出版：Krizhevsky,
    Sutskever, Hinton (2012). *ImageNet Classification with Deep Convolutional Neural
    Networks*, [`papers.nips.cc/paper/4824-imagenet-classification-with-deep-convolutional-neural-networks`](http://papers.nips.cc/paper/4824-imagenet-classification-with-deep-convolutional-neural-networks)。


    ImageNet 是一个大型的标记图像数据集，包含许多不同的类别，包括各种物体和动物。你可以在 https://en.wikipedia.org/wiki/ImageNet](https://en.wikipedia.org/wiki/ImageNet)
    找到更多信息。


    通常，我们只需要更改特定类别的输出层，但在其他地方可以原样采用预训练网络。


    Bahri, Jiang, Tay, and Metzler (2021). *SCARF: Self-Supervised Contrastive Learning
    Using Random Feature Corruption*, [`arxiv.org/abs/2106.15147`](https://arxiv.org/abs/2106.15147)。


    Levin, Cherepanova, Schwarzschild, Bansal, Bruss, Goldstein, Wilson, and Goldblum
    (2022). *Transfer Learning with Deep Tabular Models*, [`arxiv.org/abs/2206.15306`](https://arxiv.org/abs/2206.15306)。


    对比损失的最简单形式是 ![L\_2](img/leanpub_equation_143.png)-范数（欧几里得距离），即模型 ![M(\cdot)](img/leanpub_equation_144.png)产生的嵌入之间的距离。例如，我们更新模型权重以减小距离
    ![|| M(cat) - M(cat'')||\_2](img/leanpub_equation_145.png) 并增大距离 ![|| M(cat) -
    M(elephant)||\_2](img/leanpub_equation_146.png)。


    一种常用的样本对比方法是，*A Simple Framework for Contrastive Learning of Visual Representations*,
    https://arxiv.org/abs/2002.05709，由 Chen, Kornblith, Norouzi, and Hinton (2020)
    。


    *Barlow Twins: Self-Supervised Learning via Redundancy Reduction*, https://arxiv.org/abs/2103.0323，由
    Zbontar, Jing, Misra, LeCun, and Deny (2021) 编写。


    训练过程中遇到的类别也称为 `base` 类，训练期间的支持集通常被称为 `base` 集。


    原始引用：Frankle and Carbin (2018). *The Lottery Ticket Hypothesis: Finding Sparse,
    Trainable Neural Networks.* [`arxiv.org/abs/1803.03635`](https://arxiv.org/abs/1803.03635)。


    我们可以修剪单个权重，这被称为 `unstructured` 剪枝。然而，我们也可以从网络中修剪较大的“块”，例如整个卷积通道。这被称为 `structured`
    剪枝。


    Li, Kadav, Durdanovic, Samet, and Graf (2016). *Pruning Filters For Efficient
    ConvNets.* [`arxiv.org/abs/1608.08710`](https://arxiv.org/abs/1608.08710)。


    Frankle, Dziugaite, Roy, and Carbin (2019). *Linear Mode Connectivity The Lottery
    Ticket Hypothesis*, [`arxiv.org/abs/1912.05671`](https://arxiv.org/abs/1912.05671)。


    虽然防止过拟合是理想的，但通常无法完全消除它。相反，我们的目标尽可能地 `reduce` 或 `minimize` 过拟合。


    假设我们不改变监督学习过程。Q30 列出了处理有限数据的替代训练技术，如主动学习和少样本学习。


    Snow (2020). *DeltaPy: A Framework for Tabular Augmentation in Python*, [`github.com/firmai/deltapy`](https://github.com/firmai/deltapy)。


    GReaT 方法使用自回归生成语言模型生成合成表格数据。引用：Borisov, Seßler, Leemann, Pawelczyk, and Kasneci
    (2022). *Language Models Are Realistic Tabular Data Generators*, [`arxiv.org/abs/2210.06280`](https://arxiv.org/abs/2210.06280)。


    TabDDPM 是使用扩散模型生成合成表格数据的方法。Kotelnikov, Baranchuk, Rubachev, and Babenko (2022).
    *TabDDPM: Modelling Tabular Data with Diffusion Models*, [`arxiv.org/abs/2209.15421`](https://arxiv.org/abs/2209.15421)。


    Q5 讨论了减少过拟合的各种数据集相关技术。


    `L2` 正则化与权重衰减（weight decay）之间的细微差别在 Zhang, Wang, Xu, and Grosse (2018) 的 *Three
    Mechanisms of Weight Decay Regularization* 中解释，[`arxiv.org/abs/1810.12281`](https://arxiv.org/abs/1810.12281)。


    Hastie, Tibshirani, Friedman (2009). *The Elements of Statistical Learning*. 第
    2.9 章，模型选择与偏差-方差权衡。


    Frankle and Carbin (2018). *The Lottery Ticket Hypothesis: Finding Sparse, Trainable
    Neural Networks,* [`arxiv.org/abs/1803.03635`](https://arxiv.org/abs/1803.03635)。


    Hinton, Vinyals, and Dean (2015). *Distilling the Knowledge in a Neural Network*,
    [`arxiv.org/abs/1503.02531`](https://arxiv.org/abs/1503.02531)。


    双下降（Double descent）指的是参数量极小或极大的模型具有良好的泛化性能，而参数数量等于训练数据点的模型泛化性能较差的现象。更多解释和参考请参见
    [`en.wikipedia.org/wiki/Double\_descent`](https://en.wikipedia.org/wiki/Double_descent)。


    Grokking 揭示了随着数据集大小减小，对优化的需求增加，且泛化性能可以在过拟合点之后提升。Power, Burda, Edwards, Babuschkin,
    and Misra (2022). *Grokking: Generalization Beyond Overfitting on Small Algorithmic
    Datasets*. [`arxiv.org/abs/2201.02177`](https://arxiv.org/abs/2201.02177)。


    Jin, Carbin, Roy, Frankle, and Dziugaite (2022). *Pruning’s Effect on Generalization
    Through the Lens of Training and Regularization*. [`arxiv.org/abs/2210.13738`](https://arxiv.org/abs/2210.13738)。


    Baldi and Sadowski (2013). Understanding Dropout. *Advances In Neural Information
    Processing Systems*, [`proceedings.neurips.cc/paper/2013/hash/71f6278d140af599e06ad9bf1ba03cb0-Abstract.html`](https://proceedings.neurips.cc/paper/2013/hash/71f6278d140af599e06ad9bf1ba03cb0-Abstract.html)。


    在论文 *Well-tuned Simple Nets Excel on Tabular Datasets*, [`arxiv.org/abs/2106.15147)`](https://arxiv.org/abs/2106.15147)
    中，研究人员表明正则化配方需要根据每个数据集进行调优。


    [`github.com/microsoft/DeepSpeed`](https://github.com/microsoft/DeepSpeed)


