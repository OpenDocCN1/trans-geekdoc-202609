    ![Figure 18.4. An overview of some of the most popular large language transformers
    organized by architecture type and developers.](resources/figures----encoder-decoder-tree.png)


    Figure 18.4. An overview of some of the most popular large language transformers
    organized by architecture type and developers.


    While encoder-only models gradually lost in popularity, decoder-only models like
    `GPT` exploded in popularity thanks to breakthrough in text generation via `GPT-3`,
    `ChatGPT`, and `GPT-4`. However, encoder-only models are still very useful for
    training predictive models based on text embeddings versus generating texts.


    > **Reader quiz:**


    **18-A**

    As discussed earlier, `BERT`-style encoder models are pretrained using masked
    language modeling and next-sentence prediction pretraining objectives. How could
    we adopt such a pretrained model for a classification task, for example, predicting
    whether a text has a positive or negative sentiment?


    **18-B**

    Can we finetune or a decoder-only model like `GPT` for classification?


    ## Q19. Using and Finetuning Pretrained Transformers


    > **Q:**

    What are the different ways we can use and finetune pretrained large language
    models (LLMs)?


    > **A:**

    Firstly, most pretrained `LLMs` or language transformers can be utilized without
    the need for further finetuning. For instance, we can employ a feature-based method
    to train a new downstream model (for example, a linear classifier) using embeddings
    generated by a pretrained transformer.


    Secondly, we can showcase examples of a new task within the input itself, which
    means we can directly exhibit the expected outcomes without requiring any updates
    or learning from the model.


    ![Figure 19.1. An illustration of prompting, which doesn’t require model tuning.
    Here, we provide examples of the target task via the input.](resources/figures----prompting.png)


    Figure 19.1. An illustration of prompting, which doesn’t require model tuning.
    Here, we provide examples of the target task via the input.


    Thirdly, it’s possible to finetune all or just a small number of parameters to
    achieve the desired outcomes. The following sections will outline these different
    types of approaches.


    ### The Three Conventional Methods


    Let us start with the conventional methods for utilizing pretrained transformers:
    training another model on feature embeddings, finetuning output layers, and finetuning
    all layers. We will be discussing these in the context of classification.


    In the feature-based approach, we load the pretrained model and keep it “frozen”
    – this means we do not update any parameters of the pretrained model. Instead,
    we treat the model as a feature extractor that we apply to our new dataset. Then,
    we train a downstream model on these embeddings. This downstream model can be
    any model we like (random forests, `XGBoost`, etc.), but linear classifiers typically
    perform best. This is likely because pretrained transformers like `BERT` and `GPT`
    already extract high-quality, informative features from the input data. These
    feature embeddings often capture complex relationships and patterns, making it
    easy for a linear classifier to effectively separate the data into different classes.
    Furthermore, linear classifiers, such as logistic regression or support vector
    machines, tend to have strong regularization properties. These regularization
    properties help prevent overfitting when working with high-dimensional feature
    spaces generated by pretrained transformers. This feature-based approach is the
    most efficient method since it doesn’t require updating the transformer model
    at all. Furthermore, the embeddings can be pre-computed for a given training dataset
    (since they don’t change) when training a classifier for multiple training epochs.


    When we talk about finetuning pretrained `LLMs`, the conventional methods include
    updating only the output layers (we will refer to this method as finetuning I)
    and updating all layers (finetuning II).


    ![Figure 19.2. An illustration of the general finetuning worfklow of large language
    models.](resources/figures----transformer-finetuning.png)


    Figure 19.2. An illustration of the general finetuning worfklow of large language
    models.


    `finetuning I` is related to the feature-based approach above but adds one or
    more output layers to the `LLM` itself. The backbone of the `LLM` remains frozen,
    and we only update the model parameters in these new layers. We don’t need to
    backpropagate through the whole network, so this approach is relatively efficient
    regarding throughput and memory requirements.


    In `finetuning II`, we load the model and add one or more output layers, similar
    to `finetuning I`. But instead of only backpropagating through the last layers,
    we update all layers via backpropagation, making this the most expensive approach.
    However, while this method is computationally more expensive than the feature-based
    approach and `finetuning I`, it typically leads to better modeling or predictive
    performance. This is especially true for more specialized domain-specific datasets.
    The following figure below summarizes the three approaches described above.


    ![Figure 19.3. The three conventional approaches for utilizing pretrained LLMs.](resources/figures----transformer-finetuning-classic.png)


    Figure 19.3. The three conventional approaches for utilizing pretrained LLMs.


    ### In-Context Learning, Indexing, and Prompt Tuning


    `LLMs` like `GPT-2` and `GPT-3` popularized the concept of in-context learning,
    often called zero or few-shot learning in this context. However, the in-context
    learning-based definition of few-shot learning differs from the conventional approach
    to few-shot learning.


    The idea behind in-context learning is to provide context or examples of the task
    within the input or prompt, allowing the model to infer the desired behavior and
    generate appropriate responses. This approach takes advantage of the model’s ability
    to learn from vast amounts of data during pretraining.


    For example, suppose we want to use in-context learning for few-shot German-English
    translation using a large-scale pretrained model like `GPT-3`. To do so, we provide
    a few examples of German-English translations to help the model understand the
    desired task, as shown below:


    ```

    Translate the following German sentences into English:


    Example 1:

    German: "Ich liebe Pfannkuchen."

    English: "I love pancakes."


    Example 2:

    German: "Das Wetter ist heute schoen."

    English: "The weather is nice today."


    Translate this sentence:

    German: "Wo ist die naechste Bushaltestelle?"

    ```


    Wait, I should stop here.


    Generally, in-context learning does not perform as well as finetuning for certain
    tasks or specific datasets. This is because in-context learning relies on the
    pretrained model’s ability to generalize from its training data without further
    adapting its parameters for the particular task at hand.


    However, it’s worth noting that in-context learning has its advantages. It can
    be particularly useful when labeled data for finetuning is limited or unavailable.
    It also enables rapid experimentation with different tasks without finetuning
    the model parameters in cases where we don’t have direct access to the model or
    only interact with the model through a UI or API (for example, `ChatGPT`).


    Related to in-context learning is the concept of “hard” prompt tuning. Where the
    previously described finetuning methods update the model parameters to perform
    better at a task at hand, hard prompt tuning aims to optimize the prompt itself
    to achieve better performance. Prompt tuning does not modify the model parameters
    but may involve using a smaller labeled dataset to identify the best prompt formulation
    for the specific task. For example, to improve the prompts for the German-English
    translation task above, we may try the following three prompting variations:

    '
  trans: '


    ![图 18.4. 按架构类型和开发者分类的某些流行大语言 Transformer 概述](img/figures----encoder-decoder-tree.png)


    图 18.4. 按架构类型和开发者分类的某些流行大语言 Transformer 概述。


    虽然仅编码器（encoder-only）模型逐渐失去了流行，但得于 `GPT-3`、`ChatGPT` 和 `GPT-4` 在文本生成方面的突破，仅解码器（decoder-only）模型的人性异常爆发。然而，对于训练基于文本嵌入的预测模型而非生成文本，仅编码器模型仍然非常有用。


    > **读者测试：**


    **18-A**

    如前所述，`BERT`-风格的编码器模型使用掩码语言建模和下一句预测训练目标进行预训练。我们如何将此类预训练模型应用于分类任务，例如预测文本是否具有正面还是负面情感？


    **18-B**

    我们是否可以对像 `GPT` 这样的仅解码器模型进行微调以用于分类？


    ## Q19. 使用和微调预训练 Transformers


    > **问：**

    我们有哪些不同的方法来使用和微调预训练的大语言模型（LLMs）？


    > **答：**

    首先，大多数预训练的 `LLMs` 或语言 Transformer 可以在不需要进一步微调的情况下使用。例如，可以使用基于特征的方法，利用预训练 Transformer
    生成的嵌入训练一个新的下游模型（例如线性分类器）。


    其次，我们可以在输入本身中展示新任务的示例，这意味着我们可以直接展示预期结果，而不需要对模型进行任何更新或学习。


    ![图 19.1. 提示（prompting）的插图，它不需要模型调优。在这里，我们通过输入提供目标任务的示例](img/figures----prompting.png)


    图 19.1. 提示（prompting）的插图，它不需要模型调优。在这里，我们通过输入提供目标任务的示例。


    第三，可以微调所有或少数参数来实现所需的结果。接下来的章节将概述这些不同类型的方法。


    ### 三种传统方法


    让我们从利用预训练 Transformer 的传统方法开始：在特征嵌入上训练另一个模型、微调输出层以及微调所有层。我们将在分类背景下讨论这些内容。


    在基于特征的方法中，我们加载预训练模型并保持其“冻结”状态——这意味着我们不更新预训练模型的任何参数。相反，我们将模型视为特征提取器，并将其应用于我们的新数据集。然后，我们在这些嵌入上训练一个下游模型。这个下游模型可以是我们喜欢的任何模型（随机森林、`XGBoost`
    等），但线性分类器通常表现最好。这可能是因为像 `BERT` 和 `GPT` 这样的预训练 Transformer 已经从输入数据中提取了高质量、信息丰富的特征。这些特征嵌入通常捕获了复杂的关系和模式，使得线性分类器能够有效地将数据分到不同的类别。此外，线性分类器（如逻辑回归或支持向量机）倾向于具有很强的正则化属性。这些正则化属性有助于在处理预训练
    Transformer 生成的高维特征空间时防止过拟合。这种基于特征的方法是最有效的方法，因为它完全不需要更新 Transformer 模型。此外，在对分类器进行多个训练轮次（epochs）时，可以为给定的训练数据集预先计算嵌入（因为它们不会改变）。


    当我们谈论微调预训练的 `LLMs` 时，传统方法包括仅更新输出层（我们将这种方法称为微调 I）和更新所有层（微调 II）。


    ![图 19.2. 大语言模型通用微调工作流插图](img/figures----transformer-finetuning.png)


    图 19.2. 大语言模型通用微调工作流插图。


    `微调 I` 与上述基于特征的方法相关，但为 `LLM` 本身添加一个或多个输出层。`LLM` 的骨干保持冻结状态，我们只更新这些新层中的模型参数。我们不需要通过整个网络进行反传播，因此这种方法在吞吐量和内存方面相对高效。


    在 `微调 II` 中，我们加载模型并添加一个或多个输出层，类似于 `微调 I`。但我们不是只通过最后层进行反传播，而是通过反传播更新所有层，这成为最贵的方法。尽管这种方法在计算上比基于特征的方法和
    `微调 I` 更贵，但它通常会导致更好的建模或预测性能。这对于更专业的领域数据集尤其如此。下图总结了上述三种方法。


    ![图 19.3. 利用预训练 LLMs 的三种传统方法](img/figures----transformer-finetuning-classic.png)


    图 19.3. 利用预训练 LLMs 的三种传统方法。


    ### 上下文学习、索引和提示调优


    `GPT-2` 和 `GPT-3` 等 `LLMs` 普及了上下文学习（in-context learning）的概念，在此背景下通常被称为零样本或少样本学习（zero
    or few-shot learning）。然而，基于上下文学习的少样本学习定义与传统的少样本学习方法不同。


    上下文学习的理念是在输入或提示（prompt）中提供任务的上下文或示例，允许模型推断所需的行为并生成适当的响应。这种方法利用了模型在预训练期间从海量数据中学习的能力。


    例如，假设我们想使用上下文学习通过 `GPT-3` 这样的大规模预训练模型进行少样本德英翻译。为了实现这一点，我们提供几个德英翻译示例来帮助模型理解所需任务，如下：


    ```

    Translate the following German sentences into English:


    Example 1:

    German: "Ich liebe Pfannkuchen."

    English: "I love pancakes."


    Example 2:

    German: "Das Wetter ist heute schoen."

    English: "The weather is nice today."


    Translate this sentence:

    German: "Wo ist die naechste Bushaltestelle?"

    ```


    等等，我应该在这里停下。


    通常，上下文学习在某些任务或特定数据集上的表现可能不如微调。这是因为上下文学习依赖于预训练模型从其训练数据中进行泛化的能力，而不针对特定任务进一步调整其参数。


    然而，值得注意的是，上下文学习也有其优势。当用于微调的标注数据有限或不可时，它可能特别有用。它还允许在不微调模型参数的情况下快速尝试不同的任务，适用于我们无法直接访问模型或通过
    UI 或 API 与模型交互的情况（例如 `ChatGPT`）。


    与上下文学习相关的是“硬性”提示调优（prompt tuning）的概念。之前描述的微调方法更新模型参数以更好地处理当前任务，而硬性提示调优旨在优化提示本身以获得更好的性能。提示调优不修改模型参数，但可能涉及使用较小的标注数据集来识别特定任务的最佳提示方案。例如，为了改进上述德英翻译任务的提示，我们可以尝试以下三种提示变体：


    '
