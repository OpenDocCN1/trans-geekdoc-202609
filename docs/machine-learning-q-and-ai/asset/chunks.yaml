- raw: "How do we compute the number of parameters in a convolutional neural network?\
    \ Suppose we are working with a convolutional network with 2 convolutional layers\
    \ with kernel size 5. The first convolutional layer has 3 input channels and 5\
    \ output channels. The second convolutional layer has 5 input and 12 output channels.\
    \ The stride of these convolutional layers is 1.  \n\nFurthermore, the network\
    \ has 2 pooling layers with kernel size 3 and stride 2. Lastly, the network has\
    \ 2 fully connected hidden layers with 192 and 128 hidden units each, where the\
    \ output layer is a classification layer for 10 classes. The architecture of this\
    \ network is illustrated in the figure below. What is the number of trainable\
    \ parameters in this convolutional network?\n\n![Figure 11.1. Illustration of\
    \ a convolutional neural network with two convolutional and two fully connected\
    \ layers.](resources/figures----cnn-size-1.png)\n\nFigure 11.1. Illustration of\
    \ a convolutional neural network with two convolutional and two fully connected\
    \ layers.\n\n**\\> A:**\n\nWe can approach this problem from left to right, computing\
    \ the number of parameters for each layer and then summing up these counts to\
    \ obtain the total number of parameters. Each layer’s number of trainable parameters\
    \ consists of weights and bias units.\n\nIn a convolutional layer, the number\
    \ of weights depends on the kernel’s width and height and the number of input\
    \ and output channels. The number of bias units depends on the number of output\
    \ channels only. To illustrate the computation step-by-step, suppose we have a\
    \ kernel width and height of 5, 1 input channel, and 1 output channel, as illustrated\
    \ in the figure below. In this case, we have 26 parameters since we have ![5\\\
    \\times 5 =25](resources/leanpub_equation_23.png)weights via the kernel plus the\
    \ bias unit. The computation to compute an output value or pixel ![z](resources/leanpub_equation_24.png)is\
    \ ![z = b + \\\\sum\\_j w\\_j x\\_j](resources/leanpub_equation_25.png), where\
    \ ![x\\_j](resources/leanpub_equation_26.png)represents an input pixel, ![w\\\
    _j](resources/leanpub_equation_27.png)represents a weight parameter of the kernel,\
    \ and ![b](resources/leanpub_equation_28.png)is the bias unit.\n\n![Figure 11.2.\
    \ A convolutional layer with only one input and one output channel. The parameter\
    \ count is 25.](resources/figures----cnn-size-2.png)\n\nFigure 11.2. A convolutional\
    \ layer with only one input and one output channel. The parameter count is 25.\n\
    \nNow, suppose we have 3 input channels as illustrated in the figure below. In\
    \ that case, we compute the output value by performing the above-mentioned operation,\
    \ ![\\\\sum\\_j w\\_j x\\_j](resources/leanpub_equation_29.png)for each input\
    \ channel and then add the bias unit. For 3 input channels, this would involve\
    \ three different kernels with three sets of weights: ![z = \\\\sum\\_j w^{(1)}\\\
    _{j} x\\_j + \\\\sum\\_j w^{(2)}\\_{j} x\\_j + \\\\sum\\_j w^{(3)}\\_{j} x\\_j\
    \ + b.](resources/leanpub_equation_30.png)Since we have 3 sets of weights ![(w^{(1)},\
    \ w^{(2)}, \\\\text{ and } w^{(3)} \\\\text{ for } j=\\[1, \\\\dots, 25\\])](resources/leanpub_equation_31.png)we\
    \ have ![3 \\\\times 25+1=76](resources/leanpub_equation_32.png)parameters in\
    \ this convolutional layer.\n\n![Figure 11.3. A convolutional layer with only\
    \ three input and one output channel. The parameter count is 76.](resources/figures----cnn-size-3.png)\n\
    \nFigure 11.3. A convolutional layer with only three input and one output channel.\
    \ The parameter count is 76.\n\nWe use one kernel for each output channel, where\
    \ each kernel is unique to a given output channel. So, if we extend the number\
    \ of output channels from 1 to 5 as shown in the figure below, we extend the number\
    \ of parameters by a factor of 5. In other words, if the kernel for one output\
    \ channel had 76 parameters, the 5 kernels required for the 5 output channels\
    \ would have ![5 \\\\times 76 = 380](resources/leanpub_equation_33.png)parameters.\n\
    \n![Figure 11.4. A convolutional layer with three input and five output channels.\
    \ The parameter count is 76.](resources/figures----cnn-size-4.png)\n\nFigure 11.4.\
    \ A convolutional layer with three input and five output channels. The parameter\
    \ count is 76.\n\nNow, returning to the neural network architecture illustrated\
    \ at the beginning of this section, we compute the number of parameters in the\
    \ convolutional layers as follows. For example, the first convolutional layer\
    \ has 3 input channels, 5 output channels, and a kernel size of 5. Thus, its number\
    \ of parameters is ![5 \\\\times (5\\\\times 5 \\\\; \\\\times 3) + 5 = 380](resources/leanpub_equation_34.png).\n\
    \nThe second convolutional layer, with 5 input channels, 12 output channels, and\
    \ a kernel size of 3, has ![12 \\\\times (3\\\\times 3 \\\\; \\\\times 5) + 12\
    \ = 552](resources/leanpub_equation_35.png)parameters. Since the pooling layers\
    \ do not have any trainable parameters, we can count ![380+552 = 932](resources/leanpub_equation_36.png)for\
    \ the convolutional part of this architecture. Next, let’s move on to the fully\
    \ connected layers.\n\nCounting the number of parameters in a fully connected\
    \ layer is relatively straightforward. A fully connected node connects each input\
    \ node to each output node, so the number of weights is the number of inputs times\
    \ the number of outputs plus the bias units added to the output. For example,\
    \ if we have a fully connected layer with 5 inputs and 3 outputs as shown in the\
    \ figure below, we thus have ![5 \\\\times 3 = 15](resources/leanpub_equation_37.png)weights\
    \ and 3 bias units, that is, 18 parameters in total.\n\n![Figure 11.5. A fully\
    \ connected layer with five inputs and three outputs. The parameter count is 18.](resources/figures----cnn-size-5.png)\n\
    \nFigure 11.5. A fully connected layer with five inputs and three outputs. The\
    \ parameter count is 18.\n\nReturning once more to the neural network architecture\
    \ illustrated at the beginning of this chapter, we can now calculate the parameters\
    \ in the fully connected layers as follows: ![192 \\\\times 128 + 128= 24,704](resources/leanpub_equation_38.png)in\
    \ the first fully connected layer and ![128 \\\\times 10 + 10 = 1,290](resources/leanpub_equation_39.png)in\
    \ the second fully connected layer, the output layer. Hence, we have ![24,704\
    \ + 1,290 = 25,994](resources/leanpub_equation_40.png)in the fully connected part\
    \ of this network.\n\nNow, adding the 932 parameters from the convolutional layers\
    \ and the 25,994 parameters from the fully connected layers, we can conclude that\
    \ this network’s total number of parameters is 26,926^([1](#chap46.xhtml#fn-pytorch-parameters)).\n\
    \nWhy do we care about the number of parameters after all? First, the number of\
    \ parameters lets us estimate a model’s complexity. As a rule of thumb, the more\
    \ parameters we have, the more training data is recommended to train the model\
    \ well.\n\nMoreover, the number of parameters lets us estimate the size of the\
    \ neural network, which helps estimate whether it can fit into GPU memory^([2](#chap46.xhtml#fn-fit-gpu-memory)).\n\
    \n**\\> Reader quiz:**\n\n**11-A**\n\nSuppose we want to optimize the neural network\
    \ using plain stochastic gradient descent (SGD) or an Adam optimizer. What are\
    \ the respective numbers of parameters that need to be stored for SGD and Adam?\n\
    \n**11-B**\n\nSuppose we are adding three batch normalization (BatchNorm) layers:\
    \ one after the first convolutional layer, one after the second convolutional\
    \ layer, and another one after the first fully connected layer – we typically\
    \ do not want to add BatchNorm layers to the output layer. How many additional\
    \ parameters do these three BatchNorm layers add to the model?\n\n## Q12. The\
    \ Equivalence of Fully Connected and Convolutional Layers\n\n**\\> Q:**\n\nUnder\
    \ which circumstances are fully connected and convolutional layers equivalent?\n\
    \n**\\> A:**\n\nThere are exactly two scenarios: (1) the size of the convolutional\
    \ filter is equal to the size of the receptive field, and (2) the size of the\
    \ convolutional filter is one. To illustrate these two scenarios, consider a fully\
    \ connected layer with two input and four output units, as shown in the following\
    \ figure."
  fmt: '

    How do we compute the number of parameters in a convolutional neural network?
    Suppose we are working with a convolutional network with 2 convolutional layers
    with kernel size 5. The first convolutional layer has 3 input channels and 5 output
    channels. The second convolutional layer has 5 input and 12 output channels. The
    stride of these convolutional layers is 1.


    Furthermore, the network has 2 pooling layers with kernel size 3 and stride 2.
    Lastly, the network has 2 fully connected hidden layers with 192 and 128 hidden
    units each, where the output layer is a classification layer for 10 classes. The
    architecture of this network is illustrated in the figure below. What is the number
    of trainable parameters in this convolutional network?


    ![Figure 11.1. Illustration of a convolutional neural network with two convolutional
    and two fully connected layers.](resources/figures----cnn-size-1.png)


    Figure 11.1. Illustration of a convolutional neural network with two convolutional
    and two fully connected layers.


    > **> A:**


    We can approach this problem from left to right, computing the number of parameters
    for each layer and then summing up these counts to obtain the total number of
    parameters. Each layer’s number of trainable parameters consists of weights and
    bias units.


    In a convolutional layer, the number of weights depends on the kernel’s width
    and height and the number of input and output channels. The number of bias units
    depends on the number of output channels only. To illustrate the computation step-by-step,
    suppose we have a kernel width and height of 5, 1 input channel, and 1 output
    channel, as illustrated in the figure below. In this case, we have 26 parameters
    since we have ![5\times 5 =25](resources/leanpub_equation_23.png)weights via the
    kernel plus the bias unit. The computation to compute an output value or pixel
    ![z](resources/leanpub_equation_24.png)is ![z = b + \sum\_j w\_j x\_j](resources/leanpub_equation_25.png),
    where ![x\_j](resources/leanpub_equation_26.png)represents an input pixel, ![w\_j](resources/leanpub_equation_27.png)represents
    a weight parameter of the kernel, and ![b](resources/leanpub_equation_28.png)is
    the bias unit.


    ![Figure 11.2. A convolutional layer with only one input and one output channel.
    The parameter count is 25.](resources/figures----cnn-size-2.png)


    Figure 11.2. A convolutional layer with only one input and one output channel.
    The parameter count is 25.


    Now, suppose we have 3 input channels as illustrated in the figure below. In that
    case, we compute the output value by performing the above-mentioned operation,
    ![\\sum\_j w\_j x\_j](resources/leanpub_equation_29.png)for each input channel
    and then add the bias unit. For 3 input channels, this would involve three different
    kernels with three sets of weights: ![z = \sum\_j w^{(1)}\_{j} x\_j + \sum\_j
    w^{(2)}\_{j} x\_j + \sum\_j w^{(3)}\_{j} x\_j + b.](resources/leanpub_equation_30.png).Since
    we have 3 sets of weights ![(w^{(1)}, w^{(2)}, \text{ and } w^{(3)} \text{ for
    } j=\[1, \dots, 25\])](resources/leanpub_equation_31.png)we have ![3 \times 25+1=76](resources/leanpub_equation_32.png)parameters
    in this convolutional layer.


    ![Figure 11.3. A convolutional layer with only three input and one output channel.
    The parameter count is 76.](resources/figures----cnn-size-3.png)


    Figure 11.3. A convolutional layer with only three input and one output channel.
    The parameter count is 76.


    We use one kernel for each output channel, where each kernel is unique to a given
    output channel. So, if we extend the number of output channels from 1 to 5 as
    shown in the figure below, we extend the number of parameters by a factor of 5.
    In other words, if the kernel for one output channel had 76 parameters, the 5
    kernels required for the 5 output channels would have ![5 \times 76 = 380](resources/leanpub_equation_33.png)parameters.


    ![Figure 11.4. A convolutional layer with three input and five output channels.
    The parameter count is 76.](resources/figures----cnn-size-4.png)


    Figure 11.4. A convolutional layer with three input and five output channels.
    The parameter count is 76.


    Now, returning to the neural network architecture illustrated at the beginning
    of this section, we compute the number of parameters in the convolutional layers
    as follows. For example, the first convolutional layer has 3 input channels, 5
    output channels, and a kernel size of 5. Thus, its number of parameters is ![5
    \times (5\times 5 \; \ \times 3) + 5 = 380](resources/leanpub_equation_34.png).


    The second convolutional layer, with 5 input channels, 12 output channels, and
    a kernel size of 3, has ![12 \times (3\times 3 \; \ \times 5) + 12 = 552](resources/leanpub_equation_35.png)parameters.
    Since the pooling layers do not have any trainable parameters, we can count ![380+552
    = 932](resources/leanpub_equation_36.png)for the convolutional part of this architecture.
    Next, let’s move on to the fully connected layers.


    Counting the number of parameters in a fully connected layer is relatively straightforward.
    A fully connected node connects each input node to each output node, so the number
    of weights is the number of inputs times the number of outputs plus the bias units
    added to the output. For example, if we have a fully connected layer with 5 inputs
    and 3 outputs as shown in the figure below, we thus have ![5 \times 3 = 15](resources/leanpub_equation_37.png)weights
    and 3 bias units, that is, 18 parameters in total.


    ![Figure 11.5. A fully connected layer with five inputs and three outputs. The
    parameter count is 18.](resources/figures----cnn-size-5.png)


    Figure 11.5. A fully connected layer with five inputs and three outputs. The parameter
    count is 18.


    Returning once more to the neural network architecture illustrated at the beginning
    of this chapter, we can now calculate the parameters in the fully connected layers
    as follows: ![192 \times 128 + 128= 24,704](resources/leanpub_equation_38.png)in
    the first fully connected layer and ![128 \times 10 + 10 = 1,290](resources/leanpub_equation_39.png)in
    the second fully connected layer, the output layer. Hence, we have ![24,704 +
    1,290 = 25,994](resources/leanpub_equation_40.png)in the fully connected part
    of this network.


    Now, adding the 932 parameters from the convolutional layers and the 25,994 parameters
    from the fully connected layers, we can conclude that this network’s total number
    of parameters is 26,926.


    ### Why do we care about the number of parameters after all?


    First, the number of parameters lets us estimate a model’s complexity. As a rule
    of thumb, the more parameters we have, the more training data is recommended to
    train the model well.


    Moreover, the number of parameters lets us estimate the size of the neural network,
    which helps estimate whether it can fit into GPU memory.


    ### Reader quiz:


    **11-A**


    Suppose we want to optimize the neural network using plain stochastic gradient
    descent (SGD) or an Adam optimizer. What are the respective numbers of parameters
    that need to be stored for SGD and Adam?


    **11-B**


    Suppose we are adding batch normalization (BatchNorm) layers: one after the first
    convolutional layer, one after the second convolutional layer, and another after
    the first fully connected layer – we typically do not want to add BatchNorm layers
    to the output layer. How many additional parameters do these three BatchNorm layers
    add to the model?


    ## Q12. The Equivalence of Fully Connected and Convolutional Layers


    **> Q:**


    Under which circumstances are fully connected and convolutional layers equivalent?


    **\> A:**


    There are exactly two scenarios: (1) the size of the convolutional filter is equal
    to the size of the receptive field, and (2) the size of the convolutional filter
    is one. To illustrate these two scenarios, consider a fully connected layer with
    two input and four output units, as shown in the following figure.

