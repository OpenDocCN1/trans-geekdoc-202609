- raw: "We can conclude that while the cross-entropy loss is a useful loss function\
    \ for training neural networks via (stochastic) gradient decent, it is not a proper\
    \ distance metric as it does not satisfy any of the three criteria above.\n\n\
    **\\> Reader quiz:**\n\n**27-A**\n\nSuppose we consider using the mean absolute\
    \ error (MAE) as an alternative to the root mean square error (RMSE) for measuring\
    \ the performance of a machine learning model, where\n\n![\\\\mathrm{MAE}=\\\\\
    frac{1}{n} \\\\sum\\_{i=1}^n\\\\left|y^{(i)} - \\\\hat{y}^{(i)}\\\\right|](resources/leanpub_equation_131.png)\n\
    \nand\n\n![\\\\mathrm{RMSE}= \\\\sqrt{\\\\frac{1}{n} \\\\sum\\_{i=1}^n\\\\left(y^{(i)}\
    \ - \\\\hat{y}^{(i)}\\\\right)^2}.](resources/leanpub_equation_132.png)\n\nHowever,\
    \ a colleague argues that the MAE is not a proper distance metric in metric space\
    \ because it involves an absolute value, so we should prefer using the RMSE. Is\
    \ this argument correct?\n\n**27-B**\n\nBased on your answer to **27-A**, would\
    \ you say that the MAE is better than the RMSE, or vice versa?\n\n## Q28. The\
    \ *k* in *k*\\-fold cross-validation\n\n**\\> Q:**\n\n*K*\\-fold cross-validation\
    \ is a common choice for evaluating machine learning classifiers because it lets\
    \ us use all training data to simulate how well a machine learning algorithm might\
    \ perform on new data. What are the advantages and disadvantages of choosing a\
    \ large *k*?\n\n**\\> A:**\n\nWe can think of *k*\\-fold cross-validation as a\
    \ workaround for model evaluation when we have limited data. In machine learning\
    \ model evaluation, we care about the generalization performance of our model\
    \ – how well it performs on new data.\n\nIn *k*\\-fold cross-validation, we use\
    \ the training data for model selection and evaluation by partitioning it into\
    \ *k* validation rounds and folds. If we have *k* folds, we have *k* iterations,\
    \ leading to *k* different models. So, using *k*\\-fold cross-validation, we usually\
    \ evaluate the performance of a particular hyperparameter configuration by computing\
    \ the average performance over the *k* models. This performance reflects or approximates\
    \ the performance of a model trained on the complete training dataset after evaluation^([4](#chap46.xhtml#fn-k-fold-explanation)).\n\
    \n![Figure 28.1. Illustration of k-fold cross-validation for model evaluation\
    \ where k=5. The average performance over the five validation folds and models\
    \ can be used to approximate the performance of the final model.](resources/figures----k-fold-explanation.png)\n\
    \nFigure 28.1. Illustration of k-fold cross-validation for model evaluation where\
    \ *k=5*. The average performance over the five validation folds and models can\
    \ be used to approximate the performance of the final model.\n\n**Training folds\
    \ become too similar**\n\nIf *k* is too large, the training sets are too similar\
    \ between the different rounds of cross-validation. The *k* models are thus very\
    \ similar to the model we obtain by training on the whole training set. In this\
    \ case, we can still leverage the advantage of *k*\\-fold cross-validation: evaluating\
    \ the performance for the entire training set^([5](#chap46.xhtml#fn-training-folds))\
    \ via the held-out validation fold in each round. However, a disadvantage of a\
    \ large *k* is that analyzing how the machine learning algorithm with the particular\
    \ choice of hyperparameter setting behaves on different training datasets is more\
    \ challenging.\n\n**Increases computational budget**\n\nBesides the issue mentioned\
    \ above with datasets that are too similar, running *k*\\-fold cross-validation\
    \ with a large value of *k* is also computationally more demanding. A larger *k*\
    \ is more expensive since it increases (1) the number of iterations and (2) the\
    \ training set size at each iteration. This is especially an issue if we work\
    \ with relatively large models that are expensive to train, for example, contemporary\
    \ deep neural networks. Common choices for *k* are typically 5 or 10 for practical\
    \ and historical reasons ^([6](#chap46.xhtml#fn-kohavi-1995)).\n\n![Figure 28.2.\
    \ Comparison of 5-fold and 10-fold cross-validation. In 10-fold cross-validation,\
    \ we use 9/10 (90%) of the data for training in each round, whereas in 5-fold\
    \ cross-validation, we only use 4/5 (80%) of the data.](resources/figures----k-fold-5-10.png)\n\
    \nFigure 28.2. Comparison of 5-fold and 10-fold cross-validation. In 10-fold cross-validation,\
    \ we use 9/10 (90%) of the data for training in each round, whereas in 5-fold\
    \ cross-validation, we only use 4/5 (80%) of the data.\n\nHowever, this does not\
    \ mean large training sets are bad. Besides reducing the variance of the performance\
    \ estimates (which can be good or bad), they can reduce the pessimistic bias of\
    \ the performance estimate (which is mostly a good thing) if we assume that the\
    \ model training can benefit from more training data ^([7](#chap46.xhtml#fn-check-learning-curve)).\n\
    \n**Reminding ourselves of the purpose of k-fold cross-validation**\n\nWhen deciding\
    \ upon an appropriate value of *k*, we are often guided by computational performance\
    \ and conventions. However, it’s worthwhile to define the purpose and context\
    \ when we are using k-fold cross-validation. For example, if we care primarily\
    \ about approximating the predictive performance of the final model, using a large\
    \ *k* makes sense. This way, the training folds are very similar to the combined\
    \ training dataset, yet, we still get to evaluate the model on all data points\
    \ via the validation folds.\n\nOn the other hand, if we care to evaluate how sensitive\
    \ a given hyperparameter configuration and training pipeline is to different training\
    \ datasets, then choosing a smaller number for *k* makes more sense.\n\nSince\
    \ most practical scenarios consist of two steps: (1) tuning hyperparameters and\
    \ (2) evaluating the performance of a model, we can also consider a two-step procedure.\
    \ For instance, we can use a smaller *k* during hyperparameter tuning. This will\
    \ help speed up the hyperparameter search and probe the hyperparameter configurations\
    \ for robustness (in addition to the average performance, we can also consider\
    \ the variance as a selection criterion). Then, after hyperparameter tuning and\
    \ selection, we can increase the value of *k* to evaluate the model^([8](#chap46.xhtml#fn-bias-eval)).\n\
    \n**\\> Reader quiz:**\n\n**28-A**\n\nTo provide the model with as much training\
    \ data, we consider using leave-one-out cross-validation (LOOCV). LOOCV is a special\
    \ case of *k*\\-fold cross-validation where *k* is equal to the number of training\
    \ examples such that the validation folds only contain a single data point. A\
    \ colleague mentions that LOOCV is *defect* for discontinuous loss function and\
    \ performance measures such as classification accuracy. For instance, for a validation\
    \ fold consisting of only one example, the accuracy is always either 0 (0%) or\
    \ 1 (99%). Is this really a problem?\n\n**28-B**\n\nWe discussed model selection\
    \ and model evaluation as two use cases of *k*\\-fold cross-validation. Can you\
    \ think of other use cases?\n\n## Q29. Training and Test Set Discordance\n\n**\\\
    > Q:**  \n\nYou trained a model that performs much better on the test dataset\
    \ than on the training dataset. Since a similar model configuration worked well\
    \ on a similar dataset before, you suspect something might be unusual with the\
    \ data. What are some approaches and mitigation issues for looking into training\
    \ and test set discrepancies?\n\n**\\> A:**\n\nBefore investigating the datasets\
    \ in more detail, we should check for technical issues in the data loading and\
    \ evaluation code. For instance, a simple sanity check is to temporarily replace\
    \ the test set with the training set and to reevaluate the model. In this case,\
    \ we should see identical training and test set performances (since these datasets\
    \ are now identical). If we notice a discrepancy, we likely have a bug in the\
    \ code – in my experience, such bugs are often related to incorrect shuffling\
    \ or inconsistent (often missing) data normalization."
