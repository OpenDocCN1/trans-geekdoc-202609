    我们可以将集成方法想象为聘请一个专家委员会：委员会的成员通常具有不同的背景和经验。虽然他们倾向于在基本决策上达成一致，但可以通过多数规则来否决糟糕的决策。这并不意味着大多数专家总是正确的，但从平均而言，委员会中大多数人正确的概率往往比任何单个成员都要高。


    集成方法在经典机器学习中比在深度学习中更为常见，因为与依赖单个模型相比，雇用多个模型的计算开销要更大。换句话说，深度神经网络需要大量的计算资源，这使得它们不太适用于集成方法。（注意的是，虽然我们之前讨论过
    `Dropout` 作为一种正则化技术，但它也可以被视为一种近似多个网络加权几何平均的集成方法^(29)。）


    集成学习方法的流行例子是随机森林和梯度提升。然而，通过多数投票或堆叠（stacking）等方法，我们可以组合任何一组模型：一个集成模型可能由一个向量机、一个多层感知器和一个最近邻分类器组成。


    工业界常用的流行技术是基于 `k`-折交叉验证构建模型。`k`-折交叉验证是一种模型评估技术，我们在 `k` 个训练折上训练并评估模型。然后，我们计算所有
    `k` 次迭代的平均性能指标，以估计模型的整体性能度量。评估后，我们可以在整个训练数据集上训练模型，或者将各个模型组合成一个集成模型，如下所示。


    ![图 6.3. 使用 k-折交叉验证创建模型集集的插图。](img/figures----k-fold.png)


    图 6.3. 使用 k-折交叉验证创建模型集集的插图。


    ## 其他方法


    上述非详尽列表包含了减少过拟合技术中最突出的示例。其他可以减少过拟合的技术还包括跳跃连接（skip-connections，例如在残差网络中）、前瞻优化器（look-ahead
    optimizers）、随机权重平均、多任务学习和快照集成。


    从数据角度旨在减少过拟合的技术将在 Q5 中讨论。


    ## 选择正则化技术


    提高数据质量是减少过拟合的基本第一步。然而，对于具有大量参数的现代深度神经网络，要达到接受的过拟合水平，需要的不仅仅是提高数据质量。因此，数据增强和预训练，结合
    `dropout` 和权重衰减等成熟技术，仍然是减少过拟合的关键方法。


    在实践中，我们需要使用一种以上的技术来减少过拟合。相反，我们也可以并且应该上述技术以产生叠加效应。为了获得最佳结果，选择这些技术应被视为超参数优化问题^(30。


    ## 读者测验：


    ### 6-A


    假设我们正在使用早停（early-stopping）作为减少过拟合的机制。特别是，我们正在使用一种现代变体，在训练期间创建最佳模型的检查点（例如验证准确率最高的模型），以便训练完成后加载它——这是大多数现代深度学习框架中都可以启用的机制。


    现在，一位同事建议调整训练轮数（epochs）的数量。每种方法的优缺点是什么？


    ### 6-B


    集成模型已成为减少过拟合的一种可靠且成功的方法。然而，一直存在权衡。缺点有哪些？


    ## Q7. 多 GPU 训练范式


    ### Q:


    不同的多 GPU 训练范式有哪些？它们各自优缺点是什么？


    ### A:


    多 GPU 训练范式可以分为两类：(1) 使用多个 GPU 对数据进行并行处理；(2) 在多个 GPU 之间划分模型以处理内存限制。数据并行属于第一类，模型并行和张量并行属于第二类。此外，目前的软件实现如
    `DeepSpeed`(31)、`Colossal AI`(32) 等融合了多种方法。等等，让我们仔细观察这些方法。


    ### 模型并行


    模型并行（也称为 `inter op parallelism*`）可能是跨设备并行化最直观的形式。例如，假设你有一个仅包含 2 层的简单神经网络：一个隐藏层和一个输出层。在这里，我们将其中一个层放在一个
    GPU 上，将另一层放在另一个 GPU 上。当然，这可以扩展到任意数量的层和 GPU。


    对于处理 GPU 内存有限且完整网络无法放入单个 GPU 情况的良好策略。


    ```

    layer 1 on GPU 1 (resources/leanpub_7.png)

    layer 2 on GPU 2 (resources/leanpub_8.png)

    ```


    模型并行的一个主要缺点是 GPU 必须相互等待——它们无法高效地并行工作，因为它们依赖对方的输出。


    ### 数据并行


    多年来数据一直是多 GPU 训练的默认模式。在这里，我们将一个小批量（minibatch）划分为更小的微批（microbatches）。然后，每个 GPU
    分别处理一个微批，以计算模型权重的损失和损失梯度。在各个设备处理微批后，将梯度合并以计算下一轮的权重更新。


    数据并行优于模型并行的优势是 GPU 可以并行运行——每个 GPU 处理训练小批量的一部分（即一个微批）。然而，需要注意的是每个 GPU 都需要模型的完整拷贝。如果我们有无法放入
    GPU 显存（VRAM）的大模型，这显然是不可行的。


    ### 张量并行


    张量并行（也称为 `intra op parallelism*`）是一种更高效的模型并行（*inter op parallelism*）。在这里，权重和激活矩阵分布在各个设备上，而不是将整个层分布到设备上。具体来说，单个矩阵被拆分，因此我们在
    GPU 之间拆分单个矩阵乘法。


    ![图 7.1. 模型并行（左）、数据并行（中）和张量并行（右）的比较。在模型并行中，我们将不同的层放在不同的 GPU 上以绕过 GPU 内存限制。在数据并行中，我们将批次分到各个
    GPU，并行训练模型副本，并在之后平均梯度进行权重更新。在张量并行中，我们将矩阵（输入和权重）拆分到不同的 GPU 进行并行处理，前提是模型大到无法放入 GPU
    内存中。](img/figures----multi-gpu-model-data-parallel.png)


    '
