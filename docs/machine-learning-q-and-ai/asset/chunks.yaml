- raw: "*   Consider a medical imaging scenario for a rare disease. A few-shot system\
    \ may only have one or a handful of cases for this disease and is asked to identify\
    \ it based on this limited number of examples.\n\n*   Another example of a few-shot\
    \ system is a recommender that only has a limited number of items a user rated.\
    \ Based on this limited number of examples, the model has to predict future products\
    \ the user may like.\n\n*   Imagine a warehouse robot that has to learn to recognize\
    \ new objects as a company increases its inventory. The robot has to learn to\
    \ recognize and adapt to these new objects based on only a few examples.\n\n**Answer\
    \ 4-A**\n\n*Suppose you are trying out the lottery ticket hypothesis approach\
    \ and find that the performance of the subnetworks is not very good (compared\
    \ to the original network). What are some next steps to try?*\n\n*   Increase\
    \ the size of the initial neural network. It might be possible that the chosen\
    \ network is too small to contain a suitable subnetwork.\n\n*   Try a different\
    \ random initialization (e.g., by changing the random seed). The lottery hypothesis\
    \ assumes that *some* randomly initialized networks contain highly-accurate sub-networks\
    \ that can be obtained by pruning, but not all networks may have such sub-networks.\n\
    \n**Answer 4-B**\n\n*How is the lottery ticket hypothesis related to training\
    \ a neural network with ReLU activation functions (a ReLU activation function\
    \ is defined as max(0, x)?*\n\nWhen training a neural network with ReLU activation\
    \ functions, specific activations will be set to zero if the function input is\
    \ less than zero. This will cause certain nodes in the hidden layers to not contribute\
    \ to the computations – this is sometimes referred to as “dead neurons.” While\
    \ ReLU activations do not directly cause sparse weights, the zero activation outputs\
    \ sometimes lead to zero weights that are not recoverable.  \n\nThis observation\
    \ supports the lottery hypothesis, which suggests that well-trained networks may\
    \ contain sub-networks with sparse, trainable weights that can be pruned without\
    \ loss of accuracy.\n\n**Answer 5-A**\n\n*Suppose we train an XGBoost model to\
    \ classify images based on manually extracted features we obtained from our collaborators.\
    \ The dataset of labeled training examples is relatively small, but fortunately,\
    \ your collaborators also have a labeled training set from an older project on\
    \ a related domain.  \n\nWe are considering implementing a transfer learning approach\
    \ to train the XGBoost model. Is this a feasible option, and if yes, how could\
    \ we do it? (Assume we are only allowed to use XGBoost, no other classification\
    \ algorithm or model.)*\n\nXGBoost is a tree-based gradient-boosting implementation\
    \ that does not support transfer learning (as of this writing). In contrast to\
    \ artificial neural networks, XGBoost is a non-parametric model that we cannot\
    \ readily update as new data arrives; hence, regular transfer learning would not\
    \ work here.\n\nHowever, it is possible to use the results of an XGBoost model\
    \ trained on one task as features for another XGBoost model. So, consider an overlapping\
    \ set of features for both datasets. For example, we could design a classification\
    \ task in a self-supervised fashion for the combined dataset. Then, we train a\
    \ second XGBoost model on the target dataset that takes the original feature set\
    \ as input, along with the output of the first XGBoost model.\n\n**Answer 5-B**\n\
    \n*Suppose we are working on an image classification problem (for this example,\
    \ consider MNIST-based handwritten digit recognition) and added a decent amount\
    \ of data augmentation to reduce overfitting in an image classification context.\
    \ Unfortunately, we observe that the classification accuracy became much worse\
    \ than before. What are some potential reasons?*\n\nWhen applying data augmentations,\
    \ we usually have to increase the training time as well; it is possible that we\
    \ needed to train the model longer.\n\nOr, we may have applied too much data augmentation.\
    \ Augmenting the data too much can result in excessive variations that do not\
    \ reflect the natural variations in the data, leading to overfitting or poor generalization\
    \ to new data. In the case of MNIST, this can also include translating or cropping\
    \ the image too strongly such that the digits become unrecognizable due to missing\
    \ parts.\n\nAnother possibility is that we applied naive, domain-inconsistent\
    \ augmentation. For example, suppose we are mirroring or flipping images vertically\
    \ or horizontally. For MNIST does not make sense for handwritten digits since\
    \ this would create numbers that don’t exist in the real world.\n\n**Answer 6-A**\n\
    \n*Suppose we are using early-stopping as a mechanism to reduce overfitting. In\
    \ particular, we are using a modern variant that creates checkpoints of the best\
    \ model (for instance, the model with highest validation accuracy) during training\
    \ so that we can load it after the training has completed – this is a mechanism\
    \ that can be enabled in most modern deep learning frameworks.*\n\n*Now, a colleague\
    \ recommends tuning the number of training epochs instead. What are some of the\
    \ advantages and disadvantages of each approach?*\n\nTuning the number of training\
    \ epochs is a simpler and more universal approach – especially older frameworks\
    \ don’t support model checkpointing, so changing the number of training epochs\
    \ may be a easier solution, which is particularly attractive for small datasets\
    \ and models where each hyperparameter configuration is cheap to run and evaluate.\
    \ This approach also eliminates the need for monitoring the performance on a validation\
    \ set during training, making it a straightforward and easy-to-use method.\n\n\
    The early-stopping and checkpointing approach is particularly attractive if we\
    \ work with models that are expensive to train. It’s generally also a more flexible\
    \ and robust method for preventing overfitting. However, a downside of this approach\
    \ can be that in noisy training regimes, we may end up prioritizing an early epoch\
    \ even though the validation set accuracy is not a good estimate of the generalization\
    \ accuracy.\n\n**Answer 6-B**\n\n*Ensemble models have been established as a reliable\
    \ and successful method for decreasing overfitting and enhancing the reliability\
    \ of predictive modeling efforts. However, there is always a trade-off. What are\
    \ some of the drawbacks associated with ensemble techniques?*\n\nOne obvious downside\
    \ of ensemble methods is the increased computational cost. For example, if we\
    \ build a neural network ensemble of 5 neural networks, this ensemble can be five\
    \ times as expensive as every single model.\n\nWhile we often consider the inferencing\
    \ costs mentioned above, the increased storage cost is another significant limitation.\
    \ Nowadays, most computer vision and language models have millions or even billions\
    \ of parameters that have to be stored in a distributed setting. Model ensembling\
    \ complicates this further.\n\nReduced interpretability is yet another cost that\
    \ we incur when using model ensembles. Understanding and analyzing the predictions\
    \ of a single model can already be challenging. Depending on the ensembling approach,\
    \ we add yet another layer of complexity that reduces interpretability.\n\n**Answer\
    \ 7-A**\n\n*Suppose we are implementing our own version of tensor parallelism,\
    \ which works great when we train our model with an SGD (standard stochastic gradient\
    \ descent) optimizer.  \n\nHowever, when we try the Adam optimizer, we encounter\
    \ an out-of-memory device. What could be a potential problem explaining this issue?*\n\
    \nThe Adam optimizer implements an adaptive method that comes with internal weight\
    \ parameters. Adam has 2 optimizer parameters (mean and variance) per model parameter.\
    \ So, instead of splitting the weight tensors of the model, we also have to split\
    \ the optimizer states to work around memory limitations. (Note that this is already\
    \ implemented in most DeepSpeed parallelization techniques.)\n\n**Answer 7-B**"
