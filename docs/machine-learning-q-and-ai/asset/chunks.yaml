  trans: '


    上图将图像编码器和文本编码器作为独立的组件。图像编码器可以是卷积骨干网络或视觉变换（Vision Transformer），而语言编码器可以是循环神经网络或语言
    Transformer。然而，现在通常使用单一基于 Transformer 的模块来同时处理图像和文本数据^(18)。


    如上一图所示，优化匹配损失（matching loss）有助于学习适用于各种任务（如图像分类或摘要）的嵌入。然而，下如图所示，也可以直接优化目标损失，例如分类或回归。


    ![Figure 30.10. 用于优化监督学习目标的多模态学习图。](img/figures----multimodal-learning-2.png)


    图 30.10. 用于优化监督学习目标的多模态学习图。


    从直觉上，结合了不同模态数据的模型通常比单模态模型更好，因为它们可以利用更多信息。此外，最近的研究表明，多模态学习成功的在于提高潜空间表示的质量^(19)。


    ### 13) 归纳偏置（Inductive biases）


    选择具有更强归纳偏置的模型可以通过对数据结构做出假设，有助于降低对数据的需求。例如，正如 Q13 中讨论的，由于归纳偏置的影响，卷积网络比视觉 Transformer
    需要更少的数据。


    ### 我们应该使用哪些技术？


    既然我们已经涵盖了降低数据需求的几种技术，我们应该使用哪一个呢？


    收集更多数据以及数据增强、特征工程等技术与上述讨论的所有方法都是兼容的。此外，多任务学习和多模态输入可以与上述其他学习策略结合使用。如果模型存在过拟合问题，还应包含来自
    Q5 和 Q6 的技术。


    主动学习、少样本学习、迁移学习、自监督学习、半监督学习和弱监督学习如何？尝试哪种技术很大程度上取决于上下文，下图提供了一个可以用于指导的概述。


    ![Figure 30.11. 选择监督学习技术的建议。黑框不是终端节点，而是返回到评估模型性能（为了避免视觉混乱，省略了箭头）。](img/figures----learning-strategies-lucidchart.png)


    图 30.11. 选择监督学习技术的建议。黑框不是终端节点，而是返回到评估模型性能（为了避免视觉混乱，省略了箭头）。


    **> 读者测试：**


    #### **30-A**


    给定一个构建机器学习模型的任务，该模型利用图像检测类似 iPad 平板设备外壳的制造缺陷，我们可以获得以下数据：


    * 数百万张各种计算设备（包括智能手机、平板电脑和电脑）的未标记图像。

    * 数千张已标记的智能手机照片，描述了各种类型的损坏。

    * 数百张专门与检测平板设备制造缺陷这一目标相关的已标记图像。


    我们如何如何使用自监督学习或迁移学习来解决这个问题？


    #### **30-B**


    在主动学习中，选择困难的样本进行人工检查和标记通常非常频繁。然而，也可以使用 `sigmoid` 或 `softmax` 函数来计算概率。


    # 后记


    希望你觉得这本书很有用。如果你觉得这本书很有价值，如果你能分享你的经验，我将不胜感激。祝你在所有的努力中好运。


    # 附录 A：读者测试


    ## 第 1 章：神经网络与深度学习


    **答案 1-A**


    *假设你正在训练一个带有五层卷积层、随后是三个全连接（FC）层的网络。哪些层可以用于生成嵌入？*


    我们首先将数据集划分为训练集和测试集。然后将它们进一步划分为子集。


    **答案 1-B**


    *列举至少一种不是嵌入的输入表示类型。*


    * 1) 中的独热编码

    * 从图像创建的直方图^(1)

    * 输入句的词袋^(2)表示


    **答案 2-A**


    *如何将自监督学习应用于视频数据？*


    * 预测视频的下一帧（类似于 GPT 等大语言模型的预测下一个词）

    * 预测缺失或掩码的帧（类似于 BERT 等大语言模型）

    * 修复：预测视频中掩码或缺失的部分（像素区域）

    * 上色：将视频转换为灰度，并训练模型预测颜色


    **答案 2-B**


    *自监督学习可以用于表格数据吗？如果是，我们该如何处理？*


    我们可以移除（掩码）特征值并训练模型来预测这些值（类似于数据插补）。使用这种方法的一个示例是 TabNet^(3)。


    **答案 3-A**


    *我们如何划分包含 10 类（0-9） 5 万个手写数字的 MNIST 数据集，以适用于单样本分类上下文？*


    类似于监督学习方法，我们首先将数据集划分为训练集和测试集。然后将训练集和测试集进一步划分为子集，每个类包含一张图像。


    **答案 3-B**


    *你能想到少样本学习的一些现实世界应用或用例吗？*


