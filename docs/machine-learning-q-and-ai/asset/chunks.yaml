    counterparts, with DBMs being more focused on capturing the data generation process
    and MLPs being more focused on modeling the decision boundary between classes
    or mapping inputs to outputs.


    A Deep Boltzmann Machine consists of multiple layers of hidden nodes (as shown
    in the figure below). But besides using a different learning algorithm (contrastive
    divergence instead of backpropagation), DBMs also differ from MLPs in that they
    consist of binary nodes (neurons) instead of continuous ones.


    ![Figure 9.1. A 4-layer Deep Boltzmann Machine with 3 stacks of hidden nodes.](resources/figures----deep-generative-boltzmann.png)


    Figure 9.1. A 4-layer Deep Boltzmann Machine with 3 stacks of hidden nodes.


    Suppose we are interested in generating images. A DBM can learn the joint probability
    distribution over the pixel values in a simple image dataset like MNIST. To generate
    new images, the DBM then samples from this distribution by performing a process
    called Gibbs sampling. Here, the visible layer of the DBM represents the input
