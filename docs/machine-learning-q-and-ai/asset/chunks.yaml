- raw: 'At the core, the mechanism underlying transformers is the self-attention mechanism
    introduced with the original transformer architecture in 2017^([40](#chap46.xhtml#fn-attention-you-need-q8)).
    Although originally, attention mechanisms were developed in the context of image
    recognition^([41](#chap46.xhtml#fn-attention-vision)) before they were adopted
    to aid the translation of long sentences in recurrent neural networks, attention
    mechanisms are the fundamental mechanism of transformers. (The attention mechanisms
    found in recurrent neural networks and transformers are compared in more detail
    in [Q17](#chap19.xhtml#q17).)


    What makes attention mechanisms so unique and useful? Suppose we are using an
    encoder network that is a fixed-length representation of the input sequence or
    image – this can be a fully connected, convolutional, or attention-based encoder.


    In a transformer, the encoder uses self-attention mechanisms to compute the importance
    of each input token relative to other tokens in the sequence, allowing the model
    to focus on relevant parts of the input sequence. Conceptually, attention mechanisms
    allow the transformers to attend to different parts of a sequence or image. On
    the surface, this sounds very similar to a fully connected layer (or special cases
    of convolutional layers^([42](#chap46.xhtml#fn-q12-equivalence))) where each input
    element is connected via a weight with each other input element in the next layer.


    In attention mechanisms, the computation of the attention weights involves comparing
    each input element to the other. The attention weights obtained by this approach
    are dynamic and input dependent. In contrast, the weights of a convolutional or
    fully connected layer are fixed after training.


    ![Figure 8.1. Illustration of the conceptual difference between model weights
    in fully connected layers and attention scores.](resources/figures----success-transformer-attention.png)


    Figure 8.1. Illustration of the conceptual difference between model weights in
    fully connected layers and attention scores.


    Attention mechanisms allow a neural network to selectively weigh the importance
    of different input features, allowing the model to focus on the most relevant
    parts of the input for a given task.


    **Pretraining via self-supervised learning**


    Pretraining transformers via self-supervised learning on large, unlabeled datasets
    is another key factor in the success of transformers.


    During pretraining, the transformer model is trained to predict missing words
    in a sentence or the next sentence in a document, for example. By learning to
    predict these missing words or the next sentence, the model is forced to learn
    general representations of language that can be finetuned for a wide range of
    downstream tasks.


    However, while unsupervised pretraining has been highly effective for natural
    language processing tasks, its effectiveness for computer vision tasks is still
    an active area of research. (Please refer to [Q2](#chap13.xhtml#q2) for a more
    detailed discussion of self-supervised learning.)


    **Large numbers of parameters**


    One noteworthy characteristic of transformers is their large model sizes. For
    example, the popular 2020 GPT-3 model consists of 175 billion trainable parameters,
    and other transformers, such as Switch Transformers have trillions of parameters^([43](#chap46.xhtml#fn-switch-transformer)).


    The scale and number of trainable parameters of transformers are essential factors
    in their modeling performance, particularly for large-scale natural language processing
    tasks. For instance, linear scaling laws^([44](#chap46.xhtml#fn-old-scaling-laws))
    describe that the training loss improves proportionally to the model size – a
    two-times size increase in model size can half the training loss, which then translates
    to a better modeling performance on the downstream target task.


    However, it is essential to scale the model size and the number of training tokens
    equally. This means the number of training tokens should be doubled for every
    doubling of model size^([45](#chap46.xhtml#fn-new-scaling-laws)). However, since
    labeled data is limited, utilizing large amounts of data during unsupervised pretraining
    is vital.


    To summarize, large model sizes and large datasets are critical factors in transformers’
    success. Additionally, using self-supervised learning, the ability to pretrain
    transformers is closely tied to using large model sizes and large datasets. This
    combination has been critical in enabling the success of transformers in a wide
    range of natural language processing tasks.


    **Easy parallelization**


    As mentioned above, transformers require large amounts of parameters and data
    to achieve their breakthrough modeling performances. However, training such large
    models on large datasets requires vast computational resources, and it’s key that
    the computations can be parallelized to utilize these resources. Fortunately,
    transformers are easy to parallelize.


    Transformers are easy to parallelize because they take a fixed-length sequence
    of word or image tokens as input. For instance, the self-attention mechanism used
    in most transformer architectures involves computing the weighted sum between
    each input element to each other input element. Furthermore, these pair-wise token
    comparisons can be computed independently, making the self-attention mechanism
    relatively easy to parallelize across different GPU cores.


    ![Figure 8.2. A simplified self-attention mechanism without weight parameters.](resources/figures----success-attention-parallel.png)


    Figure 8.2. A simplified self-attention mechanism without weight parameters.


    In addition, the individual weight matrices used in the self-attention mechanism\[^q8-attention
    weights\] (not shown) can be distributed across different machines for distributed
    and parallel computing.


    \[^q8-attention weights\]: If you are interest in learning more about the weights
    used in self-attention and cross-attention mechanism, I recommend checking out
    my blog post *Understanding and Coding the Self-Attention Mechanism of Large Language
    Models From Scratch* at [https://sebastianraschka.com/blog/2023/self-attention-from-scratch.html](https://sebastianraschka.com/blog/2023/self-attention-from-scratch.html).


    **Reader quiz:**


    **8-A**


    Above, we discussed that self-attention is easily parallelizable. And yet, transformers
    are considered computationally expensive due to self-attention. How can we explain
    this contradiction?


    **8-B**


    Since self-attention scores represent importance weights for the various input
    elements, can we consider self-attention a form of feature selection?


    ## Q9. Generative AI Models


    **\> Q:**


    What are the popular categories of deep generative models in deep learning (also
    called *generative AI*), and what are their respective downsides?


    **\> A:**


    There are many different types of deep generative models that have been applied
    to generating different types of media: images, videos, text, and audio. Going
    beyond these types of media, models can also be repurposed to generate domain-specific
    data, for example, organic molecules and protein structures. But first, we have
    to define the term *generative modeling*. Then we can go over each type of generative
    model and discuss its strenghts and weaknesses.


    **Generative versus discriminative modeling**


    In traditional machine learning, there are two primary approaches to modeling
    the relationship between input data (*x*) and output labels (*y*): generative
    models and discriminative models. Generative models aim to capture the underlying
    probability distribution of the input data *p(x)* or the joint distribution *p(x,
    y)* between inputs and labels. In contrast, discriminative models focus on modeling
    the conditional distribution *p(y | x)* of the labels given the inputs.'
  fmt: "\nAt the core, the mechanism underlying transformers is the self-attention\
    \ mechanism introduced with the original transformer architecture in 2017^([40](#chap46.xhtml#fn-attention-you-need-q8)).\
    \ Although originally, attention mechanisms were developed in the context of image\
    \ recognition^([41](#chap46.xhtml#fn-attention-vision)) before they were adopted\
    \ to aid the translation of long sentences in recurrent neural networks, attention\
    \ mechanisms are the fundamental mechanism of transformers. (The attention mechanisms\
    \ found in recurrent neural networks and transformers are compared in more detail\
    \ in [Q17](#chap19.xhtml#q17).)\n\nWhat makes attention mechanisms so unique and\
    \ useful? Suppose we are using an encoder network that is a fixed-length representation\
    \ of the input sequence or image – this can be a fully connected, convolutional,\
    \ or attention-based encoder.\n\nIn a transformer, the encoder uses self-attention\
    \ mechanisms to compute the importance of each input token relative to other tokens\
    \ in the sequence, allowing the model to focus on relevant parts of the input\
    \ sequence. Conceptually, attention mechanisms allow the transformers to attend\
    \ to different parts of a sequence or image. On the surface, this sounds very\
    \ similar to a fully connected layer (or special cases of convolutional layers^([42](#chap46.xhtml#fn-q12-equivalence)))\
    \ where each input element is connected via a weight with each other input element\
    \ in the next layer.\n\nIn attention mechanisms, the computation of the attention\
    \ weights involves comparing each input element to the other. The attention weights\
    \ obtained by this approach are dynamic and input dependent. In contrast, the\
    \ weights of a convolutional or fully connected layer are fixed after training.\n\
    \n![Figure 8.1. Illustration of the conceptual difference between model weights\
    \ in fully connected layers and attention scores.](resources/figures----success-transformer-attention.png)\n\
    \nFigure 8.1. Illustration of the conceptual difference between model weights\
    \ in fully connected layers and attention scores.\n\nAttention mechanisms allow\
    \ a neural network to selectively weigh the importance of different input features,\
    \ allowing the model to focus on the most relevant parts of the input for a given\
    \ task.\n\n### Pretraining via self-supervised learning\n\nPretraining transformers\
    \ via self-supervised learning on large, unlabeled datasets is another key factor\
    \ in the success of transformers.\n\nDuring pretraining, the transformer model\
    \ is trained to predict missing words in a sentence or the next sentence in a\
    \ document, for example. By learning to predict these missing words or the next\
    \ sentence, the model is forced to learn general representations of language that\
    \ can be finetuned for a wide range of downstream tasks.\n\nHowever, while unsupervised\
    \ pretraining has been highly effective for natural language processing tasks,\
    \ its effectiveness for computer vision tasks is still an active area of research.\
    \ (Please refer to [Q2](#chap13.xhtml#q2) for a more detailed discussion of self-supervised\
    \ learning.)\n\n### Large numbers of parameters\n\nOne noteworthy characteristic\
    \ of transformers is their large model sizes. For example, the popular 2020 GPT-3\
    \ model consists of 175 billion trainable parameters, and other transformers,\
    \ such as Switch Transformers have trillions of parameters^([43](#chap46.xhtml#fn-switch-transformer)).\n\
    \nThe scale and number of trainable parameters of transformers are essential factors\
    \ in their modeling performance, particularly for large-scale natural language\
    \ processing tasks. For instance, linear scaling laws^([44](#chap46.xhtml#fn-old-scaling-laws))\
    \ describe that the training loss improves proportionally to the model size –\
    \ a two-times size increase in model size can half the training loss, which then\
    \ translates to a better modeling performance on the downstream target task.\n\
    \nHowever, it is essential to scale the model size and the number of training\
    \ tokens equally. This means the number of training tokens should be doubled for\
    \ every doubling of model size^([45](#chap46.xhtml#fn-new-scaling-laws)). However,\
    \ since labeled data is limited, utilizing large amounts of data during unsupervised\
    \ pretraining is vital.\n\nTo summarize, large model sizes and large datasets\
    \ are critical factors in transformers’ success. Additionally, using self-supervised\
    \ learning, the ability to pretrain transformers is closely tied to using large\
    \ model sizes and large datasets. This combination has been critical in enabling\
    \ the success of transformers in a wide range of natural language processing tasks.\n\
    \n### Easy parallelization\n\nAs mentioned above, transformers require large amounts\
    \ of parameters and data to achieve their breakthrough modeling performances.\
    \ However, training such large models on large datasets requires vast computational\
    \ resources, and it’s key that the computations can be parallelized to utilize\
    \ these resources. Fortunately, transformers are easy to parallelize.\n\nTransformers\
    \ are easy to parallelize because they take a fixed-length sequence of word or\
    \ image tokens as input. For instance, the self-attention mechanism used in most\
    \ transformer architectures involves computing the weighted sum between each input\
    \ element to each other input element. Furthermore, these pair-wise token comparisons\
    \ can be computed independently, making the self-attention mechanism relatively\
    \ easy to parallelize across different GPU cores.\n\n![Figure 8.2. A simplified\
    \ self-attention mechanism without weight parameters.](resources/figures----success-attention-parallel.png)\n\
    \nFigure 8.2. A simplified self-attention mechanism without weight parameters.\n\
    \nIn addition, the individual weight matrices used in the self-attention mechanism[`^q8-attention\
    \ weights]` (not shown) can be distributed across different machines for distributed\
    \ and parallel computing.\n\n`^q8-attention weights`: If you are interest in learning\
    \ more about the weights used in self-attention and cross-attention mechanism,\
    \ I recommend checking out my blog post *Understanding and Coding the Self-Attention\
    \ Mechanism of Large Language Models From Scratch* at [https://sebastianraschka.com/blog/2023/self-attention-from-scratch.html](https://sebastianraschka.com/blog/2023/self-attention-from-scratch.html).\n\
    \n**Reader quiz:**\n\n**8-A**\n\nAbove, we discussed that self-attention is easily\
    \ parallelizable. And yet, transformers are considered computationally expensive\
    \ due to self-attention. How can we explain this contradiction?\n\n**8-B**\n\n\
    Since self-attention scores represent importance weights for the various input\
    \ elements, can we consider self-attention a form of feature selection?\n\n##\
    \ Q9. Generative AI Models\n\n**>> Q:**\n\n are the popular categories of deep\
    \ generative models in deep learning (also called *generative AI*), and what are\
    \ their respective downsides?\n\n**\\> A:**\n\nThere are many different types\
    \ of deep generative models that have been applied to generating different types\
    \ of media: images, videos, text, and audio. Going beyond these types of media,\
    \ models can also be repurposed to generate domain-specific data, for example,\
    \ organic molecules and protein structures. But first, we have to define the term\
    \ *generative modeling*. Then we can go over each type of generative model and\
    \ discuss its strenghts and weaknesses.\n\n### Generative versus discriminative\
    \ modeling\n\nIn traditional machine learning, there are two primary approaches\
    \ to modeling the relationship between input data (*x*) and output labels (*y*):\
    \ generative models and discriminative models. Generative models aim to capture\
    \ the underlying probability distribution of the input data `p(x)` or the joint\
    \ distribution `p(x, y)` between inputs and labels. In contrast, discriminative\
    \ models focus on modeling the conditional distribution `p(y | x)` of the labels\
    \ given the inputs.\n"
  trans: '


    从核心来说，Transformer 的底层机制是 2017 年在原始 Transformer 架构中引入的自注意力机制^(40)。虽然注意力机制最初是在图像识别^(41)
    的背景下开发的，随后才被用于辅助循环神经网络中的长句翻译，但注意力机制是 Transformer 的基础机制。（循环神经网络和 Transformer 中发现的注意力机制在
    Q17 中 了更详细的比较。）


    是什么让注意力机制如此独特且有用？假设我们正在使用一个对输入序列或图像进行固定长度表示的编码器网络——这可以是全连接、卷积或基于注意力机制的编码器。


    在 Transformer 中，编码器使用自注意力机制来计算每个输入标记（token）相对于序列中其他标记的重要性，从而允许模型关注输入序列的相关部分。从概念上讲，注意力机制允许
    Transformer 关注序列或图像的不同部分。从表面上看，这听起来非常像全连接层（或卷积层的特殊情况^(42)），其中每个输入元素通过权重与下一层中的每个输入元素连接。


    在注意力机制中，注意力权重的计算涉及将每个输入元素与其他进行比较。通过这种方法获得的注意力权重是动态的且依赖输入的。相比之下，卷积层或全连接层的权重在训练后是固定的。


    ![图 8.1. 全连接层模型权重与注意力评分之间概念差异的图。](img/figures----success-transformer-attention.png)


    图 8.1. 全连接层模型权重与注意力评分之间概念差异的图。


    注意力机制允许神经网络选择性地权不同输入特征的重要性，允许模型关注给定任务中输入中最相关的部分。


    ### 通过自监督学习进行预训练


    在大规模、无标记数据集上通过自监督学习预训练 Transformer 是 Transformer 成功的另一个关键因素。


    在预训练期间，Transformer 模型被训练用于预测句子中缺失的单词或文档中的下一个句子（例如）。通过学习预测这些缺失单词或下一个句子，模型被迫学习语言的通用表示，这些表示可以针对广泛的下游任务进行微调。


    然而，虽然无监督预训练在自然语言处理任务中非常有效，但它在计算机视觉任务中的有效性仍然是一个活跃领域。（请参阅 Q2 关于自监督学习的更详细讨论。）


    ### 大量参数


    Transformer 的一个值得注意的特征是其巨大的模型尺寸。例如，流行的 2020 GPT-3 模型包含 1750 亿可训练参数，其他 Transformer（如
    Switch Transformers）拥有数万亿参数^(43)。


    Transformer 的规模和可训练参数的数量是其建模性能的要素因素，特别是对于大规模自然语言处理任务。例如，线性缩放法则^(44) 描述了训练损失随模型大小比例地提高——模型大小增加一倍可以使训练损失减半，从而转化为下游目标任务上更好的建模性能。


    然而，等比例扩展模型大小和训练标记的数量至关重要。这意味着模型大小每增加一倍，训练标记的数量也应该增加一倍^(45)。但是，由于标记数据有限，在无监督预训练期间利用大量数据是至关重要的。


    总结来说，大模型尺寸和大型数据集是 Transformer 成功的关键因素。此外，通过使用自监督学习，预训练 Transformer 的能力与使用大模型尺寸和数据集密切相关。这种结合对于使
    Transformer 在广泛的自然语言处理任务中成功至关重要。


    ### 易并行化


    如上所述，Transformer 需要大量的参数和数据来实现其突破性的建模性能。然而，在大规模数据集上训练此类大型模型需要巨大的计算资源，而计算能够并行化以利用这些资源是关键。幸运的是，Transformer
    很容易并行化。


    Transformer 很容易并行化是因为它们将固定长度的单词或图像标记序列作为输入。例如，大多数 Transformer 架构使用的自注意力机制涉及计算每个输入元素与其他每个输入元素之间的加权和。此外，这些成对的标记比较可以独立计算，使得自注意力机制在不同的
    GPU 核心之间相对容易并行化。


    ![图 8.2. 不带权重参数的简化自注意力机制。](img/figures----success-attention-parallel.png)


    图 8.2. 不带权重参数的简化自注意力机制。


    此外，自注意力机制中使用的单个权重矩阵[`^q8-attention weights]`（未显示）可以分布在不同的机器上进行分布式和并行计算。


    `^q8-attention weights`: 如果你对学习更多关于自注意交叉注意力机制中使用的权重感兴趣，我推荐查看我的博客文章 *从零理解并编码大语言模型的自注意力机制*，[`sebastianraschka.com/blog/2023/self-attention-from-scratch.html`](https://sebastianraschka.com/blog/2023/self-attention-from-scratch.html)。


    **读者测验：**


    **8-A**


    上面我们讨论了自注意力是于并行的。然而，Transformer 由于自注意力而被认为开销很大。我们如何解释这种矛盾？


    **8-B**


    由于注意力评分代表了各种输入元素的重要性权重，我们可以将自注意力视为特征选择的一种形式吗？


    ## Q9. 生成式 AI 模型


    **>> Q:**


    深度学习中流行的深度生成式模型类别（也称为*生成式 AI*）有哪些，它们各自的缺点是什么？


    **\> A:**


    深度生成模型有许多不同类型，已应用于生成不同类型的媒体：图像、视频、文本和音频。除了这些媒体类型，模型还可以被重用于生成特定领域的数据，例如，有机分子和蛋白质结构。在此之前，我们必须定义*生成式建模*术语。然后我们可以介绍每种生成式模型并讨论它们的优缺点。


    ### 生成式与判别式建模


    在传统的机器学习中，建模输入数据 (*x*) 与输出标签 (*y*) 之间关系有两种主要方法：生成式模型和判别式模型。生成式模型旨在捕捉输入数据的底层概率分布
    `p(x)` 或输入与标签之间的联合分布 `p(x, y)`。相比之下，判别式模型侧重于对给定输入的标签条件分布 `p(y | x)`。


    '
