    ### 自监督学习在什么时候有用？


    大型神经网络需要大量的标记数据来执行和泛化。然而，通过自监督学习，我们可以利用未标记的数据。（这些方法存在^67）。


    自监督学习不用的其他场景是使用随机森林或梯度提升等非参数模型进行传统机器学习。这些方法没有固定结构（对比权重矩阵）。


    ### 自监督学习的主要类别有哪些？


    自监督学习主要有两个类别：(1) 自预测（self-prediction）和 (2) 对比自监督学习（contrastive self-supervised
    learning）。


    在预测中，我们通常改变或隐藏输入的一部分，并训练模型重建原始输入。


    ![图 2.3. 应用扰动掩码后预测原始示例的任务。](img/figures----self-supervised-self-pred.png)


    图 2.3. 应用扰动掩码后预测原始示例的任务。


    一个经典的例子是去噪自编码器，它学习从图像去除噪声。或者，考虑一个掩码自编码器来重建图像的缺失部分。


    ![图 2.4. 学习从掩码图像重建原始图像的掩码自编码器。](img/figures----self-supervised-masked-autoencoder.png)


    图 2.4. 学习从掩码图像重建原始图像的掩码自编码器。


    缺失（掩码）输入自预测也常用于自然语言处理领域。许多生成式大语言模型如 GPT 都在下一个词预测代理任务上训练。在这里，我们为网络提供文本片段，让它预测序列中的下一个单词。（将在
    Q18 中更详细地介绍。）


