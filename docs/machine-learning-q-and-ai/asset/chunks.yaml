    *   虽然我们通常喜欢将自监督学习和迁移学习视为两种不同的方法，但它们并不是互斥的。例如，我们可以使用自监督学习在标记的或更大规模的无标记图像数据上对模型进行预训练（这里指的是对应于各种计算设备的数百万张无标记图像）。


    *   与其从随机权重开始，我们可以使用自监督学习得到的神经网络权重，通过数千张已标记的手机照片进行后续的迁移学习。由于手机与平板电脑具有相关性，迁移学习在这里是一个非常有前景的方法。


    *   最后，在完成自监督预训练和迁移学习后，我们可以在目标任务（即平板电脑）的数百张已标记图像上对模型进行微调。


    ### 回答 30-B


    在主动学习中，选择困难的样本进行人工检查和标注通常基于置信度评分。神经网络可以通过在输出层使用 `logistic sigmoid` 或 `softmax`
    函数来计算类别属于概率，从而提供此类评分。然而，人们公认的是，深度神经网络在分布外数据（out-of-distribution data）上表现出过度自信（12），这使得它们在主动学习中的作用失效。那么，还有哪些方法可以使用深度神经网络为主动学习获取置信度评分呢？


    除了神经网络输出层过度自信评分的缓解技术外，我们还可以考虑各种集成（ensemble）方法来获取置信度评分。例如，与其在推理期间禁用 `dropout`，我们可以利用
    `dropout` 为单个示例获取多个不同的预测结果，以计算预测标签的不确定性。


    另一个选项是使用 `k 折交叉验证`（k-fold cross-validation）从训练集的不同部分构建模型集成，正如 Q6 中集成部分讨论的那样。


    # 附录 B：问题列表


    以下是为希望在阅读本书前快速、无剧透地概述的读者提供的问题列表。


    ## 第 1 章：神经网络与深度学习


    *   **Q1.** 在深度学习中，我们经常使用 `embedding vectors`（嵌入向量）、`representations`（表示）和 `latent
    space`（潜在空间）这些术语。这些概念有什么共同点？又有什么？


    *   **Q2.** 什么是自监督学习？它什么时候有用？主要的方法分类有哪些？


    *   **Q3.** 什么是少样本学习（few-shot learning）？它与传统的监督学习训练程序相比有什么不同？


    *   **Q4.** 什么是 `lottery ticket hypothesis`（彩票假设）？如果它是真的，在实践中如何利用？


    *   **Q5.** 假设我们以监督的方式训练了一个神经网络分类器，并发现它存在过拟合问题。通过改变或增加数据，减少神经网络过拟合的常见方法有哪些？


    *   **Q6.** 假设我们以监督的方式训练了一个神经网络分类器，并且已经采用了各种与数据集相关的技术来缓解过拟合。我们如何改变模型或修改训练循环来进一步减少过拟合的影响？


    *   **Q7.** 有哪些不同的多 GPU 训练范式？它们各自的优缺点是什么？


    *   **Q8.** 导致 `transformers` 成功的主要因素有哪些？


    *   **Q9.** 深度学习（也称为 `generative AI`）中流行的深度生成模型类别有哪些？它们各自的缺点是什么？


    *   **Q10.** 在训练深度神经网络时，常见的随机性来源有哪些？它们如何导致训练和推理过程中出现不可重现的行为？


    ## 第 2 章：计算机视觉


    *   **Q11.** 我们如何计算卷积神经网络的参数数量？假设我们正在处理一个具有 2 个卷积层的卷积网络，内核大小为 5。第一个卷积层有 3 个输入通道和
    5 个输出通道。第二个卷积层有 5 个输入通道和 12 个输出通道。这些卷积层的步长（stride）为 1。


    此外，该网络有 2 个池化层，内核大小为 3，步长为 2。最后，该网络具有 192 和 128 个隐藏单元的全连接层，输出层是一个分类层。该网络的参数数量是多少？


    *   **Q12.** 在什么情况下，全连接层和卷积层是等价的？


    *   **Q13.** 为什么视觉 Transformer（ViTs）通常比卷积神经网络（CNN）更大的数据集？


    ## 第 3 章：自然语言处理


    *   **Q13.** 导致 `transformers` 成功的主要因素有哪些？


    *   **Q15.** NLP 中的分布假设是什么？


    *   **Q16.** 文本数据增强技术有哪些？


    *   **Q17.** 《Attention All You Need》论文中提出的缩放点积注意力机制通常被称为自注意力机制。它与普通注意力有什么不同？


    *   **Q18.** 基于编码器和基于解码器的 Transformer 有什么区别？


    *   **Q19.** 我们可以通过哪些不同方式使用和微调大语言模型（LLMs）？


    *   **Q20.** 评估模型生成的文本质量的标准指标有哪些？


    ## 第 4 章：生产、现实场景


    *   **Q21.** 无状态（stateless）和有状态（stateful）训练工作流的区别是什么？


    *   **Q22.** 什么是数据中心 AI（data-centric AI）？它与传统的建模范式相比如何？我们如何判断它适用于某个项目？


    *   **Q23.** 在不改变模型架构且不牺牲精度的情况下，加速模型推理的技术有哪些？


    ## 第 5 章：预测性能与模型评估


    *   **Q25.** 考虑 `Poisson regression` 和 `ordinal regression`（序回归），我们什么时候使用后者而不是前者？


    *   **Q27.** 使距离函数成为 `proper`（恰当）度量指标的三个属性是什么？


    *   **Q28.** `k 折交叉验证` 是评估机器学习分类器的常用方法，因为它让我们利用所有训练数据来模拟机器学习算法在新数据上的表现。选择较大的 `k`
    值有什么优优缺点？


    *   **Q29.** 你训练了一个模型，该模型在测试集上的表现远好于训练集。由于之前一个类似的模型配置在类似的数据集上运行良好，你怀疑数据可能存在异常。研究训练和测试集差异的方法和需要关注的问题有哪些？


