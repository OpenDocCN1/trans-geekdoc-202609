    ## Q5. Reducing Overfitting with Data


    ### **> Q:**


    Suppose we train a neural network classifier in a supervised fashion and notice
    that it suffers from overfitting. What are some of the common ways to reduce overfitting
    in neural networks through the use of altered or additional data?


    ### **> A:**


    In short, the most successful techniques for reducing overfitting revolve around
    collecting more high-quality labeled data. However, if collecting more labeled
    data is not feasible, we can augment the existing data or leverage unlabeled data
    for pretraining.


    Summarized below are the most prominent examples of dataset-related techniques
    that more or less stood the test of time. We can group these techniques into multiple
    categories discussed below.


    ### Collecting more data


    One of the best ways to reduce overfitting is to collect more (good-quality) data.
    How do we know that more data is beneficial for minimizing overfitting? We can
    plot learning curves to find out. To construct a learning curve, we train the
    model to different sizes of the training set (10%, 20%, etc.) and evaluate the
    trained model on the same fixed-size validation or test set.


    As shown in the figure below, we may observe that the validation accuracy increases
    with the increasing training set sizes. This indicates that we can improve the
    model’s performance by collecting more data.


    ![Figure 5.1. Learning curve plot of a model fit to different sizes of the training
    set.](resources/figures----learning-curve-bw.png)


    Figure 5.1. Learning curve plot of a model fit to different sizes of the training
    set.


    The gap between training and validation performance indicates the degree of overfitting
    – the more extensive gap, the more overfitting occurs. Conversely, the slope indicating
    an improvement in the validation performance suggests the model is underfitting
    and can benefit from more data.


    Typically, additional data can decrease both underfitting and overfitting.


    ### Data augmentation


    Data augmentation refers to generating new data records or features based on existing
    data. It allows for the expansion of a dataset without additional data collection.


    Data augmentation allows us to create different versions of the original input
    data, which can improve the model’s generalization performance. Why? Augmented
    data can help the model to generalize better since it makes it harder to memorize
    spurious information via training examples or features (or exact pixel values
    for specific pixel locations in the case of image data).


    Data augmentation is usually standard for image data (see figure below) and text
    data (see Q16), but data augmentation methods for tabular data exist, too.


    ![Figure 5.2. Illustration of early stopping.](resources/figures----early-stopping.png)


    Figure 5.2. Illustration of early stopping.


    Another option is to generate new, synthetic data. This falls in-between generating
    more data and data augmentation. While more common for image data and text, generating
    synthetic data is also possible for tabular datasets.


    ### Pretraining


    As discussed in the self-supervised section earlier in `Q2`, self-supervised learning
    lets us leverage large, unlabeled datasets to pretrain neural networks. This can
    help reduce overfitting on the smaller target datasets.


    As an alternative to self-supervised learning, traditional transfer learning on
    large labeled datasets are also an option. Transfer learning is most effective
    if the labeled dataset is closely related to the target domain. For instance,
    if we train a model to classify bird species, we can pretrain a network on a large,
    animal classification dataset. However, if such a large animal classification
    dataset is unavailable, we can also pretrain the model on the relatively broad
    `ImageNet` dataset.


    The dataset may be extremely small and unsuitable for supervised learning, for
    example, if there are only a handful of labeled examples per class. If our classifier
    needs to operate in a context where the collection of additional labeled data
    is not feasible, we may also consider few-shot learning.


    ### Other methods


    The list above covers the main approaches of using and modifying the dataset to
    reduce overfitting. However, the list above is not meant to be exhaustive. Other
    common techniques include


    *   feature engineering and normalization;

    *   the inclusion of adversarial examples and label or feature noise;

    *   label smoothing;

    *   smaller batch sizes;

    *   data augmentation techniques such as `Mix-Up`, `Cut-Out`, and `Cut-Mix`.


    Q6 below covers additional techniques to reduce overfitting from a model perspective
    and concludes with a discussion of which regularization techniques we should consider
    in practice.


