    ## Q29. Training and Test Set Discordance


    > **Q:**


    You trained a model that performs much better on the test dataset than on the
    training dataset. Since a similar model configuration worked well on a similar
    dataset before, you suspect something might be unusual with the data. What are
    some approaches and mitigation issues for looking into training and test discrepancies?


    > **A:**


    Before investigating the datasets in more detail, we should check for technical
    issues in the data loading and evaluation code. For instance, a simple sanity
    check is to temporarily replace the test set with the training set and to reevaluate
    the model. In this case, we should see identical training and test set performances.
    If we notice a discrepancy, we likely have a bug in the code – in my experience,
    such bugs are often related to incorrect shuffling or inconsistent (often missing)
    data normalization.

