    # 向量化 (Vectorization)


    向量化是指在单个步骤中对整个数据结构（如数组（张量）或矩阵）执行操作，而不是使用如 `for` 循环之类的迭代结构。通过使用向量化，可以使用大多数现代 CPU
    上支持的 SIMD（单指令多数据流）指令同时执行循环中的多个操作。这种方法利用了许多计算系统中的低级优化（例如 `BLAS`(4)），并且通常会显著提高速度。


    例如，假设我们想要计算两个向量之间的点积。非向量化的方法是使用 `for` 循环，逐个遍历数组的每个元素。然而，这可能非常慢，特别是对于大数组而言。通过向量化，你可以像下图所示，一次性对整个数组执行点积操作。


    ![Python 中经典 for 循环与向量化点积计算的对比插图。](img/figures----inference-optmization-vectorization.png)


    Python 中经典 for 循环与向量化点积计算的对比插图。


    在线性代数或 `TensorFlow`、`PyTorch` 等深度学习框架的背景下，向量化通常是自动完成的。这是因为这些框架设计用于处理多维数组（也称为张量），并且它们的操作在本质上是向量化的。这意味着当你使用这些框架执行函数时，会自动利用向量化的能力，从而实现更快、更高效的计算。


    # 循环分块 (Loop tiling)


    循环分块（通常称为 `loop nest optimization`^(5))是一种高级优化技术，通过将循环的迭代空间划分为更小的块或“瓦”（tiles）来增强数据局部性。这确保了一旦数据加载到缓存中，在数据被清除之前，会对其执行所有可能的计算。


    访问二维数组中元素的循环分块概念如图所示。在常规的 `for` 循环中，我们一次遍历一个元素的列和行，而在循环分块中，我们将数组细分为更小的块。


    ![二维数组循环分块的插图。](img/figures----inference-optmization-loop-tiling.png)


    二维数组循环分块的插图。


    请注意，在高级编程语言（如 `Python`）中，我们通常不执行循环分块，因为 Python 不允许像 `C` 或 `C++` 等低级语言那样控制缓存内存。在对大数组执行操作时，此类优化通常由像
    `NumPy` 或 `PyTorch` 等底层库处理。


    # 算子融合 (Operator fusion)


    算子融合（有时称为循环融合）是一种将多个循环合并为一个循环的优化技术。如图所示，计算数字数组和和乘积的两个独立循环被合并为了一个。


    ![算子融合的插图，将两个 for 循环（左侧）合并为一个（右侧）。](img/figures----inference-optmization-fusion.png)


    算子融合的插图，将两个 for 循环（左侧）合并为一个（右侧）。


    这可以通过减少循环控制的开销、通过改进缓存性能来减少内存访问时间，并可能通过向量化实现进一步的优化，从而提高模型的性能。


    这难道与之前提到的拆分 `for` 循环的循环分块概念不相矛盾吗？然而，它们是用于不同情况的互补技术。算子融合是关于将操作合并为一个；循环分块是关于在处理无法放入缓存的大型数组时提高缓存利用率。


    # 量化 (Quantization)


    量化减少了模型（特别是神经网络）的大小和计算需求。这种技术涉及将连续浮点数转换为离散整数，例如 `8-bit`(7)和 `4-bit`(8)。在深度学习领域，对权重和偏置进行量化变得越来越常见。量化主要大类。例如，在训练后量化中首先使用全精度训练模型，然后对权重进行量化。而量化感知训练在训练过程中引入了量化步骤。这允许模型学习量化的影响。然而，重要的是，量化偶尔会导致模型精度下降，这就是为什么它并不完美适用于原始问题。


    # 阅读测验


    **23-A**


    Q7 涵盖了几种不同的多 GPU 训练范式以加速训练。理论上，使用多个 GPU 也可以加速推理。但在实践中，有几个原因导致这种方法通常并不高效或实际。你能想出这些原因吗？


    **23-B**


    向量化和循环分块（或循环阻塞）是优化涉及数组元素的元素的两种不同策略。你会在什么情况下使用哪一个？


    '
