- raw: 'Also, managing multiple GPUs means higher equipment and energy costs. In practice,
    optimizing models for single-GPU or CPU performance is usually more worthwhile.
    If multiple GPUs are available, processing multiple samples in parallel on separate
    GPUs often makes more sense than processing the same sample via multiple GPUs.


    **Answer 23-B**


    *Vectorization and loop tiling (or loop blocking) are two different strategies
    for optimizing operations that involve accessing array elements. When would you
    use which?*


    Loop tiling is often combined with vectorization. For example, after applying
    loop tiling, each tile can be processed using vectorized operations. This allows
    us to use SIMD instructions on data that is already in the cache, increasing the
    effectiveness of both techniques.


    **Chapter 5. Predictive Performance and Model Evaluation**


    **Answer 25-A**


    *Suppose we want to predict the number of goals a soccer player will score in
    a particular season. Is this a problem that can be solved using ordinal regression
    or Poisson regression?*


    If we try to predict the number of goals a player scores (based on data from past
    seasons, for example), it’s a Poisson regression problem. On the other hand, we
    could also apply an ordinal regression model to the different players to rank
    them by the number of goals they will score. However, since the goal difference
    is constant and can be quantified (for example, the difference between 3 and 4
    goals is the same as 15 and 16 goals), it’s not an ideal problem for an ordinal
    regression model.


    **Answer 25-B**


    *Suppose you asked someone to sort the last three movies they have watched based
    on their order of preference. Ignoring the fact that this dataset is a tad to
    small for machine learning, what approach would be best suited for this kind of
    data?*


    This is a ranking issue that resembles an ordinal regression issue, but there
    are some differences. Since we are only aware of the relative order of the movies,
    a pairwise ranking algorithm might be a more appropriate solution than an ordinal
    regression model.


    However, if the person is asked to assign numerical labels to each movie on a
    scale, such as 1 to 5 (similar to the star rating system on Amazon), then it would
    be possible to train and use an ordinal regression model on this type of data.


    **Answer 27-A**


    *Suppose we consider using the mean absolute error (MAE) as an alternative to
    the root mean square error (RMSE) for measuring the performance of a machine learning
    model, where*


    ![\\mathrm{MAE}=\\frac{1}{n} \\sum\_{i=1}^n\\left|y^{(i)} - \\hat{y}^{(i)}\\right|](resources/leanpub_equation_139.png)


    *and*


    ![\\mathrm{RMSE}= \\sqrt{\\frac{1}{n} \\sum\_{i=1}^n\\left(y^{(i)} - \\hat{y}^{(i)}\\right)^2}.](resources/leanpub_equation_140.png)


    *However, a colleague argues that the MAE is not a proper distance metric in metric
    space because it involves an absolute value, so we should prefer using the RMSE.
    Is this argument correct?*


    Since the MAE is based on an absolute value around the distance, it naturally
    satisfies the first criterion: it can’t be negative. Also, the MAE is the same
    if we swap the values ![y](resources/leanpub_equation_141.png)and ![\\hat{y};](resources/leanpub_equation_142.png)hence,
    it satisfies the second criterion. How about the triangle inequality? Similar
    to how the RMSE is the same as the Euclidean distance or L2 norm, the MAE is similar
    to the L1 norm between two vectors. Since all vector norms satisfy the triangle
    inequality^([10](#chap46.xhtml#fn-matrix-analysis)), our colleague is incorrect.


    Furthermore, even if the MAE were not a proper metric, it can still be a useful
    model evaluation metric; for example, consider the classification accuracy.


    **Answer 27-B**


    *Based on your answer to **27-A**, would you say that the MAE is better than the
    RMSE, or vice versa?*


    The MAE assigns equal weight to all errors, while the RMSE places more emphasis
    on errors with larger absolute values due to the quadratic exponent. As a result,
    the RMSE is always larger than the MAE. However, no metric is universally better
    than the other, and they have both been used to assess model performance in countless
    studies over the years^([11](#chap46.xhtml#fn-mae-article)).


    **Answer 28-A**


    *To provide the model with as much training data, we consider using leave-one-out
    cross-validation (LOOCV). LOOCV is a special case of k-fold cross-validation where
    k is equal to the number of training examples such that the validation folds only
    contain a single data point. A colleague mentions that LOOCV is defect for discontinuous
    loss function and performance measures such as classification accuracy. For instance,
    for a validation fold consisting of only one example, the accuracy is always either
    0 (0%) or 1 (99%). Is this really a problem?*


    This is not a problem if we only care about the average performance. For example,
    If we have a dataset of 100 training examples, and the model predicts 70 out of
    the 100 validation folds correctly, we estimate the model accuracy as 70%. However,
    suppose we are interested in analyzing the variance of the estimates from the
    different folds. In that case, LOOCV is not very useful since each fold only consists
    of a single training example, so we cannot compute the variance of each fold and
    compare it to other folds.


    **Answer 28-B**


    *We discussed model selection and model evaluation as two use cases of k-fold
    cross-validation. Can you think of other use cases?*


    Another use case of *k*\-fold cross-validation is model ensembling. For example,
    in 5-fold cross-validation, we train five different models since we have five
    slightly different training sets. However, instead of training a final model on
    the whole training set, we can combine the five models into a model ensemble (this
    is particularly popular on Kaggle). See Figure 18 in Q6 for an illustration of
    this process.


    **Answer 29-A**


    *What is a good performance baseline for the adversarial prediction task?*


    As a performance baseline, it’s a good idea to implement a zero-rule classifier,
    i.e., a majority class classifier. Since we typically have more training than
    test data, we can compute the performance of a model that always predicts “Is
    test? False”, which should result in 70% accuracy if we have partitioned the original
    dataset into 70% training data and 30% test data. If the of the model trained
    on the adversarial validation dataset exceeds this baseline noticeably (say 80%),
    then we may have a serious discrepancy issue to investigate further.


    **Answer 29-B**


    *Since training datasets are often bigger than test datasets, adversarial validation
    often results in an imbalanced prediction problem (we have more examples with
    “*Is test?*” equal to false. Is this an issue, and if so, how can we mitigate
    that?*


    Overall, this is not a big issue since we are mainly interesting if there is a
    strong deviation from a random baseline. I.e., if we compare the accuracy of the
    adversarial validation model against the baseline (rather than 50% accuracy) then
    there should be no issue. However, it may be even better to consider evaluation
    metrics like Matthew’s correlation coefficient or ROC or precision-recall area-under-the-curve
    values instead of classification accuracy.


    **Answer 30-A**


    *Given the task of constructing a machine learning model that utilizes images
    to detect manufacturing defects on the outer shells of tablet devices similar
    to iPads, we have access to the following data:*


    *   *Millions of images of various computing devices, including smartphones, tablets,
    and computers, which are not labeled.*


    *   *Thousands of labeled pictures of smartphones depicting various types of damage.*


    *   *Hundreds of labeled images specifically related to the target task of detecting
    manufacturing defects on tablet devices.*


    *How could we approach this problem using self-supervised learning or transfer
    learning?*'
