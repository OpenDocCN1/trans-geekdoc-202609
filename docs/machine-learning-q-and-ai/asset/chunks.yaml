- raw: "The pruning steps 2-4 are then repeated until the desired network size is\
    \ reached. For example, in the original lottery ticket hypothesis paper, the authors\
    \ successfully reduced the network to 10% of its original size without sacrificing\
    \ classification accuracy. As a nice bonus, the pruned (sparse) network, referred\
    \ to as the winning ticket, even demonstrated improved generalization performance\
    \ compared to the original (large and dense) network.\n\n**Practical implications\
    \ and limitations**\n\nSuppose it is possible to identify smaller subnetworks\
    \ that have the same predictive performance as their up to 10x larger counterparts.\
    \ In that case, this can have significant implications for both neural training\
    \ and inference. Given the ever-growing size of modern neural network architectures,\
    \ this can help with cutting training costs and the infrastructure required for\
    \ training. Additionally, smaller networks are more cost-effective and have lower\
    \ latency when used for inference, making them a valuable option for many applications.\n\
    \nSounds too good to be true? Maybe. If the *winning tickets* can be identified\
    \ efficiently, this would be very useful in practice. However, as of this writing,\
    \ there is no way to find the *winning tickets* without training the original\
    \ network. If we include the pruning steps, this is even more expensive than a\
    \ regular training procedure. Moreover, it was later found that the original weight\
    \ initialization may not work for finding *winning tickets* for larger-scale networks,\
    \ and additional experimentation with the initial weights of the pruned networks\
    \ is required^([15](#chap46.xhtml#fn-weight-init-k)).\n\nHowever, the good news\
    \ is that *winning tickets* do exist, and even if it’s currently not possible\
    \ to identify these without training their larger neural network counterparts,\
    \ they can be used for more efficient inference after training.\n\n**\\> Reader\
    \ quiz:**\n\n**4-A**\n\nSuppose you are trying out the lottery ticket hypothesis\
    \ approach and find that the performance of the subnetworks is not very good (compared\
    \ to the original network). What are some next steps to try?\n\n**4-B**\n\nHow\
    \ is the lottery ticket hypothesis related to training a neural network with ReLU\
    \ activation functions (a ReLU activation function is defined as max(0, x)?\n\n\
    ## Q5. Reducing Overfitting with Data\n\n**\\> Q:**\n\nSuppose we train a neural\
    \ network classifier in a supervised fashion and notice that it suffers from overfitting.\
    \ What are some of the common ways to reduce^([16](#chap46.xhtml#fn-reduce-prevent))\
    \ overfitting in neural networks through the use of altered or additional data?^([17](#chap46.xhtml#fn-q30-q5))\n\
    \n**\\> A:**\n\nIn short, the most successful techniques for reducing overfitting\
    \ revolve around collecting more high-quality labeled data. However, if collecting\
    \ more labeled data is not feasible, we can augment the existing data or leverage\
    \ unlabeled data for pretraining.\n\nSummarized below are the most prominent examples\
    \ of dataset-related techniques that more or less stood the test of time. We can\
    \ group these techniques into multiple categories discussed below.\n\n**Collecting\
