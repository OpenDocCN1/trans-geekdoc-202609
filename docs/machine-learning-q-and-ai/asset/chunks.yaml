    Suppose we don’t have access to a GPU and are considering using data parallelism
    on the CPU. Is this a good idea?


    Data parallelism could conceptually work on a CPU, but the benefits would be limited.
    For example, instead of duplicating the model in CPU memory to train multiple
    models on different batches of the dataset in parallel, it could make more sense
    to increase the data throughput.


    ### Answer 8-A


    Above, we discussed that self-attention is easily parallelizable. And yet, transformers
    are considered computationally expensive due to self-attention. How can we explain
    this contradiction?


    Self-attention has quadratic compute and memory complexity due to the `n`-to-`n`
    comparisons (where `n` is the input sequence length), which makes transformers
    computationally costly compared to other neural network architectures. Moreover,
    decoder-style transformers such as `GPT` generate outputs one token at a time,
    which cannot be parallelized during inference – although generating each token
    is still highly parallelizable as discussed above.


    ### Answer 8-B


    Since self-attention scores represent importance weights for the various input
    elements, can we consider self-attention a form of feature selection?


    Yes, we can think of self-attention as a form of feature selection, although there
    are differences between this and other types of feature selection. It is important
    to differentiate between hard and soft attention in this context. Soft attention
    computes importance weights for all inputs, whereas hard attention selects a subset
    of the inputs. Hard attention is more like masking, where certain inputs are set
    to `0` or `1`, while soft attention allows for a continuous range of importance
    scores.


    However, the main difference between attention and feature selection is that feature
    selection is typically a fixed operation, while attention weights are computed
    dynamically based on the input. With feature selection algorithms, the selected
    features are always the same, whereas, with attention, the weights can change
    based on the input.


    ### Answer 9-A


    How would you evaluate the quality of the images generated by an generative AI
    model?


    Automating this evaluation is inherently difficult, and the gold standard is currently
    human evaluation and judgment. However, a few metrics exist as quantitative measures.


    To evaluate the diversity of the generated images, one can compare the distribution
    between the conditional class distribution and the marginal class distribution
    of generated samples, for example, using a Kullback-Leibler divergence, which
    is a measure that is also used in the `VAE` to make the latent space vectors similar
    to a standard Gaussian. The higher the `KL`, the more diverse the generated images.


    One can also compare the statistics of generated images to real images in the
    feature space of a pre-trained model. A low similarity indicates that the two
    distributions are close to each other, which is generally a sign of better image
    quality. This approach is also often known as `Fréchet Inception Distance`.


    ### Answer 9-B


    Given the description of consistency models above, how would you use them to generate
    new images?


    Like the generators of `GANs`, `VAEs`, or diffusion models, a consistency model
    takes a noise tensor sampled from a simple distribution (such as a standard Gaussian)
    as input and generates a new image.


    ### Answer 10-A


    Suppose we trained a neural network with `top-k` or nucleus sampling where `k`
    and `p` are hyperparameter choices. Can we make the model behave deterministically
    during inference without changing the code?


    Yes, we can make `top-k` sampling deterministic by setting `k=1` so that the model
    will always select the word with the highest probability score as the next word
    when generating the output text.


    We can also make nucleus sampling deterministic, for instance, by setting the
    probability mass threshold `p` to `1`. By setting `p` to `1`, you include the
    entire probability distribution of the tokens in the nucleus. This would make
    the model always choose the token with the highest probability.


    ### Answer 10-B


    Can you think of scenarios where deterministic dropout behavior during inference
    is desired?


    In some cases, the random behavior of dropout during inference can be desirable
    for building model ensembles.


    ### Answer 11-A


    Suppose we want to optimize the neural network using plain stochastic gradient
    descent (`SGD`) or an `Adam` optimizer. What are the respective numbers of parameters
    that need to be stored for `SGD` and `Adam`?


    `SGD` only has the learning rate as a hyperparameter, but it does not have any
    parameters. So, it does not add any additional parameters to be stored besides
    the gradients calculated for each weight parameter during backpropagation.


    The `Adam` optimizer is more complex and requires more storage. Specifically,
    `Adam` keeps an exponentially decaying average of past gradients (first moment)
    and an exponentially decaying average of past squared gradients (second moment).


    ### Answer 11-B


    Suppose we are adding three batch normalization (`BatchNorm`) layers: one after
    the first convolutional layer, one after the second convolutional layer, and another
    after the first connected layer – we do not want to add BatchNorm layers to the
    output layer. How many additional parameters do these three BatchNorm layers add
    to the model?


    Each `BatchNorm` layer learns two sets of parameters: a set of scaling coefficients
    (`gamma`) and a set of shifting coefficients (`beta`). These are learned so that
    the model can undo the normalization when it is found to be detrimental to learning.


    Each of these sets of parameters (`gamma` and `beta`) has the same size as the
    number of channels (or neurons) in the layer they normalize because these parameters
    are learned separately for each channel (or neuron).


    So, for the first `BatchNorm` layer following the first convolutional layer with
    `5` output channels, this adds `10` additional parameters. For the second `BatchNorm`
    layer, following the second convolutional layer with `12` output channels, this
    adds `24` additional parameters.


    The first connected layer has `128` output channels, which means `256` additional
    `BatchNorm` parameters. The second connected layer is not accompanied by a `BatchNorm`
    layer since it’s the output layer.


    So, `BatchNorm` adds `10 + 24 + 256 = 290` additional parameters to the network.

