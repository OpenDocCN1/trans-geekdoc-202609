  trans: '


    考虑上图所示的输入图像补块化（patchification）。生成的补块的大小控制了计算性能与预测性能之间的权衡。最佳补块大小取决于具体的应用以及计算成本与模型性能之间所需的权衡。通常，较小的补块会导致更高或更低的计算成本？


    使用较小的补块会增加给定输入图像的补块数量，导致有更多的 token 被输入 transformer。这会导致计算复杂性的增加，因为 transformer
    中的自注意力机制相对于输入 token 的数量呈二次方复杂度。因此，较小的输入补块会让模型在计算上更加昂贵。


    ### 回答 13-B


    接上上述问题，较小的补块通常会导致更高或更低的预测精度？


    使用较大的输入补块可能会导致输入图像中精细细节和局部结构的丢失，这可能会对模型的预测性能产生负面影响。感兴趣的读者可能会喜欢 `FlexiViT`^(5)论文，它研究了补块大小和数量导致的计算与预测性能权衡。


    ### 第 3 章 自然语言处理


    ### 回答 15-A


    考虑同音词的情况——读音相同但含义不同的词。例如，单词 `there` 和 `their` 读音相同但含义不同。同音词是分布假设不成立的另一个例子吗？


    同音词是指拼写不同但读音相同且含义不同的词。由于含义不同，我们预期两个同音词会出现在不同的语境中。例如，“I can see you over there”和“Their
    paper is very nice.”


    由于分布假设认为含义相似的词应该出现在相似的语境中，因此同音词并不矛盾于分布


    ### 回答 15-B


    你还能想出其他适用类似于分布假设概念的领域吗？


    分布假设的核心思想可以应用于其他领域，例如计算机视觉。在图像情况下，出现在相似视觉语境中的物体可能在语义上是相关的。或者，在更低的层面上，相邻的像素可能在语义上是相关的，因为它们是同一个物体的一部分——这个思想被用于图像数据的掩码自编码以自监督学习^(6)。


    另一个例子是蛋白质建模。例如，研究人员展示^(7)，在蛋白质序列上训练的语言 transformer（一种字符串表示，其中每个字母代表氨基酸，例如，“MNGTEGPNFYVPFSNKTGVV…”）学习到的嵌入向量使得相似的氨基酸聚集在一起。例如，诸如
    V、I、L 和 M 等疏水性氨基酸出现在一个簇中，而诸如 F、W 和 Y 等芳香族氨基酸出现在另一个簇中。在这种语境下，我们可以将氨基酸等同于句子中的单词。


    ### 回答 16-A


    使用文本数据增强有助于解决隐私问题吗？


    假设现有数据没有受到隐私问题的困，数据增强有助于在不需要收集额外数据的情况下生成现有数据的变体，这有助于解决隐私问题。


    然而，如果原始数据包含个人身份信息，即使是增强后或合成的数据也可能被追溯到个人，特别是当增强过程未能充分掩盖或更改原始数据时。


    ### 回答 16-B


    在哪些情况下数据增强对特定任务可能没有益处？


    如果原始数据集已经足够大且多样，使得模型不会因为缺乏数据而过拟合或性能不佳，那么数据增强的益处可能较小。例如，在预训练大语言模型（LLMs）时通常此类如此。


    此外，高度领域特定的模型（例如医学、法律和金融领域）的性能可能会受到同义词替换和回译等技术的不利影响，因为这些技术会将领域术语替换为特定的含义。


    通常情况下，在对用词选择高度敏感的任务中，必须格外小心应用数据增强。


    ### 回答 17-A


    考虑到自注意力会将每个序列元素与其自身进行比较，自注意力的时间内存复杂度是多少？


    自注意力机制具有二次方的时间内存复杂度。


    更精确地说，我们可以将自注意力的时间内存复杂度表示为 ![O(N² \times d)](img/leanpub_equation_134.png)，其中
    ![N](img/leanpub_equation_135.png)是序列长度，`d` 是每个元素嵌入的维度。这是因为自注意力涉及计算序列中每对元素之间的相似性评分，产生
    ![N \times N](img/leanpub_equation_136.png)相似矩阵。该矩阵随后被用于计算序列元素的加权平均值，产生 ![N \times
    d](img/leanpub_equation_137.png)输出表示。


    这使得自注意力计算开销大且内存密集，特别是对于长序列或较大的 ![d](img/leanpub_equation_138.png) 而言。


    ### 回答 17-B


    我们在自然语言处理背景下讨论了自注意力。这种机制对计算机视觉应用也有用吗？


    是的。有趣的是，自注意力可能部分受到卷积神经网络中用于图像处理的空间注意力机制^(8)的启发。空间注意力是一种允许神经网络关注图像中与给定任务相关的特定区域的机制。它通过对图像中不同空间位置的重要性进行选择性加权，允许网络对某些区域“投入更多注意力”。


    ### 回答 18-A


    正如之前提到的，BERT 风格的编码器模型使用掩码语言模型和下一句子预测目标进行预训练。我们如何将这种预训练模型应用于分类任务，例如，预测文本是正面还是负面情感？


    如果我们想将预训练的 BERT 模型用于分类，你需要添加一个用于分类的输出层——这通常被称为分类头。


    正如讨论过的，BERT 在预训练期间使用 [CLS] 标记用于下一句子预测任务。我们不是训练它进行下一句子预测，而是为我们的目标预测任务（例如情感分类）微调一个新的输出层。


    嵌入的 [CLS] 输出向量作为整个输入序列的总结。我们可以将其视为特征向量，并在其上方训练一个小型神经网络，通常是一个全连接层后接一个 softmax 激活函数，以预测类别概率。全连接层的输出大小应与我们分类任务中的类别数量匹配。然后，我们可以像往常一样使用反向传播进行训练。不同的微调策略（更新所有层或仅更新


    ### 回答 18-B


    我们可以微调或使用像 GPT 这样的仅解码器模型进行分类吗？


    是的，我们可以针对分类任务微调或使用像 GPT 这样的仅解码器模型，尽管它的效果可能没有使用基于编码器的模型（如 BERT）有效。


    '
