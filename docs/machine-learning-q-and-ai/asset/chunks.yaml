- raw: "In short, we use Poisson regression for count data. We use ordinal regression\
    \ when we know that certain outcomes are “higher” or “lower” than others, but\
    \ we are not sure how much or if it even matters.\n\n**\\> Reader quiz:**\n\n\
    **25-A**\n\nSuppose we want to predict the number of goals a soccer player will\
    \ score in a particular season. Is this a problem that can be solved using ordinal\
    \ regression or Poisson regression?\n\n**25-B**\n\nSuppose you asked someone to\
    \ sort the last three movies they have watched based on their order of preference.\
    \ Ignoring the fact that this dataset is a tad to small for machine learning,\
    \ what approach would be best suited for this kind of data?\n\n## Q27. Proper\
    \ Metrics\n\n**\\> Q:**  \n\nWhat are the three properties of a distance function\
    \ that make it a *proper* metric?\n\nList the three properties of a metric space.\
    \ Then discuss whether commonly used loss functions such as mean squared error\
    \ and the cross-entropy loss are proper metrics.\n\n**\\> A:**\n\nConsider two\
    \ vectors or points ![\\\\mathbf{v}](resources/leanpub_equation_92.png)and ![\\\
    \\mathbf{w}](resources/leanpub_equation_93.png)and their distance ![d(\\\\mathbf{v},\
    \ \\\\mathbf{w}).](resources/leanpub_equation_94.png)\n\n![Figure 27.1. Euclidean\
    \ distance between two two-dimensional vectors.](resources/figures----triangle-inequality-1.png)\n\
    \nFigure 27.1. Euclidean distance between two two-dimensional vectors.\n\nThe\
    \ criteria of a proper metric are the following:\n\n1.  The distance between two\
    \ points is always non-negative ![d(\\\\mathbf{v}, \\\\mathbf{w}) \\\\geq 0.](resources/leanpub_equation_95.png)Also,\
    \ the distance can only be zero if the two points are identical, that is, ![\\\
    \\mathbf{v} = \\\\mathbf{w}.](resources/leanpub_equation_96.png)\n\n2.  The distance\
    \ is symmetric, i.e., ![d(\\\\mathbf{v}, \\\\mathbf{w}) = d(\\\\mathbf{w}, \\\\\
    mathbf{v}).](resources/leanpub_equation_97.png)\n\n3.  The distance function satisifies\
    \ the *triangle inequality* for any three points: ![\\\\mathbf{v}, \\\\mathbf{w},\
    \ \\\\mathbf{x},](resources/leanpub_equation_98.png)which means that\n\n![d(\\\
    \\mathbf{v}, \\\\mathbf{w}) \\\\leq d(\\\\mathbf{v}, \\\\mathbf{x}) + d(\\\\mathbf{x},\
    \ \\\\mathbf{w}).](resources/leanpub_equation_99.png)\n\nTo get a better intuition\
    \ for the triangle inequality, think of the points as vertices of a triangle.\
    \ And if we consider any triangle, the sum of two sides is always larger than\
    \ the third.\n\n![Figure 27.2. Illustration of the triangle inequality.](resources/figures----triangle-inequality.png)\n\
    \nFigure 27.2. Illustration of the triangle inequality.\n\n**Is the mean squared\
    \ error a proper metric?**\n\nThe mean squared error loss (MSE) computes the squared\
    \ Euclidean distance between a target variable ![y](resources/leanpub_equation_100.png)and\
    \ a predicted target value ![\\\\hat{y}:](resources/leanpub_equation_101.png)\n\
    \n![\\\\mathrm{MSE}=\\\\frac{1}{n} \\\\sum\\_{i=1}^n\\\\left(y^{(i)} - \\\\hat{y}^{(i)}\\\
    \\right)^2.](resources/leanpub_equation_102.png)\n\nThe index ![i](resources/leanpub_equation_103.png)denotes\
    \ the ![i\\\\text{-th}](resources/leanpub_equation_104.png)datapoint in the dataset\
    \ or sample. For simplicity, we will consider the squared error (SE) loss between\
    \ two data points (however, the insights below also hold for the MSE):\n\n![\\\
    \\mathrm{SE}(y, \\\\hat{y})=\\\\left(y - \\\\hat{y}\\\\right)^2.](resources/leanpub_equation_105.png)\n\
    \n**Criterion 1.** The SE satisfies the first part of the first criterion: *The\
    \ distance between two points is always non-negative.* Since we are raising the\
    \ difference to the power of 2, it cannot be negative.\n\n**Criterion 2.** How\
    \ about the second criterion, *the distance can only be zero if the two points\
    \ are identical*? Due to the subtraction in the SE, it is intuitive to see that\
    \ it can only be 0 if the prediction matches the target variable, ![y = \\\\hat{y}.](resources/leanpub_equation_106.png)\n\
    \nWe saw tha the SE satisfies the first criterion of a proper metric, and we can\
    \ again use the *square* to confirm that it also satisfies the second criterion,\
    \ *the distance is symmetric*. Due to the square, we have ![\\\\left(y - \\\\\
    hat{y}\\\\right)^2 = \\\\left(\\\\hat{y} - y\\\\right)^2.](resources/leanpub_equation_107.png)\n\
    \n**Criterion 3.** At first glance, it seems that the squared error loss also\
    \ satisfies the triangle inequality. Intuitively, you can check this by choosing\
    \ three arbitrary numbers (here: 1, 2, 3):\n\n1.  ![(1-2)^{2} \\\\leq (1-3)^{2}\
    \ + (2-3)^{2}](resources/leanpub_equation_108.png)\n\n2.  ![(1-3)^{2} \\\\leq\
    \ (1-2)^{2} + (2-3)^{2},](resources/leanpub_equation_109.png)\n\n3.  ![(2-3)^{2}\
    \ \\\\leq (1-2)^{2} + (1-3)^{2}.](resources/leanpub_equation_110.png)\n\nHowever,\
    \ there are values where this is not true, for example ![d(a,c) = 4, \\\\; d(a,b)\
    \ = 2, \\\\; \\\\text{ and } d(b,c) = 3](resources/leanpub_equation_111.png),\
    \ where ![4^2 \\\\lneq = 2^2 + 3^2.](resources/leanpub_equation_112.png)^([2](#chap46.xhtml#fn-ex-chai))\
    \ the triangle inequality does not hold.\n\nIn contrast, the root-mean squared\
    \ error does satisfy the triangle inequality, and the example above works out:\
    \ ![4 \\\\lneq 2 + 3.](resources/leanpub_equation_113.png)\n\nThe root-squared\
    \ error ![\\\\sqrt{\\\\left(y - \\\\hat{y}\\\\right)^2}](resources/leanpub_equation_114.png)is\
    \ essentially the same as the ![L\\_2](resources/leanpub_equation_115.png)or Euclidean\
    \ distance between two points, which is known to satisfy the triangle inequality^([3](#chap46.xhtml#fn-euclidean-wiki)).\n\
    \nSince it does not satisfy the triangle inequality via the example above, we\
    \ conclude that the (mean) squared error loss is not a proper metric while the\
    \ root-mean squared error (or Euclidean distance) is a proper metric.\n\n**Is\
    \ the cross-entropy loss a proper metric?**\n\nCross-entropy is used to measure\
    \ the distance between two probability distributions. In machine learning contexts,\
    \ we use the discrete cross-entropy loss (CE) between class label *y* and the\
    \ predicted probability *p* when we train logistic regression or neural network\
    \ classifiers on a dataset consisting of *n* training examples:\n\n![\\\\mathrm{CE}(\\\
    \\mathbf{y}, \\\\mathbf{p}) = -\\\\frac{1}{n} \\\\sum\\_{i=1}^n y^{(i)} \\\\cdot\
    \ \\\\log \\\\left(p^{(i)}\\\\right).](resources/leanpub_equation_116.png)\n\n\
    Again, for simplicity, we will look at the cross-entropy function (*H*) between\
    \ only two data points:\n\n![H(y, p) = - y \\\\cdot \\\\log(p).](resources/leanpub_equation_117.png)\n\
    \n**Criterion 1.** The cross-entropy loss satisfies one part of the first criterion.\
    \ The distance is always non-negative because the probability score is a number\
    \ in the range \\[0, 1\\]. Hence, ![\\\\log(p)](resources/leanpub_equation_118.png)ranges\
    \ between ![\\-\\\\infty](resources/leanpub_equation_119.png)and 0. The important\
    \ part is that the *H* function (see above) includes a negative sign. Hence, the\
    \ cross-entropy ranges between ![\\\\infty](resources/leanpub_equation_120.png)and\
    \ 0 and thus satisfies one aspect of criterion 1.\n\nHowever, the cross entropy\
    \ loss is not zero for two identical points. For example ![H(0.9, 0.9) = - 0.9\
    \ \\\\log(0.9) = 0.095.](resources/leanpub_equation_121.png)\n\n**Criterion 2.**\
    \ The second criterion is violated by the cross-entropy loss because it’s not\
    \ symmetric: ![\\- y \\\\cdot \\\\log(p) \\\\neq - p \\\\cdot \\\\log(y).](resources/leanpub_equation_122.png)\n\
    \nLet’s illustrate this with a concrete, numeric example:\n\n![\\-1 \\\\cdot \\\
    \\log(0.5) = 0.693](resources/leanpub_equation_123.png)\n\n![\\-0.5 \\\\cdot \\\
    \\log(1) = 0.](resources/leanpub_equation_124.png)\n\n**Criterion 3.** Does the\
    \ cross-entropy loss satisfy the triangle inequality,  \n\n![H(r, p) \\\\geq H(r,\
    \ q) + H(q, p)?](resources/leanpub_equation_125.png)\n\nIt does not. We can illustrate\
    \ this with an example. Suppose we choose ![r=0.9, p=0.5, q=0.4.](resources/leanpub_equation_126.png)We\
    \ have\n\n![H(0.9, 0.5) = 0.624](resources/leanpub_equation_127.png)\n\n![H(0.9,\
    \ 0.4) = 0.825](resources/leanpub_equation_128.png)\n\n![H(0.4, 0.5) = 0.277.](resources/leanpub_equation_129.png)\n\
    \nWe can see that ![0.624 \\\\geq 0.825 + 0.277](resources/leanpub_equation_130.png)does\
    \ not hold."
