    假设你正在训练一个卷积网络，它包含五个卷积层，后面跟着三个全连接（FC）层，类似于如下所示的 AlexNet^3。你可以将这些全连接层看作多层感知器中的两个隐藏层和一个输出层。


    ![图 1.4. AlexNet 的插图。](img/figures----alexnet.png)


    图 1.4. AlexNet 的插图。


