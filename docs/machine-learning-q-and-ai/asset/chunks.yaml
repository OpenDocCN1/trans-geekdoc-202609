    假设我们无法使用 GPU，正在考虑在 CPU 上使用数据并行化。这是个好主意吗？


    数据并行化在概念上可以在 CPU 上运行，但收益是有限的。例如，与其在 CPU 内存中复制模型以在数据集的不同批量上并行训练多个模型，增加数据吞吐量可能更有意义。


    ### 回答 8-A


    上面，我们讨论了自注意力机制很容易并行化。然而，由于自注意力机制，Transformer 被认为计算开销很大。我们该如何解释这种矛盾呢？


    由于存在 `n` 到 `n` 的比较（其中 `n` 是输入序列长度），自注意力机制具有平方级的计算和内存复杂度，这使得 Transformer 与其他神经网络架构相比计算成本很高。此外，解码器风格的
    Transformer（如 `GPT`）每次生成一个 token 的输出，这在推理过程中无法并行化——尽管如上所述，生成每个 token 仍然具有高度的可并行性。


    ### 回答 8-B


    由于自注意力分数代表了各种输入元素的重要性权重，我们能将自注意力机制视为一种特征选择的形式吗？


