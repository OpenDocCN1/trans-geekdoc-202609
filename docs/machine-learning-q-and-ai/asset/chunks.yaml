    In short, we use `Poisson regression` for count data. We use `ordinal regression`
    when we know that certain outcomes are “higher” or “lower” than others, but we
    are not sure how much or if it even matters.


    > **Reader quiz:**


    > **25-A**

    Suppose we want to predict the number of goals a soccer player will score in a
    particular season. Is this a problem that can be solved using `ordinal regression`
    or `Poisson regression`?


    > **25-B**

    Suppose you asked someone to sort the last three movies they have watched based
    on their order of preference. Ignoring the fact that this dataset is a tad small
    for machine learning, what approach would be best suited for this kind of data?


    ## Q27. Proper Metrics


    > **Q:**

    What are the three properties of a distance function that make it a *proper* metric?


    List the three properties of a metric space. Then discuss whether commonly used
    loss functions such as `mean squared error` and `cross-entropy loss` are proper
    metrics.


    > **A:**

    Consider two vectors or points ![\\mathbf{v}](resources/leanpub_equation_92.png)and
    ![\\mathbf{w}](resources/leanpub_equation_93.png)and their distance ![d(\\mathbf{v},
    \\mathbf{w}).](resources/leanpub_equation_94.png).


    ![Figure 27.1. Euclidean distance between two two-dimensional vectors.](resources/figures----triangle-inequality-1.png)


    Figure 27.1. Euclidean distance between two two-dimensional vectors.


    The criteria of a proper metric are the following:


    1. The distance between two points is always non-negative ![d(\\mathbf{v}, \\mathbf{w})
    \\geq 0.](resources/leanpub_equation_95.png)Also, the distance can only be zero
    if the two points are identical, that is, ![\\mathbf{v} = \\mathbf{w}.](resources/leanpub_equation_96.png).


    2. The distance is symmetric, i.e., ![d(\\mathbf{v}, \\mathbf{w}) = d(\\mathbf{w},
    \\mathbf{v}).](resources/leanpub_equation_97.png).


    3. The distance function satisifies the *triangle inequality* for any three points:
    ![\\mathbf{v}, \\mathbf{w}, \\mathbf{x},](resources/leanpub_equation_98.png)which
    means that


    ![d(\\mathbf{v}, \\mathbf{w}) \\leq d(\\mathbf{v}, \\mathbf{x}) + d(\\mathbf{x},
    \\mathbf{w}).](resources/leanpub_equation_99.png).


    To get a better intuition for the triangle inequality, think of the points as
    vertices of a triangle. And if we consider any triangle, the sum of two sides
    is always larger than the third.


    ![Figure 27.2. Illustration of the triangle inequality.](resources/figures----triangle-inequality.png)


    Figure 27.2. Illustration of the triangle inequality.


    **Is the mean squared error a proper metric?**


    The mean squared error loss (`MSE`) computes the squared Euclidean distance between
    a target variable ![y](resources/leanpub_equation_100.png)and a predicted target
    value ![\\hat{y}:](resources/leanpub_equation_101.png).


    ![\\mathrm{MSE}=\\frac{1}{n} \\sum\\_{i=1}^n\\left(y^{(i)} - \\hat{y}^{(i)}\right)^2.](resources/leanpub_equation_102.png).


    The index ![i](resources/leanpub_equation_103.png)denotes the ![i\\text{-th}](resources/leanpub_equation_104.png)datapoint
    in the dataset or sample. For simplicity, we will consider the squared error (`SE`)
    loss between two data points (however, the insights below also hold for the `MSE`):


    ![\\mathrm{SE}(y, \\hat{y})=\\left(y - \\hat{y}\\right)^2.](resources/leanpub_equation_105.png).


    **Criterion 1.** The `SE` satisfies the first part of the first criterion: *The
    distance between two points is always non-negative.* Since we are raising the
    difference to the power of 2, it cannot be negative.


    **Criterion 2.** How about the second criterion, *the distance can only be zero
    if the two points are identical*? Due to the subtraction in the `SE`, it is intuitive
    to see that it can only be 0 if the prediction matches the target variable, ![y
    = \\hat{y}.](resources/leanpub_equation_106.png).


    We saw tha the `SE` satisfies the first criterion of a proper metric, and we can
    again use the *square* to confirm that it also satisfies the second criterion,
    *the distance is symmetric*. Due to the square, we have ![\\left(y - \\hat{y}\\right)^2
    = \\left(\\hat{y} - y\\right)^2.](resources/leanpub_equation_107.png).


    **Criterion 3.** At first glance, it seems that the squared error loss also satisfies
    the triangle inequality. Intuitively, you can check this by choosing three arbitrary
    numbers (here: 1, 2, 3):


    1. ![(1-2)^{2} \\leq (1-3)^{2} + (2-3)^{2}](resources/leanpub_equation_108.png)

    2. ![(1-3)^{2} \\leq (1-2)^{2} + (2-3)^{2},](resources/leanpub_equation_109.png)

    3. ![(2-3)^{2} \leq (1-2)^{2} + (1-3)^{2}.](resources/leanpub_equation_110.png)


    However, there are values where this is not true, for example ![d(a,c) = 4, \\;
    d(a,b) = 2, \\; \\text{ and } d(b,c) = 3](resources/leanpub_equation_111.png),
    where ![4^2 \\lneq = 2^2 + 3^2.](resources/leanpub_equation_112.png) the triangle
    inequality does not hold.


    In contrast, the root-mean squared error does satisfy the triangle inequality,
    and the example above works out: ![4 \\lneq 2 + 3.](resources/leanpub_equation_113.png).


    The root-squared error ![\\sqrt{\\left(y - \\hat{y}\\right)^2}] satisfies the
    triangle inequality.

    '
  trans: '


    简而言之，我们使用 `Poisson regression`（泊回归）处理计数数据。当我们知道某些结果比其他结果“高”或“低”时，但不确定具体高出多少或这种差异是否重要，我们就使用
    `ordinal regression`（序数回归）。


    > **读者测试：**


    > **25-A**

    假设我们想要预测一名足球员在特定赛季的进球数。这个问题可以使用 `ordinal regression` 还是 `Poisson regression` 来解决？


    > **25-B**

    假设你让某人根据他们的偏好顺序对最近看过的三部电影进行排序。在忽略该数据集对于机器学习来说略微较小的事实下，哪种方法最适合这类数据？


    ## Q27. 适当的度量


    > **Q:**

    距离函数使其成为*适当*度量三个三个属性是什么？


    列出度量空间的三个属性。然后讨论常用的损失函数（如 `mean squared error` 均方误差和 `cross-entropy loss` 交叉熵）是否是适当的度量。


    > **A:**

    考虑两个向量或点 ![\\mathbf{v}](img/leanpub_equation_92.png)和 ![\\mathbf{w}](img/leanpub_equation_93.png)以及它们的距离
    ![d(\\mathbf{v}, \\mathbf{w}).](img/leanpub_equation_94.png)。


    ![图 27.1. 两个二维向量之间的欧氏距离。](img/figures----triangle-inequality-1.png)


    图 27.1. 两个二维向量之间的欧氏距离。


    适当度量的标准如下：


    1. 两点之间的距离始终是非负的 ![d(\\mathbf{v}, \\mathbf{w}) \\geq 0.](img/leanpub_equation_95.png)。此外，只有当两点相等时距离才为零，即
    ![\\mathbf{v} = \\mathbf{w}.](img/leanpub_equation_96.png)。


    2. 距离具有对称性，即 ![d(\\mathbf{v}, \\mathbf{w}) = d(\\mathbf{w}, \\mathbf{v}).](img/leanpub_equation_97.png)。


    3. 距离函数对于任意三点都满足*三角形不等式*：![\\mathbf{v}, \\mathbf{w}, \\mathbf{x},](img/leanpub_equation_98.png)这意味着这意味着


    ![d(\\mathbf{v}, \\mathbf{w}) \\leq d(\\mathbf{v}, \\mathbf{x}) + d(\\mathbf{x},
    \\mathbf{w}).](img/leanpub_equation_99.png)。


    为了对三角形不等式有更好的直观理解，可以将这些点想象成三角形的顶点。如果我们考虑任何三角形，两边之和总是大于第三边。


    ![图 27.2. 三角形不等式的插图。](img/figures----triangle-inequality.png)


    图 27.2. 三角形不等式的插图。


    **均方误差是适当的度量吗？**


    均方误差损失（`MSE`）计算目标变量 ![y](img/leanpub_equation_100.png)与预测目标值 ![\\hat{y}:](img/leanpub_equation_101.png)之间的欧氏距离的平方。


    ![\\mathrm{MSE}=\\frac{1}{n} \\sum\\_{i=1}^n\\left(y^{(i)} - \\hat{y}^{(i)}\right)².](img/leanpub_equation_102.png)。


    索引 ![i](img/leanpub_equation_103.png)表示数据集或样本中的 ![i\\text{-th}](img/leanpub_equation_104.png)数据点。为了简单起见，我们将考虑两个数据点之间的平方误差（`SE`）损失（然而，下面的见解同样适用）：


    ![\\mathrm{SE}(y, \\hat{y})=\\left(y - \\hat{y}\\right)².](img/leanpub_equation_105.png)。


    **属性 1.** SE 满足第一个属性的部分：*两点之间的距离始终是非负的*。由于我们对差异进行了平方，它不可能是负的。


    **属性 2.** 关于第二个属性，*只有当两点相等时距离才为零*如何？由于 `SE` 中的减法，直观上看，只有当预测匹配目标变量时它才为零，![y = \\hat{y}.](img/leanpub_equation_106.png)。


    我们看到 SE 满足适当度量的第一个属性，我们可以再次利用*平方*来确认它也满足第二个属性，*距离具有对称性*。由于平方，我们有\\left(y - \\hat{y}\\right)²
    = \\left(\\hat{y} - y\\right)².](resources/leanpub_equation_107.png)。


    **属性 3.** 初看起来平方误差损失也满足三角形不等式。直观上，你可以通过选择三个数字（这里是 1, 2, 3）来检查这一点：


    1. ![(1-2)^{2} \\leq (1-3)^{2} + (2-3)^{2}](img/leanpub_equation_108.png)

    2. ![(1-3)^{2} \\leq (1-2)^{2} + (2-3)^{2},](img/leanpub_equation_109.png)

    3. ![(2-3)^{2} \\leq (1-2)^{2} + (1-3)^{2}.](img/leanpub_equation_110.png)


    然而，在某些情况下这是不成立的，例如 ![d(a,c) = 4, \\; d(a,b) = 2, \\ \\text{ and } d(b,c) = 3](img/leanpub_equation_111.png)，其中
    ![4² \\lneq = 2² + 3².](img/leanpub_equation_112.png)三角形不等式不成立。


    相比之下，均方根误差满足三角形不等式，上面的例子也是成立的：![4 \\lneq 2 + 3.](img/leanpub_equation_113.png)。


    根平方误差 ![\\sqrt{\left(y - \\hat{y}\\right)²}] 满足三角形不等式。


    '
