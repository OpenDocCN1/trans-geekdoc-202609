- raw: "Following up on the question above, do smaller patches typically lead to a\
    \ higher or lower prediction accuracy?\n\n# Chapter 3. Natural Language Processing\n\
    \n## Q15. The Distributional Hypothesis\n\n**\\> Q:**\n\nWhat is the distributional\
    \ hypothesis in NLP? Where is it used, and how far does it hold true?\n\n**\\\
    > A:**\n\nThe distributional hypothesis is a linguistic theory suggesting that\
    \ words occurring in the same contexts tend to have similar meanings^([1](#chap46.xhtml#fn-distributional-source)).\
    \ To put it succinctly, the more similar the meanings of two words are, the more\
    \ often they appear in similar contexts.\n\n![Figure 15.1. According to the distributional\
    \ hypothesis, words that occur in similar contexts have a more similar meaning.\
    \ So, for example, the words Cats and Dogs often occur in similar contexts and\
    \ are more related (both are mammals and pets) than a cat and a sandwich.](resources/figures----distributional-hypothesis.png)\n\
    \nFigure 15.1. According to the distributional hypothesis, words that occur in\
    \ similar contexts have a more similar meaning. So, for example, the words *Cats*\
    \ and *Dogs* often occur in similar contexts and are more related (both are mammals\
    \ and pets) than a *cat* and a *sandwich*.\n\nLooking at large datasets, this\
    \ may hold more or less, but it is easy to construct individual counter-examples.\
    \ An intuitive counter-example is the phenomenon of polysemy, which is when a\
    \ word has multiple meanings that are related but not identical. For example,\
    \ let’s consider the word *bank*. It can refer to a financial institution, the\
    \ “rising ground bordering a river,” the “steep incline of a hill,” or a “protective\
    \ cushioning rim”^([2](#chap46.xhtml#fn-merriam-bank)). However, these different\
    \ meanings have different distributional properties and may not always occur in\
    \ similar contexts.\n\nNonetheless, the distributional hypothesis is quite useful.\
    \ Word embeddings^([3](#chap46.xhtml#fn-q1-15)) such as Word2vec^([4](#chap46.xhtml#fn-word2vec)),\
    \ and many large language transformer models rely on this idea (for example, the\
    \ masked language model in BERT^([5](#chap46.xhtml#fn-bert-ref)) and the next-word\
    \ pretraining task used in GPT^([6](#chap46.xhtml#fn-gpt-ref))).\n\nThe Word2vec\
    \ approach uses a simple, two-layer neural network to encode words into embedding\
    \ vectors such that the embedding vectors of similar words are close (semantically\
    \ and syntactically). There are two ways to train a Word2vec model: the continuous\
    \ bag-of-words (CBOW) and the skip-gram approach.\n\nUsing the CBOW approach,\
    \ Word2vec learns to predict the current words by using the surrounding context\
    \ words. In the skip-gram model and vice versa, the Word2vec model predicts the\
    \ context words from a selected word. In the continuous bag-of-words architecture,\
    \ the Word2vec model predicts a masked word from the window of surrounding context\
    \ words. While skip-gram is more effective for infrequent words, CBOW is usually\
    \ faster to train.\n\nAfter training, the word embeddings are placed within the\
    \ vector space so that words with common contexts in the corpus, meaning words\
    \ with semantic and syntactic similarities, are positioned close to each other.\
    \ Conversely, dissimilar words are located further apart in the embedding space.\n\
    \n![Figure 15.2. Illustration of Word2vec embeddings in a two-dimensional vector\
    \ space.](resources/figures----distributional-word2vec.png)\n\nFigure 15.2. Illustration\
    \ of Word2vec embeddings in a two-dimensional vector space.\n\nBERT uses a masked\
    \ language modeling approach that involves masking (hiding) some of the words\
    \ in a sentence, and its task is to predict these masked words based on the other\
    \ words in the sequence. This approach is a form of self-supervised learning used\
    \ to pretrain large language models^([7](#chap46.xhtml#fn-q15-2)). The pretrained\
    \ model produces embeddings where similar words (or tokens) are close in the embedding\
    \ space^([8](#chap46.xhtml#fn-bert-embedding-close)).\n\nRegarding the masked\
    \ language modeling task, BERT pretraining is conceptually similar to Word2vec’s\
    \ CBOW approach. However, CBOW is a simpler model that does not consider the order\
    \ of words in a sentence – CBOW only considers the distributional patterns of\
    \ words in a larger corpus.\n\nBeing a decoder instead of an encoder model, GPT\
    \ takes a slightly different approach than BERT and learns to predict the following\
    \ words in a sequence based on previous words. Where BERT is a bidirectional language\
    \ model that considers the whole input sequence, GPT only strictly parses previous\
    \ sequence elements. (This is why BERT is usually better suited for classification\
    \ tasks, whereas GPT is more suited for text generation tasks.)  \n\nSimilar to\
    \ BERT, GPT produces high-quality contextualized word embeddings that capture\
    \ semantic similarity^([9](#chap46.xhtml#fn-petroni)).\n\n![Figure 15.3. BERT’s\
    \ masked language modeling approach and GPT’s next-word prediction for pretraining.](resources/figures----distributional-bert.png)\n\
    \nFigure 15.3. BERT’s masked language modeling approach and GPT’s next-word prediction\
    \ for pretraining.\n\nTo summarize, while there are counter-examples where the\
    \ distributional hypothesis does not hold, it is a very useful concept that forms\
    \ the cornerstone of modern language transformer models.\n\n**\\> Reader quiz:**\n\
    \n**15-A**\n\nConsider the case of homophones – words that sound the same but\
    \ have different meanings. For example, the words *there* and *their* sound the\
    \ same but have different meanings. Are homophones another example of when the\
    \ distributional hypothesis does not hold?\n\n**15-B**\n\nCan you think of other\
    \ domains where a concept similar to the distributional hypothesis applies?\n\n\
    ## Q16. Data Augmentation for Text\n\n**\\> Q:**\n\nWhat are common data augmentation\
    \ techniques for text data?\n\n**\\> A:**\n\nData augmentation is useful for artificially\
    \ increasing the dataset size to improve model performance, for instance, by reducing\
    \ the degree of overfitting, as discussed in [Q5](#chap16.xhtml#q5). Data augmentation\
    \ is very common when developing computer vision models such as convolutional\
    \ neural networks and vision transformers, where we use standard techniques such\
    \ as rotation, scaling, flipping, cropping, and altering the brightness or contrast\
    \ of an image.\n\nSimilarly, there exist several techniques for augmenting text\
    \ data. The most common ones include synonym replacement, word deletion, word\
    \ position swapping, sentence shuffling, noise injection, back translation, and\
    \ text generated by large language models (LLMs). We will cover these different\
    \ techniques in the sections below^([10](#chap46.xhtml#fn-code-q16)).\n\n**Synonym\
    \ replacement**\n\nIn synonym replacement, we randomly choose words in a sentence\
    \ – often nouns, verbs, adjectives, and adverbs – and replace them via synonyms,\
    \ as shown in the example below:\n\n*   Original sentence: “The cat quickly jumped\
    \ over the lazy dog.”\n\n*   Augmented sentence: “The cat rapidly jumped over\
    \ the idle dog.”\n\nThis can help the model to learn that different words can\
    \ have similar meanings and thus improve its ability to understand and generate\
    \ text. However, using this technique carefully is essential, as not all synonyms\
    \ are interchangeable in all contexts.\n\nIn practice, synonym replacement is\
    \ often done by using a thesaurus such as WordNet^([11](#chap46.xhtml#fn-wordnet-ref)).\n\
    \n**Word deletion**\n\nWord deletion randomly removes certain words from the original\
    \ text to create new variants while still trying to maintain the overall meaning\
    \ of the sentence, as shown in the example below:\n\n*   Original sentence: “The\
    \ cat quickly jumped over the lazy dog.”\n\n*   Augmented sentence: “The cat quickly\
    \ jumped over the lazy dog.” (removed “quickly”)\n\nHowever, caution should be\
    \ taken not to remove critical words that may significantly alter a sentence’s\
    \ meaning. For example, the following word deletion would be suboptimal:\n\n*\
