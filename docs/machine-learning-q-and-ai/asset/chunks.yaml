    Nowadays, when we speak of `deep` generative models or sometimes also `deep generative
    AI`, we often losen this definition to include all types of models capable of
    producing realistic-looking data (typically, text, images, videos, and sound).
    The remainder of this section will briefly discuss the different types of deep
    generative models used to generate such data.


    ## Energy-based Models


