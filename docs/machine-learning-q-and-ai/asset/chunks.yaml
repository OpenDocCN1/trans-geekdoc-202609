- raw: 'The *bottleneck* in the figure above represents a small, intermediate neural
    network layer that encodes or maps the input image into a lower-dimensional representation.
    We can think of this mapping as a latent space. The training objective of the
    autoencoder is to reconstruct the input image, that is, minimizing the distance
    between the input and output images. In order to optimize the training objective,
    the autoencoder may learn to place the encoded features of similar inputs (for
    example, cats) close to each other in the latent space, thus creating useful embedding
    vectors where similar inputs are close in the embedding (latent) space.


    **Representation**


    We used the term representation above. A representation is an encoded, typically
    intermediate form of an input. For instance, an embedding vector or vector in
    the latent space is a *representation* of the input. However, representations
    can also be produced by simpler procedures. For example, one-hot encoded vectors
    are considered representations of an input.


    **\> Reader quiz:** ^([2](#chap46.xhtml#fn-solution-q1))


    **1-A**


    Suppose you are training a convolutional network with five convolutional layers
    followed by three fully connected (FC) layers similar to AlexNet^([3](#chap46.xhtml#fn-alexnet))
    as illustrated in the figure below. You can think of these fully connected layers
    as two hidden layers and an output layer in a multilayer perceptron.


    ![Figure 1.4. An illustration of AlexNet.](resources/figures----alexnet.png)


    Figure 1.4. An illustration of AlexNet.


    Which of the neural network layers can be utilized to produce useful embeddings?


    **1-B**


    Name at least one type of input representation that is not an embedding.


    ## Q2. Self-Supervised Learning


    **\> Q:**


    What is self-supervised learning, when is it useful, and what are the main categories
    of approaches?


    **\> A:**


    Self-supervised learning is a pretraining procedure that lets neural networks
    leverage large unlabeled datasets in a supervised fashion.


    Self-supervised is related to transfer learning. Suppose we are interested in
    training an image classifier to classify bird species. In transfer learning we
    would pretrain a convolutional neural network on ImageNet^([4](#chap46.xhtml#fn-imagenet)).
    After pretraining on the general ImageNet dataset, we would take the pretrained
    model^([5](#chap46.xhtml#fn-output-layer)) and train it on the smaller, more specific
    target dataset that contains the bird species of interest.


    ![Figure 2.1. An illustration of conventional transfer learning.](resources/figures----self-supervised-transfer.png)


    Figure 2.1. An illustration of conventional transfer learning.


    Self-supervised learning is an alternative approach to transfer learning where
    we don’t pretrain the model on labeled but *unlabeled* data. We consider an unlabeled
    dataset for which we do not have label information. We then find a way to obtain
    labels from the dataset’s structure to formulate a prediction task for the neural
    network. These self-supervised training tasks are also called *pretext tasks*.


    ![Figure 2.2. Overview of the self-supervised learning pipeline for predictive
    modeling. The only difference compared to the previous figure is how we obtain
    the labels during step 1.](resources/figures----self-supervised-1.png)


    Figure 2.2. Overview of the self-supervised learning pipeline for predictive modeling.
    The only difference compared to the previous figure is how we obtain the labels
    during step 1.


    Such a self-supervised learning task could be a “missing-word” prediction in a
    natural language processing context. For example, given the sentence “It is beautiful
    and sunny outside,” we can mask out the word “sunny,” feed the network the input
    It is beautiful and \[MASK\] outside,” and have the network predict the missing
    word in the “\[MASK\]” location. Similarly, we could remove image patches in a
    computer vision context and have the neural network fill in the blanks. Note that
    these are just two examples of self-supervised learning tasks. Many more methods
    and paradigms for self-supervised learning exist.


    In sum, we can think of self-supervised learning on the pretext task as representation
    learning. We can then take the pretrained model to finetune it on the target task
    (also known as the *downstream* task).


    **When is self-supervised learning useful?**


    Large neural network architectures require large amounts of labeled data to perform
    and generalize well. However, for many problem areas, we do not have access to
    large labeled datasets. With self-supervised learning, we can leverage unlabeled
    data. Hence, self-supervised learning is likely useful if we work with large neural
    networks and we only have a limited amount of labeled training data.


    Transformer-based architectures that form the basis of large language models and
    vision transformers are known to require self-supervised learning for pretraining
    to perform well.


    For small neural network models, for example, multilayer perceptrons with two
    or three layers, self-supervised learning is typically considered neither useful
    nor necessary. However, examples of self-supervised learning for multilayer perceptrons
    and tabular datasets do exist^([6](#chap46.xhtml#fn-scarf)[7](#chap46.xhtml#fn-tabular-transfer)).


    Other contexts where self-supervised learning is not useful are traditional machine
    learning with nonparametric models such as tree-based random forests or gradient
    boosting. Conventional tree-based methods do not have a fixed parameter structure
    (in contrast to the weight matrices, for example). Thus, conventional tree-based
    methods are not capable of transfer learning and incompatible with self-supervised
    learning.


    **What are the main categories of self-supervised learning?**


    There are two main categories of self-supervised learning: (1) self-prediction
    and (2) contrastive self-supervised learning.


    In self-prediction, we typically change or hide parts of the input and train the
    model to reconstruct the original inputs.


    ![Figure 2.3. A self-prediction task predicting the original training example
    after applying a perturbation mask.](resources/figures----self-supervised-self-pred.png)


    Figure 2.3. A self-prediction task predicting the original training example after
    applying a perturbation mask.


    A classic example is a denoising autoencoder that learns to remove noise from
    an input image. Or, consider a masked autoencoder that reconstructs the missing
    parts of an image.


    ![Figure 2.4. A masked autoencoder that learns to reconstruct the original image
    from a masked image.](resources/figures----self-supervised-masked-autoencoder.png)


    Figure 2.4. A masked autoencoder that learns to reconstruct the original image
    from a masked image.


    Missing (masked) input self-prediction are also commonly used in natural language
    processing contexts as well. Many generative large language models, such as GPT
    are trained on a next-word prediction pretext task. Here, we feed the network’s
    text fragments where it has to predict the next word in the sequence. (This is
    covered in more detail in [Q18](#chap30.xhtml#q18).)


    In contrastive self-supervised learning, we train the neural network to learn
    an embedding space where similar inputs are close to each other, and dissimilar
    inputs are far apart. In other words, we train the network to produce embeddings
    such that the distance between two similar training inputs is minimized. And at
    the same time, the distance between two different training examples is maximized.


    Let’s discuss contrastive learning with concrete example inputs. Suppose we have
    a dataset consisting of random animal images. First, we draw a random image of
    a cat (the network does not know the label because we assume that the dataset
    is unlabeled). Then, we augment, corrupt, or perturb this cat image, for example,
    by adding a random noise layer and cropping it differently, as shown in the figure
    below.'
  fmt: '

    The `bottleneck` in the figure above represents a small, intermediate neural network
    layer that encodes or maps the input image into a lower-dimensional representation.
    We can think of this mapping as a latent space. The training objective of the
    autoencoder is to reconstruct the input image, that is, minimizing the distance
    between the input and output images. In order to optimize the training objective,
    the autoencoder may learn to place the encoded features of similar inputs (for
    example, cats) close to each other in the latent space, thus creating useful embedding
    vectors where similar inputs are close in the embedding (latent) space.


    ### Representation


    We used the term representation above. A representation is an encoded, typically
    intermediate form of an input. For instance, an embedding vector or vector in
    the latent space is a `representation` of the input. However, representations
    can also be produced by simpler procedures. For example, one-hot encoded vectors
    are considered representations of an input.


