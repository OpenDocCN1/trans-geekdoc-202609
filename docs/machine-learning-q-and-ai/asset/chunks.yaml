- raw: '![Figure 2.5. Image pairs encountered in contrastive learning.](resources/figures----self-supervised-contrastive-example.png)


    Figure 2.5. Image pairs encountered in contrastive learning.


    The perturbed cat image still shows the same cat, so we want to network to produce
    a similar embedding vector. Then, we also consider a random image drawn from the
    training set (for example, an elephant, but again, the network doesn’t know the
    label). For the cat-elephant pair, we want the network to produce dissimilar embeddings^([8](#chap46.xhtml#fn-contrastiveloss)).
    This way, we implicitly force the network to capture the image’s core content
    while being somewhat agnostic to small differences and noise.


    The following figure summarizes the central concept behind contrastive learning
    for the perturbed image scenario. Note that the model is shown twice – this is
    referred to as a *siamese network* setup. Essentially, the same model is utilized
    in two instances: first, to generate the embedding for the original training example,
    and second, to produce the embedding for the perturbed version of the sample.


    ![Figure 2.6. Contrastive learning overview.](resources/figures----self-supervised-contrastive.png)


    Figure 2.6. Contrastive learning overview.


    The paragraphs above outlined the main idea behind contrastive learning, but many
    different subvariants exist. Broadly, we can categorize these into *sample* contrastive
    and *dimension* contrastive methods. Above, we described *sample* contrastive
    methods^([9](#chap46.xhtml#fn-sample-contrastive)), where we focus on learning
    embeddings to minimize/maximize distances between training pairs. In *dimension*\-contrastive
    approaches^([10](#chap46.xhtml#fn-dimension-contrastive)), which focus on making
    only certain variables in the embedding representations of similar training pairs
    similar while maximizing the distance of others.


    **\> Reader quiz:**


    **2-A**


    How could we apply self-supervised learning to video data?


    **2-B**


    Can self-supervised learning be used for tabular data represented as rows and
    columns? If so, how can we approach this?


    ## Q3. Few-Shot Learning


    **\> Q:**


    What is few-shot learning? And how does it differ from the conventional training
    procedure for supervised learning?


    **\> A:**


    Few-shot learning is a flavor of supervised learning for small training sets with
    a very small example-to-class ratio. In regular supervised learning, we train
    models by iterating over a training set where the model always sees a fixed set
    of classes. In few-shot learning, we are working on a support set from which we
    create multiple training tasks to assemble training episodes where each training
    task consists of different classes.


    In supervised learning, we fit a model on a training dataset and evaluate it on
    a test dataset. Typically, the training set contains a relatively large number
    of examples per class. For example, in supervised learning context, a tiny dataset
    is the the Iris dataset with 50 examples per class. For deep learning model, even
    a dataset like MNIST with 5k training examples per class is considered as very
    small.


    In few-shot learning, the number of examples per class is much smaller. We typically
    use the term *N*\-way *K*\-shot where *N* stands for the number of classes, and
    K stands for the number of examples per class. The most common values are *K=1*
    or *K=5*. For instance, in a 5-way 1-shot problem, we have 5 classes with only
    1 example each. The figure below depicts a 3-way 1-shot setting for illustration
    purposes.


    ![Figure 3.1. Illustration of training tasks in few-shot learning.](resources/figures----few-shot-1.png)


    Figure 3.1. Illustration of training tasks in few-shot learning.


    Rather than fitting the model to the training dataset, we can think of few-shot
    learning as “learning to learn.” In contrast to supervised learning, we don’t
    have a training dataset but a so-called support set. From the support set, we
    sample training tasks that mimic the use-case scenario during prediction. For
    example, for 3-way 1-shot learning, a training task consists of 3 classes with
    1 example each. With each training task comes a query image that is to be classified.
    The model is trained on several training tasks from the support set; this is called
    an episode.


    Then, during testing, the model receives a new task with classes that are different
    from those seen during training^([11](#chap46.xhtml#fn-baseclasses)). Again, the
    task is to classify the query images. Test tasks are similar to training tasks,
    except that none of the classes during testing overlap with those encountered
    during training.


    ![Figure 3.2. Illustration of the classes encountered during training and those
    encountered during testing.](resources/figures----few-shot-2.png)


    Figure 3.2. Illustration of the classes encountered during training and those
    encountered during testing.


    There are many different types and categories of few-shot learning. In the most
    common one, meta-learning, the training is essentially about updating the model
    parameters such that it can *adapt* well to a new task. On a high level, one few-shot
    learning strategy is to learn a model that produces embeddings where we can find
    the target class via a nearest-neighbor search among the images in the support
    set.


    ![Figure 3.3. Illustration of a few-shot learning approach where the model learns
    how to produce good embeddings from the support set to classify the query image
    based on finding the most similar embedding vector.](resources/figures----few-shot-3.png)


    Figure 3.3. Illustration of a few-shot learning approach where the model learns
    how to produce good embeddings from the support set to classify the query image
    based on finding the most similar embedding vector.


    **\> Reader quiz:**


    **3-A**


    How could we partition the MNIST dataset, consisting of 50,000 handwritten digits
    from 10 classes (0-9), for a one-shot classification context?


    **3-B**


    Can you think of some real-world applications or use cases for few-shot learning?


    ## Q4. The Lottery Ticket Hypothesis


    **\> Q:**


    What is the *lottery ticket hypothesis*, and if it holds true, how can it be useful
    in practice?


    **\> A:**


    According to the lottery ticket hypothesis^([12](#chap46.xhtml#fn-lth-reference)),
    a randomly initialized neural network can contain a subnetwork that, when trained
    on its own, can achieve the same accuracy on a test set as the original network
    after being trained for the same number of steps.


    The figure below illustrates the training procedure for the lottery ticket hypothesis
    in a more visual way. We will go through the steps one by one to help clarify
    the concept.


    ![Figure 4.1. Outline of the lottery hypothesis training procedure.](resources/figures----lottery-1.png)


    Figure 4.1. Outline of the lottery hypothesis training procedure.


    We start with a large neural network (1) that we train until convergence (2),
    which means that we put in our best efforts to make it perform as best as possible
    on a target dataset – for example, minimizing training loss and maximizing classification
    accuracy. This large neural network is initialized as usual using small random
    weights.


    Next, we prune the neural network’s weight parameters (3), removing them from
    the network. We can do this by setting the weights to zero to create sparse weight
    matrices^([13](#chap46.xhtml#fn-pruning)[14](#chap46.xhtml#fn-imp-pruning)). Which
    weights do we prune? The original lottery hypothesis approach follows a concept
    known as *iterative magnitude pruning*, where the weights with the lowest magnitudes
    are removed in an iterative fashion.


    After the pruning step, we reset the weights to the original small random values
    used in step 1. It’s worth emphasizing that we do not reinitialize the pruned
    network with any small random weights (as it is typical for iterative magnitude
    pruning) but reuse the weights from step 1.'
