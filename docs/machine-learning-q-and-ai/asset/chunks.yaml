- raw: '1.  ROUGE-N: This measures the overlap of N-grams between the candidate and
    reference summaries. For example, ROUGE-1 would look at the overlap of individual
    words (1-grams), while ROUGE-2 would consider the overlap of 2-grams (bigrams).


    2.  ROUGE-L: This metric measures the longest common subsequence (LCS) between
    the candidate and reference summaries. It captures the longest co-occurring in-order
    subsequence of words, which may have gaps in between.


    3.  ROUGE-S: This metric measures the overlap of skip-bigrams, which are word
    pairs with a flexible number of words in between. It can be useful to capture
    the similarity between sentences with different word orderings.


    ROUGE shares similar weaknesses as BLEU. Like BLEU, ROUGE does not account for
    synonyms or paraphrases. It measures the n-gram overlap between the candidate
    and reference summaries, which can lead to lower scores for semantically similar
    but lexically different sentences. It is still worth knowing about ROUGE since
    *all* papers introducing new summarization models at computational linguistic
    conferences in 2021 use ROUGE – 69% of these papers use *only* ROUGE according
    to [*Repairing the Cracked Foundation: A Survey of Obstacles in Evaluation Practices
    for Generated Text*](https://arxiv.org/abs/2202.06935).


    **BERTScore**


    BERTScore^([43](#chap46.xhtml#fn-bertscore-reference)) can be used for translations
    and summaries, and it captures the semantic similarity better than traditional
    metrics like BLEU and ROUGE. In particular, it’s more robust to paraphrasing.


    For readers familiar with the inception score for generative vision models, BERTScore
    takes a similar approach of using embeddings^([44](#chap46.xhtml#fn-q20-q1)) from
    a pretrained model. Here, BERTScore measures the similarity between a candidate
    text and a reference text by leveraging the contextual embeddings produced by
    the BERT model^([45](#chap46.xhtml#fn-q20-q18)).


    We can summarize the BERT score computation via the following steps:


    1.  Obtain the candidate text via the LLM you want to evaluate (PaLM, LLaMA, GPT,
    BLOOM, etc.)


    2.  Tokenize the candidate and reference texts into subwords (preferably using
    the same tokenizer used for training BERT)


    3.  Use a pretrained BERT model to create the embeddings for all tokens in the
    candidate and reference texts


    4.  Then, compare each token embedding in the candidate text to all token embeddings
    in the reference text, computing their cosine similarity


    5.  Align each token in the candidate text with the token in the reference text
    that has the highest cosine similarity


    6.  Compute the final BERTScore by taking the average similarity scores of all
    tokens in the candidate text.


    (Interested readers can find a computational example in the [supplementary materials](https://github.com/rasbt/MachineLearning-QandAI-book).)


    ![Figure 20.3. Illustration of how to compute the BERTScore.](resources/figures----bertscore.png)


    Figure 20.3. Illustration of how to compute the BERTScore.


    BERTScore is more robust to paraphrasing and captures semantic similarity better
    due to its contextual embeddings. However, it may be computationally more expensive
    as it requires using a pre-trained BERT model for the evaluation.


    It’s important to note that while BERTScore provides a useful automatic evaluation
    metric, it is also not perfect and should be used alongside other evaluation techniques,
    including human judgment.


    **Conclusion**


    All metrics covered above are surrogates or proxies to evaluate how useful the
    model is in terms of measuring how well the model compares to human performance
    for accomplishing a goal^([46](#chap46.xhtml#fn-more-nlp-metrics)). As mentioned
    earlier, the best way to evaluate LLMs is to assign human raters who judge the
    results. However, since this is often expensive and not easy to scale, we use
    the aforementioned metrics to estimate model performance. To quote from the InstructGPT^([47](#chap46.xhtml#fn-instructgpt-q20))
    paper:


    > “Public NLP datasets are not reflective of how our language models are used.
    . . . \[They\] are designed to capture tasks that are easy to evaluate with automatic
    metrics.”


    Moreover, it is also important to incorporate ethical considerations when assessing
    LLMs to ensure they are used responsibly and fairly.


