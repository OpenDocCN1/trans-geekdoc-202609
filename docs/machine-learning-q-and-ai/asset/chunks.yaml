- raw: '*Consider the patchification of the input images illustrated in the figure
    above. The size of the resulting patches controls a computational and predictive
    performance tradeoff. The optimal patch size depends on the specific application
    and desired trade-off between computational cost and model performance. Do smaller
    patches typically result in higher or lower computational costs?*


    Using smaller patches increases the number of patches for a given input image,
    leading to a higher number of tokens being fed into the transformer. This results
    in increased computational complexity, as the self-attention mechanism in transformers
    has quadratic complexity with respect to the number of input tokens. Consequently,
    smaller input patches make the model computationally more expensive.


    **Answer 13-B**


    *Following up on the question above, do smaller patches typically lead to a higher
    or lower prediction accuracy?*


    Using larger input patches may result in the loss of finer details and local structures
    in the input image, which can potentially negatively affect the model’s predictive
    performance. Interested readers might enjoy the *FlexiViT*^([5](#chap46.xhtml#fn-flexvit))
    paper that studies the computational and predictive performance trade-offs as
    a consequence of the patch size and number.


    **Chapter 3. Natural Language Processing**


    **Answer 15-A**


    *Consider the case of homophones – words that sound the same but have different
    meanings. For example, the words there and their sound the same but have different
    meanings. Are homophones another example of when the distributional hypothesis
    does not hold?*


    Homophones are words that are spelled differently and sound the same but have
    different meanings. Due to the different meanings, we expect two homophones to
    appear in other contexts. For example, “I can see you over there” and “Their paper
    is very nice.”


    Since the distributional hypothesis says that words with similar meanings should
    appear in similar contexts, homophones do not contradict the distribution


    **Answer 15-B**


    *Can you think of other domains where a concept similar to the distributional
    hypothesis applies?*


    The underlying idea of the distributional hypothesis can be applied to other domains,
    for example, computer vision. In the case of images, objects that appear in similar
    visual contexts are likely to be semantically related. Or, on a lower level, neighboring
    pixels are likely semantically related as they are part of the same object – this
    idea is used in masked autoencoding for self-supervised learning on image data^([6](#chap46.xhtml#fn-15-b-q2)).


    Another example is protein modeling. For example, researchers showed^([7](#chap46.xhtml#fn-amino-acid-transformer))
    that language transformers that are trained on protein sequences (a string representation
    where each letter represents an amino acid, for example, “MNGTEGPNFYVPFSNKTGVV…”)
    learn embeddings where similar amino acids cluster together. For example, the
    hydrophobic amino acids such as V, I, L, and M appear in one cluster, and aromatic
    amino acids such as F, W, and Y appear in another cluster. In this context, we
    can think of an amino acid as an equivalent to a word in a sentence.


    **Answer 16-A**


    *Could the use of text data augmentation help with privacy concerns?*


    Assuming that the existing data does not suffer from privacy concerns, data augmentation
    helps generate variations of the existing data without the need to collect additional
    data, which can help with privacy concerns.


    However, if the original data includes personally identifiable information, even
    augmented or synthetic data could potentially be linked back to individuals, especially
    if the augmentation process doesn’t sufficiently obscure or alter the original
    data.


    **Answer 16-B**


    *What are some instances where data augmentation may not be beneficial for a specific
    task?*


    Data augmentation might be less beneficial if the original dataset is already
    large and diverse enough that the model isn’t overfitting or underperforming due
    to a lack of data. This is, for example, often the case when pretraining LLMs.


    Also, the performance of highly domain-specific models (for example, in the medical,
    law, and financial domains) could be adversely affected by techniques such as
    synonym replacement and back translation due to replacing domain-specific terms
    with a certain meaning.


    In general, in contexts of tasks highly sensitive to wording choices, data augmentation
    must be applied with particular care.


    **Answer 17-A**


    *Considering that self-attention compares each sequence element with itself, what
    is the time and memory complexity of self-attention?*


    The self-attention mechanism has quadratic time and memory complexity.


    More precisely, we can express the time and memory complexity of self-attention
    as ![O(N^2 \\times d)](resources/leanpub_equation_134.png)where ![N](resources/leanpub_equation_135.png)is
    the length of the sequence, and `$d` is the dimensionality of the embedding of
    each element in the sequence.


    This is because self-attention involves computing a similarity score between each
    pair of elements in the sequence, resulting in an ![N \\times N](resources/leanpub_equation_136.png)similarity
    matrix. This matrix is then used to compute weighted averages of the sequence
    elements, resulting in an ![N \\times d](resources/leanpub_equation_137.png)output
    representation.


    This can make self-attention computationally expensive and memory-intensive, particularly
    for long sequences or large values of ![d](resources/leanpub_equation_138.png).


    **Answer 17-B**


    *We discussed self-attention in the context of natural language processing. Could
    this mechanism be useful for computer vision applications as well?*


    Yes. Interestingly, self-attention may partly be inspired by the spatial attention
    mechanisms^([8](#chap46.xhtml#fn-show-attend-and-tell)) used in convolutional
    neural networks for image processing. Spatial attention is a mechanism that allows
    a neural network to focus on specific regions of an image that are relevant to
    a given task. It works by selectively weighting the importance of different spatial
    locations in the image, which allows the network to “pay more attention” to certain
    areas and ignore others.


    **Answer 18-A**


    *As discussed earlier, BERT-style encoder models are pretrained using masked language
    modeling and next-sentence prediction pretraining objectives. How could we adopt
    such a pretrained model for a classification task, for example, predicting whether
    a text has a positive or negative sentiment?*


    If we want to adapt a pretrained BERT model for classification, you need to add
    an output layer for classification – this is often referred to as classification
    head.


    As discussed, BERT uses a \[CLS\] token for the next-sentence prediction task
    during pretraining. Instead of training it for next-sentence prediction, we can
    finetune a new output layer for our target prediction task, for example, sentiment
    classification.


    The embedded \[CLS\] output vector serves as a summary of the entire input sequence.
    We can think of it as a feature vector and train a small neural network on top
    of it, typially a fully connected layer followed by a softmax activation function
    to predict the class probabilities. The fully connected layer’s output size should
    match the number of classes in our classification task. Then, we can train it
    using backpropagation as usual. Different finetuning strategies (updating all
    layers versus only th


    **Answer 18-B**


    *Can we finetune or a decoder-only model like GPT for classification?*


    Yes, we can finetune a decoder-only model like GPT for classification tasks, although
    it might not be as effective as using encoder-based models like BERT.'
