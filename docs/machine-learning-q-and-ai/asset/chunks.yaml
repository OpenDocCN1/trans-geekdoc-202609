    We can conclude that while the cross-entropy loss is a useful loss function for
    training neural networks via (stochastic) gradient decent, it is not a proper
    distance metric as it does not satisfy any of the three criteria above.


    > **Reader quiz:**


    ### 27-A


    Suppose we consider using the mean absolute error (`MAE`) as an alternative to
    the root mean square error (`RMSE`) for measuring the performance of a machine
    learning model, where


    ![\mathrm{MAE}=\frac{1}{n} \sum\_{i=1}^n\left|y^{(i)} - \hat{y}^{(i)}\right|](resources/leanpub_equation_131.png)


    and


    ![\mathrm{RMSE}= \sqrt{\frac{1}{n} \sum\_{i=1}^n\left(y^{(i)} - \hat{y}^{(i)}\right)^2}.](resources/leanpub_equation_132.png)


    However, a colleague argues that the `MAE` is not a proper distance metric in
    metric space because it involves an absolute value, so we should prefer using
    the `RMSE`. Is this argument correct?


    ### 27-B


    Based on your answer to `27-A`, would you say that the `MAE` is better than the
    `RMSE`, or vice versa?


    ## Q28. The *k* in *k*-fold cross-validation


    > **Q:**


    `k`-fold cross-validation is a common choice for evaluating machine learning classifiers
    because it lets us use all training data to simulate how well a machine learning
    algorithm might perform on new data. What are the advantages and disadvantages
    of choosing a large `k`?


    > **A:**


    We can think of `k`-fold cross-validation as a workaround for model evaluation
    when we have limited data. In machine learning model evaluation, we care about
    the generalization performance of our model – how well it performs on new data.


    In `k`-fold cross-validation, we use the training data for model selection and
    evaluation by partitioning it into `k` validation rounds and folds. If we have
    `k` folds, we have `k` iterations, leading to `k` different models. So, using
    `k`-fold cross-validation, we usually evaluate the performance of a particular
    hyperparameter configuration by computing the average performance over the `k`
    models. This performance reflects or approximates the performance of a model trained
    on the complete training dataset after evaluation^([4](#chap46.xhtml#fn-k-fold-explanation)).


    ![Figure 28.1. Illustration of k-fold cross-validation for model evaluation where
    k=5. The average performance over the five validation folds and models can be
    used to approximate the performance of the final model.](resources/figures----k-fold-explanation.png)


    Figure 28.1. Illustration of k-fold cross-validation for model evaluation where
    `k=5`. The average performance over the five validation folds and models can be
    used to approximate the performance of the final model.


    ### Training folds become too similar


    If `k` is too large, the training sets are too similar between the different rounds
    of cross-validation. The `k` models are thus very similar to the model we obtain
    by training on the whole training set. In this case, we can still leverage the
    advantage of `k`-fold cross-validation: evaluating the performance for the entire
    training set^([5]).


    ### Increases computational budget


    If `k` is too large, the training sets are too similar between the different rounds
    of cross-validation. The `k` models are thus very similar to the model we obtain
    by training on the whole training set. In this case, we can still leverage the
    advantage of `k`-fold cross-validation: evaluating the performance for the entire
    training set^([5]).


    In machine learning model evaluation, we care about the generalization performance
    of our model – how well it performs on new data.


    In `k`-fold cross-validation, we use the training data for model selection and
    evaluation by partitioning it into `k` validation rounds and folds. If we have
    `k` folds, we have `k` iterations, leading to `k` different models. So, using
    `k`-fold cross-validation, we usually evaluate the performance of a particular
    hyperparameter configuration by computing the average performance over the `k`
    models. This performance reflects or approximates the performance of a model trained
    on the complete training dataset after evaluation^([4](#chap46.xhtml#fn-k-fold-explanation)).


