- raw: "Since the test set performance is much better than the training set performance,\
    \ we can rule out overfitting. More likely, there are substantial differences\
    \ in the training and test data distributions. These distributional differences\
    \ may affect both the features and the targets. Here, plotting the target or label\
    \ distributions of training and test data is a good idea. For example, a common\
    \ issue is that the test set is missing certain class labels if the dataset was\
    \ not shuffled properly before splitting it into training and test data. For small\
    \ tabular datasets, it is also feasible to compare feature distributions in the\
    \ training and test set using histograms.\n\nLooking at feature distributions\
    \ is a good approach for tabular data, but this is trickier for image and text\
    \ data. A relatively easy and more general approach to check for training-test\
    \ set discrepancies is *adversarial validation*.\n\nAdversarial validation is\
    \ a technique to identify the degree of similarity between the training and test\
    \ data. In adversarial validation, we first merge the training and test set into\
    \ a single dataset. Then we create a binary target variable that distinguishes\
    \ between training and test data. For instance, can we use a new “*Is test?”*\
    \ label where we assign the label 0 for training data and the label 1 for test\
    \ data. We then use *k*\\-fold cross-validation or repartition the dataset into\
    \ a training and test set and train a machine learning model as usual. Ideally,\
    \ we want the model to perform poorly, indicating that the training and test data\
    \ distribution is similar. On the other hand, if the model performs well in predicting\
    \ the *Is test* label, it suggests a discrepancy between training and test data\
    \ that we need to investigate further.\n\n![Figure 29.1. Outline of the adversarial\
    \ validation workflow for detecting training and test set discrepancies.](resources/figures----adversarial-validation.png)\n\
    \nFigure 29.1. Outline of the adversarial validation workflow for detecting training\
    \ and test set discrepancies.\n\nWhat are some mitigation issues if we detect\
    \ a training-test set discrepancy using adversarial validation? If we work with\
    \ a tabular dataset, we can remove features one at a time to see if it can help\
    \ address the issue – this is because spurious features can sometimes be highly\
    \ correlated with the target variable. For this, we can use sequential feature\
    \ selection algorithms^([9](#chap46.xhtml#fn-feature-selection)) with an updated\
    \ objective: for example, instead of maximizing classification accuracy, we minimize\
    \ classification accuracy. For cases where removing features is not so trivial\
    \ (for example, image and text data), we can also investigate whether removing\
    \ individual training instances that are different from the test set can address\
    \ the discrepancy issue.\n\n**Reader quiz:**\n\n**29-A**\n\nWhat is a good performance\
    \ baseline for the adversarial prediction task?\n\n**29-B**\n\nSince training\
    \ datasets are often bigger than test datasets, adversarial validation often results\
    \ in an imbalanced prediction problem (we have more examples with “*Is test?*”\
    \ equal to false. Is this an issue, and if so, how can we mitigate that?\n\n##\
    \ Q30. Limited Labeled Data\n\n**\\> Q:**  \n\nSuppose we plotted a learning curve^([10](#chap46.xhtml#fn-learning-curve-30))\
    \ and found that the machine learning model overfits and could benefit from more\
    \ training data. Name different approaches for dealing with limited labeled data\
    \ in supervised machine learning settings.\n\n**\\> A:**\n\nNext to collecting\
    \ more data, there are several methods more or less related to regular supervised\
    \ learning that we can use in limited-labeled data regimes.\n\n**1) Label more\
    \ data**\n\nCollecting additional training examples is often the best way to improve\
    \ the performance of a model^([11](#chap46.xhtml#fn-learning-curve-q5)). However,\
    \ this is often not feasible in practice. Listed below are various alternative\
    \ approaches.\n\n**2) Bootstrapping the data**\n\nSimilar to the topics discussed\
    \ in *[Q5](#chap16.xhtml#q5), Reducing Overfitting with Data*, it can be helpful\
    \ to “bootstrap” the data by generating modified (augmented) or artificial (synthetic)\
    \ training examples to boost the performance of the predictive model.\n\nOf course,\
    \ improving the quality of data can also lead to improved predictive performance\
    \ of a model, as discussed in *[Q22](#chap35.xhtml#q22), Data-Centric AI*.\n\n\
    **3) Transfer learning**\n\nTransfer learning describes training a model on a\
    \ general dataset (e.g., ImageNet) and then finetuning the pretrained target dataset\
    \ (e.g., a specific dataset consisting of different bird species). Transfer learning\
    \ is usually done in the context of deep learning, where model weights can be\
    \ updated. This is in contrast to tree-based methods since most decision tree\
    \ algorithms are nonparametric models that do not support iterative training or\
    \ parameter updates^([12](#chap46.xhtml#fn-iterative-tree)).\n\n![Figure 30.1.\
    \ Illustration of transfer learning.](resources/figures----small-data-supervised-transfer.png)\n\
    \nFigure 30.1. Illustration of transfer learning.\n\n**4) Self-supervised learning**\n\
    \nSimilar to transfer learning, self-supervised learning, the model is pretrained\
    \ on a different task before it is finetuned to a target task for which only limited\
    \ data exists. However, in contrast to transfer learning, self-supervised learning\
    \ usually relies on label information that can be directly and automatically extracted\
    \ from unlabeled data. Hence, self-supervised learning is also often called unsupervised\
    \ pretraining. Common examples include “next word” (e.g., used in GPT) or “masked\
    \ word” (e.g., used in BERT) prediction in language modeling. Or, an intuitive\
    \ example from computer vision includes inpainting: predicting the missing part\
    \ of an image that was randomly removed. (For more details about self-supervised\
    \ learning, also see [Q2](#chap13.xhtml#q2).)\n\n![Figure 30.2. Illustration of\
    \ inpainting for self-supervised learning.](resources/figures----small-data-supervised-selfsupervised.png)\n\
    \nFigure 30.2. Illustration of inpainting for self-supervised learning.\n\n**5)\
    \ Active learning**\n\nIn active learning, we typically involve manual labelers\
    \ or users for feedback during the learning process. However, instead of labeling\
    \ the entire dataset upfront, active learning includes a prioritization scheme\
    \ for suggesting unlabeled data points for labeling that maximize the machine\
    \ learning model’s performance.\n\nThe name *active learning* refers to the fact\
    \ that the model is *actively* selecting data for labeling in this process. For\
    \ example, the simplest form of active learning selects data points with high\
    \ prediction uncertainty for labeling by a human annotator (also referred to as\
    \ an *oracle*).\n\n![Figure 30.3. Illustration active learning.](resources/figures----small-data-supervised-active.png)\n\
    \nFigure 30.3. Illustration active learning.\n\n**6) Few-shot learning**\n\nIn\
    \ a few-shot learning scenario, we often deal with extremely small datasets where\
    \ we usually only have a handful of examples per class. In research contexts,\
    \ 1-shot (1 example per class) and 5-shot (5 examples per class) are very common.\
    \  \n\nAn extreme case of few-shot learning is zero-shot learning, where no labels\
    \ are provided. A recently popular example of zero-shot learning is GPT-3 and\
    \ related language models. Here, the user has to provide all the necessary information\
    \ via the input prompt, as illustrated in the figure below.\n\n![Figure 30.4.\
    \ Example of zero-shot classification with ChatGPT.](resources/figures----zero-shot-chatgpt.png)\n\
    \nFigure 30.4. Example of zero-shot classification with ChatGPT.\n\n(For more\
    \ details about self-supervised learning, also see [Q3](#chap14.xhtml#q3).)\n\n\
    **7) Meta-learning**\n\nWe can think of meta-learning as “learning to learn” –\
    \ we develop methods that learn how machine learning algorithms can best learn\
    \ from data.  "
