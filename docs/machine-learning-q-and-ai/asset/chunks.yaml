    *   Consider a medical imaging scenario for a rare disease. A few-shot system
    may only have one or a handful of cases for this disease and is asked to identify
    it based on this limited number of examples.

    *   Another example of a few-shot system is a recommender that only has a limited
    number of items a user rated. Based on this limited number of examples, the model
    has to predict future products the user may like.

    *   Imagine a warehouse robot that has to learn to recognize new objects as a
    company increases its inventory. The robot has to learn to recognize and adapt
    to these new objects based on only a few examples.


    ## Answer 4-A


    *Suppose you are trying out the lottery ticket hypothesis approach and find that
    the performance of the subnetworks is not very good (compared to the original
    network). What are some next steps to try?*


    *   Increase the size of the initial neural network. It might be possible that
    the chosen network is too small to contain a suitable subnetwork.

    *   Try a different random initialization (e.g., by changing the random seed).
    The lottery hypothesis assumes that *some* randomly initialized networks contain
    highly-accurate sub-networks that can be obtained by pruning, but not all networks
    may have such sub-networks.


    ## Answer 4-B


    *How is the lottery ticket hypothesis related to training a neural network with
    ReLU activation functions (a ReLU activation function is defined as `max(0, x)`?*


    When training a neural network with `ReLU` activation functions, specific activations
    will be set to zero if the function input is less than zero. This will cause certain
    nodes in the hidden layers to not contribute to the computations – this is sometimes
    referred to as “dead neurons.” While `ReLU` activations do not directly cause
    sparse weights, the zero activation outputs sometimes lead to zero weights that
    are not recoverable. This observation supports the lottery hypothesis, which suggests
    that well-trained networks may contain sub-networks with sparse, trainable weights
    that can be pruned without loss of accuracy.


    ## Answer 5-A


    *Suppose we train an `XGBoost` model to classify images based on manually extracted
    features we obtained from our collaborators. The dataset of labeled training examples
    is relatively small, but fortunately, your collaborators also have a labeled training
    set from an older project on a related domain.


    We are considering implementing a transfer learning approach to train the `XGBoost`
    model. Is this a feasible option, and if yes, how could we do it? (Assume we are
    only allowed to use `XGBoost`, no other classification algorithm or model.)*


    `XGBoost` is a tree-based gradient-boosting implementation that does not support
    transfer learning (as of this writing). In contrast to artificial neural networks,
    `XGBoost` is a non-parametric model that we cannot readily update as new data
    arrives; hence, regular transfer learning would not work here.


    However, it is possible to use the results of an `XGBoost` model trained on one
    task as features for another `XGBoost` model. So, consider an overlapping set
    of features for both datasets. For example, we could design a classification task
    in a self-supervised fashion for the combined dataset. Then, we train a second
    `XGBoost` model on the target dataset that takes the original feature set as input,
    along with the output of the first `XGBoost` model.


    ## Answer 5-B


    *Suppose we are working on an image classification problem (for this example,
    consider `MNIST`-based handwritten digit recognition) and added a decent amount
    of data augmentation to reduce overfitting in an image classification context.
    Unfortunately, we observe that the classification accuracy became much worse.
    What are some potential reasons?*


    ## Answer 6-A


    *Suppose we are using early-stopping as a mechanism to reduce overfitting. In
    particular, we are using checkpoints of the best model (for instance, validation
    accuracy) during training so that we can enable in modern frameworks.*


    *Now, a colleague recommends tuning the number of epochs instead. What are some
    of the advantages and disadvantages of each?*


