- raw: "The figure above shows image and text encoders as separate components. The\
    \ image encoder can be a convolutional backbone or a vision transformer, and the\
    \ language encoder can be a recurrent neural network or language transformer.\
    \ However, it’s common nowadays to use a single transformer-based module that\
    \ can simultaneously process image and text data^([18](#chap46.xhtml#fn-multimodal-simultaneous)).\n\
    \nOptimizing a matching loss, as shown in the previous figure, can be useful for\
    \ learning embeddings that can be applied to various tasks, such as image classification\
    \ or summarization. However, it is also possible to directly optimize the target\
    \ loss, like classification or regression, as the figure below illustrates.\n\n\
    ![Figure 30.10. Illustration of multi-modal learning for optimizing a supervised\
    \ learning objective.](resources/figures----multimodal-learning-2.png)\n\nFigure\
    \ 30.10. Illustration of multi-modal learning for optimizing a supervised learning\
    \ objective.\n\nIntuitively, models that combine data from different modalities\
    \ generally perform better than uni-modal models because they can leverage more\
    \ information. Moreover, recent research suggests that the key to the success\
    \ of multi-modal learning is the improved quality of the latent space representation^([19](#chap46.xhtml#fn-multimodal-why)).\n\
    \n**13) Inductive biases**\n\nChoosing models with stronger inductive biases can\
    \ help to lower data requirements by making assumptions about the structure of\
    \ the data. For example, due to their inductive biases, convolutional networks\
    \ require less data than vision transformers as discussed in Q13.\n\n**Which techniques\
    \ should we use?**\n\nNow that we covered several techniques for lowering the\
    \ data requirements, which ones should we use?\n\nCollecting more data and techniques\
    \ such as data augmentation and feature engineering are compatible with all the\
    \ methods discussed above. Also, multi-task learning and multi-modal inputs can\
    \ be used with the other learning strategies outlined above. If the model suffers\
    \ from overfitting, techniques from [Q5](#chap16.xhtml#q5) and [Q6](#chap17.xhtml#q6)\
    \ should also be included.\n\nHow about active learning, few-shot learning, transfer\
    \ learning, self-supervised learning, semi-supervised learning, and weakly supervised\
    \ learning? Which technique(s) to try highly depends on the context, and the figure\
    \ below provides an overview that can be used for guidance.\n\n![Figure 30.11.\
    \ Recommendations for choosing a supervised learning techniques. The black boxes\
    \ are not terminal nodes but arch back to Evaluate model performance (the arrows\
    \ were omitted to avoid visual clutter).](resources/figures----learning-strategies-lucidchart.png)\n\
    \nFigure 30.11. Recommendations for choosing a supervised learning techniques.\
    \ The black boxes are not terminal nodes but arch back to Evaluate model performance\
    \ (the arrows were omitted to avoid visual clutter).\n\n**\\> Reader quiz:**\n\
    \n**30-A**\n\nGiven the task of constructing a machine learning model that utilizes\
    \ images to detect manufacturing defects on the outer shells of tablet devices\
    \ similar to iPads, we have access to the following data:\n\n*   Millions of images\
    \ of various computing devices, including smartphones, tablets, and computers,\
    \ which are not labeled.\n\n*   Thousands of labeled pictures of smartphones depicting\
    \ various types of damage.\n\n*   Hundreds of labeled images specifically related\
    \ to the target task of detecting manufacturing defects on tablet devices.\n\n\
    How could we approach this problem using self-supervised learning or transfer\
    \ learning?\n\n**30-B**\n\nIn active learning, selecting difficult examples for\
    \ human inspection and labeling is often based on confidence scores. Neural networks\
    \ can provide such scores by using the logistic sigmoid or softmax function in\
    \ the output layer to calculate class-membership probabilities. However, it is\
    \ widely recognized that deep neural networks exhibit overconfidence on out-of-distribution\
    \ data^([20](#chap46.xhtml#fn-easily-fooled)), rendering their use in active learning\
    \ ineffective. So, what are some other methods to obtain confidence scores using\
    \ deep neural networks for active learning?\n\n# Afterword\n\nI hope you found\
    \ this book to be a valuable and informative resource in the pursuit of knowledge\
    \ in machine learning and AI.\n\nWhether the book has provided helpful explanations\
    \ and introductions for future studies or actionable insights that you can apply\
    \ in your work, it would make me very happy to know that it has benefited you.\n\
    \nIf you have found this book valuable, I would be grateful if you could share\
    \ your experience and spread the word to others who may also find it helpful as\
    \ well. (Who knows, if there is enough interest, I may start a second volume with\
    \ a selection of brand-new Q & A’s that I stashed away.)\n\nThank you for reading,\
    \ and I wish you the best of luck in all your endeavors in the fascinating world\
    \ of machine learning and AI.\n\n# Appendix A: Reader Quiz Solutions\n\n**Chapter\
    \ 1. Neural Networks and Deep Learning**\n\n**Answer 1-A**\n\n*Suppose you are\
    \ training a convolutional network with five convolutional layers followed by\
    \ three fully connected (FC) layers similar to AlexNet. You can think of these\
    \ fully connected layers as two hidden layers and an output layer in a multilayer\
    \ perceptron. Which of the neural network layers can be utilized to produce useful\
    \ embeddings?*\n\nThe final layer before the output layer – the second fully connected\
    \ layer in this case – may be most useful for embeddings.  \n\nHowever, we could\
    \ also use all other intermediate layers to create embeddings. Since the later\
    \ layers tend to learn higher-level features, these later layers are typically\
    \ more semantically meaningful and better suited for different types of tasks,\
    \ including related classification tasks.\n\n**Answer 1-B**\n\n*Name at least\
    \ one type of input representation that is not an embedding.*\n\n*   One-hot encoding\
    \ (covered in [Q1](#chap12.xhtml#q1))\n\n*   Histogram (for example, an image\
    \ histogram^([1](#chap46.xhtml#fn-image-histogram)) created from an image)\n\n\
    *   A bag-of-word^([2](#chap46.xhtml#fn-bow)) representation of an input sentence\n\
    \n**Answer 2-A**\n\n*How could we apply self-supervised learning to video data?*\n\
    \n*   Predict the next frame in the video (analogous to next-word prediction in\
    \ large language models such as GPT)\n\n*   Predict missing or masked frames (analogous\
    \ to large language models such as BERT)\n\n*   Inpainting: Predict masked or\
    \ missing parts (pixel areas) in a video\n\n*   Coloring: convert the video to\
    \ grayscale and then train the model to predict the color\n\n**Answer 2-B**\n\n\
    *Can self-supervised learning be used for tabular data represented as rows and\
    \ columns? If so, how can we approach this?*\n\nWe can remove (mask) feature values\
    \ and train a model to predict these (analogous to classic data imputation). An\
    \ example of a method that uses this approach is TabNet^([3](#chap46.xhtml#fn-tabnet)).\n\
    \nIt is also possible to use contrastive learning by generating augmented versions\
    \ of the training examples in the original raw feature space or the embedding\
    \ space. For example, the SAINT^([4](#chap46.xhtml#fn-saint)) method employs this\
    \ approach.\n\n**Answer 3-A**\n\n*How could we partition the MNIST dataset, consisting\
    \ of 50,000 handwritten digits from 10 classes (0-9), for a one-shot classification\
    \ context?*\n\nSimilar to a supervised learning approach, we first divide the\
    \ dataset into a training set and a test set. We then further divide the training\
    \ and test sets into subsets, one image from each class.  \n\nTo design the training\
    \ task, we only consider a subset of classes, for example, the classes (digits)\
    \ 0, 1, 2, 5, 6, 8, 9. Then, for testing, we use the remaining classes 3, 4, 7.\
    \ For each classification task, the neural network receives only one example per\
    \ image.\n\n**Answer 3-B**\n\n*Can you think of some real-world applications or\
    \ use cases for few-shot learning?*"
