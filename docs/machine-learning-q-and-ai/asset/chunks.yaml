    # Chapter 1. Neural Networks and Deep Learning


    ## Q1. Embeddings, Representations, and Latent Space


    ### **> Q:**


    In deep learning, we often use the terms *embedding vectors*, *representations*,
    and *latent space*. What do these concepts have in common, and how do they differ?


    ### **> A:**


    While all three concepts, embedding vectors, vectors in latent space, and representations,
    are often used synonymously, we can make slight distinctions:


    *   representations are encoded versions of the original input;

    *   latent vectors are intermediate representations;

    *   embedding vectors are representations where similar items are close to each
    other.


    ### Embeddings


    Embedding vectors, or `embeddings` for short, encode relatively high-dimensional
    data into relatively low-dimensional vectors.


    We can apply embedding methods to create a continuous dense (non-sparse) vector
    from a one-hot encoding. However, we can also use embedding methods for dense
    data such as images. For example, the last layers of a convolutional neural network
    may yield embedding vectors, as illustrated in the figure below^([1](#chap46.xhtml#fn-embedding)).


    ```

    ![Figure 1.1. An input embedding (left) and an embedding from a neural network
    (right).](resources/figures----embeddings-1.png)

    ```

    Figure 1.1. An input embedding (left) and an embedding from a neural network (right).


    Taking it to the extreme, embedding methods can be used to encode data into two-dimensional
    dense and continuous representations for visualization purposes and clustering
    analysis, as illustrated in the figure below.


    ```

    ![Figure 1.2. Mapping words (left) and images (right) to a two-dimensional feature
    space.](resources/figures----embeddings-2.png)

    ```

    Figure 1.2. Mapping words (left) and images (right) to a two-dimensional feature
    space.


    A fundamental property of embeddings is that they encode *distance* or *similarity*.
    This means that embeddings capture the semantics of the data such that similar
    inputs are close in the embeddings space.


    ### Latent space


    *Latent space* is typically used synonymously with *embedding space* – the space
    into which embedding vectors are mapped.


    Similar items can appear close in the latent space; however, this is not a strict
    requirement. More loosely, we can think of the latent space as any feature space
    that contains the features, often a compressed version of the original input features.
    These latent space features can be learned by a neural network, for example, an
    autoencoder that reconstructs input images, as shown in the figure below.


    ```

    ![Figure 1.3. An autoencoder that reconstructs the input image after passing through
    a bottleneck layer.](resources/figures----embeddings-3.png)

    ```

    Figure 1.3. An autoencoder that reconstructs the input image after passing through
    a bottleneck layer.

