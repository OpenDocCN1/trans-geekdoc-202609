    `W_A`](resources/leanpub_equation_64.png)和`W_B.](resources/leanpub_equation_65.png)。如果我们引入了新的权重矩阵，这如何是参数高效的呢？新矩阵可以非常小。例如，假设
    ![A=25](img/leanpub_equation_66.png)且 ![B=50,](img/leanpub_equation_67.png)，那么
    ![\\Delta W](img/leanpub_equation_68.png)的尺寸为 ![25 \\times 50 = 6,250.](img/leanpub_equation_69.png)。如果
    ![h=5,](img/leanpub_equation_70.png)，那么`W_A`](resources/leanpub_equation_71.png)有
    ![125](img/leanpub_equation_72.png)参数，而`W_B`](resources/leanpub_equation_73.png)有
    ![250](img/leanpub_equation_74.png)参数，两个矩阵总共只有 ![125 + 250 = 375](img/leanpub_equation_75.png)参数。


    在学习了权重更新矩阵后，我们可以使用伪代码将全连接层的矩阵乘法写作：


    ```

    1 def lora_forward_matmul(x):

    2     h = x . W  # regular matrix multiplication

    3     h += x . (W_A . W_B) * scalar

    4     return h

    ```


    在上面的伪代码中，`scalar`是一个缩放因子，用于调整组合结果（原始模型输出加上低秩自适应）的幅度。这平衡了预训练模型的知识与新任务特定的自适应。


    根据 LoRA 论文，在多个特定任务基准中，使用 LoRA 的模型建模性能略优于使用 Adapters 的模型。通常，LoRA 的表现甚至优于使用 Q19
    开头描述的微调 II 方法微调的模型。


    ## 基于人类反馈的强化学习


    上一节侧重于让微调更高效。转换一下，我们如何通过微调来提高 LLM 的建模性能？为新的目标领域或任务适配或微调 LLM 的传统方法是使用带有标记目标数据的监督学习方法。例如，使用我们之前讨论的微调
    II 方法允许我们适配预训练的 LLM 并在目标任务（例如情感分类）上对其微调，使用包含“正面”、“中性”和“否定”等情感标签文本的数据集。


    监督微调的另一种方法是称为基于人类反馈的强化学习（RLHF）。例如，ChatGPT 和它的前身 InstructGPT^(34) 是使用 RLHF 微调的预训练
    LLM (GPT-3) 的两个流行例子。


    在 RLHF 中，使用监督学习和强化学习相结合的方法微调预训练模型——这种方法由原始 ChatGPT 模型普及，而该模型又基于 InstructGPT^(35。人类反馈通过让人类对不同的模型输出进行排序或评分来收集，从而提供奖励信号。收集到的奖励标签随后用于训练奖励模型，然后用该模型引导
    LLM 适配人类偏好。奖励模型通过监督学习学习（通常使用预训练的 LLM 作为基础模型）。接下来，使用奖励模型来更新要适配人类偏好的预训练 LLM —— 训练使用了一种名为近端策略优化^(36)
    的强化学习变体。为什么使用奖励模型而不是直接在人类反馈上训练预训练模型呢？这是因为在学习过程中引入人类会产生瓶颈，因为我们无法获取实时反馈。


    ![图 19.8. 基于 InstructGPT 的基于人类反馈的强化学习 (RLHF) 过程](img/figures----transformer-finetuning-rlhf.png)


    图 19.8. 基于 InstructGPT 的基于人类反馈的强化学习 (RLHF) 过程。


    ## 结论


    虽然微调预训练 LLM 的所有层仍然是适配新目标任务的标准，但存在几种高效的替代方案来利用预训练 Transformer。例如，我们可以通过基于特征的方法、上下文学习或参数高效微调技术，在最小化计算成本和资源消耗的情况下，有效地将
    LLM 应用于新任务。


    三种传统方法——基于特征的方法、微调 I 和微调 II——提供了不同的计算效率和性能权衡。参数高效微调方法（如软提示调、prefix tuning 和适配方法）进一步优化了适配过程，减少了需要更新的参数数量。基于人类反馈的强化学习（RLHF）提供了监督微调的另一种方法，可能提高建模性能。


    总结，预训练 LLM 的灵活性和效率不断进步，为有效地适配各种任务和领域提供了新的机会和策略。随着该领域的研究进展，我们可以预期预训练模型的进一步改进和创新。


