    ### When is self-supervised learning useful?


    Large neural networks require large amounts of labeled data to perform and generalize.
    However, with self-supervised learning, we can leverage unlabeled datasets. (This
    methods exist^[6](#chap46.xhtml#fn-scarf)[7](#chap46.xhtml#fn-tabular)).


    Other contexts where self-supervised learning is not useful are traditional machine
    learning with nonparametric models such as random forests or gradient boosting.
    Conventional tree-based methods do not have a fixed structure (in contrast to
    weight matrices).


    ### What are the main categories of self-supervised learning?


    There are two main categories of self-supervised learning: (1) self-prediction
    and (2) contrastive self-supervised learning.


    In self-prediction, we typically change or hide parts of the input and train the
    model to reconstruct the original inputs.


    ![Figure 2.3. A self-prediction task predicting the original example after applying
    a perturbation mask.](resources/figures----self-supervised-self-pred.png)


    Figure 2.3. A self-prediction task predicting the original example after applying
    a perturbation mask.


