    the parameter update for a weight matrix of the LLM with dimension ![\\mathbb{R}^{A
    \\times B}.](resources/leanpub_equation_61.png). We can decompose the weight update
    matrix into two smaller matrices: ![\\Delta W = W\_A W\_B,](resources/leanpub_equation_62.png)where
    `W_A \in \mathbb{R}^{A \times h}` $ and ![W\_A \in \\mathbb{R}^{h \times B}.](resources/leanpub_equation_63.png).Here,
    we keep the original weight frozen and only train the new matrices `W_A`](resources/leanpub_equation_64.png)and
    `W_B.](resources/leanpub_equation_65.png).How is this parameter efficient if we
    introduce new weight matrices? The new matrices can be very small. For example,
    suppose ![A=25](resources/leanpub_equation_66.png)and ![B=50,](resources/leanpub_equation_67.png)then
    the size of ![\\Delta W](resources/leanpub_equation_68.png)is ![25 \\times 50
    = 6,250.](resources/leanpub_equation_69.png).If ![h=5,](resources/leanpub_equation_70.png)then
    `W_A`](resources/leanpub_equation_71.png)has ![125](resources/leanpub_equation_72.png)parameters,
    and `W_B`](resources/leanpub_equation_73.png)has ![250](resources/leanpub_equation_74.png)parameters,
    and the two matrices combined only have ![125 + 250 = 375](resources/leanpub_equation_75.png)parameters
    in total.


    After learning the weight update matrix, we can then write the matrix multiplication
    of a fully connected layer as follows, using pseudo-code:


    ```

    1 def lora_forward_matmul(x):

    2     h = x . W  # regular matrix multiplication

    3     h += x . (W_A . W_B) * scalar

    4     return h

    ```


    In the pseudo-code above, `scalar` is a scaling factor that adjusts the magnitude
    of the combined result (original model output plus low-rank adaptation). This
    balances the pretrained model’s knowledge and the new task-specific adaptation.


    According to the LoRA paper, the modeling performance of models using LoRA performs
    slightly better than models using Adapters across several task-specific benchmarks.
    Often, LoRA performs even better than models finetuned using the Finetuning II
    method described at the beginning of [Q19](#chap31.xhtml#q19).


    ## Reinforcement Learning with Human Feedback


    The previous section focused on making finetuning more efficient. Switching gears,
    how can we improve the modeling performance of LLMs via finetuning? The conventional
    way to adapt or finetune an LLM for a new target domain or task is using a supervised
    approach with labeled target data. For instance, using the finetuning II approach
    discussed earlier allows us to adapt a pretrained LLM and finetune it on a target
    task, for example, sentiment classification, using a dataset that contains texts
    with sentiment labels such as “positive,” “neutral,” and “negative.”


    An alternative approach to supervised finetuning is an approach referred to as
    reinforcement learning with human feedback (RLHF). For example, ChatGPT and its
    predecessor InstructGPT^([34](#chap46.xhtml#fn-instruct-gpt-paper)) are two popular
    examples of pretrained LLMs (GPT-3) finetuned using RLHF.


    In RLHF, a pretrained model is finetuned using a combination of supervised learning
    and reinforcement learning – the approach was popularized by the original ChatGPT
    model, which was in turn based on InstructGPT^([35](#chap46.xhtml#fn-instruct-gpt-ref).
    Human feedback is collected by having humans rank or rate different model outputs,
    providing a reward signal. The collected reward labels can then be used to train
    a reward model that is then used to guide the LLMs adaptation to human preferences.
    The reward model is learned via supervised learning (typically using a pretrained
    LLM as base model). Next, the reward model is then used to update the pretrained
    LLM that is to be adapted to human preferences – the training uses a flavor of
    reinforcement learning called proximal policy optimization^([36](#chap46.xhtml#fn-ppo-paper)).
    Why use a reward model instead of training the pretained model on the human feedback
    directly? That’s because involving humans in the learning process would create
    a bottleneck since we cannot obtain feedback in real-time.


    ![Figure 19.8. The reinforcement learning with human feedback (RLHF) process based
    on InstructGPT](resources/figures----transformer-finetuning-rlhf.png)


    Figure 19.8. The reinforcement learning with human feedback (RLHF) process based
    on InstructGPT.


    ## Conclusion


    While finetuning all layers of a pretrained LLM remains the gold standard for
    adaption to new target tasks, several efficient alternatives exist for leveraging
    pretrained transformers. For instance, we can effectively apply LLMs to new tasks
    while minimizing computational costs and resources by utilizing feature-based
    methods, in-context learning, or parameter-efficient finetuning techniques.


    The three conventional methods – feature-based approach, finetuning I, and finetuning
    II – provide different computational efficiency and performance trade-offs. Parameter-efficient
    finetuning methods like soft prompt tuning, prefix tuning, and adapter methods
    further optimize the adaptation process, reducing the number of parameters that
    need to be updated. Reinforcement learning with human feedback (RLHF) presents
    an alternative approach to supervised finetuning, potentially improving modeling
    performance.


    In summary, the versatility and efficiency of pretrained LLMs continue to advance,
    offering new opportunities and strategies for effectively adapting these models
    to a wide array of tasks and domains. As research in this area progresses, we
    can expect further improvements and innovations in using pretrained language models.


    ### > Reader quiz:


    ### 19-A

    When does it make more sense to use in-context learning over finetuning and vice
    versa?


    ### 19-B

    In prefix tuning, adapters, and LoRA, how can we ensure that the model preserves
    (and not forgets) the original knowledge?


    ## Q20. Evaluating Generative Language Models


    ### > Q:

    What are the standard metrics for evaluating the quality of text generated by
    large language models?


    ### > A:

    Perplexity, BLEU, and ROUGE scores are some of the most common evaluation metrics
    used in natural language processing to assess the performance of Large Language
    Models (LLMs) across various tasks.


    Why do we care about metrics? Ultimately, there is no way around human quality
    judgments, but human evaluations are tedious, expensive, hard-to-automate, and
    subjective. Hence, we develop metrics to provide objective summary scores to measure
    progress and compare different approaches.


    ### Overview


    Perplexity is directly related to the loss function used for pretraining LLMs
    and is commonly used to evaluate text generation and text completion models. Essentially,
    it quantifies the average uncertainty of the model in predicting the next word
    in a given context – the lower the perplexity, the better.


    The BLEU (Bilingual Evaluation Understudy) score is a widely used metric for evaluating
    the quality of machine-generated translations. It measures the overlap of n-grams
    between the machine-generated translation and a set of human-generated reference
    translations. A higher BLEU score indicates better performance, ranging from 0
    (worst) to 1 (best).


    The ROUGE (Recall-Oriented Understudy for Gisting Evaluation) score is a metric
    primarily used for evaluating automatic summarization (and sometimes machine translation)
    models. It measures the overlap between the generated summary and reference summaries.

