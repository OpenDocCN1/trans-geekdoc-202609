- raw: "However, one of the main disadvantages of GANs is their unstable training\
    \ due to the adversarial nature of the loss function and learning process. Balancing\
    \ the learning rates of the generator and discriminator can be difficult, and\
    \ it can often result in oscillations, mode collapse, or non-convergence. The\
    \ second main disadvantage of GANs is the low diversity of its generated outputs,\
    \ often due to mode collapse. Here, the generator is able to fool the discriminator\
    \ successfully with a small set of samples., which are only representative of\
    \ a small subset of the original training data.\n\n**Flow-based models**\n\nThe\
    \ core concept of flow-based models, also known as normalizing flows, is inspired\
    \ by longstanding methods in statistics. The primary goal is to transform a simple\
    \ probability distribution (like a Gaussian) into a more complex one using invertible\
    \ transformations.\n\nAlthough the concept of normalizing flows has been a part\
    \ of the statistics field for a long time, the implementation of early flow-based\
    \ deep learning models, particularly for image generation, is a relatively recent\
    \ development. One of the pioneering models in this area was the NICE^([51](#chap46.xhtml#fn-nice-ref))\
    \ approach, which emerged in 2014.  \n\nRelated to VAEs and the generator in GANs,\
    \ the idea behind NICE is to generate complex data (like images) from simple random\
    \ noise. However, how it generates the data from the random noise fundamentally\
    \ differs from VAEs and GANs.\n\nNICE begins with a simple probability distribution,\
    \ often something straightforward like a normal distribution. You can think of\
    \ this as a kind of “random noise” — data with no particular shape or structure.\
    \ NICE then applies a series of transformations to this simple distribution. Each\
    \ transformation is designed to make the data look more like the final target\
    \ (for instance, the distribution of real-world images). These transformations\
    \ are “invertible,” meaning we can always reverse them back to the original simple\
    \ distribution. After several successive transformations, the simple distribution\
    \ has been morphed into a complex distribution that closely matches the distribution\
    \ of the target data (like images). We can now generate new data that looks like\
    \ the target data by picking random points from this complex distribution.\n\n\
    The concept of a flow-based model is illustrated in the figure below. At first\
    \ glance, the illustration is very similar to the VAE illustration above. However,\
    \ while VAEs use a neural network encoder, such as a convolutional neural network,\
    \ the flow-based model uses simpler decoupling layers, such as simple linear transformations.\
    \ Also, while the decoder in a VAE is independent of the encoder, in the flow-based\
    \ model, the data-transforming functions are mathematically inverted to obtain\
    \ the outputs.\n\n![Figure 9.4. Illustration of a flow-based model mapping the\
    \ complext input distribution to a simpler distribution and back.](resources/figures----deep-generative-flow-based.png)\n\
    \nFigure 9.4. Illustration of a flow-based model mapping the complext input distribution\
    \ to a simpler distribution and back.\n\nUnlike VAEs and GANs, flow-based models\
    \ provide exact likelihoods, which gives us insights into how well the generated\
    \ samples fit the training data distribution. This can be useful in anomaly detection\
    \ or density estimation, for example. However, the quality of flow-based models\
    \ for generating image data is usually lower than GANs.  \n\nAlso, flow-based\
    \ models often require more memory and computational resources than GANs or VAEs\
    \ due to their need for storing and computing inverses of transformations.\n\n\
    **Autoregressive models**\n\nAutoregressive models are based on predicting the\
    \ next value based on the current (and past) values. A popular example includes\
    \ large language models for text generation, like ChatGPT, which are covered in\
    \ [Q18](#chap30.xhtml#q18).\n\nSimilar to generating one word at a time, in the\
    \ context of image generation, autoregressive models like PixelCNN^([52](#chap46.xhtml#fn-pixelxcnn-ref))\
    \ try to predict one pixel at a time, given the pixels it has seen so far. The\
    \ order in which pixels are predicted can be from top-left to bottom-right, in\
    \ a raster scan order, or any other defined order.\n\nSuppose we have an image\
    \ of size ![H \\\\times W](resources/leanpub_equation_9.png)(where ![H](resources/leanpub_equation_10.png)is\
    \ the height and ![W](resources/leanpub_equation_11.png)is the width), ignoring\
    \ the color channel for simplicity. This image consists of ![N](resources/leanpub_equation_12.png)pixels,\
    \ ![i=1, ..., N](resources/leanpub_equation_13.png). Now, the probability of observing\
    \ a particular image in the dataset is ![P(Image) = P(i\\_1, i\\_2, ..., i\\_N)](resources/leanpub_equation_14.png).\
    \ And based on the concepts of statistics, we can decompose this joint probability\
    \ into conditional probabilities:\n\n![P(Image) = P(i\\_1, i\\_2, ..., i\\_N)\
    \ = P(i\\_1) \\\\cdot P(i\\_2|i\\_1) \\\\cdot P(i\\_3|i\\_1, i\\_2) \\\\dots P(i\\\
    _N|i\\_1 to i\\_{N-1}).](resources/leanpub_equation_15.png)\n\nHere, ![P(i\\_1)](resources/leanpub_equation_16.png)is\
    \ the probability of the first pixel, `P(i_2|i_1)` is the probability of the second\
    \ pixel given the first pixel, ![P(i\\_3|i\\_1, i\\_2)](resources/leanpub_equation_17.png)is\
    \ the probability of the third pixel given the first and second pixels, and so\
    \ on.\n\nSo, In the context of image generation, an autoregressive model essentially\
    \ tries to predict one pixel at a time, given the pixels it has seen so far, as\
    \ illustrated in the figure below.\n\n![Figure 9.5. Illustration of autoregressive\
    \ pixel generation, where pixels i\\_1 ... i\\_{53} represent the context, and\
    \ pixel i\\_54 is the next pixel to be generated.](resources/figures----deep-generative-autoregressive.png)\n\
    \nFigure 9.5. Illustration of autoregressive pixel generation, where pixels ![i\\\
    _1 ... i\\_{53}](resources/leanpub_equation_18.png)represent the context, and\
    \ pixel ![i\\_54](resources/leanpub_equation_19.png)is the next pixel to be generated.\n\
    \nThe advantage of autoregressive models is that the next-pixel (or word) prediction\
    \ is relatively straightforward and interpretable. In addition, autoregressive\
    \ models can compute the likelihood of data exactly, similar to flow-based models,\
    \ which can be useful for tasks like anomaly detection. Furthermore, autoregressive\
    \ models are easier to train than GANs as they don’t suffer from issues like mode\
    \ collapse and other training instabilities.\n\nThe problem with autoregressive\
    \ models is that they can be slow at generating new samples. This is because they\
    \ have to generate data one step at a time (for example, pixel-by-pixel for images),\
    \ which can be computationally expensive. Then, autoregressive models can also\
    \ struggle to capture long-range dependencies because each output is only conditioned\
    \ on previously generated outputs.\n\nSo, regarding overall image quality, autoregressive\
    \ models are usually worse than GANs, which are harder to train but better than\
    \ the faster flow-based models.\n\n**Diffusion models**\n\nAs discussed in the\
    \ previous section, flow-based models transform a simple distribution (like a\
    \ standard normal distribution) into a complex one (the target distribution) by\
    \ applying a sequence of invertible and differentiable transformations (flows).\n\
    \nSimilar to flow-based models, diffusion models also apply a series of transformations.\
    \ However, the underlying concept is fundamentally different. Diffusion models\
    \ transform the input data distribution into a simple noise distribution over\
    \ a series of steps using stochastic differential equations.\n\nThe diffusion\
    \ processes, is a stochastic process where noise is progressively added to the\
    \ data until it resembles a simpler distribution like Gaussian noise. Then, to\
    \ generate new samples, the process is reversed, starting from noise and progressively\
    \ removing it."
