    \n# Preface\n\nOver the years, I shared countless educational nuggets about machine\
    \ learning and deep learning with hundreds of thousands of people. The positive\
    \ feedback has been overwhelming, and I continue to receive requests for more.\
    \ So, in this book, I want to indulge both your desire to learn and my passion\
    \ for writing about machine learning^([1](#chap46.xhtml#fn-mlabbr)).\n\n## Who\
    \ Is This Book For?\n\nThis book is for people with a beginner or intermediate\
    \ background in machine learning who want to learn something new. This book will\
    \ expose you to new concepts and ideas if you are already familiar with machine\
    \ learning. However, it is not a math or coding book. You won’t need to solve\
    \ any proofs or run any code while reading. In other words, this book is a perfect\
    \ travel companion or something you can read on your favorite reading chair with\
    \ your morning coffee.\n\n## What Will You Get Out of This Book?\n\nMachine learning\
    \ and AI are moving at a rapid pace. Researchers and practitioners are constantly\
    \ struggling to keep up with the breadth of concepts and techniques. This book\
    \ provides bite-sized nuggets for your journey from machine learning beginner\
    \ to expert, covering topics from various machine learning areas. Even experienced\
    \ machine learning researchers and practitioners will encounter something new\
    \ that they can add to their arsenal of techniques.\n\n## How To Read This Book\n\
    \nThe questions in this book are mainly independent, and you can read them in\
    \ any desired order. You can also skip individual questions for the most part.\
    \ However, I organized the questions to bring more structure to the book.\n\n\
    For instance, the first question deals with embeddings, which we refer to in later\
    \ questions on self-supervised learning and few-shot learning. Therefore, I recommend\
    \ reading the questions in sequence.\n\nThe book is structured into five main\
    \ chapters to provide additional structure. However, many questions could appear\
    \ in different chapters without affecting the flow.\n\n*Chapter 1, Deep Learning\
    \ and Neural Networks* covers questions about deep neural networks and deep learning\
    \ that are not specific to a particular subdomain. For example, we discuss alternatives\
    \ to supervised learning and techniques for reducing overfitting.\n\n*Chapter\
    \ 2, Computer Vision* focuses on topics mainly related to deep learning but are\
    \ specific to computer vision, many of which cover convolutional neural networks\
    \ and vision transformers.\n\n*Chapter 3, Natural Language Processing* covers\
    \ topics around working with text, many of which are related to transformer architectures\
    \ and self-attention.\n\n*Chapter 4, Production, Real-World, And Deployment Scenarios*\
    \ contains questions pertaining to practical scenarios, such as increasing inference\
    \ speeds and various types of distribution shifts.\n\n*Chapter 5, Predictive Performance\
    \ and Model Evaluation* dives a bit deeper into various aspects of squeezing out\
    \ predictive performance, for example, changing the loss function, setting up\
    \ *k*\\-fold cross-validation, and dealing with limited labeled data."
