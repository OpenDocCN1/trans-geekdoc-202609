    1Huyen, C. (2022). *Designing Machine Learning Systems.* O’Reilly Media, Inc.[↩](#chap34.xhtml#fnref-stateless)


    2While data-centric AI is a relatively new term, the idea behind it is not new.
    Many readers want to point out that they had used a data-centric approach in their
    projects before the term was coined. In my opinion, data-centric AI was created
    to make “caring about data quality” attractive again – data collection and curation
    is often considered tedious or thankless. This is analogous to how the term *deep
    learning* made neural networks attractive again.[↩](#chap35.xhtml#fnref-data-centric)


    3In the paper “A Few More Examples May Be Worth Billions of Parameters” (https://arxiv.org/abs/2110.04374),
    the researchers found that increasing the model size usually improves performance,
    but so does the addition of training examples. Assuming small training sets (<2k)
    for classification, extractive question answering, and multiple choice tasks,
    adding 100 examples can result in the same performance gain as adding billions
    of parameters.[↩](#chap35.xhtml#fnref-a-few-more-examples)


    4BLAS stands for Basic Linear Algebra Subprograms ([https://en.wikipedia.org/wiki/Basic\_Linear\_Algebra\_Subprograms](https://en.wikipedia.org/wiki/Basic_Linear_Algebra_Subprograms))
    and is a specification that prescribes a set of low-level routines for performing
    common linear algebra operations such as vector addition, scalar multiplication,
    dot products, matrix multiplication, and others. Many array and deep learning
    libraries like NumPy and PyTorch use BLAS under the hood.[↩](#chap36.xhtml#fnref-blas)


    5[https://en.wikipedia.org/wiki/Loop\_nest\_optimization](https://en.wikipedia.org/wiki/Loop_nest_optimization)[↩](#chap36.xhtml#fnref-loop-tiling)


    6In RepVGG, for example, each branch during training consists of a series of convolutions.
    Once training is complete, the model is reparameterized into a single sequence
    of convolutions. For more details, see Ding, Zhang, Ma, Han, Ding, and Sun (2021).
    *RepVGG: Making VGG-style ConvNets Great Again* [https://arxiv.org/abs/2101.03697](https://arxiv.org/abs/2101.03697).[↩](#chap36.xhtml#fnref-repvgg)


    7Dettmers, Lewis, Belkada, and Zettlemoyer (2022). *LLM.int8(): 8-bit Matrix Multiplication
    for Transformers at Scale*, [https://arxiv.org/abs/2208.07339](https://arxiv.org/abs/2208.07339).[↩](#chap36.xhtml#fnref-8bit-quantized)


