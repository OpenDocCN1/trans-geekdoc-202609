- raw: '**Vectorization**


    Vectorization refers to performing operations on entire data structures, such
    as arrays (tensors) or matrices, in a single step rather than using iterative
    constructs like for-loops. Ysing vectorization, multiple operations from the loop
    are performed simultaneously using SIMD (Single Instruction, Multiple Data) instructions
    that are available on most modern CPUs. This approach takes advantage of the low-level
    optimizations in many computing systems (such as BLAS^([4](#chap46.xhtml#fn-blas)))
    and often results in signficant speed-ups.


    For example, suppose we wanted to compute the dot product between two vectors.
    The non-vectorized way of doing this would be to use a for-loop, iterating over
    each element of the arrays one by one. However, this can be quite slow, especially
    for large arrays. With vectorization, you can perform the dot product operation
    on the entire arrays at once as shown in the figure below.


    ![Illustration of a classic for-loop versus a vectorized dot product computation
    in Python.](resources/figures----inference-optmization-vectorization.png)


    Illustration of a classic for-loop versus a vectorized dot product computation
    in Python.


    In the context of linear algebra or deep learning frameworks like TensorFlow or
    PyTorch, vectorization is typically done automatically. This is because these
    frameworks are designed to work with multi-dimensional arrays (also known as tensors),
    and their operations are inherently vectorized. This means that when you perform
    functions using these frameworks, you automatically leverage the power of vectorization,
    resulting in faster and more efficient computations.


    **Loop tiling**


    Loop tiling (also often referred to as *loop nest optimization*^([5](#chap46.xhtml#fn-loop-tiling)))
    is an advanced optimization technique to enhance data locality by breaking down
    a loop’s iteration space into smaller chunks or “tiles.” This ensures that once
    data is loaded into cache, all possible computations are performed on it before
    it is cleared.


    The concept of loop tiling for accessing elements in a 2-dimensional array is
    illustrated in the figure below. In a regular for-loop, we iterate over columns
    and rows one element at a time, whereas in loop tiling, we subdivide the array
    into smaller tiles.


    ![Illustration of loop tiling for a 2-dimensional array.](resources/figures----inference-optmization-loop-tiling.png)


    Illustration of loop tiling for a 2-dimensional array.


    Note that in high-level languages, such as Python, we don’t usually perform loop
    tiling because Python does not allow control over the cache memory like lower
    level languages such as C or C++. These kinds of optimizations are often handled
    by underlying libraries like NumPy or PyTorch when performing operations on large
    arrays.


    **Operator fusion**


    Operator fusion, sometimes called loop fusion, is an optimization technique that
    combines multiple loops into a single loop. This is illustrated in the figure
    below, where two separate loops to calculate the sum and the product of an array
    of numbers are fused into a single loop.


    ![Illustration of operator fusion, fusing two for loops (left) into one (right).](resources/figures----inference-optmization-fusion.png)


    Illustration of operator fusion, fusing two for loops (left) into one (right).


    This can improve the performance of a model by reducing the overhead of loop control,
    decreasing memory access times by improving cache performance, and possibly enabling
    further optimizations through vectorization.


    Doesn’t this contradict the concept of loop tiling earlier, where we break down
    a for-loop into multiple loops? However, they are complementary techniques used
    for different optimizations, and they are applicable in different situations.
    Operator fusion is about reducing the total number of loop iterations and improving
    data locality when the entire data fits into cache. Loop tiling is about improving
    cache utilization when dealing with larger multi-dimensional arrays that do not
    fit into cache.


    Related to operator fusion is the concept of reparameterization, which can often
    also be used to simplify multiple operations into one. Popular examples include
    training a network with multi-branch architectures that are reparameterized into
    single-stream architectures during inference^([6](#chap46.xhtml#fn-repvgg)). This
    reparameterization approach differs from traditional operator fusion as it does
    not merge multiple operations into a single operation. Instead, it rearranges
    the operations in the network to create a more efficient architecture for inference.


    **Quantization**


    Quantization reduces the computational and storage requirements of machine learning
    models, particularly deep neural networks. This technique involves converting
    the continuous, floating-point numbers representing weights and biases in a trained
    neural network to discrete, lower-precision representations such as integers.Using
    less precision reduces the model size and makes it quicker to execute, which can
    lead to significant improvements in speed and hardware efficiency during inference.


    In the realm of deep learning, it has become increasingly common to quantize trained
    models down to 8-bit^([7](#chap46.xhtml#fn-8bit-quantized)) and 4-bit^([8](#chap46.xhtml#fn-4bit-quantized))
    integers. This technique is especially prevalent in the deployment of large language
    models, for instance.


    There are two main categories of quantization. For instance, in post-training
    quantization, the model is first trained normally with full-precision weights,
    and then the weights are quantized after training. Quantization-aware training,
    on the other hand, introduces the quantization step during the training process.
    This allows the model to learn to compensate for the effects of quantization,
    which can help maintain the model’s accuracy.


    However, it’s important to note that quantization can occasionally lead to a reduction
    in model accuracy, which is why it is not as good a fit to answer the original
    question as the other categories above.


    **\> Reader quiz:**


    **23-A**


    [Q7](#chap18.xhtml#q7) covered several different multi-GPU training paradigms
    to speed up the model training. Using multiple GPUs can, in theory, also speed
    up model inference. However, in practice, there are several reasons why this approach
    is often not the most efficient or practical one. Can you think of what these
    reasons are?


    **23-B**


    Vectorization and loop tiling (or loop blocking) are two different strategies
    for optimizing operations that involve accessing array elements. When would you
    use which?


    # Chapter 5. Predictive Performance and Model Evaluation


    ## Q25. Poisson and Ordinal Regression


    **\> Q**:


    Consider *Poisson regression* and *ordinal regression*; when do we use which over
    the other?


    **\> A:**


    Usually, we use Poisson regression is for when the target variable represents
    count data^([1](#chap46.xhtml#fn-poisson)) (positive integers). As an example
    of count data, consider the number of colds contracted on an airplane or the number
    of guests visiting a restaurant on a given day.


    ![Figure 25.1. An illustration of ordinal labels](resources/figures----ordinal.png)


    Figure 25.1. An illustration of ordinal labels


    Ordinal data is a subcategory of categorical data where the categories have a
    natural order, for example, 3 > 2 > 1. Ordinal data is often represented as positive
    integers and may look similar to count data. For example, consider the star rating
    on Amazon (1 star, 2 stars, 3 stars, etc.). However, ordinal regression does not
    make any assumptions about the distance between the ordered categories. As another
    example of ordinal data, consider disease severity, *severe > moderate > mild
    > none*. While we typically map the disease severity variable to an integer representation
    (4 > 3 > 2 > 1), there is no assumption that the distance between 4 and 3 (severe
    and moderate) is the same as the distance between 2 and 1 (mild and none).'
