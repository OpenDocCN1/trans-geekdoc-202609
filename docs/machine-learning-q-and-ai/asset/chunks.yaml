    我们可以将困惑度（Perplexity）视为一种内在指标，而将 BLEU 和 ROUGE 视为外部指标。为了说明内在与外部指标之间的区别，可以考虑优化交叉熵来训练图像分类器。交叉熵是我们在训练过程中优化的损失函数，但我们的最终目标是最大化分类准确率。由于分类准确率在训练期间无法直接优化——它是不可微的——因此我们最小化像交叉熵这样的代理损失函数。最小化交叉熵损失在某种程度上与最大化分类准确率相关。


    困惑度通常被用作评估指标来比较不同语言模型的性能，但它不是训练期间的优化目标。BLEU 和 ROUGE 与准确率更为相关，或者说更精确率和召回率。事实上，BLEU
    是一种基于精确率的评分，用于评估翻译文本的质量。ROUGE 则是一种基于召回率的评分，用于评估摘要文本。


    接下来的段落将详细讨论这些指标的机制。


    ### 困惑度 (Perplexity)


    困惑度与训练过程中直接最小化的交叉熵密切相关，这就是为什么我们将困惑度视为一种内在指标。


    困惑度的定义为 ![2^{H(p, q) / n},](img/leanpub_equation_76.png)，其中 ![H(p, q)](img/leanpub_equation_77.png)是真实单词分布
    ![p](img/leanpub_equation_78.png)与预测单词分布 ![q.](img/leanpub_equation_79.png)之间的交叉熵。随着交叉熵的减少，困惑度也随之降低——困惑度越低越好。![n](img/leanpub_equation_80.png)是句子长度（单词或标记的数量），用于对得分归一化。


    在实践中，由于目标句子每个每个单词的概率总是 1，我们将交叉熵计算为要评估的模型返回的概率得分的对数。换句话说，如果我们有句子中每个单词的预测概率得分 ![s,](img/leanpub_equation_81.png)，我们可以直接按照如下方式计算困惑度：


    ```

    Perplexity(s) = 2^{-\frac{1}{n} \log\_2 (p(s))}.

    ```


    在上述公式中：


    * ![s](img/leanpub_equation_83.png)是我们要评估的句子或文本，例如，“The quick brown fox jumps
    over the lazy dog”；

    * ![p(s)](img/leanpub_equation_84.png)是模型返回的概率得分；

    * ![n](img/leanpub_equation_85.png)是单词或标记的数量。


    例如，如果模型返回以下概率得分，


    ![\[0.99, 0.85, 0.89, 0.99, 0.99, 0.99, 0.99, 0.99\],](resources/leanpub_equation_86.png)，


    困惑度为：


    ```

    2^{-\frac{1}{8} \sum\_i \log\_2 p(w\_i)} = 2^{- 1/8 \cdot \sum \log\_2 (0.99 *
    0.85 * 0.89 * 0.99 * 0.99 * 0.99 * 0.99 * 0.99 )}

    ```


    如果句子是“The fast cat jumps over the lazy dog”，概率为 ![0.99, 0.65, 0.13, 0.05, 0.21,
    0.99, 0.99],](resources/leanpub_equation_90.png)，对应的困惑度为 ![2.41.](img/leanpub_equation_91)。


    高困惑度表示语言模型在预测序列中下一个单词的效果较差，意味着预测的不确定性更大。我们追求在语言模型中获得低困惑度，因为它表明预测下一个单词的性能更好，反映了对模式和语境更准确的理解。


    ### BLEU 分数


    BLEU 是评估翻译文本最流行且应用广泛的指标。它几乎用于所有能够翻译的大语言模型，包括 OpenAI 的 Whisper 和 GPT 等流行工具，因此讨论它的工作原理是值得的。BLEU
    最初是为了捕捉人类评估的精髓而开发的；原始论文论文发现它与人类评估具有高度相关性。


    BLEU 是一种基于参考的指标，将模型输出与人类生成的参考文本进行比较。简而言之，BLEU 基于精确率得分衡量模型输出与人类生成参考文本之间的词汇重叠。


    那么，它具体是如何工作的？作为一种基于精确率的指标，BLEU 计算生成文本（候选文本）中出现在参考文本中的单词数量，除以参考文本的长度，其中参考文本是由人类提供的样本翻译。通常不是使用单个单词，而是针对
    n 语法（n-grams）进行，但为了简单起见，我们将坚持单词或 1 语法。


    例如，如果模型返回以下概率得分，


    ![\[0.99, 0.85, 0.89, 0.99, 0.99, 0.99, 0.99, 0.99\],](resources/leanpub_equation_86.png)，


    困惑度为：


    ```

    2^{-\frac{1}{8} \sum\_i \log\_2 p(w\_i)} = 2^{- 1/8 \cdot \sum \log\_2 (0.99)}

    ```


    如果句子是“The fast cat jumps over the lazy dog”，概率为 ![0.99, 0.65, 0.13, 0.05, 0.21,
    0.99, 0.99],](resources/leanpub_equation_90.png)，对应的困惑度为 ![2.41.](img/leanpub_equation_91)。


    高困惑度表示语言模型在预测序列中下一个单词的效果较差，意味着预测的不确定性更大。我们追求在语言模型中获得低困惑度，因为它表明预测下一个单词的性能更好，反映了对模式和语境更准确的理解。


    ### BLEU 分数


    BLEU 是评估翻译文本最流行且应用广泛的指标。它几乎用于所有能够翻译的大语言模型，包括 OpenAI 的 Whisper 和 GPT 等流行工具，因此讨论它的工作原理是值得的。BLEU
    最初是为了捕捉人类评估的精髓而开发的；原始论文论文发现它与人类评估具有高度相关性。


    BLEU 是一种基于参考的指标，将模型输出与人类生成的参考文本进行比较。简而言之，BLEU 基于精确率得分衡量模型输出与人类生成参考文本之间的词汇重叠。


    那么，它具体是如何工作的？作为一种基于精确率的指标，BLEU 计算生成文本（候选文本）中出现在参考文本中的单词数量，除以参考文本的长度，其中参考文本是由人类提供的样本翻译。通常不是使用单个单词，而是针对
    n 语法（n-grams）进行，但为了简单起见，我们将坚持单词或 1 语法。BLEU 分数的计算总结在如下所示，感兴趣的读者还可以在补充材料中找到代码实现（https://github.com/rasbt/MachineLearning-QandAI-book）。


    图 20.1 1 语法 BLEU 分数的计算演示。（在实践中，BLEU 通常针对 4 语法计算。）


    BLEU 有几个缺点，主要归因于 BLEU 衡量的是相似性，而单的相似性不足以捕捉质量。此外，由于 BLEU 依赖于精确字符串匹配，它对词汇变化敏感，无法识别使用同义词或改写的语义相似翻译。换句话说，BLEU
    可能对准确且有意义的翻译给出较低分。


    BLEU 有缺陷吗？是的。它仍然有用吗？也是。BLEU 是衡量或评估模型在训练期间是否改进的有效工具——它是流畅性的代理。然而，它并不适合对生成的翻译质量给出正确评估，也不适合检测问题。换句话说，将其作为模型选择工具，而不是模型评估工具。


    ### ROUGE 分数


    BLEU 通常用于翻译任务，而 ROUGE 是文本摘要评分的流行指标。BLEU 和 ROUGE 之间有很多相似之处。基于精确率的 BLEU 分数检查候选翻译中出现在参考翻译中的单词数量。ROUGE
    分数采用了相反的方法，检查参考文本中出现在生成文本（这里通常是摘要而非翻译）中的单词——这被解释为基于召回率的评分。


    现代实现将 ROUGE 计算为 F1 分数，它是召回率（参考中出现在候选文本中的单词）和精确率（候选文本中出现在参考文本中的单词）的调和平均值，如图所示。


