- raw: "If you are not reading this book for entertainment but for machine learning\
    \ interview preparation, you may prefer a spoiler-free look at the questions to\
    \ quiz yourself before reading the answers. In this case, you can find a list\
    \ of all questions, without answers, in the appendix.\n\n## Discussion Forum\n\
    \nThe best way to ask questions about the book is the discussion forum at [https://community.leanpub.com/c/machine-learning-q-a](https://community.leanpub.com/c/machine-learning-q-a).\
    \ Please feel free to ask anything about the book, share your thoughts, or just\
    \ introduce yourself!\n\n## Sharing Feedback and Supporting This Book\n\nI enjoy\
    \ writing, and it is my pleasure to share this knowledge with you.\n\nIf you obtained\
    \ a free copy and like this book, you can support me by buying a digital copy\
    \ on Leanpub at [https://leanpub.com/machine-learning-q-and-ai/](https://leanpub.com/machine-learning-q-and-ai/).\n\
    \nFor an author, there is nothing more valuable than your honest feedback. I would\
    \ really appreciate hearing from you and appreciate any reviews! And, of course,\
    \ I would be more than happy if you recommend this book to your friends and colleagues\
    \ or share some nice words on your social channels.\n\n## Acknowledgements\n\n\
    Writing a book is an enormous undertaking. This project would not have been possible\
    \ without the help of the open source and machine learning communities who collectively\
    \ created the technologies that this book is about. Moreover, I want to thank\
    \ everyone who encouraged me to share my flashcard decks, as this book is an improved\
    \ and polished version of these.\n\nI also want to thank the following readers\
    \ for helpful feedback on the manuscript:\n\n*   Anton Reshetnikov for suggesting\
    \ a cleaner layout for the supervised learning flowchart in Q30.\n\n## About the\
    \ Author\n\n![](resources/figures----author-bio.jpg)\n\nSebastian Raschka is a\
    \ machine learning and AI researcher with a strong passion for education. As Lead\
    \ AI Educator at Lightning AI, he is excited about making AI and deep learning\
    \ more accessible and teaching people how to utilize these technologies at scale.\
    \  \n\nBefore dedicating his time fully to Lightning AI, Sebastian held a position\
    \ as Assistant Professor of Statistics at the University of Wisconsin-Madison,\
    \ where he specialized in researching deep learning and machine learning. You\
    \ can find out more about his research on his website^([2](#chap46.xhtml#fn-website)).\
    \  \n\nMoreover, Sebastian loves open-source software and has been a passionate\
    \ contributor for over a decade. Next to coding, he also loves writing and authored\
    \ the bestselling *Python Machine Learning* book and *Machine Learning with PyTorch\
    \ and Scikit-Learn*.\n\nIf you like to find out more about Sebastian and what\
