  trans: '


    原始 transformer 中的编码器部分（如上图所示）负责从输入文本中理解并提取相关信息。它随后输出输入文本的连续表示（嵌入），并将其传递给解码器。最后，解码器根据从编码器接收的连续表示生成翻译后的文本（目标语言）。


    年来，人们基于上述原始 transformer 模型的编码器模块，开发了各种仅编码器（encoder-only）架构。著名的例子包括 `BERT`^(18)
    和 `RoBERTa`^(19)。


    `BERT`（**B**irectional **E**ncoder **R**epresentations from **T**ransformers）是一种基于
    Transformer 编码器模块的仅编码器架构。`BERT` 模型在大规模文本语料库上通过掩码语言模型（如下所示）和下一句预测任务进行预训练。


    ![Figure 18.2. BERT-style transformers 中使用的掩码语言模型预训练目标图。](img/figures----encoder-decoder-masked.png)


    图 18.2. BERT-style transformers 中使用的掩码语言模型预训练目标图。


    掩码语言模型的核心思想是对输入序列中的随机词标记进行掩码（或替换），然后训练模型根据周围的上下文预测原始的被掩码标记。


    除了上图所示的掩码语言模型预训练任务外，下一句预测任务要求模型预测原始文档中两个随机打乱的句子顺序是否正确。例如，两个随机顺序排列的句子由 `[SEP]`
    标记隔开：


    * `[CLS]` 吐司是一种简单又美味的食物 `[SEP]` 它通常配黄油、果酱或蜂蜜一起吃。

    * `[CLS]` 它通常配黄油、果酱或蜂蜜一起吃 `[SEP]` 吐司是一种简单又美味的食物。


    `[CLS]` 标记是模型的占位符，提示模型返回 `True` 或 `False` 标签，以指示句子顺序是否正确。


    掩码语言和下一句预训练目标^(20) 让 `BERT` 能够学习输入文本丰富的上下文表示，然后可以进行微调以用于各种下游任务，如情感分析、问答和命名实体识别。


    `RoBERTa`（**R**obustly **o**ptimized **BERT** **a**pproach）是 `BERT` 的优化版本。它保持与
    `BERT` 相同的整体架构，但采用了若干训练和优化改进，例如更大的批大小、更多的训练数据以及消除下一句预测任务。这些变化使得 `RoBERTa` 在各种自然语言理解任务上的性能优于
    `BERT`。


    ## 解码器


    回到本节开始提到的原始 transformer 架构，解码器中的多头自注意力机制与编码器中的类似，但它是经过掩码的（masked），以防止模型关注未来的位置，确保对位置
    `i` 的预测仅依赖于小于 `i` 的位置上的已知输出。如下所示，解码器逐词生成输出。


    ![Figure 18.3. 原始 transformer 中使用的下一句预测任务图。](img/figures----encoder-decoder-nextword.png)


    图 18.3. 原始 transformer 中使用的下一句预测任务图。


    这种掩码（图中显式显示，尽管它在解码器的多头自注意力机制中内部发生）对于在训练和推理期间维持 transformer 模型的自回归属性（autoregressive
    property）至关重要。自回归属性确保模型一次生成一个输出标记，并使用之前生成的标记作为生成下一个词标记的上下文。


    多年来，研究人员在原始编码器-解码器 transformer 架构的基础上，开发了多种仅解码器（decoder-only）模型，这些模型被证明在各种自然语言处理任务中非常有效。最著名的模型包括
    `GPT` 家族。


    `GPT`（**G**enerative **P**re-trained **T**ransformer）系列在大规模无监督文本数据上预训练的仅解码器模型，并针对特定任务进行微调，如文本分类、情感分析、问答和摘要。`GPT`
    模型包括 `GPT-2`、`GPT-3`^(21) 以及最新的 `GPT-4`，在各种基准测试中展现出了卓越性能，目前是自然语言处理中最流行的架构。


    `GPT` 模型最显著的特点之一是它们的涌现属性（emergent properties）。涌现属性是指模型由于其下一个词预测预训练而发展的能力和技能。尽管这些模型只被教导预测下一个词，但预训练模型能够执行文本摘要、翻译、总结、问答、分类等任务。此外，这些模型可以通过上下文学习（in-context
    learning）在不更新模型参数的情况下执行新任务，这在 Q19 中进行了详细讨论。


    ## 编码器-解码器混合模型


    除了传统的编码器和解码器架构外，新型编码器-解码器模型的发展取得了进展，利用了这两个组件的优势。这些模型通常结合了新技术、预训练目标或架构改进，以增强它们在各种自然语言处理任务中的性能。这些新型编码器-解码器模型的显著例子包括
    `BART`^(22) 和 `T5`^(23)。


    编码器-解码器模型通常用于涉及理解输入序列并生成输出序列（通常具有不同的长度和结构）的自然语言任务。它们对于输入输出序列之间存在复杂映射、且捕捉两个序列元素之间关系的任务特别有效。编码器-解码器模型的常见用例包括文本翻译和摘要。


    ## 术语与行话


    所有这些方法（仅编码器、仅解码器和编码器-解码器模型）都是序列序列模型（通常缩写为 `seq2seq`）。注意，尽管我们将 BERT 类的方法称为仅编码器，但
    `仅编码器` 的描述可能会产生误导，因为这些方法在预训练期间也会将嵌入解码为输出标记或文本。


    换句话说，仅编码器和仅解码器架构都在“解码”。然而，与仅解码器和编码器-解码器架构不同，仅编码器架构不是以自回归方式解码的。自回归解码指的是每次生成一个标记，每个标记都取决于之前生成的标记。仅编码器模型不以这种方式生成连贯的输出序列。相反，它们专注于理解输入文本并产生特定特定输出，例如标签或标记预测。


    ## 总结


    简而言之，编码器模型用于学习用于分类任务的嵌入；编码器-解码器模型用于输出高度依赖于输入的生成式任务（例如翻译和摘要）；而仅解码器模型则用于其他类型的生成式任务，包括问答。自第一个
    transformer 架构出现以来，已经开发了数百种仅编码器、仅解码器和编码器-解码器混合模型，如下所示。


    '
