  trans: '

    通过插图来总结普通注意力机制与自注意力机制之间的区别可能是最简单的。下图描述了最初为 `RNNs` 设计的用于处理长序列的注意力机制(13)。


    ![图 17.1. 注意力机制插图，最初是为 RNN 设计的。值 alpha_{2,T} 到 alpha_{2,T} 表示第二个序列元素与从 1 到 T 的序列中每个其他元素的注意力权重。](img/figures----attention-rnn.png)


    图 17.1. 注意力机制插图，最初是为 `RNNs` 设计的。值 ![alpha_{2,T} 到](img/leanpub_equation_57.png)![alpha_{2,T}](img/leanpub_equation_58.png)
    表示第二个序列元素与到 *T* 的序列中每个其他元素的注意力权重。


    如上图所示，为 `RNNs` 开发的原始注意力机制涉及两个 `RNNs`。底部的计算权重的 `RNN` 代表编码器部分。顶部的生成输出序列的 `RNN` 是解码器。


    核心结论是，为 `RNNs` 开发的原始注意力机制应用于两个不同的序列之间，即编码器嵌入和解码器嵌入。注意，对于每个生成的输出序列元素，顶部的解码器 `RNN`
    都基于一个隐藏状态加上一个由编码器生成的上下文向量。该上下文向量涉及输入序列的*所有*元素。该上下文向量是所有输入元素的加权和，其中注意力分数 (![\alpha''s](img/leanpub_equation_59.png))
    代表权重系数。这允许解码器在每一步中访问所有输入序列元素（上下文）。关键思想是，注意力权重（和上下文）在每一步可能会不同并动态变化。


    这种复杂的设置的动力是什么？这种编码器-解码器设计背后的原因是，我们不能逐单词翻译句子。如下所示 `RNN` 架构 A 所示，这会导致输出在语法上是不正确的。


    ![图 17.2. 用于句子翻译的两种不同序列到序列 RNN 设计插图。子图 A 表示普通的序列到序列 RNN，可用于逐词将德语句子翻译成英语。子图 B 描述了一个编码器-解码器
    RNN，它在翻译之前先读取整个句子。](img/figures----attention-rnn-reason.png)


    图 17.2. 用于句子翻译的两种不同序列到序列 `RNN` 设计插图。子图 A 表示普通的序列到序列 `RNN`，可用于逐词将德语句子翻译成英语。子图 B
    描述了一个编码器-解码器 `RNN`，它在翻译之前先读取整个句子。


    子图 A 所示的 `RNN` 架构设置更适用于时间序列任务，我们希望一次进行一次预测，例如每天预测特定的股票价格。对于语言翻译等任务，我们通常选择上方子图
    B 所示的编码器-解码器 `RNN`。在这里，`RNN` 编码输入句子，将其存储在中间隐藏表示中，然后生成输出句子。然而，这创建了一个瓶颈，`RNN` 必须通过单个隐藏状态记住整个输入句子，这对于长序列并不有效。


    上述瓶颈促成了注意力机制最初的设计，允许解码器部分在每个时间步访问输入句子中的所有元素。注意力分数根据解码器生成的当前单词，为不同的输入元素赋予不同的权重。例如，在输出序列中生成单词“help”时，德语输入句子中的单词“helfen”可能会获得较大的注意力权重，因为它在该语境下高度相关。


    ## 自注意力


    在上面讨论的用于 RNN 的注意力机制大约三年后，研究人员询问是否真的需要 `RNN` 骨干。这导致了原始 transformer 架构和自注意力机制的设计(14)。


    在自注意力中，注意力机制应用于同一序列中的所有元素之间（而不是涉及两个序列）。这在底部的简化注意力机制所示。与 `RNNs` 的注意力机制类似，上下文向量是输入序列元素的注意力加权和。


    ![图 17.3. 不带权重矩阵的简单自注意力机制。](img/figures----attention-self.png)


    图 17.3. 不带权重矩阵的简单自注意力机制。


    虽然上图描述了一个没有权重矩阵的简单注意力机制，但 transformer 中使用的自注意力机制通常涉及多个计算注意力重的权重矩阵。此外，交叉注意力是自注意力的一种形式，可以应用于不同的
    (15)。


    **读者测验：**


    **17-A**

    考虑到自注意力将每个序列元素与其自身进行比较，自注意力的的时间和内存复杂度是多少？


    **17-B**

    我们在自然语言处理的背景下讨论了自注意力。这种机制对计算机视觉应用也有用吗？


    ## 18. 编码器与解码器风格的 Transformer


    **Q:**

    基于编码器和基于解码器的 transformer 之间有什么区别？


    **A:**

    从根本上说，，编码器和解码器架构都使用相同的自注意力层来编码单词。然而，主要区别在于编码器设计用于学习用于分类等各种预测任务的嵌入。相比之下，解码器设计用于生成新文本，例如回答用户问题。


    ### 原始 Transformer


    原始 transformer 架构(16) 是为英语到法语和英语到德语的语言翻译开发的，它同时使用了编码器和解码器，如下所示。


    ![图 18.1. 原始 transformer 架构插图。](img/figures----encoder-decoder-transformer.png)


    图 18.1. 原始 transformer 架构插图。


    在图中，输入文本（即待翻译文本的句子）首先被分词为单个单词标记，然后通过嵌入层(17) 编码，然后进入解码器部分。然后，在每个嵌入单词添加位置编码向量后，嵌入通过多头自注意力层。多头注意力层之后是
    `Add & normalize` 步骤，该步骤执行层归一化并通过跳跃连接（也称为残差连接或快捷连接）添加原始嵌入。最后，在进入 `全连接层`（这是一个由两个带有中间非线性激活函数的全连接层组成的小型多层感知器）之后，输出再次被相加并归一化，然后传递到解码器部分的多头自注意力层。


    **编码器**


