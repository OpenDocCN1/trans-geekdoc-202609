- raw: '![Figure 12.1. A fully connected layers with four inputs and two outputs.](resources/figures----fc-cnn-equivalent-1.png)


    Figure 12.1. A fully connected layers with four inputs and two outputs.


    The fully connected layer in the figure above consists of eight weights and two
    bias units. The first output node can be computed via the following dot product:
    ![w\_{1, 1} \\times x\_1 + w\_{1, 2} \\times x\_2 + w\_{1, 3} \\times x\_3 + w\_{1,
    4} \\times x\_4 + b\_1.](resources/leanpub_equation_41.png)Analagously, we can
    compute the second output unit via ![w\_{2, 1} \\times x\_1 + w\_{2, 2} \\times
    x\_2 + w\_{2, 3} \\times x\_3 + w\_{2, 4} \\times x\_4 + b\_2](resources/leanpub_equation_42.png).


    **Scenario 1: The kernel size is equal to the input size**


    Let us start with the first scenario: the size of the convolutional filter is
    equal to the size of the receptive field. Recall from [Q11](#chap23.xhtml#q11)
    how we compute a number of parameters in a convolutional kernel with one input
    channel and multiple output channels. We have a kernel size of ![2\\times 2,](resources/leanpub_equation_43.png)one
    input channel, and two output channels. The input size is also `2\times 2`,$ a
    reshaped version of the four inputs depicted in the previous figure.


    ![Figure 12.2. A convolutional layer with a 2times2 kernel that equals the input
    size and two output channels.](resources/figures----fc-cnn-equivalent-2.png)


    Figure 12.2. A convolutional layer with a ![2times2](resources/leanpub_equation_44.png)kernel
    that equals the input size and two output channels.


    If the convolutional kernel dimensions equal the input size, as depicted in the
    figure above, there is no sliding-window mechanism in the convolutional layer.
    For the first output channel, we have the set of weights


    ![\\mathbf{W}\_1 = \\begin{bmatrix} w\_{1, 1} & w\_{1, 2}\\\\ w\_{1, 3} & w\_{1,
    4} \\end{bmatrix}.](resources/leanpub_equation_45.png)


    And for the second output channel, we have the set of weights


    ![\\mathbf{W}\_2 = \\begin{bmatrix} w\_{2, 1} & w\_{2, 2}\\\\ w\_{2, 3} & w\_{2,
    4} \\end{bmatrix} ](resources/leanpub_equation_46.png)


    If the inputs are organized as


    ![\\mathbf{x} = \\begin{bmatrix} x\_{1} & x\_{2}\\\\ x\_{3} & x\_{4} \\end{bmatrix},](resources/leanpub_equation_47.png)


    we calculate the first output channel as ![o\_1 = \\sum\_i(W\_1 \* \\mathbf{x})\_i
    + b\_1,](resources/leanpub_equation_48.png)where the comvolutional operator ![\*](resources/leanpub_equation_49.png)is
    equal to an element-wise multiplication. In other words, we have an element-wise
    multiplication between two matrices, ![W\_1](resources/leanpub_equation_50.png)and
    ![\\mathbf{x},](resources/leanpub_equation_51.png)and then compute the output
    as the sum over these elements. Note that this equals the dot product in the fully
    connected layer. And lastly, we add the bias unit. The computation for the second
    output channel works analogously: ![o\_2 = \\sum\_i(W\_2 \* \\mathbf{x})\_i +
    b\_2.](resources/leanpub_equation_52.png)^([3](#chap46.xhtml#fn-scenario1))


    **Scenario 2: The kernel has size one**


    The second scenario assumes that we reshape the input into an input “image” with
    ![1\\times1](resources/leanpub_equation_53.png)dimensions where the number of
    “color channels” equals the number of input features as depicted in the figure
    below.


    ![Figure 12.3. A convolutional layer with a 1times1 kernel with four input and
    two output channels.](resources/figures----fc-cnn-equivalent-3.png)


    Figure 12.3. A convolutional layer with a ![1times1](resources/leanpub_equation_54.png)kernel
    with four input and two output channels.


    Each kernel consists of a stack of weights equal to the number of input channels.
    For instance, for the first output layer, the weights are ![\\mathbf{W}\_1 = \[
    w^{(1)}\_{1} w^{(2)}\_{1} w^{(3)}\_{1} w^{(4)}\_{1}\],](resources/leanpub_equation_55.png)and
    the weights for the second channel are ![\\mathbf{W}\_2 = \[ w^{(1)}\_{2} w^{(2)}\_{2}
    w^{(3)}\_{2} w^{(4)}\_{2}\].](resources/leanpub_equation_56.png)


    To get a better visual for this computation, it can be useful to check out [Q11](#chap23.xhtml#q11)^([4](#chap46.xhtml#fn-scenario2)).


    **How is this useful?**


    The fact that fully connected layers can be implemented as equivalent convolutional
    layers does not have immediate performance or other advantages. Still, it aids
    in understanding the mechanics of these layers. However, there may be special
    cases where hardware is better optimized for carrying out one operation over the
    other. Furthermore, if one so desires, it lets us implement convolutional neural
    networks without any use of fully connected layers.


    **Reader quiz:**


    **12-1**


    How would increasing the stride affect the equivalence discussed above?


    **12-2**


    Does padding affect the equivalence between fully connected layers and convolutional
    layers?


    ## Q13. Large Training Sets for Vision Transformers


    **\> Q:**


    Why do vision transformers (ViTs) generally require larger training sets than
    convolutional neural networks (CNNs)?


    **\> A:**


    Each machine learning algorithm and model encodes a particular set of assumptions
    or prior knowledge in its design. These assumptions are also commonly referred
    to as inductive biases. Some inductive biases are workarounds to make algorithms
    computationally more feasible, others are based on domain knowledge, and some
    are both.


    CNNs have more inductive biases that are hard-coded as part of the algorithmic
    design, so they generally require less training data than ViTs. In a sense, ViTs
    are given more degrees of freedom and can or must learn certain inductive biases
    from the data (assuming that these biases are conducive to optimizing the training
    objective). But everything that needs to be learned requires more training examples.


    **Inductive biases**


    To better understand the inductive biases in CNNs, let us list the main ones below.


    1.  Local connectivity. In CNNs, each unit in a hidden layer is connected to only
    a subset of neurons in the previous layer. We can justify this restriction by
    assuming that neighboring pixels are more relevant to each other than pixels that
    are farther apart. Intuitively, we can think of this assumption in the context
    of recognizing edges or contours in an image.


    2.  Weight sharing. Via the convolutional layers, we use the same small set of
    weights (the kernels or filters) throughout the whole image. This reflects the
    assumption that the same filters are useful for detecting the same patterns in
    different parts of the image.


    3.  Hierarchical processing. CNNs consist of multiple convolutional to extract
    features from the input image. As the network progresses from the input to the
    output layers, low-level features are successively combined to form increasingly
    complex features, ultimately leading to the recognition of more complex objects
    and shapes. Furthermore, the convolutional filters in these layers learn to detect
    specific patterns and features at different levels of abstraction.


    4.  Spatial invariance. This refers to the property that the output of a model
    remains consistent even if the input signal is shifted to a different location
    within the spatial domain. This characteristic arises from the combination of
    local connectivity, weight sharing, and the hierarchical architecture mentioned
    earlier.


    The combination of local connectivity, weight sharing, and hierchical processing
    in a CNN leads to spatial invariance, allowing the model to recognize the same
    pattern or feature regardless of its location in the input image. Let us illustrate
    this further via translation invariance, which is a special case of spatial invariance
    where we are only focusing on shifting an object – we do not rotate it.


    **Translation invariance**'
