    ![\\mathbf{x} = \begin{bmatrix} x\_{1} & x\_{2}\\\ x\_{3} & x\_{4} \end{bmatrix},](img/leanpub_equation_47.png),


    我们计算第一个输出通道为![o\_1 = \sum\_i(W\_1 * \mathbf{x})\_i + b\_1,](img/leanpub_equation_48.png)，其中卷积算子
    ![\*](img/leanpub_equation_49.png) 等于元素级乘法。换句话说，两个矩阵 ![W\_1](img/leanpub_equation_50.png)
    和 ![\\mathbf{x},](img/leanpub_equation_51.png) 之间进行元素级乘法，然后计算这些元素的和作为输出。注意，这等于全连接层中的点积。最后，我们加上偏置单元。第二个输出通道的计算方式类似：![o\_2
