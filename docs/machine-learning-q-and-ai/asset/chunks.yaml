    \ learning as separate approaches, they don’t have to be exclusive. For instance,\
    \ we could pretrain a model on a labeled or larger unlabeled image data using\
    \ self-supervised learning (*here:* the million of unlabeled images corresponding\
    \ to the various computing devices).\n\n*   Instead of starting with random weights,\
    \ we can use the neural network weights from self-supervised learning to follow\
    \ up with transfer learning via the thousands of labeled smartphone pictures.\
    \ Since smartphones are related to tablets, transfer learning is a very promising\
    \ approach here.\n\n*   Finally, after the self-supervised pretraining and transfer\
    \ learning, we can finetune the model on the hundreds of labeled images of the\
    \ target task, the tablets.\n\n**Answer 30-B**\n\n*In active learning, selecting\
    \ difficult examples for human inspection and labeling is often based on confidence\
    \ scores. Neural networks can provide such scores by using the logistic sigmoid\
    \ or softmax function in the output layer to calculate class-membership probabilities.\
    \ However, it is widely recognized that deep neural networks exhibit overconfidence\
    \ on out-of-distribution data^([12](#chap46.xhtml#fn-easily-fooled)), rendering\
    \ their use in active learning ineffective. So, what are some other methods to\
    \ obtain confidence scores using deep neural networks for active learning?*\n\n\
