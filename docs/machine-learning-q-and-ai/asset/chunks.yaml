    The GReaT method generates synthetic tabular data using an auto-regressive generative
    language model. Reference: Borisov, Seßler, Leemann, Pawelczyk, and Kasneci (2022).
    *Language Models Are Realistic Tabular Data Generators*, [https://arxiv.org/abs/2210.06280](https://arxiv.org/abs/2210.06280).


    TabDDPM is a method for generating synthetic tabular data using a diffusion model.
    Kotelnikov, Baranchuk, Rubachev, and Babenko (2022). *TabDDPM: Modelling Tabular
    Data with Diffusion Models*, [https://arxiv.org/abs/2209.15421](https://arxiv.org/abs/2209.15421).


    Q5 discusses various dataset-related techniques to reduce overfitting.


    The subtle difference between `L2` regularization and weight decay is explained
    in *Three Mechanisms of Weight Decay Regularization* by Zhang, Wang, Xu, and Grosse
    (2018), [https://arxiv.org/abs/1810.12281](https://arxiv.org/abs/1810.12281).


    Hastie, Tibshirani, Friedman (2009). *The Elements of Statistical Learning*. Chapter
    2.9, Model Selection and Bias-Variance Tradeoff.


    Frankle and Carbin (2018). *The Lottery Ticket Hypothesis: Finding Sparse, Trainable
    Neural Networks,* [https://arxiv.org/abs/1803.03635](https://arxiv.org/abs/1803.03635).


    Hinton, Vinyals, and Dean (2015). *Distilling the Knowledge in a Neural Network*,
    [https://arxiv.org/abs/1503.02531](https://arxiv.org/abs/1503.02531).


    Double descent refers to the phenomenon where models with either a small or an
    extremely large number of parameters have good generalization performance, while
    models with a number of parameters equal to the number of training data points
    have poor generalization performance. For more additional explanations and references,
    see [https://en.wikipedia.org/wiki/Double\_descent](https://en.wikipedia.org/wiki/Double_descent).


    Grokking reveals that as the size of a dataset decreases, the need for optimization
    increases, and generalization performance can improve well the point of overfitting.
    Power, Burda, Edwards, Babuschkin, and Misra (2022). *Grokking: Generalization
    Beyond Overfitting on Small Algorithmic Datasets*. [https://arxiv.org/abs/2201.02177](https://arxiv.org/abs/2201.02177).


    Jin, Carbin, Roy, Frankle, and Dziugaite (2022). *Pruning’s Effect on Generalization
    Through the Lens of Training and Regularization*. [https://arxiv.org/abs/2210.13738](https://arxiv.org/abs/2210.13738).


    Baldi and Sadowski (2013). Understanding Dropout. *Advances In Neural Information
    Processing Systems*, [https://proceedings.neurips.cc/paper/2013/hash/71f6278d140af599e06ad9bf1ba03cb0-Abstract.html](https://proceedings.neurips.cc/paper/2013/hash/71f6278d140af599e06ad9bf1ba03cb0-Abstract.html).


    In the paper *Well-tuned Simple Nets Excel on Tabular Datasets*, [https://arxiv.org/abs/2106.11189)](https://arxiv.org/abs/2106.11189),
    researchers showed that regularization cocktails need to be tuned on a per-dataset
    basis.


    [https://github.com/microsoft/DeepSpeed](https://github.com/microsoft/DeepSpeed)

