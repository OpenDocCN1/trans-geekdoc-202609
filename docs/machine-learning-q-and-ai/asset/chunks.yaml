    Suppose you train a classifier for stock trading recommendation using a random
    forest model, including the moving average of the stock price as a feature. Now,
    since new stock market data arrives daily, you are thinking about how to update
    the classifier daily to keep it up to date. Should you take a stateless training
    or stateless retraining approach to update the classifier?


    ### 21-B


    Suppose you deployed a large language model (transformer) such as ChatGPT that
    can answer user queries. The dialogue interface includes a “thumbs up” and “thumbs
    down” button so that users can give direct feedback based on the generated queries.
    While collecting the user feedback, you are not updating the model immediately
    as new feedback arrives. However, you are planning to release a new or updated
    model at least once per month.


    Is this a good candidate for stateless or stateful retraining?


    ## Q22. Data-Centric AI


    **> Q:**


    What is data-centric AI, how does it compare to the conventional modeling paradigm,
    and how do we decide it’s the right fit for a project?


    **> A:**


    Data-centric AI is a paradigm or workflow where we keep the model training procedure
    fixed and iterate over the dataset to improve the predictive performance of a
    model.


    In the context of data-centric AI, we can think of the conventional workflow,
    which is often part of academic publishing, as model-centric AI. However, in an
    academic research setting, we are typically interested in developing new methods
    (for example, neural network architectures or loss functions). Here, we consider
    existing benchmark datasets to compare the new method to previous approaches to
    determine whether it is an improvement over the status quo.


    ![Figure 22.1. Illustrating a data-centric versus model-centric machine learning
    workflow.](resources/figures----data-centric.png)


    Figure 22.1. Illustrating a data-centric versus model-centric machine learning
    workflow.


    ### Why can’t we have both?


    In short, data-centric AI focuses on changing the data to improve performance.
    Model-centric approaches focus on modifying the model to improve performance.
    Ideally, we can do both in an applied setting where we want to get the best possible
    predictive performance. However, if we are in a research setting or an exploratory
    stage of an applied project, varying too many variables simultaneously is messy.
    If we change both model and data simultaneously, it is hard to pinpoint which
    change is responsible for the improvement.


    ### What are the different methods for data-centric AI?


    It is important to emphasize that data-centric AI is a paradigm and workflow,
    not a particular technique. So, data-centric AI implicitly includes


    * analyses and modifications of training data, from outlier removal to missing
    data imputation;

    * data synthesis and data augmentation techniques;

    * data labeling and label cleaning methods;

    * the classic active learning setting where a model suggests which data points
    to label.


    We consider an approach data-centric if we only change the data (using the methods
    above), not the other aspects of the modeling pipeline.


    ### What are the advantages of data-centric AI?


    In machine learning and AI, we often use the phrase “garbage in, garbage out.”
    Here, it means that poor-quality data will result in a poor predictive model.
    Or in other words, we cannot expect a well-performing model from a low-quality
    dataset.


    There is one pattern I often observe in applied academic projects where researchers
    want to use machine learning to replace an existing methodology. Often, researchers
    only have a small dataset of examples (let’s say 100s of training examples). Labeling
    data is often expensive or considered boring and thus best avoided. In these cases,
    the researchers would spend unreasonable time trying out different machine learning
    algorithms and weeks on model tuning. In this cases, investing additional time
    or resources in labeling additional data would be worthwhile.


    The main advantage of data-centric AI is that it puts the data first. So, if we
    invest resources to create a higher-quality dataset, all modeling approaches will
    benefit from it downstream.


    ### How do we decide if data-centric AI is the right fit?


    Taking a data-centric approach is often a good idea in an applied project where
    we want to improve the predictive performance to solve a particular problem. It
    makes sense to start with a modeling baseline and improve the dataset since it
    can often be more worthwhile than trying out bigger, more expensive models.


    If our task is to develop a new or better methodology, such as a new neural network
    architecture or loss function, then a model-centric approach might be a better
    choice. Using an established benchmark dataset, and not changing it, will make
    it easier to compare the new modeling approach to previous work.


    In a real-world project, alternating between data-centric and model-centric modes
    makes a lot of sense. Early on, investing more in data quality makes sense because
    it will benefit all models. Then, once a good dataset is available, it makes sense
    to hone in on the model tuning part, to improve performance.


    **Reader quiz:**


    **22-A**


    A recent trend is the increased use of predictive analytics in healthcare. For
    example, suppose your healthcare provider developed an AI system that analyzes
    patients’ electronic health records and provides recommendations for lifestyle
    changes or preventive measures. For this, the provider requires you to monitor
    and share your health data (such as pulse and blood pressure) daily. Is this an
    example of data-centric AI?


    **22-B**


    Suppose you train a convolutional neural network, specifically a `ResNet-34`,
    to classify images in the `CIFAR-10` and `ImageNet` datasets. To reduce overfitting
    and improve classification accuracy, you are experimenting with different data
    augmentation techniques, such as image rotation and cropping. Is this approach
    data-centric?


    ## Q23. Speeding Up Inference


    **> Q:**


    What are techniques to speed up model inference through optimization without changing
    the model architecture and without sacrificing accuracy?


    **> A:**


    In machine learning and AI, model inference refers to making predictions or generating
    outputs using a trained model.


    The main general techniques for improving model performance during inference include
    parallelization, vectorization, loop tiling, operator fusion, and quantization,
    which are discussed in detail in the sections below.


    Other techniques to improve inference speeds include knowledge distillation and
    pruning, which are discussed in `Q6`. However, `knowledge distillation` and `pruning`
    affect the model architecture, resulting in smaller models, which is why they
    are out of scope for this question.


    ### Parallelization


    One common way to achieve better parallelization during inference is to run the
    model on a batch rather than a single sample at a time. This is sometimes also
    referred to as `batch inference` and assumes that we are receiving multiple inputs
    samples or user inputs simultaneously or within a short time window, as illustrated
    in the figure below.


    ![Figure 23.1. Comparison of sequential inference and batch inference.](resources/figures----inference-optimization-parallelization.png)


    Figure 23.1. Comparison of sequential inference and batch inference.


    Note that setting a reasonable timeout to run the inference is essential even
    if the desired batch size is not reached. This is to ensure that users don’t have
    to wait too long.


    Furthermore, if we exceed a given batch size per time unit, we can divide the
    input samples or batch into several smaller subsets or “chunks.” These chunks
    can then be processed simultaneously rather than sequentially if we have multiple
    compute cores. This is similar to the data parallelism multi-GPU strategy described
    in `Q7`.

