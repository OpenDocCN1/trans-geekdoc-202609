- raw: 'It may be easiest to summarize the difference between regular attention and
    self-attention with an illustration. The following figure depicts the attention
    mechanism that was originally proposed for RNNs to deal with long sequences^([13](#chap46.xhtml#fn-rnn-attention)).


    ![Figure 17.1. Illustration of the attention mechanism, which was originally proposed
    for RNNs. The values alpha\_{2,T} to alpha\_{2,T} represent the attention weights
    for the second sequence element and each other element in the sequence from 1
    to T.](resources/figures----attention-rnn.png)


    Figure 17.1. Illustration of the attention mechanism, which was originally proposed
    for RNNs. The values ![alpha\_{2,T} to](resources/leanpub_equation_57.png)![alpha\_{2,T}](resources/leanpub_equation_58.png)represent
    the attention weights for the second sequence element and each other element in
    the sequence from 1 to *T*.


    As shown in the figure above, the original attention mechanism developed for RNNs
    involves two RNNs. The RNN at the bottom, computing the attention weights, represents
    the encoder part. The RNN at the top, producing the output sequence, is a decoder.


    The takeaway is that the original attention mechanism developed for RNNs is applied
    between two different sequences, the encoder and the decoder embeddings. Note
    that for each generated output sequence element, the decoder RNN at the top is
    based on a hidden state plus a context vector generated by the encoder. This context
    vector involves *all* elements of the input sequence. This context vector is a
    weighted sum of all input elements where the attention scores (![\\alpha''s](resources/leanpub_equation_59.png))
    represent the weighting coefficients. This allows the decoder to access all input
    sequence elements (the context) at each step. And the key idea is that the attention
    weights (and context) may differ and change dynamically at each step.


    What motivates this complicated setup? The reason behind this encoder-decoder
    design is that we cannot translate sentences word by word. This would result in
    grammatically incorrect outputs, as illustrated by the RNN architecture A in the
    figure below.


    ![Figure 17.2. Illustration of two different sequence-to-sequence RNN designs
    for sentence translation. Subfigure A represents a regular sequence-to-sequence
    RNN that may be used to translate a sentence from German to English word by word.
    Subfigure B depicts an encoder-decoder RNN that first reads the whole sentence
    before translating it.](resources/figures----attention-rnn-reason.png)


    Figure 17.2. Illustration of two different sequence-to-sequence RNN designs for
    sentence translation. Subfigure A represents a regular sequence-to-sequence RNN
    that may be used to translate a sentence from German to English word by word.
    Subfigure B depicts an encoder-decoder RNN that first reads the whole sentence
    before translating it.


    The RNN architecture setup depicted in subfigure A is more suited for time series
    tasks where we want to make one prediction at a time, for example, predicting
    a given stock price day by day. For tasks like language translation, we typically
    opt for an encoder-decoder RNN as depicted in subfigure B above. Here, the RNN
    encodes the input sentence, stores it in an intermediate hidden representation,
    and then generates the output sentence. However, this creates a bottleneck where
    the RNN has to memorize the whole input sentence via a single hidden state, which
    does not work very well for longer sequences.


    The bottleneck depicted in subfigure B above prompted the attention mechanism’s
    original design, allowing the decoder part to access all elements in the input
    sentence at each time step. And the attention scores give different weights to
    the different input elements depending on the current word that the decoder generates.
    For example, when generating the word “help” in the output sequence, the word
    “helfen” in the German input sentence may get a large attention weight as it’s
    highly relevant in this context.


    **Self-attention**


    Approximately three years after the attention-for-RNN mechanism, which we discussed
    above, researchers asked whether the RNN backbone is even needed. This led to
    the design of the original transformer architecture and self-attention mechanism^([14](#chap46.xhtml#fn-orig-transformer)).


    In self-attention, the attention mechanism is applied between all elements in
    the same sequence (as opposed to involving two sequences). This is depicted in
    the simplified attention mechanism in the figure below. Similar to the attention
    mechanism for RNNs, the context vector is an attention-weighted sum over the input
    sequence elements.


    ![Figure 17.3. A simple self-attention mechanism without weight matrices.](resources/figures----attention-self.png)


    Figure 17.3. A simple self-attention mechanism without weight matrices.


    While the figure above depicts a simple attention mechanism without weight matrices,
    the self-attention mechanism used in transformers typically involves multiple
    weight matrices to compute the attention weights. Furthermore, cross-attention
    is a flavor of self-attention that can be applied to different sequence elements^([15](#chap46.xhtml#fn-attention-from-scratch)).


    **\> Reader quiz:**


    **17-A**


    Considering that self-attention compares each sequence element with itself, what
    is the time and memory complexity of self-attention?


    **17-B**


    We discussed self-attention in the context of natural language processing. Could
    this mechanism be useful for computer vision applications as well?


    ## Q18. Encoder- And Decoder-Style Transformers


    **\> Q:**


    What are the differences between encoder- and decoder-based language transformers?


    **\> A:**


    Fundamentally, both encoder- and decoder-style architectures use the same self-attention
    layers to encode word tokens. However, the main difference is that encoders are
    designed to learn embeddings that can be used for various predictive modeling
    tasks such as classification. In contrast, decoders are designed to e new texts,
    for example, answering user queries.


    **The Original Transformer**


    The original transformer architecture^([16](#chap46.xhtml#fn-attention-you-need-q18)),
    which was developed for English-to-French and English-to-German language translation,
    utilized both an encoder and a decoder, as illustrated in the figure below.


    ![Figure 18.1. Illustration of the original transformer architecture.](resources/figures----encoder-decoder-transformer.png)


    Figure 18.1. Illustration of the original transformer architecture.


    In the figure above, the input text (that is, the sentences of the text that is
    to be translated) is first tokenized into individual word tokens, which are then
    encoded via an embedding layer^([17](#chap46.xhtml#fn-q1-q18)) before it enters
    the decoder part. Then, after adding a positional encoding vector to each embedded
    word, the embeddings go through a multi-head self-attention layer. The multi-head
    attention layer is followed by an “Add & normalize” step, which performs a layer
    normalization and adds the original embeddings via a skip connection (also known
    as a residual or shortcut connection). Finally, after entering a “fully connected
    layer,” which is a small multilayer perceptron consisting of two fully connected
    layers with a nonlinear activation function in between, the outputs are again
    added and normalized before they are passed to a multi-head self-attention layer
    of the decoder part.


    The decoder part in the figure above has a similar overall structure as the encoder
    part. The key difference is that the inputs and outputs are different. The encoder
    receives the input text that is to be translated, and the decoder generates the
    translated text.


    **Encoders**'
