  trans: '

    然而，GAN 的主要缺点之一是由于损失函数和学习过程的对抗本质，导致其训练不稳定。平衡生成器和判别器的学习率可能是困难的，并且往往会导致震荡、模式崩溃或不收敛。GAN
    的第二个主要缺点是其生成输出的多样性较低，通常是由模式崩溃引起的。在这种情况下，生成器能够通过一小部分样本成功地欺骗判别器，而这些样本仅代表原始训练数据的一个子集。


    ## 基于流的模型 (Flow-based models)


    基于流的模型（也称为归一化流）的核心灵感来自统计学中的长期方法。其主要目标是使用可逆变换将简单的概率分布（如 `Gaussian`）转换为更复杂的分布。


    尽管归一化流的概念在统计学领域已存在很久，但早期基于流的深度学习模型（特别是用于图像生成的）是较最近的进展。该领域的先驱模型之一是 `NICE`(51) 方法，它出现于
    2014 年。


    与 `VAEs` 和 `GANs` 中的生成器相关，`NICE` 背后的思想是从简单的随机噪声生成复杂数据（如图像）。然而，它从随机噪声生成数据的方式与 `VAEs`
    和 `GANs` 有质的不同。


    `NICE` 从一个简单的概率分布开始，通常是像正态分布这样直接的东西。你可以将其想象为一种“随机噪声”——没有特定形状或结构的数据。然后，`NICE` 对这个简单分布应用一系列变换。每个变换的设计都是让数据看起来更像最终目标（例如，真实世界图像的分布）。这些变换是“可逆的”，这意味着我们始终可以将它们反转回原始的简单分布。经过多次连续的变换，简单分布已经演变成了一个与目标数据（如图像）分布密切匹配的复杂分布。我们现在可以通过从这个复杂分布中选取随机点来生成看起来像目标数据的新数据。


    基于流模型的概念如图所示。初看之下，该插图与上面的 `VAE` 插图非常相似。然而，虽然 `VAEs` 使用了神经网络编码器（例如卷积神经网络），但基于流的模型使用了更简单的解耦层（例如简单的线性变换）。此外，虽然
    `VAE` 中的解码器独立于编码器，但在基于流的模型中，数据变换函数通过数学反转来获得输出。


    ![Figure 9.4. 基于流的模型将复杂的输入分布映射到更简单分布并反回的插图](img/figures----deep-generative-flow-based.png)


    图 9.4. 基于流的模型将复杂的输入分布映射到更简单分布并反回的插图。


    与 `VAEs` 和 `GANs` 不同，基于流的模型提供了精确的似然性，让我们让我们了解生成的样本与训练数据分布的拟合程度。这在异常检测或密度估计中非常有用。然而，基于流的模型生成图像数据的质量通常低于
    `GANs`。


    此外，由于需要存储和计算变换的逆变换，基于流的模型通常比 `GANs` 或 `VAEs` 需要更多的内存和计算资源。


    ## 自回归模型 (Autoregressive models)


    自回归模型基于预测下一个值。

