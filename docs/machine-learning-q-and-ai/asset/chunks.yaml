    However, one of the main disadvantages of GANs is their unstable training due
    to the adversarial nature of the loss function and learning process. Balancing
    the learning rates of the generator and the discriminator can be difficult, and
    it can often result in oscillations, mode collapse, or non-convergence. The second
    main disadvantage of GANs is the low diversity of its generated outputs, often
    due to mode collapse. Here, the generator is able to fool the discriminator successfully
    with a small set of samples., which are only representative of a small subset
    of the original training data.


    ## Flow-based models


    The core concept of flow-based models, also known as normalizing flows, is inspired
    by longstanding methods in statistics. The primary goal is to transform a simple
    probability distribution (like a `Gaussian`) into a more complex one using invertible
    transformations.


    Although the concept of normalizing flows has been a part of the statistics field
    for a long time, the implementation of early flow-based deep learning models,
    particularly for image generation, is a relatively recent development. One of
    the pioneering models in this area was the `NICE`([51](#chap46.xhtml#fn-nice-ref))
    approach, which emerged in 2014.


    Related to `VAEs` and the generator in `GANs`, the idea behind `NICE` is to generate
    complex data (like images) from simple random noise. However, how it generates
    the data from the random noise fundamentally differs from `VAEs` and `GANs`.


    `NICE` begins with a simple probability distribution, often something straightforward
    like a normal distribution. You can think of this as a kind of “random noise”
    — data with no particular shape or structure. `NICE` then applies a series of
    transformations to this simple distribution. Each transformation is designed to
    make the data look more like the final target (for instance, the distribution
    of real-world images). These transformations are “invertible,” meaning we can
    always reverse them back to the original simple distribution. After several successive
    transformations, the simple distribution has been morphed into a complex distribution
    that closely matches the distribution of the target data (like images). We can
    now generate new data that looks like the target data by picking random points
    from this complex distribution.


    The concept of a flow-based model is illustrated in the figure below. At first
    glance, the illustration is very similar to the `VAE` illustration above. However,
    while `VAEs` use a neural network encoder, such as a convolutional neural network,
    the flow-based model uses simpler decoupling layers, such as simple linear transformations.
    Also, while the decoder in a `VAE` is independent of the encoder, in the flow-based
    model, the data-transforming functions are mathematically inverted to obtain the
    outputs.


    ![Figure 9.4. Illustration of a flow-based model mapping the complext input distribution
    to a simpler distribution and back.](resources/figures----deep-generative-flow-based.png)


    Figure 9.4. Illustration of a flow-based model mapping the complext input distribution
    to a simpler distribution and back.


    Unlike `VAEs` and `GANs`, flow-based models provide exact likelihoods, which gives
    us insights into how well the generated samples fit the training data distribution.
    This can be useful in anomaly detection or density estimation, for example. However,
    the quality of flow-based models for generating image data is usually lower than
    `GANs`.


    Also, flow-based models often require more memory and computational resources
    than `GANs` or `VAEs` due to their need for storing and computing inverses of
    transformations.


