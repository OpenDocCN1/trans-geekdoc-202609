  trans: "\n\n![](img/title_page.jpg)\n\n![机器学习问答与人工智能](img/title_page.jpg)\n\n# 机器学习问答与人工智能\n\
    \n### 通过 30 个深度问答扩展你的机器学习与 AI 知识\n\n#### Sebastian Raschka, 博士博士\n\n本书可在 [`leanpub.com/machine-learning-q-and-ai`](http://leanpub.com/machine-learning-q-and-ai)\
    \ 购买。\n\n此版本发布于 2023-05-21。\n\n![出版者标志](img/leanpub-logo.png)\n\n* * * * * *\n\
    \n这是一本来自 [Leanpub](https://leanpub.com) 的书籍。Leanpub 通过精益出版（Lean Publishing）流程为作者和出版商提供支持。[精益出版](https://leanpub.com/manifesto)\
    \ 是使用轻量级工具和多次迭代来出版正在进行中的电子书，以获取读者反馈，不断调整直到你拥有正确的书籍，并在一旦成功后建立影响力。\n\n* * * * *\
    \ *\n\n© 2016 - 2023 Sebastian Raschka, 博士\n\n本书献给那些通过研究和开发不断推动机器学习领域发展的人们。你们对发现和创新的热情，以及通过开源社区分享知识和资源的投入，一直着我们所有人的灵感。\n\
    \n## 目录\n\n1. 前言\n    1. 这本书是给谁看的？\n    2. 你将从这本书中获得什么？\n    3. 如何阅读这本书\n    4.\
    \ 讨论论坛\n    5. 分享反馈与支持本书\n    6. 致谢\n    7. 关于作者\n    8. 版权与免责声明\n    9. 致谢\n\
    2. 引言\n3. 第一章 神经网络与深度学习\n    1. Q1. 嵌入、表示与潜在空间\n    2. Q2. 自监督学习\n    3. Q3. 少样本学习\n\
    \    4. Q4. 抽票证假设\n    5. Q5. 通过数据减少过拟合\n    6. Q6. 通过模型修改减少过拟合\n    7. Q7. 多\
    \ GPU 训练范式\n    8. Q8. Transformer 成功的关键\n    9. Q9. 生成式 AI 模型\n    10. Q10. 随机性来源\n\
    4. 第二章 计算机视觉\n    1. Q11. 参数量\n    2. Q12. 全连接与卷积层的等效性\n    3. Q13. 用于 Transformer\n\
    5. 第三章 自然语言处理\n    1. Q15. 分布假设\n    2. Q16. 数据增强\n    3. Q17. 自注意力机制\n    4.\
    \ Q18. 编码器与解码器风格\n    5. Q19. 预调模型\n    6. Q20. 文本\n6. 第四章 生产、现实场景与部署\n    1.\
    \ Q21. 无状态训练\n    2. Q22. 分布偏移\n    3. Q23. 加速推理\n7. 第五章 预测性能与模型评估\n    1. Q25.\
    \ 泊松回归\n    2. Q27. 适当指标\n    3. Q28. 折交叉验证\n    4. Q29. 分布偏移\n    5. Q30. 有标签数据\n\
    8. 后记\n9. 附录 A 读者测试\n10. 附录 B 问题列表\n11. 注释\n\n# 前言\n\n指南\n\n多年来，我与很多人分享了关于机器学习和深度学习的无数知识点。积极反馈令人难以置信，我收到更多请求。因此，在这本书中，我想满足你们对学习新知识的渴望以及对我写作的热情。\n\
    \n# 这本书是给谁看的？\n\n本书适合具有机器学习初级或中级背景并想要学习新知识的人。然而，本书并不是一本数学或编程书籍。换句话说，它是你坐在椅子上喝着咖啡时的完美伴侣。\n\
    \n# 你将从这本书中获得什么？\n\n机器学习和人工智能的发展非常快。研究人员和从业者不断努力跟上这些概念。本书为你们从机器学习初学者到专家的之旅提供了碎片化的知识。即使是经验丰富的机器学习研究人员和从业者也能从中发现可以加入武器库的新技巧。\n\
    \n# 如何阅读这本书\n\n书中的问题大部分是独立的，你可以按照任何喜欢的顺序阅读。你也可以跳过某些问题。不过，我对问题进行了组织以增加结构性。\n\n\
    例如，第一个问题涉及嵌入，我们在后续关于自监督学习和少样本学习的问题中引用它。因此，我建议按顺序阅读。\n\n"
