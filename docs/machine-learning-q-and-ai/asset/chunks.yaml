    接上述问题，较小的补丁（patches）通常会导致更高或更低的预测准确率？


    # 第 3 章. 自然语言处理


    ## Q15. 分布假设


    > **问：**


    自然语言处理（NLP）中的分布假设是什么？它被应用于哪里？它的成立性有多大？


    > **答：**


    分布假设是一种语言学理论，认为出现在相同语境中的词往往具有相似的含义^(1)。简而言之，两个词的意思越相似，它们在相似语境中出现的频率就越高。


    ![图 15.1. 根据分布假设，出现在相似语境中的词具有更相似的意思。例如，Cats（猫）和 Dogs（狗）经常出现在相似的语境中，比猫（cat）和三明治（sandwich）更有关联（两者都是哺乳动物和宠物）。](img/figures----distributional-hypothesis.png)


    图 15.1. 根据分布假设，出现在相似语境中的词具有更相似的意思。例如，`Cats` 和 `Dogs` 经常出现在相似的语境中，比一个 `cat` 和一个
    `sandwich` 更有关联。


    从大型数据集来看，这在某种程度上是成立的，但很容易构造出单个反例。一个直观的反例是多义性现象，即一个词具有多个相关但并不完全相同的含义。例如，让我们考虑 `bank`
    这个词。它可以指金融机构、“河流岸的抬高地”、“山丘的陡坡”或“保护性的缓冲护缘”^(2)。然而，这些不同的含义具有不同的分布属性，并且并不总是出现在相似的语境中。


    尽管如此，分布假设仍然非常有用。词嵌入^(3)例如 `Word2vec`^(4) 以及许多大型语言 Transformer 模型都依赖于这一思想（例如 `BERT`^(5)
    中的掩码语言模型以及 `GPT`^(6) 中使用的下一词预训练任务）。


    `Word2vec` 方法使用一个简单的两层神经网络将词编码为嵌入向量，使得相似词的嵌入向量（语义和句法上）是接近的。训练 `Word2vec` 模型有两种方法：连续词袋模型（CBOW）和
    skip-gram 方法。


    使用 `CBOW` 方法，`Word2vec` 学习通过周围的语境词来预测当前词。在 `skip-gram` 模型中反之亦然，`Word2vec` 模型从选定的词预测语境词。在连续词袋架构中，`Word2vec`
    模型从周围语境词的窗口中预测一个掩码词。虽然 `skip-gram` 对于低频词更有效，但 `CBOW` 的训练速度通常更快。


    训练完成后，词嵌入被放置在向量空间中，使得语料库中具有共同语境的词（即语义和句法相似的词）彼此靠近。相反，不相似的词在嵌入空间中的距离则较远。


    ![图 15.2. 根据分布假设，出现在相似语境中的词具有更相似的意思。](img/figures----distributional-hypothesis.png)


    图 15.2. 根据分布假设，出现在相似语境中的词具有更相似的意思。`BERT` 使用了一种掩码建模方法，涉及掩盖（隐藏）部分词，其任务是根据语境预测这些词。这种方法与
    `Word2vec` 类似，我们使用标准技术来预测后续词^(7)。`BERT` 生成的上下文词是接近的^(8)。对于掩码语言任务，`BERT` 通常更适用于分类任务。`GPT`
    作为解码器而非编码器，它采用的方法与 `Word2vec` 略有不同，并且..--9⁹⁹⁹⁶⁶⁶...------ 1......the,,,,,2- embeddings
    in a-training.](resources/figures----distributional-bert.png)


    图 15.3. BERT 的掩码建模方法和 GPT 的下一词预训练。


    总结来说，虽然存在分布假设不成立的反例，但它非常有用的概念，构成了现代 Transformer 模型的基石。


    读者测验：


    15-A


    考虑同音词的情况——读音相同但含义不同的词。例如，*there* 和 *their*。同音词是另一个分布假设不成立的例子吗？


    15-B


    你能想到其他也适用于类似于分布假设概念的领域吗？


    ## Q16. 文本的数据增强


    > **问：**


    文本数据的常用数据增强技术有哪些？


    > **答：**


    数据增强对于人工增加数据集大小以提高模型性能非常有用，例如如 Q5 中讨论的那样，可以减少过拟合程度。在开发卷积神经网络和视觉 Transformer 等计算机视觉模型时，数据增强非常常见，我们使用使用旋转、缩放、翻转、裁剪以及改变图像亮度或对比度等标准技术。


    同样，也存在多种增强文本数据的技术。最常用的方法包括同义词替换、词删除、词位置交换、句子洗牌、噪声注入、回译以及由语言模型（LLMs）生成的文本。我们将在下面的章节中介绍这些不同的技术^(10).


    同义词替换


    在同义词替换中，我们随机选择句子中的词（通常是名词、动词、形容词和副词），并用同义词对其进行替换，如下所示：


    * 原句：“The cat quickly jumped over the lazy dog.”

    * 增强句：“The cat rapidly jumped over the idle dog.”


    这可以帮助模型学习不同的词可以具有相似的意思，从而提高其理解和生成文本的能力。然而，谨慎使用这种技术至关重要，因为并不是所有的同义词在所有语境下都可以互换。


    在实践中，同义词替换通常通过使用如 `WordNet`^(11) 的词典来实现。


    词删除


    词删除从原始文本中随机删除某些词以创建变体，同时试图保持句子的整体含义，如下所示：


    * 原句：“The cat quickly jumped over the lazy dog.”

    * 增强句（此处显示为示例，假设删除了“quickly”）


    然而，应注意不要删除可能会改变句子含义的关键词。例如，以下词删除就是次优的：


    * 原句：“The cat quickly jumped over the lazy dog.”


