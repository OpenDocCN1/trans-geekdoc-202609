    We can think of perplexity as an intrinsic metric and BLEU and ROUGE as extrinsic
    metrics. To illustrate the difference between intrinsic and extrinsic metrics,
    think of optimizing the cross entropy to train an image classifier. The cross
    entropy is a loss function we optimize during training, but our end goal is to
    maximize the classification accuracy. Since classification accuracy cannot be
    optimized directly during training – it’s not differentiable – we minimize the
    surrogate loss function like the cross entropy. Minimizing the cross entropy loss
    more or less correlates with maximizing the classification accuracy.


    Perplexity is often used as an evaluation metric to compare the performance of
    different language models, but it is not the optimization target during training.
    BLEU and ROUGE are more related to classification accuracy, or rather precision
    and recall. In fact, BLEU is a precision-like score to evaluate the quality of
    a translated text. ROUGE is a recall-like score to evaluate summarized texts.


    The following paragraphs will discuss the mechanics of these metrics in more detail.


    ### Perplexity


    Perplexity is closely related to the cross entropy that is directly minimized
    during training, which is why we refer to perplexity as an intrinsic metric.


    Perplexity is defined as ![2^{H(p, q) / n},](resources/leanpub_equation_76.png)where
    ![H(p, q)](resources/leanpub_equation_77.png)is the cross entropy between the
    true distribution of words ![p](resources/leanpub_equation_78.png)and the predicted
    distribution of words ![q.](resources/leanpub_equation_79.png). As cross entropy
    decreases, perplexity decreases as well – the lower the perplexity, the better.
    And ![n](resources/leanpub_equation_80.png)is the sentence length (the number
    of words or tokens) to normalize the score.


    In practice, since the probability for each word in the target sentence is always
    1, we compute the cross entropy as the logarithm of the probability scores returned
    by the model we want to evaluate. In other words, if we have the predicted probability
    score for each word in a sentence ![s,](resources/leanpub_equation_81.png) we
    can compute the perplexity directly as follows:


    ```

    Perplexity(s) = 2^{-\frac{1}{n} \log\_2 (p(s))}.

    ```


    In the formula above:


    * ![s](resources/leanpub_equation_83.png)is the sentence or text we want to evaluate,
    for example, “The quick brown fox jumps over the lazy dog”;

    * ![p(s)](resources/leanpub_equation_84.png)are the probability scores returned
    by the model;

    * ![n](resources/leanpub_equation_85.png)is the number of words or tokens.


    For example, if the model returns the following probability scores,


    ![\[0.99, 0.85, 0.89, 0.99, 0.99, 0.99, 0.99, 0.99\],](resources/leanpub_equation_86.png)


    the perplexity is


    ```

    2^{-\frac{1}{8} \sum\_i \log\_2 p(w\_i)} = 2^{- 1/8 \cdot \sum \log\_2 (0.99 *
    0.85 * 0.89 * 0.99 * 0.99 * 0.99 * 0.99 * 0.99 )}

    ```


    If the sentence was “The fast cat jumps over the lazy dog” with probabilities
    ![0.99, 0.65, 0.13, 0.05, 0.21, 0.99, 0.99],](resources/leanpub_equation_90.png)
    the corresponding perplexity would be ![2.41.](resources/leanpub_equation_91).


    A high perplexity indicates that a language model is less effective at predicting
    the next word in a sequence, implying greater uncertainty in predictions. We aim
    for low perplexity in language models, as it indicates better performance in predicting
    the next word, reflecting a more accurate understanding of patterns and context.


    ### BLEU score


    BLEU is the most popular and widely used metric for evaluating translated texts.
    It’s used in almost all LLMs capable of translation, including popular tools such
    as OpenAI’s Whisper and GPT, so it’s worth discussing how it works. BLEU was originally
    developed to capture the essence of human evaluation; the original BLEU paper
    found a high correlation with human evaluations.


    BLEU is a reference-based metric that compares the model output to human-generated
    references. In short, BLEU measures the lexical overlap between the model output
    and the human-generated references based on a precision score.


    So, how does it work exactly? As a precision-based metric, BLEU counts how many
    words in the generated text (candidate text) occur in the reference text divided
    by the reference text length, where the reference text is a sample translation
    provided by a human. Instead of using individual words, this is commonly done
    for n-grams, but for simplicity, we will stick to words or 1-grams. The BLEU score
    calculation is summarized in the illustration below, and interested readers can
    also find a code implementation in the supplementary materials (https://github.com/rasbt/MachineLearning-QandAI-book).


    Figure 20.1. Calculation of the 1-gram BLEU score for illustration purposes. (In
    practice, BLEU is often computed for 4-grams.)


    BLEU has several shortcomings that are mostly owed to the fact that BLEU measures
    string similarity and similarity alone is not sufficient for capturing quality.
    Furthermore, since BLEU relies on exact string matches, it is sensitive to lexical
    variations and incapable of identifying semantically similar translations that
    use synonyms or paraphrases. In other words, BLEU may assign lower scores to translations
    that are, in fact, accurate and meaningful.


    Is BLEU flawed? Yes. Is it still useful? Also yes. BLEU is a helpful tool to measure
    or assess whether a model improves during training – it’s a proxy for fluency.
    However, it is not very well suited to give a correct assessment of the quality
    of the generated translations and is not well suited for detecting issues. In
    other words, use it as a model selection tool, not a model evaluation tool.


    ### ROUGE score


    Where BLEU is commonly used for translation tasks, ROUGE is a popular metric for
    scoring text summaries. There are quite some similarities between BLEU and ROUGE.
    The precision-based BLEU score checks how many words in the candidate translation
    occur in the reference translation. The ROUGE score also takes a flipped approach,
    checking how many words in the reference text appear in the generated text (here
    typically a summarization instead of translation) – this can be interpreted as
    a recall-based score.


    Modern implementations compute the ROUGE as an F1 score that is the harmonic mean
    of recall (how many words in the reference occur in the candidate text) and precision
    (how many words in the candidate text occur in the reference text) as illustrated
    in the figure below.


    Figure 20.2. Illustration of the 1-gram ROUGE score computation. (In practice,
    ROUGE is often computed for bigrams, that is, 2-grams.)


    (Interested readers can find a computational example in the supplementary materials
    (https://github.com/rasbt/MachineLearning-QandAI-book).)


    Besides this ROUGE-1 (the F1-score based ROUGE score for 1-grams), there are more
    variants:

