    *   考虑一种罕见病的医学影像场景。少样本系统（few-shot system）对于该疾病可能只有一个或极少数案例，并被要求根据这些有限的示例来识别它。

    *   少样本系统的另一个例子是推荐系统，用户仅评过过有限数量的项目。基于这些有限的示例，模型必须预测用户未来可能喜欢的产品。

    *   想象一个仓库机器人，随着公司库存的增加，它必须学习识别新物体。机器人必须仅根据极少数示例就能学习识别并适应这些新物体。


    ## 回答 4-A


    *假设你正在尝试彩票假设（lottery ticket hypothesis）方法，并发现子网络的性能并不理想（与原始网络相比）。接下来可以尝试哪些后续步骤？*


    *   增加初始神经网络的大小。有可能是所选的网络太小，无法包含一个合适的子网络。

    *   尝试不同的随机初始化（例如，通过更改随机种子）。彩票假设认为，*某些*随机初始化的网络包含高精度的子网络，这些子网络可以通过剪枝获得，但并非所有网络都具有这样的子网络。


    ## 回答 4-B


    *彩票假设与使用 ReLU 激活函数训练神经网络有什么关系（ReLU 激活函数定义为 `max(0, x)`）？*


    在用 `ReLU` 激活函数训练神经网络时，如果函数输入小于零，特定的激活值将被设置为零。这将导致隐藏层中的某些节点对计算没有贡献——这有时被称为“死神经元”。虽然
    `ReLU` 激活不会直接导致权重稀疏，但零激活输出有时会导致无法恢复的零权重。这一观察结果支持了彩票假设，该假设认为，训练良好的网络可能包含具有稀疏、可训练权重的子网络，这些子网络可以在不损失准确性的情况下进行剪枝。


    ## 回答 5-A


    *假设我们训练了一个 `XGBoost` 模型，根据从合作者处手动提取的特征对图像进行分类。标记训练示例数据集相对较小，但幸运的是，你的合作者也有一个来自相关领域旧项目的标记训练集。


    我们正在考虑实现一种迁移学习方法来训练 `XGBoost` 模型。这是一个可行的方案吗？如果是，我们可以如何做？（假设只允许使用 `XGBoost`，不允许使用其他分类算法或模型。）*


    `XGBoost` 是一种基于树的梯度提升实现，截至本文撰写时不支持迁移学习。与人工神经网络相比，`XGBoost` 是非参数模型，我们无法在数据数据到达时轻松更新它；因此，常规迁移学习在这里不起作用。


    然而，可以将用于在一个任务上训练的 `XGBoost` 模型的结果作为另一个 `XGBoost` 模型的特征。因此，考虑两个数据集的重叠特征集。例如，我们可以为合并数据集以自监督的方式设计分类任务。然后，我们在目标数据集上训练第二个
    `XGBoost` 模型，将原始特征集以及第一个 `XGBoost` 输出作为输入。


    ## 回答 5-B


    *假设我们正在处理一个图像分类问题（对于本例，考虑基于 `MNIST` 的手写数字识别），并添加了大量的数据增强以减少图像分类背景下的过拟合。遗憾的是，我们观察到分类准确率变得糟糕得多。可能的原因有哪些呢？*


    ## 回答 6-A


    *假设我们正在使用早停（early-stopping）作为减少过拟合的机制。特别地，我们正在训练期间使用最佳模型的检查点（例如验证准确率），以便在现代框架中启用。*


    *   现在，一位同事建议改为调整轮数（epochs）的数量。每种方法的优缺点分别是什么？*


