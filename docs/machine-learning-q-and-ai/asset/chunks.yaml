    # Chapter 4. Production, Real-World, And Deployment Scenarios


    ## Q21. Stateless And Stateful Training


    **\> Q:**


    What is the difference between stateless and stateful training workflows in the
    context of production and deployment systems?


    **\> A:**


    Both stateless training and stateful training refer to different ways of training
    a production model.


    **Stateless (re)training**


    Stateless training is a conventional, traditional approach where we first train
    an initial model on the original training set and then retrain it as new data
    arrives. Hence, stateless training is also commonly referred to as stateless *retraining*^([1](#chap46.xhtml#fn-stateless)).


    ![Figure 21.1. Illustration of stateless retraining.](resources/figures----stateful-stateless-1.png)


    Figure 21.1. Illustration of stateless retraining.


    As illustrated in the figure above, stateless retraining is like a sliding window
    approach where we retrain the initial model on different parts of the data from
    a given data stream. For example, to update the initial model (*Model 1*) to a
    newer model (*Model 2*), we train the model on 30% of the initial data and 70%
    of the most recent data at a given point in time.


    Stateless retraining is a straightforward approach where we can adapt the model
    to the most recent changes in the data and feature-target relationships via retraining
    the model from scratch in user-defined checkpoint intervals. This approach is
    prevalent with conventional machine learning systems that cannot be finetuned
    as part of a transfer or self-supervised learning workflow (see Q2). For example,
    standard implementations of tree-based models such as random forests and gradient
    boosting (XGBoost, CatBoost, and LightGBM) fall into this category.


    **Stateful training**


    In stateful training, we train the model on an initial batch of data and then
    update it periodically (as opposed to retraining it) when new data arrives.


    ![Figure 21.2. Illustration of stateful training.](resources/figures----stateful-stateful-1.png)


    Figure 21.2. Illustration of stateful training.


    In the illustration of stateful training above, we do not retrain the initial
    model (*Model 1.0*) from scratch but update or finetune it as new data arrives.
    This approach is particularly attractive for models compatible with transfer learning
    or self-supervised learning.


    The stateful approach mimics a transfer or self-supervised learning workflow where
    we adopt a pretrained model for finetuning. However, stateful training differs
    fundamentally from transfer and self-supervised learning as it updates the model
    to accommodate concept, feature, and label drifts. In contrast, transfer and self-supervised
    learning aim to adopt the model for a different classification task. For instance,
    in transfer learning, the target labels often differ. In self-supervised learning,
    we obtain the target labels from the dataset features.


    One significant advantage of stateful training is that we do not need to store
    data for retraining – we can use it to update the model as soon as it arrives.
    This is particularly attractive when data storage is a concern due to privacy
    or resource limitations.


    **\> Reader quiz:**


    **21-A**'
