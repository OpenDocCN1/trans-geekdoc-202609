- raw: 'Suppose we are working on an image classification problem (for this example,
    consider MNIST-based handwritten digit recognition) and added a decent amount
    of data augmentation to reduce overfitting in an image classification context.
    Unfortunately, we observe that the classification accuracy became much worse than
    before. What are some potential reasons?


    ## Q6. Reducing Overfitting with Model Modifications


    **\> Q:**


    Suppose we train a neural network classifier in a supervised fashion and we already
    employ various dataset-related techniques to mitigate overfitting^([21](#chap46.xhtml#fn-q5-6)).
    How can we change the model or make modifications to the training loop to further
    reduce the effect of overfitting?


    **\> A:**


    The most successful approaches against overfitting include regularization techniques
    such as dropout and weight decay. As a rule of thumb, models with a larger number
    of parameters require more training data to generalize well. Hence, decreasing
    the model size and capacity can sometimes also help reduce overfitting. Lastly,
    building model ensembles are among the most effective ways to combat overfitting,
    but it comes with increased computational expenses.


    The various model- and training-related techniques to reduce overfitting can be
    grouped into three broad categories: adding regularization, choosing smaller models,
    and building ensemble models. The following paragraphs outline the key ideas and
    techniques from each category.


    **Regularization**


    We can interpret regularization as a penalty against complexity. Classic regularization
    techniques for neural networks include ![L\_2](resources/leanpub_equation_0.png)regularization
    and the related weight decay method. We implement ![L\_2](resources/leanpub_equation_1.png)regularization
    by adding a penalty term to the loss function that is minimized during training.
    This added term represents the size of the weights, for instance, the squared
    sum of the weights. The formula below shows an ![L\_2](resources/leanpub_equation_2.png)regularized
    loss:


    ![\\text {RegularizedLoss }=\\text { Loss }+\\frac{\\lambda}{n} \\sum\_j w\_{j}^{2},](resources/leanpub_equation_3.png)


    where ![\\lambda](resources/leanpub_equation_4.png)is a hyperparameter that controls
    the regularization strength.


    During backpropagation, the optimizer minimizes the modified loss, now including
    the additional penalty term, which leads to smaller model weights and can improve
    generalization to unseen data.


    Weight decay is similar to ![L\_2](resources/leanpub_equation_5.png)regularization,
    but it is applied to the optimizer directly rather than modifying the loss function.
    Since weight decay has the same effect as ![L\_2](resources/leanpub_equation_6.png)regularization,
    the two methods are often used synonymously, but there can be subtle depending
    on the implementation details and optimizer^([22](#chap46.xhtml#fn-l2-decay)).


    **Dropout and early stopping**. Note that many other techniques have regularizing
    effects. For brevity, we keep this list focused on the most widely used methods,
    including dropout and early stopping.


    Dropout reduces overfitting by randomly setting some of the activations of the
    hidden units to zero during training. Consequently, the neural network cannot
    rely on particular neurons to be activated and learns to use a larger number of
    neurons and learn multiple independent representations of the same data, which
    helps to reduce overfitting.


    In early stopping, we monitor the model’s performance on a validation set during
    training. And we stop the training process when the performance on the validation
    set begins to decline.


    ![Figure 6.1. A selection of different image data augmentation techniques.](resources/figures----data-augmentation.png)


    Figure 6.1. A selection of different image data augmentation techniques.


    **Smaller models**


    Classic bias-variance theory suggests that reducing model size can reduce overfitting^([23](#chap46.xhtml#fn-bias-variance)).
    The intuition behind it is that, as a general rule of thumb, the smaller the smaller
    the number of model parameters, the smaller its capacity to memorize or overfit
    to noise in the data.


    **Pruning**. Besides reducing the number of layers and shrinking the layers’ widths
    as a hyperparameter tuning procedure, one approach to obtaining smaller models
    is iterative pruning. In iterative pruning, we train a large model to achieve
    the good performance on the original dataset. Then, we iteratively remove parameters
    of the model, retraining it on the dataset such that it maintains the same predictive
    performance as the original model. Iterative pruning is used in the *lottery ticket
    hypothesis* discussed in \[#q4.


    **Knowledge distillation.** Another common approach to obtaining smaller models
    is knowledge distillation. The general idea behind knowledge distillation is that
    we transfer knowledge from a large, more complex model (called *teacher*) to a
    smaller model (called *student*). Ideally, the student achieves the same predictive
    accuracy as the teacher while being more efficient due to the smaller size. And,
    as a nice side-effect, the smaller student may overfit less than the larger teacher
    model.


    The original knowledge distillation process is summarized in the figure below.
    Here, the teacher is first trained in a regular supervised fashion to classify
    the examples in the dataset well using a conventional cross entropy loss between
    the predicted scores and ground truth class labels.


    ![Figure 6.2. Outline of the original knowledge distillation process.](resources/figures----knowledge-distillation.png)


    Figure 6.2. Outline of the original knowledge distillation process.


    While the smaller student network is trained on the same dataset, the training
    objective is to minimize both (a) the cross entropy between the outputs and the
    class labels and (b) the difference between its outputs and the teacher outputs
    (measured using Kullback Leibler divergence). By minimizing the Kullback Leibler
    divergence, the difference between the teacher and student score distributions,
    the student learns to mimic the teacher while being smaller and more efficient.
    As mentioned above, an additional benefit is that the smaller student models often
    generalize better than the larger teacher models.


    **Caveats with smaller models**


    The original research results indicate that pruning^([24](#chap46.xhtml#fn-lth-reference-2))
    and knowledge distillation^([25](#chap46.xhtml#fn-knowledge-distillation-2)) can
    improve the generalization performance, presumably due to smaller model sizes.


    However, counterintuitively, recent research studying phenomena like *double decent*^([26](#chap46.xhtml#fn-double-decent))
    and *grokking*^([27](#chap46.xhtml#fn-grokking)) also showed that larger, overparameterized
    models have improved generalization performance if they are trained beyond the
    point of overfitting.


    How can we reconcile the observation that pruned models can exhibit better generalization
    performance with contradictory observations from studies of double-decent and
    grokking? Researchers recently showed that the improved training process partly
    explains the reduction of overfitting due to pruning^([28](#chap46.xhtml#fn-pruning-effect)).
    Pruning involves more extended training periods and a replay of learning rate
    schedules that may be partly responsible for the improved generalization performance.


    Pruning and knowledge distillation remain excellent ways to improve the computational
    efficiency of a model. However, while pruning and knowledge distillation can also
    enhance a model’s generalization performance, these techniques are not primary
    or effective ways of reducing overfitting.


    **Ensemble methods**


    Ensemble methods combine predictions from multiple models to improve the overall
    prediction performance. However, the downside of using multiple models is an increased
    computational cost.'
