    得益于埃隆·马斯克（Elon Musk）等富翁的认可，`NFTs` 变得越来越流行。但事实并不是它们日益流行的唯一原因。在富翁支持之前，`NFTs` 的重要性已经提高。2017
    年的市值为 3000 万美元，尽管 2018 年处于熊市，达到了 1.8 亿美元。2021 年，它们的市值已超过了 10 亿美元。


