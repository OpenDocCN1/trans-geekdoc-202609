    Suisse` 和 `J.P. Morgan` 成功使用智能合约处理了由 `Axoni` 开发的、基于区块链的信用违约互换。根据新闻稿，智能合约为合作伙伴和监管机构提供了新水平的透明度，包含了个人交易细节和等效风险测量等信息。


    这种情况正在到处发生。一个由 61 家日本和韩国银行组成的财团正在测试 `Ripple` 的 `Blockchain` 和智能合约，为两国之间提供跨境汇款服务。新系统将于今年投入。俄罗斯政府控制的银行
    `Sberbank` 正在测试 `Ethereum` 的 `Blockchain` 及其提供的智能合约，即使是在俄罗斯——一个被誉为不再有黑客攻击的国家。


    测试始于加入 `Enterprise Ethereum Alliance`，这是一个由 100 多家企业组成的组织，包括 `Cisco`、`BP`、`ING`、`Microsoft`
    等顶级玩家，以及来自 `Sberbank`。该联盟旨在开发一种用于业务的精细化 `Blockchain`，在其中可以开发和实施特定公司所需的智能合约。


    虽然智能合约是在开发加密货币的过程中产生的，但它们大多实现在金融和银行业领域。尽管如此，这项技术可以被全球政府使用，使投票系统更加便捷和透明。供应链既可以用于追踪货物，也可以用于所有相关任务和支付。房地产、医疗保健、税收、保险和无数其他行业都能从智能合约的实施及其必须提供的利益中获益。


    ## 管理


    `Blockchain` 不仅提供单一账本作为信任源，还由于准确性、透明性和自动化系统消除了通信和工作流中的潜在漏洞。通常情况下，业务运营在等待批准以及面临内外部问题时应该急于自救。一个区块链账本将解决这些问题。它还消除了独立处理过程中经常出现的不一致性，这可能导致昂贵的诉讼和结算延迟。


    2015 年，托管托管与结算公司（`DTCC`）使用区块链账本处理了价值 1.5 万亿英元的证券，涉及 3.45 亿笔交易。


    ## 供应链


    正如 Jeff Garzik 所说，智能合约基于 `if-then` 原：“大多数情况下，供应链会被纸质系统阻塞；在这里，表格必须经过许多通道进行审批，这增加了损失和欺诈的风险。`Blockchain`
    通过为链中的所有方提供安全的、可访问的数字版本来克服这一点，并实现任务和支付自动化。”`Barclays Corporate Bank` 使用智能合约记录财产变更，并在到达后自动向其他金融机构付款。


    ## 汽车


    毫无疑问，我们正在从尊严的人类脊椎动物向超智能机器人转变。想象一个一切几乎都是自动化的未来。`Google` 带来了智能手机、时尚眼镜甚至智能汽车。这就是智能合约发挥作用的地方。一个例子是，智能合约可以放在一种“预言”游戏游戏中，可以判定事故中谁是有缺陷的。自动驾驶或自动停车的带有传感器或驾驶员的车辆以及无数其他变量都是很好的例子。使用智能合约，汽车保险公司可以根据客户运行车辆的位置和条件收取不同的费用。


    ## 房地产


    你可以通过智能合约赚更多钱。通常，如果你想把房子租给别人，你需要支付给中间商（如 `sahibinden.com` 或报纸）进行广告。不仅如此，你可能还需要支付中介费金。数字笔记本减少了你的成本。你只需要支付
    `bitcoin` 并将你的合同编码在书中。每个人都能看到它，并且你能够自动地执行它。经纪人、房地产代理人、处境困难的贷款人任何与房地产相关的人都可以从中盈利。


    ## 医疗保健


    个人健康记录只能编码并存储在带有私密钥的密码链中，该密钥将为特定个人提供访问。同样的策略也可用于确保在 `HIPAA` 法下（安全且保密地）进行研究。手术发票可以存储在区块链中，并作为交付文件自动发送给保险供应商。账本还可以用于普通健康管理，如药物检查、合规性、测试结果和健康用品管理。


    ## 问题所在


    智能合约并非完美。如果代码中出现漏洞会怎样？或者政府如何监管这些合同？或者政府如何对这些智能合约交易征税？此时，让我们考虑一下上面的租房例子。


    如果我发送了错误的代码，或者发送了正确的代码，但在租约日期之前我的公寓在未经许可的情况下公开怎么办？如果这是传统合同，我可以在法院取消它，但 `blockchain`
    是另一回事。合同无论如何都会执行。


    挑战清单持续。专家们正试图解决它们，但这些关键问题让潜在采用者犹豫。


    ## 智能合约的未来


    智能合约的未来部分解决上述问题。例如，一些认为智能合约未来将进入我们生活的律师正致力于调查这些担忧。


    实际上，当涉及到智能合约时，我们正在进入一个科幻领域。有人认为智能合约会影响某些行业（如法律）的变化。在这种情况下，律师将通过编写传统合同来制作标准的智能合约模板，类似于你在
    `LegalZoom` 找到的标准传统合同。其他部门，如商业买家、信贷公司和会计师可以实施智能合约来完成实时审计和风险评估等任务。其他人预见到智能合约将转化为纸质和数字内容的混合体，如果合同通过区块链验证并由物理副本进行验证的话。


    '
