    \ $52,880,208 || 3,301,394,753 VEE |\n\n| BLOCKv |\n\n| VEE |\n\n## 5.3. Credible\
    \ and Reliable NFT Information Sources\n\nThroughout this book, we have discussed\
    \ the top NFTs and the top NFT marketplaces. We have also attached official links\
    \ to these websites.\n\nWe cannot emphasise this enough. When it comes to NFTs,\
    \ it is not uncommon to receive exaggerated information online – even from reputable\
    \ media houses. To be on the safer side, only trust the information from the official\
    \ NFT websites or the official marketplaces.\n\n#  \n\n# Session 6  \n\nNFTs and\
    \ Poplar Blockchain Integrations \n\nFor NFT minting, you have different blockchains\
    \ to choose from. The Ethereum network is the first major blockchain to enable\
    \ the creation of NFTs as we know them today. Later, other blockchains were added,\
    \ including Binance Smart Chain, Polkadot, Tron and Tezos.\n\nMost NFTs today\
    \ are either on Ethereum or the BSC. However, the gas charges on Ethereum make\
    \ the creation and handling of NFTs relatively expensive.\n\n## 6.1. NFTs and\
    \ Ethereum\n\nWhen it comes to NFTs, Ethereum dwarfs almost every other blockchain\
    \ network. NFTs have become much more present in the media in recent months. Headlines\
    \ such as Jack Dorsey's $2.9 million NFT tweet or the sale of the Beeple NFT for\
    \ $69 million bring NFTs closer to a much wider audience.\n\nThis often gives\
    \ the impression that NFTs are a completely new phenomenon. But the history of\
    \ blockchain-based NFTs can already boast several years. The first NFT experiments\
    \ were already running in 2012 with coloured coins on the Bitcoin blockchain.\n\
    \nEthereum is currently the largest smart contract blockchain. Even with NFTs,\
    \ Ethereum has clearly been ahead since 2017 until today. Whether crypto punks\
    \ or CryptoKitties, the first Jack Dorsey tweet or the Beeple collage, all of\
    \ them as well as most marketplaces are part of the huge NFT world on Ethereum.\n\
    \n### Token Standards\n\nAll tokens on Ethereum, whether cryptocurrencies or NFTs,\
    \ can be assigned to unique standards. Standards are an important building block\
    \ for how tokens work. Only with suitable standards are the essential characteristics\
    \ such as ownership, access and transferability guaranteed. Standards are also\
    \ essential for software development. In this way, the basic functionalities and\
    \ behaviours are clearly clear to all those involved.\n\nThe three most common\
    \ Ethereum token standards are ERC20 for Fungible Tokens (exchangeable tokens\
    \ such as cryptocurrencies) and ERC721, as well as ERC1155 for Non-Fungible Tokens\
    \ (non-exchangeable tokens = NFTs).\n\nThe ERC20 standard assigns amounts to addresses.\
    \ Thus, per Ethereum address, the exact number of cryptocurrencies held can always\
    \ be recognized.\n\nWith the birth of CryptoKitties, the important NFT standard\
    \ ERC721 was created, on which most NFTs are based to this day. ERC1155 is another\
    \ NFT standard developed by Enjin. ERC1155 is a hybrid of exchangeable and non-interchangeable\
    \ tokens. ERC721 maps unique IDs to owners, while ERC1155 has a nested mapping\
    \ of IDs to owners to sets.\n\nNFT Premiere on Ethereum: Crypto Punks\n\nIt was\
    \ only with the Ethereum blockchain that NFTs really picked up speed. The first\
    \ Ethereum NFTs appeared as Crypto Punks in the summer of 2017.\n\nCrypto Punks\
    \ are 10,000 unique digital characters created by [Larva Labs.](https://www.larvalabs.com/cryptopunks)\
    \ Their digital proofs of ownership are stored in the form of unique tokens on\
    \ the Ethereum blockchain. Each Crypto Punk is characterized by individual optical\
    \ characteristics, so that no one is the same as the other. Crypto punks have\
    \ inspired the digital art market and were the forerunner for later standards.\
    \ Due to the limited offer and the cult status among early users, they are already\
    \ considered digital antiques. They are still tradable and interoperable with\
    \ most NFT applications on Ethereum.\n\n2017: Birth of CryptoKitties\n\nEven though\
    \ Crypto Punks were officially the first NFTs on the Ethereum blockchain, the\
    \ CryptoKitties are still in the memory of most people. At the end of 2017, they\
    \ became the first mainstream application of NFTs.\n\n2017 was a year with a lot\
