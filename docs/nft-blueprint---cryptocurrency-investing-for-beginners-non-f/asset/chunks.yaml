    DAPPs have great potential to attract more and more users in the future. The advantages
    are obvious. The development is not dependent on large companies but is decentralized
    and the community determines which functions are included in the respective DAPP
    and which are not. DAPPs can never be deleted due to decentralization. This means
    that a DAPP is available as long as the networked computers are online. The encryption
    and the peer-to-peer network also make it very secure against attacks by hackers.
    All data that is made available when using a DAPP is also quickly encrypted due
    to the underlying blockchain. New cryptocurrencies such as `Waves` or `Elrond`
    rely on the concept right from the start. As a result, anonymity is also guaranteed
    to a large extent.


    Even if there is not yet a really large selection of different DAPPs, it can be
    assumed that this will change in the near future. Whether you are looking for
    a social media channel, want to use a social network, want to make sports bets
    or simply want to play a game, there is already the right DAPP for each of these
    different possibilities. If blockchain technology continues to mature, it is not
    unlikely that in just a few years most users will do without central apps and
    will rather opt for DAPPs.


    ## 5.2. Where can you buy popular NFTs?


    Although NFTs have only exploded into the main DeFi scene, the NFT marketplaces
    have been around for quite a while. Naturally, given Ethereum’s dominance of the
    DeFi sector, all the top NFT marketplaces are on Ethereum.


    There are currently two Ethereum token standards for NFTs. First, there is the
    most widely used `ERC-721` standard, which makes the creation of individual tokens
    possible. For this, the token standard uses a new smart contract for each NFT.


    In addition, there is the `ERC-1155` standard, which allows bundled transactions
    of NFTs and makes a theoretical creation of infinitely many tokens possible with
    a single smart contract. The `ERC-1155` standard is also known as the multi-token
    standard because it handles the storage and creation of various NFTs in a single
    smart contract. It is superior to other `ERC` standards in that it is cheaper
    and more effective.


    If you want to trade NFTs, you have the choice from a growing number of marketplaces.
    Here are some of the most popular NFT marketplaces:


    * `OpenSea`

    * `SuperRare`

    * `Nifty Gateway`

    * `Foundation`

    * `VIV3`

    * `NBA Top Shot`

    * `BakerySwap`

    * `Axie Marketplace`

    * `Rarible`

    * `NFT ShowRoom`


    We have covered these marketplaces throughout this book. But here is a quick recap.


    ### NBA Top Shot


    [NBA Top Shot](https://nbatopshot.com/) is an online company launched by Vancouver-based
    blockchain company `Dapper Labs` and supported by the NBA. It allows users to
    purchase a collection of digital basketball highlights and then show it to others.
    The NBA''s top shot concept is to publish and sell digital basketball trading
    cards. However, instead of static images of players, `NBA Top Shot` cards contain
    video clips from previous games. Each clip is a unique token. To achieve these
    So-called "Moments" `NBA` events, real money must somehow be spent buying digital
    packages containing random variations of these moments or spending money on the
    market.


    The process of buying these packages is similar to queuing to buy something in
    any store. Depending on when you click on the link to buy, you have a dedicated
    place on a digital line, and if there is still a product left when your next position
    arrives, you will buy a package. When packages are exhausted, they disappear indefinitely.


    If all of this is to read to you like a foreign language, there are two points
    to pay attention to: First, you are not alone. A common chorus of confusion among
    those outside the `Best Square` community, who only hear it for the first time,
    is based on confusion and often says something like, "I feel too old to understand
    this." Secondly, this new trend can certainly become much more complicated as
    it is linked to blockchain technology and speculative investment.


    ### OpenSea: Universal Marketplace for NFTs


    [OpenSea](https://opensea.io/) is the largest trading venue for NFTs to date and
    allows trading in all types of NFTs. Therefore, on `OpenSea`, users can exchange,
    buy and sell art, game items, collectibles, domain names, etc. The diversity of
    the offer outshines all other marketplaces. In addition, the platform has several
    auction functions and is fully integrated into the crypto infrastructure.


    Although `OpenSea` is the largest NFT marketplace in the crypto space, the platform
    does not have its own token and currently serves exclusively as an interface for
    trading NFTs. For example, on `OpenSea` NFTs of `Decentraland`, `SuperRare`, `Enjin`
    can be traded.


    ### Decentraland: Marketplace in virtual world


    [Decentraland](https://decentraland.org/) can best be described as a Minecraft-like
    virtual world where you can trade NFTs. In addition, users can acquire unique
    plots of land that they can freely develop. In addition, you can also play various
    games in the virtual world. Currently there is a Halloween special where you can
    win boxes from which you can get different things.


    Within `Decentraland`, `MANA` Holders can use the token as a means of payment
    for the various NFTs. In addition, `MANA` gives users a governance right in `Decentraland`.
    This makes it possible for the community itself to vote on eligible NFT contracts,
    marketplace rules, and other operations in `Decentraland`.


    ### SuperRare: A marketplace for artists


    [SuperRare](https://www.superrare.co/), as the name suggests, deals with super
    rare art. Therefore, it is an NFT marketplace that deals specifically with digital
    works of art. The platform stands out from other NFT marketplaces through social
    profiles, a mobile app, live auctions and advanced payment options.


    Via `SuperRare`, artists have already been able to sell art worth more than three
    million US dollars.


    ### Rarible: Get RARI Tokens for Trading NFTs


    [Rarible](https://rarible.com/) enables the creation and trading of NFTs. In addition,
    the platform has its own governance token called `RARI`. This token makes it possible
    to participate in votes on important matters. Users can keep the generated NFTs,
    give them away, or sell and buy them on the marketplace. In addition, users of
    the `Rarible` platform will receive `RARI` tokens as a reward for trading NFT''s
    `RARI` tokens.


    The interface allows the NFT producers to set rules. This means, for example,
    that they receive a part of the price paid for each further transfer of ownership.
    In addition, the marketplace offers a clear user interface that is constantly
    evolving.


    ### Enjin Marketplace: A Marketplace for Gamers


    The [Enjin Marketplace](https://enjin.io/) is the official marketplace for the
    `Enjin`-based NFTs. Users can easily and quickly trade Non-Fungible Tokens through
    the website. In addition, `Enjin`, one of the first trading venues for NFTs, was
    released and is also considered the inventor of the `ERC-1155` standard. To buy
    NFTs, you need `ENJ` tokens. In addition, you need `Ethereum` so that transactions
    can be processed.


    The `Enjin` platform is specifically aimed at gamers, with different items usable
    in multiple games. The `Enjin` marketplace has a considerable trading volume,
    lists thousands of items and offers a clear web interface. According to `DappReview`,
    there are more than 1 billion `ERC-1155` items for which over a million US dollars
    have already been deposited to `ENJ`.


