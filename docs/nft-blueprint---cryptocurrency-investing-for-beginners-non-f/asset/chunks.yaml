    Of course, in the end, it is up to each user to protect their own account in the
    best possible way. Here, as with bank accounts, it is not important to pass on
    data such as `seed phrases` or passwords to third parties and to store the `seed
    phrase` in a place accessible only to the user. Thus, everyone can contribute
    to making their own account as secure as possible.


    The `MetaMask Wallet` itself has never been the target of hacker attacks in its
    long runtime. Even in relevant forums, there is never any talk of unfair methods
    of the provider – and this with millions of active users. These are all good reasons
    to suggest that `ConsenSys` and the `MetaMask Wallet` are a trusted provider.


    # MetaMask Customer Service


    `MetaMask` customer service is friendly, competent and responded promptly to all
    inquiries we made. However, there are also some limitations that we will discuss
    in more detail in this section.


    First of all, there are several ways to independently inform yourself about `MetaMask`,
    even before you even need to use the customer service. In addition to the rich
    `FAQ` section, there is also the `MetaMask Docs`, a kind of Wikipedia for the
    provider, in which interested parties can go into more detail and learn everything
    worth knowing about the provider. As a further alternative, you can search for
    the respective answer in the community forum.


    In addition, users can of course also contact the provider directly. But here,
    unfortunately, it is only possible to contact the customer service of `MetaMask
    Wallet` with a registration form. For most questions, this is not a problem, but
    we would have liked at least a live chat support, so that there could be a contact
    person immediately in case of burning problem. We hope that these issues will
    be fixed in the future so that users can achieve the best and fastest customer
    service a wallet has to offer.


    # Pros and Cons by MetaMask


    If you are looking for a trustworthy `Ethereum` wallet, you do not need to search
    further. `MetaMask` offers a number of advantages that distinguish the wallet
    from other providers and make stand out from the crowd. First of all, in addition
    to the high security standards, there are also the low costs, which, in addition
    to the variable `gas prices`, are located at `0.3%` to `0.875%` of the transaction.
    In addition, `MetaMask` makes it possible to access many other `dApps`.


    The abundance of features and the fact that `MetaMask` offers not only professionals
    but also beginners a great introduction to the `Ethereum` ecosystem thanks to
    the intuitive menu navigation is what makes `MetaMask` so special. It is not for
    nothing that the wallet is part of the gold standard when it comes to `Ethereum`
    wallets. Millions of users from all over the world are convinced of the advantages.


    In addition to the advantages, it is of course important to note that the `MetaMask
    Wallet` cannot be used for all tokens. Since it is a pure `Ethereum` wallet, the
    selection of tokens to be stored is rather limited here. Tokens supported by `MetaMask`
