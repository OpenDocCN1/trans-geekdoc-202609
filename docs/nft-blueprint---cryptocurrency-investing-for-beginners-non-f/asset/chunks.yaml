- raw: 'With Meta Mask it is easily possible to store tokens, send them and also exchange
    them with each other. Through swaps, Meta Mask users receive the cheapest prices
    available on the market at the time of trading – with a relatively low transaction
    fee of up to 0.875% of the trading volume. At the same time, Meta Mask prides
    itself on offering the most secure and at the same time simplest service, so that
    users can easily use other blockchain-based decentralized applications (dApps)
    – even without previous knowledge.


    Therefore, the provider describes itself as a "crypto wallet and gateway to blockchain
    apps": Here, users are provided with a large selection of innovative and decentralized
    apps. In concrete terms, this means that Meta Mask is more than just a commercially
    available wallet. The functionality of Meta Mask can therefore be roughly divided
    into three areas:


    ●Ethereum wallet for storing, sending, receiving and swapping tokens


    ●A means to access innovative dApps


    ●An app that delivers more security and anonymity


    How to Set up MetaMask Wallet?


    If you already feel like using the Meta Mask Wallet, you can log in within just
    a few minutes. In the following, we specify in three steps how to quickly and
    easily download and set up the wallet for all operating systems. While in the
    next sections we will focus more on the browser version, we will go into more
    detail below on the differences between the operating systems.


    Step 1: The MetaMask Download


    In the first step, it makes sense to go to the [website of the provider.](https://metamask.io/)
    Here are all possibilities to choose from how Meta Mask can be used. In addition,
    it is of course also possible to download the apps or add-ons directly from external
    stores such as Google Play. For add-ons, however, it should be made absolutely
    that you really download the original versions in the respective store. For example,
    if you are looking for the MetaMask Firefox add-on in the browser, you can simply
    click on "Add-ons" in the menu bar and enter the name of the provider in the search
    bar. If you then decide to add MetaMask, the add-on will be downloaded.


    Step 2: MetaMask Login


    After successful download, it is sufficient to accept the privacy policy and create
    a so-called Secret Backup Phrase. This backup phrase should be written down and
    stored in a safe place. This ensures that your own currencies can be restored
    in the event of a loss of the device or other mishaps. Therefore, this step should
    be done with thoroughness and really ensure that no spins occur in the order.


