- raw: 'If we take into account the current uses of NFT''s, we can say that it solves
    intellectual property problems first. While it is very easy to copy a work in
    digital environment, NFT solves this problem by revealing who owns the rights
    to the work. Because they are a programmable digital asset, artists'' share of
    the next sale can also be encoded inside the NFT. Thus, in the event of a sale,
    the relevant amount is automatically transferred to the artist''s wallet. The
    digital nature allows users of all types to buy them from all over the world.
    As the customer base expands thanks to digitalization, the number of people who
    can reach the work and want to invest increases and the demand increases, and
    the price increases as the demand increases. As demand increases, so do supply.
    Both more works and works at different price levels are coming to market. This
    increases accessibility for investors and art lovers and allows more works to
    be sold. The ecosystem is expanding.


    ●How can I be sure of the authenticity of NFT''s?


    In the cryptocurrency ecosystem, the reputation of individuals is highly valued.
    Artists who produce NFT and want to put it up for sale go through the stream of
    verified profiles used by NFT marketplace applications to prove that their work
    is original. If you have the information of the wallet address of the artist concerned,
    which is shared publicly for the purpose of receiving payment, you have the chance
    to confirm the authenticity of the work. In addition, you can be sure of the authenticity
    of both the artist and his works by tracking the movements of the NFT from the
    blockchain monitoring application.


    ●Where are the files inside the NFT stored?


    NFT''s contain evidence of many file formats, such as pictures, audio, short videos,
    and documents. Because these files are difficult and costly to store on the blockchain,
    they are stored on a distributed file retention protocol called IPFS. Uploaded
    files are encrypted and broken into small pieces and shared to drops on IPFS.
    Proof that the relevant file has been uploaded to IPFS is saved on the blockchain
    with NFT.


    ●What are the vocal NFT sales?


    If we talk about the most interesting sales of the last period; US artist Beeple
    (Mike Winkelmann) has sold a collage of his works at auction house Christie''s
    for $69.4 million. Lebron James'' dunk video NFT, sold through the NBA Top Shot
    app, retails for $77,000. Twitter CEO Jack Dorsey''s tweet was bought by a Turkish-born
    person for $2.9 million, while Elon Musk auctioned off his tweet, which included
    GIF and music, as NFT. In recent days, Cüneyt Özdemir''s tweet sold for $10,000.


    ●What are the NFT uses of the future?


    As experiences with NFT increase, we see creative new business models being constructed.
    First, the digitization of physical assets, i.e., tokenization, can be adapted
    to a wide range of sectors. Last week, for example, a 3D virtual world-designed
    home in America sold for $500,000. We also know that in some games land sales
    are made as NFT. Another area where NFT will have an impact will be social media.
    Metrics such as the number of follow-ups, views and views that creator’s cash
    in on will become unaffordable by centralized social media companies thanks to
    NFT''s. Digitization of physical assets seems to cause us to redesign many of
    the processes we are accustomed to. We can consider a scenario in which NFT generates
    government bonds as NFT in future uses and can trade them globally. Obviously,
    business models in the NFT world are limited to your imagination.


    ## 3.3. Understanding Smart Contracts


    Imagine you have to sell a house. This is a rather complex and daunting process.
    There are a large number of documents, communication with different companies
    and people, as well as a high level of various risks. Therefore, the absolute
    majority of home sellers want to find a real estate agent who deals with all the
    paperwork, markets the property and acts as an intermediary when negotiations
    begin, overseeing the deal until it closes.


    Moreover, an escrow service, which is especially useful in such transactions,
    provides an assurance since the amounts in question are normally quite large and
    you cannot really trust the counterparties. However, after a successful deal,
    the seller and the buyer''s agents will share about ten percent of the sale price
    as commissions. This means a fairly significant financial loss for the seller
    or buyer.


    All these are situations where smart contracts can really revolutionize the entire
    industry in a convenient and effective way. Perhaps most importantly, a trust
    issue will be solved. Smart contracts work on the principle of ''If-Then''. In
    other words, the ownership of the house is transferred only to the buyer when
    the agreed amount of money is sent to the system.


    They also work as escrow, that is, both the money and the property right are stored
    in the system and distributed to the participating parties at the same time. In
    addition, error-free delivery is guaranteed because the transaction has been witnessed
    and verified by hundreds of people. Since trust between the parties is no longer
    an issue, an intermediary is no longer needed. All functions made by a real estate
    agent can be preprogrammed into a smart contract, saving both the seller and the
    buyer a significant amount of money at the same time.


    Before we delve into how smart contracts work, we first need to understand how
    decentralized finance works. That is because both DeFi and smart contracts are
    interdependent.


    ### Decentralised Finance (DeFi)


    DeFi can be defined as an ecosystem of financial applications running on blockchain.


    The promise of cryptocurrencies is to make money and payments universally and
    democratically accessible to everyone, wherever you are in the world.


    Decentralized Finance (DeFi) or the Open Finance movement aims to take this promise
    one step further. So imagine that all the traditional financial services you use
    today (deposits, loans, commerce, insurance and much more) are a global and open
    infrastructure that can be accessed by anyone with a smartphone and internet connection
    worldwide.


    In the past 4 years, Decentralized Finance has become one of the fastest growing
    areas in the blockchain and cryptocurrency world both in terms of number of users
    and in terms of monetary value invested. The vast majority of this growth was
    built on the Ethereum blockchain.


    Problems of centralized structures


    DeFi is not really a new concept, this definition has emerged by individuals and
    institutions that have analyzed today''s traditional financial structures for
    years in order to identify the problems found in traditional systems and to take
    steps towards a solution.


    ●The "Fault Tolerance" of central structures is low (Need for Decentralization)


    ●Access barriers to National and International Alternative Financial Instruments
    are high (Technology & Personal Finance Requirement)


    ●Intermediary and Third-party institutions risk endless control over our financial
    assets (Need for Financial Freedom)


    Since 2016-2017, DeFi products have been publicly making economic and financial
    instruments accessible outside of central authorities and without corporate governance
    systems. First of all, we would like to break down a few common misconceptions
    here without going into more details about DeFi.


    Centralized Finance (CeFi) and Decentralized Finance (DeFi) in comparison


    There are numerous projects that are revolutionizing the financial market on the
    basis of blockchain. The technology offers many advantages over traditional banking.
    Among other things, customers can avoid high costs, although the returns are often
    high. However, central projects differ significantly from decentralised projects
    and should therefore be distinguished in detail.


    Decentralized finance'
