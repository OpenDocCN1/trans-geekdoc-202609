  fmt: '

    According to the latest report by Juniper Research, “Key Vertical Opportunities,
    Trends & Challenges 2019-2030”, records show that when we use blockchain technology
    along with IoT sensors and trackers, we will enjoy several benefits such as:


    - Simpler regulatory compliance

    - Savings of about $31 billion in food fraud globally by 2024

    - Streamlining of the supply chain, which will cut down on retailers’ costs

    - An enhanced and expedited food recall process


    Also, the Food and Agriculture Organization (`FAO`) revealed in a 2018 policy
    paper that blockchain is capable of transforming the food supply chain in India.
    With the use of `smart contracts`, local operations can cut down on transaction
    costs and increase efficiency and margins. This would transfer a reasonable part
    of the profits to the farmers and producers.


    Just like supply chain management, there are several participants in the food
    industry supply chain – farmers, vendors, retailers, consumers, and many others.
    This explains why it''s generally quite complex to track farm produce and food
    from farm to table. With blockchain technology, retailers and suppliers will get
    a clearer picture of their data.


    At present, several companies are already providing blockchain solutions to the
    food industry, one of which is `IBM Food Trust`. The company is regarded as the
    most mainstream distributed ledger technology-powered tracking solution in the
    food industry. The project is based on the `Hyperledger Fabric` blockchain protocol.


    In 2016, in China, `Walmart` actually spearheaded the first product trials, and
    other industry giants that have embraced `IBM`’s food tracking ecosystem since
    include `Kroger`, `Dole Food`, `Unilever`, `Carrefour`, and `Nestle`. In fact,
    reports show that the U.S. National Fisheries Institute is already working with
    Big Blue’s Food Trust` project to trace seafood, in an effort to track several
    seafood species.


    However, there are serious hurdles to the mass adoption of blockchain technology
    in the food industry and one such challenge is data collection from various companies,
    mainly due to globalization. Another challenge is interoperability, but several
    blockchain projects like `Chainlink` and `Polkadot` are already dealing with this
    issue, as we discussed earlier.


    Most blockchain solutions are now compliant with existing `GS1` standards – these
    are the standards that the food industry depends on to format data for shared
    communications across supply chains. The results so far are a strong indication
    of food companies’ willingness to explore the potential solutions that distributed
    ledger technology has to offer.


    ## 3.2. How NFTs are Different from Cryptos?


    `NFTs` share a lot of similar properties as cryptocurrencies. Note that both cryptos
    and `NFTs` are built on blockchain. This means that they share a lot of similarities.
    Here are some of the most notable differences between `NFTs` and cryptocurrencies.


    - **Indivisible**: Fungible tokens like cryptos are divisible, which means it
    is possible to send or own a fraction of `Bitcoin` or another `ERC-20` token.
    Similar to cash, where you can pay with a ten-dollar note and receive change.
    Non-fungible tokens cannot be shared and must be purchased or sold in their entirety.
    As with collectible cards, where no one would think of buying half a card.


    When an asset is fungible, it means that it can be easily interchanged with another
    asset, as is the case with barter trade, or it can be exchanged for money. That
    means you can use a fungible asset to acquire goods or services. More so, fungible
    assets can be broken down into smaller units. For example, `bitcoin` is a fungible
    asset. Take `BTC` for example. `1 BTC` can be subdivided into eight decimal places
    to the smallest unit called the `Satoshi`.


    Thus, `1 Satoshi = 0.00000001 BTC`, i.e., hundredth of a millionth bitcoin.


    - **NFTs are not interoperable**: This means that one `NFT` cannot be used instead
    of another `NFT`. This is because each `NFT` is unique and has its own features
    and information. An example of this would be the game `CryptoKitties`. A user
    cannot use an asset from the game in another game. This is due to the uniqueness
    of every `NFT`, which unlike cryptos, can be exchange and traded for each other.


    For example, you can trade `1 BTC` for its equivalent in `ETH` or any other crypto
    regardless of the blockchain they are built upon. With `NFTs`, you can’t trade
    or exchange `CryptoKitties` with an `NBA Top Shot NFT`.


    ### Everything You Need to Know about NFTs


    #### What is NFT?


    `NFT`, or `Non-Fungible Token`, can be identified as a unique digital entity containing
    images, audio files, videos, or proof of the digital equivalent of a physical
    entity. Founded in `Ethereum` in 2017, `NFTs` have become one of the most popular
    topics in the cryptocurrency world in 2021. Today, `NFTs` are widely used for
    digital artworks, while there are also different uses such as interactive game
    items and sports collection cards.


    #### How is NFT different from other cryptocurrencies?


    `Non-Fungible Token` means token that cannot be divided and cannot be produced
    again from the same. Unlike cryptocurrencies such as `Bitcoin` and `Ether`, which
    are fungible, `NFTs` are unique digital assets. To illustrate with an example,
    today you can buy and buy a `Bitcoin` or `Ether` by breaking it into pieces and
    exchange the same cryptocurrency in its own unit. However, it cannot be exchanged
    for another token as it is unique to `NFT`, a private digital asset. Its internal
    value is determined by its manufacturer or investor.


    #### How are NFT''s produced?


    `NFTs` are manufactured according to the `ERC-721` token standard prepared by
    `Ethereum` developers. There are platforms that make it possible to perform the
    transaction easily so that users do not choke on the technical world of blockchain.
    All you need to produce `NFT` is a digital cryptocurrency wallet. After you upload
    the file that you want to produce as an `NFT` to the `IPFS` system through these
    platforms, you must specify the parameters of the `NFT` that cannot be changed.
    After determining the features such as how many will be produced from `NFT`, price,
    how much share you need to be paid on the next sale, `NFTs` will be produced by
    paying the transaction fee of the blockchain network. Upon completion of the transaction,
    `NFTs` are transferred to your wallet and recorded on the entire blockchain where
    the production is carried out.


    #### How do I get an NFT?


    There are also platforms where `NFTs` are exhibited and purchased. On these platforms,
    you can have your favourite `NFTs` as determined by the manufacturer, with auction
    or direct purchase options. When the purchase is complete, the `NFT` will transfer
    from the manufacturer''s wallet to your wallet.


    #### Is NFT an investment tool?


    `NFTs` differ from other cryptocurrencies by design and their value is determined
    by the person or investor who produces the work rather than the checkboard. If
    we interpret the subject of investment through digital art, it is not so different
    from investing in physical art. Similarly, parameters such as how rare that asset
    is, its age, and cosmetics determine the value of an asset you purchase as part
    of the collection.


    #### What impact will the NFT have?

