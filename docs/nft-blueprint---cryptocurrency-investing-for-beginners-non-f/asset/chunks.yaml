    ### 1. Programmable Money


    When using fiat money, we need banks and humans to complete transactions, but
    digital money can actually be programmed to escrow and distribute itself. When
    renting an apartment, the landlord usually collects a security deposit in case
    a tenant destroys part of the property. These funds are supposed to be kept in
    a separate escrow account, and they shouldn''t be spent. Tenants have to rely
    on the good faith of the landlord to return the deposit when the lease ends.


    Unfortunately, this has become one of the most common cases in small claims court
    because of the failure of the human, trust-based system. With the multi-signature
    feature of `Bitcoin`, we can create a programmable escrow where the landlord and
    tenant can create a multi-signature transaction instead of sending dollars to
    a bank account.


    In the event that a tenant damages the property, the landlord can simply send
    the evidence to an arbitrator, and the tenant can also respond. Upon hearing from
    both sides, the arbitrator will simply use the `private key` to send the funds
    to the winning party.


    ### 1. Tokenization


    Since digital securities can also represent a holder''s ownership stake in tangible
    assets like real estate, they can allow investors to go through the ownership
    structure on a verifiable blockchain network, and this would significantly increase
    transparency.


    We can lower the barriers to real estate investing when we have the ability to
    buy a digital token that is a representation of a fraction of a piece of real
    estate. By purchasing a fraction of real estate, investors wouldn''t have to worry
    about the administrative tasks associated with managing the properties themselves.


    ### 1. Smart Contracts


    Primarily, smart contracts help significantly lower the need for us to process,
    trust, and verify an agreement. Since a smart contract is automated, it can effectively
    execute an action once specific conditions are satisfied. This is where blockchain
    platforms such as `Ethereum` come in, since they have the ability to perform smart
    contracts. With smart contracts, the transfer of title to a property will take
    place once the funds are received.


    This creates a record of transfer that is verifiable and publicly available. Smart
    contracts also help reduce the possibility of fraud and don''t need external measures
    to help enforce the performance of the agreement.


    We will cover smart contracts in depth at a later section.


    ## Blockchain and Digital Identity


    The truth is that the existing identity systems are insecure, exclusive, and fragmented.
    Let''s look at how traditional identity works for companies. Most of these companies
    obtain sensitive information regarding their users and store such information
    alongside routine business data that is less sensitive. This eventually leads
    to new business risks where sensitive data is treated just like less-sensitive
    information.


    Another challenge with existing centralized data management has to do with increasing
    user-focused privacy regulations and greater focus on corporate IT responsibility.
    These new privacy regulations have prompted many organizations to store data about
    users in data vaults that are extremely guarded. This means that users would no
    longer provide the necessary information that would foster product improvements
    and better understanding of customer needs.


    Also, when we look at the Internet of Things devices, there are more than seven
    billion Internet-connected devices, and it is believed that this number will increase
    to 22 billion by 2025. In this nascent industry, most IoT technologies have not
    been able to incorporate the right identity and access management capabilities.


    IoT devices and objects that are interconnected need to identify sensors, monitors,
    and devices and also manage access to sensitive and non-sensitive data securely.
    But this sector has experienced issues with mismatching standards across devices,
    and as a result, security usually becomes an afterthought.


    For most people, identity is essential for them to function well in both society
    and the economy. When we have an appropriate way to identify ourselves and our
    possessions, we are able to create thriving societies and global markets. Most
    of the data regarding our identity, such as nationality, first and last names,
    social security number, and several other bits of information are issued by centralized
    government entities and also stored in centralized databases.

    '
  trans: '


    # 1. Tael (最初名为 WaBi): 该项目致力于通过在每个产品上使用防伪标签来防止产品伪造。其原生代币被称为 Tael。


    # 1. Origin Trail: 该项目实际上不仅仅是一个区块链——它是一种中立的供应链管理区块链协议。Origin Trail 专注于解决数据中心化和数据碎片化问题。


    ## 区块链与房地产


    区块链另一个将改变的行业是房地产。通过互联网，个人可以廉价且快速地传输信息，而无需中介。区块链技术在允许人们传输价值的同时，还提供了类似的益处。因此，虽然我们可以通过互联网传输图片和文字，但区块链平台为我们提供了传输资产、资金和任何重大价值物品的机会。


    当涉及到传统的房地产交易时，这些交易往往成本高昂、耗时且复杂。观察房地产行业的管理流程（包括融资和行政、租赁、租约、购买和出售）可以发现，这些流程通常效率低下且枯燥。


    目前，这些流程大部分仍以纸质形式存在，并且需要公事业部门、土地登记处、物业经理、律师、公证员和经纪人等中介的服务。区块链将从五个主要方面改变这一过程以及整个房地产行业。


    ### 1. 欺诈预防


    房地产中的欺诈问题泛滥，且通常发生在低端，例如小偷小闹进行的 500 美元转租欺诈，而银行和抵押贷款人则会给那些签署误导性次级租赁合同的人带来问题。


    分布式账本技术可以通过提供不可篡改的数据库来防止房地产欺诈，该数据库只能由选定的参与者更新，而不依赖于单一事方的信任。它没有单点故障，也没有存储房产数字证书或记录资金发送方和接收方的中心化服务器。


    区块链技术能够消除与伪造所有权文件和虚假列表相关的问题。英国实际上计划在 2022 年前采用基于区块链的土地登记，而瑞典是最早考虑在房地产中使用区块链技术的国家之一。


    ### 1. 去中介化


    房地产行业的大多数人同意我的观点，即由于房地产数据库、产权公司、托管公司、公证员等多个中介的要求，房地产交易往往是繁琐、昂贵且不透明的。这些中介持有的信息通常难以获取，这进一步确保了他们巨大的重要性。


    他们仍然需要的另一个原因是，他们拥有在当前房地产生态系统中运行所需的许可和技能。然而，通过“无许可”或“公共”区块链，任何人都可以查看信息，而不会受到审查或需要许可。在移除中介后，降低所有相关成本将成为可能。


    通过分布式账本技术和智能合约，我们可以自动化大部分流程，从而节省金钱和时间。这最终为买家和卖方带来更高效、更完善的体验。


    ### 1. 可编程货币


    在使用法币货币时，我们需要银行和人类来完成交易，但数字货币实际上可以被编程为自我托管和分发。在租租公寓时，房东通常会收取押押金，以防租客损坏部分财产。这些资金应该被保存在独立的托管账户中，不应被使用。租客必须依靠房东的诚信才能在租约结束时退还押金。


    遗憾的是，由于这种基于信任的人类系统失效，这已成为小额诉讼法庭中最常见的案件之一。通过 `Bitcoin` 的多签名功能，我们可以创建一个可编程的托管，房东和租客可以创建一个多签名交易，而不是将美元发送到银行账户。


    如果租客损坏了财产，房东只需将证据发送给仲裁员，租客也可以做出回应。在听取双方意见后，仲裁员只需使用 `private key` 将资金发送给获胜方。


    ### 1. 代币化


    由于数字证券也可以代表持有者对房地产等有形资产的所有权份额，它们可以允许投资者在可验证的区块链网络上查看所有权结构，这将显著提高透明度。


    当我们能够购买代表某处房地产份额的数字代币时，我们就可以降低房地产投资的门槛。通过购买房地产的份额，投资者将不必担心与管理物业本身相关的行政任务。


    ### 1. 智能合约


    主要，智能合约有助于大幅减少我们处理、信任和验证一份协议的需求。由于智能合约是自动化的，一旦满足特定条件，它就可以有效执行操作。这正是 `Ethereum`
    等区块链平台大显身手的地方，因为它们具有执行智能合约的能力。通过智能合约，一旦收到资金，房产产权的转移将会发生。


    这创建了一个可验证且公开的转移记录。智能合约还有助于减少欺诈的可能性，并且不需要外部措施来帮助强制执行协议履行。


    我们将在后的章节中深入介绍智能合约。


    ## 区块链与数字身份


    事实是，现有的身份系统是不安全的、排他的且碎片化的。让我们看看传统身份对公司是如何运作的。大多数公司获取有关用户的敏感信息，并将此类信息与敏感性较低的日常业务数据一起存储。这最终导致了新的业务风险，即敏感数据被像非敏感信息对待。


    现有中心化数据管理的另一个挑战与日益增加的以用户中心的隐私法规以及对企业 IT 责任的高度关注有关。这些新的隐私法规促使许多组织将用户信息存储在受到严格保护的数据库中。这意味着用户将不再提供有助于产品改进和更好地理解客户需求的必要信息。


    此外，当我们观察物联网（IoT）设备时，有超过 70 亿联网设备，预计到 2025 年将增加 220 亿。在这个新兴行业中，大多数物联网技术未能整合正确的身份和访问管理能力。


    联网的物联网设备和对象需要识别传感器、监控器和设备，并安全地管理敏感和非敏感数据的访问。但该行业经历了设备标准不匹配的问题，因此安全通常变成了事后考虑的问题。


    '
