    A good example of collectibles on the blockchain via non-fungible tokens has already
    been mentioned with the `CryptoKitties`. Of course, the market for collectibles
    is much larger and does not only include funny cats, which nevertheless serve
    as a prime example for this sector.


    An `NFT` can be useful for all collectibles. Especially in cases where it is about
    authenticity, not only about the ownership, in valuable paintings or sculptures.
    These could be verified and authenticated by experts before creating an `NFT`
    whose possession simultaneously reflects the ownership and authenticity of a collectible.
    Thus, two central problems of the art world, namely the falsifying of valuable
    works and the fraudulent trade in stolen pieces, can be curbed.


    ### Online Games


    In many online games, the characters can collect in-game currencies, often in
    the form of skins (clothes, weapons) and exchange them with other players. If
    you were to make these in-game currencies into an `NFT`, players could also exchange
    and trade them in the real world.


    In this way, completely new economies for fictional goods can emerge. An example
    of this is the `Decentraland` project, which interactively creates a world of
    its own from which players can buy a piece of land in the form of an `NFT`. However,
    we are still at a very early stage here. One can assume that online games in particular
    will devote more and more time to non-fungible tokens and their integration into
    game concepts in the coming years.


    ### Tickets


    Tickets are another area that will probably be the first to be really influenced
    by `NFTs`. The trade in tickets, both online and offline, has flourished, especially
    since the introduction of the Internet and corresponding trading platforms. One
    problem is often fake tickets that are used to defraud buyers. With the involvement
    of `NFTs` in this sector, these problems could be avoided.


    ### Identity and certification


    It gets really interesting when we shift the focus from real goods to more abstract
    things, such as the control of identities with the help of `NFTs`. Whether birth
    certificate, passport or driver''s license – as an `NFT` you could communicate
    more efficiently with authorities that need personal data. Of course, this is
    only about ensuring the correct use of personal data, not about the trade in driving
    licences, which is, of course, not possible.


    ### Sports


    Traditionally, the sports industry has been leading when it comes to collectable
    items – especially trading cards. And when it comes to `NFTs`, the industry hasn’t
    been left behind either. The top two NFT projects in sports are `NBA Top Shot`
    and `Sorare`.


    So, what are `NFTs` for sports fans?


    Apart from digital works of art, there have long been `NFTs` for sports fans.
    The French company `Sorare`, for example, has transferred the principle of trading
    cards to the Internet. If you register on the platform, you can buy the cards
    there, of which there are only a limited number. With your cards you can then
    participate in leagues and win money or other trading cards there, which can later
    be used or sold again.


    Of course, many fans are still wondering: What are `NFTs` and is this new trend
    really gaining ground? The figures show that so far it is indeed a niche market.
    At `Sorare`, at the end of March, only just under 14,000 users worldwide had decided
    to buy at least one card with their own money. Within a month, however, this number
    had more than doubled. The growth rates of the company, which has only been usable
    at all since the beginning of 2019, are enormous. In addition, the huge number
    of football fans worldwide means that there is huge potential.


    This is also underlined by the revenues that the `NBA` already generates with
    `NFTs`. Although these are still quite small compared to the revenues from TV
    or advertising contracts, growth is currently rapid here as well.


    And yet another aspect suggests that `NFTs` in the sports field are not a typical
    bubble. The way fans want to see sports is changing. Especially with younger fans,
    entire games are no longer as in demand as the summary of the highlights. Statistics
    are also playing an increasingly important role – a trend that can be seen in
    virtually all popular television sports. It is therefore important for the managers
    to find new ways to interact with the fans.


    ## 4.2. Why NFTs are the Future of the Art world?


    There''s a real excitement about `NFTs`. "The ground-breaking events of recent
    weeks are finally evidence of advances in digital art," says experts. Crypto art
    is the artistic expression of what is possible today. "A natural development for
    artists interested in new technologies thematically or as a tool." The aesthetics
    of technology are its own – reminiscent of avatars and games.


    Artists who allowed the digital world to flow into their work have been part of
    contemporary art since the late 1960s. It all started with the drawings that the
    first computers created – they were still huge machines back then. Pioneers of
    computer art were artists such as `Manfred Mohr`, `Frieder Nake` and `Vera Molnár`.
    The first computer animations were created immediately afterwards.


    Digital art consists of mixed work, such as interactive installations that include
    a software or audio component. If videos are digitally generated, video setups
    are part of it. Video art with cameras is a separate section. A parallel universe
    has opened up. There are a lot of amazing artists in this area. One name to remember
    is `Yucef Merhi`. One of his works, `The Poetic Clock`, is a machine that turns
    time into lyrical poetry and produces 86,400 different poems every day.


    ### NFTs and Art


    "EVERYDAYS: THE FIRST 5000 DAYS" is the name of the work of the digital artist
    `Beeple`, which was able to achieve a proud 69 million US dollars at an auction
    of the prestigious auction house `Christie''s` in London. The special feature
    of the auction is the fact that the image does not exist physically but is only
    available digitally. From May 1, 2007, the creator created a digital image every
    day with reference to his or all of our lives – for 5,000 days. The compilation
    of all these pictures results in the now auctioned work of art.


    But not only the auction of a purely digital product is something special for
    `Christie''s`. Founded in 1766, the historic auction house also dared to use the
    crypto parquet with the `Beeple` auction. With a resolution of 21,069 x 21,069
    pixels and around 319 megabytes, the masterpiece in `Jpeg` format was linked by
    the artist with a so-called `Non-Fungible Token`, `NFT` for short. With this token,
    the new owner can prove his ownership rights to the digital creation with the
    blockchain. As the new owner, he is now known on the `Ethereum` network.


    The masterpiece "EVERYDAYS: THE FIRST 5000 DAYS'''' by `Beeple` is a picture from
    the "EVERYDAYS" series. The artist has already been able to sell 21 works of art
    from this series via `Nifty Gateway`, the NFT art trading platform of the `Winklevoss
    brothers`. He generated proceeds of $3.5 million.


    The work of art was created in more than 13 years, the artist had taken a digital
    picture every day. His Instagram account is followed by around 2 million accounts,
    which confirms that the public''s interest in digital art is very high.


    The 5,000 individual images made the artist stone-rich, and he apparently got
    a taste for selling digital art with `NFTs`. This was followed by "The Complete
    MF Collection", which consisted of 20 works and was sold for 3.5 million US dollars.

    '
  trans: '


    通过非同质化代币（NFT）在区块链上实现收藏品的一个很好的例子之前已经通过 `CryptoKitties` 提到过。当然，收藏品市场要大得多，而且不仅包括有趣的猫，尽管这些猫确实是该领域的首要范例。


    `NFT` 对所有收藏品都有用处。特别是在涉及昂贵绘画或雕塑等、关乎真品性而不仅仅是所有权的情况下。在创建 `NFT` 之前，这些专家可以对其进行验证和认证，随后该
    `NFT` 的持有就同时反映了收藏品的所有权和真品性。这样，艺术界的两个核心问题——即昂贵作品的伪造和被盗物品的欺诈交易就可以得到抑制。


    ### 在线游戏


    在许多在线游戏中，角色可以收集游戏内货币，通常以皮肤（衣服、武器）的形式存在并与其他玩家交换。如果你将这些游戏内货币变成 `NFT`，玩家也可以在现实世界中进行交换和交易。


    通过这种方式，虚拟商品可以产生全新的经济模式。`Decentraland` 项目就是一个例子，它通过互动创建了一个属于自己的世界，玩家可以在其中以 `NFT`
    的形式购买土地。然而，我们在这里还处于非常早期的阶段。可以推测，在线游戏在未来几年将投入更多时间到非同质化代币及其与游戏概念的整合中。


    ### 票


    票是另一个可能最早受到 `NFTs` 真正影响的领域。门票交易无论是在线还是线下都在蓬勃发展，特别是自从互联网和相应的交易平台引入以来。一个问题通常是用于欺骗买家的假票。随着
    `NFTs` 参与这一领域，这些问题可以被避免。


    ### 身份与认证


    当我们把重心从实物转向更抽象的事物时，例如借助 `NFTs` 控制身份，情况就变得非常有趣了。无论是出生证明、护照还是驾驶执照——作为一种 `NFT`，你可以更高效地与需要个人数据的机构进行交流。当然，这仅仅关乎确保个人数据的正确使用，而不是关于驾驶执照的交易，而这显然是不可能的。


    ### 体育


    传统上，体育行业在收藏品方面一直领先领先——尤其是交易卡。在涉及到 `NFTs` 时，该行业也没有落后。体育领域顶部的两个 NFT 项目是 `NBA Top
    Shot` 和 `Sorare`。


    所以，对于体育粉丝来说，`NFTs` 是什么？


    除了数字艺术品，长期以来一直为体育粉丝提供 `NFTs`。例如，法国公司 `Sorare` 将交易卡片的原理转移到了互联网。如果你在平台上注册，你可以在那里购买卡片，这些卡片的数量是有限的。通过你的卡片，你可以参加联赛并赢得资金或其他交易卡，这些卡片以后可以被再次使用或出售。


    当然，许多粉丝仍在思考：`NFTs` 是什么，这个新趋势真的在取得进展吗？数据显示，到目前为止这确实是一个利基市场。在 `Sorare`，截至 3 月底，全球仅略低于
    14,000 名用户决定用自己的钱购买至少一张卡片。然而，在一个月内，这个数字增加了一倍多。这家公司自 2019 年初开始才可用，其增长率是惊人的。此外，全球巨大的球迷粉丝数量意味着巨大的潜力。


    `NBA` 已经通过 `NFTs` 产生的收入也强调了这一点。尽管与电视或广告合同的收入相比，这些收入仍然相当小，但目前这里的增长也非常迅速。


    然而，另一个方面表明，体育领域的 `NFTs` 并不是典型的泡沫。粉丝观看体育的方式正在改变。特别是对于年轻粉丝来说，整场比赛不再像高光集锦那样受欢迎。统计数据表明……（注：原文此处似乎中断，翻译随之结束）。


    *(注：根据提供的原文文本，内容在 Statistics 处之后中断，此处已根据提供的内容完成翻译。)*


