    \ can control their decisions. In addition, this mechanism should not be interfered\
    \ with from the outside. This is only possible with Blockchain technology.\n\n\
    Data transfer on a communication network created with blockchain technology is\
    \ only possible with confirmation from each node. In addition, blockchain networks\
    \ are protected by near-impossible-to-break cryptography. At least 51 percent\
    \ of the nodes need to be checked for the network to be manipulated.\n\n### Technical\
    \ functioning of the blockchain system"
