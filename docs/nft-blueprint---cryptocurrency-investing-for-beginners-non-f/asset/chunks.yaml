    \ with NFT to improve their ecosystems is growing steadily. Therefore, the Tron\
    \ developers believe that the TRC-721 standard will open up many possibilities\
    \ for developers who are building new blockchain-based applications.\n\nEach TRC-721-based\
    \ token has a unique ID that can be used to move real elements digitally without\
    \ compromising their value. Tokens created based on the TRC-721 standard represent\
    \ all digital types of tangible assets in the real world. Individuals can own\
    \ and manage data associated with a specific material object or document. This\
    \ protects industries that are vulnerable to fraud, plagiarism or counterfeiting.\n\
    \nThe developers can apply TRC-721 more effectively to their products and applications\
    \ thanks to Tron's efficient infrastructure. The TRC-721 standard will find various\
    \ applications in the future that will strengthen the crypto-economy and make\
    \ blockchain technology more unique.\n\nTRON claims to combine low transaction\
    \ fees with instant payment convenience. According to the Tron Foundation, the\
    \ protocol has been operating \"without any major losses\" for almost three years,\
    \ despite being the target of a malicious attack in November 2020 that resulted\
    \ in a temporary halt to production of new blocks.\n\n#  \n\n# Session 7  \n\n\
    Breaking The NFT Myths\n\n## Who creates NFT and where to buy it?\n\nOn various\
    \ online marketplaces such as [OpenSea](https://opensea.io/) or [Rarible](https://rarible.com/)\
    \ you can buy and sell NFT, they are stored in a digital wallet - similar to what\
    \ is known from cryptocurrencies. With the right feeling you can make real money\
    \ with it: The initially free CryptoPunks, actually only pixelated portraits to\
    \ collect, currently go for the equivalent of around 50,000, - € over the virtual\
    \ counter. You don't have to sell NFT as unique pieces, for each work you can\
    \ create any number of tokens - with a corresponding effect on the market value,\
    \ of course.\n\nAnyone can create and sell NFT themselves. Provided you have a\
    \ corresponding digital work and find a customer. On a trading platform, you upload\
    \ files such as MP3, GIF or PNG, pay a small fee (in the form of a cryptocurrency)\
    \ and can then store your NFT in the wallet. Because the tokens are then part\
    \ of the blockchain, you don't have to sell them on the same platform where you\
    \ created them. There is no obligation to sell at all, anyone can become a collector\
    \ of their own works of art with NFT.\n\n## How are NFT's produced?\n\nNFT's are\
    \ manufactured according to the ERC-721 token standard prepared by Ethereum developers.\
    \ There are platforms that make it possible to perform the transaction easily\
    \ so that users do not choke on the technical world of blockchain. All you need\
    \ to produce NFT is a digital cryptocurrency wallet. After uploading the file\
    \ to be produced as NFT to the IPFS system through these platforms, the parameters\
    \ of the NFT that cannot be changed are determined. After determining how many\
    \ NFTs will be produced, its price, how much share will have to be paid on its\
    \ next sale, NFT is produced by paying the transaction fee of the blockchain network.\
