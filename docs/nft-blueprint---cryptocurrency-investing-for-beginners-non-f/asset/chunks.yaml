    "Smart contracts" are programs that run on the blockchain and can be executed
    automatically when certain conditions are met. In the world of decentralized Finance,
    these smart contracts enable developers to develop functionality that is far more
    advanced than simply sending and purchasing cryptocurrency. These programs are
    now decentralized applications, that is, programs that we call dApps.


    The biggest differences of dApps from centralized apps are:


    1.  Always have your funds under your control and ask you for permission through
    a custody-free wallet to invest in any application


    1.  The fact that the application (platform/protocol) is working on a completely
    decentralized blockchain, that is, it is not controlled by any centralized organization.
    In this example, the administrative tasks that we call managers in traditional
    finance are transferred to smart contracts, that is, to code.


    1.  All transactions are finalized, that is, they cannot be changed by anyone,
    and can be transparently followed by anyone.


    Decentralized App (dApp), that is, applications in the world of DeFi, allow us
    users to invest in financial instruments (earning interest, lending, insurance)
    that are completely under our control and without the need for any brokerages.


    This ecosystem has been developed because the financial system based on the banks,
    we are accustomed to is open to human errors and corruption. Financial democracy
    and freedom are the most popular uses of DeFi, which provides the financial world
    with advantages such as eliminating intermediaries and central system risks, as
    well as greatly reducing costs.


