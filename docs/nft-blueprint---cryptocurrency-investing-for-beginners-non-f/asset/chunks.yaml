- raw: 'In the years from 2018 to 2020, many new courses were set for blockchain-based
    NFTs, without which no new onslaught would probably have been possible in 2021.
    Numerous blockchain projects have taken advantage of the crypto winter to drive
    new interesting NFT applications.


    ### NFTs as Digital Art


    This is how the art market discovered NFTs for itself. The property of a clear
    proof of ownership and the possibility to display this transparently are almost
    ideal for digital art. Some artists began experimenting with NFTs. Platforms for
    the trade in digital art such as [OpenSea](https://opensea.io/), [SuperRare](https://superrare.co/),
    [MakersPlace](https://makersplace.com/) or [Known Origin](https://knownorigin.io/)
    were founded and continuously expanded. So-called minting platforms such as [Digital
    Art](https://digitalartchain.com/), [Mintbase](https://mintbase.io/) and [Mintable](https://mintable.app/)
    integrated solutions to make it easy and fast to create NFTs for anyone without
    programming knowledge.


    Gaming and virtual worlds


    The gaming industry around blockchain-based virtual reality also recognized the
    great potential of NFTs at an early stage. First and foremost are the Decentraland
    and Cryptovoxels projects, which enable the purchase and ownership of virtual
    land in the form of NFTs. In these virtual game worlds, new digital ecosystems
    with virtual cities and landscapes are created.


    Another pioneer in the field of blockchain-based virtual reality is [Enjin.](https://enjin.io/)
    This project allows gaming utensils in the form of NFTs to be easily transferred
    from one game to another.


    Domain names


    In addition to art and gaming, the domain name market has also adapted NFTs at
    an early stage to provide domains similar to ".com" with decentralized blockchain
    technology. The best-known service provider Ethereum Name Service was founded
    in May 2017 and connected to the most common NFT marketplaces in 2019. The number
    of registered “.eth" domains has grown steadily.


    Another well-known service provider is Unstoppable Domains, which has issued the
    domain “. crypto", among other things.


    Between 2018 and 2020, many important foundations were laid for future NFT mass
    applications. In the meantime, NFTs have penetrated into numerous other sectors
    of the economy. These include sports, film, music, leisure, finance and collectibles.
    These new NFT ecosystems will be discussed again later.


    ### Disadvantages of Ethereum for NFTs


    Even though Ethereum is the largest NFT platform, it is not always the first choice
    for every type of NFT. Ethereum is still struggling with the challenge of increasing
    capacity limits. For this reason, the creation and trading of NFTs sometimes incur
    extremely high fees. With a very valuable NFT like the Beeple artwork, $100 in
    fees may be insignificant. But for many smaller artists who want to sell their
    works for $100 to $200, such large amounts are a clear obstacle.


    Against this background, several alternative blockchains have stepped up to cleverly
    close this market gap. Depending on the NFT use case, there is also a suitable
    NFT blockchain that promises faster and more cost-effective trading of NFTs.


    The problems with current blockchains


    Three problems occur again and again with known blockchains:


    ●Cost to users


    ●Duration of transactions


    ●User experience for beginners & developers


    And to solve these problems, the blockchains need to bet on better scalability.
    This is done either at the expense of the developers, as programming is much more
    difficult. Or by abandoning decentralization, as for example with Libra or EOS.
    Both solutions are suboptimal.


    ## 6.2. [FLOW](https://www.onflow.org/): The Blockchain Built for NFTs


    When CryptoKitties, brought the Ethereum blockchain to a standstill in late 2017
    due to an immense overload. Developer Dapper Labs learned first-hand that blockchains
    of the current generation were not built for this demand.


    Instead of simply finding another home for the decentralized app or wait until
    the Ethereum scaling solutions are mature. Dapper has decided to create a blockchain
    that the company and other developers can rely on.


    The result is Flow, a block chain specifically designed to support things like
    NFT collectibles and large-scale crypto games. Flow is a blockchain designed for
    comprehensive scaling without using sharding techniques that enable fast and cost-effective
    transactions that make sense for dApps like NFT marketplaces and crypto-infused
    video games.


    As mentioned earlier, Flow comes from Dapper Labs, who decided to solve the problem
    of blockchain congestion directly by developing one provided for games and other
    interactive experiences. Dapper now uses Flow for all of its own projects, including
    NBA Top Shot, but is also open to other developers.


    ### How does Flow work?


    Flow uses a pledge verification model where validators must deploy a certain number
    of FLOW tokens to participate in the network.


    However, the way validation works is unique among blockchains in that Flow splits
    validation tasks into four separate node types: consensus, verification, execution,
    and capture. All four node types participate in the validation of each transaction.


    According to Dapper, splitting tasks makes processing transactions more efficient
    than competing blockchains. This is an alternative option for sharding or distributing
    a blockchain''s storage and compute requirements across numerous nodes. Flow does
    not use sharding. In this way, according to Dapper, Flow keeps transactions atomic,
    consistent, isolated and permanent (ACID) and allows developers to build on each
    other''s work.


    Flow is also updatable smart contracts that allow smart contracts to be deployed
    in beta and then expanded or repaired before they are completed and made immutable.


    Dapper Labs convinces with a diverse network. Well-known investors joined early
    and co-financed the development of the Flow Blockchain. These include the Warner
    Music Group and star investor Andreessen Horowitz. At the same time, they are
    already working intensively with the American basketball league NBA. The UFC or
    the game developer Ubisoft are also among the partners, who also include Coinbase
    and Samsung.


    #### High scalability


    Among experts, the programming language is considered to be particularly developer
    friendly. As a result, more and more developers are turning to the Flow Blockchain
    and working on optimization. At the same time, the commands in the network are
    broken down into individual tasks, which can then be processed in parallel. This
    increases the efficiency of the computing capacity; the network becomes more scalable.


    Users of the Dapper Wallet can use both Ethereum and Flow and get access to both
    networks. Dapper''s current users will be the first to gain access to the now
    released Flow network and be able to test applications and use the latest applications
    there.


    #### SpoCKs technique instead of consensus


    Flow uses the new cryptographic approach Specialized Proof of Confidential Knowledge
    (SpoCKs). This technique was developed by the Flow team and published in a special
    technical documentation. With SpoCK, any number of developers of a third observation
    instance can prove that they each have access to the same confidential knowledge.
    There is no information about confidential content in the evidence and they act
    interactively.


    Each SpoCKs is individually and specifically tailored to the developer and cannot
    be copied or forged by any other developer on the network. Basically, the technique
    asks the execution and verification nodes to prove their knowledge. This knowledge
    can only be obtained through the execution of all transactions assigned to them.
    And only when this has been clarified, they receive the reward.


    #### Smart Contracts with ACID Guarantee


    A single common status for all smart contracts ensures that each transaction complies
    with the following guarantees:'
