    # ⮚PancakeSwap: 金融类 NFT


    币安智能链（Binance Smart Chain）上的 DeFi 平台部分成功归于智能 NFT 应用。NFT 目前包含了金融元素，而非纯粹为了收藏，正引领着
    NFT 销售潮流。


    BSC 上最可爱、以兔子为主题的 DeFi 项目 PancakeSwap 为其收藏创建了一系列特殊的 NFT 角色。每只兔子都可以兑换一定数量的项目本地代币
    `CAKE`。与其他“以租待租”资产类似，收藏者可以根据 `CAKE` 价格的波动对这些 NFT 的价值进行投机。


    正如我们之前提到的，BSC 上的收藏在艺术价值之外，为投资者提供的价值已日益成熟。如果你之前参加过 PancakeSwap 的抽奖，你的票据实际上是一个 `BEP-721`
    NFT。


    用户用于购买门票的 MEB 被收集在一个池中以形成奖励基金。每张 NFT 门票包含四个数字，这些数字必须以正确的顺序与中奖数字匹配。奖金的一部分将被销毁，剩余部分将分配给获胜者。这是
    NFT 远不止收藏品的绝佳示例。


    ## 为什么选择币安智能链进行 NFT？


    相比以太坊，BSC 拥有大量使用、创建和销售 NFT 的项目。网络的可扩展性和低交易费用使 BSC 成为其他区块链之外极具吸引力的替代方案。由于 BSC 网络兼容以太坊虚拟机（`EVM`），开发者可以轻松将他们在以太坊上创建的
    DApp 转移到 BSC。


    从用户的角度来看，使用 BSC 买卖 NFT 更具效益。以太坊交易的高昂费用使得 NFT 对于小型投资者和收藏者来说非常昂贵。


    币安智能链正在快速增长 NFT 生态系统，越来越多的项目继续从网络的速度和价格优势中受益。无论你是想加入 NFT 浪潮，还是仅仅交易你的收藏品，你都能币安智能链中找到你需要的一切。


    ## 5.3. 市场上的顶级 NFT 代币


    ### ⮚Beeple NFT


    你可能听说过这次 NFT 销售。Beeple NFT 是少数加密世界事件能够吸引广泛观众的例子之一。数字艺术家 Mike Winkelmann（更广为人知的是
    Beeple）通过售出一幅价值 6900 万美元的 `ETH` NFT 彻底颠覆了艺术界。此次销售由佳士士拍卖行完成。Beeple 以前从未卖出过超过 100
    美元的印刷品，却一夜成为世界上价值最高的世世艺术家。


    他的作品如此高估值的背后是什么？得益于他每天创建并上传的系列作品，Beeple 已经拥有庞大的粉丝群体。在过去的 14 年里，没有一天是他没这么做的。售出的作品名为《Everydays
    - The First 5000 Days》，是他项目前 5000 天内创作的艺术作品合集。


    Beeple 的销售标志着数字艺术未来的关键里程碑，并表明 NFT 并非随时间推移而消逝的炒作。


    ### ⮚NBA Top Shot


    截至 2021 年 3 月，NBA Top Shot 是最成功的 NFT 项目之一。根据 Block 的数据仪表板，NBA Top Shot 在所有 NFT
    项目中用户最多。虽然这一数据没有考虑到较小的边缘 NFT 项目，但对于 NBA Top Shot 来说，这是一个巨大的成就。


    NBA Top Shot 的成功源于何处？NBA Top Shot 的影响不可否认。以太坊交易的高昂费用使得 NFT 对于小型投资者和收藏者来说非常昂贵。


    你曾尝试过使用 NBA Top Shot 吗？虽然这一数据没有考虑到较小的边缘 NFT 项目，但对于 NBA Top Shot 来说，这是一个巨大的成就。


    ### ⮚CryptoPunks


    CryptoPunks 是最早的 NFT 项目之一。它在以太坊上推出，由独特的像素角色组成。CryptoPunks 的流行为许多其他 NFT 项目提供了灵感。


    ### ⮚Axie Infinity


    Axie Infinity 是一款玩家收集和繁殖名为 Axies 的生物的游戏。该游戏已成为 NFT 和游戏生态系统的重要部分。


    ### ⮚Decentraland


    Decentraland 是一个去中心化的虚拟世界，用户可以在其中构建、拥有和探索内容。它使用 NFT 来代表虚拟土地的所有权。


