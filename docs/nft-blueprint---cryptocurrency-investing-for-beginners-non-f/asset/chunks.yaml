    \ other. That's why the commander of the 1st Army thinks, \"When I attack, if\
    \ the other side doesn't attack, I'll be defeated.\" Other military commanders\
    \ feel the same way.\n\nThe 1st army commander can solve the problem of transmission\
    \ by sending a messenger to other armies, but the messenger can be persuaded by\
    \ other army generals and forced into treason. Or the besieged city dwellers can\
