    这就是链外元数据发挥作用的地方。通过元数据可以实现许多操作：排序、涨价、动画、日期信息等。元数据与智能合约以及平台（如 OpenSea）交互的逻辑。元数据的存在允许“OpenSea”等应用程序为数字资产抓取丰富的数据，并在应用内轻松地查看。由于元数据标准是一个技术且且的话题，我们将在接下来的章节中详细探讨这一主题。


    利用可编程逻辑，让我们看看如何自己创建和交易 NFT。我们将 Rarible 作为这里的案例研究。


    ## 2.8. 如何使用 Rarible 编写 NFT？


    [Rarible](https://rarible.com/) 是一个你可以用它买卖非同质化代币并将你的作品转换为 NFT 的平台。Rarible 是一个以非同质化代币（NFT）闻名的数字市场，你可以在其以太坊区块链上买卖数字资产。使用
    Rarible，你可以买卖 NFT，并为自己创建和营销 NFT。


    Rarible 中介了作为非同质化代币的独特作品买卖。你也可以将自己的作品转换为 NFT 并在平台上出售。在本指南中，你可以找到关于 Rarible 使用、在
    Rarible 中交易 NFT 以及在 Rarible 中创建 NFT 的所有细节。


    我们还提到了你应该了解的其他细节，例如 Rarible 的佣金率和加密货币钱包的使用。


    ## 2.9. 买卖 Rarible NFT


    要使用 Rarible，你首先需要一个可以在去中心化应用（dApps）使用的加密货币钱包。


    当你点击 Rarible 中的“连接钱包”（connect wallet）按钮时，你可以看到可以连接到 Rarible 的加密货币钱包如下：


    ![自动生成的包含图形用户界面描述的](img/image-2.png)


    为了让 MetaMask 出现在列表中，你首先需要在浏览器中登录 MetaMask，然后访问 Rarible。


    用于去中心化应用最流行且实用的加密货币钱包是 MetaMask。查看下面的指南，在浏览器中设置并使用 MetaMask 钱包：


    安装 MetaMask 后，你可以从你使用的任何加密货币交易所将以太坊转移到你 MetaMask 钱包中的以太坊地址。


    在 Rarible 上买卖 NFT 并支付手续费需要 `ETH`。在这方面，你应该根据你将进行的交易向钱包发送足够的 `ETH`。


    你可以使用币安（Binance）或币安国际（Binance TR）购买以太坊。你可以通过以下指南在币安和币安国际开设佣金折扣账户：


    ### 将 MetaMask 连接到 Rarible


    要将你的 MetaMask 钱包连接到 Rarible，首先在浏览器中登录你的 MetaMask 钱包。然后访问 Rarible 连接你的钱包。


    你可以通过点击网站右上角的“连接钱包”按钮将你的 MetaMask 钱包连接到平台。


    点击 MetaMask 后，你可以根据钱包中的通知选择你的地址，并点击“下一步”（next）和“连接”（connect）按钮进行连接。


    ![自动生成的应用程序描述](img/image-3.png)


    通过“连接”按钮将 MetaMask 钱包连接到 Rarible 后，你必须同意如下 Rarible 使用条款。


    你可以通过勾选必要的地方并点击“继续”（proceed）按钮来继续。


    ### 如何购买 Rarible 非同质化代币 (NFT)？


    将 MetaMask 钱包连接到 Rarible 后，你可以从“探索”（explore）页面发现不同的数字资产。此外，如果你的钱包中有任何非同质化资产（即
    `ERC721` 代币），你可以在“我的物品”（my items）部分看到它们。


    例如，在“探索”部分，如果你点击任何如下数字资产，你可以看到与 NFT 相关的价格和其他信息，并通过“立即购买”（buy now）和“出价”（bid）按钮进行购买。


    ![自动生成的图形用户界面、文本、应用程序、聊天或文本消息描述](img/image-4.png)


    你可以使用“出价”按钮以任何价格出价。或者通过点击“立即购买”按钮直接按卖家设定的价格购买 NFT。


    点击“立即购买”按钮，将出现如下购买页面。在这里，你可以在“数量”（quantity）部分输入想要接收的数量。NFT 的价格为 0.057 `ETH`。此外，Rarible
    将获得 2.5% 的佣金。因此，应支付金额为 0.058 `ETH`。点击“继续”（Proceed）后，即可完成流程。


    ### Rarible 竞价


    你可以使用“出价”按钮以任何价格出价。或者通过点击“立即购买”按钮直接按卖家设定的价格购买 NFT。


    通过“连接”按钮将 MetaMask 钱包连接到 Rarible 后，你必须同意如下 Rarible 使用条款。


    你可以通过勾选必要的地方并点击“继续”（proceed）按钮来继续。


