  fmt: '

    The number of decentralized financial projects (DeFi) interested in integration
    with NFT to improve their ecosystems is growing steadily. Therefore, the Tron
    developers believe that the `TRC-721` standard will open up many possibilities
    for developers who are building new blockchain-based applications.


    Each `TRC-721`-based token has a unique ID that can be used to move real elements
    digitally without compromising their value. Tokens created based on the `TRC-721`
    standard represent all digital types of tangible assets in the real world. Individuals
    can own and manage data associated with a specific material object or document.
    This protects industries that are vulnerable to fraud, plagiarism or counterfeiting.


    The developers can apply `TRC-721` more effectively to their products and applications
    thanks to Tron''s efficient infrastructure. The `TRC-721` standard will find various
    applications in the future that will strengthen the crypto-economy and make blockchain
    technology more unique.


    TRON claims to combine low transaction fees with instant payment convenience.
    According to the Tron Foundation, the protocol has been operating "without any
    major losses" for almost three years, despite being the target of a malicious
    attack in November 2020 that resulted in a temporary halt to production of new
    blocks.


    # Session 7


    ### Breaking The NFT Myths


    #### Who creates NFT and where to buy it?


    On various online marketplaces such as [OpenSea](https://opensea.io/) or [Rarible](https://rarible.com/)
    you can buy and sell NFT, they are stored in a digital wallet - similar to what
    is known from cryptocurrencies. With the right feeling you can make real money
    with it: The initially free `CryptoPunks`, actually only pixelated portraits to
    collect, currently go for the equivalent of around 50,000, - € over the virtual
    counter. You don''t have to sell NFT as unique pieces, for each work you can create
    any number of tokens - with a corresponding effect on the market value, of course.


    Anyone can create and sell NFT themselves. Provided you have a corresponding digital
    work and find a customer. On a trading platform, you upload files such as `MP3`,
    `GIF` or `PNG`, pay a small fee (in the form of a cryptocurrency) and can then
    store your NFT in the wallet. Because the tokens are then part of the blockchain,
    you don''t have to sell them on the same platform where you created them. There
    is no obligation to sell at all, anyone can become a collector of their own works
    of art with NFT.


    #### How are NFT''s produced?


    NFT''s are manufactured according to the `ERC-721` token standard prepared by
    Ethereum developers. There are platforms that make it possible to perform the
    transaction easily so that users do not choke on the technical world of blockchain.
    All you need to produce NFT is a digital cryptocurrency wallet. After uploading
    the file to be produced as NFT to the `IPFS` system through these platforms, the
    parameters of the NFT that cannot be changed are determined. After determining
    how many NFTs will be produced, its price, how much share will have to be paid
    on its next sale, NFT is produced by paying the transaction fee of the blockchain
    network. Upon completion of the transaction, NFT''s are transferred to the cryptocurrency
    wallet and recorded on the entire blockchain where the production is carried out.


    #### Is NFT an investment tool?


    NFT''s are different from other cryptocurrencies by design and their value is
    determined by the person or investor who produces the work rather than the checkboard.
    If the subject of investment is interpreted through digital art, it is not so
    different from investing in physical art. Similarly, parameters such as how rare
    that asset is, age and cosmetics determine the value of an asset purchased as
    a collection piece.


    #### Are NFTs different from cryptocurrencies?


    "Non-Fungible Token" means digital asset (token) that cannot be divided and can
    never be produced again. Unlike cryptocurrencies like `Bitcoin` and `Ether`, which
    are "fungibles", NFT''s are unique digital assets. To illustrate with an example,
    today you can buy and buy `Bitcoin` or `Ether` by breaking it into pieces and
    exchange the same cryptocurrency in its own unit. However, NFT, a private digital
    entity, cannot be traded with another token because it is unique. Its internal
    value is determined by its manufacturer or investor.


    #### What connects NFT to Ethereum?


    Most NFT are currently stored as part of the Ethereum blockchain. Ethereum, like
    `Bitcoin`, is one of the cryptocurrencies and offers space in its blockchain for
    additional information on which NFT depends. Theoretically, however, other blockchains
    can also be used for NFT. At the cryptocurrency Tron, corresponding tokens with
    the `TRC-721` standard were already presented in December last year – probably
    also in response to the boom of `ERC-721`, the Ethereum protocol for NFT.


    #### And what does NFT have to do with art?


    Some in the art industry are already celebrating NFT as a game-changer, in fact
    the associated digitization of the art market opens a few rusty doors. On the
    one hand, more and more works of art are being created in virtual space, be they
    memes, graphics or objects in computer games. NFT allows a clear determination
    of ownership claims and enables new models of monetization. At the same time,
    the art market has a general demand problem and the hype is just right: When Beeple''s
    69-million-dollar work was sold, for example, almost exclusively new customers
    were in the auction house.


    NFT also opens up new investment opportunities in art objects. Owners can sell
    percentage shares in works via NFT without having to give up their own ownership.
    Museums could also develop new forms of financing: shares in works by great artists
    could be sold proportionately with NFT, while the affected object remains in place.
    Owners can also use NFT to set royalties for their digital works and then receive
    a share of the sale price each time they resell.


    #### What impact will NFTs have?


    Considering the current uses of NFT, it can be said that it solves intellectual
    property problems first. While it is very easy to copy a work digitally; The NFT
    solves this problem by revealing who owns the rights to the work. Because they
    are a programmable digital asset, artists'' share of the next sale can also be
    encoded inside the NFT. Thus, in the event of a sale, the relevant amount is automatically
    transferred to the artist''s wallet. The digital nature of the NFTs allow users
    of all types to buy them from all over the world. As the customer base expands
    thanks to digitalization, the number of people who can reach the work and want
    to invest, and therefore the demand increases, as demand increases, the price
    rises. As demand increases, so does supply. More NFTs at different price levels
    are coming to market. This increases accessibility for investors and art lovers
    and expands the ecosystem by enabling more works to be sold.


    #### Can you copy the digital object that makes NFTs?


    Sure, that''s possible. Digital goods such as images, videos or memes can be easily
    copied by anyone. Even if the owner, copyright or the uniqueness of such files
    are documented and proven by NFT, this can be done with a simple right click.
    However, NFT gives the owner something that cannot be copied: the ownership and
    all associated claims to the digital work. As a practical example: Anyone can
    order an art print of the Mona Lisa or put it on a copier at home, but the original
    still hangs only once in the Louvre in Paris.


    #### How can I be sure of the authenticity of NFT?

