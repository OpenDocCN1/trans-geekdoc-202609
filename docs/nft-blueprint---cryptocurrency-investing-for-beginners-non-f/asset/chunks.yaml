    Enjin is one of the leading companies that offer an ecosystem for several digital
    products, making it relatively easy for anyone to monetise gaming products. That
    means that game developers can tokenise in-game items via `Ethereum` – backed
    by Enjin''s `ERC 20` token. Enjin coin is one of the cheapest altcoins in the
    market – $2.5 as of this writing – and offers investors the highest growth potential
    among altcoins. As of this publication, Enjin had a market capitalisation of over
    $750 million.


    ### Decentraland (MANA)


    `MANA` is built upon `Ethereum`, and it allows users to create, experience, and
    monetise content and applications. With `MANA`, they can purchase virtual property
    to navigate through, develop and monetise however they want.


    As of April 2021, `MANA` had a market capitalisation of over $471.35 million.
    It was launched in February 2020 with an ICO worth $24 million. The platform utilises
    one `ERC-20` (`MANA`) and one `ERC-721` (`LAND`) token. To acquire property, `MANA`
    must be burned.


    ### OpenSea Marketplace for NFTs


    OpenSea market, which allows any NFT to be auctioned on the platform. OpenSea
    acts as a decentralised marketplace where trading takes place under a smart contract.
    `CryptoKitties` allows you to trade with more than 200 NFT types, including `SuperRare`
    art, `Gods Unchained`.


    ## 2.4. Liquidity


    Thanks to the growing number of NFT marketplaces, the liquidity in NFTs is increasing.
    However, given the fact that NFTs are, by design, rare and unique, it means that
    the liquidity for a specific NFT will always be low. That’s because NFT creators
    artificially maintain their NFTs in limited supply. NFT markets will create liquidity
    pools based on auction, almost as in `DeFi` liquidity pools, and in return for
    the value here, individuals will be able to buy fungible tokens by donating NFT
    tokens, and vice versa.


    Suppose you go to a sporting event or there''s a rock band you love, you want
    to buy tickets to his concert. As well as being unique in terms of the characteristics
    of tickets purchased for both occasions, NFT''s are unique, meaning they cannot
    be exchanged for each other.


    Each NFT is different from one another, which is perhaps the most significant
    characteristic of NFTs. As we''ve mentioned above, NFTs cannot be interchanged
    with one another. No one NFT can be made other than the same smart contract with
    the same token number. This means that a manufactured token is single and solitary
    and cannot be produced or copied any other way. This is similar to the fact that
    the `Guernica` painting, which Picasso drew with his own hands, is priceless,
    although there are thousands of copies. This is confirmed by blockchain and can
    be seen by everyone.


    ## 2.5. Immutability and Provable Scarcity


    NFTS are indestructible thanks to the immutable nature of blockchain technology
    and smart contracts, NFTs cannot be altered, duplicated, or destroyed. This means
    that whoever buys the NFT owns it and not the creator of the NFT. If the owner
    sells the NFT, they cannot falsify the ownership records since this is impossible
    with blockchain technology. This property of NFTs is what makes their potential
    in the music industry invaluable. We will discuss this in a later section.


    They are resistant to subsequent change and precisely determinable of its supply
    during creation. The identity of the NFT owners are permanent records on the blockchain.
    When the NFT changes hands, it is verified by the blockchain. This ensures that
    the original owners are protected. More so, NFT allows creators to set rights,
    especially on the product.


    ## 2.6. Rarity


    NFTs being rare shouldn''t be confused with scarcity which is where they derive
    their value from. Although developers can create as many NFTs as they wish, they
    often limit the number of tokens to ensure they are unique. If we make a simple
    assumption that the values of products offered for sale in the first place will
    be lower than in the future, it may also mean that we may have products that will
    be sold much expensively in the future.


    NFT''s have no lifespan and are very available for purchase and sale so that they
    can be retained for years. In other words, turning a product into an NFT can also
    mean attributing a partial infinity to it.


    ## 2.7. Programmability


    Like traditional digital assets, NFT''s are fully programmable. For example, in
    `CryptoKitties`, the ancestor of NFT, you were able to grow and mature digital
    cats through design mechanisms such as feeding them cookies. Most of today''s
    NFT''s have more complex mechanics such as forging, processing, cashing in, random
