  trans: '

    NFT 在收藏家和玩家之间同样流行。除了加密艺术外，`Open Sea` 等 NFT 平台还交易表情包或卡片等收藏品，即所谓的收藏品或电脑游戏内容。例如，最近一位匿名人士支付了
    300 个太币（购买时价值约 60 万美元）购买了一个“小黄猫”（Nyan Cat）动画 GIF 的修订版本，这个 GIF 在互联网上流传了近十年，是最著名的
    GIF 之一。


    另一个例子是幻想足球平台 `Sorare`，它的运作方式类似于数字版的 Panini 册。足球爱好者可以从他们喜欢的球员那里购买限量收藏卡。到目前为止，卖出的最贵卡片价格为
    57,000 美元。玩家还可以在 NFT 市场上购买虚拟角色、资源或物品。目前的纪录保持者是基于区块链的收藏怪兽游戏 `Axie` 中的一块虚拟土地，有人为此支付了约
    150 万美元。


    ## NFT 是下一个大趋势吗？


    如果你观察 NFT 的繁荣，有些人会问自己关于意义的问题。一方面，按照艺术界的惯例，理想价值往往比物质价值起更重要的作用。数字证书在保证真实性的同时限制了复制，也将虚拟物品提升为地位象征。


    另一方面，NFT 也是取决于供需的投资和投机对象。这是因为加密对象可以像经典艺术品一样被购买，并可能通过转售来获利。然而，与所有加密资产投资一样，NFT 以及加密货币价格存在剧烈波动的风险。


    ![Das brennendes Kunstwerk "Morons": Der Original-Druck des Künstlers Banksy wurde
    von der Künstlergruppe "Burnt Banksy" verbrannt und als digitale Kopie wiederbelebt.
    Bis zum 9. Mai kann das NFT-Werk auf der Plattform Open Sea ersteigert werden.
    (Quelle: imago/ Cover-Images)](img/image-1.png)


    焚毁的作品《Morons》：艺术家 Banksy 的原作复制被艺术家团体“Burnt Banksy”焚毁，并作为数字副本复活。该 NFT 作品可以在 `Open
    Sea` 平台购买至 5 月 9 日。对于加密艺术创作者来说，NFT 提供了一个新的潜在收入来源。他们不再以传统方式在互联网上销售作品，而是通过少数副本的稀缺性来吸引收藏家、投机者和粉丝。艺术家还有参与
    NFT 二手交易的可能性。例如，如果 `Fynn Kliemann` 歌曲的原始买家将其转售，他将每次获得购买价格的百分十%。特别是那些在传统市场处境艰难的艺术家，获得了一个通过
    NFT 销售作品的新机会。


    ## 对 NFT 的批评


    但也存在阻力——不仅是因为加密货币价格的大幅波动。批评之一涉及可能发生的版权侵权。例如，如果无法验证区块链上的卖家是否真的拥有权利，就会出现问题。此外，所有者仅在其购买的区块链上拥有该加密对象。在大多数情况下，这是
    `Ethereum` 区块链。理论上，任何支持 NFT 的其他区块链上的对象都可以重新报价。


    NFT 还会消耗能量。由于 `Ethereum` 区块链的次交易需要许多计算机的计算能力，其能耗非常高。NFT 不仅由一次交易组成，还取决于拍卖的次数。因此，能量需求增加。数字艺术家
    `Memo Akten` 分析了单次 NFT 销售的能量消耗。平均每次销售消耗 340 千电。相比之下，普通的 `Ethereum` 交易仅其十分分之一。


    ## 1.2 NFT 的历史和重要里程碑


    正如 `DeFi`（去中心化金融）协议模仿银行金融产品一样，NFT 模仿了画廊、商店和博物馆的世界。但不需要昂贵且高风险的中介。


    这是通过最初诞生于 `Ethereum` 的 `Smart Contracts`（`dApps`）实现的。这种可编程区块链可以用于各种去中心化应用。换句话说，NFT
    市场是 `dApps`，通过将 NFT 创作者直接连接到买家，来实现整个 NFT 经济。这极大地方便了双方的进入，从而消除了通常的准入门槛。


    NFT 本身是一种标记——`ERC-721`——它是不可拆分或非同质化的，因此得此此名。它的价值基于区块链技术的保证，即没有任何 NFT 可以被伪造。此外，整个交易历史作为完全数字资产是可追踪和可验证的，无论是图形、音乐、视频、动画、游戏资产等。


    从 `Google Trends` 中我们可以看到，自 2 月以来，全球对 NFT 的兴趣大幅增加。随着越来越多的人青睐数字资产而非实体资产，这种 NFT
    趋势几乎是可以预判的。通过以下最贵的 11 个 NFT，我们将沉浸在这个新世界中。


    既然我们已经解释了什么是 NFT，就可以深入这些资产的广泛历史。


    ### 2012–2013：彩色币 (Coloured Coins)


    可以认为 `Colour coins` 是最早存在的 NFT。`Coloured Coins` 由 `BTC` 的小数值组成，通常小至 `1 Satoshi`。`Coloured
    Coins` 可以代表大量资产，并有多种用途，包括：


    * 房地产

    * 优惠券

    * 提取你自己的加密货币的能力

    * 发行公司股份

    * 订阅

    * 访问令牌

    * 数字收藏


    `Coloured Coins` 是 `Bitcoin` 功能巨大飞跃的例子。缺点是，只有在大家都同意的情况下它才能代表某些价值。`Bitcoin` 的编码语言从未设计用于在其网络内部实现这种行为，因此
    `Colour Currencies` 的力量取决于最弱的参与者。例如，三个人同意 `100 个 Coloured Coins` 代表公司股票。如果其中一个参与者决定不再用
    `Coloured Coins` 代表公司股票，整个系统就会崩溃。


    `Coloured Coins` 的最早提到可能来自 `Yoni Assia` 在 2012 年初发布的一名为《bitcoin 2.X (aka Colour
    Bitcoin) – first features》的博客文章。他在文中讨论了 `Coloured Coins`，但没有提到各种资产及其用途。相反，他声称
    `coloured coins` 是独特的，可以与普通的比特币交易区分来，因为它们是“创世过程”部分的比特币。这些新资产的潜力直到 2012 年 12 月
    4 日 `Meni Rosenfeld` 发表名为《Coloured Coins》的文章才被探索。几个月后，2013 年，发表了另一篇名为《Coloured
    Coins – BitcoinX》的文章。


    `Coloured Coins` 的缺陷显而易见；该系统在许可的环境中运行最好，这意味着在某些情况下直接使用数据库更好。然而，`Colour coins`
    为更多的实验打开了大门，并为 NFT 奠定了大部分基础。将现实世界资产放入分布式账的巨大潜力是明确的，但实现需要更灵活的区块链。


    ### 2014 – 反面


    `Coloured Coins` 的创造让许多人意识到将其资产到区块链的巨大潜力。然而，人们也理解 `Bitcoin` 本身并不意味着在其当前的迭代中启用这些额外功能。另一侧有一个去中心化交易所，允许创建资产，甚至有带有
    `XCP` 的加密标记。它拥有许多项目和资产，包括一种交易卡牌游戏。


    ### 2015 年 4 月——另一侧的创造魔法


