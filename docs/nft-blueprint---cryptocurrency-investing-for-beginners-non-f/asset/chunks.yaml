  trans: '

    如果我们考虑到 NFT 的当前用途，我们可以说它首先解决了知识产权问题。虽然在数字环境中复制作品非常容易，但 NFT 通过揭示作品权利的归属者解决了这个问题。由于它们是可编程的数字资产，艺术家在下一次销售中的分份额也可以被编码在
    NFT 内部。因此，在发生交易时，相关金额会自动转到艺术家的钱包中。数字特性允许所有类型的用户从世界各地购买它们。得益于数字化，客户群不断扩大，能够接触到作品并希望投资的人数增加，需求也随之增加，价格也随需求增加而增长。随着需求的增加，供应也随之增加。更多处于不同价格水平的作品进入了市场。这增加了投资者和艺术爱好者的准入性，并允许更多作品售出。生态系统正在不断扩张。


    ### 我如何能确保 NFT 的真实性？


    在加密货币生态系统中，个人声誉受到高度重视。制作 NFT 并希望出售的艺术家会通过 NFT 市场应用中使用的经过验证的资料流，以证明他们的作品是原创的。如果你拥有相关艺术家的钱包地址信息（该地址通常公开共享以便接收付款），你就有机会确认作品的真实性。此外，你还可以通过区块链监控应用程序跟踪
    NFT 的移动，从而确保艺术家及其作品的真实性。


    ### NFT 内部的文件存储在哪里？


    NFT 包含许多文件格式的证据，如图片、音频、短视频和文档。由于这些文件在区块链上存储困难且昂贵，它们被存储在一个名为 `IPFS` 的分布式文件保留协议上。上传的文件被加密并拆分成小块，共享到
    `IPFS` 的节点上。相关文件已上传到 IPFS 的证明保存在推特首席执行官 Jack Dorsey 的推文被一位土耳其人士以 290 万美元买下，而埃隆·马斯克将他包含
    GIF 和音乐的推文作为 NFT 进行了拍卖。最近，Cüneyt Özdemir 的推文以 10,000 美元成交。


    ### 未来 NFT 的用途是什么？


    随着对 NFT 经验的增加，我们看到新的新的业务模式正在形成。首先，物理资产的数字化（即代币化）可以应用于广泛领域。例如，上周美国设计的一个 3D 虚拟世界房屋以
    50 万美元售出。我们还知道，在某些游戏中，土地销售是以 NFT 形式进行的。NFT 将产生影响的另一个领域是社交媒体。得益于 NFT，粉丝数量、观看次数以及创作者变现的观看量等指标将是中心化社交媒体公司无法提供的。物理资产的数字化似乎促使我们重新设计许多习惯的流程。我们可以考虑这样一种场景：未来用途中，NFT
    生成作为 NFT 的政府债券并进行全球交易。显然，NFT 世界的业务模式限于你的想象力。


    ## 3.3. 理解智能合约


    想象你必须卖一栋房子。这是一个相当复杂且令人敬畏的过程。有大量的文档、与不同公司和人的沟通，以及高水平的各种风险。因此，绝大多数卖主希望找到一个房地产中介，由他们处理所有的文书工作、对物业进行营销，并在谈判开始时担任中间人，监督交易直到完成。


    此外，托管服务在此类交易中特别有用，它提供了一种保障，因为涉及的金额通常很大，你无法真正信任对手。然而，在交易成功后，卖方和买方的代理人将分享销售价格的百分之十作为佣金。这意味着对于卖方或买方来说是一笔相当巨大的财务损失。


    所有这些都是智能合约可以以一种方便且有效的方式彻底改变整个行业的情况。最重要的是，信任问题将解决。智能合约根据“如果-那么 (If-Then)”原则工作。换句话说，只有当约定的金额发送系统时，房屋的所有权才会转移给买方。


    它们还充当托管，也就是说，资金和产权都存储在系统中，并同时分配给参与方。此外，保证了无错交付，因为交易经过了数百人的见证和验证。由于双方之间的信任不再是问题，就不再需要中间人。房地产中介执行的所有功能都可以预先编程到智能合约中，同时为卖方和买方节省了大量的资金。


    在我们深入研究智能合约如何工作之前，我们首先需要理解去中心化金融是如何工作的。这是因为 DeFi 和智能合约都是相互依赖的。


    ### 去中心化金融 (DeFi)


    DeFi 可以定义为运行在区块链上的金融应用生态系统。


    加密货币的承诺是让无论身处世界何地，每个人都能通用且民主地获得资金和支付服务。


    去中心化金融 (DeFi) 或开放金融运动旨在将这一承诺更向前一步。想象一下，你今天使用的所有传统金融服务（存款、贷款、商业、保险等）都是一个全球性的开放基础设施，世界上任何拥有智能手机和互联网连接的人都可以访问。


    在过去的 4 年里，去中心化金融已成为区块链和加密货币领域增长最快的领域之一，无论从用户数量还是货币价值来看。这种增长大部分是建立在 `Ethereum`
    区块链上的。


    #### 中心化结构的问题


    DeFi 并不是一个真正的新概念，这个定义源于多年来分析传统金融结构的个人和机构，以识别传统系统中发现的问题并采取解决方案。


    - 中心化结构的“容错能力”较低（对去中心化的需求）

    - 进入国家和国际替代金融工具的门槛过高（技术与个人财务的需求）

    - 中间机构和第三方机构对我们金融资产的无限控制风险（对财务自由的需求）

    '
