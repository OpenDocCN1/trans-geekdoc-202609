  trans: '


    对集成 NFT 以改进其生态系统的去中心化金融项目（DeFi）数量正在稳步增长。因此，Tron 开发者认为，`TRC-721` 标准将为构建新区块链应用程序的开发者开启许多可能性。


    每个基于 `TRC-721` 的令牌都有一个唯一的 ID，可以用于以数字方式移动真实元素而不损害其价值。基于 `TRC-721` 标准创建的令牌代表了现实世界中所有数字类型的实体资产。个人可以拥有并管理与特定实物体或文档相关的数据。这保护了容易受欺诈、抄袭或伪造影响的行业。


    得益于 Tron 高效的基础设施，开发者可以更有效地将 `TRC-721` 应用于他们的产品和应用程序。`TRC-721` 标准未来将找到各种应用，加强加密经济并使区块链技术更具特色。


    TRON 声称将低交易费用与即时支付的便利性相结合。根据波场基金会的说法，尽管在 2020 年 11 月曾遭到恶意攻击导致新区块生产临时停止，但该协议在近三年时间里一直保持“没有任何重大损失”。


    # 第 7 节


    ### 破除 NFT 神话


    #### 谁创建 NFT？在哪里购买？


    在 [OpenSea](https://opensea.io/) 或 [Rarible](https://rarible.com/) 等各种在线市场上，你可以买卖
    NFT，它们存储在数字钱包中——类似于常见的加密货币。只要方法正确，你可以此赚取真钱：最初免费的 `CryptoPunks`（实际上只是供收藏的像素肖像）目前在虚拟柜台上的价格已相当于
    50,000 欧元左右。你不需要将 NFT 作为独特的作品出售，对于每件作品你可以创建任何数量的令牌——当然，这会对市场价值产生相应的影响。


    任何人都可以自己创建和出售 NFT。只要你有相应的数字作品并找到客户。在交易平台上，你上传 `MP3`、`GIF` 或 `PNG` 等文件，支付一小笔费用（加密货币形式），然后就可以将
    NFT 存储在钱包中。因为令牌随后成为区块链的一部分，所以你不需要在创建它们的同一个平台上出售它们。完全没有出售的义务，任何人都可以通过 NFT 成为自己艺术作品的收藏家。


    #### NFT 是如何产生的？


    NFT 是根据以太坊开发者准备的 `ERC-721` 令牌标准制造的。有一些平台可以轻松地执行交易，让用户不会迷失在区块链的技术世界。制作 NFT 只需要一个数字加密货币钱包。通过这些平台将要制作成
    NFT 的文件上传到 `IPFS` 系统后，将确定 NFT 不可更改的参数。在确定了将产生多少个 NFT、其价格以及下一次销售时需要支付多少份额后，通过支付区块链网络的交易费用来产生
    NFT。交易完成后，NFT 将转移到加密货币钱包中，并记录在执行生产的整个区块链上。


    #### NFT 是一种投资工具吗？


    NFT 在设计上与其他加密货币不同，其价值由制作作品的个人或投资者决定，而不是由市场交易面决定。如果投资主体被解释为数字艺术，那么它与投资实体艺术没有太大区别。同样，资产的稀有程度、年龄和外观美程度等参数决定了作为收藏品购买的资产的价值。


    #### NFT 与加密货币有何不同？


    “非同质化代币”（Non-Fungible Token）意味着不可分割且永远无法再次生成的数字资产（令牌）。与 `Bitcoin` 和 `Ether` 等具有“同质性”的加密货币不同，NFT
    是独特的数字资产。举例说明，今天你可以通过拆分 `Bitcoin` 或 `Ether` 并交换相同单位的加密货币来买卖它们。然而，NFT 是一个私有的数字实体，无法与另一个令牌交易，因为它是唯一的。它的内在价值由其制造商或投资者决定。


    #### NFT 与以太坊之间有什么联系？


    目前大多数 NFT 存储为以太坊区块链的一部分。以太坊像 `Bitcoin` 一样是加密货币之一，并在其区块链中提供空间来存储 NFT 依赖的附加信息。从理论上说，其他区块链也可以用于
    NFT。在加密货币 Tron 上，符合 `TRC-721` 标准的相应令牌已于去年 12 月推出——这可能也是为了响应 NFT 协议 `ERC-721` 的热潮。


    #### NFT 与艺术有什么关系？


    艺术行业的一些人已经将 NFT 视为游戏规则的改变者，事实上，相关的艺术市场数字化打开了几扇生锈的大门。一方面，越来越多的艺术作品在虚拟空间中被创造，无论是迷因、图形还是计算机游戏中的物体。NFT
    允许明确确定所有权主张并实现新的变现模式。同时，艺术市场存在普遍的需求问题，而这种热度恰恰好：例如，当 Beeple 价值 6900 万美元的作品出售时，拍卖行几乎全是新客户。


    NFT 还为艺术品提供了新的投资机会。所有者可以通过 NFT 出售作品的比例份额，而无需放弃自己的所有权。博物馆也可以开发新的融资形式：伟大艺术家作品的份额可以根据
    NFT 按比例出售，而涉及的物体仍留在原处。所有者还可以使用 NFT 为他们的数字作品设定版税，然后在每次转售时获得销售价格的份额。


    #### NFT 将产生什么影响？


    考虑到 NFT 目前的用途，可以说它首先解决了知识产权问题。虽然数字上复制作品非常容易，但 NFT 通过揭示谁拥有作品的权利来解决这个问题。因为它们是可编程的数字资产，艺术家在下一次销售中的份额也可以编码在
    NFT 中。因此，在发生销售时，相关金额会自动转到艺术家的钱包中。NFT 的数字属性允许世界各地的用户购买它们。随着数字化扩大了客户群，能够接触该作品并想要投资的人数随之增加，因此需求增加，随着需求增加，价格上涨。随着需求增加，供应也增加。更多价格水平的
    NFT 进入市场。这增加了投资者和艺术爱好者的机会，并通过销售更多作品扩大了生态系统。


    #### 你可以复制 NFT 的数字对象吗？


    是的，这是可能的。图像、视频或迷因等数字商品很容易被任何人复制。即使 NFT 记录并证明了此类文件的所有者、版权或独特性，也可以通过简单的右键点击完成。然而，NFT
    为所有者提供了无法复制的东西：对数字作品的所有权和所有相关主张。作为一个实际例子：任何人都可以订购娜丽莎的艺术复制品，或在家里复印机上复制，但原作仍然只挂在巴黎的卢浮。


    #### 我如何确保 NFT 的真实性？


    '
