    \ platform. In a short time, countless new ICO projects started and each of them\
    \ had new and supposedly scarce tokens on offer. This triggered a veritable gold\
    \ digger mood. More and more new cryptocurrencies on the Ethereum blockchain saw\
    \ the light of day in the digital world. It wasn't long before there was an increase\
