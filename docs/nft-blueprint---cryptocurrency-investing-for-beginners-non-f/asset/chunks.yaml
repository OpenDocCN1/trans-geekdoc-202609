- raw: "NFT is also popular among collectors and gamers. In addition to crypto art,\
    \ NFT platforms such as Open Sea also trade collector's items such as memes or\
    \ cards, so-called collectables, or contents of computer games. For example, an\
    \ unknown person recently paid 300 ethers (about 600,000 US dollars at the time\
    \ of purchase) for a revised version of the animated gif of \"Nyan Cat\", which\
    \ has been ghosting the Internet for almost a decade and is one of the most famous\
    \ gifs.\n\nAnother example is the fantasy football platform Sorare, which works\
    \ like a kind of digital Panini album. Football enthusiasts can buy limited-edition\
    \ collectible cards from their favorite players. The most expensive card sold\
    \ so far changed hands for 57,000 US dollars. And gamers can buy virtual characters,\
    \ resources, or items on the NFT marketplaces. Record holder is currently a virtual\
    \ piece of land in the blockchain-based collectible monster game Axie, for which\
    \ someone paid around 1.5 million dollars.\n\n###  \n\n### Are NFTs the next big\
    \ thing?\n\nIf you look at the boom of NFT, some people ask themselves the question\
    \ of meaning. On the one hand, as is customary in the art world, the ideal value\
    \ often plays a greater role than material value. The digital certificate, which\
    \ guarantees authenticity while limiting copies, also raises virtual items as\
    \ status symbols.\n\nOn the other hand, NFT are also investment and speculative\
    \ objects that depend on supply and demand. This is because the crypto objects\
    \ can be bought and potentially resold for profit as classical art. However, as\
    \ with all investments in crypto assets, there is a high risk that prices for\
    \ NFT, as well as those of cryptocurrencies, will fluctuate sharply.\n\n￼![Das\
    \ brennendes Kunstwerk \"Morons\": Der Original-Druck des Künstlers Banksy wurde\
    \ von der Künstlergruppe \"Burnt Banksy\" verbrannt und als digitale Kopie wiederbelebt.\
    \ Bis zum 9. Mai kann das NFT-Werk auf der Plattform Open Sea ersteigert werden.\
    \ (Quelle: imago/ Cover-Images)](images/image-1.png)\n\nThe burning artwork \"\
    Morons\": The original print of the artist Banksy was burned by the artist group\
    \ \"Burnt Banksy\" and revived as a digital copy. The NFT plant can be purchased\
    \ on the Open Sea platform until 9 May.\n\nFor crypto art creators, NFT offers\
    \ a new potential source of revenue. Instead of selling their works classically\
    \ on the Internet, they attract collectors, speculators and fans with the shortage\
    \ of a few copies. There is also the possibility for artists to participate in\
    \ the resale of NFT. Fynn Kliemann, for example, will each receive ten percent\
    \ of the purchase price if the original buyers of his jingles resell it. Especially\
    \ artists who have had a hard time on the traditional market get a new opportunity\
    \ to sell their works through NFT.\n\n###  \n\n### Criticism of NFT\n\nBut there\
    \ are also headwinds – and not only because of the large crypto price fluctuations.\
    \ One of the criticisms concerns possible copyright violations. It becomes problematic,\
    \ for example, if it is not verified whether a seller on the blockchain really\
    \ owns the rights. In addition, the owner owns the crypto object only on the blockchain\
    \ on which it was purchased. In most cases, this is the Ethereum blockchain. In\
    \ theory, however, any object on other blockchains that support NFT could be reoffered.\n\
    \nNFT are also energy consuming. Since a single transaction of the Ethereum blockchain\
    \ requires the computing power of many computers, the power consumption is very\
    \ high. NFT consist not only of a transaction, but of a variety of them, depending\
    \ on the number of bids at an auction. As a result, the energy demand increases.\
    \ The digital artist Memo Akten analyzed the energy expenditure of a single NFT-sale.\
    \ On average, a sale consumes 340 kilowatt hours. By comparison, an ordinary Ethereum\
    \ transaction accounts for about one-tenth of that.\n\n## 1.2 The History of NFTs\
    \ and Important Milestones \n\nJust as DeFi (Decentralized Finance) protocols\
    \ mimic banks' financial products, NFTs mimic the world of art galleries, shops,\
    \ and museums. But without expensive and risky intermediaries.  \n\nThis is possible\
    \ with Smart Contracts (dApps) that were originally born on Ethereum. This type\
    \ of programmable blockchain can serve a variety of decentralized applications.\
    \ In other words, NFT marketplaces are dApps that enable the entire NFT economy\
    \ by connecting an NFT creator directly to a buyer. This greatly facilitates the\
    \ entry of both parties and thus removes the usual barriers to entry.\n\nNFTs\
    \ themselves are a type of token - ERC-721 - that is non-divisible or not fungible,\
    \ hence the name. Its value is based on the assurance of blockchain technology\
    \ that no NFT can be falsified. In addition, the entire transaction history is\
    \ traceable and verifiable as a fully digital asset, be it as graphics, music,\
    \ video, animation, gaming asset, etc.\n\nAs we can see from Google Trends, global\
    \ interest in NFT has increased enormously since February. With more and more\
    \ people appreciating digital assets over physical ones, this NFT trend was almost\
    \ predictable. With the following top 11 of the most expensive NFTs, we're immersing\
    \ ourselves in this new world.\n\nNow that we have explained what NFT is, we can\
    \ dive into the extensive history of these assets.\n\n### 2012–2013: Coloured\
    \ Coins\n\nIt can be argued that Colour coins are the first NFT's to exist. Coloured\
    \ Coins consist of the small values of a BTC often as small as 1 Satoshi. Colour\
    \ Coins can be used to represent a large number of assets and can have multiple\
    \ use cases, including:\n\n●Estate\n\n●Coupons\n\n●Ability to extract your own\
    \ cryptocurrency\n\n●Issuing shares of a company\n\n●Subscriptions\n\n●Access\
    \ tokens\n\n●Digital collections\n\nColoured Coins were an example of a big leap\
    \ in Bitcoin's capabilities. The downside was that it could only represent certain\
    \ values if everyone agreed on their own value. Bitcoin's coding language was\
    \ never designed to enable this type of behaviour within its own network, so Colour\
    \ Currencies were only as powerful as its weakest participants. For example, 3\
    \ people agree that 100 Colour Coins represent 100 company shares. If a participant\
    \ decides that they no longer sync Coloured Coins to represent company shares,\
    \ the whole system crashes.\n\nThe first mention of Coloured Coins appears to\
    \ come from a blog post by Yoni Assia in early 2012 titled \"bitcoin 2.X (aka\
    \ Colour Bitcoin) – first features\". In his post, he discusses Coloured Coins,\
    \ but makes no reference to the various assets or their use cases. Instead, he\
    \ claims that Coloured coins are unique and identifiable from normal bitcoin transactions,\
