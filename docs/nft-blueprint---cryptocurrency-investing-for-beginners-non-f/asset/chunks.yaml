    Simply put, smart contracts work like vending machines and work hard. In smart
    contracts, you can think of a required amount of cryptocurrency, escrow, right
    to host, id or account as the amount you have. All rules and penalties are not
    only predefined by smart contracts, but also enforced by them.


    A smart contract can work on its own, but it can also work with other smart contracts.
    They can be set up in a way that they depend on each other. For example, the successful
    completion of a particular smart contract can trigger the start of someone else,
