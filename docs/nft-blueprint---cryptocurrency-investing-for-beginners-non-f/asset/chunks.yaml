    ## 区块链


    每个 DAPP 必须满足的第二个标准是它是基于区块链的。区块链使得 DAPP 去中心化，并同时存储在许多不同的计算机上。因此，DAPP 几乎不可能被删除，犯罪分子也无法黑入
    DAPP。众所周知的区块链例如 `Bitcoin` 网络或 `Ethereum` 网络。在这里，所有数据都存储在用户的 PC 上，而不是像 App 那样集中存储在特殊的服务器上。此类数据包括源代码、所有加密货币交易以及
    DAPP 顺畅运行所需的其他信息。区块链始终是 DAPP 的核心。`Type1` DAPPs 拥有自己的区块链，而 `Type2` 和 `Type3` DAPPs
    则基于该区块链。每个区块在一段时间后都会完成并加密。


    ## 加密加密


    每个区块的加密加密用于获取和验证特定时间段内的所有信息。例如，如果你看 `Bitcoin` 网络，这里投入了巨大的计算能力来验证和存储所有交易。所谓的 `Bitcoin`
    矿工接管了这些计算能力，并以 `Bitcoin` 和交易费的形式回报。当一个区块完成时，它是通过生成一个 `hash` 实现的。`hash` 是一种校验和，确保上一个区块中产生的所有交易和信息都是真实且可追溯的。


    然而，回溯时识别个人交易将很困难，因为从 `hash` 重新显示之前的信息非常耗时。因此，加密加密既能确保所有信息的真实性，又能实现单个用户的匿名性。因此，使用
    DAPP 时，你自己的数据比提供给 App 供应商时要安全得多。


    ## 代币生成


    DAPP 必须满足的最后一个标准是代币生成。在 `Bitcoin` 网络中，这种代币就是 `Bitcoin`。提供计算能力创建 `hash` 的矿工必须获得奖励，这样他们才愿意履行这项任务。这是通过发现
    `hash` 后使用 `Bitcoin` 奖励来实现的。对加密货币进行投机的投资者知道今天 `Bitcoin` 的价格有多高。因此，每个代币在现实货币中都有等值价值。


    代币生成仅仅是为了让矿工提供计算能力变得值得。`Hash` 生成对任何区块链都关重要，因为没有它区块链将无法运行。结果，代币生成确保了让矿工继续运行区块链仍然具有吸引力。如果满足了这四个标准，就可以称之为
    DAPP。


    ## DAPPs 网络


    现在市场上有大量的 DAPP。其中最广为人知的无疑是基于工作量证明算法的大加密货币。然而，其背后的网络也被无数的 `Type 2` 和 `Type 3` DAPPs
    使用。例如，`Microsoft Azure` 使用 `Ethereum` 网络作为 `type 2` DAPP，为第三方用户提供专门的设施。你可以看到，在加密货币背后有一个网络，它提供了各种数字可能性。


    然而，也存在不需要实际加密货币的 DAPP。例如，生产了一些游戏并非设计成 App 而是设计成 DAPP。虽然开发者无法直接通过这些游戏赚钱，但由于开源标准的标准，他们可以启动不断进一步开发的项目。这为创造以前不存在过的事物创造了新的可能性。


    如果你进一步研究 `Ethereum` 网络，所谓的 `smart contracts` 使用将变得越来越重要。它们允许开发者利用 `Ethereum` 网络来创建例如去中心化交易平台、社交网络（例如
    `Landmark`）或社交媒体平台（例如 `Leeroy`）。


    人们经常说区块链技术是未来并非没有理由。这使得规避 App 制造商的市场权力成为可能，从而使用一种替代互联网，其中所有信息都是免费获取的，不受单个大巨头的控制。通过
    DAPPS，你可以说有可能创建一个更自由的互联网。


    ## 区块链网络作为 DAPPs 的来源


    所有 DAPP 之母可能是 `Bitcoin` 网络。绝大多数投机加密货币的投资者当然关注 `Bitcoin` 本身。然而，其背后的网络同样有趣，因为区块链技术首先让新系统成为可能。


    `Ethereum` 也基于区块链。今天有无数的 `Type 2` DAPPs 使用相关的网络。在 `Bitcoin` 之后，`Ethereum` 可能是第二大
    DAPPsPs。


    当然，其他区块链也被各种 DAPPs 使用，最终选择哪个网络取决于开发者。


    今天，你已经可以使用各种变体的 DAPPs 了。通过这种方式，创建了社交媒体平台、建立了社交网络、为 IT 公司创建了基础设施、开发了游戏，或以 DAPP
    的形式设计了交易平台。可以假设，未来会有越来越多的开发者编写 DAPPs 而不是 apps，以便从区块链及其去中心化设计的优势中受益。然而，应该注意的是，这种划分仍处于婴儿阶段。该行业依靠追求自由互联网理念的开发者，他们不想仅仅从开发中赚钱。DAPPs
    的开源设计使得某些项目取得快速进展成为可能，因为参与开发的不是单一公司，而是整个自由开发者的社区。


    ### 最流行的 DAPPs


    如果你在网上寻找 DAPPs，你应该很快找到你想要的东西。例如，有一个 DAPP 格式的虚拟现实平台叫做 `Decentraland`。在这里你可以与其他用户交换想法。一个专门从事预测的平台被称为
    `Gnosis`。它自己认为是想要在早期识别某些趋势的投资者的联系点。`Gnosis` 基于 `Ethereum` 网络。


    `CryptoKitties` 特别深受玩家。。在线游戏包含虚拟猫，是开发 DAPP 格式游戏的首次尝试之一。


    此外，现在也有用于体育博利的 DAPPs。这最好的例子可能是 `SportCrypt`。在这里，就像在线投注站一样，可以对各种体育赛事下注。加密货币被用作注码。如果你喜欢社交媒体平台，DAPP
    `Leeroy` 对你来说可能是一个有趣的替代方案。在这里，同样使用了 `Ethereum` 网络。


    `Funfair Technologies` 被设计为一个 DAPP 格式的游戏平台。因此，你应该有机会在不同的赌场进行去中心化的下注。


    如果你在寻找一个基于区块链的去中心化商店，你将在 `Shop` 找到它。在这里购买各种商品。已经证明 DAPPs 扩展到了许多领域。很快可能会有更多方法将
    DAPPs 用于各种目的。

    '
