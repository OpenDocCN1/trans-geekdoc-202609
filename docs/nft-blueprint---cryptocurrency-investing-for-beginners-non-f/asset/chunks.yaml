    中，哪些不包含。由于去中心化，DAPP 永远无法被删除。这意味着只要联网计算机在线，DAPP 就一直可用。加密和点对点网络也使其非常安全，能够防范黑客的攻击。在使用
    DAPP 时产生的所有数据由于底层的区块链也会被快速加密。诸如 `Waves` 或 `Elrond` 等新加密货币从一开始就依赖于这一概念。因此，匿名性在很大程度上也得到了保障。


    尽管目前还没有非常多的不同 DAPP，但可以推测这在近期将发生变化。无论你是在寻找社交媒体渠道、想使用社交网络、想进行体育投注，还是仅仅想玩游戏，对于每种不同的可能性，已经有了相应的
    DAPP。如果区块链技术继续成熟，不排除在几年后，大多数用户将放弃中心化应用程序，转而选择 DAPP。


    ## 5.2. 在哪里可以购买热门的 NFT？


    尽管 NFT 才刚刚在主流 DeFi 领域爆发，但 NFT 交易市场已经存在相当一段时间了。自然，考虑到以太坊对 DeFi 领域的统治地位，所有的顶级 NFT
    交易市场都在以太坊上。


    目前有两种用于 NFT 的以太坊代币标准。首先是最广泛使用的 `ERC-721` 标准，它使得创建单个代币成为可能。为此，该代币标准为每个 NFT 使用一个新的智能合约。


    此外，还有 `ERC-1155` 标准，它允许 NFT 的组合交易，并使得通过单个智能合约理论上可以创建无限多个代币。`ERC-1155` 标准被称为多代币标准，因为它在单个智能合约中处理各种
    NFT 的存储和创建。它优于其他 `ERC` 标准，因为它更便宜、更有有效率。


    如果你想交易 NFT，你可以从不断增多的市场中选择。以下是一些热门的 NFT 交易市场：


    * `OpenSea`

    * `SuperRare`

    * `Nifty Gateway`

    * `Foundation`

    * `VIV3`

    * `NBA Top Shot`

