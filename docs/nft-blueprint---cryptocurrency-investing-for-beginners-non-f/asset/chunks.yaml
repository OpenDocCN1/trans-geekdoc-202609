  trans: '


    # ACID 特性


    - **原子性**: `atomicity` 代表事务的隔离性。

    - **一致性**: `Consistency` 意味着事务执行后数据库将处于一个持久性状态。

    - **隔离性**: `isolation` 防止或限制事务在执行期间相互影响。

    - **持久性**: `durability` 保证事务在数据库中的永久存储。


    在德语中，这四项准也被称为 `ACID` 特性，这四项标准被认为是系统可靠性的前提条件。


    这使得每个区块链开发者都能在他人代码的基础上进行构建，从而以快速速度开发出完全全新的产品和服务。在技术上，这被称为 `composability`（可组合性）。


    可组合性方法类似于开源社区，开发者可以快速上手新创新，因为他们最终可以获得更广泛的可能性。当现有资源被用作构建区块并在阶应用程序中进行编程时，平台就具备了可组合性（`composability/compatibility`）。


    与竞争对手相比，`Flow Blockchain` 几乎没有去中心化。20% 的代币属于 `Dapper Labs`，而开发团队持有的代币数量相当。此外，还有近百分之三十的储备金用于
    Flow 生态系统的进一步扩展。`Dapper Labs` 承诺长期持有（HODLing）这些代币。然而，如果这些代币被售出，可能会抑制价格。但由于持有承诺，`Flow
    Token` 在长期内的波动可能比加密竞争对手更小。


    ## Flow 是 Ethereum 更好的替代方案吗？


    `Flow` 的开发者希望让区块链进入主流。你不需要在使用创新的区块链技术时具备深厚的专业知识。同时，`Dapper Labs` 及其伙伴是丰富的联系人，可以针对性地改进区块链。同时，这确保了主流业务伙伴能够轻松接入。最后，他们可以直接联系相关的初创公司来商讨合作。


    目前，在扩展性方面，`Flow` 领先于其最大的竞争对手 `Ethereum`。但问题在于，`Ethereum` 是否通过升级到 `2.0` 版本并引入 `Proof
    of Stake`（权益证明）来解决当前的问题。如果是这样，`Flow` 将很难赶上领先者。但如果 `Ethereum` 仍然存在问题，`Flow` 将成为主流区块链竞争中一个严肃的替代方案。


    ## 6.3. NFT 与币安智能链


    你可能听说过 `Binance Chain`，它是 `BNB` 货币的所在地。`Binance Chain` 针对超快速交易进行了优化。为了实现这一点，它在某些问题上做出了妥协——其中之一就是在编程性方面没有其他区块链灵活。


    `Binance Smart Chain`（币安智能链）是一个全新的区块链，拥有开发高性能去中心化应用的环境，旨在改变这一点。它为与 `Binance Chain`
    的跨链兼容而构建，使用户可以从两者的最佳特性中受益。


    `Binance Chain` 由币安于 2019 年 4 月推出。其主要目标是支持快速且去中心化的（或非托管的）交易。不出意外，`Binance Chain`
    上最大的去中心化应用（`DApp`）是 `Binance DEX`，它是最易用的去中心化交易所之一。可以通过 `binance.org` 的网页界面或通过与
    `Trust Wallet` 的本地集成使用 `Binance Chain`。


    然而，由于区块链系统的内部局限性，该链并没有太多灵活性——在一个为快速交易优化的系统中的智能合约——可能会严重阻塞网络。你还记得 `CryptoKitties`
    吗？这个应用程序曾在 `Ethereum` 区块链流行时期使其停滞。


    扩展性仍然是区块链开发中最难克服的障碍之一。这正是 `Binance Smart Chain` 登场的地方。


    ### 什么是币安智能链？


    `Binance Smart Chain` (`BSC`) 可以被定义为与 `Binance Chain` 并行运行区块链。与 `Binance Chain`
    不同，`BSC` 具有智能合约功能并与 `Ethereum Virtual Machine` (`EVM`）兼容。这种设计的目的是将智能合约纳入生态系统，同时保持
    `Binance Chain` 原有的高效率。


    从根本上说，这两条区块链并行工作。值得注意的是，`BSC` 不是二层或非链扩展性解决方案。`BSC` 是一个独立的区块链，即使 `Binance Chain`
    离线，它也能继续工作。然而，两条链在设计上非常相似。


    `BSC` 可以支持丰富的 `Ethereum` 工具和 `DApps` 世界，因为它兼容 `EVM`。在理论上，这一特性使得开发者可以很容易地将项目从 `Ethereum`
    迁移到这里。对于用户来说，这意味着可以配置诸如 `MetaMask` 之类的应用程序与 `BSC` 配合。事实上，做到这一点只需更改几个设置。要了解如何操作，你可以阅读
    `Binance Smart Chain 的 MetaMask 使用指南`。


    ### 币安智能链是如何工作的？


    #### 共识机制


    `Binance Smart Chain` 通过 `Proof of Stake` 协调算法实现了约 3 秒的区块时间。使用的算法是 `Proof of Staked
    Authority` (`PoSA`)，其中参与者通过质押他们的 `BNB` 来成为验证者。如果用户提交有效的区块建议，他们将获得该区块内交易的交易费用。


    由于 `BNB` 不是通胀性的，必须考虑到，与许多协议不同，它没有新发行 `BNBs` 的区块奖励。相反，随着币安团队定期执行销毁，`BNB` 的供应量随时间推移而减少。


    #### 跨链兼容性


    `Binance Smart Chain` 设计为独立但存在的 `Binance Chain` 的补充系统。双链架构允许用户无缝地从一个区块链转移资产到另一个。这样，既可以在
    `Binance Chain` 中快速进行交易，可以在 `BSC` 上构建强大的去中心化应用。通过这种互操作性，用户可以访问一个满足许多用途的广泛生态系统。


    `Binance Chain` 中的 `BEP-2` 和 `BEP-8` 代币可以交换为为 `Binance Smart Chain` 创建的新代币标准 `BEP-20`。如果你读过我们的《ERC-20
    简介》文章，你已经熟悉 `BEP-20` 格式。`BEP-20` 与 `Ethereum` 的 `ERC-20` 具有相同。


    将代币从一条链移动到另一个链（例如使用 `BEP-2` 到 `BEP-20` 或反之简单的方法是使用 `Binance Chain Wallet`，可以在
    `Chrome` 和 `Firefox` 上使用）。你可以查看我们的 `Binance Chain 钱包指南` 来学习如何使用此钱包。


    ## 6.4. NFT 与波场区块链


    `TRON Blockchain` 为非同质化代币 (`NFT`) 引入了新的 `TRC-721` 标准。这将赋予开发者更多能力。


    `TRC-721` 是一组标准接口，用于在 `TRON` 网络上发布 `NFT`，并与 `Ethereum` 区块链用于创建 `NFT` 的基础标准 `ERC-721`
    完全兼容。


    根据描述，可以通过 `Chrome` 的 `TronLink` 插件在 `TRON` 区块链上使用 `NFT`。用户账户中必须有至少 350 个 `TRX`（按目前价格计算约
    18.3 美元）才能发布 `NFT`。另一方面，可以在交易期间自定义代币的名字和符号。


    `TRON` 的 `NFT` 标准旨在为构建在区块链上的应用提供新功能。从远来看，预计它还会增加来自 `Flow` 等竞争 NFT 平台对 `Ethereum`
    的压力。`NFT` 标准经常应用于区块链应用的各个领域。然而，大多数 `NFT` 是基于 `Ethereum`（`ERC-721` 标准及其改进）。


