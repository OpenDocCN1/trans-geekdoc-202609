- raw: "A good example of collectibles on the blockchain via non-fungible tokens has\
    \ already been mentioned with the CryptoKitties. Of course, the market for collectibles\
    \ is much larger and does not only include funny cats, which nevertheless serve\
    \ as a prime example for this sector.\n\nAn NFT can be useful for all collectibles.\
    \ Especially in cases where it is about authenticity, not only about the ownership,\
    \ in valuable paintings or sculptures. These could be verified and authenticated\
    \ by experts before creating an NFT whose possession simultaneously reflects the\
    \ ownership and authenticity of a collectible. Thus, two central problems of the\
    \ art world, namely the falsifying of valuable works and the fraudulent trade\
    \ in stolen pieces, can be curbed.\n\n#### Online Games\n\nIn many online games,\
    \ the characters can collect in-game currencies, often in the form of skins (clothes,\
    \ weapons) and exchange them with other players. If you were to make these in-game\
    \ currencies into an NFT, players could also exchange and trade them in the real\
    \ world.\n\nIn this way, completely new economies for fictional goods can emerge.\
    \ An example of this is the Decentraland project, which interactively creates\
    \ a world of its own from which players can buy a piece of land in the form of\
    \ an NFT. However, we are still at a very early stage here. One can assume that\
    \ online games in particular will devote more and more time to non-fungible tokens\
    \ and their integration into game concepts in the coming years.\n\n#### Tickets\n\
    \nTickets are another area that will probably be the first to be really influenced\
    \ by NFTs. The trade in tickets, both online and offline, has flourished, especially\
    \ since the introduction of the Internet and corresponding trading platforms.\
    \ One problem is often fake tickets that are used to defraud buyers. With the\
    \ involvement of NFTs in this sector, these problems could be avoided.\n\n####\
    \ Identity and certification\n\nIt gets really interesting when we shift the focus\
    \ from real goods to more abstract things, such as the control of identities with\
    \ the help of NFTs. Whether birth certificate, passport or driver's license –\
    \ as an NFT you could communicate more efficiently with authorities that need\
    \ personal data. Of course, this is only about ensuring the correct use of personal\
    \ data, not about the trade in driving licences, which is, of course, not possible.\n\
    \n#### Sports\n\nTraditionally, the sports industry has been leading when it comes\
    \ to collectable items – especially trading cards. And when it comes to NFTs,\
    \ the industry hasn’t been left behind either. The top two NFT projects in sports\
    \ are NBA Top Shot and Sorare. \n\nSo, what are NFTs for sports fans?\n\nApart\
    \ from digital works of art, there have long been NFTs for sports fans. The French\
    \ company Sorare, for example, has transferred the principle of trading cards\
    \ to the Internet. If you register on the platform, you can buy the cards there,\
    \ of which there are only a limited number. With your cards you can then participate\
    \ in leagues and win money or other trading cards there, which can later be used\
    \ or sold again.\n\nOf course, many fans are still wondering: What are NFTs and\
    \ is this new trend really gaining ground? The figures show that so far it is\
    \ indeed a niche market. At Sorare, at the end of March, only just under 14,000\
    \ users worldwide had decided to buy at least one card with their own money. Within\
    \ a month, however, this number had more than doubled. The growth rates of the\
    \ company, which has only been usable at all since the beginning of 2019, are\
    \ enormous. In addition, the huge number of football fans worldwide means that\
    \ there is huge potential.\n\nThis is also underlined by the revenues that the\
    \ NBA already generates with NFTs. Although these are still quite small compared\
    \ to the revenues from TV or advertising contracts, growth is currently rapid\
    \ here as well.\n\nAnd yet another aspect suggests that NFTs in the sports field\
    \ are not a typical bubble. The way fans want to see sports is changing. Especially\
    \ with younger fans, entire games are no longer as in demand as the summary of\
    \ the highlights. Statistics are also playing an increasingly important role –\
    \ a trend that can be seen in virtually all popular television sports. It is therefore\
    \ important for the managers to find new ways to interact with the fans.\n\n##\
    \ 4.2. Why NFTs are the Future of the Art world?\n\nThere's a real excitement\
    \ about NFT's. \"The ground-breaking events of recent weeks are finally evidence\
    \ of advances in digital art,\" says experts. Crypto art is the artistic expression\
    \ of what is possible today. \"A natural development for artists interested in\
    \ new technologies thematically or as a tool.\" The aesthetics of technology are\
    \ its own – reminiscent of avatars and games.\n\nArtists who allowed the digital\
    \ world to flow into their work have been part of contemporary art since the late\
    \ 1960s. It all started with the drawings that the first computers created – they\
    \ were still huge machines back then. Pioneers of computer art were artists such\
    \ as Manfred Mohr, Frieder Nake and Vera Molnár. The first computer animations\
    \ were created immediately afterwards.\n\nDigital art consists of mixed work,\
    \ such as interactive installations that include a software or audio component.\
    \ If videos are digitally generated, video setups are part of it. Video art with\
    \ cameras is a separate section. A parallel universe has opened up. There are\
    \ a lot of amazing artists in this area. One name to remember is Yucef Merhi.\
    \ One of his works, The Poetic Clock, is a machine that turns time into lyrical\
    \ poetry and produces 86,400 different poems every day.\n\n#### NFTs and Art\n\
    \n\"EVERYDAYS: THE FIRST 5000 DAYS\" is the name of the work of the digital artist\
    \ Beeple, which was able to achieve a proud 69 million US dollars at an auction\
    \ of the prestigious auction house Christie's in London. The special feature of\
    \ the auction is the fact that the image does not exist physically but is only\
    \ available digitally. From May 1, 2007, the creator created a digital image every\
    \ day with reference to his or all of our lives – for 5,000 days. The compilation\
    \ of all these pictures results in the now auctioned work of art.\n\nBut not only\
    \ the auction of a purely digital product is something special for Christie's.\
    \ Founded in 1766, the historic auction house also dared to use the crypto parquet\
    \ with the Beeple auction. With a resolution of 21,069 x 21,069 pixels and around\
    \ 319 megabytes, the masterpiece in Jpeg format was linked by the artist with\
    \ a so-called Non-Fungible Token, NFT for short. With this token, the new owner\
    \ can prove his ownership rights to the digital creation with the blockchain.\
    \ As the new owner, he is now known on the Ethereum network.\n\nThe masterpiece\
    \ \"EVERYDAYS: THE FIRST 5000 DAYS'' by Beeple is a picture from the \"EVERYDAYS\"\
    \ series. The artist has already been able to sell 21 works of art from this series\
    \ via Nifty Gateway, the NFT art trading platform of the Winklevoss brothers.\
    \ He generated proceeds of $3.5 million.\n\nThe work of art was created in more\
    \ than 13 years, the artist had taken a digital picture every day. His Instagram\
    \ account is followed by around 2 million accounts, which confirms that the public's\
    \ interest in digital art is very high.\n\nThe 5,000 individual images made the\
    \ artist stone-rich, and he apparently got a taste for selling digital art with\
    \ NFTs. This was followed by \"The Complete MF Collection\", which consisted of\
    \ 20 works and was sold for 3.5 million US dollars.\n\n#### How NFT's are revolutionizing\
    \ the art market?"
