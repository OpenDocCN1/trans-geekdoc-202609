  trans: '

    根据 Juniper Research 的最新报告《关键垂直领域机会、趋势与挑战 2019-2030》，记录显示，当我们把区块链技术与物联网传感器和追踪器结合使用时，将获得以下几大优势：


    - 更简单的监管合规性管理

    - 到 2024 年，全球食品欺诈将将减少约 310 亿美元的损失

    - 优化供应链，从而降低零售商的成本

    - 增强并加速食品召回流程


    此外，联合国粮农组织（`FAO`）在 2018 年的一份政策文件中透露，区块链能够转型印度的食品供应链。通过使用`smart contracts`（智能合约），当地运营可以降低交易成本并提高效率和利润。这将部分利润转移给农民和生产者。


    就像供应链管理一样，食品行业供应链中也有多个参与者——农民、供应商、零售商、消费者以及许多其他人员。这解释了为什么追踪从农场到餐桌的农产品食品通常非常复杂。通过区块链技术，零售商和供应商将获得更清晰的数据视图。


    目前，已有几家公司为食品行业提供区块链解决方案，其中之一是 `IBM Food Trust`。该公司被认为是食品行业最主流的基于分布式账本技术的追踪解决方案。该项目基于
    `Hyperledger Fabric` 区块链协议。


    2016 年，在中国，`Walmart` 实际上率先开展了首批产品试验，其他采用 `IBM` 食品追踪生态系统的行业巨头还包括 `Kroger`、`Dole
    Food`、`Unilever`（联合利华）、`Carrefour`（家乐）和 `Nestle`（雀巢）。事实上，报告显示美国国家渔业协会已与蓝巨人 `Food
    Trust` 项目合作追踪海鲜，旨在追踪多种海鲜品种。


    然而，区块链技术在食品行业的大规模采用面临严峻障碍，其中一个挑战是由于全球化导致的各公司数据收集。另一个挑战是互操作性，但正如我们之前讨论的，像`Chainlink`
    和 `Polkadot` 等几个区块链项目已经在处理这个问题。


    大多数区块链解决方案现在都符合现有的 `GS1` 标准——食品行业依赖这些标准来格式化数据，以便跨供应链的共享通信。到目前为止的结果有力表明，食品公司愿意探索分布式账本技术所提供的潜在解决方案。


    ## 3.2. NFT 与加密货币有何不同？


    `NFTs` 与加密货币具有许多相似属性。请注意，加密货币和 `NFTs` 都构建在区块链上。这意味着它们有许多相似之处。以下是 `NFTs` 和加密货币之间一些最显著的区别。


    - **不可拆分性**：像加密货币这样的同质化代币是可分的，这意味着可能发送或拥有部分 `Bitcoin` 或另一个 `ERC-20` 代币。这就像现金，你可以用一张十美元钞票支付并找零钱。非同质化代币不能共享，必须成整体购买或售卖。就像收藏卡一样，没有人会考虑买半张卡片。


    当一种资产是同质的时，意味着它可以很容易与其他资产交换（如以物易物贸易），或者可以兑换货币。这意味着你可以使用同质资产来获取商品或服务。更重要的是，同质资产可以分解为更小的单位。例如，`bitcoin`
    是一种同质资产。以 `BTC` 为例，`1 BTC` 可以细分为八位小数，最小单位称为 `Satoshi`（聪聪）。


    因此，`1 Satoshi = 0.00000001 BTC`，即百万分之一的比特币。


    - **NFTs 不具备互操作性**：这意味着一个 `NFT` 不能替代另一个 `NFT`。这是因为每个 `NFT` 都是独特的，并且有自己的特征和信息。一个例子是游戏
    `Crypto`。


    大多数区块链解决方案现在都符合现有的 `GS1` 标准——食品行业依赖这些标准来格式化数据，以便跨供应链的共享通信。到目前为止的结果有力表明，食品公司愿意探索分布式账本技术所提供的潜在解决方案。


    ### 关于 NFT 你需要知道


    #### 什么是 NFT？


    `NFTs` 与加密货币具有许多相似属性。请注意，加密货币和 `NFTs` 都构建在区块链上。这意味着它们有许多相似之处。以下是 `NFTs` 和加密货币之间一些最显著的区别。


    #### NFT 与加密货币有何不同？


    不可拆分性：像加密货币这样的同质化代币是可分的，意味着可能发送或拥有部分 `Bitcoin` 或另一个 `ERC-20` 代币。这就像现金，你可以用一张十美元钞票支付并找零钱。非同质化代币不能共享，必须成整体购买或售卖。就像收藏卡一样，没有人会考虑买半张卡片。


    当一种资产是同质的时，意味着它可以很容易与其他资产交换（如以物易物贸易），或者可以兑换货币。这意味着你可以使用同质资产来获取商品或服务。更重要的是，同质资产可以分解为更小的单位。例如，`bitcoin`
    是一种同质资产。以 `BTC` 为例，`1 BTC` 可以细分为八位小数，最小单位称为 `Satoshi`。


    因此，`1 Satoshi = 0.00000001 BTC`，即百万分之一的比特币。


    NFTs 不具备互操作性：这意味着一个 `NFT` 不能替代另一个 `NFT`。这是因为每个 `NFT` 都是独特的，并且有自己的特征和信息。一个例子是游戏
    `Crypto`。


    #### NFT 是如何生产的？


    `NFTs` 是根据 `Ethereum` 开发人员准备的 `ERC721` 代币标准制造的。这些平台使得用户能够轻松进行交易，而不会在技术世界感到困惑。生产
    `NFT` 只需要一个数字货币钱包。当你通过这些平台将想要作为 `NFT` 生产的文件上传到 `IPFS` 系统后，你必须指定无法更改的 `NFT` 参数。在确定了诸如生产多少个
    `NFT`、价格以及下次销售时你需要获得多少份额后，通过支付区块链网络的交易费用将生产 `NFTs`。交易完成后，`NFTs` 将传输到你的钱包，并记录在整个区块链上。


    #### 我如何获得 NFT？


    还有一些平台展示并销售 `NFTs`。在这些平台上，你可以根据制造商拥有你喜欢的 `NFTs`，可以通过拍卖或直接购买。购买完成后，`NFT` 将从制造商的钱包转移到你的钱包。


    #### NFT 是投资工具吗？


    非同质化代币意味着不可分割的代币，作为数字实体。今天，`NFTs` 被广泛应用于数字艺术，也有不同的用途，如游戏物品和体育收藏品。


    #### NFT 将产生什么影响？

    '
