  trans: '


    如果开发者能够克服主要的局限性，区块链极有可能让游戏世界向更好的方向发展，并被视为一个全新的娱乐空间。


    # Decentraland


    Decentraland 是一款基于区块链的虚拟现实游戏。玩家可以开发和出售由 `ERC-721` 代币代表的虚拟土地 `LAND`。`LAND` 的每个部分都是独特的，`LAND`
    所有者可以自己决定用什么内容填充他们的土地。这从简单的景观到互动游戏不等。


    用户可以使用平台的本地代币 `MANA` 购买 `LAND`。在某种意义上，Decentraland 有它自己的经济体系。用户有不同的方式进行互动并从中获。但与
    `Second Life` 等其他类似的虚拟现实游戏不同，Decentraland 由一个去中心化的群体控制。用户开发并拥有土地、艺术品和 `NFTs`。成员也是平台去中心化自治组织
    (`DAO`) 的参与者。


    Decentraland 是一个 `DAO`，赋予了社区参与项目治理的权力。Decentraland 的本地货币是 `MANA`，所有游戏内资产都在 `Ethereum`
    区块链上。


    如果你以前玩过 `Second Life` 并且买卖过加密货币，那么 Decentraland 可能会让你产生兴趣。在短短五年时间里，Decentraland
    从一个简单的 2D 实验演变成了一个更大的 3D 世界。Decentraland 的开发者 Esteban Ordano 和 Ari Meilich 创建了一个包含数字房地产地块、物品和其他自定义资产的虚拟世界。人们可以使用
    Decentraland 的 `ERC-20` 代币 `MANA` 购买所有这些内容。


    Decentralanders 可以从各种交易所用加密货币或法币购买 `MANA`。`Erc-721` 独特代币代表 Decentraland 的独特资产，例如
    `LAND` 属性和其他收藏品。


    ## Decentraland 如何运作的


    Decentraland 是一个结合了虚拟现实与区块链技术的在线世界。与许多其他在线游戏不同，玩家对在线世界的规则有直接控制权。`DAO` 代币赋予了所有者关于平台组织政策和游戏内功能的投票权。组织政策影响着
    Decentraland 的每一个方面，从允许的物品类型到 `DAO` 资金库所进行的投资。


    `NFTs`；衣服、物品和游戏的虚拟房地产代表了游戏内收藏，包括 `LAND`。用户将这些代币保留在他们的加密钱包中，并在 Decentraland 市场上将其出售给其他用户。例如，你需要
    Decentraland 的本地货币 `MANA` 来给自己买一个新的脸面具。


    除了买卖物品和物业外，玩家可以在他们的个人空间填充游戏、活动和艺术品，并在那里与他人互动。还有变现 `LAND` 的选项。只有玩家才能决定对他们的土地做什么。


    你的命运、成功以及你的旅程取决于你自己、你的努力和你的想象力。


    Decentraland 有许多用途，例如广告和内容创作。然而，对于想要开始使用 `NFT` 的新玩家来说，门槛很高。由于 `Ethereum` Gas 费用，购买某些化妆品的成本几乎翻了一番。土地费用也是数千美元，使得拥有物业对某些玩家来说太贵。


    ## 什么是 LAND 和 MANA？


    正如我们之前提到的，`MANA` 是 Decentraland 的本地货币。它不仅具有数字货币功能，还赋予了每个拥有 `MANA` 的人在 Decentraland
    `DAO` 中投票的权力。


    用户需要将他们的 `MANA` 转换为封装的 `MANA` (`wMANA`) 并将其锁定在 `DAO` 中以参与 `DAO` 治理。每个 `wMANA`
    代表治理动议中的一票。你可以从交易所获取 `MANA`，或者通过在 Decentraland 市场上出售收藏品来获取。`DAO` 中的 `MANA` 用于为其决策和操作资金。


    `LAND` 是一种独特的代币，代表社区中玩家拥土地。与 `MANA` ，Decentraland 的治理协议提供了投票权。


    但 `LAND` 不需要锁定在 `DAO` 中，每个 `LAND` 代币提供每个 2,000 选票。拥有多块土地的玩家可以将它们合并在一个 `Estate`
    代币下。`Estate` 代币提供的投票权等于它包含的土地数量。


    ## 什么是 Decentraland DAO？


    Decentraland 的有趣特性之一是对其去中心化的关注。正如我们之前提到的，Decentraland 的土地、数字资产和开发是由玩家社区控制的。


    该项目使用开源代码作为去中心化自治组织来规范规则。任何拥有自己的 `MANA` 或 `LAND` 的人都可以准备动议并对其进行投票。Decentraland
    `DAO` 运行在 `DAO` 软件解决方案 `Aragon` 上，并使用一个可以与 `Ethereum` 智能合约交互的 `Agent`。


    ## Decentraland 的用途


    Decentraland 的开发者从设计阶段就开始考虑该平台在区块链社区中新用途的潜力。白皮书提到了五个用途：


    - **应用程序**：用户可以使用 Decentraland 的命令语言创建应用和 3D 场景，实现更丰富的互动。

    - **内容创作**：Decentraland 中出现的社区聚集了有相似想法的人，导致了有机社区的形成。

    - **广告**：社区内的玩家流量导致品牌购买空间并放置告示进行广告。

    - **数字收藏**：在 Decentraland 市场上积累、创建以及买卖的 `NFTs` 赋予了用户所有权。

    - **社交**：社交媒体平台上的社区，甚至是线下小组，可以体验更具互动性的朋友社交方式。


    与大多数涉及区块链经济的游戏一样，你在这里获得赚钱的机会。投机非常普遍，一些高需的 `LAND` 价格可以变得非常高。


    ## 如何存储 MANA 和 LAND？


    为了与 Decentraland 完全交互，你需要一个集成到浏览器中的加密钱包。开发团队建议将你的 `MANA` (`ERC-20`) 和 `LAND` (`ERC-721`)
    代币存储在 `MetaMask` 中。


    Decentraland 在区块链虚拟现实平台中是非常独特的。探索这个平台完全免费，因此你可以通过浏览这个世界轻松做出自己的决定。项目的开发团队在五年内与其他加密项目相比已经让小型项目非常成熟。


    ### Axie Infinity (AXS)


    要理解 Axie Infinity，你可以想象一种结合了宝可梦和 CryptoKitties 的区块链游戏。Axie Infinity 是建立在 `Ethereum`
    区块链上的 `NFT` 游戏和生态系统。本地货币是一种名为 Axie Infinity Shard (`AXS`) 的 `ERC-20` 代币。


    遵循 `CryptoKitties` 开创的理念，Axie Infinity 是一个基于 `Ethereum` 的收藏品，自 2018 年以来一直在增长。该游戏由位于越南的初创公司
    `Sky Mavis` 开发，作为一个雄心勃勃的项目开始并变成了流行的以太坊游戏。


    Axie Infinity 生态系统的代币是 Axie Infinity Shard (`AXS`)。`AXS` 是 2020 年 11 月引入的 `ERC-20`
    治理代币。`AXS` 代币可以通过购买、交易或通过玩游戏获得。


    与 Axie Infinity 相关的其他代币以 `ERC-721` 代币形式的游戏资产（例如，你的 Axie 角色）和小爱药水 (`SLP`)，一种 `ERC-20`
    代币。


    #### 什么是 Axie Infinity？


    在 Axie Infinity 生态系统中，游戏角色被称为 Axies。这些是你拥有并管理的独特代币 (`NFT`)。你可以将 `NFT` 保留在你的个人钱包中，将其转移到其他
    `Ethereum` 地址，或使用基于区块链的市场与其他玩家交易。除了 Axies 之外，游戏还包括 `ERC-721` 代币形式的虚拟土地和物品。


