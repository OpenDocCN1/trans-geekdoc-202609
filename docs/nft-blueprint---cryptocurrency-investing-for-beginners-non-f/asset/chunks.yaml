    如果你只想创建一个并出售一次非同质化代币，你可以选择“single”（单个）。


    如果你想向更多人出售多个副本，可以点击“multiple”（多份）所在处继续。


    ![图形用户界面，应用描述自动生成](img/image-6.png)


    单个（`single`）资产是用以太坊的 `ERC721` 代币标准创建，而多个资产是使用 `ERC1155` 代币标准创建的。


    在本指南中我们将继续选择“multiple”。在交易方面没有区别。当你选择 `Multiple` 时，你只需要确定副本的数量。


    然后，你需要通过以下方式点击“选择文件”按钮，以 `PNG`、`GIF` 或 `MP4` 等格式将作品上传到平台。


    如果文件的原始大小大于 `30mb`，你还可以为文件添加额外信息（例如链接和密码），这些信息可以在“购买后解锁”部分下载。


    ![图形用户界面，文本，应用，聊天或文本消息描述自动生成](img/image-7.png)


    上传文件后，你需要如下所示将“上架”选项向右滑动。你还可以在“立即销售价格”部分为作品设置销售价格。


    无论你是否为作品设置销售价格，人们都可以竞价。然而，如果你设置了价格，销售过程可以立即进行。


    你还可以通过打开“购买后解锁”部分，添加如链接、代码和数字密钥等信息提供给接收者。


    ![图形用户界面，应用描述自动生成](img/image-8.png)


    如果你不添加任何内容，仍然可以通过关闭“购买后解锁”选项来填写其他信息。


    在“选择集合”部分，你可以直接使用默认的 `Rarible` 选项。你也可以点击“创建”，创建一个包含视觉效果、代币名称和其他信息的自定义集合，而不是 `Rarible`。


    你需要在“名称（name）”部分为你稍后创建的 `NFT` 指定一个名称。你也可以在 `description` 中输入描述或将其留空。


    ![图形用户界面，应用描述自动生成](img/image-9.png)


    最后，在“版税（royalties）”部分，你需要确定版税率。例如，当你出售的资产被买家出售给他人时，你将获得后续销售的一定份额。


    在“副本数量（Number of copies）”部分，你需要确定要从同一件作品中创建并作为代币出售的数量。


    在 `Properties`（属性）部分，你可以输入关于作品的属性信息或将其留空。


    ![图形用户界面，应用描述自动生成](img/image-10.png)


    在 `Rarible` 中输入创建非同质化代币所需的信息后，你可以点击“创建项目（create item）”按钮并通过确认钱包中的交易来完成 `NFT` 创建过程。


    如下，你可以通过 `MetaMask` 或你使用的钱包中按顺序执行三个操作，将作品转换为 `NFT` 并上架。


    你必须为前两次交易支付传输费用。在最后一次交易中，你可以通过签署销售流程来完成 `NFT` 创建和上架过程。


    在此之后，你可以在 `Rarible` 的“我的项目”部分看到你创建并上架的 `NFT`。


    ## Rarible 费用


    `Rarible` 为非同质化代币交易收取 `2.5%` 的佣金。


    如上述 `NFT` 交易所示，`2.5%` 的佣金同时向卖方和买方收取。


    因此，买卖双方在任何 `NFT` 交易中都要支付 `2.5%` 的佣金，而 `Rarible` 总共获得 `5%` 的佣金。


    # 第 3 节


    # NFT 如何工作？


    ## 3.1 区块链基础


    区块链技术无疑是过去十年最具影响力的技术创新。


    区块链是一种利用加密科学（密码学）在数字环境中创建数据记录的方法。可能有不同的区块链应用，但它们的共同特征是数据无法追溯地删除或修改。数据的副本存储在去中心化的分布式结构中，且该分布式结构内的数据所有权和控制权通过密码密钥受到保护。有了这个系统，我们现在可以随心所欲地塑造其中的数据。整个区块链领域实际上由平台、产品、服务和业务组成。


    ### 区块链系统的技术原理

