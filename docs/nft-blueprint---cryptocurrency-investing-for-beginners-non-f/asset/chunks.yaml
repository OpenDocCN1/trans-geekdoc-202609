- raw: 'The second object is the subject of the agreement. This can only be an object
    that exists in the environment of the smart contract. Alternatively, smart contracts
    should have unhindered and direct access to the object. Although smart contracts
    were first discussed in 1996, it was this particular object that stopped their
    development. This issue was[ only partially resolved after the first ](https://www.coinkolik.com/kripto-para-nedir/)cryptocurrency
    appeared in 2009.


    Finally, any smart contract must include certain terms and conditions. These terms
    need to be mathematically fully defined and a programming language suitable for
    a specific smart contract environment should be used. This includes the terms
    expected of all participating parties and all rules, rewards and penalties for
    such terms.


    Smart contracts need to work within a specific appropriate environment for them
    to exist and function properly. First of all, the environment needs to support
    the use of public key encryption, which allows them to log on to the process using
    unique, especially generated encryption codes. This is the exact system used by
    the absolute majority of existing cryptocurrencies.


    Second, an open and decentralized database is required, which all parties to the
    contract can fully trust and are fully automated. Moreover, the entire environment
    needs to be separated from the centre for the smart contract to be implemented.
    Blockchain, especially Ethereum Blockchain, are excellent environments for smart
    contracts.


    Finally, the source of the digital data used by the smart contract must be fully
    reliable. This requires the use of root SSL security certificates, HTTPS, and
    other secure connection protocols that are already widely used and automatically
    applied in most of today''s software.


    ### Advantages of Smart Contracts


    Smart contracts provide:


    ●Autonomy – You are the one who makes the contract; it is not necessary to rely
    on an intermediary, lawyer or other mediator to approve it. By the way, this also
    creates the danger of manipulation by a third party, since execution is automatically
    managed by the network, not by one or more, possibly biased person, which may
    be wrong.


    ●Guven – Your documents are encrypted in a shared ledger. There''s no way anyone''s
    going to say they lost.


    ●Backup – Imagine that your bank has lost your savings account. On the blockchain,
    each of your friends has your back. Your documents are duplicated over and over
    again.


    ●Security – Cryptography used to encrypt websites keeps your documents secure.
    There''s no hacking. In fact, you have to be an abnormally intelligent hacker
    to crack the code and infiltrate it.


    ●Speed – You would often have to spend time and paper processing documents manually.
    Smart contracts use software code to automate jobs, which saves time in a variety
    of business processes.


    ●Savings – Smart contracts save you from an intermediary and mediator. For example,
    you have to pay the notary to witness your transaction, but thanks to smart contracts
    you don''t need a notary.


    ●Accuracy: Automated contracts are not only fast and inexpensive, but also accurate
    in that they prevent errors caused by filling out form stacks manually.


    ●Guaranteed outcome: One of the reasons most people involved in transactions go
    to court is because one or more persons have failed to abide by the rules and
    terms of the agreement. But smart contracts can significantly lower or even eliminate
    the need for litigation. Parties will always be committed to operating by the
    rules of the underlying code when using self-executing contracts.


    The Developer and Users of Smart Contracts


    Smart contracts were first announced in 1996 by Nick Szabo, a computer scientist
    and cryptologist. For several years, Szabo revisited the concept and published
    various publications; defined business practices related to contract law through
    the design concept.


    However, the implementation of smart contracts did not take place until 2009;
    The first cryptocurrency, Bitcoin, eventually appeared alongside Blockchain, which
    provided a suitable environment for smart contracts. Interestingly, Nick Szabo
    designed a mechanism for a decentralized digital currency called Bit Gold in 1998.
    This was never implemented, but Bitcoin had many features to boast about after
    10 years.


    Nowadays, smart contracts are mostly associated with cryptocurrencies. It is also
    true to say that decentralized cryptocurrency protocols cannot exist without the
    other, mainly because they are smart contracts with decentralized security and
    encryption. They are widely used in most of the crypto-interference networks that
    already exist and are the most important and one of the most suggested features
    of Ethereum.


    ### Smart Contract 2.0


    In 2018, some types of blockchain agreed that a new type of contract should be
    supported. Existing smart contracts were strong in the idea, but weak in practice.
    Interest quickly increased when Block.One announced their support for the EOS
    Ricardian contracts.


    What are Ricardian Conventions? Second Generation Smart Contracts!


    A Ricardian Convention is a legal contract first initiated in 1995 by Ian Grigg,
    a well-known programmer. The concept is now part of the blockchain. Here''s the
    basic definition:


    "It is a kind of digital document agreed between the two parties, containing the
    terms of the interaction between the parties."


    What makes it unique is because it’s signed, verified, and encrypted. Even if
    it is a digital document, it is in easy text that is easy for people to read (not
    just for lawyers). It is a unique legal contract that can be read for computer
    programs and also for people.


    Simply put, it has two parts or serves two purposes. First, it is an easy-to-read
    legal contract between two or more parties. Your lawyer can easily understand
    and even you can read and understand the basic terms of the contract.


    The latter is also a contract that can be read by the machine. With blockchain
    platforms, these agreements can now be easily collected, signed, and saved on
    the blockchain.


    Ricardian Conventions: Historical Context


    While Ricardian Conventions is something new for blockchain, it''s a thirty-year-old
    concept. The Ricardian convention is not the only modern term for blockchain introduced
    in the 1990s. Many recent ideas, such as Smart Contracts and Proof of Business,
    also appeared at the same time, but were later implemented when blockchain became
    mainstream.


    Ian Grigg: The Man Behind Ricardian Contracts


    Ricardian Contracts were first developed in 1995 as part of the Ricardo Payment
    System. Ian Grigg, the man behind this new legal document, is considered one of
    the pioneers of financial encryption. Interestingly, he was still a student when
    he developed the Ricardian Conventions. That''s why people called it the Ian Grigg
    Ricardian Contract.


    In 1998, he published his detailed work on Ricardian Conventions under the name
    "Financial Encryption in 7 Layers". In his published article, he described the
    Ricardian Conventions with the following words:


    "A digital contract between two or more spouses, mutually and cryptographically
    signed and verified, defining the conditions of interaction. The important thing
    is that it can be read by both man and machine and is digitally signed."


    Anyone who can read his work can understand that his time is way above his time.
    After all, he developed an interesting concept for quantifying a legal contract
    or any financial instrument or entity. However, in the 90s, there was no suitable
    technology for applying ideas according to their values. But this limitation no
    longer exists after the advent of blockchain technology.


    ### Uses of Smart Contracts


    Jerry Cuomo, vice president of blockchain technologies at IBM, believes smart
    contracts can be used across the chain, from financial services to health insurance.
    Here are some examples:


    #### Government'
