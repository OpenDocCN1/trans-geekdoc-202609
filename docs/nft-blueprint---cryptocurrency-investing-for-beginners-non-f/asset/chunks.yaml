    revolution in the art industry, for others it is at best a gimmick with enormous
    loss potential. Although you can''t hang `NFT` on the wall, the tokens have often
    been sold for horrendous sums: Jack Dorsey''s first tweet brought in $2.5 million,
    a collection by Rick and Morty creator Justin Roiland changed hands for $2.3 million,
    and "Disaster Girl" Zoë Roth sold an `NFT` of her memes for at least $500,000.


    Looking at some of the most intriguing sales of recent time: US artist Beeple
    (Mike Winkelmann) sold a collage of his works at auction house Christie''s for
    $69.4 million. Lebron James'' dunk video `NFT`, sold through the NBA Top Shot
    app, retails for $77,000. Twitter CEO Jack Dorsey''s tweet was bought by a Turkish-born
    person for $2.9 million, while Elon Musk auctioned off his tweet, which included
    GIF and music, as `NFT`. In recent days, Cüneyt Özdemir''s tweet sold for $10,000.


    Such high sums only come together if a corresponding demand builds up - and this
    is currently particularly large due to the hype about `NFT`. This attracts speculators
    and collectors. In addition, digital art is certainly a powerful future market,
    so `NFT` will certainly shake up some in the art industry. Of course, this is
    not a guarantee for quick wealth, even with `NFT` bubbles can form and high losses
    arise - but also huge profits.


    ## Are NFTs bad for the climate?


    At the moment, the answer is probably yes. `NFT` also suffers from the energy
    dilemma of many cryptocurrencies: more than 80 kilowatt hours of electricity are
    consumed per transaction and thus around 33 kilograms of CO2 are emitted. However,
    there is hope in sight: The resource-consuming consensus procedure "Proof of Work"
    (`PoW`) is to be replaced by "Proof of Stake" (`PoS`) before the end of this year.
    This not only expects a significant reduction in energy consumption, but also
    increases the transaction speed: from currently 15 processes per second to several
    thousand.


    ## Does NFT art have a future?


    One can only speculate about this, but at the moment it all looks like it. If
    digital art is sustainable, then it is probably. Theoretically, many other areas
    of application are also possible. In addition to the function as a certificate
    of authenticity, the tokens are also conceivable as forgery-proof tickets for
    events from concerts to adventure pools. Even non-digital objects could one day
    be verified, and they are also applicable to people: for example, for identification
    with authorities or offices.


    There are already computer games in which `NFT` takes the form of items, characters
    or virtual regions. The world''s largest crypto trading platform Binance is also
    entering the business: in June 2021, it wants to open its own marketplace for
    crypto art. The focus is on the trade in high-priced premium articles as well
    as on ordinary consumers: A second marketplace for everyone should also trade
    in affordable items. Here Binance wants to be content with one percent commission,
    at least initially, so they are obviously betting on a growing market.


    As experiences with `NFT` increase, it seems that creative new business models
    are being constructed. First, the digitization of physical assets, i.e., ''tokenization'',
    can be adapted to a wide range of sectors. Last week, for example, a 3D virtual
    world-designed home in the U.S. sold for $500,000. It also appears that some games
    also have land sales as `NFT`. Another area where `NFT` is expected to have an
    impact is social media. Metrics such as the number of follow-ups, views and views
    that creator’s cash in have the potential to be rendered non-manipulated by centralized
    social media companies thanks to `NFT`. Digitization of physical assets seems
    to cause us to redesign many of the processes we are accustomed to. There are
    even scenarios in which NFTs future uses include governments producing their bonds
    as `NFT` and being able to trade them globally.


    We really hope you enjoyed reading this book and found it to be informative. With
    this knowledge, you can now go ahead and experiment with investing in `NFT` and
    even find a way to create your own `NFT` by acquiring additional knowledge. Wishing
    you all the very best!

