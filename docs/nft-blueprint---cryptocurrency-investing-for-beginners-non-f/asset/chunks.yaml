    Enjin 是领先的公司之一，为多种数字产品提供生态系统，使任何人都能相对容易地实现游戏变现。这意味着游戏开发者可以通过 `Ethereum` 将游戏内物品代币化——由
    Enjin 的 `ERC 20` 代币支持。Enjin 代币是市场上最廉价的替代币之一——截至本文时为 2.5 美元——并为投资者提供了替代币中最高的增长潜力。截至发布时，Enjin
    的市值超过了 7.5 亿美元。


    ### Decentraland (MANA)


    `MANA` 构建在 `Ethereum` 之上，允许用户创建、体验和变现内容及应用程序。通过 `MANA`，他们可以购买虚拟财产并按照意愿进行导航、开发和变现。


    截至 2021 年 4 月，`MANA` 的市值超过 4.7135 亿美元。它于 2020 年 2 月推出，ICO 价值为 2400 万美元。该平台使用一种
    `ERC-20` (`MANA`) 代币和一种 `ERC-721` (`LAND`) 代币。要获取财产，必须销毁 `MANA`。


    ### OpenSea NFT 市场


    OpenSea 市场允许任何 NFT 在平台上进行拍卖。OpenSea 充当去中心化市场，交易在智能合约下进行。`CryptoKitties` 允许你交易超过
    200 种 NFT 类型，包括 `SuperRare`艺术和 `Gods Unchained`。


    ## 2.4. 流动性


    得益于 NFT 市场的不断增长，NFT 的流动性正在提高。然而，考虑到 NFT 在设计上是稀有且独特的，这意味着特定 NFT 的流动性将很低。这是因为 NFT
    创建者人为地维持了 NFT 的有限供应。NFT 市场将根据拍卖创建流动性池，类似于 `DeFi` 流动性池，作为回报，个人可以通过捐赠 NFT 代币来购买同质化代币，反之亦然。


    假设你要参加一场体育赛事或有一个你喜欢的摇滚乐队，你想买他们的演唱会门票。除了两种场合购买的门票在特征上具有独特性外，NFT 也是独特的，这意味着它们不能相互交换。


    每个 NFT 都是独不同的，这可能是 NFT 最显著的特征。正如我们上面提到的，NFT 不能相互交换。除了相同的智能合约和相同的代币编号外，无法制造出其他
    NFT。这意味着制造出的代币是单一且孤独的，不能通过任何其他方式生产或复制。这类似于毕加索亲手绘制的《格尔尼卡》是无价之宝，尽管有成千上万的副本。这得到了区块链的确认并且所有人可见。


    ## 2.5. 不变性与可证明的稀缺性


    得益于区块链技术和智能合约的不可变性，NFT 是不可破坏的，NFT 不能被更改、复制或破坏。这意味着谁购买了 NFT，谁拥有它，而不是 NFT 的创建者。如果所有者出售
    NFT，他们无法伪造所有权记录，因为这在区块链技术是不可能的。NFT 的这种属性使得它们在音乐行业中的潜力无价。我们将在稍后的部分讨论这一点。


    它们能够抵抗后续更改，并在创建期间对其供应量进行精确确定。NFT 所有者的身份是区块链上的永久记录。当 NFT 转手时，它将通过区块链进行验证。这确保了原始所有者受到保护。此外，NFT
    允许创建者设定权利，特别是在产品上。


    ## 2.6. 稀有性


    NFT 的稀有不应与其价值来源的稀缺性混淆。尽管开发者可以创建任意数量的 NFT，但他们通常会限制代币数量以确保它们的唯一性。如果我们做一个简单的假设，即最初待售的产品价值将低于未来，这可能意味着我们可能会拥有在未来以更贵的价格出售的产品。


    NFT 没有寿命，并且非常易于购买和出售，可以保留多年。换句话说，将产品转化为 NFT 也可以赋予其部分无限性。


    ## 2.7. 可编程性


    像传统的数字资产一样，NFT 是完全可编程的。例如在 NFT 的祖先 `CryptoKitties` 中，你可以通过喂饼干等设计机制让数字猫生长成熟。今天大多数
    NFT 都有更复杂的机制，如铸造、处理、兑换、随机创建。在我看来，NFT 的设计领域拥有无限的可能性。


    它们使用元数据从合约外部位置获取属性。


    这些是以 `JSON` 格式编写的代码数据，使得数字存储的资产能够在平台上视觉化地呈现，并通过这些元素获取属性并获得 `erc-721` NFT 的决定性特征。


    `JSON` 不存储在以太坊合约中。因为成本很高。相反，它存储在 `URI`（通用资源标识符）`String` 中，这指示了用户代币元数据可以在哪里找到 `JSON`
    。


    当我们实现合约时，我们需要一种方法确保每个项目都能正确显示，例如在 `OpenSea` 上（以及其他支持同质化非代币的网站上）。


    '
