    Of course, as a programmer you also have the possibility to easily redesign the
    respective source code according to your own needs and thus get a very personal
    DAPP. Of course, you should master the underlying programming language and understand
    the subtleties of the source code. Whether your own changes will actually be applied,
    however, will then be decided by the entirety of the developers.


    ## Blockchain


    The second criterion that every DAPP must meet is that it is based on a blockchain.
    The blockchain makes the DAPP decentralized and is stored on many different computers
    at the same time. As a result, it becomes almost impossible that a DAPP can be
    deleted or that criminals can hack into the DAPP. Well-known blockchains are,
    for example, the `Bitcoin` network or the `Ethereum` network. Here, all data is
    stored on the users'' PCs and not, as for example with apps, centrally on special
    servers. Such data includes the source code, all transactions of the cryptocurrencies
    and other information necessary for the smooth running of the DAPP. The blockchain
    is always the heart of a DAPP. `Type1` DAPPs have their own blockchain, while
    `Type2` and `Type3` DAPPs are based on it. Each block is completed and encrypted
    after a certain period of time.


    ## Cryptographic Encryption


    The cryptographic encryption of each block is used to obtain and verify all information
    in a certain period of time. If you look at the `Bitcoin` network, for example,
    enormous computing power is spent here to verify and store all transactions. So-called
    `Bitcoin` miners take over this computing power and in return receive rewards
    in the form of `Bitcoin` and also the transaction fees. If a block is completed,
    this is done by generating a `hash`. A `hash` is a kind of checksum that ensures
    that all transactions and information made in the previous block are authentic
    and traceable.


    However, individual trades will be difficult to identify in retrospect, as it
    is very time-consuming to make the previous information visible again from a `hash`.
    The cryptographic encryption thus serves both to ensure the authenticity of all
    information, as well as the anonymization of the individual users. Therefore,
    your own data is much more secure if you use a DAPP than if you make it available
    to the providers of apps.


    ## Token generation


    The last criterion that must be met by a DAPP is token generation. With the `Bitcoin`
    network, such a token is simply the `Bitcoin`. The miners who provide their computing
    power to create hashes must be rewarded so that they want to fulfil this task.
    This is done using a reward in `Bitcoin` once a `hash` is found. Investors who
    speculate with cryptocurrencies know how high the `Bitcoin` price is today. So,
    each token has an equivalent value in real currency.


    The token generation only serves to make it worthwhile for the miners to provide
    their computing power. `Hash` generation is important for any blockchain, as it
    would no longer work without it. As a result, token generation ensures that it
    remains attractive for miners to keep the blockchain running. If all these four
    criteria are met, one can speak of a DAPP.


    ## DAPPs Networks


    There are now a large number of DAPPs on the market. Among the best known are
    undoubtedly the large crypto currencies which are based on a proof-of-work algorithm.
    However, the networks behind it are also used by countless `Type 2` and `Type
    3` DAPPs. For example, `Microsoft Azure` uses the `Ethereum` network as `type
    2` DAPP to provide specialized infrastructure for third-party users. You can see
    that behind the cryptocurrencies there is a network with which a wide variety
    of digital possibilities are provided.


    However, there are also DAPPs that do without actual cryptocurrencies. For example,
    games are produced that have not been designed as an app but as a DAPP. Although
    the developers cannot earn money directly with these, they can start projects
    that are constantly being further developed due to the open-source criterion.
    This creates new possibilities to create things that did not exist before.


    If you look at the `Ethereum` network further, the use of the so-called `smart
    contracts` will become more and more important here. These allow developers to
    use the `Ethereum` network to create, for example, decentralized trading platforms,
    social networks (e.g., `Landmark`) or social media platforms (e.g., `Leeroy`).


    It is not for nothing that it is often said that blockchain technology is the
    future. This makes it possible to circumvent the market power of app manufacturers
    and thus to use an alternative Internet in that all information is freely available
    and not controlled by individual big players. Through DAPPS you have the possibility,
    so to speak, to create a freer Internet.


    ## Blockchain Networks as a Source for DAPPs


    The mother of all DAPPs is probably the `Bitcoin` network. The vast majority of
    investors who speculate with cryptocurrencies, of course, focus on the `Bitcoin`
    itself. However, the network behind it is just as interesting, as blockchain technology
    is making novel systems possible in the first place.


    `Ethereum` is also based on a blockchain. Countless `Type 2` DAPPs use the associated
    network today. After `Bitcoin`, `Ethereum` is probably the second largest source
    of DAPPs.


    Of course, other blockchains are also used by various DAPPs and it is only up
    to the developers to decide which network you choose in the end.


    Today you can already use DAPPs in a wide variety of variants. In this way, social
    media platforms are created, social networks are set up, infrastructures for IT
    companies are created, games are developed, or trading platforms are designed
    in the DAPP form. It can be assumed that in the future more and more developers
    will program DAPPs instead of apps in order to benefit from the advantages of
    the block chain and its decentralized design. However, it should be noted that
    the division is still in its infancy. The industry relies on developers who strive
    for an ideology of the free Internet and do not want to earn money exclusively
    from development. The open-source design of the DAPPs makes it possible to make
    rapid progress on certain projects, as it is not a single company that is engaged
    in development, but a whole community of free developers.


    ### The Most Popular DAPPs


    If you are looking for DAPPs online, you should quickly find what you are looking
    for. For example, there is a virtual reality platform in DAPP format called `Decentraland`.
    Here you can exchange ideas with other users. A platform that specializes in market
    predictions is called `Gnosis`. It sees itself as a point of contact for investors
    who want to identify certain trends at an early stage. `Gnosis` is based on the
    `Ethereum` network.


    `CryptoKitties` is especially popular with gamers. This online game contains virtual
    cats and was one of the first attempts to develop a game in DAPP format.


    Also, for sports betting there are now DAPPs. The best example of this is probably
    `SportCrypt`. Here, as with online betting shops, bets can be made on a wide variety
    of sporting events. Cryptocurrencies are used as a bet. If you like to be on social
    media platforms, the DAPP `Leeroy` could be an interesting alternative for you.
    Here, too, the `Ethereum` network is used.


    `Funfair Technologies` was designed as a gaming platform in DAPP format. So, you
    should get the opportunity to bet decentrally at different casinos.


    If you are looking for a decentralized shop based on blockchain, you will find
    it at `Shop`. A wide variety of goods can be purchased here. It has been shown
    that DAPPs extend to a wide variety of areas. There will probably soon be many
    more ways to use DAPPs for all sorts of purposes.

