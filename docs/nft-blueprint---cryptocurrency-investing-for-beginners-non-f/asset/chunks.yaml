- raw: 'What would a world look like where we experienced art primarily on smartphones
    instead of galleries and museums? No more being able to look at live paintings
    and sculptures, walk around museums and galleries, and look at them from all directions
    if necessary? It is especially fun where art attracts attention with its size,
    age or motif. However, how this can be experienced online became clear during
    the pandemic, for example in the form of digital tours in museums.


    During the pandemic, sales in the global art market fell 20 percent. However,
    online sales of artworks and antiques have doubled.


    Auction house Christie auctioned off a digital artwork for $US69 million for the
    first time in March. This is a digital: Encrypted by an NFT, which is an irresistible
    token, and is anti-counterfeit. Canadian artist Grimes, a friend of Tesla boss
    Elon Musk, sold the NFT for $5.8 million at the end of February.


    For many, art is also growing with sensational works and buzz about large amounts
    of money spent. In 2020, the turnover of the global art market was US$50.1 billion
    (41.9 billion euros). As a result of the pandemic, sales fell 22 percent – but
    online sales of artworks and antiques reached a record high of US$12.4 billion.
    According to art Basel and UBS''s global art market report, it has doubled compared
    to 2019.


    NFT taking over Contemporary Art


    A traditional market is driven by crypto art. The work also upsets the art world
    because it was digitally sold at a one-time auction. Cryptography and digital
    art combine here. Beeple, a graphic designer, computer scientist and director
    from Charleston, gave each of the 6,000 images he created and uploaded online
    a digital certificate of authenticity, an "irrevocable token" (NFT). For example,
    NFT''s convert a jpeg to a signed encrypted file. It becomes a fraud-protected
    data record in the blockchain.


    Authenticity is very important in art. It increases not only ideally, but also
    its value. "Digitally, ''digital scarcity'' turns a work of art into something
    rare and adds value to it," says Betty Briceño, an art market expert from Miami
    (U.S.). Blockchain fuels briceño, a course at the Sotheby''s Institute of Art
    in London, sees a new generation of art lovers. "Kypto art is associated with
    the part of blockchain technology beyond the financial world," he says. Their
    first project was Dada.nyc or CryptoKitties.


    According art historians, “The sale of Beeple''s NFT work has shaken the art world,"
    says the expert, who advises collectors. "There are very controversial discussions,
    but some galleries and artists are already offering NFT work." Crypto Art, a subfield
    of digital art, is next to animations, interactive installations, AI Art and KI
    Art. Doms says: "As a means of verification and authentication, blockchain will
    take its place very quickly in the traditional art market."


    The result is a kind of art democratization. Artists who have been producing art
    on screen for years get a chance to make good money without exploding. Everyone
    who collects and invests in the same way. After digital art museums and galleries,
    digital markets for NFT art, which have existed since 2018, continue to establish
    themselves. These are called Nifty Gateway, producer location, Foundation, OpenSea,
    or SuperRare. Anyone can trade in digital art here. The market value is currently
    determined by demand, and it''s huge.


    Guillaume Cerutti, CEO of Christie''s, said in a press release of the Beeple auction
    event: "We are delighted to have brought together two collections of collectors,
    traditional and digital, at exactly the right time: for digital art creators,
    for blockchain technology, and for cryptocurrency. The next opportunities that
    await us in this segment are inspiring. ”


    Canadian artist Grimes, a friend of Tesla boss Elon Musk, sold NFT''s - digital
    pictures, animations and video clips - worth $US5.8 million (4.8 million euros)
    at Nifty at the end of February.


    Case Study: A selection of Art NFTs in 2021


    In this case, art doesn''t just mean photographic displays; it also includes performance
    art like music and videos. Here are some of the top artists who have issued NFTs
    in the first half of 2021.


    ●Paris Hilton: $1.1 Million Offered for Legend of Love


    Paris Hilton has created her creations for the new NFT sales with a designer named
    Blake Kathryn. The series includes three different works of art. The first two
    are "Hummingbird in my metaverse" and "Legend of love". Eleven of these two products
    have been prepared. Although each product is digitally original, making more than
    one of these products has led to lower prices for these works. The products went
    on sale for $10,000 each and sold out in full. The resulting work, "Legend of
    Love", was prepared in a single copy. Therefore, a fixed price has not been set
    for this product, which is very valuable. Instead, bids are still underway for
    the auctioned product. The highest bid ever is $1.1 million. Hilton will have
    signed one of the most expensive NTF sales with this product.


    ●Eminem


    Marshall Bruce Matters, a 15-time Grammy winner, or Eminem as he is known, entered
    the world of NFT. This collection, called Shady Con, will come in partnership
    with Nifty Gateway. The NFT will include custom collection pieces. NFT''s with
    various instrumental rhythms will be limited. The fans need to hurry.


    Eminem says he was inspired by his childhood when he was preparing this collection.
    Eminem, who collected comic books, baseball cards and toys as a child, therefore
    has a special interest in collectibles.


    "Not much has changed for me as an adult. I tried to recreate some of these collections
    from that period of my life and I know I am not alone." Ashley Ramon, Senior Producer
    of Nifty Gateway, welcomed Eminem on the company''s platform and underlined the
    great interest of celebrities from various sectors in NFT.


    ●Pele''s Legacy Will Live on With NFT''s


    Pelé, one of the most important figures in football history, joined the NFT trend.
    Pelé, a three-time FIFA World Cup champion during his active playing career, will
    present memorable moments of his career as an NFT. Pelé has announced that 90%
    of the proceeds from the NFT sale will be donated to charities.


    The unique token craze has reached a great adoption all over the world. Finally,
    football''s living legend, Brazilian Pelé, announced that he would be issuing
    his own NFT. The legendary moments of the Brazilian star''s career will be collected
    in an NFT collection and will be available on the popular NFT platform Ethernity
    Chain on May 2. 90% of the proceeds from the sale will be donated to the Pelé
    Foundation.


    Edson Arantes do Nascimento, better known in the football world as Pelé, became
    the latest celebrity to embrace the rapidly growing world of unique tokens (NFT).
    According to a press release shared with CryptoPotato, the three-time FIFA World
    Cup winner will immortalize his successful career on the Blockchain-based NFT
    platform Ethernity Chain on May 2, 2021.


    Physical classic Pelé football cards, which have been in the collection of many
    in the past, have been the inspiration for NFT''s, reaching great popularity among
    football fans. Ethernity Chain plans to launch the new cards later in the year,
    following the first batch of NFT collections scheduled for release on May 2.


    We need to point out that a very large 90% of the proceeds from NFT sales will
    be used to fund the charity Pelé Foundation. The Pelé Foundation aims to empower
    and educate children around the world who are struggling with poverty.


    Ethernity Chain worked with numerous major projects before announcing plans to
    turn some of the legendary moments of Pelé''s career into 3D collectibles, one
    of the greatest footballers of the 20th century.


    ●Artificial Intelligence Robot: Sophia'
