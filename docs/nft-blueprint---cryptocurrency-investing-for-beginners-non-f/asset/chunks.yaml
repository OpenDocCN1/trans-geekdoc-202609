    Beeple''s success is probably unique – at least for now – but there are many artists
    who achieve great results by selling crypto art: the artist couple `Hackatao`,
    which is one of NFT''s pioneers in Italy, or `DotPigeon`, whose virtual exhibition
    on `Nifty` sold out within a week.


    Among the bands, `Kings of Leon` were the first to distribute an album as NFT,
    with three different tokens giving access to exclusive assets (from the special
    edition of the album to the possibility of having lifetime seats in the front
    row at their concerts).


    ### Gaming


    The sale of rare weapons or skins is currently prohibited in popular games such
    as `World of Warcraft`, `Fortnite`, `CS:GO` or `League of Legends`. It is also
    not possible to use items or skins from one game in another game. With `NFTs`,
    it would be possible to transfer objects and clearly assign property rights. This
    would solve some of the biggest annoyances faced by enthusiastic gamers.


    These are probably the most fertile markets, as buying virtual products is the
    norm for users in video games - I''m thinking, for example, of the skins, also
    with trademarks, of `Fortnite` or the fashion brands that sell clothes for virtual
    avatars within games - like `Gucci` in `Tennis Clash`.


    An excellent example of `NFT` in these markets is that of German footballer `Mesut
    Özil`, who, together with `Boss Logic` and `Genies`, has developed a clothing
    line for virtual avatars: the proceeds from the sale of these assets will be donated
    to `BigShoe`, a non-profit organisation that supports children living in poverty.


    For brands, it is important to understand what kind of market and action can best
    be combined with a campaign associated with this world: for some brands, this
    is something very natural, while for others it may be necessary to take a less
    conventional approach to use `NFT`.


    By approach, we mean both the type of content to be created (e.g., a word, a 3D
    object, or a video) and the type of platform through which the works are auctioned
    depending on audience you want to reach and the message you want to convey.


    ### Assets


    The `NFT` virtual asset market is large. On platforms like `Decentraland` and
    `Cryptovoxels` it is possible to buy plots of virtual land. These plots have unique
    properties, just like real world plots. Within virtual worlds, these plots are
    already being traded for tens of thousands of dollars. In addition, the site `Unstoppable
    Domains` has tokenized the names of websites. Each name of a website can thus
    be converted into an `NFT`, which can be traded freely by anyone.


    This area of `NFTs` is still at an early stage, but it is possible to tokenize
    real assets such as works of art or record contracts as `NFT`. The `NFTs` are
    used to prove that someone owns a work of art (proportionately) or to settle claims
    from royalties.


    Anything that happens in these weeks will undoubtedly lead to the birth of a new
    generation of `NFT`-related platforms: marketplaces will increasingly resemble
    art galleries where digital artworks can be exhibited and sold in the same way
    as traditional ones. Art is art, whether digital or physical.


    The same goes for clothes worn on virtual catwalks by avatars that can be seen
    digitally and can be bought by people who want to dress up their digital counterpart.


    One thing to keep in mind, however, is that `NFTs` can have a big impact on the
    carbon footprint (the production of cryptocurrency requires a large amount of
    energy, which clearly affects the level of `CO2` produced), so it is important
    that brands are aware of this and are informed about how they are acting responsibly.


    # Session 2: Decoding a Few Concepts to Understand NFTs Better


    ## 2.1. Standardization


    Crypto developers have over the years created common, reusable token standards
    on public blockchains. These are the ones that are going to basic principles such
    as ownership, transfer and simple access controls.


    These policies or protocols are similar to how the `HTTP` protocol sends a request
    between `2` devices when images are displayed in `JPEG` or `PNG` formats between
    two different computers.


    Blockchains add primitive elements and a layer that allows them to store their
    metadata, providing developers with a whole new set of state information on which
    they can develop applications. This area is called blockchain standards (which
    support stateful data storage and logical operations).


    The token for `Ethereum` is the virtual storage or representation of any asset
    on `Ethereum` or other blockchains.


    `ERC-721` is a standard that explains how to create unique tokens on the `Ethereum`
    blockchain. Unlike tokens created with the `ERC-20` standard, each token created
    with `ERC-721` is unique.


    Non-fungible tokens created with the `ERC-721` standard are unique, unlike other
    tokens. Since each `ERC-721` token is different from each other and is not of
    the same value, it is more difficult to exchange tokens with each other.


    Coins such as `Bitcoin` and `Ethereum`, as well as fiat currencies such as `USD`
    are fungible, meaning that each unit is equivalent. Therefore, each unit of such
    cryptocurrencies and fiat currencies has the same value and can be exchanged directly
    with each other.


    In addition, fungible coins and tokens can be divided into small units such as
    `Bitcoin` `0.5 bitcoin` and `0.0002 bitcoin`, for example, while a non-fungible
    token is a single unit and cannot be divided into small units.


    The `ERC-721` standard defines the minimum interface that a smart contract must
    perform to allow functions such as managing and swapping unique tokens, while
    not requiring or restricting the addition of additional functions for token metadata.


    `CryptoKitties`, a game in which unique cats are bred and sold, is the most well-known
    of the projects created with non-fungible tokens created with the `ERC-721` standard.


    Currently, non-fungible tokens are used in many projects such as `Decentraland`
    and `EnjinCoin`.


    The uses of non-fungible tokens are of course not limited to the gaming industry.
    It offers many different uses such as the pursuit of real assets such as artwork,
    real estate, etc.


    Another popular blockchain-based game played with `ERC721` tokens is `Blockchain
    Cuties`.


    To browse the trading or games of non-fungible tokens, check out `OpenSea`, the
    largest marketplace for digital items on blockchain.


    ### What is the ERC-721?


    This is the non-fungible token standard. Currently, most `NFTs` are implemented
    on top of the `Ethereum` platform as tokens. You can find other tokens under `NFT`
    with different standards and other protocols, for example, on `NEO` or `EOS`,
    but `ERC-721` is currently the most popular standard of `NFT`. The `ERC-721` has
    a set of standard features and attributes that define it in the form of a smart
    contract. You need to follow these attributes and features to own, trade and manage
    the `ERC-721`. Simply put, the `ERC-721` provides us with a standard for creating
    and exchanging `NFTs`. Each `ERC-721` marker is unique in that it does not belong
    to `ERC-20` markers.


    General definition: A type of token that provides a standard for `NFT`. In other
    words, such tokens are unique and may have a different value than another token
    in the same smart contract. `ERC-721` tokens; they can differ according to their
    age, rarity and even visuality.


    Technical definition: `Erc-721` (`Ethereum Request for Comments 721`), is a non-fungible
    token standard that implements an API for tokens on smart contracts.


    When the `ERC-721` feature was first invented before Ether was born, it was intended
    to be added to the world of `Bitcoin` in terms of certification of real estate
    and assets other than `Bitcoin`, but it was not successful and stable, so it came
    to life with `Ethereum`.


    For example, one of the `2` tickets to the `Champions League` final is a regular
    seat, and the other is a `VIP/Lodge` ticket.

