    当游戏存在于中央服务器时，开发者可以随时退出项目或关闭游戏。有了区块链，即使开发者离开了项目，玩家也可以继续游戏。只要区块链持续运行，游戏就会一直存在。在某些情况下，新开发者会继承该项目并对其进行改进。


    # NFT 在游戏中的局限性


    尽管区块链技术为游戏世界开辟了全新的视野，但这项技术仍然需要克服一些局限性。这些局限性包括：


    - **可扩展性**：区块链的速度通常比中心化网络慢得多，这可能会阻止游戏在全球范围内普及。

    - **缺乏使用**：尽管有数百款区块链游戏，但需求仍然非常低。很多游戏的用户非常少。

    - **中心化**：并非所有的区块链游戏都是完全去中心化的。其中一些游戏使用了 `ERC-721` 或其他区块链币，但实际上通过中央服务器运行。

    - **过于简单**：尽管有一些例外，但大多数区块链游戏太简单了，无法吸引那些在乎高质量画质或高端游戏体验的玩家。

    - **竞争激烈**：区块链游戏通常由小型独立团队（（游戏游戏）开发。这些团队在与世界巨型游戏公司竞争时可能会非常吃力。


    幸运的是，针对这些局限性的各种解决方案正在开发中。多个团队已经在与 `Ethereum Plasma`、`Lightning Network` 以及其他二层团队合作解决可扩展性问题。他们正在研究层解决方案。


    # NFT 游戏平台示例


    ## [TradeStars](https://tradestars.app/)


    这是一个极好的单位交易平台，同时支持 `Ethereum` 区块链和 `Matic Layer 2` 协议。在 TradeStars 中，用户交易的是反映真实事件数据的数字资产。体验一种去中心化的社交游戏，用户在其中表达自己的热情，相互展示赛车和体育知识的价值。这个平台为体育爱好者提供了一种新的方式，通过娱乐和飞跃的回报来利用体育知识。TradeStars
    的使命是将体育爱好者、玩家和博弈者聚集在一个革命性的平台上，他们可以在那里以透明且去中心化的方式进行交流和竞争。


    TradeStars 是一个关于飞行切点 `NTTs` 的去中心化交易所（DEX），其飞行经济激励与用户与真实的统计生命数据挂钩。碎片化 `NTTs` 的想法源于大多数
    `NTTs` 普通投资者无法持有。因此，TradeStars 采用了 `NFT` 部分通信的概念，使用飞行的 `ERC-20` 标准来代表 NFT 的碎片，并确保
    NFT 在流通中的定价和维护能力。


    在平台上，真实的统计数据通过使用 TradeStars 碎片 NFT 来标记，用户可以购买智能代币。他们可以随时从平台上任何开放的 NFT 碎片市场购买或取消智能版本（smart
    verses），可以在平台上进行更改。用户还可以参与飞行平台的 TSX 积分以解锁精选 NFT 市场，参与投票管理并获得所创建的部分运营权。


    TradeStars 引入了 `DeFi` 和 `DEX` 中常见的传统功能的新特性，例如碎片化 NFT 和智能喷射。`NFT` 市场由可爱 `NFT` 象征的运动员真实表现，以及优秀的错误率或智能代币提案组成。


    ## NBA Top Shot


    NBA Top Shot 是由 `Dapper Labs` 开发的项目，实际上是一个授权收藏品出口。我们知道这家公司之前承担过许多项目，如 `Crypto
    Kitties`、`Hello Dapper`、`Flow Blockchain` 等。


    这些作为 `NFT` 令牌创建的数字产品是独特的令牌。这些产品与 `区块链` 连接，其收藏价值没有外部干扰，作为虚拟清算单位，价值极高。当你购买其中一个收藏品碎片时，你就获得了一个独特的令牌片段。当然，不同的收藏品可以呈现不同的形状。但到目前，最常用的收藏类型是片段功能。


    著名 NBA 球星的数字和动作通过最精美的片段和三个不同的摄像角度在数字令牌中呈现给你。同时，相关令牌的图像中还有许多价值，例如谁得分、谁助攻、何时得分。通过这种方式，你为自己的
    `区块链` 钱包增加了一个具有数字价值的收藏品。这实际上就是 NBA Top Shot 的本质。那么，它的逻辑是什么？它是如何工作的？如何获得 NBA Top
    Shot？


    ### NBA Top Shot 的逻辑是什么？


    事实上，它的逻辑非常简单，就是供需关系。我们之前提到过 NBA Top Shot 平台由 `NBA` 授权。因此，那里出的产品确实具有收藏价值。一个对你没有意义的奖杯对收藏者来说可能意义重大。同样，对你没有意义的数字令牌对收藏者来说也意义重大。因此，产生了需求和供给。


    ### 它是如何运作的？


    我们通常可以观察到收藏品是通过相关的网页进行拍卖的。然而，也有一些交易鼓励收集和购买收藏品。想想“作为杂志卡片的 NBA Top Shot 是什么”这个问题的答案。就像杂志卡片一样，当你集齐属于特定系列的所有收藏品时，你可以赢得独特的奖励。这些奖励令牌在任何地方都找不到也无法出售。因此，当前收藏者的首要目的是收集一个系列中的所有碎片。因此，有收藏者旨在赢得独特的
    NBA Top Shot 卡（即其令牌）。收藏者可以保留这张卡，也可以在拍卖会上以高价出售。


    ### 如何获得 NBA Top Shot？


    在问完什么是 NBA Top Shot 之后，最常见的问题之一就是如何获得 NBA Top Shot。你只需要浏览 NBA Top Shot 的官方网站。官方页面上有许多拍卖和交易机会。通过利用这些机会，你可以收集收藏品。


    因为显然，在不久的将来，实物收藏和数字收藏都可能获得巨大的空间。通过 `NFTs` 系统处理的令牌碎片无法以任何方式复制或复制。


    NBA Top Shot 是美国篮球协会正式授权的 `区块链` 项目。它与 `Dapper Labs` 合作创建，并构建在 `Flow blockchain`
    列之上。有作为 `NFT` 收集的 NBA Top Shots，它们专注于游戏中的短视频，其中包含特定信息，如当前比赛球员统计数据和很少被收集的赛季平均值。游戏中的瞬间可以是扣篮、哨声、制胜盖帽等形式。作为授权的
    NBA 产品，该平台得到了实质性的加强，许多收藏品以数千美元出售，有些甚至进入了六位数的区间。收藏品每周以限量包出售，并按级别分类。


    大多数游戏在 `Ethereum` 区块链上运行，但在其他网络（如 `EOS`、`Enjin`、`Loom`、`TRON`、`ONT`、`NEO`、`VeChain`
    和 `IOST`）开发的项目正在增加。区块链游戏的示例包括：


    - `Decentraland`（虚拟现实平台）

    - `Gods Unchained`

    - `My Crypto Heroes`

    - `Cheeze Wizards`

    - `Crypto Space Commander`

    - `Mythereum`

    - `Axie Infinity`

    - `HyperSnakes`

    - `EOS Dynasty`

    - `EOS Knights`

    - `Beyond the Void`

    - `CryptoZombies`

    - `Relentless`

    - `HyperDragons Go`

    - `CryptoWars`


    不可否认，区块链技术对游戏行业具有潜力。它为玩家和开发者提供了显著的改进，特别是在去中心化、透明度和互操作性方面。


