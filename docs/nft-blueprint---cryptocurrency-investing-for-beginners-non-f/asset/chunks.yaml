    ## 2.8. How to Use Rarible to Program an NFT?


    [Rarible](https://rarible.com/) is a platform you can use to buy and sell non-fungible
    tokens and turn your works into NFT. Rarible is a digital marketplace known as
    non-fungible tokens (NFT) where you can buy and sell digital assets on the Ethereum
    blockchain. Using Rarible, you can buy and sell NFT and create and market an NFT
    for yourself.


    Rarible mediated the purchase and sale of unique works as non-fungible tokens.
    You can also convert your own works to NFT and put them up for sale on the platform.
    In this guide you can find all the details about Rarible use, trading NFT in Rarible
    and creating NFT in Rarible.


    We also touched on other details you should know, such as the Rarible commission
    rate and cryptocurrency wallet usage.


    ## 2.9. Buying and selling Rarible NFTs


    To use Rarible, you first need a cryptocurrency wallet that you can use with decentralized
    applications(dApps).


    When you click the "connect wallet" button in Rarible, you can see the cryptocurrency
    wallets that you can connect to Rarible as follows.


    ￼![A picture containing graphical user interface Description automatically generated](images/image-2.png)


    For MetaMask to appear in the list, you first need to log in to MetaMask in your
    browser and then visit Rarible.


    The most popular and useful cryptocurrency wallet for using decentralized applications
    is MetaMask. Check out the guide below to set up a MetaMask wallet in your browser
    and use MetaMask:


    After installing MetaMask, you can transfer Ethereum from any cryptocurrency exchange
    you use to your Ethereum address in your MetaMask wallet.


    You need ETH to buy and sell NFT at Rarible and cover transfer fees. In this respect,
    you should send a sufficient amount of ETH to your wallet according to the transactions
    you will make.


    You can use Binance or Binance TR to buy Ethereum. You can open a commission discounted
    account in Binance and Binance TR with the following guides:


    Connect MetaMask to Rarible


    To connect your MetaMask wallet to Rarible, first log into your MetaMask wallet
    in your browser. Then visit Rarible to connect your wallet.


    You can connect your MetaMask wallet to the platform by clicking on the "connect
    wallet" button at the top right of the site.


    After clicking MetaMask, you can select your address with the notification that
    will come to your wallet and connect with the "next" and "connect" buttons.


    ￼![Graphical user interface, application Description automatically generated](images/image-3.png)


    After connecting your MetaMask wallet to Rarible with the "Connect" button, you
    must agree to the terms of use of Rarible as follows.


    You can continue by ticking where necessary and clicking on the "proceed" button.


    How to buy Rarible non-fungible tokens (NFT)?


    After connecting your MetaMask wallet to Rarible, you can discover the different
    digital assets available on the platform from the "explore" page. In addition,
    if you have any non-fungible assets in your wallet, i.e., ERC721 tokens, you can
    see them in the "my items" section.


    In the Explore section, for example, if you click on any digital asset such as
    the following, you can see the price and other information related to the NFT
    and make purchases with the "buy now" and "bid" buttons.


    ￼![Graphical user interface, text, application, chat or text message Description
    automatically generated](images/image-4.png)


    You can use the "bid" button to bid at any price. Or you can buy the NFT directly
    at the price set by the seller by clicking on the "buy now" button instead.


    Click on the "Buy now" button and a purchase page will come as follows. Here you
    can enter the quantity you want to receive in the "quantity" section. The price
    of the NFT is 0.057 ETH. In addition, Rarible receives a 2.5% commission. Therefore,
    the amount to be paid is 0.058 ETH. After clicking the "Proceed to payment" button,
    you will receive notifications in your MetaMask wallet as follows. You can make
    the purchase by clicking on the "confirm" button directly. Depending on the density
    of the network, as in the following example, the transfer fee may be very high.


    Rarible bidding


    At Rarible, you can also bid on a digital asset at any price with the "bid" button.


    After clicking on the bid button, you need to enter your bid amount as follows.
    For this process, the ETH in your wallet will be converted to WETH through the
    smart contract.


    You can also see the amount of Rarible commission added on top of your offer amount
    in the "service fee" section.


    After clicking on the "Place a bid" button, you will need to complete three steps
    in your wallet as follows to complete the bidding process.


    The first transaction will convert the ETH in your wallet to WETH. The second
    transaction will allow the smart contract to use the amount in your wallet.


    For the first two transactions, you will have to pay gas, i.e., transfer fee.
    By completing these transactions, you can bid for the NFT you are interested in.


    How to sell Rarible non-fungible tokens (NFT)?


    If you already have a non-fungible token in your wallet, you can put it on sale
    on Rarible.


    To do this, you first need to log in to MetaMask in your browser and then visit
    Rarible. You can also use the platform with other supported browsers and mobile
    cryptocurrency wallets.


    After connecting your wallet to the platform, you can see the digital assets in
    your wallet from the "my items" page or the ‘my items’ section below the user
