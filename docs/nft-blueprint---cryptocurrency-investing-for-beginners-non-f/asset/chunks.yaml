    第二个对象是协议的主体。这必须存在于智能合约环境中的对象。或者，智能合约应该对该对象拥有无障碍且直接的访问。尽管智能合约在 1996 年首次被讨论，但正是这个特定的对象阻碍了它们的发展。在
    2009 年第一种[加密货币](https://www.coinkolik.com/kripto-para-nedir/)出现后，这个问题才得到了部分解决。


    最后，任何智能合约必须包含某些条款和条件。这些条款需要在数学上被完全定义，并应该使用适用于特定智能合约环境的编程语言。这包括所有参与方的预期条款，以及针对这些条款的所有规则、奖励和惩罚。


    智能合约需要在特定的适当环境中运行才能存在并正常工作。首先，环境需要支持公钥加密的使用，这允许他们使用独特的、特殊生成的加密代码登录进程。这正是绝大多数现有加密货币所使用的系统。


    其次，需要一个开放且去中心化的数据库，合约的所有方都能完全信任它，并且它是完全自动化的。此外，为了实现智能合约，整个环境需要与中心分离。区块链，特别是以太坊区块链，是智能合约的极佳环境。


    最后，智能合约使用的数字数据源必须完全可靠。这需要使用根 SSL 安全证书、`HTTPS` 以及其他在当今大多数软件中已广泛广泛并自动应用的安全连接协议。


    ### 智能合约的优势


    智能合约提供：


    ● **自律性** – 你是合约的制定者；不需要依赖中介、律师或其他调解人来批准。顺便说一下，这也造成了被第三方操纵的危险，因为执行是由网络自动管理的，而不是由一个或多个可能存在偏见的、可能是错误的个人管理。


    ● **信任 (Guven)** – 你的文档被加密在共享账本中。没有任何能说他们丢失了。


    ● **备份** – 想象一下你的银行丢失了储蓄账户。在区块链上，你的每个朋友都是你的后盾。你的文档被反复不断地复制。


    ● **安全性** – 用于加密网站的加密技术保持了你的文档安全。没有黑客。事实上，你必须成为一个异常智能的黑客才能破解代码并渗透其中。


    ● **速度** – 你通常需要花费时间和纸张手动处理文档。智能合约使用软件代码来自动化工作，从而在各种业务流程中节省时间。


    ● **节省** – 智能合约为你节省了中介和调解人的费用。例如，你必须支付公证费来见证你的交易，但感谢智能合约，你不需要公证员。


    ● **准确性**：自动化合约不仅快速廉价，而且准确，它们防止了由于手动填写大量表格而导致的错误。


    ● **结果保障**：大多数参与交易的人诉诸法庭的原因之一是因为一个或多个个人未能遵守协议的规则和条款。但智能合约可以显著降低甚至消除诉讼需求。在使用自执行合约时，各方将始终致力于按照底层代码的规则运行。


    ### 智能合约的开发者与用户


    智能合约由计算机科学家和密码学家尼克·萨博（Nick Szabo）于 1996 年首次宣布。在过去的几年里，萨博反复审视了这一概念并发表了各种出版物；通过设计概念定义了与合同法相关的业务实践。


    然而，智能合约的实现直到 2009 年才发生；第一种加密货币`Bitcoin`最终随着区块链出现，为智能合约提供了合适的环境。有趣的是，尼克·萨博在 1998
    年设计了一种名为`Bit Gold`的去中心化数字货币机制。这从未被实施，但`Bitcoin`在 10 年后拥有许多值得自豪的特征。


    如今，智能合约大多与加密货币联系在一起。说去中心化加密货币协议没有后者就无法存在也是，主要是因为它们是具有去中心化安全和加密的智能合约。它们被广泛应用于已存在的大多数加密网络中，并且是`Ethereum`最重要且最受建议的功能之一。


    ### 智能合约 2.0


    在 2018 年，某些类型的区块链同意支持一种新类型的合约。现有的智能合约在想法上很强大，但在实践中很薄弱。当`Block.One`宣布支持`EOS`李卡第安合约时，兴趣迅速增加。


    #### 什么是李卡第安合约？第二代智能合约！


    李卡第安公约（Ricardian Convention）是由著名程序员伊恩·格里（Ian Grigg）于 1995 年提出的法律合同。这一概念现在已成为区块链的一部分。以下是基本定义：


    “它是双方之间约定的一种数字文档，包含了双方交互的条款。”


    它的独特之处在于它是经过签名、验证和加密的。即使它是数字文档，也是易于人们阅读的易文本（而不仅仅是给律师）。它是一个独特的法律合同，可以被程序读取，也可以被人类阅读。


    简单来说，它有两个部分或具有两个用途。首先，它是两个或多个当之间易于阅读的法律合同。你的律师可以轻松理解，你也可以。


    后者也是一个可以被机器读取的合约。通过区块链平台，这些协议现在可以被轻松收集、签署并保存到区块链上。


    #### 李卡第安公约：历史背景


    虽然李卡第安公约对区块链来说是新鲜的，但它是一个三十历史的概念。李卡第安公约不是 90 年代引入区块链的唯一现代术语。许多近期想法，如`智能合约`和“业务证明”，也在同一时期出现，但在区块链主流化后才实施。


    #### 伊恩·格里：李卡第安合约背后的男人


    李卡第安合约最初于 1995 年作为`Ricardo 支付系统`的一部分开发。这种新法律文档背后的人物伊恩·格里被认为是金融加密的先驱之一。有趣的是，他在开发李卡第安公约时还是一名学生。这就是为什么人们将其称为`伊恩·格里李卡第安合约`。


    1998 年，他以《七层金融加密》名为发表了关于李卡第安公约的详细著作。在他发表的文章中，他用这句话描述了李卡第安公约：


    “两个或多个双方之间经过相互加密签名和验证的数字合约，定义了交互条件。重要的是它可以同时被人类和机器读取。”


    任何阅读他作品的人都能理解他超越时代。毕竟，他开发了一个量化法律合同或任何金融工具或实体的有趣概念。然而，在 90 年代，没有适用于应用价值的技术。但在区块链技术的出现后，这种限制已不再存在。


    ### 智能合约的用途


    IBM 区块链技术副总裁杰里·库莫（Jerry Cuomo）认为智能合约可以应用于从金融服务到医疗保险的各个领域。以下是一些例子：


