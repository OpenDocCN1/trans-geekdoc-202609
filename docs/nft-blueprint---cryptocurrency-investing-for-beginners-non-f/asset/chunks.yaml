  trans: '


    Sophia 是来自汉森机器人（Hanson Robotics）的人工智能机器人，最近以 688,888 美售出了幅 NFT 肖像。Sophia 与 31
    岁的意大利数字艺术家 Andrea Bonaceto 共同创作了这件作品。Bonaceto 将艺术史元素与其个人在各种表面上的物理绘图或绘画相结合，这一过程被多次描述为“进化的迭代循环”。该艺术品包含一个名为“Sophia
    Instantiation”的 12 秒 `MP4` 文件，展示了 Bonaceto 的肖像转化为 Sophia 的数字绘画，以及一件由 Sophia 绘制的实体艺术品。


    # 千轻一代正日益投资艺术


    这对传统艺术意味着什么？这仅仅是当代艺术史上一个发生巨大变化的瞬间吗？现在的商业模式是否比以往任何时候都更趋向资本？数字艺术正在取代传统艺术吗？作为验证和认证的工具，它将很快在传统艺术市场占据一席。


    Anthony Pompliano 是一位专注于 `Bitcoin` 和数字资产的美国投资者，他自己投资 `NFT`。他将其描述为“艺术的下一次进化”。他说，数字并不是艺术的中心，也不是静态的。Pompliano
    在新闻发布播客 `The Pomp` 中说：“传统艺术挂在墙上，它很容易被摧毁。它不是数字艺术。只需点击几次即可发送给世界上任何地方。”


    加密艺术（Crypto Art）的内容与其美学一样新颖。这对于年轻的数字目标群体群体特别有吸引力。在 3 月 11 日 Beeple 的拍卖中，58% 的竞买者属于
    Y 世代（出生于 1981 年至 1996 年之间的人）。91% 的出价来自新手，而非传统拍卖行的常驻竞买者。


    根据 `UBS` 投资者观察与艺术经济学调查，`Art Basel` 和 `UBS` 2019 年的一项分析显示，千禧一代的收藏家正引领艺术市场的销售。


    归根结底，对新事物的炒作简单意味着艺术吸引所有的品味，并支持无论在何处发生的实验精神。每个时代都有自己的表达方式。新的世界观和新技术在艺术生产中一直扮演着重要角色。不同的世界和市场可以共存。我预计地区之间会有很多跨界联动。


    ## 4.3. NFT 在艺术之外的应用


    除了艺术之外，`NFT` 最流行的用途是在线游戏和体育。


    ### 游戏行业中的 NFT


    游戏领域已准备好创新并发展迅速，是开放开发新业务模式和功能的最高效领域。资产的价值（特别是在游戏行业）等同于其体验。`NFT` 为玩家创造自己的体验并从中赚钱提供了一种新方法。目前为止，所有权力都在游戏公司手中，但通过
    `NFT`，权力可以落到玩家手中。好消息，所有以玩家为中心的经济都可以通过加密货币和 `NFT` 创建。


    想知道 `NFT` 如何整合到游戏行业吗？嗯，如果我们说：“你不想拥有在游戏中只有极少数人才能获得的物品吗？”“我不让独特且极其有限的物品由玩家持有。”物品的稀缺性和游戏内的可用性是一个令人印象深刻的想法（当然，随着时间的推移，代币的成本将会增加）。你支付并购买的所有游戏物品在游戏期间都属于你。如果你选择删除游戏，你的购买也将结束，你将一无所有！


    想象一下游戏货币已演变为具有现实世界传输功能的 `NFT`。让玩家有机会以真实且正规的方式拥有自己的商品，为下一个游戏或消费创造了额外的兴奋感。它作为收藏的一部分之所以具有价值，是因为它是一种情感和文化记忆。有些东西对其他人没有那么价值，但对你来说是你的梦想。这就是
    `NFT` 给他们一个使其永生的机会。


    另一个例子：10,000 名参与游戏活动的人获得一个特殊奖励物品。游戏中不会再包含该物品的其他副本。这是什么样的想法？目前，为每个游戏内物品创建 `NFT`
    的想法可能很昂贵，而且在理论上很困难，但 `AAA` 开发者需要了解这一点并熟悉数字加密货币系统。我认为对于玩家和发行商来说，这将是一个非常有益的应用。具有独特签名的电竞物品可以分发给玩家和粉丝。从开发者和游戏粉丝的双视角来看，这对双方都是一种有利的立场！


    目前，大多数在线游戏使用中心化模型。这意味着所有相关数据都存储在服务器中。由于单家公司拥有数据库，玩家并不拥有自己的账户和物品。此外，中央服务器可能有许多漏洞。例如：

    - 技术问题导致服务器故障

    - 黑客侵入系统

    - 游戏关闭

    - 对账户的不公平封禁

    - 游戏机制缺乏透明度

    - 开发者操纵经济


    然而，得益于区块链和 `NFT`，这些可以避免。它是如何工作的？


    作为一种基于区块链的分布式数据库，它可以用于验证和保护所有类型的数字数据，如游戏历史、物品和资产。核心思想是从游戏公司手中夺回权力并还给玩家。这样，每个玩家都可以对数字资产拥有完全控制权以及买卖自由。


    ### NFT 如何影响在线游戏？


    #### 真实属性


    正如我们之前提到的，基于区块链的游戏使用户对游戏内资产拥有持久所有权完全控制成为可能。每个实体通常由独特的、可交换的代币（非同质化代币-`NFT`）代表，例如
    `ERC-721` 代币。游戏卡片、皮肤、装备和角色可以是这些资产。然而，所有资产都可以链接到分布式网络管理的区块链代币。


    #### 去中心化市场


    游戏公司拥有操纵掉率和游戏经济的权力。他们还可以让游戏内物品锁定或链接，使其不可交易。相比之下，构建在区块链网络上的游戏允许去中心化市场。这消除了玩家之间的信任需求，同时也实现了抗审查。所有玩家都可以点对点交易他们的游戏内资产。


    #### 促进游戏内购买


    `NFT` 可以显著降低交易成本并加快财务交易。它们不仅方便玩家之间（点对点），还可以方便玩家与开发者之间所有类型的支付。


    #### 游戏多元宇宙


    通过将游戏内数据和物品链接到 `NFT`，玩家可以在不同游戏之间传输。这允许玩家在体验不同游戏时重复使用数字资产。由于游戏物品使用数字代币表示，玩家可以在同一区块链上的其他游戏市场交易它们。


    #### 公平的竞争环境


    取决于应用，区块链实现了开源、分布式和透明的游戏服务器。在这种情况下，游戏的工作原理只有在大多数网络投票通过时才能被更改。区块链还防止黑客和欺诈者破坏游戏，因为没有单点故障。


    '
