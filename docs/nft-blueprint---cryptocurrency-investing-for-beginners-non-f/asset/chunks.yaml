  trans: '


    `NFT` 的缩写代表非同质化代币（non-fungible tokens），德语中为 non-replaceable token。`NFT` 是独特数字对象的证书。你证明了你拥有某个特定的文件。同质化（Fungible）本身意味着一个东西可以被等价物品替换。例如，你钱包里是一张
    20 美元钞票、四张 5 美元钞票还是 20 张 1 美元钞票并不。。


    然而，某些属性而独特的对象不是同质化的。这类对象可以以物理形式也可以以数字形式存在。对于物理对象（如绘画或汽车），很容易估值。这可以通过艺术品的独特性以及人们愿意为其支付的金额来衡量。


    对于数字对象，情况要复杂得多。毕竟，尽管有版权和使用权，每张图片、每首歌和视频都可以通过鼠标点击复制并分发。要确定一个文件的精确价值或所有者是非常困难的。这就是
    `NFT` 的起源：数字代币包含关于特定文件的信息，这些信息既是唯一的又是可验证的。区块链技术用于验证文件的真实性。


    ## NFT 与区块链


    区块链本质上是一种数据库，其中数字商品（如加密货币）的交易以块的形式存储，并分布在世界的许多计算机上。例如，`Bitcoin` 就在区块链上。它的架构使得区块链不可篡改。


    与加密货币不同，区块链中的 `NFT` 并不代表一种从一个人转移给另一个人的可交换资产，而是一个具体的资产——类似于与所有者和价值关联的独特数字艺术品。简单来说，通过将
    `NFT` 存储在区块链中，数字商品就变成了真正属于你的东西。


    目前，开源的 `Ethereum` 区块链对 `NFT` 交易最为重要。因此，虚拟购买通常用 `Ether` 处理，它是仅于 `Bitcoin` 之后价值最高的加密货币。


    ## 同质化与非同质化有什么区别？


    要理解为什么 `NFT` 如此特别，你首先需要理解同质化和非同质化之间的区别。如果某物是同质化的，意味着它是同质交换的。现实世界中的例子包括钞币或贵金属：一克纯金的价值与另一克纯金相等。如果你给某人一张十美元钞票，他们没有还回完全相同的钞票也没关系。


    当某物不是同质化时，这一切都改变了。虽然两个物品乍一看可能完全相同，但它们都具有独特的信息或特征，使得它们变得不可替代或不可交换。


    非同质化商品的一个例子可能是机票。航空机票乍一看是一样的，但每张票都包含不同的乘客姓名、不同的目的地和不同的座位号。因此，如果用其中一张机票交换另一张，可能会导致严重的后果。数字空间中的
    `NFTs` 也是如此。另一个例子是互联网域名，因为每个域名只能存在一次。


    非同质化代币可以限制数字空间中的物品并以独特的方式呈现它们。许多其他代币或加密货币（如 `Bitcoin` 或 `Ether`）是同质化的。如果你给某人一个
    `ether` 并收到一个 `ether`，你不会发现任何区别。代币也是如此：到目前为止，大多数代币都是基于 `Ethereum` 的 `ERC-20` 标准。为了简单起见，可以想象这些代币中的每一个都代表一张十美元钞票。如果你把这个代币发送给某人，并在一周后收到另一个，它和另一个是一样的。


    这一切随着非同质化代币而改变了。目前，`Ethereum` 区块链上的大多数 `NFT` 都使用所谓的 `ERC-721` 标准。使用这种标准的代币可以与宝可梦或游戏王牌收藏卡相比。每个代币都包含独特的信息和不同的稀有程度。


    还有另一个需要考虑的严重区别。同质化代币是可分的，这意味着可能发送或拥有 `Bitcoin` 或另一个 `ERC-20` 代币的分数。类似于现金，你可以用十美元钞票支付并找零。


    非同质化代币不能共享，必须完整地购买或出售。就像收藏卡一样，没有人会考虑买半张卡。


    以下是同质化物品（如现金或加密货币）不同于 `NFTs` 的独特属性。


    ## NFT 的属性


    `NFTs` 具有几个使其与一的特征。其中一些是：


    ### NFT 不可相互操作


    这意味着一个 `NFT` 不能被另一个 `NFT` 取代。因为每个 `NFT` 都是独特的。例子是游戏 `CryptoKitties`。


    ### 可验证


    所有 `NFT` 数据都存储在区块链上，可以很容易追溯到原始所有者。这使得 `NFT` 易于验证。非同质化代币可以限制数字空间中的物品并以独特的方式呈现它们。许多其他代币或加密货币（如
    `Bitcoin` 或 `Ether`）是同质化的。如果你给某人一个 `ether` 并收到一个 `ether`，你不会发现任何区别。代币也是如此：到目前为止，大多数代币都是基于
    `Ethereum` 的 `ERC-20` 标准。为了简单起见，可以想象这些代币中的每一个都代表一张十美元钞票。如果你把这个代币发送给某人，并在一周后收到另一个，它和另一个是一样的。这一切随着非同质化代币而改变了。目前，`Ethereum`
    区块链上的大多数 `NFT` 都使用所谓的 `ERC-721` 标准。使用这种标准的代币可以与宝可梦或游戏王牌收藏卡相比。每个代币都包含独特的信息和不同的稀有程度。


    ### 不可破坏


    `NFTs` 是不可破坏的，因为它们由区块链技术和智能合约驱动。区块链固有的透明性和不可变性确保了 `NFTs` 不会被破坏或复制。


    ### 不可分分


    同质化代币是可分的，这意味着可能发送或拥有 `Bitcoin` 或另一个 `ERC-20` 代币的分数。类似于现金，你可以用十美元钞票支付并找零。非同质化代币不能共享，必须完整地购买或出售。就像收藏卡一样，没有人会考虑买半张卡。


    ## NFT 的兴起


    最初在加密货币和游戏粉丝中流行的小众话题，现在已引起了领域之外的巨大兴趣。特别是在艺术界，`NFT` 交易活跃。加拿大艺术家兼歌手 `Grimes` 在 `Nifty
    Gateway` 平台上拍卖了数字艺术，在 20 分钟内收到了约六百万美元。


    著名的英国拍卖行 `Christie''s` 也加入了 `NFT` 浪潮。通过与加密艺术销售平台 `Markerspace` 合作，`Christie''s`
    正在拍卖艺术家 `Mike Winkelmann`（即 `Beeple`）的首全数字 `NFT` 作品，持续到 3 月 11 日。在拍卖结束前一天，“Everydays:
    The First 5000 Days”的最高出价已达 975 万美元。


    越来越多的音乐家和网红也在利用 `NFT` 的机会。美国乐队 `Kings of Leon` 宣布他们将以限量 `NFT` 版本发行新专辑。在德国，艺术家
    `Fynn Kliemann` 通过区块链拍卖了 100 首 `NFT` 制作的短曲，收到了约 25 万美元。


    ![这个动态图 "Nyan Cat" 现在也作为 NFT 提供。（来源：YouTube 截图 / Nyan Cat）](img/image.png)


    这个动态图 "Nyan Cat" 现在也作为 NFT 提供


    '
