  trans: '

    如果我们主要通过智能手机而非画廊和博物馆来体验艺术，这个世界会是什么样子？难道不再能够欣赏现场绘画和雕塑，无法在博物馆和画廊中漫步，并在必要时从所有角度观察它们了吗？当艺术因其尺寸、年代或主题吸引注意力时，这种体验尤其有趣。然而，这种体验如何在在线上实现在疫情期间变得清晰，例如以博物馆数字导览的形式。


    在疫情期间，全球艺术市场的销售额下降了 20%。然而，艺术品和古品的在线销售额增长了一倍。


    拍卖行 `Christie` 在 3 月首次拍卖了一幅价值`US6900 万美元`的数字艺术。这是一件数字作品：通过 `NFT` 加密，是一种不可抗拒的代币，并且具有防伪功能。特斯拉老板
    `Elon Musk` 的朋友加拿大艺术家 `Grimes` 在 2 月底以`580 万美元`的价格售出了该 `NFT`。


    对于许多人来说，艺术也随着轰动的作品以及对巨额资金支出的讨论而增长。2020 年，全球艺术市场的营业额为`US$501 亿美元`（419 亿欧元）。受疫情影响，销售额下降了
    22%——但艺术品和古品的在线销售额达到了`US$124 亿美元`的最高纪录。根据 `art Basel` 和 `UBS` 的全球艺术市场报告，这一数字与
    2019 年相比增加了一倍。


    ## NFT 接管当代艺术


    传统市场正受到 `crypto art` 的驱动。这项作品让艺术界感到不安，因为它是在一次拍卖中以数字形式出售的。密码学与数字艺术在此结合。来自 `Charleston`
    的平面设计师、计算机科学家兼导演 `Beeple` 为他创建并上传到网络的 6000 幅图像中的每一幅都提供了一个数字真实证书，即一个“不可撤销的代币”（`NFT`）。例如，`NFT`
    将 `jpeg` 转换为签名的加密文件。它变成了 `blockchain` 中一个受欺诈保护的数据记录。


    真实性在艺术中非常重要。它不仅在理想上，而且也增加了其价值。“在数字领域，‘数字稀缺性’让一件艺术品变得稀有并为其增值，”来自美国迈阿密的艺术市场专家 `Betty
    Briceño` 说道。`Blockchain` 推动了伦敦 `Sotheby''s Institute of Art` 的课程 `briceño`，该课程见证了新一代艺术爱好者。“加密艺术与
    `blockchain` 技术中金融之外的部分有关，”他说。他们的第一个项目是 `Dada.nyc` 或 `CryptoKitties`。


    根据艺术史学家的观点，这位收藏家的专家表示：“`Beeple` 的 `NFT` 作品的出售震惊了艺术界。存在许多非常有争议的讨论，但一些画廊和艺术家已经开始提供
    `NFT` 作品了。”`Crypto Art` 作为数字艺术的一个分支，与动画、交互式装置、`AI Art` 和 `KI Art` 并列。`Doms` 表示：“作为一种验证和认证的手段，`blockchain`
    将很快在传统艺术市场中占据一席。”


    结果是一种艺术的民主化。多年来在屏幕上创作艺术的艺术家获得了一个赚大钱而无需成名的机会。每个人都以相同的方式进行收藏和投资。在数字艺术博物馆和画廊之后，自
    2018 年以来存在的 `NFT` 艺术数字市场继续建立自己的地位。这些被称为 `Nifty Gateway`、生产者所在地、`Foundation`、`OpenSea`
    或 `SuperRare`。任何人可以在这里交易数字艺术。市场价值目前由需求决定，而且规模巨大。


    `Christie''s` 执行官 `Guillaume Cerutti` 在 `Beeple` 拍卖活动的新闻稿中表示：“我们很高兴能在恰恰的时间聚集了传统和数字两类收藏家：为了数字艺术创作者、为了
    `blockchain` 技术以及为了加密货币。我们在这一领域的下一个机会是非常鼓舞的。”


    加拿大艺术家 `Grimes`，特斯拉老板 `Elon Musk` 的朋友在 2 月底在 `Nifty` 售出了价值`US$580 万美元`（480 万欧元）的
    `NFT`s——数字图片、动画和视频片段。


    ## 案例研究：2021 年精选艺术 NFT


    在这个案例中，艺术不仅意味着摄影展示；还包括音乐和视频等表演艺术。以下是 2021 年上半年发行了 `NFTs` 的一些顶级艺术家。


    ### 帕丽·希尔顿：《爱之传奇》出价 110 万美元


    帕丽·希尔顿与一位名为 `Blake Kathryn` 的设计师为新的 `NFT` 销售创作了作品。该系列包含三件不同的艺术品。前两件是《我元宇宙中的蜂鸟》和《爱之传奇》。这两件产品各准备了
    11 份。虽然每个产品都是数字原创的，但制作多件此类产品导致这些作品的价格下降。这些产品以每件`$10,000`的价格出售并售罄。结果作品《爱之传奇》只准备了一份。因此，该产品没有设定固定价格，它非常有价值。相反，该拍卖产品仍在进行中。目前的最高出价为`110
    万美元`。希尔顿将凭借该产品完成最昂贵的 `NTF` 交易之一。


    ### 阿肯莱姆


    Marshall Bruce Matters，15 次格莱美奖得主，即广为人知的 `Eminem`，进入了 `NFT` 世界。这个名为 `Shady Con`
    的收藏将与 `Nifty Gateway` 合作。`NFT` 将包括定制收藏品。具有各种乐器节奏的 `NFT` 将限量供应。粉丝们需要快点了。


    `Eminem` 表示，他在准备这个收藏时受到了童年的启示。他从小就收集漫画书、棒球卡和玩具，`Eminem` 因此对收藏品有特殊的兴趣。


    “对我成年人来说，没有什么变化。我试图重新创作我生命中那个阶段的一些收藏，我知道我并不孤单。”`Nifty Gateway` 的高级制片人 `Ashley
    Ramon` 在公司平台上欢迎 `Eminem`，并强调了不同领域名人对 `NFT` 的浓厚兴趣。


    ### 贝利的遗产将通过 NFT 延续


    足球历史上最重要的人物之一贝利加入了 `NFT` 潮流。`Pelé` 在其职业球员生涯期间是三届世界杯冠军，他将把职业生涯中难忘的时刻作为 `NFT` 呈现。`Pelé`
    宣布，`NFT` 销售收益的 90%将捐给慈善机构。


    独特的代币热潮在全球范围内被广泛采用。最后，足球界的传奇巴西人 `Pelé` 宣布他将发行自己的 `NFT`。这位巴西之星职业生涯的传奇将被收集在一个 `NFT`
    集中，并于 5 月 2 日在流行的 `NFT` 平台 `Ethernity Chain` 上推出。销售收益的 90%将捐给贝利基金会（`Pelé Foundation`）。


    `Edson Arantes do Nascimento` 在足球界以 `Pelé` 闻名，成为最新一个拥抱快速发展的独特代币（`NFT`）世界的名人。根据与
    `CryptoPotato` 分享的新闻稿，这位三届世界杯冠军将在 2021 年 5 月 2 日在基于 `Blockchain` 的 `NFT` 平台 `Ethernity
    Chain` 上将其成功的职业生涯使其永恒化。


    过去曾被许多人收藏的实体经典版贝利足球卡是 `NFT`s 的灵感来源，在足球粉丝中极广受欢迎。`Ethernity Chain` 计划在今年晚些时候推出新卡片，此前是计划定于
    5 月 2 日发布的第一批 `NFT` 收藏。


    我们需要指出，`NFT` 销售收益中绝大部分的 90%将用于资助慈善机构贝利基金会。贝利基金会旨在赋能并教育全球范围内贫困中挣扎的孩子。


    `Ethernity Chain` 在与多个重大项目合作后，宣布将 `Pelé` 职业生涯的一些传奇时刻转化为 3D 收藏品，他是 20 世纪最伟大的运动员之一。


