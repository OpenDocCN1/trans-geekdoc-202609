  trans: '


    如何成为一名数字艺术交易商？就像在 DeFi 生态系统中一样，`MetaMask` 钱包可以提供帮助。同样，将自己的钱包连接到艺术品交易所 `SuperRare`
    会让你想起在 `Compound` 或其他 DeFi 平台上熟悉的流程：你必须通过 `Activity`（活动）和 `Marketplace`（市场）菜单项允许自己的钱包与
    dApp 之间建立连接，现在数字艺术投资者就可以投资某件艺术品了。虽然后者提供了作品的常规展示，但为了尽可能快地对漏做出反应，`Activity` 可能更有趣。为什么这很重要？因为大部分艺术品是通过拍卖出售的。也有你可以立即购买的艺术品。例如，上述作品“AI
    生成裸体肖像 #1”的出售价格高达 `850 ETH`。


    由于在这些艺术拍卖中可以获得一些非常廉价的交易，因此我们在这里重点关注“报价”。直接购买立即出售的艺术品其实也大同异异你只需要点击“Buy Now”（立即购买）即可。如果艺术收藏家想要报价，他必须点击“Place
    a Bid”（出价）并指定他愿意为该艺术品支付的金额。


    你愿意支付的金额实际上会被转移到一个充当托管人的智能合约中。然而，这笔钱并不会丢失（除了必要的 `gas fees`）。只要卖家还没有接受报价，投资者就可以再次撤回。这可以在你自己的个人资料中的“Offers”（报价）下完成。此功能对于增加其供应量也很重要。


    之后，是一场等待游戏开始了：艺术交易商必须等待报价被接受。


    ## 海里捞针：我如何找到值得投资的领域？


    艺术交易商的梦想是通过这些艺术品获得丰厚的利润。在这方面，除了你自己的喜好，你还可以关注以下几点：


    *   艺术家的作品稀有程度如何？不断创作新作品的人无疑也会增加供应量。这本身并不一定是坏事，但可能反映在其作品的质量上。

    *   平均售价是多少？这个指标很重要，你可以从社区对艺术家作品的接受程度中看出这一点。


    `SuperRare` 的好之处在于：所有这些都可以通过平台快速找到。上述提到的两个页面——`Activity` 和 `Marketplace`——是一个很好的起点。特别是第一个页面，还提供了关于社区活动的有趣信息。你可以在网站上找到上周的顶级收藏家和热门艺术家。如果一个艺术家在这些板块中出现了几周，那么你应该仔细观察一下。同样，你可以通过顶级收藏家查看他们是否有共同的偏好。是否有某些艺术家出现在多个顶级收藏家的收藏中？如果是，你应该更密切地关注这位艺术家。


    个人艺术家页面也包含很多启发性信息。它们可以帮助你对艺术品的金钱价值产生感觉。他发布了多少作品、作品之间的相似性以及平均售价是多少，一切都可以在这个页面上找到。


    ## 自己的艺术画廊的发展


    随着时间的推移，公司自己的数字作品收藏将会增长。无论是关于另一次销售还是“仅仅”关于展示美丽的艺术，如何继续下去的问题随之产生。当然，在 `SuperRare`
    上的自己的收藏页面上你可以看到所有购买的作品，但这显得有些单薄。因此，许多数字艺术交易商会在虚拟世界中展示他们的数字绘画。在 `Cryptovoxels`
    和 `Decentraland` 中，艺术家和艺术交易商都向公众展示了作品。


    ### C. 币安智能链中的 NFT 项目


    `Binance Smart Chain` (`BSC`) 对 NFT 的需求持续增长。它的速度和低交易费用使得该区块链对用户和开发者都非常有吸引力。


    在几个月里，智能合约和独特代币的世界见证许多发展和创新，特别是在 `Binance Smart Chain` 和 `Ethereum` 区块链。NFT 现在提供的不仅仅是数字艺术和所有权，并被广泛应用于其他场景。


    在 `BSC` 上，`Battle Pets`、`PancakeSwap` 和 `BakerySwap` 继续推向 NFT 的边界。`Battle Pets`
    和 `Bakery Swap` 都将收藏与其项目代币的去中心化金融 (`DeFi`) 质押相结合。`PancakeSwap` 也致力于结合收藏性、金融服务和游戏化的
    NFT。


    自从 `CryptoKitties` 以来，`BSC` 已成为一个项目可以利用其高性能和低费用来创新 NFT 的地方。


    从 `CryptoPunks` 到 `Axie Infinity`，有很多你可以购买、出售和交易的 `NFT`。`Ethereum` 一一直是这些最常见的地方，但现在由于其高性能和低费用，成千上万的用户和项目正在转向
    `BSC`。


    #### ⮚ BakerySwap：收藏性 NFT


    NFT 市场长期以来一直被人们买卖。在 `Trust Wallet` 等兼容钱包中存储 NFT 后，你只需要设置价格并等待买家的到来。


    虽然许多交易所对用户很友好，但很难说它们正在举办一些令人兴奋的发展。`BakerySwap` 则以以略有不同的方式运行。


    #### ⮚ Battle Pets：游戏 NFT


    NFT 与游戏的结合是另一个经典的 NFT 应用领域。


    '
