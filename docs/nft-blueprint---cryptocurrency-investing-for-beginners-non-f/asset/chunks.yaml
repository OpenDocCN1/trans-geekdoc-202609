    # Sorare 与 NFT 的对比


    NBA Top Shot 目前被认为最大的 NFT 收藏平台。然而，除了个人和基于收藏的挑战外，那里并没有真正的游戏。相比之下，Sorare 是什么？该平台提供了一种真正的竞技，关于获得特定分数并与其他玩家竞争。如果你也想花真钱来组建最佳球队，你不仅可以获胜，还能收集奖励。


    ## 如何开始？


    为了了解 Sorare，玩家可以先免费参与。那些在网站上注册的用户将获得一些免费的球员卡片以此目的。这些卡片不能出售，因此本身没有价值。然而，如果运气好的话，你可以在第一场比赛中赢得“真实”卡片，这些卡片实际上可以在转会市场上出售。此外，通过这种方式也可以轻松解答“什么是
    Sorare？”这一问题。


    总而言之，探索游戏本身的基础知识然后进入市场是非常容易的。在那里，你可以决定购买交易卡片。虽然价格是基于加密货币 `Ethereum`，但你当然也可以直接使用信用卡支付。如果你在拍卖中购买了卡片，它将作为代币进入
    `Ethereum` 区块链。新票会出售，或者你也可以从其他用户那里购买票据（如果他们正在出售）。


    ## 未来如何？


    从投资者的角度来看，Sorare 是什么？简而言之：极其有趣。2021 年 2 月，一轮融资筹集了超过 4000 万欧元。这笔资金来自知名人物，包括 Reddit
    创始人 Alexis Ohanian 和美国企业家 Gary Vaynerchuk。此外，前职业足球员 Oliver Bierhoff 和法国国际球员 Antoine
    Griezmann 也参与了。André Schürrle 和 Gerard Piqué 在之前已经进行了投资。


    Sorare 的增长很可能在接下来的几个月内真正提速。其它的，还会有更多的团队和联赛、它自己的 App，最重要的是会有来自世界各地的用户。毕竟，足球是一项全球性运动——因此
    Sorare 的潜力几乎没有局限。


    ## 4.4. 收藏级 NFT


    ### NFT 为收藏者创造了新的激励机制


    在本节中，我们将分解目前市场中（截至 2021 年 6 月）的一些顶级收藏级 NFT。


    非同质化代币有趣的地方在于其多样化的用例。例如，对于某个系列的赛季决赛，可以提供仅此一次且短时间内提供的数字对象。但即使在电子竞技活动期间，诸如动作或使用的物品等也可以作为代币提供。此外，对于乐队、流主或体育团队的商品营销，也出现了全新的可能性。除了服装或品牌产品等经典物品外，还可以提供代币化的物品。


    #### 是什么赋予了 NFT 价值？


    尽管对这个问题有许多答案，但我们可以列出 NFT 总体有价值的原因如下。


    #### 唯一性


    每一个独立的 NFT 都是独一无二的。除了具有相同的智能合约和相同的代币编号外，无法制造其他的。这意味着制造的代币是单一且独特的，不能通过任何其他方式生产或复制。这类似于
    Picasso 亲手画的《格尔尼卡》是无价的，尽管有数千份副本。这得到了区块链的确认，并且所有人都能看到。


    NFT 在制造时带有版税的。这得到了区块链的确认，并且所有人都能看到。


    #### 稀有性


    NFT 是稀有的，因为它们是独特的。除了服装或品牌产品等经典物品外，还可以提供代币化的物品。这得到了区块链的确认，并且所有人都能看到。


    #### 可销售性


    由于 NFT 是可销售的，它们允许你盈利。这得到了区块链的确认，并且所有人都能看到。


    以下是 2021 年最流行的收藏级 NFT：


    ##### CryptoKitties


    [CryptoKitties](https://www.cryptokitties.co/) 于 2017 年 11 月 23 日发布。该区块链游戏背后的开发者是风险投资工作室
    Axiom Zen。


    ##### CryptoKitties: 概念


    CryptoKitties 为连接到区块链网络的玩家提供了一个具有多种可能的通用游戏概念。重点是猫的育种，它们的外观和性格特征具有极大的多样性。


    '
