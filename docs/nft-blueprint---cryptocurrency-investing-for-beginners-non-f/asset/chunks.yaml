- raw: 'Of course, in the end, it is up to each user to protect their own account
    in the best possible way. Here, as with bank accounts, it is not important to
    pass on data such as seed phrases or passwords to third parties and to store the
    seed phrase in a place accessible only to the user. Thus, everyone can contribute
    to making their own account as secure as possible.


    The MetaMask Wallet itself has never been the target of hacker attacks in its
    long runtime. Even in relevant forums, there is never any talk of unfair methods
    of the provider – and this with millions of active users. These are all good reasons
    to suggest that ConsenSys and the MetaMask Wallet are a trusted provider.


    MetaMask Customer Service


    MetaMask customer service is friendly, competent and responded promptly to all
    inquiries we made. However, there are also some limitations that we will discuss
    in more detail in this section.


    First of all, there are several ways to independently inform yourself about MetaMask,
    even before you even need to use the customer service. In addition to the rich
    FAQ section, there is also the MetaMask Docs, a kind of Wikipedia for the provider,
    in which interested parties can go into more detail and learn everything worth
    knowing about the provider. As a further alternative, you can search for the respective
    answer in the community forum.


    In addition, users can of course also contact the provider directly. But here,
    unfortunately, it is only possible to contact the customer service of Meta Mask
    Wallet with a registration form. For most questions, this is not a problem, but
    we would have liked at least a live chat support, so that there could be a contact
    person immediately in case of burning problem. We hope that these issues will
    be fixed in the future so that users can achieve the best and fastest customer
    service a wallet has to offer.


    Pros and Cons by MetaMask


    If you are looking for a trustworthy Ethereum wallet, you do not need to search
    further. MetaMask offers a number of advantages that distinguish the wallet from
    other providers and make stand out from the crowd. First of all, in addition to
    the high security standards, there are also the low costs, which, in addition
    to the variable gas prices, are located at 0.3% to 0.875% of the transaction.
    In addition, MetaMask makes it possible to access many other dApps.


    The abundance of features and the fact that MetaMask offers not only professionals
    but also beginners a great introduction to the Ethereum ecosystem thanks to the
    intuitive menu navigation is what makes MetaMask so special. It is not for nothing
    that the wallet is part of the gold standard when it comes to Ethereum wallets.
    Millions of users from all over the world are convinced of the advantages.


    In addition to the advantages, it is of course important to note that the MetaMask
    Wallet cannot be used for all tokens. Since it is a pure Ethereum wallet, the
    selection of tokens to be stored is rather limited here. Tokens supported by MetaMask
    include:


    ●Ethereum (ETH)


    ●Ethereum Classic (ETC)


    ●Tether (USDT)


    ●Basic Attention Token (BAT)


    ●USD Coin (USDC)


    ●All other ERC 20 tokens


    Advantages


    ●Ethereum wallet for the browser and smartphone


    ●Low and variable fees


    ●High safety standards


    ●Access to other decentralized apps (dApps)


    ●Many advanced features


    ●Easy and intuitive menu navigation


    Disadvantages


    ●Limited selection of tokens


    A better alternative to the MetaMask Wallet?


    With high security standards, low costs and rich, advanced features, the MetaMask
    Wallet is certainly one of the best Ethereum wallets on the market, for which
    there is hardly a comparable alternative in this form.


    Nevertheless, we recommend all users who hold a large number of Ethereum and do
    not want to spend it in the near future to switch to a hardware wallet, as this
    is where the security measures are greatest. For all other users, a hot wallet
    like MetaMask is completely sufficient and can convince with high security standards
    and an intuitive user interface.


    ### What is a DAPP?


    A DAPP is nothing more than a special form of an app. These are based on a blockchain,
    are open source and decentralized and must be able to generate their own tokens.
    Such a token is, for example, the Bitcoin, the DAPP behind it, is the Bitcoin
    network. The big advantage is that no company controls all functions, but that
    the open-source community continues to improve the DAPP.


    There are three different types of DAPPs. On the one hand, there are Type 1 DAPPs
    that operate their own blockchain, such as the Bitcoin network. Now there are
    other DAPPs that rely on the blockchain of this Bitcoin network. Such DAPPs are
    called Type2. The third type is again based on type 2 DAPPs. Microsoft Azure,
    for example, is a Type2 DAPP that is based on the Ethereum blockchain. The company
    offers an infrastructure that is used by Type 3 DAPPs, in this case, for example
    Absolut or Heineken.


    So, you can see that even if the Type1 DAPPs are decentralized and based on a
    blockchain, companies with Type2 or Type3 DAPPs can benefit from this. This creates
    entire networks, which explains why the systems behind the cryptocurrencies are
    becoming more and more important.


    Apps and DAPPs – The Differences


    Apps and DAPPs may seem relatively similar to the newcomer at first glance. Nevertheless,
    there are glaring differences, which will be discussed in more detail here. Apps
    are mostly released by companies that have full control over all the features
    of the respective app. For example, as a user, you can have no influence on google
    changing its YouTube app so that adblockers no longer work.


    DAPPs, on the other hand, are open source. This means that the source code is
    visible to everyone and can therefore be changed at will. If you want to redesign
    a DAPP according to your own wishes and bring the necessary know-how with you,
    you can change the source code and create your own DAPP variant.


    Another difference is that DAPPs are always based on a blockchain and are stored
    in decentralised locations. Therefore, it is almost impossible to hack a DAPP,
    since one would have to attack the entire blockchain behind it, including all
    networked computers, at the same time in order to change the structure of the
    DAPP. An app, on the other hand, is usually supported by the respective company''s
    own servers. Here you would "only" have to hack the one datacenter to bring the
    respective app under his control.


    In summary, it can be said that DAPPs are both safer and freer in their development,
    as no company controls them centrally. Apps, on the other hand, are clearly owned
    by a company that has full control. Also, the source code is not publicly visible
    here, so you do not get to see the structure of the respective app without further
    ado.


    How are DAPPs Defined?


    The community has agreed on a clear definition of the DAPP. First, DAPPs are not
    issued and maintained by a single provider. A DAPP runs distributed and decentralized
    over a peer-to-peer network. In addition, four criteria must be met that an application
    can be called a DAPP. It first must be the source code of a DAPP open source.
    Furthermore, it must be based on a blockchain, have cryptographic encryption and
    be able to generate its own tokens. Only if all these criteria are met can we
    speak of a DAPP.


    ●Open Source


    The fact that a DAPP is open source does not mean that every programmer can simply
    decide for himself what the DAPP should look like after its own changes in the
    future. Rather, the community decides which modifications are accepted and which
    are not. Nevertheless, the source code remains visible to everyone, so that every
    developer knows exactly what the current state of affairs is. The fact that a
    DAPP is open source ensures continuous development. No individual administrator
    or even a company sets the future direction, but the further development of the
    DAPP is controlled by the entire developer community together.'
