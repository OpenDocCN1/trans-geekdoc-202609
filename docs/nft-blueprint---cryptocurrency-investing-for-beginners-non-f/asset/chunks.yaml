  trans: '

    创世卡（Genesis cards）目前通过浏览器购买，但游戏可以作为桌面应用运行。开发者还在考虑随着时间的推移，将游戏整合到移动设备和平板电脑。卡包也将可以通过
    `Coinbase Wallet` 购买，这是由 Coinbase 提供的移动浏览器和钱包服务，而 Coinbase 是 Gods Unchained 的投资者之一。


    目前出售的每个包包含 5 张创世卡，总计有 380 张卡。在预售期间购买卡的用户还将获得 Beta 版本的访问权限。这些创世卡中的每一张实际上都是使用 `ERC-721`
    协议创建的非同质化代币。


    ## 区块链给游戏带来了什么变化？


    正如我们大多数人所知，传统游戏完全由创建它们的公司驱动。尽管玩家认为他们拥有珍贵的资产（角色、物品等），并在游戏中对其花费了大量时间，但这种所有权状态和资产价值可能会随着开发者的一个简单决定而改变。


    凭借区块链带来的交易不可篡改记录、所有权验证和历史交易追踪等许多优势，玩家将能够像在现实生活中一样拥有资产。


    ## 如何玩 Gods Unchained？


    在 Gods Unchained 中，你与其他玩家或电脑进行一对一战斗。游戏的目标是通过将对方的生命值降至零来获胜。在每场战斗开始时，玩家从自己的收藏中选择
    30 张卡和一位神灵共同战斗。


    游戏完全免费，用户在输掉游戏时不会丢失任何卡。卡牌可以属于不同的类别，例如生物、武器、魔法或特殊神卡，玩家还拥有神力（God power），可以在自己的回合中使用一次。


    Gods Unchained 背后的整个理念是，游戏不必是无聊的消遣，也可以成为一种投资案例。像《魔法风术牌》（Magic the Gathering）这样的游戏，其门票售价数万美元，就是实现这一目标的方式。这类数字游戏也存在于
    NFT 的基础上。


    集换卡牌游戏吸引许多许多。推测，这是游戏与投资案例之间迷人的结合：你是否真的应该将一张 Alpha 版本的[黑莲花](https://www.cardmarket.com/en/Magic/Products/Singles/Alpha/Black-Lotus)
    换成国际版的[溯源记忆](https://www.cardmarket.com/en/Magic/Products/Singles/International-Edition/Ancestral-Recall)？这很大程度上取决于你是从投资角度还是战略角度来看待这个问题。尽管黑莲花的价值几乎是后者的十倍，但对于你自己的蓝色牌组来说，拥有一个溯源记忆可能更有意义。如果你仍然意识到《魔法风术牌》及此类游戏的极其复杂性，也难怪这类游戏要么转移到了数字时代——看看《炉石传说》——要么被完全重新创造。


    这类集换卡牌游戏还可以建立通往加密货币的桥梁：`MTGox`（已倒闭）最初被计划为交易卡牌的交易交易所。随着 `MTGox` 的倒闭，这座桥梁暂时被拆除，但通过
    CryptoKitties 等项目得以重建。


    诚然，对于 CryptoKitties 就可以讨论投资案例了，但我们希望在本期节目中通过“非同质化代币”这一投资案例来查看其他游戏。相反，我们将 Gods
    Unchained 视为一个基于 NFT 的游戏示例。我们在关于区块链游戏的系列中已经简要地观察过这款游戏，但在这里我们关注的不是游戏，而是投资案例。


    ## 投资者应该注意什么？


    一旦卡包再次上市，你应该密切关注公告：是否会再次推出创世阶段发布的神话卡牌（Mythical Cards）之类的物品？这些极稀有的卡牌在市场上获得了非常好的价格。如果有这样的卡牌，你应该仔细观察它们在新包中是如何分发的。神话卡牌是不分卡包类型分发的。因此，机会很大。

    '
