- raw: 'When the game exists on a central server, developers can opt out of the project
    or close the game at any time. With blockchain, players can continue playing even
    if developers leave the project. As long as the blockchain continues to work,
    the game remains alive. In some cases, new developers inherit the project to make
    improvements to the project.


    Limitations of NFTs in Gaming


    Although blockchain technology opens a whole new horizon for the gaming world,
    there are still some limitations that this technology must overcome. These limitations
    include:


    ●Scalability. Blockchains are often much slower than centralized networks, which
    can prevent the adoption of games on a global scale.


    ●Lack of use. Although hundreds of blockchain games are available, demand is still
    very low. Many games have very few users.


    ●Centralization. Not all blockchain-based games are completely decentralized.
    Some of them use ERC-721 or other blockchain tokens, but actually work through
    a central server.


    ●It''s simplicity. While there are some exceptions, most blockchain games are
    too simple to appeal to players who care about high-quality graphics or high-end
    gaming experience.


    ●It''s competition. Blockchain games are usually developed by small, independent
    groups (indie games). These teams may struggle to compete with the world''s giant
    gaming companies.


    Fortunately, various solutions to these limitations are being developed. Several
    teams are already working with Ethereum Plasma, Lightning Network, and other 2nd-party
    teams to solve scalability issues. He''s working on layer solutions.


