    ## 6 NFTs and Popular Blockchain Integrations


    For NFT minting, you have different blockchains to choose from. The Ethereum network
    is the first major blockchain to enable the creation of NFTs as we know today.
    Later, other blockchains were added, including Binance Smart Chain, Polkadot and
    Tezos. Most NFTs today are either on Ethereum or BSC. However, the gas charges
    on Ethereum make the creation and handling of NFTs relatively expensive.


    ## 6.1 NFTs and Ethereum


    When it comes to NFTs, Ethereum dwarfs almost every other blockchain network.
    NFTs have become much more present in the media in recent months. Headlines such
    as Jack Dorsey''s tweet or the sale of Beeple bring NFTs closer to a wider audience.
    This often gives the impression that NFTs are a completely new phenomenon. But
    the history of blockchain-based NFTs can already boast several years. The first
    NFT experiments were already running in 2012 with coloured coins on the Bitcoin
    blockchain. Ethereum is currently the largest smart contract blockchain. Even
    with NFTs, Ethereum has clearly been ahead since 2017 until today. Whether punks
    or CryptoKitties, all of them as well as most marketplaces are part of the huge
    world on Ethereum.


    ### Token Standards


    All tokens on Ethereum, whether cryptocurrencies or NFTs, can be assigned to unique
    standards. Standards are an important building block for how tokens work. Only
    with suitable standards are essential characteristics such as ownership, access
    and transferability guaranteed. Standards are also essential for software development.
    In this way, the basic functionalities and behaviours are clear to all those involved.


    The three most common Ethereum standards are `ERC20` for Fungible Tokens (exchangeable
    tokens such as cryptocurrencies) and `ERC721`, as well as `ERC1155` for Non-Fungible
    Tokens (NFTs). The `ERC20` standard assigns amounts to addresses. Thus, per Ethereum
    address, the exact number of cryptocurrencies held can always be recognized.


    With the birth of CryptoKitties, the important NFT standard `ERC721` was created,
    on which most NFTs are based to this day. `ERC1155` is another NFT standard developed
    by Enjin. `ERC1155` is a hybrid of exchangeable and non-interchangeable tokens.
    `ERC721` maps unique IDs to owners, while `ERC1155` has a nested mapping of IDs
    to sets.


    ### NFT Premiere on Ethereum: Crypto Punks


    It was only with the Ethereum blockchain that NFTs really picked up speed. The
    first Ethereum NFTs appeared as Crypto Punks in the summer of 2017.


    Crypto Punks are 10,000 unique digital characters created by Larva Labs (https://www.larvalabs.com/cryptopunks).
    Their digital proofs of ownership are stored in the form of unique tokens on the
    Ethereum blockchain. Each Crypto Punk is characterized by individual optical characteristics,
    so that no one is the same as the other. Crypto punks have inspired the digital
    art market and were the forerunner for later standards. Due to the limited offer
    and the cult status among early users, they are already considered digital antiques.
    They are still tradable and interoperable with most NFT applications on Ethereum.


    ### 2017: Birth of CryptoKitties


    Even though Crypto Punks were officially the first NFTs on the Ethereum blockchain,
    the CryptoKitties are still in the memory of most people. At the end of 2017,
    they became the first mainstream application of NFTs.


    2017 was a year with a lot of hype around cryptocurrencies, anyway, driven by
    the ICO bubble on the Ethereum platform. In a short time, countless new ICO projects
    started and each of them had new and supposedly scarce tokens on offer. This triggered
    a veritable gold dig mood. More and more new cryptocurrencies on the Ethereum
    blockchain saw the light of day in the digital world. It wasn''t long before there
    was an increase in network congestion, with significantly increased transaction
    fees as a result. But one of the reasons for the high utilization was, among other
    things, the creation and trading with CryptoKitties. CryptoKitties (https://www.cryptokitties.co/)
    are digital images of comic cats created by Dapper Labs for a blockchain computer
    game. Each cat is unique and thus only present once on the blockchain. The special
    thing about them is that in the on-chain computer game, new unique CryptoKitties
    can be bred by clubs of different cats. These new cats could then be auctioned
    off or sold on the open market.


    The CryptoKitties Bubble


    Breeding attracted many speculators. The idea was simple – you buy a few CryptoKitties,
    breed a few new, even rarer cats with them, sell them at high prices and then
    do the whole thing over again. At its peak in 2017, the trading volume was around
    5000 ETH and sales of CryptoKitties achieved prices of over $100,000.


    It was almost absurd to pay such high prices for digital cats.

