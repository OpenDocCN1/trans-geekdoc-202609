  trans: '


    使用 MetaMask，可以轻松地存储令牌、发送令牌以及相互相互兑换。通过兑换（swaps），MetaMask 用户可以在交易时获得市场上最便宜的价格——交易费用相对较低，最高仅为交易额的
    0.875%。同时，MetaMask 以提供最安全且最简单的服务为荣，使用户可以轻松使用其他基于区块链的去中心化应用程序（dApps）——即使没有相关知识。


    因此，该提供商将自己描述为“加密钱包和区块链应用的网关”：在这里，用户可以获得大量的创新的去中心化应用。具体而言，这意味着 MetaMask 不仅仅是一个商用钱包。因此，MetaMask
    的功能可以大致分为三个领域：


    - 用于存储、发送、接收和兑换令牌的以太坊钱包

    - 访问创新 dApps 的手段

    - 一个提供更高安全性和匿名性的应用程序


    # 如何设置 MetaMask 钱包？


    如果你已经想使用 MetaMask 钱包，可以在几分钟内完成登录。在下文中，我们将通过三个步骤详细说明如何在所有操作系统上快速方便地下载和设置钱包。虽然在接下来的章节中我们将更多地关注浏览器版本，但在下文中我们将详细介绍不同操作系统之间的差异。


    ## 第一步：下载 MetaMask


    在第一步中，最好访问[提供商的网站。](https://metamask.io/) 在这里有所有关于如何使用 MetaMask 的选择。此外，你也可以直接从
    `Google Play` 等外部商店下载应用程序或插件。但是，对于插件，必须务必绝对确保你在相应的商店中下载的是原始版本。例如，如果你在浏览器中寻找 MetaMask
    Firefox 插件，只需点击菜单栏中的“插件”，并在搜索栏中输入提供商名称。如果你随后决定添加 MetaMask，插件就会被下载。


    ## 第二步：MetaMask 登录


    成功下载后，只需接受隐私政策并创建一个所谓的“密助备份短语（Secret Backup Phrase）”即可。此备用短语应该记录下来并存储在安全的地方。这确保了在设备丢失或其他发生意外的情况下，你的货币可以被恢复。因此，这一步应该严谨完成，并确实确保操作过程中不会出现任何疏忽。


    ## 第三步：整合钱包并购买以太坊


    一旦在下一步中确认了短语，大部分流程已经完成。随着钱包的建立，现在可以购买以太坊或其他 `ERC 20` 代币了。当然，也可以只需点击几次轻松地将现有的以太坊钱包导入
    MetaMask 钱包。要做到这一点，只需点击“导入钱包”并在随后的窗口中导入钱包。使用 MetaMask 的浏览器版本，甚至可以连接硬件钱包（`Ledger`
    或 `Trezor`）。为此，只需点击“连接硬件钱包”并然后按照指示操作即可。


    # MetaMask 功能


    ### 兼容性


    MetaMask 钱包适用于多个平台、多种浏览器和操作系统。桌面端用户在适用于 MetaMask Firefox、`Google Chrome`、`Edge`
    和 `Brave` 的浏览器插件之间有多种选择，而移动端用户可以下载适用于 `iOS` 和 `Android` 的 MetaMask 钱包。当然，也可以将用户账户与多个应用程序和浏览器连接，这样就可以在家里或在途中舒适地访问账户，用户始终拥有完整的概览。


    ### 移动端与桌面端安装


    如前所述，MetaMask 钱包有多种用法。用户可以在各种浏览器插件或移动版本之间进行选择。所有版本的安装都非常简单，且各版本之间略有不同。因此，下文中我们将详细介绍设置中的各自差异。


    #### 使用 MetaMask Firefox、Google Chrome、Edge 和 Brave 进行桌面端安装


    对于桌面端，MetaMask 并不是作为一个独立的程序提供的，而是作为 MetaMask `Chrome`、MetaMask `Firefox`、`Edge`
    和 `Brave` 的浏览器插件。要进行设置，用户只需访问 MetaMask 网站然后进入下载区域。在这里你可以在不同版本之间选择，并被重定向到相应的商店，在那里只需点击即可下载插件。或者，也可以直接在浏览器商店中搜索插件。在这里必须务必绝对明确它是原始钱包——因此，通过提供商侧的方式是最安全的。


    #### 使用 iOS 和 Android 进行移动端安装


    MetaMask `Android` 和 `iOS` 已经可用一段时间了，这意味着智能手机用户现在也可以享受 MetaMask 钱包。要下载应用程序，用户也可以访问网站的下载区域。或者，用户也可以在
    `Google Play` 或 `Apple Store` 中搜索该钱包。钱包可以与浏览器插件进行同步。


    # MetaMask 钱包类型


    ### 桌面端/在线钱包


    MetaMask 仅以在线钱包的形式提供。用户有多个选项可以选择。原始版本由浏览器插件组成，现在已适用于 `Google Chrome`、`Firefox`、`Edge`
    和 `Brave`。根据系统的不同，版本之间的功能可能有所差异。例如，硬件钱包的使用（我们将在下文中详细讨论）仅通过浏览器插件是可能的，而移动应用则不行。


    ### 在哪里下载 MetaMask 钱包？


    可以从提供商的网站轻松下载 MetaMask 钱包。在网站上，提供了所有浏览器版本和操作系统的钱包供用户使用。此外，也可以直接从外部商店下载版本。我们的 Firefox
    体验：如果你在 Firefox 中搜索相应的插件，可以点击菜单栏中的“插件”，并在搜索栏中输入“MetaMask”。用户即可添加 MetaMask 钱包。


    ### MetaMask 费用


    在详细介绍费用之前，有必要区分 MetaMask 的网络费用和钱包费用。以太坊网络对交易收取所谓的“燃料费（gas）”费用：费用以“燃料”的形式支付，而燃料通过
    `ETH` 支付。还应该注意，交易导出者无论交易是否成功都必须支付费用。


    MetaMask 钱包允许用户从预设选择中选择燃料价格。适用规则是：价格越低，相应的交易所需的时间越长。或者，甚至可以手动设置自定义交易费用和限制。但是，对于尚不熟悉定价初学者，建议选择预设费用。用户随后可以点击“保存”启动交易。MetaMask
    交易费用为交易额的 0.3% – 0.875%，并已在报价中显示。


    ### 安全


    MetaMask 设定了高安全标准，使其成为最好的热钱包之一。提供商 `ConsenSys` 保证，种子短语、密码和私钥均经过加密并仅存储在终端设备上。此外，还引入了指纹或面部识别等安全功能，这使得未经授权的访问变得更加困难。


