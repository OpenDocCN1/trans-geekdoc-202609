    ### March 2017 – Rare Pepes on Ethereum


    With `Ethereum` coming to the fore in early 2017, memes began trading there. In
    March 2017, it was announced that a project called `Peperium` was "a decentralized
    meme market and trading card game (TCG)" that allows everyone to create memes
    that live forever in `IPFS` and `Ethereum`. Similar to `Counterparty`, `Peperium`
    also had a token associated with rare''s ticker symbol, which is used to pay breast
    creation and listing fees.


    ### June 2017 – Cryptopunks


    It wasn''t until the `Ethereum` Blockchain that NFTs really picked up speed. The
    first `Ethereum` NFTs appeared as `Crypto Punks` in summer 2017. `Crypto Punks`
    are 10,000 unique digital characters created by [`Larvalabs.](https://www.larvalabs.com/cryptopunks).
    Your digital property records are stored in the form of unique tokens on the `Ethereum`
    blockchain. Each `Crypto Punk` has individual optical properties, so that no one
    is the same. `Crypto punks` inspired the digital art market and were the forerunners
    for later standards. Due to the limited offer and the cult status of early users,
    they are already considered digital antiques. They are still tradable and interoperable
    with most NFT applications on `Ethereum`.


    As the trade of rare peps in `Ethereum` increased rapidly, two "creative technologists"
    decided to create their own NFT projects with a slight twist. `John Watkinson`
    and `Matt Hall` realized that they could create unique characters created on the
    `Ethereum` blockchain. Characters will be limited to 10,000 and the two characters
    will not be the same. In reference to the `Cypherpunks` who experimented with
    bitcoin''s pioneers in the 1990s, they named their project `Cryptopunks`.


    Surprisingly, `Watkinson` and `Hall` chose to allow anyone with an `Ethereum`
    wallet to request `Cryptopunk` for free. All 10,000 `Cryptopunks` were quickly
    requested, launching a thriving secondary market where people bought and sold
    them. Interestingly enough, `Cryptopunks` does not follow the `ERC721` standard
    as it has not yet been invented, but due to its limitations they were not entirely
    `ERC20`. Therefore, `Cryptopunks` can best be described as `ERC721` and `ERC20`
    hybrid.


    ### October 2017 – Birth of CryptoKitties


    With `CryptoKitties`, NFT''s have reached the mainstream. `CryptoKitties` is a
    blockchain-based virtual game that allows players to adopt, grow, and trade virtual
    cats. Cats on the blockchain!


    Although `Crypto Punks` were officially the first NFTs on the `Ethereum` blockchain,
    most of the `CryptoKitties` are still in the memory. At the end of 2017, they
    became the first mainstream application of NFTs.


    2017 was already a year of hype around cryptocurrencies, driven by the ICO bubble
    on the `Ethereum` platform. In a short time, countless new ICO projects started
    and each of them had new and supposedly scarce tokens on offer. This triggered
    a veritable gold mine.


    ### CryptoKitties Bubble


    Breeding has attracted many speculators. The idea was simple: you buy some `CryptoKitties`,
    breed them, just as they would in real life. Within a few weeks of launching in
    2017, about $20 million was spent on them. But the collectibles market is not
    limited in any way, as it extends in different directions.


    CryptoKitties are great examples of NFT collectibles. `CryptoKitties` are digital
    cats on the `Ethereum` blockchain. The idea behind this NFT is to enable buyers
    to nurture these kitties and reproduce, just as they would in real life. Another
    excellent example of the usefulness of NFTs involves art collecting. Experts can
    verify and authenticate paintings and sculptures before creating a non-fungible
    token for each piece of art.


    This incredible project was apparently featured on every news station from `CoinDesk`
    to `CNN`. Perhaps this was because the game blocked and slowed down the `Ethereum`
    blockchain, or people made crazy profits in trading. Some virtual cats even sold
    for over $100,000.


    ### 2018–2019 – NFT Cambrian Explosion


    2018 and 2019 saw tremendous growth in the NFT ecosystem. There are now more than
    100 projects within the venue and more in the works. The NFT markets, led by `OpenSea`
    and `SuperRare`, are growing. Trading volumes are small compared to other crypto
    markets, but they are growing rapidly and have come a long way. As Web3 wallets
    like `Metamask` continue to evolve, it becomes easier to get involved in the NFT
    ecosystem. `Dapper Labs` recently launched a `Dapper wallet` that doesn''t require
    gas payments.

    '
  trans: '


    Spells of Genesis 的游戏创造者不仅是先驱，而且是首批通过 `Counterparty` 发起 ICO 将游戏资产发布到区块链上的团队之一。事实上，早期的
    ICO 后来被称为众筹。Spells of Genesis 通过发行一种名为 `BitCrystals` 的代币来筹集开发资金，该代币被用游戏货币。


    ### 2016 年 8 月 —— 另一端的更多卡牌


    2016 年 8 月，`Counterparty` 与热门集牌卡游戏《力量之地》（Force of Will）合作，在 `Counterparty` 平台上推出了了其卡牌。《Force
    of Will》是北美销量的第四大卡牌游戏，仅次于《宝可梦》、《火影忍者》和《魔法禁旅》。它们进入生态系统的做法预示了将此类资产放入区块链的价值。


    ### 2016 年 10 月 —— 另一端的 Rare Pepe


    2016 年 10 月，人们开始在 `Counterparty` 平台上提取“稀有青蛙”作为一种存在。`Rare pepe` 是一种包含这种青蛙角色的模因。它们拥有庞大的粉丝群体。甚至还有一种被称为
    `Rare Pepe Breast Index` 的乳房替代品。


    似乎在比特币区块链上还还不够，`Rare Pepe Breast Index` 还有“专家”确认 pepe 迷因是稀有的。抛开奇特性不谈，这个例子展示了人们想要独特数字元素的时间点。今天，`Counterparty`
    在其平台上构建了大量项目，其中许多包含类似 NFT 的资产。点击此处查看另一边的各种项目。


    ### 2017 年 3 月 —— 以太坊上的 Rare Pepes


    随着 `Ethereum` 在 2017 年初脱颖而出，迷因开始在上面交易。2017 年 3 月，一个名为 `Peperium` 的项目被宣布为“去中心化的迷因市场和集牌卡游戏
    (TCG)”，它允许每个人创建存储在 `IPFS` 和 `Ethereum` 中永远存在的迷因。与 `Counterparty` 类似，`Peperium`
    也有与稀有性符号相关的代币，用于支付创建和列出费用。


    ### 2017 年 6 月 —— Cryptopunks


    直到 `Ethereum` 区块链出现，NFT 才真正开始提速。第一批 `Ethereum` NFT 在 2017 年夏天作为 `Crypto Punks`
    出现。`Crypto Punks` 是由 [`Larvalabs.](https://www.larvalabs.com/cryptopunks) 创建的
    10,000 个独特的数字角色。你的数字财产记录以独特代币的形式存储在 `Ethereum` 区块链上。每个 `Crypto Punk` 都有独立的视觉属性，因此没有是相同的。`Crypto
    punks` 启发了数字艺术市场，并是后期标准的先驱。由于供应有限和早期用户的崇拜地位，它们已经被视为数字古董。它们仍然可以交易，并与 `Ethereum`
    上的大多数 NFT 应用具有互操作性。


    随着 `Ethereum` 上稀有青蛙交易的快速增加，两位“创意技术人员”决定带一点小转折创建他们自己的 NFT 项目。`John Watkinson` 和
    `Matt Hall` 意识到他们可以在 `Ethereum` 区块链上创建独特的角色。角色将限制在 10,000 个，且这两个角色将不相同。参考 20 世纪
    90 年代与比特币先驱一起实验的 `Cypherpunks`，他们将项目命名为 `Cryptopunks`。


    惊讶的是，`Watkinson` 和 `Hall` 选择允许任何拥有 `Ethereum` 钱包的人免费申请 `Cryptopunk`。所有 10,000
    个 `Cryptopunks` 很快被领完，启动了一个繁荣的二级市场，人们在那里买卖它们。有趣的是，`Cryptopunks` 没有遵循 `ERC721`
    标准，因为该标准尚未被发明，但由于其局限性，它们也不完全是 `ERC20`。因此，`Cryptopunks` 最好的描述是 `ERC721` 和 `ERC20`
    的混合体。


    ### 2017 年 10 月 —— CryptoKies 的诞生


    随着 `CryptoKies`，NFT 已经了主流。`CryptoKies` 是一个基于区块链的游戏，允许玩家领养、成长和交易虚拟猫。区块链上的猫！


    尽管 `Crypto Punks` 是 `Ethereum` 区块链上的第一批 NFT，但大多数 `CryptoKies` 仍然留在记忆中。在 2017 年底，它们成为了
    NFT 的第一个应用。


    2017 年已经是加密货币炒作的一年，受 `Ethereum` 平台 ICO 泡沫的推动。在短时间内，无数新的 ICO 项目启动，每个项目都有新的且稀有的代币供应。这引发了一个真正的金矿。


    ### CryptoKies 泡沫


    繁殖吸引了许多投机者。这个想法很简单：你购买一些 `CryptoKies`，像在现实生活中一样让它们繁殖。在 2017 年发布后的几周内，大约有 2000
    万美元投入其中。但收藏品市场没有任何限制，它正向不同的方向扩展。


    CryptoKies 是 NFT 收藏品的绝佳案例。`CryptoKies` 是 `Ethereum` 区块链上的数字猫。这个 NFT 背后的想法是让买家能够养这些猫咪并繁殖，就像在现实生活中一样。NFT
    用的另一个极佳例子是艺术收藏。专家可以在为每件艺术品创建非同质化代币之前进行验证。这个不可思议的项目显然出现在从 `CoinDesk` 到 `CNN` 的每个新闻频道上。也许是因为这个游戏阻塞并减慢了
    `Ethereum` 区块链，或者人们在交易中获得了惊人的利润。某些虚拟猫甚至卖了超过 10 万美元。


    ### 2018–2019 —— NFT 寒武纪爆发


    2018 年和 2019 年，NFT 生态系统经历了巨大的增长。现在该领域有超过 100 个项目，还有更多在进行中。以 `OpenSea` 和 `SuperRare`
    为首的 NFT 市场正在增长。与其他加密市场相比，交易量较小，但它们正在快速增长并已经走了很远。随着 `Metamask` 等 Web3 钱包的不断进化，参与
    NFT 生态系统变得更容易。`Dapper Labs` 最近推出了一个不需要 Gas 费的 `Dapper wallet`。


    '
