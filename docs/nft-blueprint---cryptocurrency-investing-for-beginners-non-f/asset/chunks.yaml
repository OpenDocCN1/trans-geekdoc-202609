- raw: '1.  Atomicity = atomicity stands for seclusion in transactions


    1.  Consistency = Consistency means that a transaction leaves a persistent database
    state


    1.  Isolation = isolation prevents or restricts transactions from affecting each
    other during execution


    1.  Durability = durability guarantees the permanent storage of transactions in
    the database


    In German also referred to as ACID properties, these four criteria are considered
    prerequisites for the reliability of systems.


    This makes it possible for each blockchain developer to build on each other''s
    code and therefore develop completely new products and services at a rapid pace.
    Technically, this is composability.


