- raw: 'Within the ecosystem, players can build teams and groups in Adventure mode
    (PvE – player against the environment) to fight monsters in the Axie Infinity
    kingdom of Lunacia. Players can also battle other Axie trainers by selecting Arena
    mode (PvP – player vers player against player). If you win, you earn from the
    entity called Small Love Potion (SLP), which is used to produce Axies. SLP is
    also an ERC-20 token and can be bought and sold on exchanges such as Binance.


    Due to the high price of Axie and the high extortionist fees in Ethereum, it has
    become arduous for new players to be included in the game. Gas is required to
    produce Axie, which may require a large amount of ether to be spent. The Ronin
    Ethereum side chain, developed specifically for Axie Infinity, is intended to
    eliminate this problem.


    What is Axie Infinity Shard (AXS)?


    The AXS coin (Axie Infinity Shard) is relatively new in the world of Axie Infinity
    – launched in November 2020. AXS owners will be able to use their tokens for staking,
    earning AXS by voting and playing games. These rewards come from the Community
    Treasure, which is filled with in-game purchases. However, as of January 2021,
    these Community Treasure and staking features are not yet available.


    AXS total supply will be 270,000,000. Some tokens are reserved for public sale,
    some for play-winning properties, and some tokens are reserved for Sky Mavis and
    the project''s consultants. The initial offer for IPO was just under 60,000,000.
    The number of tokens being circulated is expected to increase annually until 2026.


    AXS Usage Areas


    Axie Infinity; it aims to be a mature game where players are connected, have a
    strong community and a vibrant ecosystem. Axie Infinity offers a fun gaming experience
    where Pokémon or Final Fantasy fans will get carried away. If the game can gain
    an even larger user base, it will undoubtedly add more value to the ecosystem.
    As we mentioned earlier, the Ronin side chain, as well as a free game version,
    are also available to encourage further growth.


    Players can earn both AXS and SLP tokens in a variety of ways by playing Axie
    Infinity. These tokens can then be converted to other cryptocurrencies. It is
    already possible to find players who make money playing Axie Infinity.


    The future of the AXS tokens depend on the playability and popularity of Axie
    Infinity. The game is a game where you can offer a fun experience, has been developed
    in detail and has great growth potential. Axie Infinity has proven itself over
    the past two years and will incorporate new features that will encourage more
    players to join the ecosystem.


    ##### Sorare


    The [Sorare platform](https://sorare.com/) has become a real trend within a very
    short time. Football fans trade with trading cards, set up their own teams and
    thus compete against each other in many leagues. Both with the transfers of your
    own players and in the leagues, you can also earn real money. The only prerequisite
    for this: As a manager you should be tactful, do a good scouting and buy players
    cheaply.


    Basically, Sorare is a fantasy manager. In such games, you put together a team
    of real footballers and collect points based on the performance of the players
    in real life. Just like in other countries, fantasy football has been around in
    Germany for several years. Particularly well-known are, for example, the manager
    game of the trade journal "kicker" or the official fantasy manager of the Bundesliga.


    Sorare offers unique concept


    With classic variants, users usually receive a certain budget with which they
    can put together their team. As a rule, this is not enough to buy only the biggest
    stars.


    This is where Sorare differs in an innovative concept. Users must first purchase
    their players on the transfer market. Real money is paid for this – for stars,
    much higher sums are due than for young up-and-coming talents. However, the expenses
    are worthwhile. All players can be sold again on the transfer market. If you manage
    to bring your players to a higher level beforehand, you can also hope for a decent
    profit.


    Another special feature: For each player there are only a limited number of trading
    cards. So, if you want to put together a special team, you first have to find
    the players on the market. Those who set a small budget for themselves will probably
    have to make one or two compromises. However, it may well be worth investing more
    money. If you collect enough points in a league with your players, you can not
    only win more trading cards, but also real money. So, the account at Sorare is
    quickly refilled if you have the right hand on the market


    Fantasy sports have many facets and are a booming business worldwide. Already
    in 2019, sales worldwide amounted to more than 15 billion euros. By 2027, sales
    are even expected to rise to around 40 billion euros. In traditional fantasy football,
    users assemble their teams at the beginning of the season from professionals who
    are active in real life. This squad is then the basis for weekly line-ups, where
    points are awarded for the actions of the players on the real playing field. Of
    course, it''s about collecting as many points as possible – there is often prize
    money or other winnings for that.


    With Sorare, things work a bit differently. Basically, it''s still fantasy football,
    but players aren''t simply chosen from a list. Instead, users buy digital trading
    cards marked on the Ethereum blockchain. You own the cards, which are also called
    NFTs or non-fungible tokens. These can be sold at any time or used for more games
    in the slowly growing Sorare universe. In short, the principle of Panini collection
    of images is brought into the digital world. In addition, prizes can also be won
    – in the form of cryptocurrency, but also in the form of other, valuable cards.
    Similar concepts have rapidly gained in importance in recent months. The main
    reason is the increasing value of licensed sports NFTs, for example NBA Top Shot
    for US basketball.


    Sorare has already licensed players from around 130 teams worldwide. These include
    top European teams such as Real Madrid, Liverpool FC, Paris Saint-Germain or Juventus
    Turin. From the Bundesliga, Bayern Munich, among others, is already there, in
    addition to representatives from the top leagues in Japan, South Korea, the USA
    or Argentina.


    How does the game work?


    At Sorare, there are various leagues in which users can run a team. For newcomers,
    there is a special rookie league in which you can play for a few weeks after signing
    up. In addition, there are regional leagues and even a league in which only professionals
    who are not older than 23 years are allowed to compete.


    You can join the leagues in each game week for which you have the right playing
    cards. In order to collect points, you have to pay attention to whether the individual
    players are active at all. If you have free play, you can be part of the line-up
    at Sorare, but you remain at zero points. However, this can still be worthwhile
    - even those who do not play, gain a little experience through the line-up. This
    later ensures that individual cards receive bonus points and thus become even
    more valuable.


    At the end of the game week, the points that all players have collected with their
    performances on the field are then added together. If you have collected enough
    points, you can look forward to rare cards and in the best case even to a prize
    money - paid out in the cryptocurrency Ethereum.


    Special features – Sorare compared to other NFTs?


    Sorare combines several things that are not only passionate about real fans –
    football, fantasy sports, trading cards and crypto NFTs. All this makes for an
    experience that is currently absolutely unique.'
  fmt: '

    Within the ecosystem, players can build teams and groups in Adventure mode (PvE
    – player against the environment) to fight monsters in the Axie Infinity kingdom
    of Lunacia. Players can also battle other Axie trainers by selecting Arena mode
    (PvP – player vers player against player). If you win, you earn from the entity
    called `Small Love Potion` (`SLP`), which is used to produce Axies. `SLP` is also
    an `ERC-20` token and can be bought and sold on exchanges such as `Binance`.


    Due to the high price of Axie and the high extortionist fees in `Ethereum`, it
    has become arduous for new players to be included in the game. `Gas` is required
    to produce Axie, which may require a large amount of `ether` to be spent. The
    `Ronin Ethereum` side chain, developed specifically for `Axie Infinity`, is intended
    to eliminate this problem.


    ## What is Axie Infinity Shard (AXS)?


    The `AXS` coin (`Axie Infinity Shard`) is relatively new in the world of `Axie
    Infinity` – launched in November 2020. `AXS` owners will be able to use their
    tokens for staking, earning `AXS` by voting and playing games. These rewards come
    from the `Community Treasure`, which is filled with in-game purchases. However,
    as of January 2021, these `Community Treasure` and staking features are not yet
    available.


    `AXS` total supply will be `270,000,000`. Some tokens are reserved for public
    sale, some for play-winning properties, and some tokens are reserved for `Sky
    Mavis` and the project''s consultants. The initial offer for IPO was just under
    `60,000,000`. The number of tokens being circulated is expected to increase annually
    until 2026.


    ## AXS Usage Areas


    Axie Infinity; it aims to be a mature game where players are connected, have a
    strong community and a vibrant ecosystem. `Axie Infinity` offers a fun gaming
    experience where `Pokémon` or `Final Fantasy` fans will get carried away. If the
    game can gain an even larger user base, it will undoubtedly add more value to
    the ecosystem. As we mentioned earlier, the `Ronin` side chain, as well as a free
    game version, are also available to encourage further growth.


    Players can earn both `AXS` and `SLP` tokens in a variety of ways by playing `Axie
    Infinity`. These tokens can then be converted to other cryptocurrencies. It is
    already possible to find players who make money playing `Axie Infinity`.


    The future of the `AXS` tokens depend on the playability and popularity of `Axie
    Infinity`. The game is a game where you can offer a fun experience, has been developed
    in detail and has great growth potential. `Axie Infinity` has proven itself over
    the past two years and will incorporate new features that will encourage more
    players to join the ecosystem.


    ## Sorare


    The [Sorare platform](https://sorare.com/) has become a real trend within a very
    short time. Football fans trade with trading cards, set up their own teams and
    thus compete against each other in many leagues. Both with the transfers of your
    own players and in the leagues, you can also earn real money. The only prerequisite
    for this: As a manager you should be tactful, do a good scouting and buy players
    cheaply.


    Basically, `Sorare` is a fantasy manager. In such games, you put together a team
    of real footballers and collect points based on the performance of the players
    in real life. Just like in other countries, fantasy football has been around in
    Germany for several years. Particularly well-known are, for example, the manager
    game of the trade journal "kicker" or the official fantasy manager of the `Bundesliga`.


    ### Sorare offers unique concept


    With classic variants, users usually receive a certain budget with which they
    can put together their team. As a rule, this is not enough to buy only the biggest
    stars.


    This is where `Sorare` differs in an innovative concept. Users must first purchase
    their players on the transfer market. Real money is paid for this – for stars,
    much higher sums are due than for young up-and-coming talents. However, the expenses
    are worthwhile. All players can be sold again on the transfer market. If you manage
    to bring your players to a higher level beforehand, you can also hope for a decent
    profit.


    Another special feature: For each player there are only a limited number of trading
    cards. So, if you want to put together a special team, you first have to find
    the players on the market. Those who set a small budget for themselves will probably
    have to make one or two compromises. However, it may well be worth investing more
    money. If you collect enough points in a league with your players, you can not
    only win more trading cards, but also real money. So, the account at `Sorare`
    is quickly refilled if you have the right hand on the market.


    Fantasy sports have many facets and are a booming business worldwide. Already
    in 2019, sales worldwide amounted to more than 15 billion euros. By 2027, sales
    are even expected to rise to around 40 billion euros. In traditional fantasy football,
    users assemble their teams at the beginning of the season from professionals who
    are active in real life. This squad is then the basis for weekly line-ups, where
    points are awarded for the actions of the players on the real playing field. Of
    course, it''s about collecting as many points as possible – there is often prize
    money or other winnings for that.


    With `Sorare`, things work a bit differently. Basically, it''s still fantasy football,
    but players aren''t simply chosen from a list. Instead, users buy digital trading
    cards marked on the `Ethereum` blockchain. You own the cards, which are also called
    `NFTs` or `non-fungible tokens`. These can be sold at any time or used for more
    games in the slowly growing `Sorare` universe. In short, the principle of Panini
    collection of images is brought into the digital world. In addition, prizes can
    also be won – in the form of cryptocurrency, but also in the form of other, valuable
    cards. Similar concepts have rapidly gained in importance in recent months. The
    main reason is the increasing value of licensed sports `NFTs`, for example `NBA
    Top Shot` for US basketball.


    `Sorare` has already licensed players from around 130 teams worldwide. These include
    top European teams such as `Real Madrid`, `Liverpool FC`, `Paris Saint-Germain`
    or `Juventus Turin`. From the `Bundesliga`, `Bayern Munich`, among others, is
    already there, in addition to representatives from the top leagues in Japan, South
    Korea, the USA or Argentina.


    ### How does the game work?


    At `Sorare`, there are various leagues in which users can run a team. For newcomers,
    there is a special rookie league in which you you can play for a few weeks after
    signing up. In addition, there are regional leagues and even a league in which
    only professionals who are not older than 23 years are allowed to compete.


    You can join the leagues in each game week for which you have the right playing
    cards. In order to collect points, you have to pay attention to whether the individual
    players are active at all. If you have free play, you can be part of the line-up
    at `Sorare`, but you remain at zero points. However, this can still be worthwhile
    - even those who do not play, gain a little experience through the line-up. This
    later ensures that individual cards receive bonus points and thus become even
    more valuable.


    At the end of the game week, the points that all players have collected with their
    performances on the field are then added together. If you have collected enough
    points, you can look forward to rare cards and in the best case even to a prize
    money - paid out in the cryptocurrency `Ethereum`.


    ### Special features – Sorare compared to other NFTs?


    `Sorare` combines several things that are not only passionate about real fans
    – football, fantasy sports, trading cards and crypto `NFTs`. All this makes for
    an experience that is currently absolutely unique.

