  trans: "\n\n在加密货币生态系统中，人们的声誉被高度重视。制作 `NFT` 并希望将其出售的艺术家需要通过一系列由 `NFT` 市场应用程序使用的验证个人资料，以证明他们的作品是原创的。如果你有相关艺术家的钱包地址信息（该地址为了接收付款目的而公开共享），你就有机会确认作品的原创性。此外，通过区块链监控应用程序追踪\
    \ `NFT` 的移动轨迹，可以确保艺术家及其作品的真实性。\n\n## NFT 防盗窃吗？\n\n既是，也不是。有了 `NFT`，简单的“盗版”就像普通加密货币一样，几乎是不可能的。这受到了以太坊区块链的保障。在区块链中，每笔交易的买卖双方信息或购买日期都透明地存储在区块链中，类似于账户管理中的记录。因此，所有权、唯一性和真实性几乎是板上钉钉。为了欺诈性地操纵区块链的一部分，坏人必须持有挖矿网络中至少\
    \ 51% 的算力。在行业内，这种场景被认为是非常罕见的事件（super-GAU），但其实际风险微乎其微。\n\n然而，`NFT` 可以像比特币或以太坊一样被盗取：通过潜在的小偷获取存储代币的钱包访问权限。所以，仅仅复制和粘贴是不够的，你需要犯罪手段。\n\
    \n## 为什么 NFT 有时价值百万？\n\n这就是事情变得有趣且具有潜在风险的地方。就像比特币等一样，人们对 `NFT` 的意见很大。有些人认为这些代币是艺术行业不可避免的革命，而对另人来说，它最多只是一个具有巨大损失的噱头。虽然你不能把\
    \ `NFT` 挂在墙上，但这些代币经常以惊人的出售：杰克·多塞（Jack Dorsey）的第一条推特带来了 250 万美元，《瑞克和莫蒂》创始人贾斯汀·罗兰（Justin\
    \ Roiland）的一个收藏品以 230 万美元易手，“灾难女孩”佐伊·罗斯（Zoë Roth）以至少 50 万美元卖出了她表情包的 `NFT`。\n\n\
    看看最近一些最引人注目的交易：美国艺术家 Beeple（Mike Winkelmann）在佳士得拍卖行出售了他的作品合集，价格拍出 6940 万美元。勒布朗·詹姆斯（Lebron\
    \ James）的扣篮视频 `NFT` 通过 NBA Top Shot 应用出售，零售价为 7.7 万美元。Twitter 首席执行官杰克·多斯的推特被一位土其其的人以\
    \ 290 万美元买下，而埃隆·马斯克（Elon Musk）则将其包含 GIF 和音乐的推特作为 `NFT` 拍卖。最近几天，Cüneyt Özdemir\
    \ 的推特以 1 万美元售出。\n\n只有在产生相应的需求时，才会出现如此高额——由于对 `NFT` 的炒作，这种需求目前为巨大。这吸引了投机者和收藏家。此外，数字艺术无疑是一个强大的未来市场，因此\
    \ `NFT` 将会引起艺术行业的一些变革。当然，这并不是快速富的保证，即使是 `NFT` 泡沫也会形成并导致巨大损失——但也存在巨额利润。\n\n## NFT\
    \ 对气候有害吗？\n\n目前，答案可能是定的。`NFT` 也面临许多加密货币的能量困境：每笔交易消耗的电超过 80 千瓦，因此排放约 33 公斤二氧化碳。然而，希望正在出现：耗费资源的共识机制“工作量证明”（`PoW`）将在今年年底之前被“权益证明”（`PoS`）取代。这不仅预期能源消耗大幅减少，还提高了交易速度：从目前的每秒\
    \ 15 次处理到每秒几千次。\n\n## NFT 艺术有未来吗？\n\n人们对此只能推测，但目前看起来确实如此。如果数字艺术是可持续的，那么它可能就是。理论上，许多其他应用领域也是可能的。除了作为真实性证书的功能外，这些代币也可以被想象成从音乐会到冒险池活动的防伪门票。甚至非数字物体未来也可以被验证。\n\
    \n已经有一些电脑游戏中 `NFT` 以物品、角色或虚拟区域的形式出现。它们也适用于个人：例如用于政府或办公室的身份认证。最大的加密货币交易平台 Binance\
    \ 也进入了该业务：它计划于 2021 年 6 月推出自己的艺术市场。重点不仅是高价溢品，也面向普通消费者：一个面向每个人的第二个市场应该交易负担得起的物品。这里\
    \ Binance 至少接受 1% 的佣金，因此他们显然在看好这一增长的市场。\n\n随着对 `NFT` 经验的增加，似乎正在构建创新的商业模式。首先，实体资产的数字化（即“代币化”）可以适用于广泛的领域。例如，上周，美国一个\
    \ 3D 虚拟世界设计的房屋以 50 万美元出售。似乎一些游戏也有土地 `NFT` 销售。另一个预计 `NFT` 将产生影响的领域是社交媒体。得益于 `NFT`，粉丝数、观看次数和创作者变现等指标可能变得不受中心化社交媒体公司的操纵。\
    \ \n\n我们真的希望你喜欢这本书并发现它获益匪浅。有了这些知识，你现在可以尝试投资 `NFT`，甚至通过获取更多知识找到创建你自己的 `NFT` 的方法。祝你一切顺利！\n\
    \n"
