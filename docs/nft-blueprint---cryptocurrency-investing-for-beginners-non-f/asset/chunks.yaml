    Beeple 的成功可能是独一无二的——至少目前如此——但也有许多艺术家通过销售加密艺术取得了巨大成就：例如艺术家夫妇 `Hackatao`，他们是意大利
    NFT 的先驱之一；或者 `DotPigeon`，其在 `Nifty` 上举办的虚拟展览在一周内便售罄。


    在乐队中，`Kings of Leon` 是第一个以 NFT 形式发行专辑的乐队，通过三种不同的代币提供了访问专属资产的（从特别版专辑到在演唱会上获得前排永久座位的机会）。


    ### 游戏


    目前，在《魔兽世界》(World of Warcraft)、《堡垒之地》(Fortnite)、`CS:GO` 或《联盟联盟》等热门游戏中，禁止出售稀有武器或皮肤。此外，无法将一个游戏中的物品或皮肤用于另一个游戏。而通过
    `NFTs`，就可以传输物体并清晰地分配所有权。这将解决热血玩家面临的一些最大困扰。


    这些可能是最肥沃的市场，因为购买虚拟产品是视频游戏用户的常态——例如我正在想的，例如《堡垒之地》中带有商标的皮肤，或者在游戏中为虚拟化身销售衣服的时尚品牌——如《网球大战》(Tennis
    Clash) 中的 `Gucci`。


    `NFT` 在这些市场的绝佳例子是德国足球员梅萨厄尔 (Mesut Özil)，他与 `Boss Logic` 和 `Genies` 一起开发了一系列虚拟化身服装：销售这些资产的收益将捐给
    `BigShoe`，这是一个支持生活贫困儿童的非营利组织。


    对于品牌而言，了解什么样的市场和行动能与该世界相关的活动完美结合非常重要：对于某些品牌来说，这是非常自然的，而对于另一些品牌，可能需要采取不太传统的方法来使用
    `NFT`。


    我们所的方法既是指要创建的内容类型（例如单词、3D 对象或视频），也是根据你想要接触的受众和想要传达的信息来拍卖作品的平台类型。


    ### 资产


    `NFT` 虚拟资产市场非常大。在 `Decentraland` 和 `Cryptovoxels` 等平台上，可以购买虚拟土地。这些土地拥有独特的属性，就像现实世界中的土地一样。在虚拟世界中，这些土地已经以数万美元的价格交易。此外，`Unstoppable
    Domains` 网站已将网站名称代币化。因此，每个网站名称都可以转换为一个 `NFT`，供任何人自由交易。


    `NFTs` 这一领域仍处于早期，但可以将艺术品或唱片合同等现实资产代币化为 `NFT`。`NFTs` 用于证明某人（按比例）拥有某件艺术品，或用于结算版税索赔。


    这几周内发生的任何事情无疑将导致新一代与 `NFT` 相关平台的诞生：市场将越来越像画廊，数字艺术品可以像传统艺术品一样展示和销售。艺术就是艺术，无论是数字的还是物理的。


    虚拟模特上模特上的衣服也是如此，这些衣服可以通过数字看到，并被想要装扮自己数字形象的人购买。


    然而，需要记住的一点是 `NFTs` 对碳足迹可能有巨大影响（加密货币的生产需要大量能量，这显然会影响 `CO2` 的产生），因此品牌意识到这一点并了解如何负责任地行动非常重要。


    # 第二节：解密少数概念以更好地理解 NFT


    ## 2.1. 标准化


    年来，加密开发者在公链区块链上创建了通用、可重用的代币标准。这些标准用于所有权、传输和简单的访问控制等基本原则。


    这些策略或协议类似于 `HTTP` 协议当图像在两个不同的计算机之间以 `JPEG` 或 `PNG` 格式显示时在 `2` 台设备之间发送请求。


    区块链添加了原始元素和一个层，允许它们存储元数据，为开发者提供了全新的状态信息集，他们可以在此开发应用程序。这一领域被称为区块链标准（支持状态数据存储和逻辑操作）。


    `Ethereum` 的代币是 `Ethereum` 或其他区块链上任何资产的虚拟存储或表示。


    `ERC-721` 是一种解释如何在 `Ethereum` 区块链上创建唯一代币的标准。与用 `ERC-20` 标准创建的标记不同，用 `ERC-721`
    创建的每个代币都是唯一的。


    使用 `ERC-721` 标准创建的非同质化标记是唯一的，与其他代币不同。由于每个 `ERC-721` 代币彼此不同且价值不同，因此彼此交换代币变得困难。


    如 `Bitcoin` 和 `Ethereum` 等硬币，以及 `USD` 等法币是同质质的，这意味着每个单位都是等值的。因此，此类加密货币和法币的每个单位具有相同的价值，并且可以直接相互交换。


    此外，同质硬币和代币可以分成小的单位，例如 `Bitcoin` 的 `0.5 bitcoin` 和 `0.0002 bitcoin`，而非同质化标记是单一单位，不能分成小的单位。


    `ERC-721` 标准定义了智能合约必须执行的最小接口，允许管理和交换唯一代币等功能，同时不需要或限制为代币元数据添加额外功能。


    `CryptoKitties` 是一个繁殖和出售独特猫的游戏，它是用非同质化标记创建的项目中最著名的。


    目前，非同质化标记被用于许多项目，如 `Decentraland` 和 `Enjin`。


    非同质化标记的使用当然不限于游戏行业。它提供了许多不同的用途，例如追求艺术品、房地产等现实资产。另一个基于 `ERC721` 代币流行的区块链游戏是 `Blockchain
    Cuties`。


    要浏览非同质化标记的交易或游戏，请查看 `OpenSea`，它是区块链最大的市场。


    ### 什么是 ERC721？


    这是一种非同质化标记标准。目前，大多数 `NFT` 是在 `Ethereum` 平台上实现的。你可以在其他标准和其他协议下找到 `NFT` 标记，例如 `NEO`
    或 `EOS`，但 `ERC-721` 目前是最流行的 `NFT` 标准。`ERC-721` 具有一组标准的属性和功能，以智能合约的形式定义。你需要遵循这些属性和功能来拥有、交易和管理
    `ERC-721`。简单来说，`ERC-721` 为我们创建 `NFT` 提供了标准。每个 `ERC-721` 标记都是唯一的，因为它不像 `ERC-20`
    标记。


    通用定义：一种为 `NFT` 提供标准的标记类型。换句话说，此类标记是唯一的，价值可能与同一智能合约中的标记不同。`ERC-721`标记；它们根据年龄、稀有性甚至视觉效果而不同。


    技术定义：`Erc-721`（Ethereum Request for Comments 721）是一种为智能合约实现 API 的非同质化标记标准。


    当 `ERC-721` 功能在以太坊诞生之前发明时，它旨在添加到 `Bitcoin` 世界中，用于房地产和 `Bitcoin` 其他资产的认证，但它并没有成功和稳定，因此它在
    `Ethereum` 上诞生了。


    例如，`欧冠联`决赛的 `2` 张票中的一张是普通座位，另一张是 `VIP/包厢` 票。

    '
