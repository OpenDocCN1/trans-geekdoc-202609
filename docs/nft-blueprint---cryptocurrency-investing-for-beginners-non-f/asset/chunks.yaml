- raw: "Genesis cards are currently purchased through the browser, but the game can\
    \ be run as a desktop app. Developers are also considering integrating the game\
    \ into mobile devices and tablets over time. Card packs will also be available\
    \ for purchase with Coinbase Wallet, a mobile browser and wallet service from\
    \ Coinbase, an investor in Gods Unchained.\n\nEach package currently sold contains\
    \ 5 genesis cards and has a total of 380 cards. Users who purchase cards on Presale\
    \ will also get early access to the beta version. Each of these genesis cards\
    \ is actually a non-fungible token created with the ERC-721 protocol.\n\nWhat\
    \ difference does blockchain technology make to the game?\n\nAs most of us know,\
    \ traditional games are driven entirely by the companies that created them. Although\
    \ players think they have valuable assets (characters, items, etc.) that have\
    \ spent a lot of time on them in-game, this ownership status and value of assets\
    \ may vary with a single decision by developers.\n\nWith many advantages such\
    \ as immutable recording of transactions brought by blockchain, verifying ownership\
    \ and tracking past transactions, players will be able to own assets just as they\
    \ do in real life.\n\nHow to play Gods Unchained?\n\nIn Gods Unchained, you play\
    \ one-on-one battles against another player or computer. The goal of the game\
    \ is to win by reducing the other side's life score to zero. At the beginning\
    \ of each battle, players choose 30 cards from their collection and one God to\
    \ fight together.\n\nThe game is completely free to play, and users do not lose\
    \ any cards when they lose games. Cards can be under various categories, such\
    \ as creatures, weapons, magic, or special god cards, and players also have God\
    \ power that they can use once when it's their turn.\n\nThe whole concept behind\
    \ Gods Unchained is that games don't have to be a silly pastime but can also become\
    \ an investment case. Games like Magic the Gathering, in which tickets were sold\
    \ for tens of thousands of US dollars, are the way to do that. And such digital\
    \ games also exist on an NFT basis.\n\nTrading Card Games fascinate many people.\
    \ Presumably, this is the attractive mix of game and investment case: Should you\
    \ really exchange a [Black Lotus](https://www.cardmarket.com/en/Magic/Products/Singles/Alpha/Black-Lotus)\
    \ from the Alpha Edition for an [Ancestral Recall](https://www.cardmarket.com/en/Magic/Products/Singles/International-Edition/Ancestral-Recall)\
    \ from the International Edition? Here it depends very much on whether you see\
    \ the matter from an investment perspective or a strategic point of view. Even\
    \ though the Black Lotus is worth almost a hundred times as much, it may make\
    \ more sense for your own blue deck to have an Ancestral Recall. If you are still\
    \ aware of the incredible complexity of Magic and the like, it is no wonder that\
    \ such games have either been transferred to the digital age – see Hearthstone\
    \ – or completely recreated.\n\nSuch trading card games can also build a bridge\
    \ to cryptocurrencies: MTGox (now defunct) was originally planned as a trading\
    \ exchange for trading cards. At the latest with the fall of MTGox, this bridge\
    \ was torn down for the time being, but was rebuilt with projects such as CryptoKitties.\n\
    \nSure, already regarding CryptoKitties an investment case can be discussed, but\
    \ we would like to look at other games in this issue via the investment case Non-Fungible\
    \ Token. Instead, we look at Gods Unchained as an example of an NFT-based game.\
    \ The game has already been briefly watched in our series about Blockchain Gaming,\
    \ but here we want to look less at the game than at the investment case.\n\nWhat\
    \ should the investor look out for?\n\nAs soon as packs are available again, you\
    \ should follow the announcements closely: Will there be something like the Mythical\
    \ Cards that were released in the Genesis phase again? Some of these extremely\
    \ rare cards were able to achieve very good prices on the markets. If there are\
    \ such cards, you should take a close look at how they are distributed in the\
    \ new packs. The Mythical Cards were distributed regardless of the type of pack.\
    \ So the chances were the same; whether you bought a Rare Pack or a Shiny Legendary\
    \ Pack. However, since the price of a Rare Pack was only a fraction of the price\
    \ of a Shiny Legendary Pack, you could buy significantly more packs – and thus\
    \ increase the probability of finding a Mythical card.\n\nWhy is this important?\
    \ Because these cards can be worth a lot. The [Hyperion](https://blog.godsunchained.com/2019/02/11/the-62000-card/)\
    \ card was sold in an auction for over $60,000. This makes the second most expensive\
    \ card in a trading card game to be found at Gods unchained.\n\nNo new packs available?\
    \ Cards are available in secondary markets\n\nWithout packs, the Gods Unchained\
    \ investor is limited to buying individual cards in spe. How could he proceed\
    \ here? Well, both on Open Sea and on the Gods Unchained platform directly, the\
    \ marketplaces are visible. The cards can be sorted by rarity, price and technical\
    \ details. Investors can now see if there are cards that are a bargain for their\
    \ great rarity and/or playful use.\n\nAccordingly, it is also worthwhile to study\
    \ more closely which species are currently popular on decks. If you stock up on\
    \ strategically suitable cards in good time, you can achieve good returns on the\
    \ marketplaces.\n\nUnfortunately, there are still no reliable statistics for the\
    \ market from independent sources. On the one hand, one is dependent on the blog\
    \ of Gods Unchained. It also makes sense to follow the community here.\n\nAnother,\
    \ quite young way to make money is the so-called \"forging\". This is a kind of\
    \ \"silver plating\" of existing cards. Through playful activity, players can\
    \ acquire so-called \"Flux\". This can now be used to upgrade simple cards that\
    \ you have twice to better variants.\n\nGods Unchained: Interesting niche investment\n\
    \nSo much for a few guidelines about investing in this trading card game. If you\
    \ look at sites like [Nonfungible.com](https://nonfungible.com/market/history)\
    \ you can see that there is undoubtedly a market for such blockchain-based games.\
    \ It is still in its infancy and some might wonder whether a blockchain is really\
    \ needed for such games. \n\n#  \n\n# Session 5  \n\nInvesting in NFTs \n\nBefore\
    \ investing in NFTs, there are two main concepts you need to understand – dApps\
    \ and MetaMask. \n\n## 5.1. Which wallet do I need to use NFTs?\n\nThis depends\
    \ on the network on which you want to create the tokens. Fortunately, most wallets\
    \ today support Ethereum and the Binance Smart Chain, the two most commonly used\
    \ blockchains for NFTs.\n\nFind out which wallet the blockchain network on which\
    \ your token is based requires. If it is an Ethereum token, you need a wallet\
    \ that supports Ethereum. If the network is Tezos, you need a wallet that supports\
    \ Tezos.\n\nWe recommend using MetaMask or Trust Wallet. These two crypto wallets\
    \ support a variety of blockchains. However, still check again whether your wallet\
    \ supports the blockchain on which you hold your tokens.\n\n### What is the MetaMask\
    \ Wallet?\n\nMeta Mask is an open-source wallet for Ethereum that has been on\
    \ the market since 2014. The wallet is available as a browser add-on for Google\
    \ Chrome, Firefox, Edge and Brave as well as for iOS and Android. In addition\
    \ to the storage and management of tokens based on Ethereum, advanced functions\
    \ such as staking or access to decentralized exchanges (DEX) are also easily possible\
    \ even for beginners.\n\nThe rich applications with a simultaneously intuitive\
    \ user interface are the reason why the Meta Mask Wallet is still one of the most\
    \ popular Ethereum wallets in 2021. With over 1 million users for Android alone,\
    \ the platform is one of the most used Ethereum wallets. Even if hardware wallets\
    \ are the most secure of all alternatives, the Meta Mask Wallet can be worthwhile\
    \ especially for those users who actively participate in the Ethereum network\
    \ and really want to use the tokens."
