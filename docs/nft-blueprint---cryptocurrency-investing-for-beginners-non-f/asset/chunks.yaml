    在该生态系统中，玩家可以在冒险模式（PvE – 玩家对抗环境）中组建团队和小组，在 Axie Infinity 的 Lunacia 王国战斗怪兽。玩家也可以通过选择竞技模式（PvP
    – 玩家对抗玩家）与其他 Axie 训练师对战。如果你获胜，就可以获得名为 `Small Love Potion`（`SLP`）的实体，它被用于生产 Axie。`SLP`
    也是一种 `ERC-20` 代币，可以在 `Binance` 等交易所进行买卖。


    由于 Axie 的价格高昂以及 `Ethereum` 上高昂的勒索费用，新玩家加入游戏变得非常困难。生产 Axie 需要消耗 `Gas`，这可能需要花费大量的
    `ether`。专门为 `Axie Infinity` 开发的 `Ronin Ethereum` 侧链旨在解决这个问题。


    ## 什么是 Axie Infinity Shard (AXS)？


    `AXS` 代币（`Axie Infinity Shard`）在 `Axie Infinity` 世界中相对较新——于 2020 年 11 月推出。`AXS`
    所有者将能够使用他们的代币进行质押，通过投票和玩游戏赚取 `AXS`。这些奖励来自“社区宝库”（Community Treasure），其中充满了内购。然而，截至
    2021 年 1 月，这些“社区宝库”和质押功能尚未可用。


    `AXS` 总供应量为 `270,000,000`。部分代币预留用于公售，部分用于游戏奖励，另部分代币预留给 `Sky Mavis` 和项目的顾问。IPO
    的初始报价略低于 `60,000,000`。预计流通的代币数量将每年增加，直到 2026 年。


    ## AXS 使用领域


    Axie Infinity 旨在成为一个让玩家连接、拥有强大社区和充满活力生态系统的成熟游戏。`Axie Infinity` 提供了有趣的游戏体验，让《宝可梦》或《最终幻想》的粉丝沉迷其中。如果游戏能够获得更大的用户群，无疑将为生态系统增加更多价值。正如我们之前提到的，`Ronin`
    侧链以及免费游戏版也用于鼓励进一步增长。


    玩家可以通过多种方式通过玩 `Axie Infinity` 赚取 `AXS` 和 `SLP` 代币。这些代币可以转换为其他加密货币。已经可以找到通过玩 `Axie
    Infinity` 赚钱的玩家。


    `AXS` 代币的未来取决于 `Axie Infinity` 的可玩性和受欢迎程度。这款游戏是一个提供有趣体验、经过详细开发并具有巨大增长潜力的游戏。`Axie
    Infinity` 在过去两年中证明了自己，并将加入新功能，以鼓励更多玩家加入生态系统。


    ## Sorare


    [Sorare 平台](https://sorare.com/) 在极短时间内成为了一种真正的趋势。足球粉丝通过交易卡进行交易，建立自己的球队，从而在许多联赛中相互竞争。无论是通过转会你自己的球员，还是在联赛中，你都可以赚取现金。唯一的先决条件是：作为经理，你应该야有谋略，做好球探工作并廉价买入球员。


    基本上，`Sorare` 是一个幻想经理游戏。在这样的游戏中，你组建由真实运动员组成的球队，并根据球员在现实生活中的表现收集积分。和其他国家一样，幻想足球在德国已经存在多年。特别广为人知的，例如贸易杂志《kicker》的经理游戏或德甲联赛（Bundesliga）的官方幻想经理游戏。


    ### Sorare 提供了独特的概念


    在经典变体中，用户通常会获得一定的预算，用此组建球队。按照规定，这不足以只买下最大的巨星。


    这就是 `Sorare` 在创新概念上与众不同之处。用户必须首先在转会市场上购买球员。这需要支付真实的资金——对于球星，支付的金额远高于年轻的秀秀。然而，这些支出是值得的。所有球员都可以再次在转会市场上出售。如果你能先将球员提升到更高的水平，你也可以希望获得丰厚的利润。


    另一个特殊功能：每个球员的交易卡数量是有限的。因此，如果你想组建一支特殊的球队，首先必须在市场上找到这些球员。那些为自己设定小预算的人可能不得不做出一两个妥协。然而，投入更多钱可能是值得的。如果你用你的球员在联赛中获得了足够的积分，你不仅可以赢得更多的交易卡，还可以赢得现金。所以，如果你在市场上有正确的眼光，`Sorare`
    账户很快就会充满。


    幻想体育有许多侧面，是全球范围内蓬勃发展的业务。早在 2019 年，全球销售额就超过了 150 亿欧元。到 2027 年，销售额预计还将增长到 400 亿欧元。在传统的幻想足球中，用户在赛季初从现实生活中活跃的职业运动员中组建球队。这支队伍是每周阵容的基础，根据球员在真实赛场上的动作授予积分。当然，目标是尽可能收集积分——这通常会有奖金或其他奖品。


    通过 `Sorare`，情况有所不同。基本上它仍然是幻想足球，但球员不是简单地从列表中选择。相反，用户购买在 `Ethereum` 区块链上标记的数字交易卡。你拥有这些卡片，它们也被称为
    `NFTs` 或非同质化代币。这些碎片可以随时出售，或用于缓慢增长的 `Sorare` 宇宙中的更多游戏。简而言之，帕尼图像集集的原理被带入了数字世界。此外，还可以赢得奖品——以加密货币的形式，也可以以其他价值卡片的形式。类似的概念在最近几个月迅速获得了重要性。主要原因是授权体育
    `NFTs` 价值的增加，例如美国篮球的 `NBA Top Shot`。


    `Sorare` 已经从全球约 130 支球队获得了球员授权。其中包括欧洲顶级球队，如皇家马德里、利物浦、巴黎圣日曼或尤文斯。德甲中也有慕尼黑等，此外还有日本、韩国、美国或阿根廷顶级联赛的代表。


    ### 游戏是如何运作的？


    在 `Sorare`，有各种联赛可以让用户运行球队。对于新手来说，有一个特别的新人联赛（rookie league），在注册后你可以玩几周。此外，还有区域联赛，甚至还有一个只允许
    23 岁以下专业人士参赛的联赛。


    你可以参加你拥有相应卡片的每个每周联赛。为了收集积分，你必须注意单个球员是否活跃。如果你有免费额度，你可以加入 `Sorare` 的阵容，但你的积分将保持为零。然而，这可能是值得的——即使是没有比赛的人也能通过阵容获得一些经验。这以后确保了个人卡片会获得加分，从而变得更有价值。


    每个每周结束时，所有球员在赛场上收集的积分将加在一起。如果你收集了足够的积分，就可以期待稀有卡片，在最好的情况下甚至获得奖金——以加密货币 `Ethereum`
    付。


    ### 特色功能——Sorare 与其他 NFT 相比如何？


    `Sorare` 结合了真实粉丝热爱的多种元素：足球、幻想体育、交易卡和加密 `NFTs`。这一切创造了目前绝对独特的体验。


