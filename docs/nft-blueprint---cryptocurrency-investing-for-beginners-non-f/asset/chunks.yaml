  trans: '


    世界正变得更加网络化。物理空间（meat space）不再覆盖整个世界，越来越多的活动转向了虚拟现实。越来越多的人想要交流思想，这意味着整个世界都在发展。哪里有世界的发展，人类就想要定居。其他人也从中获益。一个虚拟房地产市场应运而生。


    这并非幻想，而是各个平台上已成为现实。`Decentraland` 和 [Cryptovoxels](http://www.cryptovoxels.com/)
    现在已经有了土地市场。


    ## 不同形式的代币化房地产


    资产代币化是 STO（证券代币发行）领域为人知的话题。`BTC-ECHO` 经常报道以代币形式出售物业的公司。优势在于：投资者只需投入较小资金即可购买房产的一部分。


    对于虚拟世界中的房地产，这意味着即使在 VR 中，独特的地块也是独一无二的。所有者可以通过发送代币来放弃其所有权。这正是正在发生的事情。追踪此类交易的网站之一是
    `Open Sea`。它是针对不同 `NFT` 项目的浏览器。总来说，如果你想仔细观察 `NFT` 市场，该网站将是一个很大的帮助。该网站证明了虚拟房地产市场的存在。


    `Decentraland` 也可以说类似的情况：在这里，最贵的地块所有者可能拥有约 16,000 美元。虽然在 `Cryptovoxels` 中这种购买是用
    `Ether` 完成的，但在 `Decentraland` 中默认货币是 `MANA`。特殊之处：这甚至不是一个建筑，而是对某个地块的所有权声明。


    ## 通往虚拟经济的桥梁


    感兴趣的投资者如何获得土地或再次出售？一个良好的联系点是上述的平台 `Open Sea`。在这里，感兴趣的可以买卖 `Decentraland` 和 `Cryptovoxels`
    物业等。与上周提到的 `SuperRare` 类似，许多交易以拍卖的形式进行。一如既常，任何 `Ethereum` 钱包连接到 `Open Sea` 的人都可以参与。


    如果你对拍卖感兴趣，请选择你喜欢的物体并通过 `Open Sea` 平台进行报价。


    如果你提交了此报价，可以设置报价的有效期。随着时间的推移，需要再次等待报价被接受或其他人赢得拍卖。当然，你也可以撤回报价。这是通过“账户（Account）”视图中的“报价（Offers）”菜单项完成的：


    想要出售物业的所有者采取类似的方法。你可以选择以固定价格出售物业，或者通过拍卖将其出售。


    ## 购买虚拟房地产期间的注意事项


    通用流程就到这里。虚拟房主应该注意什么？这里可以考虑以下几点：


    ● 所选地点的频率如何？

    ● 是什么让该建筑/地块具有独特性？

    ● 它距离用户起始区域有多远？

    ● 建筑的可见度如何？


    `Open Sea` 试图通过将不同的指标聚合为面积（Area）、深度（Depth）、高度（Height）和宽度（Width）来创建一个某种比较。`Cryptovoxels`
    本身在这方面做得更详细。通过查看他们网站上的建筑，人们不仅可以更详细地研究建筑的 `3D` 视图，还可以分析不同的指标。


    你可以从这些细节中看到很多：物业有多大、访问频率如何、使用了多少种颜色或它位于哪个社区。“地块内容（Parcel content）”部分显示了该网站上还有哪些其他物体。这一切都可以纳入
    `Cryptovoxels` 物业的估值中。


    `Decentraland` 遗憾没有提供足够做出购买决策的数据，但可以找到以下数据：


    ● 新用户起始点的移除

    ● 地块接触了几条街道

    ● 物体是否属于某个区域


    最后一点可能特别有趣。区域是受到某些治理的地方。相应地，可以预计这些地方会有一定程度活动。


    ## 新或可能的广告空间的吸引力？


    作为一份初级指南，如何在 `Cryptovoxels` 和 `Decentraland` 中评估物业。投资者为什么甚至为虚拟世界中的一块荒地支付荒谬的数字？坦率地说，目前这并不显而易见。但如果我们看
    `Cryptovoxels` 世界中的建筑，一个投资案例实际上可以是建立一个画廊。一个艺术家提供作品的易访问建筑，对于希望通过作品获得报酬的艺术收藏家来说，可能是一个吸引人的地方。这样，虚拟现实中就可以发展出另一种经济。


    如果 `Cryptovoxels` 和 `Decentraland` 的虚拟现实被更多发现，可能会出现其他投资案例。公司可以购买易访问的建筑将其用于广告目的。可能性并不仅限于房地产的购买或建设。在
    `Cryptovoxels` 的世界里，具有某些编程天赋的物业所有者可以扩展世界。`Cryptovoxels` 中一个著名的例子尽管听起来很平庸，是彩色区块。在
    2019 年的“开发者大赛（Developer Contest）”中，开发者 `Conlan` 展示了一个彩色 ATM 机：


    再次，特别是对于想要建立虚拟形象的公司来说，购买颜色可以为他们的物业提供某个独特卖点。`Cryptovoxels` 的许多地方让人们想起墙倒后的预制建筑区。相应地，某些色彩的东西无疑会吸引感兴趣的。


    而且机会不仅于此。原则上，可以想象 `Decentraland` 或 `Cryptovoxels` 的开发者会开发自己的游戏或其他平台，使用这些平台可能付费。在这两种情况下，这些都是建设中的世界，所以未来如何未知。


    ### B. 做自己的艺术赞助人：SuperRare 上的艺术交易


    无论是伦勃特等经典大师的作品，还是班克斯等现代艺术家的作品，艺术市场正在蓬勃发展。根据 `Art Basel`，2019 年艺术品支出超过了 600 亿美元。除了纯粹的审美原因外，货币价值对私人买家来说是不可或缺的。艺术品的逻辑与像
    `Bitcoin` 这样的价值存储物相似。它甚至更激进：原作仅此一件。如果一直有人对艺术感兴趣，投资者在家里就有一幅画作为价值存储物。


    对于当代艺术家，情况更有趣：像 `Banksy` 这样的艺术家并非一直全球闻名。早早发现一个有潜力的艺术家并购买他的作品，从长期来看是一项非常丰厚的投资。


    这正是我们这些区块链领域的人来说变得有趣的地方。我们越来越多地生活在一个数字时代。尽管 VR 技术仍处于婴儿阶段，但许多公司已经在考虑虚拟现实中的经济。越来越多的艺术家正在利用数字世界的可能性。难怪：艺术家可以充分利用数字格式的可能性。小动画可以快速安装。得益于区块链技术，这些艺术品像它们的经典对应品一样，现在可以被绝对限制。


    这不是未来的梦想。通过 `SuperRare`，数字艺术品商今天就可以购买艺术品。多件艺术品已经多次易手。一个著名的例子是 [AI 生成的裸体肖 #1](https://superrare.co/artwork/ai-generated-nude-portrait-1)。这件作品两年前以
    `0.46 Ether` 出售，在今年早些时候以 `75 Ether` 转手。用美元表示：一件在 2018 年以 175 美元成交的艺术品，在 2020 年初以
    13,000 美元出售。这种收益在牛市中很常见，但这次恰逢上 `Ether` 价格减半。


    ## 开始使用 SuperRare


