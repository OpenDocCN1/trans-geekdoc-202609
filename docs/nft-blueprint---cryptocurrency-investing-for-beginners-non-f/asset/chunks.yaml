    CryptoKitties 自 2017 年 11 月一直存在。它们迅速走红，在此期间，稀有的猫的价格曾达到 200,000 美元。交易额已超过数百万。官方网站将这些猫大致翻译为加密货币交易品。它还提到，每一只交易的数字猫都是独特的，且
    100% 属于所有者。它们不能被复制、盗取或破坏。


    ## 如何购买 CryptoKitties？


    CryptoKitties 使用数字钱包购买。根据网站显示，它接受所有数字钱包，例如 MetaMask、Coinbase 和 Trust。你可以在我们的[钱包概览页面](https://www.bitcoinmag.de/x-wallet)上阅读关于钱包你需要的所有知识。为了购买
    `CryptoKitty`，钱包中必须有足够的资金。如果想对猫进行繁殖，可以通过猫名字旁边的按钮进行。后续步骤将进行详细说明。繁殖需要支付 `0.008 ETH`
    的费用。


    ## 类似游戏


    有一些基于区块链的类似游戏。其中包括 `CryptoFighters`，这是一个可以在 `Ethereum` 区块链上收集稀有数字战斗角色的游戏。该游戏使得战斗和获得新战士成为可能。另一个区块链游戏是
    `CryptoCelebrity`，玩家可以通过 `Ethereum` 买卖智能合约。每个著名人物仅有一个智能合约。


    ## CryptoKitties 的首次博物馆亮相


    此次展览由 `Dapper Labs` 公司组织，该公司是 CryptoKitties 的所有者，以及数字展览空间 `Meural` 与 `ZKM` 博物馆共同举办。`Meural`
    的首席执行官 `Vladimir Vukicevic` 表示，公司“非常高兴能够帮助 CryptoKitties 完成首次博物馆亮相，并为这些猫提供一个物理家园”。


    他继续说道：“我们的产品是加密艺术爱好者以一种符合其价值的方式展示其收藏品的理想方式。这使得陈列和欣赏它们变得简单。通过与 CryptoKitties 合作举办此次活动，我们希望向公众展示收藏加密如何融入他们的日常生活。”


    ## CryptoPunks


    [CryptoPunks](http://cryptopunks/) 是可收藏的加密艺术品，以 `Ethereum` 区块链上的 NFT 形式存在。它由 10,000
    个小的、8 位风格的“朋克”组成，每个都有独特的特征。该项目激发了许多加密艺术家，甚至推动了用于数字的 `ERC-721` 代币标准的发展。2021 年，在一些
    CryptoPunks 以数百万美元售出后，该项目变得更加流行，成为最昂贵的 NFT 之一。


    乍看之下，这些小小的正方形像素脸看起来并不特别。有些在抽烟斗。有些人戴着帽子。有些甚至是外星人。但涉及到 NFT 时，外表往往具有欺骗性。拥有其中任何一个长相有趣的朋克就可以让你买到从小公寓到大豪宅的所有东西。这些
    8 位 CryptoPunks 限量为 10,000 件，是一个目前需求量巨大的 NFT 集合。它们无法进行战斗或质押，除了存在本身之外，它们没有其他特征。CryptoPunks
    也是最早的 NFT 项目之一。


    ### 谁创建了 CryptoPunks？


    CryptoPunks 由位于纽约的 `Larva Labs` 创建，由 `Matt Hall` 和 `John Watkinson` 创立。该项目始于 2017
    年，作为对 NFT 以及艺术价值的一项实验，最终帮助了我们现在所知的加密艺术的普及。


