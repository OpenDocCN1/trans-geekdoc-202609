  trans: '


    在 2018 年到 2020 年间，许多基于区块链的 NFT 设定了许多新课程，如果没有这些课程，2021 年可能无法出现新一轮浪潮。许多区块链项目利用加密货币寒冬推动了许多有趣的
    NFT 应用。


    ### 作为数字艺术的 NFT


    这就是艺术市场自我发现 NFT 的方式。所有权的清晰证明以及透明化展示这些可能，对于数字艺术来说几乎是理想的。一些艺术家开始尝试 NFT。数字艺术交易平台如
    [OpenSea](https://opensea.io/)、[SuperRare](https://superrare.co/)、[MakersPlace](https://makersplace.com/)
    或 [Known Origin](https://knownorigin.io/) 相继成立并不断扩大。所谓的铸造平台如 [Digital Art](https://digitalartchain.com/)、[Mintbase](https://mintbase.io/)
    和 [Mintable](https://mintable.app/) 集成了相关解决方案，让任何没有编程知识的任何人都能轻松、快速地创建 NFT。


    ### 游戏与虚拟世界


    基于区块链的虚拟现实游戏行业在早期就意识到了 NFT 的巨大潜力。首先是 Decentraland 和 Cryptovoxels 项目，它们允许以 NFT
    的形式购买和拥有虚拟土地。在这些虚拟游戏世界中，创建了具有虚拟城市和景观的新数字生态系统。


    基于区块链虚拟现实领域的另一个先驱是 [Enjin.](https://enjin.io/)。该项目允许以 NFT 形式的游戏道具轻松地从一个游戏转移到另一个游戏。


    ### 域名名称


    除了艺术和游戏之外，域名市场在早期阶段也适应了 NFT，通过去中心化的区块链技术提供类似于 `.com` 的域名。最著名的服务供应商以太坊命名服务（Ethereum
    Name Service）成立于 2017 年 5 月，并于 2019 年连接到了最常见的 NFT 市场。注册的 `.eth` 域名的数量稳步增长。


    另一个知名的服务供应商是 Unstoppable Domains，它发行了 `.crypto` 等域名。


    在 2018 年到 2020 年间，未来的 NFT 大规模应用奠定了许多重要基础。与此同时，NFT 已经渗透到许多其他许多领域，包括体育、电影、音乐、休闲、金融和收藏品。这些新的
    NFT 生态系统将在以后再次讨论。


    ### 以太坊对 NFT 的劣势


    尽管以太坊是最大的 NFT 平台，但它并不是每种类型 NFT 的首选。以太坊仍在应对容量限制增加的挑战。因此，NFT 的创建和交易有时会产生极高的费用。对于像
    Beeple 作品这样极具价值的 NFT，100 美元的费用可能微不足道。但对于许多想要以 100 美元到 200 美元出售作品的小型艺术家来说，如此大额费用是一个明显的障碍。


    在此背景下，几个替代区块链脱颖而出，巧妙地填补了这一市场空白。根据 NFT 的使用场景，还有合适的 NFT 区块链承诺提供更快、更具成本效益的 NFT 交易。


    ### 当前区块链的问题


    已知的区块链不断反复出现三个问题：


    - 用户的成本

    - 交易持续时间

    - 对初学者和开发者的用户体验


    为了解决这些问题，区块链需要押注更好的可扩展性。这要么以牺牲开发者为代价（因为编程变得困难得多），要么通过放弃去中心化。


    ### 2. [FLOW](https://www.onflow.org/): 以太坊的替代方案


    在专家中，该编程语言被认为对开发者特别友好。因此，越来越多的开发者转向 Flow 区块链并进行优化。同时，网络中的命令被分解为单独的任务，然后可以被并行处理。这提高了计算能力的效率；网络变得更具可扩展性。


    #### Flow 是如何工作的？


    Flow 使用质押模型，验证者必须部署一定数量的 `FLOW` 令牌才能参与网络。


    然而，验证的工作方式在区块链中是独一无二的，Flow 将任务拆分为四个类型，所有四种节点类型都参与每笔交易的验证。


    根据 Dapper 的说法，分任务使得处理比竞争区块链更高效。这是分片的替代方案，通过分布区块链的存储和计算需求。Flow 不使用分片。通过这种方式，Dapper
    认为 Flow 保持了交易的原子性、一致性、隔离性和持久性（ACID），并允许在他人工作的基础上构建。


    Flow 还拥有可更新的智能合约，允许对智能合约进行部署并在变为不可变之前进行修复。


    Dapper Labs 用多样化的网络进行说服。知名投资者早期加入并共同资助了开发。其中包括华纳音乐集团和投资者安德森·霍罗维茨（Andreessen Horowitz）。同时，他们已经在与美国篮球联盟
    NBA 进行紧密合作。UFC 或游戏开发商 Ubisoft 也是合作伙伴，其中包括 Coinbase 和三星。


    #### 使用 SpoCKs 技术代替共识


    Flow 使用了新的加密方法专用机密证明（`SpoCKs`）。该技术由 Flow 团队开发并发表在特殊的技术文档中。通过 `SpoCK`，任何数量的第三方观察实例都可以证明他们访问了相同的机密。证据中没有关于机密内容的信息，并且是交互式的。


    每个 `SpoCKs` 都是为开发者量身定制的，网络上的任何其他开发者无法复制或伪造。基本上，该技术要求执行和验证节点证明它们的知识。这些知识只能通过执行分配给它们的交易来获得。


    '
