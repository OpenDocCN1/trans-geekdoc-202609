    CryptoKitties 追踪了 NFT，但如果没有此前为创建独特数字资产奠定基础的项目，它们是无法做到的。这张由 `Nonfungible.com` 发布的趣味图表展示了
    CryptoKitties 对现有 NFT 生态系统有多么重要。


    该表格显示，拥有 CryptoKitties 的人倾向于玩其他 NFT 游戏，而玩其他 NFT 游戏的人往往不会扩展到其他游戏。CryptoKitties
    是进入 NFT 世界的完美门户。


    由于可以繁育不同的猫来产生完全全新的猫或 `ERC721` 代币的功能，CryptoKitties 可能也经历了巨大的增长。现在 NFT 有着无穷无尽的功能，包括角色名称（类似于域名）、虚拟土地规划、虚拟服装、活动入场券、小行星采矿资源等。


    ## 2020 年 12 月 – 虚拟 F1 赛道创下 223,000 美元支付记录


    NFT 热潮达到了一个新高度。仅虚拟赛道的一个部分就被拍出了 223,000 美元。


    基于区块链的游戏赛道部分已以 900 万 `REVV` 代币拍卖出售。由 `Animoca Brands` 开发的 `F1 Delta Time` 游戏中的赛道是摩纳赛道，这对一级赛粉丝来说特别有名。该公司确认，赛道的一部分已以
    NFT 形式出售。


    拍卖获胜者使用 `Animoca` 的代币 `REVV` 支付了摩纳赛道的一部分。`9,081,752` `REVV` 代币相当于约 375.56 `Ethereum`。大约是
    223,000 美元。


    与许多加密货币不同，NFT 的凭证存储在智能合约中。这些信息证明了每个 NFT 都是不同且独特的。这使得它们成为“独特代币 NFT”。NFT 可以代表任何可以数字化的事物。从艺术品到游戏内产品，可以创建许多
    NFT。因此，由于这些产品具有独特、不可更改且不可复制的特性，价格可以达到高额金额。


    ### 赛道的虚拟道路被分为 330 段并出售


    `F1 Delta Time` 用 NFT 代表了游戏中所有的关键资产。摩纳赛道的虚拟道路被划分为 330 段并出售。许多点位供出售，从弯道中最常用的区域
    `Apex`（顶点）到最稀有的使用区域。


    这笔售价为 223,000 美元的 NFT 属于顶点区域，它将为所有者提供每个游戏交易费的 5% 份额，以及玩家从投入资金获得的质押收益的 4.2% 份额。支付将使用
    `Animoca` 的 REVV 代币进行：


    据了解，在 `OpenSea` 上以纪录价格买下这部分赛道的人，与 2019 年在同一款游戏中花费 1110 亿美元购买一辆独特虚拟赛车的人是同一个人。他在上个月的一次采访中说：“NFT
    的价值隐藏在它们自己的故事中。”有价值的资产一直故事。“显然，汽车底下的神秘吸引了其他人，”他说。


    ## 当前的 NFT 场景


    NFT 的用例几乎是无尽的。事实上，非同质化代币可以作为基于区块链技术的新数字经济的基础。在 NFT 的帮助下，现实世界可以与数字世界融合。除了在专属数字空间描绘稀缺性和独特之外，这还极大地促进了现实世界物体和资产向虚拟世界的数字化过程。


    ## 1.3 今天 NFT 最大的应用是什么？


    我们将在本书的后部分详细介绍 NFT 的应用。虽然 NFT 的起源可以追溯到 2012 年，但它们直到 2021 年初才爆发进入主流。这部分归功于 `DeFi`
    的兴起以及 NFT 的几种潜在应用。2020 年的巨大挑战之一是向我们的祖父母解释如何处理社交平台，现在我们需要找到一种方法来解释另一个日益流行的话题：NFT
    以及其他影响品牌和营销世界的“加密现象”——在这些现象震动了金融界之后。


    但让我们向后退一步，定义一下什么是 NFT：`Non-Fungible Tokens`（非同质化代币）。非同质化本质意味着它是独特的——简而言之，就是艺术品的数字等价物。NFT
    指任何可以数字化的内容类型：视频、音乐、GIF、3D 对象、图像、游戏、文本、迷包甚至一条推文，你还记得吗？


    这些数字内容收集在区块链中，根据其本质，它允许任何人查看谁拥有该代币（或展示所有权，例如当你邀请某人查看你的收藏品时，如果有的话）。


    事实上，有很多市场，选择正确的市场来寻找或出售某些物品非常重要。例如，有一些非常私密的市场，只有被邀请出售作品的人才能访问；然后是“开放市场”，每个人都可以尝试出售自己的数字内容。还有一些市场，出售的作品是由平台策展人挑选的——就像“传统艺术”世界一样。


    一些最著名的市场是 `SuperRare`、`Nifty` 和 `OpenSea`。


    很清楚，与任何现象一样，有些品牌与这种的关系更为自然，而另一些品牌与这个世界的联系初看之下可能没那么直接。这里有三个可能非常有趣的场景，在我们看来，这些场景代表了品牌不容小觑的机会。


    ### 体育：先驱者


    体育品牌是进入 NFT 世界最早且速度最快的一批。


    NBA 在过去已经证明它能够识别并预判各种趋势，这次也没有花费多长时间：通过一个特殊平台——`NBAtopshot`——收藏家们花费了超过 3 亿亿美元购买带有他们最喜欢的球员精彩动作的短视频。


    每个人都有独特的特征——从外貌到教育背景再到我们的医疗史。非同质化代币使得这种身份代币化成为可能。因此，关于一个人的所有数据都可以以 NFT 的形式呈现，人们可以重新获得对数据的控制。每个
    NFT 的独特性是体育行业试图利用的资本。


    Nike 也迅速加入了 NFT 的行列，通过 `CryptoKicks` 触达了活跃的球鞋爱好者（Snehead）社区。这本质上是将每只鞋链接到独特的数字身份的能力（因此，可以通过区块链验证运动鞋的真伪——鉴于限量版运动鞋市场的价值，这是一个日益热门的话题）。


    ### 收藏品


    正如你通过 CryptoKitties、幻想足球游戏 `Sorare` 或来自 `Dapper Labs` 的 `NBA Top Shot` 所看到的，NFT
    已经用于创建全新类型的收藏品。例如，`Sorare` 允许你购买喜欢的球员的代币版本。其原理与许多人小时候知道的帕尼收藏卡片非常相似。同样的原理现在被应用于数字世界，以数字收藏品的形式代表了对收藏卡的所有权。


    ### 音乐与艺术


    在数字世界中，艺术家保护自己的版权和赚钱往往是一场噩梦。通过 NFT，某人可以购买艺术品并在虚拟空间中展示，由区块链证明所有权。艺术家因此可以保护自己的版权，并确保在利润中获得更大的份额。此外，还可以配置
    NFT 以创造一种持续的收入来源，在 NFT 的后续每次交易中你都可以从中受益。最近，一些 NFT 已经卖出了数十万美元，许多人预计艺术 NFT 领域未来将巨大增长。

    '
