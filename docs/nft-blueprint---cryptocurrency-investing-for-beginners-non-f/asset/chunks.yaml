    CryptoKitties have been around since November 2017. They soon became a sensation
    and in the meantime around 200,000 US dollars were offered for particularly rare
    cats. Transactions have already been made over several million dollars. The official
    website calls the cats roughly translated into crypto exchange goods. Every digital
    cat that is exchanged is unique and belongs 100% to owner, it also says. It cannot
    be duplicated, stolen or destroyed.


    ## How to purchase CryptoKitties?


    CryptoKitties are purchased using digital wallets. According to the website, all
    digital wallets are accepted, such as MetaMask, Coinbase and Trust. You can read
    everything you need to know about wallets on our [wallets overview page.](https://www.bitcoinmag.de/x-wallet)
    In order to buy a `CryptoKitty`, there must be money in the wallet. If cats want
    to be bred, this can be done via a button next to the name of the cat. Further
    steps will then be explained in detail. For breeding, a fee of `0.008 ETH` is
    charged.


    ## Similar Games


    There are similar games based on blockchain. These include `CryptoFighters`, a
    game where rare digital battle characters can be collected on the `Ethereum` blockchain.
    The game makes it possible to fight battles and earn new warriors. Another blockchain
    game is `CryptoCelebrity`, where players can buy and sell smart contracts through
    `Ethereum`. There is only one smart contract for every famous personality.


    ## First museum appearance for CryptoKitties


    The exhibition is organized by the company `Dapper Labs`, which is owned by CryptoKitties,
    as well as the digital exhibition space `Meural` together with the Museum `ZKM`.
    `Vladimir Vukicevic`, CEO of `Meural`, explained that the company is "very pleased
    to be able to help CryptoKitties with their first museum appearance and provide
    the cats with a physical home".


    It continues: "Our product is an ideal way for crypto art enthusiasts to show
    off their collectibles in a way that lives up to their value. This makes it easy
    to present and enjoy them. By partnering with CryptoKitties for this event, we
    hope to demonstrate to the public how collecting crypto could fit into their everyday
    lives."


    ## CryptoPunks


    [CryptoPunks](http://cryptopunks/) are collectible crypto artworks and are represented
    by NFT''s on the `Ethereum` blockchain. It consists of 10,000 small, 8-bit style
    "punks", each with unique characteristics. The project inspired many crypto artists,
    even the development of the `ERC-721` token standard for digital collections.
    The project became even more popular in 2021 after some CryptoPunks sold for millions
    of dollars, making them among the most expensive NFT''s.


    At first glance, these small, square-shaped pixelated faces may not look special.
    Some of them smoke pipes. Some people have hats. Some of them are even aliens.
    But appearances can be deceptive when it comes to NFT''s. Having only one of these
    funny-looking punks can allow you to buy everything from a small apartment to
    a big mansion. Limited to 10,000 pieces, these 8-bit CryptoPunks are an NFT collection
    that is currently in huge demand. It is not possible to fight or stake them and
    they have no characteristics other than just being. CryptoPunks is also one of
    the first NFT projects.


    ### Who created CryptoPunks?


    CryptoPunks was created by New York-based `Larva Labs`, founded by `Matt Hall`
    and `John Watkinson`. The project started in 2017 as an experiment on NFT''s and
    the value of art and ultimately helped popularize what we now know as crypto art.


    Not only are they a kind of cryptocurrency, but they are quite different from
    `Bitcoin` or `BNB`. Each of the 10,000 punks is the unique NFT on the `Ethereum`
    blockchain. Of these, 3,840 are women and 6,039 are men. A few monkeys, aliens
    and zombies are also included in this collection. Combining different features
    ensures that each of the 10,000 pieces is completely unique.


    In the early days, punks were distributed for free. At that time, all that had
    to be done to have one of these punks was to pay the corresponding `Ethereum`
    transaction fee.


    Since then, the popularity of these works of art has also increased greatly with
    NFT''s in general. In fact, `Christie''s` auction house is auctioning off collections
    worth hundreds of millions.


    The Pale-Faced Alien Punk with a Band on its head has the record for being `CryptoPunk`,
    which sold for the highest price in March 2021 with `4,200 ETH` worth approximately
    USD 7.58 million. In second place is `CryptoPunk #7804`, which sold for the same
    amount of `ETH` (approximately USD 7.57 million when it went on sale).


    Generally speaking, these two ranks second and third in the ranking of unique
    tokens sold for the highest price to date. At the top of this ranking is `Beeple''s`
    `EVERYDAYS: THE FIRST 5000 DAYS`, which sold for $69,346,250.


    ### How does CryptoPunks work?


    When the project was launched, the `ERC-721` token protocol used for NFT''s today
    was not even available. In this case, all `Larva Labs` could do was work with
    what they had, `erc-20`.


    In keeping with punk culture, the team changed the `CODE ERC-20` long enough to
    produce unique products, and it inspired the `ERC-721`, which was developed shortly
    afterwards.


    If we look through `Etherscan`, we can see that the maximum total supply is 10,000.
    Although punks appear as `ERC-20` tokens, they are not actually the same.


    ## Gods Unchained


    [Gods Unchained](https://godsunchained.com/) is a decentralized competitive card
    game. Players will be able to freely trade their cards on the `Ethereum` blockchain
    without the need for any third party, just like in real life.


    The game has not yet fully started, it is expected to be released in full in the
    first quarter of 2019, but currently players can purchase genesis cards at the
    presale where Gods Unchained is held.


    ### Gods Unchained – the right thing for the NFT-loving Magic fan


    Gods Unchained is a trading card game in the spirit of `Magic The Gathering`.
    With quite good graphics and a well-thought-out gameplay, it is a quite captivating
    game, so for anyone who got the nerd stamp on his forehead in his school days
    by exchanging trading cards, this game can certainly be recommended. The graphics
    during the game can undoubtedly convince. The gameplay also if you are familiar
    with games like `Hearthstone` or `Magic the Gathering`.


    As with the previous articles about NFT investment, a `MetaMask` wallet can be
    used to manage your own Gods unchained account. With this you can not only play,
    but also participate in card trading. It should be emphasized that the first cards
    you receive cannot be sold. So there is nothing in life for free, first you have
    to buy tickets. You can buy individual cards – or, as soon as the new expansion
    is available, buy packs. The trading card player will still feel starter and booster
    packs reminded of `Magic the Gathering` and Co.


    Based on the packs that were sold during the Genesis phase, these packs will be
    available in different variants. In the Genesis phase, these were called `Rare`,
    `Epic`, `Legendary` and `Shiny Legendary`. They differed in what rare cards might
    be included.


    Currently, however, the investor is dependent on the secondary market with individual
    cards. This can be done directly on Gods unchained or partner platforms such as
    [Open Sea.](https://opensea.io/assets/gods-unchained) In both cases, the purchased
    cards, or, technically speaking, the purchased NFT tokens, are managed through
    a wallet. Again, thanks to the good connection to the browser, a `MetaMask` wallet
    is available.


    Sales of genesis cards created exclusively in presale will continue towards the
    end of this year, until the game''s start date or the targeted sale of $15 million.
    Therefore, after presale, the same cards will never be sold by Gods Unchained
    again.

    '
