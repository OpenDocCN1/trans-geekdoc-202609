    \ The Stalemate of Byzantine Generals\n\nAbove, we tried to explain blockchain\
    \ technology with technical concepts. The concept of blockchain can also be explained\
    \ through a historical problem: the Byzantine Generals' Stalemate.\n\nCompeting\
    \ with each other, the 4 Generals set out to conquer a city surrounded by strong\
    \ walls during the Byzantine Empire. Each of the 4 generals commands 4 different\
    \ armies. When each army approaches the city, it stops at 4 different points and\
    \ begins preparing attacks. The inhabitants of the city are not yet aware of the\
    \ danger that is approaching them. The Byzantines must attack the city at the\
    \ same time to leave the siege as the victor. But there is an important problem\
    \ that will determine the fate of the war. This is a communication problem.\n\n\
