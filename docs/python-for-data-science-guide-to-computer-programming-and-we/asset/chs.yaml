  \n## Python 列表列表\n\n之前介绍了列表作为每个数据点使用一个变量的可行方法。我们不需要为五个 'Facebook' 数据点（`0.0`、`'USD,'`、`2974676`、`3.5`）每一个创建一个不同的变量，可以将这些数据点连接到一个列表中，然后将列表保存到变量中。从那时起我们处理了一个包含五行的数据集，并将每行存储为每个不同变量中的集合（`row\
