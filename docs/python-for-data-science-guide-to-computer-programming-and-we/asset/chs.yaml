  \n\n\n\n# 使用 `split()` 方法\n\n此功能有助于接收多个用户输入。它会根据指定的分隔符对给定的输入进行分割。如果没有提供分隔符，则默认分隔符为空格。用户通常使用\
  \ `split()` 方法来分割 Python 字符串，但也可以在获取多个输入时使用它。\n\n**语法：**\n`input().split(separator,\
  \ maxsplit)`\n\n**示例：** ![](img/image_rsrc1FP.jpg)\n**输出：** ![](img/image_rsrc1FR.jpg)\n\
  \n# 使用列表推导式\n\n列表推导式是 Python 中描述和构建列表的一种简单方式。就像数学表达式一样，我们可以在每一行内生成列表。它在收集多个设备输入时经常被使用。\n\
  \n**示例：** ![](img/image_rsrc1FS.jpg)\n**输出：** ![](img/image_rsrc1FT.jpg)\n\n**注意：**\
  \ 上定义接收的是由空格分隔的输入。如果我们希望通过逗号（,)处理不同的输入，可以使用以下方法：\n\n### 一次性获取逗号分隔的多个输入\n```python\n\
  x = [int(x) for x in input(\"Enter multiple value: \").split(\",\")]\nprint(\"Number\
  \ of list is: \", x)\n```\n\n# 将多个值赋值给多个变量\n\n通过逗号分隔变量和值，你可以将多个值分配给不同的变量。\n\n```python\n\
  a, b = 100, 200\nprint(a) # 100\nprint(b) # 200\n```\n\n你有三个以上的变量需要委托。此外还可以分配不同的类型。\n\
  \n```python\na, b, c = 0.1, 100, 'string'\nprint(a) # 0.1\nprint(b) # 100\nprint(c)\
  \ #string\n```\n\n### 将相同的值赋值给多个变量\n\n通过连续使用 `=`，你甚至为多个变量指定相同的值。例如，当你要将多个变量初始化为几乎相同的值时，这非常有帮助。\n\
  \n```python\na = b = 100\nprint(a) # 100\nprint(b) # 100\n```\n\n在定义相同值后，另一个值也可能转换为该值。正如后文解释，在分配列表或字典等可变对象时，应该注意。\n\
  \n```python\na = 200\nprint(a) # 200\nprint(b) # 100\n```\n\n可以以相同的方式编写三个或更多。\n\n\
  ```python\na = b = c = 'string'\nprint(a) # string\nprint(b) # string\nprint(c)\
  \ # string\n```\n\n与 `int`、`float` 和 `str` 等不可变对象不同，指定 `list` 和 `dict` 等可变对象时要小心。当你连续使用\
  \ `=` 时，所有变量都被分配同一个对象，因此如果你修改了元素值或创建了新元素，其他对象也会跟着修改。\n\n```python\na = b = [0, 1,\
  \ 2]\nprint(a is b) # True\na[0] = 100\nprint(a) # [100, 1, 2]\nprint(b) # [100,\
  \ 1, 2]\n```\n\n如下所示。\n\n```python\nb = [0, 1, 2]\na = b\nprint(a is b) # True\n\
  a[0] = 100\nprint(a) # [100, 1, 2]\nprint(b) # [100, 1, 2]\n```\n\n如果你想独立地管理它们，你需要分别分配它们。在\
  \ `c = []; d = []` 之后，可以保证 `c` 和 `d` 连接到两个唯一的、新创建的、不同的列表。（注意 `c = d = []` 将同一个对象分配给\
  \ `c` 和 `d`。）这是另一个示例：\n\n```python\na = [0, 1, 2]\nb = [0, 1, 2]\nprint(a is b)\
  \ # False\na[0] = 100\nprint(a) # [100, 1, 2]\nprint(b) # [0, 1, 2]\n```\n\n\n\n\
  \n\n# Python 字符串\n\n## 在 Python 中添加字符串数据\n\n### 什么是 Python 字符串\n字符串是一个字符集。字符仅仅是一个符号。例如，英语有\
  \ 26 个字符。操作系统并不直接处理字符，它们处理的是（二进制）数字。如果你在计算机上看到字符，它们在内部被表示为 0 和 1 的混合体。从字符到数字的转换被称为编码，而解码可能是其反向过程。ASCII\
  \ 和 Unicode 是两种被广泛使用的编码。Python 中的字符串是一系列字符。Unicode 的引入是为了提供所有语言的全部字符。\n\n### 如何在\
  \ Python 中创建字符串\n字符串可以通过在单引号内封装字符，甚至在双引号内封装字符来形成。在 Python 中，也经常使用三引号来描绘多行字符串。image_rsrc1FU.jpg\
  \ 当程序执行时，输出结果为：image_rsrc1FV.jpg\n\n### 访问字符串中的字符\n通过索引（indexing）和切片（slicing），我们可以获取单个字符和字符范围。索引从\
  \ 0 开始。尝试从范围外获取字符将导致 `IndexError`。索引必须是整数。我们不能使用浮点数或其他类型，这将导致 `TypeError`。Python\
  \ 允许对其序列进行负索引。-1 对应最后一个对象，-2 对应第二个对象，以此此类推。使用切片运算符 (:)，我们可以访问字符串内部的范围项。Python 字符串访问：image_rsrc1FW.jpg\n\
  \n当我们尝试访问范围外的索引，或者我们使用整数以外的数字时，就会产生错误：`index must be in range` image_rsrc1FX.jpg\n\
  \n### 仅将字符串定义为整数\n通过分析下所示元素之间的索引，切片可以被可视化。每当我们想要获取某个范围时，我们需要一个能从中切分字符串该部分的索引。\n\n\
  ### 如何更改或删除字符串\n字符串是不可变的（unchangeable）。这意味着列表的元素不能被修改。我们将轻松地重新赋值相同术语的字符串。image_rsrc1FY.jpg\
  \ 我们无法从字符串中删除或移除字符。但使用 `del` 关键字可以完全删除该字符串。image_rsrc1FZ.jpg\n\n## Python 字符串操作\n\
  \n有很多方法可以用于字符串，使其成为常用数据类型之一。更多信息请参阅 Python 数据类型。\n\n### 两个或多个字符串的拼接\n将两个甚至多个字符串组合在一起被称为拼接（concatenation）。在\
  \ Python 中，`+` 运算符执行此操作。它们也可以通过直接将字符串字面量写在一起来拼接。对于指定的次数，可以使用 `*` 运算符来重复字符串。image_rsrc1G0.jpg\n\
  \n### 遍历字符串\n使用 `for` 循环，我们可以遍历一个字符串。这是一个统计字符串中 'l' 数量的示例。image_rsrc1G1.jpg\n\n\
  ### 字符串成员测试\n我们可以使用关键字 `in` 检查字符串内是否存在子字符串。\n```\n>>> 'a' in 'program' True\n>>>\
  \ 'at' not in 'battle' False\n```\n\n### 用于处理 Python 的内置函数\n不同的内置函数也可以与字符串序列工作。其他一些常用类型是\
  \ `len()` 和 `enumerate()`。`enumerate()` 函数返回一个 `enumerate` 对象。它包含了字符串中所有元素的索引和值的组合。这对于迭代可能很有用。相比之下，`len()`\
  \ 返回字符串长度（字符数量）。image_rsrc1G2.jpg\n\n## Python 格式化\n\n### 转义序列\n如果我们想打印像 *He said,\
  \ \"What's there?\"* 这样的文本，就不能使用单引号或双引号。这将导致 `SyntaxError`，因为文本中本身包含了单引号和双引号。\n\
  ```\n>>>print(\"He said, \"What's there?\")\nSyntaxError: invalid syntax\n>>>print('He\
  \ said, \"What's there?\"')\nSyntaxError: invalid syntax\n```\n三引号是解决问题的方法之一。可以使用转义序列作为解决方案。转义序列以反斜杠\
  \ (`\\`) 开头，表示方式不同。如果我们使用单引号来描述字符串，转义字符串内的所有单双引号是关重要的。这就是上述文本可以表示的方式。image_rsrc1G3.jpg\n\
  \n一旦执行上述代码，我们得到如下结果：\nHe said, \"What's there?\"\nHe said, \"What's there?\"\nHe\
  \ said, \"What's there?\"\n\n### 原始字符串\n经常在字符串内部，我们可能希望忽略转义序列。要使用它，可以在字符串前设置 `r`\
  \ 或 `R`。这意味着它是原始字符串，将忽略内部的任何转义序列。\n```\n>>>print(\"This is \\n example\")\nThis\
  \ is \nexample\n>>> print(r\"This is \\n example\")\nThis is \\n example\n```\n\n\
  ### 用于格式化字符串的 format() 方法\n`format()` 方法在字符串格式化中非常灵活且强大。格式字符串包含花括号 `{}` 作为占位符或字段。要指定序列，可以使用位置参数或关键字参数。`format()`\
  \ 技术具有可选性。使用冒号 (`:`) 可以左对齐 (`<`)、右对齐 (`>`) 或居中 (`^`)。我们可以将整数格式化为十六进制，浮点数也可以这样显示。image_rsrc1G4.jpg\n\
  \n### 旧式格式化\n我们甚至可以使用 `%` 运算符以旧式格式化字符串。image_rsrc1G5\n\n### Python 方法\n字符串对象带有各种方法。其中之一是\
  \ `format()` 方法。其他一些常用的方法包括 `lower()`、`upper()`、`join()`、`split()` 等。image_rsrc1G6.jpg\n\
  \n### 将值插入字符串\n#### 方法 1 - 字符串方法\n字符串方法可以用于创建插入了值的字符串。该方法适用于所有版本。image_rsrc1G7.jpg\n\
  括号表示插入值将去的地方。你可以插入多个值和其他实体。image_rsrc1G8.jpg\n\n在花括号内使用格式，你可以对数字和字符串进行更复杂的格式化。此过程允许我们使用花括号或\
  \ format 标识符进行格式。image_rsrc1GA\n\n#### 方法 2 - Python >=3.6 中的 f-strings\n你可以可以使用新的\
  \ `f-string` 格式化字符串。在字符串开头，`f` 通知 Python 允许字符串内的任何有效变量名。这里是上面的示例 image_rsrc1GB\n\
  \n#### 方法 3 - 旧式 % 格式化\n似乎有一种使用百分比运算符的旧字符串工具它不如其他选项灵活，但你仍然可以在旧代码中看到它。格式化 `%` 运算符，注意用于字符串的\
  \ `%s` 标记和整数的 `%d` 标记。image_rsrc1GC\n\n# 模块数据\n\n### 什么是 Python 模块？\n当你离开并重新进入 Python\
  \ 解释器时，你定义的函数和变量将会丢失。因此，如果你想编写较长的代码，最好使用文本编辑器为解释器规划输入并以该文件作为输入执行。这被定义为脚本。随着软件扩大，你可能希望将其拆分为不同的文件以简化维护。你可能还喜欢使用在程序中编写的方便函数，而无需在每个程序中复制其定义。为了帮助这一点，Python\
  \ 提供将定义放入文件并在解释器代码或交互实例使用的选项。此文件被视为模块；模块描述可以加载到特定模块或主模块（你在高级脚本和转换模式下接触到的变量列表）。\n\
  \n### 定义模块\n模块是一个包含 Python 定义和语句的文件。文件名是带有 `.py` 后缀的模块名。模块内部的模块名（仅作为字符串）作为其全局变量\
  \ `__name__` 的值可用。例如，使用你喜欢的文本编辑器在当前工作目录下创建一个名为 `fibo.py` 的文件，内容如下 image_rsrc1GD\n\
  \n在这里，我们在名为 \"module\" 的示例中定义了一个 `add()` 函数。该函数需要两个数字并返回它们的总和。\n\n### 如何在 Python\
  \ 中导入模块\n在模块内部，我们可以将定义导入到其他模块甚至是交互式 Python 解释器。要执行此类操作，我们使用 `import` 关键字。要加载我们最近指定的示例模块，请在\
  \ Python 提示符输入：\n```\n>>> import example\n```\n这不应该直接在现有的符号表中导入示例中定义的函数标识。它只是在那里导入了模块名的一个示例。使用模块名，我们可以使用点\
  \ (`.`) 运算符来访问函数。例如：\n```\n>>> example.add(4,5.5)\n9.5\n```\nPython 带有许多常规模块。使用\
  \ `import` 语句可以格式化这些。image_rsrc1GE\n\n#### 导入语句\n使用 `import` 语句可以格式化这些。image_rsrc1GE\
  \                          \n \n一旦执行上述代码，我们得到如下结果：image_rsrc1GF\n\n#### 重命名导入\n\
  我们可以通过重命名的方式来加载模块。image_rsrc1GF\n\n#### 导入语句\n我们可以通过 `from` 语句导入特定的名称。image_rsrc1GG\n\
  ```\n>>> from math import pi\n>>> pi\n3.141592653589793\n```\n\n#### 导入所有名称\n使用以下形式：\n\
  ```\nfrom math import *\nprint(\":\", pi)\n3.141592653589793\n```\n\n### 模块搜索路径\n\
  Python 在导入模块时会查看许多位置。如果不在内置模块中，Python 将在 `sys.path` 指定的目录集中搜索。\n\n#### PYTHONPATH\n\
  `PYTHONPATH` 环境变量允许我们自定义该列表 image_rsrc1GH\n\n### 重载模块\n在会话期间，Python 解释器只需要导入一次模块。这使得处理更有效率。这里有一个显示如何操作的示例。假设我们在名为\
  \ `my_module` 的模块中获取代码 image_rsrc1GJ\n\n现在我们怀疑多次导入有影响：\n```\n>>> import my_module\n\
  >>> import my_module\n```\n这段代码执行了一次。这意味着我们的模块只被导入了。同样，如果在测试过程中修改了我们的模块，我们需要重启它。这样做的方法是使用\
  \ `reload`。Python 提供了一种有效的方法。在 `imp` 模块中，我们可以使用 `reload()` 函数来重启模块。这里是它的它的方法：\n\
  ```\n>>> imp\nimport my_module\n>>> imp.reload(my_module)\n```\n这段代码执行 `<module\
  \ 'my_module' from '...'>`。\n\n### dir() 内置函数\n我们可以使用 `dir()` 函数定位模块内的名称。对于此类情况，在早期部分的模块示例中，我们描述了一个函数\
  \ `add()`。在示例模块中，我们可以在以下场景中使用 `dir` image_rsrc1GK\n现在我们看到一组排序后的名称列表（带有 add）。许多其他以下划线开头的名称是模块关联的（非用户定义的）默认属性。例如属性名包含\
  \ `__name__`。\n```\n>>> import example\n>>> example.__name__\n'example'\n```\n通过不带参数使用\
  \ `dir()` 函数，可以发现我们现有命名空间中的所有名称 image_rsrc1GM\n\n\n\n\n\n# Python 概述\n\n* 为了最小化编译后文件的大小，你可以在\
  \ Python 命令中使用 `-O` 或 `-OO` 关。`-O` 关会删除 `assert` 语句，`-OO` 关会删除 `assert` 语句以及 `doc`\
  \ 字符串。尽管某些代码可能支持启用这些选项，但只有在在你清楚自己在做什么时才应该使用此方法。“优化过的”模块通常具有此类优化标签，并且体积更小。未来的版本可能会修改优化控制的影响。\n\
  * 项目一旦从 `a.pyc` 文件读取，其运行速度并不比从 `a.py` 文件读取时更快；`.pyc` 文件唯一的一点是，它们的加载速度更快。\n* 编译所有模块可以为目录下的所有其他模块生成\
  \ `.pyc` 文件。\n* 关于此过程的更多细节请参见 `PEP 3147`，其中还附有决策流程图。\n\n## 标准模块\n\nPython 拥有一个标准模块库，在单独的章节“Python\
  \ 库引用”（以下简称“库参考”）中有所提到。少数模块被集成到解释器中；它们直接暴露了并非语言基础部分但却是内置的过程，无论是为了效率，还是为了提供对底层操作系统（如源码调用）的访问。这些模块的集合是自定义的替代方案，并且依赖于底层框架。例如，`winreg`\
  \ 模块仅在 Microsoft Windows 上可用。有一个特定的模块值得关注：`sys`，它集成在每个 Python 解释器中。`sys.ps1` 和 `sys.ps2`\
  \ 变量用于分类作为主、次指令的字符串：\n\n```\n>>> import sys\n>>> sys.ps1 '>>> '\n>>> sys.ps2 '...\
  \ '\n>>> sys.ps1 = 'C> '\nC>print('Yuck!')\nYuck! C>\n```\n只有当解释器处于交互模式时，这两个变量才定义。`sys.path`\
  \ 变量是一个字符串集合，定义了解释器使用的模块搜索路径。当 `PYTHONPATH` 不在集合中，它将被定义为来自 `PYTHONPATH` 环境变量或内置默认值的定义路径。你可以使用常规列表程序更改它：\n\
  \n```\n>>> import sys\n>>> sys.path.append('/python/ufs/guido/lib/')\n```\n\n##\
  \ 包\n\n包确实是一种通过使用“模块的点状名称”构建 Python 模块命名空间的方法。例如，在一个名为 `A.` 的包中，模块标题 `A.B` 指定了名为\
  \ `B` 的子模块。即使使用模块可以防止各种模块的编写者停止了解对方的全局变量名，但任何对点模块名的使用都防止了 `NumPy` 或 `Pillow` 等多模块包的开发者需要过多担心对方的模块名称。\n\
  \n考虑创建一系列模块列表（一个“包”）以相同的方式处理音频文件和音频数据。有几种不同的音频文件通常以其扩展名为人熟悉，例如：`.wav`、`.aiff`、`.au`，你需要构建并维护一个巨大的模块集合来在某些多种文件格式之间转换。你可能还喜欢在音频数据上运行其他几种不同的操作（如混音、添加回声、实现均衡器函数、产生光学立体声效果），你只需要编写无限系列的任务模块来执行这些干预即可。这里是另一种可行的包布局（用分级文件系统描述）：![](img/image_rsrc1GN.jpg)\n\
  \n在加载包时，Python 会通过 `sys.path` 上的文件夹检查包子目录。为了让 Python 将包含文件的目录视为包，需要 `__init__.py`\
  \ 文件。这保护了具有相同名称（包括字符串）的目录不会意外隐藏有效模块，这些模块稍后主要出现在模块的搜索路径上。在正确的顺序下；`__init__.py` 可以是一个空文件，但也可以实现包预处理代码或建立下文描述的变量\
  \ `__all__`。\n\n### 导入模块\n\n* 包用户甚至可以从包中导入单个模块，例如：`import sound.effects.echo`\n\
  * 这加载了 `sound.effects.echo` 子模块。必须提到它的全名：`sound.effects.echo.echofilter(input, output,\
  \ atten=4, delay=0.7)`\n* 另一种导入子模块的方法是：`from sound.effects import echo`\n* 因此，它启动了子模块\
  \ `echo` 并提供了不带包前缀的访问：`echo.echofilter(input, output, atten=4, delay=0.7)`\n* 另一个选项是显式导入所需的函数或属性：`from\
  \ sound.effects.echo import echofilter`\n* 这再次激活了 `echo` 子模块，但它显式允许访问其 `echofilter()`\
  \ 功能：`echofilter(input, output, delay=0.7, atten=4)`\n\n所以它加载了子模块 `echo`；然而这倾向于使其函数；请记住，在使用\
  \ `from package import object` 时，该对象将是包的子模块（或子包）或包中描述的任何其他名称，例如函数、类或变量。最初，导入语句分析该对象是否在包中被表征；否则，它假设它是一个模块并尝试加载它。一旦无法到达它，将抛出\
  \ `ImportError` 异常。参考此点，在使用如 `import item.subitem.subsubitem` 的语法时，每个项都必须是包，但最后一个项；最后一个项可以是模块或包，但不能是上一个项中定义的类或函数或变量。\n\
  \n## 结论\n\n几乎所有领域的研究都变得更加数据导向，这影响了就业机会和所需的技能。随着更多数据和评估数据的方法变得易于获取，经济、社会和生活中依赖数据的方面也越来越多。每当提到数据科学时，Python\
  \ 都是一个具有各种优势的必要工具。它是灵活的，并且由于是开源的，正在不断改进。Python 已经拥有许多宝贵的库，而且不能忽视它可以与其它语言（如 `Java`）以及当前框架相结合。简而言之——Python\
  \ 是数据科学的一种神奇方法。\n\n"
