    | 运算符 | 含义 | 示例 |

    | --- | --- | --- |

    | And | 如果两个操作数均为真，则为真 | `x` and `y` |

    | Or | 如果其中一个操作数为真，则为真 | `x` or `y` |

    | Not | 如果操作数为假，则为真（取操作数的反） | `not x` |


    ## 位运算符

    位运算符的运行方式就像是将操作数转换成了二进制位字符串。它们按位进行工作，因此得此名。例如，在二进制中 2 是 `10`，二进制 7 是 `111`。


    ## 赋值运算符

    Python 语言的赋值运算符用于为变量赋值。`a = 5` 是一个简单的赋值运算符，将变量 ``a`` 右侧的值 `5` 赋值给其左侧。在 Python
    中，有各种复合运算符，例如 `a += 5`，它对变量进行加法的同时进行赋值。这等同于 `a = a + 5`。


    ## 特殊运算符

    Python 语言提供了其他不同类型的运算符，例如标识运算符或成员运算符。下面提到了这些的示例。


    ### 标识运算符

    `Is` 和 `is not` 是 Python 标识运算符。它们用于测试两个值或变量是否位于同一个内存区域。两个相等的变量并不意味着它们是等价的。


    ### 成员运算符

    用于检查序列（如字符串、列表、元组、集合和字典）中是否存在某个值/变量的运算符。如果在列表中找到变量，这些运算符返回 `True`，否则返回 `False`。


    ## 表达式

    表达式是值、变量、运算符和函数调用的混合。表达式必须经过求值。当你要求 Python 打印一个短语时，解释器将评估表达式并显示输出。


    ## 算术转换

    当下文算术运算符解释使用“数值参数被转换为公共类型”这一短语时，这意味着内置模式下运算符的执行方式如下：


    - 如果一个操作数是复数，则另一个被转换为复数；

    - 如果另一个操作数是浮点数，则另一个参数被转换为浮点数；

    - 否则，两者都将是整数，不需要转换。


    ## 原子

    原子是最重要的表达式组件。最小的原子是字面量或抽象标识。包含在括号、中括号或大括号中的形式在语法上称为原子。


    原子的语法为：

    ```

    atom ::= identifier | enclosure | literal

    enclosure ::= list_display | parenth_form | dict_display | set_display

    ```


    ### 标识符（名称）

    名称是作为原子出现的标识符。请参见“词法描述”、“标识符与关键字”章节，并查看“命名与绑定”分组以了解文档的命名和绑定。当名称与实体连接时，通过评估原子可以产生该实体。当名称未连接时，尝试评估它将引发
    `NameError` 异常。


    ### 字面量

    Python 提供了不同类型的逻辑、字符串、字节以及数值字面量：

    ```

    literal ::= string literal | bytes literal | integer | float number | image number

    ```

    对字面量的求值将产生该类型的对象（字节、整数、浮点数、字符串、复数）。在浮点数和虚数（复数）字面量的情况下，值可以是近似的。


    ### 括号形式

    括号类型是表达式中可用的括号集合：

    ```

    parenth_form ::= "(" [starred_expression] ")"

    ```

    带括号的表达式列表将产生表达式列表产生的任何结果：如果列表包含至少一个逗号，它会产生一个元组。如果没有，它将产生形成表达式列表的唯一表达式。一对空括号会生成一个不完整的元组对象。由于所有元组都是不可变的，适用规则与字面量相同（即：两个空元组的出现是否产生产生相同的实体）。


    ### 列表、集合和字典的显示

    为了构建列表，Python 使用具有特定语法的序列或字典，称为“显示（displays）”，每种显示相互互补：


