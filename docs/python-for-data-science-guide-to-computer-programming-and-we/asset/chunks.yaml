    ''m'' means the index number of both the slice''s 1st element; and ''n'' symbolizes
    the index number of the slice''s last element in addition to one (if the last
    element seems to have index number 2, after which `n` is 3, if the last element
    seems to have index number 4, after which `n` is 5, and so on). ![](image_rsrc1F9.jpg)


    When we want to choose the 1st or last ‘x’ elements (`x` represents a number),
    we may use even less complex shortcuts for syntax:

    - `a_list[:x]` when we need to choose the first `x` elements.

    - `a_list[-x:]` when we need to choose the last `x` elements. ![](image_rsrc1FA.jpg)


    See how we retrieve from the first row the first four elements (with Facebook
    data):

    ```python

    first_4_fb = row_1[:4]

    print(first_4_fb) # [''Facebook'', 0.0, ''USD'', 2974676]

    ```

    From the same row, the last three elements are:

    ```python

    last_3_fb = row_1[-3:]

    print(last_3_fb) # [''USD'', 2974676, 3.5]

    ```

    In the fifth row (data in the row for Pandora) with elements third and fourth
    are:

    ```python

    pandora_3_4 = row_5[2:4]

    print(pandora_3_4) # [''USD'', 1126879]

    ```


    ## Python List of Lists


    Lists were previously introduced as a viable approach to using one variable per
    data point. Rather than having a different variable for any of the five ''Facebook''
    data points, `0.0`, `''USD,''`,2974676`, `3.5`, we can connect the data points
    into a list together and then save the list in a variable. We have worked with
    a data set of five rows since then and have stored each row as a collection in
    each different variable (`row 1`, `row 2`, `row 3`, `row 4`, and `row 5` variables).


    Even so, if we had a data set of 5,000 rows, we would probably have ended up with
    5,000 variables that will create our code messy and nearly difficult to work with.
    To fix this issue, we may store our five variables in a unified list: ![](image_rsrc1FB.jpg)


    As we''re seeing, the data set is a list of five additional columns (`row 1`,
    `row 2`, `row 3`, `row 4`, and `row 5`). A list containing other lists is termed
    a set of lists. The `dataset` variable is already a list, which indicates that
    we can use the syntax we have learned to retrieve individual list elements and
    execute list slicing. Under, we have:


    - Use `dataset[0]` to locate the first list element (`row 1`).

    - Use `dataset[-1]` to locate the last list element (`row 5`).

    - Obtain the first two list elements (`row 1` and `row 2`) utilizing `dataset[:2]`
    to execute a list slicing![](image_rsrc1FC.jpg)


    Often, we will need to obtain individual elements from a list that is a portion
    of a list of lists — for example; we might need to obtain the rating of 3.5 from
    the data row `[''FACEBOOK'', 0.0, ''USD'', 2974676, 3.5]`, which is a portion
    of the list of data sets. We retrieve 3.5 from data set below utilizing what we
    have learnt:


    - Using `dataset[0]`, we locate `row_1`, and allocate the output to a variable
    named `fb_row`.

    - `fb_row[''Facebook'', 0.0, ''USD'', 2974676, 3.5]` outputs, which we printed.

    - Using `fb_row[-1]`, we locate the final element from `fb_row` (because `fb_row`
    is a list), and appoint the output to a variable called `fb_rating`.

    - Print `fb_rating`, outputting 3.5![](image_rsrc1FD.jpg)


    Earlier in this example, we obtained 3.5 in two steps: `dataset[0]` was first
    retrieved, and `fb_row[-1]` was then retrieved. There is also an easy way to get
    the same 3.5 output by attaching the two indices (`[0]` and `[-1]`); the code
    `dataset[0][-1]` gets 3.5![](image_rsrc1FE.jpg)


    Earlier in this example, we have seen two ways to get the 3.5 value back. Both
    methods lead to the same performance (3.5), but the second approach requires fewer
    coding, as the steps we see from the example are elegantly integrated. As you
    can select an alternative, people generally prefer the latter. Let''s turn our
    five independent lists in the list of lists:

    ```python

    app_data_set = [row_1, row_2, row_3, row_4, row_5]

    print(app_data_set)

    ```[[image_rsrc1FF.jpg]]


    ## List Processes by Repetitive method


    Earlier, we had an interest in measuring an app''s average ranking in this project.
    It was a feasible task while we were attempting to work only for three rows, but
    the tougher it becomes, the further rows we add. Utilizing our tactic from the
    beginning, we will:


    1. Obtain each individual rating.

    2. Take the sum of the ratings.

    3. Dividing by the total number of ratings.

