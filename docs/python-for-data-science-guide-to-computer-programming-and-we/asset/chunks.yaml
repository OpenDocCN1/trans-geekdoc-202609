    # Python Overview


    * To minimize the size of a compiled file, you can use the `-O` or `-OO` switches
    in the Python order. The `-O` switch erases statements of `assert`, the `-OO`
    switch removes statements of `assert` as well as strings of `doc`. Although some
    codes may support getting these options available, this method should only be
    used if you are aware of what you are doing. "Optimized" modules usually have
    such an opt-tag and are tinier. Future releases may modify the optimal control
    implications.

    * A project run no faster once it is read from `a.pyc` file than how it was read
    from `a.py` file; just one thing about.`pyc` files that they are faster in the
    speed with which they will be loaded.

    * A compile all modules can generate `.pyc` files in a directory for all of the
    other modules.

    * More details on this process are given in `PEP 3147`, along with a flow chart
    of the decision making.


    ## Standard Modules


    Python has a standard modules library, mentioned in a separate section, the Python
    Library allusion (hereafter "Library Reference"). A few modules are incorporated
    into the interpreter; that provide direct exposure to processes that are not component
    of the language''s base but are nonetheless built-in, whether for effectiveness
    or to supply access to primitive operating systems such as source code calls.
    The collection of these modules is an alternative to customize and also relies
    on the framework underlying it. The `winreg` module, for instance, is only available
    on Microsoft windows. One particular module is worthy of certain interest: `sys`,
    which is integrated into every Python interpreter. The `sys.ps1` and `sys.ps2`
    variables classify strings which are used as primary and secondary instructions:


    ```

    >>> import sys

    >>> sys.ps1 ''>>> ''

    >>> sys.ps2 ''... ''

    >>> sys.ps1 = ''C> ''

    C>print(''Yuck!'')

    Yuck! C>

    ```

    Only when the interpreter is in interactive mode are those two variables defined.
    The `sys.path` variable is a collection of strings that defines the search path
    for modules used by the interpreter. When `PYTHONPATH` is not a part of the set,
    then it will be defined to a predefined path taken from either the `PYTHONPATH`
    environment variable or through a built-in default. You can change it with regular
    list procedures:


    ```

    >>> import sys

    >>> sys.path.append(''/python/ufs/guido/lib/'')

    ```


    ## Packages


    Packages are indeed a way to construct the namespace of the Python module by using
    "pointed names of the module." For instance, in a package called `A.`, the module
    title `A.B` specifies a submodule named `B`. Even as the use of modules prevents
    the writers of various modules from stopping to know about the global variable
    names of one another, any use of dotted module names prevents the developers of
    multi-module bundles like `NumPy` or `Pillow` from needing to worry more about
    module names of one another.


    Consider making a series of lists of modules (a "package") to handle sound files
    and sound data in an even manner. There are several various programs of sound
    files usually familiar with their extension, for example: `.wav`, `.aiff`, `.au`,
    though you''ll need to build and maintain a massive collection of modules to convert
    between some of the multiple formats of files. There are several other different
    operations that you may like to run on sound data (such as blending, adding echo,
    implementing an equalizer function, producing an optical stereo effect), and you''ll
    just be writing an infinite series of modules to execute those interventions.
    Here is another feasible package layout (described in terms of a hierarchical
    file system): ![](image_rsrc1GN.jpg)


    While loading the bundle, Python checks for the packet subdirectory via the folders
    on `sys.path`. To allow Python view directories that hold the file as packages,
    the `__init__.py` files are needed. This protects directories with a common name,
    including string, from accidentally hiding valid modules, which later appear mostly
    on the search path of the module. In the correct order; `__init__.py` can only
    be a blank file, but it could also implement the package preprocessing code or
    establish the variable `__all__` described below.


    ### Importing Modules


    * Package users could even upload individual modules from the package, such as:
    `import sound.effects.echo`

    * This loads the `sound.effects.echo` sub-module. Its full name must be mentioned:
    `sound.effects.echo.echofilter(input, output, atten=4, delay=0.7)`

    * Another way to import the submodule is: `from sound.effects import echo`

    * It, therefore, launches the sub-module `echo` and provides access but without
    package prefix: `echo.echofilter(input, output, atten=4, delay=0.7)`

    * And just another option is to explicitly import the desired function or attribute:
    `from sound.effects.echo import echofilter`

    * This again activates the `echo` sub-module however this enables its `echofilter()`
    feature explicitly accessible: `echofilter(input, output, delay=0.7, atten=4)`


    So it heaps the sub-module `echo`; however this tends to make its function; remember
    that the object will either be a sub-module (or sub-package) of the package or
    any other name described in the package, such as a function, class or variable
    while using `from package import object`. Initially, the import statement analyses
    if the object is characterized in the package; otherwise, it supposes that it
    is a module and makes an attempt to load it. Once it fails to reach it, an exception
    to `ImportError` will be promoted. Referring to this, while using syntax such
    as `import item.subitem.subsubitem`, each item has to be a package, but the last
    one; the last item could be a module or package, but this cannot be a class or
    function or variable identified in the previous item.


    ## Conclusion


    Research across almost all fields has become more data-oriented, impacting both
    the job opportunities and the required skills. While more data and methods of
    evaluating them are becoming obtainable, more data-dependent aspects of the economy,
    society, and daily life are becoming. Whenever it comes to data science, Python
    is a tool necessary with all sorts of advantages. It is flexible and continually
    improving because it is open-source. Python already has a number of valuable libraries,
    and it cannot be ignored that it can be combined with other languages (like `Java`)
    and current frameworks. Long story short -Python is an amazing method for data
    science.

