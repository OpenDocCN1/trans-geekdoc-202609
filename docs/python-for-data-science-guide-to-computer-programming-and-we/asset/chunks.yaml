  trans: "\n\n# Python 基础\n你可以通过 5 个简单的步骤获取关于 Python 编程语言的所有知识。\n\n## 第一步：练习 Python\
    \ 基础\n一切都始于某个。第一步是学习 Python 编程的基础。你总是想要对数据科学的介绍。`Jupyter Notebook` 预装了 Python\
    \ 库来帮助你理解这两个因素，这使其成为你在旅程早期就可以开始使用的核心资源之一。\n\n## 第二步：尝试实践微型 Python 项目\n我们坚信通过实践上手来学习。尝试编写诸如网络游戏、计算器或获取你所在地区\
    \ Google 天气的软件。创建这些微项目可以帮助你理解 Python。这类项目对于任何编程语言来说都是标准的，也是加强实践知识极佳方法。你将获得更高级的\
    \ `API` 知识，并继续使用高级技术进行网页爬取。这将使你更有效地学习 Python 编程，而且网页爬取方法在以后收集数据时对你有用。\n\n## 第三阶段：学习\
    \ Python 科学计算库\nPython 可以处理任何数据。`Pandas`、`Matplotlib` 和 `NumPy` 被认为是数据科学领域最常用且最重要的三个\
    \ Python 库。`NumPy` 和 `Pandas` 对数据创建和开发非常有用。`Matplotlib` 是一个用于分析数据、创建流程图和图表的库，就像你在\
    \ Excel 或 Google Sheets 中看到的那样。\n\n## 第四步：创建作品集\n作品集对于专业数据科学家来说是绝对必不可少的。这些项目必须包含大量数据集，并为读者留下你所收集的重要视角。你的作品集没有特定的主题；找到能激发你灵感的数据，然后找到方法将它们整合在一起。展示此类项目可以为同事的数据科学家提供参考，并向未来的雇主证明你确实花了机会理解\
    \ Python 和其他核心编码技能。数据科学的优点之一是，在展示你所学技能的同时，你的作品集还兼顾了简历的作用，例如 Python 编程。\n\n## 第五步：应用高级数据科学技术\n\
    最终，目标是加强你的编程技能。你的数据科学之路将充满持续的学习，但你可以完成专门的教程，确保你精通 Python 的基础编程。你需要对回归、分组和 `k-means`\
    \ 聚类模型建立信心。你还可以通过使用 `sci-kit` 课程进入机器学习，以启动模型并创建神经网络模型。此时，开发者编程可能包括使用实时数据源创建模型。这种机器学习技术会随着推移调整其假设。\n\
    \n# Python 对数据科学有多重要？\n\n### 高效且易用\nPython 被认为是初者的工具，任何具有基础理解的学生或研究人员都可以开始使用它。在调试代码上花费的时间和资金以及对不同项目管理的限制也降到了最低。与\
    \ `C`、`Java` 和 `C#` 等编程语言相比，代码实现的时间更短，这使得开发者和软件工程师花更多的时间在算法上。\n\n### 库的选择\nPython\
    \ 提供了丰富的库以及机器学习和人工智能数据库。`Scikit-Learn`、`TensorFlow`、`Seaborn`、`Pytorch`、`Matplotlib`\
    \ 等是最流行的库。有很多关于机器学习和数据科学的在线教程视频和资源，可以轻松获得。\n\n### 可扩展性\n与 `c++`、`Java` 和 `R` 等编程语言相比，Python\
    \ 已证明自己是一种高度可扩展且更快的语言。它为解决其他计算机无法解决的问题提供了灵活性。许多公司使用它开发各种快速技术和系统。\n\n### 可视化统计与图形\n\
    Python 提供了许多可视化工具。`Matplotlib` 库提供了一个可靠的框架，`gg plot`、`pandas plotting`、`PyTorch`\
    \ 等库都是在其基础上开发的。这些服务有助于创建图表、适用于 Web 的折线图、视觉布局等。\n\n# Python 如何用于数据科学\n\n### 第一阶段\
    \ \n首先，我们需要学习并理解数据的形式。如果我们把数据看作具有数十万行列的巨大 Excel 表格，也许你应该知道如何处理它？你需要通过执行某些操作并搜索特定类型的数据，将信息收集到每一行和每一列中。完成这类计算任务可能会消耗大量的时间精力。因此，你可以使用\
    \ Python 的库，如 `Pandas` 和 `Numpy`，它们可以通过并行计算快速完成任务。\n\n### 第二阶段\n下一个障碍是获取所需的数据。由于数据并不总是易于获取，我们需要获取……`BeautifulSoup`\
    \ 允许我们从网络检索数据。\n\n### 第三阶段\n我们必须从……获取数据。`BeautifulSoup` 是……机器学习技术，为了..................\
    \ …………数据。\n\n### 第四阶段\n下一个阶段是 `Scikit-Learn`。它是为了…………数据的收集。\n\n# 库列表\n1. `Pandas`\n\
    2. `Matplotlib`\n3. `Requests`\n4. `NumPy`\n5. `SQLAlchemy`\n6. `BeautifulSoup`\n\
    7. `Pyglet`\n8. `SciPy-`\n9. `Scrapy`\n10. `PyGame`\n11. `Twisted`\n12. `Pillow`\n\
    13. `pywin32`\n14. `wxPython`\n15. `iPython`\n16. `Nose`\n17. `Flask`\n18. `SymPy`\n\
    19. `Fabric`\n20. `PyGTK`\n\n# 运算符与表达式\n在 Python 中，运算符是执行数学运算的特殊符号。运算符运行的值被称为操作数。\n\
    \n### 算术运算符\n算术运算符用于执行数学运算，如加、减、乘等。\n\n### 比较运算符\n比较运算符可以用于值的比较。根据条件，返回 True 或\
    \ False。\n\n### 逻辑运算符\n逻辑运算符有 `and`、`or`、`not`。\n\n"
- fmt: '

    | Operator | Meaning | Example |

    | --- | --- | --- |

    | And | True if both operands are true | `x` and `y` |

    | Or | True if either of the operands is true | `x` or `y` |

    | Not | True if the operand is false (complements the operand) | `not x` |


    ## Bitwise operators

    Bitwise operators operate as if they became binary-digit strings on operands.
    Bit by bit they work, and therefore the name. For example, in binary two is `10`,
    and in binary seven is `111`.


    ## Assignment operators

    Python language’s assignment operators are used to assign values to the variables.
    `a = 5` is a simple task operator assigning ‘`a`’ value of `5` to the right of
    the variable ‘`a`’ to the left. In Python, there are various compound operators
    such as `a += 5`, which adds to the variable as well as assigns the same later.
    This equals `a = a + 5`.


    ## Special operators

    Python language gives other different types of operators, such as the operator
    of the identity or the operator of membership. Examples of these are mentioned
    below.


    ### Identity operators

    `Is` and `is not` are Python Identity Operators. They are used to test if there
    are two values or variables in the same memory section. Two equal variables do
    not mean they are equivalent.


    ### Membership operator

    The operators that are used to check whether or not there exists a value/variable
    in the sequence such as string, list, tuples, sets, and dictionary. These operators
    return either `True` or `False` if a variable is found in the list, it returns
    `True`, or else it returns `False`.


    ## Expressions

    An expression is a mix of values, variables, operators, and function calls. There
    must be an evaluation of the expressions. When you ask Python to print a phrase,
    the interpreter will evaluate the expression and show the output.


    ## Arithmetic conversions

    Whenever an arithmetic operator interpretation below uses the phrase "the numeric
    arguments are converted to a common type," this means the execution of the operator
    for the built-in modes operates as follows:


    - If one argument is a complex quantity, then the other is converted to a complex
    number;

    - If another argument is a floating-point number, the other argument is transformed
    to a floating-point;

    - Or else both will be integers with no need for conversion.


    ## Atoms

    Atoms are the most important expressional components. The smallest atoms are literals
    or abstract identities. Forms contained in parentheses, brackets, or braces are
    also syntactically known as atoms.


    Atoms syntax is:

    ```

    atom ::= identifier | enclosure | literal

    enclosure ::= list_display | parenth_form | dict_display | set_display

    ```


    ### Identifiers (Names)

    A name is an identifier that occurs as an atom. See section Lexical Description
    Identifiers and Keywords and group Naming and binding for naming and binding documents.
    Whenever the name is connected to an entity, it yields the entity by evaluating
    the atom. When a name is not connected, an attempt to assess it elevates the exception
    for `NameError`.


    ### Literals

    Python provides logical string and bytes and numerical literals of different types:

    ```

    literal ::= string literal | bytes literal | integer | float number | image number

    ```

    Assessment of a literal yield with the predicted set an object of that type (bytes,
    integer, floating-point number, string, complex number). In the scenario of floating-point
    and imaginary (complex) literals, the value can be approximated.


    ### Parenthesized forms

    A parenthesized type is an available set of parentheses for the expression:

    ```

    parenth_form ::= "(" [starred_expression] ")"

    ```

    A list of parenthesized expressions yields whatever the list of expressions produces:
    if the list includes at least one comma, it produces a tuple. If not, it yields
    the sole expression that forms the list of expressions. A null pair of parentheses
    generates an incomplete object of tuples. As all tuples are immutable, the same
    rules would apply as for literals (i.e., two empty tuple occurrences does or doesn''t
    yield the same entity).


    ### Displays for lists, sets, and dictionaries

    For the construction of a list, Python uses a series or dictionary with a particular
    syntax called "displays," each in complementary strands:

