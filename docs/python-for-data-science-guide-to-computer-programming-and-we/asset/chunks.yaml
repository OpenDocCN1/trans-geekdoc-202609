    # Python String


    ## Adding string data in Python


    ### What is String in Python

    A string is a character set. A character is just a symbol. The English language,
    for instance, has 26 characters. Operating systems do not handle characters they
    handle (binary) numbers. And if you may see characters on your computer, it is
    represented internally as a mixture of 0 and 1. The transformation of character
    to a number is known as encoding, and probably decoding is the reverse process.
    ASCII and Unicode are two of widely used encodings. A string in Python is series
    of characters. Unicode was incorporated to provide all characters in languages.


    ### How to create a string in Python

    Strings may be formed by encapsulating characters or even double quotes inside
    a single quotation. In Python, even triple quotes may be used commonly to portray
    multiline strings. image_rsrc1FU.jpgWhen the program is executed, the output becomes:
    image_rsrc1FV.jpg


    ### Accessing the characters in a string

    By indexing and using slicing, we can obtain individual characters and scope of
    characters. The index commences at 0. Attempting to obtain a character from range
    will cause `IndexError`. The index has to be integral. We cannot use floats or
    other types, and this will lead to `TypeError`. Python lets its sequences be indexed
    negatively. -1 corresponds to the last object, -2 to the second object, and so
    forth. Using the slicing operator (:), we can access range of items within a string.
    Python string access: image_rsrc1FW.jpg


    When we attempt to access index out of range, or if we are using numbers other
    than integer, errors will arise: `index must be in range` image_rsrc1FX.jpg


    ### Define string as integers only

    By analyzing the index between the elements as seen below, slicing can be visualized.
    Whenever we want to obtain range, we need the index that slices the part of the
    string from it.


    ### How to change or delete a string

    Strings are unchangeable. This means elements of a list cannot be modified. We
    will easily reassign strings of the same term. image_rsrc1FY.jpgWe cannot erase
    characters from a string, or remove them. But it''s easy to erase the string completely
    using `del` keyword. image_rsrc1FZ.jpg


    ## Python String Operations


    There are many methods that can be used with string making it one of the commonly
    used data types. See Python Data Types for more information


    ### Concatenation of Two or More Strings

    The combination of two or even more strings into one is termed concatenation.
    In Python, `+` operator does that. They are likewise concatenated by actually
    typing string literals together. For a specified number of times, `*` operator
    could be used to reiterate the string. image_rsrc1G0.jpg


    ### Iterating Through a string

    With a `for` loop, we can iterate through a string. This is an example of counting
    the number of ''l''s in a string. image_rsrc1G1.jpg


    ### String Membership Test

    We can check whether or not there is a substring within a string using keyword
    `in`.

    ```

    >>> ''a'' in ''program'' True

    >>> ''at'' not in ''battle'' False

    ```


    ### Built-in functions to Work with Python

    Different built-in functions which can also work with strings in series. A few
    other commonly used types are `len()` and `enumerate()`. The function `enumerate()`
    returns an `enumerate` object. It includes the index and value as combinations
    of all elements in the string. This may be of use to iteration. Comparably, `len()`
    returns the string length (characters number). image_rsrc1G2.jpg


    ## Formats for Python


    ### Sequence for escaping

    We can''t use single quotes or double quotes if we want to print a text like He
    said, "What''s there?". This would result in a `SyntaxError` because there are
    single and double quotations in the text alone.

    ```

    >>>print("He said, "What''s there?")

    SyntaxError: invalid syntax

    >>>print(''He said, "What''s there?"'')

    SyntaxError: invalid syntax

    ```

    Triple quotes are one way to get round the problem. We might use escape sequences
    as a solution. A series of escape starts with a backslash (`\`), which is represented
    differently. If we are using a single quote to describe a string, it is important
    to escape all single quotes within the string. The case with double quotes is
    closely related. This is how the above text can be represented. image_rsrc1G3.jpg


    Once we execute the code above, we have the following results:

    He said, "What''s there?"

    He said, "What''s there?"

    He said, "What''s there?"


    ### Raw String to ignore escape sequence

    Quite often inside a string, we might want to reject the escape sequences. To
    use it, we can set `r` or `R` before the string. Which means it''s a raw string,
    and it will neglect any escape sequence inside.

    ```

    >>>print("This is \x61 \ngood example")

    This is a good example

    >>> print(r"This is \x61 \ngood example")

    This is \x61 \ngood example

    ```


    ### The format() Method for Formatting Strings

    The `format()` sources available and make with the string object is very flexible
    and potent in string formatting. Style strings contain curly braces `{}` as placeholders
    or fields of substitution. To specify the sequence, we may use positional arguments
    or keyword arguments. The `format()` technique can have requirements in optional.
    Using colon (`:`), they are left-justified (`<`), right-justified (`>`), or centered
    (`^`). We can format integers as binary, hexadecimal, and floats can be rounded
    or shown in the style of the exponent. You can use tons of formatting available.
    image_rsrc1G4.jpg


    ### Old style formatting

    We can even code strings as the old style using the `%` operator. image_rsrc1G5.jpg


    ### Common Methods for Python

    The string object comes with various methods. One of them is the `format()` method
    described above. A few other frequently used include `lower()`, `upper()`, `join()`,
    `split()`, etc. image_rsrc1G6.jpg


    ### Inserting values into strings

    #### Method 1 - The string method

    The string method can be used to create new strings with the values inserted.
    That method works for all releases. image_rsrc1G7.jpg

    The braces indicate where the inserted value will be going. You can insert a value
    greater than one. The values should not have to be strings numbers and other entities.
    image_rsrc1G8.jpg


    Using formatting within curly brackets, you can do more complex formatting of
    numbers and strings. This process allows us to give instructions for formatting
    things using either the curly braces or the format identifier. image_rsrc1GA.jpg


    #### Method 2 - f-strings in Python >=3.6

    When you can rely on Python version `>= 3.6`, you will have another appealing
    place to use the new `f-string` formatted string. At the start of the string,
    `f` informs Python to permit any valid variable names inside the string. Here''s
    an example as the one above image_rsrc1GB.jpg


    #### Method 3 - old school % formatting

    There seems to be an older string tool which uses the percent operator. It is
    touch less versatile than the other choices, but you can still see it in older
    coding where it is more straightforward to use `%` formatting. For formatting
    the `%` operator, note `%s` marker for a string to be inserted and `%d` marker
    for an integer. image_rsrc1GC.jpg


    ## Module Data


    ### What are the modules in Python?

    Whenever you leave and re-enter the Python interpreter, the definitions you created
    (functions and variables) will get lost. Consequently, if you''d like to develop
    a code longer, it''s better to use a text editor to plan the input for the interpreter
    and execute it with that file as input. This is defined as script formation. As
    the software gets bigger, you may want to break it into different files to make
    maintenance simpler. You might also like to use a handy function that you wrote
    in other programs without having to replicate its definition inside each program.
    To assist this, Python has the option of putting definitions into a file and using
    them in the interpreter''s code or interactive instances. This very file is considered
    a module; module descriptions can be loaded into certain modules or into the main
    module (the list of variables you have exposure to in a high-level script and
    in converter mode).


    ### Defining a module

    A module is a file that contains definitions and statements from Python. The name
    of the file is the name of the module with the `.py` suffix attached. The name
    of the module (only as string) inside a module is available as the value including
    its global variable `__name__`. For example, use your preferred text editor to
    build a file named `fibo.py` with the following contents in the current working
    directory image_rsrc1GD.jpg


    In this, we defined an `add()` function within an example titled "module." The
    function requires two numbers and returns a total of them.


    ### How to import modules in Python

    Within a module, we can import the definitions to some other module or even to
    the interactive Python interpreter. To do something like this, we use the keyword
    `import`. To load our recently specified example module, please enter in the Python
    prompt.

    ```

    >>> import example

    ```

    This should not import the identities of the functions directly in the existing
    symbol table as defined in the example. It just imports an example of the module
    name there. Using the name of the module, we can use the dot (`.`) operator to
    access the function. For instance:

    ```

    >>> example.add(4,5.5)

    9.5

    ```

    Python comes with lots of regular modules. Check out the complete list of regular
    Python modules and their usage scenarios. These directories are within the destination
    where you''ve installed Python in the `Lib` directory. Normal modules could be
    imported just the same as our user-defined modules are imported. There are different
    ways of importing the modules. You''ll find them below:


    #### import statement

    Using the `import` statement, we can extract a module by the dot operator as explained
    in the previous section and access the definitions within it. Here is another
    example image_rsrc1GE.jpg


    Once we execute the code above, we have the following results: The value of `pi`
    is `3.141592653589793


    #### Import with renaming

    We can load a module in the following way by changing the name of it: image_rsrc1GF.jpg

    We called the module as `m`. In certain instances, this will save us time to type.
    Remember that in our scope the name `math` is not identified. Therefore `math.pi`
    is incorrect, and `m.pi` is correctly implemented.


    #### from statement

    We can import individual names from such a module without having to import the
    entire module. Here is another example image_rsrc1GG.jpg

    ```

    >>> from math import pi, e

    >>> pi

    3.141592653589793

    >>> e

    2.718

    ```


    #### Import all names

    With the following form, we can import all terms (definitions) from a module:

    ```

    from math import *

    print("The value of pi is", pi)

    3.141592653589793

    ```

    Above, we have added all of the `math` module. This covers all names that start
    with an underscore. It is not a good programming technique to import something
    with the asterisk (`*`). This will lead to a replication of an attribute''s meaning.
    This also restricts our code''s readability. Use the `format()` method available
    to see below-image_rsrc1GA.jpg


    ### Module Search Path

    Python looks at many locations when importing a module. Interpreter searches for
    a built-in module instead. So if not included in the built-in module, Python searches
    at a collection of directories specified in `sys.path`.


    #### PYTHONPATH

    The `PYTHONPATH` environment variable allows us to customize that list to insert
    our own location image_rsrc1GH.jpg


    ### Reloading a module

    During a session, the Python interpreter needs to import one module once. This
    makes matters more productive. Here is an example showing how that operates. Assume
    we get the code below in a module called `my_module` image_rsrc1GJ.jpg


    Now we suspect multiple imports have impact:

    ```

    >>> import my_module

    >>> import my_module

    ```

    This code was executed once. This means our module has only been imported. Also,
    if during the process of the test our module modified, we will have to restart
    it. The way to do so is to `reload`. Python offers an effective way to do so.
    Within the `imp` module, we may use the `reload()` function to restart a module.
    Here are some ways to do it:

    ```

    >>> import imp

    import my_module

    >>> imp.reload(my_module)

    ```

    This code executes `<module ''my_module'' from ''...''>`.


    ### The dir() built-in function

    We may use the `dir()` function to locate names within a module. For such cases,
    in the example of the module that we had in the early part, we described a function
    `add()`. In example module, we can use `dir` in the following scenario image_rsrc1GK.jpg

    Now we see a list of names sorted (alongside add). Many other names that start
    with an underscore are module-associated (not user-defined) default attributes.
    For instance the attribute name contains `__name__`.

    ```

    >>> import example

    >>> example.__name__

    ''example''

    ```

    You can find out all names identified in our existing namespace by using `dir()`
    function with no arguments image_rsrc1GM.jpg

