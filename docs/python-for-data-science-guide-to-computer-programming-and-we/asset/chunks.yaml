    # Use of `split()` method


    This feature helps to receive many user inputs. It splits the defined separator
    to the given input. If no separator is given, then a separator is blank space.
    Users generally use a `split()` method to separate a Python string, but it can
    be used when multiple inputs are taken.


    **Syntax:**

    `input().split(separator, maxsplit)`


    **Example:** ![](image_rsrc1FP.jpg)

    **Output:** ![](image_rsrc1FR.jpg)


    # Using List comprehension


    Comprehension of lists is an easy way of describing and building a list in Python.
    Just like mathematical statements, we can generate lists within each line only.
    It is often used when collecting multiple device inputs.


    **Example:** ![](image_rsrc1FS.jpg)

    **Output:** ![](image_rsrc1FT.jpg)


    **Note:** The definitions above take inputs divided by spaces. If we prefer to
    pursue different input by comma (,”), we can just use the below:


    ### taking multiple inputs divided by comma at a time

    ```python

    x = [int(x) for x in input("Enter multiple value: ").split(",")]

    print("Number of list is: ", x)

    ```


    # Assign multiple values to multiple variables


    By separating the variables and values with commas, you can allocate multiple
    values to different variables.


    ```python

    a, b = 100, 200

    print(a) # 100

    print(b) # 200

    ```


    You have more than three variables to delegate. In addition, various types can
    be assigned, as well.


    ```python

    a, b, c = 0.1, 100, ''string''

    print(a) # 0.1

    print(b) # 100

    print(c) #string

    ```


    # Assign the same value to multiple variables


    Using `= ` consecutively, you could even appoint multiple variables with the same
    value. For instance, this is helpful when you initialize multiple variables to
    almost the same value.


    ```python

    a = b = 100

    print(a) # 100

    print(b) # 100

    ```


    Upon defining the same value, another value may also be converted into one. As
    explained later, when allocating mutable objects such as lists or dictionaries,
    care should be taken.


    ```python

    a = 200

    print(a) # 200

