    \ the old style, we can also use the `%` operator for formatting.\n```python\n\
    x = 12.345678\nprint('The value of x is %.2f' % x)\n# Output: The value of x is\
    \ 12.35\n```\n```python\nx = 12.345678\nprint('The value of x is %d' % x)\n# Output:\
    \ The value of x is 12\n```\n```python\nx = 12.345678\nprint('The value of x is\
    \ %s' % x)\n# Output: The value of x is 12.345678\n```\nAlternatively, we can\
    \ use f-strings (available in Python 3.6+)\n```python\nx = 12.345678\nprint(f'The\
    \ value of x is {x:.2f}')\n# Output: The value of x is 12.35\n```\n\n##### Indentation\n\
    Indentation applies to the spaces at the start of a line. Whereas indentation\
    \ in other languages, the indentation in Python is very important. Example:\n\
    ```python\nif 5 > 2:\n    print(\"Five is greater than two!\")\n```\n**Output:\
    \ Five is greater than two!**\n\n##### Input\nWe would want to take the feedback\
    \ from the user. We have the `input()` function in Python to enable this. `input([prompt])`\
    \ is the string we want to show on the computer, this is optional.\n```python\n\
    >>>num = input('Enter a number: ')\nEnter a number: 10\n>>>num '10'\n```\nBelow,\
    \ we can see how the value 10 entered is a string and not a number. To transform\
    \ this to a number we may use the `int()` or `float()`.\n```python\n>>>int('10')\n\
    10\n>>>float('10')\n10.0\n```\nThe same method can be done with `eval()`. Although\
    \ it takes eval much further, provided that the input is a string\n```python\n\
    >>>int('2+3')\nTraceback (most recent call last):\n  File \"<string>\", line 301,\
    \ in runcode\n  File \"<interactive input>\", line 1, in <module>\nValueError:\
    \ int() base 10 invalid literal: '2+3'\n>>>eval('2+3')\n5\n```\n\n##### Import\n\
    As our software gets larger, splitting it up into separate modules is a smart\
    \ idea. A module is a file that contains definitions and statements from Python.\
    \ Python packages have a filename, and the .py extension begins with it. Definitions\
    \ may be loaded into another module or to the integrated Python interpreter within\
    \ a module. To do this, we use the keyword on import. For instance, by writing\
    \ the line below, we can import the math module:\n```python\nimport math\n```\n\
    We will use the module as follows:\n```python\nimport math\nprint(math.pi)\n#\
    \ Output: 3.141592653589793\n```\nSo far, all concepts are included in our framework\
    \ within the math module. Developers can also only import certain particular attributes\
    \ and functions, using the keyword. For instance:\n```python\n>>>from math import\
    \ pi\n>>>pi 3.141592653589793\n```\nPython looks at multiple positions specified\
    \ in `sys.path` during the import of a module. It is a list of positions in a\
    \ directory.\n```python\n>>> import sys\n>>>sys.path\n['', 'C:\\\\Python33\\\\\
    Lib\\\\idlelib', 'C:\\\\Windows\\\\system32\\\\python33.zip', 'C:\\\\Python33\\\
    \\DLLs', 'C:\\\\Python33\\\\lib', 'C:\\\\Python33', 'C:\\\\Python33\\\\lib\\\\\
    site-packages']\n```\nWe can insert our own destination to that list as well.\n"
