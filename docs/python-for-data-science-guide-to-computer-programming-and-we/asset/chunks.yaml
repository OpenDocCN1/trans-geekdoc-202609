    # Python 概述


    * 为了最小化编译后文件的大小，你可以在 Python 命令中使用 `-O` 或 `-OO` 关。`-O` 关会删除 `assert` 语句，`-OO` 关会删除
    `assert` 语句以及 `doc` 字符串。尽管某些代码可能支持启用这些选项，但只有在在你清楚自己在做什么时才应该使用此方法。“优化过的”模块通常具有此类优化标签，并且体积更小。未来的版本可能会修改优化控制的影响。

    * 项目一旦从 `a.pyc` 文件读取，其运行速度并不比从 `a.py` 文件读取时更快；`.pyc` 文件唯一的一点是，它们的加载速度更快。

    * 编译所有模块可以为目录下的所有其他模块生成 `.pyc` 文件。

    * 关于此过程的更多细节请参见 `PEP 3147`，其中还附有决策流程图。


    ## 标准模块


    Python 拥有一个标准模块库，在单独的章节“Python 库引用”（以下简称“库参考”）中有所提到。少数模块被集成到解释器中；它们直接暴露了并非语言基础部分但却是内置的过程，无论是为了效率，还是为了提供对底层操作系统（如源码调用）的访问。这些模块的集合是自定义的替代方案，并且依赖于底层框架。例如，`winreg`
    模块仅在 Microsoft Windows 上可用。有一个特定的模块值得关注：`sys`，它集成在每个 Python 解释器中。`sys.ps1` 和 `sys.ps2`
    变量用于分类作为主、次指令的字符串：


    ```

    >>> import sys

    >>> sys.ps1 ''>>> ''

    >>> sys.ps2 ''... ''

    >>> sys.ps1 = ''C> ''

    C>print(''Yuck!'')

    Yuck! C>

    ```

    只有当解释器处于交互模式时，这两个变量才定义。`sys.path` 变量是一个字符串集合，定义了解释器使用的模块搜索路径。当 `PYTHONPATH` 不在集合中，它将被定义为来自
    `PYTHONPATH` 环境变量或内置默认值的定义路径。你可以使用常规列表程序更改它：


    ```

    >>> import sys

    >>> sys.path.append(''/python/ufs/guido/lib/'')

    ```


    ## 包


    包确实是一种通过使用“模块的点状名称”构建 Python 模块命名空间的方法。例如，在一个名为 `A.` 的包中，模块标题 `A.B` 指定了名为 `B`
    的子模块。即使使用模块可以防止各种模块的编写者停止了解对方的全局变量名，但任何对点模块名的使用都防止了 `NumPy` 或 `Pillow` 等多模块包的开发者需要过多担心对方的模块名称。


    考虑创建一系列模块列表（一个“包”）以相同的方式处理音频文件和音频数据。有几种不同的音频文件通常以其扩展名为人熟悉，例如：`.wav`、`.aiff`、`.au`，你需要构建并维护一个巨大的模块集合来在某些多种文件格式之间转换。你可能还喜欢在音频数据上运行其他几种不同的操作（如混音、添加回声、实现均衡器函数、产生光学立体声效果），你只需要编写无限系列的任务模块来执行这些干预即可。这里是另一种可行的包布局（用分级文件系统描述）：![](img/image_rsrc1GN.jpg)


    在加载包时，Python 会通过 `sys.path` 上的文件夹检查包子目录。为了让 Python 将包含文件的目录视为包，需要 `__init__.py`
    文件。这保护了具有相同名称（包括字符串）的目录不会意外隐藏有效模块，这些模块稍后主要出现在模块的搜索路径上。在正确的顺序下；`__init__.py` 可以是一个空文件，但也可以实现包预处理代码或建立下文描述的变量
    `__all__`。


    ### 导入模块


    * 包用户甚至可以从包中导入单个模块，例如：`import sound.effects.echo`

    * 这加载了 `sound.effects.echo` 子模块。必须提到它的全名：`sound.effects.echo.echofilter(input,
    output, atten=4, delay=0.7)`

    * 另一种导入子模块的方法是：`from sound.effects import echo`

    * 因此，它启动了子模块 `echo` 并提供了不带包前缀的访问：`echo.echofilter(input, output, atten=4, delay=0.7)`

    * 另一个选项是显式导入所需的函数或属性：`from sound.effects.echo import echofilter`

    * 这再次激活了 `echo` 子模块，但它显式允许访问其 `echofilter()` 功能：`echofilter(input, output, delay=0.7,
    atten=4)`


    所以它加载了子模块 `echo`；然而这倾向于使其函数；请记住，在使用 `from package import object` 时，该对象将是包的子模块（或子包）或包中描述的任何其他名称，例如函数、类或变量。最初，导入语句分析该对象是否在包中被表征；否则，它假设它是一个模块并尝试加载它。一旦无法到达它，将抛出
    `ImportError` 异常。参考此点，在使用如 `import item.subitem.subsubitem` 的语法时，每个项都必须是包，但最后一个项；最后一个项可以是模块或包，但不能是上一个项中定义的类或函数或变量。


    ## 结论


    几乎所有领域的研究都变得更加数据导向，这影响了就业机会和所需的技能。随着更多数据和评估数据的方法变得易于获取，经济、社会和生活中依赖数据的方面也越来越多。每当提到数据科学时，Python
    都是一个具有各种优势的必要工具。它是灵活的，并且由于是开源的，正在不断改进。Python 已经拥有许多宝贵的库，而且不能忽视它可以与其它语言（如 `Java`）以及当前框架相结合。简而言之——Python
    是数据科学的一种神奇方法。


    '
