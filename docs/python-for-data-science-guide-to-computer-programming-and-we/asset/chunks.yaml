    \ the components of the container are those that will be generated by assuming\
    \ each of the for or if clauses as a block, nesting from left to right, and determining\
    \ the phase for creating an entity each time the inner core block is approached.\n\
    \n### List\nA list view is a probably empty sequence of square brackets including\
    \ expressions:\n```python\nlist_display ::= \"[\" [starred_list | comprehension]\
    \ \"]\"\n```\nA list display generates a new column object, with either a list\
    \ of expressions or a comprehension specifying the items. When a comma-separated\
    \ database of expressions is provided, its elements are assessed from left to\
    \ right and positioned in that order in the category entity. When Comprehension\
    \ is provided, the list shall be built from the comprehension components.\n\n\
    ### Set\nCurly braces denote a set display and can be distinguished from dictionary\
    \ displays by the lack of colons dividing data types:\n```python\nset_display\
    \ ::= \"{\" (starred_list | comprehension) \"}\"\n```\nA set show offers a new,\
    \ mutable set entity, with either a series of expressions or a comprehension defining\
    \ the contents. When supplied with a comma-separated list of expressions, its\
    \ elements are evaluated from left to right and assigned to the set entity. Whenever\
    \ a comprehension is provided, the set is formed from the comprehension-derived\
    \ elements. Unable to build an empty set with this {};}` literal forms a blank\
