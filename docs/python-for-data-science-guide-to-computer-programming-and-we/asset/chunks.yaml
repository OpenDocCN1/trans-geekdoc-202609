    is %3.2f'' %x) The value of x is 12.35 \>>>print(''The value of x is %3.4f'' %x)
    The value of x is 12.3457 Python Indentation Indentation applies to the spaces
    at the start of a line of the compiler. Whereas indentation in code is for readability
    only in other programming languages, but the indentation in Python is very important.
    Python supports the indent to denote a code block. Example if 5 > 2: print("Five
    is greater than two!") Python will generate an error message if you skip the indentation:
    Example Syntax Error: if 5 > 2: print("Five is greater than two!") Python Input
    Our programs have been static. Variables were described or hard-coded in the source
    code. We would want to take the feedback from the user to allow flexibility. We
    have the input() function in Python to enable this. input() is syntax as: input(\[prompt\])
    While prompt is the string we want to show on the computer, this is optional.
    \>>>num = input(''Enter a number: '') Enter a number: 10 \>>>num ''10'' Below,
    we can see how the value 10 entered is a string and not a number. To transform
