    # 使用 `split()` 方法


    此功能有助于接收多个用户输入。它会根据指定的分隔符对给定的输入进行分割。如果没有提供分隔符，则默认分隔符为空格。用户通常使用 `split()` 方法来分割
    Python 字符串，但也可以在获取多个输入时使用它。


    **语法：**

    `input().split(separator, maxsplit)`


    **示例：** ![](img/image_rsrc1FP.jpg)

    **输出：** ![](img/image_rsrc1FR.jpg)


    # 使用列表推导式


    列表推导式是 Python 中描述和构建列表的一种简单方式。就像数学表达式一样，我们可以在每一行内生成列表。它在收集多个设备输入时经常被使用。


    **示例：** ![](img/image_rsrc1FS.jpg)

    **输出：** ![](img/image_rsrc1FT.jpg)


    **注意：** 上定义接收的是由空格分隔的输入。如果我们希望通过逗号（,)处理不同的输入，可以使用以下方法：


    ### 一次性获取逗号分隔的多个输入

    ```python

    x = [int(x) for x in input("Enter multiple value: ").split(",")]

    print("Number of list is: ", x)

    ```


    # 将多个值赋值给多个变量


    通过逗号分隔变量和值，你可以将多个值分配给不同的变量。


    ```python

    a, b = 100, 200

    print(a) # 100

    print(b) # 200

    ```


    你有三个以上的变量需要委托。此外还可以分配不同的类型。


    ```python

    a, b, c = 0.1, 100, ''string''

    print(a) # 0.1

    print(b) # 100

    print(c) #string

    ```


    # 将相同的值赋值给多个变量


    通过连续使用 `=`，你甚至为多个变量指定相同的值。例如，当你要将多个变量初始化为几乎相同的值时，这非常有帮助。


    ```python

    a = b = 100

    print(a) # 100

    print(b) # 100

    ```


    在定义相同值后，另一个值也可能转换为该值。正如后文解释，在分配列表或字典等可变对象时，应该注意。


    ```python

    a = 200

    print(a) # 200

    print(b) # 100

    ```


    可以以相同的方式编写三个或更多。


    ```python

    a = b = c = ''string''

    print(a) # string

    print(b) # string

    print(c) # string

    ```


    与 `int`、`float` 和 `str` 等不可变对象不同，指定 `list` 和 `dict` 等可变对象时要小心。当你连续使用 `=` 时，所有变量都被分配同一个对象，因此如果你修改了元素值或创建了新元素，其他对象也会跟着修改。


    ```python

    a = b = [0, 1, 2]

    print(a is b) # True

    a[0] = 100

    print(a) # [100, 1, 2]

    print(b) # [100, 1, 2]

    ```


    如下所示。


    ```python

    b = [0, 1, 2]

    a = b

    print(a is b) # True

    a[0] = 100

    print(a) # [100, 1, 2]

    print(b) # [100, 1, 2]

    ```


    如果你想独立地管理它们，你需要分别分配它们。在 `c = []; d = []` 之后，可以保证 `c` 和 `d` 连接到两个唯一的、新创建的、不同的列表。（注意
    `c = d = []` 将同一个对象分配给 `c` 和 `d`。）这是另一个示例：


    ```python

    a = [0, 1, 2]

    b = [0, 1, 2]

    print(a is b) # False

    a[0] = 100

    print(a) # [100, 1, 2]

    print(b) # [0, 1, 2]

    ```


