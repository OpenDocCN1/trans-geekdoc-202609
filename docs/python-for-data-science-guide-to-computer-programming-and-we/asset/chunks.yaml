    ## 介绍

    数据科学在过去几年中非常流行。该领域的主要重点是将重要数据整合到业务和营销策略中，以帮助企业扩张。为了获得逻辑解决方案，可以对数据进行存储和探索。最初，只有领先的
    IT 公司参与这一领域，但今天，信息技术已应用于电子商务、医疗保健、金融服务等不同部门和领域的公司。目前有诸如 `Hadoop`、`R` 代码、`SAS`、`SQL`
    等许多软件处理程序可供使用。然而，`Python` 是最且最易用的数据和分析工具。它被誉为编程世界的“瑞士军刀”，因为它促进了结构化编码、面向对象编程、操作性编程语言等许多。根据
    2018 年 Stack Overflow 的调查，`Python` 是世界上最广泛使用的编程语言，也被认为是数据科学工具和技术最高级的语言。在 Hacker
    rank 2018 开发者调查中（在他们的“爱恨排名”中可见），`Python` 赢得了开发者的心。数据科学专家预计 `Python` 生态系统将随着受欢迎程度提高而增长。尽管你学习
    `Python` 编程的旅程可能刚刚开始，但知道有很多（且不断增加）的职业选择是一件好事。数据分析 `Python` 编程被广泛使用，并且作为一种灵活且开源的语言，成为最受欢迎的编程语言之一。它大库用于数据处理，即使对于初级数据分析师来说，也非常易理解。除了开源之外，它还可以轻松集成到任何可解决最复杂问题的基础设施中。大多数银行用它进行数据处理，机构用它进行分析和处理，像
    Climate monitor analytics 等天气预测公司经常使用它。根据 `Indeed`，计算机科学家的年薪为 $127,918。所以好消息是，这个数字可能会增加。`IBM`
    的专家预测，到 2020 年数据科学家的需求将增加 28%。对于数据科学来说，未来是光明的，而 `Python` 只是黄金蛋糕的一角。幸运的是，掌握 `Python`
    和编程原理同样实用。


    ## 数据科学及其意义

    数据科学从过去几年走了很远，因此成为了一个重要的因素。以下是 `数据科学` 将仍然具备的几项解释：


    1. `数据科学` 允许公司理解其市场。

    2. `数据科学` 使品牌能够向受众交付。

    3. 也许 `数据科学` 的显著特征之一是它可以适用于许多行业。

    4. 目前，`数据科学` 适用于所有行业，并且存在海量数据。

    5. 大数据一直在大增长。大数据允许企业解决人力资本问题。

    6. 数据科学在每个领域都在迅速普及，因此在产品功能中发挥着重要作用。

    7. 计算机技术也影响了超市行业。为了理解这一点，让我们举例，老年人曾有过非常好的互动。现在由于超市连锁的出现和增加，这种关注消失了。

    8. `数据科学` 帮助公司建立客户联系。


    ## 数据技术的未来

    与其他领域不断演进一样，数据技术的重要性也日益增长。数据科学影响了不同的领域。它的影响可以在许多行业看到，例如零售、医疗保健和教育。医疗领域不断发现新的治疗方法和技术，并且对高质量的患者护理有需求。医疗行业可以通过数据科学技术找到解决方案，帮助患者进行护理。教育是另一个可以清楚看到数据科学优势的领域。现在，手机和平板等新创新已成为教育系统的基本特征。此外，在数据科学的帮助下，学生创造了更大的机会，这导致了知识的提高。


    ## 数据科学生命周期

    ![](img/image_rsrc1ET.jpg)


    ### 数据结构

    在计算机编程中可以选择或设计数据结构来存储数据，以便对其运行不同的算法。每个其他数据结构都包含了数据值、数据关系以及数据之间的函数，这些函数可以应用于数据和信息。


    * **线性或非线性**：此特征定义了数据对象如何在顺序序列中组织（如列表），或在无序序列中组织（如表格）。

    * **同质或非同质性**：此功能定义了集合中的所有数据对象是相同类型还是不同种类。

    * **静态或动态**：这种技术决定了如何组装数据结构。静态数据结构在编译时具有固定的大小、结构和内存目标。动态数据类型具有维度、机制和内存目标，可能会根据应用程序缩小或扩展。


