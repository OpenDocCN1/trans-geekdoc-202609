  trans: "\n\n容器的内容是显式列出的，或者通过一系列循环和过滤指令计算得出，这些指令被称为“推导式”（comprehension）。推导式语法的常见特征如下：\n\
    \n```python\ncomprehension ::= assignment_expressioncomp_for comp_for\ncomp_for\
    \ ::= [\"async\"] \"for\" target_list \"in\" or_test [comp_iter] comp_iter\ncomp_iter\
    \ ::= comp_for | comp_if\ncomp_if ::= \"if\" expression_nocond [comp_iter]\n```\n\
    \n### 推导式 (Comprehension)\n推导式包含一个带有至少一个表达式子句的单语句，以及零或多个 `for` 或 `if` 子句。在这种情况下，容器的组件是那些假设每个\
    \ `for` 或 `if` 子句视为一个块、从左到右嵌套，并在每次接近内部核心块时确定创建实体的阶段生成的。\n\n### 列表 (List)\n列表视图是一个可能为空的方括号序列，包含表达式：\n\
    ```python\nlist_display ::= \"[\" [starred_list | comprehension] \"]\"\n```\n\
    列表显示生成一个新的新的列表对象，其中包含指定项的表达式列表或推导式。当提供逗号分隔的表达式数据库时，其元素从左到右进行评估，并按该顺序在类别实体中定位。当提供推导式时，列表将根据推导式组件构建。\n\
    \n### 集合 (Set)\n大括号表示集合显示，通过缺少划分数据类型的冒号，可以与字典区分区分来：\n```python\nset_display ::=\
    \ \"{\" (starred_list | comprehension) \"}\"\n```\n集合显示提供了一个新的、可变的集合实体，其内容由一系列表达式或推导式定义。当提供逗号分隔的表达式列表时，其元素从左到右进行求值并分配给集合实体。每只要提供推导式，集合就会由推导出的元素形成。无法使用这种\
    \ `{};}` 字面量形式构建空集合；它会形成空字典。\n\n### 字典 (Dictionary)\n字典视图是一个可能为空的键值对序列，限于大括号：\n\
    ```python\ndict_display ::= \"{\" [key_datum_list | dict_comprehension] \"}\"\n\
    key_datum_list ::= key_datum (\",\" key_datum)* [\",\"]\nkey_datum ::= expression\
    \ \":\" expression | \"** or_expr\ndict_comprehension ::= expression \":\" expression\n\
    ```\n字典视图显示字典中的新对象。当提供逗号分隔的键/值对序列时，它们从左到右进行分析以识别字典条目：每个键实体通常用作键，用于在字典持有相应的数据。这意味着你可以在键/值目录中清晰地多次声明同一个键，但最后一个给出的将成为该字典中该键的最终值。\n\
    \n### 生成器表达式 (Generator expressions)\n生成器表达式是圆括号中生成器的压缩语法：\n```python\ngenerator_expression\
    \ ::= \"(\" expression comp_for \")\"\n```\n表达式生成器产生一个作为新生成器的实体。它的语法与推导式相同，只是被括在括号或大括号中而不是圆括号。当通过\
    \ `__next__()` 方法调用生成器对象（样式与标准生成器相同）时，用于生成器表达式的变量是进行延迟评估的。相反，子句中最左侧的可迭代表达式会被立即求值，以便其产生的错误会在生成器表达式特征的层级传输，而不是在恢复第一个值的层级传输。\n\
    \n例如：`(x*y for x in range(10) for y in range(x, x+10))`。\n\n### Yield 表达式 (Yield\
    \ expressions)\n```python\nyield_atom ::= \"(\" yield_expression \")\"\nyield_expression\
    \ ::= \"yield\" [expression_list | \"from\" expression]\n```\n产生的表达式用于定义生成器函数或异步生成器函数，因此只能在函数定义体中使用。在函数体中使用\
    \ `yield` 表达式倾向于使该函数成为生成器，并在 `async def` 函数中使用它使其成为异步生成器。\n\n例如：\n```python\n\
    def gen():\n  # 定义生成器函数\n  yield 123\nasync def agen():\n  # 定义异步生成器函数\n  yield\
    \ 123\n```\n由于它们的影响，`yield` 表达式不允许作为推导式。\n\n### Python 数据输入输出 (Input and Output\
    \ of Data in Python)\n\n#### 使用 `print()` 函数\n为了将数据显示到标准输出系统，我们使用 `print()` 函数。我们可以向\
    \ `a` 输出数据，这是可选的。\n\n示例如下：\n```python\nprint('This sentence is output to the screen')\n\
    # Output: This sentence is output to the screen\n```\n\n另一个示例是：\n```python\na\
    \ = 5\nprint('The value of a is', a)\n# Output: The value of a is 5\n```\n\n在\
    \ `print()` 的第二个声明中，我们注意到 `sep` 是值之间的分隔符，默认值是空格。\n\n下面，我们可以看到输入的值 `10` 是字符串而不是数字。为了将其转换为数字，我们可以使用\
    \ `int()` 或 `float()`。\n\n```python\n>>>int('10')\n10\n>>>float('10')\n10.0\n\
    ```\n\n相同的方法可以通过 `eval()` 完成。只要输入是字符串，它就能让 `eval` 得更远：\n```python\n>>>int('2+3')\n\
    Traceback (most recent call last):\n  File \"<string>\", line 301, in runcode\n\
    \  File \"<interactive input>\", line 1, in <module>\nValueError: int() base 10\
    \ invalid literal: '2+3'\n>>>eval('2+3')\n5\n```\n\n#### 输入 (Input)\n我们想要获取用户的反馈。在\
    \ Python 中我们有 `input()` 函数来实现这一点。`input([prompt])` 是我们想在计算机上显示的字符串，这是可选的。\n```python\n\
    >>>num = input('Enter a number: ')\nEnter a number: 10\n>>>num\n'10'\n```\n\n\
    #### 输出格式化 (Output formatting)\n我们经常想要格式化我们的输出使其看起来美观。可以使用 `str.format()` 方法完成。到这里，它们使用大括号\
    \ `{}` 作为占位符。\n\n```python\nx = 5; y = 10\nprint('The value of x is {} and y is\
    \ {}'.format(x,y))\n# Output: The value of x is 5 and y is 10\n```\n\n与旧样式不同，也可以使用\
    \ `%` 运算符进行格式化。\n```python\nx = 12.34567\nprint('The value of x is %.2f' % x)\n\
    # Output: The value of x is 12.35\n```\n```python\nx = 12.34567\nprint('The value\
    \ of x is %d' % x)\n# Output: The value of x is 12\n```\n```python\nx = 12.34567\n\
    print('The value of x is %s' % x)\n# Output: The value of x is 12.34567\n```\n\
    或者，我们可以使用 f-strings（Python 3.6+ 可用）：\n```python\nx = 12.34567\nprint(f'The value\
    \ of x is {x:.2f}')\n# Output: The value of x is 12.35\n```\n\n##### 缩进 (Indentation)\n\
    缩进适用于行首的空格。与其他语言不同，Python 中的缩进非常重要。示例：\n```python\nif 5 > 2:\n    print(\"Five\
    \ is greater than two!\")\n```\n**Output: Five is greater than two!**\n\n#####\
    \ 导入 (Import)\n随着我们的软件变得越来越大将其分成单独模块是一个明智的主意。模块是一个包含 Python 定义和语句的文件。Python 包有文件名，并以\
    \ .py 扩展名开头。定义可以加载到另一个模块或模块内部的集成 Python 解释器中。要做到此，我们使用 `import` 关键字。例如，通过编写下面这行代码，我们可以导入\
    \ math 模块：\n```python\nimport math\n```\n我们将如下使用该模块：\n```python\nimport math\n\
    print(math.pi)\n# Output: 3.141592653589793\n```\n到为止，所有的概念都包含在 math 模块框架中。开发者也可以使用关键字导入某些特定的属性和函数。例如：\n\
    ```python\n>>>from math import pi\n>>>pi\n3.141592653589793\n```\nPython 在导入模块时查看\
    \ `sys.path` 中指定的多个位置。它是一个目录位置列表。\n```python\n>>> import sys\n>>>sys.path\n['',\
    \ 'C:\\\\Python33\\\\Lib\\\\idlelib', 'C:\\\\Windows\\\\system32\\\\python33.zip',\
    \ 'C:\\\\Python33\\\\DLLs', 'C:\\\\Python33\\\\lib', 'C:\\\\Python33', 'C:\\\\\
    Python33\\\\lib\\\\site-packages']\n```\n我们也可以将自己的目标插入到列表中。\n\n"
- fmt: "\n# Functions\n\nYou utilize programming functions to combine a list of instructions\
    \ that you're constantly using or that are better self-contained in sub-program\
    \ complexity and are called upon when required. Which means a function is a type\
    \ of code written to accomplish a given purpose. The function may or may not need\
    \ various inputs to accomplish that particular task. Whenever the task is executed,\
    \ one or even more values can or could not be returned by the function. Basically\
    \ there exist three types of functions in Python language:\n\n1.  Built-in functions,\
    \ including `help()` to ask for help, `min()` to just get the minimum amount,\
    \ `print()` to print an attribute to the terminal. More of these functions can\
    \ be found here.\n2.  User-Defined Functions (UDFs) that are functions created\
    \ by users to assist and support them out;\n3.  Anonymous functions, also labeled\
    \ `lambda` functions since they are not defined with the `default` keyword.\n\n\
    ## Defining A Function: User Defined Functions (UDFs)\n\nThe following four steps\
    \ are for defining a function in Python:\n\n1.  Keyword `def` can be used to declare\
    \ the function and then use the function name to backtrack.\n2.  Add function\
    \ parameters: They must be within the function parentheses. Finish off your line\
    \ with a colon.\n3.  Add statements which should be implemented by the functions.\n\
    \nWhen the function should output something, end your function with a `return`\
    \ statement. Your task must return an object `None` without return declaration.\
    \ \n\nExample:\n```python\ndef hello():\n    print(\"Hello World\")\nreturn\n\
    ```\n\nIt is obvious as you move forward, the functions will become more complex:\
    \ you can include `for` loops, flow control, and more to make things more fine-grained:\n\
    \n```python\ndef hello():\n    name = str(input(\"Enter your name: \"))\n    if\
    \ name:\n        print (\"Hello \" + str(name))\n    else:\n        print(\"Hello\
    \ World\")\n    return\n```\n\nIn the feature above, you are asking the user to\
    \ give a name. When no name is provided, the 'Hello World' function will be printed.\
    \ Otherwise, the user will receive a custom \"Hello\" phrase. Also, consider you\
    \ can specify one or more parameters for your UDFs function. When you discuss\
    \ the segment Feature Statements, you will hear more about this. Consequently,\
    \ as a result of your function, you may or may not return one or more values.\n\
    \n### The return Statement\n\nNote that since you're going to print something\
    \ like that in your `hello()` (UDF), you don't really have to return it. There'll\
    \ be no distinction between the above function and this one: \n\nExample:\n```python\n\
    def hello_noreturn():\n    print(\"Hello World\")\n```\n\nEven so, if you'd like\
    \ to keep working with the result of your function and try a few other functions\
    \ on it, you'll need to use the `return` statement to simply return a value, like\
    \ a string, an integer. Check out the following scenario in which `hello()` returns\
    \ a \"hello\" string while the `hello_noreturn()` function returns `None`:\n\n\
    ```python\ndef hello():\n    print(\"Hello World\")\n    return(\"hello\")\n\n\
    def hello_noreturn():\n    print(\"Hello World\")\n```\n\nIt is obvious as you\
    \ move forward, the functions will become more complex: you can include `for`\
    \ loops, flow control, and more to make things more fine-grained:\n\n```python\n\
    def hello():\n    name = str(input(\"Enter your name: \"))\n    if name:\n   \
    \     print (\"Hello \" + str(name))\n    else:\n        print(\"Hello World\"\
    )\n    return\n```\n\nIn the feature above, you are asking the user to give a\
    \ name. When no name is provided, the 'Hello World' function will be printed.\
    \ Otherwise, the user will receive a custom \"Hello\" phrase. Also, consider you\
    \ can specify one or more parameters for your UDFs function. When you discuss\
    \ the segment Feature Statements, you will hear more about this. Consequently,\
    \ as a result of your function, you may or may not return one or more values.\n\
    \nThe return Statement Note that since you're going to print something like that\
    \ in your `hello()` (UDF, you don't really have to return it. There'll be no distinction\
    \ between the above function and this one: \n\nExample:\n```python\ndef hello_noreturn():\n\
    \    print(\"Hello World\")\n```\n\nEven so, if you'd like to keep working with\
    \ the result of your function and try a few other functions on it, you'll need\
    \ to use the `return` statement to simply return a value, like a string, an integer.\
    \ Check out the following scenario in which `hello()` returns a \"hello\" string\
    \ while the `hello_noreturn()` function returns `None`:\n\n```python\ndef hello():\n\
    \    print(\"Hello World\")\n    return(\"hello\")\n\ndef hello_noreturn():\n\
    \    print(\"Hello World\")\n```\n\n(Note: The input text contained significant\
    \ repetitions and fragmented sentences; I have cleaned the logical flow while\
    \ following your instructions.)\n\n## How To Call A Function\n\nYou've already\
    \ seen a lot of examples in previous sections of how one can call a function.\
    \ Trying to call a function means executing the function you have described-either\
    \ directly from the Python prompt, or by a different function (as you have seen\
    \ in the \"Nested Functions\"). Call your new added `hello()` function essentially\
    \ by implementing `hello()` as in the DataCamp Light chunk as follows:\n\n```\n\
    hello()\n```\n\n## Adding Docstrings to Python Functions\n\nFurther valuable points\
    \ of Python's writing functions: docstrings. Docstrings define what your function\
    \ does, like the algorithms it conducts or the values it returns. These definitions\
    \ act as metadata for your function such that anybody who reads the docstring\
    \ of your feature can understand what your feature is doing, without having to\
    \ follow all the code in the function specification. Task docstrings are placed\
    \ right after the feature header in the subsequent line and are set in triple\
    \ quote marks. For your `hello()` function, a suitable docstring is 'Hello World\
    \ prints.'\n\n```python\ndef hello():\n    \"\"\"Prints \"Hello World\".\n   \
    \ Returns: None \"\"\"\n    print(\"Hello World\")\n    return\n```\n\n## Function\
    \ Arguments in Python\n\nYou probably learned the distinction between definitions\
    \ and statements earlier. In simple terms, arguments are the aspects that are\
    \ given to any function or method call, while their parameter identities respond\
    \ to the arguments in the function or method code. Python UDFs can take up four\
    \ types of arguments:\n\n1.  Default arguments\n2.  Required arguments\n3.  Keyword\
    \ arguments\n4.  Variable number of arguments\n"
