    每一个值都是表格中的一个数据点。例如，第一行（紧接列标题之后）有 5 个数据点：


    *   Facebook

    *   0.0

    *   USD

    *   2974676

    *   3.5


    数据集由一组数据点组成。我们可以将上述表格视为一个数据点列表。因此，我们将整个列表视为一个数据集。我们可以看到我们的数据集有五行五列。利用我们对 Python
    类型的理解，我们或许可以考虑将每个数据点存储在自己的变量中——例如，这里是我们存储第一行数据点的方式：![](img/image_rsrc1EU.jpg)上方，我们存储了：


    *   字符串“Facebook”的文本

    *   作为价格的浮点数 `0.0`

    *   字符串“USD”的文本

    *   作为评分次数的整数 `2,974,676`

    *   用户评分的浮点数 `3.5`


    为数据集中的每个数据点创建一个变量将是一个复杂的过程。幸运的是，我们可以使用列表来更有效地存储数据。因此，在第一行中，我们可以列出一个数据点列表：![](img/image_rsrc1EV.jpg)对于创建列表，我们：


    *   在输入一系列数据点时，用逗号分隔每一个项：`''Facebook,'' 0.0, ''USD,'' 2974676, 3.5`

    *   用方括号闭合列表：`[''Facebook'', 0.0, ''USD'', 2974676, 3.5]`

    *   列表创建后，将其赋值给名为 `row_1` 的变量，该列表被存储在计算机内存中。


    为了创建数据点列表，我们只需要：


    *   在数据点之间添加逗号进行分隔。

    *   用括号结束列表。


    请看下文，我们创建了五个列表，数据集中的每行都有一个列表：![](img/image_rsrc1EW.jpg)Python 列表的索引 A A 列表可以包含更广泛的数据类型。包含
    `[4, 5, 6]` 的列表包含相同类型的数据（仅限整数），而列表 `[''Facebook'', 0.0, ''USD,'' 2974676, 3.5]`
    包含许多类型的数据：


    *   包含两种浮点数（`0.0`, `3.5`）

    *   包含一种整数（`2974676`）

    *   包含两种字符串（`''Facebook,''` `''USD''`）


    ![](img/image_rsrc1EX.jpg)列表获得了 5 个数据点。对于列表的长度，可以使用 `len()` 命令：![](img/image_rsrc1EY.jpg)对于较小的列表，我们可以简单地通过数显示器上的数据点来确定长度，但当你处理包含许多组件的列表，或者只是需要编写预先并不知道长度的数据代码时，`len()`
    命令可能会被证明非常有用。列表中的每个其他组件（数据点）都与一个特定的数字相关，该数字称为索引号。索引也从 0 开始，这意味着第一个元素的索引号应为 0，第二个元素的索引号为
    1，依此类推。![](img/image_rsrc1EZ.jpg)要快速定位列表元素索引，只需确定它在列表中的位置数，然后将其减去 1。例如，字符串 `''USD,''`
    是列表中的第三项（位置数 3），那么它的索引号必须是 2，因为 `3 – 1 = 2`。索引号使我们能够从列表中定位单个项目。回溯上面示例中的行 1，通过执行代码
    `row_1[0]`，我们可以获得索引号为 0 的第一个节点（字符串 ''Facebook''）。

