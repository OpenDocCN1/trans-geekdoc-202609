    \ ‘while loop’ in the following scenario. For Loop Python's for loop is used to\
    \ iterate over a sequence (list, tuple, string) or just about any iterate-able\
    \ object. It is called traversal to iterate over a sequence. Syntax of For loop\
    \ in Python for<variable> in <sequence>: \\# body\\_of\\_loop that has set of\
    \ statements \\# which requires repeated execution In this case < variable > is\
    \ often a variable used to iterate over a < sequence >. Around each iteration\
    \ the next value is taken from < sequence > to approach the end of the sequence.\
    \ Python – For loop example The example below illustrates the use of a loop to\
    \ iterate over a list array. We calculate the square of each number present in\
    \ the list and show the same with the body of for loop. #Printing squares of all\
    \ numbers program \\# List of integer numbers numbers = \\[1, 2, 4, 6, 11, 20\\\
    ] #variable to store each number’s square temporary sq = 0 #iterating over the\
    \ given list forval in numbers: \\# calculating square of each number sq = val\
    \ \\* val \\# displaying the squares print(sq) Output: 1 4 16 36 121 400 For loop\
    \ with else block Excluding Java, we can have the loop linked with an optional\
    \ 'else' block in Python. The 'else' block only runs after all the iterations\
    \ are finished by the loop. Let's see one example: For val in range(5): ​ print(val)\
    \ else: ​ print(\"The loop has completed execution\") Output: 0 1 2 3 4 The loop\
    \ has completed execution Note: else block is executed when the loop is completed.\
    \ Nested For loop in Python If there is a loop within another for loop, then it\
    \ will be termed a nested for loop. Let's take a nested for loop example. for\
    \ num1 in range(3): ​ for num2 in range(10, 14): ​ print(num1, \",\", num2) Output:\
    \ 0 , 10 0 , 11 0 , 12 0 , 13 1 , 10 1 , 11 1 , 12 1 , 13 2 , 10 2 , 11 2 , 12\
    \ 2 , 13 While Loop While loop is also used to continuously iterate over a block\
    \ of code until a specified statement returns false, we have seen in many for\
    \ loop in Python in the last guide, which is used for a similar intent. The biggest\
    \ distinction is that we use for looping when we are not sure how many times the\
    \ loop needs execution, yet on the other side when we realize exactly how many\
    \ times we have to execute the loop, we need for a loop. Syntax of while loop\
    \ while conditioning: #body\\_of\\_while The body of the while is a series of\
    \ statements from Python which require repetitive implementation. These claims\
    \ are consistently executed until the specified condition returns false. while\
    \ loop flow 1\\. Firstly given condition is inspected, the loop is canceled if\
    \ the condition returns false, and also the control moves towards the next statement\
    \ in the compiler after the loop. 2\\. When the condition returns true, the set\
    \ of statements within the loop will be performed, and the power will then switch\
    \ to the loop start for the next execution. Those two measures continuously occur\
    \ as long as the condition defined in the loop stands true. While loop example\
    \ This is an example of a while loop. We have a variable number in this case,\
    \ and we show the value of the number in a loop, the loop will have an incremental\
    \ operation where we increase the number value. It is a very crucial component,\
    \ while the loop should have an operation of increase or decrease. Otherwise,\
    \ the loop will operate indefinitely. num = 1 #loop will repeat itself as long\
    \ as it can #num< 10 remains true whilenum< 10:\\` print(num) #incrementing the\
    \ value of num num = num + 3 Output: 1 4 7 Infinite while loop Example 1: This\
    \ will endlessly print the word 'hello' since this situation will always be true.\
    \ while True: print(\"hello\") Example 2: num = 1 whilenum<5: print(num) This\
    \ will endlessly print '1' since we do not update the number value inside the\
    \ loop, so the number value would always remain one, and the condition number<5\
    \ would always give back true. Nested while loop in Python While inside another\
    \ while loop a while loop is present, then it will be considered nested while\
    \ loop. To understand this concept, let us take an example. i = 1 j = 5 while\
    \ i< 4: while j < 8: print(i, \",\", j) j = j + 1 i = i + 1 Output: 1 , 5 2 ,\
    \ 6 3 , 7 Python – while loop with else block We may add an 'else' block to a\
    \ while loop. The section 'else' is possible. It executes only when the processing\
    \ of the loop has ended. num = 10 whilenum> 6: print(num) num = num-1 else: print(\"\
    loop is finished\") Output: 10 9 8 7 Loop is finished \n\nAdding multiple valued\
    \ data in python Often the creator wants users to input multiple values or inputs\
    \ in a line. In Python, users could use two techniques to take multiple values\
    \ or inputs in one line. \n\n1.  Use of split() method\n\n2.  Use of List comprehension"
