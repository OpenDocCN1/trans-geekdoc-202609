    ''m'' 表示切片第 1 个元素的索引数字；而 ''n'' 表示切片最后一个元素的索引数字加一（如果最后一个元素的索引看起来是 2，那么 `n` 就是 3；如果最后一个元素的索引看起来是
    4，那么 `n` 就是 5，依此类推）。![](img/image_rsrc1F9.jpg)


    当我们想要选择前 `x` 个或后 `x` 个元素时（`x` 代表数字），我们可以使用更简单的语法快捷方法：

    - 当我们需要选择前 `x` 个元素时，使用 `a_list[:x]`。

    - 当我们需要选择后 `x` 个元素时，使用 `a_list[-x:]`![](img/image_rsrc1FA.jpg)


    查看如何从第一行提取前四个元素（使用 Facebook 数据）：

    ```python

    first_4_fb = row_1[:4]

    print(first_4_fb) # [''Facebook'', 0.0, ''USD'', 2974676]

    ```

    对于同一行，最后三个元素是：

    ```python

    last_3_fb = row_1[-3:]

    print(last_3_fb) # [''USD'', 2974676, 3.5]

    ```

    在第五行（Pandora 数据行）中，第三和第四元素是：

    ```python

    pandora_3_4 = row_5[2:4]

    print(pandora_3_4) # [''USD'', 1126879]

    ```


    ## Python 列表列表


    之前介绍了列表作为每个数据点使用一个变量的可行方法。我们不需要为五个 ''Facebook'' 数据点（`0.0`、`''USD,''`、`2974676`、`3.5`）每一个创建一个不同的变量，可以将这些数据点连接到一个列表中，然后将列表保存到变量中。从那时起我们处理了一个包含五行的数据集，并将每行存储为每个不同变量中的集合（`row
    1`、`row 2`、`row 3`、`row 4` 和 `row 5` 变量）。


    尽管如此，如果我们有一个 5,000 行的数据集，我们可能会得到 5,000 个变量，这会让我们的代码变得杂乱且几乎难以处理。为了解决这个问题，我们可以将五个变量存储在一个统一的列表中：![](img/image_rsrc1FB.jpg)


    正如我们看到的，数据集是一个包含五个额外列的列表（`row 1`、`row 2`、`row 3`、`row 4` 和 `row 5`）。包含其他列表的列表被称为列表列表。`dataset`
    已经是一个列表，这意味着我们可以使用学过的语法来检索单个列表元素并执行列表切片。下面，我们有：


    - 使用 `dataset[0]` 定位第一个列表元素（`row 1`）。

    - 使用 `dataset[-1]` 定位最后一个列表元素（`row 5`）。

    - 利用 `dataset[:2]` 获取前两个列表元素（`row 1` 和 `row 2`）以执行列表切片![](img/image_rsrc1FC.jpg)


    通常，我们需要从列表列表的一部分获取单个元素——例如；我们可能需要从数据行 `[''FACEBOOK'', 0.0, ''USD'', 2974676, 3.5]`
    中获取 3.5 的评分，该行是数据集列表的一部分。我们利用所学的知识从下面的数据集中检索 3.5：


    - 使用 `dataset[0]`，我们定位 `row_1`，并将输出分配给名为 `fb_row` 的变量。

    - `fb_row[''Facebook'', 0.0, ''USD'', 2974676, 3.5]` 输出，我们将其打印出来。

    - 使用 `fb_row[-1]`，我们在 `fb_row` 中定位最后一个元素，并将输出赋值给变量 `fb_rating`。

    - 打印 `fb_rating`，输出 3.5![](img/image_rsrc1FD.jpg)


    在之前的示例中，我们通过两个步骤获取了 3.5：首先检索 `dataset[0]`，然后检索 `fb_row[-1]`。还有另一种简单的方法，通过连接两个索引（`[0]`
    和 `[-1]`）获取相同的 3.5；代码 `dataset[0][-1]` 可获取 3.5![](img/image_rsrc1FE.jpg)


    在之前的示例中，我们已经看到了两种获取 3.5 值的方法。这两种方法都能得到相同的结果（3.5），但第二种方法的代码更少，因为示例中的步骤被整合在一起。虽然你可以选择替代方案，但人们通常倾向于后者。让我们把五个独立的列表放入列表中：

    ```python

    app_data_set = [row_1, row_2, row_3, row_4, row_5]

    print(app_data_set)

    ```[[image_rsrc1FF.jpg]]


    ## 通过重复方法处理列表


    之前，我们在项目中对应用程序的平均排名感兴趣。当我们尝试只处理三行时，这个任务是可行的，但随着行数的增加，它会变得越来越困难。利用从开始的策略，我们将：


    1. 获取每个单独的评分。

    2. 计算评分和。

    3. 除以评分总数。


