    \ of key pairs limited to curly braces:\n```python\ndict_display ::= \"{\" [key_datum_list\
    \ | dict_comprehension] \"}\"\nkey_datum_list ::= key_datum (\",\" key_datum)*\
    \ [\",\"]\nkey_datum ::= expression \":\" expression | \"** or_expr\ndict_comprehension\
    \ ::= expression \":\" expression\n```\nThe dictionary view shows a new object\
    \ in the dictionary. When a comma-separated series of key / datum pairs is provided,\
    \ they are analyzed from left to right to identify dictionary entries: each key\
    \ entity is often used as a key to hold the respective datum in the dictionary.\
    \ This implies you can clearly state the very same key numerous times in the key\
    \ /datum catalog, but the last one given will become the final dictionary's value\
    \ for that key.\n\n### Generator expressions\nA generator expression is the compressed\
    \ syntax of a generator in the parenthesis:\n```python\ngenerator_expression ::=\
    \ \"(\" expression comp_for \")\"\n```\nAn expression generator produces an entity\
    \ that is a new generator. Its syntax will be the same as for comprehensions,\
    \ except for being enclosed in brackets or curly braces rather than parentheses.\
    \ Variables being used generator expression are assessed sloppily when the generator\
    \ object (in the same style as standard generators) is called by the `__next__()`\
    \ method. Conversely, the iterate-able expression in the leftmost part of the\
    \ clause is evaluated immediately, such that an error that it produces is transmitted\
