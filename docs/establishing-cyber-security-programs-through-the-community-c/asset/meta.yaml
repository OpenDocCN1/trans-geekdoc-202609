  - APPLYING THE FRAMEWORK TO COMMUNITIES
- - '##'
  - 步骤 3：组建一支由对该项目感兴趣的安全专业人员核心小组。
- - '##'
  - 步骤 4：选择一个未来的日期（可能不少于 6-9 个月，也不超过 9-12 个月），计划举办城市“网络安全日”，并安排包含三个部分的研讨会或工作坊：1）面向市政府员工及各关键基础设施人员的会议；2）面向本地行业（任何规模）的会议，未来可能细分为大型企业与中小企业两个会场；3）面向社区居民的会议，让他们了解如何在家中保护自己。十月是
    **国家网络安全月**，是一个合适的举办时间。全国各地都有由行业、专业网络安全组织以及如 **国土安全部** 等联邦机构赞助的活动，旨在提高公众对网络安全问题的认识。将社区网络安全日与这些全国性活动相结合，有助于吸引更多关注，也让首次活动不必过于技术化，重点应放在社区项目的构想上，让参与者能够带走一些可操作的指导，以便自行启动网络安全工作。
- - '##'
  - 步骤 5：与网络安全日同步，正式宣布 **社区信息共享组织（ISAO）**，并在该活动中正式亮相。您需要在正式启动 ISAO 之前，举办一些信息会议，向公众宣传
    ISAO 及其使命。您需要制定章程，并确定社区 ISAO 的初始目标和任务。相关文档可在 **ISAO 网站**（`www.isao.org`）上找到。也有社区可能认为，先成立
    ISAO 是个良好起点，初始成员即可成为社区网络安全计划的推手。如果是这样，网络安全日可以用来提升整个社区的网络安全意识，同时宣传社区 ISAO 及其会员优势。一旦
    ISAO 成立，依据 ISAO 指导文档（在 **ISAO 网站** 上），它最初可能只有有限的功能。这没关系，关键是要 **启动** 它。
- - '##'
  - 步骤 7：建立社区网络安全网站。该网站可以由 ISAO 本身维护，也可以由 ISAO 成员负责运营。有观点认为，由当地政府赞助该网站更为合适，因为社区成员在发生灾害或事件时，往往会自然转向当地政府寻求信息。无论由谁维护，网站都应提供可以分享给社区的网络安全资讯、活动、最佳实践、即将举办的培训等内容。
- - '##'
  - 步骤 8：在首个 9-18 个月内开展社区网络安全桌面推演（tabletop exercise）。可以在 **网络安全日** 之前或之后进行。若在活动之前举行，可在活动现场进行汇报；若在活动之后进行，则可借此宣传并鼓励参与。需要特别强调的是，推演应邀请
    **社区决策者和领导者**（能够“签字”的人物）参与，而非社区的 IT 或安全人员。IT 与安全人员可以协助策划和设计活动，但主要参与者应是市长、市经理、应急中心负责人、当地行业领袖等。要确保此次桌面推演保持简洁，避免过于复杂导致非技术性领导难以理解，或出现“这里根本不会发生”此类言论。让这些领导假设自己已在处理网络安全，进而认识到网络事件对社区的潜在影响。此次推演聚焦
    **整体社区概念**，展示社区如何协同应对事件，而非仅针对单个组织的具体问题（如数据备份）。另一种选择是使用 **2020 年国家级演习（NLE 2020）**
    社区网络安全“游戏”，该游戏旨在向社区介绍网络安全事件。更多关于网络安全推演或 NLE 2020 游戏的信息，请联系 `CIAS@utsa.edu`。
- - '##'
  - 步骤 9：启动社区安全文化宣传运动。可以类比 **Smokey Bear**（常被误称为 “Smokey the Bear”）或 **McGruff** 警察小狗的宣传方式。目标是让社区青年从小培养网络安全意识，让他们知道“他们可以防止网络‘火灾’”或“帮助打击网络犯罪”。宣传活动应包括让中学和高中参与
    **CyberPatriot** 网络防御竞赛等项目。该竞赛已有十余年历史，全国已有数千支队伍报名参与。更多信息请访问 `www.uscyberpatriot.org`。另一种适合青少年的学习方式是
    **Cyber Threat Defender 可收藏卡牌游戏**（适用于 6 年级及以上）及其伴随的 **Cyber Threat Protector**
    游戏（适用于 3-5 年级）。这些游戏已成功向青少年和成人普及网络安全基础，提升对该领域的兴趣，并鼓励青年考虑网络安全职业。Cyber Threat Defender
    已经转为 PC 版免费下载游戏，并已译为西班牙语，正在进行其他语言的翻译。关于卡牌版和电子版的更多信息，请访问 `www.cias.utsa.edu`。
