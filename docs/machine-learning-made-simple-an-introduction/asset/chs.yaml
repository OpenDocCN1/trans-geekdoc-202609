  \  |\n| --- | --- |\n\n![image](img/chapter_title_above.png) \n\n# 13.3 分类链 (Classifier\
  \ Chains)\n\n![image](img/chapter_title_below.png) \n\n在许多应用中，类别是关联的。一个文本文档被标记为“营养”会增加它属于“饮食”的可能性，并减少属于“量子力学”的可能性。在二分类相关性的背景下，这意味着利用类依赖性的方法可能会提高性能。这种方法被称为分类链。\n\
  \n### 思想\n一种简单的方法依赖如图所示的分类器链。在这里，分类器一个一个创建，从左侧开始。最初，最左侧的分类器是从标记为 `C1` 正负的示例诱出的（回想表\
  \ 13.1 中的 `T1`）。\n\n1.  分类链 257\n\n![image](img/image568.png)\n\n––––––––\n\n![image](img/scene_break.png)\
  \ \n\n图 13.1 除 `C1` 外，每个分类器的输入都由原始属性向量加上上一个分类器返回的标签组成\n\n––––––––\n\n![image](img/scene_break.png)\
  \ \n\n第二个分类器然后是从标记为 `C2` 正负实例的示例诱出的。然而，为了描述这些后期示例，在原始属性向量中增加了一个额外属性：`C1` 的输出。在诱导剩余所有分类器的过程中重复相同的原理：对于每个分类器，训练示例由原始属性向量加上上一个分类器返回的类别标签描述。\n\
  \n当使用分类链对未来的示例 `x` 进行分类时，遵循相同的模式。最左侧的分类器接收由原始属性描述的 `x`。对于所有其他分类器，系统呈现由原始属性加上上一个分类器交付的标签描述的\
  \ `x`。最终，`x` 被标记为那些分类器返回 1 的类。\n\n\n\n\n\n### 一个重要的假设（很少满足）\n\n在分类器链（classifier-chain）技术中，类从左到右的排序是工程师的责任。在某些应用中，这是很容易的，因为类形成了一个逻辑序列。例如，在文档分类中，科学包含了物理，而物理又包含了量子力学，以此此类推。如果一个文档不属于科学，那么它也不可能属于物理；因此，在\
  \ `Fig. 13.1` 中选择科学作为图中最左侧的节点并将物理放置在其旁边是有意义的。\n\n在其他应用中，类之间的包含关系并不十分明显，但仍可以在不影响整体性能的情况下使用这种序列。即使包含关系仅是直观的，工程师也可以始终求助于由实验支持的序列：她可以提出几个替代版本，对它们进行测试，然后选择结果最好的一个。另一种可能性是仅将分类器链应用于某些类（已知其相互关系的类），而将其他类视为仅采用基础的二元相关性（binary\
  \ relevance）。\n\n### 分层次排序的类\n\n类之间的相互关系是非线性的。它可以采取只有通过更复杂的数据结构（例如图）才能反映的形式。在这种情况下，我们需要更先进的技术，如\
  \ `Sect. 13.5` 中描述的那种。\n\n## 分类器链方法的一个缺点\n\n通常情况下，工程师缺乏关于类相互关系的先验知识。如果她仍然想使用分类器链，她能做的最好的事情就是随机创建分类器序列。当然，这种权宜的方法无法保证有效；坚持使用不恰的分类器序列可能是有害的，以至于推导系统的分类性能可能无法达到基础二元相关性的水平。\n\
  \n然而，有时也有解决办法。如果类的数量在可控范围内（例如五个），工程师可能会选择尝试几种替代序列，然后选择最好的一个。但如果类的数量更多，尝试许多替代方案的必要性将是不现实的。\n\
  \n### 误差传播\n\n分类器被强制形成线性序列，导致它们容易受到被称为“误差传播”的现象的影响。这意味着：当一个分类器错误地分类了一个示例时，错误的类标签传递给下一个使用该标签作为额外属性的分类器。该额外属性的错误值可能会引导下一个分类器做出错误的判断，而这个错误也会沿着链继续传递。换句话说，单个类的错误可能会导致后续分类器产生额外的错误。在这种情况下，分类器链的性能可能会低于预期。需要记住，整体误差率很大程度上取决于序列中早期分类器的质量。\n\
  \n## 最后的评论\n\n如果分类器不严格返回 `0` 或 `1`，误差传播现象的破坏性较小。因此，贝叶斯分类器为每个类计算其概率，这是一个来自 `[0; 1]`\
  \ 区间的数值。在链中传播这种概率比严格的正或负的危害更小。类似的考虑也适用于某些其他分类器，例如来自神经网络范式的分类器（例如，多层感知器和径基函数网络）。\n\
  \n---\n\n![image](img/scene_break.png)\n\n### 你学到了什么？\n\n为了确保你理解了该主题，请尝试回答以下问题。如有必要，回到文中适当的位置。\n\
  \n* 讨论类之间的依赖性对二元相关技术性能可能产生的典型影响。\n* 解释分类器链的原理。对于寻找合适的分类器序列性，你有什么看法？\n* 解释分类器链中的误差传播问题。这种方法还有其他可以批评的地方吗？\n\
  \n![image](img/chapter_title_above.png)\n\n# 13.4 另一种可能性：堆叠（Stacking）\n\n![image](img/chapter_title_below.png)\n\
  \n考虑到分类器链的缺点，需要一种风险较低的替代方案。一种可能性是依赖堆叠。\n\n### 架构与推导\n\n本质如图 `Fig. 13.2` 所示。在这里，分类器分为两层。上层代表基础的二元相关性（独立推导的二元分类器，每个类一个）。![image](img/image222.png)\n\
  图 13.2 堆叠技术。上层分类器使用原始向量作为输入。对于底层分类器，该向量通过上层返回的标签进行扩展。更有趣的是底层。在 `Fig. 13.2` 所示的具体案例，每个属性向量之前都有四个二元属性（因为有四个类）：如果上层将示例标记为属于类\
  \ `i`，则第 `i` 个属性的值为 `1`；否则该属性的值为 `0`。\n\n### 分类\n\n当需要未来示例的类标签时，首先将 x 呈现给上层分类器。之后，得到的类标签作为\
  \ N 个二元属性（假设有 N 个类）添加到 x 属性向量的前端，并将新描述的示例交给底层分类器。最后，根据底层分类器返回的类对 x 进行标记。其底层哲学基于一种直觉：如果该分类器能够了解其他分类器（关于\
  \ x 所属的其他类）的“意见”，那么 `Ci` 的性能可能会提高。\n\n![image](img/image268.png) ![image](img/image053.png)\
  \ ![image](img/image536.png)\n\n### 示例\n\n考虑一个由四个属性值 `a r z` 描述的示例。假设上层分类器返回以下标签：`C1\
  \ 1; C2 0; C3 1; c4 0`。在这种情况下，底层分类器都接收到以下示例描述：`x 1; 0; 1; 0; a; f; r; z`。\n\n底层分类器的分类行为可能与上层不同。例如，如果底层分类器返回\
  \ `1; 1; 1; 0`，则整个系统会将 x 标记为 `C1, C2, C3`，忽略了上层的原始建议。\n\n## 评论\n\n直觉上，这种方法比分类器链更灵活，因为堆叠使得任何类都能影响其他类。工程师没有提供关于类依赖性的先验信息，假设类依赖性（或缺乏依赖性）可能会在学习过程中被发现。\n\
  \n然而，如果教条地执行，这一原则可能弊大于利。x 属于 `Ci` 这一事实通常与 x 属于 `Cj` 无关。如果是如此，强制建立两者之间的依赖关系（如 `Fig.\
  \ 13.2` 所示）将适得其反。如果大多数类是相互独立的，上层的分类性能实际上可能优于底层，仅仅因为新添加属性（从上层获取的类）是无关的——而我们知道无关属性会损害推导的结果。\n\
  \n\n\n\n\n正确理解这个问题将指导基准学习器的选择。某些方法，例如决策树归纳或`WINNOW`能够消除无关属性，从而缓解该问题。\n\n––––––––\n\
