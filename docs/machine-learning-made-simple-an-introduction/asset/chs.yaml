  \ 多标签分类器分配给这些示例的标签。输出由精确率和召回率的微平均和宏平均值组成。\n\n\n\n\n\n如果我们在几个不同的测试集上对分类器进行测试，每个测试集上的错误率会有所不同——但并非完全随机：测量值的分布无法逃脱统计学规律。良好地理解这些规律有助于我们估计测量结果在真实情况下有多大的代表性。\n\
