  \ d.px2 ; y1/ = p2，我们得出结论两个簇之间的距离为 d.A; B/ = 2。\n\n\n\n\n\n# 层次聚类\n\n对于图 14.4 所示的领域，建议使用称为层次聚类（hierarchical\
  \ aggregation）的聚类技术。其原理总结在表 14.3 的伪代码中。\n\n在第一步中，每个示例定义自己的类。这意味着在一个具有 `N` 个示例的领域中，我们有\
  \ `N` 个初始类。在后续的一系列步骤中，层次聚类总是根据前几节中提到的距离度量，识别出互互距离最小的一对类。然后对这些类进行合并。在早期，这通常等同于合并相邻的示例对。在后期，这的结果要么是将一个示例添加到其最近的类中，要么是合并两个相邻类。前几个步骤如图\
  \ 14.5 所示。\n\n该过程一直持续，直到满足了适当的终止准则。一种可能性是在类的数量低于用户指定的阈值时停止。另一种是基于类与类之间的距离确定停止准则（当这些距离中的最小值超过某个值时结束）。\n\
