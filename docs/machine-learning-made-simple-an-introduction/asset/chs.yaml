  \ # 数值域中的感知机\n\n在感知机学习的情况下，答案显而易见：是的，可以使用相同的权重修改公式。然而，实践表明，将所有属性值都落入单位区间 `xi ∈ [0,\
  \ 1]` 是好的。\n\n为了方便读者阅读，我们在这里重复一下权重调整公式：\n\n`wi = wi + 1 * (c(x) - h(x)) * xi` (4.15)\n\
  \n![image](img/image602.png) 虽然学习率 `1` 以及真实标签与假设标签之间的差异 `c(x) - h(x)` 的意义和影响与之前相同，但改变的是\
  \ `xi` 的作用。在布尔属性的情况下，`xi` 的值决定了权重是否应该改变。然而，在这里它更多是指权重应该受多大影响：属性值越高，受影响越大。\n\n##\
  \ 乘法规则\n\n在 `WINNOW` 的情况下，本质上也可以使用与二值属性情况相同的学习公式：\n\n`wi = wi * α^(c(x) - h(x)}`\
  \ (4.16)\n\n![image](img/image112.png) 话虽如此，必须注意何时应用该公式。之前，我们只修改 `xi = 1` 属性的权重。现在属性值来自连续域，就需要进行一些修改。一种可能性是以下规则：\n\
  \n“仅当第 `i` 个属性的值为 `xi > 0.5` 时才更新权重 `wi`。”\n\n我们要指出，这两种算法（感知机学习和 `WINNOW`）即使在两类线性不可分的情况下（例如存在噪声时），通常也能找到误差较小的解。\n\
  \n## 哪种线性分类器更好？\n\n然而，此时需要讨论另一个重要问题。图 4.8 显示了三个线性分类器，它们都完美地将正训练样本与负样本分开。由于训练集上的“良好表现”不能保证未来的高性能，我们必须问：这三个中哪一个在未来的样本上可能得分最高？\n\
  \n## 支持向量机\n\n研究这个问题的数学家找到了答案。当我们观察图 4.8 时，可以看到虚线分类器几乎触及了两侧最近的样本；我们说它的间隔（margin）很小。\n\
  \n4.7 数值域与支持向量机 85\n\n相反，实线分类器的间隔更大：线的一侧最近的正样本和线的另一侧最近的样本比另一种分类器的情况远得多。事实证明，间隔越大，分类器在未来数据上表现良好的概率越高。\n\
  \n支持向量机的技术如图 4.9 所示。实线是最佳分类器。图表还显示了两条与分类器平行的细线，且距离相同。读者可以看到它们穿过了距离分类器最近的样本。这些样本被称为支持向量（因为毕竟，每个样本都是一个属性向量）。\n\
  \n机器学习的任务是识别使间隔最大的支持向量。机器学习的任务是识别使间隔最大的支持向量。支持向量机的技术在文中所示。最简单的技术将是尝试所有可能的样本并测量间隔。大多数时候，工程师依赖于互联网上的一些软件包。\
