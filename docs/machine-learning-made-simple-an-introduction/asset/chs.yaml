  \ | --- |\n\n![image](img/chapter_title_above.png) \n\n## 7.3 一些实际和理论意义\n\n![image](img/chapter_title_below.png)\n\
  \n本章第一节的理论分析为学习任务提供了更广阔的视角，以及意义不言而喻线索。它们的益处从理论学家享受的纯智力满足，到最务实的工程师所欣赏的实践指南不等。让我们快速查看其中一些。\n\
  \n### 偏置（Bias）与可学习性\n第 7.2 节研究了受限于属性值合取的类的 PAC 可学习性。这种类型的约束被称为偏置（bias）。\n\n![image](img/image435.png)![image](img/image464.png)允许忽略某些属性，我们计算出假设空间的大小为\
  \ `3^n`。通过要求每个属性都参与来加强偏置，假设空间的大小将缩小为 `2^n`。这是因为在之前的情况下，允许了第三种可能性（忽略）。\n\n存在许多其他偏置，有些限制合取项的数量，有些倾向于析取（disjunction）或其他约束。对于我们的讨论来说，每种偏置都可能导致不同的假设空间大小。正如我们所见，这影响了可学习性。\n\
  \n![image](img/image421.png)![image](img/image001.png)没有偏置不可学习\n在没有任何偏置的情况下（允许任何布尔函数），我们已经确定\
  \ `ln H` 的值随属性数量指数级增长，`ln H 2^n ln 2`，这意味着该类在通用形式下不可学习。解释很简单：无约束的假设空间如此巨大，以至于可能会找到一个正确标记整个训练集的分类器，但在未来的示例上表现很差。直白地说，归纳出的分类器是不可信的。从这个意义上说，我们带有保留地说：“没有偏置就无法学习。”\n\
  \n需要记住的是，只有当工程师通过有意义的偏置约束假设空间时，机器学习的冒险才能成功。然而，理论上假设空间包含了解决方案，且示例没有噪声。\n\n![image](img/image719.png)奥卡姆剃刀\n\
  经常，工程师有机会从两个或多个偏置中进行选择。例如，要学习的类是由属性值的合取描述的，其中每个属性都参与。一种较弱的偏置允许合取中缺失某些属性，这也包含了零缺失属性的情况，因此也是正确的。在前一种情况下，我们有\
  \ `ln H n ln 2`；而在另一种情况下，为 `ln H n ln 3`，后者更大。因此我们有两个正确的偏置，每个定义了一个不同大小的假设空间。倾向于哪一个？\n\
  \n留心的读者无疑已经知道了答案。在不等式 (7.5) 中，成功学习所需的训练示例取决于 `ln H`。该项的值越低，意味着为了满足给定的 `(E, ı)-requirements`，所需的示例越少。因此，工程师将从选择假设空间较小的偏置中受益。\n\
  \n\n\n\n\n顺便说一下，科学家们几个世纪以来一直使用一条类似的规则：在两个不同的假设都能解释某种现象的情况下，通常假设较简单的假设成功的概率更高。这一原理被称为“奥卡姆剃刀”（Occam’s\
  \ Razor），它以一位死于 14 世纪的经院神学家命名，这表明该规则的使用早于现代科学。这里“剃刀”一词是为了强调，在制定假设时，最好能切掉所有不必要的信息。数学家们现在能够在机器学习领域找到该原理有效性的形式化证明，甚至能够对其效用进行量化，这是一项非凡的成就。![image](img/image336.png)\n\
  \n### 无关和冗余属性\n在第 7.2 节研究的类别中，样本数量下界 `m` 取决于属性数量 `n`。例如，在属性值取值的组合的情况下，我们现在知道 `ln\
  \ H` 以及满足这些需求所需的样本数量随 `n` 线性增长。\n\n––––––\n\n![image](img/scene_break.png)\n![image](img/image605.png)\n\
  \n对未满足这些要求的情况进行分析将超出教科书的范围。同样的结论使我们能够对无关或冗余属性的存在可能如何影响学习性形成意见。这些属性的数量越高，`n` 的值越大，这意味着如果我们想满足要求，就必须提供更多的训练样本。教训是明确的：每当我们有机会识别（并移除）那些只有极小比例携带相关信息的低用用属性时——最好这样做。\n\
