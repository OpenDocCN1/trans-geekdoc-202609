  \nD 0:91\n\n![image](img/image309.png)\n\n可以看到精确率有了显著提高，而召回率几乎没有受到影响。注意，分类准确率也没有提高。\n\
  \n––––––––\n\n![image](img/scene_break.png)\n\n![image](img/image112.png)表 11.2\
  \ 的图说明了在 `pos` 和 `neg` 两类表示不平衡的简单领域中，这两个标准的行为。生成的分类器虽然表现出令人惊讶的分类准确率，但精确率和召回率较低。具体来说，`Pr\
  \ 0:40` 的精确率意味着在分类器标记为正类的 50 个样本中，只有 20 个确实是正类，剩下的 30 个全是假阳性。对于召回率来说，情况更加糟糕：在测试集的\
  \ 70 个正类样本中，只有 20 个被分类器正确识别为正类。\n\n![image](img/image468.png)imageimage 假设工程师决定通过修改分类器的内部参数来改进状况，并假设这种修改导致真阳性数量增加（从\
  \ `NTP` 20 增加到 `NTP` 30），同时假阳性数量减少（从 `NFP` 30 减少到 `NFP` 20）。另一方面，假阴性的数量也增加了：从 `NFN`\
  \ 50 增加到 `NFN` 70。表 11.2 中的计算表明，召回率因此几乎不受影响，但精确率从 `Pr 0:40` 提高到了 `Pr 0:60`。分类准确率几乎保持不变——实际上，尽管精确率有所提高，它甚至略有下降。\n\
  \n## 当高精确率很重要时\n\n在某些领域，精确率比召回率更重要。例如，当你从电子商务网站购买物品时，他们的推荐系统通常会返回一条这样的信息：“购买过 X\
  \ 的客户也购买 Y。”其显而易见的意图是诱你也购买 Y。\n\n推荐系统有时是借助应用于公司历史数据的机器学习技术创建的。¹ 在评估它们的性能时，工程师希望实现高精确率。客户最好对推荐商品感到满意，否则他们将来将忽略这些建议。\n\
  \n在这里，召回率的价值并不重要。网站提供的列表规模是有限的，因此系统只识别出客户可能喜欢的所有物品中的一小部分并没有大碍。\n\n![image](img/image112.png)当高召回率很重要时\n\
  \n相比之下，在其他领域，召回率更重要。这通常出现在医学诊断中。患有 X 并被正确诊断为 X 的患者代表一个真阳性。一个患有 X 但未被诊断为 X 的患者代表一个假阴性，这是医生希望避免的——这意味着\
  \ `NFN` 应该很小。在召回率的定义中，Re\n\n![image](img/image228.png)imageNTP，假阴性的数量出现在分母中；因此，较小的\
  \ `NFN` 值（TP / FN）意味着高召回率。\n\n### ROC 曲线\n\n在许多分类器中，调整某些参数可以修改 `NFP` 和 `NFN` 的值，从而影响（至少在某种程度上）分类器的行为，例如，以牺牲精确率为代价提高召回率，反之亦然。这种可能性在用户对这两个量中哪个更重要有想法的领域是很有用的。\n\
  \n读者会发现很容易提出各种进行“调整”的方法。因此，在 `k-NN` 分类器中，工程师可能会要求除非有非常强的证据支持正类标签，否则将样本标记为负类。例如，如果七个最近邻居中有四个是正类，可以指示分类器返回负类标签（尽管少数多数推荐正类）。通过这种方式，可以减少假阳性的数量，尽管这通常意味着要付出假阴性数量增加的代价。通过要求除非七个最近邻居中至少五个（或六个）是正类，否则认为任何样本均为负类，可以更进一步地减少\
  \ `NFP`（并增加 `NFN`）。\n\n––––––––\n\n![image](img/scene_break.png)\n\n![image](img/image605.png)类似的方法在贝叶斯分类器和神经网络中很容易实现。想法是相同的：除非强证据表明该决策错误，否则使用首选类标记。\n\
  \n分类器在不同参数值下的行为可以通过所谓的 ROC 曲线来可视化，ROC 是一种图，横轴代表负类的错误率，纵轴代表正类的准确率。两个分类器 c1 和 c2 的示例\
  \ ROC 曲线如图 11.2 所示。理想情况下，我们希望到达负类错误率为零且正类准确率为百分之百左角。由于各种原因，这很少实现。\n\n一个重要的问题是 c1\
  \ 和 c2 哪个更好。这只能根据具体的需求来回答。通过观察图，我们只能说在负类错误率低的区域，c1 优于 c2。随着负类错误率的增加，c2 优于 c1。同样，这好坏只能由用户决定。请参见关于何时偏好精确率和召回率的注释。\n\
  \n## 你学了什么？\n\n为了确保你理解了这个主题，请尝试回答以下问题。如果你有困难，请回到文中相应的部分。\n\n- 在什么样的数据中，我们更倾向于使用精确率和召回率这两个量来评估分类器的性能（而不是比如错误率）？\n\
  - 有什么公式帮助我们计算这些标准的具体值？这两个公式有什么区别？\n- 在什么情况下我们偏好高精确率，而在什么情况下我们更强调高召回率？\n- 解释 ROC\
  \ 曲线的本质。ROC 曲线提供了关于分类器行为的哪些额外信息？ROC 曲线如何帮助用户在两种备选分类器之间做出选择？\n\n\n\n\n\n除了错误率、分类准确率、精确率和召回率，有时还会使用其他标准，每种标准都反映了分类器行为的不同侧面。让我们简单了解一下一些最重要的标准。\n\
  \n## 在 Fβ 中结合精确率和召回率\n\n使用两个不同的（有时是相互矛盾的）性能标准可能会很别手；用一个单一数字来量化事物是符合人的本性的。特别是在精确率和召回率的情况下，人们已经尝试将两者合并为一个量。最为人知的此类公式\
  \ `Fβ` 的定义如下：\n\n```\nFβ = (β² * Pr * Re) / (β² * Pr + Re) \n```\n\n参数 `β` 允许用户权衡这两个标准的相对重要性。如果\
  \ `β > 1`，则赋予召回率更大的权重。如果 `β < 1`，则赋予精确率更大的权重。很容易证明，当 `β→∞` 时，`Fβ` 收敛于召回率，当 `β→0`\
  \ 时，收敛于精确率。很多时候，工程师并不真正知道精确率和召回率哪一个更重要，以及重要多少。在这种情况下，她倾向于使用参数的中性值 `β=1` 进行工作。\n\n\
  ```\nFβ = (2 * Pr * Re) / (2 * Pr + Re)\n```\n\n### 数值示例\n\n假设对测试集上的分类器的评估结果如表 11.2\
  \ 上部所示。对于这些结果，表格分别确定的精确率和召回值为 `Pr=0.40` 和 `Re=0.29`。使用这些数字，我们将针对参数的以下设置（`β=0`、`β=1`\
  \ 和 `β=5`）计算 `Fβ`。\n\n```\nF0 = (0² * 0.40 * 0.29) / (0² * 0.40 + 0.29) = 0\nF0.2\
  \ = (0.2² * 0.40 * 0.29) / (0.2² * 0.40 + 0.29) = 0.036\nF1 = (1² * 0.40 * 0.29)\
  \ / (1² * 0.40 + 0.29) = 0.33\nF5 = (5² * 0.40 * 0.29) / (5² * 0.40 + 0.29) = 0.70\n\
  ```\n\n## 敏感性和特异性\n\n具体标准的选择通常受给定应用领域的影响——其特定的需求和根深蒂固传统不应被忽视。因此，医学领域已经习惯通过敏感性（Sensitivity）和特异性（Specificity）来评估其“分类器”（不一定由机器学习开发）的性能。本质上，这些量仅仅是分别在正样本和负样本上测量的召回率。让我们更具体一点：\n\
  \n敏感性是在正样本上测量的召回率：\n\n```\nSe = TP / (TP + FN)\n```\n\n特异性是在负样本上测量的召回率：\n\n```\n\
  Sp = TN / (TN + FP)\n```\n\n在机器学习的文献中，基于敏感性和特异性进行评估非常罕见，但意识到这两个标准仍然是有好的。毕竟，在将机器学习应用于医学数据时，我们可能会被要求使用它们——而且客户才是最终的老板。\n\
  \n## Gmean\n\n在类别表示不平衡的领域中引入分类器时，工程师有时希望在 `pos` 和 `neg` 两个类别上实现相似的性能。在这种情况下，使用两个分类准确率（正样本上的准确率和负样本上的准确率）的几何平均值\
  \ `gmean`：\n\n```\ngmean = sqrt(accpos * accneg)\n```\n\n请注意，`gmean` 实际上是两个数字乘积的平方根：正样本上的召回率和负样本上的召回率——换句话说，就是敏感性和特异性的乘积。\n\
  \n`gmean` 最重要的方面可能是，它不仅取决于根号符号下两个项的具体值 `accpos` 和 `accneg`，还取决于它们之间的接近程度。\n\n\n\n\
  \n\n在本节中，我们将对学习成本进行一些思考——包括成功归纳所需的示例数量，以及所消耗的计算时间。另一个方面，即归出一个具有高分类性能工具的能力，将在下一节中讨论。\n\
  \n## 学习曲线\n\n在评估人类受试者学习解决特定能力时，心理学家依赖于学习曲线，机器学习也为了自己的目的借鉴了这一概念。\n\n从我们的角度来看，学习曲线简单地展示了归纳出的分类器的分类性能如何取决于训练集的大小。图\
  \ 11.3 显示了两个这样的曲线。横轴代表训练示例的数量；纵轴代表从这些示例归出的分类器的分类准确率。通常（尽管并非总是），这种分类准确率是在独立的测试示例上评估的。\n\
  \n大多数时候，较大的训练集意味着更高的分类性能——至少在无法进一步改进的时刻之前。理想情况下，我们希望从尽可能小的训练集中获得最大的性能。一方面，获取训练示例可能非常昂贵，无论我们愿意投入多少钱，其来源都是有限的。另一方面，使用的示例越多，归纳的计算成本就越高。\n\
  \n## 比较具有不同学习曲线的学习者\n\n图 11.3 显示了两个学习器 `l1` 和 `l2` 的学习曲线。读者可以发现前者 `l1` 的学习曲线上升非常快，直到在一个几乎没有进一步改进的地方达到平衡——这种限制可能是由错误的偏差引起的（见第\
  \ 10.1 节）。相比之下，第二个学习者 `l2` 的学习曲线增长得并不快，但最终实现了比 `l1` 更高的准确率。哪条曲线表示更优的学习者取决于给定应用的情况。当训练示例的来源有限时，第一个学习者显然更合适。如果示例充足，我们将更倾向于另一个学习者，当然前提是计算成本不是不可接受的。\n\
  \n```\nFig 11.3 学习曲线展示了所实现的分类准确率如何取决于学习过程中使用的示例数量\n\n分类准确率 100%\n\n![image](img/image094.png)l1\n\
  \nl 2\n\n––––––––\n\n![image](img/scene_break.png) \n\n# training examples\n```\n\
  \n### 计算成本\n\n计算成本有两个方面。首先是从可用数据归纳分类器所需的时间。其次是使用由此归纳的分类器对一组示例进行分类所需的时间。\n\n沿着这些思路，此书中描述的技术涵盖了相当广泛的范围。对于归纳成本，便宜的是基本版本的\
  \ `k-NN` 分类器：涉及的唯一“计算”是存储训练示例。另一方面，`k-NN` 分类器的分类成本是非常昂贵的。例如，如果我们有一百万训练示例，每个示例由一万个属性描述，那么分类单个示例将进行数十次算术运算。当要求分类数百万示例时，即使是非常快的计算机也会花费相当的时间。\n\
  \n决策树的情况有所不同。它们用于分类示例时是廉价的：通常只需要中等数量的示例。然而，如果有许多属性，归纳决策树可能会花费大量时间。\n\n归纳成本和分类成本各异，选择取决于应用。对可用数据的某些了解有助于我们选择最合适的范式；例如，如果怀疑很大比例的属性是无关的，那么决策树可能是成功的。\n\
  \n### 你学了什么？\n\n为了确保你理解了这个主题，请尝试回答以下问题：\n- 成本的两个主要方面是什么？\n- 学习曲线告诉了我们关于给定算法的什么？\n\
  - 在什么情况下，斜率更大但最大值较低的曲线比斜率较平但最大值更高的曲线更好？\n\n## 11.5 实验评估的方法论\n\n读者理解不同的领域将受益于不同的技术。选择通常并不困难。\n\
  \n### 基准方法及其局限性\n\n基本场景是简单的。预分类示例集被分为两个子集，一个用于训练，另一个用于测试。对不同的参数设置重复训练-测试过程，然后选择性能最高的那一个。\n\
  \n然而，这只有在有大量预分类示例的情况下才能进行。在示例稀缺或获取昂贵的领域，随机划分为训练集和测试集将缺乏客观性。这两个集合中的任何一个都可能偶然地充分地代表给定领域。统计学家告诉我们，训练集和测试集应该具有大致相同的示例分布。在小集中，这是无法保证的。\n\
  \n### 随机子采样\n\n当预分类示例集较小时，工程师通常倾向于重复执行训练-测试程序。在每次运行中，示例集被随机分为部分，一个用于训练，另一个用于测试。记录测量的性能并取平均值。必须注意单独的数据划分是相互独立的。\n\
  \n![image](img/image056.png)![image](img/image087.png)\n```\n![image](img/image605.png)如果我们决定移除冗余示例，将需要一些计算。\n\
  \n| ![image](img/chapter_title_left.png)  ||  ![image](img/chapter_title_right.png)\
  \  |\n| --- | --- | --- |\n| ![image](img/chapter_title_above.png) |\n| ![image](img/chapter_title_bottom.png)\
  \ |\n```\n\n\n\n\n\n# 1. N 折交叉验证\n\n为了更高级的统计评估，经验丰富的实验者往往倾向于所谓的`N 折交叉验证`（N-fold\
  \ crossvalidation）。其原理如图 11.4 所示。首先，将预分类示例集划分为 `N` 个大小相等（或几乎相等）的子集，机器学习术语有时（虽并不完全准确）将这些部分称为“折”（folds）。\n\
  \n![image](img/image602.png)\n\n随后，`N 折交叉验证`会运行 `N` 次实验。在每次实验中，都会移除 `N` 个子集中的一个，仅用于测试（这保证了在每次运行中都使用不同的测试集）。然后在剩余的\
  \ `N-1` 个子集的并集上进行训练。同样，对结果进行平均值处理，并计算标准差。\n\n### 图 11.4 N 折交叉验证\n交叉验证将训练集分为 `N`\
  \ 个大小相等的子集。在 `N` 次实验运行中的每一次，都会留出一个不同的子集进行测试，从剩余的 `N-1` 个子集的并集中推导分类器。\n\n![image](img/scene_break.png)\n\
  \n**5 折交叉验证**\n\n![image](img/image128.png)\n1. ![image](img/image163.png)\n2. ![image](img/image152.png)\n\
  3. ![image](img/image129.png)\n4. ![image](img/image401.png)\n5. ![image](img/image556.png)\n\
  原始训练集 ... 测试\n\n![image](img/scene_break.png)\n![image](img/image375.png)image...\
  \ 训练\n\n![image](img/scene_break.png)\n\n`N 折交叉验证`与随机子采样的相比在于测试集是不相交的（不重叠），这被认为对于某些类型的统计评估是有利的（参见第\
  \ 12 章）。\n\n![image](img/image112.png)\n\n### 分层方法\n\n假设你正在处理一个包含 60 个正样本和 940 个负样本的领域。如果你依赖于\
  \ `N=10` 的 `N 折交叉验证`，那么每个“折”都可能包含不同数量的正样本。平均而言，每个折中会有 6 个正样本，但具体数字可能会有显著差异。在某一类别相对稀疏的领域，甚至可能出现某些“折”完全不包含任何正样本的情况。这种情况通常出现在类别表示极度不平衡的领域。\n\
  \n在这种情况下，经验丰富的实验者更倾向于使用`N 折交叉验证`的所谓“分层方法”（stratified approach）。其思想是确保每个 `N` 个“折”都包含（大致）相同的各类别示例表示比例。例如，在一个分别有\
  \ 60 个正样本和 940 个负样本的领域中使用五折交叉验证时，每个折都应由 200 个示例组成，其中 12 个是正样本。\n\n同样的原理经常用于随机子采样方法——诚然，它的分层版本已不再是随机的。同样，其核心是确保每个训练集和每个测试集都具有每个类别大致相同的表示。\n\
  \n![image](img/image639.png)![image](img/image639.png)\n\n## 5 折交叉验证 (5cv)\n\n机器学习技术实验评估的另一种方法是所谓的`5-折交叉验证`（52\
  \ Crossvalidation，此处应为 5cv）。这种方法是机器学习中非常常用的方法。它基于子采样和交叉验证的结合。\n\n![image](img/image639.png)\n\
  \n具体地说，`5cv` 将训练集分为两个大小相等的子集（此处原文可能应为 5 折），每次留出一个不同的子集进行测试，从剩余的 `N-1` 个子集的并集中推导分类器。这种方法重复\
  \ 5 次。\n\n### 5 折交叉验证 (5cv)\n另一种机器学习技术实验评估的方法是所谓的`5 折交叉验证`，缩写为 `5cv`。`T` 将预分类示例集分为两个大小相等的子集。\n\
  1. ![image](img/image473.png) 在 5 次实验运行中的每一次，都会留出一个不同的子集进行测试，从剩余的 `N-1` 个子集的并集中推导分类器。\n\
  2. 随后在剩余的 `N-1` 个子集的并集上进行训练。\n3. 再次对结果进行平均值处理，并计算标准差。\n\n![image](img/image309.png)\n\
  \n![image](img/scene_break.png) `N 折交叉验证`与随机子采样的相比在于测试集是不相交的（不重叠），这被认为对于某些类型的统计评估是有利的（参见第\
  \ 12 章）。\n\n### 分层方法\n\n![image](img/scene_break.png)\n\n![image](img/image375.png)image...\
