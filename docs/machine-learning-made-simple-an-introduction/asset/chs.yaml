  \ 3` `C z` `C`\n\n尽管无法说话，甚至无法移动眼球，但这种方法仍可能成为患者与外界进行交流的一种。\n\n运动指令的精确性质太复杂，无法用数学公式表达。但我们可以记录这些信号，通过属性描述它们，并用具体的运动指令进行标记。如果我们这样做，就得到了一个训练集，机器学习程序可以从中推导出分类器。\n\
  \n### 训练示例 在节要描述的特定案例中，只考虑了两个类：`left`（左）和 `right`（右）。训练和测试示例是通过以下实验获得的。受试者坐在计算机显示器前。他面前的桌子上有一块木板，上面有两个按钮，根据显示器上显示的指令，一个由左食指按下，另一个由右食指按下（图\
  \ 8.4）。\n\n整个场景遵循图 8.5 上部所示的时间线。附着在头皮上的接触电极（见图 8.5 下部）记录了在按下按钮之前某段时间内的神经信号强度。来自每个电极的信号由五个数值属性表征，每个属性代表信号在特定时间间隔内（一秒的分之一）的功率。\n\
  \n如图片所示，只有部分（通常为 `11` 个）电极被实际使用。对于 `11` 个电极，每个电极由 `5` 个属性代表，这总共是 `55` 个属性。总之，受试者“产生”了数百个两类比例相等的示例。由于一直知道实际按下的是哪个按钮，因此训练集没有类别标签噪声。至于属性，实验者怀疑其中许多是是无关的。\n\
  \n### 分类器的推导及其局限性 我们实验了多种机器学习范式，包括多层感知器和最近邻分类器，并对属性值范围进行了归一化处理，以避免缩放相关的问题。通过决策树选取了相关属性，类似于在前几节中讨论的应用中的方法。\n\
  \n这些推导出的分类器在测试数据上的典型错误率在 `20–30%` 之间，取决于具体的受试者。完全可能无法获得更好的准确率：电极提供信息可能对于这类实验来说是不够的。\n\
  \n重要的是，就像在睡眠分类领域一样，分类器只能应用于从其训练数据中推导出的该受试者。所有推导“通用分类器”（用于未来的任何受试者）的尝试都失败了——错误率高到使得分类过程看起来像是随机的。\n\
  \n### 测试分类器的实用性 与前一个领域一样，在独立数据上测得的错误率并不能反映全貌；分类器的实际用途取决于它如何被实际使用。在我们的案例中，真正的问题是：分类器是否能成功将光标发送到正确的位置？\n\
  \n这个问题通过图 8.6 所示的实验得到了解答。受试者仍然坐在计算机显示器前，头皮上连接着电极。然而，带有两个按钮的木板已被移除。在显示器上，我们可以看到两个矩形，一个在左边，一个在右边。中间是一个小十字形状的光标。\n\
  \n当被指示移动光标（例如，向右移动）时，受试者只是想象自己正在按下右按钮。电极记录了神经信号并将其传递给分类器。基于这些信号，分类器选择了光标要移动到的侧边（类别，`left`\
  \ 或 `right`）。移动非常缓慢，以便给受试者机会“纠正”错误的方向。为了实现这一点，神经信号被反复采样，每个样本都变成一个传递给分类器的示例。假设受试者的意图是将光标向右移动。第一个样本可能会被误分类为\n\
  \n![image](img/image009.png)图 8.6 分类器的任务是将十字移动到左侧框或右侧框内，根据受试者的“想法”`left`，将光标移向错误方向；但如果后续样本被正确分类为\
  \ `right`，光标最终会落在正确的矩形内。\n\n### 什么样的错误率是可以接受的？在刚刚描述的场景下，`30%` 的错误率（看起来很高）被证明是完全可以接受的。即使由于“示例”被误分类导致光标偶尔从错误方向开始，在光标到达目的地之前仍有纠正的机会。因此，光标几乎总是落在正确的框内，尽管其移动的方式有些犹豫，反复移动。\n\
  \n一个不了解分类器实际如何被使用的客观观察者，很少察觉到什么不对劲。分类器部分的偶尔错误（表现为光标的来回移动）有时被认为是受试者的犹豫不决，而不是分类器的缺陷。\n\
  \n### 诚实的历史说明 分类器的性能人与人之间不同。在很大比例的受试者中，推导出的分类器表现出高到难以接受的错误率。此外，分类器必须在预期使用的同一位患者上进行训练，这一事实被视为一个缺点。此外，两个类是不够的。至少还需要\
  \ `up`（向上）和 `down`（向下）类。在这些类别上，实验结果并不那么理想。最终，与瘫痪患者交流的其他方法得到了研究。虽然作为一个机器学习练习是成功的，但该项目并没有满足医学领域的期望。\n\
  \n![image](img/scene_break.png) \n\n###### 你学了什么？\n\n为了确保你理解了这一主题，尝试回答以下问题。如果你有困难，请返回前文中相应位置。\n\
  \n\n\n\n-   讨论在该应用程序中的体验：从一个学科的数据中诱出的分类器不能用于分类另一个学科的示例。\n-   解释为什么在这一领域，30% 的错误率仍然被认为是可以接受的。在该应用程序中，你推荐哪些其他衡量性能的方法？\n\
  \n# 8.5  医学诊断 165\n\n试图寻找患者主诉根源的医生行为有点像一个分类器：基于某些属性（患者的症状、实验室检查结果），她给出一个诊断——以及治疗方案。难怪在机器学习的早期，许多人认为医学诊断是其自然且几乎是理直易懂的应用。\n\
  \n### 部分结果\n这种乐观情绪源于早期的研究，例如表 8.1 总结结果所示的研究。这些数字给出了贝叶斯分类器、决策树和医生在同一测试集（通过属性向量描述的患者）上所实现的分类准确率。这四个领域在类别数量和任务难度（例如数据中的噪声、可用信息的相关性和可靠性）方面存在差异。\n\
  \n这些数值确实似乎证实了机器学习推导出能够与人类专家竞争的分类器的能力；事实上，它们似乎超过了人类。在多类原发性肿瘤领域，这种差距可能并不尽如，但在所有其他领域，机器学习分类器似乎明显更好。遗憾的是，该表格没有告诉我们更多关于结果变异的信息。至少标准差在这里会有帮助，但还有其他方法可以确定结果在统计学上是否可靠——第\
  \ 11 章和第 12 章将对此处使用的方法进行更多阐述。\n\n### 结果令人鼓舞吗？\n结果看起来令人印象深刻，但我们不能过早下结论。要问第一个问题是这种比较是否公平。由于示例是通过属性描述的，机器学习工具以及诱出的分类器所能获得的数据，很难与医生所使用的数据相同，因为医生还可以依靠机器可能无法获取的主观信息。在这方面，人类拥有某种优势，这使得机器学习的结果更加令人印象深刻了。\n\
  \n另一方面，该研究的作者承认，参与研究的医生并不一定是给定领域的顶尖专家，因此机器学习仅优于全科医生。另一个值得我们注意的方面是，这项研究是在 20 世纪 80\
  \ 年代进行的，当时的诊断工具没有今天使用的工具那么复杂。很难说谁将从现代实验室检测中获益更多：人类专家还是机器学习？\n\n表 8.1 两个分类器与医生在四个医学领域的性能比较的分类准确率\n\
  \n### 除了分类外，还需要解释\n对于医学诊断来说，分类准确率是不够的；更准确地说，它还不够……\n\n### 测量信度的需求\n（正按原始逻辑继续……）\n\
  \n### 文化障碍\n（正按原始逻辑继续……）\n\n# 8.6  文本分类 167\n\n假设你有一个大量的文本文档集，你需要决定其中哪些与你感兴趣的特定主题相关。如果文档真的非常多，你无法手动完成。然而，从上述描述的一些应用中获得灵感，你选择了这些文档中一个可管理的子集，阅读它们，为它们分配类别标签（正面与负面），并诱出一个分类器，然后该分类器将用于对剩余文档进行分类。\n\
  \n\n\n\n![image](img/image112.png)\n\n### 属性\n描述文档的一种常用方法是其包含的词的频率。每个属性代表一个词，其值代表该词在文中出现的频率。例如，在一个长度为\
  \ 983 个单词的文档中，“classifier”一词可能出现了五次，在这种情况下频率为 `5=983 0:005`。\n\n由于词汇表通常包含数万个单词，属性向量将非常长。而且，由于只有词汇中的一小部分出现在文档中，大多数属性值将为零。由于这有点有些难以处理，简单的应用程序倾向于只处理整个词汇的一个子集，例如最常见的\
  \ `1000` 个单词。\n\n### 类别标签\n训练示例的类别标签可能很难确定。即使我们只想做一些非常简单的任务，例如判断每篇文档是否涉及计算机科学，某个示例是否明显属于该类可能也不容易决定，因为某些文档比其他文档更相关这一类别。例如，一个非常明确的案例将是关于算法分析的科学论文；另一方面，相关性较低的文档只会顺带提到某些算法比其他算法昂贵；而另一篇文档将是一篇流行杂志的文章。\n\
  \n处理这种情况的一种可能是对类别标签进行“分级”。例如，如果文档确定高度相关，则类别为 `2`；如果只是部分相关，则类别为 `1`；只有在完全无关的情况下，类别为\
  \ `0`。用户随后可以决定给定应用需要什么种程度的相关性。\n\n## 典型观察结果\n大量的属性使得归纳在计算上非常昂贵。因此，在决策树的情况下，由于必须为每个属性单独计算信息增益，这意味着每次测试都需要调查数万个属性，而这些计算可能会花费大量时间，特别是在示例数量较高时。经过思考，读者会同意，贝叶斯分类器和神经网络也是相当昂贵的。\n\
  \n人们可能会认为，在 `k\\-NN` 分类器或线性分类器的情况下，归纳会更廉。。在这里，另一个困难凸显出来：对于每个给定的主题，绝大多数属性都是无关的，这种情况降低了这两种范式的效用。\n\
  \n## 多标签示例问题\n前节讨论的应用程序假设每个示例仅被标记为一个类。然而，在这里，每篇文档可以同时属于两个或多个（有时是许多）类。\n\n处理这种情况最常用的方法是为每个类归纳一个不同的分类器。每当需要未来文档的类别时，会将文档的属性向量并行提交给所有这些分类器；其中一些将返回“1”（意味着文档属于相应的类），另一些将返回“0”。\n\
  \n然而，由于需要归纳成百个分类器，这使得这项任务变得更加昂贵。鉴于这些分类器中的每一个归纳本身就是昂贵的，结果可能是无法企及的。\n\n此外，类之间并不是相互独立的。至少，某些类是其他类的子类，从而产生了一个完整的类别层次结构。这意味着它们对应的分类器也许不应该以一种完全独立于其他分类器归纳的方式进行归纳。\n\
  \n––––––––\n\n![image](img/scene_break.png)\n\n### 你学了什么？\n为了确保你理解了这一主题，请尝试回答以下问题。如果你有困难，请回到前文中对应的部分。\n\
  \n* 在文本分类领域，示例通常是如何描述的？为什么属性向量如此长？\n* 本节中指的“分级类别标签”是什么意思？\n* 是什么导致文本分类器的归纳非常昂贵？\n\
  * 讨论多标签示例问题。\n\n## 8.7 总结与历史注释\n\n![image](img/chapter_title_corner_decoration_left.png)\
