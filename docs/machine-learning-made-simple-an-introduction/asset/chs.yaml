  \n### 实际局限性\n\n这里有一个小免责声明。在多分类领域中使用线性分类器的方法仅在类别数量适中时（例如 3–5 类）才是可靠的。在类别很多的领域，“派生”训练集\
  \ `Ti` 将是不平衡的，因为大多数示例将具有 `c.x/ 0`，而只有少数具有 `c.x/ 1`。正如我们在第 10.2 节将学到的，除非采取了适当措施，否则不平衡的训练集在噪声领域往往会导致困难。\n\
