  \n图 8.7 在井字游戏中，交叉符号（或圆圈）在一行、一列或一条对角线上排列\n\n8.8 练习与思维实验 171\n\n### 计算机作业\n\n1. 在美国国立标准技术研究院\
  \ (NIST) 的网站上可以找到用于机器学习实验的一些真实数据集。找到该网站，然后对其中一些领域进行实验。\n\n2. 访问网上找到一个关于美国 50 个州人口统计的网站。确定一个输出变量，如果其值高于美国平均水平，则被视为正，否则为负。这样每个州就构成一个示例。根据网站提供的信息，识别描述示例的属性。从由此获得的数据中，推导出一个分类器来预测输出变量的值。\n\
  \n第 9 章\n\n# 投票组合的推导\n\n处理困难问题的一种流行方法是组织头脑风暴会议，让不同领域的专家分享他们的知识，提供多样化的观点，这些观点相互补充，以至于可能激发创新的解决方案。机器学习中也可以进行类似的操作。通过创建一个各不相同的分类器组。\n\
  \n本章将介绍推导此类组合的机制。在这些基础的基础上，我们将进入更复杂的算法，包括集成（stacking）。\n\n## Bagging\n\nBagging\
  \ 的原理总结在表 9.1 中。其思想是取原始集合 `T`，并从中创建若干个子集 `T1...Tn`，每个子集的大小相同。一旦创建了子集 `Ti`，机器学习算法就会从每个子集单独推导出一个分类器\
  \ `Ci`。为此，可以使用之前章节中的任何推导技术。然而，bagging 的基准版本假设始终使用相同的技术（例如，使用相同用户设置参数推导决策树）。\n\n\
  ### 底层原理\n\n假设每个参与的分类器代表学习任务的不同方面，预计分类器组（有时称为“投票组合”）的表现将优于任何个体。\n\n![image](img/scene_break.png)\n\
  \n## 9.1 Bagging\n\n表 9.1 Bagging 算法 (173)\n\n| | |\n| :--- | :--- |\n| ![image](img/chapter_title_left.png)\
  \ | ![image](img/chapter_title_right.png) |\n| ![image](img/chapter_title_above.png)\
  \ | ![image](img/chapter_title_below.png) |\n| **输入:** 训练集 `T`， | |\n| 1. 使用带回回的随机采样，从\
  \ `T` 创建若干个子集 `T1...Tn`，每个子集的大小相同。 | ![image](img/image59.png) |\n| 2. 从每个 `Ti`\
  \ 中推导 `Ci`。 | |\n| 3. 当给出一个示例时，将其并行提交给所有的 `Ci` 并让每个分类器提供其意见。 | |\n| 4. “主分类器”决定哪个类别收到的票数最多。\
  \ | ![image](img/image73.png) |\n\n### 自助法 (Bootstrapping)\n\n现在让我们解释 `Ti` 的训练示例是如何选择的。每个示例都有相同的被选中概率。一旦它被包含在\
  \ `Ti` 中，它就会“返回”到 `T`，这意味着它参与 `Ti` 示例选择的概率与其他任何示例相同。对于由 `N` 个示例组成的训练集 `T`，选择重复 `n`\
  \ 次，这一过程被称为自助（bootstrapping）。\n\n一个示例可能在 `Ti` 中出现多次，反之，某些示例将不在 `Ti` 中。这意味着每个 `Ti`\
  \ 包含 `N` 个示例（带有重复），但这些子集都是不同的。\n\n### 为什么有效\n\n图 9.1 解释了投票如何帮助降低错误率。考虑了三个分类器。如果错误很少见，那么可能每个分类器在不同的示例上发生错误。在这种情况下，每个示例最多被误分类一次，另外两个类别标签是正确的。个体的偶尔错误因此会被其他分类器“投票掉”（从而被纠正）。\n\
  \n当然，情况很少会如此便利。如果一个示例被三个分类器中的两个错误分类，那么投票结果将是错误的类别。然而，我们可以规定，如果增加分类器的数量，这种不利的情况可能会得到改善。\n\
  \n![image](img/image309.png)\n\n\n\n\n\n![image](img/image678.png) 图 9.1 要求三个分类器对相同的\
  \ 17 个示例进行分类。通过这种方式，每个分类器在三个示例上发生了错误——每个分类器的错误示例都不同。读者可以看到，可以通过投票消除这些错误。\n\n![image](img/image409.png)...\
  \ 一个分类正确的示例\n\n![image](img/image571.png)... 一个分类错误的示例\n\n得出的最重要的教训是，如果每个分类器倾向于在不同的示例上出错，袋装法（bagging）的效果就会很好。\n\
  \n### 观察\n实践经验表明，如果每个单独分类器的错误率较低，袋装法就能取得良好的结果。那么，当分类器的数量足够大，个人的错误很有可能被其他个体纠正，类似于图\
  \ 9.1 所示。\n\n然而，当单个分类器的错误率较高时，情况并不一定如此。在一定范围内，如果真的有大量的分类器，这些错误仍然会被纠正，因为根据大数定律，底层识别问题的每个方面都可能被代表。唯一需要批评的地方是，可能需要过多的分类器。\n\
  \n从概念上说，这种方法涉及过多的随机性。图 9.1 让我们相信如果分类器不是相互独立地引导，而是以一种可能增加它们相互补充能力的方式引导，可能会达到的效果。这种机制将是后续章节的主题。\n\
