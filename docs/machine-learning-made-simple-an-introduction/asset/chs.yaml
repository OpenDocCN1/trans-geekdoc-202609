  - 总结自组织特征图的算法。\n\n# 14.7 为什么需要特征图？\n\n现在让我们转向自组织特征图的一些实际益处。\n\n### 降维\n上一节介绍的技术本质上是将原始属性向量的\
  \ N 维空间映射到神经元矩阵的二维空间：每个示例都有其胜出神经元，胜者可以通过在矩阵中的两个坐标来描述。这些坐标可以被视为原始示例的新描述。\n\n### 创建高级特征\n\
  在属性数量极高的应用中，减少属性数量至关重要，特别是当这些属性大部分无关或冗余时。例如，在计算机视觉领域可能会出现，每幅图像（即一个示例）都可以由数十万个像素描述。\n\
  \n学习了第 7 章后，读者理解直接将例如感知机学习应用于极长长度的属性向量是不可能成功的：在此类领域，在训练集上表现良好的分类器在测试数据上往往会失败得非常惨。。这种失败的数学解释是，无数属性使得问题的\
  \ VC 维度如此高，以至于除非训练集大得不现实，否则是不可学习的。因此，高级机器学习应用程序寻求通过属性选择或（与本文更相关的）通过映射多维问题到较小空间来降低维度。这是通过创建原始特征函数的新特征来实现的。\n\
  \n\n\n\n\n## 因此可以创建哪些新特征\n\n人们可能会将这个想法进一步。这里有一个简单的建议，仅供灵感。假设训练样本由 `100` 个属性描述，并假设我们有理由怀疑某些属性是相互依赖的，而许多其他属性是`无关的`。\n\
  \n在这样的领域中，维度可能是不必要的高，任何降低维度的尝试都是欢迎的。一种方法是提取（例如）五个不同的属性子集，然后重新描述训练样本五次，每次使用不同的属性集。之后，这些新获得的训练集中的每一个都经过\
  \ `SOFM` 处理，然后它将每个多维空间映射到两个维度。由于这种操作执行了五次，我们得到了 `5 x 2 D 10` 个新属性。\n\n### 可视化\n\n\
  人类大脑在可视化二维或三维数据方面没有问题，并能对具体示例的相似性（或相互距离）、示例的分布或它们倾向于形成的群体形成意见。然而，当属性超过三个时，这就变得不可能了。这正是自组织特征图可以发挥用场的时候。通过将每个示例映射到二维矩阵上，我们可能能够可视化数据中固有的某些关系。例如，相似的属性向量可能会映射到同一个神经元，或者至少映射到物理上相互靠近的神经元。对于普通数据分布也可以做出类似的观察。从这个意义上说，特征图可以被视为一种有用的可视化工具。\n\
  \n### 初始化 k-Means\n\n神经矩阵中的每个权重向量都可以被视为代码向量。`SOFM` 的机制使得找到这些向量的合理值成为可能——这些值随后可以用于初始化如\
  \ `k-means` 等聚类分析方法。这是否是一种实用的方法是另一个问题，因为 `SOFM` 是一种计算代价很大的技术。\n\n### 关于“深度学习”的简要提及\n\
  \n我们还应该指出，所谓的深度学习使用了从非常长的属性向量中自动创建高级特征的方法。本质上，深度学习是一种神经网络技术，它将神经元组织在许多层中，比我们在 `Chap.\
  \ 5` 中多层感知器背景下看到的层多得多。从这个意义上说，这些网络是“深”的，这赋予了该范式的名称。\n\n这些网络的顶层通过监督学习技术进行训练，例如读者已经知道的`误差反向传播`。相比之下，底层任务是创建一组合理的特征。可以想象自组织特征图可以用于此目的；在现实中，通常更倾向于更先进的技术，但它们的详细处理超出了本入门教材的范范围。\n\
  \n然而，必须保持谨慎。一个具体的范式流行并不意味着它是一个解决所有机器学习问题的万灵药。远非如此。如果特征的数量是可控的，如果训练集的大小是有限，那么经典方法的效果和深度学习一样好，甚至更好。⁵\n\
