  \n# 第 4 章：类间边界：线性与多项式分类器\n\n用 n 维实例空间中的点来表示训练示例时，我们可能会发现正示例倾向于聚集在与负示例占据的不同的区域。这一观察激发了另一种分类方法。与其早期范式使用的概率和相似性，我们不如尝试识别划分两个类的决策面。一种非常简单的方法是使用线性函数。更灵活的是高阶多项式，它们能够定义复杂的类间边界。然而，必须谨慎处理这些。\n\
  \n本章介绍了从布尔属性示例推导线性分类器的两种简单机制，然后讨论了如何将其应用于更通用的领域，例如具有数值属性和多个类别的领域。整个思想随后扩展到多项式分类器。\n\
  \n## 4.1 核心\n\n首先，让我们限制在属性为真或假的布尔领域。为了让这些属性参与代数运算，我们将用整数表示它们：真为 1，假为 0。\n\n### 线性分类器\
  \ 在图 4.1 中，一个示例标记为正类，其余三个标记为负类。在特定情况下，这两个类可以通过以下方程定义的线性函数进行分离：\n\n```\n-1.2 + 0.5x1\
  \ + x2 = 0 (4.1)\n```\n\n在左侧的表达式中，`x1` 和 `x2` 代表属性。如果我们用给定示例的具体值代入 `x1` 和 `x2`，表达式\
  \ `-1.2+0.5x1+x2` 将变为正或负。这个符号随后决定了示例的类别。右侧的表格显示了左侧的四个示例是如何被分类的。\n\n\n\n\n\n![image](img/image446.png)方程\
  \ (4.1) 并不是唯一能够完成任务的方程。其他表达式，例如 1:5  x1  x2，将以完全相同的方式对这四个示例进行标记。事实上，通过以下通用形式的无限多个不同分类器也可以实现同样的分类：\n\
  \n`w0 C w1x1 C w2x2 D 0`\n\n这可以很容易推广到具有 `n` 个属性的领域：\n\n`w0 C w1x1 C ::: C wnxn D\
  \ 0` (4.2)\n\n![image](img/image546.png)![image](img/image112.png)如果 `n` = 2，等式\
  \ (4.2) 定义了一条直线；如果 `n` = 3，则是一个平面；如果 `n \\> 3`，则是一个超平面。顺便说一下，如果我们人为地引入一个“零级”属性 `x0`，其值始终固定为\
  \ `x0 = 1`，则该方程可以重写为如下更紧凑的形式：\n\n![image](img/image434.png)n\n\n`wixi D 0` (4.3)\n\
  \n### 一些实际问题\n在编写实现该分类器的计算机程序时，工程师不能忘记决定如何标记恰好位于超平面上的稀有示例——这种情况发生在表达式等于 0 的时候。通常做法是随机选择一个类别，或者倾向于选择在训练集中代表性更多的那个类。\n\
  \n此外，我们不能忘记，如果两个类别不是线性可分的，任何线性分类器都无法分离正示例和负示例。因此，如果我们将图 4.1 中 `x D .x1; x2/ D .0;\
  \ 0/` 的类别标签从负改为正，\n\n将没有任何一条直线能成功。让我们把对该问题的进一步讨论推到第 4.5 节。目前，我们只考虑类别是线性可分的领域。\n\n\
  ### 参数\n分类器的行为由系数 `wi` 决定。这些系数通常被称为权重。机器学习的任务就是找到它们的适当值。\n\n并不是所有的权重都起着相同的作用。从几何角度上说，系数\
  \ `w1;::: wn` 定义了超平面相对于坐标系的角度；而最后一个系数 `w0` 被称为偏置（bias），决定了偏移，即超平面到坐标系原点的距离。\n\n\
  ![image](img/image112.png)偏置与阈值\n在图 4.1 所示的情况下，偏置为 `w0`\n\n![image](img/image602.png)![image](img/image112.png)1:2.\
  \ 较高的值会将分类器“移动”到远离原点 `[0; 0]`，而 `w0 0` 则会让分类器通过原点。如果我们把等式 (4.2) 重写如下所示，我们对偏置在分类器行为中所起作用的直观理解将会提高：\n\
  \n`w1x1 C ::: wnxn D 0` (4.4)\n\n![image](img/image569.png)右侧项 `0 - w0` 是示例要被视为正例时加权和必须超过的阈值。注意，该阈值等于负偏置。\n\
  \n![image](img/image112.png)![image](img/image112.png)### 简单逻辑函数\n让我们通过（某种极端的）要求即所有属性应具有相同的权重\
  \ `wi = 1` 来简化我们的考虑。即使在这一约束下，仔细选择阈值也可以实现一些实用的函数。例如，读者可以很容易验证，以下分类器当且仅当每个属性都具有 `xi\
  \ = 1` 时返回正例类，这种情况被称为逻辑“与”（logical AND）关系。\n\n`x1 C ::: xn D n - 0` (4.5)\n\n相比之下，下一个分类器在至少有一个属性为\
  \ `xi = 1` 时返回正例类，这种情况被称为逻辑“或”（logical OR）关系。\n\n`x1 C ::: xn D 0` (4.6)\n\n![image](img/image112.png)最后，下面的分类器在至少有\
  \ `k` 个属性（总共 `n` 个中）为 `xi = 1` 时返回正例类。这代表了所谓的 k-of-n 函数，其中 AND 和 OR 是其特例：AND 是 `n-of-n`，而\
  \ OR 是 `1-of-n`。\n\n`x1 C ::: xn D k - 0` (4.7)\n\n### 权重\n现在我们已经理解了偏置的影响，让我们放弃所有权重都相等的限制，看看它们具体值的后果。考虑由以下函数定义的线性分类器：\n\
  \n`2 + 3x1 - 2x2 + x4 - 5x6 D 0` (4.8)\n\n![image](img/image099.png)左侧表达式中首先注意到的是缺少属性\
  \ `x3` 和 `x5`。它们由于其零权重 `w3 = w5 = 0` 而变得无关紧要。\n\n![image](img/image112.png)![image](img/image112.png)![image](img/image112.png)正如权重的影响不仅取决于其绝对值，还取决于其符号：如果\
  \ `wi > 0`，`xi = 1` 会增加正例的可能性；如果 `wi < 0`，`xi = 1` 则会增加负例的可能性。在方程 (4.8) 定义的情况下，`w1`\
  \ 的权重比其他属性更支持正例。最后，`w4` 的小值使得 `x4` 几乎无关。作为另一个例子，考虑由以下函数定义的分类器：\n\n`2x1 + x2 + x3\
  \ = 1.5` (4.9)\n\n![image](img/image112.png)![image](img/image0.png)这里 `1.5` 范围被\
  \ `x1` 的单独存在超过，要么被 `x2` 和 `x3` 的共同贡献超过。\n\n### 低计算成本\n注意这种方法的计算成本较低。虽然 1-NN 分类器需要评估许多距离并搜索最小的一个，而线性分类器只需要确定一个简单表达式的符号。\n\
  \n\n\n\n\n如果 $\\sum_{i=0}^{n} w_i x_i > 0$，则分类器“假设”该样本为正例，否则 $\\sum_{i=0}^{n} w_i\
  \ x_i \\le 0$。图 4.2 提醒我们，只有当支持该类的累积证据超过 0 时，分类器才会将 $x$ 标记为正类。\n\n最后，我们假设 $c(x) =\
  \ 1$ 的样本与 $c(x) = 0$ 的样本线性可分。这意味着存在一个线性分类器可以正确标记所有训练样本，即 $h(x) = c(x)$。机器学习的任务就是找到权重\
  \ $w_i$ 以实现这一点。\n\n## 从错误中学习\n这是线性分类器归纳最常用方法的本质。假设我们已经有一个分类器的中间版本（即使是不完美的）。当给呈现一个训练样本\
  \ $x$ 时，分类器返回其标签 $h(x)$。如果该标签与真实类别不同，即 $h(x) \\neq c(x)$，那么那是因为权重并不完美；因此，必须以可能纠正这一错误的方式对它们进行修改。\n\
  \n以下是修改权重的方法。假设真实类别为 $c(x) = 1$。\n\n在这种情况下，$h(x) = 0$ 只有在 $\\sum_{i=0}^{n} w_i x_i\
  \ < 0$ 时才会发生，这意味着权重太小了。如果我们增加权重，那么和 $\\sum_{i=0}^{n} w_i x_i$ 可能会超过 0，使得返回的标签变为正，从而从而正确。注意，只需增加\
  \ $x_i = 1$ 的属性权重足够了；当 $x_i = 0$ 时，$w_i$ 的值并不重要，因为任何数乘以零仍然为零：$0 \\cdot w_i = 0$\n\
  \n同样，如果 $c(x) = 0$ 且 $h(x) = 1$，则应该减少所有 $x_i = 1$ 属性的权重，以便使和有降至零以下的机会，$\\sum_{i=0}^{n}\
  \ w_i x_i < 0$。\n\n## 权重调整公式\n总之，训练样本 $x$ 的呈现可能导致三种不同的情况。基于“从错误中学习”的技术根据下表对此做出响应：\n\
  \n| 情况 | 操作 |\n| --- | --- |\n| $c(x) = 1$ 且 $h(x) = 0$ | 增加每个 $x_i = 1$ 属性的 $w_i$\
  \ |\n| $c(x) = 0$ 且 $h(x) = 1$ | 减少每个 $x_i = 1$ 属性的 $w_i$ |\n| $c(x) = h(x)$ | 不执行\
  \ |\n\n有趣的是，所有这些操作都是通过一个公式完成的：\n\n$w_i = w_i + \\alpha \\cdot (c(x) - h(x)) \\cdot\
  \ x_i$ (4.10)\n\n让我们来看这个权重调整公式的基本方面。\n\n1. **正确的操作**。如果 $c(x) = h(x)$，括号中的项为 $(c(x)\
  \ - h(x)) = 0$，使得 $w_i$ 保持不变。如果 $c(x) = 1$ 且 $h(x) = 0$，括号中的项为 $1$，因此权重增加。如果 $c(x)\
  \ = 0$ 且 $h(x) = 1$，括号中的项为负值，权重随之减少。\n2. **仅影响相关权重**。如果 $x_i = 0$，要加到第 $i$ 个权重上的项\
  \ $\\alpha \\cdot (c(x) - h(x)) = 0$。这意味着该公式仅在 $x_i = 1$ 时才会影响 $w_i$。\n3. **变化幅度**。这由学习率\
  \ $\\alpha$ 控制，其用户设置的值从区间 $(0; 1]$ 中选择。\n\n注意，权重的修改是加性的，意味着一个项被加到权重的之前值上。在第 4.3\
  \ 节中，我们将讨论另一种可能性：乘法公式。\n\n## 感知机学习算法\n方程 (4.10) 成了感知机学习算法的核心。过程由表 4.1 中的伪代码总结。原理很简单。一旦权重被初始化为较小的随机值，就会一个接一个呈现训练样本。在每个样本之后，分类器的每个权重都会接受\
  \ (4.10) 的处理。最后一个样本意味着一个训练轮（epoch）的完成。除非分类器现在标记了整个训练集，否则学习器将返回第一个样本，从而开始第二个，依此类推。通常，需要几轮才能达到目标。\n\
  \n### 表 4.1 感知机学习算法\n假设：两个类别 $c(x) = 1$ 和 $c(x) = 0$ 是线性可分的。\n\n1. 初始化所有权重 $w_i$\
  \ 为较小的随机数。选择合适的学习率 $\\alpha \\in (0; 1]$。\n2. 对于每个训练样本 $x = (x_1...x_n)$，其类别为 $c(x)$：\n\
  \    1. 如果 $\\sum_{i=1}^{n} w_i x_i > 0$，令 $h(x) = 1$，否则令 $h(x) = 0$。\n    2. 使用公式\
  \ $w_i = w_i + \\alpha \\cdot (c(x) - h(x)) \\cdot x_i$ 更新每个权重。\n    3. 如果对于训练样本都有\
  \ $c(x) = h(x)$则停止；否则返回第 2 步。\n\n### 数值示例\n表 4.2 展示了在一个玩具领域中三个训练样本 $e_1, e_2, e_3$\
  \ 的处理过程。令学习率 $\\alpha = 0.5$，随机生成的初始权重为 $w_0 = 0.1; w_1 = 0.3, w_2 = 0.4$。任务：感知机算法使用以下训练集学习如何区分负例\
  \ $e_1$ 和 $e_3$ 以及正例 $e_2$。\n\n| 样本 | $x_1$ | $x_2$ | $c(x)$ |\n| --- | --- | ---\
  \ | --- |\n| $e_1$ | 1 | 0 | 0 |\n| $e_2$ | 1 | 1 | 1 |\n| $e_3$ | 0 | 0 | 0 |\n\
  \n分类器对 $x$ 类的假设是 $h(x) = 1$，如果 $\\sum_{i=1}^{n} w_i x_i > 0$，否则 $h(x) = 0$。在每个样本之后，所有权重都接受\
  \ $w_i = w_i + 0.5 \\cdot (c(x) - h(x)) \\cdot x_i$ 处理。下表逐步显示了学习过程中权重发生的变化。\n\n\
  | | $x_1$ | $x_2$ | $w_0$ | $w_1$ | $w_2$ | $h(x)$ | $c(x)$ | $c(x)-h(x)$ |\n| ---\
  \ | --- | --- | --- | --- | --- | --- | --- | --- |\n| 随机分类器 | | | 0.1 | 0.3 | 0.4\
  \ | | | |\n| 样本 $e_1$ 新分类器 | 1 | 0 | -0.4 | -0.2 | 0.4 | 1 | 0 | -1 |\n| 样本 $e_2$\
  \ 新分类器 | 1 | 1 | 0.1 | 0.3 | 0.9 | 0 | 1 | 1 |\n| 样本 $e_3$ 最终分类器 | 0 | 0 | -0.4\
  \ | 0.3 | 0.9 | 1 | 0 | -1 |\n\n分类器的最终版本 $-0.4 + 0.3x_1 + 0.9x_2 = 0$ 不再误分类任何训练样本。因此，训练在一个轮内完成。对于\
  \ $h(e_1) = 1$ 且 $c(e_1) = 0$，这种情况只发生在 $w_0$ 和 $w_1$ 上，因为 $x_2 = 0$。响应 $e_2$，分类器新版本的所有权重都增加了，因为\
  \ $h(e_2) = 0$ 且 $c(e_2) = 1$，且所有属性的 $x_i = 1$。而在 $e_3$ 后，$h(e_3) = 1$ 且 $c(e_3)\
  \ = 0$ 导致了 $w_0$ 的减少，但不是其他权重，因为 $x_1, x_2 = 0$。\n\n\n\n\n\n第一个是一组（随机）初始权重。不同的初始化可能会导致不同的训练轮数（epochs）数量。大多数情况下，分类器的初始版本几乎是毫无用处的，在过程收敛到某些有用结果之前，需要大量的训练。然而，有时第一个版本可能相当不错，只需一个\
  \ epoch 就能解决问题。在极端情况下，尽管可能性微乎其微，存在这种可能：随机数生成器创建一个能够无错误地标记所有训练样本的分类器，因此不需要任何训练。\n\
  \n![image](img/image639.png)\n\n另一个因素是属性向量的长度。根据经验法则，必要的 epoch 数量往往随着属性数量呈线性增长（假设使用相同的学习率\
  \ `1`）。例如，在具有 `3 n` 个属性的领域中，所需的 epoch 数量可能是具有 `n` 个属性的领域所需 epoch 数量的三倍。\n\n![image](img/image384.png)\n\
  \n### 学习率\n\n学习率 `1` 发挥着至关重要的作用。回到表 4.2 中的示例，读者会注意到权重的快速变化。因此，`w0` 在 `e1` 之后从 `0:1`\
  \ “跳”到 `0:4`， 然后在 `e2` 之后回到 `0.1`，接着在 `e3` 之后回到 `0:4`。`w1` 和 `w2` 也经历了类似的变化。图 4.3\
  \ 可视化了这一现象。读者可以很容易验证这四条线代表分类器的四个连续版本。注意例如，从 `classifier 1` 到 `classifier 2`，再从 `classifier\
  \ 2` 到 `classifier 3` 的变化是多么剧。\n\n![image](img/image511.png)![image](img/image389.png)\
  \ 图 4.3 表 4.2 中的四个分类器。由初始权重定义的分类器用 `1` 表示；数字 `2` 和 `3` 代表两个中间阶段；`4` 是最终解决方案。箭头表示正样本的半空间\n\
  \n`x1`\n\n![image](img/image112.png)![image](img/image112.png)![image](img/image112.png)\
  \ 这种显著的敏感性是由高学习率 `1 0:5` 解释的。较小的值如 `1 0:1` 会减缓变化，从而“平滑”学习过程。但如果我们过头，例如选择 `1 0:001`，训练过程将变得极其缓慢，在所有训练样本被正确分类之前，必须经过大量的\
  \ epoch。\n\n### 如果解存在，它就会被找到\n\n无论初始权重如何、属性数量有多少、学习率是多少，有一点总是有保证的。如果正负类是线性可分的，感知机学习算法保证在有限步数内找到一个类别分离超平面。\n\
  \n––––––––\n\n![image](img/scene_break.png) \n\n### 你学到了什么？\n\n为了确保你理解了这个主题，请尝试回答以下问题。如果你有困难，请返回上文相应的章节。\n\
  \n• 在什么情况下，感知机学习保证能找到一个完美标记所有训练样本的分类器？\n\n![image](img/image112.png)\n\n• 算法在何时减少分类器的权重，何时增加权重，又何时保持不变？为什么它只在对应属性的值为\
  \ `xi \\ 1` 时才修改 `wi`？\n\n• 什么情况会影响算法收敛到解所需的 epoch 数量？\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \  ||  || ![image](img/chapter_title_corner_decoration_right.png)  |\n| --- | ---\
  \ | --- |\n\n![image](img/chapter_title_above.png) \n\n# 4.3 乘法规则：WINNOW\n\n![image](img/chapter_title_below.png)\
  \ \n\n感知机学习通过应用加法规则来响应分类器的错误，即给权重加上正项或负项。一个显而易见的替代方案是乘法规则，权重通过相乘而不是相加。这种方法已被 WINNOW\
  \ 采用，这是一种由表 4.3 中的伪代码总结的算法。\n\n![image](img/image341.png)![image](img/image112.png)\n\
  \n### 原理与公式\n\n通用场景与上一节相同。给出一个训练样本 `x`，分类器返回关于该样本标签的假设 `h.x/`。学习者将此假设与已知标签 `c.x/`\
  \ 进行比较。如果两者不同，`c.x/ \\ h.x/`，则属性 `xi \\ 1` 的权重将按如下方式修改（其中 `˛ > 1` 是用户设置的参数）：\n\n\
  | 情况 | 操作 |\n| --- | --- |\n| `c.x/ = 1` 此时 `h.x/ = 0` | `wi = ˛wi` |\n| `c.x/ =\
  \ 0` 此时 `h.x/ = 1` | `wi = wi\\=˛` |\n| `c.x/ = h.x/` | 不操作 |\n\n表 4.3 WINNOW 算法\n\
  ![image](img/image731.png) 假设：两个类 `c.x/ = 1` 和 `c.x/ = 0` 是线性可分的。\n\n![image](img/image473.png)\
  \ 1. 将分类器的权重初始化为 `1`。\n2. 设置阈值为 `0`（`n` 为属性数量）并选择一个合适的 `˛ > 1` 值（通常为 `)。\n3. 提供一个训练样本\
  \ `x`。分类器返回 `h.x/`。\n4. 如果 `c.x/ \\ h.x/`，更新每个属性 `xi \\ 1` 的权重：：如果 `c.x/ = 1` 且\
  \ `h.x/ = 0`，则 `wi = ˛wi`；如果 `c.x/ = 0` 且 `h.x/ = 1`，则 `wi = wi\\=˛`。\n5. 如果所有训练样本均\
  \ `c.x/ = h.x/`，停止；否则返回第 3 步。\n\n––––––––\n\n![image](img/scene_break.png)\n\n鼓励读者通过相同的公式验证所有操作：\n\
  ```\nwi = ˛wi (if c.x/ = 1 and h.x/ = 0)\nwi = wi\\=˛ (if c.x/ = 0 and h.x/ = 1)\n\
  ```\n\n4.4 WINNOW 行为说明\n![image](img/image76.png)\n\n### 数值示例\n\n表 4.4 使用简单的玩具领域说明了原理。训练集包含三个二进制属性。在感知机学习中，权重初始化为随机值。但在\
  \ WINNOW 的情况下，它们都被设置为 `1`。对于阈值，使用了 `0 < n`，略小于属性数量。对于表 4.4 中的玩具领域，这意味着 `0 < 3`，因为\
  \ WINNOW 显然不知道某个属性是无关的。\n\n当给出前四个样本时，分类器的初始版本正确标记了它们。第一个错误出现在 `e5`：对于这个正样本，分类器错误地返回了负标签。因此，学习者增加了\
  \ `xi \\ 1` 属性权重（即 `w2` 和 `w3`）。该分类器随后正确分类了剩余样本 `e6` 到 `e8`。在第二个 epoch 中，算法在 `e2`\
  \ 上发生错误，产生了假阳性。响应这一错误，算法减少了 `w1` 和 `w2`（但没有 `w3`，因为 `x3 \\ 0`）。在最后一次权重修改后，分类器正确标记了整个训练集。²\
  \ 与感知机学习的情况类似，我们本可以考虑第 0 个属性 `x0`，其初始权重为 `w0 = 1`。\n\n表 4.4 行为说明\n![image](img/image251.png)\
  \ 任务。使用左侧（下方）表格中的训练样本导出线性分类器。让 `˛ = 2`，并让 `0 < 2.9`。\n\n![image](img/image140.png)\n\
  \n注意训练在这里通过两个学习步骤完成：展示 `e5`（假阴性）和 `e2`（假阳性）。在这些两次权重修改后，生成的分类器正确分类了所有训练样本。\n\n\n\n\
  \n\n![image](img/image594.png)\n\n注意，无关属性 `x1` 的权重现在小于相关属性的权重。事实上，通过大幅减小无关属性的权重来对其进行惩罚，从而将其“剔除”，是该技术的主要优势之一。\n\
  \n![image](img/image112.png)\n\n### “Alpha” 参数\n\n`α` 参数控制学习器对误差的敏感度，这种方式让人联想起感知机学习中的学习率。主要的区别在于要求\
  \ `α > 1`。这保证了在出现假阴性（false negative）时权重 `wi` 会增加，在出现假阳性（false positive）时权重 `wi`\
  \ 会减小。该参数的具体值并非完全随机的。如果它仅略微超过 1（例如，如果 `α ≽ 1:1`），则权重更新将非常小，导致收敛缓慢。增加 `α` 的值可以加速收敛，但存在过调解的风险。理想值最好通过实验来确定；在\
  \ `α ≽ 2` 时通常可以获得良好的结果。\n\n### 没有负权重？\n\n让我们指出 `WINNOW` 与感知机学习之间的一个根本区别。由于（原始为正的）权重始终乘以\
  \ `α` 或 `1/α`，它们中任何一个都不可能变为零，更不用变成负数了。这意味着，除非采取了适当措施，否则整类线性分类器将被消除：那些系数为负或零的分类器。\n\
  \n![image](img/image182.png) 如果我们用一对“新”属性来表示原始属性的每一个：其中一个复制原始属性的值，另一个具有相反的值，那么缺点就消失了。在原始具有\
  \ `n` 个属性的领域中，属性总数将变为 `2n`，第 `i/th` 个属性的值 `xnCi` 是 `xi` 的相反数。例如，假设一个示例由以下三个属性值描述：\n\
  \n```\nx1 ≽ 1; x2 ≽ 0; x3 ≽ 1\n```\n\n在新表示法中，同一个示例将由六个属性描述：\n\n```\nx1 ≽ 1; x2 ≽\
  \ 0; x3 ≽ 1; x4 ≽ 0; x5 ≽ 1; x6 ≽ 0;\n```\n\n对于这些属性，`WINNOW` 将不得不找到六个权重 `w1:::;\
  \ w6`，或者如果使用了 `w0`，则可能是七个。\n\n![image](img/image112.png) 与感知机的比较\n\n与感知机学习相比，在具有无关属性且其权重被迅速减小到较值的领域中，`WINNOW`\
  \ 似乎收敛更快。然而，`WINNOW` 和感知机学习都无法识别（并消除）冗余属性。在两个属性始终具有相同值 `xi xj` 的情况下，学习过程将使两者都收敛到相同的权重，使得它们看起来同样重要，尽管显然严格只需要其中一个。\n\
  \n––––––––\n\n![image](img/scene_break.png) \n\n### 你学到了什么？\n\n为了确保你理解了这一主题，请尝试回答以下问题。如果你在遇到任何问题，请回到上文中对应的部分。\n\
  \n* `WINNOW` 中的权重更新机制使用什么公式？为什么该公式被称为乘法公式？\n* 将权重乘以或除以 `α > 1` 的缺点是什么？如何弥补这种状况？\n\
  * 总结 `WINNOW` 与感知机学习之间的区别。\n\n# 4.4 具有多于两个类别的领域\n\n超平面只有两个面，可以将正样本与负样本分开——仅此而已；但当涉及到多分类领域时，这个工具似乎无能为力。真的真的如此吗？\n\
  \n![image](img/image12.png)![image](img/image12.png)\n\n### 分类器组\n\n个体无法解决的问题可以通过团队来解决。在这种背景下，有时采用的一种方法如图\
  \ 4.4 所示。“团队”由四个二分类器组成，每个专门负责四个类中的某一个（`C1` 到 `C4`）。理想情况下，来自 `Ci` 的示例的呈现会导致第 `i`\
  \ 个分类器返回 `hi.x/ 1`，而所有其他分类器都返回 `hj.x/ 0`，同样假设每个类都可以与其他类线性分离。\n\n### 修改训练数据\n\n然而，为了表现出这种行为，单个分类器需要经过适当训练。在这里，可以依靠在前章节中描述的算法。唯一的额外“技巧”是工程师需要修改训练数据。\n\
  \n![image](img/image137.png)![image](img/image498.png)![image](img/image498.png)![image](img/image498.png)\
  \ 具有多于两个类别的领域 77 图 4.4 将 4 类问题转换为四个 2 类问题\n\n```\nC1 C2 C3 C4\n```\n![image](img/image016.png)![image](img/image016.png)![image](img/image016.png)![image](img/image286.png)\
  \ 表 4.5 将 4 类训练集 T 转换为 4 个二分类训练集 T1 ::: T4\n![image](img/image131.png)\n\n### 主分类器的需求\n\
  \n训练集 `Ti` 被呈现给学习器，学习器从每个训练集中导出对应类的线性分类器。然而，故事还没有结束。训练示例可能不能很好地表示类别，可能被噪声污染，甚至线性分离的要求可能无法满足。由于这些复杂情况，导出的分类器可能会相互“叠加”，即两个或多个分类器会对同一个示例\
  \ `x` 返回 `hi.x/ 1`，留下 `x 属于多个类` 的错误印象。这就是为什么需要一个“主分类器”，它的任务是从返回的类中选择最可能的一个。\n\n\
  这并不困难。读者会记得，如果 `x` 的属性值的加权和超过零，线性分类器会将 `x` 标记为正：`∑wi xi > 0`。这个`和`\n![image](img/image112.png)（在每个返回\
  \ `hi.x/ 1` 的分类器中通常不同）可以被解释为支持相应类的证据量。然后，主分类器简单地倾向于选择其二分类器交付了最高 `∑wi xi` 的类。\n\n\
