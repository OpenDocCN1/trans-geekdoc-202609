  \n![image](img/image605.png)\n\n2 例如，关于 RBF 网络的章节将这些中心标记为 `µi`。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \  ||  || ![image](img/chapter_title_corner_decoration_right.png)  |\n| --- | ---\
  \ | --- |\n![image](img/chapter_title_above.png)\n\n## 14.2 一种简单算法：k-Means\n\n![image](img/chapter_title_below.png)\n\
  \n检测数据簇最简单的算法可能被称为 k-means（k 均值法）。名称中的“k”表示要求的簇数量——该参数的值由用户提供。\n\n### 算法概述\n\n算法的伪代码在表\
  \ 14.1 中。第一步创建 `k` 个初始簇，使每个示例都位于一个且仅位于一个簇中。之后，计算所有质心的坐标。请注意，初始化问题要稍微复杂一些。我们稍后会回到这个问题。\n\
  \n在下一步中，k-means 每次调查一个示例，计算它到所有质心的距离。然后，最近的质心定义了该示例所属的簇。如果该示例已经在该簇中，则无需任何操作；否则，将该示例从当前（错误的）簇转移到正确的簇。移动后，必须重新计算受影响的两个簇（丢失示例的簇和获得示例的簇）的质心。图\
  \ 14.2 的单属性域通过图形说明了这一过程。在这里，两个示例位于错误的簇中，因此被重新定位。注意在示例重新定位后，垂直线（分隔簇的线）以及质心是如何改变位置的。\n\
  \n### 终止\n\n表 14.1 中描述的算法的优点在于，该过程保证能够达到一种状态，即每个示例都位于最近的簇中，因此从这一刻起，不再需要进一步转移。簇之间不重叠。由于这通常可以在可控的步骤内完成，因此不需要复杂的终止准则。\n\
  \n––––––––\n\n![image](img/scene_break.png)\n\n#### 表 14.1 k-means 类算法\n\n![image](img/image332.png)\n\
  输入：一组无标签的示例，常数 `k`\n\n1. 创建 `k` 个初始簇。对于每个簇，计算其质心坐标 `Ci`，其为所包含示例中属性值的数值平均值。\n2. 选择一个示例\
  \ `x`，并找到它到所有质心的距离。令 `j` 为最近质心的索引。\n3. 如果 `x` 位于第 `j` 个簇中，则什么都不做。否则，将 `x` 从其当前簇移动到第\
  \ `j` 个簇并重新计算质心。\n4. 除非满足停止准则，否则对另一个示例重复最后两个步骤。\n\n![image](img/image332.png)\n\
  停止准则：每个示例都位于最近的簇。让我们考虑一个由单一数值属性描述的几乎平凡域。假设示例最初由垂直线分为三组。以下序列显示了两个示例（用圆标记）如何从一个簇移动到另一个簇。\n\
  \n![image](img/image685.png)![image](img/image209.png)![image](img/image033.png)![image](img/image494.png)![image](img/image636.png)![image](img/image299.png)![image](img/image299.png)![image](img/image299.png)![image](img/image299.png)![image](img/image299.png)![image](img/image299.png)\n\
  错误的初始聚类\n\n![image](img/image685.png)![image](img/image685.png)![image](img/image685.png)![image](img/image685.png)![image](img/image685.png)![image](img/image215.png)\n\
  错误簇中的示例\n\n––––––––\n\n![image](img/scene_break.png)\n\n![image](img/image153.png)![image](img/image685.png)![image](img/image685.png)![image](img/image685.png)![image](img/image685.png)![image](img/image685.png)![image](img/image685.png)\n\
  现在：所有示例都在正确的簇中\n\n第二次转移后，簇就是完美的，计算可以停止。\n\n图 14.2 具有一个属性域的 k-means 过程图\n\n––––––––\n\
  \n![image](img/scene_break.png)\n\n![image](img/image112.png)\n### 数值示例\n\n在表 14.2\
