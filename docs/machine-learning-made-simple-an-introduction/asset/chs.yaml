  -)  2  C\\-0:7/2 e^(\\-)  2  C \\] 3   2n\n```\n![image](img/image12.png)`\n\n###\
  \ 参数值的影响\n\n所得到的 pdf 的实际用处（在贝叶斯公式中的成功）取决于 `a²` 的选择。在图 2.4 中，使用了 `a²` = 1，但不能保证这在任何未来的应用中有效。为了能够正确调整它，我们需要理解它如何影响复合\
  \ pdf 的形状。\n\n检查高斯公式发现，非常小的 `a²` 值会导致 `x` 与 `µi` 之间的差异产生巨大的敏感性；单个钟形函数将非常“窄”，且生成的\
  \ pdf 将由“山谷”分隔的陡峰标记。相反，高 `a²` 的结果将是几乎平坦的 pdf。在两个极端之间寻求折中，如果我们让 `a²` 取于示例之间的距离，效果将会很好。最简单的解决方案是使用\
  \ `a² = µmax - µmin`，其中 `µmax` 和 `µmin` 分别是 `µi` 的最大值最小值。如果你认为这太粗略，可以考虑通过示例的数量进行标准化：`a²\
  \ = (µmax - µmin)/m`。较大的训练集（具有高 `m`）将导致高斯分布缩小。最后，在某些领域中，可能会认为每个钟形函数应该有一个自己的方差，与最近的钟形函数的距离成比例。在这种情况下，我们不再允许通过公式\
  \ (2.15) 设置 `a²` 的值。\n\n![image](img/image018.png)``![image](img/image32.png)`\n\
