  \ | ![image](img/chapter_title_right.png) |\n| --- | --- | --- |\n| | | |\n\n# 13.2\
  \ 分别处理类别：相关性\n\n![image](img/chapter_title_below.png)\n\n现在让我们进入本节的主题，相关性技术。我们将首先解释其原理，然后讨论它的缺点和局限性。\n\
  \n### 相关性原理\n多标签领域最常用的方法是为每个类别归纳一个二分类器：在一个具有 `N` 个类别的领域中，归纳 `N` 个分类器。在分类未来的示例时，将并行使用所有分类器，示例接收所有分类器返回正标签的类别。\n\
  \n![image](img/image102.png)\n\n为了归纳这些分类器，必须对训练数据进行相应修改。如下：对于第 `i` 个类别（`i 1; N`），我们创建一个训练集\
  \ `Ti`，其示例与原始训练集 `T` ，区别在于标记：在 `Ti` 中，如果该示例在 `T` 中的类别列表包含 `Ci`，则类别标记为 `1`；否则，`Ti`\
  \ 中的标记为 `0`。\n\n一旦创建了新的训练集，我们就对每个训练集应用一个负责归纳单个分类器的基学习器。通常做法是对每个 `Ti` 应用相同的基学习器。通常，我们借此使用之前讨论过的机器学习技术，如感知学习、决策树归纳等。\n\
  \n### 学习原理插图\n表 13.1 展示了创建新训练数据的机制。在原始训练集 `T` 中，可以找到五个不同的类别标签：`C1;:::; C5`。相关性技术创建了五个新的训练集\
  \ `T1;:::; T5`，如原始表格下方的五个表格所示。\n\n\n\n\n# 表 13.1 原始多标签训练集被转换为五个新的训练集，每个类一个\n\n![image](img/image255.png)\n\
  \n––––––––\n\n![image](img/scene_break.png) \n\n|  || 类别 |\n| --- | --- |\n| ex1\
  \ || C1, C2 |\n| ex2 || C2 |\n| ex3 || C1, C3, C5 |\n| ex4 || C2, C3 |\n| ex5 ||\
  \ C2, C4 |\n\n![image](img/image431.png)\n![image](img/image716.png)\n![image](img/image727.png)\n\
  ![image](img/image061.png)\n![image](img/image469.png)\n![image](img/image255.png)\n\
  \n## 1. 别别处理每个类别：二分类相关性 (Binary Relevance) 255\n\n因此，在第一个集合 `T1` 中，示例 `ex1` 和 `ex3`\
  \ 被标记为 1，因为这两个示例（且仅限于这两个）在原始的 `T` 中包含标签 `C1`。其余的示例被标记为 0。\n\n基准学习器被分别应用于五个新集中的每一个，从每个\
  \ `Ti` 诱导出相应的分类器 `Ci`。\n\n### 一个容易被忽视的陷阱\n在这样得到的每个训练集中，每个示例都被标记为给定类别的正样本或负样本代表。当并行使用这些诱导出的二分类器时（以对某些\
  \ `x` 进行分类），可能会出现没有分类器返回 1 的情况。这意味着没有为 `x` 识别出任何标签。在编写机器学习软件时，我们不能忘记指示分类器在这种情况下发生该做什么。通常，程序员会从以下两个替代方案中选择一个：(1)\
  \ 返回一个默认类，也许是 `T` 中出现频率最高的类，或 (2) 拒绝该示例，因为它太模糊而无法分类。\n\n### 讨论\n需要记住的是，二分类相关性的核心思想是将多标签问题转换为一组单标签任务，然后由经典机器学习处理这些任务。然而，为了避免失望，工程师需要意识到某些困难，除非妥善处理，否则可能会导致性能不佳。让我们简要讨论这些问题。\n\
  \n### 问题 1：类别不平衡\n一些新的训练集 `Ti` 可能会遭受第 10.2 节中讨论过的类别表示不平衡问题。在表 13.1 中，这种情况出现在集合 `T4`\
  \ 和 `T5` 中。在每一个集合中，五个示例中只有一个（20%）被标记为正样本，而所有其他都被标记为负样本。在这种情况下，我们已经知道，机器学习技术倾向于偏向多数类——在这种情况下，即标记为\
  \ 0 的类。\n\n解决方案并不难找到。两种最直接的方法是多数类下采样或少数类过采样。选择哪一种取决于取决于领域的具体情况。作为经验法则，可以根据训练集的大小来做出决策。在非常大的领域中，多数类下采样更好；但当示例稀缺时，工程师无法负担“浪费”它们的代价，因此倾向于少数类过采样。\n\
  \n### 问题 2：计算成本\n某些多标签领域非常大。因此，文本分类领域的训练集可能包含数十万个示例，每个示例由数万个属性描述，并标记为数千个不同类中的子集。理理，从如此规模的训练集中诱导出数千个决策树将是非常昂贵的，甚至贵到无法接受。我们可以看到，在考虑基准学习器的候选时，我们可能因为计算成本而拒绝其中一些。\n\
  \n另一种可能性是利用第 9.5 节中讨论的提升技术：对于每个类，我们创建训练示例的多个子集，某些可能由不同的属性子集描述。其想法为每个类诱导出一组子分类器然后进行投票。如果（在给定的范式中）学习\
  \ 50% 的示例只需要 5% 的时间，就可以实现大量的节省。\n\n### 问题 3：性能评估\n另一个问题是如何衡量诱导分类器的成功或失败。通常，它们中的每一个都会表现出不同的性能，有些高于平均水平，有些低于平均水平，有些非常糟糕。为了获得整体概念，需要对结果进行某些平均。我们将在第\
  \ 13.7 节回到这个问题。\n\n### 问题 4：忽略了类之间的相互依赖性\n二分类相关性的基准版本将所有类别视作是彼此相互独立的。很多情况下，这种假设是合理的。在其他领域中，类别在某种程度上是相互依赖的，但忽略这一事实不会产生多大伤害。但在某些应用中，如果我们能找到利用类依赖性的方法，诱导出的分类器的整体性能将显著提高。引入此类方法将是接下来三个章节的任务。\n\
  \n––––––––\n\n![image](img/scene_break.png) \n\n 你学到了什么？\n\n为了确保你理解了该主题，请尝试回答以下问题。如有需要，请回到文本相应的位置。\n\
