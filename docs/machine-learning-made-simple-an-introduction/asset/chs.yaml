  \n![image](img/chapter_title_below.png) \n\n与任何其他机器学习技术一样，`k-means` 不仅有优点，也有缺点。为了避免后者的至少一部分，我们需要一种替代方案，一种可能在\
  \ `k-means` 失败的情况下被证明很有用的方法。\n\n## k-Means 的另一个严重局限性\n\n通过最小化示例与其所属簇质心之间的距离，`k-means`\
  \ 本质上保证了它将发现“凸”簇。在大多数情况下，这确实是我们想要的。在贝叶斯分类器和 RBF 网络的背景下，此类簇是有用的，因为它们减少了（有时是非常显著地）所使用的高斯中心数量。\n\
