  \ | --- |\n\n![image](img/chapter_title_above.png) \n\n## 6.3 属性传达了多少信息？\n\n![image](img/chapter_title_below.png)\
  \ \n\n为了创建一个较小的决策树，分治法依赖于一个关键组件：判断单个属性传达了多少关于类别标签的信息的能力。本节介绍了一种计算该量的机制。\n\n## 消息的内容\n\
  \n假设我们知道训练示例被标记为 `pos` 或 `neg`，这两个类的相对频率分别为 `ppos` 和 `pneg`.³ 让我们随机选择一个训练示例。消息“此示例的类别是\
  \ `pos`”传达了多少信息？\n\n![image](img/image112.png)答案取决于 `ppos`。在所有示例均已知为正的极端情况下，`ppos`\
  \ = 1，该消息没有告诉我们任何新东西。读者即使不被告知也知道该示例是正的。如果出现以下情况情况就会改变：\n\n––––––––\n\n![image](img/scene_break.png)\
  \ \n\n![image](img/image605.png)\n\n3 回 `pos` 的相对频率是训练集中标记为 `pos` 的示例占的百分比；这代表了随机抽取的示例为正的概率。\n\
  \n![image](img/image543.png)表 6.3 消息“这个随机抽取的示例是正的”的内容量（以比特计）的一些值。\n\n注意，对于 `ppos`\
  \ = 0，该消息是不可能的\n\n![image](img/image112.png)![image](img/image112.png)两类已知代表比例相等，使得\
  \ `ppos` = 0.5。在这里，这种猜测并不比掷硬币更好，因此该消息提供了一些信息。如果大多数示例已知为负，例如 `ppos` = 0.1，那么读者几乎可以确定该示例是负的。`ppos`\
  \ 越低，消息提供的信息就越多。在量化此类消息的信息时，使用如下\n\n```\nI = -ppos * log2(ppos) - pneg * log2(pneg)\n\
  ```\n（注：提供的文本包含公式的碎片部分，但根据标准的熵理论和上下文，在此重构了该表达式）。\n\n等待，专门查看提供的文本中的熵公式：\n“在量化此类消息的信息时，如下：`I\
  \ = -ppos * log2(ppos) - pneg * log2(pneg)`” （源文本被截断了，但逻辑是一致的）。\n\n让我们严格遵循提供的文本片段：\n\
  在量化此类消息的信息时，如下：\n`I = -ppos * log2(ppos) - pneg * log2(pneg)` （实际上，文本写的是：“如下”后面跟着一个中断/图像）。`ppos`\
  \ = 1 的情况被视为完美的规律；相反，`ppos` = 0 的情况被视为完全缺乏。）\n\n### 熵（平均信息）\n\n令 `Ti` 为 `Ti` 中的示例数量，令\
  \ `T` 为整个训练集中的示例数量。`T` 是总数。随机抽取示例位于 `Ti` 中的概率估计如下：\n\n![image](img/image201.png)![image](img/image112.png)\n\
  ```\nPti = Ti / T\n```\n基于这些知识，公式 (6.2) 将赋予我们相应的熵 `H.Ti/`：\n\n```\nH.Ti/ = ... \n\
  ```\n得到的结果 `H.T; at/` 是系统的熵，在该系统中，对于每个训练示例不仅知道类别标签，还知道 `at` 的值。很容易证明这种差异不会为负；通过考虑\
  \ `at` 只能获得信息，永远不会丢失。但在某些罕见的情况下，`I.T; at/` = 0，这意味着也没有获得任何信息。\n\n## 属性贡献的信息量\n\n\
  `at` 贡献的信息量是考虑 `at` 之前的熵与考虑该属性之后的熵之间的差值：\n\n```\nI.T; at/ = H.T/ - H.T; at/\n```\n\
  将公式 (6.5) 分别应用于每个属性，我们可以找到哪些属性提供了最大的信息量，并作为表 6.2 中算法第一步中“根节点”测试的最佳选择。\n\n\n\n\n\n\
  插图 6.5 展示了如何从表 6.1 的领域中选择选择信息量最大的属性的机制。首先，建立无属性系统的系统熵 `H.T/`。然后，我们观察到，例如，属性 `shape`\
  \ 将训练集划分为三个子集。表 6.4 寻找信息量最大的属性的算法：\n\n![image](img/image731.png)\n\n1. 使用正样本和负样本的百分比\
  \ `ppos` 和 `pneg` 计算训练集 `T` 的熵：\n\n```\nH.T/ D -ppos log2 ppos \\- pneg log2 pneg\n\
  ```\n\n2. 对于每个将 `T` 分为子集 `Ti`（其相对大小为 `Pi`）的属性 `at`，执行以下操作：\n\n    1. 计算每个子集 `Ti`\
  \ 的熵；;\n\n    2. 计算平均熵：`H.T; at/ D †iPi • H.Ti/;;\n\n    3. 计算信息增益：`I.T; at/ D H.T/\
  \ - H.T; at/;;\n\n3. 选择信息增益值最大的属性。\n\n![image](img/image263.png)\n\n––––––––\n\n\
  ![image](img/scene_break.png) \n\n计算它们熵的平均值 `H.T; shape/`，`H.T/` 与 `H.T; shape/`\
  \ 之间的差异即为该属性传递的信息量。对 `crust-size` 和 `filling-size` 重复该步骤并比较结果，我们发现 `shape` 贡献的信息比其他两个属性更多，这就是为什么我们选择\
  \ `shape` 作为根测试节点。\n\n顺便说，这就是图 6.1b 中决策树的获得方法。\n\n––––––––\n\n![image](img/scene_break.png)\
  \ \n\n### 你学到了什么？\n\n为了确保你理解了这一主题，请尝试回答以下问题。如果你有困难，请回到本文之前的对应部分。\n\n• 当我们谈论“信息所传递的信息量”时是指什么意思？这个量是如何确定的？使用了哪些单位？\n\
  \n• 什么是熵？它是如何与训练集中正样本和负样本的频率相关的？\n\n• 我们在评估属性贡献的信息量时，如何使用熵？\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
