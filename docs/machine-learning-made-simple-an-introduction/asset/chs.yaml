  \ D 1` 的情况下，如何决定示例的类别？\n\n## 1. 多项式分类器 79\n\n![image](img/chapter_title_corner_decoration_left.png)\
  \  ||  || ![image](img/chapter_title_corner_decoration_right.png)  |\n| --- | ---\
  \ | --- |\n\n![image](img/chapter_title_above.png) \n\n## 4.5 多项式分类器\n\n![image](img/chapter_title_below.png)\
  \ \n\n现在是放弃正样本必须与负样本线性分离的要求了；因为经常如此，它们并不是可分的。线性可分性不仅会被噪声破坏，其中一个类别所占据区域的形状可能使其无法通过线性决策边界进行分离。因此，在图\
  \ 4.5 所示的训练集中，没有任何线性分类器能够成功分离这两个类，这种 feat 只能通过非线性曲线（如所示的抛物线）来实现。\n\n### 非线性分类器\n\
  \n既然已经了这一点，我们必须询问如何归纳更复杂的非线性分类器。无疑它们存在。例如，数学告诉我们，任何 `n` 维函数都可以用足够高阶的多项式近似到任意精度。因此，让我们看看如何为我们的分类目的使用并归纳这些多项式。\n\
  \n### 二阶多项式\n\n好消息是，多项式的系数可以使用我们用于线性分类器的相同技术来归纳。让我们来解释一下。\n\n为了清晰起见，我们首先将自己限制在只有两个布尔属性\
  \ `x1` 和 `x2` 的简单领域。二阶多项式函数定义如下：\n\n![image](img/image652.png)![image](img/image136.png)w0\
  \ C w1x1 C w2x2 C w3x² C w4x1x2 C w5x² D 0 (4.12)\n\n![image](img/image638.png)左侧的表达式是多个项之和，它们有一个共同点：一个权重\
  \ `wi`，乘以乘积 `x^kx^l`。在第一项中，我们有 `k C l D 0`，因为 `w0x⁰ D w0`；接下来是 `k C l D 1` 的项，具体为\
  \ `w1x¹x⁰ D 1 2`（注：此处原文存在重复和乱码，已按逻辑处理）...（后类略）\n\n\n\n\n![image](img/image104.png)以下是带有乘法器的整个“设备”的结构图。在到达线性分类器之前，每个信号\
  \ `zi` 都会乘以相应的权重 `wi`。\n\n![image](img/image300.png)\n\n––––––––\n\n![image](img/scene_break.png)\
  \ \n\n![image](img/image011.png)图 4.6 借助预处理数据的乘法器，多项式分类器可以被转换为线性分类器。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \  ||  || ![image](img/chapter_title_corner_decoration_right.png)  |\n| --- | ---\
  \ | --- |\n\n![image](img/chapter_title_above.png) \n\n## 4.6 多项式分类器的特定方面\n\n![image](img/chapter_title_below.png)\
  \ \n\n为了成功使用某种机器学习技术，工程师不仅必须理解它的优点，还要理解它的局限性、缺点和陷阱。在多项式分类器的情况下，有几点值得我们关注。让我们简要讨论一下。\n\
  \n![image](img/image647.png)图 4.7 这两类在 `x2` 是线性可分的，但噪声\n\n![image](img/image620.png)导致其中一个负样本被误标记为正样本。右侧的高阶多项式过拟合了数据，忽略了噪声\
  \ `x2` 的可能性。\n\n![image](img/image686.png)\n\n![image](img/image686.png)\n\n![image](img/image003.png)x1\
  \ x1\n\n––––––––\n\n![image](img/scene_break.png) \n\n### 过拟合\n\n多项式分类器往往过拟合带有噪声的训练数据。由于过拟合问题也出现在其他机器学习范式中，我们必须详细讨论它的本质。为了清晰起见，我们将放弃所有属性都应该是布尔的值；相反，我们将依赖于易于可视化的二维连续域。\n\
  \n图 4.7 中的八个训练示例分为两组。在其中一组中，所有示例都是正样本；在另一组中，除了一个以外，所有的都是负样本。这里尝试了两种分类方法。左侧的方法满足于线性分类器，忽略了一个训练示例仍未被正确分类的微小不便。右侧的方法则求助于多项式分类器，试图避免在训练集上产生任何错误。\n\
  \n### 不可避免的权衡\n\n两者中哪一个更好呢？这不是一个简单的问题。一方面，这两类可能是线性可分的，而负样本区域出现一个正样本的唯一原因是类别标签噪声。如果是如此，线性分类器在训练集上犯的单个错误是无关紧要的，而深切入负区域的多项式则会误分类那些发现自己处于曲线错误一侧的示例。另一方面，也存在这种可能，即离群值确实代表了正类别的某些合法的（即使是罕见的）特征。在这种情况下，使用多项式是合理的。但总的来说，假设单个离群值仅仅是噪声，这种假设比“特殊特征”替代方案更有可能是正确的。\n\
  \n一个真实的训练集将包含不是一个，而是相当多、甚至是许多似乎位于实例空间错误部分的示例。而我们的分类器试图建模的类间边界确实可能是弯曲的，尽管其弯曲程度如何无人能知。工程师可能会因为线性分类器太粗糙而将其弃置，转而选择多项式提供的更大灵活性。总体而言，假设单个离群值仅仅是噪声，这种假设比“特殊特征”替代方案更有可能是正确的。\n\
  \n### 过拟合\n\n多项式分类器倾向于过拟合带有噪声的训练数据。由于过拟合问题也出现在其他机器学习范式中，我们必须详细讨论它的本质。为了清晰起见，我们将放弃所有属性都应该是布尔的值；相反，我们将依赖于易于可视化的二维连续域。\n\
