  \n# 第 7 章\n\n## 计算学习理论\n\n正如人们所说，没有比良好的理论更实用的了。事实上，学习性的数学模型帮助我们理解了从数据中归纳出实用分类器需要什么，反之，也解释了为什么机器学习任务的结果往往令人失望。因此，尽管这本教科书不想数学化，但它无法避免地要介绍计算学习理论的基本概念。\n\
  \n该理论的核心是 `PAC learning` 概念，这一范式使得量化学习性成为可能。本章的第一节限制在离散属性领域，推导出一个简单的表达式，捕捉了训练集大小与归纳分类器错误率之间的相互关系。接下来的两个章节简要讨论了该公式的一些后果。对于具有连续属性的领域，引入了所谓的\
  \ `VC-dimension`。\n\n| ![image](img/chapter_title_corner_decoration_left.png)  ||\
  \  || ![image](img/chapter_title_corner_decoration_right.png)  |\n| --- | --- |\
  \ --- |\n\n![image](img/chapter_title_above.png) \n\n## 7.1 PAC 学习\n\n![image](img/chapter_title_below.png)\
  \ \n\n计算学习理论贡献的最有用思想可能是“概率近似学习”，有时缩写为 `PAC learning`。让我们先解释其底层原理，并推导出一个公式，这将提供一些有用的指导。\n\
  \n### 假设与定义 如果我们围绕几个简化假设建立分析，分析将会变得更容易。首先，训练示例（以及所有未来的示例）是完全无噪声的。其次，所有属性都是离散的（没有属性是连续值的）。第三，分类器的形式为属性值的的逻辑表达式；该表达式对于正示例为真，对于负示例为假。最后，存在至少一个表达式可以正确分类所有训练示例。¹\n\
  \n每个逻辑表达式都可以被看作关于分类器应该是什么样的一个假设。所有假设共同构成了一个假设空间，其大小（不同假设的数量）为 `|H|`。在上述假设下，`|H|`\
  \ 是一个有限数。\n\n### 不准确的分类器在训练集上可能仍然成功\n\n可用训练数据很少能穷尽底层类别所有的微妙之处；一个正确标记所有训练示例的分类器在未来可能仍然很糟糕。如果增加更多训练示例，这些错误发生的频率通常会降低，因为这些添加可能反映了数据未能代表的方面。多少个训练示例将给我们公平的成功机会？为了找到答案，我们首先考虑一个错误率实际上超过\
  \ `E` 的分类器。借此，我们确立了 m 个训练示例成功消除所有错误率超过 `E` 的分类器的概率上界。\n\n![image](img/image602.png)\n\
  \n通过此，我们确立了 m 个训练示例成功消除所有错误率超过 `E` 的分类器的概率上界。\n\n![image](img/image374.png)\n\n\
  为了变得有用，最后一个表达式必须经过修改。我们从数学上知道 `1 - E < e^(-E)`，这意味着 `(1 - E)^m < e^(-mE)`。考虑到这一点，我们能够以指数形式表示该上界：\n\
  \n```\nP < |H|.(1 - E)^m (7.1)\n```\n![image](img/image496.png)\n![image](img/image116.png)\n\
  ![image](img/image112.png)\n![image](img/image112.png)\n![image](img/image573.png)\n\
  ![image](img/image421.png)\n![image](img/image164.png)\n![image](img/image573.png)\n\
  ![image](img/image605.png)\n\n¹读者会注意到，所有这些要求都由第一章中的“饼”（pies）领域满足。\n\n### 消除糟糕的分类器\n\
  \n假设大于 `E` 的错误率被认为是不可接受的。性能如此糟糕的分类器从训练集中被归纳出来的（即它分类了所有训练示例）的概率有多大？\n\n![image](img/image605.png)\n\
  \n假设空间由 `H` 组成。让我们考虑一种理论可能性：我们在 m 个示例上评估所有分类器，然后只保留那些从未犯错误的分类器。在这些“幸存者”中，有些令人失望，因为虽然它们在训练集上没有错误，但它们在整个实例空间上的错误率实际上超过了\
  \ `E`。假设有 `k` 个这样的分类器。\n\n![image](img/image164.png)\n\n在没有整个实例空间评估每个分类器的情况下，无法确定\
  \ `k` 的具体值。由于这不可能，我们只能说 `k ≤ H`，这是一个好一点，因为在许多现实情况下 `H` 是已知的，或者至少可以计算。²\n\n让我们重写至少一个\
  \ `k` 个违规分类器在 m 个训练示例上无错误的概率上界。\n\n```\nP < k.(1 - E)^m < H.(1 - E)^m (7.2)\n```\n\
  \n\n\n\n\n# $P < jHj \\cdot e^{(\\-mE)}$ (7.3)\n\n假设我们希望该概率低于用户设置的 $\\iota$：\n\n\
  $jHj \\cdot e^{(\\-mE)} < \\iota$ (7.4)\n\n对等式两取对数并重新排列项，我们得到了在接下来几页中将使用的公式：\n\n\
  ![image](img/image517.png)![image](img/image663.png)![image](img/image474.png)![image](img/image474.png)$m\
  \ > 1 . \\ln jHjC \\ln 1 /$$ (7.5)\n\n## “概率近似正确”学习\n\n我们之所以详细通过了推导的所有细节，主要原因是这样读者就能能更好地理解相关变量的含义和解释，否则这些变量可能会让人稍显困惑。这也是为什么我们在表\
  \ 7.1 中汇总了这些变量以便快速查阅。\n\n![image](img/image608.png)我们现在已经到了可以定义一些重要概念的阶段。错误率低于 $E$\
  \ 的分类器被认为是**近似正确**的；而 $\\iota$ 是从 $m$ 个训练示例（$m$ 为有限数）中导出该近似正确分类器的概率。这就是整个范式的名称：概率近似正确学习，或简称\
  \ PAC 学习。为了本章的需求，如果示例的数量需要\n\n![image](img/image605.png)\n\n满足给定 $(E; \\iota)$ 要求，我们就该类别不是\
  \ PAC 可学习的。回回第一章中的“派饼”领域，假设空间的大小为 $H = 2^{(108)}$。在这些假设中，有 $2^{(96)}$ 个能正确分类整个训练集。\n\
  \n![image](img/image540.png)表 7.1 研究 PAC 可学习性涉及的变量\n\n不等式 (7.5) 规定了如果要以至少 $\\iota$\
  \ 的概率导出一个错误率低于 $E$ 的分类器，需要多少个训练示例 $m$。请注意，该结果不依赖于具体的机器学习技术，仅取决于所给类型分类器所定义的假设空间大小\
  \ $H$。\n\n![image](img/image013.png)需要记住的一点是，$m$ 随 $1/E$ 线性增长。例如，如果我们将错误率限制从 $E\
  \ \\le 0.2$ 强化到 $E \\le 0.1$，那么我们（至少在理论上）需要两倍的训练示例才能获得相同的成功概率 $\\iota$。同时，读者应该注意到\
  \ $m$ 对 $\\iota$ 的变化不敏感，仅随 $1/\\iota$ 对数级增长。\n\n![image](img/image318.png)然而，我们不能忘记，我们的推导类似于某种最坏情况分析。因此，它给出的界限并没有完美主义者所希望的那么紧。例如，不等式\
  \ (7.5) 永远不应该被解释为告诉工程师使用多少个训练示例。相反，它应该被视为一种指南，使得比较不同类型成为可能。我们将在下一节追求这一观点。\n\n––––––\n\
  \n![image](img/scene_break.png)\n\n### 你学了什么？\n\n为了确保你理解了这一主题，请尝试回答以下问题。如果你有困难，请返回上文。\n\
  \n![image](img/421.png)• (7.5) 中使用的 $(E; \\iota)$ 的含义是什么？\n• PAC 学习指的是什么？在什么情况下我们说一个类别不是\
  \ PAC 可学习的？\n• 推导 (7.5)。讨论该结果的意义和优势，以及为什么它应该只被视为最坏情况分析。\n\n## 7.2 示例\n\n### 属性的合取：假设空间\n\
  \n假设所有属性都是布尔值，所有数据都是无噪声，且训练集由 $m$ 个示例。我们假设至少有一个合取能正确标记所有训练示例。这意味着如果第一个属性的值为真且第三个属性的值为假，则该示例被标记为正。不满足这两个条件的示例被标记为负。\n\
  \n```\natt1 = true AND att3 = false\n```\n\n在上述逻辑合取中，每个属性要么为真、要么为假或无关。这为第一个属性提供了三种可能，第二个属性提供了三种可能，依此类推，最后一个第\
  \ $n$ 个属性也提供了三种可能。因此，假设空间的大小为 $|H| = 3^n$。\n\n### 属性的合取：PAC 可学习性\n\n假设将无噪声示例训练集交给某个机器学习程序，该程序能够导出上述形式的分类器³。为了满足第\
  \ 7.1 节开头列出的假设最后一个假设，我们假设其中一个合取分类了所有训练示例。\n\n![image](img/676.png)由于 $\\ln H = \\\
  ln 3^n = n \\ln 3$，我们可以将 (7.5) 重写为以下形式：\n\n![image](img/image517.png)![image](img/image663.png)![image](img/image474.png)![image](img/image474.png)$\\\
  dots$ (7.6)\n\n借此，我们得到了满足 $(E; \\iota)$ 要求所需的训练示例数量的保守下界：以 $\\iota$ 的概率，导出的分类器（在训练集上无错误）在整个实例空间上的错误率将低于\
  \ $E$。注意，该表达式的值随属性数量 $n$ 线性增长。从理论上讲，如果 $n$ 翻倍，那么为了在概率 $\\iota$ 内排除错误率高于预定义 $E$ 的分类器，就需要两倍的训练示例。\n\
  \n### 任意布尔函数：假设空间\n\n我们现在研究一种更广泛的分类器类，即由任何布尔函数定义的分类器，允许使用所有基本逻辑运算符（AND, OR, NOT）以及任何括号组合。与之前一样，我们假设示例由\
  \ $n$ 个布尔属性描述，并且是无噪声的。\n\n这个假设空间的大小是多少？\n\n³例如，可以使用第 1.2 节中爬山搜索的变体来实现此目的。\n\n\n\n\
  \n\n从 `n` 个布尔属性出发，共可以创建出 `2^n` 个不同的示例。这定义了实例空间的大小。对于这 `2^n` 个示例的任意子集，至少存在一个逻辑函数，对于该子集中的所有示例都为真（标记为\
  \ `pos`），对于该子集之外的所有示例都为假（标记为 `neg`）。从分类的角度来看，如果两个逻辑函数对任何示例的分类结果都是相同的，那么它们被认为是等等的；也就是说，如果它们对任何示例的类别的“意见”从不不符。那么，在分类行为上互不相同的逻辑函数的数量必须等于实例空间子集的数量。\n\
  \n已知包含 `X` 个元素的集合有 `2^X` 个子集。由于我们的特定实例空间由 `2^n` 个示例组成，其子集的数量为 `2²n`——这就是我们假设空间的大小：\n\
  \n![image](img/image231.png)jHjD 2 (7.7)\n\n![image](img/image048.png)任何布尔函数：PAC\
  \ 可学习性。由于 `ln H` `ln 2²n` `2^n ln 2`，不等式 (7.5) 变为以下形式：\n\n![image](img/image517.png)![image](img/image663.png)![image](img/image474.png)![image](img/image474.png)m\
  \ > 1.2^n ln 2 C ln 1 / (7.8)\n\n![image](img/image348.png)![image](img/image720.png)![image](img/image604.png)![image](img/image037.png)我们得出结论：如果要满足\
  \ `(E, ı)-requirements`所需的训练示例数量随属性数量 `n` 指数级增长。这种增长对于任何现实的 `n` 值来说都是不可接受的。例如，即使我们只增加一个属性\
  \ `n 1`，`ln H` 的值也会翻倍，因为 `ln H` `2^(nC1) ln 2` 是 `2^n ln 2` 的两倍。如果再增加十个属性 `n 10`，那么\
  \ `ln H` 的值将增加千倍，因为 `ln H` `2^(nC10) ln 2` `2¹⁰ 2^n ln 2` `1024 2^n ln 2`。\n\n这一观察结果足以说服我们，这种通用形式的分类器不是\
  \ PAC 可学习的。\n\n### 警示\n我们必须小心，不要早下结论。正如前面指出的，不等式 (7.5) 的推导——一种类似于最坏情况分析——依赖于相当多的简化假设，这使得得到的边界非常保守。在现实中，归纳一个可靠分类器所需的训练示例数量远低于我们“魔公式”所指示的数量。\n\
  \n对于寻求最合适学习技术的工程师来说，不等式 (7.5) 的主要贡献在于它可以帮助他比较受不同“语言”限制的分类器的 PAC 可学习性。例如，我们已经看到 1.\
  \ 某些属性值的逻辑取值可以从规模合理的训练集中学习到，而由任何布尔函数定义的通用概念通常无法学习。\n\n该分析的其他其他推论将在第 7.3 节中讨论。\n\n\
