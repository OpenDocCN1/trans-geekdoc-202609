  \n第 10 章\n\n## 需要了解的一些实际方面\n\n想要避免失望的工程师必须意识到某些机器学习的方面，为了清晰起见，我们在介绍基础技术时不得不忽略了这些方面。本章的任务就是介绍其中最重要的内容。\n\
  \n要考虑的第一点是偏置（bias）：为了能够学习，学习者必须对当前的问题建立在某些假设，从而缩小搜索空间的大小。另一个重要点在于观察：如果大多数训练示例只属于一类，那么增加训练集的大小实际上可能会损害学习者的机会。之后，我们将讨论如何处理定义往往随上下文或时间而变化的类别。最后一部分关注一些更平庸的方面，如未知属性值、最有用的属性集选择以及多标签示例问题。\n\
  \n| ![image](img/chapter_title_corner_decoration_left.png)  ||  || ![image](img/chapter_title_corner_decoration_right.png)\
  \  |\n\n| --- | --- | --- |\n\n![image](img/chapter_title_above.png) \n\n## 10.1\
  \ 学习者的偏置\n\n![image](img/chapter_title_below.png) \n\n第 7 章大胆地宣布过“没有偏置就没有学习”。其点在于，一个不受限制的（因此是极大的）假设空间避免会包含许多假设，这些假设仅仅凭运气就正确分类了整个训练集，但在未来的示例上仍然会有很多错误。这还有另一个更实用的侧面：为了找到某些东西，你需要知道去哪里寻找；而那个东西隐藏的地方越小，成功的概率就越高……\n\
  \n![image](img/scene_break.png)\n\n### 简单示例\n\n假设我们要识别一种线性分类器不足以应对的情况。例如，如果两类数据之间的决策边界是异或（XOR）函数，那么线性分类器将失败。\n\
  \n![image](img/image605.png)\n\n### 表征偏置与过程偏置\n\n在机器学习方面，偏置以不同的形式出现。所谓的表征偏置（representational\
  \ bias）是由我们希望公式化分类器的语言决定的。例如，在具有连续属性的领域中，一种可能的表征偏置可以是选择线性分类器；另一种可以是对多项式的偏好，而另一种是对神经网络偏好。如果所有属性都是离散的，工程师可能更倾向于属性的合取。当然，所有这些偏置都有优点也有缺点。\n\
  \n除此之外，工程师通常必须选择某种过程偏置（procedural bias）。我们指的是对某种寻找解决方案的方法的偏好。例如，其中一种偏置依赖于假设剪枝（pruning）将提高决策树的分类性能。另一种过程偏置是神经网络中参数的选择。在线性分类器领域，另一种可能是工程师决定采用感知机学习而不是\
  \ `WINNOW`——或者反之亦然。\n\n### 偏置的强度与偏置的正确性\n\n假设工程师想要决定使用线性分类器还是神经网络来处理给定的机器学习问题。如果正样本和负样本是线性可分的，那么线性分类器显然是更好的选择。虽然两种范式都能找到解决方案，但神经网络倾向于过拟合训练集，从而对未来数据的泛化能力差。另一方面，如果区分两类的初步边界是高度线性的，那么线性分类器将缺乏必要的灵活性，而神经网络可能相当轻松地应对。\n\
  \n\n\n\n\n## 一条实用的经验法则：奥姆剃刀\n\n理想情况下，工程师希望使用一种正确的偏置（无论是表示偏置还是过程偏置）。如果可能在两个或多个正确的偏置之间进行选择，则应优先选择更强的偏置，因为成功的概率更高——这就是我们在第\
  \ 7 章中学到的，当时将选择更简单解决方案的建议被称为“奥姆剃刀”（`Occam’s Razor`）。\n\n不幸的是，我们很少能预知所有可能的偏置之正确与否。有根据的推测就是我们能期待的最优结果。在某些范式中，例如高阶多项式，偏置非常弱，以至于该类别的分类器有极概率以零错误率分类整个训练集；然而，由于其在\
  \ `PAC-可学习性` 方面存在的问题，其在未来数据上的表现是不确定的。加强偏置（例如通过降低多项式的阶数）会减少 `VC-dimension`，增加在未来数据上的机会——但前提是该偏置必须保持正确。在某一时刻，进一步加强偏置将弊大于利，因为偏置会变得错误，甚至可能是非常错误。\n\
  \n我们需要记住的是一种几乎不可避免的权衡：一个轻微错误但强大的偏置可能比一个正确但非常弱的偏置更好。但“轻微错误偏置”在具体应用中的含义，通常只能根据工程师的经验或额外的实验来决定（参见第\
  \ 11 章）。\n\n## “终身学习”\n\n在某些应用中，机器学习软件需要学习一系列概念或类别，所有这些内容都预期在同一特定偏置范围内有一个解决方案。在这种情况下，将学习过程分为两个层次是有意义的。在低层，任务是识别最合适的偏置；在高层，软件使用该偏置归纳分类器。这种策略使用的术语“终身学习”提醒了我们人类在学习中的一种典型困难：在给定领域内“学习如何学习”。\n\
  \n## 分类器错误的两个来源\n\n到为止的观察将帮助我们更好地掌握分类器错误的两个主要来源。\n\n### 第一个是训练示例的方差\n\n事实是，用于归纳具体分类器的数据几乎从没有捕捉到底层类的所有方面。这部分归因训练集的创建方式。在某些应用中，训练集是随机创建的。在其他领域，它由当前可用的示例组成，这也涉及到大量的随机性。而在另另一些领域中，训练集是由专家创建的，专家选择了他认为最能代表给定类的示例。最后一种情况不可避免地具有主观性，因此可靠性不亚于前两个。鉴于此，人们很容易想象为同一个领域可能会创建一个不同的训练集。点就在于：从不同的训练集中，将归纳出一个稍微不同的分类器，而这个不同的分类器将在未来数据上产生稍微不同的错误。这就是我们所说的训练数据中的方差是错误的重要来源。如果我们使用非常大的训练集，通常可以减少其负面影响。\n\
  \n### 第二个错误来源与偏置有关\n\n如果两个类别 `pos` 和 `neg` 不是线性可分的，那么任何线性分类器都不可避免地误分类某些最小比例的未来示例。偏置相关的错误无法降低到某个极限以下，因为它们是所选类型分类器本质决定的。\n\
  \n思考这两个来源之间的权衡是有益益的。一方面，如果我们采用已知的具有较弱偏置的机器学习范式，就可以减少偏置相关的错误。不幸的是，这种决策的无意后果之一是方差更高。相反，原则上可以通过加强偏置来减少方差——而如果偏置是错误的，将增加偏置相关错误的频率。\n\
  \n––––––––![image](img/scene_break)\n\n### 你学了什么？\n\n为了确保你理解这一主题，请尝试回答以下问题。如果你有困难，请回到本文的相应位置。\n\
