  ![image](img/chapter_title_above.png)\n\n## 6.6 将决策树转换为规则\n\n![image](img/chapter_title_below.png)\n\
  \n决策树与其他分类器相比的优势之一是它们的可解释性。从根节点到叶节点路径上的任何测试序列都代表一个“如果……那么……”的规则，该规则解释了分类器为何将给定示例标记为该类或那类。\n\
  \n### 决策树生成的规则\n读者会发现将决策树转换为一组规则非常容易。只需要注意到叶节点是通过一系列边到达的，这些具体选择是由沿路遇到的属性测试结果决定的。因此，每个叶节点都与测试结果的具体交结相关联。\n\
  \n为了说明，让我们从图 6.1a 的决策树中写出 `pos` 类的完整规则集。\n\n```\nif crust-size=big AND filling-size=big\
  \ then pos\nif crust-size=big AND filling-size=small AND shape=circle then pos\n\
  if crust-size=small AND shape=circle then pos\nelse neg\n```\n\n### 规则剪枝\n之前描述的树后验剪枝机制将子树替换为叶节点。这意味着低级测试是首先移除的，因为该技术无法在移除下方节点之前移除高级节点。在线剪枝的情况也是类似的。\n\
  \n然而，一旦树转换为规则，剪枝获得了更大的灵活性：任何规则中 `if` 部分的任何测试都是移除的候选对象；以及整个……\n\n### 表 6.9 规则剪枝算法\n\
  ![image](img/image731.png)\n将决策树重写为规则集。\n\n`c` 控制剪枝程度的用户集常量\n\n1. 在每条规则中，计算移除单个测试所带来的错误估计增加。\n\
  2. 选择增加量 `Dmin` 最小的移除。移除这些测试，但前提是 `Dmin < c`。\n3. 在规则集中，搜索要移除的最弱规则。\n4. 选择默认类。\n\
  5. ![image](img/image731.png) 根据规则的强度（它们覆盖的训练示例数量）进行排序。\n\n### 表 6.10 规则剪枝算法示例\n\
  ![image](img/image731.png)\n假设图 6.2 左部分的决策已转换为以下规则集（当所有规则的 if 部分均为假时使用的默认标签为 neg）。\n\
  \n![image](img/image227.png)\n\n```\nt1 ^ t2 ! pos\nt1 ^ :t2 ^ t3 ^ t4 ! pos\n:t1\
  \ ^ t5 ^ t6 ! pos\nelse neg\n```\n\n\n\n\n假设对规则中测试的评估得出结论：第二条规则中的 `t3` 和第三条规则中的\
  \ `t5` 可以删除，且不会显著增加误差估计值。我们得到了以下修改后的规则集。\n\n![image](img/image227.png)\n\n```\n\
  t1 ^ t2  ! pos\nt1 ^ :t2 ^ t4 ! pos\n:t1 ^ t6  ! pos\nelse  neg\n```\n\n![image](img/image227.png)\n\
  \n下一步可以发现，第二条（已经修改过的）规则也可以删除，且不会显著增加误差估计值。删除后，规则集如下所示。\n\n![image](img/image227.png)\n\
  \n```\nt1 ^ t2  ! pos\n:t1 ^ t6 ! pos\nelse  neg\n```\n\n![image](img/image227.png)\n\
  \n这便完成了剪枝。\n\n![image](img/image594.png)\n\n––––––––\n\n![image](img/scene_break.png)\
  \ \n\n规则可以被删除。这是通过表 6.9 中的伪代码总结的规则剪枝算法，并通过表 6.10 中的示例进行说明来实现的。在这里，初始规则集是从图 6.2 左侧（现在已熟悉的）树中获得的。第一步剪枝是删除了那些看起来对整体分类性能贡献不大的测试；下一步删除最薄弱的规则。\n\
  \n然而，我们必须承认，这种额外灵活性的代价是计算成本的显著增加。\n\n––––––––\n\n![image](img/scene_break.png)\n\
  \n### 我们学了什么？\n\n为了确保你理解了这一主题，请尝试回答以下问题。如果你有困难，请返回上文对应的位置。\n\n- 解释将决策树转换为规则集合的机制。由此获得了多少条规则？这种转换的动机是什么？\n\
  - 术语 `default class`（默认类）是什么什么意思？你会如何选择它？\n- 讨论 `rule-pruning`（规则剪枝）的可能性。从什么意义上说，我们可以说规则剪枝比决策树剪枝提供了更大的活性？这种灵活性增加代价是什么？\n\
  \n## 6.7 总结与历史备注\n\n- 在决策树中，属性值是逐个进行测试的，每次测试的结果指示了应该发生什么：要么是另一个属性测试，要么如果到达叶子节点则对类标签做出决策。可以说，决策树由一组部分排序的测试组成，每个测试序列定义了树中由叶子终止的一个分支。\n\
  - 从典型的训练集中可以创建许多备选的决策树。通常情况下，上较小的树，其主要优势是可解释性、消除无关和冗余属性以及降低对噪声数据的过拟合风险。\n- 从数据归纳决策树的最典型程序以递归方式进行，始终试图寻找提供关于类标签最大信息的属性。这种方法倾向于使生成的决策树更小。“best`\
  \ 属性通过信息论的简单公式确定。\n- 决策树归纳的一个重要方面是剪枝。主要动机是确保所有的树分支都有充分证据的支持。此外，剪枝减小了树的大小，具有某些优势（见上文）。存在两种通用的剪枝类型。(1)\
  \ 在 `post-pruning`（后剪枝）中，树被完全生成，然后进行剪枝。(2) 在 `on-line pruning`（在线剪枝，这可能是一个误称）中，一旦用于确定下一个属性的训练子集变得太小，树的生成就会停止。在这两种情况下，剪枝程度都由用户设置的参数（分别表示\
  \ `c` 和 `m`）控制。\n- 决策树可以转换为规则集，并对其进一步进行剪枝。在一个具有 `K` 个类的领域中，只需指定 `K-1` 个类的规则即可，剩余的类成为\
  \ `default class`。规则通常更容易解释。规则剪枝算法有时会导致更紧凑的分类器，尽管计算成本显著增加。\n\n历史备注：决策树背后的思想由 Hoveland\
  \ 和 Hund 在 20 世纪 50 年代后期提出。这项工作后来在 Hunt 等人 [39] 的书中得到了总结，该书报告了对他们的概念学习系统（`CLS`）进行多次实现的经验。Friedman\
  \ 等人 [30] 独立开发了类似的方法。Breiman 等人 [11] 达到了研究的早期高潮，在书中描述了系统 `CART`。随后，这一思想被 Quinlan\
  \ [75, 76] 引入了机器学习领域。也许著名的实现是 Quinlan [78] 的 `C4.5`。本章基于 `C4.5` 的简化版本。\n\n## 6.8\
  \ 巩固你的知识\n\n这些练习是为了巩固所得的知识。建议的思想实验将帮助读者从不同的角度看待本章的思想，并引发独立思考。计算机作业将迫使读者注意他们可能会忽略的看似不足道的细节。\n\
