  \ 1。基于此，我们可以说前两行 1 的比例分别为 0.6 和 0.9，因为每行包含 10 个数字。同样，前两列 1 的比例分别为 0.9 和 0.8。这四个比例的平均值为\
  \ `(0.6+0.9+0.9+0.8)/4 = 0.80`，标准差为 `0.08`¹¹。\n\n![image](img/image112.png)![image](img/image112.png)对于统计学家来说，每一行或每一列都代表了总体的一个样本。所有样本的大小相同：`n\
  \ = 10`。现在，假设我们将此值增加到，例如 `n = 30`。那么比例将如何分布？\n\n![image](img/image679.png)![image](img/image197.png)![image](img/image574.png)回到表格，我们可以看到前三行合并包含\
  \ `6 + 9 + 9 = 24` 个 1，接下来的三行包含 `8 + 7 + 10 = 25` 个 1，前三列包含 `9 + 8 + 9 = 26` 个，接下来的三列包含\
  \ `5 + 10 + 8 = 23` 个。将这些数字中的每一个除以 `n = 30`，我们得到以下\n\n![image](img/image031.png)比例：`24/30\
  \ = 0.80`；`25/30 = 0.83`；`26/30 = 0.87` 以及 `23/30 = 0.77`。计算这四个值的平均值和标准差，我们得到 `0.82\
  \ ± 0.02`。\n\n![image](img/image087.png)![image](img/image035.png)![image](img/image112.png)![image](img/image112.png)如果我们比较\
  \ `n = 10` 情况下的观察结果与 `n = 30` 的结果，我们会注意到两点。首先，大样本计算出的平均值（0.82）与小样本计算出的平均值（0.80）之间存在微小差异。其次，大样本表现出明显更小的标准差：`n\
  \ 30` 为 `0.02`，而 `n 10` 为 `0.08`。这些观测结果仅仅是巧合吗，还是某种底层规律的结果？\n\n![image](img/image605.png)\n\
  \n¹回想标准差是变异的平方根；这反过来是通过第 2 章的公式 (2.13) 计算的。\n\n### 1. 总体采样 233\n\n#### 基于随机样本的估计\n\
  答案由一个定理给出，该定理说基于样本的估计随着样本量 `n` 的增大而变得更加准确。此外，样本越大，不同样本之间的估计变异就越小。\n\n另一个定理，即所谓的中心极限定理，指出，单个估计值的分布可以用我们从第\
  \ 2 章已熟悉的高斯正态分布来近似——读者会记得它特征性的钟形形状。然而，这种近似仅在比例 `p` 和样本量 `n` 满足以下两个条件时才被认为是相当准确的：\n\
  \n```\nnp ≥ 10  (12.1)\nn(1 - p) ≥ 10  (12.2)\n```\n\n如果不满足条件（如果至少有一个乘积小于 10），则从样本获得的估计值分布将无法在不损失准确性的情况下用正态分布近似。\n\
  \n12.2 节和 12.3 节将详细说明正态分布近似如何帮助我们建立对归纳分类器测量性能的信心。\n\n![image](img/image277.png)插图\n\
  让我们检查在表 12.1 的情况下这些条件是如何满足的。我们知道原始总体中 1 的比例是由随机数生成器决定的：`p = 0.8`。让我们从大小为 `n = 10`\
  \ 的样本开始。事实证明没有任何条件满足，因为 `np = 10 * 0.8 = 8 < 10` 且 `n(1-p) = 10 * 0.2 = 2 < 10`。因此，这种大小样本中的比例分布无法用正态分布近似。\n\
  \n在第二次尝试中，样本量增加到 `n = 30`。结果，我们得到 `np = 30 * 0.8 = 24 ≥ 10`，这意味着条件 12.1 被满足。但同时，`n(1-p)\
  \ = 30 * 0.2 = 6 < 10`，所以没有满足条件 (12.2)。即使在这里，正态分布也没有提供准确的近似。\n\n如果我们将样本量增加到 `n =\
  \ 60`，情况就会改变。通过计算，我们可以很容易地确定 `np = 60 * 0.8 = 48 ≥ 10` 且 `n(1-p) = 60 * 0.2 = 12\
  \ ≥ 10`。两个条件都满足了，因此得出结论，这种大小样本中的比例分布可以用正态分布近似。\n\n#### p 的影响\n注意正态分布的适用性如何受到 `p`（总体中\
  \ 1 的比例）的影响。很容易看出，对于不同的 `p` 值，为了满足条件，需要不同的样本量。如果 `p` 为 0.5，较小的尺寸就足够；但比例偏离 0.5 越，需要的样本越大。\n\
  \n为了更好地理解这在实践中意味着什么，回想在 `p = 0.8` 的情况下我们发现 `n = 60` 的样本量是足够的。但是，如果我们决定在相同大小 `n 60`\
  \ 的样本上进行估计，但在比例更高的领域，例如 `p = 0.95` 呢？在这种情况下，我们会意识到 `n(1-p) = 60 * 0.05 = 3 < 10`，这意味着条件\
  \ (12.2) 未满足，这种大小样本中的比例分布无法用正态分布近似。为了在该领域满足该条件，我们需要至少 `n = 200` 的样本量。由于 `200 * 0.05\
  \ = 10`，我们恰好及格了。顺便提一下，由于这两个条件 (12.1) 和 (12.2) 的对称性，在 `p = 0.05` 代替 `p = 0.95` 的领域，同样需要最小尺寸\
  \ `n = 200`。\n\n#### 分布的参数\n让我们回到采样估计 1 比例的尝试。我们现在知道，如果样本足够大，不同样本所做的估计分布可以用正态分布近似，其均值等于如果进行此类实验时在整个总体中观察到的（理论）1\
  \ 的比例。\n\n\n\n\n分布的另一个参数是标准差。在我们的语境下，统计学家更倾向于使用 `standard error`（标准误差）这一术，这种术语上的细微差别是为了表示：“标准差”指的是任何变量（如重量、年龄或温度）的分布，而“标准误差”一词用于描述从一个样本到另一个样本的估计值的差异。而这正是我们在处理比例案例时感兴趣的。\n\
  \n我们将标准误差记为 `sE`。数学家们已经证明，其值可以通过样本量 `n` 和理论比例 `p` 使用以下公式计算出来：\n\n```\n![image](img/image659.png)![image](img/image363.png)![image](img/image213.png)![image](img/image284.png)s\
  \ D r p.1 - p/\n```\n\n––––––––\n\n![image](img/scene_break.png) \n\n(12.3)\n\n\
  例如，如果 `n` D `50` 且 `p` D `0:80`，则标准误差如下：\n\n```\n![image](img/image659.png)![image](img/image542.png)![image](img/image733.png)![image](img/image091.png)s\
  \ D r 0:80 · 0:20 D 0:06\n```\n\n当用简单的英语表达这一结果时，一些工程师倾向于说标准误差为 6%。\n\n### `n` 的影响；递减收益\n\
  \n请注意标准误差的值与样本量 `n` 是方向相反的。具体来说，样本越大，标准误差越低，反之亦然。因此在 `n` D `50` 且 `p` D `0:80` 的情况下，我们得到的\
  \ `sE` Dq0:06。如果我们使用更大的样本，例如 `n` D `100`，那么分布就会变得更窄，不同样本中的比例将倾向于接近 `p`。\n\n话虽如此，我们也应该意识到增加样本量会带来收益递减。让我们用一个简单的例子来说说明这一观点。上一段的计算说服了我们，当样本从\
  \ `n` `50` 增加到 `n` `100`（翻倍）时，我们成功地将 `sE` 减少了两个百分点，从 6% 降到 4%。如果我们对 `n` `1000` 进行相同的计算，得到的\
  \ `sE` 为 `0:013`，而 `n` `2000` 得到的 `sE` 为 `0:009`。换句话说，将样本量从 1000 翻倍到 2000，我们仅将 `sE`\
  \ 减少了 `0.004`，即 0.4 个百分点。\n\n\n\n\n\n![image](img/image600.png)\n\n### 识别感兴趣的区间\n\
  \n并不是所有的区间都同样重要。对于分类器评估，我们感兴趣的是那些以均值 `p` 为中心的区间。例如，工程师可能想知道在 `p - a; p + a]` 范围内会有多少百分比的值。相反，她可能想知道包含\
  \ 95% 所有值的区间（同样以 `p` 为中心）的大小有多大。\n\n![image](img/image305.png)\n严格来说，这类问题可以通过数学分析来回答。幸运的是，我们不需要自己进行数学计算，因为别人已经做过了，我们可以利用他们的发现。一些最实用的结果显示在表\
  \ 12.2 中。在这里，左列列出了被称为“置信水平”的百分比；对于其中的每一个水平，右列规定了包含给定百分比数值的区间。注意，区间的长度由 `z^*` 刻征，即\
  \ `p` 左右各侧的标准差倍数。因此，更正式地说，该区间定义为 `p - z^*a; p + z^*a]`。\n\n![image](img/image524.png)![image](img/image600.png)\n\
  以下是该表的实际用途。假设我们想知道包含 95% 数值的区间有多大。这个百分比位于第三行。我们可以看到右侧的数字是 `1.96`，这被解释为告诉我们 95% 的值位于区间\
  \ `p - 1:96sacc; p + 1:96sacc]` 中。同样，68% 的值位于区间 `p - a; p + a]`——这是我们从表的第一行中学到的。\n\
  \n### 基于样本估计的标准误差\n\n让我们来看看在评估分类准确率时如何运用这些知识。假设所有测试集的大小相同为 `n`，并且假设该大小满足条件 (12.1)\
  \ 和 (12.2)，这些条件允许我们使用正态分布。我们已经知道，在许多独立测试集上测量的分类准确率的平均值将收敛于理论准确率，即通过对所有可能的示例测试分类器所得到的准确率。\n\
  \n![image](img/image312.png)\n标准误差² 使用公式 (12.3) 计算。例如，如果理论分类准确率为 `p = 0.70`，且每个测试集的大小为\
  \ `n = 100`，那么从许多不同测试集得到的分类准确率的标准误差计算如下：\n\n![image](img/image036.png)![image](img/image363.png)![image](img/image230.png)![image](img/image537.png)![image](img/image734.png)![image](img/image213.png)![image](img/image284.png)\n\
  ```\nsacc = sqrt(p(1 - p)/n)\n```\n在四舍五入后，我们会说分类准确率为 70% 正负 5%。再次注意，如果我们使用更大的测试集，标准误差将会降低。这是有道理的：测试集越大，评估就越详尽，因此我们对所得数值的信心也就越高。\n\
  \n![image](img/image112.png)![image](img/image194.png)![image](img/image692.png)\n\
  现在让我们问，如果在其他相同大小测试集上评估分类器，我们将得到什么值。我们再次通过表 12.2 来回答这个问题。首先，我们找到代表 95% 的行。在该行中，右列给出的值为\
  \ `z^*1.96`；这解释为告诉我们 95% 的结果将位于区间 `p - 1:96sacc; p + 1:96sacc = [0.80 - 0:46; 0.80\
  \ + 0:46] = [0.61; 0.79]`。\n\n![image](img/image112.png)\n但不要忘记，只有当测试集的大小相同 `n =\
  \ 100` 时情况才会如此。对于不同的 `n`，公式 (12.4) 将给我们一个不同的标准误差 `sacc`，从而得到不同的区间。\n\n### 两个重要的提醒\
  \ 提醒自己正态分布假设究竟有什么用可能是一个主意。具体来说，如果分布是正态的，那么我们可以使用表 12.2，从此我们学习以 `p` 为中心包含给定百分比数值的区间大小。\n\
  \n另一方面，标准误差公式（公式 (12.3)）是通用的，即使分布不是正态的。计算标准误差时，不需要满足条件 (12.1) 和 (12.2)。\n\n––––––––\n\
  ![image](img/scene_break.png)\n\n###### 你学到了什么？为了确保你理解了这一主题，请尝试回答以下问题（如果需要，返回正文）：\n\
  \n* 正态分布假设的用途是什么\n* 根据表 12.2，我们能从表中学习到什么信息？\n* 根据表 12.2，我们如何计算区间？\n* 置信水平和标准误差的定义是什么？\n\
  \n\n\n\n![image](img/image328.png)\n\n## 选择置信水平\n\n在上述讨论的示例中，请求的置信水平为 95%，这是一个相当常见的选择。如果选择另一个置信水平，将得到一个不同的置信区间。因此，对于\
  \ 99%，表 12.2 给出的 `z^*` 为 2:58，置信区间为 `[0:85 - 0:09; 0:85 + 0:09] = [0:76; 0:94]`。注意，这个区间比\
  \ 95%置信水平的区间要长。\n\n![image](img/image112.png)![image](img/image014.png)这是意料之中的：真实的理论分类准确率落在较长区间内的概率更高。相反，理论值落在某个较窄区间内的概率较低。因此，对于\
  \ 68%的置信水平（且标准误差四舍五入后 `sacc` 为 0:04），置信区间为 `[0:85 - 0.04; 0:85 + 0:04] = [0:81;\
  \ 0:89]`。\n\n重要的是，我们不能忘记，即使在 99%的置信水平下，也无法绝对确定理论值一定会落在相应的区间内。仍然有 1%的概率使得测量值落在该区间之外。\n\
  \n### 另一个参数：样本量\n\n读者现在已经理解了置信区间的长度取决于标准误差，而标准误差反过来取决于测试集的大小 `n`（参见等式 (12.3)）。本质上，测试集越大，支持测量值的证据就越强，因此置信区间也就越窄。这就是为什么我们说误差范围与训练集大小之间存在反反关系**：随着训练集大小的增加，误差范围随之减小。\n\
  \n之前，我们提到更高的置信水平会导致更长的置信区间。如果我们认为这个区间太大，可以通过更大的测试集（即更大的 `n` 值）来缩短它，这会减小测量值标准误差的数值。\n\
  \n如果我们想将误差范围限制在某个最大值范围内，有一种方法可以用来决定测试集应该有多大。以下是计算误差范围的公式：\n\n```\nM = z* * sacc\n\
  sacc = sqrt(p.(1-p)/n)\n```\n\n![image](img/scene_break.png) \n\n![image](img/image284.png)(12.6)\n\
  \n![image](img/image363.png)![image](img/image213.png)通过解该方程求 `n`（针对特定的 `M`、`p`\
  \ 和 `z*` 值），将得到我们所需的测试集大小。\n\n### 结语\n\n我们使用最简单的性能指标——分类准确率，解释了为给定置信水平建立置信区间的方法。然而，该方法的适用范围要广泛得多：任何代表比例的变量的不确定性都可以被量化。在机器学习的背景下，我们可以使用相同的方法建立对第\
  \ 11 章中任何性能指标的置信度，无论是精确率、召回率还是其他数量。\n\n![image](img/image228.png)![image](img/image059.png)但我们必须谨慎操作以确保正确。首先，我们不能忘记，只有在满足条件\
  \ (12.1) 和 (12.2) 的情况下，给定数值的分布才能近似正态分布。其次，我们必须确保在使用等式 (12.3) 计算标准误差时理解 `n` 的含义。例如，读者记得精确率是用公式\
  \ `NTP / (TP + FP)` 计算的：即在所有被分类器标记为正例的样本中，真正例的百分比。这意味着我们处理的是大小为 `n` (`NTP + NFP`)\
  \ 的样本中的真正例比例。在召回率和其他性能指标的情况下，也必须进行类似的考虑。\n\n### 你学到了什么？\n\n为了确保你理解了该主题，请尝试回答以下问题。如有需要，回到文中适当的位置。\n\
  \n- 解释“置信区间”（confidence interval）一术语的含义。“误差范围”（margin of error）是指什么？\n- 置信区间的长度（以及误差范围）如何取决于用户指定的置信水平？它如何取决于测试集的大小？\n\
  - 讨论其他性能指标（如精确率和召回率）的置信区间计算方法。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \  ||  || ![image](img/chapter_title_corner_decoration_right.png)  |\n| --- | ---\
  \ | --- |\n\n![image](img/chapter_title_above.png) \n\n# 12.4 分类器的统计评估\n\n![image](img/chapter_title_below.png)\
  \ \n\n关于分类器性能的断言可以通过在一组预先分类的示例上测试分类器并通过实验证实或反驳。因此，对所得结果进行统计评估的一种方法是遵循表 12.3 中的算法。让我们用一个简单的示例来说说明这个过程。\n\
  \n![image](img/image112.png)![image](img/image112.png)\n\n### 简单示例\n假设一位机器学习专家告诉你，他诱出的分类器分类准确率为\
  \ `acc = 0.78`。遵循“信任但要验证”的格言，你决定查证这一说法是否正确。为此，你准备了 `n = 100` 个类标签已知的示例，然后开始测量分类器的性能。\n\
  \n––––––\n\n![image](img/scene_break.png) \n\n表 12.3 分类器性能统计评估算法\n\n![image](img/image309.png)\n\
  \n1. 对于给定的测试集大小 `n` 和声明的分类准确率 `acc`，检查是否满足正态分布条件：\n   `n * acc >= 10` 且 `n * (1\
  \ - acc) >= 10`\n\n1. 使用常规公式计算标准误差：\n   ```\n   sacc = sqrt(acc.(1-acc)/n)\n   ```\n\
  \n1. 假设正态分布假设正确，在表 12.2 中找到对应的 `z*` 值。相应的置信区间为 `[acc - z*sacc; acc + z*sacc]`。\n\
  \n2. 如果测量值落在该区间之外，拒绝准确率为 `acc`。否则，假设证据不足以拒绝。\n\n假设结果得到的分类准确率为 0:75。嗯，这低于承诺的 0:78，但这个：观察到的差异是否仍在合理范围内？换句话说，是否有可能专家的说法是正确的，而测试集上测量的较低性能可以通过测试数据的随机性所带来的波动来解释？毕竟，不同的测试集可能会导致不同的分类准确率。\n\
  \n### 检查正态分布条件\n第一个要问的问题是得到的性能分布是否可以用正态分布近似。肯定的答案将允许我们根据表 12.2 中的数值进行统计评估。\n\n![image](img/image203.png)![image](img/image322.png)验证条件\
  \ (12.1) 和 (12.2) 非常简单。看到 `np = 100 * 0.75 = 75 >= 10` 且 `n(1-p) = 100 * 0.25 =\
  \ 25 >= 10`，我们意识到条件已经满足，可以使用正态分布假设。\n\n\n\n\n\n![image](img/image112.png)![image](img/image112.png)\n\
  \n# 寻找 95%置信水平的置信区间\n\n假设你准备接受专家的声明（`acc = 0.78`），前提是至少有 95%的概率，这种性能可能使得在随机测试集上观察到的分类准确率\
  \ `acc >= 0.75`。如果 `0.75` 落在以 `0.78` 为中心的相应置信区间内，这种情况就是可能的。让我们来看看情况是否如此。\n\n![image](img/image024.png)![image](img/image112.png)表格中对应的行告诉我们\
  \ `z* = 1.96`；这意味着随机测试集上获得的准确率有 95%将落在 `[acc - 1.96 sacc, acc + 1.96 sacc]` 区间内，其中\
  \ `acc = 0.78` 是原始声明，`sacc` 是对于给定大小 `n` 的测试集统计上预期的标准误差。\n\n![image](img/image112.png)在我们具体的训练集中，大小为\
  \ `n = 100`。标准误差的计算如下：\n\n![image](img/image036.png)![image](img/image363.png)![image](img/image230.png)![image](img/image733.png)![image](img/image091.png)![image](img/image734.png)![image](img/image173.png)\n\
  ```\nsacc = sqrt((0.75 * 0.25) / 100) = 0.043 (12.7)\n```\n\n![image](img/image551.png)我们得出置信区间为\
  \ `[0.78 - 1.96 * 0.043, 0.78 + 1.96 * 0.043]`，经过评估和四舍五入后，为 `[0.70, 0.86]`。\n\n\
  ![image](img/image112.png)关于专家声明的结论\n\n在我们自己的训练集上评估得到的分类准确率为 `acc = 0.75`，该值位于所选\
  \ 95%置信水平对应的置信区间内。\n\n![image](img/image112.png)![image](img/image112.png)这是令人鼓舞的。对于给定的声明\
  \ `acc = 0.78`，有 95%的概率我们在随机测试集上的评估将分类准确率落在 `[0.70; 0.86]` 区间的某个范围内。这确实是这种情况下发生的情况。因此，尽管我们的结果\
  \ `acc = 0.75` 略低于专家的声明，但我们必须承认，我们的实验评估未能提供反对该声明的有力证据。在缺乏此类证据的情况下，我们接受该声明是有效的。\n\
  \n## 统计评估中的第一类错误：假报警\n\n读者现在理解了统计评估的基本原理。有人对性能得出一个结论。根据我们测试集的大小（假设符合正态分布），我们计算出预期包含\
  \ 95%所有值的区间大小。如果原始声明是正确的，只有 5%的概率测试结果会在该区间之外。这就是为什么我们拒绝任何测试结果落在这个小于 5%区域的假设。我们简单地假设不太观察到这种差异。\n\
  \n尽管如此，这种差异在 5%的情况下仍然是预料到的。我们必须承认，存在某种危险，即在随机测试集上对分类器的评估可能会得到位于给定区间之外的值。在这种情况下，拒绝专家的声明是不公平的。统计学家将其称为\
  \ `type-I error`（第一类错误）：对本正确声明的虚假拒绝。\n\n如果我们不想面对这种危险，可以通过增加所需的水平来降低它。如果我们选择 `99%`\
  \ 而不是 `95%`，假报警的频率将会更低。但这种减少不是免费的——正如下一段将解释的那样。\n\n## 统计评估中的第二类错误：未能检测错误的声明\n\n\
  相反的情况也可能。也就是说，初始声明是假的，但通过测试获得的分类准确率落在给定的置信区间内。当这种情况发生时，我们被迫得出结论：我们的实验未能提供反对该声明的足够证据；该声明必须被接受。\n\
  \n读者可能会觉得这不幸，但这确实发生了。错误的声明没有被反驳。统计学家将其称为 `type-II error`（第二类错误）。这是那些需要极高置信水平的情况的典型：相应的区间非常宽，以至于测试结果几乎不会落在之外；实验结果结果很难导致对初始声明的拒绝。\n\
  \n需要记住的是这两种错误之间不可避免的权衡。通过增加置信水平，我们减少了 `type-I error` 的危险，但以增加 `type-II error` 危险为代价，反之亦然。\n\
  \n––––––––\n\n![image](img/scene_break.png)\n\n### 你学到了什么？\n\n为了确保你理解了这个主题，请尝试回答以下问题。如有必要，回到文中适当的位置。\n\
  \n*   解释如何评估分类器在测试集上性能的实验测量结果。\n*   术语 `type-I error`（假报警）是什么意思？可以做什么来降低这种错误的危险？\n\
  *   术语 `type-II error`（漏检）是什么意思？可以做什么来降低这种错误的危险？\n\n| ![image](img/chapter_title_corner_left.png)\
  \  ||  ![image](img/chapter_title_corner_right.png)  |\n| --- | --- | --- |\n\n\
  ![image](img/chapter_title_above.png)\n\n# 12.5 另一种统计评估\n\n![image](img/chapter_title_below.png)\n\
  \n此时，读者已经理解了实验结果统计处理的本质，并知道在评估关于分类器的声明时如何使用。然而，借助统计学可以完成更多事情。\n\n## 测试集是否代表不同的语境？\n\
  \n第 10 章提到过，有时需要不同的语境——例如英国口音与美国口音。这里统计学如何帮助我们识别此类情况。\n\n![image](img/image586.png)![image](img/image586.png)![image](img/image586.png)假设我们在两个测试集上测试了两个分类器。第一次测试的分类准确率为\
  \ `p1`，第二次测试的分类准确率为 `p2`（字母 `p` 指代答案的比例）。最后，让两个集合的平均比例为 `p`。\n\n![image](img/image682.png)感兴趣的统计量由以下公式定义：\n\
  \n```\nz = (p1 - p2) / sqrt(p*(1-p)/n1 + p*(1-p)/n2)\n```\n\n![image](img/image418.png)\n\
  \n––––––\n\n![image](img/scene_break.png) \n\n![image](img/image455.png)(12.8)\n\
  \n![image](img/image484.png)将结果与给定置信水平的临界值比较——该值可以在表 12.2 中找到。\n\n![image](img/image654.png)![image](img/image266.png)![image](img/image390.png)\n\
  \n具体示例\n\n假设分类器在大小为 `n1 = 100` 和 `n2 = 200` 的测试集上进行了评估。假设两次测试测量的分类准确率分别为 `p1 = 0.82`\
  \ 和 `p2 = 0.74`，因此两个集合的平均分类准确率为 `p = 0.77`。读者可以很容易地验证满足正态分布的条件。\n\n![image](img/image493.png)将这些值代入公式(12.8)，我们得到：\n\
  \n```\nz = (0.82 - 0.74) / sqrt(0.77*0.23/100 + 0.77*0.23/200) = 1.60 (12.9)\n```\n\
  \n\n\n\n![image](img/image046.png)![image](img/image252.png)由于该值小于表 12.2 中给出的 95%\
  \ 置信水平值，我们得出结论：结果位于相应的置信范围内，因此接受这两个结果在统计学上是不可区分的。\n\n––––––––\n\n![image](img/scene_break.png)\
  \ \n\n## 你都学了什么？\n\n为了确保你理解了该主题，请尝试回答以下问题。如有需要，请返回文中相应的位置。\n\n12.6  比较机器学习技术 245\n\
  \n• 为什么我们应该担心分类器被应用于错误类型的数据上？\n\n• 这里使用了什么公式？你是如何进行评估的？\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \  ||  || ![image](img/chapter_title_corner_decoration_right.png)  |\n\n| --- |\
  \ --- | --- |\n\n![image](img/chapter_title_above.png) \n\n# 12.6  比较机器学习技术\n\n\
  ![image](img/chapter_title_below.png) \n\n有时，我们需要知道两种替代机器学习技术中哪一种更适用于给定的类别识别问题。通常的方法论与之前的章节有所不同，尽管它是围绕相似的原理构建的。我们不进行冗长的理论化，而是通过一个带有具体数据的简单示例来说说明这种评估。\n\
  \n![image](img/image639.png)## 实验方法论\n\n如第 11 章所述，实验性比较两种机器学习算法的一种方法是使用 5 折交叉验证。读者会记得，在这种方法中，将可用的预分类数据集分为两个大小相等的子集，`T11`\
  \ 和 `T12`。首先，使用两种机器学习技术从 `T11` 归纳它们的分类器，然后在 `T12` 上对这些分类器进行测试；然后，分别从 `T12` 归纳两个分类器并在\
  \ `T11` 上进行测试。该过程重复五次，每次都将数据集随机分为两个子集 `Ti1` 和 `Ti2`。\n\n结果，我们得到了十对测试集分类准确率（或错误率、精确率、召回率或任何其他选性能标准）。随后提出的问题公式如下：“这十对结果之间的差异在统计学上是显著的？”\n\
  \n### 实验结果示例：配对比较\n\n让我们将第 i 对集合分别标记为 `Ti1` 和 `Ti2`。假设我们正在比较两种机器学习算法 `ML1` 和 `ML2`，并按照上段所述的方法，在十次实验运行中对它们进行评估。假设结果如表\
  \ 12.4 所示。在该表中，每列的表头是相应实验运行使用的测试集名称。表中的字段给出了由两种替代归纳技术归纳的分类器在相应测试集上实现的分类准确率（百分比）。最后一行指定了两个分类准确率之间的差异。注意，这些差异为正或为负。\n\
