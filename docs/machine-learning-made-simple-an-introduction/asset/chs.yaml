  \ 17.2 所示的简单版跳井棋可能需要多少个阶段（episodes）？\n\n2. 编写一个计算机程序来实现 17.1 节描述的 `多臂老虎机`。考虑图 17.4\
  \ 所示的迷宫问题。任务是找到从起点 `S` 到目标 `G` 的最短路径。计算机可以利用强化学习原理，通过多次训练来学习这条最短路径。建议用于捕捉该游戏状态和动作的数据结构。编写一个计算机程序，在处理此任务时依赖阶段性表述和\
  \ `E-greedy` 策略。\n\n![image](img/image407.png)图 17.4 智能体从 `S` 开始；任务是找到到 `G` 的最短路径\n\
