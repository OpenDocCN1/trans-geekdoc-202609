  \ 自组织特征映射：引言\n\n![image](img/chapter_title_below.png) \n\n让我们现在介绍另一种无监督学习方法，这次是借用神经网络领域。该技术被称为自组织特征映射（self\
  \ organizing feature map，SOFM）³。在这种背景下，常用的另一个名称是 Kohonen 网络（Kohonen networks），以纪念它的发明者。\n\
  \n### 思想\n\n解释 SOFM 性质最好的方法是将物理引力原理作为比喻。最初由随机数生成器生成的代码向量，受到一系列示例（属性向量）的影响，每个示例都会向不同的方向“拉”该向量。从长期来看，代码向量将稳定在一个代表所有这些冲突力量折中的位置。\n\
  \n整个网络由一组排列在二维矩阵中的神经元组成，如图 14.6 所示。该矩阵中的每个节点（神经元）代表一个与训练示例长度相同（属性数量相同）的代码向量。底部是一个输入属性向量，它并行连接到所有神经元。其思想是通过训练实现：相邻的神经元对相似的输入向量产生类似的响应。为了简单起见，图片中的输入向量只有两个属性，`x1`\
  \ 和 `x2`。实际上，它可以有很多属性。\n\n![image](img/image605.png)\n\n³在统计学和神经网络中，科学家经常使用“特征”（feature）代替“属性”（attribute）。\n\
  \n1. 自组织特征映射：引言 287\n\n![image](img/image398.png)\n\nx1 x2\n\n图 14.6 Kohonen 网络的通用方案\n\
  \n自组织特征映射 \n\n––––––––\n\n![image](img/scene_break.png) \n\n![image](img/image112.png)\
  \ 权重由 `w` \n\n![image](img/image112.png) 描述示例的 `x`\n\n![image](img/image112.png)w1\
  \ ... xn 其中 `n` 是属性的数量。如果 `1` 是用户指定的学习率，则单个权重根据如下公式进行修改：\n\n```\nwi = wi + 1(xi\
  \ - wi)\n```\n\n注意，如果 `xi > wi`，`i` 权重会增加，因为括号内的项为正。反之，如果 `xi < wi`，权重会减小，因为该项为负。我们从这种意义上说权重被\
  \ `x` 吸引。它被吸引的强度取决于学习率的值。\n\n### 数值示例\n\n假设展示了一个示例 `x = (0.2, 0.8)`，并假设获胜的神经元权重为\
  \ `w = (0.3, 0.7)`。如果学习率为 `1 = 0.1`，则权重计算如下：\n\n```\nw1 = w1 + 1(x1 - w1) = 0.3\
  \ + 0.1(0.2 - 0.3) = 0.29\nw2 = w2 + 1(x2 - w2) = 0.7 + 0.1(0.8 - 0.7) = 0.71\n\
  ```\n\n### 哪些权重会被示例吸引\n\n一旦向矩阵展示了一个示例 `x`，就会启动一个双步骤的过程。第一步（“竞争”）的任务是在矩阵中识别与 `x`\
  \ 最相似的神经元。为此，使用了欧几得距离——距离越小，相似性越高。一旦确定了胜者，第二步将更新该获胜神经元的权重以及其邻域内所有神经元的权重。\n\n![image](img/image578.png)![image](img/image651.png)\n\
  \n图 14.7 Kohonen 网络中的“邻域”概念\n\n### 关于“邻域”的说明\n\n任务是在矩阵中识别与 `x` 最相似的神经元。为此，使用了欧几里得距离——距离越小，相似性越高。一旦确定了胜者，第二步将更新该获胜神经元的权重以及其邻域内所有神经元的权重。\n\
  \n通常，邻域的大小不是固定的。相反，常见的做法是如图 14.7 右所示随时间缩小。最终，领域将退化为单个神经元，即赢得竞争的那个。其思想是从粗略的近似开始，然后进行微调。\n\
  \n### 为什么它是有效的？\n\n自组织特征映射的动机是确保神经矩阵中物理位置相近的代码向量对相似的示例产生响应。这就是为什么相同的权重更新公式应用于胜者邻域内的所有神经元。\n\
  \n\n\n\n\n- 解释自组织算法的两个步骤：竞争和权重调整。同时对学习率 `alpha` 的作用进行注释。\n- 胜出编码向量的邻域是指什么？它的大小总是恒定的吗？\n\
  \n# 14.6 一些重要细节\n\n在概述原理之后，现在让我们来看一些细节，如果没有这些细节，该技术将无法运行。\n\n### 归一化\n除非所有向量都被归一化为单位长度（即长度等于\
  \ 1），否则该技术效果不好。这既适用于描述示例的向量，也适用于神经元的权重向量。幸运的是，单位长度归一化很容易。假设一个示例描述如下：\n\n```\nx =\
  \ (x1; ...; xn)\n```\n\n为了获得单位长度，我们将每个属性的值除以原始属性向量 `x` 的长度：\n\n![image](img/image239.png)\
  \ `xi`\n\n![image](img/image201.png)![image](img/image489.png)![image](img/image722.png)\
  \ `WD = q†(x)`\n\n––––––\n\n![image](img/scene_break.png)\n\n```\nwi = xi / sqrt(sum(xj²))\n\
  ```\n(14.6)\n\n![image](img/image315.png)![image](img/image066.png)![image](img/image161.png)![image](img/image236.png)![image](img/image652.png)\n\
  \n### 数值示例\n假设我们想要归一化二维向量 `x`：将每个属性的值除以该长度将得到向量的归一化版本：\n\n![image](img/image566.png)![image](img/image542.png)![image](img/image627.png)![image](img/image474.png)![image](img/image327.png)![image](img/image236.png)\n\
  \n```\nx⁰ = (x1, x2) / sqrt(x1² + x2²)\n```\n\n验证 `x⁰` 的长度等于 1 是很容易的：使用勾股定理，我们计算结果为\
  \ `sqrt(x1⁰² + x2⁰²) = 1`。我们可以看到，新的属性向量确实具有单位长度。\n\n![image](img/image652.png)![image](img/image552.png)![image](img/image136.png)![image](img/273.png)![image](img/610.png)\n\
  \n### 初始化\nSOFM 的第一步是神经元权重初始化。通常，这种初始化是由随机数生成器完成的，它从一个跨越正负域的区间内选择值，例如 `[-1; 1]`。之后，如上所述将权重向量归一化为单位长度。\n\
  \n![image](img/112.png)![image](img/112.png)\n\n另一个需要决定的是学习率 `alpha`。通常使用较小的值，例如\
  \ `0.1`。然而，有时从一个相对较大的值（如 `0.9`）开始然后逐渐减小是实用的。其点是在早期近似阶段更强烈地修改权重。之后，使用较小的值来对结果进行精细调整。\n\
  \n### 算法\n自组织特征图的一般原理总结在表 14.4 的伪代码中。首先，对所有示例进行归一化。\n\n表 14.4 自组织特征图的基本算法\n\n输入：一组无标签的示例、学习率\
  \ `alpha`、一组排列在矩阵中的随机初始神经元集。\n\n1. 将所有训练示例归一化为单位长度。\n2. 呈现一个训练示例，并找到其最近的编码向量 `cwinner`。\n\
  3. 使用公式 `wi = wi + alpha * (xi - wi)` 修改 `cwinner` 的权重以及 `cwinner` 邻域内编码向量的权重。之后，重新归一化权重向量。\n\
  4. 除非满足停止条件，否则呈现另一个训练示例，识别 `cwinner` 并重复上一步。\n\n注释：\n1. `alpha` 通常从 `[0; 1]` 中的一个相对高值开始，然后逐渐减小。\n\
  2. 偶尔会缩小邻域的大小。\n\n在算法的主体内，逐个呈现训练示例。在呈现示例 `x` 后，算法根据欧几里得距离识别出一个权重向量 `cwinner` 与 `x`\
  \ 最近的神经元。然后，使用公式(14.5) 修改 `cwinner` 以及其矩阵邻域中所有神经元的权重，然后重新归一化。算法通常运行预定义的轮数（epochs）。\n\
  \n在此过程中，学习率的值逐渐减小。偶尔，邻域的大小也会缩小。\n\n⁴记住一个 epoch 意味着所有训练示例都呈现了一次。\n\n### 你学了什么？\n\
