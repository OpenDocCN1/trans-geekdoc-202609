  \n––––––––\n\n![image](img/scene_break.png) \n\n### 计算机作业\n\n1. 假设分类器在测试集上的评估结果如表所示。第一列是标签（分别正例为“1”，负例为“0”），第二列是分类器建议的标签。编写一个程序计算精确率、召回率以及针对用户指定的\
