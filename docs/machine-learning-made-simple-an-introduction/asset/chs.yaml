  \n多层感知器中输出神经元的行为与线性分类器相似。因此，在类别非线性可分的领域，它的表现可能不佳。然而，在神经网络的背景下，这种局限性并不一定是致命的。问题在于，原始示例已经通过隐藏层中的\
  \ sigmoid 函数进行了转换。因此，输出层的神经元处理的是新的“属性”，即通过这种转换获得的属性。在训练过程中，这些转换后的示例（隐藏神经元的输出）可能会变得线性可分，使得输出层神经元可以轻松地区分两个类别。\n\
  \n### 表 5.4 逐步寻找隐藏层的良好尺寸\n\n![image](img/image309.png)\n\n1. 开始时，仅使用几个隐藏神经元，例如五个。\n\
  2. 训练网络，直到均方误差看起来不再提高。\n3. 此时，向隐藏层添加几个（例如，三个）神经元，每个神经元具有随机初始化的权重，并恢复训练。\n4. ![image](img/image309.png)\n\
  \n重复前两个步骤，直到满足终止条件。例如，当新添加的内容没有导致误差显著减少时，或者当隐藏层超过了用户设置的最大尺寸时。\n\n![image](img/image626.png)\
  \ `y1` `yK`\n`...`\noutput layer\n`1` `ϕ1`\n`^ϕ2` `...`\n`ϕm`\ngaussian functions\n\
  `x1` `x2`\n\n图 5.6 径向基函数网络\n\n––––––––\n\n![image](img/scene_break.png)\n\n### 替代方案\
  \ 有另一种转换属性值的方法；通过使用所谓的径向基函数 `RBR` 作为隐藏层神经元使用的传递函数。这就是图 5.6 所示网络的情况。输入的一个示例通过一组神经元，每个神经元都返回一个标记为\
  \ `j` 的值。\n\n![image](img/image602.png)\n\n径向基函数，RBF。本质上，这是基于我们在第 2 章中已经熟悉的正态分布。假设描述示例的属性都落入某个合理的区间内，例如\
  \ `[0; 1]`。对于给定的方差 `a²`，以下方程定义了以 `µj = [µj1; ... µjn]` 为中心的 n 维高斯曲面：\n\n```\nϕj(x)\
  \ = exp(-n(xi - µji)²2 / 2a²) (5.5)\n```\n\n![image](img/image554.png) `D1`\n![image](img/image112.png)\
  \ 在某种意义上，`ϕj(x)` 衡量了示例向量 `x` 与高斯中心 `µj` 之间的相似性。这些转换后的示例（隐藏神经元的输出）可能会变得线性可分，使得输出层神经元可以轻松地区分两个类别。\n\
  \n```\nyi = sum(j=1 to m) wji * ϕj(x)\n```\n\n输出层权重 输出层权重 `wij` 相对简单。由于只有一个层需要训练，我们可以完全依赖于第\
  \ 4 章描述的感知机学习。\n\n高斯中心 将高斯中心 `µj` 与单个训练示例等同是一种常见做法。如果训练集较小，我们可以简单地为每个示例使用一个隐藏神经元。但在许多实际应用中，训练集要大得多，这这意味着数千个隐藏神经元。考虑到如此大的网络难以管理，许多工程师倾向于仅选择训练示例的一个小子集作为中心。通常，随机选择就足够了。另一种可能性是识别相似向量的组，然后为每个\
  \ RBF 神经元使用该组的中心。\n\n计算成本 RBF 网络训练包含两个步骤。首先，选择径向基函数（高斯函数）的中心。其次，通过训练获取输出神经元的权重。由于只有一个层需要训练，该过程在计算上比多层感知器的训练要密集得多。\n\
  \n\n\n\n\n为了确保你理解了这一主题，请尝试回答以下问题。如果你有困难，请返回前文中对应的部分。\n\n- 解释径向基函数网络的原理。它与多层感知器在哪些方面有所不同？\n\
  - 径向基函数网络中需要训练多少权重？如何完成训练？\n- 构建高斯隐藏层有哪些可能性？\n\n# 5.7 总结与历史评述\n\n- 多层感知器的基本单元是`neuron`（神经元）。`neuron`\
  \ 接受输入的加权和，并对该和进行传递函数处理。可以使用几种不同的传递函数。本章中选定的是由以下等式定义的 `sigmoid` 函数，其中 `†` 是输入的加权和：\n\
  \n```\nf.† = 1 / (1 + e\\-†)\n```\n\n通常，所有神经元都使用相同的传递函数。\n\n- 本章描述的多层感知器的简单版本由一个输出层和一个隐藏层神经元组成。相邻层之间的神经元之间是全连接的；但同一层中的神经元之间没有连接。输入网络的示例通过前向传播到输出端，在原理上实现了以下函数：\n\
  \n```\nyi = f(.X w¹/)f(.X w²/)xk//\n```\n\n这里，`w^(.1/)` 和 `w^(.2/)` 分别是输出神经元隐藏神经元的权重，`f`\
  \ 是 `sigmoid` 函数。\n\n- 多层感知器的训练通过名为`误差反向传播`（backpropagation of error）的技术完成。对于每个训练示例，该技术首先建立每个神经元对网络整体误差的责任，然后根据这些责任更新权重。\n\
  \n以下是责任的计算方法：\n输出神经元：`ı(.1/) = yi.1 - yi`\n隐藏神经元：`ı(.2/) = hj.1 - hj/ P ı(.1/)wij`\n\
  \n以下是权重的更新方法：\n```\noutput layer: w^(.1/) = w^(.1/) + ı(.1/)hj\nhidden layer: w^(.2/)\
  \ = w^(.2/) + ı(.2/)xk\n```\n\n- 这里讨论了误差反向传播的某些方面。其中，最的是计算成本、局部极值的存在、自适应学习率以及如何确定隐藏层大小的问题。\n\
  \n- 另一种方案是径向基函数（`RBF`）网络。对于隐藏层神经元的传递函数，使用了 `gaussian` 函数。输出层神经元通常使用 `step function`（原理上是线性分类器），或者仅仅是输入的线性函数。\n\
  \n- 在 `RBF` 网络中，每个 `gaussian` 中心与一个训练示例对应。如果此类示例太多，可以进行随机选择。在这个简单集合中，`gaussian`的标准差被设置为\
  \ `a²`。\n\n- RBF 网络中的输出层神经元可以通过感知器学习进行训练。只需要训练一层权重。\n\n- 有时，支持向量机（`SVM`）的思想被应用于隐藏神经元的输出。所得工具随后被称为基于\
  \ RBF 的 SVM。\n\n### 历史评述\n神经网络的研究曾因 `Minsky` 和 `Papert` 提出的怀疑观点而受到著名的推迟。这些作者表达的悲观态度可能是\
  \ `Bryson` 和 `Ho` 的早期神经网络训练版本被很大程度上忽视的主要原因，`Werbos` 一次独立的成功尝试也很快遭遇了同样的命运。只有在 `Rumelhart`\
  \ 和 `McClelland` 出版具有里程碑意义的著作后（该算法被独立地重新发明），人工神经网络领域才成为一门受尊敬的科学学科。多层感知器的逐渐增长是由 `Ash`\
  \ 提出的。径向基函数的思想最早由 `Broomhead` 和 `Lowe` 在神经网络环境中提出。\n\n# 5.8 强化知识\n\n练习是为了巩固所学知识。建议的思想实验将帮助读者从不同角度观察本章的观点。计算机作业将强制读者注意他们可能会忽略的细节。\n\
  \n### 练习\n\n1. 回到表 5.3 中`误差反向传播`的插图。仅使用笔、纸和计算器，对一个不同的训练示例重复计算：`x = .-1; -1/; t.x/\
  \ = .0; 1/`。\n\n2. 手动模拟示例中的误差反向传播，对以下两种情况重复计算：\n高权重：`w^(.1/) = 3:0; w^(.1/) = -3:0;\
  \ w^(.1/) = 3:0`\n小权重：`w^(.1/) = 0:3; w^(.1/) = -0:3; w^(.1/) = 0:3`\n观察每种情况权重的相对变化。\n\
  \n3. 考虑一个包含 `10⁵` 个由 1000 个属性描述的训练集。训练一个具有 1000 个隐藏神经元和一个输出神经元的多层感知器的计算成本是多少？\n\n\
