  \ `ı^(.1/)`（第 i 个输出神经元的责任）都乘以连接第 i 个输出神经元到第 j 个隐藏神经元的连接权重。加权和乘以 `hj`，基本上与上一步的项相同，只是\
  \ `yi` 取代了它的位置。）\n\n### 权重更新\n\n现在我们知道了责任，准备好更新连接的权重了。与感知器学习类似，加法规则为：\n\n![image](img/image201.png)![image](img/image580.png)![image](img/image580.png)输出层神经元：`w^(.1/)\
