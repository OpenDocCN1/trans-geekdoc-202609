  \n### 历史备注\n\n多标签分类问题相对较。首次出现在文本分类领域——参见[57]。简单的方法二相关性（binary relevance）被 Boutell\
  \ 等人采用[7]。Read 等人[79]报告了分类链的成功应用，而 Goldpole 和 Sarawagi[32]则被认为开发了叠加方法。除了与二相关相关的方法外，一些作者研究了修改单标签模型的方法。多标签领域的近邻分类器思想借鉴自\
  \ Zhang 和 Zhou[101]（他们的技术比本章描述的复杂得多）。层次有序类的归纳首先由 Koller 和 Sahami[47]解决。多标签决策树由 Clare\
  \ 和 King[15]开发。\n\n| ![image](img/chapter_title_corner_decoration_left.png)  ||\
