  \ `[-1; 1]` 间范围内。\n\n## 神经元\n\n多层感知器基本单元——神经元的函数非常简单。输入端信号的加权和将通过一个传递函数。可以使用多种不同的传递函数；本章首选的是所谓的\
  \ sigmoid 函数，它由如下公式定义，其中 `†` 是输入的加权和：\n\n![image](img/image112.png)![image](img/image213.png)\n\
  ```\nf(†) = 1 / (1 + e-†)\n```\n(5.1)\n\n图 5.1 一种常用的传递函数：sigmoid\n\n```\nf(Σwix\
  \ i)\n```\n\n![image](img/image548.png)![image](img/image326.png)y1 yn\n...\n...\n\
  ————\n![image](img/scene_break.png)\n输出信号\n输出神经元\n————\n![image](img/scene_break.png)\n\
  隐藏神经元\n————\nx1 x2 x3\n输入信号\nx4\n图 5.2 一个由两个互连层构成的神经网络示例\n\n————\n\n![image](img/scene_break.png)图\
  \ 5.1 显示了代表传递函数的曲线。读者可以发现，`f(†)` 随着 `†` 值的增加而单调增长，但注定永远离开开区间 `(0; 1)`，因为 `f(-)=0`\
  \ 且 `f(+)=1`。纵轴在 `f(0)=0.5` 处与曲线相交。我们将假设每个神经元具有相同的传递函数。\n\n### 多层感知器\n\n图 5.2 中的神经网络被称为多层感知器。用椭圆表示的神经元排列在输出层和隐藏层¹。为了简单起见，我们只考虑具有单个隐藏层的网络，但要记住，使用两层甚至三层这样的层是非常常见的，尽管很少超过此数量。另一种简化是由于省略了零阶权重（为每个神经元提供可训练的偏置），以免使图像过于复杂。\n\
  \n![image](img/image605.png)\n\n¹当我们从上方观察网络时，隐藏层被输出层遮挡。\n\n### 1. 作为分类器的多层感知器\n\n\
  ![image](img/image580.png)虽然同一层的神经元之间没有通信，但相邻层之间是全连接的。重要的是，每个神经元到神经元之间的连接都关联有一个权重。从第\
  \ `j` 个隐藏神经元到第 `i` 个输出神经元的连接权重为 `w(.1/)`，从第 `k` 个属性![image](img/image172.png)到第\
  \ `j` 个隐藏神经元的连接权重为 `w(.2/)`。注意，第一个索引始终指向连接的“起点”，第二个索引指向其“终点”。\n\n![image](img/image112.png)\n\
  \n### 前向传播\n\n当我们向网络输入一个示例 `x.x1;:::; xn/` 时，其属性值将沿着连接传递给神经元。值 `xk` 与连接关联的权重相乘，第\
  \ `j` 个隐藏神经元接收到的输入为加权和 `Pk w xk`，并将和通过 sigmoid 函数![image](img/image172.png).2/`f(Pk\
  \ w xk)`。然后，第 `i` 个输出神经元接收来自隐藏神经元的加权和![image](img/image172.png).2/![image](img/image112.png)，并再次通过传递函数。这就是获取第\
  \ `i` 个输出的方法。\n\n这种将属性值从网络输入传播到输出的过程被称为前向传播。每个类都分配有一个自己的输出神经元，第 `i` 个输出神经元返回的值解释为支持第\
  \ `i` 类的证据量。例如，如果三个输出神经元得到的值为 `y.0:2; 0:6; 0:1/`，分类器将给给定示例标记为第二类，因为 `0.6` 大于 `0.2`\
  \ 和 `0.1`。\n\n从本质上，这种双层感知器计算以下公式，其中 `f` 是神经元使用的 sigmoid 传递函数（见公式 (5.1)）；`w(.2/)`\
  \ 和 `w(.1/)` 分别是通往隐藏层和输出层的连接，`kj` 是所给示例的属性值：\n\n![image](img/image172.png)![image](img/image580.png)\n\
  ```\nyi = f(X w(.1/))f(X w(.2/)xk)\n```\n(5.2)\n\n![image](img/image489.png)\n\n\
  ### 数值示例\n\n表 5.1 中的数值示例说明了前向传播的原理。开始时给出 `x`。在到达隐藏层之前，属性值与权重相乘，加权和传递给函数。然后，结果 `h1`\
  \ 和 `h2` 与下一层权重相乘，并转发到输出神经元，在那里再次经过函数处理。这就是得到 `y1=0.66` 和 `y2=0.45` 的过程。支持“左侧”输出的证据高于支持“右侧”输出的证据。因此，分类器选择了左类。\n\
  \n数学家已经证明，通过选择合适的权重和数量的隐藏神经元，可以近似任何现实函数。这种现象被称为通用性，意味着多层感知器在原理上可以解决任何问题。\n\n表 5.1\
  \ 多层感知器前向传播示例 own![image](img/image229.png)\n\n### 通用性\n\n然而，定理告诉我们我们需要多少个隐藏神经元，以及每个权重值应该是多少。也就是说，我们知道解存在，但不能保证我们一定能找到它。\n\
  \n1. 神经网络的误差 95\n\n## 所学知识\n\n\n\n\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \  ||  || ![image](img/chapter_title_corner_decoration_right.png)  |\n\n| --- |\
  \ --- | --- |\n\n![image](img/chapter_title_above.png) \n\n## 5.2 神经网络的误差\n\n![image](img/chapter_title_below.png)\
  \ \n\n我们将训练多层感知机（即寻找其权重）的技术解释推迟到后后的章节。在解决这个问题之前，有必要通过仔细观察分类方法以及评估这种分类准确率的方法来做好准备工作。\n\
  \n![image](img/image112.png)![image](img/image341.png)\n\n### 错误率\n\n假设一个已知类别为 `c.x/`\
  \ 的训练样本 `x` 被输入到一个现有版本的多层感知机。前向传播步骤确定了标签 `h.x/`。如果 `h.x/ != c.x/`，则发生了错误。这种情况也可能发生在其他样本上，我们想知道这种情况发生的频率。我们想知道错误率——即对于给定的样本集，通过错误数量除以样本数量得到的比例。例如，如果分类器误分类了\
  \ 200 个样本中的 30 个，则错误率为 `30/200 = 0.15`。\n\n然而，这无法提供网络分类性能的完整视图。错误率未能反映的是 sigmoid\
  \ 函数衡量每个误差大小的能力。\n\n![image](img/image133.png)![image](img/image141.png)![image](img/image112.png)\n\
  \n一个例子将阐明这一点。假设我们有两个不同的网络可以选择，每个网络都有三个输出神经元，分别对应标记为 `C1`；`C2` 和 `C3` 的类别。假设对于某个样本\
  \ `x`，第一个网络的输出为 `y1.x/ = <0.5; 0.2; 0.9/`，第二个网络的输出为 `y2.x/ = <0.6; 0.6; 0.7/`。这意味着两者都会将\
  \ `x` 标记为第三类，`h1.x/ = h2.x/ = C3`。如果正确答案是 `c.x/ = C2`，那么两个都错了，但这种误差看起来并不相同。读者会注意到，第一个网络对类别为\
  \ `C3` “非常确定”（因为 `0.9` 明显大于另外两个输出 `0.5` 和 `0.2`），而第二个网络的确定性较低，其输出值的差异（`0.6`、`0.6`\
  \ 和 `0.7`）非常小，以至于人们怀疑 `C3` 仅仅是靠运气获胜的。由于对错误类别的承诺程度较弱，第二个网络在某种程度上比第一个网络错得更少。\n\n这种情况可以通过更合适的误差函数——均方误差（MSE）来捕捉。\n\
  \n![image](img/image112.png)![image](img/image112.png)![image](img/image724.png)\n\
  \n### 目标向量\n\n在继续定义均方误差之前，我们必须引入另一个重要概念：目标向量，它同样依赖于具体的样本 `x`。我们将其记为 `t.x/`。在具有 `m`\
  \ 个类别的领域中，目标向量 `t.x/ = <t1.x/; ...; tm.x/` 包含 `m` 个二进制。如果样本属于第 `i` 类，则 `ti.x/ =\
  \ 1`，且该向量中的所有其他元素均为 `tj.x/ = 0`（其中 `j != i`）。例如，假设存在三个不同的类别 `C1`；`C2` 和 `C3`，已知\
  \ `x` 属于 `C2`。在理想情况下，第二个神经元应该输出 `1`，另外两个神经元应该输出 `0`。因此，目标是 `t.x/ = <t1; t2; t3>\
  \ = <0; 1; 0>`。\n\n### 均方误差\n\n均方误差通过输出向量元素与目标向量元素之间的差异定义：\n\n![image](img/image201.png)![image](img/image201.png)![image](img/image380.png)![image](img/image357.png)\n\
  \n```\nMSE = 1/N Σ (ti - yi)²  (5.3)\n```\n\n![image](img/image457.png)\n\n在计算网络的\
  \ `MSE` 时，我们必须为每个输出神经元建立其输出与目标向量对应元素之间的差异。注意括号中的项 `(ti - yi)` 被平方了，以确保负差异不会从正差异中被减去。\n\
  \n回到上面提到的两个网络的例子，如果目标向量是 `t.x/ = <0; 1; 0/`，那么这些就是均方误差：\n\n![image](img/image515.png)\n\
  \n```\nMSE1 = 1/3 (0.5-0)² + (0.2-1)² + (0.9-0)² = 0.46\nMSE2 = 1/3 (0.6-0)² + (0.6-1)²\
  \ + (0.7-0)² = 0.30\n```\n\n## 5.3 误差的反向传播\n\n在多层感知机中，影响网络行为的参数是集 `w¹` 和 `w²`。机器学习的任务是找到这些能够优化网络分类性能的权重。这是通过训练实现的。\n\
  \n### 一般场景\n\n原则上，该程序与上一章相同。开始时，权重初始化为随机数，通常来自区间 .0;1/。之后，逐个展示训练样本，每个样本都前向传播到网络输出。该输出与样本目标向量之间的差异告诉我们如何修改权重（见下文）。修改权重后，展示下一个样本。当到达最后一个样本时，一个轮次（epoch）就完成了。\n\
  \n### 梯度下降\n\n在继续权重调整的具体公式之前，我们需要对问题的本质有更好的理解。图 5.3 将帮助我们。垂直轴表示均方误差，它是关于网络权重的函数（沿水平轴绘制）。\n\
  \n\n\n\n\n快速观察图 5.3 即可发现，对于给定的训练样本，任何权重对都会在景观图上定义一个具体的位置，通常位于某一个斜坡上。任何权重的变化都将导致水平轴上坐标的不同，从而导致在误差函数上产生不同的位置。这个新位置具体在何处，是在斜坡的“向上”还是“向下”，取决于每个权重的变化程度和方向。例如，将\
  \ `w1` 和 `w2` 同时增加 `0.1` 可能只会导致均方误差的微小减少；而将 `w1` 增加 `0.3` 并将 `w2` 增加 `0.1` 则会显著地减少该误差。\n\
  \n![image](img/image308.png)\n\n图 5.3 对于给定的示例，每组权重都意味着特定的均方误差。训练应该尽可能快地减少这种误差。\n\
  \n––––––––\n\n![image](img/scene_break.png)\n\n### 误差反传播\n\n在本文讨论的技术中，我们希望权重的变化能够沿着误差函数实现最陡峭的下降。回想第\
  \ 1 章中的术语，这是爬山搜索的任务。在多层感知器中，用于此目的已知技术是误差反传播。\n\n具体的权重调整公式可以通过寻找函数的梯度从 `Eq. (5.2)`\
  \ 推导出来。然而，由于本书是面向从业者而非数学学家的，我们将跳过推导过程，转而关注解释学习过程的行为。\n\n首先，假设单个神经元对整体误差的贡献是不同的。其中某些神经元比其他神经元更“破坏局面”。如果是这样的话，读者会同意，通往这些神经元的连接应该比通往那些影响较小神经元的连接经历更大程度的权重变化。\n\
  \n幸运的是，每个神经元对整体误差的“责任”程度可以很容易获得。通常来说，具体的公式取决于使用了哪种传递函数。在 sigmoid 的情况下（见 `Eq. (5.1)`），责任的计算方式如下：\n\
  \n![image](img/image657.png)![image](img/image201.png)输出层神经元：`ı^(.1/) yi.1 yi/.ti\
  \ yi/`\n\n![image](img/image602.png)![image](img/image602.png)![image](img/image672.png)![image](img/image201.png)![image](img/image112.png)这里，`.ti\
