  \ D P.xjneg/`\n\n`2/5 + 2/5 + 2/5 = 2/5`\n\n由于 `P.xjpos/ < P.xjneg/`，我们将 `x` 标记为负类。\n\
  \n### 使用朴素贝叶斯原理进行分类\n\n![image](img/image731.png) 待分类示例描述为 `x = {x1,...,xn}`。\n\n\
  ![image](img/image085.png)\n\n1. 对于每个 `xi`，以及每个类 `cj`，计算条件概率 `P.xi cj`，即 `xi` 在属于\
  \ `cj` 的训练样本中的相对频率。\n2. 对于每个类 `cj`，执行以下两个步骤：\n    i) 估计 `P.cj` 为该类在训练集中相对频率；\n \
  \   ![image](img/image085.png)\n    ii) 使用属性相互独立的“朴素”假设，计算条件概率 `P.x cj/`：\n    ![image](img/image393.png)`P.x\
  \ cj/ = Π P.xi cj/`\n    ![image](img/image612.png)\n3. 选择 `P.cj/ • Π P.xij/` 值最大的类。\n\
  \n![image](img/image594.png)\n\n––––––––\n\n![image](img/scene_break.png) \n\n![image](img/image112.png)\
  \ 尽管，这种估计只有在大量观测的支持下才是可靠的。硬币投掷四次出现三次正面可能的，但草率地将其解释为 `P.heads = 0.75`。物理学认为硬币应该出现\
  \ 50% 的正面。这种先验期望能帮助我们在观测不足的情况下改进概率估计吗？答案是：“可以，我们可以使用 m 估计。”\n\n![image](img/image112.png)\n\
  \n### m 估计的本质\n\n让我们通过一个某面出现更频繁的不均匀硬币来解释这一原理。在没有更好引导的情况下，正面的先验期望为 `nheads = 0.5`。辅助参数\
  \ `m` 帮助工程师告诉分类程序他对该值（先验期望）有多大的信心（`m` 信心越高）。让我们用 `Nall` 表示硬币投掷的次数，用 `Nheads` 表示正面的次数。将这些值与先验期望和信心结合的方法由公式总结：\n\
  \n```\nPheads = (Nheads + m*nheads) / (Nall + m)\n```\n\n![image](img/image112.png)\
  \ \n\n––––––––\n\n![image](img/scene_break.png) \n\n(2.7)\n\n![image](img/image112.png)![image](img/image112.png)\
  \ 注意，如果 `Nall = 0`，公式将退化为先验期望 `nheads`。相反，如果 `Nall` 和 `Nheads` 足够大使得 `m*nheads`\
  \ 和 `m` 可以忽略，它将收敛于相对频率。使用值 `nheads = 0.5` 和 `m = 2`，我们得到：\n\n```\nP = (Nheads +\
  \ 2*0.5) / (Nall + 2) = (Nheads + 1) / (Nall + 2)\n```\n\n#### 说明概率估计表 2.4 显示了这些计算值如何在五次实验中演变。读者可以看到，对于少量实验，m\
  \ 估计比相对频率更符合常识。表 2.4 对于每次连续实验，第二行给出观测结果；第三行给出正面相对频率；最后给出概率的 m 估计，假设 `nheads = 0.5`\
  \ 且 `m = 2`\n\n| 投掷次数 | 1 | 2 | 3 | 4 | 5 |\n| :--- | :--- | :--- | :--- | :---\
  \ | :--- |\n| 结果 | | | | | |\n| 相对频率 | | | | | |\n| m 估计 | | | | | |\n\n#### 用户信心的影响\n\
  \n让我们仔细观察 `m`（用户信心）的影响。对比两种不同的设置：`m = 100` 和 `m = 1`（两种情况下 `nheads = 0.5`），就能发现很多问题。\n\
  \n```\nNheads = 50\nNall = 100\n```\n\n```\nNheads = 50\nNall = 100\n\n![image](img/image112.png)\
  \ `m = 100` 的版本只有在有足够依据的情况下才修改先验估计。相比之下，`m = 1` 的版本允许通过几次实验反对用户的意见。\n\n### 多结果领域\n\
  \n尽管我们使用了双结果领域，该公式也适用于多结果领域。掷骰可以产生六种结果，我们预计看到三点的概率为 `nthree = 1/6`。使用 `m = 6`，我们得到：\n\
  \n```\nPthree = (Nthree + 6*1/6) / (Nall + 6) = (Nthree + 1) / (Nall + 6)\n```\n\
  \n![image](img/image120.png)![image](img/image734.png)![image](img/image291.png)\
  \ 再次，如果 `Nall` 足够高，`m 6` 和 `nthree` 可以被忽略。\n\n### m 估计的局限性\n\n我们不应忘记 m 估计的好坏取决于它所依赖的参数。如果我们从不现实的先验估计开始，结果可能会令人失望。假设\
  \ `nheads = 0.9` 且 `m = 10`。方程 (2.7) 则变为：\n\n```\nPheads = (Nheads + 10*0.9) / (Nall\
  \ + 10)\n```\n\n![image](img/image408.png) 当我们使用此公式重新计算表 2.4 中的值时，我们会发现 ![image](img/image387.png)五次实验后，概率估计为\
  \ `P = (3C9)`，这显然比在 `5C10`¹² 情况下得到的 0.8 更不合理，![image](img/image073.png)![image](img/image505.png)![image](img/image112.png)![image](img/image112.png)D\
  \ 我们得到了 Pheads 0.57。鼓励读者验证，如果我们减小 m，情况会有所改善。\n\n\n\n\n\n![image](img/image717.png)\n\
  \n### 数学严谨性\n\n让我们最后做一点说明。数学中的一个常见理解是所有可能事件的概率之和为 1：如果一个实验可以有 `N` 种不同的结果，如果 `Pi`\
  \ 是第 `i` 个结果的概率，那么 $\\sum_{i=1}^{N} Pi = 1$。很容易验证，`Eq. (2.7)` 对于任何 `m` 的值都满足这一条件。假设我们正在处理硬币抛掷领域，那里只有两种可能的结果。如果先验估计之和为\
  \ 1（`nheads + ntails = 1`），那么在给定 `Nheads + Ntails = Nall` 的情况下，我们推导出如下：\n\n```\n\
  Pheads + Ptails = (Nheads+cmheads)(Ntails+cmnt) / (Nall+Cm)\n```\n![image](img/image355.png)\
  \ = NheadsCNtailsCm.nheadsCntails/ allC m\n\n感兴趣的读者可以轻松将其推广到任何有限数量的类别。\n\n### 为什么这可能有用\n\
  \n在表 2.5 提出的问题中，我们想要使用贝叶斯分类器对示例 `x` 进行分类。为了做到，我们首先需要计算所需的条件概率。然而，当我们对正类尝试时，发现由于训练集很小，没有任何示例包含\
  \ `crust-shade=gray`（这是 `x` 中观察到的值）。如果概率是通过相对频率估计的，那么这个具体的条件概率将是：\n\n![image](img/image695.png)\
  \ 0。结果是，`P(x|pos) = 0`，无论其他概率如何。这看起来并不对。\n\n如果我们使用 `m-estimate` 代替相对频率，问题就消失了，因为即使具体的值从未在训练集中被观察到，`m-estimate`\
  \ 也是非零的。\n\n––––––––\n\n![image](img/scene_break.png)\n\n### 你学了什么？\n\n为了确保你理解了该主题，请尝试回答以下问题。如有需要，请返回文本相应位置。\n\
