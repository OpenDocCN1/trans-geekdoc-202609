  \n## 10.6 杂记\n一些值得了解的问题在介绍性书中没有单独章节，但不能被忽视。让我们在这里简要总结它们。\n\n### 数据缺乏规律性\n假设你被要求从随机数生成器创建的训练示例归纳分类器；所有属性值都是随机的，类别标签也是如此。显然，这种数据中没有规律性——然而——机器学习技术通常能够从中归纳出一个在训练集错误率为零的分类器。当然，这种在训练集上的完美行为不会转化为未来示例上的类似行为。\n\
  \n\n\n\n\n## 在某些领域中可以线性排序的类\n\n在某些领域中，每个示例都被标记为若干（可能甚至是许多）类别中的一个。在这种语境下，我们必须提到一种特殊情况，即不同的类别标签是可以排序的。例如，假设输出类别为\
  \ `month`（月份），值从 `january` 到 `december`。在此类领域中，假设将 `june` 误分类为 `may` 与将 `june` 误分类为\
  \ `december` 是一样的，将是一个极大（且具有误导性的）简化。\n\n不仅在性能评估中，在归纳此类类别的过程中，也应该关注单个类别的排序。一种可能性是从对相邻类别标签进行分组开始；只有在为每个组归纳出分类器后，我们才考虑在组内进行微调的可能性。\n\
  \n在 `month` 类的情况下，我们可能先为 `seasons`（季节）归纳分类器，每个季节包含 3 个月月，然后再为每个月单独归纳分类器。\n\n###\
  \ 回归\n\n在某些应用中，预期输出不是离散值类别，而是连续范围内的一个数字。例如，当软件需要预测股票指数值时，情况可能如此。这类问题被称为回归。在书中我们不讨论这些问题。在机器学习框架内处理这些问题最简单的方法是将连续体替换为子区间，然后将每个子区间视为一个独立的类别。注意，该任务将属于上一节中提到的“可以线性排序的类”范畴。\n\
