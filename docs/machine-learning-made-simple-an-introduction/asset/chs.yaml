  \ | --- |\n\n![image](img/chapter_title_above.png) \n\n# 15.5 总结与历史备注\n\n![image](img/chapter_title_below.png)\
  \ \n\n* 一些分类器具有规则的形式。规则由前件（合取条件的列表）和后件（类别标签）组成。如果规则的前件对于给定的示例是真的，那么该示例将被标记为所指向的标签。15.6\
  \ 巩固知识\n\n\n\n\n# 遗传算法\n\n机器学习的本质是我们的问题寻找最佳解决方案：找到一个分类器，它不仅能尽可能正确地分类训练示例，还能对未来的示例进行正确分类。第一章解释了最流行的基于\
  \ AI 的搜索技术之一——所谓的“爬山算法”的原理，并展示了如何将其用于分类器的归纳。\n\n还有另一种搜索方法：`遗传算法`，其灵感源于达尔文进化论的原理。读者有必要熟悉它，因为该技术在处理各种机器学习问题时非常有用。本章将介绍基准版本，然后通过\
  \ `k-NN` 分类器领域的某些典型问题来阐明其用法。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
