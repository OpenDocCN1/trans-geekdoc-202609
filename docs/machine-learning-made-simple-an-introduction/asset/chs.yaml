  \n| ![image](img/chapter_title_corner_decoration_left.png)  ||  || ![image](img/chapter_title_corner_decoration_right.png)\
  \  |\n| --- | --- | --- |\n\n![image](img/chapter_title_above.png) 14.8 总结与历史评述\n\
  \n![image](img/chapter_title_below.png) \n\n- 在某些机器学习任务中，我们需要处理没有标签的示例。尽管如此，可以通过无监督学习从它们提取有用的知识。\n\
  - 无监督学习中最简单的任务是聚类分析。其目标是将相似的示例分组。每个示例与其所属组的示例比任何其他组的示例都相似。\n- 无监督学习最简单的聚类技术被称为 `k-means`。一旦创建了初始聚类，算法接受一个示例，并计算与其所在簇质心的距离与其他簇质心的距离。如果示例发现自己在错误的簇中，它会被转移到一个更好的簇。该技术在有限步内收敛。\n\
  - `k-means` 发现的聚类质量对初始化以及用户指定的 `k` 值敏感。为了提高这种质量，有时必须考虑后续的合并和分裂。`k-means` 的层次实现是有用的。\n\
  - 在某些领域，数据簇的形状使得 `k-means` 无法找到它们。例如，图 14.4 所示的训练集。在这种情况下，工程师可能会倾向于其他聚类技术，例如自底向上合并距离最小的簇。\n\
  - 在层次聚类的情况下，通过质心来识别两个簇之间的距离是不行的。相反，我们使用 `x,y` 之间的距离，其中 `x` 属于一个簇 `y` 属于另一个。\n- `k-means`\
  \ 算法面临的问题之一是如何定义初始代码向量。解决这个问题的方法之一是自组织特征图技术。\n- 此外，自组织特征图可以将高维特征空间转换为两个属性。它们也可以用于数据可视化的。\n\
  \n历史评述 聚类问题自 20 世纪 60 年代以来一直在研究。k-means 算法由 McQueen \\[58\\] 描述，层次聚类由 Murty 和 Krishna\
  \ \\[71]。合并和分裂簇（不一定通过 `k-means` 获取）的想法由 Ball 和 Hall \\[2\\] 研究。`SOFM` 技术，自组织特征图由\
  \ Kohonen \\[45\\] 开发。然而，在本书中，只介绍了了该技术的非常简单的版本。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
