  \ | --- |\n\n![image](img/chapter_title_above.png) \n\n# 13.5 关于层次化类的说明\n\n![image](img/chapter_title_below.png)\
  \ \n\n在某些领域中，已知的类依赖关系比我们目前考虑的情况更为复杂。在这种情况下，我们的机器学习技术必须相应地进行修改。\n\n图 13.3 显示了类层次结构的一部分，这可能是由为机器学习准备数据的专家建议的。图中的每个节点代表一个类。\n\
  \n该领域涉及文本文档的分类。该层次结构的解释方式类似于决策树。首先，某些文档可能属于`machine learning`（机器学习）类。从相应节点发出的实线表示“是”，虚线表示“否”。在那些属于机器学习的文档中，有些处理`decision\
  \ tree`（决策树）主题，另一些处理`k-NN`分类器，以此类推（为了简单起见，这里省略了大多数子类）。\n\n1. 关于层次化类的说明 261\n\n![image](img/image687.png)\n\
  \n图 13.3 有时，类是以工程师预先知的层次方式进行组织的\n\n––––––––\n\n![image](img/scene_break.png) \n\n\
  在图中，关系由从父节点指向子节点的箭头表示。一个节点可以有多个父节点，但定义良好的类层次结构必须避免循环。此类此类关系的数据结构被称为有向无环图（directed\
  \ acyclic graph）。在某些应用中，每个节点（根节点除外）只有一个父节点。这种更严格的结构被称为泛化树（generalization tree）。\n\
  \n### 这类领域的归纳\n\n层次化类的归纳组织方式与二元相关性相似。对于每个节点，构建相应的训练集，并从该训练集中基准学习器归纳出一个分类器。通过这种方式，最常用的方法按自上而下的方式进行，父类的输出指导子类归纳时示例的选择。\n\
  \n以下是在类按泛化树组织的领域中执行此操作的方法。首先，使用整个原始训练集来归纳位于树根的类。接下来，将训练集分为两部分：一部分包含属于根类的训练示例，另一部分包含不属于该类的训练示例。然后，仅从相关的训练集归纳较低的类。\n\
  \n### 具体示例\n\n在图 13.3 所示的问题中，第一步是为`machine learning`类归纳一个分类器。假设原始训练集由表 13.2 所示的七个示例组成。然后使用这些示例的标签来决定将哪些示例包含在归纳子类的训练集中。例如，注意，只有`machine\
  \ learning`的正例被包含在`decision trees`和`k-NN`分类器的训练集中。相反，只有`machine learning`的负例被包含在归纳`programming`（编程）的训练集中。\n\
  \n### 需注意的两个主要困难\n\n归纳过程并没有看起来那么简单。使任务复杂的第一个问题再次是误差传播现象。假设一个示例代表来自电路分析领域的文本文档。\n\
  \n表 13.2 具有层次化类的领域的领域说明\n\n![image](img/image283.png)\n\n––––––––\n\n![image](img/scene_break.png)\
  \ \n\n|  || Machine learning |\n| --- | --- |\n| ex1 || pos |\n| ex2 || pos |\n\
  | ex3 || pos |\n| ex4 || pos |\n| ex5 || neg |\n| ex6 || neg |\n| ex7 || neg |\n\
  \n![image](img/image732.png)\n![image](img/image544.png)\n![image](img/image391.png)\n\
  ![image](img/image283.png)\n\n––––––––\n\n![image](img/scene_break.png) \n\n在某些较低的类中，训练集仅包含父分类器返回`pos`的训练示例；在另一些类中，仅包含父分类器返回`neg`的示例\n\
  \n––––––––\n\n![image](img/scene_break.png) \n\n如果此示例被错误归类为属于`machine-learning`，分类器在这些信息的误导下将其传递给下一个分类器（如决策树），从而将误差向下传播。\n\
  \n另一个复杂问题是，层次结构中每个节点相关的训练集总是不平衡的。再次，必须采取适当措施——通常是欠采样或过采样。\n\n### 类层次结构来自哪里？\n\n\
  在某些应用中，完整的类层次结构从一开始可用，由具有相关领域背景的客户手动创建。这是某些著名的文本分类应用的情况。\n\n然而，需要谨慎。客户并非无一失，他们开发的层次结构经常遗漏重要细节。可能会出现我们在讨论分类链时遇到的问题。在某些领域，层次结构部分是未知的。在这种情况下，工程师必须找到将这种部分知识纳入之前讨论的二元相关框架的方法。\n\
  \n––––––––\n\n![image](img/scene_break.png) \n\n![image](img/image605.png)\n\n²读者注意到这个问题与我们在讨论分类链时遇到的问题相似。\n\
  \n1. 合并类 263\n\n## 你学了什么？\n\n为了确保你理解了该主题，请尝试回答以下问题。如有需要，请返回文中适当的位置。\n\n• 举一个各个类具有层次结构的领域示例。\n\
  \n• 解释归纳层次化分类器的训练集划分原则。\n\n• 在归纳层次化类时最常遇到的困难是什么？\n\n# 13.6 合并类\n\n如果类很少，情况会更简单。例如，在具有三个类的领域中，所有类-标签组合的数量不超过七个，假设每个示例至少被标记了一个类。\n\
  \n\n\n\n\n### 创建新的训练集\n\n在此类领域中，一个足够大的训练集可能包含每个类别组合的足够代表性，这使得将每个此类组合视为一个独立的类别是合理的。通用方法与我们已经看到的那些相似：从原始训练集\
  \ `T` 中创建新的训练集 `Ti`，并从每个训练集中通过基准学习器（baseline learner）导出分类器。然而，请不要忘记，在类聚合中，每个 `Ti`\
  \ 代表一种类别标签的组合，例如 `C2` AND `C4`。\n\n当将来需要对某个示例 `x` 进行分类时，它会被并行提交给所有这些分类器。\n\n###\
  \ 原理说明\n\n该原理如表 13.3 所示。在这里，原始训练集 `T` 中的类别总数为三个。从理论上讲，类别组合的总数应该是七种。在现实中，`T` 中只遇到了这些组合中的五种，因为没有示例被仅标记为\
  \ `C3`，也没有示例被同时标记为所有三个类别。因此，我们创建了五个表，每个表定义了一个类别组合的训练集。注意，这种方法仅处理在原始训练集中发现的类别组合。例如，未来的任何示例都不会被标记为仅属于\
  \ `C3`。这可能被视为一种局限性，工程师必须在具体应用中找到解决此的方法。\n\n### 分类\n\n程序员不能忘记指定，当这些“聚合”分类器中多于一个返回\
  \ 1 时，具体应该做什么。在某些机器学习范式中（例如贝叶斯分类器），这很容易，因为分类器能够量化它们对类别的置信度。\n\n表 13.3 在类别标签组合数量适中的领域中，通常可以将每个组合视为一个独立的类别\n\
  \n![image](img/image549.png)\n\n![image](img/scene_break.png) \n\n| | 类别 |\n| ---\
  \ | --- |\n| ex1 | C1, C2 |\n| ex2 | C2 |\n| ex3 | C1, C3 |\n| ex4 | C2, C3 |\n\
  | ex5 | C1 |\n\n![image](img/image108.png)\n![image](img/image274.png)\n![image](img/image247.png)\n\
  ![image](img/image217.png)\n![image](img/image027.png)\n![image](img/image549.png)\n\
  \n如果两个或多个分类器返回 1，主分类器只需选择置信度最高的一个。\n\n对于那些只返回 1 或 0 而不提供任何关于给定决策置信度信息的分类器，选择会变得复杂。原则上，可以考虑合并类别集合。例如，假设对于某个示例\
  \ `x`，两个分类器返回 1，其中一个分类器与类别 `C1; C3`, `C4` 关联，另一个与类别 `C3` 和 `C5` 关联。在这种情况下，`x` 将被标记为\
  \ `C1; C3; C4, 和 C5`。\n\n但注意，这很容易导致 `x` 被标记为“太多”类别。读者已经知道这可能会导致许多假阳性，从而导致精确率较低。\n\
  \n### 聚合的替代方法\n\n在表 13.3 所示的方法中，最左侧的表（以 `C1` 开头的）只包含一个正标签，因为在 `T` 中只有一个示例仅被标记为该类别。如果我们想避免处理如此极端不平衡的训练集，我们需要一种“技巧”来改进\
  \ `Ti` 中的类别表示。\n\n这是其中一种可能性。在 `Ti` 中，我们将每个原始 `T` 中类别标签集包含 `C1` 的示例都标记为 1。通过这样做，我们不能忘记\
  \ `ex1` 因此在以 `(C1 AND C2)` 开头的表中也会被标记为正例。\n\n同样，我们将对给定训练集中发现的类别集合的所有子集都标记为 1。例如，如果一个示例被标记为\
  \ `C1`、`C3` 和 `C4`，我们将在所有代表 `{C1, C3, C4}` 非空子集的训练集中将其标记为 1。当然，这只改进了训练集。\n\n###\
  \ 某些批评\n\n类聚合在类别组合罕见时可能会失效。在类别数量较多的领域，类聚合不是一个好主意，因为某些组合不会出现。\n\n\n\n\n![image](img/image457.png)Re^µ\
