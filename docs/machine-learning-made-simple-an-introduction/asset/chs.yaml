  \n# 17.4 总结与历史说明\n\n![image](img/chapter_title_below.png)\n\n- 与前面章节中的分类问题不同，强化学习假设智能体通过对其试图控制的系统进行直接实验来学习。\n\
  - 在 `多臂老虎机`（N-armed bandit）的高度简化的形式中，智能体寻求识别最有前景的动作——提供最高平均回报的动作。最简单的实际实现依赖于所谓的\
  \ `E-greedy` 策略。\n- 更现实的任务实现假设存在一个状态集。对于每个状态，智能体需要从一组备动作中进行选择。这种选择可以通过 `E-greedy`\
  \ 策略实现，该策略依赖于状态动作对的质量 `Q(s, a)`。\n- 将奖励分配给状态-动作对的问题可以通过其阶段性表述、连续表述或带折扣的阶段性表述来解决。\n\
  - 在强化学习较高级的方法中，本章简要提到了 `SARSA` 方法。\n\n### 历史说明\nBellman [3] 提供了“老虎机”问题最早的系统性处理之一，而他反过来是在更早的工作基础上构建的。重要的是，同一位作者后来开发了动态规划原理，这可以被认为是强化学习的直接先驱\
  \ [4]。强化学习的基本原理的发展可能归功于 Sutton [7]。\n\n| --- | --- | --- |\n![image](img/chapter_title_above.png)\n\
  \n# 17.5 巩固你的知识\n\n![image](img/chapter_title_below.png)\n\n练习是为了巩固所学知识。建议的思维实验将帮助读者以不同的角度看待本章的观点，并引发独立思考。计算机作业将迫使读者注意他们原本可能会忽略的看似微不足道的细节。\n\
