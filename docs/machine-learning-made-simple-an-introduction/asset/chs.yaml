  \ --- | --- |\n\n![image](img/chapter_title_above.png)\n\n## 8.7 总结与历史注释\n\n![image](img/chapter_title_below.png)\n\
  \n* 可用于学习的示例数量取决于具体的应用程序。在某些领域，示例是丰富的；例如，如果它们可以从数据库中自动提取。在其他一些领域，它们可能是稀缺且昂贵的，正如油溢领域的情况那样。\n\
  * 我们可能完全不知道哪些属性是重要的。在油溢领域的情况中，形状和其他特征可以通过无限数量的属性来描述。\n* 在某些领域，重要的属性是未知的或无法以合理的成本获得。不可避免地，归纳必须使用这些属性，即使这会降低分类器的性能。\n\
  * 在脑机接口领域，证明大多数决策是正确的就足够了：在这种情况下，光标落在目标区域。我们可以看到，最大准确率并不是严格必要的。\n* 在超过两个类的领域中，错误率没有提供完整的情况。经常，某些类会被完美地识别，而另一些类会产生问题。因此，不仅了解平均性能，而且了解单个类的性能很重要。\n\
  * 在某些领域，我们想要解释决策。高准确率是不够的。医学诊断就是如此。\n* 误报的成本可能与漏报的成本不同。在油溢领域很难用货币表示这些成本。\n* 许多应用程序关注最小化错误率。然而，有时错误率无法提供图像。\n\
  * 另一个重要要求：用户能够调整一个参数来权衡误报和漏报（参见油溢领域）\n\n历史注释\n表 8.1 中的结果来自 Kononenko 等人 [48]，他们在那里引用了较早的项目。油溢项目由\
  \ Kubat 等人 [52] 报告。睡眠分类任务由 Kubat 等人 [50] 处理，而在脑机接口中使用机器学习的经验由 Kubat 等人 [53] 发表。字符识别问题几十年来一直由计算机视觉领域解决；第一个从机器学习角度系统地解决该问题的主要文献似乎是\
  \ Mori 等人 [69]。文本分类任务由 Lewis 和 Gale [55] 最初研究。\n\n\n\n\n\n![image](img/chapter_title_above.png)\n\
