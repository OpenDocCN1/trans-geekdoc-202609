  \ --- | --- |\n\n![image](img/chapter_title_above.png)\n\n# 3.7  移除冗余示例\n\n![image](img/chapter_title_below.png)\n\
  \n某些训练示例并对分类性能产生负面影响，但我们仍然想摆脱它们。问题是，它们也没有降低错误率；只会增加计算成本。\n\n![image](img/image412.png)![image](img/image078.png)冗余示例\
  \ 在一个具有 `10⁶` 个训练示例并由 `10⁴` 个属性描述的领域中寻找最近邻（这种领域并不罕见），依赖 `Euclidean` 距离的程序必须执行 `10⁶`\
  \ × `10⁴` = `10¹⁰` 次算术运算。当任务是一次分类数千个对象时（这同样并非不可能），算术运算的数量是 `10¹⁰` × `10³` = `10¹³`。这是一个巨大的数字。\n\
  \n幸运的是，训练集通常是冗余的，从某种意义上说，即使删除某些训练示例，`k\\-NN` 分类器的行为也不会改变。有时，大部分示例可以被无忧地移除，因为它们只增加了分类成本，而不影响分类性能。图\
  \ 3.9 左上角所示领域就是这种情况。\n\n![image](img/image102.png)![image](img/image306.png)一致子集\
  \ 为了减少冗余，我们想用其一致子集 `S` 替换训练集 `T`。在我们的上下文中，如果用 `S` 替换 `T` 不影响 `k\\-NN` 分类器返回的类别标签，则称\
  \ `S` 是 `T` 的一致子集。然而，这种定义并不实用，因为我们不知道 `k\\-NN` 分类器在未来的示例上如何使用 `T` 或 `S`。因此，让我们修改标准：如果用\
  \ `S` 替换 `T` 不影响 `k\\-NN` 分类器返回的类别标签，则 `S` 被视为 `T` 的一致子集。\n\n现实集合会有许多子集可供选择，这是事常。当然，越小越好。但对于坚持要找到最小子集的完美主义者应该应该警告：这种理想状态往往只能以巨大的代价为代价。\n\
  \n创建一致子集 表 3.6 展示了其中一种实用技术。算法从从每个类别中选择一个开始。\n\n![image](img/image52.png)![image](img/image587.png)创建一致子集\
  \ ![image](img/image731.png)![image](img/image555.png)1: 训练集\n\n22](22..)1.png)\n\
  \n![image](img/image731.png)2: 边界示例\n\n![image](img/image555.png)3: 冗余示例\n\n![image](img/image731.png)图\
  \ 3.9 移除边界、噪声和冗余示例时的示意图\n\n表 3.6 通过移除（某些）示例创建子集的算法\n\n![image](img/image731.png)1.\
  \ 让 `S` 包含 `T` 中的一个正示例和一个负示例。\n\n2. 使用 `S` 对 `T` 中的示例进行重新分类。令 `M` 为获得错误类别的示例集合。\n\
  \n3. 将 `M` 复制到 `S`。\n\n![image](img/image731.png)如果 `S` 的内容没有变化，则停止；否则回到第 1 步。\n\
  \n––––––\n\n![image](img/scene_break.png)\n\n这个初始子集会被分类器用于建议所有示例的标签。在这个阶段，很有可能某些示例会被误分类。这些误分类示例被添加到\
  \ `S` 中，并重复整个过程。不断重复，直到某一时刻，`S` 变得足够具有代表性，使得分类器能够正确标记所有示例。此时停止搜索。\n\n––––––\n\n\
