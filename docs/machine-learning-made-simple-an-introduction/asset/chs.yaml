  \  谓词与递归\n\n![image](img/chapter_title_below.png) \n\n顺序覆盖算法的应用范围比上一节所暗示的要得多。可能最重要的是，该技术可以用于谓词逻辑中表示的概念归纳。\n\
  \n### 1. 谓词与递归\n\n#### 谓词：比属性更高的表达能力\n\n属性值逻辑（attribute-value logic）的一个严重局限性是它不够灵活，无法捕捉数据之间的某些关系。例如，`y`\
  \ 位于 `x` 和 `z` 之间的这一事实可以使用谓词 `between(x,y,z)` 来描述——更准确地说，谓词是项“between”，而 `(x,y,z)`\
  \ 是该谓词参数的列表。\n\n读者会同意，试图通过属性及其取值来表达相同的关系至少是非常困难的。属性可以被视为单参数谓词的特例。例如，对于给定的示例 `x`，形状是圆形的这一事实可以写成\
  \ `circular(x)`。但在处理具有更多参数的谓词时，这种类比就不再显而易见了。\n\n#### 谓词逻辑中的规则归纳\n\n这是一个规则示例，表示如果\
  \ `x` 是 `y` 的父母，且同时 `x` 是一个女性，那么这个父母实际上是 `y` 的母亲：\n\n```\nif parent(x,y) AND female(x)\
  \ then mother(x,y)\n```\n\n我们可以看到，该规则与我们上面看到的规则 `R1` 和 `R2` 结构相同：前件中的条件列表后跟一个结论。事实上，这里也可以使用相同的顺序覆盖算法。但有一点不同：在选择要添加到前件的候选谓词时，我们不能忘记如果改变参数，谓词的含义也会改变。例如，如果将\
  \ `parent(x,y)` 替换为 `parent(x,z)`，之前规则的含义就会改变。\n\n#### 规则允许递归定义\n\n规则可以比上一节更有趣。例如，它们可以是递归的。为了说明这一点，考虑以下规则：\n\
  \n```\nif parent(x,y) then ancestor(x,y)\n```\n\n注意这是 `ancestor`（祖先）的定义。如果我们还有后续：\n\
  \n```\nif parent(x,z) AND ancestor(z,y) then ancestor(x,y)\n```\n\n#### 归纳的具体示例\n\
  \n让我们使用表 15.3 来说明规则集的归纳。从最通用的规则开始，我们想要归纳出内容。在下一步中，我们可以考虑以下内容（注意这始终是同一个谓词，但每次使用的参数集合不同）：\n\
  \n```\nif parent(x,y) then ancestor(x,y)\n```\n\n假设第一种方法产生更高的信息增。看到该规则仍然覆盖了一些负样本示例，我们希望通过向其前件添加另一个条件来对其进行特化。发现父母谓词无法带我们走向任何地方，我们再次尝试祖先谓词\
  \ `ancestor`，并使用了不同的参数列表。\n\n\n\n\n前几节描述的技术遵循了一种简单的策略：在尝试寻找良好的规则集时，算法总是试图通过特化和泛化来修改规则，并根据信息增益准则评估替代方案。\n\
  \n## 规则集修改算符\n\n在实际上，规则的搜索可以比这更灵活。目前已经提出了其他的修改规则集的算符。正如我们所看到的，这些算符并不一定代表特化或泛化，但如果我们观察它们，会发现它们是有意义的。顺提一下，这些算符是在逻辑学中一个著名的原理——所谓的逆归（inverse\
  \ resolution）的帮助下得出的。然而，对于我们的特定需求，它们的导出方法并不重要。\n\n在接下来，我们将通过用逗号代替 `AND`，用箭头代替 `if-then`\
  \ 结构来简化形式化。在所有四种情况下，算符将左侧的规则集转换为右侧的规则集。最左列给出了这些算符的传统名称。\n\n![image](img/image642.png)![image](img/image642.png)![image](img/image021.png)![image](img/image021.png)identification:\
  \ b; x ! a b; c; d ! a\n\nabsorption: c; d ! x b; c; d ! a\n\nb; x ! a\n\nc; d !\
  \ x\n\nc; d ! x\n\nb; x ! a\n\n- 间构造 (inter-construction):\n\n––––––––\n\n![image](img/scene_break.png)\
  \ \n\nv; b; c ! a\n\n![image](img/image403.png)w; b; c ! a\n\n8< u; b; c ! a 9=\n\
  \n![image](img/image288.png)![image](img/image183.png)![image](img/image403.png)![image](img/image518.png):\
  \ w ! u ;\n\n––––––––\n\n![image](img/scene_break.png) \n\n- 内构造 (intra-construction):\n\
  \nv; b; c ! a\n\nw; b; c ! a\n\nv; u ! a w; u a\n\n![image](img/image288.png)![image](img/image317.png):\
  \ b; c ! u ;\n\n注意这些替换并不是演绎性的：右侧的规则永远完全等同于左侧的规则。然而，它们在直觉上似乎是有意义的。\n\n## 如何改进现有的规则集？\n\
  \n上一段中的算符可以改进由顺序覆盖算法导出的规则集。我们甚至可以考虑一种情况：导出的不是一个而是若干类不同的类别，这产生了多个规则集。\n\n这些规则集可以通过爬山算法搜索技术进行改进。搜索算符就是上一段列出的那些。评估函数可能会倾向于更紧凑的规则，这些规则能够正确分类某些代表具体应用领域的辅助训练样本集。\n\
