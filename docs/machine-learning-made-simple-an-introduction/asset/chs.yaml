  \n\n\n\n该问题已经过了严格的数学分析，结果如下。图 3.4 显示了在某些理想情况下的对比结果，例如无限大的训练集以无限密度填充了实例空间。实线代表二分类情况，其中每个样本要么为正类，要么为负类。我们可以看到，如果\
  \ `Ideal Bayes` 的错误率为 5%，那么 `1-NN` 分类器（纵轴）的错误率就是 10%。随着噪声的增加，这两种方法之间的差异会缩小，直到在 `Ideal\
  \ Bayes` 遭受 50% 的错误率时消失——当然，在这种情况下，训练样本的标签几乎是随机的，任何自动分类的尝试注定都会失败。在多分类领域，情况也没有好到哪里，图中用虚线表示这种这种情况。同样，`Ideal\
  \ Bayes` 一以明显的优势优于 `1-NN` 分类器。\n\n## 3.4 性能考虑\n\n### 增加邻居数量\n从 `1-NN` 分类器的角度来看，图\
  \ 3.4 的结果相当令人沮丧。另一方面，我们知道当使用更通用的 `k-NN`（当 `k > 1` 时）时，分类器的性能可能会提高，因为一些噪声较大的最近邻居会被表现更好的邻居所投票掉。数学是否为这种预期提供了一些支持？\n\
  \n![image](img/image597.png)\n\n是的。在上述理想情况下，已证明错误率随 `k` 值的增加而降低，直到收敛到 `k` 的 `Ideal\
  \ Bayes`。至少在理论上，最近邻分类器的性能能够达到绝对最大。\n\n### 理论的实际局限性\n工程师的世界对理论要求并不感兴趣。在实际应用中，训练样本只会稀疏地分布在实例空间，增加投票邻居的数量可能会适得其反。通常情况下，错误率会随着\
  \ `k` 的增加而提高，但只能提高到某一点后开始再次增长——如图 3.5 所示，横轴代表 `k` 的值，纵轴代表在独立测试集上测量的错误率。解释非常简单：较远的“最近邻居”可能会发现自己处于（实例空间中的）已被其他类别占据的区域；因此，它们只会误导分类器。考虑极端情况：如果训练包含\
  \ 25 个训练样本，那么 `25-NN` 分类器就是没用的，因为它简单地将任何对象标记为训练数据中代表数量最多的类。\n\n![image](img/scene_break.png)\n\
  \n![image](img/image144.png)0.8\n0.7\n![image](img/image624.png)0.6\n0.5\n0.4\n\
  0.3\n0.2\n0.1\n0\n0 0.05 0.1 0.15 0.2 0.25 0.3 0.35 0.4 0.45 0.5\nBAYESIAN ERROR\
  \ RATE\n\n图 3.4 `1-NN` 规则与 `Ideal Bayes` 的理论错误率对比。两分类：实线；多分类：虚线。\n\n图 3.5 随着投票邻居数量（`k`）的增加，`k-NN`\
  \ 分类器的错误率降低，直到达到一个开始再次增长的水平\n\nerror rate\n![image](img/image643.png)\n\n### 维度灾难\n\
  显然，在分类对象 `x` 时，它的某些最近邻居可能与 `x` 不相似，不参与投票。这通常发生在具有许多属性的领域中。假设每个属性的值都限制在单位长度区间 `[0\
  \ 1]` 内。使用勾股定理，很容易证明在由这些属性定义的 `n` 维空间中最大欧几里得距离为 `dMAX = √n`。\n\n![image](img/image112.png)![image](img/image474.png)\n\
  \n\n\n应当超过那三个较远的“负”邻居的权重。\n\n![image](img/image261.png)![image](img/image122.png)类，因为正类邻居的总权重\
  \ †^C 0:6 0:7 1:3 大于负类邻居的权重 †^(\\-)  0:1  0:2  0:3  0:6。正如图 3.6 所示，频率更频繁的负标签被正类邻居投票否决，因为后者距离\
  \ `x` 更近。\n\n### 具体公式\n\n让我们引入一个简单的公式来计算权重。假设 `k` 个邻居根据它们到 `x` 的距离 `d1;:::; dk`\
  \ 进行了排序，使得 `d1` 是最小距离而 `dk` 是最大距离。第 `i` 个最近邻居的权重计算公式如下：\n\n```\nwi = (dk - di) /\
  \ (dk - d1)\n```\n\n![image](img/image465.png) (3.4)\n\n![image](img/image154.png)![image](img/image112.png)显然，由此得到的权重范围将从最远邻居的\
  \ 0 到最近邻居的 1。这意味着该方法实际上只考虑了 `k-1` 个邻居（因为 `wk = 0`）。当然，这仅在 `k > 3` 时才有意义。如果我们使用 `k\
  \ = 3`，那么只有两个邻居真正参与，加权 `3-NN` 分类器将退化为 `1-NN` 分类器。\n\n表 3.4 在一个简单的玩具领域上展示了该过程。\n\n\
  ![image](img/image112.png)![image](img/image112.png)另一个需要观察的重要点是，如果所有最近邻居到 `x` 的距离相同，那么根据等式(3.4)的分母部分，它们将获得相同的权重\
  \ `wi = 1`。读者可以很容易地验证，当且仅当 `dk = d1` 时，所有 `k` 个最近邻居到 `x` 的距离相同。\n\n––––––––\n\n\
  ![image](img/scene_break.png) \n\n表 3.4 加权最近邻居规则示意\n\n![image](img/image731.png)\n\
  \n任务是使用加权 `5-NN` 分类器来确定对象 `x` 的类别。假设 `x` 与五个最近邻居之间的距离分别为 `d1 = 1; d2 = 3; d3 = 4;\
  \ d4 = 5; d5 = 8`。\n\n![image](img/image614.png)![image](img/image349.png)由于最小值为\
  \ `d1 = 1`且最大值为 `d5 = 8`，各个权重计算如下：\n\n```\nwi = (d5 - di) / (d5 - d1) = (8 - di)\
  \ / (8 - 1)\n```\n\n––––––––\n\n![image](img/scene_break.png) \n\n得到以下值：\n\n```\n\
  w1 = (8 - 1) / 7 = 1\nw2 = (8 - 3) / 7 = 5/7\nw3 = (8 - 4) / 7 = 4/7\nw4 = (8 -\
  \ 5) / 7 = 3/7\nw5 = (8 - 8) / 7 = 0\n```\n\n如果两个最近邻居是正类而其余三个是负类，那么 `x` 被归类为正类，因为\
  \ `†^C = 1 + 5 > †^(\\-) = 4 + 3`。\n\n## 3.6 移除危险示例\n\n对于分类过程而言，每个训练示例的值可能不同。有些是其所代表类别的典型，有些则不然，而另一些完全具有误导性。这就是为什么在\
  \ ways 训练集之前对其进行预处理通常是一件好事：移除被怀疑用处较小的示例。\n\n预处理训练集的具体方法由图 3.7 所示的两个基本观察指导。首先，一个标记为某一类但被另一类示例包围的示例可能是类别标签噪声的结果。其次，来自两类边界区域的示例是不可靠的，因为其属性值中微小的噪声就会导致其位置发生错误偏移，从而影响分类。在这两种情况下，这些示例最好被移除。\n\
  \n### Tomek Links（Tomek 连接）技术\n\n然而，在移除罪祸首之前，必须先检测到它。一种方法是使用 Tomek Links 技术，该技术以几十年前首次使用它的数学家名字命名的。如果一对示例\
  \ `x` 和 `y` 同时满足以下三个要求，则认为形成了一个 Tomek Link：\n\n1. `x` 是 `y` 的最近邻居\n2. `y` 是 `x`\
  \ 的最近邻居\n3. `x` 的类别与 `y` 的类别不同。\n\n由于这些条件是边界示例以及被另一类包围的示例的特征，因此从训练集中移除所有此类对是有意义的。但这可能还不够。有时，移除现有的\
  \ Tomek Links 只产生新的链接，因此必须重复该过程。\n\n该算法由表 3.5 中的伪代码总结，图 3.8 显示了几个 Tomek Link 的实例。请注意，这里只有这三个；没有其他示例对符合被称为\
  \ Tomek Link 的标准。\n\n有一个值得提到的副作用：一旦训练集被清理，就可以减少投票邻居的数量（`k`），因为使用 `k > 1` 的主要原因是减轻噪声的负面影响——而移除\
  \ Tomek Links 减少了这种影响。甚至可能 `1-NN` 分类器现在达到使用整个训练集的 `k-NN` 分类器的性能。\n\n### 局限性\n\n\
  没有完美。Tomek Links 技术无法识别所有误导性示例；相反，某些被移除的示例可能是“无辜”的，因此本应该保留。尽管如此，经验表明移除 Tomek Links\
  \ 通常会提高数据的整体质量。\n\n### 学了吗\n\n为了确保你理解了这个主题，请尝试回答以下问题。如果有困难，请回到文中相应的位置。\n\n- 为什么我们认为每个投票邻居有时应该具有不同的权重？\n\
  - 讨论文中推荐的计算各个权重的公式的行为。\n\n\n\n从训练集中移除所有现在位于 `T` 中的示例。\n\n––––––––\n\n![image](img/scene_break.png)\n\
  \n工程师只需要在两种特定情况下需要小心。(1) 当训练集非常小的时候，以及 (2) 当其中一类别的数量远多于另一类时。后者的情况将在第 10.2 节中讨论。\n\
