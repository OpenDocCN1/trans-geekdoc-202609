  \n第 3 章\n\n## 相似性：最近邻分类器\n\n两个看起来非常的植物可能代表同一物种；同样，症状相似的患者患有相同疾病的情况常见。简而言之，相似的对象通常属于同一类——这一观察了一种流行的分类方法的基础：当要求确定对象\
  \ `x` 的类别时，找到与它最相似的训练示例。并将 `x` 标记为该示例的类。\n\n本解释了如何评估示例之间的相似性，介绍了使用这些相似性进行分类的具体机制，将该方法与贝叶斯分类器的性能进行比较，并介绍了克服某些固有缺陷的方法。\n\
  \n\n\n\n\n## 3.1 k-近邻规则\n\n我们如何确定一个对象相对于 `x` 比相对于 `y` 更相似呢？有些人可能怀疑这是否可行。长颈鹿比马还是比斑马更相似？这类问题引起了怀疑。回答这些问题涉及了太多任意且主观的因素。\n\
  \n### 属性向量的相似性\n本书所阐述机器学习任务将这些反对降到了最低。分类器比较的不是真实物体，而是它们基于属性的描述——这绝不是不可逾越的问题。因此，在第\
  \ 1 章的示例领域中，两个饼之间的相似性可以通过计算它们差异的属性数量来建立：差异越少，相似性越高。表 3.1 中的第一行给出了对象 `x` 的属性值。对于随后的\
  \ 12 个训练示例，最右侧的一列指定了给定示例与 `x` 之间的差异数量。在 `ex5` 处找到最小值，我们得出结论这是与 `x` 最相似的训练示例，这表明我们应该将\
  \ `x` 标记为 `pos`，即 `ex5` 的类别。\n\n![image](img/image055.png) 表 3.1 计算离散属性向量对之间的差异数量\n\
  \n在 12 个训练示例中，`ex5` 是与 `x` 最相似的一个 表 3.2 最简单的 k-NN 分类器\n\n![image](img/image731.png)\n\
  \n假设我们有一种机制来评估属性向量之间的相似性。令 `x` 表示我们想要确定类别的对象。\n\n1. 在训练示例中，识别出 `x` 的 `k` 个最近邻（与\
  \ `x` 最相似的示例）。\n2. 令 `ci` 为这 `k` 个最近邻中出现频率最高的类别。\n3. 将 `x` 标记为 `ci`。\n\n处理连续属性也同样简单。每个示例都可以表示为\
  \ `n` 维空间中的一个点，这使得计算任意两个示例之间的几何距离成为可能，例如通过欧几里得距离（第 3.2 节将更多关于如何衡量向量之间的距离的内容）。再次，示例在实例空间中越接近，它们的相互相似性就越大。顺便说一下，这就是最近邻分类器的命名来源：在实例空间中，距离\
  \ `x` 最小的训练示例从几何角度来说，就是 `x` 的最近邻。\n\n### 从单个邻居到 k 个邻居\n在噪声领域中，最近邻的证词是不可信的。如果这一个样本的类别标签是错误的怎么办？更稳健的方法是识别不是一个，而是几个最近邻，然后让他们投票。这就是所谓的\
  \ k-NN 分类器的精髓，其中 `k` 是投票邻居的数量——通常是一个由用户指定的参数。表 3.2 中的伪代码总结了该算法。\n\n注意，在二分类领域中，`k`\
  \ 应该是一个奇数以防止出现平局。例如，4-NN 分类器可能会面临正邻居数量与负邻居相同的情况。这在 5-NN 分类器上不会发生。对于具有两个以上类的领域，使用奇数个最近邻不能防止平局。例如，7-NN\
  \ 分类器可能会发现三个邻居属于 `C1`，三个邻居属于 `C2`，一个邻居属于 `C3`。设计分类器的工程师随后需要定义一种机制在 `C1` 和 `C2` 之间进行选择。\n\
  \n### 图解说明\n通过一个虚构领域，可以将该范式的某些“行为特征”显而易见，在该领域中示例由两个数值属性描述，这种情况易于可视化。图 3.1 显示了几个正、负训练示例，以及一些\
  \ k-NN 分类器需要确定其类别的对象（大点）。读者可以发现对象 `1` 和 `2` 被同类别的示例包围，因此它们的分类是显而易见的。相反，对象 `3` 位于正负区域之间的“无人地带”，因此即使是少量的属性噪声也可以将其推到任一侧。此类边界示例的分类是不可靠的。在右部分，对象\
  \ `4` 发现自己处于正区域深，但类别噪声错误地将其最近邻标记为负类。虽然 1-NN 分类器在这里会出错，但 3-NN 分类器将给出正确答案，因为另外两个正类邻居会投票胜过单个负类邻居。\n\
