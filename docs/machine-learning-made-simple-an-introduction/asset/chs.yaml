  \n![image](img/image452.png)\n\n### 计算成本\n\n误差反向传播在计算上是非常昂贵的。当展示一个示例时，必须计算每个神经元的责任，然后相应地修改权重。这一过程必须对所有训练示例重复进行，通常持续许多轮（epochs）。为了直观这些操作的真实成本，考虑一个用于分类由\
  \ 100 个属性描述的示例的网络，这是一个相当真实的案例。如果有 `100` 个隐藏神经元，那么这一底层的权重数量为 $100 \\times 100 = 10⁴$。这就是在每个训练示例后权重变化的次数。注意，在这些计算中，只要类别数量较少，就可以忽略上层权重。例如，在一个具有三个类别的领域中，上层权重的数量为\
  \ $100 \\times 3 = 300$，这远小于 $10⁴$。\n\n假设训练集包含 $10⁵$ 个示例，假设训练将持续 $10⁴$ 轮。在这种情况下，权重更新的次数将为\n\
  \n![image](img/image570.png) $10⁵ \\times 10⁴ = 10⁹$。这看起来很大，但许多应用的要求更高。因此，开发了一些提高训练效率的巧妙方法。然而，这些超出了我们这里的关注范围。\n\
