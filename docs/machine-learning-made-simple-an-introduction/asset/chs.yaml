  \n# 第 11 章\n\n## 性能评估\n\n之前的章节假装机器学习中的性能评估是一个相当简单的问题。所需要的是将诱导出的分类器应用于一组已知类别的示例，然后统计分类器所犯的错误数量即可。现实中，情况并非如此。错误率很少能反映全貌，在某些情况下，它甚至可能产生误导。这就是为什么一位严谨的工程师希望熟悉其他评估分类器性能的标准。这些知识将使她能够选择出最能捕捉其感兴趣的行为特征的标准。\n\
  \n分类器的评估就到此。稍有不同的问题是，如何比较备选机器学习技术在给定领域中诱导的适用性。将一组预先分类的示例随机划分为两个子集（一个用于诱导，另一个用于测试）可能不是最好的做法，特别是当训练集较小时；随机划分可能导致子集不能很好地代表给定领域。为了获得更可靠的结果，重复的随机运行是必要的。\n\
  \n本章将解决这两个问题，解释了用于量化分类器性能的替代标准，然后讨论了机器学习算法实验评估中常用的某些策略。结果的统计评估问题留到了下一章。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \  ||  || ![image](img/chapter_title_corner_decoration_right.png)  |\n| --- | ---\
  \ | --- |\n![image](img/chapter_title_above.png) \n\n# 11.1 基础性能标准\n\n![image](img/chapter_title_below.png)\
  \ \n\n让我们从错误率和分类准确率的正式定义开始。之后，我们将考虑如果支持胜出类别的证据较弱，拒绝分类某个示例的决策后果。\n\n––––––––\n\n\
  ![image](img/scene_break.png) \n\n211\n\n表 11.1 用于性能标准定义的基础量\n\n––––––––\n\n![image](img/scene_break.png)\
  \ \n\n|  | 分类器返回的标签 |\n| --- | --- |\n| pos | neg |\n| 真实标签: | pos | NTP | NFN |\n\
  | neg | NFP | NTN |\n\n![image](img/image497.png)![image](img/image232.png)\n\n\
  例如，`NFP` 是假阳性的数量：被分类器误分类为正类的负示例数量。\n\n### 正确与错误分类\n\n让我们首先定义贯穿本章将使用的四个基本量。在测试一个已知类别的示例时，我们可以遇到以下四种结果：（1）示例为正类且分类器正确识别了它（真阳性）；（2）示例为负类且分类器正确识别了它（真阴性）；（3）示例为正类但分类器将其标记为负（假阴性）；以及（4）示例为负类但分类器将其标记为正（假阳性）。\n\
  \n![image](img/image123.png)\n\n当将分类器应用于整个示例集时，这四种结果出现的次数各相同——这些数量汇总在表 11.1 中。具体而言，`NTP`\
  \ 是真阳性的数量，`NTN` 是真阴性的数量，`NFP` 是假阳性的数量，`NFN` 是假阴性的数量。在整个示例集 `T` 中，只有这四类是可能的；因此，集合的大小\
  \ `T = NFP + NFN + NTP + NTN`。\n\n注意正确分类的数量是 `NTP + NTN`；而错误的数量是 `NFP + NFN`。\n\n\
  ### 错误率与分类准确率\n\n分类器的错误率 `E` 是在给定示例集上犯错误的频率。它是通过将错误数量 `NFP + NFN` 除以示例总数 `NTP +\
  \ NTN + NFP + NFN` 计算的。\n\n```\nE = (NFP + NFN) / (NTP + NTN + NFP + NFN)\n```\n\
  \n––––––––\n\n![image](img/scene_break.png)\n\n(11.1)\n\n有时，工程师倾向于使用相反的标准，分类准确率\
  \ `Acc`：分类器在给定示例集上正确分类的频率。它是通过将正确数量 `NTP + NTN` 除以示例总数计算的。注意 `Acc = 1 - E`。\n\n\
  ```\nAcc = (NTP + NTN) / (NTP + NTN + NFP + NFN)\n```\n\n––––––––\n\n![image](img/scene_break.png)\
  \ \n\n(11.2)\n\n1. 基础性能标准 213\n\n### 拒绝示例\n\n在讨论字符识别问题时（第 8.1 节），建议如果支持胜出类别的证据不够充分，有时允许分类器拒绝分类某个示例。动机非常简单：在某些领域，误分类的惩罚远大于不进行任何分类的惩罚。\n\
  \n寻找说明例子并不困难。因此，分类器拒绝返回精确邮政值的后果是，信件去向必须由人工操作决定。可以肯定，这种手动处理比自动处理昂贵，但并没有过分。另一方面，分类器返回错误值会导致信被发送到错误的地点，这会导致严重的延迟。后者的成本通常远高于“手动”读取的成本。同样，错误的医疗诊断通常比没有诊断更高；缺乏知识可以通过额外的测试弥补，但错误的诊断可能会导致选择危害大于益的治疗方案。\n\
  \n\n\n\n\n这就是为什么如果支持某一类别的证据不足，分类器有时应该拒绝对某个示例进行分类。在某些机器学习范式中，“证据不足”这一术语很容易定义。例如，在\
  \ 7-NN 分类器中，有四个邻居倾向于 `pos` 类，而其余三个邻居倾向于 `neg` 类。最终计数为四对三，这种情况似乎“由于太接近而难以胜负”。更一般地说，工程师可以为支持获胜类别的投票票数与支持亚军类别的投票票数之间的最小差异定义一个阈值。\n\
  \n在贝叶斯分类器中，这种技术也容易实现。如果两个最受支持类别的概率之差小于用户指定的最小值，则该示例将由于太模糊而无法分类而被拒绝。在神经网络中，也可以进行类似的操作：比较相应的输出神经元返回的信号——如果没有明确的获胜者，则拒绝分类。\n\
  \n在其他分类器（如决策树）中，拒绝机制的实现就没那么直观，只有通过实现“额外技巧”才能成为可能。\n\n## 拒绝分类的优缺点\n\n偶尔拒绝对示例类别做出决策的分类器，其出错的概率显然更低。难怪它的错误率会较低。事实上，拒绝的示例越多，错误率就越低。但这种谨慎不应过度。错误率降低到接近零看起来是一件好事，但如果这种低率仅通过拒绝分类几乎所有的示例来实现，那么这个分类器就变得不实用了。在这两个方面（低错误率与少数分类）中，哪一个起更重要作用取决于应用的具体情况。\n\
  \n图 11.1 直地说明了此类决策涉及的权衡本质。横轴代表一个能够控制以下内容的参数：\n\n```\nerror rate\nrejection rate\n\
  \n![image](img/image077.png)100%\n\n![image](img/image473.png)\n```\n\n图 11.1 通过允许分类器在现有证据无法“说服”它时拒绝对示例分类，可以增加错误率。在极端情况下，通过调整拒绝率，错误率下降到\
  \ `E 0`。\n\n––––––––\n\n![image](img/scene_break.png)\n\n随着我们从左向右移动，拒绝率增加，而错误率下降，直到在极端情况下所有示例都被拒绝。此时，对于拥有一个什么都不做的分类器来说，零错误率是一个糟糕的慰藉。教训是清楚的：偶尔拒绝不明确的示例非常有意义，但这一原则应该被谨慎处理。\n\
  \n––––––––\n\n![image](img/scene_break.png)\n\n## 你学了什么？\n\n为了确保你理解了这一主题，请尝试回答以下问题。如果有问题，请回到上文中对应的部分。\n\
  \n* 定义 `false negative`（假阴性）、`false positive`（假阳性）、`true negative`（真阴性）和 `true positive`（真阳性）术语。\n\
  * 指定分类准确率和错误率的公式。这两个标准是如何相互关联的？\n* 分类器何时应该拒绝一个示例（即何时应该拒绝分类）？你如何在不同类型的分类器中实现这种行为？\n\
  \n## 11.2 精率和召回率\n\n在某些应用中，负示例远多于正示例。当这种情况发生时，错误率提供的性能描述是有误导性的。要了解为什么，只需考虑所有示例中仅有\
  \ 2% 是正示例的情况。\n\n![image](img/image182.png)精率（Precision）：我们指的是在分类器标记为正类的所有示例中，真阳性\
  \ `NTP` 的比例。因此，该值通过以下公式获得：\n\n```\nNTP / NFP\n```\n\n––––––––\n\n![image](img/scene_break.png)\n\
  \n(11.3) 另一种说法，精率是分类器将示例标记为正类时正确的概率。\n\n![image](img/image182.png)召回率（Recall）：指的是正示例被正确识别（通过分类器）的概率。因此，该值通过将真阳性的数量\
  \ `NTP` 除以集合中正示例的数量获得：\n\n```\nNTP / NFN\n```\n\n––––––––\n\n![image](img/scene_break.png)\n\
  \n(11.4) 注意最后两个公式仅分母不同。这是合理的。精率是在所有被分类器认为是正类的示例中真阳性的频率，而召回率是在集合中所有正示例中相同真阳性的频率。\n\
  \n## 不平衡类别的回顾\n\n不平衡类别在这一领域很常见，准确率几乎无法告诉我们任何有用的信息。我们需要关注特定类别的标准，而不是对两个类别取平均。\n\n\
  ![image](img/image309.png)表 11.2 两个标准的说明：精率和召回率\n\n假设已经了一个分类器。在测试集上的评估结果所示：\n\n\
  ![image](img/image669.png)分类器返回的标签\n\n|  | pos | neg |\n| --- | --- | --- |\n| 真实标签:\
  \ pos | 20 | 50 |\n| neg | 30 | 900 |\n\n![image](img/image640.png)![image](img/image238.png)![image](img/image008.png)从这里得到精率、召回率和准确率的值：精率\
  \ `20 D 0.40`、召回率 `20 D 0.29`、准确率 `920`。\n\n\n\n\n\n![image](img/image669.png)分类器返回的结果\n\
