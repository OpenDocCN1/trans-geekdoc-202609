  - 分类性能的其他不常用标准包括敏感性（sensitivity）、特异性（specificity）和几何平均值（gmean）。\n- 在一个示例可能同时属于多个类的领域中，通常通过对每个类别测量的性能取平均值来评估。使用了两种替代平均方法：微平均（micro-averaging）和宏平均（macro-averaging）。\n\
  - 机器学习技术的另一个重要方面是，为了达到特定的分类性能，需要多少训练示例。这种情况有时可以通过学习曲线进行直观可视化。工程师还应该关注与归纳和分类相关的计算成本。\n\
  \n![image](img/image639.png)\n- 在预分类示例数量有限的领域比较不同的机器学习技术时，工程师依赖于被称为随机抽样、`N-fold\
  \ cross-validation` 和 `5-2 cross-validation` 的方法。这些技术的分层版本确保每个训练集（和测试集）中每个类别的示例具有相同的比例。\n\
