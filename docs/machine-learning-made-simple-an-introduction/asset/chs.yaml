  \ 02/ D H.T/ - H.T; 02/ D 0:9957 - 0:9811 D 0:0146` `I.T; 03/ D H.T/ - H.T; 03/\
  \ D 0:9957 - 0:9045 D 0:0912`\n\n阈值 `01` 提供了最高的信息增益。\n\n表 6.7 寻找最佳数值属性测试的算法\n\n\
  ![image](img/image731.png)\n\n1. 对于每个属性 `ati`：\n    1. 按 `ati` 的值对训练示例进行排序；\n  \
