  \ | --- |\n\n![image](img/chapter_title_above.png) \n\n# 15.2 通过顺序覆盖归纳规则集\n\n![image](img/chapter_title_below.png)\
  \ \n\n现在让我们介绍一种简单的技术，它可以从满足上一节简化假设的训练数据中归纳规则集。\n\n### 原理\n目标是找到一个规则集，使其每条规则都覆盖某些正示例，但不覆盖任何负示例。这些规则共同应该覆盖所有的正示例且不覆盖任何负示例。我们将使用的程序每次创建一条规则，始终从一个非常通用的初始版本（也覆盖负示例）开始，然后逐渐特化，直到所有负示例都被排除在覆盖之外。规则是顺序创建的，且每条规则都应该覆盖被之前的规则遗漏的正示例，这种特性赋予了该名称：顺序覆盖（sequential\
  \ covering）。\n\n### 顺序覆盖的基准版本\n表 15.2 提供了归纳规则集的简单方法的伪代码。主体包含了顺序覆盖算法。其思想是找到一条覆盖某些正示例但不覆盖任何负示例的规则。一旦创建了该规则，它覆盖的示例就会从训练集中移除。如果没有剩余的正示例，算法停止；否则，将算法应用于缩小后的训练集。\n\
  \n![image](img/image112.png) 下半部分描述了单条规则的归纳。算法从最通用的前件版本开始，内容是“所有示例都是正的”。假设训练集至少包含一个负示例，这个声明显然是错误的。因此，算法试图通过特化来纠正这种情况，尝试将某些负示例排除在覆盖之外，希望不要丢失对正示例的覆盖。特化操作符向规则中添加另一个形式为\
  \ `ai = vj` 的复合（读作：属性 `ai` 的值为 `vj`）。\n\n### 具体示例\n让我们使用表 15.1 中的数据来“手动模拟”顺序覆盖算法。第一条规则具有空前件，覆盖了所有训练示例。在空前件中添加条件\
  \ `shape=circle` 得到一条覆盖了四个正示例和两个负示例的规则。再添加一个条件 `filling-shade=dark`，则对规则进行了特化，使其在仍然覆盖这四个正示例的同时，现在不再覆盖任何负示例。我们获得了一条覆盖示例\
  \ `ex1; ex2; ex4; ex6` 的规则。注意，这就是上一节中的规则 `R1`。\n\n1. 通过顺序覆盖归纳规则集 301\n\n![image](img/image332.png)\
  \ 表 15.2 顺序覆盖算法\n输入：训练集 T。\n\n```\nSequential covering.\n\n创建一个空规则集。\n\n当 T 中至少存在一个正示例时：\n\
  \  1. 使用下述算法创建一条规则。\n  2. 从 T 中移除所有满足规则前件的示例。\n  3. 将规则添加到规则集中。\n\n创建单条规则\n创建规则的初始版本，R:\
  \ if () then pos\n  1. 如果 R 不覆盖任何负示例，停止。\n  2. 向 R 的前件中添加一个条件，ai = vj，并返回上一步。\n\
  ```\n\n![![image](img/image332.png)\n\n––––––––\n\n![image](img/scene_break.png)\
  \ \n\n![image](img/image615.png) \n\n如果我们将这四个示例从训练集中移除，我们剩下两个正示例，`ex3` 和 `ex5`。另一条规则的开发再次从最通用的版本（空前件）开始。假设我们随后选择\
  \ `shape=triangle` 作为初始条件。这覆盖了一个正示例和两个负示例。在前件中添加项 `filling-shade=dark`，我们成功排除了负示例，同时保留了对正示例\
  \ `ex3` 的覆盖，现在可以从训练集中移除。在创建第二条规则后，我们剩下一个正示例 `ex5`。\n\n因此，我们必须创建另一条规则，其任务是覆盖 `ex5`\
  \ 而不覆盖任何负示例。一旦找到这样的规则，`ex5` 将从训练集中移除。之后，我们观察到没有剩余的正示例，程序停止。我们创建了一个由三条规则组成的规则集，覆盖了所有的正示例且不覆盖任何负示例。\n\
  \n### 如何识别最佳属性值对\n在之前的例中，我们几乎是随机地选择要添加到规则前件的条件。但看到我们可以从许多备选中进行选择，我们意识到我们需要一种机制来告知我们每个选择的质量。这里最自然的标准可能是基于信息论，这种原理我们在第\
  \ 6 章归纳决策树的过程中已经遇到过。\n\n让 `NoCld` 为规则原始版本覆盖的正示例数量，让 `No-ld` 为规则原始版本覆盖的负示例数量。同样，新版本规则覆盖的正示例和负示例的数量分别用\
  \ `NnCew` 和 `Nn-ew` 表示。\n\n由于该规则只覆盖正示例，随机选取的示例被其标记为正类的信息量计算如下（针对旧版本和新版本）：\n\n––––––––\n\
  \n![image](img/scene_break.png) \n\nIold\n\nNoCld\n\n![image](img/image449.png)D\
  \ - log. NC C N- /\n\nold\n\nNnCew\n\nI D - log.\n\nold\n\n––––––––\n\n/\n\n![image](img/image537.png)new\n\
  \nNnCew\n\nC Nn-ew\n\n\n\n\n\n这两者之间的在于通过修改规则所获得的信息量的大小。通常，机器学习专业人士会将信息增除以被覆盖示例的数量\
  \ `NC` 来归一化，以便优先选择那些能优化被覆盖示例数量的规则修改方案。规则改进的质量按如下方式计算：\n\n```\nQ D NC x jInew \\\
  \ - Ioldj  (15.1)\n```\n\n在比较修改规则的替代方法时，我们选择 `Q` 值最高的一个。\n\n––––––––\n\n![image](img/scene_break.png)\
