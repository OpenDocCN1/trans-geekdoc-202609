  \n# 第 15 章\n\n## 规则形式的分类器\n\n某些分类器采用所谓的“if-then”（如果-那么）规则形式：如果满足 if 部分的条件，则将示例标记为\
  \ then 部分指定的类别。通常，分类器不是由单个规则表示，而是由一组规则（规则集）表示。这种范式具有某些优点。一方面，规则捕捉了底层逻辑，因此有助于解释为什么某个示例必须被标记为给类别；另一方面，规则集的归纳能够发现递归定义，这在其他机器学习范式中很难实现。\n\
  \n在寻找从数据归纳规则或规则集的技术时，我们将借鉴来自归纳逻辑编程（Inductive Logic Programming）的思想，这是一门研究自动创建和改进\
  \ Prolog 程序方法的学科。然而，我们只对分类器的归纳感兴趣。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \  ||  || ![image](img/chapter_title_corner_decoration_right.png)  |\n| --- | ---\
  \ | --- |\n\n![image](img/chapter_title_above.png)\n\n# 15.1 由规则描述的类\n\n![image](img/chapter_title_below.png)\n\
  \n为了后后介绍简单的规则归纳算法，让我们看看规则的本质。表 15.1 包含了我们之前遇到的训练集。在该领域中，以下表达式作为正类的可能描述：\n\n\\[ (shape=circle)\
  \ AND (filling-shade=dark) \\] OR \\[ NOT(shape=circle) AND (crust-shade=dark) \\\
  ]\n\n在分类示例 `x` 时，分类器将示例的值与表达式进行比较。因此，如果 `x` 是圆形且填充颜色为深色，表达式为真，分类器会将 `x` 标记为\n\n\
  297\n\n![image](img/image575.png)表 15.1 以形式表示的十二个训练示例\n\n正类。如果表达式为假，分类器会将 `x` 标记为负类。该表达式可以转换为以下规则：\n\
  \nR1: if (shape=circle) AND (filling-shade=dark) then pos.\nR2: if NOT(shape=circle)\
  \ AND (crust-shade=dark) then pos. else neg.\n\n在机器学习的术语中，每个规则由一个前件（if 部分，在此背景下是属性的与）和一个结论（then\
  \ 部分）组成。注意的是，这两个规则的结论都指向正类。要将示例标记为正类，必须满足至少一个规则的前件。否则分类器会将示例标记为默认类。我们要记住，在处理此类规则集时，不能忘记指定默认类。\n\
  \n### 简化假设\n\n在本章中，我们将依赖以下简化假设：\n\n1. 所有训练示例都由离散值属性描述。\n2. 训练集无无的。\n3. 训练集是一致的：具有相同属性的示例必须属于同一类别。\n\
  \n### 机器学习任务\n\n我们的目标是找到一种从满足上述假设的数据中归纳规则集的算法。我们将限制在那些结论指向正类的规则上，默认类总是负类。\n\n由于训练集预期是一致且无噪声的，我们将对能够正确分类所有训练示例的分类器感兴趣。这意味着\n\
  \n对于每个正示例，至少一个规则的前件为真。对于任何负示例，没有规则的前件为真，示例被标记为默认（负）类。\n\n### 规则“覆盖”示例\n\n让我们引入一个实用的术语：示例要么被规则覆盖，要么不被。一个简单的插图将澄清这一概念。考虑以下规则：\n\
  \nR: if (shape=circle) then pos.\n\n![image](img/image371.png)如果我们把此规则应用到表 15.1\
  \ 中的示例，我们将观察到前件的条件 shape=circle 被以下示例集满足：ex1; ex2; ex4; ex6; ex7; ex0 。 我们说 R 覆盖了这六个示例。通常来说，如果规则前件中的表达式对于该示例为真，则该规则覆盖该示例。注意的是，被此特定规则覆盖的示例中有四个是正的，两个是负的。\n\
  \n规则特化如果我们通过向上述规则的前件添加另一个条件 `filling-shade=dark` 来修改该规则，将得到：\n\nR1: if (shape=circle)\
  \ AND (filling-shade=dark) then pos.\n\n![image](img/image615.png)在训练集上检查 R1，我们意识到它覆盖了以下示例：ex1;\
  \ ex2; ex4; ex6 。我们观察到这是 R 原覆盖的六个示例的子集。幸运的是，现在只有正示例（而没有负示例）被覆盖。\n\n\n\n\n这引出了另一个有用术语的定义。如果规则前件（antecedent）的修改使得覆盖的示例集减少到一个子集，我们称这种修改对规则进行了特化（specialized）。换句话说，特化是将覆盖的示例集缩小到一个真子集。特化规则的一种典型方法是在规则的前件中添加一个新的条件。\n\
  \n### 规则泛化\n相反，如果规则的修改将其覆盖的示例集扩大到一个超集，则该规则被泛化（generalized）——如果新版本涵盖了旧版本涵盖的所有示例，加上额外的一些。泛化规则最简单的方法是从其前件中删除一个条件。例如，当我们从规则\
  \ `R1` 中去掉条件 `(filling-shade=dark)` 时就会发生这种情况。\n\n### 规则集的特化与泛化\n我们已经提到，我们感兴趣的是规则集的归，如果一个示例至少有一个规则的前件为，则将该示例标记为正类。例如，上述由规则\
  \ `R1` 和 `R2` 组成的规则集就是这种情况。\n\n如果我们从一个规则集中移除一条规则，规则集可能不再覆盖之前覆盖过的某些示例。我们已经知道，这被称为特化。相反，向规则集中添加一条新规则将泛化该规则集，因为新规则会增加覆盖的示例集。\n\
  \n#### 你学了什么？\n为了确保你理解了该主题，请尝试回答以下问题。如有需要，请回到文中适当的位置。\n\n- 解释规则分类器的本质。当我们说一个规则覆盖一个示例时，是什么意思？使用这个术语（`cover`），说明归出的分类器在一致且无噪声的训练集上应该如何表现。\n\
