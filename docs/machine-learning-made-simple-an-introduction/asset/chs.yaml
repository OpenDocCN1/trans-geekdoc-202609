  \n––––––––\n\n![image](img/scene_break.png) \n\n### 归一化的性\n\n读者会记得，在讨论 `k-NN` 分类器时，第\
  \ 3 章指出不适当的属性缩放会扭曲属性向量之间的距离。聚类分析中也存在同样的问题。因此，对向量进行归一化始终是一个好主意，使得所有数值属性的值处于相同的范围，例如从\
  \ 0 到 1。\n\n实现此最简单的方法是确定给定属性在训练集中最大值（`MAX`）和最小值（`MIN`）。然后，使用以下公式重新计算该属性的每个值：\n\n\
  ![image](img/image112.png)\n```\nx - MIN / MAX - MIN\n```\n\n––––––––\n\n![image](img/scene_break.png)\
  \ \n\n### (14.2)\n\n对于布尔属性，其值可以简单地替换为真和假分别对应的 1 和 0。最后，一个获得 `n` 个离散值的属性（例如季节，它有四个不同的值）可以替换为\
  \ `n` 个布尔属性，每个值对应一个属性——同样，对于这些布尔属性的值，使用 1 或 0。\n\n### 初始化的计算方面\n\n为了实现其目标，`k-means`\
  \ 需要经过一定数量的示例从错误簇到正确簇的转移。需要多少次转移取决于初始聚类的内容。至少在理论上，可能会出现随机创建的初始聚类已经是完美的，不需要移动任何示例。这，固然是一个极端情况，但读者一定理解，如果初始化是“幸运”的，那么执行的重新定位将比其他时候少。初始化的重要性在于，更好的起点可以确保更快地找到解决方案。\n\
  \n### 如何初始化\n\n在某些领域，我们可以利用有关当前问题的某些背景知识。例如，在试图在公司员工数据库中创建初始聚类时，数据分析师可能会推测，根据年龄、工资或其他直观标准对他们进行分组是有意义的，由此得到的组将良好的初始聚类。\n\
  \n然而，在其他应用中，没有这样的指南。此时最简单的程序是选取 `k` 个随机训练示例，并将它们视为代码向量，以定义初始质心。然后，通过将每个示例与其最近的代码向量关联来创建初始聚类。\n\
