  \ | --- |\n\n![image](img/chapter_title_above.png) \n\n## 16.1 基准遗传算法\n\n![image](img/chapter_title_below.png)\
  \ \n\n让我们先简要描述遗传算法的通用原理，将实现的细节留到下一节。\n\n### 基本哲学\n在本节中，分类器将以染色体的形式编码，大多数情况下，它是一个位串，有时被称为“基因”。遗传算法在染色体种群上运行，每个染色体描述一个个体（分类器）。每个这样的个体都由一个\
  \ `适应度函数` 分配一个值；该值通常取决于分类器的性能。`适应度函数`的作用类似于启发式搜索中的`评估函数`¹。\n\n––––––\n\n![image](img/scene_break.png)\
  \ \n\n![image](img/image605.png)\n\n¹本章将交替使用“评估函数”、“存活函数”和“适应度函数”这些术语。\n\n309\n\n\
  ![image](img/image243.png)图 16.1 遗传算法的无限循环。种群中的每个个体都有生存的机会。通过配对伙伴提供的遗传信息重组产生新的染色体，这些染色体可能会被变异破坏。\n\
  \n### 遗传算法的循环\n遗传算法以图 16.1 所示的无限循环运行。在每一个时刻，都有一个个体群体，每个个体都有特定的 `适应度函数` 值。该值随后决定了在“幸运轮”中属于该个体的片段大小，幸运轮决定了该个体的生存概率。理解这一过程的概率性质至关重要。虽然拥有较大片段的个体享有更高的生存机会，但并没有保证，因为生存游戏是非确定性的。在现实世界中，拥有优秀基因的样本也可能死于愚蠢的事故，而一个弱者可能仅仅由于好运而存活下来。但从长远来看，在大规模种群中，概率规律将有利于有助于产生高适应度的基因。\n\
  \n存活的样本随后将选择“配对伙伴”。在交配过程中，参与个体的染色体会被重组（见下文），从而产生一对新的染色体。这些新染色体随后可能会受到变异，变异本质上是给字符串添加噪声。\n\
