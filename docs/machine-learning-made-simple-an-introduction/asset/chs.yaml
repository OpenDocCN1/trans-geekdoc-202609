  \  |\n| --- | --- | --- |\n![image](img/chapter_title_above.png)\n\n## 10.2 不平衡训练集\n\
  \n![image](img/chapter_title_below.png)\n\n在讨论油泄漏领域时，第 8.2 节指出记录良好的油泄漏图像相对稀少。事实上，项目可能仅依赖几十个正示例，而负示例是充足的。这种类别的不平衡表示会对机器学习产生严重的后果。本节将解释原因，然后介绍减少其影响的一些简单方法。\n\
  \n### 简单实验\n\n假设我们拥有的训练集非常小，只包含 50 个正示例和 50 个负示例。让我们对其进行五折交叉验证¹：将其分为五个等份；然后在五次不同的运行中，我们总是移除一部分，使用剩余四部分归纳分类器，并在移除的部分上测试分类器。通过这种方式，我们消除了至少减少了训练集选择的随机性影响。最后，我们记录测试结果：正示例的分类准确率、负示例的分类准确率，以及这两个准确率的几何平均值。\n\
  \n现在假设我们意识到拥有的负示例比最初想象的要多。为了找出这些发现的财富如何影响学习，我们在之前的训练集中添加另外 50 个负示例（正示例保持不变），重复实验步骤，然后记录下新结果。\n\
  \n\n\n\n这种观察结果可能有些违背直觉。按理，如果提供了更多的训练示例，诱导分类器难道应该变得更强大吗，即使这些增加的示例恰好都属于同一类？然而，事实证明，上述这种意外的行为在许多机器学习技术中都是典型的。工程师通常将其称为类别不平衡表征问题。\n\
  \n### 多数类欠采样（机械方法）\n\n实验说服了我们，增加更多多数类的示例可能会导致诱导的分类器在少数类上的性能退化。这可能是一个严重的缺陷。因此，在溢油泄漏领域，少数类代表溢油泄漏，这是机器学习任务的主要目标。在医学诊断中，我们想要识别的任何异常通常也是少数类。而且\n\
  \n![image](img/image605.png)\n\n¹在 11.5 节中介绍的一种评估方法论。\n\n![image](img/image513.png)1\
  \ 最近邻居\n\n![image](img/image005.png)100\n\n90\n\n80\n\n70\n\n![image](img/image212.png)60\n\
  \n50\n\n40\n\n30\n\n20\n\n10\n\n0 100 200 300 400 500 600 700 800\n\n负示例数量\n\n图\
  \ 10.1 虚线：负类上的分类准确率；虚线：正类上的分类准确率；实线：两个分类准确率的几何平均值\n\n––––––––\n\n![image](img/scene_break.png)\
  \ \n\n这种情况也适用于任务是警报公司误用其产品的软件（例如，错误使用充值卡或信用卡欺诈）。在这些领域中，我们感兴趣的是少数类。我们现在知道，盲目地向训练集添加越来越多的多数类示例可能弊大于于利。\n\
  \n假设我们提供了一个极度不平衡的训练集，例如，十个示例中有九个是负样本。在这种情况下，我们通常会从移除许多负示例中获益。在最简单的方法中，这种移除可以随机进行：例如，每个负示例都有\
  \ 50% 的概率从训练集中被删除。正如我们在上面注意到的，从这个缩减的集中诱导的分类器可能优于从整个训练集诱导的分类器。\n\n### 识别原因\n\n上一段中提到的机械解决方案很难满足深思熟虑的工程师，他们想要理解为什么删除数据的技巧有效——或者反之，为什么增加多数类示例的数量可能会产生如此不利的后果。\n\
  \n假设 `1-NN` 分类器使用的训练集中，其中绝大多数示例是负样本，只有少数是正样本。此外，已知数据存在大量的类别标签噪声。将范围限制在一个易于可视化的二分类领域内，图\
  \ 10.2 的左部分展示了这样一个训练集。\n\n![image](img/image368.png)![image](img/image329.png)\n\
  \n图 10.2 在负示例远多于正示例的噪声区域中，移除参与 Tomek 链的负示例可能会提高分类性能\n\n––––––––\n\n![image](img/scene_break.png)\
  \ \n\n读者一定注意到了这一点：由于噪声的影响，几乎每个正示例的最近邻居都是负样本。在现实中，这些邻居可能是正样本，它们的负标签可以由创建训练集过程中产生的错误来解释。无论如何，`1-NN`\
  \ 分类器误分类了这些正示例，这就是为什么会有如此多的假阴例，而只有少数（如果有的话）假阳例。\n\n读者一定注意到了这一点：由于噪声的影响，几乎每个正示例的最近邻居都是负样本。在现实中，这些邻居可能是正样本，它们的负标签可以由创建训练集过程中产生的错误来解释。无论如何，`1-NN`\
  \ 分类器误分类了这些正示例，这就是为什么会有如此多的假阴例，而只有少数（如果有的话）假阳例。\n\n当然，并不是所有的机器学习范式都会像 `1-NN` 分类器那样受到这种影响。但它们在某种程度上都会受到影响，而我们现在理解了其中的原因。\n\
  \n### 启发式解决方案：单向选择\n\n了解问题的根源后，我们准备好了一个补救措施。由于问题的产生是噪声示例，我们建议一种方法。即，能够识别可疑示例的简单算法：Tomek\
  \ 链。两个示例 `x` 和 `y` 参与一个链当满足以下条件时：\n1. `x` 和 `y` 标签不同；\n2. `x` 的最近邻居是 `y`；\n3. `y`\
  \ 的最近邻居是 `x`。\n\n该原理被称为单向选择，因为只有链的一侧被选择纳入训练集中。将该技术应用于左图的训练集，我们将得到类似于右图的较小训练集。\n\n\
  ### 反向解决方案：少数类过采样\n\n然而，在某些领域，训练集太小，通过欠采样进一步缩小规模是不可能的。即使多数类示例也是稀疏的，删除其中任何可能会移除学习任务的关键方面，从而损害分类器的性能。\n\
  \n在这种情况下，相反的方法有时更好。与其移除多数类示例，不如添加少数类的示例。由于我们没有该类的真实示例，我们必须创建它们。可以通过两种基本方式：\n\n1.\
  \ 为每个少数类示例创建一个副本并加入训练集。或者，可以为每个示例创建两个或多个副本。\n\n2. 为每个少数类示例创建一个稍微修改的版本并加入训练集。修改是通过连续属性的微小（随机）更改实现的；离散值的更改虽然可行但并不有用。\n\
  \n图 10.2 的左部分帮助我们理解为什么这样做有效。在某些“受影响”正示例（那些最近邻居被噪声转为负样本的示例）周围，少数类过采样插入了额外的正示例；结果是\
  \ `1-NN` 分类器不再被误导。该原理也有助于其他类型分类器的行为。\n\n––––––––\n\n![image](img/scene_break.png)\n\
  \n### 你学了什么？\n\n为了确保你理解了这个主题，请尝试回答以下问题。如果有困难，请返回上文中相应的部分。\n\n- “不平衡训练集”一术指的是什么？解释为什么从不平衡训练集进行归纳往往会产生令人失望的结果的主要原因。\n\
  - 多数类欠采样的本质是什么？解释机械方法，然后介绍使用 Tomek 链的单向选择的动机和原理。\n- 少数类过采样的原理是什么？描述并讨论创建添加到训练集新示例的两种替代方法。\n\
  \n\n\n\n![image](img/chapter_title_below.png) \n\n到为止，我们一直下意识地假设给定类别的底层“含义”是固定且不可变的，一个分类器一旦被归纳，在任何情况下都会表现出相同（或至少相似）的行为。然而，情况并非总是如此。\n\
  \n### 上下文依赖的类\n\n某些类会随着情况而改变其本质。如果你仔细想想，你会发现日常生活中许多概念都是此类情况。因此，“时尚服装”的含义会随时间而变化，不同的文化对想穿的衣服有不同的想法。“先进技术”在\
  \ 100 年前与现在完全不同。即使是像“民主”或“公正”这样臭名昭著术语，其本意也取决于政治背景和历史情况。如果你想要一个更有技术性的例子，可以考虑语音识别软件遇到的问题：每个人都知道同一个单词在英国和北美的发音往往不同；但软件应该“理解”来自这两个背景的说话者。\n\
  \n### 上下文依赖的特征\n\n根据本书的需求，上下文被理解为“一种孤立来看时对类没有影响，但与其他特征结合时仍会影响类的特征”。\n\n![image](img/image112.png)![image](img/image112.png)例如，假设你想归纳出一个能够提供医疗诊断建议的分类器，根据一组症状来识别\
  \ `X`。某些属性（例如性别）没有任何预测能力；患者为男性并不是患前列腺癌的证据；但属性值 `gender=female` 明确表明该类不是前列腺癌。这，当然是一个极端样本。在其他诊断中，`gender`\
  \ 的影响将限于影响某些实验室检查的临界值，例如 `p 0:5` 是男性患者的临界阈值，而女性患者为 `p 0:7`。或者，先验概率会受到影响，乳腺癌更常见于女性，尽管男性也会患此病。\n\
  \n### 上下文依赖领域中的归纳\n\n假设你想归纳一个语音识别系统，并且有一组同时来自英国和美国说话者的训练示例。假设描述每个示例的属性向量包含“上下文”属性，即说话者的来源。其他属性捕捉了具体数字信号的属性。每个类标签代表一个不同的音素。\n\
  \n为了归纳一个对于每个属性向量决定其代表哪个音素的分类器，工程师本质上可以遵循两种不同的策略。第一种利用上下文属性，将训练示例分为两个子集，一个用于英国说话者，一个用于美国说话者；然后从这些训练子集中的每一个归纳出一个独立的分类器。第二种策略将所有示例混合在一个大的训练集中，并归纳出一个“通用”分类器。\n\
  \n实践经验表明，在此类应用中，只要嵌入分类器的实时系统知道应该使用哪一个，那么第一种策略的表现更好。这一决策可以通过额外的二值分类器来辅助，该分类器经过训练用于区分英国说话者和美国说话者。\n\
  \n### 概念漂移\n\n有时，上下文会随时间变化。之前提到的“时尚服装”例子属于这一类，政治术语也是如此。在这种情况下，机器学习专家称之为“概念漂移”（concept\
  \ drift）。他们的意思是类的含义随着时间而改变。\n\n漂移有许多方面。其中之一是类改变的程度。另一个值得考虑的特征是漂移的“速度”。在极端情况下是突发变化：在某一时刻，一个上下文被简单替换。然而，更常见的情况是变化是渐进的：它是逐步替换的。\n\
  \n### 随变化类的归纳\n\n遇到概念漂移的最简单场景可能是 `Fig.10.3` 所示的。在这里，分类器面临一个逐个到达的示例流。每当一个示例到达时，它被处理。可能存在或不存在反馈回路告诉系统（立即或在延迟后）分类是否正确，如果不正确，正确的标签应该是什么。\n\
  \n如果有理由怀疑可能发生偶尔的概念漂移，那么利用如所示的滑动窗口可能是一个好主意。分类器仅从“通过窗口看到的”示例中归纳。每当一个新示例到达时，它被添加到窗口中。每当认为合适，就会删除旧示例，一次删除一个或删除一组。\n\
  \n![image](img/image414.png)![image](img/image226.png)图 10.3 一个窗口滑过示例流；“当前分类器”定期更新以反映类的变化。偶尔，\n\
  \n![image](img/image550.png)如果底层递归发生，则删除之前的分类器，“删除最旧的 25% 示例”。删除的动机很简单：工程师希望窗口只包含最近的示例，怀疑旧示例属于过时的上下文。\n\
  \n如已经提到的，分类器应该只反映包含在窗口中的示例。在简单的实现中，每当窗口内容变化时，就会重新归纳分类器。或者，窗口内容的变化可能只触发分类器的修改/适应。\n\
  \n图 10.3 显示了这种学习范式的另一个方面面：有时，旧的上下文可能会重新出现（例如，由于某种“季节性”）。由于这个原因，存储以前归纳过的分类器版本可能是一个好主意，以便将来可能被重新使用。\n\
  \n### 滑动窗口方法中的工程问题\n\n希望实现滑动窗口方法的工程师需要考虑某些基本问题。首先是窗口大小的问题。如果窗口太小，它包含的示例可能不足以进行成功学习。如果窗口太大，那么它可能包含来自过时上下文的示例。理想情况下，只要可以假设上下文没有变化，窗口就应该增长（不删除旧示例）。当检测到变化时，应该删除一定数量的旧示例，因为它们不再被信赖。\n\
  \n这引导我们进入下一个重要问题：如何识别上下文发生了变化？一个简单的解决方案依赖于对分类器行为的反馈。上下文的变化随后通过分类性能的突然下降来识别。\n\n\n\
  \n\n最后，问题在于从窗口（window）中删除多少个最旧的示例。答案将取决于上下文变化的平缓程度，也取决于这种变化的程度。在一种极端情况下，突然且显著的变化将要求删除所有示例。在另一个极端情况下，两个非常相似的上下文之间的缓慢过渡只需要删除少数最旧的示例。\n\
  \n––––––––\n\n![image](img/scene_break.png) \n\n## 你学了什么？\n\n为了确保你理解了这一主题，请尝试回答以下问题。如果你有困难，请回到前文中对应的部分。\n\
  \n• 给出某些领域的示例，在这些领域中，给定类的含义随时间和/或地理位置而变化。给出某些领域的示例，在这些领域中之前的含义会再次出现。\n\n• 描述基于时间排序示例流的基本场景。解释在时变领域中滑动窗口归纳法的原理。\n\
  \n• 简要讨论滑动窗口法中遇到的基本工程问题。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \  ||  || ![image](img/chapter_title_corner_decoration_right.png)  |\n\n| --- |\
  \ --- | --- |\n\n![image](img/chapter_title_above.png) \n\n## 10.4 未知属性值\n\n在许多领域中，某些属性值是未知的。患者拒绝提供他的年龄，测量设备故障了，某些信息丢失了——或者由于其他任何原因不可用。结果，我们得到了一个不完整的训练集，如表\
  \ `10.1` 所示，其中某些值被替换为问号。在某些领域中，问号代表了所有属性-值字段的相当比例，这可能会增加学习任务的复杂度。工程师需要理解未知值可能造成的损害，以及存在哪些解决方案。\n\
  \n### 不利影响\n\n对于 `k-NN` 分类器的简单版本，只有当向量中的所有值都已知时，才能计算两个向量之间的距离。确实，可以修改距离度量，使其量化例如“红色”和“未知”之间的距离；但以这种方式计算出的距离往往是随意的（ad\
  \ hoc）。\n\n在线性和多项式分类器的情况下，情况并不更好。在不知道所有属性值的情况下，无法计算加权和 `wixi`，其符号告诉分类器应该选择哪个类标签。同样，未知的属性值增加了贝叶斯分类器和神经网络的使用难度。\n\
  \n从这个意义上说，决策树更加灵活。在对示例进行分类时，值未知的属性可能不需要测试（它不会出现在从根节点到终端节点的路径上）。\n\n### 填充缺失值的简单方法\n\
  \n在一个训练集足够大且仅包含少量问号的领域中，移除并删除所有具有未知属性值的示例通常没有害。然而，在问号数量极高的领域，这种做法将变得不实际，因为删除所有受影响的示例将破坏训练集的大部分，并在此过程中丢失价值的信息。\n\
  \n![image](img/image646.png)表 `10.1` 缺失值的训练示例\n\n![image](img/image097.png)\n\n\
  1.  未知属性值 `203`\n\n在这种情况下，我们可能尝试用某些值替换问号，尽管这些值可能是错误的。这很容易做到。当属性是离散的，我们可以简单地将问号替换为属性最频繁的值。因此，在表\
  \ `10.1` 中，示例 `ex8` 中 `crust-shade` 的未知值将被替换为 `white`，因为这是该属性在该特定训练集中最频繁的值。对于连续值属性，可以使用平均值。在\
  \ `ex6` 和 `ex10` 中，`weight` 的值是未知的。\n\n\n\n\n\n在许多领域，训练示例由大量的属性描述：多达数万个甚至更多。从这类数据源中学习的成本可能是高得令人接受的。此外，我们必须面对可学习性问题，以及与无关属性或冗余属性相关的问题。为了避免不必要的失败，工程师需要熟悉选择最合适属性的方法。\n\
  \n### 无关和冗余属性\n并非所有属性都是平等的。某些属性在意义上是**无关的**，因为它们的值对示例的类别没有影响。另一些在意义上是**冗余的**，因为它们的值可以从其他属性的值获得：例如，`age`（年龄）可以从`date-of-birth`（出生日期）的值获得。这类属性可能会误导某些归纳技术。例如，无关属性（以及程度较小的冗余属性）会扭曲由\
  \ `k-NN` 分类器计算的向量间距离。其他范式（如决策树）受影响较小，但即使它们也可能遭受过高计算成本的影响。\n\n### 极长属性向量\n某些领域（如自动文本分类）以数万计的属性为特征，这通常会导致问题。困难之一是可学习性降低：归纳出的分类器容易过拟合训练数据，在对未来示例进行测试时会让用户失望。此外，计算成本可能是不可接受的，特别是当使用多层神经网络时：每增加一个属性都会增加需要训练的权重数量，从而增加计算。\n\
  \n此外，由数千个属性描述的示例不可避免是稀疏的，众事实这会误导许多机器学习方法。例如，`k-NN` 分类器的稀疏性问题在第 3 章中已经解释过。\n\n然而众所周知，从任何角度来看，大多数属性都是没用的，因此应该被丢弃。\n\
  \n### 属性选择的过滤方法\n属性选择最简单的方法可能是基于机器学习所谓的“过滤”（filtering）。其思想是计算每个属性对当前分类任务的“效用性”，然后根据这一标准对其进行排序。意图是选择排名前\
  \ `N` 百比的属性。截断点 `N` 的选择通常通过试错法完成。\n\n在对属性进行排序时，如果属性是离散的，可以使用第 6.3 节中的信息增益。得益二值化机制的存在（见第\
  \ 6.4 节），即使对于连续值属性，实际上也可以信息增益；然而，在这种情况下通常更倾向于使用相关性的统计方法。\n\n批评属性过滤的一个原因是，这种方法忽略了属性之间存在的关系。这使得识别冗余属性变得困难甚至几乎不可能。正如我们所知，冗余属性没有提供其他属性提供之外的任何额外信息；然而，它的信息增益可能很高。\n\
  \n有一种相对简单的方法可以克服这一弱点。我们归纳出一棵决策树，然后只使用那些在树内部节点测试中遇到的属性。细心的读者会想起，这种方法在第 8 章讨论的一些简单应用中被用过。\n\
  \n### 属性选择的包装方法\n更强大但计算成本也更高的是所谓的属性选择的“包装”（wrapper）方法。以下是其基本原理。假设我们想要比较两个属性集 `A1`\
  \ 和 `A2` 的质量。从原始训练集 `T` 中，我们创建两个训练集 `T1` 和 `T2`。在这两个集中，所有示例的类别标签都与 `T` 相同。然而，`T1`\
  \ 使用 `A1` 描述示例，而 `T2` 使用 `A2`。从这两个新创建的训练子集中，归纳出两个分类器并在某个独立评估集 `TE` 上对其进行评估。性能更高的属性集更好。\n\
  \n![image](img/image102.png) 这是基于搜索的算法中使用的原理，其伪代码在表 10.3 中提供。输入由训练集 `T` 和一组属性 `A`。输出是最有用属性的子集\
  \ `S⊆ A`。在开始时，`S` 是空的。在每一步中，该方法从 `A` 中选择最佳属性并将其添加到 `S` 中。什么是“最佳”，取决于由 `S` 中的属性描述的示例归纳出的分类器（在独立测试集上）的分类性能。如果不再向\
  \ `S` 中添加任何属性都不会导致分类性能的提高——或者没有更多属性可以添加到 `S` 中——则算法终止。\n\n### 表 10.3 一种顺序属性选择的包装方法\n\
  ![image](img/image309.png)\n\n将可用的预分类示例集分为两部分，`TT` 和 `TE`。令 `A` 为属性集。创建一个空集 `S`。\n\
  \n1. 对于 `A` 中的每个属性 `ati`：\n    1. 将 `ati` 添加到 `S` 中；令 `TT` 和 `TE` 中的所有示例都由 `S` 中的属性描述；\n\
  \    2. 从 `TT` 归纳出一个分类器，然后在 `TE` 上评估其性能；用 `pi` 标示此性能；\n    3. 从 `S` 中移除 `ati`。\n\
  2. 识别出产生最高 `pi` 值的属性。从 `A` 中移除该属性并将其添加到 `S` 中。\n    1. ![image](img/image267.png)\
  \ 如果 `A` 为空，则停止；如果最后添加的没有提高性能，则从 `S` 中移除最后一个属性并同样停止。在这两种情况下，`S` 都是最终的属性集。\n    2.\
