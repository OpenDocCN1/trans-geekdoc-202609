  \  |\n| --- | --- | --- |\n\n![image](img/chapter_title_above.png) \n\n## 2.5 高斯“钟形”函数：标准\
  \ pdf\n\n![image](img/chapter_title_below.png) \n\n近似 `pdf` 的方法之一是使用上一节中的离散化技术。或者，我们可以利用已知适用于许多现实情况的标准化模型。也许其中最流行的是高斯函数，它以这位伟大的德国数学家命名。\n\
  \n![image](img/image112.png)![image](img/image112.png) 形状及其描述它的公式\n\n图 2.3 中的曲线是一个例子；它的形状揭示了为什么人们将其称为“钟形函数”。曲线在均值\
  \ `µ` 处达到最大值，并随着 `x` 远离 `µ` 而优雅地下降。我们可以预期这种模型是 `x = 99.7` 华度的密度。用数学表达式，高斯函数由以下公式定义，其中\
  \ `e` 是自然对数的底：\n\n```\np.x/ = k · e^{-(x-µ)² / 2a²\n```\n(2.10)\n\n![image](img/image602.png)注意\
  \ `x` 与 `µ` 的差异越大，曲线越陡；这取决于 `a²`。方差越大曲线越平坦；相反，较小的方差定义了越窄的曲线。系数 `k` 的任务是使钟形函数的面积等于\
  \ 1，正如理论要求的那样。这种情况发生在：\n\n```\nk = 1/(a · sqrt(2π))\n```\n\n### 设置参数值\n\n为了在使用该模型近似\
  \ `pdf` 时，我们只需要估计参数值 `µ` 和 `a²`。这很容易。假设 `ci` 在训练示例中有 `m` 个代表。如果 `xi` 是给定属性的值，那么均值和方差分别使用以下公式计算：\n\
  \n```\nµ = 1/m * sum_{i=1}^m xi\na² = (1/(m-1)) * sum_{i=1}^m (xi-µ)²\n```\n(2.11)\n\
  \n22\n\n![image](img/357.png)简单来说，高斯中心 `µ` 通过训练示例的算术平均值获得，而方差通过与 `µ` 之间差值的平均值获得。注意在计算方差时，我们除以\
  \ `m-1`，而不是预期的 `m`。其目的是补偿 `µ` 本身只是一个估计值的事实。因此，方差应该比除以 `m` 时略大。当然，这只有在训练集较小时才重要：对于\
  \ `m`，`m` 和 `m-1` 之间的差异是可以忽略的。\n\n###---\n\n## 2.6 使用高斯集合近似 PDF\n\n虽然钟形函数在许多现实领域中是近似\
  \ `pdf` 的良好机制，但它并不是万能药。某些变量并不是这样变化的。只需考虑一个混合了小学生及其父母的组的体重分布。如果我们使用离散化方法创建 `pdf`，我们将观察到两个峰：一个属于孩子，另一个属于成人。如果事实证明父亲体重分布在比母亲更高的均值周围，则可能有三个峰。\n\
  \n组合高斯函数\n\n无疑，单个钟形函数会误导这种情况。但如果我们把两个或多个组合在一起呢？如果我们知道示例的多样来源，我们可以为每个来源创建一个单独的高斯函数，然后将钟形函数叠加在一起。这能解决我们的问题吗？\n\
  \n\n\n\n\n诚实的回答是：“是的，在那种理想情况下是这样的”。但在现实中，很少能够获得关于不同来源的先验知识。更好的解决方案是将体重值划分为许多随机组。在极端情况下，我们甚至可以让每个示例自成为一个“组”，然后根据该示例的体重值识别出一个高斯中心，从而获得\
  \ `m` 个钟形函数（对应 `m` 个示例）。\n\n### 合并它们的公式\n\n假设我们想要近似连续属性 `x` 的概率密度函数（pdf）。如果我们用 `µi`\
  \ 表示第 `i` 个示例中 `x` 的值，那么该 pdf 可以由以下 `m` 个函数的之和来近似：\n\n```\np.x/ D k · †^m .x\\-µi/2\n\
  ![image](img/image457.png)e^(\\-) 2a 2  (2.14)\n```\n\n与之前一样，这里的归一化常数 `k` 是为了确保曲线下的面积为\
  \ 1。当 `k` 如下所示计算时，即可实现这一点：\n\n```\n![image](img/image353.png)1\n![image](img/image360.png)map2n\n\
  ––––––––\n![image](img/scene_break.png) (2.15)\n```\n\n从数学上我们知道，如果 `m` 足够高，公式 (2.14)\
  \ 就可以以任意任意的近似 pdf。\n\n`![image](img/image351.png)` \n\n### 示例说明\n\n图 2.4 展示了使用包含\
  \ `m` 个示例的训练集的方法，其中属性 `x` 的值为 `x1` = 0:4；`x2` = 0:5 以及 `x3` = 0:7。\n\n`![image](img/image112.png)``![image](img/image112.png)`和\
  \ `x3` = 0:7。上方三个图表显示了三个钟形函数，每个都以这些点之一为中心，方差始终为 `a²` = 1。底部的图表显示了通过组合公式 (2.14) 和\
  \ (2.15) 创建的复合 pdf，使用了均值 `µ1` = 0:4、`µ2` = 0:5 和 `µ3` = 0:7，以及 `a²` = 1：\n\n```\n\
