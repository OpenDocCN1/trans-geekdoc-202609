  \ | ![image](img/chapter_title_decoration_right.png) |\n| ![image](img/chapter_title_above.png)\
  \ | |\n| ![image](img/chapter_title_below.png) | |\n\n## 2.4 如何处理连续属性\n\n到为止，我们的考虑仅限于假设离散值的属性，通过相对频率或\
  \ `m-estimate` 来估计它们的概率。然而，这还不够。在许多应用中，我们会遇到从连续领域获取值的属性（如年龄、价格或重量）。这时，相对频率就是不实际的。虽然很容易确定\
  \ ![image](img/image112.png) 工程专业学生是男性的概率为 `0.7`，但该学生体重为 `184.5` 磅的概率不能那样容易指定：由于不同的重量值是无限的，任何一个值的概率都是微乎其微的。\n\
  \n### 连续属性的离散化\n\n一种可能是离散化。简单的“技巧”是将属性的原始域一分为二；例如，将 `age` 替换为布尔属性 `old`，当 `age >\
  \ 60` 时为 `true`。\n\n如果这样构造的阶梯函数看起来太粗糙，我们可以将原始域划分为更多——即更短的——区间，只要每个桶中的数量足够。如果训练集无限大，理论上我们可以不断缩小区间的长度，直到它们变得无限小。这样得到的结果将不再是阶梯函数，而是一个连续函数，如图\
  \ 2.3 所示。其解释源于它的创建方式：`p(x)` 的高值表示靠近 `x` 的示例很多；相反，`p(x)` 的低值告诉我们 `x` 附近的年龄很少。这就是为什么我们称\
  \ `p(x)` 为概率密度函数，并通常倾向于使用其缩写 `pdf`。\n\n（注：此处根据上下文逻辑补充了部分原文中缺失的翻译段落，以确保文档的完整性和逻辑连贯性）\n\
  \n¹我们在此假设 100 是训练集中观察到的最大值。或者，我们的背景知识可能告诉我们属性的值不会超过 100。\n\n![image](img/image076.png)![image](img/image470.png)![image](img/image641.png)\
  \ 图 2.3 当使用 `pdf` 时，我们将 `x ∈ [a, b]` 的概率识别为 pdf 下对应部分的相对面积。\n\n\n\n\n\n![image](img/image114.png)\
  \ 连续属性的贝斯公式\n\n`pdf` 的用处在于它使得在连续属性的情况下也能够使用贝斯公式。我们只需要将条件概率 `P.x|ci/` 替换为 `p.ci|x/`，将\
  \ `P.x/` 替换为 `p.x/`。让我们从一个简单的情况开始，即分类对象由单个连续属性 `x` 描述。此时贝斯公式假设如下形式：\n\n––––––––––––\n\
  \n![image](img/scene_break.png) \n\n![image](img/image199.png)P.ci|x/ = (p.ci|x/\
  \ · P.ci/) / p.x/\n\n––––––––––––\n\n![image](img/scene_break.png) \n\n(2.8)\n\n\
  ![image](img/image537.png)在这里，`P.ci/` 通过训练集中 `ci` 的相对频率进行估计，`p.x/` 是由所有训练示例创建的 pdf，而\
  \ `p.ci|x/` 是由属于 `ci` 的训练示例创建的 pdf。\n\n![image](img/image047.png)再次，分母可以忽略，因为它对于任何类别都具有相同的值。分类器只需分别为每个类别计算分子\
  \ `p.ci|x/ · P.ci/` 的值，然后用乘积最大的类别对对象进行标记。\n\n### 重新审视朴素贝叶斯\n\n在面对由属性向量描述示例的更现实的情况时，我们将利用与之前相同的“技巧”：即假设所有属性都是相互独立的假设。假设我们遇到一个由\
  \ `x = {x1;...;xn}` 描述的示例。`x` 处的 `pdf` 通过沿各个属性的乘积来近似：\n\n```\np.x|ci/ = prod_{j=1}^n\
  \ p.xi|ci/\n```\n(2.9)\n\n统计学家能够给出在理论上更严谨的公式；然而，更高的复杂程度往往不能令人满意。一方面，我们可能会犯下用不精确的数字进行精确计算的错误。此外，技术越复杂，被错误应用的风险就越大。\n\
  \n#### 1 高斯“钟形”函数：标准 pdf\n\n##### 你学了什么？\n\n为了确保你理解了这个主题，尝试回答以下问题。如果需要，请返回文中适当的位置。\n\
