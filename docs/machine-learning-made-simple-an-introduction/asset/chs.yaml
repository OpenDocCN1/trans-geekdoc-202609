  局部极小值图 5.3 展示了梯度下降法在应用于多层感知器训练时的主要缺点。权重的改变方式保证了沿着最陡峭的坡下降。但一旦到达局部极小值的底部，就无处可去了——这很尴尬：毕竟，最终目标是到达全局最小值。这里需要两点：首先，一种识别局部极小值的机制；其次，一种从掉入局部极小值中恢复的方法。\n\
  \n在训练过程中及时识别局部极小值的一种可能性是跟踪均方误差，并在每个 epoch 结束时对整个训练集进行求和。在正常情况下，这个和往往从一个 epoch 到另一个\
  \ epoch 下降。一旦似乎达到一个几乎无法观察到误差减少的平台，就可以怀疑学习过程陷入了局部极小值中。\n\n克服这一困难的技术通常依赖于自适应学习率（见下文）以及添加新的隐藏神经元（见第\
  \ 5.5 节）。通常来说，在具有许多隐藏神经元的网络中，这个问题并不那么严重。此外，如果所有权重都非常小（例如在 `-0:01; 0:01/` 区间），局部极小值往往更浅且出现频率更低。\n\
  \n### 自适应学习率\n\n在描述误差反向传播时，我们假设用户设置的学习率 `1` 是一个常数。然而，在实际应用中情况很少如此。通常，训练从一个较大的 `1`\
  \ 开始，然后随着时间的推移逐渐减少。动机很容易猜：在开始，较大的权重变化可以减少 epoch 的数量，它们甚至可能帮助学习者“跳过”一些局部极小值。但随后，这个较大的\
  \ `1` 可能会导致“越过”最小值，这就是为什么应该减小它的值。如果我们将学习率表示为时间的函数 `1.t/`，其中 `t` 告诉我们训练正处于哪一个 epoch，那么下面的负指数公式将逐渐减少学习率（`˛`\
  \ 是负指数的斜率，`1.0/` 是学习率的初始值）：\n\n```\n1.t/ D 1.0/e^(\\-˛t) (5.4)\n```\n\n也许应该注意到，一些先进的权重变化公式能够反映“当前趋势”。例如，实现“动量”（momentum）是非常流行的：如果最后两次权重变化均为正值（或均为负值），那么增加权重变化步长是有意义的；相反，如果一个正变化之后是一个负变化（反之亦然），则应该减小步长以防止越界。\n\
  \n### 训练过度\n\n多层感知器与多项式分类器共享一个不良特性。从理论上讲，它们能够模拟任何决策边界，这使得它们容易过拟合训练数据。读者记得，过拟合通常意味着对噪声训练样本进行完美分类，这不可避免会导致未来性能表现令人失望。\n\
  \n对于小型多层感知器，这个问题并不那么痛苦；它们不够灵活，无法过拟合。但随着隐藏神经元数量的增加，网络获得了灵活性，过拟合可能变成一个真正的问题。然而，正如我们在下一节中学到的，这并不意味着我们应该总是倾向于小型网络！\n\
  \n有一种简单的方法可以发现训练过程是否达到了“过拟合”阶段。如果训练集足够大，我们可以留一部分用于测试。在每个 epoch 之后，都会测量测试数据上的误差。\n\
  \n\n\n\n# 寻找合适的尺寸\n\n上述场景在实际应用中执行成本太高了。毕竟，我们并不知道是只需要几个神经元、几十个还是几百个，在建立理想尺寸之前，我们可能需要反复运行计算密集型的训练算法很多。相反，我们希望有一种能够更高效地找到合适尺寸的技术。\n\
  \n表 5.4 中的伪代码总结了这样一种技术。其核心思想是：从一个仅包含少数隐藏神经元的极小网络开始。在每个 epoch（迭代轮）之后，学习算法都会检查训练集上观察到的均方误差和。这个误差之和可能会随着迭代次数的增加而不断减少——但仅限于某一个程度。当达到这一点时，网络的性能将不再提高，要么是因为其灵活性不足导致无法进行正确分类，要么是因为它“落”入了局部最优。\n\
  \n图 5.5 当训练集均方误差（`MSE`）似乎不再下降时，可以通过添加新的隐藏神经元来进一步提高性能。\n\n`MSE`\n\n![image](img/image196.png)\n\
  \n当观察到这种情况时，会添加几个具有随机初始化权重的神经元，并恢复训练。\n\n通常，增加的灵活性使得进一步减少误差成为可能。在图 5.5 的插图中，误差率曾两次出现“停滞”；此时添加新的隐藏神经元提供了必要的新的灵活性。\n\
