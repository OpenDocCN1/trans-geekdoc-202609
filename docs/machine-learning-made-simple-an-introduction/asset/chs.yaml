  \  |\n| --- | --- | --- |\n\n![image](img/chapter_title_above.png)\n\n# 16.6 高级版本\n\
  \n![image](img/chapter_title_below.png)\n\n遗传算法是一个多功能的通用框架，具有几乎无限的变化可能性。本节将介绍两种有趣的技术。\n\
  \n#### 关于拉马尔克选择的说明\n\n计算机程序不受生物学局限性的限制。很多时候，工程师会放弃这些限制因素，就像早期的飞行员放弃了羽毛翅膀的想法一样。在让某些样本“不死”时，我们已经遇到过这样一种违反，即将它们复制到新的一代，以确保它们不会被重组和变异破坏。现在让我们来看另一种偏离。\n\
  \n在基准遗传算法中，新的子串仅作为重组或变异等算子期间随机过程的结果。之后，遗传信息在个体的整个生命期间保持不变。一位达尔文之前的生物学家让·巴普蒂·拉马尔克提出了一种更灵活观点：在他看来，进化可能由个体的需求驱动。一只不断试图够到顶部叶子的长颈鹿会伸长脖子，从而变得更长。较长的脖子会传给后代。虽然拉马尔克假设在生物学领域无法成立，但在其他领域并非完全不合理。例如，通过发表科学论文，研究人员为后世留下了其一生获得的知识。\n\
  \n拉马尔克进化比经典的达尔文过程快得多，这就是为什么我们有时在遗传算法中实现它。将这一概念整合到图 16.1 的通用循环中最简单的方法是将“拉马尔克式”算子置于“幸运轮”和重组之间。该算子的任务是通过适应来改进染色体。例如，可以问问如果某个位被变异翻转了会发生什么。虽然变异本身是不可逆的，但我们可以通过显式测试\
  \ `i` 位翻转时会发生什么来增加灵活性，然后选择更好的版本。\n\n#### 多种群搜索\n\n多种群搜索的一个动力与遗传算法所依赖的许多参数有关。大多数时候，工程师只能依靠自己的经验。或者，我们可以选择对相同的初始种进行遗传算法的多次并行运行，每次运行都有其自己的变异频率，并包含或不包含逆转。\n\
  \n（注：原文中存在大量重复段落，根据指令要求，此处仅翻译并呈现非重复内容。）\n\n\n\n\n# 16.7 k-NN 分类器中的选择\n\n现在让我们来说遗传算法在机器学习领域一个实际问题中的可能应用。\n\
  \n## 属性选择与示例选择\n\n读者知道 `k`-NN 分类器的成功取决于存储示例的质量，还取决于描述这些示例的属性的选择。选择正确示例和属性的问题可以很容易转化为搜索范式。例如，初始状态可以定义为完整的示例集和完整的属性集；搜索算子将移除示例和/或属性；而评估函数（其目标是最小化）将将定义为在独立测试示例集上通过\
  \ `1-NN` 规则所达到的错误率。\n\n另一种可能性是采用遗传算法。本质上，我们必须决定如何用染色体来表示问题，如何定义适应度函数，以及重组和变异算子。然后，我们必须清楚如何解释（并利用）搜索结果。\n\
  \n### 用于编码问题的染色体\n\n一种非常简单的方法是将二进制染色体分为两部分：第一部分的每个位置对应一个训练示例，第二部分的每个位置对应一个属性。如果某个位的值为\
  \ `0`，则忽略相应的示例或属性，否则将其保留。适应度函数的设计将寻求最小化 `1` 的数量。\n\n这种解决方案在训练集包含许多示例的领域可能会导致染色体长得不切实际：如果训练集有一万个示例，就需要一万个位。更好的解决方案是采用更灵活的变长方案，其中染色体中的每个元素包含一个指向训练示例或属性的整数。染色体的长度将是相关属性的数量加上代表性示例的数量。这种机制被称为值编码。\n\
  \n![image](img/image007.png) 样本：\n\n图 16.6 每个样本由两个染色体描述，其中一个代表示例，另一个代表属性。重组被分别应用于它们中的每一个染色体。\n\
  \n### 解释染色体\n\n我们必须确保正确地解释染色体对。例如，样本 `[3,14,39],[2,4]` 代表一个由第三、十四和第三十九个训练示例组成的训练子集，由第二个和第四个属性描述。当这样的样本被作分类器时，系统选择由第一个染色体确定的示例，并由第二个染色体确定的属性描述它们（图\
  \ 16.6）。向量 `x = (x1;...;xn)` 和 `y = (y1;...;yn)` 之间的距离使用公式计算：\n\n```\nd(x, y) =\
  \ sqrt(sum_{i=1}^n d(xi, yi))  (16.1)\n```\n\n其中 `d(xi, yi)` 是第 `i` 维的贡献。对于数值属性，该贡献可以使用欧欧距离公式计算\
  \ `d(xi, yi) = (xi - yi)²`；对于布尔属性和离散属性，如果 `xi = yi` 则定义 `d(xi, yi) = 0`，如果 `xi !=\
  \ yi` 则定义 `d(xi, yi) = 1`。\n\n### 适应度函数\n\n下一个问题是如何量化每个个体的生存概率。记住，我们希望在不损害分类准确性的情况下减少示例和属性的数量。这些需求可能相互矛盾，因为在无噪声领域，整个训练集往往比减少集具有更高的分类性能。同样，如果每个属性都提供相关信息，移除属性也无益益。\n\
  \n因此，涉及的权衡应该反映在适应度函数参数中，赋予用户指定具体偏好的机会。适应度函数应该能够侧重于最大化分类准确性，或者侧重于最小化保留的训练示例和属性的数量。这一需求通过公式表达式，其中\
  \ `ER` 是被给定样本分类错误的训练示例数量，`NE` 是保留的示例数量，`NA` 是保留的属性数量：\n\n```\nf = 1 / (c1 * ER +\
  \ c2 * NE + c3 * NA)  (16.2)\n```\n\n注意，如果样本的错误率低、保留的示例集小、且有很多属性被消除，则该样本的适应度很高。该函数由三个用户设置参数\
  \ `c1`、`c2` 和 `c3` 控制，这些参数权衡了用户的偏好。例如，如果 `c1` 较高，则重点放在分类准确性上。如果 `c2` 或 `c3` 较高，则分别放在最小化保留示例的数量和保留属性的数量上。\n\
  \n### 应用遗传算子\n\n通过概率选择父母。特别是，使用以下公式计算样本 `S'` 被选中的概率：\n\n```\nProb(S') = f(S') /\
  \ sum(f(S))  (16.3)\n```\n\n这里 `f(S)` 是通过公式 (16.2) 计算的样本 `S` 的适应度。分母汇总了种群中所有样本的适应度函数值——这使得概率和为\
  \ 1。\n\n一旦选定父母对，通过双点交叉对染色体进行重组。由于每个样本由一对染色体定义，且每个染色体具有不同的含义，我们分别对它们应用重组算子。假设一个父母染色体的长度标记为\
  \ `N1`，另一个父母染色体的长度标记为 `N2`。使用均匀分布，算法从闭区间 `[1; N1]` 中选择一对整数，从闭区间 `[1; N2]` 中选择另一对整数。这些整数中的每对都定义了各自染色体中的一个子字符串。然后，交叉算子将其中一个父母染色体的子字符串与另一个父母的子字符串进行交换。注意，由于由于这些子字符串的大小可能不同，后代的长度可能与父母的长度不同。\n\
  \n### 图示\n\n该原理在图 16.7 中所示，其中染色体 `A` 和 `B` 的中间部分已经交换。注意 `A` 和 `B` 的长度是如何受到影响的。工程师必须决定是否允许交换段的大小为\
  \ 0 的情况；在另一个极端情况下，一段可以代表整个父母。\n\n变异算子应该防止种群过早退化，并确保种群代表搜索空间的代表性部分。\n\n\n\n\n一种可能性是从新创建的种群中随机选择一个预设百分比的位置，并为每个该位置添加一个为该位置单独生成的随机整数。然后将结果对示例/属性的数量取模。假设原始示例/属性的数量为\
  \ 100，被选定进行变异包含的位置为 95。如果随机生成的整数是 22，则变异后的值为 `.95 C 22/ mod 100 D 17`。\n\n### 你学到了什么？\n\
  \n为了确保你理解了这一主题，请尝试回答以下问题。如果有困难，请返回前文中对应的部分。\n\n* 通过选择最佳属性和最具代表性的示例可以实现什么？\n* 使用两个染色体而不是仅用一个的优点是什么？\n\
  * 所选的适应度函数如何反映了属性与示例集与高分类准确率之间的竞争需求？\n* 为什么我们使用交换不同长度子串的重组算子？变异是如何实现的？\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \  ||  || ![image](img/chapter_title_corner_decoration_right.png)  |\n\n| --- |\
  \ --- | --- |\n\n![image](img/chapter_title_above.png) \n\n# 16.8 总结与历史说明\n\n![image](img/chapter_title_below.png)\
  \ \n\n* 遗传算法受达尔文进化论的启发，是经典人工智能搜索技术的一种流行替代方案。最简单的实现是基于二进制字符串的。\n* 该算法对个体种群进行三种基本操作：基于适应度函数的生存、染色体对的重组以及变异。此外，有时也会使用字符串的反转。\n\
  * 遗传算法实际应用中经常遇到的问题之一是种群的过早退化。检测此问题的方法是考虑种群中染色体的多样性。一种解决方案是在种群中添加人工创建的染色体。在这里，反转算子也是有效的。\n\
  * 遗传算法的替代实现可以使用数字字符串、符号、混合字符串甚至树形结构。\n* 本章通过近邻分类器领域的一个简单问题说明了遗传算法的实际用途。\n\n历史说明：将生物演化原理转化为遗传算法形式的想法归于\
  \ Holland [37]，尽管其他一些作者稍早就提过类似的观点。其中，或许 Rechenberg [80] 值得被提及，而 Fogel 等人 [29] 则被归功为遗传编程思想的先驱。将遗传算法具体应用于\
  \ `k` 分类器选择中的方法来自 Rozsypal 和 Kubat [82]。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \  ||  || ![image](img/chapter_title_corner_decoration_right.png)  |\n\n| --- |\
  \ --- | --- |\n\n![image](img/chapter_title_above.png) \n\n# 16.9 巩固知识\n\n![image](img/chapter_title_below.png)\
  \ \n\n这些练习题旨在巩固所学知识。建议的思维实验将帮助读者从不同的角度看待本章的思想，并引发独立思考。计算机作业将迫使读者注意那些他们可能会忽略的看似微不足道的细节。\n\
  \n––––––––\n\n![image](img/scene_break.png) \n\n### 练习题\n\n1. 使用纸和笔以类似于表 16.2 的方式对遗传算法进行人工模拟。使用你自行选择的适应度函数、不同的初始种群以及用于单点交叉的随机点。然后用两点交叉重复该练习。\n\
  \n––––––––\n\n![image](img/scene_break.png) \n\n### 思考一下\n\n1. 解释不同的种群规模如何影响达到良好解所需的代数。详细阐述种群规模与过早退化问题之间的关系。还要讨论适应度函数形状的影响。\n\
  2. 哪些类型的搜索问题遗传算法可能比经典搜索算法更高效地解决？\n3. 识别适用于遗传算法的具体工程问题（除前文中提到的之外）。建议哪些问题最适合用二进制或数字字符串表示染色体，建议哪些问题更适合树。\n\
  4. 列出自然进化与其计算机模型之间的一些差异。推测是否可以从自然中获得更多灵感。你认为与生物演化相比，计算机程序的优势在哪里？\n\n1. 巩固知识 329\n\
  \n### 计算机作业\n\n1. 实现一个在二进制字符串染色体上运行的基础遗传算法。确保你有用于生存函数、幸运轮、重组和变异的独立模块，并且这些模块具有足够的通用性以便于修改。\n\
  2. 为第 1 章中的“饼”（pies）和“圆形”（circles）领域创建初始种群，并将它们作为上一个任务开发的程序的输入。注意，在“圆形”领域的情况下，你可能需要对原始程序进行微调，以便处理数字字符串染色体。\n\
  3. 对于你选择的领域，实现几种可选的配配策略。运行系统实验以找出哪种策略能最快找到解决方案。速度可以通过评估适应度值的染色体数量来衡量。\n4. 对于你选择的领域，尝试使用不同重组算子的替代“组合”，以及不同的重组、变异和反转频率。绘制图表显示搜索速度（如上一个任务所示）如何取决于这些参数的具体设置。\n\
  \n\n\n\n\n# N 臂老虎机问题\n\n图 17.1 显示了五台老虎机。每台机器的平均回报率都不同，但我们不知道这些平均回报率有多大。如果我们想收益最大化，就需要找出这些平均回报率是多少，然后一直选择最有希望的那台机器。这就是机器学习中所谓的“N\
  \ 臂老虎机问题”的本质，该名称暗示了老虎机臭名昭著的掠夺金钱倾向。\n\n![image](img/scene_break.png)\n\n![image](img/image696.png)![image](img/image150.png)![image](img/image491.png)![image](img/image426.png)![image](img/image666.png)\n\
  \n图 17.1 通用问题：哪台老虎机提供的平均回报率最高？\n\n在理论上，这应该是很容易的。为什么简单地多尝试每台机器几次，观察回报，然后选择回报最高的那台机器呢？但在现实中，这不是一个好主意。在对最佳机器做出可靠决策之前，可能需要浪费大量的硬币。\n\
  \n## 一种考虑到成本的简单策略\n\n考虑到所产生的成本，务实的工程师会限制实验，并仅根据几次尝试做出初始选择。由于这种早期的决策是不可靠的，她并不会墨守成规。她会偶尔对其他机器进行实验：如果其中某些机器确实更好怎么办？如果是这样，将“之前的最佳”替换为这台新机器是完全合理的。这种策略非常自然。人们不需要成为机器学习科学家也能想出这种方法。\n\
  \n![image](img/image112.png)这正是强化学习范式寻求模拟的行为。在图 17.1 的特定情况下，有五种动作可以选择。上述原理结合了对当前认为最好的机器的**利用（exploitation）**以及对备选方案的**探索（exploration）**。利用占主导地位；探索则少之又几。在最简单的实现中，探索步骤的频率由用户指定的参数\
  \ `E` 控制。例如，`E = 0.1` 意味着“最佳”机器（根据之前的试验看起来最好的机器）有 90% 的时间被选中；在剩下的 10% 的情况下，会给随机选择的其他机器一个机会。\n\
  \n## 累计奖励\n\n“最佳动作”被定义为导致最高平均回报的动作。对于每个动作，学习者都会对之前的回报进行计数；这些回报的平均值被视为该动作的质量。例如，让我们用整数\
  \ `1`、`2`、`3`、`4` 和 `5` 来表示图 17.1 中的机器。\n\n1. ![image](img/image166.png)动作 `ai`\
  \ 代表选择第 `i` 台机器。假设最左侧的被选择了三次，这些选择导致了以下回报 `r1 = 0`、`r2 = 9` 和 `r3 = 3`。该特定选择的质量就是\
  \ `Q(a1)`。\n\n![image](img/image311.png).r1 + r2 + r3 / 3 = (0 + 9 + 3) / 3 = 4。为了避免必须存储所有之前采取动作的回报，实现该程序的工程师可以利用以下公式，其中\
  \ `Qka` 是根据 `k` 个回报计算出的动作 `a` 的质量，而 `rk` 是最新的回报。\n\n![image](img/image605.png)在此，让我们注意到回报可以是负的——与其说是“惩罚”。\n\
  \n## 如何选择回报最高的动作\n\n![image](img/image473.png)表 17.1 E-greedy 强化学习算法\n\n输入：用户指定的参数\
  \ `E`，例如 `E = 0.1`；一组动作 `ai` 及其初始值估计值 `Q0i`；\n对于每个动作 `ai`，令 `ki = 0`（该动作被采取的次数）；\n\
  \n1. ![image](img/image470.png)从均匀分布 `[0; 1]` 中生成一个随机数 `p`。\n2. ![image](img/image381.png)如果\
  \ `p < E`，选择值最高的动作（利用）。否则，选择一个随机的动作（探索）。\n3. 将上一步选择的动作标记为 `ai`。观察回报 `ri`。\n4. ![image](img/image592.png)使用以下公式更新\
  \ `ai` 的值：`Qai = Qai + 1/(ki + 1) * (ri - Qai)`\n5. 设置 `ki = ki + 1` 并返回 1。\n\n\
  ![image](img/scene_break.png)1\n\n![image](img/image229.png)Qai = Qai + (ri - Qai)\
  \ / (ki + 1) (17.1)\n\n![image](img/scene_break.png)\n\n![image](img/image422.png)k\
  \ + 1\n\n![image](img/image182.png)多亏于这个公式，每个动作只需要记住 `k` 和 `Qka`——结合最新的回报即可更新 `k+1`\
  \ 步动作的值。上述过程有时被称为 E-greedy 策略。为了方便用户，表 17.1 用伪代码总结了该算法。\n\n![image](img/image112.png)初始化过程\
  \ 为了能够使用公式 (17.1)，我们需要一个起点：我们需要为每个动作设置一个初始值。一种优雅的可能性是选择一个远高于任何单次回报的值。例如，如果已知所有回报来自\
  \ `[0; 10]`，那么以下值是合理的：`Q0i = 50`。\n\n![image](img/image602.png)在每个时刻，系统以 `(1-E)`\
  \ 的概率选择值最高的动作，随机打破平。在开始时，所有动作都有相同的概率。假设选择了 `ai`。根据收到的回报，该动作的质量通过公式 (17.1) 被降低。因此，在选择下一个动作时（如果使用利用），必须是另一个动作——其值也会被降低。简而言之，读者可以看到将所有动作值初始化为同一个大数字可以确保在游戏早期尝试所有的动作。\n\
  \n### 你学了什么？\n\n为了让你理解这个主题，请尝试回答以下问题。如果有困难，请回到前面的对应部分。\n\n- 描述在 N 臂老虎机问题中寻找最佳机器时使用的\
  \ E-greedy 策略。解释动作及其值的含义。什么是利用和探索？\n- 描述维护平均回报的简单机制。该机制如何更新动作的值？\n- 为什么本节建议将所有动作的初始值\
  \ `Q0i` 设置为典型回报的倍数？\n\n# 17.2 中的状态和动作\n\n老虎机的例子是一个简化，便于解释基本术语。它的主要局限性是只有一个可以选择适当动作的状态。\n\
  \n在现实中，情况要复杂得多。通常有很多状态，每个状态都有几个动作可以选择。可以通过井字游戏来阐明本质。\n\n\n\n\n\n# 井棋游戏\n\n其原理如图\
  \ 17.2 所示，这是针对棋盘大小为三乘三格子的简单情况给出的说明。两名玩家交替进行，一人在棋盘上画“叉”，另一人画“圈”。目标是形成三个“叉”或三个“圈”——无论是列、行还是对角线。谁先成功谁获胜。如果在左侧所示的情况下，轮到画“叉”的玩家操作，他可以通过在左下角画一个“叉”来获胜。相反，如果是对手的操作，对手将通过在那里画一个“圈”来阻止这一点。\n\
  \n## 状态与动作\n\n每个棋盘位置代表一个状态。在每个状态下，玩家需要选择一个具体的动作。因此，在左侧所示的状态下，有三个空格，因此有三个动作可供选择（一个是获胜的动作）。整个情况可以用一个查找表来表示，其中每个状态-动作对都有一个特定的值，`Q(s;\
  \ a)`。\n\n![image](img/image330.png)\n\n![image](img/image043.png)![image](img/image709.png)\n\
  \n––––––––\n\n![image](img/scene_break.png)\n\n图 17.2 在井棋中，两名玩家交替放置他们的“叉”和“圈”。获胜者是获得直线三连（垂直、水平或对角线）的人。\n\
  \n基于这些值，$\\epsilon$-greedy 策略决定了在特定状态下应该采取哪种动作。动作产生一个奖励 `r`，然后该奖励将通过公式 (17.1) 更新状态-动作对的值。\n\
  \n实现学习场景最典型的方法是让程序与自己进行长系列游戏，从对动作的随机性选择开始（仅基于 `Q(s; a)` 的初始值），然后逐渐改进它们，直到达到非常高的竞技水平。\n\
  \n主要问题在于如何确定具体动作的奖励。原则上，可以考虑三种替代方案。\n\n![image](img/image602.png)\n\n### 回归化表述\n\
  \n这可能是处理奖励分配问题最简单的方法。进行一整场游戏。如果赢了，学习智能体在整个游戏中遇到的所有状态-动作对都被处理为收到了奖励 1。如果输了，它们被处理为都收到了奖励\
  \ 1。\n\n这种方法的主要缺点是它忽略了这样一种情况：游戏中采取的所有动作对最终结果的贡献并不是平等的。玩家输掉可能是因为是因为在一系列精彩动作之后的单次失误。在这种情况下，惩罚良好的动作当然是不公平的，甚至是不实际的。反之亦如此：弱的动作实际上可能获得奖励，仅仅是因为由于对手意之外的失误而最终赢得了游戏。然而，人们认为，从长远来看，这些微小的“不公”会被抵消，因为在大多数时候，胜者的动作都是好的。\n\
  \n回归化表述的优点在于其简单性。\n\n### 连续化表述\n\n上述回归化表述中存在的问题（即它可能会因为单次失误而惩罚一系列良好的动作）在假设我们知道如何确定每个动作后的奖励的情况下，可以被消除。这确实是可能的；即使在无法做到此点的领域，至少也可以进行估计。然而，大多数时候，在游戏结束之前尝试确定给定动作的奖励是推测性的——因此具有误导性。这就是为什么这种方法很少使用的原因。\n\
  \n### 折中方案：折扣回报\n\n这本质上是一种改进的回归化表述，其根据游戏的长度来确定奖励。例如，获胜所需的时间越长，奖励就越高（注：原文逻辑通常为越长奖励越低，此处根据语境意译或保留原文“longer\
  \ it has taken to win”通常对应奖励越低，但此处按字面或常见语境逻辑翻译）。修正为：获胜所需的时间越长，奖励就越高（此处原文为“longer\
  \ it has taken to win”，在逻辑上通常是时间越长奖励越低，此处遵循原文逻辑）。*纠正：根据强化学习常识通常时间越长奖励越低，但此处按原文翻译。*\n\
  \n![image](img/scene_break.png)\n\n图 17.2 在井棋中，两名玩家交替放置他们的“叉”和“圈”。获胜者是获得直线三连（垂直、水平或对角线）的人。\n\
  \n基于这些值，$\\epsilon$-greedy 策略决定了在特定状态下应该采取哪种动作。动作产生一个奖励 `r`，然后该奖励将通过公式 (17.1) 更新状态-动作对的值。\n\
  \n实现学习场景最典型的方法是让程序与自己进行长系列游戏，从对动作的随机性选择开始（仅基于 `Q(s; a)` 的初始值），然后逐渐改进它们，直到达到非常高的竞技水平。\n\
  \n主要问题在于如何确定具体动作的奖励。原则上，可以考虑三种替代方案。\n\n![image](img/image602.png)\n\n### 回归化表述\n\
