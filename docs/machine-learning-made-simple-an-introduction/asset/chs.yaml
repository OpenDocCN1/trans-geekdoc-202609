  \n表 16.1 遗传算法的原理\n\n1. 评估每个个体的适应度。\n2. 存活者选择配对伙伴。\n3. 通过重组创建新个体。\n4. 个体受到变异影响。\n\
  5. 除非满足终止条件，否则返回步骤 1。\n\n---\n\n## 16.2 实现各个模块\n\n让我们仔细观察如何在程序中实现遗传算法的基本方面：生存游戏、交配过程（伙伴选择）、重组和变异。起初，我们将讨论简单的解决方案，将更高级的技术留到后面的章节。\n\
  \n为了简单起见，我们假设染色体采用二进制字符串的形式，例如 `[1 1 0 1 1 0 0 1]`，其中每个位代表某个属性，存在则位值为 1，不存在则为 0。因此，在简化的“派”问题中，第一个位可能表示饼皮有多厚，第二个位可能表示填充物是黑色，以此类推。\n\
  \n### 初始种群\n创建初始种群的最方法将采用随机数生成器。有时，工程师可以依靠某些知识来帮助创建优于随机生成个体的初始染色体。\n\n### 生存游戏\n\
  遗传算法假设有一种方法可以计算每个样本生存概率。在某些应用中，这些概率可以通过实际实验、让个体样本相互竞争来确定。在其他领域，适应度是由用户指定的评估函数计算的，其值取决于染色体的属性。如果染色体代表一个分类器，适应度函数可以依赖于分类器正确标记的训练示例的百分比。\n\
  \n\n\n\n\n![image](img/image102.png)![image](img/image112.png)个体的生存是由概率决定的。以下是在计算机程序中实现这种“幸运轮”的方法。让\
  \ `Fi` 表示第 `i-th` 个样本的适应度（fitness），让 `F = ∑ Fi` 为所有个体适应度值的总和，然后将这些值排列在区间 `[0; F]`\
  \ 之上。生存过程通过随机数生成器进行建模，该生成器返回 `[0; F]` 中的某个值 `r`：被 `r` “命中”的子区间的序号即指向了幸存者。该原理如图 16.2\
  \ 所示，对于一个包含四个样本的小种群，如果随机数落在第三个区间，则选择第 3 个个体。如果命运想要有 20 个样本存活，它就必须生成 20 个随机数，通过这些随机数在区间\
  \ `[0; F]` 中所在的位置来确定幸存者。\n\n虽然适应度较小的样本很可能被淘汰，但适应度较高的个体可能会多次出现在幸存者池中。生物学家会对这种“克隆”想法皱皱眉，但在计算机程序员的务实世界里，同一个个体可以“存活”两次、三次甚至很多次。\n\
  \n## 交配算子\n\n在生存游戏之后是交配。在自然界中，个体通过力量、速度或锋利的牙齿来判断伙伴的合适性。计算机实现中，通过适应度函数实现了类似的任务。\n\
  \n––––––––\n\n![image](img/scene_break.png) \n\n随机数\n\n![image](img/image402.png)\n\
  \n0 8 13\n\n22 25\n\n个体 1\n\n个体 2\n\n个体 3\n\n个体 4\n\n图 16.2 轴表示一个包含四个个体的种群，它们的适应度值分别为\
  \ 8；5；9；和 3。由于随机生成的数字 15 落在第三个子区间，因此选择了第三个个体\n\n尽管如此，仍然存在一种区别：性的概念通常被忽略了——任何染色体都可以与任何染色体交配。\n\
  \n一种几乎微不足道的交配策略将个体随机配对，也许是从区间 `[1; Ns]` 中随机生成整数对，其中 `Ns` 是种群中的样本数量。然而，这种技术未能考虑到高适应度样本可能被认为比其他样本更有吸引力这一事实。在计算机程序中反映这一点的简单方法是按照适应度从高到低对个体进行排序，然后将相邻个体配对。另一种策略是按概率执行的。它选取排名最高的个体，然后使用生存游戏中所采用的机制选择其伙伴——参见图\
  \ 16.2。对排名第二高的个体执行相同的操作，然后是第三，以此类推，直到新种群达到所需的规模。因此，“更好”的个体可能（尽管不能保证）与其他强壮个体交配。有时，伙伴的价值会较低（由于概率选择导致），但这产生了多样性，使系统有机会保留那些珍贵的染色体片段，这些片段只是因为运气不好，目前被包含在低质量的样本中。\n\
  \n## 长寿与不朽个体\n\n该算法的缺点之一是，非常优秀的有机体可能会被价值较低的后代取代，有用的基因可能会消失。为了防止这种情况发生，某些计算机程序会将最好的样本连同后代一起复制到新代中。例如，程序可能直接在新生代中插入\
  \ 20% 的最佳幸存者，然后通过对前 95% 的个体应用重组和变异算子创建剩余的 80%，完全忽略底部的 5%。这样，不仅最好的样本能活得更久（甚至变得“不朽”），程序还将剔除一些纯靠运气存活的极弱个体。\n\
  \n![image](img/image112.png)![image](img/image112.png)![image](img/image102.png)\n\
  \n## 染色体重组：单点交叉\n\n实现染色体重组简单的方法是通过单点交叉，一种交换父染色体部分信息的算子。其原理简单。假设每个染色体由一个 `n` 位的字符串组成，且随机数生成器返回了\
  \ `[1; n]` 中的一个整数 `i`。那么，第一条染色体的最后 `i` 位（其 `i` 位尾部）被用第二条染色体的最后 `i` 位替换，反之亦然。具体的实现可以允许\
  \ `i = n` 的情况，在这种情况下，两个孩子只是其父母的复制。在下面的示例中，随机整数为 `i = 4`，这意味着交换了 4 位的尾部（交叉点用空格表示）。\n\
  \n```\n1101 1001\n0010 0111 )\n1101 0111\n0010 1001\n```\n\n读者可以看到，孩子倾向于像它们的父母，特别是当交换的尾部较短时。孩子与父母之间的最大距离在\
  \ `i = n - 1` 时达到。\n\n在许多应用中，重组算子仅应用于一定百分比的个体。例如，如果选择了 50 对个体进行交配，且重组概率被用户设置为 80%，那么只有\
  \ 40 对将接受重组，而剩余的 10 对将仅仅被复制到下一代。\n\n![image](img/image112.png)\n\n## 变异算子\n\n变异的任务是破坏遗传的遗传信息。通俗地说，这是通过翻转一小百分比的位来实现的，即改变一个位的值，0\
  \ 变为 1 或反之。具体的百分比（变异频率）是一个用户设置的参数。假设该参数要求平均每个位从 `[1; 100]` 中生成一个随机整数。如果该整数等于 1，则改变该位，否则保持不变。\n\
  \n让我们思考我们需要什么样的变异频率。在极端情况下，非常稀有的变异几乎没有任何影响。在另一种极端，极高的变异频率会通过破坏太多染色体而干扰遗传搜索。如果频率接近\
  \ 50%，每个新染色体将表现为随机生成的位字符串；遗传算法将退化为随机生成器。\n\n变异算子的作用与交叉算子不同。在单点交叉中没有产生新信息，只是交换了现有的片段。变异引入了种群中此前不存在的新花样。\n\
