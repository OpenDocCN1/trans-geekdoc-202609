  \n## 7.4 VC 维与学习性\n\n![image](img/chapter_title_below.png)\n![image](img/image421.png)\n\
  \n到目前为止，我们只处理了假设数量有限的领域。现在让我们关注假设空间是无限的领域，这在至少某些属性是连续值的应用中通常是不可避免的。在这种情况下，比较两类分类器的学习性似乎几乎是不可能的，因为它们的\
  \ `H`  都是无限的。首先，读者会同意某些类分类器（例如，多项式）比其他分类器（例如，线性）更灵活。这种灵活性可能会对学习性产生某些影响吧？确实如此。让我们快速看看理论家们在这种情况下是如何量化学习性的。\n\
  \n### 被打碎的训练集\n考虑图 7.1 左侧所示二维空间中的三个例子。无论我们如何在它们之间分配正负标签，我们总能找到一个线性分类器来区分这两类。我们称这组样本被线性分类器“打碎”了。\n\
  \n![image](img/image113.png)![image](img/image039.png)\n![image](img/image671.png)![image](img/image671.png)![image](img/image671.png)\n\
  \n图 7.1 左侧的三个点集被线性分类器“打碎”。右侧的三个点没有被线性分类器打碎，因为没有一条直线可以将中间的点与两侧的点分开。\n\n––––––\n\n\
  ![image](img/scene_break.png)\n\n然而，右侧三个点的情况并非如此。我们可以看到，这些点发现自己都在同一条直线上。如果我们把中间的点标记为正，另外两个标记为负，那么没有任何线性分类器能够成功地将这两类分开。换句话说，这组样本没有被线性分类器打碎。不同的分类器类具有打碎给定样本集的不同能力。例如，抛物线（一种特殊的二次函数，即多项式函数）将打碎右侧三个对齐的点；它甚至能打碎四个不在同一直线上的点。其他分类器类，如高阶多项式，将打碎任何实际尺寸的样本集。\n\
  \n### Vapnik-Chervenkis 维\n给定分类器类的 Vapnik-Chervenkis 维（通常缩为 `VC-dimension`）定义为该类打碎的最大样本集的大小。\n\
  \n![image](img/image112.png)\n\n我们已经看到在二维空间中，线性分类器无法打碎处于同一直线上的三个点，但无论我们在平面上如何四个点，总有一种标记方式使其无法线性分离。\n\
  \n### 连续领域的学习性\nVC 维的概念让我们能够处理连续领域的学习性。让我们在这里给出一个著名定理的略微修改版本，省略了对我们需求无关的技术细节：\n\n\
  ![image](img/image602.png)![image](img/image102.png)\n\n如果分类器类 `H` 的 VC 维 `d` 是有限的，那么当目标类与某个假设\
  \ `h` 相同且样本数量 `m` 满足以下不等式时，以 `1-δ` 的置信度获得低于 `E` 的错误率：\n\n![image](img/image023.png)\n\
  表 7.2 R^n 中某些假设类的 VC 维\n\n![image](img/image663.png)![image](img/image663.png)![image](img/image517.png)![image](img/image663.png)![image](img/image236.png)![image](img/image479.png)![image](img/image474.png)![image](img/image474.png)m\
  \ ≥ max( 4 log 2 ; 8d log 13 / ) (7.9)\n\n注意，这意味着 `m` 的下界是 ( ⁴ log ² ) 或 ( ^(8d)\
  \ log ¹³ /，取其中的较大者。\n\nE ı E E\n\n工程师将这一结果解释为：告诉他可以信任任何正确分类了大小为 m 的整个训练集的分类器，无论诱导该分类器的机器学习算法是什么。\n\
  \n\n\n\n\n请注意，PAC 学习所需的示例数量随 VC 维呈线性增长。然而，这并没有值得庆幸。问题在于，许多现实中分类器类的 VC 维度随着属性数量的增加而增长得非常快——见下文。\n\
  \n示例表 7.2 列出了线性分类器和多项式分类器的某些 VC 维度。读者可能想要思考这种不可避免的权衡：更复杂的分类器类包含正确解的概率更高，但成功所需的训练示例数量增加得如此剧，以至于该类中的分类器不能被认为是可学习的。\n\
  \n事实上，在高阶多项式的情况下，对训练集规模的要求几乎是令人望望的。例如，在 100 维（一个相当的属性数量）中，二阶多项式的 VC 维度如下：\n\n![image](img/image237.png)\n\
  $d^{102} \\cdot 101^{50}$\n$2 \\cdot 1$\n\n这比线性分类器大得多，但也许尚可以接受。无论如何，该值足够大，使得不等式\
  \ (7.9) 中的第一项（相比之下）小到可以忽略。\n\n![image](img/image112.png)然而，如果我们把多项式的阶数增加到 $r=4$，VC\
  \ 维将变得几乎不可逾越：\n\n![image](img/image158.png)\n$d^{104} \\cdot 10³ \\cdot 10² \\cdot\
  \ 10¹ = 4,598,126$\n$4 \\cdot 3 \\cdot 2 \\cdot 1$\n\n因此，最好避免高阶多项式。另一方面，众神经网络和决策树的\
  \ VC 维度（见第 5 和第 6 章）被认为是可以负担的——这也是为什么这些分类器更受青睐。\n\n### 注意事项\n正如不等式 (7.5) 的情况一样，这一个\
  \ (公式 (7.9)) 是最坏情况分析的结果。因此，这些结果不应被解释为告诉我们在任何具体应用中需要多少个示例。\n\n重要的是，在现实应用中，示例并不是任意标记的。由于同一类的示例之间具有某种相似性，它们倾向于在实例空间中聚集在一起。\n\
  \n––––––––\n\n![image](img/scene_break.png) \n\n### 你学到了什么？\n\n为了确保你理解了这一主题，请尝试回答以下问题。如果你有困难，请回到上文中对应的部分。\n\
  \n* 满足 $\\epsilon, \\delta$ 要求所需的示例数量随 VC 维 $d$ 的增加而是如何增长的？\n* 二维连续空间中线性分类器的 VC\
  \ 维度是多少？\n* $n$ 维 $r$ 阶多项式的 VC 维度是多少？为什么这个 VC 维度的高值意味着多项式分类器可能不是一个好的选择？\n\n## 7.5\
  \ 总结与历史备注\n\n* 计算学习理论已经能够对成功归纳所需的训练示例数量建立某些限制。这些限制依赖于两个基本参数：错误率的阈值 $\\epsilon$，以及\
  \ $m$ 个示例成功消除所有错误率高于 $\\epsilon$ 的分类器的概率上界 $\\delta$。\n* 如果所有属性都是离散的，满足 $\\epsilon,\
  \ \\delta$ 所需的最小示例数量由给定假设空间的大小 $H$ 决定。这里是经典公式：\n$m > \\frac{1}{\\epsilon}\\ln\\\
  frac{|H|}{\\delta}$\n* 在某些属性是连续的领域中，满足 $\\epsilon, \\delta$ 需要的最小示例数量由给定分类器类的 VC\
  \ 维决定。具体来说，如果 VC 维的值表示为 $d$，则所需的示例数量由以下不等式决定：$m \\ge \\frac{8d}{\\epsilon}\\log\\\
  frac{13}{\\delta}$\n* 不等式 (7.5) 和 (7.9) 是通过最坏情况分析得出的。因此，实际上，通常较小的训练集就足以归纳高质量的分类器。这些公式的主要用处是它们帮助我们比较不同范式下的可学习性。\n\
  \n### 历史备注\nPAC 学习理念的基础原理由 Valiant 提出。关于后来被称为 VC 维度的经典论文是 Vapnik 和 Chervonenkis\
  \ 写的；Vapnik 后来开发了更为详尽的版本。将 VC 维度应用于可学习性以及对奥卡姆剃刀的研究归功于 Blumer 等人。后来发现了更紧的界限，例如 Shawe-Taylor\
  \ 等人。线性分类器和多项式分类器的 VC 维度可以从 Cover 发表的结论推导出。对学习更多计算学习理论感兴趣的读者将从 Kearns 和 Vazirani\
  \ 编写的优秀（即使有些老旧）书中受益匪浅。\n\n## 7.6 练习与思维实验\n\n练习是为了巩固所学知识。建议的思维实验的意图是让读者从不同的角度看待本章的观点，并且不谦虚地激发他们的独立思考。\n\
  \n––––––––\n\n![image](img/scene_break.png)\n\n### 练习\n\n1. 假设实例空间由第 1 章“饼”领域中使用的属性定义。如果分类器是属性值的合取，请确定假设空间的大小。考虑两种情况：一种是假设某些属性可以被忽略（无关或冗余的），另一种是坚持所有属性必须参与合取。\n\
  2. 回到 7.2 节布尔属性合取的情况。如果我们将要求的错误率从 $\\epsilon=0.2$ 变为 $\\epsilon=0.05$，在最坏情况分析中需要增加多少示例？反，$\\\
  delta$ 的变化将如何影响必要训练集的大小？\n3. 再次考虑所有属性均为布尔值且分类器为属性值合取的情况。如果允许合取恰好涉及三个属性，假设空间的大小是多少？例如，这里是该类的一个合取：`att1\
  \ = true AND attr2 = false AND att3 = false`\n4. 考虑一个具有 $n=20$ 个连续值属性的领域。计算具有二次函数形式的分类器的\
  \ VC 维，并将其与三阶多项式进行比较。其次，假设工程师发现一半属性是无关的。在删除它们后，现在有 $n=10$。这种减少将如何影响这两个分类器的 VC 维？\n\
  5. 比较涉及 8 个属性的布尔函数的 PAC 可学习性与具有 4 个数值属性的领域中二次分类器的 PAC 可学习性。\n\n\n\n\n\n![image](img/scene_break.png)\n\
  \n### 思考一下\n\n1. 在不等式 (7.5) 中，`ı` 扮演了特定的角色，该术语量化了从给定的训练集中诱导出一个成功分类器的概率。在什么种条件下，`ı`\
  \ 的影响可以被忽略？\n\n2. 从 PAC 可学习性的来看，无关属性和冗余属性之间是否存在差异？\n\n3. 我们已经看到在没有偏置（bias）的情况下，分类器不是\
  \ PAC 可学习的。然而，偏置可能是未知的。请建议一种学习程序，在这种情况下诱导出一个布尔表达式形式的分类器。（提示：考虑两个或多个备选偏置。）\n\n4.\
  \ 过去，一些机器学习科学家考虑过通过一种被称为“离散化”（discretization）的过程将连续属性转换为离散属性。他们的意思是将属性值的范围划分为若干区间，每个区间被视为一个布尔属性（给定的数值要么在给定的区间内，要么不在）。\n\
  \n假设你正在考虑两种划分范围 `[0; 100]` 的方法。第一种方法包含两个子区间 `[0; 50]` 和 `[51; 100]`，第二种方法包含十个等大小的子区间：`[0;\
  \ 10]` : : : `[91; 100]`。从 PAC 可学习性的角度讨论这两种方案的优缺点。\n\n# 第 8 章\n\n## 几个具有启发性的应用\n\
  \n对于想要成为机器学习专家的人来说，掌握一些基线技术是不够的。远非如此。隐藏在教科书玩具领域背后的世界会让事情变得复杂，用意想不到的障碍让工程师感到沮丧，并挑战每个人对于“诱导出的分类器究竟应该做什么以及为什么要这么做”的认知。就像在任何其他技术领域一样，如果没有足够的创造力，成功很难实现。\n\
  \n一些实践经验也有帮助，无论是你自己的，或者至少是那些在你之前尝试并成功（或失败）的人的经验。这正是本章想要提供的。通过几个精心挑选的案例研究，你将熟悉在实际应用中常见的某些问题——以及处理这些问题的实际方法。\n\
  \n| ![image](img/chapter_title_corner_decoration_left.png)  ||  || ![image](img/chapter_title_corner_decoration_right.png)\
  \  |\n| --- | --- | --- |\n\n![image](img/chapter_title_above.png)\n\n## 8.1 字符识别\n\
  \n![image](img/chapter_title_below.png)\n\n前几章的技术针对的是那些难以在计算机程序中硬编码的识别技能，但这些可以通过预分类的训练示例来传递。阅读文本的能力（即使是手写文本）属于这一类。应用不胜许多：各种形式的自动预处理、将记事本上涂写的文本转换为文本编辑器可用格式的软件，以及各种报纸数字化程序。仅仅在几年前，这类任务被认为是雄心勃勃以至于几乎不现实的；而今天，没有人认为这有什么了不起的。\n\
  \n### 任务\n\n要以易于计算机识别的方式描述每个字符并不容易。为了理解这个想法，只需试着用简单的英语解释如何区分数字“5”和数字“6”，或者什么构成了以下之间的差异\n\
  \n––––––––\n\n![image](img/scene_break.png)\n\n151\n\n图 8.1 一种将手写字符图像转换为 64 连续属性向量的简单方法，每个属性给出对应区域的平均强度\n\
  \n––––––––\n\n![image](img/scene_break.png)\n\n一个 6−by−4 的数值属性矩阵，每个属性给出区域的平均强度\n\
  \n![image](img/image242.png)手写的“t”和“l”。你会惊讶于这有多困难。将简单的英语解释转换为计算机可以理解的代码则更加困难。\n\n\
  这就是为什么需要机器学习来帮助的原因。如果我们准备一组训练示例，并用预分类的属性向量来描述它们，那么前几章描述的某些技术确实可以诱导出所需的分类器。这个过程是简单到以至于似乎几乎微不足道。让我们来看它的一些关键方面。\n\
  \n![image](img/image478.png)示例和属性向量。首先，工程师必须定义描述示例的属性。图 8.1 说明了一种可能性。第一步识别出数字所在的矩形区域；第二步将该区域划分为\
  \ 64 个等大小的区域，每个区域由一个连续属性表征，其值给出该区域的平均强度。墨水越多，区域反射的光越少，从而导致属性值较低；反之，如果区域完全没有墨水，则值达到最大。当然，这仅仅是原理。没有理由规定只有\
  \ 64 个属性。事实上，程序被预期识别的细节水平越高，它需要依赖的区域大小就越小，因此用于描述示例的属性数量就越大。\n\n在实际应用中，分类器将不仅要识别一个孤立的字符（如图\
  \ 8.1 中的“3”），而且要“读取”整个由许多此类字符组成的文本。然而，这种泛化并不代表任何主要的复杂性。只要单个字符可以被分离并单独处理，就可以应用用属性向量描述它们的相同原则。现在可以下载包含数十万个手写字符数据集，有些通过上述方法描述，有些依靠其他方法。\n\
  \n### 选择分类器\n\n#### 字符识别 153\n\n现在我们已经知道了如何描述训练示例，就可以开始选择诱导技术了。首先考虑的是，在通过 8.1 机制获得的属性向量中，只有一小比例的属性（如果有）可能是无关或冗余的，这意味着这不是一个需要担心的问题（除非属性的数量远超过\
  \ 8.1 所示的）。引导我们选择合适范式的另一个方面是，我们不知道类别是否线性可分，因此对使用线性分类器感到犹豫。最后，分类器不需要提供解释。如果目标是将长文本读取并转换为编辑器，用户几乎不会关心某个特定字符被分类为“P”而不是“D”的准确原因。\n\
  \n基于这些观察，简单易于实现的 k-NN 分类器看起来是一个很好的候选。谨慎的工程师可能会担心在拥有数十万个训练和测试示例的领域中产生的计算成本。但只要属性数量适中，这些成本不太可能是不可接受的。从实际角度来看，构成不可接受成本的合理限制将由与分离单个字符及其图像转换为属性向量相关的计算决定。只要这些计算与分类成本相当（通常如此），该分类器就是负担得起的。\n\
  \n事实上，最近邻分类器是这种应用中最常见的选择，其错误率通常低于 2%。在某些真正难以辨认的手写体，错误率当然会更高。但我们不应该对这个无辜的机器太严厉，因为我们知道即使经验丰富的药剂师读懂某些手写处方也很困难。\n\
  \n\n\n\n\n### 类别的数量\n\n在一个所有字符均为大写的领域中，诱导分类器的目标是识别 10 个数字和 26 个字母，总共 36 个类别。如果同时允许小写和大写字母，总数将增加到：\n\
  \n![image](img/image581.png)\n\n10 2 26 62 类，而且我们可能还需要向其中添加诸如“？”、“!”、“$”等特殊字符。类别数量相对较高并不是没有后果的，这些后果值得我们关注。\n\
  \n最直接的关注点是诱导产品的评估。在这里，仅凭错误率的信息是相当不够的。因此，一个能够正确识别 98% 字符的分类器的性能可能看起来足够好，甚至令人印象深刻；然而，这个值无法告诉我们错误是如何分布的。通常，某些字符在大多数时候都能被正确识别，而另一些字符则存在困难——因此也值得进一步关注。例如，某些相似的字符对往往会互相混淆；此时务实的工程师会想知道是哪些组合，以便通过为“困难”类别提供额外的训练示例来缓解这一问题。\n\
  \n此外，某些字母的频率比其他字母低。在这种情况下，已知除非采取了特殊措施，否则较稀有的类别会被诱导分类器的算法“忽视”。第 10.2 节将对此问题进行更多说明。\n\
  \n### 分类器应被允许拒绝示例\n\n识别一个人的手写并非易事。某些字母如此模糊，令读者绝望地耸肩。然而，第 3 章的 `k-NN` 分类器并不动摇：它总是能找到最近邻居，然后简单地返回它的类别，无论这个类别多么任意。\n\
  \n实践经验表明，这种情况是有害的，因为得到错误类的成本可能大于完全不知道类别的成本。因此，在邮政编码自动读取器中，读取错误的数字可能导致邮件发送到错误的地点，反过来可能导致交付严重延迟。另一方面，如果分类器不给出任何答案，则必须由人工进行读取。此时人工处理的成本可能低于获取错误地址的成本。\n\
  \n我们已经确定，分类器的实现方式应该是：如果支持获胜类别的证据不足，则可以拒绝分类示例。在 `k-NN` 分类器的背景下，实现这一点最简单的方法是要求获胜者的票数与亚军的票数之间存在一定的最小间距。例如，如果一个\
  \ `7-NN` 分类器中的获胜类别仅获得四票，而另一个类别获得三票支持，则该示例被视为模糊而被拒绝。\n\n在其他一些范式中（如贝叶斯分类器或神经网络）也容易完成类似的操作：分类器只需比较两个最可能的类别的概率（或输出信号），如果差异未超过预定义的阈值，则拒绝该示例。\n\
  \n### 错误率与拒绝率\n\n拒绝模糊示例的分类器无疑会降低其错误率；但另一方面，过度不愿进行分类也没有好处。如果所有示例都被拒绝了呢？那么错误率将降为零——然而用户会质疑该工具的实际实用价值。\n\
  \n教训是，工程师需要考虑拒绝率和错误率之间的平衡。确实，增加前者可能会降低后者；但过度可能会导致工具变得毫无用。\n\n### 你学到了什么？\n\n为了确保你理解了这个主题，请尝试回答以下问题：\n\
  \n- 在大写字母字符领域中，总共有多少类别？\n- 为什么仅凭错误率对于分类器来说是不够的指标？\n- 为什么应该允许分类器拒绝示例？\n- 在 `k-NN`\
  \ 分类器的背景下，如何将示例识别为模糊并拒绝？\n- 错误率与拒绝率之间是什么关系？\n\n## 8.2 油溢识别\n\n![image](img/image547.png)\n\
  \n图 8.2 显示了海面的雷达图像。右上角的“弯曲”长条深色区域代表环境危害：油溢。\n\n图 8.2 所示的照片是从许多图片中选出的，主要标准是其罕见的清晰度。事实上，它包含的油溢与其他区域截然不同，以至于未经过训练的眼睛也能轻易识别出它。尽管如此，读者会发现很难以一种用于计算机程序的方式指定油溢的区分特征。对于更具真实的物体，这项任务将更加困难。无论如何，硬编码油溢识别能力是一项巨大的挑战。\n\
  \n再次，机器学习获得了机会，意图让机器通过从训练示例中归纳自动开发所需的技能。这场冒险的场景可以总结为以下步骤：\n\n1. 收集一组包含油溢的雷达图像；\n\
  2. 使用某些能够识别这些图像中感兴趣的深色区域的图像处理软件；\n3. 请专家将油溢标记为正示例，并将其他深色区域（所谓的“相似物”）标记为负示例；\n4.\
  \ 使用属性向量描述所有示例，并让机器学习程序从这样得到的训练集中诱导出所需的分类器。\n\n\n\n\n\n与之前的应用类似，我们将尝试通过仔细观察这项任务的某些关键方面，汲取一些实用的教训。\n\
  \n### 属性与类别标签\n\n最先进的图像处理技术可以很容易发现图像中的黑暗区域。为了让机器学习工具使用这些区域，我们需要通过属性来描述它们，这些属性希望能够捕捉区分油溢与“相似物”的特征。理想情况下，这些属性的值不应受给定对象的大小和方向的影响。\n\
  \n项目中使用的属性包括区域的平均强度、平均边缘梯度（量化边缘的锐利度）、对象短轴与长轴长度之比、背景强度的方差、边缘梯度的方差等。总而言之，以一种相当随机（ad\
  \ hoc）的方式选择了四十多种此类属性。哪些属性真正有用还很难定论，因为专家们无法就各个属性的相关性和冗余性达成共识。最终的选择留给了机器学习软件处理。\n\n\
  对训练示例进行类别标记也并不容易。图 8.2 中的对象很容易分类；但在其他图像中，它们要模糊得多。在很多情况下，专家能给出的最好回答是：“是的，这看起来像油溢”，或者“我相当怀疑这正是我们要寻找的”。因此，所选类别标签的正确性是不确定的，导致了类别标签噪声。类别标签噪声的存在降低了我们的预期：分类器的性能仅取决于其在归纳过程中所使用的数据。\n\
  \n### 选择分类器\n\n示例由大约四十个属性描述。其中，某些（也许是大多数）属性被怀疑是无关或冗余的。这是一个重要的情况；读者会记得，无关和冗余属性的存在会导致某些分类器性能不佳。在这个特定项目中，通过首先归纳决策树，然后消除所有在树的任何测试中从未出现过的属性，避开了这个问题。这是非常逻辑的。毕竟，在树中包含哪些属性的选择是基于属性的信息量做出的。由于无关属性的信息量较低，这种识别这些属性的方法是非常可靠的。因此，冗余属性也可以在某种程度上被消除。\n\
  \n当将 `k-NN` 分类器应用于通过这种基于决策树的消除过程并“生存”下来的属性描述的示例时，分类性能证明是可以接受的。油溢问题通过一种非常简单的机器学习技术得到了解决——这是很好的：在有选择的情况下，工程师总是应该优先选择更简单的工具。\n\
  \n使用 `k-NN` 分类器的决定还受到另一个重要考虑因素的驱动。由于这是许多现实应用的典型情况，让我们详细讨论一下。\n\n### 错误成本\n\n这里的性能评估不像之前的章节中那样直观。首先，在每种错误类型带有不同惩罚的领域，错误率可能是一个相当具有误导性的指标。\n\
  \n在油溢探险中，情况显然如此。在这里，误报（假性阳）会导致飞机不必要地派往一个可疑但“无辜”的区域，这意味着时间和资源的浪费（注意，成本不仅是财务上的，而且是道德上的，因为这类失败往往会损害用户对分类器的信任）。另一方面，漏报（假性阴）意味着一个未检测到的环境危害，其后果（财务、环境和政治方面）是难以预测的。考虑到这一切，读者会同意，这两类成本的性质如此不同，几乎无法对它们进行比较。这自然也使得确定项目目标变得困难。\n\
  \n对预分类测试数据进行实验表明，归纳分类器所犯的大多数错误都是假性阳性的（即误报）。至于漏报，它们相对少见。但是：这是好事吗？还是应该将这一观察结果视为需要修改分类器的信号，以改变两种错误类型的比例？\n\
  \n这个问题不能脱离应用的即时需求独立回答。财务限制可能会迫使用户偶尔接受环境危害的风险，仅仅是因为预算无法再忍受误报。用户随后想要降低误报的频率，即使这意味着要付出增加未检测到的油溢（漏报）数量的代价。\n\
  \n然而，在更富裕的时期，情况将会发生变化，届时不想错过任何油溢的用户为了让漏报变得极其罕见，准备好接受更高频率的误报。\n\n### 倾向于其中一类类别\n\n\
  考虑到这些权衡，有必要给用户提供调整分类器行为的机会，以修改一种或另一种类型错误的频率。\n\n正如已经提到的，这个项目依赖于 `k-NN` 分类器，这种要求很容易满足：技巧在于操控支持两个类别之一的票数之间的边际。为了说明，假设使用\
  \ `7-NN` 分类器。在这里，如果我们指示分类器仅在例如至少有五个最近邻居为阳性时才将示例标记为阳性，那么任何不满足此条件的示例都被视为阴性。相反，如果我们想要降低漏报的频率，我们就告诉分类器，每当例如至少有三个最近邻居为阳性时，就返回阳性标签。因此，用户对任何类型错误的偏好通过示例被标记为阳性所需的票数来表达。\n\
  \n### 你学到了什么？\n\n为了确保你理解了这一主题，尝试回答以下问题。如果你有困难，请返回相应位置。\n\n- 工程师是如何处理许多属性冗余或无关这一事实的？他们是如何识别这些有用属性的？\n\
  - 关于训练集中类别标签的可靠性说明说明？这对分类器的预期性能意味着什么？\n- 讨论在该领域内两种错误类型的各自成本。它们可以使用相同的单位进行比较吗？为什么用户需要一种机制以牺牲另一种错误为代价来减少一种错误？\n\
  - 解释使 `k-NN` 分类器能够增加或减少两种错误之一的机制的本质。\n\n\n\n\n请注意，深睡阶段在 8 小时的睡眠中仅出现三次，且通常持续时间不长。还要注意动期；例如，当受试者从一侧转到另一侧、移动头部或手臂等时。\n\
  \n## 1. 睡眠分类 159\n\n![image](img/image559.png)\n清醒 动 REM\n阶段 1\n阶段 2 阶段 3/4\n2 4\
  \ 6 8\n睡眠小时数\n图 8.3 一个示例睡眠图，记录了某位受试者在 8 小时睡眠期间经历的睡眠阶段\n\n––––––––\n\n![image](img/scene_break.png)\
  \ \n\n## 为什么这很重要\n医学实践需要能够识别特定的睡眠阶段。一个典型的例子是所谓的婴儿猝死综合征（SIDS）：婴儿在没有任何明显原因的情况下死亡。对于怀疑处于危险中的新生儿，必须在医院进行观察，以便立即开始复苏。幸运的是，众所周知\
  \ SIDS 几乎总是发生在 `REM` 阶段。这意味着不需要一直观察患者，只需要在风险增加的这段时期进行观察。例如，能够识别 `REM` 阶段开始的设备可能会提醒护士，在接下来的五分钟内可能需要更多的关注。\n\
  \n反之，睡眠图是一种实用的诊断工具，因为夜间睡眠阶段的分布可能指示特定的神经系统疾病，如癫痫。\n\n## 为什么使用机器学习\n手动绘制睡眠图是一项缓慢且乏味的任务，通常需要高素质专家花费\
  \ 3 到 5 小时的时间。此外，专家并不总是随可用。这就是为什么人们努力开发一种计算机程序，能够根据观测数据识别各个睡眠阶段，并在理想情况下甚至绘制睡眠图。\n\
  \n为了能够提供帮助，计算机需要对各个阶段进行描述。然而，这种描述很难获得。医学专家依赖于长期训练中获得的技能，他们使用的特征和指标过于主观，无法转换为计算机程序。\n\
  \n这促使了人们尝试从预先分类的数据中诱导分类器。具体而言，数据采集过程将 8 小时的睡眠期分为 30 秒的样本，每个样本被视为一个独立的训练示例。总而言之，几个小时的睡眠就提供了数百个训练示例。不同的仪器提供了数据来描述每个\
  \ 30 秒的样本。\n\n### 特性与类别\n同样，第一个任务是移除怀疑为无关或冗余的特性。在之前的应用——油溢识别中，这种移除的目的是提高 `k-NN`\
  \ 分类器的性能（已知其对这些特性的存在敏感）。在睡眠分类中，另一个理由凸显出来：医生希望尽量减少连接在睡眠受试者身上的测量设备数量。这些设备的存在不仅会让受试者感到不适，还会干扰睡眠，从而干扰睡眠分析的结果。\n\
  \n至于类别标签，它们的可靠性甚至比油溢领域更低。“相邻”（相似的）睡眠阶段之间的差异定义非常模糊，以至于任何两个专家在类别标签上的共识很少超过 70%–80%。这难怪训练集包含了大量的类别标签噪声，而且数据的低质量也限制了任何从数据中诱导出的具有现实意义的分类器所能达到的最小错误率。\n\
  \n### 分类器及其性能\n在该特定案例中，使用的分类器将决策树与神经网络相结合，其细节对我们的需求来说并不重要。只需说明，该分类器在独立数据上的准确率确实达到了在人类专家中观察到的\
  \ 70–80%，这意味着已经达到了自然性能极限。值得注意的是，纯决策树的性能比这弱几个百分点。\n\n尽管如此，重要的是理解分类准确率并不能反映分类器的全貌（类似于第\
  \ 8.1 节中的 `OCR` 领域）。一方面，分类器在大多数时间内正确识别了七类类别中的某些类，而在其他类上失败了。特别令人失望的是它对 `REM` 状态的处理。在这里，分类准确率在\
  \ 90–95% 之间，乍一看足够好。然而，对训练数据的进一步检查发现，所有示例中只有不到 10% 属于 `REM` 类；这意味着一个声称“没有任何一个 `REM`\
  \ 示例”的分类器也可以达到相当的分类准确率——但这绝不是工程师们希望实现的。\n\n我们意识到这种衡量性能的方法没有局限性，必须找到其他标准。这些标准确实存在。它们将在第\
  \ 11 章中讨论。\n\n## 通过后处理提高分类性能\n睡眠图的准确性可以通过后处理来提高，其性质取决于领域的逻辑。事实上，这里可以使用几条经验法则。例如，深睡（阶段\
  \ 3/4）不太可能发生在 `REM` 阶段之后，阶段 2 也不会发生在动期。此外，睡眠图可以通过移除任何持续 30 秒的阶段来“平滑化”。应用这些规则可以提高睡眠图的信息价值。\n\
  \n这个教训值得记住。在示例按时间顺序排列的情况下，示例的类别可能与其之前的并不独立。在这种情况下，后处理可以提高性能。\n\n## 诱导分类器的正确使用\n\
  最初的想法是从几个受试者处诱导分类器，然后使用这个诱导分类器代替更昂贵的“手动”分类。\n\n然而，这种想法被证明是不现实的。实践表明，无法通过这种方法获得通用的睡眠数据分类器：从一个人的数据中诱导的分类器无法用于另一个这并不意味着机器学习在这一领域完全被淘汰。并非如此。然而，用户需要修改他们的预期：分类器将为每个受试者单独诱导。专家的工作仍然大大减少了。以下是三个步骤场景：\n\
  \n1. 专家确定部分示例的类别标签，从而创建训练集。\n2. 从此训练集诱导分类器。\n3. 使用诱导分类器分类剩余示例，从而节省专家的时间。\n\n###\
  \ 你学了什么？\n\n为了确保你理解了这一主题，请尝试回答以下问题。如果你有困难，请回到前文中相应的位置。\n\n• 为什么在这一领域减少特性的数量是重要的？相关的特性是如何识别的？\n\
  \n• 睡眠分类领域有七个类别。对于试图评估诱导分类器的工程师来说，这意味着什么？\n\n• 在睡眠图中，示例按时间顺序排列。如何利用这种情况进行数据后处理？\n\
