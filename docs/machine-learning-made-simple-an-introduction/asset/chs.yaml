  \ 12.5 九自由度下 t 值的某些概率\n\n––––––––\n\n![image](img/scene_break.png)\n\n与之前章节中讨论的方法相比，我们必须指出两个主要区别。第一点是我们现在处理的是均值\
  \ `d`，而不是比例。第二点是由于数量 `n` 较小，我们无法再依赖正态分布。\n\n![image](img/image34.png)在这种情况下，我们必须采用另一种分布，即所谓的\
  \ t 分布。它的形状与正态分布相似，但更平坦。此外，它的“平坦度”或“陡度”取决于所谓的自由度。随着自由度的增加，曲线将越来越接近正态分布，在 30 个或更多自由度时，与之一几乎无法区分。\n\
  \n计算 t 值\n\n对于均值 `d` 和标准差 `sd`，t 值通过以下公式计算，其中 `n` 是测试次数：\n\n```\nt = d / (sd / sqrt(n))\n\
  ```\n\n将结果与与置信水平相关的临界阈值进行比较。这些值列在表 12.5 中。具体来说，对于表 12.4 中的结果，我们得到以下结果：\n\n![image](img/image474.png)t9\
  \ = 1:35\n\n看到得到的值小于表中列出的 95% 置信水平的 2.26，我们得出结论：实验未能反驳（对于给定的置信水平）这两种技术导致可比分类准确率的假设。因此，我们接受该主假设。\n\
  \n# 12.7  总结与历史备注\n\n\n\n\n\n- 统计评估的本质是根据我们对较小样本的观测，对整个总体的行为得出结论。\n\n- 不同的样本会产生不同的结果，但这些不同的值定将按照统计规律分布。对这些规律的了解有助于机器学习工程师计算其在具体测试集上测量的分类性能的置信度。\n\
  \n![image](img/image558.png)\n\n- “采样结果”最典型的分布是高斯正态分布（Gaussian normal distribution）。只有在满足两个基本条件时，它才能被使用。对于训练集大小\
  \ `n` 和平均值 `p`，条件如下：`np > 10` 且 `n.1-p > 10`。\n\n- 无论分布是否为正态分布，在不同测试集上测量的分类准确率 `acc`\
  \ 的标准误差由以下公式给出：\n\n![image](img/image036.png)![image](img/image363.png)![image](img/image230.png)![image](img/image733.png)![image](img/image091.png)![image](img/image734.png)![image](img/image173.png)\
  \ `s D r acc.1 - acc/ D r 0:75 · 0:25 D 0:043`\n\n- 对于每个置信水平，正态分布假设会导致一个特定的 `z^(\\\
  *)` 值（见表 12.2）。在计算出标准误差并选择置信水平后，我们通过以下公式建立置信区间：\n\n`Œacc - z^(\\*)sacc; acc C z^(\\\
  *)sacc\\]`\n\n项 `z^(\\*)sacc` 被称为误差范围（margin of error）。对于不同的性能指标，使用了类似的公式。\n\n-\
  \ 假设我们正在对关于某个分类准确率 `acc` 的断言进行测试。如果实验评估的结果落在所选置信水平定义的置信区间内，我们假设没有足够的证据反驳关于 `acc`\
  \ 值的断言。如果结果在该值之外，我们拒绝该断言。\n\n![image](img/image639.png)\n\n- 当比较两种机器学习技术时，我们通常依赖\
  \ 5-2 交叉验证技术，对结果进行所谓的 t 检验。该检验依赖于 t 分布而不是正态分布。t 分布在不同自由度下其形状略有不同。\n\n![image](img/image639.png)\n\
  \n### 历史备注\n本章讨论的统计方法是非常经典的，以至于教科书中不再需要向它们致敬。然而，从机器学习的角度来看，对结果进行 5-2 交叉验证的想法是由 [22]\
  \ 提出的。这种方法依赖于 t 分布而不是正态分布。\n\n| ![image](img/title_decoration_left.png)  ||  ![image](img/___decoration_right.png)\
  \  |\n| --- | --- | --- |\n\n\n\n无论具体数据的特征如何，机器学习的任务都是归纳出一个满足两个基本要求的分类器（或一组分类器）。首先，该工具应该为给定的示例尽可能多地返回其真实类别；漏掉其中任何一个都构成一个假阴性（false\
  \ negative）。同时，分类器不应将示例标记为它不属于的类别——每一个此类“错误”类别都构成一个假阳性（false positive）。\n\n## 神经网络\n\
  神经网络第 5 章解释了多层感知器 `MLP` 的本质，这是一种人工神经网络的流行架构。读者会记得，输出层每个类别都包含一个神经元，输入数量等于属性数量，而隐藏层的理想大小反映了当前分类问题的复杂性。\n\
  \n![image](img/image112.png)![image](img/image272.png)\n\n从表面上看，在多标签领域使用 `MLP` 不应该引起任何重大问题。例如，假设网络接收到了被标记为类别\
  \ `C3`；`C6` 和 `C7` 的训练示例。在这种情况下，训练的目标值将被设置为，例如，对于索引为 `i 3; 6; 7` 的输出神经元，值为 `ti 0:8`；对于所有其他输出神经元，值为\
  \ `ti 0:2`¹。然后可以像单标签领域一样使用误差反传播技术。\n\n### 注意事项\n多层感知器在这里并不一定是最佳选择。事实上，在神经网络文献中，多标签领域的研究强度比其他方法低得多，这并非没有原因。一方面，众所周知，纯\
  \ `MLPs` 的训练容易陷入局部最优，而且始终存在一个与架构相关的问题：如果我们想在网络过大导致数据过拟合、与网络过小导致灵活性不足之间取得合理的折中，那么隐藏神经元的最佳数量是多少？\n\
  \n此外，众闻名的高计算成本也是令人担忧的原因。每个训练示例可能属于多个类别，这一事实确实复杂了学习过程。考虑到任务的困难性，工程师有时会倾向于增加隐藏神经元的数量。然而，这不仅增加了本已很高的计算成本，还增加了过拟合的风险。\n\
  \n记住训练神经网络更多是艺术而非科学，这总是好的。虽然通过智慧和经验可以取得很多，但初学者往往感到失望。在失败的情况下，机器学习专家应该准备采用一些替代的、更安全的技术。\n\
  \n![image](img/image605.png)\n\n¹读者会记得，目标值 `0:8` 和 `0:2` 比 `1` 和 `0` 更适用于误差反传播算法。参见第\
  \ 5 章。\n\n1. 多标签领域中的经典机器学习 253\n\n![image](img/image112.png)![image](img/image590.png)\n\
  \n## 最近邻分类器\n另一种可能性是使用我们在第 3 章中接触过的最近邻分类器。当给出示例 `x` 时，`k-NN` 分类器首先识别该示例的 `k` 个最近邻。这些邻居中的每一个可能被标记为类别集合，多标签领域中最简单的分类尝试是将这些集合的并集标记为\
  \ `x`。例如，假设 `k 3`，并假设三个最近邻居中遇到的类别标签集分别为 `C1`；`C2`、`C2` 和 `C1`；`C3`。在这种情况下，分类器将 `x`\
  \ 分类为属于 `C1`；`C2` 和 `C3`。\n\n### 注意事项\n这种方法仅在每个示例的平均类别数适中的领域（例如少于三个）是实用的。此外，投票邻居的数量\
  \ `k` 应该很小。除非满足这两个要求，否则 `x` 可能会返回过多的类别标签，这会导致过多的假阳性，从而导致精确率（precision）下降。然而，返回的众多标签也减少了假阴性的数量，提高了召回率（recall）。在某些领域，这正是我们所需要的。但在另一些领域，精确率是至关重要的，其低值可能是不可接受的。\n\
  \n正如在这种范式中经常的那样，工程师必须抵制增加最近邻数量的诱惑，希望通过将投票分散到更多“参与者”中，让出现频率较低的类别获得机会。问题在于，其中一些“最近邻”可能离\
  \ `x` 太远，因此不适合用于分类目的。\n\n### 关于其他方法的说明\n机器学习科学家已经开发了许多其他方法来修改传统的机器学习范式，以满足多标签领域的需求。其中，归纳多标签决策树的尝试看起来非常有趣。但由于它们对于入门读物来说有些过于先进，我们在这里不介绍。毕竟，可以通过更简单的方法实现相当的分类性能——这些将是本章其余部分的主题。\n\
