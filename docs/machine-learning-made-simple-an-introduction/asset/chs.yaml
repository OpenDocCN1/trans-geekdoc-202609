  \n1. 考虑表 13.5 左侧的多标签训练集。在使用二相关性原则时是如何创建辅助训练集的。\n2. 对于同一个训练集，为类聚合方法创建辅助训练集。我们需要多少这样的集合？\n\
  3. 画出显示叠加方法如何解决表 13.5 中问题的架构图。假设原始训练集中的示例由十个属性描述。低层分类器需要使用多少个属性？\n4. 为具有以下四个类的领域建议分类链架构：决策树、机器学习、分类、剪枝。\n\
  5. 回到表 13.5 的示例集，假设一个分类器将它们标记为。\n\n# 第 14 章\n\n## 无监督学习\n\n认为机器学习总是需要标签的示例是错误的。恰非如此！即使从没有标签的示例也可以获得有用信息。这有时被称为无监督学习，与讨论有标签示例时使用的术语形成对比。\n\
  \n虽然监督学习关注于分类器的归纳，但无监督学习感兴趣的是发现数据的有用属性。也许流行的任务是寻找相似示例的组（称为类）。这些类的质心随后可以作为 RBF 分类器的中心、未知属性值的预测器，甚至作为多维数据的可视化工具。最后但同样重要的是，无监督学习使用的技术可以从现有属性创建高层属性。\n\
  \n本章描述了一些无监督学习的实用技术，解释了基础算法、它们在实际情况下的行为以及它们提供的优势。\n\n14.1 类分析\n\n无监督学习的基本任务是类分析。在这里，输入一组示例，每个示例由一个属性向量描述——但没有类标签。输出是示例的两个或多个类。\n\
  \n识别相似示例的组 图 14.1 显示了一个简单的领域，其中示例由两个属性描述。观察者可以很容易看到示例形成了三或四组，取决于主观的“分辨率”。\n\n\n\n\
  \n\n![image](img/image699.png)![image](img/image383.png)![image](img/image383.png)![image](img/image383.png)![image](img/image383.png)![image](img/image383.png)![image](img/image383.png)![image](img/image510.png)图\
  \ 14.1 带有示例簇的二维区域\n\n（...根据结构逻辑省略了多幅图像...）\n\n在二维空间中视觉化识别这类组非常容易，但在四维或更多维度中，人类既无法视觉化数据，也无法看到簇。这些只能通过聚类分析算法来检测。\n\
  \n### 用质心表示类\n\n首先，我们必须决定如何描述这些类。可以考虑几种替代方案：可以指定类的位置、大小、边界以及可能的其他方面。但最简单的方法依赖于质心¹。如果所有属性都是数值型的，则质心被确定为各个属性的平均值。例如，假设一个二维类由以下示例组成：\n\
  \n.2; 5/; .1; 4/; .3; 6/。在这种情况下，质心由向量 `.2; 5/` 描述，因为\n\n![image](img/image515.png)第一个属性的平均值为\
  \ `^(2C1C3) D 2`，第二个属性的平均值为\n\n![image](img/image563.png)5 4 6\n\n3\n\n如果我们知道如何将离散属性转换为数值，即使属性是离散的，也可以计算平均值。这里有一种简单的方法。如果属性可以获得三个或更多不同的值，我们可以将每个属性-值对替换为一个布尔变量（例如，`season=fall`、`season=winter`\
  \ 等）。布尔属性的值用 `0` 或 `1` 表示，而不是 `false` 和 `true`。\n\n### 类应该是什么样子的？\n\n类之间不应该重叠：每个示例必须属于且仅属于一个类。在同一个类中，示例之间应该彼此靠近，显然比距离其他类的示例要近得多。\n\
  \n一个重要的问题是数据包含多少个类。在图 14.1 中，我们注意到人类观察者辨别出三个或四个类。然而，现有选项的范围不仅限于这两种可能性。在一个极端，整个训练集可以被认为形成一个大类；在另一个极端，\n\
  \n![image](img/image605.png)\n\n¹机器学习专业人士有时会避免使用“中心（center）”一词，因为该词可能暗示某些对于聚类分析特定需求而言很大程度上无关的数学属性。\n\
  \n1 聚类分析 275\n\n实际实现通常通过要求用户通过输入参数提供类的数量来规避这个问题。然而，有时机器学习软件被期望自动确定类的数量。\n\n### 距离度量的问题\n\
  \n聚类分析算法通常需要一种机制来评估示例与类之间的距离。如果类由其质心描述，那么两个向量之间的欧几里得距离似乎提供了一种很好的方法——前提是我们要意识到这种可能会产生误导性的情况。最后这一陈述需要一个解释。\n\
  \n在离散属性的情况下，欧几里得距离可能不方便，但我们已经知道如何处理它们。更重要的是，我们不能忘记每个属性可能代表不同的量，这使得使用几何距离变得是任意的：4\
  \ 岁的年龄差异与 4 英尺的高度差异な不可比。此外，缩放问题也起了作用：如果我们把英尺替换为英里，距离将发生变化。\n\n我们之前遇到过这些问题。但在聚类分析的背景下，这些问题往往不那么严重。工程师通过将所有值归一化到单位区间来解决这个问题。\n\
  \n### 距离的更通用公式\n\n如果示例是由数值和离散属性混合描述的，我们可以依赖相应属性上的距离平方和。更具体地说，推荐以下表达式（用 `n` 表示属性的数量）：\n\
  \n![image](img/image47.png)![image](img/image135.png)d.x; yi/ D q^n\n\n对于连续属性，使用\
  \ `d.x; yi/`。对于离散属性（包括布尔属性），我们使用 `d.x; yi/ 0` 如果 `xi yi` 以及 `d.x; yi/ 1` 如果 `xi\
  \ yi`。\n\n### 示例应该属于哪个类？\n\n假设每个示例由属性向量 `x` 描述，且每个类由其质心定义——质心也是一个属性向量。\n\n![image](img/image02.png)假设有\
  \ `N` 个类，其质心为 `ci`，其中 `i .1; N`。示例 `x` 到每个质心的距离为 `d.x; ci/`。如果 `d.x; cp/` 是这些距离中最小的，自然预期\
  \ `x` 被放置在 `cP`。\n\n例如，假设我们使用欧几里得距离，并且有三个类。如果质心为 `c1 .3; 4/`、`c2 .4; 6/` 和 `c3 .5;\
  \ 7/`，而示例为 `x .4; 4/`，那么这些距离分别为 `d.x; c1/ 1`、`d.x; c2/ 2` 和 `d.x; c3/ 10`。由于 `d.x;\
  \ c1/` 是三个值中最小的，我们得出 `x` 应属于 `c1`。\n\n### 收益 1：估计缺失值\n\n类的知识可以帮助我们估计缺失的属性值。回到图 14.1，读者会注意到，如果体重较低，示例必属于左下角的类。在这种情况下，高度也可能较低，因为在该类找到的所有示例中高度都很低。这一点在由多个属性描述的现实数据中往往更加显著。\n\
  \n在示例中，某些属性值是未知的。作为处理此问题的简单方法，第 10.4 节建议将缺失值估计为训练集中遇到的平均值或频率值。然而，作为给定类的平均值或频率值来估计缺失值更为可靠，因为它使用了更多关于领域性质的信息。\n\
  \n### 收益 2：缩小 RBF 网络和贝叶斯分类器的大小\n\n聚类分析可以辅助贝叶斯学习和径基函数网络等技术。读者会记得这些范式是通过中心运行的²在最简单的实现中，中心与单个示例的属性向量等同。然而，在具有数百万示例的领域，会导致分类器大到无法实现。工程师随后倾向于将训练集分为\
  \ `N` 个类，并将高斯中心与类的质心等同。\n\n\n\n\n\n### 收益 3：一种简单的分类器\n\n最后，数据聚类的知识在监督学习中可能非常有用。聚类中的所有（或几乎所有）示例属于同一类别的情况是非常常见的。在这种情况下，监督学习软件的开发者可能会决定先识别簇，然后用其主导类对对每个簇进行标记。\n\
  \n![image](img/scene_break.png)\n\n### 你学了什么？\n\n为了确保你理解了该主题，请尝试回答以下问题。如有需要，请返回文中适当的位置。\n\
