  \ x1\n\n––––––––\n\n![image](img/scene_break.png) \n\n### 过拟合\n\n多项式分类器倾向于过拟合带有噪声的训练数据。由于过拟合问题也出现在其他机器学习范式中，我们必须详细讨论它的本质。为了清晰起见，我们将放弃所有属性都应该是布尔的值；相反，我们将依赖于易于可视化的二维连续域。\n\
  \n图 4.7 中的八个训练示例分为两组。在其中一组中，所有示例都是正样本；在另一组中，除了一个以外，所有的都是负样本。这里尝试了两种分类方法。左侧的方法满足于线性分类器，忽略了一个训练示例仍未被正确分类的微小不便。右侧的方法则求助于多项式分类器，试图避免在训练集上产生任何错误。\n\
  \n### 不可避免的权衡\n\n两者中哪一个更好呢？这不是一个简单的问题。一方面，这两类可能是线性可分的，而负样本区域出现一个正样本的唯一原因是类别标签噪声。如果是如此，线性分类器在训练集上犯的单个错误是无关紧要的，而深切入负区域的多项式则会误分类那些发现自己处于曲线错误一侧的示例。另一方面，也存在这种可能，即离群值确实代表了正类别的某些合法的（即使是罕见的）特征。在这种情况下，使用多项式是合理的。但总的来说，假设单个离群值仅仅是噪声，这种假设比“特殊特征”替代方案更有可能是正确的。\n\
  \n一个真实的训练集将包含不是一个，而是相当多、甚至是许多似乎位于实例空间错误部分的示例。而我们的分类器试图建模的类间边界确实可能是弯曲的，尽管其弯曲程度如何无人能知。工程师可能会因为线性分类器太粗糙而将其弃置，转而选择多项式提供的更大灵活性。总体而言，假设单个离群值仅仅是噪声，这种假设比“特殊特征”替代方案更有可能是正确的。\n\
