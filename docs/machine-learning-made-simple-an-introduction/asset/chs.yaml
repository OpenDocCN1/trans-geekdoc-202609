- "# 机器学习入门指南\n\n\n\n\n\n![image](img/image006.jpg)\n\n\n\n\n\n\n\n––––––––\n\n![image](img/scene_break.png)\n\
  \n\n\n\n## 关于本书\n\n《极简机器学习：入门》是一本通俗且全面的指南，旨在为学生、专业人士和爱好者揭示机器学习的世界。对于希望对机器学习原理、技术和应用建立强大基础的人来说，这本书是一个极佳的起点。\n\
  \n涵盖了广泛的机器学习概念和算法，适用于初学者和具有一定基础知识的人。它探索了贝叶斯分类器、决策树、最近邻分类器以及线性多项式分类器，为读者理解这些用于分类和预测任务的核心工具提供了实用的见解。\n\
  \n此外，《极简机器学习》深入探讨了神经网络、遗传算法和提升技术，展示了如何利用这些高级方法解决人工智能和数据挖掘中的复杂问题。它还涉及了无监督学习、强化学习和随时间变化的类别，对机器学习的多样应用提供了全面概述。\n\
  \n本书强调了性能评估的重要性，让读者能够评估机器学习模型和算法的有效性。它引入了计算学习理论，为理解机器学习算法的能力和局限性提供了理论基础。\n\n无论你对数据科学、人工智能还是深度学习感兴趣，本书都使你具备导航机器学习领域所需的知识和技能。它对机器学习概念和技术提供了直观且实实的介绍，是寻求将机器学习力量应用于广泛领域的人来说的理想的资源。\n\
  \n\n\n\n3.1 \n\n1.9 巩固你的知识\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n### 8. 总结与历史备注 (293)\n\
  \n\n\n\n\n\n\n### 7. k-NN 分类器中的选择\n\n### 5. 巩固你的知识\n\n\n## 引言\n\n机器学习已经走向了成熟。如果你认为这仅仅是一句陈词滥调，请让我来澄清一下。\n\
  \n机器有一天能够学习的梦想与计算机本身一样古老，甚至更久远。然而，在很长一段时间里，这仅仅是一个梦想。诚然，罗森布特（Rosenblatt）的感知机确实引发了一股热潮，但回过头来，这种兴奋被证明是短暂的。至于随其后的尝试，情况更加糟糕；它们几乎无人问，经常被忽视，从未取得过突破——没有软件公司的参与，没有重大的后续研究，也没有得到资助机构的支持。机器学习一直是一个弱者，注定生活在其他更成功学科的阴影下。伟大的雄心处于休眠状态。\n\
  \n然后，一切都改变了。\n\n一群远见者指出了 20 世纪 70 代风靡一时的的知识系统的一个弱点：“知识”从何而来？当时的主流观点认为，知识应该以由工程师和领域专家共同努力编写的\
  \ if-then 规则的形式存在。然而，实践经验并不具有说服力。专家发现很难向工程师传达他们所知的知识；而工程师又不知道该问什么问题，也不知道该如何理解答案。尽管有少数几个广为人知的成功案例，但大多数创建一个包含数万条此类规则的知识库的尝试证明是令人倍感挫的。\n\
  \n这些远见者提出的建议既简单又大胆。如果准确地告诉机器如何处理某个问题是如此困难，为什么不间接提供指令，通过示例来传达必要的技能，让计算机从中——是的——进行学习学习呢！\n\
  \n当然，只有当我们能够依靠算法的存在来完成学习时，这种方法才有意义。这是主要的困难所在。事实证明，罗森布特的感知机还是之后开发的技巧都不非常有用。但必要的机器学习技术的缺失并不是障碍；相反，它是一项激发了许多杰出大脑的挑战。赋予计算机学习技能的想法开启了新的地平，并引起了巨大的兴奋。世界开始关注它。\n\
  \nxi\n\n这枚重磅炸弹在 1983 年爆炸了。《机器学习：人工智能方法》（*Machine Learning: The AI Approach*）¹是一部厚实的论文集，提出了解决这一大谜的最多样化方法。在他们的影响下，一个新的科学学科诞生了——几乎在一夜之间。三年后，一本后续著作问世，接着又是一本。一本声名显著的科学期刊创立了。声誉极高的年度会议启动了。几十甚至数百篇博士论文被提交并成功通过答辩。\n\
  \n在这一早期，问题不仅在于如何学习，还在于学习什么以及为什么要学习。回过头来，那些是美好的时光，充满了创意，值得怀旧地记忆。。遗憾的是，许多伟大的思想后来被遗弃了。现实应用的实际需求占据了上风，指明了进一步努力最有前景的途径。在了一段迷恋之后，具体的研究分支结晶了：基于知识系统的\
  \ if-then 规则归纳；分类器归纳（能够根据经验改进技能的程序）；`Prolog` 程序的自动微调；以及其他一些。方向如此之，以至于一些领军人物认为有必要通过写专著来引导进一步的发展，其中一些成功了，另一些不然。\n\
  \n一个重要的分水岭是汤·米切尔（Tom Mitchell）的传奇教科书。它以适合博士生和科学家的格式总结了该领域的先进水平。大学开始一个个提供通常以这本书为核心的硕士课程。与此同时，研究方法也变得更加系统化。建立了一个丰富的机器学习测试平台库，使得比较学习算法的性能成为可能。统计评估方法变得普及。大多数流行程序的公共领域版本被提供。处理这一学科的科学家人数增加到数千，甚至更多。\n\
  \n现在，我们已经处于许多大学将机器学习作为本科课程开设的阶段。这是一个非常新的情况。通常情况下，这些课程需要一种不同的教科书。除了掌握基础技术外，未来的工程师需要良好掌握替代方案的优缺点；他们应该意识到不同范式的特殊之处和独特性。最重要的是，他们必须理解某些技术在什么情况下成功，另一些技术又失败。只有这样，他们在处理具体应用时才能做出正确的选择。一本提供上述所有内容的教科书应该包含较少的数学内容，但要有大量的实践建议。\n\
  \n这些因素决定了旨在为一学期介绍课程提供材料的教材的规模、结构和风格。\n\n引言 xiii\n\n\n\n\n第一个问题是材料的选择。在高科技公司纷纷建立机器学习小组的时代，大学必须为学生提供与当前行业需求相关的知识、技能和理解。因此，我们倾向于介绍贝叶斯分类器、最近邻分类器、线性和多项式分类器、决策树、神经网络基础以及提升算法原理。书中还留了大量篇幅介绍具体工程应用中的某些典型方面。当应用于真正困难的任务时，这些基准技术的表现与教学者所使用的玩具领域并不完全相同。人们必须清楚自己会遇到什么。\n\
  \n本书由 17 章组成，每章涵盖一个主要主题。章节分为若干节，每节专注于一个关键问题。建议学生在回答完上一节末尾的 2–4 个“控制问题”后才能进入下一节。这些问题旨在帮助学生判断自己是否掌握了所给材料。如果没有，则有必要返回之前的文本。\n\
  \n正如俗所说，熟能生巧。这就是为什么在每章的末尾都有练习题，以鼓励进行必要的练习。通过随后的思维实验，将对材料的各个方面获得更深入的见解。这些实验难度更大，但只有通过努力工作，工程师才能培养出正确的理解。所学的知识将通过建议的计算机项目得到进一步巩固。编程同样重要。如今，每个人都习惯了从网上下载所需的软件。然而，我们不建议本书的学生采取这种捷径。只有被迫充实计算机程序的所有细节，你才能学会欣赏这里介绍的机器学习技术的所有细微之处。\n\
  \n# 第 1 章\n\n## 一个简单的机器学习任务\n\n你会发现，很难准确地描述你母亲的脸以便让你的朋友在超市里认出她。但如果你给他看几张照片，他会一眼看出他所需的特征。正如俗所说，一画（一个例子）胜过万言。\n\
  \n这正是我们希望技术模仿的。由于无法以足够的精度定义某些对象或概念，我们希望通过示例将它们传递给机器。然而，计算机必须能够将示例转换为知识。因此，我们对机器学习的算法和技术感兴趣，这也是本书的主题。\n\
  \n第一章将任务表述为一个搜索问题，引入了爬山搜索不仅作为我们解决机器学习任务的初步尝试，还作为后续章节中将遇到的某些辅助问题的有用工具。在建立基础后，我们将讨论性能标准、实验方法论以及使学习过程变得困难且有趣的某些方面。\n\
  \n## 1.1 训练集与分类器\n\n让我们介绍问题，以及将贯穿书中其余部分的某些基本概念。\n\n预分类训练示例集。图 1.1 显示了约翰尼喜欢的六种派，以及六种他不喜欢的派。这些底层概念的正例和负例构成了一个训练集，机器将从此推导出分类器——一种能够将未来的任何派归类为两类之一的算法：正例和负例。\n\
  \n图 1.1 一个简单的机器学习任务：推导出一个能够将未来的派标记为“约翰尼喜欢的派”的正例和负例实例的分类器。\n\n类别的数量当然可以更多。因此，一个判断景观快照是在春季、夏季、秋季还是冬季拍摄的分类器区分了四种情况。识别\
  \ iPad 上涂鸦字符的软件至少需要 36 类：26 个字母和 10 个数字。文档分类系统能够识别数百甚至数千个不同的主题。我们选择二分类区域的唯一动机是它的简单性。\n\
  \n表 1.1 以矩阵形式表示的十二个训练示例\n\n| 示例 | 形状 | 饼皮 | 馅料 | 类别 |\n| --- | --- | --- | --- |\
  \ --- |\n| 尺寸 | 颜色 | 尺寸 | 颜色 | |\n| ex1 | 圆形 | 厚 | 灰色 | 厚 | 深色 | pos |\n| ex2 |\
  \ 圆形 | 厚 | 白色 | 厚 | 深色 | pos |\n| ex3 | 三角形 | 厚 | 深色 | 厚 | 灰色 | pos |\n| ex4 | 圆形\
  \ | 薄 | 白色 | 薄 | 深色 | pos |\n| ex5 | 正方形 | 厚 | 深色 | 薄 | 白色 | pos |\n| ex6 | 圆形 |\
  \ 厚 | 白色 | 薄 | 深色 | pos |\n| ex7 | 圆形 | 厚 | 灰色 | 厚 | 白色 | neg |\n| ex8 | 正方形 | 厚\
  \ | 白色 | 厚 | 灰色 | neg |\n| ex9 | 三角形 | 薄 | 灰色 | 薄 | 深色 | neg |\n| ex10 | 圆形 | 厚\
  \ | 深色 | 厚 | 白色 | neg |\n| ex11 | 正方形 | 厚 | 白色 | 深色 | neg |\n| ex12 | 三角形 | 厚 |\
  \ 白色 | 灰色 | neg |\n\n### 属性向量\n\n为了向机器传递训练示例，我们必须以适当的方式描述它们。最常用的机制依赖于所谓的“属性”。在“派”的领域，可以建议五种属性：形状（圆形、三角形和正方形）、饼皮尺寸（薄或厚）、饼皮颜色（白色、灰色或深色）、馅料尺寸（薄或厚）以及馅料颜色（白色、灰色或深色）。表\
  \ 1.1 规定了图 1.1 中十二个示例的属性值。例如，图片左上角的派（表格中称为 `ex1`）由以下合式描述：\n\n`(shape=circle) AND\
  \ (crust-size=thick) AND (crust-shade=gray) AND (filling-size=thick) AND (filling-shade=dark)`\n\
  \n### 导出的分类器\n\n训练集构成了我们推导出分类器的输入。但什么样的分类器呢？\n\n假设我们希望它以布尔函数的形式存在，正例为真，负例为假。通过对比训练集\
  \ `[(shape=circle) AND (filling-shade=dark)]` 表达式，我们可以看到它对所有负例的值都是假的：虽然可以找到圆形的负例，但这些派中没有深色的馅料。然而，对于正例，该表达式对其中四个为真，而对另外两个为假。这意味着分类器犯了两个错误，这是我们可能不容忍的违规，因为我们怀疑有更好的解决方案。事实上，读者可以很容易验证，以下表达式在整个训练集上都不会出错：\n\
  \n`[(shape=circle) AND (filling-shade=dark)] OR [NOT(shape=circle) AND (crust-shade=dark)]`\n\
  \n\n\n\n![image](img/image713.png)![image](img/image708.png)\n\n## 暴力破解法的问题\n\n\
  机器如何找到这种分类器呢？暴力破解（这是计算机非常擅长的东西）在这里行不通。只需考虑一下在“饼”（pies）领域中，给定的属性集可以区分多少种不同的示例。对于三种不同的形状，每种都有两种可选的\
  \ `crust-sizes`（饼壳大小），组合数量为 $3² = 6$。对于其中的每一种组合，下一个属性 `crust-shade`（饼壳颜色）可以取三个不同的值，使得组合数量增加到\
  \ $3² \\times 3 = 18$。将这一推理扩展到所有属性，我们发现实例空间的大小为：\n\n1. ![image](img/image249.png)\
  \ $2 \\times 3 \\times 2 \\times 3 = 108$ 个不同的示例。\n\n这些示例的每一个子集——共有 $2^{108}$ 个子集！——都可能构成某人对“好饼”这一概念的正样本示例列表。而且每一个这样的子集都可以至少用一个布尔表达式来表征。在训练集上运行这些每一个分类器显然是不可能的。\n\
  \n## 手动方法与搜索\n\n由于不确定如何发明一种诱导分类器的算法，我们可能会尝试通过传统的“纸笔方法”“手动”创建一个分类器，并从中获取一些灵感。在这样做时，我们从一个初步的初始版本开始，例如\
  \ `shape=circular`。在对训练集进行检查后，我们发现它在四个正示例上成立，但在两个负示例上也成立。显然，分类器需要被“缩小”（特化），以排除那两个负示例。进行特化的的一种方法是添加一个合取项，例如将\
  \ `shape=circular` 变为 `[(shape=circular) AND (filling-shade=dark)]`。这个新表达式对于所有负示例都是假的，但仍然并不完美，因为它只涵盖了六个正示例中的四个（`ex1`、`ex2`、`ex4`\
  \ 和 ex6`）。因此，下一步应该尝试某种泛化，也许通过添加一个析取项：`{[(shape=circular) AND (filling-shade=dark)]\
  \ OR (crust-size=thick)}`。我们继续这样下去，直到找到一个 100% 准确的分类器（如果存在的话）。\n\n这次小反思的启示是，分类器可以通过一系列特化和泛化步骤创建，这些步骤逐渐修改给定的分类器版本，直到它满足某些预定义的要求。这是令人鼓舞的。具有人工智能背景的读者会将这一过程识别为对布尔表达式空间的搜索。而人工智能众周知已经开发并探索了相当多的搜索算法。至少看看其中一种算法可能是一个好主意。\n\
  \n––––––––\n\n![image](img/scene_break.png) \n\n### 你学到了什么？\n\n为了确保你理解了这个主题，请尝试回答以下问题。如有需要，请回到文中相应的位置。\n\
  \n* 我们刚刚描述的学习问题的输入和输出是什么？\n* 我们如何描述训练示例？实例空间是什么？我们可以计算它的大小吗？\n* 在“饼”领域中，我们可以计算示例的数量吗？\n\
  * 我们刚刚描述的学习问题的输入和输出是什么？\n\n## 1.2 旁插曲：爬山算法\n\n让我们形式化我们所说的“搜索”，然后引入所谓的“爬山算法”（hill\
  \ climbing）。一种流行的策略是推块益图。让我们通过一个广知的游戏来来说明它的本质。程序的性能将取决于程序员的\n\n![image](img/image68.png)\n\
  \n![image](img/image12.png)\n\n1.3 中的流程图从一个初始状态开始，适用于它的两个算子中的每一个都通向一个状态。在没有其他指导的情况下，我们随机选择并向左移动，到达空块位于第一行中间的情况。在这里，有三种移动方式。其中一种只会让我们回到初始状态，因此可以被忽略；对于剩下的两个，一个导致数值为\
  \ 14 的状态，另一个导致数值为 12 的状态。由于后者的值较小，我们去那里。下一步是显而易见的，因为只有一种移动能带我们进入之前访问过的状态。之后，我们再次面临两个备选方案的选择……这种搜索持续进行直到到达最终状态。\n\
  \n![image](img/image41.png)\n\n![image](img/image53.png)\n\n在推块益图示例中使用的评估函数相当简单，仅勉强完成了它的使命：让用户传达他们对问题的理解，并为人类求解者可能偏好的哪种移动提供提示。要在现实应用中成功，我们必须想出一个更复杂的函数。\n\
  \n### 替代终止准则与评估函数\n\n也可以考虑其他的终止准则。可以指示搜索在允许的时间结束时停止（我们不希望计算机无限运行），当访问状态的数量超过某个限制时，当发现足够接近最终状态的状态时，当我们意识到所有状态都已经被访问过时，等等，具体的公式化反映了给定应用的关键方面，有时会将两个或多个准则结合在一起。\n\
  \n\n\n\n\n## 爬山算法\n\n该算法通过表 1.2 中的伪代码进行了总结。当然，具体细节将取决于每个人的编程风格，但代码中几乎总是包含几个典型的函数。其中一个函数用于比较两个状态，如果它们相同则返回真；程序正是借此确定是否达到了最终状态。另一个函数接收一个给定的搜索状态，并对其应用所有的搜索算子，从而创建一个完整的“子状态”集合。为了避免无限循环，第三个函数会检查某个状态是否已经过调查过。第四个函数则计算给定状态到最终状态的距离。\n\
  \n![image](img/image139.png)\n\n图 1.3 爬山。圆圈出的数字表示访问搜索状态的顺序。`d` 是由给定的评估函数计算的状态与最终状态的距离。平局随机打破。\n\
  \n––––––––\n\n![image](img/scene_break.png) \n\n状态，第五个函数根据由此计算出的距离对“子”状态进行排序，并将它们置于列表\
  \ `L` 的前端。最后一个函数检查是否满足了终止标准¹。\n\n最后的观察是：在图 1.3 的某些状态下，没有任何“子状态”比其“父状态”提供任何改进，只有在临时妥协后才能获得较低的\
  \ `d` 值。这也是登山者可能经历的体验：有时，他必须在继续攀登之前穿越一个山谷。顺便提一下，爬山的比喻正是这项技术的命名来源。\n\n––––––––\n\n\
  ![image](img/scene_break.png) \n\n![image](img/image605.png)\n\n¹简单起见，伪代码忽略了达到或未达到最终状态以外的终止标准。\n\
  \n### 表 1.2 爬山搜索算法\n\n![image](img/image552.png)\n\n1. 创建两个列表 `L` 和 `Lseen`。开始时，`L`\
  \ 只包含初始状态，`Lseen` 为空。\n2. 令 `n` 为 `L` 的第一个元素。将此状态与最终状态进行比较。如果它们相同，则停止并成功。\n3. 对\
  \ `n` 应用所有可用的搜索算子，从而获得一组新状态。丢弃那些已存在于 `Lseen` 中的状态。对于其余状态，根据评估函数进行排序并将置于 `L` 的前端。\n\
  4. 将 `n` 从 `L` 转移到已调查状态列表 `Lseen` 中。\n5. 如果 `L` 为 `∅`，停止并报告失败。否则，回到步骤 2。\n\n––––––––\n\
  \n![image](img/scene_break.png) \n\n### 你学到了什么？\n\n为了确保你理解该主题，请尝试回答以下问题。如有必要，回到文中适当的位置。\n\
  \n* 人工智能是如何定义搜索问题的？我们在“搜索空间”和“搜索算子”术语下理解什么？\n* 评估函数的作用是什么？它是如何影响爬山行为的？\n\n## 1.3\
  \ 机器学习中的爬山算法\n\n![image](img/chapter_title_below.png) \n\n我们已经准备好探索将爬山算法应用于机器学习需求的具体方法。\n\
  \n### 爬山算法与约翰尼的派派\n\n让我们从如何决定约翰尼喜欢哪些派的问题开始。输入由一组训练示例组成，每个示例由可用属性描述。输出——最终状态——是一个布尔表达式，对于训练集中的每个正示例为真，对于每个负示例为假。该表达式涉及属性-值对、逻辑算子（与、或、非）以及任何可能需要的括号组合。评估函数衡量给定表达式在训练集上的错误率。对于初始状态，可以使用任何随机生成的表达式。\n\
  \n（注：此处原文存在大量重复乱码，已根据核心内容进行清理）\n\n### 数值属性\n\n为了简单起见，假设只有两个属性：重量和价格。这使得在图 1.5 中通过平面上的点来表示每个示例成为可能。同一类的示例倾向于占据特定区域，而划分区域的曲线可以定义——数学上可以是直线、圆、多项式。例如，1.5\
  \ 的右部分显示了三个不同的圆，每个都可以作为分类器：圆内的示例被视为正；圆外的视为负。\n\n![image](img/image250.png)![image](img/image516.png)\n\
  \n图 1.5 左侧：具有连续属性域；右侧：一些“圆形”分类器\n\n### 数值属性域中的爬山算法\n\n**初始状态** 圆形由其中心和半径定义。我们可以将初始中心确定为随机选择的正示例，使初始半径足够小，以至于圆只包含这一个示例。\n\
  \n**搜索算子** 可以使用两个算子：一个增加圆的半径，另一个将中心从一个训练示例移动到另一个。在前者中，我们还需要确定半径应该改变多少。一种想法是仅增加到让圆包含一个额外的训练示例即可。\n\
  \n**最终状态** 圆可能不是表示正区域的理想图形。在这种情况下，可能无法实现 100%的准确率，我们可能倾向于将最终状态定义为，例如，“正确分类 95% 训练示例的分类器”。\n\
  \n**评估函数** 如前所示，我们选择最小化错误率。\n\n\n\n\n\n## 你学了什么？\n\n为了确保你理解了该主题，请尝试回答以下问题。如有必要，请回到文中相关部分。\n\
  \n• 在机器学习中应用爬山算法之前，我们必须指定搜索的哪些方面？\n\n• 在 `pies` 领域可以使用哪些搜索算符，在 `circles` 领域又可以使用哪些？我们该如何定义评估函数、初始状态和最终状态？\n\
  \n## 1.4 诱导分类器的性能\n\n到为止，我们通过比较训练示例的已知类别与分类器推荐的类别来衡量错误率。但从实践上来说，我们的目标并不是对已经知道类别的对象进行重新分类；我们真正想要的是标记那些我们尚不知道类别的未来示例。分类器在这些示例上的预期性能是通过实验估计的。了解这种方法非常重要。\n\
  \n### 独立测试示例\n简单的场景是将可用的预分类示例分为部分：用于诱导分类器的训练集，以及用于评估分类器的测试集（图 1.6）。因此，在具有 12 个预分类示例的\
  \ `pies` 领域中，可以在随机选取的 8 个上进行诱导，并在剩下的 4 个上进行测试。如果分类器正确“猜”中了 3 个测试示例的类别（同时错了一个 1 个），则其性能估计为\
  \ 75%。\n\n尽管这种方法看起来合理，但它存在一个主要的缺点：随机选择的 8 个训练示例可能无法充分代表底层概念——这对于（甚至更小的）测试集来说也是如此。如果我们从一个由鲸鱼、海豚和鸭嘴兽组成的训练集中诱导哺乳动物的含义，学习者可能会被误认为哺乳动物生活在海里（鲸鱼、海豚），有时会生蛋（鸭嘴兽），这绝不是生物学家会接受的观点。然而，另一种训练示例的组合可能会产生一个符合最高标准的分类器。问题的点在于，不同的训练/测试集划分会产生不同的分类器——并产生对未来性能的不同估计。如果预分类示例的数量较少，这个问题会尤为严重。\n\
  \n假设我们想就其诱导出的产物质量比较两种机器学习算法。非代表性训练集的问题可以通过所谓的“随机子采样”来缓解。其想法是多次重复随机划分为训练集和测试集，始终从第\
  \ `i` 个训练集诱导分类器，然后测量第 `i` 个测试集上的错误率 `Ei`。就分类而言，提供平均 `Ei` 较低分类器的算法被认为更好。\n\n### 解释的必要性\n\
  在某些应用中，确定类别是不够的。知道其背后的原因同样重要。但如何找到解释呢？在 `pies` 领域中，可以从表达式中获得。相比之下，分类器是一个“黑箱”，它接受一个示例并返回标签，而不告知任何其他信息。在某些应用中，解释只是额外的奖励；而在另一些应用中，它是多余的。\n\
  \n### 替代方案的存在\n顺便提一下，我们注意到从数据可以诱导出许多看起来完美的分类器。在 `pies` 领域中，训练集包含 12 个示例，其余示例的类别未知。通过一些简单的组合数学，我们意识到有\
  \ `2⁹⁶` 个可以正确标记训练示例的分类器——而另一个则会将它们全部分类错误。\n\n## 1.5 数据中的一些困难\n\n\n\n\n\n### 无关属性\n\
  首先，某些属性是重要的，而另一些则不然。虽然约翰尼可能真的很喜欢罂子酱馅饼，但他对派的偏好几乎不会取决于厨师的脚码大小。这是一个值得关注的问题：无关属性会增加计算成本；它们甚至会误导学习者。这些属性可以避免吗？\n\
  \n通常不能。诚然，在手动创建的领域中，专家应该知道哪些属性是真正重要的，但即使在此情况下，情况也并不简单。因此，“派类”领域的作者可能已经尽力挑选了她认为重要的属性。但由于对约翰尼口味背后的真实原因尚不确定，她可能包含了一些她怀疑其必要性但无法保证的属性。相关性问题更多地发生在从数据库中提取示例时。数据库的开发主要意图是提供对大量信息的访问——其中通常只有一小部分与学习任务有关。至于具体是哪一部分，我们通常一无所知。\n\
  \n### 缺失属性\n相反，某些关键属性可能会缺失。考虑到父母的财务状况，约翰尼可能对昂贵的派产生偏见。属性 `price` 的缺失将导致无法导出良好的分类器：两个在可用属性上完全相同的示例，在关键的“缺失”属性值上可能不同。难怪尽管描述相同，一个示例是正样本，而另一个是负样本。当这种情况发生时，我们称该训练集是不一致的。这种情况有时很难避免：不仅专家可能不知道属性\
  \ `price` 的相关性；可能无法提供该属性的值，因此该属性根本无法使用。\n\n### 冗余属性\n损害较小的是冗余属性，即其值可以从其他属性获得。如果数据库包含患者的\
  \ `date-of-birth`（出生日期）以及 `age`（年龄），那么后者就是必要的，因为可以通过从今天的日期中减去 `date-of-birth` 来计算。幸运的是，冗余属性没有无关或缺失属性那么危险。\n\
  \n### 缺失属性值\n在某些应用中，用户识别正确的属性选择没有问题。然而，问题在于某些属性的值是未。例如，分析员工数据库的公司可能不知道每个人的孩子数量。\n\
  \n### 属性：值噪声\n由于信息来源不可靠、测量设备糟糕、拼写错误、用户的困惑以及许多其他原因，属性值和类别标签往往是不可信的。我们说数据遭受了各种噪声的影响。\n\
  \n随机噪声是随机的。例如，由于我们的体重在一天中会变化，我们早晨得到的读数与晚上的不同。人为错误也可能起作用：由于没有时间测量患者的血压，一名疏忽的护士简单地写下了上一次读数的修改值。相比之下，系统性噪声将所有值向同一方向移动。例如，校准不当的温度计给出的读数总是比应该的低。任意伪迹的情况下发生了另一种情况；在这里，给定的值与现实没有任何关系，例如\
  \ EEG 电极松动，从那时刻起，所有后续读数都为零。\n\n### 类别标签噪声\n类别标签面临着与属性类似的问题。专家推荐的标签可能没有被正确记录；或者，某些示例发现处于两个类别之间的“灰色地带”，在这种情况下，正确的标签是不确定的。这两种情况都代表随机噪声，后者可能只负面影响两个类别边界区域的示例。然而，类别标签噪声也可以系统性的：医生可能不愿意诊断罕见病，除非证据是压倒性的——那么他的类别标签更有可能是负样本而非正样本。最后，类别标签中的任意伪迹出现在由错误的自动化过程提供类别的领域。类别标签噪声可能比属性值噪声更危险。因此，在“圆类”领域中，位于正区域深处的示例即使属性值被轻微修改，也会停留在那里；只有边界示例会遭受“被送到边界之外”的影响。相比之下，类别标签噪声将使任何示例失效。\n\
  \n## 你学了什么？\n为了确保你理解了该主题，请尝试回答以下问题。如有必要，回到文中适当的位置。\n\n- 解释以下类型的属性：无关的、冗余的缺失的。使用“派类”领域来说明每种属性。\n\
  - “不一致的训练集”是指什么？原因可能是什么？它将如何影响学习过程？\n- 我们知道哪些类型的噪声？它们的可能来源是什么？\n\n## 1.6 总结与历史说明\n\
  - 从预先分类的示例训练集进行归纳是研究得最深入的机器学习任务。\n- 从历史来看，这项任务被视为搜索。人们可以提出一种机制，利用由初始状态、最终状态、中间状态、搜索算子和评估函数定义的成熟搜索技术。\n\
  - 尽管如此，机械使用搜索并不是最终解决方案。书的其余部分将探索更多有用的技术。\n- 分类器的性能通过预先分类的测试数据进行估计。简单的性能标准是错误率，即分类器误分类示例的百分比。基准场景如图\
  \ 1.7 所示。\n- 两个都分类所有训练示例的分类器在处理测试集方面可能存在显著差异。\n- 除了低错误率，某些应用要求分类器提供分类背后的原因。\n- 导出分类器的质量取决于训练示例。训练示例的质量不仅取决于它们的选择，还取决于描述它们的属性。某些属性是相关的，另一些是无关或冗余的。经常关键属性是缺失的。\n\
  - 属性值和类别标签可能遭受随机噪声、系统性噪声和任意伪迹的影响。具体示例中的属性值可能是未知的。\n\n### 历史说明\n搜索算法还有更多内容。感兴趣的读者可以参考人工智能教科书，其中最全面的可能是\
  \ Russell 和 Norvig [84] 或 Coppin [17]。\n\n\n\n\n读者可能会发现，概念或类别的恰当表示问题困扰了哲学家们几个世纪。因此，约翰·斯图亚特·米（John\
  \ Stuart Mill）[65] 探索了与下一章所说的“概率表示”相关的概念；而威廉·韦威尔（William Whewel）[96] 则提倡了与我们第 3\
  \ 章主题接近的原型表示。\n\n![image](img/image148.png)\n\n图 1.8 确定启发式搜索算法访问这些搜索状态的顺序。“框”旁边的数字是各个搜索状态的评估函数值。\n\
  \n––––––––\n\n![image](img/scene_break.png) \n\n## 1.7 巩固你的知识\n\n![image](img/chapter_title_below.png)\
  \ \n\n练习题旨在巩固所学知识。建议的思想实验将帮助读者从不同的角度看待本章的观点，并引发独立思考。计算机作业将迫使读者注意他们可能会忽略的看似微不足道的细节。\n\
  \n### 练习题\n\n1. 在滑块游戏中，请给出一个比文中使用的函数更好的评估函数。\n\n2. 图 1.8 显示了一棵搜索树，其中每个节点代表一个搜索状态，并标记有评估函数的值。爬山搜索将以什么顺序访问这些状态？\n\
  \n3. 假设“派”领域中的评估函数计算的是正确分类的训练示例的百分比。令初始状态为描述表 1.1 中第二个正样本的表达式。手动模拟使用泛化算子和特例化算子的爬山搜索。\n\
  \n4. 在一个由十个布尔属性描述示例的领域中，实例空间的大小有多大？那么分类器的空间又有多大？\n\n––––––––\n\n![image](img/scene_break.png)\
  \ \n\n### 思考一下\n\n1. 在“派”领域中，假设实例空间的每个子集都可以由一个不同的分类器表示，那么所有分类器的空间大小为 `2¹⁰⁸`。如果我们只允许形式为属性-值对逻辑取与形式的分类器，搜索空间将缩小多少？\n\
  \n2. 你能想到“派”领域中存在哪种噪声？这些噪声的来源是什么？还有哪些问题可能导致此类训练集不完美？\n\n3. 有些分类器的表现像黑盒，无法提供太多的解释。例如，“圆”领域就是这种情况。请列举黑盒分类器不实用的领域示例，并指出哪些领域这种限制并不重要。\n\
  \n4. 考虑第 1.5 节总结的数据相关困难。其中哪些是严重的，哪些是可以容忍的？\n\n5. 冗余属性和无关属性之间有什么区别？\n\n6. 取一个你认为很难描述的类——例如，生物体的识别（橡树等）或音乐流派识别（摇滚、爵士等）。这些属性的值容易获得吗？你预计哪些会增加过程的复杂性？\n\
  \n### 计算机作业\n\n1. 编写一个实现爬山算法的程序并将其应用于滑块游戏。选择合适的属性来判断状态是否结束，并实现搜索。\n\n2. 编写一个实现第\
  \ 1.3 节“圆”算法的程序。创建一个如图 1.5 所示二维示例训练集。评估函数将计算正确分类示例的百分比。\n\n3. 编写一个实现“派”搜索的程序。定义你自己的泛化和特例化算子。观察它们如何导致不同的步骤。\n\
  \n# 第 2 章：概率：贝叶斯分类器\n\n基于已知属性预测类别的早期尝试可以追溯到二战之前——按照计算机科学的标准，那是史前时代。当然，没有人使用“机器学习”这个术语，但目标与本书解决的目标本质上相同。他们使用的策略的核心是：利用贝叶斯理论为每个类计算对象属于该类的概率，然后选择值最高的类。\n\
  \n![image](img/chapter_title_corner_decoration_left.png)  ||  || ![image](img/chapter_title_corner_decoration_right.png)\
  \  |\n| --- | --- | --- |\n\n![image](img/chapter_title_above.png) \n\n## 2.1 单属性情况\n\
  \n让我们从一个简单到不切实际的情况开始：每个示例都由单个属性描述的领域。一旦我们开发了基本原理，我们将将其泛化，以便用于更具实践性的领域。\n\n基础知识可以使用上一章的玩具领域很好地解释。训练集包含十二个派（`Nall\
  \ = 12`），其中六个是给定概念的正样本（`Npos = 6`），六个是负样本（`Nneg = 6`）。假设示例代表了真实情况，那么约翰尼随机挑选一个派的概率是\
  \ 50%：\n\n```\nP.pos = Npos / Nall = 6 / 12 = 0.5\n```\n\n![image](img/image236.png)\n\
  \n现在考虑一个属性，例如填充大小。训练集包含八个具有厚填充的示例（`Nthick = 8`）。其中有三个被标记为正样本（`Nposidth = 3`）。这意味着“在填充大小=厚的情况下，一个示例为正样本的条件概率”为\
  \ 37.5%——这就是厚填充示例中正样本的相对频率所意味着的：\n\n```\nP.pos|thick = Nposjthick / Nthick = 3 /\
  \ 8 = 0.375\n```\n\n![image](img/image474.png)\n\n\n\n\n\n![image](img/image346.png)![image](img/image367.png)\n\
  \n### 将条件概率应用于分类\n\n重要的是，相对频率是仅针对具有给定属性值的饼计算的。在这些相同的八块饼中，有五个代表负类，这意味着 `P.neg thick/\
  \ = 5/8 = 0.625`。通过观察到 `P.neg thick/ > P.pos thick/`，我们得出结论：约翰尼（Johnny）不喜欢厚馅饼的概率大于相反情况的概率。因此，分类器将所有\
  \ `filling-size=thick`（填充物厚）的示例标记为“约翰尼喜欢的饼”的负实例是有有意义的。\n\n![image](img/image112.png)![image](img/image114.png)\
  \ 注意，条件概率 `P.pos thick/` 比先验概率 `P.pos/` 更值得信赖，因为它的计算中加入了额外信息。这是自然所然的。在一个男孩和女孩人数相等的托儿中心，我们预期随机选中的孩子是男孩的概率为\
  \ `P.boy/ = 0.5`。但当我们听到有人叫那个孩子约翰尼时，我们就会增加这种预期，因为知道女孩起这个名字很常见。这就是为什么 `P.boyjJohnny/\
  \ > P.boy/`。\n\n![image](img/image114.png)![image](img/image114.png)\n\n### 联合概率\n\
  \n条件概率不应与两个事件同时发生的联合概率混淆。请确保使用正确的符号：在联合概率中，项之间用逗号分隔，`P.pos; thick/`；在条件概率中，用垂直线分隔，`P.pos\
  \ thick/`。对于一个随机选取的饼，`P.pos; thick/` 表示该示例为正例且其填充物为厚厚的概率；而 `P.pos thick/` 指的是在所有\
  \ `filling-size=thick` 的示例中出现正例的概率。\n\n## 1. 单属性情况\n\n### 具体示例\n\n![image](img/image561.png)![image](img/image112.png)![image](img/image112.png)\
  \ 图 2.1 说明了这些术语。矩形代表所有的饼。正例包含在一个圆中，`filling-size=thick` 的示例在另一个圆中；交集包含三个同时满足这两个条件的实例；有一块饼两个条件都不满足，因此位于两个圆之外。条件概率\
  \ `P.pos thick/ = 3/8` 是通过将交集的大小（三个）除以 `thick` 圆的大小（八个）得到的。联合概率 `P.pos; thick/ =\
  \ 3/12` 是通过将交集的大小（三个）除以整个训练集的大小（十二个）得到的。先验概率 `P.pos/ = 6/12` 是通过将 `pos` 圆的大小（六个）除以整个训练集的大小（十二个）得到的。\n\
  \n从联合概率获取条件概率\n\n图片说服了我们，联合概率可以从先验概率和条件概率获得：\n\n![image](img/image234.png)![image](img/image234.png)![image](img/image385.png)![image](img/image583.png)![image](img/image236.png)![image](img/image236.png)![image](img/image474.png)\n\
  \n```\nP.pos; thick/ = P.posjthick/ · P.thick/ =3/8 = 3\nP.thick; pos/ = P.thickjpos/\
  \ · P.pos/\n3/6 = 3\n```\n\n![image](img/image234.png)![image](img/image352.png)![image](img/image236.png)![image](img/image236.png)![image](img/image474.png)\n\
  D\n\n![image](img/image045.png) 注意，联合概率永远不会超过对应条件概率的值：`P.pos; thick/ ≤ P.pos thick/`。这是因为条件概率乘以了先验概率\
  \ `P.thick/` 或 `P.pos/`，而后者永远不会大于 1。\n\n![image](img/image112.png) 另一个需要注意的事实是 `P.thick;\
  \ pos/ = P.pos; thick/`，因为两者都代表相同的意思：厚和正同时发生的概率。因此，前两个公式的左侧必须相等，这意味着：\n\n```\nP.posjthick/\
  \ · P.thick/ = P.thickjpos/ · P.pos/\n```\n\n将此最后一个等方程的两边同时除以 `P.thick/`，我们得到了著名的贝叶斯公式，它是本章其余部分的基础：\n\
  \n![image](img/image346.png)\n\n```\nP.pos thick/ = (P.thickjpos/ · P.pos/) / P.thick/\n\
  ```\n(2.3)\n\n![image](img/scene.png)\n\n如果我们推导出 `filling-size = thick` 的饼属于负类的类似公式，我们得到：\n\
  \n![image](img/image346.png)\n\n```\nP.neg thick/ = (P.thickjneg/ · P.neg/) / P.thick/\n\
  ```\n(2.4)\n\n这两个公式计算出的数值告诉我们哪类的概率更大。情况比看起来要简单：由于分母 `P.thick/` 对于两个类都是相同的，我们只需要选择分子较大的类。\n\
  \n![image](img/image112.png)![image](img/image114.png) 在单属性的情况下，情况其实非常简单，我们可以直接从训练集中获得\
  \ `P.pos/` 和 `P.neg/`，而不需要使用贝叶斯公式——当示例由多个属性描述时，情况就不如此了，这将在下一节介绍。\n\n### 你学了什么\n\n\
  为了确保你理解了该主题，请尝试回答以下问题。如有需要，返回文中相应位置。\n\n- 贝叶斯公式是如何从条件概率和联合概率之间的关系推导出来的？\n- 为什么贝叶斯公式如此有用？它使我们能够计算什么？\n\
  - 联合概率 `P.x; y/` 有可能大于条件概率 `P.xy/` 吗？\n\n## 2.2 离散属性向量\n\n现在让我们转向如何在由属性向量描述（如 `x\
  \ = (x1; x2; ...; xn/)`）的领域应用贝叶斯公式。\n\n许多现实应用不止两个类，不仅仅是“饼”领域中的 pos 和 neg。如果 `ci`\
  \ 是第 `i` 类的标签，且 `x` 是我们要分类的对象的向量，贝叶斯公式将变为以下形式：\n\n![image](img/image110.png)![image](img/image201.png)\n\
  \n```\nP(c|x) = P(xj|c)P(c) / P(x)\n```\n\n表 2.1 说明贝叶斯决策的原理\n\n![image](img/image731.png)\n\
  \n让训练示例由单一属性（填充大小）描述，其值为厚或薄。我们希望机器能够识别正类（pos）。这里是八个可训练示例：\n\n| | ex1 | ex2 | ex3\
  \ | ex4 | ex5 | ex6 | ex7 | ex8 |\n| --- | --- | --- | --- | --- | --- | --- | ---\
  \ | --- |\n| Size | thick | thick | thin | thin | thin | thick | thick | thick |\n\
  | Class | pos | pos | pos | pos | neg | neg | neg | neg |\n\n概率……是通过它们的相对频率得到的。例如，八个示例中有三个示例的特征是填充大小为薄；因此，`P.thin/\
  \ = 3/8`。\n\n\n\n\n给定类别内某个具体属性值的条件概率再次由相对频率决定。我们的训练集得出了以下值：\n\n`P.thinjpos/ D =\
  \ 2/4`\n`P.thickjpos/ D = 2/4`\n`P.thinjneg/ D = 1/4`\n`P.thickjneg/ D = 3/4`\n\n\
  使用这些值，贝叶斯公式给出以下条件概率：\n\n`P.posjthin/ D = 2/3`\n`P.posjthick/ D = 2/5`\n`P.negjthin/\
  \ D = 1/3`\n`P.negjthick/ D = 3/5`\n\n（注意 `P.posjthin/ + P.negjthin/ = P.posjthick/\
  \ + P.negjthick/ = 1`)\n\n根据这些结果，我们得出结论：`filling-size=thin` 的示例应该被分类为正类，因为 `P.posjthin/\
  \ > P.negjthin/`。相反，`filling-size = thick` 的示例应该被分类为负类，因为 `P.negjthick/ > P.posjthick/`。\n\
  \n![image](img/scene_break.png)\n\n由于每个类别的分母相同，我们选择使分子 `P.xjci/P.ci/` 最大化的类别。在这里，`P.ci/`\
  \ 可以通过训练集中 `ci` 的相对频率易于估计。然而，对于 `P.xjci/`，情况并不那么简单。\n\n![image](img/image211.png)![image](img/image114.png)\n\
  \n向量概率 `P.xci/` 是随机选择的类别 `ci` 的代表被向量 `x` 描述的概率。它的值可以通过相对频率来估计吗？并不真的。在“派饼”领域中，实例空间的大小为\
  \ 108 个不同的示例，其中训练集包含了 12 个。这 12 个向量每个由一个训练示例表示，而其他所有向量（绝大多数！）完全没有被表示。因此，在 6 个正示例中，`x`\
  \ 的相对频率要么是 `P.x pos/ = 1/6`（当 `x` 在其中时），要么是 ![image](img/image211.png)P.x pos/ =\
  \ 0`（当它不在时）。任何与训练示例相同的 `x` 都“继承”该示例的类别标签；如果不在训练集中找到该向量，那么对于任何 `ci`，我们都有 ![image](img/image177.png)P.xci/\
  \ = 0`。由于贝叶斯公式中的分子始终为 ![image](img/image181.png)P.xci/P.ci/ = 0`，我们无法选择最可能的类别。显然，计算一个只发生一次或从未发生的事件的概率，我们无法取得太大进展。\n\
  \n![image](img/image567.png)幸运的是，单个属性的情况并非如此。例如，`shape=circle` 在正示例中出现四次，在负示例中出现两次，相应的概率分别为\
  \ `P.shape circle pos/ = 4/6` 和 `P.shape circle neg/ = 2/6`。如果一个属性只能获得两个或三个值，那么这些值中的每个值在训练集中出现一次以上的概率很高，从而为概率估计提供了更好的依据。\n\
