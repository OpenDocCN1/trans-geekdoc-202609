  \n# 第 6 章\n\n## 决策树\n\n在前几章节中讨论的分类器要求所有属性值都同时呈现。然而，这种场景具有其自身的缺陷。因此，一位试图了解病人病情本质的医生往往除了几项主观症状外无从从起。于是，为了缩小诊断范围，她开具了实验室检查，并根据结果可能再进行其他检查。在任何给定时刻，医生只考虑那些能对其当前信息或理解产生有意义补充的“属性”。如果从一开始就要求所有可能的实验室检查（成千上万个），将是荒谬的。\n\
  \n教训是，详尽的信息往往无法立即获得；它可能根本不需要。分类器根据情况需要逐个选择属性，可能会获得更好的效果。针对这种场景最流行的工具是决策树。本章解释了它的分类行为，然后介绍了一种从数据诱导出决策树的简单技术。读者将学习如何从树剪枝中受益，以及如何将诱出的树转换为一组规则。\n\
  \n![image](img/chapter_title_corner_decoration_left.png)  ||  || ![image](img/chapter_title_corner_decoration_right.png)\
  \  |\n\n| --- | --- | --- |\n\n![image](img/chapter_title_above.png)\n\n## 6.1 作为分类器的决策树\n\
  \n![image](img/chapter_title_below.png)\n\n表 6.1 所示的训练集包含八个示例，这些示例由三个属性描述，并标记为给定类别的正实例或负实例。为了简化基本概念的解释，我们假设所有属性都是离散的。稍后当底层原理明确后，我们将稍微推广该方法，使其也适用于具有连续属性或连续与离散属性混合集的领域。\n\
  \n决策树图 6.1 显示了几个能够处理表 6.1 示例决策树。内部节点表示属性值测试，![image](img/image246.png)表 6.1 由三个符号属性描述的八个训练示例，并分类为给定类别的正、负示例；边缘表示在测试结果不同的情况下如何进行，叶子节点¹包含类标签。待分类的示例首先接受最顶端节点（根节点）规定的测试。测试结果决定了示例应沿着哪条边缘向下传递，该过程持续直到到达叶子节点。一旦发生这种情况，示例就会被标记为该叶子节点相关的类。\n\
  \n让我们用图 6.1b 中的树来说解释这个过程。根节点询问形状，其三个值中的每一个都由一条边缘表示。在示例 e1；e2 和 e8 中，我们找到了值 `shape=circle`，它对应于左边缘。示例沿着该边缘向下传递，结束于标记为\
  \ `pos` 的叶子。这确实是这三个示例共同的类。在 e4 中，`shape=triangle`，相应的边缘结束于标记为 `neg` 的叶子——再次，正确的类。稍微复杂一点的是示例\
  \ e3；e5；e6 和 e7 的情况，其 `shape=square`。对于这个特定值，边缘没有结束于叶子，而是结束于包含测试的节点，该节点询问 `filling-size`\
  \ 的值。在 e5 和 e7 中，值为大，导致指向标记为 `pos` 的叶子。在另外两个示例 e3 和 e6 中，值为小，这把它们发送到标记为 `neg` 的叶子。\n\
  \n我们已经证明了图 6.1b 中的决策树识别了所有训练示例的正确类。作为一个小练习，鼓励读者验证图片中显示的其他树也同样成功。²\n\n### 可解释性\n\n\
  将此分类器与早些介绍的分类器相比，我们可以看到一个显著的优势：可解释性。如果有人问为什么示例 e1 被视为正例，答案是“因为它的形状是圆形”。其他分类器不提供此类解释。特别是神经网络是一个真正的黑箱：当给出一个示例时，它只是返回类，从不提供任何\n\
  \n![image](img/image605.png)\n\n¹两种拼写均使用：leaves 和 leafs。后者可能更合适，因为所讨论的“叶”应该是一个数据抽象，与原始物理对象无关。\n\
  \n²从某种意义上说，决策树可以看作数据压缩的简单机制。\n\n1. 作为分类器的决策树 115\n\n––––––––\n\n![image](img/scene_break.png)\n\
  \n# (A)\n\n![image](img/image343.png)饼皮大小\n\n小\n\n––––––––\n\n![image](img/scene_break.png)\n\
  \n# (B)\n\n![image](img/image082.png)填充尺寸\n\n形状\n\n––––––––\n\n![image](img/scene_break.png)\n\
  \n# (C)\n\n![image](img/image96.png)圆形\n\n方形\n\n大\n\n+\n\n小\n\n––––––––\n\n![image](img/scene_break.png)\n\
  \n形状\n\n––––––––\n\n![image](img/scene_break.png)\n\n(D)\n\n![image](img/image282.png)填充尺寸\n\
  \n大小\n\n三角形 方\n\n––––––––\n\n![image](img/scene_break.png)\n\n![image](img/image545.png)c\n\
  \n圆形\n\n− +\n\n−\n\n––––––––\n\n![image](img/scene_break.png)\n\n图 6.1 “饼”领域的示例决策树。注意它们在大小和测试顺序上的差异。它们都正确分类了表\
  \ 6.1 中列出的所有训练示例，tri、sq 和 c 分别代表三角形、方形和圆形\n\n––––––––\n\n![image](img/scene_break.png)\n\
  \n洞察为什么某个特定标签被优于其他标签。在贝叶斯和线性分类器的情况下，情况并不好。只有 k-NN 分类器提供了一种——相当原始的——论据。例如，可以说“x 应该标记为\
  \ pos，因为这是与 x 最相似的训练示例的类”。然而，这种说法与决策树实现的显式属性解释相比相差甚。\n\n### 缺失边缘\n\n读者记得在在线分类器中，示例可能会正好位于分类超平面上，在这种情况下类别的选择是随机随机的。类似的情况有时也会发生在决策树中。假设使用图\
  \ 6.1a 中的树来确定以下示例的类别：\n\n```\n.crust - size D small/AND.shape D triangle/AND.filling\
  \ - size D small/\n```\n\n\n\n\n让我们逐步遵循该步骤。根节点查询 `crust-size`。意识到该值较小时，分类器将示例沿着右边缘向下，对\
  \ `shape`（形状）进行测试。在这里，似乎只有两种可能的结果：圆形或正方形，但不是三角形。原因是，创建这棵树的人并不知道 `crust-size=small`\
  \ 的物体可能是三角形的：在训练集中没有发现任何此类种的样本。因此，似乎没有理由创建相应的对应边。即使创建了该边，也不清楚它应该引向何处。\n\n在计算机程序中实现此分类器的工程师必须确保程序在出现“缺失边”时“知道”该做什么。随机选择类别或倾向于选择频率最高的类别是最显而易见的可能性。\n\
  \n––––––––\n\n![image](img/scene_break.png) \n\n### 你学了什么？\n\n为了确保你理解了这一主题，请尝试回答以下问题。如果有困难，请回到上文中对应的部分。\n\
