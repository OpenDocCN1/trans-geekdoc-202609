  \n\n\n\n\n## 尝试不同的 k 值\n\n`k-means` 的一个显而易见的缺点是要求用户提供 `k` 的值。这说起来做起来难，因为通常情况下，工程师并不知道可用数据自然地会聚成多少个类。除非使用更复杂的技术（关于这些，请见后文），否则解决办法是尝试几个不同的值，然后根据适当的标准（例如在\
  \ `Eq. (14.3)` 中定义的标准）选择最好的。正如我们所知，该标准的缺点是它倾向于选择较小的簇。因此，数据分析师通常会将 `SD` 值除以 `k`（聚类数）进行归一化。\n\
  \n### 后处理：合并与分裂簇\n\n`k-means` 创建的簇集通常可以通过后处理技术来提高质量，通过分裂增加簇的数量，或通过合并减少数量。\n\n![image](img/image434.png)\n\
  \n对于合并，如果两个相邻簇的相互距离很小，它们将被合并。为了确定该距离是否值得合并，我们只需计算两个质心之间的距离，然后将其与通过以下和计算出的平均簇间距离进行比较，其中\
  \ `ci` 和 `cj` 是质心：\n\n```\nS D  d.ci; cj/ (14.4)\ni¤j\n```\n\n相反，当某个簇内部的示例间平均距离很高时，分裂就有意义了。具体的解决方案并不容易形式化，因为一旦我们指定簇\
  \ `C` 要被分裂为 `C1` 和 `C2`，我们需要决定 `C` 中的哪些示例将进入第一个簇，哪些进入第二个簇。然而，很多时候，在 `C` 中识别出两个相互距离最大的示例是完全可以的，然后将它们分别处理为新创建的\
  \ `C1` 和 `C2` 的代码向量。\n\n![image](img/image112.png)![image](img/image112.png)\n\n\
  ## k-Means 的分层应用\n\n另一种改进依赖于递归调用。该技术从对 `k = 2` 运行 `k-means` 开始，获得两个簇。之后，对这两个簇中的每一个应用\
  \ `k-means`，同样设置 `k = 2`。该过程一直持续直到满足适当的终止标准——例如用户想要获得的簇的最大数量，或者相邻簇之间的最小距离。\n\n这种分层版本规开了\
  \ `k-means` 的一个严重缺点：必须提供簇的数量，因为在这种情况下，数量是自动找到的。这在目标是识别贝叶斯分类器或 RBF 网络中的高斯中心时特别有用用。\n\
