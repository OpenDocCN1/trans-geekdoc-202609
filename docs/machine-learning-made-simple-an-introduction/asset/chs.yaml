  \ 1。\n\n这种方法的主要缺点是它忽略了这样一种情况：游戏中采取的所有动作对最终结果的贡献并不是平等的。玩家输掉可能是因为是因为在一系列精彩动作之后的单次失误。在这种情况下，惩罚良好的动作当然是不公平的，甚至是不实际的。反之亦如此：弱的动作实际上可能获得奖励，仅仅是因为由于对手意之外的失误而最终赢得了游戏。然而，人们认为，从长远来看，这些微小的“不公”会被抵消，因为在大多数时候，胜者的动作都是好的。\n\
  \n回归化表述的优点在于其简单性。\n\n### 连续化表述\n\n上述回归化表述中存在的问题（即它可能会因为单次失误而惩罚一系列良好的动作）在假设我们知道如何确定每个动作后的奖励的情况下，可以被消除。这确实是可能的；即使在无法做到此点的领域，至少也可以进行估计。然而，大多数时候，在游戏结束之前尝试确定给定动作的奖励是推测性的——因此具有误导性。这就是为什么这种方法很少使用的原因。\n\
  \n### 折中方案：折扣回报\n\n这本质上是一种改进的回归化表述，其根据游戏的长度来确定奖励。例如，获胜所需的时间越长，奖励就越高。\n\n*(注：提供的原文中存在大量重复段落，根据指令“不要重复输出原文”，以下译文将整合所有内容的完整翻译)*\n\
  \n[content]\n# 井棋游戏\n\n其原理如图 17.2 所示，这是针对棋盘大小为三乘三格子的简单情况给出的说明。两名玩家交替进行，一人在棋盘上画“叉”，另一人画“圈”。目标是形成三个“叉”或三个“圈”——无论是列、行还是对角线。谁先成功谁获胜。如果在左侧所示的情况下，轮到画“叉”的玩家操作，他可以通过在左下角画一个“叉”来获胜。相反，如果是对手的操作，对手将通过在那里画一个“圈”来阻止这一切。\n\
  \n## 状态与动作\n\n每个棋盘位置代表一个状态。在每个状态下，玩家需要选择一个具体的动作。因此，在左侧所示的状态下，有三个空格，因此有三个动作可供选择（一个是获胜的动作）。整个情况可以用一个查找表来表示，其中每个状态-动作对都有一个特定的值，`Q(s;\
  \ a)`。\n\n![image](img/image330.png)\n\n![image](img/image043.png)![image](img/image709.png)\n\
  \n––––––––\n\n![image](img/scene_break.png)\n\n图 17.2 在井棋中，两名玩家交替放置他们的“叉”和“圈”。获胜者是获得直线三连（垂直、水平或对角线）的人。\n\
  \n基于这些值，$\\epsilon$-greedy 策略决定了在特定状态下应该采取哪种动作。动作产生一个奖励 `r`，然后该奖励将通过公式 (17.1) 更新状态-动作对的值。\n\
  \n实现学习场景最典型的方法是让程序与自己进行长系列游戏，从对动作的随机性选择开始（仅基于 `Q(s; a)` 的初始值），然后逐渐改进它们，直到达到非常高的竞技水平。\n\
  \n主要问题在于如何确定具体动作的奖励。原则上，可以考虑三种替代方案。\n\n![image](img/image602.png)\n\n### 回归化表述\n\
  \n这可能是处理奖励分配问题最简单的方法。进行一整场游戏。如果赢了，学习智能体在整个游戏中遇到的所有状态-动作对都被处理为收到了奖励 1。如果输了，它们被处理为都收到了奖励\
  \ 1。\n\n这种方法的主要缺点是它忽略了这样一种情况：游戏中采取的所有动作对最终结果的贡献并不是平等的。玩家输掉可能是因为在一在一系列精彩动作之后的单次失误。在这种情况下，惩罚良好的动作当然是不公平的，甚至是不实际的。反之亦如此：弱的动作实际上可能获得奖励，仅仅是因为由于对手意之外的失误而最终赢得了游戏。然而，人们认为，从长远来看，这些微小的“不公”会被抵消，因为在大多数时候，胜者的动作都是好的。\n\
  \n回归化表述的优点在于其简单性。\n\n### 连续化表述\n\n上述回归化表述中存在的问题（即它可能会因为单次失误而惩罚一系列良好的动作）在假设我们知道如何确定每个动作后的奖励的情况下，可以被消除。这确实是可能的；即使在无法做到此点的领域，至少也可以进行估计。然而，大多数时候，在游戏结束之前尝试确定给定动作的奖励是推测性的——因此具有误导性。这就是为什么这种方法很少使用的原因。\n\
  \n### 折中方案：折扣回报\n\n这本质上是一种改进的回归化表述，其根据游戏的长度来确定奖励。例如，获胜所需的时间越长，奖励就越高。\n\n*(注：由于用户提供的原文包含大量重复内容，此处译文已根据要求进行去重并整合翻译。)*\n\
  \n\n\n\n## 你学了什么？\n\n为了确保你理解这一主题，请尝试回答以下问题。如果你有困难，请回到前文中对应的部分。\n\n- 描述强化学习中 `SARSA`\
  \ 方法的原理。这个名字是从哪里来的？\n\n表 17.2 SARSA 算法——使用 `E-greedy` 策略和任务的阶段性表述\n\n![image](img/image731.png)\n\
  \n输入：用户指定的参数 `E`；`ϵ`；`γ`\n\n所有动作值对的初始化值，`Q0(si, aj)`；对于每个状态-动作对 `si, aj`，初始化 `kij(D)\
  \ = 0`；\n\n1. 选择一个初始状态 `s`。\n2. 使用表 17.1 中的 `E-greedy` 策略选择动作 `a`。\n3. 执行动作 `a`。这产生了一个新状态\
  \ `s⁰` 和奖励 `r`。\n4. ![image](img/image335.png)在状态 `s⁰` 下，使用 `E-greedy` 策略选择动作 `a⁰`。更新\
  \ `Q(s, a) = Q(s, a) + ϵ[r + γQ(s⁰, a⁰) - Q(s, a)]`。\n5. ![image](img/image530.png)令\
  \ `s=s⁰` 且 `a=a⁰`。如果 `s` 是终止状态，跳转到 1 开始一个新阶段；否则跳转到 3。\n\n![image](img/image731.png)\n\
