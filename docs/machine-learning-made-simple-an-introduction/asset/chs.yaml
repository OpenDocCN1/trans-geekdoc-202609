  4. 考虑一组包含十个训练示例的集合。假设有一个连续属性具有如下值：3:6; 3:2; 1:2; 4:0; 0:8; 1:2; 2:8; 2:4; 2; 2;\
  \ 1:0。假设前五个示例以及最后一个示例为正，其他示例均为负。该属性范围的最佳二分划分是什么？\n\n### 思考\n\n1. 用于评估决策树的基准性能标准是误差率和树的大小。然而，在某些领域，这些标准并不适用。建议一些决策树的大小或其误差率可能不重要的应用。提示：考虑错误决策的代价和获取属性值的成本。\n\
  2. 在什么样的领域中，决策树明显优于基准 1-NN 分类器？提示：考虑噪声、无关属性或训练集大小等特征；然后根据你自己的判断每个特征可能对分类行为产生什么影响。\n\
  \n\n\n\n3. 在什么类型的数据上，线性分类器的表现可能比决策树更好？请给出至少两个描述此类数据的特征。参考与上一个问题相同的提示。\n\n4. 在找到前两个问题的答案后，你应该能够得出的逻辑结论：对给定数据同时应用决策树归纳和线性分类器归纳，它们的性能将揭示关于数据的什么特征？\n\
  \n5. 本章描述的决策树对给定的示例的类别仅给出“硬性”的是或否判断（从这个意义上说，可以认为贝叶斯分类器或多层感知器更具活性）。为了缓解这一弱点，请提出一种机制来修改决策树框架，以便对于每个示例不仅给出类别标签，还给出分类器对该标签的置信度。\n\
  \n### 计算机作业\n\n1. 实现决策树归纳的基准算法，并在 UCI 仓库的几个选定领域测试其行为。将结果与 `k-NN` 分类器获得的结果进行比较。\n\
  \n2. 实现本章描述的简单剪枝机制。从 UCI 仓库中选择一个数据文件。运行多次实验，观察不同程度的剪枝如何影响训练集和测试集上的错误率。\n\n3. 从 UCI\
  \ 仓库中选择一个足够大的领域。留出 30% 的示例用于测试。对于训练，分别使用剩余示例的 10%, 20%, . . . 70%。绘制一张图，横轴表示示例数量，纵轴表示用于归纳的计算时间。再绘制另一张图，纵轴表示测试集上的错误率。讨论所得的结果。\n\
