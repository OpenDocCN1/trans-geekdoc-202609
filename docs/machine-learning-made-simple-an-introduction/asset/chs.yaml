  \n# 3.8  总结与备注\n\n![image](img/chapter_title_below.png)\n\n• 在分类对象 `x` 时，`k\\-NN`\
  \ 分类器在训练集中找到与 `x` 最相似的 `k` 个示例，然后选择这些示例中最常见的类别标签。\n\n• `k\\-NN` 分类器的行为很大程度上取决于如何计算向量之间的相似性。建立向量\
  \ `x` 和 `y` 之间相似性的简单方法可能是使用通过公式得到的几何距离：\n\n![image](img/image457.png)![image](img/image135.png)d(x;\
  \ y) = q†^n\n\n––––––\n\n![image](img/scene_break.png)\n\nd(xi; yi) (3.5)\n\n本质上，对于连续属性我们使用\
  \ `d(xi; yi) = (xi \\- yi)²`，对于离散属性，如果 `xi = yi` 则令 `d(xi; yi) = 0`，如果 `xi ¤ yi`\
  \ 则令 `d(xi; yi) = 1`。\n\n• 如果描述示例的许多属性是无关的，`k\\-NN` 分类器的性能就会很。另一个问题是属性值的缩放，后者可以通过将属性值归一化到单位区间来缓解。\n\
  \n• 某些示例是有害的，因为它们出现在训练集中会增加错误率。另一些示例是冗余的，它们只会增加计算成本而不提高分类性能。应该移除有害和冗余示例。\n\n• 在某些应用中，每个最近邻都有相同的票数。在其他应用中，票数会根据示例到分类对象的距离进行加权。\n\
  \n\n\n\n### 历史说明\n\n最近邻分类器的想法最初由 Fix 和 Hodges [27] 提出，但首次系统分析是由 Cover 和 Hart [20]\
  \ 以及 Cover [19] 提供的。随后，Dasarathy 的著作 [21] 详尽的处理。这里描述的加权 `k-NN` 分类器由 Dudani [23]\
  \ 提出。寻找训练集一致子集的最早技术由 Hart [35] 描述——本章介绍的是其微调版本。Tomek Links（Tk 连接）的概念源于 Tomek [89]。\n\
