  \  |\n| --- | --- | --- |\n\n![image](img/chapter_title_above.png) \n\n## 9.2 Schapire\
  \ 的提升算法（Boosting）\n\n![image](img/chapter_title_below.png) \n\n尽管袋装法通常能取得令人印象的结果，但它存在一个严重的缺陷：投票分类器都是从随机选择的数据独立引导的。人们可能会推测，更智能且可能更成功的方法应该依赖于一种让分类器相互补充的机制。例如，可以通过从其他分类器认为困难的训练示例中引导每一个分类器来实现。Schapire\
  \ 的提升算法正是这一想法发明的。\n\n![image](img/image102.png) 引导三个互补的分类器。假设创建了一个包含 `m` 个训练示例的随机子集\
  \ `T1`。这些示例被用于引导第一个分类器 `C1`。当在整个训练集 `T` 上测试此分类器时，我们将观察到它错误分类了数量数量示例。\n\n![image](img/image102.png)\
  \ 假设我们现在创建另一个训练子集 `T2`。让它由 `m` 个示例组成，选取方式要确保之前引导的 `C1` 能正确分类其中 50%，错误分类其余 50%。这意味着\
  \ `T2` 对于 `C1` 来说非常困难，以至于分类器的表现不会超过抛硬币。从由此创建的训练子集中，引导出第二个分类器 `C2`。\n\n两个分类器 `C1`\
  \ 和 `C2` 分别从不同的示例引导产生，它们在标记实例方面不可避免会有差异。因此，需要一个平局判定。为此，创建了第三个训练子集 `T3`，它仅由 `C1`\
  \ 和 `C2` 产生分歧的示例组成。从第三个子集 `T3` 中引导出第三个分类器 `C3`。\n\n该原理由表 9.2 中的伪代码总结。当给出一个示例时，主分类器收集由三个分类器建议的标签，然后返回得票较多的类别。理想情况下，每个训练集\
  \ `Ti` 的大小相同，均为 `m`。\n\n### 递归实现\n上述原理可以通过递归方式实现。图 9.2 显示了实现方法。生成的分类器三元组（虚线框内）被视为单个分类器。在下一步中，以一种确保三元组在\
  \ `T4` 上的错误率为 50% 的方式创建一个新的训练子集 `T4`。\n\n#### 表 9.2 Schapire 提升算法算法\n输入：训练集 `T`\
  \ 和用户选择的引导技术\n1. 创建随机训练子集 `T1`，并从其引导出 `C1`。\n2. 创建训练子集 `T2`，确保 `C1` 在其上的得分为 50%。从\
  \ `T2` 引导出 `C2`。\n3. 创建 `T3`，使得 `C1` 和 `C2` 在其包含的每个示例上意见不一致。从 `T3` 引导出 `C3`。\n4.\
  \ 分类时，使用简单的多数投票法。\n\n![image](img/image332.png) 1. Schapire 的提升算法\n![image](img/image697.png)\
  \ 图 9.2 Schapire 提升算法的递归应用。主分类器汇总分类器 1–3 的投票。然后，主分类器 B 与分类器 4 和 5 的投票\n\n––––––\n\
  \n![image](img/scene_break.png) 这些，引导出 `C4`。最后，创建训练子集 `T5`，由三元组和 `C4` 产生分歧的示例组成；从中引导出\
  \ `C5`。图 9.2 也显示了这种结果是如何分层组织的。\n\n重要的是理解投票的逻辑。如果分类器 1 到 3 都返回 0，主分类器返回 0；然而，如果分类器\
  \ 4 和 5 都返回 1，整个结构可能返回 1。\n\n注意使用单层递归生成的分类器总数为 3。当然，该原理可以重复，产生 5、7 等。假设进行 `NR` 层递归，参与的分类器总数为\
  \ `2^NR + 3`。\n\n![image](img/image254.png) \n\n### 性能考量\n假设每个引导的分类器的错误率都低于某一值 `E`。已经证明投票三元组的错误率小于\
  \ `3E² - 2E³`，这总是小于 `E`。例如，如果 `E = 0.2`，那么 `3E² - 2E³ = 0.12 - 0.016 = 0.104`。如果\
  \ `E = 0.1`，那么 `3E² - 2E³ = 0.03 - 0.002 = 0.028`。\n\n![image](img/image419.png)\
  \ 换句话，Schapire 的提升改进了单个分类器的性能。但如果第一个投票三元组（见上段）达到了 `3E² - 2E³ = 0.104`，那么让另外两个分类器（4\
  \ 和 5）达到同样低的错误率可能是困难的。处理这种情况的一种可能性是将它们中的每一个（分类器 4 和分类器 5）都作为一个三元组创建，如图 9.3 所示。在这种情况下，参与\
  \ `NR` 层递归的分类器总数将是 `3^NR`。\n\n要记住，每增加一层递归都会降低错误率。因此，理论上可以将错误率降低到零。然而，实践情况不同——原因将在下一段中讨论。\n\
  \n### 局限性\n主要的困难在于为后续的训练子集找到正确的示例。这些示例我们已经知道，必须满足某些标准。\n\n\n\n\n\n回一下，为了诱导第二个分类器\
  \ `C2`，我们需要创建一个训练子集 `T2`，其选择方式要使得上一个分类器 `C1` 只能正确分类其中 50% 的样本。\n\n这可能说起来易做起来难。例如，如果我们所拥有的整个训练集包含\
  \ 100 个示例，而第一个分类器的错误率是 10%，那么我们只有 10 个被分类错误的示例，此时需要添加 10 个被分类正确的示例来创建 `T2`；这意味着\
  \ `T2` 的大小不能超过 20。\n\n同样地，我们可能会发现无法找到 `m` 个满足第三个训练子集 `T3`要求的示例，正如我们所知，`T3` 应该仅由\
  \ `C1` 和 `C2` 给出相反类别标签的示例组成。\n\n即使我们成功创建了所有三个训练子集，我们也可能发现无法递归地应用相同的原理。要做到这一点，我们需要一个几乎无穷无尽（且显然负担不起）的示例来源——这是一种罕见的奢侈。\n\
  \n––––––––\n\n![image](img/scene_break.png)\n\n### 你学到了什么？\n\n为了确保你理解了这个主题，请尝试回答以下问题。如果你有困难，请返回前文中对应的部分。\n\
