    Aurora''s heart went out to him. "We all have regrets, Zane."


    "Yeah," Zane sighed, his gaze distant. "But some regrets… they haunt you."


    He turned to her, his eyes searching hers. "I''m not the man you think I am, Aurora.
    But I''m trying to be better. For the Syndicate, for the galaxy… for you."


    Aurora''s breath caught in her throat. Zane''s vulnerability, his raw honesty,
