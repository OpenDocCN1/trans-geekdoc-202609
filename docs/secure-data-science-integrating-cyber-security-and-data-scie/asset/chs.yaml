  \ 从较低值（如 2）增加时，由于误差方差的减少 [WANG2003]，分类错误自然会下降到一定程度。图 7.7(d) 展示了 `N` 对错误率的影响。该图表的\
  \ `x` 轴采用对数刻度。自然地，将 `N` 增加到某个点（如 20）有助于降低错误率，因为较高的 `N` 值使我们在声明新类别时具有更大的信心。但过大的 `N`\
  \ 值会增加 `M[new]` 和 ERR 率，因为如果一个新类别在数据块中的实例少于 `N` 个，算法就会漏掉它。我们发现 20 到 100 之间的任何值都是\
