  \n## 9.1 介绍\n\n恶意内部人员或许是许多或大多数组织信息保障面临的最强大威胁 [BRAC2004，HAMP1999，MATZ2004，SALE2011]。解决内部威胁检测问题的一种传统方法是监督学习，它从训练数据构建数据分类模型。不幸的是，监督学习方法的训练过程往往耗时且昂贵，且通常需要大量平衡良好的训练数据才能有效。在我们的实验中，我们观察到该问题的现实数据集中，不到\
  \ 3% 的数据与内部威胁（少数类）相关；超过 97% 的数据与非威胁（多数类）相关。因此，从这种不平衡数据训练的传统支持向量机 (SVM) [CHAN2011，MANE2002]\
  \ 在测试数据集上可能表现不佳。\n\n单类 SVM (OCSVM) [MANE2002] 通过构建仅考虑正常数据（即非威胁数据）的模型来解决稀有类别问题。在测试阶段，测试数据根据与模型的几何偏差被分类为正常或异常。然而，该方法仅适用于有界长度的静态数据流。相比之下，与内部威胁相关的数据通常是连续的，且威胁模式随时间演变。换句话说，数据是无界长度的流\
  \ [CANG2006]。因此，有效的分类模型必须具有自适应性（即能够应对不断演变的概念），并且必须高效，以便从大量不断演变的数据中构建模型。与内部威胁检测和分类相关的数据通常是连续的。在这些系统中，普通用户和内部威胁的模式可能会逐渐演变。新手程序员可以随着时间的推移发展技能成为专家程序员。内部威胁可以改变其行为，使其更接近合法用户进程。无论哪种情况，当直接相互比较时，这些发展两端的模式看起来可能截然不同。在我们的方法中，这些自然变化不会被视为异常。相反，我们将它们归类为自然概念漂移。传统的静态监督和无监督方法在这些情况下会产生不必要的误报，因为它们无法在系统中出现时处理这些情况。这些传统方法遇到高误报率。学习模型必须擅长应对不断演变的概念，并能高效地从大量数据构建模型，以快速检测真实威胁。基于这些原因，内部威胁问题可以被概念化为一个适用于连续数据流的流挖掘问题。无论使用监督还是无监督学习算法，所选方法都必须高度自适应，才能在这些条件下正确处理概念漂移。增量学习和基于集成的学习\
  \ [ALKH2012a，ALKH2012b，KANG2011，MASU2008，MASU2009，MASU2010a，MASU2010b，MASU2011a，MASU2011b，MASU2011c，MASU2011d，MASU2013]\
  \ 是克服这一障碍的两种自适应方法。由 *K* 个模型组成的集成，通过集体投票决定最终分类，可以减少测试集的假阴性 (FN) 和假阳性 (FP)。随着新模型的创建和旧模型的更新以变得更精确，准确度最低的模型会被丢弃，以始终保持恰好\
  \ *K* 个当前模型的集成。监督学习的一种替代方法是无监督学习，它可以有效地应用于纯未标记数据——即没有数据点被明确标识为异常或非异常的数据。基于图的异常检测\
  \ (GBAD) 是无监督学习的一种重要形式 [COOK2000，COOK2007，EBER2007]，但传统上仅限于静态、有限长度的数据集。这限制了其在内部威胁相关流中的应用，后者往往具有无界长度且威胁模式随时间演变。因此，将\
  \ GBAD 应用于内部威胁问题要求所用模型具有自适应性和高效性。增加这些特性允许从大量不断演变的数据中构建有效模型。\n\n我们将内部威胁检测视为一个流挖掘问题，并提出了两种方法（监督和无监督学习），用于高效检测流数据中的异常\
  \ [PARV2013]。为了应对概念演变，我们的监督方法维护一个不断演变的多个 OCSVM 模型集成 [PARV2011a]。我们的无监督方法将多个 GBAD\
  \ 模型结合在一个分类器集成中 [PARV2006，PARV2011b]。在两种情况下，集成更新过程的设计都是为了随着流的演变保持集成的时效性。这种演变能力提高了分类器在合法和非法代理行为随时间变化时对概念漂移的生存能力。在实验中，我们使用记录大型基于\
  \ Unix 的多用户系统系统调用数据的测试数据 [QUMR2013]。\n\n\n\n\n上述方法可能不太适用于序列数据 [PARV2012a, PARV2012b]。对于序列数据，我们的方法维护一个由多个无监督基于流的序列学习（USSL）模型组成的集成\
  \ [PARV2012a]。在学习过程中，我们将用户操作或命令中的重复序列模式存储在一个称为量化字典的模型中。特别是，由于在流中频繁出现而具有较高权重的较长模式会被纳入字典。在这种情况下，集成是`K`个量化字典类型模型的集合。当新数据到达或被收集时，我们会从这个新数据集生成一个新的量化字典模型。我们将采用所有模型的多数投票来发现该新数据集中的异常模式序列。如果新字典在集成中表现优于其他模型，我们将更新集成，并从集成中丢弃最不准确的模型。因此，随着流的演变，集成始终保持模型的时效性，在合法和非法行为随时间演变的情况下保持较高的检测准确率。我们的测试数据由不同经验水平的多个用户的实时记录命令序列以及一个概念漂移框架组成，以进一步展示该方法的实用性。\n\
  \n本章描述了我们利用流数据挖掘进行内部威胁检测的方法，适用于非序列和序列数据。在第 9.2 节中，我们提供了内部威胁和流挖掘的综述。我们还讨论了大数据/数据科学技术的可扩展性问题。非序列流数据的内部威胁在第\
  \ 9.3 节中讨论。序列流数据的内部威胁在第 9.4 节中讨论（图 9.1）。第 9.5 节总结了本章。更详细的讨论见 [THUR2017]。\n\n![图\
  \ 9.1 用于内部威胁检测的流分析。](img/fig9_1.jpg)\n\n图 9.1 用于内部威胁检测的流分析。\n\n## 9.2 内部威胁与流挖掘综述\n\
  \n### 9.2.1 内部威胁检测\n\n内部威胁检测工作应用了来自入侵检测和外部威胁检测的思想 [MAXI2003, SCHO2001, SCHU2002,\
  \ WANG2003]。有监督学习方法收集包含正常和异常行为记录的系统调用跟踪日志 [FORR1996, GAO2004, HOFM1998, NGUY2003]，从收集的数据中提取\
  \ `n`-gram 特征，并使用提取的特征训练分类器。文本分类方法将每个系统调用视为词袋模型中的一个词 [LIAO2002]。系统调用的各种属性，包括参数、对象路径、返回值和错误状态，已在各种有监督学习方法中被作为特征利用\
  \ [KRUG2003, TAND2003]。\n\n混合高阶马尔可夫链模型通过基于用户命令序列识别特定用户的`签名行为`来检测异常 [JU2001]。概率异常检测（PAD）算法\
  \ [STOL2005] 是一种用于异常检测的通用算法（在 Windows 环境中），它假设异常或噪声在训练数据中是罕见事件。伪装检测被一些人争论。多种检测方法被应用于\
  \ 70 个用户的“截断” UNIX Shell 命令数据集 [SCHO2001]。命令是使用 UNIX acct 审计机制收集的。对于每个用户，在一段时间内收集了若干命令。检测方法由多步马尔可夫模型和贝叶斯与马尔可夫方法的组合进行监督。有人认为该数据集不适合伪装检测任务\
  \ [MAXI2003]。有人指出，不同用户的数据收集周期差异很大（从几天到几个月不等）。此外，命令并非按输入顺序记录。相反，当应用程序终止审计机制时，它们被合并了。这导致了对严格序列数据进行可能错误分析的不幸后果。因此，在本提议的工作中，我们未考虑该数据集。这些方法与我们的有监督方法不同，因为这些学习方法本质上是静态的，不会从不断演变的流中学习。换句话说，数据的流特性未被进一步探索。因此，静态学习性能可能会随时间下降。另一方面，我们的有监督方法将从不断演变的数据流中学习。我们提出的工作基于有监督学习，通过从不断演变的流中学习，能够很好地处理动态数据或流数据。在异常检测中，使用了一类\
  \ SVM 算法 [STOL2005]。OCSVM 通过在正常数据上训练建立模型，然后根据与该正常训练数据的几何偏差将测试数据分类为良性或异常。对于伪装检测，一类\
  \ SVM 训练与二类训练同样有效 [STOL2005]。已针对使用二进制特征和基于频率特征的 SVM 进行了研究。具有二进制特征的一类 SVM 算法表现最好。\n\
  \n递归挖掘已被提出用于发现频繁模式 [SZYM2004]。在模式被唯一符号编码并用这种新编码重写所有序列后，一类 SVM 分类器被用于伪装检测。据我们所知，没有工作将这种\
  \ OCSVM 扩展到流领域。尽管我们的方法依赖于 OCSVM，但它已扩展到流领域，以便能够应对变化 [PARV2011b, PARV2013]。据我们所知，也有工作探索了用于内部威胁检测的无监督学习，但仅限于静态流\
  \ [ESKI2002, LIU2005]。基于静态图的异常检测（GBAD）方法 COOK2000, COOK2007, EBER2007, [YAN2002]\
  \ 将威胁和非威胁数据表示为图，并应用无监督学习来检测异常。`最小描述长度`（MDL）方法已被应用于 GBAD，用于电子邮件、手机通信、业务流程和网络犯罪数据集\
  \ [KOWA2008, STAN1996]。我们的工作建立在 GBAD 和 MDL 之上，以支持动态、不断演变的流 [PARV2011a, PARV2013]。\n\
  \n流挖掘是数据挖掘研究中一个相对较新的类别，适用于连续数据流 [FAN2004]。在这样的设置中，有监督和无监督学习都必须具有自适应性，以应对特征随时间变化的数据。主要有两种自适应方法：`增量学习`\
  \ [DAVI1998, DOMI2001] 和 `基于集成的学习` [FAN2004, MASU2010a, MASU2011a]。以往的工作表明，基于集成的方法更为有效，从而激发了我们的方法。\n\
  \n\n\n集成学习过去曾被用于增强正/负分类的有效性 [MASU2008, MASU2011a]。通过维护一个由 `K` 个模型组成的集成，这些模型共同对最终分类进行投票，可以减少测试集的\
  \ `false negatives`（假阴性，FN）和 `false positives`（假阳性，FP）。随着更好的模型被创建，较差的模型会被丢弃，以维持一个规模恰好为\
  \ `K` 的集成。这有助于集成随数据流不断变化的特性而演进，并使分类任务保持可处理。上述相关工作的比较总结在表 9.1 中。更完整的综述请参阅 [SALE2008]。\n\
  \n#### 表 9.1 针对非序列数据的各种方法的能力与侧重点\n\n```\n![](img/inline9_1.jpg)\n```\n\n内部威胁检测工作利用了入侵检测或外部威胁检测领域的思想\
  \ [SCHO2001, WANG2003]。例如，监督学习已被应用于检测内部威胁。收集正常活动和异常数据的系统调用追踪 [HOFM1998]；使用 `n`-gram\
  \ 从该数据中提取特征，最后用分类器进行训练。作者 [LIAO2002] 在内部威胁领域利用了文本分类思想，将每个系统调用视为词袋模型中的一个词。系统调用、相关属性、参数、对象路径、返回值以及每个系统调用的错误状态，在各种监督方法中作为特征\
  \ [KRUG2003, TAND2003]。研究人员 [JU2001] 采用了基于混合高阶马尔可夫链模型的监督模型。基于用户执行的命令序列，识别出特定用户的\
  \ `signature behavior`（签名行为），然后检测异常（另见 [ZLIO2011]、[KOPP2009]、[JAMA2012] 和 [SEKE2013])。\n\
  \nSchonlau 等人 [SCHO2001] 将多种检测方法应用于 70 个用户的“截断” UNIX shell 命令数据集。命令是使用 UNIX acct\
  \ 审计机制收集的。在一段时间内，为每个用户收集了一定数量的命令。检测方法基于多步马尔可夫模型以及贝叶斯和马尔可夫方法的组合，属于监督式。Maxion 等人 [MAXI2003]\
  \ 认为 Schonlau 数据集不适合伪装检测任务，并使用 Calgary 数据集创建了一个新数据集，应用了静态监督模型。\n\n这些方法与我们的工作在以下方面有所不同。这些学习方法本质上是静态的，不会在不断演进的数据流上学习。换句话说，数据的流特性未被进一步探索。因此，静态学习器的性能可能会随时间下降。另一方面，我们的方法将从不断演进的数据流中学习。我们证明了我们的方法是无监督的，且与监督模型（增量式）同样有效。研究人员已探索用于内部威胁检测的\
  \ `unsupervised learning`（无监督学习）[LIU2005]。然而，该学习算法本质上是静态的。虽然我们的方法是无监督的，但它同时从随时间演进的数据流中学习，并将更多数据用于无监督学习。在异常检测中，使用了一类支持向量机（SVM）算法（OCSVM）。OCSVM\
  \ 通过在正常数据上训练建立模型，然后根据与正常训练数据的几何偏差，将测试数据分类为良性或异常。Wang 等人 [WANG2003] 表明，对于伪装检测，一类\
  \ SVM 训练与二类训练同样有效。作者研究了使用二进制特征和基于频率特征的 SVM。具有二进制特征的一类 SVM 算法表现最佳。为了寻找频繁模式，Szymanski\
  \ 等人 [SZYM2004] 提出了递归挖掘，用唯一符号对模式进行编码，并使用这种新编码重写序列。他们使用一类 SVM 分类器进行伪装检测。这些学习方法本质上是静态的，不会在不断演进的数据流上学习。\n\
  \n### 9.2.2 流挖掘\n\n流挖掘是一个新的数据挖掘领域，其中数据是连续的 [ALKH2012a, MASU2010b, MASU2011a, MASU2011b,\
  \ MASU2011c, MASU2013]。此外，数据的特性可能会随时间变化（概念漂移）。在此，监督和无监督学习需要具有自适应性以应对变化。开发自适应学习有两种方式。一种是增量学习，另一种是基于集成的学习。增量学习用于用户行为预测\
  \ [DOMI2001]，但不用于异常检测。Davidson 等人 [DAVI1998] 引入了增量概率行为建模（IPAM），基于从训练数据估计的单步命令转移概率。随着新命令的到来，概率不断更新，并通过指数衰减方案的使用进行修正。然而，该算法并非为异常检测设计。因此，据我们所知，几乎没有其他研究者的工作在流挖掘领域处理内部威胁检测。这是利用流挖掘检测内部威胁的首次尝试\
  \ [PARV2011a, PARV2011b, PARV2012b]。\n\n最近，无监督学习已被应用于在数据流中检测内部威胁 [PARV2011b, PARV2013]。该工作不考虑用于威胁检测的序列数据。回顾一下，序列数据在内部威胁场景中非常常见。相反，它将数据视为图/向量，寻找规范模式，并应用基于集成的技术来应对变化。另一方面，在我们提出的方法中，我们考虑用户命令序列进行异常检测，并为正常模式构建量化字典。\n\
  \n用户重复的日常或每周活动可能构成用户画像。例如，用户频繁的命令序列可能代表该用户的规范模式。由于单遍算法的要求，在无界长度的动态数据流上寻找规范模式具有挑战性。为此，通过利用压缩/量化字典来建模常见行为序列，采用了一种无监督学习方法。这种无监督方法需要在单次遍历中识别正常用户行为\
  \ [CHUA2011, PARV2012a, PARV2012b]。这些重复序列的一个主要挑战是其长度的可变性。为了解决这个问题，我们生成一个字典，其中将包含收集到的数据流中存在的任何可能的规范模式组合。此外，我们结合了流挖掘的力量来应对渐变。我们进行了实验，并表明我们的\
  \ USSL 方法在概念漂移和异常检测的背景下效果良好。\n\n我们的工作 [PARV2012a, PARV2012b] 与 [CHUA2011] 的工作在以下方面有所不同。首先，[CHUA2011]\
  \ 中的工作侧重于字典构建以生成正常画像。换句话说，他们的工作并未解决我们关注的内部威胁问题。其次，[CHUA2011] 未考虑基于集成的技术；我们的工作利用基于集成的技术与无监督学习（即良性序列字典）相结合。最后，当用户数量增长时，字典构建将成为瓶颈。[CHUA2011]\
  \ 的工作未考虑可扩展性问题；在我们的案例中，我们使用 MapReduce 框架解决可扩展性问题。\n\n\n\n在 [PARV2012a] 中，采用了一种增量方法。未采用基于集成的技术，但文献表明，对于流挖掘，基于集成的技术比增量类技术更有效\
  \ [FAN2004, MASU2010a, MASU2011a]。因此，我们的方法侧重于基于集成的技术 [PARV2012b]。我们参考 表 9.2，其中列出了相关方法是无监督还是有监督，以及它们是否关注概念漂移、检测内部威胁以及来自流挖掘的序列数据。挖掘复杂应用的某些方面见\
  \ [EAGL2006]。\n\n#### 表 9.2 针对序列数据的各种方法的能力与关注点\n\n| ![](img/inline9_2.jpg) |\n\n\
  | --- |\n\n### 9.2.3 面向可扩展性的大数据技术\n\n流数据以高速度和大规模持续到来 [ALKH2012b]。这符合大数据的特征。“大数据”是指其规模、多样性和复杂性需要新的架构、技术、算法和分析来进行管理，并从中提取价值和隐藏知识的数据。因此，大数据研究人员正在寻找工具，以便及时且可扩展地管理、分析、汇总、可视化并从收集的数据中发现知识。\n\
  \n关于大数据管理，有许多技术可用于在廉价商用硬件组成的网格上实现大规模可扩展的数据处理，例如以下技术。Google 文件系统 [CHAN2006, DEAN2008]\
  \ 是一种可扩展的分布式文件系统，它利用商用硬件集群来促进数据密集型应用。该系统具有容错性，由于使用商用硬件，机器故障属于正常现象。为了应对故障，数据将复制到多个节点。如果一个节点发生故障，系统将利用存有复制数据的另一个节点。\n\
  \nMapReduce [CHAN2006, DEAN2008] 是一种支持以并行方式处理数据密集型应用的编程模型。MapReduce 范式支持 map 和 reduce\
  \ 函数。Map 生成一组中间键值对，然后 reduce 函数合并结果并进行归纳。事实上，正如 [CHAN2006] 和 [DEAN2008] 所示，map/reduce\
  \ 范式可以解决许多现实世界的问题。\n\nHadoop [ABOU2009, BU2010, XU2010] 是一个开源的 Apache 项目，支持 Google\
  \ 文件系统和 MapReduce 范式。Hadoop 广泛用于结合 MapReduce 解决可扩展性问题。例如，针对海量语义 Web 数据集，Husain 等人\
  \ [HUSA2009, HUSA2010, HUSA2011] 表明 Hadoop 可用于提供可扩展的查询。此外，MapReduce 技术已被 BioMANTA\
  \ 项目 [DING2005] 和 SHARD 利用（另见 [BIOM] 和 [SHAR]）。\n\nAmazon 开发了 Dynamo [DECA2007]，一种分布式键值存储。Dynamo\
  \ 不支持 Hadoop 所支持的主从架构。Dynamo 中的节点通过 gossip 网络通信。为了实现高可用性和性能，Dynamo 通过牺牲强一致性来支持一种称为最终一致性的模型。在最终一致性中，更新将异步传播到集群中的节点，并为每次更新生成一个新版本的数据。\n\
  \nGoogle 开发了 BigTable CHAN2006, [CHAN2008]，一种面向列的数据存储系统。BigTable 利用 Google 文件系统和\
  \ Chubby [BURR2006]（一种分布式锁服务）。BigTable 是一种基于行键、列名和时间戳的分布式多维稀疏映射。\n\n研究人员 [ABOU2009]\
  \ 利用了 MapReduce 和关系数据库技术的组合力量。关于大数据分析，有少量相关工作。例如，一方面，一些研究人员专注于通用分析工具以解决可扩展性问题；另一方面，其他研究人员专注于特定的分析问题。\n\
  \n关于工具，Mahout 是一个开源大数据分析工具，支持大数据的分类、聚类和推荐系统 [OWEN2011]。在 [CHU2006] 中，研究人员定制了知名机器学习算法，以利用多核机器和\
  \ MapReduce 编程范式。MapReduce 已被广泛用于挖掘 PB 级数据 [MORE2008]。\n\n关于具体问题，Al-Khateeb 等人 [ALKH2012b]\
  \ 和 Haque 等人 [HAQU2013a, HAQU2013b] 提出了利用 MapReduce 和 Hadoop 框架在演化流上进行可扩展分类的方法。有一些关于结合\
  \ MapReduce 进行并行 Boosting 的研究工作。Palit 等人 [PALI2012] 提出了两种并行 Boosting 算法：ADABOOST.PL\
  \ 和 LOGITBOOST.PL。\n\n对于序列数据，量化字典构建耗时较长。可扩展性是此处的瓶颈。我们利用分布式计算来解决这一问题。有两种方法可以实现这一目标。第一种是利用昂贵硬件的共享内存架构并行计算。后一种方法是利用商用硬件的无共享架构分布式计算。在我们的案例中，我们采用后一种选择。这里，我们使用基于\
  \ MapReduce 的框架，通过 Hadoop 分布式文件系统 (HDFS) 来促进量化。我们提出了多种算法来量化字典。对于每种算法，我们讨论其优缺点，并在大型数据集上报告性能结果。\n\
  \n## 9.3 基于集成的内部威胁检测\n\n### 9.3.1 集成学习\n\n集成分类过程如 图 9.2 所示。我们首先使用 OCSVM（有监督方法）或\
  \ GBAD（无监督方法）从单个数据块构建模型 [PARV2011a, PARV2011b, PARV2013]。在 GBAD 的情况下，在数据块中识别出 `规范子结构`，每个子结构表示为一个子图。为了识别异常，将测试子结构与集成中的每个模型进行比较。模型将根据测试子结构与模型的规范子结构差异程度，将其分类为异常。一旦所有模型投出票数，将应用加权多数投票做出最终分类决策。集成演化的安排旨在始终保持恰好\
  \ `K` 个模型。随着每个新数据块的到来，从新数据块创建第 `K` + 1 个模型，并从这 `K` + 1 个模型中丢弃一个牺牲模型。\n\n![图 9.2\
  \ 集成分类。](img/fig9_2.jpg)\n\n图 9.2 集成分类。\n\n选择牺牲模型有多种方式。一种方法是在最近的数据块上计算 `K` + 1 个模型中每个模型的预测误差，并丢弃预测效果最差的模型。这要求最近数据块的\
  \ `真实标签` 立即可用，以便准确测量预测误差。如果真实标签不可用，我们则依赖多数投票；与多数决定一致性最低的模型将被丢弃。这将产生一个由最符合当前概念的 `K`\
  \ 个模型组成的集成。\n\n### 9.3.2 面向无监督学习的集成\n\n\n\n\n# 9.3.2 无监督分类和基于集成的更新\n\n算法 9.1 总结了无监督分类和基于集成的更新算法。第\
  \ 3-4 行从最近的数据块构建一个新模型并暂时将其添加到集成中。接下来，第 5-13 行将集成中的每个模型应用于测试图 *t*，以检测可能的异常。我们对每个模型使用三种\
  \ GBAD 变体（P、MDL 和 MPS），本节将讨论每一种。最后，第 14-30 行通过丢弃与加权多数意见分歧最大的模型来更新集成。如果多个模型具有最多的分歧，则任意丢弃一个表现最差的模型。请注意，未使用真实标签。然而，模型的多数投票充当了所谓的“真实标签”。加权多数意见在第\
  \ 15 行使用以下公式计算：\n\n```\nWA(E,a) = \\frac{\\sum_{\\{ i|M_{i} \\in E,a \\in A_{M_{i}}\\\
  }}\\lambda^{\\ell - i}}{\\sum_{\\{ i|M_{i} \\in E\\}}\\lambda^{\\ell - i}}\n```\n\
  (9.1)\n\n其中 *M[i]* ∈ *E* 是集成 *E* 中从数据块 *i* 训练得到的模型，*AM[i]* 是模型 *M[i]* 报告的异常集合，*λ*\
  \ ∈ \\[0, 1\\] 是一个常数*衰减因子* \\[CHEN2009\\]，而 *ℓ* 是最近数据块的索引。因此，模型 *M[i]* 的投票获得权重 *λ*[−*i*]，最近构建的模型获得权重\
  \ *λ*[0] = 1，从前一个数据块训练的模型获得权重 *λ*[1]（如果它仍存在于集成中），以此类推。当 *λ* < 1 时，这会使最近模型的投票权重高于潜在过时模型的投票权重。然后在第\
  \ 15 行将加权平均值 *WA*(*E, a*) 四舍五入到最接近的整数（0 或 1），以获得加权多数投票。例如，在图 9.2 中，模型 *M*[1]、 *M*[3]\
  \ 和 *M*[7] 对输入样本 *x* 分别投出正票、正票和负票。如果 *ℓ* = 7 是最近的数据块，则这些投票的权重分别为 *λ*[6]、 *λ*[4]\
  \ 和 1。因此加权平均值为 *WA*(*E, x*) = (*λ*[6] + *λ*[4])*/*(*λ*[6] + *λ*[4] + 1)。如果 *λ* ≤\
  \ 0.86，在这种情况下负面多数意见获胜；然而，如果 *λ* ≥ 0.87，较新模型的投票将超过两个较旧的异议意见，结果为正分类。因此，参数 *λ* 可被调整以平衡大量旧信息与少量新信息的重要性。我们的方法利用\
  \ GBAD 先前迭代的结果来识别后续数据块中的异常。也就是说，在之前的 GBAD 迭代中发现的规范子结构可能会在每个模型中持续存在。这使得每个模型能够考虑自模型引入集成以来的所有数据，而不仅仅是当前数据块的数据。当数据流发生概念漂移时，这可能是一个显著优势，因为集成可以识别在整个数据流或大量数据块中具有规范性的模式，但这些模式在当前数据块中可能不存在。因此，即使恶意行为不频繁，内部人员仍可被检测到。\n\
  \n### 9.3.3 用于监督学习的集成\n\n算法 9.2 展示了我们监督算法的基本构建模块。在这里，我们首先介绍如何更新模型。算法 9.2 的输入如下：*D*[*u*]\
  \ 是最近标记的数据块（最近的训练数据块），*A* 是集成。第 3-4 行计算每个模型在 *D*[*u*] 上的预测误差。第 6 行使用 OCSVM 在 *D*[*u*]\
  \ 上构建一个新模型。第 7 行产生 *K* + 1 个模型。第 8 行丢弃预测误差最大的模型，保留 *K* 个最佳模型。算法 9.3 侧重于集成测试。集成 *A*\
  \ 和最新的未标记实例数据块 *D*[*u*] 将作为输入。第 3 行使用最新的未标记数据块执行特征提取和选择。第 4-9 行将获取从 *D*[*u*] 提取的每个特征并进行异常预测。第\
  \ 6-7 行使用每个模型预测特定特征的异常状态。最后，第 9 行基于结果的多数投票预测异常。\n\n我们的集成方法利用 OCSVM 先前迭代的结果来识别后续数据块中的异常。这允许考虑的不仅仅是当前正在分析的数据。之前\
  \ OCSVM 迭代中发现的模型也会被分析，而不仅仅是当前数据集块的模型。集成以这种方式处理执行，因为在之前数据块中识别出的模式可能在整个数据流或大量数据块中具有规范性，但在当前执行数据块中不具有规范性。因此，即使恶意行为不频繁，内部人员也将被检测到。重要的是要注意，我们始终保持集成大小固定。因此，在最近数据块上表现最差的过时模型将被新模型取代。\n\
  \n重要的是要注意，集成的大小随时间保持固定。表现不佳的过时模型将被更适合当前概念的、表现更好的新模型所取代。即使数据流中的总数据量可能是无界的，这也能使每一轮分类保持可处理。\n\
  \n在一个数据块中，使用单类支持向量机 (OCSVM) \\[MANE2002\\] 构建模型。OCSVM 方法首先将训练数据映射到高维特征空间（通过核函数）。接下来，算法迭代地寻找能最好地将训练数据与原点分开的最大间隔超平面。OCSVM\
  \ 可被视为常规的二类 SVM。这里第一类包含所有训练数据，第二类是原点。因此，超平面（或线性决策边界）对应于分类规则：\n\n```\nf(x) = w ·\
  \ x + b\n```\n(9.2)\n\n其中 *w* 是法向量，*b* 是偏置项。OCSVM 求解一个优化问题以找到具有最大几何间隔的规则。该分类规则将用于为测试样本\
  \ *x* 分配标签。如果 *f* (*x*) *<* 0，我们将 *x* 标记为异常，否则标记为正常。实际上，超平面到原点的距离最大化与被超平面与原点分隔的区域所包含的训练数据点数量之间存在权衡。\n\
  \n### 9.3.4 无监督学习\n\n算法 9.3 使用三种基于图的异常检测 (GBAD) \\[COOK2000, COOK2007, EBER2007,\
  \ YAN2002\\] 变体，利用每个模型推断潜在异常。GBAD 是一种基于图的方法，通过搜索三个因素来发现数据中的异常：顶点和边的修改、插入和删除。每个唯一因素运行自己的算法，该算法寻找一个规范子结构，并尝试找到与发现的规范子结构相似但不完全相同的子结构。规范子结构是指顶点和边的重复子图，当其合并为单个顶点时，能最大程度地压缩整个图。图\
  \ 9.3 中的矩形标识了所描绘图的一个规范子结构示例。\n\n![图 9.3 具有规范子结构（框出）和异常（阴影）的图。](img/fig9_3.jpg)\n\
  \n图 9.3 具有规范子结构（框出）和异常（阴影）的图。\n\n我们的实现使用 SUBDUE \\[KETK2005\\] 来寻找规范子结构。最佳规范子结构可以被描述为具有最小描述长度\
  \ (MDL) 的子结构：\n\n```\nL(S,G) = DL(G|S) + DL(S)\n```\n(9.3)\n\n其中 *G* 是整个图，*S* 是被分析的子结构，*DL*(*G*\
  \ □ *S*) 是 *G* 被 *S* 压缩后的描述长度，而 *DL*(*S*) 是被分析的子结构的描述长度。描述长度 *DL*(*G*) 是描述图 *G*\
  \ 所需的最小比特数 \\[EBER2011\\]。\n\n\n\n\n#### 内部威胁检测\n\n内部威胁表现为与规范子结构的微小百分比差异。这是因为内部威胁试图紧密模仿合法的系统操作，仅在由非法行为所体现的微小变化上有所不同。我们应用三种不同的方法来识别此类异常，具体讨论如下。\n\
  \n### 9.3.4.1 GBAD-MDL\n\n在找到最佳压缩规范子结构后，`GBAD-MDL` 会在后续子结构中搜索与该规范子结构的偏差。通过分析与规范子结构大小相同的子结构，识别出边和顶点标签的差异，以及边的方向或端点的差异。其中最异常的是那些只需最少修改即可生成与规范子结构同构的子结构的子结构。在图\
  \ 9.3 中，标记为 `E` 的阴影顶点是由 `GBAD-MDL` 发现的异常。\n\n### 9.3.4.2 GBAD-P\n\n相比之下，`GBAD-P`\
  \ 搜索那些如果被删除，将产生规范子结构的插入。对图所做的插入被视为规范子结构的扩展。`GBAD-P` 基于边和顶点标签计算每个扩展的概率，因此利用标签信息来发现异常。概率由下式给出：\n\
  \n$$P(A=v) = P(A=v|A)P(A) \\tag{9.4}$$\n\n其中 `A` 表示边或顶点属性，`v` 表示其值。概率 `P(A = v |\
  \ A)` 可由高斯分布生成：\n\n$$\\rho(x) = \\frac{1}{\\sigma\\sqrt{2\\pi}}\\exp\\left( {- \\\
  frac{(x - \\mu)^{2}}{2\\sigma^{2}}} \\right) \\tag{9.5}$$\n\n其中 `µ` 为均值，`σ` 为标准差。`ρ(x)`\
  \ 值越高对应越异常的子结构。\n\n因此，使用 `GBAD-P` 可确保由图中实际数据（而非仅其结构）所反映的恶意内部人员行为，能被我们的算法可靠地识别为异常。在图\
  \ 9.3 中，标记为 `C` 的阴影顶点是由 `GBAD-P` 发现的异常。\n\n### 9.3.4.3 GBAD-MPS\n\n最后，`GBAD-MPS`\
  \ 考虑那些如果被重新插入，将产生规范子结构的删除操作。为发现这些操作，`GBAD-MPS` 会检查父结构。父结构中大小和方向的变化意味着子图中存在删除。最异常的子结构是那些使父子结构变得相同所需转换代价最小的子结构。在图\
  \ 9.3 中，`A-B-C-D` 顶点的最后一个子结构被 `GBAD-MPS` 识别为异常，因为由阴影矩形标记的 `B` 和 `D` 之间缺少一条边。\n\n\
  ## 9.4 序列数据的内部威胁检测\n\n### 9.4.1 序列数据分类\n\n由于序列的长度定义为有序元素的数量，序列数据的长度可以是有限的，也可以是无限的。无限序列称为流序列数据。与内部威胁检测相关的序列数据本质上是基于流的。序列数据可能随时间收集，甚至持续数年。在这种情况下，我们假设数据流将被转换为若干个块。例如，每个块可能代表一周，并包含该时间段内到达的序列数据。\n\
  \n图 9.4 演示了分类器决策边界如何随时间变化（从一个块到下一个块）。数据点与两个类别（正常和异常）相关联。特别是，用户命令或命令子序列可能形成一种模式/短语，此处将其称为数据点。用户的非重复模式/短语可能形成异常。如图\
  \ 9.4 所示，有三个连续的数据块。深色实线代表其自身块的决策边界，而虚线代表前一个块的决策边界。如果数据流中不存在概念漂移，当前块及其前一个块的决策边界将相同（虚线和实线重合）。白点代表正常数据（真阴性），蓝点代表异常数据（真阳性），条纹点代表概念漂移的受害实例。\n\
  \n![图 9.4 流数据中的概念漂移。](img/fig9_4.jpg)\n\n图 9.4 流数据中的概念漂移。\n\n图 9.4 中展示的两种不同情况如下：\n\
  \n1.  **情况 1。** 第二个块的决策边界相对于第一个块向上移动。结果，第一个块的决策边界会将更多正常数据分类为异常，因此 FP（假阳性）会上升。回顾一下，真实类别为良性（正常）的测试点被分类器分类为异常，称为\
  \ FP。\n\n2.  **情况 2。** 第三个块的决策边界相对于第一个块向下移动。因此，第一个块的决策边界会将更多异常数据分类为正常数据，因此 FN（假阴性）会上升。回顾一下，真实类别为恶意的测试点被分类器分类为良性，称为\
  \ FN。\n\n在更一般的情况下，当前块的决策边界可能会发生变化，导致前一个块的决策边界同时错误分类正常和异常数据。因此，FP 和 FN 可能同时上升。\n\n\
  这表明基于单个块构建的模型将不再足够。这促使我们采用自适应学习。具体而言，我们将利用两种方法：\n\n#### 9.4.1.1 增量学习\n\n维护单个字典 [PARV2012a]。当从一个块中学习到规范序列模式时，它将被简单地添加到字典中。为寻找规范模式，我们将利用无监督基于流的序列学习（`USSL`）。增量学习分类过程如\
  \ 图 9.5 所示。首先，从新块中提取模式，随后将这些模式与来自前几个块的旧量化字典合并。最后，对新的合并字典进行量化（图 9.6）。\n\n![图 9.5\
  \ 使用增量学习的无监督流序列学习。](img/fig9_5.jpg)\n\n图 9.5 使用增量学习的无监督流序列学习。\n\n![图 9.6 增量学习框图。](img/fig9_6.jpg)\n\
  \n图 9.6 增量学习框图。\n\n#### 9.4.1.2 集成学习\n\n维护多个字典 [PARV2012b]。在集成中，我们维护 `K` 个模型。对于每个模型，我们维护单个字典。我们的集成方法使用一组不断演进的\
  \ `K` 个模型对数据进行分类。集成分类过程如 图 9.7 所示。回顾一下，我们使用无监督基于流的序列学习（`USSL`）从单个块训练模型。`USSL` 识别块中的规范模式并将其存储在量化字典中。文献\
  \ [MASU2008, MASU2010a, MASU2011a] 表明，基于集成的学习比增量学习更有效。在此，我们将重点关注基于集成的学习。为识别异常，测试点将与集成中的每个模型进行比较。\n\
  \n![图 9.7 基于集成的无监督流序列学习。](img/fig9_7.jpg)\n\n图 9.7 基于集成的无监督流序列学习。\n\n回顾一下，模型将根据测试数据与模型规范模式的差异程度，判定测试数据为异常。一旦所有模型投出票数，我们将应用多数投票法做出最终决定，判断测试点是否为异常（如图\
  \ 9.7 所示）。\n\n#### 9.4.1.3 模型更新\n\n\n\n我们始终维护一个固定大小的模型集合（此处为 *K* 个）。因此，当处理新数据块时，集合中已有\
  \ *K* 个模型，而第 *K* + 1 个模型将由当前数据块创建。我们需要通过用这个新模型替换一个受害模型来更新集合。受害模型的选择可以通过多种方式进行。一种方法是计算每个模型在最近数据块上相对于多数投票的预测误差。此处，我们假设最近数据块上的\
  \ `ground truth`（真实标签）不可用。如果真实标签可用，我们可以利用该知识进行训练。新模型将替换集合中产生最大预测误差的现有模型。\n\n###\
  \ 9.4.2 无监督基于流的序列学习 (USSL)\n\n正常用户画像被视为重复的日常或每周活动，即命令、系统调用等的频繁序列。这些重复的命令序列被称为规范模式。这些模式揭示了用户的常规或正常行为。当用户突然表现出异常活动，表明其行为显著偏离正常模式时，会针对潜在的内部威胁发出警报。\n\
  \n因此，为了识别内部威胁，首先我们需要找到正常用户行为。为此，我们需要收集命令序列，并以无监督的方式发现这些命令序列中观察到的潜在规范模式。这种无监督方法还需要在单次遍历中识别正常用户行为。这些重复序列的一个主要挑战是其长度的可变性。为了解决这个问题，我们需要生成一个字典，其中将包含采集到的数据流中存在的任何可能的规范模式组合。数据中可能出现的潜在变化包括新事件的开始、现有事件的省略或修改，或序列中事件的重新排序。例如，`liftliftliftliftliftcomcomecomecomecome-come`\
  \ 是数据流中由给定字母表示的命令序列。我们将把所有模式 `li, if, ft, tl, lif, ift, ftl, lift, iftl` 等视为我们可能的规范模式。然而，字典的巨大规模带来了另一个重大挑战。\n\
  \n我们通过以下方式解决了上述两个挑战。首先，我们使用单遍算法（例如 `LZW`，Lempel-Ziv Welch 算法 [ZIV1977]）从当前数据块中提取可能的模式，以准备一个我们称为\
  \ `LZW dictionary`（LZW 字典）的字典。`LZW dictionary` 根据以下公式拥有一组模式及其对应的权重：\n\n$$w_i = \\\
  frac{f_i}{\\sum_{i = 1}^{n}f_i} \\tag{9.6}$$\n\n其中 `w[i]` 是当前数据块中特定模式 `p[i]` 的权重，`f[i]`\
  \ 是模式 `p[i]` 在当前数据块中出现的次数，`n` 是该数据块中发现的不同模式的总数。\n\n接下来，我们根据模式的关联权重和长度，仅保留最长、频繁的唯一模式来压缩字典，同时丢弃其他被包含的子模式。这种技术称为压缩方法\
  \ (`CM`)，新字典称为量化字典 (`QD`)。量化字典包含一组模式及其对应的权重。此处，我们使用编辑距离来寻找最长模式。编辑距离是衡量字符串对之间相似性的指标\
  \ [BORG2011, VLAD1966]。它是将一个字符串转换为另一个字符串所需的最少操作次数，其中操作可以是字符的替换、添加或删除。就前面提到的例子而言，量化字典中的最佳规范模式将是\
  \ `lift`、`come` 等。\n\n此过程属于有损压缩，但足以提取有意义的规范模式。原因在于我们提取的模式是被包含的子模式的超集。此外，由于频率是我们实验中的另一个控制参数，不常出现的模式不可能是规律的用户模式。\n\
  \n与内部威胁相关的数据通常积累于组织和系统运行的多年间，因此最好将其表征为无界数据流。由于我们的数据是连续的数据流，我们使用基于集成的学习来持续更新我们的压缩字典。这个连续数据流被划分为一系列离散的数据块。例如，每个数据块可能包含一天或几周的数据，并可能包含多个用户会话。我们从每个数据块生成量化字典\
  \ (`QD`) 及其关联权重。权重衡量为该模式在该数据块内的归一化频率。\n\n当新数据块到达时，我们生成一个新的量化字典 (`QD`) 模型，并如前所述更新集成。图\
  \ 9.8 展示了我们的 `dynamic`（动态）、基于集成的无监督流序列学习方法的流程图。算法 9.4 展示了更新集成的基本构建模块。它接收最近的数据块 `S`、集成\
  \ `E` 和测试数据块 `T`。第 3-4 行从最近的数据块 `S` 生成一个新的量化字典模型，并暂时将其添加到集成 `E` 中。第 5-9 行使用集成中的每个模型对测试数据块\
  \ `T` 进行异常检测。第 13-24 行根据集成中模型的多数投票，在测试数据块 `T` 中查找并标记异常模式。最后，第 29 行通过丢弃准确率最低的模型来更新集成。如果多个模型具有相同的低性能，则丢弃任意一个模型。\n\
  \n![Figure 9.8 Unsupervised stream-based sequence learning (USSL) from a chunk in\
  \ ensemble-based case.](img/fig9_8.jpg)\n\n图 9.8 基于集成情况下从数据块进行的无监督基于流的序列学习 (USSL)。\n\
  \n#### 9.4.2.1 通过选择数据流中的模式构建 LZW 字典\n\n起初，我们认为数据未被标注（即无监督）。换句话说，我们不知道用户未来可能的操作序列。因此，我们使用\
  \ `LZW` 算法 [ZIV1977] 来提取可添加到字典中的可能序列。这些也可以是类似 `liftliftliftliftliftcomcomecomecomecomecome`\
  \ 的命令，其中每个唯一字母代表唯一的系统调用或命令。我们使用 Unicode 为每个命令建立索引。例如，`ls`、`cp`、`find` 分别索引为 `l`、`c`\
  \ 和 `f`。添加到我们字典中的可能模式或序列将是 `li, if, ft, tl, lif, ift, ftl, lift, iftl, ftli, tc,\
  \ co, om, mc, com, come` 等。当序列 `li` 在数据流中第二次被看到时，为了避免重复，它不会被包含在 `LZW` 字典中。相反，我们将频率加\
  \ 1，并通过将其与数据流中的下一个字符连接来扩展模式，从而产生一个新模式 `lif`。我们将继续此过程直到到达当前数据块的末尾。图 9.9 演示了我们如何从数据流生成\
  \ `LZW` 字典。\n\n![Figure 9.9 Quantization of dictionary.](img/fig9_9.jpg)\n\n图 9.9\
  \ 字典的量化。\n\n#### 9.4.2.2 构建量化字典\n\n\n\n\n一旦我们有了 LZW 字典，就会保留最长且最频繁的模式，并丢弃所有被其包含的子模式。算法\
  \ 9.5 逐步展示了如何从 LZW 字典生成量化字典。该算法的输入如下：包含一组模式 `P` 及其关联权重 `W` 的 LZW 字典 `D`。第 5 行选取一个模式（例如\
  \ `li`）。第 7-9 行查找所有编辑距离为 1 的最近模式。第 13-16 行保留权重乘以长度乘积最高的模式，并丢弃其他模式。我们重复这些步骤（第 5-16\
  \ 行），直到找到最长、最频繁的模式（`lift`）。之后，我们从一个完全不同的模式（`co`）开始，重复这些步骤，直到探索完字典中的所有模式。最终，我们得到一个更紧凑的字典，其中将包含许多有意义且有用的序列。我们称该字典为量化字典。图\
  \ 9.9 演示了如何从 LZW 字典生成量化字典。一旦我们识别出不同的模式 `lift`、`come` 等，任何与所有这些模式偏离 `X`% （在我们的实现中\
  \ ≥ 30%）的模式都将被视为异常。这里，我们将使用编辑距离来识别偏差。\n\n### 9.4.3 异常检测\n\n给定一个量化字典，我们需要找出数据流中可能引起潜在威胁的序列。为了形式化该问题，给定数据流\
  \ `S` 和集成 `E`，其中 `E` = `QD`1, `QD`2, `QD`3, …，且 `QD[i]` = `qd[i]`[1]*, `qd`[*i*2]*,\
  \ …*，如果数据流中的任意模式与 `E` 中的所有模式 `qd[ij]` 的偏差超过 `X`% （例如 >30%），则该模式被视为异常。为了找出异常，我们首先需要找到匹配的模式并从流\
  \ `S` 中删除它们。具体而言，我们从数据流 `S` 中找到与 `E` 中任意模式 `qdij` 完全匹配或编辑距离为 `α` 的模式。该模式将被视为匹配模式。`α`\
  \ 可以是 `qdij` 中该特定模式长度的一半、三分之一或四分之一。接下来，流中剩余的模式将被视为异常。\n\n为了识别数据流 `S` 中的非匹配模式，我们计算一个距离矩阵\
  \ `L`，其中包含 `E` 中的每个模式 `qd[ij]` 与数据流 `S` 之间的编辑距离。如果我们有完美匹配，即模式 `qd[ij]` 与 `S` 之间的编辑距离为\
  \ 0，我们可以在 `S` 中精确向后移动 `qd[ij]` 的长度，以找到该模式的起始点，然后将其从数据流中删除。另一方面，如果匹配中存在大于 0 但小于 `α`\
  \ 的误差，为了找到该模式在数据流中的起始点，我们需要根据 `L`[`i`, `j-`1]、 `L`[`i-`1, `j-1`]、 `L`[`i-`1, `j`]\
  \ 中哪个值最小，在矩阵中相应地向左、向对角线或向上遍历。最后，一旦找到起始点，我们就可以将该模式从数据流中删除。数据流中剩余的模式将被视为异常。\n\n##\
  \ 9.5 总结与展望\n\n我们的方法是将内部威胁检测定义为一个流挖掘问题，并同时处理非序列和序列数据。对于非序列数据，我们描述了两种方法（有监督和无监督学习），用于高效检测流数据中的异常。具体而言，我们提出了一种有监督学习解决方案，利用单类\
  \ SVM 应对概念演化。我们通过加权假阴性的代价来提高有监督方法的准确性。我们提出了一种基于 GBAD 的无监督学习算法来应对变化。我们有效地解决了有限标记训练数据（稀有实例问题）的挑战。我们通过统一的方式有效结合了流挖掘和基于图的挖掘的力量。据我们所知，这是首个利用这两种方法进行内部威胁检测的工作。\n\
  \n总之，为了应对概念演化，我们的有监督方法维护一个多个 OCSVM 模型的演化集成。我们的无监督方法将多个 GBAD 模型结合在一个分类器集成中。在两种情况下，集成更新过程的设计都是为了随着流的演化保持集成的时效性。这种演化能力提高了分类器在概念漂移下的生存能力，因为合法和非法代理的行为都会随时间变化。\n\
  \n接下来我们讨论序列数据的内部威胁。与内部威胁检测相关的序列数据本质上是基于流的。序列数据可能随时间收集，甚至长达数年。在这种情况下，我们假设连续数据流将被转换为若干数据块。例如，每个数据块可能代表一周，并包含该时间段内到达的序列数据。关于序列数据，我们提出了一个框架，利用无监督学习（USSL）通过基于流的序列学习，从连续的用户动作或命令中发现模式序列。我们有效地将多个\
  \ USSL 模型集成在一个分类器集成中，以利用基于集成的流挖掘和序列挖掘的力量。关于可扩展性问题，我们利用大数据技术。具体而言，可扩展性是构建用于量化字典的良性模式序列时的一个问题。为此，我们利用基于\
  \ MapReduce 的框架，并展示了我们工作的有效性。\n\n我们计划在以下方向扩展这项工作。对于无监督学习，我们假设没有可用的真实标签。事实上，随着时间的推移，可能会以反馈的形式获得一些真实标签。一旦以无监督方式创建了模型，我们希望根据用户反馈更新模型。目前，一旦模型创建完成，它就保持不变。当真实标签随时间变得可用时，我们将立即基于此反馈完善所有模型（另见\
  \ \\[MASU2010a\\]、\\[MASU2010b\\] 和 \\[MASU2010c\\]）。此外，当我们更新模型时，可能会发生串通攻击 \\[WANG2009,\
  \ ZHAO2005\\]。在这种情况下，`K` 个模型中的一组模型将在一段时间内不被替换。每次选择受害者时，这些串通模型都将存活下来。回顾一下，“串通”是指两个或多个模型之间达成的协议，即它们将始终在预测上达成一致。具体而言，如果我们有\
  \ `K` = 3 个模型，两个模型可能保持秘密协议，它们的预测将相同并被用作真实标签。因此，两个串通/隐秘的模型将始终存活，永远不会在模型更新中成为受害者。回顾一下，学习是无监督的，少数服从多数的投票将被视为真实标签。因此，我们将无法捕捉到内部攻击。我们的目标是识别串通攻击。为此，在模型的受害者选择过程中，我们将考虑模型随时间推移的一致性。如果模型的一致性持续很长时间并存活下来，我们将从中选择受害者。\n\
