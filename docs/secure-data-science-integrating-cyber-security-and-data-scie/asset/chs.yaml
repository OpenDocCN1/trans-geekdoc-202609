  \n## 第三部分 结语\n\nDOI: [10.1201/9781003081845-23](https://doi.org/10.1201/9781003081845-23)\n\
  \n在第三部分中，我们讨论了安全和隐私感知的数据科学。部分未来方向包括以下内容。在对抗性支持向量机学习方面（第 10 章），该工作的一个未来方向是将成本敏感度量添加到学习模型中。另一个方向是将单一学习模型扩展为集成模型，其中每个基学习器处理不同的一组攻击。我们还希望纳入对其他对抗性机器学习技术以及不同类型攻击的研究。此外，我们还希望考虑其他的博弈论模型。在对抗性相关向量机学习方面（第\
  \ 11 章），未解决的问题是发现一种高效的方法来同时更新核函数和学习参数。该解决方案将有助于在样本空间中找到针对最坏情况攻击的最优学习模型。与对抗性支持向量机学习类似，另一个方向是考虑不同类型的攻击。\n\
  \n在隐私保护数据挖掘方面（第 12 章），一个未来方向是构建可用于对扰动数据集进行分类的分类器。正如我们之前提到的，利用概率作为加权，配合随机噪声数据 R 的更好界限，是一种需要进一步研究的方法。此外，随着新型机器学习技术的开发，如基于深度学习的方法，我们需要探索针对这些方法的隐私保护机器学习。在隐私感知的基于策略的数据管理框架方面（第\
  \ 13 章），下一步是进行框架的详细设计和实现。我们还必须设计形式化框架，以便无论实施何种解决方案，都能指定和推理策略。我们还需要将用户的行为方面纳入考量。我们需要为诸如智能交通系统之类的应用调整该框架。\n\
  \n最后，在第 14 章中，我们讨论了数据科学在 COVID-19 相关应用中的应用，并讨论了可能发生的隐私侵犯。我们还讨论了由美国公民自由联盟等组织提出的各种框架。\n\
  \n# 第四部分 访问控制与数据科学\n\n## 第四部分 导言\n\nDOI: [10.1201/9781003081845-25](https://doi.org/10.1201/9781003081845-25)\n\
  \n第四部分由五章组成，描述了访问控制与数据科学。特别是，将讨论我们开发的一些实验系统。\n\n第 15 章描述了一个基于大数据访问控制的安全云查询处理系统。第\
  \ 16 章描述了我们开发的一个运行在云中的基于策略的信息共享系统。我们的信息共享策略植根于访问控制策略。第 17 章讨论了一个基于社交媒体数据语义 Web 的访问控制框架，我们将社交媒体数据视为大数据的一种形式。第\
  \ 18 章描述了我们基于语义 Web 大数据的访问控制开发的推理控制器。最后，第 19 章讨论了我们的一些工作如何应用于智能交通系统等应用。\n\n# 15\
  \ 基于大数据系统访问控制的安全云查询处理\n\nDOI: [10.1201/9781003081845-26](https://doi.org/10.1201/9781003081845-26)\n\
  \n## 15.1 介绍\n\n正如第 4 章所述，云计算是信息技术和数据处理领域的一个新兴范式。企业利用云计算服务外包数据维护，这可以带来显著的经济效益。企业在“云”中远程存储和访问数据。随着云计算的普及，服务提供商面临着日益增长的挑战。他们必须在提供高效信息检索的同时维护海量异构数据。因此，云计算解决方案的关键重点是可扩展性和查询效率。换句话说，云计算是大数据管理和分析的关键技术。\n\
  \n\n\n\n此外，正如第 4 章所述，语义 Web 技术正在开发中，旨以标准化方式呈现数据，使得数据既能被人类也能被机器检索和理解。历史上，网页是以纯 HTML（超文本标记语言）文件发布的，这些文件不适合推理。相反，机器将这些\
  \ HTML 文件视为一袋关键词。研究人员正在开发已标准化的语义 Web 技术，以解决此类缺陷。最著名的标准是`Resource Description Framework\
  \ (RDF)` [W3b]、`SPARQL Protocol and RDF Query Language` [W3c]（`SPARQL`）。`RDF`是存储和表示数据的标准，而`SPARQL`是从`RDF`存储中检索数据的查询语言。`RDF`被广泛用于表示社交网络。云计算系统可以利用这些语义\
  \ Web 技术的力量来表示和管理社交网络，从而使这些网络的用户具备为数据密集型应用高效存储和检索数据的能力。\n\n语义 Web 技术对于维护云中的数据可能特别有用。基于语义\
  \ Web 的社交网络提供了以标准化方式指定和查询异构数据的能力。此外，使用`Web Ontology Language (OWL)`，本体、不同的模式、类、数据类型和关系可以被指定，而无需牺牲标准的`RDF/SPARQL`接口。反之，云计算解决方案可能对基于语义\
  \ Web 的大数据社区（如社交网络社区）大有裨益。语义 Web 数据集正呈指数级增长。在 Web 领域，可扩展性至关重要。然而，高速响应时间在 Web 社区中也至关重要。我们相信云计算范式提供了一种能够同时实现这两个目标的解决方案。\n\
  \n现有的商业工具和技术在云计算环境下扩展性不佳。研究人员最近才开始关注这些问题。他们正在提议从头构建系统。在[WANG2010]中，研究人员为一种新的分布式数据库[COMP]提出了一种索引方案，该数据库可用作云系统。当涉及到诸如`RDF`之类的语义\
  \ Web 数据时，我们面临着类似的挑战。随着存储变得更便宜，以及存储和检索大量数据的需求，开发处理数十亿`RDF`三元组（需要 TB 级磁盘空间）的系统不再是遥不可及的前景。研究人员已经在处理数十亿三元组[NEWM2008,\
  \ ROHL2007]。竞赛正在组织中，以鼓励研究人员构建高效的存储库[CHAL]。目前，语义 Web 技术只有少数几个框架（例如`RDF-3X` [NEUM2008]、`Jena`\
  \ [CARR2004]、`Sesame` [OPEN]和`BigOWLIM` [KIRY2005])，并且这些框架对于大型`RDF`图存在局限性。因此，存储大量`RDF`三元组并高效查询它们是一个具有挑战性且重要的问题。\n\
  \n在本章中，我们讨论了一种基于访问控制的安全查询处理系统，该系统运行在云中并管理大量`RDF`三元组。这些`RDF`三元组可用于表示大数据应用，如社交网络，正如我们在之前的书中所讨论的[THUR2015]。我们在`JENA`之上开发了一个`SPARQL`查询优化器，用于查询处理引擎。我们在`SPARQL`查询优化器之上开发了两种访问控制模型，以控制对数据的访问。一种基于基于令牌的访问控制机制，另一种基于`XACML`（可扩展访问控制标记语言）访问控制框架[XACM]。也就是说，我们本质上讨论的是针对大数据系统的访问控制模型。\n\
  \n本章的组织结构如下。我们的方法在第 15.2 节中讨论。在第 15.3 节中，我们讨论相关工作。在第 15.4 节中，我们讨论我们的系统和操作架构。在第 15.5\
  \ 节中，我们讨论如何回答一个`SPARQL`查询。在第 15.6 节中，我们展示实验结果。在第 15.7 节中，我们讨论我们在原型系统之上构建的安全策略执行机制方面的工作。最后，在第\
  \ 15.8 节中，我们得出一些结论并讨论我们确定的未来改进领域。本章讨论的关键概念在图 15.1 中说明。概念、架构和实验的更详细讨论见[HUSA2011a]和[HUSA2011b]。由于语义\
  \ Web 技术可用于建模社交网络系统等大数据系统，我们的查询处理系统可用于查询社交网络和相关的大数据系统。\n\n![Figure 15.1 Experimental\
  \ cloud query processing system.](img/fig15_1.jpg)\n\n图 15.1 实验性云查询处理系统。\n\n## 15.2\
  \ 我们的方法\n\n可以构建一个分布式系统，以克服当前语义 Web 框架的可扩展性和性能问题。数据库正在被分布式部署，以提供此类可扩展的解决方案。然而，迄今为止，还没有用于存储和管理`RDF`数据的分布式存储库。研究人员只是最近才开始探索必须解决的问题和技术解决方案，以构建这样一个分布式系统。一条有前景的研究路线涉及利用现成的分布式数据库系统或关系数据库。此类数据库系统可以使用关系模式来存储`RDF`数据。`SPARQL`查询可以通过首先将其转换为`SQL`来回答[CHEB2007,\
  \ CHON2005, CYGA2005]。最优关系模式正在为此目的被探究[ABAD2007]。此类系统的主要缺点是它们针对关系数据进行了优化。它们可能无法针对`RDF`数据表现良好，特别是因为`RDF`数据是三元组集合[W3a]（一个有序的三元组，分别称为主语、谓语和宾语），这些三元组形成大型有向图。在`SPARQL`查询中，任意数量的三元组模式（TP）[W3e]可以在单个变量[W3d]上连接，这使得关系数据库查询计划变得复杂。由于这些系统针对关系数据模式和事务性数据库用法进行了优化，性能和可扩展性将仍然是一个具有挑战性的问题。\n\
  \n然而，另一种方法是从头构建一个用于`RDF`的分布式系统。在这里，将有机会设计和优化一个专门针对`RDF`数据的系统。在这种方法中，研究人员将是在重复造轮子。我们没有从空白开始，而是构建了一个利用云计算平台的通用分布式存储系统解决方案。然后，我们专门定制了系统和模式，以满足语义\
  \ Web 数据的需求。最后，我们使用这种存储设施构建了一个语义 Web 存储库。\n\n\n\n\n### 基于 Hadoop 的 RDF 存储与查询处理\n\
  \nHadoop [HADOa] 是一种分布式文件系统，文件可通过复制进行保存。它是构建存储系统的理想选择。Hadoop 具有高容错性和极高的可靠性。此外，它还包含\
  \ MapReduce [DEAN2004] 编程模型的实现，这是一种适合大规模数据并行处理的函数式编程模型。通过将数据划分为若干独立的数据块，MapReduce\
  \ 进程针对这些数据块运行，从而简化了并行化。而且，MapReduce 编程模型有助于简化连接多个三元组模式的任务。\n\n在本章中，我们将描述一种在 Hadoop\
  \ 中存储 RDF 数据的模式，并详细介绍针对这些数据处理查询的解决方案。在预处理阶段，我们处理 RDF 数据并填充分布式文件系统中的文件。此过程包括对数据文件进行分区和组织，以及执行字典编码。随后，我们将详细介绍用于信息检索的查询引擎。我们将明确说明如何利用\
  \ MapReduce 编程来满足 SPARQL 查询。具体而言，我们必须确定将要执行哪些 Hadoop“作业”来解决查询。我们提出了一种贪心算法，该算法生成的查询计划所需的\
  \ Hadoop 作业数量最少。这是一种利用启发式方法的近似算法，但我们证明了最坏情况具有合理的上界。最后，我们利用两个标准基准数据集进行实验。我们展示了数据集从\
  \ 0.1 亿到超过 66 亿三元组的实验结果。我们证明了我们的解决方案具有极佳的可扩展性。我们还证明了在超大数据集上使用标准基准查询时，我们的解决方案优于领先的最先进语义网存储库。\n\
  \n我们还为大数据设计并开发了两种访问控制模型。一种是基于令牌的机制，另一种基于 XACML。这两个系统均构建在我们的 SPARQL 查询优化器和用于语义网数据的\
  \ JENA 数据管理系统之上。我们的贡献如下所示，并以 图 15.2 进行说明。更多细节请参见 [HUSA2011a]。\n\n1.  我们设计了一种存储方案，用于在\
  \ Hadoop 分布式文件系统 (HDFS) [HADOb] 中存储 RDF 数据。\n\n2.  我们开发了一种算法，保证提供的查询计划成本由给定 SPARQL\
  \ 查询中变量总数的对数上界约束。它利用汇总统计信息估算连接选择性以打破平局。\n\n3.  我们构建了一个高度可扩展、容错且支持数据密集型查询处理的框架。\n\
  \n4.  我们证明了我们的方法在所有查询上均优于 Jena，在具有大结果集的复杂查询上优于 BigOWLIM 和 RDF-3X。\n\n5.  我们在 RDF\
  \ 数据系统之上开发了两套访问控制系统。\n\n![图 15.2 我们的贡献。](img/fig15_2.jpg)\n\n图 15.2 我们的贡献。\n\n##\
  \ 15.3 相关工作\n\nMapReduce 虽是一种编程范式，但正被研究人员迅速采纳。这项技术在处理大量数据的社区中日益流行。它是解决研究人员在云计算中面临的性能问题最有前景的技术。在\
  \ [ABAD09a] 中，作者讨论了 MapReduce 如何满足构建理想云数据库管理系统 (Cloud DBMS) 的大部分需求。研究人员和企业正利用 MapReduce\
  \ 技术进行网页索引、搜索和数据挖掘。在本节中，我们首先调查与 MapReduce 相关的研究。接下来，我们讨论与语义网相关的工作。\n\nGoogle 将 MapReduce\
  \ 用于网页索引、数据存储和社交网络 [CHAN2006]。Yahoo! 在其数据分析任务中大量使用 MapReduce [OLST2008]。IBM 已成功试验了利用\
  \ MapReduce 技术的纵向扩展-横向扩展搜索框架 [MORE07]。在 [SISM2010] 中，他们报告了如何集成 Hadoop 和 System R。Teradata\
  \ 通过将 Hadoop 与并行数据库管理系统集成完成了类似工作 [XU2010]。\n\n研究人员已利用 MapReduce 扩展分类器以挖掘 PB 级数据\
  \ [MORE2008]。他们研究了用于数据挖掘的数据分发和分区，并应用了三种数据挖掘算法来测试性能。数据挖掘算法正以不同形式被重写，以利用 MapReduce\
  \ 技术。在 [CHU2006] 中，研究人员通过利用 MapReduce 编程范式重写知名机器学习算法，以发挥多核机器的优势。该技术成功应用的另一个领域是仿真\
  \ [MCNA2007]。在 [ABOU09] 中，研究人员报告了一个将 MapReduce 与现有关系数据库技术相结合的有趣想法。这些工作与我们的研究不同之处在于，我们将\
  \ MapReduce 用于语义网技术。我们的重点是开发一种可扩展的解决方案，用于存储 RDF 数据并通过 SPARQL 查询检索它们。\n\n在语义网领域，利用\
  \ MapReduce 技术的工作并不多。我们发现了两个相关项目：BioMANTA [ITEE] 项目和可扩展、高性能、稳健和分布式 (SHARD) [CLOU]。BioMANTA\
  \ 提出了对 RDF 分子 [DING2005] 的扩展，并实现了一个基于 MapReduce 的分子存储 [NEWM2008]。他们使用 MapReduce\
  \ 来回答查询。他们最多查询了四百万三元组。我们的工作有以下不同之处：首先，我们查询了十亿级三元组。其次，我们设计了一种存储模式，专门针对提高 RDF 数据的查询执行性能。我们根据三元组的谓词和对象的类型，将\
  \ RDF 三元组存储在文件中。最后，我们还有一种算法，用于确定查询处理计划，其成本由给定 SPARQL 查询中变量总数的对数上界约束。通过使用该算法，我们可以确定作业的输入文件及其运行顺序。据我们所知，我们是首批提出一种在\
  \ HDFS 中使用平面文件存储 RDF 数据的存储模式，以及一种用于回答 SPARQL 查询的 MapReduce 作业确定算法的人。\n\nSHARD 是一个使用\
  \ Hadoop Cloudera 发行版的 RDF 三元组存储。该项目展示了初步结果，证明了 Hadoop 提高 RDF 数据集可扩展性的能力。然而，SHARD\
  \ 仅以三元组存储模式存储数据。它目前不进行查询规划或重排序，且其查询处理器不会最小化 Hadoop 作业的数量。针对语义网存储库的研究已相当深入，特别强调查询效率和可扩展性。事实上，此类存储库太多，无法逐一公平评估和讨论。因此，我们关注那些开源或可下载、且在语义网和数据库社区获得良好声誉的语义网存储库。\n\
  \n\n\n\n在 [ABAD2009b] 和 [ABAD2007] 中，研究人员报告了一种用于 RDF 数据存储和检索的垂直分区 DBMS。他们的解决方案是一种模式，为每个谓词使用一张两列的表。然后，他们的模式在列式关系数据库（如\
  \ CStore [STON2005] 或 MonetDB [BONC06]）之上实现。他们观察到，与传统的关系数据库模式相比，他们的方案提升了性能。我们在 MapReduce\
  \ 框架内的基于谓词的分区中利用了这项技术。然而，在垂直分区研究中，仅使用了小型数据库（<1 亿）。有几篇论文 [SIDI2008, MCGL2009, WEIS2008]\
  \ 表明，随着数据集规模的增加，垂直分区的性能会大幅下降。\n\nJena [CARR2004] 是一个用于 Jena 的语义 Web 框架。忠实于其框架设计，它允许集成多种持久化解决案。它还支持通过开发推理器进行推理。然而，Jena\
  \ 仅限于三元组存储模式。换句话说，所有数据都存储在一张单一的三列表中。Jena 对大型数据集的查询性能非常差。此外，对数据集的任何更改都需要对推理三元组进行完全重新计算。\n\
  \nBigOWLIM [KIRY2005] 是目前可用的最快、最具可扩展性的语义 Web 框架之一。然而，它的可扩展性不如我们的框架，且需要非常高端且昂贵的机器。它需要昂贵的硬件（大量主内存）来加载大型数据集，且加载时间很长。正如我们的实验所示，当查询中没有绑定对象时，它的表现不佳。然而，我们的框架在这种情况下性能不受影响。\n\
  \nRDF-3X [NEUM2008] 被认为是现有最快的语义 Web 存储库。换句话说，它拥有最快的查询时间。RDF-3X 使用直方图、汇总统计和查询优化来实现高性能语义\
  \ Web 查询。因此，RDF-3X 通常能在带有绑定对象的查询和聚合查询上胜过任何其他解决方案。然而，RDF-3X 的性能对于非绑定查询会呈指数级下降，对于选择性因子低的甚至简单的连接查询也是如此。这对于推理查询变得越来越相关，因为推理查询通常需要带有非绑定对象的子查询的并集。我们的实验表明，RDF-3X\
  \ 不仅在这类查询上较慢，而且经常中止且无法完成查询。例如，考虑一个简单的查询“选择所有学生”。在 LUBM 中，该查询要求我们选择所有研究生、选择所有本科生，并将结果合并。然而，该并集包含大量结果。虽然两个子查询都能轻松完成，但在拥有\
  \ 33 亿三元组的 LUBM (30,000) 上，RDF-3X 的并集操作会中止。\n\nRDF 知识库 (RDFKB) [MCGL2010] 是一种使用基于位向量的关系数据库模式构建的语义\
  \ Web 存储库。RDFKB 实现了比 RDF-3X 或垂直分区更好的查询性能。然而，RDFKB 旨在提供知识库功能，如推理正向链接、不确定性推理和本体对齐。RDFKB\
  \ 将这些目标置于可扩展性之前。RDFKB 无法加载拥有 30 亿三元组的 LUBM (30,000)，因此在可扩展性方面无法与我们的解决方案竞争。\n\nHexastore\
  \ [WEIS08] 和 BitMat [ATRE2008] 是针对 RDF 索引优化的主内存数据结构。这些解决方案在热运行中可能实现卓越的性能，但它们未针对从持久化存储进行的冷运行进行优化。此外，它们的可扩展性直接与可用的主内存\
  \ RAM 数量相关。这些产品不可用于测试和评估。\n\n在我们之前的工作 [HUSA2009, HUSA2010] 中，我们提出了一种贪心算法和一种穷举搜索算法来生成查询处理计划。然而，穷举搜索算法开销大，而贪心算法无界限且其理论复杂度未定义。在本章中，我们提出了一种新的带有上界的贪心算法。此外，我们确实观察到旧贪心算法无法生成最优计划的场景。新算法能够在每种此类情况下获得最优计划。Join\
  \ Executer 组件使用 MapReduce 框架运行作业。然后它将查询答案从 Hadoop 传回给用户。\n\n## 15.4 架构\n\n我们的系统架构如\
  \ 图 15.3 所示。它本质上由一个实现在云端的 SPARQL 查询优化器和一个 RDF 数据管理器组成。操作架构如 图 15.4 所示。它由两个组件组成。图\
  \ 15.4 的上半部分描绘了数据预处理组件，下半部分展示了查询回答组件。我们有三个用于数据生成和预处理的子组件。我们使用 N-triples 转换器组件将 RDF/XML\
  \ [W3f] 转换为 N-Triples [W3a] 序列化格式。谓词分割 (PS) 组件获取 N-triples 数据并将其分割为谓词文件。然后将谓词文件输入到谓词-对象分割\
  \ (POS) 组件，该组件根据对象类型将谓词文件分割为更小的文件。这些步骤在以下图中描述。\n\n![Figure 15.3 System architecture.](img/fig15_3.jpg)\n\
  \n图 15.3 系统架构.\n\n![Figure 15.4 Operational architecture.](img/fig15_4.jpg)\n\n\
  图 15.4 操作架构.\n\n### 15.4.1 数据生成与存储\n\n在我们的实验中，我们使用 LUBM [GUO2005] 数据集。它是一个基准数据集，旨在使研究人员能够评估语义\
  \ Web 存储库的性能 [GUO2004]。LUBM 数据生成器以 RDF/XML 序列化格式生成数据。这种格式不适合我们的目的，因为我们将数据作为平面文件存储在\
  \ HDFS 中，因此即使检索单个三元组，也需要解析整个文件。因此，我们将数据转换为 N-triples 以存储数据，因为采用该格式，一个文件的一行就包含一个完整的\
  \ RDF 三元组（主语、谓语和宾语），这非常方便与 MapReduce 作业配合使用。为将数据转换为我们预期格式所需的处理步骤将在以下章节中描述。\n\n###\
  \ 15.4.2 文件组织\n\n我们不将数据存储在单个文件中，因为在 Hadoop 和 MapReduce 框架中，文件是 MapReduce 作业的最小输入单位，且在没有缓存的情况下，文件总是从磁盘读取。如果我们将所有数据放在一个文件中，整个文件将作为输入用于每个查询的作业。相反，我们将数据分割成多个较小的文件。分割分两步进行，我们将在以下章节中讨论。\n\
  \n### 15.4.3 谓词分割\n\n\n\n# 15.4.3 使用谓词进行分割\n\n在第一步中，我们根据谓词对数据进行划分。这种划分能立即让我们缩减任何不包含变量谓词的\
  \ SPARQL 查询的搜索空间。对于此类查询，我们只需为每个谓词选取一个文件，并仅在这些文件上运行查询。为求简化，我们使用谓词命名文件，例如，所有包含谓词 `p1:pred`\
  \ 的三元组都存入名为 `p1-pred` 的文件中。然而，如果三元组模式 [W3e] 中存在变量谓词，且我们无法确定对象的类型，则必须考虑所有文件。如果我们能确定对象的类型，则考虑所有包含该类型对象的文件。我们将在\
  \ 第 15.5 节 中进一步讨论这一点。在真实的 RDF 数据集中，不同谓词的数量通常不大 [STOC2008]。不过，也存在拥有许多谓词的数据集。在这种情况下，我们的系统性能不会变化，因为我们只选择与\
  \ SPARQL 查询中指定的谓词相关的文件。\n\n### 15.4.4 使用对象的显式类型信息进行分割\n\n在下一步中，我们处理 `rdf_type` 文件中的显式类型信息。谓词\
  \ `rdf:type` 在 RDF 中用于表示某资源是某个类的实例。`rdf_type` 文件首先被分割成与 `rdf:type` 谓词拥有的不同对象数量相同数量的文件。例如，如果在本体中，类层次结构的叶子节点是\
  \ `c[1]`、`c[2]`、…、`c[n]`，那么我们将为这些叶子节点中的每一个创建文件，文件名将类似于 `type_c[1]`、`type_c[2]`、…、`type_c[n]`。请注意，对象值\
  \ `c[1]`、`c[2]`、…、`c[n]` 不再需要存储在文件内部，因为它们可以轻松地从文件名中获取。这进一步减少了存储数据所需的空间。我们为谓词 `rdf:type`\
  \ 的每个不同对象值生成这样一个文件。\n\n### 15.4.5 使用对象的隐式类型信息进行分割\n\n我们根据对象的类型对剩余的谓词文件进行划分。并非所有对象都是\
  \ URI（统一资源标识符）；有些是字面值。字面值保留在以谓词命名的文件中；它们不需要进一步处理。URI 对象的类型信息未在这些文件中提及，但可以从 `type_*`\
  \ 文件中检索。URI 对象会移入以“谓词 _ 类型”命名的相应文件中。例如，如果一个三元组具有谓词 `p`，且 URI 对象的类型为 `c[i]`，则主语和对象将在文件\
  \ `p_c[i]` 中以一行的形式出现。为了进行这种分割，我们需要将谓词文件与 `type_*` 文件进行连接，以检索类型信息。\n\n我们的 MapReduce\
  \ 框架（详见 第 15.5 节）包含三个子组件。它接收用户的 SPARQL 查询并将其传递给输入与计划生成器。该组件使用我们在 第 15.5 节 中描述的算法选择输入文件，决定需要多少个\
  \ MapReduce 作业，并将信息传递给连接执行器组件，后者使用 MapReduce 框架运行作业。随后，它将来自 Hadoop 的查询结果返回给用户。\n\
  \n### 15.4.6 访问控制模型\n\n我们在 RDF 数据系统之上开发了一种基于令牌的访问控制机制以及一种基于 XACML 的访问控制模型。运行架构的右侧展示了\
  \ XACML 策略是如何实施的。也就是说，当数据从优化组件（左侧）到达时，根据 XACML 模型在数据上强制执行策略。具体流程为：请求被提交给 PEP（策略执行点）。PEP\
  \ 执行一些检查，然后将其交给 PDP（策略决策点）进行决策。PDP 随后咨询 PAP（策略接入点）和 PIP（策略信息点），然后决定应如何强制执行策略。最后，PEP\
  \ 强制执行该决策。值得注意的是，基于 XACML 的框架可以被任何访问控制模型替代，因此我们也实现了基于令牌的访问控制模型。这些安全模型将在 第 15.7 节\
  \ 中讨论。\n\n## 15.5 MapReduce 框架\n\n### 15.5.1 概述\n\nMapReduce 框架是我们云计算工作的核心。在本节中，我们将讨论如何在我们的\
  \ MapReduce 框架组件中回答 SPARQL 查询。\n\n第 15.5.2 节 讨论了我们用于选择输入文件以回答查询的算法。第 15.5.3 节 描述了生成回答\
  \ SPARQL 查询计划所需的成本估算。它介绍了我们在后续讨论中使用的一些术语。我们还描述了我们应遵循的用于估算计划成本的理想模型，并介绍了我们在实践中使用的基于启发式的模型。第\
  \ 15.5.4 节 展示了我们基于启发式的贪心算法，用于生成使用 第 15.5.3 节 中介绍的成本模型的查询计划。在某些生成计划的情况下，我们会面临平局情况。在\
  \ 第 15.5.5 节 中，我们将讨论如何处理这些特殊情况。第 15.5.6 节 通过一个示例查询展示了我们如何在 Hadoop MapReduce 作业中实现连接。\n\
  \n### 15.5.2 输入文件选择\n\n在确定作业之前，我们选择需要输入到作业中的文件。我们在此查询处理步骤中应用一些查询重写能力。我们获取用户提交的查询并遍历三元组模式。我们可能会遇到以下情况：\n\
  \n1.  在一个三元组模式中，如果谓词是变量，我们选择所有文件作为作业的输入，并终止遍历。\n\n2.  如果谓词是 `rdf:type` 且对象是具体的，我们选择具有该特定类型的类型文件。例如，对于\
  \ LUBM 查询 9（清单 1），我们可以选择文件 `type_Student` 作为输入集的一部分。然而，这引出了一个有趣的场景。在我们的数据集中，实际上不存在名为\
  \ `type_Student` 的文件，因为 Student 类在本体树中不是叶子节点。在这种情况下，我们参考 LUBM 本体 [LEHI] 来确定正确的输入文件集。我们添加文件\
  \ `type_GraduateStudent`、`type_UndergraduateStudent` 和 `type_ResearchAssistant`，因为\
  \ GraduateStudent、UndergraduateStudent 和 ResearchAssistant 是以 Student 为根节点的子树的叶子节点。\n\
  \n3.  如果谓词是 `rdf:type` 且对象是变量，那么如果该变量的类型由另一个三元组模式定义，我们选择具有该特定类型的类型文件。否则，我们选择所有类型文件。\n\
  \n4.  如果谓词不是 `rdf:type` 且对象是变量，那么我们需要确定该对象的类型是否由查询中的另一个三元组模式指定。在这种情况下，我们可以重写查询并消除一些连接。例如，在\
  \ LUBM 查询 9（清单 1）中，Y 的类型被指定为 Faculty，Z 的类型被指定为 Course，这些变量被用作最后三个三元组模式中的对象。如果我们选择文件\
  \ `advisor_Lecturer`、`advisor_PostDoc`、`advisor_FullProfessor`、`advisor_AssociateProfessor`、`advisor_AssistantProfessor`\
  \ 和 `advisor_VisitingProfessor` 作为输入集的一部分，则第 2 行的三元组模式变得不必要。同样，如果选择文件 `takesCourse_Course`\
  \ 和 `takesCourse_GraduateCourse`，则第 3 行的三元组模式变得不必要。因此，我们得到清单 2 所示的重写查询。然而，如果未指定对象的类型，则我们选择该谓词的所有文件。\n\
  \n5.  如果谓词不是 `rdf:type` 且对象是具体的，那么我们选择该谓词的所有文件。\n\n**清单 1：LUBM 查询 9**\n\n```\nSELECT\
  \ ?X ?Y ?Z WHERE {\n```\n\n\n\n\n#### LUBM 查询 9 重写\n\n```\n?X rdf:type ub:Student.\n\
  ?Y rdf:type ub:Faculty.\n?Z rdf:type ub:Course.\n?X ub:advisor ?Y.\n?Y ub:teacherOf\
  \ ?Z.\n?X ub:takesCourse ?Z\n```\n\n**清单 2：重写后的 LUBM 查询 9**\n\n```\nSELECT ?X ?Y\
  \ ?Z WHERE {\n?X rdf:type ub:Student.\n?X ub:advisor ?Y.\n?Y ub:teacherOf ?Z.\n\
  ?X ub:takesCourse ?Z\n}\n```\n\n### 15.5.3 查询处理的成本估算\n\n我们运行 Hadoop 作业来回答 SPARQL\
  \ 查询。在本节中，我们将讨论如何估算作业的成本。但在此之前，我们先引入一些稍后将用到的定义：\n\n**定义 15.1：三元组模式 (TP)**\n三元组模式是\
  \ SPARQL 查询 `WHERE` 子句中出现的主语、谓语和宾语的有序集合。主语、谓语和宾语可以是变量（未绑定）或具体值（已绑定）。\n\n**定义 15.2：三元组模式连接\
  \ (TPJ)**\n三元组模式连接是两个 TP 在一个变量上的连接。\n\n**定义 15.3：MapReduce 连接 (MRJ)**\nMapReduce\
  \ 连接是两个或多个三元组模式在一个变量上的连接。\n\n**定义 15.4：作业 (JB)**\n作业 `JB` 是一个 Hadoop 作业，其中完成一个或多个\
  \ MRJ。`JB` 具有一组输入文件和一组输出文件。\n\n**定义 15.5：冲突 MapReduce 连接 (CMRJ)**\n冲突 MapReduce\
  \ 连接是指在不同变量上共享一个三元组模式的一对 MRJ。\n\n**定义 15.6：非冲突 MapReduce 连接 (NCMRJ)**\n非冲突 MapReduce\
  \ 连接是指不共享任何三元组模式，或者共享一个三元组模式且 MRJ 在同一变量上进行的一对 MRJ。\n\n一个例子将更好地说明这些术语。在**清单 3**中，我们展示了\
  \ LUBM 查询 12。第 2、3、4 和 5 行各有一个三元组模式。第 2 行和第 4 行的 TP 在变量 `?X` 上的连接是一个 `MRJ`。如果我们做两个\
  \ MRJ，一个是第 2 行和第 4 行的 TP 在变量 `?X` 上的连接，另一个是第 4 行和第 5 行的 TP 在变量 `?Y` 上的连接，将会存在一个\
  \ `CMRJ`，因为第 4 行的 TP (`?X ub:worksFor ?Y`) 参与了在两个不同变量 `?X` 和 `?Y` 上的两个 MRJ。这种连接被称为\
  \ `CMRJ`，因为在一个 Hadoop 作业中，一个 TP 的多个变量不能同时作为键，而 MRJ 是在键上执行的。一个 `NCMRJ` 的例子是：第 2 行和第\
  \ 4 行的三元组模式在变量 `?X` 上的一个 MRJ，以及第 3 行和第 5 行的三元组模式在变量 `?Y` 上的另一个 MRJ。这两个 MRJ 可以组成一个\
  \ `JB`。\n\n**清单 3：LUBM 查询 12**\n\n```\nSELECT ?X WHERE {\n?X rdf:type ub:Chair.\n\
  ?Y rdf:type ub:Department.\n?X ub:worksFor ?Y.\n?Y ub:subOrganizationOf <http://www.U0.edu>\n\
  }\n```\n\n#### 15.5.3.1 理想模型\n\n为了回答一个 SPARQL 查询，我们可能需要不止一个作业。因此，在理想场景下，处理查询的成本估算需要对回答该查询所需的每个作业进行单独的成本估算。一个作业包含三个主要任务：读取、排序和写入。我们根据这三个任务来估算作业的成本。对于每个任务，为其处理的每个三元组模式分配一个单位成本。在当前模型中，我们假设读取和写入的成本相同。\n\
  \n$$\nCost = \\left( \\sum_{i = 1}^{n - 1} (MI_i + MO_i + RI_i + RO_i) \\right)\
  \ + MI_n + MO_n + RI_n \\tag{15.1}\n$$\n\n$$\n= \\left( \\sum_{i = 1}^{n - 1} Job_i\
  \ \\right) + MI_n + MO_n + RI_n \\tag{15.2}\n$$\n\n$$\nJob[i] = MI[i] + MO[i] +\
  \ RO[i] + RI[i] \\quad (if \\ i < n) \\tag{15.3}\n$$\n\n其中\n\n*   `MI_i` = 作业 `i`\
  \ 的 Map 输入阶段\n*   `MO_i` = 作业 `i` 的 Map 输出阶段\n*   `RI_i` = 作业 `i` 的 Reduce 输入阶段\n\
  *   `RO_i` = 作业 `i` 的 Reduce 输出阶段\n\n公式 (15.1) 是处理查询的总成本。它是每个作业单独成本的求和，加上最后一个作业的\
  \ Map 阶段成本。我们不考虑最后一个作业 Reduce 输出的成本，因为对于任何查询计划该成本都相同，因为该输出是最终结果，对于给定的查询和数据集是固定的。一个作业本质上是在文件数据上执行\
  \ MapReduce 任务。公式 (15.2) 显示了 MapReduce 任务划分为子任务。因此，为了估算每个作业的成本，我们将结合每个子任务的估算成本。\n\
  \n##### 15.5.3.1.1 Map 输入 (MI) 阶段\n\n该阶段从 HDFS 中存储的选定输入文件读取三元组模式。因此，我们可以将 MI 阶段的成本估算为每个选定文件中三元组总数的总和。\n\
  \n##### 15.5.3.1.2 Map 输出 (MO) 阶段\n\nMO 阶段的估算取决于正在处理的查询类型。如果查询没有绑定变量（例如 `[?X ub:worksFor\
  \ ?Y]`），则 Map 阶段的输出等于输入。所有三元组模式都被转换为键值对并作为输出。因此，对于此类查询，MO 成本将与 MI 成本相同。但是，如果查询涉及绑定变量（例如\
  \ `[?Y ub:subOrganizationOf <http://www.U0.edu>]`），则在生成键值对之前，可以应用绑定组件选择性估算。三元组模式的估算结果将占\
  \ Map 输出阶段的成本。选定的三元组被写入本地磁盘。\n\n##### 15.5.3.1.3 Reduce 输入 (RI) 阶段\n\n在此阶段，来自 Map\
  \ 输出阶段的三元组通过 HTTP 读取，然后根据其键值进行排序。排序后，具有相同键的三元组被分组在一起。因此，RI 阶段的成本估算等于 MO 阶段。RI 中排序的键值对数量等于\
  \ MO 阶段生成的键值对数量。\n\n##### 15.5.3.1.4 Reduce 输出 (RO) 阶段\n\nRO 阶段处理执行连接。因此，我们可以在此阶段使用连接三元组模式选择性汇总统计来估算其输出大小。稍后，我们将详细讨论我们框架所需的连接三元组模式选择性汇总统计。\n\
  \n然而，在实践中，前面的讨论仅适用于第一个作业。对于后续作业，我们既缺乏精确知识，也缺乏在第一个作业中应用连接后所选三元组模式数量的估算。因此，对于这些作业，我们可以将第一个作业\
  \ RO 阶段的大小作为后续作业各阶段的上界。\n\n公式 (15.3) 显示了一个非常重要的假设。它说明了中间作业的总成本，当 `i < n` 时，将 RO\
  \ 阶段的成本包含在作业总成本的计算中。\n\n#### 15.5.3.2 启发式模型\n\n\n\n\n在本节中，我们将展示理想模型在实践中既不实用也不具成本效益。有几个问题使得理想模型在实际应用中吸引力降低。\n\
  \n首先，理想模型考虑的是简单的抽象成本，即不同阶段读取和写入的三元组数量，忽略了在 Hadoop 中复制、排序这些三元组的实际成本以及运行作业的开销。但要在模型中准确包含这些成本是一项艰巨的任务。即使做出合理的估计也可能并非易事。\n\
  \n其次，为了估算中间连接输出，我们需要维护全面的摘要统计信息。在 Hadoop 的 MapReduce 作业中，一个变量上的所有连接会被合并在一起执行。例如，在重写后的\
  \ LUBM Query 9（清单 2）中，变量 `X` 上有三个连接。当运行作业对 `X` 进行连接时，三元组模式 1、2 和 4 之间关于 `X` 的所有连接都会完成。即使\
  \ `X` 上有超过三个连接，所有连接仍将在一个作业中处理。这表明，为收集摘要统计信息以估算连接选择率，我们面临着指数级的连接情况。例如，在具有 `p`[1]、`p`[2]\
  \ 和 `p`[3] 的三元组模式之间，可能存在多种类型的连接，因为在每个三元组模式中，变量可以作为主语或宾语出现。在重写后的 Query 9 情况下，它是 1、2\
  \ 和 4 之间的主语-主语-主语连接。这三者之间可以有更多类型的连接，例如主语-宾语-主语和宾语-主语-宾语。这意味着，在 `P` 个谓词之间，单个变量上可能存在\
  \ 2^(`P`) 种连接类型（忽略变量在同一三元组模式中同时作为主语和宾语出现的可能性）。如果数据集中有 `P` 个谓词，我们需要收集摘要统计信息的总情况数可以通过以下公式计算：\n\
  \n2² × `C`[2]^(`P`) + 2³ × `C`[3]^(`P`) + … + 2^(`P`) × `C`[`P`]^(`P`)\n\n在 LUBM\
  \ 数据集中，有 17 个谓词。因此，总共有 129,140,128 种情况，这是一个巨大的数字。为如此大量的情况收集摘要统计信息将极其耗时且消耗空间。因此，我们采用了一种替代方法。\n\
  \n我们观察到在 Hadoop 中运行作业存在显著的开销。因此，如果我们将回答查询所需的作业数量最小化，就能获得最快的计划。该开销由若干磁盘 I/O 和网络传输引起，它们是任何\
  \ Hadoop 作业不可或缺的组成部分。当作业提交到 Hadoop 集群时，至少会发生以下动作：\n\n1.  可执行文件从客户端传输到 Hadoop JobTracker\
  \ [WIKIa]。\n2.  JobTracker 决定哪些 TaskTrackers [WIKIb] 将执行该作业。\n3.  可执行文件通过网络分发到 TaskTrackers。\n\
  4.  Map 进程通过从 HDFS 读取数据启动。\n5.  Map 输出写入磁盘。\n6.  Map 输出从磁盘读取，打乱（通过网络传输到将运行 Reduce\
  \ 进程的 TaskTrackers），排序并写入磁盘。\n7.  Reduce 进程通过从磁盘读取输入启动。\n8.  Reduce 输出写入磁盘。\n\n\
  即使对于少量数据，这些磁盘操作和网络传输也是昂贵的操作。例如，在我们的实验中，我们观察到一个作业产生的开销几乎相当于读取十亿个三元组。原因在于在每个作业中，Map\
  \ 进程的输出在馈送给 Reduce 进程之前总是会被排序。即使用户不需要，这种排序也是不可避免的。因此，在 `n` 个作业中处理多几亿个三元组，比在 `n`\
  \ + 1 个作业中处理少几亿个三元组的成本更低。\n\n为了进一步研究，我们进行了一个实验，使用了清单 4 中所示的查询。在这里，TP 2 和 TP 3 在\
  \ `?Z` 上的连接选择率最高。因此，使用选择率因子选择连接的查询计划生成算法会选择此连接作为第一个作业。由于其他 TP 1 和 TP 4 分别与 TP 2\
  \ 或 TP 3 共享变量，它们无法参与任何其他连接，而且它们彼此不共享任何变量，因此该作业中唯一可能执行的连接是 TP 2 和 TP 3 在 `?X` 上的连接。完成此连接后，剩下的两个连接分别是\
  \ TP 1 与第一个作业的连接输出在变量 `?X` 上的连接，以及 TP 4 与第一个作业的连接输出在变量 `?Y` 上的连接。我们发现第一个连接的选择率大于后者。因此，第二个作业将执行此连接，TP\
  \ 4 又将不参与。在第三个也是最后一个作业中，第二个作业的连接输出将与 TP 4 在 `?Y` 上连接。这是使用连接选择率估算生成的计划。但最小作业计划是一个两作业计划：第一个作业连接\
  \ TP 1 和 TP 2 在 `?X` 上，以及 TP 3 和 TP 4 在 `?Y` 上。第二个也是最后一个作业将第一个作业的两个连接输出在 `?Z` 上连接。我们发现的查询运行时间见\
  \ [HUSA2011a]。\n\n**清单 4：实验查询**\n\n```\n?S1 ub:advisor ?X .\n?X ub:headOf ?Z .\n\
  ?Z ub:subOrganizationOf ?Y .\n?S2 ub:mastersDegreeFrom ?Y\n```\n\n对于每个数据集，我们发现两作业计划比三作业计划更快，尽管三作业计划因连接选择率顺序产生了较少的中间数据。我们可以通过在另一个小实验中做出的观察来解释这一点。我们生成了包含随机整数的\
  \ 5 MB 和 10 MB 文件。我们将文件放入 HDFS。对于每个文件，我们首先通过程序读取文件并记录所需时间。读取时，我们的程序从文件的三个可用副本中的一个读取。然后，我们运行一个\
  \ MapReduce 作业，将文件重写为排序后的数字。我们利用 MapReduce 排序来获得排序后的输出。请注意，当它写入文件时，会写入三个副本。我们发现，对于\
  \ 5 MB，执行读取、排序和写入的 MapReduce 作业比简单读取耗时 24.47 倍。对于 10 MB，则是 42.79 倍。这清楚地表明，MapReduce\
  \ 作业的写入和数据传输操作比仅从一个副本读取要昂贵得多。由于作业数量的原因，三作业计划执行了更多的磁盘读写操作以及网络数据传输，因此即使读取的输入数据较少，它也比两作业计划慢。\n\
  \n由于这些原因，我们不再追求理想模型。我们遵循实用模型，即生成一个具有最少可能作业数的查询计划。然而，在生成最小作业计划时，每当我们需要在一个作业中从多个连接中选择一个考虑时，我们不随机选择，而是使用摘要连接统计信息。这在\
  \ 15.5.6 节 中描述。更多带有图表的实验结果细节见 [HUSA2011a]。\n\n### 15.5.4 查询计划生成\n\n在本节中，首先我们定义查询计划生成问题，并证明为理想模型和实用模型生成最佳（即成本最低）查询计划在计算上都是昂贵的。然后，我们将提出一种启发式方法和一种贪婪方法，以生成生成最佳计划的近似解。\n\
  \n**运行示例。** 我们将在本节中使用以下查询作为运行示例：\n\n**清单 5：运行示例**\n\n```\nSELECT ?V, ?X, ?Y, ?Z\
  \ WHERE {\n  ?X rdf:type ub:GraduateStudent .\n  ?Y rdf:type ub:University .\n \
  \ ?Z ?V ub:Department .\n  ?X ub:memberOf ?Z .\n  ?X ub:undergraduateDegreeFrom\
  \ ?Y .\n}\n```\n\n为简化符号，我们将仅通过该模式中的变量来引用 TP。例如，第一个 TP (`?X rdf:type ub:GraduateStudent`)\
  \ 将简单地表示为 `X`。此外，在简化版本中，整个查询将表示为：{`X`、`Y`、`Z`、`XZ`、`XY`}。\n\n\n\n#### 15.5.4.1 Bestplan\
  \ 的计算复杂度\n\n可以证明，生成最小代价查询计划在计算上是昂贵的，因为搜索空间呈指数级增长。首先，我们对问题进行建模，然后展示其复杂性。\n\n####\
  \ 15.5.4.2 问题建模\n\n我们将 Bestplan 建模为一个搜索问题。设 `G = (V, E)` 为一个加权有向图，其中每个顶点 `v[i] ∈\
  \ V` 表示三元组模式的一种状态，每条边 `e[i] ∈ (v[i[1]], v[i[2]]) ∈ E` 表示一个从状态 `v[i[1]]` 转移到状态 `v[i[2]]`\
  \ 的作业。`v[0]` 是初始状态，此时尚未执行任何连接，即给定的查询。此外，`v[goal]` 是目标状态，表示所有连接均已执行完毕的三元组模式状态。该问题在于寻找从\
  \ `v[0]` 到 `v[goal]` 的最短加权路径。\n\n例如，在我们的运行示例查询中，初始状态 `v[0] = {X, Y, Z, XY, XZ}`，目标状态\
  \ `v[goal] = ∅`，即不再有剩余的三元组模式。假设第一个作业执行 `join(X, XY, XZ)`。那么，生成的三元组模式（新状态）将为 `v[1]\
  \ = {Y, Z, YZ}`，作业 1 将由边 `(v[0], v[1])` 表示。边 `(v[0], v[1])` 的权重即为 `job[1]` 的代价 `=\
  \ cost(job[1])`，其中 cost 为给定的代价函数。图 15.4 展示了示例查询的部分图。\n\n#### 15.5.4.3 搜索空间大小\n\n\
  给定图 `G = (V, E)`，Dijkstra 最短路径算法可在 `O(|V| log |V| + |E|)` 时间内找到从源点到所有其他节点的最短路径。然而，对于\
  \ Bestplan，可以证明在最坏情况下，`|V| ≥ 2^K`，其中 `K` 为给定查询中连接变量的总数。因此，图中的顶点数量呈指数级增长，导致这是一个指数级搜索问题。在\
  \ [HUSA11a] 中，我们已证明 Bestplan 问题的最坏情况复杂度在给定查询的连接变量数 `K` 上呈指数级。\n\n#### 15.5.4.4 松弛\
  \ Bestplan 问题与近似解\n\n在松弛 Bestplan 问题中，我们假设所有作业的代价均匀。尽管这种松弛并未减小搜索空间，但问题简化为寻找具有最少作业数量的作业计划。请注意，这是该模型实用版本所面临的问题。\n\
  \n**定义 15.12：松弛 Bestplan 问题**：松弛 Bestplan 问题旨在寻找具有最少作业数量的作业计划。\n\n接下来，我们将证明：如果合理选择连接，且在一个作业中不留下任何符合条件的连接操作未执行，则可为任意给定查询所需的最大作业数设定一个上界。然而，生成所有可能的作业计划在计算上仍然昂贵。因此，我们采用了一种贪心算法（算法\
  \ 15.1），它能求得松弛 Bestplan 问题的近似解，但保证能在上界内找到一个作业计划。\n\n**定义 15.13：早期消除启发式**：早期消除启发式旨在每个作业中尽可能多地进行完全消除。\n\
  \n该启发式使得留给下一个作业进行连接的变量数量最少。为应用该启发式，我们必须首先在每个作业中选择 E-count 最小的变量。该启发式应用于算法 15.1 中。\n\
  \n##### 算法 15.1 说明\n\n算法首先从查询 `Q` 中移除所有非连接变量。在我们的运行示例中，`Q = {X, Y, VZ, XY, XZ}`，移除非连接变量\
  \ `V` 后得到 `Q = {X, Y, Z, XY, XZ}`。在 while 循环中，从 `Job[1]` 开始生成作业计划。第 4 行，我们根据变量的\
  \ E-count 对其进行排序。排序后的变量为：`U = {Y, Z, X}`，因为 `Y` 和 `Z` 的 E-count = 1，而 `X` 的 E-count\
  \ = 2。对于每个作业，要执行的连接操作列表存储在变量 `Job[J]` 中，其中 `J` 为当前作业的 ID。此外，临时变量 `tmp` 用于存储当前作业中将要执行的连接所产生的结果三元组（第\
  \ 6 行）。在 for 循环中，检查每个变量以判断其是否可以被完全或部分消除（第 8 行）。若可以，则将连接结果存入临时变量（第 9 行），更新 `Q`（第\
  \ 10 行），并将该连接加入当前作业（第 11 行）。在我们的运行示例中，这将导致以下操作：\n\nfor 循环第 1 次迭代：`u[1] = (Y)` 可被完全消除。此处，`TP(Q,\
  \ Y)` 为包含\n\nfor 循环第 3 次迭代：`u[3] = (X)` 无法被完全或部分消除，因为没有其他 `TP` 剩余可与其连接。因此，当 for\
  \ 循环结束时，我们得到 `job[1] = {join(Y, XY), join(Z, XZ)}`，且 `Q = {X, X, X}`。在 while 循环的第\
  \ 2 次迭代中，我们将得到 `{job[2] = {X, X, X}}`。由于执行此连接后 `Q` 变为空，while 循环退出。最终，算法返回 `{job[1],\
  \ job[2]}`。\n\n在 [HUSA2011a] 中，我们已证明：对于包含 `K` 个连接变量和 `N` 个三元组模式的任意给定查询 `Q`，算法松弛\
  \ Bestplan (`Q`) 生成的作业计划最多包含 `J` 个作业，其中\n\n```\nJ = { 0                    若 N =\
  \ 0\n    { 1                    若 N = 1 或 K = 1\n    { min(ceil(1.71 log₂ N), K)\
  \  若 N, K > 1\n```\n\n### 15.5.5 利用摘要统计信息打破平局\n\n\n\n### 15.5.6 MapReduce Join 执行\n\
  \n在本节中，我们将讨论如何利用 Hadoop 的 MapReduce 框架实现回答 SPARQL 查询所需的连接操作。`算法 15.1` 确定了回答一个查询所需的作业数量。它返回一个有序的作业集合。每个作业都有关联的输入信息。我们\
  \ MapReduce 框架的作业处理组件按有序集合中出现的顺序运行这些作业。一个作业的输出文件是下一个作业的输入文件。最后一个作业的输出文件包含查询的答案。\n\
  \n#### 列表 7：LUBM 查询 2\n\n```\nSELECT ?X, ?Y, ?Z WHERE {\n?X rdf:type ub:GraduateStudent.\n\
  ?Y rdf:type ub:University.\n?Z rdf:type ub:Department.\n?X ub:memberOf ?Z.\n?Z ub:subOrganizationOf\
  \ ?Y.\n?X ub:undergraduateDegreeFrom ?Y }\n```\n\n`列表 7` 展示了 LUBM 查询 2，我们将用它来说明我们如何使用\
  \ map 和 reduce 方法进行连接。该查询有六个三元组模式，并在变量 `X`、`Y` 和 `Z` 上存在九个连接。\n\n我们的输入选择算法选择文件 `type_GraduateStudent`、`type_University`、`type_Department`、所有具有前缀\
  \ `memberOf` 的文件、所有具有前缀 `subOrganizationOf` 的文件，以及所有具有前缀 `underGraduateDegreeFrom`\
  \ 的文件，作为回答查询所需作业的输入。\n\n查询计划包含两个作业。在作业 1 中，第 2、5、7 行的三元组模式在 `X` 上连接，第 3、6 行的三元组模式在\
  \ `Y` 上连接。在作业 2 中，第 4 行的三元组模式与前两个连接的输出在 `Z` 上连接，同时作业 1 的连接输出在 `Y` 上连接。\n\n作业 1 的输入文件包括\
  \ `type_GraduateStudent`、`type_University`、所有具有前缀 `memberOf` 的文件、所有具有前缀 `subOrganizationOf`\
  \ 的文件，以及所有具有前缀 `underGraduateDegreeFrom` 的文件。在 map 阶段，我们首先对输入值（实际上是输入文件的一行）进行分词。然后，我们检查输入文件名，如果输入来自\
  \ `type_GraduateStudent`，我们输出一个键值对，其键为带有前缀 `X#` 的主语 URI，值为标志字符串 `GS#`。该值作为标志，指示该键的类型为\
  \ GraduateStudent。主语 URI 是分词器返回的第一个标记。同样，对于来自文件 `type_University` 的输入，输出一个键值对，其键为带有前缀\
  \ `Y#` 的主语 URI，值为标志字符串 `U#`。如果输入来自任何具有前缀 `memberOf` 的文件，我们通过分词器从输入行中检索主语和宾语，并输出一个键值对，其键为带有前缀\
  \ `X#` 的主语 URI，值为带有前缀 `MO#` 的宾语值。对于来自具有前缀 `subOrganizationOf` 的文件的输入，我们输出键值对，将带有前缀\
  \ `Y#` 的宾语作为键，带有前缀 `SO#` 的主语作为值。对于来自具有前缀 `underGraduateDegreeFrom` 的文件的输入，我们输出键值对，将带有前缀\
  \ `X#` 的主语 URI 作为键，带有前缀 `UDF#` 的宾语值作为值。因此，我们根据连接的变量将主语或宾语作为 map 输出键。这就是为什么对于具有前缀\
  \ `subOrganizationOf` 的文件中的三元组，将宾语作为键的原因，因为连接变量 `Y` 在第 6 行的三元组模式中是宾语。对于所有其他输入，主语被作为键，因为连接变量\
  \ `X` 和 `Y` 在第 2、3、5 和 7 行的三元组模式中是主语。\n\n在 reduce 阶段，Hadoop 将单个键的所有值分组，并为每个键提供该键和一个值集合的迭代器。通过查看前缀，我们可以立即判断它是\
  \ `X` 的值还是 `Y` 的值，这归功于我们使用的前缀。无论哪种情况，我们都使用相同的键输出一个键值对，并将所有值连接起来形成一个字符串值。因此，在此 reduce\
  \ 阶段之后，`X` 上的连接已完成，`Y` 上的连接部分完成。\n\n作业 2 的输入文件是 `type_Department` 文件和作业 1 的输出文件\
  \ `job1.out`。与作业 1 的 map 阶段类似，在作业 2 的 map 阶段，我们也对输入值（实际上是输入文件的一行）进行分词。然后，我们检查输入文件名，如果输入来自\
  \ `type_Department`，我们输出一个键值对，其键为带有前缀 `Z#` 的主语 URI，值为标志字符串 `D#`。如果输入来自 `job1.out`，我们查找带有前缀\
  \ `Z#` 的值。我们将该值作为输出键，并将其余值连接成一个字符串作为输出值。基本上，我们将 `Z#` 值作为键以便在 `Z` 上进行连接。\n\n在 reduce\
  \ 阶段，我们知道键是 `Z` 的值。值集合包含两类字符串。一类包含 `X` 值（即研究生的 URI）以及他们获得本科学位的 `Y` 值。`Z` 值（即键）可能是也可能不是\
  \ `Y` 值的 `subOrganizationOf`。另一类字符串仅包含 `Y` 值（即大学），`Z` 值是这些大学的子组织。我们遍历值集合，然后根据 `Y`\
  \ 值连接这两类元组。从连接输出中，我们找到包含 `X`、`Y` 和 `Z` 值的结果元组。\n\n## 15.6 结果\n\n### 15.6.1 实验设置\n\
  \n在本节中，我们首先展示我们实验所用的基准数据集。接下来，我们展示用于比较的替代存储库。然后，我们详述我们的实验设置。最后，我们展示评估结果。\n\n####\
  \ 15.6.1.1 数据集\n\n在我们的 SPARQL 查询处理实验中，我们使用了两个合成数据集：LUBM `[GUO2005]` 和 SP2B `[SCHM2009]`。LUBM\
  \ 数据集通过使用本体 `[LEHI]` 生成关于大学的数据。它有 14 个标准查询。其中一些查询需要推理才能回答。LUBM 数据集非常适合推理和可扩展性测试。对于所有\
  \ LUBM 数据集，我们使用了默认种子。SP2B 数据集适合具有复杂查询和数据访问模式的可扩展性测试。它有 16 个查询，其中大多数具有复杂的结构。\n\n\
  #### 15.6.1.2 基准框架\n\n\n\n\n#### 15.6.1.3 硬件\n\n我们拥有一个 10 节点的 Hadoop 集群，用于我们的框架。每个节点的配置如下：奔腾\
  \ IV 2.80 GHz 处理器、4 GB 内存和 640 GB 磁盘空间。我们在一台配置强劲的单机上运行 Jena、RDF-3X 和 BigOWLIM 框架，该机器配备\
  \ 2.80 GHz 四核处理器、8 GB 内存和 1 TB 磁盘空间。\n\n#### 15.6.1.4 软件\n\n我们为框架使用了 `Hadoop-0.20.1`。我们将框架与\
  \ `Jena-2.5.7` 进行了比较，后者使用 `MySQL 15.12` 作为其 SDB 模型。我们使用了 `BigOWLIM` 版本 `3.2.6`。对于\
  \ `RDF-3X`，我们使用了源代码版本 `0.3.5`。\n\n### 15.6.2 评估\n\n我们展示了我们的框架、`RDF-3X`、`Jena` 内存模型和\
  \ SDB 模型以及 `BigOWLIM` 之间的性能比较。更多细节请参见 `[HUSA2011a]`。我们使用了三个 LUBM 数据集：10,000、20,000\
  \ 和 30,000，它们分别包含超过 11 亿、22 亿和 33 亿个三元组。`RDF-3X` 的初始加载时间分别为 655、1,756 和 3,353 分钟。这表明\
  \ `RDF-3X` 的加载时间呈指数级增长。LUBM (30,000) 的三元组数量是 LUBM (10,000) 的三倍，但其加载时间却是后者的五倍多。\n\
  \n出于评估目的，我们选择了 LUBM 查询 1、2、4、9、12 和 13 在本文中报告。这些查询提供了良好的组合，包含简单和复杂的结构、推理以及多种类型的连接。它们代表了基准测试中的其他查询，因此仅报告这些查询即涵盖了我们省略的查询中发现的所有变化类型，同时也节省了篇幅。\n\
  \n查询 1 是一个简单的选择性查询。对于此查询，`RDF-3X` 比 `HadoopRDF` 快得多。`RDF-3X` 利用了六个索引 `[NEUM2008]`，这六个索引实际上构成了数据集。这些索引为\
  \ `RDF-3X` 提供了一种非常快速的三元组查找方式，类似于哈希表。因此，高选择性查询可由 `RDF-3X` 高效回答。\n\n查询 2 是一个具有复杂结构、低选择性且无绑定对象的查询。结果集相当大。对于此查询，`HadoopRDF`\
  \ 在所有三种数据集规模下均优于 `RDF-3X`。当数据集规模达到 33 亿三元组时，`RDF-3X` 完全无法回答该查询。`RDF-3X` 返回内存段错误消息，且未产生任何查询结果。\n\
  \n查询 4 也是一个高选择性查询，即由于第二个三元组模式中有绑定对象，结果集较小，但需要推理来回答。第一个三元组模式使用了类 `Person`，它是许多类的超类。LUBM\
  \ 数据集中没有类型为 `Person` 的资源，而是有许多其子类型的资源。`RDF-3X` 不支持推理，因此我们必须将查询转换为包含一些并集操作的等价查询。对于此查询，`RDF-3X`\
  \ 优于 `HadoopRDF`。\n\n查询 9 在结构上类似于查询 2，但需要大量推理。该查询的前三个三元组模式使用的类在数据集中未显式实例化。然而，数据集包含许多对应子类的实例。这也是我们评估的查询中需要最大数据集连接并返回最大结果集的查询。对于\
  \ 11 亿三元组的数据集，`RDF-3X` 比 `HadoopRDF` 快；但对于另外两个数据集，它完全无法回答该查询。\n\n查询 12 类似于查询 4，因为它既具有选择性，又在一个三元组模式中包含推理。对于此查询，`RDF-3X`\
  \ 优于 `HadoopRDF`。\n\n查询 13 只有两个三元组模式。两者都涉及推理。第二个三元组模式中有绑定主语。它返回第二大的结果集。对于所有数据集，`HadoopRDF`\
  \ 在此查询上均优于 `RDF-3X`。`RDF-3X` 性能较慢，因为第一个三元组模式选择性极低，且需要通过反向链接进行低选择性连接以执行推理。\n\n这些结果引出了一些简单的结论。`RDF-3X`\
  \ 在高选择性和有绑定对象的查询上实现了最佳性能。然而，`HadoopRDF` 在无绑定对象、低选择性或大数据集连接的查询上优于 `RDF-3X`。`RDF-3X`\
  \ 无法针对 33 亿三元组的数据集执行两个无绑定对象的查询（查询 2 和 9）。这表明 `HadoopRDF` 具有更好的可扩展性，并能比 `RDF-3X`\
  \ 更高效地处理低选择性查询。\n\n我们还将我们的实现与 `Jena` 内存模型、SDB 模型和 `BigOWLIM` 模型进行了比较。由于空间和时间限制，我们仅针对\
  \ LUBM 数据集的 LUBM 查询 2 和 9 执行了这些测试。我们选择这些查询是因为它们具有复杂结构并需要推理。值得注意的是，`BigOWLIM` 需要\
  \ 7 GB 的 Java 堆空间才能成功加载十亿三元组数据集。我们仅针对最大的三个数据集运行了 `BigOWLIM`，因为我们关注其在大数据集上的性能。对于每个数据集，我们分别获得了\
  \ `Jena` 内存模型、`Jena` SDB 模型、我们的 `Hadoop` 实现和 `BigOWLIM` 的结果。有时查询无法完成或内存耗尽。在大多数情况下，我们的方法最快。\n\
  \n对于查询 2，`Jena` 内存模型和 `Jena` SDB 模型比我们的方法更快，分别在 3.9 秒和 0.4 秒内给出结果。然而，随着数据集规模增长，`Jena`\
  \ 内存模型内存耗尽。对于大数据集，我们的实现比 `Jena` SDB 模型快得多。例如，对于 1.1 亿三元组，我们的方法耗时 143.5 秒，而 `Jena`\
  \ SDB 模型约需 5,000 秒。我们发现 `Jena` SDB 模型无法完成查询 9 的回答。`Jena` 内存模型在小数据集上表现良好，但随着数据集规模增长变得比我们的实现慢，最终内存耗尽。\n\
  \n对于查询 2，在 1.1 亿和 5.5 亿数据集上，`BigOWLIM` 比我们的方法慢。对于 5.5 亿数据集，它耗时 22,693.4 秒，与其其他计时相比突然升高。对于十亿三元组数据集，`BigOWLIM`\
  \ 更快。应注意到，我们的框架没有任何索引或三元组缓存，而 `BigOWLIM` 利用索引，并在启动时将其加载到主内存中。它也可能将三元组预取到主内存中。\n\n\
  对于查询 9，我们的实现在所有实验中均快于 `BigOWLIM`。\n\n还应注意，我们的 `RDF-3X` 和 `HadoopRDF` 查询均使用冷运行进行测试。这意味着执行前清除了主内存和文件系统缓存。然而，对于\
  \ `BigOWLIM`，我们被迫执行热运行。这是因为将数据库加载到 `BigOWLIM` 需要大量时间。因此，在冷运行下我们将轻松胜过 `BigOWLIM`。所以，我们实际上是将\
  \ `BigOWLIM` 的热运行与 `HadoopRDF` 的冷运行进行对比。这给 `BigOWLIM` 带来了巨大优势，但在大数据集上，`HadoopRDF`\
  \ 仍产生了好得多的结果。这表明 `HadoopRDF` 比 `BigOWLIM` 具有更好的可扩展性，并为大数据集提供更高效的查询。\n\n\n\n\n我们执行的最后测试是深度可扩展性测试。为此，我们针对八种不同的数据集大小重复执行了相同的查询，最大规模达到\
  \ 66 亿。\n\n在实验中我们发现，`Query 1` 很简单，仅需一次连接，因此在所有查询中它的耗时最少。`Query 2` 是三元组模式数量最多的两个查询之一。尽管它的三元组模式数量是\
  \ `Query 1` 的三倍，但由于我们的存储模式，其响应时间并非 `Query 1` 的三倍。`Query 4` 比 `Query 2` 少一个三元组模式，但它需要推理。因为我们即时确定推理关系，所以在我们的框架中，需要推理的查询耗时更长。`Queries\
  \ 9 and 12` 也需要推理。详情见 [HUSA2011a]。\n\n随着数据集规模的增长，回答查询的时间增长并不成比例。时间增量始终小于数据量增量。例如，10,000\
  \ 所大学的数据集比 1,000 所大学的数据集多 10 倍三元组，但对于 `Query 1`，时间仅增加 3.76 倍，对于 `query 9` 增加 7.49\
  \ 倍。后者是时间增幅最高的，但仍小于数据集规模的增幅。由于篇幅限制，我们此处不报告 `PS schema` 的查询运行时间。我们发现 `PS schema`\
  \ 比 `POS schema` 慢得多。\n\n## 15.7 安全扩展\n\n我们实现了基于以下两种模型的安全机制：（i）构建在 `JENA` 框架之上的基于令牌的访问控制模型，以及（ii）构建在\
  \ `SPARQL Query Optimizer` 之上的基于 XACML 的安全模型。本节描述我们的安全模型。更多系统细节可参见 [KHAL2010]。值得注意的是，我们还设计并开发了第三种安全查询处理系统，该系统对关系数据使用\
  \ XACML 访问控制。该系统使用 `HIVE` 关系数据库系统，同样运行在云端。`HIVE` 基础系统的设计与实现详见 [THUR2010] 以及 第 16\
  \ 章。\n\n### 15.7.1 基于令牌的访问控制模型\n\n**定义 15.15：** **访问令牌 (AT)** 允许访问安全相关数据。持有 `AT`\
  \ 的代理可查看该 `AT` 许可的数据。我们用正整数表示 `AT`。\n\n**定义 15.15：** **访问令牌元组 (ATT)** 形式为 ⟨`AccessToken`、`Element`、`ElementType`、`ElementName`⟩，其中\
  \ `Element` 可以是 `Subject`、`Object` 或 `Predicate`，`ElementType` 可描述为 `URI`、`DataType`、`Literal`、`Model`\
  \ 或 `BlankNode`。`Model` 用于访问主体模型，将在本节后面解释。\n\n例如，在 图 15.5 的本体/知识库中，`David` 是一个主体，⟨1、`Subject`、`URI`、`David`⟩\
  \ 是一个 `ATT`。持有 `AT` 1 的任何代理均可检索 `David` 的所有文件信息（受限于管辖 `David` 相关联的 `URI`、字面量等对象访问的任何其他安全限制）。在描述\
  \ `ATT` 时，我们将 `ElementName` 留空 (\\_)。\n\n![Figure 15.5 Knowledge base.](img/fig15_5.jpg)\n\
  \n图 15.5 知识库.\n\n基于记录组织，我们支持六个访问级别及稍后描述的几个子类型。代理可被分配一个或多个以下访问级别。具有相同 `AT` 的访问级别按合取方式组合，而具有不同\
  \ `AT` 的访问级别按析取方式组合。\n\n1.  **谓词数据访问**：如果某访问级别中为特定谓词定义了对象类型，则持有该访问级别的代理可读取整个谓词文件（受限于任何其他策略限制）。例如，⟨1、`Predicate`、`isPaid`、`_`⟩\
  \ 是一个 `ATT`，允许其持有者读取整个谓词文件 `isPaid`。\n\n2.  **谓词和主体数据访问**：持有主体 `ATT` 的代理可访问与特定主体关联的数据，主体可以是\
  \ `URI` 或 `DataType`。将这些主体 `ATT` 之一与具有相同 `AT` 的谓词数据访问 `ATT` 结合，授予代理访问特定谓词的特定主体的权限。例如：\n\
  \n    1.  **谓词和主体均为 URI**：结合 `ATT` ⟨1、`Predicate`、`isPaid`⟩ 和 ⟨1、`Subject`、`URI`、`MichaelScott`⟩（源自图\
  \ 15.5 的本体），允许持有 `AT` 1 的代理访问谓词 `isPaid` 下 `URI` 为 `MichaelScott` 的主体。\n\n    2.\
  \  **谓词和主体为数据类型**：类似地，`Predicate` 和 `DataType` `ATT` 可结合，以允许访问特定谓词文件下特定数据类型的主体。\n\
  \n        为简洁起见，我们省略了其余各访问级别不同主体和对象变体的描述。\n\n3.  **谓词和对象**：此访问级别允许主体提取满足特定谓词和对象的主体名称。例如，通过\
  \ `ATT` ⟨1、`Predicate`、`hasVitamins`、`_`⟩ 和 ⟨1、`Object`、`URI`、`E`⟩，持有 `AT` 1 的代理可查看拥有维生素\
  \ `E` 的主体名称（如食物）。更一般地，若 `X[1]` 和 `X[2]` 分别是描述某 `AT` 的 `Predicate` 和 `Object` 三元组生成的三元组集合，则持有该\
  \ `AT` 的代理可查看三元组集合 `X1 ∩ X2`。此例的图示见 图 15.6。\n\n4.  **主体访问**：凭此访问级别，代理可跨所有文件读取主体信息。这是限制较少的访问级别之一。主体可以是\
  \ `DataType` 或 `BlankNode`。\n\n5.  **对象访问**：凭此访问级别，代理可跨所有文件读取对象的主体。与前一级别一样，这是限制较少的访问级别之一。对象可以是\
  \ `URI`、`DataType`、`Literal` 或 `BlankNode`。\n\n6.  **主体模型级访问**：模型级访问允许代理读取获取给定主体所有对象所需的所有谓词文件。在这些对象中，属于\
  \ `URI` 的将被视为主体，进而提取其各自的谓词和对象。此过程迭代进行，直到所有对象最终变为字面量或空白节点。通过这种方式，持有模型级访问权限的代理可针对给定主体生成模型。\n\
  \n![Figure 15.6 Conjunctive combination of ATT's with a common AT.](img/fig15_6.jpg)\n\
  \n图 15.6 具有共同 AT 的 ATT 的合取组合.\n\n以下源自图 15.5 的示例说明 `David` 居住在 `LongIsland`。`LongIsland`\
  \ 是一个主体，拥有 `Avg_Summer_Temp` 谓词，其对象为 75°F。持有 `David` 模型级访问权限的代理可读取 的平均夏季温度。\n\n\
  ### 15.7.2 访问令牌分配\n\n**定义 15.16：** **访问令牌列表 (AT-list)** 是授予特定代理的一个或多个 `AT` 组成的数组，附带时间戳标识各\
  \ `AT` 的授予时间。系统为每个代理维护单独的 `AT` 列表。\n\n当系统管理员决定向代理的 `AT` 列表添加 `AT` 时，`AT` 和时间戳首先存入临时变量。在提交变更前，系统必须首先检测新\
  \ `AT` 列表中潜在的冲突。\n\n#### 15.7.2.1 代理 AT 的最终输出\n\n\n\n\n每个 AT 允许访问一组三元组。我们将此集合称为\
  \ AT 的 `result set`（结果集）。代理可访问的三元组集合是该代理 AT 列表中所有 AT 的结果集的并集。形式上，如果 `Y[1], Y[2],\
  \ …, Y[n]` 分别是代理 AT 列表中 `AT[1], AT[2], …, AT[n]` 的结果集，则该代理可访问集合 `Y[1] ∪ Y[2] ∪ …\
  \ ∪ Y[n]` 中的三元组。\n\n#### 15.7.2.2 安全级别默认值\n\n通过为系统中的数据保守地选择默认安全级别，可以大大简化管理员的 AT\
  \ 分配负担。在我们的实现中，数据存储中的所有项目都具有默认安全级别。个人的个人信息默认通过拒绝访问任何数据类型为 `Person` 的 URI 来保持私密。这防止了代理对其未被授予显式权限的任何个人进行推断。然而，如果代理被授予对特定类型或属性的显式访问权限，则该代理也将被授予该类型或属性的子类型或子属性的默认访问权限。\n\
  \n举个例子，考虑一个列出个人喜好元素的谓词文件 `Likes`。进一步假设 `Jim` 是一个喜欢 `Flying`、`SemanticWeb` 和 `Jenny`\
  \ 的人，它们分别是类型为 `Hobby`、`ResearchInterest` 和 `Person` 的 URI，而 1 是一个具有 ATTs `⟨1, Subject,\
  \ URI, Jim⟩` 和 `⟨1, Likes, Predicate, _⟩` 的 AT。默认情况下，仅拥有 AT 1 的代理 `Ben` 无法得知 `Jenny`\
  \ 在 `Jim` 的 `Likes` 列表中，因为 `Jenny` 的数据类型是 `Person`。然而，如果 `Ben` 还拥有由 ATT `⟨2, Object,\
  \ URI, Jenny⟩` 描述的 AT 2，那么 `Ben` 将能够看到 `Jim` 的 `Likes` 列表中的 `Jenny`。\n\n### 15.7.3\
  \ 冲突\n\n当满足以下三个条件时会产生冲突：(1) 代理拥有两个 AT 1 和 2，(2) AT 2 的结果集是 AT 1 的真子集，(3) AT 1 的时间戳早于\
  \ AT 2 的时间戳。在这种情况下，后者（更具体的 AT）取代前者，因此 AT 1 将从 AT 列表中丢弃以解决冲突。此类冲突有两种类型，我们称之为 `subset\
  \ conflicts`（子集冲突）和 `subtype conflicts`（子类型冲突）。\n\n当 AT 2 是细化 AT 1 的 ATTs 的合取时，会发生子集冲突。例如，假设\
  \ AT 1 由 ATT `⟨1, Subject, URI, Sam⟩` 定义，而 AT 2 由 ATTs `⟨2, Subject, URI, Sam⟩`\
  \ 和 `⟨2, Predicate, Has Accounts, _⟩` 定义。在这种情况下，AT 2 的结果集是 AT 1 结果集的子集。因此，如果拥有 AT\
  \ 1 的代理稍后被分配了 AT 2，将会发生冲突。当这种情况发生时，AT 1 将从代理的 AT 列表中丢弃以解决冲突。\n\n当 AT 2 中的 ATTs 涉及的数据类型是\
  \ AT 1 中数据类型的子类型时，会发生子类型冲突。这些数据类型可以是主语、宾语或两者的类型。\n\n冲突解决由算法 15.2 总结。此处，`Subset(AT[1],\
  \ AT[2])` 是一个函数，如果 `AT[1]` 的结果集是 `AT[2]` 结果集的真子集，则返回 true；`SubjectSubType(AT[1],\
  \ AT[2])` 如果 `AT[1]` 的主语是 `AT[2]` 主语的子类型，则返回 true。类似地，`ObjectSubType(AT[1], AT[2])`\
  \ 用于判断宾语而非主语的子类型关系。\n\n### 15.7.4 基于 XACML 的访问控制\n\n基于 XACML 的访问控制基于 ABAC（基于属性的访问控制模型）。XACML\
  \ 由四个主要模块组成：PEP（策略执行点）、PDP（策略决策点）、PIP（策略信息点）和 PAP（策略访问点/策略管理点）。\n\n在 ABAC 模型中，用户提供其凭据并向资源发起请求。XACML\
  \ 的 PEP 接收请求和凭据，并请求 PDP 决定是否应授予用户访问权限。PDP 与 PAP 协作获取策略，与 PIP 协作获取关于资源以及用户凭据的信息。基于策略，用户被授予或拒绝对资源的访问。决策由\
  \ PDP 做出并将结果返回给 PEP。然后 PEP 执行请求或拒绝请求。更多详细信息请参阅 [THUR2013]。\n\n## 15.8 总结与展望\n\n\
  我们提出了一个能够处理海量 RDF 数据的框架，可用于表示社交网络等大数据系统。由于我们的框架基于 Hadoop（一个分布式且高度容错的系统），它自动继承了这两个特性。该框架具有高度可扩展性。要增加系统容量，只需向\
  \ Hadoop 集群添加新节点即可。我们提出了一种存储 RDF 数据的模式、一种确定查询处理计划的算法（其最坏情况有界），用于回答 SPARQL 查询，以及一种供该算法使用的简化成本模型。我们的实验表明，该系统具有高度可扩展性。如果增加数据量，回答查询引入的延迟不会成比例地增加。结果表明，对于非常大的数据集（超过十亿三元组），如果查询包含低选择性连接或大量推理，Hadoop\
  \ RDF 更可取且更高效。如果查询包含产生高选择性的绑定对象，其他解决方案可能更高效。我们还概述了构建在查询处理系统之上的安全模型。\n\n未来，我们希望在多个方向上扩展这项工作。首先，我们将研究更复杂的查询模型。我们将缓存最频繁查询的统计信息，并利用动态规划来挖掘这些统计信息。其次，我们将评估用户可指定的\
  \ Hadoop 作业唯一参数——Reducer 的数量对查询运行时间的影响。第三，我们将研究索引机会和二进制格式的进一步用法。第四，我们将处理更复杂的 SPARQL\
  \ 模式，例如包含 OPTIONAL 块的查询。第五，我们将用现实的大数据应用（如社交网络系统）来演示我们的系统。最后，我们将在系统的所有层面融入安全性。也就是说，安全性不应只是查询处理原型的附加组件，而必须内置于\
  \ SPARQL 查询优化器中。\n\n## 参考文献\n\n*   [ABAD2007] D.J. Abadi, A. Marcus, S. R. Madden,\
