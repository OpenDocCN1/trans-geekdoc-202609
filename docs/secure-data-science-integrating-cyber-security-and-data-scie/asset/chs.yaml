  \ OWL and RuleML. W3C Member Submission, World Wide Web Consortium, May 2004. Available\
  \ at: [`www.w3.org/Submission/SWRL`](http://www.w3.org).\n\n*   `[KRUK2006]` S.R.\
  \ Kruk, S. Grzonkowski, A. Gzella, T. Woroniecki, H. Choi, D-FOAF: Distributed Identity\
  \ Management with Access Rights Delegation, In R. Mizoguchi, Z. Shi, and F. Giunchiglia,\
  \ editors, ASWC, volume 4185 of Lecture Notes in Computer Science, Springer, 2006,\
  \ pp. 140–154.\n\n*   `[MIKA2007]` P. Mika, Social Networks and the Semantic Web,\
  \ Springer, 2007.\n\n*   `[THUR2020]` B. Thuraisingham, Multigenerational Database\
  \ Inference Controllers, *IEEE Big Data Security Conference*, May 2020.\n\n*   `[TONT2003]`\
  \ G. Tonti, J.M. Bradshaw, R. Jeffers, R. Montanari, N. Suri, A. Uszok, Semantic\
