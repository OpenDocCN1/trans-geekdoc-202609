- "# 安全数据科学：网络安全与数据科学的融合\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 献词\n\n我们将此书献给所有在与\
  \ COVID-19 的勇敢抗争中不幸离世的人们，正是他们激励我们在艰难的日子里继续开展数据科学、安全与隐私方面的研究和教育活动。\n\n## 前言\n\n###\
  \ 背景\n\n信息系统技术的最新发展导致各个业务领域的许多应用实现了计算机化。数据已成为许多组织的关键资源，因此，高效访问数据、共享数据、从数据中提取信息并利用这些信息已成为迫切需求。因此，人们不仅致力于整合分散在多个站点的各种数据源，而且从这些数据库中以模式和趋势的形式提取信息并进行数据分析也变得愈发重要。这些数据源可能是由数据库管理系统管理的数据库，也可能是来自多个数据源、存储在数据仓库中的数据。\n\
  \n20 世纪 90 年代中期万维网 (WWW) 的出现，导致对有效管理数据、信息和知识的需求进一步激增。在此期间，服务范式应运而生，现已演变为将计算基础设施、软件、数据库和应用程序作为服务提供。这些能力催生了云计算的概念。过去五年来，云计算的发展呈爆发式增长，如今我们已有多家公司提供基础设施、软件和应用程序计算平台即服务。\n\
  \n随着对数据和信息管理需求的增加，维护数据库、应用程序和信息系统的安全性也变得至关重要。数据、信息、应用程序、Web 和云必须免受未经授权的访问以及恶意破坏。保护此类系统的方法被称为网络安全。\n\
  \n数据管理与分析、Web 服务、云计算和网络安全的重大发展，已演变为一个称为大数据管理与分析 (BDMA) 以及大数据安全与隐私 (BDSP) 的领域。美国劳工统计局\
  \ (BLS) 将*大数据*定义为无法用常规统计方法分析的大型数据集合。这些数据集可以代表数值、文本和多媒体数据。大数据通常用五个 V 来定义：容量、速度、多样性、真实性和价值。BDMA\
  \ 需要处理海量的结构化和非结构化数据，这些数据以高速到达。通过利用大数据，我们可以在网络安全和医疗保健等几个关键领域取得突破，从而提高生产力和盈利能力。不仅大数据系统必须得到保护，大数据分析还必须应用于网络安全应用，例如内部威胁检测。\n\
  \n利用统计推理和机器学习管理和分析海量数据，催生了一个称为*数据科学*的领域。也就是说，数据科学将大数据管理与统计学和机器学习相结合。数据科学技术已应用于医疗保健、金融、市场营销和网络安全等许多领域。另一方面，数据科学技术可能遭到恶意进程的攻击。也就是说，虽然数据科学可用于解决内部威胁检测等网络安全问题，但数据科学技术本身必须是安全的。这催生了一个称为*安全数据科学*的领域。本书将重点关注安全数据科学的各个方面。特别是，本书将讨论安全数据科学的基础技术（如数据科学和网络安全），以及数据科学在网络安全中的应用、数据科学的安全防护，以及安全数据科学中的一些新兴方向（包括数据隐私）。\n\
  \n\n\n## 书籍系列概述\n\n我们为 CRC Press 编写了两套关于数据管理/数据挖掘和数据安全的丛书。第一套丛书包含十本书。\n\n- **Book\
  \ #1** (*Data Management Systems: Evolution and Interoperation*) 侧重于数据管理的通用方面，同时也涉及互操作性和迁移。\n\
  - **Book #2** (*Data Mining: Technologies, Techniques, Tools, and Trends*) 探讨了数据挖掘。它实质上详细阐述了\
  \ Book #1 的 Chapter 9。\n- **Book #3** (*Web Data Management and Electronic Commerce*)\
  \ 探讨了 Web 数据库技术，并将电子商务作为一个应用领域进行了讨论。它实质上详细阐述了 Book #1 的 Chapter 10。\n- **Book #4**\
  \ (*Managing and Mining Multimedia Databases*) 同时涉及多媒体数据库管理和多媒体数据挖掘。它详细阐述了 Book\
  \ #1 的 Chapter 6（多媒体数据库管理）和 Book #2 的 Chapter 11（多媒体数据挖掘）。\n- **Book #5** (XML,\
  \ Databases and the Semantic Web) 描述了与数据管理相关的 XML 技术。它详细阐述了 Book #3 的 Chapter 11。\n\
  - **Book #6** (*Web Data Mining Technologies and Their Applications in Business\
  \ Intelligence and Counter-Terrorism*) 详细阐述了 Book #3 的 Chapter 9。\n- **Book #7**\
  \ (*Database and Applications Security: Integrating Information Security and Data\
  \ Management*) 考察了前几本书中讨论的各项技术的安全性。它侧重于数据库和应用安全领域的技术发展。它实质上是信息安全与数据库技术的融合。\n- **Book\
  \ #8** (*Building Trustworthy Semantic Webs*) 将安全性应用于语义 Web 技术，并详细阐述了 Book #7 的\
  \ Chapter 25。\n- **Book #9** (*Secure Semantic Service-Oriented Systems*) 是 Book\
  \ #8 的 Chapter 16 的详细阐述。\n- **Book #10** (*Building and Securing the Cloud*) 是 Book\
  \ #9 的 Chapters 5 和 25 的详细阐述。\n\n我们的第二套丛书包含六本书。\n\n- **Book #1** 关于 *Design and\
  \ Implementation of Data Mining Tools*。\n- **Book #2** 关于 *Design and Implementation\
  \ of Data Mining Tools for Malware Detection*。\n- **Book #3** 关于 *Secure Data Provenance\
  \ and Inference Control with Semantic Web*。\n- **Book #4** 关于 *Analyzing and Securing\
  \ Social Media*。\n- **Book #5** 关于 *Big Data Analytics with Applications in Insider\
  \ Threat Detection*。\n- **Book #6**（即本书）关于 *Secure Data Science: Integrating Cyber\
  \ Security and Data Science*。\n\n对于这一系列，我们将与学生合作的实践成果转化为书籍。我们文本之间的关系将在本书的 Appendix\
  \ 中进行说明。\n\n## 本书组织结构\n\n本书分为四部分，每部分描述与安全数据科学相关的技术的某个方面。本书的主要重点将放在用于网络安全的数据科学以及数据科学的安全防护上。此外，我们还将讨论我们开发的一些实验系统，并提供所涉及的一些挑战。\n\
  \n本书分为四部分，每部分描述与数据科学和网络安全相关的技术的某个方面。\n\n- **Part I** 由四章组成，将描述安全数据科学的支撑技术，包括数据安全与隐私、用于网络安全的数据挖掘、云计算和语义\
  \ Web 以及大数据安全与隐私。这些支撑技术为安全数据科学提供了背景信息。\n- **Part II** 由四章组成，详细概述了我们为网络安全开发的数据科学技术。特别是，将讨论用于恶意软件分析的可扩展数据科学技术和用于内部威胁检测的流分析。\n\
  - **Part III** 由五章组成，将讨论增强安全性和隐私的数据科学，包括针对数据科学的攻击、对抗性机器学习以及隐私感知的基于策略的数据管理。我们还将讨论我们的工作如何应用于特定应用，即\
  \ COVID-19 大流行。\n- **Part IV** 讨论访问控制与数据科学，由五章组成。它描述了安全云查询处理、基于策略的信息共享、基于语义 Web\
  \ 的社交媒体数据访问控制框架、基于语义 Web 的大数据推理控制器。我们还将讨论我们的一些工作如何应用于诸如智能交通系统之类的应用。\n\n## 数据、信息与知识\n\
  \n一般来说，数据管理包括管理数据库、互操作性、迁移、仓储和挖掘。例如，Web 上的数据必须被管理和挖掘以提取信息、模式和趋势。数据可以存在于文件、关系数据库或其他类型的数据库中，如多媒体数据库。数据可以是结构化的，也可以是非结构化的。我们在本书中反复使用术语\
  \ data、data management、database systems 和 database management systems。我们在本书的 Appendix\
  \ 中详细阐述这些术语。\n\n我们将数据管理系统定义为管理数据、从数据中提取有意义的信息并利用提取的信息的系统。因此，数据管理系统包括数据库系统、数据仓库和数据挖掘系统。数据可以是结构化数据（如关系数据库中的数据），也可以是非结构化数据（如文本、语音、图像和视频）。\n\
  \n过去曾有大量讨论试图区分 data、information 和 knowledge。在我们之前的一些关于数据管理和挖掘的书中，我们并未试图澄清这些术语。我们只是简单地说明\
  \ data 可能只是比特和字节，也可能向用户传达一些有意义的 information。然而，随着 Web 的出现，以及对数据、信息和知识管理作为独立领域的兴趣日益增加，在本书中我们采取了不同的方法，尽可能区分这些术语。\n\
  \n对我们而言：\n\n- **Data** 通常是一些值，如数字、整数和字符串。\n- **Information** 是在 data 关联了某种含义或语义时获得的，例如“John's\
  \ salary is 20K”。\n- **Knowledge** 是通过阅读和学习获得的，结果是理解 data 和 information 并采取行动。也就是说，当某人脑海中关于\
  \ data 和 information 的不确定性被消除时，data 和 information 就转化为了 knowledge。\n\n应注意，很难给出 data、information\
  \ 和 knowledge 的严格定义。有时我们也会交替使用这些术语。本书 Appendix 中讨论的数据管理框架有助于阐明其中一些差异。为了与我们之前书籍中的术语保持一致，我们还将区分\
  \ database systems 和 database management systems。**Database management system**\
  \ 是管理包含持久数据的数据库的组件。**Database system** 由数据库和数据库管理系统两部分组成。\n\n## 结束语\n\n\n\n本书旨在探讨数据科学在网络安全中的应用，以及如何保护数据科学技术本身。我们将讨论安全数据科学的各种概念、技术、问题和挑战。此外，我们还介绍了几个由达拉斯德克萨斯大学设计和开发的安全数据科学实验系统。我们将本书中的部分材料以及各章列出的大量参考文献，用于达拉斯德克萨斯大学研究生课程“大数据分析”以及“大数据安全与隐私”。\n\
  \n值得注意的是，该领域正在迅速扩展，涌现出许多用于管理和分析大数据的开源工具和商业产品。因此，读者有必要跟进各种大数据系统的发展。然而，安全不能是事后诸葛亮。因此，在开发大数据技术的同时，从一开始就纳入安全措施至关重要。\n\
