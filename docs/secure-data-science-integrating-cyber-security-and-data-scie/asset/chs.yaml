  \n### 10.6.3 真实数据集实验\n\n我们还在两个真实数据集上测试了我们的 AD-SVM 模型：来自 UCI 数据仓库 [[UCI2012]](#ch10.xhtml#ref10_24)\
  \ 的 *spam base*（垃圾邮件基础数据集），以及来自 LibSVM 网站 [[LIBS2012]](#ch10.xhtml#ref10_16) 的 *web\
  \ spam*（网页垃圾邮件数据集）。\n\n在 *spam base* 数据集中，垃圾邮件概念包括广告、快速致富骗局、连锁信等。垃圾邮件收集自邮局管理员和已归档垃圾邮件的个人。非垃圾邮件收集自归档的工作和个人邮件\
  \ [UCI2012]。该数据集包含 4,601 个总实例，其中 39.4% 为垃圾邮件。共有 57 个属性和一个类标签。我们将数据集分成相等的两半，一半 *Tr*\
  \ 用于训练，另一半 *Ts* 仅用于测试。学习模型由从 *Tr* 中随机选取的 10% 样本构建。结果取 10 次随机运行的平均值。\n\n我们从 LibSVM\
  \ 网站 [LIBS2012] 获取了第二个数据集。根据该网站介绍，*web spam* 数据是帕斯卡大规模学习挑战赛中使用的子集。所有正样本均保留在数据集中，而负样本则是从知名网站开始随机遍历互联网创建的。他们将连续的\
  \ *n* 字节视为一个词，并使用词频作为特征值，将每个实例归一化为单位长度。我们使用他们的单元数据集，其中特征数量为 254。实例总数为 350,000。我们再次将数据集分成相等的两半用于训练和测试。我们使用训练集中\
  \ 2% 的样本来构建学习模型，并报告 10 次随机运行的平均结果。\n\n\n\n\n\n#### 表 10.5 和 10.6：Spam Base 数据集结果\n\
