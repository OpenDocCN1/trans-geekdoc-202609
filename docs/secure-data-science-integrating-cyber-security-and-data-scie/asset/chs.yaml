  \ 1206–1211.\n\n# 12 隐私保护决策树\n\nDOI: [10.1201/9781003081845-20](https://doi.org/10.1201/9781003081845-20)\n\
  \n## 12.1 简介\n\n虽然第 10 章和第 11 章侧重于安全感知数据科学，但本章我们将讨论隐私感知数据科学。特别是，我们以决策树为例讨论隐私保护数据挖掘。数据挖掘技术（现已演变为机器学习和数据科学技术）被用于从海量数据中推导模式\
  \ [THUR1998]。然而，此类技术可能会提取出先前已知的“金块”。这些“金块”可能会侵犯个人隐私 [THUR2002]。由于与隐私相关的担忧日益增加，已经开发出各种隐私保护数据挖掘技术来解决不同的隐私问题\
  \ [THUR2005]。这些技术包括隐私保护关联规则挖掘技术和隐私保护决策树 [AGRA2000, AGGA2004, LIU2009]。隐私保护数据挖掘的理念是对数据进行随机化和/或扰动，然后再进行数据挖掘。这样敏感数据就能保持私密性。图\
  \ 12.1 说明了隐私保护数据挖掘背后的理念。\n\n![图 12.1 隐私保护数据挖掘。](img/fig12_1.jpg)\n\n图 12.1 隐私保护数据挖掘。\n\
  \n正如第 3 章所述，隐私保护数据挖掘技术通常在各种假设下运行并采用不同的方法。之前的工作主要分为两类：(1) 基于扰动和随机化的方法，以及 (2) 基于安全多方计算的方法。对于基于扰动的方法，数据会被扰动，以便保持敏感数据的私密性。对于随机化方法，会向数据中引入随机值。对于基于安全多方计算的方法，理念是每一方加密其秘密。隐私保护数据挖掘在加密的秘密上进行。最终结果会透露给各方。然而，每一方的秘密仅为该方所知。\n\
  \n早期的扰动和随机化方法包含一个重构原始数据分布的步骤。该领域较新的研究采用不同的数据扭曲方法或修改数据挖掘技术，使其更适合扰动场景。采用加密工具构建数据挖掘模型的安全多方计算方法面临着高昂的通信和计算成本，尤其是在参与计算的参与方数量较大时。\n\
  \n\n\n\n\n### 保护隐私的决策树分类\n\n在本章中，我们重点关注在隐私保护数据挖掘中广泛使用的扰动方法。它与之前的几种技术不同之处在于，我们直接从扰动数据构建数据挖掘模型，而不试图将通用数据分布重构作为中间步骤。在我们的解决方案中，我们修改数据挖掘算法，使其能直接用于扰动数据。换句话说，我们直接从扰动训练数据集构建原始数据集的分类器。\n\
  \n更确切地说，我们描述了一种修改后的 `C4.5` [QUIN1993] 决策树分类器，它可以处理扰动后的数值连续属性。我们的保护隐私决策树 `C4.5` (`PPDTC4.5`)\
  \ 分类器使用扰动训练数据，并构建一个可用于对原始或扰动数据集进行分类的决策树模型。我们的实验表明，当用于对原始数据集进行分类时，我们的 `PPDTC4.5`\
  \ 分类器能获得高度的准确性。我们选择决策树进行此项研究，是因为许多先前的方法都集中在隐私保护关联规则挖掘上。此外，我们在隐私保护决策树方面的努力，是开发决策树隐私感知方法这一更大规模工作的一部分\
  \ [LIU2009]。\n\n本章组织结构如下：第 12.2 节 介绍相关工作。第 12.3 节 介绍我们工作中用于度量隐私的隐私度量体系。第 12.4 节\
  \ 展示决策树的构建。第 12.5 节 描述如何从扰动数据集构建朴素贝叶斯模型。在 第 12.6 节 中，我们详细解释我们的 `PPDTC4.5`。第 12.7\
  \ 节 展示我们的实验结果。在 第 12.8 节 中，我们通过对未来工作的讨论进行总结。\n\n## 12.2 相关工作与动机\n\n隐私保护数据挖掘的先前工作解决了两个问题。其中之一旨在通过扰动数据值来保护客户隐私\
  \ [AGRA2000]。在该方案中，引入随机噪声数据以扭曲敏感值，并利用随机数据的分布生成一个接近原始数据分布但不泄露原始数据值的新数据分布。估计的原始数据分布用于重构数据，并将分类器和关联规则等数据挖掘技术应用于重构后的数据集。后来，该方法的改进基于扭曲数据收紧了对原始值的估计\
  \ [AGRA2000]。数据扭曲方法也已应用于布尔值的研究工作中 [DU2003, EVFI2002, RIZV2002]。扰动方法及其隐私保护受到批评，因为某些方法可能从重构步骤中推导出私人信息\
  \ [KARG2003]。\n\n不同于 [AGRA2000] 中最初的噪声加法方法，已提出许多独特的扰动方法。一个重要类别是乘法扰动方法。从数据几何属性的角度来看，用随机噪声矩阵乘以原始数据值相当于旋转原始数据矩阵，因此也称为基于旋转的扰动。在\
  \ [CHEN2005] 中，作者给出了“旋转不变分类器”的可靠证明，表明某些数据挖掘工具可直接应用于基于旋转扰动的数据。在后来的工作 [LIU2006] 中，Liu\
  \ 等人提出了乘法随机投影，提供了更强的隐私保护。还有一些其他有趣的技术，如基于凝聚的方法 [AGRA2000]、矩阵分解 [XU2006] 等。正如 [LIU2007]\
  \ 所指出的，这些近期关于基于扰动方法的研究工作直接将数据挖掘技术应用于扰动数据，跳过了重构步骤。选择合适的数据挖掘技术取决于引入噪声的方法。据我们所知，只有少数工作专注于映射或修改数据挖掘技术以满足扰动数据的需求。\n\
  \n另一种方法使用密码学工具构建数据挖掘模型。例如，在 [LIND2000] 中，目标是在训练集分布在两方之间的情况下安全地构建 `ID3` 决策树。利用密码学技术给出了不同的解决方案来解决不同的数据挖掘问题（例如\
  \ [CLIF2002, KANT2004, VAID2003])。这种方法将隐私保护数据挖掘视为安全多方计算的一个特例，不仅旨在保护个人隐私，还试图防止除最终结果外的任何信息泄露。但当参与方数量变大时，通信和计算成本会呈指数级增长。\n\
  \n我们的方法是一种修改后的 `C4.5` 决策树算法 [QUIN1993]，并采用噪声加法方法。我们的方法适用于许多参与方希望执行数据挖掘，但每方仅拥有少量数据的场景。为了获得全局数据挖掘模式，各方必须共享其数据，但每方都有其隐私和安全顾虑。我们的方法正是针对这种情况的解决方案。在我们的方法中，每方根据预设随机噪声的分布扰动其数据，并将扰动后的数据发送给数据挖掘者。数据挖掘者收集各方的扰动数据集，并知晓用于扰动数据的分布。基于这些信息，数据挖掘者构建一个分类器，并将该分类器返回给每个参与方。然后每方可使用此分类器对其数据进行分类。在这种情况下，每方仅知晓自己的数据和分类器，而不知晓其他方的任何数据。数据挖掘者仅能访问扰动数据和噪声数据的分布。这样，隐私得以保护，且每方的通信和计算成本被最小化。\n\
  \n## 12.3 隐私度量\n\n在 [AGRA2001] 的工作中，Agrawal 和 Aggarwal 基于微分熵提出了一种隐私度量。我们在此简要重述其思想。随机变量\
  \ `A` 的微分熵 `h(A)` 定义如下：\n\n```\nh(A) = −∫[Ω[A]] fA log[2] fA da  (12.1)\n```\n\n\
  其中 `ΩA` 是 `A` 的定义域。\n\n实际上，`h(A)` 是统计学中 `A` 值固有不确定性的度量。基于此，Agrawal 和 Aggarwal [AGRA2001]\
  \ 提出了随机变量 `A` 固有的隐私度量 `Π(A)`。\n\n```\nΠ(A) = 2^(h(A))  (12.2)\n```\n\n例如，在 0 和 `a`\
  \ 之间均匀分布的随机变量 `U` 具有隐私度：\n\n```\nΠ(U) = 2^(log2) = a.\n```\n\n因此，如果 `Π(A)` = 1，则\
  \ `A` 具有与在长度为 1 的区间上均匀分布的随机变量同等的隐私度。此外，如果\n\n```\nfB = 2 fA,\n```\n\n则 `B` 提供的隐私度仅为\
  \ `A` 的一半。这很容易说明：在 [0, 1] 上均匀分布的随机变量，其隐私度仅为在 [0, 2] 上均匀分布的随机变量的一半。在 [AGRA2001] 中，Agrawal\
  \ 和 Aggarwal 还定义了条件隐私和信息损失。更多细节请参考原始文献 [AGRA2001]。我们在工作中选择此隐私度量来量化实验中的隐私。\n\n##\
  \ 12.4 决策树构建概述\n\n\n\n\n### 我们提出了一种修改后的 C4.5 决策树分类器，它从扰动数据构建决策树，并可用于对原始数据和扰动数据进行分类。\n\
  \n这种方法背后的思想如下：当我们考虑属性的分裂点时，也会考虑噪声数据集的偏差。每当我们试图寻找最佳属性、最佳分裂点并划分训练数据时，都会计算偏差。C4.5 算法是\
  \ ID3 算法的扩展，由 Quinlan 在 [QUIN1993] 中提出。经过多年的改进，C4.5 算法已成为处理数值连续属性的最佳算法之一 [QUIN1996]。它能找到最佳分裂属性以及数值连续属性的最佳分裂点。\n\
  \n### 12.4.1 分裂准则\n\n分裂准则在构建决策树时至关重要。它决定使用哪个属性进行分裂，对于数值连续属性，还决定使用哪个值进行分裂。它决定了决策树是否高效，并极大地影响分类准确率。ID3\
  \ 使用信息增益作为分裂准则。C4.5 算法使用信息增益率，在检查属性时会考虑分支数量。信息增益和增益率的公式如下：\n\n```\nInfo(S) = - Σ_{j=1}^{k}\
  \ (freq(C_j, S) / |S|) × log₂(freq(C_j, S) / |S|)  (12.3)\n```\n\n```\nInfo_{Test_A}(S)\
  \ = Σ_{i=1}^{n} (|S_i| / |S|) × Info(S_i)  (12.4)\n```\n\n```\ngain(Test[A]) = Info(S)\
  \ − Info_{Test[A]}(S)  (12.5)\n```\n\n```\nsplitInfo(Test_A) = - Σ_{i=1}^{n} (|S_i|\
  \ / |S|) × log₂(|S_i| / S)  (12.6)\n```\n\n```\ngainRatio(Test_A) = gain(Test_A)\
  \ / splitInfo(Test_A)  (12.7)\n```\n\n设 `S` 为训练集，`|S|` 为 `S` 中实例的数量，`freq(C_j, S)`\
  \ 为属于类别 `j` 的实例数量，其中 `j` 从 1 到 `k`。`|S_i|` 为类别 `S_i` 中实例的数量。`Test[A]` 为所选属性。\n\n\
  ### 12.4.2 连续属性离散化\n\n#### 二元分裂法\n\nC4.5 算法也旨在处理数值属性。C4.5 算法不使用固定范围，而是在可能的分裂点中搜索以找到最佳分裂点。假设数值属性\
  \ `A_i` 按升序具有值 `{x_1, x_2, …, x_m}`。C4.5 将实例划分为两组 `S_1` 和 `S_2`，其中 `S_1` 包含不超过 `x_j`\
  \ 的值，`S_2` 包含大于 `x_j` 的值。对于每个划分，C4.5 计算增益率并选择使增益率最大化的划分。\n\n### 12.4.3 停止准则\n\n\
  停止准则决定何时停止决策树的生长。在 C4.5 算法中，当满足以下两个准则之一时，树停止生长。一是节点上的所有实例具有相同的类别标签 `C_i`；我们称该节点为纯节点。二是节点上的实例数量小于或等于预设的阈值；我们称该数量为节点的最小实例数。我们在隐私保护决策树\
  \ C4.5 (`PPDTC4.5`) 中也使用相同的停止准则。\n\n## 12.5 基于扰动数据的朴素贝叶斯分类器构建\n\n正如 [LIU2007] 所述，朴素贝叶斯分类器可直接应用于扰动数据。为求完整，我们在此简要描述。\n\
  \n### 12.5.1 朴素贝叶斯分类器\n\n朴素贝叶斯分类器通过分配最可能的类别值来标记新实例。此外，它假设在给定类别值的条件下属性值相互独立，以简化所需概率的估计。利用上述假设，朴素贝叶斯分类器选择最可能的分类\
  \ `C_nb`：\n\n```\nC_nb = argmax_{C_j ∈ C} P(C_j) ∏_i P(X_i | C_j)  (12.8)\n```\n\
  \n其中 `X = X_1, X_2, …, X_n` 表示属性集，`C = C_1, C_2, .., C_d` 表示可能的类别标签有限集，`C_nb` 表示朴素贝叶斯分类器输出的类别标签\
  \ [MITC1997]。\n\n显然，我们需要根据训练数据计算公式 12.8 中使用的概率 `P(X_i = x | C_j)`。在实践中，对于数值属性，`P(X_i\
  \ = x | C_j)` 通过高斯分布 `N(μ_ij, σ_ij²)` 进行估计。所需参数 `μ_ij = E(X_i | c_j)` 和 `σ_ij² =\
  \ Var(X_i | C_j)` 通过训练数据估计。接下来，我们展示如何使用扰动训练数据来估计参数 `μ_ij` 和 `σ_ij²`。\n\n### 12.5.2\
  \ 基于扰动数值数据\n\n我们需要使用扰动数值数据，为每个属性 `X_i` 和每个类别标签 `C_j` 估计 `μ_ij` 和 `σ_ij²`，以构建朴素贝叶斯分类器。在扰动数据情况下，我们不再看到原始属性值\
  \ `X_i`，而是看到 `W_i = X_i + R` 的值。设 `w_ij^(t)` 为具有类别标签 `C_j` 的第 `t` 个训练数据实例的第 `i`\
  \ 个属性值。此外，我们假设有 `n` 个实例具有类别标签 `C_j`。\n\n我们还知道 `w_ij^(t) = x_ij^(t) + r_ij^(t)`，其中\
  \ `r_ij^(t)` 为均值为零、方差 `σ_R²` 已知的随机生成噪声。利用上述事实，我们可以证明：\n\n```\nw̄_ij = (1/n) · Σ_{t=1}^{n}\
  \ (w_ij^t)\n```\n\n的期望值等于 `μ_ij`。\n\n由于样本方差\n\n```\nS² = (1/(n - 1)) · Σ_{t=1}^{n}\
  \ (w_ij^t - w̄_ij)²\n```\n\n的期望值为 `σ_ij² + σ_R²`，我们可以利用 `S²` 和已知的 `σ_R²` 来估计 `σ_ij²`（即用\
  \ `S² − σ_R²` 来估计 `σ_ij²`）。\n\n因此，只要我们不改变类别标签，就可以直接从扰动数据构建朴素贝叶斯分类器。更进一步说，由于使用扰动数据和原始数据进行参数估计具有相同的期望值，我们在两种情况下都应该能获得相似的分类准确率。为验证上述直觉，我们使用\
  \ WEKA 机器学习工具包 [WITT2005] 中的朴素贝叶斯分类器进行了一些实验。\n\n使用包含所有六个数值连续属性的相同数据集，我们从原始数据集构建朴素贝叶斯分类器，获得\
  \ 79.7% 的分类准确率。类似地，如果直接从扰动训练数据集构建朴素贝叶斯分类器并在扰动测试集上测试，可获得 78% 的分类准确率。正如预期的那样，这两个分类准确率值非常接近。\n\
  \n## 12.6 隐私保护决策树 C4.5 (PPDTC4.5)\n\n### 12.6.1 动机\n\n在本节中，我们将描述如何从扰动训练数据集构建决策树分类器。我们将展示阈值法和随机路径选择法这两种不同的构建分类器的方式。阈值算法对原始数据集的分类提供了相当不错的准确率。随机路径选择算法使用概率作为权重，为属性寻找良好的分裂点。然而，正如我们将看到的，随机选择路径来划分训练数据集并不能构建一个良好的决策树分类器。\n\
  \n\n\n我们将随机路径选择算法纳入其中，主要是为了比较目的，同时也为未来的工作提供一些方向，即构建决策树分类器来对扰动数据集进行分类。我们认为，通过对随机变量\
  \ `R` 的紧界进行适当改进，可以提高随机路径选择算法的性能。\n\n目标是从扰动数据构建一个决策树模型，该模型能够准确地对原始数据集或扰动数据集进行分类。在我们的场景中，由于添加了噪声，我们不知道原始的\
  \ `x[j]` 值。相反，我们观察到 `w[j] = x[j] + R`，其中 `R` 是随机噪声，且我们知道其分布。显然，对于属性 `A[i]` 的分裂点\
  \ `t`，如果我们知道 `x[j]` 的值，我们将使用以下规则将实例分裂到 `S[1]` 和 `S[2]` 中：\n\n```\nsplit(x_j, t)\
  \ = { S_1, if x_j ≤ t; S_2, if x_j > t } (12.9)\n```\n\n由于我们不知道 `x[j]` 的值，因此只能计算给定分裂点\
  \ `t` 和 `w[j]` 时 `w[j]` 属于 `S[1]` 的概率。注意 `Pr{w[j] ∈ S[1]} = Pr{w[j] − R ≤ t} = Pr{w[j]\
  \ − t ≤ R}`。由于我们知道 `R` 的累积分布函数，因此可以轻松计算该概率。令 `pS1` 为给定分裂点 `t` 和 `w[j]` 时 `w[j]`\
  \ 属于 `S[1]` 的概率。类似地，定义 `pS2 = 1 − pS1`。一般来说，令 `pS` 为 `w[j]` 属于集合 `S` 的概率。现在，我们不再根据公式\
  \ (12.9) 进行分裂，而是可以使用 `pS` 值来估计最佳分裂点，并对 `w[j]` 进行划分，就像原始数据 `x[j]` 会被划分那样。\n\n###\
  \ 12.6.2 使用阈值的分裂准则\n\n我们可以为每个 `w[j]` 值计算给定分裂点 `t` 下的概率 `pS1`。该 `pS1` 值表示 `w[j] ∈\
  \ S[1]` 的可能性。我们可以设定一个阈值，并统计具有类标签 `C[j]` 且 `pS1` 值大于该阈值的 `w[j]` 的数量。这可以用以下方程形式表示：\n\
  \n```\nfreq'(C_j, S_i) = Σ_{w_j ∈ S_i} ( I_{w_j ∈ C_j}, p_{Si}(w_j) > threshold\
  \ ) (12.10)\n```\n\n在上述方程中，我们通过使用 `pS1` 来计算类值的频率。`I[wj∈Cj]` 是一个指示函数，如果 `w[j]` 具有类标签\
  \ `C[j]`，则返回 1。公式 (12.3) 变为如下形式：\n\n```\nInfo(S) = - Σ_{j=1}^k ( freq'(C_j, S) /\
  \ |S| ) × log_2( freq'(C_j, S) / |S| ) (12.11)\n```\n\n使用上述公式 (12.11)，加上公式 (12.4)、(12.5)、(12.6)\
  \ 和 (12.7)，我们可以通过最大化 `gainRatio` 来找到数值连续属性的最佳分裂属性和最佳分裂点。\n\n### 12.6.3 通过阈值分裂训练数据\n\
  \n训练数据的分裂准则是直观的。\n\n```\nsplitThreshold(w_j, t) = { S_1, if p_{S_1}(w_j | t) > threshold;\
  \ S_2, if p_{S_1}(w_j | t) ≤ threshold } (12.12)\n```\n\n请注意，条件 `pS1 > threshold`\
  \ 等价于条件 `pS2 ≤ (1 − threshold)`，反之亦然。例如，条件 `pS1(wj|t) > 0.2` 等价于条件 `pS2(wj|t) ≤\
  \ 0.8`。伪代码如 Algorithm 12.1 所示。\n\n使用阈值方法看似是一种简单的方法，但设置能够导致成功分类器的适当阈值并非易事。根据定义，`pS1`\
  \ 是给定分裂点 `t` 和 `w[j]` 时 `w[j]` 属于 `S[1]` 的概率。当给定分裂点 `t` 和扰动实例 `w[j]` 时，唯一的不确定性就是随机噪声\
  \ `R`。换句话说，阈值的选择与随机噪声的分布有关。在我们的实验中，我们对随机噪声均使用了均匀分布和高斯分布。这两种分布的阈值不同。对于高斯分布，当阈值设置为\
  \ 0.30 时，分类器给出较高的准确率；对于均匀分布，当阈值设置为 0.50 时，分类器给出较高的准确率。实验结果将在下一节讨论。\n\n决定阈值的另一个好方法是保持其灵活性，就像\
  \ C4.5 算法为数值连续属性寻找最佳分裂点 `t` 那样。这将带来良好的结果，但会增加计算成本。\n\n### 12.6.4 对原始实例进行分类\n\n使用前两小节描述的算法，我们选择实际属于原始数据的分裂属性和分裂点。我们还根据对原始值的估计对扰动训练数据进行划分。这样我们就可以为原始数据构建一个决策树分类器。然后，当我们用它对原始数据进行分类时，只需根据属性值是小于还是大于某个属性分裂点来进行分类。对原始数据进行分类的伪代码如\
  \ Algorithm 12.2 所示。\n\n### 12.6.5 分裂准则\n\n使用概率作为权重，我们利用 `pS1` 和 `pS2` 值作为权重重写所有方程，如下所示：\n\
  \n```\nfreq''(C_j, S_i, S) = Σ_{w_j ∈ S} ( I_{w_j ∈ C_j} × p_{S_i}(w_j) ) (12.13)\n\
  ```\n\n在上述方程中，我们通过使用 `pS1` 作为权重来计算类值的频率。`I[wj∈Cj]` 是一个指示函数，如果 `w[j]` 具有类标签 `C[j]`，则返回\
  \ 1。为了归一化，我们需要计算总权重之和（即所有 `pS1` 值之和）\n\n```\nw(S_i, S) = Σ_{w_j ∈ S} ( p_{S_i}(w_j)\
  \ ) (12.14)\n```\n\n现在，利用上述两个定义，我们准备好使用 `pS1` 值重新定义条件熵。\n\n```\nProb(S_i, S) = freq''(C_j,\
  \ S_i, S) / |w(S_i, S)| (12.15)\nInfo'(S_i, S) = - Σ_{j=1}^k Prob(S_i, S) × log_2(\
  \ Prob(S_i, S) ) (12.16)\nProb(S_i, S) = freq''(C_j, S_i, S) / |w(S_i, S)| (12.17)\n\
  Info'(S_i, S) = - Σ_{j=1}^k Prob(S_i, S) × log_2( Prob(S_i, S) ) (12.18)\n```\n\n\
  类似地，我们需要更新选择属性 `A` 及分裂点 `t` 时的信息增益。\n\n```\nInfo'_Test_A(S) = Σ_{i=1}² ( |w(S_i,\
  \ S)| / |S| ) × Info'(S_i, S) (12.19)\n```\n\n此外，在计算 `splitInfo` 时，我们需要使用 `w(S_i,\
  \ S)`。\n\n```\nsplitInfo'(Test_A) = - Σ_{i=1}^n ( |w(S_i, S)| / |S| ) × log_2( |w(S_i,\
  \ S)| / |S| ) (12.20)\n```\n\n现在，我们可以将上述修改后的定义插入原始测试中，以选择分裂点和属性。\n\n\n\n\n$$gain'(Test_A)\
  \ = Info(S) - Info'_S(Test_A)(S) \\tag{12.21}$$\n\n$$gainRatio'(Test_A) = \\frac{gain'(Test_A)}{splitInfo'(Test_A)}\
  \ \\tag{12.22}$$\n\n现在，我们可以使用公式 (12.22) 来选择一个分裂点和一个属性。请注意，`C4.5` 中使用的原始公式与我们的公式之间的主要区别在于，我们在公式中使用了属于某个分区的概率作为权重。这种修改背后的基本原理如下：如果我们清晰地写出原始公式，可以看到存在一个隐含的指示函数，它根据实例属于集合\
  \ `S[1]` 还是集合 `S[2]` 来分配 0 或 1。由于我们无法确定某个实例是在 `S[1]` 中还是在 `S[2]` 中，因此我们使用属于 `S[1]`\
  \ 或 `S[2]` 的概率作为权重。\n\n### 12.6.6 使用随机路径选择分割训练数据集\n\n该方法是在找到分裂点和属性后，将训练数据分成两部分的一种替代方式。同样，在我们的实现中，我们基于\
  \ `p[S1]` (`w[j]`) 和 `p[S2]` (`w[j]`) 的值使用随机分割。\n\n$$splitRandom(w_j, t) = \\begin{cases}\
  \ S_1, & \\text{with prob. } p_{S_1}(w_j) \\\\ S_2, & \\text{with prob. } p_{S_2}(w_j)\
  \ \\end{cases} \\tag{12.23}$$\n\n伪代码如 算法 12.3 所示。\n\n### 12.6.7 使用随机路径选择对扰动实例进行分类\n\
  \n对于扰动数据集 `W` 中的每个测试实例 `w[j]`，以及构建的树中每个选定的分裂点，我们计算 `p[S1]` (`w[j]`) |t) = `p[1]`。接下来，我们以概率\
  \ `p1` 将实例放置在该节点的左子节点，以概率 1 − `p[1]` 放置在右子节点。我们继续这一过程，直到到达叶节点。伪代码如 算法 12.4 所示。\n\
  \n## 12.7 实验结果\n\n### 12.7.1 我们的方法\n\n在我们的实验中，我们使用从 1994 年人口普查数据库中提取的数据（“人口普查收入”或“收入”），该数据可从加利福尼亚大学欧文分校\
  \ (UCI) 机器学习数据库存储库 1 下载。该数据集有 14 个属性，6 个连续属性和 8 个离散属性。它总共有 48,842 个实例，分为训练数据 32,561\
  \ 个实例和测试数据 16,281 个实例。这些数据用于预测收入是否超过每年 50K。我们选择这个数据集是为了与基于重构的技术进行公平比较，因为这些技术需要相对较大的数据集。由于在本章中我们专注于数值连续属性，因此我们在数据集中仅保留了六个数值连续属性。此外，为了提高效率，我们从训练数据集中随机选择了\
  \ 10,000 个实例，并保留了测试数据集中的所有实例。\n\n我们使用 [AGRA2000] 中提出的噪声添加框架，并向每个属性添加高斯和均匀随机噪声。当使用高斯随机噪声时，我们知道方差\
  \ `σ²` 会显著影响结果。我们使用了四组具有不同方差值的高斯分布噪声数据。为了量化添加到实际数据中的相对噪声量，我们使用了信噪比 (SNR)，即实际数据的方差\
  \ `.3` 与噪声数据方差 `σ²` 之比 [KARG2003]。我们还使用 第 12.2 节 中提到的隐私度量来量化隐私损失。表 12.1 显示了五个扰动数据集及其\
  \ SNR 值和隐私度量。在我们的实验中，我们仅使用一组由均匀噪声扰动的数据集，显示为数据 5。从表 12.1 可以看出，当 SNR 值较高时，噪声数据的方差\
  \ `σ²` 较低，因此扰动数据保留的隐私较少。均匀分布噪声由给定的数据范围生成。我们可以计算均匀噪声数据中每个属性的 SNR，在我们的实验数据集中，六个属性的\
  \ SNR 值分别为 1.3、2.7、1.2、53.6、1.9 和 1.1。\n\n表 12.1 不同数据集的隐私度量\n\n| | 数据 1 | 数据 2 |\
  \ 数据 3 | 数据 4 | 数据 5 |\n| --- | --- | --- | --- | --- | --- |\n| 噪声分布 | 高斯 | 高斯\
  \ | 高斯 | 高斯 | 均匀 |\n| SNR | 1.7 | 1.3 | 1.0 | 0.5 | N/A |\n| 隐私损失 | 0.2183 | 0.1909\
  \ | 0.1619 | 0.1026 | 0.2604 |\n\n### 12.7.2 本地数据挖掘与全局数据挖掘\n\n首先请注意，本地数据挖掘是指每个参与者挖掘自己的数据。全局数据挖掘是指参与者共享数据并挖掘以获得全局模式。正如我们之前提到的，我们的方法适用于多方参与全局数据挖掘而不泄露其隐私的场景。分布在各方之间的数据集可以是水平分区或垂直分区。水平分区数据意味着实例分布在各方之间，垂直分区数据意味着属性分布在各方之间。实验结果表明，对于这两种类型的分区，本地数据挖掘的结果都不如从全局数据挖掘获得的结果准确。这支持了从全局共享数据中提取信息效果更好的事实。\n\
  \n我们使用上一小节描述的具有六个属性的数据集。我们随机选择实例形成不同大小的小数据集，记为第 1 组、第 2 组到第 10 组。我们在这些数据集上应用标准 `C4.5`\
  \ 分类器，准确率数字如 表 12.2 所示。显然，当实例数量增加时，`C4.5` 决策树算法的性能更好。\n\n表 12.2 水平分区数据上的 C4.5 决策树分类器准确率\n\
