  \ `F[new]` 率略微上升，因为将现有类别实例识别为新类别的风险也略微上升。这些变化从数据块大小 4,000 开始趋于稳定（对于合成数据集，则是 1,000）。这就是我们在实验中使用这些值的原因。图\
