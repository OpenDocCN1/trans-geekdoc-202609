  \n## 3.1 简介\n\n数据挖掘（以及机器学习）可被视为数据科学的一个关键方面。我们在多个项目中针对入侵检测系统和社交媒体系统等各种应用，使用了数据挖掘和分析技术。例如，在我们之前的著作\
  \ THUR2016 中，我们讨论了基于位置的数据挖掘算法，可提取各种社交媒体（如 Twitter）用户的位置。这些算法可扩展以提取其他人口统计数据。我们之前的研究还开发了用于情感分析以及网络安全应用的数据挖掘工具。例如，在我们之前的一本书中，我们讨论了用于恶意软件检测的数据挖掘工具\
  \ MASU2011。在本章中，我们提供关于通用数据挖掘技术及其在网络安全中的应用的一些背景信息，以便读者能够了解该领域。此外，我们还将讨论针对数据挖掘技术的攻击方面以及隐私考量。\n\
  \n数据挖掘结果（也称为任务）包括分类、聚类、形成关联以及检测异常。我们的工具主要专注于分类作为结果，并开发了分类工具。分类问题也称为监督学习，即模型从一组带标签的示例中学习，然后向模型呈现一个标签未知的新示例进行预测。\n\
  \n已有许多预测模型被使用，如马尔可夫模型、决策树、人工神经网络（ANN）、支持向量机（SVM）、关联规则挖掘（ARM）等。这些模型各有优劣。然而，所有这些技术存在一个共同的弱点，即无法适用于所有应用。不存在这种理想或完美分类器的原因是，这些技术最初都是为在特定假设下解决特定问题而设计的。\n\
  \n在本章中，我们讨论常用的数据挖掘技术。具体而言，我们介绍马尔可夫模型、SVM、ANN、ARM、多分类问题以及图像分类（这是图像挖掘的一个方面）。在我们的研究与开发中，我们设计了混合模型，以提高数据挖掘算法在入侵检测、社交媒体分析、WWW\
  \ 预测和图像分类等各种应用中的预测准确性 AWAD2009。\n\n数据挖掘在安全领域有许多应用，包括国家安全（如监控）和网络安全（如恶意软件检测）。国家安全面临的威胁包括攻击建筑物、破坏关键基础设施，如电网和电信系统\
  \ BOLZ2005。数据挖掘技术正被研究用于发现可疑人员是谁以及谁有能力实施恐怖活动 THUR2003。网络安全涉及保护计算机和网络系统免受特洛伊木马和病毒导致的破坏。数据挖掘也被应用于提供入侵和恶意软件检测及审计等解决方案\
  \ MASU2011。在本章中，我们将重点关注用于网络安全应用的数据挖掘。\n\n本章的组织结构如下。在 第 3.2 节 中，我们提供数据挖掘的概述。我们从 第\
  \ 3.2.1 节 中数据挖掘任务的讨论开始，然后提供我们在工作中使用的一些数据挖掘技术的细节。其中一些技术也用于本书的 第二部分 和 第三部分（如支持向量机、决策树）。特别是，我们讨论各种数据挖掘技术，如\
  \ SVM、马尔可夫模型、ARM 和决策树，这些将在 第 3.2.2 节 至 第 3.2.6 节 中描述。在 第 3.3 节 中，我们将讨论用于网络安全应用的数据挖掘。特别是，我们将讨论网络威胁以及数据挖掘检测此类威胁的应用。针对数据挖掘技术的攻击以及数据挖掘的隐私影响将在第\
  \ 3.3.4 节中讨论。第 3.4 节 总结本章。图 3.1 说明了本章的概念。\n\n![图 3.1 数据挖掘与安全。](img/fig3_1.jpg)\n\
  \n图 3.1 数据挖掘与安全。\n\n## 3.2 数据挖掘技术\n\n### 3.2.1 概述\n\n在讨论数据挖掘技术之前，我们先概述一些数据挖掘任务（也称为数据挖掘结果）。然后我们将讨论这些技术。一般来说，数据挖掘任务可分为两类：预测性和描述性。预测性任务本质上预测某个项目是否属于某个类。描述性任务总体上从示例中提取模式。最突出的预测性任务之一是分类。在某些情况下，其他任务（如异常检测）可归结为预测性任务，即判断特定情况是否为异常。描述性任务总体上包括建立关联和形成聚类。因此，分类、异常检测、建立关联和形成聚类也被认为是数据挖掘任务。\n\
  \n\n\n接下来，数据挖掘技术可以是预测性的、描述性的，或者两者兼具。例如，神经网络既可以执行分类，也可以执行聚类。分类技术包括决策树、SVM 以及基于记忆的推理。关联规则挖掘（ARM）技术通常用于建立关联。分析链接的链接分析也可以在链接之间建立关联并预测新链接。聚类技术包括\
  \ K 均值聚类。数据挖掘任务（即数据挖掘的结果）的概览如图 3.2 所示。技术（例如神经网络、支持向量机）在图 3.2 中进行了说明。第 3.2.2 节至第\
  \ 3.2.6 节讨论了我们在工作中使用的一些数据挖掘技术。关于我们数据挖掘技术（图 3.3）的更多细节，请参阅我们之前的著作（例如 \\AWAD2009, MASU2011,\
  \ [THUR2017\\]）。\n\n![图 3.2 数据挖掘任务。](img/fig3_2.jpg)\n\n图 3.2 数据挖掘任务。\n\n![图 3.3\
  \ 数据挖掘技术。](img/fig3_3.jpg)\n\n图 3.3 数据挖掘技术。\n\n### 3.2.2 人工神经网络\n\nANN 是一种非常著名、强大且鲁棒的分类技术，已被用于从示例中逼近实值、离散值和向量值函数\
  \ \\[MITC1997\\]。ANN 已应用于许多领域，如视觉场景解释、语音识别和学习机器人控制策略。ANN 模拟人脑中的生物神经系统。神经系统由大量高度互联的处理单元（神经元）组成，它们协同工作以产生我们的感觉和反应。ANN\
  \ 像人一样，通过示例学习。人脑中的学习过程涉及神经元之间突触连接的调整。同样，ANN 的学习过程涉及节点权重的调整。图 3.4 展示了一个简单的神经元单元，称为感知机。感知机输入\
  \ `x` 是一个向量或实值输入。`w` 是权重向量，其值在训练后确定。感知机计算输入向量 `x` 的线性组合。\n\n![图 3.4 感知机。](img/fig3_4.jpg)\n\
  \n图 3.4 感知机。\n\n学习感知机涉及选择权重的值。最初，会给感知机分配随机权重值。然后将感知机应用于每个训练示例，每当示例被错误分类时，就更新感知机的权重。此过程重复多次，直到所有训练示例都被正确分类。\n\
  \n单个感知机的计算能力仅限于线性决策。然而，感知机可用作构建块来组成强大的多层网络。在这种情况下，需要更复杂的更新规则来训练网络权重。在本工作中，我们采用两层\
  \ ANN，每层由三个构建块组成（见图 3.5）。我们使用反向传播算法来学习权重。反向传播算法试图最小化平方误差函数。\n\n![图 3.5 人工神经网络。](img/fig3_5.jpg)\n\
  \n图 3.5 人工神经网络。\n\n### 3.2.3 支持向量机\n\nSVM 是一种学习系统，它在高维特征空间中使用线性函数的假设空间，并通过优化理论中的学习算法进行训练。Vapnik\
  \ 等人引入的这种学习策略 \\[CRIS2000, VAPN1995, VAPN1998, VAPN1999\\] 是一种非常强大的方法，已应用于各种各样的应用中。SVM\
  \ 的基本概念是超平面分类器，或线性可分性。为了实现线性可分性，SVM 应用了两个基本思想：边界最大化和核函数，即将输入空间映射到更高维的空间——特征空间。\n\
  \n对于二分类，SVM 问题可以形式化为寻找一个线性分离超平面分类器。此外，我们希望该超平面相对于两个类具有最大分离边界（见图 3.6）。函数边界（或简称边界）在几何上定义为从决策边界到输入空间的最近点的欧氏距离。图\
  \ 3.7 直观地解释了为什么边界最大化能给出最佳分离解。在图 3.7(a) 中，我们可以为特定数据集找到无限数量的分离面。没有具体或明确的理由偏向其中一个分离面。在图\
  \ 3.7(b) 中，我们看到最大化边界仅提供一个粗分离面。这种解决方案被证明能实现最佳泛化准确性，即对未见数据的预测 \\[VAPN1995, VAPN1998,\
  \ VAPN1999\\]。\n\n![图 3.6 SVM 中的线性分离。](img/fig3_6.jpg)\n\n图 3.6 SVM 中的线性分离。\n\n\
  ![图 3.7 导致最大边界的 SVM 分离面。(a) 无限数量的分离面 (b) 具有最大边界的分离面。](img/fig3_7.jpg)\n\n图 3.7 导致最大边界的\
  \ SVM 分离面。(a) 无限数量的分离面 (b) 具有最大边界的分离面。\n\n只有最靠近超平面的那些点才给出假设/分类器的表示（图 3.8(a)）。这些最重要的数据点作为支持向量。它们的值也可用于给出关于假设/分类器可靠性的独立边界\
  \ \\[BART1999\\]。图 3.8(a) 显示了两个类及其边界，即边界。支持向量用实心对象表示，而空心对象是非支持向量。请注意，边界仅受支持向量影响，即如果我们移除或添加空心对象，边界不会改变。同时，实心对象的任何变化，无论是添加还是移除对象，都可能改变边界。图\
  \ 3.8(b) 显示了在边界区域添加对象的影响。正如我们所见，添加或移除远离边界的对象（例如数据点 1 或 -2）不会改变边界。然而，添加和/或移除靠近边界的对象（例如数据点\
  \ 2 和/或 -1）已创建了新的边界。\n\n![图 3.8 (a) 支持向量和非支持向量的值。(b) 添加新数据点对边界的影响。](img/fig3_8.jpg)\n\
  \n图 3.8 (a) 支持向量和非支持向量的值。(b) 添加新数据点对边界的影响。\n\n### 3.2.4 马尔可夫模型\n\n\n\n#### 一些用于网页浏览的近期高级预测方法\n\
  \n一些用于网页浏览的近期高级预测方法是利用马尔可夫模型开发的 [PIRO1996, YANG2001]。对于这些预测模型，浏览者访问的网页序列通常被视为马尔可夫链，并作为输入提供。马尔可夫模型的基本概念是：它根据前一个动作或前几个动作的结果来预测下一个动作。对于不同的应用，动作可能意味着不同的事物。为了便于说明，我们将考虑特定于\
  \ WWW 预测应用的动作。在 WWW 预测中，下一个动作对应于预测下一个将被遍历的页面。前一个动作对应于要考虑的前几个网页。根据所考虑的前一个动作的数量，马尔可夫模型可以有不同的阶数。在下文中，我们将展示不同阶数马尔可夫模型的说明性示例及其预测方式。\n\
  \n### 3.2.4.1 示例\n\n假设一个包含六个网页的网站：`P1`、`P2`、`P3`、`P4`、`P5` 和 `P6`。假设我们有如表 3.1 所示的用户会话。表\
  \ 3.1 描绘了该网站许多用户的导航路径。图 3.9 展示了*一阶马尔可夫模型*，其中下一个动作的预测仅基于用户执行的最后一个动作，即最后遍历的页面。状态 `S`\
  \ 和 `F` 分别对应初始状态和最终状态。每次转移的概率通过状态序列被遍历的次数与锚定状态被访问的次数之比来估算。在图 3.9 的每个弧旁，第一个数字是该转移的频次，第二个数字是转移概率。例如，转移（`P2`\
  \ 到 `P3`）的转移概率为 0.2，因为用户从页面 2 遍历到页面 3 的次数是 3 次，而页面 2 被访问的次数是 15 次（即 0.2 = 3/15）。\n\
  \n#### 表 3.1 用户会话集合及其频次\n\n| 会话 | 频次 |\n| --- | --- |\n| P1, P2, P4 | 5 |\n| P1,\
  \ P2, P6 | 1 |\n| P5, P2, P6 | 6 |\n| P5, P2, P3 | 3 |\n\n![图 3.9 一阶马尔可夫模型。](img/fig3_9.jpg)\n\
  \n图 3.9 一阶马尔可夫模型。\n\n请注意，转移概率用于解析预测。例如，已知用户访问了 `P2`，则她下一步最可能访问的页面是 `P6`。这是因为从 `P2`\
  \ 到 `P6` 的转移概率最高。\n\n请注意，某些页面的转移概率可能不可用。例如，从 `P2` 到 `P5` 的转移概率不可用，因为没有用户在访问 `P2`\
  \ 后访问 `P5`。因此，这些转移概率被设为零。类似地，`K^(th)` 阶马尔可夫模型是在考虑用户执行的最后 `K^(th)` 个动作后计算预测。在 WWW\
  \ 预测中，`K^(th)` 阶马尔可夫模型是指在给定用户前 `k-1` 个页面访问的情况下，用户访问第 `P[k]^(th)` 个页面的概率。\n\n图 3.10\
  \ 展示了对应于表 3.1 的二阶马尔可夫模型。在二阶模型中，我们考虑最后两个页面。转移概率的计算方式类似。例如，从状态（`P1`、`P2`）到状态（`P2`、`P6`）的转移概率为\
  \ 0.16 = 1 × 1/6，因为用户从状态（`P1`、`P2`）遍历到状态（`P2`、`P6`）的次数是 1 次，而页面（`P1`、`P2`）被访问的次数是\
  \ 6 次（即 0.16 = 1/6）。转移概率用于预测。例如，已知用户访问了 `P1` 和 `P2`，她最可能访问 `P4`，因为从状态（`P1`、`P2`）到状态（`P2`、`P4`）的转移概率大于从状态（`P1`、`P2`）到状态（`P2`、`P6`）的转移概率。马尔可夫模型的阶数与滑动窗口有关。`K^(th)`\
  \ 阶马尔可夫模型对应大小为 `K-1` 的滑动窗口。\n\n![图 3.10 二阶马尔可夫模型。](img/fig3_10.jpg)\n\n图 3.10 二阶马尔可夫模型。\n\
  \n## 3.2.5 关联规则挖掘 (ARM)\n\n关联规则挖掘是一种数据挖掘技术，已成功应用于发现相关事务。关联规则技术基于项集在事务中的共现来发现它们之间的关系。具体而言，关联规则挖掘发现这些项集中的频繁模式（规律）。例如，超市中哪些商品是一起购买的？在下文中，我们简要介绍\
  \ ARM。更多详情请参见 [AGRA1993] 和 [AGRA1994]。有几种高效的算法被提出用于寻找关联规则，例如 `AIS 算法` [AGRA1993,\
  \ AGRA1994]、`SETM 算法` [HOUT1995] 和 `AprioriTid` [LIU1999]。\n\n在 Web 事务的情况下，我们使用关联规则来发现用户间的导航模式。这将有助于提前缓存页面并减少页面加载时间。此外，发现导航模式有助于实现个性化。事务是从\
  \ Web 服务器日志中捕获的点击流数据中获取的。\n\n在许多应用中，使用 ARM 存在一个主要问题。首先，使用全局最小支持度（`minsup`）存在问题，因为罕见点击，即很少被访问的网页，将不会被包含在频繁项集中，因为它无法获得足够的支持度。一种解决方案是设置一个非常小的支持度阈值；然而，我们将最终得到非常大的频繁项集，这在计算上很难处理。Liu\
  \ 等人 [LIU1999] 提出了一种挖掘技术，为不同的项使用不同的支持度阈值。指定多个阈值允许将可能非常重要的罕见事务包含在频繁项集中。根据应用本身，可能会出现其他问题。例如，在\
  \ WWW 预测的情况下，会为每个用户记录一个会话。会话可能包含数十个点击流（有时甚至数百个，取决于会话时长）。将每个会话作为一个事务使用行不通，因为很少能找到两个频繁重复（即完全相同）的会话；因此，即使是非常高的支持度阈值\
  \ `minsup` 也无法达到。需要将每个会话分解为许多子序列。Mobasher 等人 [MOBA2001] 提出了一种推荐引擎，将活跃用户会话与数据库中的频繁项集进行匹配，并预测用户最可能访问的下一个页面。\n\
  \n## 3.2.6 决策树\n\n顾名思义，决策本质上是一棵由不同类型节点组成的树：根节点、中间节点和叶节点。在每个根节点或中间节点处提出一个问题，根据答案选择一个分支。当到达所有叶节点时，过程结束。问题可以是“性别是男性还是女性”这种形式，也可以是“年龄是否大于\
  \ 50”这种形式。挑战在于选择合适的特征，如性别和年龄。训练数据用于训练模型，随后模型在测试数据上进行测试。\n\n人们可能会问，构建决策树的挑战是什么？主要挑战之一是确定何时停止分裂树。过去几十年来，开发了多种算法，以不同的方式构建树。在本书的第\
  \ III 部分中，我们将考虑一种这样的决策树并探讨隐私方面的问题。更多详情请参见 [HAN2000]。\n\n## 3.2.7 多类问题\n\n\n\n###\
  \ 大多数分类技术解决二分类问题\n\n大多数分类技术解决二分类问题。通过累积二分类器来推广解决多分类问题。这种推广有两种基本方案，即一对一和一对多。为避免冗余，我们将仅针对\
  \ SVM 展示这种推广。\n\n## 3.2.7.1 一对一\n\n一对一法为每一对类别创建一个分类器。每一对分类器（`i`、`j`）的训练集仅包含属于类别\
  \ `i` 或 `j` 的实例。新实例 `x` 属于大多数成对分类器一致认定的类别。预测决策采用多数投票技术。需计算 `n(n − 1)/2` 个分类器，其中\
  \ `n` 是数据集中的类别数量。显然，该方案的缺点是需要生成大量分类器，特别是当训练集中存在大量类别时。例如，若训练集有 1,000 个类别，则需要 499,500\
  \ 个分类器。另一方面，每个分类器的训练集规模较小，因为我们排除了所有不属于该类别对的实例。\n\n## 3.2.7.2 一对多\n\n一对多为数据集中的每个类别创建一个分类器。训练集经过预处理，使得对于分类器\
  \ `j`，属于类别 `j` 的实例被标记为类别 `(+1)`，不属于类别 `j` 的实例被标记为类别 `(−1)`。在一对多方案中，我们计算 `n` 个分类器，其中\
  \ `n` 是用户访问过的页面数量（在每个会话结束时）。通过将新实例 `x` 分配给其分类器输出最大正值（即最大边际）的类别来进行预测。\n\n与一对一方案相比，一对多方案的优势在于分类器数量较少。另一方面，一对多方案的训练集规模大于一对一，因为我们使用整个原始训练集来计算每个分类器。\n\
  \n## 3.3 数据挖掘、网络安全与隐私\n\n我们首先在第 3.3.1 节中讨论各种网络安全威胁，然后在第 3.3.2 节中讨论数据挖掘如何应用于处理这些威胁。最后，我们在第\
  \ 3.3.3 节中讨论针对数据挖掘技术的攻击。\n\n### 3.3.1 网络安全威胁\n\n本节讨论各种网络威胁，包括网络恐怖主义、内部威胁和外部攻击。图\
  \ 3.11 展示了各类网络安全威胁。\n\n![图 3.11 网络安全威胁。](img/fig3_11.jpg)\n\n图 3.11 网络安全威胁。\n\n\
  #### 3.3.1.1 网络恐怖主义、内部威胁与外部攻击\n\n网络恐怖主义是当今对我国构重大恐怖威胁之一。正如我们之前提到的，现在有海量信息以电子形式和网络形式存在。对我们的计算机、网络、数据库和互联网的攻击可能对企业造成毁灭性打击。我们几乎每天都能听到针对企业的网络攻击。据估计，网络恐怖主义可能给企业造成数十亿美元的损失。例如，考虑一个银行信息系统。如果恐怖分子攻击此类系统并挪用账户资金，银行可能损失数百万甚至数十亿美元。瘫痪计算机系统可能导致数百万小时的生产力损失，最终等同于金钱损失。即使是因意外导致的简单停电，也可能造成数小时的生产力损失，从而导致重大财务损失。因此，确保我们的信息系统安全至关重要。我们将讨论各类网络恐怖袭击。一种是传播恶意软件，可擦除文件和其他重要文档；另一种是入侵计算机网络。\n\
  \n请注意，威胁可能来自组织外部，也可能来自内部。外部攻击是指组织外部人员对计算机发起的攻击。我们听说过黑客闯入计算机系统并在组织内制造混乱。这些黑客用恶意软件感染计算机，不仅破坏系统中存储的文件，还通过网络传播到其他系统。但一个更隐蔽的问题是内部威胁。熟悉业务流程的组织内部人员设计方案破坏组织的信息资产。这些人可能是普通员工，甚至是计算机中心工作人员和承包商。问题相当严重，因为有人可能冒充他人造成各种破坏。系统中的恶意进程也可能伪装成良性进程并造成破坏。数据挖掘技术已被用于检测各类攻击。接下来我们将讨论其中一些攻击。\n\
  \n#### 3.3.1.2 恶意入侵\n\n恶意入侵可能包括入侵系统、网络、Web 客户端和服务器、数据库和应用程序。许多网络恐怖主义攻击源于恶意入侵。我们经常听说网络入侵。此处发生的情况是：入侵者试图窃听网络并获取传输中的信息。这些入侵者可能是人工入侵者或恶意进程。入侵也可能发生在文件上。例如，恶意个人可冒充员工登录公司计算机系统和网络并访问文件。入侵也可能发生在数据库上。冒充合法用户的入侵者可发起\
  \ SQL 查询等查询，访问其无权知晓的数据。\n\n从本质上讲，网络恐怖主义包括恶意入侵以及通过恶意入侵或其他方式进行的破坏。网络安全由旨在为网络攻击或网络恐怖主义提供解决方案的安全机制组成。当我们讨论恶意入侵或网络攻击时，考虑非网络世界的情况并将那些攻击转化为对计算机和网络的攻击会很有用。例如，小偷可通过暗门进入大楼。同样，计算机入侵者可通过恶意内部人员故意留下的、或因疏忽设计而未被关注的某种“暗门”进入计算机或网络。另一个例子是蒙面小偷进入银行窃取钱财。这里的类比是：冒充合法用户的入侵者控制信息资产。现实世界中的钱财在网络世界中转化为信息资产。近年来我们听到更多关于勒索软件的消息，黑客不仅窃取数据，还通过加密数据挟持数据勒索。随后数据所有者必须支付赎金（通常以比特币形式）才能取回数据。也就是说，现实世界与网络世界发生的事件有许多相似之处。\n\
  \n#### 3.3.1.3 信用卡欺诈与身份盗窃\n\n\n\n\n#### 3.3.1.4 对关键基础设施的攻击\n\n对关键基础设施的攻击可能会使一个国家及其经济瘫痪。基础设施攻击包括攻击电信线路、电网、燃气管道、水库、水和食物供应以及其他对国家运行至关重要的基本实体。对关键基础设施的攻击可能由恶意软件引起，也可能通过炸弹等物理手段实施。例如，攻击者可以攻击运行电信系统的软件，从而关闭所有电信线路。同样，运行电网的软件也可能遭到攻击。基础设施还可能受到飓风和地震等自然灾害的攻击。我们这里的主要关注点是通过恶意攻击对基础设施发起的攻击。虽然在开发此类攻击的解决方案方面已取得一些进展，但仍有大量工作有待完成。我们正在探索的方向之一是研究使用数据挖掘来检测此类基础设施攻击。\n\
  \n### 3.3.2 用于网络安全的数据挖掘\n\n数据挖掘正被应用于入侵和恶意软件检测及审计等问题。例如，异常检测技术可用于检测异常模式和行为。链接分析可用于将病毒追溯到肇事者。分类可用于将各种网络攻击分组，然后利用这些概要在攻击发生时进行检测。预测可用于根据通过电子邮件和电话交谈了解到的关于恐怖分子的信息，确定潜在的未来攻击。此外，对于某些威胁，非实时数据挖掘可能就足够了，而对于网络入侵等其他特定威胁，我们可能需要实时数据挖掘。许多研究人员正在研究将数据挖掘用于入侵检测\
  \ [AWAD2009]。虽然我们需要某种形式的实时数据挖掘，即结果必须实时生成，但我们也需要实时构建模型。例如，信用卡欺诈检测是一种实时处理形式。然而，在此处，模型通常是提前构建的。实时构建模型仍然是一个挑战。数据挖掘还可用于分析\
  \ Web 日志以及分析审计跟踪。基于数据挖掘工具的结果，可以确定是否发生了任何未经授权的入侵和/或是否提出了任何未经授权的查询 [MASU2011]。\n\n\
  数据挖掘在网络安全中的其他应用包括分析审计数据。可以建立一个包含审计数据的存储库或数据仓库，然后使用各种数据挖掘工具进行分析，以查看是否存在潜在异常。例如，可能出现这样一种情况：某个用户组在凌晨\
  \ 3 点到 5 点之间访问数据库。这可能是因为该组在上夜班，在这种情况下可能有合理的解释。然而，如果该组的工作时间是上午 9 点到下午 5 点，那么这可能就是一个异常事件。另一个例子是，某人总是在下午\
  \ 1 点到 2 点之间访问数据库，但在过去两天里，他/她却在凌晨 1 点到 2 点之间访问数据库。这随后可能会被标记为需要进一步调查的异常模式。\n\n内部威胁分析也是一个问题，无论是从国家安全还是网络安全的角度来看。也就是说，在公司工作的、被认为值得信任的人可能会从事间谍活动。同样，拥有合法计算机系统访问权限的人可能会插入恶意代码，这些代码表现得像良性代码，直到有机会窃取数据。抓捕此类恐怖分子比抓捕组织外部的恐怖分子要困难得多。可能需要监控公司所有个人（即使是系统管理员）的访问模式，以查看他们是否在从事网络恐怖主义活动。然而，这可能导致隐私侵犯。我们将数据挖掘应用于内部威胁检测以及其他一些网络安全威胁（如恶意可执行文件和新型恶意软件检测）的方法在\
  \ 第二部分 中进行了讨论。图 3.12 展示了我们将数据挖掘应用于网络安全的一些示例。有关高层概述的更多详细信息，请参阅 [THUR2004] 和 [THUR2005]。\n\
  \n![Figure 3.12 Data mining for cyber security.](img/fig3_12.jpg)\n\n图 3.12 用于网络安全的数据挖掘。\n\
  \n### 3.3.3 安全与隐私增强的数据挖掘\n\n本节首先讨论针对数据挖掘技术的攻击，然后概述隐私增强数据挖掘。第三部分 的章节重点关注安全与隐私增强的数据挖掘。图\
  \ 3.13 说明了这些概念。\n\n![Figure 3.13 Security and privacy-enhanced data science.](img/fig3_13.jpg)\n\
  \n图 3.13 安全与隐私增强的数据科学。\n\n入侵检测和垃圾邮件过滤等学习任务面临对抗性攻击。对抗性利用给现有的学习范式带来了额外的挑战。在当前数据和未来数据共享相同属性这一假设下（这对传统方法至关重要），无法实现学习模型对未来数据的泛化。在存在活跃对抗者的情况下，用于学习系统训练的数据不太可能代表该系统将要观察到的未来数据。这种差异不仅仅是简单的随机噪声，大多数学习算法在设计时已经考虑到了这一点。通常使这些学习算法失效的是有针对性的攻击，它们旨在通过伪装原本会被检测到的恶意数据，使学习系统失去功能。因此，学习算法必须自我调整以应对对抗性攻击。这被称为对抗性机器学习。在本书的\
  \ 第三部分 中，我们将讨论此类对抗性机器学习技术。\n\n\n\n\n\n## 3.4 总结与展望\n\n在本章中，我们首先概述了各种数据挖掘任务和技术，然后讨论了我们在工作中使用的一些技术。这些包括\
  \ `ANN`、`SVM`、决策树和 `ARM`。我们利用这些技术的组合，结合文献中的其他技术以及我们自己的技术，开发了用于超大型数据库的数据分析技术。其中一些技术在第二部分、第三部分和第四部分中得到应用（例如决策树、`SVM`）。\n\
  \n已经设计和开发了大量数据挖掘技术，其中许多正被用于商业工具中。其中几种技术是基本分类、聚类和关联规则挖掘技术的变体。今天面临的主要挑战之一是确定适用于各种应用的适当技术。我们仍然需要更多的基准测试和性能研究。此外，这些技术应减少误报和漏报。\n\
  \n接下来，我们提供了用于网络安全应用的数据挖掘概述。特别是，我们讨论了对计算机和网络的威胁，并描述了数据挖掘在检测此类威胁和攻击方面的应用。最后，我们讨论了针对数据挖掘的安全和隐私攻击，例如，我们讨论了针对数据挖掘技术的攻击以及我们如何调整它们以应对威胁。我们还讨论了因数据挖掘而产生的隐私问题，并讨论了诸如隐私感知数据挖掘之类的解决方案。\n\
  \n数据挖掘、网络安全和隐私是一个非常活跃的研究领域。包括链接分析和关联规则挖掘在内的各种数据挖掘技术正被探索用于检测异常模式。由于数据挖掘，用户现在可以进行各种关联分析。此外，在过去的十年里，正在收集海量数据。我们需要大数据分析技术来检测潜在的安全违规。这也引发了隐私担忧。更多关于隐私的细节可参阅\
  \ THUR2002。最近，对抗性数据挖掘/机器学习受到了极大关注。本书的大部分内容基于与网络安全和隐私相关的数据挖掘/机器学习。\n\n## 参考文献\n\n\
