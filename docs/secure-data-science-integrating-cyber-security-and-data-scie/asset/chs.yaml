  \ SIGMOD 会议, 1975.\n\n*   **[THUR1987]** B. M. Thuraisingham, *增强推理引擎的关系数据库管理系统中的安全检查*,\
  \ *计算机与安全*, 6(6), 479–492, 1987.\n\n*   **[THUR1990]** B. Thuraisingham, *推理问题的递归论特性*,\
  \ 计算机安全基础研讨会论文, Franconia, NH, 1990 年 6 月 (亦为 MITRE 报告, 1990 年 6 月).\n\n*   **[THUR1991]**\
  \ B. M. Thuraisingham, *利用概念结构处理推理问题*, DBSec, Shepherdstown, West Virginia, 333–362,\
  \ 1991.\n\n*   **[THUR1993]** B. Thuraisingham, W. Ford, M. Collins, J. O'Keeffe,\
  \ *数据库推理控制器的设计与实现*, *数据与知识工程*, 第 11 卷, 第 3 期, 1993, 271–297.\n\n*   **[THUR2014]**\
  \ B. Thuraisingham, T. Cadenhead, M. Kantarcioglu, V. Khadilkar, *面向语义 Web 的安全数据溯源与推理控制*,\
  \ CRC Press, Boca Raton, FL.\n\n*   **[THUR2020]** B. Thuraisingham, *网络安全遇上大知识:\
  \ 迈向安全的 HACE 定理*, IEEE ICKG, 2020.\n\n# 19 面向安全数据科学的新兴应用: 交通互联网系统\n\nDOI: [10.1201/9781003081845-30](https://doi.org/10.1201/9781003081845-30)\n\
  \n## 19.1 简介\n\n由于物联网 (IoT) 系统包含异构组件而不断发展，导致网络空间复杂性日益增加，例如不同类型的网络（如固定有线网络、移动蜂窝网络和移动自组网）、多样化的计算系统（如传感器、嵌入式系统、智能手机和智能设备）以及多层软件（如应用程序、中间件、操作系统\
  \ [OS] 和虚拟机监视器），由此产生了大量安全漏洞，因为任何设备、网络或生成的数据都可能遭到攻击。对手将越来越多地转向物联网网络空间，并将以所有基于网络的基础设施为目标，包括能源、交通、金融和医疗基础设施。因此，在如此复杂的环境中，为物联网提供管理网络冲突和防御网络攻击的网络安全解决方案是一项重大挑战。\n\
  \n\n\n\n\n### 物联网系统的网络防御框架\n\n迫切需要基于分层架构，为物联网系统设计和开发一套网络防御框架。其目标是：(i) 开发技术，以在面对攻击时保障网络（有线和无线）、硬件、软件、系统以及数据源的安全；(ii)\
  \ 开发用于检测攻击的分析解决方案。然而，开发这样一个集成框架，需要解决物联网系统的众多安全问题，包括访问控制、针对物联网系统网络攻击的对抗性机器学习，以及保护特殊类型的物联网系统，如交通系统互联网。\n\
  \n虽然安全性是物联网系统的一个主要方面，但隐私也应是一个关键考量。物联网系统收集海量数据，包括医疗数据、金融数据，以及驾驶模式等其他数据，并利用复杂的机器学习（ML）技术对这些数据进行分析以造福社会。然而，机器学习技术可能会发现极其敏感和私密的模式。因此，我们需要为物联网系统开发隐私感知机器学习技术。\n\
  \n在本章中，我们重点关注一类物联网系统，即交易系统互联网（注：原文为 Internet of Transactions Systems，结合上下文应为 Transportation\
  \ Systems，译为交通系统互联网）。近年来，自动驾驶汽车（AVs，Autonomous Vehicles）呈爆发式增长。企业正在大力投资自动驾驶汽车。自动驾驶汽车利用各类传感器（如摄像头、GPS、惯性测量单元\
  \ [IMU]、激光雷达 [LiDAR]、毫米波雷达 [RADAR] 和超声波传感器）来感知环境。尽管自动驾驶汽车蕴含巨大潜力，并能给交通行业带来改进，但安全和隐私问题提出了亟待解决的新挑战。传感器易受恶意篡改（例如，IMU\
  \ 易受声波干扰，GPS 接收机易受欺骗信号干扰）。车辆在根据传感器信号采取行动前，应验证其真实性 [QUIN2020]。\n\n由自动驾驶汽车集合组成的物联网系统被称为交通系统互联网。交通系统互联网会遭受攻击（像任何网络物理系统一样）。此类系统（包括自动驾驶汽车和未来的无人驾驶汽车）正在采集流式数据。随着交通系统电气化，它们需要节能。此类系统的安全威胁可能造成巨大损害，包括事故、人员伤亡，以及因能源管理系统遭受攻击而被困在荒凉的高速公路上。\n\
  \n数据科学/机器学习技术正被应用于分析自动驾驶汽车的数据，一大挑战是如何将流分析/学习技术应用于交通数据。例如，如何将机器学习技术应用于源自自动驾驶汽车的海量传感器数据？[MASO2011]。交通系统互联网也将高度依赖数据科学/人工智能（AI）/机器学习技术，用于各种应用，包括最优路线规划、无人驾驶等。对手将学习我们使用的机器学习模型，并试图破坏我们的模型\
  \ [ZHOU2012]。最后，虽然交通系统互联网收集了海量数据，但必须保护个人隐私。我们设想，大部分数据共享和分析将通过运行在云端并与交通系统互联网集成的服务来进行\
  \ [THUR2020]。\n\n本章探讨如何将人工智能、安全和云集成，以开发智能交通系统互联网。我们首先在第 19.2 节中讨论网络安全与 AI 的集成。第\
  \ 19.3 节讨论交通系统互联网的安全与隐私。在第 19.4 节中，我们讨论基于 AI 和云的交通系统互联网。第 19.5 节讨论总结和未来方向。图 19.1\
  \ 展示了本章讨论的概念。\n\n![Figure 19.1 Emerging applications for secure data science: Internet\
  \ of Transportation Systems.](img/fig19_1.jpg)\n\n图 19.1 面向安全数据科学的新兴应用：交通系统互联网。\n\
  \n## 19.2 网络安全与 AI 的集成\n\n第二部分和第三部分已阐述网络安全与 AI 集成的主题。在本节中，我们将回顾关键点。网络安全与 AI 的集成有三个方面。一是将\
  \ AI 应用于网络安全，二是将网络安全应用于 AI，三是检测由 AI 引起的隐私攻击。将 AI 应用于网络安全的研究始于 1990 年代中期。其思路是应用机器学习技术检测未经授权的入侵。2000\
  \ 年代，该研究扩展至恶意软件分析和内部威胁检测 [THUR2017]。海量攻击数据正在被收集。必须分析这些数据，以便检测恶意攻击。此外，我们还需要预测恶意软件可能如何变异，从而预防攻击\
  \ [HAML2009]。此外，还在分析流式数据以检测恶意内部人员。\n\n第二个领域是保障 AI 技术的安全。这一领域如今被称为对抗性机器学习，在过去十年中变得非常突出。我们生活的方方面面（从医疗到自动驾驶汽车）越来越依赖机器学习技术。这些机器学习技术可能遭受攻击，导致灾难性后果。因此，我们需要研究攻击类型并改进机器学习技术。例如，在我们的工作中，我们研究了支持向量机（SVM），并改进\
  \ SVM 技术以检测部分攻击。对手会了解我们的模型并调整其行为。我们的对抗性支持向量机技术能够学习对手的行为并自我调整，从而检测攻击。随着时间的推移，这演变成了对手与我们之间的博弈。\n\
  \n第三个方面是机器学习技术可能导致的隐私泄露。例如，现在可以整合海量数据并进行分析，获取个人的各种属性。这可能导致个人隐私受损。已经开发了许多隐私感知机器学习（数据挖掘）技术\
  \ [LIU2008]。挑战在于如何实施适当的策略，以便我们能够进行策略感知的数据收集、存储、集成、分析和共享 [THUR2018]。图 19.2 说明了网络安全与\
  \ AI 集成的各个方面。\n\n![Figure 19.2 Security for Internet of Transportation Systems.](img/fig19_2.jpg)\n\
  \n图 19.2 交通系统互联网的安全。\n\n## 19.3 交通系统互联网的安全与隐私\n\n针对交通系统互联网安全与隐私的一种方法，是利用基于物理的异常检测（PBAD）算法为地面和空中自动驾驶汽车构建参考监视器\
  \ [QUIN2020]。该算法包含三部分：(i) 离线构建自动驾驶汽车物理不变量的模型，(ii) 实现在线工具以监控预期行为与观测行为从而检测异常，(iii)\
  \ 如果执行过程存在显著残差差异，则发出警报。这些技术已同时应用于地面和空中自动驾驶汽车。稍后我们将提供更多步骤细节。\n\n\n\n\n\n(i) **离线预处理**：使用一种广为人知的航空器和地面车辆非线性模型来计算\
  \ AV 的不变量。航空器使用 `x`、`y` 和 `z` 轴上的加速度计、陀螺仪和磁力计传感器数据。地面车辆使用车辆位置和转向角。\n\n(ii) **在线阶段**：使用扩展卡尔曼滤波器\
  \ (EKF) 通过从噪声传感器输入中估计未知参数来预测 AV 的物理行为。该算法分为两个部分，在将估计值与传感器数据进行比较之前，分别对其进行预测和修正。\n\
  \n(iii) **异常检测**：随后使用 CUSUM（累积和控制图）算法来检测持续性攻击。如果残差差值大于预定义阈值，则触发警报。图 19.3 展示了我们的流程。\n\
  \n![图 19.3 隐私感知的基于策略的交通物联网系统。](img/fig19_3.jpg)\n\n图 19.3 隐私感知的基于策略的交通物联网系统。\n\n\
  除了单个车辆的安全性外，交通领域还可以从支持性基础设施中获益良多，该基础设施允许车辆、路灯柱上的运动传感器和监控摄像头（仅举几例）之间进行通信，以帮助识别交通拥堵、重新规划车辆路线并提高车辆安全性。从用户的角度来看，此类系统所需的所有信息都可能导致车辆识别和驾驶模式等私人信息泄露，从而引发隐私担忧。随着物联网技术在日常活动中变得更加突出，立法者、工程师和科学家应将隐私担忧牢记在心。这将有助于改善公众认知，减少消费者的顾虑，并提高新技术的采用率\
  \ [THUR2019]。基于策略的隐私感知交通系统如图 19.3 所示。\n\n在处理安全攻击和隐私感知的基于策略的交通系统对于提供安全且私密的物联网系统至关重要的同时，我们不能忽视数据机密性。例如，在第\
  \ 5 章[](#ch05.xhtml#chapter5)中，我们讨论了用于数据机密性的各种访问控制策略类型。我们将在此重新审视它们，以适用于交通物联网系统。存在多种数据机密性技术和机制，最著名的是访问控制系统和加密。这两种技术已被广泛研究。然而，对于大数据的访问控制系统总体而言，特别是对于交通物联网系统，我们需要以下方面的方法：\n\
  \n*   **合并大量访问控制策略**：在许多情况下，大数据涉及整合来自多个来源的数据（监控摄像头、来自其他车辆的传感器数据）；这些数据可能关联有其自身的访问控制策略（称为“粘性策略”），并且即使数据与其他数据集成，也必须强制执行这些策略。因此，需要集成策略并解决冲突。\n\
  \n*   **自动管理大数据的授权，特别是授予权限**：如果需要细粒度访问控制，则在大数据集上进行手动管理是不可行的。我们需要能够自动授予授权的技术，这可能基于用户数字身份、配置文件和上下文，以及数据内容和元数据。\n\
  \n*   **在异构多媒体数据上强制执行访问控制策略**：基于内容的访问控制是一种重要的访问控制类型，根据数据内容授予或拒绝授权。在处理对安全至关重要的视频监控应用时，基于内容的访问控制至关重要。就隐私而言，此类视频必须受到保护。支持基于内容的访问控制需要理解受保护数据的内容，而在处理多媒体大数据源时，这极具挑战性。\n\
  \n*   **在大数据存储中强制执行访问控制策略**：一些最新的大数据系统允许用户使用 `Java` 等编程语言提交任意作业。例如，在 `Hadoop` 中，用户可以提交用\
  \ `Java` 编写的任意 MapReduce 作业。这给为不同用户高效强制执行细粒度访问控制带来了重大挑战。尽管已有一些现有工作 [KHAN2014, ULUS2014]\
  \ 尝试将访问控制策略注入提交的作业中，但仍需进一步研究如何在新开发的大数据存储中高效强制执行此类策略。\n\n*   **自动设计、演进和管理访问控制策略**：在处理数据源、用户、应用程序以及数据使用持续变化的动态环境时，自动设计和演进策略的能力至关重要，这能确保数据随时可用，同时保证数据机密性。用于管理策略的环境和工具也至关重要。\n\
  \n## 19.4 面向云端交通物联网系统的 AI 与安全\n\n我们设想，从 AV 收集的大量数据将被发送到云端进行进一步处理，包括执行分析。也就是说，包括攻击数据在内的海量数据可在云端使用各种\
  \ ML 技术进行分析。因此，云端本身必须是安全的，特别是当它必须执行安全关键操作时。\n\n我们设计并开发了一种用于安全云端的分层架构 [HAML2010]。最底层是\
  \ VNM（虚拟网络监视器）。然后是 VMM 层（虚拟机监视器），执行虚拟机内省。再上层是基于 `Hadoop/MapReduce` 等技术的云存储层。数据可能被加密，这意味着查询和分析将不得不在加密数据上进行。在此层之上是用于查询云数据的查询层。最后是应用层，在我们的示例中，应用程序是支持交通物联网系统的那些。图\
  \ 19.4 展示了我们的方法。\n\n![图 19.4 用于安全交通物联网系统的云。](img/fig19_4.jpg)\n\n图 19.4 用于安全交通物联网系统的云。\n\
  \n数据科学/ML 技术正被应用于分析数据，一项挑战是将流分析/学习技术应用于交通数据。主要问题是理解复杂交通数据的本质，并调整流分析技术，将其应用于正在收集的海量异构传感器数据上。此类数据通常以数据流形式产生。因此，需要研究许多基于流的机器学习技术\
  \ [LI2019]。此外，还需研究为物联网系统开发的基于深度学习的技术 [QIU2020]。\n\n交通物联网系统将严重依赖数据科学/AI/ML 技术用于各种应用，包括最优路线规划、无人驾驶等。对手将学习车辆使用的模型，以及了解用于训练模型的数据。对手将试图破坏车辆的学习过程。因此，学习算法必须适应以挫败对手的行为。最终，这变成了对手与车辆机器学习算法之间的博弈\
  \ [ZHOU2012]。\n\n\n\n\n## 19.5 总结与展望\n\n物联网在交通运输行业具有重大影响。自动驾驶汽车旨在改善日常活动，例如包裹投递、交通优化和货物运输。自动驾驶汽车不仅限于地面车辆，还包括具有广泛应用的航空和海上车辆。由自动驾驶汽车集合组成的物联网系统被称为交通运输物联网系统。虽然此类物联网系统管理大量传感器数据，但其中大部分数据也被发送到云端进行离线分析。尽管自动驾驶汽车及其对交通运输行业可能带来的改进潜力巨大，但安全和隐私问题提出了新的挑战，随着我们不断前进，这些挑战需要得到解决。此外，人工智能技术对于此类物联网系统能够智能地管理自动驾驶汽车也变得至关重要。本章讨论了用于基于云的交通运输物联网系统的人工智能与安全。\n\
  \n本章讨论了关于自动驾驶汽车的交通运输物联网系统的特征，以及此类系统的安全和隐私问题。接下来，我们讨论如何整合人工智能与安全。基于云的交通运输物联网系统也进行了讨论。最后，我们讨论了如何将人工智能、安全与云与交通运输物联网系统相整合。\n\
  \n我们仅触及了保障交通运输物联网系统安全的表面。我们必须了解各种类型的攻击轨迹/手法，并开发机器学习技术来检测和预防攻击。我们还必须研究如何应对针对机器学习技术的攻击，而这些技术是开发智能交通运输物联网系统所必需的。最后，我们需要确定要发送到安全云端以进行分析的数据类型。\n\
