  \ 大数据分析\n\n前几节讨论了用于恶意软件检测的数据挖掘技术。特别是我们讨论了针对恶意可执行文件的数据挖掘。在现实世界中，待分析的网络安全数据量可能是巨大的。也就是说，待分析的数据量可能达到\
  \ EB 级别。因此，传统的数据挖掘技术可能无法扩展以处理超大数据集。我们需要大数据分析技术来处理如此海量的数据。\n\n图 6.7 展示了大数据分析技术在网络安全应用中的使用。我们本质上描述了一种三层架构。具体而言，我们使用大数据管理系统（如\
  \ `HBase`、`Cassandra` 和 `CouchDB`）作为中间层，以存储海量数据。这些数据管理系统托管在大数据基础设施上，如 `Hadoop`、`MapReduce`\
  \ 和 `Spark`。分析技术（如 `SVM`（支持向量机）和神经网络）在大数据基础设施上实现。这样，分析过程就可以扩展以处理超大数据集。\n\n![图 6.7\
  \ 用于恶意软件检测的大数据分析。](img/fig6_7.jpg)\n\n图 6.7 用于恶意软件检测的大数据分析。\n\n在第 8 章 中，我们描述了一种专门用于自动生成签名以防御某些恶意软件攻击的数据挖掘技术。由于恶意软件检测工具需要近实时的性能，我们在云端开发了我们的数据挖掘工具。也就是说，主要目标是展示如何利用云等大数据技术来提升恶意软件检测技术的性能和可扩展性。\n\
  \n## 6.6 总结与展望\n\n在本工作中，我们设计并开发了一种基于数据挖掘的恶意代码检测模型。我们的技术从可执行文件中提取三个不同层级的特征，即二进制层级、汇编层级和\
  \ `API` 函数调用层级。这些特征随后经历特征选择阶段，以减少特征集中的噪声和冗余，并生成一个规模可控的特征集。然后使用这些特征集为每个训练数据构建特征向量。接着使用训练数据训练一个分类模型。该分类模型对未来实例（即可执行文件）进行分类，以检测它们是良性还是恶意。\n\
  \n我们展示了如何高效地从训练数据中提取特征。我们还展示了如何利用磁盘访问实现可扩展性。我们解释了特征提取和特征选择的算法，并分析了它们的时间复杂度。最后，我们展示了如何组合特征集并构建特征向量。我们应用了不同的机器学习技术，如\
  \ `SVM`、`J48` 和 `AdaBoost` 来构建分类模型。在下一章中，我们将展示我们的方法在不同数据集上与几种基线技术相比的表现。\n\n我们还描述了在两个不同数据集上对我们的方法和其他几种基线技术进行的实验。我们比较了每种基线技术的分类准确率和运行时间。我们证明了我们的方法在分类准确率上优于其他基线技术，且没有主要的性能下降。我们还分析了不同分类技术和不同数据集上的结果变化，并解释了这些变化。总体而言，我们的方法优于其他基线，不仅因为更高的分类准确率，还因为其可扩展性和效率。\n\
  \n\n\n\n## 未来工作与参考文献\n\n### 未来工作\n\n未来，我们希望在多个方向上拓展我们的工作。首先，我们希望提取并利用行为特征进行恶意软件检测。这是因为针对二进制模式的混淆可能通过多态性和变形性实现，但恶意软件很难混淆其行为模式。我们希望向特征集中添加更多特征，例如可执行文件的行为特征。这是因为二进制特征容易受到多态和变形恶意软件的混淆攻击，但混淆行为模式将会很困难。\n\
  \n我们还希望通过应用云计算/大数据框架进行特征提取和选择任务，来增强我们方法的可扩展性。这样特征提取和分类将更具可扩展性。云计算为获取更多 CPU 算力和大得多的磁盘空间提供了一种廉价替代方案，可用于大幅加快特征提取和选择过程。此外，我们也有兴趣从可执行文件中提取行为特征，以克服多态恶意软件进行二进制混淆所带来的问题。\n\
