  \n第四部分包含五章，描述了访问控制和数据科学。特别是，我们讨论了我们开发的一些实验系统。\n\n\n\n在基于访问控制的安全云查询处理（第 15 章）中，我们讨论了大数据系统的访问控制模型。未来的方向包括改进查询优化，以及利用\
  \ Hadoop/MapReduce 框架来提升性能。我们还需要研究改进的索引技术以增强性能。在以云为中心的可靠信息共享（第 16 章）中，我们讨论了如何在云中安全地共享信息。我们需要通过实现更复杂的策略以及实现分布式版本\
  \ CAISS++ 来增强系统。我们还需要对策略的执行进行形式化分析。\n\n在社交媒体系统的访问控制（第 17 章）中，我们讨论了使用语义 Web 技术表示的社交媒体系统的访问控制模型。我们打算通过支持灵活的管理员策略来扩展这项工作。在我们的框架中，根据所支持的本体，社交网络的资源可能与不同的用户相关联。为了实施访问控制，框架必须决定如何将指定的访问控制策略组合在一起。因此，框架的一个首要重要扩展将是支持多种策略集成策略。在大数据系统的推理控制（第\
  \ 18 章）中，我们讨论了大数据系统推理控制器的设计与实现。我们的下一步是将推理控制器适配为基于 RDF 表示的知识图谱和社交图谱。我们还在研究利用机器学习技术的更强大的推理策略。\n\
  \n最后，在第 19 章中，我们讨论了基于云的交通互联网系统的 AI 与安全。特别是，我们讨论了交通互联网系统关于自动驾驶汽车（AV）的特性，并描述了此类系统的安全与隐私问题。我们还展示了如何将\
  \ AI 与安全集成到此类系统中。也讨论了基于云的交通互联网系统。最后，我们讨论了如何将 AI、安全与云与交通互联网系统集成。我们仅触及了保障交通互联网系统安全的表面。我们必须了解各种类型的轨迹/攻击路径，并开发机器学习技术来检测和防范攻击。我们还必须研究如何应对针对开发智能交通互联网系统所需的机器学习技术的攻击。最后，我们需要确定要发送哪些类型的数据到安全云以进行分析。\n\
  \n# 20 总结与展望\n\nDOI: [10.1201/9781003081845-32](https://doi.org/10.1201/9781003081845-32)\n\
  \n## 20.1 本章简介\n\n本章标志着《安全数据科学：融合网络安全与数据科学》的结束。我们讨论了多个方面，包括用于网络安全问题的数据科学（如恶意软件分析和内部威胁检测）、用于应对网络攻击的对抗性机器学习、隐私感知数据科学，以及数据科学系统的访问控制。实验系统是我们在德克萨斯大学达拉斯分校开发的系统，包括基于访问控制的安全云查询处理、基于云的可靠信息共享系统、被视为数据科学应用的安全且私密的社交媒体应用，以及大数据系统的推理控制。我们还讨论了安全数据科学的几个发展方向。\n\
  \n本章的组织结构如下。在第 20.2 节中，我们给出了本书的总结。该总结取自各章的总结与展望部分。在第 20.3 节中，我们讨论安全数据科学的发展方向。在第\
  \ 20.4 节中，我们提出关于后续研究方向的建议。\n\n## 20.2 本书总结\n\n我们总结了各章的内容，主要取自各章的总结与展望部分。第 1 章对本书进行了介绍。我们首先讨论了大数据、数据科学和机器学习，以及安全数据科学的支撑技术，包括安全数据系统、用于网络安全应用的数据挖掘、云和语义\
  \ Web 以及大数据安全与隐私。随后，我们讨论了本书涵盖的各个主题，包括用于网络安全的数据科学、数据科学的安全与隐私，以及数据科学的访问控制。我们的框架是一个四层框架，每一层在本书的一个部分中进行阐述。该框架如图\
  \ 1.8 所示。我们在图 20.1 中复现了该框架。\n\n![图 20.1 BDMA 和 BDSP 的分层框架。](img/fig20_1.jpg)\n\n\
  图 20.1 BDMA 和 BDSP 的分层框架。\n\n本书分为四个部分。第 I 部分描述了支撑技术，包含第 2 章、第 3 章、第 4 章和第 5 章。第\
  \ 2 章概述了数据库系统中的自主安全策略。我们从讨论访问控制策略开始，包括授权策略和基于角色的访问控制。然后，我们讨论了管理策略。我们简要讨论了标识和认证。我们还讨论了审计问题以及用于安全的视图。接下来，我们讨论了策略实施。策略实施的主要问题是策略规范、策略实现和策略可视化。我们讨论了用于指定策略的\
  \ SQL 扩展，并提供了查询修改的概述。在第 3 章中，我们首先概述了各种数据挖掘任务和技术，然后讨论了用于安全应用的数据挖掘。第 4 章介绍了云和语义 Web\
  \ 技术的概念。我们首先讨论了云计算的概念，包括虚拟化的各个方面。我们还讨论了云的各种服务模型和部署模型，并简要概述了存储管理和数据管理等云功能。接下来，我们讨论了语义\
  \ Web 技术，包括 XML、RDF、本体和 OWL。随后讨论了语义 Web 的安全问题。最后，我们讨论了基于语义 Web 技术的云计算框架。第 5 章讨论了大数据安全与隐私的挑战与方向。\n\
  \n\n\n\n\n### 第二部分\n\n第二部分包含四个第 6 章、第 7 章、第 8 章和第 9 章，重点关注网络安全的数据科学。在第 6 章中，我们讨论了基于数据挖掘的恶意代码检测模型的设计与实现。我们的技术从可执行文件中提取三个不同层级的特征，即二进制层级、汇编层级和\
  \ API 函数调用层级。这些特征随后经历特征选择阶段，以减少特征集中的噪声和冗余，并生成一个规模可控的特征集。然后利用这些特征集为每个训练数据构建特征向量。接着，使用训练数据训练一个分类模型。该分类模型对未来实例（即可执行文件）进行分类，以检测它们是良性还是恶意。我们展示了如何高效地从训练数据中提取特征。我们还展示了如何通过磁盘访问实现可扩展性。我们解释了特征提取和特征选择的算法。最后，我们展示了如何组合特征集并构建特征向量。我们应用了不同的机器学习技术，如\
  \ SVM、J48 和 Adaboost 来构建分类模型。\n\n### 第三部分\n\n第三部分包含五个第 10 章、第 11 章、第 12 章、第 13 章和第\
  \ 14 章，讨论了安全和隐私感知的数据科学。在第 10 章中，我们讨论了对抗性支持向量机学习。我们考虑了两种攻击模型：一种是允许任意数据损坏的自由攻击模型，另一种是预期合理对手在惩罚机制下会设计的更现实攻击的受限攻击模型。随后，我们针对这两种攻击模型开发了最优的\
  \ SVM 学习策略。学习算法在假设对手通过修改数据来最大化损失的前提下，最小化合页损失。实验在人工和真实数据集上均已进行。在第 11 章中，我们讨论了对抗性相关向量机学习。具体而言，我们提出了一种稀疏贝叶斯对抗学习模型。该算法通过最小化训练集中正实例的对数似然，设置单独的核参数来对特征空间中的对抗攻击进行建模。在这种设置下训练的学习模型对包括极具侵略性的攻击在内的各类攻击更具鲁棒性。在第\
  \ 12 章中，我们讨论了隐私感知数据挖掘。具体而言，我们描述了一种修改后的 C4.5 决策树分类器，该分类器适用于隐私保护数据挖掘。该分类器基于扰动数据集构建，且该模型可用于以高准确率对原始数据进行分类。在多方参与全局数据挖掘而不泄露隐私的场景下，与基于密码学的方法相比，我们的算法降低了通信和计算成本。我们的算法基于扰动方案，但跳过了重构原始数据分布的步骤。我们的技术在减少计算时间的同时增强了隐私保护。在第\
  \ 13 章中，我们讨论了一个面向量化自我应用的隐私感知策略数据管理框架。具体而言，我们描述了一个通用框架，用户不仅可以指定其数据如何被管理，还可以限制来自其连接设备的数据收集，以及对该数据的存储和分析。更确切地说，我们讨论了使用数据收集策略来管控来自各种设备的数据传输，并结合策略确保数据一旦传输完毕，即以安全和隐私保护的方式进行存储和共享。换句话说，我们讨论了一个用于安全数据收集、存储和管理的框架，其逻辑基础支持策略属性的验证。在第\
  \ 14 章中，我们提出了一个能够处理海量 RDF 数据的框架，可用于表示社交网络等大数据系统。由于我们的框架基于 Hadoop（一个分布式且高度容错的系统），它自动继承了这两个特性。该框架具有高度可扩展性。我们还在查询处理框架之上基于访问控制开发了安全模型。\n\
  \n### 第四部分\n\n第四部分包含五个第 15 章、第 16 章、第 17 章、第 18 章和第 19 章，讨论了访问控制和数据科学，包括我们开发的经验性系统。在第\
  \ 15 章中，我们描述了一个基于云的可靠信息共享系统 CAISS 的设计与实现。CAISS 利用了我们开发的若干技术以及开源工具。我们还描述了一个理想的基于云的可靠信息共享系统\
  \ CAISS++的设计。我们讨论了 CAISS、CAISS+和一个演示系统的一系列实现。在第 16 章中，我们讨论了基于语义 Web 工具的可扩展细粒度在线社交网络访问控制模型的设计与实现。此外，我们提出了使用\
  \ OWL 和 SWRL 建模的授权、管理和过滤策略。支持该模型的框架架构也已呈现。我们还描述了基于语义 Web 工具的可扩展细粒度在线社交网络访问控制模型的实现。具体而言，我们讨论了使用\
  \ OWL 和 SWRL 建模的授权、管理和过滤策略的实现。在第 17 章中，我们描述了数据溯源推理控制器的实现。推理控制器采用模块化方法构建，因此非常灵活，大多数模块均可由另一个应用模块扩展或替换。例如，应用用户可以替换处理高层策略解析为低层策略对象的策略解析器模块。这种替换将允许应用用户继续使用其业务策略，而独立于我们的溯源推理控制器软件实现。本质上，我们遵循了一种“即插即用”的方法来实现推理控制器。我们在实现中尽可能多地使用了开源产品。我们为溯源数据推理控制实现的技术可应用于各类大数据系统。\n\
  \n本书的附录为数据管理提供了宏观图景，并讨论了我们所撰写的所有书籍如何融为一体。\n\n## 20.3 安全数据科学的发展方向\n\n安全数据科学有许多发展方向。我们将针对本书涉及的主题（第二部分、第三部分和第四部分）讨论其中一些。图\
  \ 20.2 展示了这些方向和挑战。\n\n![图 20.2 安全数据科学的方向与挑战。](img/fig20_2.jpg)\n\n图 20.2 安全数据科学的方向与挑战。\n\
  \n\n\n\n\n### 未来工作方向\n\n#### 数据科学在网络安全中的应用\n\n##### 恶意可执行文件检测（第 6 章）\n\n我们希望在多个方向上扩展这项工作。首先，我们希望提取并利用行为特征进行恶意软件检测。这是因为针对二进制模式的混淆可通过多态性和变形性实现，但恶意软件很难混淆其行为模式。我们希望向特征集中添加更多特征，例如可执行文件的行为特征。这是因为二进制特征容易受到多态和变形恶意软件的混淆影响，但行为模式难以混淆。我们还希望通过应用云计算/大数据框架进行特征提取和选择任务，来增强我们方法的可扩展性。这样特征提取和分类将更具可扩展性。云计算为更多\
  \ CPU 算力和更大磁盘空间提供了廉价替代方案，可用于更快的特征提取和选择过程。此外，我们还有兴趣从可执行文件中提取行为特征，以克服多态恶意软件的二进制混淆问题。\n\
  \n##### 新颖类检测的流数据分析（第 7 章）\n\n我们希望在未来从多个方向扩展我们的方法。首先，我们希望将开发的技术扩展到实时数据流分类。为实现这一目标，我们必须优化训练过程，包括决策边界的创建。此外，异常值检测和新颖类检测也应变得更高效。我们相信云计算框架可在提高这些过程的效率方面发挥重要作用。其次，我们希望解决实时数据流分类问题。由于数据标记和训练分类模型涉及的开销，实时数据流挖掘更具挑战性。第三，我们希望利用云计算框架进行数据流挖掘。云计算框架将成为实时流挖掘所需的更高效、更强大计算能力的廉价替代方案。由于数据的流式特性，我们预期将收集和分析海量数据。因此，除了云计算框架，我们预期将使用大数据技术来存储和管理数据。这样可以分析更大规模的真实数据流，并将我们的方法扩展到解决数据流中的实时分类和新颖类检测问题。\n\
  \n##### 基于云的恶意软件检测（第 8 章）\n\n我们提出两个方向。首先，我们当前的特征选择过程仅基于信息增益作为选择标准，关注最佳的 `S` 个特征。通过改进特征选择的监督降维技术研究，分类准确率有望进一步提高。其次，通过利用云计算架构中可用的额外并行性，可改进我们方法的运行时性能。例如，集成的分类器可作为\
  \ MapReduce 框架中的 Mapper 并行运行，Reducer 聚合结果进行投票。同样，下一个集成的候选分类器可并行训练和评估。\n\n##### 内部威胁检测的流分析（第\
  \ 9 章）\n\n我们计划在以下方向扩展工作。对于无监督学习，我们假设没有可用的真实标签。事实上，随着时间的推移，可能会以反馈的形式获得一些真实标签。一旦以无监督方式创建了模型，我们希望根据用户反馈更新模型。目前，模型一旦创建就保持不变。当真实标签随时间变得可用时，我们将立即根据这些反馈完善所有模型。此外，当我们更新模型时，可能会发生串通攻击。我们的目标是识别串通攻击。为此，在模型的受害者选择过程中，我们将考虑模型随时间的一致性。如果模型的一致性长期持续并存活，我们将从那里选择受害者。\n\
  \n#### 安全与隐私感知的数据科学\n\n##### 对抗支持向量机学习（第 10 章）\n\n这项工作的未来方向之一是将成本敏感度量添加到学习模型中。另一个方向是将单一学习模型扩展为集成模型，其中每个基学习器处理不同的攻击集合。我们还希望纳入对其他对抗机器学习技术以及不同类型攻击的研究。此外，我们希望考虑额外的博弈论模型。\n\
  \n##### 对抗相关向量机学习（第 11 章）\n\n开放性问题是发现一种高效的方法，以同时更新核函数和学习参数。该解决方案将有助于在样本空间中找到针对最坏情况攻击的最优学习模型。与对抗支持向量机学习类似，另一个方向是考虑不同类型的攻击。\n\
  \n##### 隐私保护数据挖掘（第 12 章）\n\n未来的一个方向是构建可用于分类扰动数据集的分类器。正如我们之前提到的，利用概率作为加权，结合随机噪声数据\
  \ `R` 的更好边界，是一个需要进一步研究的方法。此外，随着新型机器学习技术的开发（如深度学习方法），我们需要探索这些方法的隐私保护机器学习。\n\n#####\
  \ 隐私感知的基于策略的数据管理框架（第 13 章）\n\n下一步是进行框架的详细设计和实现。我们还必须设计形式化框架，以便无论实现何种解决方案，都能指定和推理策略。我们还需要考虑用户的行为方面。我们需要为互联网交通系统等应用调整框架。最后，在第\
  \ 14 章中，我们讨论了数据科学在 COVID-19 相关应用中的应用，并讨论了可能发生的隐私违规行为。我们还讨论了美国公民自由联盟等组织提出的各种框架。\n\
  \n#### 访问控制与数据科学\n\n第 4 部分包含五章，描述了访问控制和数据科学。特别是，我们讨论了开发的一些实验系统。\n\n##### 基于访问控制的安全云查询处理（第\
  \ 15 章）\n\n我们讨论了大数据系统的访问控制模型。未来的方向包括改进查询优化，以及更好地利用 Hadoop/MapReduce 框架以提高性能。我们还需要研究改进的索引技术。\n\
  \n##### 以云为中心的可靠信息共享（第 16 章）\n\n我们讨论了如何在云中安全地共享信息。我们需要通过实现更复杂的策略以及实现分布式版本 `CAISS++`\
  \ 来增强系统。我们还需要对策略的执行进行形式化分析。\n\n\n\n\n\n## 20.4 我们何去何从？\n\n本书聚焦于安全数据科学。它探讨了面向网络安全的数据科学，以及安全和隐私增强的数据科学。我们还讨论了在安全数据科学领域开发的一些实验系统。如果我们要在这一极其重要的领域取得进展，就需要继续研究和开发工作。问题是我们该何去何从？\n\
  \n首先，有意在该领域工作的人员必须具备良好的支撑技术知识，包括云计算、数据管理与分析、语义网和安全。例如，理解构成数据分析的技术及其如何扩展以处理海量数据非常重要。\n\
  \n其次，由于该领域正在迅速扩展且有许多新发展，读者必须跟上这些发展，包括阅读有关商业产品和原型以及新兴系统的资料。最后，我们鼓励读者试用这些产品，并开发分析和安全工具。这是熟悉特定领域的最佳方式。也就是说，动手解决实际问题并提供解决方案，以获得更好的理解。开发人员应熟悉\
  \ `Hadoop`、`MapReduce`、`HBase`、`Storm` 和 `Spark` 等技术，以及包括各类网络攻击和隐私考量在内的安全技术。云计算将继续对处理海量数据以及包括社交媒体数据系统在内的许多大数据系统的处理产生重大影响，因此云安全将是一个重要方面。最后，数据科学是一个广泛的术语，包含数据挖掘、数据管理、统计学，也包括机器学习中的学习技术。因此，我们需要纳入深度学习等一些新兴技术，并将其与网络安全相结合。本书讨论的技术有许多应用，涉及医疗保健、流行病学、金融、零售和营销等领域。\n\
  \n我们需要联邦和地方政府资助机构提供研发支持。美国国家科学基金会、国家安全局、美国陆军、海军、空军、国防高级研究计划局、情报高级研究计划活动局和国土安全部等机构正在为安全和机器学习研究提供资金。我们还需要商业公司投入研发资金，以便在工业研究方面取得进展，并能将研究成果转化为商业产品。我们还需要与国际研究界合作，解决问题并推动标准制定，这些标准不仅关乎国家利益，也关乎国际利益。总之，我们需要公共/私营/学术界的合作伙伴关系，在安全数据科学这一极其重要的领域开发突破性技术。\n\
  \n# 附录：数据管理系统——发展与趋势\n\n## A.1 简介\n\n本附录的主要目的是为我们编写的数据管理、数据挖掘和数据安全系列丛书设定背景。我们的系列丛书始于\
  \ 1997 年的《数据管理系统演化与互操作》[THUR1997]。后续书籍均从此第一本书演变而来。本附录旨在提供数据管理系统的概览，并展示该领域多年来是如何演变的：从数据到信息，再到知识，现在则是大数据。然后我们将讨论我们编写的书籍之间的关系。\n\
  \n正如我们系列丛书所述，信息系统技术的发展导致各个业务领域的许多应用实现了计算机化。数据已成为许多组织的关键资源，因此，高效访问数据、共享数据、从数据中提取信息以及利用信息，已成为迫切需求。因此，人们做出了多方面的努力，以整合分散在多个站点的各种数据源。这些数据源可能是由数据库管理系统管理的数据库，也可能只是文件。为了提供多数据源和系统之间的互操作性，正在开发各种工具。这些工具使用户能够以高效透明的方式访问其他系统。\n\
  \n我们将数据管理系统定义为管理数据、从数据中提取有意义信息并利用所提取信息的系统。因此，数据管理系统包括数据库系统、数据仓库和数据挖掘系统。数据可以是结构化数据，如关系数据库中的数据；也可以是非结构化数据，如文本、语音、图像和视频。过去曾有大量讨论以区分数据、信息和知识。我们不试图澄清这些术语。就我们的目的而言，数据可以只是比特和字节，也可以向用户传达某些有意义的信息。然而，我们将区分数据库系统和数据库管理系统。数据库管理系统是管理包含持久数据的数据库的组件。数据库系统由数据库和数据库管理系统两部分组成。\n\
  \n\n\n\n\n### 附录 A：数据管理系统\n\n数据管理系统演进与互操作的一个关键组成部分是异构数据库系统的互操作性。关于数据库系统间互操作性的研究工作自\
  \ 20 世纪 70 年代末以来就已有报道。然而，直到最近我们才看到异构数据库系统在商业开发方面的进展。主要数据库系统供应商现在正在提供其产品与其他系统之间的互操作性。此外，许多数据库系统供应商正朝着一种称为**客户端-服务器架构**的架构迁移，这种架构促进了分布式数据管理能力。除了不同数据库系统和客户端-服务器环境之间的互操作性工作外，研究工作还致力于处理自治和联邦环境。\n\
  \n值得注意的是，自 1997 年我们出版第一本书以来的 24 年里，技术已经发生了演变。随着万维网的出现，数据的重要性开始被认识到。在过去的 24 年里，越来越大量的数据被收集、存储、处理和分析。虽然当时的挑战是管理\
  \ PB 级数据库，这被称为“大规模数据问题”，但现在已经演变为 ZB 级甚至 EB 级数据库，这被称为“大数据问题”。此外，虽然机器学习技术过去用于处理所谓的“玩具问题”，但现在用于处理“现实世界问题”。这是由于硬件的巨大进步、对数据理解的深入以及更复杂的学习技术，特别是在所谓的“深度学习”领域。因此，只要组织（商业、学术、政府）收集和分析数据，大数据分析就会长期存在。这也意味着我们必须确保在数据生命周期的所有阶段都强制执行安全和隐私策略。我们在本书中解决了其中一些挑战。\n\
  \n本附录的组织结构如下。由于数据库系统是数据管理系统的关键组成部分，我们首先提供数据库系统发展的概述。这些发展在 A.2 节中讨论。然后我们在 A.3 节中提供数据管理系统的愿景。我们的数据管理系统框架在\
  \ A.4 节中讨论。请注意，数据挖掘、数据仓库以及 Web 数据管理是该框架的组成部分。基于我们框架并通过特定实例化构建信息系统的内容在 A.5 节中讨论。应注意，A.2\
  \ 节至 A.5 节摘自我们的第一本书，并在我们随后的每本书中复制。我们为 CRC Press 撰写的各文本之间的关系在 A.6 节中讨论。A.7 节总结了本附录。\n\
  \n## A.2 数据库系统的发展\n\n图 A.1 概述了数据库系统技术的发展。虽然 20 世纪 60 年代的早期工作集中在基于网状和层次数据模型开发产品，但数据库系统的大部分发展发生在\
  \ Codd 发表描述关系模型的开创性论文[CODD1970]之后（另见[DATE1990]）。20 世纪 70 年代初开展了关系数据库系统的研究和开发工作，并在整个\
  \ 70 年代开发了多个原型。值得注意的工作包括 IBM（国际商业机器公司）的 `System R` 和加州大学伯克利分校的 `INGRES`。20 世纪 80\
  \ 年代，许多关系数据库系统产品投入市场（其中著名的有 Oracle 公司、Sybase 公司、Informix 公司、INGRES 公司、IBM、数字设备公司和惠普公司的产品）。20\
  \ 世纪 90 年代，其他供应商的产品也相继出现（例如微软公司）。事实上，迄今为止已有大量关系数据库系统产品上市。然而，Codd 指出，许多作为关系系统销售的系统并非真正的关系系统（参见例如\
  \ DATE1990 中的讨论）。随后，他讨论了一个系统要被认定为关系数据库系统必须满足的各种标准。虽然早期工作关注数据模型、范式理论、查询处理和优化策略、查询语言、访问策略和索引等问题，但后来重点转向支持多用户环境。特别是开发了并发控制和恢复技术。也提供了对事务处理的支持。\n\
  \n![图 A.1 数据库系统技术的发展。](img/appendixa_1.jpg)\n\n图 A.1 数据库系统技术的发展。\n\n关系数据库系统和事务管理的研究在\
  \ 20 世纪 70 年代中期后继之以分布式数据库系统的研究。20 世纪 70 年代末也开始了多项分布式数据库系统原型开发工作。其中值得注意的包括 IBM 的\
  \ `System R*`、霍尼韦尔公司的 `DDTS`（分布式数据库测试平台系统）、CCA（美国计算机公司）的 `SDD-I` 和 `Multibase`，以及\
  \ SDC（系统开发公司）的 `Mermaid`。此外，许多这类系统（例如 `DDTS`、`Multibase`、`Mermaid`）在异构环境中运行。20 世纪\
  \ 90 年代初，几家数据库系统供应商（如 Oracle 公司、Sybase 公司、Informix 公司）为其系统提供了数据分发能力。大多数分布式关系数据库系统产品基于**客户端-服务器架构**。其理念是让供应商\
  \ A 的客户端与供应商 B 的服务器数据库系统通信。换句话说，**客户端-服务器计算范式**促进了异构计算环境。关系和非关系商业数据库系统之间的互操作性也是可能的。数据库系统社区也参与了标准化工作。标准化工作中值得注意的包括\
  \ ANSI/SPARC 三级模式架构、数据字典系统的 `IRDS`（信息资源字典系统）标准、关系查询语言 `SQL`（结构化查询语言）以及用于远程数据库访问的\
  \ `RDA`（远程数据库访问）协议。\n\n数据库技术的另一个重大发展是面向对象数据库管理系统的出现。20 世纪 80 年代中期开始了此类系统的主动开发工作，现在已有商业产品可用（其中著名的包括\
  \ Object Design 公司、Ontos 公司、Gemstone Systems 公司、Versant Object Technology 公司的产品）。人们认为，多媒体、办公信息系统、CAD/CAM、过程控制和软件工程等新一代应用有不同的需求。此类应用利用复杂的数据结构。同时也希望编程语言与数据模型之间有更紧密的集成。面向对象数据库系统满足了这些新一代应用的大部分需求[CATT1991]。\n\
  \n\n\n\n\n### 数据库系统发展概况\n\n根据 1990 年美国国家科学基金会（NSF）研讨会发布的 Lagunita 报告（参见 [SILB90]\
  \ 和 [KIM90]），关系数据库系统、事务处理以及分布式（关系）数据库系统被列为成熟技术。此外，厂商正在推销面向对象数据库系统，并演示不同数据库系统之间的互操作性。报告指出，随着应用日益复杂，需要更复杂的数据库系统。而且，由于许多组织现在使用数据库系统，在许多情况下类型各异，因此需要集成这些数据库系统。尽管相关工作已开始，商业产品也已上市，但仍有若干问题有待解决。因此，20\
  \ 世纪 90 年代初数据库系统研究者面临的挑战主要集中在两个领域：下一代数据库系统和异构数据库系统。\n\n### 下一代数据库系统\n\n下一代数据库系统包括面向对象数据库系统、函数式数据库系统、用于增强数据库系统功能性能的特殊并行架构、高性能数据库系统、实时数据库系统、科学数据库系统、时态数据库系统、处理不完整和不确定信息的数据库系统以及智能数据库系统（有时也称为逻辑或演绎数据库系统）。理想情况下，数据库系统应提供高性能事务处理支持、建模复杂应用、表示新型数据并进行智能推理。虽然\
  \ 20 世纪 80 年代末和 90 年代初取得了显著进展，但在开发出这样的数据库系统之前仍有大量工作要做。\n\n### 异构数据库系统\n\n过去十年间，异构数据库系统受到了相当大的关注\
  \ [MARC1990]。主要问题包括处理不同的数据模型、不同的查询处理策略、不同的事务处理算法和不同的查询语言。是否应为整个系统提供统一视图，还是各个系统的用户维护自己对整个系统的视图？这些问题尚未得到令人满意的解答。人们预想，异构数据库管理系统的完整解决方案还需一代人的时间。在研究致力于寻找此类解决方案的同时，也应开展工作以处理有限形式的异构性，以满足客户需求。另一种受到关注的数据库系统是联邦数据库系统。注意，有人将异构数据库系统和联邦数据库系统这两个术语交替使用。虽然异构数据库系统可以是联邦的一部分，但联邦也可以包含同构数据库系统。\n\
  \nWeb 用户的爆发式增长以及界面技术的发展，给数据管理研究者带来了更多挑战。NSF 于 1995 年赞助了第二次研讨会，确定了多项新兴技术，这些技术在我们步入\
  \ 21 世纪时显得至关重要 [WIDO1996]。这些技术包括数字图书馆、超大型数据库管理、数据管理问题、多媒体数据库、数据仓库、数据挖掘、协作计算环境的数据管理以及安全与隐私。20\
  \ 世纪 90 年代另一项重大发展是对象-关系系统的开发。此类系统结合了面向对象数据库系统和关系数据库系统的优势。此外，许多公司现在专注于将其数据管理产品与 Web\
  \ 技术集成。最后，许多组织越来越需要将部分遗留数据库和应用迁移到更新的架构和系统，如客户端-服务器架构和关系数据库系统。我们认为，数据管理系统的发展没有止境。随着新技术的开发，数据管理研究和开发将迎来新机遇。\n\
  \n数据管理技术的全貌如 图 A.2 所示。如图所示，传统技术包括数据库设计、事务处理和基准测试。然后是基于数据模型的数据库系统，如关系型和面向对象型。数据库系统可能依赖于其提供的特性，如安全性和实时性。这些数据库系统可能是关系型或面向对象型。还有基于多站点或多处理器的数据库系统，如分布式和异构数据库系统、并行系统以及正在迁移的系统。最后是新兴技术，如数据仓库与挖掘、协作和\
  \ Web。任何关于数据管理系统的综合性文本都应涵盖所有这些技术。我们选择了一些相关技术并将其置于一个框架中。该框架在 A.5 节 中描述。\n\n![图 A.2\
  \ 数据管理系统综合视图](img/appendixa_2.jpg)\n\n图 A.2 数据管理系统综合视图\n\n## A.3 现状、愿景与问题\n\n数据管理系统已取得显著进展。然而，正如\
  \ 图 A.3 所示，许多技术仍是独立的。例如，多媒体系统尚未与数据仓库和挖掘技术成功集成。最终目标是集成多种技术，使准确的数据和信息能在适当时刻产生，并及时分发给用户。我们对数据和信息管理的愿景如\
  \ 图 A.4 所示。\n\n![图 A.3 独立系统](img/appendixa_3.jpg)\n\n图 A.3 独立系统\n\n![图 A.4 愿景](img/appendixa_4.jpg)\n\
  \n图 A.4 愿景\n\n文献 [THUR1997] 讨论的工作解决了实现这一愿景所需的许多挑战。特别是讨论了异构数据库的集成以及用于互操作性的分布式对象技术的使用。虽然在互操作性的系统方面已取得很大进展，但语义问题仍是一大挑战。不同数据库具有不同的表示。此外，同一数据实体在不同站点可能有不同的解释。解决这些语义差异，并从异构且可能包含多媒体的数据源中提取有用信息，是主要挑战。\n\
  \n## A.4 数据管理系统框架\n\n对于可演化、可互操作的数据管理系统的成功开发，异构数据库系统集成是主要组成部分。然而，还有其他技术必须相互成功集成，以开发高效访问和共享数据以及从数据中提取信息的技术。为促进数据管理系统的开发，以满足医疗、金融、制造和军事等各个领域应用的需求，我们提出了一个框架，可视为数据管理系统的参考模型。必须集成该框架中的各个组件，以开发支持各种应用的数据管理系统。\n\
  \n\n\n\n\n### 数据管理系统框架\n\n图 A.5 展示了我们的框架，它可被视为数据管理系统的模型。该框架包含三个层。可以认为，属于特定层的组件技术（我们也将其称为组件）或多或少建立在下层提供的技术之上。\n\
  \n*   **第 I 层：数据库技术与分发层**。该层包含数据库系统和分布式数据库系统技术。\n*   **第 II 层：互操作性与迁移层**。该层包含异构数据库集成、客户端/服务器数据库和多媒体数据库系统等技术，用于处理异构数据类型和迁移遗留数据库。\n\
  *   **第 III 层：信息抽取与共享层**。该层主要包含数据管理系统支持的较新服务技术。这些包括数据仓库、数据挖掘 [THUR1998]、Web 数据库和面向协作应用的数据库支持。\n\
  \n数据管理系统可利用网络、分布式处理和大容量存储等底层技术。我们将这些技术归类为**支撑技术层**。该支撑层不属于数据管理系统框架。该支撑层还包含一些高层技术，如分布式对象管理和代理。\n\
  \n此外，图 A.5 中还展示了**应用技术层**。属于该层的系统（如协同计算系统和基于知识的系统）可利用数据管理系统。注意，应用技术层也在数据管理系统框架之外。\n\
  \n![Figure A.5 Data management systems framework.](img/appendixa_5.jpg)\n\nFigure\
  \ A.5 Data management systems framework.\n\n构成数据管理系统框架的技术可被视为数据管理领域的一些核心技术。然而，利用数据管理技术（如医疗、金融或军事等）的许多应用需要安全性、完整性、实时处理、容错和高性能计算等特性。我们在\
  \ 图 A.6 中对此进行了说明，该图给出了一个将数据管理技术与特性及应用相关联的三维视图。例如，可以为医疗应用开发安全的分布式数据库管理系统，或为金融应用开发容错的多媒体数据库管理系统。\n\
  \n![Figure A.6 A Three-dimensional view of data management.](img/appendixa_6.jpg)\n\
  \nFigure A.6 A Three-dimensional view of data management.\n\n整合属于各层的组件对于开发高效的数据管理系统至关重要。此外，数据管理技术必须与应用技术集成，才能开发出成功的信息系统。然而，目前这些各个组件之间的集成有限。我们的著作已经涵盖了与该框架各层相关的概念。\n\
  \n注意，安全性贯穿所有层。支撑层（如代理和分布式系统）需要安全性。框架中的所有层都需要安全性，包括数据库安全、分布式数据库安全、数据仓库安全、Web 数据库安全和协作数据管理安全。\n\
  \n## A.5 从框架构建信息系统\n\n图 A.5 展示了数据管理系统的框架。如该图所示，数据管理技术包括数据库系统、分布式数据库系统、异构数据库系统、遗留数据库迁移、多媒体数据库系统、数据仓库、数据挖掘、Web\
  \ 数据库和面向协作的数据库支持。此外，数据管理系统利用分布式处理和代理等支撑技术。同样，协同计算、可视化、专家系统和移动计算等应用技术利用数据管理系统。\n\n\
  我们许多人在许多场合都听说过“信息系统”这一术语。这些系统有时与数据管理系统混用。在我们的术语体系中，信息系统比数据管理系统广泛得多，但它们确实包含数据管理系统。事实上，信息系统框架不仅包含数据管理系统层，还包含支撑技术层和应用技术层。即，信息系统涵盖各类计算系统。它可被视为可用于各种应用的成品。即，硬件处于频谱的最低端，而应用处于最高端。\n\
  \n我们可以结合 图 A.5 的技术来构建信息系统。例如，在应用技术层面，可能需要协作和可视化技术，以便分析师协同执行某些任务。在数据管理层面，可能同时需要多媒体和分布式数据库技术。在支撑层面，可能需要大容量存储以及一些分布式处理能力。这种专用框架如\
  \ 图 A.7 所示。另一个例子是互操作性专用框架。可能需要一些可视化技术来显示来自异构数据库的集成信息。在数据管理层面，我们有异构数据库系统技术。在支撑技术层面，可使用分布式对象管理技术来封装异构数据库。这种专用框架如\
  \ 图 A.8 所示。\n\n![Figure A.7 Framework for multimedia data management for collaboration.](img/appendixa_7.jpg)\n\
  \nFigure A.7 Framework for multimedia data management for collaboration.\n\n![Figure\
  \ A.8 Framework for heterogeneous database interoperability.](img/appendixa_8.jpg)\n\
  \nFigure A.8 Framework for heterogeneous database interoperability.\n\n最后，让我们通过一个具体例子来说明上述概念。假设一组医生/外科医生想要一个系统，以便他们协作并就各种患者做出决策。这可能是一个医疗视频会议应用。即，在最高层，该应用是医疗应用，更具体地说是医疗视频会议应用。在应用技术层面，需要包括协作和电视会议在内的多种技术。这些应用技术将使用分布式数据库系统和多媒体数据库系统等数据管理技术。即，可能需要支持音频和视频等多媒体数据。数据管理技术反过来又依赖于分布式处理和网络等底层技术。我们在\
  \ 图 A.9 中对此进行了说明。\n\n![Figure A.9 Specific example.](img/appendixa_9.jpg)\n\nFigure\
  \ A.9 Specific example.\n\n总之，信息系统不仅包含数据管理系统，还包含协同计算系统等应用层系统，以及分布式对象管理系统等支撑层系统。\n\
  \n\n\n\n\n## A.6 文本之间的关系\n\n我们出版了两套丛书。第一套主要面向技术管理人员，而第二套面向研究人员和开发人员。第一套丛书包括以下书籍：\n\
  \n*   *Data Management Systems: Evolution and Interoperation* [THUR1997]\n*   *Data\
  \ Mining: Technologies, Techniques, Tools and Trends* [THUR1998]\n*   *Web Data\
  \ Management and Electronic Commerce* [THUR2000]\n*   *Managing and Mining Multimedia\
  \ Databases for the Electronic Enterprise* [THUR2001]\n*   *XML, Databases and The\
  \ Semantic Web* [THUR2002]\n*   *Web Data Mining and Applications in Business Intelligence\
  \ and Counter-terrorism* [THUR2003]\n*   *Database and Applications Security: Integrating\
  \ Data Management and Information Security* [THUR2005]\n*   *Building Trustworthy\
  \ Semantic Web* [THUR2007]\n*   *Secure Semantic Service-Oriented Systems* [THUR2010]\n\
  \n这些丛书中的最后一本，题为 *Developing and Securing the Cloud* [THUR2014]，是从我们之前的著作 *Secure\
  \ Semantic Service-Oriented Systems* 演变而来的。所有这些书籍都源于我们在本附录中阐述的框架，并涵盖了框架的不同部分。这些文本之间的联系如\
  \ 图 A.12 所示。\n\n![图 A.12 文本之间的关系——系列 I。](img/appendixa_12.jpg)\n\n图 A.12 文本之间的关系——系列\
  \ I。\n\n我们在第二套丛书中出版了六本书。第一本题为 *Design and Implementation of Data Mining Tools* [AWAD2009]，第二本题为\
  \ *Data Mining Tools for Malware Detection* [MASU2011]。我们的著作 *Secure Data Provenance\
  \ and Inference Control with Semantic Web* [THUR2015] 是该系列的第三本。我们的著作 *Analyzing\
  \ and Securing Social Networks* 是该系列的第四本 [THUR2016]。我们之前的著作 *Big Data Analytics\
  \ with Applications in Insider Threat Detection* 是该系列的第五本 [THUR2017]。我们当前的著作 *Secure\
  \ Data Science: Integrating Cyber Security and Data Science* 是该系列的第六本 [THUR2021]。这些书籍之间以及与我们之前著作的关系如\
  \ 图 A.13 所示。\n\n![图 A.13 文本之间的关系——系列 II。](img/appendixa_13.jpg)\n\n图 A.13 文本之间的关系——系列\
  \ II。\n\n## A.7 总结与展望\n\n在本附录中，我们提供了数据管理的概览。我们首先讨论了数据管理的发展，然后提出了数据管理的愿景。接着，我们阐述了一个数据管理框架。该框架由三层组成：数据库系统层、互操作层和信息抽取层。最后，我们展示了如何利用框架中的技术构建信息系统。\n\
  \n我们认为，数据管理是许多信息技术的基础，包括数据挖掘、多媒体信息处理、互操作性、协作与知识管理，以及数据科学——后者集成了数据管理、数据挖掘、机器学习和统计方法来处理海量异构数据。本附录着重论述数据管理。安全性对所有数据管理技术至关重要，我们依赖这些技术用于社交媒体和内部威胁检测等应用。如果说\
  \ 20 世纪后期是关于计算机革命，那么 21 世纪前期则是关于数据革命。\n\n## 参考文献\n\n*   [AWAD2009] M. Awad, L. Khan,\
