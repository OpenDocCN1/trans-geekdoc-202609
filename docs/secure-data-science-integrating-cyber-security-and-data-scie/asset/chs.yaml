  \ Media, Inc., 2015.\n\n# 5 大数据分析、安全与隐私\n\nDOI: [10.1201/9781003081845-7](https://doi.org/10.1201/9781003081845-7)\n\
  \n## 5.1 简介\n\n\n\n\n### 大数据安全与隐私中的问题\n\n虽然第 2 章、第 3 章和第 4 章讨论了一些用于整合数据科学与网络安全的基础技术，但本章描述了构成本书基础的大数据安全与隐私（BDSP）挑战。特别是，我们总结了由美国国家科学基金会资助的大数据安全与隐私研讨会的讨论内容，该研讨会于\
  \ 2014 年 9 月 16 日至 17 日在德克萨斯州达拉斯举行。我们的目标是建立一个 BDSP 社区，以探索具有挑战性的研究问题。我们还在华盛顿特区举行的国家隐私研究战略会议上展示了研讨会成果，以确定这些主题在研究和教育方面的方向。\n\
  \n最近，已经举办了一些关于 BDSP 的研讨会和专题讨论会。例如包括 ACM CCS 大数据安全研讨会、ACM SACMAT 以及 IEEE 大数据会议专题讨论会。这些研讨会和专题讨论会受到了不同研究社区的影响。例如，ACM\
  \ CCS 研讨会系列侧重于面向安全应用的大数据，而 IEEE 大数据会议则侧重于云安全问题。此外，这些研讨会和专题讨论会主要只解决围绕 BDSP 的有限技术问题。例如，ACM\
  \ CCS 研讨会似乎并未涉及涉及法规的隐私问题，或由数据分析导致的安全违规。\n\n为了解决上述局限性，我们于 2014 年 9 月 16 日至 17 日在德克萨斯州达拉斯组织了一场关于\
  \ BDSP 的研讨会，由美国国家科学基金会（NSF）资助 [NSF]。该研讨会的参与者由高性能计算、系统、数据管理与分析、网络安全、网络科学、医疗保健和社会科学等领域的跨学科研究人员组成，他们齐聚一堂，共同确定了\
  \ BDSP 的战略方向。NSF 在网络安全和大数据方面都进行了大量投资。因此，这两个领域共同合作以确定大数据安全的方向至关重要。我们根据研讨会结果向国家隐私研究战略\
  \ [NPRS] 提交了报告。我们还在 NITRD（网络与信息技术研究与开发）隐私研讨会 [NITRD] 上进行了汇报。本文档是描述 BDSP 问题、研讨会汇报及研讨会讨论的研讨会报告。我们希望这一努力有助于建立\
  \ BDSP 社区。\n\n本章的组织结构如下。第 5.2 节描述了围绕 BDSP 的问题。第 5.3 节讨论了研究挑战。图 5.1 展示了本章讨论的主题。\n\
  \n![图 5.1 BDSP 中的研究问题。](img/fig5_1.jpg)\n\n图 5.1 BDSP 中的研究问题。\n\n## 5.2 大数据安全与隐私中的问题\n\
  \n### 5.2.1 研讨会背景\n\n本节描述了提交给研讨会参与者以激发讨论的 BDSP 问题。这些问题既包括大数据的安全与隐私，也包括用于网络安全的大数据管理与分析。虽然大数据植根于许多技术，但数据库管理是其核心。因此，在本节中，我们将讨论数据管理是如何演变的，然后重点关注\
  \ BDSP 问题。\n\n在过去的四十年里，数据库系统技术取得了长足进步，从基于网络模型和层次模型的遗留系统发展到关系数据库和对象数据库系统。现在可以通过 Web\
  \ 访问数据库系统，数据管理服务已作为 Web 服务实现。由于基于 Web 的服务、非结构化数据管理、社交媒体和移动计算的爆发式增长，待处理的数据量在短短二十年内就从\
  \ TB 级增加到了 PB 级和 ZB 级。如此大量的复杂数据被称为*大数据*。大数据不仅必须得到高效管理，还必须经过分析以提取有用的信息，从而改善业务并造福社会。这被称为大数据分析。\n\
  \n大量数据的存储、管理和分析也会导致安全和隐私违规。出于各种原因（包括法规遵从性），数据通常必须保留。保留的数据可能包含敏感信息，从而侵犯用户隐私。此外，操作此类大数据（例如组合不同类型的数据集）可能导致安全和隐私违规。例如，虽然原始数据移除了个人身份信息，但衍生数据可能包含私密和敏感信息。例如，关于一个人的原始数据可能与该人的地址相结合，这可能足以识别出该人。\n\
  \n不同的社区都在应对大数据挑战。例如，系统社区正在开发大数据海量存储技术。网络社区正在开发管理超大规模网络数据的解决方案。数据社区正在开发高效管理和分析大规模数据集的解决方案。大数据研发正在学术界、工业界和政府研究实验室中进行。然而，对于大数据的安全和隐私考虑关注甚少。安全横跨系统、数据和网络等多个领域。我们需要多个社区共同合作，开发\
  \ BDSP 解决方案。\n\n本节描述了 BDSP 中的一些问题。第 5.2.2 节提供了大数据管理与分析的概述。第 5.2.3 节给出了研讨会上讨论的安全和隐私问题。我们关于建立社区的目标在第\
  \ 5.1 节中讨论。\n\n### 5.2.2 大数据管理与分析\n\n大数据管理与分析研究正在沿三个方向进行。它们如下：\n\n1.  构建用于大数据存储的基础设施和高性能计算技术；\n\
  2.  数据管理技术，如整合多数据源（包括大数据和小数据）以及大数据的索引和查询；以及\n3.  操作和分析大数据以提取信息的数据分析技术。\n\n我们将简要回顾各领域取得的进展。在构建基础设施方面，正在开发\
  \ `Hadoop`、`MapReduce` 和 `Storm` 等技术，用于在云中管理大量数据。此外，主存数据管理技术已取得进步，可在主存中管理数 TB 的数据。而且，`Hive`、`Cassandra`\
  \ 等系统以及 `NoSQL` 数据库已被开发用于管理 PB 级数据。\n\n在数据管理方面，传统的数据管理技术（如查询处理和优化策略）正被研究用于处理 PB\
  \ 级数据。此外，图数据管理技术正被开发用于超大规模网络数据的存储和管理。\n\n在数据分析方面，各种数据挖掘算法正在基于 `Hadoop` 和 `MapReduce`\
  \ 的基础设施上实现。此外，正在探索数据缩减技术，将海量数据缩减为可管理的块，同时仍保持数据的语义。\n\n\n\n\n总之，大数据管理与分析技术包括扩展当前的数据管理与挖掘技术以处理海量数据，以及开发新方法，其中包括用于维护和分析大型网络数据的图数据管理与挖掘技术。\n\
  \n### 5.2.3 安全与隐私\n\n海量数据的收集、存储、处理和保留引发了严重的安全与隐私考量。各种法规正被提出以应对大数据，确保个人隐私不被侵犯。例如，即使从数据中移除了个人身份信息，当数据与其他数据结合时，个人仍可能被识别。这实质上是数据安全研究人员在过去四十年里一直在探索的推理与聚合问题。随着大数据的管理，由于现在存在来自不同来源且与各种个人相关的数据，这一问题变得更加严重。\n\
  \n在某些情况下，法规反而可能导致隐私泄露。例如，收集的数据（如电子邮件数据）必须保留一定时期（通常为五年）。只要保存此类数据，就存在隐私泄露的可能性。过多的法规也可能扼杀创新。例如，如果法规要求原始数据必须原样保存，不得处理，或不得基于数据构建模型，那么企业就无法通过创新方式分析数据以提升业务。这会导致创新受阻。\n\
  \n因此，在处理大数据时确保安全与隐私的主要挑战之一，是制定一种兼顾法规与分析的平衡方法。即：组织如何在开展有用分析的同时，仍能确保个人隐私？已开发出许多用于隐私保护数据挖掘、隐私保护数据集成和隐私保护信息检索的技术。挑战在于将这些技术扩展以处理海量的、通常是网络化的数据。\n\
  \n大数据管理与分析的另一个安全挑战是保障基础设施安全。已开发的许多技术，包括 `Hadoop`、`MapReduce`、`Hive`、`Cassandra`、`PigLatin`、`Mahout`\
  \ 和 `Storm`，都缺乏足够的安全防护。问题在于：如何在确保高性能计算的同时保障这些技术的安全？\n\n接下来，大数据管理策略（如访问方法、索引和查询处理）必须是安全的。那么问题来了：如何整合针对结构化、半结构化、非结构化和图数据等不同类型数据的策略？由于大数据可能源于众多数据源的结合，如何确保数据质量？\n\
  \n最后，必须在大数据安全的背景下审视安全、隐私、完整性、数据质量和信任策略的整个领域。什么是适合大数据的适当策略？如何在不影响性能的情况下处理这些策略？如何使这些策略保持一致且完整？\n\
  \n本节列出了关于大数据安全与隐私的一些挑战。我们需要一个全面的研究计划来识别挑战并为 `BDSP` 开发解决方案。安全不能是事后诸葛亮。也就是说，我们不能在开发每一种大数据技术时才将安全融入其中。我们需要一个全面的战略，以便在技术开发过程中融入安全。我们还需要在组织采用大数据技术之前，确定要强制执行的适当策略和法规类型。这意味着来自多个学科的研究人员必须通力合作，确定问题所在并探索解决方案。这些学科包括网络安全与隐私、高性能计算、数据管理与分析、网络科学和策略管理。\n\
  \n虽然上述讨论的挑战涉及保障大数据安全和确保个人隐私，但大数据管理与分析技术可用于解决安全问题。例如，组织可以将身份管理、邮件过滤和入侵检测等活动外包给云。这是因为此类应用正在收集海量数据，且这些数据必须被分析。云数据管理只是大数据管理的一个例子。问题在于：大数据管理与分析技术的发展如何用于解决安全问题？这些问题包括恶意软件检测、内部威胁检测、入侵检测和垃圾邮件过滤。另一个新兴挑战是：如果大数据分析技术遭受攻击会怎样？这也包括回答诸如：如果数据科学（也包括机器学习和人工智能）技术遭受攻击会怎样等问题。从医疗保健到交通、金融、零售等许多行业都依赖数据科学技术。如果数据科学技术遭受攻击，人们就无法依赖其结果。我们将在下一节讨论这些方面及更多内容。\n\
  \n## 5.3 大数据安全与隐私的研究挑战\n\n### 5.3.1 研讨会目标\n\n本节总结了 NSF 研讨会上关于 `BDSP` 的讨论。研讨会包括主题演讲、参会者汇报和工作组讨论。我们组织了两个工作组：一个由\
  \ Elisa Bertino 博士领导的 `BDSP` 工作组，另一个由 Murat Kantarcioglu 博士领导的大数据分析用于网络安全工作组。虽然研讨会的主要焦点是大数据管理与分析引发的隐私问题，但我们也就将大数据管理分析技术应用于网络安全进行了富有启发性的讨论。因此，本节提供了两个工作组讨论的总结。\n\
  \n本节的组织结构如下。第 5.3.2 节 讨论 `BDSP` 背后的理念。第 5.3.3 节 讨论隐私增强技术。第 5.3.4 节 讨论大数据隐私框架。第 5.3.5\
  \ 节 讨论大数据隐私的研究挑战与跨学科方法。第 5.3.6 节 概述用于网络安全的大数据管理与分析技术。第 5.3.7 节 讨论针对大数据/数据科学的攻击。\n\
  \n### 5.3.2 大数据安全与隐私理念\n\n正如 Bertino [BERT2014] 所讨论的，技术进步和新颖应用（如传感器、网络物理系统、智能移动设备、云系统、数据分析和社交网络）使得捕获并快速处理分析海量数据成为可能，从中可提取对安全相关任务至关重要的信息。在网络安全领域，此类任务包括用户认证、访问控制、异常检测、用户监控和内部威胁防护\
  \ [BERT2012]。通过分析和整合互联网和 Web 上收集的数据，可以识别个人之间的联系和关系，这反过来可能有助于国土保护。通过收集和挖掘用户出行和疾病爆发的相关数据，可以预测疾病在地理区域内的传播。这些只是几个例子；当然还有许多其他领域，数据技术可在增强安全方面发挥重要作用。\n\
  \n\n\n然而，数据在安全任务中的使用引发了重大的隐私担忧 [THUR2002]。收集的数据即使通过移除姓名或社会安全号码等标识符进行了匿名化处理，一旦与其他数据关联，也可能导致重新识别出与特定数据项相关的个人。此外，由于政府机构等组织通常需要在安全任务上协作，数据集会在不同组织间交换，导致这些数据集可被许多不同方获取。除了数据分析的用途外，认证和访问控制等安全任务可能需要用户的详细信息。一个例子是多因素认证，除密码或证书外，可能还需要用户生物特征。最近提出的持续认证技术将用户认证扩展为包含击键动力学等信息，以持续验证用户身份。另一个例子是基于位置的访问控制\
  \ [DAMI2007]，它要求用户向访问控制系统提供其当前位置信息。因此，访问控制系统可能会随时间收集详细的用户移动信息。如果这些信息被滥用或窃取，会导致隐私泄露。\n\
  \n人们似乎认为，为了实现安全，我们必须放弃隐私。然而，这未必是必然的。密码学的最新进展使得在加密数据上工作成为可能，例如对加密数据执行分析 [LIU2014]。然而，仍有大量工作要做，因为具体使用的数据隐私技术在很大程度上取决于数据的具体用途和当前的安全任务。此外，当前技术仍无法满足大数据集使用的效率要求。\n\
  \n在本文档中，我们首先讨论几种有助于协调安全与隐私的方法示例。然后讨论数据隐私框架的某些方面。最后，我们总结研究挑战，并概述解决这些挑战所需的多学科研究。\n\
  \n### 5.3.3 隐私增强技术示例\n\n过去 15 年中提出了许多隐私增强技术，范围从密码学技术（如隐蔽数据结构 [WANG2014]，可隐藏数据访问模式）到数据匿名化技术（通过转换数据使特定数据记录难以关联到特定个人）；更多参考文献请读者参考专业会议，如隐私增强技术研讨会系列（PETS）（[`petsymposium.org/2014/`](https://petsymposium.org)）和期刊，如《数据隐私汇刊》（[`www.tdp.cat/`](http://www.tdp.cat)）。然而，许多此类技术要么无法扩展到超大数据集，要么未专门解决协调安全与隐私的问题。同时，有少数方法专注于高效协调安全与隐私，我们将其讨论如下：\n\
  \n*   **隐私保护数据匹配**：记录匹配通常在不同数据源之间执行，旨在识别这些源共享的共同信息。一个例子是将航班乘客名单与可疑人员名单进行匹配。然而，来自不同数据源的记录匹配往往与数据源拥有的数据隐私要求相冲突。密码学方法（如安全集合求交协议）可能缓解此类担忧。然而，这些技术无法针对大数据集进行扩展。基于数据转换和映射到向量空间\
  \ [SCAN2007] 以及安全多方计算（SMC）与数据清洗方法（如差分隐私 [KUZU2013] 和 k-匿名性 [INAN2008, INAN2012]）相结合的最新方法已解决了可扩展性问题。然而，仍需努力开发适用于复杂匹配技术（例如基于语义匹配）的隐私保护技术。还需开发安全模型和定义，以支持结合不同安全技术（如\
  \ SMC（安全多方计算）和差分隐私）的解决方案的安全性分析和证明。\n\n*   **隐私保护协作数据挖掘**：传统数据挖掘通常在收集所有相关数据的大型中心化数据仓库上执行。然而，当数据属于不同组织时，中心化收集所有数据会带来多重隐私和机密性担忧。解决此类担忧的一种方法基于分布式协作方法，组织保留自己的数据集并协作学习全局数据挖掘结果，而无需透露各自数据集中的数据。该领域的基础性工作包括：(i)\
  \ 允许双方构建决策树，除最终决策树可推断的信息外，不了解对方数据集任何信息的技术 [LIND2000]；(ii) 用于关联规则、聚类、k-近邻分类的专用协作隐私保护技术\
  \ [VAID2006]。然而，这些技术仍然效率很低。应研究基于云计算和新密码学原语的新方法。\n\n*   **隐私保护生物特征认证**：传统生物特征认证方法要求记录注册用户的生物特征模板，并在认证时使用这些模板与用户提供的模板进行匹配。用户生物特征模板代表需要强力保护的敏感信息。在用户必须与许多不同服务提供商交互的分布式环境中，生物特征模板的保护变得更加复杂。一种最新方法通过结合感知哈希技术、分类技术和零知识证明（ZKPK）协议\
  \ [GUNA2014] 解决了此问题。在该方法下，用户的生物特征模板被处理以提取比特串，然后通过分类和其他转换进一步处理。生成的比特串随后与随机数一起用于生成加密承诺。该承诺代表一个不泄露原始输入生物特征任何信息的身份令牌。随后在\
  \ ZKPK 协议中使用该承诺来认证用户。该方法已针对手机安全使用进行了工程化实现。然而，为了降低误拒率，仍有大量工作要做。此外，还需基于最新同态加密技术研究不同的认证和识别技术方法。\n\
  \n### 5.3.4 数据隐私多目标优化框架\n\n\n\n尽管已有尝试提出能够应对多种不同场景的隐私解决方案/定义，但我们认为，不存在适用于所有情况的“放之四海而皆准”的数据隐私解决方案。相反，需要针对不同的应用领域量身定制多个维度，以实现切实可行的解决方案。\n\
  \n首先，不同领域需要不同的数据效用定义。例如，如果我们想要构建隐私保护分类模型，`0/1 loss` 可能是一个很好的效用度量。另一方面，对于隐私保护记录链接，`F1\
  \ score` 可能是更好的选择。\n\n其次，我们需要理解正确的隐私风险定义。例如，在数据共享场景中，给定特定背景知识下的重新识别概率，可被视为衡量隐私风险的正确指标。另一方面，`ε\
  \ = 1` 可能被视为差分隐私数据挖掘模型的适当风险。\n\n最后，必须考虑给定协议的计算、存储和通信成本。对于涉及密码学的隐私保护协议，这些成本可能尤为显著。\n\
  \n鉴于这三个维度，可以设想一个多目标框架，其中不同维度可被赋予不同的重视程度：\n\n*   **在风险和成本约束下最大化效用**：这适用于限制特定隐私风险至关重要的场景。\n\
  \n*   **在效用和成本约束下最小化隐私风险**：在某些场景中（例如医疗护理），可能不允许效用显著下降。在此设定下，协议的参数值（例如差分隐私中的 `ε`）的选择方式是：在满足效用约束的前提下，尽最大努力保障隐私。请注意，在某些场景中，可能不存在能够同时满足所有约束的参数设置。\n\
  \n*   **在效用和风险约束下最小化成本**：在某些情况下（例如密码学协议），您可能希望找到能够以最低成本满足所有效用和风险约束的协议参数设置。\n\n为了更好地说明这些维度，请考虑文献\
  \ `[INAN2012]` 中解决的隐私保护记录匹配问题。针对该问题的现有解决方案通常遵循两种方法：数据清洗技术和密码学技术。文献 `[INAN2012]`\
  \ 提出了一种结合这两种方法的混合技术。该方法使用户能够在隐私、准确性和成本之间进行权衡。这类似于本章讨论的多目标优化框架。这些多目标优化是通过在清洗后的数据上运行阻塞阶段来实现的，该阶段以隐私保护的方式过滤掉不满足匹配条件的记录对。通过披露更多信息（例如差分隐私数据统计），与密码学技术相比，所提出的方法产生的成本显著降低。另一方面，即使在隐私要求很高的情况下，与数据清洗技术相比，它产生的匹配结果也显著更准确。使用不同的隐私参数值可实现不同的成本、风险和效用结果。\n\
  \n为了实现数据隐私的多目标优化框架，我们认为需要更多研究来为不同的应用领域确定适当的效用、风险和成本定义。特别是定义正确且现实的隐私风险至关重要。从石油开采到航空旅行，许多人类行为都涉及风险与收益。在许多情况下，例如试图开发一款永不发生故障的飞机，规避所有风险要么成本过高，要么不可能实现。同样，我们认为为所有人规避所有隐私风险成本过高。此外，假设攻击者可能知晓一切过于悲观。因此，需要在现实攻击者场景下提出隐私风险定义。\n\
  \n### 5.3.5 多学科方法\n\n针对大数据安全与隐私问题的综合解决方案，需要应对许多研究挑战并采取多学科方法。我们概述如下重要方向：\n\n*   **数据机密性**：存在若干数据机密性技术和机制，最著名的是访问控制系统和加密技术。这两种技术均已被广泛研究。然而，对于大数据的访问控制系统，我们需要以下方面的方法：\n\
  \n    *   **合并大量访问控制策略**：在许多情况下，大数据意味着整合来自多个来源的数据；这些数据可能关联各自的访问控制策略（称为“粘性策略”），且即使数据与其他数据集成，这些策略也必须得到执行。因此，需要整合策略并解决冲突。\n\
  \n    *   **自动管理大数据的授权，特别是授予权限**：如果需要细粒度访问控制，在大型数据集上进行手动管理是不可行的。我们需要能够自动授予授权的技术，这可能基于用户数字身份、配置和上下文，以及数据内容和元数据。\n\
  \n    *   **在异构多媒体数据上执行访问控制策略**：基于内容的访问控制是一种重要的访问控制类型，根据数据内容授予或拒绝授权。在处理对安全至关重要的视频监控应用时，基于内容的访问控制至关重要。就隐私而言，此类视频必须受到保护。支持基于内容的访问控制需要理解受保护数据的内容，而在处理多媒体大数据源时，这极具挑战性。\n\
  \n    *   **在大数据存储中执行访问控制策略**：一些最新的大数据系统允许用户使用 `Java` 等编程语言提交任意作业。例如，在 `Hadoop`\
  \ 中，用户可以提交用 `Java` 编写的任意 `MapReduce` 作业。这给为不同用户高效执行细粒度访问控制带来了重大挑战。尽管已有一些现有工作 `KHAN2014,\
  \ ULUS2014` 尝试将访问控制策略注入提交的作业中，但仍需更多研究，探讨如何在新开发的大数据存储中高效执行此类策略。\n\n    *   **自动设计、演进和管理访问控制策略**：在数据源、用户、应用程序以及数据使用持续变化的动态环境中，自动设计和演进策略的能力至关重要，这能确保数据随时可用，同时保障数据机密性。用于管理策略的环境和工具也至关重要。\n\
  \n*   **隐私保护数据关联技术**：大数据产生的一个主要问题是，在关联多个（大）数据集时，可以提取出意想不到的信息。需要调查的相关问题和研究方向包括：\n\
  \n    *   **控制提取内容的技术，并检查提取的内容是否可以被使用和/或共享**。\n\n    *   **同时支持个人隐私和群体隐私**：在群体隐私的情况下，理解从数据中提取了什么很重要，因为这可能导致歧视。此外，在处理安全与隐私问题时，理解个人隐私与集体安全之间的权衡也很重要。\n\
  \n\n\n\n#### 高效且可扩展的隐私增强技术\n\n多年来已开发出多种此类技术，包括 `oblivious RAM`、`security multi-party\
  \ computation`、`multi-input encryption`、`homomorphic encryption`。然而，它们尚不适用于大规模数据集的实际应用。我们需要对这些技术进行工程化改造，例如利用\
  \ `parallelization` 来微调其实现，并可能将其与其他技术（如 `differential privacy`，正如 [SCAN2007] 中描述的记录链接协议所示）相结合。另一种可能的方法是先使用匿名化/清洗后的数据，然后根据具体情况获取特定的非匿名化数据。\n\
  \n#### 数据隐私政策的可用性\n\n政策必须让用户易于理解。我们需要面向普通用户的工具，并需要了解用户在隐私方面的期望。\n\n#### 数据服务变现的方法\n\
  \n组织不直接出售数据，而是可以基于这些数据集出售隐私保护的数据分析服务。待解决的问题是：如果隐私保护数据分析工具可用，数据周围的商业模式将如何变化？此外，如果数据被视为待售商品，是否存在关于数据买卖合同的法规？这些合同能否包含隐私条款，例如要求相关用户已被告知？\n\
  \n#### 数据发布\n\n鉴于隐私影响，或许我们应放弃发布数据的想法，转而要求数据使用者在受控环境（可能位于云中）中使用数据。这样更容易控制数据的合理使用。一个问题是大学中使用的研究数据及基于数据研究的可重复性。\n\
  \n#### 隐私对数据质量的影响\n\n近期研究表明，人们尤其是在社交网络中会撒谎，因为他们不确定隐私是否得到保护。这导致数据质量下降进而影响基于这些数据的决策和策略。\n\
  \n#### 风险模型\n\n可识别出大数据与风险的不同关系类型：\n(a) 大数据可能增加隐私风险；\n(b) 大数据可在许多领域降低风险（如国家安全）。\n\
  开发这两类风险的模型至关重要，以确定合适的权衡和隐私增强技术。\n\n### 数据所有权\n\n关于谁是一条数据的所有者，往往是个难题。或许最好用“利益相关者”概念取而代之。每个数据项可关联多个利益相关者。利益相关者概念与风险紧密相关。每个利益相关者会有不同（可能冲突）的目标，这可按多目标优化建模。某些情况下，利益相关者可能不知晓其他方的存在。例如，数据所涉及的用户（即数据的利益相关者）可能不知执法机构正在使用该数据。需探索技术方案以消除冲突。\n\
  \n### 人为因素\n\n所有针对隐私及兼顾安全的隐私解决方案，均需调查以确定人为参与度。例如，用户如何与数据交互，以及其在数据使用和/或保护方面的具体任务，以提升可用性。\n\
  \n### 数据生命周期框架\n\n大数据隐私的综合方法需基于系统的数据生命周期方法。需识别生命周期各阶段及其隐私需求和影响。相关阶段包括：\n\n#### 数据获取\n\
  \n我们需要机制和工具防止设备获取关于其他个体的数据（使用 Google Glass 等设备时相关）；例如，能否设计机制自动阻止设备在特定地点录制/获取数据（或通知用户周围有录制设备）。我们还需要技术，让每个被记录主体对数据用途有发言权。\n\
  \n#### 数据共享\n\n用户需被告知数据共享/传输给其他方的情况。\n\n---\n\n解决上述挑战需要跨学科研究，涉及计算机科学与工程、信息系统、统计学、风险模型、经济学、社会科学、政治学、人为因素及心理学等众多领域。我们认为，开发大数据时代隐私问题的有效解决方案，以及协调安全与隐私，需要所有这些视角。\n\
  \n### 5.3.6 大数据分析在网络安全中的应用\n\n为保护重要数字资产，组织正投资新型网络安全工具，这些工具需分析从日志文件到电子邮件附件的大数据，以预防、检测和恢复网络攻击\
  \ [KAR2014]。作为本研讨会的一部分，我们探讨了以下主题：\n\n#### 网络安全大数据管理分析 (BDMA) 有何不同？\n\n研讨会参与者指出，网络安全\
  \ BDMA 需应对自适应且恶意的对手，他们可能发起攻击以逃避检测（即数据投毒攻击、拒绝服务攻击、拒绝信息攻击等）。此外，网络安全 BDMA 需在高容量（如来自多个入侵检测系统和传感器的数据）和高噪声环境（即不断变化的正常系统使用数据与隐蔽的高级持续威胁相关数据混合）中运行。讨论得出的一个重要观点是：我们需要能整合来自主机、网络、社交网络、漏洞报告、移动设备和物联网传感器数据的\
  \ BDMA 工具来检测攻击。\n\n#### 网络安全的正确 BDMA 架构是什么？\n\n我们还讨论了是否需要不同类型的 BDMA 系统架构用于网络安全。基于讨论的用例，参与者认为现有\
  \ BDMA 系统架构可适配网络安全需求。指出的一个问题是：成功的网络安全 BDMA 系统必须支持实时数据分析。例如，一旦某种攻击类型已知，系统需更新以实时查找此类攻击，包括重新检查历史数据以查看先前是否发生过攻击。\n\
  \n#### 网络安全 BDMA 的数据共享\n\n讨论中迅速显现：网络安全数据需在组织内部及跨组织间共享。除了共享网络安全数据中显而易见的隐私、安全和激励问题，参与者认为我们需要通用语言和基础设施来捕获和共享此类数据。例如，我们需要表示某些底层系统信息（如内存、CPU\
  \ 状态等），以便将其映射到类似的网络安全事件。\n\n#### 用于预防网络攻击的 BDMA\n\n关于 BDMA 工具如何用于预防攻击，有大量讨论。涌现的一个想法是：能利用捕获的溯源信息轻松追踪敏感数据的\
  \ BDMA 系统，可能在过多敏感信息泄露前检测到攻击。基于此观察，构建溯源感知的 BDMA 系统将成为网络攻击预防的需求。此外，网络安全 BDMA 工具可潜在地挖掘有用的攻击者信息，如其动机、技术能力、作案手法等，以预防未来攻击。\n\
  \n\n\n\n\n#### 用于数字取证的 BDMA\n\nBDMA 技术可通过组合或关联不同的数据源用于数字取证。出现的主要挑战是确定用于数字取证的正确数据源。此外，以下问题的答案并非立竿见影：\n\
  \n*   捕获什么数据？\n*   过滤掉什么（大数据中的大噪音）？\n*   关联什么数据？\n*   存储什么数据以及存储多久？\n*   如何处理机器生成的内容和物联网？\n\
  \n#### 用于理解网络系统用户的 BDMA\n\n与会者认为，BDMA 可用于挖掘人类行为，以了解如何改进系统。例如，一个组织可能会向其用户发送钓鱼邮件，并对那些被此类钓鱼攻击欺骗的用户进行安全再培训。此外，BDMA\
  \ 技术可用于理解并为每个用户建立正常行为模型，以发现与常态的显著偏差。\n\n总体而言，在我们的研讨会讨论中，很明显上述所有主题都存在重大的研究挑战，需要更多的研究来解决它们。此外，无论我们是将\
  \ BDMA 用于网络安全还是其他应用（例如医疗保健、金融），设计可扩展的 BDMA 解决方案至关重要。这些包括并行 BDMA 技术以及在云平台上实现的 BDMA\
  \ 技术，如 `Hadoop/MapReduce`、`Storm` 和 `Spark`。此外，我们需要探索将 BDMA 系统（如 `HBase` 和 `CouchDB`）用于各种应用。\n\
  \n### 5.3.7 面向大数据分析的网络安全\n\n当我们使用数据科学和机器学习技术时面临的挑战之一是这些技术可能遭受攻击。对手通常会了解我们的模型和所用的数据，并试图投毒数据并破坏模型。我们必须比对手领先数步并调整我们的模型。这一领域被称为*对抗性机器学习*（或*对抗性数据挖掘*）。\n\
  \n诸如入侵检测和垃圾邮件过滤等学习任务面临对抗性攻击。对抗性利用给现有的学习范式带来了额外的挑战。在当前和未来数据共享相同属性这一假设下（这对传统方法至关重要），无法实现学习模型对未来数据的泛化。在存在活跃对手的情况下，用于学习系统训练的数据不太可能代表系统将要观察到的未来数据。这种差异不仅仅是大多数学习算法在设计时已考虑在内的简单随机噪声。通常使这些学习算法失效的是有针对性的攻击，旨在通过伪装原本会被检测到的恶意数据，使学习系统失灵。现有的学习算法无法轻易调整以应对这种攻击，因为在攻击会在多大程度上影响样本空间结构方面存在极大的不确定性。尽管在训练时给定了恶意数据的样本量和分布，我们仍需对恶意数据会变化多少做出合理的推测，因为复杂的攻击者会快速适应以逃避检测。需要将攻击模型（预测对手为突破系统会走多远）纳入学习算法，以构建稳健的决策边界。\n\
  \n## 5.4 总结与方向\n\n本章探讨了围绕 BDSP 的问题，以及将大数据管理和分析技术应用于网络安全的问题。随着海量数据被收集、存储、操作、合并、分析和销毁，安全和隐私担忧将剧增。我们需要开发技术，以解决数据生命周期全过程中的安全和隐私问题。然而，仅靠技术是不够的。我们不仅需要理解数据收集、使用和分析的社会影响，还需要为这些活动制定适当的法律和政策。我们的研讨会探讨了解决当今面临的主要挑战的初步方向。我们需要一种跨学科的方法，由技术专家、应用专家、社会科学家、政策分析师和律师共同合作，提出可行且切实可行的解决方案。\n\
  \n本章描述了大数据的安全和隐私问题，并讨论了将 BDMA 技术应用于网络安全所需调查的问题。我们还提供了研讨会演示和讨论的总结。我们于 2014 年 10 月\
  \ 16 日基于研讨会总结向国家隐私研究战略提交了报告。我们还参加了 2015 年 2 月 18 日至 20 日在华盛顿特区举行的国家隐私研究战略会议，并在该活动中展示了研讨会总结。我们的目标是建立一个\
  \ BDSP 社区。此外，美国国家标准与技术研究院 (NIST) 也制定了一份关于大数据安全和隐私的报告 [NIST1]。该报告由 NIST 的 BDSP 工作组发布，该工作组是\
  \ NIST [NIST2] 大数据工作组的一部分。此外，NIST 还在开发一个名为 NICE（国家网络安全教育框架）的网络安全教育框架。我们需要将 BDSP\
  \ 以及用于网络安全的 BDMA 主题纳入该框架。因此，不同机构继续合作，不仅为研究，也为 BDSP 教育以及将 BDMA 应用于网络安全的教育制定战略，这至关重要。\n\
