  \n\n\n\n\n# 16 基于访问控制的云端可信信息共享\n\nDOI: [10.1201/9781003081845-27](https://doi.org/10.1201/9781003081845-27)\n\
  \n## 16.1 简介\n\n云计算的出现以及向软件即服务（`SaaS`）范式的持续转变，使得云端作为服务的可信信息共享（`AIS`）需求日益增长。2011\
  \ 年 4 月，美国国家安全局（NSA）首席信息官（CIO）Lonny Anderson 在描述该机构专注于采用“以云为中心”的方法与其他机构共享信息时，表达了这一需求的紧迫性\
  \ [[NSA2011]](#ch16.xhtml#ref16_46)。同样，美国国防部（DoD）也一直在采纳云计算范式，以更高效、经济、灵活和可扩展的方式，实现其“提供信息力量，通过敏捷企业确保任务成功，并在信息环境中拥有机动自由”的愿景\
  \ [[DoD]](#ch16.xhtml#ref16_22)、[[DoD2007]](#ch16.xhtml#ref16_23)。此外，医疗和金融等大多数行业也迫切需要在云端安全且及时地共享信息。\n\
  \n云计算范式能够安全高效地共享大量数据。此外，`云计算`的出现以及向 `SaaS` 范式的持续转变，使得云端作为服务的 `AIS` 需求日益增长。为满足联盟组织以云为中心的\
  \ `AIS` 需求，迫切需要开发一个在云端运行的 `AIS` 框架。\n\n尽管近年来已开发出许多基于策略的信息共享 `AIS` 工具 [[AWAD2010]](#ch16.xhtml#ref16_5)、[[FINI2009]](#ch16.xhtml#ref16_25)、[[THUR2008]](#ch16.xhtml#ref16_57)、[[RAO2008]](#ch16.xhtml#ref16_48)（这些工具基于控制对数据的访问），但据我们所知，这些工具均不在云端和大数据环境中运行，因此无法提供支持大量用户（如涉及包含文本、图像和视频的海量数据的社交媒体用户）所需的可扩展性。我们开发的用于支持基于云的\
  \ `AIS` 的原型系统，应用了以云为中心的查询引擎（例如第 15 章讨论的 `SPARQL` 查询优化器 Chapter 15），利用基于令牌的策略引擎或强制执行用\
  \ `XACML` 表达的策略的引擎 [[THUR2010]](#ch16.xhtml#ref16_58)、[[THUR2011]](#ch16.xhtml#ref16_59)，在关系数据库和语义\
  \ Web 数据库中查询大量数据。虽然这比之前的工作有了显著改进（并让我们深入了解了基于云的解决方案的实现），但仍存在一些局限性。首先，基于 `XACML` 的策略规范表达能力不足，无法支持医疗和国防等\
  \ `AIS` 应用所需的许多复杂策略。其次，为满足关键任务的可扩展性和效率要求，策略引擎需要在云端运行。例如，虽然第 15 章 Chapter 15 讨论的策略引擎托管在云端，但它们并未充分利用云提供的所有特性。\n\
  \n\n\n\n### 系统设计与实现概述\n\n为了安全高效地共享大量数据，云端社交媒体的策略管理器与数据管理器必须实现无缝集成。因此，为满足以云为中心的 AIS\
  \ 需求，我们需要：(i) 一个驻留在云端的策略管理器，它使用语义丰富的语言来表达和强制执行信息共享策略；(ii) 一个驻留在云端的数据管理器，它能安全地存储和检索数据，并与策略管理器无缝集成。据我们了解，目前不存在这样的系统。因此，本项目为社交媒体用户设计并开发了基于云的\
  \ AIS 系统。我们的策略引擎和数据均使用语义 Web 技术表示，因此能够对社交媒体数据进行表示和推理。也就是说，我们开发了一个以云为中心的策略管理器，强制执行用\
  \ RDF 指定的策略；以及一个以云为中心的数据管理器，用于存储和管理数据（如社交图谱及其关联数据），这些数据也用 RDF 指定。该 RDF 数据管理器本质上是一个用于\
  \ SPARQL 的查询引擎，SPARQL 是语义 Web 社区广泛用于查询 RDF 数据的语言。此外，我们的策略管理器和数据管理器将实现无缝集成，因为它们都管理\
  \ RDF 数据。\n\n我们设计并开发了一系列处理海量数据的基于云的 AIS 系统。也就是说，我们本质上将大数据管理技术应用于 AIS。本章概述了我们的设计和实现验证工作。特别是，我们详细描述了语义云中\
  \ AIS 的设计与实现。即，我们利用语义 Web 技术提供基于云的语义 Web 服务，这些服务实现了信息共享。我们的框架采用三层架构，包括用户界面层、策略引擎层和数据连接层，后者集成了云中的多数据源。值得注意的是，要在云端存储关键数据，我们需要对数据进行加密，并在加密数据上执行信息共享操作。这对于公有云尤为重要。然而，我们之前的\
  \ AIS 工作并未对云中的数据进行加密。这将成为我们未来研究的一部分。\n\n本章的组织结构如下。第 16.2 节讨论整体系统设计。第 16.2.1 节讨论我们的设计理念。特别是，我们将讨论两个\
  \ AIS 系统的设计：CAISS（基于云的 AIS 系统）和 CAISS++（更高级的 CAISS）。第 16.3 节讨论实现细节。第 16.4 节讨论相关工作。第\
  \ 16.5 节总结本章。图 16.1 展示了本章内容。我们工作的详细信息也可参考文献 [THUR2012]。\n\n![图 16.1 大数据管理与云在可靠信息共享中的应用](img/fig16_1.jpg)\n\
  \n图 16.1 大数据管理与云在可靠信息共享中的应用\n\n## 16.2 系统设计\n\n### 16.2.1 设计理念\n\n我们的设计分两个阶段进行。第一阶段，我们设计并实现了一个以云为中心的可靠信息共享系统（CAISS）概念验证原型，该原型利用了我们自主设计的技术组件以及开源工具。CAISS\
  \ 由两个组件组成：一个以云为中心的策略管理器，强制执行用 RDF（资源描述框架）指定的策略；一个以云为中心的数据管理器，存储和管理同样用 RDF 指定的数据。该\
  \ RDF 数据管理器本质上是一个用于 SPARQL（SPARQL 协议和 RDF 查询语言）的查询引擎，SPARQL 是语义 Web 社区广泛用于查询 RDF\
  \ 数据的语言。RDF 是一种语义 Web 语言，在指定和推理策略方面比 XACML 具有更强的表达能力。此外，我们的策略管理器和数据管理器将实现无缝集成，因为它们都管理\
  \ RDF 数据。我们在第一阶段选择这种基于 RDF 的以云为中心的 AIS 方法，是因为它满足上一段所述的两个必要条件，而且我们已经开发了基于 RDF 的非云中心策略管理器\
  \ [CADE2011a] 和用于 AFOSR 的基于 RDF 的云中心数据管理器 [HUSA2011]。拥有构建有用的以云为中心的 AIS 系统所需的两个关键组件的部分功能，使我们能够构建一个有用的概念验证演示系统\
  \ CAISS。具体而言，我们正在增强基于 RDF 的策略引擎使其在云上运行，扩展云中心的 RDF 数据管理器以与策略管理器集成，并为 CAISS 构建一个集成框架。我们的目标是将\
  \ CAISS 扩展到社交媒体环境。\n\n虽然我们最初的 CAISS 设计和实现将是第一个支持以云为中心的 AIS 的系统，但它仅在单个受信任云上运行，因此不支持跨多云的信息共享。此外，虽然\
  \ CAISS 基于 RDF 的形式语义策略规范方法比基于 XACML 的方法具有显著更强的表达能力，但它不支持增强的内容机器可解释性，因为 RDF 没有提供足够丰富的词汇（例如，对类和属性的支持）。因此，第二阶段将开发一个功能完善且健壮的\
  \ AIS 系统 CAISS++，以解决这些不足。CAISS++ 的初步设计已完成，将在本章后面讨论。CAISS 是通向 CAISS++ 的重要垫脚石，因为 CAISS\
  \ 可作为基准框架，从存储模型效率和基于 OWL 的策略表达能力等多个性能维度与 CAISS++ 进行比较。此外，由于 CAISS 和 CAISS++ 共享相同的核心组件（策略引擎和查询处理器），从\
  \ CAISS 中这些组件的实现和集成中获得的经验教训，在 CAISS++ 的开发过程中将极其宝贵。最后，对 CAISS 的评估和测试将为我们提供关于 CAISS\
  \ 缺陷的重要见解，这些缺陷随后可在 CAISS++ 的实现中系统地解决。\n\n我们还将对策略规范及强制执行它们的软件级保护机制进行形式化分析，为生成的系统提供极高保障的安全保证。我们设想\
  \ CAISS++ 将用于高度关键任务的应用中。因此，必须保证策略以可证明正确的方式得到执行。我们在形式化策略分析 [JONE2010, JONE2011] 及其通过机器认证的内联参考监视器\
  \ [HAML2006a, HAML2006b, SRID2010] 强制执行方面拥有丰富的专业知识。这些分析将被用于建模和认证 CAISS++ 可信计算基中核心软件组件所强制执行的安全属性。\n\
  \nCAISS++ 将成为信息共享的突破性技术，因为它采用了一种新颖的组合：以云为中心的策略规范与强制执行，以及以云为中心的数据存储和高效的查询评估。CAISS++\
  \ 将使用本体（Web 本体语言 OWL 的一个子语言）来构建策略。此类本体与基于语义 Web 的规则语言（如 SWRL）相结合，便于对策略进行分布式推理以强制执行安全。此外，CAISS++\
  \ 将包含一个 RDF 处理引擎，该引擎基于信息共享策略为评估 SPARQL 查询提供基于成本的优化。\n\n### 16.2.2 CAISS 设计\n\n\n\
  \n# 16.2.2 开发 CAISS 的增强措施\n\n我们正在增强为 AFOSR 开发的工具，包括 (i) 面向语义 Web 数据的安全云查询处理，以及 (ii)\
  \ 基于语义 Web 的策略引擎，以开发 CAISS。我们工具的详细信息见 第 16.4 节（相关工作部分）。在本节中，我们将讨论为开发 CAISS 而对工具进行的增强。\n\
  \n首先，我们基于 RDF 的策略引擎可对表示为 RDF 图的数据强制执行访问控制、编辑和推理控制策略。其次，我们用于 RDF 数据的云 SPARQL 查询引擎使用\
  \ Hadoop/MapReduce 框架。请注意，Hadoop 是 Apache 分布式文件系统，而 MapReduce 运行在 Hadoop 之上并执行作业调度。与我们基于云的关系查询处理器原型\
  \ [THUR2010] 类似，我们的 SPARQL 查询引擎也处理用 XACML 指定的策略，且策略引擎实现了 XACML 协议。将 XACML 用作策略语言需要深入了解\
  \ XACML 设计中使用的通用概念。因此，XACML 策略编写需要陡峭的学习曲线，因而成为一项留给经验丰富的管理员的任务。使用 XACML 的第二个缺点与性能有关。目前的\
  \ XACML 实现要求针对系统中的每个策略评估访问请求，直到有策略适用于传入的请求。这种策略对于用户和策略相对较少的系统已足够。然而，对于拥有大量用户和大量访问请求的系统，上述策略会成为性能瓶颈。最后，XACML\
  \ 的表达能力不足以捕捉信息共享策略的语义。先前的研究表明，基于语义 Web 的策略具有更强的表达能力。这是因为语义 Web 技术基于描述逻辑，具有表示知识和推理知识的能力。因此，我们的第一步是用基于语义\
  \ Web 的策略引擎替换基于 XACML 的策略引擎。由于我们已为第一阶段原型拥有基于 RDF 的策略引擎，我们将增强该引擎并将其与 SPARQL 查询处理器集成。由于我们的策略引擎基于\
  \ RDF，而查询处理器也管理大型 RDF 图，因此数据与策略之间不会存在阻抗失配。\n\n#### 16.2.2.1 增强的策略引擎\n\n我们当前的策略引擎存在一个局限性，即它不在云环境中运行。因此，我们将把\
  \ RDF 策略引擎移植到云环境中，并将其与用于云中联合查询处理的 SPARQL 查询引擎集成。我们的策略引擎将受益于 Hadoop MapReduce 框架提供的可扩展性和分布式平台，以回答大型分布式\
  \ RDF 三元组存储（数十亿 RDF 三元组）上的 SPARQL 查询。使用 RDF 作为数据模型的原因如下：(1) RDF 使我们能够实现由各机构/组织分别编目的看似不同的信息源之间的数据互操作性。(2)\
  \ 使用 RDF 允许参与机构创建以数据为中心的应用程序，利用现已可用的集成数据。(3) 由于 RDF 生成数据不需要显式模式，因此可以轻松适应不断变化的用户需求。策略引擎的灵活性基于其接受高层策略，并将其作为查询规则在数据的有向\
  \ RDF 图表示上执行。虽然我们之前的工作侧重于溯源数据和访问控制策略，但我们的 CAISS 原型将足够灵活，能够处理用 RDF 表示的数据，并将包含信息共享策略。我们策略引擎的优势在于它可以处理任何可使用\
  \ RDF 和 Horn 逻辑规则表示的策略类型。\n\n我们策略引擎的第二个局限性是它目前仅针对某些类型的策略，如保密性、隐私和编辑策略。我们需要将信息共享策略纳入策略引擎。然而，我们已为基于激励的\
  \ AIS 以及云中的 AIS 原型进行了仿真研究。我们定义了许多信息共享策略，例如“美国向英国提供信息，前提是英国不与印度共享该信息。”我们用 RDF 指定此类策略，并将其纳入由增强后的策略引擎处理。\n\
  \n#### 16.2.2.2 增强的 SPARQL 查询处理器\n\n虽然我们有一个工具可在 Hadoop 上对大型 RDF 图执行 SPARQL 查询，但仍需支持路径查询（即提供\
  \ RDF 图中路径答案的 SPARQL 查询）。RDF 三元组可视为从主语到宾语的弧，谓语用于标记该弧。SPARQL 查询的答案基于可达性（即源节点和目标节点之间的路径）。沿路径弧标签的连接可视为属于路径查询答案集的一个词。词中的每个项由\
  \ RDF 图中某个三元组的谓语标签贡献。我们设计了一种算法，以在分布式 RDF 图中确定作为答案集的候选三元组。首先，RDF 文档被转换为基于谓语标签拆分的\
  \ N-triple 文件。词中的一项可能对应某个谓语文件。其次，我们通过在分布式 RDF 图中追踪适当的路径来形成该词。我们使用 MapReduce 作业来构建该词并获取作为有序集的候选\
  \ RDF 三元组。最后，我们返回所有有序 RDF 三元组集作为相应 SPARQL 查询的答案。\n\n#### 16.2.2.3 集成框架\n\n图 16.2\
  \ 提供了 CAISS 架构的概览。将以云为中心的 RDF 策略引擎与增强的 SPARQL 查询处理器集成必须解决以下问题。首先，我们需要确保基于 RDF 的策略可以存储在查询处理器使用的现有存储模式中。其次，我们需要确保增强的查询处理器能够高效地评估底层\
  \ RDF 存储上的策略（即路径查询）。最后，我们需要对 CAISS 进行性能评估，以验证其是否满足各参与机构的性能要求。图 16.3 说明了 CAISS 的操作概念。在此，多个机构将在单个云中共享数据。增强的策略引擎和以云为中心的\
  \ SPARQL 查询处理器将强制执行信息共享策略。这个概念验证系统将推动 CAISS++ 的详细设计和实现。\n\n![图 16.2 CAISS 原型概览。](img/fig16_2.jpg)\n\
  \n图 16.2 CAISS 原型概览。\n\n![图 16.3 CAISS 的操作。](img/fig16_3.jpg)\n\n图 16.3 CAISS 的操作。\n\
  \n在着手开发 CAISS++ 之前，开发像 CAISS 这样的概念验证原型有几个好处。首先，CAISS 本身对于在单个云中共享数据很有用。其次，当我们实现 CAISS++\
  \ 时，我们将拥有一个基准系统，可用于在效率和易用性方面进行比较。第三，这将为我们提供关于云中 AIS 所需不同组件集成的宝贵经验。最后，通过在 CAISS 上运行不同场景，我们可以识别出需要在\
  \ CAISS++ 中解决的潜在性能瓶颈。\n\n### 16.2.3 CAISS 的局限性\n\n我们已经考察了替代方案并进行了 CAISS++ 的初步设计。基于从\
  \ CAISS 原型和 CAISS++ 初步设计中吸取的教训，我们将在第二阶段进行 CAISS++ 的详细设计，并随后实现 CAISS++ 的操作原型。在本节中，我们将讨论\
  \ CAISS 的局限性。\n\n\n\n\n1. **策略引擎**：CAISS 使用基于 RDF 的策略引擎，其表达能力有限。RDF 的目的是为描述资源提供结构（或框架）。OWL\
  \ 构建在 RDF 之上，专为需要处理信息内容而非仅向人类用户呈现信息的应用程序设计。OWL 通过提供描述属性和类的额外词汇以及形式语义，比 RDF 具有更强的机器可解释性。OWL\
  \ 有三种表达能力递增的子语言：OWL Lite、OWL DL 和 OWL Full，可根据应用需求自由选择合适的子语言。在 CAISS++ 中，我们计划使用比\
  \ RDF 表达能力强得多的 OWL，通过特定于组织的领域本体以及系统级的上层本体来建模安全策略。（注：CAISS++ 将复用组织现有的领域本体，或在不存在时促进新领域本体的创建。此外，我们还必须设计集中式\
  \ CAISS++ 组件将使用的上层本体。）此外，CAISS++ 将利用分布式推理算法，借助本体来强制执行安全策略。\n\n2. **Hadoop 存储架构**：CAISS\
  \ 使用静态存储模型，用户仅在初始化步骤中向系统提供一次 RDF 数据。此后，不允许用户更新现有数据。另一方面，CAISS++ 试图为用户提供灵活的存储模型。在\
  \ CAISS++ 中，允许用户将新数据追加到存储在 HDFS 中的现有 RDF 数据中。注意，仅允许追加新数据而不允许删除/修改现有数据，源于 HDFS 强制执行的文件仅追加限制。\n\
  \n3. **SPARQL 查询处理器**：CAISS 仅支持使用基本图模式（BGP）的简单 SPARQL 查询。在 CAISS++ 中，将增加对其他 SPARQL\
  \ 查询算子（如 `FILTER`、`GROUP BY` 和 `ORDER BY`）的支持。此外，CAISS 使用启发式查询优化器，旨在最小化回答查询所需的 MapReduce\
  \ 作业数量。CAISS++ 将采用基于成本的查询优化器，以最小化查询执行过程中访问的三元组数量。\n\n### 16.2.4 CAISS++ 的设计\n\n\
  CAISS++ 克服了 CAISS 的局限性。CAISS++ 的详细设计及实现将在第 2 阶段进行。CAISS 的经验教训也将推动 CAISS++ 的详细设计。我们假设数据已使用适当的\
  \ DoD 加密技术进行加密，因此本项目不研究加密。CAISS++ 的操作概念如 Figure 16.4 所示，展示了其与多个参与机构的交互，多个组织在单一云中共享数据。\n\
  \n![Figure 16.4 CAISS++ Scenario.](img/fig16_4.jpg)\n\nFigure 16.4 CAISS++ Scenario.\n\
  \nCAISS++ 的设计基于基于 OWL 的策略引擎与 RDF 处理引擎的新颖组合。因此，该设计由多个任务组成，每个任务分别求解，随后集成为单一框架。\n\n\
  (1) **基于 OWL 的策略引擎**：策略引擎使用一组特定于机构的领域本体以及一个上层本体来构建用于 AIS 任务的策略。强制执行策略的任务可能需要使用分布式推理器；因此，我们将评估现有的分布式推理器。\n\
  \n(2) **RDF 处理引擎**：处理引擎需要构建复杂的存储架构以及高效的查询处理器。\n\n(3) **集成框架**：最后的任务是将策略引擎与处理引擎结合成一个集成框架。CAISS++\
  \ 的初始设计将基于设计简洁性与其可扩展性和效率之间的权衡。第一种设计备选称为集中式 CAISS++，选择简洁性作为权衡；第二种设计备选（称为去中心化 CAISS++）选择可扩展性和效率作为权衡。最后，我们还提供了一种混合\
  \ CAISS++ 架构，试图结合集中式和去中心化 CAISS++ 的优势。由于 CAISS++ 遵循需求驱动设计，我们前面为实现 AIS 而概述的任务划分存在于我们接下来介绍的每种方法中。\n\
  \n#### 16.2.4.1 集中式 CAISS++\n\nFigure 16.5 展示了两个机构通过集中式 CAISS++ 进行交互。集中式 CAISS++\
  \ 由用于存储共享数据的共享云存储组成。所有参与机构存储其各自的知识库，包含领域本体及相应的实例数据。集中式 CAISS++ 还包含一个上层本体、一个查询引擎（QE）和一个分布式推理器（DR）。上层本体用于捕获参与机构领域间通用的领域知识，而领域本体捕获特定于给定机构或领域的知识。注意，给定机构的领域本体将受到保护，不被其他参与机构的领域本体访问。策略可以根据其适用范围，在上层本体或任意领域本体中捕获。注意，给定机构的领域本体将受到保护，不被其他参与机构的领域本体访问。\n\
  \n![Figure 16.5 Centralized CAISS++.](img/fig16_5.jpg)\n\nFigure 16.5 Centralized\
  \ CAISS++.\n\n\n\n\n上层本体以及捕获参与机构需求的领域本体的设计是一个重要的研究领域，也是本体工程问题的重点。本体将使用基于*描述逻辑*的合适的`OWL`方言来创建。描述逻辑通常是一阶逻辑的可判定片段，并将成为提供可靠形式语义的基础。在用本体表示知识后，推理将使用现有的优化推理算法来完成。查询回答将利用推理算法来构思并回答智能查询。用`OWL`编码策略将确保它们以可证明正确的方式得到执行。稍后我们将介绍德克萨斯大学达拉斯分校的一个正在进行的研究项目，该项目专注于利用相同的底层技术，提供一个以可证明正确的方式强制执行策略的通用框架。这项工作可用于`CAISS++`中安全策略的建模和执行。实例数据可以在几种可用的数据存储格式之间进行选择。`QE`接收来自参与机构的查询，解析查询并确定计算是否需要使用`DR`。如果查询简单且不需要使用推理器，查询引擎将直接在共享知识库上执行查询。一旦计算出查询结果，结果将返回给查询机构。然而，如果查询复杂且需要对给定数据进行推理，查询引擎将使用分布式推理器计算推理，然后将结果返回给查询机构。分布式`DL`推理器与传统`DL`推理器的区别在于其能够使用`MapReduce`框架对云数据存储执行推理。在第一阶段`CAISS++`的初步设计期间，我们将利用现有基准（如`LUBM`\
  \ [GUO2005]）对可用的分布式推理器进行彻底调查。此次调查的目标是确定我们是否可以使用现有推理器之一，或者是否需要构建我们自己的分布式推理器。在图 16.5\
  \ 中，一个机构被描绘为由 Web 浏览器、小程序和`HTML`组成的栈。机构使用 Web 浏览器将查询发送给`CAISS++`，由查询处理器进行处理。\n\n\
  集中式`CAISS++`与`CAISS`的主要区别如下：(1) `CAISS`将使用`RDF`编码安全策略，而集中式`CAISS++`将使用一种合适的`OWL`子语言，它比`RDF`更具表现力，因此能更好地捕获安全策略。(2)\
  \ `CAISS`中的`SPARQL`查询处理器将支持有限的`SPARQL`表现力子集，即仅支持基本图模式（`BGP`），而集中式`CAISS++`中的`SPARQL`查询处理器将被设计为支持`SPARQL`的最大表现力。(3)\
  \ `CAISS`中使用的`Hadoop`存储架构仅支持在初始化步骤期间插入数据。然而，当需要更新数据时，整个`RDF`图将被删除，并插入一个新数据集来替代。另一方面，集中式`CAISS++`除了支持上述功能外，还向用户开放了`Hadoop\
  \ HDFS`的仅追加功能。此功能允许用户将新信息追加到他们之前上传到系统的数据中。\n\n#### 16.2.4.2 去中心化 CAISS++\n\n图 16.6\
  \ 展示了两个机构与去中心化`CAISS++`的交互。去中心化`CAISS++`由两部分组成，即全局`CAISS++`和本地`CAISS++`。全局`CAISS++`由共享云存储组成，参与机构用它仅存储各自的领域本体，而非实例数据，这与集中式`CAISS++`不同。请注意，各组织的领域本体将是敏感的，因此，`CAISS++`将利用其自身的领域本体来保护参与机构免于访问其他领域本体。当来自某机构的用户查询`CAISS++`数据存储时，全局`CAISS++`分两步处理查询。第一步，它执行检查以验证用户是否被授权执行查询中指定的操作。如果第一步的结果验证用户为授权用户，则继续进行查询处理的第二步。在第二步中，全局`CAISS++`将实际查询联合分发给参与机构。查询随后由参与机构的本地`CAISS++`处理。计算结果随即返回给全局`CAISS++`，后者聚合最终结果并将其返回给用户。查询处理的第二步可能涉及查询拆分，如果回答一个查询所需的数据跨越多个域。在这种情况下，来自多个机构（其本地`CAISS++`）的子查询结果将需要合并以进行进一步的查询处理。一旦结果合并并计算出最终结果，结果将返回给查询机构的用户。该图展示了带有两组栈的机构，其中一组对应本地`CAISS++`，另一组由\
  \ Web 浏览器、小程序和`HTML`组成，供机构用于查询全局`CAISS++`。表 16.1 显示了集中式`CAISS++`方法的优缺点，而表 16.2 显示了去中心化`CAISS++`方法的优缺点。\n\
  \n![图 16.6 去中心化 CAISS++.](img/fig16_6.jpg)\n\n图 16.6 去中心化 CAISS++.\n\n表 16.1 集中式\
  \ CAISS++ 的优缺点\n\n| 优点 | 缺点 |\n| --- | --- |\n| 方法简单 | 数据难以更新 |\n| 方法简单 | 成本高昂，因为每次更新或一组更新都需要将数据迁移到中央存储\
  \ |\n| 易于实现 | 导致数据重复 |\n| 易于查询 | 如果数据以不同格式提供，需要通过转换为 RDF 来同质化 |\n\n表 16.2 去中心化 CAISS++\
  \ 的优缺点\n\n| 优点 | 缺点 |\n| --- | --- |\n| 无数据重复 | 查询处理复杂 |\n| 可扩展且灵活 | 难以实现 |\n| 高效\
  \ | 可能需要查询重写和查询拆分 |\n\n#### 16.2.4.3 混合 CAISS++\n\n图 16.7 展示了混合`CAISS++`的概览，它利用了集中式`CAISS++`和去中心化`CAISS++`的优势。混合`CAISS++`架构如图\
  \ 16.8 所示。这是一种灵活的设计替代方案，因为参与机构的用户可以自由选择集中式`CAISS++`或去中心化`CAISS++`。混合`CAISS++`由全局`CAISS++`和位于每个参与机构的一组本地`CAISS++`组成。全局`CAISS++`由共享云存储组成，参与机构用它来存储他们希望与其他机构共享的数据。\n\
  \n![图 16.7 混合 CAISS++ 概览.](img/fig16_7.jpg)\n\n图 16.7 混合 CAISS++ 概览.\n\n![图 16.8\
  \ 混合 CAISS++ 架构.](img/fig16_8.jpg)\n\n图 16.8 混合 CAISS++ 架构.\n\n\n\n\n# 混合 CAISS++\n\
  \n某机构的本地 CAISS++ 用于接收并处理针对位于该机构的实例数据的联邦查询。参与组是由来自多个机构、希望相互共享信息的用户组成的群体。组成员将就采用集中式还是分散式方法达成共识。如果需要，其他用户稍后也可以加入该组。混合\
  \ CAISS++ 将设计为同时支持一组参与组。此外，一个用户可以同时属于多个参与组。我们描述几个用例场景来说明其操作。\n\n1.  第一种情况对应这样一种场景：一组希望安全地相互共享信息的用户选择了集中式方法。假设机构\
  \ 1 的用户想与机构 2 的用户共享信息，反之亦然，那么这两个机构都将包含领域本体和实例数据的知识库存储在全局 CAISS++ 所在的共享云存储上。集中式 CAISS++\
  \ 方法通过让参与机构就使用中央云存储达成相互信任来工作。随后，信息共享按集中式 CAISS++ 的方式进行。\n\n2.  第二种情况对应这样一种场景：一组用户选择了分散式方法。例如，机构\
  \ 3、4 和 5 希望相互共享信息，并共同选择分散式方法。这三个机构都将各自的领域本体存储在中央云存储中，且该信息仅对该组成员可访问。后续的信息共享过程按前文所述的分散式\
  \ CAISS++ 方法进行。\n\n3.  第三种情况对应这样一种场景：某机构的用户属于多个参与组，其中一些组选择集中式共享方法，另一些选择分散式方法。由于该用户属于一个使用集中式方法共享的组，他/她需要将数据传送到中央云存储，以使其数据可供该组使用。此外，由于该用户也属于一个使用分散式方法共享的组，他/她需要借助位于其机构的本地\
  \ CAISS++ 来响应联邦查询。\n\n表 16.3 显示了不同方法之间的权衡，这将使用户能够根据其应用需求选择合适的 AIS 方法。接下来，我们将描述利用\
  \ Hadoop 存储来自各机构知识库的云存储机制的细节，然后讨论在云存储上进行分布式 SPARQL 查询处理的细节。\n\n表 16.3 基于功能 Hadoop\
  \ 存储架构的三种方法比较\n\n| 功能 | | 集中式 CAISS++ | 分散式 CAISS++ | 混合 CAISS++ |\n| --- | ---\
  \ | --- | --- | --- |\n| 无数据重复 | | X | ✓ | ✓ |\n| 灵活性 | | X | X | ✓ |\n| 可扩展性 |\
  \ | X | ✓ | ✓ |\n| 效率 | | ✓ | ✓ | ✓ |\n| 简单性 – 无需查询重写 | | ✓ | X | X |\n| 受信的中心化云数据存储\
  \ | | ✓ | X | X |\n\n在 图 16.9 中，我们展示了基于 Hadoop 的 RDF 存储与检索框架的架构概览。我们使用 `Store`（存储）的概念，为存储在底层\
  \ HDFS 中的 RDF 图提供数据加载和查询功能。一个存储代表单个 RDF 数据集，因此可以包含多个 RDF 图，每个图拥有自己独立的布局。随后，对 RDF\
  \ 图的所有操作都隐式转换为对底层布局的操作，包括以下内容：\n\n*   **布局格式化器**：该模块执行格式化布局的功能，即删除 RDF 图中的所有三元组，同时保留用于存储该图的目录结构。\n\
  *   **加载器**：该模块执行将三元组加载到布局中的操作。\n*   **查询引擎**：该模块允许用户使用 SPARQL 查询来查询布局。由于我们的框架运行在底层\
  \ HDFS 上，因此对布局的查询机制涉及将 SPARQL 查询转换为可能的 MapReduce 作业流水线，然后在布局上执行该流水线。\n*   **连接**：该模块维护与底层\
  \ HDFS 所需的连接和配置。\n*   **配置**：该模块维护配置信息，例如组成存储的每个 RDF 图的图名。\n\n![图 16.9 CAISS++ 使用的\
  \ Hadoop 存储架构。](img/fig16_9.jpg)\n\n图 16.9 CAISS++ 使用的 Hadoop 存储架构。\n\n由于 RDF 数据将作为我们存储模式的一部分，存储在不同的\
  \ HDFS 文件夹下的单独文件中，我们需要为这些文件夹和文件采用特定的命名约定。\n\n#### 16.2.4.4 命名约定\n\n在我们的框架中，一个 Hadoop\
  \ 存储可以由多个不同的 RDF 图组成。因此，将在 HDFS 中为每个此类 Hadoop 存储创建一个单独的文件夹。该文件夹的名称将对应于为给定存储选定的名称。此外，在我们的框架中，根据所选的存储布局，一个\
  \ RDF 图被划分为多个文件。因此，将在 HDFS 中为每个不同的 RDF 图创建一个单独的文件夹。默认 RDF 图的该文件夹名定义为 `default`，而对于命名\
  \ RDF 图，则使用该图的统一资源标识符 (URI) 作为文件夹名称。我们在框架中使用存储的抽象，原因是这将简化属于不同机构的数据的管理。我们框架支持的两种布局将在后面讨论。这些布局使用数量不等的\
  \ HDFS 文件来存储 RDF 数据。\n\n#### 16.2.4.5 垂直分区布局\n\n图 16.10 展示了垂直分区布局的存储模式。对于 RDF 图中包含的每个唯一谓词，该布局在底层\
  \ HDFS 中使用谓词名称作为文件名创建一个单独的文件。请注意，文件名中仅使用谓词 URI（统一资源标识符）的本地名称部分，且文件名与谓词 URI 之间存在单独的映射。给定谓词的文件为包含该谓词的每个三元组包含单独的一行。该行存储构成三元组的主语和宾语值。因为将谓词名称移至文件名完全消除了该谓词值的存储，所以这种模式将带来显著的存储空间节省。然而，相同的资源\
  \ URI 或字面值的多次出现将在所有文件中以及文件内部被多次存储。此外，SPARQL 查询可能需要查找多个文件，以确保向用户返回完整的结果，例如，查找属于特定主语或宾语的所有三元组的查询。\n\
  \n![图 16.10 垂直分区布局。](img/fig16_10.jpg)\n\n图 16.10 垂直分区布局。\n\n#### 16.2.4.6 混合布局\n\
  \n\n\n\n图 16.11 展示了混合布局的存储模式。该布局是垂直分区布局的扩展，因为除了为 RDF 图中的每个唯一谓词创建单独的文件外，它还创建了一个单独的三元组文件，包含采用\
  \ `SPO`（主语、谓语、宾语）格式的所有三元组。拥有此类文件的优势在于，它能直接提供属于特定主语或宾语的所有三元组。回想一下，在垂直分区布局中，此类搜索操作需要扫描多个文件。由于增加了三元组文件，该布局的存储空间效率不如垂直分区布局。然而，使用该布局可以更高效地执行查找属于特定主语或宾语的所有三元组的\
  \ `SPARQL` 查询。\n\n![图 16.11 混合布局。](img/fig16_11.jpg)\n\n图 16.11 混合布局。\n\n#### 16.2.4.7\
  \ SPARQL 的分布式处理\n\n`CAISS++` 中的查询处理包含多个步骤（图 16.12）。第一步是查询解析和转换，给定的 `SPARQL` 查询首先被解析以验证语法正确性，然后构建与输入查询对应的解析树。解析树随后被转换为\
  \ `SPARQL` 代数表达式。由于给定的 `SPARQL` 查询可以有多个等价的 `SPARQL` 代数表达式，我们用关于如何评估该表达式中每个操作的指令来标注每个此类表达式。此类带标注的\
  \ `SPARQL` 代数表达式对应于查询评估计划，作为优化器的输入。优化器选择一个使查询评估成本最小化的查询计划。为了优化查询，优化器必须知道每个操作的成本。为了计算每个操作的成本，优化器使用一个元存储，其中存储与\
  \ `RDF` 数据相关的统计信息。给定查询评估计划的成本也可以用 `MapReduce` 作业的数量或作为查询执行一部分将被访问的三元组数量来衡量。一旦选定查询计划，将使用该计划评估查询并输出查询结果。由于我们使用以云为中心的框架来存储\
  \ `RDF` 数据，评估引擎需要将 `SPARQL` 代数算子转换为底层存储布局（前文所述）上的等价 `MapReduce` 作业。因此，在 `CAISS++`\
  \ 中，我们将为每个 `SPARQL` 代数算子实现一个 `MapReduce` 作业。此外，评估引擎使用分布式推理器来计算查询评估所需的推论。\n\n![图\
  \ 16.12 CAISS++ 中 SPARQL 的分布式处理。](img/fig16_12.jpg)\n\n图 16.12 CAISS++ 中 SPARQL\
  \ 的分布式处理。\n\n#### 16.2.4.8 框架集成\n\n我们概述的作为 `CAISS++` 一部分的组件需要集成以协同工作。此外，这一集成过程取决于用户对\
  \ `CAISS++` 提供的三种可能设计选择之一的选择，即集中式 `CAISS++`、分散式 `CAISS++` 或混合 `CAISS++`。迄今为止提出的\
  \ `CAISS++` 各个部分的集成需要考虑若干问题。首先，我们需要确保本体工程过程已成功捕获机构的需求，并且本体可以存储在 `Hadoop` 存储架构使用的存储模式中。其次，我们需要确保分布式\
  \ `SPARQL` 查询处理器能够高效地评估底层 `RDF` 存储上的查询（即用户生成的 `SPARQL` 查询以及评估策略的 `SPARQL` 查询）。最后，我们需要对\
  \ `CAISS++` 进行性能评估，以验证其是否满足各参与机构的性能要求，以及与 `CAISS` 相比是否带来显著的性能优势。\n\n#### 16.2.4.9\
  \ 策略规范与实施\n\n`CAISS++` 的用户可以使用他们选择的语言（例如 `XACML`、`RDF` 和 `Rei`）来指定其信息共享策略。这些策略将使用现有的或定制的转换器转换为\
  \ `OWL` 的合适子语言。我们将扩展 `CAISS` 的策略引擎以处理用 `OWL` 指定的策略。除了 `RDF` 策略外，我们当前的策略引擎还可以处理用于实现基于角色的访问控制、推理控制和社会网络分析的\
  \ `OWL` 策略。\n\n### 16.2.5 设计扩展\n\n#### 16.2.5.1 形式化策略分析\n\n我们的框架适用于各种关键任务、高保障的应用，这些应用跨越多个可能相互不信任的组织。为了在这类环境中提供最大程度的安全保障，建立关于系统正确性及其所执行策略的强有力形式化保证非常重要。为此，我们研究了为我们的系统构建重要系统属性和策略分析的形式化、机器可检查证明的基础设施。虽然对于许多大型软件系统，构建机器可检查证明可能非常困难且耗时，但我们选择\
  \ `SPARQL`、`RDF` 和 `OWL` 作为查询、本体和策略语言，为在逻辑编程环境中优雅地构建此类证明提供了独特的机会。我们将把策略、策略重写算法和安全属性编码为\
  \ `Prolog` 中基于规则的逻辑推导系统，并应用模型检查和定理证明系统（如 `ACL2`）生成机器可检查的证明，以证明系统遵守这些属性。我们打算在模型中考虑的属性包括可靠性、透明性、一致性和完整性。我们的形式化策略分析结果将驱动\
  \ `CAISS++` 的详细设计和实现。据我们所知，以往的研究中没有专注于针对 `SPARQL`、`RDF` 和 `OWL` 的此类形式化策略分析。我们关于带内联参考监视器的形式化策略分析的广泛研究在相关工作中讨论。\n\
  \n通过将高级安全策略规范和系统模型降低到其二进制级实现的指称语义和操作语义层面，我们过去的工作为各种复杂软件系统开发了形式化的、机器可认证的安全实施机制，包括用\
  \ [.NET](http://in.NET) 实现的系统 \\[HAML2006b\\]、`ActionScript` \\[SRID2010\\]、`Java`\
  \ \\[JONE2010\\] 和本地代码 \\[HAML2010b\\]。在二进制级工作提供了极高的形式化保证，因为它允许生成关键任务软件组件的工具链保持不可信；工具链生成的二进制代码可以直接被认证。该策略非常适合\
  \ `CAISS++`，因为诸如 `XACML` 和 `OWL` 等数据安全规范语言可以通过具有 `XML` 感知的系统应用程序编程接口（`API`）（如 `Java`\
  \ 字节码）优雅地映射到字节码语言的二进制级。我们过去的工作应用了二进制插桩（例如内联参考监控）以及二进制类型检查 \\[HAML2006b\\]、模型检查 \\\
  [SRID2010\\] 和自动定理证明（例如通过 `ACL2`）的组合，在上述领域实现了二进制软件的完全自动化机器认证。\n\n#### 16.2.5.2 面向大数据应用的扩展\n\
  \n\n\n在第 17 章中，我们将讨论一个用于社交媒体数据的访问控制框架。我们可以将该工作与本章讨论的工作（即第 16 章）相结合，并基于大数据开发面向社交媒体的\
  \ AIS 方法。我们可以针对利用大数据管理和分析的社交媒体应用，改编本章讨论的几种设计变体。首先，网络成员可能希望共享数据。因此，他们可以实施信息共享策略，每个成员拥有自己的数据存储。在第二种设计中，成员可以使用共享空间或云来存储数据和策略，并安全地共享数据。\n\
  \n成员也可能属于多个社交网络。也就是说，一个人可能属于多个网络，也可能只属于一个网络。在这种情况下，成员可以与其网络中的成员共享更多数据，而与另一个网络的成员仅共享有限数据。此外，不同网络可能使用异构技术进行表示。因此，必须解决异构表示问题。也可以为多个网络开发逻辑表示，并建立到各个网络的映射。随着时间的推移，多个社交网络中的用户数量可能会快速增长，他们在网络中存储和共享的数据量可能巨大。因此，必须探索我们在第\
  \ 5 章以及第 I 部分和第 II 部分其他章节中讨论的几种大数据技术，以用于多个社交网络之间的 AIS。\n\n## 16.3 实现细节\n\n我们已经为`CAISS`和`CAISS++`实现了一系列系统。我们提供这些实现的概述。\n\
  \n### 16.3.1 原型实现\n\n#### 16.3.1.1 云中的安全数据存储与检索\n\n我们构建了一个基于 Web 的应用程序，该程序将现有的云计算技术（如`Hadoop`——一个开源分布式文件系统，以及构建在`Hadoop`之上的`Hive`数据仓库基础设施）与基于`XACML`策略的安全机制相结合，允许协作组织安全地存储和检索大量数据\
  \ HUSA2011, THUR2010, [UTD1]。图 16.13 展示了我们系统的架构。我们使用`Hive`层和`Hadoop`提供的服务，包括构成`Hadoop`存储层并允许跨节点集群存储数据块的`Hadoop\
  \ 分布式文件系统(HDFS)`层。我们实现的层包括 Web 应用层、`ZQL`解析器层、`XACML`策略层和查询重写层。Web 应用层是我们系统提供给用户访问云基础设施的唯一接口。`ZQL`解析器[ZQL]层接受用户提交的任何查询作为输入，如果查询解析成功则继续进行`XACML`策略评估，否则向用户返回错误消息。`XACML`策略层用于构建（`XACML`策略构建器）和评估（`XACML`策略评估）`XACML`策略。基本查询重写层重写用户输入的`SQL`查询。`Hive`层用于管理存储在底层`Hadoop\
  \ HDFS`中的关系数据[THUS2009]。此外，我们还设计并实现了混合云中的安全存储和查询处理[KHAD2011]。\n\n![图 16.13 基于 Hive\
  \ 的可靠云查询处理。](img/fig16_13.jpg)\n\n图 16.13 基于 Hive 的可靠云查询处理。\n\n#### 16.3.1.2 云上的安全\
  \ SPARQL 查询处理\n\n我们开发了一个框架，用于查询存储在`Hadoop`上的`RDF`数据，如图 16.14 所示。我们在各个阶段使用`Pellet`推理器进行推理。我们利用`pellet`库结合`Hadoop`的`MapReduce`功能进行实时查询推理。我们的`RDF`查询处理由两个主要步骤组成：(i)预处理和(ii)查询优化与执行。\n\
  \n![图 16.14 基于 SPARQL 的可靠云查询处理。](img/fig16_14.jpg)\n\n图 16.14 基于 SPARQL 的可靠云查询处理。\n\
  \n#### 16.3.1.3 预处理\n\n为了在`RDF`数据上执行`SPARQL`查询，我们执行了数据预处理步骤，并将预处理后的数据存储在`HDFS`中。编写了一个单独的`MapReduce`任务来执行`RDF/XML`数据到`N-Triples`的转换以及前缀生成。我们的存储策略基于谓词分割[HUSA2011]。\n\
  \n#### 16.3.1.4 查询执行与优化\n\n我们为`Hadoop`开发了一个`SPARQL`查询执行和优化模块。由于我们的存储策略基于谓词分割，首先，我们检查查询中存在的谓词。其次，我们检查与谓词匹配的输入文件子集。第三，`SPARQL`查询通常包含许多连接操作，并且不可能在单个`MapReduce`作业中执行所有这些连接。因此，我们开发了一种算法来决定每种查询所需的作业数量。作为优化的一部分，我们应用了贪婪策略和基于成本的优化来减少查询处理时间。我们还开发了一个基于`XACML`的集中式策略引擎，该引擎将在云上执行联邦`RDF`查询处理。强制执行策略的细节见[HAML2010a,\
  \ HUSA2011, KHAL2010]。\n\n#### 16.3.1.5 RDF 策略引擎\n\n在我们之前的工作[CADE2011a]中，我们开发了一个策略引擎，用于处理针对`RDF`数据的基于`RDF`的访问控制策略。策略引擎的设计考虑了以下特性：可扩展性、效率和互操作性。该框架(图\
  \ 16.15)可用于执行各种策略，包括访问控制策略和编辑策略。它也可用作测试平台，用于评估针对`RDF`数据的不同策略集并以图形方式查看结果。我们的框架提供了一个接口，接受高级策略并将其转换为所需格式。它接受用户的输入查询，并返回经过用户定义的策略约束集修剪后的响应。该架构采用模块化方法构建，因此非常灵活，大多数模块都可以扩展或被另一个应用模块替换。例如，实现自主访问控制(`DAC`)的策略模块可以完全被`RBAC`模块替换，或者我们可以决定基于广义编辑模型强制执行所有约束。值得注意的是，我们的策略引擎还处理用`OWL`和`SWRL`指定的基于角色的访问控制策略[CADE2010]。此外，它还处理用`OWL`指定的某些推理控制策略，例如基于关联的策略（拒绝访问实体集合）和逻辑策略（`A`蕴含`B`，如果拒绝访问`B`，则也应拒绝访问`A`）[CADE2010,\
  \ CADE2011b, CARM2009]。我们策略引擎的这一能力将在我们的`CAISS++`设计和实现中发挥作用，其中信息跨多个云共享。\n\n![图 16.15\
  \ RDF 策略引擎。](img/fig16_15.jpg)\n\n图 16.15 RDF 策略引擎。\n\n#### 16.3.1.6 可靠信息共享原型\n\n\
  \n\n\n### 16.3.2 其他实现\n\n例如，`CAISS` 的一种实现是用 `Java` 编写的，并基于一种灵活的设计，我们可以在其中即插即用多个组件。服务提供商和/或用户将拥有灵活性，既可以将\
  \ `SPARQL` 查询处理器和基于 `RDF` 的策略引擎作为单独的组件使用，也可以将它们组合使用。用于 `CAISS` 的开源组件将包括 `Pellet`\
  \ 推理器以及我们的内部工具，如基于 `Hadoop/MapReduce` 框架的 `SPARQL` 查询处理器和以云为中心的 `RDF` 策略引擎。`CAISS`\
  \ 将允许我们在基于云的框架上演示基本的 `AIS` 场景。\n\n我们还完成了 `CAISS+` 的初步实现。在 `CAISS++` 的实现中，我们使用了 `Java`\
  \ 作为编程语言。在本体工程过程中（包括设计领域本体和上层本体），我们使用 `Protégé` 作为本体编辑器。未来，我们将评估几种现有的分布式推理算法，如 `WebPIE`\
  \ 和 `QueryPIE`，以确定最符合机构需求的算法。然后，所选算法将被用于对基于 `OWL` 的安全策略进行推理。此外，`Hadoop` 存储架构的设计基于\
  \ `Jena` 的 `SPARQL` 数据库（`SDB`）架构，并具备 `Jena SDB` 可用的一些功能。`SPARQL` 查询引擎也包含用 `Java`\
  \ 编写的代码。该代码由多个模块组成，包括查询解析与转换、查询优化和查询执行。查询执行模块将包含用于 `SPARQL` 语言各种运算符的 `MapReduce`\
  \ 作业。最后，我们基于 Web 的用户界面利用了多个组件，如 `JBoss`、`EJB`、`JSF` 等。我们还在探索将其他大数据技术（如 `Storm` 和\
  \ `Spark`）用于我们的云平台。此外，`NoSQL` 数据库系统（如 `Hbase` 和 `CouchDB`）也正在被探索以集成到我们的 `AIS` 平台中。\n\
  \n### 16.3.3 演示系统的实现\n\n#### 16.3.3.1 架构\n\n本节描述了我们为演示而实现的架构和系统的细节、模块及其他详情。我们的策略引擎框架由\
  \ `RDF` 配置文档驱动，这些文档编码了策略引擎的逻辑及其用法、用户界面布局和可定制参数，以及使用可用数据连接将可解引用的 `URI` 映射到数据存储。我们的策略引擎框架可作为关键推动者，增强\
  \ `RDBMS`（关系数据库管理系统）以及基于云的系统的安全性。`RDBMS` 的开发考虑了原子性、并发性和持久性，但通常随附的访问控制支持有限。云存储层允许机构存储和扩展策略，并对\
  \ `RDF` 资源实施更精细的控制。云的开发考虑了可扩展性和可用性，但忽视了安全考量。我们的策略引擎可配置为补充 `RDBMS` 中的策略，并为支持基于云的后端上的安全策略提供一个入口点。我们首先概述框架的配置。然后定义架构中的各层，最后描述我们实现的新颖特性。图\
  \ 16.16 展示了我们的架构，图 16.17 展示了我们的配置框架。\n\n![图 16.16 实现架构。](img/fig16_16.jpg)\n\n图\
  \ 16.16 实现架构。\n\n![图 16.17 配置概览。](img/fig16_17.jpg)\n\n图 16.17 配置概览。\n\n松耦合系统为我们的\
  \ `RDF` 策略引擎框架提供了易于配置和灵活的特性。通过采用包含机构对策略偏好或数据存储数据连接的 `RDF` 文档，每个组件都与其他组件抽象开来。此外，松耦合的\
  \ Web 前端促进了策略框架的更易维护和复用，因为适配器模式抽象了 Web 接口（及通信）到其他层的映射。抽象向机构隐藏了策略引擎管理器和数据管理器的实际实现及复杂性。因此，这允许机构使用任何表示语言（如\
  \ `XML`、`RDF` 或 `Rei` [KAGA2002]）指定其策略；适配器隐藏了从高层策略规范到策略实现的转换。\n\n我们的系统架构由三层组成。前端是用户界面；中间层包含我们的策略引擎逻辑；后端是我们的数据存储。接下来我们将讨论这些模块。应注意，在本实现中，我们的重点在于共享数据的溯源。该实现受本章前面讨论的原型以及第\
  \ 17 章中讨论的基于溯源的推理控制器的驱动。\n\n##### 16.3.3.1.1 用户界面层\n\n为了实现与我们框架的一对一交互，在策略层之上构建了一个基于\
  \ Web 的用户界面。丰富客户端和开源 Web 技术简化了用户、网页以及底层策略和数据层之间的交互。这种集成具有许多优势。策略框架在分布式环境中运行，具有更广泛的地理分布；因此，机构和用户具有移动性。Web\
  \ 界面要求用户创建账户（也是一种注册）并选择唯一的凭证，这些凭证随后将被用户用于向策略框架标识自己。基于表单的身份验证模式以及质询-响应测试将合法用户与机器人（可能伪装成普通用户）区分开来。合法用户将看到一个查询屏幕，允许他们在通过身份验证后编写\
  \ `SPARQL` 查询。注意，`SPARQL` [PRUD2006] 是一种用于 `RDF` 的查询语言，用于从三元组存储中检索数据。`SPARQL` 查询经过验证后被发送到我们的策略引擎层，后者返回一个结果\
  \ `RDF` 图，然后在网页上显示。\n\n\n\n\n\n###### 用户注册\n\n用户注册为用户提供了使用 Web 注册表单向系统注册的机会。注册表单采集用户的姓名、密码以及关于用户的其他元数据。元数据可以是用户所属的机构，或用于将用户凭证映射到用户将执行的角色的数据。下面的\
  \ RDF 图显示了用户配置文件的内容。RDF 图中的最后一个三元组包含一个可解引用的 URI，指向另一个 RDF 图，后者包含用户被允许查询的实际资源的可解引用\
  \ URI 列表。\n\n```\n<http://policy.org/agency/pol#users>\npol:user <http://policy.org/agency/pol#user1>.\n\
  \n###### resources\n<http://policy.org/agency/pol#user1>\npol:name \"user1\";\n\
  pol:passwd \"_:b1\";\npol:organization <http://policy.org/agency/pol#Agency1>\n\
  pol:resourcelist <http://example/users/resources/user1>.\n```\n\n###### 机构注册\n\n\
  机构注册由一系列网页组成，每个网页都是前一个页面的子页面。该流程始于机构注册描述自身的信息。首先，机构注册关于自身的重要元数据。这些元数据是一个 RDF 文档，可用于向另一机构介绍一家机构，因此应当是自描述的。这些元数据中的一些示例三元组可以断言机构的名称、地址、行业、隶属关系等。其次，机构记录其资源。资源拥有一个唯一的\
  \ URI，该 URI 是一个可解引用的 URI，指向包含该机构敏感和非敏感数据的 RDF 文档；这些信息通常存储在关系数据库中，但现已迁移到云端。第三，机构为其资源定义策略。机构可在策略引擎层支持的各种策略中进行选择。策略示例包括访问控制、编辑、信息共享等。第四，机构描述策略的各种策略规则。请注意，机构可能使用访问控制来保护其资源；然而，机构可能需要针对特定策略选择制定多条规则。例如，一条访问控制规则可能指定正向授权，而另一条规则可能针对同一资源指定负向授权。最后，机构指定查询。将策略规则编写为数据存储之上的视图（即\
  \ SPARQL 查询）是一种非常流行的技术。机构可在其策略规则配置文档中指定查询是物化的还是非物化的。物化查询可加快策略执行速度，而非物化查询则可实时刷新结果集。\n\
  \n##### 16.3.3.1.2 策略引擎\n\n**策略引擎层**首先针对存储的数据资源（可以是传统数据，也可以是溯源元数据）评估用户查询。数据资源由统一资源标识符\
  \ (URI) 表征，该标识符连接到数据存储层中的实际 RDF 图。策略层使用工厂对象来创建底层策略。工厂通过一致的接口暴露策略，从而使我们能够轻松扩展策略引擎以支持未来的其他类型策略。我们目前支持访问控制、编辑和信息共享策略。为支持传统策略，我们使用\
  \ SPARQL 查询来定义资源之上的视图，其中视图可与正向和负向授权或子图替换过程中的目标相关联。一个重要的元数据是溯源，它记录了数据项的历史。然而，溯源采用有向无环图\
  \ (DAG) 结构，因此需要其自己的策略 (BRAU2008, DING2005)。因此，我们支持将正则表达式 SPARQL 查询用于访问控制策略 [CADE2011a]\
  \ 以及编辑策略 [CADE2011b]。我们还实现了针对数据和溯源的信息共享策略，允许合作机构基于相互协议共享信息 CADE2012b。\n\n敏捷环境促使策略设计人员不断微调或扩展其策略，以快速适应不断变化的条件，从而确保数据集成和组合不违反数据机密性，尤其是在关键时刻需要快速行动时（例如在情报工作中）。为满足这一需求，我们的策略引擎层支持多种策略引擎，而云端支持多种策略配置文档。\n\
  \n策略引擎以用户凭证和一个可解引用的 URI 作为输入；它随后在将新的 RDF 图（或模型）返回给用户界面层之前，评估策略的底层逻辑。可解引用的 URI 指向一个配置文档，该文档本身包含指向机构资源策略以及数据层中机构资源的其他可解引用\
  \ URI。机构资源是一个包含一个或多个分级级别三元组的 RDF 文档；例如，如果包含情报信息，整个 RDF 文档将被标记为敏感，或者某些三元组子集可能包含实际情报信息。因此，机构需要不止一种类型的策略来实现对其资源的细粒度控制。因此，策略由一个接口定义，该接口允许实现每种策略的逻辑。策略引擎在将新的\
  \ RDF 图（或模型）返回给用户界面层之前，评估策略的底层逻辑。通过将其策略迁移到云端，机构克服了先前策略定义数量上的限制。以下小节总结了各种策略类型。在以下小节中，我们将讨论策略引擎层的细节。该层包含多种策略类型，例如访问控制、编辑和信息共享等。我们还将通过依次讨论这些策略类型，论证灵活策略引擎的必要性。\n\
  \n###### 访问控制策略引擎\n\n访问控制策略授权一组**用户**在**环境**中对一组**资源**执行一组**操作**。除非通过一条或多条访问控制策略授权，否则用户无法访问系统的任何资源。有不同种类的访问控制策略，可归纳为三大主要类别\
  \ SAMA2001。这些策略通过它们对**用户**、**操作**和**对象**集合施加的约束而有所不同（访问控制模型通常将**资源**称为**对象**）。这三类是：(1)\
  \ RBAC，基于角色限制访问；(2) 自主访问控制 (DAC)，基于用户身份控制访问；(3) 强制访问控制 (MAC)，基于中央权威机构确定的强制性法规控制访问。\n\
  \n\n\n\n基于 RBAC 的策略常用于简化策略映射的管理，这是三类访问控制策略的共同特征。策略的创建和可管理性对于实现对共享资源更细粒度的访问控制至关重要。我们采用的约定是：权限是一个唯一的（`action`，`resource`）对。给定\
  \ `n` 个资源、`m` 个用户以及仅包含两个动作（读、写）的动作集，我们最多有 `2 × n` 个可能的权限。这产生了 `m × (2 × n) = c[1]n`\
  \ 个映射。RBAC 的一个进一步改进是：从可能的 `r` 个角色集合中，至少存在一个角色被分配了两个或更多用户。因此，我们有 `r × (2 × n) = c[2]n`\
  \ 个映射，并且我们假设 `c[2] ≤ c[1]`。然而，即使有这种简化，在动态敏捷的社区中，为实现更细粒度的访问控制所需的策略数量可能依然难以处理。我们以云为中心的策略框架通过赋予机构支持和扩展其访问控制策略的能力，以满足其不断增长的安全需求，从而解决了这一问题。\n\
  \n*   **编辑策略引擎**：编辑策略在向用户发布文档前识别并移除其中的敏感信息。与限制访问的访问控制策略不同，编辑策略通过确保在向用户查询提供最终 RDF\
  \ 图（称为编辑后的图）之前移除（或模糊处理）敏感或专有信息，从而鼓励信息共享。编辑策略依赖转换操作来规避任何识别性或敏感信息。目前支持的编辑策略引擎依赖一种基于图文法方法的图转换技术（见文献\
  \ [[EHRI2006]](#ch16.xhtml#ref16_24)、[ROZE2007]）。基本上，将编辑策略应用于有向标记的 RDF 图包含两个步骤：(i)\
  \ 在原始 RDF 图中识别我们要保护的资源（或子图）。这可以通过图查询（即配备正则表达式的查询）完成。(ii) 以图转换规则的形式将编辑策略应用于此已识别资源。文献\
  \ [CADE2011b] 中使用了这种图转换的一种实现来编辑溯源图。\n\n*   **信息共享策略引擎**：信息共享策略允许机构确定其资源与其他机构资源共享或组合的上下文。信息共享策略引擎包含处理同时请求两个或更多\
  \ RDF 图信息的查询的逻辑。我们使用以下 SPARQL 查询进行说明。\n\n```\nSELECT →B FROM NAMED uri1 FROM NAMED\
  \ uri2 WHERE P\n```\n\n其中 `P` 是图模式，`→B` 是出现在 `P` 中的变量元组，`uri1` 和 `uri2` 是资源 `R1`\
  \ 和 `R2` 的可解引用 URI。资源 `R1` 和 `R2` 可能来自同一机构（当机构严格要求基于机密性顾虑对其资源进行分区时），也可能分别属于机构 1\
  \ 和机构 2。因此，这些资源中的每一个都可能定义各自的信息共享策略规则。我们定义了一个算子 `⊙`，使得信息共享策略现在在 `uri1 ⊙ uri2` 上求值。算子\
  \ `⊙` 可以作为 RDF 图上的图操作来实现。注意，`⊙` 可以是以下算子之一：`∩`、`∪` 或 `−`，也可以应用于原始 RDF 图或由算子 `⊙` 产生的前一个图。为了执行算子\
  \ `⊙`，我们递归地定义图如下。\n\n*   `ε` 是一个图。\n*   图的集合在交集、并集和差集运算下封闭。设 `G[1]` 和 `G[2]` 为两个图，则\
  \ `G[1] ∪ G[2]`、`G[1] ∩ G[2]` 和 `G[1] − G[2]` 均为图，满足：若 `t ∈ G[1] ∪ G[2]` 则 `t ∈\
  \ G[1]` 或 `t ∈ G[2]`；若 `t ∈ G[1] ∩ G[2]` 则 `t ∈ G[1]` 且 `t ∈ G[2]`；若 `t ∈ G[1] −\
  \ G[2]` 则 `t ∈ G[1]` 且 `t ∉ G[2]`。\n\n以下 RDF 图列出了一个组合策略配置文档的三元组，该文档包含嵌入共享两个资源 `R1`\
  \ 和 `R2` 逻辑的策略，这两个资源分别属于机构 1 和机构 2。\n\n```\n###### entity\n<http://policy.org/entity/pol#Combined1_1_1>\n\
  pol:owner <http://policy.org/entity/pol#Agency1>;\npol:rule <http://policy.org/entity/pol#Cprule1_1_1_1>.\n\
  \n###### mappings\n<http://policy.org/entity/pol#Cprule1_1_1_1>\npol:agency <http://policy.org/entity/pol#Agency2>;\n\
  pol:operator \"UNION\";\npol:type \"combined1\".\n```\n\n此策略在机构层面生效。例如，机构 1 将其所有资源作为并集与机构\
  \ 2 的所有资源共享。策略类型允许机构拥有共享模式。例如，类型 `combined1` 提供机构级别的共享，而另一种策略类型 `combined2` 可提供更细粒度的控制，以确定机构\
  \ 1 如何将其每个资源与机构 2 的资源分类进行共享。换句话说，信息共享策略可以结合关于机构的上下文信息及其每个资源在资源级别的元数据。以下展示了我们信息共享策略的两种策略类型：\n\
  \n1.  `combined1`：`∀r1∈Agency1, ∀r2∈Agency2, use r1∪r2`。该策略声明机构 1 以资源并集的方式与机构 2\
  \ 共享其所有资源。\n2.  `combined2`：设 `r1[1], r1[2], …, r1[n] ∈ Agency1` 使用 `r1[1] ∪ r2,\
  \ r1[2] ∩ r2, ∀r2∈Agency2`。该策略提供更细粒度的控制。\n\n*   **溯源策略引擎**：有时在定义策略时需要考虑 RDF 图中三元组之间的关系。迄今讨论的三种策略类型无法解决敏感信息隐含在\
  \ RDF 图各种路径中的情况。本节将探讨其他策略引擎。重点将放在定义针对溯源图上访问控制和编辑策略执行的策略引擎上。我们将基于文献 [CADE2011a]（讨论溯源的访问控制策略语言）和\
  \ [CADE2012b]（讨论如何对溯源执行编辑）来构建这些策略引擎的逻辑。我们将首先给出一个溯源图示例及其中可能存在的溯源信息类型。然后，将简要介绍在溯源图上执行策略背后的一些理论定义。\n\
  \n图 16.18 使用 RDF 表示展示了一个情报示例作为溯源图，概述了文档通过位于某不友好领土（或构成潜在威胁的另一机构）的服务器的流向。该文档被给了一位记者。该溯源图的内容可用于评估文档来源服务器（即示例图中的进程）的可信度。该示例溯源图还展示了实际溯源的基本骨架，实际溯源通常带有指示上下文信息（如时间和位置）的\
  \ RDF 三元组注释。注意谓词（即弧）使用 OPM 抽象谓词标签（见文献 [[MORE2010]](#ch16.xhtml#ref16_44)），且最终报告可追溯至一名\
  \ CIA 特工。\n\n![图 16.18 溯源图](img/fig16_18.jpg)\n\n图 16.18 溯源图\n\n图 16.18 中嵌入的信息代表一个有向\
  \ RDF 图。图 16.18 中的溯源路径定义如下：\n\n\n\n\n###### 定义 3：溯源路径\n\n给定一个溯源图，溯源路径 `(s p o)`\
  \ 是一条路径 $s\\overset{p}{\\rightarrow}o$，它使用正则表达式在溯源词汇表 `V` 上定义。\n\n###### 定义 4：正则表达式\n\
  \n设 $\\Sigma$ 为 `V` 中术语的字母表，则正则表达式集合 `RE(\\Sigma)` 通过归纳定义如下：\n\n*   $\\forall x\
  \ \\in \\Sigma, x \\in RE(\\Sigma)$；\n*   $\\Sigma \\in RE(\\Sigma)$；\n*   $\\varepsilon\
  \ \\in RE(\\Sigma)$；\n*   若 $A \\in RE(\\Sigma)$ 且 $B \\in RE(\\Sigma)$，则：\n   \
  \ `A|B`, `A/B*`, `A+`, `A?` $\\in RE(\\Sigma)$。\n\n符号 `|` 和 `/` 分别被解释为逻辑 OR 和组合。\n\
  \n我们的意图是通过带有 `*` 的边来定义两个节点之间的路径，用于表示包括长度为 0 在内的任意长度路径，或用 `+` 表示至少长度为 1 的路径。因此，对于两个节点\
  \ `x`、`y` 和谓词名称 `p`，$x{(\\overset{p}{\\rightarrow})}^{*}y$ 和 $x{(\\overset{p}{\\\
  rightarrow})}^{+}y$ 是图 `G` 中的路径。\n\n扩展了正则表达式的 SPARQL 查询 [[HARR2010]](#ch16.xhtml#ref16_31)\
  \ 可以按如下方式定义图 16.18 中溯源图的资源（或子图）：\n\n###### 示例 16.1：溯源路径查询\n\n```\nSelect ?x\n{ex:PubRpt1\
  \ arq:OnPath(\"([opm:WasGeneratedBy]/[opm:WasTriggeredBy]/[ex:location])\" ?x).\
  \ }\n```\n\n该查询将返回作为变量 `x` 绑定的位置，可用于定位原始报告泄露（及泄漏）的源头。这也可用于提醒策略设计人员为其各自机构的报告和服务器添加适当的策略。\n\
  \n*   **策略序列**：在机构资源上执行策略的结果是一个策略序列。特别地，受保护资源可能会使用多个策略引擎和策略类型的服务。每种策略类型都会生成其输入 RDF\
  \ 图的一个新子图。重要的是要注意，策略的效果直接取决于它接收作为输入的 RDF 图，而且该效果可能不同于该策略最初预期要达到的效果。序列将原始输入图通过一系列转换，直到最终的\
  \ RDF 图被返回给用户。请注意，策略规则（作为 SPARQL 查询实现）返回特定 RDF 三元组集合的成功与否，取决于该规则在策略序列中应用时所处的转换步骤。我们使用以下\
  \ SPARQL 查询进行说明：\n\n```\nCONSTRUCT G WHERE P\n```\n\n`G` 是一个新构建的图，包含一组在输入图中满足条件\
  \ `P` 的三元组。一个保护以下 RDF 三元组的策略，\n\n```\n<http://cs.utdallas.edu/semanticweb/Prov-AC/agency#agent_1>\n\
  foaf:name \"John brown\";\nfoaf:projectHomepage <http://www.agency1.gov/>\n```\n\
  \n如果名称或项目主页三元组中的任意一个先前被前一个策略规则移除或修改，则该策略将失败。\n\n框架中的策略优先级功能帮助机构确定其策略的顺序。在用户界面层，机构配置其策略的顺序。然后策略序列被存储在一个\
  \ RDF 序列文件中（使用 RDF 规范的 `rdf:seq` 特性）。当查询被评估时，策略框架将按预期顺序依次调用每个策略。\n\n*   **规则序列**：以类似的方式，一个策略可以使用一组规则来实现。例如，为了完全编辑共享资源，机构可能需要一个单独的规则来编辑\
  \ RDF 图中的每个敏感三元组。当输入图中的一个三元组（或一组三元组）满足某些指定标准时，每个规则就会被触发。请注意，每个规则都会转换共享资源的当前状态。因此，规则的每一种排序都会影响最终图（也称为编辑后的图）。\n\
  \n##### 16.3.3.1.3 数据层\n\n在数据层有一个连接工厂，它充当创建连接对象的外观。这些连接对象向策略设计人员暴露与公共方法相同的属性（功能上）。这使得策略设计人员更容易专注于策略引擎设计。策略设计人员调用\
  \ `RDF Policy Factory`，它返回一个 `RDF model object`。这个 `RDF model object` 由一个连接存储支持，该存储可以是本地连接、关系数据库连接或云连接。在注册过程中，会给机构一个机会来决定它想在哪里存储其资源和配置文档。建议将较小的配置文档存储在本地磁盘上（或本地数据库中），以便快速访问它们。本地连接还消耗较低的带宽，提供实时访问，并支持部署前的开发。然而，机构可能决定将它们存储在私有云中（或远程数据库服务器上），以利用那里的额外保护。\n\
  \n连接工厂还使机构能够将其资源存储在任何云基础设施中。例如，机构的资源可能位于私有云、社区云或公有云上。私有云部署提供更多控制权，因为机构可以托管自己的云。社区云为特定社区的专属访问而配置，从而服务于合作机构的共同利益。公有云向公众开放，因此由于失去对上传到公有云的数据的控制，更容易受到更多漏洞的影响。机构可以选择使用混合连接，并同时采用多种部署模型（例如混合云模型）。\n\
  \n#### 16.3.3.2 我们的策略引擎框架的特性\n\n在以下小节中，我们介绍我们策略引擎框架的一些新颖特性。\n\n##### 16.3.3.2.1\
  \ 策略互惠性\n\n策略互惠性使机构能够在了解其他机构、其资源或策略规范的情况下指定策略。这通过注册过程成为可能，在注册过程中，机构提供关于其自身、其资源及相关策略的元数据。以下讨论提供了策略互惠性的场景。\n\
  \n`Agency1` 希望在 `Agency2` 也与其共享资源的情况下共享其资源。当前的访问控制和编辑策略不提供这种互惠性。我们的框架提供信息共享策略，允许代理基于合作机构之间的互惠性和共同利益来定义策略。\n\
  \n我们提供以下两个示例信息共享策略：\n\n1.  $\\forall r_1 \\in Agency1, \\forall r_2 \\in Agency2,\
  \ \\text{use } r_1 \\cup r_2$。\n\n    该策略声明 `Agency1` 将其所有资源与 `Agency2` 的任意资源作为资源的并集进行共享（即\
  \ $\\odot \\in \\{\\cup\\}$）。\n\n2.  设 $r_1[1], r_1[2], \\dots, r_1[n] \\in Agency1$。`Agency1`\
  \ 可以使用 $r_1[1] \\cup r_2, r_1[1] \\cap r_2, \\forall r_2 \\in Agency2$。\n\n    该策略提供了更细粒度的控制，并定义了组合算子\
  \ $\\odot \\in \\{\\cap, \\cup\\}$。\n\n*   **条件策略**：策略互惠性的一个结果是允许使用条件共享策略。例如，如果\
  \ `Agency2` 不将 `Agency1` 的资源共享给 `Agency3`，则 `Agency1` 与 `Agency2` 共享其资源。我们提供以下示例信息共享策略：\n\
  \n1.  $\\forall r_1 \\in Agency1, \\forall r_2 \\in Agency2, Agency1 \\text{ 定义\
  \ } r_1 \\cap r_2$。如果 $\\forall r_3 \\in Agency3$，则\n    *   `Agency2` 未定义形式为 $r_1\
  \ \\cap r_3$ 的任何共享策略，\n    *   或 `Agency2` 未定义形式为 $r_1 \\subseteq r_2 \\odot r_3$\
  \ 的任何共享策略，其中 $\\odot \\in \\{\\cup, \\cap\\}$。\n\n*   **策略对称性**：策略互惠性的另一个结果是在策略共享中具有对称性。例如，如果\
  \ `Agency2` 也使用相同的组合算子 $\\odot` 与 `Agency1` 共享其资源，则 `Agency1` 使用组合算子 $\\odot` 与\
  \ `Agency2` 共享其资源。我们提供以下示例信息共享策略：\n\n\n\n\n1. ∀`r1`∈ `Agency1`, ∀`r2`∈ `Agency2`,\
  \ `Agency1` uses `r1`∪ `r2` if `Agency2` also uses `r2` ∪ `r1`.\n\n##### 16.3.3.2.2\
  \ 开发和扩展策略\n\n为了在信息环境中实现机动自由，并交付信息力量以确保任务成功，机构应能够快速开发策略并根据需要部署它们。接下来我们将讨论机构在策略开发期间和之后可用的功能。\n\
  \n*   **策略开发：** `Agency1` 希望模拟实时环境并创建测试场景，以可视化每个策略配置的结果。我们的策略框架提供三种配置：(i) 用于开发和测试的独立版本；(ii)\
  \ 由关系数据库支持的版本；(iii) 一种基于云的版本，在保持低设置和运营成本的同时实现高可用性和可扩展性。\n\n*   **排序效应：** `Agency1`\
  \ 希望根据用户的凭据改变用户查询的结果集。策略序列功能可用于通过排列策略及其各自的规则来配置不同的结果。\n\n*   **快速弹性：** `Agency1`\
  \ 发现其现有策略配置中存在近期安全漏洞，并希望通过支持更细粒度的策略来扩展（或增加）其现有策略集。我们的策略引擎提供了一个所有策略都应实现的策略接口；因此，我们可以根据需要添加更新类型的策略。此外，我们的策略引擎赋予机构快速弹性，即我们的策略框架提供的能力似乎是无限的。\n\
  \n*   **位置独立性：** `Agency1` 希望将其资源存储在更接近消费地的地方，但在策略层几乎不需要更改或无需更改。我们的策略引擎提供位置独立性，即策略引擎对资源的确切位置没有控制权或知情权，但可以通过连接管理器使用指定位置来访问资源。请注意，机构的资源可以在地理上位于任何云中。通过可解引用的\
  \ URE 定位任何资源的能力提供了极大的灵活性。\n\n*   **部署模型：** `Agency1` 可以利用不同的部署模型。例如，私有云、混合云、社区云或公有云。连接管理器允许机构根据不同的风险因素和保护数据机密性的目标，从连接类型列表中进行选择。\n\
  \n##### 16.3.3.2.3 资源理由证明\n\n溯源提供了关于信息为何被操纵的解释，以及对信息操纵源头的追踪。这在机构之间建立了信任，从而促进了为共同目标建立伙伴关系。\n\
  \n`Agency1` 向 `Agency2` 请求资源 `R2` 的理由证明。当前的商业访问控制策略主要旨在保护单个数据项，而当前的编辑策略旨在编辑文本和图像。我们的策略引擎允许代理定义针对溯源的策略；因此，`Agency2`\
  \ 可以向 `Agency1` 提供溯源，但通过使用访问控制或编辑策略来保护它。\n\n##### 16.3.3.2.4 策略规范与执行\n\n我们的架构设计支持策略的高层规范，从而将业务层与特定的策略实现分离开来。\n\
  \n`Agency1` 希望用高层语言（例如 `XACML`）表达其策略，并倾向于不学习 `RDF` 或其任何变体。框架在用户和策略引擎层之间暴露了一个 Web\
  \ 接口层，用户可以在其中指定其策略，而独立于策略的实际实现。一个合适的适配器（也称为数据转换器）将把每个高层策略规范转换为相应策略所使用的适当 `RDF` 表示，该策略保护机构的资源。\n\
  \n通过使用形式化词汇（特别是 `OWL` 的一个子语言）扩展 `RDF`，策略可以使用比 `RDF` 更具表现力的语言来指定。`OWL` 具有基于描述逻辑的形式语义，描述逻辑是一阶逻辑的一个可判定片段。因此，通过支持这种适配器模式，我们的框架扩展为能够处理用\
  \ `OWL` 指定的语义策略，并且高层策略可以使用现有的或自定义构建的转换器转换为合适的 `OWL` 子语言。\n\n## 16.4 相关工作\n\n###\
  \ 16.4.1 研究工作\n\n虽然有一些相关工作，但没有任何一项为云中的 `AIS` 提供了解决方案，也没有进行过此类正式的策略分析。\n\n#### 16.4.1.1\
  \ 云中的安全数据存储与检索\n\n云安全最近受到关注 [TALB09]。一些在基础设施层面实施的工作已有报道 [OMAL09]。此类开发工作是保护云基础设施安全的重要一步，但仅处于起步阶段。我们系统的目标是在\
  \ `Hadoop` [UTD1] 提供的安全性之上增加另一层安全性。一旦 `Hadoop` 提供的安全性变得健壮，只会增强我们系统的有效性。亚马逊和微软也为其云计算产品进行了类似的工作\
  \ [AMAZ2016, MARS2010]。然而，这些工作属于公共领域，而我们的系统是为私有云基础设施设计的。这一区别因素使我们的基础设施比公共基础设施更“受信”，在公共基础设施中数据必须以加密格式存储。\n\
  \n#### 16.4.1.2 SPARQL 查询处理器\n\n关于 `SPARQL` 查询处理的报道工作寥寥无几。这些包括 `BioMANTA` [BIOM]\
  \ 和 `SHARD` [SHAR2011]。`BioMANTA` 提出了对 `RDF` 分子 [DING05] 的扩展，并实现了一个基于 `MapReduce`\
  \ 的分子存储 [NEWM2008]。它们使用 `MapReduce` 来回答查询。它们最多查询了 400 万个三元组。我们的工作有以下不同之处：首先，我们查询了\
  \ 10 亿个三元组。其次，我们设计了一种存储模式，专门用于提高 `RDF` 数据的查询执行性能。据我们所知，我们是第一个提出使用 `HDFS` 中的平面文件作为\
  \ `RDF` 数据存储模式，并提出 `MapReduce` 作业确定算法来回答 `SPARQL` 查询的。`SHARD`（可扩展、高性能、稳健和分布式）是一个使用\
  \ `Hadoop` Cloudera 发行版的 `RDF` 三元组存储。该项目展示了初步结果，证明了 `Hadoop` 提高 `RDF` 数据集可扩展性的能力。然而，`SHARD`\
  \ 仅将数据存储在三元组存储模式中。它不进行查询规划或重排序，其查询处理器不会最小化 `Hadoop` 作业的数量。没有任何工作纳入安全策略。\n\n####\
  \ 16.4.1.3 基于 RDF 的策略引擎\n\n\n\n存在致力于研究在 RDF 存储上强制执行策略的先前研究。其中包括 [CARM2004] 的工作，该工作使用\
  \ RDF 进行策略规范和执行。此外，策略通常用 RDF 编写。在 [JAIN2006] 中，作者提出了一种用于 RDF 的访问控制模型。他们的模型基于 RDF\
  \ 数据语义，并结合了 RDF 和 RDF Schema (RDFS) 蕴含。此处，保护在资源级别提供，这为他们的框架增加了粒度。其他强制执行 RDF/OWL\
  \ 策略的框架包括 KAGA2002, [USZO2004]。[USZO2004] 描述了 KAoS，这是一个使用 OWL 的策略和域服务框架，既用于表示策略也用于表示域。[KAGA2002]\
  \ 引入了 Rei，这是一个灵活且允许陈述不同种类策略的策略框架。Rei 的扩展最近已被提出 [KHAN2010]。策略规范语言允许用户基于 RDF、DAML+OIL\
  \ 和 OWL 中的领域特定本体开发声明式策略。[REDD2005] 的作者还引入了一个原型 RAP，用于实现具有集成维护能力和访问控制的 RDF 存储。然而，这些框架并未解决\
  \ RDF 存储变得非常大的情况，或策略无法随数据扩展的情况。在一个由 IARPA 资助的项目下，我们开发了用于超大规模 RDF 图处理的技术 [UTD2]。\n\
  \n#### 16.4.1.4 Hadoop 存储架构\n\n针对 RDF 数据的大规模分布式存储和检索技术引起了极大的关注。Castagna 等人 [CAST2009]\
  \ 的工作展示了 RDF 数据并行处理框架的理论设计。这项工作主张使用具有不同粒度级别的数据分发模型，如三元组级别、图级别和数据集级别。针对这种分布式模型的查询随后被划分为一组子查询，分发到包含分布式数据的机器上。所有子查询的结果随后将被合并，以向用户应用程序返回完整结果。研究界存在该理论概念的多种实现。这些工作包括\
  \ Choi 等人 [CHOI2009] 和 Abraham 等人 [ABRA2010] 的工作。一种单独的用于存储和检索 RDF 数据的技术利用了对等系统 [ABER2004,\
  \ CAI2004, HART2007, VALL2006]。然而，此类系统存在一些缺点，因为对等系统需要拥有超级节点来存储关于 RDF 数据在节点间分发的信息。另一个缺点是需要将\
  \ SPARQL 查询联合分发到网络中的每个节点。\n\n#### 16.4.1.5 分布式推理\n\nInteGrail 系统使用分布式推理，其愿景是塑造未来的欧洲铁路组织\
  \ [INTE2009]。在 [URBA2009] 中，作者展示了基于 MapReduce 的可扩展 RDFS 推理实现，该实现可在两小时内从真实数据集推断出\
  \ 300 亿个三元组，分别产生 123,000 三元组/秒的输入吞吐量和 327 万三元组/秒的输出吞吐量。他们展示了一些在 MapReduce 中编码 RDFS\
  \ 规则集的非平凡优化，并使用多个真实数据集在包含 64 个计算节点的集群上评估了其实现的可扩展性。\n\n#### 16.4.1.6 访问控制和策略本体建模\n\
  \n已有一些尝试使用语义 Web 技术来建模访问控制和策略模型。在 [CIRI2007] 中，作者展示了如何使用 OWL 和描述逻辑来构建访问控制系统。他们开发了一个高层\
  \ OWL-DL 本体来表达基于角色的访问控制系统的要素，并构建了一个领域特定本体来捕获示例场景的特征。最后，他们将这两个产物结合起来，以考虑策略定义和访问控制决策中的属性。在\
  \ [REUL2010] 中，作者首先展示了一个基于 DOGMA 的安全策略本体，DOGMA 是一个形式化的本体工程框架。该本体涵盖了安全策略的核心要素（即条件、动作、资源），并可轻松扩展以表示特定的安全策略，如访问控制策略。在\
  \ [ANDE2009] 中，作者提出了一种本体驱动的方法，用于信息系统的多级访问控制和溯源。\n\n### 16.4.2 商业发展\n\n#### 16.4.2.1\
  \ RDF 处理引擎\n\n研究和商业 RDF 处理引擎包括 HP 实验室的 Jena、BigOWLIM 和 RDF-3X。尽管这些工具中的一些存储模式和查询处理机制是专有的，但它们都基于某种类型的\
  \ RDF 数据索引策略。然而，只有极少数工具使用以云为中心的架构来处理 RDF 数据，而且这些工具无法扩展到非常大数量的三元组。相比之下，CAISS++ 中的查询处理器将构建为一个行星级的\
  \ RDF 处理引擎，支持所有 SPARQL 算子，并将为 SPARQL 查询提供优化的执行策略，可扩展到数十亿个三元组。\n\n#### 16.4.2.2 基于语义\
  \ Web 的安全策略引擎\n\n正如 第 16.2 节 所述，目前关于基于语义 Web 的策略规范和执行的工作，并未解决针对海量数据和大量用户的策略生成和执行问题。**云：**\
  \ 据我们所知，不存在针对以云为中心的 AIS 的重大商业竞争。由于我们采用了模块化方法来创建工具，我们可以单独迭代优化每个组件（策略引擎、存储架构和查询处理器）。由于我们采取了基于组件的方法，我们将能够适应我们使用的平台的变化（例如\
  \ Hadoop、RDF、OWL 和 SPARQL），而无需依赖特定平台的特定功能。\n\n## 16.5 总结与展望\n\n本章描述了我们对一个称为 CAISS\
  \ 的基于云的信息共享系统的设计和实现。CAISS 利用了我们开发的几项技术以及开源工具。我们还描述了一个理想的基于云的 AIS 系统 CAISS++ 的设计。我们讨论了一系列\
  \ CAISS、CAISS+ 和一个演示系统的实现。\n\n我们开发了 CAISS 和 CAISS++ 的概念验证原型。在 CAISS 的实现中，我们在云中利用了我们的\
  \ SPARQL 查询处理器，策略以 XACML 和 RDF 两种形式指定。我们的策略包括访问控制策略以及信息共享策略。在 CAISS++ 的实现中，我们用 OWL\
  \ 指定策略，在云中开发了策略引擎，并将其与 SPARQL 数据引擎集成。这些系统在 [CADE2012a] 和 [CADE2012b] 中进行了讨论。\n\n\
  \n\n\n### CAISS++：一种基于云的 AIS 框架\n\nCAISS++ 是首个在云端运行的 AIS 框架。如前所述，其理念是让每个组织将其数据和信息共享策略存储在云中。信息将根据这些策略进行共享。我们描述了一个利用语义\
  \ Web 技术的基于云的信息共享框架。我们的框架由一个策略引擎组成，用于为信息共享目的推理策略；还有一个安全数据引擎，用于在云中存储和查询数据。我们还通过示例策略描述了系统的操作。我们的框架具有灵活性，因此可以添加额外的数据源和云。此外，通过为策略引擎使用\
  \ RDF，我们可以添加更复杂的信息共享策略。这是我们系统的主要优势之一。未来的方向包括指定和推理更复杂的策略，以及在真实环境中测试我们的系统。\n\n###\
  \ 未来工作\n\n未来，我们将继续通过实现更复杂的策略以及实现分布式版本 CAISS++ 来增强我们的原型。我们还将对策略的执行进行正式分析。最后，我们将研究多个社交网络用户之间的\
  \ AIS，并探索在实现中使用 Spark、Storm 和 CouchDB 等技术。\n\n## 参考文献\n\n*   **[ABER2004]** K. Aberer,\
