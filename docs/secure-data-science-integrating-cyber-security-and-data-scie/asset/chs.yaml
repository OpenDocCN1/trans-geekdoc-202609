  \n第二部分 共包含四章，介绍了用于网络安全应用的数据科学技术。特别是，重点讨论了强调大数据在恶意软件分析和内部威胁检测中的应用的流数据分析技术。\n\n我们在\
  \ 第 6 章 中讨论了用于恶意软件检测的数据挖掘。特别是，介绍了我们的架构、相关工作和我们的方法。我们还讨论了用于恶意软件检测的数据挖掘工具。特别是，讨论了使用\
  \ `n` 元分析进行特征提取和混合特征检索模型。我们还讨论了我们的实验和数据集。\n\n在 第 7 章 中，我们讨论了什么是流分析（我们也称之为流挖掘），并讨论了一种用于检测恶意软件的方法。我们描述了用于检测新类别（恶意软件）的算法和系统架构。我们讨论了新类别检测过程中的三个主要部分，分别是：(i)\
  \ 在训练期间保存 `used` 空间的清单，(ii) 异常值检测和过滤，以及 (iii) 计算异常值之间的内聚性并将异常值与训练数据分离。我们还展示了如何通过使用聚类进行原始数据缩减使该技术变得高效。最后，我们在多个合成和真实数据集上评估了我们提出的方法，并报告了四个数据集上的结果。\n\
  \n在 第 8 章 中，我们讨论了云计算如何用于为恶意软件检测提供可扩展性。特别是，我们描述了利用云计算进行恶意软件检测的特征提取和选择技术。我们还讨论了数据收集、实验设置、评估技术和获得的结果。\n\
  \n在 第 9 章 中，我们描述了我们利用流数据挖掘进行内部威胁检测的方法，适用于非序列和序列数据。我们提供了内部威胁和流挖掘的综述。我们还讨论了大数据/数据科学技术的可扩展性问题。\n\
  \n既然我们已经讨论了用于网络安全应用的数据科学技术的各个方面，在 第三部分 中，我们将介绍各种安全和隐私增强的数据科学技术。特别是，我们将讨论如何处理针对数据科学技术的恶意攻击。此外，我们还将讨论如何利用数据科学技术增强隐私。\n\
  \n# 第三部分 安全和隐私增强的数据科学\n\n## 第三部分 导言\n\nDOI: [10.1201/9781003081845-17](https://doi.org/10.1201/9781003081845-17)\n\
  \n第三部分 共包含五章，将讨论安全和隐私增强的数据科学。特别是，讨论了针对数据科学技术的攻击以及数据科学技术可能导致的隐私泄露。\n\n第 10 章 讨论了针对数据科学系统的攻击，并描述了我们针对对抗性机器学习（总体而言）和支持向量机学习（特别是）的方法。第\
  \ 11 章 描述了对抗性相关向量机学习。第 12 章 讨论了以决策树为例的隐私增强数据科学。第 13 章 讨论了我们关于面向量化自我应用的隐私感知策略数据管理框架的工作。最后在\
  \ 第 14 章 中，我们讨论了如何将我们的工作应用于特定应用，即 COVID-19 大流行。\n\n# 10 对抗性支持向量机学习\n\nDOI: [10.1201/9781003081845-18](https://doi.org/10.1201/9781003081845-18)\n\
  \n## 10.1 导言\n\n\n\n\n### 安全增强型数据科学：对抗性 SVM 学习\n\n在本章中，我们开始讨论安全增强型数据科学。特别是，我们将讨论数据科学技术如何适应以应对网络攻击。我们将重点关注的具体数据科学技术是\
  \ `SVM`（支持向量机）。\n\n正如 第 3 章 所述，入侵检测和垃圾邮件过滤等学习任务面临对抗性攻击。对抗性利用给现有的学习范式带来了额外的挑战。在当前数据和未来数据共享相同属性这一假设下（这对传统方法至关重要），无法实现学习模型对未来数据的泛化。在存在主动对抗者的情况下，用于学习系统训练的数据不太可能代表系统将来会观察到的未来数据。这种差异不仅仅是简单的随机噪声，大多数学习算法在设计时已经考虑到了这一点。通常导致这些学习算法失效的是有针对性的攻击，旨在通过伪装原本会被检测到的恶意数据，使学习系统失去作用。现有的学习算法无法轻易调整以应对这类攻击，因为在攻击会在多大程度上影响样本空间的结构方面存在极大的不确定性。尽管在训练时给定了恶意数据的样本量和分布，我们仍需要对恶意数据会发生多大变化做出合理的推测，因为复杂的攻击者会迅速适应以逃避检测。需要将能够预言对手为突破系统会走多远的攻击模型纳入学习算法，以构建鲁棒的决策面。在本章中，我们提出了两种攻击模型，它们涵盖了*广泛的攻击范围*，并根据对手的动机进行了定制。每种攻击模型都对对手已知的信息做出了简单且现实的假设。随后，推导出了针对这些攻击模型的最优\
  \ `SVM` 学习策略。更多细节请参阅 [ZHOU2012]。\n\n一些早期工作为对抗性学习中的问题奠定了重要的理论基础 [DALVI2004, KEAR1993,\
  \ LOWD2005b]。然而，早期工作通常做出强假设，例如拥有无限的计算资源，以及双方都完全了解对方。有些提出的攻击模型可能不允许对任意特征集进行更改 [LOWD2005b]。在安全应用中，一些现有研究主要探索在特定应用领域中击败学习算法的实用方法\
  \ [LOWD2005a, PERD2006, WITT2004]。同时，各种学习策略被提出以修复学习算法中特定于应用的弱点 [LI2006, NEWS2005,\
  \ WANG2006]，但结果却为未来的攻击打开了新的大门 [FOGL2006, PERD2006]。关于恶意软件攻击的对抗性机器学习的最新综述见 [MAIO2019]。主要挑战依然在于攻击者不断利用学习系统未知的弱点。无论学习系统的设计看起来多么完善，总存在它无法检测到的“盲点”，随着双方技术实力的发展，威胁不断升级。威胁通常分为两类，一类旨在将恶意内容混过基于学习的检测机制，另一类试图通过提高假阳性和假阴性率来破坏学习系统的可信度\
  \ [BARR2006]。两者之间的灰色地带鲜有研究。在本工作中，我们不再局限于处理特定于应用的攻击和解决学习算法的特定弱点。\n\n我们的主要贡献在于以下三个方面：\n\
  \n*   我们开发了一种学习策略，用于求解一个通用的凸优化问题，其中约束的强度与攻击的强度相关联。\n*   我们推导了针对对手的最优支持向量机学习模型，该对手的攻击策略是在通用且合理的假设下定义的。\n\
  *   我们研究了在两种不同的攻击模型中，不同参数值下所得最优解的性能如何变化。实证结果表明，我们提出的对抗性 `SVM` 学习算法对各种程度的攻击都相当鲁棒。\n\
  \n本章其余部分组织如下。第 10.2 节 介绍对抗性学习领域的相关工作。第 10.3 节 描述我们的方法。第 10.4 节 定义问题，第 10.5 节 描述对抗性\
  \ `SVM` 模型。第 10.6 节 展示人工数据集和真实数据集上的实验结果。第 10.7 节 总结我们的工作并展望未来方向。图 10.1 说明了本章的概念。\n\
  \n![图 10.1 对抗性支持向量机学习。](img/fig10_1.jpg)\n\n图 10.1 对抗性支持向量机学习。\n\n## 10.2 相关工作\n\
  \nKearns 和 Li [KEAR1993] 给出了在存在恶意错误的情况下学习可容忍的恶意错误率的理论上界。他们假设对手拥有无限的计算资源。此外，他们假设对手知晓目标概念、目标分布以及学习算法的内部状态。他们证明了容错不必以效率或简洁性为代价，并且带有恶意错误的学习与标准优化问题之间存在紧密联系。\n\
  \nDalvi 等人 [DALVI2004] 为存在最优对手的学习问题提出了一个博弈论框架。他们将问题定义为两个成本敏感对手之间的博弈：一个 `Naive Bayes`（朴素贝叶斯）分类器和一个采取最优策略的对手。他们假设双方的所有参数对彼此都是已知的，且对手知晓分类器的确切形式。他们提出的对抗感知算法根据最大化条件效用的类别进行预测。寻找最优解仍然计算密集，这在博弈论中是典型的。\n\
  \nLowd 和 Meek [LOWD2005b] 指出假设对手完全了解分类器是不现实的。相反，他们建议对手可以通过向分类器发送查询来确认任意实例的成员资格。他们还假设对手拥有样本空间上的对抗性成本函数，该函数将样本映射为成本值。这一假设本质上意味着对手需要了解整个特征空间才能发起最优攻击。他们提出了一种对抗性分类器逆向工程（`ACRE`）算法，用于学习给定学习算法的漏洞。\n\
  \n\n\n\n### 对抗学习模型\n\n对抗学习问题通常被建模为两个对手之间博弈的游戏。Brückner 和 Scheffer 将对抗预测问题建模为 Stackelberg\
  \ 博弈 [BRUC2011]。为保证最优性，该模型假设对手行为理性。然而，它并不要求存在唯一均衡。Kantarcioglu 等人 [KANT2011] 将该问题视为序贯\
  \ Stackelberg 博弈。他们假设双方玩家都知道彼此的收益函数。他们使用模拟退火算法和遗传算法来搜索纳什均衡。随后，该均衡被用于选择能带来良好均衡性能的最优属性集。提出了采用纳什策略的改进模型\
  \ [BRUC2009, LIU2010]。\n\n其他博弈论模型采用零和极大极小策略。Globerson 和 Roweis [GLOB2006] 考虑了测试时某些特征可能缺失的问题。这与对抗学习相关，因为对手可能会简单地删除恶意数据中权重较高的特征，以增加其逃避检测的机会。他们开发了一个博弈论框架，在该框架中构建的分类器在最坏情况下是最优的。他们的思路是防止对任何单一特征分配过大的权重。他们使用支持向量机模型，当最多可删除\
  \ *K* 个特征时，该模型能最优地最小化合页损失。El Ghaoui 等人 [GHAO2003] 将极大极小模型应用于由超矩形界定的训练数据。他们的模型最小化给定区间内数据的最坏情况损失。针对处理分类时噪声的其他鲁棒学习算法也被提出\
  \ [DEKE2008, DEKE2010, LANC2002, TEO2007]。\n\n我们的工作在几个方面与现有工作不同。首先，我们不对任一方玩家已知的信息做强假设。其次，我们将广域攻击和定向攻击均纳入\
  \ SVM 学习框架中进行考量。最后，我们研究了极大极小解在广泛参数范围内面对攻击时的鲁棒性。\n\n## 10.3 我们的方法\n\n虽然我们方法的细节将在本章后面讨论，但本节将提供我们方法的概述。我们方法背后的思想是：对手试图尽可能多地了解我们所使用的数据以及模型。基于对手所学到的知识，它将试图挫败我们的模型，使自己不被捕获。因此，采用\
  \ SVM 方法时，对手试图将尽可能多的实例推向“良性”类别。这样，我们的模型就会将一些恶意实例视为良性实例。为了对抗对手的这种行为，我们尝试移动 SVM 分界线。我们在考虑多种因素后这样做，详见\
  \ 10.3 节 和 10.4 节。此外，移动分界线的方式取决于我们所考虑的攻击模型。当我们移动分界线时，一些伪装成良性实例的恶意实例将显露为恶性实例。\n\n\
  ![图 10.2 (a) 恶意实例伪装成良性实例。(b) 通过移动分界线，捕获了更多恶意实例。](img/fig10_2.jpg)\n\n图 10.2 (a)\
  \ 恶意实例伪装成良性实例。(b) 通过移动分界线，捕获了更多恶意实例。\n\n在后续章节中，我们将介绍攻击模型以及基于 SVM 的学习模型的关键点。更多细节请见\
  \ [ZHOU2012]。我们讨论两种攻击模型：自由范围攻击模型和受限攻击模型。在自由范围攻击模型中，对手可以将恶意数据移动到特征空间中的任意位置。在受限攻击模型中，对手只能将恶意数据移动得更接近目标点。\n\
  \n## 10.4 问题与攻击\n\n### 10.4.1 问题定义\n\n用以下符号表示样本集：\n\n```\n{(x[i], y[i]) ∈ (X, Y)}[i\
  \ = 1]^(n), where x[i] is the i^(th) sample and y[i] ∈ {−1, 1} is its label, X ⊆\
  \ ℝ^(d)\n```\n\n是一个 *d* 维特征空间，*n* 是样本总数。我们考虑一个对抗学习问题，其中对手修改恶意数据以逃避检测，从而达到其预谋目标。对手有自由仅通过向\
  \ `x[i] | y[i] = 1` 添加非零位移向量 *δi*，沿任意方向移动恶意数据（*y[i] = 1*）。也就是说，目标是学习一个假设 *H*，使其能抵御通过添加非零位移向量\
  \ *δ* 来修改恶意数据的对抗攻击。例如，在垃圾邮件过滤中，对手可能向垃圾邮件添加正常词汇以击败垃圾邮件过滤器。另一方面，对手将无法修改合法邮件。\n\n我们不对对手对学习系统的了解做具体假设。相反，我们仅假设修改恶意数据存在权衡或成本。例如，对手常采用的一种实用策略是，在特征空间中将恶意数据移动到尽可能接近良性数据频繁出现的位置。然而，对手只能在不完全丧失恶意数据效用的前提下修改其位置。如果对手在特征空间中将数据点移离其自身类别太远，可能不得不牺牲原始数据点的大量恶意效用。例如，在信用卡欺诈检测问题中，攻击者可能选择用被盗信用卡消费“合适”的金额来模仿合法购买。这样做会让攻击者损失一些潜在利润。\n\
  \n### 10.4.2 对抗攻击模型\n\n我们提出两种攻击模型：*自由范围* 和 *受限*，每种模型都对对手已知信息的程度做出了简单且现实的假设。这两种模型在以下方面的含义不同：(i)\
  \ 对手对良性数据的了解程度，以及 (ii) 因修改恶意数据而导致的效用损失。*自由范围* 攻击模型假设对手有自由将数据移动到特征空间中的任意位置。*受限* 攻击模型是一种更保守的攻击模型。该模型基于这样的直觉构建：对手不愿让数据点在特征空间中偏离其原始位置太远。原因是较大的位移往往意味着恶意效用的损失。\n\
  \n#### 10.4.2.1 自由范围攻击\n\n\n\n在此模型中，对手可将恶意数据移动到域中的任意位置。对手所需的唯一知识是每个特征的有效取值范围。\n\n\
  设 `x[j]^(max)` 和 `x[j]^(min)` 分别为数据点 `x[i]` 的第 `j` 个特征——`x[ij]`——所能取得的最大值和最小值。就所有实际目的而言，我们假设\
  \ `x[j]^(max)` 和 `x[j]^(min)` 都是有界的。例如，对于高斯分布，它们可设为 0.01 和 0.99 分位数。由此产生的范围将覆盖大多数数据点并丢弃少数极端值。攻击随后被限制为以下形式：\n\
  \n`Cf − x[ij]) ≤ δ[ij] ≤ Cf − x[ij]), ∀j ∈ [1, d]`，\n\n其中 `C[f] ∈ [0,1]` 控制攻击的激进程度。`C[f]\
  \ = 0` 表示无攻击，而 `C[f] = 1` 对应允许数据移动范围最宽的最激进攻击。更正式地，自由范围攻击模型可定义如下：\n\n```\narg min_{w,b,ξ_i,t_i,u_i,v_i}\
  \ 1/2 ||w||² + C Σ_i ξ_i\ns.t. ξ_i ≥ 0\n     ξ_i ≥ 1 - y_i · (w · x_i + b) + t_i\n\
  \     t_i ≥ Σ_j C_f (v_ij (x_j^max - x_ij) - u_ij (x_j^min - x_ij))\n     u_i -\
  \ v_i = 1/2 (1 + y_i) w\n     u_i ≥ 0\n     v_i ≥ 0\n```\n\n此攻击模型的巨大优势在于，就数据修改而言，它足够通用以涵盖所有可能的攻击场景。当与学习模型配对时，该组合将针对最严重的攻击产生良好性能。然而，当存在轻微攻击时，学习模型会变得过于“多疑”，其性能也会相应下降。接下来，我们提出一种更现实的攻击模型，其中显著的数据篡改会受到惩罚。\n\
  \n#### 10.4.2.2 受限攻击\n\n在此模型中，对手可将恶意数据移动得更接近目标点。设 `x[i]` 为对手旨在篡改的恶意数据点。设 `x[i]^(t)`（一个\
  \ `d` 维向量）为对手希望将 `x[i]` 推向的潜在目标。对手根据其对良性数据分布的估计来选择 `x[i]^(t)`。理想情况下，对手会为每个 `x[i]`\
  \ 优化 `x[i]^(t)`，以最小化篡改成本并最大化可达成的目标。最优选择 `x[i]^(t)` 是理想的，但通常需要大量关于特征空间的知识，有时还需要了解学习算法的内部运作\
  \ [DALV2004]。更现实的是，对手可将 `x[i]^(t)` 设为良性数据的估计质心、从观测到的良性数据中采样的数据点，或从估计的良性数据分布生成的人工数据点。请注意，若对手对良性数据知之甚少，`x^(t)`\
  \ 可能是个粗略猜测；若对手知晓训练数据的确切构成，则可能是非常准确的。\n\n在大多数情况下，对手无法按意愿将 `x[i]` 改为 `x[i]^(t)`，因为\
  \ `x[i]` 可能会失去太多恶意效用。因此，对于 `d` 维特征空间中的每个属性 `j`，我们假设对手添加\n\n`δ[ij] to x[ij]`\n\n\
  其中\n\n`|δ[ij]| ≤ |x[ij]^(t) − x[ij]|, ∀ j ∈ d`。\n\n此外，我们对属性 `j` 的位移量设定上界如下：\n\n\
  `0 ≤ (x_ij^t - x_ij) δ_ij ≤ (1 - C_δ |x_ij^t - x_ij| / (|x_ij| + |x_ij^t|)) (x_ij^t\
  \ - x_ij)²,`\n\n其中 `C[δ] ∈ [0, 1]` 为常数，建模因移动 `δ[ij]` 导致的恶意效用损失。此攻击模型基于 `x[ij]` 与\
  \ `x[ij]^(t)` 彼此相距多远，规定了对手可将 `x[ij]` 向 `x[ij]^(t)` 推多远。\n\n项\n\n`1 - C_δ |x_ij^t\
  \ - x_ij| / (|x_ij| + |x_ij^t|)`\n\n为 `δ[ij]` 最多可占 `x[ij]^(t) − x[ij]` 的百分比。当 `C[δ]`\
  \ 固定时，`x[ij]` 越接近 `x[ij]^(t)`，按百分比计 `x[ij]` 被允许向 `x[ij]^(t)` 移动得越多。反之亦然。`x[ij]`\
  \ 与 `x[ij]^(t)` 相距越远，`|δ[ij]|` 将越小。例如，当 `x[ij]` 和 `x[ij]^(t)` 位于原点两侧（即一正一负）时，若 `C[δ]\
  \ = 1`，则不允许任何移动（即 `δ[ij] = 0`）。此模型在伪装数据恶意性与保留其恶意效用之间取得平衡。`(x[ij]^(t) − x[ij]), δ[ij]\
  \ ≥ 0` 确保 `δ[ij]` 与 `x[ij]^(t) − x[ij]` 同向移动。`C[δ]` 与数据修改后的恶意效用损失相关。`C[δ]` 设定对手为突破决策边界愿牺牲多少恶意效用。较大的\
  \ `C[δ]` 意味着较小的恶意效用损失，而较小的 `C[δ]` 建模更大的恶意效用损失。因此，较大的 `C[δ]` 导致攻击较不激进，而较小的 `C[δ]`\
  \ 导致攻击更激进。\n\n如图 10.3(a)所示，此攻击模型对良好分离的数据效果极佳。当两类数据均靠近分离边界时（如图 10.3(b) 所示），略微改变属性值即足以将数据推过边界。请注意，两图中的\
  \ `X` 和 `Y` 轴均为特征（如图 10.2 所示）。此外，图 10.3(a) 中 `X` 和 `Y` 轴范围为 −0.2 至 0.2，而图 10.3(a)\
  \ 中 `X` 轴范围为 −0.25 至 0.25，`Y` 轴范围为 −0.3 至 0.3（详见 [ZHOU2012]）。在这种情况下，即使 `C[δ]` 设为\
  \ 1，上述模型的攻击与所需相比仍过于激进。我们虽可允许 `C[δ] > 1` 以进一步降低攻击激进度，但为求简洁和更直接的控制，我们改为直接对 `|x[ij]^(t)\
  \ − x[ij]|` 应用折扣因子 `C[ξ]` 以建模攻击的严重程度：\n\n`0 ≤ (x_ij^t - x_ij) δ_ij ≤ C_ξ (1 - |x_ij^t\
  \ - x_ij| / (|x_ij| + |x_ij^t|)) (x_ij^t - x_ij)²,`\n\n其中 `C[ξ] ∈ [0, 1]`。较大的 `C[ξ]`\
  \ 产生更大量的数据移动，较小的 `C[ξ]` 设定更窄的数据移动限制。结合这两种情况，*受限攻击*模型如下：\n\n`0 ≤ (x_ij^t - x_ij)\
  \ δ_ij ≤ C_ξ (1 - C_δ |x_ij^t - x_ij| / (|x_ij| + |x_ij^t|)) (x_ij^t - x_ij)².`\n\
  \n![图 10.3 (a) 数据良好分离。 (b) 数据杂乱地分布在分离边界附近。 数据良好分离和数据杂乱地分布在分离边界附近。](img/fig10_3.jpg)\n\
  \n图 10.3 (a) 数据良好分离。 (b) 数据杂乱地分布在分离边界附近。 数据良好分离和数据杂乱地分布在分离边界附近。\n\n更正式地，受限攻击模型可定义如下：\n\
  \n\n\n\n## 10.5 对抗性 SVM 学习\n\n我们现在针对上一节讨论的两种攻击模型，分别提出一种对抗性支持向量机模型（AD-SVM）。我们假设对手无法修改无害数据。请注意，该假设可以放宽，以建模无害数据也可能被篡改的情况。\n\
  \n### 10.5.1 针对自由范围攻击模型的 AD-SVM\n\n我们首先考虑自由范围攻击模型。合页损失模型如下：\n\n```\nh(w, b, x_i)\
  \ = {\n    max_δ_i ⌊1 - (w · (x_i + δ_i) + b)⌋ +   if y_i = 1\n    ⌊1 + (w · x_i\
  \ + b)⌋ +                   if y_i = -1\n}\ns.t.    δ_i ≺ C_f (x^max - x_i)\n  \
  \      δ_i ≻ C_f (x^min - x_i)\n```\n\n其中 `δ_i` 是 `x_i` 的位移向量，`≺`、`≻` 表示分量级不等式。\n\
  \n遵循标准 SVM 风险公式，我们得到：\n\n```\narg min_{w,b}  Σ_{i|y_i=1} max_δ_i ⌊1 - (w · (x_i\
  \ + δ_i) + b)⌋ +\n               Σ_{i|y_i=-1} ⌊1 + (w · x_i + b)⌋ +\n          \
  \     μ ||w||²\n```\n\n合并正负实例的情况，这等价于：\n\n```\narg min_{w,b}  Σ_i max_δ_i ⌊1 - y_i(w\
  \ · x_i + b) - ½(1 + y_i)w · δ_i⌋ +\n               μ ||w||²\n```\n\n请注意，当选择 `δ_i`\
  \ 以最小化其对间隔的贡献时，即可获得 `x_i` 的最坏情况合页损失，即：\n\n```\nf_i = min_δ_i ½(1 + y_i)w · δ_i\n\
  s.t.    δ_i ≺ C_f (x^max - x_i)\n        δ_i ≻ C_f (x^min - x_i)\n```\n\n其中 `δ_i`\
  \ 是 `x_i` 的位移向量，`≺`、`≻` 表示分量级不等式。\n\n这是一个关于 `w` 和 `δ_i` 的不相交双线性问题。在这里，我们关心的是在给定\
  \ `w` 的情况下，发现 `δ_i` 的最优赋值。我们可以将双线性问题归约为关于 `u_i ∈ ℝ^d`、`v_i ∈ ℝ^d` 的以下非对称对偶问题，其中\
  \ `d` 是特征空间的维度：\n\n```\ng_i = max - Σ_j C_f (v_ij (x_j^max - x_ij) - u_ij (x_j^min\
  \ - x_ij))\n或\ng_i = min Σ_j C_f (v_ij (x_j^max - x_ij) - u_ij (x_j^min - x_ij))\n\
  s.t.    (u_i - v_i) = ½(1 + y_i)w\n        u_i ≻ 0\n        v_i ≻ 0\ns.t.    (u_i\
  \ - v_i) = 1(1 + y_i)w\n```\n\nSVM 风险最小化问题可重写如下：\n\n```\narg min_{w,b,t_i,u_i,v_i}\
  \  ½||w||² + C Σ_i ⌊1 - y_i · (w · x_i + b) + t_i⌋ +\ns.t.    t_i ≥ Σ_j C_f (v_ij\
  \ (x_j^max - x_ij) - u_ij (x_j^min - x_ij))\n        u_i - v_i = ½(1 + y_i)w\n \
  \       u_i ≻ 0\n        v_i ≻ 0\n```\n\n通过添加松弛变量和线性约束以消除合页损失的非可微性，我们可以将问题重写如下：\n\
  \n```\narg min_{w,b,ξ_i,t_i,u_i,v_i}  ½||w||² + C Σ_i ξ_i\ns.t.    ξ_i ≥ 0\n   \
  \     ξ_i ≥ 1 - y_i · (w · x_i + b) + t_i\n        t_i ≥ Σ_j C_f (v_ij (x_j^max\
  \ - x_ij) - u_ij (x_j^min - x_ij))\n        u_i - v_i = ½(1 + y_i)w\n        u_i\
  \ ≻ 0\n        v_i ≻ 0\n```\n\n### 10.5.2 针对受限攻击模型的 AD-SVM\n\n对于受限攻击模型，我们修改合页损失模型，并遵循相同步骤求解：\n\
  \n```\nh(w, b, x_i) = {\n    max_δ_i ⌊1 - (w · (x_i + δ_i) + b)⌋ +   if y_i = 1\n\
  \    ⌊1 + (w · x_i + b)⌋ +                   if y_i = -1\n}\ns.t.\n(x_i^t - x_i)\
  \ ∘ δ_i ≺ C_ξ (1 - C_δ |x_i^t - x_i| / (|x_i| + x_i^t)) ∘ (x_i^t - x_i)^∘2\n(x_i^t\
  \ - x_i) ∘ δ_i ≻ 0\n```\n\n其中 `δ_i` 表示对 `x_i` 的修改，`≺` 为分量级不等式，`∘` 表示分量级运算。\n\n通过求解以下最小化问题，可获得最坏情况合页损失：\n\
  \n```\nf_i = min_δ_i ½(1 + y_i)w · δ_i\ns.t.    (x_i^t - x_i) ∘ δ_i ≺ C_ξ (1 - C_δ\
  \ |x_i^t - x_i| / (|x_i| + |x_i^t|)) ∘ (x_i^t - x_i)^∘2\n        (x_i^t - x_i) ∘\
  \ δ_i ≻ 0\n```\n\n\n\n\n我们将双线性问题归约为关于 `u[i]` ∈ ℝ^(`d`)、`v[i]` ∈ ℝ^(`d`) 的以下非对称对偶问题，其中\
  \ `d` 是特征空间的维度。\n\n$$\n\\begin{array}{l}\ng_{i} = \\max -\\sum_{j}{e_{ij}u_{ij}}\
  \ \\\\\ng_{i} = \\min \\sum_{j}{e_{ij}u_{ij}} \\\\\ns.t.\\quad (- u_{i} + v_{i})\
  \ \\circ (x_{i}^{t} - x_{i}) = \\frac{1}{2}({1 + y_{i}})w \\\\\n\\quad u_{i} \\\
  succ 0 \\\\\n\\quad v_{i} \\succ 0\n\\end{array}\n$$\n\nSVM 风险最小化问题可重写如下：\n\n$$\n\
  \\underset{}{\\begin{array}{l}\n\\underset{w,b,t_{i},u_{i},v_{i}}{\\text{arg min}}\\\
  quad\\frac{1}{2}\\left\\| w \\right\\|^{2}+C\\sum_{i}\\left\\lfloor 1-y_{i}\\cdot\\\
  left( w\\cdot x_{i}+b \\right)+t_{i} \\right\\rfloor_{+} \\\\\ns.t.\\quad t_{i}\\\
  geq\\sum_{j}e_{ij}u_{ij} \\\\\n\\quad\\left. (-u_{i}+v_{i} \\right)\\circ\\left.\
  \ (x_{i}^{t}-x_{i} \\right)=\\frac{1}{2}{(1+y_{i})}w \\\\\n\\quad u_{i} \\succ 0\
  \ \\\\\n\\quad v_{i} \\succ 0\n\\end{array}}\n$$\n\n在消除合页损失的非可微性后，我们可以将问题重写如下：\n\
  \n$$\n\\begin{array}{l}\n\\underset{w,b,\\xi_{i},t_{i},u_{i},v_{i}}{\\text{arg min}}\\\
  quad\\frac{1}{2}\\left\\| w \\right\\|^{2} + C\\sum_{i}\\xi_{i} \\\\\ns.t.\\quad\\\
  xi_{i} \\geq 0 \\\\\n\\quad\\xi_{i} \\geq 1 - y_{i} \\cdot \\left( {w \\cdot x_{i}\
  \ + b} \\right) + t_{i} \\\\\n\\quad t_{i} \\geq \\sum_{j}{e_{ij}u_{ij}} \\\\\n\\\
  quad\\left( {- u_{i} + v_{i}} \\right) \\circ \\left( {x_{i}^{t} - x_{i}} \\right)\
  \ = \\frac{1}{2}{({1 + y_{i}})}w \\\\\n\\quad u_{i} \\succ 0 \\\\\n\\quad v_{i}\
  \ \\succ 0\n\\end{array}\n$$\n\n## 10.6 实验\n\n### 10.6.1 我们的方法\n\n我们在人工数据集和真实数据集上测试\
  \ AD-SVM 模型。在实验中，我们随着攻击严重程度的增加，考察 AD-SVM 模型的鲁棒性。在针对受限攻击的 AD-SVM 模型中，我们令 `x[i]^(t)`\
  \ 为良性数据的质心。我们还尝试将 `x[i]^(t)` 设为训练集或测试集中随机选取的良性数据点，结果相似。由于篇幅限制，我们不报告后者的结果。\n\n实验中使用的测试数据上的攻击通过以下模型进行模拟：\n\
  \n`δ[ij] = fattack`\n\n其中 `x[i]^(_)` 是从测试集中随机选取的一个良性数据点，`f[attack] > 0` 设定了对手将测试数据移向目标良性数据点的限度。通过控制\
  \ `f[attack]` 的值，我们可以在模拟中规定攻击的严重程度。测试数据上的实际攻击特意设计为不匹配 AD-SVM 中的攻击模型，以免结果产生偏差。对于\
  \ AD-SVM 所考虑的攻击模型中的每个参数 `C[f]`、`C[δ]` 和 `C[ξ]`，我们随着 `f[attack]` 的增加尝试了不同的值。这使我们能够在没有攻击以及攻击比模型预期严重得多的所有情况下，测试我们的\
  \ AD-SVM 模型的鲁棒性。我们将我们的 AD-SVM 模型与标准 SVM 和单类 SVM 模型进行比较。我们使用 `CVX` 实现了 AD-SVM 算法——一个用于指定和求解凸规划的包\
  \ [GRAN2011]。使用 SVM 和单类 SVM 的实验是用 `Weka` 实现的 [HALL2000]。\n\n### 10.6.2 人工数据集实验\n\
  \n我们从具有指定均值和协方差矩阵的二元正态分布生成两个人工数据集。第一个数据集中的数据分离良好。第二个数据集包含靠近分离边界更杂乱的数据。所有结果均在 100\
