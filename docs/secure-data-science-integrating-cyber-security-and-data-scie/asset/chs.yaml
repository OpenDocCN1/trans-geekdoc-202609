  \ 单类 SVM | | 0.684 | 0.436 | 0.406 | 0.399 | 0.400 |\n\n### 10.6.4 设置 `C[f]`、`C[ξ]`\
  \ 和 `C[δ]`\n\n剩余的问题是如何设置攻击模型中的参数。本章提出的 AD-SVM 算法假设使用自由范围攻击模型或约束攻击模型。现实中我们可能不知道确切的攻击模型或攻击者的真实效用函数。然而，正如表\
  \ 10.1 至 10.8 所示，尽管实际攻击可能与我们预期的不符，但通过为更激进的攻击设置 `C[δ]` 或 `C[ξ]` 值，使用约束攻击模型的 AD-SVM\
  \ 算法表现出整体稳健的性能。若使用约束攻击模型，选择 `C[δ]` 0.5（或 `C[ξ]` 0.5）能针对所有 `f[attack]` 值持续返回稳健结果。若在\
  \ AD-SVM 中使用自由范围攻击模型，则必须设置参数值以避免针对温和攻击的过度悲观结果。因此，通常选择 `C[f]` 0.3 能针对所有 `f[attack]`\
  \ 值获得良好的分类结果。\n\n作为一般准则，`C[f]`、`C[δ]` 或 `C[ξ]` 的基线须选为针对领域专家建议的攻击参数效果良好。可通过各种攻击场景的交叉验证来实现。在此基础上，我们逐步增加\
  \ `C[f]` 或 `C[ξ]`，或减小 `C[δ]`。`C[f]`、`C[δ]` 或 `C[ξ]` 的最佳值出现在性能恶化之前。还需注意，只需设置 `C[ξ]`\
  \ 和 `C[δ]` 之一而将另一者固定为 1 即可。此外，`C[f]`、`C[δ]` 和 `C[ξ]` 不必是标量参数。在许多应用中，显然某些属性可变而其他属性不可变。`C[f]`、`C[δ]`/`C[ξ]`\
  \ 参数向量将有助于强制执行这些额外规则。\n\n## 10.7 总结与展望\n\n\n\n\n\n### 对抗学习与鲁棒 SVM 模型\n\n正如前所述，许多学习任务（如垃圾邮件过滤和信用卡欺诈检测）面临着试图逃避检测的主动对手。对于涉及主动对手的学习问题，建模对手的攻击策略并开发鲁棒学习模型以缓解攻击至关重要。这正是本章的两个目标。\n\
  \n我们考虑两种攻击模型：\n\n*   一种 **自由范围** 攻击模型，允许任意数据损坏。\n*   一种 **受限** 攻击模型，预设合理对手在惩罚机制下会设计出的更现实的攻击。\n\
  \n随后，我们针对这两种攻击模型开发了最优 SVM 学习策略。这些学习算法在假设对手修改数据以最大化损失的前提下，最小化合页损失。实验在人工数据集和真实数据集上均已进行。\n\
  \n我们证明，当实际攻击远弱于预期时，最优解可能过于悲观。更重要的是，我们证明了在对数据损坏模型做出宽松假设的情况下，开发出一种更具韧性的 SVM 学习模型是可能的。在\
  \ **受限** 攻击模型下推导出的最优 SVM 学习策略，在广泛的攻击参数范围内提供了更鲁棒的整体性能。\n\n### 对抗攻击与模型韧性\n\n对抗攻击可能导致特征空间中真实数据分布的严重错误表征。缺乏处理样本结构性变化灵活性的学习算法，无法很好地应对那些通过修改数据来改变样本空间构成的攻击。\n\
  \n我们提出了两种攻击模型及针对每种攻击模型的对抗 SVM 学习模型。我们证明，我们的对抗 SVM 模型比标准 SVM 和单类 SVM 模型更能抵御对抗攻击。我们还表明，为应对过度悲观的攻击模型而推导出的最优学习策略，在实际攻击弱得多时可能产生不令人满意的结果。另一方面，建立在受限攻击模型上的学习模型在攻击参数变化时表现得更加一致。\n\
  \n该工作的一个未来方向是将代价敏感度量纳入学习模型。另一个方向是将单一学习模型扩展为集成模型，其中每个基学习器处理不同的一组攻击。\n\n## 参考文献\n\n\
