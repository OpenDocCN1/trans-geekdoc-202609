  ## 8.1 简介\n\n恶意软件是每年许多成功网络攻击的有力手段，包括数据和身份窃取、系统和数据破坏以及拒绝服务；因此，它对许多个人和组织构成了重大的安全威胁。恶意软件包括病毒、蠕虫、特洛伊木马、定时/逻辑炸弹、僵尸网络和间谍软件。研究人员设计了许多技术来应对这些攻击；然而，研究人员在检测和预防攻击方面越成功，野外出现的恶意代码就越复杂。因此，恶意软件作者与恶意软件防御者之间的军备竞赛持续升级。杀毒社区用于检测恶意代码的一种流行技术是*特征检测*。该技术将不受信任的可执行文件与被称为*特征*的唯一标志性字符串或字节模式进行匹配，该特征用作特定恶意代码的标识符。尽管特征检测技术被广泛使用，但它们对零日攻击（新恶意代码）、多态攻击（同一二进制文件的不同加密）或变形攻击（实现相同功能的不同代码）无效\
  \ [CRAN2005]。因此，迫切需要快速、自动化且高效的检测技术，且这些技术需对上述攻击具有鲁棒性。\n\n在第 6 章中，我们讨论了用于恶意软件检测的数据挖掘工具。本章描述了一种专门用于自动生成特征以防御某些恶意软件攻击的数据挖掘技术。由于恶意软件检测工具需要近实时性能，我们在云端开发了数据挖掘工具。也就是说，本章的主要目的是展示如何利用云等大数据技术来提升恶意软件检测技术的性能和可扩展性。我们在本章剩余部分详细描述了该基于云工具的设计与实现。\n\
  \n本章结构安排如下：第 8.2 节讨论恶意软件检测。第 8.3 节讨论相关工作。第 8.4 节讨论分类算法并从分析上证明其有效性。第 8.5 节接着描述利用云计算进行恶意软件检测的特征提取与选择技术，第\
  \ 8.6 节讨论数据收集、实验设置、评估技术和结果。第 8.7 节讨论与我们方法相关的若干问题，最后，第 8.8 节总结我们的结论。图 8.1 阐释了本章的概念。\n\
  \n![图 8.1 用于恶意软件检测的大数据与云。](img/fig8_1.jpg)\n\n图 8.1 用于恶意软件检测的大数据与云。\n\n## 8.2 恶意软件检测\n\
  \n### 8.2.1 作为数据流分类问题的恶意软件检测\n\n使用数据挖掘进行恶意软件检测的问题 [KOLT2004, MASU2008a, SCHU2001]\
  \ 涉及将每个可执行文件分类为*良性*或*恶意*。大多数过去的工作将该问题视为静态数据分类问题，即使用固定的训练数据训练分类模型。然而，恶意软件演变和创新的不断加快的速度不太适合静态训练。持续演变的恶意软件检测最好视为*数据流*分类问题。在此范式中，数据流是一个可执行文件序列，其中每个数据点是一个可执行文件。该流是*无限长度*的。它还观察到*概念漂移*，因为攻击者不断开发新技术以逃避检测，从而改变恶意代码的特征。同样，良性可执行文件的特征也随着编译器和操作系统的演变而变化。\n\
  \n数据流分类是数据挖掘社区的一个主要活跃研究领域，需要克服至少三个挑战：首先，在无限长度、概念漂移的流中存储和维护潜在的无界历史数据用于训练是不可行的 [ZHAN2009]。其次，分类模型必须持续适应以应对概念漂移。第三，如果数据流中数据点没有预定义的特征空间，则随着流的演变，必须选择并提取具有高区分能力的新特征，我们称之为*特征演化*。\n\
  \n前两个问题的解决方案是相关的。概念漂移要求细化假设以适应新概念；必须从训练集中丢弃大部分旧数据。因此，挖掘概念漂移数据流的主要问题之一是选择足以学习演变概念的训练实例。解决第三个问题需要一个持续进行的特征选择过程，因为随着概念的演变，新的、更强大的特征可能会出现，而旧特征可能变得不再占主导地位。如果特征空间很大，那么特征提取和选择的运行时间和内存需求将成为数据流分类系统的瓶颈。\n\
  \n解决概念漂移的一种方法是选择并存储与当前概念最一致的训练数据 [FAN2004]。其他方法，如极快决策树 (VFDT) [DOMI2000]，在新数据出现时更新现有的分类模型。然而，过去的工作表明，集成技术通常对处理意外变化和概念漂移更具鲁棒性\
  \ [KOLT2005, SCHO2005, WANG2003]。这些技术维护一个分类器集合，并在新数据出现时更新该集合。\n\n我们设计并开发了一种多划分、多块集成分类算法，该算法推广了现有的集成方法。与现有的单划分、单块集成方法相比，这种推广在真实世界数据流测试中显著提高了分类准确率。我们方法中的集成由\
  \ `Kv` 个分类器组成，其中 `K` 是常数，`v` 是划分数量，稍后将解释。\n\n我们的方法将数据流划分为大小相等的块。块的大小选择为使每个块中的所有数据都能放入主内存。每个块在标记后，用于训练分类器。每当一个新的数据块被标记时，集成按如下方式更新。我们取最近标记的\
  \ `r` 个连续数据块，将这 `r` 个块划分为 `v` 个分区，并用每个分区训练一个分类器。因此，使用 `r` 个连续块训练了 `v` 个分类器。然后，我们从新训练的\
  \ `v` 个分类器和现有的 `Kv` 个分类器中，根据准确率选择最好的 `Kv` 个分类器来更新集成。因此，集成中分类器的总数保持不变。因此，我们的方法由划分数量\
  \ `v`、块数量 `r` 和集成大小 `K` 这三个参数决定。\n\n\n\n\n我们的方法并不假设流中出现的新数据点会立即被标记。相反，它会推迟集成更新过程，直到最新数据块中数据点的标签变得可用。在此期间，新的未标记数据继续使用当前集成进行分类。因此，该方法非常适合那些分类错误会促使专家用户或其他来源提供修正标签的应用场景。例如，考虑在线信用卡欺诈检测问题。当一笔新的信用卡交易发生时，其类别（`fraud`\
  \ 或 `authentic`）会使用当前集成进行预测。假设一笔欺诈交易被误分类为 `authentic`。当客户收到银行对账单时，他会识别出该错误并向机构报告。通过这种方式，数据点的实际标签被获取，集成也随之相应更新。\n\
  \n### 8.2.2 用于恶意软件检测的云计算\n\n如果数据点的特征空间不是固定的，分类问题的一个子问题就是提取和选择描述每个数据点的特征。与先前的工作（例如\
  \ KOLT2004）一样，我们使用二进制 `n`-gram 作为恶意软件检测的特征。然而，由于可能的 `n`-gram 总数大得令人望而却步，我们审慎地选择具有最大判别力的\
  \ `n`-gram。这一选择过程是持续进行的；随着流的推进，会出现较新的 `n`-gram 来主导较旧的 `n`-gram。这些较新的 `n`-gram 会在我们的模型中替换旧的\
  \ `n`-gram，以识别特定时期的最佳特征。\n\n对于大型数据集，特征提取和选择过程的朴素实现在时间和存储方面都可能非常密集。例如，我们之前的工作 MASU2008a\
  \ 从仅 3,500 个可执行文件的语料库中提取了大约 2.5 亿个 `n`-gram。由于并非所有这些特征都能存储在主内存中，该特征提取过程需要大量的虚拟内存（伴随相关的性能开销）。在一台配备四核处理器和\
  \ 12GB 内存的机器上，提取和选择大约需要两小时的计算时间和数 GB 的磁盘空间。尽管使用的是纯静态数据集；当数据集是动态流时，提取和选择必须反复进行，从而导致主要瓶颈。在本章中，我们考虑了一个大得多的包含\
  \ 10.5 万个可执行文件的数据集，我们之前的方法对此显得力不从心。\n\n因此，我们设计并开发了一种可扩展的特征选择和提取解决方案，该方案利用云计算框架 [DEAN2008]。我们表明，取决于集群节点的可用性，特征提取和选择的运行时间可以缩短\
  \ `m` 倍，其中 `m` 是云集群中的节点数。这些节点是使用廉价商用硬件的机器。因此，该解决方案也具有成本效益，因为不需要高端计算机器。\n\n### 8.2.3\
  \ 我们的贡献\n\n因此，我们的贡献可以总结如下。我们设计并开发了一种广义的多分区、多数据块集成技术，与现有的单分区、单数据块集成方法相比，显著降低了预期分类误差。理论分析证明了该方法的有效性。随后，我们将恶意软件检测问题表述为数据流分类问题，并指出了传统恶意代码检测技术相对于我们的数据挖掘方法的缺陷。\n\
  \n我们利用云计算框架，设计并开发了一种可扩展且具有成本效益的解决方案来解决这一问题。最后，我们将该技术应用于合成生成的数据、真实僵尸网络流量和真实恶意可执行文件，其检测准确率优于其他流数据分类技术。结果表明，我们的集成技术构成了一个基于数据流分类的强大入侵检测工具。\n\
  \n## 8.3 相关工作\n\n我们的工作与恶意软件检测和流挖掘均相关。本节将讨论这两方面。传统的 `signature-based`（基于特征码）恶意软件检测器通过扫描不受信任的二进制文件中的区分性字节序列或\
  \ `features`（特征）来识别恶意软件。恶意软件特有的特征被维护在一个 `signature database`（特征码数据库）中，随着新恶意软件的发现和分析，该数据库必须持续更新。传统上，特征码数据库是由人工专家在新恶意软件出现并被分析时手动推导、更新和传播的。然而，过去十年中新恶意软件出现率的不断攀升，以及自我变异的多态恶意软件的出现，使得手动特征码更新变得不那么切合实际。这促使了用于恶意软件检测的自动化数据挖掘技术的发展（例如\
  \ HAML2009、KOLT2004、MASU2008a、SCHU2001），这些技术能够自动推断先前未见过的恶意软件的特征码。\n\n基于数据挖掘的方法分析可执行文件的内容，如果在可执行文件中发现（或未发现）特定的特征组合，则将其分类为恶意软件。这些恶意软件检测器首先经过训练，以便它们能够泛化恶意和良性可执行文件之间的区别，从而检测未来的恶意软件实例。训练过程涉及使用这些特征进行特征提取和模型构建。基于数据挖掘的恶意软件检测器主要在特征提取方式和用于构建模型的机器学习技术上有所不同。这些技术的性能在很大程度上取决于所提取特征的质量。\n\
  \n在 SCHU2001 报告的工作中，作者从 Windows PE 可执行文件的头部提取 DLL（动态链接库）调用信息（使用 `GNU binutils`）和字符串（使用\
  \ `GNU strings`），以及从可执行文件内容中提取 2 字节序列。DLL 调用、字符串和字节被用作特征来训练模型。模型使用两种不同的机器学习技术进行训练，即\
  \ RIPPER [COHE1996] 和朴素贝叶斯（NB）[MICH1994]，以比较它们的相对性能。在 KOLT2004 中，作者从可执行文件中提取二进制\
  \ `n`-gram 特征，并将其应用于不同的分类方法，如 `k`-近邻（KNN）[AHA1991]、NB、支持向量机（SVM）[BOSE1992]、决策树 [QUIN2003]\
  \ 和 Boosting [FREU1996]。Boosting 与各种其他学习算法结合使用以获得改进的模型（例如，Boosting 决策树）。我们之前关于基于数据挖掘的恶意软件检测的工作\
  \ MASU2008a 从可执行文件中提取二进制 `n`-gram，从反汇编的可执行文件中提取汇编指令序列，并从程序头中提取 DLL 调用信息。该工作中使用的分类模型包括\
  \ SVM、决策树、NB、Boosting 决策树和 Boosting NB。\n\n\n\n\n\n### Hamsa 和 Polygraph\n\nHamsa\
  \ 和 Polygraph [LI2006, NEWS2005] 应用一种简单的数据挖掘形式，利用二进制 `n`-gram 作为特征自动生成蠕虫签名。如果一组\
  \ `n`-gram 仅出现在恶意二进制文件（即正样本）中，而从未出现在良性二进制文件中，这两种方法都会将其识别为蠕虫签名。这在两个重要方面不同于前文讨论的传统数据挖掘方法（包括我们的方法）：\n\
  \n1. Polygraph 和 Hamsa 将注意力局限于仅出现在恶意样本池中的 `n`-gram，而传统数据挖掘技术也会考虑出现在良性样本池中的 `n`-gram\
  \ 以提高分类准确性。\n2. Polygraph 和 Hamsa 将签名匹配定义为一组 `n`-gram 的简单存在，而传统数据挖掘方法构建分类模型，基于特征的存在与缺失来匹配样本。\n\
  \n因此，传统数据挖掘方法泛化了 Polygraph 和 Hamsa 的方法，相应地增强了能力。\n\n### 恶意软件检测的动态性质\n\n几乎所有过去的工作都将恶意软件检测问题视为一个静态数据分类问题，即分类模型使用固定的训练数据进行训练。然而，新型恶意软件的快速涌现以及恶意软件作者采用的新混淆策略，给该问题引入了一个动态成分，这违背了静态范式。因此，我们认为，有效的恶意软件检测必须越来越多地被视为一个数据流分类问题，以跟上攻击的步伐。\n\
  \n### 数据流分类技术\n\n许多现有的数据流分类技术针对表现出概念漂移的无限长数据流 [AGGA2006, FAN2004, GAO2007, HASH2009,\
  \ HULT2001, KOLT2005, WANG2003, YANG2005, ZHAO2009]。所有这些技术都采用单遍增量更新方法，但在增量更新机制上有所不同。大多数可分为两大类：单模型增量方法和混合批量增量方法。\n\
  \n#### 单模型增量更新\n\n单模型增量更新涉及随每个新训练实例动态更新单个模型。例如，决策树模型可以随传入数据增量更新 [HULT2001]。\n\n\
  #### 混合批量增量方法\n\n相比之下，混合批量增量方法使用传统的批量学习技术，从一批训练数据构建每个模型。随着概念漂移，旧模型会定期被新模型替换 [BIFE2009,\
  \ FAN2004, GAO2007, WANG2003, YANG2005]。一些混合方法使用单个模型对未标记数据进行分类（例如 [YANG2005] 和 [CHEN2008]），而另一些则使用模型集成（例如\
  \ [WANG2003] 和 [SCHO2005]）。混合方法的优势在于模型更新通常比单模型方法简单得多；例如，集成中的分类器可以简单地被移除或替换。然而，通过增量更新集成内的分类器来结合这两种方法的其他技术可能更复杂\
  \ [KOLT2005]。\n\n#### 准确率加权分类器集成 (AWE)\n\n*准确率加权分类器集成* (AWE) [SCHO2005, WANG2003]\
  \ 是一种重要的混合增量更新集成分类器类别，它使用加权多数投票进行分类。这些方法将数据流划分为等大小的块，每个块用于训练一个分类模型。由 `K` 个此类模型组成的集成对未标记数据进行分类。每当一个新数据块被标记，就会从该块训练一个新分类器。该分类器替换集成中现有的分类器之一。替换牺牲者的选择是通过在最新训练块上评估每个分类器的准确率来决定的。这些集成方法的优势在于它们比持续更新的单模型构建得更高效，并且比其单模型对应物观察到更高的准确率\
  \ [TUME1996]。\n\n### 我们的集成方法\n\n我们的集成方法与 AWE 关系最密切，但存在许多显著差异：\n\n1. 我们对训练数据应用多分区，从该训练数据构建\
  \ `v` 个分类器。\n2. 训练数据由 `r` 个连续数据块组成（即多块方法），而不是单个块。我们在理论和实证上都证明了，这两项增强——即多分区和多块——显著降低了集成分类错误率。\n\
  3. 当我们更新集成时，集成中的 `v` 个分类器被 `v` 个新训练的分类器替换。被替换的 `v` 个分类器可能来自不同的块；因此，尽管来自某个块的某些分类器可能已被移除，但来自该块的其他分类器可能仍保留在集成中。这与\
  \ AWE 不同，在 AWE 中，移除一个分类器意味着完全移除从整个块获得的知识。我们的替换策略也有助于降低错误率。\n4. 我们使用简单多数投票而非加权投票，正如\
  \ [GAO2007] 所示，这更适合数据流。\n\n因此，我们的多分区、多块集成方法是 AWE 实现形式的更泛化和高效的形式。\n\n### 先前工作的扩展\n\
  \n我们的工作扩展了我们先前发表的工作 [MASU2009]。大多数现有的数据流分类技术，包括我们之前的工作，都假设数据流中数据点的特征空间是固定的。然而，在某些情况下（如文本数据），这一假设不成立。例如，当特征是单词时，特征空间无法在流开始时完全确定，因为新单词频繁出现。此外，这个庞大的词汇表中很大一部分可能具有低判别力，因此最好从特征空间中省略。因此，为每个数据点选择候选特征的子集更有效且高效。这种特征选择必须随着更新、更具判别力的候选特征出现和旧特征过时而增量进行。因此，特征提取和选择应成为数据流分类不可或缺的一部分。在本章中，我们描述了使用云计算框架\
  \ [DEAN2008, ZHAO2009] 设计和实现一种高效且可扩展的特征提取和选择技术。该方法超越了我们之前的工作，因为它考虑了特征空间无法预先确定时数据流分类中发生的真实挑战。这促进了我们技术在大型不断演变的数据集中检测真实恶意可执行文件的应用，表明它能够随着恶意软件实例随时间演变而检测出更新的恶意软件变种。\n\
  \n## 8.4 系统的设计与实现\n\n### 8.4.1 集成构建与更新\n\n我们的*扩展、多分区、多块* (EMPC) 集成学习方法维护一个集成 `A`\
  \ = {`A1`, `A2`, …, `AKv`}，包含最近的、最好的 `Kv` 个分类器。每当一个新数据块 `Dn` 到达时，它使用集成 `A` 测试该数据块。一旦块\
  \ `Dn` 被标记，集成就会更新。分类过程使用简单多数投票。\n\n\n\n\n集成构建更新过程如图 8.2 所示，并在算法 8.1 中总结。算法第 1-3\
  \ 行计算集合 `A` 中每个分类器 `Ai` 在数据块 `Dn` 上的误差，其中 `Dn` 是最近被标记的数据块。令 `D` 为最近被标记的 `r` 个数据块的数据，包括\
  \ `Dn`。第 5 行将 `D` 随机划分为 `v` 个大小相等的部分 {`d`1, …,}，使得所有部分具有大致相同的类分布。第 6-9 行训练一批新的 `v`\
  \ 个分类器，其中每个分类器 `An` 使用数据集 `D` − `dj` 进行训练。通过在其对应的测试数据上测试每个分类器 `An` ∈ `An` 来计算其误差。最后，第\
  \ 10 行根据第 2 行和第 8 行计算出的每个分类器的误差，从 `An` ∪ `A` 中的 `Kv` + `v` 个分类器中选择最好的 `Kv` 个分类器。请注意，第\
  \ `n` 批 `v` 个分类器的任何子集都可能被选中纳入新的集成。\n\n![图 8.2 集成构建。](img/fig8_2.jpg)\n\n图 8.2 集成构建。\n\
  \n### 8.4.2 误差减少分析\n\n正如算法 8.1 所述，我们构建了包含 `Kv` 个分类器的集成 `A`。测试实例 `x` 通过集成中分类器的多数投票进行分类。我们使用简单多数投票而非加权多数投票（参考\
  \ WANG2003），因为简单多数投票已被理论证明是数据流的最佳选择 GAO2007。加权投票在这些场景下可能存在问题，因为它假设训练数据和测试数据的分布相同。然而，在数据流中，由于概念漂移，这一假设被违背。因此，简单多数投票是更好的替代方案。我们的实验在实践中证实了这一点，简单多数投票获得的结果优于加权多数投票。\n\
  \n我们在 [MASU2011] 中已经证明，与*单分区、单数据块*（SPC）方法相比，EMPC 可以进一步降低对概念漂移数据流进行分类时的期望误差，后者仅使用一个数据块来训练单个分类器（即\
  \ `r` = `v` = 1）。直观上，误差减少主要有两个原因。首先，通过引入多数据块概念，每个分类器的训练数据量增加了。更大的训练数据自然能带来训练更好的模型，从而降低误差。其次，我们不是仅从训练数据中训练一个模型，而是将数据划分为\
  \ `v` 个分区，并从每个分区训练一个模型。这进一步降低了误差，因为 `v` 个分类器组成的集成的平均期望误差在理论上比单个分类器低 `v` 倍 TUME1996。因此，多数据块和多分区策略都有助于误差减少。\n\
  \n### 8.4.3 经验误差减少与时间复杂度\n\n对于给定的分区大小 `v`，增加窗口大小 `r` 仅在一定程度上能产生误差减少。在此之后，增加 `r`\
  \ 实际上会损害我们算法的性能，因为违反了不等式 (18)。`r` 的上界取决于漂移幅度 `ρd`。我们在 MASU2011 中展示了 `v` = 2 时，不同\
  \ `ρd` 值下，随着 `r` 增加的相对误差 `ER`。从图中可以清楚地看出，对于较低的 `ρd` 值，增加 `r` 能以更大的幅度降低相对误差。然而，在所有情况下，一旦\
  \ `r` 超过某个阈值，`ER` 就会变得大于 1。虽然可能无法从数据中得知 `ρd` 的实际值，但我们可以通过实验确定 `r` 的最优值。在我们的实验中，我们发现对于较小的数据块大小，较高的\
  \ `r` 值效果更好，反之亦然。然而，`r` = 2 或 `r` = 3 时能找到最佳的性能-成本权衡。我们在实验中使用了 `r` = 2。同样，对于固定的\
  \ `r` 值，`v` 的上界可以从不等式 (18) 推导得出。应注意到，如果增加 `v`，运行时间也会增加。从我们的实验来看，`v` = 5 时获得了最佳的性能-成本权衡。\n\
  \n该算法的时间复杂度为 `O(vn(Ks + f(rs)))`，其中 `n` 是数据块总数，`s` 是每个数据块的大小，`f(z)` 是在大小为 `z` 的训练数据上构建分类器所需的时间。由于\
  \ `v` 是常数，复杂度变为 `O(n(Ks + f(rs)))`。这最多比最近的相关工作 WANG2003 慢一个常数因子 `rv`，但具有显著降低误差的优势。\n\
  \n### 8.4.4 Hadoop/MapReduce 框架\n\n我们使用开源的 Hadoop [APAC2010] MapReduce 框架来实现实验。在此，我们提供\
  \ Hadoop MapReduce 特征提取和选择算法的一些算法细节。MapReduce 框架中的 `Map` 函数接受一个键值对作为输入，并为每个输入产生一个中间键值对列表。\n\
  \n```\nMap: (MKey × MVal) → (RKey × RVal)*\n```\n\n所有 `Map` 任务由集群中的每个节点并行处理，节点间不共享数据。Hadoop\
  \ 通过将共享公共中间键 `k` ∈ `RKey` 的每组中间值 `V` ⊆ `RVal` 分组，来汇总 `Map` 任务的输出。生成的汇总对 (`k`, `V`)\
  \ 随后被流式传输到 `Reduce` 节点。因此，Hadoop MapReduce 框架中的每个 reducer 都会接收一个包含多个 (`k`, `V`)\
  \ 对的列表，由 Hadoop 以迭代方式一次发出一个。因此 `Reduce` 可以理解为具有以下签名的函数：\n\n```\nReduce: (RKey ×\
  \ RVal*)* → Val\n```\n\n陪域 `Val` 是 MapReduce 周期最终结果的类型。\n\n在我们的框架中，`Map` 键 (`MKey`)\
  \ 是二进制文件标识符（例如文件名），`Map` 值 (`MVal`) 是以字节形式存储的文件内容。`Reduce` 键 (`RKey`) 是 `n`-gram\
  \ 特征，其对应的值 (`RVal`) 是发现这些特征的文件实例的类标签。算法 8.2 展示了 `Map` 节点用于将前者映射为后者的特征提取过程。算法 8.3\
  \ 的第 5-10 行统计 `Map` 报告的类标签，以获得每个 `n`-gram 的正负实例计数。这些构成了第 11 行计算每个 `n`-gram 信息增益的基础。第\
  \ 12-16 行使用最小堆数据结构 `h` 根据信息增益过滤掉除最佳 `S` 个特征之外的所有特征。最终遇到的最佳 `S` 个特征由第 18-20 行返回。\n\
  \nHadoop 系统中的 `q` 个 reducer 因此总共产生 `qS` 个候选特征及其信息增益。这些被流式传输到第二个 reducer，该 reducer\
  \ 仅实现算法 8.3 的后半部分以选择最佳的 `S` 个特征。\n\n## 8.5 恶意代码检测\n\n### 8.5.1 概述\n\n\n\n\n# 恶意软件检测与特征提取\n\
  \n恶意软件是网络攻击的主要来源。某些恶意软件变种纯粹是静态的；每个实例都是传播它的实例的精确副本。一旦识别出单个实例，这些恶意软件相对容易检测和过滤。然而，当今更大量的恶意软件是多态的。多态恶意软件在传播过程中自我修改，使得每个实例都具有独特的语法，但携带语义相同的恶意载荷。防病毒社区投入了大量精力和人力，设计、自动化并部署算法，以检测已被人类专家识别和分析的特定恶意软件实例和多态恶意软件家族。这导致恶意软件作者与防病毒防御者之间陷入不断升级的军备竞赛，双方都在寻求开发能够抵消对方最新进展的进攻和防御手段。随着恶意软件开发难度的降低和恶意软件变种的指数级增长，许多人认为这场竞赛最终将以防御者的失败告终。\n\
  \n恶意代码检测问题可以建模为一个数据挖掘问题，针对的是一个既具有无限长度又存在概念漂移的数据流。概念漂移发生在多态恶意软件变异时，以及攻击者和防御者在军备竞赛中引入新技术时。这种概念化引入了我们的流分类技术，以实现对新恶意可执行文件的自动化检测。\n\
  \n使用 *n*-gram 分析进行特征提取涉及从给定数据集（训练集）中提取所有可能的 *n*-gram，并从中选择最佳的 *n*-gram。每个这样的 *n*-gram\
  \ 都是一个特征。也就是说，*n*-gram 是一个 *n* 字节的序列。在提取 *n*-gram 之前，我们通过将二进制可执行文件转换为十六进制转储文件来对其进行预处理。这里的粒度级别为一个字节。我们应用\
  \ UNIX `hexdump` 实用程序将二进制可执行文件转换为文本文件（十六进制转储文件），其中包含对应于二进制文件每个字节的十六进制数字。执行此过程是为了确保二进制可执行文件的安全和便捷移植。在非分布式框架中，特征提取过程包含两个阶段：特征提取和特征选择，稍后将进行描述。本章介绍了这种传统技术的云计算变体。\n\
  \n### 8.5.2 非分布式特征提取与选择\n\n在非分布式设置中，特征提取按如下方式进行。通过在十六进制转储文件的内容上滑动一个 *n* 字节的窗口来扫描每个文件。窗口中出现的每个\
  \ *n* 字节序列都是一个 *n*-gram。对于每个 *n*-gram *g*，我们统计包含 *g* 的文件实例总数 *tg*，以及其中属于正类（即恶意可执行文件）的总数\
  \ *pg* ≤ *tg*。\n\n这涉及维护一个包含迄今遇到的所有 *n*-gram 的哈希表 *T*。如果在 *T* 中未找到 *g*，则将 *g* 添加到\
  \ *T* 中，计数为 *tg* = 1 且 *pg* ∈ {0, 1}，具体取决于当前文件具有负类还是正类标签。如果 *g* 已在 *T* 中，则 *tg*\
  \ 增加，并根据文件标签有条件地增加 *pg*。当所有十六进制转储文件扫描完毕后，*T* 包含数据集中所有唯一的 *n*-gram 及其在正类实例中的频率和总频率。\n\
  \n并不总是切实际使用从当前块对应的所有文件中提取的所有 *n*-gram 特征。此类 *n*-gram 的指数级数量可能会引入不可接受的内存开销，拖慢训练过程，或用大量嘈杂、冗余或无关的特征干扰分类器。为避免这些陷阱，必须根据选择标准对候选\
  \ *n*-gram 特征进行排序，以便仅选择最佳特征。\n\n我们选择**信息增益**作为选择标准，因为它是文献中用于选择最佳特征的最有效标准之一。信息增益可定义为属性（即特征）对训练数据分类有效性的度量。如果我们基于该属性的值分割训练数据，则信息增益度量分割后熵的预期减少量。属性减少训练数据熵的程度越高，该属性对数据分类就越有效。\n\
  \n我们在文献 [MASU2011] 中表明，当考虑新特征时，将它们的信息增益与堆根进行比较。如果新特征的增益大于根的增益，则丢弃根并将新特征插入堆中。否则丢弃新特征，继续特征选择。\n\
  \n### 8.5.3 分布式特征提取与选择\n\n上述非分布式特征提取和选择方法存在几个缺点。\n\n*   提取的 *n*-gram 特征总数可能非常大。例如，一个块中\
  \ 4-gram 的总数约为 2 亿。可能无法将它们全部存储在主内存中。一个显而易见的解决方案是将 *n*-gram 存储在磁盘文件中，但由于磁盘读/写操作的成本，这会引入不可接受的开销。\n\
  \n*   如果哈希表 *T* 中的冲突特征未排序，则在特征提取期间，为测试每个扫描的 *n*-gram 是否已在 *T* 中，都需要进行线性搜索。如果它们已排序，则插入时需要线性搜索。无论哪种情况，提取所有\
  \ *n*-gram 所需的时间在每个块中 *n*-gram 总数 *N* 上都是最坏情况下的二次方时间，当 *N* ≈ 10⁸ 时，这是不切实际的时间。同样，非分布式特征选择过程要求对每个块中的\
  \ *n*-gram 进行排序。通常这需要 *O*(*N* log *N*) 时间，当 *N* 很大时也是不切实际的。\n\n为了高效且有效地解决非分布式特征提取和选择方法的缺点，我们利用云计算的力量。这使得特征提取、*n*-gram\
  \ 排序和特征选择能够并行执行，利用 Hadoop `MapReduce` 框架。\n\n`MapReduce` [DEAN2008] 是一种在云计算环境中日益流行的分布式编程范式。该模型并行处理大型数据集，以无共享方式将工作负载分发到许多节点（机器）上。主要重点是简化使用廉价集群计算机处理大型数据集的过程。另一个目标是易用性，兼具负载均衡和容错能力。\n\
  \n`MapReduce` 因其两个主要函数而得名。`Map` 函数将作业分解为子任务以分发给可用节点，而其对偶函数 `Reduce` 聚合已完成子任务的结果。我们将从今往后分别把执行这些函数的节点称为\
  \ **mapper** 和 **reducer**。`MapReduce` 处理 *n*-gram 特征提取和选择的过程详见文献 [MASU2011]。本节给出该方法的高层概述。\n\
  \n包含 *N* 个训练文件的每个训练块被用于提取 *n*-gram。这些训练文件首先由 Hadoop 分布式文件系统 (HDFS) 分发到 *m* 个节点（机器）上（图\
  \ 8.3，步骤 1）。数量 *m* 由 HDFS 根据系统可用性选择。然后每个节点使用 4.1 节 中讨论的技术，独立地从提供给该节点的训练文件子集中提取 *n*-gram（图\
  \ 8.3，步骤 2）。当所有节点完成作业后，从每个节点提取的 *n*-gram 被汇总（图 8.3，步骤 3）。\n\n![图 8.3 分布式特征提取与选择](img/fig8_3.jpg)\n\
  \n图 8.3 分布式特征提取与选择\n\n\n\n\n例如，假设节点 1 在一个正实例（即恶意训练文件）中观察到 *n*-gram `abc`，而节点 2 在一个负实例（即良性实例）中观察到它。这在图\
  \ 8.3 中分别用节点 1 和节点 2 下的 `abc`、+ 和 `abc`、− 表示。当 *n*-gram 合并时，包含相同 *n*-gram 的实例的标签会被聚合。因此，`abc`\
  \ 的聚合对为 `abc`、+−。合并后的 *n*-gram 被分发到 *q* 个 Reducer（由 HDFS 根据系统可用性选择 *q*）。每个 Reducer\
  \ 首先统计聚合标签以获得正计数和总计数。以 *n*-gram `abc` 为例，我们得到的统计结果为 `pabc` = 1 和 `tabc` = 2。Reducer\
  \ 利用这些统计结果从提供给该节点的 *n*-gram 子集中选择最佳的 *S* 个 *n*-gram（图 8.3，步骤 5）。这可以通过大小为 *S* 的最小堆高效完成；该过程需要\
  \ *O*(*W* log *S*) 时间，其中 *W* 是提供给每个 Reducer 的 *n*-gram 总数。相比之下，非分布式版本需要 *O*(*W*\
  \ log *W*) 时间。因此，从 *q* 个 Reducer 节点，我们获得 *qS* 个 *n*-gram。从中，我们通过运行另一轮 MapReduce\
  \ 再次选择最佳的 *S* 个，其中 Map 阶段不执行任何操作，而 Reduce 阶段仅使用一个节点执行特征选择（图 8.3，步骤 6）。特征集中的每个特征都是二元的；如果在给定实例（即可执行文件）中存在，其值为\
  \ 1，否则为 0。对于每个训练或测试实例，我们计算特征向量，其位由相应特征集的特征值组成。这些特征向量被分类器用于训练和测试。\n\n## 8.6 实验\n\n\
  我们在合成数据、受控环境中生成的僵尸网络流量和恶意软件数据集上评估了我们的方法。实验结果与几种基线方法进行了比较。\n\n### 8.6.1 数据集\n\n####\
  \ 8.6.1.1 合成数据集\n\n为了生成具有概念漂移的合成数据，我们使用了一个移动超平面，由 $\\sum_{i = 1}^{d}{a_{i}x_{i}\
  \ = a_{0}}$ 给出 [WANG2003]。如果 $\\sum_{i = 1}^{d}{a_{i}x_{i} \\leq a_{0}}$，则该示例为负；否则为正。每个示例是一个随机生成的\
  \ *d* 维向量 {`x`[1], …, `x`[*d*]}，其中 `x`[*i*] ∈ [0, 1]，权重 {`a`[1], …, `a`[*d*]} 也在范围\
  \ [0, 1] 内随机初始化为实数。`a`[0] 的值会被调整，以便生成大致相同数量的正负示例。这可以通过选择 $a_{0} = \\frac{1}{2}\\\
  sum_{i = 1}^{d}a_{i}$ 来完成。我们还通过随机切换 *p*% 示例的标签来引入噪声，在我们的实验中 *p* = 5。有几个参数用于模拟概念漂移。我们使用与\
  \ [WANG2003] 中相同的参数。总共生成 250,000 条记录和四个不同的数据集，其块大小分别为 250、500、750 和 1,000。每个数据集包含\
  \ 50% 的正实例和 50% 的负实例。\n\n#### 8.6.1.2 僵尸网络数据集\n\n僵尸网络是被称为 *bot* 的受感染主机网络，全部由被称为\
  \ *botmaster* 的人类攻击者控制 [BARF2006]。Botmaster 可以向 bot 发布命令以执行恶意操作，例如发起 DDoS 攻击、发送垃圾邮件、间谍活动等。僵尸网络被广泛视为对互联网社区的巨大新兴威胁。许多前沿僵尸网络应用对等\
  \ (P2P) 技术，以便在僵尸网络拓扑演变时可靠且隐蔽地通信。这些僵尸网络是分布式且小规模的，使其更难以检测和摧毁。P2P bot 的示例包括 Nugache\
  \ [LEMO2006]、Sinit [STEW2003] 和 Trojan.Peacomm [GRIZ2007]。\n\n僵尸网络流量可以被视为具有无限长度和概念漂移的数据流。概念漂移发生在\
  \ bot 承担新的恶意任务或根据新的 botmaster 指令采用不同的通信策略时。因此，我们认为我们的流分类技术非常适合检测 P2P 僵尸网络流量。\n\n\
  我们使用 Nugache P2P bot [LEMO2006] 在受控环境中生成真实的 P2P 僵尸网络流量。特征提取过程的细节在 Masud 等人的文献 [MASU2008b]\
  \ 中讨论。总共有 81 个连续属性。整个数据集包含 30,000 条记录，代表一周的网络流量。我们生成四个不同的数据集，其块大小分别为 30 分钟、60 分钟、90\
  \ 分钟和 120 分钟。每个数据集包含 25% 的正实例（僵尸网络流量）和 75% 的负实例（良性流量）。\n\n#### 8.6.1.3 恶意软件数据集\n\
  \n我们从不同的 Windows 机器中提取了总共 38,694 个良性可执行文件，并从在线恶意软件库 VX Heavens [VX2010] 收集了总共 66,694\
  \ 个恶意可执行文件，该库包含大量恶意可执行文件（病毒、蠕虫、特洛伊木马和后门）。良性可执行文件包括 Windows 安装文件夹中发现的各种应用程序，以及默认程序安装目录中的其他可执行文件。\n\
  \n在这两种情况下，我们仅选择 Win32 可移植可执行文件 (PE)。ELF 可执行文件的实验是未来潜在的工作方向。收集的 105,388 个文件（良性和恶意）形成了一个包含\
  \ 130 个块的数据流，每个块包含 2,000 个实例（可执行文件）。流的顺序是通过按版本和发现日期对恶意软件进行排序来选择的，模拟了互联网恶意软件的演变性质。每个块包含\
  \ 1,500 个良性可执行文件（75% 负实例）和 500 个恶意可执行文件（25% 正实例）。该数据集的特征提取和选择过程在前面的章节中已描述。\n\n请注意，所有这些数据集本质上都是动态的。它们无界（潜在无限长度）的大小使其超出了纯静态分类框架的范围。合成数据也表现出概念漂移。虽然无法准确确定真实数据集是否具有概念漂移，但从理论上讲，当在很长一段时间内观察时，可执行文件流应该表现出概念漂移。恶意软件数据表现出特征演化，这从为每个块识别出的不同区分特征集得到了证明。\n\
  \n### 8.6.2 基线方法\n\n对于分类，我们使用 Weka 机器学习开源包 [HALL2009]。我们应用了两种不同的分类器：J48 决策树和 Ripper。然后将以下每种基线技术与我们的\
  \ EMPC 算法进行比较。\n\n*   **BestK**：这是一种单分区、单块 (SPC) 集成方法，使用最佳 *K* 个分类器的集成。集成通过存储迄今为止见过的所有分类器，并根据在最近训练块上的预期误差选择最佳\
  \ *K* 个来创建。实例通过简单多数投票进行测试。\n\n*   **Last**：在这种情况下，我们仅保留在最近训练块上训练的分类器。这可以被视为 *K*\
  \ = 1 的 SPC 方法。\n\n*   **AWE**：这是使用准确率加权分类器集成 [WANG2003] 实现的 SPC 方法。它构建一个包含 *K*\
  \ 个模型的集成，其中每个模型都从一个数据块训练而来。集成更新如下。设 `Cn` 为在最近训练块上构建的分类器。从现有的 *K* 个模型和最新模型 `Cn` 中，根据它们在最近训练块上的误差选择最佳的\
  \ *K* 个模型。选择基于加权投票，其中每个模型的权重与其在最近训练块上的误差成反比。\n\n\n\n\n### 8.6.3 Hadoop 分布式系统搭建\n\
  \n我们实验所用的分布式系统由一个包含十个节点的集群组成。每个节点具有相同的硬件配置：Intel Pentium IV 2.8 GHz 处理器、4GB 主内存和\
  \ 640GB 硬盘空间。软件环境包括 Ubuntu 9.10 操作系统、Hadoop-0.20.1 分布式计算平台、JDK 1.6 Java 开发平台以及 100MB\
  \ 局域网链路。\n\n## 8.7 讨论\n\n我们的工作考虑了一个纯粹由句法特征组成的特征空间：从可执行代码段、静态数据段、头部以及不可信文件的所有其他内容中提取的二进制\
  \ `n`-gram。更高层级的结构特征（如调用图和控制流图）以及动态特征（如运行时轨迹）超出了我们当前的研究范围。尽管如此，`n`-gram 特征已被观察到对恶意软件检测具有极高的判别能力，这既得到了大量先前工作的证明，也得到了我们实验的验证。部分原因在于，跨越整个二进制文件内容（包括头部和数据表）的\
  \ `n`-gram 集合捕获了重要的底层结构细节，而这些细节往往被更高层级的表示形式所抽象掉了。例如，恶意软件通常包含使用非标准工具汇编和链接的手写汇编代码。这使得攻击者能够实现高级源语言和标准编译器无法提供的二进制混淆和底层漏洞利用。因此，恶意软件通常包含异常的指令编码、头部结构和链接表，它们的异常只能在原始二进制层面看到，而无法在汇编代码清单、控制流图或系统\
  \ API 调用轨迹中发现。将特征空间扩展以包含这些额外的高层级特征，需要一种高效可靠的方法来收集它们，并在特征选择期间评估其相对判别能力，这被保留为未来的研究课题。\n\
  \n文献 [MASU2011] 中报告的实证结果证实了我们的分析，即多划分、多块方法的表现应优于单块、单划分方法。直观上，基于多个块训练的分类器应比基于单个块训练的分类器具有更高的预测准确性，因为其拥有更大的训练数据。此外，如果通过多划分训练数据来训练多个分类器，所得分类器集成的预测准确性应高于基于相同训练数据训练的单个分类器，这是由于集成相对于单一分类器具有错误降低的能力。另外，EMPC\
  \ 的准确性优势可归结为我们的工作与 AWE 之间的两个重要差异。首先，当 AWE 在集成更新过程中移除一个分类器时，来自相应块的所有信息都会被遗忘；但在 EMPC\
  \ 中，来自较早块的一个或多个分类器可能会保留下来。因此，EMPC 的集成更新倾向于保留比 AWE 更多的信息，从而形成更好的集成。其次，AWE 至少需要 `Kv`\
  \ 个数据块，而 EMPC 至少需要 `K + r − 1` 个数据块即可获得 `Kv` 个分类器。因此，AWE 倾向于在集成中保留比 EMPC 古老得多的分类器，导致一些过时的分类器可能对分类准确性产生负面影响。\n\
  \n然而，更高的准确性伴随着运行时间的增加成本。理论上，EMPC 最多比 AWE（其在准确性方面最接近的竞争对手）慢 `rv` 倍。这在实证评估中也显而易见，评估显示\
  \ EMPC 的运行时间在 AWE 的五倍以内（当 `r` = 2 且 `v` = 5 时）。不过，可以采用一些优化来降低运行时成本。首先，可以轻松实现每个划分训练的并行化，将训练时间减少\
  \ `v` 倍。其次，集成中每个模型的分类也可以并行完成，从而将分类时间减少 `Kv` 倍。因此，训练和分类的并行化应至少将运行时间减少 `v` 倍，使其接近\
  \ AWE 的运行时间。或者，如果无法并行化，可以降低参数 `v` 和 `r`，以降低运行时成本为代价牺牲预测准确性。在这种情况下，可以通过使用不同的 `v`\
  \ 和 `r` 值评估流的前几个块，并选择最合适的值，来获得运行时间和预测准确性之间的理想平衡。\n\n## 8.8 总结与展望\n\n许多入侵检测问题可以表述为针对无限长、概念漂移数据流的分类问题。概念漂移发生在这些流中，因为攻击者会对防御做出反应并进行适应。我们将恶意代码检测和僵尸网络流量检测都表述为此类问题，并引入了\
  \ EMPC，这是一种用于自动分类无限长、概念漂移流的新型集成学习技术。将 EMPC 应用于从多态恶意软件和僵尸网络流量样本获得的真实数据流，其检测准确率优于其他流数据分类技术。这表明该方法对于入侵检测和更通用的数据流分类均有用且有效。\n\
  \nEMPC 采用广义的多划分、多块集成学习。理论和实证评估均表明，与现有的单划分、单块集成方法相比，该技术显著降低了预期分类误差。此外，我们展示了 EMPC\
  \ 可以基于 MapReduce [DEAN2008] 优雅地在云计算框架中实现。结果是一个低成本、可扩展的流分类框架，具有高分类准确性和低运行时开销。\n\n\
  至少有两个针对我们技术的扩展为未来工作提供了有前景的方向。首先，我们当前的特征选择过程仅关注基于信息增益作为选择标准的最佳 `S` 个特征。通过利用近期关于监督降维技术\
  \ [RISH2008, SAJA2005] 的工作来改进特征选择，分类准确性有望进一步提高。其次，通过利用云计算架构中可用的额外并行性，可以提高我们方法的运行时性能。例如，集成的分类器可以在\
  \ MapReduce 框架中作为 Mapper 并行运行，Reducer 则聚合结果进行投票。同样，下一轮集成的候选分类器也可以并行训练和评估。以这种方式重新构思系统的集成组件，可能会显著缩短处理时间，从而有机会投入更多处理时间用于分类以提高准确性。其他大数据平台（如\
  \ Storm 和 Spark）也需要被探索以托管我们的算法。最后，虽然用于分析收集的恶意软件数据量可能巨大，但我们需要探索使用 NoSQL 数据库系统（如 CouchDB）来存储、管理和查询数据。\n\
