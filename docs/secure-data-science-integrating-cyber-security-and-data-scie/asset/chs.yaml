  \ 相比 W-OP 具有相对较好的 ERR 率，这归因于 W-OS 較低的假阳性率，因为 W-OS 几乎将所有实例都识别为“正常”。同样，MC 的总体错误率（ERR）在所有数据集和所有分类器上都远低于其他方法。K-NN\
  \ 在所有数据集上也呈现出类似的结果。\n\n表 7.1 性能对比\n\n| ![](img/inline7_1.jpg) |\n\n| --- |\n\n图\
