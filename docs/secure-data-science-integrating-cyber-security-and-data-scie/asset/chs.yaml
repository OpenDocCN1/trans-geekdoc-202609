  \ and Cloud Computing (CSCloud)/2020 6th IEEE International Conference on Edge Computing\
  \ and Scalable Cloud (EdgeCom)*。\n\n## 作者简介\n\n**Dr. Bhavani Thuraisingham**（巴瓦尼·图赖辛汉博士）是德克萨斯大学达拉斯分校（UTD）计算机科学\
  \ Founders Chair 教授，也是 UTD 网络安全研究与教育研究所的创始执行主任（2004–2021）。她目前的研究集中在网络安全、云计算和数据科学的融合。加入\
  \ UTD 之前，她在 MITRE 公司工作了 16 年，其中包括担任美国国家科学基金会（NSF）项目主任的三年经历。在 MITRE 之前，她在商业界工作了六年，包括在霍尼韦尔公司。她拥有开发商业产品以及将技术转移到作业系统的经验。她是\
  \ ACM、IEEE、AAAS 和 NAI 的会士，并荣获 IEEE 和 ACM 的众多奖项。更多关于她工作的详情请访问 [`www.utdallas.edu/~bxt043000/`](http://www.utdallas.edu/~bxt043000/)。\n\
  \n**Dr. Murat Kantarcioglu**（穆拉特·坎塔尔奇奥卢博士）是 UTD 计算机科学 Ashbel Smith 教授兼数据安全与隐私主任。他毕业于普渡大学计算机科学专业，获博士学位。Kantarcioglu\
  \ 博士是 IEEE 和 AAAS 会士、ACM 杰出科学家，曾荣获包括 IEEE 智能与安全信息学技术成就奖和 AMIA Homer R.奖在内的多项殊荣。他也是\
  \ NSF CAREER 奖获得者。他目前的研究兴趣包括对抗机器学习和数据隐私。更多关于他工作的详情请访问 [`www.utdallas.edu/~muratk/`](http://www.utdallas.edu/~muratk/)。\n\
  \n**Dr. Latifur Khan**（拉蒂富尔·汗博士）是 UTD 计算机科学教授兼大数据分析主任。他还是 Women in Data Science\
  \ 中心的联合主任。他毕业于南加州大学计算机科学专业，获博士学位。Khan 博士是 IEEE 会士、ACM 杰出科学家，曾荣获包括 IEEE 智能与安全信息学技术成就奖和\
  \ IEEE 大数据安全与隐私高级研究奖在内的多项殊荣。他还是英国 IET 和 BCS 的会士。他的研究重点是大数据管理与分析以及用于网络安全的机器学习。更多关于他工作的详情请访问\
  \ [`www.utdallas.edu/~lkhan/`](http://www.utdallas.edu/~lkhan/)。\n\n# 1 绪论\n\nDOI:\
  \ [10.1201/9781003081845-1](https://doi.org/10.1201/9781003081845-1)\n\n## 1.1 概述\n\
  \n\n\n\n\n### 大规模数据的收集、存储、处理、分析和保留导致了严重的安全和隐私问题\n\n各种法规正在被提议以处理大数据，从而保护个人隐私不被侵犯。例如，即使从数据中移除了个人身份信息，当数据与其他数据结合时，个人仍可能被识别出来。虽然收集海量数据引发了安全和隐私担忧，但大数据分析在网络安全领域的应用却呈爆发式增长。例如，组织可以将身份管理、入侵检测和恶意软件分析等活动外包给云端。问题是，大数据分析和数据科学技术的发展如何用于解决安全问题？此外，如何确保这些技术是安全的，并能适应对抗性攻击？在回答这些问题之前，我们需要先问一个问题：“什么是数据科学？”根据\
  \ [www.oracle.com](http://www.oracle.com) 的定义，“数据科学结合了统计学、科学方法和数据分析等多个领域，从数据中提取价值。”由于数据科学包含许多领域，它常与大数据分析和机器学习交替使用。因此，除非另有说明，我们将交替使用数据科学、机器学习、大数据管理和分析这些术语。它们都涉及使用各种技术（包括统计推理、模式识别和学习）从海量数据中提取有用的信息。\n\
  \n在过去二十年中，数据科学技术已被广泛用于网络安全应用。这些应用包括入侵检测、内部威胁检测和恶意软件分析。虽然数据科学技术在网络安全中有许多应用，但也会导致隐私泄露。这是因为现在可以使用各种机器学习工具快速分析海量数据，并提取可能高度敏感或私密的信息。此外，数据科学技术本身也可能遭受网络攻击。因此，我们可能无法信任数据科学/机器学习产生的结果。本书描述了这两个方面。也就是说，它首先描述了数据科学在网络安全中的各种应用。它将描述数据科学的应用，包括流数据分析和新颖类检测，用于内部威胁检测等网络安全应用。接下来，它将讨论安全和增强隐私的数据科学技术。它将讨论对抗性机器学习等领域的趋势，这些趋势在开发机器学习技术时考虑了攻击者的行为。它还将讨论如何将增强隐私的技术纳入数据科学。此外，它还提供了数据科学和大数据管理访问控制的概述。也就是说，它描述了各种策略执行技术，用于控制对海量数据的访问。它还将讨论安全数据科学在可靠信息共享、云数据管理和社交媒体中的一些应用。读者将了解以下内容：(i)\
  \ 数据科学的安全和隐私问题。(ii) 数据科学技术如何应用于网络安全问题。(iii) 考虑攻击者行为的机器学习技术修改方法。(iv) 大数据分析的增强隐私技术。(v)\
  \ 安全技术（如访问控制）在数据科学应用中的应用，如保护社交媒体和以云为中心的可靠信息共享。\n\n本章详述了本书的组织结构。本章的组织结构如下。大数据分析、数据科学和机器学习等概念将在\
  \ 1.2 节 中讨论。安全数据科学的支撑技术将在 1.3 节 中讨论。用于网络安全问题的数据科学技术将在 1.4 节 中讨论。安全和增强隐私的数据科学，如针对数据科学技术的攻击以及确保数据科学技术的隐私，将在\
  \ 1.5 节 中讨论。访问控制与数据科学将在 1.6 节 中讨论。本书的组织结构将在 1.7 节 中给出。我们将在 1.8 节 中以有用的资源结束本章。应注意，1.3\
  \ 节 至 1.6 节 的内容将在本书的 第一部分 至 第四部分 中详细阐述。图 1.1 说明了本章涵盖的内容。\n\n![图 1.1 本章讨论的概念。](img/fig1_1.jpg)\n\
  \n图 1.1 本章讨论的概念。\n\n## 1.2 大数据分析、数据科学和机器学习\n\n我们在多个应用中听到了大数据分析、数据科学和机器学习这些术语，在本书中我们交替使用它们。然而，它们之间存在一些关键差异。虽然它们都专注于分析数据以提取有用信息，但大数据分析是关于分析海量异构数据。数据科学也使用数据挖掘和统计推理技术分析数据。机器学习也涉及数据分析，但侧重于包括深度学习在内的学习技术。在本节中，我们将进一步探讨这些术语。\n\
  \n美国劳工统计局 (BLS) 将 `big data`（大数据）定义为无法用常规统计方法分析的大型数据集的集合。这些数据集可以代表数值、文本和多媒体数据。大数据通常用五个\
  \ V 来定义：Volume（容量）、Velocity（速度）、Variety（多样性）、Veracity（真实性）和 Value（价值）。大数据管理和分析 (BDMA)\
  \ 需要处理海量数据，包括结构化和非结构化数据，这些数据以高速到达。通过利用大数据，我们可以在网络安全和医疗保健等几个关键领域取得突破，从而提高生产力和盈利能力。大数据跨越多个重要领域：商业、电子商务、金融、政府、医疗保健、社交网络和电信，以及大气科学和生物科学等多个科学领域。BDMA\
  \ 正演变为一个称为数据科学的领域，它不仅包括 BDMA，还包括机器学习、统计方法、高性能计算和数据管理。\n\n数据科学家聚合、处理、分析和可视化大数据，以获得有用的见解。BLS\
  \ 预测，在 2012-2022 年期间，计算机程序员和统计学家都将拥有较高的就业增长。据 IBM 报道，2020 年约有 270 万个数据科学职位空缺 [\\\
  [IBM\\]](#ch01.xhtml#ref1_1)。随着数据科学家的角色和职责日益明确，对数据科学专家的需求正在上升。目前，毫无疑问，数据科学技能的培养与高企的行业需求不成比例。因此，将数据科学的研究、开发和教育工作纳入计算机科学主流至关重要。无论行业、学术界还是政府，每个组织都在收集数据。组织希望分析这些数据以获得竞争优势。因此，对包括精通\
  \ BDMA 技术在内的数据科学家的需求每年都在以数倍增长。\n\n\n\n\n\n### 1.2 大数据安全与隐私\n\n虽然大数据管理与分析（BDMA）在过去五年中取得了显著进展，正演变为数据科学，但大数据安全与隐私（BDSP）正成为一项关键需求。随着“量化自我”（QS）运动的近期兴起，可穿戴设备和智能手机应用收集的个人数据正被分析，以指导用户改善健康或个人生活习惯。这些数据还通过基于云的服务与其他服务提供商（如零售商）共享，为用户提供潜在利益（如健康产品信息）。但这种数据收集和共享往往在用户不知情的情况下进行，带来了个人数据可能被用于不当目的的严重危险。如果数据收集者能够将财务和健康相关数据与推文、Facebook\
  \ 活动及购买模式聚合，隐私侵犯很容易失控。此外，必须存储海量收集数据的访问权限。然而，针对 QS 应用的隐私保护或数据访问控制，现有的工具和技术寥寥无几。\n\
  \n虽然保护大数据安全和确保个人隐私是至关重要的任务，但 BDMA 技术可用于解决安全问题。例如，组织可以将身份管理、邮件过滤和入侵检测等活动外包给云。这是因为此类应用正在收集海量数据，且这些数据必须被分析。云数据管理只是大数据管理的一个例子。问题在于：BDMA\
  \ 的发展如何用于解决网络安全问题？这些问题包括恶意软件检测、内部威胁检测、入侵检测和垃圾邮件过滤。\n\n机器学习侧重于从先前经验中学习并进行预测。学习技术可能包括神经网络、决策树和支持向量机。机器学习被认为是人工智能（AI）的一个分支。AI\
  \ 还包括规划系统、智能体和专家系统。图 1.2 展示了大数据分析、数据科学和机器学习中的各种概念。正如本书前面所述，我们交替使用这些术语。\n\n![图 1.2\
  \ 大数据分析、数据科学和机器学习。](img/fig1_2.jpg)\n\n图 1.2 大数据分析、数据科学和机器学习。\n\n## 1.3 支持技术\n\n\
  我们将讨论安全数据科学的几项支持技术。这些技术包括：（i）数据安全与隐私；（ii）面向安全应用的数据挖掘；（iii）云计算、语义 Web 和社交网络；以及（iv）大数据安全与隐私。图\
  \ 1.3 展示了本书讨论的支持技术。\n\n![图 1.3 支持技术。](img/fig1_3.jpg)\n\n图 1.3 支持技术。\n\n关于数据安全与隐私，我们将描述数据库安全问题、安全策略实施、访问控制、数据库系统的授权模型，以及数据隐私问题。关于数据挖掘，我们也将其称为数据分析，我们将介绍其概念，并概述各种数据挖掘技术，为第\
  \ II 部分、第 III 部分和第 IV 部分中将讨论的一些技术奠定基础。关于数据挖掘在安全中的应用，我们将概述所讨论的一些数据挖掘技术如何应用于网络安全应用。关于云计算、语义\
  \ Web 和社交网络，我们将提供一些关键点，包括云数据管理以及用于表示和管理大量数据的技术，如 RDF（资源描述框架）。我们还将讨论分析和保护社交网络的各个方面。关于大数据安全与隐私，我们将讨论概念和挑战，如用于网络安全的大数据分析、针对大数据分析的攻击、隐私增强的大数据分析以及大数据的访问控制。这些技术将为第\
  \ II 部分、第 III 部分和第 IV 部分中讨论的概念提供基础。\n\n## 1.4 面向网络安全的数据科学\n\n恶意内部人员，无论是人还是流程，都被认为是对网络安全和国家安全最危险的威胁。例如，公司员工可能窃取高度敏感的产品设计并出售给竞争对手。这可以通过手工操作实现，也通常通过网络间谍活动实现。系统中的恶意流程也可以执行此类隐蔽操作。\n\
  \n数据挖掘技术已被应用于网络安全问题，包括内部威胁检测。已应用的技术包括支持向量机和监督学习方法。不幸的是，监督学习方法的训练过程往往耗时且昂贵，且通常需要大量平衡良好的训练数据才能有效。此外，传统训练方法难以针对海量内部威胁数据进行良好扩展。因此，我们已将数据科学技术应用于恶意软件分析、新颖类别检测和内部威胁检测等网络安全应用。\n\
  \n我们设计并开发了多种数据科学技术来检测恶意内部人员。特别是，我们已将流数据分析技术改进，以处理海量数据并检测本书第 III 部分中的恶意内部人员。我们还为可扩展的恶意软件检测设计了基于云的实现。第\
  \ III 部分中涉及的概念在图 1.4 中进行了说明。\n\n![图 1.4 面向网络安全的数据科学。](img/fig1_4.jpg)\n\n图 1.4 面向网络安全的数据科学。\n\
  \n## 1.5 安全与隐私增强的数据科学\n\n在使用数据科学和机器学习技术时，我们面临的挑战之一是这些技术可能遭受攻击。对手通常会了解我们的模型和所用数据，并试图投毒数据并破坏模型。我们必须比对手领先数步并调整我们的模型。这一领域被称为“对抗性机器学习”（或“对抗性数据挖掘”）。数据科学的另一个问题是，现在可以将不同数据片段关联起来，推断出高度私密或敏感的信息。在其他一些情况下，公开机器学习结果（如预防疾病传播）很重要，但必须保护个人数据隐私（如某特定个体患有该疾病）。\n\
  \n第 III 部分将介绍处理针对数据科学的攻击以及隐私增强数据科学的技术。我们将讨论诸如对抗性支持向量机学习等技术，以应对针对机器学习技术的网络攻击。关于隐私，我们将给出隐私感知决策树的示例。我们还将讨论面向量化自我应用的隐私感知基于策略的数据管理框架。最后，我们将讨论一个隐私保护的具体应用，即\
  \ COVID-19 大流行。第 III 部分中的章节将让读者了解如何应对针对机器学习技术的网络攻击，以及在进行机器学习时如何确保隐私。图 1.5 展示了安全与隐私增强的数据科学。\n\
  \n![图 1.5 安全与隐私增强的数据科学。](img/fig1_5.jpg)\n\n图 1.5 安全与隐私增强的数据科学。\n\n\n\n\n\n## 1.6\
  \ 访问控制与数据科学\n\n数据科学系统（如大数据管理系统）必须是安全的。也就是说，必须根据策略控制对数据的访问。我们将要研究的策略植根于访问控制策略。这些策略不仅控制对数据的访问，还可用于控制数据共享以及控制未经授权的推理。\n\
  \n第 IV 部分将讨论我们开发的各种基于云的系统，以控制对大数据系统的访问。我们首先讨论基于访问控制的安全云查询处理系统，该系统是我们利用 `Hadoop/MapReduce`\
  \ 框架开发的。我们的系统处理海量语义网数据。特别是，我们为云环境下运行的 `SPARQL` 查询处理器设计并开发了一个查询优化器。我们还开发了一个在云中运行的可靠信息共享系统。在这里，不同组织根据策略共享数据。此外，我们还讨论了一个用于社交媒体数据的基于语义网的访问控制框架。我们将社交媒体系统视为大数据技术的一种应用。最后，我们讨论大数据系统的推理控制。虽然访问控制策略直接控制对数据的访问，但推理控制策略通过推理间接控制对数据的访问。最后，我们将讨论我们的某些技术如何应用于一个新兴应用，即交通互联网（物联网的一个方面）系统。图\
  \ 1.6 展示了我们开发的一些实验性云系统。\n\n![Figure 1.6 Access control and data science.](img/fig1_6.jpg)\n\
  \n图 1.6 访问控制与数据科学。\n\n## 1.7 本书结构\n\n本书分为四部分，每部分描述与数据科学和网络安全相关的技术的某个方面。第 I 部分包含四章，将描述安全数据科学的支撑技术。在第\
  \ 2 章中，讨论数据安全和隐私问题。在第 3 章中，提供了用于网络安全应用的各种数据挖掘技术的概述。第 4 章讨论云计算和语义网技术。最后，在第 5 章中讨论一些新兴技术，如大数据安全和隐私。这些支撑技术为安全数据科学提供了背景信息。\n\
  \n第 II 部分包含四章，详细概述了我们为网络安全开发的数据科学技术。第 6 章侧重于恶意软件分析的数据科学技术。第 7 章讨论用于新类检测的流数据分析。第\
  \ 8 章讨论利用云进行可扩展的恶意软件分析数据科学技术。最后，第 9 章讨论用于内部威胁检测的流数据分析。\n\n第 III 部分包含五章，将讨论安全和隐私增强的数据科学。第\
  \ 10 章讨论针对数据科学系统的攻击，并描述我们对对抗性机器学习的总体方法，特别是支持向量机学习。第 11 章描述对抗性相关性向量机学习。第 12 章讨论以决策树为例的隐私增强数据科学。最后，第\
  \ 13 章讨论我们在量化自我应用的隐私感知策略数据管理框架方面的工作。最后，在第 14 章中，我们讨论如何将我们的工作应用于特定应用，即 COVID-19 大流行。\n\
  \n第 IV 部分讨论访问控制和数据科学，包含五章。第 15 章描述基于访问控制的大数据安全云查询处理系统。第 16 章描述我们开发的在云中运行的基于策略的信息共享系统。我们的信息共享策略植根于访问控制策略。第\
  \ 17 章讨论用于社交媒体数据的基于语义网的访问控制框架，我们将其视为一种大数据形式。第 18 章描述我们基于访问控制为基于语义网的大数据开发的推理控制器。最后，第\
  \ 19 章讨论如何将我们的某些工作应用于交通互联网系统等应用。\n\n每一部分均以介绍开始，以总结结束。此外，第 2 章至第 17 章均以概述开始，以总结和参考文献结束。第\
  \ 20 章总结全书并讨论未来方向。本书附录提供数据管理概述，并讨论我们撰写的文本之间的关系。这一直是我们所有书籍的标准做法。\n\n我们本质上开发了一个四层框架来解释本书中的概念。该框架如图\
  \ 1.7 所示。第 1 层是支撑技术层，涵盖第 I 部分的章节。第 2 层是网络安全数据科学层，涵盖第 II 部分的章节。第 3 层是安全和隐私增强数据科学层，涵盖第\
  \ III 部分的章节。第 4 层是访问控制和数据科学层，涵盖第 IV 部分的章节。本书各部分之间的关系见图 1.8。\n\n![Figure 1.7 Layered\
  \ framework.](img/fig1_7.jpg)\n\n图 1.7 分层框架。\n\n![Figure 1.8 Contents of this book\
  \ with respect to the framework.](img/fig1_8.jpg)\n\n图 1.8 基于框架的本书内容。\n\n## 1.8\
  \ 后续步骤\n\n本章介绍了本书。我们首先简要概述了安全数据科学，然后讨论了大数据分析、数据科学和机器学习等概念。接下来，我们讨论了网络安全数据科学。随后讨论了安全和隐私增强数据科学。然后给出了访问控制和数据科学的讨论。本书的主要贡献之一是描述数据科学和网络安全如何相互支持，以开发安全和私密的系统。我们还在全书中提供了大量参考文献。\n\
  \n近年来出现了几个新的数据科学、云计算和大数据会议。其中包括 IEEE 计算机学会云计算会议（与服务计算会议同期举办）以及 CloudCom。此外，IEEE\
  \ 计算机学会还发起了大数据会议。此外，传统的数据库管理、数据挖掘和机器学习会议已聚焦于大数据分析，而网络安全会议现在主要关注网络安全与数据科学/机器学习的融合。还有专门针对数据科学的会议（例如\
  \ IEEE/ACM 联合会议）。\n\n\n\n\n我们坚信，计算的未来在于云计算，数据的未来在于数据科学。云计算和数据科学将在众多领域得到应用，以提供可扩展的数据分析解决方案。结合机器学习，它们不仅将提供可扩展的数据分析解决方案，还将提供能够从经验中学习并进行预测的技术。挑战在于如何将各种服务和组件整合在一起，构建可扩展且安全的数据科学与机器学习系统。此外，在确保个人隐私的前提下安全管理海量数据的系统，将成为未来几十年我们面临的主要挑战之一。\n\
  \n## 参考文献\n\n*   [IBM] IBM, <https://www.forbes.com/sites/louiscolumbus/2017/05/13/ibm-predicts-demand-for-data-scientists-will-soar-28-by-2020/?sh=7c4fe5d67e3b>\n\
  \n# 第一部分 安全数据科学的支撑技术\n\n## 第一部分导读\n\nDOI: [10.1201/9781003081845-3](https://doi.org/10.1201/9781003081845-3)\n\
  \n第一部分 共包含四章，将介绍安全数据科学的支撑技术。具体而言，将讨论：(i) 数据安全与隐私；(ii) 面向网络安全应用的数据挖掘；(iii) 云计算、语义\
  \ Web 与社交媒体；以及 (iv) 大数据安全与隐私问题。\n\n第 2 章 将介绍安全技术。具体而言，我们将讨论数据安全与隐私以及网络安全的各个方面，包括访问控制模型和数据隐私问题。在\
  \ 第 3 章 中，我们将提供关于数据挖掘技术的背景信息，并讨论将数据挖掘应用于网络安全的方法，如入侵检测和内部威胁检测。在 第 4 章 中，我们将概述云计算、语义\
  \ Web 和社交网络技术。这是因为我们在 第四部分 中讨论的实验系统利用了云计算、语义 Web 和社交网络技术的各个方面。此外，这些技术是大数据管理和分析的一些基础技术。在\
  \ 第 5 章 中，我们将讨论大数据安全与隐私问题，包括面向网络安全的大数据发展与挑战以及针对大数据的攻击。第一部分 中的各章为 第二部分、第三部分 和 第四部分\
  \ 中的讨论奠定了基础。\n\n# 2 数据安全与隐私\n\nDOI: [10.1201/9781003081845-4](https://doi.org/10.1201/9781003081845-4)\n\
  \n## 2.1 简介\n\n正如我们在 第 1 章 中所述，安全数据科学技术将大数据/数据科学技术与安全技术相结合。在本章中，我们将讨论安全技术。具体而言，我们将讨论数据安全与隐私以及网络安全的各个方面。数据科学技术的某个方面，如数据挖掘技术以及云和语义\
  \ Web 技术，将在 第 3 章 和 第 4 章 中讨论。大数据安全与隐私问题将在 第 5 章 中讨论。\n\n由于本书的大部分讨论涉及大数据分析/数据科学与安全，我们将为数据管理系统的安全提供一个相当全面的概述。具体而言，我们将讨论安全策略以及在数据库系统中强制执行这些策略。我们的重点将放在自主安全策略上。我们还将讨论数据隐私方面。关于安全数据管理的更多细节，请参阅\
  \ [FERR2000] 和 [THUR2005a]。\n\n最流行的自主安全策略是访问控制策略。访问控制策略在 1960 年代针对操作系统进行了研究，随后在\
  \ 1970 年代针对数据库系统进行了研究。两个著名的数据库系统 `System R` 和 `INGRES` 是最早研究数据库系统访问控制的系统（参见 [GRIF1976]\
  \ 和 [STON1974]）。从那时起，报告了几种访问控制策略的变体，包括基于角色的访问控制和基于属性的访问控制 [NIST]。其他自主策略还包括管理策略。我们还将在自主策略下讨论标识和认证。请注意，本章的大部分讨论将集中在关系数据库系统的自主安全上。许多原则也适用于其他系统，如对象数据库系统、分布式/联邦数据库系统和云数据管理系统（参见例如\
  \ [THUR1994]）。\n\n在设计安全系统之前，必须回答的第一个问题是：系统要强制执行什么安全策略？安全策略本质上是一组强制执行安全的规则。安全策略包括强制安全策略和自主安全策略。强制安全策略是指性质上“强制”且由系统强制执行的策略。自主安全策略是由管理员或数据所有者指定的策略。强制安全策略是非自主安全策略的一部分。基于角色的访问控制策略也被视为非自主安全策略\
  \ [SAND1996]。\n\n策略执行是指强制执行策略的机制。例如，在 1970 年代，`System R` 和 `INGRES` 等关系数据库系统产品开发了查询修改机制等技术用于策略执行（参见例如\
  \ [GRIF1976] 和 [STON1974]）。查询语言 `SQL`（结构化查询语言）已被扩展以指定安全策略和访问控制规则。最近，`XML`（可扩展标记语言）和\
  \ `RDF`（资源描述框架）等语言也被扩展以指定安全策略（参见例如 [BERT2002] 和 [CARM2004]）。我们还将讨论数据管理中的隐私顾虑以及隐私增强的数据管理技术。我们还包含了关于隐私增强数据挖掘的讨论。\n\
  \n本章的组织结构如下。在 第 2.2 节 中，我们介绍自主安全，包括数据库系统的访问控制和授权模型。我们还将讨论基于角色的访问控制系统。在 第 2.3 节 中，我们将讨论强制执行自主安全的方法，包括查询修改的讨论。我们还将概述各种商业产品。数据隐私考量将在\
  \ 第 2.4 节 中讨论。第 2.5 节 总结本章。图 2.1 说明了本章讨论的概念。我们假设读者具备一些数据管理知识。关于该主题的更多细节，请参阅 [DATE1990]\
  \ 和 [THUR1997] 等文献。\n\n![图 2.1 数据安全与隐私。](img/fig2_1.jpg)\n\n图 2.1 数据安全与隐私。\n\n##\
  \ 2.2 安全策略\n\n\n\n\n\n### 本节的组织结构如下。\n\n在第 2.2.1 节中，我们将提供访问控制策略的概述。管理策略将在第 2.2.2\
  \ 节中讨论。识别和认证中的问题将在第 2.2.3 节中讨论。数据库管理系统的审计将在第 2.2.4 节中讨论。作为安全对象的视图将在第 2.2.5 节中讨论。图\
  \ 2.2 说明了本节讨论的各种自主安全策略组件。\n\n![图 2.2 自主安全策略。](img/fig2_2.jpg)\n\n图 2.2 自主安全策略。\n\
  \n## 2.2.1 访问控制策略\n\n访问控制策略最初是针对操作系统进行研究的。这里的关键点在于：能否授予进程对文件的访问权限？访问可以是读访问或写访问。写访问可能包括修改、追加或删除的权限。这些原则被移植到了诸如\
  \ `INGRES` 和 `System R` 之类的数据库系统中。从那时起，各种形式的访问控制策略已被研究。其中值得注意的有基于角色的访问控制策略，目前已在多个商业系统中实现。请注意，访问控制策略也包括强制策略。图\
  \ 2.3 说明了各种类型的访问控制策略。\n\n![图 2.3 访问控制安全策略。](img/fig2_3.jpg)\n\n图 2.3 访问控制安全策略。\n\
  \n### 2.2.1.1 基于授权的访问控制策略\n\n许多访问控制策略基于授权策略。其本质含义是：用户根据授权规则被授予对数据的访问权限。在本节中，我们将讨论各种类型的授权规则。请注意，Ferrari\
  \ 和 Thuraisingham 编写的书籍章节 \\[FERR2000\\] 中提供了关于授权策略的详细讨论。\n\n#### 2.2.1.1.1 正向授权\n\
  \n早期系统关注的是现在所谓的正向授权规则。在此规则下，用户 John 被授予对关系 `EMP` 的访问权限，或用户 Jane 被授予对关系 `DEPT` 的访问权限。这些是针对关系的访问控制规则。也可以授予对其他实体（如属性和元组）的访问权限。例如，John\
  \ 拥有关系 `EMP` 中属性 `salary` 的读访问权限和属性 `name` 的 `write`（写）访问权限。写访问可能包括追加、修改或删除访问。\n\
  \n#### 2.2.1.1.2 负向授权\n\n问题是：如果未指定 John 对某对象的访问权限，这是否意味着 John 没有访问该对象的权限？在某些系统中，任何未指定的授权规则均隐含视为负向授权；而在其他系统中，负向授权则被显式指定。例如，我们可以强制执行诸如“John\
  \ 无权访问关系 `EMP`”或“Jane 无权访问关系 `DEPT`”之类的规则。\n\n#### 2.2.1.1.3 冲突解决\n\n当存在相互冲突的规则时，如何解决冲突？例如，我们可能有一条规则授予\
  \ John 对关系 `EMP` 的读访问权限。然而，我们也可能有一条规则不授予 John 对 `EMP` 中 `salary` 属性的读访问权限。这就是一个冲突。通常系统会强制执行最小权限规则，在这种情况下，John\
  \ 可以访问 `EMP`，但 `salary` 的值除外。\n\n#### 2.2.1.1.4 强授权和弱授权\n\n系统还会强制执行强授权和弱授权。在强授权的情况下，无论是否存在冲突，规则均生效。在弱授权的情况下，若存在冲突，则规则不生效。例如，如果授予\
  \ John 访问 `EMP` 的权限是一条强授权规则，而不授予 John 访问 `salary` 属性的规则是一条弱授权规则，则存在冲突。这意味着强授权将生效。\n\
  \n#### 2.2.1.1.5 授权规则的传播\n\n这里的问题是规则如何传播？例如，如果 John 拥有对关系 `EMP` 的读访问权限，这是否自动意味着\
  \ John 拥有对 `EMP` 中每个元素的读访问权限？通常情况是这样，除非我们有一条禁止授权规则自动传播的规则。如果我们有一条禁止授权规则自动传播的规则，则必须显式强制执行指定\
  \ John 可访问对象的授权规则。\n\n#### 2.2.1.1.6 特殊规则\n\n在我们关于强制策略的工作中，我们广泛探讨了基于内容和上下文的约束的实施。请注意，安全约束本质上就是安全规则。基于内容和上下文的规则是指根据数据的内容或显示数据的上下文来授予访问权限的规则。此类规则也可用于自主安全。例如，在基于内容的约束情况下，John\
  \ 仅拥有 `DEPT D100` 中元组的读访问权限。在基于上下文或关联的约束情况下，John 无权同时读取姓名和薪水；但是，他可以单独访问姓名和薪水。在基于事件的约束情况下，选举结束后，John\
  \ 拥有对关系 `EMP` 中所有元素的访问权限。\n\n#### 2.2.1.1.7 规则的一致性和完整性\n\n此处的挑战之一是确保约束的一致性和完整性。也就是说，如果约束或规则不一致，我们是否拥有解决冲突的冲突解决规则？如何确保实体（如属性、关系、元素等）均在用户的访问控制规则中得到指定？其本质含义是：规则是否完整？如果不完整，对于某特定用户或用户类别既未指定正向授权也未指定负向授权的实体，我们做何假设？\n\
  \n我们已经讨论了关于授权规则的一些基本要点。图 2.4 给出了一些示例。接下来，我们将讨论一些流行的访问控制模型，它们是基于角色的访问控制（现已在商业系统中实现）和基于属性的访问控制（在基于\
  \ Web 的系统中实现）。\n\n![图 2.4 授权规则。](img/fig2_4.jpg)\n\n图 2.4 授权规则。\n\n### 2.2.1.2 基于角色的访问控制\n\
  \n基于角色的访问控制已成为最流行的访问控制方法之一（参见 \\[SAND1996\\]）。该方法已在包括 `Trusted Oracle` 在内的商业系统中实现。其核心思想是根据用户的角色和职能授予访问权限。\n\
  \n基于角色的访问控制（也称为 `RBAC`）背后的基本思想如下。用户根据其角色需要访问数据。例如，总裁可能有权访问有关其副总裁和董事会成员的信息，而首席财务官可能有权访问财务信息以及向其汇报工作的人员的信息。总监可能有权访问其部门工作人员的信息，而人力资源总监将掌握公司员工的个人数据。从本质上讲，基于角色的访问控制是一种授权策略，它取决于用户角色以及随角色而来的活动。\n\
  \n\n\n\n\n#### 关于角色层级的各种研究工作\n\n文献中讨论了关于角色层级的各种研究工作。还有一个名为**SACMAT**（访问控制模型与技术研讨会）的会议系列，它是从基于角色的访问控制研究工作演变而来的。例如，访问是如何传播的？一个角色能否包含另一个角色？请考虑图\
  \ 2.5 中所示的角色层级。这意味着如果我们授予层级中某个节点的访问权限，该访问权限是否会向上传播？也就是说，如果部门经理拥有对特定项目信息的访问权限，该访问权限是否会传播给父节点（即总监节点）？如果组长拥有其组内员工信息的访问权限，该访问权限是否会在角色层级中传播给作为父节点的部门经理？子节点会发生什么情况？也就是说，访问权限是否会向下传播？例如，如果部门经理拥有对特定信息的访问权限，那么他的下属是否也拥有对该信息的访问权限？是否存在下属拥有部门经理所没有的数据访问权限的情况？如果一名员工必须向两位主管汇报，一位是他的部门经理，另一位是他的项目经理，会发生什么？当部门经理参与一个项目，必须向同样为他工作的项目组长汇报时，会发生什么？\n\
  \n![Figure 2.5 Role hierarchy.](img/fig2_5.jpg)\n\n图 2.5 角色层级.\n\n基于角色的访问控制已在关系系统、对象系统、分布式系统中得到研究，现在也在一些新兴技术中得到研究，例如数据仓库、知识管理系统、语义网、电子商务系统和数字图书馆。此外，对象模型已被用于表示角色和活动（参见例如\
  \ IFIP 数据库安全会议系列论文集，以及最近的 ACM 数据与应用安全和隐私会议系列论文集）。\n\n## 2.2.1.3 使用控制\n\n最近，Sandhu\
  \ 等人开发了另一种类访问控制模型，即使用控制模型，他称之为**UCON**（参见例如 [PARK2004] 中报道的工作）。**UCON** 模型试图将一些额外特性纳入基于角色的访问控制，包括属性可变性和义务。\n\
  \n## 2.2.1.4 基于属性的访问控制\n\n由于角色在不同组织中并不统一，因此认为基于角色的访问控制不足以满足基于 Web 的系统需求。大致在同一时期，Web\
  \ 服务、面向服务的架构和基于云的系统变得流行并被广泛使用。因此，为这种环境开发了一种基于声明的访问控制模型。该模型即基于属性的访问控制。在此模型中，用户对自己提出某些声明。然后，这些声明由想要授予用户资源访问权限的组织进行验证。如果用户的声明有效，则检查策略以确定此类用户是否有权访问资源。在过去十年中，基于属性的访问控制变得极其流行\
  \ **NIST**。\n\n## 2.2.2 管理策略\n\n访问控制策略规定特定用户对数据拥有的访问权限，而管理策略规定谁来管理数据。管理职责包括保持数据最新、确保数据更新时元数据也随之更新，以及确保从故障中恢复及相关活动。\n\
  \n通常，数据库管理员（**DBA**）负责更新元数据、索引和访问方法，并确保访问控制规则得到正确实施。系统安全官（**SSO**）也可能发挥作用。也就是说，**DBA**\
  \ 和 **SSO** 可能会分担职责。安全相关问题可能由 **SSO** 负责，而数据相关问题可能由 **DBA** 负责。其他正在考虑的管理策略包括指派看管人。通常，所有者控制其创建的数据，并可在数据的整个生命周期内对其进行管理。在某些情况下，所有者可能无法管理数据，此时他们可指派看管人（即保管人）。\n\
  \n在分布式环境中，尤其是 Web 环境中，管理策略变得更加复杂。例如，在 Web 环境中，分发文档可能涉及多方，包括所有者、发布者和请求数据的用户。数据归谁所有？是所有者还是发布者？一旦数据离开所有者并到达发布者，发布者是否接管数据控制权？随着我们从关系数据库环境迁移到分布式环境，甚至可能是\
  \ Web 环境，有许多有趣的问题需要解答。这些还包括管理版权问题、数据质量、数据溯源和治理。近期会议上发表了许多关于管理策略的有趣论文。图 2.6 说明了各种管理策略。\n\
  \n![Figure 2.6 Administration policies.](img/fig2_6.jpg)\n\n图 2.6 管理策略.\n\n## 2.2.3\
  \ 标识与认证\n\n为求完整，我们将标识与认证作为自主安全讨论的一部分进行探讨。标识是指用户必须使用其用户 ID 和密码进行自我标识。认证是指系统随后将用户\
  \ ID 与密码进行匹配，以确保此人确实是其声称的那个人。用户可能因其角色不同而拥有多重身份。特别是随着 Web 服务的出现，身份管理受到了广泛关注（参见 [BERT2006]）。\n\
  \n基于密码的方案已报告出许多问题。其中之一是黑客可以闯入系统获取用户密码，然后冒充用户。在集中式系统中，问题不如在分布式环境中复杂。现在，随着万维网和电子商务应用的发展，黑客冒充合法用户导致金融组织损失数十亿美元。\n\
  \n最近，生物识别技术被应用于标识和认证。这些技术包括人脸识别、指纹识别和语音识别技术来认证用户。这些技术显示出巨大潜力且已投入使用。随着人脸识别技术的进步，我们可以预期生物识别技术将得到广泛应用。\n\
  \n## 2.2.4 数据库系统审计\n\n数据库审计服务于多种目的。例如，审计可用于记录查询次数、更新次数、执行的事务数以及辅助存储的访问次数，以便更高效地设计系统。数据库也可出于安全目的进行审计。例如，是否有访问控制规则被绕过而向用户泄露信息？是否发生了推理问题？隐私是否被侵犯？是否发生了未经授权的入侵？\n\
  \n审计会创建审计跟踪，审计数据可存储在数据库中。该数据库可被挖掘以检测任何异常模式或行为。在利用数据挖掘进行审计和入侵检测方面已有大量工作。随着 Web 上电子商务交易的增多，审计跟踪分析显得尤为重要。组织应具备进行分析的能力，以确定信用卡欺诈和身份盗窃等问题。\n\
  \n## 2.2.5 用于安全的视图\n\n\n\n\n\n### 视图作为安全机制\n\n视图作为安全机制已被广泛研究，既用于自主安全也用于强制安全。例如，可能不想授予对整个关系的访问权限，特别是当它有\
  \ 25 个属性时，如医疗记录、薪资、差旅信息、个人数据等。因此，DBA 可以定义视图并授予用户对视图的访问权限。同样，在强制安全的情况下，视图也可以被分配安全级别。\n\
  \n视图也存在相关问题，包括视图更新问题（参见 DATE1990）。也就是说，如果更新了视图，则需要确保基本关系也被更新。因此，如果视图被 John 更新，而\
  \ John 没有访问基本关系的权限，那么基本关系还能被更新吗？也就是说，我们是为不同用户创建不同的视图，然后由 DBA 将视图上的更新合并为对基本关系的更新？图\
  \ 2.7 说明了用于安全的视图。\n\n![图 2.7 用于安全的视图。](img/fig2_7.jpg)\n\n图 2.7 用于安全的视图。\n\n## 2.3\
  \ 策略实施与相关问题\n\n本节的组织结构如下。第 2.3.1 节 讨论用于安全的 SQL 扩展。第 2.3.2 节 讨论查询修改。第 2.3.3 节 将讨论自主安全对其他数据库功能的影响。请注意，我们将重点关注关系数据库系统。图\
  \ 2.8 说明了实施安全策略所涉及的各个方面。这些包括规范、实现和可视化（其中可视化工具被用于策略的可视化）。\n\n![图 2.8 策略实施。](img/fig2_8.jpg)\n\
  \n图 2.8 策略实施。\n\n### 2.3.1 用于安全的 SQL 扩展\n\n本节讨论策略规范。虽然重点将放在用于安全策略规范的 SQL 扩展上，但我们也将简要讨论一些新兴语言。请注意，SQL\
  \ 是为关系系统的数据定义和数据操纵而开发的。已经开发了各种版本的 SQL，包括面向对象的 SQL、面向多媒体的 SQL 和面向 Web 的 SQL。也就是说，在过去\
  \ 30 年里，SQL 对数据操纵和数据定义产生了巨大影响（参见 SQL3）。\n\n正如我们所说，SQL 是一种数据定义和数据操纵语言。安全策略可以在数据定义期间指定。SQL\
  \ 具有用于指定授予和撤销用户访问权限的 `GRANT` 和 `REVOKE` 结构。也就是说，如果用户 John 对关系 `EMP` 具有读取访问权限，则可以使用\
  \ SQL 指定类似 `GRANT JOHN EMP READ` 的内容，如果要撤销访问权限，则需要类似 `REVOKE JOHN EMP READ` 的内容。SQL\
  \ 还通过更复杂的约束进行了扩展，例如授予 John 读取关系中元组的访问权限，以及授予 Jane 写入关系中元素的访问权限。\n\n在 THUR1989 中，我们指定了用于安全断言的\
  \ SQL 扩展。这些断言用于多级安全。我们可以使用类似的推理来指定自主安全策略。例如，考虑这样一种情况：John 没有读取 `EMP` 中姓名和薪资组合在一起的访问权限，但他可以分别读取姓名和薪资。可以用类\
  \ SQL 语言指定如下：\n\n```\nGRANT JOHN READ\nEMP.SALARY\nGRANT JOHN READ\nEMP.NAME\nNOT\
  \ GRANT JOHN READ\nTogether (EMP.NAME, EMP.SALARY)\n```\n\n如果要授予 John 读取薪资低于 30K\
  \ 的员工的访问权限，则该断言指定如下：\n\n```\nGRANT JOHN READ\nEMP\nWhere EMP.SALARY < 30K\n```\n\
  \n请注意，我们指定的断言尚未纳入任何标准。这些是我们的一些想法。我们需要探索将这些断言纳入标准的方法。也有人提出了用于基于角色的访问控制的 SQL 扩展。事实上，像\
  \ Oracle 的 Trusted 数据库产品这样的产品就实施基于角色的访问控制。访问控制规则是用类 SQL 语言指定的。\n\n请注意，还有许多其他已开发的规范语言。这些包括用于\
  \ Web 和语义 Web 的 XML、RDF 及相关语言。语义 Web 本质上是一个智能 Web。已经为 XML 和 RDF 指定了类 SQL 语言。例如，为\
  \ XML 开发了 XML-QL，它后来演变成了一种称为 XQuery 的语言。SPARQL 现在是 RDF 的查询语言（参见 THUR2007）。我们将在 第\
  \ IV 部分 讨论的系统中使用此类语言。图 2.9 说明了安全策略的规范方面。\n\n![图 2.9 策略规范。](img/fig2_9.jpg)\n\n图\
  \ 2.9 策略规范。\n\n### 2.3.2 查询修改\n\n查询修改（现称为查询重写）最早是在加州大学伯克利分校的 INGRES 项目中提出的（参见 STON1974）。其思想是根据约束条件修改查询。我们已成功设计并实现了基于强制安全的查询修改（参见\
  \ DWYE1987、THUR1987、THUR1993）。然而，本节的大部分讨论将集中在基于自主安全约束的查询修改上。我们通过一些示例来说明要点。\n\n考虑\
  \ John 检索 `EMP` 中所有元组的查询。假设 John 只有读取薪资低于 30K 且员工不在安全部门的元组的访问权限。那么查询\n\n```\nSelect\
  \ * from EMP\n将被修改为\nSelect * from EMP\nWhere salary < 30K\nAnd Dept is not Security\n\
  ```\n\n其中我们假设 `EMP` 的属性为，例如 `name`、`salary`、`age` 和 `department`。\n\n本质上发生的情况是，查询的\
  \ \"where\" 子句包含与该关系关联的所有约束。我们也可以有跨越多个关系的约束。例如，我们可以有两个通过 `Dept #` 连接的关系 `EMP` 和\
  \ `DEPT`。那么查询修改如下：\n\n```\nSelect * from EMP\nWhere EMP.Salary < 30K\nAnd EMP.D#\
  \ = DEPT.D#\nAnd DEPT.Name is not Security\n```\n\n我们使用了一些简单的示例来说明查询修改。详细算法可以在 DWYE1987\
  \ 和 STON1974 中找到。高层算法如 图 2.10 所示。\n\n![图 2.10 查询修改算法。](img/fig2_10.jpg)\n\n图 2.10\
  \ 查询修改算法。\n\n### 2.3.3 自主安全与数据库功能\n\n在 第 2.3.2 节 中，我们讨论了查询修改，这本质上是在查询操作期间处理安全约束。查询优化也会受到安全约束的影响。也就是说，一旦查询被修改，就必须构建查询树。其思想是将选择和投影下推到查询树中，并在稍后执行连接操作。\n\
  \n其他功能也会受到安全约束的影响。让我们考虑事务管理。Bertino 等人开发了用于事务管理中完整性约束处理的算法（参见 BERT1989）。我们已经研究了他们的技术，用于事务管理期间的强制安全约束处理。这些技术可以改编用于自主安全约束。其思想是确保在事务执行期间不违反约束。\n\
  \n\n\n\n可以对元数据强制执行约束。例如，可以授予和撤销用户对元数据关系的访问权限。元数据的自主安全约束的处理方式与数据的处理方式相同。其他数据库功能包括存储管理。存储管理中的问题包括开发适当的访问方法和索引策略。需要考察安全约束对存储管理功能的影响。也就是说，能否根据约束对关系进行分区，并以一种可以高效访问关系的方式存储它们？我们需要为数据库系统开发安全索引技术。关于地理空间信息系统安全索引的一些工作见于\
  \ [ATLU2004]。对数据库进行审计是为了确定是否发生了任何安全违规。此外，视图已被用于出于安全目的授予个人访问权限。我们需要针对审计和视图管理的高效技术。\n\
  \n在本节中，我们已经考察了安全对某些数据库功能的影响，包括查询管理、事务处理、元数据管理和存储管理。我们还需要研究安全对其他功能的影响，例如完整性约束处理和容错计算。图\
  \ 2.11 说明了安全对数据库功能的影响。应当注意，本节中的一些讨论已扩展至大数据管理。详情见 [THUR2017]。\n\n![图 2.11 安全对数据库功能的影响。](img/fig2_11.jpg)\n\
  \n图 2.11 安全对数据库功能的影响。\n\n## 2.4 数据隐私\n\n数据隐私关乎保护个人的敏感信息。虽然提出了不同的隐私定义，但最常见的定义是：由个人决定发布关于他或她的哪些信息。虽然数据隐私已被研究数十年，特别是统计数据库方面，但随着万维网的出现以及将数据挖掘应用于反恐应用的努力，过去\
  \ 15 年来人们对该主题的兴趣日益增加。关于在隐私与安全需求之间取得平衡的研究已有大量报道。首个关于隐私保护数据挖掘的工作见于 [AGRA2000]。自 2000\
  \ 年代初以来，该主题的其他一些工作相继出现 [KANT2004]。此外，将隐私问题视为推理问题的一种变体进行研究，见于 [THUR2005b]。\n\n随着大数据技术的发展，人们对数据隐私产生了极大的兴趣。例如，美国国家科学基金会于\
  \ 2014 年 9 月举办了大数据安全与隐私研讨会，结果见于 [NSF2014]。随着数据分析等技术的进步，以及决策制定者、律师、社会科学家和计算机科学家对数据隐私的关注，我们可以期待在保护个人隐私以及确保其安全方面取得重大进展。\n\
  \n## 2.5 总结与展望\n\n在本章中，我们提供了数据库系统中自主安全策略的概述。我们从访问控制策略（包括授权策略和基于角色的访问控制）的讨论开始。然后我们讨论了管理策略。我们简要讨论了标识和认证。我们还讨论了审计问题以及用于安全的视图。接下来，我们讨论了策略实施。我们还讨论了用于指定策略的\
  \ SQL 扩展，并提供了查询修改的概述。\n\n仍有大量工作有待完成。例如，在基于角色的访问控制和基于属性的访问控制方面，针对云和物联网等新兴技术，仍需做大量工作。我们需要管理策略来管理\
  \ Web 环境中的多方事务。我们还需要生物识别技术来认证用户。数字身份正成为一个重要的研究领域，特别是结合云系统时。\n\n安全策略实施是一个将随着新技术出现而持续演进的主题。我们已从关系型发展到面向对象、多媒体、基于\
  \ Web、基于云的数据管理系统。每个系统都有一些独特的功能，这些功能被纳入安全策略中。为各种系统实施策略将继续成为主要焦点。我们还需要对策略的一致性和完整性进行研究。策略可视化可能有助于实现这一目标。云和大数据中的策略管理是一个活跃的研究领域。我们的工作包括访问控制以及云中的基于策略的信息共享。我们在云中安全策略实施方面开发的实验系统见于\
  \ 第 IV 部分。\n\n## 参考文献\n\n*   [AGRA2000] R. Agrawal, Ramakrishna Srikant: Privacy-preserving\
