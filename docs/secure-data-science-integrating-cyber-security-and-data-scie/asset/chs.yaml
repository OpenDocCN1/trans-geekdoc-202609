  \ 19, Springer, 2006, pp. 1–121.\n\n*   \\[WANG2014\\] H.X. Wang, K. Nayak, C. Liu,\
  \ E. Shi, E. Stefanov, Y. Huang, Oblivious Data Structures, IACR Cryptology ePrint\
  \ Archive, 2014, 185.\n\n## 第一部分 结语\n\nDOI: [10.1201/9781003081845-8](https://doi.org/10.1201/9781003081845-8)\n\
  \n第一部分包含四个章节，阐述了安全数据科学的支撑技术。在第 2 章中，我们概述了数据库系统中的自主安全策略。我们首先讨论了访问控制策略，包括授权策略和基于角色的访问控制策略。然后讨论了管理策略。我们简要讨论了标识和认证。我们还讨论了审计问题以及用于安全的视图。接下来，我们讨论了策略执行以及用于指定策略的\
  \ SQL 扩展，并概述了查询修改。最后，我们简要概述了数据隐私方面。在第 3 章中，我们概述了用于网络安全应用的数据挖掘。特别是，我们讨论了各种数据挖掘技术，并描述了它们在入侵检测和内部威胁检测中的应用。第\
  \ 4 章介绍了云、语义 Web 和社交网络技术的概念。这是因为第四部分中讨论的一些实验系统利用了这些技术。我们首先讨论了云计算的概念，包括虚拟化、部署模型和云功能等方面。我们还讨论了语义\
  \ Web 技术，包括 XML、RDF、本体和 OWL。最后，我们讨论了社交网络分析和安全。在第 5 章中，我们讨论了大数据安全和隐私。首先，我们讨论了安全和隐私问题，然后讨论了一些研究挑战。\n\
  \n如前所述，第一部分中的章节为第二部分、第三部分和第四部分中的讨论奠定了基础。面向网络安全的数据科学将在第二部分中讨论。增强安全性和隐私性的数据科学将在第三部分中讨论。我们开发的一些实验系统将在第四部分中讨论。\n\
  \n# 第二部分 面向网络安全的数据科学\n\n## 第二部分 导言\n\nDOI: [10.1201/9781003081845-10](https://doi.org/10.1201/9781003081845-10)\n\
  \n第二部分包含四个章节，描述了面向网络安全的数据科学。特别是，数据科学技术（如数据挖掘、流分析和云计算）被应用于网络安全应用，如恶意软件分析和内部威胁检测。\n\
  \n第 6 章讨论了用于检测恶意可执行文件的数据挖掘/数据科学技术。第 7 章描述了用于恶意软件检测的流分析，并展示了如何利用这种方法检测新型恶意软件类别。第\
  \ 8 章讨论了如何利用大数据技术（如云计算）提升第 5 章和第 6 章中讨论的技术的性能。第 8 章讨论了如何基于监督学习和无监督学习应用数据科学技术进行内部威胁检测。关于大数据技术的可扩展性也进行了讨论。\n\
  \n# 6 面向恶意可执行文件的数据科学\n\nDOI: [10.1201/9781003081845-11](https://doi.org/10.1201/9781003081845-11)\n\
  \n## 6.1 简介\n\n恶意代码对计算机和计算机社会构成巨大威胁。各种恶意代码在野外肆虐。其中一些具有移动性，如蠕虫，通过互联网传播，给全球数百万台计算机造成损害。其他类型的恶意代码是静态的，如病毒，但有时比其移动对应物更致命。恶意代码编写者通常利用软件漏洞攻击主机。研究人员设计了许多技术来应对这些攻击。不幸的是，研究人员在检测和预防攻击方面越成功，野外出现的恶意代码就越复杂。因此，恶意代码编写者与研究人员之间的斗争实际上是永无止境的。\n\
  \n防病毒社区检测恶意代码的一种流行技术是“特征检测”。该技术将可执行文件与称为 `signature` 的唯一标志性字符串或字节模式进行匹配，后者用作特定恶意代码的标识符。尽管特征检测技术被广泛使用，但它们对\
  \ `zero-day` 攻击（新恶意代码）、`polymorphic` 攻击（同一二进制文件的不同加密）或 `metamorphic` 攻击（实现相同功能的不同代码）无效。因此，迫切需要快速、自动化且高效的检测技术，且这些技术能抵御上述攻击。因此，开发了许多自动化系统\
  \ [GOLB2004, KOLT2004, NEWM2002, NEWS2005]。\n\n在本章中，我们描述了我们新颖的 `hybrid feature retrieval`\
  \ (HFR) 模型，该模型可以高效地检测恶意可执行文件 [MASU2007a, MASU2007b]。接下来，我们描述了我们用于检测恶意可执行文件的数据挖掘工具。它利用基于\
  \ `n`-gram 分析的特征提取技术。我们首先讨论如何从可执行文件中提取二进制 `n`-gram 特征，然后展示如何使用信息增益选择最佳特征。我们还讨论了与\
  \ `n`-gram 提取和选择相关的内存和可扩展性问题，以及我们如何解决它。然后我们描述了如何提取汇编特征和动态链接库 (DLL) 调用特征。最后，我们描述了如何结合这三种特征，并使用这些特征训练分类器。\n\
  \n\n\n### 实验与评估详解\n\n我们使用两个具有不同实例数量和类别分布的数据集。我们将利用我们的方法提取的特征——即混合特征集（HFS）——与其他两种基线方法进行比较：仅二进制特征集（BFS）和衍生汇编特征（DAF）集。在分类方面，我们比较了三种不同分类器在各特征集上的表现，分别是支持向量机（SVM）、朴素贝叶斯（NB）、贝叶斯网络、决策树和提升决策树。我们展示了我们的方法及各基线技术的分类准确率、假阳性率和假阴性率。我们还比较了我们方法与基线的运行时间及性能/成本权衡。\n\
  \n### 本章结构\n\n第 6.2 节讨论恶意可执行文件的相关方面，包括我们的架构、相关工作及我们的方法。第 6.3 节讨论我们的数据挖掘工具，特别是利用\
  \ `n-gram` 分析进行特征提取及混合特征检索模型。第 6.4 节讨论实验，包括数据集、实验设置、结果及示例运行。第 6.5 节讨论结合大数据分析的恶意软件分析扩展。第\
  \ 6.6 节总结本章。图 6.1 阐释了本章的概念。\n\n![Figure 6.1 Detecting malicious executables.](img/fig6_1.jpg)\n\
  \n图 6.1 检测恶意可执行文件。\n\n## 6.2 恶意可执行文件\n\n### 6.2.1 架构\n\n图 6.2 展示了我们用于检测恶意可执行文件的架构。训练数据由一组良性和恶意可执行文件组成。我们从每个可执行文件中提取三种不同类型的特征（稍后解释）。这些提取的特征随后被分析，仅选择最具判别力的特征。利用选定的特征集，从每个训练实例生成特征向量。这些特征向量用于训练分类器。当需要测试新的可执行文件时，首先从中提取训练期间选定的特征，并生成特征向量。该特征向量通过分类器进行分类，以预测其是良性还是恶意可执行文件。\n\
  \n![Figure 6.2 Architecture.](img/fig6_2.jpg)\n\n图 6.2 架构。\n\n在我们的方法中，我们从可执行文件的不同抽象层级提取三种不同类型的特征，并将它们组合成一个称为**混合特征集（HFS）**的特征集。这些特征用于训练分类器（例如`支持向量机\
  \ (SVM)`、`决策树`等），并应用于检测恶意可执行文件。这三种特征分别是：(i) 二进制 `n-gram` 特征，(ii) 衍生汇编特征（DAF），(iii)\
  \ 动态链接库（DLL）调用特征。每个二进制 `n-gram` 特征实际上是二进制可执行文件中 `n` 个连续字节的序列，使用第 10 章中解释的技术提取。二进制\
  \ `n-gram` 揭示了良性和恶意可执行文件之间的区分字节模式。每个 DAF 是可执行文件中一条汇编指令序列，对应一个二进制 `n-gram` 特征。DAF\
  \ 揭示了良性和恶意可执行文件之间独特的指令使用模式。它们通过我们的`汇编特征检索 (AFR)`算法从反汇编的可执行文件中提取。汇编 `n-gram` 特征未用于\
  \ HFS，因为我们的发现表明 DAF 表现优于它们。每个 DLL 调用特征实际对应可执行文件中的一个 DLL 函数调用，从可执行文件头中提取。这些特征揭示了良性和恶意可执行文件之间的区分\
  \ DLL 调用模式。我们通过实证表明，这三种特征的组合在分类准确率方面始终优于任何单一特征。\n\n我们的工作侧重于扩展不同抽象层级的特征，而非在单一抽象层级使用更多特征。这主要有两个原因。首先，给定抽象层级（如二进制层级）的特征数量极其庞大。例如，在我们的较大数据集中，我们获得了\
  \ 2 亿个二进制 `n-gram` 特征。使用如此大量的特征进行训练远超出了任何实用分类器的能力。因此，我们将给定抽象层级的特征数量限制在适用范围内。其次，我们通过实证观察到向组合特征集（即\
  \ HFS）添加更多抽象层级的益处。HFS 结合了三个抽象层级的特征：二进制可执行文件、汇编程序和系统应用程序编程接口（API）调用。我们证明，与任何单一抽象层级的特征相比，这种组合具有更高的检测准确率和更低的误报率。\n\
  \n我们的技术因以下几个原因与知识管理相关。首先，我们应用二进制 `n-gram` 特征的知识来获取 DAF。其次，我们应用从特征提取过程中获得的知识来选择最佳特征。这是通过从训练数据中提取所有可能的二进制\
  \ `n-gram`，应用与每个 `n-gram` 对应的统计知识（即其在恶意和良性可执行文件中的频率）来计算其`信息增益` [MITC1997]，并选择最好的\
  \ `S` 个来实现的。最后，我们应用从特征提取过程中获得的另一种统计知识（特征在可执行文件中的存在/不存在）来训练分类器。\n\n我们的研究贡献如下。首先，我们提出并实现了\
  \ HFR（混合特征检索）模型，结合了上述三种特征。其次，我们应用一种新颖的想法，利用二进制 `n-gram` 特征提取汇编指令特征，并通过 AFR 算法实现。第三，我们提出并实现了一个可扩展的解决方案，用于解决一般的\
  \ `n-gram` 特征提取和选择问题。我们的解决方案在有限内存下工作良好，并通过应用高效强大的数据结构和算法显著减少了运行时间。因此，它可扩展到大量可执行文件集合（数千量级），即使在有限的主内存和处理器速度下。最后，我们将结果与\
  \ [KOLT2004] 的结果进行比较，后者仅使用二进制 `n-gram` 特征，并表明我们的方法获得了更好的准确性。我们还报告了我们方法与 [KOLT2004]\
  \ 方法的性能/成本权衡。必须指出的是，我们的主要贡献是一种高效的特征提取技术，而非分类技术。我们通过实证证明，无论使用何种分类器（如 SVM/决策树），利用我们算法提取的组合特征集（即\
  \ HFS）均优于其他单独特征集（如二进制 `n-gram`）。\n\n### 6.2.2 相关工作\n\n\n\n近年来，检测恶意可执行文件方面已投入大量精力。自动化检测过程主要有两种主流技术：行为分析和基于内容的分析。行为分析法主要用于检测移动恶意代码。该技术用于分析网络流量特征，如源/目的端口、IP\
  \ 地址、各种数据包级/流级统计信息，以及应用级特征，如电子邮件附件类型、附件大小等。行为分析法的示例包括社交网络分析 [GOLB2004, NEWM2002]\
  \ 和统计分析 [SCHU2001a]。[MASU2007a] 提出了一种基于数据挖掘的行为分析法来检测电子邮件蠕虫。[GARG2006] 结合机器学习应用特征提取技术进行\
  \ `masquerade detection`。他们从基于 GUI 系统的用户行为中提取特征，如鼠标速度、每会话点击次数等。然后将问题建模为二分类问题，并使用\
  \ SVM 进行训练和测试。我们的方法是基于内容的，而非行为分析。\n\n基于内容的方法分析可执行文件的内容。其中一些试图从网络数据包载荷中自动生成签名。示例包括\
  \ EarlyBird [SING2003]、Autograph [KIM2004] 和 Polygraph [NEWS2005]。相比之下，我们的方法不需要签名生成或签名匹配。其他一些基于内容的技术从可执行文件中提取特征并应用机器学习来检测恶意可执行文件。示例见\
  \ [SCHU2001b] 和 [KOLT2004]。[SCHU2001a] 和 [SCHU2001b] 中的工作使用 GNU Bin-Utils 从 Windows\
  \ PE 可执行文件 [CYGN1999, Windows P.E.] 的头部提取 DLL 调用信息，使用 GNU `strings` 提取字符串。此外，他们还使用字节序列作为特征。我们使用字节序列和\
  \ DLL 调用信息，但也应用反汇编并使用汇编指令作为特征。此外，我们提取各种长度（2 到 10 字节）的字节模式，而他们仅提取 2 字节长度的模式。[KOLT2004]\
  \ 做了类似的工作。他们从二进制可执行文件中提取二进制 `n-gram` 特征，将其应用于不同的分类方法，并报告准确率。我们的模型不同于 [KOLT2004]，因为我们不仅从反汇编的可执行文件中提取二进制\
  \ `n-gram`，还提取汇编指令序列，并从程序头收集 DLL 调用信息。我们仅将模型性能与 [KOLT2004] 进行比较，因为他们报告的准确率高于 [SCHU2001a]\
  \ 和 [SCHU2001b] 中给出的准确率。\n\n### 6.2.3 混合特征检索模型\n\n我们的 HFR 模型是恶意代码检测中的一个新颖思路。它利用从二进制可执行文件获得的信息，从反汇编的可执行文件中提取有用特征。然后将汇编特征与其他特征（如\
  \ DLL 函数调用和二进制 `n-gram` 特征）相结合。我们解决了许多棘手的实现问题，并提供了高效、可扩展且实用的解决方案。实施过程中面临的困难与内存限制和长运行时间有关。通过使用高效的数据结构、算法和磁盘\
  \ I/O，我们能够实现一个快速、可扩展且稳健的恶意代码检测系统。我们在两个具有不同类分布的数据集上运行实验，并表明更真实的分布能提高模型性能。\n\n我们的模型也存在一些局限性。首先，它无法直接处理混淆的\
  \ DLL 调用或加密/打包的二进制文件。已有技术可用于检测二进制文件中的混淆 DLL 调用 [LAKH2005] 并自动解包打包的二进制文件。我们可以应用这些工具进行去混淆/解密，并将其输出用于我们的模型。尽管尚未实现，但我们期待在未来的版本中将这些工具与我们的模型集成。其次，当前实现是一种离线检测机制。这意味着它不能直接部署在网络上以检测恶意代码。然而，它可以近实时地检测恶意代码。\n\
  \n我们将在未来的工作中解决这些问题，并承诺解决这些问题。我们还提出了几种模型修改方案。例如，我们希望将我们的特征与可执行文件的 `run-time` 特征相结合。此外，我们提议建立一个特征数据库，存储所有特征并增量更新。这将节省大量训练时间和内存。我们的方法如\
  \ 图 6.3 所示。\n\n![图 6.3 我们检测恶意可执行文件的方法。](img/fig6_3.jpg)\n\n图 6.3 我们检测恶意可执行文件的方法。\n\
  \n## 6.3 数据挖掘工具的设计\n\n### 6.3.1 使用 n-Gram 分析进行特征提取\n\n在深入介绍流程细节之前，我们展示 图 6.4 中来自电子邮件蠕虫\
  \ “Win32.Ainjo.e” 的代码片段，并将其作为本章贯穿始终的运行示例。\n\n![图 6.4 来自电子邮件蠕虫 “Win32.Ainjo.e” 的代码片段和\
  \ DLL 调用信息。](img/fig6_4.jpg)\n\n图 6.4 来自电子邮件蠕虫 “Win32.Ainjo.e” 的代码片段和 DLL 调用信息。\n\
  \n使用 `n-gram` 分析进行特征提取涉及从给定数据集（`training set`）中提取所有可能的 `n-gram`，并从中选择最佳的 `n-gram`。每个这样的\
  \ `n-gram` 都是一个特征。我们将 `n-gram` 的概念从字节扩展到汇编指令和 DLL 函数调用。即，`n-gram` 可以是 `n` 个字节的序列、`n`\
  \ 条汇编指令的序列，或 `n` 个 DLL 函数调用的序列，具体取决于我们是从二进制可执行文件、汇编程序还是 DLL 调用序列中提取特征。在提取 `n-gram`\
  \ 之前，我们通过将二进制可执行文件转换为 `hexdump` 文件和 `assembly program` 文件来对其进行预处理，稍后将对此进行解释。\n\n\
  #### 6.3.1.1 二进制 n-Gram 特征\n\n此处的粒度级别为 `byte`。我们应用 UNIX “hexdump” 实用程序将二进制可执行文件转换为文本文件（以下称为\
  \ “hexdump 文件”），其中包含对应于二进制文件每个字节的十六进制数字。此过程旨在确保二进制可执行文件的安全且便捷的可移植性。特征提取过程包含两个阶段：(i)\
  \ 特征收集，(ii) 特征选择，以下小节将对两者进行解释。\n\n#### 6.3.1.2 特征收集\n\n我们从 “hexdump” 文件中收集二进制 `n-gram`。这在示例\
  \ I 中进行了说明。\n\n![](img/inline6_1.jpg)\n\n\n\n基本特征收集过程如下运行。首先，我们将 *n*\\-gram 列表 *L*\
  \ 初始化为空。然后我们通过滑动 *n*\\-字节窗口扫描每个十六进制转储文件。每个这样的 *n*\\-字节序列就是一个 *n*\\-gram。每个 *n*\\\
  -gram *g* 关联两个值：*p*[1] 和 *n*[1]，分别表示包含 *g* 的正实例（即恶意可执行文件）和负实例（即良性可执行文件）的总数。如果在 *L*\
  \ 中未找到 *g*，则将 *g* 添加到 *L*，并根据需要更新 *p*[1] 和 *n*[1]。如果 *g* 已在 *L* 中，则仅更新 *p*[1] 和\
  \ *n*[1]。当所有十六进制转储文件扫描完毕时，*L* 包含数据集中所有唯一的 *n*\\-gram 及其在正负实例中的频率。这种基本方法存在几个实现问题。首先，*n*\\\
  -gram 的总数可能非常大。例如，我们在第二个数据集中 10-gram 的总数是 2 亿。可能无法将它们全部存储在计算机主内存中。为解决此问题，我们将 *n*\\\
  -gram 存储在磁盘文件 *F* 中。其次，如果 *L* 未排序，则每个扫描到的 *n*\\-gram 都需要线性搜索来测试它是否已在 *L* 中。如果 *N*\
  \ 是数据集中 *n*\\-gram 的总数，则收集所有 *n*\\-gram 的时间将是 *O*(*N*²)，当 *N* = 2 亿时，这是不切实际的时间量。\n\
  \n为了解决第二个问题，我们使用一种称为 Adelson Velsky Landis (AVL) 树 [GOOD2006] 的数据结构在内存中存储 *n*\\\
  -gram。AVL 树是一种高度平衡的二叉搜索树。该树具有这样一个性质：任意节点的左子树和右子树高度的绝对差值至多为 1。如果在插入或删除期间违反此性质，则执行平衡操作，树恢复其高度平衡性质。保证插入和删除在对数时间内执行。因此，为了在内存中插入一个\
  \ *n*\\-gram，我们现在只需要 *O*(log[2] (*N*)) 次搜索。因此，总运行时间减少到 *O*(*N*log[2] (*N*))，当 *N*\
  \ 多达 2 亿时，总体运行时间大约快 500 万倍。我们的特征收集算法 `extract feature` 实现了这两个解决方案。它在 算法 6.1 中进行了说明。\n\
  \n算法描述：第 3 行的 `for` 循环针对训练集中的每个十六进制转储文件运行。第 4 行的内层 `while` 循环收集一个文件的所有 *n*\\-gram，如果不在\
  \ AVL 树中则将其添加进去。第 8 行执行测试，查看树大小是否超过了内存限制（阈值）。如果超过且 *F* 为空，则将树的内容保存到 *F* 中（第 9 行）。如果\
  \ *F* 不为空，则将树的内容与 *F* 合并（第 10 行）。最后，我们从树中删除所有节点（第 12 行）。\n\n时间复杂度：*T* = 时间 (*n*\\\
  -gram 读取和插入树) + 时间 (与磁盘合并) = *O*(*B*log[2]*K*) + *O*(*N*)，其中 *B* 是以字节为单位的训练数据总大小，*K*\
  \ 是树的最大节点数（即阈值），*N* 是收集的 *n*\\-gram 总数。空间复杂度：*O*(*K*)，其中 *K* 定义如上。\n\n#### 6.3.1.3\
  \ 特征选择\n\n如果提取的特征总数非常大，由于几个原因，可能无法将它们全部用于训练。首先，内存需求可能不切实际。其次，训练可能太慢。第三，分类器可能会因大量特征而感到困惑，因为其中大多数将是嘈杂的、冗余的或无关的。因此，我们要选择一个小的、相关的和有用的特征子集。我们选择信息增益\
  \ (IG) 作为选择标准，因为它是文献中用于选择最佳特征的最佳标准之一。\n\nIG 可以定义为属性（即特征）在对训练数据进行分类时有效性的度量 [MITC1997]。如果我们基于该属性的值分割训练数据，则\
  \ IG 给出分割后熵的预期减少量。一个属性能减少训练数据中熵越多，该属性在对数据分类方面就越好。属性 *A* 在实例集合 *I* 上的 IG 由公式 (6.1)\
  \ 给出：\n\n$$Gain(I,A) \\equiv Entropy(I) - \\sum_{V \\in values(A)}{\\frac{p_{v}\
  \ + n_{v}}{p + n}Entropy(I_{v})} \\tag{6.1}$$\n\n其中 *values*(*A*) 是属性 *A* 所有可能值的集合；*I*[*v*]\
  \ 是 *I* 的子集，其中所有实例的 *A* 值均为 *v*；*p* 是 *I* 中正实例的总数；*n* 是 *I* 中负实例的总数；*p*[*v*] 是 *I*[*v*]\
  \ 中正实例的总数；*n*[*v*] 是 *I*[*v*] 中负实例的总数。\n\n在我们的案例中，每个属性只有两个可能的值，即 *v* ∈ {0, 1}。如果属性\
  \ *A*（即一个 *n*\\-gram）存在于实例 *X* 中，则 *X*[*A*] = 1，否则为 0。*I* 的熵使用以下公式 (6.2) 计算：\n\n\
  $$Entropy(I) = - \\frac{p}{p + n}\\log_{2}\\left( \\frac{p}{p + n} \\right) - \\\
  frac{n}{p + n}\\log_{2}\\left( \\frac{n}{p + n} \\right) \\tag{6.2}$$\n\n其中 *I*、*p*\
  \ 和 *n* 定义如上。将 (6.2) 代入 (6.1) 并令 *t* = *n* + *p*，我们得到\n\n$$Gain(I,A) \\equiv - \\\
  frac{p}{t}\\log_{2}\\left( \\frac{p}{t} \\right) - \\frac{n}{t}\\log_{2}\\left(\
  \ \\frac{n}{t} \\right) - \\sum_{v \\in \\{ 0,1\\}}{\\frac{t_{v}}{t}\\left( - \\\
  frac{p_{v}}{t_{v}}\\log_{2}\\left( \\frac{p_{v}}{t_{v}} \\right) - \\frac{n_{v}}{t_{v}}\\\
  log_{2}\\left( \\frac{n_{v}}{t_{v}} \\right) \\right)} \\tag{6.3}$$\n\n现在，下一个问题是根据\
  \ IG 选择最佳的 *S* 个特征（即 *n*\\-gram）。一种简单的方法是按 IG 非递增顺序对 *n*\\-gram 排序并选择前 *S* 个，这需要\
  \ *O*(*N*log[2]*N*) 时间和 *O*(*N*) 主内存。但使用 `heap` 可以更高效地完成此选择，它需要 *O*(*N*log[2]*S*)\
  \ 时间和 *O*(*S*) 主内存。对于 *S* = 500 和 *N* = 2 亿，此方法快 3 倍以上，且所需主内存减少 40 万倍。`heap` 是一种平衡二叉树，具有这样一个性质：任何子树的根包含该子树中的最小（最大）元素。我们使用\
  \ `min-heap`，其根始终具有最小值。算法 6.2 概述了特征选择算法。首先，`heap` 初始化为空。然后从磁盘读取 *n*\\-gram（及其频率）（第\
  \ 2 行）并插入 `heap`（第 5 行），直到 `heap` 大小变为 *S*。`heap` 大小变为 *S* 后，我们将下一个 *n*\\-gram *g*\
  \ 的 IG 与根的 IG 进行比较。如果 IG(*root*) >= IG(*g*)，则丢弃 *g*（第 6 行），因为 `root` 具有最小 IG。否则，用\
  \ *g* 替换 `root`（第 7 行）。最后，恢复 `heap` 性质（第 9 行）。当磁盘中没有更多 *n*\\-gram 时，过程终止。终止后，我们在\
  \ `heap` 中拥有最佳的 *S* 个 *n*\\-gram。\n\n插入和恢复仅需 *O*(log2) 时间。因此，所需总时间为 *O*(*N*log[2]*S*)，仅需\
  \ *O*(*S*) 主内存。我们将使用 IG 准则选出的最佳 *S* 个二进制特征表示为二进制特征集 (BFS)。\n\n#### 6.3.1.4 汇编 *n*\\\
  -Gram 特征\n\n\n\n在这种情况下，粒度级别为汇编指令。首先，我们使用名为 `PEDisassem` 的反汇编工具 [Windows P.E.] 反汇编所有二进制文件。它用于反汇编\
  \ Windows 可移植可执行 (P.E.) 文件。除了生成带有操作码和地址信息的汇编指令外，`PEDisassem` 还提供有用信息，如所用资源列表（例如光标）、调用的\
  \ DLL 函数列表、导出函数列表、代码块内的字符串列表等。为了提取汇编 *n*-gram 特征，我们采用类似于二进制 *n*-gram 特征提取的方法。首先，我们收集所有可能的\
  \ *n*-gram，即 *n* 条连续汇编指令的序列，并根据 IG 选择其中最好的 *S* 个。从今以后，我们将这一选定的特征集称为汇编特征集 (AFS)。我们面临的困难与二进制\
  \ *n*-gram 提取中的相同，例如内存受限和运行速度慢，并以相同的方式解决它们。示例 II 说明了汇编 *n*-gram 特征。\n\n![](img/inline6_2.jpg)\n\
  \n我们采用一种标准的汇编指令表示法，其格式如下：`name.param1.param2`。Name 为指令名称（例如 `mov`），param1 为第一个参数，param2\
  \ 为第二个参数。同样，参数可以是 {`register`, `memory`, `constant`} 中的一种。因此，上述第二条指令 `or byte [eax+14002700],\
  \ dl` 在我们的表示法中变为 `or.memory.register`。\n\n#### 6.3.1.5 DLL 函数调用特征\n\n此处粒度级别为 DLL\
  \ 函数调用。DLL 函数调用的 *n*-gram 是可执行文件中 *n* 个 DLL 函数调用的序列（两次连续调用之间可能夹杂其他指令）。我们从反汇编文件的头部提取程序所进行的\
  \ DLL 函数调用信息。这在图 6.2 中有所说明。在我们的实验中，我们仅使用 DLL 调用的 1-gram，因为高阶 gram 的性能较差。我们枚举每个良性和恶意可执行文件所使用的所有\
  \ DLL 函数名称，并利用信息增益选择其中最好的 *S* 个。我们将这一特征集称为 *DLL 调用特征集* (DFS)。\n\n### 6.3.2 混合特征检索模型的细节\n\
  \nHFR 模型提取并组合三种不同类型的特征。HFR 由不同的阶段和组件组成。特征提取组件已在前文详细讨论。以下是该模型的简要描述。\n\n#### 6.3.2.1\
  \ 模型描述\n\nHFR 模型包含两个阶段：训练阶段和测试阶段。训练阶段如 图 6.5(a) 所示，测试阶段如图 6.5(b) 所示。在训练阶段，我们使用本章解释的方法提取二进制\
  \ *n*-gram 特征 (BFS) 和 DLL 调用特征 (DFS)。然后我们应用 AFR 算法（稍后将解释）来检索代表所选二进制 *n*-gram 特征的派生汇编特征\
  \ (DAF)。这三种特征简称为 HFS 并组合在一起。请注意，DAF 与汇编 *n*-gram 特征（即 AFS）是不同的。\n\n![图 6.5 混合特征检索模型：(a)\
  \ 训练阶段，(b) 测试阶段。](img/fig6_5.jpg)\n\n图 6.5 混合特征检索模型：(a) 训练阶段，(b) 测试阶段。\n\n由于我们的发现表明\
  \ DAF 表现更好，因此 AFS 未用于 HFS。我们使用本章解释的技术计算对应于 HFS 的二进制特征向量，并使用 SVM、提升决策树和其他分类方法训练分类器。在测试阶段，我们扫描每个测试实例并计算对应于\
  \ HFS 的特征向量。该向量将针对分类器进行测试。分类器输出测试文件的类别预测 {良性, 恶意}。\n\n#### 6.3.2.2 汇编特征检索 (AFR)\
  \ 算法\n\nAFR 算法用于提取对应于二进制 *n*-gram 特征的汇编指令序列（即 DAF）。其主要思想是获取给定二进制 *n*-gram 特征的完整汇编指令序列。使用\
  \ DAF 的基本原理如下。二进制 *n*-gram 可能仅代表部分信息，例如一条或多条汇编指令的部分内容，或代码块内的字符串。我们应用 AFR 算法来获取对应于该部分信息的完整指令或指令序列（即\
  \ DAF）。因此，DAF 代表了更完整的信息，这在区分恶意和良性可执行文件时应更有用。然而，二进制 *n*-gram 仍然是必需的，因为它们还包含其他信息，如字符串数据或程序头部的重要字节。AFR\
  \ 算法包含几个步骤。在第一步中，应用 `线性地址匹配` 技术，具体如下。利用十六进制转储文件中 *n*-gram 的偏移地址，在相应的汇编程序文件中同一偏移处查找指令。根据偏移值，可能出现以下三种情况之一：\n\
  \n1.  偏移位于程序入口点之前，因此该 *n*-gram 没有对应的汇编代码。我们将此地址称为 *入口点前地址* (ABEP)。\n\n2.  该偏移处有数据但无代码。我们将此地址称为\
  \ DATA。\n\n3.  该偏移处有代码。我们将此地址称为 CODE。如果该偏移位于一条指令的中间，则我们取该完整指令及从该指令起 *n* 字节范围内的连续指令。\n\
  \n在第二步中，从所有 CODE 实例中选择最佳的 CODE 实例。我们应用一种启发式方法来寻找最佳序列，称为 *最具区分度指令序列* (MDIS) 启发式。根据该启发式，我们选择具有最高\
  \ IG 的指令序列。AFR 算法如 算法 6.3 所示。\n\n算法描述：第 1 行初始化将包含汇编序列的列表。第 2 行的 `for` 循环针对每个十六进制转储文件运行。扫描每个十六进制转储文件并提取\
  \ *n*-gram（第 4-5 行）。如果这些 *n*-gram 中的任何一个在 BFS 中（第 6-7 行），则我们从相应的汇编程序文件中对应地址处读取指令序列（第\
  \ 8-10 行）。该序列被添加到相应的列表中（第 12 行）。通过这种方式，我们收集了 BFS 中每个 *n*-gram 对应的所有序列。在第 II 阶段，我们使用\
  \ IG 从每个 *n*-gram 列表中选择最佳序列（第 18-21 行）。最后，我们返回最佳序列，即 DAF。\n\n该算法的时间复杂度为 *O*(*nB*log[2]*S*)，其中\
  \ *B* 为训练集总大小（以*字节*为单位），*S* 为选定的二进制 *n*-gram 总数，*n* 为每个 *n*-gram 的大小（以*字节*为单位）。空间复杂度为\
  \ *O*(*SC*)，其中 *S* 定义如上，*C* 为每个二进制 *n*-gram 找到的汇编序列的平均数量。所有三种算法的运行时间和内存需求见 第 6.4\
  \ 节。\n\n#### 6.3.2.3 特征向量计算与分类\n\n\n\n特征集（如 `HFS`、`BFS`）中的每个特征均为二元特征，即其值为 1 或 0。若某实例（即可执行文件）包含该特征，则其值为\
  \ 1；否则为 0。针对每个训练（或测试）实例，我们计算一个特征向量，该向量是由相应特征集的特征值组成的位向量。例如，若要计算特定实例 `I` 对应 `BFS`\
  \ 的特征向量 `V[BFS]`，则对 `BFS` 中的每个特征 `f` 在 `I` 中进行搜索。若在 `I` 中找到 `f`，则将 `V[BFS][f]`（即对应\
  \ `f` 的位）置为 1；否则置为 0。通过这种方式，我们设置/重置特征向量中的每一位。这些特征向量供分类器用于训练/测试。\n\n我们应用 `SVM`、`朴素贝叶斯\
  \ (NB)`、提升决策树及其他分类器执行分类任务。`SVM` 可执行线性或非线性分类。Vladimir Vapnik 提出的线性分类器创建一个超平面，以最大间隔将数据点分为两类。最大间隔超平面将训练样本分为两个子集，使超平面与其最近数据点之间的距离最大化。非线性\
  \ `SVM` [BOSE2003] 通过将核技巧应用于最大间隔超平面来实现。特征空间被转换到更高维的空间，在该空间中找到最大间隔超平面。决策树在每个内部节点包含属性测试，在每个叶节点包含决策。它通过从根节点到决策节点执行属性测试来对实例进行分类。决策树是一种基于规则的分类器，意味着我们可以从树中获得人类可读的分类规则。`J48`\
  \ 是 `C4.5` 决策树算法的实现。`C4.5` 是 Quinlan 发明的 `ID3` 算法的扩展。一种称为 `AdaBoost` 的提升技术通过根据分类性能为每个分类器分配权重来组合多个分类器。算法首先为所有训练样本分配相等的权重，并从该训练数据获得一个模型。然后增加每个误分类样本的权重，并从新的训练数据获得另一个模型。此过程迭代指定次数。分类时，将这些模型中的每一个应用于测试数据，并执行加权投票以确定测试实例的类别。我们在\
  \ `NB` 和 `J48` 上使用 `AdaBoost.M1` 算法 [FREU1996]。我们仅报告 `SVM` 和提升 `J48` 的结果，因为它们效果最好。应注意，我们对这两种分类器没有任何偏好。我们将在下一节讨论实验结果。\n\
  \n## 6.4 评估与结果\n\n### 6.4.1 实验\n\n我们设计实验在两个不同的数据集上运行。每个数据集具有不同规模和分布的良性与恶意可执行文件。我们使用\
  \ [MASU2011] 中解释的技术生成各类 `n`-gram 特征（如 `BFS`、`AFS`、`DFS`）。注意 `BFS` 对应 [KOLT2004]\
  \ 方法提取的特征。我们还按照 [MASU2011] 中解释的模型生成 `DAF` 和 `HFS`。我们应用三折交叉验证，使用 `SVM`、决策树、`朴素贝叶斯`、`贝叶斯网络`\
  \ 和提升决策树等分类器测试各特征集的准确率。在这些分类器中，`SVM` 和提升决策树取得最佳结果，已在 [MASU2011] 中报告。因篇幅限制，我们不报告其他分类器的结果。此外，我们计算平均准确率、假阳性率和假阴性率，以及接收者操作特征\
  \ (`ROC`) 图（使用 [FAWC2003] 中的技术）。我们还对比 `HFS` 和 `BFS` 的运行时间及性能/成本权衡。\n\n### 6.4.2\
  \ 数据集\n\n我们有两个非不相交数据集。第一个数据集（`dataset1`）包含 1,435 个可执行文件，其中 597 个为良性，838 个为恶意。第二个数据集（`dataset2`）包含\
  \ 2,452 个可执行文件，其中 1,370 个为良性，1,082 个为恶意。因此，`dataset1` 的分布为良性 = 41.6%，恶意 = 58.4%；`dataset2`\
  \ 的分布为良性 = 55.9%，恶意 = 44.1%。特意选择此分布是为了在不同场景下评估特征集的性能。我们从不同的 Windows XP 和 Windows\
  \ 2000 机器收集良性可执行文件，从 [VX-Heavens] 收集恶意可执行文件，后者包含大量恶意可执行文件。良性可执行文件包含 Windows 安装文件夹（如\
  \ `C:\\Windows`）中的各种应用程序，以及默认程序安装目录（如 `C:\\Program Files`）中的其他可执行文件。恶意可执行文件包含病毒、蠕虫、特洛伊木马和后门。两种情况下我们均仅选择\
  \ Win32 可移植可执行文件 [Windows P.E.]。我们未来希望尝试 `ELF` 可执行文件。\n\n### 6.4.3 实验设置\n\n我们的实现基于\
  \ `Java` 和 `JDK 1.5` 开发。我们使用 `libSVM` 库 [LIBSVM] 运行 `SVM`，使用 `Weka ML` 工具箱 [WEKA]\
  \ 运行提升决策树及其他分类器。对于 `SVM`，我们运行带多项式核的 `C-SVC`；设置 `gamma = 0.1`，`epsilon = 1.0E-12`。对于提升决策树，我们在\
  \ `C4.5` 决策树算法（称为 `J48`）上运行十次 `AdaBoost` 算法迭代。\n\n我们将参数 `S`（选定特征数）设为 500，因为实验表明这是最佳值。大多数实验在两台机器上运行：一台配备\
  \ 4GB 内存和 2GHz 时钟频率的 Sun Solaris 机器，一台配备 2GB 内存和 1.8GHz 时钟频率的 `LINUX` 机器。报告的运行时间基于后者。所有机器可执行文件的反汇编和十六进制转储仅执行一次，生成的文件被存储。随后我们在存储的文件上运行实验。\n\
  \n### 6.4.4 结果\n\n本小节首先报告并分析在数据集上运行 `SVM` 获得的结果。随后展示提升 `J48` 的准确率。由于提升 `J48` 的结果与\
  \ `SVM` 几乎相同，我们不报告基于提升 `J48` 的分析。\n\n#### 6.4.4.1 准确率\n\n表 6.1 显示了 `SVM` 在不同特征集上的准确率。标题为\
  \ `HFS`、`BFS` 和 `AFS` 的列分别代表 `HFS`（我们的方法）、`BFS`（Kolter & Maloof 的特征集）和 `AFS` 的准确率。注意\
  \ `AFS` 与 `HFS` 中使用的 `DAF` 不同。表 6.1 报告称，`HFS` 的分类准确率在两个数据集上始终优于其他模型。有趣的是，1-gram\
  \ `BFS` 在两个数据集上的准确率均很低。这是因为 1-gram 仅为 1 字节长的模式，仅有 256 种不同可能。因此，该模式在区分恶意可执行文件与正常文件方面毫无用处，可能不适用于实际应用。因此，在计算平均准确率（即最后一行）时，我们排除了\
  \ 1-gram 的准确率。\n\n表 6.1 不同特征集上 SVM 的分类准确率 (%)\n\n| ![](img/inline6_3.jpg) |\n\n\
  | --- |\n\n##### 6.4.4.1.1 Dataset1\n\n\n\n此处混合模型的最佳准确率出现在 `n` = 6 时，为 97.4%，且在所有特征集中最高。平均而言，HFS\
  \ 的准确率比 BFS 高 1.68%，比 AFS 高 11.36%。AFS 的准确率始终最低。导致这种表现不佳的一个可能原因是 AFS 仅考虑可执行文件的 CODE\
  \ 部分。因此，AFS 会遗漏 ABEP 或 DATA 部分所携带的任何区分模式，导致提取的特征性能较差。此外，当 `n` >= 10 时，AFS 的准确率大幅下降。这是因为较长的指令序列在任一类可执行文件（恶意/良性）中都较为罕见，所以这些序列的区分能力较弱。另一方面，BFS\
  \ 考虑了可执行文件的所有部分，从而实现了更高的准确率。最后，HFS 同时考虑了 DLL 调用、BFS 和 DAF。因此，HFS 的性能优于 BFS。\n\n\
  ##### 6.4.4.1.2 数据集 2\n\n此处 HFS 与 BFS 准确率之间的差异大于数据集 1。HFS 的平均准确率比 BFS 高 4.2%。AFS\
  \ 的准确率再次垫底。值得注意的是，在数据集 2 中，HFS 相对于 BFS（和 AFS）的性能有所提升。由此可得出两个重要结论。首先，数据集 2 比数据集 1\
  \ 大得多，拥有更多样化的样本集。在此 HFS 表现优于数据集 1，而 BFS 表现劣于数据集 1。这意味着在多样化且更大的实例集合中，HFS 比 BFS 更稳健。因此，HFS\
  \ 在大规模、多样化的可执行文件语料库中比 BFS 更适用。其次，数据集 2 的良性可执行文件多于恶意文件，而数据集 1 的良性文件较少。数据集 2 的这种分布更符合现实世界的情况，即良性可执行文件的数量多于恶意文件。这意味着在包含更多良性可执行文件的数据集这一现实场景中，HFS\
  \ 很可能比 BFS 表现更好。\n\n##### 6.4.4.1.3 统计显著性检验\n\n我们还对 HFS 和 BFS 的准确率进行了成对双尾 `t` 检验，以测试它们准确率之间的差异是否具有统计显著性。基于上述原因，我们将\
  \ 1-gram 的准确率排除在该检验之外。`t` 检验的结果总结在 表 6.2 中。表中所示的 `t` 值是根据准确率计算得出的 `t` 值。自由度为 (5\
  \ + 5 ‒ 2)，因为每组有五个观测值，且共有两组（即 HFS 和 BFS）。*Probability*（概率）表示拒绝原假设（即 HFS 和 BFS 准确率无差异）的概率，而\
  \ `p` 值表示接受原假设的概率。对于数据集 1，该概率为 99.65%，对于数据集 2，则为 100.0%。因此，我们得出结论：HFS 的平均准确率显著高于\
  \ BFS。\n\n表 6.2 比较 HFS 和 BFS 的成对双尾 `t` 检验结果\n\n```\n![](img/inline6_4.jpg)\n```\n\
