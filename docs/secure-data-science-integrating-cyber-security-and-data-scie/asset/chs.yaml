  \ [LIU2007] 中，作者研究了三个不同的真实数据集，基于重构的方法在所有这些数据集上均失败了。这些结果支持我们寻找从扰动数据中直接执行隐私保护数据挖掘方法的动机。\n\
  \n### 12.7.4 PPDTC4.5 分类器准确率\n\n使用前文描述的数据集，我们进行了不同的实验。在原始训练数据集上应用 WEKA [WITT2005]\
  \ C4.5 算法构建决策树，并对原始测试数据集进行分类，可获得 83.40% 的准确率。表 12.4 显示了直接在扰动数据集上应用数据挖掘工具的准确率。表 12.7\
  \ 显示了我们提出的 PPDTC4.5 算法的数据挖掘准确率。\n\n我们可以看到，当在这五个数据集上使用我们提出的 PPDTC4.5 阈值方法构建决策树并在原始数据集上分类时：Data\
  \ 1 和 Data 2 的准确率高于在扰动数据上分类的准确率；Data 5 相当；Data 3 和 Data 4 较低。原因在于信噪比（SNR）值在此起关键作用。表\
  \ 12.1 显示了具有不同 SNR 值的扰动数据集。当 SNR 小于 1.0 时，意味着噪声数据的方差 `σ²` 大于实际数据的方差 `σ²`。换句话说，Data\
  \ 3 和 Data 4 引入了更多噪声。我们的算法在 SNR 值大于 1.0 时取得良好结果。当阈值方法构建的决策树分类器不适合对扰动数据集进行分类时，是因为我们的算法估计分裂点并划分训练数据，就像原始数据那样。\n\
  \n#### 表 12.7 提出的 PPDTC4.5 数据挖掘准确率\n\n| 我们提出的 PPDTC4.5 分类器准确率 (%) | | | | | | |\n\
  | --- | --- | --- | --- | --- | --- | --- |\n| 数据集 | | Data 1 | Data 2 | Data 3\
  \ | Data 4 | Data 5 |\n| **PPDTC4.5 阈值方法** | | | | | | |\n| 在原始数据上测试 | | 80.74 |\
  \ 79.69 | 76.63 | 77.02 | 80.29 |\n| 在扰动数据上测试 | | 76.09 | 76.14 | 74.41 | 76.03\
  \ | 80.52 |\n| **PPDTC4.5 随机路径选择方法** | | | | | | |\n| 在原始数据上测试 | | 78.72 | 77.21\
  \ | 77.67 | 78.01 | 80.31 |\n| 在扰动数据上测试 | | 78.40 | 77.77 | 77.30 | 77.06 | 80.32\
  \ |\n\n为了构建对扰动数据进行分类的分类器，我们使用概率作为权重寻找最佳分裂点，并使用随机路径选择来划分训练数据，但目前分类器准确率与直接应用 WEKA\
  \ C4.5 算法相比并未显著提高。原因在于在划分训练数据集和对测试数据集分类时，随机路径选择方法不能很好地约束随机噪声 `R`。未来，我们希望找到一种更好的方法来约束\
  \ `R` 值，以构建更适合对扰动数据进行分类的分类器。\n\n正如我们在实验结果中所见，与直接将数据挖掘技术应用于扰动数据集获得的结果相比，我们提出的 PPDTC4.5\
  \ 分类器可能无法获得非常令人振奋的高准确率。但与基于重构的方法相比，我们的方法取得了非常好的结果。我们想表达的观点是：避免求解困难的分布问题，而是将数据挖掘函数映射为构建隐私保护数据挖掘方法。这是一个有前景的方向。此外，我们的实验结果还表明，当有海量数据集可用时，白噪声不再能阻止数据挖掘工具提取模式。因此，当数据集足够大时，直接挖掘扰动数据集也是一种好的方法。\n\
  \n\n\n\n\n#### PPDTC4.5 阈值方法\n\n在 PPDTC4.5 阈值方法中，我们知道选择不同的阈值会影响数据挖掘的准确性。选择阈值以获得良好的数据挖掘结果与添加到数据中的随机噪声分布以及数据本身有关。在我们的实验中，当使用均匀分布随机噪声扭曲数据时，`0.5`\
  \ 是获得高准确率分类器的良好阈值；当使用高斯分布随机噪声扭曲数据时，`0.3` 是获得高准确率分类器的良好阈值。数据挖掘准确性与阈值之间的关系如 Figure\
  \ 12.2 和 Figure 12.3 所示。最佳阈值应随数据而变化。换句话说，这取决于数据属性。\n\n![Figure 12.2 Threshold method\
  \ of PPDTC4.5 classifier accuracy on 10k uniform perturbed training data 16k original\
  \ test data.](img/fig12_2.jpg)\n\nFigure 12.2 PPDTC4.5 分类器在 10k 均匀扰动训练数据和 16k 原始测试数据上的准确率阈值方法。\n\
  \n![Figure 12.3 Threshold method of PPDTC4.5 classifier accuracy on 32K Gaussian\
  \ Perturbed training data 16k original test data.](img/fig12_3.jpg)\n\nFigure 12.3\
  \ PPDTC4.5 分类器在 32K 高斯扰动训练数据和 16k 原始测试数据上的准确率阈值方法。\n\n### 12.7.5 算法复杂度\n\n给定 `n`\
  \ 个实例、`m` 个属性和 `p` 个标签值，数值连续属性的潜在分裂点数量 `t` 最大为 `n - 1`。C4.5 算法在训练阶段的复杂度为 `O(nlgn\
  \ + tmp)`。我们的算法为每个给定的潜在分裂点 `t` 评估实例 `w[j]` 的概率，这在最坏情况下将算法复杂度增加到 `O(ntmp)`。由于我们的算法跳过了为每个属性重建原始分布的步骤，与\
  \ [AGRA2000] 中给出的 BE 重建算法相比，运行时间非常合理。在 BE 重建算法中，有一个停止参数来确定何时停止估计分布的计算。然而，当循环计算更多时，运行时间更高，但我们能获得更好的估计分布准确性。在我们的实验中，基于停止参数的不同选择，BE\
  \ 重建算法的运行时间比我们在相同配置计算机上运行的提议算法长三到五倍。\n\n## 12.8 总结与展望\n\n我们描述了一种修改后的 C4.5 决策树分类器，适用于隐私保护数据挖掘。该分类器基于扰动数据集构建，模型可用于以高准确性对原始数据进行分类。在多方参与全局数据挖掘而不泄露隐私的场景中，与基于密码学的方法相比，我们的算法降低了通信和计算成本。我们的算法基于扰动方案，但跳过了重建原始数据分布的步骤。我们的技术在减少计算时间的同时增强了隐私保护。\n\
  \n如前所述，由于扰动过程保留了数据的某些本质，某些数据挖掘技术可以直接应用于扰动数据。朴素贝叶斯分类器可直接应用于加性扰动数据，基于欧氏距离的数据挖掘工具（例如\
  \ `k-Nearest Neighbor Classifier`、`Support Vector Machines` 和 `Perceptrons Neural\
  \ Network`）可应用于乘性扰动数据。但是，由于过程中的信息损失以及某些数据挖掘方法本身可能表现不佳，数据挖掘准确性会降低。正如我们所知，`k-Nearest\
  \ Neighbor` 是一种简单但性能较差的分类器。在本章中，我们讨论了一种修改数据挖掘函数以适应扰动数据的方法。我们的方法跳过了从扰动数据重建原始数据分布的步骤。这样，该方法在不解决困难分布问题的情况下执行隐私保护数据挖掘。值得注意的是，当数据集足够大时，直接在扰动数据集上执行数据挖掘技术可以获得良好的数据挖掘准确性。例如，将决策树分类器应用于加性扰动数据可以获得良好的数据挖掘准确性。这可以在我们的实验结果中观察到。\n\
  \n未来的一个方向是构建可用于对扰动数据集进行分类的分类器。正如我们之前提到的，利用概率作为加权，结合随机噪声数据 `R` 的更好边界，是一个需要进一步研究的方法。此外，随着新型机器学习技术的发展（如基于深度学习的方法），我们需要探索针对这些方法的隐私保护机器学习。\n\
