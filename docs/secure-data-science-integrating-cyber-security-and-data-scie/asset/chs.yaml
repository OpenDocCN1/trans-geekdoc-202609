  \n# 17 面向社交网络数据管理的访问控制\n\nDOI：[10.1201/9781003081845-28](https://doi.org/10.1201/9781003081845-28)\n\
  \n## 17.1 简介\n\n在第 IV 部分的章节中，我们展示了利用社交网络内的数据来改进局部分类和关系分类方法的途径。虽然流行病学和反恐领域普遍被认为是这些任务的重要应用领域，但一个主要的新兴领域是通过与社交网络提供商合作，将这些数据用于市场营销。这种用法引发了这些社交网络许多用户的隐私担忧。在此，我们提供了一个框架，赋予用户对其在社交网络内信息的访问拥有更大的控制权。通过利用语义\
  \ Web 技术，我们能够提出非常细粒度的控制，以管理从用户照片到谁能向未成年儿童发送消息或视频的一切内容。\n\n在线社交网络（OSN）是允许人们发布关于自己的详细信息，并通过链接连接到网络其他成员的平台。最近，OSN\
  \ 的流行度显著增加。例如，Facebook 现在声称拥有近 30 亿活跃用户（[`www.businessofapps.com/data/facebook-statistics/`](https://www.businessofapps.com)）。包含个人特定信息的\
  \ OSN 的存在既创造了有趣的机会，也带来了挑战。例如，社交网络数据可用于向合适的客户营销产品。同时，安全和隐私担忧在实践中可能会阻碍此类工作 \\[BERT2007\\\
  ]。改进 OSN 访问控制系统似乎是解决与在线社交网络相关的现有安全和隐私问题的第一步。然而，大多数当前的 OSN 实现非常基础的访问控制系统，仅仅是让用户通过将特定项目标记为公开、私有或仅直接联系人可访问，来决定哪些个人信息可被其他成员访问。为了提供更多灵活性，一些在线社交网络强制执行这些设置的变体，但原则是相同的。例如，除了基本设置外，Bebo（[`bebo.com`](http://bebo.com)）、Facebook（[`facebook.com`](http://facebook.com)）和\
  \ Multiply（[`multiply.com`](http://multiply.com)）支持“选定的朋友”选项；Last.fm（[`last.fm`](http://last.fm)）支持“邻居”选项（即具有相似音乐偏好和品味的用户集合）；Facebook、Friendster\
  \ 和 Orkut（[`www.orkut.com`](http://www.orkut.com)）支持“朋友的朋友”选项；Xing（[`xing.com`](http://xing.com)）支持“联系人的联系人”（二度联系人）、“三度”和“四度联系人”选项。重要的是要注意，所有这些方法都具有易于实现的优势，但它们缺乏灵活性。事实上，可用的保护设置不允许用户轻松指定其访问控制需求，因为它们要么过于严格，要么过于宽松。此外，现有解决方案是特定于平台的，难以针对各种不同的在线社交网络实施。\n\
  \n为了解决其中一些局限性，我们提出了一种基于语义 Web 技术的可扩展、细粒度 OSN 访问控制模型。我们的主要思想是利用本体对社交网络相关信息进行编码。具体而言，我们建议使用语义\
  \ Web 本体对 OSN 的以下五个重要方面进行建模：（1）用户档案，（2）用户之间的关系（例如，Bob 是 Alice 的密友），（3）资源（例如，在线相册），（4）用户与资源之间的关系（例如，Bob\
  \ 是相册的所有者），以及（5）动作（例如，在某人的墙上发布消息）。通过构建这样的本体，我们对社交网络知识库（`SNKB`）进行建模。使用本体对 OSN 数据建模的主要优势在于，许多不同社交网络概念之间的关系可以使用`OWL`自然地表示。此外，通过推理，可以自动完成关于此类关系的许多推断。我们的访问控制执行机制随后通过利用这些知识来实现。具体而言，思路是将安全策略定义为规则（见第\
  \ 17.4 节），其前件陈述`SNKB`上的条件，后件指定授权动作。特别是，我们建议利用本体对安全策略隐含的授权进行编码，从而获得`SAKB`。因此，安全策略必须被转换为规则，其前件和后件在本体上表达。为了实现这一目标，我们使用语义\
  \ Web 规则语言（`SWRL`）\\[HORR2004\\]。因此，访问控制策略可以通过简单地查询授权（即`SAKB`）来执行。该查询可以通过实例检查操作由本体推理器直接轻松实现，或者如果本体以`RDF`序列化，则可以通过`SPARQL`查询执行。在本章中，我们重点关注如何利用语义\
  \ Web 技术对这种细粒度社交网络访问控制系统进行建模。我们还假设由社交网络管理者托管的集中式参考监视器将执行所需的策略。由于我们提出的方法依赖于可扩展的本体，它可以通过修改我们`SNKB`中的本体轻松适应各种在线社交网络。此外，正如我们稍后在本章中详细讨论的那样，语义\
  \ Web 工具允许我们定义比当前 OSN 提供的更细粒度的访问控制策略。\n\n本章组织如下。在第 17.2 节中，我们简要讨论了与在线社交网络相关的当前安全和隐私研究。在第\
  \ 17.3 节中，我们讨论如何使用语义 Web 技术对社交网络进行建模。在第 17.4 节中，我们介绍了我们框架中支持的安全策略的高层概览。除了访问控制策略外，我们还陈述了过滤策略，允许用户（或其监护人之一）自定义其访问的内容。我们还引入了管理策略，规定谁有权指定访问控制和过滤策略。在第\
  \ 17.5 节中，我们介绍授权本体和安全策略的`SWRL`规则编码。在第 17.6 节中，我们讨论安全策略如何执行。我们设计的实现问题在第 17.7 节中讨论。在第\
  \ 17.8 节中，我们描述我们的架构，也称为我们的框架。在第 17.9 节中，我们讨论我们用语义 Web-based 访问控制进行社交网络实验的实验。大数据和云技术的可扩展性在第\
  \ 17.10 节中讨论。第 17.11 节总结本章。图 17.1 说明了本章的概念。我们的研究受\\[FINI2008\\]中报告的工作影响。\n\n![图\
  \ 17.1 社交网络的访问控制。](img/fig17_1.jpg)\n\n\n\n\n## 17.2 相关工作\n\n过去关于 OSN 安全的研究主要集中在隐私保护技术上，旨在允许在不损害\
  \ OSN 成员隐私的前提下对社交网络数据进行统计分析（关于该主题的讨论请参见 [CARM2008, CARM2009a, CARM2009b, CARM2011]）。相比之下，OSN\
  \ 的访问控制是一个相对较新的研究领域。据我们所知，针对在线社交网络的访问控制机制，仅有 [KRUK2006]、[ALI2007] 和 [CARM2009b]\
  \ 等提案。D-FOAF 系统 [KRUK2006] 主要是一种基于 Friend of a Friend (FOAF) 即“朋友的朋友”本体的社交网络分布式身份管理系统，其中访问权限和信任委托管理作为额外服务提供。在\
  \ D-FOAF 中，关系与信任级别相关联，该级别表示参与给定关系的用户之间存在的 `friendship`（友谊/好友关系）程度。尽管 [KRUK2006]\
  \ 仅讨论了对应于 FOAF 词汇表 [BRIC2007] 中 `foaf:knows` RDF 属性所建模的通用关系，但另一篇 D-FOAF 相关论文 [CHOI20I0]\
  \ 也考虑了多种关系类型的情况。就访问权限而言，它们通过连接请求者与资源所有者的路径的最小信任级别和最大长度来表示授权用户。在 [ALI2007] 中，作者采用了一种多级安全方法，其中信任是确定用户和资源安全级别的唯一参数。在\
  \ [CARM2009a] 中，提出了一种半去中心化的自主访问控制模型及相关的执行机制，用于 OSN 中的受控信息共享。该模型允许为在线资源指定访问规则，其中授权用户通过网络中节点间存在的关系类型、深度和信任级别来表示。\n\
  \n与现有方法相比，我们利用语义 Web 技术来表示用户、资源和动作之间更丰富的关系形式。例如，我们能够表示利用关系层级的访问控制规则，并通过使用 OWL 推理工具，可以推断出“密友”也是“朋友”，因此任何“朋友”可访问的内容，“密友”也可访问。此外，通过修改底层的\
  \ SNKB，我们提出的解决方案可轻松适应截然不同的在线社交网络。关于所提框架与 [CARM2009b] 中访问控制机制差异的进一步讨论，请参见 第 17.4\
  \ 节。\n\n语义 Web 技术最近已被用于为不同于 OSN 的领域开发各种策略和访问控制语言。例如，在 [TONT2003] 中，作者比较了用于分布式基于代理系统的各种策略语言，这些语言定义了授权和义务策略。在\
  \ [FINI2008] 中，OWL 被用于表达基于角色的访问控制策略。在 [YAGU2005] 中，作者提出了一种语义访问控制模型，该模型将授权和访问控制管理职责分离，为具有异构安全需求的分布式动态系统提供解决方案。这些先前的工作均未涉及与在线社交网络相关的访问控制问题。在现有工作中，[ELAH2008]\
  \ 与我们的提案最为相似。与 [ELAH2008] 相比，我们提供了一个丰富得多的 OWL 本体，用于建模在线社交网络的各个方面。此外，我们提出了依赖于各用户间信任关系的授权、管理和过滤策略。\n\
  \n## 17.3 利用语义 Web 技术建模社交网络\n\n### 17.3.1 关系类型\n\n最近，资源描述框架 (RDF) 和 Web 本体语言 (OWL)\
  \ 等语义 Web 技术已被用于建模社交网络数据 [MIKA2007]。尽管本章的目标不是提出用于建模在线社交网络数据的新语义方法，但为了完整起见，我们想简要概述当前的方法，并指出其他也可由语义技术建模的社交网络信息。在我们的讨论中，我们将以\
  \ Facebook 为贯穿示例。同时，我们要强调的是，我们的讨论可轻松扩展到其他社交网络框架。\n\n一般来说，我们确定了五类可由语义技术建模的社交网络数据。它们如下：（1）个人信息；（2）人际关系；（3）社交网络资源；（4）用户与资源之间的关系；以及（5）可在社交网络中执行的动作。在下文中，我们将讨论如何表示这些社交网络数据。在随后的小节中，我们将讨论上述四种关系中每一种的建模方面。\n\
  \n### 17.3.2 建模个人信息\n\nFacebook 等 OSN 上提供的部分个人信息可通过 Friend-of-a-Friend (FOAF) 本体\
  \ [BRIC2007] 进行建模。FOAF 是一种基于 OWL 的格式，用于表示个人信息和个人的社交网络。FOAF 提供了各种类和属性来描述社交网络数据，如基本个人信息、在线账户、项目、群组、文档和图像。然而，这些基本机制不足以捕获所有可用信息。例如，没有\
  \ FOAF 构造来捕获 `lookingFor` 的含义（例如，John Smith 正在寻找友谊）。得益于 RDF/OWL 语言的可扩展性，这很容易解决。例如，考虑以下使用以\
  \ RDF/OWL 语言编写的新 Facebook 本体来捕获 Facebook Profile Id 为 999999 的个人相关信息的案例。在该示例中，我们假设“fb”本体具有一个名为\
  \ `lookingFor` 的属性来捕获所需信息。\n\n```\n@prefix rdf: <http://www.w3.org/1599/02/22-rdf-syntax-ns>.\n\
  @prefix foaf: <http://xmlns.com/foaf/0.1/>.\n@prefix fb: <http://example.org/facebook>.\n\
  <http://www.facebook.com/profile.php?id=999999999>\nfoaf:name \"John Smith\".\n\
  <http://www.facebook.com/profile.php?id=999999999>\nfb:lookingFor \"Friendship\"\
  .\n```\n\n正如该示例所示，现有本体（如 FOAF）可轻松扩展以捕获在线社交网络上可用的个人信息。\n\n### 17.3.3 建模人际关系\n\n\n\
  \n目前，在线社交网络不支持对关系进行细粒度的定义。例如，Facebook 允许你指定是否与某位好友共同就读或共事，但无法表达这真正意味着什么，即关系的强度。正是这种细粒度结构是我们希望捕获的。Mika\
  \ \\[MIKA2007\\] 提出了一种基于再化的模型来捕获关系强度。相反，为了遵循 W3C 规范 \\[WWW1999\\]，我们采用 n 元关系模式，而非使用简单的陈述再化，后者违反了该规范\
  \ \\[WWW2006\\]。如果我们违反规范，关系将通过一系列四条 RDF 语句来建模，以创建关系的标识符。不幸的是，结果将导致 SWRL 无法理解这些关系。我们认为，使用规范推荐的模式并保留使用\
  \ SWRL 对关系进行推理的能力是最佳解决方案。\n\n基于前述原因，我们选择使用 n 元关系模式来建模人际关系。为了遵循 n 元关系规范 \\[WWW2006\\\
  ]，我们定义了一个 `FriendshipRelation` 类，该类拥有表示友谊总体强度的子类。根类 `FriendshipRelation` 暗示一种非特定的友谊，而三个子类\
  \ `Family`（家人）、`CloseFriend`（密友）和 `DistantFriend`（泛友）则给出了人与人之间亲疏程度的指示。`CloseFriend`\
  \ 子类还有一个进一步的扩展：`BestFriend`（挚友）。\n\n这种基本结构使我们能够轻松模仿 Facebook 现有的关系类型结构。然而，正如之前提到的，这些关系类型没有预定义的含义。为了开始量化关系分配的含义，每个\
  \ `FriendshipRelation` 实例都有一个数据属性 `TrustValue`。这代表发起者对好友的信任程度。\n\n举个例子，假设某个个体（如\
  \ John Smith）与一位同事（如 Jane Doe）定义了一种关系。这将创建一个 `FriendshipRelation` 类的实例，带有 `TrustValue`\
  \ 数据属性，代表发起者与其好友之间的信任程度。该实例还有一个对象属性，将其链接到好友的实例。然后，该 `FriendshipRelation` 类的实例通过\
  \ `Friendship` 对象属性关联回 John Smith。\n\n重要的是要注意，社交网络中的任何（单向）关系都是 `FriendshipRelation`\
  \ 类的单个实例。因此，为了建模社交网络关系标准的双向性质，我们需要该类的两个实例。然而，如果 B 是 A 的朋友，则 A 是 B 的朋友这一简单的逻辑推理无法由\
  \ SWRL 实现，因为这将意味着创建一个新的 Friendship 类实例。不幸的是，这超出了 SWRL 的能力范围。因此，这必须由 SWRL 框架外部的外部应用程序来处理。同样重要的是要注意，关系的\
  \ `TrustValue` 属性是一个在社交网络的 OWL/SWRL 组件外部自动计算的值。该值用于在网络中进一步执行各种推理任务。在最基本的层面上，即 `TrustValue`\
  \ 是基于友谊类型的静态数字时，这是一个微不足道的组件。我们假设计算 `TrustValue` 将会使用更复杂的公式，这可能超出了 SWRL 内置数学运算符的范围。\n\
  \n我们在间接关系方面遇到了类似的困难。要定义一个推断出的关系，我们再次需要创建一个新的 `FriendshipRelation` 实例。然而，我们可以像前面详述的维护关系对称性那样，以类似的方式创建这些间接关系。间接关系的唯一区别在于，我们不创建\
  \ `FriendshipRelation` 类的实例，而是创建一个单独的类 `InferredRelation` 的实例，该类没有详细的子类，但在其他方面与\
  \ FriendshipRelation 基类相同。\n\n### 17.3.4 资源建模\n\n典型的 OSN 提供一些资源，如“相册”或“墙”，用于在个体间共享信息。显然，RDF/OWL\
  \ 可用于捕获相册由照片组成且每张照片可能包含多人的事实。在我们的框架中，我们将资源建模为一个类，从通用的 `Resource` 类开始。作为其子类，我们可以有例如\
  \ `PhotoAlbum`、`Photo` 和 `Message`。这些类各自拥有特定的、独特的属性和关系。例如，`PhotoAlbum` 拥有名称和描述作为数据属性，并拥有一个名为\
  \ `containsPhoto` 的对象属性，将其链接到 `Photo` 的实例。这些实例拥有名称、标题以及文件存储位置的路径。Message 拥有发送者、接收者、主题、消息内容和时间戳。我们还可以创建一个\
  \ Message 的子类 `WallMessage`（留言板消息），它与 Message 类似，拥有相同的数据属性，但具有额外的限制，例如 `WallMessage`\
  \ 只能发送给单个个体。\n\n### 17.3.5 用户/资源关系建模\n\n当前的应用程序（如 Facebook）假设用户与资源之间的唯一关系是所有权。然而，从访问控制的角度来看，这是不够的。让我们考虑一个例子，一张照片同时包含\
  \ John Smith 和 Jane Doe。Jane 拍摄了照片并将其发布在社交网络上。传统上，Jane 将是该资源的唯一管理员。由于照片包含 John 的图像（我们称\
  \ John 被标记在照片中），在我们的模型中，John 可能对哪些个体可以查看该照片拥有一定的决定权。\n\n为了建模类似相册的内容，我们可以使用两个类。第一个是简单的\
  \ `Photo` 类，仅拥有可选的照片名称和标题，以及指向文件存储位置的必需路径。照片随后通过链接与每个被列为在照片中的人关联。`PhotoAlbum` 拥有名称和描述。`PhotoAlbum`\
  \ 和 `Photo` 通过 `containsPhoto` 关系链接。个人所有者——上传照片的人——由 `ownsAlbum` 关系指示。同样，我们可以表示用户与资源之间的其他关系。\n\
  \n### 17.3.6 动作建模\n\n在社交网络中，动作是用户参与的基础。根据所提出的表示方法，动作被定义为关联用户、资源和动作的对象属性。此外，我们通过子属性来建模动作的层级结构。以三个通用动作为例：`Read`、`Write`、`Delete`。我们定义了一个层级结构，其中\
  \ `Delete` 是 `Write` 的子类型，而 `Write` 本身又是 `Read` 的子类型。在非层级模型中，如果 John Smith 能够读取、写入和删除一张照片，则我们需要三个授权来表示此属性。然而，由于我们定义了层级结构，仅凭\
  \ <“John Smith,” Delete, Photo1> 这一个授权，John Smith 就拥有了所有三种权限。\n\n我们还可以扩展传统的访问限制，以利用社交网络的扩展功能。例如，动作\
  \ `Post` 可以被定义为 Write 的子类型。假设我们定义动作 `Write` 表示个体可以向另一个个体发送私信，而动作 `Post` 表示个体可以向另一个人的墙发布消息，以便其任何好友都能看到。那么，授予用户\
  \ `Post` 动作将允许他们查看好友的墙、发送私信并在其墙上书写，但无法删除任何内容。\n\n## 17.4 面向 OSN 的安全策略\n\n### 17.4.1\
  \ 运行示例\n\n\n\n在本章的其余部分，我们将使用图 17.2 所示的小型网络来说明我们的访问控制机制。我们的运行示例有四个个体：Alice、Bob、Charlie\
  \ 和 David。Alice、Bob 和 Charlie 形成一个小圈子，他们之间通过不同强度的友谊连接。David 仅通过默认的 `Friendship`\
  \ 类型与 Bob 是朋友。还有一个由 Alice 上传的 `PhotoAlbum`，其中包含一张 Charlie 的照片。\n\n![图 17.2 OSN 的一部分。](img/fig17_2.jpg)\n\
  \n图 17.2 OSN 的一部分。\n\n正如近期关于社交网络安全的研究所示，保护社交网络中的资源要求我们修订传统的访问控制模型和机制。然而，目前提出的方法仅关注访问控制策略，即调节对\
  \ OSN 资源访问的问题。我们认为这还不够，因为社交网络场景的复杂性要求定义除标准访问控制策略之外的进一步安全策略。在本节中，我们概述了我们框架支持的安全策略。\n\
  \n### 17.4.2 访问控制策略\n\n该框架支持访问控制策略，以调节 OSN 参与者如何访问资源。特别地，支持的访问控制策略是基于我们之前的工作 [CARM2009b]\
  \ 定义的。在这里，授权用户是根据网络中节点间现有关系的类型、深度和信任级别来表示的。例如，访问控制策略可以规定：被授权访问给定资源的 OSN 参与者仅限于那些与资源所有者具有直接或间接友谊关系的人，前提是该关系具有给定的信任值。然而，所提框架支持的访问控制策略相较于\
  \ [CARM2009b] 中提出的策略有一些显著改进。这些改进主要归因于我们的访问控制策略是根据 17.3 节 中描述的 SNKB 定义的。这意味着访问控制策略的对象、主体和权限是通过利用资源、用户和动作的语义建模来定义的。特别地，正如将在\
  \ 17.5 节 中解释的那样，访问控制策略被定义为基于表示 17.3 节 中引入概念的本体的规则。因此，我们不再是针对 OSN 的每个单个参与者和资源指定访问控制策略，而是能够直接在\
  \ OSN 语义概念上指定访问控制策略。确实，可以通过简单地将 `Photo` 类指定为受保护对象，来规定一个通用的访问控制策略，即照片只能由朋友访问。因此，该访问控制策略将应用于\
  \ `Photo` 类的所有实例，即所有照片，从而极大地简化了策略管理。在语义概念上指定访问控制策略的另一个好处是，可以利用概念上定义的层次结构自动传播访问控制策略。例如，就资源而言，如果\
  \ `Photo` 已被定义为具有一些子类，比如 `PrivatePhoto` 和 `HolidaysPhoto`，则前述访问控制策略可以自动应用于属于 `Photo`\
  \ 任何子类的所有实例。访问控制策略也可以沿其他维度传播，即根据其他 OSN 概念本体中指定的层次结构（例如，关系类型和动作的本体）。例如，如果支持的关系本体为友谊关系定义了一个层次结构，则前述访问控制策略将传播到资源所有者拥有任何类型友谊关系的所有\
  \ OSN 参与者。如果动作本体定义了动作的层次结构，也会出现类似的传播。注意，在 [CARM2009b] 中，授权主体也是基于用户关系而非列出特定实例（即人员\
  \ ID）来定义的。然而，在那项工作中策略传播是不可能的，因为没有在资源、关系和动作上定义层次结构。此外，本章提出的语义建模使我们能够不仅根据用户应与资源所有者具有的关系（如\
  \ [CARM2009b] 中那样），还根据他们应与资源具有的关系来指定授权用户。因此，例如，可以指定一个访问控制策略，声明所有被标记在某张照片上的 OSN 参与者都被授权访问该照片。在\
  \ [CARM2009b] 以及所有其他现有的 OSN 模型中，指定这种访问控制策略的唯一方法是为每个被标记在照片上的 OSN 参与者显式指定一个不同的访问控制策略。\n\
  \n### 17.4.3 过滤策略\n\n在 OSN 中，用户可以发布内容非常异构的信息，范围从家庭照片到成人导向内容。从这个意义上说，OSN 中出现的访问控制问题类似于我们在\
  \ Web 中遇到的问题，即不适当信息的可用性可能对某些用户（例如年轻人）有害。为了保护用户免受不适当或不想要的内容侵害，我们引入了*过滤策略*，通过它可以指定当给定用户浏览社交网络页面时，哪些数据必须被过滤掉。通过过滤策略，例如可以规定：从用户\
  \ Alice 获取的 OSN 页面中，必须移除所有非由 Alice 的直接朋友发布的视频。与访问控制策略类似，过滤策略被定义为基于表示 17.3 节 中引入概念的本体的规则（参见\
  \ 17.5 节）。这意味着在过滤策略的情况下也可以进行策略传播。过滤策略的另一个相关方面与指定策略的用户（即授予者）有关。确实，在我们的框架中，过滤策略可以通过两种不同的方式指定。根据第一种方式，过滤策略由用户指定，以声明她不想访问哪些信息，即从她获取的\
  \ OSN 页面中必须过滤掉哪些数据。因此，在这种情况下，授予者和策略适用的用户（即目标用户）是同一个。这些策略陈述了用户关于想要访问的内容的偏好，因此被称为*过滤偏好*。然而，我们也支持目标用户和授予者不同的过滤策略的指定。这种过滤策略使授予者能够指定目标用户获取的\
  \ SN 页面必须如何被过滤。通过这些过滤策略，授予者可以*监督*目标用户可以访问的内容。在这种情况下，我们将过滤策略称为*受监督过滤策略*。这在像 OSN 这样的开放环境中代表了一个极其有用的功能。例如，父母可以指定一个受监督过滤策略，声明她的孩子不得访问那些未被父母自己信任的用户发布的视频。稍后将更清楚地看到，语义技术极大地促进了此类策略的指定。\n\
  \n\n\n值得注意的是，过滤偏好和监管过滤策略都无法仅通过支持否定访问控制策略（即避免访问资源的策略）来强制执行。这是因为访问控制策略和过滤策略具有完全不同的语义。实际上，访问控制策略由资源所有者指定，用于声明谁被授权或拒绝访问其资源。而过滤策略由监管者为目标用户指定，或由目标用户自己指定，用于规定当她获取\
  \ OSN 页面时资源应如何被过滤掉。请注意，根据所提议的语义，即使目标用户被授权访问该资源（即满足资源所有者指定的访问控制策略），这种过滤也会发生。\n\n\
  ### 17.4.4 管理员策略\n\n在 OSN 这种多用户环境中引入访问控制和过滤策略，需要确定谁有权为哪些目标用户和对象指定策略。为解决此问题，我们引入了*管理员策略*，使社交网络的安全管理员（SA）能够声明谁有权指定访问控制和过滤策略。管理员策略必须足够灵活，既能建模传统场景中常见的明显管理策略（例如，资源所有者有权为其资源指定访问控制策略），也能根据\
  \ OSN 采用的安全和隐私指南建模更复杂的策略。例如，SA 可以指定一条管理员策略，声明被标记在特定资源上的用户有权为该资源指定访问控制策略。请注意，如前所述，17.3\
  \ 节 中描述的、对用户和资源间关系建模的本体，对于此类管理员策略的指定极为有用。其他类型的管理员策略涉及过滤策略。例如，通过一条管理员策略，SA 可以授权父母为其年幼的子女定义监管过滤策略。该管理员策略可通过声明来定义：如果用户\
  \ U1 与用户 U2 存在 `ParentOf` 类型的关系，且 U2 的年龄小于 17 岁（即 `age` 属性小于 17），则 U1 可以声明目标用户为\
  \ U1 的监管过滤策略。SA 可进一步细化此管理员策略，指定父母只能为其年幼子女的视频资源声明监管过滤策略。这将通过限制父母被授权指定的监管过滤策略的范围来修改前述管理员策略。\n\
  \n## 17.5 安全策略规范\n\n### 17.5.1 策略语言\n\n策略语言根据三个主要组件定义安全策略：*主体规范*，旨在指定安全策略适用的实体（如用户、进程）；*客体规范*，用于标识策略所涉及的资源（如文件、硬件资源、关系表）；以及*动作规范*，指定主体可在客体上行使的动作（如读、写、执行、管理）。此外，为便于策略评估任务，策略通过一组*授权*来强制执行，声明每个主体在受保护资源上拥有的权利。我们通过规则对安全策略进行编码。一般来说，一个规则由两个公式和一个蕴含算子组成，其显而易见的含义是：如果第一个公式（称为前件）成立，则第二个公式（称为后件）也必须成立。因此，我们将每个安全策略编码为一条*安全规则*，即其前件代表策略主体和客体规范中陈述的条件，后件代表蕴含的授权。请注意，由于框架支持不同类型的安全策略，安全规则可能蕴含不同类型的授权。特别是，如果安全规则的前件编码了访问控制或管理员策略，则后件表示蕴含的访问控制或管理员授权。相反，如果规则的前件编码了过滤策略（无论是过滤偏好还是监管过滤策略），则后件蕴含的是*禁止*而非授权，因为此策略限制对资源的访问。\n\
  \n我们采用 `SWRL` 来编码安全规则。`SWRL` 的引入是为了扩展 `OWL` 提供的公理，以支持规则。在 `SWRL` 中，前件（称为主体）和后件（称为头部）均通过\
  \ `OWL` 类、属性和个体来定义。更准确地说，它们被建模为*原子*的正合取。原子可以采用以下形式：(1) `C(x)`，其中 `C` 是 `OWL` 描述或数据范围；(2)\
  \ `P(x, y)`，其中 `P` 是 `OWL` 属性，`x` 和 `y` 可以是变量、`OWL` 个体或 `OWL` 数据值；(3) `sameAs(x,\
  \ y)`；(4) `differentFrom(x, y)`；(5) `builtIn(r, x, …)`，其中 `r` 是一个内置谓词，接受一个或多个参数，若参数满足该谓词则评估为真。更准确地说，若\
  \ `x` 是类描述或数据范围 `C` 的实例，则原子 `C(x)` 成立；若 `x` 通过属性 `P` 与 `y` 相关，则原子 `P(x, y)` 成立；若\
  \ `x` 被解释为与 `y` 相同的对象，则原子 `sameAs(x, y)` 成立；若 `x` 和 `y` 被解释为不同的对象，则原子 `differentFrom(x,\
  \ y)` 成立；若内置关系 `r` 在参数的解释上成立，则 `builtIn(r, x,…)` 成立。\n\n利用 `SWRL` 指定安全规则意味着授权和禁止必须在某个本体中表示，从而能被编码为\
  \ `SWRL` 头部。因此，在展示安全策略的编码之前，我们首先引入一个用于建模授权和禁止的本体。我们将由此本体衍生出的知识库称为安全授权知识库（`SAKB`）。\n\
  \n### 17.5.2 授权与禁止\n\n由于框架支持三种不同类型的安全策略，它必须管理三种不同类型的授权，即访问控制授权、管理员授权和禁止。下面我们介绍用于表示它们的本体。然而，值得注意的是，该本体与\
  \ OSN 支持的本体（见 17.3 节）密切相关，因为它基于所支持的动作和资源来定义授权/禁止。因此，以下内容并非旨在成为 `SAKB` 的标准本体，而是我们基于\
  \ 17.3 节 中呈现的语义建模，在框架中采用的本体。因此，此处的讨论应被视为 `SAKB` 本体定义的指南。\n\n#### 17.5.2.1 访问控制授权\n\
  \n\n\n\n第一种授权是由访问控制策略蕴含的。一般来说，访问控制授权可以建模为一个三元组（`u`，`p`，`o`），表明主体 `u` 拥有在对象 `o` 上执行权限\
  \ `p` 的权利。因此，在某种程度上，访问控制授权表示 `u` 和 `o` 之间的一种关系 `p`，意味着 `u` 可以在 `o` 上行使 `p`。因此，我们决定将权限\
  \ `p` 的访问控制授权编码为一个 OWL 对象属性的实例，该属性命名为 `p`，定义在被授权人和被授权资源之间。为了对所有可能的访问控制授权建模，我们必须为\
  \ OSN 中支持的每个动作引入一个不同的对象属性（参见第 17.3 节）。值得注意的是，通过妥善定义编码访问控制授权的对象属性，我们可以根据动作间定义的分类自动传播授权。\n\
  \n让我们以动作 `Post` 为例，假设它已被定义为动作 `Write` 的子类。在访问控制方面，如果向用户授权了发帖权限，则也授权了写入权限。在所提框架中，只要对象属性\
  \ `Post` 被定义为对象属性 `Write` 的子属性，访问控制授权就可以自动推断出来。我们要注意，这种层级可能不同于传统的访问控制系统。当我们使用 SWRL\
  \ 时，为超类定义的任何内容也将为其子类定义。然而，反之则不然。因此，当我们允许某个体 `Write` 时，并不会自动赋予其 `Post` 权限。\n\n####\
  \ 17.5.2.2 禁止策略\n\n过滤策略规定目标用户无权访问某个对象（在受监管过滤策略的情况下），或者目标用户倾向于不访问（在过滤偏好的情况下）。与访问控制授权类似，禁止指定了用户与其无权访问或倾向于不访问的资源之间的关系。因此，禁止也可以表示为\
  \ `Person` 和 `Resource` 类之间的一个对象属性。更确切地说，针对 Read 权限的禁止被定义为 OWL 对象属性 `PRead`。该对象属性的一个实例\
  \ `<John, URI1>:`PRead` 表明 Bob 不得读取资源 URI1。与访问控制授权类似，只需定义子属性，即可指定禁止如何传播。\n\n让我们再次考虑三个基本动作：`Read`、`Write`、`Delete`，以及它们被禁止的版本：`PRead`、`PWrite`、`PDelete`。我们再次希望按逻辑顺序形成一个动作层级。也就是说，如果某个体被禁止\
  \ `读取` 资源，则她也应被禁止 `写入` 和 `删除` 该资源。为此，我们只需定义 `PRead` 为 `PWrite` 的子类型，而 `PWrite` 又是\
  \ `PDelete` 的子类型。\n\n#### 17.5.2.3 管理员授权\n\n管理员授权是由管理员策略蕴含的授权，回顾一下，其目的是授权用户指定访问控制或过滤策略。因此，管理员策略蕴含两类授权：指定访问控制策略的授权，我们简称为\
  \ `管理员授权`；以及指定过滤策略的授权，即 `管理员禁止`。一般来说，管理员授权可以表示为一个三元组（`u`，`p`，`o`），表明用户 `u` 被授权为对象\
  \ `o` 上的权限 `p` 指定访问控制策略。因此，与授权和禁止类似，管理员授权也可以表示为 `Person` 和 `Resource` 类之间的一个对象属性。根据这种建模，我们可以定义对象属性\
  \ `AdminRead`，其实例表明给定用户被授权表达授予特定对象读取权限的访问控制策略。考虑实例 `<Bob,URI1>:`AdminRead`，它表明 Bob\
  \ 被授权指定授予 URI1 对象读取权限的访问控制策略。\n\n与访问控制授权类似，只需定义子属性，即可指定管理员授权如何传播。让我们声明前面提到的属性 `AdminRead`，并进一步创建属性\
  \ `AdminWrite` 和 `AdminAll`。我们声明 `AdminAll` 为 `AdminWrite` 和 `AdminRead` 两者的子属性。考虑我们的运行示例，Alice\
  \ 拥有一张照片。假设这授予了她该照片的 `AdminAll` 授权。如果 Alice 试图允许 Bob 读取该照片，而该动作仅限拥有 `AdminRead`\
  \ 属性的个体执行，则通过 `AdminAll` 属性即可允许此操作。\n\n相反，管理员禁止可以表示为一个元组（`s`，`t`，`o`，`p`），这意味着用户\
  \ `s`（监管者）被授权为目标用户 `t` 和对象 `o` 上的权限 `p` 指定过滤策略。与之前的授权不同，管理员禁止不能表示为属性，因为它们不表示二元关系。因此，我们决定将管理员禁止建模为一个\
  \ OWL 类 `Prohibition`。这使我们能够将禁止的所有组成部分指定为类属性。更确切地说，给定一个管理员禁止（`s`，`t`，`o`，`p`），我们可以将授权监管者建模为\
  \ `Prohibition` 和 `Person` 类之间的一个对象属性 `Supervisor`。类似地，目标用户可以表示为 `Prohibition` 和\
  \ `Person` 类之间的一个对象属性 `TargetUser`，目标对象表示为 `Prohibition` 和 `Resource` 类之间的一个对象属性\
  \ `TargetObject`。相反，监管者被授权声明过滤策略的权限不表示为对象属性。确实，为了自动传播管理员禁止，我们倾向于直接将权限指定为类名。因此，作为示例，`ProhibitionRead`\
  \ 类的实例表示授权为读取权限指定过滤策略的管理员禁止。通过妥善定义子类，可以自动推断新的管理员禁止。\n\n假设，我们有一个通用的 `Prohibition`\
  \ 类，带有子类 `PRead` 和 `PView`。然后我们为它们各自创建另一个子类 `PAll`。假设我们有两个个体，John 和 Jane，John 是\
  \ Jane 的父亲。在这种情况下，John 应被允许过滤其女儿能观看的视频。即，我们有一个禁止（“John”，“Jane”，Video，`PAll`）。现在，对于任何视频和任何权限，John\
  \ 都可以禁止他希望禁止的内容。\n\n### 17.5.3 安全规则\n\n所提框架将每个安全策略转换为一条 SWRL 安全规则，其中前件编码策略中指定的条件（例如，表示主体和对象规范的条件），而后件编码蕴含的授权或禁止。特别地，由于我们将安全规则建模为\
  \ SWRL 规则，SWRL 规则体陈述了针对 SNKB 的策略条件，即第 17.3 节中引入的本体上的条件，而 SWRL 规则头蕴含 SAKB 的新实例，即第\
  \ 17.3 节中引入的本体的实例。因此，SWRL 安全规范的制定严格受限于 OSN 为建模 SN 和 SA 知识库所支持的本体。这意味着无法提供通用 SWRL\
  \ 规则的形式化，因为这些规则会因所考虑的本体而异。相反，在本节中，我们旨在展示一些基于我们框架中采用的本体定义的有意义的 SWRL 安全规则示例。\n\n\n\
  \n\n我们首先考虑管理员策略，该策略规定对象的所有者有权为该对象指定访问控制策略。根据前几节介绍的本体定义的相应 SWRL 规则如下：\n\n```\nOwns(?grantor,\
  \ ?targetObject) ⇒ AdminAll(?grantor, ?targetObject)\n```\n\n对上述规则的求值结果是为每一对用户及其拥有的相应资源生成一个不同的对象属性\
  \ `AdminAll` 实例。值得注意的是，这种授权是根据对 SAKB 进行建模的本体进行传播的。因此，由于框架利用了第 17.5.1 节介绍的本体，上述授权也会传播到\
  \ `AdminRead` 和 `AdminWrite`。\n\n社交网络中另一个有意义的管理员策略是：如果用户在照片中被标记，则她有权为该照片的读取权限指定访问控制策略。这可以通过以下\
  \ SWRL 安全规则进行编码：\n\n```\nPhoto(?targetObject) ∧ photoOf(?grantor, ?targetObject)\
  \ ⇒ AdminRead(?grantor, ?targetObject)\n```\n\n上述规则是有趣的例子，强调了在所提出的框架中，可以轻松指定管理员策略，而在非基于语义的访问控制机制中实现这些策略将需要复杂的策略管理。确实，为\
  \ OSN 提供对用户和资源之间关系（例如建模所有权或标记关系）进行建模的本体，使得 SA 能够通过简单地对所需关系类型提出条件来指定管理员策略。相反，在传统访问控制机制中强制执行这些管理员策略将需要实现复杂的策略管理功能，因为这将要求首先确定用户和资源之间所有可能的关系，然后为所有这些关系指定管理员授权。而在所提出的框架中，这项任务由推理器执行。\n\
  \n表 17.1 展示了一些 SWRL 安全规则的示例。第一条安全规则编码了一条过滤策略，规定 Bob 的孩子不能访问视频。一旦对该规则进行求值，就会为 Bob\
  \ 的每个孩子和视频资源创建一个禁止实例。相反，第二条安全规则对应 Bob 陈述的一条访问控制策略，将对其照片的读取访问限制为仅限其直接朋友，而第三条规则编码了一条访问控制策略，规定\
  \ Alice 被标记的照片可以被她的直接朋友访问。最后，第四条规则规定如果一个人拥有一张照片，那么他们朋友的朋友（一种间接关系）可以查看该照片。\n\n####\
  \ 表 17.1 SWRL 安全规则示例\n\n| # | SWRL 规则 |\n|---|---|\n| (1) | `Video(?targetObject)\
  \ ∧ ParentOf(Bob, ?controlled) ⇒ PRead(?controlled, ?targetObject)` |\n| (2) | `Owner(Bob,\
  \ ?targetObject) ∧ Photo(?targetObject) ∧ Friend(Bob, ?targetSubject) ⇒ Read(?targetSubject,\
  \ ?targetObject)` |\n| (3) | `Photo(?targetObject) ∧ photoOf(Alice, ?targetObject)\
  \ ∧ Friend(Alice, ?targetSubject) ⇒ Read(?targetSubject, ?targetObject)` |\n| (4)\
  \ | `Photo(?targetObject) ∧ Owns(?owner, ?targetObject) ∧ Friend(?owner, ?targetSubject1)\
  \ ∧ Friend(?targetSubject1, ?targetSubject2) ⇒ Read(?targetSubject2, ?targetObject)`\
  \ |\n\n## 17.6 安全规则执行\n\n### 17.6.1 我们的方法\n\n我们的框架的作用类似于传统的访问控制机制，其中 `reference\
  \ monitor`（参考监视器）通过查找授予或拒绝请求的授权来评估请求。在所提出的框架中利用这一原则意味着通过查询 SAKB 本体来检索授权/禁止。因此，例如，要验证用户\
  \ `u` 是否有权为对象 `o` 的读取权限指定访问控制策略，有必要验证实例 `AdminRead(u, o)` 是否在本体中，即执行实例检查。这意味着在评估任何可能的请求之前，必须先评估所有编码安全策略的\
  \ SWRL 规则，从而推断出所有访问控制/管理员授权以及所有禁止。因此，在策略执行之前，需要执行一个称为 `policy refinement`（策略细化）的初步阶段。该阶段旨在通过执行所有编码安全策略的\
  \ SWRL 规则，用推断出的授权/禁止来填充 SAKB。\n\n一旦推断出授权/禁止，就可以进行安全策略执行。特别是，访问控制和过滤策略在提交 `access\
  \ request`（访问请求）时进行评估，而管理员策略在提交 `admin request`（管理员请求）时进行评估。在下文中，我们将展示这两种请求评估，说明相应策略是如何执行的。\n\
  \n### 17.6.2 管理员请求评估\n\n管理员请求包含两部分信息：`grantor`（授予者）的名称，即提交管理员请求的用户；以及授予者想要指定的访问控制或过滤策略，编码为\
  \ SWRL 规则，即 `submitted SWRL`（提交的 SWRL）。仅当 SAKB 中存在针对授予者的管理员授权时，提交的 SWRL 才能被插入系统。例如，如果提交的规则要求为\
  \ `targetObject` 的读取权限指定访问控制策略，则必须存在 `<grantor, targetObject>: Read` 的实例。请注意，关于权限和\
  \ `targetObject` 的信息可以直接从提交的 SWRL 中检索。因此，要决定上述请求是否可以被授权，一种可能的方法是查询 SAKB 以检索相应的管理员授权（如果有）。如果存在实例，则可以评估提交的\
  \ SWRL，否则框架将拒绝授予者的管理员请求。另一种方法是通过在其主体中添加条件来重写提交的 SWRL，以验证 SAKB 中是否存在授权指定该规则的管理员授权。以下示例将阐明这一基本思想。\n\
  \n假设系统收到以下管理员请求：`{Bob, SWRL[1]}`，其中 `SWRL[1]` 如下：\n\n```\nSWRL[1]: Owns(Bob, ?targetObject)\
  \ ^ Photo(?targetObject) ^ Friend(Bob, ?targetSubject) ⇒ Read(?targetSubject, ?targetObject)\n\
  ```\n\n为了确定管理员请求的结果，框架必须验证 SAKB 中 `<Bob, targetObject>: AdminRead` 实例的存在性。可以通过简单地修改\
  \ `SWRL[1]` 将此检查合并到其主体中，如下所示：\n\n```\nNew_SWRL[1]: AdminRead(Bob, ?targetObject)\
  \ ^ Owns(Bob, ?targetObject) ^ Photo(?targetObject) ^ Friend(Bob, ?targetSubject)\
  \ ⇒ Read(?targetSubject, ?targetObject)\n```\n\n然后对 `New_SWRL[1]` 进行求值，其结果是只有当 Bob\
  \ 根据管理员策略被授权指定这些授权时，读取访问控制授权才会被插入 SAKB。\n\n如果管理员请求提交的是过滤策略，为了决定授予者是否有权指定该策略，需要在\
  \ `Prohibitions` 类（即过滤策略要求禁止的动作对应的子类）中进行搜索，寻找一个实例，其 `Grantor` 属性等于授予者，`Controlled`\
  \ 和 `TargetObject` 属性分别等于提交的 SWRL 规则头部指定的受控者和 `TargetObject`。在这种情况下，我们也可以采用基于 SWRL\
  \ 重写的方法。\n\n\n\n假设框架接收到以下管理员请求：`{Bob, SWRL[2]}`，其中 `SWRL[2]` 如下：\n\n`SWRL[2] : Video(?targetObject)\
  \ ^ ParentOf(Bob,?controlled) ⇒ PRead(?controlled,?targetObject)`\n\n然后，系统可以修改提交的\
  \ SWRL 为：\n\n`New_SWRL[2]: PRead(?p) ^ Grantor(?p,Bob) ^ Controlled(?p,?controlled)\
  \ ^ TargetObject(?p,?targetObject) ^ Video(?targetObject) ^ ParentOf(Bob,?controlled)\
  \ ⇒ PRead(?controlled,?targetObject)`\n\n其求值效果是仅当存在管理员禁止策略（`Bob, *c, o*, Read`）时，才插入\
  \ `PRead` 属性实例（即读取禁止），其中 `c` 是 Bob 的子女，`o` 是视频资源。注意，即使提交的 SWRL 显式指定了受控用户的名称（例如 `….\
  \ ⇒ PRead(Alice,?targetObject)`），这也是有效的。\n\n### 17.6.3 访问请求求值\n\n一般来说，访问请求可以建模为一个三元组（`u`,\
  \ `p`, `URI`），表示用户 `u` 请求在位于 `URI` 的资源上执行权限 `p`。为了评估该请求，框架必须验证是否存在访问控制授权，将 `URI`\
  \ 上的权限 `p` 授予请求者 `r`。然而，由于所提系统也支持过滤策略，此类授权的存在并不一定意味着 `r` 被授权访问 `URI`，因为可能存在一条禁止策略拒绝该用户访问该资源。因此，要评估是应授予还是拒绝访问请求，有必要对\
  \ SAKB 执行两个查询。第一个用于检索授权，第二个用于检索禁止。更确切地说，如果 `u` 需要读取权限 `Read`，系统必须查询对象属性 `Read` 和\
  \ `PRead` 的实例。特别是，这两个查询都寻找实例 `<u, URI>`（即 `<u, URI> : Read` 和 `<u, URI> : PRead`）。如果第一个查询返回实例且第二个查询返回空集，则授予访问；否则拒绝。\n\
  \n再次考虑 17.3 节 和 17.4 节 中的示例，并增加一个名为“Susan”的人。Susan 是 Jane 的朋友，并发布了一个她允许所有朋友查看的视频。然而，Jane\
  \ 的父亲禁止她观看视频。当 Jane 请求查看 Susan 的视频时，将执行授权和禁止查询。授权查询返回 `Read` 权限，但禁止查询返回 `PRead`。这意味着\
  \ Jane 将无法观看该视频。\n\n## 17.7 访问控制框架的实现\n\n在前几节中，我们提供了一个使用语义 Web 技术的社交网络访问控制框架。在这里，我们展示了在合成数据上对该框架的初步实现结果。如前所述，我们设计了一个基于语义\
  \ Web 技术的可扩展、细粒度的 OSN 访问控制模型。我们的主要思想是通过本体编码社交网络相关信息。具体而言，我们建议使用语义 Web 本体对 OSN 的以下五个重要方面进行建模：（1）用户配置文件，（2）用户间关系（例如，Bob\
  \ 是 Alice 的密友），（3）资源（例如，在线相册），（4）用户与资源间的关系（例如，Bob 是相册的所有者），（5）动作（例如，在某人的墙上发布消息）。通过构建此类本体，我们对社交网络知识库（SNKB）进行建模。然后，我们的访问控制执行机制通过利用这些知识来实现。具体而言，思路是将安全策略定义为规则，其前件陈述\
  \ SNKB 上的条件，后件指定授权动作。我们假设由社交网络管理器托管的集中式参考监视器将强制执行所需策略。我们的架构具有可扩展性，因为我们可以添加模块来执行诸如推理控制之类的功能。此外，我们还可以扩展策略以包含信息共享策略，而不仅仅是访问控制策略。有关语义技术在在线社交网络中应用的详细讨论，请参阅我们的工作文献\
  \ [CARM2009a]。在这里，我们将讨论局限于那些影响我们在在线社交网络中实现资源访问控制机制的特定主题。\n\n在最近的过去，Facebook 对其定义网络上朋友关系的方法进行了重大更改。以前，如果我们有两个是朋友的\
  \ Facebook 用户，例如 John 和 Jane，他们中的任何一方都可以选择 Facebook 允许的预选友谊类型之一，另一方则需要确认或拒绝这一友谊标签。随后，John\
  \ 或 Jane 的任何朋友都能看到应用于这段友谊的定义。然而现在，每个人都有能力创建有意义的列表，而不是定义对他人可见的链接类型。然后，朋友可以被添加到用户选择的任意数量的列表中。这些列表随后可用于控制状态更新、墙贴等的可见性。但是，无法定义这些列表的层次结构。例如，如果创建了“高中同学”列表和“大学同学”列表，则无法创建“同学”列表，除非将每个人单独添加到该第三个列表中。\n\
  \n我们使用 W3C [WWW1999] 指定的 n 元关系模式来表示友谊。这意味着每个友谊都是一个类的实例，我们称之为 `FriendshipRelation`。这使我们能够维护关于每个友谊的独立信息。具体而言，我们为每个友谊维护一个\
  \ `TrustValue`。这使我们能够确定友谊的特定强度，即使与同一类中的友谊相比也是如此。我们的实现支持访问控制策略，以调节在线社交网络成员如何访问资源。特别是，支持的访问控制策略是基于我们之前的工作\
  \ [CARM2009b] 定义的。在这里，授权用户是根据网络中节点间关系的类型和/或信任级别来表示的。例如，访问控制策略可以规定，唯一被授权访问给定资源的 OSN\
  \ 参与者是那些与资源所有者具有直接友谊关系的人，前提是该关系也具有特定的信任级别。\n\n然而请注意，使用语义推理可以带来一些超出 [CARM2009b] 中讨论能力的改进。这一优势源于我们能够针对\
  \ OSN 中的语义概念指定访问控制策略。例如，作为默认设置，Facebook 可能规定照片只能由直接朋友查看。在个别用户未定义策略的情况下，推理将默认采用这一通用策略。我们为\
  \ OSN 提供安全性的方法设计在 第 19 章 中讨论。主要方面包括过滤策略、安全规则执行、管理策略评估和访问请求评估。在下一节中，我们将描述我们的实现框架。\n\
  \n## 17.8 框架架构\n\n\n\n\n### 社交网络访问控制框架\n\n在我们提出的框架中，我们计划在现有的在线社交网络应用之上构建多个层。我们计划使用基于\
  \ Java 的开源语义 Web 应用开发框架 `JENA` ([`jena.sourceforge.net/`](http://jena.sourceforge.net))\
  \ 来实现我们的原型，因为它为实现本章讨论的思想提供了一个易于使用的编程环境。在这里，我们将独立描述这些层中的每一个，以及在我们框架中选择特定技术背后的动机。虽然我们使用\
  \ Facebook 的具体实例作为利用底层语义层的总体应用，但任何社交网络应用都可以修改为使用我们在此描述的设计。图 17.3 描述了我们的框架。策略和数据以\
  \ RDF 三元组的形式存储。参考监视器控制对数据的访问。它将执行诸如查询重写之类的功能。框架中的一些关键点将在随后的段落中讨论。接下来，我们将讨论框架的组件。\n\
  \n![图 17.3 社交网络访问控制框架。](img/fig17_3.jpg)\n\n图 17.3 社交网络访问控制框架。\n\n### RDF 数据存储\n\
  \n我们假设使用通用的 RDF 三元组存储来保存底层数据。在这种表示中，关于实体的所有事实都被记录为 `<主语, 谓语, 宾语>` 形式的三元组。因此，假设我们有一个名为\
  \ John Smith 的个体，被分配了唯一标识符 999999，这将给我们一个元组 `<999999, foaf:Name, \"John Smith\"\
  >`。\n\n我们计划在一个单独的表中使用类似的格式来存储授权列表，这样我们就不必在每次请求授权时重新推断它们。对于数据存储系统，我们计划使用 `MySQL`，因为它易于获取，且易于与\
  \ `JENA` 进行接口对接。\n\n我们在此指出，RDF 数据存储与关系数据库的不同之处在于，没有数据库方法来确保整个本体上的约束得到维护，例如确保定义的\
  \ `Person` 有一个名称。该事实的数据库表示与“该人住在阿尔伯克基”这一非必要陈述没有区别。然而，我们计划使用 `OWL-DL` 语句来定义这些约束，然后允许\
  \ RDF/OWL 引擎强制执行这些约束，稍后将对此进行描述。\n\n### 推理器\n\n任何支持 `SWRL` 规则的推理器都可以用来执行本章中描述的推理。然而，我们选择了\
  \ `SweetRules` ([`ebiquity.umbc.edu/project/html/id/60/SweetRules`](https://ebiquity.umbc.edu))，因为它能与\
  \ `JENA` 接口对接，并拥有基于规则的推理引擎。这意味着我们可以同时使用前向链接和后向链接来提高推理效率，以强制执行我们的访问控制策略。前向链接是一种推理方法，引擎从提供的数据开始，查看已建立的推理规则，试图推导出更多信息。这可以在系统需要大规模推断权限时使用，例如当资源首次添加时。\n\
  \n此时，将会有一次性大量地将授权添加到允许的用户列表中。然而，稍后，在添加其他朋友后，检查用户是否有权访问有限数量的资源可以通过后向链接完成。基本上，在后向链接中，我们从期望的目标开始（例如，目标是推断“John\
  \ 是否有权查看相册 A”），并检查它是否被显式陈述，或者是否可以通过其他规则以递归方式推断出来。显然，这将允许在不重新检查所有其他个体的情况下，推断出关于某个个体（例如\
  \ John）的结果。在 [MIKA2007] 中，Mika 提出了一个名为 `Flink` 的基本通用社交网络，基于使用类似于我们提出的框架的语义数据存储，但使用了几种不同的具体语义技术。然而，他确实指出，他们的实现使用后向和前向链接，可以高效地扩展到数百万个元组，这为我们提出的方案的可行性提供了证据。\n\
  \n### RDF/OWL 引擎\n\n对于 RDF/OWL 接口，我们选择使用 `JENA API`。我们用它来在应用程序和底层数据存储之间转换数据。`JENA`\
  \ 有几个重要特性被考虑用于其使用。首先，它与 `SweetRules` 兼容。其次，它支持 `OWL-DL` 推理，我们可以用它来验证数据是否与本体上的 `OWL`\
  \ 限制一致。`OWL` 限制是简单的基数和域/范围约束，例如每个人必须有一个名称，并且必须至少属于一个网络。为了强制执行这些约束，我们计划让应用层传递关于个体的待输入语句，直到收集完所有语句。然后我们让\
  \ `JENA` 将这些语句插入数据库，并检查新模型的一致性。如果有任何约束被违反，则将此信息传回社交网络应用，并让它从用户那里收集所需信息。\n\n在我们的系统中，我们在一个简化的在线社交网络应用之上构建了多个层。我们考虑了社交网络的动作（消息、墙贴、查看个人资料、查看图片等），并检查了那些涉及最多访问请求的动作。例如，如果用户\
  \ John 要访问 Jane 的个人资料，那么在最好的情况下，只需进行一次检查（John 和 Jane 是否是适当级别的朋友）来确定权限。然而，当你考虑一张图片时，它很容易标记十几个人，而每个个体可能会指定他们自己额外的查看约束，那么很容易看出这将是系统中权限推断更复杂的例子。实际上，我们构建系统是为了测试一系列一致的最坏情况场景，以测试其处理测试负载的能力。\n\
  \n我们使用基于 Java 的开源语义 Web 应用开发框架 `JENA` ([`jena.sourceforge.net/`](http://jena.sourceforge.net))\
  \ 实现我们的原型，因为它为实现本章讨论的思想提供了一个易于使用的编程环境，并且通常是一个被当前大多数语义产品支持的框架。虽然我们使用 Facebook 的具体实例作为利用底层语义层的总体应用，但任何社交网络应用都有可能被修改为使用我们在此描述的设计。如前所述，我们系统的主要组件是\
  \ RDF 数据存储、推理器和 RDF/OWL 引擎。\n\n## 17.9 实验\n\n### 17.9.1 数据生成\n\n当我们开始实施时，很明显我们需要能够在大型数据集上衡量我们实现的性能。因为\
  \ Facebook 的规模（在我们开始实施时）约为 3 亿用户，我们将 3.5 亿确立为数据集中所需的节点数量，以确保我们的实现能够扩展以匹配 Facebook\
  \ 将达到的数字（目前接近 30 亿 ([`www.businessofapps.com/data/facebook-statistics/`](https://www.businessofapps.com))）。不幸的是，没有可公开获取的此规模数据集供我们使用。相反，我们生成了自己的数据集。\n\
  \n\n\n\n我们创建了一个数据生成器，用于生成 *n* 个节点。我们首先创建了一组 50 个节点，并生成了 50 条边，这些边随机分布在图中的 50 个节点上。然后我们选择一个至少有一个朋友的随机节点\
  \ *n*[*i*]，并执行 Dijkstra 算法以确定子图是否连通。如果子图不连通，则有 *j* 个节点无法从 *n*[*i*] 到达。我们随后选择 0 <\
  \ *r*[*i*] ≤ *j* 作为要创建的新边的数量。对于每条边，我们从包含 *n*[*i*] 的连通子图中随机选择一个节点，并从断开连接的子图部分中选择一个目标节点。只要存在断开连接的子图部分，我们就继续生成边。通过这种方式执行子图连接，我们能够生成类社交网络图，同时保持随机性，而无需手工挑选哪些边之间会有链接。\n\
  \n此时需要注意的是，我们的数据存储将每个链接记录两次。尽管图是无向的，但存在一种链接类型（用于推理）是有向的。例如，虽然通用的“Friend”链接类型是双向的，但特定的“BestFriend”链接类型不一定是双向的。为了维护这一点，我们记录了链接的每个方向及其关联的链接类型。初始子图完成后，我们遍历节点为每条边分配一个链接类型。我们建立了三种通用链接类型：Friend、Family\
  \ 和 Co-Worker，并为边的每个方向记录它们。也就是说，如果 (*n*[*i*], *n*[*j*]) ∈ ℰ 被分配了 Friend 链接类型，将生成元组\
  \ {*n*[*i*], *n*[*j*], Friend} 和 {*n*[*j*], *n*[*i*], Friend}。\n\n我们为节点所属的每条边统一选择一种通用类型。之后，我们分配特定子类型。对于\
  \ 10% 的 Friend 通用链接类型，我们分配了特定的（单向）链接类型 bestFriend。也就是说，在上述示例中，如果 *n*[*i*] 宣称 *n*[*j*]\
  \ 为 bestFriend，则元组 {*n*[*i*], *n*[*j*], Friend} 将变为 {*n*[*i*], *n*[*j*], bestFriend}。请注意，此时第二个元组将保持不变。\n\
  \n接下来，我们对定义的 Family Members 数量使用 Pareto 分布来确定有多少关系会被定义为“ParentOf”。我们使用 Pareto 分布是因为虽然列出一两个父母是我们通常认为对孩子合理的，但在当今的混合家庭中，为一个孩子列出更多父母也并非不可信。还要注意的是，当链接被定义为\
  \ ParentOf 时，其对应的元组会自动被分配反向关系 ChildOf。也就是说，假设我们之前的示例是 {*n*[*i*], *n*[*j*], Family}\
  \ 和 {*n*[*j*], *n*[*i*], Family}。如果确定 *n*[*i*] 是父母，在单个步骤中，我们将得到修正后的元组 {*n*[*i*],\
  \ *n*[*j*], ParentOf} 和 {*n*[*j*], *n*[*i*], ChildOf}。\n\n对于 Co-worker 通用链接类型，我们没有进一步定义特定链接类型。\n\
  \n对于每个节点，我们还定义了一个安全策略。为清晰起见，我们定义了三种安全策略，均匀随机选择：\n\n1.  **Strict**：只有 BestFriends\
  \ 和 Family 可以查看自己的照片和任何孩子的照片；他们的孩子不能查看任何视频。\n2.  **Casual**：任何人都可以查看照片；对孩子无限制。\n\
  3.  **ParentStrict**：任何人都可以查看父母的照片，只有家人可以查看他们孩子的照片；孩子不能查看任何视频。\n\n然后我们生成了 *m* 个资源，其中\
  \ *m* 是一个小于 450 万且大于 75 万的随机数，这应使我们能够对更活跃和更被动的社交网络进行建模。资源可以是照片或视频。我们将资源为照片的概率加权为\
  \ 75%。然后我们从 1 到 25（含）的均匀分布中抽取，以表示照片中“标记”的人数。这个“标记”表示出现在照片中的人，我们将其视为在网络中对该照片拥有“利益”的个人。\n\
  \n这里有几点需要注意。首先，虽然我们的均匀分布可能不能反映 Facebook 等社交网站照片的真实概率模型，但包含拥有照片利益的大群体代表了此类网站更困难的推理问题。其次，我们不限制照片中被标记的人仅为照片所有者的朋友。因为此功能存在于当前的在线社交网络中，我们需要支持这种类型的标记。这种能力可以支持婚礼等活动的照片，拍照者可能只认识照片中一部分人，但查看照片的人可以提供关于其他被拍摄者的更多细节。我们还要指出，我们的方法生成的图中，每个人的平均好友数为\
  \ 102 个用户（Facebook 平均好友数为 338 [`www.onaverage.co.uk/other-averages/average-number-of-facebook-friends`](https://www.onaverage.co.uk/other-averages/average-number-of-facebook-friends)）。\n\
  \n*   **Event Generation**：我们接下来生成了一系列事件，这些事件将被处理以检查使用基于语义 Web 的推理器进行社交网络访问控制的效果。我们将社交网络中可执行的完整动作集（如游戏、发帖、更改状态等）浓缩为最能影响推理器能力的动作：添加好友、访问现有资源、创建新资源和更改权限。创建用户、添加好友或创建新资源时，我们按前述方式执行任务。然而，在访问现有资源时，随机选择的用户尝试访问随机选择的资源。\n\
  \n*   **Experiments**：我们对推理器进行了两次独立实现。我们的第一个实现依赖于 SweetRules 推理引擎。我们尝试对整个数据集执行推理。以这种方式执行推理将初始模型加载到内存中花费了\
  \ 17 小时，然后每个特定推理请求需要几秒钟。然而，我们注意到当我们的模型需要更新（通过新资源、好友或安全策略变更）时，这些变更未反映在我们的内存模型中。这导致后续推理变得越来越不正确。\n\
  \n因此，我们使用 Pellet 实现了一个推理解决方案，Pellet 已成为一个非常流行的推理器。最初，我们只是将使用的推理器更改为 Pellet。然而，在使用\
  \ Pellet 的初始加载步骤中，我们收到了内存溢出错误，无法继续进行推理阶段。我们随后决定需要为社交网络实施某种分区方案。一种简单的分区方法会导致某些友谊链接跨越分区。这些跨分区边会导致以下两种情况之一：\n\
  \n1.  **Reconstructing partitions**：假设分区 *P*[*i*] 有一个用户 *u*[*a*] 和 *n* 个朋友 *u*[1],\
  \ …, *u*[*n*]，他们分别存储在分区 *P*[1], … *P*[*n*] 中。请记住，我们可以从 *Friends* 数据存储中确定 *u*[*a*]\
  \ 的朋友是谁。然而，如果没有额外的索引，此能力无法帮助我们确定他们的朋友具体在哪个分区中。我们必须投入大量资源来重组特定分区，以便有效地推断访问权限。\n\n\
  2.  **Ignoring links**：另一种选择是简单地忽略通向另一个分区的任何友谊链接。这显然不是一个可行的选项，因为它显然会导致太多无效的访问请求。\n\
  \n\n\n我们随后意识到，对于任何单个访问请求，只有那些其安全策略和好友关系对确定请求成败至关重要的用户群体才相关：（1）资源所有者，（2）发起访问请求的人，以及（3）资源中被标记的那些人。因此，我们采用了一种修正的分区方案。对于任何访问请求，我们生成一个临时表，仅包含上述三个群体的成员、涉及这些人的所有链接、请求者以及所有这些人的安全策略。\n\
  \n随后，我们使用三种测量信任值的方法，并进行实验以确定每种类型如何影响执行推理所需的时间：\n\n*   **仅链接类型（LTO）**：即前文所述方法，其中每条边仅有一种链接类型。\n\
  *   **仅信任值（TVO）**：一种用信任值替代大多数链接类型的方法。但请注意，由于“ParentOf”/“ChildOf”关系具有独特的约束条件，我们仍保留这一链接类型。不过，我们不再维护其他通用或特定的链接类型。我们假设信任值（由用户分配）比定义的链接类型是更具体的度量。\n\
  *   **值/信任混合（VTH）**：一种保留所有通用链接类型声明、“ParentOf”特定类型，并在其基础上增加信任值的方法。这为安全策略提供了更细的粒度。例如，用户不必仅将某人定义为\
  \ `BestFriend`，而是可以定义各种安全策略，如仅允许信任值大于 7 的 `Friend` 访问，其中他们可能将 `BestFriend` 声明为信任值\
  \ 6 或更高。这允许用户甚至在最好的朋友或家人中进行限制。\n\n我们的实验结果见表 17.2。该表显示了执行推理任务所需的平均时间、最长时间和最短时间。请注意，这包括生成请求评估所需的临时表所需的时间。此外，我们还进行了其他系列测试，以确定图中好友数量的影响，如图\
  \ 17.4 所示。对于这些测试，我们生成了一个子图，其中每个人拥有特定数量的好友，范围在 50 到 150 之间。我们使用三种信任度量类型（LTO、TVO 和\
  \ VTH）重复测试，并报告推理所花费的平均时间。同样，我们看到 LTO 显然用于推理的时间最少。此外，我们可以看到，在每个额外的好友群体中，推理所花费的时间仅略有增加。此外，在所有成员拥有\
  \ 50 个好友的点上仅有轻微下降，这表明我们推理操作的大部分时间被推理引擎的开销（包括我们的动态分区方法）所消耗。\n\n#### 表 17.2 进行推理的时间（单位：秒）\n\
  \n|  | Average | Low | High |\n| --- | --- | --- | --- |\n| LTO | 0.585 | 0.562\
  \ | 0.611 |\n| TVO | 0.612 | 0.534 | 0.598 |\n| VTH | 0.731 | 0.643 | 0.811 |\n\n\
  ![图 17.4 按好友数量划分的推理平均时间。](img/fig17_4.jpg)\n\n图 17.4 按好友数量划分的推理平均时间。\n\n## 17.10\
  \ 利用大数据和云技术实现可扩展性\n\n我们使用语义 Web 来表示和推理用于访问控制的社交媒体数据，我们的策略和数据使用语义 Web 技术指定。社交媒体数据库规模庞大，支持数十亿用户。因此，我们需要可扩展的技术来表示和推理关于安全性和隐私的数据。我们现在拥有大数据管理技术，包括\
  \ `MongoDB`、`Google's Big Query` 和 `Apache HIVE` 等系统。大数据解决方案正由 `Amazon`、`IBM`、`Google`\
  \ 和 `Microsoft` 等云提供商开发。此外，基于 `Apache Hadoop`、`Spark` 和 `Storm` 等产品的基础设施/平台也在开发中。还有基础设施管理工具以及大数据管理工具。\n\
  \n基础设施管理工具包括以下内容：\n\n*   **Apache Hadoop**：`Hadoop` 是一个用于处理大量数据的开源分布式框架。它使用 `MapReduce`\
  \ 编程模型。其存储系统称为 `Hadoop Distributed File System (HDFS)`。它托管在机器集群上。\n*   **MapReduce**：`MapReduce`\
  \ 是一种编程模型及其相关实现，它接收客户端请求并将其转换为 `MapReduce` 作业。这些作业随后由 `Hadoop` 执行。该编程模型的主要特性是作业的生成。\n\
  *   **Apache Spark**：`Apache Spark` 是一个用于处理海量数据的开源分布式计算框架。应用程序员通过一个包含称为 `Resilient\
  \ Distributed Dataset (RDD)` 数据结构的接口来使用 `Spark`。`Spark` 的开发是为了克服 `MapReduce` 编程模型的局限性。\n\
  *   **Apache Storm**：`Apache Storm` 是一个用于处理海量数据的开源分布式实时计算系统。`Storm` 本质上是一个用于处理流数据和实时分析的实时框架。它可以与\
  \ `HDFS` 集成。\n\n大数据管理工具包括以下内容：\n\n*   **Apache Hive**：`Apache Hive` 是一个建立在 `Hadoop/MapReduce`\
  \ 平台之上的开源类 SQL 数据库/数据仓库。它最初由 `Facebook` 开发，用于存储与 `Facebook` 数据相关的信息。后来它成为一个开源项目和\
  \ `Apache` 的商标。\n*   **Google Big Query**：`Big Query` 本质上是一个管理 PB 级数据的数据仓库。它运行在\
  \ `Google` 的基础设施上，可以极快地处理 SQL 查询或进行分析。\n*   **NoSQL 数据库**：`NoSQL database` 本质上是指非关系型数据库设计或面向\
  \ Web 的可扩展性的通用术语。它被称为非关系型高性能数据库。`NoSQL` 数据库的数据模型可能包括图、文档结构和键值对。一些流行的 `NoSQL` 数据库包括\
  \ `MongoDB` 和 `HBase`。\n\n图 17.5 展示了我们可扩展安全社交媒体系统的架构。在这里，大数据管理工具托管在基础设施工具之上。大数据管理工具增强了推理引擎。这些推理引擎本质上实现了各种机器学习算法，包括深度学习算法以及聚类算法。这些算法将检查策略、了解数据，然后提取模式并进行预测。如果模式和预测不是用户被授权查看的内容，则不会提供给用户。更多详情见[[THUR2020]](#ch17.xhtml#ref17_14)。\n\
  \n![图 17.5 可扩展安全社交媒体系统。](img/fig17_5.jpg)\n\n图 17.5 可扩展安全社交媒体系统。\n\n## 17.11 总结与展望\n\
  \n\n\n在本章中，我们提出了一种基于语义 Web 工具的可扩展细粒度在线社交网络访问控制模型。此外，我们提出了使用 `OWL` 和 `SWRL` 建模的授权、管理和过滤策略。支持该模型的框架架构也已呈现。我们还描述了基于语义\
  \ Web 工具的可扩展细粒度在线社交网络访问控制模型的实现。特别是，我们讨论了使用 `OWL` 和 `SWRL` 建模的授权、管理和过滤策略的实现。也就是说，我们讨论了\
  \ 第 19 章 中描述的框架的一个版本的实现，并展示了使用该方案评估访问控制所需时间长度的实验结果。进一步的工作可在确定一组最小访问策略方面开展，以便在评估访问请求时使用，从而进一步提高这些请求的效率。\n\
  \n我们打算向几个方向扩展这项工作。第一个方向源于这样一个事实：支持灵活的管理策略可能会使系统进入一种场景，即由不同用户指定的多个访问控制策略可应用于同一资源。确实，在我们的框架中，根据所支持的本体，社交网络的资源可能与不同的用户相关联。例如，给定的一张照片可能关联到所有者（例如\
  \ Bob），以及所有被标记的用户（例如 Alice 和 Carl）。根据管理策略的语义，这些被标记的用户中的某些用户可能被授权为该资源指定访问控制策略（例如仅\
  \ Alice）。例如，Alice 可能指定标记给她的照片只能由她的直接好友访问，而 Bob 可能指定他的照片必须由他的直接好友和同事访问。为了实施访问控制，框架必须决定如何将指定的访问控制策略组合在一起。因此，所提议框架的一个重要扩展将是支持多种策略集成策略。作为另一项重要的未来工作，我们计划利用本章讨论的思路实现我们的框架，并测试基于前向链接和后向链接推理的各种组合方式在不同场景下的效率。\n\
  \n此外，我们已经表明，现有的社交网络需要某种形式的合理数据分区，以使其访问控制的语义推理在速度和内存需求方面保持合理，这是由于执行推理的可用内存受限。此外，进一步的工作可用于确定在社交网络中表示个人信息的最佳方法，以判断混合语义/关系方法还是纯方法能提供最佳的整体系统。\n\
