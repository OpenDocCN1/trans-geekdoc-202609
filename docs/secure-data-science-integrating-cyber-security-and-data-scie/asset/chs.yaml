  \ and ponder, In D. Fensel, K.P. Sycara, and J. Mylopoulos, editors, International\
  \ Semantic Web Conference, volume 2870 of Lecture Notes in Computer Science, Springer,\
  \ 2003, pp. 419–437.\n\n*   `[WWW2006]` World Wide Web Consortium, Defining n-ary\
  \ Relations on the Semantic Web, 2006, [`www.w3.org/TR/swbp-n-aryRelations/`](http://www.w3.org)\n\
  \n*   `[WWW1999]` World Wide Web Consortium, Status for Resource Description Framework\
  \ (rdf) Model and Syntax Specification, 1999, [`www.w3.org/1999/.status/PR-rdf-syntax-19990105/status`](http://www.w3.org)\n\
  \n*   `[YAGU2005]` M.L. Yague, M.-del-M. Gallardo, A. Mana, Semantic Access Control\
  \ Model: A Formal Specification, ESORICS: European Symposium on Research in Computer\
  \ Security, LNCS, Springer-Verlag, 2005.\n\n# 18 大数据的推理与访问控制\n\nDOI: [10.1201/9781003081845-29](https://doi.org/10.1201/9781003081845-29)\n\
  \n## 18.1 简介\n\n\n\n\n### 使用语义 Web 技术进行推理控制\n\n推理是从前提形成结论的过程。如果用户从收到的合法响应中得出未经授权的结论，则该过程是有害的。这个问题被称为推理问题。推理控制器是防止用户得出未经授权结论的设备。我们过去曾广泛研究推理问题。具体而言，我们定义了各种类型的推理策略，并开发了处理某些类型推理策略的推理控制器\
  \ [THUR1993]。\n\n关于构建推理控制器以保护数据机密性的早期工作描述于 20 世纪 80 年代末和 90 年代初 [THUR1987, THUR1993]；然而，这些工作主要集中在多级安全数据库领域，且支持的推理能力有限。通过使用语义\
  \ Web 技术，我们目前的工作在更复杂的推理和策略表示技术方面，较先前的工作有了实质性改进 [THUR2014]。我们使用 `资源描述框架 (RDF)` 作为数据模型，它支持具有不同数据模式的多数据库的互操作性。此外，我们使用语义\
  \ Web 规则和约束来表示策略和规则，并使用语义 Web 软件工具（如 `Pellet`、`Jena` 和 `Protégé`）对数据项及其之间的关系进行分类\
  \ [SIRI2007, CARR2004, KNUB2004]。\n\n我们的工作重点在于对溯源数据进行分类和保护，溯源数据是一种元数据，它记录了感兴趣的单个数据项的来源，以及数据操纵操作和时间信息等其他相关信息\
  \ [THUR2014]。虽然可以使用任何数据格式来表示溯源，但有时使用有向图布局来可视化其结构会更容易。因此，我们将溯源数据称为有向图，因为有向图结构除了流行之外，在语义\
  \ Web 环境的数据建模方面还有许多优势。语义 Web 通过使用形式语义，扩展了 `RDF` 图数据模型，使其具备推理能力。在我们的工作中，我们利用语义 Web\
  \ 的推理能力来支持推理控制器的推理策略。此外，我们还提出了几种新的查询修改（即重写）技术，可用于在溯源图上强制执行安全策略。\n\n在本章中，我们将讨论采用围绕语义\
  \ Web 技术构建的推理策略和技术的推理控制，这些技术可用于社交媒体中的推理控制。我们的工作重点是针对表示为 `RDF` 图的溯源数据的推理控制。由于社交网络数据也可以建模为\
  \ `RDF` 图，因此我们的方法可适配于社交网络数据。我们还提供了推理控制器的详细实现。值得注意的是，访问控制是我们推理控制工作的核心。也就是说，我们不仅防止直接访问未经授权的数据，还防止通过推理间接访问未经授权的数据。\n\
  \n本章的组织结构如下。我们的设计见 18.2 节。查询修改见 18.3 节。我们的实现方法见 18.4 节。溯源方面见 18.5 节。实现细节见 18.6 节。生成器中的概念见\
  \ 18.7 节。医疗示例见 18.8 节。约束见 18.9 节。下一代推理控制器见 18.10 节。18.11 节总结了本章。图 18.1 描述了推理控制器的架构。\n\
  \n![图 18.1 推理控制器架构。](img/fig18_1.jpg)\n\n图 18.1 推理控制器架构。\n\n## 18.2 推理控制器的设计\n\n\
  ### 18.2.1 架构\n\n推理问题的不可解性已在 [THUR1990] 中得到证明。其复杂性仍是一个开放问题。虽然有必要分析推理问题的复杂性类，但大量研究仍围绕基于传统数据库的实现展开。然而，由于溯源具有逻辑图结构，它也可以用图数据模型表示和存储；因此，它不局限于任何特定的数据格式。尽管我们在该设计中的重点是构建基于溯源图表示的推理控制器，但我们的推理控制器也可用于保护传统数据库的情况。此外，使用\
  \ `RDF` 数据模型不会给我们的实现带来过多限制，因为其他数据格式均可由 `RDF` 数据模型良好支持。此外，[BIZE2003] 中讨论的工具等可将关系数据转换为\
  \ `RDF` 数据。\n\n我们的架构接收用户的输入查询，并返回一组经过用户定义的策略约束修剪后的响应。我们假设用户可以与我们的系统交互以获取传统数据和溯源数据。然而，由于我们的重点是保护溯源，我们将更多地关注推理控制器和溯源数据层的设计。\n\
  \n在我们的设计中，我们假设可用信息分为两部分：实际数据和溯源。数据和溯源均表示为 `RDF` 图。读者应注意，我们不对实际信息的存储方式做任何假设。用户可能将数据和溯源存储在两个不同的三元组存储中，也可能存储在同一个存储中。用户应用程序可以提交查询以访问数据及其关联的溯源，反之亦然。图\
  \ 18.2 展示了我们的设计以及基于溯源数据的推理控制器原型实现中的一些模块。我们现在介绍图 18.2 中的模块。\n\n![图 18.2 系统模块。](img/fig18_2.jpg)\n\
  \n图 18.2 系统模块。\n\n#### 18.2.1.1 用户界面管理器\n\n用户界面管理器负责处理用户请求、认证用户并向用户提供合适的响应。界面管理器还提供了一个抽象层，允许用户与系统交互。因此，用户可以向该层提交数据查询或溯源查询。用户界面管理器还确定查询应针对传统数据还是溯源数据进行评估。\n\
  \n#### 18.2.1.2 策略管理器\n\n策略管理器负责确保查询用户有权使用系统。它根据用户的查询和相关的查询结果评估策略，以确保不会向未经授权的用户发布机密信息。策略管理器可以针对传统数据或溯源数据强制执行策略。每种数据类型可能有自己的策略管理器；例如，传统数据的存储格式可能与溯源数据不同。因此，我们可能需要每个策略管理器的不同实现。\n\
  \n#### 18.2.1.3 推理引擎\n\n\n\n\n推理引擎是推理控制器的核心。该引擎能够使用特定推理器支持的多种推理策略。由于存在许多推理器的实现，我们的推理控制器提供了额外的灵活性特性，使我们可以为每个推理任务从任意推理工具中进行选择。我们可以提高推理控制器的效率，因为每种推理策略（或策略组合）都可以在单独的处理器上执行。推理引擎通常使用具有推理能力的软件程序，可对某些数据表示进行推理，例如关系数据模型或\
  \ RDF 图模型表示。\n\n#### 18.2.1.4 数据控制器\n\n数据控制器是一套存储和管理数据访问的软件程序。数据可以以任何格式存储，例如存储在关系数据库中、XML\
  \ 文件中或 RDF 存储中。如果策略允许请求用户访问数据项，控制器将接受来自策略管理器（或推理引擎层）的信息请求。然后该层在存储的数据上执行请求，并将结果返回给策略层（或推理引擎层），在那里根据一组策略重新评估。\n\
  \n#### 18.2.1.5 来源控制器\n\n来源控制器用于存储和管理与数据控制器中存在的数据项相关的来源信息。如果我们选择来源的图表示，来源控制器将以逻辑图结构的形式，按任何适当的数据表示格式存储信息。该控制器还记录与存储在数据控制器中的数据项相关的正在进行的活动。该控制器以图查询作为输入，并在来源信息上对其进行评估。该查询评估将一个子图返回给推理控制器层，在那里使用一组策略对其重新检查。\n\
  \n## 18.3 通过查询修改进行推理控制\n\n### 18.3.1 查询修改\n\n查询修改技术过去曾用于处理自主安全和视图 [STON1975]。该技术在\
  \ [DWYE1987] 中被扩展以包含强制安全。在我们的查询处理器设计中，推理引擎使用此技术根据安全约束、先前发布的响应和现实世界信息来修改查询。当提出修改后的查询时，生成的响应将不违反安全性。\n\
  \n考虑 第 18.2 节 中讨论的推理控制器架构。推理引擎可以访问知识库，其中包括安全约束、先前发布的响应和现实世界信息。从概念上讲，可以将数据库视为知识库的一部分。我们通过示例说明查询修改技术。该技术的实际实现可以采用\
  \ [GALL1978] 中针对演绎查询处理给出的任何建议。\n\n我们已经对应用查询修改来处理安全策略（也称为约束）进行了广泛研究，以确定用户是否可以推导出任何未经授权的推理\
  \ [THUR1993]。然后，我们的推理控制器将对数据进行清理并将结果提供给用户。我们之前的大部分工作都是在关系数据库之上构建推理控制器。在目前的工作中，我们为语义网数据开发了推理控制器。\n\
  \n### 18.3.2 关系数据的查询修改\n\n安全策略是将机密值（或分数）分配给数据项的规则（或约束）。在语义网环境中实现这些规则时，我们有几个可用选项来帮助我们实现这些规则。策略可以在设计时由\
  \ `TBox` 处理，在运行时由查询修改模块处理，并由发布知识库处理，后者跟踪来源的发布。\n\n在本节中，我们讨论关系数据的查询修改。我们从之前的工作中获得了此信息。图\
  \ 18.3 说明了通过查询修改进行的推理控制。\n\n![图 18.3 通过查询修改进行推理控制。](img/fig18_3.jpg)\n\n图 18.3 通过查询修改进行推理控制。\n\
  \n#### 18.3.2.1 查询修改\n\n我们可以根据访问控制规则修改查询，例如，`检索薪资 < 30K 且部门不是 Security 的所有员工信息`。\n\
  \n**示例 18.1。**\n\n**规则：** `John 无权访问 EMP 中的 Salary 和 DEPT 中的 Budget`。\n\n**查询：**\
  \ `在 Dept # 上连接 EMP 和 DEPT 关系`。\n\n**修改查询：** `在 Dept # 上连接 EMP 和 DEPT，并投影除 Salary\
  \ 和 Budget 之外的所有属性`。\n\n**输出** 是生成的查询。\n\n*   安全约束/访问控制规则/安全策略\n    *   **简单约束：**\
  \ `John 无法访问关系 EMP 的属性 Salary`\n    *   **基于内容的约束：** `如果关系 MISS 包含关于中东任务的信息，则 John\
  \ 无法访问 MISS`\n    *   **基于关联的约束：** `船的位置和任务放在一起不能被 John 访问；单独来看每个属性都可以被 John 访问`\n\
  \    *   **发布约束：** `在 X 发布后，Y 不能被 John 访问`\n    *   **聚合约束：** `十个或更多元组放在一起不能被 John\
  \ 访问`\n    *   **动态约束：** `任务结束后，关于该任务的信息可以被 John 访问`\n\n*   医疗保健的安全约束\n    *   **简单约束：**\
  \ `只有医生可以访问病历`\n    *   **基于内容的约束：** `如果患者患有艾滋病，则该信息是私密的`\n    *   **基于关联的约束：**\
  \ `姓名和病历放在一起是私密的`\n    *   **发布约束：** `病历发布后，姓名不能发布`\n    *   **聚合约束：** `患者集合是私密的，单独来看是公开的`\n\
  \    *   **动态约束：** `患者去世后，关于他的信息变为公开`\n\n*   查询修改算法\n    *   **输入：** `查询`，`访问控制规则`\n\
  \    *   **输出：** `修改后的查询`\n    *   **算法：**\n        *   给定查询 `Q`，检查所有与该查询相关的访问控制规则\n\
  \        *   向查询引入一个 Where 子句，否定访问控制规则中相关属性的访问权限\n\n### 18.3.3 SPARQL 查询修改\n\nRDF\
  \ 越来越多地用于存储关于某个领域的断言形式的信息。这包括机密和公开信息。`SPARQL` 已被选为从 RDF 图中提取数据的查询语言。由于在查询过程中会访问机密数据，我们需要过滤\
  \ `SPARQL` 查询，以便根据某些保密策略仅发布授权信息。我们的目标是重写 `SPARQL` 查询，使返回的结果符合保密策略。\n\n在数据库领域，已有大量工作将查询修改技术应用于\
  \ `SQL` 查询语言。这些传统方法使用重写过程来修改 `WHERE` 子句，以便根据策略集中的某些约束添加额外限制。最近，[OULM2012] 中的工作描述了一种基于\
  \ `RDF`/`SPARQL` 的查询修改技术。然而，他们的技术处理的是隐私，并未将推理控制纳入考量。我们的重点将是将类似的查询修改技术应用于 `SPARQL`\
  \ 查询。\n\n\n\n我们设计安全机制来控制 SPARQL 查询的评估，以防止机密溯源信息的泄露。我们的方法是通过添加在三元组模式上求值的过滤器和/或属性函数来修改\
  \ SPARQL 查询中的图模式。这些方法返回的答案可能与用户最初的查询意图不同。在这种情况下，可能需要决定采取适当的行动。我们提出了两种可遵循的方法。第一种方法根据初始查询检查查询的有效性，并通知用户无法保证查询的有效性。第二种方法考虑到关于查询结果有效性的反馈可能会导致用户得出不良推断。\n\
  \n在某些情况下，可能只返回已知符合策略约束的答案。在其他情况下，可能需要根据某些转换规则，用一个满足查询的受限子图来替换它，该规则使发布的知识库与策略约束保持一致。另一种方法可能是“撒谎”；这类似于多级安全数据库中的多实例化，不同权限级别的用户看到不同版本的现实。\n\
  \n### 18.3.4 为强制执行约束而进行的查询修改\n\n修改 SPARQL 查询中图模式的方法使用不同的技术，例如 SPARQL 过滤器和属性函数、图转换以及匹配/应用模式。为了根据安全分类确定三元组的类型，推理引擎将使用领域本体来确定每个数据项所属的概念，以及基于\
  \ SPARQL `BGP`（基本图模式匹配）转换的查询修改。\n\n#### 18.3.4.1 SPARQL 查询过滤器\n\nSPARQL 规范提供了另一种修改图模式的技术\
  \ [PRUD2006]。SPARQL `FILTER` 将解限制为使过滤器表达式求值为 `TRUE` 的那些。我们简要讨论如何通过应用 SPARQL 过滤器来重写\
  \ SPARQL 查询。以下是一个请求患者年龄的 SPARQL 查询。\n\n```\nPREFIX med: <http://cs.utdallas.edu/semanticweb/Prov-AC/medical#>\n\
  \nSELECT ?patient\n\nWHERE { ?patient med:age ?age }\n```\n\n查询修改后，我们将查询限制为仅年龄大于\
  \ 18 岁的患者。\n\n```\nPREFIX med: <http://cs.utdallas.edu/semanticweb/Prov-AC/medical#>\n\
  \nSELECT ?patient\n\nWHERE { ?patient med:age ?age\nFILTER (?age > 18)\n}\n```\n\
  \n#### 18.3.4.2 属性路径\n\n属性路径是图中两个图节点之间可能的路线。一个简单的情况是长度恰好为 1 的属性路径，即三元组模式。属性路径表达式（或简称“路径”）类似于正则表达式字符串，但作用于属性而非字符。表\
  \ 18.1 描述了正则路径表达式及其说明。\n\n表 18.1 正则路径表达式\n\n| Uri | 一个 URI 或前缀名。长度为一的路径。 |\n| ---\
  \ | --- |\n| `^elt` | 反向路径（对象到主语）。 |\n| `(elt)` | 分组路径 elt，括号控制优先级。 |\n| `elt1/elt2`\
  \ | `elt1` 后跟 `elt2` 的序列路径 |\n| `elt1 ^ elt2` | `elt1 ^ elt2` 的简写，即 elt1 后跟反向 elt2。\
  \ |\n| `elt1 \\| elt2` | `elt1` 或 `elt2` 的替代路径（尝试所有可能性） |\n| `elt*` | 零个或多个 `elt`\
  \ 出现的路径。 |\n| `elt+` | 一个或多个 `elt` 出现的路径。 |\n| `elt?` | 零个或一个 `elt` 的路径。 |\n| `elt{n,m}`\
  \ | `elt` 出现次数在 n 和 m 之间的路径。 |\n| `elt{n}` | 恰好 n 次 elt 出现。固定长度路径。 |\n| `elt{n,}`\
  \ | n 个或更多 `elt` 出现。 |\n| `elt{,n}` | `elt` 出现次数在 0 和 n 之间。 |\n| `!uri` | 匹配非 uri\
  \ 属性的路径（否定属性集） |\n| `!(uri1 \\| ... \\| uriN)` | 匹配非 uri1...uriN 中任意属性的路径（否定属性集）\
  \ |\n\n#### 18.3.4.3 属性路径查询\n\n这些查询允许我们修改三元组模式的属性（注意该属性可以是有向标签边，也可以是主语和宾语之间的有向路径）。一个重要应用是支持正则表达式。我们打算在图模式上建立路径约束，作为减少导致推理问题泄露的一种方式。我们编写的代码可以根据用户查询的内容执行。该代码可以检查用户查询的各个方面，例如三元组或三元组模式的字面文本，并采取即时行动以确保适当的策略约束保持完整。以下是一个在溯源图上使用正则表达式作为\
  \ `SELECT` 查询 `BGP` 一部分的示例，该示例使用 `OPM` 词汇表。\n\n```\n{\n  med:Doc_n_4 gleen:Subgraph(\"\
  ([opm:WasDerivedFrom]*/[opm:WasGeneratedBy]/[opm:WasControlledBy])\" ?x).\n}\n```\n\
  \n此查询模式将授予对通往 John 记录路径上的工件、过程和代理的访问权限。此查询使用 Gleen 正则表达式库编写 [DETW2008]。Gleen 库 [DETW2008]\
  \ 提供了两个有用的函数：`OnPath` 和 `Subgraph`。`OnPath` 函数可用于定位图中所有与查询资源处于特定关系模式的资源，通过返回可达资源集合来实现。`Subgraph`\
  \ 函数返回通往这些结果的路径上遍历的资源和属性集合。\n\n#### 18.3.4.4 查询修改概述\n\nSPARQL 查询修改的概述如下：\n\n1. \
  \ 遍历图模式。\n2.  识别图模式中每个三元组 `t` 的 `sub(t)`、`obj(t)`、`pred(t)`。\n3.  如果 `sub(t)`、`obj(t)`\
  \ 或 `pred(t)` 是机密的，则隔离 `t` 或对其进行转换。\n4.  创建一个包含修改后图模式的新查询。\n\n#### 18.3.4.5 SPARQL\
  \ 查询 BGP 的图转换\n\nSPARQL 基于图模式匹配，SPARQL 查询 `BGP` 是一个图模式（即一组三元组）[PRUD2006]。\n\n**定义\
  \ 18.1：** *（图模式）SPARQL 图模式表达式递归定义如下*：\n\n1.  三元组模式是一个图模式。\n2.  如果 `P1` 和 `P2` 是图模式，则表达式\
  \ (`P1 AND P2`)、(`P1 OPT P2`)、(`P1 UNION P2`) 是图模式。\n3.  如果 `P` 是一个图模式，`R` 是一个内置\
  \ SPARQL 条件，则表达式 (`P FILTER R`) 是一个图模式。\n4.  如果 `P` 是一个图模式，`V` 是一个变量集合，`X ∈ U ∪\
  \ V`，则 (`X GRAPH P`) 是一个图模式。\n\n在 SPARQL 查询重写过程中，`BGP` 将被一个更新的图模式替换。图转换规则将原始 `BGP`\
  \ 作为其 `LHS`（左侧），并指定另一个模式作为 `RHS`（右侧）。\n\n**示例 18.2：** *隐藏患者的手术信息*。\n\n```\n{\n \
  \ med:Doc_n_4 gleen:OnPath(\"([opm:WasDerivedFrom]*/[opm:WasGeneratedBy])\" ?x).\n\
  }\n```\n\n此模式匹配这样一条路径：患者记录中的一个条目（可选择性地源自患者记录的其他版本）是作为某个过程的结果而创建的。该过程即为手术。当此模式作为图转换规则的\
  \ `LHS` 时，可以被规则的 `RHS`（即另一个模式）替换，从而不泄露手术信息。一个可能的 `RHS` 模式如下：\n\n```\n{\n  med:Doc_n_4\
  \ gleen:OnPath(\"([opm:WasDerivedFrom])\" ?x).\n}\n```\n\n此模式将仅返回患者记录的前一个版本，而不包含任何记录版本具有通往手术路径的条目。\n\
  \n#### 18.3.4.6 匹配模式/应用模式\n\n\n\n在 `[ORAC12]` 中，数据访问约束使用两种图模式来描述：匹配模式和应用模式。匹配模式确定要强制执行的访问限制类型，并将一个或多个变量绑定到用户查询中访问的相应数据实例。\n\
  \n**示例 18.3：** 使用匹配和应用模式的数据访问约束。\n\n匹配：`{?contract pred:hasContractValue ?cvalue\
  \ }`\n\n应用：`{?contract pred:hasManager emp:Andy }`\n\n此示例确保仅当 `Andy` 是所访问合同的管理员时，才能访问合同的\
  \ `hasContractValue`。示例 18.3 中的重要特性是：在匹配模式中定义的变量被用于相应的应用模式中，以对已识别资源强制执行访问限制。\n\n\
  ##### 18.3.4.6.1 处理规则\n\n仅查询 RDF 图但不处理规则的查询引擎，与同时处理规则的推理引擎之间存在差异。在文献中，这种差异并不总是清晰的。推理引擎的复杂度比查询引擎高得多。原因在于规则允许我们进行顺序演绎。在查询执行过程中，必须构建这些演绎。而查询引擎则不需要这样做。请注意，还有其他查询引擎依赖于有向标记图的形式化模型，例如\
  \ DQL 和 RQL `[FIKE2002, KARV2002]`。\n\n规则还支持一个逻辑基础，其固有复杂性高于无规则情况下的逻辑。对于 RDF 查询引擎，仅需要图上简单的蕴含原则。`RuleML`\
  \ 是一项重要工作，旨在定义可用于万维网的规则。推理 Web 是一个最近的实现，它定义了一个在语义 Web 上处理不同推理引擎的系统 `[MCGU2004]`。\n\
  \n##### 18.3.4.6.2 通过图重写强制执行约束\n\n图重写，也称为图变换，是一种利用某种自动机器从原始图创建新图的技术。这通常是一种编译抽象，其基本思想是：计算状态可以表示为图，而计算的进一步步骤则表示为图上的变换规则\
  \ `[EHRI2006, ROZE1997]`。\n\n图重写源于逻辑和数据库理论，其中图被视为数据库实例，重写操作被视为定义查询和视图的机制。流行的图重写方法包括双推出方法、单推出方法和代数方法\
  \ `[EHRI1991]`。我们描述的方法类似于单推出方法。图重写系统由一组形式为 `p: L → R` 的重写规则组成，其中 `L` 是图模式（或左侧），`R`\
  \ 是替换图（或规则的右侧）。通过在原始图中搜索模式图的出现，并用替换图的存在来替换找到的出现，将图重写规则应用于原始图。\n\n## 18.4 推理控制器实现的方法\n\
  \n我们实现推理控制器的方法如 `图 18.4` 所示。传统上，我们使用访问控制策略和基于清理的策略等策略来保护数据。然而，当前强制执行这些策略的机制无法作用于以有向图形式呈现的数据\
  \ `[BRAU2008]`。此外，用户可以通过对溯源图执行频繁查询，从返回的结果中推断出敏感信息。我们特别关注从前提形成的任何结论，其中该结论的形成未经任何控制或处理前提或结论来源信息的个人或组织的明示或事先批准。我们也将从前提形成这些结论的过程称为推理。当推断出的信息是用户未获授权查看的内容时，我们称之为推理问题的一个实例。该问题始终存在于同时包含公共和私有信息的系统中。推断出的知识可能依赖于从知识库获得的数据，也可能依赖于用户拥有的先验知识以及从知识库获得的信息\
  \ `[THUR1993]`。\n\n![图 18.4 实现推理控制器。](img/fig18_4.jpg)\n\n图 18.4 实现推理控制器。\n\n仅从知识库获得的推断知识可用于揭示知识库中有什么和没有什么。例如，如果用户询问与患者\
  \ X 光检查相关的信息，任何响应都可能表明该患者是否做过 X 光检查。一般来说，对查询的肯定回答揭示了知识库中的内容，而否定回答可能有多种解释。例如，用户可能将否定回答解读为答案不在知识库中，或者解读为答案在知识库中，但知识库选择不向查询揭示正确答案。这两种解释也可能取决于知识库使用封闭世界假设还是开放世界假设\
  \ `[REIT1977]`。通常，开放世界假设表示数据不完整，或者数据可能在系统的其他地方，不限于特定文件或位置。在封闭世界假设中，数据是完整的，对查询的否定回答通常表示数据不在知识库中。我们假设开放世界假设；特别是，用户不应能准确区分被推理控制器隐藏的事实的存在，与可在别处获得的事实的不存在。\n\
  \n我们的主要重点是对呈现为 RDF 图的社交媒体数据进行分类和保护。然而，我们推理控制器的初始实现是针对溯源数据的，溯源数据存在于包括社交媒体数据在内的众多领域中。我们的推理控制器可针对社交媒体数据进行调整，因为我们的社交网络表示为\
  \ RDF 图。语义 Web 通过使用形式语义扩展了 RDF 图模型，使其具备推理能力。正是这种推理服务被我们用来支持推理控制器的推理策略。此外，我们还展示了如何执行新的查询修改技术，以在溯源图上强制执行安全策略，这可以扩展到\
  \ `第 19 章` 和 `第 20 章` 中讨论的社交媒体图。\n\n语义推理器使我们能够从一组公理中推断逻辑后果。它提供了一组更丰富的机制，使我们能够从使用\
  \ OWL 词汇编码的溯源图中得出推论。我们可以通过本体语言指定推理规则。推理器通常使用一阶谓词逻辑进行推理。推理通过前向链接和后向链接进行。（图 18.4）。\n\
  \n## 18.5 推理与溯源\n\n本章这一节的组织结构如下。在 `第 18.5.1 节` 中，我们提供示例以激发读者兴趣。在 `第 18.5.2 节` 中，我们讨论推理问题的方法。溯源中的推理在\
  \ `第 18.5.4 节` 中讨论。我们在 `第 18.5.4 节` 中提供用例。规则处理在 `第 18.5.5 节` 中讨论。\n\n### 18.5.1\
  \ 示例\n\n\n\n\n#### 推理规则\n\n*推理规则*可用于从前提推导出结论以构建论证。重要的是要指出，如果一组规则是完备的，则可用于推导任何有效的结论。如果一组规则不会推导出无效的结论，则该规则集是可靠的。某些规则可能是冗余的，因此一个可靠且完备的规则集在得出结论时不必包含每一条规则。如前所述，当结论不是用户被授权查看的内容时，我们就存在安全泄露和推理问题。\n\
  \n规则可以在前向链接或后向链接中调用：\n\n*   **前向链接模式**：我们得到一组陈述，并使用规则推导出新的陈述。原则上，反复应用前向链接将找到可以从知识库中的某个初始事实集通过推理规则推导出的所有事实。\n\
  \n**示例 18.4：**\n\n考虑以下两条规则：\n\n1. `(med:HeartSurgery opm:wasControlledBy ?X) → (X\
  \ rdf:type med:Surgeon)`\n2. `(med:Results_n_1 opm:Used med:Doc_n_6) ^ (med:Results_n_1\
  \ opm:wasControlledBy ?X) → (X rdf:type med:Surgeon)`\n\n如果我们的知识库包含以下三元组：\n\n```\n\
  <med:HeartSurgery_n_1> <opm:Used> <med:Doc_n_5>\n<med:Doc_n_6> <opm:WasGeneratedBy>\
  \ <med:HeartSurgery_n_1>\n<med:Doc_n_6> <opm:wasDerivedFrom> <med:Doc_n_5>\n<med:Results_n_1>\
  \ <opm:Used> <med:Doc_n_6>\n<med:Results_n_1> <opm:WasControlledBy> <med:Surgeon_n_1>\n\
  <med:HeartSurgery_n_1> <opm:WasControlledBy> <med:Surgeon_n_1>\n```\n\n我们可以通过使用上述知识库中的最后一个三元组得出\
  \ `?X` 是一名外科医生的结论。三元组 `(med:Surgeon_n_1 rdf:type med:Surgeon)` 随后将被添加到知识库中。请注意，执行规则\
  \ 2 也会将此三元组添加到知识库中。\n\n在**后向链接**中，我们得到某个表达式，并确定必须满足的所有前件，以使给定的后件表达式为真。\n\n**示例 18.5：**\n\
  \n考虑以下规则：\n\n1. `(med:HeartSurgery opm:wasControlledBy ?X) → (X rdf:type med:Surgeon)`\n\
  2. `(med:Results_n_1 opm:Used med:Doc_n_6) ∧ (med:Results_n_1 opm:wasControlledBy\
  \ ?X) → (X rdf:type med:Surgeon)`\n\n如果我们想满足规则 1，推理器会得出结论 `med:HeartSurgery opm:wasControlledBy\
  \ ?X`。给定陈述：\n\n```\n<med:HeartSurgery_n_1> <opm:WasControlledBy> <med:Surgeon_n_1>\n\
  ```\n\n该推导将导致推理器产生 `med:Surgeon_n_1` 作为问题 `(X rdf:type med:Surgeon)` 的答案。\n\n###\
  \ 18.5.2 推理问题的方法\n\n可以采用不同的方法来构建推理控制器。例如，我们可以使用最先进的机器学习技术来构建一个学习器，该学习器能自动学习识别复杂模式，并基于某些显式数据做出智能决策。我们还可以构建一个推理控制器，它使用配备推理器的语义\
  \ Web 技术，对知识库中的数据执行推理。在本节中，我们将阐述基于语义 Web 技术使用的推理控制器的一些方法。\n\n**聚合问题**是推理问题的一个特例——数据元素的集合是机密的，但单个元素是非密的。\n\
  \n`A ⊔ B ⊔ C ⊑ Secret`\n\n我们可以通过检查溯源 KB 或发布 KB 中是否存在任何敏感概念来强制执行此规则。\n\n`A ⊓ B ⊓\
  \ C ⊑ Secret`\n\n`≥ 10 R.(A ⊓ B ⊓ C)`\n\n如果我们知道至少有十个人拥有某个属性，则对 KB 进行分类。\n\n**关联问题**：属性\
  \ A 和 B 组合在一起是机密的，但单独来看它们是非密的。\n\n**示例 18.3：** `A and B and C → Secret`。\n\n*我们可以将其编码为一条\
  \ SWRL 规则，然后检查溯源 KB 或发布 KB 中是否有任何机密内容*。\n\n```\n(med:Doc_n_6 opm:wasDerivedFrom\
  \ med:Doc_n_5)\n  ∧ (med:Doc_n_6 opm:WasGeneratedBy med:HeartSurgery_n_1)\n  ∧ (med:HeartSurgery_n_1\
  \ opm:WasControlledBy med:Surgeon_n_1)\n  →\n  (med:HeartSurgery_n_1 med:Classification\
  \ Secret)\n```\n\n如果我们认为手术操作是敏感的，可以将其分类为机密。类似地，由该操作生成的患者记录的结果版本也应被视为机密。\n\n```\n\
  (med:Doc_n_6 opm:wasDerivedFrom med:Doc_n_5)\n  ∧ (med:Doc_n_6 opm:WasGeneratedBy\
  \ med:HeartSurgery_n_1)\n  ∧ (med:HeartSurgery_n_1 opm:WasControlledBy med:Surgeon_n_1)\n\
  \  →\n  (med:Doc_n_6 med:Classification Secret)\n```\n\n**示例 18.4：** *同时属于这三个类的事物是私有的*：\n\
  \n`A ⊓ B ⊓ C ⊑ Secret`\n\n**示例 18.5：** *如果在所有三个类中最多只有一个个体，则对 KB 进行分类*：\n\n`≤ 1 R.(A\
  \ ⊓ B ⊓ C)`\n\n#### 18.5.2.1 域限制\n\n我们可以对属性的限定值施加范围限制作为机密。例如，值为 9 位数字的属性是敏感的。请注意，SSN（社会安全号）包含\
  \ 9 位数字，因此如果发布了包含 9 位数字的内容，则需要对 KB 进行分类。类似地，我们可以指定 16 位数字的内容为信用卡号。\n\n#### 18.5.2.2\
  \ 统计推理\n\n在统计推理中，我们得到汇总数据；目的是了解关于总体的宏观属性。\n\n**示例 18.6：** *如果在患者就诊期间值班的心脏外科医生最多只有一位，且我们向用户揭示以下三元组*：\n\
  \n```\n<med:HeartSurgery_n_1> <opm:WasControlledBy> <_:b>\n```\n\n那么，用户可以得出结论：值班外科医生对该患者实施了手术操作。\n\
  \n##### 18.5.2.2.1 机器学习技术\n\n在 [[CHAN1998]](#ch18.xhtml#ref18_6) 中，作者使用基于决策树的节约型降级框架来处理推理问题。假设是当\
  \ Low 出于性能和功能等目的需要信息时，High 必须决定是否将（即降级）信息提供给 Low。换句话说，当 High 希望将一组数据降级给 Low 时，由于推理通道的存在，可能有必要对该数据集进行裁剪。基本上，决策树用于从\
  \ High 提供给 Low 的降级数据中形成规则。请记住，我们可以利用个体的非敏感属性，通过在类似个体（出现在先前发布的数据中）上训练的规则，来推导（即预测）敏感属性。在节约型降级中，为未发送给\
  \ Low 的潜在降级信息分配一个成本度量。其思路是确定因（High）不降级该数据而导致的功能损失（对 Low）是否值得额外的保密性。决策树有助于分析想要降级的数据中的潜在推理通道。作者为这种节约型降级分配惩罚函数，以最小化未降级的信息量，并将惩罚成本与获得的额外保密性进行比较。\n\
  \n我们的推理引擎涵盖的其他方法包括以下内容。\n\n*   **数据库设计阶段处理推理**：这种方法被认为相对静态。它主要取决于模式设计和完整性约束。也有人指出，针对每个用户的查询不断更改数据库模式并不方便。\n\
  \n\n\n\n*   **处理查询处理过程中的推理**：大部分研究主要集中在查询修改上，主要是因为查询是动态的。\n\n### 18.5.3 来源中的推理\n\
  \n用户可以通过对来源图执行频繁查询并从返回的结果中推断出敏感信息。我们特别关注从前提形成的任何结论，其中该结论的形成未经任何控制或处理前提或前提衍生信息的个人或组织的明示或事先批准。此外，我们的目标是研究发生在来源数据中的推理问题。我们需要自动化软件工具来发现和评估来源存储中的有趣模式和语义关联。记录细粒度来源所产生的信息量是安全分析师一项重要但耗时的工作。我们可以使用语义网语言记录来源，以便智能代理和推理器能够在不损害底层来源语义的情况下自动执行推理。\n\
  \n#### 18.5.3.1 来源中的隐式信息\n\n来源文档包含数据项及其关系，这些关系被构建为有向图。该图中路径上的一个中间节点可能包含敏感信息，例如提交情报报告的代理人的身份，因此我们也需要用于查询和推理的高效工具。此外，我们需要支持大规模来源图，并具备查询该图的能力，以便构建过滤用户查询的用户视图。\n\
  \n安全策略（即安全约束）用于确定谁可以访问文档以及在什么条件下授予访问权限。在情报工作中，可能有必要保护方法和来源；因此，访问控制策略可能将报告来源的访问权限限制在姐妹机构内。然而，这些策略仅限于创建视图，并未考虑来源中的隐式信息，我们需要开发能随来源数据扩展的策略。我们需要为来源构建大型数据存储。来源可以用任何知识表示语言记录，例如\
  \ RDF、RDFS 和 OWL。使用这些语言允许我们稍后对来源图执行推理。因此，我们可以确定来源图上的隐式信息。\n\n### 18.5.4 来源的用例\n\n\
  来源的用例可在以下位置找到：来源研讨会用例 ([`wiki.esi.ac.uk/UseCasesForProvenanceWorkshop`](http://wiki.esi.ac.uk/UseCasesForProvenanceWorkshop))\n\
  \n另一个有用的用例来源可在 [`www.w3.org/2005/Incubator/prov/wiki/Use_Cases`](http://www.w3.org/2005/Incubator/prov/wiki/Use_Cases)\
  \ 找到。这提供了 W3C 孵化小组收集的初始用例。\n\n关于 W3C 小组整理的来源安全问题列表，请参见 [`www.w3.org/2005/Incubator/prov/wiki/Security_issues_in_provenance_use_cases`](http://www.w3.org/2005/Incubator/prov/wiki/Security_issues_in_provenance_use_cases)。\n\
  \n用例也可在以下 URL 获取：\n\n[`lists.w3.org/Archives/Public/public-xg-prov/2010Jan/0014.html`](http://lists.w3.org/Archives/Public/public-xg-prov/2010Jan/0014.html)\n\
  \n[`arxiv.org/PS_cache/arxiv/pdf/1002/1002.0433v1.pdf`](http://arxiv.org/PS_cache/arxiv/pdf/1002/1002.0433v1.pdf)\n\
  \n我们构建涉及谁/为什么/何时/何地查询的用例。对于特定领域，我们可能不知道这些查询的答案，因此揭示来源可能是我们获取这些答案的最佳来源。另一方面，我们可能需要保护来源图中特定资源或节点的谁/何时/何地/为什么。我们在本节中展示案例研究，以说明当我们将语义网技术应用于来源信息时想要实现的目标。特别是，我们使用一个玩具医院示例讨论一些用例。虽然我们尽量使这些用例贴近我们的医疗领域，但也讨论了其他领域的用例。\n\
  \n**数据发现** 涵盖了在就诊和操作的所有阶段观察和捕获患者活动的来源：\n\n> 医生必须依赖患者记录的历史信息，例如谁或什么导致记录处于当前状态。此外，记录的内容会随时间变化，这可能导致为决策过程进行时间细粒度的来源信息捕获。\n\
  \n#### 18.5.4.1 数据集文档\n\n这允许医生检索患者记录的当前最新快照及其来源。此文档支持急救人员和药房单位对记录进行进一步处理。\n\n####\
  \ 18.5.4.2 定位流程中的错误\n\n如果我们需要确定在对患者进行手术时，流程中的哪个位置可能发生潜在风险，那么针对患者的“何地”查询将很有用。例如，“何地”来源查询可用于识别在流程的哪个阶段，给患者服用的任何药物与患者正在服用的药物产生了负面相互作用。通过使用“何地”查询，我们可以将记录早期版本（手术前生成）中的信息与记录后期版本（包含手术期间事件记录）中的信息进行比较。\n\
  \n#### 18.5.4.3 识别查询日志中的私人信息\n\n有些信息片段也可用于识别私人信息。查询电话号码、地址和个人姓名都有助于缩小人群范围，从而增加成功攻击的几率。从查询日志中，可以生成用户的查询分布、查询时间以及查询内容。此外，还可以对用户进行聚类，并在一定程度上利用用户行为增强查询响应。最后，我们还可以关联查询（例如，查询\
  \ X 的人也查询 Y）。\n\n#### 18.5.4.4 用例：谁说的？\n\n该场景基于为政府机构进行的财务架构设计。这是一个涉及信息、服务和流程的大型架构。大多数利益相关者是非技术人员，许多是会计师。与任何此类架构一样，它基于一系列连续的输入和与利益相关者的会议——并非同时进行。虽然该架构不是使用语义网工具完成的（而是\
  \ UML），但无论使用何种形式化方法，都会出现相同的情况。在项目接近尾声时，一位利益相关者正在审查订单的信息模型。这不是该利益相关者第一次看到模型的这部分，但他们有一段时间没审查了。该利益相关者指着处理订单的模型部分上的一个属性问道：“这是从哪来的？谁让你把它放进去的？”\
  \ 这当然是个合理的问题，但如果不翻阅大量手工笔记，我们无法回答。模型中没有任何内容说明该属性来自哪里、何时添加或基于什么权限。此外，该利益相关者指出，他们以为在模型中的某些内容已被移除，并想知道去哪了。同样，工具也无法提供帮助。**结论**：必须追踪每个断言在模型中的来源（包括录入数据的人和告诉他们放置数据的人）、情境（如会议）和时间。这应成为核心知识管理基础设施的一部分，并直接关系到知识库随时间演变的可信度。\n\
  \n#### 18.5.4.5 用例：作弊的独裁者\n\n\n\n某些情报活动似乎会查看感兴趣人物的大学成绩单等信息，并以此推断其能力和品格。据传（这可能只是个传闻）“萨达姆·侯赛因”几十年前曾在澳大利亚的一所大学就读。该校的成绩单被获取并纳入其个人档案。该档案影响了重要的政治和军事活动。显而易见，为了宣传目的，这些成绩单已被篡改。分析人员想知道人工和自动化手段分别做出了哪些推断，推断出了什么信息，以及这些如何改变萨达姆的档案和潜在行动。无法追踪这条信息路径，导致许多观点存疑。这当然只是信息可能被故意伪造或掩盖、且由此得出的结论至关重要的世界中的一个小例子。信息的来源及其下游影响至关重要，特别是在重新评估来源和信息质量时。*结论*：推断的轨迹可能跨越数十年，且该轨迹可能具有关键的战略价值。此外，推断是人工和自动化活动的结合，会影响下游结论。\n\
  \n在该用例中，我们展示了通过使用从网络获取的实际属性标注生成工作流中的实体，可以验证医生的资质，并将查询用户指向适当的 URL。这些 URL 可以是我们溯源图中关于实体标注的一部分，但它们主要用于指向验证医生资质的实际来源。\n\
  \n其他用例包括：\n\n> **航空航天工程**：维护长达 99 年的设计过程历史记录。\n\n> **器官移植管理**：跟踪先前的决策，这对最大化匹配效率和患者康复率至关重要。\n\
  \n以下是一些说明医疗领域相关策略的示例：\n\n**示例 18.7：** 保护医生姓名。\n\n在该案例中，发出的任何查询生成的响应均不应泄露医生姓名。\n\n\
  **示例 18.8：** 对于每位患者，我们生成工作流以捕获医院通常执行的各种程序步骤。特别地，我们描述了手术、常规检查、术后护理操作等。\n\n### 18.5.5\
  \ 处理规则\n\n推理规则可以用多种格式编码和处理。这些格式包括使用 `SPARQL` 查询编码规则、使用描述逻辑编码规则，最后是将表达力最强的规则编码为 `SWRL`\
  \ 规则。这些方法各有差异。具体选择取决于知识库的大小、规则的表达能力和可判定性。查询处理引擎不处理推理规则，但功能依然强大。例如，我们可以在溯源的 `RDF`\
  \ 图编码中查询蕴含关系。这些查询也可用于发现溯源图中的路径（即使用正则表达式路径查询）。这些查询的结果可以组合起来，为复杂的推理问题提供答案。此外，在可扩展性是一个因素的情况下，最佳选择是查询信息片段，并在较小的知识库中组合相关部分。另一方面，在某些情况下，可能无法枚举回答特定推理问题的所有可能查询。因此，我们可能需要配备足够表达能力的自动推理器来为我们进行推理。这些推理器还可能产生仅靠查询引擎无法发现的新演绎。然而，这种能力是有代价的：可判定性。\n\
  \n规则通常比无规则情况下的逻辑更复杂。例如，在 `RDF` 查询引擎中，只需要图蕴含的简单原则。`RuleML` 是一项重要工作，旨在定义万维网可用的规则。推理网是一个新近的实现，它定义了一个在语义网上处理不同推理引擎的系统\
  \ [MCGU2003]。\n\n## 18.6 实现细节\n\n### 18.6.1 架构\n\n图 18.5 展示了溯源推理控制器的实现。该推理控制器采用模块化方法构建，因此非常灵活，大多数模块均可由另一个应用模块扩展或替换。例如，应用用户可以替换处理高级策略解析为低级策略对象的策略解析器模块。这种替换将允许应用用户继续使用其业务策略，而独立于我们的溯源推理控制器软件实现。本质上，我们遵循了“即插即用”方法来实现推理控制器。我们在实现中尽可能使用了开源产品。\n\
  \n![图 18.5 实现架构。](img/fig18_5.jpg)\n\n图 18.5 实现架构。\n\n我们实现中使用的产品包括 `Jena` 和 `Pellet`。我们的策略和数据用\
  \ `RDF` 表示。`Jena` 用于管理 `RDF` 数据。我们的推理器基于 `Pellet`。即，我们的推理控制器利用 `Pellet` 对策略和数据进行推理。我们利用\
  \ `Pellet` 构建了额外的推理策略。当用户用 `SPARQL` 提出查询时，推理控制器将检查策略，根据策略重写查询，查询 `Jena` `RDF` 存储，并检索用户被授权查看的数据。在接下来的几节中，我们将基于医疗应用举例说明我们的推理控制器如何工作。\n\
  \n### 18.6.2 医疗领域的溯源\n\n医疗领域将溯源视为其运营的关键组成部分。溯源可用于促进组织间及医疗团队成员间的沟通与协调。它可用于提供治疗过程执行的综合视图，分析分布式医疗服务的性能，并对系统进行审计以评估：对于给定患者，是否做出了正确的决策并遵循了正确的程序\
  \ [KIFO06]。\n\n\n\n\n#### 18.6.2.1 填充溯源知识库\n\n溯源知识库通过一组生成器进行更新。其中有后台生成器，负责提取通常可在线获取的背景信息。还有一个工作流生成器，用于生成实际的溯源信息。工作流生成器产生的合成溯源数据在网上是不可用的。正是这些溯源数据包含我们必须保护的子集。我们通过提取与医疗领域相关的信息来填充溯源存储。医疗领域在两方面具有适用性。首先，该领域实际记录溯源信息；其次，该领域的数据部分可在线获取\
  \ [KIFO2006]。\n\n#### 18.6.2.2 生成并填充知识库\n\n我们创建一组种子，包含名、姓、州和城市。每个种子用于创建一个查询，该查询针对\
  \ [`www.yellowpages.com/`](http://www.yellowpages.com) 或 [`www.whitepages.com/`](http://www.whitepages.com)\
  \ 网站发起。这些网站可通过搜索词定位企业和个人。为了从这些网站提取信息，我们使用了网络爬虫服务。网络爬虫是一种计算机程序，它以有条不紊、自动化的方式或有序的方式浏览万维网。网络爬虫有时被称为自动索引器、机器人、蚂蚁、收割器、网络蜘蛛、网络机器人或网络刮取器。这些爬虫是遵循万维网链接结构并在访问的网页上执行某些任务的计算机程序。\n\
  \n爬取匹配我们初始查询种子的页面后，我们以适当的格式将结果存储在文本文件中。由于此过程开销较大，我们在离线状态下构建所有网络爬取程序，并在实验阶段的测试周期中将文本文件内容加载到内存中。第一次爬取收集我们假设的患者列表。我们利用患者的邮政编码创建查询，以搜索医院、医生及其专业。这些搜索的结果也存储在具有预定格式的文本文件中。这些预定格式的文本文件使我们能够为人员、医院、医生和护士等实体构建带有属性的对象类。\n\
  \n#### 18.6.2.3 生成工作流\n\n对于我们玩具知识库中的每位患者，我们启动更新该患者记录的工作流。记录的溯源信息是我们在系统中假设的唯一机密数据。其目的是让查询用户有机会推断与记录相关的患者疾病、药物或检查。溯源数据比传统数据库更有趣，因为控制器不仅要预测涉及用户先验知识的推理，还要预测与溯源数据对象之间因果关系相关的推理。\n\
  \n#### 18.6.2.4 工作流的属性\n\n我们观察到所生成工作流的几个属性：\n\n*   我们的溯源工作流使用 `OPM toolbox` [OPEN]\
  \ 生成。该工具箱通过使用 `V[G]^(P)` 中的谓词捕获工作流的骨架，其中\n\n    `V[G]^(P) = {WasControlledBy, Used,\
  \ WasDerivedFrom, WasGeneratedBy, WasTriggeredBy}`。\n\n    也就是说，我们最初生成的工作流通常未使用与工作流实体相关的\
  \ RDF 三元组进行标注；例如，断言代理名称、地址或年龄的三元组。因此，我们避免了杂乱，使医疗程序更易于可视化。\n\n*   我们工作流图 `G` 中的每个实体均可由\
  \ RDF 三元组标注，这些三元组对实体进行断言。我们的工作流通常以完整形式存储。即，我们通过将工作流转换为包含与工作流实体相对应的相关背景信息的形式，为每个工作流添加标注。\n\
  \n*   `G` 中的每个实体都具有从黄页 ([`www.yellowpages.com`](http://www.yellowpages.com)) 或白页\
  \ ([`www.whitepages.com/`](http://www.whitepages.com)) 网站派生的属性。这些属性属于用户背景知识的一部分。我们还为溯源图中的实体添加了其他虚构属性。这些虚构属性使我们能够扩展溯源图的规模和复杂度，从而获得关于系统可扩展性的一些实验数据。\n\
  \n*   工作流图 `G` 包含私有信息，即对患者记录执行的活动的溯源信息。这是我们的推理控制器所保护的信息。我们用于保护该信息的主要方法是语义网推理器中可用的推理服务以及作用于\
  \ `G` 的策略提供的。\n\n### 18.6.3 策略管理\n\n我们在设计中讨论了策略管理的几个方面。本节将重述部分信息。\n\n#### 18.6.3.1\
  \ 策略界面\n\n策略界面为用户提供选项，以加载策略并针对溯源图数据库执行。用户可选择执行任何类型的策略，例如默认策略（访问控制、编辑、DL 规则或编码为 SWRL\
  \ 规则的策略）或其他策略类型。默认策略附带一组解析器，可将其转换为内部策略表示。只要提供合适的解析器将每种策略类型转换为内部表示，新策略类型即兼容。内部表示可以是任何作用于\
  \ RDF 图的技术，例如 `SPARQL query`、`DL` 或 `SRWL rule`。策略界面包含两个面板。左侧面板显示已加载但未生效的策略列表，右侧面板显示已加载且生效的策略列表。策略界面如\
  \ 图 18.6 所示。\n\n![图 18.6 策略界面。](img/fig18_6.jpg)\n\n图 18.6 策略界面。\n\n#### 18.6.3.2\
  \ 解析过程\n\n\n\n\n高级策略必须转换为合适的格式和表示，以便由溯源推理控制器处理。这通常涉及将高级策略解析为低级表示。我们的设计使用了一种可扩展语言来表达策略。该语言已成功用于编写访问控制策略\
  \ [MOSE2005, NI2009]。我们的策略以 XML 文档形式编写，驻留在磁盘上，直到被请求时才加载 [BRAY2000]。XML 还具备编写规则的功能\
  \ [GROS2003, GOVE2005, HORR2004]。此外，RDF 和 OWL 可以用 XML 语法表示 [BECH24, HORR04]。我们选择\
  \ XML 语言，使我们能够接受任何高级策略规范及其关联的解析器，将其映射为低级策略格式。高级应用用户也因我们使用 XML 语言而受益，因为 XML 是一种广泛使用的开放标准，许多数据交换格式都基于\
  \ XML。\n\n图 18.7 概述了策略解析过程。加载 XML 策略文件时，文件中的每个策略都会使用兼容的解析器进行解析。解析器负责确保策略格式良好。默认策略（即访问控制、编辑、推理规则）以\
  \ XML 文件形式编写，解析器根据 XML Schema 文件评估该 XML 文件。成功解析的 XML 文件中的策略随后被转换为低级表示。\n\n![图 18.7\
  \ 解析过程](img/fig18_7.jpg)\n\n图 18.7 解析过程\n\n#### 18.6.3.3 高级策略转换\n\n本节讨论如何将正确解析的高级策略转换为内部低级策略。我们首先讨论两个推理组装器：`SWRL`\
  \ 规则组装器和描述逻辑规则组装器。然后，我们讨论两个策略组装器，分别转换访问控制和编辑高级策略。\n\n#### 18.6.3.4 SWRL 规则组装器\n\n\
  该模块将高级 XML 文件映射为一组 `SWRL` 规则。`SWRL` 规则包含头部和主体。主体用于编码必须满足的条件，随后头部编码的信息才会应用于溯源知识库。\n\
  \n#### 18.6.3.5 SWRL 策略转换示例\n\n以下策略规定：如果医生拥有（或正在诊治）一名患者，则该医生也可以读取该患者的记录。\n\n```xml\n\
  <policies>\n  <policy ID=\"1\">\n    <description>…some description....</description>\n\
  \    <body>\n      <atom>?x rdf:type provac:Doctor</atom>\n      <atom>?y rdf:type\
  \ provac:Patient</atom>\n      <atom>?y provac:patientHasDoctor ?x</atom>\n    \
  \  <atom>?y provac:hasRecord ?r</atom>\n    </body>\n    <head>\n      <atom>?x\
  \ provac:canReadRecord ?r</atom>\n    </head>\n  </policy>\n</policies>\n```\n\n\
  此策略可在内部表示为：\n\n$$\n\\begin{array}{l}\nDoctor(?x) \\land Patient(?y) \\land patientHasDoctor(?y,?x)\
  \ \\land hasRecord(?r) \\\\\n\\quad \\rightarrow canReadRecord(?x,?r)\n\\end{array}\n\
  $$\n\n#### 18.6.3.6 描述逻辑规则组装器\n\n该模块将高级 XML 文件映射为一组 `OWL` 限制。`OWL` 属性用于创建限制，进而限制属于某个类的个体。这些限制可分为三大类：\n\
  \n1.  量词限制\n2.  基数限制\n3.  `hasValue` 限制\n\n**量词限制** 由三部分组成：\n\n1.  量词，即存在量词（`∃`）或全称量词（`∀`）。\n\
  2.  限制作用的属性。\n3.  作为类描述的填充项。\n\n对于给定个体，量词有效地约束该个体参与的关系。它通过指定至少必须存在一种关系，或指定只能存在的关系类型（如果存在）来实现。存在量词示例可用于定义拥有医学学位的医师：\n\
  \n`Physician ⊑ ∃has.MedicalDegree`\n\n全称限制规定：如果某属性存在关系，则该关系必须指向属于特定类的个体。全称量词示例可用于定义其所有患者都有保险的快乐医师：\n\
  \n`HappyPhysician ⊑ ∀hasPatients.(∃hasCoverage.Insurer)`\n\n#### 18.6.3.7 基数限制\n\
  \n`OWL` 基数限制描述这样一类个体：它们与其他个体或数据类型值具有至少（`≥`）、至多（`≤`）或恰好指定数量的关系。设 `P` 为一个属性，则：\n\n\
  1.  最小基数限制指定个体必须参与的 `P` 关系的最小数量。\n2.  最大基数限制指定个体可以参与的 `P` 关系的最大数量。\n3.  基数限制指定个体必须参与的\
  \ `P` 关系的确切数量。\n\n#### 18.6.3.8 hasValue 限制\n\n`hasValue` 限制描述这样一组个体：它们沿指定属性与特定个体至少存在一种关系。`hasValue`\
  \ 限制用符号 `∈` 表示。示例：`hasCountryOfOrigin ∈ Italy`（其中 `Italy` 是一个个体）。这描述了沿 `hasCountryOfOrigin`\
  \ 属性与特定个体 `Italy` 至少存在一种关系的个体集合（匿名类）。\n\n#### 18.6.3.9 支持的限制\n\n我们当前支持以下 `OWL` 限制：\n\
  \n1.  **SomeValuesFromRestriction**\n    `SomeValuesFrom` 限制是存在限制，描述这样一组个体：它们与属于特定类的个体至少存在一种特定类型的关系。\n\
  \n2.  **AllValuesFromRestriction**\n    `AllValuesFromRestriction` 是全称限制，将给定属性的填充项约束为特定类。\n\
  \n3.  **MinCardinalityRestriction**\n    `MinCardinalityRestriction` 是基数限制，指定个体就给定属性必须参与的最小关系数量。最小基数限制的符号为“大于或等于”（`≥`）。\n\
  \n4.  **MaxCardinalityRestriction**\n    `MaxCardinalityRestriction` 是基数限制，指定个体就给定属性可以参与的最大关系数量。最大基数限制的符号为“小于或等于”（`≤`）。\n\
  \n5.  **DataRange**\n    这是一个内置属性，将一个属性（或 `rdf:Property` 类的某个实例）链接到类描述或数据范围。`rdfs:range`\
  \ 公理断言该属性的值必须属于类描述的类外延，或属于指定数据范围内的数据值。\n\n6.  **Domain**\n    这是一个内置属性，将一个属性（或 `rdf:Property`\
  \ 类的某个实例）链接到类描述。`rdfs:domain` 公理断言此类属性陈述的主语必须属于所指示类描述的类外延。\n\n##### 18.6.3.9.1 DL\
  \ 策略转换示例\n\n以下策略规定：由外科医生控制的任何过程都是敏感过程。\n\n```xml\n<policies>\n  <policy ID=\"1\"\
  >\n    <description>...some description....</description>\n    <rule>\n```\n\n\n\
  \n\n<restriction>AllValuesFromRestriction</restriction>\n\n<property>opm:WasControlledBy</property>\n\
  \n<class>provac:Surgeon</class>\n\n<label>provac:SensitiveProcess</label>\n\n</rule>\n\
  \n</policy>\n\n</policies>\n\n该策略在内部转换为\n\n∀`WasControlledBy`.`Surgeon` ⊑ `SensitiveProcess`。\n\
  \n#### 18.6.3.10 访问控制策略组装器\n\n该模块将高层访问控制 XML 策略文件映射为低层访问控制策略。\n\n#### 18.6.3.11\
  \ 访问控制策略转换示例\n\n以下策略规定：如果 `Doc_2` 是由一个受外科医生控制的过程生成的，则任何用户都有权访问 `Doc_2`。\n\n<policies>\n\
  \n<policy ID=\"1\" >\n\n<description>description</description>\n\n<target>\n\n<subject>anyuser</subject>\n\
  \n<record>provac:Doc_2</record>\n\n<restriction>Doc.WasGeneratedBy == opm:Process</restriction>\n\
  \n<restriction>process.WasControlledBy == provac:Surgeon</restriction>\n\n</target>\n\
  \n<effect>NecessaryPermit</effect>\n\n</policy>\n\n</policies>\n\n该策略可转换为一个查询，用于检索该策略允许用户查看的\
  \ provenance 图部分。相应的 SPARQL 查询如下：\n\n```\nSelect ?x\n{\nmed:Doc1_2 gleen:OnPath(\"\
  ([opm:WasGeneratedBy]/[opm:WasControlledBy])\" ?x\n?x rdf:type provac:Surgeon).\n\
  }\n```\n\n#### 18.6.3.12 编辑策略组装器\n\n该模块将高层 XML 编辑策略文件映射为低层编辑策略。\n\n#### 18.6.3.13\
  \ 编辑策略转换示例\n\n以下策略规定：如果存在一条路径，该路径从 `Doc_4` 开始，且 `Doc_4` 源自一个工件，而该工件是由一个受医师控制的过程生成的，则我们应从包含该路径的\
  \ provenance 子图中编辑（删除）这条路径。\n\n</policies>\n\n<policy ID=\"1\">\n\n<description>description</description>\n\
  \n<lhs>\n\n<chain>\n\n<start> provac:Doc_4</start>\n\n<path>\n\n[opm:WasDerivedFrom]+\
  \ artifact AND artifact [opm:WasGeneratedBy] process AND\n\nprocess [opm:WasControlledBy]\
  \ physician\n\n</path>\n\n</lhs>\n\n<rhs>_:A1</rhs>\n\n<condition>\n\n<application>null</application>\n\
  \n<attribute>null</attribute>\n\n</condition>\n\n<pre>null</pre>\n\n<post>(provac:HeartSurgery_1,opm:Used,\
  \ _:A1)</post>\n\n</embedding>\n\n</policy>\n\n</policies>\n\n该策略将在 provenance 图上进行求值，替换任何以标记为\
  \ `Doc_4` 的节点开始、并通过 `WasGeneratedBy` 链接连接到一个过程、随后通过 `WasControlledBy` 链接连接到一个标记为\
  \ physician（或类型为 physician）的终止节点的路径。每条此类路径将被替换为一个空白标签 `_:A1`，且 `_:A1` 将通过一个标记为 `opm:Used`\
  \ 的链接，连接到原 provenance 图中标记为 `provac:HearthSurgery_1` 的某个节点。\n\n### 18.6.4 解释服务层\n\
  \n一个理想的特性是推理器推导出新知识，并解释它是如何推导出该新知识的。Pellet 推理器可以通过提供证明推理所需的最小事实集或其他知识来解释其推理。对于 Pellet\
  \ 计算出的任何推理，我们利用 Pellet 推理服务来解释该推理为何成立。解释本身是一组 OWL 公理，它们共同证明或支持相关推理。一条推理可能有许多（甚至无限多个）解释；Pellet\
  \ 通过启发式方法尝试提供一个较好的解释。\n\n我们的 provenance 推理控制器（详见 [THUR2014]）随后可提供关于知识库分类的信息。例如，我们可能关心为什么一组\
  \ RDF 三元组被分类为敏感，或者为什么一个概念被视为敏感。这些问题的答案留给解释服务层。该层建立在 Pellet 解释服务之上，并显示用于推导出被另一个类包含的概念的那组公理。\n\
  \n解释服务层使用 pellet 服务，为每个敏感的 provenance 片段提供理由（也称为依据）。解释服务层可向应用设计师提供反馈。解释使用低层描述显示，可能会揭示内部分类工作原理的细节。这可能是系统的一个缺点，因为应用用户可能不理解描述逻辑或\
  \ OWL。尽管如此，该服务提供了一个期望的特性，即应用设计师可以查看其策略是如何被低层推理服务解释的。例如，由于高层描述逻辑规则的应用方式可能与作者意图不同，策略设计师现在有机会调整高层策略以获得期望的结果。解释服务层如\
  \ 图 18.8 所示。\n\n![图 18.8 解释服务层。](img/fig18_8.jpg)\n\n图 18.8 解释服务层。\n\n## 18.7 生成器\n\
  \n我们现在解释将知识添加到 provenance 存储的过程。我们构建一组生成器。其中有一组后台生成器，负责提取通常可在线获取的背景信息。还有一组杂项生成器，用于构建关于疾病、药物、检查和治疗的合成数据。杂项生成器利用在线资源指导其将疾病与相关检查、治疗和疾病关联起来，因此这些杂项生成器也会产生额外的背景信息。最后，我们讨论生成实际\
  \ provenance 的工作流生成器。工作流生成器产生在线不可用的合成 provenance 数据。正是这些 provenance 数据包含我们必须隐藏的子集。\n\
  \n### 18.7.1 选择背景信息\n\n我们使用当前网页上实际存在的真实信息，以便演示推理控制器相对于查询代理的先验知识集的有效性。我们确定美国的一个城市和州。针对该城市，我们选定一组邮政编码。信息从黄页、白页等免费网站下载。我们爬取这些网站，通过设置常用名和姓的种子列表，提取各个个体的姓名、地址、电话号码、年龄、性别、亲属等信息。这使我们能够为玩具医院中的每个患者捕获相似的属性值。对于医院，我们仅选择患者邮政编码范围内的医院。每家医院都有名称、地址和电话号码。由于许多医院不公开其员工姓名，我们在相同邮政编码范围内搜索医生及其专业。这很正常，因为大多数专家都隶属于其执业地附近的特定医院。一些保险公司网站确实提供医生名单及其隶属关系，但许多此类网站需要登录\
  \ ID，或每次访问都需要不同的验证码。鉴于这些障碍，我们只能接受对实际医院情况不那么准确的描绘。此外，由于我们的系统是用户驱动的，自动化和效率成为更高优先级。这并不妨碍客户使用自己的数据填充知识库。以这种方式生成数据比使用完全合成的数据使系统更真实。查询用户可以将系统的响应与可访问的背景信息结合起来进行推理。然后查询用户可以发出新查询，以验证他们对知识库中数据的猜测。\n\
  \n### 18.7.2 后台生成器模块\n\n\n\n\n\n#### 18.7.2.1 患者生成器\n\n患者生成器从一组网页中提取一个人的属性。算法 18.1\
  \ 详细描述了患者生成器的工作。\n\n```\nhttp://www.yellowpages.com/findaperson?fap_terms%5Bfirst%5D=\"\
  fname\"\n&fap_terms%5Blast%5D=\" Lname \"\n&fap_terms%5Bstate%5D=\" State \"\n&page=1\"\
  \n```\n\n图 18.10 显示了当 `fname`=`John`、`lname`=`Smith` 和 `State`=`CA` 时的结果。然后我们从结果页面中提取地址和电话号码。图\
  \ 18.11 显示了当基础 URI 为 `www.whitepatges.com`、参数为 `fname`=`John`、`lname`=`Smith` 和\
  \ `State`=`CA` 时执行算法 18.1 的结果。然后我们从结果页面中提取地址和年龄。图 18.12 是我们在溯源知识库中为每位患者收集的属性列表。\n\
  \n![图 18.10 部分页面 – Yellowpage.com。](img/fig18_10.jpg)\n\n图 18.10 部分页面 – [Yellowpage.com](http://Yellowpage.com)。\n\
  \n![图 18.11 部分页面 – Whitepage.com。](img/fig18_11.jpg)\n\n图 18.11 部分页面 – [Whitepage.com](http://Whitepage.com)。\n\
  \n![图 18.12 患者属性。](img/fig18_12.jpg)\n\n图 18.12 患者属性。\n\n#### 18.7.2.2 医生生成器\n\n\
  医生生成器提取信息作为医生的属性值。我们通过将基础 URI 的值替换为基础 `rateMd.com` 来修改算法 18.1 的第 1 行。图 18.13、18.14\
  \ 和 18.15 分别显示了搜索医生的用户界面和结果。\n\n![图 18.13 部分页面 – ratemd.com。](img/fig18_13.jpg)\n\
  \n图 18.13 部分页面 – [ratemd.com](http://ratemd.com)。\n\n![图 18.14 单个结果页面（从 ratemd.com\
  \ 获得）。](img/fig18_14.jpg)\n\n图 18.14 单个结果页面（从 [ratemd.com](http://ratemd.com)) 获得。\n\
  \n![图 18.15 多结果页面 – ratemd.com。](img/fig18_15.jpg)\n\n图 18.15 多结果页面 – [ratemd.com](http://ratemd.com)。\n\
  \n#### 18.7.2.3 医院生成器\n\n我们还从 `yellowpages.com` 网站生成医院信息。图 18.16 显示了搜索医院返回的结果。图\
  \ 18.17 是我们在溯源知识库中为每位医生提取的属性列表。\n\n![图 18.16 部分页面（医院）– yellowpages.com。](img/fig18_16.jpg)\n\
  \n图 18.16 部分页面（医院）– [yellowpages.com](http://yellowpages.com)。\n\n![图 18.17 医生属性。](img/fig18_17.jpg)\n\
  \n图 18.17 医生属性。\n\n#### 18.7.3 杂项生成器\n\n该模块使用 `www.webMD.com` 来确定疾病、药物、检查和治疗之间的关系。因此，这使我们能够将这些实体之间的语义关联添加到我们的知识库中。由于这些关系是任何用户也可获取的背景信息，我们构建了规则，在披露溯源信息时将这些语义关系纳入考量。\n\
  \n#### 18.7.4 工作流生成器\n\n我们构建了一组标准工作流，这些工作流取自现有程序（例如 `mercyhealthcom`）。由于这些程序免费可用，我们构建规则以保护生成的工作流中的某些敏感组件。此外，这些工作流中实体之间的关系可以是显式的，也可以是隐式的。因此，我们的推理控制器利用策略和推理规则的混合来保护这些工作流中的信息。\n\
  \n#### 18.7.5 标注工作流\n\n我们使用背景生成器产生的数据来标注我们的工作流。因此，患者属性之间的关联是从 `www.yellowpages.com`\
  \ 和 `www.whitepages.com` 收集的。同样，医院和医生的属性实际上是从 `www.yellowpages.com` 和 `www.ratemd.com`\
  \ 收集的。\n\n#### 18.7.6 生成工作流\n\n如前所述，在我们的玩具医院示例中，为每位患者发起更新患者记录的工作流。记录的溯源是我们在系统中假设的唯一机密数据。其目的是给查询用户一个机会，去猜测与记录相关的患者疾病、药物或检查。溯源带来的挑战比传统数据更大。控制器不仅要预测涉及用户先验知识的推理，还要考虑数据项之间因果关系以及溯源实体相关的推理（算法\
  \ 18.2）。\n\n#### 18.7.7 数据库中的不完整信息\n\n我们从各种网页生成数据，每个网页为知识库贡献了一部分。这代表了我们的知识库包含部分或不完整信息的一个典型案例。\n\
  \n不完整数据库由一组约束和一个部分数据库实例定义。在不完整数据库上回答结合查询是一项重要的计算任务，它是信息集成、数据交换和数据仓储等许多问题的核心。关系数据库上部分信息的一个常见例子是视图。视图可以被定义为隐藏底层数据库中的重要数据，从而限制用户的访问。这通常是为了满足某些约束而进行的；例如，财务部门的员工可以查看会计记录，但不能查看人力资源记录。给定一个查询和一个不完整数据库，任务是计算确定答案的集合。确定答案是在符合部分实例并满足约束的每个数据库实例中都满足查询的元组。在一般约束下回答查询是不可判定的。因此，通常会限制所考虑的约束语言的表达能力，以实现可判定性。数据库中不完整信息的一个类比是\
  \ OWL 本体。在 OWL 本体中，TBox 可以被视为包含约束集合的概念模式，而 ABox 则可以被视为模式的某些部分实例。\n\n不完整数据库具有一项重要特性，推理控制器在回答\
  \ RDF 数据库上的查询时可以利用该特性。当查询返回否定响应时，用户必须判断该查询是试图访问机密信息，还是该查询在 RDF 数据库中并不蕴含。\n\n## 18.8\
  \ 用例：医疗示例\n\n在本节中，我们提供溯源查询的示例。这些查询可用于识别策略的资源或识别用户查询的答案。\n\n\n\n\n\n图 18.18 中的溯源图展示了一个工作流，该工作流更新了一位在医院经历三个医疗阶段的患者的虚构记录。在第一阶段，医生对患者进行了检查。检查期间，医生查阅了患者记录中的病史\
  \ `med:Doc1_1`，并执行了记录患者笔记的任务。检查结束时，医生更新了患者记录，生成了一个更新版本 `med:Doc1_2`。在第二阶段，应医生要求，患者返回进行随访。在此次就诊中，医生查阅患者记录以回顾病史，随后对患者进行了一系列检查。此次就诊结束时，医生再次更新患者记录，生成了更新版本\
  \ `med:Doc1_3`。在第三阶段，患者返回接受心脏手术。此手术由患者主治医师下令，由住院医师实施。手术开始前，主治医师和外科医生均对患者记录进行了仔细审查。手术过程中，外科医生执行了记录心脏手术各阶段结果的任务。手术结束时，外科医生更新了患者记录，生成了更新版本\
  \ `med:Doc1_4`。\n\n![图 18.18 溯源图。](img/fig18_18.jpg)\n\n图 18.18 溯源图。\n\n我们假设医院有一套标准程序，管辖医院提供的每一项医疗服务。因此，每位需要使用医疗服务的患者都必须经历这套程序。我们在图\
  \ 18.18 中使用一组固定的符号来表示溯源图中的实体，例如：\n\n`<med:Checkup_n_1>`\n\n其中“n”表示在医院接受特定程序的特定患者。因此，`n\
  \ = 1` 标识 ID 为 1 的患者，`n = 2` 标识 ID 为 2 的患者，依此类推。每个过程、代理和工件后缀中的较大数字表示该特定溯源实体在医疗程序的后期阶段被使用。在实践中，“n”将用实际患者\
  \ ID 实例化；这将为 ID = 1 的患者在第 1 阶段产生以下 RDF 三元组集合：\n\n```\n<med:Checkup_1_1><opm:WasControlledBy><med:Physician_1_1>\n\
  <med:Checkup_1_1><opm:Used><med:Doc_1_1>\n<med:Doc_1_2><opm:WasDerivedFrom><med:Doc_1_1>\n\
  <med:Doc_1_2><opm:WasGeneratedBy><med:Notes_1_1>\n<med:Notes_1_1><opm:WasControlledBy><med:Physician_1_1>\n\
  ```\n\n浅色阴影箭头上的 `sameAs` 注解旨在说明：对医生的引用意指在所有三个阶段中均为同一人。\n\n这并非溯源图的完整图景；它还将进一步用 RDF\
  \ 三元组进行注解，以指示位置、时间和其他上下文信息等。图中的每个实体将根据其类型拥有一组唯一的 RDF 注解。表 18.2 显示了每种溯源实体类型兼容的一组注解。将这些注解用于\
  \ ID = 1 的患者相关医生的 RDF 表示示例如下：\n\n表 18.2 RDF 注解\n\n| 实体 | RDF 注解 |\n| --- | --- |\n\
  | 过程 | PerformedOn |\n| 代理 | 姓名、性别、年龄和邮政编码 |\n| 工件 | UpdatedOn |\n\n```\n<med:Physician_1_1><med:Name>\
  \ \"John Smith\"\n<med:Physician_1_1><med:Sex> \"M\"\n<med:Physician_1_1><med:Age>\
  \ \"35\"\n<med:Physician_1_1><med:Zip> \"76543\"\n```\n\n### 18.8.1 工作流中的语义关联\n\n\
  我们识别出多种语义关联，例如：如果 X 是更新患者 Y 记录的心脏外科医生，则患者 Y 的程序和药物与心脏手术相关。这将允许查询用户在查询 Y、X 以及 Y 的溯源记录中\
  \ X 和 Y 位于同一路径上的情况后，确定 Y 的疾病。\n\n## 18.9 实现约束\n\n约束通常是规则，但也可能包含附加条件。这些条件可能规定应用规则的情形（例如，某些时间或位置标准）。\n\
  \n我们的方法之一是使用正则表达式来编写约束。因此，我们可以通过正则表达式指定规则的左侧（LHS），以便在溯源图中存在某种模式时强制执行约束。我们研究了以下约束处理方法。我们将讨论查询修改过程。\n\
  \n*   DL 概念\n*   查询实现\n*   SWRL 规则\n*   图文法/图重写\n\n### 18.9.1 用于强制执行约束的查询修改\n\n\
  我们提出了两种修改 SPARQL 查询中图模式的方法。这些方法使用 SPARQL 过滤器和属性函数。为了根据安全类型（或标签）确定三元组的类型，推理引擎将使用领域本体来确定三元组主语或对象中找到的每个数据项的概念，或\
  \ TBox 中找到的属性的分类。然而，当三元组模式仅包含变量和字面量时，此方法会失效。我们假设图模式中任何三元组的主语、谓语或宾语均为 URI。可以为三元组宾语中出现的各种字面量的安全类型确定做出特殊规定；例如，识别九位数的\
  \ SSN 或十六位数的信用卡号。\n\n#### 18.9.1.1 查询过滤器\n\n图模式匹配产生一个解序列，其中每个解包含一组变量到 RDF 术语的绑定。SPARQL\
  \ FILTER 将解限制为使过滤器表达式评估为 TRUE 的那些。SPARQL 规范 [PRUD2006] 提供了修改图模式的不同技术。\n\n*   **SPARQL\
  \ FILTER 可使用 regex 限制字符串的值。**\n\n    ```\n    PREFIX dc: <http://purl.org/dc/elements/1.1/>\n\
  \    SELECT ?title\n    WHERE { ?x dc:title ?title\n    FILTER regex(?title, \"\
  ^SPARQL\")\n    }\n    ```\n\n*   **SPARQL FILTER 可限制算术表达式。**\n\n    ```\n    PREFIX\
  \ dc: <http://purl.org/dc/elements/1.1/>\n    PREFIX ns: <http://example.org/ns#>\n\
  \    SELECT ?title ?price\n    WHERE { ?x ns:price ?price.\n    FILTER (?price <\
  \ 30.5)\n    ?x dc:title ?title. }\n    ```\n\n*   可选模式匹配中的约束，例如。\n\n    ```\n \
  \   PREFIX dc: <http://purl.org/dc/elements/1.1/>\n    PREFIX ns: <http://example.org/ns#>\n\
  \    SELECT ?title ?price\n    WHERE { ?x dc:title ?title.\n    OPTIONAL { ?x ns:price\
  \ ?price. FILTER (?price < 30) }\n    }\n    ```\n\n## 18.10 下一代推理控制器\n\n社交媒体数据以及高度链接的数据均可表示为\
  \ RDF 图。因此，前几节提出的思想适用于此类社交图。安全策略也可表示为 RDF 或 SWRL 等语言。这些策略包括访问控制策略和信息共享策略。例如，如果一个人透露了其宗教信仰，则其政治倾向会被推断出来。因此，如果一个人想保持其政治倾向私密，则不应在其社交媒体网站上发布其宗教信仰。\n\
  \n\n\n\n我们可以在第 15 章中描述的访问控制架构之上构建推理控制器。图 18.19 展示了这样一个推理控制器。推理引擎本质上是控制访问并通过推理处理未授权访问的策略引擎。社交媒体数据表示为\
  \ RDF 图，而策略和知识可以使用 SWRL、RDF 和 OWL 的组合来指定。当用户发起查询（例如使用 SPARQL）时，策略引擎会检查知识库（可能包含溯源数据、策略）并修改查询。修改后的查询针对基于\
  \ RDF 的社交媒体数据库执行。前几节中的大部分讨论以及推理控制器的实现均适用于基于 RDF 的社交媒体数据。\n\n![图 18.19 下一代推理控制器。](img/fig18_19.jpg)\n\
  \n图 18.19 下一代推理控制器。\n\n最近，用于表示和推理知识的知识图谱概念变得非常流行。正如[FENS2020]所述：“自 Google 首创以来，知识图谱已成为一个近期无处不在使用的术语，但尚无公认的明确定义。”知识图谱本质上是从\
  \ 20 世纪 70 年代和 80 年代的语义网络和概念图演变而来的。它们将语义网络和概念图与语义网和本体方面的最新成果相结合。这些知识图谱捕获知识，并利用内置的各种推理技术对知识进行推理。\n\
  \n就安全性和隐私而言，挑战在于：能否聚合不同的知识图谱并推断出高度机密或私密信息？我们在 20 世纪 90 年代初利用语义网络和概念图进行了大量研究并开发了工具来解决这一问题[THUR1991]。也就是说，我们使用这些网络和图来表示知识，随后应用推理技术来确定是否可以推断出敏感信息。当时我们的大部分工作集中在逻辑推理上，例如如果\
  \ A 蕴含 B，B 蕴含 C，且 C 是敏感的，那么 A 是否应该敏感？如果知识分类不正确，则旨在通知应用设计师可能存在通过推理导致的潜在安全违规。\n\n\
  虽然 20 世纪 70 年代和 80 年代的表示和推理技术有限，但随着语义网和本体的出现，加上传统的知识表示和推理方案（如语义网络），造就了强大的知识图谱。因此，我们的挑战是表示知识并对其进行推理，以确定是否可能存在安全和隐私违规。更多细节见[THUR2020]。\n\
  \n## 18.11 总结与展望\n\n在本章中，我们首先描述了一个基于语义网溯源图运行的推理控制器的设计，该控制器保护重要的溯源信息免受未授权用户的访问。由于第\
  \ 19 章和第 20 章中讨论的社交网络也由语义网技术表示，我们开发的技术适用于此类社交媒体数据。关于构建推理控制器以保护数据机密性的早期工作在 20 世纪\
  \ 80 年代末和 90 年代初有所描述；然而，这些工作主要集中在多级安全数据库领域，且支持的推理能力有限。通过使用语义网技术，我们目前的工作在更复杂的推理和策略表示技术方面较先前的工作有了实质性改进。我们使用\
  \ RDF 作为数据模型，因为它支持具有不同数据模式的多数据库的互操作性。此外，我们用语义网规则和约束来表达策略和规则，并使用语义网软件工具对数据项及其之间的关系进行分类。\n\
  \n接下来，我们讨论了通过查询修改进行推理控制。查询修改也称为查询重写。在这种方法中，推理控制器接受用户查询，并根据策略修改查询，向查询返回清洗后的结果。我们提供了关于关系数据查询修改的背景信息，以及修改\
  \ SPARQL 查询的各个方面。虽然从关系查询转向 SPARQL 查询是迈向下一代推理控制器处理推理的第一步，但我们的最终目标是使用采用机器学习方法的复杂基于逻辑的推理器来处理查询。这样我们就能处理比本书讨论的更多推理策略。如前所述，随着推理策略变得更加复杂，我们需要牢记查询处理技术的可扩展性。也就是说，虽然数据管理系统应仅发布授权的响应，但用户将要求满足性能需求。因此，开发可扩展的推理控制器是我们的主要目标之一。\n\
  \n在本章中，我们描述了用于数据溯源的推理控制器的实现。推理控制器采用模块化方法构建，因此非常灵活，大多数模块均可由另一个应用模块扩展或替换。例如，应用用户可以替换处理高级策略解析为低级策略对象的策略解析器模块。这种替换将允许应用用户继续使用其业务策略，而独立于我们的溯源推理控制器软件实现。本质上，我们在实现推理控制器时遵循了“即插即用”方法。我们在实现中尽可能多地使用了开源产品。我们为溯源数据推理控制实现的技术可应用于使用语义网技术表示的社交媒体数据。\n\
  \n这种实现是针对下一代推理控制器的首创。我们已从 20 世纪 80 年代和 90 年代的关系数据库方法迁移到基于语义网的方法。语义网技术的推理能力使这种方法更加强大。我们的下一步是将此推理控制器适配为用\
  \ RDF 表示的知识图谱和社交图谱。我们还在研究使用机器学习技术的更强大推理策略。此外，我们需要考虑溯源数据未授权泄露的风险。另外，我们可以将推理策略建模为博弈，其中参与者是推理控制器和系统用户（也可能是对手）。也就是说，双方进行博弈，每方的目标都是获胜。本质上，推理控制器会试图防止任何未授权信息落入对手手中，而对手将试图从系统中提取尽可能多的信息。\n\
