  \n\n\n\n### 11.5.3 真实数据集上的实验\n\n从表 11.1 可以看出，对抗性 RVM 算法的错误率比其非对抗性版本、SVM 和单类 SVM\
  \ 低得多。这种改进归因于其对决策边界的调整以应对对抗性攻击。调整包括向负数据点方向的平移和弯曲，如 图 11.4 所示。\n\n![图 11.4 调整决策边界以考虑潜在的对抗性攻击。图中的实线说明了决策边界。(a)\
  \ 决策边界平移；(b) 决策边界弯曲。](img/fig11_4.jpg)\n\n图 11.4 调整决策边界以考虑潜在的对抗性攻击。图中的实线说明了决策边界。(a)\
  \ 决策边界平移；(b) 决策边界弯曲。\n\n在构建集成时，我们使用正负不确定性比率来决定哪个假设被纳入集成。比率越高，分类器在将实例预测为正例时就越自信。请注意，这是必要的，因为我们在搜索核参数时采用了非同步更新方法。这种方法不如开销更大的同步更新技术可靠。然而，我们获得了速度，并且只需很少的额外工作就能获得准确性。我们现在说明不确定性测试中使用的\
  \ `ρ` 值的影响。较小的 `ρ` 值意味着对负预测有更多的偏见，而较大的值偏见较小。\n\n图 11.5 说明了 `ρ` 值对使用 AD-RVM 的分类错误的影响。`y`\
  \ 轴显示了 AD-RVM 与未经对抗性处理的 RVM 相比的错误率改进。可以观察到，`ρ` 值越低，改进越大。然而，如果 `ρ` 值设置得太小，最终假阳性将开始增加，从而违背对抗性学习的初衷。`ρ`\
  \ 值的下界需要仔细设定，特别是当正负数据点密集地分布在决策边界附近时。\n\n![图 11.5 ρ (rho) 值的影响。较小的 ρ 值对负类成员资格具有更高的固有偏见。](img/fig11_5.jpg)\n\
  \n图 11.5 `ρ` (rho) 值的影响。较小的 `ρ` 值对负类成员资格具有更高的固有偏见。\n\n我们还测试了训练数据不干净的情况。同样，AD-RVM\
  \ 对对抗性攻击显然更具鲁棒性，尽管其优势变得不那么明显。由于篇幅限制，我们在此不报告结果。\n\n图 11.6 说明了从损坏的训练数据集中学到的决策边界。图\
  \ 11.6(a) 显示了决策边界如何被迫在测试数据上 `f[attack]` = 0.1 时大幅向负侧移动。`ρ` 值设置为 0.67。如图 11.6(b)\
  \ 所示，`ρ` = 0.76 时学到的决策边界稍好一些。这个实验提醒我们设定 `ρ` 值下界的重要性。当 `ρ` 值太小时，输出中出现假阳性的可能性会更大。在实践中，我们建议\
  \ `ρ` 值不大于 0.5。然而，在对抗性攻击可能非常激进的任何领域，较小的 `ρ` 值更受青睐。\n\n![图 11.6 调整决策边界以考虑潜在的对抗性攻击。图中的实线说明了决策边界。(a)\
  \ Rho 值 = 0.67；(b) Rho 值 = 0.76。](img/fig11_6.jpg)\n\n图 11.6 调整决策边界以考虑潜在的对抗性攻击。图中的实线说明了决策边界。(a)\
  \ Rho 值 = 0.67；(b) Rho 值 = 0.76。\n\n与其他任何基于核的方法一样，选择初始 `η` 值很重要。较小的 `η` 值可能导致学习模型对训练样本过度敏感。较大的\
  \ `η` 值可能导致严重的过拟合。从负面来看，这可能需要交叉验证，增加额外的计算成本。从正面来看，不合适的初始 `η` 值往往会迅速导致非正定特征向量的退化，从而导致求解器过早终止。如果发生这种情况，通常意味着需要更大的\
  \ `η` 值。\n\n### 11.5.3 真实数据集上的实验\n\n我们实验中使用的两个真实数据集是：来自 UCI 数据仓库的 `spam base` ([`archive.ics.uci.edu/ml`](http://archive.ics.uci.edu/ml))，以及来自\
