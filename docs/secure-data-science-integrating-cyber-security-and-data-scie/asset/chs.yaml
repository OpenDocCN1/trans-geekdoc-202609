  \n\n\n\n\n#### 对比实验：原始数据分布重构方法\n\n为进行对比，我们报告了使用原始数据分布重构方法获得的数据挖掘结果。我们将两种著名的重构技术应用于扰动数据集。\n\
  \n第一种技术是 Agrawal 等人提出的基于贝叶斯推断估计（BE）的方法 [AGRA2000]。第二种技术是 Kargupta 等人提出的基于主成分分析（PCA）的方法\
  \ [KARG2003]。算法细节请参考原始文献。我们在五个数据集上应用了这两种技术：首先重构原始分布，然后利用该估计分布构建数据挖掘模型。\n\n我们执行了三种不同的测试来比较数据挖掘准确率：\n\
  1. 在重构的测试数据上测试分类器；\n2. 在原始测试数据上测试分类器；\n3. 在扰动测试数据上测试分类器。\n\n数据挖掘模型的预测准确率如 表 12.5\
  \ 和 表 12.6 所示。作为对比，表 12.4 显示了直接从扰动数据集获得的数据挖掘准确率。\n\n#### 表 12.4 直接在 10k 扰动训练数据集上应用数据挖掘技术的准确率\n\
