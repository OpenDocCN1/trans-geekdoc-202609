  \ 2001, pp. 473–478.\n\n# 4 大数据、云、语义 Web 和社交网络技术\n\nDOI: [10.1201/9781003081845-6](https://doi.org/10.1201/9781003081845-6)\n\
  \n## 4.1 简介\n\n第 2 章和第 3 章讨论了数据安全和隐私、用于网络安全的数据挖掘以及针对数据挖掘的攻击等概念。这些支撑技术是本书讨论概念的基础技术之一。例如，第\
  \ II 部分描述了用于网络安全的数据科学，而第 III 部分描述了安全和隐私感知的数据科学。除了数据安全和隐私以及数据挖掘和安全之外，大数据技术、云和语义 Web\
  \ 也是我们在安全数据科学工作中利用的一些基础技术。本章讨论这些基础技术。\n\n十多年来，涌现出许多大数据管理和分析系统。此外，各种云服务提供商也实施了大数据解决方案。另外，大数据系统的基础设施/平台也已开发完成。大数据系统中值得注意的包括\
  \ MongoDB、Google 的 BigQuery 和 Apache HIVE。大数据解决方案由包括 Amazon、IBM、Google 和 Microsoft\
  \ 在内的云提供商开发。此外，还基于 Apache 的 Hadoop、Spark 和 Storm 等产品开发了基础设施/平台。\n\n选择要讨论的产品是一项艰巨的任务。这是因为几乎每个数据库供应商以及云计算供应商连同分析工具供应商现在都在将其产品作为大数据解决方案进行推销。当我们将所有供应商提供的产品结合起来，并包括开源产品时，则有数百种产品可供讨论。因此，我们选择了最熟悉的产品，通过在我们讲授的课程中讨论这些产品和/或在实验中使用它们。换句话说，我们仅选择了最熟悉并在工作中研究过的服务提供商、产品和框架。描述所有的服务提供商、产品和框架超出了本书的范围。此外，我们在本书中不为任何产品背书。\n\
  \n我们利用云平台管理和分析大型数据集。我们将在全书中看到，云计算是管理大型数据集的核心。云计算已成为面向服务计算的强大计算范式。许多计算服务正被外包给云。此类基于云的服务可用于托管各种网络安全应用，如内部威胁检测和身份管理。Google\
  \ 现已推出 MapReduce 框架，用于在通用硬件上处理大量数据。Apache 的 Hadoop 分布式文件系统 (HDFS) 正成为云计算的优越软件组件，并与\
  \ MapReduce 等集成部件相结合 \\[DEAN2004, GHEM2003, HDFS\\]。HP 的 Open Cirrus Testbed 等云正在利用\
  \ HDFS。这反过来又导致了许多拥有海量数据需要共享和管理的社交网络站点的出现。例如，我们可能想要对多年的股票市场数据进行统计分析以揭示模式，或基于数年的天气和相关数据构建可靠的天气模型。为了处理分布在许多站点（即节点）上的此类海量数据，需要可扩展的硬件和软件组件。云计算模型应运而生，旨在应对\
  \ Web 连接设备的爆炸式增长，并处理海量数据。其特征是大规模可扩展性和新的互联网驱动经济。\n\n另一个用于各种应用的概念是语义 Web 的概念。语义 Web\
  \ 本质上是一组用于生成机器可理解网页的技术的集合。这些技术也可用于表示任何类型的数据，包括大数据的模式和恶意软件数据。我们基于语义 Web 技术表示的数据进行了一些分析和安全调查。特别是，我们使用语义\
  \ Web 技术表示社交网络，随后应用我们的分析技术提取有用的关系。我们还研究了使用语义 Web 技术表示的社交网络的安全性和隐私。\n\n本章的组织结构如下。第\
  \ 4.2 节讨论大数据管理和分析工具。第 4.3 节讨论云计算概念。第 4.4 节讨论语义 Web 概念。第 4.4 节讨论分析和保护社交网络。第 4.6 节结束本章。图\
  \ 4.1 说明了本章讨论的概念。本章讨论的工具和技术的更多细节见于 \\[THUR2007\\], \\[THUR2013\\], 和 \\[THUR2017\\\
  ]。\n\n![图 4.1 大数据、云计算和语义 Web 技术。](img/fig4_1.jpg)\n\n图 4.1 大数据、云计算和语义 Web 技术。\n\n\
  ## 4.2 大数据管理和分析工具及技术\n\n我们讨论各类大数据管理和分析工具，包括基础设施工具和大数据管理及分析工具。所讨论的工具如图 4.2 所示 \\\
  [THUS2010\\]。\n\n![图 4.2 大数据工具。](img/fig4_2.jpg)\n\n\n\n\n# 4.2 大数据工具\n\n### 4.2.1\
  \ 托管大数据系统的基础设施工具\n\n在本节中，我们将讨论托管各种大数据系统的各种基础设施产品。它们包括：Apache 的 `Hadoop`、`Spark`、`Storm`、`Flink`\
  \ 和 `Kafka` 以及 `MapReduce` 编程模型 [WHIT2015]。这些基础设施工具也可以被视为云计算工具。\n\n#### 4.2.1.1\
  \ Apache Hadoop\n\n`Hadoop` 是一个用于处理大量数据的开源分布式框架。它使用我们接下来将讨论的 `MapReduce` 编程模型。其存储系统称为\
  \ Hadoop 分布式文件系统（`HDFS`）。它托管在机器集群上。一个文件由多个块组成，文件的块会被复制以保证可用性。它支持数据的并行处理以提高性能。`JobTracker`\
  \ 是 `Hadoop` 的一部分，用于跟踪 `MapReduce` 作业。这些作业由客户端应用程序提交。大多数大数据系统以及云应用程序都托管在 `Hadoop`\
  \ 上。更多 `Hadoop` 详情请参见 [HDFS]。\n\n#### 4.2.1.2 MapReduce\n\n`MapReduce` 是一种编程模型及其相关实现，它接收客户端请求并将其转换为\
  \ `MapReduce` 作业。然后这些作业由 `Hadoop` 执行。该编程模型的主要特性是作业的生成。`MapReduce` 模型有两个组件：(i) `Map`\
  \ 和 (ii) `Reduce`。正如 [MAPR] 所述，“一个 `MapReduce` 作业通常会将输入数据集分割成独立的块，这些块由 map 任务以完全并行的方式处理。框架对\
  \ map 的输出进行排序，然后将其输入给 reduce 任务。通常，作业的输入和输出都存储在文件系统中。框架负责任务调度、监控以及重新执行失败的任务。” `MapReduce`\
  \ 模型的更多细节见 [MAPR]。\n\n#### 4.2.1.3 Apache Spark\n\n`Apache Spark` 是一个用于处理海量数据的开源分布式计算框架。应用程序员通过一个接口使用\
  \ `Spark`，该接口包含一个称为弹性分布式数据集（`RDD`）的数据结构。`Spark` 的开发旨在克服 `MapReduce` 编程模型的局限性。`Spark`\
  \ 的 `RDD` 数据结构提供了对分布式共享内存的支持。得益于内存处理能力，`Spark` 提供了良好的性能。`Spark` [SPAR] 与各种基于 NoSQL\
  \ 的大数据系统（如 `Cassandra`）以及 Amazon 的云平台具有接口。`Spark` 通过 `Spark SQL` 支持 SQL 功能。\n\n\
  #### 4.2.1.4 Apache Pig\n\n`Apache Pig` 是一个用于分析和处理大型数据集的脚本平台。`Apache Pig` 使 `Hadoop`\
  \ 用户能够使用一种称为 `Pig Latin` 的简单脚本语言编写复杂的 `MapReduce` 转换。`Pig` 将 `Pig Latin` 脚本转换为 `MapReduce`\
  \ 作业。然后这些 `MapReduce` 作业由 `Hadoop` 执行，处理存储在 `HDFS` 中的数据。`Pig Latin` 编程类似于指定查询执行计划。也就是说，`Pig\
  \ Latin` 脚本可被视为执行计划。这使得程序员更容易完成任务。更多关于 `Pig` 的详情见 [PIG]。\n\n#### 4.2.1.5 Apache\
  \ Storm\n\n`Apache Storm` 是一个用于处理海量数据的开源分布式实时计算系统。`Storm` 本质上是一个用于处理流式数据和实时分析的实时框架。它可以与\
  \ `HDFS` 集成。它提供可扩展性、可靠性和容错性等特性。`Storm` 的最新版本支持流式 SQL、预测建模以及与 `Kafka` 等系统的集成。总之，`Storm`\
  \ 用于实时处理，而 `Hadoop` 用于批处理。更多关于 `Storm` 的详情见 [STOR]。\n\n#### 4.2.1.6 Apache Flink\n\
  \n`Flink` 是一个开源的可扩展流处理框架。正如 [FLIN] 所述，`Flink` 具有以下特性：“(i) 即使在数据乱序或迟到的情况下也能提供准确的结果；(ii)\
  \ 有状态且容错，能在保持精确一次应用状态的同时无缝从故障中恢复；(iii) 在大规模下表现优异，可在数千个节点上运行，具有极佳的吞吐量和延迟特性。” `Flink`\
  \ 本质上是一个用 `Scala` 和 `Java` 实现的分布式数据流引擎。它以并行和流水线模式执行程序。它支持 `Java`、`Python` 和 `SQL`\
  \ 编程环境。虽然它没有自己的数据存储，但它与 `HDFS`、`Kafka` 和 `Cassandra` 等系统集成。\n\n#### 4.2.1.7 Apache\
  \ Kafka\n\n`Kafka` 最初由 `LinkedIn` 开发，随后作为一个开源 Apache 项目进一步开发。它也是用 `Scala` 和 `Java`\
  \ 实现的，是一个分布式流处理系统。它具有高度可扩展性，能处理海量流式数据。其存储层基于发布/订阅消息队列架构。其设计本质上基于分布式事务日志。事务日志用于数据库系统中，以从事务故障中恢复。更多关于\
  \ `Kafka` 的详情见 [KAFK]。\n\n### 4.2.2 大数据管理与分析工具\n\n在本节中，我们将讨论各种大数据管理与分析（`BDMA`）系统和工具。我们首先提供基于\
  \ SQL 的大数据系统。它们是 `Apache Hive` 和 `Google BigQuery`。然后我们一般性地讨论 NoSQL（非 SQL）数据库。随后讨论示例\
  \ NoSQL 系统，如 `Google BigTable`、`HBase`、`MongoDB`、`Cassandra`、`CouchDB` 和 `Oracle\
  \ NoSQL Database`。随后将讨论两个用于大数据的数据挖掘/机器学习系统，它们是 `Weka` 和 `Apache Mahout`。\n\n####\
  \ 4.2.2.1 Apache Hive\n\n`Apache Hive` 是一个建立在 `Hadoop`/`MapReduce` 平台之上的开源类 SQL\
  \ 数据库/数据仓库。它最初由 `Facebook` 开发，用于存储与 `Facebook` 数据相关的信息。然而，后来它成为一个开源项目和 Apache 的商标。`Hive`\
  \ 管理超大型数据集，并在 `Hadoop`/`MapReduce` 存储模型之上运行。它提供一种类 SQL 查询语言，称为 `HiveQL`。也就是说，`Hive`\
  \ 支持类 SQL 查询。然而，由于 `Hadoop` 是用 `Java` 实现的，查询也用 `Java` 实现。这样，就不需要低级 `Java` API 来实现查询。`Hive`\
  \ 引擎本质上将 SQL 查询转换为 `MapReduce` 作业，然后由 `Hadoop` 执行。更多关于 `Apache Hive` 的详情见 [HIVE]。\n\
  \n#### 4.2.2.2 Google BigQuery\n\n`BigQuery` 本质上是一个管理 PB 级数据的数据仓库。它运行在 `Google`\
  \ 的基础设施上，能极快地处理 SQL 查询或进行分析。例如，TB 级数据可在几秒内访问，而 PB 级数据可在几分钟内访问。`BigQuery` 数据存储在不同类型的表中：原生表存储\
  \ `BigQuery` 数据，视图存储虚拟表，外部表存储外部数据。`BigQuery` 可以通过多种方式访问，如命令行工具、RESTful 接口或 Web 用户界面，以及客户端库（例如\
  \ `Java`、`.NET`、`Python`）。更多关于 `BigQuery` 的详情见 [BIGQ]。\n\n#### 4.2.2.3 NoSQL 数据库\n\
  \n\n\n\n##### NoSQL 数据库\n\nNoSQL 数据库是一个统称，本质上指非关系型数据库设计或面向 Web 的可扩展性。它被称为非关系型高性能数据库。NoSQL\
  \ 数据库的数据模型可能包括图、文档结构和键值对。可以认为，20 世纪 60 年代开发的数据库（如 IBM 的 IMS）以及基于网状数据模型的数据库属于 NoSQL\
  \ 数据库。然而，20 世纪 90 年代开发的其他面向对象数据模型为 21 世纪 2000 年代 NoSQL 数据库的发展铺平了道路。NoSQL 数据库与旧式的层次型、网状型和对象型数据库的不同之处在于，NoSQL\
  \ 数据库在设计时就考虑到了 Web 环境。也就是说，目标是在 Web 上快速访问海量数据。\n\n最流行的 NoSQL 数据库模型是键值对。虽然关系型数据库由一组关系组成，其中每个关系包含一组属性，这些属性被标记并包含在模式中。NoSQL\
  \ 数据库拥有包含两列的表：键和值。键可以是任何内容，例如人名或股票指数。然而，值可以是属性的集合，例如股票名称、股票价值以及其他信息，如是否购买该股票，如果购买，推荐的数量是多少。因此，无需执行多次连接即可检索与某只股票相关的所有信息。本节将讨论一些流行的\
  \ NoSQL 数据库（例如 MongoDB 和 HBase）。关于 NoSQL 数据库的详细讨论，请参阅 `[NOSQ]`。更多细节也见于 `[CATT2011]`。\n\
  \n#### 4.2.2.4 Google BigTable\n\nBigTable 是运行在 Google 文件系统 (GFS) 之上的早期 NoSQL 数据库之一。它现在作为云端服务提供。BigTable\
  \ 将行键、列和时间戳映射在一起，形成一个字节数组。也就是说，它本质上是一个基于键值对模型的 NoSQL 数据库。它被设计用于处理 PB 级数据。当数据量过大时，它会使用压缩算法。BigTable\
  \ 中的每个表都有许多维度，并可能被划分为所谓的“片”以配合 GFS 工作。BigTable 被许多应用程序使用，包括 Google 的 YouTube、Google\
  \ Maps、Google Earth 和 Gmail。关于 BigTable 的更多细节见于 `[BIGT]`。\n\n#### 4.2.2.5 Apache\
  \ HBase\n\nHBase 是一个开源的非关系型分布式数据库，是为 Hadoop/MapReduce 平台开发的第一个表。也就是说，HBase 是一个基于面向列的键值数据存储模型的\
  \ NoSQL 数据库。它用 Java 实现。查询作为 MapReduce 作业执行。它在一定程度上类似于 Google 的 BigTable，并对内存存储使用压缩。HBase\
  \ 具有可扩展性，可处理数十亿行和数百万列。它还集成了不同格式的多数据存储，并便于稀疏数据的存储。关于 HBase 的更多细节见于 `[HBAS]`。\n\n\
  #### 4.2.2.6 MongoDB\n\nMongoDB 是一种 NoSQL 数据库。它是一个跨平台的开源分布式数据库。它被用于存储和管理文档。也就是说，它主要是一个面向文档的数据库。文档以类\
  \ JSON 格式存储 `[CROC2006]`。它支持字段查询和范围查询，以及基于正则表达式的搜索。它支持数据复制和负载均衡，后者通过水平扩展实现。数据的批处理以及聚合操作可通过\
  \ MapReduce 进行。MongoDB 的更多细节见于 `[MONG]` 和 `[CHOD2010]`。\n\n#### 4.2.2.7 Apache Cassandra\n\
  \nCassandra 是一种 NoSQL 分布式数据库 `[HEWI2010]`。它最初在 Facebook 开发，用于支持 Facebook 应用程序，随后成为\
  \ Apache 基金会的开源软件项目。其设计初衷是消除单点故障。它支持跨越多数据中心的集群。集群中的所有节点执行相同的功能。因此，实际上不存在单点故障。它支持复制，具有高度可扩展性。它还具备容错能力，并与\
  \ Hadoop 集成，支持 MapReduce。Cassandra 支持的查询语言是 Cassandra 查询语言 (CQL)，这是 SQL 的一种替代方案。也可以通过\
  \ Java、C++ 和 Python 等程序访问。Cassandra 的更多细节见于 `[CASS]`。\n\n#### 4.2.2.8 Apache CouchDB\n\
  \n正如 `[COUC]` 所述，CouchDB 通过实现 Couch 复制协议来访问数据。该协议已被从集群到 Web 再到移动电话的众多平台实现。它是一个 NoSQL\
  \ 数据库，用一种名为 Erlang 的并发语言实现。它使用 JavaScript 对象表示法 (JSON) 存储数据，并使用 JavaScript 作为查询语言。关于\
  \ CouchDB 的更多细节见于 `[COUC]` 和 `[ANDE2010]`。\n\n#### 4.2.2.9 Oracle NoSQL 数据库\n\n\
  Oracle 是主要的关系型数据库供应商之一，自 20 世纪 70 年代末以来一直销售关系型数据库产品。他们在 20 世纪 90 年代提供了对象关系型数据库产品，最近推出了\
  \ NoSQL 数据库。该 NoSQL 数据库基于键值对模型。每行有一个唯一键，并具有一个任意长度的值，由应用程序解释。Oracle NoSQL 数据库是一个无共享系统，分布在集群中所谓的多个分片上。数据在分片内的存储节点间复制以保证可用性。数据可通过\
  \ Java、C、Python 编写的程序以及 RESTful Web 服务访问。关于 Oracle NoSQL 数据库的更多细节见于 `[ORAC]`。\n\n\
  #### 4.2.2.10 Weka\n\nWeka 是一个开源软件产品，实现了一系列数据挖掘技术，从关联规则挖掘到分类再到聚类。它由新西兰的怀卡托大学设计、开发和维护。Weka\
  \ 3 是 Weka 的一个版本，可对大数据集进行操作。虽然早期版本的 Weka 需要将整个数据集加载到内存中以执行分类等操作，但大数据版本执行增量加载和分类。Weka\
  \ 3 还支持带有 Map 和 Reduce 任务的分布式数据挖掘。它还为 Hadoop 和 Spark 提供了封装器。关于 Weka 的更多细节见于 `[WEKA]`。\n\
  \n#### 4.2.2.11 Apache Mahout\n\nApache Mahout 提供了一个环境，用于实现一系列机器学习系统。这些系统具有可扩展性，并构建在\
  \ Hadoop 之上。机器学习算法包括分类和聚类。机器学习算法的指令被转换为 MapReduce 作业并在 Hadoop 上执行。Mahout 提供 Java\
  \ 库，用于实现机器学习算法中涉及的数学和统计技术。目标是让机器学习算法在超大数据集上运行。总之，正如 `[MAHO]` 所述，Mahout 提供以下三大功能：“(i)\
  \ 一个简单且可扩展的编程环境和框架，用于构建可扩展算法；(ii) 适用于 Scala + Apache Spark、H2O 和 Apache Flink 的各种预制算法；(iii)\
  \ Samsara，一个具有类 R 语法的向量数学实验环境，可大规模运行。” 关于 Mahout 的更多细节见于 `[MAHO]`。\n\n## 4.3 云计算\n\
  \n### 4.3.1 云计算模型\n\n\n\n\n### 4.3.1 云部署与服务模型\n\n正如[[CLOUD]](#ch04.xhtml#ref4_21)所述，云计算以服务的形式提供计算，而在传统计算中，计算是以产品的形式提供的。因此，用户根据按需付费模型为服务付费。云提供的服务可能包括硬件服务、系统服务、数据服务和存储服务。云用户无需知道软件和数据位于何处；也就是说，云提供的软件和数据服务对用户是透明的。NIST\
  \ 将云计算定义为[[NIST]](#ch04.xhtml#ref4_51)：\n\n> 云计算是一种模型，用于实现普遍、便捷、按需的网络访问，进入可配置的计算资源共享池（例如网络、服务器、存储、应用和服务），这些资源能够以最少的管理工作量或服务提供商交互迅速地供给和释放。\n\
  \n云模型由多种部署模型和服务模型组成。下文将描述这些模型。\n\n#### 4.3.1.1 云部署模型\n\n云计算有多种部署模型。这些包括公有云、社区云、混合云和私有云。在公有云中，服务提供商通常通过万维网（WWW）提供可供公众访问的服务。此类云可能提供免费服务或按需付费服务。在社区云中，一组组织聚在一起开发云。这些组织可能有共同目标，以提供安全性和容错性等特性。成本由这些组织分担。此外，云可能由这些组织托管，也可能由第三方托管。私有云是专门为某个组织开发的云基础设施。这可以由该组织托管，也可以由第三方托管。混合云由公有云和私有云的组合构成。这样，在混合云中，组织可将私有云用于高度敏感的服务，而将公有云用于不太敏感的服务，并利用万维网（WWW）提供的优势。Kantarcioglu\
  \ 及其同事指出，混合云是未来的部署模型[[KHAD2012a]](#ch04.xhtml#ref4_41)。图 4.3 展示了云部署模型。\n\n![图 4.3\
  \ 云部署模型。](img/fig4_3.jpg)\n\n图 4.3 云部署模型。\n\n#### 4.3.1.2 服务模型\n\n如前所述，云计算提供多种服务。这些包括基础设施即服务（IaaS）、平台即服务（PaaS）、软件即服务（SaaS）和数据即服务（DaaS）。在\
  \ IaaS 中，云为公众或组织提供一组硬件和网络供使用。用户安装操作系统和软件来运行应用程序。用户将根据其用于计算的资源利用情况进行计费。在 PaaS 中，云提供商将向用户提供系统软件，如操作系统和执行环境。用户将在云提供的硬件和软件基础设施上加载并运行应用程序。在\
  \ SaaS 中，云提供商将为用户提供应用程序以供运行。这些应用程序可能是计费应用、税务计算应用和销售工具。云用户通过云客户端访问这些应用程序。在 DaaS 的情况下，云向云用户提供数据。数据可能存储在由云用户访问的数据中心中。请注意，虽然\
  \ DaaS 过去用于表示桌面即服务，但最近它更多地表示数据即服务。图 4.4 展示了服务模型。\n\n![图 4.4 云服务模型。](img/fig4_4.jpg)\n\
  \n图 4.4 云服务模型。\n\n### 4.3.2 虚拟化\n\n虚拟化本质上意味着创建虚拟而非实际的事物。它可以是硬件、软件、内存和数据。关于计算领域的虚拟化概念已存在数十年。早在\
  \ 20 世纪 60 年代，虚拟内存的概念就已被引入。这种虚拟内存给应用程序一种错觉，即拥有连续的工作内存。开发了映射机制，将虚拟内存映射到实际物理内存。\n\n\
  硬件虚拟化是云计算中的一个基本概念。这本质上是在运行着操作系统的真实计算机上创建托管的虚拟机。这意味着，虽然实际机器可能运行着 Windows 操作系统，但通过虚拟化，它可以为用户提供一台\
  \ Linux 机器。实际机器称为宿主机，而虚拟机称为客户机。“虚拟机监视器”一词，也称为管理程序，是指在宿主计算机上运行虚拟机的软件。\n\n其他类型的虚拟化包括操作系统（OS）级虚拟化、存储虚拟化、数据虚拟化和数据库虚拟化。在操作系统级虚拟化中，在单个操作系统内创建多个虚拟环境。在存储虚拟化中，逻辑存储从物理存储中抽象出来。在数据虚拟化中，数据从底层数据库中抽象出来。在网络虚拟化中，创建虚拟网络。图\
  \ 4.5 展示了各种类型的虚拟化。\n\n![图 4.5 虚拟化类型。](img/fig4_5.jpg)\n\n图 4.5 虚拟化类型。\n\n如前所述，云计算的核心在于管理程序或虚拟机监视器的概念。硬件虚拟化技术允许多个操作系统（称为客户机）在宿主计算机上并发运行。这些多个操作系统共享虚拟化的硬件资源。管理程序并非新术语；它最早用于\
  \ 20 世纪 60 年代中期的 IBM 360/65 机器中。管理程序有不同类型；在一种类型中，管理程序运行在宿主硬件上并管理客户操作系统。流行的虚拟机 VMware\
  \ 和 XEN 都基于此模型。在另一种模型中，管理程序运行在传统操作系统环境中。虚拟机也被整合到嵌入式系统和移动电话中。嵌入式管理程序具有实时处理能力。虚拟化的一些细节见[[VIRT]](#ch04.xhtml#ref4_70)。\n\
  \n### 4.3.3 云存储与数据管理\n\n在云存储模型中，服务提供商在数据中心为客户存储海量数据。需要存储空间的人将从作为托管公司的服务提供商处租用存储。数据的实际位置对用户透明。呈现给用户的是虚拟化存储；存储管理器将虚拟存储与实际存储映射，并为客户管理数据资源。单个对象（例如客户的整个视频数据库）可能存储在多个位置。每个位置可能存储多个客户的对象。图\
  \ 4.6 展示了云存储管理。\n\n![图 4.6 云存储管理。](img/fig4_6.jpg)\n\n图 4.6 云存储管理。\n\n虚拟化云存储有许多优势。用户无需购买昂贵的存储设备。数据可放置在云中的任何位置。维护工作（如备份和恢复）由云提供。目标是让用户能快速访问云。然而，由于数据所有者无法完全控制其数据，因此在云中存储数据存在严重的安全顾虑。\n\
  \n\n\n\n#### 云数据库与语义 Web 技术\n\n#### 云数据库管理\n\n运行在云端的数据库称为云数据库管理器。利用云数据库管理器有多种方式。\n\
  \n**第一种模型**：用户需购买*虚拟机镜像*以在云端运行数据库，数据库随后在虚拟机上运行。\n\n**第二种模型**：数据库即服务模型；服务提供商维护数据库。用户使用数据库服务并为服务付费。例如\
  \ Amazon 关系型数据库服务（Amazon RDS），这是一种 SQL 数据库服务，具有 MySQL 接口 [AMAZ]。\n\n**第三种模型**：云提供商代表用户托管数据库。用户既可以使用云维护的数据库服务，也可以在云端运行自己的数据库。\n\
  \n云数据库必须优化其查询、存储和事务处理，以充分利用云提供的服务。图 4.7 展示了云数据管理。\n\n![图 4.7 云数据管理](img/fig4_7.jpg)\n\
  \n图 4.7 云数据管理\n\n### 4.3.4 云平台\n\n本节讨论云服务提供商如何支持大数据管理，重点介绍 Amazon DynamoDB、Microsoft\
  \ Cosmos DB，以及 IBM 和 Google 的云端大数据解决方案。\n\n#### 4.3.4.1 Amazon Web Services DynamoDB\n\
  \n`DynamoDB`是属于 Amazon Web Services (AWS)产品组合的 NoSQL 数据库。它同时支持文档模型和键值存储模型。高性能和高吞吐量是`DynamoDB`的目标。在存储方面，`DynamoDB`可根据应用需求动态扩展和收缩。它还拥有一个名为`Amazon\
  \ DynamoDB Accelerator` (DAX)的内存缓存，可为每秒百万级请求提供毫秒级响应。更多详情请参阅 [DYNA]。\n\n#### 4.3.4.2\
  \ Microsoft Azure Cosmos DB\n\n`Cosmos DB`是运行在 Microsoft 云平台`Azure`上的数据库。其设计初衷是可扩展性和高性能。它采用具有可用性复制的分布式模型。其可扩展架构支持多数据模型和多种编程语言。正如\
  \ [COSM] 所述：\n\n> Azure Cosmos DB 数据库引擎的核心类型系统基于原子-记录-序列 (ARS)。原子包含一小组原始类型（如字符串、布尔值、数字等）。记录是结构体，序列是由原子、记录或序列组成的数组。\n\
  \n开发者通过预配数据库账户来使用`Cosmos DB`。容器的概念用于存储存储过程、触发器和用户定义函数。该数据库账户下的实体包括容器、数据库和权限，这些实体称为资源。容器中的数据进行水平分区。更多`Cosmos\
  \ DB`详情请参阅 [COSM]。\n\n#### 4.3.4.3 IBM 云端大数据解决方案\n\nIBM 是云计算领域的领导者，包括云端大数据管理。它开发了一种利用硬件和软件集合的架构，可托管多种大数据系统。IBM\
  \ 提供数据库即服务，并支持数据管理和数据分析。例如：\n- `Cloudant`是一个 NoSQL 数据层。\n- `dashDB`系统是一个基于云的数据分析系统，用于执行分析。\n\
  - `ElephantSQL`是在云端运行的开源数据库。\n\n此外，IBM 云还为流计算和内容管理等多种数据管理能力提供支持。更多详情请参阅 [IBM]。\n\
  \n#### 4.3.4.4 Google 云端大数据解决方案\n\n`Google Cloud Platform`是一个全面的硬件和软件集合，使用户能从 Google\
  \ 获取各种服务。该云平台同时支持`Hadoop/MapReduce`和`Spark`平台。除了访问`BigTable`和`BigQuery`中的数据外，Google\
  \ 还提供分析解决方案，以及访问`YouTube`等系统的方案。更多详情请参阅 [GOOG]。\n\n## 4.4 语义 Web\n\n### 4.4.1 语义\
  \ Web 技术\n\n正如本章前文所述，我们开发的一些实验性大数据系统利用了云和语义 Web 技术。云计算已在第 4.3 节讨论，本节将概述语义 Web 技术。\n\
  \n当前 Web 技术从语法角度促进了信息集成，但在处理各种系统和应用的不同语义方面仍有大量工作要做。也就是说，当前 Web 技术在很大程度上依赖“人工介入”进行信息管理和集成。WWW\
  \ 之父 Tim Berners-Lee 意识到当前 Web 技术的不足，致力于使 Web 更智能。他的目标是构建一个 Web，基本上能减轻人类整合分散信息源和执行大量搜索的负担。他得出结论：需要机器可理解的网页和本体来进行信息集成，从而催生了语义\
  \ Web 的概念 [LEE2001]。利用语义 Web 技术的 Web 服务称为语义 Web 服务。\n\n语义 Web 可被视为一个高度智能和复杂的 Web，几乎无需人工干预即可执行预约安排、活动协调、复杂文档搜索，以及整合分散的数据库和信息系统等任务。虽然开发此类智能\
  \ Web 已取得很大进展，但仍有大量工作待做。例如，本体匹配、智能代理和标记语言等技术对语义 Web 发展贡献巨大。尽管如此，人类仍需做决策和采取行动。自 2000\
  \ 年代以来，语义 Web 有了许多发展。万维网联盟 (W3C) 正在制定语义 Web 标准 [W3C]。这些标准包括 XML (可扩展标记语言)、RDF (资源描述框架)\
  \ 和互操作性规范（另见 [AKIV2012]、[ALIP2010a]、[ALIP2010b]、[KHAN2002]、[KHAN2004] 和 [PART2011]）。\n\
  \n图 4.8 展示了语义 Web 的分层技术栈。这是由 Tim Berners-Lee 开发的栈。语义 Web 本质上由多层组成，每层利用前一层的技术。最底层是协议层，通常不包含在语义技术讨论中。下一层是\
  \ XML 层。XML 是一种文档表示语言。虽然 XML 足以指定语法，但难以用 XML 指定“文档 D 的创建者是 John”这类语义。因此，W3C 开发了使用\
  \ XML 语法的 RDF。语义 Web 社区进一步提出了用 OWL (Web 本体语言) 等语言指定本体的规范。注意 OWL 解决了 RDF 的不足。为了推理各种策略，语义\
  \ Web 社区提出了 SWRL (语义 Web 规则语言) 等 Web 规则语言。下面将描述构成语义 Web 的各种技术。\n\n\n\n\n![Figure\
  \ 4.8 Technology stack for the semantic web.](img/fig4_8.jpg)\n\n图 4.8 语义网技术栈。\n\
  \n### 4.4.1 语义网技术栈\n\n#### 4.4.1.1 XML\n\n由于 HTML（超文本标记语言）的局限性和 SGML（标准通用标记语言）的复杂性，XML\
  \ 变得必要。XML 是由 W3C 制定的一种可扩展标记语言，旨在使结构化文档在互联网上的交换更加容易。XML 的一个重要方面曾经是文档类型定义（DTD），它在正式模型中定义了每个文本元素的角色。XML\
  \ Schema 现在已成为指定数据结构的关键。XML Schema 本身也是 XML 文档 [BRAY1997]。\n\n#### 4.4.1.2 RDF\n\
  \nRDF 是语义网上描述资源的标准。它提供了一个通用框架来表达这些信息，以便它们可以在应用程序之间交换而不丢失含义。RDF 基于使用 Web 标识符（称为统一资源标识符，或\
  \ URI）来标识事物的思想，并通过简单的属性和属性值来描述资源 [KLYN2004]。\n\nRDF 具有形式语义，这为推理 RDF 图的含义提供了可靠的基础。这种推理通常称为蕴含。蕴含规则规定了可以从显式信息中推断出哪些隐式信息。通常，不假设\
  \ RDF 查询中包含关于任何资源的完整信息。查询语言应意识到这一点，并能容忍不完整或相互矛盾的信息。类的概念及对类的操作通过 RDF Schema 的概念在\
  \ RDF 中规定 [ANTO2008]。\n\n#### 4.4.1.3 SPARQL\n\nSPARQL（简单协议和 RDF 查询语言）[PRUD2006]\
  \ 是一种强大的查询语言。它是一项关键的语义网技术，并由 W3C 的 RDF 数据访问工作组标准化。SPARQL 语法类似于 SQL，但它的优势在于能够使查询跨越多个不同的数据源，这些数据源由异构和半结构化数据组成。SPARQL\
  \ 基于图模式匹配 [PRUD2006]。\n\n#### 4.4.1.4 OWL\n\nWeb 本体语言（OWL）[MCGU2004] 是一种本体语言，其表达能力和推理能力比\
  \ RDF 和 RDF Schema（RDF-S）更强。它具有额外的词汇以及形式语义。OWL 有三种表达能力逐渐增强的子语言：OWL Lite、OWL DL 和\
  \ OWL Full。这些子语言是为特定的实现者和用户社区设计的。OWL 中的形式语义基于描述逻辑（DL），后者是一阶逻辑的一个可判定片段。\n\n#### 4.4.1.5\
  \ 描述逻辑\n\n描述逻辑（DL）是一系列知识表示（KR）形式化方法，用于表示应用领域的知识 [BAAD2003]。它将领域的概念（即其术语）定义为称为类的对象集合，并使用这些概念来指定领域中出现的对象和个体的属性。描述逻辑的特点是具有一组构造器，允许从原子概念和角色构建复杂的概念和角色。\n\
  \n#### 4.4.1.6 SWRL\n\n语义网规则语言（SWRL）将 OWL 公理集扩展为包含类 Horn 规则，并将类 Horn 规则扩展为可与 OWL\
  \ 知识库相结合 [HORR2004]。提议的规则采用前件（主体）和后件（头部）之间蕴含的形式。其预期含义可理解为：每当前件中指定的条件成立时，后件中指定的条件也必须成立。前件（主体）和后件（头部）均由零个或多个原子组成。空前件被视为显然为真（即被每种解释满足），因此后件也必须被每种解释满足。空后件被视为显然为假（即不被任何解释满足），因此前件不得被任何解释满足。多个原子被视为合取，头部和主体均可包含此类原子的合取。请注意，具有合取后件的规则可以很容易地通过\
  \ Lloyd-Topor 变换转换为多条每条具有原子后件的规则。\n\n### 4.4.2 语义网与安全\n\n我们首先概述语义网的安全问题，然后讨论 XML\
  \ 安全、RDF 安全和安全信息集成的一些细节，这些都是安全语义网的组成部分。随着对这些各种问题研究的深入，我们希望能制定出适当的标准来保障语义网的安全。安全不能孤立考虑。安全贯穿所有层。\n\
  \n例如，考虑最底层。需要安全的 TCP/IP、安全套接字和安全的 HTTP。现在这些各种底层协议都有了安全协议。需要端到端安全。也就是说，不能仅在不受信的通信层上构建安全的\
  \ TCP/IP；我们需要网络安全。下一层是 XML 和 XML Schema。需要安全的 XML。也就是说，必须控制对文档各部分的访问，以进行读取、浏览和修改。目前已有关于保护\
  \ XML 和 XML Schema 的研究。下一步是保护 RDF。现在有了 RDF，我们不仅需要安全的 XML，还需要对解释和语义的安全保护。例如，在某些上下文中，文档的部分内容可能是*非密的*，而在其他某些上下文中，该文档可能是*密级的*。\n\
  \n一旦 XML 和 RDF 得到保护，下一步就是检查本体和互操作的安全性。也就是说，本体可能附有安全级别。本体的某些部分可能是*机密的*，而其他部分可能是*非密的*。挑战在于如何利用这些本体进行安全信息集成？研究人员已经在数据库安全互操作性方面做了一些工作。我们需要重新审视这项研究，然后确定还需要做什么，以便\
  \ Web 上的信息能够被安全地管理、集成和交换。逻辑、证明和信任位于语义网的最高层。也就是说，我们如何信任 Web 给我们的信息？接下来我们将讨论 XML、RDF、本体和规则的各种安全问题。\n\
  \n#### 4.4.2.1 XML 安全\n\n\n\n\n\n## 4.4.2 XML、RDF 和本体安全\n\n已有多项关于 XML 安全的研究工作被报道（参见例如\
  \ [BERT2002]）。我们简要讨论一些关键点。主要挑战在于：是授予对所有 XML 文档的访问权限，还是仅授予对文档部分内容的访问权限。Bertino 等人开发了用于\
  \ XML 的授权模型。他们专注于访问控制策略以及传播策略。他们还考虑了推送和拉取架构。他们使用 XML 来指定策略。策略规范包含有关哪些用户可以访问文档的哪些部分的信息。在\
  \ [BERT2002] 中，提出了访问控制算法以及计算结果视图的算法。此外，还讨论了保护 XML 文档的架构。在 [BERT2004] 和 [BHAT2004]\
  \ 中，作者进一步阐述了如何在 Web 上发布 XML 文档。其思路是：所有者发布文档，主体请求访问文档，而不受信任的发布者向主体提供其被授权查看的文档视图。W3C\
  \ 正在制定 XML 安全标准。XML 安全项目专注于提供 XML 安全标准的实现。重点在于 XML 签名语法与处理、XML 加密语法与处理以及 XML 密钥管理。虽然标准侧重于近期可实现的内容，但保护\
  \ XML 文档仍需要大量研究（另见 [SHE2009]）。\n\n#### 4.4.2.2 RDF 安全\n\nRDF 是语义 Web 的基础。虽然 XML\
  \ 在提供机器可理解文档方面存在局限，但 RDF 克服了这一局限。因此，RDF 为互操作性以及搜索和编目提供了更好的支持。它还描述文档的内容以及文档中各实体之间的关系。虽然\
  \ XML 提供语法和符号，但 RDF 通过以标准化方式提供语义信息来补充这一点 [ANTO2008]。\n\n基本 RDF 模型有三个组成部分：资源、属性和陈述。资源是由\
  \ RDF 表达式描述的任何事物。它可以是一个网页或页面集合。属性是用于描述资源的特定属性。RDF 陈述是资源连同一个命名属性及该属性的值。陈述组件包括主语、谓语和宾语。因此，例如，如果我们有一句\
  \ \"John is the creator of xxx\"（John 是 xxx 的创建者）形式的句子，那么 xxx 是主语或资源，属性或谓语是 \"creator\"\
  ，宾语或字面值是 \"John\"。有非常类似于实体关系图或对象图的 RDF 图来表示陈述。重要的是必须对 RDF 句子使用预期的解释。这通过 RDF 模式来实现。模式是一种字典，包含句子中所用各术语的解释。\n\
  \nRDF 中更高级的概念包括容器模型和关于陈述的陈述。容器模型有三种容器对象：包、序列和替代。包是资源或字面值的无序列表。它用于表示一个属性有多个值但顺序不重要。序列是有序资源的列表。这里顺序很重要。替代是表示属性值的备选项的资源列表。各种\
  \ RDF 教程更详细地描述了容器的语法。RDF 还支持对其他陈述进行陈述。例如，利用此功能可以进行 \"The statement A is false\"\
  （陈述 A 为假）形式的陈述，其中 A 是陈述 \"John is the creator of X\"。同样，可以使用类对象图来表示容器和关于陈述的陈述。RDF\
  \ 还有一个与之关联的形式化模型。该形式化模型具有形式化语法。访问 RDF 文档的查询语言是 `SPARQL`。有关 RDF 的更多信息，请参阅 Antoniou\
  \ 和 van Harmelen 所著书籍中的精彩讨论 [ANTO2008]。\n\n现在，要使语义 Web 安全，我们需要确保 RDF 文档是安全的。这将涉及从语法角度保护\
  \ XML。然而，对于 RDF，我们还需要确保在语义层面保持安全。问题包括资源、属性和陈述概念的安全含义。即：如何确保访问控制？如何保护关于陈述的陈述和属性？如何在更细的粒度上提供访问控制？容器模型的安全属性是什么？如何保护包、列表和替代？我们能否用\
  \ RDF 指定安全策略？如何解决策略的语义不一致性？关于陈述的陈述有什么安全含义？如何保护 RDF 模式？这些都是困难的问题，我们需要开始研究以提供答案。XML\
  \ 安全只是开始。保护 RDF 要困难得多（另见 [CARM2004]）。\n\n#### 4.4.2.3 安全与本体\n\n本体本质上是各种概念的表示，旨在避免歧义。已经开发了大量本体。这些本体已被代理用于理解网页并执行数据库集成等操作。此外，本体可以用\
  \ RDF 或特殊语言（如 Web 本体语言 `OWL`）表示。现在，本体必须是安全的。即，必须控制对本体的访问。这意味着不同用户可能访问本体的不同部分。另一方面，本体可用于指定安全策略，就像\
  \ XML 和 RDF 被用于指定策略一样。即，我们将描述如何保护本体，以及如何使用本体来指定各种策略。\n\n#### 4.4.2.4 安全查询与规则处理\n\
  \n安全 RDF 层之上的层是安全查询与规则处理层。虽然 RDF 可用于指定安全策略（参见例如 [CARM2004]），但 W3C 开发的 Web 规则语言在指定复杂策略方面更强大。此外，还开发了用于处理和推理规则的推理引擎（例如马里兰大学开发的\
  \ Pellet 引擎）。可以将我们开发的数据库推理控制器的思想（参见 [THUR1993]）与 Web 规则处理相结合，为语义 Web 开发推理或隐私控制器。查询处理模块负责访问语义\
  \ Web 上异构的数据和信息源。研究人员正在研究将 Web 查询处理技术与语义 Web 技术相结合的方法，以定位、查询和集成异构的数据和信息源。\n\n###\
  \ 4.4.3 基于语义 Web 技术的云计算框架\n\n在本节中，我们将介绍一个云计算框架，我们已在恶意软件检测以及社交媒体应用的系统实现中使用了该框架，其中一些应用在本书中有所讨论。特别地，我们将讨论我们用于\
  \ RDF 集成和溯源数据集成的框架。\n\n#### 4.4.3.1 RDF 集成\n\n\n\n\n\n##### 基于 RDF 的云应用策略引擎\n\n\
  我们开发了一个基于 RDF 的策略引擎，用于云环境中的各种应用，包括社交媒体和信息共享应用。使用 RDF 作为数据模型的原因如下：\n\n1. RDF 使我们能够实现数据互操作性，连接那些看似截然不同、由各机构/组织分别编目管理的信息源。\n\
  2. 使用 RDF 使参与机构能够创建以数据为中心的应用，利用现已可用的集成数据。\n3. 由于 RDF 生成数据不需要显式模式，因此可以轻松适应不断变化的用户需求。\n\
  \n该策略引擎的灵活性建立在其接受高级策略，并将其作为规则/约束在源数据及其关联数据的有向 RDF 图表示上执行的基础之上。我们策略引擎的优势在于，它可以处理任何可使用\
  \ RDF 技术、霍恩逻辑规则（如 `SWRL`）和 `OWL` 约束表示的策略类型。这些语义 Web 技术的强大功能可在云计算环境中成功加以利用，为用户提供高效存储和检索数据的能力，以支持数据密集型应用。\n\
  \n在云中存储 RDF 数据带来了许多新特性，例如可扩展性和按需服务、为用户按需提供资源和服务、按需付费服务和容量、位置独立性，以及在硬件/CPU 性能、带宽和内存容量方面为用户保证服务质量。\n\
  \n在开发我们的 RDF 集成框架时，我们考察了以下工作。\n\n在 [[SUN2010]](#ch04.xhtml#ref4_62) 中，作者采用了 Hexastore\
  \ 的思想，并同时考虑了 RDF 数据模型和 `HBase` 能力。他们将 RDF 三元组存储在六个 `HBase` 表（`S_PO`、`P_SO`、`O_SP`、`PS_O`、`SO_P`\
  \ 和 `PO_S`）中，覆盖了 RDF 三元组模式的所有组合。他们利用 `HBase` 在行键上提供的索引结构对三元组进行索引。他们还为 `SPARQL` 基本图模式（`BGP`）处理提出了一种\
  \ `MapReduce` 策略，该策略适合其存储模式。该策略使用多个 `MapReduce` 作业来处理典型的 `BGP`。在每个作业中，它使用贪婪方法选择连接键并消除多个三元组模式。他们的评估结果表明，该方法在大规模\
  \ RDF 数据集上表现良好。\n\n在 [[HUSA2009]](#ch04.xhtml#ref4_37) 中，作者描述了一个使用 `Hadoop` 存储和检索大量\
  \ RDF 三元组的框架。他们描述了一种在 `HDFS` 中存储 RDF 数据的模式。他们还提出了回答 `SPARQL` 查询的算法。这利用了 `Hadoop`\
  \ 的 `MapReduce` 框架来实际回答查询。\n\n在 [[HUAN2011]](#ch04.xhtml#ref4_36) 中，作者介绍了一个可扩展的\
  \ RDF 数据管理系统。他们介绍了以下技术：(i) 利用最先进的单节点 RDF 存储技术，以及 (ii) 跨节点划分数据，通过局部性优化来加速查询处理。\n\n\
  在 [[PAPA2012]](#ch04.xhtml#ref4_54) 中，作者提出了 `H2RDF`，这是一个完全分布式的 RDF 存储，结合了 `MapReduce`\
  \ 处理框架和 `NoSQL` 分布式数据存储。其系统具有独特特性，能够在虚拟无限数量的三元组上高效处理简单和多连接 `SPARQL` 查询。这些特性包括：根据查询选择性执行连接以减少处理的连接算法，以及在集中式和分布式（基于\
  \ `MapReduce`）连接执行之间自适应选择以实现快速查询响应。他们声称其系统能高效回答简单连接和复杂多变量查询，并能使用由九个工作节点组成的小型集群扩展至三十亿三元组。\n\
  \n在 [[KHAD2012b]](#ch04.xhtml#ref4_42) 中，作者设计了一个 `Jena-HBase` 框架。其基于 `HBase` 的三元组存储可与\
  \ `Jena` 框架配合使用。`Jena-HBase` 为最终用户提供了一个可扩展的存储和查询解决方案，支持 RDF 规范的所有特性。更多 `HBase` 详情可参见\
  \ [`HBASE`] 和 [[GEOR2011]](#ch04.xhtml#ref4_28)。\n\n#### 4.4.3.2 来源集成\n\n虽然我们针对社交网络应用在云中实现可靠信息共享的方法足够通用，适用于包括网络安全数据在内的任何类型数据，但我们以来源数据为例进行了说明。我们将讨论在来源数据集成工作中考察的各种方法。更多工作详情可参见\
  \ [[THUR2014]](#ch04.xhtml#ref4_66)。\n\n在 [[IKED2011]](#ch04.xhtml#ref4_39) 中，作者考虑了一类称为广义\
  \ Map 和 Reduce 工作流（`GMRWs`）的工作流。输入数据集由 Map 和 Reduce 函数的有向无环图处理以产生输出结果。他们还展示了如何透明地捕获\
  \ Map 和 Reduce 函数的数据来源（谱系）。\n\n在 [[CHEB2013]](#ch04.xhtml#ref4_19) 中，作者探索并解决了在 `Apache\
  \ HBase` 数据库中高效且可扩展地存储和查询大量序列化为 RDF 图的来源图集合的挑战。\n\n在 [[PARK2011]](#ch04.xhtml#ref4_55)\
  \ 中，他们提出了 `RAMP`（Reduce 和 Map 来源）作为 `Hadoop` 的扩展，支持 `MapReduce` 作业工作流的来源捕获和追踪。\n\
  \n[[ABRA2010]](#ch04.xhtml#ref4_1) 中讨论的工作提出了一个系统，展示了如何利用 `HBase` 类 Bigtable 的能力，对用\
  \ RDF 表示的来源数据进行分布式存储和查询。特别是，他们的 `ProvBase` 系统包含一个 `HBase`/`Hadoop` 后端、一个用于存储来源三元组的存储模式，以及一个用于在其系统中评估\
  \ `SPARQL` 查询的查询算法。\n\n在 [[AKOU2013]](#ch04.xhtml#ref4_3) 中，作者的研究引入了 `HadoopProv`，这是一个实现了\
  \ `MapReduce` 作业中来源捕获和分析的修改版 `Hadoop`。其系统旨在通过 (i) 分别处理 Map 和 Reduce 阶段的来源跟踪，以及 (ii)\
  \ 将来源图的构建推迟到查询阶段，来最小化来源捕获开销。来源图随后在 Map 和 Reduce 来源文件的匹配中间键上进行连接。\n\n## 4.5 分析与保护社交网络\n\
  \n### 4.5.1 社交网络简介\n\n在线社交网络（`OSNs`）在互联网上获得了极大普及，成为一个重要的研究课题，吸引了来自不同领域的众多专业人士。自\
  \ `Facebook`、`Twitter` 和 `LinkedIn` 等 `OSNs` 网站出现以来，`OSNs` 持续影响并改变着我们生活的方方面面。从政治到商业营销，从名人到新闻制造者，每个人都沉迷于这一现象。`Facebook`\
  \ 用于与朋友联系并分享各种个人和专业数据以及照片和视频；`LinkedIn` 完全是一个专业网络，用于与同事建立联系。`Google+` 类似于 `Facebook`，而\
  \ `Twitter` 是一项免费的社交网络和微博服务，允许用户发送和阅读称为推文的消息。推文是显示在作者个人资料页面上并分发给作者订阅者（称为 `followers`）的约\
  \ 140 字符的文本帖子。每个网络都有其自身的优势，这些网络主要通过广告盈利，因为它们提供的服务在很大程度上是免费的，除非当然有人想在 `LinkedIn`\
  \ 等网络中获得高级服务。\n\n\n\n\n\n我们在社交媒体分析方面的大量工作都集中在分析推文上。特别是，我们分析推文以检测可疑人员以及进行情感分析。此外，我们开发的许多实验系统都侧重于使用语义\
  \ Web 技术表示的社交媒体数据。我们的工作还考察了 Facebook，研究人们发布的信息，并确定是否可以提取用户的敏感属性。我们还在社交网络访问控制的工作中使用了基于语义\
  \ Web 的社交网络表示。我们将讨论社交媒体分析应用，然后讨论安全和隐私问题。第 IV 部分将讨论我们开发的一个用于分析和保护基于语义 Web 的社交媒体系统的系统。图\
  \ 4.9 展示了社交媒体分析、安全和隐私的各个方面。关键点将在第 4.6.2 节至第 4.6.4 节中详细阐述。更多详情请参阅 [THUR2016]。\n\n\
  ![图 4.9 社交媒体分析、安全和隐私。](img/fig4_9.jpg)\n\n图 4.9 社交媒体分析、安全和隐私。\n\n### 4.5.2 社交媒体分析应用\n\
  \n#### 4.5.2.1 提取人口统计信息的应用\n\n在此任务中，分析社交媒体数据并提取位置和年龄等人口统计数据。如果社交媒体用户已经指定了其位置，则此处无需进一步工作。否则，提取位置的一个简单方法是检查其朋友的位置，然后根据用户住在其朋友附近这一假设来确定位置。年龄属性可以通过查看\
  \ LinkedIn 了解一个人何时毕业，然后计算年龄来提取。应当注意，可能存在偏离常态的情况，因此存在产生假阳性和假阴性的可能性。\n\n#### 4.5.2.2\
  \ 情感分析\n\n此处分析推文并提取诸如“我喜欢披萨”或“我不喜欢巧克力”之类的词语。这里的思路是分析不同个体的推文，确定他们对特定物品（如披萨或巧克力）或话题（如体育或音乐）的情感倾向。\n\
  \n#### 4.5.2.3 检测兴趣社区\n\n网络中的某些人将拥有相似的目标和兴趣。因此，可以通过 Facebook 中的帖子将兴趣相似的各类人群连接起来，使他们能够形成一个社区。此处的分析将提取兴趣相似的个体并将他们连接起来。\n\
  \n#### 4.5.2.4 确定领导者\n\n在此应用中，分析网络以查看一个人拥有的三个连接数量以及关系的强度。如果许多人与某人建立连接或关注某人，则该人将成为领导者。存在显而易见的领导者，如名人和政治家，也存在通过分析网络可以发掘出的非显性领导者。\n\
  \n#### 4.5.2.5 检测关注人员\n\n如果例如与来自特定国家的人通信会使某人变得可疑，则该人可能是关注人员。这样可以对该人进行进一步调查。通常，关注人员不像与特定国家的人通信那样容易直接发现。因此，挑战在于通过数据分析技术提取隐藏的链接和关系。\n\
  \n#### 4.5.2.6 确定政治倾向\n\n这里的思路是确定个人的政治倾向，即使他们没有明确说明他是自由派还是保守派。在这种情况下，可以考察他们钦佩的政治领袖（例如撒切尔夫人或希拉里·克林顿）以及他们是否去教堂，以此判断该人是自由派还是保守派。\n\
  \n以上示例仅是应用中的一小部分。还有许多其他应用，如确定性别偏见、检测可疑行为，甚至预测未来事件。这些 SNA（社交网络分析/挖掘）技术使用各种分析工具，执行关联规则挖掘、聚类、分类和异常检测等。我们将在下一节讨论各种数据挖掘技术如何应用于\
  \ SNA。\n\n### 4.5.3 面向社交网络的数据挖掘\n\n第 3 章概述了我们在工作中使用的一些数据挖掘技术，以及一些为 SNA 提出的其他技术。在本节中，我们将考察各种数据挖掘技术如何应用于\
  \ SNA。这些技术的目标是为确定人口统计信息和检测可疑行为等各种应用提取知识金块。图 4.10 展示了应用于 SNA 的各种数据挖掘技术。\n\n![图 4.10\
  \ 面向 SNA 的数据挖掘技术。](img/fig4_10.jpg)\n\n图 4.10 面向 SNA 的数据挖掘技术。\n\n#### 4.5.3.1 关联规则挖掘\n\
  \n关联规则挖掘技术从海量信息中提取规则。这些规则确定一起购买的商品或一起出现的人员。因此，在 SNA 的背景下，关联规则挖掘技术将提取规则，指明彼此具有强关系的人员。\n\
  \n#### 4.5.3.2 分类\n\n分类技术将根据一组预定义标准确定类别。将此类技术应用于 SNA，可以形成兴趣社区。例如，一个社区可能由喜欢网球的个体组成，而另一个社区可能由喜欢高尔夫的个体组成。请注意，存在一个预定义标准：如果一个人参与某项运动且也观看该运动，则认为他喜欢该运动。\n\
  \n#### 4.5.3.3 聚类\n\n当没有预定义标准时，聚类技术将形成群组。因此，通过分析数据，可以提取出诸如居住在东北部的人大多吸烟卷烟，而居住在西南部的人大多吸雪茄等模式。\n\
  \n#### 4.5.3.4 异常检测\n\n异常检测技术确定偏离常态的变化。例如，John 社交网络中的每个人都喜欢看间谍电影，只有 Paul 和 Jane\
  \ 例外。\n\n#### 4.5.3.5 Web 挖掘\n\nWeb 挖掘技术在 SNA 中有天然的应用。这是因为 WWW 可以被视为一个网络，其中节点是网页，链接是网页之间的链接。因此，Web\
  \ 结构挖掘确定网页如何相互连接，而 Web 内容挖掘将分析 WWW 的内容。Web 日志挖掘将分析对网页的访问。同样，可以挖掘社交图谱并提取图的结构。可以挖掘图的内容（即数据）以提取各种模式。也可以挖掘对\
  \ Facebook 页面等的访问，这类似于 Web 日志挖掘。\n\n### 4.5.4 安全和隐私\n\n由于数据挖掘，用户可以访问社交网络中各成员的信息并提取敏感信息。这可能包括个人可能希望保密的财务数据、健康数据和旅行数据。可以提取的其他敏感信息包括政治倾向和性别偏好，以及饮酒和吸烟习惯。在我们之前的工作中，我们考察了由于数据挖掘和分析导致的社交媒体数据中发生的各种隐私侵犯。我们应用了各种数据分析技术，并展示了如何推断私人信息\
  \ [ABRO2016]。\n\n\n\n\n\n安全的另一个方面是机密性。也就是说，必须控制对社交媒体中敏感信息的访问。用户应该有选项仅授予特定朋友访问权限。此外，人们可能会更信任某些朋友。我们已经研究了使用语义\
  \ Web 技术表示的社交网络的访问控制。我们还开发了实验系统，包括社交网络中的推理控制以及基于云的可靠信息共享。\n\n## 4.6 总结与展望\n\n在本章中，我们讨论了三种类型的大数据系统。首先，我们讨论了所谓的用于托管大数据系统的基础设施。这些本质上是大规模数据处理平台，例如\
  \ `Apache Hadoop`、`Spark`、`Storm` 和 `Flink`。然后我们讨论了各种大数据管理系统。这些包括基于 SQL 的系统和基于 NoSQL\
  \ 的系统。随后我们讨论了大数据管理与分析系统。我们已经试验了其中的几个系统。它们包括 `Apache Hadoop`、`Storm`、`MapReduce`、`Hive`、`MongoDB`\
  \ 和 `Weka`。\n\n我们相信，在过去十年中，大数据技术呈爆发式增长。仅仅 15 年前，本章讨论的许多系统还不存在。我们预计技术将继续爆发式发展。因此，我们不仅要跟进文献，还要试验大数据技术，这非常重要。随着进展的推进，我们将更清楚地知道何时、何地、为何以及如何使用何种系统。\n\
  \n接下来，我们介绍了云和语义 Web 技术的概念。我们首先讨论了云计算的概念，包括虚拟化的各个方面。我们还讨论了云的各种服务模型和部署模型，并简要概述了存储管理和数据管理等云功能。此外，还讨论了一些云平台，特别是与大数据技术相关的平台。接下来，我们讨论了语义\
  \ Web 技术，包括 `XML`、`RDF`、本体和 `OWL`。随后讨论了语义 Web 的安全问题。最后，我们讨论了基于语义 Web 技术的云计算框架。关于云计算和语义\
  \ Web 的更多细节，请参阅 `[THUR2007]` 和 `[THUR2014]`。\n\n我们对云计算和语义 Web 的讨论将有助于理解本书第 IV 部分中讨论的一些实验系统。例如，我们讨论了在云中运行的实验性安全超大规模数据处理系统。我们还讨论了云中的可靠信息共享，其中数据使用语义\
  \ Web 技术表示。大数据、云和语义 Web 是第 IV 部分讨论所需的一些基础数据科学技术。\n\n## 参考文献\n\n*   `[ABRA2010]`\
