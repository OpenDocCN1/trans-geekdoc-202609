  \n# 7 用于恶意软件检测的流分析\n\nDOI: [10.1201/9781003081845-12](https://doi.org/10.1201/9781003081845-12)\n\
  \n## 7.1 简介\n\n对于数据挖掘/数据科学界而言，挖掘/分析不断增长的流式数据是一大挑战。流数据分类存在三个主要问题。首先，存储并使用所有历史数据进行训练是不切实际的，因为这将需要无限的存储空间和运行时间。其次，数据中可能存在概念漂移，即数据的潜在概念可能随时间变化。第三，新类别可能在流中演变出现。文献中有许多现有解决方案解决前两个问题，例如单模型增量学习算法\
  \ [CHEN2008, HULT2001, YANG2005] 和集成分类器 [KOLT2005, MASU2008a, WANG2003]。然而，大多数现有技术无法检测流中的新类别。另一方面，我们的方法能同时处理概念漂移并检测新类别。\n\
  \n传统分类器只能正确分类那些它们已接受过训练的类别的实例。当新类别出现在流中时，属于该类别的所有实例都会被错误分类，直到该新类别被专家人工识别，并利用该类别的标记实例训练出新模型为止。我们的方法通过在传统分类器中融入新类别检测器来解决这一问题，从而无需人工干预即可识别新类别的出现。所提出的新类别检测技术可使各领域的许多应用受益，例如网络入侵检测和信用卡欺诈检测。例如，在入侵检测问题中，当发生一种新型入侵时，我们不仅要能检测出这是一次入侵，还要能识别出这是一种新型入侵。有了入侵类型信息，人工专家就能更深入地分析入侵、寻找补救措施、提前设置警报，并使系统更加安全。\n\
  \n\n\n\n\n### 流分析用于新颖类别检测\n\n在本章中，我们将讨论什么是流分析（我们也将其称为流挖掘），并讨论一种用于检测新颖类别的方法。我们将描述检测新颖类别的算法和系统架构。我们给出新颖类别和现有类别的定义。然后我们陈述新颖类别检测算法所依据的假设。我们通过一个例子说明*新颖类别*的概念，并介绍几个术语，如“已用”空间和“未用”空间。然后我们讨论新颖类别检测过程中的三个主要部分，它们是：(i)\
  \ 在训练期间保存*已用*空间的清单，(ii) 异常值检测和过滤，以及 (iii) 计算异常值之间的内聚性并将异常值与训练数据分离。我们还将展示如何通过使用聚类进行原始数据缩减来使该技术变得高效。\n\
  \n最后，我们在多个合成和真实数据集上评估我们提出的方法，并报告四个数据集的结果。其中我们报告结果的两个数据集是合成的，另外两个是真实的基准数据集。第一个合成数据集仅模拟概念漂移。我们使用该数据集进行评估，以表明我们的方法能够正确区分概念漂移和新颖类别。第二个合成数据集同时模拟概念漂移和概念演化。我们使用的两个基准数据集是\
  \ KDD Cup 1999 入侵检测数据集和森林覆盖类型数据集，两者在数据流分类文献中均被广泛使用。每个合成和真实数据集均包含大于或等于 250,000 个数据点。\n\
  \n我们将结果与两种基线技术进行比较。对于每个数据集和每种基线技术，我们报告总体错误率、被误分类为现有类别的新颖实例百分比，以及被误分类为新颖类别的现有类别实例百分比。此外，我们还报告每种基线技术在每个数据集上的运行时间。在所有数据集上，我们的方法在分类准确率和误检率方面均优于基线技术。我们的方法在运行时间方面也优于基线技术。以下各节将详细讨论结果。\n\
  \n本章的组织结构如下。在第 7.2 节中，我们描述我们对流挖掘/分析的看法。特别是，我们讨论我们的架构、相关工作和我们的方法。算法细节在第 7.3 节中讨论。特别是，给出了一些定义和我们的新颖类别检测技术。实验和评估在第\
  \ 7.4 节中讨论。特别是，给出了我们的数据集、实验设置和性能结果。恶意软件检测的应用在第 7.5 节中讨论。第 7.6 节总结了本章。图 7.1 说明了本章中的概念。\n\
  \n![图 7.1 用于新颖类别检测的流分析。](img/fig7_1.jpg)\n\n图 7.1 用于新颖类别检测的流分析。\n\n## 7.2 流挖掘\n\n\
  ### 7.2.1 架构\n\n我们提出了一种创新的方法来检测新颖类别。它在几个方面不同于传统的新颖性（或异常/离群值）检测技术。首先，传统的新颖性检测技术[MARK2003、ROBE2000、YEUN2002]\
  \ 通过假设或建立正常数据模型，并简单地将偏离“正常”点的数据点识别为离群值/异常值来工作。但我们的目标不仅是检测单个数据点是否偏离正常性，还要发现一组离群值之间是否存在强关联。其次，传统的新颖性检测器可以被视为“单类”模型，它仅区分正常和异常数据，但无法区分两种不同类型的异常。但我们的模型是“多类”模型，意味着它可以区分不同类别的数据，同时可以检测新颖类别数据的存在，这是传统分类器与新颖性检测器的独特结合。\n\
  \n我们的技术通过自适应集成分类方法处理概念漂移，该方法维护一个包含 `M` 个分类器的集成 `L`，用于对未标记数据进行分类。数据流被划分为大小相等的块，以便每个块可以容纳在内存中并在线处理。一旦数据块被标记，我们立即从中训练一个分类模型。如果有必要，新训练的模型将替换集成中的现有模型之一。因此，集成不断演化，反映流中最新的概念。\n\
  \n我们新颖类别检测技术的核心概念是每个类别必须具有一个重要属性：属于同一类别的数据点应该彼此更接近（内聚性），并且应该远离属于其他类别的数据点（分离性）。每当一个新的数据块出现时，我们首先检测那些与训练数据*良好分离*的测试实例（即离群值）。然后应用过滤以移除可能由概念漂移导致的离群值。最后，如果我们在这些过滤后的离群值中发现强内聚性，我们就宣布发现了一个新颖类别。当新颖类别的真实标签到达并使用标记实例训练新模型时，现有集成将用该模型进行更新。因此，模型集成不断地通过新类别得到丰富。我们的架构如图\
  \ 7.2 所示。\n\n![图 7.2 架构。](img/fig7_2.jpg)\n\n图 7.2 架构。\n\n我们假设数据流被划分为大小相等的块。该系统的核心是一个包含\
  \ `M` 个分类器的集成 `L`：`{L[1], …, L[M]}`。当一个新的未标记数据块到达时，集成被用于检测该块中的新颖类别。如果检测到新颖类别，则识别出属于该新颖类别的实例并相应地进行标记。该块中所有其他实例，即未被识别为新颖类别的实例，使用多数投票进行分类。一旦数据块被标记，它就被用来训练一个分类器，该分类器替换集成中的现有分类器之一。在训练期间，我们创建*已用*空间的清单。\n\
  \n我们有几项贡献。首先，我们提供了对新颖类别特征的详细理解，并提出了一种新技术，该技术可以在数据流存在概念漂移的情况下检测新颖类别。其次，我们建立了一个框架，用于将新颖类别检测机制融入传统分类器中。最后，我们将该技术应用于合成和真实世界数据，获得了比最先进的流分类算法好得多的结果。\n\
  \n### 7.2.2 相关工作\n\n\n\n\n\n我们的工作与流分类和新颖性检测均有关联。流数据分类领域已有大量研究。主要有两种方法：单模型分类和集成分类。已有一些单模型技术被提出以适应概念漂移\
  \ [CHEN2008, HULT2001, YANG2005]。然而，我们的技术采用的是集成方法。已有多种用于流数据挖掘的集成技术被提出 [KOLT2005,\
  \ MASU2008a, WANG2003]。这些集成方法更新当前概念仅需简单操作，且被发现能稳健地处理概念漂移。尽管这些技术能高效处理概念漂移，但它们均无法检测数据流中的新颖类别。相比之下，我们的技术不仅能处理概念漂移，还能检测数据流中的新颖类别。在此意义上，我们的技术也与新颖性检测技术相关。\n\
  \n[MARK2003] 中详细讨论了关于新颖性检测的综合性研究。作者将新颖性检测技术分为两类：统计方法和基于神经网络的方法。我们的技术属于统计方法。统计方法又分为参数化和非参数化两类。参数化方法假设数据分布是已知的（例如高斯分布），并尝试估计该分布的参数（如均值和方差）。如果任何测试数据落在模型正常参数范围之外，则将其判定为新颖\
  \ [ROBE2000]。我们的技术是一种非参数化方法。像 Parzen 窗法 [YEUN2002] 这样的非参数化方法估计训练数据的密度，并拒绝密度超出特定阈值的模式。基于\
  \ K 近邻 (K-NN) 的新颖性检测方法也是非参数化的 [YANG2002]。所有这些新颖性检测技术仅考虑基于某些适当度量（如距离、密度等），测试实例是否与训练数据足够接近（或足够远）。我们的方法不同之处在于，我们不仅考虑与正常数据的分离度，还考虑异常值之间的内聚性。此外，我们的模型将新颖类别同化到现有模型中，这使其能够将该类别的未来实例与其他类别区分开来。另一方面，新颖性检测技术仅记忆“正常”趋势，并不关心异常实例之间的相似性或差异性。\n\
  \n数据流挖掘领域的一项近期工作 [SPIN2007] 描述了一种聚类方法，可同时检测概念漂移和新颖类别。该方法假设只有一个“正常”类别，所有其他类别均为新颖类别。因此，如果有多个类别被视为“正常”或“非新颖”，该方法可能效果不佳。我们的方法可以处理任意数量的现有类别。这使得我们的方法在检测新颖类别方面比\
  \ [SPIN2007] 更有效，实验结果也证明了这一点。\n\n### 7.2.3 我们的方法\n\n我们提出了一种新颖技术，用于在概念漂移数据流中检测新类别。大多数新颖性检测技术要么假设不存在概念漂移，要么为单个“正常”类别建模并将所有其他类别视为新颖。但我们的方法能够在存在概念漂移的情况下检测新颖类别，即使模型包含多个“现有”类别。此外，我们的新颖类别检测技术是非参数化的，即不假设数据具有任何特定分布。我们还通过实证表明，我们的方法在分类准确率和处理速度方面均优于最先进的基于数据流的新颖性检测技术。\n\
  \n读者可能会认为，为了检测新颖类别，我们实际上是在检查是否形成了新簇，因此检测过程可以在无监督下进行。但监督对于分类是必要的。没有外部监督，两个独立的簇可能被视为两个不同的类别，尽管它们并非如此。反之，如果一个数据块中出现多个新颖类别，如果这些实例的标签从未被揭示，它们可能被视为单个新颖类别。在未来的工作中，我们希望将我们的技术应用于多标签实例领域。我们的方法如\
  \ 图 7.3 所示。\n\n![图 7.3 我们的流挖掘方法。](img/fig7_3.jpg)\n\n图 7.3 我们的流挖掘方法。\n\n### 7.2.4\
  \ 新颖类别检测概述\n\n算法 7.1 概述了我们技术的摘要。数据流被划分为等大小的数据块。最新的数据块（无标签）作为输入提供给算法。首先，它检测数据块中是否存在任何新颖类别（第\
  \ 1 行）。术语“新颖类别”将在稍后定义。如果发现新颖类别，我们将检测属于该类别的实例（第 2 行）。然后我们使用集成 `L` = {`L`[1], …, `L`[`M`]}\
  \ 对不属于新颖类别的实例进行分类。当数据块获得标签后，使用该数据块训练一个新分类器 `L`'。然后，根据 `M` + 1 个分类器 `L` ∪ {`L`'}\
  \ 在最新标记数据块上的准确率，选择最佳的 `M` 个分类器来更新现有集成。\n\n从现在起，我们的算法将被称为“MineClass”，代表在数据流中挖掘新颖类别。MineClass\
  \ 适用于任何基础学习器。唯一特定于学习算法的操作是 `Train-and-create-inventory`。我们将针对两种基础学习器演示此操作。\n\n###\
  \ 7.2.5 使用的分类器\n\n我们将新颖性检测技术应用于两种不同的分类器：决策树和 K-NN。我们在集成中保留 `M` 个分类模型。对于决策树分类器，每个模型是一棵决策树。对于\
  \ K-NN，每个模型通常是训练数据集合本身。然而，存储所有原始训练数据在内存上效率低下，且使用它们对未标记数据进行分类在时间上效率低下。我们通过用训练数据构建\
  \ `K` 个簇，保存簇摘要作为分类模型，并丢弃原始数据，从而同时降低了时间和内存需求。该过程在 [MASU2008b] 中有详细解释。簇摘要此后称为“伪点”。由于我们仅存储和使用\
  \ `K` 个伪点，时间和内存需求均成为 `K`（一个常数）的函数。此处采用的聚类方法是一种基于约束的 `K`\\-均值聚类，该约束是在最小化簇内离散度的同时最小化簇杂质。如果一个簇仅包含来自单一类别的实例，则认为该簇是纯净的。每个簇的摘要由质心和簇中各类别数据点的频率组成。分类通过从测试点找到最近的簇质心，并将频率最高的类别分配给测试点来完成。\n\
  \n## 7.3 新颖类别检测的细节\n\n### 7.3.1 定义\n\n我们从“新颖”和“现有”类别的定义开始。\n\n**定义 7.1：** **(现有类别和新颖类别)**\
  \ 设 `L` 为当前的分类模型集成。如果集成中至少有一个模型 `L`[`i`] ∈ `L` 是用类别 `c` 的实例训练的，则类别 `c` 为现有类别。否则，`c`\
  \ 为新颖类别。\n\n我们假设任何类别都具有以下基本属性（属性 7.1）：\n\n**属性 7.1：** *一个数据点应当更接近其自身类别的数据点（内聚性），并远离其他类别的数据点（分离性）*。\n\
  \n\n\n\n\n我们的主要假设是：属于类别 `c` 的实例由底层生成模型 `Θ[c]` 生成，且每个类别中的实例是独立同分布的。基于这一假设，我们可以合理地论证：彼此接近的实例应当由同一模型生成，即属于同一类别。我们现在通过\
  \ 图 7.4 展示使用决策树进行新颖类别检测的基本思想。我们引入 `已用空间` 的概念来表示被任意实例占据的特征空间，引入 `未用空间` 来表示未被实例占据的特征空间。\n\
  \n![图 7.4 (a) 决策树和 (b) 对应的特征空间划分。FS(X) 表示由叶节点 X 定义的特征空间。阴影区域显示每个分区的已用空间。(c) 一个新颖类别（用\
  \ x 表示）到达未用空间。](img/fig7_4.jpg)\n\n图 7.4 (a) 决策树和 (b) 对应的特征空间划分。FS(X) 表示由叶节点 X 定义的特征空间。阴影区域显示每个分区的已用空间。(c)\
  \ 一个新颖类别（用 x 表示）到达未用空间。\n\n根据性质 7.1（分离性），新颖类别必须到达未用空间。此外，新颖类别的实例之间必须存在强内聚性（例如接近性）。因此，我们的方法遵循以下两个基本原则：跟踪决策树中每个叶节点的已用空间，以及寻找落入未用空间中的测试实例之间的强内聚性。\n\
  \n### 7.3.2 新颖类别检测\n\n我们遵循两个基本步骤进行新颖类别检测。首先，训练分类器，以创建并保存已用空间的清单（第 7.2 节 中描述）。这是通过聚类并将聚类摘要保存为“伪点”来完成的。其次，利用这些伪点检测测试数据中的异常值，如果异常值之间存在强内聚性，则宣告发现新颖类别。\n\
  \n#### 7.3.2.1 训练期间保存已用空间清单\n\n创建清单的总体思路是对训练数据进行聚类，并将聚类质心和其他有用信息保存为伪点。这些伪点用于跟踪已用空间。这种聚类的具体方式可能因基学习器而异。例如，对于决策树，聚类在树的每个叶节点处进行，因为我们需要分别跟踪每个叶节点的已用空间。对于\
  \ 第 7.2 节 中讨论的 K-NN 分类器，则利用已有的伪点来存储清单。\n\n值得注意的是，`K`-均值聚类似乎是保存决策边界和计算异常值的最佳选择。基于密度的聚类也可用于检测异常值，但存在若干问题。首先，我们必须在叶节点保存所有原始数据点以应用聚类。其次，聚类过程将耗费平方时间，而\
  \ `K`-均值仅需线性时间。最后，我们必须为每个待测试的数据块运行聚类算法。然而，`K`-均值算法中参数 `K` 的选择对总体结果有一定影响，这将在实验结果中讨论。\n\
  \n##### 7.3.2.1.1 聚类\n\n我们为每个数据块构建总共 `K` 个聚类。对于 K-NN，我们利用使用该方法全局创建的现有聚类。对于决策树，聚类在每个叶节点局部进行，具体如下。假设\
  \ `S` 为数据块大小。在决策树训练期间，当我们到达叶节点 `l[i]` 时，在该叶节点构建 `k[i] = (t[i]/S)*K` 个聚类，其中 `t[i]`\
  \ 表示最终落入叶节点 `l[i]` 的训练实例数量。\n\n##### 7.3.2.1.2 存储聚类摘要信息\n\n对于每个聚类，我们在内存中存储以下摘要信息：(i)\
  \ `权重`，`w`：定义为聚类中点的总数。(ii) `质心`，`ζ`。(iii) `半径`，`R`：定义为质心与属于该聚类的数据点之间的最大距离。(iv) `平均距离`，`μ[d]`：每个点到聚类质心的平均距离。聚类\
  \ `H[i]` 的聚类摘要今后将被称为“伪点” `ψ[i]`。因此，`w(ψ[i])` 表示伪点 `ψ[i]` 的权重。计算完聚类摘要后，丢弃原始数据。令 `ψ[j]`\
  \ 为分类器 `L[j]` 在内存中存储的所有伪点的集合。\n\n#### 7.3.2.2 异常值检测与过滤\n\n每个伪点 `ψ[i]` 对应特征空间中的一个超球体，其中心为\
  \ `ζ(ψ[i])`，半径为 `R(ψ[i])`。因此，伪点“记忆”了已用空间。我们用伪点 `ψ[i]` 的“区域”或 `RE(ψ[i])` 表示其覆盖的特征空间部分。因此，所有伪点覆盖区域的并集即为所有已用空间的并集，这为分类器\
  \ `L[j]` 形成了一个决策边界 `B(L[j]) = ∪ ψ[i]∈ψ[j] RE(ψ[i])`。现在，我们可以定义异常值了。\n\n**定义 7.2：(R\
  \ 异常值)** *设 x 为测试点，`ψ[min]` 为质心离 x 最近的伪点。若 x 在 `RE(ψ[min])` 之外，即其到 `ζ(ψ[min])` 的距离大于\
  \ `R(ψ[min])`，则 x 为 R 异常值（即原始异常值）。*\n\n换句话说，位于分类器 `L[j]` 的决策边界 `B(L[j])` 之外的任意点\
  \ `x` 均为该分类器的 `R 异常值`。对于 K-NN，通过针对所有伪点测试 `x` 来全局检测 `R 异常值`。对于决策树，`x` 仅针对其所属叶节点存储的伪点进行测试。\n\
  \n##### 7.3.2.2.1 过滤\n\n根据 定义 7.3，测试实例可能因以下一个或多个原因被错误地视为 `R 异常值`：(i) 测试实例属于现有类别，但它是噪声。(ii)\
  \ 发生了概念漂移，导致现有类别的决策边界发生了偏移。(iii) 决策树使用的训练数据不足。因此，预测的决策边界与实际边界不符。\n\n由于这些原因，需要对异常值进行过滤，以确保属于现有类别的异常值不会被最终判定为新类别实例。过滤过程如下：如果一个测试实例对集成中的\
  \ `所有` 分类器都是 `R 异常值`，则将其视为过滤后的异常值。所有其他 `R 异常值` 均被过滤掉。\n\n**定义 7.3：(F 异常值)** *若测试实例对所有分类器均为\
  \ R 异常值，则该实例为 F 异常值（即过滤后的异常值）。L[i]*\n\n直观上，成为 `F 异常值` 是属于新类别的必要条件。因为，假设实例 `x` 不是集成中某个分类器\
  \ `L[i]` 的 `R 异常值`。则 `x` 必定在决策边界 `B(L[i])` 内部。因此，它违反了性质 7.1（分离性），不可能属于新类别。虽然成为 `F\
  \ 异常值` 是必要条件，但并不充分，因为它不保证性质 7.1（内聚性）。因此，我们进入下一步，验证 `F 异常值` 是否同时满足内聚性和分离性。\n\n####\
  \ 7.3.2.3 检测新颖类别\n\n我们对 `F 异常值` 执行若干计算以检测新类别的到来。首先讨论这些计算的一般概念，随后描述如何高效地执行这些计算。对于每个\
  \ `F 异常值`，我们按如下方式定义 `λ[c]`-邻域（定义 7.4）：\n\n**定义 7.4：(λ[c]-邻域)** *F 异常值 x 的 `λ[c]`-邻域是属于类别\
  \ c 的 x 的 N 个最近邻的集合。*\n\n\n\n\n此处 `N` 为用户定义的参数。为简洁起见，我们将 `Foutlier x` 的 `λ[c]`\\\
  -邻域记为 `λc`。因此，`Foutlier x` 的 `λ+` 是距离异常值 `x` 最近的 `N` 个类别 `c[+]` 的实例的集合。类似地，`λo`\
  \ 指距离 `x` 最近的 `N` 个 `Foutliers` 的集合。这在 图 7.5 中有所说明，其中 `Foutliers` 显示为黑点，类别 `c[+]`\
  \ 和类别 `c[−]` 的实例用相应的符号显示。`Foutlier x` 的 `λ+` 是属于类别 `c[+]` 且距离 `x` 最近的 `N` (= 3)\
  \ 个实例的集合（圆圈内），以此类推。\n\n![图 7.5 λc\\-邻域，N = 3。](img/fig7_5.jpg)\n\n[图 7.5 λ[*c*]\\\
  -邻域，*N* = 3。](#ch07.xhtml#Ffig7_5)\n\n接下来，我们定义 `N`\\-邻域轮廓系数（`N`\\-NSC）（定义 7.5）。\n\
  \n**定义 7.5：** （**`N`\\-NSC**）*设 `a(x)` 为 `Foutlier x` 到 `λo` 中实例的平均距离，`bc` 为 `x`\
  \ 到 `λc` 中实例的平均距离（其中 `c` 为现有类别）。设 `bmin` 为所有 `bc` 中的最小值。则 `x` 的 `N-NSC` 由下式给出*：\n\
  \n```\nN - NSC(x) = \\frac{b_{\\min}(x) - a(x)}{\\max(b_{\\min}(x),a(x))} (7.1)\n\
  ```\n\n根据定义，`N`\\-NSC 的值介于 −1 和 +1 之间。它实际上是内聚度和分离度的统一度量。负值表明 `x` 更靠近其他类别（分离度较低）且远离其自身类别（内聚度较低）。如果至少存在\
  \ `N'` (> `N`) 个 `Foutliers` 且其 `N`\\-NSC 为正，则我们宣布发现一个 `new class`（新类别）。\n\n需要注意的是，`N`\
  \ 的值越大，我们判断新类别是否到达的置信度就越高。然而，如果 `N` 过大，当对应数据块中属于新类别的实例总数 ≤ `N` 时，我们也可能无法检测到新类别。我们通过实验找到了\
  \ `N` 的最优值，这在 第 7.4 节 中有所解释。\n\n##### 7.3.2.3.1 计算新类别实例的集合\n\n一旦检测到新类别的存在，下一步就是找出这些实例，并将其与现有类别数据分离。根据*必要且充分条件*，如果满足以下三个条件，则一组\
  \ `Foutlier` 实例属于一个新类别：(i) 该组中的所有 `Foutliers` 均具有正 `N`\\-NSC，(ii) 该组中的所有 `Foutliers`\
  \ 在该组内具有（注：原文此处似有省略，推测指“在该组内具有最近邻”或类似含义），以及 (iii) 该组的基数 ≥ `N`。设 `G` 为这样一个集合。注意，寻找精确集合\
  \ `G` 计算代价高昂，因此我们采用一种近似方法。设 `G'` 为所有具有正 `N`\\-NSC 的 `Foutliers` 的集合。如果 |`G'`| ≥\
  \ `N`，则 `G'` 是 `G` 的一个近似。`G'` 中的某些数据点可能实际上并非新类别实例，反之亦然。然而，在我们的实验中，发现该近似效果良好。\n\n\
  ##### 7.3.2.3.2 加速计算\n\n为每个 `Foutlier` 实例 `x` 计算 `N`\\-NSC 需要 `Foutliers` 数量的平方时间。为了加快计算，我们还使用\
  \ `K`\\-means 聚类从 `Foutliers` 创建 `K[O]` 个伪点，并在伪点上进行计算（称为 `Fpseudopoint`s），其中 `K[O]`\
  \ = (`N[O]`/`S`)∗`K`。此处 `S` 为数据块大小，`N[O]` 为 `Foutliers` 的数量。因此，计算所有 `Fpseudopoints`\
  \ 的 `N`\\-NSC 的时间复杂度为 `O(K[O]*(K[O] + K))`，这是常数级的，因为 `K[O]` 和 `K` 均与输入规模无关。注意，`Fpseudopoint`\
  \ 的 `N`\\-NSC 实际上是该 `Fpseudopoint` 中每个 `Foutlier` 的 `N`\\-NSC 的近似平均值。通过使用这种近似，虽然我们获得了速度，但也损失了一些精度。然而，正如实验结果所示，只要保留足够数量的伪点，这种精度下降可以忽略不计。新类别检测过程总结在\
  \ 算法 7.2 中（DetectNovelClass）。\n\n只要每个新类别遵循性质 7.1 且至少包含 `N` 个实例，该算法就能并发检测一个或多个新类别（即在同一数据块中）。即使类别分布倾斜，这也成立。然而，如果多个此类新类别同时出现，我们的算法将识别出属于这些类别的实例为新类别，而不对不同的新类别实例施加任何区分（即将它们简单视为“新类别”）。但一旦这些实例被标记并用于训练分类器，我们的模型就会学会这种区分。\n\
  \n##### 7.3.2.3.3 时间复杂度\n\n算法 7.1 的第 1–3 行需要 `O(KSL)` 时间，其中 `S` 为数据块大小。第 4 行（聚类）需要\
  \ `O(KS)` 时间，最后的 for 循环（5–10）需要 时间。因此，算法 7.1 的总体时间复杂度为 = `O(K*(S + SL + KL))`。假设\
  \ `S` >> `KL`，复杂度变为 `O(KS)`，这在 `S` 上是线性的。因此，MineClass 算法（算法 7.1）的总体时间复杂度（每个数据块）为\
  \ `O(KS + fc + ft)`，其中 `fc` 为对 `n` 个实例进行分类所需的时间，`ft` 为用 `n` 个训练实例训练分类器所需的时间。\n\n\
  ##### 7.3.2.3.4 演化类别标签对集成分类的影响\n\n读者可能已经意识到，数据流中新类别的到达会导致集成中的分类器拥有不同的类别标签集合。例如，假设集成中较旧（较早）的分类器\
  \ `L[i]` 是用类别 `c[0]` 和 `c[1]` 训练的，而较新（较晚）的分类器 `L[j]` 是用类别 `c[1]` 和 `c[2]` 训练的，其中\
  \ `c[2]` 是在 `L[i]` 训练完成后出现的新类别。这会对投票决策产生负面影响，因为较旧的分类器会将 `c[2]` 的实例误分类。因此，我们不是计算每个分类器的票数，而是按如下方式选择性地计算它们的票数：如果较新的分类器\
  \ `L[j]` 将测试实例 `x` 分类为类别 `c`，但较旧的分类器 `L[i]` 的模型中没有类别标签 `c`，则如果 `x` 被发现是 `L[i]` 的异常值，将忽略\
  \ `L[i]` 的投票。当最旧的分类器 `L[i]` 是用某个类别 `c'` 训练的，但没有任何较新的分类器是用该类别训练时，会出现相反的情况。这意味着类别\
  \ `c'` 已过时，在这种情况下，我们将 `L[i]` 从集成中移除。通过这种方式，我们确保较旧的分类器在投票过程中影响较小。如果类别 `c'` 稍后在数据流中重新出现，它将再次被自动检测为新类别。\n\
  \n## 7.4 评估\n\n### 7.4.1 数据集\n\n#### 7.4.1.1 仅含概念漂移的合成数据\n\n\n\n\n# 7.4.1 数据集描述\n\
  \n## 7.4.1.1 仅包含概念漂移的合成数据\n\nSynC 仅模拟概念漂移，不包含新类别。这样做是为了表明概念漂移不会在我们的方法中错误地触发新类别检测。SynC\
  \ 数据通过移动超平面生成。超平面的方程如下：\n\n```\nΣ^d[i=1] a[i] * x[i] = a[0]\n```\n\n如果 `Σ^d[i=1]\
  \ a[i] * x[i] <= a[0]`，则样本为负例，否则为正例。每个样本是一个随机生成的 d 维向量 `{x[1], …, x[d]}`，其中 `x[i]\
  \ ∈ [0, 1]`。权重 `{a[1], …, a[d]}` 也在范围 `[0, 1]` 内随机初始化为实数。`a[0]` 的值经过调整，使得生成的正负样本数量大致相同。这可以通过选择\
  \ `a[0] = Σ^d[i=1] a[i]` 来实现。我们还通过随机切换 `p%` 样本的标签来引入噪声，在实验中设置 `p = 5`。\n\n有几个参数用于模拟概念漂移。参数\
  \ `m` 指定涉及权重变化的总维度百分比，设置为 20%。参数 `t` 指定每 `N` 个样本的变化幅度。在实验中，`t` 设置为 0.1，`N` 设置为 1,000。`s[i]`（`i\
  \ ∈ {1, …, d}`）指定每个权重的变化方向。权重连续变化，即每生成一个样本后，`a[i]` 按 `s[i] * t / N` 进行调整。每生成 `N`\
  \ 个样本后，有 10% 的概率变化方向会反转。我们总共生成 250,000 条记录。\n\n#### 7.4.1.2 包含概念漂移和新类别的合成数据\n\n\
  这种合成数据同时模拟概念漂移和新类别。每个类别的数据点使用高斯分布生成，不同类别具有不同的均值（-5.0 到 +5.0）和方差（0.5 到 6）。此外，为了模拟数据流的演化特性，不同类别的概率分布随时间变化。这导致某些类别在不同时间出现，而其他类别消失。\n\
  \n为了引入概念漂移，某个百分比属性的均值以恒定速率发生偏移。与 SynC 数据集类似，这种变化率也由参数 `m`、`t`、`s` 和 `N` 以类似方式控制。\n\
  \n数据集经过归一化，使所有属性值落在范围 `[0, 1]` 内。我们生成的 SynCN 数据集包含 20 个类别、40 个实值属性，共 400K 个数据点。\n\
  \n#### 7.4.1.3 真实数据 – KDD Cup 99 网络入侵检测\n\n我们使用了该数据集的 10% 版本，它更集中，因此比完整版本更具挑战性。它包含约\
  \ 490,000 个实例。这里不同类别频繁出现和消失，使得新类别检测极具挑战性。该数据集包含从 MIT Lincoln Labs 为期两周的局域网流量中提取的\
  \ TCP 连接记录。每条记录指代正常连接或攻击。共有 22 种攻击类型，如 `buffer-overflow`、`portsweep`、`guess-passwd`、`neptune`、`rootkit`、`smurf`、`spy`\
  \ 等。因此共有 23 个不同的数据类别。大多数数据点属于正常类别。每条记录包含 42 个属性，如连接持续时间、传输字节数、root 访问次数等。我们仅使用 34\
  \ 个连续属性，并移除分类属性。该数据集也经过归一化，将属性值保持在 `[0, 1]` 范围内。\n\n#### 7.4.1.4 真实数据 – Forest Cover\
  \ (UCI 存储库)\n\n该数据集包含不同森林类型的地理空间描述。它包含 7 个类别、54 个属性，约 581,000 个实例。我们对数据集进行归一化，并安排数据，使得在任何数据块中最多共存\
  \ 3 个、最少共存 2 个类别，且新类别随机出现。\n\n### 7.4.2 实验设置\n\n我们使用 Java 实现算法。决策树代码改编自 Weka 机器学习开源存储库（`http://www.cs.waikato.ac.nz/ml/weka/`）。实验在配备\
  \ 2GB 内存和 3GHz 双核 CPU 的 Intel P-IV 机器上运行。除非另有说明，参数设置如下：\n(i) `K`（每个数据块的伪点数）= 50，\n\
  (ii) `N` = 50，\n(iii) `M`（集成大小）= 6，\n(iv) 数据块大小 = 合成数据集 1,000，真实数据集 4,000。\n这些参数值经过调优以达到整体满意的性能。\n\
  \n#### 7.4.2.1 基线方法\n\n据我们所知，没有方法能同时对数据流进行分类和检测新类别。因此，我们将 MineClass 与两种基线技术的组合进行比较：`OLINDDA`\
  \ [SPIN2007] 和加权分类器集成（`WCE`）[WANG2003]，前者作为新类别检测器，后者执行分类。对于每个数据块，我们首先使用在线新颖性与漂移检测算法（`OLINDDA`）检测新类别实例。数据块中所有其他实例假定属于现有类别，使用\
  \ `WCE` 进行分类。我们选择 `OLINDDA` 作为新颖性检测器，因为它是最近提出的算法，据 [SPIN2007] 显示，它在数据流新颖性检测技术中表现优于其他方法。\n\
  \n然而，`OLINDDA` 假设只有一个“正常”类别，所有其他类别都是“新颖”的。因此，它不能直接应用于多类新颖性检测问题，在该问题中，任意类别组合都可视为“现有”类别。我们提出两种替代方案。第一，我们为每个类别构建并行的\
  \ `OLINDDA` 模型，它们同时演化。每当新类别实例出现，我们就为该类别创建一个新的 `OLINDDA` 模型。如果**所有现有类别模型**都将测试实例识别为新颖，则该实例被判定为新颖。我们将这种基线方法称为\
  \ `WCE-OLINDDA_PARALLEL`。第二，我们最初用所有可用类别构建一个 `OLINDDA` 模型。每当发现新类别，该类别就被吸收进现有的 `OLINDDA`\
  \ 模型。因此，整个流过程中仅维护一个“正常”模型。这称为 `WCE-OLINDDA_SINGLE`。在所有实验中，这两种技术的集成大小和数据块大小保持相同。此外，`WCE`\
  \ 和 `MC` 使用相同的基学习器。`OLINDDA` 的参数设置为：\n(i) 每簇数据点数（`N[excl]`）= 15，\n(ii) 更新现有模型所需的最少正常实例数\
  \ = 100，\n(iii) 构建初始模型所需的最少实例数 = 30。\n这些参数根据 [SPIN2007] 中的默认值或通过试错选择，以获得整体满意的性能。此后我们将使用缩写：`MC`\
  \ 代表 MineClass，`W-OP` 代表 `WCE-OLINDDA_PARALLEL`，`W-OS` 代表 `WCE-OLINDDA_SINGLE`。\n\
  \n### 7.4.3 性能研究\n\n#### 7.4.3.1 评估方法\n\n我们使用以下性能指标进行评估：\n`M[new]` = 被误分类为现有类别的新类别实例百分比，\n\
  `F[new]` = 被错误识别为新类别的现有类别实例百分比，\n`ERR` = 总误分类错误率（%）（包含 `M[new]` 和 `F[new]`）。\n我们用前\
  \ `M` 个数据块在每种方法中建立初始模型。从第 `M + 1` 个数据块开始，我们先评估每种方法在该数据块上的性能，然后用该数据块更新现有模型。每种方法在每个数据块上的性能指标被保存并平均，以产生汇总结果。\n\
  \n#### 7.4.3.2 结果\n\n\n\n\n\n## 7.4.3.2 错误率分析\n\n图 7.6(a)–(d) 展示了各方法在不同数据集上，决策树分类器在数据流某一时间点前的错误率（ERR）。K\
  \ 近邻（K-NN）分类器也呈现出类似的结果。例如，当 `X` 轴 = 100 时，`Y` 值显示了各方法从数据流开始到第 100 个数据块的平均 ERR。此时，对于\
  \ KDD 数据集（图 7.6(c)），MC、W-OP 和 W-OS 的 ERR 分别为 1.7%、11.6% 和 8.7%。每个数据集中新类别的到达，在每个图表顶部边框对应数据块处用叉号（x）标记。例如，在\
  \ SynCN 数据集上（图 7.6(a)），W-OP 和 W-OS 漏掉了大部分新类别实例，导致它们的曲线在相应数据块处出现尖峰（如第 12、24、37 个数据块等）。W-OS\
  \ 几乎漏掉了 99% 的新类别实例。在 KDD 和 Forest Cover 数据集中，新类别出现的数据块处，W-OP 和 W-OS 也观察到类似的尖峰。例如，在\
  \ KDD 数据集的第 9–14 个数据块之间出现了许多新类别，其中大部分都被 W-OP 和 W-OS 漏掉了。注意，SynC 数据集没有新类别。MC 正确检测了大部分这些新类别。因此，MC\
