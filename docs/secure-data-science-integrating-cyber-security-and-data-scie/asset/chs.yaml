  \n# 13 面向隐私感知量化自我数据管理框架\n\nDOI: [10.1201/9781003081845-21](https://doi.org/10.1201/9781003081845-21)\n\
  \n## 13.1 简介\n\n虽然第一部分讨论了安全数据科学的基础技术，第二部分讨论了面向网络安全的数据科学，但第三部分侧重于安全且隐私感知的数据科学。具体而言，虽然第\
  \ 10 章和第 11 章讨论了针对数据科学技术的攻击，但第 12 章侧重于隐私保护数据科学。在本章（即第 13 章）中，我们将讨论如何强制执行策略，以构建一个面向量化自我应用的隐私感知框架。这项工作直接源于大数据安全与隐私研讨会关于隐私增强型大数据管理与分析的建议。特别是，我们关注在移动设备上收集的海量信息的隐私保护。\n\
  \n智能手机等移动设备已成为拥有数十亿用户的普及计算平台。智能手机应用下载量稳步上升，其中包括大量用于监测个人数据的应用，如健康、饮食摄入、运动和睡眠模式等。随着*量化自我*（*QS*）运动的最近兴起，可穿戴设备和智能手机应用收集的个人数据正被分析，以指导用户改善其健康或个人生活习惯。这些数据还通过基于云的服务与其他服务提供商（如零售商）共享，为用户带来潜在利益（如健康产品信息）。但此类数据收集和共享往往在用户不知情的情况下进行，存在个人数据可能被用于不当目的的严重风险。例如，监测血糖水平的设备收集的数据可能被保险公司用来拒绝为用户甚至用户的血亲提供承保。如果数据收集者能够将财务和健康相关数据与推文、Facebook\
  \ 活动及购买模式聚合，此类隐私侵犯很容易失控。这可能导致针对数据收集者的诉讼，并给个人带来心理和生理上的痛苦。为了应对这些日益严峻的挑战，我们迫切需要用于 QS\
  \ 应用隐私保护的工具和技术。\n\n我们的工作受第 13.2 节中讨论的示例和场景驱动，旨在解决该问题。具体而言，我们的目标是开发新型移动和基于云的数据存储架构，并结合创新的加密协议、访问控制技术、隐私增强技术、信息泄露分析和可用性分析，以安全地存储、处理和共享隐私敏感的\
  \ QS 数据，而不侵犯个人隐私。特别是，我们的目标是开发一个隐私感知的 QS 数据管理框架，控制 QS 数据的整个生命周期，并包含以下组件：(i) 隐私感知数据收集，(ii)\
  \ 隐私感知数据存储与访问，以及 (iii) 隐私感知数据分析/挖掘与共享。本章的组织结构如下：第 13.2 节描述我们的方法。第 13.3 节描述框架的高层设计；第\
  \ 13.4 节讨论新颖的方向，如信息共享的行为方面、形式化框架的开发方面，以及我们将此类框架应用于其他应用（如智能交通系统）的工作。第 13.5 节总结本章。图\
  \ 13.1 展示了本章讨论的这些概念。更多详情请见\\[THUR2018\\]。\n\n![Figure 13.1 Concepts discussed in\
  \ this chapter.](img/fig13_1.jpg)\n\n图 13.1 本章讨论的概念。\n\n## 13.2 隐私感知量化自我数据管理框架\n\
  \n### 13.2.1 动机场景\n\n海量数据正被收集、存储和分析，用于各种商业和营销目的。虽然此类数据分析对许多应用至关重要，但也可能侵犯个人隐私。本章描述了设计隐私感知数据管理框架以收集、存储和分析数据所涉及的问题。我们还讨论了数据共享的行为方面，以及基于重写规则、涵盖隐私感知数据管理框架的形式化框架方面。\n\
  \n\n\n\n\n为了解环境因素（如空气污染）和生活方式因素（如睡眠质量）对儿童哮喘发作的影响，美国国家卫生研究院（NIH）最近启动了“利用集成传感器监测系统的儿科研究（PRISMS）”计划。该计划的目标是“解决与集成监测系统数据集相关的重大数据科学和工具开发挑战，以推动我们对儿童哮喘环境决定因素理解的重要进展”[NIH2015]。作为该研究的一部分，预计监测设备将佩戴在儿童身上以收集其生活方式数据（如身体活动、血氧水平），并将这些生活方式数据集与环境（如儿童住所附近的空气污染）和医疗（如因哮喘发作住院的次数）数据集相结合，以更好地理解和预测哮喘发作。该\
  \ NIH 计划要求研究人员具备“确保数据安全并维护个人身份信息机密性的专业能力”，因为家长在参与此类研究前需要获得关于其孩子隐私的有力保障。同样，收集的关于员工的\
  \ QS 数据（如睡眠质量、活动数据）可用于预测员工压力水平并改善员工福祉，前提是采取了保护隐私的适当措施。根据普华永道（PwC）最近的一项调查，只有“超过一半的员工会考虑佩戴雇主提供的智能手表，如果他们的数据被用于改善工作时长、压力水平和工作地点等方面。”好消息是，根据调查，“如果数据被匿名化并在汇总层面共享，而不是个性化的，人们也更愿意接受这一想法。”这些例子展示了收集和共享\
  \ QS 数据以改善医疗结果和员工生产力的潜力，但前提是必须保护个人隐私。因此，我们需要一个框架来强制执行由用户隐私需求指导的适当隐私感知策略，以确定收集、存储和共享哪些数据，由谁、何时、何地、为何以及如何进行，同时还需要工具和技术来高效地执行这些策略，并从\
  \ QS 数据中获取尽可能多的效用。\n\n### 13.2.2 架构概览\n\n我们需要开发一个隐私感知的 QS 数据管理框架，以控制 QS 数据的整个生命周期（图\
  \ 13.2）。我们设想不同的数据源和设备将根据隐私感知数据收集策略，向运行在移动设备上的 `Data Collection Layer`（第 13.2.3 节）提供敏感信息。这些策略将指定设备何时、何地以及可以收集和存储什么数据。例如，自动捕获所有图像的设备（如\
  \ Narrative Clip [NARR2014]）可能不得在某些地点使用，如国际机场的入境身份核查区。此类数据收集限制将由运行在设备上的隐私感知数据收集管理器自动管理。\n\
  \n![Figure 13.2 Privacy-aware quantified self-architecture.](img/fig13_2.jpg)\n\n\
  图 13.2 隐私感知量化自我架构.\n\n在我们的平台中，我们假设只有移动设备是受信的，例如，它采用了智能手机安全的最先进技术，如容器化 [OLUW2015,\
  \ ASOK2013]，并被允许以明文形式访问所有传入数据；移动设备在控制释放什么信息方面扮演“守门人”的角色。然而，基于云的服务和运行在设备上的应用是不受信的。随后，收集的数据将被索引，并在传入的\
  \ QS 数据上本地计算某些统计信息（如过去 12 个月的日均睡眠时长）和基本数据分析功能（如两个数据流之间的相关系数）。随着收集数据的增多，设备上的存储空间将不足以存储所有数据。我们设想了一个加密云存储组件，用于将较旧的数据和/或不常访问的数据推送到云端。例如，先前活动拍摄的照片可能以加密形式存储在云端。将维护适当的本地索引，以便在需要时高效检索存储在云端的加密数据。此外，基于访问控制策略，运行在设备上的本地应用将被授予访问部分收集数据的权限。当需要时，这些应用将被允许通过简单的查询接口访问存储在云端的部分加密数据。我们强调，我们的架构不要求对任何现有应用或设备进行更改。例如，如果用户乐于使用\
  \ Fitbit 应用，用户可以继续按原样使用它。另一方面，利用 Fitbit 提供的应用程序编程接口（API），运行在移动设备上的代理可以收集必要的活动数据，并将其与移动设备收集的位置数据相结合，以执行某些策略或启用其他应用。我们需要利用设备制造商提供的\
  \ API 开发一个集成不同类型数据的概念验证架构。\n\n`Data Storage and Access Layer` 还将处理数据生命周期的管理。在某些情况下，数据可能不再需要以细粒度形式保存。例如，存储\
  \ 20 年前的每日体重数据可能是不必要的；相反，存储和挖掘月均体重数据可能足以支持各种医疗应用。在其他情况下，为了保护隐私，数据可能必须被删除（例如，删除和/或生成虚假位置数据以隐藏用户参加过抗议活动的事实）。此类数据删除策略将由存储层自动管理，并将使用定量信息流分析来分析此类删除的潜在隐私影响（例如，仅删除敏感信息可能会产生一些推理侧信道）。由于人们经常更换或丢失移动设备，我们设想存储在移动设备上的信息将使用另一家云服务提供商持续备份。因此，如果移动设备丢失，可以使用加密备份副本设置新的移动设备。当然，云服务提供商需要确保存储的加密数据可靠可访问\
  \ [KIRK2010]。\n\n\n\n\n架构的另一个关键组件是一组安全且隐私感知的机制，用于挖掘和共享收集的数据（即数据分析/挖掘与共享层）。我们设想此类数据共享和挖掘将利用云中运行的服务来进行。根据不同场景，部分数据可原样发送（例如，用于医疗诊断的心率数据），部分数据将在清洗后发送（例如，基于随机响应的技术\
  \ [ERLI2014] 以隐藏用户的真实响应），部分数据将以加密格式发送，从而按需支持精确数据挖掘结果的分布式计算。为提供此类能力，我们需要开发新方法，将基于云的分布式数据挖掘、安全多方计算技术与移动设备端的数据清洗、随机响应、高效流预处理和本地数据缓存相结合。我们框架中的主要假设是移动设备是可信的。除此之外，若研究表明有不同需求，我们的架构可轻松修改。本项目的一大贡献将在于理解如何在保护隐私的前提下，最佳地整合运行在设备端和云端的不同组件。\n\
  \n### 13.2.3 相关工作\n\n我们的工作涉及许多不同主题，范围涵盖从个人数据存储到访问控制策略问题。在本节中，我们将在量化自我数据生命周期（即 QS\
  \ 数据的采集、存储和共享）的背景下讨论一些先前的研究。\n\n#### 13.2.3.1 访问控制策略、隐私与可用性\n\n先前关于访问控制策略的工作未解决个人数据持续收集的问题。唯一专注于移动设备收集的个人数据的先前工作是\
  \ FENCE 系统（即“动态数据流环境中的持续访问控制强制”）[NEHM2013]，由本项目负责人及合作者提出。然而，FENCE 不将上下文信息与策略关联，因此无法自动选择要与特定数据关联的策略。先前关于移动操作系统安全性的工作侧重于限制应用程序访问敏感数据和资源，但缺乏根据细粒度上下文强制执行这些限制的高效技术，而这些上下文能区分位置紧邻的子区域\
  \ [CONT2011]。此外，这些工作大多侧重于开发不按应用程序限制权限且仅在系统范围内有效的策略系统 [KUSH2011]。而且，现有的策略系统并未涵盖应用程序访问用户数据和设备资源的所有可能方式。最后，现有的基于位置的策略系统仅提供单一机制（如专用硬件或定位设备）来检测位置\
  \ [CONT2011, KIRK2010, KUMA2009]。在大多数情况下，此类系统假设上下文已给定，而未提供或评估移动设备的上下文检测方法 [CONT2011,\
  \ GUPT2012]。\n\n与隐私和访问相关的策略规则设定是一个在计算机科学和人机交互的多个领域均被研究的课题，包括系统访问控制、组织隐私策略 [ANTO2007]\
  \ 以及在线社交网络的策略管理 [CHEE2012]。这些领域的研究考察了用户对策略的理解，以及如何以用户易于理解的方式呈现隐私信息。总体而言，用户对任何类型的策略理解都不甚透彻\
  \ [STRA2008, VU2007]，且极少愿意投入时间和精力去尝试理解它们。用户是否会从互联网供应商处购买产品，受供应商提供的个人数据感知安全性影响 [FLAV2006]。同理，允许个人数据更广泛地共享，预期将取决于对这种共享将按预期进行且未经授权的访问将被阻止的信任。社会学和理论文献强调了对上下文的感知对数据流适当性的重要性，正如我们设计中设想的那样\
  \ [NISS2009]。\n\n研究人员致力于开发隐私和安全的替代机制，以降低用户的认知负荷，同时使其能够做出知情决策。在策略编写方面，已有证据证明基于模板的方法有效\
  \ [JOHN2010a, JOHN2010b]。此类方法通过提供模板（由策略专家和领域专家开发），将整体任务分解为由相关策略要素组成的子任务，从而降低了策略编写者的认知负荷。降低认知负荷也是\
  \ Privacy Bird 工具背后的理念，该工具旨在提供信号（红、黄、绿小鸟），指示网站策略在用户向网站输入信息前是否与用户指定的偏好一致 [CRAN2006]。实验室和众包研究表明，当提供汇总风险评分时，用户倾向于做出风险较低的应用选择决策，特别是当该信息以与应用相关的安全程度形式传达时\
  \ [CHEN2014, GATE2014]。\n\n#### 13.2.3.2 个人数据存储\n\n近期已有努力管理智能手机收集的个人数据。最著名的努力之一是\
  \ OpenPDS 项目，该项目为移动平台提供了个人数据存储的开源实现 [MONT2014]。同样，Mydex 等公司 [MYDE2014] 提供基于云的个人数据存储。最近，Apple\
  \ 发布了名为 Health 的应用 [APPL2014]，以支持在移动设备上存储健康和健身数据。据我们了解，此类系统并未以安全方式将移动设备与云存储集成，以支持广泛的数据访问和/或查询功能，且基于云服务提供商可信的假设工作。安全处理存储在云中的\
  \ QS 数据的一种方式是：在将数据移至云端前对其加密，并对加密的 QS 数据执行安全分析。尽管研究界在开发允许对加密数据进行某些计算的加密方法方面取得了显著进展，例如可搜索加密技术（如\
  \ [CURM2011, GOH2003, STEF2014]）、保序加密（如 [BOLD2009]）、全同态加密（如 [GENT2009]）以及实用的混淆 RAM\
  \ 技术（如 [STEF2012, STEF2013]）——但针对 QS 数据存储场景的通用且具成本效益的解决方案尚未出现。在本项目中，我们将在 QS 数据云备份的背景下，最大程度利用现有的加密进展。特别是，我们将重点关注如何最佳利用移动设备存储和设备端的潜在数据处理，以实现高效的隐私保护\
  \ QS 数据处理。\n\n#### 13.2.3.3 量化自我数据挖掘\n\n\n\n\n#### 13.2.3.4 差分隐私与隐私保护数据挖掘\n\n最近，已经开发了许多差分隐私数据挖掘工具，范围涵盖从通用的差分隐私统计估计框架（如\
  \ `[DWOR09]`）到机器学习算法，如差分隐私支持向量机（如 `[CHAU11]`）。尽管这些发展非常有趣，但它们并不直接适用于我们的情况，因为它们假设数据已经收集在由管理员控制的数据库中。另一方面，最近基于随机响应的差分隐私数据收集技术\
  \ `[ERLI2014]` 是相关的，但尚不清楚如何利用此类随机响应思想来挖掘 QS 数据。作为该项目的一部分，我们将扩展结合分布式加密协议（如 `[DWOR2006]`）的噪声添加技术，以产生差分隐私数据挖掘结果，并利用云基础设施通过将部分工作委托给基于云的服务来扩展至数百万个体。我们在隐私保护分布式数据挖掘方面的工作已经探索了如何利用加密技术从不同参与方挖掘数据（如\
  \ `[KANT04]`）。许多现有的隐私保护分布式数据挖掘协议隐含地假设参与方的数量很少。将这些协议扩展到潜在的数百万移动设备仍然是一个重要的挑战。我们需要通过将点对点加密协议与基于秘密分享技术的安全外包计算相结合，来应对这些挑战。\n\
  \n## 13.3 框架的高层设计\n\n### 13.3.1 隐私感知数据收集\n\n用户通常在公共和私人场所以及各种不同情境下携带和使用他们的智能手机和其他个人设备，其中一些情境涉及隐私敏感。例如，用户很可能认为身处医院或医生办公室属于个人敏感信息。因此，我们必须允许用户指定策略，限制在哪些情境下可以收集哪些数据。这些策略允许个人针对其自身个人数据的收集指定他/她自己的个人隐私策略。策略必须与数据紧密耦合，因为策略可能会随时间变化，并且出于问责原因，跟踪数据收集时所依据的策略非常重要。此外，在许多情境下，用户并不孤单；因此，某些设备的使用可能必须被阻止或控制，因为这些设备可能会记录关于其他用户的信息，从而侵犯他们的隐私。而且，企业和其他组织可能禁止其员工和访客携带或使用带摄像头的设备进入工作场所，包括智能手机，即使员工可能需要随时携带设备（例如，员工使用其设备存储与其健康相关的信息）。此外，对于揭示敏感设施位置甚至布局的聚合数据和个人数据（如美国境外军事基地内的健身数据\
  \ `[SLY2018]`），需要默认隐私策略。因此，我们需要细粒度的基于情境的访问控制策略，通过这些策略可以阻止设备内的某些设备或资源获取数据。我们将这些策略称为\
  \ `context-based device resource usage policies`（基于情境的设备资源使用策略）。支持这两类策略执行的一个基本要求是支持情境信息获取。此外，需要分析此类收集决策以解决潜在的隐私影响（例如，不收集图像可能会泄露用户身处敏感位置）。为了应对上述挑战，我们需要设计一个隐私感知数据收集系统。我们的高层设计由以下四个组件组成：\n\
  \n1.  **用于指定基于情境的数据收集策略和基于情境的设备资源使用策略的策略语言**：此类语言的一个关键要素是用于指定情境的构造。正如 Nissembaum\
  \ `[NISS09]` 所讨论的，信息处理的适当性最好通过披露的情境语境来判断。尽管她的工作并未涉及个人数据的具体案例，但我们认为她的思想很好地映射到了我们的\
  \ QS 数据概念上。我们的基于情境的策略语言概念及相应的执行引擎，是我们将这一思想引入系统的方法。我们需要支持三种不同类型的情境：位置、时间和情况。情况是指特定应用的情境，例如用户当前正在从事的任务。对于所有情境类型，我们将允许用户将符号名称与特定情境关联。例如，考虑一家位于某城市特定街道的医院。该医院可以用多种方式表示，例如使用地理坐标或邮政地址。然而，用户将其简略名称与该医院关联会更容易。我们的策略语言将支持用于指定情境的不同构造，还支持复杂情境的指定，通过它可以组合不同类型的情境，并将结合社交约束，即附近其他用户的缺席和/或在场会影响数据收集过程\
  \ `[KIRK2011]`；一个例子是指定只有在无其他人在场时，才能在给定位置获取图像的策略。\n\n\n\n\n\n#### 2. 一个用于根据我们的策略语言制定策略的策略编写工具\n\
  \n该工具将提供一个易于使用的界面来制定策略，以及一种导入策略的机制（例如，必须在用户设备上强制执行的企业策略）。我们需要利用现有的“示例策略”研究成果 [CHEE2012]；然而，这种方法是为社交网络开发的，主要处理对好友进行分组以分配权限。我们需要借用“示例策略”的概念，并将其调整以适应我们的场景。编写工具还将支持基于图形的位置界面，用于指定位置信息。\n\
  \n#### 3. 一个灵活的位置和在场检测机制\n\n我们需要开发一套用于检测用户位置的机制，以便根据位置类型（如封闭/开放位置）以及可用的网络和传感设备，使用最方便的机制。我们的位置检测系统将利用基于\
  \ Wi-Fi 的定位技术来检索设备位置。除了这些技术外，我们的系统还将收集从 GPS 和蜂窝网络检索到的位置数据，以应对关注区域没有 Wi-Fi 覆盖的情况。作为系统的一部分，我们将开发一个用户专属的\
  \ Wi-Fi 接入点数据库，记录用户访问过的区域，从而允许用户为这些区域关联名称并在策略中引用它们。关于在场检测，我们将开发基于近场通信 (NFC) 技术 [KIRK2011]、物理访问控制、运动传感器、监控设备及其他方法\
  \ [GUPT2012] 的机制。\n\n#### 4. 一个策略执行引擎\n\n该引擎位于设备中，将负责执行策略。一个主要挑战是执行那些要求在特定情境下不得使用设备上某些资源的策略。我们的初步方法将在\
  \ Android 上解决此问题，并利用我们在 IdentiDroid 匿名系统 [SHEB2014, MIDI2014] 中关于动态撤销 Android 权限的先前工作。在我们的系统中，一个主要挑战是必须根据情境动态撤销或恢复权限，而在\
  \ IdentiDroid 中，切换是在用户需要进入或退出匿名模式时执行的。\n\n需要进行详细分析，以识别特定于我们目标环境的隐私问题，该环境由每个人对自己进行的连续/普适个人数据收集组成。此外，我们需要探索设计以下内容的方法：\n\
  \n#### 1. 面向隐私感知数据收集的策略语言\n\n我们需要开发一种策略语言，作为著名的 XACML 标准 [XACM2005] 的扩展。\n\n###\
  \ 2. 策略编写工具\n\n我们需要调整或开发一个用户友好的工具，支持用我们的语言表达的策略规范。一种可能性是使用具有高层信息表示的对话代理 [PARI2012]。该工具需要支持基于用户反馈和策略覆盖的策略分析和演进。该工具还需要支持策略集成，支持合并不同的策略（例如，关于在办公室工作时可以捕获什么数据的企业策略，以及用户定义的个人策略），并包含用于策略冲突解决的简单机制和默认设置。\n\
  \n### 3. 位置和在场检测机制\n\n我们需要为智能手机等设备设计位置检测机制。\n\n### 4. 策略执行引擎\n\n我们需要设计引擎来应用策略。引擎设计中的一个重要挑战是确保策略不被（可能的）恶意用户绕过，在企业策略的情况下，是指不想遵守策略的用户，或者是目标收集用户私人数据的恶意软件。为了应对此类挑战，我们需要集成和扩展可信平台管理\
  \ (TPM) 技术、容器化技术，以及最初为保护数据免受内部威胁而开发的应用程序剖析技术 [HUSS2015]。\n\n### 13.3.2 面向隐私的数据存储与访问\n\
  \n在从不同传感器（如健康监测仪）、设备（如 Narrative Clip 生活记录仪）和移动源（如移动设备用户发送的推文和短信）收集 QS 数据后，我们需要存储这些数据以进行挖掘和分析，从而提取有趣的模式。在某些情况下（例如，将位置数据与空气质量数据相关联以了解长期哮喘趋势），根据策略存储所有捕获的数据可能具有长期价值。存储此类收集的数据带来了有趣的研究挑战。首先，目前正成为所有捕获数据中心的智能手机可能无法在设备上存储所有数据。为了解决智能手机的存储限制，可以利用云存储。许多移动设备支持自动云备份和存储机制。例如，iPhone\
  \ 自带基于 iCloud 的默认数据备份支持。不幸的是，正如近期事件所示 [DUKE2014]，以明文格式存储在云中的隐私敏感数据可能容易受到攻击。在将此类数据移至云端之前对其进行加密可以防止其中一些攻击，但直接的数据加密会导致许多查询执行和数据检索挑战。查询加密数据的最新进展可被利用，以实现安全的云数据存储，同时允许选择性地检索数据，但仍存在需要解决的重要挑战，以满足各种\
  \ QS 应用的需求。现有技术如范围查询（例如 [SHI2007]）、关键词搜索（例如 [CURM2011, GOH2003, STEF2014]）、基于属性的加密（例如\
  \ [WANG2010]）和全同态加密（例如 [GENT2009]），不能直接支持诸如“查找在纽约市拍摄的、画面中有吉姆的照片”这样的查询。在利用智能手机能力的同时，改进和优化现有的加密数据查询技术，仍然是一个重要的研究方向。正如我们稍后将讨论的，我们计划通过从\
  \ QS 数据中提取重要特征，然后修改现有的可搜索加密技术以适应这些提取的特征，来应对这些挑战。\n\n另一个重要需求是支持为用户提供有价值服务的移动应用。考虑一个访问运动数据以自动提取睡眠模式并将其与体重信息相关联，从而了解体重对睡眠模式影响的应用。为了支持此类应用，我们可能只想提供晚上的运动传感器数据，隐藏白天的活动模式。提供对收集的\
  \ QS 数据的细粒度访问，将是在保护隐私的同时允许有用的 QS 应用的第一步。考虑到可能结合不同类型的 QS 数据以提供增值服务的潜在应用数量众多，使用户能够为每个应用定义访问控制策略成为一项挑战。理解用户对易用机制的需求至关重要；否则，用户最终将不会使用细粒度的访问控制策略。\n\
  \n\n\n\n#### 隐私感知的数据存储与访问系统\n\n最后，永久保留所有收集的数据会带来严重的隐私挑战。例如，永久记录所有位置数据可能会让恶意应用或恶意方推断出多年前用户移动模式的重要信息。为了增强隐私，我们设想了一些场景，用户可能希望根据预定义的条件删除某些信息。例如，用户可能希望在一段时间（如\
  \ 10 年）后，删除访问特定地点（如拉斯维加斯）期间捕获的某些信息（如拍摄的照片）。当然，要实现这种安全的数据删除，需要我们追踪数据的存储位置。为了支持自动化的\
  \ QS 数据删除策略，需要高效的技术来追踪和删除敏感数据。\n\n为了应对上述挑战，我们需要设计一个**隐私感知的数据存储与访问系统**。我们的高层设计如 图\
  \ 13.3 所示，来自不同来源的所有数据将首先在移动设备上进行处理和存储。本地存储将在本地（即智能手机上）保留不同类型的索引，以帮助查询存储的数据。此外，该框架将管理不同移动应用的数据访问策略。我们需要使该框架与现有工作（如\
  \ `OpenPDS` [MONT2014]）兼容，以便通过使用基本机制访问存储的数据，在框架之上运行多个不同的应用。随后，随着移动设备存储空间被占满，部分存储的\
  \ QS 数据将通过不同的启发式算法推送到云端。例如，上个月的心率数据可能会以加密格式推送到云端。在此操作之前，相应的本地索引将被更新，以便日后轻松检索。此外，本地构建的模型将被保留以支持特定任务。例如，即使底层数据通过流处理技术转移到了云端，用于发现心率异常的时间序列模型仍可在本地更新。另外，框架将记录哪些应用访问了哪些数据（即保留基本的来源信息），以便于未来的数据删除。显然，实现这样一个框架需要我们解决许多研究挑战。下面，我们总结了需要探索的活动。\n\
  \n#### 1. QS 数据的安全长期存储\n\n我们设想，一个典型用户在其一生中可能会生成数 TB 的数据。基于当前智能手机的能力，显然无法在本地存储所有数据。同时，正如前面讨论的，我们必须以加密格式将数据推送到云端，以保护个人隐私。我们需要探索如何将现有的可搜索加密技术无缝应用于查询本地和（加密的）云端数据。由于大多数\
  \ QS 数据将基于时间和位置进行索引、查询和访问，我们将首先针对不同类型的 QS 数据，在这两个维度上构建加密索引。为了能够利用现有的关键词搜索技术，我们需要对每个维度进行离散化（例如，按天、月、年对时间进行离散化），并将给定的搜索转换为关键词搜索和/或简单的一维范围查询搜索。这种简单的方法将为我们提供基于位置和时间的数据查询基本能力。这种加密查询可能构成从\
  \ QS 数据构建数据挖掘模型的基础。此外，我们需要探索在 QS 数据推送到云端之前，预先计算数据上某些有趣函数的方法。例如，可以使用人脸检测算法自动检测给定图像中的人脸。随后，与检测到的人脸相关的信息可被插入适当的索引中，以实现快速图像检索。我们需要探索从数据中预计算各种有趣特征（例如，给定图像中的人脸、传感器信息的移动平均值），以构建索引，从而利用现有的范围和关键词搜索技术，实现对云端加密数据的快速检索。\n\
  \n#### 2. 面向 QS 应用的安全且隐私感知的查询接口\n\n为了支持广泛的应用，我们需要为应用提供访问存储数据的接口。应用使用的某些数据可能需要从云端和本地移动存储中同时检索。在此数据访问过程中，我们要确保应用仅以不侵犯个人隐私的粒度访问数据。以安全且保护隐私的方式为\
  \ QS 应用提供全功能的查询语言支持（如 `SQL`）可能代价过高。我们需要探索简单的接口（例如 `SQL` 的一个受限子集），使应用能够在简化访问控制和隐私策略执行要求的同时，提供增值服务。我们还需要探索聚合技术（即披露聚合结果以隐藏敏感数据）和噪声添加技术（即本地差分隐私技术）。\n\
  \n#### 3. 可用性/人因\n\n由于最终用户必须通过界面来定义策略、设置数据管理选项，并为自己的目的使用数据，因此界面的设计必须符合人类的认知能力。至关重要的是，用户需要理解应用/推荐器给出的推荐和建议。我们需要利用我们在处理组织隐私策略的理解和用户隐私偏好的规范\
  \ [PROC2007]，以及对 Android 应用请求权限的理解 [GATE2014] 方面的知识和经验，来设计和评估界面，使其对于参与 QS 数据生命周期不同阶段的不同类型用户来说，都易于使用且直观。\n\
  \n\n\n\n#### 4. QS 数据删除/清洗支持\n\n正如我们之前讨论的，出于隐私和效率原因，我们可能希望删除或清洗部分数据。评估数据删除或清洗的效率影响很简单，但评估其对隐私的影响更具挑战性。*William\
  \ Weld 重识别* [SWEE2002] 就是一个惊人的例子，仅将记录清洗至（出生日期、性别、邮政编码）并不能防止该事件。一种富有成效的方法是研究特定清洗手段针对特定对手的有效性\
  \ [HEAT2013]。但我们认为，通过定量信息流分析可以实现更强的隐私保证。其思路是将删除/清洗机制视为一个信息论信道，该信道接收原始数据并输出清洗后的数据。该信道的泄露量量化了清洗手段针对任意对手的有效性。正如\
  \ 13.2.2 节 所讨论的，一个挑战是存在*许多*泄露度量，具体取决于操作场景，哪个最合适可能不同。因此，专注于*最小容量* 很有吸引力，根据 [ALVI2012]\
  \ 的奇迹定理，它是所有场景下泄露的上界。最小容量也相对容易计算；例如，在确定性信道的情况下，它只需计算可行信道输出的数量。以（出生日期、性别、邮政编码）信道为例，可行输出的数量可粗略估计为约\
  \ 2.4 亿。（大约有 40,000 个邮政编码，每个邮政编码的平均人口约为 8000 人，即每种性别约 4000 人。由于有 36,500 个可能的出生日期，我们可以假设某一邮政编码内每种性别的\
  \ 4000 人大多拥有不同的出生日期，从而得到 40,000 × 2 × 3000 = 2.4 亿个可行输出。）因此，如果秘密是一个均匀分布的美国人，该信道会使其被正确猜测的脆弱性增加\
  \ 2.4 亿倍，导致后验脆弱性为 240/320 = 0.75，表明这种清洗完全不充分。我们随后需要开发具有较小最小容量的清洗机制，从而能够精确陈述它们提供的隐私保护。一个挑战是秘密之间可能存在*相关性*。[ALVI2014]\
  \ 给出了任意相关性存在下的一些泄露界限，但我们需要进一步探索这一点。关于数据清洗的更多细节见 [RACH2013, RACH2014a, RACH2014b]。\n\
  \n![图 13.3 存储架构。](img/fig13_3.jpg)\n\n图 13.3 存储架构。\n\n### 13.3.3 隐私感知数据分析与共享\n\n\
  我们认为，要从 QS 数据中创造更多价值，需要在存储和查询框架之上支持更多功能。每个人收集的个人数据可以以不同方式使用，以造福个人、他人和整个社会。例如，通过收集和聚合数百万人的运动活动数据与血压数据，可以轻松开展大规模医学研究项目，以了解规律运动对高血压的影响。然而，即使个人有动机共享数据，隐私顾虑也可能阻碍这种共享。因此，支持隐私感知共享至关重要。因此，我们需要允许指定和演进访问控制策略的技术，以支持与其他个人选择性地共享个人数据。\n\
  \n在某些场景中，直接允许应用访问哪怕是数据的一个子集也可能泄露敏感信息，因此我们可能希望共享本地挖掘出的结果。例如，可以在本地挖掘传入的 QS 数据以发现有趣的关联规则（例如，用于录入饮食信息的健身应用可能与血压测量数据相结合以发现关联）。这样，我们可以将应用的访问权限限制在少数数据挖掘或查询结果上（例如，本地关联规则结果）。此外，用户的数据可以由第三方开发的应用在本地挖掘，但仅当用户明确批准共享结果时才可共享。\n\
  \n此外，来自不同个人的数据可能需要集成，以创建聚合/样本级/人口级模型。促进此类数据共享的一种方法是使用洋葱路由等技术（例如使用 Tor [DING2004]）发送数据，以避免数据被关联到捐赠数据的个人。然而，关于可识别性的先前研究\
  \ [SWEE2002] 明确表明，即使数据不包含标识符并使用洋葱路由发送，仍可用于识别个人。另一种选择可能是向数据添加噪声，使共享数据变得不那么准确（例如，随机响应类型应用\
  \ [ERLI2014]），从而降低对个人造成负面结果的可能性。我们认为，需要探索适用于 QS 数据并能支持大量应用的正确技术组合。特别重要的是要有合适的隐私感知技术，并提供工具和指南，使个人能够权衡隐私风险与个人收益。\n\
  \n最后，正如本章前几节所示，为了使数据共享方案实现其为个人用户强制执行个性化隐私策略的目标，界面需要设计为满足用户需求并做到“用户友好”。为了让用户允许数据共享，他们必须相信其数据将按照其意愿受到保护，且不会面临泄露和攻击的风险。此外，用户必须能够理解策略管理选项，以便了解他们的选择及其可能的后果。由于这些选项涉及可收集的数据及其收集场景，以及谁将被允许访问其数据，用户进行策略指定必然是一个复杂的过程。因此，用户定义其策略和设置数据管理选项所需的界面交互应尽可能简单直接，并允许个性化。并非所有用户都希望对其个人信息进行详细控制，因此界面需要支持不同粒度级别的决策，并提供大多数用户可接受的智能默认设置。智能默认设置至关重要，因为大多数用户不会更改隐私/安全设置（例如，>90%\
  \ 的 Google 账户未启用双因素认证 [SULL18]）。\n\n\n\n\n\n我们的数据共享高层设计由多个组件组成。第一个组件包含一个个人访问控制系统，支持对个人数据的访问控制策略进行规范和强制执行，以及不同策略的演进与合并，范围涵盖从基于事件的共享到个人为研究捐赠数据。访问控制系统还将包含一个创作工具。第二个组件是一个能够处理已清洗数据的数据挖掘系统。一个重要问题是评估从匿名数据集衍生出的数据挖掘模型的质量。更重要的是，必须确定是否以及如何利用每个用户的非匿名个人数据来优化基于大规模人群构建的数据挖掘模型，或者由这种公共数据挖掘系统获得的预测能否与本地数据挖掘系统获得的推荐相结合（即基于特定用户数据的本地数据挖掘系统）。目标是基于多用户的清洗数据创建全局数据挖掘模型，然后为每个特定用户个性化这些模型。\n\
  \n我们需要构建一个框架，在该框架中，来自不同来源的 QS 数据流将在本地进行分析。利用移动设备的计算能力，将计算个人的重要统计数据以及数据挖掘模型。此外，根据需要，将使用前面讨论的加密查询机制来检索云中存档的数据，以改进本地模型和统计数据。随后，这些模型和统计数据将根据用户注册的策略和事件进行共享。我们还需要开发基于云的安全分布式数据挖掘技术，以允许个人安全地捐赠和/或出售数据以满足各种数据挖掘需求。根据数据共享策略，将自动提交给数据挖掘模型的数据将被自动提取。在某些场景中，数据还将利用来自对等节点的信息进行聚合（即来自附近朋友的信息）。在某些情况下，在与基于云的服务共享之前，信息将通过添加噪声进行清洗（例如，利用基于随机响应的差分隐私技术\
  \ [ERLI2014]）。这些本地计算的信息将使用秘密分享技术 [CRAM2000, CRAM2003] 与位于公共云上的多台服务器共享，并使用 Tor [DING2004]\
  \ 等服务，使得将数据关联回特定个人变得更加困难。一旦数据通过秘密分享机制发送到多台服务器，服务器之间将执行基于秘密分享的安全协议，以构建人口层面的数据挖掘模型。为了扩展到大量用户，我们计划结合有效采样和随机响应技术，并结合基于秘密分享的安全多方计算思想。例如，我们可能希望结合特定子人群（例如，患有高血压的\
  \ 65 岁以上人群）的用户数据来构建线性回归模型。如果用户 `i` 使用其数据向量 `x[i]` 参与系统，其中 1 ≤ `i` ≤ `n`，我们可以将数据挖掘过程写为线性回归函数\
  \ `f` 的安全多方评估：`f(I[C(x[1])].x[1], I[C(x[2])].x[2], …, I[C(x[n])].x[n])`，其中 `I[C(x[i])]`\
  \ 是描述用户数据选择条件的指示函数。首先，既然这是一个数据挖掘模型，为了具有统计显著性，我们可能不需要获取所有样本。给定选择条件 `C`，我们可以估计满足条件\
  \ `C` 的用户数量 `t`，如果 `t` ≫ `s`，其中 `s` 是统计显著性所需的样本数量，那么我们可以以概率 `s/t` 从匹配该条件的用户群体中进行子采样，以减少在\
  \ SMC 阶段秘密分享的数据量。当然，在进行采样时，我们可能会泄露哪些用户匹配条件 `C`。为了防止这种情况，我们也可能希望从不满足条件 `C` 的用户中进行采样。采样率可以调整以平衡个人隐私保护与效率。一旦在此采样步骤后选定用户数据，可以使用噪声添加技术或与多台服务器的秘密分享技术将数据发送到基于云的基于秘密分享的\
  \ SMC 框架。在某些情况下，这些构建的模型将被发送回用户，以便在本地进行定制，从而提高其对用户的效用。\n\n最后，为了从人因角度研究数据共享，我们需要采取多方法途径，即使用包括访谈、调查、实验室实验和众包实验在内的多种方法，在自然和受控环境中获取定性和定量数据\
  \ [PROC2007]。这些信息将用于确定智能默认值。我们需要利用我们在普渡大学接触各种用户群体的优势，并通过其信息保障与安全教育研究中心（CERIAS）合作伙伴，在与\
  \ QS 数据存储特定问题最相关的群体上开发和测试我们的界面设计概念。对于需要大量经验丰富的计算机用户样本的研究，我们将在 Amazon Mechanical\
  \ Turk (MTurk) 上进行研究，以获取绩效指标以及调查和人口统计信息，就像我们在应用选择研究中所做的那样 [CHEN2014, GATE2014]。作为我们方法的第一阶段，我们将通过确定与\
  \ QS 数据存储相关的风险和收益（包括考虑可能产生这些风险的法律规则（如搜查令）或避免这些风险的法律规则（如《健康保险流通与责任法案》[HIPAA] 等法规中对某些数据处理实践的禁令））来识别与个人数据共享相关的人因问题。作为下一阶段，我们将确定典型用户是否意识到这些风险和收益，并认为它们是实质性的。第三阶段将是评估指定个人隐私策略所涉及的可用性问题。该阶段的核心重点将是关注在规范过程中以可理解的方式呈现策略信息的方法。我们不仅需要评估替代界面的可用性，还要评估用户是否准确理解其策略规范允许和不允许的内容。以下六项概述了需要探索的活动。\n\
  \n#### 面向个人数据的风险感知访问控制系统\n\n该系统将包含一个基于 XACML 标准扩展/定制的策略语言，用于策略规范；一个能够合并和演进访问控制策略的策略创作工具；以及一个策略执行引擎。此外，我们还将探索定量方法来分析和量化共享\
  \ QS 数据的风险，并根据现有风险自动调整策略。在我们过去的工作 [BENS2014] 中，我们在共享大型数据集的背景下探讨了基于风险的数据共享问题。我们需要将人类受试者实验中捕捉到的风险接受行为整合到定量模型中，以更好地解释现实生活中的行为。我们需要探索如何在\
  \ XACML 扩展的基础上构建基于事件的共享策略。此外，数据也必须是可信的 [LIM2012]。\n\n\n\n\n\n## 2. 一种基于流数据和云端加密数据构建模型及本地统计的本地数据分析框架\n\
  \n我们需要探索如何利用现有的流挖掘技术 [MAS2008, MAS2013] 来维护不同数据挖掘任务的本地统计和数据摘要。然而，当前的流学习算法 [MASU2010]\
  \ 可能无法直接用于隐私感知或加密数据的场景。训练集的微小变化可能会影响所学模型的质量和性能。为此，我们将探索维护基本统计的方法，例如多流之间的相关性。根据需要，一些较旧的模型和统计将被加密备份到云端。在某些情况下，这些学习到的模型和统计将被结合起来，基于近似来回答重要问题。此类近似通常利用滑动窗口或采样方法。例如，要回答个体的睡眠质量如何受其体重影响的问题，将选择性地利用存储在云端的关于睡眠模式和体重数据的先前模型来计算此类相关性。\n\
  \n## 3. 一种能够在清洗后数据上工作的全局推荐系统\n\n我们需要开发一个能够基于数据值范围而非精确值工作的推荐系统。此外，将探索随机响应等噪声添加技术，以便在共享数据前添加噪声。我们需要遵循测试匿名数据上学习到的分类器质量时所用的相同测试方法，测试基于清洗数据构建的推荐系统的相对有效性。\n\
  \n## 4. 基于云的隐私感知分布式数据挖掘协议，用于构建人口层面的数据挖掘模型\n\n除了前面讨论的噪声添加/清洗技术，我们还需要构建分布式数据挖掘技术，这些技术除最终数据挖掘模型外不泄露任何关于个人的信息。最初，我们将探索每个用户是否可以将其数据推送到云端的几个非串通、半诚实的服务器。例如，为了促进一项试图寻找规律锻炼、用户位置和空气污染对哮喘发作影响的科学研究，本地数据挖掘模型可以自动创建关于每周锻炼次数的统计数据，并结合用户的人口统计信息、哮喘发作记录（假设用户保留电子日记）和位置信息。这些统计数据将被分成秘密份额\
  \ [DESM1992, CRAM2003] 并发送到不同的服务器。稍后，将利用基于秘密分享的分布式数据挖掘技术，将现有的本地污染信息数据安全地链接到用户的位置数据。构建此类应用将面临独特的挑战：如何最好地汇总本地数据，以便在云端最好地利用并扩展基于秘密分享的协议以支持大量用户。此外，我们可能需要探索如何利用额外的外部数据源在本地提高全局分布式数据挖掘协议的效率。例如，每个移动设备可能从互联网下载本地污染数据并在本地进行链接（再次使用类似\
  \ Tor 的系统以防止链接到个人）。这将减少公共云中所需的加密协议执行量。\n\n## 5. 一种能够为特定用户优化全局推荐系统的定制系统\n\n我们需要基于多重混合模型\
  \ [LEE2013] 研究一种方法，通过该方法我们将结合基于单个用户非清洗数据构建的本地推荐器获得的推荐，以及全局推荐系统获得的推荐，从而为特定用户获得定制化推荐。重要的是要注意，本地推荐系统将基于非常小的数据集获得，且非常精确，因为它未经过清洗。而全局推荐系统将基于非常大的数据集，由于潜在的数据清洗，其精确度较低。将进行广泛的实验分析以评估这种两步法的准确性。\n\
  \n## 6. 一种人因分析，旨在确定专家和普通用户感知的 QS 数据共享相关的风险和收益\n\n将采用一对一访谈和在线调查方法进行此类分析。政策专家将受邀进行一对一的半结构化访谈，并被询问关于\
  \ QS 数据存储可能涉及的风险和收益的看法。将从访谈数据中识别不同类别的风险和收益及其感知重要性。将通过 MTurk 招募典型用户回答问卷，以确定他们是否区分专家所识别的相同类别，并以相似方式感知其相对重要性。在两项研究中，用户都将被询问他们对\
  \ QS 数据存储的信任程度，并将风险和收益的类别作为不同信任水平的函数进行分析。如果典型用户感知到的风险和收益与专家用户识别的不同，将设计并测试教育用户了解这些风险和收益的方法，通过比较教育前后用户的反应来验证。我们还需要将关于用户偏好的发现与定义充分同意数据收集或处理的法律原则进行比较，并找出确保用户决策构成法律上有效限制的方法。为了实现\
  \ QS 数据共享隐私策略的个性化，应识别设置隐私策略的不同选项。我们需要向政策专家和典型用户询问他们希望隐私规范界面适应哪些选择。根据这些信息，我们将在实验室环境下以大学生计算机用户为对象，或在\
  \ MTurk 上以更广泛的计算机用户为对象，通过受控实验评估已识别的设计特性。许多用户因高信息处理需求而不愿进行详细规范，因此我们将开发大多数用户可接受的智能默认设置，并评估呈现预设选项的方式，这些选项允许相对简单的策略设置，但粒度比单独指定每个因素更粗。我们需要将实验结果纳入一个或多个可能界面的设计中，并对其进行可用性评估。\n\
  \n## 13.4 新方向\n\n第 13.3 节描述了我们针对数据收集、数据存储、数据共享和数据分析的隐私感知数据管理框架的高层设计。为了开发一个有用的框架，我们需要考虑一些额外方面，例如\
  \ (i) 用户设备的安全性，(ii) 框架的形式化，(iii) 行为方面，以及 (iv) 物联网 等新型应用，以便我们能够证明一致性和完整性等属性。我们将在本节讨论这些额外方面。\n\
  \n### 13.4.1 用户设备的安全性\n\n\n\n\n为了维护隐私，用户设备必须长期保持安全。通过告知用户随时间发现的设备漏洞，可以减轻数据生命周期（收集、存储和分析）中的隐私风险。更重要的是，该框架可以帮助用户更新他们的智能手机，特别是物联网设备。近一半的用户从不更新物联网设备\
  \ [ROUF2016]。此外，如果用户正在使用不再接收更新的（易受攻击的）设备，可以通知他们。\n\n虽然安全和隐私必须是为物联网设备设计数据管理系统的主要考虑因素，但易用性也很重要。例如，如果用户忘记了密码，无法访问智能家居或智能医院记录，会发生什么？因此，考虑用户的多因素认证很重要，我们还需要开发适当的标准。例如，必须考虑\
  \ SAML 和 XACML 等标准用于认证和授权。因此，用户界面框架必须与数据管理框架集成，以便我们可以确保物联网设备的安全性、隐私性和易用性。\n\n##\
  \ 13.5 行为方面\n\n可以从收集的数据中分析用户的行为模式（另见 [SULL2018]）。例如，通过分析收集的海量数据，可以检测到用户的习惯，如吸烟、饮酒和吸毒，以及抑郁和可能的情绪波动。虽然这种数据收集可以通过向用户发送有关潜在治疗和建议的信息来造福用户，但也可能导致侵犯用户隐私。因此，我们需要策略感知的数据收集，以便用户能够从建议中受益，而不侵犯其隐私。\n\
  \n我们现在正处于一个多世纪以来最严重的大流行病期间。虽然人们的身体健康至关重要，但我们也需要收集关于人们情绪的信息，以防止他们自杀。因此，分析收集的数据将极大地有助于预防自杀。然而，这也可能侵犯个人隐私。在第\
  \ 14 章中，我们讨论了与 COVID-19 相关的隐私问题。\n\n## 13.6 走向形式化框架\n\n为了能够容纳任何解决方案，我们需要开发一个形式化框架。在最近的一章中，我们讨论了基于重写规则的形式化框架的某些方面\
  \ [FERN2016]。特别是，我们描述了一个通用框架，用户不仅可以指定其数据如何被管理，还可以限制来自其连接设备的数据收集，以及这些数据的存储和分析。更准确地说，我们讨论了使用数据收集策略来管理来自各种设备（例如物联网设备）的数据传输，并结合策略以确保数据一旦传输，就能以安全和保护隐私的方式存储和共享。换句话说，我们讨论了一个用于安全数据收集、存储和管理的框架，具有逻辑基础，能够验证策略属性。然而，我们的主要关注点在于指定和推理数据收集策略的方面。\n\
  \n虽然 [FERN2016] 中讨论的工作是朝着设计这样一个用于指定和推理安全和隐私策略的形式化框架迈出的第一步，但我们需要探索将这种框架用于我们在第 13.3\
  \ 节中讨论的隐私感知数据管理框架。这是我们正在追求的一个研究方向，同时我们继续进行数据管理框架的更详细设计。此外，我们还将结果应用于互联网交通系统，如图 13.4\
  \ 所示。\n\n![图 13.4 隐私感知的互联网交通系统。](img/fig13_4.jpg)\n\n图 13.4 隐私感知的互联网交通系统。\n\n##\
  \ 13.7 总结与方向\n\n本章通过一个激励性示例讨论了保护、收集、存储和分析数据的问题。然后，我们讨论了为数据收集、管理和分析设计隐私感知数据管理框架所涉及的挑战。我们还讨论了信息共享的行为方面，以及隐私感知策略管理形式化框架的某些方面。最后，我们简要讨论了形式化框架的必要性，以便无论实施何种解决方案，都可以指定和推理安全和隐私策略。\n\
  \n本章主要提高了在数据管理的所有层面纳入安全和隐私策略的必要性的认识。下一步是进行框架的详细设计和实现。我们还必须设计形式化框架，以便无论实施何种解决方案，都可以指定和推理策略。最后，我们需要将框架适配到互联网交通系统等应用中。\n\
