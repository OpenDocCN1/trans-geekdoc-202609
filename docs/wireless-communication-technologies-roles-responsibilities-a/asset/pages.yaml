  md: 'enhancement and the development of smart cities. The concept of smart cities
    encompasses the establishment of intelligent transportation and energy distribution
    infrastructures. To achieve these objectives, the deployment of a pervasive sensing
    framework and a distributed decision and actuation system becomes imperative.


    6G is anticipated to exert substantial influence in this domain, relying on 3D
    communication platforms that can enable almost instantaneous distributed edge
    cloud functionalities, including distributed decision-making processes. In critical
    scenarios like autonomous driving, prioritizing safety measures is of paramount
    importance to minimize the risk of accidents. This requires exceptionally high
    levels of communication reliability, surpassing 99.9999%, and minimal end-to-end
    latency below 1 millisecond. Moreover, facilitating seamless communication between
    vehicles and between vehicles and roadside equipment will be vital in reducing
    collision risks, necessitating high-speed data connections.


    # 11.3.4 ENHANCING ENERGY EFFICIENCY


    Sustainable progress undeniably demands a sharp focus on energy consumption. Consequently,
    6G must develop communication strategies that not only deliver effectiveness but
    also prioritize energy efficiency. The overarching objective is to enable communication
    that operates without depleting batteries whenever possible, with the aim of achieving
    communication efficiency within the range of 1 picojoule per bit (1 pJ/b). It’s
    worth noting that specific key performance indicators (KPIs), such as delay jitter
    and energy per bit, did not receive significant emphasis in the context of 5G,
    but they will gain paramount importance as primary KPIs in the context of 6G.


    # 11.3.5 QUANTUM COMMUNICATIONS AND COMPUTING


    To address heightened security demands compared to current technologies, 6G is
    poised to embrace quantum communications to a greater extent. Quantum communications
    leverage the principles of the quantum no-cloning theorem and the uncertainty
    principle, providing robust security through the use of quantum keys [16]. In
    quantum communications, any attempts by eavesdroppers to observe, measure, or
    replicate data result in the disturbance of the quantum state, making eavesdropping
    activities readily detectable. In theory, quantum communications offer the potential
    for complete security.


    While the challenges of achieving terabits-per-second (Tb/s) data transmission
    and comprehensive applications/scenarios present obstacles for wireless computing
    in 6G, they also bring exciting opportunities [17]. Unlike traditional computing,
    which operates on binary 0–1-b operations, quantum computing harnesses the power
    of quantum superposition and entanglement, significantly enhancing computing capabilities
    through the use of qubits and unitary transformations.'
