    # ## 5.1 INTRODUCTION


    In 1760, Industry 1.0 started, which caused the advancement of new manufacturing

    methods using steam and water. The major industries which were transformed by

    this industrialization were textile and transportation. Industry 2.0 is referred
    to as

    “The Technological Revolution,” primarily in countries like America, Britain,
    and

    Germany around 1840. In this era, new technological systems, such as superior

    electrical technology, were introduced, resulting in higher fabrication and refined

    devices. Industry 3.0 started around 1970, involving the use of microelectronics
    and

    Information Technology (IT), which automated the production process. This was

    due to the advancement in connectivity, Internet Access, and renewable energy.

    However, Industry 3.0 had a dependency on human input and interference. The era

    of storage systems, smart devices, and production facilities is the beginning
    of'
