  md: 'Before transmitting the signal we first precode the signal. Precoding is done
    to ensure that the signal reaches the correct recipient without mismatch. Precoding
    is also called beamforming. It consists of Digital beam Former, RF chains, and
    the feed. These are the in-built structures that constitute the array of RHS elements.
    These structures help increase the overall directivity, which in turn has a larger
    impact on the channel capacity. Thus, such a RHS based multiuser communication
    system utilizes the bandwidth of the channel effectively and thus has a higher
    channel capacity.


    # 11.5 MULTIUSER CAPACITY ANALYSIS


    Let the transmitted signal from the base station be,


    x = W \wedge S (11.1)


    Where, S is the transmitted signal vector for k values.


    The Expectation of this signal with its hermitian matrix is given as,


    E[SS^H] = \frac{P}{k} I_k (11.2)


    Here, P is the transmitted power.


    Also, At the base station, the signals are assumed to be transmitted under a normalized
    power allocation matrix \wedge which satisfies Tr [\wedge \wedge^H] = 1


    The normalized precoding matrix W is given by,


    W \in C^{M \times K} (11.3)


    Due to zero forcing by the RHS based transmission, the received signal can be
    written as,


    y = GW \wedge S + n (11.4)


    Where, G is the radiation amplitude of each radiation element


    G = \frac{Re \{ \varphi_{inf} (r_{m,n}^*, \theta_o, \varphi_o) \} + 1}{2} (11.5)


    For zero forcing precoding, the kth column of W can be written as,


    W_k = \frac{V_k}{\| V_k \|_F} (11.6)'
