    # 9.3.2 Artificial Intelligence


    An IoT system is mainly dependent on big data and hence as a consequence, it depends
    on AI. This dependence created a new paradigm known as the Artificial Internet
    of Things (AIoT). AI refers to computer-based techniques that use unstructured
    data, process it, interpret and visualize meaningful required information from
    it. AI is based on predictive historical analysis and extracts information about
    what is going to happen and takes action accordingly. Furthermore, due to this
    analytical power of AI, there is a possibility to develop an intelligent system/machine
    which works more efficiently, predicts failure, and takes remedial action, etc.
    An IoT system that supports this type of intelligence can gather data from devices/sensors
    and if needed give faster reaction time than human beings. Supervised learning,
    semi-supervised learning, and unsupervised learning are three AI techniques which
    have been proposed to be used for IoT systems [4]. The convergence of AI with
    IoT generates an intelligent AIoT system which able to process data in a way that
    makes autonomous decisions. Convergence of AIoT makes systems more intelligent,
    autonomous, smart, and solution providers in many scenarios.


    # 9.3.3 Internet of Things (IoT)


    IoT technologies can be described as a merger of software and hardware products
    that can produce, collect, and compute data in binary form. It allows human interaction
    with electronic devices via networked systems in order to make our lives easy.
    IoT offers creative solutions to different problems in every field such as business,
    public/private sector, economy sector, homes, agriculture, etc. by using intelligent
    devices and sensors connected through networks [5]. It is possible only due to
    advancements in hardware technologies and cloud computing that this concept expands
    from small to large-scale environments. Figure 9.3 (a) block diagram of IoT and
    9.3 (b) detailed architecture of IoT.


    IoT architecture consists of different layers, in the sequence of top to bottom
    these layers are the business layer, application layer, middleware layer, network
    layer, and perception layer. At the lowest level of the architecture is the perception
    layer that consists of sensors and intelligent devices connected through the internet
    to gather information and transmit it to the network layer. The network layer
    serves as a transmission medium, facilitating the transfer of information from
    the perception layer to the information processing system via wired or wireless
    connections. The middleware layer which is the next layer is responsible'
