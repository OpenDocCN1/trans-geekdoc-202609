- pgno: 326
  md: '# 14.1.6.2.3 Sensing and Actuation Unit


    An event happening in the environment can be sensed by this unit and it reacts
    according to that sensed value. Humidity, sound, acceleration, temperature, and
    pressure sensors are available to sense the environment.


    # 14.1.6.2.4 Communication Unit


    Modulation techniques, network topologies, transmission rangeand routing techniques
    are important areas of concern while transmitting the sensed information to the
    remote sink node. Transmission distance ranges from a few meters to a few Kilometers.
    Throughput ranges from 10 to 256 kbps.


    Network of WNs forms a WSN. WNs are distributed in a special domain called sensor
    field to collect the information, process and route it to a remote sink node.
    In this thesis, a group of non-CH WNs forward their sensed data to a CH node.
    Each CH node forwards its own information along with information collected by
    its associated nodes to a remote sink node in multi-hop fashion. This technique
    of selecting a CH node for each cluster of WNs is known as clustering.


    # 14.1.6.2.5 Multi Hop Routing


    Selecting the shortest paths from the CHs to the remote sink node is essential
    to maximize the network lifetime. Every CH node identifies its neighbor CH node
    and transmits its data to it. The neighbor node aggregates this with its own data
    and transmits it to the CH near the sink node (or) to the sink node directly,
    whichever is closer.


    The information collected by a single WN hops multiple times to reach a remote
    sink node establishing a path. This path cost should be minimized to help the
    information from a WN reach the remote sink node consuming less energy. A shortest
    path algorithm like Dijkstra is used to find the shortest path between each CH
    and the remote sink node. The path cost depends not only on the distance between
    CHs but also on remaining energy available with each CH node and the energy consumed
    by a CH node for transmitting its aggregated data to remote sink node.


    # 14.2 CLUSTERING


    Designing energy efficient routing protocols for WSN considering the power and
    resource limitations of the network helps in improving the lifetime of the system.
    Clustering is a type of routing protocol in which WNs are grouped based on its
    location and then selecting a WN, which has more available remaining energy as
    CH nodes from the group. Using this technique total energy consumption in a network
    is greatly reduced, which in turn extends the system’s lifetime. The aggregated
    data by the CH nodes are then transmitted to a remote sink node, either in single
    hop or multi-hop fashion generally.


    Clustering technique is used as a routing protocol. The WNs that have higher energy
    arrival rates, closer to the sink, are selected as CH node. The nodes associated
    with the CHs reserve a portion of their harvested energy. This saved energy will
    be used by the same node when they are selected as CH in any future'
