  md: '![](img/be689ed28322f90f68916a35ce44e55d_256_0.png)


    # FIGURE 12.1 Architecture of IoMT [7].


    IoMT consists of healthcare equipment or sensors that can distribute information
    over a web that does not need individual-individual or individual-machine communication
    [3]. An IoMT based healthcare system consists of various stages. Initially, the
    healthcare data is acquired from the patient’s body using sensors attached to
    them. These data are then sent over the next stage for analysis or prediction
    using AI based technique. The analysis results are then sent back to the patients’
    smart phones or doctors in serious cases. An instance of IoMTs in which victims’
    physiological parameters are accumulated using various devices and directed toward
    IoMT apps via the web is depicted in Figure 12.1.


    Because IoMT devices are distributed, network control is distributed; that incurs
    risks when executed on traditional networks. In such a case, SDN has become a
    feasible option because it provides a centralized perspective on the network,
    which conceals management challenges and provides network control. The software-defined
    network (SDN) framework has received the most attention recently since it offers
    a more consistent, versatile, and secure network environment [4]. SDN comprises
    of planes such as data pane, control plane, and application plane. SDN tries to
    incorporate network intelligence in a single connected device by isolating the
    data and control plane [5].


    In the healthcare sector, an early disease prediction will enhance a patient’s
    lifetime. Artificial Intelligence techniques aid doctors to predict diseases as
    early as possible. Machine learning (ML) is a capability of a machine to gain
    and integrate knowledge through large-scale observations, as well as to improve
    and expand automatically by acquiring fresh information, instead training with
    that data [6].'
