    # 10.5.2 POSITION SENSOR


    Position sensors detect the position of a particular desired object. They are
    categorized into two types:


    +   - Linear position sensor: It simply measures the distance between two objects,
    referring to a point or straight line. It accurately measures the displacement
    of an object from one position to another. There are contacting and non-contacting
    linear position sensors.

    +   - The rotary position sensor: The input for the rotary position sensor is
    the rotary movement of the object which converts it to the output signals. There
    can also be contacting and non-contacting rotary position sensors. It depends
    on the degree of rotation of the subject.

    +   - In MRI and CT scans, the scanner will rely on the position sensor to obtain
    the imaging at the right place of the human body.

    +   - Hospital beds use the position sensor for adjustment according to the patient''s
    desire. In operation, theater position sensor beds are often used.'
