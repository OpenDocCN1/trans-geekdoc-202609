    # 6.5.2 MOBILE


    Various phone call and video streaming applications offer reliable broadband connectivity,
    but they come with the disadvantage of having very high power and operating costs.


    While cellular networks are not suitable for most battery-operated sensor network
    IoT applications, they are ideal for certain uses. For example, the widespread
    and high-speed cellular connectivity can support fleet telemetry and tracking
    services, traffic routing, advanced driver assistance systems (ADAS), and in-car
    entertainment.


    The future of autonomous vehicles and increased realism is expected to rely on
    the next generation of cellular technology. 5 G. 5 G provides high-speed flexibility
    and significantly lower latency. In the future, 5 G is anticipated to enable various
    time-sensitive industrial automation applications, real-time mobile delivery of
    medical data for connected healthcare, and real-time video surveillance for public
    safety. Similar work on network routing protocol is referred to in [42,43].


    # 6.5.3 MESH PROCEDURES


    Zigbee is a 802.15.4 short-range, low-power radiocommunication procedure that
    is usually used in mesh architectures to spread data over many IoT devices and
    increase access. Zigbee consumes a lot less electricity and offers faster communication
    throughput than LPWAN because of its mesh design.


    Zigbee and other mesh technologies like Z-Wave and Thread are well-suited for
    medium-range Internet of Things (IoT) deployments where there is a relatively
    equal distribution of nodes in close proximity. These technologies are particularly
    suitable for home automation use cases such as controlling lights, HVAC systems,
    safety devices, and energy management. Zigbee is considered a good complement
    to local area networks in these scenarios.


    Wireless networks have been used in industrial settings before the emergence of
    low-power wide-area networks (LPWAN). They offer various possibilities for remote
    support. However, they are not optimal for applications that require connectivity
    across large geographical areas. Additionally, their scalability is often limited
    due to the complexity of network configuration and management requirements.'
