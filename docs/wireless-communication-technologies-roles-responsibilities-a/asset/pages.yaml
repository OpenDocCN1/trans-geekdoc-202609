    # 9.10 FUTURE SCOPE


    The digital transformation forced either to develop a new system or to converge
    the existing technology to achieve the solution for the existing problems. Initially,
    AI and IoT emerged as individual concepts to solve problems, but the convergence
    of these technique develops an intelligent system that is able to provide better
    solutions then the individual one.


    +   1. To develop a new intelligent vehicle that communicates with another vehicle
    and with drivers using wireless technology to ensure a jam free journey with an
    enjoyable and safe driving experience [33].

    +   2. To develop reliable, efficient, and user-friendly system.

    +   3. To develop security architecture that considers the life cycle and the
    capability of AI and IoT systems. It includes development of new security protocols
    that traditional end-to-end internet protocols are not able to provide. System
    should have scalability potential so that it can serve both small- and large-scale
    needs [5].

    +   4. To develop an AIoT framework that supports global needs.

    +   5. Convergence of AI, IoT, and WT offers new business opportunities and new
    approaches for researchers to analyze the data that traditional techniques lack.

    +   6. To develop 3D models of CPS systems that perform accurately in hazardous
    environment without human intervention.'
