  md: '# # 3 Fuzzy Graph Dominance for Networked Communication Optimization


    N. Yogeesh

    Department of Mathematics, Government First Grade

    College, Tumkur, Karnataka, India


    # ## 3.1 INTRODUCTION


    Communication networks allow WSNs, IoT networks, and MANETs to operate efficiently
    in the modern, interconnected world. These networks’ edges are the means via which
    nodes communicate. The performance of these networks is carefully optimized by
    modeling and analysis.


    Because they accurately reflect the ambiguity and imprecision of actual networks,
    fuzzy graphs may be utilized to describe and investigate communication networks
    [1]. In order to describe and understand complex networks, such as communication
    networks, fuzzy graphs are used [2].


    The coverage, connectivity, and energy efficiency of communication networks may
    all be improved via fuzzy graph dominance. According to dominance criteria, dominant
    nodes in fuzzy networks are those that control or have an effect on the network’s
    other nodes [3]. It is possible to boost coverage, connection, monitoring, and
    control by carefully selecting the network’s dominant nodes.


    Fuzzy graphs and dominance for network optimization will be introduced in this
    chapter. The topics of fuzzy set theory, communication network representation,
    and adjacency matrix will also be explored. It will then dominate fuzzy graphs,
    including their sorts, traits, and characteristics. Coverage, connectivity, energy
    efficiency, and key nodes for monitoring and controlling communication networks
    are all improved by fuzzy graph dominance. We will last look at potential outcomes
    and issues related to fuzzy graph dominance in communication networks.


    # ## 3.1.1 DEFINITION AND IMPORTANCE OF COMMUNICATION NETWORKS


    Equipment, systems, and people may all connect thanks to communication networks.
    Wired or wireless networks are essential in modern life for the transmission of
    data, audio, and multimedia. Wireless sensor networks, internet of things (IoT)
    networks,'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'and mobile ad hoc networks are examples of communication networks that are
    designed for particular purposes [4].


    For simple communication and collaboration, communication networks connect individuals,
    objects, and systems. Networks of communication help with business, science, education,
    healthcare, social interactions, and many other aspects of contemporary life.
    They have revolutionized international communication and information exchange,
    opening up the world.


    Communication networks are essential to telecommunications, transportation, finance,
    energy, and industry. Real-time data communication facilitates automation, critical
    operations, and decision-making. Communication networks are required by the Internet
    of Things (IoT), which connects billions of devices globally [5].


    Global connectivity, collaboration, and technological advancements in contemporary
    society and industry are made possible via communication networks.


    # 3.1.2 OVERVIEW OF DIFFERENT TYPES OF COMMUNICATION NETWORKS


    There are major three types as follows:


    +   - wireless sensor networks,

    +   - IoT networks,

    +   - mobile ad hoc networks.


    The overview of various communication network types includes examples from wireless
    sensor networks, Internet of Things networks, and mobile ad hoc networks.


    +   1. Wireless Sensor Networks (WSNs): Small, independent sensor nodes that can
    perceive, analyze data, and communicate with one another make up WSNs. These nodes
    cooperate to gather information from their environment and transmit it to a base
    station or a sink node where it will be processed and examined. WSNs are utilized
    for a variety of purposes, including monitoring the environment, delivering healthcare,
    farming, and automating manufacturing.


    +   2. Application Example: An illustration of a wireless sensor network is a
    network of weather sensors installed in a forest to monitor temperature, humidity,
    and air quality. The sensor nodes gather data from their surroundings and transmit
    it to a base station for analysis. The sensor nodes feature monitors for temperature,
    humidity, and gases. The data collected may be used to forecast forest fires,
    monitor animals, and safeguard the environment.


    +   3. Internet of Things (IoT) Networks: IoT networks are made up of interconnected
    items, often known as “things,” that include sensors, actuators, and the communication
    capabilities to interact with one another. Smart homes, smart cities, and industrial
    automation are all made feasible by the communication between these devices and
    computers on the cloud. IoT networks may link several types of devices that communicate
    in a variety of ways and can be wired or wireless.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'Application Example: An IoT network is an illustration of this. In this system,
    smart devices like as thermostats, lighting, and security cameras communicate
    with one another as well as a central hub or cloud server. The intelligent devices
    may be controlled remotely via a smartphone app or voice commands, and they can
    communicate with one another in accordance with preset rules or user preferences.
    This makes it simpler to handle and manage home security systems and appliances.


    +   4. Mobile Ad Hoc Networks (MANETs): Mobile devices that can communicate with
    one another, such as laptops, cell phones, and tablets, make up MANETs. These
    devices do not rely on a fixed system or a single point of control. By establishing
    ad hoc connections with other nearby devices, these gadgets build a temporary
    network. They are always free to join or quit the network. MANETs are frequently
    utilized in circumstances when a permanent infrastructure is impractical or useless,
    such as during military operations, disaster relief efforts, and vehicle networks.


    Application Example: A fleet of emergency vehicles, such as ambulances, fire engines,
    and police cars, despatched to a disaster location is an illustration of a mobile
    ad hoc network. The cars communicate with one another directly or via a series
    of hops to relay crisis information in real-time, organize rescue operations,
    and make critical decisions immediately. MANETs provide communication in environments
    where there is no established infrastructure and things are constantly changing.


    Each sort of information network has unique characteristics, issues, and applications.
    IoT networks enable diverse devices to join and collaborate in various ways, whereas
    wireless sensor networks are typically set up in harsh or remote locations to
    collect data. However, MANETs enable communication when a fixed infrastructure
    is impractical, such as when individuals are moving around a lot. If you want
    to create networking solutions that are effective for certain reasons, it is crucial
    to comprehend the differences and similarities between these different forms of
    communication networks.


    # 3.1.3 INTRODUCTION TO FUZZY GRAPHS AND THEIR REPRESENTATION OF COMMUNICATION
    NETWORKS


    The modern information and communication infrastructures depend on wireless sensor,
    Internet of Things, and mobile ad hoc networks. Devices are represented as nodes,
    and communication links between them are shown by edges [6]. Effective network
    management and optimization are required for connection, communication coverage,
    and energy efficiency.


    In recent years, fuzzy graph theory has been used to define and understand complex
    systems, including communication networks. By giving links and nodes fuzzy values
    that denote varying degrees of membership or truth, fuzzy graphs enhance classical
    graphs. In real-world communication networks, uncertainty and imprecision can
    be better represented by fuzzy graphs.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'The performance of communication networks can be enhanced via fuzzy graph dominance.
    Based on their fuzzy membership values, certain nodes in fuzzy graphs can dominate
    others [7]. Finding key nodes that control or are controlled by others facilitates
    resource distribution, network characteristic optimization, and performance enhancement.


    Fuzzy graph-based dominance can identify critical sensor nodes with bigger membership
    values, implying relevance or dependability, for data aggregation or routing in
    wireless sensor networks. By identifying important devices that control communication
    lines or data flow, dominance in fuzzy graphs improves IoT network connectivity
    and energy efficiency. In order to improve multi-hop communication and network
    resilience in dynamic and mobile environments, fuzzy graph-based dominance may
    be used to identify dominant nodes in mobile ad hoc networks [8].


    An interesting and promising technique for improving network performance and locating
    crucial nodes for monitoring or control is fuzzy graphs. This chapter will apply
    fuzzy graph theory to mobile ad hoc networks, Internet of Things networks, and
    wireless sensor networks with a focus on dominance and its advantages.


    # 3.2 FUZZY GRAPH THEORY


    Fuzzy graph theory is a powerful tool for describing and understanding complex
    systems because it can represent ambiguous and imprecise information. In fuzzy
    graphs, membership or truth is expressed using fuzzy values [2]. Fuzzy graphs
    more accurately represent real-world systems, particularly communication networks.


    According to Bagga and Sharma, fuzzy graph theory may optimize communication networks
