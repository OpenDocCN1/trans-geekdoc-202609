    # 13.2.5 HONEYCOMB TOROIDAL STRUCTURES


    The toroidal structure is a special form of structure where extra links are introduced
    based upon the results from the genetic algorithm [22]. The links that are known
    to give better efficiency are added to the original structure or topology which
    will in turn lead to better results [23]. The following figures are obtained by
    introducing the new links in order to optimize the previous structure and produce
    better efficiency [24]. The first figure depicts the 2d toroidal structure, and
    the second figure depicts the obtained 3d toroidal structure after applying genetic
    algorithms [25] (Figures 13.3 and 13.4).


    # 13.3 RESULT AND ANALYSIS


    Omnet++ has been used to simulate the designed topologies. Further simulation
    has been done on the basis of different traffic patterns. The outcomes have also
    been analyzed with respect to different traffic patterns. The results have been
    seen improving with the advancement by using different algorithms along with some
    optimizations in sub sequential designs. These have led us to have totally different
    conclusions by introducing new links to the different mesh interpretations. Consequently,
    there has been an improvement in efficiency and that has led us to observations
    that have proved the betterment of toroidal networks over simple mesh and hexagonal
    mesh networks.'
