  md: '# # 11 6G/5G Cellular Networks Empowering Wireless Technologies


    M. Aathira, P. Riashree, M. Saumiya, G. Ananthi, and A. Malini


    Thiagarajar College of Engineering, Madurai, Tamil Nadu, India


    # ## 11.1 INTRODUCTION


    Our society is swiftly progressing toward a future characterized by comprehensive
    automation and remote management systems. The rapid advancement of various emerging
    technologies, including Artificial Intelligence (AI), Virtual Reality (VR), Three-Dimensional
    (3D) media, and the Internet of Everything (IoE), has resulted in an unprecedented
    surge in data traffic [1]. To put this into perspective, global mobile data traffic
    amounted to 7.462 exabytes per month in 2010, and projections indicate that it
    will reach a staggering 5016 exabytes per month by 2030 [2]. These numbers underscore
    the critical need for enhancements in our communication systems.


    Autonomous systems are gaining prominence across various sectors of society, including
    industry, healthcare, transportation, maritime, and even space exploration. To
    enable a smarter, more automated way of life, millions of sensors will be integrated
    into urban infrastructure, vehicles, residences, factories, agricultural processes,
    consumer products, toys, and countless other environments.


    5G networks, while offering significant advancements over existing systems, will
    likely fall short of meeting the demands of a fully automated and intelligent
    network that delivers everything as a service and provides a completely immersive
    experience [3]. Although upcoming 5G communication systems will bring notable
    improvements, they may not adequately cater to the needs of future emerging intelligent
    and automation systems beyond the next decade [4].


    5G technology will introduce various enhancements, including new frequency bands
    like millimeter wave (mmWave), utilization of optical spectra, advanced spectrum
    management, and the integration of licensed and unlicensed frequency bands [4].
    These improvements will undoubtedly result in better quality of service (QoS)
    compared to fourth-generation (4G) communications [5–8].


    However, the rapid growth of data-centric and automated systems could potentially
    outstrip the capabilities of 5G wireless systems. Certain devices, such as virtual
    reality'
  merge: -1
  img_proc: true
- pgno: 239
  md: '(VR) devices, will require data rates exceeding what 5G can offer, necessitating
    the development of Beyond 5G (B5G) technologies capable of delivering a minimum
    of 10Gbps data rates [1]. Consequently, with 5G approaching its limits by 2030,
    research into the design goals for its successor is already underway in the scientific
    literature.


    To address the limitations of 5G and meet the evolving challenges, the development
    of a sixth-generation (6G) wireless system becomes imperative, offering a host
    of novel features. 6G will build upon the foundations of previous generations,
    integrating network densification, high throughput, high reliability, low energy
    consumption, and extensive connectivity into a cohesive framework.


    In addition to these core elements, 6G will continue the trajectory of previous
    generations by introducing new services and technologies. These novel services
    encompass artificial intelligence (AI), smart wearables, implants, autonomous
    vehicles, immersive computing reality devices, advanced sensing capabilities,
    and three-dimensional mapping [9]. Perhaps the most critical requirement for 6G
    wireless networks is their ability to efficiently handle massive volumes of data
    and provide extremely high-data-rate connectivity per device [1]. This will be
    central to meeting the demands of emerging applications and technologies in the
    future. The forthcoming 6G system is poised to usher in a significant leap in
    performance, elevating user Quality of Service (QoS) to levels several times greater
    than those achievable with 5G, and it will introduce a range of exciting features.
    A paramount focus of 6G will be the robust protection of the system’s integrity
    and the security of user data, ensuring a secure and comfortable user experience
    [10].


    6G is envisioned to become a global communication infrastructure, and it is anticipated
    that in many scenarios, per-user data rates will reach an astonishing 1 terabit
    per second (Tb/s) [1,11]. This represents a substantial increase compared to 5G.
    Furthermore, 6G is expected to provide simultaneous wireless connectivity that
    is a thousand times more robust than what 5G can offer.


    In addition to these advancements, 6G aims to enable ultra-long-range communication
    with latency as low as 1 millisecond (ms) [12], opening up new possibilities for
    real-time applications and services. This chapter presents the system model for
