    # 7.3.4 ENVIRONMENTAL ISSUES OF BLOCKCHAIN


    There are many benefits to combining blockchain technology and wireless internet,
    but it’s important to think about how this integration may affect the environment.
    Although blockchain technology has the potential to revolutionize many different
    industries, issues with sustainability and environmental effect have been brought
    up due to its energy use and carbon footprint.


    Blockchain’s high energy usage is one of the main environmental problems it raises.
    Traditional blockchain networks, like Bitcoin, rely on a Proof of Work (PoW) [27,28]
    consensus method, which consumes a lot of processing power. Miners use this power-intensive
    procedure to validate transactions and secure the network by solving challenging
    mathematical puzzles. As a result, a sizable amount of electricity is used, which
    causes carbon emissions from power sources based on fossil fuels. For instance,
    according to the Cambridge Centre for Alternative Finance, the energy usage of
    the Bitcoin network alone is similar to that of whole nations. Blockchain networks’
    ongoing energy use has the potential to increase carbon emissions and the negative
    effects of energy production on the environment. Alternative consensus mechanisms,
    including Proof of Stake (PoS), are being investigated as a solution to this problem.
    PoS demands that each member of the network “stake” (keep) a specific amount of
    cryptocurrency in order to validate transactions and protect the network. Compared
    to PoW, this method dramatically reduces energy consumption because it does not
    require power-intensive mining activities. Furthermore, improvements in renewable
    energy sources may help to lessen the negative environmental effects of blockchain.
    Wireless blockchain network integration with environmentally friendly energy production,
    such as solar or wind power, can assist lower carbon emissions and improve the
    sustainability of the technology. A number of efforts have already surfaced with
    the goal of minimizing the environmental impact of blockchain networks by supplying
    them with sustainable energy.


    E-waste creation is a worry for the environment associated with blockchain technology.
    Blockchain networks’ use of wireless technology and mining machinery can see regular
    upgrades or obsolescence, generating a sizable amount of technological trash.
    Electronic waste disposed of improperly can harm the environment and result in
    the depletion of natural resources. Initiatives that support ethical e-waste management
    and recycling are essential to resolving this problem. E-waste produced by blockchain
    technology can be reduced by enacting rules and pushing manufacturers to build
    products with recyclability and longevity in mind. Additionally, looking at alternative
    strategies, such as blockchain-based cloud solutions, might lessen the dependency
    on individual devices and alloy e-waste concerns. Furthermore, as more wireless
    connections are needed to serve blockchain applications, the current telecommunications
    infrastructure may become overburdened. Additional wireless infrastructure, such
    as cell towers and data centers, must be deployed in order to increase data transmission
    speeds and network'
