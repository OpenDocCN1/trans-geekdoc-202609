- pgno: 251
  md: 'Where, \( V_k \) is the k\(^\text{th}\) column of matrix \( V \)


    \( V = G^H (GG^H)^{-1} \) (11.7)


    Consequently, with zero forcing precoding, the signal to noise ratio for user
    k can be expressed as,


    \( r_k = \frac{P \Lambda_K}{k \sigma^2} (g_k w_k)(g_k w_k)^H \) (11.8)


    Where, \( g_k \) is the k\(^\text{th}\) row of \( G \) and


    \( \Lambda_K = [\Lambda \wedge^H]_{k,k} \) (11.9)


    Here, we assume that the channel state information is perfectly obtained by the
    base station and thus \( \Lambda \) is assumed to be a constant in the following
    which can be obtained by water filling algorithm.


    Using above notations, we can express the data rate for user k as,


    \( r_k = E [log_2 (1 + r_k)] \) (11.10)


    The multiuser capacity can be achieved by,


    \( C = E \sum_k log_2 \left( 1 + \frac{P \Lambda_K}{k \sigma^2} [GG^H]_{k,k} \right)
    \) (11.11)


    # 11.6 RESULTS AND DISCUSSION


    The theory and practical curves for the number of RHS elements versus the total
    channel capacity is plotted. The plot is done for three SNR values of 10dB, 20dB
    and 30dB and it is clearly seen that as the signal to noise ratio increases, the
    channel capacity also increases. Along the horizontal axis, the number of RHS
    elements are increased in a scale of order of 4th power of 10. From the curve
    characteristics, it’s inferred that as the number of RHS elements increases, the
    channel capacity also increases in the units of bits/seconds (also denoted in
    the units of Hz). Also the graph is simulated both theoretically and practically
    and it’s inferred from the graph that both the theory and practical curve overlaps
    each other.


    From this Figure 11.5, it is clear that the increased number of RHS elements that
    are used as reflecting surfaces in the 6G wireless channel will greatly increase
    the capacity of the channel and the overall multiuser communication is enhanced
    by the use of these reflecting surfaces.


