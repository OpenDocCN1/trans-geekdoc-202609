  md: '# 12.3 METHODOLOGIES


    This work focuses on predicting chronic diseases in patients. Overall 200 countries
    were affected globally from the first occurrence of COVID-19. In this perplexing
    battle, science and technology played a significant role. A variety of experts,
    including technical experts whom emphasized discovering appealing patients via
    the development of diagnostic images such as X beams and CT filters, employ AI
    to uncover new drugs and therapies.


    # 12.3.1 INTERNET OF MEDICAL THINGS (IoMT)


    A majority of the traditional hospital uses human/individual administrating and
    updating of patient statistical information such as past cases, lab tests, therapy,
    accounting, and medicines maintenance, that further results in manual failures
    and also warily influences victims. Intelligent healthcare built on the Internet
    of Things (IoT) avoids human errors and aids clinicians in promptly and accurately
    recognizing disorders by combining all critical characteristics tracked by different
    sensors throughout the web with an analysis assistance system. The Internet of
    Medical Things (IoMT) encompasses medical equipment which can send data over an
    internet devoiding any interaction.


    It was utilized in the healthcare sector such as tracking the health status of
    elder patients, smart hospitals, diagnosing diseases, emergency warning, etc.
    In the period of COVID-19, there is an increase in remote patient monitoring strategies
    due to social distancing rules that require clinicians to monitor patients far
    off via IoMT devices [23]. These devices focus on services such as diagnosing
    the severity of coronavirus, tracking the location of the infected and vulnerable
    patients.


    The incorporation of the internet into the surroundings of our lives has set the
    stage for IoMT applications, and it has become a segment of our day-to-day life.
    The majority of IoMT systems are organized into four layers, such as sensor layer,
    gateway layer, cloud layer, and visualization layer [24]. These layers incorporate
    various techniques, equipment, sensors, and computers that are linked via wired
    or wireless links.


    The sensor layer is designed to gather vital parameters from the patients such
    as heart rate, temperature, blood pressure, etc. These parameters acquire the
    patients’ vital values and transfer these values to the next phase. Various sensors
    are utilized to acquire the patients’ vital parameters. The network layer provides
    an individual interface for both patients and physicians, complete with modules
    that collect health history along with some other information, which is then retained
    in a secure IoT-based cloud database. See Figure 12.2.


    For a reliable, real-time healthcare framework, it serves as the core for IoMT
    architecture. The application layer is focused on intelligent healthcare management,
    with personalized interfaces for predicting diseases. This component manages patient
    consults administration, accurate diagnosis, and other supplementary analyses.'
