- pgno: 7
  md: '# # Preface


    In recent times, wireless technology has worked wonders and is emerging wonderfully
    to support many real-time applications of the era. In simple terms, wireless technology
    has great potential and can establish communication between various devices or
    objects wirelessly. Wireless technology is able to establish effective communication
    not only in remote areas but also supports interplanetary services which are not
    feasible with wires. The amalgamation of IoT, AI, and wireless technology leads
    to technological advancement and has opened many avenues for upcoming technology-based
    applications. Wireless technology has many possibilities but also suffers from
    various critical problems, risks, and open research challenges.


    According to Gartner, wireless technology will be a central element to new emerging
    innovations such as autonomous vehicles, drones, robots, medical equipment, and
    many more for the coming years. Wireless communication has several benefits listed
    as follows:


    +   1. Economical: Wireless communication does not require too much physical infrastructure
    and its maintenance is also reasonable. Thus, it is cost-effective.

    +   2. Flexible: Wireless communication is useful in establishing communication
    irrespective of location. Thus, it provides connectivity even in remote areas.

    +   3. Convenient: Any device capable of connecting to a wireless medium can be
    easily connected without much hassle.

    +   4. Accessible: It can be made accessible in remote areas easily with less
    effort.


    Further, the IoT sensors need this technology to establish communication and disseminate
    information to other sensors or base stations. Apart from traditional applications
    such as data transfer and communication, new emerging applications like cloud
    storage, Vehicle 2 Vehicle(V2V) or Vehicle 2 Infrastructure (V2X) communication,
    infotainment applications, fitness trackers, e-commerce, blockchain, logistics
    tracking, smart homes, and many more require wireless technology.


    Wireless technology is currently serving and will serve future applications to
    perform the task efficiently and effectively. Many researchers are working to
    continuously improve wireless technology so that they can cater to the tremendously
    growing needs of society. Emerging trends in wireless technology serve as a fuel
    to other applications which is of socio-economic benefit.'
  merge: -1
  img_proc: true
