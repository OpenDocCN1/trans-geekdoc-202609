    # 6.9.2.1 Important Considerations for Choosing the Best Wireless I/O Modules


    The essential criteria to take into account when choosing a wireless I/O module
    are restated here.


    +   - Distance Data rate

    +   - Energy usage Encryption frequency


    Data rate, which measures how quickly data can be wirelessly transmitted, refers
    to the speed at which bits are transferred between devices over a network per
    second. Different wireless technologies have varying data rates, impacting power
    consumption and battery life. For example, LoRaWAN technology offers a slower
    data rate compared to Wi-Fi, prioritizing power efficiency and longer battery
    life. Wi-Fi, on the other hand, consumes more power but provides a faster and
    constant connection with a data speeds reaching up to 300 Mbps.


    Depending on the wireless technology used, a network’s coverage varies.


    # 6.9.2.2 Do your Gadgets Work in an Environment that is Energy-Efficient?


