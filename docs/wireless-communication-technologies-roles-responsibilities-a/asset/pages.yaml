    # 11.2.1 6G WIRELESS COMMUNICATIONS


    The physical layer (PHY) in wireless communication systems encounters a myriad
    of challenges, encompassing hardware issues like amplifier distortion, local oscillator
    leakage, as well as channel-related complications such as fading and interference.
    Achieving reliable and efficient communication amidst these hardware and channel
    impairments necessitates the harmonized optimization of numerous design parameters.
    Historically, the complexity involved has made comprehensive end-to-end optimization
    in wireless systems impractical. Consequently, conventional methods break down
    the entire system into multiple independent blocks, each relying on simplified
    models that fall short of capturing the complexities of real-world systems.


    AI technologies bring forth exciting possibilities for achieving comprehensive
    optimization spanning the entire physical layer, from the transmitter to the receiver.
    We foresee the emergence of an “intelligent PHY layer” paradigm within the context
    of 6G, where the entire system can autonomously learn and enhance its performance.
    This vision becomes attainable through the application of advanced sensing techniques,
    data collection methodologies, AI technologies,'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'and specialized signal processing approaches tailored to the specific domain.
    Remarkably, recent research has demonstrated the feasibility of employing deep
    neural networks (DNNs) to train the transmitter, channel, and receiver as an integrated
    auto-encoder system, thus facilitating the joint optimization of transmitter and
    receiver functions.


    # 11.2.2 6G HARDWARE SETUP


    The rise of novel radio access technologies and the growing prevalence of IoT
    devices will exert significant influence on the design of 6G networks, with hardware
    limitations playing pivotal roles in shaping this evolution. On one front, as
    radio communication progresses into millimeter-wave (mmWave) and Terahertz bands,
    the substantial costs and power consumption associated with hardware components
    will have a profound impact on both the architecture of transceivers and the development
    of algorithms. On the other hand, IoT devices are characterized by constraints
    such as limited storage capacity, finite energy resources, and restricted computing
    capabilities. These resource-constrained platforms necessitate a holistic approach
    that encompasses communication, sensing, and inference to effectively address
    their unique challenges.


