    # 14.1.6.2 Case Study II


    The objective here is to select CHs from the available hundred WNs, which are
    deployed randomly to monitor a given area of 200 × 200 m². The CHs duty is to
    aggregate the information available with its associated member WN’s information
    and transmit it to a remote sink node.


    CHRIGEON algorithm proposed optimizes energy. HIOGA algorithm proposed in Chapter
    3 chooses WNs’ optimal location and related information quality. A new HIEOGA
    algorithm proposed in Chapter 6 applies the CHRIGEON algorithm to the result of
    HIOGA algorithm, which optimizes both energy and information quality.


    +   A WN consists of the following components:

    +   1. Power Unit

    +   2. Processing Unit

    +   3. Sensing and Actuation Unit

    +   4. A Communication Unit and other application-dependent units


    # 14.1.6.2.1 Power Unit


    To make the WNs operable for many years an efficient energy supply should be used.
    Generally, WNs are battery-operated, which make power consumption an important
    challenge. As once deployed in a remote environment, these nodes cannot be reached
    easily again for recharging or replacement. Either two AA alkaline cells or a
    Li-AA cell are used as battery for a WN. WN has limited power sources which are
    less than 500mAh, 1.2 V.


    To manage the power available with the WNs and to conserve the available power,
    energy efficient protocols should be designed. A WN’s power consuming functions
    are to detect unusual events, process the data, and then transmit it to a remote
    sink node. While transmitting the data available to a remote sink node, a WN either
    collects the information and processes it or relay the available data. Relaying
    the information collected from other nodes to remote sink node also requires additional
    power. An energy efficient optimization algorithm is proposed in this thesis to
    route available data to the remote sink node. Energy optimization helps in increasing
    the system’s network lifetime.


    # 14.1.6.2.2 Processing Unit


    WNs are typically embedded systems whose processor’s capability ranges from an
    8-bit micro controller to a 64-bit microprocessor. It stores information ranging
    from 0.01 to 100 GB.'
