    # 10.3.4 DISPOSABLE CONTACT LENS


    Types of contact lenses according to the period of usage:


    +   - Daily disposable contact lens

    +   - Disposable contact lens

    +   - Frequent disposable contact lens

    +   - Conventional Lenses.


    # 10.3.4.1 Daily Disposable Contact Lens


    As its name suggests, Daily Disposable contact lenses can be used only one day.
    At the end of the day, it should be removed. It is considered the healthiest choice
    because no day-to-day debris enters under the lens. For a person with allergies,
    it is the best option to use.


    # 10.3.4.2 Disposable Contact Lens


    Disposable contact lenses are replaced in two weeks or before. It depends on the
    particular product we use. It is very popular.


    # 10.3.4.3 Frequent Replacement Contact Lens


    Frequent replacement contact lenses are replaced every month or quarter year.
    Monthly based replacement contact lenses are called frequent replacement contact
    lenses.


    # 10.3.4.4 Conventional Lens


    Conventional contact lenses or non-disposable contact lenses should be replaced
    every six months or longer.'
