  md: '# 14 Open Research Challenges in Wireless Technologies Case Study


    M. Yogeshwari

    Department Information Technology, School of Computing Sciences, Vels University,
    VISTAS, Chennai, Tamil Nadu, India


    A. Prasanth

    Department of Electronics and Communication Engineering, Sri Venkateswara College
    of Engineering, Sriperumbudur, Tamil Nadu, India


    # 14.1 INTRODUCTION


    The wireless network spread its wings in the late 1970s. The growing number of
    mobile and handheld communication devices act as a backbone in the growth of the
    wireless network. These networks provide the facility of ubiquitous computing
    and information sharing regardless of users’ locations. Wireless networks are
    broadly classified as “infrastructure” and “infrastructure-less” networks. The
    infrastructure wireless networks have definite access points connected through
    wires. The mobile users are connected to these access points through a wireless
    communication medium. Cellular networks are an example of such networks. The infrastructure-less
    wireless networks have no fixed gateway for the communication path. These networks
    are known as “wireless ad hoc networks (WANET).” They can change their locations
    and configure themselves on the fly, also known as “mobile ad hoc networks (MANET).”


    # 14.1.1 Wireless Ad Hoc Network


    The wireless ad hoc networks have no fixed infrastructure. Ad hoc network is a
    group of autonomous devices communicating with one another deprived of the aid
    of any central authority and fixed infrastructure [1,2]. Figure 14.1 represents
    a wireless ad hoc network.


    In these networks, every node functions as end point, and a router forwards data
    to every alternative node that might well be multiple hops away from one another
    [3]. And the nodes might well be mobile in nature, making it look like a very
    dynamically changing topology in the network [4].'
