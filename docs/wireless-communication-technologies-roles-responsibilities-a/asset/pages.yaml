- pgno: 218
  md: '# 10.5.3 TEMPERATURE SENSOR


    A temperature sensor is an electronic device that converts the input data into
    electronic output data. The input can be the temperature of the environment and
    convert it to the output electric signals which helps to monitor the continuous
    change in temperature of the environment. There are different types of temperature
    sensors for monitoring the change in temperature. They are contact temperature
    sensors and non-contact temperature sensors. A contact temperature sensor requires
    direct physical contact with the object to be monitored. A contact temperature
    sensor includes thermistors and thermocouples. Thermocouple is the joining of
    two dissimilar metals together. When one junction is exposed to heat, the voltage
    generated due to the heat acts as the temperature input. This is called the thermoelectric
    effect. A non-contact temperature sensor usually utilizes the IR radiation emitted
    by the object and converts it to the output electric signals and sends it to the
    external electronic circuit for continuous monitoring. Examples are thermal imaging,
    handheld infrared industrial thermometers, human temperature measurements, and
    fixed infrared temperature sensors.


    # 10.5.4 VIBRATION SENSOR


    Vibration is the mechanical oscillation above the equilibrium position of the
    component. It is simply a back-and-forth motion of the machine or component. A
    vibration sensor is a device that measures the frequency of vibration in the machine.
    The vibration may denote the imbalance or breakdown in the assert. A vibration
    sensor may physically attach to the machine, or it may be wireless that will detect
    the vibration in the machine depending upon the type of the sensor. The recent
    advancement in the Internet of Things has necessitated vibration sensors for enhancement
    in the medical field. Even in the sound environment, the vibration sensor detects
    the vibration of the heart sound and the abdominal sound of the human through
