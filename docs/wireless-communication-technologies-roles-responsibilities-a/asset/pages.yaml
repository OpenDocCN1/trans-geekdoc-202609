- pgno: 312
  md: 'The purpose of our methodology was to increase throughput and decrease the
    latency of honeycomb mesh so as we have worked on 4 traffic patterns those are
    Bit-complement traffic, Uniform Distributed traffic, Tornado traffic, and Neighbor
    traffic in all of the traffic patterns the throughput of honeycomb 3D mesh is
    more than honeycomb 2D mesh and latency of honeycomb 3D mesh is less than honeycomb
    2D mesh. We have also introduced more fault tolerant links in honeycomb 3D mesh
    as earlier there were very less fault tolerant links in honeycomb 2D mesh which
    is a disadvantage due to which it was not fault tolerant. Thus, with increased
    throughput and fault tolerance also with decreased latency honeycomb 3D mesh is
    far better than honeycomb 2D mesh.


    The massive increase in the number of connected devices with the advent of the
    Internet of Things are calls for self-organizing and dynamic networks. The state-of-the-art
    wireless mesh networking protocols provide self-organizing networks that do not
    address the demands of 5 G networks such as low latency and high reliability.
    In this demonstration, we exhibit how we build a reliable low latency network
    out of a chaotic and dynamic mesh network. We combine the principles of opportunistic
    routing and network coding to achieve this. We let the audience interact with
    the nodes of the wireless mesh networks, i.e. causing node failures, link changes,
    etc. We demonstrate how our mesh network retains all of its flows intact without
    any service interruption despite flows intact without any service interruption
    despite these interactions and node failures.


