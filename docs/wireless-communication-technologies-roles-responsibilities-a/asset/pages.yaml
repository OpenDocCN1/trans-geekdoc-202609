    # ## 14.1.1.2 Characteristics


    +   - **Autonomous functions:** In a wireless ad hoc network, each node is autonomous.
    Every node functions as a host as well as a router. The absence of fixed infrastructure
    and central authority compels node to perform router functionality in addition
    to its basic operations as a host.


    +   - **Distributed operation:** These networks are self-organizing in nature.
    In these networks, the central authority is also absent, hence the administration
    of the network is respectively distributed in between the nodes, which then collaborates
    amongst themselves and implements functions like routing and security in the network.


    +   - **Routing with multiple hops:** The range of transmission of wireless nodes
    is fixed. The node that does not appear in the direct range of transmission of
    the destination node has to forward the packets to the intermediate nodes for
    communication.


    +   - **Dynamic topology:** The nodes can change their positions, and that is
    why they move within network with varying speed and direction. Therefore the network
    topology changes dynamically and randomly. So the nodes’ connectivity may vary
    with time. The mobility pattern of nodes is considered in routing and other management
    activities of the network.


    +   - **Inconsistent medium parameters:** The wireless medium has high bit-error
    rates. The medium in which the nodes communicate is prone to noise, interference,
    and signal weakening and has limited bandwidth compared to a wired network. In
    a few stations, the physical link between the users has numerous connecting links,
    and additionally, the available links are often diversified.


    # ## 14.1.1.3 Applications


    Wireless ad hoc networks have increased their applicability in various fields
    as these networks can be deployed at any place at any time with limited or no
    communication infrastructure. The following are some of its important applications.


    +   a. **Tactical Networks:** The wireless ad hoc network was initially developed
    for military applications. Military applications require “on-the-move” communications.
    WANETs comply with “on-the-move” condition because of infrastructure-less architecture
    and fast deployment [11,12]. MANETs are used in army “hopping” mines, in platoons,
    and anywhere troops communicate in unfamiliar territory to provide them an advantage
    in the battlefield. Tactical MANETs frequently take on their shapes automatically
    throughout the task, so when the mission is finished or deactivated, the network
    “disappears.” Typically, it is referred to as a “on-the-fly” wireless tactical
    network.'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'b. **Emergency Services:** Another important application area of ad hoc network
    is emergency services like search rescue and search operation during the disaster
    recovery process [13,14]. For example, suppose an aeroplane has an emergency landing
    due to some mechanical fault at some unreachable place like in a forest or in
    water and the airline has provided wireless device attached to life jacket under
    each seat. Then the search and rescue team finds it easier to locate the victim''s
    exact positions. Similarly, in the case of natural disasters like earthquakes,
    floods, etc., where the disaster may destroy existing communication infrastructure,
    the emergency response groups will create ad hoc networks to swap the destroyed
    infrastructure and enable the groups to better synchronize their efforts. The
    use of wireless sensor networks in the healthcare system is extremely important.
    The patient health may be monitored 24 x 7 through sensor devices for efficient
    diagnosis. It displays the application of a wireless ad hoc network in healthcare
    services.


    c. **Commercial and Civilian environment:** Ad hoc networks also have vast uses
    in the commercial and civilian environment. In the field of business, remote database
    access, mobile office, electronic payment, virtual meeting, and many more concepts
    become possible because of these networks. There are numerous other examples of
    application in these networks, like applications related to transport and vehicular
    services such as transmission of road, road or accident support, and weather conditions
    predicting application [15].


    Similarly, a different kind of commercial network can be set up anytime and anywhere
    like a network of visitors at the airport, taxi-cab network, a network within
    a sports stadium, virtual classrooms, ad hoc communication during conferences,
    meetings, or lectures, etc.


    # 14.1.1.4 Classification of Wireless Ad Hoc Network


    WANETs are infrastructure-less; they can be fully or partially mobile and can
    be flexibly designed as per requirement. Therefore, the ad hoc network is of a
    different type depending on its applications [16].


    # 14.1.1.4.1 Mobile Ad Hoc network (MANET)


    A type of wireless ad hoc network called a mobile ad hoc network may change its
    position and setup itself instantly [17,18]. MANET is a group of mobile hosts
    that are well equipped with wireless communication devices. The communication
    among the nodes is broadcast or multicast in nature. The mobile hosts can advance
    randomly and may switch on or goes off while not acknowledging alternative hosts.
    Mobility and autonomy leads to dynamic topology within network [19,20].


    # 14.1.1.4.2 Wireless Mesh Network (WMN)


    A WMN is a communication network of nodes structured in an exceedingly mesh topology.
    It is conjointly a sort of WANET. A mesh implies rich interconnection'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'among the devices or nodes. Wireless mesh networks usually encompass “mesh
    routers, clients, and gateways.” The mobility of nodes is not too recurrent. The
    clients inside the network are usually laptops, mobile phones, and different wireless
    equipment. The mesh network transmits data to and from the wireless devices which
    can, however needn’t, be connected to the internet.


    # 14.1.1.4.3 Wireless Sensor Network (WSN)


    Wireless sensor networks imply that they rely on wireless connectivity and spontaneous
    development of networks in order that sensor information is transported through
    wireless medium. WSNs are spatially located sensors to analyze the environmental
    parameters like “Temperature, Sound, Pressure, etc.” and to synchronously collect
    information to the central locations. Some of its uses include monitoring the
    environment and habitats, underwater sensing (seismic/oil spills), battlefield
    surveillance, and wireless sensors in enterprise-led networks.


    # 14.1.1.4.4 Vehicular Ad hoc Network (VANET)


    VANET implies a network build in an ad hoc manner wherever different mobile vehicles
    and alternative joint devices are available to connect over a wireless medium
    and communicate helpful data with each other. A tiny network is made at the same
    instance within the vehicles and alternative devices acting as nodes within the
    network. A vehicular Ad Hoc Network allows information exchange among vehicles
    and also between vehicles and “road-side base stations” with an objective of managing
    proficient and harmless transportation.


    # 14.1.1.5 Challenges of Wireless Ad Hoc Network


    # 14.1.1.5.1 Autonomous and Infrastructure-less


    WANET is independent of conventional structure. There is no fixed infrastructure.
    All devices connect through a wireless medium and play the role of an independent
    router and generate independent data because it functions in a dispersed P2P style.
    All nodes are autonomous in nature. Due to the necessity of dispersing network
    administration throughout the nodes, fault identification and management become
    challenging.


    # 14.1.1.5.2 Dynamic Topology


    The nodes in a Wireless Ad hoc Network can move randomly at any interval. Therefore
    the topology of the network of MANET may modify randomly and quickly at undefined
    times. This makes routing tough as a result of the topology is consistently dynamic
    and nodes cannot be assumed to possess determined data storage. In the worst case,
    it is unpredictable whether or not the node can stay because it may leave the
    network at any time.


    # 14.1.1.5.3 Physical Layer Limitations


    Collisions, hidden terminals, interference, uni-directional link, and higher packet
    loss due to constant path breaks because of movement of nodes are some of the
    physical layer limitations faced by wireless ad hoc networks.'
