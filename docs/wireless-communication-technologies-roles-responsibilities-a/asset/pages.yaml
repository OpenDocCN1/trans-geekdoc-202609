    # 14.3 CONCLUSION


    The fundamentals of wireless sensor networks and its usage in SHM Applications
    are briefly discusses the hardware components involved in WSNs, how to route sensed
    data to the remote sink node using clustering technique and optimization technique
    used in WSN. Surveys the literature available in the field of WSN energy optimization
    and sensor node location optimization technique in SHM Applications. The sensor
    node location optimization with proposed Higher Information Oriented Genetic Algorithm
    (HIOGA) and compares its results with the existing exhaustive search, Genetic
    Algorithm, SPEM algorithms. The sensor nodes energy optimization with the proposed
    Cluster Head Routing in Geographic Energy Optimized Network (CHRIGEON) protocol
    and compares its results with existing LEACH and Cuckoo based clustering algorithms.
    The conclusion of the above work based on their performance in terms of both sensor
    nodes location and energy optimization.


