    # 13.2.2 Darwin''s Theory of Natural Selection


    According to Darwin''s theory of natural selection, organisms changed with other
    external environmental changes over time. Change to adapt, according to the surroundings.
    In other words, nature selects the best photos of all organisms able to survive
    even in the worst conditions of all [11]. So if an organism can tolerate adverse
    conditions, it will be able to have more offspring and obviously these offspring
    would have traits of the parents, and so they will have the stamina of surviving
    in the worst conditions as well. So the offspring will also be fittest as parents,
    and with time these options may or may not be able to survive in adverse conditions,
    but only the fittest will carry the survival chain forward [12]. This type of
    survival is known as evolution by natural selection. Darwin has been able to prove
    the theory of natural selection by providing evidence from different scientific
    domains and disciplines. As of now, we know that nature selects the best, and
    the organisms evolve to suit the environment needs of survival [13]. So natural
    selection brings change in the organisms and organisms evolve. The evolution of
    organisms may be in the form of change in color, change in behavior, change in
    size, and many other minute changes. These minute changes over a period of time
    lead to the evolution of any organism rather than the whole species. Some organisms
    mutate or get defects in the genetic formulations of the body [14]. As we all
    know, genetic makeup is known for overall behavior or appearance of any species,
    so the fittest of all have different genetic makeup that helps them to survive
    [15]. We have been able to take the concept of Darwin''s theory of natural selection
    in networking, which has further been able to give a conclusion that if you only
    have the fittest traffic patterns giving the best possible results you can be
    made to achieve low latency and high throughput. So we have been able to implement
    this theory on 2D hexagonal mesh topology, and we have got an optimized result
    set [16].


    # 13.2.3 Genetic Algorithm as Optimization Algorithm


    Genetic algorithm is a search based optimization technique. It works on the principle
    of genetics and natural selection. It has derived its principle from Darwin''s
    theory of natural selection as discussed above. Basically, it is an optimization
    technique that we are using for optimizing our data set, introducing new links
    that gives best results [17]. These things are known to be toroidal links. So
    in our chapter, we have optimized the hexagonal 2D network and hexagonal 3D network
    to form a new 2D and 3D toroidal networks. In optimization, we have a set of inputs
    that are processed to give a set of outputs [18]. Best output can be obtained
    by varying inputs. Genetic algorithm is a part of an evolutionary computation.
    In this algorithm, a pool of possible solutions is present which are'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'further mutated to form a recombination. The further recombination is mutated
    to produce new offspring. And this process goes on repeat till the best possible
    solution is obtained [19]. Fitness value is assigned based on the objective function.
    Fitter individuals are given chances to produce fitter individuals. This phenomenon
    is supported by Darwin''s theory of survival of the fittest. At this point the
    evolution takes place. And the process of evolution occurs until we reach a stopping
    criteria. Genetic algorithms are randomized in nature [20]. It exploits historical
    information. So here are the advantages of the genetic algorithm:


    +   1. There is no derivative information required.

    +   2. It is a faster and very efficient means of optimization.

    +   3. Genetic algorithms are known to exhibit good parallel capabilities.

    +   4. It gives the list of solutions and not just a single solution.

    +   5. It is good when search is large and when many parameters are involved.

    +   6. Optimization is based on continuous functions, discrete functions, or multi
    objective functions.


    Beside advantages it also has some limitations. These limitations include:


    +   1. It is not at all suited for simple problems like derivatives.

    +   2. Fitness value is repeatedly calculated so it is an expensive procedure.

    +   3. There is no guarantee of an optimized solution.

    +   4. It requires a proper implementation.


    # 13.2.4 Adjacency Matrix


    # Adjacency Matrix Representation


    # Advantages


    +   1. Easy to implement.

    +   2. Easy to follow.

    +   3. Removing an edge takes O(1) time.

    +   4. Queries are efficient and can be performed O(1).


    # Drawbacks


    +   1. More space complexity- O(V^2).

    +   2. Even in a sparse graph, the same space is consumed.

    +   3. Adding a single vertex requires O(V^2) time


    This matrix is passed as the parameter to the genetic algorithm to get the desired
    number and position of links to be placed [21].'
