- pgno: 325
  md: 'the WN to transmit the information, the distance of the WN from the sink node
    as additional parameters, in addition to the information quality while selecting
    the WN locations.


    Upon surveying the literature available in this field there are algorithms like
    LEACH, ICSHS claimed to give better energy optimization. All these algorithms
    results can be improved further by designing the system with efficient clustering
    techniques. So, in this thesis, an energy efficient CHRIGEON algorithm is proposed
