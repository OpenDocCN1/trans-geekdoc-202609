    # 11.3.1 HOLOGRAPHIC COMMUNICATIONS


    In conjunction with holographic communications, it is envisaged that 5D communications
    and services, which integrate all human sense information (sight, hearing, touch,
    smell, and taste), will emerge, resulting in a totally immersive experience [13].
    In order to implement holographic communications using multiple-view cameras,
    data rates on the order of terabits-per second will be required [14], which will
    be insufficient for 5G.


    # 11.3.2 ACHIEVING PRECISION MANUFACTURING


    Within the framework of Industry 4.0, a fundamental goal is to reduce human intervention
    in industrial processes by implementing automated control systems and advanced
    communication technologies. In the sphere of high-precision manufacturing, this
    pursuit entails achieving remarkably high levels of reliability, typically ranging
    from 1 to 10^9, and extremely low latency, with round-trip times spanning from
    0.1 to 1 millisecond [15]. Additionally, within the domain of industrial control
    networks, there is a critical need for real-time data transmission characterized
    by exceptional determinism. This translates to an extraordinarily low delay jitter,
    typically in the order of 1 nanosecond.


    # 11.3.3 SUSTAINABILITY IN WIRELESS INTELLIGENT ENVIRONMENTS


    Information and communication technologies (ICTs), encompassing wireless communications,
    cloud computing, and the Internet of Things (IoT), are poised to play a pivotal
    role in advancing global sustainability efforts and enhancing the overall quality
    of life. These technologies have the potential to make significant contributions,
    particularly in domains such as healthcare'
