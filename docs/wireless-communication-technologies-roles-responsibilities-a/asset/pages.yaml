    # ## 2.5.2 QUALITY OF SERVICE (QOS) REQUIREMENTS FOR SAFETY-CRITICAL APPLICATIONS


    Safety-critical applications in VANETs demand specific QoS requirements to ensure
    timely and reliable communication.


    +   1. **Low Latency:** Safety messages must be delivered with minimal delay to
    support real-time decision-making, such as collision avoidance.

    +   2. **High Reliability:** Communication must be highly reliable to avoid communication
    breakdowns during critical situations.

    +   3. **Prioritization:** Safety-critical messages should be prioritized over
    non-critical ones to ensure they receive immediate attention.

    +   4. **Redundancy:** Redundant communication paths are often employed to guarantee
    message delivery even in the presence of network disruptions.

    +   5. **Scalability:** QoS mechanisms should be scalable to accommodate a growing
    number of vehicles on the road.


    Balancing these QoS requirements with the constraints of the communication protocols
    and standards is a significant challenge in VANET design to ensure the effectiveness
    of safety applications in dynamic vehicular environments.


