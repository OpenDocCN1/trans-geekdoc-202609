    # 5.5 CHALLENGES AND ISSUES


    The EFC computing approach is expected to change the design of IoT architectures.
    However, there are a lot of challenges in adopting this network design for multi-layer
    processing. The contents given in the following are assessed from the literature.


    # 5.5.1 TASK OFFLOADING


    Many challenges have to be analyzed regarding offloading techniques such as service
    quality, versatility, fault investigation, privacy, security, and energy efficiency.
    This can occur in any kind of setup such as Edge-Fog, Device-Edge, Fog-Fog, or
    Cloud offloading to fog/edge [30].


    # 5.5.2 SERVICE PLACEMENT (SP)


    Carefully planned SP is considered an enhancement for edge-fog-cloud computing
    which is achieved by minimizing the network capacity and latency by allocating
    services to various network levels [31].


    # 5.5.3 LOAD BALANCING


    A demand rise and reply failure to a service assignment or task offloading causes
    a computational node to handle the processing requests. Therefore, the computational
    nodes which are underutilized must distribute the load between computational nodes,
    maintaining high QoS levels. The challenges are decision-making, problem modeling,
    and resource discovery [32].


    # 5.5.4 HETEROGENEOUS RESOURCES


    The profuse multi-vendor fog environment is deployed on diverse hardware and OS
    setup, resulting in virtualization. Though CC provides a few solutions, it is
    not adaptable for FC. This is because FC requires a container background with
    less overhead and a unified API for the abstraction of the distinct hardware present
    in the fog [33].


    # 5.5.5 RESOURCE ORGANIZATION


    FC aims to deliver computational assets to various services, causing the scaling
    of demanding fog resources to stagger over time. There is a need to implement
    complementary services at every individual Fog Node in the framework.'
  merge: -1
