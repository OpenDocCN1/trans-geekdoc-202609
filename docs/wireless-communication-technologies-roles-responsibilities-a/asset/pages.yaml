  md: '# 12.4 RESULTS AND DISCUSSION


    # 12.4.1 DATASET DESCRIPTION


    The informational database for this work was obtained from the Kaggle website
    [30]. It consists of ten attributes and 5434 instances. Among them, 4383 patients
    affected with coronavirus and 1051 are not. The attributes describe the symptoms
    experienced by the Covid-19 affected patients. The attributes present in this
    dataset are breathing problem, fever, sore throat, dry cough, hypertension, Travel
    overseas, interaction with COVID-19 patients, attendance at substantial amount
    of events, trips to open accessible areas, and relatives functioning in vulnerable
    locations.


    # 12.4.2 EVALUATION PARAMETERS


    Accuracy, precision, recall, F1 Score, and ROC-AUC are the assessment metrics
    employed in this paper. The parameters values are calculated using the following
    notations such as true positive (tp), false positive (fp), true negative (tn),
    and false negative (fn).


    # 12.4.2.1 Accuracy


    It counts how many positive and negative observations were correctly classified.


    ```

    Accuracy = \frac{tp + tn}{tp + tn + fp + fn} (12.1)

    ```


    # 12.4.2.2 Precision


    Precision is determined by dividing the total number of true positives across
    all classes by the sum of true positives and false positives.


    ```

    Precision = TP/(TP + FP) (12.2)

    ```


    # 12.4.2.3 Recall


    The ratio of total true positives across all classes and the sum of true positives
    and false negatives is used to calculate recall.


    ```

    Recall = \frac{tp}{tp + fn} (12.3)

    ```


    # 12.4.2.4 F1 Score


    By computing the mean of the two, it combines precision and recall into a single
    measure.


    ```

    F1 score = 2 \times \frac{Precision \times Recall}{Precision + Recall} (12.4)

    ```'
