  md: '# 6.2.4 MAINTENANCE PLANNING


    New manufacturing machines are fitted with intelligent sensors that continually
    check the condition of all the key parts and can identify any serious problems
    before the system fails altogether. Smart sensors will inform the central system
    of a maintenance issue and send alarm messages to the appropriate people or organizations.


    Without interfering with ordinary tasks, maintenance engineers may efficiently
    arrange schedules of maintenance based on data analysis. The production line may
    minimize unneeded downtime with the help of predictive maintenance. Unexpected
    machine failure might result in product damage, delivery delays, and a loss of
    revenue for producers.


    Each machine''s status is continuously kept in a cloud system. Remote access to
    each machine''s history, performance, and upcoming maintenance is simple (on PCs,
    via web interface or via smartphone applications). The analysis of the obtained
    data may be used to calculate and apply performance improvements for each machine
    and step of the production process [40].


    # 6.3 WEARABLES AND SMART TOOLS INTEGRATION


    The workforce is able to carry out the operation with increased accuracy and efficiency
    thanks to the integration of smart sensors into equipment and machines. Specially
    created wearables and smart glasses assist workers in reducing mistakes and enhancing
    workplace safety.


    Employees can receive immediate warning signals via smart wearables in the event
    of an emergency like a fire or gas leak. Wearables may continually check on a
    person''s health and provide feedback if they are unfit for a task. One of the
    crucial areas in many companies that need constant development to meet rising
    demand is logistics. Shrewd device skill is well-suited to handle numerous intricate
    logistical processes and efficiently achieve items as shown in Figure 6.5.


    Drones are being used by online retailers like Amazon to deliver items to customers.
    Drones and other advanced technology provide higher efficiency, accessibility,
    speed, and need less labor. In contrast to conventional procedures, initial expenditures
    are substantial, and execution has drawbacks.


    Another significant business that makes use of IoT is the airline sector. This
    sector produces aircraft and performs preventative maintenance on those that are
    already in service. Airlines employ IoT technology to track the hundreds of components
    needed for each day of production at the manufacturing facility. Easy supply management
    is made possible by centralized inventory management.


    In the event that any products need to be topped off, suppliers will be notified
    automatically. Inventory management may be successfully performed via IoT without
    much human involvement. Intelligent sensors continually track an aircraft''s mechanical
    components; data is gathered in real-time and sent to the aircraft maker. Any
    time a portion of an aeroplane needs repair, the appropriate personnel is alerted,
    and maintenance is immediately carried out after the jet has landed[41].'
