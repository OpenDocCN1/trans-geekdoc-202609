- pgno: 320
  md: '# 14.1.1.5.4 Restricted Bandwidth and Quality


    The networks have limited link bandwidth and its quality is also low as compared
    to the wired networks. Wireless link has a lower capacity than a wired network.
    These networks have very high levels of fading, numerous accesses, and interference
    conditions, which leads to limited throughput.


    # 14.1.1.5.5 Dissimilarity in Link and Node Capabilities


    All nodes in wireless ad hoc networks are autonomous and have different capabilities
    and link capacity. The heterogeneous radio abilities of node create an irregular
    link. Nodes might have additional interfaces that have variable sending or receiving
    power and may operate in varying frequency bands.


    In addition to this, the nodes may have varying processing capability due to different
    software/hardware configuration. The designing of protocols and algorithms for
    such a diverse network can be complicated. The variation in “power consumption,”
    “traffic load,” “channel conditions,” “congestion,” “traffic distribution,” etc.
    should be kept in mind while building schemes for these networks.


    # 14.1.1.5.6 Energy-Constrained Operation


    All or few of the nodes in a wireless network could also be powered by batteries.
    As batteries have limited power so the processing power of the node is restricted,
    this successively reduces applications and services which will be supported by
    each node. It this state of affairs, the foremost vital system criterion for optimization
    may be energy conservation.


    # 14.1.1.5.7 Network Robustness and Reliability


    Wireless ad hoc networks are less robust than wired network because of wireless
    medium, dynamic topology, and energy constrained devices. This limits the reliability
    of the network. Limited wireless transmission is term to be responsible for less
    reliability of wireless ad hoc networks. Because of the broadcast nature of wireless
    medium, errors occur like packets loss, hidden and exposed node, etc. The characteristics
    of wireless links are time dependent in nature. There are transmission impediments
    that occur, like “signal path loss,” “fading,” “blockage,” and “interference.”
    Therefore, the reliability of wireless transmission is resisted by various factors.


    # 14.1.1.5.8 Network Security


    Compared to a wired network, wireless ad hoc networks are much more susceptible
    to security problems. So, security is one of the critical challenges for these
    networks. The data from one device to different devices should be transported
    safely, securely, and without missing even a single bit of data. Because of infrastructure-less
    organization and lack of centralized observance control, these networks are susceptible
    to a variety of attacks.


    # 14.1.1.5.9 Quality of Services


    In Mobile wireless ad hoc networks, the environment changes constantly, so it
    is very challenging to provide different quality of service levels [21–23]. The
    random'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'nature in the quality communication of MANET makes it troublesome for the server
    to ensure a good service to the devices. To enable multimedia system services,
    adaptive service quality is frequently imposed on traditional resources.


    # 14.1.1.6 Vulnerabilities of WANET


    Wireless ad hoc networks have intrinsically diverse characteristics than wired
    networks. The wireless medium, mobile nodes, dynamic topology, and an exhaustive
    power supply create different security vulnerabilities to these networks. WANET
    faces threats from nodes outside the network that are unauthorized to involve
    within the network and also from nodes inside the network that has the authorization
    credentials to be active within the network. As shown in Figure 14.2, the threats
    may be categories on the source of location into external and internal threats
    and on the basis of behavior into active and passive threats or attacks. Similar
    attacks and its related routing algorithms is referred to in Figure 14.2 [24–26].


    The external threats may range from “passive eavesdropping,” where the malicious
    node only listens to transmit signals to “active interference,” where the enemy
    interrupts the network by sending misleading or corrupted signals or data. In
    passive eavesdropping, the adversaries only intercept the message transmitted
    in the network without disturbing the transmission. The objective behind this
    is that the adversary will be able to analyze the valuable information like network
    topology, and the identity of more heavily used nodes to perform further attacks.
    Eavesdropping is also a problem to maintain location privacy. Similar works and
    their application are referred to in [27–29].


    The main menace from active interference could be an ignorance of service attack.
    This attack causes stopping within the wireless communication medium or broken
    communications. The duration for which the attack is active and the routing protocol
    in use determines the actual effects of such attacks. The reactive routing protocol
    interpret non-acceptance of service to be a link breaks whereas the proactive
    routing protocol does not answer instantly to the undelivered information.


    The internal threats posed by the participating nodes exert more impact as internal
    nodes have the essential data to involve in network management operations. The
    misbehaving internal nodes are categorized into four types “failed nodes,”


    ![](img/be689ed28322f90f68916a35ce44e55d_321_0.png)


    FIGURE 14.2 Classification of security threats.'
