    A route in which all links are forward is called a directed path. The vertex c
    can be reached from each vertex by traversing different paths. This traversing
    cost may vary depending on its location and other factors. In this thesis, the
    objective of reaching the sink node through the shortest path available is achieved
    using the directed graph. The shortest path is calculated considering the distance
    of each node from sink node, remaining energy available and energy consumption
    for transmission as factors influencing the link cost. Based on the overall path
    cost a comparison is made for each route and that route which gives the minimum
    value is chosen as an optimal solution. Dijkstra''s shortest path algorithm is
    used in this thesis to evaluate the shortest path to reach a sink node from each
    vertex.


    # ## 14.2.1.3 Dijkstra''s Shortest Path Algorithm


    This algorithm finds the shortest path between a CH node to all other CH nodes
    or to the sink node available in the network, whichever is closer.


    # ### 14.2.1.3.1 Steps


    +   1. Set of CH nodes which are not visited is formed.

    +      The initial CH node is kept as current node and then assigns tentative
    cost which is zero for the initial node, infinity for the remaining nodes.

    +   2. Considering all the unvisited neighbors calculate the tentative cost of
    current node with respect to the neighbor node and update it with the smaller
    one.

    +   3. After all the unvisited nodes are considered, mark them as visited.

    +   4. Stop the algorithm when the destination node is marked as visited.

    +   5. Else select the unvisited node and set this as a current node and go to
    step 3.

    +      This algorithm helps in finding the optimal path from each CH node to the
    remote sink node.

    +      The initial CH node is kept as current node and then assigns tentative
