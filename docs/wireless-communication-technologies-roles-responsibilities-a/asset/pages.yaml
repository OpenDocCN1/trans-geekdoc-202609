    # 12.1 INTRODUCTION


    As years progress, the way the world communicates with us improves. Internet of
    Things (IoTs) is blooming in the medical field in past few years, as a result,
    there is a technological progression in low-power networked systems and healthcare
    devices [1]. IoT technology has evolved into a critical advancement with a wide
    range of applications. It describes any set of machines that get as well as share
    information over Wi-Fi without the need of user intercession [2]. The medical
    industry is undergoing a substantial shift, with digitalization manipulating how
    practitioners communicate with their patients. Patients are now able ability to
    see their crucial symptoms and assist doctors immediately. IoT as its name infers
    that it is the interconnection of things or devices. Things in IoT can be of any
    kind, from a smart device with much artificial intelligence that can interact
    with other things effectively to a dumb thing that does not interact, for the
    healthcare application IoMT (Internet of Medical Things) is developed.'
