    Figure 9.1 represents the intelligent connectivity between AI, IoT, and WT. It
    is the need of time to increase the level of automation by connecting the physical
    and virtual world through intelligent system, to provide better communication
    among machines and humans [2]. The IoT is a network of devices that are connected
    to the internet and are able to communicate with each other. Our interactions
    with the world around us have changed as a result of IoT. It has enabled the creation
    of smart homes, wearable devices, and connected cars, among others. IoT devices
    can collect data from their environment and communicate it to other devices or
    centralized servers, where it can be analyzed to derive meaningful insights. IoT
    devices can range from simple sensors that measure temperature or humidity, to
    more complex devices such as drones or self-driving cars that use multiple sensors
    to collect data about their surroundings. AI has also witnessed significant advancements
    in recent years. Machine learning and deep learning algorithms have enabled machines
    to


