    # 8.2 FUNDAMENTALS OF WIRELESS TECHNOLOGY


    Wireless technology has changed modern communication networks, allowing for pervasive
    connectivity and reshaping a variety of businesses. The operation of wireless
    networks is based on fundamental principles such as signal propagation, modulation,
    multiplexing, and spectrum allocation [21]. Wireless signals are propagated via
    electromagnetic waves that obey physical rules. Diffraction, reflection, and refraction
    are features of these waves that affect their behavior as they pass'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'through different materials [22]. A thorough understanding of signal propagation
    is required for the design of reliable wireless communication systems. Modulation
    methods are critical in encoding data onto carrier signals. Amplitude Modulation
    (AM), Frequency Modulation (FM), and Phase Shift Keying (PSK) techniques provide
    effective data transmission and reception [23].


    Data speeds and spectrum efficiency are improved by advanced modulation systems
    such as Quadrature Amplitude Modulation (QAM). Multiplexing technologies allow
    several signals to be sent at the same time via the same channel. Frequency Division
    Multiplexing (FDM), Time Division Multiplexing (TDM), and Orthogonal Frequency
    Division Multiplexing (OFDM) maximize spectrum usage and support many data streams
    [24]. Wireless communication is based on the idea of spectrum, which is a finite
    and precious resource. Spectrum band distribution and management for diverse wireless
    services are crucial to avoiding interference and ensuring optimal usage [25].
    Cognitive radio networks seek to intelligently use unused frequency bands in order
    to improve spectrum utilization [26].


    Wireless networks are classified according to their coverage area and structure.
    Local Area Networks (LANs) serve local geographic areas, whereas Wide Area Networks
    (WANs) serve larger areas. Star, mesh, and ad hoc network topologies all have
    advantages in terms of scalability and fault tolerance [27]. Cellular networks
    are a popular wireless technology that divides geographic areas into cells that
    are supplied by base stations. 4G LTE and upcoming 5G cellular technologies provide
    high-speed data transfer, smooth handoffs, and increased spectrum efficiency [28].
    The Internet of Things (IoT) is a paradigm in which networked things interact
    wirelessly because of the advancement of wireless technologies. IoT networks are
    made up of many devices ranging from sensors and actuators to smart appliances
    that work together to enable data-driven decision-making and automation [29].


    Multiple Input Multiple Output (MIMO) technological advancements have considerably
    enhanced wireless network capacity and dependability. MIMO utilizes numerous antennas
    at both the transmitter and receiver ends, taking advantage of spatial diversity
    to reduce fading and increase data throughput [30]. Furthermore, wireless security
    is quite important. Wireless communications are protected from eavesdropping and
    unwanted access by encryption, authentication, and intrusion detection techniques
    [31]. Jamming attacks and localization-based threats provide unique security difficulties
    for wireless networks [32].


    Table 8.1 summarizes the principles of wireless technology, which include a number
    of critical ideas. Signal propagation is the study of how electromagnetic waves
    move across media, whereas modulation is the process of putting data onto carrier
    signals. Multiplexing technologies allow many signals to be sent at the same time,
    and spectrum allocation entails regulating wireless frequencies. The structure
    of networks is defined by network coverage and topology, whereas cellular networks
