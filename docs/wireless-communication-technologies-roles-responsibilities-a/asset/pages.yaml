    # 10.4 SENSOR


    A sensor is a physical device that receives the input signal and transmits it
    through the transmitter. The input signal is a change in heat, light, humidity,
    motion of an object, etc. The output signal is a converted signal to human understanding,
    and the display at the sensor location and the output signal is transmitted over
    the network for further detecting and processing of the information. Sensors play
    a major role in the Internet Of Things. They are used to collect information about
    the subject and process the collected information and transmit it through the
    transmitter. Sensors analyze the subject and act logically on the collected data
    [7,8].


    # 10.5 TYPES OF SENSORS


    # 10.5.1 PRESSURE SENSOR


    The pressure sensor is an electronic device that converts physical data into an
    electronic signal. It detects and monitors pressure and converts it to the output
    signals. Usually, pressure is defined as the amount of force experienced per unit
    area. It is commonly used in Piezoelectric technology, in which the mechanical
    stress(pressure) is converted into electrical energy. The experienced stress is
    proportional to the electrical energy. There are three main pressure sensors that
    are widely used (Table 10.1):


    +   - Gauge pressure

    +   - Absolute-pressure sensor

    +   - Differential-pressure sensor.


    Gauge pressure sensors utilize the atmospheric pressure and measure the reading.
    It completely depends upon the atmospheric pressure, which has an effect due to
    the factors of altitude and humidity. Positive pressure is when the gauge sensor
    experiences pressure greater than the ambient atmospheric pressure. Negative pressure
    is when the gauge sensor experiences pressure lesser than the ambient'
