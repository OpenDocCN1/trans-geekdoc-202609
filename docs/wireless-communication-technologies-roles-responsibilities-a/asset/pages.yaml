    # ## 2.3 WIRELESS TECHNOLOGIES ENABLING VANET SAFETY


    Wireless technologies play a pivotal role in enhancing safety and communication
    within Vehicular Ad-Hoc Networks (VANETs), which are crucial for modern intelligent
    transportation systems. Below, an in-depth overview of each of the mentioned wireless
    technologies and their roles in ensuring VANET safety.


    +   1. IEEE 802.11p (WAVE - Wireless Access in Vehicular Environments):

    +   * IEEE 802.11p, a standard under the Wireless Access in Vehicular Environments
    (WAVE) framework, is designed explicitly for VANETs. It operates in the 5.9GHz
    band and offers Dedicated Short Range Communication (DSRC) [13].

    +   * DSRC based on IEEE 802.11p is highly suitable for safety-critical applications,
    providing low latency, high-reliability communication among vehicles and infrastructure
    components. It facilitates vehicle-to-vehicle (V2V) and vehicle-to-infrastructure
    (V2I) communication.

    +   * Key safety applications include collision avoidance, traffic signal preemption,
    and cooperative awareness messages (CAMs) sharing real-time data on vehicle position,
    speed, and status.


    +   2. Cellular Technologies (e.g. 4G, 5G, and Beyond) in VANET Safety:

    +   * Cellular technologies, including 4G LTE and 5G, offer an extended communication
    infrastructure for VANETs. They provide wider coverage and connectivity beyond
    DSRC''s short range [14].

    +   * 4G LTE enables Vehicle-to-Infrastructure (V2I) communication, supporting
    applications like traffic management, navigation, and emergency services.

    +   * 5G and beyond are expected to revolutionize VANETs with ultra-low latency,
    high bandwidth, and massive device connectivity. They are well-suited for latency-sensitive
    safety applications like autonomous driving and cooperative collision avoidance.


    +   3. Emerging Technologies: 5G Vehicle-to-Everything (V2X) Communication:

    +   * 5G V2X communication is a subset of 5G technology designed for VANETs. It
    enables vehicle-to-everything connectivity, encompassing V2V, V2I, vehicle-to-pedestrian
    (V2P), and vehicle-to-network (V2N) communication [11].

    +   * 5G V2X offers incredibly low latency (in the millisecond range), high reliability,
    and the capacity to handle massive device connectivity. These attributes are crucial
    for real-time safety-critical applications, such as autonomous driving, where
    split-second decisions are essential.'
