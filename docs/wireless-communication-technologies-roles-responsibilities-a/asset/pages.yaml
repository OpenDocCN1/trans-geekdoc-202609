    # 10.8 GLUCOSE SENSOR


    A glucose sensor essentially measures the amount of glucose in the body. There
    are two types of glucose sensor:


    +   - Glucometer blood glucose meter, also called continuous glucose. The glucometer
    monitor measures a Snapshot of the glucose giving a fixed number at one point
    in time.

    +   - CGM measures the glucose level periodically, often every five minutes along
    with the current level. We can also identify which direction the glucose is going
    and how fast it is going in that direction.


    How do they work? Glucose sensors are essentially biosensors. Biosensors are devices
    that use living organisms or biological molecules to detect. The presence of chemicals
    in the biosensor for detecting glucose levels consists of several components.
    First is the analyte, which is the substance we are trying to measure; in our
    case, the analyte is glucose. Second is the bio-receptor, which is a molecule
    that specifically recognizes the analyte, and third is the transducer, which converts
    one form of energy into another. Modern devices use electrochemical methods for
    detecting the glucose level more specifically. They use an amperometric type of
    sensor that monitors current when electrons or changed between a biological system
    and an electrode. Finally, the electronic system processes the transducer signal
    and preparation for the display, and the display generates numbers or curves understandable
    by the user [30].


    # 10.8.1 BIORECEPTOR


    Enzyme-based receptors are the most prevalent kind. The two enzyme families that
    make up the majority of glucose biosensors are glucose oxidase (GOx) and glucose
    dehydrogenase (GDH). These enzymes delay the cofactor selectivity of redox potentials
    for glucose. Commercial production of the GOx enzyme is based on a fungal reaction
