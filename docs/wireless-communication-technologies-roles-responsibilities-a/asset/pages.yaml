    # 12.3.2 SOFTWARE DEFINED NETWORK (SDN)


    The primary function of IoT systems is to gather information from environments
    and render that data available and useful if required. The features of IoT mentioned
    such as privacy, network connectivity and huge volumes of data and devices present
    challenges in developing a quick, stable, and convenient network infrastructure.
    Tackling these issues necessitates novel applications of SDN technology beyond
    its existing use in data centers and core networks.


    SDN appears to be the most successful and potential technology widely used in
    many areas. In SDN architecture there are three stages such as application plane,
    control plane, and data plane. With programmability of networks, the SDN model
    has simplified networking management to a client-free framework [25] (Figure 12.3).


    SDNs emerged as a new networking conceptual framework as the control plane and
    data plane were separated. Due to its original and assuring structure, the entire
    control logic has been routed to a centralized control plane. Its resilience and
    prospects are built on its centralized architecture and intellectual capacity.
    To collect data from connected nodes, an SDN controller employs the southbound
    protocol. The most essential protocol used is the southbound protocol, which is
    in charge of data transfer between the controller and connected nodes. One of
    the most prominent southbound protocols is OpenFlow, a widely used networking
    connection developed by the Open Networking Foundation (ONF). This interface enables
    provision for nodes such as switches and routers to transfer or acquire data.


    SDN was initially intended to be utilized in the basic network and data centers,
    in which extremely skilled routers or switches are used to optimize the consumption
    of various resources. IoT networks are further varied and propagated than mobile
    networks, and controlling and tracking the servers as well as the network gets
    more'
