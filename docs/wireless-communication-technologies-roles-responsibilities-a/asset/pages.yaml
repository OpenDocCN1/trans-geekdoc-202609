- pgno: 98
  md: '![](img/be689ed28322f90f68916a35ce44e55d_98_0.png)


    # 5.2.1 SOFTWARE-DEFINED NETWORKING (SDN)


    Network management operations such as rerouting, forwarding, and analyzing user
    requests are performed by SDN. Figure 5.2 shows SDN architecture consisting of
    switches, routers, wireless access points, and other forwarding devices, while
    the control reasoning is divested to a close orchestrator. The reasoning control
    can be categorized as central or dispersed, reactive or proactive, and fine or
    coarse-grained. Edge devices need not worry about selecting the optimal destination
    to perform task offloading in SDN. Many complex network jobs like IP table updates
    are avoided. The SDN framework is responsible for meeting the prerequisites of
    edge device needs about the existing network state.


    # 5.2.2 MULTI-ACCESS EDGE COMPUTING (MEC)


    MEC ensures reliable resource access to service developers. MEC servers do not
    comprise consumer devices but with processing nodes specifically fixed by a mobile
    network operator at the network edge. In addition, MEC servers are equipped with
    pre-installed services, available through integrated APIs and accessing applications.
    MEC servers are located under the mobile network core packet and are focused on
    the essential network. Greater coverage is achieved as the MEC establishes communication
    through the mobile network. Thus, for the time being, MEC is considered an advanced
    distributed computing design.


    # 5.2.3 MOBILE CLOUD COMPUTING (MCC)


    Offloading tasks are widely performed by MCC. In early 2010, MCC gained momentum
    when most edge devices, such as eHealth wearables and smartphones, could not execute
    most of the AI applications in real-time. Similar to FC is the offloading and
    computation process, but the limitation is latency. Figure 5.3 shows'
  merge: -1
  img_proc: true
- pgno: 99
  md: '![](img/be689ed28322f90f68916a35ce44e55d_99_0.png)


    # FIGURE 5.3 Architecture of MCC.


    the MCC architecture, which performs distributed processing with ease. The cloud
    receives all the data from the edge device during task offloading. The processing
    is done, and the edge device receives the result. Minimal time is required to
    perform task offloading by the data centers, but the communication latency exists
    in the range of 10 s or even 100 s which exceeds the cost of maximum applications.


    # 5.2.4 DEW COMPUTING (DC)


    DC is associated with reliable and secure data storage and a standard closely
    tied to Cloud Computing. DC aims to enhance the cloud functionalities to edge
    devices, where applications in association with the cloud can be executed. Thus,
    the two collaborate to deliver maximum functionality if there is a connection
    between cloud and edge devices. However, if there is no link, the edge device
    continues to execute the service repeatedly, with minimum functionality. Git and
    Drop Box are a few examples. These principles are the core of FC. The limitations
    of DC and MACC are the same, but MACC is not desirable for latency-sensitive services.


    # 5.2.5 CLOUDLET


    Cloudlets are considered an alternative to MCC and represent data centers. They
    are closer to the edge nodes and denote a minuscule form of the cloud-based data
    center. They are extensively distributed through the network infrastructure and
    create an effective fusion of distributed computational devices. Hence, they have
    named edge clouds. A cloudlet is transmitted and operated by a huge service provider
    (SP). A single cloudlet provides service to multiple offices, buildings, or research
    organizations as they own sufficient computational competencies to handle large
    volume of edge devices [9].'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# 5.2.6 MOBILE COMPUTING (MC)


    Edge node with adequate processing abilities can process tasks efficiently in
    MC. Smartphone are a common example. These advanced devices act on integrated
    sensors and process promptly. Complex ML algorithms are executed in Smartphone
    due to their multi-gigahertz and multi-core capability and preventing the relay
    of heavy computation tasks to external computing nodes. Other consumer-grade edge
    devices also have the similar trend of increasing processing ability. They are
    similar in working with Smartphone. However, these edge devices cannot be compared
    with the least data center’s ability [10].


    # 5.2.7 EXTREME EDGE (MIST COMPUTING)


