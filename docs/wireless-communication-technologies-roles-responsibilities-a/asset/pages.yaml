    will be considered useless. In recent years, the millimeter range (30–300 GHz)
    is analyzed in research and multiple edge devices are beginning to provide multi-gigabit
    services. Hence, the data transfer latency is pushed below 1 ms and shortly, as
    the key feature of the 5 G new Radio (NR).


    # ## 5.5.11 DATA ANALYTICS


    It is necessary to distribute data and processing among distinct edge nodes for
