    # ## 6.1 INTRODUCTION


    Wireless systems provide several and substantial advantages over traditional wiring.
    A smart factory that is really flexible, with automatic directed automobiles that
    can travel anywhere they are required and automation that collaborates to maximize
    productivity. But without wireless solution, this degree of flexibility and authentication
    would not be conceivable. Through wireless technologies, users may securely access,
    control, or monitor devices [1,2]. Personnel are no longer required to check on
    equipment while atop a tall ladder, underground in a mine, or in another uncomfortable
    or potentially hazardous location. There is no need to even be close to the equipment
    if it is connected to a wide-area network (WAN), which can lower travel expenses
    and difficulties [3].


    Additionally, wireless systems are less expensive to deploy and simpler to grow
    or alter. Because there is no need to physically connect to the equipment, maintenance
    expenses are also decreased because the connections are less likely to be harmed
    by continuous usage. Have still not companies embraced wireless technology yet?
    The'
