  md: '# 10.2 CONTACT LENS


    Contact lenses were introduced in 1936 by an optometrist, William Feinbloom. Nowadays
    most people have deficiencies in their vision. One of the reasons for vision deficiency
    is diabetes. One’s good vision contributes to self-confidence and overall independence
    for people of all ages. People with imperfect vision can be improved by treating
    it. Improper vision can be corrected with power glass, laser treatment, and contact
    lenses. People prefer using contact lenses rather than power glass and laser treatment.
    Early contact lenses were made of glass and hard plastic. Now technology has developed
    so that people can wear them in a very comfortable way. Contact lenses are placed
    at the top of the cornea in the eye, which makes the vision clear. People having
    refractive errors in the eye like farsightedness and near-sightedness are suggested
    to wear contact lenses to improve their vision. Nowadays, people use prosthetic
    lenses for cosmetic enhancement. A prosthetic contact lens is commonly called
    a zero-power contact lens, or a Plano contact lens. It is placed over the cornea
    if the cornea has become cloudy or opaque; therefore it makes the vision clear.
    Cosmetic contact lenses are used by people to change the color of the iris. They
    are translucent, enhancing the natural color of the eye and making a blue iris
    look deep blue. Cosmetic lenses, which are opaque, show brown eyes, blue eyes,
    and lavender eyes. People with disfigured irises or corneas due to ocular disease
    use these lenses to look normal. Even people with Myopia or Hyperopia use colored
    contact lenses, which are called prescribed cosmetic contact lenses. Tints are
    available in the contact lens to make the process of inserting and removing the
    contact lens easy. A tinted contact lens is nothing but a dye incorporated in
    the lens to look better on the eye. Mostly, tinted contact lenses are in light
    blue and green. Plano contact lenses are purely for cosmetic purposes and do not
    have lens power for vision correction. Cosmetic contact lenses are transparent
    and opaque. A transparent cosmetic lens permits 70% of the light to pass through
    it and is available in the market in different shades, and tints will be in a
    pattern of concentric rings. The opaque cosmetic lens absorbs or reflects the
    light entering the lens and completely covers the underlying eye color; they too
    have an iris pattern with a clear central pupil. The shape of Plano contact lenses
    is dotted or lined with a variety of colors so that it looks natural to the eye.
    The area around the pupil will have color. The center of the lens, the part over
    the pupil, will be clear, with no color to enhance the clarity of the vision.
    There are a variety of colors in contact lenses like blue, green, hazel, violet,
    brown, gray, and amethyst. Choosing the eye color contact lens is important; it
    should be chosen depending on one’s hair color and skin tone. Customization of
    both prescribed and non-prescribed contact lenses is available in the market [3,4].


    # 10.3 TYPES OF CONTACT LENS


    +   - Soft contact lens

    +   - Gas-permeable contact lens

    +   - Extended-wear contact lens

    +   - Disposable contact lens

    +   - Toric contact lens. (Figure 10.1)'
