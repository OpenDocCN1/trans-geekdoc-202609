  md: '# ## 5.5.6 FAILURE MANAGEMENT


    There is a demand for more resources while integrating abstracted fog setups during
    runtime similar to the CC. In addition, FNs can cause minimal network errors,
    and enter or leave the network at any time and during any local operation. Therefore,
    high resilience levels are required to achieve safety in the framework. Consider
    the movement of robot arms in cluster. Sufficient resilience must be placed at
    every FN to handle sole failure points [34].


    # ## 5.5.7 INTER-FOG TRANSMISSION


    Communication is possible in horizontal and vertical directions by an FN. The
    common topology requires horizontal communication to permit through one additional
    layer. This additional overhead increases the delay in communication and the fog’s
    vulnerability to failure. So, additional connections among the fog nodes.


    # ## 5.5.8 SUPPORT FOR MOBILE USERS


    Various fog architectures are built to process requests efficiently. But, they
    analyze limited group of FC. Shortly, fog has to include various user categories,
    including high-mobility ones. Therefore, the approach is to locate each edge device
    into distinct user groups, which specify their mobility behavior and fog resource
    distribution [35].


    # ## 5.5.9 FOG HARDWARE SUPPORT


    Fog can incorporate multiple nodes among the core and the network edge. APs and
    other consumer-based gateways are perfect examples. The purpose-built IoT gateways
    are very expensive and not available in most electronic markets. Hence, flexibility
    is achieved by replacing slice of the ASIC with a multipurpose CPU, or the acquirement
    of CPU and GPU additionals will increase the usage of FC.


    # ## 5.5.10 LOW LATENCY THROUGHPUT WIRELESS TRANSMISSION


    There are challenges in transferring data from edge nodes to close FNs and minimizing
    the physical gap among the fog and the edge. For example, few applications require
