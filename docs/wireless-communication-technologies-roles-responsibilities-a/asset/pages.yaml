    # 10.9.1 BLOOD GLUCOSE VERSUS SENSOR GLUCOSE


    Glucose is a carbohydrate and the main source of energy for our cells, we acquire
    glucose from food which then makes its way from our digestive track to the bloodstream
    and then the interstitial fluid, which is the fluid that surrounds all cells in
    the body. From this fluid, glucose then moves into cells. A blood glucose meter
    measures the amount of glucose from a finger prick using single-use enzyme-coded
    test strips. Although a continuous glucose monitor usually monitors the glucose
    in saliva, urine, and interstitial fluid. Tear film, however, provides an effective
    illustration of blood replenishment. Tear glands, which are present in the eyes
    of all mammals, release tear fluid. Lipids, proteins, enzymes, and electrolytes
    are all present in the multilayer of the basal tear fluid. Basal tear protects,
    cleans, and lubricates the eye. The compositional difference between the blood
    and the tear flow is caused by the separation of the blood and the tear. Blood
    metabolism leaks into the tears as it travels through the blood-brain barrier
    to reach the brain. From this, the relationship between the blood and the tear
    is established. The analyte may be continually monitored over an extended length
    of time utilizing the bio-receptor in the eye without the pain of using any strips.


