    # 14.1.2 APPLICATIONS OF WSN


    WSN applications are classified into two types:


    +   - Category 1: Mesh based WSN with multi-hop transmission and dynamic routing

    +   - Category 2: point to point with single hop transmission and single hop routing


    The sensors deployed in typical applications like data collection, environmental
    monitoring, structural monitoring, military surveillance, and medical telemetry
    consider energy consumption levels as an important criteria which can hinder system
    lifetime.


    Due importance is given to SHM applications which monitor civil structures like
    Bridges and Multistorey application. The goal of SHM is to develop smart structures
    which can self-diagnose the problems and raise alerts if there is any damage in
    the structure. For instance, in earthquake prone zones routine mild tremors give
    rise to hidden cracks that may not cause visible damage to structural condition
    of the building.'
