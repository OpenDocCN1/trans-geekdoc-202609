    # 10.3.1 SOFT-CONTACT LENS


    The soft contact lens is very comfortable to wear. It is gel-like material and
    flexible plastic such as a hydrogel. As its name suggests, it is soft and comfortable
    to wear and allows oxygen to pass through the cornea. It is breathable and simple
    to wear. For long wearing hours, a soft contact lens is suitable. Silicon hydrogel
    lens is an advanced soft contact lens. It is more permeable, which permits oxygen
    to pass through it and reach the surface of the eye. Soft contact lens is used
    for many purposes like optical, preventive, therapeutic, cosmetic, diagnostic,
    and occupational. Optical contact lenses are commonly used for myopia, hyperopia,
    and astigmatism. To prevent chemical burns and exposure of eyes to a harmful environment,
    a preventive contact lens is used. For Electro retinography, a diagnostic contact
    lens is used. Sports persons, actors, and pilots use it for occupational purposes,
    hence it is called an occupational contact lens.


    # Advantages


    +   - Very less chance of dislocation of contact lens

    +   - Easy for initial comfort and easy fitting

    +   - Used for occasional wear

    +   - Less photophobia

    +   - Long wearing time

    +   - Easy to adapt to the eye

    +   - Great for an active lifestyle.


    # Disadvantages


    +   - As it is soft, it can be torn or lost easily

    +   - Over a long time of usage may cause dryness in the eye

    +   - Patience handling is required Soft Lens is implemented in

    +   - Clear and colored soft lens'
