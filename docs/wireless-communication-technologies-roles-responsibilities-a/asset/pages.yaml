    technology finds its immense use case in the implementation of reconfigurable
    surfaces that can help in achieving a higher directivity. And in turn, these RHS
    elements find their application in wireless communication in 6G mobile phones
    where they can be used to provide highly reliable multiuser communication with
    increased channel capacity.


