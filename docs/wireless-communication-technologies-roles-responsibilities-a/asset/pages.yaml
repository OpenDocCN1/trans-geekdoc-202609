  md: '# # Integration of Mobile Edge Computing in Wireless Technology


    Shaik Khaja Mohiddin

    Dept. of CSE, Koneru Lakshmaiah Education Foundation, Vaddeswaram, Guntur District,
    Andhra Pradesh, India


    Shaik Sharmila

    Dept. of IT, VNITSW, PedaPalakalur, Guntur, Andhra Pradesh, India


    Vandana Sharma

    Department of Computational Sciences, CHRIST (Deemed to be University), Delhi
    NCR Campus, India


    # ## 1.1 INTRODUCTION


    The exponential development of wireless communication technology has changed how
    humans interact with one another and get knowledge. The progression of wireless
    technology from the introduction of 4 G networks to the revolutionary potential
    of 5 G has indicated more bandwidth, lower latency, and better connection. However,
    existing wireless networks are struggling to satisfy the demanding needs of future
    use cases like driverless cars, smart cities, and augmented reality as the demand
    for such applications and services keeps increasing.


    Mobile Edge Computing (MEC) has evolved as a game-changing solution to overcome
    these issues and release the full power of wireless networks. With MEC, computation
    and storage may be moved closer to the network’s edge, allowing for more effective
    data processing and analysis there. When mobile edge computing (MEC) is combined
    with wireless technology, novel chances exist to improve the efficiency of networks,
    optimize resource utilization, and make available low latency, high-bandwidth
    applications [1].'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'This chapter delves further into how Mobile Edge Computing may be used to wireless
    networks. First, we provide a high-level description of MEC, including topics
    such as its architecture and major components. We address the reasons for merging
    MEC with wireless networks, focusing on the advantages and disadvantages of this
    new paradigm. We also explore the history and development of wireless communication
    systems, including 4 G, 5 G, and Wi-Fi, in addition to their principles. This
    chapter continues the discussion of MEC''s integration into wireless networks
    by examining the various deployment strategies and supporting technologies. The
    authors compare and contrast the merits of centralized, dispersed, and hybrid
    deployment models for MEC, demonstrating the latter two models'' adaptability
    and readiness for use in a variety of network settings. The interconnection and
    seamless integration fostered by MEC in wireless networks are also discussed,
    along with the standardization efforts and industry activities that are pushing
    its adoption.


    The transformational potential of MEC incorporation in wireless technology is
    demonstrated via the presentation of real-world use cases and applications. We
    explore real-world applications such as smart cities, driverless cars, and augmented
    reality, dissecting each one to reveal its unique benefits and limitations. We
    also discuss the privacy and security issues that arise in MEC-enabled wireless
    networks and offer suggestions for how these might be dealt with. Integrating
    MEC into wireless networks necessitates careful attention to performance optimization
    and resource management. Methods for improving MEC functionality are covered,
    such as load balancing, allocation of resources, and strategic placement of network
    functions [2].


    # 1.1.1 FUNDAMENTALS OF WIRELESS TECHNOLOGY


    This survey of wireless networking methods introduces the wide range of wireless
    protocols that underpin modern digital interaction. Popular examples of such technologies
    are 4 G and 5 G mobile networks and Wi-Fi. Significant improvements in data rates
    and network capacity were introduced with the advent of 4 G, or the fourth generation,
    allowing for superior video streaming, quicker downloads, and a better overall
    user experience.


    The fifth generation of wireless technology, or 5 G, is the next big thing in
    terms of speed, latency, and capacity. With its capacity to manage vast data flow
    and link a large number of gadgets concurrently, it hopes to serve a broad variety
    of applications, which includes driverless cars, smart cities, and the growing
    Internet of Things (IoT) [3]. Wi-Fi, short for “wireless fidelity,” is a standard
    protocol for WLANs at this point. It paves the way for gadgets to link up with
    the web and talk to one another in close proximity. Wi-Fi has found widespread
    adoption in a wide range of settings, including private households, commercial
    establishments, public areas, and even factories.'
  merge: -1
  img_proc: true
