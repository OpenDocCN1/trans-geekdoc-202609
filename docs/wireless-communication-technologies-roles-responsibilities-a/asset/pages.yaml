    # ## 10.1 INTRODUCTION


    Innovation in the medical field is important for enhancing the healthcare system.
    Nowadays, wearable devices are used for continuous monitoring of health conditions.
    Wearable devices such as “Biosensor contact lenses” are implemented in the medical
    field for collecting information about the human body in a painless manner. Biosensor
    contact lens enables individuals to monitor their glucose levels continuously
    and help treat themselves accordingly. Diabetes is increasing at an alarming rate;
    continuous monitoring of glucose levels is essential to manage diabetes. According
    to WHO, in 2019, diabetes caused direct death of 1.5 million people and 460000
    died because of kidney disease caused by diabetes. Diabetes is a major cause of
    heart attack, kidney failure, stroke, and blindness. Regular monitoring of blood
    glucose levels is very crucial to managing Type 1 and Type 2 diabetes. A wearable
    biosensor contact lens aids the subject to monitor how their glucose level goes
    high and low when eating different foods and alerts them [1,2].'
