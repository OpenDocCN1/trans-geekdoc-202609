    smart buildings continue to present obstacles. Clear, intelligent solutions can
    help to reduce these issues. Smart building initiatives might appear to be hard.
    With the endless uses of this technology, such as the Internet of Things (IoT)
    and Power-over-Ethernet (PoE) solutions, numerous concerns might emerge from concept
    to implementation as shown in Figure 6.6. A smart building project comprises many
    stages and people, which creates obstacles in a range of areas.


    Because of these difficulties, it is critical to have a thorough strategy in place,
    to set firm and realistic timetables, and to have open lines of communication.
