  md: '# 5.7 FUTURE DIRECTIONS


    The EC and FC models are influential extensions to the cloud infrastructure, however,
    a few issues need to be addressed. The major challenges faced by these standards
    can assist as a probable future research direction.


    +   A. **Task Partitioning and Programmability**

    +   In the existing CC models, back-end applications are programmed by users on
    an abstract platform, without the knowledge of the cloud server setup. This is
    an advantage as the user is deprived of the platform configuration. Therefore,
    the cloud SP can compile and execute the application easily on the cloud server
    which has an adjustable setup. Back-end processing is shared across various computational
    nodes with the development of EC and FC models. This is a challenging problem
    for system developers to develop improved approaches for processing and storage
    sharing across all nodes, such that the synchronization process will not hinder
    the network’s communication and result in minimum intra-network transmission latency.


    +   B. **Security and Privacy**

    +   Due to the increased interest in FC and EC models, many users utilize enhanced
    storage, processing resources and networking of CC servers focused on the network
    edge. This flexibility leads to many issues in securities which have to be addressed
    by the system designers. Various network security characteristics and the main
    security and privacy issues are summarized as given in the following:


    # 5.7.1 TRUST AND AUTHENTICATION


    EC and FC networks provide services that are reliable and secure to all users
    leading to an important prerequisite that all network devices must trust each
    other. Therefore, fog and edge nodes must check whether these are genuine services
    requesting resources. Also, edge or fog nodes must verify whether the resources
    sent to the services are genuine. These apprehensions led to authentication techniques.
    Thus, network resources must be authenticated before requests and transmissions.
    New approaches such as permissioned blockchain networks like Trust Chain [37,38]
    for verification, cryptographic validation approaches like SAKA-FC, and hardware-based
    verification techniques perform authentication of network possessions by using
    physically unclonable functions.


    # 5.7.2 INTEGRITY


    Network data transmitted in an EC and FC must be done in a secure approach such
    that attackers do not alter data. GNU Privacy Guard (GPG) ensures the integrity
    to transmit data. The integrity is validated at the destination station which
    is crucial in EC and FC due to the dependency on intra-network data transmission
    [39].'
