    # 13.1 INTRODUCTION


    # 13.1.1 MESH NETWORK TOPOLOGY


    In this mesh topology, all the nodes(computers) are connected in a network where
    each and every node is connected to each other via network (cable/wire). In other
    words, every device is connected to every other device in mesh topology [1]. There
    is a point to point link between the connected devices. We can calculate the number
    of links by the formula n(n-1)/2 where n is equal to the number of devices. There
    are some advantages of using mesh topology. The most important advantage being
    no traffic problems due to point to point or direct link between the two communicating
    devices. Hence, being a reliable and secure network system. Moreover, detecting
    any fault in the network is easier in mesh topology. You may also find some disadvantages
    of using mesh topology. Like the number of wires required is more so it sometimes
    becomes a tedious task. Scalability problems are more regular in mesh topology
    [2].


    A mesh topology can be of two types: full mesh topology and partially connected
    mesh topology. In a full mesh topology, each node or computer in the system has
    an association with every different node or computer in that network [3]. The
    number of associations in this topology can be determined using the formula, where
    n is the number of computers or nodes in the network. In a partially connected
    mesh topology, any of two of the nodes or computers in the (n)/2n – 1 network
    have'
