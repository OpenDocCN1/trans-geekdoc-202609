    # ## 10.3.1.1 Clear and Colored Soft Contact Lens


    Soft contact lenses are available in both clear and colored forms. Clear soft
    contact lens is used to correct the vision and colored soft contact lens are dyed
    according to the user''s wish and used to improve the quality of the vision.


    # ## 10.3.1.2 Disposal and Non-Disposal Soft Contact Lens


    They can be replaced in a day a week, or a month and longer. According to the
    disposal period, lenses are classified as mentioned earlier. Soft lenses are also
    available according to the period of disposal; they are classified as disposable
    and non-disposable soft contact lens.


    # ## 10.3.2 Gas-Permeable Contact Lens


    PMMAs (polymethylmethacrylate) lenses are impermeable to oxygen. Earlier it was
    used for making contact lenses because they are inexpensive to produce. They are
    strong, more durable, scratch resistant, and easy to fit inside the eyes. PMMAs
    are rigid plastic and transparent. If there is no oxygen to the conjunctiva and
    cornea, then it will cause potential problems, hence why gas-permeable lenses
    are used. In later years, gas-permeable lenses were developed; they are oxygen-permeable
    but rigid materials. Chemist Norman Gaylord played a prominent role in the innovation
    of oxygen-permeable contact lenses. Gas-permeable contact lenses are the most
    durable and resist accumulation over the lens. It gives clear and crisp vision.
    They are easy to handle and not easily torn [5].


    # ### Advantages


    +   - Provides excellent vision

    +   - Allows oxygen to pass through it

    +   - Short adaptation period

    +   - Available in tints

    +   - Available as a bifocal lens

    +   - Can be worn for a long period


    # ### Disadvantages


    +   - Consistent wear to get used to this lens

    +   - Dislocated easily, slipped off the center of the eye

    +   - Get scratched easily if slipped from the eye

    +   - If debris under the eye, it causes more discomfort


    # ## 10.3.3 EXTENDED-WEAR CONTACT LENS


    Most of the extended-wear contact lenses are made of Silicone hydrogel. Silicone
    hydrogel lenses enable five times more oxygen to reach the cornea compared to'
