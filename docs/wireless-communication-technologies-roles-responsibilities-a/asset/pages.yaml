  md: 'regular hydrogel lenses. Silicone and regular hydrogel lenses seem to be hard
    when they are dry but readily absorb water. It becomes gel-like material and gets
    soft when hydrated. Extended-wear contact lenses can be worn continuously for
    six nights and seven days. With the invention of silicone hydrogel, it is easy
    to allow oxygen through the lens to the eyes. People can wear an extended contact
