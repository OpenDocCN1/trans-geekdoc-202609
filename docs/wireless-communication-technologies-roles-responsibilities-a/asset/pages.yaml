  md: '# ## 9.3.5 Big Data


    Three characteristics can be used to define the big data; these are: volume, variance,
    and velocity [8].


    +   a. Volume refers to a large amount of data produced by multiple devices at
    different locations around the world.


    +   b. Variety: Analysis of different kinds of data generated from different resources
    for analyzing different situations and scenarios.


    +   c. Velocity: refers to the response time the system takes to interpret the
    data and take action accordingly.


    AI & IoT are becoming soulmates of each other they both are dependent on each
    other and cannot exist without big data and data analysis which creates a new
    concept of AIoT. AI is directly proportional not only to large amounts of data
    but also depends on the quality of these data. Good information extracted from
    data provides better detection and solution for prevention. Adapting AIoT is creating
    a cognitive computing system which is capable of finding patterns in the data
    and finding flaws or anomalies that are not easy for human beings to detect.


    # ## 9.3.6 Edge Computing/Cloud Computing


    Edge computing and cloud computing are two interconnected yet distinct computing
    paradigms that have gained prominence in recent years. Cloud computing is the
    practice of providing computing resources, including servers, storage, databases,
    and software applications via the Internet. These resources are typically provided
    by large, centralized data centers that are managed by cloud service providers.
    Cloud computing offers several benefits, such as scalability, flexibility, and
    cost-effectiveness, and has become the de facto standard for many businesses and
    organizations. Edge computing, on the other hand, refers to the processing and
    analysis of data at the edge of the network, closer to where the data is generated.
    Edge computing typically involves the deployment of small, low-power computing
    devices, such as sensors, gateways, or micro-servers, in proximity to the data
    source. Edge computing is designed to reduce latency, improve data privacy and
    security, and increase the efficiency of data processing. Edge computing and cloud
    computing are often used in combination to create hybrid computing environments.
    For example, edge devices can be used to collect and preprocess data before transmitting
    it to the cloud for further analysis and storage. This hybrid approach can offer
    the best of both worlds, combining the speed and efficiency of edge computing
    with the scalability and versatility of cloud computing.


