    # 14.1.1.1 Historical Review


    The WANETs are classified into four generations. The first generation starts in
    1972. The DARPA (“Defense Advanced Research Projects Agency”) started exploration
    and analysis on the practicability of involving “packet-switched radio” communications
    technology to produce consistent computer communications [5]. The packet radio
    network (PRNET) in amalgamation with “ALOHA (Arial Locations of Hazardous Atmospheres)”
    and “CSMA (Carrier Sense Medium Access)” has evolved through the years (1973–987)
    to be a reliable, robust, and operational experimental network [6].


    The 2nd generation of ad hoc network evolved in the late years of 1980s. The “Survivable
    Adaptive Radio Networks (SURAN)” program gears the development of ad hoc networks.
    These enhancements and improvements in the ad hoc networks have considerably provided
    an atmosphere for mobile nodes on the battlefield [7]. This had made the mobile
    nodes to survive even without the availability of fixed infrastructure. The 2nd
    generation of ad hoc network has taken along an exponential growth in the performance
    of radios by reducing them to smaller and inexpensive networks and by making them
    highly robust to attacks.


    In the late years of the 1990s and in early 2000, the 3rd generation of wireless
    ad hoc networks brought the concept of commercialization of ad hoc network with
    the rapid enhancements in mobile technology [8]. In the meanwhile, the revolutionary
    idea of the grouping of mobile nodes was put on the table at several research
    conferences and seminars. Mobile ad hoc network was revived as a potential technology
    in the field of computer communications. And looking at the possible growth and
    vast adaptability of the technology, “Mobile ad hoc network” working committee
    was organized by the “Internet Engineering Task Force (IETF)” in the mid years
    of 1990s in order to standardize the protocols of networking for the recently
    accepted wireless technology [9,10].


    The 4th generation of communication networks that came into picture in 2010 are
    actually an “Integrated Global Network,” which is basically based on the approach
    of open-systems. Such integrated network is an intelligent concept that makes
    all'
