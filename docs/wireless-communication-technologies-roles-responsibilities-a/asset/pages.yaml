    FIGURE 5.1 Industrial revolutions.


    Industry 4.0 which can transfer information autonomously, trigger events, and
    control devices without human interference. Figure 5.1 shows the evolution of
    various industrial revolutions from 1.0 to 5.0.


    # 5.1.1 THE RISE OF INDUSTRY 5.0


    Industry 5.0 aims to enhance custom-built assembly with minimal waste, cost, and
    precision, whereas a primary element of Industry 4.0 is corpus fabrication with
    minimal waste and increased efficiency [1]. But, the Industry 5.0 concept still
    needs to be built completely. All Industry 5.0 concepts focus on building an intellectual
    society where humans and robots work together. Thus, European Commission (EC)
    has added human-centering, resiliency, and viable techniques to the Industry 5.0
    vision [2]. Power empowerment is enabled in connection with the objectives of
    corpus manufacture in augmented supply chains such as scalable and adaptable product
    varieties, resulting in optimistic effects for comprehending the subsequent revolution
    and advantages for various fields of society [3].


    # 5.1.2 WHY INDUSTRY 5.0


    Future manufacturing has to play an efficient role in developing solutions to
    handle societal challenges [4], such as 1) preservation of environmental and natural
    resources, 2) sustainability of climate change, 3) emerging ICT technologies that
    enable circular production models, and 4) progressing digital skills for people
    empowerment and digital hyper-connectivity.


    # 5.1.3 BUILDING BLOCKS OF INDUSTRY 5.0


    Robotics [5], IIoT [6], big data analytics, computer vision, 5 G Wireless Networks
    [7], Computation technologies, and Artificial Intelligence (AI) [8] have rapidly
    advanced to facilitate development of new applications. A few favorable applications
    are cloud engineering, intelligent healthcare, smart education, automated guided
    vehicles (AGVs), and supply chain management. In addition, Industry 5.0 brings
    additional attributes to the existing Industry 4.0 paradigm.


    # 5.2 EXISTING ARCHITECTURES


    In this section, we discuss the most capable architectures which are detailed
    in the following:'
