- pgno: 9
  md: '# About the Editors


    Dr. Vandana Sharma is an Associate Professor at CHRIST (Deemed to be University),
    Delhi-NCR Campus, India. She has 15-plus years of teaching experience at the postgraduate
    level. She has published more than 75 research papers in Scopus-indexed journals
    and conferences. She is a senior member of IEEE, a member of the women in engineering
    society, and a member of IEEE Consumer Technology Society.


    Currently, she is a post-doctoral fellow at Lincoln University College, Malaysia
    and has presented her work across India and abroad. She has contributed voluntarily
    as a keynote speaker, session chair, reviewer, and Technical Program Committee
    (TPC) member for reputed International Journals and international conferences.
    Her primary areas of interest include Artificial Intelligence, Block chain Technology,
    and the Internet of Things.


    Dr. B. Balamurugan Completed his Ph.D. at VIT University, Vellore, and currently
    works as an Associate Dean-Student Engagement at, Delhi-NCR Campus and has 21
    years of teaching experience in the field of computer science. His areas of interest
    lie in the field of the Internet of Things, big data, and networking. He has published
    more than 150 international journal papers and contributed book chapters.


    Dr. Gianluigi Ferrari received Laurea and Ph.D. degrees in Electrical Engineering
    from the University of Parma, Parma, Italy, in 1998 and 2002, respectively. Since
    2002, he has been with the University of Parma, where he is currently a Full Professor
    of Telecommunications and also the coordinator of the Internet of Things (IoT)
    Laboratory, Department of Engineering and Architecture. He is the co-founder and
    President of things2i Ltd. (https://www.things2i.com/), a spin-off of the University
    of Parma dedicated to IoT and smart systems. His current research interests include
    advanced communication and networking, IoT and smart systems, signal processing,
    and data analysis (https://www.tlc.unipr.it/ferrari/)'
