    # ## 11.4 SYSTEM MODEL


    From the system model of Figure 11.4, we can observe that the signal transmitted
    from the transmitter is sent to the respective user through the RHS element [4].
    As the input signal is greatly affected due to fading in this wireless environment
    because of the various obstacles in the environment, the signal strength tends
    to fluctuate. So, using the RHS elements, the input signal is directed to the
    respective receiver antenna with maximum signal strength.


