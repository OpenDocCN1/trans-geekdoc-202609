    # 12.4.2.4.3 Support Vector Machines


    Support Vector Machine is a supervised machine learning approach for both regression
    and classification. The fundamental principle of SVMs is the concept of determining
    an appropriate hyperplane using support vectors, i.e., the coordinates of each
    class located at the edge [34,35]. Points that are nearest to the boundary are
    called support vectors. The aim of the SVM is to maximize the distance between
    the hyperplane and the support vectors.


