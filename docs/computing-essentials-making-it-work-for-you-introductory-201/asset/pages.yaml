  md: '# Making IT work for you


    # INSTALLING A FREE ANTVIRUS PROGRAM


    Have you or someone you know a slower computing experience due to a spyware infection?
    Even worse, perhaps a malicious piece of software stole crucial, personal information
    or caused a total system failure. Most of these problems can be averted by having
    an up-to-date antivirus program running in your computer''s memory at all times.
    This exercise shows you how to download and install free antivirus program if
    your computer does not yet have one.


    **Getting Started** First, make sure your computer does not have an antivirus
    or security suite running. If it does, be sure to completely uninstall that program,
    even if the subscription is expired. Now, follow these steps to install AVG, a
    popular, free antivirus program:


    +   - Visit://free.avg.com and click the **Download** button. You will be asked
    to confirm that you want the free edition and then redirected to a download site.


    +   - Run the installation file and follow the prompts.


    +   - Select **basic protection** if you are asked what product you would like
    to install.


    +   - Choose **Express Install** and wait for files to be downloaded and installed.


    **Using AVG** Generally speaking, your antivirus program watches your system for
    malware and updates itself automatically. However, you can download updates manually,
    set a schedule for full-system scans, and change basic settings for various components
    of the software.


    +   - After installation, verify that the software is downloading updates by clicking
    **Update now** on the left side. Wait for all updates to be downloaded.


    +   - Click **Scan** to run a full scan on your computer.


    +   - Just below that, click **Scan options** if you want to set a schedule for
    automated scans.


    +   - Click **Overview** to reach the main screen, where you can click various
    elements of the program to configure them. For example, clicking **Anti-Virus**
