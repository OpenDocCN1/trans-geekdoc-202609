- pgno: 14
  md: 'The 20th century brought us the dawn of the digital information age and unprecedented
    changes in information technology. There is no indication that this rapid rate
    of change will be slowing—it may even be increasing. As we begin the 21st century,
    computer literacy is undoubtedly becoming a prerequisite in whatever career you
    choose.


    The goal of Computing Essentials is to provide you with the basis for understanding
    the concepts necessary for success. Computing Essentials allows all endeavors
    to install an appreciation for the effect of information technology on people
    and our environment and to give you a basis for building the necessary skill set
    to succeed in the 21st century.


    Times are changing, technology is changing, and this text is changing too. As
    students of today, you are different from those of yesterday. You put much effort
    toward the things that interest you and the things that are relevant to you. Your
    efforts directed at learning application programs and exploring the web seem,
    at times, less. On the other hand, it is sometimes difficult to engage in other
    equally important topics such as personal privacy and technological advances.


    In this text, we present practical tips related to key concepts through the demonstration
    of interesting applications that are relevant to your lives. Topics focus first
    on outputs rather than processes. Then, we discuss the concepts and processes.


    Motivation and relevance are the keys. This text has several features specifically
    designed to engage and demonstrate the relevance of technology in your lives.
    These elements are combined with a thorough coverage of the concepts and sound
    pedagogical devices.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# VISUAL CHAPTER OPENERS


    Each chapter begins with a list of chapter competencies and objectives and provides
    a brief introduction to what will be covered in the chapter. Additionally, the
    “Why Should I Read This?” feature provides relevance through a brief discussion
    of the content’s historical context.


    ![](img/17527690010086a83ec3d8f3ee262703_15_0.png)


    The Internet, the Web, and Electronic Commerce


    # chapter 2


    Competencies


    +   1. History of the internet

    2. Structure of the web

    3. E-commerce business models

    4. E-commerce infrastructure, protocols, and technologies

    5. Security and privacy

    6. E-commerce on mobile devices

    7. E-commerce trends and future

    8. Other issues


    Why should I read this chapter?


    Understanding the concepts in this chapter will help you understand how the internet
    and the web work and how they are used in e-commerce. It will also provide new
    perspectives on security, privacy, and mobile e-commerce.


    The internet has transformed the way businesses operate and interact, creating
    new opportunities for growth while presenting new challenges in security and privacy.


    # VISUAL SUMMARIES


    Visual summaries appear at the end of every chapter and summarize major concepts
    covered throughout the chapter. Like the chapter openers, these summaries use
    graphics to reinforce key concepts in an engaging and meaningful way.


    ![](img/17527690010086a83ec3d8f3ee262703_15_1.png)


    To complete this unit you must know the different types of storage devices. You
    will also need to know how data is stored and retrieved from magnetic disks, solid-state
    memory, optical disks, and cloud storage.'
