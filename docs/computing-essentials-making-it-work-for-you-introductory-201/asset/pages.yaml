    # ## Measures to Protect Computer Security


    There are many ways in which computer systems can be compromised and many ways
    to ensure computer security. Some of the principal measures to ensure complete
    security is restricting access, anticipating disasters, and preventing data loss.


    **Restricting Access** Security experts are constantly devising ways to protect
    computer systems from unauthorized persons. Security is a matter of putting guards
    on computer rooms and identifying the identity of everyone. Other times it is
    using biometric scanning, such as fingerprint and iris (eye) scanners. (See Figure
    9-15.) There are numerous applications that use face recognition to allow access
    to a computer system.


    With many security threats out there, as well as tools to counter those threats,
    you can easily feel helpless and overwhelmed. Here is an easy-to-follow list of
    best practices that can help protect the security of your computer and valuable
    data:


    +   1 **Security tools.** An Internet security suite (which includes an antivirus
    program), together with the firewall that is included with most operating systems,
    will keep threats from harming your computer.

    2 **Software updates.** Always ensure that your operating system, security suites,
    and other critical programs are set to update as soon as they become available.

    3 **E-mail and attachments.** Avoid opening any e-mail that seems suspicious or
    from a person or organization you do not know. Be even more careful with links
    and attachments. Also remember that the e-mail accounts belonging to your friends
    and family could be compromised, so be careful!

    4 **Passwords.** Use a strong password for your operating system log-in, and a
    different strong password for each website log-in. Do not share passwords with
    anyone and do leave them in obvious places, such as a notebook next to your computer
    or in an encrypted Word document.

    5 **Wireless encryption.** Use WPA2 encryption for your home''s wireless router.


    To see other tips, visit our website at www.computer2014.com and enter the keyword
    tips.'
