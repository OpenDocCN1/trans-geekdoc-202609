    ![](img/17527690010086a83ec3d8f3ee262703_142_1.png)


    # UNIX and Linux


    UNIX was originally designed to run on minicomputers in network environments.
    Now, it is widely used by servers on the web, mainframes, and powerful microcomputers.
    There are many different versions of UNIX. One version, Linux, a popular and powerful
    alternative to the Windows operating system, is open source software. Google Chrome
    OS is based on Linux and designed for notebooks and other mobile devices. Chrome
    OS focuses on Internet connectivity and cloud computing.


    Utilities make computing easier. The most essential troubleshooting (diagnostic),
    antivirus, backup, and file compression.


    # Windows Utilities


    Windows operating systems are accompanied by several utility programs, including
    Backup and Restore, Disk Cleanup, and Disk Defragmenter (eliminates unnecessary
    fragments; tracks are concentric rings; sectors are wedge-shaped)


    # Virtualization


    Utility Suites combine several programs into one package. Computer viruses are
    dangerous programs.


    Virtualization allows a single physical computer to support multiple operating
    systems. By using a special program (virtualization software) allows the single
    physical computer to operate as two or more separate and independent computers
    known as virtual machines. Host operating systems run on the physical machine.
    Guest operating systems operate on virtual machines. Microsoft''s Hyper-V creates
    and runs virtual


    # DEVICE DRIVERS


    Device drivers (drivers) allow communication between hardware devices. Add a Device
    Wizard gets step-by-step guidance to install printer drivers. Windows Update automates
    the process of updating device drivers.


    # CAREERS IN IT


    ![](img/17527690010086a83ec3d8f3ee262703_142_2.png)


    Computer specialists provide technical support to customers and other users. Degrees
    in computer science or information systems are preferred plus good analytical
    and communication skills. Salary range is $31,000 to $58,000.'
