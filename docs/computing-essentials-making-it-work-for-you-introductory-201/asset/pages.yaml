  img_proc: true
- pgno: 261
  md: '# NETWORK ARCHITECTURE


    # ORGANIZATIONAL NETWORKS


    ![](img/17527690010086a83ec3d8f3ee262703_261_0.png)


    ![](img/17527690010086a83ec3d8f3ee262703_261_1.png)


    Network architecture describes how networks are arranged and resources are shared.


    # Internet Technologies


    Internet technologies support effective communication using intranets and extranets.


    # Topologies


    A network''s topology describes the physical arrangement of a network.


    +   - Bus network—each device is connected to a common cable called a bus or backbone.


    +   - Ring network—each device is connected to two other devices, forming a ring.


    +   - Star network—each device is connected directly to a central network switch;
    most common type today.


    +   - Tree (hierarchical) network—a central node is connected to subordinate nodes
    forming a treelike structure.


    +   - Mesh network—each node has two or more connecting nodes.


    +   - Intranet—private network within an organization uses browsers, websites,
    and web pages. Typical applications include electronic telephone directories,
    e-mail addresses, benefit information, internal job openings, and more.


    +   - Extranet—like intranet except more than one organization typically allows
    suppliers and others limited access to their networks.


    # Network Security


    Three technologies commonly used to ensure network security are firewalls, intrusion
    detection systems, and virtual private networks.


    +   - Firewall—controls all communications pass through proxy server.


    +   - Intrusion detection systems (IDS)—work with firewalls; use statistical techniques
    to recognize and disable network attacks.


    +   - Virtual private network (VPN)—creates secure private connection between
    remote user and organization''s internal network.


    # Strategies


    Every network has a strategy, or wo of sharing information and resources. Common
    network strategies include client/server and peer-to-peer.


    +   - Client/server (hierarchical) network—central computers coordinate and provide
    services to other nodes; based on specialization of nodes; used on the Internet;
    able to handle very large networks efficiently; powerful network management software
    available.


    +   - Peer-to-peer network—nodes have equal authority and act as both clients
    and servers; widely used to share games, music and music over the Internet; easy
    to set up and use; lacks security controls.


    # CAREERS IN IT


    Network administrators manage a company''s LAN and WAN networks. Bachelor''s or
    specialized advanced associate''s degree in computer science, computer technology,
    or information systems and practical networking experience required. Salary range
    is $46,000 to $84,000.


    234 CHAPTER 8'
  merge: -1
  img_proc: true
