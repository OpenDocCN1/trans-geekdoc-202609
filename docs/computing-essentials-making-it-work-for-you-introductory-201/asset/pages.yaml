    **Denial of Service** A denial of service (DoS) attack attempts to slow down or
    stop a computer system or network by flooding a computer or network with information
    and data. The targets of attacks are usually Internet service providers (ISPs)
    and specific websites. Once under attack, the servers at the ISP or website become
    overwhelmed with these requests for service and are unable to respond to legitimate
    users. As a result, the ISP or website is effectively shut down.


    **Internet Scams** A scam is a fraudulent act or operation designed to trick individuals
    into providing personal information or spending time and money for no return.
    An Internet scam is a scam using the Internet. Internet scams are becoming a serious
    problem and have created financial and legal problems for thousands of people.
    All the scams are initiated by a mailing usually to unsuspecting individuals.


    A technique often employed by scammers is **phishing** ("fishing"). Phishing attempts
    to trick Internet users into using a fake official-looking website or email is
    legitimate. Phishing has grown sophistication, replicating on websites like PayPal
    to lure users into disclosing their financial information. See Figure 9-12 for
    a list of common types of scams.


    **Social Networking Risks** As we have discussed in Chapter 2, social networking
    is designed for open sharing of information among individuals that share a common
    interest. This openness can put individuals using social networking at risk. Some
    have lost their jobs after posting unfortunately revealing their current job or
    after disclosing their personal information such as their birth date, family members
    names, addresses, and photos of children. This information can be used by others
    to steal personal identities and commit other types of crimes. Always exercise
    caution when providing information on Facebook, Twitter, and other social networking
    sites. Using the privacy settings and controls that are provided can protect you
