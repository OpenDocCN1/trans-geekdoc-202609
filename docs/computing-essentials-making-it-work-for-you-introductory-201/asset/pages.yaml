    # Software Suites


    a software suite is a collection of separate application programs bundled together
    and available as a group. While the applications function exactly the same whether
    purchased in a suite or separately, it is significantly less expensive to buy
    a suite of applications than to buy each application separately. Four types of
    suites are office suites, cloud suites, specialized suites, and utility suites.


    ![](img/17527690010086a83ec3d8f3ee262703_108_0.png)


    Figure 3-20 Microsoft Office


    # Office Suites


    Office suites, also known as office software suites and productivity suites, contain
    general-purpose application programs that are typically used in a business situation.
    Productivity suites commonly include a word processor, spreadsheet, database manager,
    and a presentation application. The best known is Microsoft Office (See Figure
    3-20). Other well-known productivity suites are AppleWork and OpenOffice.


    # Cloud Computing


    Cloud suites or online office suites are stored at a server on the Internet and
    are available anywhere you can access the Internet. Documents created using online
    applications can also be stored online, making it easy to share and collaborate
    with others. One downside to cloud applications is that you are dependent on the
    server providing the application to be available whenever you need it. For reason,
    when using online applications, it is important to have backup copies of your
    documents on your computer and to have a desktop office application to use. Popular
    online office suites include Google Docs, Zoho, and Microsoft Office Web Apps.
    To learn more about one of the most widely used online office suites, see Making
    IT Work for You: Google Docs on page 83.'
