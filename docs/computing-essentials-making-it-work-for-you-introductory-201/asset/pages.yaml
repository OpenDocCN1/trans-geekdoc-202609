    The strength of a password depends on how easily it can be guessed. A Dictionary
    attack uses software to try thousands of common words sequentially in an attempt
    to gain unauthorized access to a user''s account. For this reason, words, names,
    and simple numeric patterns make weak or poor passwords. Strong passwords have
    at least eight characters and use a combination of letters, numbers, and punctuation
    marks. It is also important not to reuse passwords for different accounts. If
    one account is compromised, password might be tried for other systems as well.
    For example, if a low-security account such as an online web forum is compromised,
    password could also be tried on higher-security accounts such as banking websites.


    As mentioned in previous chapters, individuals and organizations use suites and
