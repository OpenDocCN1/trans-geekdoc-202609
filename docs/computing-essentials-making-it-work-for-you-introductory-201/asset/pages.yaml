  md: '# # Introduction


    ![](img/17527690010086a83ec3d8f3ee262703_215_0.png)


    Secondary storage devices are used to save, back up, and even to transport files
    consisting of data or programs from one location or computer to another. At one
    time, almost all files contained only numbers and letters. The demands for saving
    these files were easily met with low-capacity storage devices.


    Data storage has expanded ever to include digital files, photographic files, video
    files, and much more. These new types of files require secondary storage devices
    that have much greater capacity.


    Secondary storage devices have always been an indispensable element in any computer
    system. They have similarities to input devices. Like output devices, secondary
    storage devices receive information from the system unit in the form of the language
    of 0s and 1s. Rather than translating the information, however, secondary storage
    devices save the information in machine language for later use. Like input devices,
    secondary storage devices send information to the system unit for processing.
    However, the information, which is already in machine form, does not need to be
    translated.


    > > “Hi, I''m James, and I''m a disaster recovery specialist. I''d like to talk
    with you about secondary storage, one of the most critical parts of any computer
    system. I''d also like to talk about various cloud storage services.”


    Competent users need to be aware of the different types of secondary storage.
    They need to know the capabilities, limitations, and uses of hard disks, solid-state
    drives, optical disks, cloud storage, and other types of secondary storage. Additionally,
    they need to be aware of secondary storage devices for portable computers and
    to be knowledgeable about how large organizations manage their extensive data
    resources.


    # # Storage


    An essential feature of every computer is the ability to save, store, or information.
    As discussed in Chapter 5, random-access memory (RAM) holds or stores data and
    programs that the CPU is presently processing. Before data be processed or a program
    can be run, it must be in RAM. For this reason, RAM is sometimes referred to as
    primary storage.


    Unfortunately, most RAM provides only temporary or volatile storage. That is,
    it loses all of its contents as the computer is turned off. Its contents are also
    lost if there is a power failure that disrupts the electric current going into
    the system unit. This volatility results in a need for more permanent or nonvolatile
    storage for data and programs. We also need external storage because users need
    much more storage capacity than is typical in a computer''s primary or RAM memory.


    Secondary storage provides permanent or nonvolatile storage devices such as a
    hard-disk drive, data and programs can be retained after the computer has been
    shut off. This is accomplished by writing files to and reading secondary storage
    devices. Writing is the process of saving information to the secondary storage
    device. Reading is the process of'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'accessing information from secondary storage. This chapter focuses on secondary
    storage.


    Some important characteristics of secondary storage include


    +   - **Media** are the actual physical material that holds the data and programs.
    (See Figure 7-1).


    +   - **Capacity** measures how much a particular storage medium can hold.


    +   - **Storage devices** are hardware that reads data and programs from storage
    media. Also write to storage media.


    +   - **Access speed** measures the amount of time required by the storage device
    to retrieve data and programs.


    Most desktop microcomputer systems have hard-disk and optical disc drives, as
    well as ports where additional storage devices can be connected.


    # Hard Disks


    ![](img/17527690010086a83ec3d8f3ee262703_216_0.png)


    Hard disks save files by altering the magnetic charges of the disk''s surface
    to represent 0s and 1s. Hard disks retrieve data and programs by reading these
    charges from the magnetic disk. Characters are represented by (+) and (-) charges
    using the ASCII, EBCDIC, or Unicode binary codes. For example, the letter A would
    require a series of 8 charges. (See Figure 7-2) **Density** refers to how tightly
    these charges can be packed next to one another on the disk.


    Figure 7-1 Secondary storage media


    **Hard disks** use rigid metal **platters** that are stacked on top of another.
    Hard disks store and organize files using tracks, sectors, and cylinders. **Tracks**
    are rings of concentric circles without visible grooves. Each track is divided
    into invisible wedge-shaped sections called **sectors**. (See Figure 7-3) * cylinder*
    runs through each track of a stack of platters. Cylinders are necessary to differentiate
    files stored on the same track and sector of different platters. When a hard disk
    is formatted, tracks, sectors, and cylinders are assigned.


    ![](img/17527690010086a83ec3d8f3ee262703_216_1.png)


    ![](img/17527690010086a83ec3d8f3ee262703_216_2.png)


    Figure 7-2 How charges on a disk surface store the letter A


    Figure 7-3 Tracks and sectors


    Secondary Storage 189'
