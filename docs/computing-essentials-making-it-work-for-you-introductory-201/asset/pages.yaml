    # Communication Channels


    Communication channels are an essential element of every communication system.
    These channels actually carry the data from one computer to another. There are
    two categories of communication channels. One category connects sending and receiving
    devices by providing a physical connection, such as a wire or cable. The other
    category is wireless.


    # Physical Connections


    Physical connections use a solid medium to connect sending and receiving devices.
    These connections include telephone lines (twisted pair), coaxial cable, and fiber-optic
    cable.


    +   - Twisted-pair cable consists of pairs of copper wire that are twisted together.
    Both standard telephone lines and Ethernet cables use twisted pair. (See Figure
    8-3.) Ethernet cables are often used in networks to connect to a variety of components
    to the system unit.

    - Coaxial cable, a high-frequency transmission, replaces the wires of telephone
    lines with a single solid-copper core. (See Figure 8-4.) In terms of the number
    of telephone connections, a coaxial cable has over 80 times the transmission capacity
    of twisted pair. Coaxial cable is used to deliver television signals as to all
    computers in a network.

    - Fiber-optic cable transmits data as pulses of light through thin tubes of glass.
    (See Figure 8-5.) In terms of the number of telephone connections,


