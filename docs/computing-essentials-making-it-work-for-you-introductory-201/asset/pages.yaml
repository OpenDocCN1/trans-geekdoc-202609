  md: '# Database Management Systems


    A **database** is the electronic equivalent of a file cabinet. A **database management
    system (DBMS)** or **database manager** is a program that sets up, or structures,
    a database. All kinds of individuals use databases, to enter, and retrieve data
    from them, hospital administrators recording patient information to police officers
    checking criminal histories. Colleges and universities use databases to keep records
    of their students, instructors, and courses. Organizations of all types maintain
    employee databases.


    Two widely used database management systems designed for microcomputers are Microsoft
    Access and OpenBase.


    Assume that you have accepted a job as an employment administrator for the Lifestyle
    Club. How could you use Microsoft Access, see Figure 3-7?


    # Presentation Graphics


    Research shows that people learn better when information is presented visually.
    **Presentation graphics** are programs that combine a variety of visual objects
    to create attractive, visually interesting presentations. They are excellent tools
    to communicate a message and persuade people.


    For a variety of settings and situations use presentation graphics to make their
    presentations. For example, marketing managers use presentation graphics to present
    proposed marketing strategies to their superiors. Salespeople use these programs
    to demonstrate products and encourage customers to make purchases. Students use
    presentation graphics programs to create high-quality class presentations.


    Three of the most widely used graphics programs are Microsoft PowerPoint, OpenOffice
    Impress, and Apple Keynote.


    Assume that you have volunteered for the Animal Rescue Foundation, a local animal
    rescue agency. You have been asked to create a powerful and persuasive presentation
    to encourage other members from your community to volunteer. To see how you could
    use Microsoft PowerPoint, see Figure 3-8.


