    +   - Device drivers are specialized programs designed to allow particular input
    or output devices to communicate with the rest of the computer system.


    # ### Application Software


    Application software might be described as end user software. Three types of application
    software are general-purpose, specialized, and mobile apps.

    General-purpose applications are widely used in nearly all career areas. They
    are the kinds of programs you know to be considered computer competent. One of
    these general-purpose applications is a browser to navigate, explore, and find
    information on the Internet. The three most widely used browsers are Mozilla''s
    Firefox, Microsoft''s Internet Explorer, and Google''s Chrome.


    Specialized applications include thousands of other programs that are more narrowly
    focused on specific disciplines and occupations. Two of the best known are graphics
    and web authorizing programs.

    M apps, or mobile applications, are small programs designed for mobile devices
    such as smartphones, tablet computers, and other mobile devices. There are over
    half a million apps. The most popular mobile apps are for text messaging, Internet
    browsing, and connecting to social networks.


