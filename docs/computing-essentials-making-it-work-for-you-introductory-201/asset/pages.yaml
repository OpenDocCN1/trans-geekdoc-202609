  md: '# A LOOK TO THE FUTURE


    Next-Generation User Interfaces


    How will you be interacting with computers in the future? Will you continue using
    a mouse and keyboard for your desktop, or will touch screen and voice recognition
    replace them? Will a new type of interface emerge? One thing is for sure: humans
    interact with the world around us in many ways, ranging from using our fingers
    to manipulate objects making requests. The goal of any future interface is to
    bring that same level of interaction to a computer.


    There are several challenges with designing interfaces. First is the simple fact
    that individuals have varying preferences. Some might prefer to interact with
    a friend through text messages, while others prefer communication. Therefore,
    it is doubtful that a single interface will become dominant. The second challenge
    is ergonomic in nature; that is, it must be comfortable to use.


    Since tablets and smartphones have touch-screen interfaces, many people believe
    that all home and business computers will eventually have them too. In futuristic
    movies individuals use both hands to interact with a large screen. Such a setup
    allows a person to interact with multiple objects at the same time. The only problem
    with multiscreen is that it is not comfortable to extend our arms for long periods.
    Knowing this, many companies are looking toward, interactive surfaces that perform
    the same function while lying flat on a desk. Microsoft has already developed
    a product called “Surface” that acts like a large, interactive table. It responds
    to both human interactions and objects that are placed on top of it. Although
    costs prevent it from replacing the desktop of


    today, the strain on a person''s neck from looking down could prevent it from
    being used for long periods of time. The ideal of Surface appears to be activities
    involving collaboration and teamwork.


    Voice recognition is another form of input that is already available, but much
    improvement is needed. Computers are becoming better at following specific voice
    commands, but they cannot engage in everyday conversation or complex requests.
    Researchers in the field of artificial intelligence are working to improve natural
    language processing to help computers understand our writing and speech. When
    that is fully developed, you will be able to speak to your computer in the same
    way you would speak to another person.


    ![](img/17527690010086a83ec3d8f3ee262703_111_0.png)


    The field of interactivity generating most buzz involves the entire body. Both
    cameras and software are becoming sophisticated enough to observe and interpret
    our movements and gestures


    ures. The “Kinect” system for the Xbox 360 is enjoying success for its ability
    to use body movements to interact with various games and fitness programs. Researchers
