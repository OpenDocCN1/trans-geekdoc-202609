- pgno: 269
  md: '# # Introduction


    The tools and products of the information age do not exist in a world by themselves.
    As we said in Chapter 1, an information system consists not only of procedures,
    software, hardware, data, and connectivity but also of people. Because of people,
    computer systems may be used for both good and bad purposes.


    There are more than one billion microcomputers in use today. What are the consequences
    of the widespread presence of this technology? Does technology make it easy for
    others to invade our personal privacy? When we apply for a loan or for a driver''s
    license, or when we check out at the supermarket, is that information about us
    being distributed and used without our permission? When is information about us
    being collected and shared with others?


    This technology prompts lots of important questions—Perhaps these are some of
    the most important questions for the 21st century. Competent end users need to
    be aware of the potential impact of technology on people and how to protect them
    on the web. They need to be sensitive and knowledgeable about personal privacy
    and organizational security.


    ![](img/17527690010086a83ec3d8f3ee262703_269_0.png)


    Hi, I''m Anthony, and I''m an IT security analyst. I''d like to talk to you about
    privacy, security, and ethics, three critical topics for anyone who uses computers
    today. I would also like to talk about how you can protect your privacy, ensure
    your security, and act ethically.


    # # People


    As we have discussed, information systems consist of people, procedures, software,
    hardware, data, and connectivity. This chapter focuses on people. (See Figure
    9-1). While everyone agrees that technology has a very positive impact on people,
    it is important to recognize the negative, or potentially negative-impacts, as
    well.


    Effective implementation of computer technology involves maximizing its positive
    while minimizing its negative effects. The most significant concerns are


    +   - **Privacy:** What are the threats to personal privacy, and how can we protect
    ourselves?


    ![](img/17527690010086a83ec3d8f3ee262703_269_1.png)


    **Figure 9-1** People are part of an information system'
  merge: -1
  img_proc: true
- pgno: 270
  md: '+   * Security: How can access to sensitive information be controlled, and
    how can we secure hardware and software?

    * Ethics: How do the actions of individual users and companies affect society?

    Let us begin by examining privacy.


    # # Privacy


    As you have seen, computing technology makes it possible to collect and use data
    of all kinds, including information about people. The websites you visit, the
    stores where you shop, and the television show you watch are examples of information
    about you. How would you feel if you learned such information was being collected
    or shared? Would it matter who was collecting it, or how it was being used, or
    whether it was even correct?


    **Privacy** concerns the collection and use of data about individuals. There are
    three primary privacy issues:


    +   * **Accuracy** relates to the responsibility of those who collect data to
    ensure that the data is correct.

    * **Property** relates to who owns data and rights to software.

    * **Access** relates to the responsibility of those who have data to control who
    is able to use that data.


    # ## Large Databases


    Large organizations are constantly compiling information about us. The federal
    government has over 2,000 databases. Every day, data is gathered about us and
    stored in large databases. For example, telephone companies compile lists of the
    calls we make, the names called, and so on. A special telephone directory (called
    a reverse directory) lists telephone numbers sequentially. (See Figure 9-2.)


    ![](img/17527690010086a83ec3d8f3ee262703_270_0.png)


    **Figure 9-2** Reverse directory website'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'By entering a telephone number, you can determine the name, address, and more
    information about the person registered with that number.


    Credit card companies maintain user databases that track cardholder purchases,
    payments, and credit records. Supermarket scanners in grocery counters record
    what we buy, when we buy it, how much we buy, and the price. Financial institutions,
    including banks and credit unions, record how much money we make, what we use
    it for, and how much we owe. Publishers of magazines, newspapers, and mail-order
    catalogues have our addresses, phone numbers, and what we order. Search engines
    record the search histories of users including search topics and sites visited.


    A vast industry of data gatherers known as information resellers or information
    brokers exists that collects and sells such personal data. Using publicly available
    databases and in many cases nonprofit databases, information resellers create
    electronic profiles or highly detailed profiles of individuals. Very likely, you
    have an electronic profile that includes your address, telephone number, Social
    Security number, driver''s license number, bank account numbers, credit card numbers,
    telephone records, and shopping and purchasing patterns. Information resellers
    sell these electronic profiles to direct marketers, fundraisers, and others. Many
    provide these services on the web for free or for a nominal cost. (See Figure
    9-3).


    Your personal information, including preferences, habits, and financial data,
    has a marketable commodity. This raises many issues, including


    +   * Collecting public, but personally identifying information: What if anyone
    in the world could view detailed images of you, your home, or your vehicle? Using
    detailed images captured with a specially equipped van, Google''s Street View
    project makes it possible to take a virtual tour of many cities and neighborhoods
    from any connection to the Internet. (See Figure 9-4.) Although the images available
    on Street View are all taken in public locations, some have objected to the project
    as being an intrusion on your privacy.


    ![](img/17527690010086a83ec3d8f3ee262703_271_0.png)


    Figure 9-3 Information reseller website


