  md: '# A LOOK TO THE FUTURE


    # Next-Generation Storage


    Have you already started to use a cloud storage service for your files? Have your
    friends and family members used one also? With millions of individuals and businesses
    all signing up for these services, how do these companies keep up with the amount
    of storage required to accommodate all these users? The answer is simple: They
    keep adding more drives. However, at some point, hard drives will no longer be
    able to increase in capacity, and companies may run out of physical space to keep
    adding more. Therefore, researchers are looking into new technology to increase
    the capacity of existing solutions, as well as reduce the size of current storage
    media.


    achieved higher limits by adding more layers, a ceiling will soon be hit. GE Global
    Research is currently developing a disc made up of tiny holograms, stored over
    dozens of layers, that react to light. These discs will store 1 TB of data, and
    the drives that read them will also be able to read your DVD and Blu-ray discs.


    Advances in chemistry have led to the speculation that circuits and storage media
    could be working with containing molecules. Researchers have discovered that a
    group of compounds called metallofulleren can be oriented in various ways, representing
    0 and 1 bits just as storage media currently do. The best advantage of working
    with organic molecules involves size. These molecules are so small that storage
    could be extremely tiny, allowing the creator of smaller computers and gadgets.


    The first product that will receive a huge improvement is the hard drive. When
    it comes to the primary storage of your computer and the millions of servers throughout
    the world, not still have hard drives. They are the most affordable solution,
    researchers are looking at ways of increasing their capacity without increasing
    their size. Current hard drive technology will max out at approximately 128 GB
    per square inch. Seagate, a manufacturer of hard drives, is working on new technologies
    that hope to increase that limit: heat-assisted magnetic recording (HAMR) and
    bit-patterned media (BPM). The idea is to make the bits smaller so that more of
    them fit in the same area. Once these technologies are implemented, the capacity
    could reach 72 TB (or 650 GB) per square inch. With a density like that, Seagate
    estimates that you could hold the entire contents of the U.S. Library of Congress
    on a disc that is no larger than a coin.


    You may be wondering why solid-state storage, or flash memory, has not been met.
    This type of media has definitely been improving over the years. Your flash drives
