- pgno: 341
  md: 'Wiki: A website that allows people to fill in missing information or inaccuracies
    by directly editing the pages.


    Wikipedia: An online encyclopedia, written and edited by anyone who wants to contribute.


    WiMax (Worldwide Interoperability for Mobile Access): Technology that extends
    Wi-Fi to operate over greater distances.


    Wireless modem: A rectangular antenna containing a document or message.


    Windows: An operating system extending the capability of DOS.


    Windows 7: From 2009 it has a traditional user interface similar to previous versions
    of Windows. It provides features including improved handwriting recognition and
    advanced searching capabilities for files and other content on your computer.


    Windows 8: From 2012 it is designed to better integrate Microsoft''s desktop with
    its mobile OS. It provides support for gestures, cloud integration, and apps.


    Windows Phone: Introduced in 2012 by Microsoft to support a variety of mobile
    devices including smartphones. It has powerful programs designed for desktop and
    laptop.


    Windows RT: A version of Windows 8 designed to run with tablets using a particular
    microprocessor from ARM.


    Windows Update: A utility in the Windows platform that allows you to update the
    drivers on your computer.


    Wireless access point: Or base station. The receiver intercepts incoming radio
    frequencies from a wireless LAN and routes communications to the appropriate devices,
    which could separate computers, a shared printer, or a modem.


    Wireless keyboard: Transmits input to the system through the air, providing greater
    flexibility and convenience.


    Wireless LAN (WLAN): Uses radio frequencies to connect computers and other devices.
    All communications pass through the network''s locally located wireless receiver
    or base station and are routed to the appropriate devices.


    Wireless modem: Modem that connects to the serial port but does not connect to
    telephone lines. It receives through the air.


    Wireless mouse: Cordless mouse.


    Wireless network card: Allows computers to be connected without cables.


    Wireless network encryption: Restricts access to users on wireless networks.


    Wireless revolution: A revolution that is expected to dramatically affect the
    way we communicate and use technology.


    Wireless area network (WWAN): Wireless modem.


    Word: The number of bits (such as 16, 32, or 64) that can be accessed at one time
    by the CPU.


    Word processor: The computer and the program you use to edit, save, and print
    documents of text.


    Word wrap: A feature of processing that automatically moves the cursor from one
    end of the line to the next.


    Workbook file: Contains one or more worksheets or spreadsheets.


    Worksheet: Also known as a spreadsheet, or sheet; a rectangular grid of rows and
    columns used in programs like Excel.


    Worm: Virus that doesn''t attach itself to programs and fills a computer system
    with self-replicating code, clogging the system so that its operations are slowed
    or stopped.


    WPA (Wi-Fi Protected Access): A secure encryption protocol.


    WYSIWYG (what you see is what you get): Web programs that build a page without
    requiring direct interaction with the HTML code and then preview the page described
    by the HTML code.


    # Z


    Zombie: A computer infected by a virus, worm, or Trojan horse that allows it to
    be remotely controlled for malicious purposes.


    314 Glossary'
