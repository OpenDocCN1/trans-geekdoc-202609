  md: 'memory and the CPU, disk caching improved processing by acting as a temporary
    high-speed holding area between a secondary storage device and the CPU. Disk caching
    requires a combination of hardware and software. During idle processing time,
    frequently used data is automatically identified and read from the hard disk into
    memory (cache). When needed, data is then accessed directly from memory. The transfer
    rate from memory is much faster than from the hard disk. As a result, overall
    system performance is often increased by much as 30 percent.


    ![](img/17527690010086a83ec3d8f3ee262703_218_0.png)


    Figure 7-6 RAID storage device


    Redundant arrays of inexpensive disks improve performance by extending storage,
    improving access speed, and providing reliable storage. Several inexpensive hard-drives
    are connected to one another. These connections can be made by a network or within
    specialized RAID devices. (Figure 7-6) The connected hard-drives are reordered
    or grouped, and the system interacts with the RAID system as though it were a
    single large-capacity hard-disk drive.


    Have you received a compressed file that you could not open? If so, follow these
    steps to acquire a free program that can open most compressed files.


    ![](img/17527690010086a83ec3d8f3ee262703_218_1.png)


    File compression and file decompression increase storage capacity by reducing
    the amount of space required to store data and programs. File compression is not
    limited to hard-disk systems. It is frequently used to compress files on DVDs,
    CDs, and flash drives. File compression also helps to speed up transmissions when
    moving one computer system to another. Sending and receiving files across the
    Internet is a common activity.


    +   1 Go to 7-zip.zip.

    2 Click the download/link for the Windows .exe file.

    3 Follow the prompts to complete the download and installation.

    To see other tips, visit our website at www.computing2014.com and enter the keyword
    tips.


    File compression programs find ways to reduce the amount of required storage.
    One way is to search for repeating patterns. The repeating patterns are replaced
    with a token, leaving enough tokens so that the original can be rebuilt or decompressed.
    These programs shrink files to a quarter of their original size. To learn more
    about file compression, visit our website at www.computing2014.com and enter the
    keyword compression.


