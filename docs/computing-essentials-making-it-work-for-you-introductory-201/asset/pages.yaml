  md: '# A LOOK TO THE FUTURE


    # The End of Anonymity


    Do you enjoy the ability to interact with others on the web anonymously? Is there
    a sense of comfort knowing that you can express yourself freely without revealing
    your identity? Anonymity has been a way of life on the Internet since its beginning.
    Various organizations, from advertisers to gamers, are questioning whether the
    Internet can continue like this. And based on the amount of information shared
    by people online, one wonders anonymity will be valued all in the future.


    There are many factors that are causing many to question the value of anonymity.
    First is the issue of harassment. Most social media websites allow users to post
    messages anonymously. Some individuals use this ability to write abuse or threatening
    comments. Many children and teenagers have been victims of online harassment,
    at some point in their lives. Cyberbullying. Others who have been stalked online
    to the point where they have experienced psychological harm. Experts feel that
    if anonymous comments were disallowed, those individuals would not be willing
    to write those of messages, as their anonymity would be stripped. The other where
    anonymity has become a problem is the legal field. Some anonymous users have posted
    lies about individuals or businesses that have damaged the target''s reputation.
    In the real world, those types of false and damaging comments could lead to lawsuits.
    For these reasons, many legislators are proposing laws at discouraging the sort
    of anonymity that allows online crimes to occur. In the future, it may even be
    a requirement to provide a real-world ID to use the Internet.


    Many online companies are also fighting to end anonymity. This is because they
    make most of their money targeted advertising. For these companies to deliver
    the proper advertisement to you, they need to know a bit about you and your online
    activities. By having a profile they can follow your activity throughout the web
    to get to know you. At present, many advertisements are online for a product or
    service that does not interest you. In the future, every advertisement will interest
    you, as marketing companies develop a complete profile that lets them know everything
    about you. Now, many online businesses protect your privacy, but this is only
    in respect to what the public knows about.


    When it comes to advertising, they don''t hide it because it is not in their interest
    to do so. Essentially, it is a trade-off for users, who either give up some (or
    all) of your anonymity in return for targeted advertising.


    Many organizations are working toward ending or severely limiting anonymity, stating
    that would like to keep the Internet the way it is. Many civil rights groups and
    journalists support anonymity as a basis


    ![](img/17527690010086a83ec3d8f3ee262703_293_0.png)


    If you cannot be anonymous, then it would be difficult, for example, to post information
    that concerns abuses in government or in a business. Some organizations also support
    anonymity, stating that creating a separate identity can be useful for personal
    development, allowing an individual to explore interests without leaving a record
    that is not his or her own.


    How do you feel about the possible end to anonymity? Do you agree that there will
    be less negativity on the web if everyone had to provide real names? Since advertisements
    pay for free services, will you at least tolerate ads more if they contain something
    interests you?'
  merge: -1
  img_proc: true
