  md: '# VISUAL SUMMARY


    System Software


    # SYSTEM SOFTWARE


    # OPERATING SYSTEMS


    ![](img/17527690010086a83ec3d8f3ee262703_140_0.png)


    ![](img/17527690010086a83ec3d8f3ee262703_140_1.png)


    System software works with end users, application programs, and computer hardware
    to handle many details relating to computer operations.


    Not a single program but a collection or system of programs, these programs handle
    hundreds of technical details with little or no user intervention.


    Four kinds of systems programs are operating systems, utilities, device drivers,
    and language translators.


    +   - Operating systems coordinate resources, provide an interface between users
    and the computer, and run programs.


    +   - Utilities perform specific tasks related to managing resources.


    +   - Device drivers allow particular input or output devices to communicate with
    the rest of the computer system.


    +   - Language translators convert programming instructions written by programmers
    into a language that computers understand and process.


    Operating systems (software environments, software platforms) handle technical
    details.


    # Functions


    Functions include managing resources, providing a user interface (most operating
    systems use a graphical user interface, GUI), and running applications. Multitasking
    allows switching between different applications stored in memory; current programs
    run in foreground; other programs run in background.


    # Features


    Booting starts (cold) or restarts (warm) a computer system. The desktop provides
    access to computer resources. Common features include icons, windows, menus, tabs,
    dialog boxes, and gesture control. Data and programs are stored in a system of
    folders and files.


    # Categories


    Three categories of operating systems are


    +   - Embedded—used with handheld computers; operating system stored within device.


    +   - Network (NOS)—controls and coordinates working computers; located on the
    network server.


    +   - Stand-alone (desktop)—controls a single computer; located on the hard disk.


    Operating systems are often called software environments or software platforms.


