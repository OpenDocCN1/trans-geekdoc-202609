- pgno: 31
  md: '# # Introduction


    The purpose of this book is to help you become competent with computer technology.
    **Computer competency** refers to acquiring computer-related skills—indispensable
    tools for today. They include how to effectively use application packages and
    the Internet.


    In this chapter, we present an overview of an information system: people, procedures,
    software, hardware, data, and connectivity. It is essential to understand these
    basic parts and how connectivity through the Internet and the web expands the
    range of information technology in our lives. Later, we describe these parts of
    an information system in detail.


    Twenty years ago, most people had little to do with computers, at least directly.
    Of course, they filled out computerized forms, took computerized tests, and paid
    computerized bills. But the real work was handled by specialists. Then microcomputers
    came along and changed everything. Today it is easy for everyone to use a computer.


    ![](img/17527690010086a83ec3d8f3ee262703_31_0.png)


    **Welcome to Computing Essentials.**

    I''m Alan and I work in information technology. On the following pages, we''ll
    be discussing some of the most exciting new developments in computer technology
    including smartphones, tablet computers, and cloud computing. Let me begin this
    chapter with an overview of the book and showing you some of its features.


    +   * Microcomputers are common tools in all areas of life. Writers draw, engineers
    and scientists calculate—all on microcomputers. Students and businessmen do this
    and more.

    * New forms of learning have developed. People who are homebound, or who travel
    frequently may take online courses. A college course need not fit within a quarter
    or a semester.


    ![](img/17527690010086a83ec3d8f3ee262703_31_1.png)


    ![](img/17527690010086a83ec3d8f3ee262703_31_2.png)


    **People**

    are end users who use computers to make themselves more productive.


    **Software**

    provides step-by-step instructions for computer hardware.


    ![](img/17527690010086a83ec3d8f3ee262703_31_3.png)


    **Procedures**

    specify rules or guidelines for computer operations.


    **Figure 1-1** Parts of an information system


    4 CHAPTER 1'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'New ways to communicate, find people with similar interests, and to buy goods
    are available. People use electronic mail, electronic commerce, and the Internet
    to meet and share ideas and products.


    To be competent with computer technology, you need to know the parts of an information
    system: people, procedures, software, hardware, data, and connectivity. You also
    need to understand the wireless revolution, the Internet, and the web and to recognize
    the role of information technology in your personal life as well as your professional
    life.


    # # Information Systems


    When you think of a microcomputer, you think of just the equipment itself. That
    is, you think of the monitor or the keyboard. Yet, there is more to it than that.
    The way to think about a microcomputer is part of an information system. An information
    system has several parts: people, procedures, software, hardware,data, and connectivity.
    (See Figure 1-1).


    +   - People: It is easy to overlook people as one of the parts of an information
    system. Yet this is what microcomputers are all aboutmaking people, end users
    like you, more productive.

    - Procedures: The rules or guidelines for people to follow when using software,
    hardware, and data are procedures. These procedures are typically


    ![](img/17527690010086a83ec3d8f3ee262703_32_0.png)


    Data consists of unprocessed facts including text, numbers, images, and sounds.


    Hardware includes keyboard, mouse, monitor, system unit, and other devices.


    Connectivity allows computers to share information and to connect to the Internet.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'documented in manuals written by computer specialists. Software and hard-ware
    manufacturers provide manuals with their products. These manuals are provided
    in either printed or electronic (web link) form.


    +   * Software: A program consists of the step-by-step instructions that tell
    the computer how to do its work. Software is another name for a program or programs.
    The purpose of software is to convert (unprocessed facts) into information (processed
    facts). For example, a payroll program would the computer to take the number of
    hours worked in a week (data) and multiply it by pay rate (data) to determine
    how much you are paid for the week (information).


    +   * Hardware: The equipment that processes the data to create information is
    called hardware. It includes the keyboard, mouse, monitor, system unit, and other
    devices. Hardware is controlled by software.


    +   * Data: The raw, unprocessed facts, including text, numbers, images, and sounds,
    are called data. Processed data yields information. With the previo- example of
    a payroll program, the data (number of hours worked and pay rate) is processed
    (multiplied) to yield information (weekly pay).


    +   * Connectivity: Almost all of today''s computer systems add an additional
    part to the information system. This part, called connectivity, typically uses
    the Internet and allows us to greatly expand the expandability and usefulness
    of their systems.


    # concept check


    +   What are the parts of an information system?


    +   What is a program?


    +   What is the difference between data and information?


    # environment


    Did you know that 10 million tons of material was diverted from landfills last
    year alone as a result of recycling efforts? This success is largely due to voluntary
    participation of people across the country, who have made "reduce, reuse, recycle"
    commitment. This includes recycling cells, phones, printers, and monitors. Your
    participation in recycling means fewer one-use products, cleaner water and air.
    But recycling may now see waste as a resource, and one that we should be squandering
    by filling the garbage instead of the recycling bottle. Imagine a future where
    the garbage collector drops a check for your contributions to green. To see more
    environmental facts, visit our website at www.computing2014.com and enter the
    keyword environment.


    # People


    People are the most important part of any information system. Our lives are touched
    every day by computers and information systems. Many the contact is direct and
    obvious, such when we create documents using word processing program or we connect
    to the Internet. The contact is not as obvious (See Figure 1-2).


    Through this book you will find a variety of features to help you become competent
    and knowledgeable. These features include Making IT for You, Exploration, Environment,
    Ethics, Tips, IT, and the Computing Essentials.


    +   Making IT Work for You. Throughout this book you will find


    ![](img/17527690010086a83ec3d8f3ee262703_33_0.png)


    Figure 1-2 People and computers'
