  md: '52 MB of RAM to load the program, 512 MB to support graphical features, and
    another 512 MB-1024 MB of RAM for the operating system.


    Some applications, such as photo editing, may require even more. Fortunately,
    additional RAM can be added to a system by inserting an expansion module called
    a DIMM (dual in-line memory module) into the system board. The capacity or amount
    of RAM is expressed in bytes. (See Figure 5-11).


    Other types of RAM include DRAM, SDRAM, DDR, and DDRAM. To learn more about these
    types of RAM, visit our website at www.computing2014.com and enter the keyword
    ram.


    If you do not have enough RAM to load a program, it might be possible to run the
    program using virtual memory. Most of today''s operating systems support virtual
    memory. With virtual memory, large programs are divided into parts and the parts
    are stored on a secondary device, usually a hard disk. Each part is then read
    into RAM only when needed. In this way, computer systems are able to run very
    large programs. To learn more about how virtual memory works, visit our website
    at www.computing2014.com and enter the keyword memory.


    # ROM


    Read-only memory (ROM) chips have information stored in them by the manufacturer.
    Unlike RAM chips, ROM chips are not volatile and cannot be changed by the user.
    "Read only" means that the CPU can read, retrieve, and process data written to
    the ROM chip but cannot write—encode or change—the information or instructions
    in ROM.


    Not long ago, ROM chips were used to contain all the instructions for basic operations.
    For example, ROM instructions are needed to start a computer, to access memory,
    and to handle keyboard input. Recently, flash memory chips have replaced ROM chips
    for many applications.


    # Flash Memory


    Flash memory offers a combination of the features of RAM and ROM. Like RAM, it
    can be updated to store new information. Like ROM, it does not lose that information
    when power to the system is turned off.


    Flash memory is used for a wide range of applications. For example, it is used
    to store the start-up instructions for a computer. This information is called
    the system''s BIOS (basic input/output system). It would include the specifications
    concerning the amount of RAM and the type of keyboard, mouse, and storage devices
    connected to the system unit. If changes are made to the computer system, these
    changes are recorded in flash memory. To learn more about how computer start-ups
    and BIOS, visit our website at www.computing2014.com and enter the keyword boot.


    See Figure 5-12 for a summary of the three types of memory.


