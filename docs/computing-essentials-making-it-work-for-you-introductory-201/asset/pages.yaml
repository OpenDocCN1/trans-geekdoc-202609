    +   * **Image editors**, also known as **photo editors**, are specialized graphics
    programs for editing or modifying digital photographs. They are often used to
    touch up photographs to remove scratches and imperfections. The photographs consist
    of thousands of dots or pixels that that forms images referred to as **bitmap
    or raster images**. One limitation of bitmap images, however, is when they are
    expanded, the images can become pixelated, or jagged on the edges. For example,
    when the letter A in Figure 3-9 is expanded, the letter appear, as indicated by
    the expanded view.

    * **Popular image editors** include Adobe Photoshop, Core Paint Shop Pro, GIMP
    (GNU Image Manipulation Program), and Windows Live Photo Gallery. To learn more
    about one of the popular free image editors, see Microsoft Word for Image Editing
    on pages 75 and 76.

    * **Illustration programs**, also known as drawing programs, create and edit vector
    images. While bitmap images use pixels to represent shapes, vector images, also
    known as **vector illustrations**, use geometric shapes or curves (See Figure
    3-10). These objects are created by connecting lines and curves. Because these
    objects can be defined by mathematical equations, they can be rapidly and easily
    resized, colored, textured, and manipulated. An image is a combination of several
    objects.

    * Illustration programs are often used for graphic design, page layout, and creating
    sharp artistic images. Popular illustration programs include Adobe Illustrator,
    CoreDRAW, and Inkscape (See Figure 3-11).

    * **Image galleries** are libraries of electronic images. These images are used
    for a wide variety of applications from illustrating textbooks to providing visual
    interest to presentations.


