    # Memory


    Memory is a holding area for data, instructions, and information. Like microprocessors,
    **memory** is contained on chips connected to the system board. There are three
    well-known types of memory chips: random-access memory (RAM), read-only memory
    (ROM), and flash memory.


    # RAM


    **Random-access memory (RAM)** chips hold the program (sequence of instructions)
    and data that the CPU is presently processing. (See Figure 5-10) RAM is called
    temporary or volatile storage because it is lost as soon as the computer is turned
    off. It is also lost if there is a power failure or other disruption of the electric
    current joining the microprocessor. Secondary storage, which we shall describe
    in Chapter 7, does not have its contents. It is permanent or nonvolatile storage,
    as the data stored on a hard disk. For this reason, as we mentioned earlier, it
    is a good idea to frequently save your work in progress to a secondary device.
    That is, if you are working on a document or a spreadsheet, every few minutes
    you should save, store the material.


    Cache (pronounced "cash") memory improves processing by acting as a temporary
    high-speed holding area between the memory and the CPU. The computer detects which
    information in RAM is most frequently used and then copies that into the cache.
    When needed, the CPU can quickly access the information from the cache.


    Having enough RAM is important! For example, to use Microsoft Office 2010 effectively,
    you need a minimum of


