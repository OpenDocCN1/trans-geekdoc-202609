  md: 'expensive color printing for select applications. Typical inkjet printers produce
    17 to 19 pages per minute of black-only output and 13 to 15 pages of color output.


    # Laser Printers


    The laser printer uses a technology similar to that used in a photocopying machine.
    Laser printers use a laser light beam to produce images with excellent letter
    and graphics quality. More expensive than inkjet printers, laser printers are
    faster and are used in applications requiring high-quality output. (See Figure
    6-25.)


    There are two categories of laser printers. Personal laser printers are less expensive
    and are used by many single users. They typically can print 5 to 17 pages a minute.
    Shared laser printers typically support color, are more expensive, and are used
    (shared) by a group of users. Shared laser printers typically print over 50 pages
    a minute.


    # Other Printers


    There are several other types of printers. These printers include cloud printers,
    thermal printers, and plotters:


    +   - Cloud printers are printers connected to the Internet that provide services
    to others on the Internet. Google Cloud Print is a service that supports printing.
    One user activates a printer using Google Chrome OS, others can access that printer
    anywhere with an Internet connection.

    - Thermal printers use heat elements on heat-sensitive paper. These printers are
    widely used with ATMs and gas-line pumps to print receipts.

    - Plotters are special-purpose printers for producing a wide range of specialized
    output. Using input from graphics tables or other graphical input devices, plotters
    create maps, images, and architectural and engineering drawings. Plotters are
    typically used by graphic artists, engineers, and architects to print designs,
    sketches, and drawings.


    ![](img/17527690010086a83ec3d8f3ee262703_194_0.png)


