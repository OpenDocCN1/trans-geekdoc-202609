  md: '# 1 sector


    As we will discuss in detail in Chapter 7, files are stored and organized on a
    disk according to tracks and sectors. A track is a concentric ring. Each track
    is divided into wedge-shaped sections called sectors.(See Figure 4-13.) The operating
    system tries to save a single track across contiguous sectors. Often, however,
    this is not possible, and the file has to be broken or fragmented, into small
    parts that are stored wherever space is available. When a file is retrieved, it
    is reconstructed from the fragments. After a period of time, a hard disk becomes
    highly fragmented, slowing operations.


    ![](img/17527690010086a83ec3d8f3ee262703_135_0.png)


    Figure 4-13 Tracks and sectors


