- pgno: 204
  md: 'To be a competent end user, you need to be aware of the most commonly used
    input and output devices. These devices are translators for information into and
    out of the system unit. Input devices translate words, sounds, and actions into
    symbols the system unit can process. Output devices translate symbols from the
    system unit into words, images, and sounds that people can understand.


    # ## SCANNING DEVICES


    # ## IMAGE CAPTURING DEVICES


    ![](img/17527690010086a83ec3d8f3ee262703_204_0.png)


    ![](img/17527690010086a83ec3d8f3ee262703_204_1.png)


    Image capturing devices create or capture original images. These devices include
    digital cameras and webcams.


    Scanning devices move across text and images to convert them into a form that
    the system unit can process.


    # ### Optical Scanners


    Optical scanner (scanner) converts documents into machine-readable form. The three
    basic types are flatbed, desktop, and portable.


    # ### Card Readers


    Card readers interpret encoded information located on a variety of cards. The
    most common is the magnetic card reader that reads information from a magnetic
    strip on the back of a card.


    # ### Bar Code Readers


    Bar readers or scanners (either handheld readers or platform scanners) read bar
    codes on products. The bar code system Universal Product Code (UPC) is widely
    used in supermarkets.


    # ### Digital Cameras


    Digital cameras are similar to traditional cameras except that images are recorded
    digitally on a disk or in the camera''s memory. Most digital cameras record video.


    # ### Webcams


    Webcams are specialized digital video cameras that capture images and send them
    to a computer for broadcast over the Internet. Webcams are built into many smartphones
    and tablets, while others are attached to the computer monitor.


    # ### AUDIO-INPUT DEVICES


    Audio-input devices convert sounds into a form that can be processed by the system
    unit. The most widely used audio-input device is the microphone.


    # ### Voice Recognition Devices


    Voice recognition systems use a microphone, sound card, and special software.
    These systems allow users to operate computers and other devices as well as create
    documents using voice commands. Specialized voice recorders are widely used by
    doctors, lawyers, and others to record dictation. Some systems are able to translate
    dictation from one language to another, such as English to Japanese.


    # ### RFID Readers


    RFID readers read RFID (radio-frequency identification) tags. These are widely
    used for tracking lost pets, inventory, and for recording prices and product descriptions.


    # ### Character and Mark Recognition Devices


    Character and mark recognition devices are scanners that are able to recognize
    special characters and marks. Three types are magnetic-ink character recognition
    (MICR), optical-character recognition (OCR), and optical-mark recognition (OMR).


    Input and Output 177'
