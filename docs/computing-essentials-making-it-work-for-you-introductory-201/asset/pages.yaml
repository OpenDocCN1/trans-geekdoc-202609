    # Security


    We are all concerned with having a safe and secure environment to live in. We
    are careful to lock our car doors and homes. We are careful about where we walk
    at and whom we talk to. This is personal security. What about computer security?
    If someone gains unauthorized access to our computer or other computers that contain
    information about us? These people are commonly known as hackers. It should be
    noted that not all hackers are intent on malicious actions and that not all are
    criminals. Security involves protecting individuals and organizations information,
    hardware, and software from unauthorized use, as well as preventing or limiting
    the damage from intrusions, sabotage, and natural disasters.


    # Cybercrime


    Cybercrime or computer crime is an criminal offense that affects a computer and
    a network. It was recently estimated that cyber affects over 400 million people
    and costs $400 billion each year. Cyberimes take various forms including the creation
    of malicious programs, denial of service attacks, Internet scams, theft, and data
    manipulation.


    Malicious Programs A cracker is a someone who creates and distributes malicious
    programs. These programs are called malware, which is short for malicious software.
    They are specifically designed to damage or disrupt a computer system. The three
    most common types of malware are viruses, worms, and Trojans.


    +   * Viruses that migrate through networks and operating systems, and most attach
    to different programs and databases. While some viruses are relatively harmless,
    many can be destructive. Once activated, these viruses can alter and/or delete
    files. Creating and spreading a virus is a very serious threat and a federal offense
    punishable under the Fraud and Abuse Act.

    Unfortunately, new computer viruses are appearing all the time. The best way to
    stay current is through services that keep track of viruses on a daily basis.
    For example, Symantec tracks the most serious virus threats.

    * Worms that simply replicate themselves over and over again. Once active in a
    network, the self-replicating virus clogs computers and networks across the world
    within hours, stopping tens of thousands of computers along its way. Unlike a
    virus, a worm typically does not attach to a program or alter/or delete files.
    Worms, however, can carry a virus. Once a virus has been deposited by a user onto
    an unsuspecting computer system, the virus


