  md: '# Making IT work for you


    # GOOGLE DOCS


    You may need to create and collaborate with others on a document, presentation,
    spreadsheet? Do you need access from different computers in different locations?
    if so, an online office suite, such as Google Docs, might be just what you need.


    Creating a Document You must have a free Google account in order to start creating
    and sharing documents. To get started:


    +   - Go to www.google.com, if you are not signed in or you do not have a Google
    account, click the Sign in button and follow the appropriate instructions.


    +   - Once you are signed in, click Documents at the top of the page. If the Google
    Drive screen appears, click the Get started button to continue.


    +   - Click the Create button; select Document.


    +   - Starting typing in the blank document. You will notice many familiar buttons
    in the toolbar above the document area.


    +   - Click the Untitled document area at the top left, and you will be prompted
    to enter a name for the document.


    +   - Close the browser tab (or window) in order to close the document.


    You may have noticed that there is no save option. This is because your document
    is automatically saved as you work on it.


    Sharing a Document Any document that you create can be shared with one or more
    individuals. These individuals can be granted read-only access, or could be allowed
    to edit the document, even at the same time that you are working on it. To share
    a document:


    +   - With the document, click the Share button at the top right.


    +   - Type in the e-mail addresses of those with whom you wish to share the document.


    +   - To the right of this text box, select the permission these individuals have
    for.


    +   - Click the Share & save to finish.


