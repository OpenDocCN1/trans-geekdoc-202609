    # Wireless Connections


    Wireless connections do not use a solid substance to connect and receiving devices.
    They move data through the air.


    Most wireless connections use radio waves to communicate. For smartphones and
    many Internet-enabled devices use radio waves to place telephone calls and connect
    to the Internet. Primary technologies used for wireless connections are Bluetooth,
    Wi-Fi, WiMax, LTE, and satellite connections.


    +   * Bluetooth is a short-range radio communication standard that transmits data
    over short distances of approximately 33 feet. Bluetooth is widely used for wireless
    headsets, printer connections, and handheld devices.


    +   * Wi-Fi (fidelity) uses high-frequency radio signals to transmit data. A number
    of standards for Wi-Fi exist, and each can send and receive data at a different
    speed (Figure 8-6) Most home and business networks use Wi-Fi.


    +   * Microwave communication uses high-frequency radio waves. It is referred
    to as line-of-sight communication because microwaves cannot bend with the curve
    of the earth, they can be transmitted only over relatively short distances. Thus,
    microwave is a good medium for sending data between buildings in a city or on
    a college campus. For longer distances, the waves must be relayed by microwave
    stations with microwave dishes or antennas (Figure 8-7).


    +   * WiMax (Worldwide Interoperability for Microwave Access) is a new standard
    that extends the range of Wi-Fi networks using microwave connections. WiMax is
    commonly used by universities and others to extend the capability of using Wi-Fi
    networks.


    +   * LTE (Total Evolution) is one of the newest wireless standards. Currently,
    LTE and WiMax connections provide similar performance. LTE, however, promises
    to provide greater speed and quality connections in the near future.


    +   * Satellite communication uses satellites orbiting 22,000 miles above the
    earth as relay stations. Many of these are offered by Intelsat, the International
    Satellite Consortium, which is owned by 114 governments and a worldwide communication
    system. Satellites orbit at a precise point and speed above the earth. They can
    amplify and relay microwave signals from one transmitter to others. Satellite
    communication can be used to receive and send large volumes of data. Uplink is
    a term relating to sending data to a satellite. A major drawback to satellite
    communication receiving data is that bad weather can sometimes interrupt the flow
    of data.


    One of the most interesting applications of satellite communications is for global
    positioning. A network of satellites managed by the Department of Defense continuously
    sends location information to earth. Global positioning system (GPS) devices use
    information to uniquely determine the location of the device. Available in many
    automobiles to provide navigational support, these systems are mounted into the
    dash with a monitor to display maps and speakers to provide spoken directions.


