    # ETHICS


    Ethics discussion questions are carefully integrated with the chapter''s marginal
    Ethics boxes. The questions facilitate in-class discussion or assignments focusing
    on ethical issues relating to technology. They are designed to develop a student''s
    ability to think critically and communicate.


    +   * Ethics: BLOGS

    | Half a million people are active in blogs, and many of those are also reading
