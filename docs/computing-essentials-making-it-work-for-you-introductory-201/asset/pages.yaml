  md: '# A LOOK TO THE FUTURE


    # Self-Healing Computers Could Mean an End to Computer Crashes and Performance
    Problems


    Wouldn''t it be nice if computers could fix themselves? What if your computer
    continually fine-tune its operations to maintain peak performance? And wouldn''t
    it be a relief if you never had to help your computer recover after a virus or
    intrusion? For many people, such things too good to be true. Maintenance and troubleshooting
    tasks like these can be time-consuming and frustrating.


    Imagine you run a business, and tasks are performed, and unless these lose time
    and money. It is not a pleasant daydream, and it quickly becomes a nightmare when
    properly systems administrators to keep servers smoothly. Yet many experts predict
    that supercomputers and business systems are not far from becoming complex for
    humans to manage


    Recent news from IBM makes the dream of a self-repairing, self-updating, and self-protecting
    server closer.


    IBM has announced plans to concentrate efforts on developing such a server. The
    project, called the Autonomic Computing Initiative (ACI), hopes to free businesses
    from time-consuming computer maintenance. IBM hopes the new system will be self-regulating
    and virtually invisible. It believes autonomic computing has the potential to
    revolutionize the business world.


    Autonomic computing is a system that allows machines to run with little intervention.
    Such computers would not


    have self-awareness but would be-correcting. Autonomic processes in machines are
    modeled after autonomic processes in the human body. For example, you are not
    consciously breathing-instead, your body monitors and maintains respiration without
    your input. Scientists hope autonomic computing will behave in a similar manner
    and maintain systems without intervention.


    Autonomic machines would be able to identify security flaws and repair them. They
    would be able to sense complex operations and perform corrective action. They
    would be able to detect, format, and test it. Computer usage will become less
    complex so you can focus on getting done instead of worrying about the machine''s
    operation. These goals are impressive, and the autonomic computing is still in
    development.


    It is important to note that artificial intelligence is not human cognitive abilities
    or intelligence. Instead, these machines have knowledge of their own systems and
    the capability to learn from experience to correct errors.


    Given the potential for a self-maintaining server, the possibility of a similar
    system designed for a microcomputer seems like a dream and more like reality.
    What do you think? Will microcomputers care for themselves? Do you think it is
    possible to have a computer managing its own security? Will hackers find a way
    to outsmart these "intelligent" systems?


    ![](img/17527690010086a83ec3d8f3ee262703_139_0.png)'
