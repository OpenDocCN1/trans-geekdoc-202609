    # Major Laws on Privacy


    Some laws governing privacy matter have been created. For example, the Gramm-Leach-Bliley
    Act protects personal financial information, the Health Insurance Portability
    and Accountability Act (HIPAA) protects medical records, and the Family Educational
    Rights and Privacy Act (FERPA) restricts disclosure of educational records. To
    learn more about existing privacy laws, visit our site at www.computing2014.com
    and enter the keyword [law].


    Most of the information collected by private organizations is not covered by existing
    laws. However, as more and more individuals become concerned about controlling
    who has the right to personal information and how that information is used, companies
    and lawmakers will respond.'
