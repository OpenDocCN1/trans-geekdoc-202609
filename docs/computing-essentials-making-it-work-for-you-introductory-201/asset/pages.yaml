    rather than forcing the user to comfort to the task. For computer users and manufacturers
    this means designing input and output devices to increase ease of use and to avoid
    health risks.


    Sitting in front of a screen awkward positions for long periods may lead to problems
    such as eyesight, headaches, and back pain. Computer users can alleviate these
    problems by taking frequent breaks and by using


