- pgno: 245
  md: 'Cellular service providers, Verizon, AT&T, Sprint, and T-Mobile, support voice
    and data transmission to wireless devices. Cellular services have gone through
    different generations. First-generation mobile telecommunications (1G) started
    in the 1980s using analog radio signals to signal voice transmission service.
    Second-generation mobile telecommunications (2G) started in the 1990s using digital
    radio signals. This generation focused on voice transmission and was too slow
    for Internet connectivity. Third-generation mobile telecommunications (3G) started
    in the 2000s and provided services capable of effective connectivity to the Internet,
    marking the beginning of smartphones.


    Fourth-generation mobile telecommunications (4G) has been widely marked by cellular
    services, yet not everyone acknowledges that 4G entered into its infancy with
    providers using WiMax and LTE connections to provide faster transmission speeds.
    While current speeds are only marginally faster than 3G, 4G technologies promise
    to provide speeds up to 10 times faster than 3G in the future.


    To learn more about how can use mobile communications, see Making IT for You:
    Mobile Internet on page 219.


    ![](img/17527690010086a83ec3d8f3ee262703_245_0.png)


    # Data Transmission


    Several factors affect how data is transmitted. These factors include bandwidth
    and protocols.


    # Bandwidth


    Bandwidth is a measurement of the width or capacity of the communication channel.
    Effectively, it means how much information can move across the communication channel
    in a given amount of time. For example, to transmit documents, a slow bandwidth
    would be acceptable. However, to effectively transmit video and audio, a wider
    bandwidth is required. There are four categories of bandwidth.


    +   - Voiceband, also known as low bandwidth, is used for standard telephone communication.
    Microcomputers with telephone modem and dial-up service use this bandwidth. While
    effective for transmitting text documents, it is too slow for many types of transmission,
    including high-quality audio and video.


    +   - Medium band is used in special leased lines to connect midrange routers
    and mainframes as well as to transmit data over long distances. This-band is capable
    of high speed data transfer.


    +   - Broadband is widely used for DSL, cable, and satellite connections to the
    Internet. Several users can simultaneously use a single broadband connection for
    high-speed data transfer.


    +   - Baseband is widely used to connect individual computers that are located
    close to one another. Like broadband, it is able to support high-speed transmission.
    Unlike broadband, however, baseband can only carry a single signal at one time.'
