  md: '# Ethics


    What do you suppose how computers can be used? You probably think first of laws.
    Course, that is right, but technology is moving so fast that it is very difficult
    for our legal system to keep up with. The essential element that controls computers
    are used today is ethics.


    As you may know, ethics are standards of moral conduct. Computer ethics are guidelines
    for the morally acceptable use of computers in our society. Ethical treatment
    is critically to us all, and we are all to ethical treatment. This includes the
    right to keep personal information, such as credit ratings and medical histories,
    from getting into unauthorized hands. Under the control of corporations and government
    agencies, were covered earlier in this chapter. Many more have been addressed
    in the Ethics books throughout this book. We will now explain two issues in computer
    ethics average users have a right to play.


    # Copyright and Digital Rights Management


    Copyright is a legal concept that gives creators right to control and distribution
    of their work. Materials that can be copyrighted include books, music, films,
    and even video. Some users choose to make unauthorized copies of digital media,
    which violates copyright. For example, making an unauthorized copy of a digital
    music file for a friend might be a copy-right violation.


    Software piracy is the unauthorized copying and/or distribution of software. According
    to a recent study, software piracy costs the software industry over $30 billion
    annually. To prevent copyright, corporations often use digital rights management
    (DRM). DRM encompasses various technologies that control access to electronic
    media and files. Typically, DRM is used to (1) control the number of devices that
    one can access and (2) limit the kinds of devices that can access it. Although
    some companies see DRM as a necessity to protect their rights, some users feel
    they should have the right to use the media they buy—movies, music, software,
    and even games—as they choose.


    The Millennium Copyright Act makes it illegal to deactivate or disable any antipiracy
    technologies including DRM technologies. The act also establishes that copies
    of commercial programs may not be legally resold or given away. It further makes
    it a crime to sell or use programs or devices that are used to illegally copy
    software. This may come as a surprise to those who copy software using and music
    from a friend or from the Internet. The law is clear: it is illegal to copy or
    download copyright-protected music and videos from the Internet without appropriate
    authorization.


    Today, there are many legal sources for digital media. Television programs can
    be watched online, often for free, on television-sponsored sites. Sites like


