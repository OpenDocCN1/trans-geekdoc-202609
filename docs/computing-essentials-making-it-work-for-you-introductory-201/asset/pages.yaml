  md: '# Glossary


    3G and 4G cellular network: A network that allows portable devices such as cell
    phones and properly equipped laptop computers to download data from the Internet.


    3GLs (third-generation languages): High-level procedural languages. See procedural
    generation.


    4G (fourth-generation telecommunications): Provides faster transfer speeds than
    3G, 3G started in the 2000s providing service effective connectivity to the Internet
    and marked the beginning of smartphones.


    4GLs (fourth-generation languages): Very high-level or procedure-oriented languages.
    See Task-oriented generation.


    5GLs (fifth-generation languages): See Fifth-generation generation.


    802.11: See Wi-Fi (wireless fidelity).


    Advanced Research Project Network (ARPANET): A national computer network from
    which the Internet developed.


    Agile development: A development methodology that starts by getting functionality
    of a program working, then expands on until the customer is satisfied with the
    results.


    AJAX: An extension of JavaScript found on many interactive sites. This technology
    is used to create interactive websites that respond quickly like traditional desktop
    application software.


    All-in-one: A desktop computer that has the monitor and system housed in the same
    case (e.g., Apple''s iMac).


    Analog: Signals that represent different tones, volume, etc.


    Analog signals: Signals that represent a range of frequencies, such as the human
    voice. They are a continuous electric wave opposed to a digital signal that is
    either or off. To convert the signals of analog to digital you need a modem. Analog
    cable connects the modem to the telephone wall.


    Analytical graphs: Forms of graphics used to present data in objects that are
    easier to analyze, such as bar charts, line graphs, and pie charts.


    Android: Mobile operating system developed by Android Inc. and later purchased
    by Google.


    AC adapter: Notebook computers use AC adapters that are outside the system. You
    plug them into a wall outlet, convert AC to DC, provide power to the device and
    can charge batteries.


    Access: The responsibility of those who have control over and are able to use
    data.


    Access speed: The amount of time required to retrieve and store data.


    Accounting: The organizational department that handles all financial activity
    from customers to paying employees.


    Accounts payable: The activity that shows a company owes to its suppliers for
    the materials and services it has received.


    Accounts receivable: The activity that shows money owed to us or received by customers.


    Accuracy: The responsibility of those who control the data to be correct.


    Active area: The diagonal length of a monitor''s viewing area.


    Active-matrix monitor: Type of flat-panel monitor in which each pixel is independently
    activated. Displays show colors with better clarity; also known as film transistor
    (TFT).


    Active organic light-emitting diode (OLED): A monitor that has the benefits of
    lower-power consumption and longer battery life, as well as thinner displays.


    Add Device Wizard: A wizard that provides step-by-step guidance for installing
    and an appropriate printer driver for a new printer.


    Address: Located in the header of an e-mail message; the e-mail address of the
    people sending, receiving, and, optionally anyone else who is to receive copies.


    Antispyware: See remove programs.


    Antivirus program: A utility program that guards a computer from viruses or other
    dangerous programs.


    App Server generation.


    App store: A website that provides specific mobile apps that can be downloaded
    for a nominal fee or free of charge.


    역시: Web pages contain links to program apps, which are written in a programming
    language called Java. These programs are used to add interest to a website by
    using animation, graphics, providing interactive games, and so forth.


