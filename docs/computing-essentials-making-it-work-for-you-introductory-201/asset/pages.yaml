    |---|---|n| Restricting access | Limit access to authorized persons using such
    measures as passwords and firewalls. |

    | Encrypting data | Code all messages sent over a network. |

    | Anticipating disasters | Prepare for disasters by ensuring physical security
    and data security through a disaster recovery plan. |

    | Preventing data loss | Routine copy and store it at a remote location. |


