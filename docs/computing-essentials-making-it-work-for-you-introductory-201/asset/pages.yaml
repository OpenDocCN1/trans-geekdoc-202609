    allow you to efficiently copy files and from your computer across the Internet.


    # Plug-ins


    **Plug-ins** are programs that are automatically started and operate as a part
    of your browser. Many websites require you to have one or more plug-ins to fully
    experience their content. Some widely used plug-ins include


    +   - Acrobat Reader from Adobe—for viewing and printing a variety of standard
    forms and other documents saved in a special format called PDF.

    - Flash Player from Adobe—for viewing videos, animations, and other media.

    - QuickTime from Apple—for playing audio and video files. (See Figure 2-21)

    - Windows Media Player from Microsoft—for playing audio files, video files, and
    much more.

    - RealPlayer from RealNetworks—for playing audio and video files.


