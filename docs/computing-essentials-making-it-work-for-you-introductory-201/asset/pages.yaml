    components, secondary storage, and input and output devices. Personal digital
    assistants (PDAs) and smartphones are the most widely used hand-computers. Smartphones
    are cell phones with wireless connections to the Internet and processing capabilities.
    Their growth has been explosive in the past few years.


    # Microcomputer Hardware


    Hardware for a microcomputer system consists of a variety of different devices.
    See Figure 1-9 for a typical desktop system. This physical equipment falls into
    four basic categories: system unit, input/output, secondary storage, and communication.
    Because we discuss hardware in detail later in this book, here we will just a
    quick overview of the four basic categories.


    +   * **System unit** The system unit is a container that houses most of the electronic
    components that make up a computer system. Two important components of the system
    unit are the *microprocessor* and *memory*. (See Figure 1-10) The *microprocessor*
    controls and manipulates data to produce information. **Memory** is a holding
    area for data, instructions, and information. One type, **random-access memory
    (RAM)**, holds the program and data that is currently being processed. This type
    of memory is sometimes referred to as *temporary storage* because its contents
    will typically be lost if the electric power to the computer is disrupted.

    * **Input/output**: **Input devices** translate data and programs that humans
    can understand into a form that the computer can process. The most common input
    devices are the **keyboard** and the **mouse**. **Output devices** translate the
    processed information from the computer into a form that humans can understand.
    The most common output devices are **monitors** (see Figure 1-11) and printers.'
