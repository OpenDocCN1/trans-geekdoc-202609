    As digital cameras and webcameras became cheaper and became more sophisticated,
    it is likely that many more issues involving personal privacy in public spaces
    will need to be addressed. A combination of computing technologies could, make
    real-time tracking of individuals in public places possible.


    Identity theft is a growing problem, and can be financially devastating if you
    are a victim. Thieves use anything that can help steal your identity, from your
    Social Security number and date of birth to account information and passwords.
    Here are some steps to protect your identity from social networking areas that
    are public or in response to an e-mail from someone you do not know or trust.


    **Spreading information without personal consent:** How would you feel if an employee
    were using your Facebook, Google+, or other networking profiles to make decisions
    about hiring, placement, promotion, and firing? It is a common practice for many
    organizations.


    +   1 Be careful what you write on the internet. Never post personal information
    on forums or social networking areas that are public or in response to an e-mail
    from someone you do not know or trust.

    2 Only do business on the internet with companies you know to be legitimate.

    3 When your credit card is stolen, you are entitled to a free personal credit
    report from each of the three major credit reporting agencies. The official site
