  md: '# Privacy, Security, and Ethics


    # Competencies


    After you have read this chapter, you should be able to:


    +   1 Identify the most significant concerns for effective implementation of computer
    technology.

    2 Discuss the primary privacy issues of accuracy, property, and access.

    3 Describe the impact of large databases, private networks, the Internet, and
    the web on privacy.

    4 Discuss online identity and the major laws on privacy.

    5 Discuss cyberimes including inclusion of malicious programs such as viruses,
    Trojan horses, and zombies as well as denial of service attacks, Internet scams,
    social networking risks, cyberbullying, rogue Wi-Fi hotspots, theft, and data
    manipulation.

    6 Detail ways to protect computer security including restricting access, encrypting
    data, anticipating disasters, and preventing data loss.

    7 Discuss computer ethics including copyright law, software piracy, digital rights
    management, the Digital Millennium Copyright Act, as well as plagiarism and ways
    to identify plagiarism.


    Download the free Essentials 2014 app for videos, key term flashcards, quizzes,
    and the game, Over the Edge!


    ![](img/17527690010086a83ec3d8f3ee262703_267_0.png)


    # Why should I read this chapter?


    In the past, protecting your privacy and security was pretty simple. You needed
    a paper shredder and perhaps an unlisted phone number. That was then and this
    is now. Now, in the digital age, personal security and privacy are much more complicated
    and difficult. Every minute there are thousands of malicious programs that are
    being spread across the Internet. This chapter discusses privacy including identity
    theft, cookies, web bugs, and keystroke loggers.


    Additionally, you''ll learn about viruses, rogue Wi-Fi hotspots, and the risks
    associated with Face-book and other social networks. You will also learn how to
    protect your computer security using a variety of techniques including biometric
    scanners and encryption. To be competent and be competitive in today''s professional
    workplace, you need to know and understand these things.


    ![](img/17527690010086a83ec3d8f3ee262703_267_1.png)'
