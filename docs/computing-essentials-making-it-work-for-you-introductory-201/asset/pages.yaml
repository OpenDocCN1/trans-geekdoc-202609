  md: '# A LOOK TO THE FUTURE


    # Augmented Reality Displays


    Have you ever run into someone who looks familiar, but you cannot remember their
    name or who you know them from? What about finding yourself in an unfamiliar town,
    having to look at your smartphone or GPS to get directions? Don''t you wish the
    information would appeared instantly, right? With augmented reality displays,
    this will become a reality. Data from your computer and the Internet will become
    instantly accessible and viewable without having to access another device.


    The reality you see in front of you is improved, or augmented, with additional
    visual information using projected images. Bringing up information about a visual
    image is not new. Search engines already have the ability to identify an image
    simply by looking for similar images in their databases. In addition, many types
    of software can do the same with faces, looking at key points in the image in
    order identify that identity. Augmented reality will take technology step further
    by integrating it with glasses or contact lenses. Whether you look at a landmark,
    textbook, or person, the computer connected will be able to retrieve the information
    you need and place in your field of vision. So if you forgot the name of the person
    greeting you in the coffee shop, do not. Your name and biography will be retrieved
    from your social networking account and displayed in front of you to properly
    retrieve the greeting.


    Identification of people and objects is not the only use of augmented reality.
    As technology continues to shrink in size, the device will be able to perform
    all the tasks of your smartphone. You will be able to look at the sky and see
    information about today''s weather. Text message and incoming call notifications


    can appear in front of you. Prices from various online stores will appear by the
    time you ask your friend he got that new T-shirt. And of course, integrated GPS
    will display arrows in front of you and guide you as you walk through unfamiliar
    city streets.


    Although this technology will be available in the next few years, there are some
    challenges. First, you have the issue of powering the device. Something as small
    as a pair of glasses or contact lenses may not have room for a large battery enough
    limitations of human vision to power it all day. Another issue involves our eyes
    find it to focus on objects that are placed close to them. Researchers have come
    up with various solutions to fix this problem, but they need to make it comfortable
    for the eyes to shift focus between the information being projected close to the
    real-world object that could be far away.


    Lastly, Will these glasses or contact lenses be comfortable to wear all day? Will
    they make you strange to those that do not know about augmented reality?


    Many companies and universities are working on various types of augmented reality
    displays. There are a few that seem close to release for the general public are
    from Google. Prototype eyeglass from its ''Project Glass'' division are already
    being tested by Google employees.


    To learn more about our website at www computing2014.com and enter the keyword
    projectglass:


    Now that you have learned more about augmented reality, do you see yourself wearing
    these sorts of eyeglasses when they become affordable? Do you think they can end
    up being a dangerous distraction?


