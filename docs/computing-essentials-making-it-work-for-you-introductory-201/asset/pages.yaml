- pgno: 91
  md: '# Introduction


    Not long ago, trained specialists were required to perform many of the operations
    you can now do with a microcomputer. Market analysts used calculators to project
    sales. Graphic artists created designs by hand. Data processing clerks created
    electronic files to be stored on large computers. Now you can do all these tasks—and
    many others—with a microcomputer and the appropriate software.


    Think of the microcomputer as an electronic tool. You may not consider yourself
    very good at typing, calculating, organizing, presenting, or managing information.
    However, a microcomputer can help you do all these things and much more. All it
    takes is the right kind of software.


    Competent users need to understand the capabilities of general-purpose application
    software, which includes word processors, spreadsheets, database management systems,
    and presentation programs. They need to know about integrated packages and software
    suites.


    Hi, James, and I''m a software engineer. I''d like to talk with you about application
    software... programs we all need to know. I''d also like to talk with you about
    how to access and use these traditional programs using cloud computing.


    # Application Software


    As discussed in Chapter 1, there are two kinds of software. System software with
    end users, application software, and computer hardware to handle the majority
    of technical details. Application software can be described as end-user software
    and is used to accomplish a variety of tasks.


    Application software can be divided into three categories. One category, general-purpose
    applications, which includes word processing programs, spreadsheets, database
    management systems, and presentation graphics. Another category, specialized applications,
    includes thousands of other programs that tend to be more focused and used in
    specific disciplines and occupations. The third category, mobile apps, are add-on
    features or programs designed for a variety of mobile devices including smartphones
    and tablets.


    # User Interface


    A user interface is the portion of the application that allows you to control
    and interact with the program. Almost all applications use a graphical user interface
    (GUI) that displays graphical elements called icons to represent familiar objects
    and a mouse. The mouse controls a pointer on the screen that is used to select
    items such as. Another feature is the use of windows. A window is a rectangular
    area that can contain a document, program, or message. (Do not confuse the term
    window with the various versions of Microsoft''s operating systems, which are
    programs.) More than one window can be opened and displayed on the computer screen
    at any time.


    Traditionally, most software programs use a system of menus, toolbars, and dialog
    boxes. (See Figure 3-1).


    +   * Menus present commands that are typically displayed in a menu bar at the
    top of the screen.

    * Toolbars typically appear below the menu bar and include small graphic elements
    called buttons that provide shortcuts for quick access to commonly used commands.

    * Dialog boxes provide additional information and request user input.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '![](img/17527690010086a83ec3d8f3ee262703_92_0.png)


    Many Microsoft and other applications use an interface known as the Ribbon GUI
    to make it easy to find and use all the features of an application; this GUI uses
    a system of ribbons, tabs, and galleries. (See Figure 3-2)


    +   - **Ribbons** replace menus and toolbars by organizing commands into a set
    of tabs. These tabs display command buttons that are the most relevant to the
    tasks performed by the user.

    - **Tabs** are used to divide the ribbon into major activity areas. Each tab is
    organized into groups that contain related items. Some tabs, contextual tabs,
    only appear when they are needed and anticipate the next operations performed
    by the user.

    - **Galleries** simplify the process of making a selection from a list of alternatives.
    This is accomplished by graphically displaying the effect of alternatives before
    being selected.


    ![](img/17527690010086a83ec3d8f3ee262703_92_1.png)


    Did you know that downloading software can actually generate energy savings? Microsoft,
    for example, finds that distributing its software as an electronic download results
    in a 91 percent reduction of carbon emissions, compared to traditional CD or DVD
    distribution. This occurs because no physical product comes from the shipment
    of discs and packaging materials. So instead of purchasing software packages,
    buying on the web and downloading to your computer will not only benefit the environment,
    but you will also get the software faster and save a few dollars. To learn more
    about environmental impact, visit www.computing2014.com or enter the keyword environment.


    ![](img/17527690010086a83ec3d8f3ee262703_92_2.png)


    ![](img/17527690010086a83ec3d8f3ee262703_92_3.png)


    Application Software'
