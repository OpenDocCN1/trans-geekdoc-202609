    # Touch Screens


    A touch screen allows users to select actions or commands by touching the screen
    with a finger or penlike device. Multitouch screens can be touched with more than
    one finger, which allows for interactions such as rotating graphical objects on
    the screen with your hand or by pinching and stretching your fingers. Multitouch
    screens are commonly used with tablets and smartphones, as well as some notebook
    computers and desktop monitors. (See Figure 6-7.)


    # Game Controllers


    Game controllers are devices that provide input to computer games. While keyboards
    and mice can be used as game controllers, the four most popular and specialized
    controllers are joysticks, dance pads, gamepads, and motion sensing devices. (See
    Figure 6-8.)


    +   - Joysticks control game actions by varying the pressure, speed, and direction
    of a control stick.

    - Dance pads provide input for dance games. Moves move (dance) on a pressure-sensitive
    mat that provides input to the game.

    - Gamepads are designed to be held by two hands and provide a wide array of inputs
    including motion, turning, stopping, and firing.

    - Motion-sensing devices control game users by movements. For example, Microsoft''s
    Kinect motion-sensing device accepts user movements and spoken commands to control
    games on the Xbox 360.


    ![](img/17527690010086a83ec3d8f3ee262703_184_2.png)


    # Stylus


    A stylus is a penlike device commonly used with tablet PCs and PDAs. (See Figure
    6-9.) A stylus uses pressure to draw images on a screen. Often, a stylus interacts
    with the computer through handwriting recognition software.


    Handwriting recognition software translates handwritten notes into a form that
    the system unit can process.


