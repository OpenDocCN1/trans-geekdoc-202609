  md: '# Making IT work for you


    # TV TUNERS


    Do you already use a DVR (digital video recorder) in order to record your favorite
    TV shows? Although many cable and satellite companions offer this device, did
    you know that Windows Media Center can perform the same function? All you need
    is a device called a TV tuner that connects your antenna or cable to your computer.
    Below are the steps to turn your Windows-based computer into a DVR.


    Installing a TV Tuner A TV tuner is essentially a piece of hardware that allows
    your computer to process and display a cable or TV signal. Although some (usually
    pricey) PCs may include this technology, it is usually necessary to purchase it
    separately. The easiest ones to install are connect externally to a USB port,
    such as the Aver Hybrid Volar Max.


    +   Plug the TV tuner into an available USB port on your computer.


    +   Connect a coaxial cable directly from over-the-air antenna to the back of
    the TV tuner. If Windows does not automatically install the tuner, consult the
    user manual for instructions.


    +   Start Windows Media Center.


    +   With your TV tuner installed, it will guide you through a setup process, including
    a long scan for all channels from your cable or antenna.


    ![](img/17527690010086a83ec3d8f3ee262703_165_0.png)


    Using Media Center This utility is included with all recent versions of Windows.
    Although it contains many tools to manage your music, photos, and movies, we focus
    on its DVR capabilities for TV and cable.


    +   Once setup is complete, click the TV option from the main menu.


    +   Click Guide, and scroll up/down and left/right until you find a show you wish
    to record.


    +   Right-click the show, and choose Record from the menu.


    +   To play back a recorded show, choose Recorded TV from the TV menu, and click
    the show you wish to play back.


    +   Once you have watched a recording, choose the Delete option to free space
    on your hard drive. The number of hours you can record is limited by your available
    hard drive space.


    ![](img/17527690010086a83ec3d8f3ee262703_165_1.png)


    If you have a high-speed network and several PCs in your home, you will have the
    capability to watch the recorded shows via Media Center''s streaming ability.
    The web is continuously changing, and some of the features presented in this Making
    IT work for You may have changed.


    To learn about other ways to make information technology work for you, visit our
    website at www.computing2014.com and enter the keyword min.'
