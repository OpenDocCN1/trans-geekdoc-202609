- pgno: 190
  md: '**Dot (pixel pitch)** is the distance between each pixel. Most modern monitors
    have a dot pitch of 0.31 mm (31/1000th of a millimeter) or less. The lower the
    dot pitch (the shorter distance between pixels), the clearer the images produced.


    **Contrast ratios** indicate a monitor''s ability to display colors. It compares
    the intensity of the brightest white to the darkest black. The higher the ratio,
    the better the monitor. Good monitors typically have contrast ratios between 500:1
    and 2000:1.


    **Size, or active display area**, is measured by the diagonal length of a monitor''s
    viewing area. Common sizes are 15, 17, 19, 21, and 24 inches.


    **Aspect ratio** is determined by the width of a monitor divided by its height.
    The most common aspect ratio for standard monitors (similar to traditional television
    pictures) is 4:3. The most common aspect ratios for wide-screen monitors are 16:9
    and 16:10.


    # Flat-Panel Monitors


    Flat-panel monitors are the most widely used type of monitor today. Compared to
    other types, they are thinner, more portable, and require less power to operate
    (See 6-19). Most of today''s flat-panel monitors are **LCD (liquid crystal display)**.
    A characteristic of LCD technology is that the monitors are backlit, meaning a
    common source of light is dispersed over all the screens. There are many variations
    of LCD displays, most common for monitors today are TFT-LC (thin-film transistor
    liquid crystal) with each pixel independently producing a high-quality and energy-efficient
    display. **AMOLED (active-matrix light-emitting diode)** a newer technology and
    is increasingly widely used. Compared to LCD, AMOLED has the benefits of lower
    power consumption and longer battery life, as well as possibilities for thinner
    displays.


    ![](img/17527690010086a83ec3d8f3ee262703_190_0.png)


    # E-Readers


    **E-books (electronic books)** are traditional printed books in electronic format.
    These books are available from numerous sources including public and private libraries,
    bookstores, and the cloud. **E-book readers (e-readers)** are dedicated mobile
    devices for storing and displaying e-books and other electronic media including
    electronic newspapers and magazines.


    E-book readers have displays that are typically 6 inches, are limited to black
    and white, and use a technology like e-ink. **E-ink** produces images that reflect
    light like ordinary paper, making the display easy to read. Two well-known e-readers
    are Amazon''s Kindle and Barnes & Noble''s Simple Touch. Tablets can also display
    e-books. They are larger, heavier, and more expensive than e-readers. They are
    also much more flexible, with displaying e-books being only one of their number
    of applications. Unlike dedicated e-book readers, tablets use LCD displays for
    crisp, colorful images, however, that are difficult to read in bright light due
    to their reflective nature. Two well-known traditional tablets are Apple''s iPad
    and Samsung''s Galaxy Tab.


    To learn more about e-books, Making IT Work for You: E-books, on page 164.


    ![](img/17527690010086a83ec3d8f3ee262703_190_1.png)


    > Explorations: AMOLED is is just one type of LCD (light-emitting diode). To learn
    more about various LCD technologies for monitors and TVs, visit our website at
    www.computing2014.com and enter the keyword: led.


