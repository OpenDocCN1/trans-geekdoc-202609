  md: '![](img/17527690010086a83ec3d8f3ee262703_253_0.png)


    Figure 8-19 Tree network


    ![](img/17527690010086a83ec3d8f3ee262703_253_1.png)


    Figure 8-20 Mesh network


    when then passes the message along to the intended recipient. The star network
    is the most widely used network topology today. It is applied to a broad range
    of applications from small networks in the home to very large networks in major
    corporations.


    +   **Tree network**—each device is connected to a central node, either directly
    through one or more other devices. The central node is connected to two or more
    subordinate nodes that in turn are connected to other subordinate nodes, and so
    forth, forming a treelike structure (See Figure 8-19). This network, also known
    as a hierarchical network, is often used to share corporate data.


    +   **Mesh network**—this topology is the newest type and does not use a specific
    physical layout (each as a star or a tree). Rather, the mesh network requires
    that each node have more than one connection to the other nodes (See Figure 8-20).
    The resulting patterns form the appearance of a mesh. If between two nodes are
    somewhat disrupted, data can be automatically rerouted around the failure using
    another path. Wireless technologies are frequently used to build mesh networks.


    # Strategies


    Every network has a strategy, or way of coordinating the information and resources.
    Two of the most common network strategies are client/server and peer-to-peer.


    ![](img/17527690010086a83ec3d8f3ee262703_253_2.png)


    **Client/server networks** use central computers to coordinate and supply services
    to other nodes on the network. The server provides access to resources such as
    web pages, databases, software, and hardware. (See Figure 8-21.) This strategy
    is based on specialization. Server nodes coordinate and supply specialized services,
    and client nodes request the services. Commonly used operating systems are Windows
    Server, Mac OS X, Linux, and Solaris.


    wide used on the Internet. For example, each time you open a web browser, your
    computer (the client) sends out a request for a specific web page. This request
    is routed over the Internet to a server. This server locates and sends the requested
    material back to your computer.


    Figure 8-21 Client/server network


    226 CHAPTER 8'
