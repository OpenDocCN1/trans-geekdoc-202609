    # # Network Architecture


    **Network architecture** describes how a network is arranged and how resources
    are coordinated and shared. It encompasses a variety of different network specifications,
    including network topologies and strategies. Network topology describes the physical
    arrangement of the network. Network strategies define how information and resources
    are shared.


    **Topologies**


    A network can be arranged or configured in several different ways. This arrangement
    is called the network''s **topology**. Five of the most common topologies are
    ring, bus, star, tree, and mesh.


    +   * **Bus network**—each device is connected to a common cable called a *bus*
    backbone, and all communications travel along this bus.

    * **Ring network**—each device is connected to two other devices, forming a ring.
    (See Figure 8-17.) When a message is sent, it is passed around the ring until
    it reaches the intended destination.

    * **Star network**—each device is connected directly to a central network switch.
    (See Figure 8-18). Whenever a node sends a message, it is routed to the switch,


    ![](img/17527690010086a83ec3d8f3ee262703_252_0.png)


    Figure 8-17 Ring network


    Figure 8-18 Star network


