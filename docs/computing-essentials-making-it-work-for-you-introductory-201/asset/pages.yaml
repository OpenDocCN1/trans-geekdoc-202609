  img_proc: true
- pgno: 82
  md: '# SEARCH TOOLS


    # ELECTRONIC COMMERCE


    ![](img/17527690010086a83ec3d8f3ee262703_82_0.png)


    Search services maintain huge databases relating to website content. Spiders are
    programs that update these databases.


    ![](img/17527690010086a83ec3d8f3ee262703_82_1.png)


    # Search Engines


    Search engines are specialized programs to locate information. To use, enter a
    keyword or phrase or a list of hits with links to references displayed.


    Electronic commerce, or e-commerce, is the buying and selling of goods over the
    Internet. Three basic types of e-commerce are business-to-business, consumer-to-consumer,
    and consumer-to-business.


    # Specialized Search Engines


    Specialized search engines focus on subject-specific websites.


    +   - Business-to-consumer (B2C) commerce involves sales from business to the
    general public. It is the fastest-growing type. Three of the widely used applications
    are online banking, financial trading, and shopping.

    - Consumer-to-consumer (C2C) commerce involves sales between individuals, or as
    the electronic version of classified ads or online. Web auctions are similar to
    traditional auctions except buyers and sellers rarely, if ever meet to face.

    - Business-to-business (B2B) commerce involves sales from one business to another,
    typically by a manufacturer-supplier relationship.


    # Content Evaluation


    To evaluate the accuracy of information found on the web, consider the following:


    +   - Authority. Is the author an expert? Is the site official or does it represent
    one individual''s or organization''s opinion?

    - Accuracy. Has the information been reviewed? Does the site provide a method
    to report inaccurate information?

    - Objectivity. Is the information factual or does the author have a bias? Does
    the author have a personal agenda to conform or form a reader''s opinion?

    - Currency. Is the information up to date? Does the site specify when information
    is updated? Are the site''s links operational?


    # Security


    The greatest challenges for e-commerce are the development of


    +   - Safe, secure payment methods. Two types are secure credit cards and digital
    cash (third party sells digital cash to buyers and readers for sellers).

    - Convenient ways to provide required information such as mailing addresses and
    credit card information.


