  md: '# Power Supply


    Computers require direct current (DC) to power their electronic components and
    to represent data and instructions. DC power can be provided indirectly by converting
    alternating current (AC) from standard outlets or directly from batteries.


    +   - Desktop computers have a power supply unit within the system unit (See Figure
    5-20). This unit plugs into a standard wall outlet, converts AC to DC, and provides
    the power to drive all of the system unit components.

    - Notebooks and tablets use AC adapters that are typically located outside the
    system unit (See Figure 5-21). AC adapters plug into a standard wall outlet, convert
    AC to DC, provide power to drive the system unit components, and these computers
    can be operated either using an AC adapter plugged into a wall outlet or using
    battery power. Their batteries typically provide sufficient for 9 to 10 hours
    before they need to be recharged.

    - Like notebooks and tablets, netbooks and handheld computers use AC adapters
    located outside the system unit. Unlike notebooks and handheld computers typically
    operate only using battery power. The AC adapter is used to recharge the batteries.


    Does your laptop seem to be losing its charge sooner than you used to? Batteries
    lose power over time; however, you can take steps to slow down the aging.


    +   1. Balance adapter and battery usage. The best practice is to use the laptop
    on battery power for a little while draining it completely (50 percent charge,
    for example), followed by charging it back to 100 percent. Modern batteries should
    not be drained to 0 percent each day.

    2. Calibrate. Your laptop''s manufacturer will recommend that you calibrate, or
    reset, your battery few months. Follow its guidelines on the web or in your instruction
    manual, as it will ensure that the battery meter in your operating system is accurate
    and you are getting the expected charge time.

    3. Avoid extreme. High temperatures can accelerate the deterioration of modern
    batteries. Avoid exposure to excessive heat and consider purchasing a laptop cooler
    or fan.

    4. Proper storage. If you are not going to use your laptop for a few weeks, most
    manufacturers recommend that you remove the battery.


    To see other tips, visit our website at www.computing2014.com and enter the keyword
    tips.


