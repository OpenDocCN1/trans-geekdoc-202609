    # Software


    Software, as we mentioned, is another name for programs. Programs are the instructions
    that tell the computer how to process data into the form you want. In most cases,
    the words software and programs are interchangeable. There are two major kinds
    of software: system software and application software. You can think of application
    software as the kind you use. Think of system software as the kind you use.


    # System Software


    The user interacts primarily with application software. System software enables
    the application software to interact with the computer hardware. System software
    is “background” software that helps the computer manage its own internal resources.


    System software is not a single program. Rather it is a collection of programs,
    including the following:


    +   - Operating systems are programs that coordinate computer resources, provide
    an interface between users and the computer, and run applications. Microsoft''s
    Windows 8 and Apple''s Mac OS X are two of the best-known operating systems for
    today''s computer users. (See Figures 1-5 and 1-6).


    +   - Utilities perform specific tasks to managing computer resources. One of
    the most essential utility programs that every computer system should have an
    antivirus program. These programs protect your computer system from viruses or
    malicious programs that are all too often upon computer from the Internet. These
    programs can damage software and hardware, as well as compromise the security
    and privacy of your personal data. If your computer does not have an antivirus
    program installed on it, you need to get one. To see how you can install a free
    antivirus program on your computer, Making IT Work for You: Installing a Free
    Antivirus Program on page 10.'
