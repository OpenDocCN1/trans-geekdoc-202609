    # Virtual Reality Headgear and Gloves


    New advances in virtual reality computer software can take us to simulated worlds
    that allow us to participate in potentially unethical situations that would probably
    not be in the real world. Some people worry spending extended time in a virtual
    reality environment can be harmful, even dangerous. For example, if participants
    choose to live in a violent game world, will the virtual experience engage them
    so much that it dehumanizes them and makes them unable to cope with the laws of
    the real world? What do you do? To see more ethical issues, visit our website
    at www.computing2014.com and enter the keyword ethics.


    Virtual reality (VR) is an artificial, or simulated, reality created in 3-D computers.
    It strives to create a virtual or immersive experience by using specialized hardware
    that includes headgear and gloves. (See Figure 6-30).


    The headgear has earphones and three-dimensional stereoscopic screens. The gloves
    have sensors that collect data about your hand movements. Coupled with software,
    this interactive sensory experience lets you immerse yourself in a computer-generated
    world.


    There are any number of possible applications for virtual headgear and gloves.
    The ultimate recreational might be something resembling a giant virtual amusement
    park. More serious applications can simulate important experiences or training
    environments, such as in aviation, surgical operations, space-repair, or nuclear
    disaster cleanup.


