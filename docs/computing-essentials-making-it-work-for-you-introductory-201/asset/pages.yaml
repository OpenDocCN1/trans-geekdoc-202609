  md: '# Networks


    A computer network is a communication system that connects two or more computers
    so that they can exchange information and share resources. Networks can be set
    up in different arrangements to suit users'' needs. (See Figure 8-13.)


    # Terms


    There are a number of specialized terms that describe computer networks. The terms
    include


    +   * Node—any device that is connected to a network. It could be a computer,
    printer, or data storage device.


    +   * Client—a node that requests and uses resources available from other nodes.
    Typically, a client is a user''s micro.


    +   * Server—a node that shares resources with other nodes. Dedicated servers
    specialize in performing specific tasks. Depending on the specific task, they
    may be called an application server, communication server, database server, file
    server, printer server, or web server.


    ![](img/17527690010086a83ec3d8f3ee262703_248_0.png)'
  merge: -1
  img_proc: true
- pgno: 249
  md: '+   * Directory server—a specialized server that manages resources, such as
    user accounts, for an entire network.

    * Host—any computer system that can be accessed over a network.

    * Router—a node that forwards or routes data packets from one network to their
    destination in another network.

    * Switch—central node that coordinates the flow of data by sending messages between
    sender and receiver nodes. A hub previously filled this purpose by sending a received
    message to all connected nodes, rather than just the intended node.

    * Network interface cards (NIC)—discussed in Chapter 5, these are expansion cards
    located within the system unit that connects the computer to a network. Sometimes
    referred as a LAN adapter.

    * Network operating systems (NOS)—control the activities of all computers and
    other devices on a network. These activities include electronic communication
    and the sharing of information and resources.

    * Network administrator—a computer specialist responsible for efficient network
    operations and implementation of new networks.


    A network may consist only of microcomputers, or it may integrate microcomputers
    or other devices with larger computers. Networks can be controlled by all nodes
    working together equally or by specialized nodes coordinating and supplying all
    resources. Networks may be simple or complex, self-contained or dispersed over
    a large geographic area.


    # concept check


    +   * What is a computer network? What are nodes, clients, servers, directory
    servers, hosts, and switches?

    * What is the function of an NIC and an NOS?

    * What is a network administrator?


    # Network Types


    Clearly, different types of channels—wired or wireless—allow different kinds of
    networks to be formed. Telephone lines, for instance, may connect equipment within
    the same building or within a home. Networks may also be citywide and international,
    using both cable and wireless connections. Local area, metropolitan area, and
    wide area networks are distinguished by the geographic area they serve.


    # Local Area Networks


    Networks with nodes that are in close physical proximity—within the same building,
    for instance—are called local area networks (LANs). Typically, LANs span distances
    less than a mile and are owned and operated by individual organizations. LANs
    are widely used by colleges, universities, and other types of organizations to
    link microcomputers and share printers and other resources. For a simple LAN,
    see Figure 8-14.


    The LAN represented in Figure 8-14 is a typical arrangement and provides two benefits:
    economy and flexibility. For instance, the four microcomputers share the laser
    printer and the file server, which are expensive pieces of hardware. Other equipment
    or nodes may also be added to


