  md: '# # Introduction


    ![](img/17527690010086a83ec3d8f3ee262703_151_0.png)


    Why are some microcomputers more powerful than others? The answer lies in three
    words: speed, capacity, and flexibility. After this chapter, you will be able
    to judge how fast, powerful, and versatile a particular microcomputer is. As you
    might expect, this knowledge is valuable if you are planning to buy a new microcomputer
    system or upgrade an existing system.(The Computer Buyer''s Guide at the end of
    this book provides additional information.) This knowledge will help you evaluate
    whether or not an existing microcomputer system is powerful enough for today''s
    new and exciting applications. For example, with the right hardware, you can use
    your computer to watch TV and video clips for class presentations.


    Sometimes you might get the chance to watch when a technician opens up a microcomputer.
    You will see that it is basically a collection of electronic circuitry. There
    is no need to understand how all these components work, but it is important to
    understand how a powerful microcomputer is. Once you you will be able to judge
    whether it can run particular kinds of programs and can meet your needs as a user.


    Hi, I''m Liz, and I''m a computer technician. I''d like to talk with you about
    the different types of systems for microcomputers. I''d also like to talk about
    various electronic components that make your computer work.


    Competent end users need to understand the functionality of the basic components
    in the system unit, including the system board, microprocessor, memory, expansion
    slots and cards, bus, ports, cables, and power supply units.


    # # System Unit


    **The system unit**, also known as the system chassis, is a container that houses
    most of the electronic components that make up a computer system. At one time
    all system units were in a separate set. Advances in the miniaturization of electronic
    components, however, have led to smaller and smaller computers with system units
    that share contains with other parts of the computer system.


    As we have discussed, there are four microcomputer types: desktop, notebook, tablet,
    and handheld. Each has a unique type of system unit.


    # **Desktops**


    This is the most powerful type of microcomputer. **Desktops** have their system
    unit in a separate case. This case contains their electronic components and selected
    storage devices. Input and output devices, such as a mouse, keyboard, and monitor,
    are located outside the system unit. This type of system unit is designed to be
    placed either horizontally or vertically. Desktop system units that are placed
    vertically are referred to as a *tower* or tower computer.


    Some desktops, like Apple''s iMac, have their monitor and system unit together
    in the same case. These computers are known as an all-in-one. (See Figure 5-1.)


    # **Notebooks**


    Although not as powerful as desktops, **notebooks** are portable and much smaller.
    Their system units are housed with selected secondary storage devices


