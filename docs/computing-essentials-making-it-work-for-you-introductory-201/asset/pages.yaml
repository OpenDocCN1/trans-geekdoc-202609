- pgno: 123
  md: '# Introduction


    When most people think about computers, they think about the web, creating reports,
    analyzing data, storing information, making presentations, and any number of other
    valuable applications. We typically think about applications and computer software.
    Computers and computer applications have become a part of the fabric of our-day
    lives. Most of us agree that they are great ... as long as they are working.


    ![](img/17527690010086a83ec3d8f3ee262703_123_0.png)


    We usually do not think about the mundane and behind-scenes computer activities:
    loading and running programs, organizing files, protecting our computers from
    viruses, performing periodic maintenance to avoid problems, and controlling hardware
    devices so that they can communicate with one another. Typically, these activities
    go behind the scenes without our help.


    Hi, I''m Amy, and I''m a computer support specialist. I''d like to talk to you
    about software, programs that do a lot of our work behind the scenes so you can
    run applications and surf the web. I''d also like to talk about the mobile operating
    systems that control smartphones and other small portable computers.


    That is why it is, and the way it is, as long as everything is working perfectly.
    But what if new programs are not compatible with our current computer system?
    What if we get a virus? What if our disk fails? What if we buy a new digital camera
    and can''t store and edit the images on our computer system? What if our computers
    run slower and slower?


    These issues may seem mundane, but they are critical. This chapter covers the
    vital activities that go on behind the scenes. A little knowledge about these
    activities can go a long way in making your computing life easier. To effectively
    use computers, competent users need to understand the functionality of system
    software, including operating systems, utility programs, and device drivers.


    # System Software


    End users use application software to accomplish specific tasks. For example,
    we use word processors to create letters, documents, and reports. However, end
    users also use system software. System software works to handle the majority of
    technical details. For example, system controls how a word processing program
    is stored in memory, how commands are converted so that the system unit can process
    them, and where a completed document or file is saved. See Figure 4-1.


    System software is not a single program. Rather it is a collection or set of programs
    that handle hundreds of technical details with little or no user intervention.
    System software consists of four types of programs:


    +   - Operating systems coordinate computer resources, provide an interface between
    users and the computer, and run applications.


    +   - Utilities perform specific tasks related to managing computer resources.


    +   - Device drivers are specialized programs that allow particular input or output
    devices to communicate with the rest of the computer system.


    +   - Language translators convert the programming instructions written by programmers
    into a language that computers understand and process.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '![](img/17527690010086a83ec3d8f3ee262703_124_0.png)


    Figure 4-1 System software handles technical details


    # # Operating Systems


    An operating system is a collection of programs that handle many of the technical
    details related to using a computer. In many ways, an operating system is the
    most important type of computer program. Without a functioning operating system,
    your computer would be useless.


    Functions


    Every computer has an operating system and every operating system performs a variety
    of functions. These functions can be classified into three groups:


    +   * **Managing resources:** Operating systems coordinate all the computer resources
    including memory, processing, storage, and devices such as printers and monitors.
    They also monitor system performance, schedule tasks, provide security, and start
    up the computer.


    +   * **Providing user interface:** Operating systems allow users to interact
    with application programs and computer hardware through a **user interface**.
    Many older operating systems used a character-based interface in which users communicated
    with the operating system through written commands such as


    +   / "Copy A: assign.doc C". Almost all newer operating systems use a **graphical
    user interface (GUI)**. As we discussed in Chapter 3, a graphical user interface
    uses graphical elements such as icons and windows.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# environment


    Did you know that some operating systems help protect the environment? Recent
    versions of Microsoft Windows operating system have various power management features
    that reduce energy consumption. For example, Windows will dim your screen and
    put your computer in sleep. The Energy Star program from Environmental Protection
    Agency estimates that you can save up to $50 in electricity costs per year and
    reduce carbon emissions that affect the environment. To see more environmental
    facts, visit our website at www.computing2014.com and enter the keyword environment.


    +   * Running applications: Operating systems load and run applications as word
    processors and spreadsheets. Most operating systems support multitasking, or the
    ability to switch between different applications stored in memory. With multitasking,
    you could have Word and Excel running at the same time and switch easily between
    the two applications. The program that you are currently operating is described
    as running in the foreground.


    # Features


    Starting or restarting a computer is called booting the system. There are two
    ways to boot a computer: a warm boot and a cold boot. A warm boot occurs when
    the computer is already on or you restart it without turning off the power. A
    warm boot can be achieved in several ways. For many computer systems, it can be
    restarted by simply pressing a sequence of keys. Starting a computer that has
    been turned off is called a cold boot. To learn more about booting your computer
    system and self-test, visit our website at www.computing2014.com and enter the
    keyword.


    You typically interact with the operating system through the graphical interface.
    Most a place, called the desktop, provides access to computer resources. (See
    Figure 4-2) Operating systems have several features in common with application
    programs, including


    +   * Icons—graphic representations for a program, type of file, or function.
    Pointercontrolled by a mouse, touchpad, or touch screen, the pointer changes shape
    depending on its current function. For example, when shaped like an arrow, the
    pointer can be used to select items such as an icon.


    ![](img/17527690010086a83ec3d8f3ee262703_125_0.png)


    Figure 4-2 Desktop'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'Windows—rectangular areas for displaying information and running programs.


    +   - Menus—provide a list of options or commands.


    +   - Tabs—divide menus into major activity areas.


    +   - Dialog boxes—provide information or request input.


    +   - Help—provides online assistance for operating system functions and procedures.


    +   - Gesture control—ability to control operations with finger movements, such
    as swiping, sliding, and pinching.


    Most operating systems store data and programs in a system of files and folders.
    Files are used to store data. Related files are stored within a folder, and for
    organizational purposes a folder can contain other folders. For example, you might
    organize your electronic files in the Documents folder on your hard disk. This
    folder could contain other folders, named to identify its contents. One might
    be "Computer Class" and could contain all the files you created (or we will create)
    for this course.


    # Categories


    While there are hundreds of different operating systems, there are only three
    basic categories: embedded, network, or stand-alone.


    +   - Embedded operating systems are used for handheld devices such as smartphones,
    cable and satellite television boxes, video game systems, and other small electronics.
    (See Figure 4-3) The entire operating system is stored within or embedded in the
    device.


    +   - Network operating systems (NOS) are used to control and coordinate computers.
    Many networks are small and connected together. Only a limited number of microcomputers.
    Other networks, like those at colleges and universities, are large and complex.
    These networks may include other networks and typically connect a variety of different
    types of computers.


    Network operating systems are typically located on one of the connected computers''
    hard disks. Called the network server, this computer coordinates all communication
    between the other computers. Popular operating systems include Linux, Windows
    Server, and UNIX.


    +   - Stand-alone operating systems, also called desktop operating systems, control
    a single desktop or notebook computer (See Figure 4-4). These operating systems
    are located on the computer''s hard disk. Often desktop computers and notebooks
    are part of a network. In these cases, the desktop operating system works with
    the network to share and coordinate resources. In these situations, the desktop
    operating system is referred to as the client operating system


    The operating system is referred to as the software platform. Almost all application
    programs are designed to run with a specific platform. For example, Apple''s iMovie
    software is


