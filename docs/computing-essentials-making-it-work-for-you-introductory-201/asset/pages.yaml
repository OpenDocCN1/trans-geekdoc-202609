    What are the advantages and disadvantages of social media? Do you use social media?
    If so, what do you post? Have you ever posted something on social media that you
    regretted? |

    | EXPLORATION: DIGITAL WALLETS |

    | Digital wallets are used to pay for clothes, groceries, and more. Discuss the
    features of digital wallets on pages 26 and 27 and how they relate to your daily
    life. How has technology changed the way you spend money? What are the advantages
    and disadvantages of digital wallets? Do you use digital wallets? If so, what
