  img_proc: true
- pgno: 295
  md: 'To be a competent end user, you need to be aware of the potential impact of
    technology on people. You need to be sensitive and knowledgeable about personal
    privacy, organizational security, and ethics.


    # SECURITY


    # SECURITY


    ![](img/17527690010086a83ec3d8f3ee262703_295_0.png)


    Security Response

    Our cyber research around the world prevent unauthorized analysis of and protection
    from IT security threats that include malware, security, vulnerabilities, and
    spam.


    ![](img/17527690010086a83ec3d8f3ee262703_295_1.png)


    Computer security focuses on protecting information, hardware, and software from
    unauthorized use as well as preventing damage from intrusions, sabotage, and natural
    disasters. Those who gain unauthorized access to computers that contain information
    about us is commonly known as a computer hacker. Not all hackers are intent on
    malicious actions and not all are criminals.


    # Cybercrime


    Cybercrime (computer crime) is an illegal action involving special knowledge of
    computer technology.


    +   * Malicious programs (malware) includes viruses (the Computer Fraud and Abuse
    Act makes spreading a virus a federal offense), worms, and Trojan horses. These
    are remotely infected computers for malicious purposes. A collection of zombie
    computers is known as a botnet, or robot network.

    * Denial of service (DoS) attack is an attempt to shut down a computer system
    or network. It floods a computer with network requests for information. Scams
    are designed to trick spending their time and money with little or no return.
    Internet scams cause identity theft, chain letters, auction fraud, vacation prizes,
    and fee loans. These are frequently coupled with phishing websites or e-mails.


    +   * Social networking risks include posting work-related criticisms and disclosure
    of personal information.

    * Cyberbullying is the use of the Internet, cell phones, or other devices to send
    or post content intended to embarrass another person.

    * Rogue Wi-Fi hotspots imitate legitimate hotspots to capture personal information.

    * Theft takes many forms including stealing hardware, software, data, and time.
    Data manipulation involves changing or data. The Computer Fraud and Abuse Act
    protects against data manipulation.


    # Measures to Protect Computer Security


    There are many ways in which computer systems and data can be compromised and
    many ways to protect computer security. These measures include


    +   * Access is restricted through biometric scanning devices and passwords (secret
    words or phrases); attackers use thousands of words to attempt to gain access).

    * Encryption is coding to make it unacceptable to those who have the encryption
    key. Virtual private networks (VPNs) encrypt connections between networks and
    remote users. WPA2 (Wi-Fi Protected Access) is the most used wireless network
    encryption for home wireless networks.

    * Anticipating attacks involves physical security, data security, and disaster
    recovery plans.

    * Preventing data loss involves protecting data by screening job applications,
    guarding passwords, and auditing and backing up data.


