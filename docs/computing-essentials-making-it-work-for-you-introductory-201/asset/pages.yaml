  md: '# The Evolution of the Computer Age


    Many of you probably can''t remember a world without computers, but for some of
    us, computers were virtually unknown when we were born and have rapidly come of
    age during our lifetime.


    Although there are many predecessors to what we think of the modern computer—reaching
    as far back as the 18th century, when Marie Jacquard created a loom program to
    weave cloth and Charles Babbage designed the first modern computer (which he could
    never get to work on)—the computer age did not really begin until the first computer
    was made available to the public in 1951.


    The modern age of computers spans until now which is typically broken into five
    generations more than 60 years (so far), Each generation has been marked by a
    significant advance in technology.


    +   * **First Generation (1951-57):** During the first generation, computers were
    built with vacuum tubes—made of glass and were about the size of lightbulbs.


    +   * **Second Generation (1958-63):** This generation began with the first computers
    built with transistors—small devices that transfer electronic signals across resistor.
    Because transistors are much smaller, use less power, and create less heat than
    vacuum tubes, the new computers were faster, smaller, and more reliable than the
    first-generation machines.


    +   * **Third Generation (1964-69):** In 1964, computer manufacturers began replacing
    transistors with integrated circuits. An integrated circuit (IC) is a complete
    electronic circuit on a small chip made of silicon (one of the most abundant elements
    in the earth''s crust). These computers were more reliable and compact than computers
    made with transistors, and they cost less to manufacture.


    +   * **Fourth Generation (1970-90):** Many key advances were made during this
    generation, the most significant being the microprocessor—a specialized chip developed
    for computer memory and logic. Use of a single chip to create a smaller “personal”
    computer (as well as digital widgets, calculators, copy machines, and so on) revolutionized
    the computer industry.


    +   * **Fifth Generation (1991–present):** Our current generation has been referred
    to as the “Connected Generation” because of the industry''s effort to increase
    the connectivity of computers. The rapidly expanding Internet, World Wide Web,
    and intranets have created an information highway that enabled both computer professionals
    and home computer users to communicate with others across the globe.


    This appendix provides you with a timeline that describes in more detail some
    of the most significant events in each generation of the computer age.


