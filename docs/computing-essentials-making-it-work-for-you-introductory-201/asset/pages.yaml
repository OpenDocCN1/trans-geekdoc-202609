- pgno: 164
  md: '# Standard Ports


    Most desktop and notebook microcomputers with a standard set of ports for connecting
    a monitor, keyboard, and other peripheral devices. The most common ports include


    +   - VGA (Video Graphics Adapter) and DVI (Digital Video Interface) ports provide
    connections to analog and digital monitors, respectively. DVI has the most commonly
    used standard, but VGA ports are still provided on almost all systems for compatibility
    with older/lower-cost monitors.

    - Universal serial bus (USB) ports can be used to connect several devices to the
    system unit and are widely used to connect keyboards, mice, printers, storage
    devices, and a variety of specialty devices. One device, a TV tuner card, allows
    users to view and record televisions. To learn how you can use a TV tuner, see
    Making IT Work for You: TV Tuners on page 138. A single USB port can be used to
    connect USB devices to the system unit.

    - FireWire ports provide high-speed connections to specialized FireWire devices
    such as camcorders and storage devices.

    - Ethernet ports are a high-speed networking port that has become a standard for
    of of today'' computers. Ethernet allows you to connect multiple computers for
    sharing files, or to a DSL or cable modem for high-speed internet access.


    # Specialized Ports


    In addition to standard ports, there are numerous specialty ports including eSATA,
    HDMI, MIDI, MiniDP, and S/PDF.


    +   - External Serial Advanced Technology Attachment (eSATA) ports provide very-high-speed
    connections for external hard drives, optical disks, and other large secondary
    storage devices.

    - High Definition Multimedia Interface (HDMI) ports provide high-definition video
    and audio, making it possible to use a computer as a video jukebox or an HD video
    recorder.

    - Mini DisplayPort (MiniDP or mDP) ports are an audiovisual port typically used
    to connect large monitors. These ports are used with many Apple Macintosh.

    - Musical instrument digital interface (MIDI) ports are a special type of port
    for connecting musical instruments like an electronic keyboard to a sound card.
    The sound card converts the music into a series of digital instructions. These
    instructions can be processed immediately to reproduce the music or saved to a
    file for later processing.

    - Sony/Philips Digital Interconnect Format (S/PDF) ports are also known as optical
    audio connections. These ports are used to integrate computers with high-end audio
    and home theater systems.


    # Cables


    Cables are used to connect exterior devices to the system unit via the ports.
    One end of the cable is attached to the device and the other end is attached to
    a connector on the port. (See Figure 5-19.)


    ![](img/17527690010086a83ec3d8f3ee262703_164_0.png)'
