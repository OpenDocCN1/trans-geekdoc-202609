  md: '# # Making IT work for you


    # ## EDITING


    Would you like a simple way to fix problems in your photos? Do you need a tool
    that can manage your images locally and on the cloud? Windows Photo Gallery is
    a free, easy-to-use photo editing and management program. Besides powerful photo-repairing
    features, it allows you to identify or "tag" people and places for easy searching
    in the future. In addition, it includes 7 GB of free online storage/backup using
    the Microsoft SkyDrive service.


    Installing the Software Windows Photo Gallery is a free download for Windows users.
    Some Windows users will find that they have it already. If not, follow these steps
    to install:


    +   - Go to http://www.microsoft.com, and type "photo gallery" in the search box.
    Click the first search result.

    - Click the Download Now button.

    - Follow the instructions to complete the installation


    Once installed, the software will scan your Pictures library (including My Pictures
    and Public Folders) for photos.


    Basic Photo Editing You should now see many of your photos in the center of the
    interface. Here are some of the common fixes your photos might need:


    +   - Double-click the photo that needs editing. The Edit tab of the ribbon is
    now active.

    - Rotate the left or Rotate right buttons to change the orientation of the photo.

    - Click the Crop button to remove an unwanted section of the photo. When the Crop
    window appears on top of your photo, move it around and resize it to include the
    section of the photo you want to keep. Press the Enter key to complete the crop.

    - Click the Red eye button to fix red eyes in photos. Simply drag the mouse pointer
    to surround the entire section of the person''s eye, and it is instantly fixed.

    - Click the Retouch button to activate a very powerful feature that can remove
    a blur or discoloration on a photo. It does this by using the surrounding area
    as a sample of what it should look like. Simply drag the mouse pointer to surround
    the problem area, and Photo Gallery will attempt to remove thelemish.


    ![](img/17527690010086a83ec3d8f3ee262703_102_0.png)'
  merge: -1
  img_proc: true
