  md: '# Making work for you


    # KEEPING YOUR COMPUTER COOLER


    Tablets and smartphones do not create significant heat. Desktop and tower system
    units are easy to cool because of the extens- space for fans and air circulation.
    Notebook computers, however, can present a challenge when it comes to cooling.


    Checking Processor Temperature Before explor- ing cooling solutions, it is useful
    to check how hot your processor () can become during various activities. HWMonitor
    is free, useful tool that checks the temperature of your CPU, your graphics processor,
    and various other parts of your computer.


    +   - HWMonitor (free version recommended) is available at www://cpuid.com/softwares/hwmonitor.html.


    +   - After installation, start HWMonitor, and observe the current temperatures,
    as well as minimum and maximum measured.


    +   - Be sure to try different activities, especially graphics-intensive ones
    (using gaming or video editing).


    Note that if your CPU has multiple process- ors, or cores, they will be listed
    separately. Your video processor(s) will also be listed sep-ately. Each processor
    model has a different maximum safe temperature, but generally speaking, temperatures
    over 75° Celsius could be for concern.


    ![](img/17527690010086a83ec3d8f3ee262703_154_0.png)'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'Laptop Coolers Although blowing cool air underneath your laptop can help lower
    the machine''s temperature, the most immediate beneficiary will be your legs.
    Before buying, consider the following:


    +   Will the cooling be comfortable on your lap, or will you have to buy a separate
    lap desk to support it?


    +   How many fans does it have, and how high is its CFM (cubic feet per minute)?


    +   Is the price too good to be true? If so, those units tend to have very cheap
    construction and poor circulation. Go with top brands, and read reviews carefully
    before making a decision.


    ![](img/17527690010086a83ec3d8f3ee262703_155_0.png)


    Thermal Paste The most challenging (and rewarding) way to cool a laptop is by
    applying a special thermal compound (or paste) between the processors and heat
    sink (the mechanism that dissipates heat from the processor). This task is usually
    done by a skilled technician or experienced computer troubleshooter. The paste
    helps transfer heat more efficiently, thereby expelling more heat through your
    laptop''s vents.


