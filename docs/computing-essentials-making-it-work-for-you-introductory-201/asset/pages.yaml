- pgno: 59
  md: '# Access


    The Internet and the telephone system are similar—you can connect a computer to
    the Internet like you connect a phone to the telephone system. Once you are on
    the Internet, your computer becomes an extension of what seems like a giant computer—a
    computer that branches over all the world. When provided with a connection to
    the Internet, you can use a browser to search for the web.


    # Providers


    The most common way to access the Internet is through an Internet service provider
    (ISP). The providers are already connected to the Internet and provide a path
    or connection for individuals to access the Internet. Your college or university
    likely provides you with free access to the Internet while you are on campus.


    The widely used commercial Internet service providers use phone lines, cables,
    and/or wireless connections. Some of the best-known browsers are AT&T, Comcast,
    Sprint, T-Mobile, and Verizon.


    As we will discuss in Chapter 8, users connect to ISPs using a variety of connection
    technologies including DSL, cable, and wireless methods.


    # Browsers


    Browsers are programs that provide access to web resources. This software connects
    to remote computers; opens and transfers files; displays text, images, and multimedia;
    and provides in one tool an uncomplicated interface to the Internet and web documents.
    Brows allow you to explore, or surf, the web by easily moving from one website
    to another. Four well-known browsers are Apple Safari, Google Chrome, Microsoft
    Explorer, and Firefox.


    For browsers to connect to resources, the location or address of the resources
    must be specified. These addresses use uniform resource locators (URLs). All URLs
    have at least two parts. (See Figure 2-3).


    +   - The first part denotes the protocol used to connect to the resource. As
    we will discuss in Chapter 8, protocols are used for exchanging data between computers.
    The http is used for web traffic and is the most widely used protocol.


    +   - The second part represents the domain name. It identifies the specific address
    where the resource is located. For example mvt.com (URLs have many parts specifying
    directory paths, file names, and pointers). The last part of the domain name following
    the (.) is the top-level domain (TLD). Also known as the web suffix, it identifies
    the type of organization. For example, .com indicates a commercial site. (See
    Figure 2-4).


    ![](img/17527690010086a83ec3d8f3ee262703_59_0.png)


    +   1 Bookmarks/Favorites Bar: Most browsers have bookmarks or favorites bar just
    below the address bar. Add your top 5 or 10 most visited websites. The time you
    want to visit one of these sites, select it from the bookmarks list rather than
    entering the site''s URL.


    +   2 Shortcuts: Keyboard shortcuts are often faster than using a mouse. Use the:
    F5 (refresh); (Ctrl+Alt+left back); (Ctrl+1 (new tab); (Ctrl+Enter) to add any
    name you type in the address bar.


    +   3 Add-Ons: Many browsers, such as Chrome and Firefox, allow you to install
    third-party programs that extend, or add to, the capabilities of the browser.
    These programs can perform a variety of tasks, from providing easy access to your
    cloud services to making it capture information on a web page.


    +   4 Configure: All browsers have settings pages with many time-saving options.
    For example, you can set all the web pages that open when you start your browser,
    or you can configure autocomplete options to help you fill out web forms.


    To see other tips, visit our website at www.computing2014 .com and enter the keyword
    tips.


    Once the browser has connected to the web, a document file is set save to your
    computer. This document typically contains Hypertext Markup Language (HTML), a
    markup language for


