    # Connection Devices


    At one time all computer communication was originally designed for voice transmission,
    telephones typically send and receive analog signals, which are contrast, Computers,
    send and receive digital signals. These represent the presence or absence of an
    electronic pulse—the on/off binary signals mentioned in Chapter 5. To convert
    the digital signals to analog signals and vice versa, you need a modem.


    # ## Modems


    The word modem is short for modulator-demodulator. Demodulation is the name of
    the process of converting from digital to analog. The modem enables digital microcomputers
    to communicate across different media, including telephone lines, cable lines,
    and radio waves.

    The speed with which modems transmit data varies. This speed, called transfer
    rate, is typically measured in millions of megabits per second (Mbps). (See Figure
    8-9.) The higher the speed, the faster you can send and receive information. For
    example, to download a full-length movie (700 MB) on a 1.5-Mbps modem would take
    about 1 hour. A 6.0-Mbps modem would take about 15 minutes. To learn more about
    transfer rates, visit our website at www.computing2024.com and enter the keyword
    rate.

    There are four common types of modems: telephone, DSL, and wireless.


    ![](img/17527690010086a83ec3d8f3ee262703_243_1.png)


