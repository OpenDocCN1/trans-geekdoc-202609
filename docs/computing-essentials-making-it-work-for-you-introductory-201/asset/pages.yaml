    Several organizations actively monitor privacy-related issues.


    To learn more about each organization, visit our website at www.comcomputing2014
    .com and enter the keyword privacy.


    # The Internet and the Web


    When you send e-mail on the Internet or browse the web, do you have any concerns
    about privacy? Most people do not. They think that as long as they are using their
    own computer and are selective about disclosing their names or other information,
    then little can invade their personal privacy. Experts call this illusion of anonymity
    the Internet.


    ![](img/17527690010086a83ec3d8f3ee262703_274_0.png)


    As discussed in Chapter eight, every computer is identified by a unique number
    as an IP address. IP addresses can be used to trace Internet activities to their
    origin, allowing security experts and law enforcement officers to investigate
    computer crimes by unauthorized access to networks or sharing files without permission.


    +   - Select favorites.


    When you browse the web, your browser stores critical information onto your hard
    disk, particularly without you being aware of it. This information, which records
    about your Internet activities, includes history and temporary files.


    ![](img/17527690010086a83ec3d8f3ee262703_274_1.png)


    +   - Select History.


    +   - History files include the locations, addresses, of sites that you have recently
    visited. This file can be displayed by your browser in windows, including the
    address bar (as you type) and the History bar. To view your browsing history using
    Internet Explorer 9, follow the steps in 9-6.

    - Temporary files, also known as the cache, contain web page content and instructions
    for displaying this content. When you visit a website, these files are saved by
    your browser. If you visit a site and return later, these files are used to quickly
    reread web content.


    Another way your activity is monitored is with cookies. Cookies are small data
    files are deposited on your hard disk by websites you visit. Based on your settings,
    these can be accepted or blocked (see Figure 9-7). Although you will generally
    not be aware that a website generates a cookie, the personalized experience you
    enjoy is often the result of these cookies. While cookies are harmless in themselves,
    they make a potential privacy risk that they store information about you, your
    preferences, and your browsing habits. The information stored depends on whether
    the cookie is a first-party or a third-party cookie.


    +   - A first-party cookie is one that is generated (and then read) only by the
    website you are currently visiting. Many websites use first-party cookies to store
    information about the current session, your general preferences, and your activity
    on the site. The intention of these cookies is to provide a personalized experience
    on a particular site. For example, when you revisit a particular electronic commerce
    site, a previously deposited cookie can provide information so that you can be
    greeted by name and presented with sales offers that interest you.


    ![](img/17527690010086a83ec3d8f3ee262703_274_2.png)


    Figure 9-6 Viewing history files


    Privacy, Security, and Ethics 247'
