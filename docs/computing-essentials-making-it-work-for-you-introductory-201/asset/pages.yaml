  md: '# Making IT work for you


    # REMOTE ACCESS


    Have you ever been using someone else''s computer and wished you could open a
    program installed on your home computer? Have you found yourself at school when
    you realized that you left an important file on your desktop? There are countless
    reasons why you may need full access to your computer when away from home, and
    LogMen provides a free way to do so.


    **Getting Started** To use this service, you need to have an account and a special
    piece of software on your home computer. You also need to have administrator privileges
    on your machine.


    +   - Go to www.logmein.com, and click the **Create an account** link on the right
    side.

    - Click the Access Computers remotely.

    - Enter your information in the form. Select the *Personal/Business* option.

    - Click **Continue**, and then proceed to download and install the software. By
    default, LogMein sets you up with a trial version of your Pro software. You can,
    however, continue using its free version until your expires.

    - Choose the Typical settings when asked during installation.


    When installation finishes, the LogMein software will automatically start. Your
    computer can now be accessed remotely.


    **Accessing your Computer** The LogMein software must be running on your home
    computer (which must be connected to the Internet) in order to access it from
    any other computer. All you need on the remote computer is a web browser and an
    Internet connection.


    +   - On the remote computer, go to www.logmein.com and log into your account.
    You will be taken to LogMein Central, which is a console that is used to manage
    all the computers connected to your account.

    - Find your computer in the list, and click it in order to start the connection.
    Depending on which web browser you use, you may be prompted to install a plug-in.
    This step is optional, since it is possible to use Java for the remote session.

    - Enter your user name and password for your remote machine. Since you are logging
    into Windows or Mac OS, you must enter your credentials exactly as you were sitting
    in front of your computer.


    You are now logged into your computer. You can move around, click, and type if
    you were sitting in front of it. You can also move outside this area to access
    your web browser and some options from the LogMein interface. The **Disconnect**
    button on the left side to the screen ends.

    The web is continually changing, and some of the specifics presented in this Making
    IT Work for You may have changed.

    To learn about other ways to make information technology work for you, visit our
    website at www.computing2014.com and enter the keyword `miw`.


