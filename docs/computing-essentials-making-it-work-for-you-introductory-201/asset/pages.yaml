  md: '# connect with LearnSmart


    Less Managing. More Teaching. Greater Learning.


    Connect CIT is an online assignment and assessment solution that contains powerful
    exercises that go beyond simple skill and drill but instead allow students to
    apply what they have learned for greater success. McGraw-Hill Connect CIT prepares
    students for their future by enabling faster, efficient learning and higher retention
    of knowledge. Connect CIT also offers instructors a number of powerful tools and
    features to make managing assignments easier. Additionally, Connect Plus CIT includes
    a media-rich eBook that allows you to share your notes with students. Using an
    ebook with Connect Plus CIT gives your students a complete digital solution that
    allows them to access their materials from any computer.


    # LearnSmart


    No two students are alike, McGraw-Hill LearnSmart is an intelligent learning system
    that uses a series of adaptive questions to pinpoint each student''s knowledge
    gaps. LearnSmart then provides an optimal learning path for each student, so that
    they spend less time in areas they already know and more in areas they don''t.
    The result: LearnSmart''s adaptive learning path, which helps students retain
    more knowledge, learn faster, and study more efficiently.


    For instructor resources, please visit:


    www.mhhe.com/ce2014


    For additional student resources, please visit:


    www.computing2014.com


