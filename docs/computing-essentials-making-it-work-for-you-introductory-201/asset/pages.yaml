  md: '# VISUAL SUMMARY


    # Secondary Storage


    # STORAGE


    # HARD DISKS


    ![](img/17527690010086a83ec3d8f3ee262703_229_0.png)


    RAM is primary storage. Most RAM is volatile, meaning that it loses its contents
    whenever power is disrupted. Secondary storage provides nonvolatile storage. Secondary
    storage retains data and information after the computer system is turned off.


    Writing is the process of saving information to secondary storage devices. Reading
    is the process of accessing information from secondary storage devices.


    Important characteristics of secondary storage include


    +   - Media—actual physical material that retains data and programs.


    +   - Capacity—how much a particular storage medium can hold.


    +   - Storage devices—hardware that reads and writes to storage media.


    +   - Access speed—time required to retrieve data from a secondary storage device.


    ![](img/17527690010086a83ec3d8f3ee262703_229_1.png)


    Hard disks use rigid metallic platters that provide a large amount of capacity.
    They store data and programs by altering the electromagnetic charges on the platter''s
    surface. Files are organized according to


    +   - Tracks—concentric rings without visible grooves.


    +   - Sectors—wedge-shaped sections.


    +   - Cylinders—run each track of a stack of platters.


    Density refers to how tightly electromagnetic charges can be packed next to one
    another on the disk.


    A head crash occurs when the hard disk makes contact with the drive''s read/write
    heads.


    Two types of hard disks are internal and external hard disks.


    # Internal Hard Disk


    Internal hard disks are located within the system unit. Used to store programs
    and data files.


    202 CHAPTER 7'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'To be a competent end user, you need to be aware of the different types of
    secondary storage. You need to know their capabilities, limitations, and uses.
    There are four widely used storage media: hard disk, optical disc, solid-state,
    and cloud storage.


    # HARD DISKS


    # OPTICAL DISCS


    ![](img/17527690010086a83ec3d8f3ee262703_230_0.png)


    ![](img/17527690010086a83ec3d8f3ee262703_230_1.png)


    Optical discs use laser technology. Is and 0s are represented by pits and lands.
    Optical discs project light and measure the reflected light.


    # External Hard Drives


    Unlike internal hard disks, external hard drives are removable. External drives
    use the same basic technology as internal disks.


    # Performance Enhancements


    Three ways to improve hard-disk performance are disk caching, RAID, file compression
    and decompression.


    +   * Disk caching—provides a temporary high-speed holding area between a secondary
    storage device and the CPU; improves performance by anticipating data needs and
    reducing access to data from secondary storage.

    * RAID (redundant array of inexpensive disks)—several inexpensive hard-disk drives
    improve performance by providing expanded storage, fast access, and high reliability.

    * File compression and decompression—files compressed before storing and then
    decompressed before being used again; improves performance through efficient storage.


    # Compact Disc


    Compact discs (CDs) have typical capacity of 700 MB on one side. Three types are
    CD-ROM (compact disc-read-only memory), CD-R (recordable); CD-RW drives are also
    known as CD burners); and CD-RW rewritable, erasable optical discs.


    # Digital Versatile Disc


    DVDs (digital versatile disc, digital video disks) have greater capacity than
    CDs with a typical capacity of 4.7 GB on one side. Three types are DVD-ROM (digital
    versatile disc-read-only memory, DVD players), write once (DVD-R, DVD-R), and
    rewritable (DVD+RW, DVD-RW, DVD-RAM).


    # Blu-ray Disc


    Hi-def (high definition) Blu-ray discs are the next capacity of 50 GB on one side.
    Blu-ray discs (BDs) have a size same as other optical media, but much greater
    capacity requires special drives. Three basic types: read only, write once, and
    rewritable.


    Secondary Storage 203'
