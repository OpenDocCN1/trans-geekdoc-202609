- pgno: 284
  md: '# Making IT work for you


    # SECURITY SUITES


    Do currently have software that protects you and your computer from various types
    of threats? Are they separate programs that have to be managed individually? If
    so, then you may find that a security suite is a more convenient solution. These
    suites are softpackages that include various utilities that help protect your
    computer from malware, hackers, and many other types of threats.


    Standard Utilities Most security suites provide the following features to protect
    you and your computer:


    +   * Antivirus

    * Antispyware

    * Firewall

    * Phishing detection

    * Privacy/identity protection

    * Parental controls


    At a minimum, all products will have antivirus and antispyware capabilities. You
    will be protected by a real-time scanner that is loaded into your computer''s
    RAM each time you log into your system.


    ![](img/17527690010086a83ec3d8f3ee262703_284_0.png)


    Factors to Consider With so many security suites, it may be difficult to make
    a choice. Experts generally consider the following:


    +   * Detection. How well does it detect threats? Does it miss too many?

    * False-positives. How many times does it mistake a safe file for a threat?

    * Threat removal. How does it eliminate malicious files from your machine?

    * Performance. Does it slow down your system significantly while it is in RAM?
    How fast does it complete a scan?

    * Interface. Is the software easy to use and configure?


    For specific recommendations and rankings, it is useful to read expert reviews
    and test results. Search for "security suites" on reliable online sources such
    as pcworld and cnet.com.'
