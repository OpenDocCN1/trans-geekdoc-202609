  md: '# Unique End-of-Chapter Discussion Materials


    # MAKING IT WORK FOR YOU


    Making IT Work For You questions are carefully integrated with the chapter''s
    Making IT Work For You topics. The questions facilitate in-class discussion or
    assignments focusing on applying specific technologies into a student''s day-to-day
    life. They are designed to expand a student''s awareness of technology applications.


    | DISCUSSION |

    | Answer each of the following questions:

    | Making IT Work For You: ONLINE ENTERTAINMENT |

    | You are one of the millions of people who use YouTube to watch videos. Discuss
    the features on pages 20 and 21 and how they relate to your daily life. How has
    technology changed the way you consume entertainment? What are the advantages
    and disadvantages of watching video online? Would you pay to watch videos without
    advertisements? If so, what would you pay? If you do not use YouTube, what do
    you use instead? How do you feel about posting video comments or sharing ''likes''
    from your phone? |

    | Making IT Work For You: TWITTER |

    | Discuss how Twitter can be used to share future thoughts, business ideas, and
