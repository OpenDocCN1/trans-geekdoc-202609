- pgno: 254
  md: 'One advantage the client/server network strategy is able to handle very large
    networks efficiently. Another advantage is the availability of powerful network
    management software to monitor and control network activities. The major disadvantages
    are the cost of installation and maintenance.


    In a peer-to-peer (P2P) network, nodes have equal authority and can act as clients
    and servers. The most common way to share games, movies, and music over the Internet
    is to use a P2P network. For example, special file-sharing software such as eDonkey
    or BitTorrent can be used to obtain files located on another microcomputer and
    also provide files for other microcomputers.


    P2P networks are rapidly growing in popularity as people continue to share information
    with others around the world. The primary advantage is that they are easy and
    inexpensive (often free) to set up and use. One disadvantage of P2P networks is
    the lack of security controls or other management functions. For this reason,
    few businesses use this type of network to communicate sensitive information.


    ![](img/17527690010086a83ec3d8f3ee262703_254_0.png)


    # Explorations


    BitTorrent is a file-sharing protocol used to distribute large files across the
    Internet.


    To learn more about BitTorrent, visit our example website at www.computing2014.com
    and enter the keyword learned.


    # concept check


    +   - What is a network topology?

    - Compare bus, ring, star, tree, and mesh topologies.

    - What is a network strategy?

    - Compare client/server and peer-to-peer strategies.


    # Organizational Networks


    # environment


    Computer networks in organizations have evolved over time. Most organizations
    have a complex and wide range of different network configurations, operating systems,
    and strategies. These organizations face the challenge of making these networks
    work together effectively and securely.


    Did you know that Cisco, one of the worldwide leaders in networking solutions,
    helps improve environmental sustainability? The Cisco Networked Sustainability
    Framework is an approach that seeks to reduce greenhouse emissions, increase efficiency,
    and attain sustainable business behavior. One of its components is the EnergyWise
    management protocol that helps measure and reduce energy consumption across an
    entire company''s network. To see more environmental factors, visit our website
    at www.computing2014.com and enter the keyword environment.


    # Internet Technologies


    Many organizations employ Internet technologies to support effective communication
    between and within organizations using intranets and extrets.


    +   - An intranet is a private network that organizes the resources within an
    organization. Like the public Internet, intranets use browsers, websites, and
    web pages. Typical applications include electronic directories, email addresses,
    employee benefit information, job openings, and more. Employees find searching
    their organizations to be as easy and intuitive as using the intranet.

    - An extranet is a private network that connects more than one organization. Many
    organizations use Internet technologies to supply suppliers and limited access
    to their networks. The purpose is to increase efficiency and reduce costs. For
    example, an automobile manufacturer has hundreds of suppliers for the parts that
    go into making a car. By having access to the production schedules, suppliers
    can schedule and deliver parts as they are needed at the assembly plants. In this
    way, operational efficiency is maintained by both the manufacturer and the suppliers.


    Communications and Networks


