  md: '# Mass Storage Devices


    It is natural to think of secondary storage media and devices as they relate to
    us individuals. It may not be as obvious how important these matters are to organizations.
    Mass storage refers to the tremendous amount of secondary storage required by
    large organizations. Mass storage devices are specialized high-capacity secondary
    storage devices designed to meet organizational demands for data.


    # Enterprise Storage System


    Most large organizations have established a strategy called an enterprise storage
    system to promote efficient and safe use of data across the networks within their
    organizations.(See Figure 7-16.) Some of the mass storage devices that support
    this strategy are


    +   - **File servers**—dedicated computers with very large storage capacities
    that provide users access to fast storage and retrieval of data.

    - **Network attached storage (NAS)**—similar to a file server except simpler and
    less expensive; widely used for home and small business storage needs.

    - **RAID systems**—larger versions of the specialized devices discussed earlier
    in this chapter that enhance organizational security by constantly backup copies
    of files moving across the organization’s networks.


