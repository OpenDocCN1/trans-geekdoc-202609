    could be combined to form higher-capacity options known as *T3* or *DS3* lines.
    These lines have largely been replaced by faster **optical carrier (OC)** lines.

    While the special high-speed lines are too costly for most individuals, Internet
    service providers (as discussed in Chapter 2) do provide adequate connections.
    For years, individuals relied on **dial-up services** using existing telephone
    and telephone modems to connect to the Internet. This type of service has been
    replaced by higher-speed connection services including DSL, cable, satellite,
    and cellular services.


    +   - **Digital subscriber line (DSL) service** is provided by phone companies
    using existing telephone lines to provide high-speed connections. **DSL** is also
    much faster than dial-up.

    - **Cable service** is provided by cable television companies using their existing
    cables. These connections are faster than DSL.

    - **Satellite connection services** use satellites to provide wireless connections.
    While slower than DSL and cable modem, satellite connections are available almost
    anywhere using a satellite-receiving disk.


