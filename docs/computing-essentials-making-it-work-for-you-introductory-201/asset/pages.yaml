  md: '# Spreadsheets


    Spreadsheets organize, analyze, and graph numeric data such as budgets and financial
    reports. Once exclusively by accountants, spreadsheets are widely used by nearly
    everyone. Marketing professionals analyze trends. Financial analysts evaluate
    and graph market trends. Students and teachers record grades and calculate point
    averages.


    The most used spreadsheet program is Microsoft Excel. Other spreadsheets include
    Apple Numbers and OpenOffice Calc.

    Assume you have just accepted a job as manager of the Downtown Internet Cafe.
    This café provides a variety of flavored coffees as well as Internet access. One
    of your responsibilities is to create a financial plan for the next year. See
    how you could use Microsoft Excel, as the manager for the Downtown Internet Café,
    see Figures 3-5 to 3-6.


    # Creating a Sales Forecast


    Your first project is to develop a first-quarter sales forecast for the café.
    You begin by studying sales data and talking with several managers. After obtaining
    sales and expenses, you are ready to create the first-quarter forecast. Start
    structuring the worksheet by inserting descriptive entries for row and column
    headings. Then insert numeric entries, including formulas and functions to perform
    calculations. To test the accuracy of the worksheet, you will change the values
    in some cells and recalculate the spreadsheet results with hand calculations.


    Worksheets

    Worksheets are used for a wide range of applications. One of the most common uses
    is to create, analyze, and forecast budgets.


    Text Entries

    Text entries provide meaning to the values in the worksheet. The rows are labeled
    to identify sales and expense items. The columns are labeled by the months.


    Functions

    One advantage of using functions rather than entering formulas is they are easier
    to enter. In this case, cell C20 (Total Expenses for February) contains the function
    SUM(C14:C15) for the first (C16+C17+C18-C19).


    | | JAN | FEB | MAR | TOTAL | AVG |

    |---|---|---|---|---|--|

    | 7 | Beverage | $13,800 | $14,000 | $15,000 | $43,800 | $14,600 |

    | 8 | Food | $7,100 | $7,300 | $7,400 | $21,800 | $7,267 |

    | 9 | Computers | $4,000 | $4,300 | | $12,300 | $4,100 |

    | 10 | Merchandise | $3,100 | $3,200 | | $9,300 | $3,100 |

