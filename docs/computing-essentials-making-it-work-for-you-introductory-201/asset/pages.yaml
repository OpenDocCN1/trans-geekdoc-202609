  md: '# STUDENTS...


    Want to to get better grades?

    (Who doesn''t)


    Ready to do online interactive assignments that help you apply what you''ve learned?
    (You need to know how to use this stuff in the real world...)


    New ways to study before the big test? (A little peace of mind is a good thing...)


    # INSTRUCTORS...


    Would you like your students to show up for class more prepared? (Let''s face
    it, class is much more fun if everyone is engaged and prepared...)


    Want ready-made, application-level interactive assignments, student progress reporting,
    and auto assignment grading? (Less grading means more time teaching...)


    Want an instant view of student or class performance relative to learning objectives?
    (No more wondering if your students understand...)


    Need to collect data and generate reports for administration or accreditation?
    (Say goodbye to manually tracking student learning outcomes...)


    Want to record and post your lectures for students to view online?


    Want an online, searchable version of your textbook?\Wish your textbook could
    be available while you''re doing your assignments?


    With McGraw-Hill''s Connect Plus CIT,


    # STUDENTS GET:


    +   - Interactive, engaging content.

    - Interactive applications—chapter assignments that help you APPLY what you''ve
    learned in the course.


    With McGraw-Hill''s Connect Plus CIT,


    # INSTRUCTORS GET:


    +   - Interactive applications—book-specific assignments that require students
    to APPLY what they''ve learned.

    - Simple assignment management, allowing you to spend more time teaching.

    - Auto-graded assignments, quizzes, and tests.

    - Detailed visual reporting where student and section results can be viewed and
    analyzed.

    - Sophisticated online testing capability

    - A filtering and reporting function that allows you to easily assign and report
    on materials that are correlated to accreditation standards, learning outcomes,
    and Bloom''s taxonomy.


    # Connect Plus CIT eBook


    If you choose to use Connect Plus CIT, you have an affordable and searchable online
