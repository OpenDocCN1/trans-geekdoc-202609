  md: 'do not recognize individuals letters or images. Rather, they recognize light,
    dark, and colored areas that make up individual letters or images. Typically,
    scanned documents are saved in files that can be processed, displayed, printed,
    or stored for later use. There are three basic types of optical scanners: flatbed,
    document, and portable.


    +   - Flatbed scanner is much like a copy machine. The image to be scanned is
    placed on a glass surface, and the scanner records the image from below.


    +   - Document scanner is similar to a flatbed scanner except that it can quickly
    scan multipage documents. It automatically feeds one page of a document at a time
    through a scanning surface (See Figure 6-10).


    +   - Portable scanner is typically a handheld device that slides across the image,
    making direct contact.


    ![](img/17527690010086a83ec3d8f3ee262703_186_0.png)


    Optical scanners are powerful tools for a wide variety of end users, including
    graphics and advertising professionals who can scan images and combine them with
    text. Lawyers and students use portable scanners as a valuable tool to record
    information.


    Figure 6-10 Document scanner


    # Card Readers


    Nearly everyone uses a credit card, debit card, card (parking or building) card,
    and/or some type of identification card. These cards typically have the user''s
    name, some type of identification number, and signature on the card. Additionally,
    encoded information is stored on the card as well. Card readers interpret information.


    Although there are several different types, by far the most common is the magnetic
    card reader. The encoded information is stored on a thin magnetic strip located
    on the back of the card. When the card is swiped through the magnetic reader,
    information is read.


    # Bar Code Readers


    You are probably familiar with bar code readers or scanners from grocery stores.
    These devices are either handheld wand readers or platform scanners. They contain
    photoelectric cells that can scan or read bar codes, or the vertical zebra-striped
    marks printed on products.


    Almost all supermarkets use electronic cash readers and a bar code system called
    the Universal Product Code (UPC). At the checkout, electronic cash registers use
    a bar code reader to scan each product''s UPC. The codes are sent to the computer,
    which has a description, the latest price, and an inventory level for each product.
    The computer processes this input to update the inventory level and provide the
    electronic cash register with the price for each product. These devices are so
    easy to use that many supermarkets are offering self-checkout stations.


    Smartphones can also scan barcodes. (See Figure 6-11.) With the appropriate app,
    you can scan the bar code of a product and get competitive prices. For example,
    scanning the bar code from a product you are thinking of buying, the app Price
    Check by Amazon will provide in-store and online price comparisons as well as
    provide other product reviews.


    ![](img/17527690010086a83ec3d8f3ee262703_186_1.png)


    Figure 6-11 Smartphone bar code reader


