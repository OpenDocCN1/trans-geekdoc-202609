    # Storage Area Network


    A recent mass storage development is **storage area network (SAN)**. SANS is an
    architecture to link remote storage devices, such as enterprise storage systems,
    to computers that these devices are available as locally attached devices. In
    a SAN, the user''s computer provides the file system for storing data, but the
    SAN provides the disk space for data.


    The key to a SAN is a high-speed network, connecting individual computers to mass
    storage devices. Special file systems prevent simultaneous users from interfering
    with each other. SANs provide the ability to house data in remote locations and
    still allow efficient and secure access.


    ![](img/17527690010086a83ec3d8f3ee262703_227_0.png)


