  md: '# Making IT work for you


    # SKYPE


    Do you use a communication tool that lets you keep in touch with your friends
    and family? Does that tool include the ability to have face-to-face conversations,
    share files and screens, and make calls to those not connected to the Internet?
    Skype is a wellknown tool that offers all these services, most of them for free.
    This section will help you explore some of Skype''s features.


    **Getting Started** In order to enjoy all the benefits of Skype, it is recommended
    that your computer has speakers, a micro-phone, and a webcam. If you have a notebook
    or tablet, these are all likely integrated. Follow these steps to create your
    account and install Skype on your machine:


    +   - Visit www.skype.com, and click the Join Skype button at the top right.


    +   - Enter the required information to create your Skype account. When are finished,
    the software will be downloaded automatically. Do not purchase Skype credits at
    the moment.


    +   - Run the downloaded setup file, and follow the prompts to install Skype on
    your machine.


    +   - Log in your Skype account on the welcome screen, and follow the prompts
    to make sure your audio and video are working.


    **Adding Contacts** You can find friends or other contacts manually, or you can
    import them from your address book on Facebook, Outlook, and several other services.
    To add a contact manually:


    +   - Click Add a Contact at the bottom of the Contacts List on the left side.


    +   - Enter the information you know about your contact, such as his or her e-mail
    address.


    +   - Skype will display matches. Click the one that matches your contact''s details,
    and then click the Add button.


    Your contact must accept your request before you can see his or her online status.


