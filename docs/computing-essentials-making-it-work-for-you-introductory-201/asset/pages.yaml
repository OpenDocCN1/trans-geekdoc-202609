- pgno: 169
  md: '# A LOOK TO THE FUTURE


    # Chips inside Your Brain


    Have you ever thought it would be able to communicate with a computer ... by merely
    thinking? Researchers are working with various devices (usually worn on head)
    that can use your basic thoughts to move objects, such as wheelchairs. However,
    the future will lie in implanted microchips that can communicate directly with
    our nerve cells. Although their purpose will be to treat of medical conditions,
    they could eventually (controversially) be used to improve various brain functions
    of otherwise healthy individuals.


    For over a decade, doctors have been able to use deep brain stimulation (DBS)
    to treat disorders such as Parkinson''s disease. As successful as it has for many
    patients, those implants simply send preset impulses to the brain. They do not
    involve an active communication between nerve cells and machines. Researchers
    working on a chip known as ReNaChip hope to change


    by using a programmable chip that is responsive to what is going on the patient''s
    brain. This silicon chip can measure the brain''s electrical activity and then
    deliver the appropriate stimulation when it is needed.


    Another brain is currently being developed aims to help the blind regain some
    sight. A microchip is implanted in the brain''s visual cortex, which is responsible
    for processing Images. This chip would communicate wirelessly with a camera located
    inside special eyeglasses by the individual. The


    images captured by camera would be processed by the chip and then fed directly
    to the nerves in this area of the brain.


    Getting close to the world of the unbelievable, researchers are improving the
    abilities of computers to actually read human thoughts. Currently one research
    team has been able to use a chip implant and computer to read the thoughts of
    a stroke victim in order to allow her to move a robotic arm. Although the success
    rate is not 100 percent and the processing is limited to basic movements, the
    patient has already been able to get the robotic arm to hold a cup of coffee by
    thinking about it. This research will hopefully lead to improved, thought-controlled
    prosthetic devices for millions of disabled individuals.


    ![](img/17527690010086a83ec3d8f3ee262703_169_0.png)


    Many ethics are concerned by the use of such chips to improve human abilities
    instead of treating medical conditions. For example, with tiny chips people could
    brain implants to improve their memory. This can lead to a variety of scenarios
    where the individual with the implants could have an unfair advantage over those
    who do not


    them. However, others disagree, that the integration of technology and biology
    is to be expected, and it is nothing more than the next step in human evolution.


    If such technology became widespread and affordable, would you opt to receive
    a chip implant? Would you make a distinction between one for a medical condition
    versus for improving your mental abilities? Do you think the future of humanity
    lies in the merging of technology with human biology?'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# VISUAL SUMMARY The System Unit


    # SYSTEM UNIT


    # SYSTEM BOARD


    ![](img/17527690010086a83ec3d8f3ee262703_170_0.png)


    ![](img/17527690010086a83ec3d8f3ee262703_170_1.png)


    System unit (system chassis) contains electronic components. There are four basic
    categories of system units: desktop, notebook (laptop), tablet, and handheld.


    The system board (mainboard or motherboard) connects all system components and
    allows input and output devices to communicate with the system unit.


    # Desktop


    Desktop system units are located in a separate case; lower unit (tower computer)
    has vertical system unit; system unit is housed with monitor in all-in-one computers.


    +   * Sockets provide connection points for chips (silicon chips, semiconductors,
    integrated circuits). Chips are mounted on carrier packages.

    * Slots provide connection points for specialized cards or circuit boards.

    * Bus lines provide pathways to support communication.


    # Notebook


    Notebook (laptop) system units contain second-storage devices and input devices.
    Netbooks are a smaller, less powerful, and less expensive type of notebook.


    ![](img/17527690010086a83ec3d8f3ee262703_170_2.png)


    # Tablet


    Tablet system units are located behind the monitor. Tablets are smaller, lighter,
    and generally less powerful than laptops and use a virtual keyboard.


    # Handheld computer


    Smartphones are most popular handheld computer. System unit is located behind
    the display screen and keypad.


    # Components


    Each type of system unit has the same basic components including system board,
    microprocessor, and memory.


    The System Unit 143'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'To be a competent end user, you need to understand the functionality of the
    basic components in the system unit: system board, microprocessor, memory, expansion
    slots and cards, lines, and ports and cables. Additionally, you need to understand
    how data and programs are represented electronically.


    # MICROPROCESSOR


    The microprocessor is a single chip that contains the central processing unit
    (CPU) or microprocessor. It has two basic components: a control unit and ALU.


    # Microprocessor Chips


    A word is the number of bits that can be accessed by the microprocessor at one
    time. Clock speed represents the number of times the CPU can fetch and process
    data instructions in a second.


    Multicore chips can provide multiple independent CPUs. Parallel processing requires
    programs that allow multiple processors to work together to run large complex
    programs.


    # Specialty Processors


    Specialty processors include graphics processors, also known as GPU or graphics
    unit (processors images), and processors in automobiles (monitor fuel efficiency,
    satellite entertainment, and tracking systems).


    # MEMORY


    Memory holds data, instructions, and information. There are three types of memory
    chips.


    # RAM


    RAM (random-access memory) chips are called temporary or volatile storage because
    their contents are lost if power is disrupted.


    +   - Cache memory is a high-speed holding area for frequently used data and information.

    - DIMM (dual in-line memory module) is used to expand memory.

    - Virtual memory divides large programs into parts that are read into RAM as needed.


    # ROM


    ROM (read-only memory) chips are non-volatile storage and control essential system
    operations.


    # Flash Memory


    Flash memory does not lose its contents when power is removed.


    # EXPANSION SLOTS AND CARDS


    ![](img/17527690010086a83ec3d8f3ee262703_171_0.png)


    Most computers allow users to expand their systems by providing expansion slots
    on their system boards


    Examples of expansion cards include graphics cards, sound cards, network interface
    cards (NIC), network adapter cards), and wireless network cards.


    Plug and Play is the ability for a computer to recognize and configure a device
    without human interaction.


    PC cards plug into PCMCIA slots, and ExpressCard sized expansion slots.


    # BUS LINES


    Bus lines, also known as buses, provide data pathways that connect various system
    components. Bus width is the number of bits that can travel simultaneously. System
    buses connect CPU and memory. Expansion buses connect CPU and slots.


    # Expansion Buses


    Three principal bus types are


    +   - USB (universal serial bus) can connect from one USB device to another or
    to a point (hub) and then onto the system board.

    - FireWire bus is used for USB but more specialized.

    - PCIe (PCI Express) is widely used; provides a single dedicated path for each
    connected device.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# PORTS


    # POWER SUPPLY


    ![](img/17527690010086a83ec3d8f3ee262703_172_0.png)


    ![](img/17527690010086a83ec3d8f3ee262703_172_1.png)


    Power supply units convert AC to DC and power desktops. AC adapters power notebooks
    and tablets and recharge batteries.


    Ports are connecting sockets on the outside of the system unit.


    # ELECTRONIC REPRESENTATION


    Human voices create analog (continuous) signals; computers only recognize digital
    electronic signals.


    # Standard Ports


    Four standard ports are:


    +   - VGA (Video Graphics Adapter) and DVI (Digital Video Interface)—provide connections
    to monitors.

    - USB (universal serial bus)—widely used to connect keyboards, mice, printers,
    and storage devices; one port can connect several devices to system unit.

    - FireWire—provides high-speed connections to specialized FireWire devices such
    as camcorders and storage devices.

    - Ethernet—provides high-speed networking port that becomes a standard for today''s
    computers.


    # Numeric Representation


    Data and informations can be represented electronically with a two-state or binary
    system of numbers (0 and 1). Each 0 or 1 is called a bit. A byte of bits uses
    16 digits (hex) to represent binary numbers.


    # Character Encoding


    Character encoding assigns standard unique sequences of bits to each character.
    Three standards are ASCII (American Standard Code for Information Interchange),
    EBCDIC (Extended Binary Coded Decimal Interchange), and Unicode.


    # Specialized Ports


    Five specialty ports are eS (external Serial Attachment) for high-speed connections
    to legacy storage devices, HDMI (High Definition Multimedia Interface) for digital
    audio and video, Mini DisplayPort (MiniDP, mDP) for large monitors, MIDI for digital
    music, and S/PDIF (Sony/Philips Digital Interface) for high-end audio and home
    theater systems.


    # CAREERS IN IT


    Computer technicians repair and install computer components and systems. Certification
    in computer repair or associate degree from professional schools required. Salary
    range is $31,000 to $46,000.


    # Cables


    Cables are used to connect external devices to the system unit via ports.'
