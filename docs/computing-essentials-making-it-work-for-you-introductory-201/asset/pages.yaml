  md: '# Introduction


    We live in a truly connected society. We can communicate instantaneously with
    others worldwide; changing events from the smallest of countries and places are
    immediately broadcast to the world; e-mail messages are delivered to handheld
    devices; cars access the Internet to receive driving instructions and solve mechanical
    problems. Even household appliances can connect to the Internet and be remotely
    controlled. The communications and information options we have at our fingertips
    have changed how we react and relate to the world around us.


    ![](img/17527690010086a83ec3d8f3ee262703_239_0.png)


    As the power and flexibility of our communication systems have expanded, the sophistication
    of the networks that support these systems has becoming increasingly critical
    and. The network technologies that help cellular, business, and Internet communications
    come in many different forms. Satellites, besides towers, telephone lines, even
    buried cables and fiber optics our our messages, e-mail, and text messages. These
    different networks must be able to efficiently and effectively integrate with
    one another.


    Hi, I''m Michael, and I''m a network administrator. I''d like to talk to you computer
    communications and networks. I''d also like to talk about technologies that support
    mobile computing including global positioning systems, Wi-Fi, 3G and 4G networks.


    Competent users need to understand the concept of connectivity, wireless net-working,
    and the elements that make up network and communications systems. Additionally,
    they need to understand the basics of communications channeis, connection devices,
    data transmission, network types, network architectures, and organizational networks.


    # Communications


    Computer communications is the process of sharing data, programs, and information
    between two or more computers. We have discussed numerous applications that depend
    on communication systems, including-


    +   - E-mail—provides a fast, efficient alternative to traditional mail by sending
    and receiving electronic documents.

    - Testing—provides very efficient direct text communication between individuals
    using short electronic messages.

    - Internet telephone—provides a very low-cost alternative to long-distance telephone
    calls using electronic voice and video delivery.

    - Electronic commerce—buying and selling goods electronically.


    In this chapter, we will focus on the communication systems that support these
    and many other applications. Connectivity, the wireless revolution, and communication
    systems are key concepts and technologies for the 21st century.


    # Connectivity


    Connectivity is a concept related to using computer networks to link people and
    resources. For example, connectivity means that you can connect your microorganism
    to other computers and information sources almost anywhere. With this connection,
    you are linked to the world of larger computers and the Internet. This includes
    hundreds of thousands of web servers and their extensive information resources.
    Thus, becoming competent and knowledgeable becomes a


    CHAPTER 8'
