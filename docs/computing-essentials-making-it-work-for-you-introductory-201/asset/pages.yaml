  md: '# The Internet, the Web, and Electronic Commerce


    # Competencies



    1. Discuss the origins of the Internet and the web.

    2. Describe how to access the web using providers and browsers.

    3. Discuss Internet communications, including e-mail, text messaging, instant
    messaging, social networking, blogs, microblogs, webcasts, podcasts, and wikis.

    4. Describe search tools, including search engines and specialized search engines.

    5. Evaluate the accuracy of information presented on the web.

    6. Discuss electronic commerce, including B2C, C2C, B2B, and security issues.

    7. Describe cloud computing, including the three-way interaction of clients, Internet,
    and service providers.

    8. Describe web utilities including plug-ins, filters, file transfer utilities,
    and Internet security suites.


    ![](img/17527690010086a83ec3d8f3ee262703_53_0.png)


    # Why should I read this chapter?


    The beginning of the Internet can be traced to 1969 when mainframe computers located
    in different parts of the United States were linked to one another. It was used
    exclusively to facilitate communication between researchers and limited to text.
    That was then and this is now. Now, emerging Internet technologies are changing
    the way the world works and the way you interact with the world.

    This chapter discusses these technologies including the web; wireless Internet
    access; and social networking including Facebook, Google+, and LinkedIn. Additionally,
    you will learn about webstreaming, technology, podcasts, Twitter, cloud computing,
    and more. To be competent and competitive in today''s professional workplace,
    you need to know and understand these things.


