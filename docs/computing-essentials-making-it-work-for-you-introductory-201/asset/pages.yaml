    # **Keyboards**


    There are a wide variety of different keyboard designs. They range from the full-size
    to miniature and can be virtual. There are four basic categories of keyboards:
    traditional, notebook, virtual, and thumb.


    +   * **Traditional keyboards**—these are widely used on desktops and larger computers.
    The standard U.S. traditional keyboard has 101 keys. Some traditional keyboards
    include a few additional special keys. For example, the Windows keyboard includes
    a key to directly access the Start menu. Traditional keyboards provide function
    keys, navigation keys, and a numeric keypad. Some keys, such as the Caps Lock
    key, are toggle keys. These keys turn a function on or off. Others, such as the
    Ctrl, are combination keys, which perform an action when held down in combination
    with another key. (See Figure 6-1).


    +   * **Notebook keyboards**—these are widely used on notebook computers including
    networks. While the precise location and number of keys may differ from manufactures,
    notebook keyboards typically have fewer keys, do include a numeric keypad, and
    do not have a standard location for function and navigation keys. (See Figure
    6-2 top)


    +   * **Virtual keyboards**—these are widely used on tablets and other smartphones.
    Rather, unlike other keyboards, virtual keyboards do not have a physical keyboard.
    They are typically displayed on a screen and selected by touching their image
    on the screen. (See Figure 6-2 middle)


    +   * **Thumb keyboards**—these are widely used on smartphones and other small
    portable devices. Designed primarily for communicating via texting and connecting
    to the web, these keyboards are very small. (See Figure 6-2 bottom.)


