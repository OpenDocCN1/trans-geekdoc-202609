    ![](img/17527690010086a83ec3d8f3ee262703_141_1.png)


    # Windows


    Windows, the most widely used operating system, is designed to run with many different
    microprocessors. The two recent versions are Windows 7 and Windows 8. Windows
    8 offers an interface very similar to the Windows Phone interface; supports desktops,
    notes, books and tablets; uses a start screen and tiles; and provides support
    for gestures, cloud integration, and apps. Windows RT, a version of Windows 8,
    is designed to run with ARM tablets.


    Mobile operating systems (mobile OS) are embedded in every smartphone and tablet.
    These systems are less complicated and specialized for wireless communication
    than desktop operating systems.


    Some of the best known are BlackBerry, iOS (iPhone OS), Android, Windows Phone,
    and WebOS.


    +   * Android was originally developed by Android Inc. and later purchased by
    Google. It is a widely used mobile OS.


    +   * BlackBerry OS (RIM OS) originated in Canada. It was designed as the platform
    for BlackBerry hand-held computers.


    +   * iOS (iPhone OS) was developed by Apple to support iPhone, iPod Touch, and
    iPad.


    +   * WebOS was developed by Palm, Inc., and later purchased by HP. It has evolved
    into the operating system for many of HP''s mobile devices.


    Windows Phone 8 was introduced in 2012 by Microsoft to support a variety of mobile
    devices, including smartphones. It can run many power-full programs for laptop
    and desktop computers.


    # Mac OS


    Mac OS, an innovative, easy-to-use operating system, runs on Macintosh computers.
    The most recent versions are Lion and Mountain Lion. Lion''s interface is similar
    to the interfaces on Apple''s smartphone and tablets. It is designed for Apple''s
    desktops and laptops. Lion''s functionality is similar to Windows 8 but generally
    easier to consider use.


