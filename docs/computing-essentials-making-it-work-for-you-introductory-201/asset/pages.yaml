  md: '# VISUAL SUMMARY


    Privacy, Security, and Ethics


    # PRIVACY


    # PRIVACY


    ![](img/17527690010086a83ec3d8f3ee262703_294_0.png)


    ![](img/17527690010086a83ec3d8f3ee262703_294_1.png)


    Privacy concerns the collection and use of data about individuals. There are three
    primary privacy issues: accuracy (who is responsible to ensure data is correct),
    property (who owns the data and rights to software), access (who has access to
    data).


    Information stored by browsers includes history files (record sites visited) and
    temporary Internet files or browser cache (which caches website content and display
    instructions). Cookies store and track information. Privacy mode (InPrivate Browsing;
    Private Browsing) ensures that your browsing activity is not recorded.


    # Large Databases


    Large organizations are constantly compiling information about us. Reverse directories
    list phone numbers followed by subscriber names (information brokers) collect
    and personal data. Electronic profiles are compiled from databases to provide
    highly detailed and personalized descriptions of individuals.


    Spyware records and reports Internet activities. Computer monitoring software
    (or keyloggers) are particularly dangerous. Antispyware (or spy removal programs)
    detects various privacy threats.


    Identity theft is the illegal assumption of identity for the purposes of economic
    gain. Mistaken identity occurs when an electronic profile of one person is switched
    with another. The Freedom of Information Act enables individuals access to governmental
    records relating to


    # Online Identity


    Many people post personal information and sometimes intimate details of their
    lives considering the consequences. This creates an online identity. With the
    archiving and search features of the web, this identity is indelably available
    to anyone who cares to look for it.


    # Private Networks


    # Major Laws on Privacy


    Many organizations monitor employee e-mail and computer files using special software
    called employee-monitoring software.


    The Gramm-Leach-Bliley Act protects financial information; the Health Insurance
    Portability and Accountability Act (HIPAA) protects medical records; and the Family
    Educational Rights and Privacy Act (FERPA) restricts disclosure of educational
    records.


    # The Internet and the Web


    Many people believe that, while using the web, little can be done to invade their
    privacy. This is called the illusion of anonymity.'
