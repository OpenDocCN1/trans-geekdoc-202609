- pgno: 158
  md: 'Control unit The control unit tests the rest of the computer system to carry
    out a program''s instructions. It directs the movement of electronic signals between
    memory, which holds temporary data, and processed information, and the arithmetic-logic
    unit. It also directs control between the CPU and input and output devices.


    Arithmetic logic unit The arithmetic logic unit performs two types of operations:
    arithmetic and logical. Arithmetic operations are the fundamental math operations:
    addition, subtraction, multiplication, and division. Logical operations consist
    of comparisons such as whether one is equal to (=), less than (<), or greater
    than (>).


    ![](img/17527690010086a83ec3d8f3ee262703_158_0.png)


    There are many types of microprocessors used in servers, home computers, and mobile
    devices. To learn more about microprocessors, visit our website at www.computing2014.com
    and enter the key microprocessor.


    # Microprocessor Chips


    Chip processing capabilities are often expressed in word size. The number of bits
    (such as 16, 32, or 64) that can be accessed at one by the CPU. The more bits
    in a word, the more data a computer can process at one time. A 32-bit word computer
    can access 4 bytes at a time. A 64-bit word computer can access 8 bytes at a time.
    Therefore, the computer is designed to process bits with greater capacity. Other
    factors affect a computer''s processing capability including how fast it can process
    data and instructions.


    Are you looking to purchase a portable computer? With many types of notebooks
    and tables, do you find yourself undecided? If so, then know you are not alone.
    Consumers are now faced with various subcategories of notebook computers, and
    the market has exploded with various brands, operating systems, and access-orories.
    To get started, consider these questions:


    +   1. Will this particular computer be your main computer? If so, then a notebook
    computer is generally more versatile and perfect for home, business, or mobile
    use.

    2. Do you need a high quality screen for editing videos and photos? If so, a tablet
    is more comfortable to carry around and in your hands for longer periods.


    It would also help picking the best decision, to turn your Buyer''s Guide on page
    39. For other tips, visit our website at www.computing2014.com and enter the key
    tips.


    # tips


    The processing speed of a microprocessor is typically represented by its clock
    speed, which is related to the number of times the CPU can fetch and process data
    or instructions in second. Microprocessors typically process data and instructions
    in millions of nanoseconds, or microseconds. New microprocessors are much faster
    and process data and instructions in billions of nanoseconds. Supercomputers,
    by contrast, operate at speeds measured in picoseconds—1000 times faster (see
    Figure 5). Logically, the higher the microprocessor''s clock speed, the faster
    the processor. However, some processors handle multiple instructions per cycle;
    this means clock speed can only be compared between processors that work the same
    way.


    A recent development is the multicore chip. As mentioned previously, a traditional
    microprocessor''s CPU is typically contained on a single microprocessor. A new
    type of chip, the multicore chip, can provide two or more and independent CPUs.
    For example, a quad-core processor could have one core computing a Excel spreadsheet,
    a second core creating a report using a third word, or a fourth core running a
    multimedia presentation. Significantly higher, however, is the potential for microcomputers
    to run large, complex programs that require expensive experience and specialized
    hardware.


    For processors to be used effectively, computers must understand how to divide
    tasks into parts that can be distributed across each core—operation called parallel
    processing. Operating systems such as Windows and Mac OS support parallel processing.
    Software developers use this technology


    | Unit | Speed |

    | Microsecond | Million of a second |

    | Nanosecond | Billion of a second |

    | Picosecond | Trillion of a second |


    Figure 5 Processing speeds


