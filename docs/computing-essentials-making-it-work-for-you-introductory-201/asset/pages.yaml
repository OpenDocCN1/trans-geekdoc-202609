- pgno: 246
  md: '# Making work for you


    # MOBILE INTERNET


    Is your smartphone or tablet always connected to the Internet? Millions have this
    always-on connection to access their e-mail, favorite websites, cloud services,
    and apps from anywhere at any time. What can be confusing to many is the variety
    of connection devices, data plans, and penalties for exceeding usage limits.


    Devices There are many devices that can help you get Internet access from wherever
    you are.


    +   - Smartphones. Most modern smartphones are capable of accessing the Internet
    via Wi-Fi and 3G or 4G networks.

    - Tablets. Most tablets will provide Wi-Fi access, but to get 3G or 4G capabilities,
    you generally have to purchase a higher-priced model.

    - Notebooks. By inserting a USB modem, almost all notebooks can access the Internet
    via 3G or 4G network.

    - Mobile hotspot device. This is a stand-alone device that connects to a 3G or
    4G network. It will then allow multiple devices to access the Internet via a Wi-Fi
    connection.


    ![](img/17527690010086a83ec3d8f3ee262703_246_0.png)


    It is worth noting that many smartphones have a Wi-Fi sharing, or tethering, ability
    that is similar to the mobile hotspot device. However, to use that capacity, you
    may have to pay a monthly fee in addition to your regular data plan.


    Data Plans. A data plan essentially tells how many megabytes or gigabytes of data
    you can download using your 3G or 4G connection. These plans can be very confusing,
    for most individuals, the plan that gives you a few gigabytes per month is best.
    Also a few providers have unlimited data plans, they may slow down, or throttle,
    the connection speed significantly if they deem their usage is excessive.


    Over Charges If you exceed the monthly data limit, wireless providers will start
    charging over fees. For example, one provider charges $10 for every gigabyte used.
    To minimize over charges, consider the following:


    +   - Wi-Fi access points. Whenever possible, use a Wi-Fi connection. These connections
    are not subject to your data plan limits. So if you are in a coffee shop that
    offers free Wi-, use it!

    - Streaming music/video. Streaming too much of media using 3G or 4G can quickly
    become a problem. The solution: be particularly selective when watching TV shows,
    movies, and YouTube videos, and try to store some of your music on your device.

    - Downloading. Limit your downloading of new apps and music to Wi-Fi connections
    only. Many programs and MP3 files can reach (or even exceed) a size of 10 MB.

    - Monitor your data usage. Most wireless companies provide a free app that helps
    you monitor your minutes, messages, and data. Keep an eye on it.


    ![](img/17527690010086a83ec3d8f3ee262703_246_1.png)


    The web is continually changing, and some of the specifics presented in this Making
    It For You may have changed. To learn about other ways to make information technology
    work for you, visit our website at www.computing2014.com and enter the keyword
    mw.'
