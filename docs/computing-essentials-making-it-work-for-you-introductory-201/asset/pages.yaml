- pgno: 217
  md: 'Hard disks are sensitive instruments. Their read/write heads reside on a cushion
    of about 0.000001 inch. It is so thin that a smoke particle, fingerprint, dust,
    or human hair could cause what is known as a head crash. (See Figure 7-4).


    A head crash occurs when a read/write head makes contact with the hard disk''s
    surface or with particles on its surface. A crash is a disaster for a hard disk.
    The disk surface is scratched, and some or all of the data is destroyed. At one
    time, fortunately, they are rare.


    ![](img/17527690010086a83ec3d8f3ee262703_217_0.png)


    There are two types of hard disks: internal and external.


    Figure 7-4 Materials that can cause a head crash


    # Internal Hard Disk


    An internal hard disk is located inside the system unit. These hard disks are
    able to store and retrieve large quantities of information quickly. They are used
    to store programs and data files. For example, nearly every microcomputer uses
    its internal hard disk to store its operating system and many applications such
    as Word and Excel.


    To see how a hard disk works, visit our website at www.computer2014.com and enter
    the keyword disk.


    To ensure adequate performance of your internal hard disk, you should perform
    routine maintenance and periodically make backup copies of all important files.
    For hard-disk maintenance and backup procedures, refer to Chapter 4''s guide to
    the Windows utilities Backup and Restore, Disk Cleanup, and Defragmenter.


    # External Hard Drives


    While internal hard disks provide fast access, they have a fixed amount of storage
    and cannot be easily removed from the system unit. External hard disks typically
    connect to a USB or FireWire port on the system unit and have a fixed amount of
    storage. Unlike an internal disk, external hard disks have a fixed amount of storage,
    each removable hard disk can be easily replaced by another removable disk, a single
    port on the system unit can provide access to an unlimited amount of storage (See
    Figure 7-3).


    ![](img/17527690010086a83ec3d8f3ee262703_217_1.png)


    External hard drives use the same basic technology as internal hard disks and
    are used primarily to complement an internal hard disk. Because they are easily
    removed, they are particularly useful to protect or secure sensitive information.
    Other uses for external drives include backing the contents of the internal hard
    disk and providing additional hard-disk capacity.


    # Performance Enhancements


    Three ways to improve the performance of hard disks are disk caching, redundant
    arrays of inexpensive disks, and file/decompression.


    Disk caching improves hard-disk performance by anticipating data needs. It performs
    a function similar to cache memory discussed in Chapter 5. While cache memory
    processes processing by acting as a temporary high-speed area between


