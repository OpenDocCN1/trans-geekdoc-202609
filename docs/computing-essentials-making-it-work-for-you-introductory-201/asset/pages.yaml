  img_proc: true
- pgno: 113
  md: '# GENERAL-PURPOSE APPLICATIONS


    # SPECIALIZED APPLICATIONS


    ![](img/17527690010086a83ec3d8f3ee262703_113_0.png)


    ![](img/17527690010086a83ec3d8f3ee262703_113_1.png)


    # Database Management Systems


    A database is a collection of related data. A database management system (DBMS)
    or database manager is a program that structures a database. It provides tools
    to enter, edit, and retrieve data from the database. Organizations use databases
    for many purposes including maintaining employee records. Two widely used database-based
    management systems designed for computers are Microsoft Access and OpenBase.


    Specialized applications are widely used within specific professions. They include
    graphics programs and web authoring programs.


    # Graphics Programs


    Graphics programs are used by graphic arts professionals.


    +   - Desktop publishing (page layout programs) mix text and graphics to create
    professional-quality publications.

    - Image editors (photo editors) edit digital photographs consisting of thousands
    of dots or pixels that form bitmap or raster images.

    - Illustration programs (drawing programs) create and edit vector images. Vector
    images (vector illustrations) use geometric shapes.

    - Image galleries are libraries of electronic images.

    - Two basic types are stock photographs and clip art.


    # Presentation Graphics


    Presentation graphics that combine a variety of visual objects to create attractive,
    visually interesting presentations. They are excellent to communicate a message
    and persuade people. People in a variety of settings and situations use presentation
    programs to make their presentations more interesting and powerful. Three of the
    most widely used presentation programs are Microsoft PowerPoint, OpenImpress,
    and Keynote.


    # Web Authoring Programs


    Web authoring is the process of creating a website. Individuals create online
    diaries called blogs. Many sites have animations (moving graphics) and Flash movies
    (interactive animation). Website design is represented by a graphical site map.


    Web authoring programs (web page editors, HTML editors) create sophisticated websites.
    Some are WYSIWYG (what you see is what you get) editors.


    ![](img/17527690010086a83ec3d8f3ee262703_113_2.png)'
  merge: -1
  img_proc: true
