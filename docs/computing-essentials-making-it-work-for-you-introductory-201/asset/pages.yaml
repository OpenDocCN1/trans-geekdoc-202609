  md: '# Common Features


    Most applications provide a variety of features to make entering/presenting, ing,
    and formatting documents easy. Some of the most common features include:


    +   * Spell checkers—look for misspelled words

    * Alignment—either centers, right-aligns, or left-aligns numbers and characters

    * Font and font size (perhaps use character effects)—specifies the size and style
    of entered numbers and text

    * Tables—presents numbers and text in table format

    * Reports—provides a variety of different types and styles to report information


    ![](img/17527690010086a83ec3d8f3ee262703_93_0.png)


    +   * List three categories of application interface.

    * What is a graphical user interface? What are windows, menus, toolbars, and dialog
    boxes?

    * What is the Ribbon GUI? What are ribbons, tabs, and galleries?

    * Discuss some of the most common features in application programs.


    # General-Purpose Applications


    As mentioned previously, general-purpose applications include word processors,
    spreadsheets, database management systems, and presentation graphics.


    # Word Processors


    Word processors create text-based documents and are one of the most flexible and
    widely used tools. All types of people and organizations use word processors to
    create memos, letters, brochures and faxes. Organizations use to provide information
    to their customers. Students and researchers use word processors to create reports.
    Word processors can be used to create personalized web pages.


    Microsoft Word is the most widely used word processor. Other popular word processors
    include CorelWord, Apple Pages, OpenWriter, and Google Docs. Assume you have accepted
    a job as an advertising counselor for Adventure Travel Tours, a travel agency
    specializing in active adventure vacations. Your primary responsibilities are
    to coordinate and create the company’s promotional materials, including flyers
    and travel reports. To see how you could use Microsoft Word as the coordinator
    for the Adventure Travel Tours, see Figures 3-3 and 3-4.


    > Did you know that Microsoft provides thousands of free templates on its website?
    Here''s how to access a variety of templates from party invitations and exercise
    planners to professional communications.


    +   1. Connect to office.microsoft.com.

    2. Click the templates menu option at the top.

    3. Use the search feature or browse through a variety of categories.


    +   4 Once you find a template you want to, download it and open it in the appropriate
    MS Office program.


    To see other tips, visit our website at www.computing2014 and enter the keyword
    tips.'
