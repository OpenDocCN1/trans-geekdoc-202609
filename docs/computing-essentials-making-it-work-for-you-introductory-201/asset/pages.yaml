  md: '# Secondary Storage


    # Competencies


    After you have read this chapter, you should be able to:

    1 Distinguish between primary and secondary storage.

    2 Discuss the important characteristics of secondary storage including media,
    capacity, storage devices, and access speed.

    3 Describe hard-disk platters, tracks, sectors, cylinders, and head crashes.

    4 Compare internal and external hard drives.

    5 Discuss performance enhancements including disk caching, RAID, file compression,
    and file decompression.

    6 Define optical storage including compact discs, digital versatile discs, and
    Blu-ray discs.

    7 Define solid-state storage including solid-state drives, flash memory cards,
    and USB drives.

    8 Define cloud storage and cloud storage services.

    9 Discuss mass storage, mass storage devices, enterprise storage systems, and
    area networks.


    ![](img/17527690010086a83ec3d8f3ee262703_213_0.png)


    # Why should I read this chapter?


    One of the earliest secondary storage materials was the floppy disk, capable of
    storing less than one-megabyte of data. That''s not even enough to store one digital
    photograph! That was and this is now. Now, we can store data and information using
    a variety of different types of media including hard disks, optical discs, and
    solid-state devices like flash memory and USB drives.

    This chapter discusses a variety of different types of secondary


    storage including internal and external hard disks and a variety of optical discs
    including CDs, DVDs, and Blu-ray discs. Additionally, you''ll learn about the
    advantages and disadvantages of cloud storage. Also, you''ll learn about large
    capacity storage devices including file servers, network application servers,
    and RAID systems. To be competent and be competitive in today''s professional
    workplace, you need to know and to understand these things.


    ![](img/17527690010086a83ec3d8f3ee262703_213_1.png)'
