    but also larger computer systems and their information resources.


    # The Wireless Revolution


    The single dramatic change in connectivity and communications in the past few
    years has been the widespread use of mobile devices like smartphones and tablets
    with wireless Internet connectivity. Students, parents, teachers, businesspeople,
    and others routinely talk and communicate with these devices. It is estimated
    that over 1.5 billion smartphones are in use worldwide. Wireless technology allows
    individuals to stay connected with one another from almost anywhere.


    So what is the revolution? While wireless technology allows primarily for voice
    communications, today''s mobile computers support e-mail, web access, and a variety
    of Internet applications. In addition, wireless technology allows a wide variety
    of devices to communicate with one another without any physical connection. You
    can share a high-speed printer, share data files, and collaborate on working documents
    with a nearby co-worker without having your computers connected by telephone—wireless
    communication. Highspeed Internet wireless technology allows individuals to connect
    to the Internet and share information from almost anywhere in the world. (See
    Figure 8-1.) Is it a revolution? Most experts say yes and the revolution is just
    beginning.


    # Communication Systems


    Communication systems are electronic systems that transmit data from one location
    to another. Whether wired or wireless, every communication system has four basic
    elements. (See Figure 8-2.)


    +   - Sending and receiving devices. These are often a computer or specialized
    communication device. They originate (send) as well as accept (receive) messages
    in the form of data, information, and/or instructions.

    - Connection devices. These act as an interface between sending and receiving
    devices and the communication channel. They convert outgoing messages into packets
    that can travel across the communication channel.


    ![](img/17527690010086a83ec3d8f3ee262703_240_0.png)


    ![](img/17527690010086a83ec3d8f3ee262703_240_1.png)


    Figure 8-2 Basic elements of a communication system'
