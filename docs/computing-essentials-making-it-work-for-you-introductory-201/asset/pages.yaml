    # ### Home Networks


    While LANs have been widely used within organizations for years, they are now
    becoming used by individuals. Home networks allow different computers to share
    resources, including a common internet connection. Computers can be connected
    in a variety of ways, including electric wiring, telephone wiring, and special
    cables. One of the simplest ways, however, is wired or wireless.


    # ### Wireless LAN


    A wireless area network is typically referred to as a WLAN (LAN). It uses radio
    frequencies to connect computers and other devices. All communications pass through
    the network''s centrally located access point or base station. This access point
    interprets radio frequencies and routes communications to the appropriate devices.
    To see wireless home networks works, visit our website at www.computing2014.com
    and enter the keyword network.


    > Would you like to share files or view photos from anywhere in your home? Here
    are some typical ways in which this can be accomplished.


    +   1. Home network. Most operating systems make it relatively easy to set up
    a home network. In Windows, for example, the HomeGroup feature makes it easy to
    share photos, music, videos, and printers between all the computers in your home.

    2. Public folders. Certain feeders in the sharing system are designated as public
    folders. Any file copied here is accessible to any user in your computer and universally
    to anyone in your network.

    3. File sharing. You can configure the sharing settings for individual files (or
    folders) in your computer. This is done by right-clicking the file. When sharing,
    you can limit others to simply viewing the file (read only), or give them the
    ability to edit and delete it (readwrite).


    +   4. Media server/streaming. Many devices (including gaming consoles and new
    TVs) have the ability to look media stored on your home computer. Follow the manufacturer''s
    instructions to set up the streaming on your computer and then access the shared
    content from your console or TV.


    To see other tips, visit our website at www.computing2014.com and enter the keyword
    tips.


