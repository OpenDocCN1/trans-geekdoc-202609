  md: '# Tag and Caption Photo Gallery has the ability to detect faces in photos so
    that you can tag those individuals with a name. You are also encouraged to add
    a brief caption to each of your photos. Once these are done, you will be able
    to search your computer for photos by using a person''s name or any text in the
    caption.


    +   From the Home tab, click the Batch people tag. Photo Gallery may display some
    faces that you can start tagging. Otherwise, click the Tag link in the center
    of the window.


    +   Select a detected face, and click the Tag as button on the ribbon.


    +   Type a name in the box that appears, and press Enter. The face will immediately
    disappear because this individual is now tagged. This face will appear in your
    Home ribbon (for quick searches), and the name will be remembered for future tagging.


    +   Click the Close button on the ribbon once you have finished tagging all the
    detected faces.


    +   Double-click a photo in your collection. You are now in the Edit tab. Make
    sure the Tag and caption button is selected on the ribbon.


    Sharing/Uploading Photos You can share any of the photos and videos on your computer
    with friends by using popular services as Facebook and YouTube. Most notably is
    Microsoft''s free Skype Service, which you can sign up for using a Microsoft account.
    Follow these steps to upload all your photos to SkyDrive.


    +   Click the Create tab of the ribbon.


    +   Select all the photos you wish to upload (Ctrl + A selects all photos).


    +   Click the Skype button in the Publish ribbon and then sign in.


    +   Select the Large (1600px) option, and type the name for this new album. Click
    Publish.


