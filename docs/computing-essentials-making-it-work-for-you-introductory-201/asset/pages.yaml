  md: '# CLOUD COMPUTING


    # WEB UTILITIES


    ![](img/17527690010086a83ec3d8f3ee262703_83_0.png)


    | Plug-in | Source |

    | --- | --- |

    | Reader | get.adobe.com/reader |

    | Flash Player | get.adobe.com/flashplayer |

    | QuickTime | www.apple.com/quicktime |

    | Silverlight | www.microsoft.com/silverlight |


    Web utilities are specialized utility programs that make the Internet and the
    web easier and safer.


    Cloud computing uses the Internet and the web to shift many computer activities
    from the user''s computer to other computers on the Internet.


    # Plug-ins


    Plug-ins are automatically loaded and operate as part of a browser. Many websites
    require specific plug-ins to fully experience their content. Some plug-ins are
    included in today''s browsers; others must be installed.


    # Components


    There are three basic components to cloud computing:


    +   - Clients are corporations and end users who want access to data, programs,
    and storage.

    - The Internet provides the connection between the clients and providers. Two
    critical factors are the speed and reliability of the user''s access and the Internet''s
    capability to provide safe and reliable access.

    - Service providers are organizations connected to the Internet that are willing
    to provide access to software, data, and storage.


    # Filters


    Filters are used by parents and organizations to block certain sites and monitor
    the use of the Internet and the web.


    # File Transfer Utilities


    +   - File transfer utilities copy files to (downloading) and from (uploading).
    Three types are: File transfer protocol (FTP) and secure file transfer (SFTP)
    allow you to efficiently copy files across the Internet.

    - Web-based file transfer services use a web browser to upload and download files.

    - BitTorrent distributes files across many different computers.


    ![](img/17527690010086a83ec3d8f3ee262703_83_1.png)


    # Internet Security Suite


    An Internet security suite is a collection of utility programs to protect your
    privacy and security on the Internet.


    # CAREERS IN IT


    Webmasters develop and maintain websites and web resources. Bachelor''s or associate''s
    degree in computer science or information systems and knowledge of common programming
    languages and web development software are required. Salary range is $56,000


    CHAPTER 2'
