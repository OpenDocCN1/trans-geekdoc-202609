  md: '# A LOOK TO THE FUTURE


    Your Car''s Dashboard as a Powerful, Internet-Connected Computing Device


    Do you often wish that your car could provide information as quickly as your computer?
    Today, many of your cars'' functions are already governed by a computer located
    within the vehicle. That computer is responsible for safety and diagnostic features.
    However, compared to the apps and conveniences you enjoy on your notebooks, tablets,
    and smartphones, cars have fallen behind. For example, navigation systems that
    many-manufacturers offer are still often limited in comparison to modern computing
    devices.


    Imagine Apple or Google created a partnership with automobile manufacturers to
    place iPad or Android devices into the center of the main console. With Wi-Fi
    access to the internet as modern smartphones do, these vehicles would allow you
    to provide many services in safer and more integrated ways.


    One of the greatest benefits would be quick access to information, like real-time
    traffic updates, junk stores, and more. Next is access to all the apps that you
    expect to have. One example is the Pandora service, which allows you to stream
    de-supported music from artists that you create yourself. Why then listen to free
    radio or tune to stations when you can access your favorite online music services
    right from your dashboard? And best is the entertainment for your passengers or
    children. Some vehicles include screens that face the back seats, allowing parents
    to play DVDs for their children. Since many movies nowadays require an online
    streaming video service, wouldn''t it be


    more convenient to give your children access to the enormous library of cartoons
    and movies instead of bringing DVDs in and out each time you enter the vehicle?
    In fact, with a tablet interface, child could choose from a preset of movies or
    educational games depending on their mood.


    Now such a look at your fingers has the risk of distraction while you''re driving.
    There is no doubt that safety features must be built in to prevent accidents from
    occurring. However, there is plenty of technology that might work without having
    to divert your eyes from the road.


    In the same way ''Siri'' has revolutionized the way users interact with their
    phones, a similar system could be installed in the car dashboard. Drivers could
    simply speak, give commands to get the information they need and use the apps
    however they want. This complete computer system could


    allow the user This would allow the driver to recognize and send e-mails, social
    media updates, and today''s news and weather alerts while


    Some companies have already taken a step towards implementing this technology.
    Voice recognition in-car with a feature called MyFord Touch has already added
    connectivity. In its next move, ''the real breakthrough will come when your car''s
    dashboard becomes as useful and versatile as an Android tablet and the vehicle
    can connect to Wi-Fi and networks.'' According to Car and Drive magazine, this
    might happen within the next five years. When it comes, will you find yourself
    paying for this upgrade in your ''new car''? Are you willing to pay for it if
    it requires another money, or ''from a wireless device?''


