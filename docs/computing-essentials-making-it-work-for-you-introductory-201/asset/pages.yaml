    Other recommendations to avoid physical discomfort are


    +   * **Eystrain and headache:** To make the computer easier on the eyes, take
    a 15-minute break hour or two. Keep everything you''re working on at the same
    distance. For example, the computer screen, keyboard, and a document holder containing
    your work might be positioned at 20 inches away. Clean your screen of dust from
    time to time.

    * **Back and neck pain:** To help avoid back and neck problems, make sure your
    equipment is adjustable. You should adjust your chair for height and angle, and
    the chair should have good back support. The monitor should be at eye level or
    slightly below eye level. Use a footrest, if necessary, to reduce leg fatigue.

    * **Repetitive strain injury:** Repetitive strain injury (RSI) is any injury that
    is caused by fast, repetitive work that can generate neck, wrist, hand, and arm
    pain. RSI is by the greatest cause of workplace illnesses resulting in compensation
    claims totaling billions of dollars and lost productivity every year.\ One particular
    type of RSI, carpal tunnel syndrome, found among heavy computer users, consists
    of damage to nerves and tendons in the hands. Some victims report that the pain
    is so intense that they cannot open doors or shake hands and that they require
    corrective surgery. Ergonomically correct keyboards have been developed to help
    prevent injury from heavy computer use.(See Figure 6-32.) In using ergonomic keyboards,
    you should take frequent short rest breaks and gently massage your hands.


