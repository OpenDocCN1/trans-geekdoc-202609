  md: '# VISUAL SUMMARY


    # Communications and Networks


    # COMMUNICATIONS


    # COMMUNICATION CHANNELS


    ![](img/17527690010086a83ec3d8f3ee262703_259_0.png)


    Communications is the process of sharing data, programs, and information between
    two or more computers. Applications include e-mail, texting, Internet telephones,
    and electronic commerce.


    Communication channels carry data from one computer to another.


    ![](img/17527690010086a83ec3d8f3ee262703_259_1.png)


    # Physical Connections


    Physical connections use a solid medium to connect sending and receiving devices.
    Connections include twisted pair (telephone lines and Ethernet cables), coaxial
    cable, and fiber-optic cable.


    # Connectivity


    Connectivity is a concept related to using computer networks to link people and
    resources. You can link or connect to large computers and the Internet, providing
    access to extensive information resources.


    # Wireless Connections


    Wireless connections do not use a solid substance to connect devices. Most use
    radio waves.


    +   - Bluetooth—transmits data over short distances; used for wireless headsets,
    printers, and handheld devices.

    - Wi-Fi (wireless fidelity)—uses high-frequency radio signals; most home and business
    networks use Wi-Fi.

    - Microwave—line-of-sight communication; used to send data between buildings;
    longer distances require microwave stations.

    - WiFi (Worldwide Interoperability for Microwave Access)—extends the range of
    Wi-Fi networks using microwave connections.

    - LTE (Long Term Evolution)—currently has similar performance to WiFi; promises
    to provide greater speed and quality transmissions in the near future.

    - Satellite—uses microwave relay stations in the sky; GPS (global positioning
    system) tracks geographical locations.

    - Infrared—uses light waves over a short distance; line-of-sight communication.


    # The Wireless Revolution


    Mobile devices like smartphones and tablets have brought dramatic changes in connectivity
    and communications. These wireless devices are becoming widely used for computer
    communication.


    # Communication Systems


    Communication systems transmit data from one location to another. Four basic elements
    are


    +   - Sending and receiving devices

    - Communication channel (transmission medium)

    - Connection (communication) devices

    - Data transmission specifications


    232 CHAPTER 8'
