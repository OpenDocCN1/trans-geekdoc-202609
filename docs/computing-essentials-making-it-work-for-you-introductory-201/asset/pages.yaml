    # # Pointing Devices


    Pointing is one of the most natural of all human gestures. Pointing devices provide
    an intuitive interface with the system unit by accepting pointing gestures and
    converting them into machine-readable input. There is a wide variety of different
    devices, including the mouse, joystick, touch screen, and stylus.


    # Mice


    A mouse controls a pointer that is displayed on the monitor. The mouse pointer
    usually appears in the shape of an arrow. It frequently changes shape, depending
    on the application. A mouse can have one, two, or more buttons, which are used
    to select command options and control the mouse pointer on the monitor. Some mice
    have a wheel button that can be rotated to scroll through information that is
    displayed on the monitor.


    Although there are several different designs, the optical mouse is the most widely
    used. It emits and senses light to detect mouse movement. Traditionally, the detected
    movements are communicated to the system unit through a cord. Alternatively, the
    cordless or wireless mouse uses radio waves or infrared light to communicate with
    the system unit. (See Figure 6-3.) These devices eliminate the mouse cord and
    free desk space.


    Three devices similar to a mouse are trackballs, touch pads, and pointing sticks.


    +   * Trackballs control the pointer by rotating a ball with your thumb. (See
    Figure 6-4).


    ![](img/17527690010086a83ec3d8f3ee262703_183_0.png)


