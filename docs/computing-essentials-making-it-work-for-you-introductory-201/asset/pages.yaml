- pgno: 231
  md: '# SOLID-STATE STORAGE


    # CLOUD STORAGE


    ![](img/17527690010086a83ec3d8f3ee262703_231_0.png)


    Solid-state storage devices have no moving parts and are more reliable and require
    less power than hard disks.


    With cloud computing, the Internet acts as a "cloud" of servers that supply applications
    to clients as a service rather than a product. Cloud storage (online storage)
    is supplied by servers.


    # Solid-State Drives


    Solid-state drives are similar to internal hard-disk except they use solid-state
    memory; they are faster, more durable, and more expensive; and generally provide
    less capacity.


    +   - Examples include Google Docs for word processing and spreadsheets, Mint.com
    for financial management, and Amazon S3 for storage data.

    - Cloud servers provide storage, processing, and memory.

    - With cloud computing software, installation and upgrade are avoided.


    # Flash Memory Cards


    Flash memory cards are small solid-state storage devices that are widely used
    with notebook computers. They are used with a variety of specialized input devices
    including digital cameras to store and transfer images and digital media players
    like the iPod to store and transfer music and video files.


    # MASS STORAGE DEVICES


    Mass storage refers to the tremendous amount of secondary storage required by
    large organizations. Mass storage devices are specialized high-capacity second-ary
    devices.


    # USB Drives


    USB drives (flash drives) are so small that they fit onto a key ring. These connect
    to a computer''s USB port and are widely used to transfer data and information
    between computers, specialty devices, and the Internet.


    Most large organizations have established a strategy called an enterprise storage
    system to promote efficient and safe use of data across the networks within their
    organizations.


    Mass storage that support this strategy are file servers, network attached storage
    (NAS), RAID systems, tape libraries, and organizational cloud storage. A storage
    area network (SAN) is a method of using enterprise-level remote storage systems
    as if they were local to your computer.


    ![](img/17527690010086a83ec3d8f3ee262703_231_1.png)


    # CAREERS IN IT


    Disaster recovery specialists are responsible for recovering systems and data
    after a disaster strikes an organization. Bachelor''s or advanced specialized
    degree in information systems or computer science, experience, and additional
    skills in the areas of networking, security, and database administration are desirable.
    Salary range is $70,000 to $103,000.


    CHAPTER 7'
