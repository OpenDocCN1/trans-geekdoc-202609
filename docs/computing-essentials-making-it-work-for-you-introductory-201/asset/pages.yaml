- pgno: 26
  md: '# About the Authors


    Tim and Linda O''Leary live in the American Southwest and spend much of their
    time engaging instructors and students in conversation about learning. In fact,
    they have been talking about learning for over 25 years. Something in those early
    conversations convinced them to write a book, to bring their interest in the learning
    process to the printed page. Today, they are as concerned as ever before about
    learning, technology, and about the challenges of presenting material in new ways,
    in terms of both content and method of delivery.


    ![](img/17527690010086a83ec3d8f3ee262703_26_0.png)


    A powerful and creative team, Tim combines his 25 years of classroom teaching
    experience with Linda''s background as a consultant and corporate trainer. Tim
    has taught courses at Stark Technical College in Canton, Ohio, and at Rochester
    Institute of Technology in upstate New York, and is currently a professor emeritus
    at Arizona University in Tempe, Arizona. Linda offered her expertise at ASU for
    several years as an academic advisor. She also presented and developed materials
    for major corporations such as Motorola, Intel, Honeywell, and AT&T, as well as
    various community colleges in the Phoenix area.


    Tim and Linda have talked to and taught numerous students, all of them with a
    desire to learn something about computers and applications that make their lives
    easier, more interesting, and more productive.


    Each new edition of an O''Leary text, supplement, or learning aid has benefited
    from these students and their instructors who daily stand in front of them (or
    over their shoulders). *Computing Essentials* is no exception.'
