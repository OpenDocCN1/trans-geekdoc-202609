  md: '# VISUAL SUMMARY


    The Internet, the Web, and Electronic Commerce


    # INTERNET AND WEB


    # ACCESS


    ![](img/17527690010086a83ec3d8f3ee262703_80_0.png)


    ![](img/17527690010086a83ec3d8f3ee262703_80_1.png)


    # Internet


    Launched in 1969 with ARPANET, the Internet consists of the actual physical network.


    Once connected to the Internet, your computer seemingly becomes an extension of
    a giant computer that branches all over the world.


    # Web


    Introduced in 1991 at CERN, the web provides a multimedia interface to Internet
    resources. Three generations: Web 1.0 (existing information), Web 2.0 (content
    creation and social interaction), Web 3.0 (computer-generated information).


    # Providers


    Internet service providers are connected to the Internet, providing a path for
    individuals to access the Internet. Connection technologies include DSL, cable,
    and wireless modems.


    # Common Uses


    # Browsers


    Browsers allow accessing the web to surf or explore. Some related terms are


    The most common uses of the Internet and the web include


    +   - Communication—the most popular Internet activity.

    - Shopping—one of the fastest-growing Internet activities.

    - Searching—access libraries and local, national, and international news.

    - Education—e-learning or taking online courses.

    - Entertainment—music, movies, magazines, and computer games.


    +   - URLs—commands or addresses to web resources; two parts as protocol and domain
    name; top-level domain (TLD) or suffix identifies type of organization.

    - HTML—commands to display web pages; hyperlinks (links) are connected.

    Technologies providing interactive, animated websites include cascading style
    sheets, or CSS (to control the appearance of web pages); JavaScript (to trigger
    interactive features); AJAX (to create responsive interactive websites); and applets
    (to present animation, display graphics, provide interactive games, and more).
    Mobile browsers run on portable devices.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'To be a competent end user, you need to be aware of resources available on
    the Internet and web, to be able to access these resources, to communicate electronically,
    to efficiently locate information, to understand electronic commerce, and to use
    web utilities.


    # COMMUNICATION


    # COMMUNICATION


    ![](img/17527690010086a83ec3d8f3ee262703_81_0.png)


    ![](img/17527690010086a83ec3d8f3ee262703_81_1.png)


    # E-mail


    E-mail (electronic mail) is the transmission of electronic messages. There are
    two basic types of e-mail accounts:


    +   * Client-based e-mail accounts use e-mail clients installed on your computer.

    * Web-based e-mail accounts use webmail clients located on the e-mail provider''s
    computer. This is known as webmail.


    A typical e-mail has three basic elements: header (including address, subject,
    and perhaps attachment), message, and signature.

    Spam is unwanted and unsolicited e-mail that may include a virus or destructive
    programs often attached to unsolicited e-mail. Spam blockers, also known as spam
    filters, are programs that identify and eliminate spam.


    # Messaging


    While e-mail is the most widely used, two other messaging systems are:


    +   * Text messaging—sending short electronic messages between mobile devices.

    * Instant messaging (IM)—supports live communication between friends.


    # Social Networking


    Social networks connect individuals to one another. Many sites offer a variety
    of activities. The three best known are Facebook (provides access to Facebook
    Profiles, Facebook Pages, and Facebook groups), Google+ (provides access to Circles,
    Hangouts, and Sparks), and LinkedIn.


    # Blogs, Webcasts, and Wikis


    Other sites that help individuals communicate across the web are blogs, microblogs,
    webcasts, and wikis,


    +   * Blogs (web logs) and microblogs are online journals that support chronological
    postings. Unlike blogs that often contain detailed postings, microblogs publish
    short, concise sentences. Twitter is the most popular blogging site.

    * Webcasts and podcasts deliver audio, video, and other media content over the
    Internet. Unlike podcasts, webcasts use streaming technology.

    * A wiki is a website designed to allow visitors to use their browsers to edit,
    or delete the site''s content. Wikis are often used to support collaborative writing
    in which there is a community of interested contributors. Wikipedia is one of
    the most popular wikis.'
