  md: '# Utilities


    Ideally, microcomputers would continuously run without problems. However, that
    simply is not the case. All kinds of things can happen—internal hard disks can
    crash, computers can freeze up, operations can slow down, and so on. These events
    can make computing very frustrating. That''s where utilities come in. Utilities
    are specialized programs designed to make computing easier. There are hundreds
    of different utilities. Most most are


    +   - Troubleshooting or diagnostic programs that recognize and correct problems,
    ideally before they become serious. To learn more about using a troubleshooting
    program, see Making IT Work for Your: Windows Task Manager on pages 105 and 106.

    - Antivirus programs that guard your computer system against viruses or damaging
    programs that can invade your computer system.

    - Backup programs that make copies of files to be used in the case the originals
    are lost or damaged.

    - File compression programs that reduce the size of files so they require less
    storage space and can be sent more efficiently over the Internet.


    Most operating systems provide some utility. Even more powerful utilities can
    be purchased separately or in utility suites.


    Have you experienced problems installing a new program or changing system settings?
    If so, the System Restore can help by reversing the changes and bringing your
    computer to a previous point in time. For Windows 7:


