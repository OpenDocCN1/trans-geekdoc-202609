    # Content Evaluation


    Search engines are excellent tools to locate information on the web. Be careful,
    however how you use the information you find. Unlike published material found
    in newspapers, journals, and textbooks, not all the information you find on the
    web has subjected to strict guidelines to ensure accuracy. In fact, anyone can
    publish content on the web. Many sites, such as Wikipedia.org, allow anyone to
    post new material, anonymously and without critical evaluation. To learn how you
    can publish on the web, visit our website at www.computing2014.com and enter the
    keyword blog.


    To evaluate accuracy of information you find on the web, consider the following:


    +   - **Authority.** Is the author an expert in the subject area? Is the official
    site for the information presented, or is the site an individual''s personal website?

    - **Accuracy.** Has the information critically reviewed for correctness prior
    to posting on the web? Does the website provide a method to report inaccurate
    information to the author?

    - **Objectivity.** Is the information factually reported or does the author have
    a bias? Does the author appear to have a personal agenda aimed at convincing or
    changing the reader''s opinion?

    - **Currency.** Is the information updated up to date? Does the site specify the
    date the site was updated? Are the site''s links operational? If not, the site
    is most likely not being actively maintained.


