  md: '# Careers in IT


    IT security analysts are responsible for maintaining the security of a company''s
    network, systems, and data. Their goal is to ensure the confidentiality, integrity,
    and availability of information. These analysts must safeguard information systems
    against a variety of external threats, such as hackers and viruses, as well as
    be vigilant of threats that may come from the company.


    Employers typically look for candidates with a bachelor''s or specialized associate''s
    degree in information systems or computer science. Experience in this field or
    in network administration is usually required. IT security analysts should possess
    good communication and research skills, and be able to handle high-stress situations.


    IT security analysts can expect to earn an annual salary of $62,000 to $101,000.
    Opportunities for advancement typically depend on experience. Demand for this
    position is expected to grow as malware, hackers, and other types of threats become
    more complex and prevalent. To learn about other careers in information technology,
    visit us at www.computing2014.com and enter the keyword careers.


    ![](img/17527690010086a83ec3d8f3ee262703_292_0.png)


    Now that you have learned about privacy, security, and ethics, let me tell you
    about my career as an IT security analyst.'
