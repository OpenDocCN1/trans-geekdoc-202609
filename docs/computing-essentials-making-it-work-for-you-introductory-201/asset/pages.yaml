- pgno: 340
  md: 'Virtual machine: A software implementation of a computer that executes programs
    like a physical computer.


    **Virtual memory:** Feature of an operating system that increases the amount of
    memory available to run programs. With large programs, parts are stored on a secondary
    device like your hard disk. Each part is read in RAM when needed.


    **Virtual private network (VPN):** Creates a secure connection between a router
    and an internal network. Special VPN protocols create the equivalence of a dedicated
    line between a user''s home laptop and a computer server.


    **Virtual reality (VR):** Interactive sensory equipment (head and goggles) allowing
    users to experience realistic environments in 3-D by computer, thus imitating
    the physical world.


    **Virtual reality:** An immersive experience where you are viewing simulations
    in stereoscopic.


    **Virtualization:** A process that allows a single computer to support multiple
    operating systems that operate independently.


    **Virtualization software:** Software that creates virtual machines.


    Viruses: Hidden threats that migrate through networks and operating systems and
    become embedded in different programs. They may be used to destroy data or display
    messages.


    **Voice over IP (VoIP):** Transmission of telephone calls over networks.


    **Voice recognition system:** Using a microphone, sound card, and software, the
    user can operate a computer using voice commands.


    **Voiceband:** Bandwidth of a telephone line. Known as low bandwidth.


    **Voltage surge (spike):** Excess of electricity that may destroy or damage other
    electronic components.


    VR: Virtual reality.


    # W


    WAN: Wide area network.


    **Wan reader:** Special-purpose hardware device used to read OCR characters.


    **Warm boot:** Restarting the computer that is already on or when the power is
    not turned off.


    Web: In 1992, and prior to the Web interface that included graphics, animations,
    sound, and video.


    **Web 1.0:** The first generation of the web, which focused on linking information.


    Web 2.0: The second generation of the web, which evolved to support more dynamic
    content and social interactions.


    Web 3.0: The third generation of the web, which focuses on computer-generated
    information requiring less human interaction to locate and integrate information.


    **Web auction:** Similar to traditional auctions except that occur over the web;
    buyers and sellers face-to-face.


    **Web authoring:** Creating a website. Web program for creating web pages. Also
    called HTML or web editor. widely used web editors include Media Dreamweaver and
    Microsoft Frontend.


    **Web-based email:** An account that does not require an e-mail program to be
    installed on your


    **Web-based email client:** A special program that communicates with the email
    provider and must be installed on the computer.


    **Web-based file transfers:** A type of file service that uses a browser to upload
    and download files, copying all files to and from your computer over the Internet.


    **Web bug:** Hidden in the HTML code for a web page or message. A web browser
    may prevent a user from visiting a website with bug or opens an unexpected file.
    They collect information on users and report to a predefined service.


    **Web log:** A type of website where articles are regularly posted.


    **Web page:** Browsers interpret HTML documents to display pages.


    **Web page editor:** Web authoring.


    **Web utilities:** Specialized programs making the Internet and web use easier.
    Some are plug-ins that operate as part of a browser and filters that block access
    or monitor selected websites.


    **Webcam:** Specialized video camera for capturing images and broadcasting to
    the Internet.


    **Webcast:** An Internet delivery that uses streaming technology, in audio and
    video files are continuously downloaded to the computer while the user is listening
    to or viewing the file.


    **Webmail:** A service that uses a web client.


    **Webmail:** A special program that runs on an e-mail provider''s computer that
    supports web.


    **Webmasters:** Maintaining websites and web resources.


    **WebOS:** A mobile operating system that supports Hewlett-Packard''s smartphones
    and tablets.


    **What-if analysis:** Spreadsheet feature in which changing one or more results
    results in the automatic calculation of all related formulas.


    **Wheel mouse:** Some mice have a wheel button that can rotate to scroll through
    information displayed on the monitor.


    **Wide area network (WAN):** Worldwide and wide networks that use microwave relays
    and satellites to reach users long distances.


    **Wi-Fi (wireless fidelity):** Wireless also known as 802.11, used to connect
    computers to each other and to the Internet.


    # Glossary


    # 313'
