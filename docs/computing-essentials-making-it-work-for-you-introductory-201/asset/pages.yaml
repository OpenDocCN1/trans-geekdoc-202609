  md: '# ethics


    Individuals and governments are continually attempting to gain unauthorized access
    to certain private networks. Sometimes the objective is simply to create mischief,
    other times, to steal information or compromise security. While some would say
    any type of unauthorized intrusion is unethical, others under certain circumstances
    (such as homeland security), this intrusion would be ethical and essential. To
    see more ethical issues, visit our website at www.computing2014.com and enter
    the keyword ethics.


    # Network Security


    Large organizations face the challenge of ensuring that all authorized users have
    access to network resources, sometimes from multiple geographic locations or the
    Internet. Securing large computer networks requires specialized technology. Three
    technologies commonly used to ensure network security are firewalls, intrusion
    detection systems, and virtual private networks.


    +   * A firewall consists of hardware and software that control access to a company''s
    intranet and other networks. Most use software or a special computer called a
    proxy server. All communications between the company''s internal networks and
    the outside world pass through this server. By evaluating the source and the content
    of each communication, the proxy server decides whether it is safe to let a particular
    message or file pass into or of the organization''s network. (See Figure 8-2).

    * Intrusion detection systems (IDS) work with firewalls to protect an organization''s
    network. These systems use sophisticated statistical techniques to analyze all
    incoming and outgoing network traffic. Using advanced pattern matching and heuristics,
    an IDS system can recognize signs of a network attack and disable access before
    an intruder can do damage.


    ![](img/17527690010086a83ec3d8f3ee262703_255_0.png)


    Figure 8-22 Intranets, extranets, firewalls, and proxy servers'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'Virtual private networks (VPN) create a secure connection between a remote
    user and an organization''s internal network. Special VPN protocols create the
    equivalent of a dedicated line between a user''s home or notebook computer and
    a company server. The connection is heavily encrypted, and, from the perspective
    of the user, that the workstation is actually located on the corporate network.
    To see how you can set up remote access, see Making IT for Your Remote Access
    on page 230.


    Like organizations, end users have security challenges and concerns. We need to
    be concerned about the privacy of our personal information. In the next chapter,
    we will discuss personal firewalls and other ways to protect privacy and security.


    # concept check


    +   - What are internet technologies? Compare intranets and extranets.

    - What is a firewall? What is a proxy server?

    - What are intrusion detection systems?

    - What are virtual private networks?


    # Careers in IT


    **Network administrators** manage a company''s LAN and WAN networks. They may
    be responsible for design, implementation, and maintenance of networks. Responsibilities
    usually include maintenance of both hardware and software related to a company''s
    intranet and Internet networks. Network administrators are typically responsible
    for diagnosing and repairing problems with these networks. Some network administrators
    are responsible for planning and implementation of network security as well.


    Employers typically look for candidates with a bachelor''s or an advanced degree
    in computer science, computer technology, or information systems as well as practical
    networking experience. Experience with network security and maintenance is preferred.
    Technical certification may also be helpful in obtaining this position. Because
    network administrators are involved directly with people in many departments,
    good communication skills are essential.


    Network administrators can expect to earn an annual salary of $46,000 to $84,000.
    Opportunities for advancement typically include upper-management positions. This
    position is expected to be among the fastest-growing jobs in the near future.
    To learn about careers in information technology, visit us at www.computing2014.com
    and enter the keyword careers.


    ![](img/17527690010086a83ec3d8f3ee262703_256_0.png)


    Now that you have learned about computer communications and networks, let me tell
    you about my career as a network administrator.'
