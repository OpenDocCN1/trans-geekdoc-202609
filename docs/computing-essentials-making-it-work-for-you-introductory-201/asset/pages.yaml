    # ## Audio and Video Devices


    Audio-output devices translate audio information from the computer into sounds
    that people can understand. The most widely used audio-output devices are **speakers**
    and **headsets**. (See Figure 6-26.) These devices are connected to an audio jack
    on the system unit. The sound card is used to capture as play back recorded sounds.
    Audio-output devices are used to play music, vocalize translations from one language
    to another, and communicate from the computer system to users.


    Creating voice input is nowhere as difficult as recognizing and interpreting voice
    input. In fact, voice output is quite common. It is used with many soft-drink
    machines, telephones, and cars. It is used as a reinforcement tool for learning,
    such as to help students study a foreign language. It is also used in many supermarkets
    at the checkout counter to confirm purchases. One of its most powerful capabilities
    is to assist the physically challenged.


    # **Portable Media Players**


    **Portable media players**, also known as digital media players, are electronic
    devices for storing and playing digital media. Some of the best-known specialized
    audio and video players are the Apple iPod, Creative Zen, and Microsoft Zone.
    (See Figure 6-27.)


    One of the most recent applications for portable media players is to watch live
    TV. This is possible through **mobile digital television (mobile DTV)** technology,
    which allows television stations to broadcast their programming directly to smartphones,
    computers, and **digital media players**. Now, many people use their smartphones
    to provide the functionality of dedicated portable media players.


    # ## Combination Input and Output Devices


    Many devices combine input and output capabilities. Sometimes this is done to
    save space. Other times it is done for very specialized applications. Common-combination
    devices include multifunctional devices, Internet phones, and robots.


    Figure 6-26 Headset


    Figure 6-27 Digital media player


