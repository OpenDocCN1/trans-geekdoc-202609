- pgno: 247
  md: '# DNS


    Figure 8-12 DNS converts text-based addresses to numeric IP addresses


    # Protocols


    For data transmission to be successful, sending and receiving devices must follow
    a set of communication rules for the exchange of information. These rules for
    exchanging data between computers are known as protocols.


    As discussed in Chapter 2, http, or hypertext transfer protocol, similar to https,
    or hypertext transfer protocol secure, is becoming widely used to protect the
    transfer of sensitive information. Another widely used Internet protocol is TCP/IP
    (transmission control protocol/Internet protocol). The essential features of this
    protocol involve (1) identifying sending and receiving devices and (2) breaking
    information into small parts across the Internet.


    +   * Identification: Every computer on the Internet has a unique address called
    an IP address (Internet protocol address). Similar to the way a postal service
    uses addresses to deliver mail, the Internet uses IP addresses to deliver e-mail
    and locate websites. Because these addresses are difficult for people to remember
    and use, a system was developed to automatically convert text-based addresses
    to numeric IP addresses. This system uses a domain name server (DNS) that converts
    text-based addresses to IP addresses. For example, whenever you enter a URL, www.computing2014.com,
    a DNS converts this to an IP address before a connection can be made (see Figure
    8-12).


    +   * Packetization: Information sent or transmitted across the Internet usually
    travels through numerous interconnected networks. Before the message is sent,
    it is reformatted or broken down into small parts called packets. Each packet
    is sent separately over the Internet, possibly traveling different routes to one
    destination. At the receiving end, the packets are reassembled into the correct
    order.


    ```

