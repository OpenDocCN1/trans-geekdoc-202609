  md: 'Although these web browsers fail concern many individuals, other threats could
    potentially violate your privacy. Web bugs, which are invisible images or HTML
    code hidden within a web page or e-message, can be used to transmit information
    without your knowledge. When a user opens an e-mail containing a web bug, information
    is sent back to the source of the bug. The receiver will now know that one of
    the most common web bugs is used by companies that sell mailing lists to spammers.
    Because of this deception, e-mail programs now block images and HTML code from
    unknown senders. It is up to you decide what content to display for current and
    future times. To see how web bugs work, visit our website at www.computing204.com
    and learn more.


    The most dangerous type of privacy threats is in the form of spyware. The program
    spyware is used to collect a wide range of programs that are designed to secretly
    report and monitor an individual''s activities online. Some of these programs
    can make changes to your browser in order to deceive and manipulate you while
    using online. Computer monitoring software, also known as keyst logger, is the
    most invasive and dangerous type of spyware. They record every activity and keystroke
    on your computer system, including credit card numbers, passwords, and e-mail
    messages. Computer monitoring software can be deposited on your hard drive without
    your knowledge by malicious software or by installing the program directly. While
    deadly in the hands of criminals, it can be used by companies monitoring employees
    or law enforcement officials who are collecting evidence.


    Unfortunately, many spyware programs go undetected, largely users have no idea
    they are infected. Spyware will run on your device. Others disguise themselves
    as useful software, such as a security program. Various studies have demonstrated
    that alarming number of computers infected with spyware. The financial impact
    to individuals, companies, and financial institutions is estimated at billions
    of dollars.


    One of the best defenses against spyware is to exercise caution when visiting
    websites and downloading software from an unknown source. Another defense involves
    using a category of software known as antispyware or removal programs, which are
    designed to detect and remove various types of privacy threats. (See Figure 9-9.)
    For a list of some of these programs, see Figure 9-10.


    +   - Select the Tools button.


    +   - Choose Safety.


    +   - Choose Desktop browsing.


    +   - Select boxes for items to be deleted.


    +   - Choose Delete.


