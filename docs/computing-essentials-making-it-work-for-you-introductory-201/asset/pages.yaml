  md: '# Making work for you


    # # E-BOOKS


    **Benefits of E-books** Because e-books are digital, they offer a wide range of
    benefits:


    +   * Transporting. Books can take up a large volume of space in any home (or
    your school bag). With e-books, you can store over a thousand books in one small
    device!


    +   * Searching. Type any keyword, and you will be taken to the page(s) where
    that word appears. This is much faster than using an index.


    +   * Bookmarking. Mark any number of pages as important. This is an improvement
    over having countless physical bookmarks or folded pages.


    +   * Adding highlights and notes. All marks on an e-book are digital. They can
    be added and removed easily. The same could not be said for physical textbooks.


    +   * Purchasing. Buying an e-book can take less than a minute, as it is downloaded
    instantly to your device. Prices also tend to be lower than for physical books.


    **Reading E-books** Once you decide to purchase an e-book, you may be surprised
    by the number of devices you can use to read it.


    +   * E-book reader. Dedicated e-book readers, such as the Amazon Kindle and the
    Barnes & Noble, can be purchased for less than $100. If it is important for you
    to read in direct sunlight or with heavy lighting, the e-ink used by these devices
    will be desirable.


    +   * Smartphones and tables. Do you already have a smartphone or tablet that
    you take everywhere? If so, you may want to download the free apps from e-book
    sellers to avoid the cost of a e-reader. The reading experience on these apps
    is excellent with the touch-screen interface present in these devices.


    +   * Notebook and desktop computers. Many ebook retailers make apps for your
    computer, such as Google allow you to read books purchased from their Google Play
    store with nothing more than a web browser.


    Most e-book sellers offer the synchronization of your e-books and notes with their
    cloud services. This allows you to start reading a book using your table, for
    example, and pick up where you left off with your smartphone.


    The web is constantly changing, and some of the specifics presented in this Making
    IT Work for you may have changed. To learn about other ways to make information
    technology work for you, visit our website at www.computing2014.com and enter
    the keyword miltw.


