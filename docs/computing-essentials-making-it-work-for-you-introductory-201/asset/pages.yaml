    # Character and Mark Recognition Devices


    Character and mark recognition devices are scanners that are able to recognize
    special characters and marks. They are specialty devices that are essential tools
    for certain applications.


    +   - Magnetic-ink character recognition (MICR)—used by banks to automatically
    read these unusual numbers on the bottom of checks and deposit slips. A special-purpose
    machine known as a reader/sorter reads these numbers and provides input that allows
    banks to efficiently maintain customer accounts.


    +   - Optical-character recognition (OCR)—uses special preprinted characters that
    can be read by a light source and changed into machine-readable code. A common
    OCR device is the handheld wand reader. (See Figure 6-13). These are used in department
    stores to read retail price tags by reflecting light on the printed characters.


    +   - Optical-mark recognition (OMR)—senses the presence or absence of a mark,
    such as a pencil mark. OMR is often used to standardize multiple-choice tests.


    ![](img/17527690010086a83ec3d8f3ee262703_187_0.png)


    Figure 6-12 RFID reader


    ![](img/17527690010086a83ec3d8f3ee262703_187_1.png)


    Figure 6-13 Wand reader


    # Image Capturing Devices


    Optical scanners, like traditional copy machines, can make a copy from an original.
    For example, an optical scanner can make a digital copy of a photograph. Image
    capturing devices, on the other hand, create or capture original images. These
    devices include digital cameras and digital video cameras.


