- pgno: 181
  md: '# Introduction


    How do you send instructions and information to the CPU? How do you get information
    out? Here we describe one of the most important places where computers interface
    with people. We input text, mouse, and even speech, but we probably never think
    about the relationship between what we enter and what the computer processes.
    People understand language, which is constructed of letters, numbers, and punctuation
    marks. However, at a basic level, computers can understand only the binary language
    of 0s and 1s. Input devices translate numbers, letters, and actions that people
    understand into a form that computers can process.


    ![](img/17527690010086a83ec3d8f3ee262703_181_0.png)


    Have you ever wondered how information processed by the system is converted into
    a form that you can use? That is the role of output devices. Input devices convert
    what we understand into what the system unit can process, output devices convert
    what the system unit has into a form that we can understand. Output devices translate
    machine language into letters, numbers, sounds, and images people can understand.


    Hi, I''m Marie, and I''m a technical writer. I''d like to talk with you about
    input and output devices.... all those devices that help us communicate with a
    computer. I''d also like to talk about emerging technologies such as robotics
    and virtual reality.


    Competent users need to know about the most commonly used input devices, including
    keyboards, mice, scanners, digital cameras, voice recognition, and audio-input
    devices. Additionally, they need to know about most commonly used output devices,
    monitors, printers, and audio-output devices. End users need to be aware of combination
    input and output devices such as multifunctional devices and Internet telephones.


    # What Is Input?


    Input is any data or instructions that are used by a computer. They can come directly
    from you or from other sources. You provide input whenever you use system or application
    programs. For example, when using a word processing program, you enter data in
    the form of numbers and letters and issue commands as to save and print documents.
    You can also enter data and issue commands by pointing to items or using your
    voice. Other sources of input include scanned or photographed images.


    Input devices are hardware used to translate words, sounds, images, and actions
    that people understand into a form that the system unit can process. For example,
    when using a word processor, you typically use a keyboard to enter text and a
    mouse to issue commands. In addition to keyboards and mice, there are a wide variety
    of other input devices. These include pointing, scanning, image capturing, and
    audio-input devices.


    # Keyboard Entry


    One of the most common ways to input data is by keyboard. As Mentioned in Chapter
    5, keyboards convert numbers, letters, and special characters that people understand
    into electrical signals. These signals are sent to, and processed by, the system
    unit. Most keyboards use an arrangement of keys'
