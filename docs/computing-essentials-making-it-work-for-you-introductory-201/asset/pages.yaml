    Filters


    Filters block access to selected sites. The Internet is an interesting and multifaceted
    arena. But one of these facets is a dark and undesirable area. Parents, in particular,
    are concerned about children unrestricted across the Internet. Filters allow parents
    as organizations to block selected sites and set time limits (See Figure 2-23).
    Additionally, these programs can monitor and generate reports detailing the total
    time spent on the Internet and the time spent at individual websites. For a list
    of some of the best-known filters, see Figure 2-24.


    Figure 2-22 Plug-in sites


    # File Transfer Utilities


    Using file transfer software, you can copy files from your computer to specially
    configured servers. This is called downloading. You can also use file transfer
    software to copy files from your computer to another computer on the Internet.
    This is uploading. Three popular types of file transfer are FTP, web-based, and
    BitTorrent.


    # ethics


    Most agree that it is ethical and prudent to shield young children from violent
    or sexual internet content by using software that filters such content. Parents
    of older children have installed computer monitoring software that records all
    children''s activities. They believe this is warranted because they need to know
    what their kids are doing online. Do you believe it is ethical to parent your
    kids? To see other ethical issues, visit our website at www.computing2014 and
    enter the keyword ethics.


