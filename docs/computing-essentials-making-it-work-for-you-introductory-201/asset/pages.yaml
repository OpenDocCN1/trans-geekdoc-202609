  img_proc: true
- pgno: 260
  md: 'To be a competent user you need to understand the concepts of connectivity,
    the wireless revolution, and communication systems. Additionally, you need to
    know the essential parts of communication technology, including channels, connection
    devices, data transmission, networks, network architectures, and network types.


    # # CONNECTION DEVICES


    # # NETWORKS


    ![](img/17527690010086a83ec3d8f3ee262703_260_0.png)


    Computer networks connect two or more computers. Some specialized network terms
    include


    +   - Node—any device connected to a network.

    - Client—node requesting resources.

    - Server—node providing resources.

    - Directory server—specialized node that manages resources.

    - Host—any computer that can be accessed over a network.

    - Router—a node that forwards packets from one network to another.

    - Switch—that coordinates flow of data between other nodes. Hub is an older device
    that directs flow to all.

    - NIC (network interface card)—LAN adapter card for connecting to a network.

    - NOS (network operating system)—controls and coordinates operations.

    - Network administrator—network specialist responsible for network operations.


    Many communication systems use standard phone lines and analog signals. Computers
    use digital signals.


    # ## Modems


    Modems modulate and demodulate. Transfer rate is measured in megabits per second.
    Four types are telephone, DSL, cable, and wireless (wireless wide area network,
    WWAN).


    # ## Connection Service


    TI, T3 (DS3), and OC (optical carrier) lines provide support for large corporations.
    More affordable technologies include dial-up, DSL (digital subscriber line), ADSL
    (widely used), cable, satellite, and cell services. 4G (fourth-generation mobile
    telecommunications) promises 10 times faster than 3G.


    # ## NETWORK TYPES


    Networks can be citywide or international, both wired and wireless connections.


    +   - Local area networks (LANs) connect nearby devices. Network gateways connect
    networks to one another. Ethernet is a standard. These lanes are called Ethernet
    LANs.

    - Home networks are used in homes.

    - Hotspots provide Internet access typically using Wi-Fi technology.

    - Wireless LANs (WLANs) use a wireless access point (base station) as a hub.

    - Personal area networks (PANs) are wireless networks for PDAs, cell phones, and
    other gadgets.

    - Metropolitan area networks (MANs) link office buildings within a city, spanning
    up to 100 miles.

    - Wide area networks or WANs are form worldwide networks. The Internet is the
    largest area network work in the world.


    # ## DATA TRANSMISSION


    Bandwidth measures a communication channel''s width or capacity. Bandwidths are
    variable (low bandwidth), medium band, broadband (high-capacity transmissions),
    and baseline. Protocols are rules for exchange. Wid used Internet protocols include
    http, https, and TCP/IP addresses (Internet protocol addresses) are unique numeric
    Internet addresses. DNS (domain name server) yields text-based addresses and to
    from numeric IP addresses. Packets are small parts of messages.


    Communications and Networks 233'
