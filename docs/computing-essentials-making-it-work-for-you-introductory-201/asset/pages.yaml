    # Virtualization


    As we have discussed, applications are designed to run with particular operating
    systems. What if you wanted to run two or more applications each requiring a different
    operating system? One solution would be to install each of the operating systems
    on a different computer. There is, however, a way in which a single physical computer
    can support multiple operating systems operate independently. This approach is
    called virtualization.


    When a single physical computer runs a special program known as virtualization
    software, it operates as two or more independent computers as virtual machines.
    Each virtual machine appears to the user as a separate independent computer with
    its own operating system. The operating system of the physical machine is known
    as the host operating system for each virtual machine is known as the guest operating
    system. Users can switch between virtual computers and programs running on them.
    There are several programs that create and run virtual machines. One program,
    Microsoft''s Hyper-V, is included with the Windows 8 Professional version. (See
    Figure 4-10).


