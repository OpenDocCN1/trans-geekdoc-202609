- pgno: 339
  md: 'Topology: The configuration of a network. The five principles are ring, star,
    tree, and mesh.


    Touch pad: Used to control the pointer by moving and tapping on the surface of
    a pad.


    Touch screen: Monitor showing actions or commands to be entered by the touch of
    a finger.


    +   - Track: Closed, concentric ring on which data is recorded. Each track is
    divided into sections called.

    - Trackball: Device used to control the pointer by rolling a ball with your finger.

    - Tracking cookies: Set by third-party code.


    Traditional keyboard: Full-sized, rectangular keyboard that includes function
    keys, alphanumeric, and numeric keys.


    Transaction processing system (TPS): System that records day-to-day transactions,
    such as customer orders, bills, inventory, and production control. The TPS operates
    and creates databases.


    Transfer rate: Or transfer speed, which is the speed at which data is transmitted,
    typically measured in bits per second (bps).


    Transition: Animated how a presentation moves from slide to the next.


    Transmission control protocol (TCP/IP): TCP/IP is the standard for the Internet.
    The features of this protocol include (1) identifying and receiving devices and
    (2) reformating information for transmission across the network


    Tree network: A network in which each device is connected to a central node, either
    directly or through one or more other nodes. The central node is connected to
    two or more subordinate nodes that in turn are connected to other subordinate
    nodes, and so forth, forming a tree-like structure.


    Trojan horse: A program that most common Trojans appear as free screensavers,
    antivirus programs. Others may download and leave active virus protection and
    then deposit the virus.


    Troubleshooting program: A utility program that recognizes and corrects complex-related
    problems before they become severe. Also called diagnostic program.


    Twisted-pair cable: Combination of pairs of wires that are twisted together.


    Twitter: The most popular microblogging that enables you to add new content from
    your browser, instant messaging, or from a mobile phone.


    # U


    Unicode: A 16-bit code to support international characters. For browsers to connect
    to resources on the web, the location or address of the resources must be specified.
    These addresses are URLs.


    Uninstall program: A utility program that safely and completely removes programs
    and related files.


    Universal instant: An instant messaging service that communicates with any other
    messaging services.


    Universal bus (USB): Combines with the system board to support several external
    devices without expansion cards. USB buses are used to support high-speed scanners,
    printers, and videocapturing devices.


    USB port: They have replaced serial and parallel ports, and one USB port is used
    to connect devices to the system unit.


    UNIX: An operating system developed for midrange computers. It is important because
    it can run on many of the powerful computers.


    Uploading: To send transferring information from the user is operating to a remote
    computer.


    USB drive: The set of a key chain, which hard drives connect to a USB port enabling
    a transfer of files.


    User: Any person who uses a computer. End user interface.


    User interface: The way users interact with applications programs and hardware.
    A window is displayed for the user to choose, or that is how users communicate
    with the program.


    Utility: Performs tasks related to managing resources. Norton Utility for virus
    control and maintenance is a good example of utility.


    Utility suite: A program that combines several utilities in one package to improve
    system performance.


    # V


    Vector: A type of graphic file. Vector graphics contain all the shapes and colors,
    along with starting and ending points, to recreate the image.


    Vector image: Graphics file made up of a collection of objects as lines, rectangles,
    and ovals. Vector images are not bitmaps but they can be stretched and resized
    by mathematical equations or so. Illustration programs create maintain vector
    graphics. Also known as vector illustrations.


    High level language: Task-oriented languages that require input from the part
    of the user.


    VGA (Video Graphic Adapter) port: A type of port that provides a connection to
    an analog monitor.


    Video editing software: Allows you to reorganize, add effects, and add more to
    your video footage.


    Videoconferencing: Computer system that allows people at various geographic locations
    to have meetings.


    Virtual environment: See Virtual reality.


    Virtual keyboard: Displays an image of a keyboard on a touch screen. The screen
    functions as the actual input device, which when the keyboard is considered virtual.


