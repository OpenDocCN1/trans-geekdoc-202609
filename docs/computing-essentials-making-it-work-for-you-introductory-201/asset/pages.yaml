    **Thesaurus:** A word processor that features synonyms, antonyms, and related
    words for a word or phrase.


    **Thin-film liquid crystal (TFT-LCD):** Flat-panel matrix display activating each
    pixel.


    **Third-generation language (3GL):** Procedural language.


    **Third-party cookie:** A cookie generated by an advertising company that is affiliated
    with the website you are visiting. Also referred to as a tracking cookie.


    **Thumb key:** Small thumb-operated keyboard for smartphones and other portable
    devices. Designed for connecting and to the web.


    **Toggle key:** These keys turn a function on or off, like the CAPS LOCK.


    **Toolbar:** Bar located below the menu bar containing icons or graphical representations
    for commands.


    **Top-down analysis:** Method used to identify lower components of a system, then
    break these components down into smaller parts for analysis.


    **Top-down design:** Method used to design the program''s processing steps, called
    program modules. The program must pass in sequence from one module to the next
    that the program has processed modules.


    **Top-level domain (TLD):** Part of an Internet address; identifies the geographical
    or organizational identification. For example, .aol.com is the top-level domain
    code and indicates it is a commercial site. Also domain name.


    **Top management:** Top-level managers are concerned with long-range (strategic)
    planning. They supervise management.


    # Glossary


    # 311'
