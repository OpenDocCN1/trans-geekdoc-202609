  md: '# VISUAL SUMMARY


    # Input and Output


    # KEYBOARDS


    # POINTING DEVICES


    ![](img/17527690010086a83ec3d8f3ee262703_203_0.png)


    ![](img/17527690010086a83ec3d8f3ee262703_203_1.png)


    **Input** is any data or instructions that are used by a computer. **Input devices**
    are hardware used to translate words, sounds, images, and actions that people
    understand into a form that the system unit can process. These include keyboards,
    scanning, image capturing, and audio-input devices.


    **Keyboards** convert numbers, letters, and special characters that people understand
    into electrical signals. These signals are sent to, and processed by, the system
    unit.


    **Pointing devices** provide an intuitive interface with the system unit by accepting
    pointing gestures and converting them into machine-readable input.


    # Mice


    A mouse controls a pointer that is displayed on the monitor. The **mouse pointer**
    usually appears in the shape of an arrow. Some mice have a wheel button that rotates
    to scroll through information on the monitor. The optical mouse is the most widely
    used. A corded or wireless mouse use radio waves or infrared light waves. Three
    devices similar to a mouse are trackballs, touch pads, and pointing sticks.


    # Keyboards


    There are four basic categories of keyboards: traditional, notebook, virtual,
    and thumb.


    +   - **Traditional keyboards**, used on desktop and larger computers. Standard
    keyboard has 101 keys. **Toggle keys** turn features on and off. **Combination
    keys** perform actions when combinations of keys are held down.


    +   - **Notebook keyboards**, used on notebook computers. Smaller than traditional
    keyboards with fewer keys. Typically does not have numeric keypad or standard
    location for function and navigation keys.


    +   - **Virtual keyboards**, used on tablets and smartphones. Does not have a
    physical keyboard. Keys displayed on screen and selected by pressing a key''s
    image.


    +   - **Thumb keyboards**, used on smartphones and small portable devices. Very
    small devices primarily used for texting and connecting to the web.


    # Touch Screens


    Touch screens allow users to select actions by touching the screen with a finger
    or pen device. **Multitouch** screens accept multiple-finger commands.


    # Game Controllers


    Game controllers provide input to computer games. Widely used controllers include
    joysticks, dance pads, gamepads, and motion-sensing devices.


    # Stylus


    A stylus is a penelike device commonly used with tablets and PDAs. Often, a stylus
    interacts with the computer through handwriting recognition software that translates
    handwriting notes into a format that the system unit can process.


