    How would you feel if someone obtained a driver''s license and credit cards, a
    car, and a house? It happens every day. When they assume your identity to buy
    clothes, cars, and a house ten million people are victimized in this way. Identity
    theft is the illegal assumption of someone''s identity for purposes of economic
    gain. It is one of the fastest-growing crimes in the country. To learn more about
