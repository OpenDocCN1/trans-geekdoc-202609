    # Electronic Commerce


    **Electronic commerce**, also known as e-commerce, is the buying and selling of
    goods over the Internet. Internet commerce is fast-growing and widely used in
    part because it provides incentives for both buyers and sellers. From the buyer''s
    perspective, goods and services can be purchased at any time of day or night from
    any location that has an Internet connection. From the seller''s perspective,
    the costs associated with owning and operating a retail outlet can be eliminated.
    Another advantage is reduced inventory. Traditional stores maintain an inventory
    of goods in their stores and periodically replenish this inventory from'
