  md: '# Multifunctional Devices


    Multifunctional devices (MFD) typically combine the capabilities of a scanner,
    printer, fax, and copy machine. These multifunctional devices offer a cost and
    space advantage. They cost the same as a good printer or copy machine but require
    much less than the single-function devices they replace. Their disadvantage is
    that the quality and functionality are not quite as good as those of the separate-purpose
    devices. Even so, multifunctional devices are widely used in home and small business
    offices.


    # Internet Telephones


    Internet telephones are specialized input and output devices for receiving and
    sending voice communication.(See Figure 6-28).


    Voice over IP (VoIP) is the technology of telephone calls over computer networks.
    Also known as telephony, Internet telephone, and IP telephony. VoIP uses the Internet
    rather than traditional communications to support voice communication. To place
    calls using Internet requires a high-speed Internet connection and a service provider.
    Many cable service providers offer bundling Internet, telephony, and television.
    While these bundles offer a better price, there are other lower-cost options for
    VoIP from providers including Ooma, Vantage, MagicJack, and Skype.


    Skype providers also include video services but do not require any dedicated hardware.
    Once you sign up for this free service, you can use your computer''s audio and
    video to connect to any other Skype subscribers. The advantages compared to other
    providers are that Skype is free for calls (as well as international calls), supports
    video as well as audio, and does not require any special equipment. The disadvantages
    are that people must have their computers to make or receive calls; calls can
    only be made by Skype subscribers, or for an additional fee, you can place calls
    to others. Voice quality and reliability are not as good as traditional telephone
    communication. To learn more about using Skype, Making IT for Work: Skype, on
    pages 170 and 171.


    # Robots


    Artificial intelligence (AI) is a field of computer science that develops computer
    systems that can mimic or simulate human senses, thought processes, and actions.
    Robotics is an area of AI connected with developing and using robots. Robots are
    computer-controlled machines that mimic the motor activities of living things.
    For example, Honda''s ASIMO robot resembles a human and is capable of walking
    upright, dancing, shaking hands, playing musical instruments, and much more.(See
    Figure 6-29). Robots are used for a variety of applications ranging from manufacturing
    to military operations. There are four types of robots.


    +   - Perception robots imitate some of the human senses. For robots with television-camera
    vision systems are particularly useful. They can guide machine tools, inspect
    products, and secure homes.

    - Industrial robots are used to perform a variety of tasks. For example, in automotive
    plants, robots are widely used for welding, polishing, and painting.

    - Mobile robots act as transports and are widely used for a variety of different
    tasks. For example, the police and military use them to locate and disperse explosive
    devices.

    - Household robots are now widely available and are designed for vacuum or scrub
    floors, mow lawns, patrol the house, or provide entertainment.


    ![](img/17527690010086a83ec3d8f3ee262703_196_0.png)


    # environment


    Did you know that robots were already being used to help the environment? The
    Department of Energy is using a robotic arm to help clean nuclear waste in a large
    underground facility. Researchers in Australia are currently using a robotic fish
    to swim through various bodies of water in order to detect polluted areas. Robots
    will continue to help detect and clean polluted areas. To learn more about environmental
    factors, visit our website at www.computing2014.com and enter the keyword environment.


    # Explorations


    There are many humanoid robots being developed for research and education.

    To learn more about these of robots, visit our site at www.computing2014.com and
    enter the keyword robot.


