    including improved handwriting recognition and advanced searching capabilities
    for finding files and other content on a computer. Windows 8 was released in 2012
    and was created to better integrate Microsoft''s desktop operating systems with
    its mobile operating systems (See Figure 4-7). It provided support for gestures,
    cloud integration, and apps. Windows 8 also introduced a new interface. This interface
