  md: 'Data is collected from the system presented and analyzed, and new requirements
    are determined.


    Systems analysis and design: Six phases of problem-solving procedures for examining
    information systems and improving them.


    Systems analysis report: Report for higher management describing the current information
    system, the requirements for a new system, and a possible development schedule.


    Systems analyst: Plans and design information systems. Systems analyst audits
    the performance of a new system against the original design specifications to
    determine if the new procedures are actually improving productivity.


    Systems design: Phase three of the systems life cycle, consisting of designing
    alternative systems and writing a design report.


    Systems design report: Report for higher management describing alternatives, presenting
    costs over benefits, and outlining the effects of alternatives on the organization.


    Systems development: Phase four of the systems life cycle, consisting of developing
    software, acquiring hardware, and testing the new system.


    Systems implementation: Phase five of the systems life cycle is converting the
    old system to the new one and training people to use the new system.


    Systems life cycle: The six phases of systems analysis and design are called the
    systems life cycle. The phases are preliminary investigations, systems analysis,
    systems design, systems development, systems implementation, and systems maintenance.


    Systems maintenance: Phase six of the systems life cycle consisting of systems
    audit and periodic evaluation.


