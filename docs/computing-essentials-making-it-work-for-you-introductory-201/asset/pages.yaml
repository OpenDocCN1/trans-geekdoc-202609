  md: '# # Making work for you


    # WINDOWS TASK MANAGER


    Have you ever been working with a program when it simply stopped working and would
    not respond to you? Does your computer seem to be getting slower or slower? Windows
    Task Manager, which gives you a live view of every program that is currently in
    RAM, is designed to help with these and many other operational problems.


    Starting Task Manager You can open Task Manager from anywhere by following these
    steps:


    +   Press and momentarily hold the Ctrl + Alt + Del keys.

    Select the Select Task Manager option.

    As you can see, the Task Manager provides a menu and several tabs. Please note
    that it may look quite slightly different in your version of Windows.

    Closing an Application Use Task Manager when a program you are using becomes stuck
    and stops responding.

    Go to the *Applications* tab of Task Manager.

    Find the program that is stuck. Its status should read, "Not Responding."

    Select and click the *End Task* button.


    | Task | Status |

    | --- | --- |

    | Document-1 Microsoft Word | Running |

    | Home - McGraw-Hill Education - Intern... | Running |

    | Snapping Tool | Running |


    The program that was not responding has been closed, and you can now continue
    using Windows normally.


    Viewing Processes This is the most powerful area of Task Manager. Here, you will
    see a list of every process (running program) that is currently residing in your
    computer''s RAM.


    +   Go to the *Processes* tab of Task Manager.

    Click the *Memory* heading. All processes will be sorted from highest (occupying
    the most RAM) to the lowest.

    Click the *CPU* heading. This will show all processes that the CPU is currently
    working on.


    It is normal for the numbers to fluctuate for running programs, especially for
    the CPU. Also note that a very high number on "System Idle Process"

