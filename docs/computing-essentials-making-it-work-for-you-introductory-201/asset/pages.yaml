  md: 'The most common protocol for website encryption is https (hypertext transfer
    secure). As we discussed in Chapter 2, (hypertext transfer protocol) is the most
    widely used Internet protocol. The https adds a security level to help. Every
    URL that begins with https requires the browser and the connecting site to encrypt
    all messages, providing a safer and more secure transmission.


    +   * Virtual private networks: Virtual private networks (VPNs) encrypt connections
    between networks and remote users from home. This creates a secure connection
    to a company LAN across the internet.

    * Wireless network encryption: Restricts access to authorized users on wireless
    networks. WPA2 (Wi-Fi Protected Access) is the most widely used wireless network
    encryption for home wireless networks. WPA2 is typically established for a wireless
    network through the network''s router. While the specifics vary between routers,
    WPA2 is usually set through the router''s settings options.


    Anticipating Disasters Companies (and even individuals) should prepare themselves
    for disasters. Physical security is concerned with protecting hardware from possible
    human and natural disasters. Data security is concerned with protecting software
    and data from unauthorized tampering or damage. Large organizations have a disaster
    recovery plan describing ways to continue operating until normal operations can
    be restored.


    Preventing Data Loss Equipment can be replaced. However may be irreplaceable.
    Most companies have ways of trying to keep software and data from being tampered
    with in the first place. They include careful screening of job applicants, guarding
    of passwords, and auditing of data programs from time to time. Some systems use
    redundant storage to prevent loss of data when a hard drive fails. We discussed
    RAID in Chapter 7, which is a commonly used type of redundant storage. Backup
    batteries protect against data loss due to file corruption during unexpected power
    outages.


    Making backups of data is essential to prevent data loss. Backups are often stored
    at an off-site location to protect data in case of thefts, fires, floods, or other
    disasters. Students and users often use flash drives and cloud storage as discussed
    in Chapter 7 to back up homework and Incremental backups store multiple versions
    of data at different points in time to prevent data loss due to unwanted changes
    or accidental deletion. To see how you could use a cloud-based backup service,
    see Making IT Work for You: Cloud-Based Backup on pages 261 and 262.


    See Figure 9-18 for a summary of the different measures to protect security.


