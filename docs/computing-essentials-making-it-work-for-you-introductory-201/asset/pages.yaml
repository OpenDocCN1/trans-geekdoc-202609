  md: 'quite effective; however, they are limited. ASCII, for example, only uses 7
    bits to represent each character, which means only 128 characters can be represented.
    This was fine for most characters in the English language but not large enough
    to support other languages such as Chinese and Japanese. These languages have
    too many characters for most characters to be represented by the 7-bit ASCII code.


    The explosion of the Internet and subsequent globalization of computing have led
    to a new character encoding Unicode, which uses 16 bits. The Unicode standard
    is the most widely used encoding standard and is recognized by nearly every computer
    system. The first 128 characters are assigned the same sequence of bits as ASCII
    to maintain compatibility with other ASCII-formatted information. However, Unicode
    uses a variable number of bits to represent each character, which allows non-English
    characters and special characters to be represented.


    # ethics


    The best protection for any consumer is to be knowledgeable. Whether you are getting
    your car or your computer repaired, the more you know, the more likely you will
    receive fair and ethical treatment. Unfortunately, many rely on the honesty of
    service personnel. A deceitful technician gains access to your computer, you could
    be at personal risk. Given how important computers are in our lives, we should
    demand a code of ethics for computer technicians? To see more issues, visit our
    website at www.computing2014.com and enter the keyword ethics.


    # concept check


    +   - What is the difference between an analog and a digital electronic signal?

    - What are decimal and binary systems? How are they different?

    - Compare EBCDIC, ASCII, and Unicode.


    # Careers in IT


    ![](img/17527690010086a83ec3d8f3ee262703_168_0.png)


    Computer technicians repair and install computer components and systems. They
    may work on from personal computers and mainframe servers to printers. Some computer
    technicians are responsible for setting up and maintaining computer networks.
    Experienced computer technicians may work with computer engineers to diagnose
    and run routine maintenance on complex systems. Job growth is expected in this
    field as computer equipment becomes more complicated and technology expands.


    Employers look for those with certification in computer repair or associate degrees
    from professional schools. Computer technicians also expect to continue their
    education to keep up with technological changes. Good communication skills are
    important in this field.


    Computer technicians can expect to earn an annual salary in the range of $31,000
    to $64,000. Opportunities for advancement typically come in the work of more advanced
    computer systems. Some computer technicians move into customer service positions
    or go into sales. To learn more about other careers in information, visit us at
    www.computing2014.com and enter the keyword careers.


