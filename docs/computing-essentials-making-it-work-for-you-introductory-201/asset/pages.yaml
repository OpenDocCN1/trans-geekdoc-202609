  md: '# Communication


    # environment


    As previously mentioned, communication is the most popular Internet activity,
    and its impact cannot be overestimated. At a personal level, friends and family
    can stay in contact with one another even when separated by thousands of miles.
    At a business level, electronic communication has become a standard, and many
    times preferred, we stay in touch with suppliers, employees, and customers. Some
    types of Internet communication are e-mailing, social networking, blogs, microwaves,
    webcasts, podcasts, and wikis.


    Did you know that e-mail is good for the environment? Writing letters and attaching
    files using e-mail reduces the amount of paper sent via postal mail. Managing
    your financial affairs on the web is also helpful for the environment as it reduces
    the amount of paper bills to receive at home. Visit our environmental facts at
    www.computing2014 and enter the keyword environment.


    # E-mail


    E-mail or electronic mail is the transmission of electronic messages over the
    Internet. There are two basic types of e-mail accounts: client-based and web-based.


    +   * Client-based e-mail accounts require a special program as an e-mail client
    to be installed on your computer. Before you can begin e-mailing, you need to
    run the e-mail client from your computer, which communicates with the e-mail service
    provider. Two of the most used e-mail clients are Apple''s Mail and Microsoft''s
    Outlook.

    * Web-based e-mail accounts do not require an e-mail program to be installed on
    your computer. When your computer''s browser connects to an e-mail provider, a
    special program called webmail runs on the e-mail provider''s server and then
    you can begin e-mailing. This is known as webmail. Most Internet service providers
    offer webmail services. Three free webmail providers are Google''s Gmail, Microsoft''s
    Hotmail, and Yahoo''s Mail.


    For individual use, webmail is widely used because it frees the user from installing
    and maintaining an e-mail client on every computer. With webmail, you can access
    your e-mail from any computer that has Internet access.


    A typical e-mail has three basic elements: header, message, and signature. (See
    Figure 2-7) The header appears first and typically includes the following information:


    +   * Addresses: E-mail messages typically display the addresses of the person
    or persons to whom the e-mail is sent. The e-mail in Figure 2-7 is to dcoats@wdsu.edu.
    Additionally, there may be copies sent to others. These are blind copies, meaning
    that their addresses do not appear on any other copies of the e-mail. E-mail addresses
    have two parts (See Figure 2-8). The first part is the user''s name and the second
    part is the domain name, which includes the top-level domain. In our example e-mail,
    dcoats is Dan''s name. The server providing e-mail service for Dan is wdsu.edu,
    an educational institution.

    * Subject: A one-line description, used to present the topic of the message. Subject
    lines are displayed when a person checks his or her mailbox.

    * Attachments: Many e-mail programs allow you to attach files as documents and
    images. If a message has an attachment, the file name typically appears on the
    attachment line.


    The letter or message comes next. This information may include the sender''s name,
    address, and phone number.


    +   E-mail can be a valuable asset in your personal and professional life. However,
    like many other valuable technologies, it has drawbacks too. Americans receive
    billions of unwanted and unsolicited e-mails every year. This unwelcome'
