  md: "# ETHICS\n\n# ETHICS\n\n![](img/17527690010086a83ec3d8f3ee262703_296_0.png)\n\
    \n![](img/17527690010086a83ec3d8f3ee262703_296_1.png)\n\nWhat do you suppose controls\
    \ how computers can be used? You probably think of laws. Of course, that is right,\
    \ but technology is moving so fast that it is difficult for our legal system to\
    \ keep up. The essential element that controls how computers are used today is\
    \ ethics.\n\nEthics are standards of moral control. Computer ethics are guidelines\
    \ for the morally acceptable use of computers in our society. We are all entitled\
    \ to equal treatment. This includes the right to keep personal information, such\
    \ as credit ratings and medical history, from getting into unauthorized hands.\n\
    \nToday, many legal sources for digital media exist, including\n\n+   * Television\
    \ programs that can be watched online, often for free, on television-network-sponsored\
    \ sites.\n\n+   * Sites like Pandora allow listeners to enjoy music at no cost.\
    \ \n\n+   * Online stores that sell music and video content. A pioneer in this\
    \ area is Apple's iTunes Store.\n\n# Copyright and Digital Rights Management\n\
    \nCopyright is a legal concept that gives content creators right to control use\
    \ and distribution of their work. Materials that can be copyrighted includes paintings,\
    \ books, music, films, and even video games.\n\nSoftware piracy is the unauthorized\
    \ copying and distribution of software. The industry loses over $30 billion annually\
    \ to software piracy. Two related topics are the Digital Millennium Copyright\
    \ Act and digital rights management.\n\n+   * Digital Millennium Copyright Act\
    \ establishes the right of a program to make a copy of any program and disallows\
    \ the creation of copies to be sold or given away. It is also illegal to download\
    \ copyright-protected music and videos from the Internet.\n\n+   * Digital rights\
    \ management (DRM) is a collection of technologies designed to prevent copyright\
    \ violations. Typically, DRM is used to (1) control the number of devices that\
    \ can access a given file and (2) limit the kinds of devices that can access a\
    \ file.\n\n# Plagiarism\n\nPlagiarism is the illegal and unethical representation\
    \ of some other person's work and ideas as yours without giving credit to the\
    \ original source. Examples of plagiarism include cutting and pasting web content\
    \ into a report or paper.\n\nRecognizing and catching plagiarism is relatively\
    \ easy. For example, services such as Turnitin are dedicated to preventing plagiarism.\
    \ This service examines a paper's content and compares it to a wide range of public\
    \ electronic documents including web page content. Exact duplication or paraphrasing\
    \ is readily identified.\n\n# CAREERS IN IT\n\nIT security analysts are responsible\
    \ for maintaining the security of a company's network, systems, and data. Employers\
    \ look for candidates with a bachelor's or advanced specialized associate's degree\
    \ in information systems or computer science and network experience. Salary range\
    \ is $62,000 to $101,000.\n\nPrivacy, Security, and Ethics 269"
