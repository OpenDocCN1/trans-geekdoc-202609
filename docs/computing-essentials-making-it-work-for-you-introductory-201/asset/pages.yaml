    Online: Being connected to the Internet as being online.


    Online identity: The information that people voluntarily post about themselves
    online.


    Online office suite: Office suite online and available anywhere the Internet can
    be accessed.


    Online processing: See Real-time processing.


    Online shopping: The buying and selling of a wide range of consumer goods over
    the Internet.


    Online stock trading: Allows investors to research, buy, and sell stocks over
    the Internet.


    Online storage: Provides users with storage space that can be accessed from the
    web.


    Open source: A free and freely distributed software program that allows users
    to improve and develop the program.


    Operating system (OS): Software that interacts between application software and
    the computer, handling tasks as running programs, storing data, and coordinating
    all resources, including peripheral devices.


    Operational feasibility: Making sure that the design of a system will be able
    to function within the existing framework of an organization.


    Operational model: A decision model that helps lower-level managers accomplish
    the organization''s day-to-day activities, such as evaluating and maintaining
    quality control.


    Operators: Operators handling operational errors in programs. To do that, they
    need documentation,


    which lets them understand the program, enabling them to fix any errors.


    Optical connection: Port used to integrate computers into high-end audio and home
    theatre systems.


    Optical recognition (OCR): Provides support for very high-speed, digital translation
    for large corporations.


    Optical-character recognition (OCR): Scanning device that uses specialized characters,
    as those printed on utility bills, can be read by a light source and converted
    into text.


    Optical storage: Device that hold over 17 terabytes of data, which is equivalent
    of several million handwritten pages. Lasers are used to read and write data on
    the disc. The three types of optical media are compact discs (CDs), digital versatile
    video (DVDs), and Blu-ray discs (BDs).


    Optical disc: A disc is an optical disc using a laser that reflects a beam of
    light that represents a 0 or 1.


    Optical-character recognition (OCR): Device that senses the presence or absence
    of a mark, such as a mark. It is used for multiple-choice tests.


    Optical mouse: A type of mouse that emits light to sense movement on the desk.


    Optical scanner: Device that identifies images or text on a page and automatically
    converts it to electronic signals to be stored in a computer or reproduce.


    Organic light-emitting diode (LED): The benefits of lower power consumption and
    longer battery life, as well as much brighter displays.


    Organization chart: Chart showing the levels of management and formal lines in
    an organization.


    Organization cloud storage: High-Speed Internet connected to a remote organization
    internet drive.


    OS Lion: An OS for Mac that introduced several powerful features including Launchpad
    and Mission Control.


    OS X Mountain Lion: OS for Mac that was released in 2012 and designed for tasks.


    Output: Processed information.


    Output device: Equipment that processes information from the central processing
    into a form that can be used by humans. Most modern devices use printers and monitors.


    # P


    Packet: Before a message is sent to the Internet, it is broken down into small
    parts packets. Each packet is sent separately over the network. At the receiving
    end, the packets are reassembled into the correct order.


    Page layout format: See Desktop publishing.


    Pages: In Microsoft PowerPoint, another name for slides.


    Parallel approach: Systems implementation in which old and new systems are operated
    side by side until the new one has shown it reliable.


    Parallel processing: Used by supercomputers to run large and complex programs.'
