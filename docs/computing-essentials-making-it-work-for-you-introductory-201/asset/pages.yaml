  md: '# Optical Discs


    Today''s optical discs can hold over 100 gigabytes of data. (See Figure 7-8) That
    is the equivalent of millions of typewritten pages or a medium-sized library all
    on a single disc. Optical discs are having a great impact on storage today, but
    we are probably only beginning to see their effects.


    In optical technology, a laser beam alters the surface of a plastic or metallic
    disc to use magnetic charges to represent 1s and 0s, optical discs use reflected
    light. Unlike hard discs, which are read by flat lands and bumpy areas called
    pits on the disc surface. The disc is read by an optical disc that uses a tiny
    beam of light on these areas. The amount of reflected light determines whether
    the area represents 1 or 0. To see how an optical disc works, visit our website
    at www.computing2014.com and enter the keyword optical.


    Unlike hard discs, CDs use tracks and wedge-shaped sectors used for hard disks,
    however, optical discs typically use a single track that spirals towards the center
    of the disc. This single track is divided into equally sized sectors.


    The most widely used optical discs are CD, DVD, and Blu-ray discs.


    # Compact Disc


    Compact disc, or as it is better known, CD, was the most widely used optical format.
    Typically, CD drives on microcomputer systems can store 700 MB (megabytes) of
    data on one side of a CD.


    There are three basic types of CDs: read only, write once, and rewritable:


    +   - Read-only-CDROM, which stands for compact disc-read-only memory, is used
    to a commercial music CD. Read only means it cannot be written on or erased by
    the user. Thus, as you have user access to only the data imprinted by the publisher.
    CD-ROMs are used to distribute large databases and archives. They are also used
    to distribute software application packages.


    +   - Write once—CD-R, which stands for CD-recordable, can be written to once.
    After that it can be read many times without deterioration but CD-R drives are
    often used to


    ![](img/17527690010086a83ec3d8f3ee262703_219_0.png)


    Figure 7-8 Optical disc


