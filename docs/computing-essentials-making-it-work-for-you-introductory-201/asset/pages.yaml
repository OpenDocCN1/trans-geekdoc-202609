  md: '# VISUAL SUMMARY


    # Application Software


    # APPLICATION SOFTWARE


    # GENERAL-PURPOSE APPLICATIONS


    ![](img/17527690010086a83ec3d8f3ee262703_112_0.png)


    ![](img/17527690010086a83ec3d8f3ee262703_112_1.png)


    The three categories of application software are general purpose, specialized,
    and mobile.


    # User Interface


    You control and interact with a program using a user interface. A graphical user
    interface (GUI) uses icons selected by a mouse-controlled pointer. A window contains
    a document, program, or message. Software programs with a traditional GUI have:


    +   * Menu—present commands listed on the menu bar.

    * Toolbars—contain buttons for quick access to commonly used commands.

    * Dialog box—provides additional information or requests user input.

    * Ribbons—replace menus and toolbars.

    * Tabs—divide ribbons into groups. Contextual tabs automatically appear when needed.

    * Galleries—graphically display alternatives before they are selected.


    General-purpose applications include word processors, spreadsheets, database management
    systems, and presentation graphics.


    # Word Processors


    Word processors create text-based documents. Individuals and organizations use
    word processors to create memos, letters, and facts. Organizations create newsletters,
    manuals, and brochures to provide information to customers. Microsoft Word is
    the most used word processor. Others include Core Word, Apple Pages, OpenOffice
    Writer, and Google Docs.


    Software programs with a Ribbon GUI have:


    # Spreadsheets


    Spreadsheets organize, analyze, and graph numeric data such as budgets and financial
    reports. They are widely used by nearly every profession. Microsoft Excel is the
    most used spreadsheet program. Others include Apple Numbers and OpenOffice Calc.


    # Common Features


    Common features include spell checkers, alignment, fonts and font sizes, tables,
    and reports.


    Application Software'
