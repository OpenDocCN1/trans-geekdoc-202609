  md: 'archive data and to record music downloaded from the Internet.

    • Rewritable—CD-RW stands for compact disc rewritable. Also known as erasable
    optical discs, these are very similar to CD-Rs except that the disc surface is
    not permanently altered when data is recorded. Because they can be changed, CD-RWs
    are often used to create and edit multimedia presentations.


    # Digital Versatile Disc


    DVD stands for digital versatile disc or digital video disc. This disc has replaced
    CDs as the standard optical disc. DVDs are very similar to CDs except that more
    data can be packed into the same amount of space (See Figure 7–9). Typically,
    DVDs can store 4.7 GB (gigabytes) on one side of a DVD—seven times the capacity
    of CDs. There are three types of DVDs, similar to CDs: read only, write once,
    and rewritable.


    ![](img/17527690010086a83ec3d8f3ee262703_220_0.png)


    +   • Read only—DVD-ROM stands for versatile disc-read-only memory. DVD-ROM drives
    are also known as DVD players. DVD-ROMs are having a major impact on the video
    market. While CD-ROMs are effective for distributing music, they can contain just
    over an hour of high-quality video. DVD-ROMs can provide over two hours of high-quality
    video and sound comparable to that found in motion picture theaters. DVD-ROMs
    are widely used to distribute videos and software.

    • Write once—DVD+R and DVD-RW are two types of write-once formats. Both stand
    for rewritable. Each has a slightly different way in which it formats its discs.
    Fortunately, most new DVD players can use either format. These drives are typically
    used to create permanent archives for large amounts of data and record videos.
    DVD rewritable drives are rapidly replacing CD-R drives The most widely used rewritable
    formats are DVD+R (DVD rewritable), DVD-RW (DVD rewritable), and DVD-RAM (DVD
    random-access memory). Each format has a unique way of storing data. Unfortunately,
    older players could only read one type of format. New DVD players, however, are
    able to read and use any of the formats. Rewritable discs have rapidly replaced
    CD rewritable discs. Applications range from recording video from cameras to developing
    multimedia presentations that include extensive graphics and video.


    ![](img/17527690010086a83ec3d8f3ee262703_220_1.png)


    Did you know that many companies are now working to minimize the environmental
    impact of their products? Sony, making Blu-ray players, strives to make the materials
    used in production sustainable. Furthermore, smaller products fit in smaller boxes,
    reducing the number of shipping containers needed for transportation. In this,
    lowers emissions used in shipping and distribution. Improved circuits and processors
    result in more energy-efficient devices. For example, one Blu-ray player uses
    55 percent less energy than its predecessor. For environmental factors, visit
    our website at www.computing2014com and enter the keyword environment.


    # Blu-Ray disc


    While CDs and DVDs represent the past and present for optical disc storage, the
    future belongs to discs of even greater capacity. While DVDs have sufficient capacity
    to record standard-definition movies and music, they are insufficient for recording
    high-definition video, which requires about four times as much storage. This next
    generation of optical disc is called hi (high definition), with a far greater
    capacity than DVDs. The hi-definition Blu-ray disc (BD). The name comes from the
    blue-laser that is used to read the disc.


