    # # What Is Output?


    Output is processed data or information. Output typically takes the form of text,
    graphics, photos, audio, and/or video. For example, when you create a presentation
    using a graphics program, you typically insert text and graphics. You could also
    include photographs and add voice narration. The output would be the completed
    presentation.


    Output devices are any hardware used to provide or create output. They translate
    information that has been processed by the system unit into a form that humans
    can understand. There are a wide range of output devices. The most widely used
    are monitors, printers, and audio-output devices.


    ![](img/17527690010086a83ec3d8f3ee262703_189_1.png)


    Figure 6-17 Monitor resolution


    # # Monitors


    The most frequently used output device is the monitor. All known as display screens,
    monitors present visual images of text and graphics. The output is often referred
    to as soft copy. Monitors vary widely in size, shape, and contrast. Almost all,
    however, have some basic distinguishing features.


    # # Features


    The most important characteristic of a monitor is its clarity. Clarity refers
    to the quality and sharpness of the displayed images. It is a function of several
    monitors, including dot pitch, contrast ratio, size, and aspect.


    +   - Resolution is one of the most important features. Images are formed on a
    series of dots or pixels (pixel elements). (See Figure 6-17.) Resolution is expressed
    as a matrix of these dots or pixels. For example, many monitors have a resolution
    of 1,600 pixel columns by 1,200 pixel rows for a total of 1,920,000 pixels. The
    higher a monitor’s resolution (the more pixels), the clearer the image produced.
    See Figure 6-18 for the most common monitor resolutions.


    | Standard | Pixels |

    | --- | --- |

    | UXGA | 1,600 × 1,200 |

    | QXA | 2,048 × 1,538 |

    | WQXGA | 2,560 × 1,600 |

    | QXSGA | 2,560 × 2,048 |

    | QXGA+ | 2,880 × 1,800 |


    Figure 6-18 Resolution standards'
