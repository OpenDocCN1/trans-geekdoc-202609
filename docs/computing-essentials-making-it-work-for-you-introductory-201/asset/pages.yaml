  md: '![](img/17527690010086a83ec3d8f3ee262703_279_0.png)


    will either activate immediately or lie dormant until future time. For example
    in 2010, the Stuxnet worm infected several networks in Iran. One of these networks
    was used by Iran''s nuclear program. After the infection, several pieces of nuclear
    equipment became permanently damaged.


    Viruses and worms typically find their way into microcomputers through e-mail
    attachments and programs downloaded from the Internet. Viruses can be so damaging,
    computer users are advised to never open an e-mail attachment from an unknown
    source and to exercise great care in accepting new viruses and data from any source.


    As discussed in Chapter 4, antivirus programs alert users when kinds of viruses
    and worms enter their system. Two of the most widely used are McAfee VirusScan
    and Norton Antivirus. Unfortunately, new viruses are being developed all the time,
    and not all viruses can be detected.


    +   Trojan horses are those that come into a computer system disguised as something
    else. Trojan horses are not viruses. Like worms, however, they can be carriers
    of viruses. The most common types of Trojans appear as free computer games and
    free screen savers that be downloaded from the Internet. When a user downloads
    one of these, a virus is deposited on the computer system. The virus then begins
    its mischief. One of the most dangerous types of Trojan horse claims to provide
    free antivirus programs. When a user downloads one of these programs, the Trojan
    horse starts with a virus that locates and deletes any existing virus programs
    before depositing other viruses.


    Zombies are computers infected by a virus, worm, or Trojan horse allows them to
    be remotely controlled for malicious purposes. A collection of zombies is known
    as a botnet, or robot network. Botnets harness the combined power of many zombies
    for malicious activities like password cracking or sending junk-mail. Because
    they are formed by many computers distributed across the Internet, botnets are
    hard to shut down even after they are detected. Unfortunate for individual computer
    owners, it can also be difficult to detect when a personal computer has been compromised.


