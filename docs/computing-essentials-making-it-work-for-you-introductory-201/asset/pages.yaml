    # Types of Computers


    +   There are four types of computers:* Supercomputers are the most powerful type
    of computer. These machines are special high-capacity computers used by very large
    organizations. IBM''s Blue Gene supercomputer is one of the fastest computers
    in the world. (See Figure 1-7)

    * Mainframe computers occupy specially wired, air-conditioned rooms. Although
    not nearly as powerful as supercomputers, mainframe computers are capable of great
    processing speeds and data storage. For example, insurance companies use mainframes
    to process information about millions of policymakers.

    * Midrange computers, also referred to as servers, are computers with processing
    capabilities less powerful than a mainframe computer yet more powerful than a
    microcomputer. Originally used by medium-size companies or departments of large
    companies to support their processing needs, today midrange computers are most
    widely used to support or serve end users for specific needs such as retrieving
    data from a database or supplying access to application software.

    * Microcomputers are the least powerful, the most widely used and fastest-growing
    type of computer. There are four types of microcomputers: desktop, notebook, tablet,
    and handheld computers. (See Figure 1-8) Desktop computers are small enough to
    fit on top of or around a desk yet are too big to carry around. Notebook computers,
    also known as laptop computers, are portable and lightweight and fit into most
    briefcases. Tablets, also known as tablet computers, are the newest type of computer.
    They are smaller, lighter and generally less powerful than notebooks. Like a notebook,
    tablets have a flat screen but typically do not have a standard keyboard. Instead
    tablets typically use a virtual keyboard that appears on the screen and is touch-sensitive.
    The best known tablet is Apple''s iPad. Handheld computers are the smallest and
    are designed to fit into the palm of one hand. These systems contain an entire
    computer system, including the electronic'
