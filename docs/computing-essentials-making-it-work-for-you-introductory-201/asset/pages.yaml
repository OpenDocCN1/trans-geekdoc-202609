    # Bus Lines


    As mentioned earlier, a bus line—also known as a bus—connects the parts of the
    CPU to each other. Buses also link the CPU to various components on the system
    board (See Figure 5-17). A bus is a pathway for bits representing data and instructions.
    The number of bits that can travel simultaneously along a bus is known as the
    bus width.

    A bus is similar to a mult highway that moves bits rather than cars from one location
    to another. The number of traffic lanes determines the bus width. A highway (bus
    line) with more traffic lanes (bus width) can move traffic (data and instructions)
    more efficiently. For example, a 64-bit bus can move twice as much information
    at a time as a 32-bit bus. Why should you even care about what a bus is? Because
    microprocessor chips have changed, so have bus lines. Design or bus architecture
    is an important factor relating to the speed and power for a particular computer.
    Additionally, many devices, such as expansion cards, will work with only one type
    of bus.

    Every computer has two categories of buses. One category, called system buses,
    connects the CPU to the system board. The other category, called expansion buses,
    connects the CPU to other components on the system board, including expansion
    slots.


    ![](img/17527690010086a83ec3d8f3ee262703_162_0.png)


    Figure 5-16 PC card


    # Expansion Buses


    Computer systems typically have a combination of different types of expansion
    buses. The principal types are USB, FireWire, and PCIe.


    > Universal serial bus (USB) is widely used today. External USB devices are connected
    from one to another or to a common point or hub and then onto the USB bus. The
    USB bus connects to the PCI bus on the system board. The current USB standard
