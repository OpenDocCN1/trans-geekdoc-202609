- pgno: 55
  md: '# Introduction


    Want to communicate with a friend across town, in another state, or even in another
    country? Looking for a long-lost friend? Looking for travel or entertainment information?
    Perhaps you''re researching a term paper or exploring different paths. Where do
    you start? For these and other information-related activities, most people use
    the Internet and the web.


    The Internet is often referred to as the Information highway. In a sense, it is
    like a highway that connects you to millions of other people and organizations.
    Unlike typical highways that move people and things from one location to another,
    the Internet moves data and information. The web provides an easy-to-use interface
    to Internet resources. It has become an everyday tool for all of us today.


    End users need to be aware of the resources available on the Internet and the
    web. Additionally, they need to know how to access these resources, to communicate
    electronically, to efficiently locate information, and to use web utilities.


    ![](img/17527690010086a83ec3d8f3ee262703_55_0.png)


    Hi, I''m Sue, and I''m a webmaster. I''d like to talk with you about the Internet,
    the web, and commerce that touches our lives every day. I''d also like to talk
    with you about the role the Internet plays with Facebook, Google+, LinkedIn, Twitter,
    and online computing.


    # The Internet and the Web


    ![](img/17527690010086a83ec3d8f3ee262703_55_1.png)


    As mentioned earlier, the Internet was launched in 1969 when the United States
    funded a project that developed a national computer network called Advanced Research
    Project Agency Network (ARPANET). The Internet is a large network that connects
    smaller networks all over the globe. The web was introduced in 1991 at the Center
    for European Nuclear Research (CERN) in Switzerland. The web itself was all text—no
    graphics, animations, sound, or video. The web became possible to include multimedia
    elements. It provided a multimedia interface for resources available on the Internet.


    The first generation of the Internet, known as Web 1.0, focused on linking interaction.
    In 2001, the second generation, Web 2.0, evolved to support dynamic content creation
    and social interaction. Facebook is one of the well-known Web 2.0 applications.
    Some suggest that we have entered into the next generation, Web 3.0. It focuses
    on computer-generated information requiring less human interaction to locate and
    integrate.


    It is easy to get the Internet and the web confused, but they are not the same
    thing. The Internet is the actual network It is made of wires, cables, satellites,
    and rules for exchanging information between computers connected to the network.
    Connecting to this is often described as online. The Internet connects millions
    of computers and resources throughout the world. The web is a multimedia interface
    to the Internet. Every day over a billion users from nearly every country in the
    world use the Internet and the web. What are they doing? The most common uses
    are the following:


    +   * Communicating is by far the most popular Internet activity. You can exchange
    e-mail, photos, and videos with your friends and family


    Many individuals and institutions played a part in the development of the Internet
    and the web.


    To learn more about the Internet, visit our site at www.computing2014.com and
    enter the keyword history.


