- pgno: 29
  md: '# Information Technology, the Internet, and You


    # Competencies


    After you have read this chapter, you should be able to:


    +   1. Explain the parts of an information system: people, procedures, software,
    hardware, data, and connectivity.

    2. Distinguish between system software and application software.

    3. Discuss the three kinds of system software programs.

    4. Define and describe general purpose, specialized, and mobile applications.

    5. Identify the four types of computers and the four types of microcomputers.

    6. Describe the different types of computer hardware, including the system unit,
    input, storage, and communication devices.

    7. Define data and describe document, worksheet, database, and presentation files.

    8. Explain computer connectivity, the wireless revolution, the Internet, and cloud
    computing.


    ![](img/17527690010086a83ec3d8f3ee262703_29_0.png)


    Download the free Computing Essentials 2014 app for videos, key term flashcards,
    quizzes, and the game, Over the Edge!


    # Why should I read this chapter?


    Microcomputers were first introduced, they were used by relatively few people
    to create simple documents and analyze data. These computers were expensive, slow,
    and difficult to use. Now, microcomputers are used widely throughout the world.
    Every day billions of people use microcomputers and the Internet socially and
    professionally. Today’s microcomputers are inexpensive, very powerful, and easy
    to use.


    This chapter provides a very concise overview of computing


    and the organization of this text. It presents the various features of the text
    including boxes presenting environmental and ethical issues and special coverage
    of how you can make your work efficiently and effectively for you. Additionally,
    an overview of hardware, software, and data is presented. Finally, the concept
    of connectivity is introduced along with the Internet, web, the wireless revolution,
    and cloud computing. To effectively start to use this text, you need to understand
    these things.


    ![](img/17527690010086a83ec3d8f3ee262703_29_1.png)'
  merge: -1
  img_proc: true
