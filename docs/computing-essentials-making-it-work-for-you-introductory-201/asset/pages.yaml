  md: '# MONITORS


    # PRINTERS


    ![](img/17527690010086a83ec3d8f3ee262703_205_0.png)


    Printers translate information processed by the system unit and present the information
    on paper. Printer output is often called hard copy.


    Output is processed data or information. Output devices are any hardware used
    to produce or create output.


    Monitors (display screens) are the most widely used device. Output is often referred
    to as soft copy. Monitors vary in size, shape, and cost. Almost all, have some
    basic distinguishing features.


    # Features


    Most printers have the same basic features, including resolution measured in dots
    per dpi (dots per inch), color capability (most common black selection is grayscale),
    speed (measured in the number of pages printed per minute), memory, and duplex
    (both sides of paper) printing.


    # Features


    The most important characteristic of a monitor is its clarity, which relates to
    the quality and sharpness of images. It is a function of several monitor features,
    including resolution (matrix of pixels or picture elements), dot pitch, contrast,
    and aspect ratio.


    # Injet


    Inkjet printers spray ink at high speed onto the face of paper. Most widely used
    type of printer, reliable, quiet, and inexpensive. The most costly of inkjet printers
    is replacing the ink cartridges.


    # Laser


    Laser printers use technology similar photocopying photocopying laser beam to
    produce high-quality images. There are two categories: personal (less expensive,
    used by single user) and shared (supports color, more expensive, and supports
    group of users).


    # Flat Panel


    Flat-panel monitors are the most widely used monitor; most are LCD (liquid crystal
    display). Most common is TFT-LCD (thin-film transistor liquid crystal). AMOLED
    (active-matrix organic light-emitting diode) is a near flat-panel technology.


    # Other Printers


    There are several other types of printers. These include cloud printers, thermal
    printers, and others.


    # E-Book Readers


    E-books (electronic books) are printed books in electronic format. E-reader (e-readers)
    are mobile devices to store and display e-books and other electronic media. They
    use e-ink technology. Tablets display e-books and have a larger display area but
    are heavier, more expensive, and more difficult to read in bright light.


    +   * Cloud printers provide printing services to the Internet. Google Cloud Print
    is a service that supports cloud printing.

    * Thermal printers use elements to produce images on heat-sensitive paper.

    * Plotters are special-purpose printers for producing a wide range of specialized
    output including graphics tablets and other graphical input devices.


    # Other Monitors


    Other types of monitors include digital (interactive) whiteboards to project output;
    high-definition television (HDTV) to display clear detailed images; and older
    monitors using cathode-ray tubes (CRTs).'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# AUDIO AND VIDEO DEVICES


    # ERGONOMICS


    ![](img/17527690010086a83ec3d8f3ee262703_206_0.png)


    Audio-output devices translate audio information from the computer into sounds
    that people can understand. The most widely used are speakers and headsets.


    Ergonomics is the study of human factors related to things people use. Concerned
    with fitting the task to the user rather than forcing the user to contour to do
    the task, it involves devising that input and output devices can be used and designed
    to increase ease of use and decrease health risks.


    # Portable Media Players


    Portable media players (digital media players) are electronic devices for storing
    and playing digital media. Mobile digital television (mobile DTV) technology allows
    direct broadcast to digital media players as well as smartphones and other computers.


    # Recommendations


    Some recommendations to avoid physical discomfort are


    +   - Eyystrain on the eyes, to make the computer a 15-minute break every hour
    or two; keep everything you''re focusing on at about the same distance; and clean
    the screen periodically.

    - Back and neck pain. To help avoid back and neck problems, use adjustable equipment;
    chairs should adjust for height, back support; monitors should be at eye level
    or slightly below. Use a footrest, if necessary, to reduce fatigue.

    - Repetitive strain injury. Repetitive strain injury (RSI) is caused by fast,
    repetitive work and can generate neck, wrist, and hand pain. One particular type
    of RSI, carpal tunnel syndrome, found among heavy computer users, consists of
    damage to nerves and tendons in the hands. Ergonomically correct keyboards prevent
    injury. Take short rest breaks and gently massage hands.


    # COMBINATION INPUT AND OUTPUT DEVICES


    Many devices combine input and output capabilities.


    # Multifunctional Devices


    Multifunctional devices (MFD) typically combine the capabilities of a scanner,
    printer, fax, and copy machine.


    # Internet Phones


    Internet phones send and receive voice communication over the computer networks
    using voice over IP (VoIP), telephone, IP telephone). Skype is a widely used VoIP
    service.


    # Robots


    Artificial intelligence (AI) attempts to mimic human senses, thoughts, and actions.
    Robots in an area of AI use robots (computer-controlled machines that mimic the
    motor motions of living things). Four types of robots: perception system, industrial,
    mobile, and household.


    # Virtual Reality Headgear and Gloves


    Virtual reality (VR) creates 3D simulated environments. Virtual reality hardware
    includes headgear and gloves. Applications include training environments, such
    as in aviation, surgery, spaceship repair, or nuclear disaster cleanup.


    # CAREERS IN IT


    Technical writers prepare instruction manuals, technical reports, and other documents.
    An associate or a college degree in communication, journalism, or English and
    a specialization in, familiarity with, a technical field are required. Salary
    range is $41,000 to $78,000.'
