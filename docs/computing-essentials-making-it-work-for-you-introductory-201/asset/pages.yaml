    to write negative reviews of products or services? Would you start a blog? If
    you could start a blog for a specific niche or interest, what would it be about?
    If you ever read a blog that provided incorrect information, what did you do?
    What do you do to determine whether the content is correct?

    * Ethics: MONITORING

    | Many companies use software to monitor what their employees do on the internet.
