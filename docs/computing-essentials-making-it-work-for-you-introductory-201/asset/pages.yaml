    # Features


    Have you considered the environmental impact of using your inkjet printer? Whenever
    possible, don''t print. Use e-mail attachments, and encourage your school to use
    web technologies that let students upload their workload. If you must print, buy
    ink cartridges that are preferably recycled. And when your ink runs out, bring
    the cartridge to a retailer that will make sure it is recycled. Many retailers
    often offer a discount on new cartridges when you return old. To see more environmental
    facts, visit our website at www.computing2014.com and enter the keyword environment.


    There are many different types of printers. Almost all, however, have some basic
    distinguishing features, resolution, color capability, speed, memory, and duplex
    printing.


    +   * **Resolution** for a printer is similar to monitor resolution. It is a measure
    of the clarity of images produced. Printer resolution, however, is measured in
    **dpi (dots per inch)**. (See Figure 6-23) Most printers use average 4,800 to
    1,200 dpi. The higher the dpi, the better the quality of images


    +   ** Color capability** is provided by most printers. Users typically have the
    option to print with either black ink or color. Because it is more expensive to
    print in color, most users select black for letters, drafts, and homework. The
    most common black ink is **grayscale**, in which images are displayed using many
    shades of gray. Color is used more selectively for final reports containing graphics
    and for photographs.


    +   **Speed** is measured in the number of pages printed per minute. Typically,
    printers for personal use use average 15 to 19 pages per minute for single-color
    (black) and output 13 to 15 pages per minute for color output.


    +   **Memory** within a printer is used to store printing instructions and documents
    waiting to be printed. The more memory the printer is, the faster it will be to
    create large documents.


    +   **Duplex printing** allows automatic printing. Although not currently a standard
    feature for all printers, it will likely become standard in the future as we will
    be able to reduce paper waste and protect the environment.


    ![](img/17527690010086a83ec3d8f3ee262703_193_1.png)


    Figure 6-24 Inkjet printer


    # Injet Printers


    Injet printers spray ink at high speed over the surface of paper. This process
    not only produces a lower-quality image but also permits printing to be done in
    a variety of colors, making it ideal for printing photos. (See Figure 6-24) Injet
    printers are the most widely used printers. They are reliable, quiet, and relatively
    inexpensive. The most costly of inkjet printers is replacing the ink cartridges.
    For this reason, most users specify black ink for the majority of print jobs and
    use the most


