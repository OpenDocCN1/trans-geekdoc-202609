  md: '![](img/17527690010086a83ec3d8f3ee262703_251_0.png)


    Wireless access points that provide Internet access are widely available in public
    places such as coffee shops, libraries, bookstores, colleges, and universities.
    These access points are known as hotspots and typically use Wi-Fi technology.
    These services are free and easy to find using free locator sites as www.hotspot-locations.com.
    Most mobile computing devices have an internal network card to connect to hotspots.
    If your mobile device does not have an internal network card, you can use an external
    wireless adapter (see Figure 8-15) that plugs into your computer''s USB port or
    PC card slot.


    # Personal Area Network


    A personal area network works within a very small area—your immediate surroundings.
    PANs connect phone to headsets, PDAs to other PDAs, keyboards to phones, and so
    on. These self-configuring networks make it possible for all our gadgets to interact
    wirelessly with each other. The most popular PAN technology is Bluetooth, with
    a maximum range of 33 feet. All wireless personal devices available today use
    Bluetooth, including the controllers on popular systems like the PlayStation and
    Wii.


    Figure 8-15 Wireless adapter


    # Do you use your notebook to connect to wireless networks at school or in public
    places such as coffee shops, airports, or hotels? If it is important to use caution
    to protect your content and privacy. Here are a few suggestions:


    +   1 Use a firewall. A personal firewall is essential when connecting your computer
    to public networks. Some firewalls, such as the one built into Windows 7 and Windows
    8, will allow a new network to be treated as work, or a public if you are unsure.

    2 Avoid hotspots. hotspots in popular areas where users expect free Wi-Fi, such
    as coffee shops and stores. Since many operating systems automatically connect
    to the access point with the strongest signal, you could be connecting to the
    access point set by that establishment. Always confirm that you are connecting
    to the access point of establishment. Ask an employee if you are unsure.

    3 Turn off file sharing. Turning off features in your system will ensure that
    no one can access or modify your files.

    4 Check if connection is encrypted. If the hotspot you are using is protected
    with a password, then it is encrypted. If it is not, be very careful with websites
    you visit and the information you provide.

    To see additional tips, visit our website at www.computing2014.com and enter the
    keyword tips.


    # Metropolitan Area Networks


    The next step up from the MAN—the metropolitan area network. MAN spans distances
    up to 100 miles. These networks are frequently used as links between buildings
    that are located throughout a city.


    Unlike a LAN, a MAN is typically owned by a single organization. Rather, it is
    owned by a group of organizations that operate the network or by a single network
    service provider that provides network services for a fee.


    # Wide Area Networks


    Wide area networks (WANs) are nationwide and worldwide networks. These networks
    provide access to regional service (MAN) providers and typically span distances
    greater than 100 miles. They use microwave relays and satellites to reach users
    over thousands of miles—for example, from Los Angeles to Paris. The widest of
    all WANs is the Internet, which spans the entire globe.


    The difference between a LAN, MAN, and WAN is the geographic range. Each may have
    various combinations of hardware, such as microcomputers, midrange computers,
    mainframes, and various peripheral devices. For a summary of network types, see
    Figure 8-16.


    ```

