    # Other Monitors


    There are several other types of monitors. Some are used for more specialized
    applications, such as making presentations and watching television.


    +   * **Digital** or **interactive whiteboards** are specialized devices with
    a large display connected to a computer or projector. The computer''s desktop
    is displayed on the digital whiteboard and controlled using a special pen, a finger,
    or some other device. Digital whiteboards are widely used in classrooms and corporate
    boardrooms (See Figure 6-21).

    * **High-definition television (HDTV)** delivers a much clearer and more detailed
    wide-screen picture than regular television. Because the output is digital, users
    can readily freeze video sequences to high-quality still images. The video and
    still then can be edited, digitized, and stored on disk for later use. This technology
    is very useful for artists, designers, and publishers (See Figure 6-22). Using
    special viewing glasses, 3-D HDTV provides three-dimensional viewing.

    * **Cathode-ray tubes (CRTs)** are similar in size and technology to older televisions.
    They have been replaced by flat-panel monitors. Discarded CRTs, however, are a
    serious threat to our environment. Each CRT contains approximately four pounds
    of lead and numerous other hazardous materials. Don''t throw out an obsolete CRT.
    Dispose of it in a responsible manner through an EPA-certified recycling program.
    Most large cities and manufacturers including IBM, Microsoft, and Dell have certified
    programs.


