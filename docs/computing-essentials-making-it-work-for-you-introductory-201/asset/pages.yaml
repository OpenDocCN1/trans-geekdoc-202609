    +   * A third-party cookie is usually generated by an advertising company that
    is affiliated with the website you are currently visiting. They are used by the
    advertising company to keep track of your web activity as you move from one site
    to the next. For this, reason are often referred to as tracking cookies. Critics
    of this practice claim that your privacy is being violated because your activity
    is being recorded across multiple websites. Defenders of this practice argue that
    these cookies are beneficial because it helps save information that interests
    you. For example, suppose you visit four websites that are about cars, the fourth
    is a search engine. When you visit the fourth site, you will likely see a car
    advertisement because your cookie showed that you had been visiting car-related
    websites.


    Some users are not comfortable with the idea of web browsers storing much information
    in the form of cookies, history, and temporary Internet files. For this reason,
    browsers now offer an easy way to delete their browsing history (See Figure 9-8).
    In addition, most browsers also offer a privacy mode, which ensures that your
    browsing activity is not recorded on your hard disk. For example, Internet Explorer
    9 provides InPrivate Browsing accessible from the Tools button, and Safari provides
    Private Browsing accessible from the Safari option on the main menu.


