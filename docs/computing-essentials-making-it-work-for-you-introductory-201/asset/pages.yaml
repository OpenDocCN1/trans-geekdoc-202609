    # # Cloud Computing


    Did you know that the move to cloud computing could benefit the environment? Large
    centers, such as servers and mainframes, require significant amount of energy
    for their operation and cooling. Using large cloud data centers, which are stored
    on their computer system''s hard disks. As discussed in Chapter 1, cloud computing
    uses the Internet and web to shift many of these computer activities from the
    user''s computer to other computers on the Internet.


    While some argue cloud computing is merely a marketing term designed to promote
    new products, others see cloud computing as a new model that frees users from
    owning, maintaining, and storing software and data. It provides access to these
    services from anywhere through an Internet connection. Several prominent firms
    are aggressively pursuing this new concept. These firms include Google, IBM, Intel,
    and Microsoft to name just a few.


    The basic components of cloud computing are clients, the Internet, and service
    providers. (Figure 2-19).


    +   - Clients are corporations and users who want access to data, programs, and
    storage. This access is to be available anywhere and anytime that a connection
    to the Internet is available. End users do not need to buy, install, and maintain
    application programs and data.


