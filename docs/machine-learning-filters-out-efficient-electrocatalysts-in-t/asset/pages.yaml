    mechanical methods used in the screening protocols. The three criteria used for
    the stability of each core and shell structure. For the element (Z), we selected
    the electrochemically stable elements based on the Pourbaix diagrams that did
    not dissolve under various conditions such as OR and Au, Ir, Pd, Ag, Rh, Ba, Tc,
    Ce and W for the HOR. On the other hand, for the core (Z), we estimated its thermodynamic
    stability (Ef < 0.1 eV). We used the predicted GCNN model (MAE of only 0.04 eV)
    to predict the formation energies of these alloys. Note that the threshold was
    0.1 eV for any promising candidate materials.


    The second criterion was the mechanical stability between the core shell, which
    was verified by its lattice mismatch [58]. The cases with lattice parameter mismatch
    than 5 % were not selected at this stage. The last criterion is the catalytic
    performance, and the predicted GCNN model was used. For the OR, materials with
    U (pure Pd) were passed. For the HOR, materials with $|\Delta G_{HOR}|<0.24$ eV
    and $\Delta G_{HOR}>-1.4$ eV (the values of pure Pd) passed. In addition we excluded
    materials that received electroactive elements (alkali metals and alkaline earth
    metals) such as Li, Na, Mg, K, Ca, and trace elements (Hg, Ti, Pb), and the very
    expensive element Re. These filtering processes resulted in only 55 and 94 promising
    candidates for the OR and HOR, respectively, which are potentially stable and
    may outperform each other experimentally.


