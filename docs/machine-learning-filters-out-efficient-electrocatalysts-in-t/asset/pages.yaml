    # 3. Adsorption energy as a descriptor for the fuel cell performance


    The first step is to identify the descriptors for ORR and HER performance. For
    the ORR, where O2 molecules are reduced to H2O via a four-electron pathway (Fig.
    1A), the rate determining step (RDS) is the largest uphill step from O to H2O
    at the electrochemical potential (1.23 V vs RHE). ORR over-low scaling relations
    suggest that one of the following mechanisms is limiting: (1 + +E) - O* (O2* -
    OH*) or (1.23) - OH* (H2O - OH*) or (1.45) - OH* (H2O - OH*) (Fig. 1B).


    On the other hand, the HER is a simpler reaction (H2+) involving a two-electron
    pathway with intermediate steps (H*). H2 molecules are adsorbed on the surface
    of the metal, and the H2 adsorbed on the catalytic surfaces dissociate into hydrogen
    atoms (H*), finally recombining to evolve as H2. Here, a potential difference
    much smaller than 0.24 eV (at Pt(111)) is desired. Therefore, CO poisoning on
    the catalytic surfaces is not a problem for the anode; however, CO poisoning is
    the bottleneck [56,57]. Therefore, the promising zone for the HER is defined by
    Fig. 1D with diagrams of ΔG_H of 0.24 eV and -1.4 eV (both values corresponding
    to pure Pt).


