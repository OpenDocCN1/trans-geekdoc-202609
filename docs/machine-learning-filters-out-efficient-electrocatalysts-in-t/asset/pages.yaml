    Ternary alloy\nMachine learning\nCatalyst design protocol\n\n# ABSTRACT\n\nDespite\
    \ their potential, multi-component materials have not been actively considered\
    \ as catalysts due to the massive compositional complexity. However, targeting\
    \ electrocatalysts for fuel cells we present a machine learning (ML)-driven catalyst\
    \ screening protocol to identify structures of structural stability, selectivity,\
    \ performance, and cost-effectiveness. We tested 17 candidates out of 30 elements\
    \ through three test materials in the alloy coreshell{X(Y)Z}Fe for each cathode\
    \ and anode of fuel cells. The candidates are potentially stable, lower-cost and\
    \ higher-performance than a Pt film. CuAuPt, one of the final candidates, outperformed\
    \ a Pt film by an approximately 2-fold increase in current density with the 2.7-fold\
    \ reduction in Pt usage. This demonstration demonstrates that our ML-driven strategy\
    \ can be highly useful for exploring multicomponent systems and catalysis design.\n\
    \n# 1. Introduction\n\nPlatinum (Pt), a highly scarce and expensive element, is\
    \ used as an indispensable ingredient in fuel cells. For the last decade, extensive\
    \ efforts have been made to develop less expensive catalysts that maintain catalytic\
    \ activity comparable to that of [1–4]; however, the others are either poor in\
    \ Pt or merely a Pt-based material [5–9].\n\nFor the cathode where oxygen reduction\
    \ reaction (ORR) occurs, Pt(with Pt skin) is the state of the art; on the anode\
    \ where hydrogen reaction (HOR) occurs, Ni is used due to its high activity to\
    \ avoid the severe CO issues but is not durable [10]. It is difficult to find\
    \ novel and lower-cost materials for both the cathode and anode without sacrificing\
