  mdcn: "\n\n## 3.3. 基于全机器学习（ML）的筛选方案\n\n方法论部分提供了关于图编码、卷积和池化函数、网络架构以及超参数的信息。对于节点，考虑了周期表中存在的12\
    \ 种元素，但仅使用了四个特征（族、周期、金属数和电离电位）的组合来预测 5209 个值的吸附能量（图 2C）。额外特征的加入无疑降低了平均绝对误差（MAE）。在图\
    \ 2 和表 5 中，展示了每个元素（O、OH、HH 和 Co）的机器学习测试，其 MAE 范围在 0.06 到 0.14 eV 之间，可能是由于吸附能量范围较窄。由于数据集规模较小，OH\
    \ 吸附的 MAE 达到了 0.29 eV，处于较低水平。经过 5 折交叉验证后，总 MAE 为 0.16 eV，由于数据集规模的增加，显著优于我们之前的报告\
    \ [37]。在机器学习训练期间没有观察到过拟合现象，如图 2E 的第一行所示。\n\n使用训练良好的模型，我们探索了巨大的三元合金空间。这项研究重点关注一种名为\
    \ L1；合金-壳(X/Y/Z) 的特定结构，这些催化剂并非电池运行的一部分。我们的目标结构 (X/Y/Z) 燃料电池（FC）环境严酷，我们根据标准还原电位包含了\
    \ Pt 和 Au 作为元素。图 3 提出了基于全机器学习的催化剂筛选方案，该方案不需要任何 DFT 或实验理论级的输入。对于 X/Y/Z 的吸附能量预测，我们使用了与二元合金相同的吸附方法（OH\
    \ 除外）。对于 OH，我们使用了不同的模型。这种调整得益于机器学习模型的快速预测能力。总共有 3180 个三元合金和 82,967 个真实衬层抽象结构被输入过滤过程，如果仅使用筛选方案中的机械方法，这在实践中是不可行的。\n\
