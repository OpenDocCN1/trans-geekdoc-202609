    (3 M KCl) 作为参考电极和对电极。通过以下方程测量电位以评估逆氢反应 (HER)：


    ```

    $E = E_{Ag/AgCl} + E''_{Ag/AgCl} + 0.0591 V$

    ```


    其中 E 是相对于 RHE 的转换电位，$E''_{Ag/AgCl} = 0.210 V$，E 是相对于 Ag/AgCl 的实验测量电位。在 0.1 M KOH
