    CuAu 壳系统的潜在多功能性。


    事实上，为了捕捉纯 Pt 与我们的 CuAu@Pt 薄膜之间的催化性能，ORR 活性高于纳米颗粒 (NP)。对于通过湿化学方法合成的核壳结构，很难控制核心的尺寸和形状。通过控制实验参数（例如改变催化剂、离子和溶剂之间的比例），我们使用直流磁控溅射
