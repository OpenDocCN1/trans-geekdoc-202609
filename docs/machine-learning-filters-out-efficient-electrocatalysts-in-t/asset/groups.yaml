    # 2.2. ML model development


    For SGNN, the graph was constructed based on the structure of the two layers of
    dopants and adsorbates. The elements of each $i^{th}$ atom (node) in the system
    are entered into a vector $v_i$, which contains the information available in the
    atomic table of elements. In this work, we used a vector $v_i$ that includes atomic
    features along with their ranges, colors. The edge (bond between $i^{th}$ and
    $j^{th}$ atom) is denoted by $d_{ij} < r_{\delta}$, where $d_{ij}$ is the distance
    between $r_i$ and $r_j$, and $\delta$ is the length of the bond. The bond is represented
    by a vector $u_{ij} = e_k$, where $k$ is the $i^{th}$ center node and $j$ is the
    neighbor node. We also included the direction $j$ in the message vector. Distance-invariant,
    the values of $u_{ij}$ and $d_{ij}$ were numerically generated using formulas.


    ```

    $v_i^{(l+1)} = \sigma(W_v^{(l)} \sum_{j \in \mathcal{N}(i)} W_u^{(l)} u_{ij} \odot
    v_j^{(l)} + b^{(l)})$

    ```


    where the convolutional layer and filters are denoted by $l$ and $f$ respectively,
    $W_v^{(l)}$, $W_u^{(l)}$, and $b^{(l)}$ are the convolution weights and biases
    of $l^{th}$ layer and $f^{th}$ filter. $\odot$ denotes element-wise multiplication,
    $\sigma$ is a sigmoid function, and $EL$ is the exponential linear activation
    function [40]. The normalized sum of all atom vectors in the $l^{th}$ layer is
    denoted by $S_i^{(l)} = \sum_{j \in \mathcal{N}(i)} v_j^{(l)}$.


    The model was trained using the pooling phase. The pooled vectors were connected
    with the adsorption energy of the molecule. The optimized values are shown in
    parentheses: the number of convolutions and filters (1, 2), layers (3), learning
    rate ($5 \times 10^{-3}$), then decreasing learning rate (0.99 for every 100 epochs),
    number of filters (4-6), and the number of randomly distributed atoms in each
    (1000), batch size (31, 64), and total number of epochs (800). The mean squared
    error (MSE) was used to evaluate the loss function $J$. The Adam optimizer was
    used to train the model. To minimize over-fitting, $L^2$ regularization techniques
    were employed. Table S2 includes a list of hyperparameters and parameters for
    the optimization process.


    # 2.3. Experimental fabrication of CuAu by sputtering


    The prepared Ni electrodes were placed in a vacuum chamber of a direct-current
    (DC) sputtering system. To create a CuAu thin film, 99.99% pure 3-Cu target and
    99.99% pure Au targets were used. Gold foil was pressed crossed on the cathode,
