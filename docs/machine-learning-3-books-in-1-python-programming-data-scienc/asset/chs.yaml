  \ `Pandas` 等工具。记住，`Pandas` 具有高级的数据结构和处理工具，可以简化数据分析。尽管如此，你应该避免的一点是尝试同时学习 `Python`\
  \ 中的每一个工具和库。当你试图一次性学习一切时，你将花费大量时间在不同的概念、属性之间切换，并感到沮丧，切换到其他东西。所以，你应该尝试集中于以下基础步骤：\n\
  \n* 掌握 `python` 基础\n* 掌握 `Numpy`\n* 学习 `Pandas`\n* 理解 `Matplotlib`\n\n从这里开始，你可以继续扩展更多主题。\n\
  \n# 第 3：初学者计算机网络\n网络系统、无线技术、IP 子网完全指南，包括网络安全基础与人工智能的物联网\n\n## 引言\n\n对于任何寻求有效利用网络资源和力的人来说，理解计算机的概念是一项意义重大的努力；在当今世界，人类互动各个方面的网络化已与计算机的使用紧密相关。从社交网络到数字媒体和业务网络，得益于\
  \ `PC` 网络这一价值万亿美元的想法，世界确实已经变成了一个地球村。在我们所做的一切中，提到 `Internet` 作为 `PC` 网络最大的成果是不可避免的。随着计算机网络取得了巨大进步，通信系统日复一日地变得越来越高效。\n\
  \n在《计算机网络》中，读者将熟悉计算机网络的基本方面，从最基础的网络细节开始，这些细节旨在为更高级的计算机网络概念奠定基础。尽管解释得很简要，但每个主题提供的信息都足以涵盖网络初学者的基本需求。第一章向读者介绍了计算机的基本概念，包括对计算机网络的简单描述、网络拓扑和网络类型。此外，还对无线网络进行了简单概述，并对网络安全进行了深入讨论。在随后的章节中，其他重要的网络主题脱颖而出，包括无线技术、点对点网络、路由器和服务器基础以及\
  \ `IP` 地址。书中还涵盖了 `Internet` 的基础和功能，并特别关注全球维网。此外，本书概述了 `CCNA` 课程的范围以及机器学习的精要。这本书向读者介绍了令人兴奋的网络体验：为更广泛的网络领域提供了坚实的基础。\n\
  \n## 第 1 章：计算机网络：简介\n\n![](img/Image0008.jpg)\n\n## 网络基础\n\n什么是计算机网络？计算机网络是指相互连接的计算机组，允许它们之间共享应用程序、数据和其他网络资源（如文件服务器、打印机等）。网络可以根据规模、功能甚至位置进行区分。然而，规模是分类的主要标准。因此，有许多独特的网络，我们将在“网络类型”小节中分别讨论。\n\
  \n## 网络拓扑\n\n网络拓扑指的是组件的布局及其连接方式。存在两种形式的网络拓扑：\n\n#### 逻辑拓扑\n逻辑拓扑定义了连接网络设备呈现的形式。它是网络通信机制的架构设计。\n\
  \n#### 物理拓扑\n物理拓扑可以认为是网络所有节点的几何表示方式。以下是各种物理拓扑类型：\n\n##### 总线拓扑\n在这种拓扑中，网络上的所有主机通过单根电缆连接。网络设备直接连接到骨干电缆，或通过支路电缆连接。当一个节点想要发送某些信息时，它将其发送到整个网络。无论信息是否有地址，所有网络节点都会接收。这种拓扑主要用于\
  \ `802.4` 和 `802.3`（以太网）标准网络。与其他拓扑相比，总线拓扑的配置更为简单。骨干电缆是信息传输到网络所有节点的“单行道”。总线拓扑通常依赖\
  \ `CSMA` 作为主要的访问方法。\n\n[content]\n---\n\n#### 总线拓扑的优点\n* 安装成本低，因为节点直接通过电缆连接，不需要集线器或交换机。\n\
  * 通过同轴电缆和双绞电缆支持中等数据速率，但仅支持 `10 Mbps`。\n* 使用熟悉的技术，使其安装和故障排除轻而易举，因为工具和材料随处可见。\n* 可靠性很高，因为单个节点的故障对其余网络节点没有影响。\n\
  \n#### 总线拓扑的缺点\n* 布线非常复杂。这可能导致过程变得非常枯燥。\n* 对于大多数网络管理员来说，排除电缆故障是一件苦事。\n* 如果不同节点同时发送消息，消息冲突的概率很高。\n\
  * 添加新节点会减慢整个网络速度。\n* 网络扩展会导致信号强度的衰减。这可以使用中继器（重新产生信号）来纠正。\n\n\n\n\n\n# 环形拓扑\n环形拓扑与总线拓扑唯一的区别在于前者末端是连接的；而后者末端是开放的。当一个节点接收到发送者的消息时，该节点会将消息发送给下一个节点。因此，通信是单方向的——它是单向的。网络上的每一个节点都连接到另一个节点，且没有终止点。数据在一个环中连续流动——一个无尽的循环。数据流始终沿顺时针方向传输。环形拓扑通常使用令牌通过作为主要的接入方法。令牌通过：一种令牌从一个站传递到另一个站的接入方法。令牌：在网络中移动的数据帧。\n\
  \n## 令牌通过的操作过程\n* 令牌在网络中移动——从一个节点到另一个节点，直到到达目的地。\n* 发送者在令牌中放入地址和数据。\n* 令牌从一个节点传递到下一个节点——将令牌地址与网络上每个节点的单独地址进行比对，直到找到匹配项。\n\
  * 令牌被用作载体——用于数据（以及地址）。\n\n## 环形拓扑的优点\n* 网络管理相对容易，因为可以移除故障组件而不影响其他组件。\n* 该网络拓扑的大多数硬件和软件需求都是现成的可用。\n\
  * 安装成本非常低，因为所需的常用双对电缆非常廉价。\n* 网络具有很高的可靠性，因为它不依赖于单台主机。\n\n## 环形拓扑的缺点\n* 在缺乏专用测试设备的情况下，故障排除可能是一项艰巨的任务。检测电缆故障通常是一项严峻挑战。\n\
  * 节点故障会导致整个网络故障，因为令牌必须通过每个节点才能完成从发送者到目的地的完整通信周期。\n* 添加新网络设备会减慢整个网络的速度。\n* 通信延迟随着节点/网络组件的增加而增加。\n\
  \n# 星型拓扑\n在这种拓扑中，中央计算机、交换机或集线器连接了网络上的所有节点。中央设备是服务器，外设是客户端。同轴电缆或以太网的 RJ-45 常用于网络节点与服务器的连接。在这种拓扑中，交换机和集线器被优选作为主要的连接设备。这是目前网络实现中最广泛使用的拓扑。\n\
  \n## 星型拓扑的优点\n* 故障排除非常容易，因为问题在单个站上处理。\n* 复杂的网络控制功能可以轻松在服务器端实现——这还允许某些任务的自动化。\n*\
  \ 故障范围有限，因为某根电缆的问题不会转化为整个网络问题。电缆故障可能只影响网络上的单个节点，因为节点之间不是通过电缆互连的。\n* 交换机或集线器上的开放端口允许网络于扩展。\n\
  * 使用廉价的同轴电缆使得星型拓扑在实施上具有极高的性价比。\n* 它具有处理高达 100Mbps 数据速度的能力。因此，它支持极高速的数据传输。\n\n##\
  \ 星型拓扑的缺点\n* 如果中央连接设备失效或发生故障，整个网络将宕机。\n* 布线的使用有时使路由变成一项精疲力竭的任务——电缆路由通常很困难。\n\n#\
  \ 树型拓扑\n这种拓扑将总线和星型拓扑的特征结合在一起。在这种 particular 拓扑中，所有计算机都相互连接，但以分层的方式进行。该拓扑中最顶端的节点被称为根节点，而所有其他节点都是根节点的后代。两个节点之间仅存在一条数据传输的路径——形成父子层级结构。\n\
  \n## 树型拓扑的优点\n* 它支持远距离宽带数据传输，而不会出现衰减问题。\n* 星型拓扑允许网络于扩展，因为可以很轻松地向现有网络添加新设备。\n* 于管理——网络划分为星型网络，使得管理相对容易。\n\
  * 可以轻松地检测并纠正错误。\n* 单个节点的故障或崩溃不会影响网络上的其他节点。因此，树型拓扑网络上的故障是有限的。\n* 它支持每个网络段的点对点布线。\n\
  \n## 树型拓扑的缺点\n* 处理节点故障方面的问题总是很困难的。\n* 这是一种高成本网络拓扑，因为宽带传输可能极其昂贵。\n* 主总线电缆的故障或失效会影响整个网络。\n\
  * 当向网络添加新设备时，重新配置网络具有困难性。\n\n# 网状拓扑\n在这种拓扑中，所有计算机都通过冗余连接相互互连。它提供了从一个节点到另一个节点的不同（多个）路径。在网状拓扑中，没有像交换机或集线器那样的连接设备。例如，互联网。广域网（WAN）通常使用网状拓扑实现，因为通信故障是严重关注的问题。它也大量应用于无线网络中。形成网状拓扑的公式所示：\n\
  \n```\n电缆数量 = (z*(z-1))/2\n```\n其中；`z` = 网络上的节点数量\n\n这种拓扑有 2 类：\n\n## 部分连接网状结构\n\
  在这种拓扑中，并非所有的网络设备都连接到与其频繁通信的设备上。设备仅连接到某些与其通常保持持续通信的设备上。\n\n## 全网状拓扑\n在全网状拓扑中，每个网络设备都有指向网络中每个其他设备的链路。简单来说，所有计算机都通过冗余连接相互连接。\n\
  \n## 网状拓扑的优点\n* 网状拓扑具有高度可靠性，因为单个连接的故障不会影响网络中节点的工作。\n* 通信很快，因为每台计算机都与网络上的所有其他计算机连接。\n\
  * 添加新设备对网络上的其他设备没有影响——使得重新配置非常容易。\n\n## 网状拓扑的缺点\n* 网状拓扑能够容纳比任何其他网络拓扑更多的设备和传输介质。这导致建立网状网络的成本更高。\n\
  * 网状拓扑网络通常太大，难以有效管理和维护。\n* 网络中大量的冗余会显著降低网络效率。\n\n\n\n\n这种成本非常高，因为此类计算机网络使用的集线器与普通集线器不同。这种拓扑结构使用的集线器更贵。此外，整个基础设施的成本也非常高，因为需要大量的布线以及更多的网络设备。\n\
  \n## 网络类型\n以下是根据尺寸对计算机网络进行的四大分类：\n\n### 局域网（或简称 LAN）\n`LAN` 指任何连接在小区域（如办公室或小型楼宇）内的计算机组。在\
  \ `LAN` 中，两台或更多计算机通过同轴电缆、双绞线缆或光纤等通信介质连接。建立 `LAN` 简单且成本较低，因为它可以使用廉价的网络硬件，如 `switches`、`Ethernet\
  \ cables` 和网络适配器来良好地运行。有限的流量允许数据在 `LANs` 上更快地传输。此外，由于 `LANs` 设置在较小的空间内，易于管理。因此，通过对网络地理位置内的活动进行密切监控，还增强了安全执行。\n\
  \n### 个人局域网（PAN）\n这种网络在用户的空间内进行安排和管理——通常范围不超过 10 米。它通常用于连接计算机设备供个人使用。个人局域网的组件包括笔记本电脑、手机、媒体播放器设备以及游戏机。此类组件位于人身空间约\
  \ 30 英尺的范围内。`PANs` 的概念源于托马斯·齐默曼（Thomas Zimmerman），他是第一个构思个人局域网概念的首席研究科学家。`PANs`\
  \ 有两种：\n\n- **有线 PAN**：当人使用 `USB cable` 连接两个不同的硬件设备时，就创建了有线个人局域网。例如，现在通过 USB 线将手机连接到计算机以共享文件、访问互联网以及许多其他事情是常见的做法。\n\
  - **无线 PAN**：无线 PAN 通过使用 `Bluetooth` 和 `Wi-Fi` 等现有的无线技术建立。这基本上是一种短距离的技术网络类型。\n\n\
  #### PAN 示例\n有 3 种常见的个人局域网：\n\n1. **体域网**：它随个人移动。一个很好的例子是移动网络——当一个人建立网络连接，然后与其范围内的不同设备建立连接时。\n\
  2. **离线网络**：它也称为家庭网络。它可以在家庭中连接计算机、电视、打印机和手机——但没有连接到互联网。\n3. **小型家庭办公室网络**：不同的设备通过\
  \ `VPN` 连接到互联网和企业网络。\n\n### 市域网（或简称 MAN）\n`MAN` 是一种通过互连不同的 `LANs` 以形成更大的计算机网络，从而扩展到更大地理区域的网络。因此，它覆盖的范围比\
  \ `LAN` 更广。`MANs` 理想情况下建立在城市和大型城镇。因此故名为市域网。它通常被政府机构用于连接公民和某些大型机构；给定城市内银行机构之间的通信；大城市内高等教育机构；甚至被用于城市/城镇内军事基地的通信。常用的市域网协议包括\
  \ `Frame Relay`、`ISDN`、`RS-232`、`ADSL`、`ATM` 和 `OC-3` 等。\n\n### 广域网（或简称 WAN）\n这是一种跨越大地理区域（城市、州甚至国家）的网络。它比\
  \ `LAN` 或 `MAN` 大。它不受限于特定的地理位置。它通过电话线、卫星链路或光纤跨越大的地理位置。互联网是全球现有 `WANs` 中的完美范例。`WANs`\
  \ 被广泛教育、政府和商业活动。\n\n#### WAN 示例\n- **移动宽带**：`3G` 或 `4G` 网络广泛为大区域、州甚至国家的人提供服务。\n\
  - **私有网络**：银行创建私有网络，通过从电信公司获得的租赁线路连接建立在不同位置的不同办公室。\n- **最后一公里**：电信公司通过简单用 `fiber`\
  \ 连接家庭、办公室和营业场所，为不同城市的数千客户提供互联网服务。\n\n#### WAN 的优点\n- `WANs` 覆盖大地理位置，触及大量人口。互联网对全球人们生活的影响总结了广域网的优势。\n\
  - **数据中心化**：`WANs` 支持数据/信息的中心化。这消除了个人为其电子邮件和文件购买备份服务器的需要。\n- **获取更新文件**：由于软件在实时服务器上运行，程序员可以在几秒钟内获取更新的文件。\n\
  - **消息快速交换**：`WANs` 使用的技术和复杂的工具使消息交换比大多数其他网络都更快。得益于互联网（世界上流行的 `WANs` 之一），通过 `Skype`\
  \ 和 `Facebook` 进行通信是快速消息交换的两个例子。\n- `WANs` 允许资源和软件共享。可以通过广域网共享硬盘、`RAM` 和其他资源。\n\
  - **无国界业务**：目前，即使是隔着太平洋的人也可以因为互联网在不离开当前位置一分不动的情况下开展蓬勃发展的业务。世界确实是一个地球村。\n- **高带宽**：公司使用租赁线路增加了带宽。这反过来又增加了数据传输率，从而提高了公司的生产力。\n\
  \n#### WAN 的缺点\n- 随着网络规模的增大，安全问题也会升级。因此，不安全问题在 `WAN` 上比在 `LAN` 或 `MAN` 上更关注。\n-\
  \ **高安装成本**：建立 `WAN` 需要购买许多贵的设备以及用于管理软件应用程序。用于服务的 `Routers`、`switches` 和主主机计算机 耗资巨昂。\n\
  - 网络故障排除通常是一个大问题，因为网络跨越了大的地理位置。\n\n## 神经网络\n神经网络是指一组用于模式识别的算法。这些算法松地模仿了人类的大脑。神经网络通过机器感知、聚类和标记来解释原始数据至关重要。神经网络识别位于向量中的数值模式。\n\
  \n## 神经网络的功能\n以下是神经网络执行的三个最关键的角色：\n\n### 分类\n标记数据集是任何分类的关键因素。人类必须将自己的知识转移到标记数据集中，以便让神经网络在监督学习过程中获取关联数据和标签。神经网络可以完成以下任务：\n\
  - 人脸检测、图像中的人物识别和面部识别。\n- 图像对象识别。\n- 语音识别、语音转文本、语音情感识别和说话人识别（在对话中）。\n- 文本分类——保险索赔中的欺诈文本和电子邮件垃圾邮件。\n\
  \n### 聚类\n这也被称为分组。它涉及相似性的检测。这可以在无监督学习过程中无标记完成。过程涉及：\n- **搜索**：比较图像、文档或声音以获取相关项目。\n\
  - **异常检测**：聚类还寻求发现分组中的异常行为。这对于检测和防止某些不良项目和活动（如欺诈）至关重要。\n\n\n\n\n# 预测分析\n预测分析：这通常被称为回归。深度学习依赖数据分类来建立对象之间的关联。这可以被简单地称为静态预测。深度学习具有建立当前事件与未来事件之间关联的能力。在以下方面，预测分析至关重要：\n\
  \n* 健康故障。\n* 客户流失。\n* 硬件故障。\n* 员工离职。\n\n# 神经网络的元素\n深度学习是“堆叠神经网络”的另一种术语。堆叠神经网络是由许多层组成的网络。每个网络层由不同的节点组成——这是根据人类大脑神经元模式设计的计算点。节点将所有数据输入与权重（系数集）结合在一起。权重可以削减或放大输入。这反过来为与给定算法试图捕捉的任务相关的输入赋予了重要性。总而言之，以下是神经网络的关键元素：\n\
  \n* 层\n* 节点\n* 系数集（权重）\n\n### OSI 模型\nOSI 是开放系统互连（Open System Interconnection）的缩写。该模型描述了软件应用程序的信息和数据如何通过物理介质传输到另一台完全无关计算机上的软件应用程序。这一参考模型由七层组成。每一层都有其特定的作用。OSI\
  \ 参考模型于 1984 年由国际组织（`ISO`）诞生。在现代，这被认为是不同网络主机之间通信的基础体系模型。在 OSI 模型中，整个任务被分解为 7 个更小且更易于管理的区块。每一层都被分配了不同的角色——每层都被分配了一个特定的处理任务。此外，每层都配备了足够的独立处理任务的能力。\n\
  \n## OSI 模型特征\nOSI 模型大致分为两层：上层和下层。该模型的上层主要处理与应用程序相关的问题。这些问题在软件中执行。距离用户最近（或最顶部）的层是应用层。终端用户与软件应用程序交互正如应用程序软件本身一样。当某层被称为上层时，它是相对于另一层而言的。上层位于另一层正上面的层。\n\
  \n该模型的下层处理数据传输问题。数据链路和物理层的实现发生在软件和硬件中。在这个模型中，物理层是最低层。它也距离物理介质最近。物理层主要为物理介质提供必要的信息。\n\
  \n# OSI 模型七层模型的角色\n我们将从底层到顶层关注 OSI 参考模型中独特层的功能。\n\n### 物理层\n* **数据传输**：它定义了两个网络设备之间的传输模式——全双工、半双工或单工模式。\n\
  * **链路配置**：它对两个或多个网络设备的物理连接方式提供了清晰定义。\n* **信号**：物理层决定了传输信息的信号性质。\n* **拓扑**：物理层对网络设备的布局提供了全面的定义。\n\
  \n### 数据链路层\n该层负责确保数据帧在网络上的无错误数据传输。它还定义了网络上的数据格式。数据链路层确保网络设备之间存在可靠高效的通信。它负责对网络上的每个设备进行唯一标识。数据链路层由以下两个层组成：\n\
  \n1. **逻辑链路控制层**：它将数据包传输到目的地的网络层。此外，它从数据包头中识别接收方网络层的特定地址。此外，在该层实现了流量控制。\n2. **媒体访问控制层**：这指存在物理层和链路控制层之间的链路。这是在网络上传输数据包的部分。\n\
  \n#### 数据链路层的实际功能\n* **成帧**：数据链路层将物理层的原始比特流转换为称为帧的数据包。它在数据帧上添加了头部和尾部。头部包含了目的地址和源地址。\n\
  * **物理寻址**：物理寻址层在帧上添加头部。该头部包含接收方的地址。帧被中继到头部上指示的接收方处。\n* **数据流控制**：这是数据链路层的主要作用。它保持恒定的数据速率，确保数据在传输过程中不会损坏。\n\
  * **错误控制**：这是通过在放在物理层的尾部添加循环冗余校验（`CRC`）实现的。如果发生任何错误，接收方可以请求重传。\n* **访问控制**：该层决定在特定时刻可用网络设备中哪一个在链路上的优先权。\n\
  \n### 网络层\n这是 7 层 OSI 模型中的第三层。它处理设备寻址并跟踪设备在网络上的位置。根据网络状况，这些层决定了数据传输的最优路径。该层负责路由和转发数据包。用于网络流量路由的协议包括\
  \ `IPv6` 和 `IP`。\n\n#### 网络层功能\n* **寻址**：该层确保目的地址和源地址被添加到帧头部中。寻址有助于识别网络上的设备。\n*\
  \ **互联网络**：网络层为网络设备之间提供了逻辑链路。\n* **分组**：网络层接收来自上层的帧并将其转换为数据包，这一过程在传统上被称为分组。它是通过互联网协议实现的。\n\
  \n### 传输层\n这是模型中的第 4 层。该层确保数据按照发送时的顺序进行排列。它确保不会发生数据重复。该层的核心业务是确保数据完全传输。物理层接收来自上层的数据，并将其进一步细分为称为段的小块。该层为目的地和源提供端到端的通信以确保数据性。它也可以称为端到端层。\n\
  \n* 传输控制协议：这是一种允许系统在互联网上共享消息/信息的标准协议。协议建立并维护主机之间的链路。TCP 将数据划分为称为段的小单元。\n 用户数据报协议（或简称\
  \ `UDP`）：这也是一种传输层协议。与 TCP 相，当接收方收到数据时，源不会接收任何确认。这使得该协议相当不可靠。\n\n\n\n\n\n### 传输层\n\
  \n#### 服务点标识\n服务点标识使得计算机能够同时运行多个应用程序。它还允许数据传输不仅从一台机器到另一台机器，还可以从一个进程传输到另一个进程。传输层在数据包中添加了端口地址或服务点地址。\n\
  \n虽然网络层负责从一台机器到另一台机器的数据传输，但传输层负责确保将数据传输到适当的进程。\n\n#### 分段与重组\n该层接收来自上层的一条消息。然后它将整条消息分成若干个小块。该层为每个分段分配序列号以便进行标识。\n\
  \n在接收端，传输层根据序列号重组分段，以形成原始消息。\n\n#### 连接控制\n传输层提供两种服务：无连接服务和基于连接的服务。\n\n无连接服务将每个分段视为一个独立的数据包。这些数据包通过不同的路由到达目的地。另一方面，基于连接的服务在数据包交付之前会与目标机器的传输层建立连接。在基于连接的服务中，所有数据包都沿单条路由移动。\n\
  \n#### 错误控制\n与数据控制一样，这是在端到端实现的，而不是跨越单一链路。源端的传输层确保消息无误地到达目的地。\n\n#### 流量控制\n该层也确保数据控制。数据控制是端到端完成的，而不是跨越一条专用链路。\n\
  \n---\n\n### 会话层\n该层用于通信网络设备之间交互的建立、维护和同步。\n\n#### 会话层功能\n\n##### 对话控制\n该层充当对话控制器。该层通过启动两个进程之间的对话来实现。或者说，该层授权了一个进程与另一个进程之间的通信。这可以是半双工的，也可以是全双工的。\n\
  \n##### 同步\n会话层在数据传输过程中序列中插入检查点。如果途中发生错误，数据将从特定的检查点进行重传。整个过程被称为同步与恢复。\n\n---\n\n\
  ### 表示层\n该层主要处理在两个网络设备之间传输的信息的语言和格式。它是网络的“翻译器”。表示层是操作系统的一部分。它是操作系统中负责将数据从给定的表示格式转换为另一种表示格式的部分。该层也被称为语法层。\n\
  \n#### 表示层的作用\n\n##### 翻译\n不同系统中的进程以字符数字、字符字符串等多种形式交换信息。不同的计算机器上应用着不同的编码技术。是表示层处理了它们之间的互操作性，而不是编码技术。\n\
  \n该层将数据从基于发送端的格式转换为通用格式，再转换为目标计算机上依赖于接收端的格式。\n\n##### 加密\n表示层执行加密以确保数据的隐私性。\n\n\
  加密是将从发送端传输的信息转换为另一种独特形式，然后通过网络进行传输的过程。\n\n##### 压缩\n表示层在传输前对数据进行压缩。压缩涉及位数的减少。这一过程在视频和音频文件等多媒体的传输中尤为重要。\n\
  \n---\n\n### 应用层\n该层为用户和应用程序访问网络资源提供了接口。它处理资源分配、透明性等许多网络问题。这并不是一个应用程序。它简单地扮演着应用层的角色。它为最终用户提供网络服务。\n\
  \n#### 应用层功能\n\n##### 文件的访问、传输和管理\n该层允许用户远程访问文件、检索文件并仍然能够远程管理它们。\n\n##### 邮件服务\n\
  该层提供电子邮件存储和转发存储设施。\n\n##### 目录服务\n该层提供分布式数据库。这对于提供关于不同对象的重要信息至关重要。\n\n\n\n\n\n#\
  \ 计算机网络组件\n\n这些组件由构成计算机网络的网络硬件和网络软件组成。在本节中，我们通常关注对于计算机网络安装至关重要的主要硬件组件。计算机网络组件包括计算机、电缆、网卡\
  \ (`NIC`)、交换机、调制解调器、集线器和路由器。\n\n## 计算机\n可以是台式电脑、笔记本电脑以及便携设备（智能手机和平板电脑），加上它们的额外配件，如便携式硬盘、CD\
  \ 播放器、键盘和鼠标。它们是任何计算机网络的主要硬件组件。计算机是核心组件，没有计算机网络只是梦想。计算机为用户在网络上执行不同的任务提供了平台。在集中式系统中，计算机充当用户与专用网络服务器之间的桥梁。\n\
  \n## 网络接口卡\n`NIC`（通常如此称为）是一种将同一网络上的一台计算机连接到另一台计算机的硬件组件。`NIC` 支持`10Mbps` 到 `1000Mbps`\
  \ 的网络传输速率。所有网卡都有由 `IEEE` 分配的唯一地址。这些唯一地址被称为`物理/MAC 地址`，用于识别网络上的每台计算机。网卡有两种独特的形式：无线和有线\
  \ `NIC`。\n\n## 集线器\n集线器将网络连接划分为多个设备。集线器通过电缆连接网络上的所有计算机。每台计算机都通过集线器向网络发送请求。当集线器收到来自特定计算机的请求时，它会将该请求广播到网络上的所有网络设备。每个网络设备检查请求以判断其是否属于那里。如果不属于，请求随后会被丢弃。此过程的缺点是消耗更多带宽，且通信受到限制。目前，由于路由器和交换机的流行，集线器几乎已经过时。\n\
  \n## 交换机\n交换机连接计算机网络上的多个设备。这种重要的连接设备在技术上比集线器更先进。交换机具有更新功能可以确定传输数据的目的地。交换机根据每个输入请求的物理地址将消息发送到目标位置。与集线器不同，它不会向网络上的所有设备传输数据。因此，由于计算机直接与交换机通信，数据传输速度有所提高。\n\
  \n## 路由器\n路由器为局域网提供互联网连接。它接收、分析并将传入的数据包转发到另一个计算机网络。它运行在 OSI 参考模型的第三层——简单称为网络层。数据包转发基于路由表中包含的信息。路由器足够智能，可以从所有可用路径中选择或决定数据传输的最合适路径。\n\
  \n## 调制解调器\nModem 是 Modulator/Demodulator（调制解调器）的缩写。它通过电话线将数字数据转换为模拟信号。解调器使计算机能够通过电话线连接互联网。它安装在主板的\
  \ `PCI` 插槽上，而不是主板本身。\n\n## 连接器和电缆\n电缆是用于传输信号的物理介质。用于传输的电缆包括同轴电缆、双绞电缆和光纤。\n\n## 测试网络布线\n\
  测试网络布线的第一步是制作图表来帮助跟踪测试进度。一张显示电线位置的平面图或按房间列出的列表都可以。当每个项目测试正常时，勾选它。图表完成后，找个人帮助你，让那个人站在你所在电缆的远端。在大楼中，使用双向手持对讲机或手机进行通信；这将加快测试项目的进度。测试电缆时，请使用电缆测试仪；如果没有电缆测试仪，请使用电压表。如果你将测试大量的末端插座，请借或购买一个电缆测试仪。当连接良好且电缆中的所有四对线均正常导电时，测试仪两端的指示灯会亮起。有了这种测试仪，检查大量电缆就成了一项简单的工作。如果你选择使用电压表，你需要制作一根跳线，用于理出电缆布线一端的相应线对，以便你可以检查另一端的连通性。用于电缆远端的短路线会将\
  \ `RJ-11`、`RJ-12` 或以太网连接器上的相应线对连接在一起。如果你打算使用这种更原始的方法而不是电缆测试仪，你需要三根短路跳线线；一个四位插头适用于\
  \ `RJ-11` 和 `12`。如果你有 `RJ-25s`，你需要用 `6P6C` 插头对其进行测试；要测试以太网电缆，你需要一个 `8P8C` 插头并对相应的线对短路。然后你还需要制作另一个插头和跳线线，剥掉\
  \ 1/2 英的线皮以连接到欧姆表的探子上。每对线都应该触发连通性检查的报警，或仅读取几欧姆的电阻，这将随距离而异。在 100 米电缆长度内，电阻读数不应超过\
  \ `19.7 ohms`。\n\n### 基本网络故障排除\n网络故障排除是指用于识别、诊断和解决网络问题的措施和技术。该过程是系统性的，主要寻求恢复计算机网络功能的正常。网络管理员负责识别网络问题并进行修复，旨在确保网络运行的顺畅。他们还竭尽一切确保网络运行在最佳水平。以下是许多计算机网络故障排除流程之一：\n\
  \n* 交换机、路由器或任何网络组件的配置和重新配置。\n* 识别任何网络问题并找出解决方法。\n* 安装和维修网络电缆以及 Wi-Fi 设备。\n* 从网络中清除恶意软件。\n\
  * 保持固件设备更新。\n* 根据需要安装和卸载软件。\n\n网络故障排除可以手动进行，也可以作为自动任务——特别是当涉及网络软件应用时。网络诊断软件在识别肉眼难以察觉的网络问题时是一种非常有价值的工具。网络故障排除包括硬件故障排除和软件故障排除。\n\
  \n### 硬件故障排除\n这是处理硬件组件问题的故障排除。它可能包括：\n\n* 移除故障或损坏的 `RAM`、硬盘或 `NIC`。\n* 清洁计算机和其他网络设备的灰尘——灰尘积累会导致设备故障。\n\
  * 加固连接不同网络组件的电缆。\n* 更新或安装重要的驱动程序\n\n硬件故障排除始于发现特定的硬件问题及其原因，最后采取必要的补救措施。\n\n### 软件故障排除\n\
  软件涉及一系列扫描、识别、诊断和解决网络问题的措施。它包括网络操作系统、诊断软件以及安装在单个网络计算机上的软件应用程序的问题。\n\n# 第二章：网络管理\n\
  ![](img/Image00081.jpg)\n有效的网络管理必须处理所有相关问题：\n\n* 硬件\n* 管理和用户支持\n* 软件\n* 数据管理\n\n\
  \n\n\n\n### 硬件管理与维护\n\n硬件维护可以按照以下规程和注意事项进行：\n\n## 清洁\n每两周清洁一次所有网络设备。这将有助于保持设备冷却，并使其他维护任务更容易执行。在清洁时，请清理设备、机架和周围区域的灰尘。应使用小型吸尘器清理键盘、电脑通风口和风扇开口。此外，你还应该使用吸尘器轻轻吸出可移动介质驱动器中的灰尘。在易产生尘的环境中，未使用的墙壁插座和空设备接口也可以偶尔进行吸尘。对于打印机和绘图仪，请按照说明书指示清洁喷墨式打印机的打印头，并吸除激光打印机中的纸屑。显示器可以使用眼镜清洁液和眼镜擦布擦拭。\n\
  \n## 执行检查\n密切关注所有硬件的状况至关重要。因此，你应该至少每月检查一次所有硬件。此检查应包括以下内容：\n\n*   确保通风口没有被阻塞或积灰过多。\n\
  *   听听并触摸通风口，以确保冷却风扇正在运行。\n*   闻闻该区域。当电源和其他部件接近故障时，它们可能会因过热而发出异味。焦味意味着故障迫即发生或已经发生。\n\
  *   检查所有电源线、外设电缆和网络线在插座中是否插紧。\n*   检查所有电源线、外设电缆和网络线是否有磨损或其他损坏。\n*   检查服务器区域的加热、通风和冷却系统运行正常，以确保它们是可用的——即使在检查时不需要这些系统。\n\
  \n## 升级固件\n“固件”指的是储存在在芯片中的任何程序。例如，计算机的 `BIOS` 就属于固件。有时，制造商会发布固件更新以修复缺陷，或使设备能够与某些新发布的硬件设备或操作系统升级兼容。你应该至少每季度检查一次所有网络设备的制造商网站或帮助热台，以确定你的设备是否有任何可用的固件升级。如果有，请务必严格按照制造商的说明来加载新固件和固件更新。固件加载通常需要从\
  \ `DOS` 或维护磁盘中进行低级启动，尽管某些固件可以与计算机的操作系统兼容。\n\n## 升级硬件\n有两个因素驱动着硬件升级：\n\n*   由于应用程序更改或增加新应用程序导致的性能问题，可能需要硬件升级，或者添加与硬件能力或容量相关的新功能。例如，增加内存和安装额外的硬盘以获得更多文件空间，是支持这些更改时执行的典型升级。\n\
  *   你可能选择在纯可选的基础上升级硬件——例如，增加一个更大的显示器、更高质量的声卡、电视采集卡或类似设备。\n\n## 维修硬件\n作为负责网络的人员，你必须在硬件组件停止工作之前评估你执行硬件维修的意愿和能力。为此，你应该检查你的整个硬件清单并确定以下情况：\n\
  \n*   设备是否仍在保修期内？如果是，在设备停止工作时利用该保修。\n*   考虑到技术劳动力的高成本，维修低成本物品（例如可以花 50 美元更换的打印机）可能并不划算。如果你购买低于\
  \ 600 美元的电脑已使用超过 10 个月，那么更换它们可能比维修更好。不要误会我：我并不是在主张缩短设备生命周期或不必要地增加垃圾堆。\n*   对于大件物品，你可能希望通过安排服务和支持合同将维修风险转移给他人——前提是你的预算能够支持这一点。\n\
  \n# 管理\n\n大型网络通常有一名或多名员工专门负责网络管理任务。对于较小的网络，经理必须身兼多职并履行多个职责来支持网络。随着时间的推移，他或她必须成长到熟练水平——或至少成为经验丰富的学徒——才能获得成功。主要的或日常的网络管理任务属于以下类别之一：\n\
  \n*   管理和支持终端用户\n*   添加工作站和外围设备\n*   维护系统级文档\n\n## 维护系统级文档\n维护系统级文档看起来像是一个你可以跳过的任务，但你不应该这样做。如果没有完整的文档，当出现问题，或者当你尝试向服务器添加硬件、或向网络主机或工作站添加应用程序时，会浪费大量的人力。遗憾的是，对于某些技术人员和网络经理来说，在进行系统更改之前检查文档并不是他们应该重视的首要任务。良好的文档习惯并不是负担，因为它们需要时间；它们对于没有时间浪费的网络经理来说是一种收益。网络文档应该包括所有的操作和维护手册以及所有硬件的说明书。\n\
  \n## 管理和支持终端用户\n作为网络管理员，你可能负责管理和支持终端用户。你可能需要执行的任务示例可能包括：\n\n*   出于安全目的审核新用户\n* \
  \  添加、删除和更改终端用户账户\n*   创建和管理组、基于角色的个人访问控制\n*   提供技术支持\n*   添加工作站和外围设备\n\n## 添加工作站和外围设备\n\
  你可能需要完成某些基于软件的管理任务，以便向网络添加工作站和外围设备。例如在工作站或打印机上硬编码 `IP` 地址，或将新打印机连接到打印服务器队列。此外，可能需要为用户分配访问设备（如打印机）的权限，以及网络工作站的访问密码。更多信息请咨询新设备的文档以及你对之前更改所需步骤的记录。\n\
  \n\n\n\n\n* 云计算运行在分布式计算环境中。这使得资源共享能够快速发生。\n* 由于许多服务器的存在，云计算最大限度地减少了基础设施故障的机会。这使其成为\
  \ IT 运营中更具可靠性的基础设施。\n* 云计算允许大规模、按需提供 IT 资源，而无需工程师和其他许多本可以很有帮助的专业人员。\n* 云计算允许多个用户通过共享相同的基础设施来共享资源并更高效地工作。\n\
  * 云计算消除了物理位置或距离的顾虑，因为用户无论地理位置如何都可以访问系统和资源。\n* 维护云计算应用程序更加容易，因为它们不需要安装在每个用户的计算机上。\n\
  * 云计算降低了组织的运营成本，因为它消除了组织建立自身基础设施的需求——这对于大多数组织来说是一项非常昂贵的任务。此外，它允许组织仅在需要时为服务或资源付费。\n\
  * 云计算允许不同的服务按需付费模式。这是一种方便的使用方式，特别是当用户只需要使用一次资源时。\n\n## 云计算的优势\n以下是云计算的主要优势：\n\n\
  * 人们可以方便地使用廉价的计算机执行复杂的计算机任务，而这些任务通常需要强大的机器——这些机器在市场上价格高昂。应用程序运行在云端，而不是用户的机器上。\n\
  * 低成本的 IT 基础设施可以充分满足组织的需求。由于不需要投资高成本的 IT 基础设施来处理大型服务器。\n* 由于硬件和软件方面基础设施需求的减少，维护成本更低。\n\
  * 为 Web 端应用程序提供即时软件更新——无需担心过时的应用程序和高昂的升级成本。\n* 云服务器的执行能力非常高。这增加了计算能力，并由于数据处理和消息传递的高速，导致了任务的高效执行。\n\
  * 云为用户提供了极大的存储容量——成本非常低。\n\n## 云计算的缺点\n以下列出了云计算的一些最显著的局限性：\n* 没有网络连接，你就无法访问云上的资源。用户必须连接到互联网才能访问云上提供的资源（或使用\
  \ IT 基础设施）。\n* 在尝试在云上执行重要任务时，低网络连接可能会让人感到非常沮丧。大多数 Web 端应用程序在大量带宽上有效运行。低带宽有时可能会限制某些任务的执行。\n\
  * 存储在云上的数据安全性和机密性无法保证。未经授权的用户可以访问您存储在云上的数据/信息。\n\n## 什么是虚拟化？\n虚拟化创建某些实际事物的虚拟版本的过程。在计算中，这可能涉及操作系统、网络资源、服务器、存储设备甚至桌面的虚拟化。从技术上讲，我们可以将虚拟化称为一种允许多个用户或组共享一个物理资源或应用程序的实例的技术。该技术涉及为给定的资源或应用程序的物理存储分配逻辑名称，并根据需要提供指向特定资源或应用程序的指针。\n\
  \n### 虚拟化背后的概念\n在现有硬件和操作系统之上创建虚拟机的过程被称为`Hardware virtualization`（硬件虚拟化）。`硬件虚拟化`\
  \ 创建了一个在逻辑上隔离的环境。发生虚拟机创建的机器被称为`host machine`。另一方面，创建的虚拟机在技术上被称为`guest machine`。\n\
  \n### 虚拟化的类型\n以下是不同的虚拟化类型：\n* `服务器虚拟化`\n* `存储虚拟化`\n* `操作系统虚拟化`\n* `硬件虚拟化`\n\n####\
  \ 服务器虚拟化\n当虚拟机管理器（`VMM`）——虚拟机软件——直接安装在服务器上时，该过程被称为`server 虚拟化`。\n为什么需要服务器虚拟化？`服务器虚拟化`是至关重要的，因为可以根据需求将一个物理服务器细分为多个服务器，并进行负载均衡。\n\
  \n#### 存储虚拟化\n这是一个涉及将网络中的多个存储设备分组，使其像单一存储设备的过程。软件应用程序也用于实现`存储虚拟化`。为什么需要存储虚拟化？这对于恢复和备份至关重要。\n\
  \n#### 操作系统虚拟化\n在这种情况下，虚拟机软件（`VMM`）直接安装在`宿机`的操作系统上。与`硬件虚拟化`不同，`VMM`没有安装在硬件上。\n为什么需要操作系统虚拟化？当需要在不同的操作系统平台上测试应用程序时，`操作系统虚拟化`非常有帮助。\n\
  \n#### 硬件虚拟化\n在`硬件虚拟化`中，虚拟机软件直接安装在硬件系统上。`Hypervisor`负责控制和监控内存、处理器和硬件资源。我们可以在系统上安装不同的操作系统，并使用它运行许多其他应用程序。\n\
  为什么需要硬件虚拟化？`硬件虚拟化`对于服务器平台非常重要，因为控制虚拟机并不像控制物理服务器那样困难。\n\n## 虚拟化在云计算中如何工作\n虚拟化是云计算中非常强大的概念。通常，在云计算中，用户需要共享云中的可用资源。例如，应用程序和文件就是一些可以共享的资源。通过虚拟化，用户获得了一个让此类资源共享成为现实的平台。虚拟化的主要目标是为云用户提供标准版本的应用程序。当新版本的应用程序发布时，用户向软件开发者寻求新版本。这是可能的，但如果所有用户都从中央服务器下载新版本，可能会变成一件非常忙乱。为了解决这个问题，虚拟化的服务器和软件可以由第三方付费维护，但云用户可以高效地访问新的软件发布版本。总之，虚拟化主要意味着在一台机器上运行多个操作系统并共享所有硬件资源。这种技术非常有帮助，因为它使得汇聚网络资源并以较低成本方便地共享给不同的用户成为可能。\n\
  \n\n\n\n\n# 第三章：计算机网络通信技术\n\n## 计算机在网络中如何通信\n网络中不同计算机之间的通信发生在数据从一台机器传输到另一台机器的过程中。发送数据的计算机被称为发送端（源点）。接收数据的机器被称为接收端（目的）。为了进行通信，数据以数据包的形式进行传输。为了让数据到达目标地，数据包被分配了源地址和目的地址。源地址识别发送者，而目的地址则识别接收端（目的）。\n\
  \n数据从一台机器传输到另一台机器有多种方式。值得注意的是，数据传输发生的方式不止一种。从一台计算机传输到另一台计算机的方式被称为数据传输模式。传输模式也称为通信模式。不同的数据传输模式包括：\n\
  \n*   `单工模式 (Simplex mode)`：通信沿一个方向进行。也就是说，通信是单向的。设备只能接收数据而不能发送，反之亦然。\n*   `半双工模式\
  \ (Half-duplex mode)`：通信是双向的。也就是说，设备可以发送和接收数据，但不能同时发送和接收。\n*   `全双工模式 (Full-duplex\
  \ mode)`：通信是双向的。与半双工模式不同，通信设备可以同时传输和接收数据。\n\n## 定址\n消息需要源于一个已知发送者，并明确发送给一个已知接收者。例如，传统的邮局要求发送者通过姓名和位置标识自己。发送者还必须指示接收者的姓名和精确位置（地址）。同样，网络中的计算机通过其\
  \ `MAC addresses` 和 `IP addresses` 进行标识。`MAC addresses` 嵌入在计算机的 `NICs` 中，而 `IP addresses`\
  \ 在配置过程中手动分配；或者通过在每台机器上启用动态主机配置协议 (`DHCP`) 动态分配 `IP addresses`。每一个网络主机都有唯一的 `MAC\
  \ address` 和唯一的 `IP address`，用于识别该机器。\n\n### 以太网\n以太网网络架构是全球所有网络架构中最广泛的架构。我们将研究这种架构的深层结构，并很可能发现为什么这种架构如此受欢迎。大多数网络外围组件都内置了\
  \ `NIC`。因此，它们可以轻松地插入以太网墙插座。必须注意的是，从集线器或交换机开始，标准预定义的以太网线长度为 `100m`，即使对于配备 `NIC` 的打印服务器和打印机也是如此；正如工作站的情况一样。没有内置\
  \ `NIC` 的打印机可以通过并行端口、串行端口或 USB 端口或板载 `NIC` 与网络打印服务器连接，从而在网络上使用。\n\n### 网络接入策略\n\
  简单来说，以太网是一种采用“等待并监听”方法的被动网络架构。它也被称为基于竞争的架构，因为网络上的所有计算机都必须竞争给定网络介质的传输时间。访问以太网通过 `CSMA/CD`\
  \ 实现。这简单来说意味着网络主机必须监听网络，直到传输介质空闲，以便它们也可以进行传输。基本上，它们必须“感知”并确定线路确实空闲，以启动它们自己的数据传输过程。网络主机只有在“感觉到”传输已空闲时，才会发送其数据。如果发生多次传输，传输介质上就会发生冲突。机器感知到冲突并立即停止传输过程。其中一台机器开始重传，而其他机器则等待线路空闲后才能重传数据。这个过程一直持续到网络中所有设备完成传输。同样，主机在线路上等待并监听发送给自己的数据。当特定主机感知到传入的数据是发给自己的时，它们会打开接收门，并将数据实际接收到其\
  \ `NIC` 接口上。\n\n以太网的特点是频繁发生冲突。因此，某些设备在冲突发生时会有冲突提示你。事实上，冲突是以太网架构的主要限制。另一方面，以太网是所有网络架构中最廉价的。\n\
  \n**注意：**\n*   冲突会减慢网络。\n*   过多的冲突可能会导致网络完全崩溃。\n\n## 快速以太网\n传统的以太网速度为 `10Mbps`。快速以太网提供了比原始\
  \ `10Mbps` 更快。它具有 `100Mbps` 的传输率。其吞吐量高于传统的以太网标准，因为在网络介质上传输数据的时间缩短了整 10 倍。因此，快速以太网的工作速率是传统\
  \ `10Mbps` 速度的 10 倍。传统上，集线器和其他连接设备的设计是为了适应 `10 Mbps` 的传输率。对于此类设备，不支持快速以太网。幸运的是，许多连接设备配备了\
  \ `NICs`，可以从容处理两种 `10Mbps` 和 `100Mbps` 传输率。这意味着设备可以同时兼容原始的 `10Mbps` 以太网和快速以太网。\n\
  \n## 千兆以太网\n这是以太网的另一个版本，比快速以太网更快。它与其他 10Mbps 和快速以太网一样使用相同的数据格式和 `IEEE Ethernet`\
  \ 规范。通过千兆以太网，用户可以在网络上享受 `1000Mbps` 的传输。与在双对线缆和光纤上运行的快速以太网不同，千兆以太网最初局限于光纤布线。这需要使用专用服务器和高速交换机建立\
  \ `LAN`。千兆以太网被认为是需要高传输速度的大型 `LAN` 的骨干。目前，任何人都可以享受千兆以太网惊人的高速，因为它被封装在网卡中，可以方便地安装在网络服务器和网络客户端。\n\
  \n### 以太网 IEEE 线缆规范\n以下是显示某些以太网规范的列表：\n*   `802.3` 用于以太网 LAN\n*   `802.5` 用于令牌环网\
  \ LAN\n*   `802.7` 用于宽带 TAG\n*   `802.8` 用于光纤 TAG\n*   `802.9` 用于数据网络和集成语音\n*  \
  \ `802.10` 用于网络安全\n*   `802.11` 用于无线网络\n\n**注意：** TAG 代表技术咨询小组（Technical Advisory\
  \ Group）。必须考虑以下几点：\n*   以太网由 `IEEE` 的 `802.3` 规范严格定义。\n*   它工作在 `OSI` 模式的数据链路层。\n\
  *   根据给定计算机网络偏好的布线性质，有多种不同的 `IEEE` 类型以太网可用。\n\n\n\n\n\n这些类型的以太网（Gigabit Ethernet）和快速以太网（Fast\
  \ Ethernet）通过三部分名称命名，例如 `10BASE-T`。名称的第一部分描述传输速度。例如，`10` 指定 `10Mbps` 以太网。名称的第二部分对于所有形式的以太网都是“base”，表示以太网信号是基带的（baseband）。这意味着数据以单个信号流的形式传输。这种数据传输类型无法像宽带（broadband）那样传输多个通道的数据或信息。以太网类型的名称最后部分指定所使用的电缆类型。例如，在\
  \ `10BASE-T` 中，`T` 表示双线缆，且假设是非屏蔽双线缆。\n\n### 以太网类型\n\n#### 10BASE-T\n这种以太网使用双线缆（非屏蔽双线）。最大电缆长度（不进行信号放大的情况下）为\
  \ `100m`。`10BASE-T` 可以在星型拓扑上运行。\n\n#### 10BASE-2\n这种以太网使用相当灵活的同轴电（`RG-58A/U` 或 `thinnet`），最大电缆长度为\
  \ `185m`（四舍五入为 `200`，因此 `10BASE-2` 中的 `2`）。通过使用 `T-connectors` 将布线连接到网络主机的网卡，`10BASE-2`\
  \ 使用总线拓扑。尽管 `10BASE-2` 一直是以太网实现中最经济的选择，但目前 `10BASE-T` 设置最为广泛。\n\n#### 10BASE-5\n\
  这种以太网使用大线径同轴电缆（也称为 `thicknet`），网络上的主机连接到一条主干线路上。来自网络主机的电缆通过“吸血接头”（`vampire tabs`）穿过主干电缆连接。\n\
  \n#### 100BASE-TX\n这种快速以太网依赖于与 `10BASE-T` 以太网相同的 `Category 5 UTP` 布线。这种实现也可以采用 `100-Ohm`\
  \ 屏蔽双线缆。在没有中继器的情况下，最大电缆长度为 `100` 米。\n\n#### 100BASE-T4\n这种快速以太网运行在 `Category 5`\
  \ 布线上，与 `100BASE-TX` 一样。然而，它也可以运行在较低等级的双线缆，如 `Categories 3` 和 `4`。在这种类型的以太网中，最大电缆运行长度为标准的\
  \ `100m`。\n\n#### 100BASE-FX\n这种快速以太网跨越光纤电缆，最大长度为 `412m`。\n\n#### 1000Base-T\n这种千兆以太网通过\
  \ `Category 5` 双线缆提供 `1000Mbps` 的速率。\n\n#### 10Gigabit Ethernet\n这种以太网通过光纤提供每秒 100\
  \ 亿位的传输速率。\n\n#### 点对通信\n\n点对网络设置为需要基本网络功能的情况提供了一种简单且廉价的网络解决方案。点对网络对于文件共享和打印机等其他基本资源是非常理想的。在这种网络安排中，不需要专用服务器。从预算中消除服务器使得这种网络成为一项经济划算的投资。必须理解的是，网络服务器非常昂贵。它是小型网络的理想选择。\n\
  \n#### 点对网络的特征\n以下是点对网络的主要特征：\n- 所有网络计算机都具有平等的权限。它们表现得像对等节点一样。\n- 每个网络主机同时充当客户端和服务器。本质上，网络可以向另一个网络主机发送请求。同样，每个主机都可以接收来自网络上任何其他主机的请求。\n\
  - 资源没有进行集中管理。这是由于省略了专用服务器。这为将点对网络称为工作组也提供了具体基础。对等节点自由协作，不受任何集中控制或监管。\n- 你只需要在每个对等节点上安装操作系统，然后通过\
  \ `NICs` 物理连接这些对等节点（在使用 Macintosh 计算机时甚至不需要 `NICs`）。\n\n#### 点对通信的优点\n以下是点对网络实现的主要优点：\n\
  - 点对网络实现易安装，因为它们只涉及在对等计算机上安装操作系统并对其进行物理连接。\n- 它们更便宜，因为不需要昂贵的服务器计算机。此外，不需要网络操作系统（`NOS`）。\n\
  - 所有所需资源都是现成的，其中大部分包含在操作系统中。\n- 网络实现是可靠的，因为单个对等节点的故障或故障不会导致另一个节点或整个网络的故障。\n\n####\
  \ 点对通信的缺点\n以下是点对网络的主要局限性：\n- 如果多个用户访问连接到你计算机的打印机，当打印机为你的对等节点服务时，你计算机的处理资源会被占用。\n\
  - 数据备份面临挑战，因为没有共享文件的集中位置。\n- 资源管理很困难，因为必须逐个管理资源。\n- 管理资源非常困难，因为资源分散在整个网络中。\n- 网络安全可能很容易受到。此外，用户可能需要跟踪多个网络访问凭据（用户名和密码）。\n\
  \n\n\n\n\n# 第 4 章：互联网 ![](img/Image00083.jpg)\n\n### 互联网基础\n本节涵盖了使互联网运行的基本技术概念，并讨论了连接信息超级公公路的各种方案，以便你网络中的每个人都能上网、通过电子邮件通信、与他人分享数字图片、利用无数在线资源进行研究、在线购物、下载电影和音乐、视频会议等。\n\
  \n## 互联网术语\n正如你开车并不一定需要了解内燃机的工作原理一样，你也不必须理解互联网运行的每一个方面才能利用它所提供的所有功能。尽管如此，即使只是简要检查一下与互联网相关的各种术语和概念也无无处。\n\
  \n### TCP/IP\n`TCP/IP`——`Transmission Control Protocol/Internet Protocol`（传输控制协议/网络协议）——是一组被称为协议的规则，定义了设备（无论是相同还是不同的，例如计算机、路由器和调制解器）如何相互连接和通信。（在此语境下，“协议”描述了任何两个通信设备如何交互并协作，将数字数据从一个设备移动到另一个设备的技术细节。）\n\
  \n`TCP/IP` 通过确定数据传输的最可用传输路径来工作。然而，该协议并不是将所有数据作为一个大块发送，而是将数据拆分成小数据包。这些数据包可以通过许多不同的路径到达目的地；当它们到达时，会按顺序重新组合。为了确保数据包到达正确的目的地，每个数据包都包含目标地址和源地址。这些信息存储在每个包的“信封”或“头部”中。协议的\
  \ `TCP` 部分控制发送端的数据拆分和接收端的重组，而 `IP` 则处理数据包的路由。可以这样想：通过 `TCP/IP` 发送数据就像通过美国邮政服务寄信。你通过邮寄寄出的每封信都包含发件人地址（即源地址）和收件人地址（即目标地址）。区别在于，对于普通邮件，你将整封信放在一个包裹或信封（包）中。如果你在互联网上发送同一封信，它将会被分成成百甚至上千个数据包（信封）才能到达目的地，然后进行电子重组。在\
  \ `TCP/IP` 框架下使用的互联网协议包括 `UDP`、`PPP`、`SLIP`、`VoIP` 和 `FTP`。\n\n### 子网掩码\n子网掩码是应用于主机配置文件中的一个数字，允许将\
  \ `IP` 类 C 网络划分为可单独路由的网络。对于 `ISP` 较大网络上的家庭网络，子网掩码最通常是 255.255.255.0，因为家庭网络通常不会通过内部路由器划分成物理隔离的网段。在办公楼和环境中，子网用于将流量分离到物理隔离的网络中，以保持数据流量处于低水平，并增强访问外围设备和本地服务器的性能。发往另一个子网或\
  \ `WAN` 的数据流量必须通过路由器。\n\n### DNS\n正如记住别人的名字比记住她的电话号码更容易，同样，通过域名而不是其 `IP` 地址来记住网站的位置也更容易。例如，假设你经常访问福特汽车公司的网站。很可能，你只会记住该网站的域名——即\
  \ `Ford.com`——而不是记住它的 `IP` 地址。然而，你计算机的网页浏览器工作方式完全相反。它需要知道 `Ford.com` 的 `IP` 地址才能连接到该网站。这就是域名系统发挥作用的地方。当你输入想要访问的网站域名（`Ford.com`）时，你的网页浏览器会在本地或互联网上与\
  \ `DNS` 服务器建立会，以定位与该域名关联的 `IP` 地址。`DNS` 服务器使用注册域名的域名关联对 `IP` 地址进行分级查找，以定位你想访问的网站的\
  \ `IP` 地址。如果你的计算机连接的 `DNS` 服务器无法确定与你输入的域名关联的 `IP` 地址，则 `DNS` 服务器将在逐级更高的 DNS 服务器上查找该数字，直到找到条目（或报错）。一旦找到\
  \ `IP` 地址，你的计算机就可以定位并与托管 `Ford.com` 网站的计算机通信。第一个 `DNS` 服务器会将关联存储在内存中一段时间，以防你或为你服务的其他人需要再次访问该网站。`DNS`\
  \ 服务器仅存储频繁使用的关联，因为它可以在高级别的 `DNS` 服务器上查找它不认识条目。\n\n## 评估互联网服务计划\n建立家庭访问互联网需要两点：你网络中至少有一台具备互联网功能的计算机，以及从互联网服务提供商（`ISP`）处购买互联网服务计划。可用方案取决于地理（郊区和农村地区的选择比城市地区少）、你想使用的通信介质以及你的\
  \ `ISP` 提供的选项。一些关键计划特征包括：\n\n* 价格\n* 互联网速度\n* `ISP` 提供的设备\n* 客户支持\n* 提供的 `IP` 地址性质——静态或动态\n\
  * 使用的传输介质\n* 电子邮件地址\n* 网页托管\n* 免费 Wi-Fi 访问\n\n## 连接\n要将计算机连接到互联网，你必须从所在地区的服务计划选项中选择。一旦你评估了所在地区的连接计划和介质选项并选择了\
  \ `ISP`，请查看下面的某些考虑因素作为如何设置互联网访问的指南。\n\n### 使用拨号连接\n从速度角度来看，拨号大部分已经过时，但在某些农村地区，它是唯一的廉价互联网连接选项。当使用普通电话业务（`POTS`）线路通过拨号连接计算机时，有三种常见情况：\n\
  \n* 连接带有内置调制解器的计算机或笔记本电脑\n* 使用通过 `USB` 端口的外部拨号调制解器\n* 使用连接到 9 针串口的调制解器。\n\n\n\n\n\
  \n# 通过电缆连接\n在许多地区，电缆是一种流行的互联网连接选择。事实上，你的家庭或小型办公室可能已经有了电视服务的电缆连接，这使得增加电缆调制解调器非常简单。电缆互联网是高速的——远优于拨号上网。此外，许多电缆套餐还整合了更多的电视频道和网络电话服务。\n\
  \n# 通过无线连接 (Wi-Fi)\n无线连接互联网非常简单，但你的网络必须包含一个为无线连接设计的网关或路由器。此外，网络上的任何计算机都必须内置 `Wi-Fi`\
  \ 功能，或者对于笔记本电脑而言，需要有一个用于无线 `Wi-Fi` 卡的插槽。如果你的计算机或工作站没有配置 `Wi-Fi`，请不要担心。有许多制造商正在制造支持无线连接的设备——本质上，这些设备是便携式无线网卡，可以插入\
  \ `Ethernet` 端口或 `USB` 端口。\n\n# 通过 DSL 连接\n使用 `DSL` 通过标准电话线连接互联网的优势在于访问互联网的速度比拨号上网更快（假设你住在提供\
  \ `DSL` 服务的地区）。此外，拨号连接依赖于电话线的音频/模拟频段，而 `DSL` 互联网连接上的数据以更高的频率通过线对传输，这意味着用户在使用互联网的同时仍然可以使用电话线（并此保持你的互联网连接\
  \ 24/7 全天）。\n\n# 网络地址转换\n网络地址转换 (`NAT`) 是互联网连接设备和网关上的一个重要功能，它允许计算机拥有一个在互联网上不可见的\
  \ `IP addresses`，但仍然可以在互联网上接收和发送数据包。这些地址是被隐藏的，并且分配的是一组与互联网上可见或暴露的地址不同的 IP 地址集——称为\
  \ `private IP addresses`（私有 IP 地址）。\n\n这些私有地址被分配给防火墙内部的计算机，使其能够使用 `TCP/IP` 协议与内部设备以及互联网上的主机进行通信而不被发现，从而增加了黑入内部计算机的难度。使用\
  \ `NAT` 是防火墙保护你的网络计算机免受互联网任何地方不受欢迎者入侵的第一层防御。\n\n`Private IP addresses` 还将互联网的连接性扩展到比可用\
  \ IP 地址数量更多的计算机，因为同一个私有内部网络 IP 地址可以在成百、数千甚至数百万个位置使用。其工作原理如下：当你打开浏览器访问例如 `Yahoo.com`\
  \ 时，数据包到达你的互联网网关/防火墙，网关启动一个会话来跟踪你的 `MAC address` 和 `IP address`。然后它将数据包中的你的私有 `IP\
  \ address` 替换为自己的可见 IP 地址，并将请求发送到 `Yahoo.com`。当 `Yahoo` 为你的会话返回信息时，过程反过来；互联网网关/防火墙剥离掉自己的\
  \ `IP address`，将你计算机的私有 `IP address` 和 `MAC address` 重新插入数据包头，并将数据包通过网络线传到你的计算机。当这种情况发生时，你的内部\
  \ `IP address` 被认为经过了“网络地址转换”——尽管一个更好的术语可能是“网络地址替换”。默认情况下，大多数家庭网络网关使用 `NAT` 并为家庭网络上的所有计算机分配\
  \ `private IP addresses`。\n\n# 私有网络\n私有网络是 `IP networks`，其主机计算机隐藏在提供 `NAT` 的设备之后。这些网络上的计算机分配的\
  \ IP 地址位于互联网上使用的数字池之外。本质上，私有地址范围内的任何数字都可以本地分配给计算机或主机。`Private network IP addresses`\
  \ 以以下任何数字开头：\n\n* `10`\n* `172.16–172.31`\n* `192.168`\n\n\n\n\n\n完整的示例可以是 `192.168.11.4`\
  \ 或 `10.101.101.1`。\n\n# 全球网：通往世界的窗口\n\nWeb 像一个有机体，随着网络的增加或改变而不断变化。互联网在地理范围和受众方面的增长，为每个连接的实体提供了历史上前所未有的通信机会。如果你对\
  \ Web 的使用仅限于简单的下载信息和接收电子邮件，那么你几乎还没有触及 Web 能够实现功能的冰角。利用 Web 与全球观众进行信息传递、教育以及思想、商品和服务的交换方式，仅取决于个人的想象力和创造力。本章仅仅简要介绍了你可以在\
  \ Web 上做的事情的一点皮毛。\n\n## 利用你与 Web 的连接\n将你的网络（或你网络的子网络）连接到互联网，可以将你的家庭或办公室网络范围延伸到地球的各个角落。在全国大多数市场，每月花费不到\
  \ 120 美元，你就可以获得一个运行速度尚可并包含最多五个静态 IP 地址的互联网连接。这些地址可以显著增强你从互联网连接中获取最大收益的能力。这是因为，为了让\
  \ Web 服务器、Web 摄像头和其他资源在 Web 上可用，你至少需要一个在网上可见的静态 IP 地址。此外，静态 IP 地址可用于让 VPN 客户端连接到你的网络资源。没有静态\
  \ IP 地址，你与外界的大部分通信将受到限制。然而有了静态 IP 地址，你的网络可以变成网站、客户端服务提供商、广播电站、电视站或博客——这只是举例之一。\n\
  \nWeb 确实是观察世界的窗口。你不仅可以向外看，从 Web 获取海量数据，世界上任何地方的人也可以向内看，让你能够与全球观众分享你选择的信息。将你自己的资源添加到\
  \ Web——这个终极的无限制双向自由言论论坛——既可以为你和你的组织提供价值，也可以增加其他人使用 Web 的便利。\n\n## Web 的常见用途\n以下是\
  \ Web 的主要用途：\n\n### 查找或发布信息\n大多数人使用互联网来获取信息，这就是为什么有些人称其为世界上最大的图书馆。在线获取信息的最佳方式是在\
  \ Yahoo、Google 和 Ask 等搜索引擎中输入关键词或短语。当你这些这些任一网站的搜索字段中输入关键词或短语时，它会返回许多与你输入的词或短语相关的\
  \ Web 页面链接。\n\n问问你自己或你公司的管理层：关于你、你的家庭或公司的信息应该发布在 Web 服务器上？在互联网上让你的信息被找到或让你的声音被听到，不仅仅是获取一个如\
  \ `thisismywebsite.com` 这样的域名。为了确保在执行相关搜索时能找到你网站上的信息，你需要在文档标题中输入关键关键词，并可能需要付费在各种搜索引擎中注册你的网站。学习关键关键词并相应地调整你的文档标题和标签本身是一门科学。即使你精了它，你的业务网站某天可能出现在搜索结果的最顶部，第二天就会掉到第\
  \ 100 名或第 1000 名。像西部荒一样，互联网上几乎没有规则，在获得关注方面，一切皆有可能。\n\n### 学习\n学习关键关键词并相应地调整你的文档标题和标签本身是一门科学。即使你精了它，你的业务网站某天可能出现在搜索结果的最顶部，第二天就会掉到第\
  \ 100 名或第 1000 名。\n\n### 通信\n像西部荒一样，互联网上几乎没有规则，在获得关注方面，一切皆有可能。通信通过以下方式进行：\n\n####\
  \ 电子邮件\n最流行的通信工具是电子邮件。消息以电子形式从发送者发送给接收者。你可以从互联网服务提供商 (`ISP`) 获取电子邮件帐户。或者，你也可以通过桌面上的\
  \ `e-mail` 客户端或在某些情况下通过 Web 浏览器访问消息。有几种电子邮件服务，如下：\n* `http://mail.yahoo.com`\n*\
  \ `http://www.gmail.com`\n\n#### 即时消息 (IM)\n通过互联网通信的另一种方式是通过即时消息 (`IM`)。`IM` 提供即时通信；没有中间人存储或转发消息。双方用户都必须在线才能\
  \ `IM`；当他们在线时，他们输入的文本会立即从一个人传输到另一个人。你可以使用 `IM` 客户端 `IM`。流行的即时消息应用包括：\n* `Yahoo!\
  \ Messenger`\n* `Window Live Messenger`\n\n#### 视频会议\n视频会议为用户提供了进行虚拟会议的稀有机会，从而节省旅行费用。要在网上进行\
  \ `video conference`，至少应有一个参与者拥有在网上可见的静态 IP 地址。此外，每位参与者应具有上传速度至少为 `400Kbps` 的服务以保持质量。要\
  \ `video conference`，你必须拥有某种 `Web cam`。\n\n#### 博客\n博客是 `Weblogs` 的缩写，是人们可以在上面与其他感兴趣或志同道合的人分享信息的网站。将博客想象成一本供世界各地阅读的数字日记。\n\
  \n### 娱乐与媒体\n互联网拥有丰富的娱乐选择，包括：\n* 互动式游戏\n* 音乐\n* 视频\n* 新闻\n* 互联网广播\n* 互联网电视\n\n###\
  \ 商业\n商业代表了互联网最常用的用途之一。业务相关的活动包括（但不限于）以下内容：\n* 银行\n* 广告\n* 零售销售和营销\n* 拍卖\n\n###\
  \ 下载软件\n许多主要的软件发行商——包括 `Microsoft`、`Corel` 和 `Sun`——为用户提供下载原本盒装的商业现软件 (`COTS`)的能力。你只需要良好的互联网连接以及\
  \ `PayPal` 账户、信用卡，或者在某些情况下使用支票簿支付费用。网上还有各种试用软件、免费软件、共享软件以及开源软件可供下载。\n\n### 监控\n\
  设置可以在 Web 上查看的监控摄像头几乎是即插即用的操作，只要你有支持摄像头或 `Web servers` 的必要 IP 地址即可。这项技术允许例如，在你不在时监控你的家庭或办公室，或者当你在家里时检查你的避暑别墅。企业主可以在工作场所设置摄像头，以监控办公室的事件或在离开时跟踪情况。\n\
  \n\n\n\n# 第 5 章：路由器与服务器基础\n\n路由器和服务器是非常重要的网络设备。本节旨在概述路由的一些基本概念以及客户端/服务器架构。我们还将检查\
  \ VLAN 以及如何配置它。\n\n## 路由器：它是什么，它能做什么？\n\n路由器是另一种网络设备，主要用于连接不同的网络。路由的作用根据数据包报头中包含的信息来转发数据包。该设备运行在\
  \ OSI 模型的网络层。在 `TCP/IP` 模型中，路由器运行在网络层。路由指的是确定从源地到目的地进行数据传输的最优路径的过程。路由是由上文定义的路由器完成的。路由算法负责实现路由过程。路由算法是指在后台运行的一种种软件，用于确保为从发送者到接收者的数据传输选择最合适的路径。路由算法还负责路由表的初始化。它们还负责路由表的维护。路由协议使用路由指标（Routing\
  \ metrics）来确定数据传输的最优路径。路由指标包括跳数、延迟、带宽和当前负载等。\n\n## 路由指标与开\n\n指标（Metrics）和开销（Costs）在确定最佳路径时起着关键作用。指标是指在确定最佳路径时考虑的网络变量。路由指标包括以下内容：\n\
  \n- **延迟 (Delay)**：指路由器在给定接口上排队、处理和传输数据的时间。延迟值最低的路径无疑被认为是最佳路径。\n- **跳数 (Hop Count)**：这是一种提供通过如路由器等连接设备次数指定的指标。如果路由协议将跳数视为主要变量，则跳数最低的路径优于任何其他可用路径。\n\
  - **带宽 (Bandwidth)**：指链路容量。以每秒比特为单位给出。将比较所有链路的传输速率。传输速率最高的链路被采用为最佳路径。\n- **可靠性 (Reliability)**：可靠性值是动态确定的。某些链路比其他链路更容易故障。此外，某些链路在故障后比其他链路更容易修复。无论如何，高可靠性的链路都优于低可靠性的链路。系统管理员负责分配本质上是数值的可靠性值。\n\
  - **负载 (Load)**：指网络链路在任何时刻的忙碌程度。它可能以单位时间内处理的数据包数量、处理器利用率或内存使用的形式存在。负载随着流量的增加而增加。在路由中，负载较轻的链路被认为是数据传输的最佳路径。\n\
  \n### 路由类型\n\n路由出现在以下分类中：\n\n### 静态路由 (Static Routing)\n这也被称为非自适应路由。管理员必须手动在路由表中添加路由。数据包沿着管理员定义的路径从源地发送到目的地。路由不依赖于网络拓扑结构或网络状态。决定数据从源地到目的地传输的路由是管理员的任务。\n\
  \n#### 静态路由的优点\n- 对路由器 CPU 使用无额外开销。\n- 安全性更高，因为管理员对特定网络具有控制权。\n- 不同路由器之间不消耗带宽。\n\
  \n#### 静态路由的局限性\n- 为大型网络制定路由表是非常耗费精力的。\n- 管理员必须精通网络知识，特别是他或她所处理的网络拓扑结构。\n\n### 默认路由\
  \ (Default Routing)\n在这种技术中，路由器的配置方式使得路由器将所有数据包发送到单一跳数。该跳数所在的网络并不重要。数据包只需被中继到配置为默认的机器上。当给定网络必须处理单一出口点时，这种技术最为理想。然而，路由器会选择路由表中指定的另一条，而忽略默认设置的路径。\n\
  \n### 动态路由 (Dynamic Routing)\n这被称为自适应路由。在这些方法中，路由器根据网络状况自动决定路径。动态协议在出现问题时进行调整。这些协议是\
  \ `RIP` 和 `OSPF`。\n\n#### 动态协议的特点\n动态协议具有以下特点：\n- 路由器必须具有相同的协议以交换信息。\n- 当拓扑结构出现问题时，动态协议会向所有路由器广播信息。\n\
  \n#### 动态路由的优点\n- 它们非常容易配置。\n- 当网络拓扑发生变化时，它们是更优选择。\n\n#### 动态路由的局限性\n- 在带宽和 CPU\
  \ 使用上成本昂得多。\n- 安全性不如默认和静态路由。\n\n## 注意事项\n\n- 路由器不仅通过地址，还通过协议过滤网络流量。\n- 路由器不在物理上划分网络。它在逻辑上进行划分。\n\
  - `IP` 路由器将网络划分为子网，以确保特定的网络流量可以在其之间通过。然而，这种智能转发会导致速度降低。\n- 在复杂网络中使用路由器，效率更高。\n\n\
  ## 网络服务器 (Network Servers)\n\n网络服务器是指运行在远程网络机器上为网络上的其他机器提供服务的应用程序。网络中的计算机在需要某些服务时向服务器发出请求。服务器为客户端请求提供开放窗口，但在给定时刻并不发起。服务器是无限程序，除非出现问题，否则会无限运行。服务器始终等待网络上客户端的请求。服务器对所有进入的客户端请求做出响应。某些网络没有专门的服务器来控制网络通信。在这种情况下，网络设备直接通信。然而，在网络操作中使用服务器有很多优缺点。\n\
  \n### 服务器的优点\n使用服务器处理网络客户端请求的优点：\n- 集中管理确保了资源共享的安全性。\n- 使用服务器提供了集中备份系统，因为重要数据存储在服务器计算机中。\n\
  - 资源共享增加了网络速度。\n- 可扩展性更高，因为可以单独扩展客户端和服务器。\n\n### 使用服务器的局限性\n- 当许多客户端同时发送请求时，拥堵始终是一个大问题。\n\
  - 网络缺乏健壮性，因为服务器的故障或损坏会导致网络所有的请求处理功能。\n- 由于客户端/服务器网络具有很大决定性，服务器端可能需要特定的硬件。\n- 服务器计算机中可能存在资源但在客户端计算机中没有。\n\
  \n\n\n\n服务器有多种形式。以下是处于计算机网络中起着重要作用的各种服务器列表：\n\n### 接入服务器 (Access Servers)\n远程（局域网）访问为可能受局域网（LAN）地理位置限制的远程用户提供网络连接。接入服务器利用电话线将办公室或用户与办公室网络连接起来。\n\
  \n### 网络时间服务器 (Network Time Servers)\n网络时间服务器是处理来自不同来源（包括无线广播和卫星）的所有网络计时信息的服务器。这些服务器将收集到的信息（来自不同来源）提供给指定的网络。时间服务器依赖\
  \ `NTP` 和 `UDP/Time` 协议与其他节点通信。通过这种方式可以确保网络中协调活动的正确同步。\n\n### 设备服务器 (Device Servers)\n\
  设备服务器指的是一种特殊的、基于网络的网络设备，旨在执行一个或多个服务器功能。设备具有三个主要特征，包括客户端访问和最小化操作系统架构。在最小化操作系统架构中，没有每个席位的操作系统许可证。此外，客户端访问独立于任何专有协议或操作系统。除了上述两个特征外，设备服务器是一种“封闭箱”服务器。这意味着它需要极少的维护、易于安装，并且可以通过浏览器进行远程管理。设备示例包括网络时间服务器、终端服务器和打印服务器。这些设备服务器设计用于处理特定任务。每个设备服务器的特点是软件和硬件中一组独特的配置特征。这些独特特征有助于这些服务器优化运行。\n\
  \n### 多端口设备服务器 (Multiport Device Servers)\n这些服务器允许终端和主机在本地以及整个网络范围内共享设备。一个终端可以连接到多个主机，并在不同的主机之间方便地切换。多端口设备服务器也可以用于仅具有串口的设备。多端口设备服务器可以在`TCP/IP`\
  \ 和 `LAT` 等已知协议之间转换。这主要归于多端口设备服务器自然的翻译能力。\n\n### 打印服务器 (Print Servers)\n打印服务器使得不同的网络用户能够共享网络打印机。打印服务器可能支持串口或并行接口。因此，打印服务器使用适当的协议接受所有网络用户的请求。打印服务器还管理每台网络打印机上的打印作业。\n\
  \n### 理解 VLAN\nVLAN 是虚拟局域网（Virtual Local Area Network）的缩写（通常称为虚拟 LAN）。它指的是使用项目团队、应用程序或功能进行逻辑分段的交换网络。这种逻辑分段不考虑用户的物理位置。VLAN\
  \ 与物理局域网大体相同。唯一的区别是 VLAN 允许终站分组，无论它们是否在同一个物理分段。VLAN 可以容纳任何形式的交换模块端口。组播、广播和单播数据包可以仅转发并泛洪到给定\
  \ VLAN 内的终站。每个 VLAN 都被视为一个逻辑网络。目标为 VLAN 之外站点的的数据包必须通过路由器转发才能到达目的地。注意的是，VLAN 可以与\
  \ IP 子网关联。\n\n### 支持的 VLAN (Supported VLANs)\n按照习惯，我们用 1 到 4094 之间的数字来标识 VLAN。必须注意以下点：\n\
  \n- 1002-1005 VLAN ID 预留给 FDDI 和 Token Ring VLAN。\n- VLAN ID > 1005 不存在于 VLAN 数据库中，因为它们属于扩展范围。\n\
  - 交换模块支持扩展范围和普通范围 VLAN (1005)。\n- 配置特征数量、`SVIs` 和路由端口的数量会影响交换模块硬件的功能。\n\n### VLAN\
  \ 配置指南 (VLAN Configuration Guidelines)\n理解以下事实至关重要：\n\n- 交换模块支持 1005 VLAN。\n- 1\
  \ 到 1001 之间的数字用于标识普通范围 VLAN。\n- 1002 - 1005 预留给 FDDI 和 Token Ring VLAN。\n- 交换模块不支持\
  \ FDDI 和 Token Ring 支持。\n- 1-1005 VLAN ID 通常存储在 VLAN 数据库以及包含交换配置信息的文件中。\n- 1006-4094（扩展范围）\
  \ VLAN ID 限于私有局域网、RSPAN VLAN、MTU 和 UNI-ENI VLAN。这些 VLAN ID 不保存在 VLAN 数据库中。\n\n以下步骤将帮助您创建或修改\
  \ VLAN：\n\n1. 使用 `configure terminal` 命令进入全局配置模式。\n2. 输入 `vlan <vlan-id>` 进入 VLAN\
  \ 配置模式。\n   - 使用现有的 VLAN ID 修改现有的 VLAN\n   - 选择新 ID 创建新 VLAN\n3. 使用命令 `name <vlan-name>`\
  \ 为您的 VLAN 命名。\n   虽然对于普通范围 VLAN 来说这是可选的。\n4. 使用命令 `mtu <mtu-size>` 设置 MTU 大小。\n\
  \   这这也是可选的。\n5. 使用命令 `end` 返回特权 EXEC 模式。\n6. 使用 `show vlan {name vlan-name | id\
  \ vlan-id}` 命令。\n7. 使用 `copy running-config startup config` 命令验证条目。\n8. 要删除 VLAN，请使用命令\
  \ `no vlan vlan-id`。\n   注意 VLAN 1 和 VLAN 1002-1005 不能删除。\n\n\n\n\n# 第 6 章：IP 地址与\
  \ IP 子网\n\n![](img/Image00084.jpg)\n\n## IP 地址\n\n### 什么是 IP 地址？\nIP 地址（Internet\
  \ protocol）地址是一个四字节、八位的数字地址（总共 32 位），写出来的形式像这样：`10.156.158.12`。显而易见，`IP` 是一组由点分隔的唯一数字。这组数字用于标识使用\
  \ Internet 协议（`IP`）进行网络通信的计算机（或网络设备）。在 IP 地址中，任何一个字节（即点之间的数字）的值都可以从 0 到 255 不等。\n\
  \nIP 地址与电话号码并没有完全不同。如果你知道某人的电话号码——比如你的迈克舅——你就可以通过在电话键盘上拨打他的号码来给他打电话。然后，你所属的电信公司的计算机和交换设备就会工作，通过音频通信通道将你的电话与迈克舅的电话连接起来。一旦连接，你就可以和伙伴布拉德利通话，即使他远在数百英之外。通话时，携带你声音的音频信号通常会通过一对铜线从你家传输到当地电信公司的交换机。从那里，信号可能会被转换为光波，以便通过光电缆传输到另一个交换机。从第二个交换机开始，音频信号可能会转换为无线电波信号，以便从一个微波塔传输到另一个微波塔。最终，当信号接近目的地——迈克舅的家时，它将转换回音频模拟信号，通过一对铜线从迈克舅的电信公司传输他的家里。（这种场景假设使用了固定电话。如果涉及手机，该过程在细节上会有不同，但概念一致。）\n\
  \n### IP 地址的作用是什么？\n类似于电话使用号码在本地、区域、国家或国际范围内进行连接的方式，IP 地址促进了计算机主机以及路由设备之间的连接。换句话说，如果互联网上的两台计算机拥有彼此的\
  \ IP 地址，它们就可以通信。但与使用交换设备连接的电话不同，计算机通过路由设备在互联网上相互连接，路由设备与数百或数千台其他计算机共享通信路径。\n\n当数据从计算机发送到路由器时，路由器的任务是找到一条简短、开放的通信路径，通另一个既接近又连接到目标计算机的路由器。路由器通过使用默认路由或动态学习并记录称为“路由表”的表来实现此目标，这些表记录了路由器许多开放且运行的通信端口上存在哪些\
  \ IP 地址。因为互联网上连接的所有路由器都像蜘蛛网一样，如果需要，数据可以通过许多不同的路由或路径到达其预定目的地。如果其中一个路由器或某些连接链路离线，尝试移动数据的其他路由器将寻找通往目的地的替代路由。为了方便这种动态通信方法，路由器也会分配\
  \ IP 地址，以便它们能够找到彼此。\n\n### IP 子网划分\n路由 IP 环境要求对你的 IP 地址池进行子网划分。这允许每个子网将自己视为大型互联网络的一个独立段。然后，路由器将各个子网连接成一个网络。路由器知道如何将流量路由到正确的段，因为它构建了路由表。路由表基本上是网络的地图。\n\
  \nIP 子网划分相当复杂，因此为了让这种讨论既有信息量又在初级水平上易于理解，我们将对子网划分的探索限制在一个类 IP 地址上；我们将观察 `B 类` 范围\
  \ IP 地址的子网划分示例。我们用于对 `B 类` 网络进行子网划分的数学技巧也可以用于 `A 类`或 `C 类` 网络的子网划分（尽管划分 `C 类` 网络会极大限制你最终获得的可用\
  \ IP 地址数量）。\n\n子网划分是一个两部分的过程。首先，你必须确定网络的子网掩码（它将与默认子网掩码不同；例如，`B 类`的默认值为 `255.255.0.0`）。在确定网络的新子网掩码后，你必须计算每个子网将包含的\
  \ IP 地址范围。好了，在我们进行 `B 类` 网络子网划分的数学计算之前，我们小作弊。我认为这有助于对子网划分过程的整体理解。下表显示了使用特定位数进行子网划分（`Bits\
  \ Used` 列）时将创建的新子网掩码、子网数量以及每个子网的主机数量。\n\n## IPv4 对比 IPv6\n目前，IP 版本 4（`IPv4`）地址是互联网\
  \ IP 地址的首选。如所述，这些地址由四组八位组成。在将来，我们可能会采用 IP 版本 6（`IPv6`）地址方案。`IPv6` 在形式和实质上与 `IPv4`\
  \ 有两点不同：\n\n* `IPv6` 地址有八个 16 位数字（总共 128 位），通常以四位十六进制形式表示。单个 16 位数字的范围大于八位数字，跨越从零到\
  \ 65,535。\n* `IPv6` 地址中的 16 位数字用冒号而不是点来分隔。\n\n为什么要切换？因为在 `IPv4` 之下，没有足够的数字分配给互联网上的每个计算机或设备。`IPv6`\
  \ 解决了这个问题，提供了 2¹²⁸ 个地址；相比之下，`IPv4` 仅提供 2³² 个。\n\n# 第 7 章：思科系统与 CCNA 认证简介\n\n![](img/Image085.jpg)\n\
  \n## 什么是 CCNA？\n`CCNA` 全称为思科认证网络助理（Cisco Certified Network Associate）。它是计算机网络爱好者广泛拥有的认证。该认证适用于从初级网络工程师、网络支持工程师、网络管理员到网络专家的所有人员。该认证计划自\
  \ 1998 年成立以来已向合格人士颁发了约 100 万份证书。CCNA 项目涵盖了许多关键网络概念。对于准备当前和新兴网络技术的候选人来说，这是一门重要的基础课程。\n\
  \n## CCNA 范围\n以下是 `CCNA` 项目重点介绍的主要主题：\n\n* 网络基础——包括网络定义、网络组件描述以及基础网络设置和配置。\n* IP\
  \ 地址\n* OSI 参考模型\n* IP 路由\n* 路由器——路由协议（OSPF、EIGRP` 和 `RIP`）\n* WLAN 和 VLAN\n* 网络设备安全\n\
  * 网络安全与管理\n* 网络故障排除\n\n## 为什么选择 CCNA？\n* `CCNA` 证书是网络专业人士管理路由网络能力的可信验证。它证明了个人对网络的理解以及操作和配置网络的能力。它还认证了人员排除网络故障的能力。\n\
  * 该课程提供了如何通过正确确定网络拓扑来满足网络用户需求。\n* 候选人将学习如何构建对点网络。\n* 连接网络的协议路由也通过 `CCNA` 认证实现。\n\
  \n\n\n\n\n- CCNA 认证提供易于理解的学习材料。\n- 该课程是其他重要 CISCO 认证计划的先修课程，例如`CCNA Wireless`、`CCNA\
  \ Security` 和 `CCNA Voice` 等。\n- CCNA 认证计划为学习者提供了安装、配置和管理小型局域网 (LAN) 和广域网 (WAN)\
  \ 服务所需的必要技能。\n\n## CCNA 认证的不同形式\n\n完成 CCNA 认证课程有两种主要方式：\n\n1. `Combined CCNA Exam`\n\
  2. `ICND1 Exam` 和 `ICND2`\n\n请注意，每张 `CCNA` 证书的有效期仅 3 年。每位 `CCNA` 证书持有者预计每隔 3 年参加一次考试。\n\
  \n\n\n\n## 第 8 章：网络安全基础\n\n网络安全是计算机整体中最重要的方面之一。现在，比以往任何时候都，一个既兼顾功能又提供保护的安全协议对于所有类型的用户来说都是至关重要的。在外界存在大量威胁中，用户在进行日常业务时必须拥有一个可以信赖的系统。在这方面，整合这些要素的需求促使用户去寻找满足其个人需求的理想解决方案。在本章中，我们将介绍网络安全的基础知识、指南和最佳实践，以及今天潜伏在四周最常见的威胁。此外，我们还将讨论普通用户如何采取更好的措施，以避免成为那些外界不法之徒的受害者。\n\
  \n## 我们唯一应该恐惧的，是恐惧本身\n\n普通用户来说，害怕黑客是自然的。这可能导致普通用户在安全措施上花费大量资金，而这些措施可能提供、也可能无法提供此类用户所需的安全与功能结合。事实上，顶级安全措施最常见的副作用是系统变慢。例如，一个可靠的在线安全系统本质上会扫描通过其系统的每一比特信息。然而，这可能会导致互联网连接速度的整体下降。因此，用户可能会觉得他们在安全系统的性能上亏了。其他系统可能会为了更快的性能和网络速度而牺牲某些安全功能。然而，这些权衡可能会让关键信息和交易受到不怀之客的侵害。\n\
  \n这就是为什么第一要记住的一点是，因为害怕脆弱而破产可能会导致你在一个系统上过度支出，这个系统虽然能保持你的系统安全，但最终可能会让你花费更多费用。这就是为什么找到正确的平衡至关重要；在功能和性能之间取得平衡是所有用户的终极目标。因此，我们将客观地观察有哪些威胁，你最可能受到哪些威胁，以及你可以做什么来保护自己。请记住一点：在所有的恐怖故事中，只要你不参与那些会吸引黑客和欺骗者的行为类型（例如每天处理大量的财务交易），有些故事并不一定适用于你。因此，采取适当步骤来确保你所进行的交易安全，将对保持你的信息和资金安全产生巨大帮助。\n\
  \n## 需要警惕什么\n\n威胁确实存在，而且是真实的。然而，最重要的一点是，黑客和诈骗者喜欢寻找“容易得手的果实”。这意味着什么？这意味着骗子正在寻找那些不懂事事的弱势群体。因此，他们对这些人下手。这就是为什么老年人是电话诈骗者的常见目标。如此，在线骗子正在寻找那些忘记锁好窗户或忽视确保信息安全的人。\n\
  \n此外，请记住，外界很多诈骗者和黑客本质上会进行“网络钓鱼”（phishing expedition）。没错，我们指的是“钓鱼”（phishing）而不是“游泳”（fishing），因为黑客倾向于撒大网来寻找毫无防备的受害者。事实上，网络钓鱼是受害个人最常见的手段之一。黑客会额外努力制作一封看起来正式的电子邮件，在其中他们装成某个组织（例如你注册过的某银行）的一部分。现在，他们无法知道你是否真的是该银行的客户。因此，邮件看起来需要越自然越好，这样如果你确实是该银行的客户，你会相信这是一封官方通信。\n\
  \n诈骗者随后以银行正在进行安全更新等借口，骗用户提供他们的`username`（用户名）和`password`（密码）。当毫无防备的受害者上了当时，坏人随后清空受者的银行账户是完全可能的。这种诈骗非常普遍，以至于几乎每个公司都采取了必要的步骤，确保他们的客户不受此类攻击的影响。最终，网络钓鱼基本上被击败了。尽管如此，仍然有一两两个黑客在故技重施。话虽如此，本章概述的以下威胁是你需要警惕的示例。\n\
  \n### 网络入侵者\n\n入侵者正潜伏在四处。这一点毫无疑问。需要注意的是，大多数入侵事件发生在内部。这意味着入侵者通常是那些拥有网络访问权限的人员，并试图获得对网络其他部分的未经授权的访问。因此，清楚地了解谁可以访问什么以及敏感信息应该如何被保护是重要的。例如，如果一家公司处理其客户的个人信息，则需要格外小心，以确保此类信息不会落入他人之手。如果此类信息可能产生利润，这一点尤为关键。\n\
  \n在这方面，一种良好的做法是更新访问你的网络（或你的个人电脑）的人员名单。这样，如果发生入侵，将更容易确定谁访问了什么以及入侵可能源于何处。外部入侵者可能会尝试你的网络进行某种远程访问，但他们至少需要对`usernames`（用户名）和`passwords`（密码）有一定的了解。尽管如此，值得指出，黑客只需要一份健康的`usernames`列表，因为正如我们将很快看到的，他们可以使用其他方法破解密码。\n\
  \n## 社会工程学\n\n网络钓鱼是社会工程学的例子。因此，社会工程学试图利用机智策略来从潜在受害者那里获取尽可能多的信息。这就是为什么所有用户在所有的在线互动方式中都需要对敏感信息小心。例如，黑客可能在社交媒体上兜圈观察，寻找毫无防备的猎物以于扑咬。如果你看到了鲨鱼游过的幻象，那么你判断得完全正确。事实是，黑客经常会装成客户服务代理，假装帮助重新获得账户访问或开设新账户。即使客户没有透露所有的信息，黑客也可能获得到足够破解账户的信息。“如果事情听起来好得不可真实，那么它可能就是假的”这句话在社会工程学中仍然适用。所以，请时刻留意任何可疑活动。如果你稍有怀疑，请直接远离可疑的事物。\n\
  \n### 密码破解\n\n几乎每种类型的网络都需要两个东西才能访问：用户名和密码。即使黑客偶然得到了它们，他们仍然必须破解它。这可能相当复杂。然而，如果你不注意你正在使用的密码，就会让黑客的工作变得简单。目前，大多数网站和网络协议都要求使用字母和特殊字符（`@`、`#`\
  \ 或 `&`）的组合。简而言之，密码越长越好。事实上，最好的密码利用随机字符和数字。这使得密码破解软件几乎无法破解。例如，“happy”并不完全安全。破解它可能需要几分钟。然而，“另一个单词”比“happy”复杂得多，破解它可能需要几天甚至几周。到那时，黑客将放弃并转向下一个目标。如果你恰好使用密码生成器，请记住你将避开使用字母和特殊字符。这里最好的建议可能是确保你的密码与你本人没有任何类型的联系。这样，你就可以确保你的账户尽可能安全。\n\
  \n### 数据包嗅探\n\n这是一项复杂的工程，但如果成功了，黑客可以访问到可能无限的数据。这需要通过你的网络的流量。如果你的信息没有加密，那么你就等于成了了待宰的鸭鱼。这就是为什么大多数路由器都内置了加密。此外，网页邮箱服务也使用加密。这样，如果黑客偶然截获了你的数据包，他们唯一得到的将无意义的内容。这最终可能花费他们几个月的时间。\n\
  \n### 漏洞利用\n\n这是一项复杂的尝试，但如果成功了，黑客可以访问到可能无限的数据。这需要通过你的网络的流量。如果你的信息没有加密，那么你就等于是成了待宰的鸭鱼。这就是为什么大多数路由器都内置了加密。此外，网页邮箱服务也使用加密。这样，如果黑客偶然截获了你的数据包，他们唯一得到的将无意义的内容。这最终可能花费他们几个月的时间。\n\
  \n### 恶意软件\n\n恶意软件是旨在破坏、损坏或未经授权访问计算机或网络的软件。它有很多形式，包括病毒、蠕虫、木马、间谍软件等。恶意软件可以通过各种方式传播，例如电子邮件附件、恶意网站或\
  \ USB 驱动器。一旦计算机感染了恶意软件，它可能会窃取信息、删除数据、甚至破坏系统。为了保护你的计算机，应安装可靠的杀毒软件、避免点击来源不明的链接，并定期运行安全扫描。\n\
  \n### 防火墙\n\n防火墙是网络安全的第一道防线。它通过监控和过滤进出网络流量，并根据预设的安全规则允许或阻止流量。防火墙可以防止未经授权的访问你的网络，并抵御某些攻击。防火墙可以是硬件的，也可以是软件的，或者两者两者结合。为了确保网络安全，配置有效的防火墙是必不可少的。\n\
  \n### 加密\n\n加密是将明文转换为不可读密文的过程。只有拥有正确密钥的人才能解密并读取原始数据。加密可以确保即使数据在传输或存储过程中被截获，也无法被读取。在网络安全中，加密被用于保护敏感信息，如登录凭据和财务数据。常见的加密协议包括\
  \ SSL/TLS（用于 HTTPS）和 AES 等。\n\n### 虚拟专用网络 (VPN)\n\n虚拟专用网络（VPN）通过在公共网络（如互联网）上创建加密通道来保护你的数据传输。它可以隐藏你的\
  \ IP 地址，从而增强你的隐私和安全性。VPN 常被用于远程工作，以便员工安全地访问公司内部网络。此外，在公共 Wi-Fi 上使用 VPN 可以有效防止黑客窃听你的流量。\n\
  \n\n\n\n\n- 控制物理访问点，例如 `USB` 和磁盘驱动器\n- 不要忽视对任何敏感信息、文件夹和驱动器的访问密码限制\n- 确保无线网络访问受密码保护，而有线连接仅允许具有使用权限的用户访问\n\
  - 避免使用未经过先前扫描或清理的外部优存盘、磁盘及任何介质\n- 使用高级加密将确保你的数据无懈可击\n- 避免在开放网络或热点上进行信息交换；这些网络容易受到数据包嗅探的攻击\n\
  - 如果怀疑发生网络泄露，请关闭网络访问\n- 定期更新密码（每月一次是一个通用的准则）\n- 制止同事之间共享密码的行为\n- 多花一点钱购买顶级加密是值得的，这可以确保即使数据被拦截，机密也是安全的\n\
  - 总而言之，网络安全在于确保你已经制定了适当的程序。此外，在发生数据泄露或安全漏洞时，清楚该做什么也同样重要。大多数防火墙和杀病毒软件都会提供提醒你来自未知来源警报的功能。通常情况下，这些警报是实时发生的。因此，你将有机会及时关闭针对你网络的任何潜在攻击\n\
  \n\n\n\n\n## 第 9 章：无线技术与安全\n\n功能全无线网络和设备在十年前似乎还只是一个梦想。事实上，该领域的许多专家并不认为整个计算机网络可以运行在无线连接上。然而，在过去的几年里，人们对有线连接的依赖已经大大减少。如今，大量的网络运行在无线连接上。例如，手机通信完全运行在无线通信之上。从通话到接入互联网的方方面面，都不需要任何有线连接。\n\
  \n简而言之，无线网络是设备之间的连接，这种连接不需要使用电缆将设备连接到网络或设备相互之间。从这个意义上说，无线网络提供了高度的灵活性和简单性，因为不需要安装大量的电线和电缆的物理限制。此外，网络可以跨越更远的距离，而且不要求用户物理上出现在特定位置才能访问网络。目前，无线网络简化了访问和移动性。用户可以不断移动而不会错过任何时机。这使得许多用户能够体验新的通信方式，特别是在长远距离移动时。事实上，无线技术彻底改变了我们与周围世界互动的方式。\n\
  \n然而，无线连接的使用也带来了一系列需要考虑的新威胁和顾量。通常，无线接入需要提供者和用户都采取加强的安全措施。这与传统的有线连接形成鲜明对比。在有线连接中，未经授权的用户需要同时访问物理终端和一个用于连接的端口。这意味着攻入网络本身是一项相当复杂的任务。当然，授权用户可以通过使用用户名和密码获取访问来执行远程黑客攻击。但在大多数情况下，必须有人物理在场才能访问网络本身。有线网络的这一侧面在无线通信中消失了。任何处于\
  \ `Wi-Fi` 信号范围内的人员都有可能访问网络。这就是为什么免费的 `Wi-Fi` 热点对普通用户来说可能变得如此危险。事实是，任何人都可以访问网络，特别是当网络缺乏加密或未使用身份验证时。因此，安全专家主倡使用身份验证，可以通过用户名和密码，或者在热点情况下使用强制性门户网站（captive\
  \ portal）。此外，强烈建议进行加密，以避免由于数据包拦截导致潜在的信息丢失。考虑到这一点，大多数家庭网络是相当安全的，也就是说，为一组设备提供无线互联网接入的典型住宅网络对于不受欢迎的用户来说是相当安全的。然而，始终存在有人在搜寻易受攻击网络的风险。对于业务网络而言，无线接入需要提供更高程度的安全。在许多情况下，企业处理敏感和机密信息。这意味着网络管理员需要确保不受欢迎的用户尽可能远离。尽管如此，员工仍然需要访问网络以执行他们的日常工作。考虑到这一点，保护此类连接访问权限的必要性意识确实变得至关重要。\n\
  \n## 建立无线连接时需要考虑的因素\n\n首先，安全是无线网络最关注的问题。在信息即权力的世界里，获取信息的权限是一项有价值的商品。因此，安全问题归结为对信息的访问，而不是对网络本身的访问。这意味着网络管理员心中最大的忧虑不是不受欢迎的用户登录网络；他们最担心的的是，不受欢迎的用户通过登录网络，将获知潜在的敏感信息。在这方面，限制不受欢迎的用户访问是网络管理员的首要任务。一些简单的措施，如确保所有用户都有用户名和密码，通常就足以遏制普通黑客。\n\
  \n网络管理员在建立其无线网络时，考虑的下一个项目是简单性。简单性意味着用户可以轻松地登录网络并使用它来完成他们的目标。考虑到这一点，管理员需要考虑为了适应特定网络上的用户数量所需的带宽。通常，低估所需的带宽是很容易的。事实上，管理员估计一个给定的带宽，然后发现它不足以处理满负负载是非常常见的。其他情况下，管理员可能会对当前用户负载所需的带宽做出适当评估，但没有考虑到未来的用户。因此，管理员同时考虑现在和未来的带宽需求是非常关重要的。\n\
  \n另一个需要考虑的重要方面是产生无线网络或为用户提供 `Wi-Fi` 接入所需的物理基础设施。这些物理基础设施以路由器和信号扩展器的形式出现。物理基础设施中最具挑战性的部分是将信号引导到用户所在地。当房屋和建筑采用流线型设计时，这可能会成为潜在的头疼问题。`Wi-Fi`\
  \ 信号往往卡在转角处或楼梯上下。即使是混凝土建筑也会吸收信号，而不是反射到将连接的设备上。\n\n建立无线网络时的另一个关键考虑因素是了解连接到它的设备。例如，如果网络主要由智能手机和平板电脑组成，那么网络可以容纳更多数量的设备。相比之下，大量的\
  \ PC（它们倾向于消耗更多带宽）连接到网络，就需要进行安排以容纳更多数量的设备。\n\n总的来说，建立无线网络比标准的有线连接容易得多。软件配置不那么复杂，而且在资金方面有明显的节省；需要购买的组件更少，需要安装的电缆也少。因此，如果你正在寻找一个不会耗尽预算且允许多个用户登录的网络，无线网络完全可以满足需求。\n\
  \n## 无线网络的缺点\n\n尽管有优点，无线网络也带来一系列需要考虑的缺点。首先，`Wi-Fi` 接入远没有有线连接可靠。其主要原因是无线网络的信号强度比有线连接波动得多。事实上，许多因素会影响信号质量。天气或其他设备的干扰（手机、电视）可能会降低质量。因此，密切监控信号对于确保网络正常运行至关重要。另一个缺点是连接的速度。通常情况下，有线连接运行总是比无线连接快得多。这是因为\
  \ `Wi-Fi` 信号可以在整个环境中扩散。在有线连接的情况下，它没有别处可去，而是被传输。这使得有线连接比无线连接可靠得多。此外，无线连接依赖于设备，即使没有障碍物，性能可能会下降。因此，确保连接到设备的拥有良好的硬件是重要的。\n\
  \n## 无线网络的类型\n\n到目前为止，我们关注的是设计用于连接互联网的无线网络。由于大多数网络都需要某种形式的互联网接入，这种假设是成立的。在大多数时候，网络是为了连接少数设备而设计的。然而，还有其他类型的无线连接供设备之间通信使用。首先，蓝牙是用于连接少数设备的常用工具。通常，它由两个配对的设备组成。一个常见的例子是连接到智能手机的无线耳机。此外，打印机可以与电脑或手机同步。蓝牙比其他类型的无线通信慢得多，但对于连接不是太远的设备非常有用。也许最大的缺点是安全，因为蓝牙连接没有多少加密。此外，由于启用了蓝牙，无线网络可以非常简单直接，也可以变得相当复杂。\n\
  \n无线局域网 (`WLAN`) 可以建立用于在没有互联网接入的情况下少数计算机之间的通信。在大多数情况下，`WLAN` 将具有某种形式的互联网接入。尽管非常机密的连接可能限于使用\
  \ `WLAN` 的小组，事实上，可能有一个独立的 `WLAN` 具有互联网接入。通过这种方式，安全漏洞的风险可以被限制。这种连接可以限于家庭、个人办公室或整栋建筑。下一级别是无线广域网\
  \ (`WWAN`)。在这种类型的网络中，覆盖区域大得多。如果物理区域超过了无线网络的通常范围，可能需要互联网接入来加入多个连接。这种类型的连接可以用于连接较大的地理区域，如几个街区。另一种类型的网络被称为无线城域网\
  \ (`WMAN`)。这种类型的网络可以连接整个城市。除非有多个中继点在大物理区域分布信号，否则在很大范围内连接设备最有效的方法是通过互联网连接它们。在这种情况下，任何数量的用户都可以登录网络。`WMAN`\
  \ 用于连接整个城市。例如，散布在城市多个地点的公司可能依靠这种配置来帮助它们管理所有用户之间的通信。这些网络也常用于商业目的，如广告和信息广播。所有连接的一个共同点是有产生信号的中央枢纽。枢纽随后将信号发送到连接它的各种设备。此外，可以使用中继和信号扩展器来确保信号覆盖管理员想要授予的整个物理空间。\n\
  \n根据这种逻辑，自形成连接（ad-hoc connection）是在没有任何计划的情况下建立的。例如，笔记本电脑使用 `蓝牙` 连接无线打印机和智能手机。然后，在任务完成后网络将解散。另一个很好的例子是使用手机作为无线热点。在这种情况下，手机允许各种设备连接到它并接入互联网。一旦对互联网的需求消失，网络就会解散。正如你所见，自形成网络具有非常特定的目的，当不再被需要时，它就会消失。经验用户擅长从零开始构建自形成网络，要么在他们陷入困境时提供帮助，要么作为简化工作的手段。最后，混合连接是结合了有线和无线接入的类型。这种网络在企业环境中很常见。这种类型的网络解决了公司的所有需求，因为有线连接通常用于桌面级\
  \ PC，而无线连接用于笔记本电脑和移动设备。此外，混合网络提供了移动性和安全的结合。\n\n## 无线技术的其他用途\n\n过去，更原始的无线技术（如短波）提供了在某些距离上连接的机会，特别是在广播不可用时。直到今天，短波无线电基本上被执法部门和应急部门使用。虽然短波技术范围有限，但仍在在使用。这种通信的一个绝佳例子是卫星通信（satcom）。例如，卫星无线电使用\
