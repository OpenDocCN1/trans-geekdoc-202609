  \n    1.  **可靠性较低**：首先，`Wi-Fi` 接入远没有有线连接可靠。\n    2.  **信号强度波动**：无线网络的信号强度比有线连接波动得多。\n\
  \    3.  **环境因素影响**：事实上，许多因素会影响信号质量。例如，天气或其他设备的干扰（如手机、电视等）可能会降低质量。因此，密切监控信号对于确保网络正常运行至关重要。\n\
  \    4.  **速度限制**：另一个缺点是连接的速度。通常情况下，有线连接总是比无线连接快得多。这是因为 `Wi-Fi` 信号可以在整个环境中扩散。\n\
  \    5.  **物理位置限制**：在有线连接的情况下，它没有别处可去，而是被传输。这使得有线连接比无线连接可靠得多。\n    6.  **依赖硬件**：此外，无线连接依赖于设备，即使没有障碍物，性能可能会下降。因此，确保连接到设备的拥有良好的硬件是重要的。\n\
  \n    ## 无线网络的类型\n\n    到目前为止，我们关注的是设计用于连接互联网的无线网络。\n\n    1.  **安全性挑战 Security**：网络管理员最担心的的是，不受欢迎的用户通过登录网络，将获知潜在的敏感信息。限制不受欢迎的用户访问是网络管理员的首要任务。简单的措施，如确保所有用户都有用户名和密码，通常就足以遏制普通黑客。\n\
  \    2.  **简单性**：这意味着用户可以轻松地登录网络并使用它来完成目标。\n    3.  **带宽需求**：管理员需要考虑为了适应特定网络上的用户数量所需的带宽。很容易低估所需的带宽，因此必须同时考虑现在和未来的带宽需求。\n\
  \    4.  **物理基础设施**：包括路由器和信号扩展器。最具挑战性的部分是将信号引导到用户所在地，尤其是在流线型设计的建筑中。`Wi-Fi` 信号可能会卡在转角或楼梯上下，混凝土建筑也会吸收信号。\n\
  \    5.  **设备类型**：需要了解连接的设备。如果网络主要由智能手机和平板组成，可以容纳更多设备；如果是大量的 PC（带宽需求大），则需要相应安排。\n\
  \n    总的来说，建立无线网络比标准的有线连接容易得多。软件配置不那么复杂，资金方面有明显节省；需要购买的组件更少，需要安装的电缆也少。如果你正在寻找一个不会耗尽预算且允许多个用户登录的网络，无线网络可以满足。\n\
  \n    1.  **无线局域网 (WLAN)**：用于在家庭、办公室或整栋建筑内通信。\n    2.  **无线广域网 (WWAN)**：覆盖更大的地理区域。\n\
  \    3.  **无线城域网 (WMAN)**：用于连接整个城市。这是大型组织使用的网络类型。例如，散布在城市多个地点的公司可能依靠这种配置来帮助它们管理所有用户之间的通信。这些网络也常用于商业目的，如广告和信息广播。\n\
  \    4.  **自形成网络 (Ad-hoc)**：在没有任何计划的情况下建立。例如，笔记本电脑使用 `蓝牙` 连接无线打印机和智能手机。任务完成后网络将解散。另一个例子是使用智能手机作为无线热点。\n\
  \    5.  **混合连接 (Hybrid)**：结合了有线和无线接入。在企业环境中很常见，涵盖了公司的所有需求：有线连接用于桌面桌面 PC，而无线连接用于笔记本电脑和移动设备。此外，混合网络提供了移动性和安全的结合。\n\
  \n    ## 无线技术的其他用途\n\n    过去，更原始的无线技术（如短波）提供了在某些距离上连接的机会，特别是在广播不可用时。直到今天，短波无线电基本上被执法部门和应急部门使用。\n\
  \n    1.  **卫星通信 (Satcom)**：这种通信方式的一个绝佳例子。卫星无线电使用 `UHF` 和 `VHF` 频率在飞机之间进行通信。\n \
  \   2.  **无人机 (UAV)**：这种技术被用于空中侦察、搜索和救援。\n    3.  **加密与安全**：无线技术在安全性上存在挑战。许多网络使用高级加密算法，使得黑客难以破解。\n\
  \n\n\n\n\n# 第 10 章：机器学习导论：计算机网络视角\n\n### 什么是机器学习？\n上述类比仅仅是为了引起我们对本学习课程关注的核心议题：机器学习。计算机真的能学习吗？更好的是，它们能从每天处理的各种任务中积累的经验中学习吗？机器学习是一门能够为上述问题提供充分答案的学科。\n\
  \n用通俗易懂的话来说，机器学习可以描述为通过长期观察而积累技能的过程。我们可以从这个简单的描述中推断出，机器学习始于观察。观察持续一段时间。在观察过程中，某些技能被获得，而另一些则得到了进一步强化——即从经验中学习。这是普通人在地球上生活期间学习过程的一个例子。\n\
  \n对于“机器”，确实存在一个更具体的定义。假设机器是一个涉及在一段时间内从数据中计算/积累专门技能的过程。尽管如此，这听起来像是在讨论人类。但我们需要从机器“行为”的角度来讨论机器学习，更具体地说，是指计算机。\n\
  \n## 计算术语视角\n机器学习被归类为人工智能的一个子集。作为人工智能的子集，机器学习涉及算法开发，使计算机能够从积累的数据和过去执行的功能中学习。这一概念由亚瑟·萨缪尔（Arthur\
  \ Samuel）于 1959 年提出。历史数据（训练数据）为机器学习算法提供了基础，使其生成辅助决策和预测的模型。这是在没有任何显式编程的情况下实现的。创新的预测模型是统计学与计算机科学结合的产物。\n\
  \n## 机器学习如何工作\n机器学习系统通过遵循以下步骤来实现任务：\n* 对在一段时间内积累的历史数据进行彻底检查（或从其学习）。\n* 构建预测模型。\n\
  * 预测输出（在接收到新数据时）。\n\n数据量在很大程度上决定了预测输出的准确性。大量的历史样本对于创建能够保证预测输出高准确性的预测模型是必要的。\n\n\
  ## 机器学习的特征\n以下是机器学习的主要特征：\n* 利用数据对数据集进行模式检测。\n* 从历史数据中学习后进行自动改进。\n* 机器学习在技术上是数据驱动的。\n\
  * 它与数据挖掘具有显著的相似性——两者都处理海量数据。\n\n## 为什么选择机器学习？\n对机器学习的需求每天日益增长。如今之所以以以前所未有的严肃态度对待机器学习的一个关键因素，显然是机器处理高度复杂任务的能力；且比人类做得更好。我们可以读取、理解和解释数据，但我们仅限于几兆字节的数据。机器可以处理数太字节（TB）甚至更多的数据，且准确性很高。\n\
  \n通过机器学习，世界现在可以以自驾驶汽车为傲。社交媒体平台上的朋友推荐也是真实的，这都得益于机器学习。此外，人脸识别等其他重大进展都是机器学习取得巨大突破后的成果。\n\
  \n总之，对机器学习的需求建立在以下关键观察之上：\n* 随着信息系统的广泛采用，数据量的不断增加和快速产生。\n* 处理对人类来说几乎不可能完成的高度复杂任务。\n\
  * 针对大型和复杂数据或信息的关键决策需求。例如，在金融和经济领域，对个人企业、公司甚至政府进行预测。\n* 提取肉眼难以发现的模式和信息。\n\n## 机器学习的分类\n\
  机器学习的分类如下：\n* **强化学习**：这是一种基于反馈的学习模式。学习代理（机器）因每一个错误的模式预测和不理想的结果而受到惩罚。另一方面，同一个学习代理（机器）在完成良好工作时获得奖励。\n\
  * **无监督学习**：机器在没有任何监督的情况下对结果预测进行训练。给定的数据集没有标记，但机器必须学习并最终预测一个结果。无监督机器学习分为聚类和关联。\n\
  * **监督学习**：向机器提供带标签的数据。机器根据这些数据进行模式预测训练，并最终在此基础上给出预测。监督学习分为两类：分类和回归。\n\n## 机器学习的应用\n\
  机器学习对于每一个部门（不论是经济、社会还是行政部门）都是至关重要的。因此，机器学习的应用可以总结为以下三个关键领域：\n\n### 分析中的机器学习\n统计学贯于生活的方方面面。有时我们使用它，却并不知道自己正在使用它。例如，一个对糟糕经历感到困惑的人理所当然会从中吸取教训，并在类似的情况下采取完全不同的行动方案。无论有意还是无意，这个人都会对导致特别糟糕事件的各种因素与可能导致事态转折的因素进行评估。这个过程看起来可能很简单，但事实是，在受害者忙碌的大脑中进行着大量的分析工作。\n\
  \n在日常生活中，政治领域投入大量统计数据来衡量政治候选人的受欢迎程度，并帮助做出关键政治决策。同样，所有部门都基于历史数据的统计结果来预测未来的各种事件。机器学习将这一整个业务提升到了一个新的水平，通过仅允许算法分析数据并根据积累的数据提供模式和可能结果的预测，消除了大量的人力投入。\n\
  \n### 管理中的机器学习\n管理层在决策中严重依赖统计数据。在业务中，管理层负责就员工招聘和裁员、员工薪酬、预算预测以及给定组织或机构内部的领导结构做出决策。在正式场合，这些决策不是仓促做出的，也不是不经过思考做出的。在大多数情况下，在决定对组织或机构好的方案之前，需要几个月甚至几年时间来分析大量的数据。\n\
  \n通过机器学习，此类数据的分析更加高效，因为机器有处理海量数据的能力，而这些数据由人类完成可能需要多年。事实上，某些分析工作远超地球上最聪明的人的能力。\n\n\
  ### 安全中的机器学习\n随着机器学习系统的采用，安全性得到了极大的增强。监控摄像头、金属探测器、安全报警器和其他安全设备都是机器学习应用的完美范例。例如，人脸识别服务在自动取款机上尤为重要，因为它们极大地增加了\
  \ ATM 中心的安全性。\n\n总之，机器学习是人工智能的一个重要子集；特别是在现在，由于信息系统的热潮，我们必须处理大量数据和信息。医疗保健、金融、教育部门以及政府都需要统计数据来为可持续运营做出关键决策。通过机器学习，这些需求可以更高效地满足。\n\
  \n\n\n\n\n# 结论\n\n计算机网络可以由两台计算机组成。只要计算机相互连接、能够通信并共享资源，网络就是完整的。然而，在联网计算机的数量上并没有限制。互联网就是网络规模可以多大的完美范例。\n\
  \n资源共享和通信是网络的两大主要功能。但这并不意味着计算机上除了资源共享和通信外没有其他功能。事实上，许多人连接互联网仅仅是为了娱乐。另一些人连接网络则是是为了协作工作、研究以及许多其他任务。\n\
  \n值得注意的是，网络不仅仅由计算机组成。还有许多其他网络组件让计算机变得更加有趣。打印机、电缆、路由器以及许多其他硬件设备共同构充了计算机网络对重要硬件的需求。此外，软件应用程序和网络协议共同作用，才构建了计算机网络的真实面貌。\n\
  \n尽管计算机网络非常重要，但运行和管理它们绝非易事。网络安全是令关注网络的用户和管理员彻夜难眠的问题之一。网络攻击是真实的，它们对用户信息安全以及网络资源构成了严重威胁。能够有效应对网络威胁是维护网络完整性的关键。\n\
  \n总之，计算机网络是必须严密守护的无价资产。它们在为许多其他重要功能提供平台的同时，也让通信更加高效。在这一 IT 驱动的时代，计算机网络是有效通信、研究和协作的关键。\n\
  \n"
