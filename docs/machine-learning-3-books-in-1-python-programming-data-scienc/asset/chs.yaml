  \        return 'salmon'\n```\n\n\n\n\n\n# 第 5 章：数据聚合\n\n这代表了使用 Pharo DataFrame\
  \ 进行聚合和聚类的第一部分。这仅将处理基础功能，例如使用大小相同的另一系列的值对数据序列进行聚类，以及对分组后的数据结构使用聚合函数。后续的迭代将根据目标场景扩展功能。其实现方式可能会变为优化后的版本。\n\
  \n## 数据框（Data Frame）的定义\n这代表类似于电子表格的数据结构，提供了用于清洗、切片和分析数据的 API。如果你想了解更多关于 `DataFrame`\
  \ 项目，需要考虑相关文档。\n\n## 分拆-应用-合并（Split-Apply-Combine）\n拆分-应用-合并是一种技术，将特定任务分类为可管理的部分，然后将所有部分整合在一起。数据聚合和分组有助于生成用于分析和显示的摘要。例如，当计算平均值或创建计数表时。这是遵循拆分-应用-合并流程的步骤：\n\
  \n1. 根据给定的程序将数据分为若干区域。\n2. 对每个类独立地使用函数。\n3. 使用数据结构合并结果。\n\n## 实现\n在这一部分，你将发现分组和聚合函数是如何实现的。如果你对这些细节不感兴趣，可以跳到下一部分。例如，查看发送给\
  \ `firstSeries` 对象的此消息![](img/Image00018.jpg) 一旦发送此消息，`firstSeries` 将定义一个 `DataSeriesGrouped`\
  \ 对象，它根据 `secondSeries` 的值将 `firstSeries` 分为多个子序列。子序列的集合稍后将作为一个 `DataSeries` 对象，其键等同于\
  \ `secondSeries` 的特殊值，值则存储 `firstSeries` 的子序列。这将匹配每一个唯一值。![groupby](img/Image00019.jpg)\n\
  \n当 `groupBy:` 消息的接收者是 `DataFrame` 时，它会创建一个 `DataFrameGrouped` 实例，其拆分数据的方式与 `DataSeriesGroup`\
  \ ，不同的是 `groups` 序列的值是子数据框，而不是子序列。这意味着组代表 `DataSeries`，其包含键匹配数据框所标识的序列中包含的唯一值。当数据框通过单列进行分类时，该列在分组之前会从数据框中移除。因此，这消除了数据重复，因为相同的值将被保留为键。\n\
  \n对于 `DataSeriesGrouped` 的情况，每个子序列都将附加到一个标量上，并且所有后续标量将连接成一个 `DataSeries`。对于 `DataFrameGrouped`，它将对每个子数据框的每一列包含代码块，并将最终的标量矩阵显示为新的\
  \ `DataFrame`。\n\n聚合通过使用消息完成。它需要一个块（block）作为参数，并将其用于 `groups` 序列的每个值，然后整合到新的数据结构中。最常见的聚合函数，如\
  \ `average`、`min` 和 `max` 提供了短消息。在接下来的迭代中，这些消息是非常有用的并作为快捷方式工作![](img/Image00020.jpg)\
  \ 然而，这些消息将携带类似于聚合的优化实现，因为这些函数在时间和内存上保持高效是必要的。\n\n让我们检查分组序列。使用此 `groupBy` 操作符最简单的例子是使用相同大小的值对序列的值进行分类![](img/Image00021.jpg)\
  \ 上述查询的结果将是一个对象。该对象将账单分为两个序列。在很多时候，你需要对类似于单个数据框列的分组序列进行分类。有一个非常有用的快捷方法。\n\n### 如何对数据框分组？\n\
  除了分类列的快捷方法外，`DataFrame` 还有一个方法可以对其列之一进行分类。上述查询的响应将是一个 `DataFrameGrouped` 对象，保留烟民和非烟民的两个不同数据框。烟民列将从上述数据框中删除，因为它的值将作为键保留在\
  \ `DataFrameGrouped` 对象中。此外，烟民和非烟民的不同组能够在需要时完全重建烟民列。\n\n聚合函数代表接受不同输入并显示标量值的函数，该值汇总了该特定序列的值。这些指的是统计函数，如\
  \ `min`、`max`、`stdev` 等。一旦数据被合并，接下来你就可以使用聚合函数来获取汇总原始数据的集成数据结构![](img/Image00022.jpg)\n\
  \n由于分组是通过另一列对 `DataFrame` 的某一列执行的，因此结果将是一个 `DataSeries` 对象。如前所述，`DataGrouped` 为常用的聚合函数（如\
  \ `count`、`sum`、`min` 和 `max`）提供了快捷方式。目前，这些是快捷方式，但在未来，它们将执行更快的优化聚合。一旦数据框被分组为 `DataFrameGrouped`\
  \ 对象，我们也可以对此对象应用聚合函数。`DataFrameGrouped` 的实现 `apply:` 消息的方式使得函数被应用于每个子数据框的每一列，产生标量值。这些标量然后被组合成一个新的数据框。此查询的结果将是一个包含每列非空单元数量的数据框，对应“Male”和“Female”行![dataframe](img/Image00023.jpg)\n\
  \n# 第 6 章：数据可视化\n\n数据可视化是每位数据科学家的重要元素。在项目的早期阶段，你需要执行探索性数据分析，以识别数据中的洞察。创建可视化可以让你化化为简，是在处理多维数据集时。在项目结束时，你需要以一种透明且引人注目的方式交付最终结果。\n\
  \n## 面终端用户的数据可视化\n通常，数据科学家承担着向最终用户提交洞察的角色。结果可以通过不同的方式传递：\n\n*   **单次演示稿**：在以下情况下，研究问题是一次性的交易，因为从中提取的业务决策将指导组织未来几年的路线。例如，公司投资决策。\n\
  *   **你是从两个配送中心分发货物还是只从一个？** 为了最佳效率，它们应该位于何处？一旦做出决定，该练习可能不会再次重复。在以下情况下，结果以报告的形式生成，演示仅是锦上添花。\n\
  *   **数据的新的视图**：这最常见的例子是客户细分。无疑，细分本身将通过报告和演示发送，但本质上它们包含工具，而不是最终结果本身。一旦确定了清晰且重要的客户细分，就可以将其作为提取数据的新通道提供回数据库。从该点起，人们可以创建自己的报告。例如，每个客户细分卖了多少产品？\n\
  *   **实时仪表板**：你作为数据科学家的工作在获取新信息后并没有结束。你可以将信息发送回数据库并完成工作。然而，当其他人开始对发现的金矿创建报告时，他们可能会产生错误的解读并生成无意义的报告。\n\
  \n\n\n\n\n由于你是发现这一新信息的数据科学家，你需要树立标杆。在以下案例中，你需要创建第一个可刷新的报告，以便其他人能够从中学习并遵循你的足迹。创建第一个仪表板仍然是缩短将见解交付给每天都需要使用这些信息的最终用户的一种手段。通过这种方式，在报告部门发现何时建立公司报告软件的永久性报告之前，他们已经有了可以进行构建的基础。你可能已经发现某些重要要素在起作用：\n\
  \n### 关键考虑因素\n*   首先，你支持的是什么类型的决策？是战略性的还是运营性的？战略性决策需要你进行分析并生成报告。但是，运营性决策要求频繁更新报告。\n\
  *   你的组织规模有多大？对于较小的组织，你将处理通用周期。这个周期涵盖从收集到报告。对于较大的团队，可以有专门的报告人员为你创建仪表板。尽管如此，在最后阶段，创建一个原型仪表板是有意义的，因为它提供了示例并缩短了交付时间。\n\
  \n### Python 可视化库\n`Matplotlib` 是一个非常强大的 Python 库，用于构建你的数据可视化。然而，定期设计数据、参数和图表可能会变得混乱且乏味。这一节将引导你进行数据可视化，并借助\
  \ Python 的 `matplotlib` 创建一些快速易用的函数。你将学习如何使用 `Seaborn`、`Matplotlib` 和 `Pandas` 可视化创建基础图表。Python\
  \ 提供了许多功能丰富的绘图库。无论你想描述交互式的还是复杂的 Python 图表，它都能提供一个强大的库。为了提供一些概述，流行的绘图库包括：\n\n*  \
  \ `Seaborn`。它具有先进的界面和重要的默认样式。\n*   `Plotly`。这在开发重大图表时非常重要。\n*   使用 `Pandas` 进行可视化。它是一个易于应用的接口并构建在\
  \ `Matplotlib` 之上。\n*   `Ggplot`。它依赖于 R 的 `ggplot2` 并应用图形语法。\n\n### Matplotlib\n\
  `Matplotlib` 是最常用的 Python 库。它是一个低级库，具有更大自由度的 Matlab 。`Matplotlib` 对于创建柱状图、折线图和直方图等基础图表非常重要。你可以使用以下代码导入该库：\n\
  ```\n![](img/Image00024.jpg)\n```\n### 折线图\n`Matplotlib` 库通过应用 `plot` 方法允许开发折线图。尽管如此，通过在同一轴上绘制并循环每一列，可以使用单个图表创建多个列。\n\
  \n### 直方图\n通过 `Matplotlib`，你可以使用 `hist` 方法设计直方图。当你传递分类类型数据（如列点）时，它将帮助确定每个类别发生的概率。\n\
  \n### 柱状图\n如果你想在柱状图中显示数据，那么 `bar` 函数会很有用。柱状图不是根据类别的频率自动创建的，因此你需要使用 `Pandas` 来实现。柱状图对于分组那些不会分散分类的数据有用，因为分类可能会变得混乱。\n\
  \n### 使用 Pandas 进行可视化\n`Pandas` 代表了一个高级别的开源库。它是一个表示数据结构和数据分析工具的简单库。在 `pandas` 的帮助下，可视化可以轻松创建数据帧（dataframe）和序列（series）。它的它的\
  \ API 比 `Matplotlib` 更高级。因此，实现相同的结果所需的代码更少。如果你想安装 `Pandas`，需要运行 `pip` 命令。\n\n###\
  \ 可视化的目标\n数据通信和探索是数据可视化的主要焦点。一旦数据被可视化，模式就会变得显而可见。你将立即判断是否存在增长趋势，或者某物与其他因素相关的相对大小。与其告诉人们一长串数字，为什么不给他们看以获得更好的清晰度呢？例如，让我们考虑关于“比特币”一词的全球趋势搜索。\n\
  ```\n![bitcoin](img/Image00025.jpg)\n```\n你应该能看到比特币兴趣出现了短暂的上升，但在峰值之后开始下降。总的来说，在峰值期间，存在与比特币的技术和社会影响相相关的巨大炒作。再次，随后的炒作由于人们理解了它而减少，或者它是与炒作相关的常见现象。无论情况如何，数据可视化都能帮助我们以非常清晰的确定模式。\n\
  \n请记住，数据可视化的重要性在于探索数据。在以下案例中，你可以快速选择模式以及发送给我们的数据。当你将其提交给公众受众时，这一点至关重要。其他人可能决定对数据进行快速简要介绍，而不急于进入细节。你真的不需要用文本和数字打扰他们。产生广泛影响的是你使用数字和文本构建它们的方式。产生巨大差异的是你如何定义数据，以便个人能够快速记住它的重要性。这就是数据可视化变得有用的地方，它允许人们挖掘数据并传达你试图表达的一切。\n\
  \n可视化数据有很多方法。其中一些方法已经讨论过了。\n\n### 从简单方法到复杂的数据可视化\n为了创建优秀的数据，可视化是每位数据科学家都需要意识到的项强大技能。它不仅仅是创建美观的图表，以便个人容易学习的方式表示数据集的信息。当你有了正确的可视化时，个人可以快速学习数据背后的模式和信息。在项目早期，你将进行探索性数据分析以产生对你数据的见解。创建可视化将增加你的分析。在项目结束时，以简洁且引人的方式提交最终结果至关重要，这样任何观众都能阅读。毫无疑问，进入下一阶段的可视化将让你赢得下一次演示。\n\
  \n这一节将探索如何定义吸引且复杂的数据可视化。你将应用 `plotly` Python 库，它在创建交互式可视化方面非常出色。\n\n### Plotly 概述\n\
  `Plotly` 代表了一个交互式的、依赖浏览器的图形 Python 库。它是一个允许你与标准的 `Matplotlib` 相比改进可视化能力的库。与 `Matplotlib`、`Pandas`\
  \ 和 `Seaborn` 等其他 Python 库相比，使用 `Plotly` 有两个好处：\n\n1. 应用的易用性。这将定义交互式图表和其他复杂的图形。使用其他库执行相同的操作需要大量工作。\n\
  2. 它提供了额外的功能。\n\n\n\n\n\n由于 `Plotly` 基于 `D3.js` 设计，其绘图能力比其他绘图库更强大。使用 `plotly` 可以创建旭日图等许多其他图表。\n\
  \n## 使用 Plotly 构建精美的图表\n`Plotly` 在构建花哨图表方面非常有用。首先，让我们导入 `plotly` 及其内部的图表对象组件。你还将导入\
  \ `Pandas` 来加载数据集![](img/Image00026.jpg)。要读取数据集，你基本上在 `Pandas` 中写一行代码即可。\n\n## 散点图\n\
  在这一节中，我们将绘制一个销售价格与建筑年份的散点图。为了实现这一点，你需要定义一个散点图对象并将其存储在轨迹（trace）中![](img/Image00027.jpg)。\n\
  然后，要绘图，你只需要写一行代码。![](img/Image00028.jpg)。以下命令将在你的浏览器中创建一个带有图表的新标签页。图表的交互性是 `Plotly`\
  \ 内置内置的。\n\n## 箱线图\n这一次，我们将查看箱线图。过程非常相似。因此，我们将定义一个图形对象，将其存储到轨迹中，然后在浏览器中表示出来![](img/Image20029.jpg)。\n\
  箱线图将具有具有吸引力的属性。默认情况下，我们获得了相同的缩放、和平和点选择功能。现在箱线图已经存在了，如果你悬停在每个箱线图上，它将显示以下内容：\n\n*\
  \ 中位数\n* 第一和第三四分位数\n* 数据范围的最小值和最大值\n* 如果存在离群值，则显示上边界和/下边界\n\n## 热力图\n热力图是数据科学家的关键工具。它们能够有效地在单个图表中显示多个特征变量之间的关联以及每种关系的相对重要性。为了演示如何使用\
  \ `Plotly` 改进你的热力图，我们将房价数据集的相关矩阵创建为热力图![](img/Image00030.jpg)。\n\n在 `Matplotlib`\
  \ 中的热力图可能有些困难，因为你无法识别每个 `cell_` 的准确值——你只能通过颜色判断。你可以编写代码让它具有交互性，但这可能是 `Matplotlib`\
  \ 中很麻烦的地方。`Plotly` 提供了超出基础之外的交互性，因此当你绘制热力图时，你可以获得一个吸引人的概览，并在需要时确认精确值的选项。`Plotly`\
  \ 的平和平缩放功能都非常整洁，从视觉角度的全面探索提供了简便的方法。\n\n这些只是为了说明应用 `plotly` 的意义和可能性。请记住，你可以使用高质量的数据可视化创建出版物。此外，你可以根据你的目标更改示例代码。不需要发明某些独特的东西。你可以复制正确的部分并将其应用于你的数据中。可能在未来，将会有更简单、更有效的方法来构建数据可视化，特别是在处理海量数据集时。你仍然可以构建随时间变化的动画演示。无论采用哪种方法，数据可视化的主要目标都是数据数据。你可以选择其他方法，但目标通常保持不变。\n\
  \n在接下来的章节中，你学习了数据可视化的通用方面。你已经了解到数据可视化是通过图形化样式表示数据来理解数据的实践，以便趋势能够显现出来。`Python` 提供了许多不同的图形库，这些库包含许多不同的属性。在本节中，我们查看了\
  \ `Matplotlib`、`Pandas` 可视化和 `Seaborn`。在接下来的章节中，我们将查看针对机器学习和复杂数据分析的特定主题。原始目标是确保你了解数据科学中应用的常用特征和术语。\n\
  \n\n\n\n\n# 第 7 章：机器学习\n\n机器学习是人工智能（AI）的一个分支，它提供了能够在无需任何编程的情况下从过去场景中学习的技术。机器学习的缩写为\
  \ `ML`。该领域关注创建能够处理数据并从中学习的计算机应用程序。学习过程始于观察、直接经验或示例，以从数据中构建模式，并使用这些模式预测未来。机器学习的主要目标是使计算机能够在没有人类干预的情况下自动学习。通过\
  \ `ML`，可以分析海量数据。`ML` 能产生有用的结果，但我们可能需要不同的资源来实现这一状态。训练机器学习模型可能需要额外的时间。\n\n## 机器学习算法分类\n\
  \n让我们从监督学习开始。\n\n### 监督学习\n在监督学习的情况下，需要人类提供所要求的输入和输出，并在训练期间根据预测的准确性提供反馈。训练完成后，算法将把之前应用的内容用于下一个数据上。监督学习的思想可以比作老师的监督下学习。老师为学生提供示例，学生根据这些示例提出新的规则和知识，以便将其应用于其他地方。\n\
  \n了解回归问题和分类问题之间的区别对你也是完美的。当涉及到回归问题时，目标是一个数值；而在分类中，目标是一个类别。回归任务可以帮助计算伦敦所有房屋的平均成本。另一方面，分类任务将允许你根据花瓣和花萼的长度确定花的种类。\n\
  \n### 无监督学习\n涉及到无监督学习时，算法并不期望被提供输出数据。一种被称为 `deep learning` 的迭代方法被用于修正数据并得出结论。这使得它们在处理与比监督学习算法更复杂的任务时非常完美。换句话说，无监督学习算法从没有响应的示例中学习。算法会自行从示例中发现模式。\n\
  \n监督学习算法的工作方式与人类确定两个或多个对象之间的相似性相同。你在在线购买物品时遇到的大多数推荐系统都是基于无监督学习算法的。在以下情况下，算法会根据你之前买过的东西向你推荐什么。算法必须估计与你相似的客户类型，并此推导出建议。这似乎是真正的人工智能的精髓，计算机可以在没有人类干预的情况下学习。这是关于从数据本身中学习，并试图找到不同输入之间的关系（注意，与之前讨论的\
  \ `Regression` 和 `Classification` 不同，这里没有预期输出）。重点在于输入，并试图找到它们之间的模式和关系。可能存在自然簇，或者输入之间存在明确的关联。也可能完全没有用的关系。\n\
  \n### 强化学习\n这种类型的学习发生在算法被提供没有标签的示例时，就像无监督学习一样。但可以通过根据算法建议的解决方案提供的正或负反馈来实现示例。它与算法必须决策的应用相钩，这些决策与后果相关联。这与人类学习中的试错法相同。当错误与成本、时间损失和痛苦等惩罚相联系时，学习中的错误就变得必要。\n\
  \n涉及到强化学习时，某些动作比其他动作更容易成功。`ML` 处理过程类似于数据挖掘和预测建模。在这两种情况下，搜索数据都是必须的，以便得出模式，然后相应地调整程序的动作。`ML`\
  \ 的一个很好的例子是推荐系统。如果你在线购买了一个物品，你会看到与该物品相关的广告，这就是 `ML` 的绝佳例子。\n\n## 如何处理问题\n\n许多数据科学家以二分法处理问题。任务是属于\
  \ `Supervised`（监督）还是 `Unsupervised Learning`（无监督学习）？发现最快的方法是确定预期输出。\n- 我们是否正尝试根据新的\
  \ `x` 值预测 `y` 值（`Supervised Learning`，回归）？\n- 根据之前标记的数据，新输入是属于类别 `A` 还是类别 `B`（`Supervised\
  \ Learning`，分类）？\n- 我们是否正尝试发现并揭示数据点如何聚合，以及是否存在自然簇（`Unsupervised Learning`，聚类）？\n\
  - 输入之间是否具有有趣的关系（它们具有高共现概率吗）？\n\n许多高级数据分析问题都属于这些通用问题。毕竟，目标始终是预测某些内容（基于先前的示例）或探索数据（发现是否存在模式）。\n\
  \n## 什么是深度学习\n\n深度学习是指 `ML` 的一个分支，涉及受大脑功能和结构启发的算法，这种结构被称为 `artificial neural networks`（人工神经网络）。这使得机器能够完成人类来说是自然的事情，即从过去中学习。这是自动驾驶汽车想法背后的系统。通过深度学习，计算机可以执行分类任务。深度学习模型可以获得精度，这种精度有时超过人类水平的性能。\n\
  \n## 使用 Scikit-Learn 构建神经网络\n\n神经网络是指尝试模仿自然生物神经网络运行的 `ML` 技术。人类有以极高精度识别模式的能力。每当你看到一头牛时，你都能立即识别出它是一头牛。当你看到一只山羊时也如此。这是因为你已经在一段时间内学习了牛或山羊看起来像什么样，以及它们之间的区别。\n\
  \n人工神经网络是指通过类似于人类神经系统的复杂架构，试图模仿人类学习能力的系统。人工神经网络背后的思想其实很老了。但最近它经历了大规模的复兴，许多人（无论他们是否理解）都在谈论它。为什么它会再次流行？这是因为数据的可用性和技术的发展。\n\
  \n### 神经元的结构\n神经元由细胞体组成，具有许多延伸部分。其中大部分以 `dendrites`（树突）的形式存在。信号的传输开始于 `axon`（轴突）中的一个区域，该区域被称为\
  \ `hillock`（位点）。神经元有一个边界，被称为 `cell membrane`（细胞膜）。细胞膜内外的差异被称为 `membrane potential`（膜电位）。如果输入变得足够大，就会产生一些动作电位。这种动作电位随后沿着\
  \ `axon` 向下远离细胞体。神经元通过 `synapses`（突触）连接到另一个神经元。信息通过 `axon` 离开神经元，然后传递到另一个神经元的 `synapses`。注意，只有当阈值超过一定量时神经元才会放电。信号非常重要，因为它们会被其他神经元接收。如果输入足够大，就会产生一些动作电位。这种动作电位随后沿着\
