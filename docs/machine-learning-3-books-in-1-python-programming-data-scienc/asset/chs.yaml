  \n\n\n\n\n# 第 11 章：分类\n\n## 是垃圾邮件还是非垃圾邮件？\n这是分类最流行的应用和示例之一。与回归类似，分类也被归类为监督学习。模型从带标签的数据中学习，然后系统将该学习结果应用于新的数据集上。例如，有一个包含各种电子邮件消息的数据集，每条数据都被归类为垃圾邮件或非垃圾邮件。模型随后可能会识别邮件消息中被标记为垃圾邮件的特征。在进行预测时，模型可能会尝试在新的邮件消息中识别这些特征。\n\
  \n实现成功分类有多种方法。让我们来看其中几个：\n\n### 逻辑回归\n在大多数分类问题中，目标是通过使用两个独立变量来确认结果是 0 还是 1。例如，假设\
  \ `Age`（年龄）和 `Estimated Salary`（预估薪水）决定了某人是否购买等结果，我们该如何成功地构建一个表示它们关系的模型，并用它进行预测。这听起来可能很困惑，这就是为什么你需要看一个例子。\n\
  \n![regression](img/Image00066.jpg)\n\n在上面的示例中，有两个变量 `Age` 和 `Estimated Salary`。每个数据点都被归类为\
  \ 0 或 1。有一条线将这两者分开。这种方法基于概率。与回归一样，其中存在黑箱，逻辑回归的背后原理可能会很难。好在是，当你应用 `scikit-learn`\
  \ 和 `Python` 时，它的执行非常直观。通常的步骤是先从训练集（Training Set）学习，然后将该学习用于测试集（test set）。归根底，这就是监督学习的目的。首先，你会发现有训练和监督。接下来，课程将被用于新情况。正如你在测试集的视觉化中发现的，大多数绿点落在绿色区域。因此，该模型最适合预测具有特定年龄和预估薪水的人是否会购买。\n\
  \n![classification dfg](img/Image00067.jpg)\n\n首先，我们将数据转换为相同的范围或比例，以避免偏斜或对给定变量的过度依赖。在数据集中，预估薪水是以千位为单位表示的，而年龄则以较小的刻度表示。我们需要将它们设置为相同的范围，以便我们获得一个合理的模型。除了逻辑回归外，还有其他分组任务的方法。让我们讨论一下：\n\
  \n### K-近邻\n该算法在创建高级分类器方面非常流行。它是一种简单的算法，但它的表现比其他分类器更好。这就是为什么它在遗传学、预测和数据压缩中流行的原因。`KNN`\
  \ 属于监督学习算法。换句话说，我们面对由训练观测值 `(x, y)` 组成的数据，主要目标是识别 `x` 和 `y` 之间的关联。因此，我们需要定义一个函数\
  \ `x-y`，使得当我们提供 `x` 的输入值时，我们可以预测 `y` 的对应值。\n\n`KNN` 算法的原理非常简单。它计算新数据点到所有其他训练数据点的距离。距离可以是不同类型，包括欧几里得（Euclidean）、曼哈顿（Manhattan）等。选择出\
  \ `K` 个最近的数据点，其中 `K` 可以是一个整数。最后，将数据点分配给大多数这 `K` 个数据点所属的类别。\n\n记住，逻辑回归似乎在 0 和 1 之间具有线性边界。因此，它缺少了一些需要位于另一端的数据点。幸运的是，有非线性模型能够以更准确的方式呈现许多数据点。其中之一就是\
  \ K-近邻的应用。它的运行方式是让一个数据点通过，然后计算属于某一类别的邻居数量。如果很多邻居属于类别 A，那么新点属于类别 A。因此，给定点的分类取决于其大多数的邻居。\n\
  \n![classifier](img/Image00068.jpg)\n\n此外，我们不会从零开始，而是将导入预构建的代码来简化任务。背后的原理可以被学习和研究。但出于许多原因，使用预构建的来构建合理的模型更好。不要忘记，由于\
  \ `K-NN` 的各种方法，边界是非线性的。此外，遗漏仍然存在。\n\n### 决策树分类\n许多数据科学家也在分类中应用决策树。构建决策树涉及将数据集分成较小的子集并进行分离。看看下面的示例：\n\
  \n![knn train](img/Image00069.jpg)\n\n你能看到分支和叶子源自数据集吗？这同样适用于分类。当你运行整个代码时，你将看到以下：\n\
  \n![dcstree classfica](img/Image00070.jpg)\n\n看到与逻辑回归和 K-近邻（`K-NN`）相比的巨大差异。在这两个例子中，只有两个边界。在上面的决策树分类中，你可以识别出主区域之外原本不可能存在的点。\n\
  \n### 随机森林分类\n记住上一节提到的，随机森林被描述为决策树的集合。这适用于分类，其中应用了许多决策树并对结果取平均值。![random forest](img/Image00071.jpg)\n\
  ![random fr](img/Image00072.jpg)\n\n看看随机森林和决策树之间的相似性。归根底，它们采用了相似的方法将数据集分成较小的子集。区别在于随机森林应用了随机性并对决策树进行平均，以开发准确的模型。\n\
  \n### 聚类\n（注：此部分原文似乎存在部分逻辑重复或断句，已根据语境翻译）\n...（此处根据原文提供的文本片段进行了对应翻译，并保持了格式结构）\n\n\
  \n\n\n\n# 第 12 章：关联规则学习\n\n这是无监督学习的延续。在之前的章节中，我们发现了自然模式和聚合信息。对于“正确答案”应该长什么样，我们并没有太多的监督和指导。我们允许算法去发现和研究数据。结果是，我们能够从数据中获得可以利用的见解。\n\
  \n在本章中，我们将重点关注关联规则学习。这里的目标是发现项目之间是如何“相关”或相互关联的。这对于决定杂货店中哪些产品应该摆放在一起非常有用。例如，许多客户可能总是同时购买面包和牛奶。然后，我们可以重新安排一些货架和产品，让面包和牛奶相互靠近。\n\
  \n这也是向客户推荐相关产品的一种良好方法。例如，许多客户可能在网上购买尿布，随后又购买关于育儿的书籍。这两件产品之间有很强的关联性，因为它们标志着客户生活的阶段转变（有了孩子）。此外，如果我们注意到尿布的需求激增，我们可能也可以准备好育儿书籍。这是一种通过提前购买物资来以某种方式预测并准备未来需求的好方法。\n\
  \n在杂货购物或任何涉及零售和批发交易的业务中，关联规则学习在优化（鼓励客户购买更多产品）和供需匹配（例如，一种产品的销售增长也向另一个相关产品发出了同样的信号）方面非常有用。\n\
  \n## 解释\n\n那么，我们如何确定项目之间的“相关性水平”并据此创建实用的分组呢？一种直接的方法是统计涉及特定集合的交易。\n\n| 交易 | 购买内容\
  \ |\n| :--- | :--- |\n| 1 | 鸡蛋、火腿、热狗 |\n| 2 | 鸡蛋、火腿、牛奶 |\n| 3 | 鸡蛋、苹果、洋葱 |\n| 4\
  \ | 啤酒、牛奶、果汁 |\n\n我们的目标集是 `{Egg, ham}`。注意这种购买组合出现在 2 次交易中（交易 1 和 2）。换句话说，这种组合发生的概率为\
  \ 50%。这是一个简单的例子，但如果我们研究 10,000 笔交易，且比例仍然是 50%，那么显然，鸡蛋和火腿之间存在很强的关联性。\n\n随后我们可能会意识到，将鸡蛋和火腿放在一起（或以组合的形式提供）是为了让客户的生活更轻松（同时我们也增加了销售额），这是值得的。目标集在总交易中的百分比越高越好。或者，如果比例仍然低于我们的任意阈值（例如\
  \ 30%、20%），我们仍然可以关注特定集合，并对我们的产品和优惠进行调整。\n\n除了计算实际百分比外，另一种了解项目集有多“流行”的方法是基于概率。例如，产品\
  \ `X` 与产品 `Y` 同时出现的概率有多大？如果概率很高，我们可以在某种程度上说这两个产品密切相关。这些都是估计两个产品之间“相关性”或关联水平的方法。对于某些应用来说，一种或多种方法的组合可能已经足够了。也许基于概率会产生更好的结果。或者，优先考虑非常热门的项目集（发生频率高）会带来更多的交易。\n\
  \n最终，我们能够从数据中获得可以利用的见解。\n\n\n\n\n\n# 第 13 章：强化学习\n\n请注意，在之前的章节中，重点在于处理过去的信息并从中推导出见解。换句话说，我们对过去的关注远于对现在和未来的关注。但为了让数据科学和机器学习变得真正有用，算法和系统应该能够在实时情况下进行工作。例如，我们需要系统能够实时学习并进行相应的调整，以最大化奖励。\n\
  \n## 什么是强化学习？\n\n这就是强化学习（`RL`）大显用场的地方简单来说，`RL` 是关于随着时间的推移来强化正确或期望的行为。每个正确行为都会获得奖励，否则受到惩罚。最近，`RL`\
  \ 被用于在围游戏中击败世界冠军，并成功玩了各种 Atari 游戏（尽管当时的强化学习更为复杂并结合了深度学习）。随着系统从强化中学习，它能够实现目标或最大化奖励。\n\
  \n一个简单的例子是在线广告的点击率（`CTR`）优化。假设你可能有 10 条内容本质上相同的广告（可能文字和设计之间略有不同）。起初，你想知道哪条广告表现最好并产生最高的\
  \ `CTR`。毕竟，更多的点击意味着你的业务拥有更多的潜在客户和客户。但如果你想最大化 `CTR`，为什么不在广告投放期间直接进行调整呢？换句话说，不要等到你的整个广告预算耗光了才知道哪条表现最好。相反，要在广告运行期间找出哪些广告表现最好。尽早做出调整，这样在以后就只向潜在客户展示表现最好的广告。\n\
  \n这与概率论中一个著名的问题——多臂老虎机问题非常相似。假设你有一个有限的资源（例如广告预算）和一些选择（10 种广告变体）。你如何在这些选择之间分配资源，以最大化你的收益（例如最佳\
  \ `CTR`）？首先，你必须“探索”并逐个尝试广告。当然，如果你发现 `Ad 1` 的表现异常出色，你就会“利用”它并在营销活动的剩余时间内一直运行它。你不需要在表现不佳的广告上浪费金钱。坚持胜者并持续利用它的性能。\n\
  \n不过这里有一个陷阱。在早期，`Ad 1` 可能表现良好，所以我们倾向于反复使用它。但如果 `Ad 2` 追了上来，如果我们让事态自然发展，`Ad 2` 会产生更高的收益呢？我们永远不会知道，因为\
  \ `Ad 1` 的性能已经一直被过了。在许多数据分析和机器学习项目中，总是存在权衡。这就是为什么总是建议预设性能目标，而不是在以后考虑万如果的情况。即使在最复杂的技巧和算法中，权衡和约束始终存在。\n\
  \n## 与监督学习和无监督学习的比较\n\n请注意，强化学习的定义并不完全属于监督学习或无监督学习。记住，监督学习是通过监督和训练进行学习。另一方面，无监督学习实际上是从无结构化数据中揭示或发现见解（没有监督，没有标签）。与\
  \ `RL` 相比的一个关键区别在于最大化集合奖励、从用户交互中学习以及实时更新自身的能力。记住 `RL` 首先关于探索和利用。相比之下，监督学习和无监督学习更多是关于被动地从历史数据中学习（而非实时）。\n\
  \n这三者之间存在着微妙的界限，因为它们都仍然以某种方式关注优化。无论情况如何，这三者在科学和商业环境中都有实用的应用。\n\n## 应用强化学习\n\n`RL`\
  \ 在许多业务场景中特别有用，例如优化点击率。我们如何让标题的点击次数最大化？请注意，新闻故事在相关性和受欢迎程度方面的寿命通常有限。考虑到这种有限的资源（时间），我们如何立即展示表现最好的标题？在线广告的\
  \ `CTR` 最大化也是如此。我们有有限的广告预算，并从中获得最大收益。\n\n让我们探索一个示例（使用 `Ads_CTR_Optimisation.csv`\
  \ 数据）来更好地说明这一观点：像往一样，我们首先导入必要的库，以便处理数据（并进行数据可视化）。\n\n![](img/Image0077.jpg)\n\n\
  在每一轮中，广告都会显示出来，并指示哪些被点击了（未点击为 0，点击为 1）。正如之前讨论的，目标是先探索、选择胜者，然后利用它。\n\n实现这一目标的一种流行方法是汤普采样（Thompson\
  \ Sampling）。简单来说，它通过采样或尝试可能的动作，同时忽略或放弃可能表现不佳的动作来解决探索-利用困境（试图实现平衡）。该算法基于概率运行，这可以通过代码表示。当我们运行代码并可视化时：![histograms\
  \ ad collec](img/Image0078.jpg)\n\n请注意，汤普采样的实现可能非常复杂。它是一种有趣的算法，广泛应用于在线广告优化、新闻文章推荐、产品组合和其他业务场景中。还有其他有趣的算法和启发式方法，如置信区间上限（Upper\
  \ Confidence Bound）。目标是在边学习边赚钱。而不是事后分析，我们的算法可以实时执行和调整。我们希望通过平衡探索与利用之间的权衡来最大化奖励（最大化当前性能或“学习更多”以提高未来的性能）。这本身就是一个有趣的话题，如果你想深入研究，可以阅读更多的在线资源。\n\
  \n\n\n\n\n# 第 14 章：集成方法\n\n本章将介绍集成方法。当你在实时决策过程中遇到不确定性时，是否会寻找朋友来帮助你？事实上，我们做决策取决于我们从朋友那里找到的集体知识。集成学习在机器学习（ML）中使用了相同的概念。其背后的思想是开发更多的数据模型，并根据所有单个模型的预测结果来生成最终预测。对于回归问题，最终结果可以是所有模型的预测平均值。在分类环境中，则通过多数投票决决来确定输出类别。一种流行的想法是拥有许多模型，每个模型在训练数据集上呈现出略有不同的输出。与其他模型相比，某些模型能较好地学习数据的属性。人们相信，所有这些模型产生的最终结果应该优于其中任何一个模型生成的结果。\n\
  \n如前所述，集成的背后的理念是将不同的模型整合在一起。这些模型可以是同类型的，也可以是不同的。例如，你可以通过应用贝叶斯模型来合并神经网络模型的输出。本章将仅限于同类型模型的集成。在数据科学领域，通过\
  \ bagging（自助聚合法）和 boosting（提升法）技术合并同类型的模型是非常常见的。\n\n### Bagging（自助聚合法）\n\n自助聚合（bootstrap\
  \ aggregation）是创建许多模型并结合其输出以生成最终预测的一种方法。bagging 集成中的每个模型只使用训练数据的一个部分。bagging 背后的思想是减少数据过拟合。如之前提到的，你希望每个模型都与其他不同。因此，你需要使用有放回采样对数据进行采样以训练每个模型，从而引入变异。\n\
  \n另一种在模型内部引入变异的方法是对属性进行采样。你不会将所有特征提交给模型，而是让模型获得特定的属性。bagging 可以很容易地并行化。根据可用的并行处理框架，可以使用训练数据集的不同样本并行生成模型。bagging\
  \ 方法不适用于线性回归等线性预测器。\n\n### Boosting（提升法）\n\nBoosting 是集成技术的一部分，用于产生各种复杂的模型。它通过顺序工作，根据原始模型中的误差来训练较新的模型。每个训练好的模型都与一个权重相关，该权重是根据模型在给定数据上的表现优越程度计算的。在执行最终预测时，上述权重定义了特定模型对最终结果的影响百分比。\n\
  \nBoosting 不会像 bagging 那样产生并行性。这是因为模型是顺序构建的。因此，它无法并行化。序列中分类器呈现的误差被视为分类困难的实例。该框架的创建方式使得模型出现在序列的后部，或者由第一个预测器产生错误预测并尝试改进它们。通常，使用弱分类器进行提升，例如使用决策桩（decision\
  \ stump），它使用单个分裂节点和两个叶子节点来描述决策树。\n\n## 精通 Bagging 方法\n\n集成方法属于基于委员会的学习家族。如果我们能成功地在数据集中引入变异，将导致模型产生细微差异。你利用自助法（bootstrapping）为这些模型提供数据集内部的变异。自助法是对特定数据集进行特定次数随机采样的方法，可以放回也可以不放回。对于\
  \ bagging，你需要利用自助法来生成。例如，假设 `m` 有不同的数据集，我们为每个数据集创建一个模型。最后，你利用所有模型的输出在回归问题中产生最终预测。例如，你对数据\
  \ `m` 进行 `m` 次自助；你将得到 `m` 个模型，即 `y`，最终预测将包括：\n\n![](img/Image0079.jpg)\n\n对于分类问题，最终结果取决于投票。因此，你的集成中有一百个模型，并且你面临一个使用类别标签\
  \ `{+1, -}` 的二分类问题。假设有超过 50 个模型预测输出为 `+1`，你需要将预测声明为 `+1`。随机化是一种在模型创建练习中应用变异的独特方法。一个示例是为集成中的每个模型随机定义一组属性。另一个示例为集成中的每个模型选择一个随机属性子集。这样，不同的模型将由不同的属性组成。这种方法被称为随机子空间方法（random\
  \ subspace method）。\n\n当你应用稳定模型时，bagging 可能无法获得巨大的成果。如果底层分类器对数据的微小变化也非常敏感，那么 bagging\
  \ 就是很重要的。例如，决策树是不稳定的。未剪枝的决策树是 bagging 的最佳选择。然而，你需要考虑最近邻分类器（Nearest Neighbor Classifier）。`K`\
  \ 是一个稳定模型。但你仍然可以利用随机子空间，为最近邻方法引入一些不稳定性。\n\n在接下来的步骤中，你将实现如何在 K-最近邻（K-NN）算法上利用 bagging\
  \ 和随机子空间。你获得一个分类问题，最终预测将取决于多数投票。\n\n### 如何实现\n\n1. 导入相关库，并编写函数 `get_data()` 来生成用于工作的数据集。\n\
  2. 接着定义三个函数：\n   - `build_single_model` 使用提供的数据构建一个简单的 `KNearest` 邻域模型。\n   - `build_bagging_model`，此函数实现了\
  \ Bagging 例程。\n   - `view_model` 用于检查你开发的模型。\n3. 最后，你将编写 `main` 函数，它将调用剩余的函数。\n\n\
  \n\n\n\n# 结论\n\n其实，你不需要精通 `Python` 就能在 `Python` 中进行数据分析。你只需要掌握五个 Python 库，就能有效地为各种数据分析问题找到解决方案。因此，你需要一个一个地开始学习这些库。请记住，为了高效地进行数据分析，你不必成为成为用\
  \ `Python` 构建优秀软件的专家。在继续进行之前，请确保你已经搭建好了编程环境，并学会了如何使用 `Iython` notebook。然后，你就可以开始学习\
