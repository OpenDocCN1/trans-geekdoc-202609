  \ 的距离较短。现在数据点已分配到正确的聚类，下一步应该是计算新的质心值。例如，对于 `C1`，我们分配了两个数据点：`(5,3)` 和 `(24,10)`，`x`\
  \ 的新值将 `x = (5 + 24) / 2 = 14.5`。`y` 的新值将 `y = (3 + 10) / 2 = 6.5`。`c1` 的新质心值将是\
  \ `(14.5, 6.5)`。整个过程重复，直到质心值不再更新。\n\n## 创建聚类\n\n我们已经看到可以从数据点形成两个聚类，因此 `K` 的值现在是\
