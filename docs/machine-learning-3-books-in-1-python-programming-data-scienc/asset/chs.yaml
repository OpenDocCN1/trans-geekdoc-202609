  \ Python 编程以及在此过程中通过一些简单编码能做些什么时，请务必通读本指南并学习如何开始。\n\n\n从零开始掌握数据分析，使用业务分析工具和针对初学者的分步技术。机器学习与应用人工智能的未来。\n\
  \n## 引言\n\nPython 和数据科学是你随处都能听到的两个最流行的技术术语。这两个术语的结合将为你在当今科技时代提供额外的优势。正如每年证明的那样，Python\
  \ 的应用和意义每天都在扩大，特别是在数据科学社区和数据分析领域。在本书书中，我们将指导你如何开始：\n\n### 为什么要继续读？\n\n- 你将学习如何应用数据分析，这比使用\
  \ Microsoft Excel 更酷、更高级。\n- 其次，你还将学习如何实现 Python 数据分析，并培养专家数据分析师的思维。\n- 最重要的一是，你将学习机器学习和\
  \ Python，以及它们如何在现实世界的问题中运作。\n\n你将看到几个示例，展示数据分析师的现代方法如何适用于解决现代问题。这至关重要，因为大量数据为我们提供了许多获得洞察并在任何领域产生有用影响的机会。这种现象也带来了新的挑战，需要新的技术和方法。此外，这需要新的技能和思维来成功解决问题，并成功挖掘可用机会的最大潜力。\n\
  \n本书将为你提供一个坚实的基础，以便使用 Python 进到复杂的数据分析。Python 是数据分析中最常用的工具之一。在 *Analytics India\
  \ Magazine* 杂志进行的一项调查中发现，44% 的数据科学家倾向于使用 `Python` 而非 `SQL`、`SAS` 和 `R`。不仅如此，`Python`\
  \ 还是你唯一可以依靠的最优秀通用编程语言。\n\n由于你将学习完成数据科学项目所需的 `Python` 关键技术技能，你应该关注实践。开始从各种来源搜索数据并开始尝试它们。强烈建议你尽可能进行许多操作，以便熟悉不同的方法。Python\
  \ 编程语言对于任何数据科学家来说都是极佳的工具，因为它提供了有效的库，内载了分析所需的算法和模型工具。\n\n\n\n\n\n\n通过检查、清洗、转换和建模数据，旨在寻找相关信息并得出结论以改进决策过程，这种行为被称为数据分析。数据分析有不同的维度和技术。统计学中的数据分析可分为探索性数据分析、确认性数据分析和描述性统计。数据需要进行清洗。数据清洗是修复异常值和其他不准确、不必要的信息的程序。根据待清洗数据的类型，有不同的数据清洗过程可以使用。商业智能探索高度依赖聚合、切片、去聚合、切分并专注于业务信息的数据分析。预测分析是指使用统计模型进行预测性预报。文本分析描述了应用统计模型、结构化模型和语言模型从文本中提取并分类信息。这些都描述了数据分析的不同种类。\n\
  \n## 用于科学数据的 Python\n\n### 为什么选择 Python\nPython 是一种简单、清晰且丰富的编程语言。这就是许多科学家和工程师选择\
  \ Python 实现许多应用程序的原因。也许他们更倾向于快速处理主任务，而不是花费数百小时去精通一种“复杂”编程语言的细微差别。这让科学家、工程师、研究人员和分析师能够更快地投入到项目中。结果是他们用最少的时间和资源获得重要的洞察。这并不意味着\
  \ Python 是完成数据分析和机器学习的最合适且完美的编程语言。如 `R` 等语言可能具有 Python 不具备的优势和特性。然而，Python 是一个很好的起点，如果你在未来的项目中使用它，你可能会获得数据分析的正确知识。\n\
  \n### Python 对比 R\n你可能已经在 Reddit、Stack Overflow 以及其他论坛和网站上遇到过。你可能也搜索过其他编程语言，因为即使学习\
  \ Python 或 `R` 都需要几周或几个月。这是一项巨大的时间投入，你不希望犯任何错误。为了避免任何混淆，只需从 Python 开始，因为通常的技能和概念很容易转移到其他语言。在某些情况下，你可能需要采用一种全新的思维方式。但总而言之，理解如何在数据分析中应用\
  \ Python 将为你提供一个解决许多复杂问题的通道。有些人可能会说 `R` 是为统计学家设计的，特别是在具有易用且更好的数据可视化属性方面。它也很容易，特别是如果你计划用它进行数据分析的话。相反，Python\
  \ 比较灵活，因为它的超越了数据分析。大多数数据科学家和机器学习从业者可能选择了 Python，因为他们写的代码可以集成到动态的实时 Web 应用程序中。虽然对此存在争议，但\
  \ Python 仍然是初学者或任何想要开始数据分析和机器学习的人的 Great 选择。它很容易学习，如果你发现这非常适合你，你可以投入全职编程。\n\n##\
  \ 数据分析的广泛应用\n有很多包和工具能够实现在数据分析和机器学习中使用 Python。其中一些包包含 `Numpy`、`scikit-learn` 和 `Pandas`。这些工具简化了数据分析过程。此外，大学毕业生可以投身数据科学，因为现在大多数大学都提供以\
  \ Python 为主要编程语言的计算机科学入门课程。从计算机编程到软件开发的转变发生得非常快，因为许多人已经有了正确的基础来开始学习和使用编程来解决现实世界的数据问题。Python\
  \ 流行的另一个原因是有很多资源告诉你如何完成任何事情。如果你有任何问题，是因为别人请求过，并且另一个人为你解决了。在线资源使得 Python 更加流行。\n\n\
  ### 清晰性由于易于学习和 Python 语法的清晰，专家可以专注于项目和问题的关键特征。例如，他们可以使用 `Numpy`、`TensorFlow` 和 `scikit-learn`\
  \ 来获取洞察，而不是从头开始构建一切。这产生了另一个层次的清晰性，因为专业人员可以专注于问题的本质及其影响。他们还可以提出处理问题的有效方法，而不是被给定编程语言带来的的许多挑战所困扰。主要目标应该始终放在挑战以及它可能带来的机会上。这只需要一次突破就能改变对给定问题的整个思考，而\
  \ Python 可以由于其易用性和清晰性实现。\n\n## 数据分析的类型\n\n### 描述性分析\n数据科学与信息检索和数据收集方法有关，旨在重建过去的事件以确定模式并识别洞察，从而帮助确定发生了什么以及为什么发生。例如，通过查看按区域销售额来识别客户偏好。这部分要求你对统计学和数据可视化方法熟悉。\n\
  \n### 预测性分析\n数据科学是确定某些事件正在发生或未来将发生的概率的手段。在以下案例中，数据科学家考虑过去的数据来确定解释变量，并创建可以使用其他数据点的统计模型。例如，尝试实时预测某信用卡交易是否为欺诈的概率。这部分通常与机器学习领域相关。\n\
  \n### 规范性分析\n在这种情况下，数据分析被视为一种做出明智决策（或可能是数据驱动决策的方法。重点应该是寻找多个选项并应用模拟方法优化结果。例如，以降低运营成本为目标实现供应链的最大化。通常，描述性数据科学旨在解决“数据告诉我什么”的问题。另一方面，预测性分析回答“为什么数据是这样”的问题，而规范性分析回答“如何优化数据以实现给定目标”的问题。\n\
  \n## 为什么数据分析正在兴起\n有很多因素导致了数据科学的兴起。首先，收集的数据量指数级增长。根据 IBM Marketing Cloud 的某研究，每天产生\
  \ 2.5 万亿字节。这是大约 25 亿字节，但只有一小部分数据被分析，留下了许多机会。其次，我们正在经历一场几年前开始的认知革命。几乎每个行业都在追求 AI\
  \ 技术，它包含了自然语言处理 (`NLP`) 和机器学习。虽然这些领域已经存在一段时间，但它们最近获得了关注，以至于成为大学的热门课程。现在很清楚，如果想要生存，公司需要更加敏捷、移动更快并转向数字化业务，随着决策时间的缩短，它们必须完全驱动。如果你再加上\
  \ AI 算法需要高质量数据的事实，你就可以理解数据科学家所起的关键角色。另一个原因是随着云技术的发展和平台即服务 (`PaaS`) 的兴起，访问计算引擎和存储变得以前所未有的简单。运行大数据工作负载现在对于较小组织或任何拥有信用卡的人都是可能的。反，这推动了各个领域的创新。由于上述原因，毫无疑问数据科学与我们在一起，它的发展将持续很长时间。\n\
  \n### 数据科学过程总结\n遵循结构化的数据科学方法可以帮助你以最低成本增加数据科学项目成功的概率。它还让团队形式处理项目成为可能，每个团队成员都专注于他们最擅长的领域。然而，这种程序可能对所有项目类型都有帮助，也不是实施正确数据科学的唯一手段。典型的数据科学程序包含六个步骤，你将在这些步骤中迭代。以下是对每个步骤的简要介绍。\n\
  \n\n\n\n\n1. 第一步是设定研究目标。这里的重点是确保所有利益相关者都了解项目的做什么、如何做以及为什么做。\n\n2. 下一步是数据检索。你需要准备好用于分析的数据，因此后续步骤涉及搜索最佳数据并从数据所有者处获取数据。结果是，原始数据在使用之前可能需要进行润色和转换。\n\
  \n3. 一旦你获得了原始数据，下一步就是准备数据。这涉及到将数据从原始类型转换为可以直接在模型中使用的数据。为了实现这一点，你将识别并修正数据中的各种错误，整合来自各种来源的数据并对其进行更改。如果你成功完成了这一步，就可以进入数据可视化和建模。\n\
  \n4. 第四步是数据探索。这一步的目的是对数据进行深度理解。你将根据视觉和描述性技术搜索模式、偏差和相关性。从这一步中获得的洞察将允许你开始建模。\n\n5.\
  \ 最后，你将进入最有趣的部分，那就是数据建模。这是你尝试实现项目章程中概述的洞察或预测的时候。现在是使用“大杀器”的时候了，但记住，研究告诉我们，简单模型的组合往往优过一个复杂模型。如果你已经完成了这一阶段，你就快结束了。\n\
  \n6. 数据科学模型的最后一步是结果展示和分析自动化。一个项目的重点之一是改变流程或做出更好的决策。你可能仍然需要说服业务部门你的发现实际上会按要求改变业务流程。这是你发挥影响力之处。后续步骤的重要性在战略和战术层面上显而易见。有些项目需要你反复完成业务流程，因此，项目自动化可以节省时间。\n\
  \n现实是，这不是一个简单的过程。在大多数情况下，你会在各个阶段之间反复回归和迭代。遵循上述六步可以获得更高的项目成功率和增强的研究结果效果。这一过程帮助你在开始查看数据之前获得一个定义清晰的研究计划、对业务问题的深刻理解以及清晰的交付物。前几个步骤允许你专注于为你的模型获取高质量的数据输入。这样一来，你的模型在后期阶段就会表现良好。坚持结构化方法的另一个优势是，在寻找最佳模型时，你会在原型模型上进行更多工作。在创建原型时，你可能会尝试多个模型，而不会过度关注程序速度或编写代码标准等问题。这使你能够专注于产生业务价值。并不是每个项目都是由业务部门创建的。分析时获得的洞察或新数据的到来可以产生新项目。当数据科学团队提出想法时，已经进行了工作来提交建议并确定业务赞助商。将项目分为更小的阶段将使员工能够团队共同工作。要在所有领域都是专家是不可能的。你不需要学习如何将所有数据上传到所有各种数据库，确定一个不仅适用于你的应用程序也适用于公司其他项目的最佳数据方案，然后监控所有的统计和数据挖掘技术。\n\
  \n### 前提与提醒\n到目前，你需要熟悉 `Python` 语法以及其他基础知识。你需要的一些基础知识包括 `functions`、`variables`、`loops`\
  \ 和 `lists`。你不需要成为专家，但拥有正确的知识很重要，这样剩下的部分就会变得顺畅。编程围绕着告诉计算机应该做什么。然后计算机应该能够理解并成功执行你的指令。你可能只需要编写几行代码来适应你的应用程序。此外，你在\
  \ `Python` 中用于数据分析实现的许多内容已经为你构建好了。所以，你可能只需要复制并运行代码。但记住，掌握 `Python` 编程仍然很重要。这将带给你信心，因为你理解了事物是如何运行的。\n\
  \n### 你需要一些数学知识吗？\n数据分析意味着与数字打交道并从中挖掘有用的洞察。但你真的需要成为数字和数学的专家吗？使用 `Python` 进行成功的数据分析始终要求数学、编程以及你所在领域具有高水平的技能和知识。这意味着你不需要成为任何一个领域的专家。不要让很多专家欺骗你，因为他们中的许多是虚假的或只是缺乏经验。你真正需要知道的是下一步要做什么，以便能够成功完成项目。在读完这里的所有章节后，你不会成为任何方面的专家，但这足够为你提供更多关于\
  \ `Python` 和数据分析的知识了。当我们考虑数学专业知识时，可能你熟悉 `mean`、`standard deviation` 和其他统计中的常见术语是正确的。在进一步深入数据分析时，你可能会遇到\
  \ `calculus` 和 `linear algebra`。如果你有时间和兴趣去探索它们，你可以随时这样做，或者以后做。这可能可能或不会为你正在工作的特定数据分析项目提供优势。再次记住，核心在于解决问题。主要重点应该放在如何应对挑战并成功克服它上。这适用于商业和科学的所有领域。不要让神话分散你的注意力。专注于关键概念，你就会没问题的。\n\
  \n\n\n\n\n# 第 2 章：Python 复习\n\n在本章中，我们将介绍 Python 编程语言的基础知识。本章将尝试向你简要介绍 Python。它更像是一份备忘清单（cheatsheet），因此只会提醒你一些基础特征以帮助入门。通常情况下，如果你真的想精通一种语言，你需要投入时间并进行一段时间的编程。本章假设你已经熟悉\
  \ Python 编程，因此将跳过大多数非语言特定的内容。我们会指出重要的关键词，以便你能够轻松发现它们。我们将重点关注 Python 3，因为那才是你需要使用的版本。我们为你提供的所有示例都是用\
  \ Python 3 编写的。\n\n## 特性\n\n首先，Python 是一种强类型语言。\n\n### 获取帮助\nPython 中的帮助通常可以在解释器中获得。如果你想了解一个对象是如何操作的，你只需要调用\
  \ `help(<object>)` 即可！此外，最重要的的是 `dir()`（它显示对象的所有方法）和 `<object>._doc__`（它显示所有的文档字符串）。让我们先在这里设定一些预期，以便你知道自己的目标。这也是为了介绍\
  \ Python、数据分析、数据科学和机器学习的局限性（以及主要区别）。让我们开始吧。\n\n## 数据分析 vs 数据科学 vs 机器学习\n\n数据分析和数据科学几乎是相同的，因为它们拥有共同的目标，即从数据中得出洞察并将其用于做出更好的决策。通常，数据分析与使用\
  \ Microsoft Excel 和其他工具总结数据并发现模式相关联。另一方面，数据科学通常与使用编程处理海量数据集相关。事实上，数据科学的流行源于在线来源（搜索引擎、社交媒体）产生的\
  \ GB 级数据。成为一名数据科学家听起来比成为一名数据分析师酷得多。尽管工作功能可能相似且重叠，但它们都涉及从数据中发现模式并产生洞察。它还涉及对数据的本质提出智能性问题（例如：数据点是否形成了有机聚类？年龄和癌症之间真的有联系吗？）。\n\
  \n机器学习又是什么？通常，数据科学和机器学习这两个术语被互换使用。这是因为后者关于“从数据中学习”。在应用机器学习算法时，计算机会检测模式并将“它学到的内容”应用于新数据。例如，我们想知道某人是否会还债。幸运的是，我们有一个关于不同人的大型数据集，记录了他们是还了债务还是未还。我们还收集了其他数据（创建用户画像），如年龄、收入范围、位置和职业。当我们应用适当机器学习算法时，计算机将从数据中学习。然后我们可以输入新数据（来自新申请人的新信息），计算机学到的内容将被应用于这些新数据。我们随后可能会创建一个简单的程序，根据一个人的信息（年龄、收入范围、位置和职业）立即评估该人是否会还债。这是一个使用数据预测他人可能行为的示例。\n\
  \n### 可能性\n从数据中学习开启了许多可能性，特别是在预测和优化方面。得益于海量数据集和强大的计算机处理能力，这已成为现实。我们现在可以使用计算机或云能力在一天内处理\
  \ GB 级的数据。尽管数据科学和机器学习算法远非完美，但它们在图像识别、产品推荐、搜索引擎排名和医学诊断等许多应用中已经非常有用。到目前，全球的科学家和工程师继续改进他们的工具、模型和分析的准确性和性能。\n\
  \n### 数据分析与机器学习的缺点\n你可能从新闻和在线文章中读到，机器学习和高级数据分析可以改变社会结构（自动化、工作流失、全民基本收入、人工智能接管）。事实上，社会正在发生变化。在幕后，机器学习和持续的数据分析正在发挥作用，特别是在搜索引擎、社交媒体和电子商务领域。机器学习现在让以下操作变得更容易、更快速：\n\
  \n* 图片中有人脸吗？\n* 用户会点击广告吗？（对他来说个性化且有吸引力吗？）\n* 如何为 YouTube 视频创建准确的字幕？（识别语音并翻译成文本）\n\
  * 引擎或组件会故障吗？（制造业中的预防性维护）\n* 交易是欺诈吗？\n* 邮件是垃圾邮件吗？\n\n这些实现取决于海量数据集和强大的处理能力。\n\n##\
  \ 准确率与性能\n\n# 第 3 章：重要的 Python 库\n\n你可以在 xmind.net 获取描述用于分析数据的软件思维导图。然而，你无法在本章中安装所有的软件。本章将探索如何安装\
  \ `SciPy`、`matplotlib`、`NumPy` 和 `IPython`。你还将看到使用 `NumPy` 的示例代码。`NumPy` 是一个强大的\
  \ Python 库，以数值数组和函数为特征。`SciPy` 是一个强大的 Python 库，与 `NumPy` 有重叠。`matplotlib` 提供了一个包含\
  \ `NumPy` 的绘图库。你将在数据可视化期间学习更多关于 `matplotlib` 的知识。`IPython` 包含交互式计算架构。后续项目最重要的部分是\
  \ `IPython` shell。你将在下一章学习更多关于 `IPython` shell。其他软件的安装说明将在书中其余提供。当你读完本章后，你将识别出在遇到困难或不确定解决问题的正确方法时，如何确定额外信息的指针。\n\
  \n## 安装软件与设置\n\n你将学习如何在 Linux、Windows 和 Mac OS X 上安装和设置 `NumPy`、`matplotlib` 和 `IPython`。让我们详细探讨这一过程。\n\
  \n### Windows\n\n\n\n\n\n1. 从 SourceForge 网站或任何其他合法网站获取 Windows 安装程序。当前版本可能会发生变化，只需选择最适合你设置的一个即可。\n\
  2. 从可用列表中选择正确的版本。\n3. 接下来，双击打开 `EXE` 安装程序。\n4. 接下来，你将看到 Numpy 及其属性的描述。现在点击 `Next`\
  \ 按钮。\n\n## Numpy 数组\n\n一旦你完成了 Numpy 的安装，现在是探索 Numpy 数组了。在数值运算方面，Numpy 数组比 Python\
  \ 列表更高效。Numpy 数组是经过广泛优化的特殊对象。与相应的 Python 代码相比，Numpy 代码所需的显式循环更少。如果我们回想一下高中学过的一些数学主题，我相信你一定能记得标量和向量。例如，数字\
  \ `2` 是一个标量。当你给 `2` 加上 `3` 时，你正在进行标量加法。我们可以由一组标量创建一个向量。在 Python 编程中，你将拥有一个维数组。这个概念仍然可以扩展到维度。对两个数组进行操作（如加法）可以简化为一组标量计算。总而言之，Numpy\
  \ 比纯 Python 代码更快。有一点是明确的，无论你是否使用 NumPy，都能获得相同的结果。但显示的结果呈现方式不同。记住，`Numpysum()` 函数的结果没有很多逗号。这是因为你处理的不是\
  \ Python 列表，而是 NumPy 数组。\n\n## 使用 IPython 作为 Shell\n\n数据分析师、工程师和科学家喜欢进行实验。IPython\
  \ 是科学家们为了实验目标而构建的。IPython 提供的交互式环境被许多人认为是 MATLAB 的直接解决方案。以下是 IPython Shell 的属性列表：\n\
  \n*   历史机制\n*   `pylab` 切换\n*   制表补全，可以帮你识别命令\n*   访问 Python 调试器和性能分析器\n\n## 使用\
  \ Python 库进行网络爬虫\n\n在本节中，你将爬取“Rate My Professor”网站。Rate My Professor 网站的简要描述：这是一个包含学校、教授和大学评分的网站。在这个网站上，你可以在注册课程之前搜索任何教授或学校并查看他们的评分。这是一个非常棒的功能，可以帮你更多地了解你想加入的教授或大学。在本节中，你将学习如何爬取并提取关键的教授标签。虽然这不是非法过程，但从该网站大量爬取数据可能会导致你的\
  \ IP 地址被列黑。因此，你应该只尝试一两次，不要愚蠢地这样做。\n\n### 网络爬虫\n\n网络爬虫也称为采集、数据收获或数据提取，是一种用于从网站挖掘数据的机制。在某些情况下，当你直接从网上获取要搜索的数据时，网络爬虫可能是关重要的；但有时，这也是处理数据的一种糟糕方法，因为就像未经许可从网站偷取昂贵的数据。然而，你应该将爬取过程减少到一次或两次，以免陷入麻烦。网络爬虫最重要的库包括：\n\
  \n1. Beautiful soup\n2. Requests\n\n以下是我们将遵循的步骤：\n\n1. 首先，导入相关库\n2. 找到 URL 并将其存储在变量中\n\
  3. 使用库向网站发送请求\n4. 应用 Beautiful Soup 库从网站获取 HTML 数据\n5. 使用 `findAll` 方法找到你正在搜索的特定标签\n\
  6. 移除所有 HTML 标签并转换为纯文本格式\n\n...因此，你就得到了你寻找上述信息。你得到了教授的所有标签。这就是如何使用 `Requests` 和\
  \ `Beautiful Soup` 库从互联网爬取数据。总而言之，Python 有三个核心数据科学库，许多其他库都是基于构建的：\n\n*   Numpy\n\
  *   SciPy\n*   Matplotlib\n\n\n\n\n为了简单起见，你可以将 `Numpy` 视为处理数组的一站式工具。Numpy 数组与典型的\
  \ Python 列表有许多不同之处，但需要记住的几点是：它们速度更快、占用空间更少，且功能更多。然而，重要的是，这些数组具有固定的大小和类型，这些是在创建时就定义的。它不能像列表那样无限地追加新值。`SciPy`\
  \ 构建在 `Numpy` 之上，提供了许多你需要的优化、线性代数和统计函数。尽管有时 `Numpy` 也具有类似的功能，但 `SciPy` 的功能更好。如果你想计算相关系数或生成一些正态分布的数据，那么\
  \ `SciPy` 就是适合你的库。\n\n### Matplotlib 这可能不会获得任何美学奖，但它是 Python 中主要的绘图库。它拥有大量功能，并让你在需要时拥有巨大的控制力。\n\
