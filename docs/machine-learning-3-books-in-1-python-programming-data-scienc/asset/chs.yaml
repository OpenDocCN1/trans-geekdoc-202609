  \ `K` 的值。注意，`K` 没有特定的值，它是在测试和评估后选择的。然而，在大多数 KNN 应用中，值 5 是最常用的。\n\n我们随后可以使用测试数据进行预测：\n\
  \n```python\npred_y = knn_classifier.predict(X_test)\n```\n\n## 评估准确率\n\nKNN 算法的评估方式与线性回归算法评估准确率的方式不同。我们需要使用诸如\
  \ `RMSE`、`MAE` 等指标来评估它。在这种情况下，我们将使用混淆矩阵（confusion matrix）、精确率（precision）、召回率（recall）和\
  \ f1 分数。\n\n我们可以从 Scikit-Learn 库导入这些方法：\n\n```python\nfrom sklearn.metrics import\
