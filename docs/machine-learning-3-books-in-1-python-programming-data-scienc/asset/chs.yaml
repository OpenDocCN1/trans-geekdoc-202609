  \n上面的结果显示 KNN 算法运行良好。结果显示算法在数据集上的平均准确率约为 90%。\n\n## 均值聚类\n\n让我们手动演示该算法在 Scikit-Learn\
  \ 中如何工作。假设我们有如下 `D` 的二维数据实例：![](img/Image0060.jpg) 我们的目标根据数据点之间的相似性对数据进行分类。我们首先应该随机初始化两个聚类的质心值，并分别命名为\
  \ `c1` 和 `c2`，其值为 `(5,3)` 和 `(10,5)`。此之后开始迭代。每当计算欧几里距离时，数据点都应该分配给最近的质心。让我们以数据点 `(5,3)`\
