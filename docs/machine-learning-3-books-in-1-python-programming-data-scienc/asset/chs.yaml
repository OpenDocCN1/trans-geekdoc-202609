  1. 平均绝对误差（MAE）。\n2. 均方误差（MSE）。\n3. 均方根误差（RMSE）。\n\n\n\n\n\n# 第 10 章：K 近邻算法\n\nKNN\
  \ 算法被广泛用于构建更复杂的分类器。它是一个简单的算法，但它的性能优于许多强大的分类器。这就是为什么它被应用于许多领域：数据压缩、经济预测和遗传学。KNN 是一种监督学习算法，这意味着我们被给定一个由训练观测值\
  \ `(x, y)` 组成的标记数据集，我们的目标是确定 `x` 和 `y` 之间的关系。这意味着我们应该找到一个将 `x` 映射到 `y` 的函数，使得当我们给定\
  \ `x` 的输入值时，能够预测出对应的 `y` 值。\n\nKNN 算法背后的概念非常简单。我们将使用一个名为 `Iris` 的数据集。我们之前已经探索过它。现在我们将用它来演示如何实现\
  \ KNN 算法。首先，导入所有需要的库：![k-nearest](img/Image00056.jpg)\n\n## 分割数据集\n\n我们需要能够评估算法的性能。这将在测试阶段完成。这意味着我们应该有训练数据和测试数据。数据集应该被分为两部分。\n\
  \n我们需要将数据分为两部分。80% 的数据将用作训练集，而 20% 将用作测试集。让我们先从 `Scikit-Learn` 导入 `train_test_split`\
