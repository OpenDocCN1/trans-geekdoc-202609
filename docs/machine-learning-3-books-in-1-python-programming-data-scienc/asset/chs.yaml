  \n\n\n\n\n# 第 11 章：数据分析的一些最佳 Python 算法\n\n在本指南中，我们花了一些时间研究了 Python 语言的基础知识，以及数据分析的基础，以及我们如何利用这些基础来满足我们自己的需求。现在，是时候将这两个想法结合起来了。首先，为了完成良好的数据分析，我们能够通过许多算法运行我们收集到的数据，通常是几个算法，尽管在某些情况下，一个就足够了。\n\
  \n这些算法将帮助我们学习从数据中发现哪些模式和见解，并最终为我们提供一些良好的预测。在过程中，我们可以使用许多不同的 Python 数据分析算法，这通常取决于我们最初想对这些数据做什么，以及我们如何从中从中获益。着此考虑，让我们直接深入学习这些算法的一些基础知识，并进一步了解关于为什么\
  \ Python 算法是数据分析最佳选择的内容。\n\n## 神经网络\n\n我们能够用于数据分析的第一种 Python 算法被称为神经网络。起初，这是一种相当复杂的算法，但它将为你提供完成某些工作所需的大量动力和更多功能。\n\
  \n神经网络的工作方式类似于大脑的功能。它会对处理正确的内容建立连接，并可以记住这些内容以备将来使用。这有助于它随着时间的推移不断学习，并让它需要完成的某些工作变得更容易、更快、更高效。一旦它能够处理并学习新东西，你会发现它在将来会记住它。\n\
  \n此外，神经网络非常擅长帮助识别图像内容等任务。它通过逐层处理图片的不同部分，然后对图像中将发现的内容做出良好的预测。它能够通过的层越多，猜测图片中内容的准确性就越高。这使其成为你你正在处理的许多项目中的有效工具。\n\
  \n然而，我们必须记住，这种算法的计算成本会高一些。由于我们处理的是一种能够有条理地遍历许多层并做出准确预测的算法，我们可以预见到为什么成本会更高。你必须预先确定这是否适合你工作的流程类型，或者其他的算法是否效果更好。\n\
  \n### 聚类\n\n在处理数据分析时，你可以使用许多不同的聚类技术。这些算法都会获取数据，并将它们归入不同的簇中，这样你就可以看到更多关于数据点分布的情况。处理聚类的方法有多种，对数据进行聚类的方式也有多种，但它是将信息分组并立即获得一些良好见解的好方法。\n\
  \n你在工作中拥有的簇数量取决于你关注的重点。例如，如果你正在努力将小组分为男性和女性，那么你只需要两个簇。但如果你想按客户的年龄、或者根据他们居住的国家或世界地区来划分，那么你可能需要比两个更多的簇，以便对当前情况有最佳的了解。\n\
  \n通过这些簇，你可以将它们绘制在散点图之类的图表中，然后确定所有内容将落在哪里。这是确定最佳方案的极佳方法，无论是否有一个需要处理的新的人口统计等等。你只需要将这些簇放在散点图上，就可以在短时间内学到大量信息。\n\
  \n这些簇的想法非常简单。当你有一些落入同一个簇中的数据点时，你可以安全地假设这些点之间具有某些相似性。但如果数据点不在同一个簇中，那么这说明它们之间将是不同的。如果我们记住这一点，我们我们理解这类算法就会变得容易得多。\n\
  \n## 支持向量机\n\n这些是你用来确定采取正确行动方案的算法。当你看到直线和超平面（hyperplane）汇合时，这说明那里的信息将引导你找到正在寻找的结果。只要你知道帮助你获得最佳结果的正确步骤，这就能做出正确的决策变得更容易。\n\
  \n这种算法有时最大的技巧是确定我们应该选择和处理哪些直线和超平面。有时，取决于你正在处理的数据类型及其包含的内容，你最终会得到多个超平面。有时这并不是大问题，因为你可以看到哪一个最符合你的需求。在其他时候，似乎有多个最符合你需求的答案。\n\
  \n我们有许多选项可以尝试，以便为我们想要做选择正确的 `SVM`。你将通过经验学习更多此类方法，但你也可以通过了解你的数据来想出结果。有时，尝试其中的几个以查看哪一个是最好的，也是我们可以选择的另一个良好方案。\n\
  \n## 朴素贝叶斯\n\n当你想在开始时对数据进行一些探索时，`Naïve Bayes` 算法是一个很好的选择。也许你想看看划分现有数据的最佳方式是什么，或者你还不确定哪种算法最适合你关注。在某些情况下，你可能需要在收集数据后立即向那些想了解发生情况但可能不理解其中所有技术细节的人展示你拥的一些数据和信息。这就是\
  \ `Naïve Bayes`（朴素贝叶斯）算法大显用场的地方，它可以真正帮助我们。\n\n通过这个选项，我们能够对现有的数据进行良好的探索，然后确定之后采取的最佳步骤。有时这帮助我们选择其他算法中哪些是最适合我们的。在其他情况下，它可能是我们创建一个初级模型的好方法。\n\
  \n## 决策树\n\n这里我们还可以使用的另一种选项是决策树。这些树将帮助我们在不确定采取哪些步骤时做出决策，特别是当你有很多选择可选时，决策树将是最佳算法之一。在开始，你需要对它进行清洗和整理，但我们假设这部分已经完成了。当你准备好时，数据可以告诉我们哪些是最佳的，以及你每个选择的可能结果。这有助于你做出更好的决策，因为你可以以更清晰、更有组织的方式查看数据。\n\
  \n此外，你可以将许多决策树组合成随机森林。`random forest` 简单就是我们将许多决策树组合在一起，以便比较多个选项。也许你想看看哪一个最适合你。如果你一直想比较某一个想法或思考，使用随机森林，即使是简单的决策树，也可以完成这一任务。\n\
