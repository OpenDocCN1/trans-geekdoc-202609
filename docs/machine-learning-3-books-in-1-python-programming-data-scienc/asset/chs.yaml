  ### 安全中的机器学习\n# 结论\n\n\n\n\n\n\n这是一本快速学习 Python 的终极速成课程，为初学者提供了实用的示例和编程语言技巧。适用于数据科学和机器学习的计算机编程。\n\
  \n## 引言\n\n祝贺你购买了《Python 编程》，感谢你的支持。接下来的章节将讨论当你准备学习如何使用 `Python` 编程语言时需要了解的许多不同主题。许多公司和个人都希望学习编程，而\
  \ `Python` 语言将是你可以选择的最佳选项之一。本指南将确保你能够掌握这一过程的一些基础知识，因此无论你想将这些代码用于，都能在短时间内编写出自己的代码。\n\
  \n首先，本指南将介绍 `Python` 自带的一些基础知识。我们将花时间研究使用 `Python` 的优势，以及为什么它是一门如此优秀的编程语言，然后我们将花时间探索如何在各种不同的操作系统上安装这种语言。从那里，我们可以查看代码自带的几个基础部分，包括`objects`（对象）、`comments`（注释）、`keywords`（关键字）、`functions`（函数）等。\n\
  \n现在既然已经完成了一些基础学习，是时候让我们看看在使用这种语言时可以进行的一些编码工作了。学习任何编程知识以及如何实现它的最好方法，是首先需要查看一些代码并对其进行练习。在这里，我们将学习如何处理不同的数据类型、如何使用`functions`（函数）、`Python`\
  \ 语言中`classes`（类）的重要性，以及如何编写我们自己的条件语句。所有这些都将帮助我们在 `Python` 语言的帮助下编写出一些非常棒的代码。\n\n\
  在我们学习了编程世界的这些不同部分之后，是时候看看在学习编程时可以采用的一些技巧和窍门了。无论我们准备得多么充分，总会有事情不按照你的意运行。这些技巧将向你展示当代码运行不符合预期时你可以采取的操作。\n\
  \n本指南的最后部分将花时间研究数据分析的基础知识，以及为什么这是过程中的一个重要部分。许多公司正在加入，寻找如何比以前任何时候都更容易处理数据科学和数据分析。你将能够快速掌握这项工作的好处、为了自己的项目进行数据分析时需要采取的不同步骤，以及在涉及\
  \ `Python` 语言和数据分析时我们可以使用的一些最佳算法。为了掌握 `Python` 语言，我们可以做很多工作，本指南将花时间讨论这个过程中最重要的部分，以便你能够将其用于你所有的业务需求。当你准备好学习更多关于\
  \ `Python 编程` 以及你如何在数据科学或数据分析项目上使用它时，请务必查阅本指南以开始！我们已尽全力确保它包含尽可能多的有用信息；请尽情享受！\n\n\
  \n\n\n\n\n世界上有许多不同的编程语言供我们使用。我们可能会发现，其中某些语言在帮助我们创建网页和在线工作时效果最好。另一些语言则能够处理工作中一些更具技术性的方面，无论我们是在处理数学还是科学问题，它们都能告诉我们关于世界、周围的趋势等许多信息。而且还有一些语言能够帮助初学者进入编程世界。\n\
  \n如果你刚刚开始接触编程的想法，那么学习编程的最佳选择就是使用 `Python` 语言。这门语言简单易学，同时具备了完成编程任务所需的所有功能和威力。这种语言将带有标准库和大量的扩展，以完成工作。随着随着本指南的进行，你很快就会发现为什么这门语言对你来说实际上即使对于初学者也非常容易学习。有很多程序员喜欢使用\
  \ `Python` 语言，并且在他们的编程需求中不会选择其他语言。通过在过程中积累一些知识和实践，你也可以轻松成为其中一员。当你准备好学习更多关于 `Python`\
  \ 语言及其工作原理时，请务必查看本指南的其余部分，看看我们在讨论什么！\n\n## 如何使用 Python\n\n既然我们在这里了，我们需要花些时间来看看 `Python`\
  \ 语言的一些主要用途。许多公司非常愿意学习如何使用 `Python` 语言来处理某些大型计算机任务。你会发现，Python 已经在公司用于良好运行的方法上产生了一些变化，并确保在此过程中底线不会触底。以下是我们能够使用\
  \ `Python` 语言工作的一些不同方式，以便了解这种语言所具有的所有能力。\n\n### 应用开发\n我们使用 `Python` 的第一种方式是帮助开发一些应用程序。这包括软件开发应用、网络编程、游戏、Web\
  \ 应用程序、基于 GUI 的应用程序等。这是由于 Python 能够创建一个交互式界面并且易于开发应用程序。\n\n### 编程范式\nPython 还可以帮助多种编程范式。Python\
  \ 将为我们提供处理这些内容所需的支持。由于它支持面向对象编程（OOP）以及支持结构化编程，Python 还带有许多功能，使其能够支持函数式编程语言的理念等。我们可以使用这门语言来帮助构建动态系统，甚至实现内存的自动管理。我们看到\
  \ Python 拥有一个健壮且相当庞大的库，对于开发你喜欢的任何应用程序都非常有用。与其他语言相比，这也会让开发者更多地依赖 Python。Python 标准库将帮助我们使用可用的各种模块，以便我们完成你想要的任何任务。\n\
  \n### 兼容性与平台支持\n列表上的下一项是，`Python` 语言将兼容许多主流系统和平台。这将使我们更容易完成更多项目，因为无论我们在什么平台或系统上工作，我们都能完成它们。Python\
  \ 具有如此高的兼容性是因为它主要用于开发一些新应用程序。在解释器的帮助下，代码将在正确的平台上运行，并且它拥有支持现有大多数主流操作系统所需的所需的工具。这使得调用\
  \ Python 相关的程序等变得更容易，并且无论你计划用它们做什么，或者它们需要在哪里运行，都能让它们运行起来。\n\n### 数据库\n如果你计划在编码时进行一些数据库方面的工作，那么\
  \ Python 将是帮助这方面工作的良好选择。你会发现 Python 语言将让我们更容易访问我们感兴趣的数据库。Python 将帮助我们自定义大多数常用数据库自带的界面，使我们在此过程中更容易完成我们想要的工作。当然，这些只是你能够使用\
  \ Python 语言工作并在过程中取得一些结果的方法之一。当你准备好处理一些编码时，无论你想从事哪种编码，你都会发现 Python 语言将是最好的选择之一。Python\
  \ 将拥有你正在寻找的所有工具和功能，而且易于使用。这一切结合在一起，确保你能够在这门编程语言的帮助下完成你喜欢的任何项目。\n\n\n\n\n\n\n当你开始学习一种编程语言时，你会发现没有一种语言比\
  \ `Python` 编程语言更好了。当你开始使用 `Python` 时，你将获得许多优势，很快你就能理解为什么它是大多数程序员的首选，并且能够满足他们的各种需求。让我们来看看在使用这种编程语言时你能够获得的一些优势。\n\
  \n## 易于阅读和编写\n第一个优势是，这种语言的设计初衷就是易于阅读和编写。与一些存在已久且更传统的编程语言不同，`Python` 旨在让即使是初学者也能轻松学会使用。无论你过去是否是一名程序员并且在实现这些功能方面拥有一定经验，还是说你第一次尝试任何编码工作，你都会发现\
  \ `Python` 语言是最佳选择。\n\n尽管在学习 `Python` 语言时有一段学习曲线，但你会发现这并不会削弱该语言所具备的功能或能力。`Python`\
  \ 是一门功能强大的语言，它的力量往往比初次探索者想象的要强大得多。\n\n## 扩展与数据分析\n除了你想要进行的某些基础编程（我们将在本指南中进一步探讨这些）之外，`Python`\
  \ 还带有扩展等功能，可以帮助你处理数据分析、数据科学、机器学习等。\n\n## 庞大的社区\n`Python` 拥有的大型社区是另一个你可能会喜欢的额外奖励。这是一个遍布全球的各种类型程序员组成的社区。你可以与从初学者到高级人员的所有进行交流，从第一次开始编写代码的新手到在该领域深耕多年的专业人士。\n\
  \n这对于第一次接触 `Python` 的人来说是一件非常棒的事。这让你能够能够找到许多其他程序员，其中许多人拥有编程经验，他们可以回答你的问题，向你展示如何尝试你想要做的编码新功能，等等。每当你遇到瓶颈或想学习\
  \ `Python` 的新知识时，这个社区都能为你提供帮助。\n\n## 面向对象编程 (OOP)\n`Python` 也被称为 `OOP` 或面向对象编程语言。这对于刚起步的人来说是一个好消息，因为它提供了一种非常良好的逻辑方式来组织你的代码。你会发现，这将让你更容易地将所有的对象（或代码部分）存储到正确的\
  \ `class` 中，在完成工作后，一切都会停留在你离开的地方。当我们稍后对其进行探索时，这会更有意义，但基本上，它在编写代码时会使事情变得更简单。\n\n\
  ## 库与标准库\n这种语言自带的所有库都将非常好用。`Python` 自带的传统或标准库能够承担许多不同的任务，并帮助你完成想要的一些基础编码。\n\n但如果你想做一些更复杂的事情，例如我们在数据分析和机器学习中看到的内容，那么你可能需要为\
  \ `Python` 添加一些插件来实现这些功能。好消息是，`Python` 具备实现这一切所需的能力和扩展。市上有大量的数据科学和机器学习库，与 `Python`\
  \ 编程语言完美匹配。这使得你能够更容易地使用 `Python` 创建你所需的各种代码，无论这些代码是简单还是复杂。\n\n正如我们所见，`Python` 语言包含许多不同的部分，在你编写代码时，理解这些部分是什么以及它们如何协同工作将至关重要。基于此，让我们从基础知识开始，探索使用\
  \ `Python` 语言可以实现的一些酷炫功能。\n\n\n\n\n\n\n现在我们已经有机会简单聊了 Python，以及为什么你可能想选择这种编程语言而不是其他其他语言的一些原因，现在是时候开始正工了。在我们着手开始一些需要完成的编码之前，我们首先需要花一些时间学习在你的系统上安装\
  \ Python 的正确步骤。好消息是，正如我们在上一章中提到的，Python 能够运行于你想要关注的任何操作系统或平台上。这是一个好消息，因为它确保了我们可以在不更改系统的情况下学习和使用这门语言，无论我们正在使用的是哪种系统，或者在这个项目中想要使用的哪种系统。\n\
  \n我们在这里首先需要考虑的是我们想使用哪个版本的 Python。这里有几个不同的选项，这将确保我们能够选择最适合你的版本。Python 是一种开源语言，这意味着它是免费安装和使用的，并且可以根据你的需求进行修改。仍然有一个开发团队致力于修复漏洞并进行必要的更新。这对你来说是个好消息，但这意味着你必须弄清楚哪个版本是适合你的。\n\
  \n目前有 Python 2 和 Python 3，每个版本都有一些更新。它们是相似的，但通常取决于你想要使用的功能类型。如果你的电脑已经为你提供了 Python\
  \ 2 版本，那么这就是一个很好的工作版本，如果你不想在这个过程中更新它，也不需要更新。它将和 Python 3 以及我们在本指南中将进行的一些代码非常相似。然而，大多数程序员将使用\
  \ Python 3。这是目前存在的 Python 语言的最新版本，它将拥有你编码所需的某些最佳特性和更多功能。而且在未来的某时候，负责 Python 2 的开发者可能会停止对该版本的支持，因此选择较新的选项将是最好的选择。你可以在网上找到这两个版本的下载以进行全面工作，所以你必须选择哪一个最适合你。你也可以找到可以在所有主流操作系统上运行的这些版本，因此将它们添加到你正在工作的任何系统中应该都不太难。\n\
  \n在这里需要记住的另外一点是，对于我们在下面将查看的编码，以及我们在三个主要操作系统上安装 Python 的各个步骤，我们将从 [www.python.org](http://www.python.org)\
  \ 获取文件。Python 将附带一个编译器、一个文本编辑器和一个 IDE，以及其他一些文件。这些对于确保程序正常运行至关重要，如果缺少了其中任何一个，你将无法运行你想要处理的任何代码。可能还有其他一些第三方网站你可以查看并转下载那些。这是一个选项，取决于你完成\
  \ Python 语言学习后想用它做什么，你可能想这样做。但并不是所有的站点都能提供所需的所有额外内容。你必须逐一下载每个部分，以确保你没有漏掉任何东西。另一方面，当你从\
  \ [www.python.org](http://www.python.org) 提供的链接下载时，你就可以确定你所需的所有文件和部分都在那里。你只需要将它们添加到你正在使用的系统即可。\n\
  \n\n\n\n\n### 3. 可选功能\n在接下来的屏幕上，请确保勾选“可选功能”（Optional Features）下的所有方框，然后点击继续。\n\n\
  ### 4. 高级选项\n当你处于“高级选项”（Advanced Options）部分时，你需要花一点时间确定你想要安装 Python 文件的位置。然后你可以点击“安装”（Install）按钮。这需要几分钟时间才能完成，请耐心等待。安装完成后，你就可以关闭它。\n\
  \n### 5. 配置配置\n完成这一部分后，我们该开始检查并创建系统所需的 `PATH` 变量了。我们希望将其设置好，使其包含之后需要的目录以及所有软件包和其他组件。为了让这一切能够协调工作，我们需要使用的步骤包括：\n\
  \n1.  首先，我们需要打开`Control Panel`（控制面板）。我们可以通过点击任务栏并输入 `Control Panel` 来。然后点击该图标。\n\
  2.  在同一个`Control Panel` 中，搜索`Environment`（环境变量）表格。然后我们可以点击`Edit the System Environment\
  \ Variables`（编辑系统环境变量）按钮。进入该部分后，我们可以点击`Environment Variables`（环境变量）部分。\n3.  在`Environment\
  \ Variables`（环境变量）内部，我们将找到`User Variables`（用户变量）选项卡。在这里有两个选择：编辑你找到的`PATH` 变量，或者创建一个全新的。\n\
  4.  如果你正在使用的系统上还没有`PATH` 变量；那么就是该我们创建自己的变量了。你可以通过点击`New`（新建）按钮，为该 `PATH` 变量命名，然后添加你想要的目录。\n\
  \n现在，就可以点击或关闭所有为 `Control Panel` 弹出的对话框，并进入下一步。\n\n### 6. 在 Windows 上验证\n当你到达这一部分时，你应该能够打开`Command\
  \ Prompt`（命令提示符）。通过开始菜单可以很容易地做到。然后点击`Windows System`，再点击`Command Prompt`。输入单词 `python`。这将帮助我们启动\
  \ Python 解释器并使其为我们准备就绪。\n\n完成上述步骤后（总共只需要几分钟，并不像刚开始时看起来那么糟糕），你就可以在 Windows 系统上使用\
  \ Python 程序了。然后你可以选择打开 Python 解释器以及你需要的任何其他内容，并很快地写出你需要的所有代码。\n\n### 在 Linux 操作系统上安装\
  \ Python\n最后，我们需要花一点时间查看确保我们能在 Linux 操作系统上正确安装 Python 语言所需的步骤。Linux 不像我们在本指南中花时间过的另外两个操作系统那样家喻户晓。但它有许多用途，并且能够为我们提供许多酷炫的功能等。已经有许多程序员在使用这种语言了，未来可能会有更多人使用它，所以当我们准备好在\
  \ Linux 上安装 Python 编程语言时，多了解一些相关知识是一件好事。\n\n我们需要采取的第一步是检查操作系统上是否已经存在 Python 3 版本，或者实际上是任何版本的\
  \ Python。完成这一切的最好方法是打开 Linux 命令提示符，然后输入以下代码以查看我们可以获取什么信息：\n\n```\n$ python3 --version\n\
  ```\n\n如果你使用的是 Ubuntu 16.10 或更高版本，那么安装 Python 3.6 是一个非常简单的过程。你只需要使用以下命令：\n\n```\n\
  $ sudo apt-get update\n$ sudo apt-get install Python3.6\n```\n\n如果你在使用较旧版本的 Ubuntu\
  \ 或其他版本，你可能希望使用 `deadsnakes PPA` 或另一个工具来帮助下载 Python 3.6 版本。执行此操作所需的代码包括：\n\n```\n\
  $ sudo apt-get install software-properties-common\n$ sudo add-apt-repository ppa:deadsnakes/ppa\n\
  # sudo apt-get update\n$ sudo apt-get install python3.6\n```\n\n这里的好消息是，如果你在使用其他\
  \ Linux 发行版，系统上很可能已经安装了 Python 3。如果没有，你可以使用该发行版的包管理器。如果 Python 3 的包不够新，或者不是适合你的版本，你可以按照相同的步骤，根据需要帮助在计算机上安装更新版本的\
  \ Python。\n\n\n\n\n\n# 第 3 章：Python 代码基础\n\n在此时，我们将了解一些 Python 代码的基础知识，以及为什么它对于帮助你完成许多项目如此重要。我们还了解了在计算机上下载和安装这些代码以及所有必要文件所需的步骤。现在，是时候让我们转向\
  \ Python 代码的一些基础部分，以及我们如何利用这些部分来帮助我们处理以后可能需要的更高级的代码了。\n\n## 关键字 (Keywords)\n\n我们需要查看的第一是\
  \ Python 关键字。这些基本上是我们需要预留的单词。当你想要编译器执行某些操作时，这些就是你需要提供给编译器的命令。我们需要确保以正确的方式使用关键字，并确保我们没有在错误的地方使用它们，否则编译器会非常困惑并抛出错误。Python\
  \ 代码中已经存在许多关键字，在我们编写想要通过此程序实现的某些代码时，在正确的位置使用它们是非常重要的。请记住，编译器将这些关键字作为命令来告诉它要做什么。因此，在整个过程中也将它们视为特殊的内容。\n\
  \n## 注释 (Comments)\n\n当我们开始用 Python 语言编写代码时，需要查看第二件事就是处理注释。当你需要在代码中留一些笔记或消息时，这些注释将是非常重要的。当你想要留下这条消息，并想确保它不会干扰或搞乱你编写的任何其他代码时，这非常有帮助。\n\
  \n要在 Python 中实现这一点点，我们只需要在想要使用的任何消息之前添加 `#` 符号即可。你可以根据需要添加任意数量的注释，但你需要确保将其尽可能限制在范围内。这将帮助我们保持代码尽可能的整洁，并使我们不容易因为你正尝试完成的代码而出现问题。这些注释是处理代码并留下你寻找的消息及更多内容的极佳方式。这将让你更容易写出你需要记住的内容，或者在开始之前你想让其他编码员知道的内容，你只需要在你编写的单词前面添加正确的符号即可。\n\
  \n## 变量的重要性 (Importance of Variables)\n\n在处理某些代码时，Python 变量也将非常重要。具体来说，我们需要花时间学习如何为我们正在使用的变量分配值。如果我们不确保给变量分配某种值，那么变量将只是内存中的一块空白。这意味着当我们尝试调取该部分代码时，将无法显示任何内容。如果变量分配了某个值，那么当你运行代码时，它就能以这种方式做出反应。\n\
  \n我们在代码中使用这些变量时，你可能会发现有三个主要的选项可以使用。每种选项都非常有用，这取决于你计划使用的代码类型以及你想分配给该变量的值类型。你能够处理的主要变量包括：\n\
  \n*   **浮点数 (Float)**：这包括像 `3.14` 这样的数字。\n*   **字符串 (String)**：这像是一个语句，你可以在其中写类似“感谢访问我的页面！”或类似的短语。\n\
  *   **整数 (Whole number)**：这将是你使用的任何其他不带小数点的数字。\n\n当我们对这些变量进行操作时，我们必须记住，不需要花时间创建某些声明来保存内存中的这个特定位置。在使用的某些其他编码选项中这是必要的，但在\
  \ Python 中工作时，当你通过 `=` 为变量分配值时，它会自动发生。如果你想确保这种情况会发生，你可以查看是否存在这个 `=`，然后你就知道它将按照你想要的方式运行。\n\
  \n这里的好消息是，为变量分配值非常简单。我们在代码内部实现此点的的一些方法包括：\n\n```\nx = 12 #这是一个整数赋值的示例\npi = 3.14\
  \ #这是一个浮点数赋值的示例\ncustomer_name = \"John Doe\" #这是一个字符串赋值的示例\n```\n\n你在这里可以做的另一个选项是（我们在本章中已经提到一点），一个变量分配了两个或多个值。在编写代码的某些情况下，你需要取两个值并将它们放在同一个变量中。要这样做，你只需要使用我们上面提到的相同程序。只需确保为每个部分添加一个\
  \ `=`，帮助编译器知道这些都与同一个变量相关。因此，你可以写像 `a = b = c = 1` 这样的代码，告诉编译器这些变量都等于一。或者你可以使用 `a\
  \ = b = 2` 表示一个变量有两个值。这里需要记忆的最点是，变量必须被赋值才能在代码中起，而这些变量只是内存中预留的位置。然后，当编译器需要调用这些值时，它将调用变量并将它们提取出来。\n\
  \n## Python 字符串 (Python Strings)\n\n在我们要在 Python 中编写的一些代码中，有一种被称为字符串的数据类型。这些字符串将是你的代码中的的一系列字符，并可以帮助你完成不同的任务。我们还可以看到，当我们想要确保字符串与我们的\
  \ Python 代码配合时，有很多种运算符可以使用。运算符将仅仅是在你编写的代码中执行特定操作的符号。在这种情况下，操作将仅针对字符串进行，而不涉及其他内容。某些有助于我们完成此工作并确保代码良好的运算符包括：\n\
  \n1.  **拼接运算符 (Concatenation operator)**：当你想要合并某些字符串时，将使用这种运算符。\n2.  **重复运算符 (Repetition\
  \ operator)**：当需要创建许多相同字符串副本时，这是最好的运算符。你可以决定想要重复该字符串的次数以及想要多少副本。\n3.  **切片运算符 (Slice\
  \ operator)**：这是程序员在想要遍历特定字符串并提取他们需要的字符时最好的运算符。每当我们使用此选项时，我们必须记住 `0` 是字符串的第一个字符，然后你可以从那里开始。\n\
  4.  **范围切片运算符 (Range slice operator)**：当我们希望从索引获取一个范围的字符而不是仅仅挑选一个字符时，这是一个很好的运算符。如果你想展示一个单词、句子的一部分或整个句子，这就可以用。\n\
  \n\n\n\n\n## 5. in 运算符\n该运算符将在目标字符串中搜索指定的字符。如果该字符出现在字符串的某个位置，你将得到 True（真）的返回。如果该字符不在字符串内部，你将得到\
  \ False（假）的返回。\n\n## 6. not in 运算符\n这个运算符的工作方式与 `in` 运算符相反。它将在你的字符串中搜索指定的字符。但如果运算符无法在字符串中找到该字符，你将得到\
  \ True（真）的结果。如果在字符串中找到了该字符，它将返回 False（假）。\n\n## Python 函数\n我们将要学习的基础知识另一部分是 Python\
  \ 函数。这些函数本质上是一组表达式，我们也称之为语句。它们将是首批符合 `int` 类的对象之一，这意味着你不需要关注大量的限制限制。在使用内容上，你会有很大的自由度。相反，你可以按照自己的意愿使用这些函数，它们的工作方式与字符串、数字等类似。此外，这些函数还带有一些属性，只要我们在处理函数时使用\
  \ `dir` 前缀，就可以提取出这些属性。你会发现，这些函数具有极大的多样性。此外，还有许多属性供你创建和调用这些函数。在使用这些函数时你会看到的一些不同选择包括：\n\
  \n*   `__doc__`: 将返回你请求的函数的文档字符串（docstring）。\n*   `__default__`: 将返回一个包含默认参数值的元组。\n\
  *   `__globals__`: 将返回一个指向持有该函数全局变量字典的引用。\n*   `__dict__`: 该属性负责返回支持你所有自定义函数属性的命名空间。\n\
  *   `__closure__`: 将为你返回一个包含函数内部自由变量绑定的所有单元（cells）的元组。\n\n你可以对函数进行许多不同的操作，例如在需要时将它作为参数传递给另一个函数。任何能够接收另一个函数作为参数的函数在代码中都被视为高阶函数。学习这些非常有帮助，因为随着学习的深入，它们对你的代码非常重要。\n\
  \n## 运算符\n我们还可以花一点时间看看 Python 语言中出现的运算符。这些运算符将帮助我们的代码更加健壮，并确保我们能够在代码中看到优秀的结果。我们还会发现，根据你想要使用的运算符，有很多类型的运算符可以使用。例如，有算术运算符，这些允许你对代码的不同部分进行加、减、乘、除。还有比较运算符，允许我们比较代码的一个或多个部分。我们甚至可以使用赋值运算符，它将帮助我们为变量赋值。你必须根据你所编写的代码选择最合适的选项。在涉及\
  \ Python 代码的基础知识时，有许多不同的部分可以处理。知道如何让这些部分满足你的需求以及你想要编写的代码将至关重要。即使是你以后将处理的某些更复杂的代码，你会发现使用这些基础知识也将将帮助我们攻克那部分代码。\n\
  \n## 第 4 章：Python 中的不同数据类型\n数据是 Python 语言中非常重要的一部分。无论你当时正在尝试编写什么类型的代码，你会发现 Python\
  \ 都能控制它，并确保从长远来看你能看到惊人的结果。因此，我们需要花一些时间更多地学习 Python 中的不同数据类型，以及我们如何将这些类型用于我们的需求。在大多数情况下，数据类型有助于定义格式，设置数据的上下限以帮助程序恰当使用等等。但我们会发现，Python\
  \ 中使用的数据类型远不止于此。在 Python 中，我们甚至不需要通过显式提到数据类型来声明变量。这被称为动态类型，确实可以在过程中为我们节省大量的时间和麻烦。Python\
  \ 能够通过查看运行时的语法来确定字面量的类型。例如，引号用于标记字符串值中的声明，方括号显示列表，而大括号则用于字典。另一个例子是，当不带小数的数字被赋值为整数类型时，带有小数的数字会被视为浮点数（floating\
  \ number）。包括模块、函数和变量在内的一切都是一个 Python 对象。这里我们可以观察的另一个有趣事实是，变量并不像其他语言那样具有类型。相反，我们会发现它们只是被标记了。是我们关联的值具有类型。这就是为什么同一个变量可以表示不同的数据类型。考虑到这一点，Python\
  \ 语言中有相当多的数据类型可以使用。我们将查看以下常见的类型：\n\n### 布尔型\n首先，是布尔型（Boolean）。这是在几乎所有我们可以使用的编程语言中都能找到的一种数据类型。我们在\
  \ Python 中使用的布尔类型有两个值：`True` 和 `False`。这些值是常量，可以使用它们来比较或赋值布尔值。\n\n### 数字\n另一种我们可以使用的数据类型是数字。这些实际上是数据主要的数据类型之一。与我们在外部看到的某些语言不同（那些仅依赖浮点数和整数的语言），Python\
  \ 引入了一些不同的部分，例如复数，来帮助处理这些数字。在处理此语言的数字时需要记住的事项包括：\n\n1. Python 中的数字将根据你可能已经看到的某些关键字进行分类，包括\
  \ `complex`、`float` 和 `int`。\n2. Python 拥有一个名为 `type()` 的内置函数，它可以确定变量或我们正在使用的值的对应数据类型。\n\
  3. 另一个函数 `instance()` 是内置的，可以帮助我们测试对象的类型。\n4. 当涉及到在 Python 中工作时，我们也可以处理虚数和复数。我们只需要添加\
  \ `j` 或 `J` 来辅助这一点。\n5. 为了帮助我们构建复数，如果愿意的话，可以使用该类型作为构造函数。\n6. 这种语言中的整数完全没有大小限制，只要我们已经准备好了所需的内存。\n\
  \n\n\n\n\n# 7. 数据类型\n\n浮点型（float）具有一定的精度。尽管这种精度不能无限持续下去，但如果我们愿意，我们可以看到它可以达到 15 位小数。\n\
  \n另一种数据类型是我们之前稍微提到过的字符串。它是一个包含一个或多个字符的序列，我们可以用单引号或双引号将其括起来。我们可以在想要处理的字符串中放入任何种类的数字、字母或符号。你会发现\
  \ Python 语言也支持多行字符串。你只需要确保在字符串的开头和结尾各使用三个引号即可。\n\n### 字节（Byte）\n列表中的下一项是字节。这被视为一种不可变的数据类型。它能够存储一个字节序列，每个字节占\
  \ 8 位，范围在 0 到 255 之间。与我们看到的数组类似，当我们使用索引时，可以获取其中一个字节的值。但我们无法修改正在处理的值。\n\n现在我们已经对字节和字符串进行了简单的比较，我们需要确保自己知道它们之间的区别。它们的一些主要区别包括：\n\
  \n1. 字节对象持有一个字节序列。而字符串负责存储字符序列。\n2. `bytes` 是机器可以读取的对象。而字符串是以人类可以阅读的形式存在的。\n3. 既然\
  \ `byte` 是机器可以读取的内容，它可以直接存储到磁盘上，而无需额外处理。但字符串在存储到磁盘之前，必须经过某些编码处理。\n\n我们会发现这些字节确实非常重要的情况之一，是在执行开启了缓冲的\
  \ I/O 操作时。例如，我们可能有一个程序一直在接收通过网络传来的所有数据。该程序将在等待消息头终止符出现在消息中后对数据进行解析。它将不断将输入的字节追加到缓冲区中。\n\
  \n### 列表（Lists）\nPython 列表是一种类似于数组的结构，它能够按照你最喜好的顺序顺序存储一些任意类型的对象。在处理数据类型时，它是一个非常灵活的选项，而且不需要是固定大小的。在\
  \ Python 中，列表的索引从 0 开始。\n\n当我们使用这种语言中的列表时，会看到的另一个定义是：它们是异构集合，包含了我们可以处理的各种不同数据类型的项。例如，当我们有一个\
  \ `list` 对象时，我们可以将文件存储到文件夹中，或者存储公司的员工数据，并在以后知道它们的位置。这些列表以及其中的对象都是可变的。Python 允许我们通过赋值对\
  \ `list` 及其任何元素进行一些修改，我们还可以使用 Python 随带的一些列表方法。\n\n### 元组（Tuples）\n我们还会花时间研究这种语言中的元组。元组稍有不同，但可能存在一些我们需要关注的相似之处。元组基本上是\
  \ Python 中一个用逗号隔开的异构对象集合。这意味着不同数据类型的对象可以组合在一个元组中。元组和列表非常相似，因为它们共享许多特征，包括以下点：\n\n\
  1. 两个对象都在一个有序序列中。\n2. 它们能够存储不同类型的值。\n3. 嵌套是这些对象中可以实现的操作。\n4. 它们允许我们随心所欲地进行索引和重复。\n\
  \n然而，元组和列表是不同的。它们如此不同的最大原因是元组被视为是不可变的。Python 不允许我们在创建元组后对其进行修改。这意味着我们无法在稍后删除或添加任何种类的元素。如果我们确实需要在这里进行一些更改，那么我们需要创建一个具有更新元素序列的新元组来完成任务。\n\
  \n### 集合（Set）\n在某个时刻，你可能会发现自己需要处理 Python 中被称为集合（set）的东西。这是唯一一种支持你可能需要的某些数学运算的选项，例如对称差、交集和并集。如果你计划使用\
  \ Python 进行一些数学工作，那么这就是你想要的数据类型。\n\n为了简单起见，`set` 是一个无序的不可变且唯一对象的集合。它的定义带有一对大括号，这允许我们在括号内部用逗号将项隔开。由于\
  \ `set` 继承了数学中 `Set` 的某些实现，它也允许在同一个元素中出现多次（注意：原文此处存在矛盾，因为集合的元素是唯一的）。\n\n`set` 类型相比于你可能想要编写的某些列表具有巨大优势。它能够实现一种高度优化的方法，该方法负责检查容器是否托管了特定元素，这里的机制基于一种我们可以称为哈希表的数据结构。\n\
  \n### 字典（Dictionary）\n本章我们将花时间研究的最后数据类型是字典。它是 Python 中的一种无序集合，包含一些键值对，我们可以将其称为为\
  \ Python 中的一种内置映射类型，其中键为我们正在处理的值提供了映射。这些键值对在这一语言中存在，是因为它们可以帮助我们用一种更直观的方法来存储所拥的数据。\n\
  \n`dictionary` 非常重要，因为它能帮助我们解决高效存储大量数据时出现的问题。我们将在指南的稍后部分花时间讨论数据分析，以及如果你让它运行它能为你的业务带来什么。但事实是，大多数公司已经在收集大量数据以满足他们自己的需求。字典是实现这一切的完美工具。Python\
  \ 已经做好了设置，使得 `dictionary` 对象经过尽可能的优化，以便在过程中检索你想要的数据。\n\n正如我们在这里看到的，在处理 Python 语言时，我们可以使用许多不同类型的数据。每种数据类型对于你想要通过这种过程要实现的目标都至关重要，你会发现你可以根据当时代码中的运行情况对它们进行选择。花时间查看这些不同的数据类型以及它们能为你做什么，然后看看它们对你的需求有多大价值。\n\
  \n\n\n\n\n# 第 5 章：Python 函数\n\n在学习 Python 语言时，我们需要花时间关注的另一个主题是函数。在 Python 中，能够执行你所需要的特定操作的代码块或代码逻辑被称为函数。在之前的章节中，我们已经花了一些时间了解了这些函数的本质，以及我们如何让它们为我们的需求而工作。但现在，我们需要更仔细地观察这些函数可以做什么，以及它们如何帮助我们快速获得最佳结果。\n\
  \n## 函数的不同类型\n\n在 Python 语言中主要会有两种类型的函数。在使用这种语言时，了解它们是什么以及如何让它们工作至关重要。这里出现的两种主要类型的函数包括：\n\
  \n1. **库函数**：这些是 Python 语言中出现的一些内置函数。我们不需要过多担心库函数中的某些逻辑，因为这些是 Python 能够独立处理的。你会发现，代码中经常出现的某些库函数可能包括\
  \ `round()` 和 `print()` 等示例。\n\n2. **用户定义函数**：该语言不仅依赖某些内置函数，还允许用户创建自己的函数。因此，如果你想在代码中执行诸如数学计算的操作，你可以将它们放在一个具有正确名称的独立函数，然后就可以多次调用该函数。\n\
  \n## Python 函数的优势\n\n在有了这些理解之后，我们需要查看在 Python 中使用函数时可以看到的一些优势。这些优势有很多，这就是为什么你会在所进行的大量工作以及该语言所需的许多代码中看到这些函数。\n\
  \n我们将看到的这些函数的第一个优势是，它能够将你编写的较大程序拆分成若干更小的组。这看起来可能是一个坏主意，但这样做是为了让我们以更快的速度理解代码，并且真的可以在短时间内让程序的调试过程变得更简单、更好。另一个益处是，某些\
  \ Python 函数可以防止我们重复编写相同的逻辑。这是一个好消息，因为它帮助我们把逻辑封装在一个函数中，然后我们就可以多次地调用它。\n\n此外，当我们使用某些\
  \ Python 函数时，还有两个优势将会出现。首先，我们会发现这些函数允许多人同时处理完全相同的程序。这是因为我们可以为团队中的每一个人分配不同的函数，并让他们开始工作。它还能帮助我们，因为我们可以使用不同的输入反复调用同一个函数，次数随心所欲，这在过程中也能节省大量时间并减少麻烦。\n\
  \n## 函数的语法\n\n我们还需要花时间看看这些内容在某些编写的代码中的呈现形式。首先，我们需要查看 Python 函数的语法，然后进入对其中一些不同部分的解释，以便我们了解更多关于它是如何运作的。\n\
  \n```\ndef Function_Name (Parameters):\n    Local Variable Declaration\n    Programming\
  \ Logic\n    Executable Statement 1\n    ……\n    return\n```\n\n1. **Def**：这是用于引入我们正在处理的函数定义的关键字。请记住，`def`\
  \ 关键字后面紧跟 `Function_Name`。\n2. **Function_Name**：除了我们之前讨论过的保留关键字外，你可以给出的任何名称。\n\
  3. **Parameters**：Python 的每个函数都可以接受你需要的任意数量的参数。你可以没有，也可以有多个。这取决于用户的需求。\n4. **局部变量声明\
  \ (The local variable declaration)**：有时我们可能需要使用临时变量。这些变量是仅该函数需要的，因此我们可以在正在处理的函数内部声明它们。这并不是强制性的，取决于你对工作要求的类型。请记住，这些变量仅对一个特定的函数可用，在函数外部你将无法访问它们。\n\
  5. **逻辑 (Logic)**：这是可以在该函数中实现的任何数学运算、任何类型的代码或计算。\n6. **可执行语句 (Executable statement)**：这是任何\
  \ `print` 语句，告诉代码从你需要的函数打印某些数据。\n7. **Return (返回)**：这是另一个我们可以关注的关键字，因为如果我们想从函数中返回某些内容，就需要它。例如，我们可以使用它来帮助我们返回两个整数之和等内容。\n\
  \n当是时候使用函数并让它们按照我们希望的方式工作时，我们可以做很多事情。当我们能够调出这些函数并在代码中正确地使用它们时，它们将确保我们获得尽可能最好的结果，并保持我们的代码健壮且安全。\n\
  \n\n\n\n\n# 第 6 章：如何编写你自己的条件语句\n\n接下来我们要查看的是条件语句。这些条件语句将使系统更容易响应用户可能提供的任何类型的答案，而不需要程序员提前知道这些答案是什么。对于程序员来说，在所有情况下都预知并知道用户将提供什么答案几乎是不可能的，因此使用这些条件语句将帮助程序根据用户提供的信息以适当的方式运行。许多不同的程序都依赖于这些条件语句。这些语句通常被认为处理起来稍微简单一些，但它们始终是我们能够将其添加到代码中并看到极佳效果。你在此节中可能会看到的三个条件语句是\
  \ `if` 语句、`if else` 语句和 `elif` 语句。让我们来看看每一个语句以及它们是如何运作的。\n\n## 从 If 语句开始\n\n我们需要关注的第一个条件语句是\
  \ `if` 语句。你会很快发现，这是三个条件语句中最基础的之一，因为只有当用户根据你设置的条件提供了正确答案时，你所编写的程序才会继续运行。使用这种语句，如果用户输入的答案根据你在代码中设置的内容被视为假（false），那么代码将停止，什么也不会发生。但是，如果答案在你的条件中被视为真（true），那么你的代码将在屏幕上显示某种消息，或者执行你分配的其他任务。正如我们已经看到的，`if`\
  \ 语句有时会在你编写的代码中引起问题，但对于初学者来说，学习如何使用这些语句仍然是一项重要的工作。你可以编写的处理这些条件语句的语法示例包括：\n\n```python\n\
  age = int(input(\"Enter your age:\"))\nif (age <= 18):\n    print(\"You are not\
  \ eligible for voting, try next election!\")\nprint(\"Program ends\")\n```\n\n这段代码会显示几点内容。如果用户运行程序并声明他们的年龄小于\
  \ 18 岁，程序将正常工作并显示列出的消息。用户可以阅读此消息并直接在那里结束程序。但是，如果用户输入的年龄大于 18 岁，情况就会出现问题。对于用户来说这是事实，但因为不符合你编写的条件，程序会将其视为假。按照目前的代码写法，什么都不会发生，因为它没有设置好处理这种情况。用户每当输入一个超过\
  \ 18 岁的年龄时，只会看到一个空白屏幕。\n\n## 移动到 If Else 语句\n\n我们需要关注的第二种条件语句是 `if else` 语句。我们已经看到虽然\
  \ `if` 语句是一个很好的练习对象，但在程序中可能很多时候你无法使用这种语句。如果用户无论年龄如何，程序都能根据用户输入的任何答案进行处理，那么你尝试编写的代码很可能会从中受益。而且你可能不希望你的代码一直什么都不显示。更好的选择是使用\
  \ `if else` 语句。这些语句无论用户提供什么输入，都会向用户提供输出。对于上面的示例，如果用户声明他们的年龄是 16 岁，他们可能会获得之前的消息，但如果用户说年龄是\
  \ 32 岁，代码也会有一个响应。它会对收到的任何答案做出响应，帮助代码继续运行程序并确保不会直接停止。使用我们上面的投票示例，你可以实现以下代码来制作 `if\
  \ else` 语句：\n\n```python\nage = int(input(\"Enter your age:\"))\nif (age <= 18):\n\
  \    print(\"You are not eligible for voting, try next election!\")\nelse:\n   \
  \ print(\"Congratulations! You are eligible to vote. Check out your local polling\
  \ station to find out more information!\")\nprint(\"Program ends\")\n```\n\n通过这个选项，你添加了\
  \ `else` 语句，它将涵盖所有不满 18 岁的年龄。这样一来，如果用户列出了他们的年龄，屏幕上仍然会有内容显示给他们看。这可以让你在编写代码时拥有更多的自由，你甚至可以在此基础上添加更多层级。如果你想将其分成四个或五个年龄组，并且每个组都获得不同的响应，你只需要添加更多的\
  \ `if` 语句来实现。`else` 语句位于最后，用于捕获所有其他情况。我们可以使用这个语句有很多很多选项。例如，你可以使用之前的代码语法，然后询问用户他们最喜欢的颜色是什么。然后你可以利用\
  \ `if else` 语句来帮助涵盖你想要的一些基础颜色。如果用户能够输入其中一种颜色，那么你设置的语句就会显示在屏幕上。`else` 语句将是我们可以添加的部分，用于处理你没有计划的任何颜色，并为我们提供一个相应的陈述。正如我们看到的，我们可以使用这个语句有很多选项。例如，你可以使用之前的代码语法，然后询问用户他们最喜欢的颜色。然后你可以利用\
  \ `if else` 语句来帮助涵盖你想要的一些基础颜色。如果用户能够输入其中一种颜色，那么你设置的语句就会显示在屏幕上。`else` 语句将是我们可以添加的部分，用于处理你没有计划的任何颜色，并为我们提供一个相应的陈述。正如我们看到的，我们可以使用这个语句有很多选项。例如，你可以使用之前的代码语法，然后询问用户他们最喜欢的颜色。然后你可以利用\
  \ `if else` 语句来帮助涵盖你想要的一些基础颜色。如果用户能够输入其中一种颜色，那么你设置的语句就会显示在屏幕上。`else` 语句将是我们可以添加的部分，用于处理你没有计划的任何颜色，并为我们提供一个相应的陈述。正如我们看到的，我们可以使用这个语句有很多选项。例如，你可以使用之前的代码语法，然后询问用户他们最喜欢的颜色。然后你可以利用\
  \ `if else` 语句来帮助涵盖你想要的一些基础颜色。如果用户能够输入其中一种颜色，那么你设置的语句就会显示在屏幕上。`else` 语句将是我们可以添加的部分，用于处理你没有计划的任何颜色，并为我们提供一个相应的陈述。正如我们看到的，我们可以使用这个语句有很多选项。例如，你可以使用之前的代码语法，然后询问用户他们最喜欢的颜色。然后你可以利用\
  \ `if else` 语句来帮助涵盖你想要的一些基础颜色。如果用户能够输入其中一种颜色，那么你设置的语句就会显示在屏幕上。`else` 语句将是我们可以添加的部分，用于处理你没有计划的任何颜色，并为我们提供一个相应的陈述。\n\
  \n## 以 Elif 语句结束\n\n我们要使用的第三种条件语句是 `elif` 语句。这些 `elif` 语句将增加另一个层次，但它们也易于处理。你可以认为\
  \ `elif` 语句的方式类似于某些游戏中，玩家从选项中选择来决定采取的行为。`elif` 语句将以此运作。从中我们可以根据 `elif` 语句处理尽可能少或尽可能多的选项。你可以只使用二三个这些语句，也可以扩展到三十个（如果你想的话）。但这里有一个很好的规则，在很多情况下，少即是多。你不希望有太多的这些语句，否则会变得一团糟。\n\
  \n现在我们已经讨论了这些语句的含义，以及它们与 `if` 语句和 `if else` 语句的区别，让我们来看一些我们可以处理的语法：\n\n```python\n\
  print(\"Waiter, Please select your:\")\npizzachoice = int(input(\"Please enter your\
  \ choice:\"))\nif pizzachoice == 1:\n    print('I want a pizza napoletana')\nelif\
  \ pizzachoice == 2:\n    print('I want a pizza rustica')\nelif pizzachoice == 3:\n\
  \    print('I want a pizza capricosa')\nelse:\n    print(\"Sorry, I do not want\
  \ any of the listed pizza’s, please bring a Coca Cola for me.\")\n```\n\n通过这个选项，用户可以选择他们想要享用的披萨类型，但你可以根据任何需要使用相同的语法。如果用户在代码中输入数字\
  \ `2`，他们将得到 `pizza rustica`。如果他们不喜欢任何选项，他们就会告诉程序他们只想喝点东西，在这种情况下是一瓶 `Coca Cola`。这是使用\
  \ `elif` 语句给用户提供一组选择的简单方法。在其他选项中，用户可以添加他们想要的任何选择，但在 `elif` 语句中，他们要么选择你提供的选项之一，要么他们将使用最后的默认选项。\n\
  \n\n\n\n\n# 第 7 章：Python 类以及如何编写你自己的类\n\n使用 Python 编程语言非常棒的一点是，它可以处理该语言自带的一些类。这些类将成为语言中的容器，能够容纳你编写的代码中出现的所有对象（或不同部分）。能够编写这些类并将正确类型的代码放入其中，是让你的代码在这一语言中尽可能保持条理且易于使用的重要部分。\n\
  \n这就是为什么在这一章中，我们将花一些时间研究如何创建一个新类。这是组织代码的最佳方式之一，它将确保在执行你想要编写的代码时，任何内容都不会丢失或以错误的方式发生偏移。\n\
  \n不过，在开始创建此类类的过程之前，我们需要确保使用了正确的关键字。对于类，你可以自由地为它们命名为任何喜欢的名称。我们只需要确保不使用关键字作为名称，并且类名将紧跟在我们所使用的关键字之后。通常情况下，为类选择一个你能够记住并在稍后将其调用的名称是个好主意。\n\
  \n在你花了一些时间浏览并为你的类命名后，我们还需要花一些时间为子类命名。这部分是括号内的内容。然后在这一行的末尾添加一个分号，以符合 Python 中为了简化事情而提供的某些良好编码规范。\n\
  \n当你脑海中过完这些内容后，这个过程以及创建自己的类的想法可能会看起来非常复杂。这就是为什么我们需要停顿几分钟，看看我们想要如何在 Python 中写出所有这些内容的示例。我们将用于帮助在\
  \ Python 语言中编写类的类的代码将包含：\n\n```python\nclass Vehicle(object):\n    #constructor\n\
  \    def __init__(self, steering, wheels, clutch, breaks, gears):\n        self._steering\
  \ = steering\n        self._wheels = wheels\n        self._clutch = clutch\n   \
  \     self._breaks = breaks\n        self._gears = gears\n    #destructor\n    def\
  \ __del__(self):\n        print(\"This is destructor....\")\n    #member functions\
  \ or methods\n    def Display_Vehicle(self):\n        print('Steering:', self._steering)\n\
  \        print('Wheels:', self._wheels)\n        print('Clutch:', self._clutch)\n\
  \        print('Breaks:', self._breaks)\n        print('Gears:', self._gears)\n\n\
  \    #instantiate a vehicle option\n    myGenericVehicle = Vehicle('Power Steering',\
  \ 4, 'Super Clutch', 'Disk Breaks', 5)\n    myGenericVehicle.Display_Vehicle()\n\
  ```\n\n如果你愿意，可以尝试运行这段代码。只需打开你的文本编辑器并输入代码即可。当你编写这些内容时，你会发现我们在本指南中已经讨论过的几个主题会出现在这段代码中。一旦你有机会编写并执行这段代码，让我们将其拆分来，看看上面发生了什么。\n\
  \n现在第一部分是类定义。这是我们必须实例化对象的地方，然后……（文本继续具有类似的逻辑）。\n\n\n\n\n\n# 第 8 章：在 Python 中处理文件\n\
  \n处理文件操作将是 Python 语言中经常出现的话题。当你在 Python 中工作时，会有某些时刻我们希望将处理的一些数据存储起来，以便在以后需要时可以使用。你可以选择以你能够找到的方式保存这些数据，以便日后找到它们，并在你正在编写的任何代码中合适的时间显示出来。这些数据是可以保存的，就像磁盘上的文件一样。或者你也可以决定根据需要频繁重用这些数据，进行类似于继承的操作，只要你确保在过程中执行了正确的步骤。虽然继承是我们想要编写的大许多代码中的重要部分，但我们现在需要更多关注如何创建和处理\
  \ Python 代码中找到某些文件。现在，在处理 Python 中的文件时，会有一些我们可以操作的内容。为了确保这尽可能容易理解，我们可以将文件想象成你在编写的\
  \ Word 文档中看到的内容，然后在某个时刻，你会想要保存它们。这些文件的工作方式类似，但你不需要保存页面，而是需要浏览并保存你正在编写的一些代码。在本章中，我们将查看在处理\
  \ Python 中的这些文件时，你可以处理的几种不同内容。我们将查看如何向之前创建的文件写入新代码。我们将查看如何查找文件或将其移动到全新的位置。我们将查看如何创建一个文件。最后，我们可以完成关于关闭和保存已处理文件的某些信息。\n\
  \n## 创建我们自己的新文件\n\n在处理这些文件时，我们首先需要关注的事情是，当你需要时如何创建一个新文件，以便向该文件添加一些代码。如果你想创建自己的文件并在其中包含一些代码，那么在\
  \ IDLE 内部打开它是重要的。然后，你需要在编写一些新代码时选择你使用的模式。当你处理这些内容时，代码将有三个主要选项，你可以根据代码的功能选择正确的选项。这里提供的三种模式包括追加\
  \ `(a)`、写入 `(w)` 和模式 `mode(x)`。每当你想对当前打开的文件进行任何更改时，你都可以使用 `(w)` 或写入选项，因为这通常是最容易操作的。每当你尝试打开文件并在该文件中写入新字符串时，你处理的是二进制文件，并将需要\
  \ `write()` 方法。这将运行良好，因为它确保了你在结束时将获得正确的字符。\n\n`write()` 函数非常易用，允许你对文件进行任意次数的更改。你可以向文件中添加一些新信息，也可以对文件进行更改。如果你对在代码中进行写入感兴趣，可以使用此示例让事情变得简单：\n\
  \n```python\n# 文件处理操作\n# 写入新文件\nhello.txt = open('hello.txt', 'w', encoding='utf-8')\n\
  f.write(\"Hello Developers!\")\nf.write(\"Welcome to Python World\")\nf.flush()\n\
  f.close()\n```\n\n在我们花时间深入学习之前，我们需要将上面的代码输入到编译器中并让它执行。这段代码很有帮助，因为它确保了你可以创建一个新文件并将想要的所有信息放入其中。请记住，默认目录被称为当前目录。你始终可以切换你想存储信息的目录，但你应该在向其中编写任何代码之前这样做，因为这样要容易得多。无论你从哪个目录开始，当是时候搜索该文件时，你都需要回到那个目录。如果你想在新目录中找到该文件，那么就是该在保存之前将其移动过去。使用我们上面写的选项，当你进入正确的目录并打开它时，你将看到那里显示的信息。\n\
  \n到此时，我们已经花时间写了这段程序，并且可能对它很满意。但会有某些时刻我们想要对程序进行一些覆盖。这将改变情况，使得当你打开该文件时，屏幕上将显示一个新语句而不是上面的那一个。即使在以前创建的文件上更改内容也是可能的。我们需要写出内容以覆盖我们代码的一个良好示例包括：\n\
  \n```python\n# 文件处理操作\n# 写入新文件\nhello.txt = open('hello.txt', 'w', encoding='utf-8')\n\
  f.write(\"Hello Developers!\")\nf.write(\"Welcome to Python World\")\nmylist = [\"\
  Apple\", \"Orange\", \"Banana\"]\n# writelines() 用于向文件写入多行\nf.writelines(mylist)\n\
  f.flush()\nf.close()\n```\n\n当你想要对以前处理过的文件进行一些更改时，上面的示例是一个很好的选择，因为你只需要添加一行新内容。这个示例不需要使用那行代码，因为它只包含了一些简单的单词，但你可以向程序中添加任何你想要的内容，只需使用上面的语法并根据你的需求进行更改即可。\n\
  \n## 我可以创建二进制文件吗？\n\n在这里我们将稍作绕路，探索一下在 Python 中我们可以对二进制文件做什么。这会有所不同，但它很简单，并且可以对我们编写的一些代码产生影响。你可以在\
  \ Python 中完成这个过程，因为你只需获取正在处理的数据，然后确保它变成图像文件，而不是像以前那样将其作为文本文件写入。如果这样做更容易，你可以将用这种语言编写的任何文本文件转换为二进制文件。事实上，你处理的是哪种文件并不重要，无论是图片、声音还是文本文件。当我们把内容转换为二进制文件时，必须记住的最重要的一点是，我们需要在对象内部提供数据，以便以后更方便。我们可以使用下面的语法来帮助我们：\n\
  \n```python\n# 写入数据\n# 写入文件\n# 写入模式\nF = open('hello.dat', 'wb')\n# 写入字节字符串\nf.write(b\"\
  I am writing data!\\n\")\nf.write(b\"Let’s write another list\\n\")\nf.close()\n\
  ```\n\n## 如何打开文件\n\n我们在这里花一点时间 own 一下在 Python 中如何打开文件。我们已经查看了如何创建文件以及如何将任何文件转换为二进制文件。在探索\
  \ Python 中的文件会发生什么时，这些都是非常重要的主题。但现在我们需要花时间查看打开文件的过程。在某个时刻，你需要关闭文件并继续。之后你可能想要再次打开文件并查看其中的内容。当你花时间打开该文件后，操作将变得更容易。我们在这里可以使用的代码包括：\n\
  \n```python\n# 读取文件的二进制数据\n# 读取文件\n# 以读取模式\nwith open(\"hello.dat\", \"rb\") as\
  \ f:\n    data = f.read()\n    text = data.decode('utf-8')\n    print(text)\n```\n\
  \n当你将此内容放入系统时，得到的输出如下：\nHello, world! This is a demo using with This file contains\
  \ lines Hello world This is a demo using with This file contains lines.\n\n正如我们在这里看到的，这将是打开我们正在处理的文件的一种简单方法，然后我们可以像之前讨论的那样浏览并覆盖它，或者作为我们之前讨论内容的延续编写全新的内容。\n\
  \n## 如何查找文件之一\n\n当我们学习本章内容时，你会发现这些文件是处理工作并保持 Python 脚本尽可能整洁、组织的良好方法。我们花了一些时间真正探索了在查看文件结果时我们可以操作\
  \ ownset。所有这些内容都很有用，可以确保文件以我们想要的方式被打开、写入和保存。我们已经花时间编写了新文件、如何覆盖已经写入的一些数据，甚至以及如何打开文件。可能还会有某些时刻你想要将文件移动到新位置。例如，如果你正在处理文件，并发现情况不符合预期，例如错误地拼写了标识符的名称，或者你将其放在了错误的目录，你可能想要使用\
  \ `seek` 选项来帮助查找该文件并进行更改。你只需要告诉你的代码你想在哪里找到代码，然后进行所需的更改即可。\n\n\n\n\n\n# 第 9 章：充分利用\
  \ Python 的技巧与窍门\n\n现在我们已经花了一些时间讨论了 Python 代码以及我们通过这类代码能够完成的各种事情，现在是时候研究如何充分发挥这些代码的价值了。在本章中，我们将重点关注当代码运行没有按照你的预期时你可以做的一些事情，或者有助于让编程过程变得更容易的一些技巧。作为初学者，你在以这种方式处理\
  \ Python 时可以遵循的一些技巧包括：\n\n## 注释代码\n你将处理的每种编程语言都会有注释，注释基本上是你可以在代码中留记笔记的方法，而编译器不会去查阅并尝试将这些笔记作为程序的一部分来执行。这对你是有利的，因为你可以选择注释掉你现在不想运行但又不想遗失的代码。你只需要在想要注释掉的那行前面加一个\
  \ `#` 即可。如果你的脚本很长，你可以对代码中与你想做的修改无关的部分进行注释。这有时可以让代码运行得更快，并且让你更容易搜索代码的其他部分以帮助找到那个错误。不过，在这样做时你需要小心，因为这不会帮助你注释掉那些程序之后需要使用的变量设置部分。如果你这样做，那么在运行代码时就会遇到问题。当你测试完代码，并将其整理整齐准备就绪后，你必须回去删除这些注释字符。这有助于你重新开启整个程序，以便查看它运行得是否正常。\n\
  \n## 打印内容\n当你某些时候无法确定正在编写的代码哪里出了问题时，你可以花些时间打印很多内容，看看什么是有效的。如果你不确定某个值是否被赋值给了某个变量，就把它打印出来。如果你对正在编写的代码中发生的任何事情都不确定，那么就是时候打印它了。然后，当你实际上运行程序时，你就可以查看屏幕，看到值是如何变化的，或者由于此发生了什么不同之处。你可能会发现，在打印变量之前先打印一些字符串会有帮助。这是一个很好的方法，可以确保你的打印语句能够帮助你学习如何让程序按照你的需求来工作。\n\
  \n## 编写你已知会正常运行的代码\n当你对某些事情产生疑虑时，你可能想花些时间练习已经存在的代码，那些你知道能够运行的代码，你不需要担心它们是否会按照你的意愿运行。这将帮助你了解这些代码伴随的一些语法和结构，然后你可以从那里开始以获得最佳结果。对于初学者来说，获得这种熟悉感是一件好事，这样他们以后在编写自己的代码或处理更复杂的事情时就能利用它。如果你决定编写自己的项目，那么你可以在\
  \ Google 上搜索，找到一个包含许多你所需内容的脚本。它不需要是完美的，但有时有了那个背景和一些语法就能产生巨大的差异。确保你在尝试实施任何更改之前花时间运行代码。这确保了代码在你进行任何更改之前是工作正常的的。然后你就可以对该代码添加一些细小的更改，并经常停下来进行测试，看看你实现的任何更改是否导致了错误。\n\
  \n## 阅读所有的错误信息\n对于初学者来说，这有时是很困难的，因为你可能假设自己从根本不知道错误信息的意思，那么为什么要花时间去学习并实际阅读它们呢？但实际上，花时间阅读这些信息并学习它们是如何工作的，以及它们在告诉你什么，可以在代码运行不畅时更容易修复某些代码。你会很快发现，很多错误信息都是准确的，而且对你来说其实非常详尽。语言运行时尝试执行程序，但遇到了问题。这意味着你跳过了某个步骤、有了拼写错误，或者你的代码中缺少了某些内容。有时你可能不懂错误时出现的消息，但它确实在试图告诉你代码哪里出了问题。至少，它会提供错误所在的行号信息，你可以前往代码的该部分寻找错误可能所在的位置。\n\
  \n## 经常运行代码\n在处理 Python 代码时，你需要考虑的另一件事是定期运行它。没有什么比坐下来写几个小时代码更糟糕的了，尤其是当你还是一个初学者时。你可能觉得很有成就感，但当你回头去尝试运行那些代码时，你会感到很惊讶。会有大量的错误需要你去检查和修复，然后在这个过程中你会对自己感到非常沮丧。与其有几个小时的代码需要你梳理并尝试处理一大堆错误，最好尽可能频繁地运行代码。如果你能够每隔几分钟运行一次，或者在完成你处理的每个小部分后运行一次，那么这通常是最好的。这确保了你在工作早期就能捕捉到一些错误和问题，并让你能够更容易地搞懂代码中发生了什么，并修复错误。在少量代码中找到错误和失误要比在工作了几个小时的大段代码中尝试这样做要容易得多。频繁运行代码似乎像是在浪费时间并减慢了你的速度。但从长远来看，它将为你节省大量的时间和精力，并确保你能够找到你正在寻找的解决方案。而且，修复出现的任何错误也会变得容易得多，因为你确切知道它们会在过程的哪个位置。\n\
  \n## 需要时休息\n有时，编写代码可以非常顺风顺水。一切都按照你需要的那样契合，你可以花费几个小时处理这部分，并让它完全符合你的意愿。其他时候，事情运行起来不会那么顺利，效果也不会那么好。当后者开始时，是时候休息了。通常，我们处理代码的时间太长了。我们想要完成它或解决它的问题，所以花费几个小时。然后我们感到沮丧。代码的某些没有按照我们想要运行，我们似乎无法修复它并恢复正常。无论我们如何努力，投入了多少精力，结果只会让情况变得更糟。虽然有时很难放下正在编写的代码去休息，但有时这正是我们需要的。当我们疲劳并盯着某物看了很久时，继续盯着它并尝试太多的事情只会更糟。当我们休息并学会离开电脑操作时，事情将变得要容易得多。你可能需要强制自己休息一下。当我们感到沮丧时，通常也是想要更加钻牛角尖的时候，我们不想离开正在进行的工作。\n\
  \n## 寻求帮助\n作为初学者，你可能某些时候需要为你正在编写的代码寻求帮助。\n\n\n\n\n\n# 1. 解释你希望程序为你做什么，以及错误发生在哪里。\n\
  # 2. 向对方展示发送错误的代码，以便让他们亲眼查看。\n# 3. 向对方展示完整的堆栈跟踪（stack trace），包括你收到的错误信息。\n# 4. 解释你已经针对该错误所尝试过的所有方法。这有助于对方了解你已经尝试了什么，以及他们应该尝试什么来让代码运行起来。\n\
  \n你可能会发现，在脑中理清这些事项并将它们写在纸上的过程，可以帮助让全新的解决方案显而易见。如果这样做不起，请尝试找一个能够查看代码并告诉你哪里出了问题以及你可以如何修复错误的人。当你第一次作为程序员工作时，有很多部分需要协同工作。对于试图弄清楚这一切的初学者来说，能够让所有这些相互配合，并确保能够学会修复自己代码中出现的某些问题是非常重要的。务必查看在编写\
  \ `Python` 代码时可以采取的不同步骤和技巧，以确保你的编码正确，并且你的程序或应用程序能够满足你的需求。\n\n\n\n\n\n\n我们在本指南中花费大量时间讨论的许多主题，都将引导我们深入了解数据分析以及它对我们意味着什么。有许多公司都想学习如何使用\
  \ `Python` 编程语言，因为它们知道这可以帮助它们思考如何更好地服务客户，在决定向客户发布哪些产品时做出最佳选择，以及等等。\n\n进行数据分析将带来许多益处，但在那之前，我们需要首先更多地了解数据分析以及这个过程的本质。数据分析简单来说就是我们利用它对原始数据进行有意义的排序和组织的一个过程。这将确保我们能够从这组数据提取出一些重要信息，并将其用于我们的需求。整理并思考数据的这一过程，对于帮助我们确定数据将包含什么以及我们能从中学到什么至关重要。\n\
  \n我们可以使用一些方法来根据自己的需求进行这类分析，但这里最需要记住的一点是**把我们的偏见和任何操纵排除在外**。人们很容易在其中加入他们自己的偏见等因素。这有时是故意的，如果某人想确保他们的某些想法能被选中。但这也可能发生在无意识层面。无论这些偏见源自何处，关注数据分析的呈现方式并对所使用的过程保持真正的批判性都是重要的。\n\
  \n这里需要记住的另一点是原始数据很容易呈现许多不同的形式。我们将看到数据从观察、社交媒体、调查问回复和测量等地方汇来。在我们通常收集这些数据的原始形式中，这些信息将被证明是非常用的。但它们也存在令人无从应备的问题。在进行数据分析的过程中，我们需要采取所有的原始数据（无论量有多大），然后以对我们最有用的方式对其排序。\n\
  \n例如，我们可以对在发送给客户后看到的某些问卷结果进行处理和统计。这会让你更好地了解实际上有多少人完成并回答了问卷，并帮助你看到人们对其中不同问题是如何反应的。在通常情况下，组织数据的过程中，将会出现一些趋势。有时，我们会看到这些趋势在数据报告中被突出显示。这样做是为了让读者引起注意。在对某事进行因果调查时，注意到男性比女性更喜欢某事，或者女性对某事的看法比男性更好，这可能是有趣的。这对于营销人员有时是重要的，并且可以更容易学习如何营销和触达每一个人。\n\
  \n此外，借助数学和其他一些工具对数据进行建模也将在这里帮助我们。这些工具可以确保正确的点被放大（即那些我们最感兴趣的点），这使得研究人员在处理过程中更容易看到并关注它们。我们正在进行的任何数据分析中需要添加的另一点是，**图表、文字报告和图形将都是数据分析的重要形式**。这些方法非常重要，因为它们旨在以某种方式提炼和精炼数据，让读者能够获取信息中最有趣的部分，而不需要自己去筛选数据。\n\
  \n总结数据以及分析过程中发生的所有情况，每当你想要用这些数据支持你所提出的任何论点时，通常是非常重要的，同样，以一种清晰易于理解的方式呈现数据也是如此。在某些情况下，你可能选择将原始数据包含在附录中，因为这允许那些需要它（以及可能正在使用这些信息做出重要决策的人）在他们需要时查看数据细节、分析结果等（如果他们在过程中选择要这样做的话）。\n\
  \n考虑到这一点，现在是时候看看在我们需要进行数据分析时，将会出现在我们的一些步骤了。无论我们在数据分析中执行或处理什么类型的项目，这些步骤都会非常相似，我们将看到\
  \ `Python` 语言将帮助我们完成所有工作。成功完成数据分析可以采取的一些不同步骤包括：\n\n## 定义问题\n\n在你从事的业务或组织数据分析中，我们需要确保我们切入的是正确的问题。从一开始就想着你只需筛选数据并希望从中泛现出一些好的见解，这绝不是一个好主意。现在要处理的数据实在太多了。这样做将浪费大量的时间和精力。如果你这样做而不采取实际行动，你最终会陷入胡同，无法完成任何工作。\n\
  \n你赖以完成这项工作的问题需要是**可衡量的、清晰且简洁的**。你还应该确保这些问题能够引入或排除我们正在处理的机会或问题中的某些潜在解决方案。在开始时，很好的方法是确保问题是明确定义的。例如，你目前作为承包商工作，并且发现许多成本正在上升，这让你提交具有竞争力的合同变得更加困难，你可能会失去工作。为了解决这个问题，你可以的问题可能包括可以在不影响质量的情况下减少人员。\n\
  \n## 选择重要的衡量方案\n\n一旦我们知道了想要关注的业务问题，就是该回过头来创建我们想要的衡量标准和优先级了。这个步骤可以分解为两个部分，使我们更容易处理。这些步骤将包括决定你需要衡量什么，以及决定为了衡量需要采取哪些步骤。\n\
  \n所以，对于第一步，我们必须决定具体想要衡量什么。回到我们看到的那个承包商，我们希望关注哪些数据可以帮助回答这些关键问题。对于这一点，一个主意是了解你有多少员工、他们产生多少成本，以及他们花在必要功能上的时间百分比。在回答这些问题时，你还会提出一些子问题。例如，你是否看到你的员工没有得到充分利用，是否存在某些流程改进措施可以帮助解决这个问题并降低成本？\n\
  \n在这一点上，总有很多选项和问题可以处理，你对这些问题越关注，挖掘得越深，就越能做出决策。在决定从流程中衡量什么时，我们需要考虑的最后一点是，确保在选择一种行动而非另一种时，可能出现的所有合理反对。例如，如果你决定减少一些员工，如果服务需求激增，你将如何应对？\n\
  \n你随后需要进入该过程中的第二个步骤。思考如何衡量这些数据与所有其他步骤同样重要，特别是在进入数据收集阶段之前。原因在于，你所使用的衡量过程要么能够支持你之后进行的分析，要么会损害你正在做的分析。这里有几个可以处理的不同关键问题，它们将包括：\n\
  \n\n\n\n\n# 1. 你想要遵循的时间范围是什么？\n考虑你想要花多长时间搜索信息、想要使用多少历史数据，以及你预计这些变化将持续多久。如果你只是在处理暂时的下降（例如季节性波动），那么寻找其他降低成本的方法可能比裁员更好。\n\
  \n# 2. 你将要使用的衡量单位是什么？\n例如，这可以是欧元和美元之间的比较。\n\n# 3. 你认为哪些因素应该包含在这个过程中？\n你可能只根据员工的年薪来检查他们的成本。然而，这并不能为你提供全貌，因为如果你结合年薪进行分析，你可以获得更多信息，而且你为员工提供的福利成本加起来也是一不小的数字。\n\
  \n\n\n在尝试对数据进行任何操作之前，有一个良好的计划是非常关重要的。即使是收集数据，也可以在制定好衡量标准并确定了下一步要采取的步骤之后再进行。\n\n\
  ## 收集数据\n此时，我们已经花了一些时间来回顾并清晰地定义我们想要为业务解决的问题。然后，我们还花了一些时间学习需要设定哪些衡量优先级，以确保我们获得正确类型的数据以及更多内容。现在是时候收集数据了。\n\
  \n在我们梳理、组织和收集数据的过程中，有几点可以记住，这将使我们更容易真正看到我们想要的某些结果。\n\n首先，在我们开始梳理并收集新数据之前，我们需要查看已经拥有的信息。如果你已经拥有了一些正在收集数据的数据源和数据库，那么你首先需要查看这些内容。这可以帮助你真正审视这些数据，并在过程中为你节省大量的时间和资金。根据收集的数据量，你可能已经拥有了所需的所有数据，而无需在其他地方查找。\n\
  \n然后，我们需要继续并确定我们将如何处理引入的数据。如果我们查看了自己的资源并发现还需要更多信息，那么我们需要提前考虑好一个良好的命名和文件存储系统。这将使团队中的成员更容易进行工作并相互协作。这个过程将为你的团队节省一些时间，并防止成员重复收集相同的信息。\n\
  \n如果你最终需要通过收集数据的过程，并使用访谈和观察来完成这项工作，那么你需要确保有一个每个人都可以使用的良好访谈模板。这将确保你所看到的内容具有一致性，并节省一些时间。\n\
  \n最后，我们将确保通过这个过程收集的所有数据都尽可能组织良好。你所使用的方法将取决于你正在使用的数据以及你计划如何使用它们来满足你的需求。你可以尝试创建一个记录收集日期的日志，然后添加任何你需要保留的来源备注，以保持所有内容整齐。花时间在这项上是非常重要的，因为它将帮助验证你稍后做出的某些结论。\n\
  \n收集完成此过程所需的数据将帮助我们真正完成数据分析。你需要确保在收集这些数据时，在此过程中是从一些可靠且良好的来源中筛选出来的。你收集的数据质量越高，以后的效果就越好。当你进行分析时，这些数据将为你提供一些你将作为决策依据的结果和预测，因此对这些数据保持一定的选择性会有帮助。\n\
  \n## 查看并分析数据\n这把我们了第四步，即对我们目前收集的所有数据进行分析。在我们收集到能够帮助我们回答第一步中提出的问题之后，是时候对数据进行更深层次的分析了。有几个可以遵循的选项和步骤来实现，我们现在将花时间讨论这些。\n\
  \n从处理数据开始，例如绘制数据图并观察存在什么种相关性。你甚至可以在 Excel 中创建自己的透视表。这个透视表可以为你提供服务，因为它允许你根据不同的变量对数据进行排序和过滤。它还将更容易计算你手中数据的最大值、平均值、标准差和最小值。\n\
  \n在处理数据时，你有时会发现从一开始就拥有了所需的确切数据。但在大多数情况下，你仍然需要收集更多数据来帮助，或者对你提出的原始问题进行一些修改。无论如何，这种对相关性、离群值、变化和趋势的初步分析将确保你能够将分析集中在回答你最初提出的问题上。这也是我们处理他人对你提出的反对意见的好方法。\n\
  \n在这一特定步骤中，数据分析自带的工具和软件将非常有帮助。你有几种不同的高级流程可以选择，这将帮助我们处理想要完成的这些高级统计数据分析。不过，在大多数情况下，你可以保持简单，因为你可以使用\
  \ Microsoft Excel 并获得你所需的许多决策工具。Excel 带有许多功能和函数，你会发现你也可以利用这些来帮助获得最佳结果。\n\n我们在这一步中进行的分析将花费一些时间。挑选我们想要使用的工具和正确的算法将使变得容易得多。我们将讨论一些可以帮助我们完成此分析的可用算法，这通常取决于你想处理多少数据，以及你希望从中得到什么样的答案。\n\
  \n我们还需要通过几种方法来分离数据。这两种方法将是 `training set`（训练集）和 `testing set`（测试集）。在我们能够实际开始处理分析之前，我们需要根据适当的方法和它的整体需求，对想要使用的算法进行训练和测试。算法并不会预先准备好并随时待命。相反，我们必须向它展示如何行为，并对其进行一些工作，然后就可以输入我们的数据并获取预测。\n\
