- raw: "Things you must know for machine learning ![](rsrcXS.jpg)To be successful\
    \ with machine learning, you must have the right tools in order to work, just\
    \ like if you were building a house, you would need to skills and the tools required.\
    \ The following is a list of the required materials to do machine learning. Data\
    \ To start working with your data, you have to have enough data to break it into\
    \ two categories; training data and test data. Training data is the data you use\
    \ in the beginning when you are building your model. When you are first creating\
    \ your model, you need to give it some data to learn from. With training data,\
    \ you will already know the independent variables as well as their respective\
    \ dependent variables. This means that for every input, you will already know\
    \ the output of your data. From this data, your model will learn to predict the\
    \ output on its own. Our training data gives us the parameters we need to make\
    \ predictions. This is the data that our machine learns from. Test data is the\
    \ data that the machine gets once you are satisfied with the model, and you see\
    \ what it does out in the wild. In this data, we only have the independent variables,\
    \ but no output. With test data, we can see how well our model does at predicting\
    \ an outcome with new data. Your training data should account for most of your\
    \ data; approximately 70%, while your test data is the remaining 30%. In order\
    \ to avoid bias, make sure that the data you choose for training data and test\
    \ data is totally random when you split them up. Don’t choose which data to use;\
    \ let it be random. Don’t use the same data for training and testing. Start by\
    \ giving the training data to the machine and examine the relationships between\
    \ X and Y, then try to see how well your model did. The most important question\
    \ to consider during this process is whether your model will still work when it\
    \ is presented with new data. You can test this by doing cross-validation. This\
    \ means you will test your model on data you have not used yet. Keep some data\
    \ to the side that you didn't use during training to see how accurate your model\
    \ is at the end. You can also use K-fold validation to check the accuracy of your\
    \ model. This method is pretty easy to use and generally unbiased. It’s a good\
    \ technique to use when we don’t have a lot of data to work with for testing.\
    \ For K-fold validation, we will break our data into k folds, usually between\
    \ 5 and 10. Test each fold and see how they performed across all the folds once\
    \ you are finished with testing. Usually, the larger your number for k is the\
    \ less biased your test will be. So far, we have talked about models interpreting\
    \ data to find meaning and patterns. But what kind of data are we going to use? \
    \ Where will we get our data, and what is it going to look like? Data is the most\
    \ critical component for machine learning. After all, your model will only learn\
    \ with data, so it’s important that you have data that is relevant and meaningful.\
    \ It came come in many shapes and sizes, structure differently depending on the\
    \ kinds of data. The more structured the data is, the easier it is to work with.\
    \ Some data has very little structure, and this data is harder to interpret. Data\
    \ for facial recognition can be huge and have very little meaning to the untrained\
    \ eye. Structured data is more organized. This is the type of data that you will\
    \ likely use when you are first starting out. It will help you get your feet wet,\
    \ and you can start understanding the statistic involved in machine learning.\
    \ Usually, structure data will come in a familiar form that looks something like\
    \ this, in rows and columns. This is called a tabular dataset. \n\n| Market Value\
    \  || num\\_bedrooms  || num\\_bathrooms  || Sq\\_ft  || pool (Y/N)  |\n\n| ---\
    \ | --- | --- | --- | --- |\n\n| $207,367  || 4  || 3  || 2635  || N  |\n\n| $148,224\
    \  || 3  || 2  || 1800  || Y  |\n\n| $226,897  || 5  || 3.5  || 2844  || Y  |\n\
    \n| $122,265  || 2  || 1.5  || 1644  || N  |\n\n|  ||  ||  ||  ||  |"
  fmt: '

    # Things you must know for machine learning


    To be successful with machine learning, you must have the right tools in order
    to work, just like if you were building a house, you would need to skills and
    the tools required. The following is a list of the required materials to do machine
    learning.


    ## Data


    To start working with your data, you have to have enough data to break it into
    two categories; training data and test data. Training data is the data you use
    in the beginning when you are building your model. When you are first creating
    your model, you need to give it some data to learn from. With training data, you
    will already know the independent variables as well as their respective dependent
    variables. This means that for every input, you will already know the output of
    your data. From this data, your model will learn to predict the output on its
    own. Our training data gives us the parameters we need to make predictions. This
    is the data that our machine learns from.


    Test data is the data that the machine gets once you are satisfied with the model,
    and you see what it does out in the wild. In this data, we only have the independent
    variables, but no output. With test data, we can see how well our model does at
    predicting an outcome with new data. Your training data should account for most
    of your data; approximately 70%, while your test data is the remaining 30%. In
    order to avoid bias, make sure that the data you choose for training data and
    test data is totally random when you split them up. Don’t choose which data to
    use; let it be random. Don’t use the same data for training and testing.


    Start by giving the training data to the machine and examine the relationships
    between `X` and `Y`, then try to see how well your model did. The most important
    question to consider during this process is whether your model will still work
    when it is presented with new data. You can test this by doing cross-validation.
    This means you will test your model on data you have not used yet. Keep some data
    to the side that you didn''t use during training to see how accurate your model
    is at the end. You can also use K-fold validation to check the accuracy of your
    model. This method is pretty easy to use and generally unbiased. It’s a good technique
    to use when we don’t have a lot of data to work with for testing.


    For K-fold validation, we will break our data into k folds, usually between 5
    and 10. Test each fold and see how they performed across all the folds once you
    are finished with testing. Usually, the larger your number for k is the less biased
    your test will be.


    So far, we have talked about models interpreting data to find meaning and patterns.
    But what kind of data are we going to use? Where will we get our data, and what
    is it going to look like? Data is the most critical component for machine learning.
    After all, your model will only learn with data, so it’s important that you have
    data that is relevant and meaningful. It came come in many shapes and sizes, structure
    differently depending on the kinds of data. The more structured the data is, the
    easier it is to work with. Some data has very little structure, and this data
    is harder to interpret. Data for facial recognition can be huge and have very
    little meaning to the untrained eye. Structured data is more organized. This is
    the type of data that you will likely use when you are first starting out. It
    will help you get your feet wet, and you can start understanding the statistic
    involved in machine learning. Usually, structure data will come in a familiar
    form that looks something like this, in rows and columns. This is called a tabular
    dataset.


    | Market Value | num\_bedrooms | num\_bathrooms | Sq\_ft | pool (Y/N) |

    | --- | --- | --- | --- | --- |

    | $207,367 | 4 | 3 | 2635 | N |

    | $148,224 | 3 | 2 | 1800 | Y |

    | $226,897 | 5 | 3.5 | 2844 | Y |

    | $122,265 | 2 | 1.5 | 1644 | N |

    | | | | | |

    '
  trans: '


    # 机器学习必须知道的事项


    要想在机器学习中取得成功，你必须拥有合适的工具来开展工作，就像盖房子一样，你需要具备所需的技能和工具。以下是进行机器学习所需的材料清单。


    ## 数据


    要开始处理数据，你必须拥有足够的数据，将其分为两类：训练数据和测试数据。训练数据是在你构建模型之初使用的数据。当你最初创建模型时，需要提供一些数据供其学习。使用训练数据时，你已经知道自变量以及它们各自的因变量。这意味着对于每个输入，你都已经知道数据的输出。从这些数据中，你的模型将学会自行预测输出。我们的训练数据为我们提供了进行预测所需的参数。这是机器学习所依据的数据。


    测试数据是你对模型满意后，机器获得的数据，用于查看其在实际环境中的表现。在这些数据中，我们只有自变量，但没有输出。通过测试数据，我们可以查看模型在使用新数据预测结果时的表现情况。你的训练数据应占据大部分数据，大约
    70%，而测试数据则是剩余的 30%。为了避免偏差，请确保你选择用于训练数据和测试数据的数据在分割时是完全随机的。不要选择使用哪些数据；让它保持随机。不要将相同的数据同时用于训练和测试。


    首先将训练数据提供给机器，并检查 `X` 和 `Y` 之间的关系，然后尝试查看你的模型表现如何。在此过程中需要考虑的最重要问题是：当模型面对新数据时，是否仍然有效。你可以通过交叉验证来测试这一点。这意味着你将在尚未使用过的数据上测试你的模型。留出一些在训练期间未使用的数据，以便在最后查看模型的准确性。你也可以使用
    K 折交叉验证来检查模型的准确性。这种方法非常易于使用，且通常无偏差。当我们没有大量数据可用于测试时，这是一种很好的技术。


    对于 K 折交叉验证，我们将数据分为 k 个折叠，通常在 5 到 10 之间。测试每个折叠，并在测试完成后查看它们在所有折叠中的表现。通常，k 的数值越大，测试的偏差就越小。


    到目前为止，我们一直在讨论模型如何解释数据以寻找意义和模式。但是，我们将使用什么样的数据呢？我们将从哪里获取数据，数据又会是什么样子？数据是机器学习中最关键的组成部分。毕竟，你的模型只会通过数据学习，因此拥有相关且有意义的数据非常重要。数据可以有多种形状和大小，结构会根据数据的类型而有所不同。数据越结构化，就越容易处理。有些数据结构非常简单，这类数据更难以解释。面部识别的数据可能非常庞大，且对未经训练的眼睛来说几乎没有意义。结构化数据更加有条理。这是你刚开始时可能会使用的数据类型。它将帮助你入门，并让你开始理解机器学习中涉及的统计知识。通常，结构化数据会以一种熟悉的形式出现，如下所示，按行和列排列。这被称为表格数据集。


    | Market Value | num\_bedrooms | num\_bathrooms | Sq\_ft | pool (Y/N) |

    | --- | --- | --- | --- | --- |

    | $207,367 | 4 | 3 | 2635 | N |

    | $148,224 | 3 | 2 | 1800 | Y |

    | $226,897 | 5 | 3.5 | 2844 | Y |

    | $122,265 | 2 | 1.5 | 1644 | N |

    | | | | | |


    '
