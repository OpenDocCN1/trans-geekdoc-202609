    of potential clients. Unsupervised learning can help us sort customers into categories
    that we might not have created with the help of machine learning. It can also
    help you sort your data when you are working with a large number of variables.


    ### K-Means clustering


    K-means clustering works similarly to K-nearest neighbors You pick a number for
    k to decide how many groups you want to see. You continue to cluster and repeat
    until clusters are more clearly classified. Your data is grouped around centroids,
    which are the points on your graph that you have chosen where you want to see
    your data clustered. You choose them at random, and you have k of them. Once you
    introduce your data to the model, data points are placed in categories indicated
    by the closest centroid, which is measured by Euclidean distance. Then you take
    the average value of the data points surrounding each centroid. Keep repeating
    this process until your results stay the same, and you have consistent clusters.
    Each data point is only assigned to one cluster. You repeat this process by finding
    the average values for x and y within each cluster. This will help you extrapolate
    the average value of the data points in each cluster. K-means clustering can help
    you identify previously unknown or overlooked patterns in the data. Choose the
    value for k that is optimal for the number of categories you want to create. Ideally,
    you should have more than 3. However, the advantage associated with adding more
    clusters diminishes that higher the number of clusters you have. The higher the
    value for k that you choose, the smaller and more specific the clusters are. You
    wouldn’t want to use a value for k that is the same as the number of data points
    because each data point would end up in its own cluster. You will have to know
