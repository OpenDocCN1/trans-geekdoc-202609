    # Unsupervised Learning


    Unsupervised machine learning uses unlabeled data. Data scientists don’t know
    the output of yet. The algorithm must discover patterns on its own, where patterns
    would otherwise be unknown. Find a structure in a place where the structure is
    otherwise unobservable. The algorithm finds data segments on its own. The model
