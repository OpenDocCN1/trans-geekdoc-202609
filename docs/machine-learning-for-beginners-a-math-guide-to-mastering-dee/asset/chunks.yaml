- raw: 'Supervised learning ![](rsrcWV.jpg)In supervised learning, programmers use
    labeled data. Before we begin using the algorithms, the data that we are looking
    at is already predetermined. We know the inputs and outputs we are looking for.
    X, and Y. We are trying to find a relationship between X and Y that we have chosen.
    After you find a relationship between X and Y, you get a model, which will predict
    an outcome based on those relationships that your machine has observed in the
    data. Supervised learning is used for regression and classification models. In
    machine learning, we refer to features as a certain measurable property or characteristic
    of the data. The first type of supervised learning that we''ll talk about and
    the first type of statistical model is called a regression. Regression is a model
    where the data input and output are continuous. There are different types of regression,
    but the most basic form is linear regression. We use linear regression to find
    a relationship between some input X and an output Y. Once we have estimated this
    relationship, we can predict Y with X. Linear models can, and usually do, have
    more than one X. In regression; output Y has a numerical value. Regression Analysis
    Regression is the simplest type of machine learning; this is usually where you
    start when you are first learning how to use your data. You have a set of X values,
    and you want to study their relationship with Y, the output. Our independent variables,
    the Xs in our model, are given weight, and for each value of X, it is multiplied
    by weight until the aggregate function creates a prediction for Y. We can create
    a predictive model for Y by using data where we already know the X and Y. Regressing
    this information will give us the weights of X. If we have enough relevant data,
    eventually we will be able to predict and unknown Y with known values for X. We
    graph our known Y and X values on a scatterplot, and our regression model finds
    the “best fit” line through the data points. The regression line is called a hyperplane.
    The steepness of the line is called the slope. We can measure the distance between
    the predicted value and actual data point, and we call that measurement deviation.
    Our goal when we create a linear regression is the minimize the deviation in our
    predictions. The smaller that difference, the deviation is, the more accurate
    your model is. Most of the statistical models used in machine learning are rooted
    in this first algorithm. Creating a model that will predict an outcome by plotting
    our data points along a line or in clusters. But the line isn’t always straight,
    and sometimes the line doesn’t show us the best fit. An example of a regression
    function that is nonlinear is the Sigmoid function. The Sigmoid function creates
    an S-shaped curve. Instead of predicting a value, the Sigmoid function takes independent
    variables and produces a probability between one and zero. Simple Linear Regression
    . In simple linear regression, we study the relationship between some predicted
    value Y and some predictor X. We call our Y the dependent variable because it
    is dependent on the value of X. Our X is known as the independent variable. If
    you took algebra or pre-calculus in high school or college then you might remember
    the equation of a line was; Y = mX+b If you were to graph this equation, then
    you would have a graph that looks something like this: ![A close up of a logo
    Description automatically generated](rsrcWW.jpg)As you can see, the line shows
    that for every value of X there is a different value of Y. You can make a prediction
    for the value of Y for every new value of X. In this graph, the value of Y increases
    as the value of X increases. This is not always the case. This is the most simplistic
    regression, but it’s important to understand how it works because we will be building
    off it from here on out. Most of the statistical analysis involves a plot like
    the one pictured above, which makes some prediction for an output dependent variable
    based on an input, the independent variable. This is an example of supervised
    learning because we are specifying the Y variable and the X variable that we are
    using before we start modeling. With almost all predictions, there will be more
    than one independent variable that will determine our dependent variable. This
    leads us to our next type of regression. Multiple Linear Regression . In data
    science and most tasks in statistics, this will be the most popular type of regression.
    In multiple linear regression, we will have one output variable Y, just like before.
    The difference now though, is that we will have multiple Xs or independent variables
    that will predict our Y. An example of using multiple linear regression to predict
    the price of apartments in New York City real estate. Our Y or dependent variable
    is the price of a New York City apartment. The price will be determined by X,
    our independent variables such as the square footage, distance to transportation,
    number of rooms. If we were to write this out as an expression it would look something
    like: apt\_price = β0 + β1 sq\_foot + β2 dist\_transport + β3 num\_rooms We take
    sample data, data that we already have where we know our Xs and their Ys and we
    look at them on a graph like this: ![A close up of a logo Description automatically
    generated](rsrcWX.jpg)![A screenshot of a cell phone Description automatically
    generated](rsrcWY.jpg)You can see that the values of X and Y don’t create a perfect
    line, but there is a trend. We can use that trend to make predictions about future
    values of Y. So, we create a multilinear regression, and we end up with a line
    going through the middle of our data points. This is called the best fit line,
    and its how we will predict our Y when we get new X values in the future. The
    difference here is that instead of writing m for slope, we have written β. This
    equation is pretty much the same thing as if I had written Y = b + m1X1 + m2x2
    + m3x3 Except now we have labels, and we know what our Xs and our Ys are. In the
    future, if you see a multilinear equation, then it will most likely be written
    in this form. Our β is what we call a parameter. It''s like a magic number that
    tells us the effect that the value of our X has on the Y. Each independent variable
    will have a unique parameter. We find the parameters by creating a regression
    model. Over time, with machine learning, our model will be exposed to more and
    more data so that our parameter will improve, and our model will become more accurate.
    We can create the model by using training data that has the actual price of New
    York City apartments, and the actual input variables of square footage, distance
    to transportation, and many rooms. Our model will ‘learn'' to approximate the
    price from real data. Afterward, when we plug in the independent variable for
    an apartment which has an unknown price, our model can make a prediction as to
    what the price will be. This is supervised learning using a linear regression
    model. It’s supervised because we are telling the model what answer we want it
    to give us; the price of New York City apartments. It learns how to predict the
    price more accurately, as it is given more data, and we continue to evaluate its
    accuracy. Ordinary Least Squares OLS will try to find a regression line that minimizes
    the sum of errors squared Polynomial Regression . Our next type of regression
    is called a polynomial regression. In the last two types of regression, our models
    created a straight line. This is because the relationship between our X and Y
    are linear, meaning that the effect X has on Y doesn’t change as the value of
    X changes. In polynomial regressions, our model will result in a line that has
    a curve. If we tried to use linear regression to fit a graph that has nonlinear
    characteristics, we would do a poor job of creating the best fit line. Take the
    graph on the left, for example; the scatter plot has an upward trend like before,
    but with a curve. In this case, a straight line doesn’t work. Instead, with a
    polynomial regression, we will create a line with a curve to match the curve in
    our data, like the graph on the right  ![A close up of a device Description automatically
    generated](rsrcWZ.jpg)![A close up of a logo Description automatically generated](rsrcX0.jpg)The
    equation of a polynomial will look like the linear equation, with the difference
    being that there will be some polynomial expression attached to one or more of
    our X values. For example: Y = mX2+b The effect that X has on Y changes exponentially
    as the value for X changes. Support Vector Regression . This is another important
    tool for data scientists and one that you should familiarize yourself with. It
    is most commonly used in case classification. The idea here is to find a line
    through a space that separates data points into different classes. Support Vector
    Regression is another type of supervised learning. Its also used for regression
    analysis. It is a type of binary classification technique not related to probability.
    ![](rsrcX1.jpg)In support of Vector Regression, all your training data falls into
    one category or the other. You want to find out which category a new data point
    falls into. Your data is separated into these two classes by a hyperplane. When
    you''re creating a model for the hyperplane, you are trying to find a hyperplane
    that maximizes the distance between the two classes. For example, in the next
    picture, you have a scatterplot where the data points can be separated into two
    distinct classes. In this instance, lines one and three can separate the data
    points into two distinct classes. However, for your model, you should choose line
    two because it maximizes the margin between the two classes, so they are more
    distinct. The wider the margin is, the better. ![](rsrcX2.jpg)Ridge Regression
    . This is a technique commonly used to analyze data that suffer from multicollinearity.
    Using ridge regression properly can reduce standard errors and make your model
    more accurate, depending on the characteristics of your data. Ridge regression
    can be useful when your data contains independent variables with a high correlation.
    If you could make a prediction about an independent variable by using another
    independent variable, then your model is at risk of multicollinearity. For example,
    if you are using variables that measure a person’s height and weight; these variables
    are likely to create multicollinearity in the model. Multicollinearity can affect
    the accuracy of your predictions. To avoid multicollinearity, be cognizant of
    the type of predictive variables you are using. Type of data you are using, as
    well as the method of collection,  could be the cause of multicollinearity. There
    is a chance you may not have selected a broad enough range of independent variables.
    Your data points could be too similar because your choice of independent variables
    is limited. Multicollinearity can also be caused by having a model that is too
    specific. You have more variables than you have data points. If you have decided
    to use a linear model, and that has made multicollinearity worse, then you can
    try to apply a ridge regression technique. Ridge regression works by allowing
    a little bit of bias into the model in order to make your predictions more accurate.
    This technique is also known as regularization. Another method is to improve the
    model''s accuracy by standardizing independent variables. The simplest way is
    to change the coefficients of some independent variables to zero to reduce complexity.
    However, we won''t just change them to zero, but standardization implements a
    system that rewards coefficients that are nearer to zero. This will cause coefficients
    to shrink, so the complexity of the model is less, but the independent variables
    remain in the model. This will give the model more bias, but it''s a trade-off
    for more accurate predictions. LASSO Regression . LASSO regression is another
    ‘shrinkage’ technique. A very similar approach to ridge regression in that it
    encourages leaner, simpler models for prediction. In lasso regression, the model
    is a little more stringent about reducing the value of coefficients. LASSO stands
    for the least absolute shrinkage and selection operator. Data on our scatterplot
    is shrunk down to a more compact point, like the average of the data. Just like
    ridge regression, we use this when the model is suffering from multicollinearity.
    ElasticNet Regression . ElasticNet regression works by combining the techniques
    of LASSO and ridge regression. Its main goal is to attempt to improve upon LASSO
    regression. It is a combination of both the methods of rewarding lower coefficients
    in LASSO and Ridge regression. All three of these models can be accessed in the
    glmnet package in R and Python. Bayesian Regression . Bayesian regression models
    are helpful when we have insufficient data or data with poor distribution. These
    types of regressions are created using probability distributions rather than data
    points, which means that the graph will appear as a bell curve representing the
    variance with the most frequently occurring values in the middle of the curve.
    In Bayesian regression, the dependent variable Y is not a value but a probability.
    Rather than trying to predict a value, we are trying to predict the probability
    of an outcome. This is known as frequentist statistics, and Bayes theorem makes
    up the foundation for this type of statistics. Frequentist statistics hypothesize
    whether something will happen, and the probability that it will happen. When we
    talk about frequentist statistics, we also include conditional probability. Conditional
    probability involved events whose outcomes are dependent on one another. Every
    time you toss a coin, it is an independent event meaning that the previous coin
    toss does not change the likelihood of the next coin toss. Flipping a coin toss,
    therefore, is not a conditional probability. Events can also be dependent, meaning
    that the previous event can change the probability of the next event. Say I had
    a bag of marbles, and I wanted to know the probability drawing different colors
    out of the bag. If I have a bag with 3 green marbles and 3 red marbles, and I
    draw a red marble, then the probability of drawing a red marble goes down on my
    next draw. This would be an example of conditional probability. Decision trees
    One of the models that we’ll discuss later is called neural networks. They’re
    the most advanced types of machine learning and are used for many different purposes.
    I’ve related this to decision trees because of how frequently people turn to neural
    networks for classification problems when there are much simpler models available.
    Decision trees and the related random forest models can be just as useful. Despite
    the power of neural networks, they can’t be used for everything. Fortunately,
    we have options, and the purpose of this book is to know what your options are
    when you decide you want to build a model. The next place to look when neural
    networks don’t work is decision trees. Decision trees break data into subcategories
    using decision and leaf nodes in the shape of a tree. Decision trees have a few
    advantages over neural networks (discussed later in this chapter). For one thing,
    neural networks require huge amounts of data and powerful computers in order to
    process them. The upside to using a decision tree is that they are relatively
    simple, especially when you compare them to neural networks. Unlike most of the
    models in this book, they are very easy to read a decision tree, even to the untrained
    eye. This makes them a good candidate when choosing a model that needs to be presented
    in front of stakeholders. Decision trees are another form of supervised learning,
    meaning that we label the categories that we want to sort before creating the
    model. In some instances, decision trees can complete regression tasks, but typically
    they are used as classification models. When decision trees are used for regression,
    the leaf nodes end in probabilities. Decision trees start with what’s called a
    root node at the top of the tree. Then the root node is split into two nodes after
    the root node. Nodes are individual leaves on the tree, and the middle nodes are
    where the decisions are made, known as the decision nodes. The decision tree ends
    at the bottom in what’s called a terminal node is at the bottom of a branch, where
    the decision is complete. Ideally, the decision tree will sort the data quickly,
    layer by layer. Because of this, we call the model ‘greedy'' because the top nodes
    try to sort the data as quickly as possible so that it requires fewer layers.
    Like neural networks, decision trees often suffer from overfitting. A decision
    tree usually won''t work with other sets of data because the sorting is so specific
    to each dataset. ![](rsrcX3.jpg)Below is an example of a decision tree about whether
    or not to grant a job applicant a job interview determined by qualification factors.
    The root node is whether or not the applicant has a college degree, followed by
    the decision modes which all lead to either a decision not to hire or grant an
    interview. You can see from this decision tree why this type of model is so specific
    to the specific data you are working with because every data set will have differences
    in qualifications and so every dataset will be sorted differently. ![](rsrcX4.jpg)Random
    forests Using just one decision tree on your model can have a limiting factor
    on the categories that the data is split in to, and the outcome of the decisions.
    Because the decision trees are ‘greedy’, this means that certain categories are
    chosen for sorting, which prohibits other categories from also being chosen. But
    there is an easy way to get around that. One way to diversify your decision trees
    and improve the accuracy of your model is by using random forests. If a real forest
    is made up of several different trees, then that’s exactly what a random forest
    is. Instead of just having one decision tree, you split the data into several
    decision trees. When you only have one tree, models can often suffer from high
    variance. Creating a random forest is a way to combat that in your model. It’s
    one of the best tools available for data mining. A random forest is as close as
    you can get to a pre-packaged algorithm for data mining purposes. In a random
    forest, all the trees work together. The aggregate result of all the trees is
    usually right, even if a few trees end up with bad predictions. To create the
    final prediction, the results of all the trees are tallied. Using votes from the
    average values of all the trees gives us a final prediction. Because we are using
    data that is similar, there is a risk of correlation between the trees if they
    are all trying to do the same thing. If we use trees that are less correlated,
    then the model will perform better. Imagine that we were to bet on a coin flip.
    We each have a hundred dollars, and there are three choices. I can flip the coin
    once, and the winner of that toss gets to keep 100$. Or, I could flip the coin
    ten times, and we bet ten dollars each time. The third option is to flip the coin
    100 times and bet a dollar on each toss. The true expected outcome of each version
    of this game is the same. But if you did 100 coin tosses, you are less likely
    to lose all your money than if you only did a single coin toss. Data scientists
    call this method bootstrapping. It’s the machine learner’s equivalent of diversifying
    a stock portfolio. We want to have a model that gives us an accurate prediction.
    The more we split our decision trees, the more accurate our data will be. But
    it’s important that the individual trees have a low correlation to one another.
    The trees in the forest need to be diverse. How do we avoid correlation in a random
    forest? First, each tree takes a random sample from the dataset, so that each
    tree has a slightly different set of data from one another. The tree picks a feature
    that creates the most separation between nodes, in a greedy process, just like
    as individual trees. However, in a random forest, trees can only pick certain
    features from the overall group of features, so each tree separates by different
    features. So, the trees will be uncorrelated because they are using different
    features to make decisions about classification. In a random forest, its best
    to use at least 100 trees for getting an accurate picture of the data, depending
    on the data set you are working with. In general, the more trees you have, the
    less your model will overfit. Random forest machine learning is called it a ‘weakly-supervised
    technique’ because our outcome is chosen, and we can see the sorting method, but
    it’s up to each tree to categorize and separate variables by features. Classification
    models will tell us which category something falls in to. The categories are defined
    by the programmer at the beginning. An example of a classification model could
    use a random forest would be a model that determines whether incoming emails should
    spam go in your ‘inbox’ or ‘spam’ folder. To create the model, we make two categories
    that our Y can fall in to; spam, and not spam. We program the model to look for
    keywords or certain email address that may indicate spam. The presence of words
    like “buy” or “offer” will help the model determine whether the email message
    falls into the category of spam or not spam. The algorithm takes in data, and
    over time, it learns by comparing its predictions to the actual value of the output.
    Over time it makes small adjustments to its model so that the algorithm becomes
    more efficient over time. '
