    # How is machine learning used?


    ![](rsrcWM.jpg)


    Machine learning is a popular buzzword nowadays. You have often heard the term
    machine learning thrown around, especially in data science for digital marketing.
    Other familiar terms like artificial intelligence, data science, and data mining
    may seem synonymous with machine learning. There are slight differences between
    these different fields, which all fall under the umbrella of data science. Data
    science is the management and analysis of data, and within data science, there
    are many ways to analyze the data and use it to learn. Machine learning is its
    own field of study within the realm of computer science. The idea is to predict
    something, and as you add more data, compare predictions to actual outputs. Over
    time, your ability to predict should improve, and errors will be reduced.


    One of the most important functions of the human brain is the ability to change
    our behavior based on the outcomes of past events and situations. If a situation
    has a positive outcome, we remember that, and in turn, if a situation has a negative
    outcome, we also store that in our memory. Later, we’ll use this ‘data’ to make
    decisions about new situations. Over time, we learn how to interpret situations,
    even if they are totally new, and we aren’t totally sure how to behave or respond.
    Machine learning helps us create a mathematical way of copying the human ability
    to learn over time and through a new experience. Machine learning models learn
    over time and improve their methods of predictions, therefore improving outcome.
    Past data is compiled, and over time, the model can make better and more accurate
    predictions. Over time, the program will be able to make more accurate predictions
    because of the new data it’s been given. It learns over time how to do a better
    job at completing a given task.


    Some of it has inspired science fiction, spurring fears that artificial intelligence
    will surpass us and take over the world. Eventually, our machines will be able
    to do everything that we can do, but better. Our computers will surpass us and
    leave us behind. Despite common fears, artificial intelligence is still a relatively
    young field with a long way to go. While it may not take over the world anytime
    soon, machine learning has changed the job market today, and it will only continue
    to change it in the future. Jobs that used to require human thinking can now be
    done with machine learning. Factories, medical diagnosis, and even taxis have
    the potential to be done using artificial intelligence and machine learning.


    Data is becoming an ever more important field of study. Patterns in data can be
    impossible to interpret with a human brain, which is why we use machines to detect
    patterns. In finance, machine learning is being used to detect fraud. Algorithms
    are now capable of detecting when a financial transaction has characteristics
    of fraud. Companies can spot fake reviews by recognizing word patterns and timing
    for review postings that are more likely to be fake. Our phones use speech recognition
    to understand what we are saying and to respond to our requests. Social media
    uses complex data analysis to recognize patterns in our photos and can tell who
    is in a picture before we even begin tagging. All of this is done by the collection
    of data and interpretation through machine learning. The patterns in photographs
    that tell who appears is data which is analyzed and improved upon by machine learning
    models.


    In 1959, Arthur Samuel first popularized the term “machine learning.” A graduate
    of MIT, he chose to create a computer program that could play checkers. He chose
    checkers because of its relative simplicity, but also because checkers contains
    many possible strategies. This predated IBMs deep blue, but the theory was the
    same. Let the computer learn over time with new data. The computer considered
    the positions of every checker piece, and each potential move. Each move had a
    score with the probability of winning. The algorithm included factors like the
    number of pieces on the board and the number of pieces that had been kinged. The
    algorithm memorized every combination of positions that it experienced, in a process
    called rote learning. For each of these combinations, it remembered the score
    of the probability of winning. Over a few years, Samuel played countless games
    with the machine in order to teach it how to play. Machine learning was coined
    to express what the machine was doing to learn how to beat opponents. The machine
    had to learn how to play checkers and learn how to reduce its errors to win. This
    was the first time that machine learning was talked about as its own independent
    field of study outside of computer science or artificial intelligence.


    Sandford University refers to machine learning as "The science of getting computers
    to act without being explicitly programmed." Samuel''s computer didn''t have to
    be programmed to remember every possible checkers move. Instead, the ‘experience''
    that the machine gained served as data, and it learned from each game to optimize
    its strategy for winning.


    Statistics offers the structure and mechanics for machine learning. Despite the
    birth of the term machine learning in 1959, it has only been recognized as a separate
    field of computer science first since about the 1990s with the advent of Deep
    Blue. Normal computer programming uses an input command to direct the model. An
    example of this would be plugging `4+4` into your `python` window. It will give
    you the answer, `8`. Instead, machine learning uses what''s called input data.
    Input data is what the machine needs to learn, whereas input command would mean
    that the machine is not self-learning. The programmer doesn''t specify what he
    wants the answer to be. Instead, the machine interprets the data on its own, which
    makes it self-learning.


    In machine learning, the machine takes data over time and uses it to create a
    new model for something. The machine will detect patterns and structure within
    data, based totally in statistical logic. It is completely based on mathematical
    algorithms. Rather than using intuition to search for patterns, patterns our found
    at a quantitative and logical level by the machine learning model. The more relevant
    data a machine is exposed to, the better it understands and can predict the outcome
    of the model. Machine learning is only useful if you can make it improve the efficiency
    of the task you are trying to achieve. Before you begin with your data, you need
    to think specifically about what you are trying to learn. What is the question
    you are trying to answer with your machine learning model? The environment is
    always changing, and if you want to create models that are up to date and work
    in the changing environment, then you need to continue to teach your model with
    new data. If you want your data to be useful to you, then you need to find a way
    to keep your data up to date with the current questions. Find out as much as you
    can about your market, or about the environment that you are operating in. What
    kind of things are you trying to understand? If you are using machine learning
    to improve your business, then find out what kinds of variables make up your customers
    choices. These are the things you want to identify and study in your models. You
    must have a good understanding of your subject before you can use machine learning
    to study it. It’s impossible to predict the future, even with machine learning
    at your disposal. But if you can adapt your models to the ever-changing data,
    then you will have a better shot in the long run than if you stay stagnant.


    Before you start, you should have a good amount of knowledge of the data you are
    choosing. Where did it come from, and how was it collected? What format is it
    in, and what will the challenges be while interpreting it? These are the types
    of questions you should be asking when you begin, and I hope that with this book,
    you''ll be able to look critically at the data before you begin. It''s not a one-size-fits-all
    approach to predicting the future, and it won’t give you the magic formula for
    anticipating future business trends or stock prices. But it is an incredibly useful
    tool that when used right, can make decision making much easier.


    Opportunities to experiment with machine learning are growing. It''s a challenge
    today to find the right people to fill the jobs required for the development of
    machine learning and artificial intelligence. It''s a specialized field, and there
    is a short supply of people with statistical and computer science knowledge to
    move the field forward. This means there is an opportunity for people who possess
    the skills necessary for machine learning.

    '
  trans: '


    # 机器学习如何应用？


    ![](img/rsrcWM.jpg)


    机器学习如今是一个热门的流行词。你经常听到机器学习这个术语被提及，尤其是在数字营销的数据科学领域。其他熟悉的术语，如人工智能、数据科学和数据挖掘，可能看起来与机器学习同义。这些不同领域之间存在细微差别，它们都属于数据科学的范畴。数据科学是数据的管理和分析，在数据科学领域内，有许多分析数据并利用其进行学习的方法。机器学习是计算机科学领域内的一个独立研究领域。其理念是预测某事，并在添加更多数据时，将预测与实际输出进行比较。随着时间的推移，你的预测能力应该会提高，错误也会减少。


    人脑最重要的功能之一，就是根据过去事件和情况的结果改变我们行为的能力。如果一种情况有积极的结果，我们会记住它；同样，如果一种情况有消极的结果，我们也会将其存储在记忆中。之后，我们会利用这些“数据”来对新情况做出决策。随着时间的推移，我们学会如何解读情况，即使它们是全新的，我们也不确定该如何行为或反应。机器学习帮助我们创造一种数学方式，来模仿人类随时间推移和通过新经验学习的能力。机器学习模型随时间推移而学习，并改进其预测方法，从而改善结果。过去的数据被汇编，随着时间的推移，模型可以做出更好、更准确的预测。随着时间的推移，程序将能够根据所获得的新数据做出更准确的预测。它学习如何随时间推移更好地完成给定的任务。


    其中一些内容启发了科幻小说，引发了人们对人工智能将超越我们并统治世界的恐惧。最终，我们的机器将能够做我们所能做的一切，而且做得更好。我们的计算机将超越我们并将我们甩在后面。尽管有普遍的恐惧，人工智能仍然是一个相对年轻的领域，还有很长的路要走。虽然它可能不会在短期内统治世界，但机器学习已经改变了当今的就业市场，并且未来只会继续改变它。过去需要人类思维的工作，现在可以通过机器学习来完成。工厂、医疗诊断，甚至出租车都有可能使用人工智能和机器学习来完成。


    数据正成为一个越来越重要的研究领域。数据中的模式可能无法用人脑来解读，这就是为什么我们使用机器来检测模式。在金融领域，机器学习被用于检测欺诈。算法现在能够检测金融交易何时具有欺诈特征。公司可以通过识别更可能是虚假的评论发布的词语模式和时间来发现虚假评论。我们的手机使用语音识别来理解我们在说什么，并响应我们的请求。社交媒体使用复杂的数据分析来识别我们照片中的模式，甚至在我们开始标记之前就能告诉我们照片里是谁。所有这些都是通过数据的收集和机器学习的解读来完成的。照片中表明谁出现的模式是数据，由机器学习模型进行分析和改进。


    1959 年，Arthur Samuel 首次推广了“机器学习”这一术语。他是 MIT 的毕业生，选择创建一个可以下棋的计算机程序。他选择跳棋是因为它相对简单，但也因为跳棋包含许多可能的策略。这早于
    IBM 的深蓝，但理论是相同的。让计算机随着新数据随时间推移而学习。计算机考虑了每个跳棋子的位置和每个潜在的移动。每个移动都有一个获胜概率的得分。算法包括棋盘上棋子的数量和已升王的棋子数量等因素。算法记忆了它经历过的每一种位置组合，这个过程称为死记硬背学习。对于这些组合中的每一个，它都记住了获胜概率的得分。几年里，Samuel
    与机器进行了无数场比赛，以教它如何下棋。机器学习一词被创造出来，以表达机器为了学习如何击败对手所做的事情。机器必须学习如何下棋，并学习如何减少错误以获胜。这是机器学习第一次被讨论为计算机科学或人工智能之外的独立研究领域。


    斯坦福大学将机器学习称为“无需明确编程即可让计算机采取行动的科学”。Samuel 的计算机不需要被编程来记住每一种可能的跳棋移动。相反，机器获得的“经验”充当了数据，它从每场比赛中学习以优化其获胜策略。


    统计学为机器学习提供了结构和机制。尽管机器学习一词诞生于 1959 年，但直到大约 1990 年代随着深蓝的出现，它才被承认为计算机科学的一个独立领域。普通计算机编程使用输入命令来指导模型。例如，将`4+4`插入你的`python`窗口。它会给你答案`8`。相反，机器学习使用所谓的输入数据。输入数据是机器需要学习的内容，而输入命令意味着机器不是自我学习的。程序员不指定他想要的答案是什么。相反，机器自行解释数据，这使其成为自我学习的。


    在机器学习中，机器随时间推移获取数据，并用它来为某事创建新模型。机器将基于完全的统计逻辑检测数据中的模式和结构。它完全基于数学算法。机器学习模型不是使用直觉来搜索模式，而是在定量和逻辑层面发现模式。机器接触到的相关数据越多，它就越能理解并预测模型的结果。机器学习只有在能提高你试图完成的任务效率时才有用。在开始处理数据之前，你需要具体思考你想要学习什么。你试图用机器学习模型回答什么问题？环境总是在变化，如果你想创建与时俱进并在变化环境中工作的模型，那么你需要继续用新数据来教导你的模型。如果你希望你的数据对你有用，那么你需要找到一种方法，使你的数据与当前的问题保持同步。尽可能多地了解你的市场，或你所运营的环境。你试图理解什么样的事物？如果你使用机器学习来改善你的业务，那么找出构成你客户选择的变量有哪些。这些是你想要在模型中识别和研究的事物。在使用机器学习研究某个主题之前，你必须对该主题有良好的理解。即使有机器学习可用，也不可能预测未来。但如果你能让模型适应不断变化的数据，那么从长远来看，你比保持停滞不前更有机会成功。


    在开始之前，你应该对所选择的数据有充分的了解。它来自哪里，是如何收集的？它是什么格式，在解读时会面临哪些挑战？这些是你开始时应该提出的问题类型，我希望借助这本书，你在开始之前能够批判性地审视数据。这不是一种适用于所有情况的预测未来的方法，也不会给你预测未来商业趋势或股票价格的魔法公式。但它是一个非常有用的工具，当正确使用时，可以使决策变得容易得多。


    尝试机器学习的机会正在增加。今天的挑战在于找到合适的人来填补机器学习和人工智能开发所需的工作岗位。这是一个专业领域，拥有统计学和计算机科学知识以推动该领域发展的人才供应短缺。这意味着，对于具备机器学习所需技能的人来说，存在着机会。


    '
