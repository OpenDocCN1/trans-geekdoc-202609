    # Reinforcement Learning


    Reinforcement learning is our third kind of machine learning. Like unsupervised
    learning, no inputs are given. The reinforcement learning model must discover
    on its own how to be the most effective. Then, the data scientist makes suggests
    improving the model based on its ability to predict an outcome, which is evaluated
    by looking at comparisons between prediction and actual value. This is the most
    progressive type of machine learning, and where much of the machine learning in
    the future will be done. Think of it like playing a game; over time, you learn
    by winning and losing. You learn how to win by playing, and the more you become
    familiar with the game, the better you understand the mechanics of winning. Over
    time, the data scientist gives the model feedback as it collects and processes
    data. It receives a reward signal so that it knows when it is doing a good job
    of predicting some outcome. So ‘winning’ the game gives positive feedback to the
    algorithm. This is the type of machine learning used in gaming, robots, navigation,
    and self-driving cars.


    ## Q Learning


    In Q-learning, the model communicates with its environment to improve itself.
    You begin by having a set of states. States are the things in the environment
    which stand as obstacles and avenues in your environment. Called “S.” In chess,
    it would be the way that all of your pieces could move, as well as where all of
    your opponent’s pieces are. These are states. The possible moves are called ‘A.’
    If you are a pawn, your possible moves are one square forward. If you''re a rook,
    your possible moves are in any direction in a straight line. Q is the value of
    the model, which starts at 0. As you play the game, Q goes up and down depending
    on its interactions with the environment. With negative interactions, the score
    Q goes down. With positive interactions, the score Q goes up. The algorithm learns
    how to move so that it can optimize the number Q. In the beginning, it''s random.
    Over time, these random movements result in positive and negative effects on Q,
    and the machine learns how each move will affect the score of Q. It must play
    a lot of games to improve the way it plays over time. It''s much easier said than
    done to apply this process in real life.


    ## SARSA


    State Action Reward State Action There is only a small difference between SARSA
    and Q. They function similarly in giving the model a reward response.


    ## Deep Q network


    Deep Q is applied when regular Q isn’t general enough. When it sees new things
    that it hasn’t seen before, it doesn’t know what to do. Q learning can’t adjust
    itself for things it has never seen. Deep Q uses a neural network.


    ## Markov Decision Process


    Has a Set of possible states, a set of models, a set of possible actions, and
    a real value reward. This model learns by interacting with the environment through
    ongoing interaction.


    ## DDPG


    Deep Deterministic Policy Gradient Another reward state model functions as an
    actor and a critic.


    ## Semi-Supervised learning


    This type of machine learning uses a combination of supervised and unsupervised
    learning. Some data is labeled while other data is not. But typically, most data
    will be unlabeled. Semi-supervised learning can be used for classification, regression,
    and prediction. Semi-supervised machine learning is helpful because labeling everything
    would be too time-consuming, and it can harm the ability to find new patterns.


    # Ensemble Modeling


    We’ve learned that diversifying our trees can create a more accurate prediction.
    But what if, instead of using several versions of the same model, we just used
    several different models? This is a common trick in machine learning, known as
    ensemble modeling. By combining information from multiple different types of algorithms,
    we can improve our model’s accuracy and ability to forecast. Ensemble modeling
    is all about the divide and conquers mindset. Different models will give us different
    insights about the data that may not be recognizable by other models. By combining
    the information attained from different models, we can learn even more about the
    truth of our data. Ensemble modeling also helps to minimize bias and variance
    in our predictions. Individual models may have prediction errors, but the aggregate
    of all our predictions will be more accurate.


    There are a few different methods to use ensemble modeling: The first is to take
    the mode of your predictions. That is, take the value which occurs most frequently
    across the models. Whichever prediction occurs the most frequently, or has the
    highest number of ‘votes,’ is the prediction we choose. We could also take the
    average of all the predictions, depending on what kind of models we have. The
    average of all the predictions will be our final prediction. Our ensemble should
    also consider the reliability of individual models. The results of our models
    receive different weights, making some predictions more important than others
    based on reliability.


    How do we know which kind of models we want to combine? We already know from this
    book that there are several types of models to choose from, each giving us different
    possibilities and advantages. A common pair of models is using neural networks
    and decision trees together. Neural networks give us new information, and the
    decision tree ensures that we have not missed anything. In addition to the bootstrapping
    and bagging that we discussed earlier, there are a few other ways of doing ensemble
    modeling. Data scientists use what’s called a bucket of models. Here they use
    several different types of models to use with the test data and then choose the
    one that did the best. Another idea is called stacking. Stacking uses several
    different types of models and then uses all the results to give us a prediction
    that is a combination of all of them. Data scientists like to use ensemble modeling
    because, with a variety of models, we can usually produce better predictions than
    with a single model alone. The drawback to ensemble modeling is that we lose some
    of our readability. Having multiple models working together at once makes interpretation
    more difficult, especially when you want to share the data with stakeholders who
    don’t have data science knowledge.


    We can also use several versions of the same model, like how random forests improve
    the forecast with multiple versions of itself — using neural networks with different
    sets of nodes and different values for k, or numbers of clusters to see how that
    changes the outcome of our prediction and find if there is an optimal value for
    k, or if there are groups or subgroups that we may have overlooked. It doesn’t
    do as much when we already have a strong model. But if we combine a few models
    that have weaker forecasting abilities, then it usually improves the overall accuracy.

