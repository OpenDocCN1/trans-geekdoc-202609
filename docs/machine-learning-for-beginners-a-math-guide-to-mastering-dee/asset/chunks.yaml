    # 无监督学习


    无监督机器学习使用未标记的数据。数据科学家尚未知道输出结果。算法必须自行发现模式，而这些模式原本是未知的。在原本无法观察到结构的地方找到结构。算法自行发现数据片段。模型在原本未标记且无法识别的数据堆中寻找模式和结构。无监督学习使我们能够在没有计算机科学家的情况下无法观察到的模式。有时，大量数据集合中存在模式，而要筛选所有数据以寻找趋势几乎是不可能的。这对于检查消费者的购买习惯非常有用，以便您可以根据其行为中的模式将客户分组到不同的类别中。模型可能会发现市场不同子集之间的购买模式存在相似之处，但如果没有模型来筛选这些大量复杂的数据，您将永远无法意识到这些模式的本质。无监督学习的美妙之处在于，有可能在大量数据集中发现模式或特征，而没有模型的帮助您无法识别这些模式或特征。无监督学习的一个好例子是欺诈检测。欺诈可能是金融公司的一个重大问题，随着大量日常用户的存在，如果没有机器学习工具的帮助，公司很难识别欺诈。模型可以学习如何识别欺诈，因为欺诈手段会随着技术的变化而变化。如果您想应对新的、未知的欺诈技术，那么您需要使用一个能够在独特情况下检测欺诈的模型。在欺诈检测的情况下，拥有更多数据更好。欺诈检测服务必须使用一系列机器学习模型才能有效地打击欺诈。使用监督和无监督模型。预计明年（2020
    年）将有约 320 亿美元的信用卡欺诈活动。用于欺诈检测的模型将输出（信用卡交易）分类为合法或欺诈。它们可以根据一天中的时间或购买地点等特征进行分类。如果商家通常的销售额在
    20 美元左右，突然从一个陌生地点产生了一笔 8000 美元的销售额，那么模型很可能会将此交易分类为欺诈。使用机器学习进行欺诈检测的挑战在于，大多数交易并非欺诈。如果非欺诈交易中存在大量欺诈交易，那么信用卡行业将不可行。欺诈卡交易的百分比非常小，以至于可能会创建向该方向偏斜的模式。来自陌生地点的
    8000 美元购买行为是可疑的，但更可能是旅行持卡人的结果，而不是欺诈活动。无监督学习使识别可疑的购买模式（如陌生的送货地点和用户评论中的随机跳跃）变得更加容易。


    ## 聚类


    聚类是无监督学习的一个子组。聚类是将相似事物归类在一起的任务。当我们使用聚类时，可以识别特征并根据这些特征对数据进行排序。如果我们使用机器学习进行营销，聚类可以帮助我们识别潜在客户群体中的相似之处。无监督学习可以帮助我们将客户分类到我们可能无法借助机器学习创建的类别中。它还可以在您处理大量变量时帮助您对数据进行排序。


    ### K-Means 聚类


    K-Means 聚类的工作原理与 K-最近邻相似。您选择一个 k 值来决定希望看到多少个组。您继续进行聚类并重复，直到聚类被更清晰地分类。您的数据围绕质心分组，质心是您在图表上选择的、希望看到数据聚集的点。您随机选择它们，并且有
    k 个。一旦将数据引入模型，数据点将被放置在由最近质心指示的类别中，最近质心是通过欧几里得距离来衡量的。然后，您取每个质心周围数据点的平均值。继续重复此过程，直到结果保持不变，并且您拥有稳定的聚类。每个数据点只分配给一个聚类。您通过查找每个聚类中
    x 和 y 的平均值来重复此过程。这将帮助您推断每个聚类中数据点的平均值。K-Means 聚类可以帮助您识别数据中先前未知或被忽略的模式。选择适合您希望创建的类别数量的
    k 值。理想情况下，您应该有超过 3 个。但是，添加更多聚类的优势会随着聚类数量的增加而递减。您选择的 k 值越高，聚类就越小、越具体。您不希望使用与数据点数量相同的
    k 值，因为每个数据点最终都会落入其自身的聚类中。您需要很好地了解您的数据集，并运用直觉来猜测有多少个聚类是合适的，以及会存在什么样的差异。但是，一旦我们拥有的潜在组别超过几个，我们的直觉和对数据的了解就不那么有帮助了。


    ## 降维


    当您使用降维时，您是在精简数据以删除不需要的特征。简单来说，您是在缩减数据集中的变量数量。当我们的模型中有大量变量时，我们就有面临维度问题的风险。维度问题是大型数据集模型特有的问题，并可能影响预测准确性。当我们有许多变量时，我们需要更大的总体和样本总体来创建模型。有那么多变量时，很难有足够的数据来拥有许多可能的组合以创建一个拟合良好的模型。如果我们使用太多变量，也可能会遇到过拟合问题。过拟合是导致数据科学家考虑降维的主要问题。我们必须选择不需要或无关的数据。如果我们有一个预测某人收入的模型，我们需要知道他们最喜欢的颜色的变量吗？可能不需要。我们可以将其从数据集中删除。通常，不容易判断何时应该删除变量。有一些工具可以用来确定哪些变量不那么重要。主成分分析是一种降维方法。我们将旧的变量集转换为某种新的集合。我们创建的新集合称为主成分。在减少变量数量的同时保持模型准确性之间存在权衡。我们还可以标准化变量的值。确保它们都在相同的相对尺度上估值，以免夸大某个变量的重要性。例如，如果我们有以
    0 到 1 之间的概率计量的变量，与以 100 以上的整数计量的变量。线性判别分析是另一种降维方法，我们将特征或变量合并，而不是完全删除它们。核主成分分析是降维的第三种方法。在这里，变量被放置在一个新集合中。这个模型将是非线性的，并且它将比原始数据给我们更好的对真实参数的洞察。


    '
