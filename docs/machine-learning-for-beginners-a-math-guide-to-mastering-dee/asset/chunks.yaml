  fmt: '

    # Choosing the right kind of model for machine learning


    ![](rsrcWU.jpg)


    Imagine that you are a carpenter. What kind of tools do you think you will have
    loaded in your truck when you arrive at a worksite? You will probably have a hammer,
    and a drill as well as a few different types of saws. You probably have a few
    planes and a good set of drill bits. If you know how to do your job, then you
    know when you will know the purpose of each of these tools, and you will know
    when each one should be used. Every single one of these tools serves a specific
    purpose. The drill can’t do a hammer’s job, nor would you try to cut something
    with a hammer. A data scientist who is looking to do machine learning will have
    his own set of tools, each serving a different purpose and designed for a different
    function. Depending on what kind of data you’re using, and what you want to find
    out, you will have to choose different algorithmic models to do the job.


    Statistical algorithms can serve several purposes. Some predict a value; like
    a regression model that predicts your income base on your years of education and
    work experience. Some models predict the likelihood of an event occurring, like
    a medical model that predicts the likelihood of a patient surviving a year, or
    two years, etc. Other models sort things by placing them into different categories
    or classes, like a photo recognition software sorting photo of different types
    of dogs. Depending on the outcome you are looking for, you will need to have your
    statistical toolbelt. You need to familiarize yourself with the technical skills
    of statistics. Also, you will have to know which tool you want to use, and when
    to use it.


    Here I have created a comprehensive list of the different kinds of statistical
    models that are very common in machine learning. To be able to write the code
    to build these models on your own, I recommend that you take some time to study
    in the programming language that you''ve chosen. But this list will give you an
    introductory understanding of each type of model, and when they are useful.


    For machine learning to be effective, you must choose the right model and the
    model that works best and have relevant data for the model and the question at
    hand. Nowadays, especially with the use of the internet and digital marketing,
    there are certain questions that can’t be properly understood without the use
    of data and machine learning that can analyze it. With machine learning and data
    science, you can keep track of your customers and their buying habits, so that
    you can better adapt to their needs when they change. The better you are at interpreting
    your data, the more easily you will be able to identify trends and patterns so
    that you can anticipate the next change.


    Machine learning can be broken down into three different categories, each one
    containing several unique algorithms that serve different purposes. To start,
    we’ll talk about the differences between supervised, unsupervised, and reinforcement
    learning.

    '
  trans: '


    # 选择适合机器学习的模型类型


    ![](img/rsrcWU.jpg)


    想象一下，你是一名木匠。当你到达工地时，你觉得自己的卡车里会装载什么样的工具？你可能会带上一把锤子、一台电钻，以及几种不同类型的锯子。你可能还会带上几把刨子和一套好的钻头。如果你懂得如何做好自己的工作，那么你就会知道每种工具的用途，并且知道在什么情况下应该使用哪一种。这些工具每一种都有特定的用途。电钻无法完成锤子的工作，你也不会试图用锤子来切割东西。一名希望进行机器学习的数据科学家也会有自己的一套工具，每种工具都有不同的用途，并针对不同的功能设计。根据你使用的数据类型以及你想要发现的内容，你将需要选择不同的算法模型来完成工作。


    统计算法可以服务于多种目的。有些用于预测数值；例如，根据教育年限和工作经验预测收入的回归模型。有些模型预测事件发生的可能性，例如，预测患者在一年或两年内生存概率的医疗模型。其他模型则通过将事物归入不同的类别或类别来对其进行分类，例如，将不同类型的狗的照片进行分类的照片识别软件。根据你期望的结果，你需要准备好自己的统计工具箱。你需要熟悉统计学的技术技能。此外，你还需要知道想要使用哪种工具，以及何时使用它。


    这里我创建了一份机器学习中非常常见的各种统计模型的综合列表。为了能够自己编写代码来构建这些模型，我建议你花些时间学习你选择的编程语言。但这个列表将让你对每种模型类型及其适用场景有初步的了解。


    为了使机器学习有效，你必须选择合适的模型，选择效果最好的模型，并为模型和手头的问题提供相关数据。如今，尤其是随着互联网和数字营销的使用，有些问题如果不使用数据和能够分析数据的机器学习，就无法得到正确理解。借助机器学习和数据科学，你可以跟踪客户及其购买习惯，以便在客户需求发生变化时更好地适应。你对数据的解读越好，就越容易识别趋势和模式，从而预测下一次变化。


    机器学习可以分为三个不同的类别，每个类别包含几种服务于不同目的的独特算法。首先，我们将讨论监督学习、无监督学习和强化学习之间的区别。


    '
