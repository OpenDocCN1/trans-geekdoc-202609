    ## 简介


    恭喜你购买《机器学习入门》，并感谢你的支持。机器学习领域正在涌现许多机会。它几乎被每个主要行业采纳为一种工具。无论你对医疗保健、商业与金融、农业、清洁能源等领域感兴趣，都有人正在利用机器学习的力量来简化工作。


    不幸的是，对于这些行业来说，但对你来说幸运的是，数据科学和人工智能领域存在严重的人才短缺。虽然初级数据科学工作竞争依然激烈，但能够胜任高级职位的资深数据专业人员严重短缺。这是计算机科学中一个较新的领域，由一群年轻人构成了该领域的大部分。如果你能在数据科学领域找到一份工作，这可能会带来非常丰厚的回报。2016
    年，平均数据科学家的年薪约为 111,000 美元，未来五年预计将继续增长。该领域约有一半的数据科学家拥有博士学位。这不是必须的，但如果你打算开始数据科学家的真正职业生涯，这是值得考虑的。


    如果你希望将机器学习加入你的技能库，以便更好地理解它，并在未来的业务或项目中实施它，那么博士学位可能不是必须的。但对于那些希望进入该领域的人来说，建议接受高等教育，因为这将帮助你在众多从业者中脱颖而出。Indeed.com
    将机器学习评为 2019 年最佳职业，这很容易理解。由于对有才华的数据科学家有巨大需求，且薪酬丰厚，这值得一看。而且，随着连接性的增加以及消费者和公司前所未有的互联网使用量，大数据似乎也不会在短期内消失。


    数据是我们现代世界的一部分，随着数据的复杂性和规模不断增加，完成手头任务将需要更多专业知识和技能。为了补充本书中的知识，我强烈建议你进一步学习统计学和编程。扎实的统计学基础对于进行任何机器学习工作都是必需的，因为统计数学为数据科学家用于机器学习的所有模型和算法提供了结构和依据。


