- raw: 'Recent Advancements in Data Analysis ![](rsrcWN.jpg)Machine learning has changed
    drastically since its beginning in 1959 with Arthur Samuel’s checkers playing
    computer. But it has changed more in the last two decades than in its entire history,
    especially with the improvement of computing power. In the past, machine learning
    and big data analysis used to be very limited. Only larger companies with expensive
    tech had the ability to use data to make business decisions. Now, almost anyone
    can utilize some amount of data for business or other purposes with a laptop or
    home computer. Data is much easier to come by, and the machines to process it
    have also become much more accessible. What used to take expensive computing power
    can now be done much more cheaply, and quicker. The advent of cloud technology
    has made it easier for smaller businesses access to large datasets without the
    need for massive amounts of data storage. Now machine learning has become a completely
    different field of computer science, with people who specialize in machine learning
    and data science as its own field. More and more things are connected nowadays,
    and the internet continues to grow larger and larger all the time. This means
    that access to data is increasing, but also the sources of data are changing.
    Even people’s cars have computers in them, which means that when they drive, they
    are creating data which can be interpreted. The vast majority of Americans carry
    a cell phone and do internet shopping and use apps for navigation. People use
    their phones to control home appliances, which is another potential source of
    data. There are Fitbits and smartwatches which allow people to track data about
    their health. The more devices, not just computers, and phones, but devices of
    all kinds, are connected, the greater the possibilities in terms of collecting
    and studying data. This connection of everything; smartphones, smart cars, etc.
    make people nervous that they may be at risk of losing their private data. They
    fear that their privacy at stake and someone is always watching them. But machine
    learning and data analytics are making our lives much easier. Finding the right
    products is easier, navigation is easier, and finding new music is easier. This
    is all thanks to machine learning. Image Recognition One of the applications of
    machine learning models is for the sorting and classification of data. This type
    of classification can even be used for the classification of images. Search engines
    use this kind of algorithm to identify photos, and social media sites now use
    face detection to identify a person in a photo before the photo is even tagged.
    They do this by learning from data compiled from other photos. If your social
    media account can recognize your face in a new photo, this is because it has created
    models using data from all the other photos on your account. Image recognition
    techniques require deep learning models. Deep learning models are made with an
    artificial neural network, which will be covered more extensively later in this
    book. Deep learning is the most complex type of machine learning in which data
    is filtered through several hidden layers of nodes. They are called hidden layers
    because the models are unsupervised, meaning that the features identified by the
    model are not chosen by the data scientist beforehand. Usually, the features are
    patterns that the model identifies on its own. Features identified in neural networks
    can be quite complicated, the more complicated that the task is the more layers
    that the model will have. Image sorting models might only have two or three layers,
    while self-driving cars will have between one and two hundred hidden layers. We
    have made big strides in this in recent years, because of the increased availability
    of computing power. Imagine the computing power that it requires to pass thousands
    of data points through hundreds of stacked nodes simultaneously. Deep learning
    and artificial neural networks have become more feasible in the last decade, with
    the improvement of computers and the reduction of cost to process large amounts
    of data. Especially with the advent of the cloud, which allows data scientists
    to have access to huge amounts of data without using physical storage space. There
    is a website called ImageNet, which is a great resource for data scientists interested
    in photo classification and neural networks. ImageNet is a database of images
    that is publicly accessible for use in machine learning. The idea is that by making
    it publicly accessible, the improvement of machine learning techniques will be
    a cooperative effort with data scientists around the world. ImageNet’s database
    has around 14 million photos in its database, with more than 21,000 possible class
    groups. This allows a world of possibilities for data scientists to be able to
    access and classify photos to learn and experiment with neural networks. Each
    year, ImageNet hosts a competition for data scientists worldwide to create new
    models for image classification. Each year the competition gets harder. Now they
    are starting to transition to classifying videos instead of images, which means
    that the complexity and level of processing power required will continue to grow
    exponentially. Using the millions of photographs in the database, the ImageNet
    competition has fostered groundbreaking strides in image recognition made during
    the last few years. Modern photo classification models require methods capable
    of very specific classification. Even if two images should be put in the same
    category, they may look very different. How do you make a model that can distinguish
    between them? ![](rsrcWP.jpg)![](rsrcWR.jpg)Take, for example, these two different
    photos of trees. If you were creating a neural network model that classified images
    of trees, then ideally you would want your model to categorize both as photos
    of trees. A human can recognize that these are both photos of trees, but the features
    of the photo would make them very difficult to classify with a machine learning
    model. The fewer differences the variables have, the easier they are to classify.
    If all your photos of trees looked like the image on the left, with the tree in
    full view with all its features, then the model would be easier to make. Unfortunately,
    this would lead to overfitting, and when the model is introduced to data with
    photos like the one on the right, your model wouldn''t be able to classify it
    properly. We want our model to be capable of classifying our data, even when they
    aren''t as easy to classify. Incredibly, ImageNet has been able to make models
    capable of classifying data with many variables, and very similar data. Recently,
    they created Image recognition that can even identify and categorizes photos with
    different breeds of dog. Imagine all the variables and the similarities that the
    model would need to recognize in order to tell the difference between dog breeds
    properly. The challenge of identifying commonalities between a class is known
    as Intra-class variability. When we have a picture of a tree stump and a photo
    of a tree silhouetted in a field, we are dealing with intra-class variability.
    This problem is how variables within the same class can differ from each other,
    making it harder for our model to predict which category they fall in to properly.
    Most importantly, it requires a lot of data over time to improve the model and
    make it accurate. In order to have an accurate model despite high levels of intra-class
    variability, we will need to use additional techniques with our neural network
    models to find patterns among images. One method involves the use of convolutional
    neural networks. Rather than having just one model or algorithm, data is fed through
    several models which are stacked on top of each other. The neural networks convert
    images features into numerical values to sort them. Unfortunately, it would be
    beyond the scale of this book to try and understand the way these deep neural
    networks operate, but there are many books available that cover those types of
    models and also include more comprehensive explanations of the coding required
    to perform these types of analysis. Speech Recognition Improvements in artificial
    intelligence have made speech recognition more useful very recently. Most of our
    smartphones now have some level of speech recognition ability, which involves
    machine learning. Speech recognition takes the audio data we give it, and it turns
    it into text that can be interpreted. The difficult thing about speech recognition
    is the irregularities in the way that people speak. Like intra-class variability.
    You and I may have different accents and different inflections that are hard to
    account for when you are teaching a computer how to understand the human voice.
    If we both say the same word with different accents, how do we teach the model
    to understand us? Speech recognition also uses neural networks to interpret data,
    like image recognition. This is because the patterns in audio data would probably
    not be recognizable by a human. Data scientists use sampling in order to interpret
    data and make accurate predictions despite the variances in peoples voices. Sampling
    is done by measuring the height and length of the sound waves, which believe it
    or not can be used to decipher what the user is saying. The recorded audio is
    converted into the wave map of frequencies. Those frequencies are measured by
    numerical values and then fed through the neural networks hidden layers to look
    for patterns. Medicine and Medical Diagnosis Machine learning is not just useful
    for digital marketing or making computers respond to your requests. It also has
    the potential to improve the field of medicine, particularly in the diagnosis
    of patients using data from previous patients. With as much potential as machine
    learning has for medical diagnosis, it can be challenging to find patient data
    that is available to use for machine learning because of the laws surrounding
    patient privacy. Its gradually gaining acceptance in the field of medicine, which
    means data is becoming available to data scientists. Unfortunately, up until now,
    it has been difficult to have enough meaningful data to be able to make models
    regarding medical diagnosis. But the technology is there and available to be used.
    Machine learning could use image recognition to diagnose x-rays by taking data
    from several patients to imaging scans in order to make predictions about new
    patients. Clustering and classification can be used to categorize different types
    of the same disease so that patients and medical professionals can have better
    a better understanding of the variation of the same disease between two patients,
    and their likelihood of survival. Medical diagnosis with machine learning can
    reduce diagnosis errors made by doctors or give the doctors something to offer
    them a second opinion. It can also be used to predict the probability of a positive
    diagnosis based on patient factors and disease features. Someday, medical professionals
    may be able to look at data from thousands of patients about a certain disease
    to make a new diagnosis. But medical diagnosis is just one of the numerous ways
    that machine learning could be utilized in medicine. Medical datasets remain small
    today, and the science of machine learning still has a lot of unmet potential
    in the field of medicine. Stock Predictions Stock traders look at many variables
    to decide on what to do with a stock, whether they want to buy or sell or wait
    it out. They look at certain characteristics of a stock, and trends in the market
    environment to make an educated guess on what they should do. This is the way
    it has been done for years. Brokers and traders had to do research manually in
    order to make the best guess. Machine learning can now be used to do the same
    thing, except that machine learning can do it much faster and more efficiently.
    In order to be an effective trader, you must be able to analyze trends in real-time
    so that you don’t miss out on opportunities. Machine learning can help traders
    with finding similarities between stock to make financial decisions using statistical
    data. Traders can use linear regression models to study data about past trends
    in stock market prices, and what variables cause a stock price to go up and down.
    They can use these regressions to decide on what to do with a stock. Often, traders
    who want to analyze the performance of stock do so by utilizing what’s called
    a support vector machine. A support vector machine is a classification model where
    data points are separated by a boundary line, with one category on a side and
    a different category or another. Traders will use support vector machines to classify
    which stocks to buy and which stocks to sell. Using certain variables that should
    be indicative of the performance of a given stock, that stock is placed on the
    side of the boundary line that denotes whether the price is likely to go up or
    go down. Deep learning is also commonly applied in making stock models. The hidden
    layers of a neural network may be useful in identifying unseen trends or characteristics
    of a stock that could cause them to rise or fall in price. There is no such thing
    as a sure bet or a risk-free investment. This was true when people made decisions,
    and it’s still true now when we use data science to make financial predictions.
    It''s important to remember that investing in the stock market will always be
    risky. It’s impossible to create a model that will predict anything reliable about
    the stock market. It''s wild and unpredictable. But we’ve already learned that
    machine learning can find patterns that humans may not be capable of finding on
    their own. If you understand that trends in the stock market may be totally random
    and unpredictable, then it’s useful to have another model that will help you estimate
    a stocks predictability. Knowing how accurate your predictions are for a given
    stock, is just as important as the predictions itself. Create a separate model
    to measure the predictability of a given stock, so you know how reliable your
    predictions are. Different stocks will have varying levels of predictability.
    It''s important to illustrate that with your model so that you can choose from
    the most reliable predictions. Traders will continue to make the final call on
    whether or not a stock will go up or down in value. But data science and machine
    learning can streamline the process of analyzing information that will help the
    decision process. Which is why you will see more and more examples of machine
    learning models used in predicting stock, and why you should at least make yourself
    familiar with the idea. Learning Associations Marketers in all fields, from brick
    and mortar retail to online retail, are always seeking ways to link products together,
    and increase sales. Whether you own a small bike shop or a massive online warehouse,
    finding patterns in your customer''s buying habits will help you make proactive
    decisions to drive sales and make more money. Most of us will visit a grocery
    store during any given week. Grocery stores are a perfect example of using product
    positioning to get sales. Any given grocery store will organize itself so that
    similar items are placed together. Baking goods have their own aisle, while fruits
    and vegetables have their place. They do this for two reasons; it makes it easier
    for the shopper to find what they need and improves the customer experience. Also,
    product positioning can help connect customers with products that they are willing
    to buy but weren''t seeking when they first walked in the store. Beyond just putting
    the vegetables in the same aisle, there is another strategy that grocery stores
    can implement to steer customers towards certain products. They might infer characteristics
    of a customer buying a specific product, and use that to recommend other, unrelated
    products. For example, you can assume that someone who buys fresh vegetables from
    the vegetable aisle eats healthier. You could put smoothies in the vegetable aisle,
    in the same refrigerator where you keep fruit. If a customer comes in looking
    for craft beer, you can tempt them with a snack and place the kettle chips in
    the same isle as 12 packs of light beer. If all of that makes sense to you, then
    you are on your way to understanding a technique called collaborative filtering.
    It’s a machine learning technique that’s widely used in internet marketing. If
    your search data shows that you’ve been browsing airline tickets to Cancun, you
    might start to notice advertisements for swimsuits showing up on your browser.
    Marketing data scientists are always trying to answer this question; how can we
    use data to find a way to link a product with its target market?  It''s about
    utilizing data to link two otherwise unrelated products together to drive sales.
    It’s a way of making recommendations to a customer based on what you know about
    them. Machine learning can often find similarities or buying patterns in customers
    that we may not have known to look for. This is a powerful marketing tool that’s
    starting to emerge in the modern age. Before, most marketing agencies had to use
    intuition to find their target markets. Now, data scientists can use quantitative
    data to draw a more accurate picture of their ideal customer. If you’re interested
    in using machine learning in digital marketing, then this is a topic you should
    be familiar with. Collaborative filtering is different from just advertising a
    similar product to a customer. You are making predictions about a customer’s taste
    or preferences based on data you’ve gathered from other customers. You base this
    prediction on a correlation that you have found between two products, and then
    a measure for the likelihood that the product Y will be bought with product X.
    You use these estimates of correlation to decide on what to market and to whom.
    Spotify uses a similar process when its making song recommendations. It uses data
    from all the music you have liked over time. If there is a correlation between
    two artists, meaning that a lot of people have both artists in their library,
    the model can predict the probability that you will like the other artist. The
    more products you have in your store, the more intensive it will be to find these
    correlations. In a perfect world, you will be looking for correlations between
    every different combination of product that you have in your store. This method
    for finding the probability that you will like one product based on buying another
    product is called the Apiori Algorithm. There are three criteria that need to
    be met to affirm that there is a correlation between the two products and that
    you should link them somehow in your store. The first criterion is support. This
    gives you a measurement of the popularity of a specific product. Out of all your
    transactions, how often does this item appear in peoples shopping cart? The second
    part is the confidence in the correlation between the two products. How likely
    is it that customers will buy Y product when they purchase X product?  Finally,
    what is the lift of product Y?  In other words, how likely is it that someone
    will buy Y with X, based on the popularity of Y alone. The model can also use
    data from things like purchases, social media engagements, etc. to make a prediction
    on the type of product you will like. This distinguishes it as machine learning
    rather than just data analysis because the model was looking for similarities,
    but the programmer didn’t ask for a specific output. Maybe there are certain features
    or characteristics of the group that the programmer isn’t even aware of. Maybe
    with unsupervised machine learning, the data tells us that there is a high correlation
    between the two types of customers. These correlations are happening all around
    us with similarities between groups of people. Sometimes, it requires a good computer
    model to spot the patterns in the data. Machine learning can find similarities
    that would be impossible to see without the help of computers and good modeling.
    Data scientists in marketing sectors are already using statistics to improve their
    stores online, and if you want to keep up with online retail then its advisable
    to start reading about how data can help you identify similarities and trends
    between products, using machine learning as your tool. Finance The financial industry
    is seeing an increase in the use of machine learning. The use of data science
    and machine learning models makes the decision-making process faster and more
    efficient for financial institutions. The possibilities and applications of machine
    learning can be misunderstood, which means it is often underutilized or misused
    in finance sectors. Work that was once tedious and required hundreds of hours
    of human work can now be done by a computer in a matter of a few minutes. A common
    example is the use of machine learning for call center and customer service work.
    Many of the tasks that once required a human operator can now be done over the
    phone with a robot that is designed with machine learning. In addition to customer
    service, banks can now process and analyzing contracts and financial information
    from thousands of customers that would otherwise be labor-intensive — used to
    create credit reports and predict the likelihood that a customer will default
    on a loan. Machine learning techniques can look at a history of transactions of
    a borrower before the bank decides on whether they should loan money to that individual.
    Machine learning is also being utilized in fraud prevention. It has made the finance
    industry more secure. Machine learning has improved the bank’s ability to detect
    patterns in transactions that are indicative of fraud. Rather than having people
    assigned to monitor the transaction and look for signs of fraud, machine learning
    models can learn from fraud data to find patterns by automatically sifting through
    millions of customer transactions. Spam Detection A common example of a relatively
    simple machine learning tool is spam detection. If we are using supervised learning,
    defining the variables that are relevant, then the model will have certain characteristics
    to look for in email messages received. The model might look for certain keywords
    or phrases in order to detect if an email is spam or not. Words like ‘buy’ or
    ‘save’ might let your inbox know when you are receiving spam email. The problem
    with this method is there are many cases in which those words might not necessarily
    mean spam. There might be other keywords or combinations of words that we would
    overlook. This is where reinforcement learning comes in. There are so many characteristics
    that may be indicative of spam email, some of them we may not even be able to
    explain. Reinforcement learning will allow to model to find these patterns on
    its own, without explicit guidance. Instead, we tell the model when it has identified
    spam correctly. Sometimes we find an email message in our inbox that the model
    didn’t classify as spam, so we move it to our spam folder manually. Now the model
    knows that this message is spam, and this piece of data is added to the model
    to improve the prediction next time. So over time, the machine improves as it
    gets more relevant data. This type of machine learning is known as classification.
    Our output falls into discrete categories. In statistics, discrete variables are
    variables which can be identified in only a finite number of categories. An example
    of a discrete variable would be the number of cars sold by a car dealership in
    a week. It’s discrete because the car dealership can’t sell half a car. The variable
    must be a whole number. '
