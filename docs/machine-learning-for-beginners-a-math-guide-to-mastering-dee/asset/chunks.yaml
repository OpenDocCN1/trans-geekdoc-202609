    # 本书的目的 ![](img/rsrcWJ.jpg)


    本书并非旨在成为机器学习的全面教材。相反，它将为你提供一套知识基础，以便你继续学习机器学习和人工智能。为了继续学习并掌握该主题，必须进行大量的学习。我们将讨论机器学习模型的一般结构和组织、常用术语以及使用和理解机器学习所需的基本统计概念。要成为一名数据科学家，必须对统计学和定量分析有扎实的理解。毕竟，人工智能和机器学习都植根于统计学。这为所需的数学提供了锚点和基础。虽然理解本书不需要编程，但编程是机器学习的主要组成部分。为了处理大量数据，数据科学家需要具备计算机编程的工作知识，以便“告诉”数据他们希望数据做什么。本书不会提供太多编程信息，但会提供资源和途径，帮助你自行开始学习编程。读完本书后，我至少会协助你设置
    `Python` 及其必要的库和工具包，以帮助你开始学习编程。机器学习中最常用的语言是 `Python`。它是一种多功能语言，相对容易学习且免费可用。有专为数据分析设计的
    `Python` 包，可以让你的编程更快。`C++` 也很常见，但更难掌握。第三个选择是 `R`，它非常流行，因为它是免费且开源的。学生经常使用它，因为它易于获得且简单。使用
    `R` 的缺点是它无法处理机器学习和人工智能中常用的大型数据集，这在某种程度上是有限制的。机器学习中的计算机之所以与众不同，是因为它们不仅能够记忆新信息，还能将这些信息应用于未来的新情境。记忆与学习之间存在区别。给计算机一行代码与创建机器学习模型之间存在重要区别。机器学习的基本特征是使用人工归纳推理。人工归纳推理意味着特定事件让你有理由概括一个特征。这个苹果是绿色的；因此，所有苹果都必须是绿色的。但在这里你可以看到，单独的归纳推理并不总是完美的，以及为什么很难训练计算机拥有相同的思维过程。给定的一段数据不一定代表其他成千上万可能的数据。因此，当我们使用统计学和机器学习时，必须使用足够的数据，才能自信地推理，而不会根据被误解并变得具有误导性的数据做出错误的推断。作为人类，我们每天做很多我们认为是“常识”的事情。这种直觉决策无法在计算机中明确编程，因为帮助我们做出决策的变量太难以衡量。当我们遇到从未见过的情况时，可能不需要看到千百种不同的棋子组合就能提前思考和制定计划。作为人类，我们只需要很少的数据就能推断和学习。机器学习正是派上用场的地方。在这些变量复杂且无法明确说明方向的情况下，必须通过学习来处理。回到会下跳棋的计算机的例子。如果通过给出每一种可能的走法和每一种可能的反击来教人下跳棋，那将花费太长时间。相反，你教某人基础知识，通过对弈，这个人会学习什么有助于获胜，什么没有帮助。同样，不可能告诉计算机跳棋游戏中的每一种可能情况，然后告诉计算机在每种情况下需要做什么。可能性太多了。相反，你必须给计算机足够的数据，以便即使遇到新情况，它也能做出相应的反应。本书后面将讨论的另一个例子使用人工神经网络来判断一张照片是猫还是狗。作为人类，这种分类太容易了。我们知道狗长什么样，因为我们见过狗；我们知道猫长什么样，因为我们见过猫。但没有办法明确告诉计算机如何区分猫和狗。相反，你给计算机一组包含猫和狗图片的训练数据，并告诉计算机哪些图片是猫，哪些图片是狗。最终，模型应该能够告诉你新的、未见过的图片中是否有猫或狗。明确编程指令的问题在于其无法改变。如果我告诉计算机确切该做什么，使用带有明确指令的编程语言，那么程序将很好地执行该任务，但只能执行该任务。它在获得新信息时不会改变，如果执行不正确，也不会改变其方法。随着时间的推移，机器学习模型将能够随着数据的变化而改变自身，以便在不断变化的环境中继续适应并保持准确，而无需指导。这提供了巨大的优势，因为它使我们的模型更能适应变化，而变化无处不在。如果没有机器学习和人工智能，我们的计算机将无法跟上步伐。


    '
