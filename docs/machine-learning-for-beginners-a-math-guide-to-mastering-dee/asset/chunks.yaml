    # 开发模型


    你需要设置 Python 或其他编程语言来进行机器学习。你通过使用代码来操作数据集来创建机器学习模型。虽然本书不涵盖机器学习的编码，但我会简要介绍一些我推荐你用于机器学习安装的基本库和包。因为它是数据科学中最常用的语言，我们将在本章中以
    Python 为例。我也认为，如果这是你的第一门语言，它是最实用的语言，因为它比其他编程语言更易读，并且在机器学习之外拥有广泛的能力。一旦你安装了最新版本的
    Python，就有几个推荐安装的库，它们带有许多对你的机器学习工作有用的命令。所有这些都可以通过快速的谷歌搜索轻松找到，并且可以免费下载。Python 中用于数据分析和机器学习最重要的库称为
    Pandas。它是数据集的一个非常流行的选择，并会让你的编码更容易、更快，尤其是当你仍在努力熟悉事物时。


    ## Python 的 Anaconda


    开始使用 Python 的另一个选择是安装 Anaconda。Anaconda 的好处在于它为你提供了 Python 的每个包，因此你在为模型编写程序时不需要逐个安装包。它附带了你几乎需要的每种不同功能的所有库。Anaconda
    是一个免费且开源的程序，适用于 R 和 Python。使用 Anaconda，你将可以访问几个有助于你进行数据科学项目的库。基本上，这为你提供了一个预打包的所有
    Python 库的集合，其中有超过 100 个库。主要库之一是 Spyder 和 Jupyter。两者都是集成开发环境，这意味着它们是你编写代码的窗口，但它们比标准命令窗口更先进，并具有保存和导出/导入代码的选项。大多数
    Python 用户将在名为 IDLE 的开发环境中开始。它非常简单，并为学习如何在 Python 中编码提供了良好的格式。当你在 Windows 计算机上安装
    Python 时，它会自动包含。如果你有 Linux 计算机，它是可用的，但你需要单独安装它。IDLE 会让你在 Python 中的初步步骤更容易，因为你将能够保存脚本并稍后编辑它们。它还会引导你进行调试。要安装
    Anaconda，请访问：docs.anaconda.com/anaconda/install 向下滚动，直到看到操作系统列表。选择你的操作系统。它将根据你的操作系统在其网站上为你提供安装
    Anaconda 的说明。然后你就可以开始在 Python 中摸索了。我强烈建议使用互联网上可用的免费初学者 Python 教程之一。EdX 有一个免费的初学者
    Python 教程，这是一个很好的起点。另外，充分利用 Reddit 等论坛，那里已经详细回答了大量常见问题，成员们总是分享机器学习世界的相关新闻。


    ## 算法


    一旦你有了数据，以及操作数据的硬件和软件，你需要将它们结合起来。将数据放在你的编程软件上。在刚开始时，在网上找一个免费的数据集来使用。Kaggle.com
    是免费的，并且有很多 CSV 格式的数据集可供选择，一旦你将 Pandas 库导入 Python，它们将很容易处理。监督学习最好的起步算法是线性回归和逻辑回归，无监督学习是
    k-means 聚类。这些在刚开始时相对容易，你可以从那里构建其他模型。


    ## 可视化工具


    你有了数据，现在你已经使用一种编程语言创建了模型，并且你有一整套数据科学库来帮助你更快地完成所有这些工作。你的电脑运行良好，你可以独立创建模型。你可能已经创建了显示有趣结果的模型，但为了将其分解为通俗易懂的术语并与利益相关者沟通你的发现，你需要以易于可视化的方式组织它。如果你是一个营销项目的数据科学家，你可能已经创建了一个帮助将客户分类并预测购买习惯趋势的模型。但如果你想将这些结果传达给营销团队的其他成员，你需要找到一种沟通方式，即使不熟悉数据科学的人也能理解你的结果。将你的数据分解为图表、图形和可视化内容将有助于补充你的分析技能。当你与不熟悉数据分析的受众沟通时，能够制作数据可视化是非常重要的。数据专业人士的一个流行工具集是
    Tableau。像这样的工具被称为数据可视化软件。在一些公司，有员工的整个工作涉及将难以阅读的数据以易于可视化的方式呈现。像 Tableau 这样的软件非常常被依赖数据做决策的企业使用。Tableau
    很有用，因为它相对容易使用，并且可以通过其平台实时查看数据。你可以自定义一个用于创建报告和图表的工具仪表板。它还让你能够与公司内的其他人分享你的结果。Tableau
    可以用于从你在编程语言中分析过的数据创建图表和散点图。


    ## 更高级的有用事物


    当你刚开始时，这些工具可能对你不那么相关，但谈论其中一些并考虑未来可能有用的东西可能很有趣。本书可能只是你成为机器学习专家之路的开始，所以当你稍微高级一些时，你可能会稍后参考这个列表。你应该继续思考非结构化数据的管理。通常，这需要更高级的程序，因为它更难管理和操作。这种类型的数据通常采用人类大脑在没有工具协助的情况下难以分析的过于复杂的形式，但这是机器学习正在朝着的方向。使用神经网络来模仿人类思维的功能，谁知道未来会怎样。我们在机器学习方面走得越远，我们的数据就越大。机器学习的可能性在不断扩展。未来重要的数据不会具有我们习惯的整齐结构，比如可以放入
    Excel 表格的那种数据。这种类型的数据还需要更强大的计算机硬件和软件来处理这些大量信息的处理。通常使用某种云计算软件来承载大量信息，以及专门用于数据分析的
    GPU。这种更高级别的计算可以帮助一次处理多个移动点。所需的数学也变得更难。结合算法。


