    # Afterword


    Hopefully, after reading this book, you have a good understanding of the basic
    principles of machine learning. You''ve now been introduced to several different
    types of popular machine learning models and their uses. We''ve explored how advanced
    data scientists are using machine learning to create predictions and the parameters
