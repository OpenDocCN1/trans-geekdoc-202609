- raw: 'Introduction to Statistics ![](rsrcWS.jpg)Statistics is the mathematical science
    of data. It is a practice by which data is collected, observed, and analyzed in
    order to infer meaning and examine quantifiable relationships between different
    variables. Machine learning is a form of inferential statistics, meaning that
    by examining the relationship between variables, we should be able to come up
    with predictions for new variables. Statistics is used in a wide variety of disciplines.
    It''s used in biology to study and examines animal and plant life. It has wide
    applications in the business world from making stock market forecasts to analyzing
    consumer behavior. Economists use statistics to explain quantifiable patterns
    in world markets. In medicine, statistics can be used to improve the way that
    doctors and disease specialists look at the spread and prevention of disease.
    Statistics make up the core of machine learning. If you aren’t willing to dive
    into statistics, then machine learning isn’t for you. Machine learning uses statistical
    algorithms to help computers learn. Machine learning is all about the tracking
    of data and how computers can use data to improve themselves. There are two types
    of statistics which are relevant to this book. The first one is descriptive analysis,
    which you might use during the beginning of your modeling process to look for
    indicators in your data. But most of what we do in machine learning falls into
    a different category called predictive analysis. Key term; Descriptive analysis
    . The descriptive analysis helps us examine we are right now. Looking at our current
    situation in context to the past and seeing why things are the way they are. Why
    do some things sell better than others?  What trends are we seeing in products
    currently on the market? Key term; Predictive analysis . Predictive analysis helps
    us to see and understand what will happen in the future based on indicators that
    are currently present. When we are using machine learning for predictive analysis,
    it’s important for us to stay current and continue to feed the model new data.
    What trends should we be on the lookout for? Machine learning is just another
    way to understand the data that is around us and to help us understand our present
    and predict the future. But it requires data from the past and present so that
    we can find trends and see where they might lead. Within statistics, there are
    two over-arching categories of data that we will use, and all our data will fall
    into one category or the other somehow. The first category is quantitative data
    . Quantitative data is data that can be measured with a numerical value. Some
    examples of quantitative data include height, income, or the square footage of
    a house. All these variables can be measured by some number, which makes them
    quantitative. The second category is qualitative data . Qualitative data is data
    where the variables are assigned to categories or classes. Examples of qualitative
    data would include someone’s gender, blood type, or whether a piece of real estate
    has a pool or not. This data can be sorted by its identity and is non-numerical.
    Therefore it is qualitative. Quantitative data can either be discrete or continuous.
    If we have a data set where there is a variable recording the number of patients
    that a hospital had last year, this would be considered discrete. Discrete variables
    have a finite amount of values that they can have, and they are always whole numbers.
    It would be impossible to have half a patient or a percentage of a patient. Therefore
    this variable is discrete. Data can also be continuous. An example of continuous
    data would be a variable for income. Income can take on half values, and there
    is a virtually infinite amount of possibilities for the value of income in data.
    Some other important terms to remember are the mean, median, and mode. You will
    often hear these three things referred to in this book when we are talking about
    regressions. These are all different measures of central tendency. The mean is
    our average value for data. If we have a variable for a person’s age, we will
    find the mean of age by adding all the ages together and then dividing by the
    number of respondents in a data set. The median is the value in the middle of
    the dataset. If you took all the responses for age and found the response that
    was in the exact middle of a sorted list of responses, then this would be your
    median. The mode is the response that occurs the most frequently. If we took a
    sample of eleven people’s ages and found that the ages were 19, 19, 20, 21, 22,
    22, 22, 23, 24, 24, 25 then the mode would be 22, because it occurs the most frequently
    in this sample. The median would also be 22 because it happens to be in the middle
    of this sorted list of responses. When you are making a statistical model, there
    are many important terms that have to do with the accuracy of our models. The
    most important, and the most frequently mentioned in this book are bias and variance.
    These are different kinds of prediction errors that can occur when we are creating
    statistic models. Ideally, we’d like to minimize the prevalence of bias and variance
    in our models. They will always be present, and as a data scientist, you will
    have to find the right balance of bias and variance in your models, whether that’s
    by choosing different data or using different types of models. There are many
    ways to reduce variance and bias within a model, dependent on what you are trying
    to do with the data. By trying to reduce these with the wrong approach, you run
    the risk of overfitting or underfitting your model. When your model is bias ,
    it means that the average difference between your predictions and the actual values
    is very high. Variance is how to spread out our predicted data points are. Usually,
    the variance is a result of overfitting to the sample data we used to create the
    model. It doesn''t do very well at predicting the outcome of new variables. There
    will always be some level of error in your models. It’s a fact of life that no
    matter how good you are at predicting something, there is always some random or
    nonrandom variation in the universe that will make your prediction slightly off
    from the true outcome. I’ve created a visual example of four bullseye targets
    to help illustrate the difference between models suffering from high bias and
    variance. In this instance, the center of the bullseye represents the true value
    that our model is trying to predict. The top left corner is the ideal model. Notice
    that all our predicted data points are falling right on the bullseye. This model
    is quite accurate and places our predicted data points all around the true value.
    This is because of low variance; a lack of ‘spread out’ data points, and low bias;
