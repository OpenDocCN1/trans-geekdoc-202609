  - '[PAGE 3]


    # Feature Extraction


    After image segmentation, the image will be sent to the feature extraction module.
    Extracting the information from input image is the process, where we transform
    the data into set of features. Various types of features such as color, texture,
    magnesium and edges. In our proposed method, we use the color and shape of the
    leaf to get better accuracy. Accordingly, we consider as feature, the skewed asymmetry
    of the pixel distribution in the specified window around.


    These three are effectively used as feature extractors. They give ability to learn
    a better representation of low-level features such as space, edges, lighting,
    rotation and spatial. It also shares these features of knowledge enables communication
    and extraction of new images in various computer vision facilities.


    # Classification


    After extraction, the affected leaves will be sent to the classification module.
    Classification techniques include both the training and testing processes. In
    the training step, features are checked and in the test step, their generalization
    is valued. SVM is the most popular classification for leaves'' classification
    based on a hyperplane. This hyperplane divides the space into two parts, corresponding
    to healthy leaves and unhealthy.


    | Model | Average Accuracy |

    |---|---|n| EfficientNetB0 | 0.9372 |

    | ResNet50 | 0.8316 |

    | VGG16 | 0.2092 |


    Three machine learning classification algorithms were trained to get higher accuracy
    among overall results. According to the average accuracy performance metric, the
    EfficientNetB0 model should be implemented in our system for the prediction of
    nutrient deficiency.


    ![](img/c0928381b4ba4c9adee6fbf3b1448ae6_3_0.png)


    ![](img/c0928381b4ba4c9adee6fbf3b1448ae6_3_1.png)


    Fig. 3. Overview of SVM architecture


    Fig. 4. Internal block of CNN architecture


    After we use a learning algorithm for classification, CNN is used here to classify
    the image to predict the actual nutrient deficiency. There are five main steps
    to build the CNN, with convolution operation, ReLU, pooling and fully connected
    layer. CNN has an automatic feature extraction facility. Convolution operation
    is used to extract the feature from the input image and moreover, it retains the
    relationship between features using a kernel. The ReLU reduces the number of parameters.
    Softmax activation function is used to classify the output.


    # F. Suspecting Deficiencies and Fertilizers


    Once the system completes analysis, it recommends pesticides and fertilizers for
    recommendation. For the process of pesticides and fertilizers recommendation,
    we have several discussions with farmers to get more information from their experience
    and come with suitable suggestions for diseases. Diseases will be suggested for
    suggested pesticides and organic fertilizers. Through this process, coconut leaves
    will be recovered from the diseases.


    # G. OpenCV for Leaf Monitoring


    After the initial usage of the pesticides and fertilizers, this system focuses
    on the monitoring process. A frequent monitoring will be called to analyze the
    content of the affected leaves by using OpenCV. SIFT which is getting the key
    points of the items. The system can easily find the solution to the affected leaves.


    # H. Mobile App


    “Coconut DR System” is an android application which connects with the respect
    device and display the results to the users. The device takes the reading from
    a green leaf sample, android application will show the type of diseases or disorder.
    It also has an advanced function to monitor the plant until it is used.


    The training dataset is split into 4 classes and are potassium deficiency, nitrogen
    deficiency deficiency and health. Using the loss function cross-entropy to handle
    this multi-class classification problem. Then, we trained the CNN using its feature
    generator.


    Nutrient deficiency detection was implemented using altered CNN architecture.
    With the help of previously studied, the three CNN model architectures were developed
    as VGG-16, ResNet50, and EfficientNet-B0'
