    # IV. 研究与发现


    本章通过代码段和每个函数描述了结果，以演示应用程序的功能。通过使用 SVM 和 CNN 分类器，该提议的系统可以获得更好的准确率和良好的结果。在准确率方面，经判定，SVM
    分类器配合上述算法表现更好。根据结果，最准确的分类器也可以应用于提取的特征。用于检测叶片的 SVM 算法包括逻辑回归、KNN 和 SVM 算法，这些算法最初是为了检查获得更好的准确率而开发的。最终选择了
    SVM，准确率达到 93.54%。SVM 是一种监督学习方法，它通过创建一个超平面来分离两个类别。与其他机器学习算法相比，SVM 为图像提供了更高的准确率。


