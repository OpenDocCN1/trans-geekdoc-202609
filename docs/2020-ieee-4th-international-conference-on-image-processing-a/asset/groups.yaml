  - '[PAGE 2]


    # 2020 IEE 44th International Conference on Image Processing, Applications and
    Systems (IPAS)


    G. Xua et expressed new ideas by computer vision to identify deficiency in tomatoes.
    as such percent derivative histogram, percent intensity histogram (FT), and wavelet
    transform were applied to leaf color features. Genetic algorithms (GAs) were also
    used, which can receive ideal information for diagnosing disease. Experiment results
    have shown that the accuracy of this diagnostic system is over 82.2%, and it has
    taken 6 - 10 days to make an expert decision.


    # III. METHOD


    In [12], authors focused on pattern analysis to identify the nutrient deficiency
    from RGB colors. They measured the multiple deficiencies of nutrient deficiency
    in leaves. In addition, image effect comparisons were trained at various levels
    such as multiple color comparison, multiple pattern comparison of color and pattern
    comparison. It accurately detected the defects for combination of nitrogen (NK),
    potassium (PK) and nitrogen deficiencies.


    ![](img/c0928381b4ba4c9adee6fbf3b1448ae6_2_0.png)


    Fig. 1. Overview of model extraction


    Researchers from University Malaysia discussed the edge detection of Canny and
    Sobel and how they extract the information before images are sent to the detector.
    The study showed that Canny edge detection method can produce a smooth and clean
    edge. But the same as other methods, Canny and Sobel also methods to detect the
    noise. [13] developed a website that suggests pesticides based on user input such
    as land area, crop and Lin. Through the website, there are features to search
    for suitable patches that work in their areas. The relevant information to the
    pesticides was collected from the farmers in Nadiul, India [14].


    Coconut proceed detection system from the below main steps. To achieve these steps,
    image processing, machine and deep learning techniques should be applied.


    # A. Image Acquisition


    The health of affected leaves are captured by digital devices like camera and
    other digital images. As an initial step of image processing technique, the captured
    images were uploaded to the system.


    # B. Image Preprocessing


    After uploading the image into the system, it needs to be standardization form
    and have clear data. Preprocessing can reduce the complexity of the dataset. While
    converting the color to grayscale is an accepted preprocessing technique, we employed
    image standardization.


    # C. Image Segmentation


    The segmentation is the process of identifying the objects in the image and understanding
    what object, each pixel belongs to. In our approach segmentation can be done by
    K-means clustering, Otsu method, mountain clustering, edge detection method and
    methods method, Canny edge detection and Laplacian edge detection. Sobel method
    has a 3 x 3 max mask, which will determine the quality of the edge and affects
    the segmentation. The threshold value of the green pixels will be illustrated
    by the threshold equation. Nevertheless, the quality of the leaves using K-means
    algorithms can help to detect the nutrient deficiency (mainly Canny method and
    Sobel method)


    With the comprehensive study of literature review, early detection of nutrient
    deficiencies and the pests are the major problem for farmers to address this problem.
    Various techniques for analysis include blacklight tracks and sprays, which are
    used for detection and observing in crop fields. It is found that some of the
    systems only detect pest and diseases and have further improvements to detect
    nutrient deficiency and respect fertilizer. In the previous work, the system correctly
    identifies issues and makes suggestions, but there is no facility to monitor the
    plant until the disorder is completed cured.


    ![](img/c0928381b4ba4c9adee6fbf3b1448ae6_2_1.png)


    In the past methodologies, low-level features such as spaces, edges, lighting,
    rotation, and shapes were extracted to the pests effectively. Many studies have
    failed to focus on pattern and structure, which gives significantly better results.
    In the advance technology, SVM is used for binary classification of leaves with
    hyperplane to identify and detect insects. Convolutional neural networks (CNN)
    are commonly developed to detect the nutrient deficiency type and then be scaled
    up for better accuracy if more resources are available. There have been several
    ups and downs in the past researches which can be taken as a guide to improve
    our methodology.


    Fig. 2. Image after segmentation


    Authorized sense used limited to: University of California. Downloaded on May
