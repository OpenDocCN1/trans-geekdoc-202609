  mdcn: "\n\n# 2020 IEE 第44届国际图像处理、应用与系统会议 (IPAS)\n\nG. Xu 等通过计算机视觉新思想来识别西红柿缺陷。因此，百分比直方图、百分比强度直方图（FT）和小波变换被应用于叶片颜色特征。还使用了遗传算法（GAs），它可以为疾病诊断提供理想信息。实验结果显示，该诊断系统的准确性超过\
    \ 82.2%，需要 6 - 10 天做出专家决策。\n\n# III. 方法\n\n在 [12] 中，作者侧重于模式分析以通过 RGB 颜色识别营养缺乏。他们测量了叶片中营养缺乏的多种缺陷。此外，在不同水平上了图像效果比较，如多颜色比较、颜色和模式的多多模式比较以及模式比较。它准确地检测到了缺氮（NK）、缺钾（PK）和缺氮组合的缺陷。\n\
    \n![](img/c0928381b4ba4c9adee6fbf3b1448ae6_2_0.png)\n\n图 1. 模型提取概述\n\n来自马来西亚大学的研究人员讨论了\
    \ Canny 和 Sobel 边缘检测，以及他们在图像发送到检测器之前如何提取信息。研究表明，Canny 边缘检测方法可以产生平滑干净的边缘。但与其他方法一样，Canny\
    \ 和 Sobel 也是检测噪声的方法。[13] 开发了一个网站，根据土地面积、作物和 Lin 等用户输入建议农药。通过该网站，有功能搜索适用于他们区域的合适斑块。有关农药的相关信息是从印度纳迪乌尔（Nadiul）的农民那里收集的\
    \ [14]。\n\n椰子病情检测系统由以下主要步骤组成。为了实现这些步骤，应该应用图像处理、机器学习和深度学习技术。\n\n# A. 图像采集\n\n受影响叶片的健康状况通过相机和其他数字设备等数字图像捕捉。作为图像处理技术的初始步骤，将捕捉到的图像上传到系统中。\n\
    \n# B. 图像预处理\n\n将图像上传到系统后，需要将其转换为标准化形式并具有清晰的数据。预处理可以减少数据集的复杂性。虽然将颜色转换为灰度是一种接受的预处理技术，但我们采用了图像标准化。\n\
    \n# C. 图像分割\n\n分割是识别图像中的对象并理解每个像素属于哪个对象的过程。在我们的方法中，分割可以通过 K-means 聚类、Otsu 方法、山峰聚类、边缘检测方法和方法、Canny\
    \ 边缘检测和拉普拉斯边缘检测完成。Sobel 方法具有 3 x 3 最大掩码，这将决定边缘质量并影响分割。绿色像素的阈值将通过阈值方程说明。尽管如此，使用\
    \ K-means 算法的叶片质量可以帮助检测营养缺乏（主要是 Canny 方法和 Sobel 方法）。\n\n通过对文献进行综合综述，营养缺乏和害虫的早期检测是农民解决这一问题的主要问题。各种分析技术包括黑光追踪和喷雾，它们用于农田的检测和观察。发现某些系统仅能检测害虫和疾病，还需要进一步改进以检测营养缺乏并尊重肥料使用。在之前的工作中，系统可以正确识别问题并做出建议，但没有设施监测植物直到疾病完全治愈。\n\
    \n![](img/c0928381b4ba4c9adee6fbf3b1448ae6_2_1.png)\n\n在过去的方法中，提取了低级特征（如空间、边缘、光照、旋转和形状）以有效检测害虫。许多研究未能关注模式和结构，而这将产生显著更好的结果。在先进技术中，SVM\
    \ 使用超平面对叶片进行二分类以识别和检测昆虫。通常开发卷积神经网络 (CNN) 来检测营养缺乏类型，如果有更多资源，则扩大规模以获得更好的准确性。已经经历了多次起伏。\n\
