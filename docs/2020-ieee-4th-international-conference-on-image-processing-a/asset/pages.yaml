    are the major pests on the leaves. Also, they mentioned that various leaves like
    leaf blight, are less important than the pests, but this causes great economic
    loss in this field. This paper provides more information about these pests like
    how these pests are, how to start to detect, how they attack the leaves, and how
    to execute an integrated method to solve.


    Color analysis of the texture of the plants will increase the disease detection.
