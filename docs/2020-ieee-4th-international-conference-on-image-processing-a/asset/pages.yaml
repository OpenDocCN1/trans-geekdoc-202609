  md: '# Feature Extraction


    After image segmentation, the image will be sent to the feature extraction module.
    Extracting the information from input image is the process, where we transform
    the data into set of features. Various types of features such as color, texture,
    magnesium and edges. In our proposed method, we use the color and shape of the
    leaf to get better accuracy. Accordingly, we consider as feature, the skewed asymmetry
    of the pixel distribution in the specified window around.


    These three are effectively used as feature extractors. They give ability to learn
    a better representation of low-level features such as space, edges, lighting,
    rotation and spatial. It also shares these features of knowledge enables communication
    and extraction of new images in various computer vision facilities.


    # Classification


    After extraction, the affected leaves will be sent to the classification module.
    Classification techniques include both the training and testing processes. In
    the training step, features are checked and in the test step, their generalization
    is valued. SVM is the most popular classification for leaves'' classification
    based on a hyperplane. This hyperplane divides the space into two parts, corresponding
    to healthy leaves and unhealthy.


