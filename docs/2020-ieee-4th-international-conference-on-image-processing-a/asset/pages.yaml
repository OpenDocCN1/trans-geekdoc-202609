    Insects and pests are major threats to the overall growth of crops. Pests are
    rapidly damaging crops like coconut. They may cause major and minor defects in
    the quality and quantity of harvest. For instance, the caterpillar and beetle
    larvae are some of the pests and, coconut leaf miners are the major pests that
    attack the leaves of the coconut. The early detection and control of these pests
    is important so pesticides should be sprayed at an early stage. This protects
    the crop from severe pest attacks to increase the coconut production and get more
    cost-effective (benefits).


    Another essential consideration for cultivation is nutritional deficiency. Usually,
    nutrients will spread the disease. In the coconut tree, the nutritional deficiencies
    can be identified using the leaf based the color changes. Most of the farmers
    are unable to recognize the different nutritional deficiencies and symptoms and
    more than one. Identifying suitable fertilizers is the most important thing since
    there are fertilizers containing more nutrients in the industry.


    This project proposes an Android application that will use deep learning to identify
    pests and nutritional deficiency in the early stage to allow smooth coconut production.
    The system identifies the leaf using the shape of the bitten and the symptoms
    of the leaf. According to the result, the system will identify the type of fertilizer
    to use or to kill pests. Most people use pesticides to reduce the affected leaves.
    But some are are affected and they are ineffective at work. A proper monitoring
    process is required through the cultivation.


    Mobile application with image processing, machine and deep learning will be used
    in an effective way to solve agricultural issues. This is aimed at identifying
    the specific requirements of farmers to detect early pest diseases


