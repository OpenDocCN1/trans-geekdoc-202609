    Abstract—Coconut production is the most important and one of the main sources
    of income in the Sri Lankan country. Recent time it has been observed that most
    of the coconut trees are affected by diseases which reduces the strength and production
    of coconut. Most of the trees are affected by pests and nutritional deficiency.
    Our aim is to identify the diseases early so that farmers get more benefit from
    coconut production. This paper proposes a deep learning approach to identify the
    leaves and leaves of coconut. Coconut diseases monitoring has taken place after
    the use of pesticides and image processing techniques. Rather than humans, automated
    recognition will be the fastest approach to identify the diseases in coconut very
    effectively. This paper proposes an application to identify the diseases by their
    food behavior, pests and nutritional deficiencies in the coconut trees. We used
    pre-processing steps such as converting RGB to grayscale, filtering, resizing,
    horizontal flip and vertical flip. After analyzing various algorithms in the literature
    review, SVM and CNN were the best and appropriate classifier with 93.54% and 97.52%
    accuracy respectively. The outcome of this study helps to improve the coconut
    production and undoubtedly will make a revolution in the agricultural sector.


    the trees, especially in coconut leaves. Therefore, recent years, it has been
