    Coconut proceed detection system from the below main steps. To achieve these steps,
    image processing, machine and deep learning techniques should be applied.


    # A. Image Acquisition


    The health of affected leaves are captured by digital devices like camera and
    other digital images. As an initial step of image processing technique, the captured
    images were uploaded to the system.


    # B. Image Preprocessing


    After uploading the image into the system, it needs to be standardization form
    and have clear data. Preprocessing can reduce the complexity of the dataset. While
    converting the color to grayscale is an accepted preprocessing technique, we employed
    image standardization.


    # C. Image Segmentation


    The segmentation is the process of identifying the objects in the image and understanding
    what object, each pixel belongs to. In our approach segmentation can be done by
    K-means clustering, Otsu method, mountain clustering, edge detection method and
    methods method, Canny edge detection and Laplacian edge detection. Sobel method
    has a 3 x 3 max mask, which will determine the quality of the edge and affects
    the segmentation. The threshold value of the green pixels will be illustrated
    by the threshold equation. Nevertheless, the quality of the leaves using K-means
    algorithms can help to detect the nutrient deficiency (mainly Canny method and
    Sobel method)


    With the comprehensive study of literature review, early detection of nutrient
    deficiencies and the pests are the major problem for farmers to address this problem.
    Various techniques for analysis include blacklight tracks and sprays, which are
    used for detection and observing in crop fields. It is found that some of the
    systems only detect pest and diseases and have further improvements to detect
    nutrient deficiency and respect fertilizer. In the previous work, the system correctly
    identifies issues and makes suggestions, but there is no facility to monitor the
    plant until the disorder is completed cured.


    ![](img/c0928381b4ba4c9adee6fbf3b1448ae6_2_1.png)


