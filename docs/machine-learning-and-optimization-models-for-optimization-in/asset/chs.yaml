  | **客户操作系统** | 未更改的客户操作系统 | 更改的客户操作系统，因此无法在本地硬件或其他版本的硬件上运行 | 未更改的客户操作系统 |\n| **性能**\
  \ | 良好的性能 | 在某些情况下更好 | 良好，并且随着时间的推移可能会提高，取决于硬件改进 |\n| **使用者** | VMware, Microsoft\
  \ | VMware, Microsoft, Xen | VMware, Xen, IBM |\n| **对客户操作系统管理程序的依赖** | 无 | 无 |\
  \ Xen Linux 仅在 Xen 管理程序上运行 |\n\n云计算中的虚拟化简介 ◾ **11**\n\n### 表 1.2 不同类型管理程序及其虚拟化的比较\n\
  \n| **序号** | **管理程序名称** | **完全虚拟化** | **半虚拟化** | **硬件辅助虚拟化** |\n| :--- | :--- |\
  \ :--- | :--- | :--- |\n| 1 | KVM | 是 | 否 | 否 |\n| 2 | Proxmox VE | 是 | 否 | 否 |\n\
  | 3 | Virtual Box | 否 | 是 | 是 |\n| 4 | XEN | 否 | 是 | 是 |\n| 5 | Open VZ | 否 | 否\
  \ | 否 |\n\n表 1.2 显示了不同现有管理程序名称及其虚拟化类型。\n\n##### B 类：桌面或客户端虚拟化 [22]\n\n该技术使系统管理员能够虚拟地更新和监控桌面、移动设备和笔记本电脑。有许多基于\
  \ X Window 系统的窗口管理器程序，用于支持多个虚拟桌面应用程序。这些程序使用户能够在不同桌面（例如移动设备、笔记本电脑、计算机桌面等）之间切换，并可以显示特定应用程序的输出\
  \ [13]。客户端虚拟化分为以下三种类型：\n\n1. **远程或服务器托管虚拟化**：托管在服务器上，由客户端网络管理。\n2. **本地客户端虚拟化**：操作系统被加密和虚拟化，并在本地桌面客户端上运行。借助这种虚拟化，用户能够管理其桌面设置。\n\
  \n\n\n\n\n##### 3. 应用虚拟化\n\n这提供了在单个虚拟化桌面机器上运行应用程序的多种方式。\n\n桌面虚拟化的性能受以下多种方式影响：\n\n\
  1. 它取决于从总部交付给客户端的业务线应用程序的距离。\n2. 它是简化了管理并降低了应用程序生命周期成本吗？\n\n**12** ◾ ML and Optimization\
  \ Models\n\n桌面虚拟化面临一些问题，分类如下：\n\ni. 应用程序问题。\n- 网络中客户端/服务器应用程序性能缓慢。\n- 应用程序的远程访问。\n\
  - 本地安装应用程序的安全性。\n- 共驻应用程序的不兼容性。\n- 数百或数千台 PC 上的频繁应用程序更新。\n- 维护数据中心的用户数据，而非 PC 上的数据。\n\
  \nii. 桌面问题。\n- 桌面生命周期管理成本。\n- 桌面管理。\n\n##### C 类：存储虚拟化\n\n这是一项新兴技术，通过生成现有物理存储的逻辑抽象来简化存储管理并降低成本，因为\
  \ CPU 生成存储单元的物理地址，然后将其转换为逻辑地址。存储虚拟化提供逻辑地址的抽象 [9]。以下三种数据存储类型用于提供存储虚拟化。\n\na. **直接附加存储\
  \ (DAS)**：在 DAS 系统中，存储驱动器直接连接到主机计算机。\n\nb. **网络附加存储 (NAS)**：这是一种存储单元，通过网络将请求机器连接到服务器。\n\
  \nc. **存储区域网络 (SAN)**：一种存储单元被称为 SAN。它用于在独立服务器之间交换数据，以加快网络速度。\n\n存储虚拟化借助管理程序软件提供。管理程序可以直接操作主机计算机的硬件。\n\
  \n## 云计算中虚拟化技术简介 ◾ 13\n\n### 1.4 结论\n\n云计算是当今数字世界中需求旺盛的技术。大多数用户使用云服务是因为其高性能和计算能力。许多类型的软件用于优化云；虚拟化就是其中之一。虚拟机是云计算中必不可少且关键的部分。通过在隔离环境中使用多个操作系统，这些虚拟机将管理复杂性降至最低。没有虚拟化，云计算的概念虽然可行，但将是低效且不灵活的。虚拟化是一种控制操作系统的尝试。\n\
