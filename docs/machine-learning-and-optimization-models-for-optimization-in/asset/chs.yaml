  - 参考文献\n\n### 3.1 简介\n\n云本质上是一种分布式计算环境，具有可扩展、按需付费和可靠的特性。旨在提供实时计算的云应用需要一个高效且具有成本效益的计算环境，以便为用户提供更好的性价比和可靠的解决方案。云计算环境中的资源分配取决于所用资源、资源成本以及调度器策略，以提高系统性能。局部或全局最优点提供了解决方案\
  \ [1, 2]。用户需求可以直接在真实的云计算环境中进行测试，但这会增加额外成本；例如，Microsoft Azure 和 Amazon EC2 提供真实的测试环境。可扩展的仿真可以降低成本。云计算通过互联网利用虚拟资源提供动态服务\
  \ [2]。云服务提供商为最终用户提供网络、计算和存储设施即服务。A. Liu 等人利用蚁群优化方法，结合虚拟计算环境和最终用户体验的信息 [3]。\n\nRadojevic\
  \ 等人建议为客户端节点之间设置的连接时间设定一个阈值。资源配置技术遵循虚拟机与中央资源监视器之间映射的特性。带宽和延迟这两个属性用于选择算子或成本感知适应度值测量。受自然启发的生物技术遵循遗传方法，该方法利用选择算子有助于任务分配的优化。遗传方法考虑大爆炸（有限搜索空间），包含局部最优和全局最优解。作者宣称提高了吞吐量，并利用元启发式算法提高了云的能效\n\
  \n\n\n\n\n### 3.1 简介\n\n算法 [4]。当用户请求增加时，作者并未关注时间和成本之间的权衡。\n\n云的快速弹性特性可同时处理多个请求。弹性策略包括可扩展云计算环境的自动、响应式和主动特性\
  \ [5]。该调查有助于在资源可用性和用户满意度方面进行服务等级协议 (SLA) 管理 [6, 7]。成本感知技术基于优化方法“大爆炸-大挤压”，使用优化标准、任务完成时间和资源利用成本。启发式方法支持可扩展云环境中的高效资源分配\
  \ [8, 9]。所提出的模型主要侧重于相对于现有静态、动态和元启发式技术的性能改进 [10–16]。该模型旨在提供一种具有成本效益的解决方案，以寻找能够以最短执行时间和最低计算成本完成任务的计算资源，从而以最高效的方式计算实时应用程序的数据，并为用户提供更好的\
  \ QoS。\n\n### 3.2 相关工作\n\n云计算以多种形式成为一项新兴技术。本节展示了任务调度的研究。这项技术仍在不断发展，其中计算范式将应用软件封装在虚拟机和数据中心中。在现实世界中，云是各种服务提供商的异构组合，它们按“按使用付费”模式向用户提供各种存储、网络和处理服务。云计算负责按照对用户的承诺，以高计算能力和最低成本执行用户任务，且不降低任何质量指标。为了管理此任务，调度在提高云性能和用户服务质量方面发挥着重要作用。动态调度算法提供比静态调度技术更好的服务质量\
  \ [17]。调度算法的显著优势在于实现高性能计算和最优系统吞吐量。X. Jin 等人提出了一种通用技术，可捕捉时间和成本之间的权衡 [18]。\n\n任务根据优先级映射到中央处理器上。这取决于任务的突发时间。Domanal\
  \ 等人 [19] 展示了静态环境下的负载均衡策略。服务质量通过平均响应时间来衡量。尽管如此，仍有利用元启发式技术高效分配虚拟机的空间 [20]。S.G. Damanal\
  \ 等人 [21] 揭示了云计算环境中虚拟机的状态。作者还将主动负载均衡器作为工作的重点领域。还有实施支持动态环境和可扩展仿真的策略的空间。研究人员描述了私有云的负载均衡方案。性能衡量标准包括利用率标准。作者主要关注用于可扩展云性能衡量的生物启发式元启发式技术\
  \ [22]。\n\n作者提出了基于蚁群的自然启发式算法和粒子群模型，以改进云资源分配的性能 [23, 24]。Kalra 等人提供了关于先来先服务 (FCFS)、局部搜索算法、随机爬山法\
  \ (SHC) 以及带有遗传算法 (GA) 的软计算方法的详细调查 [17, 25–27]。作者还展示了用于最优全局解的各种优化标准。\n\n作者主要关注任务在虚拟机上的映射。通过使用多个性能衡量参数，服务质量得以进一步提升。N.\
  \ Panwar 等人关注可扩展云计算环境中的任务调度。作者专注于一种混合方法。该混合方法称为 TOPSIS-PSO 技术。性能以完工时间和资源成本来衡量。结果仅使用捏造的数据集生成。P.Y.\
  \ Zhang 和 M.C. Zhou 关注一种两阶段调度策略。所提出的策略与云计算中广泛采用的技术进行了比较，即 max-min 和 min-min 任务调度技术\
  \ [28]。Z.H. Zhan 等人 [29] 关注资源供给中最先进方法的综合调查。这种混合方法与修正的成本感知 BB-BC 和生物启发智能系统进行了比较。生物启发智能系统神经-GA\
  \ 和神经-BB-BC-成本感知技术改进了性能指标。\n\nSingh 等人提出了一个用于云任务分配的模型。BB-BC-成本模型用于改进资源分配 [30]。Wei\
  \ 等人提出了一种用于多资源分配的异构资源分配方法。多资源分配包括虚拟机分配 [31]。Wu 等人提出了一种利用性能指标成本和完工时间的多目标进化列表调度方法\
  \ [32]。上述大多数讨论的工作可归类为改进成本和时间的算法，但不存在同时尝试改进这两个参数的算法。因此，本工作旨在同时改进这两个性能参数，以向客户提供最低成本，并在云基础设施端管理高性能。\n\
  \n表 3.1 提供了云任务调度现有技术的比较研究 [36–42]。比较根据现有方法考虑的性能参数对算法进行了分类，即成本、执行时间、利用率和功耗。研究发现，大多数工作一次只关注一个参数，但如果考虑所有参数，则无法实现效率。上述比较研究……\n\
  \n\n\n\n\n### 3.3 建议模型\n\n本节展示了用于云基础设施任务分配的建议算法。建议的 BB–BC ANN 成本感知技术的创新之处在于增加执行时间、成本和收敛率。它提供了一种具有快速收敛率的全局最优解，为客户提供了高性价比的解决方案。为克服现有成本感知调度算法的缺点，提出了一种成本感知\
  \ BB–BC ANN 算法。\n\n建议的成本感知 BB–BC ANN 技术基于天文学中的宇宙理论。建议的成本高效大爆炸-大挤压任务调度方法受宇宙演化假说的启发，根据该假说，宇宙始于大爆炸，并分裂成各个部分，这些部分在单一力量的吸引下朝向单一的黑洞点。在第二阶段，强壮健康的部分结合在一起，不健康的部分被移除，宇宙将在一个稳定的宇宙中汇聚于单一点。\n\
  \n建议的算法认为云是各种服务提供商的异构组合，它们提供具有不同成本、资源和性能的服务。云控制器和任务调度策略负责在服务提供商上寻找合适的资源，以在最短时间、最低执行成本和规定的服务质量下完成任务。建议的算法旨在涵盖上述所有性能参数。\n\
  \n建议的算法分为两部分：训练模型准备和预测。训练模型准备阶段分为以下所列阶段：\n\n1. 模型设置。\n2. 数据集生成。\n3. 模型设计。\n4. 训练。\n\
  5. 反向传播。\n6. 任务分配。\n\n#### 3.3.1 模型设置\n\n在此阶段，完成训练模型基本参数的初始化，其中定义了输入层、输出层和隐藏层的神经元数量，以及隐藏层的数量，最后是激活函数。\n\
  \n除此之外，BB–BC 的输入参数也被定义，包括种群大小、变异率和学习率。该模块定义了训练模型的可扩展性和准确性。\n\n#### 3.3.2 数据集生成\n\
  \n在此模块中，使用建议的模型生成用于模型训练和测试的数据集。该模块定义了模型以最低成本和执行时间预测最佳全局解的准确性。\n\n用于生成具有定义的成本感知适应度函数的数据集的建议\
  \ BB–BC 算法定义于第 3.3.7 节。建议模型的输入是资源和任务的配置。其中资源指具有成本和可用资源的主机和虚拟机配置。\n\n该算法旨在以最少的进化和变异次数找到全局最优解。建议的模型同时照顾成本和资源利用率，以改善系统的功耗。\n\
  \n$$\nj = n\n$$\n\n$$\n\\text{适应度值} = \\sum_{i=1}^{j} (\\alpha \\times \\text{成本}\
  \ + \\beta \\times \\text{任务完成时间}_j) \\quad (3.1)\n$$\n\n其中 $\\alpha + \\beta =\
  \ 1$。\n\n$$\n\\text{总执行时间} = \\sum_{i=1}^{n} \\frac{\\text{任务长度}}{\\text{MIPS}}\
  \ \\quad (3.2)\n$$\n\n公式 3.1 定义了适应度函数，即计算成本和执行时间按 $\\alpha$ 和 $\\beta$ 定义的比例求和，其中\
  \ $\\alpha$ 和 $\\beta$ 之和为 1。\n\n#### 3.3.3 模型准备\n\n在此阶段，使用设置阶段定义的参数定义人工神经网络（`ANN`）。模型将输入层、输出层和隐藏层的神经元数量作为输入。模型还将隐藏层的数量作为输入。激活函数用于初始化和调整神经元的权重，并且在误差传播期间也负责调整进一步的权重。输入层的激活函数是\
  \ S 型函数。\n\n建议的 `ANN` 模型使用前馈网络和反向传播来调整权重，以使模型拟合目标数据集。`ANN` 模型的准确性取决于数据类型、隐藏层数量和神经元数量。数据集之间的依赖性越高，所需的隐藏层和神经元数量就越多。\n\
  \n#### 3.3.4 训练\n\n在训练阶段，阶段 2 生成的数据集被分为两部分，即训练数据集和测试数据集，比例为 80/20%，其中 80% 的数据用于训练模型，20%\
  \ 的数据用于测试和误差传播，以通过迭代提高模型的准确性。该阶段通过在每次迭代中调整神经元的权重来定义模型的准确性。\n\n训练过程旨在获得定义的最小适应度值并相应地设置权重。由建议的\
  \ BB–BC 算法生成的训练数据集旨在同时寻找最低成本和执行时间，并用于训练 `ANN` 模型。\n\n隐藏层使用激活函数 `Leaky ReLU`，输出层使用\
  \ S 型函数。激活函数在数据集训练中起着重要作用，它定义了模型拟合的准确性。\n\n#### 3.3.5 反向传播与误差修正\n\n此阶段的目标是通过调整输入层和隐藏层神经元的权重以达到预期输出，从而提高神经网络的准确性。该阶段在权重调整方面起着重要作用，使模型更加准确并更精确地预测值。该过程改善了期望值与实际值之间的差距；在我们的案例中，即寻找成本和执行时间最低的资源。\n\
  \n$$\ne = - \\sum_k (d_k(n) - y_k(n)) \\quad (3.3)\n$$\n\n$$\nd = \\frac{1}{2} \\\
  sum_k e_k²(n) \\quad (3.4)\n$$\n\n\n\n\n\n#### 3.3.6 任务调度\n\n在此阶段，经过适当训练的感知机模型被用于任务调度，以减少调度时间、功耗效率、成本以及任务的总执行时间。\n\
  \n#### 3.3.7 大爆炸-大挤压算法步骤\n\n所提出的算法认为云是各种服务提供商的异构组合，这些提供商提供具有不同成本、资源和性能的服务。云控制器和任务调度策略负责在服务提供商上寻找合适的资源，以在最短时间和执行成本内，并按定义的服务质量完成任务。所提出的算法旨在涵盖上述讨论的所有性能参数。\n\
  \n所提出的算法分为七个模块：\n\n*   **模块 1：** 初始化。\n*   **模块 2：** 评估。\n*   **模块 3：** 选择。\n* \
  \  **模块 4：** 交叉。\n*   **模块 5：** 变异。\n*   **模块 6：** 大挤压/虚拟机上任务分配的优化。\n*   **模块 7：**\
  \ 停止条件。\n\n##### 3.3.7.1 初始化\n\n在此阶段，所有所需参数均按表 3.2 所示进行初始化。算法的输入在此阶段定义。\n\n#####\
  \ 3.3.7.2 评估\n\n在此阶段，为每个调度生成适应度值，该调度也称为一个种群。适应度在识别该调度是否将参与下一代进化中起着重要作用。在 BB-BC 中，适应度也称为调度的质量。在所提出的算法中，适应度函数定义如下：适应度值\
  \ *i* 定义为第 *i* 个种群的适应度，其中适应度函数是在虚拟机上每个任务的成本与执行时间之和，其中 *j* 表示任务数量，且 *α* + *β* = 1。\n\
  \n```\nfitness value i = Σ (j=1 to n) [α * cost_tj + β * task_completion_time_j]\
  \  (3.6)\n```\n\n任务完成时间变量使用公式 3.7 进行测量，其中 `Task_Length` 是任务中的指令数，`VM_MIPS` 是虚拟机的\
  \ MIPS，`PE` 是处理器数量。\n\n```\ntask_completion_time_i = Task_Length_i / (VM_MIPS_i\
  \ × PE_i)  (3.7)\n```\n\n```\ncost_i = Network_delay_i + task_completion_time_i\
  \ × ((ram_size_cost_Per_Ram) + (mips_cost_Per_Mips) + (Number_Of_Pes_cost_PerSecond)\
  \ + w_b(cost_Per_Bw))  (3.8)\n```\n\n公式 3.8 定义了在特定虚拟机上执行任务期间所用资源的成本。\n\n在此阶段，使用公式\
  \ 3.2 所示的适应度函数评估所有调度的质量。进化是一组在每次进化中重复的步骤，包括选择、交叉、变异和大挤压阶段。所提出的适应度函数是一个针对成本和执行时间的多目标函数，这反过来提高了系统的利用率。\n\
  \n##### 3.3.7.3 选择\n\n在此阶段，选择两个最佳解。第一个解是成本最低的解，第二个解是适应度值最接近所有解质心的解，即适应度值最接近质心的解。质心或收缩算子使用公式\
  \ 3.9 计算。质心用 *xc* 表示。其值使用以下公式计算：\n\n```\nxc = (Σ (i=1 to N) (x_i * f_i)) / (Σ (i=1\
  \ to N) f_i)  (3.9)\n```\n\n第二个最佳解是最接近质心的解。这两个解参与下一次进化，包括交叉和变异，以改进下一代并在解空间中找到下一个最佳解。\n\
  \n##### 3.3.7.4 交叉\n\n此阶段以选择阶段的两个最佳解作为输入，并执行多点交叉，即在两个选定解之间交换随机点。此阶段旨在利用选择阶段的两个输入解设计出更好的后代解。\n\
  \n##### 3.3.7.5 变异\n\n在此阶段，发现的第三个最佳解通过在搜索空间中基于交换的候选解变异，将其多样性扩散到其他种群中。交换以较低的变异率执行，这有助于保留染色体的核心特征。此步骤类似于现实世界中的生物变异。\n\
  \n##### 3.3.7.6 大挤压\n\n此阶段通过在每次评估中减少搜索空间直到仅剩一个元素，在提高性能和增加找到最佳解的概率方面起着重要作用。此步骤首先从评估阶段找出适应度值最高（最差）的一个最差解。具有最差适应度的解将从种群中移除。此阶段减少了每次评估中的解的数量，这类似于算法的大挤压阶段，即只有最适者能在进化中生存，最差者将被淘汰。这种减少将减少即将到来的进化中评估和选择阶段所消耗的时间。\n\
  \n##### 3.3.7.7 停止条件\n\n所提出算法的停止条件是进化代数和剩余解的数量，以先达到者为准；否则重复阶段 3.2、3.3、3.4、3.5 和\
  \ 3.6，直到仅剩一个最佳解或完成进化代数。该条件定义了：如果种群规模非常大，则进化代数为停止条件；否则如果种群达到一个，即仅剩一个解，则认为该解为最佳解。图\
  \ 3.1 和 3.2 展示了所提出算法的模型和流程图。\n\n表 3.2 显示了所提出算法所考虑的所有参数。\n\n#### 3.3.8 结果与讨论\n\n\
  仿真使用 `Cloudsim 3.0` 执行。仿真使用工作负载追踪进行实时任务仿真，该追踪为来自并行工作负载存储库的免费开源数据集，格式为 `SWF` 格式的工作负载文件。\n\
  \n在本节中，对所提出模型的性能评估进行了实施。许多标准用于任务调度评估。许多指标如下所示：\n\n*   总执行时间（毫秒）。\n*   平均完成时间（毫秒）。\n\
  *   成本（$）。\n*   网络延迟（毫秒）。\n*   功耗（kWh）。\n\n图 3.3 和 3.4 展示了 200 个任务、10 个虚拟机、 3 个数据中心以及不断增加的种群规模的比较研究，以寻找更好的解。该图将所提出的算法与现有\n\
  \n\n\n\n\n# 基于神经网络的资源分配\n\n## 实验结果与分析\n\n本实验对比了成本感知遗传算法和以执行时间为适应度函数的遗传算法。结果表明，随着种群规模的增加，找到更优解的概率也随之增加。与现有算法相比，所提出的模型产生的总执行时间和平均完成时间最少。**图\
  \ 3.4** 展示了在虚拟机（VM）和数据中心数量保持不变的情况下，针对 200 个任务随种群规模增加的执行时间对比研究。\n\n此处，采用平均完成时间和执行时间作为性能参数，以评估所提出算法的时间性能。\n\
  \n**图 3.5** 展示了在保持资源恒定的情况下，随负载增加（即任务数量增加）的平均完成时间对比研究。\n\n本实验旨在研究在欠载和过载条件下，负载（即任务数量的增加）对完成时间和执行时间的影响。结果表明，所提出的算法表现更优。\n\
  \n**图 3.6** 展示了随任务数量增加的资源执行成本对比研究，其中所提出的模型在三个虚拟机的情况下优于现有工作。该研究展示了在欠载和过载条件下完成时间和执行时间的改进，其中所提出的算法被证明优于现有算法。\n\
  \n**图 3.7 和 3.8** 展示了以成本为性能指标、使用十个虚拟机的相同对比研究，旨在研究所提出算法在过载和欠载条件下的行为。所提出的算法在两种场景下均表现更优。**图\
  \ 3.8** 展示了以平均成本为性能指标的对比研究，旨在研究随种群规模增加（即算法的搜索空间）所提出算法的性能。所提出的算法被证明优于现有模型。**图 3.9**\
  \ 展示了网络延迟作为性能参数的对比研究，因为所提出的算法考虑了网络延迟。由于总执行时间是等待时间、网络延迟和执行时间之和，所提出的算法在减少网络延迟方面优于现有模型。\n\
  \n大多数现有工作仅考虑执行时间，这是一个不完整的性能指标。**图 3.10** 展示了现有算法与所提出的生物启发式算法的功耗对比。所提出的算法优于时间感知和成本感知的生物启发式遗传技术。通过使用嵌入在生物启发式方法内部的\
  \ BB-BC 算法，遗传方法的性能得到了提升。\n\n### 3.4 结论与未来工作\n\n本文提出了一种用于云基础设施任务调度的高效任务调度方案。预测模型优于遗传算法和现有技术。结果部分表明，该预测模型在云\
  \ IaaS 的任务调度方面表现优于现有技术。\n\n本工作仅专注于使用 BB-BC 算法进行云任务调度，采用完成时间、开始时间和成本作为性能指标进行结果对比。该工作提出了一个具有高服务质量的模型。在未来的工作中，所提出的模型将用于主机上的资源调度和迁移方法，以更好地利用资源，在最优资源条件下改善云应用的运行成本。\n\
