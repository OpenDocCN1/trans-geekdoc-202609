  \  - 10.7.1 基于请求数量 — 195\n- 10.8 结论 — 196\n- 参考文献 — 198\n\n### 10.1 绪论\n\n在过去几年中，云计算彻底改变了世界，使设备从单纯的数据访问终端转变为能够处理和存储海量数据的设备。云计算旨在扩展随手可得的云服务，使其随时随地可通过移动设备访问。云用户可以利用移动设备有限的资源。目前，大多数云环境并不考虑移动设备。云对于下一代而言将是真正无处不在且游牧的。因此，云的集成对于影响可用资源和拓宽所提供服务的范围至关重要。云设备受限于处理能力、电池寿命和存储容量。这些限制导致应用执行缓慢并降低可操作性。云环境中的设备既可作为云架构资源的消费者，也可作为框架资源提供者。由于移动设备在电力和处理能力方面的各种约束，将它们作为资源提供者（而不仅仅是消费者）集成到云或集群中非常困难。将设备集成到云中有三种技术：\n\
  \na) 移动设备只是云系统中可用资源的接口，不提供任何服务。\n\nDOI: [10.1201/9781003185376-10](https://dx.doi.org/10.1201/9781003185376-10)\n\
  \n**185**\n\n**智能可扩展算法**\n\n**186** ◾ **机器学习与优化模型**\n\n\n\n\nb) 细胞单元中的 CPU、内存和存储等原始资产被用于完成云环境中的任务。该方案仅将细胞单元视为实现目标的传统资源。\n\
  \nc) 该方案旨在提升细胞单元中的服务，以协助细胞云中的细胞服务，并使细胞单元能够提供服务。该模型实现了最全面的集成，在此模型中，细胞单元既可以是服务的客户，也可以是服务的载体。这种集成可能会在云计算环境中开启增强这些设备细胞特性的可能性。\n\
  \n一种用于解决困难的科学和工程问题的分布式计算基础设施被称为云。它通过大规模资源共享和创新应用与传统分布式计算结构区分开来。拥有不同所有者的无数资源的聚合体是计算云。最近，这种结构已得到改进，以控制多个细胞单元，从而提供无缝的计算能力和存储容量供应。负载均衡或作业调度问题是对作业进行环保分配并利用闲置设备的资源，这是此类云计算系统的一个基本考量。作业分配器将作业分配给可访问的资源，并尝试优化特定的整体性能指标，例如截止时间或收益最大化[n\
  \ [1–4]](#index_split_003.html#p213)。\n\n### 智能可扩展算法 ◾ 187\n\n### 10.2 能量受限云基础设施\n\
  \n当资源基于云时，受限的电池容量将成为约束，电力或能源管理将成为问题。由于设备是异构的，电池能力也可能是异构的。为了最大化系统的整体性能和成本效益，HC 机器中资源和任务的异构性得到了开发[d\
  \ [5–7]](#index_split_003.html#p213)。一个重要的研究难题是如何将资源分配给任务，并对任务在资源上的执行顺序进行排序，以提高细胞云的某项性能标准，这被称为映射或资源分配。资源分配关注于在特定设备上分配资源[e\
  \ [8–10]](#index_split_003.html#p213)。\n\n本章实现了一些参数和资产，以提供资源管理的解决方案并使其节能高效。最后，对类似方法进行了适当的计算，然后提供了极大极小算法和调度资源。\n\
  \n为了提供更好的理解，本章在第 10.1 节中给出了适当的介绍，随后是第二区中现有工作的描述。然后本章描述了问题，并在第 10.3 节中为该问题提供了最佳答案。最后，本章在最后一节中给出了结论。\n\
  \n### 10.3 文献综述\n\nLi Chunlin 等人[. [11]](#index_split_003.html#p213) 为细胞云提出了基于费用的分布式能量受限资源分配优化，该问题被表述为效用优化问题。该问题可分解为两个子问题。两个子问题之间的相互作用通过定价变量进行管理。效用基于其分配的资源（包括计算和通信资产）以及所用的能量，这激励了一种耦合效用模型。在该模型中，效用是分配资源和消耗能量的函数。Abdul\
  \ Aziz 等人[. [12]](#index_split_003.html#p213) 为功耗感知调度算法提出了多种启发式方法。该算法用于将具有既定任务的作业调度到计算云上。文中提到一种功耗感知调度方案，通过将计算设备的状态改为休眠或离线来降低能耗。选择是一项艰巨的挑战，因为每个答案都有其自身的优缺点。成本最低的实现具有最低能耗的优势；然而作业的响应时间较高。另一方面，最小响应启发式方法以最大功率保持最低响应时间。可以设计启发式方法来计算两个目标特征之间的权衡，并帮助选择消除两个极端的中间答案。这种方法的根本缺点是它无法在异构云环境中运行。Nikolaos\
  \ D. Doulamis 等人[. [13]](#index_split_003.html#p213) 提出了一种新的公平调度算法，并将其与最早截止时间优先\
  \ (EDF) 和先来先服务 (FCFS) 等其他调度方案进行了对比。该算法采用极大极小公平共享方法，为用户提供经验证的访问。当资源不短缺时，该算法为每个项目分配足够的计算能力，使其能在截止时间内完成。当发生拥塞时，核心思想是减少分配给任务的\
  \ CPU 核心数，使每个用户获得的资源份额与用户的权重成比例。权重可被描述为用户对基础设施的贡献、其愿意为服务支付的费用，或任何其他社会经济考量。\n\n###\
  \ 10.4 问题识别与提出的解决方案\n\nArjun Singh 和 P. Chakrabarti [ [14]](#index_split_003.html#p213)\
  \ 为细胞云系统提出了基于蚁群的发现和移动感知信任管理。最初，根据距离、CPU 速度、可用带宽和剩余电池电量等参数，使用蚁群优化在网络中选择超级云节点。这些选定的节点被用于资源发现机制。为了配合移动管理系统加强安全性，采用了知识库声誉收集方法[d\
  \ [15]](#index_split_003.html#p214)。通过仿真结果，作者表明所提方法环保且提供更高的安全性。一个必要的困难是在给定细胞云环境和预选架构时，将计算任务和通信事务调度到目标架构上。这包括：\n\
  \n• 将任务和通信事务的分配分别映射到特定的计算和通信资源上。\n\n• 确定它们在共享资源上的执行顺序，这被称为调度问题。调度问题的答案对整个机器的能耗有巨大影响。由于架构的异构性，将相同的挑战分配给不同的处理因素会导致截然不同的计算电力消耗。\n\
  \n• 对于特殊分配，任务间通信量和路由路径可能会显著波动，从而导致通信能耗出现截然不同的值[n [17–19]](#index_split_003.html#p214)。\n\
  \n尽管调度问题是研究的传统主题，但几乎所有现有工作都侧重于最大化整体性能\n\n\n\n通过调度过程。所开发的算法现在不适用于实时嵌入式应用，在这类应用中，一个常见的目标是在严格的整体性能约束下限制设备的功耗。\n\
  \n此外，大多数现有工作在调度过程中忽略了处理器间通信因素，或者假设其与通信量成正比，而没有考虑到诸如通信拥塞等可能在任务执行期间动态变化的细微影响。图 10.1\
  \ 展示了蜂窝云网络的结构。\n\n**图 10.1** 网络中移动云的架构。\n\n**190** ◾ ML and Optimization Models\n\
  \n#### 10.4.1 剩余电池电量估算\n\n时间 `t` 后，节点消耗的功率 (`Pc(t)`) 计算如下：\n\n```\nPc(t) = DPtx\
  \ * a1 + DPrx * a2  (10.1)\n```\n\n其中：\n- `DPtx` = 时间 `t` 后节点发送的数据包数量。\n- `DPrx`\
  \ = 时间 `t` 后节点接收的数据包数量。\n\n#### 10.4.2 剩余电池电量估算\n\n时间 `t1` 后，设备使用的功率 (`Pa(t1)`)\
  \ 计算如下：\n\n```\nPa(t1) = Dax * a1 + DPrx * a2  (10.2)\n```\n\n其中：\n- `DPqx` = 时间\
  \ `t1` 后节点发送的数据包数量。\n- `DPrx` = 时间 `t1` 后节点接收的数据包数量。\n\n### 10.5 分层任务调度\n\n节点的配置文件包含以下字段：\n\
  \n- `Mnid1` (云节点 ID)。\n- `Imgsid1` (I-MGS ID)。\n- `Speed1` (设备速度)。\n- `no_tasks1`\
  \ (当前正在执行的任务)。\n- `wload1` (设备工作负载)。\n- `power1` (节点电量等级)。\n- `ntasks1` (当前任务详情)。\n\
  - `status1` (节点状态)。\n\n对于每个任务，存储以下详细信息：\n\n- `Tid1` (任务 ID)。\n- `Tsize1` (所需内存大小)。\n\
  - `Exectime1` (执行时间)。\n\n**智能可扩展算法** ◾ **191**\n\n#### 10.5.1 算法\n\n- 每当一个 MN 想要执行一组任务\
  \ `{ Tj, j = 1,2,…, k }` 时，它会将任务详情提交给其 SGN。\n- SGN 使用以下公式估算其 MN `{ MNi, i = 1,2,…,\
  \ n }` 的工作负载：\n- 如果 `Pai` 是设备的初始电池电量，则设备在时间 `ta` 的剩余电池电量 [[9]](#index_split_003.html#p213)\
  \ 可按如下方式计算：\n\n```\nPares = Pai - Pac(tc1)\n```\n\n```\nWload_ia = CWload_ia + Σ\
  \ (j=1 to k) (tsize_ja / power_ia)\n```\n\n其中 `CWload_ia` 是设备的工作负载。\n\n```\nWload_ia\
  \ = CWload_ia + Σ (j=1 to k) (tsize_ja / power_ia)\n```\n\n其中 `CWload_ia` 是设备的当前工作负载。\n\
  \n- `power_ia` 是设备的功率，`tsize_ja` 是任务 `ja` 的大小。\n\n因此总工作负载为：\n\n```\nTaWload = Σ\
  \ (i=1 to n) Wload_i\n```\n\n- 设 `avg_A` 为云的平均工作负载，`T` 为可容忍的工作负载限制。\n- 如果 `Wload_ia\
  \ > avg + T`，则 `MNi` 的状态被观察为过载 (OVERLOADED)。\n- 如果 `Wload_ia < avg_A`，则 `MNi` 的状态被观察为欠载\
  \ (UNDERLOADED)。\n- 如果 `Wload_ia ≥ avg_A` 且 `Wload_ia ≤ avg_A + T`，则该设备被标记为平衡 (BALANCED)。\n\
  \n**192** ◾ ML and Optimization Models\n\n- 设 `n_ul`、`n_ol` 和 `n_bl` 分别表示欠载 MN 的数量、过载\
  \ MN 的数量和平衡 MN 的数量。\n- 然后 SGN 检查以下条件：\n\n```\nIf n_tasks > (n_ul + n_bl), then split\
  \ the tasks into subtasks as s_task_A = n_tasks / (n_ul + n_bl)\nOtherwise, don't\
  \ split the task.\n```\n\n- SGN 仅将子任务分配给欠载和平衡的 MN。\n- 如果没有欠载和过载的 MN，SGN 会向另一个 SGN\
  \ 发送请求，附带待执行的剩余任务详情。\n- 然后 SGN 将此请求转发给另一个 SGN。\n- 重复相同的过程，直到所有子任务都成功分配。\n- 一旦子任务执行完毕，相应的\
  \ MN 将完成的任务返回给请求的 MN。\n- 如果任何一个被分配的 MN 移出范围，则其任务将按上述相同方式重新调度到另一个 MN。\n\n#### 10.5.2\
  \ 算法描述\n\n每当一个 MN 希望执行一组任务时，它会将任务详情提交给其 SGN。SGN 使用以下公式估算其 MN 的工作负载：\n\n```\nWload_i\
  \ = CWload_i + Σ (j=1 to k) (tsize_j / power_i)\n```\n\n这里的工作负载用任务量度和蜂窝节点的电池能量来表示。因此，可以选择工作负载最小且电池能量较多的蜂窝节点来执行任务。\n\
  \n蜂窝节点的状态根据平均工作负载被标记为平衡、过载或欠载。如果工作负载高于平均工作负载与可容忍工作负载限制之和，则蜂窝节点的状态被标记为过载。另一方面，如果工作负载介于平均工作负载与平均工作负载加可容忍限制之和之间，则该蜂窝节点被视为平衡。在标记蜂窝节点的状态后，SGN\
  \ 检查任务数量是否大于欠载蜂窝节点数量与平衡蜂窝节点数量之和，并将任务拆分为子任务。否则，任务不拆分为子任务。\n\n如果工作负载小于平均工作负载，则节点被标记为欠载。SGN\
  \ 仅将子任务分配给欠载和平衡的 MN。如果没有欠载和过载的 MN，SGN 会向其 I-MGS 发送请求，附带待执行的最终任务详情。\n\n**智能可扩展算法**\
  \ ◾ **193**\n\n### 10.6 建议方法的优势\n\ni. 它最小化蜂窝节点的电力消耗。\nii. 由于它是分层的，工作可以重新分配或重新调度。\n\
  iii. 由于任务被分解为子任务并并行完成，它减少了执行时间和内存大小。\niv. 如果蜂窝节点移出范围，其分配可以重新调度。此处工作负载已表示。\n\n###\
