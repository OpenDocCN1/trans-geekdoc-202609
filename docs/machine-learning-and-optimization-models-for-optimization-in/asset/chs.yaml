  - 参考文献\n\n### 6.1 简介\n\n术语“云”指的是网络上的一个巨大网络或空间。它是一项利用网络上的远程服务器来存储、开发、部署、维护和在线访问信息的创新技术，而非使用本地驱动器或机器。信息可以是任何内容，例如记录、图片、报告、声音、视频等，应有尽有。无论大小，所有\
  \ IT 组织在 IT 基础设施方面都遵循传统技术。所有 IT 组织都需要一个服务器室，这是组织的一项基本需求。服务器室由数据库服务器、邮件服务器、网络、交换机、防火墙、调制解调器、交换机、每秒查询数（`QPS`）方法（该方法处理服务器在给定时间内可解决的查询负载）、框架、高速互联网以及维护和支持工程师组成。在组织中建立此类基础设施并同时维护它需要大量的经济支持。为了解决传统\
  \ IT 基础设施的问题并降低 IT 基础设施成本，创新者发明了云计算方法（图 6.1）。\n\n云计算技术通过互联网为用户提供虚拟机、服务器、数据中心等基础设施；用于软件开发和部署的平台；以及应用程序。云提供了云所有工作所依赖的部署模型和服务模型。云框架中使用了四种类型的部署模型：公有云、私有云、社区云和混合云。部署模型是根据环境的云基础设施所在位置来定义的。云中的所有服务均根据其服务类型被归类为三种服务模型。\n\
  \n云的服务模型包括：基础设施即服务（`IaaS`），提供虚拟化计算资源；平台即服务（`PaaS`），为开发人员提供平台以开发可轻松构建和运行的框架；以及软件即服务（`SaaS`），为云用户提供基于订阅或免费使用的授权应用程序和软件（图\
  \ 6.2）。在 `PaaS` 中，开发人员无需基础设施即可运行或创建应用程序；可根据需要调用资源和 API。\n\n机器学习是人工智能的扩展应用领域，它促进了系统在未被显式编程的情况下进行自动学习。人工智能之间的区别\n\
