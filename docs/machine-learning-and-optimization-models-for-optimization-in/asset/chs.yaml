  \n## 第 4 章：云计算中可用性与可靠性的考量\n\n**Dheeraj Rane, Vaishali Chourey, Rohit Verma and Punit\
  \ Gupta**\n\nDOI: `10.1201/9781003185376-4`\n\n## 目录\n\n- 4.1 简介\n- 4.2 相关工作\n-\
  \ 4.3 云计算 SLA 中的可用性与可靠性\n  - 4.3.1 可用性\n  - 4.3.2 可靠性\n- 4.4 结论\n- 参考文献\n\n### 4.1\
  \ 简介\n\n本文旨在对定义云计算 QoS 的参数——可用性和可靠性——提出系统性的描述。可以验证是否符合最低服务标准\n\n\n\n\n# 可用性、可靠性的考量\n\
  \n熟练运用这些形式化概念。这是开发云服务等级协议（SLA）完整蓝图以及决定 SLA 在监控云服务和确保 QoS 中成功应用的数学理解的长期过程中的第一步。\n\
  \nDOI：[10.1201/9781003185376-4](https://dx.doi.org/10.1201/9781003185376-4)\n\n\
  ### 4.2 相关工作\n\n云计算可被视为 Web 服务及其概念的延续[[16]](#index_split_001.html#p85)。网格计算[[11]](#index_split_001.html#p85)也可被视为云计算的“智力表亲”，以效用计算为基础[[17]](#index_split_001.html#p85)。因此，我们将关于\
  \ SLA 模板的文献综述分为三类：(a) 网格 SLA，(b) Web 服务 SLA 和(c) 效用计算 SLA。由于云相关的 SLA 问题仍在涌现，背景可能包括网格和面向服务架构（SOA）的\
  \ SLA。以下是对当前 SLA 框架[[18]](#index_split_001.html#p85)的调查，并附带了关于在云场景中定义新 SLA 范围的讨论。\n\
  \n开放网格论坛[[19]](#index_split_001.html#p86)描述了`WS-Agreement`，这是一种用于发布服务提供商能力、基于模板创建协议以及在运行时跟踪协议执行的语言和协议。它改进了传统的服务发现和使用模型，如通用描述、发现与集成（UDDI），因为它使服务用户能够发现可用服务、使用服务并动态协商服务的效率。最初没有协商过程，但现在`WS-Agreement`可覆盖\
  \ SLA 生命周期的所有五个阶段。应注意，该项目的范围仅限于 Web 服务和网格计算。\n\nWeb 服务等级协议（`WSLA`）是 Keller 等人于 2003\
  \ 年建立的一个系统[[2]](#index_split_001.html#p84)，用于定义和跟踪 Web 服务的服务等级协议。`WSLA`框架包括一种基于\
  \ XML Schema 的可扩展和可扩充语言，以及一个运行时架构，该架构包含许多可外包给第三方以保证完全客观性的 SLA 监控服务。客户和提供商可以使用`WSLA`来识别广泛的\
  \ SLA，确定 SLA 参数及其计算方式，并将它们链接到受控资源检测。一旦接收到 SLA 规范，`WSLA`监控服务将自动配置以实施 SLA。在定义跨组织和组织内部\
  \ SLA 参数到 XML 方面，`WSLA`具有很大的通用性。然而，它不支持多级 SLA。\n\nLamanna[[3]](#index_split_001.html#p84)提出了一种语言（`SLAng`），用于为应用服务提供场景生成\
  \ SLA，在该场景中，客户向服务提交请求，服务处理请求并向网络返回响应。`SLAng`将规范分为两组：通用标准和 ASP 标准。`SLAng`的语义使用基本元对象工具（`EMOF`）进行定义，这是一种类似于\
  \ UML 的建模语言。模型有助于使 QoS 参数更易理解。SLA 元素的存在也限制了模型中可发现的行为类型。对象约束语言用于定义约束。\n\n### WS-Agreement\
  \ Andrieux[[1]](#index_split_001.html#p84)、Web 服务等级协议（WSLA）Keller[[2]](#index_split_001.html#p84)、SLAng\
  \ Lamanna[[3]](#index_split_001.html#p84)和 Web 服务提供语言 Tosic[[4]](#index_split_001.html#p85)是几个著名的\
  \ Web 服务（WSOL）SLA 结构。用于实现的术语、考虑的条件、应用限制的方式以及适配的生命周期各不相同。由于 Web 服务和云计算都建立在面向服务架构之上，它们在\
  \ SLA 方面有很多共同点。然而，由于云计算服务实现模型的多样性（例如 SaaS、PaaS 和 IaaS），必须考虑许多额外的标准[[5–10]](#index_split_001.html#p85)。\n\
  \n本章组织如下：下一节通过证明 SLA 的必要性以及可用性和可靠性在云计算中的重要性来奠定基础。第 4.2 节详述了关于云计算中 SLA、可用性和可靠性的相关工作。第\
  \ 4.3 节提供了可用性和可靠性的清晰定义。第 4.4 节总结了本章。\n\n存在许多适用于与云计算概念相似的技术的 SLA 模板，如 Web 服务、网格和效用计算。大多数相关技术的模板要么特定于这些技术，要么正在开发中，要么缺少云所需的\
  \ SLA 生命周期的几个特性。确实，这些 SLA 模板无法以其原始形式应用于云计算环境。表 4.1 给出了三种技术[[10–15]](#index_split_001.html#p85)的比较，即云计算、网格计算和\
  \ Web 服务。这一对比揭示了 Web 服务提供的服务与云提供的服务截然不同。Web 服务是一种应用程序，它暴露了一个可使用标准 Web 技术访问的功能，并遵循\
  \ Web 服务标准。这意味着 Web 服务只是云计算服务模型（2010）之一 SaaS 中的一个小概念。同样，网格计算和云之间也存在差异。这些差异主要与服务模型、多级\
  \ SLA、虚拟组织、任务规模、可扩展性等有关。因此，当前的 SLA 模型无法处理云应用的多样性。\n\n此外，它们局限于 QoS，具体指成本和性能分析，并未考虑风险、信任或绿色计算等若干非功能性问题。所有这些都增加了对云计算专用\
  \ SLA 模板的需求。\n\n### 表 4.1 云计算、网格计算和 Web 服务的比较\n\n| **考量因素** | **云计算** | **网格计算**\
  \ | **Web 服务** |\n| :--- | :--- | :--- | :--- |\n| 计算方式 | 独立或并行 | 独立 | 并行 |\n| 服务类型\
  \ | SaaS、PaaS 和 IaaS | 通常为基础设施 | B2B 服务 |\n| SLA | 是 | 有限 | 是 |\n| 多级 SLA | 是 |\
  \ 否 | 否 |\n| 协议 | TCP/IP、SOAP、REST | MPI、MPI-CHG、GIS、GRAM | SOAP、REST |\n| 虚拟化 |\
  \ 是 | 有限 | 否 |\n| 虚拟组织 | 否 | 是 | 否 |\n| 互操作性 | 有限 | 是 | 是 |\n| 不同服务模型 | 是 | 主要与基础设施需求相关\
  \ | 主要为 B2B，最终用户不参与 |\n| 资源处理 | 集中式和分布式 | 分布式 | 集中式 |\n| 任务规模 | 取决于服务模型。从小到大不等 |\
  \ 单一大型 | 小型 |\n| 可扩展性 | 完全 | 有限 | 否 |\n| 多租户 | 是 | 是 | 否 |\n| 应用应用 | 中小企业和交互式数据检索\
  \ | HPC | 仅限于 B2B 数据检索 |\n| 标准化 | 否 | 是 | 是 |\n| 软件依赖 | 独立领域 | 依赖应用软件 | 独立 |\n|\
  \ 平台 | 服务模型 | 必须使用符合网格标准的软件 | 独立 |\n| 操作系统 | 运行多个操作系统的 Hypervisor | 标准操作系统 | 标准操作系统\
  \ |\n| 故障管理 | 强（虚拟机可迁移） | 有限 | 有限 |\n| 用户友好性 | 高 | 低 | 因 B2B 性质，无与最终用户交互 |\n| 安全性\
  \ | 必需 | 仅针对非用户需求 | 几乎安全 |\n\n\n\n\n\n# 可用性与可靠性的考量\n\n### 4.3 云 SLA 中的可用性与可靠性\n\n\
  由于底层实现的差异，由类似云计算技术实施的 SLA 无法以其原始形式显式用于云计算。因此，云 SLA 中必须具备的特性和参数将受到限制。同时，也必须引入若干新特性以适应不断变化的技术领域和时代。例如，随着云计算的广泛采用，信任应成为\
  \ SLA 的关键组成部分。本节列出了云 SLA 中应包含的主要参数，并从云的角度对其进行定义。本研究重点关注与 CSLAT（云服务）相关的四项需求：可用性、互操作性、可靠性和信任。此外，还建议了一个模板，该模板整合了指定参数，旨在弥合当前\
  \ SLA 模板与规范之间的差距。文中还给出了云 SLA 中应解决的问题清单。\n\n#### 4.3.1 可用性\n\n对于在云中拥有资源的组织而言，可用性是一个重要关注点。如果云上服务的可用性不被高度重视，云计算环境的优势将荡然无存。尽管技术不断进步，近几年仍发生了许多中断事件，表明此类疏漏不容忽视。因此，组织适当发展云计算的动因之一，是在保持同等服务质量的前提下，实现极致的潜在可用性\
  \ [21–23]。\n\n当请求使用某设备时，可用性是指其按预期执行的可能性。换句话说，可用性表示设备在需要时不会发生故障或需要维修的可能性。基于这一概念，可用性可被视为可靠性的一种行为表现。然而，在确定可用性时，除了可靠性外，还应考虑系统的可维护性（维护的容易程度）。这意味着在估算可用性时，我们也应考虑系统的停机时间。系统的可用性由停机时间决定，Sericola\
  \ 和 Bruno（1999）将其作为研究对象：\n\n*   **瞬时可用性**：系统在时刻 `t` 可用的概率。\n*   **平均可用性**：在指定时间段内系统可用的时间比例。\n\
  *   **稳态可用性**：当 `t` 趋于无穷大时可用性函数的极限。\n*   **运行可用性**：与可用性类似，但也包含各种停机时间，如管理停机时间、计划维护停机时间和后勤停机时间。\n\
  \n在所有定义的变体中，瞬时可用性适用于云计算中的实时系统或关键事务，在这些场景中，特定时间点的可用性至关重要。此外，利用瞬时可用性函数，也可以确定平均可用性和稳态可用性等其他可用性数值。\n\
  \n下一节将讨论预测云服务可用性的当前方法，随后介绍我们提出的方法。可用性追踪是预测可用性的常用方法。在这种情况下，该技术是在历史数据中搜索趋势以预测主机的可用性。可视化工具可用于发现特定趋势。随后利用\
  \ `k-means` 等聚类算法来区分具有不同模式的机器。使用两个计算每个维度上不相等值比例的二进制向量来确定主机与质心之间的相似性。随后，使用位向量生成一段较长时期内大部分主机可用性的良好可靠描述，同时检测当前的每日和每周趋势。这些模式通常会在数周内以微小变化复制。因此，位向量观察到的模式极有可能在近期内复现。基于\
  \ Jaccard 指数的预测方法 [24] 是检测历史数据趋势的另一种方法。为了预测方案中特定机器的可用性，该方法使用懒惰学习算法在历史数据的序列模式中寻找最佳匹配。\n\
  \n在志愿者计算和网格计算等环境中，用户自由共享资源，可以检测历史模式以预测特定主机未来的可用性，此类方法适用。然而，由于云计算是营利性业务，以与网格和志愿者计算相同的方式预测可用性无法产生可靠结果。我们提出了一种利用概率分布和可用资源预测可用性的方法。我们的方法考虑了以下因素：\n\
  \n*   `n`：系统中运行单元的数量。\n*   `η`：备用单元的数量。\n*   `λ_i`：第 `i` 个单元的故障率。\n*   `µ_i`：第 `i`\
  \ 个单元的修复率。\n*   `m(u)`：修复概率分布函数。\n*   `tr`：故障单元被备用单元替换的平均时间。\n\n如果将云视为一个系统，其可用性主要由其组件的可用性决定，这些组件包括\
  \ CPU、基础设施（服务器）、应用、平台和网络。对于三种服务模型，预测云可用性时对特定组件的依赖程度可能不同（表 4.2）。由于这些组件按顺序相关，特定服务模型的可用性由以下公式给出（公式\
  \ 4.1）：\n\n```\nn\nA_s(t) = ∏ A_i(t)\ni=1\n```\n\n其中 `A_s(t)` 为服务模型可用性，`A_i(t)`\
  \ 为服务模型第 `i` 个组件的可用性。马尔可夫模型可用于\n\n### 表 4.2 云可用性背景下各组件的可用性关注点\n\n| 服务器 | 平台 | 应用\
  \ | CPU | 网络 |\n| :--- | :--- | :--- | :--- | :--- |\n| **IaaS** | 需要 | 不需要 | 不需要\
  \ | 需要 | 需要 |\n| **PaaS** | 需要 | 需要 | 不需要 | 需要 | 需要 |\n| **SaaS** | 需要 | 需要 | 需要\
  \ | 需要 | 需要 |\n\n\n\n\n# 计算单个云组件的可用性\n\n首先，必须将组件的状态描述为状态空间（`S`）。\n\n`S = [s0, s1,\
  \ ..., sh]` (4.2)\n\n`S` 中状态的数量由 η（备用单元的数量）决定。\n\n定义状态后，可以使用故障率（`λi`）和修复率（`µi`）（Chow\
  \ 1975）绘制状态图。此外，故障率和修复率均为时变的，将分别根据故障率和修复率的概率分布函数而变化。为此，可以使用指数、Pareto 和 Weibull 概率分布函数（Charles\
  \ 2010）。此处的假设是：设备处于给定状态的可能性仅取决于其当前所处的状态。\n\n`P(st | st-1, ..., s1) = P(st | st-1)`\
  \ (4.3)\n\nη 个节点的状态图如图 4.1 所示。每个节点代表系统可能的许多状态之一。例如，节点 `s0` 代表一切正常工作的良好状态，而节点 `sη`\
  \ 代表 Markov 过程结束的故障状态。\n\n**图 4.1 状态转移图**\n\n状态 `s1` 到 `sη-1` 也被视为有效状态，只是在这些状态下只有少数备用单元处于运行状态。转换路径的每个分支都标有故障率\
  \ `λi`，表示导致状态变化的故障。修复率（`µi`）可以用同样的方式进一步映射。这些速率被称为转移概率，因此简写为：\n\n`q(x, y) = P(st+1\
  \ = x | st = y) for x, y ∈ S` (4.4)\n\n通过将这些转移概率组合成矩阵 `{q(s, s')}` 形成转换核。此处，元素（`si`,\
  \ `sj`）是从状态 `si` 到状态 `sj` 的转移率，其中 `si ≠ sj`。对于 `si = sj`，该元素为该行所有其他值之和的负值（Charles\
  \ 2010）。可以指定一个向量来表示时间 `t` 时可能状态间的可用性分布。\n\n`p(t) = [Ps0(t), Ps1(t), ..., Psh(t)]`\
  \ (4.5)\n\n时间 `t` 时组件处于状态 `s0` 的概率由 `Ps0(t)` 给出。假设时间单位 1 时的机器可用性为 100%。由于状态 `s0`\
  \ 表示系统完全运行且无故障，因此系统处于该状态的可能性为 1。这表示为：\n\n`p(1) = [1, 0, 0, ..., 0]` (4.6)\n\n因此，\n\
  \n`p(2) = p(1) * q` (4.7)\n\n最后，推广公式 4.7 后，时间单位 `t` 的可用性可表示为：\n\n`pt = p(1) * q(t-1)`\
  \ (4.8)\n\n上述公式给出了不同状态下可用性的分布。因此，组件可用性可以表示为有效状态概率之和，即：\n\n`A = Σ(i=0 to h-1) P(si(t))`\
  \ (4.9)\n\n![Image 34](img/index-79_1.jpg)\n\n#### 4.3.2 可靠性\n\n通常，可靠性被定义为：在指定运行条件下，待审查系统在给定时间段内或特定时间点按预期运行的可能性。可靠性是几乎所有提供商的云计算\
  \ SLA 中解决的最关键问题之一。另一方面，云服务提供商对其含义（涉及可用性、正常运行时间或弹性）、量化选项（网络、虚拟平台和服务器）、考虑的时间段以及保证条款（响应时间、解决时间）有着不同的看法\
  \ [15]。这种不确定性使客户面临风险，因此可靠性概念必须极其准确 [9]。\n\n接下来，我们提出了一种识别各种参数的方法，这些参数可用于估算云服务的可靠性。图\
  \ 4.2 展示了云计算系统的一个 SoA，这也是大多数当前云服务系统的常见表示。云管理系统（CMS）由一组服务器组成，可以是分布式的，也可以是集中式的。当客户请求特定云服务时，请求会被放入请求队列。CMS\
  \ 调度器随后从队列中取出一个请求，并根据“资源管理器”的可用性信息将服务调度到一台服务器上。\n\n**图 4.2 云计算管理系统**\n\n我们首先检查各种故障类型，然后介绍我们预测可靠性的方法。\n\
  \n## 云计算设备故障\n\n超时、溢出、数据资源丢失、软件故障、计算资源丢失、网络故障、数据库故障和硬件故障都是可能影响云服务可靠性的故障示例。所有这些故障简述如下。\n\
  \n**溢出**：请求队列中可保留的最大请求数应受到限制。相反，新请求将需要在队列中等待过长时间，增加与超时相关的故障可能性。当我们观察到队列已满时，新工作会被拒绝，用户无法接收服务，从而导致与溢出相关的故障。\n\
  \n**超时**：云服务的截止日期通常由应用协议或客户设置。当队列中的请求等待时间超过分配的时间时，会发生超时故障。因此，此类超时请求将从队列中移除，不影响后续请求。\n\
  \n**软件故障**：子任务是在不同资源上运行的软件程序，包含与软件相关的缺陷。\n\n**数据库故障**：存放必要数据资源的数据库也可能发生故障，阻止子任务访问所需数据。\n\
  \n**硬件故障**：硬件用于提供计算和数据资源（如服务器），也可能发生故障。\n\n**网络故障**：当子任务访问远程数据时，通信通道可能在物理或逻辑上被中断，导致网络故障，特别是在大数据集长时间发布时。\n\
  \n所有上述故障可分为两组，如下所示：\n\ni) **请求阶段故障**：超时和溢出故障。\nii) **执行阶段故障**：数据库故障、网络故障、硬件故障和软件故障。\n\
  \n第 (i) 组故障可能发生在作业请求成功分配给计算或数据资源之前或之后；第 (ii) 组故障可能发生在作业请求成功分配后以及子任务执行期间。云服务可靠性建模可分为两部分：请求阶段可靠性建模和执行阶段可靠性建模。\n\
  \n## 请求阶段可靠性\n\n我们考虑以下参数。\n\n**请求队列容量（`N`）**：这是请求队列能容纳的最大请求数。此外，假设遵循到达率为 λ 的泊松过程。为简洁起见，我们将此概率\
  \ `P(x:λ)` 定义为 `λa`。\n\n**服务截止时间（`Td`）**：这是从发送工作请求到作业完成所分配的时间量。\n\n**平均服务时间（`µ`）**：请求由多个调度服务器处理。我们认为所有这些服务器是同构的\n\
  \n\n\n# 可用性与可靠性的考量\n\n类似的设备、方案和结构。让我们考虑总共 *S* 台同构的计划服务器同时运行以服务请求。假设每台计划服务器完成一个请求所需的时间服从一个概率分布函数，该函数可通过检查服务的历史数据来确定。基于上述考量，我们将请求队列建模为马尔可夫过程，请求队列的马尔可夫建模示意图如图\
  \ 4.3 所示。\n\n在图 4.3 中，状态 *n* (*n* = 0, 1, …, *N*) 表示队列中的请求数量。注意，从状态 *n* 转移到状态 *n*\
  \ + 1 的概率为 *λa*（*n* = 0, 1, …, *N* – 1）。然而，在状态 *N* 时新请求的到达会导致请求队列过载，因此该请求被丢弃，队列保持在状态\
  \ *N*。现在，以概率 *µr* 在截止时间 *Td* 内由一台计划服务器完成服务，会发生状态变化，该变化与服务调度器当前正在运行的服务数量成正比。另一方面，如果\
  \ *n* ≤ *S*，则 *n* 个请求可由 *S* 台计划服务器即时服务，因此任一请求的离开率等于 *nµr*。如果 *n* > *S*，只有 *S* 个请求由调度服务器同时服务，因此离开率为\
  \ *Sµr*。\n\n设 *qn* 表示系统处于任意状态 *n* (*n* = 0, 1, …, *N*) 时的稳态概率。为了计算 *qn* 的值，我们必须求解以下等式：\n\
  \n对于 *n* = 0 或 1：\n```\nλa * q0 = µr * q1\n```\n(4.10)\n\n对于 *n* = 1 到 *S* - 1：\n\
  ```\nλa * q(i-1) + (i + 1) * µr * q(i+1) = λa * qi + i * µr * qi\n```\n(4.11)\n\n\
  对于 *n* = *S* 到 *N* - 1：\n```\nλa * q(i-1) + S * µr * q(i+1) = λa * qi + S * µr *\
  \ qi\n```\n(4.12)\n\n对于 *i* = *N*：\n```\nλa * q(N-1) = S * µr * qN\n```\n(4.13)\n\
  \n由于系统在任何时刻都将处于某一状态，我们有：\n```\nΣ(i=0 to N) qi = 1\n```\n(4.14)\n\n我们可以求解这些方程来确定\
  \ *qi* (*i* = 0, 1, …, *N*) 的值。\n\n溢出故障不发生的概率为：\n```\nΣ(i=0 to N-1) qi\n```\n(4.15)\n\
  \n现在，考虑到计划服务器的服务时间服从概率分布函数，设为 *P(t)*，处于某一状态的作业在截止时间内完成服务的概率为：\n```\nPr = ∫(0 to\
  \ Td) P(t) dt\n```\n(4.16)\n\n因此，超时或溢出不发生的概率为：\n```\nRStage1 = Σ(i=0 to N-1) qi\
  \ * ∫(0 to Td) P(t) dt\n```\n(4.17)\n\n该 *RStage1* 表示请求阶段的可靠性。\n\n## 执行阶段可靠性\n\n\
  当硬件、软件、数据库或通信连接等一个或多个组件发生故障时，执行阶段即告失败。因此，每个组件都有其自身的故障率。值得注意的是，在运行过程中不会对软件源代码进行更改，因此软件故障率保持不变\
  \ [[14]](#index_split_001.html#p85)。在包含电子元件的硬件运行阶段，通常观察到恒定的故障率。如果 *λi* 是任意第 *i*\
  \ 个元素的故障率，则 *τi* 为该元素运行 *τi* 时间时的可靠性 (Charles 2010)。\n\n```\nRi = e^(-λi × Ti)\n\
  ```\n(4.18)\n\n为了度量云服务中所用各类元素的执行时间，我们考虑了表 4.3 中提到的特性。我们可以根据上述要求度量各元素的执行时间，如表 4.4\
  \ 所示。我们可以利用服务中各变量的故障概率来度量执行阶段的可靠性，如下式所示。\n\n```\nRStage2 = e^(-Σ(i=1 to Y) λi ×\
  \ ti)\n```\n(4.19)\n\n因此，要使云基础设施成功部署，请求阶段和执行阶段都应具备相当的安全性。一旦确定了执行阶段和请求阶段的可靠性，我们将结合这两个阶段的可靠性以获得服务的可靠性：\n\
  \n```\nRService = RStage1 * RStage2\n```\n(4.20)\n\n### 表 4.3：云服务涉及的不同元素的特性描述\n\n\
  | **元素** | **参数** |\n| :--- | :--- |\n| 硬件 | 处理速度：*πi* (MIPS) |\n| 软件 | 工作负载：*ωj*\
  \ (指令数) |\n| 数据资源 | 数据下载/上传量：*αk* (MB) |\n| 通信 | 带宽：*βm* (bps) |\n\n### 表 4.4：不同元素中时间组件的计算\n\
  \n| **元素** | **执行时间** |\n| :--- | :--- |\n| 软件 | *ti(software)* = *ωi* / *pj* (当第\
  \ *i* 个软件运行在第 *j* 个硬件上时) |\n| 通信 | *tj(communication)* = *αi* / *βi* (当第 *m* 个通信链路在第\
  \ *i* 个数据资源上传输时) |\n| 硬件 | *tj(hardware)* = Σ(software) + Σ(communication) (运行第\
  \ *j* 个软件和第 *k* 个通信链路) |\n| 数据资源 | *ti* = Σ(communication) (数据资源的工作时间包含该资源被利用的总通信时间)\
  \ |\n\n### 4.4 结论\n\n在基于云计算的服务供给中，服务质量是一个主要关注点。SLA 已被确认为确保云服务 QoS 的关键工件。本章旨在填补这一空白。所提出的关于可用性和可靠性等参数的详细内容被视为确保\
  \ QoS 的关键。在客户与提供商之间的云服务背景下计算这些指标的方法也进行了深入解释。此外，质量属性的详细分析提供了超越异构世界缺陷的能力。属性描述可用于云监控工具。\n\
