  \ 第 2 章\n\n## 多层云中的机器学习、基于深度学习的优化\n\n### Punit Gupta and Mayank Kumar Goyal\n\n\
  ## 目录\n\n\n\n\n\n### 2.1 简介\n\n在对快速计算能力需求日益增长的这一代，云计算是满足未来需求并同时管理数据中心性能的最佳解决方案。云计算环境中的资源分配取决于资源使用情况、资源成本和调度器策略，以提高系统性能。局部或全局最优点提供了解决方案\
  \ [1, 2]。用户需求可直接在真实的云计算环境中测试，但这会增加额外成本；例如，Microsoft Azure 和 Amazon EC2 提供真实的测试环境。可扩展仿真可降低成本。云计算通过互联网利用虚拟资源提供动态服务\
  \ [2]。文献综述中提出了多种反应性技术，用于处理可靠和不可靠虚拟机上小任务执行的失败率。因此，在我们的研究工作中，我们专注于一种具有成本效益的主动容错策略。它分别包括基于预测的、基于标准的策略。这些方法侧重于历史日志、启发式、元启发式以及具有高可靠性的单目标和多目标分配。我们的重点领域包括云环境中基于预测的主动容错感知调度\
  \ [2]。Charity 等人专注于资源可靠性的主动方法，包括计算、存储和网络资源的配置参数 [3–6]。\n\nC. Zhao 等人展示了生物启发策略，可减少资源过度配置的开销。作者专注于使用生物启发遗传方法进行独立任务映射\
  \ [4]。\n\n在本文中，我们介绍了一种主动的、预测性的、功耗感知的容错高效调度技术，该技术基于结合 BB-BC 算法和前馈神经网络的混合方法。这也被称为基于容错\
  \ ANN（人工神经网络）的调度。结果表明，所提出的技术提高了虚拟机的可靠性。\n\n### 2.2 相关工作\n\n云计算是现代工业以可承受的成本、在可扩展且灵活的环境中实现高性能的一个有前景的选择。在现实世界中，云是各种服务的异构组合，按使用付费模式为用户提供各种存储、网络和处理服务。云计算负责按照对用户的承诺，以最低成本执行用户的高计算任务，而不妥协任何质量指标\
  \ [7–10]。为了管理这些任务，调度在提高云性能和用户服务质量方面发挥着重要作用。\n\nS. G. Damanal 等人 [11] 揭示了云计算环境中虚拟机的状态。作者还将主动负载均衡器视为工作的重点领域。还有空间实施支持动态环境和可扩展仿真的策略。研究人员描述了私有云的负载均衡方案。性能衡量标准包括利用率标准。作者主要关注用于可扩展云性能衡量的生物启发元启发式技术\
  \ [12]。\n\n作者考虑了自然启发的蚁群优化和粒子群优化技术，以改善服务质量 [13, 14]。Kalra 等人宣称了一项关于元启发式算法的综述 [15]。Beheshti\
  \ Z. 等人解释了用于云调度的基于种群的元启发式算法，包括遗传算法、PSO、ACO 等 [16–19]。作者还提出了各种用于最优全局解的优化标准。\n\nGenez\
  \ 等人 [20] 提出了一种使用性能指标完工时间、成本和带宽的混合云工作流调度器。H. R. Faragardi 等人 [21] 提出了一种新颖的工作流调度资源配置机制。性能使用\
  \ IaaS 云上的完工时间性能指标进行衡量。Q. Wu 等人 [22] 建模了多目标进化调度技术，并专注于完工时间和经济成本的同时优化。V. Arabnejad\
  \ 等人 [23] 引入了一种预算截止时间感知调度技术。作者还使用敏感性分析研究了所提技术的新颖性。S.K. Mishra 等人 [24] 专注于可扩展云场景中的两级配置。配置涵盖了任务到虚拟机的映射和虚拟机到主机的映射。性能使用功耗进行衡量。N.\
  \ Mansouri 和 M. M. Javidi [25] 提出了一种基于作业类型和成本的作业调度技术。性能使用数据密集型和计算密集型作业的响应时间进行衡量。Y.\
  \ Lu 和 N. Sun [26] 提出了一种资源感知的负载均衡任务调度技术。优化指标包括例如节能和资源利用率。所提技术支持绿色计算环境。我们的主要目标专注于利用恒定的\
  \ IaaS 云，在云计算环境中实现节能、时间和成本的权衡。在本节中，详细综述\n\n\n\n\n\n### 2.3 建议方法论\n\n该算法基于大爆炸-大挤压优化和人工神经网络的基本原理工作。\n\
  \n建议的模型将任务列表和虚拟机列表作为模型的输入。建议的模型分为以下阶段：\n\n1. 初始化。\n2. 数据集准备。\n3. 模型准备。\n4. 训练。\n\
  5. 反向传播。\n6. 任务调度。\n\n#### 2.3.1 初始化\n\n在该模块中，定义了所有参数，如输入层、隐藏层和输出层的数量，以及每层中的若干神经元：`学习率`、`变异率`、`种群大小`、`进化代数`、`输入层神经元数`、`输出层神经元数`、`隐藏层神经元数`、`激活函数`。该阶段使用这些参数定义了建议模型的效率和准确性。\n\
  \n#### 2.3.2 数据集准备\n\n在该阶段，使用大爆炸-大挤压算法准备训练阶段的数据集，以平均虚拟机利用率、网络延迟和执行时间作为适应度函数，同时提高网络、能效和完工时间。完整算法见第\
  \ 2.3.1 节。该阶段接收一个任务列表，该列表是各种任务的异构组合，以及一个作为资源可用的虚拟机列表。输入被送入建议的修改版 BB-BC 算法。该算法旨在以最少的进化代数和变异次数找到全局最优解。建议的感知功耗和网络的模型同时照顾网络延迟和资源利用率，以提高系统的功耗表现。\n\
  \n```\nj = n\nfitness_value i = Σ (α * Network_cost tj + β * Completion_time j +\
  \ γ * (1 / Failure_rate i))\nj = 1\nWhere α + β + γ = 1.\n```\n\n```\nn\nTotal_Execution_time\
  \ = Σ Task_Length i / MIPS j\ni = 1\n```\n\n公式 2.1 表示线性加权函数，其中网络成本的权重因子为 `α`，总执行时间的权重因子为\
  \ `β`。执行时间使用公式 2.2 进行测量。\n\n#### 2.3.3 模型准备\n\n在该模块中，使用初始化阶段的参数设计神经网络。模型由具有激活函数的输入层、隐藏层和输出层组成；输入层和隐藏层以这样的方式调整权重，使得网络的输出与训练数据集的预期输出相似。\n\
  \n自适应双层感知机模型的输出呈现处理用户请求的虚拟机标识。它使用前馈和反向传播方法来达到目标值。基于三层人工神经网络的模型提高了天文启发式遗传算法的性能。人工神经网络使用不同的学习率进行训练。输出的准确性取决于训练参数。网络有若干层，每层有若干节点。性能受训练机制影响。\n\
  \n#### 2.3.4 训练\n\n在该阶段，设计的神经模型使用在训练数据集准备阶段准备的 80% 训练数据进行训练。该阶段很重要，因为它负责设置神经网络的权重，这决定了神经网络的准确性。\n\
  \n训练过程初始化权重和偏置参数。该过程重复进行，直到达到目标值。建议模型的目标值包括实例标识，它以最小的完工时间完成任务。训练过程预测未知变量的适当值。训练机制包括基于误差修正的机制和基于记忆的机制。最优训练的神经网络提供具有准确性、稳定性和正确性的最优全局解。可用数据应通过应用经验法则进行分类，即\
  \ 80% 的可用数据用于训练，其余数据用于输出验证。激活函数 `Leaky ReLU` 用于隐藏层，Sigmoid 函数用于输出层。\n\n#### 2.3.5\
  \ 反向传播与误差修正\n\n此阶段的目标是通过调整输入层和隐藏层神经元的权重以达到预期输出，从而提高神经网络的准确性。\n\n建议模型遵循误差修正学习机制。误差修正学习机制使用代价函数\
  \ (`δk`) 提高服务质量。目标是利用如图 2.1 所示的 ANN 模型信号流图来最小化代价函数。误差修正学习机制使用公式 2.3 测量误差。\n\n```\n\
  ek(n) = dk(n) - yk(n)  (2.3)\n```\n\n```\nδk = 1/2 * ek(n)²  (2.4)\n```\n\n在公式 2.3\
  \ 和公式 2.4 中，参数 `dk(n)` 表示预期输出，`yk(n)` 表示实际输出，`ek(n)` 是误差，`δk` 是用于 ANN 模型学习过程的代价函数。\n\
  \n#### 2.3.6 任务调度\n\n在该阶段，使用经过适当训练的感知机模型进行任务调度，以提高调度时间、能效和任务的总执行时间。\n\n![Image 11](img/index-36_1.png)\n\
  \n**图 2.1** 云中建议的 BB-BC ANN 调度技术流程图。\n\n#### 2.3.7 大爆炸-大挤压算法步骤\n\n建议的算法认为云是各种服务提供商的异构组合，它们提供具有不同成本、资源和性能的服务。云控制器和任务调度策略负责在服务提供商上寻找合适的资源，以在最短时间、最低执行成本和规定的服务质量下完成任务。建议的算法旨在涵盖上述所有性能参数。\n\
  \n建议的算法分为四个模块：\n\n- 模块 1：初始化/种群生成。\n- 模块 2：适应度评估。\n- 模块 3：交叉/质心 + 变异。\n- 模块 4：大挤压。\n\
  \n##### 2.3.7.1 阶段 1：初始化/种群生成\n\n在该阶段，完成种群和其他基本参数的初始化，其中种群被视为一个完整的调度方案，由使用泊松分布生成的任务组成，因为任务在现实世界中的发生是完全随机的。概率分布函数如下式\
  \ 2.8 所示。\n\n```\np(X = x) = e^(-λ) * λ^x / x!\nwhere x = 0, 1, 2, 3...  (2.5)\n\
  ```\n\n\n\n\n\n其中 `x` 是表示种群规模（即任务数量）的自然数。`λ` 是请求到达率，通常大于零。在此阶段，初始化 `p` 个种群，并将随机\
  \ VM 分配给任务。这些种群最终构成一组预定义的随机生成任务，且每个种群中的个体均使用随机 VM ID 进行初始化。在此阶段之后，将为每个种群初始化适应度值，该值定义了每个调度方案的性能和服务质量。\n\
  \n##### 2.3.7.2 阶段 2：适应度评估\n\n该阶段从评估每个种群的适应度值开始，如下所示。适应度在判断调度方案是否参与下一代进化中起着重要作用。在\
  \ BB–BC 中，适应度也被称为调度方案的质量。在所提出的算法中，适应度函数定义如下：\n\n适应度值 `i` 定义为第 `i` 个种群的适应度，其中适应度函数是每个任务在\
  \ VM 上的成本与执行时间之和，`j` 表示任务数量。\n\n其中 `α` + `β` = 1。\n\n`j = n`\n\n```\nfitness_value_i\
  \ = Σ (a * Network_cost_tj + b * Completion_time_j) + g * (1 / Failure_rate_i)\n\
  j=1\n```\n\n任务完成时间变量使用公式 2.6 进行测量，其中 `Task_Length` 是任务的指令数，`VM_MIPS` 是 VM 的每秒百万指令数（MIPS），`PE`\
  \ 是处理器数量。\n\n```\nNetwork_cost_i = Network_delay_i\n```\n\n```\nFailure_rate_i =\
  \ Task_failed_count_i / T_D\n```\n\n故障模拟取决于概率分布函数。`Task_failed_count` 涉及一段时间 `ΔT`\
  \ 内的度量。\n\n公式 2.7 定义了在特定 VM 上执行任务期间所用资源的成本。在此阶段，评估所有调度方案的质量，然后进行进化。进化是一组在每次进化中重复的步骤，包括选择、交叉、变异和大爆缩阶段。\n\
  \n##### 2.3.7.3 阶段 3：交叉/质心与变异\n\n在此阶段，选择两个最优解。第一个解是成本最低的解，第二个解是适应度值最接近所有解质心的解，质心使用公式\
  \ 2.9 计算。质心指平均解或解空间中的平均位置，与最优解和最差解相比，它被认为是最稳定的。质心称为 `xc`。\n\n```\nxc = (Σ (1/fi)\
  \ * xi) / (Σ (1/fi))\ni=1 to N\n```\n\n`xc` 是 n 维空间中的一个点，其中 `N` 是种群数量。`fi` 是 `N`\
  \ 维空间中的第 `i` 个解。第二适应度最优解是最接近质心的解，即适应度值最接近质心的解。\n\n###### 2.3.7.3.1 交叉\n\n该阶段从选择阶段获取两个最优解，并执行多点交叉，即在两个选定解之间交换随机点。该阶段旨在从两个最优解中设计出更好的解。\n\
  \n###### 2.3.7.3.2 变异\n\n在此阶段，发现的第三优解利用基于交换的变异，将其多样性在搜索空间中扩散到其他种群的候选解中。\n\n![Image\
  \ 12](img/index-39_1.png)\n\n##### 2.3.7.4 阶段 4：大爆缩\n\n该阶段通过移除适应度值最差（即适应度值最高）的种群，发挥着重要作用。重复阶段\
  \ 2、3 和 4，直到仅剩下一个最优解。\n\n图 2.3 展示了所提出模型的流程图。\n\n### 2.4 实验结果\n\n在本工作中，我们专注于采用天文感知和人脑启发的方法来增强性能。在本节中，对所提出模型的性能进行评估。任务调度评估使用许多标准。许多指标如下所示：\n\
