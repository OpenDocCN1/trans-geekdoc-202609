  深度学习算法具有通过过去的数据集进行学习并预测未来最佳可能解决方案的能力。因此，引入深度学习算法将使云计算在各个方面都更加可行，无论是成本、能源还是资源分配。基于过去数据集训练后做出的决策将提高准确性并最小化时间，因为无需人工干预。算法能够自我学习。所有云模型均可通过神经网络和深度学习概念实现；无需额外的常规算法。`人工神经网络`/`前馈神经网络\
  \ (ANN)`、`卷积神经网络 (CNN)` 和 `循环神经网络 (RNN)` 是用于开发这些智能算法的技术。\n\n\n\n\n# 云计算正在快速发展，数据解读和复杂性也是如此。\n\
  \n通过常规程序和功能来处理如此大量的数据相当困难；这将花费很长时间和大量人力来处理数据。自学习算法是解决此问题的良方，因为它们能在极短的时间内以良好的可靠性水平处理、解读、总结并产出结果。云计算只是一个可扩展的系统，可随时处理任意数量的数据。由于大量数据正在被传输和处理到云端，技术和手段始终需要改进。这些智能算法将使云更加可靠、可扩展和分布式，同时使其在能源、成本和功耗方面更加高效。\n\
  \n![Image 37](img/index-90_1.jpg)\n\n## 神经网络与深度学习 ◾ 75\n\n在本章中，我们将重点关注资源分配问题及影响资源分配的因素。我们将讨论云计算、深度学习算法以及关于云计算和深度学习的一些综述工作，并提出混合模型。\n\
  \n#### 5.1.1 云交付/部署模型\n\n根据 NIST 标准，云计算分为四种部署/交付模型（图 5.1）。\n\n*   **公有云**：由第三方运营，通过互联网提供服务器和存储等资源。Microsoft\
  \ Azure 就是公有云的一个例子。在公有云中，所有硬件、软件和基础设施均由提供商管理。用户只能通过 Web 浏览器访问这些服务并管理其账户。\n*   **私有云**：顾名思义，这是一种专用云服务，资源专供单个企业或组织独家使用。私有云可以位于公司场地内，也可以付费由第三方专门为该组织进行管理。\n\
  *   **混合云**：结合了公有云和私有云，使数据和应用程序可以在公有云和私有云之间移动。它为现有基础设施提供了极大的灵活性和更多的部署选项。\n\n图 5.1\
  \ 云计算部署模型。\n\n![Image 38](img/index-91_1.jpg)\n\n*   **社区云**：与上述定义的云类型不同，社区云专供具有共同关注点或共同目标的特定社区独家使用。\n\
  \n#### 5.1.2 云服务/模型类型\n\nNIST 定义的三种服务类型为 SaaS、PaaS 和 IaaS，分别侧重于特定层：硬件、系统软件（平台）和应用程序。这三种服务模型描述如下（图\
  \ 5.2）：\n\n*   **软件即服务**：该服务按需通过互联网提供软件应用程序。用户无需在本地机器上安装。用户可通过 Web 浏览器访问该软件。用户无法控制该应用程序，只能使用。所有维护和更新均由提供商处理。\n\
  *   **平台即服务**：指提供用于开发、测试和交付软件应用程序环境的云服务。用户能够在所提供的平台上安装和操作应用程序。PaaS 包括服务器、存储、网络和开发工具等服务。\n\
  *   **基础设施即服务**：IaaS 将整个基础设施作为服务提供，可按需快速扩展或缩减，且您只需为所用内容付费。用户可购买、安装、配置和管理自己的软件、操作系统和任何应用程序，而基础设施由服务提供商管理。\n\
  \n图 5.2 不同服务层级的云服务提供商。\n\n#### 5.1.3 云计算中的当前问题\n\n尽管云计算非常有能力处理组织的数据迁移，但不断增加的数据量和处理导致资源利用率低下，从而增加了成本、功耗和能耗。下面列出了一些常见的云计算问题。\n\
  \n##### 5.1.3.1 成本管理\n\n云计算的分布式特性有助于为组织节省成本。云计算可帮助组织省钱，因为它们无需为硬件或资源进行额外投资。问题在于云计算的按需和可扩展特性，这可能导致对所需资源和成本的预测不准。\n\
  \n##### 5.1.3.2 安全问题\n\n不断增加的数据量和组织迁移产生了重大的安全顾虑。安全正成为云计算中最主要的问题之一，因为组织无法看到存储数据的确切位置。这可能导致数据泄露问题。尽管安全性正在快速提高，但对于将敏感和专有数据迁移到云端，仍存在信任问题。\n\
  \n##### 5.1.3.3 迁移\n\n将数据从本地移动到云端或反之的过程称为迁移。移动新应用程序是一个分步过程，相当简单，但将现有应用程序移动到云环境中仍是一项具有挑战性的任务。\n\
  \n##### 5.1.3.4 性能\n\n已迁移到云端的组织完全依赖服务提供商，因为硬件资源没有物理实体，且缺乏对资源的控制。因此，无论是迁移过程还是资源分配过程，保持平稳的性能对云系统而言也是一项挑战。\n\
  \n##### 5.1.3.5 多云（混合云）管理\n\n公有云在私密和机密数据的安全性和隐私方面仍不可完全信任。因此，私有云和公有云的混合成为组织的首选，它们可将机密数据存储在私有云中，其余数据存储在公有云中以节省成本和能源。管理此类云对服务提供商而言也是一项挑战。\n\
  \n##### 5.1.3.6 资源分配与管理\n\n组织迁移增加了云环境的工作负载。尽管云技术正在快速改进，但由于难以维护这种灵活需求和服务方式下的性能，它仍不适合所有人。这可能会增加资源的成本和时间，且无法实现资源的合理利用。仍需要一种更好的方式来优化资源。\n\
  \n#### 5.1.4 影响资源分配的因素\n\n##### 5.1.4.1 资源扩展\n\n扩展是指根据用户需求向上或向下调整资源的能力。不需要时减少资源，需要时增加资源；这会影响云系统的成本和能源效率。资源的合理管理将带来更好的云性能。Gartner\
  \ 对自动扩展的定义如下：\n\n> 自动扩展实现了可供应用程序使用的系统容量的自动扩张或收缩，是云 IaaS 和 PaaS 产品中一种普遍期望的功能。在可行的情况下，技术采购者应利用它使预置容量与应用程序需求相匹配并节省成本[[2]](#index_split_001.html#p108)。\n\
  \n从学术角度来看，自动扩展是云动态提供虚拟化资源的能力。云使用的资源可以自动增加或减少。\n\n##### 5.1.4.2 能源利用\n\n更好的能源利用是影响资源优化进而影响云性能的另一个主要因素。不断增长的需求\n\
  \n\n\n\n## 5.1.4 Energy Efficiency and Cost\n\nBetter performance will reduce energy\
  \ efficiency, resulting in increased costs.\n\nDue to the increase in data centers\
  \ and their various computing operations, it is necessary to establish energy-efficient\
  \ resource allocation mechanisms. These centers lead to massive carbon emissions.\
  \ Ashkan Paya and Dan C. Marinescu proposed relevant solutions in their paper \"\
  Energy-Aware Load Balancing and Application Scaling for Cloud Ecosystems\" [3].\
  \ Proper management of resources will lead to energy-efficient cloud systems. The\
  \ reduction in energy consumption will lower operational expenditures, making the\
  \ cloud more profitable.\n\n## 5.1.4.3 Virtual Machine (VM) Migration\n\nThe cloud\
  \ is a distributed environment where users can migrate workloads to different machines\
  \ to complete execution quickly. Virtualization means running multiple logical machines\
  \ on a single physical machine. During migration, the VM moves from one physical\
  \ machine to another. Migration can be offline or online (live). In offline migration,\
  \ the machine stops until the migration process completes; whereas in online (live)\
  \ migration, client services are not interrupted during the migration process. Live\
  \ migration has been widely used to reduce energy consumption, for load balancing,\
  \ and for dynamic resource allocation.\n\nTo migrate a VM, the entire VM state must\
  \ be transferred from the source to the destination. The VM includes persistent\
  \ storage, volatile storage, the state of connected devices, and the internal state\
  \ of the virtual CPU. Persistent storage does not need to be moved as it is provided\
  \ by Network Attached Storage (NAS). The CPU state and the state of virtual devices\
  \ with smaller volumes can be easily transferred to the destination host. The main\
  \ issue with live migration is the transfer of main memory (i.e., volatile storage)\
  \ because it contains gigabytes of data [4].\n\nThe importance of the cloud is growing\
  \ exponentially. Gartner predicts that the cloud services market will grow by 17.3%\
  \ in 2019 (reaching $206.2 billion), and by 2022, 90% of organizations will use\
  \ cloud services [2] (Table 5.1).\n\n### Table 5.1 Forecast of Worldwide Public\
