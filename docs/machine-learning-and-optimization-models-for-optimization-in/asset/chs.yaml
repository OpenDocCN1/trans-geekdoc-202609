  \ 简介\n\n随着云计算的出现，将计算作为一种公用事业来使用的梦想已成为现实。云允许您以各种服务的形式使用所有计算资源 [1]。所有这些服务都非常灵活，提供了易用性。在云计算中，云是互联网的隐喻，这意味着可以借助互联网获取计算服务。由于互联网是云计算的骨干，所有服务都与位置无关，即访问服务只需要互联网连接，您可以从世界任何地方获得访问权限。关于云计算有许多描述，但标准定义由\
  \ NIST [2] 给出：云计算是一种模型，用于实现普遍、便捷、按需的网络访问，进入可配置的计算资源共享池（例如网络、服务器、存储、应用程序和服务），这些资源可通过最少的管理工作或服务提供商交互快速配置和释放。\n\
  \n#### 9.1.1 云计算的基本特征\n\n云计算有五个基本特征，这些特征的存在使云系统区别于网格计算和分布式计算等其他计算环境。\n\n**图 9.1**\
  \ 展示了云的这些特征。\n\n*   **可度量服务**：此功能允许用户仅为其使用的服务付费。云系统中存在计量能力，用于度量提供给用户的服务。提供商和用户均可监控资源使用情况。会针对每个应用程序度量资源利用率，以便据此进行计费。\n\
  *   **快速弹性**：此功能使云服务在使用方面具有灵活性。云服务可根据用户需求进行配置或释放。云系统的更好性能需要资源的快速扩展/缩减。\n*   **按需自助服务**：此特征允许云用户在无需云服务提供商干预的情况下访问云服务。可使用\
  \ Web 自助服务来请求云数据中心的资源。在云计算中，用户可以增加或减少其服务需求（如存储、服务器等），而无需人工干预。\n*   **资源池化**：多租户成为可能归功于此功能。为了服务大量用户，云中会创建一个资源池。该资源池应足够大且灵活，以容纳多个租户。此外，云为所有客户提供了一层抽象，使服务独立于资源的物理位置。\n\
  *   **广泛网络访问**：云服务可通过其遍布全球的广泛网络进行访问。这些服务可通过标准机制访问，这些机制使用异构的瘦或厚客户端平台，例如工作站、笔记本电脑、平板电脑和手机。此功能确保在任何情况下没有人会脱离环路。\n\
  \n#### 9.1.2 云服务模型\n\n根据提供给用户的服务类型，云可分为三种服务模型。**图 9.2** 展示了服务模型。\n\n*   **软件即服务**：这是一种通过互联网提供软件功能的模型。访问此模型的用户无需安装软件及进行维护。他/她可以直接借助互联网浏览器使用任何应用程序。Google\
  \ Docs 是一个非常流行的例子。\n*   **平台即服务**：该模型供应用程序开发人员使用，他们可以直接开始开发应用程序，而无需担心其工作平台（如操作系统、服务器端脚本语言等）的安装。Google\
  \ App Engine 和 Hadoop 是该模型非常著名的例子。\n*   **基础设施即服务**：每当有人需要计算基础设施（如计算机、网络、存储等）时，则使用此模型。所有资源均通过虚拟化由用户访问。Google\
  \ Compute Engine 是此类云模型的一个例子。\n\n## 9.2 云技术：虚拟化\n\n在云数据中心为每个用户单独配置资源是不可行的；因此，云服务提供商有必要引入一种机制，在多个用户之间共享资源，而不\n\
  \n\n\n\n\n# 虚拟化与用于虚拟机放置的元启发式算法\n\n虚拟化是解决用户隐私泄露问题的方案。借助虚拟化，云服务提供商能够以更少的数据中心硬件容纳大量用户。虚拟化创建各种虚拟机，它们共享底层物理机的实际资源。这是在虚拟机监视器（VMM）的帮助下完成的，VMM\
  \ 将计算环境与物理资源分离开来。图 9.3 表明，可以在单个硬件平台上创建多个虚拟机，其中所有虚拟机彼此完全隔离。\n\n![Image 72](img/index-180_1.jpg)\n\
  \n**图 9.3** 云中的虚拟化。\n\n云虚拟化帮助云提供商向用户提供其应用程序的标准版本。虚拟化提供了云资源池的统一视图。虚拟机不依赖于底层硬件。VMM\
  \ 在虚拟机和物理机之间提供解耦。它将虚拟机的状态保存在一个文件中。因此，虚拟机可以像文件一样轻松地从一台物理机迁移到另一台物理机。这一特性在云计算中发挥着重要作用。\n\
  \n虚拟化是云计算的核心。每当有新的用户请求到来时，都会创建一个虚拟机来满足该请求。通过虚拟化，用户之间相互隔离。\n\n#### 9.2.1 云中的功耗\n\n\
  云的广泛接受使其规模急剧扩大。因此，云数据中心包含大量设备。IT 基础设施及其冷却系统消耗大量电力，导致高昂的电费账单。电费账单是运营成本的主要部分。每个云提供商都试图降低运营成本，以实现高投资回报。因此，电源管理在云中起着至关重要的作用，因为运营成本的很大一部分源于功耗。在\
  \ IT 基础设施中，服务器是主要的功耗消费者。在本章中，我们将交替使用“服务器”和“物理机”这两个术语。因此，目前大多数研究工作仅考虑服务器消耗的功率。它们都采用了线性功耗模型。据观察，物理机\
  \ CPU 利用率从空闲状态增长到完全利用状态，与能耗呈线性关系 [[3]](#index_split_003.html#p196)。因此，物理机的功耗 `PPM`\
  \ 可以用其 CPU 利用率来表示，如公式 9.1 所示。\n\n```\nPPM = (pmax - pmin) * UCPU_p + pmin\n```\n\
  **(9.1)**\n\n其中 `pmax` 是最大工作负载下的功耗，`pmin` 是最小工作负载下的功耗（工作负载可以为 0）。\n\n据观察，空闲服务器消耗\
  \ 70% 的能量 [[3]](#index_split_003.html#p196)。因此，公式 9.1 可修改为公式 9.2 所示。\n\n```\nPPM\
  \ = (0.3 * UCPU + 0.7) * pmax\n```\n**(9.2)**\n\n同样，虚拟机的功耗也可以计算。在服务器上审慎地放置虚拟机可以非常高效地节省电力。低资源利用率导致功耗\
  \ [[4]](#index_split_003.html#p196)。据观察，云数据中心服务器的利用率大部分时间保持在 10% 到 50% 之间 [[5]](#index_split_003.html#p196)。因此，服务器大部分时间处于利用率不足或空闲状态。记录显示，即使是空闲服务器也消耗其峰值负载功耗的\
  \ 70% [[3]](#index_split_003.html#p196)。因此，可以关闭空闲服务器以节省电力。虚拟机整合是此类节省云数据中心中利用率不足的服务器所消耗能量的最著名方法。\n\
  \n#### 9.2.2 虚拟机整合\n\n在虚拟机整合中，服务器的利用率得到优化。空闲的物理机被关闭。虚拟机整合试图将一定数量的虚拟机分配给最少数量的物理机。使用虚拟机整合，云服务提供商可以实现其资源的优化利用。在虚拟机整合中，虚拟机从一台物理机重新定位到另一台物理机，以实现资源的最佳利用。这有助于动态资源管理。当虚拟机整合到最少数量的物理机上时，空闲的物理机可以被关闭以节省能源。虚拟机整合过程如图\
  \ 9.4 所示。\n\n![Image 73](img/index-182_1.jpg)\n\n**图 9.4** 虚拟机整合过程。\n\n## 9.3 用于虚拟机放置的元启发式算法\n\
  \n虚拟机放置任务被视为 NP-hard 问题，因此无法找到最优解。虚拟机的最优放置始终是云服务提供商面临的挑战性任务。元启发式算法在这方面可以提供很大帮助。利用这些算法，可以获得接近最优的解。元启发式是一种高层的、与问题无关的算法框架，它提供了一组准则或策略，用于开发启发式优化算法。\n\
  \n元启发式算法受现实生活问题解决方案的启发。根据解的数量，元启发式算法大致可分为两类，如图 9.5 所示。\n\n*   **基于单解**：在这种类型的元启发式方法中，仅采用一个候选解。应用的启发式仅尝试改进该解。此类元启发式的典型例子包括模拟退火和引导局部搜索。\n\
  *   **基于种群**：这在搜索空间中考虑多个候选解，并尝试同时修改多个解。蚁群优化、粒子群优化和遗传算法是著名的例子。\n\n![Image 74](img/index-183_1.jpg)\n\
  \n**图 9.5** 元启发式算法的分类。\n\n### 9.3.1 模拟退火\n\n这是一种用于在大搜索空间中优化函数的技术。它受物理退火过程启发，即材料被加热然后冷却以转化为所需的结构。该过程从某个随机解（称为初始解）开始。此时温度设置为\
  \ `T0`。有三种降温规则，即：线性降低、缓慢降低和几何降低。根据所使用的模型，可以采用其中任意一种。温度迭代降低，直到达到终止条件。然后选取一个邻域解并将其视为新解。如果旧解和新解的成本函数之差大于\
  \ 1，则新解更好，否则保留旧解。该过程持续直到达到终止条件。\n\n**算法：模拟退火**\n\n```\n取一个随机解 Soln0\n设置温度 = T0\n\
  当 (未达到终止条件) 执行\n    降低温度\n    找到 Soln0 的一个邻域解 Soln1\n    如果 (fitness(Soln1) 优于 fitness(Soln0))\n\
  \        Soln0 = Soln1\n结束当\n返回 Soln0\n```\n\n\n\n\n\n# 模拟退火用于虚拟机放置\n\nWu 等人 [\\\
  [6\\]](#index_split_003.html#p196) 首先将模拟退火应用于寻找云数据中心中虚拟机的最优放置以节省能源。所提出方法的名称是基于模拟退火的虚拟机放置（SAVMP）。该方法分为四个部分。第一部分在某些约束条件下找到虚拟机在物理机上的放置配置。生成初始配置的一个邻域配置。然后在第三部分，计算新配置的能量偏差。在最后一部分，进行温度调度。该方法与\
  \ FFD 进行了比较，结果发现 SAVMP 消耗的能源更少。\n\nRajabzadeh 等人 [\\[7\\]](#index_split_003.html#p196)\
  \ 提出了一种虚拟机管理方法。它在马尔可夫链模型中使用并行模拟退火进行虚拟机放置。有两个管理器，称为全局管理器和局部管理器。全局管理器负责虚拟机迁移和整合，而局部管理器检测过载/低载/临界条件并选择用于迁移的虚拟机。当主内存的大部分被占用时会发生临界条件，因为这可能导致\
  \ SLA 违规。初始种群由一个物理机列表组成，不包括低负载和过载的物理机，这是通过四分位数间距完成的。然后考虑待迁移的虚拟机，条件是虚拟机的数量应与列表中物理机的数量相同。最初采用随机分配方案并计算其适应度值。适应度函数计算特定虚拟机放置后能源消耗的增加量。初始温度设置为\
  \ `T0`。作者设计了自己的模型来设定初始温度。为种群中的每个成员生成若干邻居，并计算它们的适应度值。根据模拟退火比较规则，种群中的每个成员都与其邻居进行比较，如果邻居胜出，则将其添加到主种群中。该过程迭代直到达到终止条件。该工作在\
  \ CloudSim 上进行仿真，并与 LRMMT 和 LRMC [\\[8\\]](#index_split_003.html#p196) 进行比较。结果发现其性能优于比较算法。\n\
  \nMarotta 等人 [\\[9\\]](#index_split_003.html#p197) 提出了一种基于模拟退火的虚拟机整合方法。他们选取了一组物理机\
  \ `j` 和一组虚拟机 `m`。问题定义为：给定分配到一组物理机上的一组虚拟机，需要找到虚拟机的迁移方案，使得新的活跃物理机集合消耗的功率与迁移次数的线性组合最小。算法包含一个扰动阶段，通过迁移单个虚拟机（称为扰动），从当前解找到一个新解。虚拟机迁移使用期望指数完成，该指数是虚拟机利用率的\
  \ Sigmoid 函数。该算法与 FFD 和 Sercon [\\[10\\]](#index_split_003.html#p197) 进行了比较，并在 Java\
  \ 实现中消耗了更少的功率。\n\n# 蚁群优化\n\n蚁群算法是一种用于优化问题的概率技术。它由 Marco Dorigo 在 1990 年代提出。它基于蚂蚁在寻找食物与蚁群之间路径时的觅食行为。在此过程中，蚂蚁会识别出两者之间的最短路径，如\
  \ 图 9.6 所示。在 图 9.6 中有两条到达食物的路径。基于路径上的信息素，所有蚂蚁在时间 `T = 3` 时都选择了通往食物的较短路径。\n\n## 算法：蚁群优化\n\
  \n```\n生成若干解（蚂蚁），称为种群\n初始化信息素轨迹和参数\n将每只蚂蚁放置在起始节点\n当（未达到终止条件）执行\n    对每只蚂蚁 a 重复执行\n\
  \        根据状态转移规则选择下一个节点\n        更新信息素\n    结束循环\n直到每只蚂蚁都有一个解\n更新最优解\n结束循环\n返回最优解\n\
  ```\n\nX. F. Liu 等人 [\\[11\\]](#index_split_003.html#p197) 提出了一种使用蚁群算法进行虚拟机放置的方法。结合顺序交换迁移后，该方法称为\
  \ OEMACS。它考虑了两种资源，即 CPU 和内存，用于检查物理机容量以分配虚拟机。功耗仅针对 CPU 计算。邻接矩阵用于获取虚拟机和物理机的映射。ACO\
  \ 寻找虚拟机到物理机的映射，使得处于活跃状态的物理机数量最小，以优化功耗。信息素包含关于虚拟机之间关系的信息。整合虚拟机的标准是将相关的虚拟机分配在同一物理机上。最初虚拟机和物理机具有一对一映射。在每次迭代中，利用信息素生成的解使物理机数量减少。顺序交换操作用于平衡物理机的资源利用率，即从过载物理机迁移虚拟机。结果表明，所提算法在同构和异构环境中均表现良好。\n\
  \nAryania 等人 [\\[12\\]](#index_split_003.html#p197) 提出了一种基于蚁群系统的节能感知虚拟机整合（EVMCACS）。它考虑两种资源：CPU\
  \ 和内存，将物理机分为四类，即正常负载、低负载、高负载和预测高负载。在虚拟机整合过程中，它还考虑了迁移虚拟机所消耗的能量，该能量近似为虚拟机大小的函数。所提算法与\
  \ ACSVMC [\\[13\\]](#index_split_003.html#p197) 进行了比较，发现在关机物理机数量、虚拟机迁移次数和 SLA 违规方面，性能优于比较算法。\n\
  \nFares 等人 [\\[14\\]](#index_split_003.html#p197) 设计了一种虚拟机放置方法以降低数据中心的功耗。在他们的工作中，他们提出了一种嵌入在蚁群优化中的新启发式算法，用于将虚拟机放置在物理机上。该方法将首次适应递减\
  \ [\\[14\\]](#index_split_003.html#p197) 的解作为初始信息素的值。识别特定虚拟机的最佳物理机的启发式算法不仅考虑功耗，还考虑\
  \ CPU 利用率和 CPU 容量。该算法分两个模块工作。第一个模块为每只蚂蚁找到最佳解，第二个模块尝试改进全局最优解。该方法在三个参数上进行评估，即节能、可扩展性和运行时性能。该方法与两种现有算法进行了比较，结果表明它优于比较算法。\n\
  \n# 粒子群优化\n\n粒子群优化由 Kennedy 于 1995 年设计。这是一种基于种群的随机算法。它基于鱼群或鸟群的行为。在优化问题中，粒子群是候选解的集合。单个潜在解称为粒子。粒子有两个特征，即位置和速度。粒子可以相互作用以找到最佳解。每个粒子都有一个适应度值，该值通过目标函数计算得出。\n\
  \n\n\n\n\n# 元启发式算法\n\n每个粒子都知道自身的最佳性能和群体的最佳性能。基于最佳性能，每个粒子改变其速度，从而相应地改变位置。图示表明，最初鸟儿朝一个方向飞行，随后根据全局最优改变了其方向（图\
  \ 9.7）。\n\n伪代码描述了粒子群算法的通用过程，以实现任意函数的优化值。\n\n**图 9.7** 粒子群优化。图示表明，最初鸟儿朝一个方向飞行，随后利用粒子群优化根据全局最优改变了其方向。\n\
  \n## 算法：粒子群优化\n\n```\n用随机位置和速度初始化粒子。\n\n当（未达到终止条件）时 执行\n    对每个粒子 p 执行\n       \
  \ 计算适应度(p)\n        如果 (适应度(p) 优于 个体最优(p))\n            设置 个体最优(p) = 适应度(p)\n  \
  \      结束 如果\n        如果 (个体最优(p) 优于 全局最优)\n            全局最优 = 个体最优(p)\n       \
  \ 结束 对于\n    对每个粒子 p 执行\n        更新 p 的位置和速度\n    结束 对于\n结束 当\n\n返回 全局最优\n```\n\n\
  Xiong 等人 [15] 基于粒子群优化提出了一种用于能量优化的 VM 放置算法，称为基于粒子群优化的多资源能量效率算法（MREE-PSO）。共有 `n` 个\
  \ VM 和 `m` 个 PM。粒子即为 VM。粒子的位置向量定义为 `Xti = (xti1, xti2, ..., xtij, ..., xtim)`，其中\
  \ `t` 表示迭代次数，`i` 代表第 `i` 个可能的解，`j` 是 VM 的序号。借助一个 `m*n` 的 0-1 矩阵更新所有粒子的位置。如果特定 VM\
  \ 分配给指定 PM，则条目为 1，否则为 0。\n\n`P` best 和 `G` best 分别是个体最优和全局最优的向量。个体适应度函数和全局适应度函数的值分别设为\
  \ 0.8 和 0.7，以避免局部最优。当迭代次数达到预定义数字时停止。最后一次迭代中找到的映射被视为 VM 在 PM 上的最终放置。该算法在 CloudSim\
  \ 上进行仿真，结果显示与其他算法相比具有能效优势。\n\nAruna 等人 [16] 提出了一种用于将 VM 放置到 PM 上的粒子群优化方法，目标是最小化功耗。他们使用了\
  \ CPU 的线性功耗模型来计算功耗。他们基于条件 `N < M` 选取了 `N` 个 VM 和 `M` 个 PM。因此粒子具有 `N` 维向量。每个维度可映射到一组离散值，上限为\
  \ `M`。每个粒子初始被分配随机位置和速度。每个粒子的当前位置称为个体最优。适应度函数是每个粒子能耗之和，旨在将其最小化。根据个体最优和全局最优，使用位置和速度更新的通用方程更新每个粒子的位置和速度。因此，通过迭代实现了寻找\
  \ VM 放置方案的目标，使所用 PM 的功耗最小化。该算法在 CloudSim 上仿真，结果优于非功耗感知方法。\n\nIbrahim 等人 [17] 提出了一种基于粒子群优化的功耗感知技术（PAPSO），以确定迁移\
  \ VM 的近似最优放置。该技术不仅试图降低 PM 的功耗，还照顾到 SLA 违规问题。这是通过将过载 PM 的数量保持在尽可能低的水平来实现的。该过程考虑除过载\
  \ PM 以外的 PM 集合以及待迁移的 VM 集合。生成映射并计算其适应度值。该技术在 CloudSim 上实现，并与功耗感知最佳适应递减算法进行比较。结果显示，在能耗和\
  \ SLA 违规方面均表现更优。\n\n#### 9.3.4 遗传算法\n\n遗传算法是一种基于查尔斯·达尔文自然进化理论的搜索启发式算法。遗传算法分五个阶段进行，即：初始种群、适应度函数、选择、交叉和变异。一组个体被视为初始种群。所有个体都有称为基因的定义参数。基因经历变异和交叉以产生更好的下一代。产生的个体通过适应度函数测试，最优个体被选中进行繁殖。因此，通过迭代我们得到下一代的最优个体，并在达到目标后停止。\n\
  \n## 算法：遗传算法\n\n```\n生成具有随机个体的种群\n\n当（未达到终止条件）时 执行\n    对每个个体 i 执行\n        计算适应度(i)\n\
  \    结束 对于\n    选择最优个体\n    对选定个体应用交叉\n    对选定个体应用变异\n    用更优个体更新种群\n结束 当\n\n返回\
  \ 最优个体\n```\n\nTang 等人 [18] 提出了一种混合遗传算法（HGA），以功耗高效的方式放置 VM。该过程考虑了 PM 消耗的能量以及 PM\
  \ 的通信网络。它为 PM 使用了三层架构。目标是最小化 PM 的能耗以及 VM 之间发生的通信能耗。存在一些可行性条件，如 PM 的 CPU 和内存容量。该过程从种群中取出每个个体并检查可行性条件。如果不合格，则应用修复过程使其可行，并计算其适应度值。为了配对个体解，应用了轮盘赌选择过程。为了产生后代，使用了偏向均匀交叉。该过程持续直到找到最佳解。该工作用\
  \ Java 实现，结果优于标准遗传算法。\n\nZhao 等人 [19] 提出了一种新颖的 VM 放置算法，结合了遗传算法和禁忌搜索算法，统称为 GATA。在该工作中，集合\
  \ `V` 表示 VM 集合，`H` 表示 PM（宿主机）集合。目标是找到一个集合 `H' ⊆ H`，使其能容纳所有现有 VM，且 `H'` 中 PM 的功耗最小，负载均衡以满足\
  \ QoS。VM 放置方案用等长实数编码表示。如果有 `n` 个 VM 和 `m` 个 PM（考虑 `n < m`），则初始种群为 VM 到 PM 的随机分配，使得每个\
  \ PM 仅分配一个 VM。因此当达到 `m` min 时过程将停止。\n\n## 9.3.5 生物地理学优化（BBO）\n\n生物地理学是研究物种在地理空间分布的学科。它由\
  \ Simon 于 2008 年提出。它研究不同栖息地之间物种的迁移，其中每个栖息地与一个栖息地适宜性指数（HSI）相关联。HSI 基于适宜性指数变量（SIVs）。高\
  \ HSI 的栖息地具有高迁出率和低迁入率。在优化中，每个候选解称为一个栖息地。候选解的适应度值即为其 HSI。该算法与 GA 的主要区别在于它不涉及繁殖。\n\
  \n## 算法：生物地理学优化\n\n```\n生成一组随机栖息地\n\n对每个栖息地 Hi 执行\n    计算每个栖息地的 HSIi。\n结束 对于\n\n\
  按 HSI 升序排列栖息地\n\n当（未达到终止条件）时\n    更新每个栖息地的物种数量\n```\n\n\n\n\n\n## 计算所有栖息地的迁入率和迁出率\n\
  \n应用迁移和变异以获得解的更新栖息地集合\n\nend while\n\nreturn best solution\n\nZheng 等人 [\\[20\\\
  ]](#index_split_003.html#p197) 提出了一种基于 BBO 的多目标虚拟机放置方法，称为 VMPMBBO。其在虚拟机放置中的目标是在约束条件下最小化能耗和资源浪费，该约束条件为：托管在特定物理机\
  \ (PM) 上的虚拟机 (VM) 的资源需求不会超过该物理机的资源。该方法与三种现有的多目标方法进行了比较，并在合成数据上进行仿真后发现效果更好。\n\nLiu,\
  \ Jialei 等人 [\\[21\\]](#index_split_003.html#p197) 将虚拟机放置问题映射到生态系统模型，并重新定义了原始 BBO\
  \ 算法算子。修改后的 BBO 策略经过了鲁棒性、性能和可扩展性测试。生态系统模型在 WebCloudSim 上进行仿真。性能与 RFF、SGGA-P、SBBO-R\
  \ 和 MGGA 进行了比较。\n\n#### 9.3.6 蜜蜂优化算法\n\n蜜蜂优化算法由 Pham、Ghanbarzadeh 等人于 2005 年设计 [\\\
  [22\\]](#index_split_003.html#p197)。它基于蜜蜂的觅食行为。一群被称为侦察蜂的蜜蜂负责从花朵中寻找优质食物。在优化问题中，每个候选解被视为一个食物源，并利用一群蜜蜂在解空间中搜索最优解。\n\
  \n### 算法：蜜蜂优化\n\n用随机种群初始化\n\n当 (未达到终止条件) 执行\n\n派遣侦察蜂搜寻食物。\n\n将侦察蜂转化为采集蜂。\n\n计算采集蜂采集到的花蜜量。\n\
  \n如果 (观察蜂被分配) 则\n\n为观察蜂及其邻域选择食物源。\n\n否则\n\n记忆最佳位置\n\n找到枯竭的食物源并将采集蜂转化为侦察蜂。\n\nend\
  \ if\n\nend while\n\nreturn best food position\n\nP. Sharma 等人 [\\[23\\]](#index_split_003.html#p198)\
  \ 提出了一种基于蜜蜂算法的任务调度技术。该设计方法用于移动云计算，其中移动用户向云服务器发送处理请求。首先，他们应用修改后的最佳适应递减算法对任务进行排序。人工蜂群算法与支持向量机相结合，以优化任务调度并降低能耗。该工作在\
  \ MATLAB® 上测试，并与文献 [\\[24\\]](#index_split_003.html#p198) 中的现有方法进行比较。结果表明，所提方法更加节能。\n\
  \nLiu 等人 [\\[25\\]](#index_split_003.html#p198) 提出了一种移动云中的节能虚拟机迁移策略。他们提出了两个模型，即虚拟机任务模型和能耗模型，分别描述了虚拟机的特征和物理机消耗的能量。虚拟机迁移系统由两部分组成：宿主组和迁移控制器。迁移控制器在用户请求通过声音监视器后运行人工蜂群算法。该方法在\
  \ CloudSim 上进行仿真，结果显示节能高效。\n\n#### 9.3.7 蝙蝠优化算法\n\n蝙蝠优化算法由 Xin-She Yang 于 2010 年设计。它基于蝙蝠的回声定位行为，具有变化的脉冲发射率和响度。所有蝙蝠都利用回声定位来感知距离，并且它们也“知道”食物/猎物与背景障碍物的区别。蝙蝠以速度\
  \ `vi` 在位置 `xi` 随机飞行，具有固定频率 `f_min`（或波长 `λ`）、变化的波长 `λ`（或频率 `f`）和响度 `A_0` 来搜寻猎物。它们可以根据目标的接近程度自动调整发射脉冲的波长（或频率）和脉冲发射率\
  \ `r ∈ [0,1]`。虽然响度可以通过多种方式变化，但我们假设响度从一个较大的（正）`A_0` 变化到最小值 `A_min`。\n\n### 蝙蝠优化算法\n\
  \n使用 `xi` 和 `vi` 初始化蝙蝠种群 (i = 1,2,…,n)\n\n定义 `xi` 处的频率 `fi`\n\n初始化脉冲率 `ri` 和响度 `Ai`\n\
  \n当 (未达到终止条件) 执行\n\n通过调整频率生成新解，并更新速度和位置。\n\n如果 (rand > `ri`)\n\n从最优解中随机选择一个解；\n\n\
  通过局部随机游走在选定的最优解周围生成一个局部解\n\nend if\n\n如果 (rand < `Ai` 且 fitness(`xi`) < fitness(`x_cgbest`))\
  \ 接受新解\n\n增加 `ri` 并减小 `Ai`\n\nend if\n\n对每次迭代中的蝙蝠进行排序并存储其当前全局最优 `x_cgbest`\n\nend\
  \ while\n\nreturn best solution\n\nY. Gu 等人 [\\[26\\]](#index_split_003.html#p198)\
  \ 提出了一种用于工作流调度的能量感知、时间和吞吐量优化启发式方法 (EATTO)。它基于蝙蝠优化算法。任务根据其计算需求和优先级约束进行排列。每个任务映射被视为一只蝙蝠。解在每一代\
  \ `t` 使用以下指标进行评估：频率或波长 `f_ti`、速度 `v_ti`、响度 `A_ti`、脉冲发射率 `r_ti` 和位置 `d_ti`。响度 `A_ti`\
  \ 和脉冲发射率 `r_ti` 可在迭代过程中变化。为简化起见，我们使用定义 `A_i(t+1) = α * A_it` 和 `r_i(t+1) = r_0_i\
  \ * [1 − exp(−γ * t)]`，其中 `0 < α < 1` 和 `γ > 0` 为两个常数。最初生成具有指定参数的随机蝙蝠种群并计算当前最优解。通过随机游走生成新种群并执行局部搜索以获得最优解，该过程持续直到满足终止条件。性能使用能耗、任务完成时间和能效成本等不同参数进行衡量，结果在各方面均表现更优。\n\
  \nRaghavan S. 等人 [\\[27\\]](#index_split_003.html#p198) 提出了一种用于云中工作流调度的二进制蝙蝠算法。该算法用于映射任务和资源。映射基于计算总成本进行。仅将处理成本视为计算成本。性能与最佳资源选择\
  \ (BRS) 算法进行比较。对于四个任务的集合，所提算法的成本低于 BRS。\n\n\n\n\n\n# 元启发式算法\n\n## 表 9.1：面向节能虚拟机放置的元启发式方法\n\
  \n| 方法 | 显著特点 | 文献中的主要贡献 | 局限性 |\n| :--- | :--- | :--- | :--- |\n| **模拟退火** | •\
  \ 降低能耗<br>• 虚拟机放置优化<br>• 基于马尔可夫链的并行算法<br>• 动态虚拟机管理 | [6], [7], [9] | • 对比实验不详尽<br>•\
  \ 需要参数调优<br>• 可扩展性有限 |\n| **粒子群优化** | • 虚拟机放置<br>• 降低能耗<br>• 混合方法<br>• 多目标优化 | [11],\
  \ [15], [17] | • 过早收敛<br>• 参数敏感性<br>• 陷入局部最优 |\n| **遗传算法** | • 执行时间<br>• 性能<br>•\
  \ 时间复杂度<br>• 成本<br>• 开/关机制<br>• CPU 利用率<br>• 性能 | [18], [19], [20], [21], [23] |\
  \ • 计算复杂度高<br>• 收敛速度慢<br>• 参数调优困难 |\n| **生物地理学优化** | • 能耗<br>• 绿色计算<br>• 迁移减少<br>•\
  \ 工作流调度 | [25] | • 相关文献有限<br>• 过早收敛 |\n| **和声搜索优化** | • 能源<br>• 绿色计算<br>• 完工时间<br>•\
  \ 网络<br>• SVM 集成<br>• 混合方法 | [26] | • 参数敏感性<br>• 收敛速度慢 |\n| **蝙蝠算法** | • 能耗<br>•\
  \ 工作负载均衡<br>• 成本降低<br>• 资源利用率 | [27] | • 勘探能力有限<br>• 参数依赖性 |\n\n### 9.4 结论\n\n元启发式算法在资源优化方面发挥了重要作用，从而节省了云数据中心运行中的能源。\n\
  \n研究人员尝试了不同类型的元启发式算法来降低能耗。这些算法已被应用于虚拟机放置，以实现机器整合。然而，它们并非适用于所有场景的解决方案。因此，有必要确定特定元启发式算法的适用性。本章为文献中关于云数据中心节能运行领域元启发式算法的主要贡献提供了合理的见解。**表\
  \ 9.1** 展示了旨在降低能耗的现有元启发式算法的对比视图。在大多数研究中，网络设备消耗的能源未被考虑在内。此外，在大多数情况下，对比分析并不详尽。因此，未来的工作可以致力于解决这些问题。\n\
