  ```\n(8.2)\n\n### 8.4 问题建模与求解\n\n在本节中，我们将讨论虚拟机放置的建模及其使用多目标优化的求解方法。已使用 `NSGA` 进行虚拟机的最优映射。\n\
  \n#### 8.4.1 多目标虚拟机放置问题\n\n基于种群的方法是多目标优化的关键特征。在此基础上，我们在虚拟机选择中使用了帕累托支配的概念。\n\n多目标优化问题可以通过一组\
  \ `n` 个目标来求解。根据问题的不同，这些目标需要被最大化或最小化（在我们的案例中为最小化）。\n\n```\nminimize f(X) = {f(X1,\
  \ X2,..., Xn)}\n```\n(8.3)\n\n公式 8.3 表示最小化问题，其中 `X` 代表决策变量。多目标优化的解并不能为所有目标提供最优解。帕累托最优解在这种情况下最为合适，它们提供折衷结果。这些折衷解拥有一组非支配解，进而为多个目标提供最佳解\
  \ 41。\n\n如果解空间 'sp' 中的解 `S` 不存在其他解 `P` 支配解 `S`，则称解 `S` 为帕累托最优。此外，如果以下两个方程均成立，则解\
  \ `S` 支配解 `P`，或者解 `S` 拥有比 `P` 更好的非支配等级，即 `RS < RP`（`S` 和 `P` 的等级）：\n\n*条件 1*：如果解\
  \ `S` 对于所有目标都与解 `P` 一样好：\n```\n∀ j ∈ [1,2... n] . fj(S) ≤ fj(P)\n```\n(8.4)\n\n\
  *条件 2*：如果解 `S` 对于至少一个目标严格优于 `P`：\n```\n∃ j ∈ [1,2... n] . fj(S) < fj(P)\n```\n(8.5)\n\
  \n所有不被任何其他解支配的解称为非支配解，它们共同构成解空间中的一个前沿，称为非支配前沿；非支配前沿中的解集称为帕累托最优解。\n\n该概念中最繁琐的步骤是找到非支配解集。在我们的工作中，使用以下步骤\
  \ [58] 来寻找非支配解集，其中有 `Z` 个解，每个解有 `N` 个目标：\n\n* **步骤 1**：从 `i = 1` 开始。\n* **步骤 2**：使用上述条件针对所有\
  \ `N` 个目标，比较解 `Si` 和 `Pi` 的支配等级。\n* **步骤 3**：如果 `Si` 被 `Pi` 支配，则将 `Si` 标记为被支配，并通过增加\
  \ `i = i++` 转到步骤 2。\n* **步骤 4**：如果已考虑所有解（`i = 1` 到 `Z`），则转到下一步；否则通过增加 `i` 转到步骤 2。\n\
  * **步骤 5**：未被标记为被支配的解即为非支配解。\n\n#### 8.4.2 虚拟机放置优化\n\n此处虚拟机放置已被优化，需要将 `V` 个虚拟机映射到\
  \ `M` 个物理机器上。假设每个虚拟机请求 `Ci` 量的 CPU 利用率，`Thuj` 为 CPU 利用率阈值，`Memi` 为每个虚拟机请求的内存量，`Thmj`\
  \ 为内存利用率阈值。我们还引入了两个变量 `Lij` 和 `Qj` 用于研究虚拟机的分配。基于这些假设，我们最小化了一些目标，如迁移次数、SLA 违规和数据中心成本。因此，虚拟机放置问题可以形式化为：\n\
  \n**能耗**：\n```\nEC = ∑_{j=1}^{M} ∑_{j=1}^{M} ∑_{i=1}^{V} [ Xj × (PC_busy_j - PC_idle_j)\
  \ × Lij × Ci + PC_idle_j ]\n```\n(8.6)\n\n**SLA 违规**：\n```\nSLAV = (1/M) ∑_{j=1}^{M}\
  \ [ (1/V) ∑_{i=1}^{V} (Tsi / Tai) ] × [ ∑_{j=1}^{M} (Cdj / Crj) ]\n```\n(8.7)\n\n\
  **使用的主机数量**：\n```\nyj = 1 if ∑_{i=1}^{V} ∑_{j=1}^{M} Qji ≥ 1\nyj = 0 otherwise\n\
  ```\n(8.8)\n\n**迁移次数**：\n```\nMC = 1 - (∑_{j=1}^{M} MCj) / (MC_P - ∑_{j=1}^{M} MCj1)\n\
  ```\n(8.9)\n\n**成本函数**：\n```\nCT = ∑_{t=to}^{T} ∑_{j=0}^{M} ∑_{j=1}^{M} (CTP × tp\
  \ + CTV × SVtj)\n```\n(8.10)\n\n在公式 8.7 中，SLA 违规的计算方式为：`Tsi` 是主机经历 100% 利用率的总时间，`Tai`\
  \ 表示主机保持活跃的时间，`Cdj` 是由迁移引起的性能下降估计值，`Crj` 是虚拟机的总 CPU 容量。为了在公式 8.8 中最小化主机数量，我们引入了决策变量\
  \ `Xji`，它表明主机 `j` 是被使用（`yj = 1`）还是未被使用（`yj = 0`）。成本函数计算为 `CTPtp` 和 `CTVtp`，其中 `CTP`\
  \ 是电力成本，`tp` 是时间周期（单位时间的能量），`CTV` 是单位时间的 SLA 违规成本。\n\n![Image 63](img/index-162_1.jpg)\n\
  \n**节能虚拟机放置** ◾ **147**\n\n### 8.5 拟议的节能 BPGA 优化模型\n\n\n\n在[42, 43]中，我们讨论了 VM 合并的前三个步骤，并在此提出了一种用于能量最小化和资源利用率提升的\
  \ BPGA VM 放置方法。通过减少活跃机器数量来最小化能耗，直接促进了绿色计算。\n\n当前工作提出了一种面向云数据中心的能量感知虚拟机放置（VMP）技术，该技术基于遗传算法（NSGA）和生物神经网络（BPNN），称为\
  \ BPGA 模型，如图 8.3 所示。该技术旨在将我们从之前的工作[43]中选定的虚拟机放置到另一台活跃主机上，使其映射通过减少数据中心内活跃主机的数量来最小化能耗。该\
  \ BPGA 模型分两遍工作。这两遍的细节讨论如下：\n\n**图 8.3 用于 VM 放置的 BPGA 模型。**\n\n**148** ◾ ML and Optimization\
  \ Models\n\n#### 8.5.1 Pass 1: Non-Dominated Sorting Genetic Algorithm (NSGA)\n\n\
  **步骤 1.** 最初，我们可以将任意 VM 映射到任意机器上，但满足约束 11 非常重要，即每个 VM 需要映射到单个机器上。\n\n$$ \\sum_{j=1}^{M}\
  \ X_{ji} = 1 \\quad \\forall j \\in PM \\land \\forall i \\in VM \\tag{8.11} $$\n\
  \n**步骤 2.** 将计算虚拟机请求的资源总量以及提供资源的物理机容量，并检查它们是否满足适应度函数 1。如果满足，则计算适应度函数 1 的值并创建 VM\
  \ 集群，其中 VM 将根据其排名排序[44]。VM 集群意味着这些集群中的 PM 是 VM 映射的选项。此外，如果这些约束不被 VM 满足，则那些待处理的 VM\
  \ 将在不检查目标函数 2 的情况下转发给 Pass 2。\n\n**适应度函数 1：资源容量**\n\nCPU（$C$）和内存利用率（$Mem$）是我们工作中考虑的两个主要资源。在遗传算法的染色体表示中，基因数组的每个值代表一个虚拟机的放置目的地。对于第\
  \ $j$ 台物理机，假设它可以承载 $m$ 个虚拟机，则第 $j$ 台物理机上承载的 VM $m$ 的资源维度数组可表示为：$[C_{j1}, C_{j2},\
  \ \\dots, C_{jm}]$ 和 $[Mem_{j1}, Mem_{j2}, \\dots, Mem_{jm}]$。资源属性的总值为：$RC_j = C_j\
  \ + Mem_j \\tag{8.12}$\n\n$$ Fitness_1 = F_1 = \\frac{1}{RC_j} \\tag{8.13} $$\n\n\
  **算法 1 BPGA 模型 Pass 1 使用 NSGA**\n\n```\n1  Input: VM list, Host list\n2  Output:\
  \ VM-PM placement map\n3  Allocated host = null, Cando_List = null, min_energy =\
  \ MAX\n4  Tournament size[][] = null  // tournament size will be equal to VM count\
  \ * host count\n5  Objective1.NSGA = find_fit(Host capacity, VM requirements)\n\
  6  For each VM in VM List\n7      For Hostcount = 1: Hostcount\n8          If (Host_fulfill(VM\
  \ requirements))\n9          {\n10             Cando_List[Hostcount][0] = host_id\n\
  11             Cando_List[Hostcount][1] = VM-id\n12          }\n13          Else\n\
  14          {\n15             BPNN()\n16          }\n17      End for\n18  End for\
  \ each\n19  Objective 2.NSGA = selection_best_fit(Cando_List[])\n20  If host.containing.VM\
  \ > 1  // if VM has more than one PMs available for mapping\n21      For each host\
  \ in Cando_List[]\n22          If (host.Energy < min_energy)\n23          {\n24\
  \              Allocated hosts = host\n25              Min_energy = Energy\n26 \
  \         }\n27  Return VM-PM Placement map (Allocated hosts)\n```\n\n**步骤 3.**\
  \ 如果目标函数 1 满足，则从上述生成的 VM 集群中，每个虚拟机都有多台物理机可用于映射。因此，该步骤通过计算适应度函数 2 的值提供虚拟机到物理机的最终映射，作为\
  \ VM 目的地的物理机将根据其在集群内适应度值的排名进行排列，并根据该值，从每个 VM 集群中选择物理机用于虚拟机的放置。能耗值已在适应度函数 2 中计算（图\
  \ 8.4）。\n\n**适应度函数 2：能耗**\n\n$$ Fitness_2 = F_2 = \\frac{1}{\\sum_{j=1}^{M} ENC_{total}}\
  \ \\tag{8.14} $$\n\n**图 8.4 BPGA 模型的伪流程和交互图。**\n\n### 算法 2：BPGA 模型 Pass 2 使用 BPNN\n\
  \n```\n1  Input : VM List, Host List\n2  Output: VM-PM Placement map\n3  TrainSet[][]\n\
  4  For each host in Host List\n5      For (i = 1 to 11)  // value of power consumption\
  \ of servers on 11 different condition from idle to 100% utilized\n6          Train_Set[host][i]\
  \ = host[condition(i)]\n7      End for\n8  End for each\n9  Total Epochs = 500 \
  \ // total number of possible iterations\n10 Initialize gradient_satisfied = 0\n\
  11 Term_Weight[][]\n12 While (gradient not satisfied)\n13     For each data in Train_Set[][]\n\
  14         Term_Weight[i, f] = a * data + b  // a and b are arbitrary values\n15\
  \     End for\n16 End While\n17 MT = Mean(Term_Weight)\n18 If (MT < gradient)\n\
  19 {\n20     Term_weight = Term_weight + s\n21 }\n22 Else\n23 {\n24     Gradient_satisfied\
  \ = 1\n25 }\n26 If (gradient_satisfied = 1)  // neural training is complete\n27\
  \ {\n28     Test_Set[VM][i] = VM[conditions(i)]  // utilization of VM on 11 different\
  \ conditions from idle to 100% utilized\n29 }\n30 For each VM in Test_Set\n31  \
  \   Allocated_Host = Simulate(Test_Set, Train_Set)\n32     Assign VM to Allocated_Host\n\
  33 Return PM-VM Placement map (Allocated_host)\n```\n\n**步骤 1**：最初生成用于梯度的随机变量。在第一次迭代中\
  \ `gradient_satisfied` 为零，如果梯度满足则变为 1。根据表 8.1，服务器从 0 到 100% 的利用率值被用作 `Term_weight[][]`\
  \ 矩阵的输入权重。公式 8.15 显示了梯度满足的约束，其中 `a` 和 `b` 是随机整数值。\n\n$$ \\text{if } (gradient\\\
  _satisfied == 0) \\quad Term\\_Weight = generate\\_Term\\_Weight(data) = a \\times\
  \ (data) + b \\quad \\text{(random integer values for a and b)} \\tag{8.15} $$\n\
  \n**步骤 2**：在此步骤中，将在隐藏层中检查权重的平均值和梯度。如果平均权重的随机变化小于梯度的值，则权重值将按公式 8.16 计算的 `s` 值增加。首先，我们将找到\
  \ `Term_Weight` 的平均值（称为 `MT`）并将其与梯度进行比较。\n\n$$ Term\\_Weight = Term\\_weight + s\
  \ \\quad \\text{Where s is random change if } MT < gradient $$\n$$ \\text{gradient\\\
  _satisfied = 1 otherwise} \\tag{8.16} $$\n\n**步骤 3**：现在，神经网络已训练足够以用于新的输入集。与 `Train_Set`\
  \ 类似，`Test_Set` 矩阵包含服务器从空闲到 100% 利用率的 11 种不同条件下 VM 的能耗。`Test_Set` 矩阵将连同 `Train_Set`\
  \ 矩阵进一步传递给模拟函数，以分配算法 3 中提到的最合适的主机。\n\n### 算法 3：神经网络模拟函数\n\n```\n1  Input: Test_Set,\
  \ Train_Set\n2  Output: Allocated_Host\n3  Initialize Tts, Trs = 0\n4  Tts = Test_Set\n\
  5  Trs = Train_Set\n6  [r] = size(Trs)\n7  For (i = 1 to r)\n8      MT = Mean(Trs)\n\
  9      MR = Mean(Tts)\n10     If (MT < MR)\n11     {\n12         Allocated_Host\
  \ = i\n13     }\n14 End for\n```\n\n\n\n### 8.6 性能评估\n\n为了评估 `BPGA` 虚拟机放置模型带来的性能提升，我们将其与三种现有的参考算法进行了比较：`PABFD`、`GA`\
  \ 和 `ACO`。这些参考算法简要描述如下：\n\n## 表 8.2 服务器配置\n\n| **服务器** | **CPU 型号** | **内存 (GB)**\
  \ | **频率 (MHz)** | **核心数** |\n| :--- | :--- | :--- | :--- | :--- |\n| IBM Server\
  \ x3250 | Intel Xeon X3480 | 8 | 2,933 | 4 |\n| IBM Server x3250 | Intel Xeon X3470\
  \ | 16 | 3,067 | 12 |\n| Acer AT150 F1 | Intel Xeon 5670 | 12 | 2,933 | 12 |\n|\
  \ Acer AR320 F1 | Intel Xeon 3470 | 8 | 2,933 | 4 |\n| HP ProLiant G4 | Intel Xeon\
  \ 3040 | 4 | 1,860 | 2 |\n| HP ProLiant G4 | Intel Xeon 3075 | 8 | 2,933 | 2 |\n\
  \n## 表 8.3 虚拟机实例 [45]\n\n| **虚拟机类型** | **CPU (MIPS)** | **内存 (GB)** |\n| :--- |\
  \ :--- | :--- |\n| 特大型 (高内存) | 3,000 | 6 |\n| 中型 (高 CPU) | 2,500 | 0.85 |\n| 特大型\
  \ | 2,000 | 3.75 |\n| 小型 | 1,000 | 1.7 |\n| 微型 | 500 | 0.613 |\n\n#### 8.6.1 实验设置\n\
  \n我们选择了 `CloudSim` 仿真平台作为实验环境，因为在真实的云环境中进行实验非常困难。数据中心环境由 800 台具有 6 种不同配置的服务器组成。表\
  \ 8.2 提供了这些服务器的配置，表 8.3 展示了我们在此使用的五种不同的虚拟机实例。\n\n此外，对于仿真环境，我们采用了来自 `CoMoN Project`\
  \ 十天数据的真实工作负载 [46]。\n\n#### 8.6.2 仿真结果与比较\n\n在本节中，我们讨论了由 `BPGA` 模型放置后的能耗、迁移次数和使用的主机数量。我们使用\
  \ PlanetLab 数据集（如图 8.5–8.8 所示）将结果与 `GA`、`ACO` 和 `PABFD` 进行了比较。图 8.5 描绘了在每次运行中虚拟机增加时，`BPGA`\
  \ 使用的主机数量较少。\n\n图 8.6 显示了与 `PABFD`、`GA` 和 `ACO` 相比，`BPGA` 进行的迁移次数较少。正如图 8.7 所示，`BPGA`\
  \ 找到了具有最小能耗的虚拟机-物理机最佳匹配。\n\n### 8.7 结论与未来展望\n\n绿色计算是当前非常热门的研究领域。数据中心中对计算资源、应用和存储不断增长的需求是碳排放的主要来源。因此，有效的能源管理对数据中心非常有帮助。如今，大多数研究人员正在实施生物启发式方法来应对这一能源危机。因此，我们也结合\
  \ `BPNN` 使用多目标优化，以实现虚拟机在数据中心服务器上的最优放置。\n\n我们提出了一种 `BPGA` 和能量感知模型用于虚拟机放置，以最小化主机使用量。该模型采用分治法寻求该问题的最优解。该问题分两遍求解，第一遍使用\
  \ `NSGA`，第二遍使用 `BPNN` 进行最合适的虚拟机放置。\n\n在本工作中，我们使用 `CloudSim` 对所提模型进行了仿真；未来我们希望在提供真实基础设施的\
  \ `CloudStack` 上开展工作。此外，考虑到数据中心的不同网络拓扑，其网络结构也是几个可以做出贡献的研究方向。\n\n### 参考文献\n\n[1]\
