  \ 6](img/index-17_1.jpg)\n\n### 1.1 导论\n\n云计算涉及集中式数据存储策略。客户端可以访问在线云服务或资源；因此，云计算\n\
  \n\n\n\n\n# 云计算中虚拟化技术简介\n\n云计算可以最大程度地减少用户参与。图 1.1 和图 1.2 描绘了云计算的架构和服务。云架构包括硬件支持，如先进的数据中心和云服务\
  \ [1]。云服务架构包含以下三层：\n\n## a). 基础设施即服务\n\n这位于底层，用于处理物理资源和虚拟资源，以及以网络、存储和计算能力形式提供的服务。网格计算也被称为\
  \ IaaS，由主节点和从节点组成。主节点分配工作负载，从节点运行工作负载 [1–3]。\n\n## b). 平台即服务\n\n这为程序员提供开发框架，或帮助开发人员在提供商的平台上构建软件或功能。它是一个完全虚拟化的网络，用于一个或多个服务器、特定应用程序和操作系统\
  \ [1–4]。\n\n## c). 软件即服务\n\n这是一种应用模型（例如 Google Apps 模型），其中软件运行在提供商的基础设施上 [1, 3,\
  \ 4]。\n\n### 图 1.1 云计算架构。\n\n![Image 7](img/index-18_1.png)\n\n### 图 1.2 面向客户端的云服务模型。\n\
  \n以下定义阐述了云计算更广泛的范围。\n\n**a.** 云计算是指一组基于互联网的应用程序，它们向最终用户提供计算资源（服务提供商基础设施，例如 Google\
  \ Apps, Salesforce.com）。它可能托管在网格或效用计算系统中，但这对服务客户来说差别不大。\n\n**b.** 云本质上是指从不稳定的本地存储向稳定可扩展环境的转变，从千兆字节的存储空间（个人电脑空间）向无限量的转变，以及从\
  \ Microsoft Office 向基于 Web 的办公软件的转变。与在自己的服务器上本地存储相比，云使在线存储成本更低、迁移更稳定。\n\n**c.**\
  \ 云计算的设计通常可分为三类站点：\n\n*   **提供商。** 云提供商为云环境的用户提供其基础设施或平台。\n*   **赋能者。** 这些公司专注于数据中心自动化和服务器虚拟化，并提供上述技术（VMware,\
  \ Citrix, Redhat, Intel, Sun, IBM 等）。\n*   **消费者。** 这些是利用资源并在当前云基础设施之上构建或改进其 Web\
  \ 应用程序的企业。\n\n### 1.2 云模型\n\n云服务可分为公有云、私有云、社区云或混合云 [1, 2, 5, 6]。\n\n#### 1.2.1 公有云\n\
  \n当通过网络提供的服务可供公众使用时，该基础设施被称为“公有云”。公有云服务可免费提供，也可按使用付费 [1, 3]。这些服务是动态的，但可通过互联网进行自助访问。它们主要由大型企业管理（例如\
  \ Amazon, Google App Engine）。\n\n#### 1.2.2 私有云\n\n私有云中的云服务仅由单一实体运行，无论是内部管理还是由第三方管理\
  \ [1, 4, 5, 7]。私有云项目需要高水平和高程度的努力来虚拟化市场环境，并重新评估当前的资源决策。\n\n#### 1.2.3 社区云\n\n社区云是一种云计算基础设施，由某一地理区域内的一组组织共享。\n\
  \n#### 1.2.4 混合云\n\n混合云是由两个或更多云组成的结构，它们保持各自独立的实体，但相互连接，允许使用多种利用模型。利用云基础设施无缝集成和控制应用程序的能力是混合云的一个特征。\n\
  \n### 1.3 什么是虚拟化？\n\n当今跨网络数据共享的指数级增长，需要使用编程模型通过多个分布式基础设施执行程序。这增加了对云的需求，导致云网络出现繁重的流量负载，因此我们使用虚拟化来优化云服务。虚拟化有多种定义方式，如下所示：\n\
  \n根据维基百科，“云中的虚拟化”是指创建硬件或软件资源的虚拟版本（即对实际资源的模拟）（即硬件平台、存储设备、操作系统等）。虚拟机（VM）的概念由 IBM 于\
  \ 1960 年引入，旨在为其大型机提供同时、协同的访问。虚拟机给用户一种错觉，即他们可以直接访问物理机器。虽然虚拟化原理提高了全球各地 CPU 容量的可用性，但在客户计算机上执行的数据可能相距数千英里，导致数据获取和执行出现延迟。它在降低成本的同时最大化了资源利用率。\n\
  \nRune Johan Andresen 将虚拟化定义为：虚拟化是一种将计算机算力划分为不同可执行环境的方法。更确切地说，它是一个软件层，使多个虚拟机实例呈现出真实计算机的外观\
  \ [8, 9]。\n\nSusanta 和 Tzi-cker 将其描述为：一种利用特定硬件和软件分区方法论来合并或分离资源，以呈现一个（例如桌面虚拟化）或多个操作系统的技术\
  \ [10]。\n\nIBM 将其定义为：它是实际资源替代品的开发，这些替代品执行相同的功能并具有相同的外部接口，但在属性上有所不同（例如大小、性能和成本）[11]。\n\
  \nAndi Mann 将其定义为：虚拟化是一种隐藏计算机资源物理特性，同时允许最终用户与之交互的方法。让单个物理资源充当多个逻辑资源就是一个例子 [12]。\n\
  \nWilliam von H 将其定义为：虚拟化是持续隔离对真实物理服务的需求 [13]。\n\n#### 1.3.1 虚拟化的优缺点\n\n以下是虚拟化的应用场景，在这些场景中使用虚拟化会带来益处：\n\
  \n1.  多个同时运行的操作系统 [13, 14]。\n2.  测试 [14, 15]。\n3.  服务器整合 [12, 16, 17]。\n4.  虚拟硬件\
  \ [13]。\n5.  降低新硬件成本 [13, 18]。\n6.  减少停机时间 [15, 18]。\n\n\n\n\n\n##### 7. 应用整合 [13–15,\
  \ 19]\n\n##### 8. 更好地利用现有硬件 [9]\n\n##### 9. 沙箱 [13]\n\n##### 10. 众多执行环境 [13]\n\n\
  ##### 11. 调试 [13]\n\n##### 12. 软件迁移 [13]\n\n##### 13. 设备 [13]\n\n##### 14. IT 基础设施成本降低\
  \ [18]\n\n以下是虚拟化的缺点：\n\n- 信息泄露问题 [1, 13]。\n- 虚拟化最大的缺点是开销，因为它会降低性能 [9, 13]。\n- 不同平台和网络的管理是虚拟化最大的问题，因为它们反过来又增加了网络和调试的时间复杂度\
  \ [9]。\n\n![Image 8](img/index-22_1.jpg)\n\n云计算中的虚拟化简介 ◾ **7**\n\n图 1.3 云的虚拟化架构。\n\
  \n#### 1.3.2 云的虚拟化架构 [3–6]\n\n1. 操作系统全权负责底层硬件。\n2. 虚拟化架构中的管理程序/VMM 创造了这种假象。\n3.\
  \ 在虚拟化软件（即图 1.3 中的管理程序）的帮助下实现虚拟化。管理程序是一个软件层，它：\n   a. 允许多个客户操作系统（虚拟机）同时在单个物理主机上运行。\n\
  \   b. 它可以轻松地多路复用原始硬件属性，并为运行的客户操作系统提供硬件泛化。\n\n#### 1.3.3 虚拟化在云计算中的重要性 [7]\n\n1.\
  \ 没有虚拟化也可以拥有云，但那将是复杂且昂贵的。\n2. 云创造了“按需付费”和“无限可用性——想用多少用多少”的理念。\n3. 只有后端具有高度的通用性和可靠性，这些理念才切合实际。在虚拟化环境中，这种效率是可用的。\n\
  4. 云计算在使用虚拟化时具有成本效益。\n\n![Image 9](img/index-23_1.png)\n\n**8** ◾ ML 和优化模型\n\n图\
  \ 1.4 虚拟化类型。\n\n#### 1.3.4 虚拟化的类别及其影响\n\n服务器、桌面设备和磁盘虚拟化是虚拟化的三种形式。虚拟化技术的类型如图 1.4\
  \ 所示。\n\n##### A 类：服务器虚拟化\n\n通过跨多个网络分割单个服务器的资源，服务器虚拟化使单台服务器能够处理多台服务器的功能。管理程序层通过以具有成本效益、高可访问性和高效的方式使用服务来提供这种方法。服务器虚拟化可分为三类\
  \ [20]：\n\na) 完全服务器虚拟化。\nb) 半服务器虚拟化。\nc) 硬件辅助服务器虚拟化。\n\n###### 完全服务器虚拟化\n\n在完全虚拟化中，VM\
  \ 在物理机上一个隔离的操作系统内呈现出一个虚拟剧场的外观。为了更安全和私密的计算，客户操作系统与管理程序层分离。图 1.5 描绘了完全虚拟化和半虚拟化。\n\n\
  ###### 半服务器虚拟化\n\n在这种虚拟化中，客户操作系统需要修改，以便与管理程序协同工作。这种修改后的客户操作系统允许管理程序更有效地将计算资源调度给\
  \ VM，以提高性能。硬件和软件要求取决于管理程序。\n\n**优点：**\n\n- 与其他虚拟化技术相比，它显著提高了性能。\n\n**缺点：**\n\n-\
  \ 需要修改 VM 操作系统。\n\n###### 硬件辅助服务器虚拟化\n\n硬件制造商正在迅速引入新功能，使虚拟化变得更简单。这种形式的虚拟化首次用于 IBM\
  \ 的 VM/370 虚拟机，这是第一台虚拟机。它通过减少虚拟机的维护开销来加速性能，因此这种虚拟化被称为加速虚拟化 [21]。\n\n**优点：**\n\n\
  - 提高性能。\n- 产品作为服务器操作系统或设备进行分发。\n\n**缺点：**\n\n- 供应商必须在云中分发硬件兼容性列表 (HCL)，描述与虚拟化产品配合使用的硬件\
  \ [22]。\n\n服务器虚拟化具有以下优点 [22]：\n\n- 减少对物理服务器的需求 [23]。\n- 减少服务器运行维护 [24]。\n- 降低运营支出\
  \ [19]。\n- 减少新服务的供应和组织 [24]。\n- 缩短灾难恢复时间 [19]。\n- 改善网络和应用安全性 [25]。\n- 提高灵活性、可用性和性能\
  \ [25, 26]。\n\n表 1.1 展示了完全虚拟化、半虚拟化和硬件辅助虚拟化在不同参数上的比较研究。\n\n### 表 1.1 不同服务器虚拟化技术的比较\n\
