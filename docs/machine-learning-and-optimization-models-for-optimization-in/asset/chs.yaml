  - 8.7 结论与未来展望\n- 参考文献\n\n---\n\n### 8.1 简介\n\n云计算的普及可为电子科学、电子商务及其他众多领域提供服务器、网络、存储和应用程序等多种服务。云计算的这种架构是一个巨大的虚拟化资源池，这些资源随时可用且易于访问，例如平台、硬件和服务（如内存、`.Net`、`CPU`、`Java`、电子邮件和人力资源等）。这些资源池按使用付费模式进行供给，云服务提供商通过服务等级协议\
  \ (`SLA`) 提供资源的可用性和保障 [[1]](#index_split_003.html#p171)。\n\n数据中心的部署需要消耗大量能源来运行多台服务器，并为数据中心内部使用的电子设备提供冷却。据数据中心知识报告\
  \ [[2]](#index_split_003.html#p171) 显示，数据中心 55%的能耗源于数据设备和服务器，30%源于冷却设备。这些数据中心维护成本极高，此外还对环境造成不利影响。\n\
  \n虚拟化是最适用的技术，它在处理服务器/虚拟机整合、自动伸缩、节能、负载均衡等问题时能提供更好的 QoS [[3]–[8]](#index_split_003.html#p171)。虚拟化技术在单台物理机上运行多个操作系统，从而解决资源利用率低和能源利用效率低的问题。数据中心广泛使用各种工具来实施虚拟化技术，例如\
  \ `VMware`、`KVM`、`XEN` 等 [[9, 10]](#index_split_003.html#p171)。虚拟机的不当分配会降低性能和服务质量。虚拟机的迁移及其向合适物理机的映射，可以降低数据中心的能耗并提供良好的\
  \ QoS，进而减少 SLA 违约 [[11]](#index_split_003.html#p171)。虚拟机到物理机的适当映射可减少硬件使用量，提高资源利用率以及电力和能源效率\
  \ [[12]](#index_split_003.html#p172)。图 8.1 展示了利用虚拟化技术进行虚拟机放置的场景，其中我们评估了八台物理机 (`PMs`)。\n\
  \n这些物理机的利用率从 15%到 50%不等。因此，最优虚拟机放置过程的主要目标是将虚拟机映射到物理机上，通过提高其利用率来减少所用物理机的数量，并将其余物理机切换到休眠模式或关闭。\n\
  \n云环境中的工作负载具有动态性；因此，研究人员提出了许多不同的启发式算法，考虑了贪心算法的扩展，如首次适应、最佳适应、首次适应递减和最佳适应递减，以解决此问题，例如功耗感知最佳适应递减\
  \ (`PABFD`) [[13]](#index_split_003.html#p172)、修正最佳适应递减 (`MBFD`) [[14]](#index_split_003.html#p172)、`TPOSIS`\
  \ [[15]](#index_split_003.html#p172)、`EPOBFD` [[4]](#index_split_003.html#p171)\
  \ 等。然而，这些贪心算法无法保证生成最优解，因为它们容易陷入局部最优，且由于单点搜索策略，很难找到全局最优解。因此，处理这些问题最有力的方法是基于种群的进化计算\
  \ (`EC`) 算法，如遗传算法 (`GA`)、蚁群优化 (`ACO`)、粒子群优化 (`PSO`) 等。\n\n本文的贡献如下：\n\n- 一种用于虚拟机放置以实现节能的元启发式方法。\n\
  - 拟议的 `BPGA` 在虚拟机整合过程中采用生物启发式优化。\n- 拟议的 `BPGA` 模型已在 `CloudSim` [[16]](#index_split_003.html#p172)\
  \ 中进行测试，表明其适用于异构数据中心。\n- 该研究提供了经典装箱技术与新型元启发式技术（如遗传算法、蚁群优化和多目标优化）的广义对比。\n\n手稿其余部分的结构安排如下：第\
  \ 8.2 节介绍虚拟机放置或虚拟机整合的最相关工作。\n\n\n\n\n### 8.2 传统虚拟机放置工作\n\n在本节中，我们将讨论与虚拟机迁移和放置相关的先前及最相关的工作，这些工作旨在解决数据中心内与能耗、SLA\
  \ 违约及其他性能参数相关的问题。云计算的这一领域已有大量研究，在这些研究中，上述问题在不进行虚拟机迁移或进行虚拟机迁移的情况下均得到了处理，并被视为最佳技术。但在数据中心内，虚拟机迁移的过程对于能源管理而言并非一帆风顺，因为它涉及用于实施的整体虚拟机整合过程。此外，虚拟机整合过程包含四个不同步骤\
  \ [[14]](#index_split_003.html#p172)。所有这些步骤均可高效管理数据中心的能源问题。作者们研究了不同的启发式以及元启发式技术来处理这些问题。首个面向虚拟化数据中心能源管理的架构由\
  \ Nathuji 等人 [[17]](#index_split_003.html#p172) 开发，该架构利用虚拟机实时迁移的概念将虚拟机整合到单台服务器上。Lim\
  \ 等人 [[18]](#index_split_003.html#p172) 还提出了利用虚拟机动态迁移到更少宿主机上进行虚拟机整合的过程，用于虚拟化环境中的能源管理。随后，Goiri\
  \ 等人 [[19]](#index_split_003.html#p172) 提出了一种面向利润的多目标虚拟机放置算法，该算法从能效、SLA 违约和虚拟化开销方面考虑了迁移后数据中心的性能。类似地，Verma\
  \ 等人 [[20, 21]](#index_split_003.html#p172) 和 Ghribi 等人 [[22]](#index_split_003.html#p172)\
  \ 提出了虚拟机放置和虚拟机分配算法，旨在通过考虑数据中心性能及迁移成本，最小化所用宿主机数量并降低能耗。\n\nBeloglazov 等人 [[14, 23,\
  \ 24]](#index_split_003.html#p172) 利用虚拟机迁移的概念，根据当前资源利用率 [[25–29]](#index_split_003.html#p173)\
  \ 提出了用于虚拟机动态分配的能量感知启发式算法。Bila 等人 [[30]](#index_split_003.html#p173) 倡导了一种新的整合技术，通过迁移空闲虚拟机来降低能耗。Zohu\
  \ 等人 [[31]](#index_split_003.html#p173) 的工作旨在通过利用网络和存储资源提高云服务的可靠性；他们的算法利用数据中心网络架构的特性来最小化网络资源使用量，但我们的工作不同于利用这些资源，而是专注于提高内存和\
  \ CPU 资源的使用率。为此，虚拟机将被放置在由我们的 `BPGA` 模型选择的节点上，同时保持数据中心的能效和性能。为了实现虚拟机的最优放置或迁移，考虑内存利用率和处理器利用率等当前资源至关重要。根据文献\
  \ [[14, 32]](#index_split_003.html#p173) 观察，这些资源是主要的功耗单元。所提出的 `BPGA` 模型也能在内存和处理器两个层面高效处理能量优化。此外，它还通过最小化所用宿主机数量和虚拟机迁移次数来提高资源利用率。虚拟机放置通过将空闲或自由资源隔离并将其关闭或置于睡眠模式，有助于降低其能耗。关注节约空闲或闲置资源是为了提高能效并降低\
  \ [[33]](#index_split_003.html#p173) 中定义的 SLA 违约率。在最近一篇关于虚拟机整合的综述 [[34]](#index_split_003.html#p173)\
  \ 中，Khichar G. S. 等人还提出了一种使用背包技术的 `MC_MC` 算法以减少迁移和能耗，而在 [[35]](#index_split_003.html#p173)\
  \ 中，Bajoria V. 等人提出了一种不同的策略以最小化能耗，该策略同时考虑了算法的成本效率和时间效率。成本效率通过优先考虑 CPU 利用率来提供，而时间效率则通过优先考虑性能退化来提供。Li\
  \ Z. 等人 [[36]](#index_split_003.html#p174) 基于反共置约束提供了虚拟机放置方案，他们提出了一种基于 PageRank\
  \ 的算法，以寻找最佳的虚拟机-物理机映射，实现宿主机的充分利用并达到最低能耗。Maiyza A. I. 等人 [[37]](#index_split_003.html#p174)\
  \ 提出了用于虚拟机迁移的 `MMTMC2` 算法，以改进整体虚拟机整合过程。他们的思路是维持云数据中心中的实时迁移数量和网络负载。\n\n随着云环境提供的分布式服务复杂性不断增加，提出一些更可持续、更可扩展、适用于异构环境的技术变得至关重要。此外，这些技术还能应对日益严重的能源危机。\n\
  \n当前的研究工作侧重于生物启发式计算和元启发式技术来处理这些问题，因为它们具有自动调整搜索空间的能力，尽管它们拥有庞大的搜索空间。\n\n本研究旨在实现能耗与服务质量（QoS）之间的最优平衡。因此，与以往工作相比，我们提出的\
  \ `BPGA` 方法具有以下主要差异：首先，所呈现的虚拟机整合模型关注持续整合过程中能耗与宿主机工作负载稳定性之间的平衡。其次，结合反向传播使用 `NSGA`\
  \ 多目标优化或一组帕累托最优解来训练神经网络，这本身就是相较于以往文献的一项创新。再次，在解空间（如种群）中搜索最终最优结果由 `BPGA` 执行，它不仅保证全局优化结果，还能加速进化过程。最后，结合两个不同阶段的虚拟机整合共同保证了结果的可靠性。我们在两个不同数据集上进行了大量实验，结果表明改进的\
  \ `BPGA` 在不降低 QoS 的前提下降低了能耗。与我们之前的工作不同，此处我们使用了 PlanetLab 数据集和 Bitbrains [[38]](#index_split_003.html#p174)\
  \ 数据集来验证 `BPGA` 模型。\n\n### 8.3 系统模型\n\n系统模型由异构资源组成，例如以每秒百万条指令数定义的 CPU 利用率、网络带宽、磁盘容量以及数据中心内的内存（RAM）。数据中心框架\n\
