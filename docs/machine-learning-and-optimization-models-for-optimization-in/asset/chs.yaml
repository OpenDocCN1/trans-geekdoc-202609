  \ 5.7 结论\n\n该工作展示了利用自然启发算法和机器学习算法进行资源分配领域的当前最先进工作。比较表明，使用 `ANN`、`RNN` 或随机森林的基于机器学习的算法优于现有的自然启发算法和元启发式算法。该工作展示了各种问题和性能参数。该工作为研究人员提供了云中资源分配领域当前最先进工作的综述。\n\
