  \n**119**\n\n# 故障感知机器学习\n\n**120** ◾ ML 与优化模型\n\n### 7.5 结果与讨论\n\n### 7.6 结论与未来工作\n\
  \n### 参考文献\n\n### 7.1 引言\n\n系统的可靠性是通过系统的故障概率来衡量的[[4]](#index_split_002.html#p149)。在本文中，我们介绍了一种主动的、预测性的、功耗感知的、容错的高效调度技术，该技术基于蝙蝠算法和前馈神经网络的混合方法[[1]](#index_split_002.html#p148)。这也被称为基于\
  \ ANN 的容错功耗高效调度（FTS-ANN）。结果表明，提出的蝙蝠算法-ANN 技术提高了虚拟机的可靠性。本文组织结构如下。第 7.2 节简要回顾了聚焦于云环境中容错调度的相关文献。第\
  \ 7.3 节阐述了提出的 FTS-ANN 技术。第 7.4 节展示了 FTS-ANN 与其他基于主动容错感知调度机制的静态、动态和元启发式技术相比的实验结果。还详细讨论了使用\
  \ FTS-ANN 模型的结果。最后，第 7.5 节涵盖了结论和工作的未来扩展。\n\n### 7.2 相关工作\n\n作者 Charity 等人提出了一种提高存储、计算和网络资源可靠性的技术[[2]](#index_split_002.html#p149)。系统设置测量每个虚拟机的信任级别，然后将云任务分配在更受信任的虚拟机上。提出的技术提供了稳定可靠的虚拟机分配[[3]](#index_split_002.html#p149)。其局限性在于作者仅关注主动方法。未探索反应式技术。Zhou\
  \ 等人考虑了云服务的可靠性，包括基础设施即服务、平台即服务和软件即服务。作者利用数据中心网络拓扑和图论关键特性中的 K-容错保证，专注于主机上的虚拟机分配。作者考虑了云任务向可靠虚拟机的分配[[7]](#index_split_002.html#p149)。\n\
  \n进一步关注任务到虚拟机的分配将提高可靠性。\n\n测试了一种蒙特卡洛故障测量技术，以探测云任务分配的未来趋势。托管在数据中心的虚拟机发生故障的几率，是基于随机性特征，使用概率\
  \ Weibull 故障分布来估计的。Rehani 等人提出了在可靠虚拟机上进行云任务分配；提出了一种故障感知资源预留技术，该技术使用可靠性作为基准测试参数[[5]](#index_split_002.html#p149)，[[6]](#index_split_002.html#p149)。\n\
  \n作者提出了一种容错感知调度系统，该系统减少了调度时间，因为具有较高信任级别的虚拟机被分配用于云任务调度[[8]](#index_split_002.html#p149)。因此研究人员观察到可靠性仍然是一个具有挑战性的问题。提出的工作将有助于我们提出一个具有更高显著性水平和信任水平的稳健模型。云中的调度问题属于\
  \ NP-hard 问题范畴。因此，这一显著问题通过自然启发式和元启发式技术得以解决，以实现大规模种群中的可靠分配。基于启发式技术的选择依赖于问题陈述，启发式算法的开发旨在最大化面向全球终端用户的云服务可靠性[[7]](#index_split_002.html#p149)。\n\
  \n准确性是在虚拟机上分配云任务的可靠性阈值下进行测量的。资源分配技术不同于由主机做出决策的集中式技术；在自然启发式方法中，数据中心分布式环境参与决策以实现性能指标。故障率的状态由主机上运行的虚拟机来测量[[9]](#index_split_002.html#p149)。虚拟机的可靠性通过考虑端到端延迟参数来确定。作者仅关注异构环境中的基于工作流的服务。Attiya\
  \ 等人扩展了模拟退火算法，用于将云任务分配到计算节点。该工作的目标和创新点是方法论信任级别的提升，并通过与分支定界法对比计算其效率[[10]](#index_split_002.html#p149)。\n\
  \n作者提出了多种多目标算法，它们依赖于包括可靠性测试、功耗利用、完工时间、截止时间约束和按需资源可扩展性在内的多个性能评估指标。作者还描述了两个性能指标之间的权衡，即所呈现系统的完工时间和可靠性[[11,\
  \ 12]](#index_split_002.html#p149)。\n\n作者主要关注基于两个性能指标的优化。Zhang 等人提出了一种基于可靠性和功耗两个性能指标的遗传算法。在非均质环境中测试了自然启发式基于种群的技术。在非均质环境中随机生成调度方案[[13]](#index_split_002.html#p149)。所提模型的局限性在于解可能收敛于局部最优点。Fard\
  \ 等人提出了一种最小化欧几里得距离的策略。性能指标包括完工时间、成本、功耗和可靠性优化[[14]](#index_split_002.html#p149)。结果仅使用自然启发式元启发式技术进行验证。性能指标可能通过基于神经计算的提出模型得到改进。这些结果可能有助于提出一种新的主动可靠调度技术。\n\
  \nZhang 等人提出了一种利用功耗约束提高可靠性的新技术。性能测量参数使用基础设施即服务交付模型进行估计[[15]](#index_split_002.html#p150)。第二类故障感知供给包括反应式容错策略，它管理任务，当故障几率增加时不关注云任务执行。故障几率或故障率在数据中心层面增加。我们的目标包括抑制故障率并提高资源利用率。文献中提出了多种反应式方法，用于处理云任务执行时的故障和虚拟机可靠性评估。\n\
  \nZhou 等人详细阐述了一种最优检查点算法[[16]](#index_split_002.html#p150)。开发的技术高效地选择数据中心内存储和恢复服务器的检查点。Zhou\
  \ 等人开发了一种使用检查点的新技术。作者涵盖了两种算法：第一种是数据中心\n\n\n\n\n\n### 7.3 相关工作的成果\n\n相关工作的成果表明，研究人员专注于故障感知、基于检查点、成本感知和功耗感知的供给技术。最先进的方法适用于过载、欠载和平均负载条件。任务在虚拟机上的调度时间较高。元启发式技术利用制造和真实数据集提供局部最优解。所提出的故障感知功耗高效\
  \ `bat-ANN` 模型提升了最先进方法的性能。性能通过提供训练数据集的多重调度进行评估。\n\n### 7.4 提出的模型\n\n在综述部分，我们发现故障感知和功耗感知调度方法中存在各种挑战性问题。我们的主要目标是提出一个可靠的故障感知和功耗感知模型，该模型将考虑多变量目标参数。多变量参数评估所提出模型的性能，并利用最先进方法验证多层感知机模型的结果。多层感知机模型的准确性通过利用多重调度来训练提出的\
  \ `bat-ANN` 模型而得到提高。在本文中，我们引入了一种基于蝙蝠算法和前馈深度神经网络的混合任务调度技术。在最先进的方法中，研究人员提出了基于静态、动态和元启发式技术的调度机制。最先进的方法、遗传算法和粒子群优化技术，利用各种性能评估参数提供局部最优解。存在改进自然启发式技术性能的机会。性能指标具体包括功耗和故障。引入了功耗感知和故障感知调度，该调度利用提交给虚拟机的任务总执行时间，关注功耗、故障和效率。功耗感知和故障感知调度的可靠性通过神经计算模型得到提升。混合\
  \ `bat-ANN` 技术通过基于 `GA-ANN` 的任务调度技术进行验证。我们的目标是提升功耗高效 `GA-ANN` 技术的性能，该技术优于 `BB–BC-cost`\
  \ 和简单的遗传成本感知及时间感知调度方法。本小节展示了用于故障感知调度技术服务质量改进的多层感知机模型的详细信息。\n\n#### 7.4.1 初始化\n\n\
  在初始化阶段，定义了用于特征分类的输出层、输入层和隐藏层，以及每层中的感知机数量。还定义了相关参数、学习率、种群大小、变异率、进化代数，以及隐藏层和输出层中使用的激活函数。基于多层的提出模型的效率由这些初始化参数定义。\n\
  \n#### 7.4.2 训练数据集准备\n\n在该阶段，利用适应度函数通过蝙蝠优化方法准备训练数据集，以增强总执行时间、故障率和功耗的性能指标。该阶段采用多种任务的异构组合以及作为资源可用的虚拟机列表。输入被提供给蝙蝠算法。\n\
  \n```\nF(x) = a * Utilization + b * Total_Execution_time (7.1)\nWhere α + β = 1.\n\
  \nTotal_Execution_time = Σ (Task_Length / MIPS) (7.2)\ni=1 to n\n```\n\n训练数据集准备阶段的输出是一个预测调度，具有最短的执行时间和功耗以及低故障率。结果是任务\
  \ ID 和分配给 VM 的虚拟机 ID 的组合。该列表分为 80% 和 20% 两部分，其中前 80% 用于多层神经网络模型训练，后 20% 用于测试训练好的多层感知机模型并利用反向传播进行误差修正。\n\
  \n#### 7.4.3 多层感知机模型设计\n\n在该阶段，利用初始化阶段的参数设计多层感知机模型。该模型分别由输入层、输出层和多个隐藏层组成。隐藏层和输出层分别使用\
  \ `Leaky Relue` 和 `sigmoid` 激活函数。图 7.1 也展示了多层人工神经网络。多层前馈神经网络的每一层包含多个节点。每层中的节点分为预激活（聚合）和激活（非线性）两部分。自适应多层感知机模型的输出呈现可靠的虚拟机标识，该标识以低故障概率处理用户请求或云小任务。它使用前馈神经计算模型来实现可靠虚拟机的目标值。利用最先进的可靠调度方法，测量生物启发式技术结合\
  \ ANN 的性能。人工神经网络使用不同的学习率进行训练。输出的准确性取决于用于训练的参数。感知机模型的性能取决于训练机制、层数（隐藏层）和节点数，以及感知机层面使用的激活参数。\n\
  \n最先进的方法涵盖了所有静态、动态和生物启发式元启发式技术，用于故障感知，并考虑在可靠虚拟机上进行高效资源分配。存在进一步提升服务质量的机会。通过结合人脑计算过程或人工神经网络的元启发式技术，优化标准可进一步改进。带有元启发式方法的人工神经网络比独立的自然启发式元启发式技术提供更好的结果。感知机及其连接强度（边权重）和偏置值针对输入数据集进行调整。调度序列为元启发式技术的不同进化或迭代生成。训练好的神经网络用于预测执行任务且无任何故障的适当虚拟机标识。输出层在学习或训练过程后生成合法输出。利用生物启发式元启发式方法的\
  \ ANN 模型获得更好的结果。感知机间的连接强度，以及模型利用云环境中的数据集进行训练。研究人员已尝试解决云计算中的故障感知作业调度问题。受启发的训练模型有助于云资源的最优分配。\n\
  \n\n\n\n\n# 故障感知机器学习\n\n研究人员利用静态、动态、生物启发式元启发式方法解决了可扩展云环境中故障感知作业调度的问题。我们的目标是基于使用蝙蝠优化技术训练的神经网络模型，提高任务调度的性能。\n\
  \n#### 7.4.4 模型训练\n\n在该阶段，设计的多层感知机模型使用 80% 的训练数据进行训练，以设计训练好的模型。该阶段负责设置神经网络的权重，这决定了多层神经网络的准确性和效率水平。模型的训练过程初始化权重和偏置参数。该过程重复进行，直到掌握目标值。所提模型的目标值包括虚拟机标识，即任务的最短完成时间。\n\
  \n训练过程预测未知变量的适当值。\n\n训练机制包括基于误差修正的机制和基于记忆的机制。最优训练的多层神经网络提供具有准确性和稳定性的最优全局解。可用数据应通过应用经验法则进行分类，即\
  \ 80% 的可用数据集用于训练，剩余 20% 的数据用于测试输出。隐藏层中节点的激活函数使用 Leaky Relue 激活函数进行测量。\n\n**Leaky\
  \ Relue 激活函数 = (7.3)**\n\n```\nf(x) = { 0.01*x if x < 0, x if x ≥ 0 }\n```\n\n服务质量使用优化标准功耗和故障率进行测量，以评估资源利用率。输入层将权重传递给隐藏层，隐藏层使用激活函数并将感知机的结果传递给输出层。主机的激活函数定义了主机的输出，该输出作为一组输入给出。激活函数的这一显著特征在计算人工神经网络中发挥着作用。公式\
  \ 7.3 展示了概率激活函数，其中包含用于计算感知机值的 Leaky Relue 函数。所提基于 ANN 的功耗和故障感知资源供给技术包含两个输入、一个输出和多个隐藏层。该模型针对数据集或工作负载大小进行训练，即用户定义工作负载的十分之一。两个矩阵分别用于训练输入和训练输出。\n\
  \n训练输入大小 = `100 × 2`，训练输出大小为 `100 × 1`。\n\n训练数据集的工作负载大小包含 100 个任务，占用户定义工作负载的 10%。\n\
  \n#### 7.4.5 误差反向传播与修正\n\n此处我们的目标是获得期望输出。只有在设计出合适的神经网络后，才能获得期望输出。计算过程的前馈方法用于正向传播。隐藏层和输出层中每个神经元的计算均使用激活函数执行。**图\
  \ 7.1** 展示了计算函数（激活函数）。相邻层的神经元通过连接权重和偏置相连。\n\n所提模型遵循误差修正学习机制。误差修正学习机制使用代价函数 (`δk`)\
  \ 提高服务质量。目标是利用 ANN 模型的信号流图（如**图 7.1**所示）最小化代价函数。误差修正学习机制使用公式 7.4 测量误差。\n\n```\n\
  ek(n) = dk(n) - yk(n)  (7.4)\n```\n\n```\nδk = 1/2 * ek(n)²  (7.5)\n```\n\n在公式 7.4\
  \ 和公式 7.5 中，参数 `dk(n)` 表示期望输出，`yk(n)` 显示实际输出，`ek(n)` 为误差，`δk` 为 ANN 模型学习过程中使用的代价函数。\n\
  \n#### 7.4.6 任务调度\n\n在该阶段，使用训练好的神经网络模型实时调度任务。多层感知机模型的准确性和效率取决于训练过程。训练过程取决于生成训练数据集的频率调谐蝙蝠优化技术。任务调度阶段专门使用性能指标功耗和故障率生成最优调度。\n\
  \n#### 7.4.7 所提资源供给技术 Bat-ANN 的算法\n\n##### 7.4.7.1 蝙蝠优化方法\n\n最先进的方法包括元启发式技术，为云环境中的调度问题提供最优解。自然启发式技术的性能可通过人工智能方法加以改进。在本文中，我们提出了一种混合技术，即\
  \ Bat-ANN。基于概率的优化技术与人工深度神经网络相结合。所提模型遵循微蝙蝠的回声定位特性。蝙蝠的回声定位行为被继承在所提的 Bat-ANN 模型中。Bat-ANN\
  \ 混合技术提高了简单元启发式优化蝙蝠算法在云上任务调度中的性能。蝙蝠算法也称为频率调谐算法，为组合优化和调度提供最优解。每只蝙蝠在搜索空间中被分配一个随机频率。与蝙蝠算法相关的参数分别通过公式\
  \ 7.6、7.7 和 7.8 获得。\n\n```\nfi = fmin + (fmax - fmin) * β  (7.6)\n```\n\n其中 `β ∈\
  \ [0, 1]`，`fmin` 表示第 `i` 只蝙蝠的频率。\n\n```\nvti = vt-1i + (xt-1i - x*) * fi  (7.7)\n\
  ```\n\n其中 `vti` 表示第 `i` 只蝙蝠在第 `t` 次迭代中的速度。\n\n```\nxti = xt-1i + vti  (7.8)\n```\n\
  \n其中 `xti` 表示第 `i` 只蝙蝠在搜索空间中的位置。蝙蝠技术有助于训练神经网络。与简单的生物启发式、自然启发式和频率调谐技术相比，混合方法能取得更好的结果。蝙蝠算法初始化所有蝙蝠的频率、位置和速度。定义脉冲频率\
  \ `fixi`。脉冲发射率 `ri` 和响度参数 `Ai` 也被初始化。在简单的蝙蝠算法中使用以下步骤：\n\n1. 初始化蝙蝠种群、其位置、速度、频率。\n\
  2. 初始化所有蝙蝠的回声定位参数。\n3. 在 `xi` 处初始化脉冲频率 `fi`。\n4. 初始化脉冲率 `ri` 和响度 `Ai`。\n5. While\
  \ (终止条件)。\n   通过调整频率并更新速度和位置来生成新解。\n6. End while。\n\n#### 7.4.8 所提 Bat-ANN 任务调度算法\n\
  \n所提模型分为以下步骤：\n\n1. 初始化。\n2. 使用基于概率的蝙蝠优化技术准备训练数据集。\n3. 设计深度神经网络并使用步骤 2 生成的训练数据集训练模型。\n\
  4. 使用训练好的模型在虚拟机上执行任务调度。\n5. 生成最优调度。\n6. 重复步骤 2-4，直到满足收敛条件。\n\n\n\n\n\n### 7.5 结果与讨论\n\
