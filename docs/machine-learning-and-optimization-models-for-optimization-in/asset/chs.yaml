  \n**30** ◾ ML and Optimization Models\n\n### 2.5 结论\n\n本文提出了一种基于人脑特征和优化方法的、受天文学和神经科学启发的虚拟机分配给用户请求的方法。所提出的算法试图利用机器学习技术提高云环境的容错能力，同时提高系统性能。结果与讨论部分表明，BB–BC\
  \ ANN 优于现有的元启发式技术。对所提出算法的研究是在扩展任务负载和资源的情况下进行的。\n\n未来的工作可侧重于数据中心网络中的虚拟机分配。所提出算法的缺点是神经网络需要在一段时间后使用更新的即将到来的任务进行重新训练，以克服训练模型的衰减。然而，与现有算法的总仿真时间之和相比，该训练时间将短得多。未来，该算法可能改善云环境中的功耗和可扩展性。所提出的算法被证明在\
  \ COVID-19 形势下云环境的过载和欠载条件下表现更好，并且在欠载和负载条件下均优于任何现有算法。\n\n### 参考文献\n\n1. A. Beegom\
