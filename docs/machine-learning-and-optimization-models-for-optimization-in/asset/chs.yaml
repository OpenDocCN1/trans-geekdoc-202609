  \ |\n\n## 5.2 Introduction to Neural Networks\n\nArtificial Neural Networks are\
  \ inspired by the functioning of the human brain. `ANN` is a set of algorithms that\
  \ function similarly to the human brain to recognize patterns. Neural networks take\
  \ some raw input data and interpret it through clustering, perceiving, or labeling.\
  \ `ANN` can recognize all real-world objects and patterns, such as images, sounds,\
  \ text, etc. `ANN` helps in classification, clustering, and grouping of unlabeled\
  \ data.\n\nLooking at the expanded name, `neural` refers to the brain cell neurons\
  \ in the human body, and `network` refers to interconnected components. Neurons\
  \ in the human body transmit signals to the brain, but importantly, the human brain\
  \ learns from experience and trains data based on past experiences. Similarly, we\
  \ want artificial machines to work based on the concept of the human brain, called\
  \ neural networks. In Artificial Neural Networks, there will be artificial neurons\
  \ transmitting signals and training data to generate better outputs. Neural networks\
  \ can be used in recognition domains where the human brain excels, such as data\
  \ classification and pattern recognition.\n\n**Types of Neural Networks**:\n\n*\
  \   **Artificial Neural Network (`ANN`).**\n*   **Convolutional Neural Network (`CNN`).**\n\
  *   **Recurrent Neural Network (`RNN`).**\n\n## 5.2.1 Artificial Neural Network\
  \ (ANN)\n\nThis is the simplest type of neural network. An Artificial Neural Network\
  \ is a collection of various neural networks at different levels. Inputs in `ANN`\
  \ are processed in the forward direction. Therefore, `ANN` is also called a Feedforward\
  \ Neural Network. These networks are universal function approximators because they\
  \ can learn any type of non-linear function. Mapping is done by assigning weights\
  \ to inputs to generate outputs. Activation functions help the network understand\
  \ the relationship between inputs and outputs.\n\n`ANN` has the following three\
  \ layers (Figure 5.3):\n\n*   **Input Layer**: In the input layer of `ANN`, inputs\
  \ are received. Inputs received and forwarded to the next layer. In our case, the\
  \ input will contain the following variables.\n*   **Hidden Layer**: The hidden\
  \ layer of `ANN` has no connection with the outside world; hence it is called the\
  \ hidden layer. It processes inputs forwarded by the input layer.\n*   **Output\
  \ Layer**: The output of `ANN` generates the output processed by the hidden layer.\n\
  \nIn our case:\n\n```\nvmlist = {1, 2, 3, ..., n}\ntasklist = {1, 2, 3, ..., m}\n\
  ```\n\nare the random input parameters we will pass to the `ANN` algorithm; the\
  \ hidden layer will process the input data and pass it to the next layer (if available).\
  \ In the final stage, we will obtain the output dataset. These learning-based algorithms\
  \ will learn from previous datasets (training datasets) and predict the optimal\
  \ solution for the problem. The fitness function acts as a threshold point for the\
  \ hidden layer and input layer to process data.\n\n![Image 39](img/index-96_1.jpg)\n\
  \n**Figure 5.3** ANN Architecture of the Proposed Model.\n\n## 5.2.2 Convolutional\
  \ Neural Network (CNN)\n\nConvolutional Neural Networks are mainly used for image\
  \ classification. `CNN` can generate data from images and can distinguish one image\
  \ from another. The building block of `CNN` is the kernel. The kernel is also called\
  \ a filter. Using the convolution operation, the kernel or filter is used to extract\
  \ relevant features from the input.\n\n## 5.2.3 Recurrent Neural Network (RNN)\n\
  \nRecurrent Neural Network is an extended version of the Artificial Neural Network.\
  \ Unlike `ANN` which processes forward at each layer, `RNN` adds an iterative constraint\
  \ in the hidden layer. Therefore, through iterative constraints, we can access information\
  \ from the previous iteration and train data based on past iterations. Because it\
  \ has recurrent connections in the hidden layer, it is called a Recurrent Neural\
  \ Network. The previous output is considered as input for the next layer.\n\n* \
  \  **Input Layer**: The input layer of `RNN` receives input.\n*   **Recurrent Layer**:\
  \ In the recurrent layer, input is processed and iterated to generate better output.\n\
  *   **Output Layer**: This layer generates the output processed by the recurrent\
  \ layer.\n\n\n\n\n将深度学习与云相结合的使用，与传统方法相比，必将产生更好的结果。上述算法根据其目标和工作方式进行分类。基本功能是提供带有某些权重和阈值点的输入，并将其传递给隐藏层，隐藏层将使用激活函数处理输入，然后产生输出。每一层都将拥有各自的偏置点。\n\
  \n### 5.3 遗传算法简介\n\n该算法是一种基于搜索的启发式算法，它根据适应度标准选择对象以进行进一步处理。GA 由五个阶段组成：\n\n### 1.\
  \ 初始种群\n\n这是给定问题可能解的集合。集合中的每个元素都由某些参数表征。在确定初始种群时，应牢记多样性和种群大小。种群大小是一个随机向量。初始化可通过两种方式完成：\n\
  \n1. **随机初始化**：在没有先验知识的情况下随机给出解。\n2. **启发式初始化**：根据某些已知的先验因素给出解；这可能导致解的相似性和多样性降低。\n\
  \n在我们的案例中，我们使用的是随机初始化。\n\n```\nVM_list = { mV1, mV2, mV3, ..., mVn }\nPn = { P1,\
  \ P2, P3, ..., Pn }\n```\n\n图 5.4 是一个单一解；我们将从种群中生成一组 `n` 个解。\n\n```\nSn = { [ Vm[List]1,\
  \ P[n]1 ], [ Vm[List]2, P[n]2 ], ..., [ Vm[List]i, P[n]j ] }\nS = { S1, S2, S3,\
  \ ..., Sn }\n```\n\n**图 5.4** 虚拟机到种群向量的随机分配。\n\n其中：\n- `Vm` 是虚拟机数组。\n- `P` 是种群集合。\n\
  - `Sn` 是解集。\n\n确定初始种群后，将预定义的适应度函数应用于初始种群。\n\n### 2. 适应度函数\n\n这是一个预定义函数，用于确定初始种群集合中各个元素的适应度。个体的选择基于适应度得分。适应度函数计算给定解的适应度应足够快，因为我们可能需要重复多次，直到找到最优解。根据情况，适应度可能是精确的，也可能是近似的。\n\
  \n应用适应度函数后，我们将获得由适应度函数确定的适合解列表（图 5.5）。\n\n```\nFn = { S1, S3, ..., Sn }\n```\n\n\
  `Fn` 是适合解的集合。\n\n**图 5.5** 应用适应度函数后生成适合解集合。\n\n### 3. 父代选择\n\n选择是遗传算法的关键部分，因为如果我们选择最适合的可能解，它可能会占据整个种群，从而导致**过早收敛**。良好的多样性维护对于\
  \ GA 的成功至关重要。有多种选择解的方法。\n\n#### a. 适应度比例选择\n\n在此方法中，每个解成为父代的概率与其适应度成正比。因此，适应度较高的解将有更高的被选中几率。此类选择有两种可能的模型：\n\
  \n1. **轮盘赌选择**：在轮子圆周上定义一个固定点。旋转后，停在固定点前方的区域被选为父代。适应度越高的解覆盖的区域越大，因此被选中的几率越高。\n2.\
  \ **随机普遍采样**：我们将有多个固定点；因此所有父代将在一次旋转中被选中。\n\n#### b. 锦标赛选择\n\n在 `n` 向锦标赛选择中，从种群中选择\
  \ `n` 个个体解。重复该过程，直到选出最适合的父代。此方法也适用于负值。\n\n#### c. 排序选择\n\n当个体的适应度彼此非常接近时。在这种情况下，适应度值几乎不可考，因为所有集合具有相同的适应度值。优先选择排名较高者。\n\
  \n### 4. 交叉\n\n在此过程中，选择多个父代并生成一个或多个具有父代属性的集合。交叉以高概率应用。执行交叉有多种方式。\n\n#### a. 单点交叉\n\
  \n此处从父代中选择一个随机点，并通过交换过程生成新解。\n\n#### b. 多点交叉\n\n这是单点交叉的进阶形式；在此我们将拥有多个随机点来生成新解。\n\
  \n#### c. 均匀交叉\n\n此处没有随机点。我们通过抛硬币决定是否选择父代的属性。\n\n#### d. 整体算术重组\n\n这通过公式获取两个父代的加权平均值：\n\
  \n```\nChild1 = a × x + (1 - a) × y\nChild2 = a × x + (1 - a) × y\n```\n\n#### e.\
  \ Davis 顺序交叉 (OX1)\n\n这是一种基于排列的交叉，将相对信息传递给新解。其工作原理如下：\n\n1. 在父代中定义两个随机点，复制两点之间的片段并将其移至第一个新解。\n\
  2. 现在从第二个父代的第二个点复制未使用的内容并移至第一个解。\n3. 以相反的父代方式重复第二个解的操作。\n\n### 5. 变异\n\n此过程在父代解中进行随机的微小改动以生成新解。这旨在维持初始种群集合的多样性，且以低概率发生。最常用的变异有：\n\
  \n#### a. 位翻转变异\n\n我们选择一些随机位并将其翻转以获得新解。主要用于二进制编码的 GA。\n\n#### b. 随机设置\n\n在此方法中，将一个随机整数值分配给随机选择的解。\n\
  \n#### c. 交换变异\n\n这种基于组合的编码从父代中选择两个随机点并交换它们以生成新解。\n\n#### d. 乱序变异\n\n此处选择解的一个子集并对其进行乱序/洗牌以生成新解。\n\
  \n#### e. 逆序变异\n\n类似于乱序选择变异，我们选择一个子集，但不是洗牌，而是反转列表以生成新解。\n\n### 6. 终止条件\n\n当遗传算法提供一组解时，算法终止。开始时\
  \ GA 往往非常快，但在后期阶段会达到饱和点，此时改进非常微小。终止通常在我们非常接近最优解时进行。通常，终止时应考虑以下几点：\n\n1. 连续 `n` 次迭代无改进时。\n\
  2. 如果达到绝对代数上限。\n3. 当解达到预定义标准时。\n\n### 5.4 提出的模型 1（用于优化的混合 GA 和朴素贝叶斯模型）\n\n我们的目标是将这两种算法合二为一，生成一种混合算法，在节省任务总执行时间的同时提高预测能力，从而有助于在节省执行时间的前提下实现合理的资源优化（图\
  \ 5.6）。\n\n首先，我们将从所有可用的 VM 中生成一个随机列表并\n\n\n\n\n### 5.5 鲸鱼优化算法 (WOA)\n\nWOA 由 Jalili\
  \ 和 Lewis 提出，用于优化数值问题 (Mir Jalili & Lewis, 2016)。它是一种模仿座头鲸行为的元启发式算法。其觅食行为被称为气泡网捕食。猎物是靠近水面的小鱼。觅食是通过沿圆周产生独特的气泡来完成的。整个过程分为三个阶段：珊瑚环（包围猎物）、拍尾（气泡网攻击方法（开发阶段））和捕获环（搜索猎物（探索阶段））。\n\
  \n![Image 42](img/index-103_1.jpg)\n\n**图 5.6** 混合算法的建议模型。\n\n#### 5.5.1 数学模型\n\n\
  ##### 5.5.1.1 第一阶段：包围猎物\n\n第一阶段是识别猎物的位置并对其进行标记。当前最佳搜索代理被视为目标猎物。确定当前最佳解后，其他解将尝试更新其位置以向当前最佳解靠拢。该过程表述如下：\n\
  \n```\nD = C × X*(t) - X(t)\nX(t+1) = X*(t) - A × D\n```\n\n其中\n\n- `t` 表示当前迭代次数。\n\
  - `X*` 是第 `t` 次迭代时迄今获得的最佳解的位置向量。\n- `X` 是每个代理的位置向量。\n\n系数向量 `A` 和 `C` 计算如下：\n\n\
  ```\nA = 2a × r - a\nC = 2r\n```\n\n其中\n\n- `a` 在迭代过程中线性从 2 递减到 0。\n- `r` 是 [0,1]\
  \ 区间内的随机向量。\n\n##### 5.5.1.2 第二阶段：气泡网攻击（开发阶段）\n\n开发阶段是两种方法的结合。\n\n#### a) 收缩包围机制\n\
  \n该机制通过减小 `a` 的值来实现；`A` 的波动范围也随 `a` 减小。可以说，`A` 是区间 `[-a, a]` 内的随机值，其中 `a` 在迭代过程中从\
  \ 2 递减到 0。\n\n#### b) 螺旋更新位置\n\n在此步骤中，在鲸鱼位置与目标之间建立一个方程，以产生螺旋状运动；方程如下：\n\n```\nD'\
  \ = X*(t) - X(t)\nX(t+1) = D' × e^(bl) × cos(2πl) + X*(t)\n```\n\n其中\n\n- `D'` 是鲸鱼与目标之间的距离。\n\
  - `b` 是定义对数螺旋形状的常数。\n- `l` 是 [-1,1] 区间内的随机数。\n\n座头鲸在收缩圆圈的同时沿螺旋路径移动。如果我们假设在一次迭代中选择收缩包围或螺旋模型移动的概率各为\
  \ 50%，则：\n\n```\nX(t+1) = X*(t) - A·D          if p < 0.5\nX(t+1) = D' × e^(bl)\
  \ × cos(2πl) + X*(t)  if p ≥ 0.5\n```\n\n其中 `p` 是 [0,1] 区间内的随机数。\n\n##### 5.5.1.3\
  \ 第三阶段：捕获环（搜索猎物（探索阶段））\n\n在气泡网方法中目标未定义；因此猎物是随机搜索的。可以利用 `A` 的变化，当 `|A| > 1` 时，迫使搜索代理远离参考位置（鲸鱼）。搜索代理的位置将根据随机选择的解进行更新，而不是迄今为止的最佳解。\n\
  \n这可以表述为：\n\n```\nD = C × X_rand - X\nX(t+1) = X_rand - A·D\n```\n\n其中 `X_rand`\
  \ 是随机位置向量。\n\n## WOA 算法（伪代码）\n\n最初有一组随机解。在每次迭代中，搜索代理根据最佳解或随机选择的代理更新其位置。为了探索和开发，参数\
  \ `a` 从 2 递减到 0。\n\n如果 `|A| > 1`，选择随机代理；如果 `|A| < 1`，选择迄今为止的最佳解来更新搜索代理的位置。\n\n**伪代码**：\n\
  \n```\nInput: data, max_iteration, population\nInitialize whales population Xi (i\
  \ = 1,2,3……..n)\nInitialize A, C, l, a and p\nCalculate the fitness of each search\
  \ agent\nX* = best agent at the beginning\nWhile (It < max_iteration)\n    for each\
  \ search_agent\n        if (p < 0.5)\n            if (|A| < 1)\n               \
  \ update search agent with X(t+1) = X*(t) - A×D\n            else if (|A| >= 1)\n\
  \                select random search agent (X_rand)\n                update the\
  \ current search agent with X(t+1) = X_rand - A×D\n            end\n        else\
  \ if (p >= 0.5)\n            update the position of current search agent with X(t+1)\
  \ = D' × e^(bl) × cos(2πl) + X*(t)\n        Calculate fitness of each search agent\n\
  \        Update X* if better agent found\n    It = It+1\n    Update A, C, l, a and\
  \ p\nend while\nreturn X*\n```\n\n我们将提出一种结合 ANN 的改进鲸鱼优化算法，以实现更高的准确性和最小的响应时间（图 5.7）。\n\
  \n**图 5.7** WOA 和 ANN 的建议模型架构。\n\nWOA 以虚拟机列表和适应度函数作为输入，连同其他参数。然后它为每次迭代生成一个最优解。该列表被传递给\
  \ ANN 算法用于学习，测试数据集将被传入 ANN 进行进一步预测。因此，它也将提高准确性和效率。\n\n## 表 5.2 基于云和 ANN 方法的相关工作分析\n\
