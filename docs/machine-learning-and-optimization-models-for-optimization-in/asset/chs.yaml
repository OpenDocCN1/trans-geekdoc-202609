  \n### 7.6 结论与未来工作\n\n本文提出了一种用于云基础设施任务调度的高效任务调度方案。所提 `bat-ANN` 模型优于遗传算法和现有技术。结果部分表明，该模型在云\
  \ `IaaS` 环境下的表现优于现有技术。性能通过以下指标计算：平均完成时间（毫秒）、平均开始时间（毫秒）、总执行时间、故障率、已完成任务数和失败任务数。\n\
  \n本工作仅专注于使用蝙蝠算法进行云任务调度。该工作提出了一种具有高服务质量的容错模型。在未来的工作中，所提模型将用于主机上的资源调度和迁移方法，以通过最优资源更好地利用资源，改善云应用的运行成本。\n\
