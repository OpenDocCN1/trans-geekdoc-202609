  \n### 10.4 求解 MOMP\n\n为了找到问题 10.1.1 的陈述 (10.1.1.a) 和 (10.1.1.b)，需要一个将 d(s, x) 在\
  \ s 中的根与 x 建立起来的符号表达式。根据 Abel–Ruffini 定理，如果 d(s, x) 在 s 中的次数 `μ` 大于 4，则不需要一个仅包含根式的公式来将\
  \ d 的根与参数 x 联系起来。[10.4.1] 中提出的方法是代数几何中处理对称多项式的一种变体，以便获得已经是 Gröbner 形式的多项式根的隐式符号表达式。\n\
