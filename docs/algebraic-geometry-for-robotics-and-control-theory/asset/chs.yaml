  \ = 0。\n\n为了计算此类多项式，考虑以下系统矩阵：\n\n![image](img/f0127-03)\n\n其中 `P` = `[p*[1], ...,\
  \ p*[s]]` ∈ ![image](img/kopf.jpg)(*m×s*)\\[*x*\\\\]且 `q` = `[q*[1], ..., q*[s]]`⊤\
  \ ∈ ![image](img/kopf.jpg)*^s*\\[*x*\\\\]。\n\n`P` 的关系矩阵为\n\n![image](img/f0127-04)\n\
  \n因此，\n\n![image](img/f0127-05)\n\n其中 *k* 是 ![image](img/qopf.jpg)\\[*x*[1], *x*[2]*\\\
  ] 的任意元素。\n\n\n\n\n\n书中报告的大多数计算都是使用 `Macaulay2` (Grayson and Stillman, 2020) 完成的，这是一种用于代数几何和交换代数计算的免费开源代数系统。本章的目标是提供一些代码片段，向读者介绍使用\
  \ `Macaulay2`。这远不是对该系统的完整通用介绍，而是对第 1 章中总结理论的应用性注释。\n\n要用 `Macaulay2` 进行多项式计算，必须固定多项式所属的环境环，并在该环上固定一个单项序。例如，要固定环境环\
  \ ![image](img/qopf.jpg) 的指令（实域 ![image](img/ropf.jpg) 和复域 ![image](img/copf.jpg)\
  \ 分由 `RR` 和 `CC` 表示），而 Lex` 代表 `Lex` 单项序（GRL 单项序由 `GRevLex` 固定，而消除列表开始处前 `i` 个变量的消除序由\
  \ `MonomialOrder => Elimination i` 固定）。环变量的顺序由方括号中的列表指定。\n\n一旦选定了环境环上的任何单项序，就可以通过指令将多项式\
  \ `p*1` = `x*[1]` − ![image](img/x22.jpg)\\+ *x*[3]` 和 `p*2` = ![image](img/x41.jpg)\\\
  + *x*[2]![image](img/x23.jpg)\\+ *x*[4]` 分别赋值给 `p1` 和 `p2`：\n\n```\np1 = x_1-x_2²+x_3\n\
  p2 = x_1⁴+x_2*x_3²+x_4\n```\n\n然后，使用指令将理想 `〈p*[1], p*[2]〉` 赋值给 `I`：\n\n```\nI =\
  \ ideal(p1,p2)\n```\n\n而\n\n```\nG = gens gb I\n```\n\n计算 `I` 的归约 Gröbner 基，并将结果作为单行多项式矩阵赋值给\
  \ `G`。\n\n多项式 ![image](img/x21.jpg)+![image](img/x22.jpg)+![image](img/x23.jpg)+![image](img/x24.jpg)−1\
  \ 除以 ![image](img/capi.jpg) 的余式通过以下计算：\n\n```\n(x_1²+x_2²+x_3²+x_4²-1) % I\n```\n\
  \n`Macaulay2` 允许在多项式环中使用非常一般的系数域。例如，要固定多项式环 ![image](img/qopf.jpg)(*u*[1], *u*[2])\\\
  [*x*[1], *x*[2]\\]（即系数在有理函数域 ![image](img/qopf.jpg)(*u*[1], *u*[2])) 中的 `x*[1]`、`x*[2]`\
  \ 多项式环）以及 GRL 单项序（`x*[2]` ≻[GRL] `x*[1]`），可以使用以下指令：\n\n```\nR = frac(QQ[u_1,u_2])[x_2,x_1,\
  \ MonomialOrder => GRevLex]\n```\n\n商环也可以在 `Macaulay2` 中固定。例如，环 ![image](img/qopf.jpg)*x*[1\\\
  ]/〈![image](img/x21.jpg)\\+ 1〉 固定为：\n\n```\nQR = QQ[x_1]/ideal(x_1²+1)\n```\n\n\
  多项式（相对于所选单项序）的首项、首单项和首系数分别通过 `leadTerm`、`leadMonomial` 和 `leadCoefficient` 计算。`leadTerm`\
  \ 指令也可以应用于理想 ![image](img/capi.jpg)，输出为 `〈LT(!image](images/capi.jpg))〉` 的生成集。\n\
  \n`Macaulay2` 也可以执行理想的操作。因此，如果理想 ![image](img/capi.jpg) 和 ![image](img/capj.jpg)\
  \ 分由 `I` 和 `J` 表示，可以计算：\n\n- ![image](img/capi.jpg) 和 ![image](img/capj.jpg) 的和：`I+J`\n\
  - ![image](img/capi.jpg) 和 ![image](img/capj.jpg) 的积：`I*J`\n- ![image](img/capi.jpg)\
  \ 和 ![image](img/capj.jpg) 的交集：`intersect(I,J)`\n- ![image](img/capi.jpg) 除以 ![image](img/capj.jpg)：`I:J`\n\
  - ![image](img/capi.jpg) 对于 ![image](img/capj.jpg) 的饱和：`saturate(I,J)`\n\n![image](img/capi.jpg)\
  \ 由 `I` 表示的根通过 `gens radical(I)` 计算。上述指令返回 ![image](img/capi.jpg) 由 `I` 表示的根的行向量。\n\
  \n`Macaulay2` 还能对模和子模执行操作。在处理 ![image](img/kopf.jpg)*m\\[*x*\\] 子模之前，必须将基环固定为理想。为了固定\
  \ `Lex` 单项序（如 1.10 节 所示），可以使用 `MonomialOrder => {Lex, Position => Down}`，而 GRL 单项序的\
  \ POT 扩展可以用 `MonomialOrder => {Position => Down, GRevLex}` 固定。对于理想，环变量的顺序由方括号中的列表指定。子模的表示矩阵可以通过\
  \ `matrix` 。例如，矩阵 ![image](img/f0131-01.jpg)可以通过指令设置：\n\n```\nP = matrix{{x_1²+x_2,x_1-x_3,x_4},{x_2²+x_1,\
  \ 0,-x_3}}\n```\n\n然后，表示矩阵为 `P` 的子模可以生成：\n\n```\nM = image P\n```\n\n对于所选单项序，模 `M`\
  \ 的归约 Gröbner 基可以使用 `gens gb M` 计算，它通过相应的表示矩阵返回 `M` 的归约 Gröbner 基。最后，`P` 的同源矩阵可以通过\
  \ `syz P` 计算。\n\n### 2.2 Macaulay2 中的多项式\n\n(1.3) 中的多项式取自环 ![image](img/qopf.jpg)\\\
