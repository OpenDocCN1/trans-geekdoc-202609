- "# 机器人与控制理论代数几何\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 前言\n\n本书的目的是展示如何利用代数几何解决机器人学和控制理论中的问题。假设读者熟悉动态系统的基础知识以及控制设计中的一些标准工具；然而，并不假设读者已经了解代数几何。\n\
  \n书中提出的问题大多源于我们的研究，在某些情况下源于该领域的其他来源。我们尝试使叙述尽可能自成体系。由于所考虑的主题数量多且具有异，我们没有在不同章节中系统地包含综述部分；很难获得每个主题的相当完整的概述。我们对这种疏漏表示歉意并并包含的参考文献能够充分补充这一方面。\n\
  \n## 作者简介\n\n![image](img/aut1.jpg)\n\n**Laura Menini** 于 1993 年在意大利罗马托沃尔盖加塔大学获得学位，并\
  \ 1997 年获得博士学位，目前是该校教授。她合著了《非线性分析中的对称性和半不变量》（Springer, 2011）和《系统理论的数学方法》（World Scientific,\
  \ 1998）。她是 IFAC 第 2 协调委员会主席，也是 IEEE Control Systems Letters 的高级编辑。\n\n![image](img/aut2.jpg)\n\
  \n**Corrado Possieri** 于 2011 年和 2013 年在意大利罗马托沃尔盖加塔大学获得医学工程学士和硕士学位，并 2016 年获得该校计算机科学、控制与地理信息博士学位。2016\
  \ 年，他访问了加州大学圣芭分校（UCSB）。2018 年，他加入了意大利交通理工学院（Politecnico di Torino）电子与电信系担任助理教授。随后，他于\
  \ 2019 年加入了意大利国家研究会系统分析与计算机研究所（IASI-CNR），目前担任研究员。他是 IEEE CSS 会议委员会、EUCA 会议委员会以及\
  \ IFAC 会议委员会的副编辑。\n\n\n\n\n\n`Antonio Tornambè` 目前是意大利罗马特韦尔加塔大学的控制理论教授。他的研究方向包括线性和非线性系统的控制理论。他是*Discrete-Event\
  \ System Theory: An Introduction* (World Scientific, 1995)、*Mathematical Methods\
  \ for System Theory* (World Scientific, 1998)以及*Symmetries and Semi-invariants in\
  \ the Analysis of Nonlinear Systems* (Springer, 2011)的合著者。\n\n\n\n\n### 1.7 根的定位](#chapter1.xhtml#sec1-7)\n\
