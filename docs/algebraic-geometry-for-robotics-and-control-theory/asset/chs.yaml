  \n## 第 11 章\n\n## 结构化扰动下线性时不变系统内部不稳定的距离\n\n## 11.1 引言\n\n本章的目标是研究线性时不变系统到内部不稳定的距离（Menini\
  \ *et al.*, 2020a）。这项研究在文献中具有很久的历史（例如，参见 Loan, 1985; Gryazina *et al.*, 2008）。连续时间线性时不变系统\
  \ ![image](img/f039-01.jpg) 是指数稳定的，当且仅当其特征值的实部为负。在许多理论和实际感兴趣的情况下，已知标称值 `A^◦`，且 `δA`\
  \ = `A`−`A^◦` 代表*非结构化*扰动。另一方面，在其他其他情况下（例如处理矩阵元是某些物理量的机械和电气系统），标称系统的*结构化*扰动是有兴趣的，在标称系统指数稳定的假设下，对于两种情况，重要的是扰动有多大。\n\
  \n本章的目标是将第 11.2 节中关于非结构化的分析扩展到结构化情况，允许参数以多项式方式影响系统。本章的主要方面总结如下：\n\n(i) 考虑连续时间和离散时间不变系统。\n\
  \n(ii) 不确定参数以多项式方式影响系统方程，![image](img/ropf.jpg)，其中 `Δ` 是时间导数（连续时间）或向前位移（离散时间），且\
  \ `E(β)`, `A(β)` 是向量 `β` 的多项式。\n\n(iii) 如果系统是良好连接的（Doyle *et al.*, 2013）（即 det(`E(β)`)\
  \ ≠ 0），则 ![image](img/f0440-02.jpg)，从而包含了影响系统的未知参数。\n\n(iv) 非结构化情况可以作为子情况包含在分析中，让\
  \ `E`−`E^◦` 和 `A`−`A^◦`其中 `◦` 表示标称情况成为不确定参数。\n\n(v) 可以在参数空间中采用一般的距离函数，包括欧式距离。\n\n\
  (vi) 考虑内部指数稳定性（即良好性和指数稳定性）。\n\n(vii) 将标称系统到不稳定的距离问题重新表述为点到仿射簇的距离问题。\n\n(viii) 给出了计算标称系统到不稳定距离的方法。\n\
  \n(ix) 给出了两种方法在可能的连通区域之一的中心（解析中心和切雪比中心）选择标称系统，使得标称系统足够远离不稳定。注意，将系统模型选择为 `E(β)Δx(t)=A(β)x(t)`\
  \ 可以处理代数系统，以及良好性丢失由于内部子系统连接引起的情况。\n\n因此，本章提出的技术可以用于研究动态矩阵以多项式或理性方式依赖某些参数的代数、线性时不变系统到内部不稳定的距离。\n\
  \n文献中使用了其他几种类型的度量来衡量两个系统之间的距离，例如间（Georgiou and Smith, 1990）、图（Vidyasagar, 1984）和\
  \ *ν*-间度量（Vinnicombe, 1993）。与考虑到标称和扰动系统传递函数距离的度量不同，这里考虑的平方距离函数（参见定义 11.4.1）考虑到系统参数标称值与扰动值之间的距离，因此鲁棒性测量基于具有直接物理意义（可能经过适当加权）的量。\n\
