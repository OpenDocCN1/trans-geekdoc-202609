    # 4.4 CONCLUSION


    This research work presents a landslide susceptibility map to predict and future
    landslide locations. Nowadays researchers are repairing to investigate landslide
    zones using multiple models. Here the hybrid BBO machine learning model has been
    used to obtain a susceptibility map through the information about known and unknown
    landslide points. The model presented a spatial database by considering different
    geo-environment factors. From the AUC values of ROC it is established that hybrid
    BBO for the success rate and prediction rate are 0.9237 and 0.8979, respectively
    (Figure 4.9). All primary and secondary data were used to prepare the susceptibility
    map with the help of a hybrid BBO with three ensemble models. From it is seen
    that there is a high tendency to occurrences of landslides and the causative factors
    are very strong in creating such types of severe hazards. This machine learning
    is now used for many susceptibility and potentiality analyses. The hybrid BBO
    is also used for other susceptibilities like flood, soil erosion and costly erosion,
    and potentiality analysis for groundwater, minerals, and so on. The major limitations
    of this study is that the hybrid BBO model cannot make the factors for landslide
    occurs once, due to the physical barrier of east Sikkim, many inaccessible landslide
    locations have not been considered. Landslide-related information and landslide
    susceptibility mapping will help the government as researchers to take steps in
    hazard management and stabilizing natural conditions.'
