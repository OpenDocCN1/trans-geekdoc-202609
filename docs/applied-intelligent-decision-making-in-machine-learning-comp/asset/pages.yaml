  md: '# Applied Intelligent Decision Making in Machine Learning


    # 12.3.2 CLAHE


    Histogram equalization is one of the simplest methods for enhancing an image.
    It helps in improving the quality of the image without knowing the actual cause
    of degradation. It performs well only if the pixel value distribution across the
    image is identical. CLAHE [26] is the modified version of AHE [13], proposed to
    limit the problems faced by the latter. CLAHE works in same manner as AHE, the
    only difference is in the calculation of the clip limit, which specifies the contrast
    enhancement limit. The higher the value of the clip limit, the more the contrast
    of the image. The clip limit is based on the normalized histogram, including the
    size of the neighbor-region.


    Initially, the image is divided into different non-overlapping blocks of equal
    size. Next, a histogram for each region is calculated and a desired clip limit
    is obtained to clip the histograms. The histograms are redistributed such that
    their heights do not go above the clip limit. This redistribution procedure may
    need several iterations on the clipping factor. Lastly, all the neighboring tiles
    are merged using bilinear interpolation and their gray scale values are changed
    according to the modified histograms. The pseudo-code for the CLAHE procedure
    is given in Algorithm 12.2.


    Here, $N_{average}$ is the average number of gray levels in textural regions.
    $NrX$ is the number of pixels in $X$ dimension of contextual region. $NrY$ is
    the number of pixels in $Y$ dimension of contextual region. $N_{CLIP}$ is actual
    clip limit. $N_{clip}$ is the normalized clip limit in the range $[0,1]$. $N_{total}$
    is the total number of clipped pixels. $N_{vremain}$ is the average number of
    pixels to be distributed. $N_{remain}$ is the number of pixels to be distributed.
    $H(i)$ is the original histogram of each region at the $i$th gray level. $H_{clip}(i)$
    is the clipped histogram of each region at the $i$th gray level.


    # 12.3.3 GF


    GF uses the property of another image, for example, the guidance image, to carry
    out the filtering process. GF can be helpful in many ways, as being helpful in
    eliminating false edges and staircase effects from the image, as well as being
    used in image smoothing and noise reduction from the image. Mathematically, GF
    can be expressed as:


    ```

    $q_i = a_k l_i + b_k, \forall i \in \omega_k$$

    ```


    where the guidance image is represented as $I$, the input image is represented
    as $p$, the output image can be defined as $q_i$, $\omega_k$ is the size of the
    window centering at pixel $k$, and $(a_k, b_k)$ are the constants. The value of
    be calculated as:


    ```

    $a_k = \frac{\sum_{i \in \omega_k} l_i p_i - \mu_k \Gamma_k}{\sigma_k^2 + \varepsilon}$$

    ```


    ```

    $b_k = \Gamma_k - a_k \mu_k$$

    ```'
