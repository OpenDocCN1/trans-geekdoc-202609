    # 4.2.6 VALIDATION OF MODELS


    For the validation of the training dataset the AUC values with the receiver operating
    characteristic (ROC) curve was considered to obtain an authentic result. The AUC
    values state the model which is perfect for this area. Here, the ROC curve is
    a technique whose value is able to predict the best model. The scientific calculation
    is:


    ```

    $S_{AUC} = \sum_{k=1}^n (X_{k+1} - X_k) \left( S_k + 1 - S_{k+1} - \frac{S_k}{2}
    \right) \quad (4.12)$

    ```


    $S_{AUC}$ is considered an ROC, $X_k$ is specificity, and $S_k$ is the sensitivity
    of ROC, which considers primary information about recent landslides. The performances
    of the classifiers identified the optimal model which is generated by different
    cutting thresholds.


    # 4.2.7 SHORTLY STRUCTURED METHODOLOGY


    This study consists of four main stages which are described and summarized here:
    data selection, data preparation, geo-conditioning factors, and a collinearity
    test VIF and TOL for parameters selection. A landslide susceptibility map uses
    a hybrid BBO and its ensembles. The ensemble is validated through AUC values of
    ROC. The prescribed methodology framework is shown in Figure 4.6.'
