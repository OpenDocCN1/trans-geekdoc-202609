    \ \\dots, I_m\\}$ **do**\n\tResize $I_k$ and $T$ to $60 \\times 60$;\n\t$S_k \\\
    leftarrow SSIM(I_k, T)$;\n**end**\nReturn 20 character classes that have maximum\
    \ $S_k$\n```"
