  md: '# 6.4.3 PHASES


    METIS incorporates a multi-level approach which includes three phases. Each phase
    includes various algorithms:


    +   - A series of graphs, $G_0, G_1, \dots, G_n$, can be generated to coarsen
    the graph. The original graph is represented by $G_0$ and for each $0 \le i \le
    j \le N$, $G_i$ will have a greater number of vertices than $G_j$ will have.

    - The partition of $G_N$ must then be computed.

    - With respect to each graph, the partition must be refined by projecting it through
    the sequence in the order of $(G_n, \dots, G_0)$.

    - A partition of the original graph is the final partition that is computed during
    the third phase (the refined partition projected onto $G_0$).


    # 6.4.4 ADVANTAGES


    METIS is chosen as the graph-partitioning algorithm as it has various advantages.
    It is known to provide high quality partitions. Very large-scale integration (VLSI),
    linear programming, finite element methods, transportation, and various other
    domains in which experiments have been conducted show that in comparison to widely
    used algorithms partitions produced by METIS are consistently better. Another
    advantage of METIS is that it is extremely fast. In comparison to other partitioning
    algorithms METIS has proven to be one to orders of magnitude faster. It can partition
    graphs with several nodes in almost no time using current PC systems and workstations.


