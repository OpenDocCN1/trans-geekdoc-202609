  md: '# Computational Intelligence in Engineering Problem Solving

    Series Editor: Nilananjan Dey


    Computational Intelligence (CI) can be framed as a heterogeneous domain that harmonizes
    and coordinates several technologies, such as probabilistic reasoning, artificial
    life, multi-agent systems, neuro-computing, fuzzy systems, and evolutionary algorithms.
    Integrating several disciplines, such as Machine Learning (ML), Artificial Intelligence
    (AI), Decision Support Systems (DSS), and Database Management Systems (DBMS),
    increases the CI power and impact in several engineering applications. This series
    provides an excellent forum for discussing the characteristics of CI systems in
    engineering. It emphasizes the development of CI techniques and their role as
    the state-of-the-art solutions in different real-world engineering applications.
    The series is aimed at researchers, academics, scientists, engineers, and other
    professionals who are involved in the new techniques of CI, which including artificial
    fuzzy logic and neural networks, are presented for biomedical image processing,
    power systems, and reactor applications.


    # Applied Machine Learning for Smart Data Analysis

    Nilananjan Dey, Sanjeev Wagh, Parikshit N. Mahalle, Mohd. Shafi Pathan


