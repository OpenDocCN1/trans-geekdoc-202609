  md: "# A Multi-Stage Hybrid Model for Odia Compound Character Recognition\n\n# 3.3\
    \ PROPOSED METHOD\n\nThe proposed prediction model consists of three stages. The\
    \ first phase uses SSIM based template matching to reduce the number of possible\
    \ prediction labels to 20. These probable character classes are further reduced\
    \ to ten based on their geometrical. In this stage, we used projection profile\
    \ matching to match the similar characters geometrically. The final prediction\
    \ of character is performed in the last stage by a machine learning approach.\
    \ We employed LFD features and GRNN to predict the final class. The overall block\
    \ diagram of the proposed three-stage hybrid model is depicted in Figure 3.7.\
    \ Each stage of the model is described in Algorithms 3.1 to 3.3.\n\n![](img/d1bf16e7dc1fe5d49ee33c2dfa5cdb06_71_0.png)\n\
    \n**Figure 3.7** Block diagram for the proposed hybrid model.\n\n# **Algorithm\
