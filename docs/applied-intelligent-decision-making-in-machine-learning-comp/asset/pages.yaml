- pgno: 59
  md: '# Decoding Common Machine Learning Methods


    In addition to the advantage of cutting down the computational time and expense
    in turn, understanding the logic behind the ML algorithm is central as it allows
    the user to better understand the methods, aids taking better post-hoc decisions
    in the case of prediction failure of a model, and develops customized application-specific
    methodologies. However, some of the limitations of decoding the ML algorithm includes
    (i) knowledge of subjects such as statistics and mathematics to comprehend the
    theory behind the ML methods; (ii) coding skills to construct an ML algorithm;
    and (iii) time effort to understand and build models.


    With a better knowledge of the theories and fundamental working principles, the
    future novel ML algorithms can be developed; also any existing machine learning
    algorithm can be tweaked to meet the specific needs of the data in hand. Therefore,
    similar to LDA and knn dealt with this chapter, the methods behind all the other
    available ML methods can be decoded and reconstructed using free and rich open
    source resources, thereby breaking "black-boxes" and making user-coded "efficient
    tools" for ML applications.


