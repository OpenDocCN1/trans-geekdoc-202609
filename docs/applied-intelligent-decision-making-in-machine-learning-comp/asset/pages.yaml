    forward or backward selection and heuristic selection. These selected features
    are given to the predictive model algorithm, and the scores are assigned to the
    feature subset by the accuracy of the model. Similarly, each feature subset is
    analyzed, and the one yielding the highest model accuracy is selected. An example
    of a wrapper method is the forward and backward selection algorithm (Mao, 2004).


    # 2.3.5.3 Embedded Methods


    The embedded method of feature selection learns the features that contribute the
    most to the accuracy of the model. These methods are also known as the regularization
    or penalization methods, where the coefficients of irrelevant features are penalized
    and removed from the model. Some of the examples of the regularization algorithms
    are Lasso (Li et al., 2006), elastic net (Zou and Hastie, 2005), and ridge regression
    (Engleman, 2011).


    Among these feature selection methods, the Relief algorithm, which is mathematically
    straightforward, provides a measure of the influence for features, and can deal
    with multi-classes in the output variable. Moreover, it is the only feature selection
    method that is capable of detecting the feature dependencies using the simplest
    nearest neighbor approach (Urbanowicz et al., 2018). The Relief algorithm was
    chosen for feature selection in the two considered agricultural applications.


    # 2.3.5.4 Relief Algorithms


    The Relief algorithm is a family of three algorithms, such as basic Relief, ReliefFF,
    and RReliefF. The basic Relief algorithm can only handle the classification of
    two classes; ReliefFF, which is an extension of basic Relief, can handle multi-classes
    that are categorical, only the RReliefF can handle continuous regression classes.
    All three algorithms have the same underlying mechanism. This chapter details
    classification with ML for a dataset containing multi-classes, only the RReliefF
    method was appropriate. However, to follow the algorithm working principle, a
    manual example using the basic Relief for binary class data is demonstrated in
    this section since the main demonstration using ReliefFF for multi-classes is
    tedious. Studies detailing the Relief algorithm can be found elsewhere (Kononenko,
    1994; Robnik-Sikona and Kononenko, 2003).


    The pseudocode (Algorithm 2.1) decodes the basic Relief algorithm. Weights are
    initialized to zero for all the features in the data. The Relief algorithm identifies
    the two nearest neighbor, hit (H) and miss (M), using Manhattan distance (rectilinear
    distance as sum of projections) instead of Euclidean distance as the direct line
    distance between points) calculated between the selected instance (R) and the
    other instances in the data. The H refers to the instance that belongs to the
    same class and at the least distance to the random instance. The M refers to the
    instance that belongs to a different class and at the nearest instance to the
    random instance. The weight revisions are divided by the number of iterations
    (z) to normalize the weights between -1 +1. As a rule of thumb, z is calculated
    as the square root value of the total number of observations in the dataset (n).'
