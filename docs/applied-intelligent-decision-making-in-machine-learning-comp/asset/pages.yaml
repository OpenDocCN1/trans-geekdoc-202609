    # 3.2.3 PROJECTION PROFILE AND KENDALL RANK CORRELATION COEFFICIENT MATCHING


    The projection profile refers to the matching of the top, bottom, left, and right
    projection of the black pixel count in the corresponding character image is depicted
    in Figure 3.5. With the change in font, the location of the outer ovals and the
    depression changes but the order in which they appear remain constant. The analysis
    of the projection can hence be considered


