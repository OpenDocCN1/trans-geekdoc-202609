    In the student phase, students try to increase their performance by interacting
    among them. Any one student interacts with any other student randomly to update
    his or her knowledge. This can be achieved by generating two random integer numbers
    r1 and r2 within the range of the population N. The knowledge of the student is
    updated by using Equation 11.5.


    ```

