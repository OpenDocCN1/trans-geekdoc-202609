    # 11.1 INTRODUCTION


    In real-life scenarios, we often deal with large amounts of data [1], where most
    of the features are not relevant for prediction. These features or attributes
    have a huge influence on effectiveness to determine the performance of the model.
    These irrelevant or redundant features can also negatively impact the performance
    of the model. So, we need refined data, with non-redundant and relevant features
    only. To address this issue, feature selection (FS) plays a decisive role in the
    selection of relevant features. In machine learning (ML) and FS, FS is also known
    as feature or attribute or variable selection. It is the process in which the
    subset of relevant features is selected for the construction of the model. It
    is also the key concept of ML in which performance can highly impact on the classification
    [3–10] models, and it is the method in which the automatic selection of features
    is made the most to the prediction variable in which we are interested [11]. The
    use of FS techniques reduces the overfitting issue, improves classification accuracy,
    and also reduces computational time. Similarly, feature reduction [12–14] is another
    form of the dimensionality reduction approach, which seeks to reduce the number
    of attributes.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# 214 Applied Intelligent Decision Making in Machine Learning


    In the feature reduction method, new combinations of features are constructed.
    However, FS methods can either include or exclude the features without altering
    their significance. The selected significant features consist of an optimized
    feature representation of the original features. Indeed, FS has been shown to
    be a critical task for enhancing the decision-making process in various domains.
    This research proposes an FS approach, based on the teaching-learning-based optimization
    (TLBO) [15, 16] algorithm, along with the evidence of its superiority over other
    models.


    FS is an NP-hard problem [17] as it takes exponential time to find the optimal
    features. In the traditional search approach, the possible solution space increases
    exponentially with an increase in the number of features to find the optimal feature.
    Hence, it is essential to reduce the dimension of the features that will increase
    the performance of the model and also decrease the computational cost of the model.
    This motivated us to design a suitable FS approach that selects an optimal subset
    of features and filters the most irrelevant features to improve the performance
    of the classification [18–20] and reduces the computational cost of it. The several
    wrapper-based FS approaches using a genetic algorithm (GA) have been used to solve
    FS problems [22, 23]. The GA-based FS approach needs several parameters to be
    tuned to obtain better performance. Much other work has been done using evolutionary
    (DE) to solve FS problems [25, 26]. The DE approach is more complex, large, and
    multi-modal search activity, for which the model will be more complex. Particle
    swarm optimization (PSO) [27] has been extensively used in the FS [28, 29] process.
    This PSO-based FS approach suffers from premature convergence regarding the local
    optimum as particles learn from the personal best and the global best. These optimization
    algorithms have some controlling parameters, such as population size, and the
    number of generations need to be tuned to increase the performance of the optimization
    algorithm. Apart from these two controlling parameters, every other optimization
    algorithm has some algorithm-specific parameters, such as crossover probability,
    mutation probability, and a selection operator in the case of GA, with DE also
    having crossover and mutation parameters; similarly, in PSO, social and cognitive
    parameters, and initial weights are also to be properly tuned to get the optimal
    result. The proper tuning of these parameters leads to an increase in the computational
    cost and also traps in the local optimum. Rao et al. developed a TLBO optimization
    algorithm that does not depend on any algorithmic-specific controlling parameters.
    To address these issues, we have proposed an FS approach based on the TLBO optimization
    algorithm named FSTLBO to find the best suitable features in order to improve
    the performance of the model. This approach addresses the problems with the existing
    approaches of FS and finds the best suitable features, by updating the worst features,
    that take on the strength of the TLBO optimization algorithm. The selected features
    are passed to the learning model to compute the fitness (error) and accordingly
    update the position of individuals based on the fitness. Here, we perform the
    FS by using well-known classification algorithms called K-nearest neighbors (KNN).
    This classification algorithm is wrapped with four optimization techniques (GA,
    DE, PSO, and TLBO) to form four FS approaches, namely FSGA, FSDE,'
  merge: -1
  img_proc: true
