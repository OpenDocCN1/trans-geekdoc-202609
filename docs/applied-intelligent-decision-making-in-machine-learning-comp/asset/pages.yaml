  md: '# Applied Intelligent Decision Making in Machine Learning


    # 10.4 CONCLUSION


    This chapter has described the implementation of a special type of RNN, the GRU
    network for the exchange rate forecasting of five currencies (AUD, CAD, GBP, INR,
    and JPY). The GRU model reduces the complex structure of LSTM to two gated architectures
    having update and reset gates, and it also decreases the number of iterations
    needed to execute the program. This leads to fewer in-memory calculations which
    make the proposed model faster than LSTM. The performance measure of LSTM and
    GRU is carried out by applying different sliding window sizes for various days-ahead
    predictions. For sliding window size 7, the GRU model gives the best results for
    almost all five currencies; for sliding window sizes 10 and 13, LSTM performs
    better in some cases, with GRU results being better for the rest. Thus, by overall
    performance, GRU outperforms LSTM and converges with greater accuracy and efficiency
    for windows 7.


