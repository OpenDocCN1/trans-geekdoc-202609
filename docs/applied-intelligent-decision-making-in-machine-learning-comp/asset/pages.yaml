  md: '# Decoding Common Machine Learning Methods


    # 2.3.8.3 Precision


    Precision is a metric that quantifies the number of cases correctly classified
    as positive out of the total cases classified as positive. It is the ratio of
    TP to the sum of TP and FP. The precision result is a value between the range
    0.0 and 1.0, where 0.0 represents no precision and 1.0 represents full or perfect
    precision.


    ```

    Precision = \frac{TP}{TP + FP} (2.20)

    ```


    # 2.3.8.4 Recall


    Recall is the proportion of cases correctly classified as positive in the class
    of interest. It is the ratio of TP to the total instances (TP and FN) of a class.
    It is a value between 0.0 and 1.0.


    ```

    Recall = \frac{TP}{TP + FN} (2.21)

    ```


    # 2.3.8.5 F-score


    F-score is the balance between the precision and recall and is determined using
    their harmonic mean. This measure is more reliable than accuracy to validate a
    model if the data has uneven class distribution. However, with even class distribution
    (balanced dataset), F-score is the same as the accuracy.


    ```

    F-score = 2 \times \frac{Precision \times Recall}{Precision + Recall} (2.22)

    ```


