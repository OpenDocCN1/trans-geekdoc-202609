    # 8.5 RESULTS AND DISCUSSION


    Based on the concept of precision and recall given in Equations 8.1 and 8.2, the
    matrix-based system generates approximately a 60% recall and a 30% precision for
    all concepts collectively (test, problem, treatment). The precision of the system
    is reduced because it uses the concept of parallel pattern matching between two
    matrices and generates many non-medical entities. To improve the precision of
    the system, some post-processing rules are introduced, after which precision is
    increased to 70% approximately. A comparison of precision before and after post-processing
    is given for Beth and Partners data in Figure 8.2. The performance of the system
    is measured for every concept (problem, test, and treatment) separately and compared
    with the Partners and Beth results (the precision of the Beth data is greater
    than the Partners data for the problem and treatment concepts, but for the test
    concept it is equal). It is found that the recall of the Partners dataset is higher
    than different methods, such as rule based [13], dictionary look-up [3], the chunker
    module of MetaMap 2010 [4], and MetaMap 2013 version [13]. The precision and recall
    of the proposed system is better than these methods (see Figures 8.4 and 8.5).


