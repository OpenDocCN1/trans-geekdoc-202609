    # 2.1 INTRODUCTION


    Machine learning (ML) applications are ubiquitous in the digital age. The ML methods
    are gaining attention due to their ability to solve complex problems and provide
    a decision support system from large volumes of data. Software packages are available
    for different ML methods in the form of various programming languages (e.g., Python,
    R, MATLAB). Sufficient online resources and publications are discussing the theoretical
    framework of ML methods and practical usage of the software modules in various
    platforms. However, to our knowledge, resources dealing with the concepts and
    mechanisms of the ML methods and the sequence of intermediate operations performed
    inside the algorithms with a working code are not available. The ML methods are
    usually presented as “blackbox” products providing no insight into the mechanism
    or allowing for modification to suit user needs. It will always be desirable to
    develop ML algorithms from fundamental principles, especially using open free
    software, to fit the fitting and analyzing requirements of the user. Therefore,
    it is proposed to focus on decoding the two common ML methods and developing working
    codes using open R software and demonstrate the applications.


    Among the fields that successfully employ ML methods, modern agriculture is one
    of the sectors that produces an enormous amount of data from different element
    components, such as yield monitors, soil and fertilizer equipment, soil moisture
    sensors, cameras, and global positioning systems (GPS). Another data domain is
    a variety of images from satellites, unmanned aerial vehicles, spectral camera
    (e.g., hyper, IR, R, NDVI), LiDAR point clouds, field mounted PhenoCams, as well
    as simple handheld digital cameras. However, as the source of these data varies
    greatly, their type and quality also vary accordingly. Furthermore, since agriculture
    deals with biological systems, there exists considerable variability, which presents
    a challenging scenario to be tackled through common/simple data analysis procedures.
    The ML methods are generally applied in analyzing such diverse data to make informed
    decisions in agriculture. Therefore, in this chapter we used two agricultural
    field application'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Decoding Common Machine Learning Methods


    datasets, such as soybean aphid identification and weed species classification,
    for the demonstration of decoded ML methods.


    Of several agricultural applications, the motivation for choosing these two datasets
    is due to the complexity of the problems. In the soybean aphid dataset, the other
    objects (exkeletons and leafposts) exhibit features similar to aphids; class classification
    is complex and requires the selection of suitable features (individual or a combination).
    In the weed dataset, the classification of weeds into grassy and clover-shaped
    species at the "just merged" stage is a difficult and tedious task, as both species
    display similar shape (to two merged leaves). The datasets used in this chapter
    were primarily in the form of images, which were processed using ImageJ (Rasband,
    2019; Schindelin et al., 2012), an open source and free image processing software,
    to extract features suitable for ML application.


    Even though ML classification using available packages is simple and plug-and-play
    methodology, it is vital to realize that it is a blind approach. The users supply
    input data to the model and receive output while oblivious of the process behind
    the packaged ML methods. In such packages, commonly referred as "black-boxes,"
    are built with the highest efficiency specific to their ecosystem, and when required
    it is not always possible to customize them to a different ecosystem. It is always
    desirable to decode and reconstruct the ML methods to overcome these limitations.


    The primary advantage of such user-coded models is that the user is fully aware
    of the mechanism, the mathematical principles behind the algorithm, and the models''
    limitations. The models when reconstructed in open source software will be cost-effective
    and have less constraint and complexity. Furthermore, user-coded models can be
    customized based on the data, could potentially improve the ML performance more
    than the black-box approaches, and provide knowledge and training to the users
    (e.g., students and researchers) as it developed from scratch.


    Given this background and requirement to develop decoded ML algorithms, the objectives
    of this chapter were: (i) decode two of the ML classification methods using open
    source software ImageJ (image processing and data extraction) and R (data handling
    and model development); (ii) employ the decoded algorithm for demonstrating classification
    using field data of agricultural applications, such as soybean aphid identification
    and weed species classification; and (iii) compare the performances of the decoded
    algorithm with the existing black-box approaches.


    # 2.2 LITERATURE REVIEW


    The superior power of ML algorithms is the ability to solve problems that were
    not possible to address by simpler mathematical approaches with explicit programming.
    The overall process of ML has three steps: (i) finding patterns from input data,
    (ii) building an ML model, and (iii) predicting the response using the ML model
    (Das et al., 2020). Recent applications are found in cutting-edge technologies
    from Netflix and Amazon recommendations (Gomez-Uribe and Hunt, 2017), fraud detection
    for financial institutions (Kültür and Çağlayan, 2017), driver cars, and autonomous
    vehicles (Choi and Chai, 2019); Ali Alhee and McDonald-Maier, 2018) to biomedical
    and healthcare fields (Das et al., 2020b);'
