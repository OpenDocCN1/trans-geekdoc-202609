    \ 18\n\n# ## 1.1 INTRODUCTION\n\nThere are two kinds of learning, based on how\
    \ the data is processed. In batch learning, the data is processed in chunks and\
    \ often offline. Another type of learning is called online learning, usually performed\
    \ on streaming data. Another name for online learning is incremental learning.\
    \ Our focus in this chapter will be incremental learning, on streaming data.\n\
    \nA data stream is characterized by certain properties according to Gama (2010):\n\
    \n+   - Unbounded size:\n  - Transient (lasts for only few seconds or minutes);\n\
    \  - Single-pass over data;\n  - Only summaries can be stored;\n  - Real-time\
    \ processing (in-memory).\n- Data streams are not static:\n  - Incremental/incremental\
    \ updates;\n  - Concept drifts.\n  - Temporal order may be important."
