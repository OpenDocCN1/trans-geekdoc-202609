  md: '# Data Stream Mining for Big Data


    ![](img/d1bf16e7dc1fe5d49ee33c2dfa5cdb06_13_0.png)


    ![](img/d1bf16e7dc1fe5d49ee33c2dfa5cdb06_13_1.png)


