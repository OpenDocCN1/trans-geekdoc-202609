  md: "# Applied Intelligent Decision Making in Machine Learning\n\nHence for each\
    \ $R$ the corresponding LFDG size is $1\times2$. For feature evaluation the character\
    \ image is normalized to $60 \times 60$. LFDG is evaluated for $R = \\{1, 2, \\\
    dots, 30\\}$ around its centroid, which makes the feature size to be $1 \times\
    \ 60$.\n\n# 3.2.5 GENERAL REGRESSION NEURAL NETWORK (GRNN)\n\nThe GRNN [45] was\
    \ developed by Specht in 1991 and the main advantage of network is that it needs\
    \ no training. For a given training set $(x_i, y_i)$, the estimation of unknown\
    \ dependent variable $y_{test}$ from independent variable $x_{test}$ is given\
    \ by:\n\n```\n$y_{test} = \\sum_{i=1}^{n} y_i \\exp\\left(-\\frac{D_i^2}{2\\sigma^2}\\\
    right) \\quad (3.8)$\n```\n\nwhere $\\sigma$ is the smoothing factor (here chosen\
    \ as $\\sqrt{2}$), $p$ is dimension $X$, $n$ is the size of the training set,\
    \ $D_i$ is the distance of $x_{test}$ to each respective $x_i$. Here Euclidean\
    \ distance is used for calculating $D_i$ and is expressed as:\n\n```\n$D_i^2 =\
    \ \\sum_{j=1}^{p} (x_{j,i} - x_{test,j})^2 \\quad (3.9)$\n```\n\nFigure 3.6 shows\
    \ the overall model of a GRNN network, which can handle the dynamical nature of\
    \ the previous stage prediction. When multi-labels are predicted, the prediction\
    \ is not always consistent, depending on the nature of the input. GRNN can compare\
    \ and predict the output label in a single pass with high accuracy. This is based\
    \ on the per-calculated samples from each class; hence it can handle noise. To\
    \ fix the sample size we performed $k$-means on each class with the **k** value\
    \ as 50. Fifty clustering centers are stored for each class to be used as the\
    \ pattern input to the GRNN model.\n\n![](img/d1bf16e7dc1fe5d49ee33c2dfa5cdb06_70_0.png)\n\
    \n**FIGURE 3.6** Block diagram for GRNN."
