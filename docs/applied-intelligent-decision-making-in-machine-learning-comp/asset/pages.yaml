    \ like\n\n```\nBITMAP = 0|0|0|1|1|1\n```\n\nso that we see the largest index $i=2$.\
    \ So $R=2$ and the unique integers $2^i/\\phi = 5$ approximately (the exact answer\
    \ is 5).\n\n**Exercise:** Try finding the unique numbers in $M = \\{5, 10, 15,\
    \ 20, ...\\}$ with any hash function. Extensions:loglog and Hyper log log algorithms\
    \ are an improvement over the classic FM algorithm. The interested reader may\
    \ consult Flajolet et al. (2007).\n\n# 1.4 SAMPLING FROM DATA STREAMS\n\nDue to\
    \ the unbounded nature of data streams and low memory, we need some efficient\
    \ ways to reduce the data footprint. In the literature, researchers usually use\
    \ the following techniques to reduce the data load.\n\n+   - Sampling.\n- Sliding\
    \ window.\n- Histogram.\n- Wavelets and Fourier transforms.\n\nWe have already\
    \ seen some examples of sliding windows and they find application in places places\
    \ such as DGIM method (Rajarajan and Ullman, 2011) for counting 1 in a bit and\
    \ so on. In this section, we are going to discuss a sampling method from data\
    \ streams.\n\nThere are many ways to sample from a data stream. For example we\
    \ can use random uniform sampling which is the simplest. However, doing random\
    \ uniform sampling in a data stream is not straightforward since all items in\
    \ the stream are not available at once. Hence, there is another algorithm called\
    \ reservoir sampling used to sample items from a data stream such that the probability\
    \ of selecting an item is $1/n$ where $n$ is the stream size.\n\nThe intuition\
    \ behind reservoir sampling is as follows. Imagine a swimming pool which can have\
    \ at most $k$ people in it any time. Swimmers are coming continuously and any\
    \ new swimmer only enters the pool after a previous swimmer has come out. But,\
    \ how do you decide which swimmer to let in? One solution could be to toss a coin\
    \ (biased) with probability $p=k/n$ where $n$ is the number of swimmers"
