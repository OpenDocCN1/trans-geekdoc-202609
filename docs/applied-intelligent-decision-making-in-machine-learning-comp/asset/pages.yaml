  md: 'Another significant performance parameter of the user-coded algorithms and
    black-box methods is the computation process time measured in the central processing
    unit (CPU) time in seconds, which was recorded using the R Sys function(). By
    appropriate placement of the system''s time function and after the code blocks
    to capture the start and end times, the CPU times of specific code blocks, by
    developing, training, or evaluating, the whole process can be evaluated. The computation
    time for KNN, an instance-based learner, was always less by an average of 42%
    than LDA for the user-coded algorithm since KNN has no training phase. However,
    this trend of reduced CPU time was observed only for user-coded algorithms, while
    for the black-box method the time for KNN was consistently higher than LDA with
    an average of 292% increase. Also, it can be observed that the CPU times of the
    user-coded algorithms were always lower by an average of 35% for LDA and 94% for
    KNN than the black-box method. This interesting result may be due to the direct
    approach by the user-coded methods compared to the overhead associated with the
    black-box methods. This improved performance of the user-coded methods will have
    an even greater impact with big datasets and supports the case for developing
    customized user-coded algorithms over the black-box approaches.


    # 2.5 CONCLUSIONS


    This chapter has successfully demonstrated the decoding and reconstructing of
    the common classification methods, such as LDA and KNN, from the underlying mathematics
    behind these algorithms, applied to two agricultural applications (soybeans and
    wheat species) using open source platforms like ImageJ and R through developed
    user-coded programs. The decoded ReliefF algorithm in each dataset (soybean, wheat
    species, iris—for comparison) selected the most influential features, along 13
    shape-based features, for developing the reconstructed classification algorithms.
    Features as roundness, solidity, and circularity for soybean species; diameter
    range, Feret aspect, and solidity for wheat species;sqcup length, petal length,
    and petal width for iris; emerged as the best based on weights.


    The prediction accuracy for classification user-coded and direct black-box approaches
    were comparable for both LDA and KNN models. The LDA was more accurate in classifying
    the soybean aphids (92%) and iris (≥98%), while KNN performed better for the better
    species (≥90%) dataset classes based on the normality distribution of the data.
    The averages (mean and weighted) of performance parameters, such as precision,
    recall, and F-scores, were ≥0.90, indicating the good performance of the user-coded
    models.


    The computation time for the KNN was less than the LDA method (by 42%) for the
    user-coded approach, but LDA was less than the KNN model (by 75%) while using
    the black-box approach. Overall, the computational time for user-coded algorithms
    was decreased by 35% and 94% for LDA and KNN, respectively, compared to the black-box,
    and this represents a significant impact on ML applications development, especially
    while handling large datasets.'
