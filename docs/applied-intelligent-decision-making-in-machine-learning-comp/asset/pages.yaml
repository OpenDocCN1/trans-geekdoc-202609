    # 5.4.1 CONFIGURATIONS


    To find similar papers that are close to a given query in the embedding space,
    we used the approximate nearest neighbors (https://github.com/spotify/annoy) search
    algorithm. This algorithm works by building a binary tree of points in higher
    dimension by choosing random hyper-planes that allow searching of nearby candidates
    in O(log n) time. To optimize various hyper-parameters, such as the size of hidden
    layers, learning rate, and regularization strength, we used the python library
    “hyperopt."


    We evaluated the accuracy of the DICN technique and the other existing techniques
