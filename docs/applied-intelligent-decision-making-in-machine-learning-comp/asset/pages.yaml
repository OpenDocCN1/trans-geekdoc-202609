    ```


    where $\lambda^{Title}$, $\lambda^{Abstract}$, and $\lambda^{Keywords}$ are scalar
    model parameters. The parameters of embedding model, that is, $\lambda^*$, $d^{dir*}$,
    and $d^{mag*}$, are learned using a training set $T < S_d, D^{cited}, D^{notcited}$
    where $S_d$ is a seed document, $D^{cited}$ is a document cited in $S_d$, and
