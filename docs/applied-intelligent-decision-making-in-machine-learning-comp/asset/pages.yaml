  md: "# Applied Intelligent Decision Making in Machine Learning\n\nThen, the number\
    \ of unique strings will be approximately $2^n$ (because $n$ bits, we can represent\
    \ $2^n$ integers). A worked example of the FM algorithm is as follows.\nAssume\
