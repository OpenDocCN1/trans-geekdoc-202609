  md: '166 Applied Intelligent Decision Making in Machine Learning


    neuro fuzzy and feature reduction model for data analysis. Using fuzzification,
    the input pattern classes are identified and the irrelevant data is removed by
    using feature reduction methods. An ANN model is used for classifying the filtered
    data. The performance of the model is tested against ten different datasets.


    # 8.3 METHODOLOGY


    # 8.3.1 DATASET


    The Informatics for Integrating Biology and the Bedside Center (i2b2) organized
    a challenge in 2010, which was focused on NLP for clinical data. The dataset included
    patients'' discharge summaries and clinical notes provided by three institutions:
    the Beth Medical Center, Partners HealthCare, and the Pittsburgh Medical Center.
    The organizers annotated manually 826 clinical notes, which provided gold-standard
    data for the challenge [8].


    For developing the new system for entity boundary detection, the task of concept
    extraction must be focused. In this, 426 annotated progress notes of Partners
    and Beth were used where 170 progress notes were used as a training set, and the
    remaining 256 notes were used as a test dataset to assess the performance of the
    systems with reference data.


    # 8.3.2 PROPOSED METHOD


    The proposed system uses the concept of multi-pattern matching based on a matrix
    model [26] for clinical data. Fundamentally, a matrix is a rectangular array of
    numbers, or expressions arranged in rows and columns. The system performs the
    parallel pattern matching between two matrices in which of the same size are added
    or subtracted, by element. Every element of a matrix is a user-assigned value
    corresponding to the POS tag of entity.


    This system is created in two matrices, one for gold-standard training data and
    another for test data. The framework of the proposed system (see Figure 8.1) is
    divided into a few components for medical concept extraction. The working of the
    components is described below.


    # 8.3.2.1 Text Pre-Processing


    I2b2 clinical notes contains various parts, such as discharge date, admission
    date, allergies, present illness history, medical history, social history, family
    history, physical examination, pertinent results, discharge medication, and discharge
    instructions. These clinical notes are in an unstructured and semi-structured
    form of text [27]. Every entry contains a little information associated with each
    patient and concerns special characters, colons, semicolons, punctuation, hyphens,
    and so on. For medical concept identification, each sentence of each section needs
    pre-processing. In this system, a natural language toolkit is used for text processing.
    For performing tokenization methods, like line tokenize or word tokenizer, are
    used, followed by a post-tag method for parts of speech tagging. Pre-processing
    is performed on gold-standard annotations and test annotations. In gold-standard'
