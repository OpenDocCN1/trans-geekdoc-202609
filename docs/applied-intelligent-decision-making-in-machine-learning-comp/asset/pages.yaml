    microarray datasets like Prostate, ALL/AML, Leukemia, ADAC Lung, and CNS. Performance
    evaluation of the proposed approach is tested with the KNN classifier. Later we
    compared the approach with basic BSLA, Basic PSO, DE, SFLA-PSO, wPSO, and SFLA,
    as shown in Tables 7.2, 7.4, 7.6, 7.8, and 7.10. Figures 7.2, 7.5, 7.7, 7.11 and
    7.14 present the output of three different classifiers (KNN, ANN, SVM) using the
    performance metrics of accuracy, sensitivity, and specificity. Figures 7.4, 7.7,
    7.10, 7.11, 7.13, and 7.16 present the error rate with different classifiers and
    different datasets.


