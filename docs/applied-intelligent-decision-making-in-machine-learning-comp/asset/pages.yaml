    approach (BSFLA-META) for dimensionality reduction of a microarray dataset. We
    propose a novel hybrid optimization method called Binary SFLA-PSO, which introduces
    PSO to BSFLA by combining the fast convergence speed of PSO and the global search
    strategy of Binary SFLA. Frog leaping in the Binary SFLA does not impose a limit
    length, which helps the frog to get out of the local optimum.'
