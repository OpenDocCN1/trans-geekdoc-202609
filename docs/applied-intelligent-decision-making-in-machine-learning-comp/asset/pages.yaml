  md: "# Applied Intelligent Decision Making in Machine Learning\n\nIt delays the\
    \ modeling of the training dataset unless it is needed to classify the incoming\
    \ test data instance. The method estimates the similarity between the features\
    \ in the test and training dataset. Lesser the similarity difference greater the\
    \ belongs to the same class. The similarity between the test data and every instance\
    \ in the training dataset is calculated using Euclidean distance, which is the\
    \ distance between the two points in a plane and can be calculated using the following\
    \ equation:\n\n```\nD = \\sqrt{\\sum_{i=1}^{n}(x_i - y_i)^2} (2.18)\n```\n\nD\
    \ is the Euclidean distance between the test and training data instances, n denotes\
    \ the number of feature attributes in the training dataset, $x_i$ is the training\
    \ data instance, and $y_i$ is the testing data.\n\nThe calculated Euclidean distance\
    \ value is sorted in ascending order, and \"k\" data points are selected from\
    \ the sorted results. The class of the \"k\" sorted points that hold the maximum\
    \ frequency is assigned as the class of the test data instance. The \"k\" value\
    \ plays a crucial role in determining the predictive capability of the KNN algorithm.\
    \ A rule-of-thumb approach for fixing the \"k\" value is by estimating the square\
    \ root of the total training data observations. It is important to note that the\
    \ predictive performance of the KNN model also depends on the scale of the features.\
    \ Feature scaling procedures such as normalization or standardization should be\
    \ performed before the KNN algorithm for features existing at different scales\
    \ (units); this step, however, can be disregarded if the features already have\
    \ the same units. The pseudocode decoding the KNN algorithm is presented (Algorithm\
    \ 2.3).\n\nAlgorithm 2.3 The pseudocode of the knn algorithm\n1: procedure KNN(training\
    \ dataset, test data instance) $\triangleright$ from the test dataset\n2: let\
    \ $\\tilde{x}_i$ = test data instance\n3: for (i = 1 to do) $\triangleright$ i\
    \ - number of observations in testing dataset\n4: for (n = 1 to n) $\triangleright$\
    \ n - number of observations in training dataset\n5: find Euclidean dist. between\
    \ test and train instances $\triangleright$ using Eq. (1.18)\n6: for every data\
    \ instance 'n' in training dataset\n7: end for\n8: sort the Euclidean distances\
    \ in ascending order\n9: select k $\triangleright$ thumb rule: $k = \\sqrt{n}$\n\
    10: pick the k lowest (nearest neighbor) $\triangleright$ data points\n11: find\
    \ respective classes of the k closest data points\n12: class of $\\tilde{x}_i$\
    \ = maximum occurring class for k closest data points\n13: end for\n14: end procedure\n\
    \nThe user-coded algorithm in R demonstrates the working of the KNN method for\
