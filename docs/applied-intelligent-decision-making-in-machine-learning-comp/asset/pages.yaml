    rely on to summarize the data stream in some way. The Following are the techniques
    often employed to handle data streams.


    +   1. **Approximate query processing (AQP)** is described as the following rules
    (Chaudhuri et al., 2017): (a) a query language should be generic enough to retrieve
    all the relevant information, (b) should have a low error rate and high accuracy,
    (c) the work should be saved at runtime, and (d) extra resources should be made
    for pre-computation. These dimensions of an AQP scheme are not independent and
    much of the previous literature makes specific choices along the four dimensions.
    AQP can be broadly classified into two main categories: (a) online aggregation,
    which is a sampling in an online manner with samples to answer queries, and (b)
    offline synopses generation, which is based on some statistics of the data and
    then answers queries (Li and Li, 2018).


    **2. Sliding window query processing** is a model of handling a data stream with
    the assumption that recent items are more important than the older ones. There
    are two types of sliding window based on how they are defined.


    +   * **Sequence-based sliding window** is defined by the number of observations
    that determine the window size. These are further divided into *landmark sliding
    window* and *moving sliding window*, as shown in Figure 1.2 (left).


    +   *Timestamp-based sliding window**: In this case, the sliding window is determined
    on the number of observations made in a given time interval and window-width is
    determined based on the time. They are further categorized into *natural-titled
    time window* and *logarithmic time window*, as shown in Figure 1.2 (right).


    As we see, some algorithms based on the sliding window guarantee an error rate
    of approximation to any desired accuracy $\epsilon$. One of the most'
