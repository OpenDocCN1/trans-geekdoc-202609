- pgno: 174
  md: '# Applied Intelligent Decision Making in Machine Learning


    The Center of Biomedical Computing, named i2b2 (Informatics for Integrating Biology
    and Others), organized different challenges in natural-language processing (NLP)
    for extracting useful knowledge from clinical texts. One of the challenges was
    organized in 2010, in which task focused on extracting clinical concepts such
    as problems, tests, and treatments from clinical records [1]. Medical concept
    detection is also called entity recognition. A named entity recognition is an
    essential part of clinical NLP, because it is a crucial step for extracting knowledge
    from semi-structured or unstructured texts. Named entity recognition has two phases:
    boundary detection and entity classification. Previously, many systems have been
    developed for recognizing clinical entities using a machine learning approach
    [1], a rule-based approach [2], a dictionary look-up method [3], and a hybrid
    method [4]. Entity boundary detection is a type of sequence labeling problem,
    resolved by a BIO model, where B refers to “beginning,” I to “inside,” and O to
    “outside.” Other models like IOBW and IOBEW, where E refers to “end” and W refers
    to “single word” [5]. Some others are available but not precisely. MetaMap is
    an information tool for medical texts which also uses the chunking method, but
    its precision and recall are both worse.


    A single word is easy to find and classify, but boundary detection of the sequence
    of entities is a vital issue in clinical text processing. For example, “oxycodone-acetaminophen,”
    “saphhenous graft → descending artery,” and “a dual chamber rate responsive pacemaker.”
    The work of solving the problem boundary identification of clinical concepts is
    explored. The proposed system uses Part of Speech (POS) as a feature for training
    the model. The system is based on a matrix model and performs multi-pattern matching.
    The matched patterns are converted to their corresponding words and mapped with
    a unified language system (UMLS) for entity classification. The rest of this chapter
    is organized as follows. Section 8.2 illustrates the background of clinical named-entity
    recognition, Section 8.3 describes the proposed method and dataset, Section 8.4
    presents the experimental results and a discussion, and Section 8.6 concludes
    and indicates some new directions for further research.


    # 8.2 BACKGROUND


    Many NLP challenges have organized and focused on medical concept extraction tasks
    such as the i2b2 2010 challenge for clinical notes [8] and the ShARE/CLEF Shared
    Task [9], the shared task of BioNLP/NLPBA 2004 with the GENIA corpus dataset for
    identifying biomedical entities, [10], and the BioCreatIVEVE challenge [11] for
    recognizing biological concepts like generic identification [12].


    In previous works of clinical entity identification, different methods have been
    used such as the dictionary look-up method, rules-based and machine learning.
    The dictionary look-up method used in [3], in which the authors identified clinical
    entities using dictionaries compiled from the corpus, performed experimentation
    on i2b2 2010 dataset and obtained the average F score of 48% for the Beth dataset
    and'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# Extraction of Medical Entities Using a Matrix-Based Pattern-Matching Method


    50% for the Patients dataset. The rule-based method is also used in [13, 14],
    in which some rules are created on corpus words and word occurrences, and words
    are then found in the corpus and mapped to a corresponding category and provided
    a 42% F score. Machine-learning-based approaches like SVM (support vector machine)
    and CRF (conditional random field) have been used for entity boundary identification
    and entity classification [1, 15], which is based on the beginning, inner, and
    outside (BOI) model for sequence labeling. An unsupervised approach has also been
    used to extract entities from biomedical texts [16], in which others have developed
    a noun phrase chunker followed by a filter based on inverse document frequency.
    The classification of multiword entities is carried out by using the context of
    distributional semantics.


    A number of systems have been developed for medical entity recognition, such as
    MetaMap, which is used for concept extraction [17]. It uses UMLS for medical-term
    identification [18], but its results are worse than other approaches. MetaMap
    2013v2 gave a 40% F score and MetaMap 2010 [6] gave a 21.8% F score; various reasons
    [7] gave an average 15.5% F score. Other systems have used entity boundary identification,
    like Pereine (F 46.8%), OpenNLP chunker (F 70.0%), and StanfordFer (F 76.8%) [6].
    A of previous work has been identified for boundary detection of medical data.
    In [5, 19], the authors used OpenNLP chunker for name entity recognition (NER)
    with IO, IOBW models, and for getting correct boundaries, post-processing is performed
    with boundary adjustments. In [7], the authors compared methods like MetaMapPlus,
    a rule-based method, and obtained an F score of 52.28%; the CRF method, with an
    F score of 45.33%; and an SVM method, with an F score of 76.17%.


    For pre-processing, several NLP tools were used, like Lingpee, Tree Tagger, OpenNLP,
    c-TAKES, Stanford parser [20], splitta, SPECIALIST, and Stanford CoreNLP. Evaluation
    of boundary detection of these tools is carried out in [21], where the authors
    discussed and identified different errors, such as the detection of splitters
    like semicolons and colons, these errors were worse from their context. As per
    their evaluation, except for c-TAKES, other tools performed on clinical notes
    than on general domain text.


    Das et al. [22] proposed a neuro-fuzzy method with post-feature reduction to anomaly.
    In this paper, to identify issues from patterns, a class-belongness fuzzification
    method is used. As the result of fuzzification, input patterns handle this, post-feature
    reduction is used which eliminates all the irrelevant data from the input set.
    Das et al. [23] proposed a framework for the classification of medical devices.
    Dealing with the uncertainty of a linguistic neuro-fuzzy with feature extraction
    (LNF-FE) model is presented here. Where linguistic fuzzification is used for finding
    the membership value and, from that, the relevant data are retrieved using feature
    extraction. Finally, the reduced features are classified using an artificial neural
    network (ANN). Das et al. [24] used a particle swarm optimization (PSO) model
    for building a multilayer perceptron which is used for classification. The method
    is capable of solving linear and non-linear problems. The back propagation algorithm
    is used for training the network. The performance of the proposed model is compared
    with multilayer perceptron (MLP) and genetic algorithm (GA-ML) also. Das et al.
    [25] used a hybrid'
