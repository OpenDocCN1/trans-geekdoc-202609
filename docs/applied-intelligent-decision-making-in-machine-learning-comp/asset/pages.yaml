    relevant data from the dataset, while editing refers to modifying the data into
    a desirable and accurate format. Data cleaning was performed in R using conventional
    techniques, functions, and commands.


    The common steps followed checking missing values, replacing or dropping missing
    values, and modifying the variable type. In our datasets, the presence of missing
    values were checked using the is.na() and is.nan() functions. There were no missing
