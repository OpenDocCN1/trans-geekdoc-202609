    To handle this problem, min-normalization is used to scale the data in the range
    of 0.0–1.0. This helps to maintain the uniformity of the overall dataset, otherwise
    it would be much more difficult to visualize or represent all of the data practically
    and the models would not perform well comparatively. We selected the most significant
    features by considering that the set may contain some features that may have become
    redundant in nature and, in turn, reduce the efficiency of the model used. Before
    applying the classification algorithms to the raw data, we selected the optimal
    features that have the maximum relevance or correlation with the prediction variable.
    In datasets, usually collecting the data, more than one doctor performs tests
    and collects the results. There may be a chance of redundant testers or similar
    kinds of tests by two or more doctors. These features are added to the feature
    space of the original dataset and hence the underlying distribution of the data
    becomes distorted. So, to improve the distribution, by reducing the features and
    choosing the feature set that is the fittest among all the features in the original
    dataset, we developed FS techniques using several optimization techniques. These
    were experimented with and evaluated to further improve the accuracy of the model.
    The whole dataset was cross-validated with a ten-fold process. Many times, due
    to the non-uniform distribution of the data points, the accuracy varied a lot.
    For evaluation of the final accuracy, if we iterate over several accuracies and
    find the mean of them, then a much better and accurate result can be obtained
    and hence the issue handled After applying the classification algorithms, we evaluated
    the accuracy in each model for all the datasets and concluded that our proposed
    FSTLBO model performed better than existing models.


    In this experiment, we used a computer with an intel i5 processor with 8 GB of
    memory. Matlab 2015a was used to implement all the FS and classification models.
    Experiment considered the random binary populations of size 10 and the number
    of iteration was 100. The higher the values of these two parameters, the higher
    the performance; but, execution time was high. The accuracy obtained for seven
    datasets with the four models FSGA, FSDE, FSPSO, and FSTLBO are given in Table
    11.1. The highest accuracy and optimum features are presented in bold type for
    seven datasets of the four models. These FS models used KNN as the classification
    algorithm to evaluate the performance with the k value as 5. The result reveals
    that the proposed FSTLBO model is superior in accuracy and in the minimal number
    of selected features as compared to existing models. The error plot of all the
    datasets are shown in Figure 11.2. The plots clearly indicate that the error of
    the FSTLBO model is less compared to the other existing models of FSGA, FSDE,
    and FSPSO.'
