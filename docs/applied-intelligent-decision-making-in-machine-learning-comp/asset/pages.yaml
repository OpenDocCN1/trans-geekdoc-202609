    # 2.3.4 DATA CLEANING


    Cleaning the dataset is essential since robust ML methods outperform while processing
    the improper and unclean data. On average, about 60% of the time in ML is spent
    on cleaning and unifying the obtained data (Chu et al., 2016). Cleaning the data
    usually refers to filtering and editing the data to make it easier to explore,
    understand, and model. Data filtering is removing unnecessary, unwanted, and'
