- pgno: 189
  md: '# Supporting Environmental Decision Making


    # 9.2.2.2 Random Forest


    Random forest (RF) is an ML algorithm that combines several DT models to effectively
    classify or predict an outcome (Breiman, 2001; Das, Naik, & Behera, 2020a, 2020b).
    This combination process, also termed “bootstrap aggregation” or “bagging”, involves
    training each DT with a distinct set of observations through sample replacement.
    Samples which do not end up in a subset of training data bagging are included
    with other subsets called “out-of-bag” (Rodriguez-Galianiano et al., 2015). Bagging
    minimizes the variance of the base learner; however, on each node, there is a
    random selection of variables out of all possible variables, the best split among
    the selected variables is determined, based on the lowest MSE. The final prediction
    is derived using an ensemble technique, which averages the predictions of the
    previous regression trees (Das et al., 2020). Due to the averaging of several
    trees, there is a considerably lower risk of overfitting (Breiman, 2001). The
    random sampling of observations and random subsets of candidate variables for
    splitting nodes is a clear distinguishing factor of RF from.


    # 9.2.2.3 Extreme Gradient Boosting


    Extreme gradient boosting (XGBoost) is a scalable end-to-end tree-boosting algorithm
    (Chen & Guestin, 2016). It can be applied to regression, ranking, and classification
    problems. This algorithm performs parallel tree learning with a novel sparsity-aware
    system XGBoost employs the second-order Taylor expansion to approximate the loss
    function. This model has known to outperform other ML models, and its success
    can be witnessed in numerous ML and data-driven competitions such as Kaggle (Dey
    et al., 2019; Root et al., 2020). The fundamental factor behind the triumphs of
    XGBoost is its scalability in all circumstances optimal amount of resources, the
    algorithm yields state-of-the-art results when solving a wide range of problems.
    The implementation of this model is thus, influenced by its speed and performance.


    # 9.2.2.4 Support Vector Regression


    A support vector regression (SVR) is a type of support vector machine used for
    regression purposes and handles continuous values (Das et al., 2020; Dey et al.,
    2019). It follows the same principles as support vector classification, though
    with minimal modifications. The most important factor between a simple linear
    regression model and SVR is that the former attempts to reduce the error rate
    while fitting the designated threshold. This kernel-based model has advantages
    in high dimensional spaces since its optimization does not rely on the dimensionality
    of the input area (Das et al., 2018; Drucker, Burges, Kaufman, Smola, & Wapnik,
    1997). Moreover, SVR is a non-parametric tool and does not rely on distributions
    of the primary input and output variables. Although less popular than support
    vector classification (SVC), SVR has proven to be an effective technique in solving
    real-world scale problems (Awad & Khanna, 2015).'
