    # 11.6 CONCLUSION


    The main objective behind this research was to reduce the redundancy in features
    so that the feature space is reduced from that of the size of the original dataset.
    To resolve this issue, several FS techniques were used, which took off only a
    subset of the overall feature space according to its significance and compute
    the minimal subset of features that provide a higher classification accuracy.
    We incorporated the idea of FS along with several optimization techniques for
    optimal FS. This further improves the accuracy while reducing the feature space,
    by using an optimal selection of the subset features. Mainly, we focused on the
    TLBO algorithm for optimal FS along with the KNN classification algorithm. Among
    all the models, the FSTLBO provides a better result, in terms of the optimal number
    of selection of features and accuracy as compared to other models. In the future,
    a multi-objective TLBO FS could be designed with several other datasets and the
    result compared with some other existing FS models. Moreover, some other classification
    algorithms could be applied in the classification phase to test the efficiency
    of the FS models.'
