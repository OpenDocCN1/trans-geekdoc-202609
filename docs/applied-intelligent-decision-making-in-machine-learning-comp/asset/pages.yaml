- pgno: 154
  md: '144 Applied Intelligent Decision Making in Machine Learning


    # 7.5.3 DETAILS OF CLASSIFIERS USED IN THIS EXPERIMENTAL STUDY AND EVALUATION
    METRICS


    In this experimental study, we used three different classifiers—SVM, ANN, and
    K-nearest neighbors to identify the feature data subsets. The performance evaluation
    of the different classifiers are compared in terms of the following criteria:


    +   - True positive (True-pos);

    - False-positive (Fal-pos);

    - True negative (True-neg);

    - False-negative (Fal-neg).


    From these criteria we calculated the different performance evaluations of accuracy,
    sensitivity, and specificity.


    ```

    Accuracy = \left[ \frac{True - pos + True - neg}{Total no of sample} \right] *100

    ```


    ```

    Sensitivity = \left[ \frac{True - pos}{True - pos + False - neg} \right] *100

    ```


    ```

    Specificity = \left[ \frac{True - neg}{True - neg + False - neg} \right] *100

    ```


