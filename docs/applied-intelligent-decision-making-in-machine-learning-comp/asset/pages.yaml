    # 5.1 INTRODUCTION


    Information Technology (IT) has laid a strong foundation and has achieved greater
    heights in terms of electronic literature, leading to vast amounts of data (Zhao,
    Wu, and Liu 2016), which in turn leads to overload problems (Draschler, Hummel,
    and Kopp 2008). With the enormous amount of data and growing competition in the
    research environment, scientific web archives have become more and more significant
    to different users (Meschennomer, Meuschke, Hotz, and Gipp 2016). But, by the
    enormous amount of data in scientific web archives, searching for a most relevant
    article has become challenging and time-consuming, despite significant advances
    in digital libraries and information retrieval systems.'
