    # 11.2 RELATED WORK


    In this section, we discuss FS techniques based on several optimization algorithms.
    FS was among the foremost techniques of researchers for many decades. A survey
    was conducted by Dash and Liu on several FS techniques [30] and their procedures.
    One of the recent studies by Xue et al. [31] considers the broad evaluation of
    FS problems, when done based on several evolutionary techniques, analyzing each
    performance with their individual objectives. The different advantages and challenges
    of various FS algorithms are also addressed. It has been stated that by eliminating
    the features the accuracy of the classification or regression model can be much
    improved. This addresses various algorithms that have been used to solve problems
    on FS. Yang and Honavar [32] proposed an algorithm that was based on the combination
    of a genetic and a neural network model for obtaining a suitable subset of features
    for classification. The tests were evaluated on several benchmark datasets to
    display the progress of the results obtained from the model using all features.
    Inza et al. [33] gave a detailed description of FS problems via estimation of
    a Bayesian network algorithm. When there is limited data about the domain, a randomized
    or evolutionary search algorithm can be applied, which has been done from the
    distribution algorithms. The Naive Bayes and ID3 algorithms have been used influence
    over the experiment; however, it minimizes the CPU execution time. Huang and Wang
    [34] proposed a model on a genetic algorithm, optimized the process of FS, and
    tuned the SVM parameters. They made a comparison of their model with the greedy
    algorithms that are most used for parameter searching. Experiments have been done
    using 11 known real-world datasets to present the approach effect on the accuracy
    of the classification model positively. Cervante et al. [35] produced a combination
    of PSO with two information metrics, entropy and mutual information. In classification
    problems, they applied decision trees


    # 11.3 BASIC TECHNOLOGY


    There are different FS techniques, such as filter, wrapper, and embedded methods.
    We are mostly concerned to discuss the wrapper methods. The FS model in the wrapper
    class is mainly based on the ML algorithms that are to be trained. It evaluates
    all possible combinations of features against the evaluation criterion. In the
    background,'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Applied Intelligent Decision Making in Machine Learning


    it basically follows a greedy algorithm. The evaluation criterion mentioned earlier
    is fitness, but the performance measure depends on the type of problem it is dealing
    with. Some of the regression criteria are p-values, R-squared, and adjusted R-squared.
    Some of the classification evaluation criteria are accuracy, precision, recall,
    and F1 score. Finally, the most appropriate combination will be selected for the
    useful features. This combination of features gives the optimal results for the
    ML algorithm it has been applied.


    Some of the techniques under wrapper methods that are most commonly used are (1)
    forward selection, (2) backward selection, and (3) bi-directional elimination
    (stepwise selection). We emphasize the above-mentioned techniques under wrapper
    methods. Basically, forward selection begins with an intercept. The testing of
    the various variables is for checking relevance. The "best" variable, where "best"
    is determined by some predefined criteria, is added to the model. We continue
    the process, adding variables by one and testing at each step while the model
    continues to improve. Once the model stops improving we stop any further variables.
    The criteria on which we determine whether to consider a variable or not varies.
    It by finding the lowest score in cross-validation, the lowest p-value, or any
    other tests of accuracy. Unlike forward selection, backward selection begins with
    a least squares model that contains all predictors, and then, in an iterative
    method removes the least predictor, one by one. Backward selection is done in
    problems where we have more observations than the number of variables. If the
    opposite situation arises then we won''t be able to fit a least squares model,
    but it has the possibility of detecting a selected variable at each and every
    stage, as in backward elimination, whenever correlation is found between the variables.
    It is mostly used in which we choose some selective subset defined as a process
    in choosing some features from the whole feature space. There are many diverse
    concepts on FS approaches in the literature. Some mainly deal with the size of
    the selected data, while other concepts are about improving prediction accuracy.
    Essentially FS constructs a dataset which effectively represents the original
    data. The main objective is to just find the minimum number of features, maintaining
    a higher accuracy in the classification process. Our research surrounds the discussed
    area and we have mainly dealt with overcoming the challenges faced for choosing
    the most suitable subset of features among the whole feature space.


    # 11.4 PROPOSED MODEL


    In this section, the working method of the FSTLO approach is presented with a
    detailed explanation. In this approach, the algorithm starts by random initial
    population generation (both for the teacher and students). The population is the
    set of binary solutions, which helps to select or reject the features, based on
    the value 1 or 0. Here, we have inculcated this teaching-learning-based optimization
    technique along the concept of a wrapper FS technique. The underlying concept
    in wrapper-based feature-subset selection is that it randomly selects a set of
    features among all'
