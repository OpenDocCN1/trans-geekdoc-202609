    # 2.3.2.1 Iris Dataset


    The iris is a multivariate dataset that is well-known in data analysis which was
    introduced by Fisher (1936) to demonstrate the LDA. As iris datasets have been
    widely used, even in recent literature, for presenting and testing classification
    methods (Kamaralaz and Abdullah, 2019; Singh and Srivastava, 2019; Bai et al.,
    2019), this study also employed such a dataset to evaluate the performance of
    the decoded LDA and KNN algorithms. The iris dataset comprises 150 observations
    from three iris flower species (setosa, versicolor, and virginica). Each data
    point consists of four features (units cm), such as sepal length, sepal width,
    petal length, and petal width. The dataset is preinstalled in R software command,
    which can be imported using the data(iris) command.


    # 2.3.2.2 Soybean Aphid Dataset


    The soybean aphid dataset was obtained from digital images of aphid infected soybean
    leaves from a greenhouse experiment (Sunoj et al., 2017). The color digital images
    were acquired using a single-lens reflex camera (Canon EOS Rebel T2). Identifying
    aphids on the soybean leaf is challenging due to the presence of other objects
    such as exoskeletons and leaf spots. All objects exhibit only a subtle difference
    in color, but a clear difference in shape (Figure 2.2A). Therefore, the images
    were processed to extract features of individual objects using ImageJ. The sequence
    of image preprocessing steps involved in shape-feature extraction is presented
    in Figure 2.2.


    The acquired color digital image (Figure 2.2A) was denoise by applying a median
    filter of two-pixel radius (Figure 2.2B). The filtered image was converted into
    a grayscale image to facilitate the thresholding process (Figure 2.2C). Image
    objects 17 optimized thresholding schemes of which Yen (Yen et al., 1995) was
    suitable as it appropriately selected the necessary portions (Figure 2.2D). Applying
    the thresholded scheme produced the binary image (Figure 2.2E). The artifacts
    and rough boundary in the binary image were removed by applying the “Open” morphological
    operation (Figure 2.2F). It is essential to segment the overlapping objects into
    individual objects before feature extraction. The watershed segmentation by ImageJ
    resulted in segmentation; therefore, the overlapping objects were manually segmented
    by a one-pixel-thick line using Image’s “paintbrush tool” (Figure 2.2G). The segmented
    objects were subjected to ImageJ’s “Analyze Particles” to derive various features
    (Section 2.3.3) used in the analysis.


    # 2.3.2.3 Weed Seeds Dataset


    The weed seeds was obtained from digital images acquired in a greenhouse for identifying
    the potential weed seeds grown in the fields. The weeds were grown in soil samples
    that naturally had seeds, which were transferred to the greenhouse in plastic
    trays from organic field experiment plots, and imaged right after emergence. Visually
    categorizing and the weed species at an early stage from multiple'
