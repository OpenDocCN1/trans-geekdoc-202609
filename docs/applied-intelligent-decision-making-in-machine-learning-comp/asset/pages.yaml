    # 9.3.5 Performance Evaluation of Model


    We compared the amount of variance that each validated model explained (Figure
    9.9). The DT model explained almost 100% of the observed variance, putting its
    R² at 99.71%, and having its data points almost perfectly fitted on the regression
    line. The RF model followed closely with 99.14. The XGBoost model also accounted
    for 98.88% of the observed variance around its mean. The SVR model had the lowest
    R² in this study, its ability to explain 97.42% of the observed variance less
    than 3% of the variance accounted for the model.


    In terms of accuracy, the tree-based models had the lowest MAPE and RMSE, as shown
    in Table 9.2. In all, the DT model produced the most accurate predictions. On
    the other hand, the kernel-based model, RBF-SVR, had comparatively higher errors.
    This could be observed in Figure 9.8 as the SVR model only passed through/near
    a few of the test data points. The DT and SVR models were more computationally
    efficient than the other two models. Overall, the DT model ranked top in all spheres
    of performance assessment in this study.'
