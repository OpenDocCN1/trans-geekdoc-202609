    # 9.4 CONCLUDING REMARKS


    The development of a robust, high-quality, and accurate model for forecasting
    carbon emissions is a prerequisite for providing insights into environmental policies
    for achieving the Paris Agreement on climate change. Research comparing the forecasting
    ability of different ML algorithms, by focusing on carbon emissions and more specifically
    on Australia''s carbon emissions, warrants further research. This research has
    applied many ML techniques, such as DT, RF, XGBoost, and SVR, to model Australia''s
    carbon emissions. The findings indicate that the DT has a high coefficient of
    determination (R²) of 99.71%, followed by the RF with an R² of 99.14%, XGBoost
    with an R² of 98.88%, and SVR with an R² of 97.42%. Overall, the tree-based models
    had the lowest MAPE and RMSE. Overall, the DT model produced the most accurate
    predictions. In the other'
