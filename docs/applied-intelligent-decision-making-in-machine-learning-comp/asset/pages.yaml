  md: '# Algorithm 6.1: Weighted Ensemble Graph Clustering Algorithm


    +   1: Input: K*, METIS, Base clustering Partition C

    2: Output: C* which is the final Ensemble Cluster

    3: Begin

    4: Transfer C cluster partitions into binary vectors using Equation 6.1.

    5: Using the one shot weight assignment as given in Equation 6.2, the objects
    are assigned weights.

    6: Compute the cluster weight between pair of clusters using Equation 6.6.

    7: Construct a meta-graph G = (V, E), in which the Equation 6.6 is used to compute
    the weights associated with the edges.

    8: *MetaClusters* = METIS(G, k*) [The meta-graph is partitioned into k* meta-clusters]

    9: C* = Assign(metaClusters) [Every object is assigned to the meta-cluster in
    which its participation is the strongest]

    10: Return C*

    11: End


    # 6.5 EXPERIMENTAL RESULTS


    Performance of the clustering techniques must be quantified after the process
    of clustering is completed. This can be done using certain metrics that characterize
    an ideal cluster on the basis of maximal distance between clusters and minimal
    distance within the clusters. These metrics are of two types:


    +   * Extrinsic measures such as V-measure, completeness, homogeneity, Fowlkes
    Mallows scores, mutual information based scores, and an adjusted Rand index that
    requires ground truth labels to evaluate clustering performance.

    * Intrinsic measures such as the Davies-Bouldin-Harabaz Index, and the Silhouette
    Coefficient. These do not require ground truth labels and instead evaluate clustering
    performance based on the original data and the results of the clustering.


    # 6.5.1 SILHOUETTE COEFFICIENT


    The model with generated results is used for evaluation when the ground truth
    is not known. One type of such an evaluation is the Silhouette Coefficient. It
    is defined for each sample, and a model with better defined clusters is represented
    by a higher Silhouette coefficient score. The Silhouette Coefficient consists
    of two:


    +   * Average distance between a sample and the other points within the same class.

    * Average distance between a sample and the other points in the next nearest cluster.'
