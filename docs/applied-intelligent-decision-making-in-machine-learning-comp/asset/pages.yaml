    \ developed and based on the basic Relief algorithm, produced different weights\
    \ (Figure 2.4).\n\n# 2.3.6 DATA SPLITTING\n\nThe success of building computationally\
    \ sound ML models with high prediction accuracy is based on its ability to generalize\
    \ and be applied to different scenarios."
