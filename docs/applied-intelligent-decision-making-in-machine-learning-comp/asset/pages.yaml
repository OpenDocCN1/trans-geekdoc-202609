    # 7.1 INTRODUCTION


    In biomedical experiments, researchers have to deal with large-scale databases
    in which the course of dimensionality is a serious concern. We are dealing with
    microarray datasets during the experimental stage in which millions of genes are
    monitored. Different tools are adopted by many researchers; however, microarray
    technology is the one that is preferred for genome expression monitoring purposes.
    From a literature survey it is clearly indicated that the microarray classification
    technique makes a noteworthy job of identifying cancer [1–4]. In microarray datasets
    the sample size is very small to which contains high dimension data, so it is
    very hard to deal with different existing methodologies which are implemented
    to obtain a test result, but which is not to the mark. So we need reliable mining
    approaches to identify the redundant features in raw databases. For this, feature
    selection is needed at the preprocessing stage. We can identify the optimal set
    of features that can be extracted by feature selection techniques. Two basic techniques
    such as filter and wrapper are primarily used. In the case of the filter approach,
    the selection of features is done according to different constraints, as the behavior
    of the feature or the content of the feature which is based on the intrinsic characteristics
    of the training set, and as in a wrapper, it uses the performance of a classifier.
    As it uses the target, the feature selection algorithm provides better performance
    but it is computationally expensive. Various kinds of wrapper approaches are used
    by many researchers, such as Tabu Search (TS), Harmony Search (HS) [8], Differential
    Evolution (DE) [6], Particle Swarm Optimization (PSO) [7], Genetic Algorithm (GA)
    [5], Artificial Bee Optimization (ABC) [9], and Ant Colony Optimization (ACO)
    [10].


    In this research, we have a binary shuffled frog-leaping algorithm with a meta-heuristic
    approach for feature selection for a high dimension microarray dataset. In the
    first stage (preprocessing stage) we extracted the top 250 genes from the original
    data and extracted the relevant gene subsets identified by binary shuffled frog-leaping
    algorithms with a meta-heuristic approach (PSO). Twenty-five subsets of genes
    were extracted within the range of 10-250 with 10 in each interval. The K-nearest
    neighbors (KNN) classifier was used to evaluate the classification accuracy, which
    was further checked as follows.


    The remainder of this paper is organized as follows. Section 7.2 provides a literature
    survey of the different feature selection methods with a meta-heuristic approach.
    Section 7.3 describes the proposed approach using binary shuffled frog-leaping
    algorithms with a meta-heuristic approach for feature selection. Section 7.4 presents
    the detailed experimental setup along with a simulating environment and result
    analysis of the proposed models. Section 7.5 presents the detailed experimental
    setup. Section 7.6 concludes the work with future research steps.


