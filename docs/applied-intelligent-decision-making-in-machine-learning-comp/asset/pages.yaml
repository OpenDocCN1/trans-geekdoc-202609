- pgno: 248
  md: '# 238 Applied Intelligent Decision Making in Machine Learning


    A lower value of MSE indicates low error, that is, the lower value of MSE, the
    better is the quality of image.


    A measure of the peak error is represented by PSNR, which can be described as
    the reciprocal of MSE. Mathematically, it can be represented as:


    ```

    PSNR = 10 \times \log_{10} \frac{(2^B-1)^2}{MSE} \quad (12.14)

    ```


    $B$ denotes the bits per sample ranging between 0 to 255. The unit of PSNR is
    the decibel (dB). The method is considered good if it generates low MSE and high
    PSNR values.


    # 12.6.2 ENTROPY


    The entropy of an image identifies its texture and the randomness of the image
    as well. Low entropy specifies that the region is homogeneous, a hazy image has
    lower entropy values compared to a haze image. Mathematically, it can be estimated
    as:


    ```

    $H = -sum p_i \log_2 p_i \quad (12.15)

    ```


    where $p_i$ indicates the probability of occurrence of one gray level intensity.


    # 12.6.3 STRUCTURAL SIMILARITY INDEX


    This index helps in measuring image degradation caused by various processing.
    Its calculation requires a reference image. Mathematically,


    ```

    $SSIM(x,y) = \frac{(2\mu_x\mu_y + c_1)(2\sigma_{xy} + c_2)}{\mu_x^2 + \mu_y^2
    + c_1(\sigma_x^2 + \sigma_y^2 + c_2)} \quad (12.16)

    ```


    $\mu_x$ and $\mu_y$ are the mean of $x$ and $y$ respectively, $\sigma_x^2$ and
    $\sigma_y^2$ are the variance of $x$ and $y$ respectively, and $\sigma_{xy}$ is
    the co-variance of $x$, $c_1$ and $c_2$ are the variables used for stabilizing
    the deviation.


    # 12.6.4 CONTRAST GAIN


    Contrast gain is the mean difference between the contrast of the enhanced image
    and the original image (hazy image) [6]. It can be calculated by:


    ```

    $C_{gain} = C_j - C_i \quad (12.17)

    ```


    where $C_j$ is the mean contrast of the output enhanced image and $C_i$ is the
    contrast of the original hazy image.'
