- pgno: 257
  md: '# Enhanced Image Deazing Procedure Using CLAHE and a Guided Filter


    # 12.8 CONCLUSION AND FUTURE SCOPE


    The deazing method presented in this chapter combines two methods together, that
    is CLAHE and GF. Before applying the proposed method, white balancing is carried
    out to the hazy input image to make it look more natural. After white balancing,
    CLAHE is applied to the enhancement, but as a result of clipping the histogram
    in CLAHE, some information is lost, for GF was used to retrieve it.


    For the select clip level, different experiments were performed on images having
    different haze levels. By taking different clip limits, ranging from 0.001 to
    0.02, performance criteria like PSNR, MSE, SSIM, and contrast gain were analyzed
    and the results obtained plotted in the corresponding graphs. By observing the
    graphs, it is noticed that clip limit 0.004, the results obtained in each case
    are quite good. For experimental results, a clip limit of 0.005 is considered.


    From the experimental results performed on the dataset, it can be concluded that
    the proposed algorithm has good results in removing haze. Also by analyzing the
    performance criteria of entropy, PSNR, MSE, and SSIM, it can be said that the
    proposed algorithm is effective in removing haze from any image.


    In future, we will improve the proposed algorithm to deaze a hazy image in the
    case of a low contrast image.


