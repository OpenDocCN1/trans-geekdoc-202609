    # 1.5.2.3 Dynamic Weighted Majority Algorithm


    Dynamic weighted majority (Kolter and Maloof, 2007) abbreviated as DWM is an algorithm
    for concept-drift tracking. It is based on the majority voting of experts. The
    fundamental idea behind DWM is it dynamically creates and removes weighted experts
    based on their performance. The algorithm works according to four ideas: a train
    ensemble of learners; weighting them based on their performance; removing experts
    from the performance; and adding new learners on the global performance.


    The DWM algorithm is presented in Algorithm 1.3. I will explain each step of the
    algorithm. There are m experts. The training pair is denoted by {x, y} and there
    are c classes. {e, w} denotes the expert and its weight. In lines 1–3, we initialize
    the number of experts, create a new expert, and set its weight to 1. In the outermost
    loop, we iterate over the stream by one by. First, we set the vector σ which'
