    # 2.4.5 WEED SPECIES CLASSIFICATION


    # 2.4.5.1 Features Ranking


    The weed species dataset was well balanced with 13 dimensionless features (Equations
    (2.1)-(2.13)) and one output consisting of two weed species (grassy and clover).
    The number of data points in the dataset was 240 (from 14 images), with equal
    data points (120) for the two classes present. The feature selection algorithm
    ReliefF assigned weights to the features'' diameter range (0.38), Feret aspect
    (0.26), and solidity (0.18) were considered the most critical features in predicting
    the class (Table 2.1). Thus, the original dataset consisted of only 240 data points
    out of these three selected features; output variables were used in the KNN user-coded
    model development in R (Algorithm 2.3). The KNN algorithm was selected for the
    weed species classification because the dataset was comparatively smaller. The
    original dataset was split into 70% for training (168 data points) and 30% for
    testing datasets (72 data points). The split ratio was considered based on the
    highest accuracy yielded by the KNN model.


    # 2.4.5.2 The KNN Model and Evaluation


    Feature scaling was performed for the KNN model development as the selected critical
    features were in different ranges. Therefore, a scaled testing and training dataset
    was used in the KNN algorithm. the classification of the weed species through
    the user-coded KNN algorithm was fast and in less than 0.3 s of CPU time. The
    confusion matrix (Table 2.4) shows that the KNN algorithm successfully achieved
    the classification of two weed species belonging to the test data with an overall
    accuracy of 90% (Figure 2.9).


