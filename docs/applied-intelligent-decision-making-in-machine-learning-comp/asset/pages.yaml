    # 5.3.2 Data Curation


    Scraped and integrated data sets from multiple sources often contain missing and
    duplicate data that must be pre-processed to avoid deceptive learning processes
    leading to an undesirable set of recommendations. Our pre-processing stage involves
    transforming crawled web URLs into a suitable form to be able to deliver high-quality
    data for recommending domain-specific scientific papers. Specifically, we performed
    several pre-processing tasks, including data integration, named-entity recognition,
    handling missing values, and duplicate values (Shobha and Nickolas 2020).


    The web crawled data (single day) from different scientific web archives like
    Google Scholar, Semantic Scholar, Scopus, Web of Science, and Microsoft Academic
    includes the URLs of 4,681 papers. These URLs are the link for conference papers,
    journal papers, posters, books, and review articles. These URLs are further processed
    to exclude books, reviews, and conferences. Only 2,521 URLs were re-scraped to
    retrieve the entire document. Other pre-processing steps that were carried out
    are explained below


    +   1. **Handling irrelevant fields:** Several fields in the scraped data sets
    are not needed for recommendation purposes, such as GSrank, CitesPerYear, and
    Age of the paper. These fields are removed.

