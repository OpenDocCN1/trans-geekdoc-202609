    Dey et al., 2019, including agriculture (Liakos et al., 2018; Zhou et al., 2019).
    The common theme among these examples is the availability of rich datasets.


    Some of the successful applications of ML include crop yield prediction (Lów et
    al., 2018), inputs quantification (Tantlaki et al., 2019), phenology and crop
    health monitoring (Behmaman et al., 2015), weeds classification and geo-location
    (dos Santos Ferreira et al., 2017), animal behavior and health monitoring (Borchers
    et al., 2017), and plant disease classification (Ferentinos, 2018).


    Most of these applications used software packages that are available for different
    ML methods in the form of black-box modules in various programming languages,
    such as Scikit-learn and TensorFlow (Pedrosa et al., 2011; Abadi et al., 2015;
    Sarkar et al., 2018); nnet, and caret in R (Ramasubramanian and Singh, 2017; Kuhn,
    2019); and Statistic and ML toolbox in MATLAB (Martinez and Martinez, 2015). All
    of these packages are great for training, developing, and testing ML models, they
    come with their pros and cons. Python and R (R Core Team, 2019) are preferred
    among industry, since they are free, open source, and work cross-platform; while
    MATLAB, a commercial software, as well as requiring an annual subscription, is
    commonly used in academia.


    Among the agricultural applications of ML, pest identification and weed species
    are being addressed. For these agricultural applications, the ML packages developed
    are adapted and tested, but a reliable solution is still lacking. This is possibly
    due to the lack of resources that facilitate agricultural researchers in understanding
    the mechanism of ML methods. Better clarity on this aspect will help in customizing
    the methods to suit a specific agricultural application. Therefore, this chapter
    focuses on handling agricultural field data examples and provides an overview
    of the application of user-developed, decoded, commonly used ML methods. Particularly
    in the agricultural domain, this chapter could possibly change the perception
    of the straightforward “application” mindset among several researchers to a “development”
    mindset. Such impact will help in developing solutions for other specific agricultural
    problems, not limited to the aforementioned common applications.


