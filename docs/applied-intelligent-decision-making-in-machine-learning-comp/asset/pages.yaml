  md: "# Applied Intelligent Decision Making in Machine Learning\n\n# Algorithm 2.1\
    \ The pseudocode of the basic Relief algorithm\n\n```\n1: procedure BASIC_RELIEF(dataset)\n\
    2:   W[Fj] = 0\n3:   ξ = √π\n4:   for (i to z) do\n5:     select a random instance\
    \ (Ri)\n6:     find nearest hit (H) and nearest miss (M)\n7:     for (1 to j)\
    \ do\n8:       W[Fj] = W[Fj] - diff(Fj, Ri,H) + z*diff(Fj, Ri, M)/z\n9:     end\n\
    10:  end for\n11: end procedure\nwhile,\n  diff(Fj, Ri,H) = |value(Fj, Ri) - value(Fj,\
    \ H)| / max(Fj) - min(Fj)\n  diff(Fj, Ri,M) = |value(Fj, Ri) - value(Fj, M)| /\
    \ max(Fj) - min(Fj);\n```\n\nwhere, Fj, are the different features in the data\
    \ set: Fj = F1, F2, ..., Fn.\n\nThe idea of revising the weights with H and M\
    \ is based on the dissimilarity of the random instance and the random instance\
    \ indicates that the features separate two instances belonging to the same class,\
    \ which is not desirable; however, the weights are decreased. A significant difference\
    \ between the nearest miss and the random instance implies that the features separate\
    \ two instances belonging to different classes, is desirable; therefore, the weights\
    \ are increased.\n\nThe following R program developed and based on the decoded\
    \ Relief algorithm (Algorithm 2.1) estimates the weights of the features as outcomes\
    \ (Figure 2.4). For comparison, the direct black-box approach was also used as\
    \ an illustration. These weights are further used to determine the most significant\
    \ features.\n\nFor demonstration (Figure 2.4), consider a sample dataset with\
    \ 20 total observations (n = 20), two classes (classes 1 and 2), and five instances\
    \ (R1, R2, ... Rn). The Relief algorithm is employed to this sample dataset to\
    \ determine the most influential features, among F1, F2, and Fn, ranked according\
    \ to the weights used in classifying the dataset in classes 1 and 2.\n\nThe features\
    \ producing the highest weights are considered to be the most influential. In\
    \ the case of sample data, the feature ranked the highest, based on is F4(0.93),\
