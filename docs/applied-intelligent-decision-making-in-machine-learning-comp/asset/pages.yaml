  md: '# 2.3.8 EVALUATION OF ML METHODS


    Evaluating the efficiency of the developed model is an essential part of ML. Different
    metrics are available to evaluate the efficiency of the model, among which confusion
    matrix, accuracy, precision, recall, and F-score are often used for classification
    applications.


    # 2.3.8.1 Confusion Matrix


    The confusion matrix conveys the correctness of the model in the form of a matrix.
    It is mostly used for determining the effectiveness of the classification of ML
    models with two or more classes. The matrix contains the actual values in rows
    and predicted values in columns (Figure 2.7).


    The following are four essential terms associated with the confusion matrix:


    +   * True positive (TP)—Cases where the actual data belonged to class 1 and the
    model correctly classified as class 1.

    * False negative (FN)—Cases where the actual data belonged to class 1 but the
    model wrongly classified as class 2.

    * False positive (FP)—Cases where the actual data belonged to class 2 but the
    model wrongly classified as class 1.

    * True negative (TN)—Cases where the actual data belonged to class 2 and the model
    correctly classified as class 2.


    The following performance parameters, namely accuracy, precision, recall, F-score,
    macro-average (based on number of classes), and weighted average (weighting each
    class by number of samples in each class) are calculated based on the TP, FN,
    FP, and TN values present in the confusion matrix (Figure 2.7).


    # 2.3.8.2 Accuracy


    Accuracy in classification problems is the ratio of the total number of correct
    predictions by the model (TP and TN) to the total number of input data. It is
    a good measure for evaluating the model if the classes are nearly balanced.


    ```

    Accuracy = \left( \frac{TP + TN}{TP + FP + FN + TN} \right) \times 100% \quad
    (2.19)

    ```


