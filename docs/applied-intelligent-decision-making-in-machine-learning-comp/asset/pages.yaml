    # 6.2.2 ENSEMBLE MODELING


    Ensemble modeling is a machine learning technique in which several base diverse
    learning models are used to predict the output. The objective of this approach
    is to decrease the variance and bias of the model, which reduces the generalization
    error and provides stability to the model. In this way performance of the ensemble
    models are improved. As long as the base models are independent and diverse, the
    performance is always better. This technique uses the wisdom of collective results
    from base learners by applying any one of aggregation methods mentioned in Figure
    6.1. With this approach one can construct a stronger out of weak learners by using
    one of the following approaches:


    +   1. Bagging (reduce variance);

    2. Boosting (reduce bias);

    3. Stacking (improves prediction).


    Figure 6.2 shows the construction of an ensemble model from various base learners.
    Here, the training samples are divided into multiple subsets of samples by random
    selection with replacement. This selection method is call bootstrap aggregation
    or bagging and involves repeated resampling of training data (Breiman 1996). The
    sub-sample data may have complete features or a subset of features and each'
