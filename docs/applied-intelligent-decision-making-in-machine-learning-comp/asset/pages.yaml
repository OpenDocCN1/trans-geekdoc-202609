- pgno: 186
  md: '# 9.1 INTRODUCTION


    This chapter seeks to compare the forecasting ability of machine learning (ML)
    techniques such as decision tree, random forest, extreme gradient boosting, and
    support vector regression (SVR) by focusing on Australia''s carbon emissions.
    Australia is one of the major-emitting countries in the world. The Ndev Environment
    (2019) report indicates that Australia''s carbon emissions for March 2019 increased
    to approximately 561 million tonnes of CO2. The continued increase in carbon emissions,
    which is the primary greenhouse gas behind climate change, would cause a decline
    in agriculture yield, damage property and infrastructure facilities and financial
    instability (Climate Council, 2019). Australia has enacted numerous policies to
    mitigate carbon emissions; however, it is critical to have a futuristic understanding
    of the country''s carbon emissions.


    Having such an understanding requires the use of advanced modeling or forecasting
    techniques. In the existing literature, the majority of the studies have utilized
    classical statistical approaches to model or forecast carbon emissions (Acheamp
    & Boatang, 2019). However, given the chaotic, non-linearity, and nonstationarity
    of variables for modeling carbon emissions, the classical statistical approaches
    are not appropriate for modeling such complex behavior (Acheamp & Boatang, 2019;
    Gallo, Conte, & Fiore, 2014). Apart from the classical statistical approaches,
    other structural simulation approaches, such as computable general equilibrium
    (CGE) models, the Atmospheric Stabilisation Framework (ASF) model, the Multiregional
    Approach for Resources and Industry Allocation (MARIA) model, and the National
    Energy Modelling System (NEMS) have been employed by various organizations to
    forecast carbon emissions (00; O''Neill & Desai, 2005; Zhao & Du, 2015). It is
    argued against these models that may not be able to capture the behavior of the
    real economy and calibrations are fixed using personal judgments and calibrations
    (cited in Zhao & Du, 2015). Further, the Grey Model (GM) has been used as a technique
    for forecasting carbon emissions; Yin & Tang (2013) argue that this model and
    specifically GM (1,1) works with limited data. Studies have comparatively analyzed
    the prediction ability of these models with ML algorithms, such as Artificial
    Neural Network (ANN), and have revealed that ML techniques perform better than
    such models (Falat & Pancikova, 2015; Stamenkovic, Antanasijevicius, Risti, Perić-Grujić,
    & Pocajt, 2015; Valipour, Banihab, & Behbahani, 2013).


    Recently, the advancement in ML techniques has played a critical role in decision
    making. For instance, ML algorithms such as decision tree, random forest, extreme
    gradient boosting, and SVR have played a critical role in modeling and forecasting.
    Although there have been studies evaluating the forecasting ability of classical
    statistical models and ML techniques, research comparing the forecasting ability
    of different algorithms by focusing on carbon emissions and more specifically
    on Australian''s carbon emissions remains scarce. This warrants further empirical
    study. Therefore, in this chapter, we aim to evaluate the forecasting ability
    of the four ML techniques by focusing on Australia''s carbon emissions.'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'Supporting Environmental Decision Making


    This study also contributes to the literature by employing macroeconomic variables,
    such as population size, economic growth, energy consumption, trade, financial
    development, foreign direct investment, and urbanization, which are most used
    as inputs to model carbon emissions (see Achaeampong, 2018, 2019; Achaeampong,
    Adams, & Boating, 2019; Achaeampong, Mary, & Boating, 2020; Adams & Achaeampong,
    2019). To achieve robust and efficient estimates, this study uses high-frequency
    data. Finally, the outcome of this study will inform environmental policy-makers
    to the best ML technique for forecasting carbon emissions in Australia. The rest
    of the chapter is organized as follows. In Section 9.2, the methodology and data
    are presented, while the results are discussed in Section 9.3. Conclusions and
    policy implications are presented in Section 9.4.


    # 9.2 DATA AND METHODOLOGY


    # 9.2.1 Data


    To compare the performance accuracy of the decision tree, random forest, extreme
    gradient boosting, this study utilized a dataset for the period 1960–2018. Following
    Achaeampong & Boating (2019), we converted the data from an annual dataset to
    a quarterly dataset using the quadratic sum. Therefore, quarterly data, which
    range between 1960Q1 and 2018Q4, was used for the analysis. The output and input
    variables used are presented in Table 9.1. Economic growth, energy consumption,
    financial development, foreign direct investment, physical investment, population
    size, trade, and urbanization are used as the input variables for modeling carbon
    emissions.¹ All the variables were obtained from World Bank (2019).³


    # 9.2.2 METHODOLOGY


    # 9.2.2.1 Decision Trees


    Decision trees (DTs) are non-parametric learning techniques applied to regression
    and classification problems (Das, Naik, & Behera, 2020a; Das et al. 2020). These
    tree-based models are popular and advantageous in handling smaller datasets than
    neural network models. Through a repetitive process of splitting, the regression
    trees can yield a set of rules that can be used for prediction (Das et al., 2020b;
    Tso & Yao, 2007). The splitting process divides the sample into two or more nodes
    derived from the most important differentiator among the input variables. In case
    of classification problems, metrics such as cross-entropy and the Gini index are
    used to decide strategic splits for DTs (Das et al., 2020; Xu et al., 2005). For
    regression problems, DTs normally use the mean squared error (MSE) for splitting
    a node into two or more sub-nodes. That is, on each subset of data, the algorithm
    computes an MSE value and the tree with the least MSE is selected as a point of
    split. The resulting outcome comprises decision nodes and leaf nodes (Das, Naik,
    & Behera, 2020a, 2020b). By contrast with black-box models such as deep learning
    models, DTs are easy to understand and interpret because their rules can be visualized.
    These algorithms have been applied and attained success in many fields due to
    their efficiency and interpretability (Tsai & Chiou, 2009; Wu, 2009).'
