    | ALL/AML | 7129 | 2 | 29 | 15 |

    | CNS | 7129 | 2 | 39 | 21 |

    | ADCA Lung | 12,533 | 2 | 15 | 134 |

    | Prostate | 12,600 | 52 | 50 | 102 |'
