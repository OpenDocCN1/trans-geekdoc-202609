    however, was calculated as 0.751745327.


    # 6.5.2 CALINSKI-HARABAZ INDEX


    Another evaluation metric is the Calinski-Harabaz index, which is also named the
    variance ratio criterion. The index is the proportion of the sum of intra-cluster
    variance to the inter-cluster variance for all clusters (where the sum of the
    square of the distances is taken as). The Calinski-Harabaz score is defined as
    the proportion of the mean inter-cluster variance to the intra-cluster variance
    where $E$ represents a set of data size $n_E$ has been clustered into $k$ clusters.


    ```

    s = \frac{t_r(B_k)}{t_r(W_k)} \times \frac{n_E - k}{k - 1} \quad (6.8)

    ```


    the trace of the intra-cluster variance matrix is represented by $t_r(W_k)$ and
    the trace of the inter-cluster variance matrix. The intra and inter-cluster variance
    matrices are defined as:


    ```

    W_k = \sum_{q=1}^k \sum_{x \in C_q} (x - c_q)(x - c_q)^T \quad (6.9)

    ```'
