- pgno: 19
  md: "# Data Stream Mining for Big Data\n\nwho have arrived so far. If it comes up\
    \ heads, let the swimmer in, otherwise deny entry. A reservoir sampling algorithm\
    \ is given in Algorithm 1.2.\n\n```\nAlgorithm 1.2: Reservoir Sampling Algorithm\n\
    input S: stream of values, k: size of the reservoir\n;\n  /* Create uniform sample\
    \ of fixed size */\n  Insert first k elements of S to the reservoir.\nfor v ∈\
    \ S do\n  Let i be the index of v in S\n  Generate a random j ∈ [1, i]\n  if j\
    \ < k then\n    Insert v into the reservoir\n    Delete an item from the reservoir\
    \ at random\nend\n```\n\nThe algorithm follows the intuition as given above. At\
    \ the beginning, k items in the stream are inserted into the reservoir. For the\
    \ other incoming items, a random number is generated between 1 and i where i is\
    \ the index of the items just arrived. If the random number thus lies in [1,k],\
    \ we insert the item in the reservoir by deleting it uniformly at random. Otherwise,\
    \ discard the item. The question that comes up is: What is the probability that\
    \ the i-th item will replace an old item?\n\n# Theorem 1.1\n\nThe probability\
    \ that the new item will replace the old one is given by P(a ∈ R) = k/n, where\
    \ R denotes the reservoir size, and n the stream size.\n\nProof: Note that the\
    \ i item has probability k/i of being inserted into the reservoir R. (Why?) After\
    \ that no other item should replace it otherwise it will. Now, the (i+1) item\
    \ will not replace it, and with probability (1-1/(i+1)); likewise, the (i+2) item\
    \ will not replace it and with probability (1-1/(i+2)); and so on. Since all of\
    \ these probabilities are independent?), we multiply all of them to get the desired\
    \ result. P(a ∈ R) = $\\frac{k}{i} \\cdot \\frac{i}{i+1} \\cdot \\dots \\cdot\
    \ \\frac{n-1}{n} = \\frac{k}{n}$\n\nThus, we have proved that by using reservoir\
    \ sampling we can obtain samples which are unbiased. These samples can be used\
    \ for downstream tasks.\n\n# 1.5 CONCEPT DRIFT DETECTION IN DATA STREAMS\n\nReal-life\
    \ data is continuously changing due to the dynamics of the complex environment.\
    \ As a result, the assumption which most traditional learning algorithms make,\
    \ that the data is independent and identically distributed, does not hold."
