    base learner produces a hypothesis. Thus $h_1, h_2, h_3$, and $h_4$ are generated
    by the four weak learners trained on weighted samples. Finally, the hypotheses
    are aggregated to generate a single hypothesis. Samples are tested on this hypothesis.'
