    used. Once the data is cleaned, it is desirable to convert the data type into
    an appropriate form (e.g., class, factor values as numeric). These can be performed
    by R coercion functions, such as as.numeric(), as.integer(), as.character(), and
    as.factor().


    # 2.3.5 Feature Selection


    The datasets considered for ML modeling consists of features (predictor variables)
    and an outcome (dependent variable). Most only a group of the features are relevant,
    i.e., it provides information to the outcome while the remaining are irrelevant
    features that are not informative. Developing ML models using all the available
    features results in computational burden and reduced accuracy. Therefore, the
    relevant features have to be carefully identified and selected to build the ML
    models while discarding others (Das et al., 2020a).


    Feature selection is often confused with dimensionality reduction, in those conducted
    methods such as principal component analysis and value decomposition. Both feature
    selection and dimensionality reduction methods seek to reduce the number of features
    or attributes in the dataset. However, the dimensionality reduction achieves this
    by creating new combinations of all the features (Das et al., 2020b), while the
    feature selection methods the irrelevant features which are less useful in predicting
    the outcome variable. In general, fewer relevant features are desirable since
    it produces simpler models and a cost-effective and computationally efficient
    solution. Therefore, feature selection methods are more beneficial and useful
    in developing ML models than the dimensionality reduction methods. Feature selection
    methods can be classified into three general methods, such as filter, wrapper,
    and embedded methods which are briefly described.


    # 2.3.5.1 Filter Methods


    The filter method of feature selection assigns a score to each feature in the
    dataset by applying statistical information and correlation measure. The features
    are ranked based on the score, which implies the order of to the output variable.
    The features are either selected or discarded based on the rank. Some examples
    of filter selection methods are information gain (Joachims, 1998), chi-square
    test (Jin et al., 2006), and Relief (Kira and Rendell, 1992).


    # 2.3.5.2 Wrapper Methods


    The wrapper method uses an inbuilt ML classification and regression algorithm,
    where the combination feature subsets are created based on approaches as such'
