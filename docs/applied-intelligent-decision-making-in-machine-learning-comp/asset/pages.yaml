    # 5.3.3 PHASE 1: IDENTIFYING CANDIDATE JOURNALS


    In this phase, our goal is to recognize a set of candidate journals that are similar
    to seed documents, $S_d$. Using a trained neural network, we first embed all the
    curated documents into a linear space where domain-centric documents tend to be
    closer. Since the projection of a document is independent of the seed document,
    the entire curated documents need to be projected only once and can be reused
    for subsequent queries. Then, we project each document $S_d$ to the same linear
    space and identify its $k$ nearest neighbors as candidate references. For the
    nearby candidates, both outgoing and incoming citations are considered (Strohman,
    Croft, and Jensen 2007). The outcome of this phase is a list of documents $S_i$
    and their corresponding scores $sim(S_d, S_i)$, described as a cosine similarity.
    This phase yields a manageable number of candidate journals, making it practical
    to score each candidate $Di$ by feeding the pair $(S_d, Di)$ into another neural
    network in Phase 2, to discriminate whether the journal should be recommended
    or not. An overview of this phase is represented in Figure 5.3.


    A supervised learning is used to project the contents of document $D$ to a dense
    embedding. Each textual field of $D$ is represented as a bag-of-words, and feature
    vectors are computed as given in Equation 5.1 (Bhagavatula, Feldman, Ammar 2018):


    ```

    $FV_{D[Title]} = \sum_{t \in D[Title]} \frac{|d_t^{dir}|}{|d_t|^2} \quad (5.1)$

    ```


    ![](img/d1bf16e7dc1fe5d49ee33c2dfa5cdb06_112_0.png)


    FIGURE 5.3 An overview of Phase 1: All the papers in the corpus ($P_1$-$P_7$)
    in this example are projected into a linear space in addition to the seed document
    $S_d$. Nearest neighbors of $S_d$ are chosen as the nearest candidates. Considering
    $k=4$, $P_2, P_0, P_3,$ and $P_4$ are selected as the nearest-candidates. $P_7$
    is also considered as the nearest candidate as it is cited in $P_3$.'
