    # 1.3 FILTERING AND COUNTING IN A DATA STREAM


    In this section, we discuss algorithms for filtering items which satisfy a property
    and others which count in a data stream.


    # 1.3.1 BLOOM FILTERS


    Bloom filters are one of the most popular approaches for filtering an item from
    a data stream. Applications of bloom filters include checking if a user-id is
    available for sign-up, keeping track of web-pages visited by a user, and recent
    email addresses used to send messages. A bloom filter consists of three things
    (Rajaraman and Ullman, 2011).


    +   * A bit array of length n initialized to 0.

    * A number of hash functions $h_1, h_2, ..., h_i$. Each hash function maps ''keys''
    to bit-array value by setting the bit.

    * A set of m keys.


    We will use an application of the bloom filter to sign-up at various platforms
    for finding user-ids. A bloom filter gives guarantees of the form: if a user-id
    is available, it''s 100% of its answer. On the other hand, if a user-id is not
    available, it gives a probabilistic answer to the query. Let us see this in action.
    A bloom filter is shown in Figure 1.3. If there are two hash functions $h_1$ and
    $h_2$ which can map a given string to the bit-array. Suppose the strings ''cow''
    and ''chicken'' are mapped to (6,3) and (2,1). Bits at these locations are set
    to 1 in the bit-array. Now suppose a query for string ''pigeon'' is issued. If
    the hash functions generate 0 and 3, then we see that at location 0 is not set.
    This means ''pigeon'' can be used as a user-id. However, if the hashes generated
    were, (2,3), then it means that ''pigeon'' may already be taken as a user-id which
    the bloom filter is not sure'
  merge: -1
