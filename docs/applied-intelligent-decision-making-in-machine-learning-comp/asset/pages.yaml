    # 5.2 LITERATURE SURVEY


    The scientific paper recommendation is a task that aims to find and recommend
    the most relevant papers from a large pool, given a domain of interests. The facility
    to automatically filter a broad set of documents and find those documents that
    are most associated with user research interest has its benefits. With the increasing
    amount of publications, many of them in web archives, it is challenging to keep
    track of the latest research, even if it is within one''s area of interest or
    domain. With the timeliness of data becoming all the critical, it is also necessary
    for a paper to reach researchers using integrated data based on rules and recommending
    a focused set of scientific articles from a particular domain.


    The most common recommendation method employed in many applications like E-commerce,
    tourism and entertainment websites are collaborative-based filtering. Existing
    works shows that these filtering techniques are also used for recommending research
    articles. Content-based filtering constructs the user report based on the user''s
    reading pattern and recommends similar articles that best match the individual''s
    reading pattern. In existing methods, user profiling is generally built by considering
    the importance of keywords; however, it is inadequate to model the individual''s
    preference. To enhance the preference, semantic methods have been proposed, such
    as the label-enriched approach (Guan, Wang, Bu, Chen, Yang, and He 2010) and the
    ontology-expansion approach (Zhang, Ni, Zhao, Liu, and Yang 2014). In the case
    of collaborative filtering, like-minded groups are identified, and recommendations
    are generated based on similar interests. But the key in collaborative filtering
    is how to compute an individual''s similarity. Davoodi et and Drachsler et al.
    used data from various resources like e-mail logs, co-authors, references, and
    social media to analyze and find the similarity among individuals (Davoodi, Afsharchi,
    and Kianmeer 2012; Drachsler, Hummel, and Koper 2008).


    Many researchers have considered elements, such as domain knowledge, user background,
    and cognitive patterns, from user preference when recommending resources (Zhao,
    Wu, and Liu 2016). Zhang et al. and Yang (2014) analyzed association rules between
    resources and courses, and recommendations were made for teaching resources. Tang
    et al. proposed a recommendation technique focusing on teaching features and combining
    the user''s knowledge level and goals (Tang and McCalla 2004).'
