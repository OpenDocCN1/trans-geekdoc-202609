    of high-quality solutions in feature selection problems. Reported results of experimental
    testing showing that ACOFS performs the remarkable ability to generate reduced-size
    subsets (of salient features) and improves classification accuracy.


    A hybrid based on Particle Swarm Optimization and Support Vector Machines (PSO-SVM)
    to solve feature subset selection with the setting of kernel parameters is proposed
    by Huang et al. [15]. To minimize the computational cost, using web service technology
    a data mining system. The experimental results reveal that the proposed approach
    identifies features with high classification accuracy.


    To improve the global search in an SFL algorithm, Dash et al. [16] proposed an
