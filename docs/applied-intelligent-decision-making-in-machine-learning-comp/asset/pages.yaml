    # 1.5.2 Handling Concept Drift


    In the literature, there are many ways to combat concept drift. Mostly, they are
    char-

    acterized in the following ways (Figure 1.8) (Gamma, 2010):

    In the data management of handling concept drift, the learning mechanism\uses
    memory to keep the data. In a full-memory mechanism, sufficient sta-

    stistics are maintained over the data set by different kinds of weighting, and
    a

    model is trained on that. In a partial-memory mechanism, data is stored in the
    win-

    dow and a model is built over it. In detection methods, the techniques focus on
    the

    learning mechanism how to detect the change and rate of change. These

    methods usually detect change by monitoring them in the performance metrics or

    maintaining the time window. An example of the first approach is given by

    Klinkenberg and Joachims (2000), and the second approach is given in Kifer et
    al.

    (2004).

    In the adaptation method, the learner is adapted to track changes in the data
    evolu-

    either in an informed way or blindly. In the first case, the learner updates

    only when a change has occurred, whereas in the latter case, the learner

    updates itself whether matter a change has occurred or not. In decision model

    management, the technique characterizes the number of decision models kept in

    memory. It accumulates and tries to learn a new model whenever a change is detected.
    The dynamic weighted majority algo-

    rith (Kolter and Malof, 2007) is an example of decision model management.

    In the next sections, we will look at several examples of the change detection

    algorithms.


