    ```

    $P(X_{Student}(k,j)) = \frac{1}{(1+\exp(-10\times X_{Student}(k,j)-0.5))} \quad
    (11.6)

    ```


    ```

    $X_{Student}(k,j) = \begin{cases} 1, & if P(X_{Student}(k,j))>rand() \ 0, & Otherwise
    \end{cases} \quad (11.7)

    ```


    The fitness of the newly generated student population is computed and compared
    with the old population accordingly; the population and the fitness are updated
    based on the fitness value (minimum). This process repeats for certain iterations,
    until the stopping criteria are reached, in order to obtain the optimal feature
    set, which is finally passed to the classification algorithm for performance evaluation.


    # 11.5 RESULT ANALYSIS


    This section discusses the detailed result analysis of the FSTLBO approach. Initially,
    seven datasets are collected from different online repositories, such as the UCI
    ML Repository [36]. These datasets were quite large in size with a large number
    of features. The main objective is to reduce the size of the datasets and their
    redundant features, which can decrease the efficiency of the predictions. We need
    to reduce the redundancy and the size of the dataset so that the cost of computation
    reduces,'
