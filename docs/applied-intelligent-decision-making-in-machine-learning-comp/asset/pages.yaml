    # 2.4.2 SELECTED FEATURES FROM THE DATASET


    The datasets with relevant features extracted using ImageJ (13 features; Table
    2.1) were subjected to the Relief algorithm to determine the efficient features
    influencing the outcome variable. The results showed that shape features, such
    as (i) roundness, (ii) solidity, and (iii) circularity for soybean aphids; and
    (iv) diameter range, (v) Feret aspect, and (iii) solidity for the weed species
    data, emerged as the top three influential features; the other two influencing
    features with their weights are presented in Table 2.2. The most influential features
    were used in the original datasets, which were suitably partitioned, and respective
    models (LDA and kNN) were developed and evaluated using R (Figure 2.1).


    # 2.4.3 DATASET TEST FOR NORMALITY OF MODEL SELECTION


    Among the selected ML methods, LDA guarantees minimum classification error when
    each class in the dataset is normally distributed. Therefore, the accuracy achieved
