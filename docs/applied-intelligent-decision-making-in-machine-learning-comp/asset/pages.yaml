    OCR development has a rich history [8, 30, 37]. Starting from OCR machine to modern
    software-based recognition systems, the main aim is to recognize and classify
    characters irrespective of position, font size, and their orientation in the visual
    field. With modern devices, the detection font style independent has also become
    an interesting field of research. Broadly an OCR system has two steps, namely,
    character extraction and character detection. The extraction process involves
    image enhancement [1], skew and error correction, binarization [18, 19, 42–44],
    line and word separation, and character separation. The image enhancement and
    error removal techniques are aim to make the image ready for the OCR. These steps
    are regarded as the pre-processing step as a whole, which can be followed by a
    font detection process [31]. Font detection helps improve accuracy by utilizing
    font-specific detection algorithms. So little work has been reported in recognize
    Odia character recognition, and in most of these cases only primary characters
    [7, 29] have been considered. The study of basic and compound characters in Indian
    languages like Bangla [6, 11] and Devnagari [34] has been carried out by many
    researchers. Chaudhuri et al. [6] have studied 35 and modified characters of the
    Bangla language and achieved 96% accuracy. Following this, 300 numbers of allographs
    of the Bangla script were studied by Garain et al. [17] using the run-number-based
    method and showed 99.69% accuracy over a self-collected dataset, while in an accuracy
    of 96.00 was earned for Devnagari character recognition. However, the performance
    is yet to be significantly improved for other Indian scripts like Kannada [33],
    Gurmukhi [21], Telugu [46], Tamil [9], Gujarati [2, 16] and Odia [7, 29].


    Many studies have carried out handwritten Odia OCR. Padhi et al. [32, 33] designed
    features based on size and statistical information, and used ANN to classify 44
    allographs of Odia script, with an accuracy of 94% achieved on a self-collected
    handwritten dataset. Pal et al. [36] studied 52 Odia characters using gradient
    and curvature features with a quadratic classifier to achieve an accuracy of 91.11.
    Kumar et al. [20] proposed a method using an Ant miner-algorithm on 50 classes
    of Odia handwritten characters and achieved 90% accuracy. Basa et al. [4, 25]
    demonstrated a two-classification system. They proposed a tree based method to
    classify handwritten Odia characters into two groups and further used discriminant
    features of each group learned by two different ANNs. They formed a handwritten
    Odia character dataset of 51 classes and showed that their method provided an
    overall accuracy of 90%. Das et al. [10] proposed a recognition model for Odiacars
    using an extreme learning machine (ELM). They analyzed parameters of ELM and their
    effect on accuracy for various datasets.


