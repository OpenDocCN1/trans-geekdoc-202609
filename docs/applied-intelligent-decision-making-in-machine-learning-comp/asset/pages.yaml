    # 5.3.1.1.2 Pagination


    Apart fixed limits on result sets, web archives usually use pagination for item-

    izing the contents in the query response set. In a standard pagination technique,
    the

    interface divides the resultant query response into many pages, each individual
    page

    displaying a preset amount of contents.


    The presence of the pagination constraints may significantly affect a scraper''s

    effectiveness. Few web archives use pagination constraints that allow web crawlers

    to ingress their data efficiently. For example, if the query identifies the pages

    with consecutive numbers used for pagination, a web crawler can effortlessly

    retrieve the result set. If the item-sets are defined by other keywords like “start,\nlimit,”
    and “end,” web crawlers may crawl and retrieve objects at random loca-

    tions posting by query.


    # 5.3.1.2 Dynamic Contents


    Web pages depend on the data that is dynamically and progressively

    updated using JavaScript. Dynamically loaded data throw an extreme challenge to

    rapers in terms of complexity and run performance.


    Automated browsing through tools and frameworks by simulating a regular page

    visit are useful but not very effective for dynamic content. For example,

    Selenium, a framework with WebDriver packages, supports and enables all modern

    browser automation for different programming languages. The drawback of this is

    at automated page visits decline a crawler''s function and might not be entirely

    consistent in every set-up. Another approach for retrieving dynamic content is
    that

    the programmer needs to have prior knowledge (prerequisite) of how data is updated

    to the current page. There exist two methods to add data to a Hypertext Markup

    Language (HTML) page.


    +   1. Hidden containers: Contents are exposed using JavaScript if some end

    actions have been prompted, i.e., HTML code usually comprises the entire

    material once the page has loaded. Thus, this kind of dynamic data poses

    denial to scrapers.


    +   2. Back end sets: Contents are dynamically retrieved by requesting materi-

    als from the server''s back end if positive actions are prompted at the front
    end.

    in this setting, the data is not instantly accessible to a scraper. The JavaScript

    should be analyzed by a developer to explain which of the two methods should

    be used.


    A researcher can inspect network logs and recognize URLs and parameters that are

    handled during POST and GET requests to access dynamic content. Based on the

    server''s composition, the Web crawler will call the recognized URLs and processes

    query.'
