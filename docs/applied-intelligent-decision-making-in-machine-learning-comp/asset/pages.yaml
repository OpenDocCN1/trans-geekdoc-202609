    ```


    Again, the transfer function is applied to convert the continuous features into
    their corresponding binary features by computing the probability of student individuals
    $X_{Student}$ is updated using Equation 11.6. The new individuals are flipped
    to 1 only if the probability of student individual $P(X_{Student}(k,j))$ is greater
