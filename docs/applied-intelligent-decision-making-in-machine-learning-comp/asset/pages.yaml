    # 5.4 EXPERIMENTAL RESULTS AND DISCUSSIONS


    In this section, we compare the experimental results of our proposed compendium
    network recommendation method with the following methods.


    +   1. Latent Dirichlet Allocation (LDA) (Blei, Ng, and Jordan 2003): This method
    handles the content affinity among the topics that are obtained from the title
    of the papers. For users use the content of our new seed document $S_p$ and the
    documents referenced by $S_d$ to train the topic distribution for $S_d$.

    2. Collaborative Topic Regression (CTR) (Wang and Blei 2011): This method combines
    matrix factorization and the probabilistic topic model, which studies user-item
    ratings and textual affinity between papers.

    3. User-Article based Graph Model with Tags (UAGT) (Cai, Cheng, Luo, and Zhou
    2016): This method proposes new recommendation by considering the bipartite graph,
    which takes the readership, tag, content, and citation into account.

    4. MPRec (Ma, Zhang, and Zeng 2019): This method trains the model using meta-path-based
    topological features and resolves the recommendation problem in heterogeneous
    information networks.'
