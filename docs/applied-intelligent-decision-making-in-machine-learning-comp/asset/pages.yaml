  md: '# Development of Hybrid Computational Approaches for Landslide


    # 4.2.4 LANDSLIDE INVENTORY MAP (LIM)


    Inventory maps as locational maps help to show the location of the researched
    study area. Here we show the landslide zone of East Sikkim by presenting an inventory
    map. Using predictive models and training data also shows us the spatial distribution
    of landslides and provides information for future landslide-vulnerable zones.
    We collected all data from the Sikkim Government and the GSI to prepare the landslide
    susceptible map and validated the results through a field survey and the Global
    Positioning System. Overall 163 landslide points (70%) are considered as the training
    dataset and 49 points (30%) are for validation.


    # 4.2.5 METHODOLOGY


    # 4.2.5.1 Hybrid Biogeography-Based Optimization


    The hybrid BBO evolved to form the fundamental structure of the BBO (Bhattacharya
    and Chattopadhyay 2010). The main way this was by devolving it by combining with
    other ensembles. The BBO model is capable of estimating local exploration in a
    precise manner, but it is unable to estimate the level of exploration on a global
    scale (Simon 2008). So, the hybridization of BBO can be considered as a reliable
    prediction tool which is the best model that can balance global and local application
    (Savani et al. 2014). For landslide susceptibility modeling, the landslide occurrence
    and non-landslide dataset were divided by the nominal data (such as 1 and 0).
    For the factor and sub-factor were needed for hybrid BBO modeling.


    # 4.2.5.2 Hybridization with Differential Evolution


    The diversified mutation scheme is very optimal, which makes differential evolution
    (DE) very realistic for predicting large scale prediction when considering the
    maximum possible optimal option. In a small region predictive capability is limited;
    so for this purpose mutation and migration can be used to complement each other.
    Beside this, there are several unique approaches that can be considered for the
    hybridization process.


    # 4.2.5.2.1 The DE/BBO Algorithm


    The integration of BBO with the DE algorithm (termed the DE/BBO algorithm) was
    initiated by Gong et al. (2010) (Equations 4.1–4.4). The basis of optimization
    is the integration of hybrid BBO migration and DE mutation.


