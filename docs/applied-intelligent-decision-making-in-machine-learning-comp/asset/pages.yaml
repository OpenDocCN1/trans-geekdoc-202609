    # 5.3.1.1 Limitations on the Size of the Query Results


    5.3.1.1.1 Fixed Limits


    For any relevant query, scientific web archives often produce a fixed number of
    results. This fixed limit is suitable for people trying to retrieve a ranked item
    that is interactive, since a ranked retrieval system will usually revert to related
    outcomes within the first-ten ranks. In contrast, the researcher will likely improve
    the search query if the desired information is not retrieved.


    Before developing any scraper code, one has to inspect all the utilities used
    to retrieve any content from the web archives. This comprises splitting upper
    limits for data counts and accounting all URL parameters. These imposed restrictions
    may vary for different item types; hence, it is recommended to investigate diverse
    data types.


    For example, the search outcome for retrieving author details could be lower than
    the search results of scientific publications. Hence, the developer needs to design
    and develop the best set for scraping a particular repository.


    We have developed different scrapers for data collection and pipelining one scraper
    output as input to another scraper for efficient data collection. For example,'
