    # 6.2.3 ENSEMBLE CLUSTERING


    Now, moving on the clustering techniques, many domains have proven that in comparison
    to individual classification techniques, a classifier ensemble is more accurate
    in most cases. This has initiated research work in the area of ensemble methods
    for clustering. Fred and Jain (2002) generated base clustering results with different
    initialization of centroids in a K-means clustering algorithm. Similarity between
    samples is measured by the co-association matrix, which the K-means results are
    mapped onto. The work was extended by Kuncheva and Hadjitodorov (2014), in which
    a number of clusters was chosen for each member that was part of the ensemble
    clustering. A procedure for meta-clustering, consisting of two steps, was introduced
    by Zeng, Tang, Garcia-Frias, and Gao (2012). Initially, all the clusters are converted
    into a distance matrix. Next, the various distances from the clustering are combined
    using a hierarchical clustering method, introducing consensus clustering for computing.
    Hu (2008) generated combined clustering results using a graph-based partitioning
    approach. Ayad and Kamel (2013) introduced a graph approach with vertices and
    edges. Data points are represented by vertices and when a certain number of neighbors
    are shared between two data points, there random projection of data points is
    combined with a cluster ensemble by Fred and Jain (2002). Clustering is carried
    out using the expectation maximization approach and agglomerative clustering is
    applied to obtain the results. Greene, Tysbal, Bolshakova, and Cunningham (2014)
    focused on generating integration techniques for clustering. The dataset used
