  md: '# 1.3.2 COUNTING THE FREQUENCY OF ITEMS IN A STREAM


    Frequency counting in a stream is the basis of many tasks. For example, if we
    know the frequency of items, we can compute the mean and variances of them which
    can be further utilized in downstream tasks such as classification, clustering,
    and computing similarity. Here, I will present a classic algorithm for counting
    the frequency of items in a data stream count-min sketch (Cormode and Muthukrishnan,
    2004). A count-min algorithm can be seen as an extension of the bloom filter discussed
    above. The key idea of the algorithm is to map the domain of the stream from [1,...,n]
    to [1,...,d] using hash functions.


    Hash values are stored in a two-dimensional array called sketches of width w =
    [e / ε] and height h = [log₅/δ], where (e,δ) denote the accuracy in the approximation
    and confidence level, respectively.


    An example of a count-min algorithm is given in Figure 1.5. To understand the
    algorithm, let us take an example. Imagine the stream looks like:


    ...A, B, A, C, A, A, C... (1.1)


    Initially, the sketch is filled with 0s. The algorithm takes each letter at a
    time and applies hash functions. For example, letter "A" hashes to columns (0,
    1, 3, 4, 2) by the hash functions in the sketch. Corresponding entries in the
    sketch are incremented by 1. Similarly, all other letters are hashed. During query
    time, the same hash function is applied to produce the entries in the sketch.
    The frequency of the letter is given by taking the minimum of these entries. The
    count-min sketch is guaranteed to never give false negatives. That means the estimate
    is one of true values or overcounts. Overcounts happen when two or more hash functions
    map at least two entries at exactly the same locations. That is why the choice
