  md: 'as well as the performance improving. Firstly, the raw data is pre-processed
    (for cleaning and transforming the data) to make it useful. Here, the missing
    values are also handled by imputing the median. The reason behind this is that
    there may be some outliers in the dataset. So, the average or mean could be erroneous
    and thus we have taken the median, which is basically the center value of the
