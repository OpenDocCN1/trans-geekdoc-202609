  md: '# 72 Applied Intelligent Decision Making in Machine Learning


    # 4.1 INTRODUCTION


    A landslide is a natural disaster, which causes a loss of social as well as economic
    property. In recent decades human civilization has been increasing, but not in
    a scientific way and in the process destroying of mountainous regions and enhancing
    the likelihood of landslides. A landslide is one type of slope instability process
    and also a mass movement (such as a rock fall, earth flow and debris fall) (Borgatti
    and Soldati 2010). It is also the outcome of the relationship between shear stress
    and the materials'' shear strength on the slope (Ycin 2007). In hilly and mountainous
    regions, landslides are very common and frequent in nature, but the time of their
    happening is not yet possible to determine (Gla and Crozier 2005). The presentation
    of landslide susceptibility mapping is an area where identified capacity according
    to various environmental factors (like slope, aspect, elevation, profile curvature,
    plan curvature, topographicness index (TWI), stream power index (SPI), geology,
    lithology, soil, distance to truce, linear density, land use and land cover (LULC),
    the normalized vegetation index (NDVI), road density, rainfall, and morphology)
    and present landslide features. Fell et al. 2008 that shows the spatial distribution,
    the known and unknown landslide areas based on local terrain. The preparation
    of a landslide susceptibility mapping of any region helps to forecast future landslide
    prone areas or vulnerable zones (Ahmed 2015; Pal et al. 2019). Traditionally,
    statistically approaches were used for large areas and recently trend machine
    learning models have also been widely used with their ensembles for clusters and
    also for validation (Bu et al. 2016). The statistical methods include various
    approaches, such as logistic regression (LR), multivariate regression, a statistical
    method, an analytical hierarchy process (AHP), an evident belief function (EBF),
