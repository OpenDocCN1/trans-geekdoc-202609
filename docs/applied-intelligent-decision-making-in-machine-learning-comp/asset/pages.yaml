  md: '# 34 Applied Intelligent Decision Making in Machine Learning


    Therefore, in ML, the available labeled datasets are partitioned into training
    and testing datasets. The training data subset is used to train the ML model by
    recognizing the pattern in the dataset and the relationship between the features
    and their class labels, while the testing dataset, which serves as a proxy to
    the new data in the future, is used to estimate the generalization quality of
    the ML model (prediction accuracy) beyond the training dataset (Das et al., 2020c).


    There are different splitting methods, such as random sampling, trial-and-error,
    cross-validation, systematic sampling, and stratified sampling. Among these methods,
    the simple random sampling is as easy to use and implement; however, the simple
    random sampling works efficiently for datasets that have uniform distribution
    (Reitmana, 2010). The Kolmogorov-Smirnov test conducted, using the R function
    ks.test(), revealed that most of the features selected from the datasets of soybean
    aphids, weed species, and iris were uniformly distributed (p > 0.01), making dataset
    subsetting valid for analysis. Therefore, in this simple random sampling method
    was used to select the data for training and testing from the original dataset.


    Random sampling was performed using the R function createDataPartition() under
    the caret package. The split ratio of the dataset for training and testing usually
    is in the range of 60-90% and 40–10%; respectively. The split ratio is selected
    based on the prediction accuracy of the ML classifier model using the validation
    data, which is subsample selection of the training data. The iris dataset used
    to demonstrate the working of the function createDataPartition() in splitting
    the original dataset into training and testing subset data. A ratio of 70% (training
    subset) and 30% (testing subset) was considered for data splitting. The code snippet
    achieves package loading, data partitioning, splitting into training and testing
    data are given below:


    ```

    library(caret) # R package for Classification and REgression Training

    # Data partitioning with 70% splitting

    splitData <- createDataPartition(y = data$Species, p = 0.7,

    list = FALSE)

    trainData <- data[splitData,] # A split 70% assigned as training data

    testData <- data[-splitData,] # The rest of 70% i.e., 30% assigned as

    testing data

    ```


    # 2.3.7 The ML Methods


    The major categories of ML classification are unsupervised and supervised algorithms.
    Unsupervised ML performs classification on the unlabeled data (only input variables
    and no output variables with identified labels passed to the algorithm). The unsupervised
    algorithm learns the underlying structure and distribution in the data and clusters
    them as groups (e.g., clustering and association), while the supervised ML performs
    classification and regression tasks on the labeled data (input variables and labeled
    output variables passed to the algorithm), which helps the models to understand
    the relation between the input and output variables (Das et al., 2015, 2018).'
