    # 5.3 CONTENT-BASED RECOMMENDATION SYSTEM FOR DOMAIN-SPECIFIC PAPERS


    In this chapter, to recommend a research article to the researchers working in
    a particular domain, we use a content-based recommendation system. The inspiration
    for natural paper recommendation is adopted from Content-Based Citation Recommendation
    proposed by Bhagavatula et al. (2018), which they use to recommend citations to
    an academic paper draft. The workflow of the proposed compendium network is presented
    in Figure 5.2, and each step is discussed in detail.


    # 5.3.1 SCRAPING AND DATA INTEGRATION (CHALLENGES AND SOLUTIONS FOR DATA COLLECTION)


    Commonly encountered obstacles when collecting data from scientific web archives
    through scraping can be categorized as follows (Meschenmoser, Meuschke, Hotz,
    and Gipp 2016):


    +   1. Limitations on the size of the query results;

    2. Dynamic contents;

    3. Access limitations.'
