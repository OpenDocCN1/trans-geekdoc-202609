  md: '# 180 Applied Intelligent Decision Making in Machine Learning


    # 9.2.3 DATA DIVISION AND THE EXPERIMENTAL ENVIRONMENT


    We compared the accuracy and computational costs of these four ML algorithms.
    Data used for training and validating the models were standardized to eliminate
    instances of one variable dominating another (Boateng, Pillay, & Davis, 2019),
    since the variables used in this study had different units (Acheampong & Boateng,
    2019; Bannor & Acheampong, 2019). Eighty percent (18 quarters) of the data were
    used to train each model, while the remaining 20% (4 quarters) were used to validate
    the models. Similar data properties were used by Morano et al. (2015); Lam et
    al. (2008); Acheampong & Boateng (2019); and Bannor & Acheampong (2019). For the
    hardware and software environment, we used an Intel i5-2520m (4) at 3.2 GHz CPU,
    and an 8 GB memory on Ubuntu 18.04.2 LTS. True graphic processing units (GPUs)
    were used, an Intel 2nd Generation Core Pro, and an NVIDIA GeForce GTX 1050Ti
    with memory. We used Python (Python 3.6.7) to write and execute the programming
    codes.


    # 9.2.4 OPTIMIZATION OF HYPERPARAMETERS


    As the goal of this study is to evaluate predictive ML models, the need is to
    develop optimal models suitable for comparison purposes. We performed a grid search
    with ten-fold cross-validation on the hyperparameters of each model. This technique
    shuffles and resamples the training data into ten equal folds, fits the model
    on a combination of one set of hyperparameters, and tests the model on the remaining
    fold (Bannor & Acheampong, 2019). A carefully tuned model is at lower risk of
    overfitting and overfitting problems. The best score function returns a combination
    of hyperparameters and associated arguments for developing the model. For all
    models, we assessed their mean cross-validation scores (MCVs). The highest HCV
    was used as the base to select the ideal combination of hyperparameters.


    # 9.2.4.1 Parameter Tuning for the DT, RF, and XGBoost Algorithms


    In prior experimentation, certain parameters were deemed to influence the performance
    of the models significantly and hence were used in tuning the ML algorithms; in
    the case of the DT algorithm, five maximum leaf nodes (none, 2, 3, 5, and 7),
    and five minimum samples for a leaf node (1, 3, 5, 7, and 9) over the ten folds
    of data resulted in 1250 models. We used a random seed for the DT regression.
    For the RF algorithm, five numbers of estimators/trees (100, 150, 200, 250, and
    300), five tree depths (1, 3, 5, 7), and five minimum samples for a leaf node
    (1, 3, 5, 7, and 9) were specified. This also led to 1250 models. The hyperparameter
    arguments of the XGBoost, such as the number of estimators (100, 150, 200, 250,
    and 300), the number of maximum tree depths (1, 3, 5, 7, and 9), and the learning
    rates (0.01, 0.05, 0.1, 0.2, and 0.3), were also tuned, totaling 1250 models.


    # 9.2.4.2 Parameter Tuning for the SVR Algorithm


    For the SVR algorithm, six penalty “C” parameter arguments (10.0, 50.0, 100.0,
    1000.0, 1050.0, and 1100.0), seven different gamma values (0.0005, 0.0001, 0.001,'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Supporting Environmental Decision Making


    0.01, 0.1, 1.0, and 10.0, and three types of kernels (radial basis function, linear
    function, and polynomial function) were experimented over ten folds of the training
    dataset using the grid-search framework. In all, 1260 models were developed for
    the SVR. After the grid search with the ten-fold cross-validation exercise, we
    selected the ideal hyperparameter arguments for each algorithm based on their
    MCV scores.


    # 9.2.5 PERFORMANCE METRICS


    We assessed the accuracies of each algorithm in predicting the 48 carbon emission
    data points in this dataset. By evaluating the deviations between the predicted
    and actual emissions, with lower errors were ranked in terms of accuracy. The
    root mean squared error (RMSE), the coefficient of determination (R²), and the
    mean absolute percentage error (MAPE) were used in comparing the levels of deviation
    among the four ML algorithms. We also assessed the computational efficiency of
    the four models. In particular, the elapsed time taken during the grid search
    with a ten-fold cross-validation process on each algorithm was measured.


    # 9.3 RESULTS AND DISCUSSION


    # 9.3.1 DEVELOPMENT AND VALIDATION OF THE DT MODEL


    After performing the grid-search with ten-fold cross-validation, the DT model
    with the parameter combination of a maximum tree depth of 9, maximum leaf nodes
    as “none”, and minimum samples for a leaf node 1 had the MCV score of 0.975899.
    These parameters and arguments were used in configuring the DT model, before training
    and validating it. This relationship between the hyperparameters and the MCV scores
    during the cross-validation process is depicted in Figure 9.1. It can be observed
    that the higher the depth of the DT model, the higher the maximum leaf nodes grow,
    and hence a more accurate DT model is obtained. That is, the “none” argument of
    the maximum leaf nodes parameter suggests an unlimited number of nodes relative
    to the decrease in errors. On the other hand, a higher tree depth responds with
    a few minimum samples required for a leaf node.


