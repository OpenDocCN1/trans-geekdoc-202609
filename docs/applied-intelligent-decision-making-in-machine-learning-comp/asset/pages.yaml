    # 10.2 METHODOLOGY


    Humans understand things based on their previous knowledge. We do not reset our
    brains and start thinking again from the beginning; our thoughts have persistence.
    An RNN is a mysterious kind of artificial neural network having a loop in it to
    allow information to persist. They are the same as normal neural networks, but
    have multiple copies of similar networks. In this chapter, the GRU network, a
    special type of recurrent network introduced by Kyngyun Cho et al. in 2014 [29],
    is implemented to predict the foreign currency exchange rates. GRU model works
    similarly to LSTM [30] but fewer gates and modified networks. It works exceptionally
    well on various problems and is now widely implemented. These networks are designed
    to discard long-term dependency problems. Remembering previous information for
