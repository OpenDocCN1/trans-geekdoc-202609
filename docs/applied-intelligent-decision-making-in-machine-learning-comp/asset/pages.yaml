    \ variables $W_a$ and $U_a$. The obtained result is then activated using the hyperbolic\
    \ tangent (tanh) activation function:\n\n$$\\tanh\\left(\\frac{e^x-e^{-x}}{e^x+e^{-x}}\\\
    right)$\n\n$a_t=\tanh\\left(W_a\\cdot x_t+U_a\\cdot h_{t-1}+b_a\\right) \\quad\
    \ (10.3)$\n\nFinally, the memory or the hidden state data is changed with the\
    \ help of the above calculated results:\n\n$h_t=(1-z_t)\\cdot h_{t-1}+z_t\\cdot\
    \ a_t \\quad (10.4)$\n\nThe calculated $h_t$ of this work states the memory or\
    \ previous state data $(h_{t-1})$ for the next state. As we know, the sigmoid\
    \ function has values between 0 and 1; the discard and update of the data depends\
    \ on the values of $z_t$, and $(1-z_t)$. These two variables are interlinked;\
    \ the greater the value of one variable, the less will be the value of another,\
    \ and vice versa.\n\n# 10.2.1 Performance Measure\n\nWe employ the Mean Absolute\
    \ Percentage Error (MAPE), the Root Mean Square Error (RMSE), the Coefficient\
    \ of Determination ($R^2$), Average Relative Variance (ARV), Theil's U, and Directional\
    \ Accuracy (DA) to evaluate the performance characteristics of the proposed neural\
    \ network models as follows:\n\n$MAPE=\\frac{1}{n}\\sum\\frac{|A-P|}{|A|}\\cdot\
    \ 100 \\quad (10.5)$\n\n$RMSE=\\sqrt{\\frac{1}{n}\\sum(A-P)^2}} \\quad (10.6)$\n\
    \nWhere $A$ is the actual value, $P$ is the predicted value, and $n$ is the number\
    \ of the predictions carried out. The values of MAPE and RMSE are greater than\
    \ zero, and the closer the result is to zero, the more accurate will be the performance."
  merge: -1
