- pgno: 208
  md: "# 198 Applied Intelligent Decision Making in Machine Learning\n\nAnother equation\
    \ we apply for the performance measure is the coefficient of determination, denoted\
    \ by $R^2$ and as “R-squared.” This is the proportion calculated from actual and\
    \ predicted variables:\n\n```\n$$\\bar{A} = \\frac{1}{n} \\sum_{i=1}^{n} A_i$$\n\
    $$ss_{tot} = \\sum_{i} (A_i - \\bar{A})^2$$\n$$ss_{res} = \\sum_{i} (A_i - P_i)^2$$\n\
    $$R^2 = 1 - \\frac{ss_{res}}{ss_{tot}}$$ (10.7)\n```\n\nwhere $A$ and $P$ are\
    \ actual and predicted variables, $\bar{A}$ is the mean of $A$, and $ss_{tot}$\
    \ and $ss_{res}$ are the total sum of squares and the residual sum of squares.\
    \ The value of $R^2$ lies between 0 and 1, and the closest to 1 is the more accurate.\n\
    \n```\n$DA = \\frac{100}{n} \\sum_{i=1}^{n} d_i \\text{ where } d_i = \\begin{cases}\
    \ 1, & (P_i - P_{i-1})(A_i - A_{i-1}) \\geq 0 \\ 0, & \\text{otherwise} \\end{cases}$\
    \ (10.8)\n```\n\nwhere $d_i$, is the direction accuracy, $P_i$ and $A_i$, are\
    \ the predicted data and actual data. This measures the number of correct decisions\
    \ made when forecasting whether the next values will increase or decrease during\
    \ the subsequent steps. The values of DA fall between 0 and 100; the closer the\
    \ values are to 100, the more accurate the prediction of the model. Performance-measuring\
    \ approach is more important to the model. This performance-measuring approach\
    \ is more important to stock market analysis because of the direction of the time-series\
    \ data.\n\n```\n$Theil's U = \\frac{\\sqrt{\\frac{1}{2} \\sum_{i=1}^{n} (A_i -\
    \ P_i)^2}}{\\sqrt{\\frac{1}{2} \\sum_{i=1}^{n} A_i^2 + \\sqrt{\\frac{1}{2} \\\
    sum_{i=1}^{n} P_i^2}}$ (10.9)\n```\n\nThe model is unable to predict if value\
    \ of Theil's U approaches zero. Another performance measure, the ARV, is defined\
    \ as:\n\n```\n$ARV = \\frac{\\sum_{i=1}^{n} (P_i - A_i)^2}{\\sum_{i=1}^{n} (P_i\
    \ - \\bar{A})^2}$ (10.10)\n```\n\nThe model is practical if the ARV value is between\
    \ 0 and 1, where the closer the value is to zero, the better is the result."
  merge: -1
  img_proc: true
- pgno: 209
  md: '# Prediction Analysis of Exchange Rate Forecasting


    # 10.2.2 DATA PREPARATION


    The historical currency exchange rates data downloaded from The Financial Forecast
    Center (www.forecasts.org), for 1570 daily forex samples of five different currencies
    (the Australian dollar (AUD), the British pound (GBP), the Canadian dollar (CAD),
    the Indian rupee (INR), and the Japanese yen (JPY) against US dollar (USD), were
    obtained over the period January 2012 to April 2018. The daily dataset samples
    were normalized in the range of [0, 1], dividing each value by the maximum value.
    The input patterns and the corresponding output values are extracted by using
    the concept of sliding window size, one step at a time. N number of patterns equal
    to (N-W+1). In this feature extraction technique, the number of input variables
    (or the column size of the extracted values) is taken similarly to the size of
    the sliding windows, in which the first column of the extracted dataset starts
    from the first index of the values, the second column starts from the second index,
    and so on. The generated pattern to input model is further divided into two different
    datasets; the first 80% of samples are used for training purposes and the remaining
    20% for testing.


    # 10.3 RESULTS AND SIMULATIONS


    Tables 10.1–10.15 show the prediction performance of two different models: the
    LSTM model and the GRU model, over various days-ahead predictions. The historical
    forex data of five different currencies are taken and applied to the proposed
    model. The resulted outputs are then compared with the actual output to measure
    the performance characteristics of both approaches. Although monetary exchange
    values are dynamic in nature, sudden increments or decrements of an exchange rate
    is quite difficult to handle using traditional networks; they also require more
    time to understand the pattern and update the weights to adjust the model accordingly.
    The recurrent neural networks can remember previous information, these two kinds
    of RNN can handle complex data with long term dependency and execute in fewer
    iterations. The results of the LSTM and GRU models are tabulated by taking different
    window sizes (i.e., 7, 10, and 13). While increasing the number of the days-ahead
    prediction, the values of the performance measuring parameters also increase.


    # 10.3.1 FOR SLIDING WINDOW SIZE 7


    According to Tables 10.1–10.5, the GRU model has performed better than the LSTM
    model. Some of the performance measuring parameters have similar values for both
    models but, as a whole, the GRU approach gives more accurate results for the given
    samples of the daily dataset for sliding window size 7.'
