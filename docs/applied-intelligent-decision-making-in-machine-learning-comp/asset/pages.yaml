  md: '# Preface


    Decision making is the process of selection of best choice made logically from
    the accessible options. Decision making analyzes the large volume of data in a
    particular field and is a very difficult task to do manually. A technique must
    be used to find out the possible outcome of each option available. It also determines
    the option that is best at a particular moment for an effective decision-making
    process. Machine learning uses a set of mathematical models and algorithms for
    the construction of a decision system that gradually improves its performance
    on specific tasks. It is also based on a model that develops intelligent, adaptive,
    and hybrid tools for solving complex decision-making problems. Artificial intelligence
    has already been recognized as a standard tool for the decision-making process.
    Despite several such findings still need to be addressed due to the advancement
    of technologies such as artificial intelligence, machine learning, and information
    technology. The computer system should analyze dynamically each option as well
    as alternatives to make an appropriate decision. This will also specifically focus
    on applied intelligent decision-making fields that perform effectively for predictive
    analysis, clustering, feature selection, feature reduction, information retrieval,
    and pattern recognition in a very limited amount of time with high performance.


    The objective of this book is to reach academic scientists, researchers, data
    scientists, and scholars to explore and share experiences and outcomes across
    various domains to develop cost-effective, intelligent, and adaptive models that
    handle varying challenges in the field of decision making and help researchers
    reward to a new level. The book incorporates the advances of machine intelligent
    techniques and it provides a premier interdisciplinary platform for scientists,
    researchers, practitioners, and educators to share their thoughts in the context
    of recent innovations, trends, developments, challenges, and advancements in the
    field of data mining, machine learning, soft computing, and decision science.
    It addresses recent developments and applications in the decision-making process
    in several ways. To address these objectives, the book includes 12 chapters contributed
    by several authors from around the globe.


    Chapter 1 covers the mining of data for the extraction of knowledge for decision
    making and provides efficient algorithms to do this. In Chapter 2, the authors
    use two agricultural applications to demonstrate decoded machine learning methods.
    In Chapter 3, the author design a hybrid model for optical character recognition
    to effectively recognize the character classes. Chapter 4 analyzes hybrid computational
    approaches, like the hybrid biography-based optimization technique for landslide
    susceptibility. In Chapter 5, the author suggests a content-based approach, by
    embedding a search document (query) into a linear space to find its nearest neighbors
    as candidates, and these candidates are re-ranked using a model that discriminates
    between cited and un publications. Chapter 6 focuses on the analysis of air quality
    data, based on air'
