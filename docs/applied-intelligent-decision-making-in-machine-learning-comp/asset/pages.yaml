    indicates the selection of a feature and 0 indicates the rejection of a feature.
    By combining the training data with binary population, the new feature set is
    constructed. This newly constructed feature set is passed to the classification
    algorithm for fitness evaluation. The newly constructed features are also passed
    through the teacher and student phase to obtain the updated population. The fitness
    of the updated population is computed using a classification algorithm and comparing
    with the old, which accordingly updates the population and fitness. This process
    is repeated for certain iterations to acquire the optimal features, which are
    passed to the classification algorithm for performance evaluation.


    The detailed working of the FSTLB method for finding the optimal features will
    now be described. This is a two-phase process, such as teacher and student, in
    which the teacher trains the students. Let us use the dataset $X=\{X_1, X_2, \dots,
    X_m, D\}$, where $D$ is the dimensions (subjects) of the problem and $i = 1, 2,
    3, \dots m$ is the number of instances. Initially, a random population is generated
    and combined with the training data to generate the new feature set. The fitness
    (error) of the newly constructed feature set is computed by using a classification
    algorithm. Here, the KNN algorithm is used for computation of the fitness with
    the value of $k=5$. This fitness is to be minimized to increase the performance
    of the model.


    In the teacher phase, the individual having the minimum fitness will be treated
    as the teacher. The teacher tries to increase the mean value of the subject that
    he or she has taught by subtracting the mean result of each subject from the teacher
    using Equation 11.1.


    > $Difference(j) = r\times teacher(j) - TF\times mean(j)$ (11.1)


    Here, $j=1, 2, 3, \dots D$ is the dimension of the problem, $r$ is the random
    number in the range $[0,1]$, $teacher$ is the best individual (minimum fitness),
    $mean$ is the mean of each subject, and $TF$ is the teaching factor.


    The new population can be generated by using Equation 11.2, where $k=1, 2, 3,
    \dots, N$ is the number of the population.


    > $X_{New} = X(k) + Difference$ (11.2)


    The transfer function is used to convert the continuous features into their corresponding
    binary features by computing the probability of the new individuals $X_{New}$
    using Equation 11.3. The population of each individual is updated using Equation
    11.4. The new individuals are flipped to 1 if the probability of the new individual
    $P(X_{New}(k,j))$ is greater than or equal to the random number; otherwise it
    is set to 0, where $rand()$ is the random number distributed in the range of 0
    to 1, and $P$ represents the probability.


    > $P(X_{New}(k,j)) = \frac{1}{1+\exp(-10\times(X_{New}(k,j)-0.5))}$ (11.3)


    > $X_{New}(k,j) = \begin{cases} 1, & \text{if } P(X_{New}(k,j)) > rand() \ 0,
    & \text{Otherwise} \end{cases}$ (11.4)'
