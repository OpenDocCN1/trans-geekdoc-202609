    In the forthcoming sections, I present algorithms for some basic tasks in data
    stream mining, sampling from the data stream, and concept-drift detection in data
    streams. For other tasks, such as classification, clustering, frequent pattern
    mining, and novelty detection in data stream mining, the interested reader is
