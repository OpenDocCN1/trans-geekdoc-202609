    # 12.6 IMAGE QUALITY ASSESSMENT CRITERIA


    # 12.6.1 PEAK Signal-to-Noise Ratio (PSNR) and Mean Squared Error MSE


    Peak Signal-to-Noise Ratio (PSNR) and Mean Squared Error (MSE) [17, 18, 27, 41]
    are the two most used error matrices for comparing the quality of the dehazed
    image. The cumulative squared error among improved dehazed images and the original
    image is represented by MSE, which can mathematically be represented as:


    ```

    MSE = \left[ \frac{1}{M \times N} \right]_{M,N} \sum [I_t(m,n) - I_z(m,n)] \quad
    (12.13)

    ```


    Here, $I_t(m,n)$ and $I_z(m,n)$ are the hazy image and the improved image respectively,
    $M \times N$ is the size of the image, and $m, n$ signifies the $x, y$ location
    of the image pixel.'
