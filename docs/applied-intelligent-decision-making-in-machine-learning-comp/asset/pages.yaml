    # 5.4.2 Result Analysis


    From the empirical results, the following conclusions can be made.


    +   1. As explained in the data collection process, it is usually hard to get
    all the text data of a few peers. Hence the accessible data of the papers are
    somewhat partial; for example, when only the title of the paper can be used, then
    the content-based recommendation achieves poor outcomes. In contrast, the computational
    complexity will be very high if all the text data of the paper are used for solving
    the recommendation problem.

    2. Most of the existing graph-based methods do not consider the semantic meaning
    underlying the networks; they handle the recommendation problem using homogeneous
    or bipartite networks.

    3. Compendium network-based recommendation is influential and encapsulates much
    more vibrant and complex meaning meaning simple graph-based methods. Recommendation
    approaches that incorporate domain-specific data perform better with less computational
    cost compared to other methods.


    # 5.5 CONCLUSION AND FUTURE WORK


    In this chapter we have proposed a neural network and the nearest neighbor based
    method to recommend domain-centric articles for researchers. To do so, we built
    a network by scraping, integrating, and pre-processing domain-centric data from
    multiple repositories, like Google Scholar, Semantic Scholar, Scopus, Web of Science,
    and Microsoft Academic data. Mainly, we have suggested a method to recommend domain-centric
    articles for researchers based on their domain of interest. In the proposed compendium
    method, the user’s domain knowledge and his or her research interests are used
    to find out the knowledge gap, and the compendium aims to recommend domain-centric
    papers that can help bridge that gap. The method first scrapes the domain-centric
    data based on the domain corpus. The contributions of this chapter are as follows:
    In the first phase, curated domain-centric documents are embedded into a linear
    space using a neural network that such a similar domain-centric document tends
    to be closer. The nearest neighbors of a seed document are selected as candidates,
    which differentiate re-ranked using a neural network trained to assign a probability
    rank to differentiate whether the document should be recommended or not. The empirical
    outcomes show that the proposed domain-centric-based method gives the best overall
    performance'
