- pgno: 240
  md: "# 230 Applied Intelligent Decision Making in Machine Learning\n\nIt can generally\
    \ be described as the union of airlight and attenuation, where airlight occurs\
    \ when light gets scattered and reflected back in the direction of the source,\
    \ which causes the whiteness in the image, and attenuation is the diminishing\
    \ effect of the image contrast.\n\nThe following model is used to describe hazy\
    \ image formation [7, 9, 25, 35]:\n\n```\n$I(x) = J(x) \\times t(x) + A \\times\
    \ (1-t(x)) \\quad (12.1)$\n```\n\nwhere the input hazy image is expressed as $I(x)$,\
    \ $t(x)$ is the transparency of haze ranging from 0 to 1, which works by blending\
    \ atmospheric light (A) and the original color of the image $J(x)$. The $J(x)\
    \ \\times t(x)$ is called attenuation and $A \\times (1-t(x))$ is called airlight.\
    \ The transmission factor $t(x)$ is decreased with increasing depth of the object,\
    \ which is expressed as:\n\n```\n$t(x) = e^{-\\beta d(x)} \\quad (12.2)$\n```\n\
    \nwhere $\beta$ stands for the scattering coefficient of the atmosphere and $d(x)$\
    \ is the scene depth.\n\nThe technique which is used to recover the original image\
    \ from the hazy image is called a dehazing technique. The conventional technique\
    \ to remove haze involves two steps: first to remove the airlight and second to\
    \ recover the lost information by image. Basically, dehazing methods can be classified\
    \ into two categories: Multiple image-based dehazing methods and single image-based\
    \ dehazing methods. Some relevant work based on machine learning and image processing\
    \ are described in [4, 31, 40].\n\nMultiple image-based methods require multiple\
    \ images of the same scene to execute, whereas single image-based methods need\
    \ only one image to carry out the process.\n\nMultiple image-based methods can\
    \ be extended into the following categories: A weather-condition-based method\
    \ [21, 25] which depends on the variation of the same image taken during different\
    \ weather conditions. Though this method can enhance the visibility it cannot\
    \ work for dynamic images. For the polarization-based method [29, 30], multiple\
    \ images having a different filter of polarization are considered. This polarization\
    \ filter can be adjusted by the attached polarization filter present in the camera.\
    \ The limitation with this method is that it cannot work properly when the haze\
    \ is thick or dense. Similarly for the map-based method [14, 23], some depth information\
    \ [29, 30] is used to dehaze an image. This works on a 3D model, and the appearance\
    \ of the input scene depth gives and helps in removing haze from the image. This\
    \ technique needs user interaction, that is, not automatic.\n\nTo cope with the\
    \ limitation of the multiple image-based method, single image-based methods are\
    \ used... following. The Contrast Maximization method [35], which helps in enhancing\
    \ the contrast of the input hazy image [25]. The output images will have a large\
    \ value of saturation as the proposed method only enhances the visibility but\
    \ does not improve the overall"
  merge: -1
  img_proc: true
- pgno: 241
  md: '# An Enhanced Image Deazing Procedure Using CLAHE and a Guided Filter


    brightness of the image. The method of Independent Component Analysis [8], relies
    on statistics dividing two additive components from an input hazy image [21].
    This approach achieves good results. However, in the presence of dense haze the
    performance gets degraded.


    Therefore, Dark Channel Prior (DCP) [10, 22, 39] is introduced, where it is assumed
    that some of the image pixels have less intensity in any of the color channels,
    the minimum value of which is the dark pixel. These dark pixels help in the transmission
    of haze. This is one of the most commonly used methods for dehazing a hazy input
    [15], but it cannot remove haze from an image similar to although, such as white
    object or the headlight of a car. In Anisotropic Diffusion [36], the haze can
    be removed from any part (lines, edges, etc.) of the image, though the result
    has poor visibility.


    In this chapter, an efficient image-based dehazing method is proposed, using Contrast
    Limited Histogram Equalization (CLAHE) and Guided Filter (GF) to remove haze from
    a hazy image. Histogram Equalization is one of the most commonly used image enhancement
    techniques, which can only perform well if there is even pixel distribution in
    the image. Adaptive Histogram Equalization (AHE) can overcome this problem. However,
    again, the concern with this method is that it tends to over-amplify the contrast
    of the image. Therefore, CLAHE, a variant of AHE, is introduced. The process is
    similar to AHE but uses a normalized clip of range [0, 1] to remove over-amplification
    of noise and contrast. Although it can reduce the problem of over-amplification,
    some information may be lost because of clipping the histogram. In order to get
    the last information from the CLAHE output image, an edge-preserving GF is applied
    to the resultant image.


    The chapter is organized as follows. Section 12.2 presents the literature survey;
    Section 12.3 covers the background study. The proposed methodology is given in
    Section 12.4. Dataset collection and analysis is given in Section 12.5. Image
    quality assessment criteria is created in Section 12.6. In Section 12.7, different
    experimental results along a discussion are presented. The conclusion and future
    scope are drawn in Section 12.8.


    # 12.2 LITERATURE SURVEY


    In [20], an atmospheric scattering model was established by considering that atmospheric
    particles become scattered under different weather conditions. After that, various
    dehazing methods have been proposed to date, based on multiple images [29, 30],
    weather-condition-based methods [21, 22, 25], and methods based on Dark Channel
    Prior.


    Dehazing techniques based on physics [15, 34] have also been developed where the
    image contrast can be restored using the estimated weather information. But it
    can only work with some known scene depth. One further image-based dehazing technique
    is the depth map based method [14, 23], which works on depth information from
    the user input to deh an image. The problem with this method is that it is not
    automatic but needs user interaction. Another effective method to dehaze an image
    is the wavelet-based fusion method [8], which can remove the blur effect from
    the image.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# 232


    # Applied Intelligent Decision Making in Machine Learning


    The only limitation with the multiple image-based dehazing method is that it requires
    more than one image of the same scene, which may be very difficult to get in many
    scenarios, as is the case for any moving object. As a result, a single image-based
    dehazing method has gained in popularity as it requires only one input image and
    thus solves the problem faced by the multiple image-based dehazing method.


    Paper [40] proposed a defogging method using Contrast Limited AHE. This method
    an RGB image is converted into an HSI color model and then CLAHE is used to process
    the intensity component of the image. The disadvantage of the proposed method
    is that some of the image information may get lost and the contrast of the image
    may get disturbed. Some advancement techniques of image-processing algorithms
    are described in [5, 17, 28, 32].


    One of the most effective dehazing methods described by Jackson et al. in [11]
    is based on DCP [2], where it is assumed that the local patches in a haze-free
    image contain some pixels, which have very low intensities in any of the color
    (RGB). By using DCP, the transparency or the thickness of the haze can be obtained
    and thus the quality of the hazy image can be improved. However, the DCP approach
    has two main limitations: First, it is unable to remove from objects which are
    similar to airlight, like snowy ground or car headlights, and second, the processing
    time is high for real-time applications. Another method of calculating atmospheric
    light was proposed by Chaudhary et al. [1]. In this paper, atmospheric light is
    calculated by using an unbiased bilateral filter with trigonometric range in constant
    time. Cheng et al. [2], proposed an airlight estimation method using Gaussian
    distribution, which has less time-complexity and is more specific than other methods.
    DCP, along with a Gaussian filter, is used for dehazing purposes in [19]. Although
    the proposed method is quite fast and works on images having even haze, it lacks
    efficiency in preserving the edges of the resultant dehazed image.


    A novel method proposed in [16], by combining both DCP and Bright Channel prior
    (BCP), in which the airlight is achieved by using the average value of the DCP
    and BCP. The proposed algorithm effectively achieves a good result in clearing
    the image, but as DCP and BCP are a kind of statistic, it may not give the expected
    result in some particular images. Another dehazing method based on the Non-symmetry
    and Anti-packing Model (NAM) is mentioned in [43] where the airlight is achieved
    by the above mentioned method and the scene transmission is estimated by binding
    boundary constraints and contextual regularization. The approach is effective
    in reducing the artifacts and gives a high quality image. However, it is a quite
    consuming method.


    The result of DCP can be improved by using Improved Dark Channel Prior (IDCP)
    [37], proposed by Ullah et al. Here, DCP with a bilateral filter is used as an
    improvement in the method. This bilateral filter is used for the purpose of smoothing
    the image, but it reduces the pixel color saturation and, as a result, the image
    seems a bit washed out.


    A dehazing method based on a GF technique was implemented by He et al. [8]. The
    proposed method is effective not only in dehazing an image, but also in other
    fields, like image feathering and edge smoothing. A fast haze removal algorithm
    was'
