  md: '# Applied Intelligent Decision Making in Machine Learning


    35 consonants, and 10 numeric values. However, the synthesis of Odia sentences
    is not possible without the use of martas and compound characters. OCR needs to
    detect basic as well as compound characters to convert Odia documents to their
    corresponding text. We studied the various literature and found that 211 classes
    of characters are ample for recognizing most of the documents. Our research focused
    on these 211 characters. The current models are not efficient enough to recognize
    all these characters, as shown in Section 3.5. Hence, aiming at recognition performance,
    we proposed a hybrid model which utilizes a structural similarity index (SSIM)
    in the first stage, a profile projection and Kendall rank correlation ranking
    in the second stage, and a local frequency descriptor (LFD) and General regression
    neural network (GRNN) in the final stage to predict the final class label. Different
    combinations of these methods were tested over a newly created dataset and a comparative
    analysis was made with state-of-the-art methods. An overall accuracy of 90.6%
    was achieved using the proposed three-stage hybrid model.


    The chapter is organized in the following way. Section 3.2 gives a description
    of the methods that are required to build the hybrid model. Section 3.3 describes
    the dataset developed and the experimental details. Following this, in Section
    3.5, results of this investigation are presented, and finally Section 3.6 completes
    the chapter.


    # 3.2 BACKGROUND


    # 3.2.1 GENERAL OCR Stages


    Generally, a complete OCR process is divided into multiple stages. Image acquisition
    is the first and essential step for any computer vision application. For character
    recognition images are captured by a flatbed scanner. A digital image of the document
    can also be obtained with powerful mobile cameras, which they need additional
    processing. After image acquisition, the known errors are to be removed by the
    pre-processing step. Image enhancement, noise removal, skew detection and correction,
    page segmentation, binarization, and font detection are examples of a few pre-processing
    methods that are used in OCR models. Segmentation is the process of separating
    lines, words, and characters and has higher significance in determining the recognition
    accuracy in the case of handwriting and touched character recognition. Each separated
    character is fed into the recognition model to determine the class label. Models
    can be derived by various learning and classification methods and feature matching
    models (feature + template). After recognizing the character class, its corresponding
    ASCII or Unicode-code must be written into a text file. Handling both word and
    line separation is essential in this stage. The information obtained from the
    segmentation step is used in this context, though the recognition process may
    not lead to the desired result. The presence of punctuation and errors may also
    result in some unnecessary characters, which can be solved with post-dictionary
    matching and contextual information. An overview of the general model is shown
    in Figure 3.2.'
