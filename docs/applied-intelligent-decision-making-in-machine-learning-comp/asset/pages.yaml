  md: 'The problem is more severe in the case of data streams because of the high
    data rate and the non-availability of all the data points.


    More formally, in data mining and machine learning, we try to find the function
    $f$ that maps input $x$ to output y.


    ```

    y = f(x) \quad (1.2)

    ```


    Such a function is assumed to be stationary, i.e., the distribution generating
    the data is fixed (but unknown). But, real-life data is:


    +   - Non-stationary.

    - Evolving.


    Therefore, we need methods that can detect and adapt to changes in the underlying
    function. The underlying function is called a *concept* and changes in the function
    is called *concept-drift*, also known as *change detection, covariate shift, dataset
    shift*, etc.


    We should make a difference between noise and *concept-drift* here. A change in
    the change region or when there are not sufficient examples present in the change
    region or they cannot form a new concept of their own. The main difficulty lies
    in determining the threshold when changes in the data form a new concept as proposed
    to remain as noise. An example of concept-drift is shown in Figure 1.6. As we
    can see in the figure, there is a change in the variance of the signal; so it
    is a concept drift of signals.


    # 1.5.1 Causes of Concept Drift


    Often, the causes of the drift are unknown. However, most researchers try to find
    causes based on the changes in the model. An explanation of the causes is given
    by [Kelly et al., 1999]. Let us look at the Bayesian decision formula used in
    naive Bayes.


