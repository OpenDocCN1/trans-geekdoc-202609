    # 4.3. APPLICATION OF HYBRID BIOGOGRAPHY-BASED OPTIMIZATION FOR LANDSLIDE SUSCEPTIBILITY
    ASSESSMENT


    Different causal factors have been considered for estimation of the landslide
    susceptible areas using the hybrid BBO model on a GIS platform. This was constructed
    on the basis of all causal factors and landslide inventory points. The landslide
    point is randomly split into 70:30 as training and validation datasets. The very
    high (0.729–1.00) landslide susceptible areas are found mainly in the middle portion
    of this region and its area coverage is 91.70 sq. km (9.966%). High (0.517–0.729)
    landslide susceptible areas are found mainly in the northern, middle, and eastern
    portions of this region and its area coverage is 128.65 sq. km (13.59%). Moderate
    (0.309–0.517) landslide susceptible areas are found mainly in the northern, middle,
    western, and eastern portions of this region and its area coverage is 143.39 sq.
    km (15.15%). Low (0.113–0.309) landslide susceptible areas are found mainly in
    the northern, middle, western, and eastern portions of this region and its area
    coverage is 158.95 sq. km, (16.79%). Very low (0.00–0.113) landslide susceptible
    areas are found in most portions of this region and its area coverage is 423.81
    sq. km (44.78%) (Figure 4.8).'
