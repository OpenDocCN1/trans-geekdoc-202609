- pgno: 104
  md: 'Research article recommendation demands a method that suggests significant
    articles to researchers via discovering their interests and preferences (Basu,
    Hirush, Cohen, and Nevill-Manning 2001). By dynamically suggesting impressive
    materials, research article recommendations can save much time and effort for
    researchers (Pan and Li 2010).


    Researchers are highly motivated to make their research work accessible to proliferate
    their work, to increase their reputation, and to progress in their professions.
    Research and funding organizations often bank on scientific web archives, to know
    the number of published papers and their citation counts for a researcher, and
    to appoint, promote, and to make decisions.


    Domain-centric research article recommendations can help improve the quality and
    efficiency of the recommendation process by suggesting published articles to researchers’
    interests. For this drive, we meticulously queried the web archives, scraped the
    returned links, and inserted different features that contribute to the recommendation
    of publications, i.e., scraped data are curated to retain the best features (Das,
    Naik, Behera, Jaiswal, Mahato, and Rout 2020); Das, Naik, and Behera 2020b; Das,
    Naik, and Behera 2018).


    Researchers have proposed numerous feature extraction algorithms for selecting
    the best features perform data analytics (Das, Dey, and Balas 2019); Dey, Das,
    Naik, and Behera 2019) and various machine learning tasks like classification
    (Das, Naik, Naik, and Behera 2020a), clustering (Das, Naik, and Behera 2020a),
    Das, Jena, Nayak, Naik, Kalia, Goswami, Rout, Jena, and Das 2020), and decision
    making (Dey, Ashour, Kalia, Goswami, and Das 2018).


    For the notion that motivated this work, we use Google Scholar, Semantic Scholar,
