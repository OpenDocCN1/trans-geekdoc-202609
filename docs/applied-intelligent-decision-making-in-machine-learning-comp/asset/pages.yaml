    # 2.4.6 COMPARISON OF RESULTS WITH THE STANDARD IRIS DATA


    The performance of ML models (LDA and kNN) with user-coded algorithms (Algorithms
    2.2 and 2.3) and the corresponding “black-box” methods (readily available packages)
    estimated for the iris, soybean aphids, and weed species produced comparable results
    (Table 2.5). Between the accuracy and F-score (calculated using recall and precision)
    performance parameters, accuracy was selected for comparison since all the three
    datasets were balanced with class distribution. In addition to accuracy, computation
    process time was also considered for comparing the performance of the models and
    methods. The R function train() from the caret package was used to conduct the
    LDA and kNN model development. The LDA and kNN methods employed for the iris dataset
    produced good performance with 98% and 96% accuracies with the user-coded algorithm,
    100% and 93% with the black-box method, respectively. The LDA slightly better
    than kNN for the iris dataset since the data points were normally distributed
    (p = 0.08).


    Although LDA had normality spread, kNN was also employed for comparison, and as
    expected, for the soybean aphid dataset, LDA performed better (92%) than kNN (84%)
    with both the user-coded algorithm and black-box method. The accuracy of both
    methods coincided with the soybean aphid dataset. Similarly, in the kNN method
    employed for the weed species dataset with no normality, the LDA method was also
    tested for performance. As kNN performed better (90% user-coded, 92% black-box)
    than LDA (81% user-coded, 79% black-box). The user-coded algorithm for LDA produced
    better or comparable accuracy for the soybean aphid and weed species datasets,
    with the user-coded kNN produced better or comparable accuracy for iris and soybean
    aphids.


