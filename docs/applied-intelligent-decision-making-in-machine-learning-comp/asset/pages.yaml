    # 12.1 INTRODUCTION


    The presence of unwanted particles in the atmosphere, as water droplets, fog,
    and haze [24], makes it very difficult to get a clear image in an outdoor scene.
    The image becomes unclear of the absorption and scattering of lights by these
    atmospheric particles. As a result, sometimes the contrast of images taken outside
    reduced and their visibility may also be affected. This, in turn, can cause a
    major problem in different areas like photography, surveillance, navigation, and
    monitoring systems. Therefore, some measures to remove fog or haze have become
    an important concern in commercial as well as scientific applications. Here, we
    are focusing on haze, which occurs due to the presence of any particle with water
    droplets in the atmosphere. Haze is mostly found in areas having high pollution.'
