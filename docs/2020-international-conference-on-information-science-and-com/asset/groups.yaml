    ## III. 卷积神经网络


    本工作使用的数据库不仅是 ECG 数据，还从 ECG 中提取了用于分类心律失常的特殊特征。通常，机器学习技术对于利用这些提取的特征进行分类和疾病识别是非常有用的。由于机器学习算法无法直接提取原始
    ECG 信号，因此它们首先需要提取特定特征，然后基于这些特征进行数据分类。


    然而，使用机器学习成功实现目标存在两个缺点。首先，开发数据库中提取的特殊特征不足以诊断心肌梗死（MI）或心肌病：未提供 12 联的 ST 升高和倒置数据。其次，数据以二维（2D）矩阵的形式呈现而非一维，且机器学习方法不适用于处理二维数据。为了在机器学习中应用所提出的算法，需要重新设计数据库。这不仅在网络训练过程中需要额外的条件，在后续现实生活中中使用开发的方法也需要。克服上述缺点的最佳方法是深度学习，特别是卷积神经网络（CNN）方法。这种深度学习方法是处理图像的专门方法
    [7]，因为它已经在许多医学领域以及不仅仅是图像领域中得到了证明 [9, 10, 11, 12]。CNN 架构输入中的任何 2D 格式数据都可以被视为输入数据。但这需要使用一种允许从
    Datastore 中读取数据的特殊函数。在我们的工作中，由于数据是以 .mat 文件形式存在的，开发了一种特殊函数，可以在读取数据库时读取 .mat 格式的数据。


    数据库中的数据按 8:1:1 的比例分为三部分：训练数据、验证数据和测试数据。在这种分布中，测试数据（数据的十分之一）是随机选择的，然后剩余数据按 8:1
    进行随机化。


