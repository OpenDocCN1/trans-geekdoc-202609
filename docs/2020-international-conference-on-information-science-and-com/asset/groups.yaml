    | File name | The description |

    |---|---|

    | Person.csv | Patient''s information as ID, gender, ethnicity. |

    | Electrocardiogram. | | ECG data, person ID. |

    | Drug.csv | Drug prescribed at a certain time. |

    | Diagnosis.csv | Patient diagnosis code, ID and time of the ECG data. |

    | Laboratory.csv | Results of laboratory analysis submitted by patients (Person
    ID and time of laboratory analysis). |

    | QRCodeMaster.csv | Prescription code and name of drug. |

    | DiagnosisCode.csv | Mapping of diagnosis code to ICD-10 code. |


