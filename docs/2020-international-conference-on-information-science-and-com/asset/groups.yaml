    **Abstract** - In this study, the first automatic algorithm for myocardial infarction
    (MI) and cardiomyopathy was developed on ECG data obtained from the ECG-II database.
    ECG data classification was done by the developed Convolutional Neural Network
    (CNN) model in order to determine the effectiveness of the proposed method, diseases
    with MI and cardiomyopathy selected, which are the most misdiagnosed among patients.
    Despite the simplicity of the disease on the ECG, the accuracy of the network
    test was high, 91.1%. The conclusion is that a larger dataset and more features,
    with 12 channel ECG data, would increase the capacity of the network to differentiate
    other diseases. Moreover, this method has the ability to improve the diagnostic
    accuracy of I-channel smartphone ECG devices.


    **Keywords** - ECG, deep learning, classification, myocardial infarction, cardiomyopathy.


