    3. Code of the department where the patient is registered.

    4. Information about the source of ECG data.

    5. RR duration (ms).

    6. PE duration (ms).

    7. QT duration (ms).

    8. QTC duration (ms).

    9. P axis.

    10. QRS waves axis.

    11. T axis.


