    # II. DATABASE OF THE NETWORK


    # A. ECG-II DATABASE


    The ECG-II database was used in this research, and developed by Korean researchers
    between 1994 and 2013 for use [6]. This database is provided free of charge to
    all researchers conducting in the relevant field. The database was developed from
    710,369 ECG data from 371 patients, with ECG data collected from patients over
    1 to 18 months (average of 1.6 days). Moreover, the average interval between ECG
    acquisitions was 502 ± 1.08 days. ECG data is not presented in the form of a signal,
    but in form of values of special features extracted from the signal.


    The data dataset consists of 5 files in database, each of which is stored in .csv
    format in tabular form. In addition to the main files, there are two additional
    files with comments to the data. Following Tab. shows the names of the files in
    the database, and a description of the data.


