    **摘要** - 在研究中，根据从 ECG-II 数据库获取的心电数据开发了首种针对心肌梗死（MI）和心肌病的自动算法。通过开发的卷积神经网络（CNN）模型对心电数据进行分类，以确定所提方法的有效性，并选择了患者中最容易被误诊的心肌梗死和心肌病疾病。尽管这些疾病在心电图上的表现较为简单，但网络测试的准确率很高，达到
    91.1%。结论是，更大的数据集和具有12通道心电数据的更多特征将增加网络区分其他疾病的能力。此外，该方法能够提高 I 通道手机心电图设备的诊断准确率。


    **关键词** - 心电图（ECG）、深度学习、分类、心肌梗死、心肌病。


    ## I. 引言


    心肌病是一种以心脏增大或心肌僵硬为特征的心脏疾病，通常发生在没有该病但有高血压、遗传因素或冠状动脉疾病的人身上。该疾病与心肌梗死相似，区别在于它不是后获得的，而是遗传性的。心肌病有多种类型，其中扩张型最危险，统计显示每
    100 名患者中就有 1 人患有此病。心肌病是导致猝死的主要原因之一，尤其是在年轻运动员中 [1]。近年来，心肌病导致的死亡率有所上升。


    超声图常用于诊断此类心脏病。因为心肌病患者较少通过心电图诊断。这是由于该疾病与特定的心电图信号出现无关。分析和统计显示，心电血管心肌病具有不同的患者，会导致心脏病，有时模拟心肌梗死。心电图特征对心肌病的诊断灵敏度较低
    [3]。


    心肌梗死是一种由于心肌缺氧和血管破裂而导致心脏细胞（心肌）受损的状况。如果心肌梗死没有及时诊断和治疗，可能会导致严重的并发症和死亡。


    在本研究中，同时使用心电图和超声来自动检测和诊断心肌梗死和心肌病。心电图仅提供疾病存在的信息，而超声扫描可以提供更多细节，例如损伤的大小或位置。有时心肌病会表现出类似于心肌梗死的心电图特征，基于心电数据进行诊断不仅会导致误诊，即使是资医生如此
    [6]。相比之下，心肌梗死患者如果得不到及时的治疗，很容易面临危险。在心脏病中，患者的……


    因此，通常使用血检和超声图来诊断心肌病和心肌梗死。在需要紧急干预的情况下，如果患者位于心脏位置且必须及时处理，进行这些测试的时间和能力是有限的。心肌梗死和心肌病的测试结果通常在
    8-9 小时内确定，而且并不总有时间进行解读。在这种情况下，心肌病相对于心电图更可靠，且……


    从上述明显看出，医学需要一种有效的方法，通过心电图数据区分心肌病和心肌梗死。在心肌病中，心肌梗死的症状（如病理性 Q 波）在 30 天后出现并消失，而在心肌梗死中，出现后保持不变。在心肌梗死中，这些症状随时间变化。其他症状如
    QRS 变化、ST 段升高在长时间后有明显不同 [5]。


    还可以注意到，为了对这些疾病做出正确诊断，有必要比较患者之前的心电数据并监测随时间的变化。


    最近开发了许多计算机应用程序来自动诊断心肌梗死和心肌病，所有这些都基于对特定心电波形的分析。在诊断时，计算机应用程序根据某些规则根据疾病症状的存在来区分症状。如上述所示，不同疾病的症状本身相似，尽管程序使用了其中任何一种，但仍无法准确诊断它们。


    为了防止和消除计算机诊断中的病例，开发了一种新方法，通过比较多个时段的心电图数据来诊断疾病。该方法的性能也非常准确。观察到，该方法可以高准确率地区分扩张心肌病和心肌梗死。


    本文的结构如下：第一章描述了数据库的结构以及如何准备训练数据。第二章提供了有关层、CNN 模型参数、网络训练过程以及获得结果的信息。第三部分是讨论，提供了对该主题进行的研究分析的简要回顾、所提方法的缺点以及关于未来将要开展活动的信息。


    ## II. 网络数据库


