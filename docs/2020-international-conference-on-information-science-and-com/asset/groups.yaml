    ## 讨论


    图 1 显示了混淆矩阵。在范围内，我们可以看到心肌病和心肌梗死的自动区分算法 ECG 信号...


    ## 表 VI：测试混淆矩阵


    | 心肌病 | 心肌梗死 |

    |---|---|

    | 心肌梗死 | 14 | 190 |


    使用表 VI，我们利用以下公式计算网络性能参数：


    - Specificity = TN/(TN+FP)*100%

    - Precision = TP/(TP+FP)*100%

    - Sensitivity = TP/(TP+FN)*100%

    - F1 Score = 2*(Sensitivity * Precision) / (Sensitivity + Precision)*100%


    这些结果的主要原因是开发了一种基于 ECG 的诊断新方法。通常，人的 ECG 之间差异很大，每个 ECG 在 24 小时内没有标准波形。随着疾病的进展，ECG
    会持续变化 [20, 21, 22]。有趣的是，没有计算机程序能够通过比较多个期的 ECG 来绘制心肌病。


    我们做的另一项工作是患者几年的数据以单一矩阵的形式存储，形成了单一集成数据。然而，许多研究人员以不同数据的形式存储同一患者不同时间的 ECG 数据。在该数据库中，即使是单个完整的
    ECG 也记录并存储为不同数据。在这种情况下，网络会过拟合，测试准确率很高。实验表明，当用其他数据测试网络时准确率高得多。这种情况在提出的工作中没有发生。


    提出的另一种方法是通过使用 1 或 3 个智能手机提高自动诊断过程的效率。1 到 3 个 ECG 数据不足以诊断 MI。然而，自动诊断中 ECG 数据的变化大大提高了诊断准确率。


    ## IV. 未来工作


    由于形成所需数据以及缺乏 ECG 数据，使用了 ECG-VIEW 数据库。观察到这不足以诊断疾病。如果数据库包含至少 5-6 次的 12 联 ECG，可以获得更好的结果并准确分类更多疾病。最重要的是将获得结果的可靠性。


    ## V. 结论


    提出了一种使用 CNN 模型区分心肌梗死和心肌病的新方法。提出的方法首先为数据时段的分类提供了清晰的边界。网络准确率很高。使用 PTB 数据库，使用 ECG-VIEW
    II 数据库来区分不同的心律失常，因为它包含了足够的 ECG 特征，除了 12 联 ECG。这种方法为自动诊断开启了新途径。


