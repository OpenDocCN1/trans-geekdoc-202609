    # IV. FUTURE WORK


    Due to the problem of forming the required data and the lack of ECG data, the
    ECG-VIEW database was used. It has been observed that this is not sufficient to
    diagnose diseases. If the database consists of 12-lead ECG used at least 5-6 times,
    better results can be obtained and more diseases can be accurately classified.
    Most importantly, the reliability of the results will be obtained.


    # V. CONCLUSION


    In this new approach to differentiating MI and cardiopathy using the CNN model
    is proposed. The proposed method first allows clear boundaries for classification
    of a data period of time. The accuracy of the network is high. Using the PTB database,
    the ECG-VIEW II database was used to differentiate different arrhythmias because
    it is consists of enough ECG feature, not except 12-lead ECG. This approach, opens
    up a new way in automatic diagnosis.


