    and sometimes mimics myocardial infarction. The sensitivity of ECG features for
    the diagnosis of cardiomyopathy is low [3]


    Myocardial infarction is a condition causing damage to the cells of the heart
    (myocardium) due to a lack of oxygen in the heart muscle to ruptured blood vessels.
    A myocardial infarction is not diagnosed and treated in a timely manner, the damage
    can lead to serious complications and death


