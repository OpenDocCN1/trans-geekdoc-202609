    **Abstract** - In this study, the first automatic algorithm for myocardial infarction
    (MI) and cardiomyopathy was developed on ECG data obtained from the ECG-II database.
    ECG data classification was done by the developed Convolutional Neural Network
    (CNN) model in order to determine the effectiveness of the proposed method, diseases
    with MI and cardiomyopathy selected, which are the most misdiagnosed among patients.
    Despite the simplicity of the disease on the ECG, the accuracy of the network
    test was high, 91.1%. The conclusion is that a larger dataset and more features,
    with 12 channel ECG data, would increase the capacity of the network to differentiate
    other diseases. Moreover, this method has the ability to improve the diagnostic
    accuracy of I-channel smartphone ECG devices.


    **Keywords** - ECG, deep learning, classification, myocardial infarction, cardiomyopathy.


    # ## I. INTRODUCTION


    Cardiomyopathy is a heart disease characterized by enlargement, or rigid heart
    muscle, which usually occurs in people who do not have the disease but have high
    blood pressure, genetic factors, or coronary artery disease. The disease is similar
    to myocardial infarction, the difference is that the disease is not acquired,
    but may be hereditary. There are several types of cardiomyopathy, with dilated
    being the most dangerous, and statistics show that one in 100 patients suffer
    from this disease. Cardiomyopathy is one of the leading causes of sudden cardiac
    death, especially among young athletes [1]. The mortality due to cardiomyopathy
    has been increased in recent years


    Echocardiography is commonly used to diagnose this type of heart disease. Because
    patients with cardiomyopathy are less likely to be diagnosed with an ECG. This
    is due to the fact that the disease is not associated with the appearance of specific
    ECG signals. Analysis and statistics show that ECG


