    So many algorithms have been developed for the automatic diagnosis of cardiopathy
    and myocardial infarction. Existing algorithms are only able to classify myocardial
    infarction or location [1, 8, 14], or to distinguish only cardiopathy. Studies
    have proposed algorithms that divide ECG signals into MI [2, 15, 16] as cardiopathy
    and healthy groups. Moreover, a lot of scientific work has been done in the last
    years on the automatic detection of MI, and their advantages and disadvantages
    have been well analyzed [17].


    # Discussion


    Fig. 1 shows the sum of training confusion matrix on CNN


    In a small amount, we can see that the algorithm for automatic differentiation
    of cardiopathy and myocardial infarction has been proposed. To distinguish between
    different types of cardiopathy and MI as ECG signals...


    # TABLE VI. THE CONFUSION MATRIX OF TESTING


    | Cardiopathy | Myocardial infarction |

    | --- | --- | --- |

    | Myocardial infarction | 14 | 190 |


    Using Tab VI, we calculated the parameters which evaluate the performance of the
    network using the following formulas:


    Specificity = TN/(TN+FP)*100%

    Precision = TP/(TP+FP)*100%

    Sensitivity = TP/(TP+FN)*100%

    F1 Score = 2*(Sensitivity * Precision) / (Sensitivity + Precision)*100%


    The main reason for these results is the development of a new approach to ECG-based
    diagnostics. In general, human ECGs are much different from each other, each ECG
    may not be observed a standard ECG waveform during 24 hours. The ECG changes continuously
    as the disease progresses [20, 21, 22]. Interestingly, no computer program is
    able to draw cardiopathy, by comparing ECGs over multiple periods.'
