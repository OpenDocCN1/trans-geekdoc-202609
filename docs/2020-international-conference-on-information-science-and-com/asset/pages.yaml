    # II. DATABASE OF THE NETWORK


    # A. ECG-II DATABASE


    The ECG-II database was used in this research, and developed by Korean researchers
    between 1994 and 2013 for use [6]. This database is provided free of charge to
    all researchers conducting in the relevant field. The database was developed from
    710,369 ECG data from 371 patients, with ECG data collected from patients over
    1 to 18 months (average of 1.6 days). Moreover, the average interval between ECG
    acquisitions was 502 ± 1.08 days. ECG data is not presented in the form of a signal,
    but in form of values of special features extracted from the signal.


    The data dataset consists of 5 files in database, each of which is stored in .csv
    format in tabular form. In addition to the main files, there are two additional
    files with comments to the data. Following Tab. shows the names of the files in
    the database, and a description of the data.


    TABLE I. DATA DESCRIPTION AND NAME OF THE FILES IN THE DATASET


    | File name | The description |

    |---|---|

    | Person.csv | Patient''s information as ID, gender, ethnicity. |

    | Electrocardiogram. | | ECG data, person ID. |

    | Drug.csv | Drug prescribed at a certain time. |

    | Diagnosis.csv | Patient diagnosis code, ID and time of the ECG data. |

    | Laboratory.csv | Results of laboratory analysis submitted by patients (Person
    ID and time of laboratory analysis). |

    | QRCodeMaster.csv | Prescription code and name of drug. |

    | DiagnosisCode.csv | Mapping of diagnosis code to ICD-10 code. |


    The data in the ECG-II csv file is in the following order (Tab. II):


    +   1. Patient ID number.

    2. The ECG was recorded.

    3. Code of the department where the patient is registered.

    4. Information about the source of ECG data.

    5. RR duration (ms).

    6. PE duration (ms).

    7. QT duration (ms).

    8. QTC duration (ms).

    9. P axis.

    10. QRS waves axis.

    11. T axis.


    The ECG-II database is presented by Korean researchers in different forms. The
    database of the first is a sample database (ECG-II SAMPLE) that gives a general
    discussion about the database. This contains a small amount of ECG data and can
    be downloaded through the website without any registration. The second form is
    the full database, which requires filling official agreement and mailing to the
    authors to full download. If it is accepted, a link will be provided to download
    the full database.


