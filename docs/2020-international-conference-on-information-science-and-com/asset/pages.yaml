    # III. CONVOLUTIONAL NEURAL NETWORK


    The database used in this work is not just ECG data, but special features extracted
    from ECG for classifying arrhythmia. Typically, machine learning techniques are
    useful for classification and identifying diseases using these extracted features.
    Because machine learning algorithms cannot directly extract raw ECG signals, they
    first require the extraction of specific features and then the data classification
    is based on these features.


    However, there are two disadvantages to using machine learning to successfully
    achieved target. Firstly, the extracted special features in the developed database
    are not sufficient to diagnose MI or cardiomyopathy: data ST elevation and inversion
    in each of 12 leads are not given. Secondly, the data is presented in the form
    of a two-dimensional (2D) matrix rather than one-dimensional and machine learning
    methods are not adapted to work with 2D data. In order to apply the proposed algorithm
    in machine learning, the database needs to be redesigned. This requires additional
    conditions not only in the process of


    training the network, but in the subsequent use of the developed method in real
    life The most optimal way to overcome the above disadvantages is deep learning,
    especially convolutional neural network (CNN) method. This deep learning approach
    is a specialized method for working with images [7] as it has been proven in many
    medical fields as well as not just images [9, 10, 11, 12]. Any data in the 2D
    format input of the CNN architecture can be considered as input data. But this
    requires the use of a special function that allows to read the data in the Datastore.
    In our work, also, because the data is in the form of .mat files, a special function
    developed that allows the data in .mat format when reading the database.


    The data in the database is divided into three parts in a ratio of 8:1:1, training
    data, validation data and test data. In this distribution, the test data (one
    in 10 of the data) was randomly selected, and then the remaining data were randomized
    in 8:1.


    In the proposed work, a total of 16 CNN networks were constructed, consisting
