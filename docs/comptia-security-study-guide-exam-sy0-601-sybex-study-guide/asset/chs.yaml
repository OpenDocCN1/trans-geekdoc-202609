  \n    3.  安全噩梦\n\n    4.  敏捷开发\n\n7.  Tim 正在修复其组织使用的一个 Web 应用程序中的已知 Bug。他应该在哪个环境中工作？\n\
  \n    1.  测试\n\n    2.  开发\n\n    3.  暂存\n\n    4.  生产\n\n8.  以下哪种软件开发模型侧重于软件的早期和持续交付？\n\
  \n    1.  瀑布模型\n\n    2.  敏捷\n\n    3.  螺旋模型\n\n    4.  蝴蝶模型\n\n9.  Kevin 希望确保其软件运行在一个能够根据需求变化进行扩展和收缩的平台上。以下哪个术语最能描述他的目标？\n\
  \n    1.  可扩展性\n\n    2.  弹性\n\n    3.  成本效益\n\n    4.  敏捷性\n\n10.  以下哪项*不是*数据库规范化的优势？\n\
  \n     1.  防止数据不一致\n\n     2.  防止注入攻击\n\n     3.  减少数据库重构的需求\n\n     4.  使数据库模式更具信息量\n\
