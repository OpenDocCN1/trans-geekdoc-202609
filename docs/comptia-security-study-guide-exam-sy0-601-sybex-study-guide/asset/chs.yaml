  3.  缓冲区溢出\n4.  中间相遇攻击\n\n#### 14. Tom 是一名软件开发人员，编写代码出售给公众。他希望向用户保证他们收到的代码确实来自他本人。他可以使用什么技术来最好地提供这种保证？\n\
  \n1.  代码签名\n2.  代码背书\n3.  代码加密\n4.  代码混淆\n\n#### 15. 安全专业人员在浏览器中检查 HTML 源代码时，哪种跨站脚本攻击类型是不可见的？\n\
  \n1.  反射型 XSS\n2.  存储型 XSS\n3.  持久型 XSS\n4.  基于 DOM 的 XSS\n\n#### 16. Joe 查看 Web\
  \ 服务器日志，发现有人向运行在服务器上的应用程序发送了以下查询字符串：\n\n```\nhttp://www.mycompany.com/servicestatus.php?serviceID=892&serviceID=892'\
  \ ; DROP TABLE Services;--\n```\n\n最有可能尝试了哪种类型的攻击？\n\n1.  跨站脚本\n2.  会话劫持\n3.  参数污染\n\
  4.  中间人攻击\n\n#### 17. 进一步检查后，Joe 发现来自单个 IP 地址、指向同一 URL 的数千个请求序列。以下是几个示例：\n\n```\n\
  http://www.mycompany.com/servicestatus.php?serviceID=1\nhttp://www.mycompany.com/servicestatus.php?serviceID=2\n\
  http://www.mycompany.com/servicestatus.php?serviceID=3\nhttp://www.mycompany.com/servicestatus.php?serviceID=4\n\
  http://www.mycompany.com/servicestatus.php?serviceID=5\nhttp://www.mycompany.com/servicestatus.php?serviceID=6\n\
  ```\n\n攻击者很可能试图利用哪种类型的漏洞？\n\n1.  不安全的直接对象引用\n2.  文件上传\n3.  未验证的重定向\n4.  会话劫持\n\n\
  #### 18. Joe 对 Web 服务器日志的分析尚未结束。当他继续查看日志时，发现了如下请求：\n\n```\nhttp://www.mycompany.com/../../../etc/passwd\n\
  ```\n\n最有可能尝试了哪种类型的攻击？\n\n1.  SQL 注入\n2.  会话劫持\n3.  目录遍历\n4.  文件上传\n\n#### 19. Wendy\
  \ 是一名渗透测试人员，希望发起会话劫持攻击。如果她的攻击要成功，获取什么信息至关重要？\n\n1.  会话票据\n2.  会话 Cookie\n3.  用户名\n\
  4.  用户密码\n\n#### 20. Joe 正在检查其 Web 服务器的日志，发现用户发送给 Web 应用程序的输入中包含字符串 `WAITFOR`。用户很可能在尝试哪种类型的攻击？\n\
  \n1.  基于时间的 SQL 注入\n2.  HTML 注入\n3.  跨站脚本\n4.  基于内容的 SQL 注入\n\n---\n\n### 第 7 章：密码学与公钥基础设施\n\
  \n**密码学** 是以一种无法在没有所需解密密钥的情况下解码的方式对信息进行编码的实践。密码学包含两个主要操作：**加密**，即使用加密密钥将明文信息转换为密文；**解密**，即使用解密密钥将密文转换回明文。\n\
  \n密码学有几个重要目标。首要目标是**机密性**，这对应 CIA 三要素的三个支柱之一。组织使用加密来保护敏感信息免受窥探。第二个目标**完整性**，也对应\
  \ CIA 三要素的三个要素之一。组织使用密码学确保数据不会被恶意或无意地篡改。当我们谈到第三个目标**认证**时，密码学的目标开始与 CIA 三要素有所不同。虽然认证以字母\
  \ A 开头，但请记住 CIA 三要素中的 A 代表“可用性”。认证是指利用加密来验证个人身份。第四个目标**不可否认性**，确保个人能够向第三方证明消息确实来自其声称的发送者。不同的密码系统能够实现不同的目标，您将在本章中了解这些内容。\n\
  \n### 密码学概述\n\n密码学是一门几乎与人类历史一样悠久的学科。最早有记录的密码学尝试发生在 4000 年前。这些早期尝试包括将信息从一种语言翻译成另一种语言，或替换字符。从那时起，密码学已发展为包含大量可能性。这些早期的密码学探索完全专注于实现机密性这一目标。经典方法使用相对简单的技术，人类通常能在合理的时间内破解。现代密码学中使用的混淆技术要复杂得多，在实际时间范围内可以是不可破解的。\n\
  \n#### 历史密码学\n\n历史密码学方法早于现代计算机时代。这些方法不依赖数学（许多现代方法都依赖数学），而是依赖某种打乱文本的技术。\n\n**密码**\
  \ 是一种用于打乱或混淆字符以隐藏其值的方法。**加密** 是使用密码对消息进行此类打乱的过程。两种主要的非数学密码学（或加密方法）是**替换**和**置换**。我们将在本节中讨论这两种方法。\n\
  \n##### 替换密码\n\n**替换密码** 是一种将一个字符或符号更改为另一个字符或符号的编码或加密系统。字符替换可以是一种相对简单的信息加密方法。最古老的已知替换密码之一称为**凯撒密码**。据称由尤利乌斯·凯撒使用。该系统仅涉及将字母表中的所有字母向右移动特定数量的位置。据推测，尤利乌斯·凯撒使用了向右移动三位的方法。这意味着将消息中的\
  \ A 变为 D，B 变为 E，依此类推。当到达字母表末尾时，只需“循环”回到开头，因此 X 变为 A，Y 变为 B，Z 变为 C。\n\n凯撒当然是在使用拉丁语，但同样的方法可以应用于包括英语在内的任何语言。以下是一个示例：\n\
  \n```\nI WILL PASS THE EXAM\n```\n\n如果将每个字母向右移动三位，将得到以下内容：\n\n```\nL ZLOO SDVV WKH\
  \ HADP\n```\n\n使用凯撒密码加密的消息的解密遵循相反的过程。解密不是将每个字母向右移动三位，而是将密文的每个字母向左移动三位以恢复原始明文字符。\n\
  \n凯撒密码和 ROT13 是替换密码非常简单的示例。它们过于简单，不适合今天使用，因为任何密码学家都能在几秒钟内破解这些密码或任何类似的替换。然而，替换操作构成了许多现代加密算法的基础。它们只是执行更复杂的替换，并多次执行这些操作以增加复杂性，使密码更难破解。\n\
  \n##### 多表替换\n\n替换密码的问题之一在于它们没有改变文本底层的字母和单词频率。解决此问题的一种方法是对同一消息使用多个替换字母表。使用这种方法的密码称为**多表替换密码**。例如，您可以将第一个字母向右移动三位，第二个字母向右移动两位，第三个字母向左移动一位；然后对接下来的三个字母重复此公式。\n\
  \n\n\n\n历史上最著名的多表代换示例是 `Vigenère cipher`（维吉尼亚密码）。它使用一个关键字在表中查找密文，如 图 7-1 所示。用户将想要加密的文本的第一个字母，在维吉尼亚表中与关键字中的字母进行匹配，以找到密文字母。此过程将重复进行，直到整条消息加密完毕。关键字中的每个字母都会生成一个不同的代换字母表。\n\
  \n![FIGURE 7.1 Vigenère cipher table](img/c07f001.png)\n\n**图 7.1** 维吉尼亚密码表\n\n\
  例如，假设你想使用该密码通过关键字“APPLE”来加密短语“SECRET MESSAGE”。首先将消息的字符与关键字的字符对齐，根据需要重复关键字多次：\n\n\
  ```\nS E C R E T M E S S A G E\nA P P L E A P P L E A P P\n```\n\n然后通过在 图 7.1 的维吉尼亚表中查找每一对明文和密钥字符来创建密文。明文的第一个字母是“S”，密钥的第一个字母是“A”，因此你在表中找到\
  \ S 列，然后查看 A 行，发现密文值为“S”。对第二个字符重复此过程，查找“E”和“P”的交叉点，得到密文字符“T”。随着你完成此过程，将得到以下加密消息：\n\
  \n`S T R C I T B T D E A V T`\n\n要解密消息，请反向执行该过程：在密钥字母对应的行中找到密文字符，然后查看该列顶部以找到明文。例如，第一个字母指向“A”行，我们在“S”列中找到密文字符“S”。第二个字母指向“P”行，我们在“E”列中找到密文字符“T”。\n\
  \n##### 置换密码\n\n`transposition cipher`（置换密码）涉及以特定方式对字母进行置换或打乱。通常，消息被分割成大小相等的块，然后对每个块进行打乱。如\
  \ 图 7.2 所示的简单示例中，通过改变每组内字符的顺序来对字符进行置换。在本例中，字母在消息中旋转了三个位置。你可以改变块 1 的置换方式使其不同于块 2，从而增加一点难度，但仍然相对容易解密。\n\
  \n![FIGURE 7.2 A simple transposition cipher in action](img/c07f002.png)\n\n**图\
  \ 7.2** 简单置换密码的实际操作\n\n列置换是置换密码的经典示例。使用此密码时，你需要预先选择行数，这将作为你的加密密钥。然后通过将连续字符放入下一行来书写消息，直到到达列底部。例如，如果你想对以下消息进行编码：\n\
  \n```\nM E E T M E I N T H E S T O R E\n```\n\n使用密钥 4，你会将消息写成四行，如下所示：\n\n```\nM\
  \ M T T\nE E H O\nE I E R\nT N S E\n```\n\n然后，通过按行读取而不是按列读取来获取密文，得到：\n\n`M M T T\
  \ E E H O E I E R T N S E`\n\n要解密此消息，你必须知道消息是使用四行加密的，然后利用该信息重建矩阵，将密文字符按行写入。接着通过按列向下读取而不是按行横向读取来解密消息。\n\
  \n##### Enigma 密码机\n\n如果不讨论 Enigma 密码机（`Enigma machine`），密码学历史的讨论就不算完整。`Enigma machine`\
  \ 是二战期间由德国政府创建的，用于在军事和政治单位之间提供安全通信。该机器如 图 7.3 所示，外观像一台带有一些额外功能的打字机。\n\n![FIGURE\
  \ 7.3 Enigma machine from the National Security Agency's National Cryptologic Museum\
  \ ¶ Source: U.S. Government Photo](img/c07f003.png)\n\n**图 7.3** 来自美国国家安全局国家密码博物馆的\
  \ Enigma 密码机 ¶ 来源：美国政府照片\n\n操作员负责通过设置机器顶部的旋转拨盘和配置机器前面的导线，将机器配置为使用当天的密码。机器的内部结构实现了多表代换，对消息的每个字符改变代换方式。\n\
  \n一旦机器针对当天进行了正确配置，使用它就很简单。发送操作员按下键盘上对应明文消息字母的键，相应的密文字母随即亮起。接收操作员遵循相同的过程转换回明文。\n\n\
  Enigma 密码机让盟军情报官员头疼不已，他们投入了大量时间和精力在一个名为“Ultra”的项目中，旨在破解该机器。破解 Enigma 的工作集中在英国的布莱切利公园，由先驱计算机科学家艾伦·图灵领导。这些努力在破译德军通信方面取得了巨大成功，英国首相温斯顿·丘吉尔本人也对这些努力给予了高度赞扬，据报道他曾告诉乔治六世国王：“多亏了\
  \ [Ultra] 在所有战线投入使用，我们才赢得了战争！”\n\n##### 隐写术\n\n`Steganography`（隐写术）是利用加密技术将秘密消息嵌入另一个文件中的艺术。隐写算法通过修改构成图像文件的众多位中最低有效位来工作。这些变化微乎其微，对查看的图像没有可察觉的影响。这种技术允许通信双方隐藏消息于显而易见之处——例如，他们可能将秘密消息嵌入一个原本无害的网页插图中。\n\
  \n隐写者通常将秘密消息嵌入图像、视频文件或音频文件中，因为这些文件通常非常大，即使是最敏锐的检查员也很容易忽略其中的秘密消息。隐写技术常被用于非法或可疑活动，如间谍活动和儿童色情。\n\
  \n然而，隐写术也可用于合法目的。通过隐写术向文档添加数字水印以保护知识产权。隐藏信息仅为文件创建者所知。如果有人后来制作了内容的未授权副本，水印可用于检测该副本（如果为每个原始接收者提供唯一水印的文件），并将侵权副本追溯到源头。\n\
  \n隐写术是一种极其简单易用的技术，互联网上公开提供免费工具。图 7.4 展示了此类工具 OpenStego 的完整界面。它只要求你指定一个包含秘密消息的文本文件和一个你希望用来隐藏消息的图像文件。图\
  \ 7.5 展示了一个嵌入秘密消息的图片示例；该消息肉眼无法察觉。\n\n![FIGURE 7.4 OpenStego steganography tool](img/c07f004.png)\n\
  \n**图 7.4** OpenStego 隐写工具\n\n![FIGURE 7.5 Image with embedded message](img/c07f005.png)\n\
  \n**图 7.5** 嵌入消息的图像\n\n#### 密码学的目标\n\n\n\n\n### 密码学的安全目标\n\n安全从业者使用密码系统来实现四个基本目标：机密性、完整性、认证和不可否认性。实现这些目标中的每一个都需要满足若干设计要求，且并非所有密码系统都旨在同时实现这四个目标。在以下章节中，我们将详细探讨每个目标，并简要描述实现它们所需的技术要求。\n\
  \n#### 机密性\n\n**机密性**确保数据在三种不同情况下保持私密：静止时、传输中以及使用中。\n\n机密性或许是密码系统最广为人知的目标——即保护存储信息或个人及群体间通信的秘密性。主要有两种类型的密码系统来强制实施机密性。\n\
  \n*   **对称密码系统**使用密码系统所有用户共享的密钥。\n*   **非对称密码系统**为系统的每个用户使用各自的公钥和私钥组合。这两个概念将在本章后面的“现代密码学”部分进行探讨。\n\
  \n在为提供机密性而开发密码系统时，必须考虑三种类型的数据：\n\n*   **静止数据**，或存储数据，是指驻留在永久位置等待访问的数据。静止数据的示例包括存储在硬盘驱动器、备份磁带、云存储服务、USB\
  \ 设备和其他存储介质上的数据。\n*   **传输中数据**，或线路上的数据，是指在两个系统之间跨网络传输的数据。传输中数据可能在企业网络、无线网络或公共互联网上传输。\n\
  *   **使用中数据**是指存储在计算机系统活动内存中、可供该系统上运行的进程访问的数据。\n\n这些情况中的每一种都带来不同类型的机密性风险，密码学可以对此提供保护。例如，传输中数据可能易受窃听攻击，而静止数据则更易受物理设备盗窃的威胁。如果操作系统未正确实现进程隔离，使用中数据可能被未授权的进程访问。\n\
  \n**混淆**是一个与机密性密切相关的概念。它是指有意使代码难以被人类理解其工作原理的做法。该技术常用于隐藏软件的内部运作，特别是在包含敏感知识产权时。\n\n\
  #### 完整性\n\n**完整性**确保数据未经授权不被篡改。如果已建立完整性机制，消息接收者可以确定收到的消息与发送的消息完全相同。同样，完整性检查可确保存储的数据在创建和访问之间未被篡改。完整性控制可防范所有形式的篡改，包括第三方试图插入虚假信息的故意篡改、故意删除部分数据，以及传输过程中因故障导致的无意篡改。\n\
  \n消息完整性通过使用加密的消息摘要（称为**数字签名**）来强制实施，这些签名在消息发送时创建。消息接收者只需验证消息的数字签名是否有效，即可确保消息在传输过程中未被篡改。完整性可由公钥和密钥密码系统共同强制实施。\n\
  \n#### 认证\n\n**认证**验证系统用户声称的身份，是密码系统的主要功能之一。例如，假设 Bob 想与 Alice 建立通信会话，且两人均为共享密钥通信系统的参与者。Alice\
  \ 可能会使用质询-响应认证技术来确保 Bob 就是他声称的那个人。\n\n图 7.6 展示了此质询-响应协议的实际工作原理。在该示例中，Alice 和 Bob\
  \ 使用的共享密钥代码非常简单——仅是将每个单词的字母顺序反转。Bob 首先联系 Alice 并表明身份。随后 Alice 向 Bob 发送一条质询消息，要求他使用仅\
  \ Alice 和 Bob 知道的秘密代码加密一条简短消息。Bob 回复加密后的消息。Alice 验证加密消息正确后，即信任连线另一端的确实是 Bob 本人。\n\
  \n![图 7.6 质询-响应认证协议](img/c07f006.png)\n\n**图 7.6** 质询-响应认证协议\n\n#### 不可否认性\n\n**不可否认性**向接收者保证消息确实由发送者发出，而非冒充发送者的他人。它还防止发送者声称从未发送过该消息（即**否认**消息）。密钥（或对称密钥）密码系统（如简单替换密码）无法提供这种不可否认性保证。如果\
  \ Jim 和 Bob 参与密钥通信系统，他们都可以使用共享密钥生成相同的加密消息。不可否认性仅由公钥（或非对称）密码系统提供，本章后面将讨论该主题。\n\n\
  ### 密码学概念\n\n与任何科学一样，学习密码学前必须熟悉特定术语。让我们看看用于描述代码和密码的几个关键术语。在消息被转换为编码形式之前，称为**明文**消息，在描述加密函数时用字母\
  \ `P` 表示。消息发送者使用密码算法**加密**明文消息，生成**密文**消息，用字母 `C` 表示。该消息通过某种物理或电子方式传输给接收者。接收者随后使用预定算法**解密**密文消息，恢复明文版本。\n\
  \n#### 密码密钥\n\n所有密码算法都依赖**密钥**来维持其安全性。在大多数情况下，密钥无非是一个数字。通常是一个非常大的二进制数，但终究是一个数字。每种算法都有特定的**密钥空间**。密钥空间是指可用作特定算法密钥的有效取值范围。密钥空间由其**密钥长度**定义。密钥长度无非是密钥中二进制位（0\
  \ 和 1）的数量。密钥空间是全 0 密钥到全 1 密钥之间的范围。换一种说法，密钥空间是从 0 到 2^(`n`) 的数字范围，其中 `n` 是密钥的位大小。因此，128\
  \ 位密钥的取值范围是从 0 到 2¹²⁸（约为 3.40282367 × 10³⁸，一个极大的数字！）。保护密钥的安全绝对至关重要。事实上，密码学带来的所有安全性都建立在你保持所用密钥私密的能力之上。\n\
  \n正如你在本章将学到的，不同类型的算法需要不同类型的密钥。在私钥（或密钥）密码系统中，所有参与者使用单个共享密钥。在公钥密码系统中，每个参与者拥有自己的密钥对。密码密钥有时被称为**密码变量**。\n\
  \n创建和实现秘密代码与密码的技术称为**密码学**。与之并行的是**密码分析**技术——即研究破解代码和密码的方法。密码学和密码分析统称为**密码学**。代码或密码在硬件和软件中的具体实现称为**密码系统**。\n\
  \n#### 密码\n\n\n\n\n\n### 现代密码学\n\n#### 密码与密码套件\n\n**密码** 是用于执行加密和解密操作的算法。**密码套件**\
  \ 是系统支持的密码和密钥长度的集合。现代密码根据其操作方法分为两大类：\n\n##### 分组密码\n\n**分组密码** 对消息的“分块”或区块进行操作，并同时对整个消息块应用加密算法。置换密码是分组密码的例子。质询-响应算法中使用的简单算法会取一个完整的单词并反转其字母。更复杂的列式置换密码作用于整条消息（或消息的一部分），并使用置换算法和一个秘密关键字对其进行加密。大多数现代加密算法都实现了某种类型的分组密码。\n\
  \n##### 流密码\n\n**流密码** 一次对消息（或数据流）的一个字符或比特进行操作。凯撒密码是流密码的一个例子。一次性密码本也是一种流密码，因为该算法独立地作用于明文消息的每个字母。流密码也可以作为一种分组密码发挥作用。在此类操作中，有一个缓冲区会填充实时数据，然后将这些数据作为一个块进行加密并传输给接收方。\n\
  \n#### 现代密码学概述\n\n现代密码系统使用计算上复杂的算法和长加密密钥，以满足保密性、完整性、认证和不可抵赖性的密码学目标。以下部分将介绍加密密钥在数据安全领域中的作用，并探讨当今常用的三种算法类型：对称密钥加密算法、非对称密钥加密算法和哈希算法。\n\
  \n#### 密码学保密性\n\n在密码学的早期，主要原则之一是“通过隐秘实现安全”。一些密码学家认为，保持加密算法安全的最佳方法是向外界隐藏算法的细节。旧的密码系统要求通信双方对用于加密和解密消息的算法对第三方保密。算法的任何泄露都可能导致整个系统被对手攻破。\n\
  \n现代密码系统不依赖其算法的保密性。事实上，大多数密码系统的算法都广泛地公开供人们在相关文献和互联网上审查。向公众开放算法以供审查实际上提高了其安全性。计算机安全社区对算法的广泛分析使从业者能够发现并修正潜在的安全漏洞，并确保他们用于保护通信的算法尽可能安全。\n\
  \n现代密码系统不依赖秘密算法，而是依赖一个或多个加密密钥的保密性，这些密钥用于为特定用户或用户组个性化算法。回顾置换密码的讨论，关键字与列式置换一起用于指导加密和解密工作。用于执行列式置换的算法是众所周知的——你刚刚在本书中读到了它的细节！然而，只要选择的关键字不会被外人猜到，列式置换就可以用于双方之间的安全通信。只要保持该关键字的安全，第三方知道算法的细节也无关紧要。\n\
  \n加密密钥的长度是决定密码系统强度以及加密不被密码分析技术攻破的可能性的一个极其重要的因素。\n\n计算能力的快速提升使你能够在密码学工作中使用越来越长的密钥。然而，这种计算能力也掌握在试图攻破你所用算法的密码分析师手中。因此，必须使用足够长的密钥以超越对手，从而击败当代的密码分析工作。此外，如果你想提高数据在未来一段时间内免受密码分析威胁的安全几率，必须努力使用能在整个数据保护期间超越预期密码分析能力增长的密钥。例如，正如本章后面所述，量子计算的出现可能会改变密码学，使当前的密码系统变得不安全。\n\
  \n几十年前，当数据加密标准被创建时，56 位密钥被认为足以维护任何数据的安全。然而，现在普遍认为 56 位 DES 算法不再安全，这是由于密码分析技术和超级计算能力的进步。现代密码系统使用至少\
  \ 128 位的密钥来保护数据免受窥探。请记住，密钥长度直接关系到密码系统的工作函数；对于一个安全的密码系统，密钥越长，破解密码系统就越困难。\n\n####\
  \ 对称密钥算法\n\n**对称密钥算法** 依赖于分发给所有参与通信成员的“共享密钥”。所有参与方都使用此密钥来加密和解密消息，因此发送方和接收方都拥有共享密钥的副本。发送方使用共享密钥加密，接收方使用该密钥解密。当使用大尺寸密钥时，对称加密非常难以破解。它主要用于执行批量加密，且仅提供保密性安全服务。对称密钥密码学也称为*密钥密码学*和*私钥密码学*。图\
  \ 7.7 说明了对称密钥加密和解密过程。\n\n![图 7.7 对称密钥密码学](img/c07f007.png)\n\n**图 7.7** 对称密钥密码学\n\
  \n对称密钥密码学有几个弱点：\n\n*   **密钥分发是一个主要问题。** 在使用对称密钥协议建立通信之前，各方必须有一种安全的方法来交换秘密密钥。如果没有可用的安全电子通道，通常必须使用离线密钥分发方法（即带外交换）。\n\
  *   **对称密钥密码学不实现不可抵赖性。** 因为任何通信方都可以使用共享密钥加密和解密消息，所以无法证明给定消息的来源。\n*   **算法不可扩展。**\
  \ 大型群体使用对称密钥密码学进行通信极其困难。组内个人之间的安全私密通信只有在每一对可能的用户组合都共享一个私钥时才能实现。\n*   **密钥必须频繁重新生成。**\
  \ 每当一名参与者离开群体时，该参与者已知的所有密钥都必须废弃。\n\n对称密钥密码学的主要优势是其运行的极高速度。对称密钥加密非常快，通常比非对称算法快 1,000\
  \ 到 10,000 倍。由于所涉及数学的本质，对称密钥密码学也天然适合硬件实现，从而创造了更高速操作的机会。\n\n本章后面的“对称密码学”部分将详细介绍当今使用的主要密钥算法。\n\
  \n#### 非对称密钥算法\n\n\n\n\n#### 非对称密钥算法\n\n*非对称密钥算法*，也称为*公钥算法*，为对称密钥加密的弱点提供了解决方案。在这些系统中，每个用户拥有两个密钥：一个公钥，与所有用户共享；一个私钥，保密且仅为密钥对所有者所知。但这里有个关键点：必须配合使用相反且相关的密钥来进行加密和解密。换句话说，如果公钥加密消息，则只有相应的私钥能解密它，反之亦然。\n\
  \n图 7.8 展示了公钥密码系统中用于加密和解密消息的算法。请看这个例子。如果 Alice 想使用公钥密码学向 Bob 发送消息，她先创建消息，然后使用 Bob\
  \ 的公钥对其进行加密。解密该密文的唯一可能方法是使用 Bob 的私钥，而拥有该密钥访问权限的唯一用户就是 Bob。因此，Alice 加密后甚至无法自己解密该消息。如果\
  \ Bob 想回复 Alice，他只需使用 Alice 的公钥加密消息，然后 Alice 使用她的私钥解密来阅读消息。\n\n![图 7.8 非对称密钥密码学](img/c07f008.png)\n\
  \n**图 7.8** 非对称密钥密码学\n\n非对称密钥算法还为数字签名技术提供支持。基本原理是：如果 Bob 想向其他用户保证一条署有他名字的消息确实是由他发送的，他首先使用哈希算法创建消息摘要（关于哈希算法的更多内容请见下一节）。然后\
  \ Bob 使用他的私钥加密该摘要。任何想要验证签名的用户只需使用 Bob 的公钥解密消息摘要，然后验证解密后的消息摘要是否准确。\n\n以下是非对称密钥密码学的主要优势列表：\n\
  \n*   **添加新用户只需生成一对公私钥。** 同一密钥对用于与非对称密码系统的所有用户通信。这使得该算法具有极强的可扩展性。\n*   **从非对称系统中移除用户要容易得多。**\
  \ 非对称密码系统提供密钥吊销机制，允许取消密钥，从而有效地将用户从系统中移除。\n*   **仅当用户的私钥泄露时才需要重新生成密钥。** 如果用户离开社区，系统管理员只需使该用户的密钥失效。其他密钥均未泄露，因此无需为任何其他用户重新生成密钥。\n\
  *   **非对称密钥加密可提供完整性、认证和不可抵赖性。** 如果用户不与他人共享其私钥，则由该用户签名的消息可被证明准确且来自特定来源，且事后无法抵赖。\n\
  *   **密钥分发过程简单。** 想要参与系统的用户只需将其公钥提供给任何他们想通信的人。不存在从公钥推导出私钥的方法。\n*   **不需要预先存在的通信链路。**\
  \ 两个个体可以从通信会话开始就安全通信。非对称密码学不要求预先存在的关系即可提供安全的数据交换机制。\n\n公钥密码学的主要弱点是其运行速度较慢。因此，许多需要安全传输大量数据的应用程序使用公钥密码学建立连接，然后交换一个对称密钥。会话的其余部分则使用对称密码学。\
  \ 表 7.1 对比了对称和非对称密码系统。仔细观察该表会发现，一个系统的弱点被另一个系统的优势所弥补。\n\n**表 7.1** 对称与非对称密码系统对比\n\
  \n| 对称 | 非对称 |\n| --- | --- |\n| 单一共享密钥 | 密钥对集合 |\n| 带外交换 | 带内交换 |\n| 不可扩展 | 可扩展\
  \ |\n| 快 | 慢 |\n| 批量加密 | 小数据块、数字签名、数字证书 |\n| 机密性、完整性 | 机密性、完整性、认证、不可抵赖性 |\n\n#####\
  \ 哈希算法\n\n在上一节中，您了解到公钥密码系统结合消息摘要可提供数字签名功能。消息摘要是由哈希算法生成的消息内容摘要（类似于文件校验和）。从理想哈希函数推导出原始消息极其困难，甚至不可能，且两条不同消息产生相同哈希值的可能性极低。哈希函数为两个不同输入产生相同值的情况称为*碰撞*，碰撞的存在通常会导致哈希算法被弃用。\n\
  \n### 对称密码学\n\n您已了解对称密钥密码学、非对称密钥密码学和哈希函数的基本概念。在以下章节中，我们将深入探讨几种常见的对称密码系统：数据加密标准（`DES`）、三重\
  \ DES（`3DES`）和高级加密标准（`AES`）。\n\n#### 数据加密标准\n\n美国政府于 1977 年发布了数据加密标准，作为所有政府通信的提议标准密码系统。由于算法存在缺陷，密码学家和联邦政府不再认为\
  \ `DES` 安全。人们普遍认为情报机构会常规性地解密 `DES` 加密的信息。`DES` 于 2001 年 12 月被高级加密标准取代。理解 `DES` 仍然很重要，因为它是三重\
  \ DES（`3DES`）的构建基块，后者是下一节将讨论的一种强加密算法。\n\n`DES` 是一种 64 位分组密码，具有五种操作模式：电子密码本（`ECB`）模式、密码分组链接（`CBC`）模式、密码反馈（`CFB`）模式、输出反馈（`OFB`）模式和计数器（`CTR`）模式。这些模式将在以下章节中解释。所有\
  \ `DES` 模式一次对 64 位明文进行操作，生成 64 位密文分组。`DES` 使用的密钥长度为 56 位。\n\n`DES` 使用一长串异或（`XOR`）操作生成密文。每次加密/解密操作重复此过程\
  \ 16 次。每次重复通常称为一*轮*加密，这解释了 `DES` 执行 16 轮加密的说法。\n\n##### 电子密码本模式\n\n电子密码本（`ECB`）模式是最容易理解但安全性最低的模式。算法每次处理一个\
  \ 64 位分组时，只是使用选定的密钥加密该分组。这意味着如果算法多次遇到相同的分组，会产生相同的加密分组。如果窃听者监听通信，他们可以简单地建立所有可能加密值的“密码本”。收集足够数量的分组后，即可使用密码分析技术破译部分分组并破解加密方案。\n\
  \n这种漏洞使得 `ECB` 模式除极短传输外均不实用。在日常使用中，`ECB` 仅用于交换少量数据，例如用于启动其他 `DES` 模式的密钥和参数，以及数据库中的单元格。\n\
  \n##### 密码分组链接模式\n\n\n\n\n\n###### 密码分组链接（CBC）模式\n\n在密码分组链接（CBC）模式中，每个未加密文本分组在使用\
  \ DES 算法加密之前，都会与紧邻其前面的密文分组进行组合。解密过程只是简单地解密密文并反向执行加密操作。\n\nCBC 使用 `initialization\
  \ vector`（初始化向量，IV），这是一个随机选择的值，用于启动加密过程。CBC 获取 IV 并使用一种称为异或（XOR）的操作将其与消息的第一个分组相结合，每次执行该操作都会产生唯一的输出。IV\
  \ 必须发送给接收者，也许是将 IV 以明文形式附加在完成的密文前面，或者使用用于消息的同一密钥通过 ECB 模式加密来保护它。使用 CBC 模式时一个重要的考虑因素是错误会传播——如果传输过程中一个分组损坏，将无法解密该分组和下一个分组。\n\
  \n##### 密文反馈模式\n\n密文反馈（CFB）模式是 CBC 的流密码版本。换句话说，CFB 针对实时产生的数据进行操作。然而，它不是将消息分成分组，而是使用与分组大小相同的内存缓冲区。当缓冲区变满时，它会被加密并发送给接收者。然后系统等待下一个缓冲区随着新数据的生成而填满，随后依次被加密并传输。除了从预存数据变为实时数据外，CFB\
  \ 的操作方式与 CBC 相同。\n\n##### 输出反馈模式\n\n在输出反馈（OFB）模式中，DES 的操作方式与 CFB 模式几乎相同。然而，DES 不再是将前一个密文分组的加密版本进行异或，而是将明文与种子值进行异或。对于第一个加密分组，使用初始化向量来创建种子值。未来的种子值通过在前一个种子值上运行\
  \ DES 算法来得出。OFB 模式的主要优势在于没有链接功能，且传输错误不会传播以影响未来分组的解密。\n\n##### 计数器模式\n\n在计数器（CTR）模式下运行的\
  \ DES 使用类似于 CFB 和 OFB 模式的流密码。然而，它不是根据前一个种子值的结果为每次加密/解密操作创建种子值，而是使用一个简单的计数器，该计数器在每次操作时递增。与\
  \ OFB 模式一样，错误不会在 CTR 模式中传播。\n\n#### 三重 DES\n\n如前几节所述，面对现代密码分析技术和超级计算能力，数据加密标准的 56\
  \ 位密钥不再被认为是足够的。然而，DES 的一个改进版本，三重 DES（3DES），使用相同的算法产生更安全的加密。\n\n3DES 有四个版本。第一个版本只是使用三个不同的密钥：`K[1]`、`K[2]`\
  \ 和 `K[3]` 对明文加密三次。它被称为 DES-EEE3 模式（`E` 表示有三次加密操作，而数字 3 表示使用了三个不同的密钥）。DES-EEE3 可以用以下符号表示，其中\
  \ `E(K,P)` 表示使用密钥 `K` 对明文 `P` 进行加密：\n\n```\nE(K1,E(K2,E(K3,P)))\n```\n\nDES-EEE3\
  \ 具有 168 位的有效密钥长度。\n\n第二个变体（DES-EDE3）也使用三个密钥，但用解密操作替换了第二次加密操作。\n\n```\nE(K1,D(K2,E(K3,P)))\n\
  ```\n\n第三个版本的 3DES（DES-EEE2）仅使用两个密钥，`K[1]` 和 `K[2]`，如下所示：\n\n```\nE(K1,E(K2,E(K1,P)))\n\
  ```\n\n第四个变体（DES-EDE2）也使用两个密钥，但在中间使用解密操作，由 `D(K,C)` 函数表示，其中 `K` 是解密密钥，`C` 是待解密的密文。\n\
  \n```\nE(K1,D(K2,E(K1,P)))\n```\n\n第三和第四个变体都具有 112 位的有效密钥长度。\n\n多年来开发这四种 3DES 变体是因为几位密码学家提出理论认为某个变体比其他变体更安全。然而，目前的观点是所有模式同样安全。\n\
  \n#### 高级加密标准\n\n2000 年 10 月，美国国家标准与技术研究院宣布 Rijndael（发音为“rhine-doll”）分组密码被选为 DES\
  \ 的替代品。2001 年 11 月，NIST 发布了 FIPS 197，强制美国政府使用 AES/Rijndael 对所有敏感但非机密的数据进行加密。\n\n\
  AES 密码允许使用三种密钥强度：128 位、192 位和 256 位。AES 仅允许处理 128 位分组，但 Rijndael 超出了这一规范，允许密码学家使用等于密钥长度的分组大小。加密轮数取决于所选的密钥长度：\n\
  \n*   128 位密钥需要 10 轮加密。\n*   192 位密钥需要 12 轮加密。\n*   256 位密钥需要 14 轮加密。\n\n#### 对称密钥管理\n\
  \n由于加密密钥包含密码系统安全所必需的信息，密码系统用户和管理员有责任采取特别措施来保护密钥材料的安全。这些安全措施统称为 `key management practices`（密钥管理实践）。它们包括围绕秘密密钥的创建、分发、存储、销毁、恢复和托管的保障措施。\n\
  \n##### 对称密钥的创建与分发\n\n如前所述，`key exchange`（密钥交换）是对称加密算法的主要基础问题之一。`Key exchange` 是安全分发运行算法所需的秘密密钥。安全交换秘密密钥的三种主要方法是离线分发、公钥加密和\
  \ Diffie–Hellman 密钥交换算法。\n\n###### 离线分发\n\n技术上最简单的方法涉及密钥材料的物理交换。一方向另一方提供一张纸或一块存储介质，其中包含秘密密钥。在许多硬件加密设备中，这种密钥材料以类似于实际钥匙的电子设备形式出现，插入加密设备即可使用。然而，每种离线密钥分发方法都有其固有的缺陷。如果密钥材料通过邮件发送，可能会被拦截。电话可能被窃听。包含密钥的纸张可能被无意丢弃在垃圾桶中或丢失。\n\
  \n###### 公钥加密\n\n许多通信者希望获得秘密密钥加密的速度优势，而不想承受密钥分发的麻烦。因此，许多人使用公钥加密来建立初始通信链路。一旦链路成功建立且双方对彼此的身份感到满意，他们就会通过安全的公钥链路交换一个秘密密钥。然后他们将通信从公钥算法切换到秘密密钥算法，享受更快的处理速度。一般来说，秘密密钥加密比公钥加密快数千倍。\n\
  \n###### Diffie–Hellman\n\n在某些情况下，公钥加密和离线分发都不足够。双方可能需要相互通信，但他们没有物理手段交换密钥材料，也没有公钥基础设施来促进秘密密钥的交换。在这种情况下，像\
  \ Diffie–Hellman 算法这样的密钥交换算法被证明是极其有用的机制。\n\n##### 对称密钥的存储与销毁\n\n使用对称密钥密码学的另一个主要挑战是，密码系统中使用的所有密钥都必须保持安全。这包括遵循围绕加密密钥存储的最佳实践：\n\
  \n\n\n\n\n### 密钥管理最佳实践\n\n*   切勿将加密密钥存储在存放加密数据的同一系统上。这只会让攻击者更容易得手！\n*   对于敏感密钥，可考虑将密钥的一半提供给一名人员，另一半提供给另一名人员。随后，他们必须协作才能重建完整的密钥。这被称为\
  \ `split knowledge`（分散知识）原则（本章前面已讨论过）。\n\n当知晓密钥的用户离开组织，或不再被允许访问受该密钥保护的资料时，必须更换密钥，并使用新密钥对所有加密资料重新加密。在对称密码系统中，销毁密钥以移除用户的困难，是组织转向非对称算法的主要原因之一。\n\
  \n###### 密钥托管与恢复\n\n密码学是一种强大的工具。像大多数工具一样，它可用于多种有益目的，但也可能被用于恶意意图。为了控制密码技术的爆发式增长，世界各国政府都提出了实施密钥托管系统的想法。这些系统允许政府在有限情况下（如法院命令），从中央存储设施获取特定通信所用的加密密钥。\n\
  \n过去十年间，主要提出了两种密钥托管方法。\n\n*   **公平密码系统** — 在此托管方法中，通信中使用的密钥被分成两份或多份，每份交给一个独立的第三方。每一份单独来看毫无用处，但可重组以获得密钥。当政府获得访问特定密钥的法律授权时，它向各第三方提供法院命令的证据，然后重组密钥。\n\
  *   **托管加密标准** — 此托管方法为政府提供了一种解密密文的技术手段。该标准是 Skipjack 算法的基础。\n\n政府监管机构极不可能克服在广泛范围内实施密钥托管所必需的法律和隐私障碍。技术当然是可用的，但公众极不可能接受其所助长的潜在政府侵入性。\n\
  \n### 非对称密码学\n\n回顾本章前面的内容，`public key cryptosystems`（公钥密码系统）依赖于分配给每个密码系统用户的一对密钥。每个用户同时维护一个公钥和一个私钥。顾名思义，公钥密码系统用户将其公钥免费提供给任何想要通信的人。第三方仅持有公钥并不会给密码系统带来任何弱点。另一方面，私钥仅供密钥所有者个人使用。它绝不与任何其他密码系统用户共享。\n\
  \n公钥密码系统用户之间的正常通信非常直接，如 图 7.8 所示。请注意，该过程不要求共享私钥。发送方使用接收方的公钥加密明文消息（`P`）以生成密文消息（`C`）。当接收方打开密文消息时，他们使用自己的私钥对其解密，以重建原始明文消息。\n\
  \n一旦发送方使用接收方的公钥加密消息，在不知道接收方私钥（用于生成消息的公私钥对的另一半）的情况下，任何用户（包括发送方）都无法解密该消息。这就是公钥密码学的妙处——公钥可通过不安全通信自由共享，随后用于在互不相识的用户之间创建安全通信通道。\n\
  \n您在上一章还了解到，公钥密码学涉及更高程度的计算复杂性。公钥系统中使用的密钥必须比私钥系统中的密钥更长，才能产生同等强度的密码系统。\n\n#### RSA\n\
  \n最著名的公钥密码系统以其创建者的名字命名。1977 年，Ronald Rivest、Adi Shamir 和 Leonard Adleman 提出了 `RSA\
  \ public key algorithm`（RSA 公钥算法），该算法至今仍是全球标准。他们为该算法申请了专利，并成立了名为 RSA Security 的商业企业，以开发其安全技术的主流实现。如今，RSA\
  \ 算法已发布到公共领域，并广泛用于安全通信。\n\nRSA 算法依赖于分解大素数所固有的计算难度。密码系统的每个用户使用该算法生成一对公钥和私钥。密钥生成的具体细节超出了考试范围，但您应记住，它基于分解大素数的复杂性。\n\
  \n#### 椭圆曲线\n\n1985 年，两位数学家——华盛顿大学的 Neal Koblitz 和 IBM 的 Victor Miller——独立提出将 `elliptic\
  \ curve cryptography`（ECC，椭圆曲线密码学）理论应用于开发安全密码系统。\n\n任何椭圆曲线均可由以下方程定义：\n\n```\ny2\
  \ = x3 + ax + b\n```\n\n在该方程中，`x`、`y`、`a` 和 `b` 均为实数。每条椭圆曲线都有一个对应的 `elliptic curve\
  \ group`（椭圆曲线群），由椭圆曲线上的点以及位于无穷远处的点 `O` 组成。同一椭圆曲线群内的两个点（`P` 和 `Q`）可通过椭圆曲线加法算法相加。该运算表示为：\n\
  \n```\nP + Q\n```\n\n通过假设 `Q` 是 `P` 的倍数，即以下含义，可将此问题扩展为乘法运算：\n\n```\nQ = xP\n```\n\
  \n计算机科学家和数学家认为，即使已知 `P` 和 `Q`，找到 `x` 也极其困难。这个被称为 `elliptic curve discrete logarithm\
  \ problem`（椭圆曲线离散对数问题）的难题，构成了椭圆曲线密码学的基础。人们普遍认为，该问题比 RSA 密码系统所基于的素因子分解问题，以及 Diffie-Hellman\
  \ 所利用的标准离散对数问题，都更难解决。\n\n### 哈希函数\n\n本章稍后您将了解密码系统如何实现数字签名，以证明消息源自密码系统的特定用户，并确保消息在双方传输过程中未被篡改。在完全理解该概念之前，我们必须先解释\
  \ `hash functions`（哈希函数）的概念。我们将探讨哈希函数的基础知识，并介绍现代数字签名算法中使用的几种常见哈希函数。\n\n哈希函数的目的非常简单——它们接收一条可能很长的消息，并根据消息内容生成一个唯一的输出值。该值通常称为\
  \ `message digest`（消息摘要）。消息摘要可由消息发送方生成，并随完整消息一起传输给接收方，主要有两个原因。\n\n首先，接收方可使用相同的哈希函数，从完整消息中重新计算消息摘要。然后，他们可将计算出的消息摘要与传输的摘要进行比较，以确保发送方发送的消息与接收方收到的消息完全一致。如果消息摘要不匹配，则意味着消息在传输过程中以某种方式被修改了。重要的是要注意，消息必须\
  \ `exactly`（完全）相同，摘要才会匹配。如果消息在间距、标点或内容上即使有细微差别，消息摘要值也会完全不同。无法通过比较摘要来判断两条消息的差异程度。即使是细微的差别，也会生成完全不同的摘要值。\n\
  \n\n\n\n其次，消息摘要可用于实现数字签名算法。本章后面的“数字签名”部分将介绍这一概念。\n\n加密哈希函数有五个基本要求：\n\n* 它们接受任意长度的输入。\n\
  * 无论输入长度如何，它们都产生固定长度的输出。\n* 哈希值相对容易计算。\n* 哈希函数是单向的（意味着在提供了输出的情况下，极难确定输入）。\n* 哈希函数是\
  \ `collision` 免疫的（意味着极难找到产生相同哈希值的两条消息）。\n\n#### SHA\n\n安全哈希算法（`SHA`）及其后继者 `SHA-1`、`SHA-2`\
  \ 和 `SHA-3`，是由美国国家标准与技术研究院（`NIST`）推广的政府标准哈希函数，并在一份官方政府出版物——安全哈希标准（`SHS`）中规定，该标准也称为联邦信息处理标准（`FIPS`）180。\n\
  \n`SHA-1` 接受几乎任意长度的输入（实际上，该算法的上限约为 2,097,152 TB），并生成 160 位的消息摘要。`SHA-1` 算法以 512\
  \ 位分块处理消息。因此，如果消息长度不是 512 的倍数，`SHA` 算法会用额外数据填充消息，直到长度达到下一个 512 的倍数。\n\n密码分析攻击表明\
  \ `SHA-1` 算法存在弱点。这促使了 `SHA-2` 的诞生，后者有四个变体：\n\n* `SHA-256` 使用 512 位分块大小生成 256 位消息摘要。\n\
  * `SHA-224` 使用 `SHA-256` 哈希的截断版本，利用 512 位分块大小生成 224 位消息摘要。\n* `SHA-512` 使用 1,024\
  \ 位分块大小生成 512 位消息摘要。\n* `SHA-384` 使用 `SHA-512` 哈希的截断版本，利用 1,024 位分块大小生成 384 位摘要。\n\
  \n密码学界普遍认为 `SHA-2` 算法是安全的，但它们理论上存在与 `SHA-1` 算法相同的弱点。2015 年，联邦政府宣布发布 `Keccak` 算法作为\
  \ `SHA-3` 标准。`SHA-3` 套件的开发旨在作为 `SHA-2` 哈希函数的直接替代品，使用更安全的算法提供相同的变体和哈希长度。\n\n####\
  \ MD5\n\n1991 年，Ron Rivest 发布了其消息摘要算法的下一个版本，称为 `MD5`。它同样以 512 位分块处理消息，但使用四轮不同的计算来生成与早期\
  \ `MD2` 和 `MD4` 算法长度相同的摘要（128 位）。\n\n`MD5` 实现了显著降低消息摘要生成速度的安全特性。不幸的是，最近的密码分析攻击表明\
  \ `MD5` 协议易受碰撞攻击，这使其无法用于确保消息完整性。\n\n### 数字签名\n\n一旦选择了一个密码学上可靠的哈希算法，就可以用它来实现 `digital\
  \ signature` 系统。数字签名基础设施有两个不同的目标：\n\n* 经数字签名的消息向接收者保证该消息确实来自声称的发送者。它们强制执行不可否认性（即防止发送者事后声称消息是伪造的）。\n\
  * 经数字签名的消息向接收者保证该消息在发送者和接收者之间传输时未被篡改。这既防止恶意篡改（第三方改变消息含义），也防止无意篡改（因通信过程中的故障，如电气干扰）。\n\
  \n数字签名算法依赖于本章已介绍的两个主要概念的结合——公钥密码学和哈希函数。\n\n如果 Alice 想要对发送给 Bob 的消息进行数字签名，她会执行以下操作：\n\
  \n1. Alice 使用密码学上可靠的哈希算法（如 `SHA3-512`）生成原始明文消息的消息摘要。\n2. Alice 然后仅使用她的私钥加密消息摘要。这个加密后的消息摘要就是数字签名。\n\
  3. Alice 将签名后的消息摘要附加到明文消息后。\n4. Alice 将附加后的消息发送给 Bob。\n\n当 Bob 接收到数字签名消息时，他会反向执行该过程，步骤如下：\n\
  \n1. Bob 使用 Alice 的公钥解密数字签名。\n2. Bob 使用相同的哈希函数为从 Alice 接收到的完整明文消息创建一个消息摘要。\n3. Bob\
  \ 然后将从 Alice 接收到的解密消息摘要与他自己计算的消息摘要进行比较。如果两个摘要匹配，他可以确信收到的消息是由 Alice 发送的。如果不匹配，则消息不是由\
  \ Alice 发送的，或者消息在传输过程中被修改过。\n\n请注意，数字签名过程本身不提供任何隐私保护。它仅确保满足完整性、认证和不可否认性这些加密目标。然而，如果\
  \ Alice 想要确保发给 Bob 的消息的隐私，她可以在消息创建过程中增加一个步骤。在将签名后的消息摘要附加到明文消息后，Alice 可以用 Bob 的公钥加密整条消息。当\
  \ Bob 收到消息时，他会先用自己的私钥解密，然后再遵循上述步骤。\n\n#### HMAC\n\n哈希消息认证码（`HMAC`）算法实现了部分数字签名——它保证消息在传输过程中的完整性，但不提供不可否认性。\n\
  \n`HMAC` 可以通过使用共享密钥与任何标准消息摘要生成算法（如 `SHA-3`）结合。因此，只有知道密钥的通信双方才能生成或验证数字签名。如果接收者解密了消息摘要，但无法将其与从明文消息生成的消息摘要成功比较，则意味着消息在传输过程中被篡改。\n\
  \n因为 `HMAC` 依赖于共享密钥，所以它不提供任何不可否认性功能（如前所述）。然而，它的运行效率比下一节描述的数字签名标准更高，可能适用于对称密钥密码学适用的场景。简而言之，它代表了未加密使用消息摘要算法与基于公钥密码学的计算成本高昂的数字签名算法之间的一个折中点。\n\
  \n#### 数字签名标准\n\n美国国家标准与技术研究院在联邦信息处理标准（`FIPS`）186-4 中规定了联邦政府可用的数字签名算法，该标准也称为数字签名标准（`DSS`）。该文件规定，所有联邦批准的数字签名算法必须使用\
  \ `SHA-3` 哈希函数。\n\n`DSS` 还规定了可用于支持数字签名基础设施的加密算法。目前有三种批准的标准加密算法：\n\n* `FIPS 186-4`\
  \ 中规定的数字签名算法（`DSA`）\n* `ANSI X9.31` 中规定的 Rivest、Shamir、Adleman（`RSA`）算法\n* `ANSI\
  \ X9.62` 中规定的椭圆曲线 DSA（`ECDSA`）\n\n### 公钥基础设施\n\n公钥加密的主要优势在于其促进相互未知各方之间通信的能力。这得益于\
  \ `public key infrastructure (PKI)` 信任关系层级。这些信任关系允许将非对称密码学与对称密码学相结合，并辅以哈希和数字证书，从而实现混合密码学。\n\
  \n\n\n在以下章节中，您将了解公钥基础设施的基本组件以及使全球安全通信成为可能的加密概念。您将学习数字证书的组成、证书颁发机构的作用，以及生成和销毁证书的过程。\n\
  \n#### 证书\n\n`Digital certificates`（数字证书）为通信双方提供保证，确认他们正在通信的人确实是他们声称的那个人。数字证书本质上是个人公钥的背书副本。当用户验证证书是由受信任的\
  \ `Certificate Authority (CA)`（证书颁发机构）签名时，他们就知道该公钥是合法的。\n\n数字证书包含特定的标识信息，其构建遵循国际标准——`X.509`。符合\
  \ `X.509` 的证书包含以下证书属性：\n\n*   证书符合的 `X.509` 版本\n*   序列号（来自证书创建者）\n*   签名算法标识符（指定证书颁发机构用于对证书内容进行数字签名的技术）\n\
  *   颁发者名称（颁发证书的证书颁发机构的标识）\n*   有效期（指定证书有效期间的日期和时间——起始日期/时间和过期日期/时间）\n*   主体的 `Common\
  \ Name (CN)`（通用名称），清晰描述证书所有者（例如“`certmike.com`”）\n*   证书可选地包含 `Subject Alternative\
  \ Names (SAN)`（主体替代名称），允许您指定受单个证书保护的其他项目（IP 地址、域名等）。\n*   主体的公钥（证书的核心——证书所有者用于建立安全通信的实际公钥）\n\
  \n`X.509` 的当前版本（版本 3）支持证书扩展——由证书颁发机构插入证书中的包含数据的自定义变量，用于支持证书跟踪或各种应用程序。\n\n证书可针对多种目的颁发。这些包括为以下对象的公钥提供保证：\n\
  \n*   计算机/机器\n*   个人用户\n*   电子邮件地址\n*   开发人员（代码签名证书）\n\n证书的主体名称中可能包含通配符，表示该证书对子域名同样有效。通配符由星号字符指定。例如，颁发给\
  \ `*.certmike.com` 的通配符证书对以下所有域名均有效：\n\n*   `certmike.com`\n*   `www.certmike.com`\n\
  *   `mail.certmike.com`\n*   `secure.certmike.com`\n\n#### 证书颁发机构\n\n`Certificate\
  \ Authorities (CAs)`（证书颁发机构）是将公钥基础设施粘合在一起的关键。这些中立组织为数字证书提供公证服务。要从信誉良好的 CA 获取数字证书，您必须向\
  \ CA 证明您的身份。以下列表包含一些提供广泛接受的数字证书的主要 CA：\n\n*   Symantec\n*   IdenTrust\n*   Amazon\
  \ Web Services\n*   GlobalSign\n*   Comodo\n*   Certum\n*   GoDaddy\n*   DigiCert\n\
  *   Secom\n*   Entrust\n*   Actalis\n*   Trustwave\n\n没有任何东西能阻止组织直接开展 CA 业务。然而，CA\
  \ 颁发的证书仅取决于对颁发该证书的 CA 的信任程度。在接收第三方的数字证书时，这是一个重要的考量因素。如果您不认识或不信任颁发证书的 CA 的名称，则完全不应信任该证书。PKI\
  \ 依赖于信任关系的层级结构。如果您将浏览器配置为信任某个 CA，它将自动信任该 CA 颁发的所有数字证书。浏览器开发商预先将浏览器配置为信任主要 CA，以避免将此负担强加给用户。\n\
  \n`Registration Authorities (RAs)`（注册机构）协助 CA 在颁发数字证书前验证用户身份。它们不直接颁发证书，但在认证过程中发挥着重要作用，允许\
  \ CA 远程验证用户身份。\n\n证书颁发机构必须仔细保护其自身的私钥以维护信任关系。为此，它们通常使用 `offline CA`（离线 CA）来保护其 `root\
  \ certificate`（根证书），即其整个 PKI 的顶级证书。该离线 CA 与网络断开连接并关机，直到需要时才启用。离线 CA 使用根证书创建从属的 `intermediate\
  \ CAs`（中间 CA），它们作为 `online CAs`（在线 CA）用于日常颁发证书。\n\n在 CA 信任模型中，使用一系列中间 CA 称为 `certificate\
  \ chaining`（证书链）。要验证证书，浏览器首先验证中间 CA 的身份，然后沿着信任路径追溯到已知的根 CA，验证信任链中每个环节的身份。\n\n证书颁发机构不必是第三方服务提供商。许多组织运营内部\
  \ CA，为组织内部使用提供 `self-signed certificates`（自签名证书）。这些证书不会被外部用户的浏览器信任，但内部系统可配置为信任内部\
  \ CA，从而节省从第三方 CA 获取证书的费用。\n\n#### 证书生成与销毁\n\n公钥基础设施背后的技术概念相对简单。在以下章节中，我们将介绍证书颁发机构用于创建、验证和吊销客户端证书的过程。\n\
  \n##### 注册\n\n当您想要获取数字证书时，首先必须以某种方式向 CA 证明您的身份；此过程称为 `enrollment`（注册）。如前一节所述，这有时涉及携带适当的身份证明文件亲自出现在认证机构代理人面前。一些证书颁发机构提供其他验证方式，包括使用信用报告数据和受信任的社区领袖进行身份验证。\n\
  \n一旦您满足了证书颁发机构对身份的要求，您便以 `Certificate Signing Request (CSR)`（证书签名请求）的形式向其提供您的公钥。CA\
  \ 随后创建一个包含您标识信息和公钥副本的 `X.509` 数字证书。CA 然后使用 CA 的私钥对证书进行数字签名，并向您提供一份签名后的数字证书副本。您随后可以安全地将此证书分发给任何您想要安全通信的人。\n\
  \n证书颁发机构根据其执行的身份验证级别颁发不同类型的证书。最简单、最常见的是 `Domain Validation (DV) certificates`（域名验证证书），CA\
  \ 仅验证证书主体对域名的控制权。`Extended Validation (EV) certificates`（扩展验证证书）提供更高级别的保证，CA 在颁发证书前会采取措施验证证书所有者是否为合法企业。\n\
  \n##### 验证\n\n当您从想要通信的对象处收到数字证书时，您需使用 CA 的公钥检查 CA 的数字签名来 `verify`（验证）该证书。接下来，您必须检查并确保证书未被吊销，方法是使用\
  \ `Certificate Revocation List (CRL)`（证书吊销列表）或 `Online Certificate Status Protocol\
  \ (OCSP)`（在线证书状态协议）。此时，前提是满足以下要求，您可以假设证书中列出的公钥是真实的：\n\n*   CA 的数字签名是真实的。\n*   您信任该\
  \ CA。\n*   证书未列在 CRL 中。\n*   证书实际包含您所信任的数据。\n\n\n\n\n最后一点是一个微妙但极其重要的项目。在信任某人身份的识别信息之前，请确保该信息实际包含在证书中。如果证书包含电子邮件地址（`billjones@foo.com`）但不包含个人姓名，你只能确定其中包含的公钥与该电子邮件地址相关联。CA\
  \ 并不对 `billjones@foo.com` 电子邮件账户的实际身份做任何断言。但是，如果证书包含姓名 Bill Jones 以及地址和电话号码，CA 也将为该信息担保。\n\
  \n数字证书验证算法内置于许多流行的 Web 浏览器和电子邮件客户端中，因此你不常需要深入了解该过程的细节。然而，深入理解幕后发生的技术细节对于为你的组织做出适当的安全判断非常重要。这也是购买证书时选择一个广受信任的\
  \ CA 的原因。如果一个 CA 不包含在主流浏览器信任的 CA 列表中，或稍后被从中移除，将极大地限制你的证书的实用性。\n\n2017 年，数字证书行业发生了一起重大安全故障。Symantec\
  \ 通过一系列关联公司签发了多个不符合行业安全标准的数字证书。作为回应，Google 宣布 Chrome 浏览器将不再信任 Symantec 证书。结果，Symantec\
  \ 最终将其证书签发业务出售给了 DigiCert，后者同意在签发前妥善验证证书。这证明了妥善验证证书请求的重要性。一系列看似微小的程序疏忽可能会摧毁一家 CA\
  \ 的业务！\n\n*证书固定* 方法指示浏览器将证书与主体关联一段延长的时间。当站点使用证书固定时，浏览器将该站点与其公钥关联。这允许用户或管理员在证书意外变更时察觉并介入。\n\
  \n##### 吊销\n\n有时，证书颁发机构需要*吊销*证书。这可能因以下原因之一发生：\n\n*   证书被泄露（例如，证书所有者意外泄露了私钥）。\n*\
  \   证书被错误签发（例如，CA 在未进行适当验证的情况下错误签发了证书）。\n*   证书详细信息发生变更（例如，主体名称变更）。\n*   安全关联发生变更（例如，主体不再受雇于赞助该证书的组织）。\n\
  \n你可以使用三种技术来验证证书的真实性并识别已吊销的证书：\n\n*   **证书吊销列表** 证书吊销列表（CRL）由各个证书颁发机构维护，包含已由 CA\
  \ 签发并已吊销的证书的序列号，以及吊销生效的日期和时间。证书吊销列表的主要缺点是必须定期下载和交叉引用，在证书被吊销和最终用户收到吊销通知之间引入了一段延迟期。\n\
  \n*   **在线证书状态协议 (OCSP)** 该协议通过提供实时证书验证的手段，消除了使用证书吊销列表固有的延迟。当客户端收到证书时，它向 CA 的 OCSP\
  \ 服务器发送 OCSP 请求。服务器随后响应有效、无效或未知的状态。浏览器使用此信息确定证书是否有效。\n\n*   **证书装订** OCSP 的主要问题是它给证书颁发机构运营的\
  \ OCSP 服务器带来了巨大负担。这些服务器必须处理来自网站每个访问者或数字证书其他用户的请求，验证证书是否有效且未被吊销。\n\n    *证书装订* 是在线证书状态协议的一个扩展，它减轻了原始协议给证书颁发机构带来的部分负担。当用户访问网站并发起安全连接时，网站将其证书发送给最终用户，后者通常负责联系\
  \ OCSP 服务器以验证证书的有效性。在证书装订中，Web 服务器联系 OCSP 服务器本身，并从 OCSP 服务器接收签名并加盖时间戳的响应，然后将其附加或装订到数字证书上。然后，当用户请求安全\
  \ Web 连接时，Web 服务器将带有装订 OCSP 响应的证书发送给用户。用户的浏览器随后验证证书是否真实，并验证装订的 OCSP 响应是否真实且近期。由于\
  \ CA 对 OCSP 响应进行了签名，用户知道它来自证书颁发机构，时间戳向用户保证 CA 最近验证了该证书。从那里，通信可以照常继续。\n\n    时间节省体现在下一位用户访问网站时。只要时间戳足够近期，Web\
  \ 服务器只需重复使用装订的证书，无需再次联系 OCSP 服务器。通常装订证书的有效期为 24 小时。这将 OCSP 服务器的负担从每天处理每个用户一个请求（可能达数百万请求）减少到每天处理每个证书一个请求。这是巨大的减少。\n\
  \n#### 证书格式\n\n数字证书存储在文件中，这些文件有多种不同的格式，包括二进制和基于文本的格式：\n\n*   最常见的二进制格式是 **Distinguished\
  \ Encoding Rules (DER)** 格式。DER 证书通常存储在扩展名为 `.DER`、`.CRT` 或 `.CER` 的文件中。\n*   **Privacy\
  \ Enhanced Mail (PEM)** 证书格式是 DER 格式的 ASCII 文本版本。PEM 证书通常存储在扩展名为 `.PEM` 或 `.CRT`\
  \ 的文件中。\n*   **Personal Information Exchange (PFX)** 格式通常由 Windows 系统使用。PFX 证书可以二进制形式存储，使用\
  \ `.PFX` 或 `.P12` 文件扩展名。\n*   Windows 系统也使用 **P7B** 证书，以 ASCII 文本格式存储。\n\n表 7.2\
  \ 提供了证书格式的摘要。\n\n**表 7.2** 数字证书格式\n\n| 标准 | 格式 | 文件扩展名 |\n| --- | --- | --- |\n\
  | Distinguished Encoding Rules (DER) | 二进制 | .DER, .CRT, .CER |\n| Privacy Enhanced\
  \ Mail (PEM) | 文本 | .PEM, .CRT |\n| Personal Information Exchange (PFX) | 二进制 |\
  \ .PFX, .P12 |\n| P7B | 文本 | .P7B |\n\n### 非对称密钥管理\n\n在公钥基础设施中工作时，遵守若干最佳实践要求以维护通信安全非常重要。\n\
  \n首先，明智地选择你的加密系统。正如你之前所学，“通过隐蔽实现安全”不是一种合适的方法。选择一种算法处于公共领域且已由行业专家彻底审查的加密系统。警惕那些使用“黑盒”方法并坚持其算法的机密性对密码系统完整性至关重要的系统。\n\
  \n\n\n\n### 密钥管理最佳实践\n\n你必须以适当的方式选择密钥。使用能够在安全需求与性能考量之间取得平衡的密钥长度。此外，确保你的密钥真正随机，或者用密码学术语来说，具有足够的熵。密钥中的任何可预测性都会增加攻击者破解加密并降低密码系统安全性的可能性。你还应了解加密算法的局限性，并避免使用任何已知的弱密钥。\n\
  \n使用公钥加密时，务必保管好私钥！在任何情况下，都不允许其他人访问你的私钥。请记住，即使只允许他人访问一次，也会永久性地危害使用该密钥进行的所有通信（过去、现在或未来）的安全性，并允许第三方成功冒充你。\n\
  \n在密钥完成其使命后将其弃用。许多组织都有强制性的密钥轮换要求，以防止未被发现的密钥泄露。如果你没有必须遵循的正式策略，请根据密钥的使用频率选择合适的轮换间隔。持续重复使用密钥会产生更多加密材料，这些材料可能被用于密码分析攻击。如果切实可行，你可能需要每隔几个月更换一次密钥对。\n\
  \n备份你的密钥！如果因数据损坏、灾难或其他情况导致包含私钥的文件丢失，你肯定希望有可用的备份。你可以自行创建备份，也可以使用由第三方维护备份的密钥托管服务。无论哪种情况，都要确保备份得到安全处理。\n\
  \n**硬件安全模块（HSM）** 也提供了一种有效的加密密钥管理方式。这些硬件设备以一种安全的方式存储和管理加密密钥，防止人类需要直接处理密钥。HSM 的范围和复杂程度各不相同，从非常简单的设备（如\
  \ `YubiKey`，将加密密钥存储在 USB 驱动器上供个人使用）到驻留在数据中心的更复杂的企业级产品。云服务提供商（如 Amazon 和 Microsoft）也提供基于云的\
  \ HSM，为 IaaS 服务提供安全的密钥管理。\n\n### 密码学攻击\n\n如果时间教会了我们什么，那就是人们经常做别人认为不可能的事。每当发明一种被认为无法破解的新代码或新流程时，总有人会想出破解它的方法。\n\
  \n让我们看看一些常见的破解技术。\n\n#### 暴力破解\n\n这种方法只是尝试所有可能的密钥。它保证能成功，但可能耗时极长，以至于根本不可行。例如，要破解凯撒密码，只有\
  \ 26 个可能的密钥，可以在极短时间内尝试完毕。但即使是拥有相对较弱密钥的 DES，也需要 2⁵⁶ 次不同的尝试。那是 72,057,594,037,927,936\
  \ 个可能的 DES 密钥。为了更直观地理解，如果你每秒尝试 100 万个密钥，尝试完所有密钥需要略超过 46,190,765 年。\n\n#### 频率分析\n\
  \n**频率分析** 涉及查看加密消息的分组，以确定是否存在任何常见模式。最初，分析师不试图破解代码，而是查看消息中的模式。在英语中，字母 *e* 和 *t*\
  \ 以及 *the*、*and*、*that*、*it* 和 *is* 等单词非常常见。句子中独立存在的单个字母通常仅限于 *a* 和 *I*。\n\n坚定的密码分析师会寻找这类模式，并可能随着时间的推移推断出用于加密数据的方法。这个过程有时很简单，有时可能需要付出很大努力。此方法仅适用于本章开头讨论的历史密码，不适用于现代算法。\n\
  \n#### 已知明文攻击\n\n这种攻击依赖于攻击者拥有已知明文及其对应的密文对。这为攻击者推导密钥提供了切入点。对于现代密码，仍然需要数十亿个此类组合才有机会破解密码。然而，这种方法成功破解了德国海军的\
  \ Enigma 密码机。英国布莱切利园的破译专家意识到所有德国海军消息都以 *Heil Hitler* 结尾。他们利用这一已知明文攻击破解了密钥。\n\n####\
  \ 选择明文攻击\n\n在这种攻击中，攻击者获得其自行选择的一组明文所对应的密文。这允许攻击者尝试推导出所用的密钥，从而解密使用该密钥加密的其他消息。这可能很困难，但并非不可能。诸如差分密码分析等高级方法属于选择明文攻击的一种。\n\
  \n#### 相关密钥攻击\n\n这类似于选择明文攻击，不同之处在于攻击者可以获得在两个不同密钥下加密的密文。如果你能获得明文和匹配的密文，这实际上是一种有用的攻击。\n\
  \n#### 生日攻击\n\n这是一种基于**生日定理**的针对加密哈希的攻击。基本思想如下：\n\n> 房间里需要多少人，才能有很大可能性让其中两人的生日（月和日，不包括年份）相同？\n\
  \n显然，如果在房间里放 367 个人，其中至少有两人的生日相同，因为一年只有 365 天，加上闰年的一天。悖论不在于询问需要多少人来保证匹配，而在于需要多少人才能有很强的概率。\n\
  \n即使房间里只有 23 个人，也有 50% 的概率其中两人的生日相同。第一个人与前面任何人不共享生日的概率是 100%，因为集合中没有前面的人。这可以写为 365/365。\n\
  \n第二个人只有一个前面的人，第二个人生日与第一个人不同的概率是 364/365。第三个人可能与两个前面的人共享生日，因此其生日与前两人均不同的概率是 363/365。因为这些事件相互独立，我们可以按如下方式计算概率：\n\
  \n```\n365/365 × 364/365 × 363/365 × 362/365 … × 342/365\n```\n（342/365 是第 23 个人与前面某人生日不重合的概率。）将这些转换为十进制值（截取到小数点后第三位）可得：\n\
  \n```\n1 × 0.997 × 0.994 × 0.991 × 0.989 × 0.986 … × 0.936 = 0.49，即 49%\n```\n\n\
  这个 49% 是 23 个人没有任何共同生日的概率；因此，有 51%（大于一半的几率）的机会让这 23 个人中有两人的生日相同。\n\n数学计算结果约为 1.7\
  \ √n 即可获得碰撞。记住，碰撞是指两个输入产生相同的输出。因此，对于 MD5 哈希，你可能认为需要 2¹²⁸ + 1 个不同的输入才能获得碰撞——对于保证碰撞来说确实如此。这是一个极大的数字：3.4028236692093846346337460743177e+38。\n\
  \n\n\n\n但生日悖论告诉我们，要仅仅拥有 51% 的哈希碰撞概率，你只需要 `1.7 √ n`（其中 `n` 为 `2¹²⁸`）个输入。这个数字仍然非常大：`31,359,464,925,306,237,747.2`。但它比尝试每一个可能输入的暴力破解方法小得多。\n\
  \n#### 降级攻击\n\n*降级攻击*有时被用于针对 TLS 等安全通信，试图诱使用户或系统无意中转向安全性较低的加密模式。其思路是欺骗用户转向协议的一个安全性较低的版本，该版本可能更容易被破解。\n\
  \n#### 彩虹表、哈希与加盐\n\n*彩虹表*攻击试图通过预计算常用密码的哈希值来逆向破解哈希后的密码值。攻击者获取一份常用密码列表，并将其通过哈希函数运行以生成彩虹表。然后他们在哈希值列表中搜索，寻找与彩虹表匹配的项。防止此类攻击最常用的方法是*加盖*，即在哈希之前向每个密码添加一个随机生成的值。\n\
  \n*密钥延伸*用于以一种强健的方式从密码创建加密密钥。密钥延伸算法（如基于密码的密钥派生函数 v2，`PBKDF2`）使用数千次加盐和哈希迭代来生成能抵御攻击的加密密钥。\n\
  \n#### 利用弱密钥\n\n也存在某人使用了良好的加密算法（如 `AES`），但以一种薄弱的方式实现它的场景——例如，使用弱密钥生成。一个经典案例是有线等效保密（`WEP`）协议。该协议使用了\
  \ `RC4` 加密算法的不当实现，并存在重大安全漏洞。\n\n#### 利用人为错误\n\n人为错误是加密漏洞的主要原因之一。如果一封邮件使用加密方案发送，其他人可能会*以明文形式*（未加密）发送它。如果密码分析师同时获得了这两条消息，解码未来消息的过程将大大简化。代码密钥可能落入错误的人手中，从而泄露密钥的构成信息。许多系统正是因这类意外而被攻破。\n\
  \n一个经典案例涉及使用加密系统传输敏感军事相关消息。大多数消息都有一个前导码，告知接收者消息发给谁、谁发的、消息包含多少字符、发送日期时间及其他相关信息。在该案例中，前导码以明文发送，而这些信息也被加密并放入了消息中。结果，密码分析师获得了关于消息内容的关键线索。他们得到了约\
  \ 50 个在消息中以代码形式重复出现的字符。这个错误导致一个相对安全的系统被攻破。\n\n另一个错误是使用弱算法或已弃用的算法。随着时间的推移，某些算法不再被认为合适。这可能是因为发现了算法中的某个缺陷，也可能是因为计算能力的提升。例如，1976\
  \ 年 `DES` 被认为非常强。但计算能力的进步使其密钥长度变得太短。尽管算法本身是可靠的，但密钥大小使 `DES` 成为现代密码学的不佳选择，该算法已被弃用。\n\
  \n### 密码学中的新兴问题\n\n在备考 Security+ 考试时，你需要了解密码学和密码学应用中的一些新兴问题。让我们回顾一下 Security+ 考试大纲涵盖的一些主题。\n\
  \n#### Tor 与暗网\n\n*Tor*（前身为洋葱路由器）提供了一种机制，利用加密和一组中继节点在互联网上匿名路由流量。它依赖一种称为*完美前向保密*的技术，通过加密层防止中继链中的节点读取除其接受和转发流量所需的特定信息之外的任何内容。通过结合完美前向保密和三个或更多中继节点，Tor\
  \ 既允许匿名浏览标准互联网，也允许在暗网上托管完全匿名的站点。\n\n#### 区块链\n\n简单来说，*区块链*是一个分布式且不可篡改的公共账本。这意味着它可以以一种将记录分布在世界各地许多不同系统中的方式存储记录，并以一种防止任何人篡改这些记录的方式进行存储。区块链创建了一个没有人能篡改或销毁的数据存储。\n\
  \n区块链的第一个主要应用是*加密货币*。区块链最初是作为比特币的基础技术而发明的，允许在没有中心化权威的情况下追踪比特币交易。通过这种方式，区块链允许存在一种没有中央监管机构的货币。比特币交易的权威性分布在比特币区块链的所有参与者中。\n\
  \n尽管加密货币是受关注最多的区块链应用，但分布式不可变账本还有许多其他用途。以至于新的区块链技术应用似乎每天都在出现。例如，财产所有权记录可以从区块链应用中获益良多。这种方法将把这些记录放在一个透明的公共存储库中，该存储库受到保护，免受故意或意外损坏。区块链技术也可用于追踪供应链，让消费者确信其农产品来自信誉良好的来源，并允许监管机构轻松追溯召回农产品的来源。\n\
  \n#### 轻量级密码学\n\n在你的职业生涯中，你可能会遇到许多密码学的专用用例，在这些场景中计算能力和能源可能受到限制。\n\n一些设备在极低功耗下运行，并极其重视节能。例如，想象一下将一颗带有有限电源的卫星发射入太空。成千上万小时的工程工作都用于从该电源中榨取尽可能多的寿命。类似的情况也发生在地球上，远程传感器必须利用太阳能、小电池或其他条件传输信息。\n\
  \n智能卡是另一个低功耗环境的例子。它们必须能够与智能卡读取器安全通信，但仅使用存储在卡上的能量或通过磁场传输给它的能量。\n\n在这些情况下，密码学家通常会设计专用硬件，专门用于以尽可能少的功耗实现轻量级加密算法。你不需要知道这些算法如何工作的细节，但你应该熟悉这样一个概念：专用硬件可以最小化功耗。\n\
  \n密码学的另一个专用用例是需要极低延迟的情况。这仅意味着加密和解密不应花费太长时间。加密网络链路是低延迟密码学的一个常见例子。数据在网络上快速移动，加密应尽可能快地完成，以避免成为瓶颈。\n\
  \n专用加密硬件也解决了许多低延迟需求。例如，专用 VPN 硬件设备可能包含加密硬件，以高效形式实现加密和解密操作，从而最大化速度。\n\n\n\n### 高弹性需求\n\
  \n当数据保存至关重要且在加密操作期间绝不能意外销毁时，就会存在高弹性需求。在弹性极其重要的情况下，解决该问题最简单的方法是数据发送方保留一份副本，直到接收方确认成功接收并解密了数据。\n\
  \n#### 同态加密\n\n隐私顾虑也为加密引入了一些专用用例。特别是，我们有时会遇到这样的应用场景：我们想要保护个人隐私，但仍想对其数据执行计算。`Homomorphic\
  \ encryption`（同态加密）技术使这成为可能，它以一种保留在该数据上执行计算能力的方式对数据进行加密。当你使用同态算法加密数据，然后对该数据执行计算时，你会得到一个结果，该结果在解密后，与你最初对明文数据执行计算所获得的结果相匹配。\n\
  \n#### 量子计算\n\n`Quantum computing`（量子计算）是一个新兴领域，旨在利用量子力学执行计算和通信任务。它目前仍主要是一个理论领域，但如果它发展到理论可付诸实施的程度，量子密码学可能会攻破那些依赖于大素数分解的加密算法。\n\
  \n同时，量子计算可用于开发更强大的加密算法，其安全性将远超现代方法。我们将拭目以待，看这些技术如何发展，以便在后量子时代为我们提供强大的量子通信。\n\n###\
  \ 摘要\n\n密码学是当今最重要的安全控制之一，它几乎涉及安全的每个其他领域，范围从网络到软件开发。密码学的使用支持在各种应用中提供机密性、完整性、认证和不可抵赖性的目标。\n\
  \n对称加密技术使用共享密钥为静态数据和动态数据提供安全保护。只要用户能够克服密钥交换和维护问题，对称加密就是快速且高效的。非对称密码学和公钥基础设施（`PKI`）提供了一种可扩展的方式来安全通信，特别是在通信双方没有先前关系的情况下。\n\
  \n### 考试要点\n\n**理解密码学的目标。** 密码学的四个目标是机密性、完整性、认证和不可抵赖性。机密性是使用加密来保护敏感信息免受窥探。完整性是使用密码学确保数据未被恶意或无意地篡改。认证是指使用加密来验证个人身份。不可抵赖性确保个人能够向第三方证明消息来自其声称的发送者。\n\
  \n**解释对称加密和非对称加密的区别。** 对称加密使用相同的共享密钥来加密和解密信息。用户必须拥有某种机制来交换这些共享密钥。`Diffie–Hellman`（迪菲-赫尔曼）算法提供了一种方法。非对称加密为每个用户提供一对密钥：一个公钥，可自由共享；一个私钥，必须保密。用该对中的一个密钥加密的任何内容，都可以用该对中的另一个密钥解密。\n\
  \n**解释数字签名如何提供不可抵赖性。** 数字签名通过允许第三方验证消息的真实性来提供不可抵赖性。发送方通过使用哈希函数生成消息摘要，然后用自己的私钥加密该摘要来创建数字签名。其他人可以通过用发送方的公钥解密数字签名，并将解密后的消息摘要与他们自己使用哈希函数对消息计算出的摘要进行比较，来验证数字签名。\n\
  \n**理解数字证书的目的和用途。** 数字证书提供了一种可信机制，用于与其他个人共享公钥。用户和组织从证书颁发机构（`CA`）获取数字证书，`CA` 通过应用其数字签名来表明对该证书的信任。如果接收方信任颁发\
  \ `CA` 并验证 `CA` 的数字签名，他们就可以依赖数字证书中包含的公钥。\n\n**展示对密码学新兴问题的熟悉程度。** `Tor` 使用完美前向保密来允许在互联网上进行匿名通信。`blockchain`（区块链）是一种通过密码学实现的不可变分布式公共账本。`Homomorphic\
  \ encryption`（同态加密）允许在保护敏感数据的同时，仍以保护隐私的方式促进对该数据的计算。`Quantum computing`（量子计算）挑战现代密码学方法，未来可能成为一种颠覆性力量。\n\
  \n### 复习题\n\n1. Mike 正在使用对称加密算法向 David 发送加密消息。他应该使用什么密钥来加密消息？\n\n    1. Mike 的公钥\n\
  \    2. Mike 的私钥\n    3. David 的公钥\n    4. 共享密钥\n\n2. Alan 的团队需要对敏感个人信息执行计算，但不需要访问底层数据。团队可以使用什么技术在不访问数据的情况下执行这些计算？\n\
  \n    1. 量子计算\n    2. 区块链\n    3. 同态加密\n    4. 证书绑定\n\n3. Norm 正在使用全盘加密技术来保护笔记本电脑内容防止被盗。他试图实现密码学的哪个目标？\n\
  \n    1. 完整性\n    2. 不可抵赖性\n    3. 认证\n    4. 机密性\n\n4. Brian 发现一名涉嫌窃取敏感信息的用户正在向留言板发布大量图像文件。该人员可能使用什么技术将敏感信息隐藏在这些图像中？\n\
  \n    1. 隐写术\n    2. 同态加密\n    3. 重放攻击\n    4. 生日攻击\n\n5. 以下关于加密密钥的陈述哪一项是不正确的？\n\
  \n    1. 所有加密密钥都应保密。\n    2. 使用相同算法时，较长的密钥优于较短的密钥。\n    3. 非对称算法通常使用比对称算法更长的密钥。\n\
  \    4. 数字证书旨在共享公钥。\n\n6. 哪种密码一次对文本的一个字符进行操作？\n\n    1. 分组密码\n    2. 位密码\n    3.\
  \ 流密码\n    4. 平衡密码\n\n7. Vince 正在为其组织选择一种对称加密算法。他希望从以下选项中选择最强的算法。他应该选择哪种算法？\n\n\
  \    1. DES\n    2. 3DES\n    3. RSA\n    4. AES\n\n8. Kevin 正在配置 Web 服务器以使用数字证书。他可以使用什么技术允许客户端快速验证该数字证书的状态，而无需联系远程服务器？\n\
  \n    1. CRL\n    2. OCSP\n    3. 证书装订\n    4. 证书绑定\n\n9. Acme Widgets 有 10 名员工，他们都需要使用对称加密系统相互通信。该系统应允许任意两名员工安全通信，而不被其他员工窃听。如果增加第\
  \ 11 名员工，系统必须添加多少个新密钥？\n\n    1. 1\n    2. 2\n    3. 10\n    4. 11\n\n10. 参考第 9\
  \ 题的场景，如果 Acme Widgets 改用非对称加密算法，增加第 11 名员工需要多少个密钥？\n\n    1. 1\n    2. 2\n    3.\
  \ 10\n    4. 11\n\n\n\n### 11. 哪种类型的数字证书能提供最高级别的保证，确证书所有者就是他们声称的那个人？\n\n1.  DV\n\
