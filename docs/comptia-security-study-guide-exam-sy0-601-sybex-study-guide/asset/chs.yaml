  \ CI/CD，但我们无法确定 Susan 是否在使用敏捷。\n\n**7. B.** 从事活跃代码更改的开发人员应始终在开发环境中工作。测试环境是可以在不影响生产环境的情况下对软件或系统进行测试的地方。预发布环境是通过测试并等待部署到生产环境的代码的过渡环境。生产环境是实时系统。经过测试和批准的软件、补丁和其他更改会移至生产环境。\n\
