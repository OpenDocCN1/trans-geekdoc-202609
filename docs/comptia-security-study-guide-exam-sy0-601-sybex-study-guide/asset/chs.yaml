  \ 5 和 RAID 6 性能较慢但可在驱动器故障时幸存。RAID 1（镜像）提供冗余和读取速度，但不能提高写入速度。\n\n#### 5\n**B.** 虚拟机快照捕获某一时间点的机器状态，将允许\
  \ Cynthia 克隆该系统。完全备份和差异备份可用于捕获机器的磁盘，但通常不会捕获内存状态和其他系统状态细节。LiveCD 允许你从受信任介质引导并运行一个非持久化系统。\n\
