  \ 题\n\n**1. C.** 威胁狩猎是一种假设已遭入侵的评估技术，随后在组织中搜索入侵指标以验证该假设。漏洞扫描、渗透测试和无线网络侦测都是探测漏洞的评估技术，但它们不假设已经发生了入侵。\n\
