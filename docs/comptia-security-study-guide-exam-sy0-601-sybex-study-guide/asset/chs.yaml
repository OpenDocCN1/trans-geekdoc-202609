  \n### 10. Chris 想要运行一个作为两块磁盘镜像的 RAID。他需要实施哪个 RAID 级别？\n\n1.  0\n2.  1\n3.  2\n4.\
  \  5\n\n### 11. Glenn 所在的电力公司将他们的配电节点构建在外观像房子或其他适合其社区环境的建筑物结构中。这是什么类型的物理安全控制？\n\n\
  1.  检测性控制\n2.  工业伪装\n3.  DMZ\n4.  纠正性控制\n\n### 12. 以下哪项不是嵌入式和专用系统的常见约束？\n\n1.  计算能力\n\
  2.  过于复杂的防火墙设置\n3.  缺乏网络连接\n4.  无法打补丁\n\n### 13. Gary 正在查看他系统的 SSH 日志，发现用户 \"Gary\"\
  \ 有登录记录，尝试的密码类似于：password1, passsword2 … PassworD。Gary 发现了哪种类型的攻击？\n\n1.  字典攻击\n\
  2.  彩虹表攻击\n3.  传递哈希攻击\n4.  密码喷洒攻击\n\n### 14. Kathleen 想建立一个系统，允许从低安全区域访问高安全区域。她应该配置哪种类型的解决方案？\n\
  \n1.  VDI\n2.  容器\n3.  DMZ\n4.  跳板机\n\n### 15. Derek 的组织在文档处置前会安全粉碎所有文件，并保护其垃圾。他们试图防止哪种信息收集技术？\n\
  \n1.  肩窥\n2.  域名劫持\n3.  垃圾箱搜寻\n4.  尾随\n\n### 16. Jeff 担心勒索软件攻击可能对其组织造成的影响，并正在设计一种备份方法，以便在发生此类攻击后组织能够快速恢复数据。Jeff\
  \ 正在实施哪种类型的控制？\n\n1.  纠正性\n2.  预防性\n3.  检测性\n4.  威慑性\n\n### 17. Samantha 正在调查一起网络安全事件，一名内部用户使用他的计算机参与了针对第三方的拒绝服务攻击。最有可能违反了哪种策略？\n\
  \n1.  BPA\n2.  SLA\n3.  AUP\n4.  MOU\n\n### 18. Jean 最近完成了用户验收测试流程，并准备部署她的代码。在代码发布使用之前，应该将其放在什么环境中？\n\
  \n1.  测试\n2.  生产\n3.  开发\n4.  预发布\n\n### 19. Rob 是一名审计师，正在审查一家公司用于向供应商开具支票的付款流程。他注意到员工会计\
  \ Helen 负责创建新供应商。另一位会计 Norm 负责向供应商发放付款。Helen 和 Norm 经过交叉培训，可以互相提供备份。这种情况下存在什么安全问题（如果有）？\n\
  \n1.  职责分离违规\n2.  最小权限违规\n3.  双人控制违规\n4.  无问题\n\n### 20. Oren 为其域获得了一个涵盖 `*.acmewidgets.net`\
  \ 的证书。以下哪个域名将**不**受此证书保护？\n\n1.  `www.acmewidgets.net`\n2.  `acmewidgets.net`\n\
  3.  `test.mail.acmewidgets.net`\n4.  `mobile.acmewidgets.net`\n\n### 21. 以下哪个函数调用与\
  \ Linux 命令注入攻击密切相关？\n\n1.  `sudo()`\n2.  `system()`\n3.  `mkdir()`\n4.  `root()`\n\
  \n### 22. Richard 正在给 Grace 发送一条消息，并希望在发送前对该消息应用数字签名。他应该使用哪个密钥来创建数字签名？\n\n1.  Richard\
  \ 的私钥\n2.  Richard 的公钥\n3.  Grace 的私钥\n4.  Grace 的公钥\n\n### 23. 哪种类型的加密攻击对以哈希格式存储的密码特别有效？\n\
  \n1.  选择明文攻击\n2.  密钥延伸\n3.  降级攻击\n4.  彩虹表攻击\n\n### 24. Stephanie 正在审查客户交易数据库，并发现了下面显示的数据表。以下哪种数据最小化技术最有可能被用于模糊该表中的信用卡信息？\n\
  \n![](img/fintrouf001.png)\n\n1.  销毁\n2.  掩码\n3.  哈希\n4.  令牌化\n\n### 25. Vince 正在对一个组织进行渗透测试，并认为他能够获得对该组织设施的物理访问权限。这种访问允许他利用哪种威胁向量，而该向量在其他情况下是不可用的？\n\
  \n1.  供应链\n2.  无线\n3.  云\n4.  直接访问\n\n### 26. Gary 的组织正在进行网络安全演练。Gary 负责在测试期间防御其系统免受攻击。Gary\
  \ 在演练中扮演什么角色？\n\n1.  蓝队\n2.  红队\n3.  白队\n4.  紫队\n\n### 27. Andrew 正在与他的财务团队合作，购买一份网络安全保险单，以覆盖数据泄露的财务影响。他使用的是哪种风险管理策略？\n\
  \n1.  风险规避\n2.  风险转移\n3.  风险接受\n4.  风险缓解\n\n### 28. 以下哪种虚拟化模型提供最高级别的效率？\n\n1.  I\
  \ 型管理程序\n2.  II 型管理程序\n3.  III 型管理程序\n4.  IV 型管理程序\n\n### 29. Shelly 正在编写一份文档，描述事件响应团队在首次注意到潜在事件时将遵循的步骤。她正在创建哪种类型的文档？\n\
  \n1.  指南\n2.  标准\n3.  程序\n4.  策略\n\n\n\n\n### 30. Xavier 最近对其子女学校使用的网络进行了端口扫描。扫描完成后，他给学校的\
  \ IT 部门发送了邮件，告知他们自己进行了扫描，并分享了结果以帮助他们改进安全性。哪个术语最能对 Xavier 的活动进行分类？\n\n1.  黑帽\n2.\
  \  白帽\n3.  蓝帽\n4.  灰帽\n\n## 评估测试答案\n\n#### 1. C\n禁用自动修补的最常见原因是避免有问题或有缺陷的补丁和更新带来的问题。在大多数环境中，定期修补的需求已被接受，且对于办公人员的处理不会造成重大干扰。如果被修补的系统是工业流程或工厂生产环境的一部分，这种担忧就会有所不同。来自合法来源（如自动更新存储库）的恶意补丁极其罕见，并不是这种行为的常见顾虑或驱动因素。\n\
  \n### 2. D\nS/MIME 用于保护附件，但不保护电子邮件的标题。它确实提供了认证、不可抵赖性和消息完整性。\n\n### 3. C\n近场通信（NFC）是无线支付系统最常用的技术。NFC\
  \ 提供了极短距离、低带宽的无线连接，非常适合支付系统。无线 USB 确实存在，但未被广泛使用。蜂窝网络和蓝牙不常用于无线支付系统，尽管确实存在一些蓝牙实现。\n\
  \n### 4. B\n日志以及任何无意频繁覆盖而存储在磁盘上的文件，都是此处列出的最后一个易失性项目。按从最易失性到最不易失性的顺序，你可以将这些答案列为：CPU\
  \ 寄存器、系统路由表、临时文件和日志。\n\n#### 5. A\n如果 Ed 能导致其目标与当前连接的接入点断开关联，他可以使用更高的发射功率或更近的接入点，使其在接入点列表中显得排名更高。如果他成功诱骗用户或系统连接到他的\
  \ AP，他就可以发起中间人攻击或尝试其他漏洞利用。拒绝服务攻击不太可能导致系统与另一个 AP 关联，而已知明文攻击是一种密码学攻击，不适用于此类尝试。\n\n\
  ### 6. D\n在地图或图表上显示相对功率的现场勘测称为热力图。这有助于显示接入点在哪些位置提供强信号，以及由于信道重叠或其他问题，多个 AP 可能在哪些位置相互竞争。它还有助于识别信号无法到达的盲区。\n\
  \n### 7. D\n硬件信任根提供了一个唯一元素，意味着该板卡或设备无法被复制。`TPM`（可信平台模块）常用于提供硬件信任根。对于常见的台式机和笔记本电脑，CPU\
  \ 和系统内存并不以这种方式具有唯一性，而 `HSM`（硬件安全模块）用于创建、管理和存储加密证书，以及执行和卸载加密操作。\n\n### 8. B\n对两个文件名使用\
  \ `cat` 命令只会将两个文件都显示到终端。将一个文件追加到另一个文件需要将输出重定向到该文件，例如 `cat example.txt >> example2.txt`。\n\
  \n#### 9. A\nAngela 需要保留密码历史记录并设置最短密码使用期限，以便用户不能简单地重置密码，直到更改次数足以绕过历史记录检查。\n\n###\
  \ 10. B\nRAID 1 是两块磁盘的镜像，每块磁盘都是另一块磁盘的完整副本。RAID 0 是两块磁盘的条带化，不提供冗余，而是专注于性能。RAID 2\
  \ 很少使用，它对数据进行条带化并使用错误校正。RAID 5 按数据块进行条带化，并将奇偶校验信息分布在各驱动器中。\n\n### 11. B\n将建筑设计得不起眼或不易被注意到，是一种工业伪装形式，常用于帮助设施融入环境，降低其成为恶意行为者攻击目标的可能性。这是一种预防性控制，而非检测性或纠正性控制，并且它不会创建非军事区。\n\
  \n### 12. B\n嵌入式和专用系统往往拥有较低功耗的 CPU、较少的内存、较少的存储空间，且通常可能无法处理加密算法或内置安全工具等 CPU 密集型任务。因此，拥有防火墙的可能性相对较小，特别是当没有内置网络连接或设备预期部署在安全网络中时。\n\
  \n#### 13. A\n字典攻击将使用一组可能的密码及这些密码的常见变体来尝试破解账户。针对单一用户 ID 使用各种密码迭代进行重复登录，很可能是字典攻击。彩虹表用于将哈希密码与生成该哈希值的密码进行匹配。传递哈希攻击提供捕获的认证哈希，试图冒充授权用户。密码喷射攻击使用已知密码（通常来自泄露）尝试登录许多不同的网站。\n\
  \n### 14. D\n跳板机是用于在不同安全区域提供存在和访问路径的系统或服务器。`VDI` 是虚拟桌面基础设施，用于提供受控的虚拟系统以提高生产力和应用程序呈现等。容器是一种提供可扩展、可预测的应用程序环境的方式，而无需完整的底层虚拟系统，`DMZ`\
  \ 是暴露于较低信任级别区域或人群的安全区域。\n\n### 15. C\n垃圾箱搜寻作为情报收集行动的一部分，从垃圾中回收纸质记录甚至电子设备和介质。Derek\
  \ 的组织正在采取两种常见措施来防止这种行为。肩窥涉及从某人肩上窥视以获取信息，域名劫持攻击试图将流量重定向到攻击者提供的站点，而攻击者在实施尾随攻击时会跟随授权员工通过安全门或其他入口。\n\
  \n#### 16. A\n纠正性控制修复已经发生的安全问题。勒索软件攻击后恢复备份就是纠正性控制的一个例子。\n\n#### 17. C\n此活动几乎可以肯定违反了组织的可接受使用策略，该策略应包含描述组织网络和计算资源适当使用的条款。\n\
  \n#### 18. D\n开发人员在处理活跃的代码变更时，应始终在开发环境中工作。测试环境是可以在不影响生产环境的情况下测试软件或系统的地方。预发布环境是已成功通过测试并等待部署到生产环境的代码的过渡环境。生产环境是实时系统。经过测试和批准的软件、补丁和其他变更会移至生产环境。\n\
  \n### 19. A\n这种情况违反了职责分离原则。公司似乎设计了控制措施，将供应商创建与付款发放分开，这是一种良好的防欺诈做法。然而，他们经过交叉培训以互相备份的事实意味着他们拥有违反这一原则所需的权限。\n\
  \n#### 20. C\n通配符证书保护列出的域以及所有一级子域。`test.mail.acmewidgets.net` 是 `acmewidgets.net`\
  \ 的二级子域，不在此证书的覆盖范围内。\n\n### 21. B\n`system()` 函数在应用程序内针对操作系统执行命令字符串，并可能被用于命令注入攻击。\n\
  \n### 22. A\n消息的发送者可以通过使用发送者自己的私钥加密消息摘要来对消息进行数字签名。\n\n\n\n### 23. D. 彩虹表攻击通过预先计算常用密码的哈希值，尝试反转哈希后的密码值。攻击者获取一份常用密码列表，并将其通过哈希函数运行以生成彩虹表。然后他们在哈希值列表中搜索，寻找与彩虹表匹配的项。\n\
  \n### 24. C. 这些数据最接近哈希数据，因为字段长度相同，且似乎包含无意义但唯一的数据。如果字段经过标记化处理，则更有可能包含顺序号或其他可识别的标识符。如果字段经过掩码处理，则会包含星号或其他占位符字符。\n\
  \n### 25. D. 在未获得目标设施访问权限的情况下，Vince 可以发起无线、云或供应链攻击。然而，实施直接访问攻击需要物理访问权限，只有在他渗透测试期间能够进入设施时才有可能。\n\
  \n### 26. A. 蓝队负责管理组织的防御。红队在尝试访问目标网络上的系统时会使用进攻性黑客技术。白队作为演练的中立协调者。紫队演练在演习后进行，旨在将红队和蓝队聚集在一起进行知识共享。\n\
  \n### 27. B. 购买保险是风险转移最常见的例子——将责任转移给第三方。\n\n### 28. A. I 型管理程序，也称为裸金属管理程序，直接在物理硬件之上运行管理程序，无需主机操作系统。II\
  \ 型管理程序需要主机操作系统，这会降低效率。III 型和 IV 型管理程序不存在。\n\n### 29. C. 程序提供清单式的分步说明集，指导员工在特定情况下应如何反应。程序通常指导事件响应的早期阶段。\n\
  \n### 30. D. Xavier 未经许可运行了此扫描，因此不能被归类为白帽黑客。然而，他没有恶意意图，所以也不是黑帽黑客。这种活动介于这两种分类之间，因此最好描述为灰帽黑客行为。\n\
  \n### 第 1 章：当今的安全专业人员\n\n安全专业人员在当今复杂的威胁环境中发挥着保护组织的关键作用。他们负责保护其组织使用的信息和信息系统的机密性、完整性和可用性。履行这一职责需要深入了解其组织面临的威胁环境，并致力于设计和实施一套能够应对挑战、回应这些威胁的控制措施。\n\
  \n在本章的第一节中，您将了解网络安全的基本目标：运营的机密性、完整性和可用性。在后续章节中，您将了解可以采取的一些控制措施，以保护最敏感的数据免受窥探。本章为本书其余部分奠定了基础，您将在其中深入探讨网络安全的许多不同领域。\n\
  \n### 网络安全目标\n\n当大多数人想到网络安全时，他们会想象黑客试闯入组织的系统并窃取敏感信息，范围涵盖从社会安全号和信用卡到最高机密军事信息。尽管防止敏感信息未经授权的披露当然是网络安全计划的一个要素，但重要的是要理解网络安全实际上有三个互补的目标，如图\
  \ 1.1 所示。\n\n![FIGURE 1.1 网络安全计划的三个关键目标是机密性、完整性和可用性。](img/c01f001.png)\n\n**图 1.1**\
  \ 网络安全计划的三个关键目标是机密性、完整性和可用性。\n\n*机密性* 确保未经授权的个人无法访问敏感信息。网络安全专业人员开发和实施安全控制，包括防火墙、访问控制列表和加密，以防止未经授权访问信息。攻击者可能试图破坏机密性控制以实现其目标之一：未经授权披露敏感信息。\n\
  \n*完整性* 确保信息或系统没有未经授权的修改，无论是有意还是无意的。完整性控制，如哈希和完整性监控解决方案，旨在强制执行此要求。完整性威胁可能来自寻求未经授权篡改信息的攻击者，也可能来自非恶意来源，例如电源浪涌导致信息损坏。\n\
  \n*可用性* 确保信息和系统随时准备好在合法用户请求时满足其需求。可用性控制，如容错、集群和备份，旨在确保合法用户能够按需获得访问权限。与完整性威胁类似，可用性威胁可能来自寻求中断访问的攻击者，也可能来自非恶意来源，例如火灾摧毁了包含宝贵信息或服务的数据中心。\n\
  \n网络安全分析师在执行工作时经常提及这三个目标，称为 *CIA 三要素*。在描述风险、攻击和安全控制时，他们通常将其描述为满足 CIA 三要素的三个目标中的一个或多个。\n\
  \n### 数据泄露风险\n\n当组织遭遇信息或信息系统的机密性、完整性和/或可用性被破坏时，就会发生 *安全事件*。这些事件可能是恶意活动的结果，例如攻击者以组织为目标并窃取敏感信息；也可能是意外活动的结果，例如员工将未加密的笔记本电脑遗留在网约车后座上；还可能是自然活动的结果，例如地震摧毁了数据中心。\n\
  \n安全专业人员负责了解这些风险，并实施旨在将风险管理在可接受水平的控制措施。为此，他们首先必须了解泄露可能对组织产生的影响，以及可能产生的持续影响。\n\n\
  #### DAD 三要素\n\n本章前面介绍了 CIA 三要素，用于描述网络安全的三个主要目标：机密性、完整性和可用性。图 1.2 展示了一个相关模型：*DAD\
  \ 三要素*。该模型解释了对网络安全工作的三大关键威胁：*泄露*、*篡改* 和 *拒绝*。这三大威胁分别直接对应网络安全的三大主要目标。\n\n![FIGURE\
  \ 1.2 对网络安全计划的三大关键威胁是泄露、篡改和拒绝。](img/c01f002.png)\n\n**图 1.2** 对网络安全计划的三大关键威胁是泄露、篡改和拒绝。\n\
  \n- **泄露** 是指敏感信息暴露给未经授权的个人，也称为 *数据丢失*。泄露违反了机密性原则。攻击者获得敏感信息并将其从组织中移出，被称为实施 *数据渗漏*。泄露也可能意外发生，例如管理员错误配置访问控制或员工丢失设备时。\n\
  \n\n\n\n### 核心安全概念：CIA 与 DAD 三要素\n\n#### Alteration（篡改）\n\n**Alteration** 是对信息的未授权修改，违反了**完整性**原则。攻击者可能为了经济利益而修改系统中的记录，例如向金融账户添加欺诈交易。篡改也可能由自然活动引起，例如电源浪涌导致“位翻转”而修改存储的数据。如果用户因拼写错误或其他无意活动而无意中修改了关键系统中存储的信息，也可能发生意外篡改。\n\
  \n#### Denial（拒绝服务）\n\n**Denial** 是对授权用户合法访问信息的非预期中断。拒绝服务事件违反了**可用性**原则。这种可用性损失可能是故意的，例如攻击者对网站发起分布式拒绝服务（DDoS）攻击。拒绝服务也可能由意外活动引起，例如关键服务器故障，或由自然活动引起，例如自然灾害影响通信线路。\n\
  \n#### CIA 与 DAD 三要素的应用\n\nCIA 和 DAD 三要素是网络安全规划和风险分析的非常有用的工具。每当你面临评估用于保护资产的安全控制或组织面临的威胁这一广泛目标时，都可以求助于\
  \ CIA 和 DAD 三要素以获得指导。例如，如果要求你评估组织网站面临的威胁，你可以在分析中应用 DAD 三要素：\n\n*   网站是否包含敏感信息？如果向未授权个人披露，是否会损害组织？\n\
  *   如果攻击者能够修改网站上的信息，这种未授权篡改是否会给组织造成财务、声誉或运营损害？\n*   网站是否执行关键任务活动？如果攻击者能够中断网站，是否会对业务造成重大损害？\n\
  \n这只是使用 DAD 三要素为风险评估提供信息的一个示例。你可以在几乎任何情况下使用 CIA 和 DAD 模型，作为更详细风险分析的有益起点。\n\n###\
  \ Breach Impact（安全事件影响）\n\n安全事件的影响可能范围很广，具体取决于事件的性质和受影响组织的类型。我们可以使用企业通常用来描述任何类型风险的相同类别，对安全事件的潜在影响进行分类：财务、声誉、战略、运营和合规。\n\
  \n让我们更详细地探讨这些风险类别。\n\n#### Financial Risk（财务风险）\n\n**Financial risk** 顾名思义，是指因数据泄露而导致组织遭受金钱损失的风险。这可能是非常直接的财务损失，例如数据中心被物理损毁后的重建成本，或聘请专家进行事件响应和取证分析服务的成本。\n\
  \n财务风险也可能是间接的，作为泄露的二阶后果出现。例如，如果员工丢失了一台包含新产品计划的笔记本电脑，组织会因实物笔记本电脑的损失而遭受几千美元的直接财务损失。然而，间接财务损失可能更为严重，因为竞争对手可能获得这些产品计划并抢先上市，导致潜在的巨大收入损失。\n\
  \n#### Reputational Risk（声誉风险）\n\n**Reputational risk** 发生在围绕安全漏洞的负面宣传导致客户、员工、供应商和其他利益相关者失去善意时。量化声誉损害通常很困难，因为这些利益相关者可能不会直接表示他们将因安全漏洞而减少或停止与组织的业务往来。然而，该漏洞仍可能影响他们未来与组织开展业务的决策。\n\
  \n#### Strategic Risk（战略风险）\n\n**Strategic risk** 是指组织因泄露而无法有效实现其主要目标和宗旨的风险。再次考虑员工丢失包含新产品开发计划的笔记本电脑的例子。该事件可能以两种不同方式给组织带来战略风险。首先，如果组织没有这些计划的另一份副本，它们可能无法将新产品推向市场，或可能遭受重大的产品开发延迟。其次，如果竞争对手获得这些计划，他们可能能够更快地将竞争产品推向市场，甚至抢在组织之前上市，获得先发优势。这两种影响都表明了对组织执行其业务计划能力的战略风险。\n\
  \n#### Operational Risk（运营风险）\n\n**Operational risk** 是对组织执行其日常职能能力的风险。运营风险可能会减慢业务流程、延迟客户订单交付，或要求实施耗时的手动变通方法来替代正常的自动化实践。\n\
  \n运营风险和战略风险密切相关，因此可能难以区分它们。请从影响的性质和程度方面考虑两者的区别。如果风险威胁到组织的生存或组织执行其业务计划的能力，那就是严重危及组织持续生存能力的战略风险。另一方面，如果风险仅在组织内部造成低效和延迟，则更适合归入运营风险类别。\n\
  \n#### Compliance Risk（合规风险）\n\n**Compliance risk** 发生在安全漏洞导致组织触犯法律或法规要求时。例如，《健康保险流通与责任法案》（HIPAA）要求医疗服务提供者和其他受保实体保护受保护健康信息（PHI）的机密性、完整性和可用性。如果组织丢失患者病历，即违反了\
  \ HIPAA 要求，并面临美国卫生与公众服务部的制裁和罚款。这就是合规风险的一个例子。\n\n组织在当今的监管环境中面临许多不同类型的合规风险。这些风险的性质取决于组织运营的司法管辖区、组织所在的行业以及组织处理的数据类型。我们将在\
  \ Chapter 16 “Security Policies, Standards, and Compliance”中更详细地讨论这些合规风险。\n\n###\
  \ Implementing Security Controls（实施安全控制）\n\n当组织分析其风险环境时，技术和业务领导者确定为保护其信息和系统的机密性、完整性和可用性所需的保护级别。他们通过编写组织希望实现的\
  \ **control objectives**（控制目标）来表达这些要求。这些控制目标是期望安全状态的陈述，但它们本身并不实际执行安全活动。**Security\
  \ controls**（安全控制）是满足组织安全目标的具体措施。\n\n#### Security Control Categories（安全控制类别）\n\n\
  安全控制根据其作用机制（即实现目标的方式）进行分类。安全控制有三个不同类别：\n\n*   **Technical controls**（技术控制）在数字空间中强制执行机密性、完整性和可用性。技术安全控制的示例包括防火墙规则、访问控制列表、入侵防御系统和加密。\n\
  \n*   **Operational controls**（运营控制）包括我们为以安全方式管理技术而建立的流程。这些包括用户访问审查、日志监控和漏洞管理。\n\
  \n\n\n\n#### 管理控制\n\n**管理控制** 是关注风险管理过程机制的程序性机制。管理控制的示例包括定期风险评估、安全规划演练，以及将安全纳入组织的变更管理、服务采购和项目管理实践中。\n\
  \n组织应根据其为环境选择的标准和参数，或由外部监管机构强加的标准和参数，选择一组满足其控制目标的安全控制。例如，处理敏感信息的组织可能会决定，围绕该信息的机密性顾虑要求最高级别的控制。同时，他们可能会得出结论，其网站的可用性并非至关重要。鉴于这些考虑，他们会投入大量资源用于敏感信息的机密性，而可能很少（甚至完全不）投入时间和金钱来保护其网站免受拒绝服务攻击。\n\
  \n许多控制目标需要技术、运营和管理控制的组合。例如，组织可能有防止未经授权访问数据中心的控制目标。他们可能通过实施生物识别访问控制（技术控制）、定期审查授权访问（运营控制）以及进行例行风险评估（管理控制）来实现这一目标。\n\
  \n##### 安全控制类型\n\nCompTIA 还根据安全控制的预期效果将其分为不同类型。安全控制类型包括以下内容：\n\n*   **预防控制** 旨在在安全问题发生之前将其阻止。防火墙和加密是预防控制的示例。\n\
  *   **检测控制** 用于识别已经发生的安全事件。入侵检测系统属于检测控制。\n*   **纠正控制** 用于修复已经发生的安全问题。勒索软件攻击后恢复备份是纠正控制的一个示例。\n\
  *   **威慑控制** 旨在防止攻击者尝试违反安全策略。凶猛的看门狗和带刺铁丝网围栏是威慑控制的示例。\n*   **物理控制** 是影响物理世界的安全控制。物理安全控制的示例包括围栏、周界照明、门锁、火灾抑制系统和防盗报警器。\n\
  *   **补偿控制** 是为降低因安全策略例外而产生的风险而设计的控制。\n\n#### 数据保护\n\n安全专业人员花费大量时间专注于敏感数据的保护。我们作为管家和守护者，保护由组织创建并由客户及其他利益相关者托付给我们的敏感数据的机密性、完整性和可用性。\n\
  \n在思考数据保护技术时，考虑数据可能存在的三种状态会很有帮助：\n\n*   **静态数据** 是驻留在硬盘、磁带、云端或其他存储介质上的存储数据。此类数据容易被获得系统访问权限的内部人员或外部攻击者窃取，他们能够浏览系统内容。\n\
  *   **传输中数据** 是在网络上传输的数据。当数据在不受信任的网络上传输时，任何有权访问这些网络的人都可能发起窃听攻击。\n*   **处理中数据** 是计算机系统正在活跃使用的数据。这包括处理过程中存储在内存中的数据。控制系统的攻击者可能能够读取内存内容并窃取敏感信息。\n\
  \n我们可以使用不同的安全控制来保护所有这些状态下的数据，构建一套强大的防御体系，保护组织的核心利益。\n\n##### 数据加密\n\n**加密** 技术使用数学算法来保护信息免受窥探，无论数据是在网络上传输还是驻留在系统上。对于没有相应解密密钥的人来说，加密数据是不可理解的，这使得通过其他不安全的方式存储和传输加密数据成为安全的。\n\
  \n我们将在第 7 章“密码学和公钥基础设施”中深入探讨加密工具和技术。\n\n#### 数据丢失防护\n\n**数据丢失防护 (DLP)** 系统帮助组织执行信息处理策略和程序，以防止数据丢失和盗窃。它们搜索系统中可能未受保护的敏感信息存储，并监控网络流量中潜在的将敏感信息移出组织的尝试。它们可以迅速采取行动在造成损害前阻止传输，并向管理员发出警报。\n\
  \nDLP 系统在两种不同的环境中工作：\n\n*   基于主机的 DLP\n*   基于网络的 DLP\n\n基于主机的 DLP 使用安装在系统上的软件代理来搜索这些系统上是否存在敏感信息。这些搜索经常在最意想不到的地方发现社会安全号、信用卡号和其他敏感信息！\n\
  \n检测到存储的敏感信息的存在，使安全专业人员能够采取及时行动将其删除或使用加密进行保护。现在花时间保护或删除信息，如果设备日后丢失、被盗或受到威胁，可能会获得丰厚的回报。\n\
  \n基于主机的 DLP 还可以监控系统配置和用户操作，阻止不良操作。例如，一些组织使用基于主机的 DLP 来阻止用户访问基于 USB 的可移动介质设备，防止其将信息带出组织的安全环境。\n\
  \n基于网络的 DLP 系统是部署在网络上的专用设备，用于监控出站网络流量，监视任何包含未加密敏感信息的传输。然后它们可以阻止这些传输，防止敏感信息的不安全丢失。\n\
  \nDLP 系统可能只是阻止违反组织策略的流量，或者在某些情况下，它们可能会自动对内容应用加密。这种自动加密通常用于专注于电子邮件的 DLP 系统。\n\nDLP\
  \ 系统还有两种作用机制：\n\n*   **模式匹配**，即监视敏感信息的明显迹象。例如，如果它们看到格式类似信用卡或社会安全号的数字，可以自动触发。同样，它们可能包含敏感术语数据库（如“绝密”或“商业机密”），并在传输中发现这些术语时触发。\n\
  *   **水印技术**，即系统或管理员向敏感文档应用电子标签，然后 DLP 系统可以监控系统和网络中包含这些标签的未加密内容。\n\n水印技术也常用于**数字版权管理\
  \ (DRM)** 解决方案中，以执行版权和数据所有权限制。\n\n##### 数据最小化\n\n**数据最小化** 技术旨在通过减少我们定期维护的敏感信息量来降低风险。实现数据最小化的最佳方法是在数据不再满足我们最初的业务目的时直接销毁。\n\
  \n如果我们无法从数据集中完全移除数据，通常可以将其转换为原始敏感信息去标识化的格式。**去标识化** 过程移除了将数据关联回个人的能力，从而降低其敏感性。\n\
  \n去标识化数据的替代方案是将其转换为无法检索原始信息的格式。这个过程称为**数据混淆**，我们有几种工具可协助完成此过程：\n\n\n\n\n\n#####\
  \ 哈希\n\n**哈希** 使用哈希函数将数据集中的值转换为相应的哈希值。如果我们对数据元素应用强哈希函数，则可以用哈希值替换文件中的值。\n\n#####\
  \ 标记化\n\n**标记化** 使用查找表将敏感值替换为唯一标识符。例如，我们可能会用随机生成的 10 位数字替换广为人知的值（如学生 ID）。然后我们将维护一个查找表，以便在需要确定某人身份时将这些数字转换回学生\
  \ ID。当然，如果你使用这种方法，你需要确保查找表的安全！\n\n##### 掩码\n\n**掩码** 通过用空白字符替换部分或全部敏感字段，来部分遮盖敏感信息。例如，我们可能会用\
  \ `X` 或 `*` 替换信用卡号除最后四位以外的所有数字，使卡号无法读取。\n\n尽管无法直接从哈希值检索原始值，但这种方法存在一个主要缺陷。如果有人拥有某字段可能值的列表，他们可以进行所谓的\
  \ **彩虹表攻击**。在这种攻击中，攻击者计算这些候选值的哈希值，然后检查这些哈希值是否存在于我们的数据文件中。\n\n例如，假设我们有一个文件，列出了我们学院所有挂科的学生，但我们对他们的学生\
  \ ID 进行了哈希处理。如果攻击者拥有所有学生的名单，他们可以计算所有学生 ID 的哈希值，然后检查哪些哈希值在列表中。因此，哈希只能谨慎使用。\n\n###\
  \ 总结\n\n网络安全专业人员负责确保其组织维护的信息和系统的机密性、完整性和可用性。机密性确保未经授权的个人无法访问敏感信息。完整性确保信息或系统不存在未经授权的修改，无论是有意还是无意的。可用性确保信息和系统已准备好在合法用户请求时满足其需求。这三个目标统称为\
  \ **CIA 三要素**。\n\n当网络安全分析师寻求保护其组织时，他们必须评估对 **CIA 三要素** 的风险。这包括从管理、运营和技术控制类别中设计和实施适当的安全控制组合。这些控制在类型上也应多样化，包括预防、检测、纠正、威慑、物理和补偿控制的组合。\n\
  \n### 考试要点\n\n**网络安全的三个目标是机密性、完整性和可用性。** 机密性确保未经授权的个人无法访问敏感信息。完整性确保信息或系统不存在未经授权的修改，无论是有意还是无意的。可用性确保信息和系统已准备好在合法用户请求时满足其需求。\n\
  \n**安全控制可根据其作用机制和意图进行分类。** 控制根据其实现目标的方式分为管理、运营和技术三类。它们根据预期目的分为预防、检测、纠正、威慑、补偿和物理类型。\n\
  \n**数据泄露对组织有重大且多样的影响。** 当组织遭受数据泄露时，由此导致的数据丢失通常会导致直接和间接损害。组织因事件响应相关成本而遭受即时财务损失，并因声誉受损而面临长期财务后果。这种声誉损害可能难以量化，但也可能产生持久影响。在某些情况下，如果组织遭受可用性损害，导致无法访问自身信息，可能会遭受运营损害。\n\
  \n**数据必须在传输中、静止时和使用中受到保护。** 攻击者可能试图窃听包含敏感信息的网络传输。除非受到加密技术保护，否则传输中的信息极易受到攻击。攻击者也可能试图入侵数据存储，窃取静止数据。加密不仅用于保护传输中的数据，也用于保护存储的数据。数据在系统上使用时也很脆弱，应在数据处理活动期间受到保护。\n\
  \n**数据丢失防护系统阻止数据渗漏尝试。** **DLP** 技术强制执行信息处理策略以防止数据丢失和盗窃。**DLP** 系统可在主机级别运行，使用软件代理搜索系统中是否存在敏感信息。它们也可在网络级别运行，监控未加密敏感信息的传输。**DLP**\
  \ 系统使用模式匹配技术和/或数字水印来检测敏感信息。\n\n**数据最小化通过减少我们维护的敏感信息量来降低风险。** 在我们无法简单丢弃不必要信息的情况下，我们可以通过非标识化和数据混淆来保护信息。用于实现这些目标的工具包括对敏感字段进行哈希、标记化和掩码处理。\n\
  \n### 复习题\n\n1.  Matt 正在更新组织的威胁评估流程。Matt 实施的是哪类控制？\n\n    1.  运营\n    2.  技术\n \
  \   3.  纠正\n    4.  管理\n\n2.  Jade 所在的组织最近遭遇了一起影响存储信用卡数据的安全漏洞。Jade 主要担心的是，该组织因违反支付卡行业数据安全标准的规定而面临制裁。什么类别的风险让\
