  \ $100,000\n    3.  $500,000\n    4.  $600,000\n\n6.  **年化发生率 (`ARO`) 是多少？**\n\n\
  \    1.  0.05\n    2.  0.20\n    3.  2.00\n    4.  5.00\n\n7.  **年化损失期望值 (`ALE`)\
  \ 是多少？**\n\n    1.  $5,000\n    2.  $25,000\n    3.  $100,000\n    4.  $500,000\n\
  \n8.  **第 8–11 题参考以下场景：**\n\n    Grace 最近完成了对其组织面临数据泄露风险的评估，确定存在与敏感个人信息丢失相关的高风险。她正在考虑多种管理该风险的方法。\n\
  \n    **Grace 的第一个想法是添加一个 Web 应用程序防火墙，以保护组织免受 SQL 注入攻击。这种方法采用了哪种风险管理策略？**\n\n  \
  \  1.  风险接受\n    2.  风险规避\n    3.  风险缓解\n    4.  风险转移\n\n9.  **Grace 正在考虑放弃收集和存储敏感个人信息的客户业务活动。这种方法将使用哪种风险管理策略？**\n\
