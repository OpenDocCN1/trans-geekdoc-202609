  终端安全\n\n保护组织中的终端是许多安全专业人员日常任务的重要组成部分。对于大多数组织而言，终端的数量远超服务器和网络设备，且由于最终用户控制或使用它们，它们面临着各种各样的威胁，而这些威胁是服务器不太可能遇到的。\n\
  \n在本章中，您将首先了解终端保护技术，包括如何保护系统的启动过程；反恶意软件和防病毒工具如何检测、预防和修复恶意软件感染；以及为何允许列表和阻止列表对于控制终端系统上可运行的应用程序很有用。您还将了解数据丢失防护、网络防御技术等概念，以及系统和服务加固涉及的内容。配置标准、命名和\
  \ IP 寻址方案、补丁管理，以及在磁盘和介质重复使用或退役时如何处理，也是加固和系统保护过程的一部分。最后，您将探索一些常见的文件操作命令行工具，以及为 Security+\
  \ 考试所需熟悉的脚本、安全传输和 Shell 实用程序。\n\n本章后半部分重点介绍嵌入式和专用系统，这些是常见的终端设备，其安全需求不同于传统的桌面和移动操作系统。您将了解一些嵌入式平台，以及驱动其专用需求的操作系统和芯片，还有它们所集成的系统，例如用于工业自动化和管理的\
  \ SCADA 和 ICS 系统。您将探索物联网，以及它和其他专用系统对安全的影响。嵌入式系统使用的通信详情以及嵌入式系统所需的安全约束将作为本章的总结。\n\n\
  ### 保护终端\n\n作为一名安全专业人员，您将被要求推荐、实施、管理或评估旨在保护台式机、移动设备、服务器以及组织中各种其他系统的安全解决方案。这些设备通常被称为\
  \ `endpoints`（终端），意味着它们是网络的一个端点，无论是有线还是无线网络。\n\n鉴于如此广泛的潜在终端范围，安全选项的菜单也非常广泛。作为一名安全从业者，您需要知道有哪些选项存在，它们通常部署在何处以及如何部署，以及您需要考虑哪些因素。\n\
  \n#### 保持启动完整性\n\n在终端运行时保持其安全，始于其启动过程。如果不受信任或恶意的组件被插入启动过程，则无法信任该系统。高安全环境中的安全从业者需要一种方法来确保整个启动过程具有可证明的安全性。\n\
  \n幸运的是，现代统一可扩展固件接口（`UEFI`）固件（传统基本输入/输出系统 [`BIOS`] 的替代品）可以利用两种不同的技术来确保系统安全。`Secure\
  \ boot`（安全启动）确保系统仅使用原始设备制造商（`OEM`）信任的软件进行启动。要执行安全启动操作，系统必须拥有一个签名数据库，其中列出了启动过程中受信任软件和固件的安全签名（请参见图\
  \ 11.1）。\n\n![图 11.1 UEFI 安全启动高级流程](img/c11f001.png)\n\n**图 11.1** UEFI 安全启动高级流程\n\
  \n\n\n第二个旨在帮助防止引导级恶意软件的安全功能是*可度量启动*。这些启动过程会对每个组件进行度量，从固件开始，到引导启动驱动程序结束。可度量启动不会在启动前针对已知良好的签名列表进行验证；相反，它依赖\
  \ UEFI 固件对固件、引导加载程序、驱动程序以及启动过程的任何其他部分进行哈希处理。收集到的数据存储在可信平台模块（TPM）中，日志可以远程验证，以让安全管理员了解系统的启动状态。此启动证明过程允许与已知良好状态进行比较，如果可度量启动显示与接受的或安全的已知状态存在差异，管理员可以采取行动。此过程允许远程服务器根据其提供的信息做出关于系统状态的决策，从而实现访问控制和隔离选项。\n\
  \n在这两种情况下，启动完整性都始于硬件信任根。系统的硬件信任根包含保护启动过程的加密密钥。这意味着系统或设备固有地信任硬件信任根，并且它必须是安全的。硬件信任根的一种常见实现是内置在许多计算机中的\
  \ TPM 芯片。TPM 芯片常用于提供内置加密，并提供三大主要功能，您可能还记得在第 1 章“今日安全专业人员”中提到过：\n\n*   远程证明，允许验证硬件和软件配置\n\
  *   绑定，用于加密数据\n*   密封，用于加密数据并在解密前设置 TPM 芯片的状态要求\n\nTPM 芯片是一种常见解决方案；其他解决方案包括无法修改或克隆的序列号，以及物理不可克隆函数（PUF），它们对于特定硬件设备是唯一的，可为设备提供唯一标识符或数字指纹。\n\
  \n一项相关技术是硬件安全模块（HSM）。硬件安全模块通常是外部设备或插拔卡，用于创建、存储和管理用于加密功能和身份验证的数字密钥，以及卸载加密处理。HSM 常用于高安全环境，通常经过认证，符合联邦信息处理标准（FIPS）140\
  \ 或通用标准等标准。\n\n#### 端点安全工具\n\n系统运行后，确保系统本身安全是一项复杂的任务。针对端点系统有多种类型的安全工具可用，且解决方案市场持续演变，这意味着传统的工具类别界限往往模糊不清。尽管如此，仍存在一些有助于描述功能和工具类型的常见概念和类别。\n\
  \n##### 杀毒软件和反恶意软件\n\n最常见的安全工具之一是杀毒软件和反恶意软件。尽管新恶意软件包中不断出现更先进的反检测、混淆和其他防御工具，但在许多情况下，在企业环境中使用反恶意软件包仍然是一个有用的防御层。\n\
  \n此类工具通过多种方式检测恶意软件和应用程序。以下是最常见的方法：\n\n*   *基于特征的检测*，使用哈希或其他特征生成方法来识别先前观察到的文件或恶意软件组件。传统反恶意软件工具通常依赖基于特征的检测作为系统的第一道防线，但攻击者越来越多地使用多态性等方法，在每次安装时都改变恶意软件，以及加密和打包技术，使特征变得不那么有用。\n\
  \n*   *启发式或基于行为的检测*，查看恶意软件采取的操作，并将其与不需要的活动配置文件进行匹配。基于启发式的检测系统可以根据恶意软件的行为来识别新恶意软件，而不仅仅是寻找与已知指纹的匹配。\n\
  \n*   *AI 和机器学习系统*在整个安全工具领域越来越普遍。它们利用大量数据来寻找识别恶意软件的方法，这可能包括启发式、特征和其他检测能力。\n\n* \
  \  *沙箱*被某些工具和反恶意软件供应商自身用于隔离并运行恶意代码样本。沙箱是一个受保护的环境，可在其中运行未知、不受信任、潜在危险或已知恶意的代码以对其进行观察。沙箱经过检测，允许记录软件采取的所有操作，从而提供深入分析的能力。\n\
  \n反恶意软件工具可安装在移动设备、台式机和其他端点上，如处理网络流量、电子邮件的设备和系统，以及恶意软件可能攻击或被检测到的任何其他地方。多年来，使用反恶意软件包一直是安全专业人员的一致建议，因为它是防止系统被感染或攻破的最后一道防线。这也意味着攻击者专注于绕过和击败反恶意软件程序，包括将相同工具用作测试新恶意软件的一部分。\n\
  \n在考虑部署反恶意软件工具时，有几个关键决策需要牢记。首先，您需要确定可能面临的威胁以及它们可能遇到的位置。在许多组织中，大多数恶意软件威胁是在个人工作站和笔记本电脑上遇到的，或者是通过电子邮件发送和接收的。因此，反恶意软件产品部署重点关注这两个领域。\n\
  \n其次，在企业环境中，工具的管理、部署和监控至关重要。允许集中可见性和报告的反恶意软件工具可与其他安全工具集成，以便轻松查看系统和设备的状态。第三，您部署的检测能力以及反恶意软件产品检测、阻止和删除恶意软件的总体可能性在决策过程中起着重要作用。由于恶意软件是一种不断演变的威胁，许多组织选择部署多种反恶意软件技术，希望提高检测可能性。\n\
  \n##### 允许列表和拒绝列表\n\n防止恶意软件在系统上被使用的一种方法是控制可以安装或使用的应用程序。这就是允许列表和拒绝或阻止列表工具发挥作用的地方。允许列表工具允许您构建一个允许在系统上存在和运行的软件、应用程序和其他系统组件列表。如果它们不在列表中，将被移除或禁用，或无法安装。阻止列表或拒绝列表是不能安装或运行的软件或应用程序列表，而不是允许列表。解决方案的选择取决于管理员和安全专业人员想要实现的目标。如果系统需要极高的安全级别，允许列表将比阻止或拒绝列表提供更高的安全性，但如果特定程序被认为是不受欢迎的，阻止列表不太可能干扰未知或新的应用程序或程序。\n\
  \n尽管这些工具听起来很有吸引力，但由于维护列表所需的工作量，它们在大多数组织中并未广泛部署。有限部署和特定用途在组织中更为常见，允许列表和阻止列表的其他版本以防火墙和类似保护技术的形式实现。\n\
  \n##### 端点检测和响应\n\n\n\n###### 端点检测与响应\n\n当反恶意软件工具不足以应对威胁时，可以部署端点检测与响应（EDR）工具。EDR\
  \ 工具将使用客户端或软件代理在端点设备和系统上的监控能力，与网络监控和日志分析能力相结合，以收集、关联和分析事件。EDR 系统的关键功能包括搜索和探索收集到的数据并将其用于调查的能力，以及检测可疑数据的能力。\n\
  \n随着安全分析工具的持续发展，EDR 系统倾向于使用自动化规则和检测引擎来查找异常和妥协指标（IoC），同时也允许人工调查。EDR 系统的强大之处在于，它能让处理海量安全数据的组织也能轻松使用并受益于这种检测和报告能力。\n\
  \n如果您正在考虑部署 EDR，您需要关注组织需求，例如：事件响应能力；处理来自各种来源的威胁的能力，范围涵盖从恶意软件到数据泄露；以及在组织更广泛的背景下过滤和审查大量端点数据的能力。\n\
  \n#### 数据丢失防护\n\n保护组织数据免遭窃取和无意泄露，是驱动使用 `data loss prevention`（DLP）工具的原因。DLP 工具可以以客户端或应用程序的形式部署到端点。这些工具通常也具有网络和服务器驻留组件，以确保数据在其整个生命周期和各种处理过程中都得到管理。\n\
  \nDLP 系统的关键要素包括：对数据进行分类的能力，以便组织了解哪些数据应受保护；数据标记或标记功能，以支持分类和管理实践；用于按照组织设定的标准管理数据的策略管理和执行功能；以及监控和报告能力，以便快速通知管理员或安全从业人员有关问题或潜在问题。\n\
  \n某些 DLP 系统还提供额外功能，在数据发送到受保护区域之外时对其进行加密。此外，它们可能包含旨在允许共享数据而不造成潜在泄露的功能，通过令牌化、擦除或以其他方式修改数据，以允许在不违反\
  \ DLP 环境中设定的数据策略的前提下使用数据。\n\n绘制组织数据图谱，然后根据数据分类系统或策略应用适当的控制，对于 DLP 系统的成功至关重要。与反恶意软件和\
  \ EDR 系统非常相似，某些 DLP 系统还会跟踪用户行为，以识别可疑行为或常见错误，例如给文件分配过于宽泛的权限，或通过电子邮件或云文件服务共享敏感文档。\n\
  \n当然，即使部署了 DLP，也很可能存在绕过系统的方法。拍摄屏幕照片、剪切和粘贴、或打印敏感数据，都可能让恶意或粗心的用户从环境中提取数据，即使已部署有效且管理良好的数据丢失防护工具。因此，DLP\
  \ 系统是分层安全基础设施的一部分，它将技术和管理解决方案（如数据丢失防护）与基于组织及其数据所面临风险的策略、意识和其他控制相结合。\n\n#### 网络防御\n\
  \n可以使用基于主机的防火墙来阻止不需要的流量，从而保护端点免受网络攻击。基于主机的防火墙内置于大多数现代操作系统中，且通常默认启用。当然，基于主机的防火墙无法深入洞察其过滤的流量，因为它们通常只是简单地阻止或允许特定的应用程序、服务、端口或协议。更高级的过滤需要更深入地了解被分析流量的本质，这正是基于主机的入侵防御系统或入侵检测系统发挥作用的地方。\n\
  \n基于主机的入侵防御系统（HIPS）会在主机上的服务或应用程序处理流量之前对其进行分析。HIPS 可以对该流量采取行动，包括过滤掉恶意流量或阻断接收到的数据中的特定元素。HIPS\
  \ 会检查分散在多个数据包中或贯穿整个通信系列的流量，从而能够捕获可能分散或复杂的恶意活动。由于 HIPS 可以主动阻断流量，将合法流量误判为恶意、配置错误或其他问题可能导致合法流量被阻断，从而潜在地造成中断。如果您选择部署\
  \ HIPS 或任何其他可以主动阻断流量的工具，您需要考虑如果出现问题会发生什么。\n\n基于主机的入侵检测系统（HIDS）执行类似的功能，但像传统的入侵检测系统（IDS）一样，它无法采取行动阻断流量。相反，HIDS\
  \ 只能报告问题并发出警报。因此，HIDS 在实时安全方面用途有限，但它导致问题的可能性要低得多。\n\n在部署和管理基于主机的防火墙、HIPS 或 HIDS\
  \ 之前，请确定如何管理它们、单个配置的复杂程度如何，以及如果基于主机的保护出现问题会发生什么。这并不意味着您不应该部署它们！细粒度控制是零信任设计的重要组成部分，强化主机有助于确保安全边界后的受损系统不会给组织带来更广泛的问题。\n\
  \n图 11.2 显示了基于主机的防火墙、HIPS 和 HIDS 的典型部署位置，以及网络防火墙或 IPS/IDS 设备可能放置的位置。请注意，由于流量经过的网络交换机，流量可以在网络安全设备后面在系统之间移动，而这些设备无法看到该流量。在组织网络中，这些安全边界可能针对非常大的网络段，其中可能有数百甚至数千个系统，它们可能在未经过网络安全设备过滤的情况下进行通信。\n\
  \n![图 11.2 主机防火墙和 IPS 系统与网络防火墙和 IPS 系统的对比](img/c11f002.png)\n\n**图 11.2** 主机防火墙和\
  \ IPS 系统与网络防火墙和 IPS 系统的对比\n\n### 强化端点和系统\n\n确保系统安全启动只是保持其安全的第一步。强化端点和其他系统依赖于多种技术，以保护系统及其上运行的软件。\n\
  \n#### 强化\n\n强化系统或应用程序涉及更改系统上的设置，以提高其整体安全级别并降低其受攻击的脆弱性。系统攻击面的概念（即可能受到攻击的位置）在执行系统强化时非常重要。强化工具和脚本是对系统执行基本强化过程的常用方法，互联网安全中心（CIS），网址为\
  \ [`www.cisecurity.org/cis-benchmarks`](http://www.cisecurity.org/cis-benchmarks)，以及国家安全局，网址为\
  \ [`apps.nsa.gov/iaarchive/library/ia-guidance/security-configuration/?page=3`](http://apps.nsa.gov/iaarchive/library/ia-guidance/security-configuration/?page=3)，为操作系统、浏览器和各种其他强化目标提供强化指南。\n\
  \n#### 服务强化\n\n\n\n##### 减少系统攻击面的最快方法之一是减少其提供的开放端口和服务的数量\n\n毕竟，如果攻击者无法远程连接到系统，他们直接利用系统漏洞的难度将大大增加。端口扫描器常用于快速评估网络上系统的开放端口，使安全从业人员能够识别并确定加固目标的优先级。加固的简单经验法则是：只有必须可用以提供必要服务的服务和端口才应开放，并且这些端口和服务应仅限于它们需要交互的网络或系统。不幸的是，对许多服务器而言，这可能意味着系统需要面向全球开放。\n\
  \n表 11.1 列出了 Linux 和 Windows 系统中一些最常见的开放端口和服务。\n\n##### 表 11.1 常见端口和服务\n\n| 端口和协议\
  \ | Windows | Linux |\n| --- | --- | --- |\n| **22/TCP – Secure Shell (SSH)** |\
  \ 不常见 | 常见 |\n| **53/TCP 和 UDP – DNS** | 常见（服务器） | 常见（服务器） |\n| **80/TCP – HTTP**\
  \ | 常见（服务器） | 常见（服务器） |\n| **125-139/TCP 和 UDP – NetBIOS** | 常见 | 偶见 |\n| **389/TCP\
  \ 和 UDP – LDAP** | 常见（服务器） | 常见（服务器） |\n| **443/TCP – HTTPS** | 常见（服务器） | 常见（服务器）\
  \ |\n| **3389/TCP 和 UDP – 远程桌面协议** | 常见 | 不常见 |\n\n虽然使用防火墙阻止服务是一种可行的选择，但对于不需要的服务，最好的选择是彻底禁用它们。在\
  \ Windows 中，你可以使用 图 11.3 中所示的 `Services.msc` 控制台来禁用或启用服务。请注意，此处远程桌面服务设置为手动启动，这意味着除非系统用户启动它，否则无法访问。\n\
  \n![图 11.3 Services.msc 显示远程桌面服务设置为手动](img/c11f003.png)\n\n**图 11.3** `Services.msc`\
  \ 显示远程桌面服务设置为手动\n\n在 Linux 中启动和停止服务需要知道你的 Linux 发行版如何处理服务。对于 Ubuntu Linux 系统，可以通过使用\
  \ `service –status-all` 命令来检查正在运行的服务。启动和停止服务可以通过多种方式完成，但 `service` 命令是一种简便的方法。发出\
  \ `sudo service [`*`服务名称`*`] stop` 或 `start` 命令将启动或停止一项服务，只需使用 `service -status-all`\
  \ 命令提供的信息来识别你要关闭的服务即可。然而，永久停止服务将要求你进行其他更改。对于 Ubuntu，将调用 `update-rc.d` 脚本，而 RedHat\
  \ 和 CentOS 系统则使用 `chkconfig`。\n\n幸运的是，对于 Security+ 考试，你不需要知道特定操作系统的命令。相反，你应该理解禁用服务以减少系统攻击面的概念，并且了解需要持续的审查和维护，以确保新的服务和应用程序不会随着时间的推移而出现。\n\
  \n#### 操作系统加固\n\n操作系统加固依赖于更改设置以匹配给定系统所需的安全态势。流行的基准和配置标准可用作基础，并根据组织需求进行修改，从而允许在整个组织中使用诸如\
  \ CIS 基准之类的工具。幸运的是，存在一些工具和脚本可以帮助更轻松地应用这些设置。\n\nCIS 基准针对 Windows 10 推荐的配置设置类型示例包括以下内容：\n\
  \n*   将密码历史记录设置为记住 24 个或更多密码\n*   将最大密码使用期限设置为“60 天或更少，但不为 0”，防止用户仅通过更改 24 次密码就恢复使用相同的密码，同时要求每\
  \ 2 个月更换一次密码\n*   将最小密码长度设置为 14 个或更多字符\n*   要求密码必须符合复杂性要求\n*   禁用使用可逆加密存储密码\n\n\
  上面的列表只是一份包含超过 1,300 页信息的文档中的一个章节，该文档详细介绍了如何锁定 Windows，包括每个设置的描述、推荐理由、推荐设置的影响，以及如何设置和审核该设置的信息。好消息是，考试不要求你了解加固\
  \ Windows、Linux 或 macOS 的所有细节。你需要知道的是：操作系统加固使用系统设置来减少操作系统的攻击面，存在工具和标准来协助该过程，并且为组织评估、审核和维护操作系统加固是整体安全管理过程的一部分。\n\
  \n##### 加固 Windows 注册表\n\nWindows 注册表是 Windows 跟踪系统状况的核心。因此，注册表是攻击者的重要目标，他们可以利用它来自动启动程序、收集信息，或在目标计算机上采取其他恶意行动。加固\
  \ Windows 注册表涉及配置注册表权限、在不需要特定需求时禁止远程注册表访问，以及限制对 `regedit` 等注册表工具的访问，以便攻击者即使获得了系统访问权限，也更难更改或查看注册表。\n\
  \n##### 配置、标准和模式\n\n要在企业环境中加固系统，你需要通过组织来管理系统的配置。事实上，*配置管理*工具是安全专业人员和系统管理员确保其组织中众多系统具有正确安全设置并帮助保护它们安全的最强大选项之一。第三方配置管理系统（如用于\
  \ macOS 的 Jamf Pro）、供商提供的工具（如用于 Windows 的 Configuration Manager），甚至开源配置管理工具（如 CFEngine），都有助于强制执行标准、管理系统，并报告系统不符合预期设置的领域。\n\
  \n配置管理工具通常从组织中具有代表性的系统或操作系统类型的*基线配置*开始。例如，你可以选择为 Windows 10 桌面、Windows 10 笔记本电脑和\
  \ macOS 笔记本电脑配置基线配置。然后，根据需要，通过将它们放入具有这些修改后设置的组中，可以针对特定群组、团队、部门甚至个人用户修改这些标准。基线配置是构建的理想起点，有助于降低复杂性，并使配置管理和系统加固能够跨多台计算机（甚至数千台）成为可能。\n\
  \n除了配置管理标准和工具外，文档也是配置管理的重要组成部分。图表（包括架构图、网络图和数据流图）用于理解和记录组织的技术和系统是如何设置的。建立制作系统和架构图的组织习惯，确保它们符合质量标准，并在事物发生变化时进行更新，有助于确保部署符合组织标准。在执行事件响应和灾难恢复操作时，这些相同的图表至关重要，因为它们使响应人员能够快速了解基础设施和系统的配置方式、互连方式、数据流向、数据如何从一处传送到另一处，以及系统或应用程序架构中存在哪些依赖关系。图表和文档也可提供给审计员，作为评估设计的有用工件。\n\
  \n###### 命名标准和寻址模式\n\n\n\n\n### 端点加固\n\n加固端点涉及了解您正在管理哪些系统，并确保网络上的系统是您预期存在的系统。标准对此有所帮助。Security+\
  \ 考试将标准命名约定列为一种选项。命名约定发挥多种作用：\n\n*   它们可以帮助您根据命名约定中包含的目的、位置或其他要素来识别系统。\n*   它们可用于使系统更加匿名；例如，`examplecorp123`\
  \ 对攻击者的意义小于 `examplesqlserver` 或 `examplewebserver`。\n*   它们使脚本编写和管理更容易，因为您可以使用标准命名约定更轻松地进行筛选、排序和执行其他操作。\n\
  \n使用标准化的互联网协议（IP）模式也很有用。根据目的、位置或其他因素对系统进行分段，并确保您正在管理组织使用的 IP 地址空间，有助于避免地址冲突、避免网络段地址耗尽，并识别不应使用给定地址的系统。当您设计数据中心或云基础设施并分配\
  \ IP 地址时，这种能力变得更加重要。如果您用完了地址并不得不重新寻址数据中心，可能需要大量的返工来更新防火墙规则、基础设施即代码（IaC）脚本和工具，或其他您投入了大量时间的地方。\n\
  \n#### 补丁管理\n\n确保系统和软件是最新的，通过消除已知漏洞有助于确保端点安全。及时打补丁可以减少漏洞利用和缺陷被用来攻击系统的时间，但打补丁也有其自身的风险。补丁可能会引入新的缺陷，或者打补丁过程本身有时会导致问题。打补丁的重要性，以及确保打补丁过程受控和托管的必要性，这就是补丁管理的由来。\n\
  \n现代软件（包括软件、浏览器、办公套件和许多其他包）中很大一部分都内置了自动更新工具。这些工具检查更新，并通知用户请求安装更新的权限，或自动安装更新。虽然此模型对单个设备很有用，但企业解决方案对组织更有意义。\n\
  \n操作系统的补丁管理可以使用微软的 `Endpoint Configuration Manager` 等工具针对 Windows 进行，但第三方工具提供对各种软件应用程序的补丁管理支持。使用系统管理工具跟踪版本和补丁状态对组织安全很重要，特别是因为组织可能部署的大量应用程序和包的第三方更新可能是一项艰巨的任务。\n\
  \n管理移动设备的软件仍然是一个挑战，但移动设备管理（MDM）工具也包含验证软件版本的能力。这些工具通常除了控制安全设置外，还具有更新应用程序和设备操作系统的能力。\n\
  \n当您考虑端点安全时，请思考如何更新您的端点设备、它们运行的软件和应用程序，以及您需要了解哪些信息才能知道打补丁是否一致且最新。关键功能（如报告、确定哪些系统或应用程序获取更新及何时获取、阻止更新的能力，当然还有强制安装更新的能力）对于当今组织中各种不同类型设备的企业补丁管理都至关重要。\n\
  \n#### 磁盘安全与清理\n\n保持磁盘内容安全可在系统或磁盘丢失或被盗时保护数据。这就是磁盘加密的用武之地。**全盘加密（FDE）** 加密磁盘，并要求引导加载程序或硬件设备提供解密密钥以及软件或硬件来解密驱动器以供使用。这种加密最常见的实现之一是透明加密（有时称为实时加密）。透明加密实现对用户基本不可见，驱动器在使用期间显示为未加密状态。这也意味着针对使用透明\
  \ FDE 的系统最简单的攻击方法是在驱动器解锁时获得对系统的访问权限。\n\n卷加密（有时称为文件系统级加密）保护驱动器的特定卷，允许不同的信任级别，并提供超出使用单个密钥加密整个磁盘所提供的额外安全性。文件和文件夹加密方法也可用于保护特定数据，同样允许不同的信任级别，以及以安全方式传输数据。\n\
  \n全盘加密可以使用**自加密驱动器（SED）** 在硬件级别实现。自加密驱动器在其硬件和固件中实现加密功能。配备自加密驱动器的系统需要密钥才能从驱动器启动，该密钥可以手动输入，也可以由硬件令牌或设备提供。由于这是一种全盘加密形式，相同类型的攻击方法也适用——只需找到已登录的系统或处于睡眠模式的系统即可。\n\
  \n磁盘加密确实带来了潜在的缺点。如果加密密钥丢失，驱动器上的数据将很可能无法恢复，因为保护它的强加密也使得暴力破解密钥并获取数据的可能性极小。技术支持可能更具挑战性，数据损坏或其他问题可能影响更大，导致数据无法恢复。尽管存在这些潜在缺点，全盘加密的显著优势是：丢失或被盗的全加密驱动器系统通常可作为系统丢失处理，而不是作为该系统所含数据的丢失或泄露处理。\n\
  \n##### 清理\n\n确保磁盘在不再需要并报废或将被重复使用时被安全擦除，是驱动器生命周期的重要组成部分。对驱动器或介质进行清理涉及两个过程之一：擦除数据或销毁介质。\n\
  \n磁带和类似的磁性介质通常使用消磁器进行擦除，消磁器将磁性介质暴露在非常强的电磁场中，打乱写入驱动器的位模式。消磁器是销毁磁性介质上数据的相对快速方法。然而，SSD、光学介质和驱动器以及闪存驱动器需要不同的处理方式。\n\
  \n擦除介质以不可恢复的方式覆盖或丢弃数据。对于硬盘驱动器和其他磁性介质，这可以通过一系列写入（通常是 1 或 0）到驱动器上的每个存储位置（位）来完成。各种工具（如\
  \ Darik's Boot and Nuke (DBAN)）将对整个磁盘执行多次遍历，以尝试确保没有数据残留。事实上，数据残留（即事后仍留在磁盘上的数据）是一个重大问题，特别是对于使用磨损均衡算法将驱动器的磨损分散到比列出容量更大的空间上的\
  \ SSD 和其他闪存介质。使用写入所有可访问位置的传统驱动器擦除工具擦除 SSD 将会遗漏磁盘上因磨损均衡过程而可能保留数据副本的区域。\n\n幸运的是，能够使用这些驱动器内置的安全\
  \ `Erase` 命令的工具有助于确保残留数据不是问题。在许多情况下，一个更好的解决方案是在驱动器的整个生命周期内使用全盘加密，然后在数据准备报废时直接丢弃加密密钥。除非您的组织面临高级威胁，否则这种方法很可能会使数据无法被即使是相当高级的恶意行为者恢复。\n\
  \n\n\n\n由于擦除驱动器可能会出现问题，因此销毁驱动器是希望消除数据丢失或泄露风险的组织的常用选择。将驱动器粉碎、粉碎或焚烧，使得无法恢复任何数据，这是一种选择，第三方供应商专门提供此类服务，并为每个被销毁的资产（驱动器或系统）提供文档记录。尽管这会导致部分潜在可回收价值的损失，但对于做出此决定的组织来说，在风险计算中，较旧驱动器的剩余价值远低于单次违规的成本。\n\
  \n##### 文件操作和其他有用的命令行工具\n\n与 Linux 和 Unix 系统及设备上的文件进行交互是许多安全专业人员熟悉的任务。快速从文件收集信息、操作文件、更改其权限或仅仅是搜索文件的能力，可以在成功处理事件、识别问题或加快操作任务方面发挥关键作用。Security+\
  \ 考试重点关注六种命令行工具：\n\n*   `head` 是一个显示文件开头部分的命令。默认情况下，它将显示文件的前 10 行，使其成为快速查看文件内容的实用工具。您可以使用\
  \ `-n` 标志更改显示的行数，并通过在命令行中包含多个文件来显示多个文件的行。要查看名为 `example.txt` 的文件的前 15 行，请输入：`head\
  \ -n 15 example.txt`。\n\n*   `tail` 与 `head` 命令非常相似，但默认情况下它显示文件的最后 10 行。`tail` 常用于查看最近的日志条目或文件中正在变化的其他数据。与\
  \ `head` 一样，您可以添加 `-n` 标志来显示任意数量的行，但在许多情况下最有用的模式是 `-f` 标志，它会跟踪变化。使用 `tail -f` 将显示文件随变化而更新的内容。与\
  \ `head` 一样，您也可以同时监控多个文件。\n\n*   `cat` 是 concatenate（连接）的缩写，可用于将文件输出到标准输出（您的控制台）或将文件追加到其他文件。输入\
  \ `cat example.txt` 将在控制台显示 `example.txt` 的内容。输入 `cat more.txt > example.txt` 将把\
  \ `more.txt` 的内容添加到文件 `example.txt` 中。`cat` 命令还有许多其他有用的功能，您可以通过 [shapeshed.com/unix-cat](http://shapeshed.com/unix-cat)\
  \ 上通俗易懂的示例了解它们。\n\n*   `grep` 是一种搜索工具，允许您搜索与提供的文本或正则表达式匹配的模式。在其最基本的形式中，您可以通过输入 `grep\
  \ 'word' /file/location` 来搜索单词，将 `word` 替换为您要查找的单词或文本字符串，将 `/file/location` 替换为您要搜索的文件或目录位置。`grep`\
  \ 命令有许多方便的功能，例如 `-A` 和 `-B` 选项，当提供一个数字作为输入时，它们将在匹配模式之后或之前打印指定数量的行。这使得 `grep` 成为快速搜索日志和其他文本文件以查找特定信息的理想工具。还有许多其他有用的\
  \ `grep` 标志，因此如果您还不熟悉 `grep` 的基础知识，我们建议您花些时间阅读手册页或 `grep` 教程。\n\n*   `chmod` 允许您使用符号或数字表示法设置文件和目录的权限。要为\
  \ `example.txt` 设置读、写和执行权限，您可以发出命令 `chmod 777 example.txt`。您也可以通过输入 `chmod +rwxrwxrwx\
  \ example.txt` 设置相同的权限。了解如何设置特定权限以及如何读取权限（参见图 11.4），对于确保文件和目录安全至关重要。\n\n    您可能会觉得图\
  \ 11.4 中的列表看起来很熟悉——事实上，我们在第 8 章“身份与访问管理”中也介绍过这一点！\n\n    ![图 11.4 Linux 文件权限](img/c11f004.png)\n\
  \n    **图 11.4** Linux 文件权限\n\n*   `logger` 是 Security+ 考试包含的命令中最不为人知的一个。`logger`\
  \ 命令会将您提供的任何输入信息追加到系统上的 `/var/log/syslog` 文件中。`logger` 还可以通过调用其他命令或文件，将来自它们的信息添加到\
  \ syslog 文件中。\n\n##### 脚本、安全传输和 Shell\n\n您端点安全工具包中的另一组有用工具是 Shell 和脚本语言。连接到命令行界面或在本地系统上使用它，然后执行我们刚才探讨的文件操作命令等，提供了控制和管理系统的强大能力。Security+\
  \ 考试关注远程访问以及您应该了解的两种脚本环境。\n\n安全 Shell，或 `SSH`，是一种用于连接系统的加密协议，通常通过命令行进行。SSH 也是使用\
  \ SSH 协议创建该连接的客户端的名称。一旦通过 SSH 连接，您就可以在您正在使用的系统所运行的任何 Shell 环境中发出命令。\n\nWindows 系统拥有一个内置的管理、自动化和脚本语言工具，称为\
  \ PowerShell。PowerShell 脚本和命令允许从命令行管理和配置 Windows 系统。PowerShell 可以报告系统的当前状态，对本地和远程系统进行更改，并具有许多其他功能，使其成为攻击者和防御者都青睐的工具。\n\
  \n像 Python 这样的脚本语言也被用于系统管理和维护任务，以及通过自动化为用户提供解决复杂任务的强大方式。尽管 Python 变得越来越普遍，但 Perl\
  \ 和其他语言仍然被用于脚本编写和作为软件包的一部分，特别是针对 Linux 和基于 Unix 的系统。\n\nSecurity+ 考试在本节中重点关注的最后一个工具是\
  \ OpenSSL。OpenSSL 不是 Shell，也不是脚本语言。相反，就像 SSH 一样，OpenSSL 是 TLS 协议的一种实现，常用于保护其他服务。OpenSSL\
  \ 的 TLS 实现用于 HTTPS 流量；每当需要以受保护的方式通过网络发送流量，而通过 SSH 或 VPN 连接建立隧道并不合适时，OpenSSL 很可能是一个合理的替代方案。作为安全专业人员，您需要知道\
  \ OpenSSL 经常被用来封装这种流量，因此您会在许多地方遇到嵌入式的 OpenSSL。\n\nSecurity+ 考试期望您知道如何使用 OpenSSL\
  \ 作为评估组织安全性的一部分。对于安全分析师来说，这通常包括寻找需要安全通信但缺失的地方，或 OpenSSL 配置错误的地方。这意味着您需要了解为什么要使用它，并了解它带来的有助于提高组织通信安全性的功能。TLS\
  \ 协议的关键要素之一是它提供了临时 RSA 密钥交换以创建完美前向保密。换句话说，只有在知道密钥时才能解密会话，并且临时密钥是在两个系统之间通信开始时生成的。因此，当两个以前可能从未通信过的系统需要安全通信时，使用\
  \ OpenSSL 和 TLS 是理想的解决方案。网站一直在为此目的使用 TLS，您对托管网站或其他服务的系统进行的安全评估——在这些系统中，系统可能需要在没有额外配置或事先通信的情况下安全通信——应将\
  \ OpenSSL 和 TLS 识别为一种安全选项。\n\n\n\n配置错误或不当配置的 OpenSSL 安装将允许使用弱加密套件，可能允许降级攻击，从而导致数据泄露。请考虑\
  \ OpenSSL 允许的加密选项集是否符合贵组织的需求，即使 OpenSSL 是为您正在审查的 Web 或其他服务配置的。\n\n##### 保护嵌入式和专用系统\n\
  \n安全从业者每天都会遇到传统计算机和服务器，但随着智能设备、嵌入式系统和其他专用系统持续被构建到从家用电器、建筑物、车辆甚至服装的各种事物中，组织的攻击面正以新的方式增长。无论这些系统出现在何处，都需要将其视为组织整体安全态势的一部分来考虑。\n\
  \n#### 嵌入式系统\n\n嵌入式系统是内置在其他设备中的计算机系统。工业机械、家用电器和汽车都是您可能遇到嵌入式系统的地方。嵌入式系统通常高度专用，运行定制的操作系统，并具有向用户公开的非常特定的功能和接口。然而，在越来越多的情况下，它们可能嵌入一个相对强大的系统，具有\
  \ Wi-Fi、蜂窝网络或其他无线接入，运行 Linux 或类似的、更熟悉的操作系统。\n\n许多嵌入式系统使用*实时操作系统 (RTOS)*。`RTOS` 是一种操作系统，当优先处理传入数据而非使用操作系统中断或等待正在处理的任务完成后再处理数据时使用。由于嵌入式系统广泛用于响应必须迅速的工业流程，因此使用实时操作系统以最大限度地减少操作系统接受数据和处理任务速度的差异量。\n\
  \n`Security+` 考试大纲重点关注其列为嵌入式系统的三种特定类型的系统。第一种是*树莓派*。树莓派是单板计算机，这意味着它们在单块板上拥有计算机系统的所有功能，包括网络连接、存储、视频输出、输入、CPU\
  \ 和内存。树莓派设备提供了一个相对强大的计算平台，并且可以运行多种操作系统，包括 Linux 和 Windows。树莓派设备更有可能被用于个人开发或小规模定制用途，而不是作为工业或商业嵌入式系统核心的大规模部署。\n\
  \n类似地，`Security+` 考试大纲列出的第二种设备是*Arduino*。与树莓派不同，Arduino 不被视为单板计算机。相反，它们属于一类称为*微控制器*的计算机。它们包含一个低功耗\
  \ CPU、少量内存和存储，并提供输入和输出功能。它们常用于原型设计与传感器、电机、照明和类似基本功能交互的设备。与树莓派不同，Arduino 没有内置有线或无线网络连接，因此由于缺乏直接物理访问，减少了其攻击面。\n\
  \n大纲中直接提到的最后一种嵌入式系统是现场可编程门阵列 (FPGA)。FPGA 是一种计算机芯片，可以通过编程重新设计其工作方式，使其成为可定制的芯片。选择使用\
  \ FPGA 的制造商可以对其进行编程，以比传统专用芯片更高的效率执行特定任务。单个 FPGA 本身不是嵌入式系统。系统可能将 FPGA 作为嵌入式系统中的一个组件或作为其中的可编程处理器进行集成。如果嵌入式系统集成了\
  \ FPGA，您需要知道它可能被重新编程。\n\n除了 `Security+` 考试大纲涵盖的三种系统类型之外，嵌入式系统有多种形式，并且可以完全嵌入，以至于您可能没有意识到您正在查看的设备中嵌入了一个系统。作为安全专业人员，您需要能够评估嵌入式系统安全性，并确定方法以确保它们在不导致系统本身故障或遭受不可接受的性能下降的情况下，保持安全且可用于其预期目的。\n\
  \n评估嵌入式系统的方法与评估传统计算机系统大致相同：\n\n1.  确定嵌入式系统的制造商或类型，并获取关于它的文档或其他资料。\n2.  确定嵌入式系统如何与外界交互：它是连接到网络、其他嵌入式设备，还是仅具有键盘或其他物理接口？\n\
  3.  如果设备确实提供网络连接，请识别通过该网络连接提供的任何服务或访问权限，以及如何保护这些服务或连接本身。\n4.  了解设备如何更新、补丁是否可用、如何以及何时安装这些补丁；然后确保有一个符合设备威胁模型和使用要求的补丁周期。\n\
  5.  记录当设备发生安全问题或妥协时贵组织将采取的措施。能否恢复正常？如果设备因该问题脱机会发生什么？如果设备故障或需要退出服务，是否会发生关键的健康、安全或运营问题？\n\
  6.  记录您的发现，并确保适当的实践包含在贵组织的操作程序中。\n\n随着越来越多的设备出现，这项工作需要越来越多的时间。提前介入流程，使安全性作为采购流程的一部分被考虑进去会有所帮助，但许多设备可能只是作为其他采购的一部分出现。\n\
  \n#### SCADA 和 ICS\n\n工业和制造系统通常使用两个术语之一来描述。*工业控制系统 (ICS)* 是工业自动化的广义术语，而*数据采集与监视控制系统\
  \ (SCADA)* 通常指运行电力和水分配或其他覆盖大面积区域系统的大型系统。由于术语重叠，它们经常互换使用。\n\nSCADA 是一种系统架构，它结合了数据采集和控制设备、计算机、通信能力以及用于控制和监控整个架构的界面。SCADA\
  \ 系统通常用于运行复杂的制造和工业流程，在这些流程中，监控、调整和控制整个流程的能力对成功至关重要。\n\n图 11.5 显示了 SCADA 系统的简化概览。您将看到远程遥测单元\
  \ (RTU) 从传感器收集数据，可编程逻辑控制器 (PLC) 控制并从机器或机器人等工业设备收集数据。数据被发送到系统控制和监控控制台，允许操作员查看正在发生的事情并管理\
  \ SCADA 系统。这些功能意味着 SCADA 系统通常用于工业和制造环境，以及能源行业监控工厂，甚至物流行业跟踪包裹和复杂的分拣及处理系统。\n\n![图\
  \ 11.5 显示带有传感器和设备的 PLC 和 RTU 的 SCADA 系统](img/c11f005.png)\n\n**图 11.5** 显示带有传感器和设备的\
  \ PLC 和 RTU 的 SCADA 系统\n\n\n\n##### 保护嵌入式和专用系统\n\n由于 ICS 和 SCADA 系统将运行通用操作系统的通用计算机与带有嵌入式系统和传感器的工业设备相结合，因此它们呈现出复杂的安全概况，供安全专业人员进行评估。在许多情况下，必须将它们作为单独的组件来处理，以确定其独特的安全需求，包括定制的工业通信协议和专有接口等。一旦这些单独的组件被绘制并理解，它们的交互以及整个系统或主要组件的安全模型就可以被设计和管理。\n\
  \n在保护此类复杂系统时，需要牢记的一个关键点是，它们在设计时往往未考虑安全性。这意味着增加安全措施可能会干扰其功能，或者安全设备可能不适合添加到该环境中。在某些情况下，隔离和保护\
  \ ICS、SCADA 和嵌入式系统是你能采用的最有效的安全模型之一。\n\n##### 保护物联网\n\n物联网 是一个宽泛的术语，用于描述用于自动化、传感、安全和类似任务的网络连接设备。IoT\
  \ 设备通常是一种嵌入式系统，但许多设备利用机器学习、AI、云服务和类似功能等技术来提供“智能”特性。\n\nIoT 设备带来许多安全和隐私问题，安全分析师必须了解这些常见问题：\n\
  \n*   不良的安全实践，包括弱默认设置、缺乏网络安全（防火墙）、暴露或易受攻击的服务、数据传输缺乏加密、弱认证、使用嵌入式凭据、不安全的数据存储，以及其他各种不良实践。\n\
  *   短暂的支持生命周期——IoT 设备可能不会被修补或更新，导致它们在大部署生命周期内都可能处于易受攻击状态。\n*   供应商数据处理实践问题，包括许可和数据所有权顾虑，以及在设备所有者不知情的情况下，向供应商的员工和合作伙伴以及政府和其他机构泄露数据的可能性。\n\
  \n尽管存在这些安全顾虑，传感器、楼宇和设施自动化设备、可穿戴设备以及其他智能设备等 IoT 设备仍在持续普及。安全专业人员必须同时考虑其组织采购的 IoT 设备，以及员工和访客可能带入其设施的设备。\n\
  \n### 专用系统\n\n你需要为 Security+ 考试考虑的嵌入式系统的最后一类是专用系统：\n\n*   **医疗系统**，包括医院和医生办公室中的设备，可能联网或具有嵌入式系统。心脏起搏器、胰岛素泵和其他体外或植入式系统等医疗设备也可能遭到攻击，针对通过蓝牙攻击心脏起搏器的漏洞利用代码已在野外存在。\n\
  *   **智能电表**被部署用于追踪公用事业使用情况，并带有由公用事业公司管理的无线控制网络。由于电表现在可以远程访问和控制，它们提供了新的攻击面，可能会干扰电力、水或其他公用事业，或提供有关设施或建筑物的信息。\n\
  *   **车辆**，从汽车到飞机甚至海上船舶，现在都已联网，且经常直接连接互联网。如果它们没有得到妥善保护，或者支持它们的后端服务器和基础设施存在漏洞，攻击者可以接管、监控或以其他方式严重影响它们。\n\
  *   **无人机和自动驾驶汽车**，以及类似的车辆，可能通过互联网或无线指挥信道进行控制。加密其指挥和控制信道，并确保它们在连接互联网或网络时具有适当的控制措施，对其安全至关重要。\n\
  *   **VoIP 系统**包括后端服务器以及部署在组织内各办公桌和工作地点的 VoIP 电话和设备。电话本身是一种嵌入式系统，拥有可成为攻击目标且可能易受攻击的操作系统。一些电话还提供允许直接远程登录或管理的接口，使其容易受到来自\
  \ VoIP 网络的攻击。分割网络以保护潜在易受攻击的 VoIP 设备、定期更新它们以及应用设备的基线安全标准，有助于保持 VoIP 系统安全。\n*   **打印机**，包括多功能打印机（MFP），通常内置网络连接。无线和有线网络接口提供对打印机的直接访问，且许多打印机具有不良的安全模型。打印机已被用作访问受保护网络的入口点、反射和放大攻击的工具，以及收集信息的手段。事实上，MFP、复印机和其他扫描并可能存储来自传真、打印件和复印件信息的设备，使这些设备除了作为易受攻击的网络设备可充当攻击中的反射器和放大器，或作为攻击者的跳板点的风险外，还成为潜在的重大数据泄露风险。\n\
  *   **监控系统**，如摄像头系统和用于安全但也联网的相关设备，可能为攻击者提供窥视设施或组织内部情况的视角。摄像头提供通常可通过 Web 界面访问的嵌入式接口。\n\
  *   默认配置、漏洞、缺乏修补等问题在专用系统中很常见，这与其他嵌入式系统非常相似。当你评估专用系统时，既要考虑如何限制这些潜在问题的影响，也要考虑为你的组织处理它们所需的管理、行政和事件响应流程。\n\
  \n##### 通信考量\n\n许多嵌入式和专用系统运行在传统有线和无线网络不可用的环境中。作为安全专业人员，你可能需要考虑用于嵌入式系统的不同类型的连接。\n\
  \n蜂窝连接，包括现有的 LTE 和其他第四代技术以及较新的 5G 网络连接，可以在 Wi-Fi 网络无法工作的许多位置为嵌入式系统提供高带宽访问。由于第三方蜂窝供应商负责连接，使用蜂窝连接的嵌入式系统需要得到保护，以使蜂窝网络不对其运行构成威胁。确保它们不通过蜂窝连接暴露易受攻击的服务或应用程序，对其安全至关重要。构建保护措施以防止网络漏洞利用跨越内部安全边界（如无线连接与本地控制总线之间的边界）也是一项必要的设计特性。\n\
  \n物理上保护内置在蜂窝设备中的用户身份模块（SIM）可能非常重要。关于 SIM 卡被取出并被重新利用的案例（包括被获取后产生巨额数据费用）经常见诸媒体。SIM\
  \ 卡克隆攻击还可能允许攻击者冒充嵌入式系统，从而以受信任系统的身份发送和接收信息。\n\n\n\n\n\n###### 嵌入式系统与射频协议\n\n嵌入式系统还可以利用专门为其设计的射频协议。`Zigbee`\
  \ 就是一种为个人局域网设计的网络协议示例，此类网络常见于家庭自动化场景。`Zigbee` 和 `Z-wave` 等协议为那些不需要 `Wi-Fi` 和 `Bluetooth`\
  \ 所提供的带宽及附加功能的设备提供了低功耗、点对点的通信。这意味着它们在通信范围和可传输数据量方面存在限制，并且由于它们是为家庭自动化及类似用途设计的，因此不具备强大的安全模型。作为安全从业者，你应该意识到，使用\
  \ `Zigbee` 等协议通信的设备可能会作为楼宇监控或其他用途的一部分被部署，且不太可能具备企业级的管理、监控或安全能力。\n\n`Zigbee` 等射频系统可以是窄带或宽带。窄带无线电系统通常噪声较小，因此具有更好的范围和灵敏度；而宽带无线电因为拥有更多可用的无线频谱，可以传输更多数据。Security+\
  \ 考试大纲还提到了基带无线电，这是一种包含接近零频率的信号类型。\n\n###### 嵌入式系统的安全约束\n\n嵌入式系统存在许多约束，安全解决方案必须将其纳入考量。由于嵌入式系统可能能力有限、部署和管理选项各异，且生命周期延长，因此保护它们需要投入额外的思考。\n\
  \n当你考虑嵌入式系统的安全性时，应考虑以下因素：\n\n*   嵌入式系统的整体计算能力和容量通常远低于传统 PC 或移动设备。尽管这可能因情况而异，但嵌入式系统可能使用低功耗处理器、拥有较少内存，且存储空间非常有限。这意味着可能不具备加密处理所需的算力，或者必须在\
  \ CPU 周期的其他需求之间进行平衡。同时，有限的内存和存储容量意味着可能没有能力运行额外的安全工具，如防火墙、反恶意软件工具，或你习惯在设计中包含的其他安全工具。\n\
  \n*   嵌入式系统可能不连接网络。它们可能完全没有网络连接，或者虽有连接但因环境、运营或安全顾虑而未启用或使用。事实上，由于许多嵌入式系统部署在传统网络之外，或处于连接性可能受限的区域，即使它们具备内置无线网络能力，也可能没有足够的有效范围连接到可用网络。因此，你可能无法远程修补、监控或维护这些设备。嵌入式设备可能需要作为独立单元进行保护。\n\
  \n*   没有网络连接、CPU 和内存容量以及其他要素，身份认证也很可能无法实现。事实上，由于安全或可用性因素，对嵌入式系统进行身份认证可能并不合乎需求。你将遇到的许多使用嵌入式系统的设备内置于工业机械、传感器和监控系统，甚至家用电器中。没有身份认证，就需要确定其他安全模型，以确保对嵌入式系统的更改经过授权。\n\
  \n*   嵌入式系统成本可能很低，但许多实际上成本极高，因为它们是大型工业或专用设备中的一个组件。因此，简单地更换有漏洞的设备可能是不可能的，这要求采取补偿控制或做出特殊的设计决策，以确保设备保持安全，且不会给其所属组织带来问题。\n\
  \n鉴于所有这些限制，嵌入式设备可能依赖隐含信任。它们假定操作员和与其交互的人员之所以这样做是因为他们受信任，并且物理接触设备意味着用户被授权使用并可能更改设置、更新设备或以其他方式修改它。嵌入式设备随物理访问而来的隐含信任模型使其成为组织的潜在漏洞，并且必须在部署前对其进行审查和设计。\n\
  \n### 总结\n\n终端是大多数组织中最常见的设备，也是种类最繁多的。因此，你必须特别关注它们从启动那一刻起是如何被保护的。你可以利用系统固件内置的安全启动技术来保持启动完整性。\n\
  \n作为安全专业人员，你需要了解许多常见的终端安全工具类型，以及何时和如何使用它们。防病毒和反恶意软件工具有助于检测恶意程序和感染。在不同位置（如终端和邮件服务器）使用多种工具，可以帮助检测通过另一种工具防线的恶意代码。允许列表和阻止/拒绝列表也可用于控制终端系统可运行的应用程序和软件。它们需要更多的维护和精力，因为它们要么只允许运行清单内的应用程序，要么完全阻止清单外的程序。`EDR`\
  \ 工具通过将检测和监控工具与集中报告及事件响应能力相结合，为终端设备的安全防护增加了另一层保护。最后，数据丢失防护（`DLP`）工具被部署用于确保数据不会无意或故意泄露。\n\
  \n终端系统还使用各种网络防御。最常见的是防火墙，基于端口、协议或应用程序控制流量。主机入侵防御系统（`HIPS`）可以阻止进入或离开系统的攻击流量，而主机入侵检测系统（`HIDS`）只能对恶意或不需要的流量发出警报或警示，但无法阻止它。下一代防火墙主要作为网络设备存在，但高级终端防护工具可以具有类似功能，包括行为分析和高级系统保护。\n\
  \n所有这些工具都很有帮助，但系统加固也很重要。加固技术专注于通过禁用不必要或不需要的服务、将安全选项从默认值配置为符合设备风险概况和安全需求的更安全设置，以及进行其他更改来减少终端系统的攻击面。修补和更新系统也有助于保持其安全，拥有完全修补的系统通常是加固过程的一部分。此外，系统配置标准、命名标准、IP\
  \ 地址方案、加固脚本、程序和流程有助于确保企业中的系统得到适当的清点和保护。\n\n驱动器加密可在驱动器被盗或丢失时保护数据安全。在生命周期结束时，当设备退役或损坏，或介质需要重复使用时，会采用清理程序以确保残留数据不泄露。擦除驱动器和物理销毁都是常见选项。选择与介质及存储在介质或驱动器上的数据所需安全级别相匹配的清理方法至关重要。\n\
  \n常见命令行命令是 Security+ 考试的一部分，你可能会遇到 `tail`、`head`、`cat`、`grep`、`chmod` 和 `logger`\
  \ 等工具，应了解如何使用它们以及它们的功能。`Bash` 等 Shell、`Python` 等脚本语言和 `PowerShell` 等环境也是安全从业者的关键知识。安全\
  \ Shell（`SSH`）和 `SSL/TLS` 及其在远程访问和保护传输中数据方面的用途，也是安全专业人员工具箱的一部分。\n\n\n\n\n\n### 端点安全：专用系统与嵌入式系统\n\
  \n端点安全的最后一个组成部分是组织如何保护专用系统和嵌入式系统。物联网、SCADA、ICS 及其他设备无处不在，广泛分布于组织的医疗系统、智能电表、车辆、工业流程与制造设备、无人机、智能设备以及许多其他场所。鉴于这些设备通常能力有限、采用不同的安全模型，且拥有许多其他特殊需求，保护嵌入式系统需要额外的关注和规划，以确保其保持安全状态。\n\
  \n### 考试要点\n\n**系统加固与保护依赖安全工具和技术来维持系统安全。** 保护端点设备需要考虑设备的方方面面：其启动方式、数据如何保护、如何配置、提供何种服务、通信是否安全，以及如何防御网络威胁。幸运的是，安全专业人员拥有大量工具，包括安全启动和可信启动，可用于防范针对启动过程或驱动程序的攻击。`Antivirus`（防病毒）、`antimalware`（反恶意软件）、`sandboxes`（沙箱）、`allow\
  \ lists`（允许列表）和 `deny lists`（拒绝列表）可控制在端点上运行的应用程序和程序。`Endpoint detection and response`（端点检测与响应）和\
  \ `data loss prevention`（数据丢失防护）工具等，能深入洞察系统活动及潜在问题所在，同时增加管理员和安全专业人员可用的控制手段，以保障系统和数据安全。`host\
  \ intrusion prevention and detection systems`（主机入侵防御与检测系统）、`host firewalls`（主机防火墙）等网络安全工具能检测并通常能阻止来自网络的攻击。\n\
  \n**端点加固还依赖配置、设置、策略和标准来确保系统安全。** 虽然工具和技术对保护端点很重要，但配置和设置也是该过程的重要组成部分。禁用不必要的服务、更改\
  \ `Windows registry`（Windows 注册表）中的设置或 `Linux` 中的操作系统设置，以及以其他方式使用内置配置选项，使安全配置与设备的风险概况相匹配，至关重要。组织还使用命名和\
  \ `IP` 寻址标准来管理、追踪和控制其环境中的端点。最后，对操作系统和设备上安装的应用程序进行 `patch management`（补丁管理），可防范已知漏洞和问题。\n\
  \n**驱动器加密和清理有助于防止数据泄露。** 加密驱动器和介质有助于在它们被盗或丢失时保持其安全。`Full-disk encryption`（全盘加密）覆盖整个驱动器，而\
  \ `volume`（卷）或 `file encryption`（文件加密）则保护内容的特定部分。对驱动器和介质进行清理涉及使用安全删除流程擦除它们，或将其销毁，以确保数据无法恢复。根据数据的安全要求以及所涉及的驱动器或介质类型使用适当的流程，对于确保数据被妥善移除至关重要。\n\
  \n**安全分析师需要熟悉命令行工具、Shell 和安全传输协议。** `Security+` 考生需要了解命令行工具的基础知识，包括 `head`、`tail`、`cat`\
  \ 和 `grep`，这些工具允许你操作和查看文本文件。使用 `chmod` 管理权限以及通过 `logger` 向日志文件添加信息，也是安全专业人员需要熟悉的任务。除了这些工具，同样重要的是通过\
  \ `SSH` 使用安全 Shell、使用 `OpenSSL` 保护传输中的数据，以及了解 `Python` 和 `PowerShell` 等脚本语言，以及何时以及为何可能会使用它们。\n\
  \n**SCADA、ICS 和 IoT 系统等专用系统遍布整个组织，需要独特的安全解决方案。** `SCADA` 和 `ICS`（工业控制系统）用于管理和监控工厂、发电厂以及现代企业的许多其他主要组件。`IoT`（物联网）系统是连接互联网的设备，执行从监控到家庭自动化等各种任务。它们可能由第三方控制，或具有其他安全隐患，必须将其作为安全计划的一部分加以解决，以保持每个端点的安全。\n\
  \n**嵌入式系统具有独特的安全约束。** 嵌入式系统通常比传统系统拥有更少的计算能力、内存和存储。有限的资源意味着嵌入式系统可能没有资源提供加密、防病毒或其他安全功能，并且可能无法记录数据。某些嵌入式系统没有网络连接，或者它们可能使用专用通信协议进行通信，这使得远程修补和管理变得困难。嵌入式系统使用的操作系统和软件通常不具备桌面或移动操作系统的相同功能，并且可能缺乏身份验证能力或传统系统中预期的其他关键功能。\n\
