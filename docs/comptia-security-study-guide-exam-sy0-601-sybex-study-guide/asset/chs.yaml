  \n**3. A.** 参数化查询（有时称为预处理语句）使用预构建的 SQL 语句来防止基于 SQL 的攻击。来自应用程序的变量被传递给查询，而不是在应用程序需要数据时构建自定义查询。对数据进行编码有助于防止跨站脚本攻击，输入验证也是如此。适当的访问控制可以防止访问账户或应用程序不应有权访问的数据，但它们不使用预编译的\
  \ SQL 语句。存储过程是参数化查询实现的一个示例。\n\n**4. A.** 不当的错误处理往往会向用户（甚至可能向攻击者）暴露本不应暴露的数据。在本例中，了解应用程序内部使用的\
