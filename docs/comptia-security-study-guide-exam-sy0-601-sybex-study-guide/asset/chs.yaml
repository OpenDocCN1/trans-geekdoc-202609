  \ OSINT 是侦察技术。\n\n**11. A.** 红队在尝试访问目标网络上的系统时使用进攻性黑客技术。蓝队负责管理组织的防御。白队作为演习的中立仲裁者。紫队演习在演习后进行，旨在将红队和蓝队聚集在一起进行知识共享。\n\
  \n**12. C.** 漏洞赏金计划旨在允许外部安全专家测试系统并发现先前未知的漏洞。漏洞赏金计划为成功的测试人员提供经济奖励，以激励他们的参与。\n\n**13.\
  \ D.** 后门是一种持久化工具，旨在确保攻击者的访问权限在原始漏洞被修复后依然保留。Kyle 可以在未来使用此后门访问系统，即使他用于获取访问权限的原始漏洞利用不再有效。\n\
  \n**14. C.** `WHOIS` 查询使用外部注册库，是开源情报（OSINT）的一个示例，属于被动侦察技术。端口扫描、漏洞扫描和足迹分析都需要与目标进行主动交互，因此属于主动侦察。\n\
  \n**15. B.** 常见漏洞披露（CVE）为描述与安全相关的软件缺陷提供了标准命名法。通用配置枚举（CCE）为讨论系统配置问题提供了标准命名法。通用平台枚举（CPE）为描述产品名称和版本提供了标准命名法。通用漏洞评分系统（CVSS）为衡量和描述与安全相关的软件缺陷严重程度提供了标准化方法。\n\
