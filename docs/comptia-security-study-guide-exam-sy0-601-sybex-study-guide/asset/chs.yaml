  \n## 作者简介\n\n**Mike Chapple, Ph.D., CISSP, Security+** 是畅销书 *CISSP (ISC)² Certified\
  \ Information Systems Security Professional Official Study Guide*（Sybex, 2021）和\
  \ *CISSP (ISC)² Official Practice Tests*（Sybex, 2021）的作者。他是一位拥有二十年高等教育、私营部门和政府领域经验的信息安全专业人士。\n\
  \nMike 目前担任圣母大学 Mendoza 商学院 IT、分析与运营系的教学教授，讲授网络安全、数据管理和商业分析的本科及研究生课程。\n\n在重返圣母大学之前，Mike\
  \ 曾担任 Brand Institute 的执行副总裁兼首席信息官，该公司是一家总部位于迈阿密的营销咨询公司。Mike 还曾在国家安全局的信息安全研究组工作四年，并曾在美军空军担任现役情报官。\n\
  \nMike 是 *Information Security Magazine* 的技术编辑，著有 25 余本书。他获得了圣母大学计算机科学与工程学士和博士学位。Mike\
  \ 还拥有爱达荷大学计算机科学硕士学位和奥本大学 MBA 学位。Mike 持有网络安全分析师+ (CySA+)、Security+、注册信息安全经理 (CISM)、注册云安全专家\
  \ (CCSP) 和注册信息系统安全专家 (CISSP) 认证。\n\n在他的网站 `CertMike.com` 了解更多关于 Mike 及其其他安全认证材料的信息。\n\
  \n**David Seidl** 是迈阿密大学的信息技术副总裁兼 CIO。在他的 IT 职业生涯中，他曾担任多种技术和信息安全角色，包括担任圣母大学的校园技术服务高级总监，在那里他共同领导了圣母大学的云迁移，并监督云运营、ERP、数据库、身份管理以及广泛的其他技术和服务。他还曾担任圣母大学的信息安全总监，领导圣母大学的信息安全计划。他曾作为圣母大学\
  \ Mendoza 商学院的讲师教授信息安全和网络本科课程，并撰写了关于安全认证和网络战的书籍，包括合著 *CISSP (ISC)² Official Practice\
  \ Tests*（Sybex, 2021）以及本书和配套书籍 *CompTIA CySA+ Practice Tests: Exam CS0-001* 的前几个版本。\n\
  \nDavid 拥有东密歇根大学的通信技术学士学位和信息安全硕士学位，以及 CISSP、CySA+、Pentest+、GPEN 和 GCIH 认证。\n\n##\
  \ 技术编辑简介\n\n![](img/ffirs01uf001.png)\n\n**Nadean H. Tanner**，持有 Security+、CASP+、A+、Network+、CISSP\
  \ 以及许多其他行业认证，是 Mandiant/FireEye 的咨询教育服务经理。加入 Mandiant 之前，她是 Rapid7 的首席讲师，教授漏洞管理、事件检测与响应以及\
  \ Metasploit。20 多年来，她一直在学术界工作，担任私立学校的 IT 总监和大学级技术讲师，也曾为美国国防部工作。Nadean 是 *Cybersecurity\
  \ Blue Team Toolkit*（Wiley, 2019）和 *CompTIA CASP+ Practice Tests: Exam CAS-003*（Sybex,\
  \ 2020）的作者。\n\n## 简介\n\n\n\n\n\n## Security+ 学习指南\n\n如果您正准备参加 Security+ 考试，无疑希望尽可能多地获取有关计算机和物理安全的信息。您掌握的信息越多、积累的实操经验越丰富，应对考试时就会越从容。编写本学习指南正是基于这一初衷。目标是提供足够的信息帮助您备考，又不会因包含超出考试范围的过多信息而让您不堪重负。\n\
  \n本书以中级技术水平呈现内容。拥有安全概念、操作系统和应用系统的经验与知识，将有助于您全面理解作为安全专业人员将面临的挑战。\n\n我们在每章末尾附带了复习题，让您提前体验考试形式。如果您已在安全领域工作，建议您先尝试这些题目以评估自己的专业水平。随后，您可以主要利用本书来填补现有知识体系中的空白。本学习指南将帮助您完善知识储备，从容应对考试。\n\
  \n如果您能正确回答某章 90% 或以上的复习题，便可放心进入下一章学习。如果做不到这一点，请重读该章并再次尝试答题，您的分数应该会有所提高。\n\n### Security+\
  \ 考试\n\nSecurity+ 考试旨在成为一项面向网络安全专业人员及有志入行者的**厂商中立**认证。CompTIA 建议以下岗位的在职或求职人员考取此认证：\n\
  \n*   系统管理员\n*   安全管理员\n*   安全专家\n*   安全工程师\n*   网络管理员\n*   初级 IT 审计师/渗透测试员\n* \
  \  安全顾问\n\n考试涵盖五大核心领域：\n\n1.  威胁、攻击和漏洞\n2.  架构与设计\n3.  实施\n4.  运维与事件响应\n5.  治理、风险与合规\n\
  \n这五大领域包含的主题范围广泛，从防火墙设计到事件响应和取证，并高度侧重**基于场景的学习**。这也是 CompTIA 建议应试者至少拥有两年实操工作经验的原因，尽管许多人在进入第一份网络安全工作前就通过了考试。\n\
  \nSecurity+ 考试采用 CompTIA 称为“**基于性能的评估**”的形式。这意味着考试将标准多项选择题与其他交互式题型相结合。您的考试可能包含多种题型，如单选题、填空题、多选题、拖放题和基于图像的问题。\n\
  \n考试在美国的费用为 349 美元，全球其他地区价格大致相当。有关 Security+ 考试的更多详情及报考方式，请访问 `www.comptia.org/certifications/security`。\n\
  \n您将有 90 分钟的考试时间，需在该时段内回答最多 90 道题目。考试分数范围为 100 至 900 分，**及格分为 750 分**。\n\n您还应知道，CompTIA\
  \ 因在其所有考试中包含**模糊不清的题目**而“臭名昭著”。您可能会遇到四个备选答案中有两个正确——但您只能选一个的情况。请运用您的知识、逻辑和直觉选择**最佳答案**，然后继续下一题。有时题目的措辞会让英语专业的学生感到尴尬——此处有个错别字，那处有个动词用法错误。不要因此沮丧；答完题继续下一题即可。\n\
  \n#### 参加考试\n\n一旦您完全准备好参加考试，即可访问 CompTIA 网站购买考试券：\n\n`www.comptiastore.com/Articles.asp?ID=265&category=vouchers`\n\
  \n目前，CompTIA 提供两种考试方式：在考场进行的现场考试，以及在您自己的电脑上进行的居家考试。\n\n##### 现场考试\n\nCompTIA 与 Pearson\
  \ VUE 考场合作，因此您的下一步是找到离您最近的考场。在美国，您可以根据地址或邮政编码搜索；非美国考生可能发现输入城市和国家更方便。您可以在 Pearson\
  \ VUE 网站上搜索附近的考场，需要导航至“查找考场”。\n\n`www.pearsonvue.com/comptia`\n\n确定考场后，只需创建一个 Pearson\
  \ VUE 考试账户并在其网站上预约考试即可。\n\n考试当天，请携带两种形式的身份证件，并务必在考试开始前留出充足时间到达。请记住，您不能携带笔记、电子设备（包括智能手机和手表）或其他材料进入考场。\n\
  \n##### 居家考试\n\nCompTIA 于 2020 年为应对新冠疫情开始提供在线考试监考。截至本书付印时，居家考试选项仍然可用，且极有可能继续保留。选择此方式的考生将在家中或办公室参加考试，并通过网络摄像头接受远程监考人员的监考。\n\
  \n鉴于居家考试体验变化迅速，有意选择此选项的考生应查看 CompTIA 网站以获取最新详情。\n\n#### 考后事宜\n\n考试结束后，您将立即收到分数通知，因此马上就能知道是否通过。请妥善保管您的成绩单，连同考试注册记录和注册时使用的电子邮箱地址一并保存。\n\
  \n##### 维护您的认证\n\nCompTIA 认证必须定期更新。要更新您的认证，您可以通过以下任一方式：通过最新版本的考试、获得合格的更高级别 CompTIA\
  \ 或行业认证、或完成足够的继续教育活动以获取足够的继续教育学分 (CEU) 进行更新。\n\nCompTIA 通过其网站 `www.comptia.org/continuing-education`\
  \ 提供更新相关信息。\n\n当您报名更新认证时，将被要求同意 CE 计划的《职业道德准则》、支付更新费用，并提交您所选更新方式所需的材料。\n\n可用于获取\
  \ CEU 以更新 Security+ 认证的行业认证完整列表，请访问 `www.comptia.org/continuing-education/choose/renew-with-a-single-activity/earn-a-higher-level-comptia-certification`。\n\
  \n### 本书涵盖内容？\n\n本书涵盖您理解安全管理员职角色与基本职责、并通过 Security+ 考试所需的一切知识。\n\n*   **第 1 章：当今的安全专业人员**\
  \   第 1 章 介绍网络安全领域。您将了解网络安全专业人员在保护组织数据的**机密性、完整性和可用性**方面发挥的关键作用。您还将了解组织面临的风险类型，以及如何利用管理、运营和技术安全控制来管理这些风险。\n\
  \n*   **第 2 章：网络安全威胁态势**   第 2 章 深入探讨网络安全威胁态势，帮助您了解当今环境中存在的不同类型的**威胁主体**以及它们利用的**威胁载体**来破坏安全控制。您还将了解如何利用**威胁情报来源**改进组织的安全计划，以及不同类型的**漏洞**引发的安全问题。\n\
  \n\n\n\n\n### 第 3 章：恶意代码\n第 3 章 探讨了您可能遇到的各种恶意代码。本章涵盖了蠕虫、病毒、特洛伊木马、僵尸程序、攻击者用于控制它们的命令与控制网络，以及其他多种类型的恶意软件。在此过程中，您还将了解针对人工智能和机器学习系统的攻击等新型威胁，以及攻击者如何在使用恶意软件之外，还利用内置脚本和编程语言作为其攻击的一部分。\n\
  \n## 第 4 章：社会工程学、物理攻击和密码攻击\n第 4 章 深入探讨了信息安全的人为因素。社会工程学关注个人如何对权威、恐吓和信任等各种技术做出反应，以及攻击者和渗透测试人员如何利用这些反应。您将探讨社会工程学的七大基本原则以及各种社会工程学和影响力战役技术。接下来，您将深入了解暴力破解攻击、字典攻击和密码喷射等密码攻击。最后，您将了解物理攻击是如何实施的，以及它们如何影响组织。\n\
  \n### 第 5 章：安全评估与测试\n第 5 章 探讨了您可能用来评估安全计划有效性的不同类型的安全评估和测试程序。您将了解网络安全专业人员使用的不同评估技术，以及在各种环境下正确进行渗透测试的方法。您还将学习如何制定满足组织安全需求的评估计划。\n\
  \n### 第 6 章：安全编码\n第 6 章 涵盖了应用程序代码中可能出现的安全问题以及与应用程序攻击相关的指标。您将了解安全应用程序开发、部署和自动化概念的应用，并发现如何帮助组织开发和部署能够抵御常见威胁的代码。\n\
  \n### 第 7 章：密码学与公钥基础设施\n第 7 章 解释了密码学在安全计划中发挥的关键作用，它通过促进安全通信和数据的安全存储来保障安全。您将学习基本的密码学概念，以及如何利用它们保护您自己环境中的数据。您还将了解可能被用来破坏您控制措施的常见密码学攻击。\n\
  \n### 第 8 章：身份与访问管理\n第 8 章 解释了身份作为现代组织安全层的用途。您将了解身份的组成部分、认证和授权的工作原理以及常用于实现它们的技术，还将了解单点登录、联邦身份认证和目录服务在认证和授权基础设施中的作用。您还将了解多因素认证和生物识别技术作为提供更安全认证的方法。账户、访问控制方案和权限也发挥着作用，您将探讨这些主题中的每一个。\n\
  \n#### 第 9 章：韧性与物理安全\n第 9 章 将带您了解物理安全概念。没有物理安全，组织就无法拥有真正安全的环境。在本章中，您将学习如何使用备份和冗余来构建具有弹性和抗灾能力的基础设施。您将探讨响应和恢复控制，它们有助于在故障发生和灾难来临时使组织恢复功能，并将了解一系列物理安全控制，以确保设施和系统免受现场攻击和威胁。最后，您将了解当设备和介质达到使用寿命终点需要被销毁或妥善处置时该怎么做。\n\
  \n### 第 10 章：云与虚拟化安全\n第 10 章 探讨了云计算和虚拟化安全的世界。许多组织现在在云中部署关键业务应用程序，并使用云环境处理敏感数据。您将了解组织如何利用可用的云服务，以及如何构建满足其需求的云架构。您还将学习如何通过结合使用传统控制和云专用控制来管理云服务的网络安全风险。\n\
  \n### 第 11 章：端点安全\n第 11 章 概述了您可能需要保护的各种端点类型。嵌入式系统、工业控制系统和物联网设备以及许多其他设备在安全设计中需要特殊考量。端点还需要加密和安全启动流程等安全解决方案，您也将探讨这些内容。最后，您将了解一些用于评估和保护端点安全的工具。\n\
  \n### 第 12 章：网络安全\n第 12 章 涵盖了从架构和设计到网络攻击和防御的网络安全。您将探讨常见的网络攻击技术和威胁，并了解用于应对或避免这些威胁的安全网络的协议、技术、设计概念和实施技术。您还将学习如何发现网络设备，以及网络数据包捕获和重放的基础知识。\n\
  \n### 第 13 章：无线与移动安全\n第 13 章 探讨了无线和移动安全的世界。您将了解种类日益繁多的无线技术是如何工作的，范围涵盖从 GPS 和蓝牙到\
  \ Wi-Fi。您将了解一些常见的无线攻击，以及如何设计和构建安全的无线环境。您还将了解用于保护和安全无线设备（如移动设备管理和设备部署方法）的技术和设计。\n\
  \n### 第 14 章：事件响应\n第 14 章 将指导您在出现问题时该怎么做。事件是安全专业人员的常态，您将了解事件响应策略、程序和技术。您还将了解在哪里以及如何获取响应流程所需的信息、常用工具有哪些，以及用于控制攻击并在事件发生后修复系统的缓解技术。\n\
  \n### 第 15 章：数字取证\n第 15 章 探讨了数字取证技术和工具。您将了解如何在调查过程中发现证据、关键取证工具和流程，以及如何将它们结合使用以确定出了什么问题。您还将了解在执法部门或法律顾问介入时，进行取证所需的法律和证据程序。\n\
  \n### 第 16 章：安全策略、标准与合规\n第 16 章 深入探讨了策略、标准和合规的世界——这是任何网络安全计划基础的关键构建模块。您将了解如何编写和执行涵盖人员、培训、数据、凭证和其他问题的策略。您还将了解理解管辖组织的法规、法律和标准的重要性，以及管理对这些要求的合规性。\n\
  \n## 第 17 章：风险管理与隐私\n第 17 章 描述了对网络安全专业人员工作至关重要的风险管理和隐私概念。您将了解风险管理过程，包括风险的识别、评估和管理。您还将了解隐私泄露的后果，以及您可以采取哪些控制措施来保护个人可识别信息的隐私。\n\
