  \ 风险接受\n     2.  风险规避\n     3.  风险缓解\n     4.  风险转移\n\n11. **最终，Grace 发现保险单太贵，选择不购买。她不采取任何额外行动。这种情况下使用的是哪种风险管理策略？**\n\
  \n     1.  风险接受\n     2.  风险规避\n     3.  风险缓解\n     4.  风险转移\n\n12. **根据欧盟的 `GDPR`，负责领导组织隐私工作的个人被称为什么？**\n\
  \n     1.  数据保护官\n     2.  数据控制者\n     3.  数据管理员\n     4.  数据处理者\n\n13. **Helen\
  \ 的组织代表其客户（个人医生）维护医疗记录。哪个术语最能描述 Helen 组织的角色？**\n\n     1.  数据处理者\n     2.  数据控制者\n\
  \     3.  数据所有者\n     4.  数据管理员\n\n14. **Gene 最近进行了一项评估，确定其组织最多可在没有主事务数据库的情况下维持两小时，超过这个时间业务将遭受不可接受的损害。Gene\
  \ 确定了哪项指标？**\n\n     1.  `MTBF`\n     2.  `MTTR`\n     3.  `RTO`\n     4.  `RPO`\n\
  \n15. **Tina 在一家医院系统工作，管理该系统的患者记录。以下哪类个人信息最能描述这些记录中可能包含的信息？**\n\n     1.  `PCI`\n\
  \     2.  `PHI`\n     3.  `PFI`\n     4.  `PII`\n\n16. **Asa 认为她的组织正在将从客户处收集的技术支持数据用于营销，且未经客户许可。最可能违反了哪项原则？**\n\
  \n     1.  数据最小化\n     2.  数据保留\n     3.  目的限制\n     4.  数据主权\n\n17. **以下哪个美国政府分类级别要求最高程度的安全控制？**\n\
  \n     1.  机密\n     2.  秘密\n     3.  绝密\n     4.  非密\n\n18. **如果正确执行，以下哪种数据保护技术是可逆的？**\n\
