  \n     1.  物理隔离\n     2.  法拉第笼\n     3.  冷通道\n     4.  筛选子网\n\n14.  Kathleen 想要阻止潜在攻击者进入她负责的设施。以下哪项*不是*用于此类预防性防御的常见控制？\n\
  \n     1.  围栏\n     2.  照明\n     3.  机器人哨兵\n     4.  标识\n\n\n\n\n### 15. 技术多样性如何帮助确保网络安全弹性？\n\
  \n1. 它确保单一公司产品中的漏洞不会影响整个基础设施。\n2. 如果单一供应商倒闭，公司无需更换其整个基础设施。\n3. 这意味着错误配置不会影响公司的整个基础设施。\n\
  4. 以上皆是。\n\n### 16. Scott 将备份发送给一家将其保存在安全保管库中的公司。他实施了哪种备份解决方案？\n\n1. 近线\n2. 安全\n\
  3. 在线\n4. 离线\n\n### 17. Gabby 想要实施镜像驱动器解决方案。这描述的是哪个 RAID 级别？\n\n1. RAID 0\n2. RAID\
  \ 1\n3. RAID 5\n4. RAID 6\n\n### 18. Florian 想要确保受保护网络上的系统无法通过组织网络遭受攻击。他应使用何种设计技术来确保这一点？\n\
  \n1. 热通道\n2. 气隙\n3. 冷通道\n4. 受保护的线缆分发\n\n### 19. 此处显示的是哪种物理安全控制？\n\n![](img/c09uf001.png)\n\
  \n1. 法拉第笼\n2. 访问控制门厅\n3. 防撞柱\n4. 气隙\n\n### 20. Gurvinder 确定了一家距离超过 90 英里的第三方数据中心提供商来运行其冗余数据中心操作。为什么要将数据中心放置得那么远？\n\
  \n1. 因为法律要求\n2. 网络流量延迟顾虑\n3. 地理分散\n4. 地理税务原因\n\n### 第 10 章：云与虚拟化安全\n\n云计算正在改变所有行业的信息技术。各种规模的组织都被云计算解决方案的敏捷性、灵活性、成本效益和可扩展性所吸引，并迅速将其集成到其技术环境中，如果不是完全转向云端的话。新企业采取“生于云端”的方法，使它们能够在不运营一台服务器的情况下运行整个业务。\n\
  \n本章讨论了对安全专业人员最重要且 Security+ 考试涵盖的云计算方面。您将探索不同的云计算模型、常见的云安全顾虑，以及用于保护云操作的机密性、完整性和可用性的安全控制。\n\
  \n### 探索云\n\n**云计算**可能是一个令人生畏的术语，但其基本理念很简单：云服务提供商通过互联网向客户提供计算服务。这可以像 Google 在网页浏览器中向客户提供\
  \ Gmail 服务一样简单，也可以像 Amazon Web Services (AWS) 向企业客户提供虚拟化服务器以供其构建自己的技术环境一样复杂。在每种情况下，提供商都构建一项\
  \ IT 服务，并利用互联网将该服务交付给其客户。\n\n以下是美国国家标准与技术研究院 (NIST) 对云计算的一个更正式的定义：\n\n> 云计算是一种模型，用于实现普遍、便捷、按需的网络访问，进入可配置的计算资源共享池（例如网络、服务器、存储、应用程序和服务），这些资源能够以最少的管理工作或服务提供商交互快速配置和释放。\n\
  \n让我们浏览一下该定义的一些组成部分。云计算是普遍且便捷的。云提供的资源可供客户随时随地使用。如果您有互联网接入，就可以访问云。无论您坐在办公室还是在海滩上，这都无关紧要。\n\
  \n云计算也是按需的。在大多数情况下，您可以在几分钟内通过几次点击来配置和取消配置云资源。当您需要时，几乎可以立即获取新的云资源；当不再需要时，可以快速将其关闭（并停止付费！）。\n\
  \n云的许多关键优势源于这样一个事实：它使用可由不同用户为不同目的配置的共享资源池。这种共享允许**过度订阅**，因为并非所有人会同时使用其所有资源，并实现了规模经济。许多不同用户在同一云基础设施中共享资源这一事实称为**多租户**。在多租户环境中，相同的物理硬件可能支持许多不同客户的工作负载和存储需求，所有这些客户都在彼此不知情且无交互的情况下运行。\n\
  \n云提供各种可配置的计算资源。我们将在本章后面讨论不同的云服务模型，但您可以通过云服务提供商获取基础设施组件、平台或完整的应用程序，然后对其进行配置以满足您的需求。\n\
  \n云服务的快速配置和释放也只需最少的管理工作和服务提供商交互即可进行。与本地硬件采购不同，您可以自行配置云服务，无需与客户代表打交道，也无需等待订单处理时间。如果您需要一台新的云服务器，不必致电\
  \ Microsoft、Amazon 或 Google。您只需在其网站上点击几个按钮即可搞定。从大多数用户的角度来看，云呈现出了看似无限的容量。\n\n####\
  \ 云的优势\n\n当组织考虑云在其技术基础设施中的适当角色时，他们寻求解决的关键问题是本地资源与云/异地资源之间的适当平衡。正确的平衡因组织而异。了解云提供的一些关键优势有助于找到正确的平衡：\n\
  \n* **按需自助计算**。云资源在您需要的时候和地点可用。这为开发人员和技术人员提供了难以置信的敏捷性，缩短了周期时间并提高了部署速度。\n* **可扩展性**。随着对基于云的服务需求增加，客户可以手动或自动增加其运营容量。在某些云环境中，云服务提供商可能会以一种对客户完全透明的方式在后台扩展资源来实现这一点。云提供商通过两种方式实现可扩展性：\n\
  \    * **垂直扩展**增加现有服务器的容量，如图 10.1(a)所示。例如，您可能会更改分配给服务器的 CPU 核心数或内存量。在物理世界中，这意味着打开服务器并添加物理硬件。在云中，您只需点击几个按钮即可添加内存或计算容量。\n\
  \    * **水平扩展**向集群服务器池中添加更多服务器，如图 10.1(b)所示。如果您运行一个由两台服务器支持 2,000 个并发用户的网站，每当典型使用量再增加\
  \ 1,000 个用户时，您可能就会添加一台新服务器。云计算使这变得非常容易，因为您只需点击几下即可复制现有服务器。\n\n    ![图 10.1 (a) 垂直扩展\
  \ vs. (b) 水平扩展](img/c10f001.png)\n\n    **图 10.1** (a) 垂直扩展 vs. (b) 水平扩展\n\n* **弹性**。弹性和可扩展性密切相关。可扩展性侧重于快速增加容量。弹性意味着容量应随需求变化而**扩展和收缩**，以优化成本。如果您的网站开始经历活动爆发，弹性允许您自动添加服务器，直到满足该容量需求，然后在不再需要该容量时移除这些服务器。\n\
  \n\n\n\n*   **计量服务**。您在云中所做的一切都会由提供商进行计量。提供商会跟踪您消耗的处理时间秒数、您占用的存储空间量、您生成的日志条目数量以及许多其他指标。他们利用这些信息根据您的使用情况来评估费用。您只需为您所用的内容付费——不多也不少。\n\
  \n*   **敏捷性**和**灵活性**。预配云资源的速度以及短期使用它们的能力，为技术组织提供了极大的敏捷性和灵活性。希望尝试新想法的开发人员和工程师可以快速启动测试环境，评估该方法，并以最小的工作量和成本决定是否将其移入生产环境。\n\
  \n#### 云角色\n\n在任何云计算环境中，不同的组织扮演不同的角色。云中有五个关键角色：\n\n*   **云服务提供商**是向客户提供云计算服务的公司。他们可能会建立自己的数据中心，或者与其他云提供商紧密合作以提供服务，但他们的决定性特征是他们提供云服务供销售。\n\
  \n*   **云消费者**是从云服务提供商处购买云服务的组织和个人。他们使用这些服务来满足自身的业务需求。\n\n*   **云合作伙伴**（或云代理）是提供辅助产品或服务以支持或集成云服务提供商产品的组织。云合作伙伴可能提供培训或咨询以帮助客户使用云服务，提供软件开发和集成服务，或执行任何其他促进云产品使用的服务。\n\
  \n*   **云审计员**是对云服务和运营提供第三方评估的独立组织。根据审计业务的范围，他们可能会对云环境提供总体评估，或专注于特定范围运营的安全控制。\n\n\
  *   **云承载商**充当中介，提供连接服务，使云服务能够从提供商交付给消费者。\n\n#### 云服务模型\n\n我们根据产品/服务的性质，将云服务提供商提供的服务类型分为几类。云中可用的各种服务通常被称为“一切即服务”，或缩写为\
  \ **XaaS**，其中 **X** 表示特定服务的性质。尽管有许多不同类型的云服务，但我们通常使用三种主要服务模型来描述它们：**基础设施即服务**、**软件即服务**\
  \ 和 **平台即服务**。\n\n##### 基础设施即服务\n\n**基础设施即服务** 产品允许客户购买技术基础设施的基本构建模块并与之交互。这些包括计算、存储和网络。然后，客户可以灵活地以任何他们喜欢的方式配置和管理这些服务，以满足自己的业务需求。客户无需担心底层硬件的管理，但他们确实有能力自定义组件以满足其需求。在\
  \ **IaaS** 模型中，云服务提供商负责管理物理设施和底层硬件。提供商还必须实施安全控制，以防止客户互相窃听或干扰彼此对基础设施环境的使用。\n\n尽管市场上有数十家\
  \ **IaaS** 提供商，但目前市场由三大主要参与者主导：**Amazon Web Services (AWS)**、**Microsoft Azure**\
  \ 和 **Google Cloud Platform (GCP)**。这三家提供商服务于绝大多数 **IaaS** 客户，并提供广泛的计算、存储和网络产品，以及位于堆栈更高层的补充服务，例如安全监控、内容分发网络和应用流式传输。\n\
  \n##### 软件即服务\n\n**软件即服务** 产品为客户提供对在云中运行的完全托管应用程序的访问。提供商负责从物理数据中心的运营到应用程序本身的性能管理的一切事务，尽管其中一些任务可能会外包给其他云服务提供商。在\
  \ **SaaS** 模型中，客户仅负责应用程序本身的有限配置、选择他们希望与云解决方案一起使用的数据，以及使用应用程序提供的访问控制来限制对该数据的访问。\n\
  \n**SaaS** 模型广泛用于交付从基于 Web 的电子邮件到企业资源规划 (**ERP**) 和客户关系管理 (**CRM**) 套件等各类应用程序。客户可持续访问尖端软件，并通常使用订阅模式支付\
  \ **SaaS** 服务费用。产品用户通常通过标准 Web 浏览器访问应用程序，甚至可能使用瘦客户端设备，例如 图 10.2 所示的 **Google Chromebook**。\n\
  \n##### 平台即服务\n\n**平台即服务** 产品处于 **SaaS** 和 **IaaS** 解决方案之间的中间地带。在 **PaaS** 产品中，服务提供商提供一个平台，客户可以在其中运行他们自己开发的应用程序。云服务提供商构建并管理基础设施，并为客户提供执行环境，其中可能包括促进代码执行的代码库、服务和工具。\n\
  \n![图 10.2 瘦客户端，如这款三星 Google Chromebook，足以访问 SaaS 应用程序。](img/c10f002.png)\n\n**图\
  \ 10.2** 瘦客户端，如这款三星 Google Chromebook，足以访问 SaaS 应用程序。\n\n**函数即服务** 平台是 **PaaS**\
  \ 计算的一个示例。这种方法允许客户将自己的代码函数上传到提供商，然后提供商将按计划、响应事件和/或按需执行这些函数。**AWS Lambda** 服务（如 图\
  \ 10.3 所示）是 **FaaS/PaaS** 产品的一个示例。**Lambda** 允许客户使用 **Python**、**Java**、**C+**、**PowerShell**、**Node.js**、**Ruby**、**Go**\
  \ 和其他编程语言编写代码。图 10.3 中所示的 **Lambda** 函数是一个 **Python** 函数，旨在从 **物联网** 温度传感器读取当前温度。\n\
  \n由于 **FaaS** 环境不会向客户暴露执行其代码的实际服务器实例，因此它们通常被称为 **无服务器计算** 环境。然而，这在一定程度上是一个误称，因为\
  \ **FaaS** 环境确实有运行代码的服务器，但它们以对 **FaaS** 客户透明的方式进行。\n\n![图 10.3 AWS Lambda 函数即服务环境](img/c10f003.png)\n\
  \n**图 10.3** AWS Lambda 函数即服务环境\n\n#### 云部署模型\n\n云部署模型描述了云服务如何交付给客户，以及用于向一个客户提供服务的资源是否与其他客户共享。\n\
  \n##### 公有云\n\n当我们想到“云”时，通常首先想到的是 **公有云** 产品。公有云服务提供商部署基础设施，然后以多租户模式使其可供任何希望利用它的客户访问。单个客户可能在分布在一个或多个数据中心的服务器上运行工作负载，而这些服务器可能同时为许多不同的客户运行工作负载。\n\
  \n\n\n\n#### 云部署模型\n\n公有云支持所有云服务模型。公有云提供商可能会向其客户提供 `IaaS`、`PaaS`、`SaaS` 和 `FaaS`\
  \ 服务。关键区别在于，这些服务并非运行在专属于单个客户的基础设施上，而是运行在面向公众开放的基础设施上。`AWS`、`Microsoft Azure` 和 `Google\
  \ Compute Platform` 均采用公有云模型。\n\n##### 私有云\n\n术语 `private cloud`（私有云）用于描述为单个客户使用而配置的任何云基础设施。该基础设施可能由将使用该基础设施的组织构建和管理，也可能由第三方构建和管理。此处的关键区别在于，只有一个客户使用该环境。因此，私有云服务往往拥有过剩的未使用容量以支持峰值需求，因此与公有云服务相比，其成本效益不高。\n\
  \n##### 社区云\n\n`community cloud`（社区云）服务兼具公有云和私有云模型的特征。社区云服务确实运行在多租户环境中，但租户仅限于特定设计社区的成员。社区成员资格通常基于共同的使命、相似的安全与合规要求或其他共性来定义。\n\
  \n如图 10.4 所示的 HathiTrust 数字图书馆，就是社区云实际应用的一个例子。学术研究图书馆联合起来形成一个联盟，提供对其馆藏图书的访问。HathiTrust\
  \ 成员机构的学生和教职员工可以登录社区云服务以访问资源。\n\n##### 混合云\n\n`Hybrid cloud`（混合云）是一个统称，用于描述将公有云、私有云和/或社区云服务融合在一起的云部署。它不仅仅是同时购买公有云和私有云服务并一起使用。混合云要求使用能够将不同云产品统一为单一连贯平台的技术。\n\
  \n例如，一家公司可能为其大部分工作负载运行自己的私有云，然后在需求超过其私有云基础设施容量时利用公有云容量。这种方法称为公有云 `bursting`（云爆发/突发）。\n\
  \n![FIGURE 10.4 HathiTrust is an example of community cloud computing.](img/c10f004.png)\n\
  \n**图 10.4** HathiTrust 是社区云计算的一个例子。\n\n`AWS Outposts`，如图 10.5 所示，是混合云计算的例子。该服务的客户会收到一机架计算设备，并在自己的数据中心安装。机架中的设备由\
  \ `AWS` 维护，但由客户以与其 `AWS` 公有云资源相同的方式进行配置。这种方法属于混合云，因为客户可以通过同一管理平台同时管理其本地 `AWS Outposts`\
  \ 私有云部署及其公有云 `AWS` 服务。\n\n### 共享责任模型\n\n在某些方面，以云为中心的环境中的网络安全工作与本地网络安全非常相似。无论我们的系统托管在何处，我们仍然需要考虑数据的机密性、完整性和可用性，并实施强有力的访问控制和其他机制来保护这些主要目标。\n\
  \n![FIGURE 10.5 AWS Outposts offer hybrid cloud capability. ¶ Image property of\
  \ Amazon Web Services; used with permission](img/c10f005.png)\n\n**图 10.5** AWS\
  \ Outposts 提供混合云能力。 ¶ 图片归 Amazon Web Services 所有；经许可使用\n\n然而，云安全运营在很大程度上也不同于本地环境，因为云客户必须在一个或多个服务提供商与客户自身的网络安全团队之间划分责任。这种类型的运营环境称为\
  \ `shared responsibility model`（共享责任模型）。图 10.6 展示了 `IaaS`、`PaaS` 和 `SaaS` 环境中常见的责任划分。\n\
  \n![FIGURE 10.6 Shared responsibility model for cloud computing](img/c10f006.png)\n\
  \n**图 10.6** 云计算共享责任模型\n\n在某些情况下，这种责任划分是明确的。云提供商因其本质，始终负责硬件和物理数据中心环境的安全。如果由客户处理其中任何一项，该解决方案将不符合云计算的定义。\n\
  \n责任的差异出现在堆栈的更高层，并根据所使用的云服务性质而有所不同。在 `IaaS` 环境中，客户承担除基础设施以外所有内容的安全责任——即他们在 `IaaS`\
  \ 环境中运行的操作系统、应用程序和数据。\n\n在 `PaaS` 解决方案中，供应商也承担操作系统的责任，而客户保留对放入环境中的数据及其安全配置的责任。应用层的责任由服务提供商和客户共担，具体的责任划分根据服务的性质而变化。例如，如果\
  \ `PaaS` 平台为客户代码提供运行时解释器，则云提供商负责这些解释器的安全。\n\n在 `SaaS` 环境中，提供商承担几乎所有的安全责任。客户对其放置在\
  \ `SaaS` 环境中的数据以及围绕该数据的访问控制配置保留一定的共享控制权，但 `SaaS` 提供商因获得报酬而承担大部分运营任务（包括网络安全）的负担。\n\
  \n### 云标准与指南\n\n网络安全社区提供了各种参考文档，帮助组织对云和云安全问题达成共同理解。\n\n由美国国家标准与技术研究院（`NIST`）在其 `SP\
  \ 500-292` 中发布的云参考架构，为云服务提供了高层级的分类法。本章前面讨论的云角色改编自 `NIST` 云参考架构。图 10.7 展示了 `NIST`\
  \ 关于架构要素如何组合在一起的高层级愿景。\n\n![FIGURE 10.7 Cloud Reference Architecture ¶ Source: NIST\
  \ SP 500-292](img/c10f007.png)\n\n**图 10.7** 云参考架构 ¶ 来源：NIST SP 500-292\n\n云安全联盟（`CSA`）是一个专注于开发和推广云安全最佳实践的行业组织。他们开发了云控制矩阵（`CCM`），作为一份参考文档，旨在帮助组织理解云安全控制的适当用法，并将这些控制映射到各种法规标准。`CCM`\
  \ 是一份冗长的 Excel 电子表格，可从 `cloudsecurityalliance.org/artifacts/cloud-controls-matrix-v3-0-1`\
  \ 下载。图 10.8 中显示了一个摘录。\n\n![FIGURE 10.8 Cloud Controls Matrix excerpt ¶ Source: Cloud\
  \ Security Alliance](img/c10f008.png)\n\n**图 10.8** 云控制矩阵摘录 ¶ 来源：云安全联盟\n\n### 虚拟化\n\
  \n云计算提供商以及大多数其他现代数据中心运营商，广泛使用 `virtualization`（虚拟化）技术，允许多个客户系统共享同一底层硬件。在虚拟化数据中心中，虚拟主机硬件运行一种称为\
  \ `hypervisor`（管理程序/虚拟机监视器）的特殊操作系统，它协调对底层硬件资源的访问。\n\n\n\n虚拟机随后运行在 Hypervisor 提供的此虚拟基础设施之上，运行标准操作系统，如\
  \ Windows 和 Linux 变体。虚拟机可能不知道它们正在虚拟化环境中运行，因为 Hypervisor 欺骗它们，让它们以为拥有对底层硬件的正常访问权限，而实际上，这些硬件与其他系统共享。\n\
  \n#### Hypervisor\n\nHypervisor 的主要职责是强制执行虚拟机之间的`isolation`（隔离）。这意味着 Hypervisor\
  \ 必须向每个虚拟机呈现一个完全独立的物理环境的假象，该环境专供该虚拟机使用。从运营角度来看，隔离确保虚拟机不会相互干扰彼此的操作。从安全角度来看，这意味着虚拟机无法访问或更改分配给另一个虚拟机的信息或资源。\n\
  \nHypervisor 主要有两种类型：\n\n*   **Type I Hypervisor**（第 I 类 Hypervisor），也称为**Bare Metal\
  \ Hypervisor**（裸金属 Hypervisor），直接在底层硬件之上运行。随后，Hypervisor 为每个虚拟机支持 Guest OS（客户操作系统），如图\
  \ 10.9 所示。这是数据中心虚拟化中最常用的模型，因为它效率极高。\n\n    ![FIGURE 10.9 Type I hypervisor](img/c10f009.png)\n\
  \n    **图 10.9 Type I Hypervisor**\n\n*   **Type II Hypervisor**（第 II 类 Hypervisor）作为应用程序运行在现有操作系统之上，如图\
  \ 10.10 所示。在此方法中，操作系统支持 Hypervisor，而 Hypervisor 从 Host OS（宿主操作系统）为每个 Guest OS 请求资源。此模型常用于在个人计算机上为开发人员、技术人员及其他需要运行自己虚拟机的人员提供虚拟化环境。它比裸金属虚拟化效率低，因为宿主操作系统引入了一个消耗资源的低效层。\n\
  \n    ![FIGURE 10.10 Type II hypervisor](img/c10f010.png)\n\n    **图 10.10 Type\
  \ II Hypervisor**\n\n### 云基础设施组件\n\nIaaS 计算环境为组织提供各种计算资源的访问权限，包括计算容量、存储和网络。这些资源以灵活的方式提供，通常可在请求后立即使用。\n\
  \n#### 云计算资源\n\n计算容量是组织迁移到云的主要需求之一。当它们寻求增强或替换自有数据中心中运行的服务器时，会寻求云中的虚拟化服务器和其他提供计算容量的方式。所有这些技术均受益于云的动态资源分配，允许管理员根据需求变化自动或手动添加和移除资源。\n\
  \n##### 虚拟化服务器\n\n虚拟机是云中计算容量的基本构建块。组织可配置运行大多数常见操作系统的服务器，并指定满足业务需求所需的特定 CPU 核心数、RAM\
  \ 容量和存储容量，如图 10.11 所示。服务器实例的成本通常按小时费率累计，该费率根据服务器消耗的计算、内存和存储资源而异。\n\n配置好虚拟化服务器后，您可以像与自有数据中心中运行的服务器交互一样与其交互。图\
  \ 10.12 显示了到 Linux IaaS 实例的 SSH 连接。\n\n图 10.13 显示了使用 Microsoft Remote Desktop 工具通过远程桌面协议（RDP）连接到\
  \ Windows IaaS 实例以获取图形用户界面。这些工具允许管理员正常地与虚拟化服务器交互。\n\n##### 容器\n\n`Containers`（容器）提供应用级虚拟化。容器不创建需要自己操作系统的复杂虚拟机，而是打包应用程序，允许将它们视为可跨操作系统和硬件平台移植的虚拟化单元。\n\
  \n实施容器化的组织运行容器化平台（如 `Docker`），这些平台为操作系统资源提供标准化接口。无论底层操作系统或硬件如何，此接口保持一致，接口的一致性使容器能根据需要在系统间移动。\n\
  \n容器化平台与虚拟化平台共享许多相同的安全考量。它们必须强制执行容器间的隔离，以防止运行在一个容器中的应用程序意外或故意与分配给另一个容器的资源交互而导致运营和安全问题。\n\
  \n![FIGURE 10.11 Provisioning a virtualized server in AWS](img/c10f011.png)\n\n\
  **图 10.11 在 AWS 中配置虚拟化服务器**\n\n![FIGURE 10.12 Connecting to an AWS virtual server\
  \ instance with SSH](img/c10f012.png)\n\n**图 10.12 使用 SSH 连接到 AWS 虚拟服务器实例**\n\n\
  ![FIGURE 10.13 Connecting to an AWS virtual server instance with RDP](img/c10f013.png)\n\
  \n**图 10.13 使用 RDP 连接到 AWS 虚拟服务器实例**\n\n#### 云存储资源\n\n基础设施提供商还为客户提供存储资源，包括与其计算产品配套的存储，以及用于构建其他云架构的独立存储产品。这些存储产品主要分两大类：\n\
  \n*   **Block Storage**（块存储）为虚拟服务器实例分配大量存储卷。这些卷随后由这些服务器实例上的操作系统格式化为虚拟磁盘，并像使用物理驱动器一样使用。AWS\
  \ 通过其 `Elastic Block Storage (EBS)` 服务提供块存储。图 10.14 显示了一系列分配用于虚拟服务器的 EBS 卷。\n\n\
  *   **Object Storage**（对象存储）使客户能够将文件放入存储桶，并将每个文件视为可通过 Web 或提供商 API 访问的独立实体。对象存储向最终用户隐藏存储细节，用户无需知道或关心底层磁盘。AWS\
  \ `Simple Storage Service (S3)` 是对象存储的一个示例。图 10.15 显示了一个 S3 存储桶示例。\n\n    ![FIGURE\
  \ 10.14 AWS Elastic Block Storage (EBS) volumes](img/c10f014.png)\n\n    **图 10.14\
  \ AWS Elastic Block Storage (EBS) 卷**\n\n    ![FIGURE 10.15 AWS Simple Storage Service\
  \ (S3) bucket](img/c10f015.png)\n\n    **图 10.15 AWS Simple Storage Service (S3)\
  \ 存储桶**\n\n在使用云存储时，请务必将以下三个关键安全考量牢记在心：\n\n*   **正确设置权限**。确保您仔细关注放置在存储上的访问策略。这对于对象存储尤为重要，因为几次错误的点击可能会无意中将敏感文件发布到\
  \ Web 上。\n\n*   **考虑高可用性和持久性选项**。云提供商向用户隐藏实现细节，但这并不意味着它们能免疫硬件故障。请使用提供商的复制功能或实施自己的复制，以满足可用性和完整性要求。\n\
  \n\n\n### 使用加密保护敏感数据\n\n您可以对存储在云中的单个文件应用自己的加密，也可以使用提供商提供的全盘加密选项。图 10.16 展示了在 AWS\
  \ EBS 卷上启用全盘加密的过程。\n\n![图 10.16 在 EBS 卷上启用全盘加密](img/c10f016.png)\n\n**图 10.16**\
  \ 在 EBS 卷上启用全盘加密\n\n### 云网络\n\n云网络遵循与其他云基础设施资源相同的虚拟化模型。云消费者可访问网络资源以连接其其他基础设施组件，并能根据需要配置带宽以满足其需求。\n\
  \n云网络通过允许工程师通过 API 与云资源交互和修改，支持了 `软件定义网络 (SDN)` 运动。同样，它们为网络安全专业人员提供了 `软件定义可视性 (SDV)`，使其能够洞察其虚拟网络上的流量。\n\
  \n#### 安全组\n\n安全专业人员在其物理网络上使用防火墙，以限制允许进入组织安全边界的网络流量类型。云服务提供商也实施了防火墙，但它们不向客户提供对这些防火墙的直接访问权限，因为这样做会违反隔离原则，因为这可能允许一位客户对防火墙进行更改，从而影响其他客户。\n\
  \n相反，云服务提供商通过使用 `安全组` 来满足防火墙的需求，安全组定义了允许的网络流量。这些安全组由一组网络流量规则组成，这些规则与防火墙规则集实质上相同。图\
  \ 10.17 展示了一个安全组的示例。\n\n![图 10.17 限制对云服务器访问的安全组](img/c10f017.png)\n\n**图 10.17**\
  \ 限制对云服务器访问的安全组\n\n安全组通常被视为提供商虚拟服务器的一项功能，因此不会产生额外费用。\n\n#### 虚拟私有云 (VPC)\n\n`分段`\
  \ 是网络安全的核心概念之一。分段允许网络工程师将不同安全级别和功能的系统放置在不同的网络子网上。类似分组的系统能够相互通信，同时与其他网段上的系统保持隔离。\n\
  \n在物理网络中，网络和安全专业人员使用虚拟局域网 (VLAN) 技术来实现分段。在云环境中，`虚拟私有云 (VPC)` 起到相同的作用。使用 VPC，团队可以将系统分组到子网中，并根据是否允许从互联网访问，将这些子网指定为公共或私有。云提供商还提供\
  \ `VPC 终端节点`，允许使用云提供商的安全网络骨干将 VPC 相互连接。云 `传输网关` 进一步扩展了这一模型，允许云 VPC 与本地 VLAN 直接互联，以实现混合云操作。\n\
  \n图 10.18 展示了创建 VPC 并指定 VPC 是否应包含公共和/或私有子网的过程。\n\n#### DevOps 和云自动化\n\n![图 10.18\
  \ 创建虚拟私有云](img/c10f018.png)\n\n**图 10.18** 创建虚拟私有云\n\n组织和运行技术团队的传统方法侧重于以技术角色为中心构建专业知识孤岛。特别是，软件开发和技术运维通常被视为截然分离的两个领域。开发人员致力于创建业务所需的软件应用程序，并拥有自己的一套流程来指定需求、设计接口、编写代码、测试应用程序和维护代码库。当他们完成新版本应用程序的测试后，会将其移交给技术运维团队，由后者管理支持该应用程序的服务器和其他基础设施。\n\
  \n将开发和运维世界分离开来，为技术人员提供了一个舒适的工作环境，他们的任务定义清晰，且周围是同行社区。然而，这也带来了显著的劣势，包括以下几点：\n\n* \
  \  将运维团队与开发过程隔离开来，阻碍了他们对业务需求的理解。\n*   将开发人员与运维考量隔离开来，导致设计在处理器、内存和网络消耗方面显得浪费。\n*\
  \   要求从开发到运维的明确移交，通过要求漫长的过渡阶段，降低了敏捷性和灵活性。\n*   增加与过渡相关的开销，鼓励将许多小的修复和增强合并为一个主要版本，从而增加了满足需求的时间。\n\
  \n认识到将开发和运维团队分离的固有劣势，许多组织现在采用 `DevOps` 方法进行技术管理。这种方法将开发和运维团队聚集在一个统一的过程中，让他们以敏捷的方式共同进行软件开发。软件测试和发布过程变得高度自动化和协作化，使组织能够从漫长的发布管理流程转变为每天可能发布数十次更新的世界。\n\
  \n`基础设施即代码 (IaC)` 是 DevOps 运动背后的关键赋能技术之一，也是云计算服务集成的关键优势之一。IaC 是通过脚本代码而非人工干预，自动完成基础设施服务的预配、管理和取消预配的过程。IaC\
  \ 是所有主要 IaaS 环境（包括 AWS、Microsoft Azure 和 Google Cloud Platform）的关键特性之一。\n\nIaC 形式多样，既可以是云服务提供商提供的一项功能，也可以是由第三方云管理平台启用的功能。在大多数情况下，运维团队通过云提供商的\
  \ Web 界面可用的操作，也都可通过代码实现。\n\nAWS 提供了一项名为 `CloudFormation` 的服务，允许开发人员以多种格式指定其基础设施需求，包括\
  \ `JavaScript 对象表示法 (JSON)` 和 `YAML Ain't Markup Language (YAML)`。图 10.19 展示了一个用于\
  \ EC2 实例的 JSON 规范示例。\n\n![图 10.19 使用 CloudFormation JSON 创建 EC2 实例](img/c10f019.png)\n\
  \n**图 10.19** 使用 CloudFormation JSON 创建 EC2 实例\n\n`基础设施即代码` 方法依赖于云提供商提供的 `应用程序编程接口\
  \ (API)`。开发人员可以使用云提供商 API 以编程方式预配、配置、修改和取消预配云资源。API 集成在采用微服务的云环境中特别有用，微服务是通过函数即服务模型向其他服务提供非常细粒度功能的云服务产品。这些微服务旨在响应环境中发生的事件相互通信。\n\
  \n### 云安全问题\n\n云为组织带来了巨大的运营和财务优势，但这些优势也伴随着云环境中出现的新安全问题。\n\n#### 可用性\n\n\n\n\n#####\
  \ 云环境中的可用性问题\n\n正如在本地部署环境中一样，可用性问题也存在于云环境中。云的主要优势之一是云服务商可能在许多不同的地理区域运营，并且它们通常提供简单的机制，用于跨这些区域备份数据和/或跨不同可用区以高可用性模式运行。例如，一家在云中运行\
  \ Web 服务器集群的公司可能会选择在每个主要大洲部署服务器，以服务这些地区的客户，并在特定地理区域发生大规模问题时提供地理多样性保障。\n\n#### 数据主权\n\
  \n正如您刚才所读，云计算的分布式特性涉及使用地理位置遥远的设施来实现高可用性，并将内容放置在靠近用户的位置。这可能意味着客户的数据存储并处理在许多不同国家的数据中心中，无论是否有明确通知。除非客户了解其数据的存储方式，否则这可能会引发法律问题。\n\
  \n**数据主权**是一项原则，规定数据受其被收集、存储或处理所在司法管辖区的法律限制。根据这一原则，客户可能会受制于某个司法管辖区的法律要求，而他们与该司法管辖区唯一的关联仅在于其云服务商在该管辖区内运营一个数据中心。\n\
  \n负责管理云服务的安全专业人员应确保了解其数据如何跨司法管辖区存储、处理和传输。他们也可以选择使用仍保留在服务商控制之外的密钥来加密数据，以确保其对数据保持唯一控制权。\n\
  \n一些云服务商提供对特定区域资源使用的显式控制。例如，图 10.20 展示了 Zoom 用户用于阻止使用位于中国或香港数据中心的控制选项。\n\n![图 10.20\
  \ 限制 Zoom 会议使用的数据中心区域](img/c10f020.png)\n\n**图 10.20** 限制 Zoom 会议使用的数据中心区域\n\n####\
  \ 虚拟化安全\n\n**虚拟机逃逸**漏洞是虚拟化环境中可能存在的最严重问题，特别是在虚拟主机运行不同安全级别的系统时。在逃逸攻击中，攻击者拥有对单个虚拟主机的访问权限，然后设法利用该访问权限侵入分配给另一台虚拟机的资源。Hypervisor（虚拟机监视器）本应通过将虚拟机的访问限制在仅分配给该机器的资源上来防止此类访问。逃逸攻击允许在虚拟机上运行的进程“逃逸”出这些\
  \ Hypervisor 限制。\n\n**虚拟机蔓延**发生在 IaaS 用户创建虚拟服务实例后将其遗忘或放弃，导致这些实例随着时间推移产生费用并积累安全问题。组织应保持实例感知，以避免虚拟机蔓延问题。\n\
  \n#### 应用安全\n\n云应用遭受许多与其他应用相同的安全问题。这些软件安全问题已在第 6 章“安全编码”中介绍。\n\n云应用高度依赖应用程序编程接口（API）来提供服务集成和互操作性。除了实施第\
  \ 6 章中讨论的安全编码实践外，负责基于 API 应用的安全分析师还应实施**API 检查**技术，以审查 API 请求中的安全问题。这些功能通常存在于 Web\
  \ 应用防火墙解决方案中。\n\n**安全 Web 网关（SWG）**也为依赖云的组织提供了一层应用安全。SWG 监控内部用户发出的 Web 请求，并根据组织的安全策略进行评估，阻止违反这些要求的请求。SWG\
  \ 通常用于阻止访问潜在恶意内容，但也可用于强制执行内容过滤限制。\n\n#### 治理与审计\n\n技术治理工作指导 IT 组织的工作，并确保其与组织战略和政策保持一致。这些工作还应指导云供应商关系的建立和维护。云治理工作有助于：\n\
  \n*   审查拟建立云合作伙伴关系的供应商\n*   管理供应商关系并监控供应商稳定性问题的早期预警信号\n*   监督组织的云活动组合\n\n**可审计性**是云治理的重要组成部分。云计算合同应包含保证客户有权审计云服务提供商的条款。他们可以选择自行执行这些审计，或聘请第三方进行独立审计。审计的使用对于向客户提供保证至关重要，即提供商正在以安全的方式运营并履行其合同数据保护义务。\n\
  \n### 云安全控制\n\n云服务商和第三方组织提供各种解决方案，帮助组织在云中实现其安全目标。组织可以选择采用其云服务商提供的云原生控制、第三方解决方案，或两者的结合。\n\
  \n云服务商提供的控制具有与服务商产品直接集成的优势，通常使其具有成本效益且用户友好。第三方解决方案通常成本较高，但它们带来了与多种云服务商集成的优势，便于多云环境的管理。\n\
  \n#### 云访问安全代理\n\n大多数组织出于不同目的使用多种云服务商。大型组织从数十家甚至数百家不同的提供商处购买云服务并不罕见。当组织使用高度专业化的\
  \ SaaS 产品时，这种情况尤为常见。在这些服务中一致地管理安全策略对网络安全分析师构成了重大挑战。\n\n**云访问安全代理（CASB）**是充当云服务用户和云服务提供商之间中介的软件工具。这种定位使它们能够监控用户活动并强制执行策略要求。CASB\
  \ 采用两种不同的方法运行：\n\n*   **内联 CASB 解决方案**在物理或逻辑上驻留在用户和服务之间的连接路径中。它们可以通过硬件设备或将请求路由通过\
  \ CASB 的端点代理来实现这一点。这种方法需要配置网络和/或端点设备。其优势在于可以在请求发送到云服务之前看到它们，从而允许 CASB 阻止违反策略的请求。\n\
  *   **基于 API 的 CASB 解决方案**不直接与用户交互，而是通过提供商的 API 直接与云提供商交互。这种方法提供了对云服务的直接访问，且不需要任何用户设备配置。然而，它也不允许\
  \ CASB 阻止违反策略的请求。基于 API 的 CASB 仅限于监控用户活动，并在事后报告或纠正策略违规。\n\n#### 资源策略\n\n云服务商提供**资源策略**，客户可用其限制其账户用户可执行的操作。实施资源策略是一种良好的安全实践，可限制意外命令、账户泄露或恶意内部人员造成的损害。\n\
  \n以下是一个以 JSON 编写的服务控制策略示例，用于限制对云资源的访问：\n\n\n\n\n\n```json\n{\n    \"Statement\"\
  : [\n        {\n            \"Sid\": \"DenyAllOutsideUSEastEUWest1\",\n        \
  \    \"Effect\": \"Deny\",\n            \"NotAction\": [\n                \"iam:*\"\
  ,\n                \"organizations:*\",\n                \"route53:*\",\n      \
  \          \"budgets:*\",\n                \"waf:*\",\n                \"cloudfront:*\"\
  ,\n                \"globalaccelerator:*\",\n                \"importexport:*\"\
  ,\n                \"support:*\"\n            ],\n            \"Resource\": \"*\"\
  ,\n            \"Condition\": {\n                \"StringNotEquals\": {\n      \
  \              \"aws:RequestedRegion\": [\n                        \"us-east-1\"\
  ,\n                        \"us-east-2\",\n                        \"eu-west-1\"\
  \n                    ]\n                }\n            }\n        },\n        {\n\
  \            \"Condition\": {\n                \"ForAnyValue:StringNotLike\": {\n\
  \                    \"ec2:InstanceType\": [\n                        \"*.micro\"\
  ,\n                        \"*.small\",\n                        \"*.nano\"\n  \
  \                  ]\n                }\n            },\n            \"Action\"\
  : [\n                \"ec2:RunInstances\",\n                \"ec2:ModifyInstanceAttribute\"\
  \n            ],\n            \"Resource\": \"arn:aws:ec2:*:*:instance/*\",\n  \
  \          \"Effect\": \"Deny\",\n            \"Sid\": \"DenyLargeInstances\"\n\
  \        }\n    ]\n}\n```\n\n此策略禁止受影响的用户使用美国东部和欧盟西部区域以外的任何资源，并禁止他们在任何区域使用某些服务（如身份和访问管理）。它还将用户限制为仅启动较小的服务器实例，以控制成本。\n\
  \n##### 密钥管理\n\n`硬件安全模块 (HSM)` 是专用计算设备，用于管理加密密钥，并以高效方式执行加密操作。HSM 的购买和运营成本昂贵，但如果配置得当，它们能提供极高级别的安全性。其核心优势之一是可以在不向任何人类暴露密钥的情况下创建和管理加密密钥，从而大幅降低密钥被泄露的可能性。\n\
  \n云服务提供商通常在内部使用 HSM 来管理其自身的加密密钥，并向客户提供 HSM 服务，作为一种安全的方法来管理客户密钥，而无需将其暴露给提供商。\n\n\
  ### 摘要\n\n云计算改变了网络安全格局。尽管网络安全专业人员仍必须实施控制措施以保护信息和系统的机密性、完整性和可用性，但他们现在是在一个需要云服务提供商配合的环境中进行的。在云安全共享责任模型下，云客户和提供商必须就谁负责满足每项安全控制要求达成共同理解。\n\
  \n采用云安全控制的组织可以选择实施其提供商提供的云原生安全控制、适用于多种环境的第三方控制，或两者的混合。他们可以实施云访问安全代理 (CASB)，从而在不同的云平台上一致地强制执行安全策略。\n\
  \n### 考试要点\n\n**解释三种主要的云服务模型。** 在万物即服务 (XaaS) 计算方法中，有三种主要的云服务模型。`基础设施即服务 (IaaS)`\
  \ 产品允许客户购买技术基础设施的基本构建模块并与之交互。`软件即服务 (SaaS)` 产品为客户提供对在云中运行的完全托管应用程序的访问。`平台即服务 (PaaS)`\
  \ 产品提供一个平台，客户可在其中运行自己开发的应用程序。\n\n**描述四种主要的云部署模型。** `公有云` 服务提供商部署基础设施，然后使其可供任何希望利用它的客户在多租户模型中使用。术语\
  \ `私有云` 用于描述为单个客户使用而配置的任何云基础设施。`社区云` 服务同时具有公有模型和私有模型的特征。社区云服务确实运行在多租户环境中，但租户仅限于特定设计社区的成员。`混合云`\
  \ 是一个统称，用于描述将公有、私有和/或社区云服务混合在一起的云部署。\n\n**理解云安全共享责任模型。** 在云安全共享责任模型下，云客户必须在一个或多个服务提供商和客户自己的网络安全团队之间划分责任。在\
  \ `IaaS` 环境中，云提供商承担最大的责任，为操作系统层以下的所有内容提供安全保障。在 `PaaS` 中，云提供商承担操作系统本身安全性的额外责任。在 `SaaS`\
  \ 中，云提供商负责整个环境的安全性，除了应用程序内访问控制的配置和存储在服务中的数据选择之外。\n\n**在云环境中实施适当的安全控制。** 云客户应了解如何使用提供商和第三方提供的控制措施来实现其安全目标。这包括维护资源策略，并设计弹性云实现，以跨多个区域实现高可用性。从存储角度来看，云客户应考虑权限、加密、复制和高可用性。从网络角度来看，云客户应考虑设计具有公共和私有子网的虚拟网络，以实现适当的分段。从计算角度来看，客户应设计安全组，以适当限制发往实例的网络流量，并维护这些实例的安全性。\n\
