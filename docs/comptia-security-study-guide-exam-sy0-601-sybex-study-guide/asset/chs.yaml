  \n---\n\n### 第 2 章：网络安全威胁态势\n\n在过去的三十年里，网络安全威胁变得日益复杂和多样化。曾经仅由孤独的爱好者活跃的环境，现在共同存在着技术娴熟的技术专家、有组织的犯罪集团，甚至政府资助的攻击者，他们都在寻求利用数字领域来实现各自的目标。寻求保护其组织资产的机密性、完整性和可用性的网络安全专业人员，必须对威胁环境有深刻的理解，以开发适当的防御机制。\n\
  \n在本章的第一部分中，您将了解现代网络安全威胁环境，包括主要威胁类型及其区别特征。在后续章节中，您将学习如何建立您自己组织的威胁情报能力，以便在威胁环境演变时保持最新状态。\n\
  \n### 探索网络安全威胁\n\n网络安全威胁行为体在其技能、能力、资源和动机方面存在显著差异。保护组织的信息和系统，需要对这些不同威胁的本质有扎实的理解，以便制定一套能全面防范其发生的安全控制措施。\n\
  \n#### 网络安全威胁分类\n\n在探讨具体的威胁行为体类型之前，让我们先看看区分网络安全威胁行为体类型的特征。了解我们的对手对于防御他们至关重要。\n\n\
  * **内部 vs. 外部** — 我们最常考虑的是存在于组织外部的威胁行为体：竞争对手、罪犯和好奇者。然而，一些最危险的威胁来自我们自己的内部环境。我们将在本章后面讨论内部威胁。\n\
  * **复杂性/能力水平** — 威胁行为体在其网络安全复杂性和能力水平上差异巨大。随着我们在本章中探讨不同类型的威胁行为体，我们将讨论它们如何从不成熟的 `script\
  \ kiddie`（脚本小子，仅运行从他人处借用的代码）发展到高级持续性威胁（`APT`）行为体（利用在其自有研究实验室中发现的、安全社区未知的漏洞）。\n*\
  \ **资源/资金** — 正如威胁行为体在复杂性上各异，其可用资源也各不相同。由犯罪集团或国家政府资助的高度组织化攻击者通常拥有几乎无限的资源，而组织松散的攻击者可能只是利用业余时间的爱好者。\n\
  * **意图/动机** — 攻击者的动机和意图也各不相同。`script kiddie`（脚本小子）可能只是为了攻击的快感，而竞争对手可能从事高度针对性的商业间谍活动。国家寻求实现政治目标；犯罪集团通常专注于直接的经济利益。\n\
  \n在本章的学习过程中，我们将探讨不同类型的威胁行为体。在此过程中，请花些时间回顾这些特征。此外，当您从媒体和其他来源听到当前网络安全攻击的新闻时，您可能希望参考这些特征。剖析这些故事并分析涉及的威胁行为体。如果攻击来自未知来源，请考虑与攻击者最可能相关的特征。这些可以是在网络安全调查期间的重要线索。例如，向受害者索要赎金的勒索软件攻击，更可能与寻求经济利益的犯罪集团有关，而非从事商业间谍活动的竞争对手。\n\
  \n#### 威胁行为体\n\n现在我们有了一组可用于讨论不同类型威胁行为体的属性，让我们来探讨安全专业人员在工作中遇到的最常见类型。\n\n##### 脚本小子\n\
  \n术语 `script kiddie`（脚本小子）是对使用黑客技术但技能有限的人的贬义称呼。此类攻击者通常几乎完全依赖从互联网下载的自动化工具。这些攻击者通常很少了解其攻击实际是如何工作的，他们只是在寻找方便的机会目标。\n\
  \n您可能会认为，凭借其相对较低的技能水平，`script kiddie`（脚本小子）并非真正的安全威胁。然而，事实并非如此，主要有两个重要原因。首先，简陋的黑客工具在互联网上免费提供。如果您对它们脆弱，任何人都可以轻松找到工具来自动化拒绝服务（`DoS`）攻击、创建病毒、制作特洛伊木马，甚至将勒索软件即服务分发出去。个人技术技能不再是攻击网络的障碍。\n\
  \n\n\n\n\n##### 脚本小子\n\n其次，脚本小子数量众多，且攻击目标不集中。虽然您的业务性质可能不会让您成为复杂的军方资助攻击的目标，但脚本小子在选择目标时则不加甄别。他们往往只是搜寻并发现脆弱的受害者，甚至不知道目标的身份。他们可能会在文件和系统中翻找，只有在攻击成功后才发现自己渗透了谁。\n\
  \n一般来说，脚本小子的动机围绕着试图证明自己的技术。换句话说，他们可能仅仅因为您的网络“就在那里”而发动攻击。中学和大学网络是脚本小子攻击的常见目标，因为许多此类攻击者是学龄人员。\n\
  \n幸运的是，脚本小子的数量往往被其缺乏技术和资源所抵消。这些人通常很年轻，独自作案，资源极少。这里的资源指时间和金钱。脚本小子通常无法全天候 24 小时攻击您的网络。他们通常还得上班、上学，并处理其他生活琐事。\n\
  \n##### 黑客活动家\n\n**黑客活动家** 利用黑客技术实现某种活动家目标。他们可能会篡改政策有分歧公司的网站。或者黑客活动家可能因某些政治问题攻击网络。黑客活动家的显著特征是，他们相信自己的动机是为了大义，即使其活动违反法律。\n\
  \n这种活动家动机意味着，能威慑其他攻击者的措施不太可能威慑黑客活动家。因为他们相信自己从事的是正义的十字军东征，在某些情况下，他们会冒着被抓获的风险来达成目标。他们甚至可能将被抓视为荣誉勋章和为事业献身的牺牲。\n\
  \n黑客活动家的技术水平参差不齐。有些只是脚本小子，而另一些则技术娴熟，多年来磨练技艺。事实上，一些网络安全研究人员认为，某些黑客活动家实际上受雇为网络安全专业人员作为“本职工作”，并在业余时间实施黑客活动攻击。高技能黑客活动家对其目标构成重大威胁。\n\
  \n黑客活动家的资源也各不相同。许多人独自行动，资源非常有限。然而，有些人属于有组织的行动。黑客组织 **Anonymous**（匿名者）使用 图 2.1 中所示的标志，是最知名的黑客活动家组织。他们集体决定议程和目标。多年来，Anonymous\
  \ 对各种各样的目标发动了网络攻击，包括山达基教会、PayPal、Visa 和 Mastercard、西浸信会，甚至政府机构。\n\n![图 2.1 黑客活动家组织\
  \ Anonymous 的标志](img/c02f001.png)\n\n**图 2.1** 黑客活动家组织 Anonymous 的标志\n\n这种匿名攻击者群体可能相当强大。大群体总比单独攻击者拥有更多时间和其他资源。由于其分布式和匿名的性质，很难识别、调查和起诉参与其黑客活动的人员。该组织缺乏层级结构，抓获一名成员不太可能泄露其他成员的身份。\n\
  \n黑客活动家倾向于作为外部攻击者，但在某些情况下，强烈反对公司政策的内部员工会从事黑客活动。在这些情况下，黑客活动家更可能通过泄露机密信息来攻击公司。政府雇员和自诩为举报人的人符合这种活动模式，他们寻求将自己认为不道德的政府行为引起公众关注。\n\
  \n例如，许多人认为爱德华·斯诺登是一名黑客活动家。2013 年，前美国国家安全局承包商斯诺登向记者分享了大量敏感政府文件。斯诺登的行为为美国及其盟友的数字情报收集能力提供了前所未有的洞察。\n\
  \n##### 犯罪集团\n\n只要有利可图，就会出现有组织犯罪，网络犯罪也不例外。网络犯罪分子的行列包括与美国传统有组织犯罪家族、非法帮派、俄罗斯黑手党有联系的分子，甚至包括专门为从事网络犯罪而组建的犯罪团伙。\n\
  \n这些群体的共同点是动机和意图。动机纯粹是非法获利。有组织犯罪集团通常不涉足政治议题或大义，也不试图展示技术。事实上，他们往往更倾向于隐匿于阴影中，尽量少引人注目。他们只是想尽可能多地产生非法利润。\n\
  \n在 2019 年《互联网有组织犯罪威胁评估报告》（IOCTA）中，欧盟执法合作署（EUROPOL）发现有组织犯罪集团活跃于多种网络犯罪类别，包括以下内容：\n\
  \n*   **依赖网络的犯罪**，包括勒索软件、数据泄露、分布式拒绝服务（DDoS）攻击、网站篡改和针对关键基础设施的攻击\n*   **儿童性剥削**，包括儿童色情制品、虐待和诱拐\n\
  *   **支付欺诈**，包括信用卡欺诈和商务电子邮件入侵\n*   **暗网** 活动，包括非法商品和服务的销售\n*   **恐怖主义** 支持，包括在线协助恐怖组织行动\n\
  *   **跨领域犯罪因素**，包括社会工程学、洗钱骡子和加密货币的犯罪性滥用\n\n有组织犯罪的攻击者技术水平从中等到高度熟练不等。脚本小子很少涉足这些犯罪，即使涉足，也往往很快被抓获。另一个决定性因素是，有组织犯罪集团往往拥有比黑客活动家或脚本小子更多的资源，无论是时间还是金钱。他们通常秉持“要赚钱得先花钱”的理念，愿意投资其犯罪企业，希望获得可观的投资回报。\n\
  \n##### 高级持续性威胁（APT）\n\n近年来，国家行为体黑入外国政府或企业的事件备受关注。安全公司 Mandiant 创造了 **高级持续性威胁（APT）**\
  \ 一词，用以描述一系列他们首次追溯至与中国军方有关联来源的攻击。随后几年，安全社区发现了与几乎所有技术先进国家政府有关联的类似组织。\n\nAPT 一词透露了攻击本身的大量信息。首先，它们使用先进技术，而非仅仅从互联网下载工具。其次，攻击是持续的，发生在相当长的一段时间内。在某些情况下，攻击持续数年，攻击者耐心跟踪目标，等待合适的时机发动打击。\n\
  \nMandiant 报告的 APT 攻击是 **国家资助攻击** 的典型代表。它们的特点往往是技术高超的攻击者拥有大量资源。一个国家拥有劳动力、时间和资金来资助持续、复杂的攻击。\n\
  \n动机可以是政治或经济的。在某些情况下，攻击是为了传统间谍目标：收集目标防御能力的情报。在其他情况下，攻击可能针对知识产权或其他经济资产。\n\n#####\
  \ 内部人员\n\n\n\n\n\n##### 内部攻击\n\n*内部攻击*是指员工、承包商、供应商或其他拥有信息和系统授权访问权限的个人，利用该访问权限对组织发起攻击。这些攻击通常旨在泄露机密信息，但内部人员也可能试图篡改信息或破坏业务流程。\n\
  \n内部人员的技术水平可能参差不齐。他们可能是脚本小子，也可能技术非常娴熟。内部人员发动攻击的动机也可能各不相同。有些人受特定活动目标驱使，而另一些人则是为了经济利益。还有一些人可能仅仅是因为错失晋升机会或以其他方式受到冷遇而心怀不满。\n\
  \n内部人员通常单独作案，且拥有有限的财力和时间。然而，他们的内部人员身份赋予了他们自动优势。他们已经拥有对您网络的一定访问权限和一定程度的知识。视内部人员的工作角色而定，他们可能拥有重大的访问权限和知识。\n\
  \n行为评估是识别内部攻击的有力工具。网络安全团队应与人力资源合作伙伴协作，识别表现出异常行为的内部人员，并在事态升级前进行干预。\n\n##### 竞争对手\n\
  \n竞争对手可能从事企业间谍活动，旨在窃取您组织的敏感信息并将其用于自身的商业优势。这可能包括窃取客户信息、窃取专有软件、识别机密产品开发计划，或获取任何其他有利于竞争对手的信息。\n\
  \n在某些情况下，竞争对手会利用心怀不满的内部人员从您的公司获取信息。他们还可能在*暗网*上寻找可供购买的内部信息，暗网是一个常从事非法活动的阴暗匿名网络。图\
  \ 2.2 展示了一个真实的暗网市场，正在出售企业信息。\n\n这些市场不在乎信息是如何获得的；他们唯一关心的是出售信息。在某些情况下，黑客入侵网络然后将信息卖给暗网市场。在其他情况下，内部人员在暗网上出售机密信息。事实上，一些暗网市场正在发布广告，表示希望从企业内部人员处购买机密数据。这为竞争对手在暗网上购买贵公司信息提供了现成的资源。\n\
  \n基于您的威胁模型和概况，您的组织可能需要考虑其他特定的威胁行为体，因此不应将此视为完整列表。您应定期开展组织威胁评估，以确定哪类威胁行为体最有可能以您的组织为目标，以及原因。\n\
  \n![图 2.2 暗网市场](img/c02f002.png)\n\n**图 2.2** 暗网市场\n\n#### 威胁载体\n\n以组织为目标的威胁行为体需要某种手段来获取该组织的信息或系统访问权限。*威胁载体*是威胁行为体用于获取该访问权限的手段。\n\
  \n##### 电子邮件和社交媒体\n\n电子邮件是最常被利用的威胁载体之一。网络钓鱼消息、垃圾邮件和其他基于电子邮件的攻击是获取组织网络访问权限的简单途径。这些攻击易于实施，可同时针对许多用户发起。对攻击者而言，其优势在于通常只需成功一次即可发起更广泛的攻击。即使\
  \ 99.9% 的用户无视网络钓鱼消息，攻击者也只需一名用户的登录凭证即可开始攻击。\n\n社交媒体可用作威胁载体，方式类似。攻击者可能直接在社交媒体上以用户为目标，或利用社交媒体收集用户信息，以便用于其他类型的攻击。我们将在第\
  \ 4 章“社会工程学、物理和密码攻击”中讨论这些攻击。\n\n##### 直接访问\n\n大胆的攻击者可能试图通过物理进入组织设施来直接访问组织网络。最常见的方式之一是进入设施的公共区域，如大堂、客户门店或其他易于进入的地点，坐下来用笔记本电脑工作，这些笔记本电脑隐蔽地连接到墙上未受保护的网络端口。\n\
  \n或者，获得设施物理访问权限的攻击者可能会找到未受保护的计算机终端、网络设备或其他系统。安全专业人员必须假设：能够物理接触组件的攻击者将能够攻陷该设备并将其用于恶意目的。\n\
  \n这凸显了物理安全的重要性，我们将在第 9 章“弹性与物理安全”中详细讨论。\n\n##### 无线网络\n\n无线网络为进入组织网络提供了更容易的途径。如果攻击者能坐在停车场访问组织的无线网络，他们就不需要获得对网络或您设施的物理访问权限。未受保护或保护不善的无线网络构成重大安全风险。\n\
  \n我们将在第 13 章“无线与移动安全”中讨论无线网络的安全性。\n\n##### 可移动介质\n\n攻击者也常使用可移动介质（如 USB 驱动器）传播恶意软件并发起攻击。攻击者可能会在停车场、机场或其他公共区域分发廉价\
  \ USB 记忆棒，希望有人会捡到设备并将其插入电脑，好奇地查看其中内容。一旦发生这种情况，设备就会触发恶意软件感染，悄无声息地攻陷发现者的计算机并将其置于攻击者的控制之下。\n\
  \n我们将在第 11 章“端点安全”中讨论端点设备的安全性，包括对可移动介质使用的控制。\n\n##### 云\n\n云服务也可用作攻击载体。攻击者例行扫描流行的云服务，寻找访问控制不当的文件、存在安全缺陷的系统，或意外发布的\
  \ API 密钥和密码。组织必须将其使用的云服务作为安全计划的重要组成部分。\n\n面向在云环境中运营的组织的漏洞与本地环境中发现的漏洞有相似之处，但控制措施往往不同。我们将在第\
  \ 10 章“云与虚拟化安全”中讨论安全的云运营。\n\n##### 第三方风险\n\n复杂的攻击者可能试图干扰组织的 IT 供应链，在制造商处或设备从制造商运往最终用户途中获取设备访问权限。在最终用户收到设备前对其进行篡改，允许攻击者植入后门，一旦客户将其安装在其网络上，即授予攻击者对设备的控制权。这种类型的第三方风险难以预测和应对。\n\
  \n供应链中也可能出现其他问题，特别是当供应商未能继续支持组织依赖的系统、未能提供所需的系统集成，或未能为外包代码开发或数据存储提供足够的安全保障时。强有力的供应商管理实践能在问题出现时迅速识别，并允许组织适当应对风险。\n\
  \n#### 威胁数据和情报\n\n\n\n\n\n### 威胁情报\n\n**威胁情报** 是网络安全专业人员为了解威胁环境变化而可利用的活动和资源集合。建立威胁情报计划是任何组织网络安全方法的关键部分。如果您不熟悉当前的威胁，就无法建立适当的防御来保护组织免受这些威胁的侵害。威胁情报信息还可用于**预测性分析**，以识别组织面临的潜在风险。\n\
  \n威胁情报来源多种多样，从您可以从公开来源收集的开源情报（OSINT），到提供专有或闭源情报信息的商业服务。越来越多的产品和服务具备消费威胁源数据的能力，使您能够在整个基础设施和系统中利用这些数据。\n\
  \n无论其来源如何，威胁源旨在以组织可利用的方式提供最新的威胁详情。威胁源通常包含关于威胁的技术细节，例如 IP 地址、主机名和域名、电子邮件地址、URL、文件哈希值、文件路径、CVE\
  \ 编号以及其他威胁详情。通常还会包含其他信息，以帮助使信息更具相关性和可理解性，包括可能使您的组织成为目标或易受威胁的详细信息、威胁行为者的描述，甚至包括他们的动机和方法论的细节。\n\
  \n**漏洞数据库** 也是组织威胁情报计划的重要组成部分。漏洞报告当然有助于指导组织的防御工作，但它们也为研究人员发现的漏洞利用类型提供了宝贵的见解。\n\n\
  威胁情报来源还可能提供**妥协指标**。这些是攻击已发生的明显迹象，可能包括文件签名、日志模式以及攻击者留下的其他证据。IoC 也可能在提供威胁情报信息的**文件和代码仓库**中找到。\n\
  \n#### 开源情报\n\n**开源威胁情报** 是从公开可用来源获取的威胁情报。许多组织已经认识到开放共享威胁信息的实用性，开源威胁情报已变得广泛可用。事实上，现在的挑战往往在于决定使用哪些威胁情报来源，确保它们可靠且最新，并善加利用。\n\
  \n许多网站维护着广泛的开源威胁信息来源列表：\n\n*   `Senki.org` 提供了一个列表：`www.senki.org/operators-security-toolkit/open-source-threat-intelligence-feeds`\n\
  *   AT&T 运营的开放威胁交换平台是全球安全专业人员和威胁研究人员社区的一部分：`https://cybersecurity.att.com/open-threat-exchange`\n\
  *   MISP 威胁共享项目，`www.misp-project.org/feeds`，提供来自多个来源的标准化威胁源，并拥有社区驱动的收集集。\n*   Threatfeeds.io\
  \ 托管了一个开源威胁情报源列表，包含添加和修改时间、维护者及其他有用信息的详情：`threatfeeds.io`\n\n除了开源和社区威胁数据来源外，还有许多政府和公共威胁情报数据来源。例如，图\
  \ 2.3 显示了来自网络安全和基础设施安全局（CISA）网站的最近警报列表。\n\n![图 2.3 CISA 网站的最近警报列表](img/c02f003.png)\n\
  \n**图 2.3** CISA 网站的最近警报列表\n\n**政府网站：**\n\n*   美国网络安全和基础设施安全局（CISA）网站：`www.us-cert.gov`\n\
  *   美国国防部网络犯罪中心网站：`www.dc3.mil`\n*   CISA 的自动指标共享（AIS）计划，`www.dhs.gov/cisa/automated-indicator-sharing-ais`，以及其信息共享和分析组织计划，`www.dhs.gov/cisa/information-sharing-and-analysis-organizations-isaos`\n\
  \n**供应商网站：**\n\n*   微软威胁情报博客：`www.microsoft.com/security/blog/tag/threat-intelligence`\n\
  *   思科威胁安全网站（`tools.cisco.com/security/center/home.x`）包含专家博客，提供威胁研究信息，以及思科 Talos\
  \ 信誉查找工具，`talosintelligence.com`\n\n**公共来源：**\n\n*   SANS 互联网风暴中心：`isc.sans.org`\n\
  *   VirusShare 包含上传到 VirusTotal 的恶意软件详情：`virusshare.com`\n*   Spamhaus 专注于封锁列表，包括通过\
  \ Spamhaus 封锁列表（SBL）传播的垃圾邮件、Exploits 封锁列表（XBL）上的被劫持和受感染计算机、策略封锁列表（PBL）、不路由或不对等列表（DROP）列出您可能不希望允许流量来源的网段，以及各种其他信息：`www.spamhaus.org`\n\
  \n这些只是安全从业者可用的开源情报资源的一小部分，但它们能让您对可用资源有个很好的了解。\n\n#### 专有和闭源情报\n\n商业安全供应商、政府组织和其他以安全为中心的组织也会创建和使用专有或**闭源情报**。它们进行自己的信息收集和研究，并可能使用自定义工具、分析模型或其他专有方法来收集、策划和维护其威胁源。\n\
  \n使用专有威胁情报有多种原因。组织可能希望保持其威胁数据的机密性，可能希望出售或授权该数据，且其方法和来源属于商业机密，或者他们可能不愿冒险让威胁行为者知晓他们正在收集的数据。\n\
  \n商业闭源情报通常作为服务产品的一部分，这对安全专业人员来说可能是一个极具吸引力的资源。通过开源威胁情报源获得的海量数据可能会让许多组织应接不暇。梳理威胁源以识别相关威胁，然后确保它们定义明确且适合您的组织适当应用，可能需要付出巨大的努力。在许多情况下，验证威胁数据可能很困难，一旦您完成了确保拥有高质量威胁数据的工作，您仍然必须对其采取行动！\n\
  \n**威胁地图** 提供威胁情报的地理视图。许多安全供应商提供高层级地图，可实时洞察网络安全威胁态势。例如，FireEye 在 `www.fireeye.com/cyber-map/threat-map.html`\
  \ 提供了图 2.4 所示的公共威胁地图。\n\n组织也可能使用威胁地图信息，深入了解直接针对其网络的攻击来源。然而，威胁地图信息应始终持保留态度，因为地理归因以极其不可靠而著称。攻击者通常通过云服务和其他受感染网络中转攻击，向威胁分析工具隐藏其真实地理位置。\n\
  \n![图 2.4 FireEye 网络安全威胁地图](img/c02f004.png)\n\n**图 2.4** FireEye 网络安全威胁地图\n\n####\
  \ 评估威胁情报\n\n无论您的威胁情报信息来源如何，您都需要对其进行评估。当您评估威胁情报来源或特定威胁情报通知时，有许多常见因素会发挥作用。\n\n1. \
  \ 它及时吗？运行在延迟上的源可能导致您错过威胁，或在威胁不再相关后才做出反应。\n\n\n\n\n\n#### 评估威胁情报\n\n##### 信息准确性\n\
  信息是否准确？你能否依赖其内容，评估有多大可能是有效的？它是依赖单一来源还是多个来源？这些来源的正确频率如何？\n\n##### 信息相关性\n信息是否相关？如果它描述了错误的平台、软件或组织成为目标的原因，那么该数据可能非常及时、非常准确，但与你的组织完全无关。\n\
  \n##### 置信度评分\n总结威胁情报评估数据的一种方法是通过置信度评分。置信度评分允许组织根据他们能给予多少信任来筛选和使用威胁情报。这并不意味着较低置信度的信息没有用处；事实上，许多威胁情报最初都是从较低的置信度评分开始的，随着信息的巩固以及额外信息来源的确认或全面分析，该评分会逐渐提高。低置信度的威胁信息不应被完全忽视，但也不应在不考虑其低置信度评分的情况下，依赖它做出重要决策。\n\
  \n#### 威胁指标管理与交换\n\n在任何规模下管理威胁信息都需要标准化和工具支持，以便以自动化方式处理和使用威胁信息。有了明确定义的术语集，指标管理会容易得多。这正是结构化标记语言（如\
  \ `STIX` 和 `OpenIOC`）发挥作用的地方。\n\n##### STIX\n*Structured Threat Information eXpression\
  \ (STIX)* 是一种最初由美国国土安全部赞助的 XML 语言。在其当前版本中，`STIX 2.0` 定义了 12 个 STIX 领域对象，包括攻击模式、身份、恶意软件、威胁行为者和工具等。这些对象随后通过两种\
  \ STIX 关系对象模型之一相互关联：要么作为关系，要么作为目击。\n\n一个 `STIX 2.0` JSON 格式的威胁行为者描述示例如下：\n\n```json\n\
  {\n \"type\": \"threat-actor\",\n \"created\": \"2019-10-20T19:17:05.000Z\",\n \"\
  modified\": \"2019-10-21T12:22:20.000Z\",\n \"labels\": [ \"crime-syndicate\"],\n\
  \ \"name\": \"Evil Maid, Inc\",\n \"description\": \"Threat actors with access to\
  \ hotel rooms\",\n \"aliases\": [\"Local USB threats\"],\n \"goals\": [\"Gain physical\
  \ access to devices\", \"Acquire data\"],\n \"sophistication\": \"intermediate\"\
  ,\n \"resource:level\": \"government\",\n \"primary_motivation\": \"organizational-gain\"\
  \n}\n```\n\n像 `sophistication` 和 `resource level` 这样的字段使用定义好的词汇选项，以允许 `STIX 2.0`\
  \ 用户在自动化和手动系统中一致地使用数据。\n\n自创建以来，`STIX` 已移交给结构化信息标准促进组织（`OASIS`），这是一个国际非营利联盟，维护着许多与信息格式化相关的其他项目，包括\
  \ `XML` 和 `HTML`。\n\n##### TAXII\n`STIX` 的伴侣协议是 *Trusted Automated eXchange of Indicator\
  \ Information (TAXII)*。`TAXII` 旨在允许通过 `HTTPS` 在应用层传输网络威胁信息。`TAXII` 专门设计用于支持 `STIX`\
  \ 数据交换。你可以在 `OASIS` 的 GitHub 文档站点 `oasis-open.github.io/cti-documentation` 上详细了解\
  \ `STIX` 和 `TAXII`。\n\n##### OpenIOC\n另一种选择是 *Open Indicators of Compromise (OpenIOC)*\
  \ 格式。与 `STIX` 一样，`OpenIOC` 是一个基于 XML 的框架。`OpenIOC` 模式由 `Mandiant` 开发，并使用 `Mandiant`\
  \ 的指标作为其基础框架。典型的 IOC 包含作者、IOC 名称和指标描述等元数据。IOC 的完整定义还可能包括导致指标发现的实际妥协细节。\n\n#### 公共和私人信息共享中心\n\
  \n除了威胁情报供应商和资源外，还建立了威胁情报社区来共享威胁信息。在美国，被称为信息共享与分析中心（`ISACs`）的组织帮助基础设施所有者和运营商共享威胁信息，并为其成员提供工具和协助。`ISAC`\
  \ 国家委员会在 `www.nationalisacs.org/member-isacs` 列出了基于行业的 `ISACs`。\n\n`ISAC` 概念于 1998\
  \ 年作为总统决策指令 63（`PDD-63`）的一部分引入，该指令要求关键基础设施部门建立组织以共享威胁和漏洞信息。`ISACs` 基于信任模型运行，允许针对物理和网络威胁进行深度威胁信息共享。大多数\
  \ `ISACs` 全天候运行，为其行业内的 `ISAC` 成员提供事件响应和威胁分析。\n\n除了 `ISACs` 外，每个关键基础设施领域还有特定的美国机构或部门合作伙伴。按行业细分的列表可在\
  \ `www.dhs.gov/cisa/critical-infrastructure-sectors` 找到。\n\n在美国以外，许多国家都存在具有类似职责的政府机构和部门。英国国家基础设施保护中心（`www.cpni.gov.uk`）负责向工业界、学术界以及政府和执法部门的其他部分提供威胁信息、资源和指导。\n\
  \n#### 开展自主研究\n\n作为安全专业人员，你应该继续对新兴网络安全威胁进行自主研究。以下是在构建威胁研究工具包时可能咨询的来源：\n\n*   供应商安全信息网站\n\
  *   来自供应商、政府机构和私人组织的漏洞和威胁情报源\n*   学术期刊和技术出版物，如互联网 RFC 文档。`RFC` 文档特别有用，因为它们包含互联网协议的详细技术规范。\n\
  *   专业会议和当地行业团体会议\n*   知名安全专业人士的社交媒体账号\n\n在参考这些来源时，请特别留意关于对手 *战术、技术和程序（TTPs）* 的信息。更多地了解攻击者的运作方式，有助于你改进自己的威胁情报计划。\n\
  \n### 总结\n\n网络安全专业人员必须对威胁形势有深入的理解，以便评估其组织面临的风险以及缓解这些风险所需的控制措施。网络安全威胁可根据其内部或外部状态、复杂程度和能力、资源和资金、意图和动机进行分类。\n\
  \n威胁行为者形式多样，从寻求成功入侵快感的相对不成熟的“脚本小子”，到将网络攻击作为军事武器以获取政治优势的先进国家行为者。黑客活动家、犯罪集团、竞争对手和其他威胁行为者可能出于不同原因针对同一组织。\n\
  \n网络攻击通过多种威胁向量发起。最常见的向量包括电子邮件和社交媒体；其他攻击可能通过直接物理访问、供应链漏洞利用、基于网络的攻击和其他向量发起。组织应建立强大的威胁情报计划，以帮助其掌握新兴威胁，并调整控制措施以适应不断变化的环境。\n\
  \n### 考试要点\n\n**威胁行为者在几个关键属性上存在差异。** 我们可以使用四个主要标准对威胁行为者进行分类。首先，威胁行为者可能是组织内部的，也可能来自外部来源。其次，威胁行为者在复杂程度和能力上有所不同。第三，它们在可用资源和资金上有所不同。最后，不同的威胁行为者具有不同的动机和意图程度。\n\
  \n\n\n\n\n### 威胁行为者与攻击向量\n\n#### 威胁行为者来源多样\n\n威胁行为者的技术手段可能非常简单，例如利用他人编写的漏洞利用代码的“脚本小子”；也可能相当复杂，例如国家支持的行为者和犯罪集团构成的高级持续性威胁（APT）。黑客活动家可能旨在推行政治议程，而竞争对手可能寻求经济利益。我们可以根据黑客的动机和授权情况，将其分为白帽、灰帽和黑帽三类。\n\
  \n#### 攻击者利用不同向量获取初始访问权限\n\n攻击者可能试图通过互联网远程获取对组织的初始访问权限，通过无线连接访问，或尝试直接物理访问。他们也可能通过电子邮件或社交媒体接触员工。攻击者可能试图利用可移动媒介诱骗员工无意中危害其网络，或者试图通过云服务传播漏洞利用代码。复杂的攻击者可能试图干扰组织的供应链。\n\
  \n#### 威胁情报提供有价值的洞见\n\n安全团队可利用来自公开和私有来源的威胁情报，了解当前的威胁和漏洞。他们可能会寻找详细的妥协指标，并对自己的数据执行预测性分析。威胁情报团队通常会用自己的研究来补充从外部获取的开源情报和闭源情报。\n\
  \n#### 安全团队必须监控供应链风险\n\n现代企业依赖硬件、软件和云服务供应商向内部和外部客户提供 IT 服务。供应商管理技术可保护供应链，防止攻击者破坏这些通往组织网络的外部环节。安全专业人员应特别关注外包代码开发、云数据存储以及外部与内部系统集成所带来的风险。\n\
  \n### 复习题\n\n1. 以下哪项措施不常用于评估威胁情报？\n   1. 时效性\n   2. 详细程度\n   3. 准确性\n   4. 相关性\n\
  \n2. `STIX` 基于哪种语言？\n   1. `PHP`\n   2. `HTML`\n   3. `XML`\n   4. `Python`\n\n\
  3. Kolin 是一名为网络安全公司工作的渗透测试人员。他的公司受雇对一个医疗系统进行渗透测试，Kolin 正致力于获取该系统中某家医院系统的访问权限。以下哪个术语最能描述\
  \ Kolin 的工作？\n   1. 白帽\n   2. 灰帽\n   3. 绿帽\n   4. 黑帽\n\n4. 以下哪类攻击者最可能与 `APT` 相关联？\n\
