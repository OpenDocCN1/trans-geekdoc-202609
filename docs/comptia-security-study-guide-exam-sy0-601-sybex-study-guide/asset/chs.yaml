  \  控制风险\n     3.  风险偏好\n     4.  剩余风险\n\nWileyPRE\n\n\n\n\n\n## 复习题答案\n\n### 第 1\
  \ 章：当今的安全专业人员\n\n1.  **D.** 管理控制是侧重于风险管理过程机制的程序性机制。威胁评估就是这些活动的一个示例。\n\n2.  **B.**\
  \ 信用卡信息泄露可能给组织带来许多不同的影响，包括合规、运营和财务风险。然而，在该场景中，Jade 的主要顾虑是违反 PCI DSS，这使得他的顾虑属于合规风险。\n\
  \n3.  **C.** 网站篡改在未经授权的情况下更改了内容，因此违反了完整性目标。攻击者可能还侵犯了网站的机密性或可用性，但该场景未提供足够信息来得出这些结论。\n\
  \n4.  **B.** 在此例中，信用卡的前 12 位数字已被移除并替换为星号。这是数据掩码的一个示例。\n\n5.  **D.** 威慑控制旨在首先阻止攻击者尝试违反安全策略。预防性控制将尝试阻止即将发生的攻击。纠正性控制将补救攻击期间出现的问题。\n\
  \n6.  **D.** 在此例中，Greg 必须使用基于网络的 DLP 系统。基于主机的 DLP 需要使用代理程序，而客户系统上不会安装代理程序。Greg 可以使用水印和/或模式识别来识别敏感信息，但他必须使用基于网络的\
  \ DLP 才能达到目标。\n\n7.  **B.** 通过网络发送的数据是动态数据。静态数据是驻留在硬盘、磁带、云中或其他存储介质上的存储数据。处理中的数据，或使用中的数据，是计算机系统正在主动使用的数据。\n\
  \n8.  **A.** 技术控制在数字空间中强制执行机密性、完整性和可用性。技术安全控制的示例包括防火墙规则、访问控制列表、入侵防御系统和加密。\n\n9.\
  \  **D.** 网络安全攻击者的三个主要目标是泄露、篡改和拒绝服务。这些直接对应网络安全专业人员的三个目标：机密性、完整性和可用性。\n\n10. **A.**\
  \ Tony 正在考虑的风险可能符合这些类别中的任何一个。然而，他主要担心的是如果风险成为现实，公司可能无法继续开展业务。这是战略风险。\n\n11. **C.**\
  \ 虽然常旅客账号或任何其他账号都有可能被用于身份盗窃，但身份窃贼更有可能使用核心身份证件。这些包括驾驶执照、护照和社会安全号码。\n\n12. **A.**\
  \ 随着组织分析其风险环境，技术和业务领导者确定为保护其信息和系统的机密性、完整性和可用性所需的保护级别。他们通过编写组织希望实现的控制目标来表达这些要求。这些控制目标是期望安全状态的陈述。\n\
  \n13. **A.** 这个问题有点棘手。使用真正的看门狗可以被视为威慑、物理或检测控制。在某些情况下，它甚至可以是补偿控制。然而，问题询问的是 `sign`（标志/告示牌）的存在，并未说明使用了真狗。该标志仅作为威慑控制具有价值。面对此类考试题目时，请仔细阅读题目细节。\n\
  \n14. **D.** 加密技术使用数学算法保护信息免受窥探，无论是在网络传输过程中还是驻留在系统上时。对于没有相应解密密钥访问权限的任何人来说，加密数据都是不可理解的，这使得通过其他不安全的方式存储和传输加密数据变得安全。\n\
  \n15. **D.** 使用全盘加密旨在防止设备丢失或被盗时发生安全事件。因此，这是一个预防性控制缺口。\n\n16. **A.** 虽然医疗服务提供者可能受这些法规中的任何一项影响，但《健康保险流通与责任法案》(HIPAA)\
  \ 为受保护健康信息的安全和隐私提供了直接法规，并将对医疗服务提供者产生最直接的影响。\n\n17. **C.** 向未经授权的个人泄露敏感信息违反了机密性原则。\n\
  \n18. **B.** 网络安全专业人员的三个主要目标是机密性、完整性和可用性。\n\n19. **A.** 令牌化技术使用查找表，设计为可逆。如果正确实施，掩码和哈希技术用无法还原为原始数据的值替换数据。粉碎处理如果得当，会物理销毁数据，使其无法恢复。\n\
  \n20. **A.** PCI DSS 补偿控制必须“超出”其他 PCI DSS 要求。这明确禁止将用于满足一项要求的控制作为另一项要求的补偿控制。\n\n\
  ### 第 2 章：网络安全威胁态势\n\n1.  **B.** 虽然更高层级的细节可能有用，但它们不是评估威胁情报的常用指标。相反，信息的及时性、准确性和相关性被认为对于决定是否应使用威胁信息至关重要。\n\
  \n2.  **C.** STIX 是一种基于 XML 的语言，使其能够轻松扩展和修改，同时也能使用标准的基于 XML 的编辑器、阅读器和其他工具。\n\n3.\
  \  **A.** 作为授权渗透测试一部分进行的攻击属于白帽黑客攻击，无论是由内部员工还是外部公司执行。因此，Kolin 从事的是白帽黑客活动。如果他未经授权自行行动，其身份将取决于其意图。如果他有恶意意图，其活动将被视为黑帽黑客攻击。如果他只是打算向医院报告漏洞，其攻击将被视为灰帽。绿帽不是常用的攻击者类别。\n\
  \n4.  **A.** 高级持续性威胁 (APT) 最常与国家行为体相关联。APT 组织不太可能利用脚本小子的非复杂服务。黑客活动家也不太可能获得 APT 资源。虽然\
  \ APT 可能利用内部人员访问权限，但它们最常与国家行为体相关联。\n\n5.  **D.** 美国政府创建了信息共享与分析中心 (ISAC)。ISAC 帮助基础设施所有者和运营商共享威胁信息，并为其成员提供工具和协助。\n\
  \n6.  **A.** 国家行为体由政府资助，通常拥有最大的资源获取权，包括工具、资金和人才。\n\n7.  **A.** 电子邮件是攻击者利用网络钓鱼和其他社会工程学战术获取组织访问权限时最常利用的威胁载体。此处列出的其他载体（直接访问、无线、可移动介质）都需要物理上接近组织，不易从远程位置执行。\n\
  \n8.  **D.** 中国军队和美国政府是国家行为体和高级持续性威胁 (APT) 的示例。俄罗斯黑手党是犯罪集团的示例。Anonymous 是世界上最著名的黑客活动家组织。\n\
  \n9.  **A.** 行为评估在尝试识别内部威胁时非常有用。由于内部威胁往往难以与正常行为区分，因此动作执行的上下文（如下班后登录、凭证滥用、从异常位置登录或异常模式）和其他行为指标常被使用。\n\
  \n\n\n\n#### 10. D. TAXII（可信自动化指示信息交换）协议专门设计用于在应用层通信网络威胁信息。OpenIOC 是一种妥协指示框架，而 STIX\
