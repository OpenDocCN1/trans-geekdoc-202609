  \ 的大小\n\n5.  Chuck 想要为他的组织提供路由安全，并想要保护其路由器依赖的 BGP 流量以获取路由信息。Chuck 应该怎么做？\n    1.\
  \  选择启用了 TLS 的 BGP 版本\n    2.  开启 BGP 路由保护\n    3.  通过为每个 BGP 对等体采用证书来使用签名 BGP\n\
  \    4.  以上都不是\n\n6.  Connor 认为他组织的网络与远程 Web 服务器之间存在问题，他想通过检查路径上的每一跳来验证这一点。如果他从\
  \ Windows 10 系统进行测试，应该使用哪个工具？\n    1.  `tracert`\n    2.  `route`\n    3.  `traceroute`\n\
  \    4.  `pathping`\n\n7.  Nick 想要显示 Windows 系统的 ARP 缓存。他应该运行什么命令来显示缓存？\n    1.\
  \  `arp /a`\n    2.  `arp -d`\n    3.  `showarp`\n    4.  `arpcache -show`\n\n8.\
  \  Bart 需要评估 Linux 服务器和 Windows 工作站之间是否正在发生三次 TCP 握手。他认为工作站正在发送 SYN，但不确定接下来发生了什么。如果他想监控流量，并且知道\
  \ Linux 系统不提供 GUI，他应该使用什么工具来查看该流量？\n    1.  `dd`\n    2.  `tcpreplay`\n    3.  `tcpdump`\n\
  \    4.  Wireshark\n\n9.  哪种协议用于安全地封装许多其他原本不安全的协议？\n    1.  ISAKMP\n    2.  SSL\n\
  \    3.  IKE\n    4.  TLS\n\n10. Bonita 发现她的组织正在 TCP 端口 636 上运行一项服务。最可能使用的是哪种安全协议？\n\
  \    1.  LDAPS\n    2.  IMAPS\n    3.  SRTP\n    4.  SNMPv3\n\n11. Randy 想要防止网络上的\
  \ DHCP 攻击。他应该实施哪种安全协议以产生最大影响？\n    1.  ARPS\n    2.  LDAPS\n    3.  SDHCP\n    4.\
  \  以上都不是\n\n12. Gary 想要为最终用户使用安全协议进行电子邮件访问。他应该实施以下哪组协议来完成此任务？\n    1.  DKIM、DMARC、HTTPS\n\
  \    2.  SPF、POPS、IMAPS\n    3.  POPS、IMAPS、HTTPS\n    4.  DMARC、DKIM、SPF\n\n13.\
  \ 关于 IPv6 安全影响的以下陈述中，哪一项**不正确**？\n    1.  基于静态 IP 地址的规则可能不再生效。\n    2.  IPv6 信誉服务可能尚不成熟和实用。\n\
  \    3.  IPv6 的 NAT 实现是不安全的。\n    4.  IPv6 流量可能绕过现有的安全控制。\n\n14. Madhuri 正在为她的公司设计负载均衡配置，并希望防止单个节点过载。哪种设计类型能满足这一需求？\n\
  \    1.  菊花链\n    2.  主动/主动\n    3.  Duck-duck-goose（鸭子鸭子鹅）\n    4.  主动/被动\n\n\n\
  \n\n\n## 练习题\n\n### 15. 什么类型的 NAC 能为 Isaac 提供关于连接系统的最大信息量，同时给予他对系统及其对网络中其他连接系统潜在影响的最大控制权？\n\
  \n1.  基于代理的准入前 NAC\n2.  无代理的准入后 NAC\n3.  基于代理的 NAC，准入后 NAC\n4.  基于代理的准入后 NAC\n\n\
  ### 16. Danielle 想要捕获网络流量以分析 VoIP 通话。以下哪种工具能让她最有效地回顾通话内容？\n\n1.  网络 SIPper\n2. \
  \ `tcpdump`\n3.  Wireshark\n4.  `netcat`\n\n### 17. Wayne 担心他负责的计算机遭受了中间人攻击。他最有可能发现与该攻击相关的什么工件？\n\
  \n1.  被攻陷的路由器\n2.  浏览器插件\n3.  被攻陷的服务器\n4.  被修改的 hosts 文件\n\n### 18. Elle 正在实施 VoIP\
  \ 电话系统并希望使用安全协议。如果她已经实施了 SIPS，她最有可能还会使用哪种协议？\n\n1.  SRTP\n2.  UDP/S\n3.  S/MIME\n\
  4.  SFTP\n\n### 19. 使用什么技术来确保受 DNSSEC 保护的 DNS 信息是可信的？\n\n1.  它经过数字签名。\n2.  它通过 TLS\
  \ 发送。\n3.  它使用 AES256 加密。\n4.  它通过 IPSec VPN 发送。\n\n### 20. Fred 希望确保交换机和路由器的管理接口受到保护，使攻击者无法访问。作为其组织网络设计的一部分，他应该推荐以下哪种解决方案？\n\
  \n1.  NAC\n2.  Trunking\n3.  带外管理\n4.  端口安全\n\n---\n\n## 第 13 章 无线与移动安全\n\n大多数组织网络的重要部分现在都是无线的，与有线网络相比，无线网络面临许多安全挑战。它们广播信号，且经常可以从组织拥有和管理的空间之外访问。蜂窝网络和点对点商用无线网络甚至完全不在客户的控制范围内，这意味着它们承载的流量可能需要被视为正在遍历潜在的敌对网络路径。\n\
  \n在本章中，您将了解常见的无线连接选项——从蓝牙和蜂窝到 Wi-Fi——以及它们最常使用的网络模型。随后您将深入了解无线攻击。考虑到这一点，您将探索无线网络设计和安全的最佳实践。在此过程中，您还将了解无线认证、多种形式的\
  \ EAP，以及如何保护无线控制器和接入点的安全。\n\n本章的后半部分侧重于移动设备管理。移动设备部署模型（如自带设备 [BYOD] 和企业自有、个人启用 [COPE]）是组织关于如何将设备交到最终用户手中的决策的关键部分。一旦部署了这些设备，您还需要对其进行管理，您将了解移动设备管理工具、常见功能和重要的控制能力。通过周密的规划，您可以确保设备在发放或注册时是安全的，在其整个生命周期中得到良好管理，并能处理盗窃、丢失或使用寿命结束的情况。\n\
  \n### 构建安全的无线网络\n\n无线网络遍布我们的组织。从使用强大工具对用户进行认证、管理和监控的企业网络，到家庭和小型企业中用于为住户、客户或访客提供连接的简单无线路由器，Wi-Fi\
  \ 无处不在。然而，Wi-Fi 网络并非您将遇到的唯一网络类型——蓝牙、蜂窝、Zigbee 和其他类型的连接也存在于组织中。与有线网络不同，这些无线网络不会在组织的墙壁之外停止，这使得无线网络安全成为一个截然不同的挑战。许多设备都有能力创建自组网，或桥接其有线和无线网络连接，这意味着组织中的设备最终也可能成为恶意行为者通往网络或设备本身的路径。\n\
  \n#### 连接方式\n\n设计安全网络通常始于对您将要部署或保护的网络连接类型的基本了解。Security+ 考试大纲列出了一系列无线连接类型，将在以下各节中介绍。\n\
  \n##### 蜂窝网络\n\n*蜂窝*网络通过将地理区域划分为“小区”，利用塔的覆盖实现设备与塔或基站之间的无线通信，为手机等移动设备提供连接。现代蜂窝网络使用\
  \ LTE（长期演进）4G 及相关技术，以及正在全球稳步部署的新型 5G 网络。5G 需要更高的天线密度，但也提供更大的带宽和吞吐量。蜂窝服务提供商和需要蜂窝连接的组织过去倾向于在\
  \ 4G 网络需要覆盖的地方放置塔，而 5G 网络将需要更多地关注天线部署，这意味着组织未来可能需要将 5G 天线布局作为建筑和设施设计工作的一部分。\n\n\
  蜂窝连接通常由蜂窝运营商提供，而非组织自身，这与 Wi-Fi 或其他公司可能选择自行实施的技术不同。这意味着蜂窝网络在组织外部是安全的、受管理的和受控的，通过蜂窝连接发送的流量会经过第三方网络。因此，蜂窝数据需要像对待外部网络连接一样对待，而不是自己的企业网络。\n\
  \n##### Wi-Fi\n\n*Wi-Fi* 一词涵盖了一系列用于提供无线联网的无线协议。Wi-Fi 主要依赖 2.4 GHz 和 5 GHz 无线电频段，并在这些频段内使用多个信道以允许多个网络共存。Wi-Fi\
  \ 信号可以达到相当长的距离，尽管 Wi-Fi 运行的频率会被墙壁和树木等常见障碍物阻挡或削弱。尽管存在这些阻碍，Wi-Fi 网络最重要的安全顾虑之一是它们会超出组织拥有或控制的空间。\n\
  \n表 13.1 列出了当前和历史上的 Wi-Fi 标准，范围从首个广泛部署的 Wi-Fi 标准 802.11b，到目前部署最广泛的标准 802.11ac。802.11ax（即\
  \ Wi-Fi 6）正稳步普及，但组织可能仍会广泛部署现有的 802.11ac 设备，直到将其作为正常升级的一部分进行替换。在许多环境中，仍可能遇到 802.11n、802.11g\
  \ 甚至更旧的标准。\n\n**表 13.1 Wi-Fi 标准、最大理论速率和频率**\n\n| Wi-Fi 标准 | 最大速率 | 频率 |\n| :---\
  \ | :--- | :--- |\n| 802.11b | 11 Mbit/s | 2.4 GHz |\n| 802.11a | 64 Mbit/s | 5\
  \ GHz |\n| 802.11g | 54 Mbit/s | 2.4 GHz |\n| 802.11n | 600 Mbit/s | 2.4 GHz 和 5\
  \ GHz |\n| 802.11ac | 6933 Mbit/s | 5 GHz |\n| 802.11ax | 9608 Mbit/s | 2.4 GHz\
  \ 和 5 GHz<br>6 GHz 频段的额外频率范围 |\n\n幸运的是，WPA2 和 WPA3 等 Wi-Fi 协议提供了安全特性和功能，有助于保护无线信号安全。这些功能包括加密选项、网络帧保护和认证选项。\n\
  \n\n\n\n\n##### Wi-Fi\n\nWi-Fi 设备最常部署在自组网模式或基础设施模式下。自组网模式允许设备直接相互通信，而基础设施模式则通过基站或接入点发送流量。Wi-Fi\
  \ 网络使用服务集标识符（`SSIDs`）来标识其网络名称。`SSIDs` 可以广播，也可以设为私有。\n\n##### Bluetooth\n\n**蓝牙**是一种短距离无线标准。与\
  \ Wi-Fi 和许多其他技术一样，它在 2.4 GHz 频段运行，该频段被许多不同的无线协议使用。蓝牙主要用于低功耗、短距离（小于 100 米，通常为 5–30\
  \ 米）的连接，这些连接没有很高的带宽需求。蓝牙设备通常采用点对点模式而非客户端-服务器模式进行连接。\n\n由于蓝牙的设计和实现旨在易于发现、配置和使用，因此它也相对容易受到攻击。蓝牙确实支持加密，但加密依赖于双方设备使用的\
  \ PIN 码。耳机等设备的固定 PIN 码会降低其连接的安全性。针对认证以及协商加密密钥的攻击意味着蓝牙可能容易受到窃听以及其他攻击。\n\n##### NFC\n\
  \n**近场通信（NFC）**用于设备之间极短距离的通信。您可能见过 NFC 用于支持 Apple Pay 或 Google Wallet 的支付终端，通过手机进行支付。NFC\
  \ 的范围限制在约 4 英寸左右，这意味着它不用于构建设备网络，而是主要用于低带宽、设备对设备的用途。这并不意味着 NFC 不会受到攻击，但这确实意味着威胁通常会来自靠近\
  \ NFC 设备的近距离。拦截 NFC 流量、重放攻击和欺骗攻击都是 NFC 实现需要考虑的问题。同时，NFC 设备必须确保仅在期望时响应查询，以免攻击者仅将接收器移入范围内即可激活\
  \ NFC 事务或响应。\n\n##### RFID\n\n**射频识别（RFID）**是一种相对短距离（从某些被动标签的不到一英尺，到主动标签的约 100 米）无线技术，它使用标签和接收器来交换信息。RFID\
  \ 可以使用主动标签、半主动标签或被动标签部署。主动标签拥有自己的电源，并始终发送信号供读取器读取；半主动标签有电池为其电路供电，但由读取器激活；被动标签则完全由读取器供电。\n\
  \nRFID 标签还使用三个频段之一。低频 RFID 用于短距离、低功耗标签，常用于门禁和身份识别，由附近的读取器扫描。低频 RFID 在世界各地并不统一，这意味着标签可能不符合其他国家的频率或功率要求。高频\
  \ RFID 标签在正常情况下可读范围较长，可达一米，且通信速度更快。事实上，高频 RFID 用于近场通信，许多标签支持只读、只写和可重写标签。最后一个频段是超高频\
  \ RFID，读取速度最快，范围最长。这意味着高频 RFID 标签用于读取器需要更远距离的场景。高频标签已广泛应用于库存管理和防盗目的，以及许多其他需要从几米外远程查询标签的用途中。\n\
  \n由于体积小、形态灵活，RFID 标签可以嵌入贴纸、用于识别宠物的小型可植入芯片，以及收费站标签等设备形式中。RFID 标签可能以多种方式受到攻击，从简单的破坏或损坏标签使其无法读取，到修改标签（某些标签可重新编程）。标签可能被克隆、修改或欺骗；读取器可能被冒充；流量可能被捕获。\n\
  \n##### Infrared\n\n与本章中的其他无线技术不同，**红外（IR）**网络连接仅在视线范围内工作。IR 网络规范支持从极低带宽模式到千兆速度的各种模式，包括：\n\
  \n*   `SIR`，115 Kbit/s\n*   `MIR`，1.15 Mbit/s\n*   `FIR`，4 Mbit/s\n*   `VFIR`，16\
  \ Mbit/s\n*   `UFIR`，96 Mbit/s\n*   `GigaIR`，512 Mbit/s-1 Gbit/s\n\n由于处于视线范围内的任何设备都可以捕获\
  \ IR 流量，因此如果区域内有设备，流量就可能被捕获。当然，这也意味着与 Wi-Fi 和蓝牙流量不同，处于设备视线范围之外的设备通常无法捕获 IR 流量。\n\
  \n红外连接最常用于单个设备之间的点对点连接，但也存在用于创建网络和设备组的 IR 技术。尽管如此，红外连接在现代系统和设备中已较少见，很大程度上已被蓝牙和 Wi-Fi\
  \ 取代。\n\n##### GPS\n\n**全球定位系统（GPS）**与迄今为止描述的其他技术不同，它不用于创建设备传输的网络。相反，它利用一组卫星发射 GPS\
  \ 信号，由兼容的 GPS 接收器接收。虽然美国 GPS 系统最常被提及，但其他系统（包括俄罗斯的 GLONASS 系统和较小的区域性系统）也存在。GPS 导航可将设备定位在其实际位置一英尺范围内，从而为地理围栏和其他\
  \ GPS 用途提供高精度定位。GPS 还提供一致的时间信号，这意味着 GPS 接收器可集成到网络时间系统中。\n\n与其他基于射频的系统一样，GPS 信号可能被干扰或欺骗，尽管在正常使用中针对\
  \ GPS 的攻击并不常见。在美国，GPS 干扰是非法的，但有说法称 GPS 欺骗曾被用于针对军用无人机，导致其坠毁，且现实世界的概念验证工作已被演示。\n\n\
  ##### USB\n\n虽然本章讲的是无线网络和移动设备，但 USB 是许多移动设备的重要连接方式。由于 USB 是直接有线连接，它不面临无线网络的那些风险，但也有自己的隐患。USB\
  \ 连接给移动设备带来的最重大风险之一是：连接的设备可以访问移动设备，通常作为直接挂载的文件系统，还可能执行软件或固件更新，或以其他方式更改或收集移动设备的数据。一些组织禁止连接到\
  \ USB 充电器，或使用组织未预先批准或发放的线缆或系统进行充电。一些组织会发放仅充电 USB 线缆，这种线缆允许充电，但 USB 线缆内部未连接数据引脚。\n\
  \n#### 无线网络模型\n\n我们迄今为止描述的无线技术在三种主要模型之一中运行：点对点、点对多点或广播。图 13.1 显示了两个系统或设备之间的点对点网络，以及从单一位置连接到多个设备的点对多点网络设计。\n\
  \n![图 13.1 点对点和点对多点网络设计](img/c13f001.png)\n\n**图 13.1** 点对点和点对多点网络设计\n\n\n\n\n这些设计模型中的每一个都易于理解。点对点网络连接两个节点，它们之间的传输只能由端点接收。像\
  \ `Wi-Fi` 这样的点对多点网络有许多节点接收由一个节点发送的信息。广播设计向许多节点发送信息，通常不关心接收响应。`GPS` 和无线电都是广播模型的示例。\n\
  \n#### 针对无线网络的攻击\n\n在设计安全网络时，首先需要考虑的事情之一是它可能如何被攻击。攻击者可能伪装成合法的无线网络，向您的网络添加他们自己的无线设备，干扰网络，利用协议缺陷或发起攻击，或采取其他措施攻击您的网络。\n\
  \n##### 非法接入点和邪恶双胞胎\n\nSecurity+ 考试涉及网络可能被攻击的多种方式中的几种。您需要了解的第一种攻击是 `evil twin`（邪恶双胞胎）攻击。邪恶双胞胎是一个恶意的伪造接入点，旨在伪装成合法、受信任的网络。图\
  \ 13.2 展示了一种邪恶双胞胎攻击，其中客户端无线设备选择了邪恶双胞胎接入点 (AP)，而不是合法的接入点。攻击者可能使用了功率更大的 AP，将邪恶双胞胎放置在更靠近目标的位置，或使用了其他技术，使该\
  \ AP 更有可能成为目标关联的对象。\n\n![图 13.2 伪装成合法接入点的邪恶双胞胎](img/c13f002.png)\n\n**图 13.2** 伪装成合法接入点的邪恶双胞胎\n\
  \n一旦客户端连接到邪恶双胞胎，攻击者通常会提供互联网连接，以便受害者不会意识到出了问题。然后，攻击者将捕获受害者的所有网络流量，并寻找敏感数据、密码或其他可利用的信息。呈现虚假版本的网站，特别是登录屏幕，可以为成功实施邪恶双胞胎攻击的攻击者提供一种快速捕获凭据的方法。\n\
  \n邪恶双胞胎并不是您可能在网络中发现的唯一类型的不受欢迎的接入点。`Rogue access points`（非法接入点）是有意或无意添加到您网络中的 AP。一旦它们连接到您的网络，就可能为攻击者或其他不受欢迎的用户提供一个入口点。由于许多设备具有内置无线连接功能，并可能显示为可访问的网络，因此监控您的网络和设施中的非法接入点非常重要。\n\
  \n大多数现代企业无线控制器系统都具有内置功能，允许它们检测部署区域内的新接入点。此外，无线入侵检测系统或功能可以持续扫描未知接入点，然后通过将无线网络测试与有线网络日志和流量信息相结合，确定它们是否连接到您的网络。这有助于区分设置为热点的手机、可能播发设置用\
  \ Wi-Fi 网络的设备，以及插入您网络并可能因此造成真正威胁的设备。\n\n##### 蓝牙攻击\n\n对于 Security+ 考试，您需要熟悉两种类型的蓝牙攻击：`bluejacking`（蓝杰克/蓝牙垃圾信息攻击）和\
  \ `bluesnarfing`（蓝斯纳夫/蓝牙窃取攻击）。蓝杰克只是向支持蓝牙的设备发送未经请求的消息。蓝斯纳夫是对蓝牙设备的未经授权访问，通常旨在收集联系人列表或设备包含的其他详细信息。不幸的是，对于大多数蓝牙设备来说，没有太多安全措施可以实施。\n\
  \n许多设备仅需要使用易于猜测的代码（通常是 `0000`）进行配对，然后继续建立一个用于保护其通信的长期密钥。不幸的是，该长期密钥在与其他公共因素结合时用于生成会话密钥，从而使针对它们的攻击成为可能。\n\
  \n尽管蓝牙在从移动设备到医疗设备、可穿戴设备和汽车的各种场景中已使用多年，但蓝牙的安全模型并没有显著改进。因此，保护蓝牙设备的最佳选择是：如果不绝对需要，请关闭蓝牙，除非在使用时才打开。此外，如果设备允许设置配对代码，请将其从默认配对代码更改，并为蓝牙设备安装所有补丁。不幸的是，这将使许多设备仍处于脆弱状态，特别是那些嵌入式设备或不再受软件或硬件制造商支持的设备。\n\
  \n##### 射频和协议攻击\n\n想要实施邪恶双胞胎攻击，或出于任何原因想让系统脱离无线网络的攻击者，有两个主要选项可助其达成目标：解关联攻击和干扰。\n\n\
  `Disassociation`（解关联）描述的是设备从接入点断开连接时发生的情况。如果攻击开始时，目标系统能被强制与其正在使用的接入点解关联，许多无线攻击的效果会更好。这将导致系统尝试重新连接，为攻击者提供一个机会窗口，以建立功率更大的邪恶双胞胎，或在系统尝试重新连接时捕获信息。\n\
  \n攻击者强制系统解关联的最佳方式通常是发送一个去认证帧，这是一种特定的无线协议元素，可以通过伪造受害者的无线 MAC 地址发送给接入点。当 AP 接收到它时，将解关联该设备，要求其重新连接以继续。由于使用\
  \ `WPA2` 的网络的管理帧通常未加密，因此这种类型的攻击相对容易实施。然而，`WPA3` 要求受保护的管理帧，并将阻止这种去认证攻击生效。\n\n攻击像\
  \ `Wi-Fi` 和蓝牙这样的射频网络的另一种手段是干扰它们。`Jamming`（干扰）将阻断其作用范围或频率内的所有流量。由于干扰本质上是无线干扰，干扰并不总是有意的——事实上，遇到在与\
  \ Wi-Fi 设备相同频率范围内发射信号的设备并不罕见。\n\n针对 Wi-Fi 网络的最后一种攻击类型是 `initialization vector (IV)`（初始化向量）攻击。无线安全的原始实现是\
  \ `WEP`（有线等效隐私）。WEP 使用 24 位初始化向量，一旦捕获到足够的网络流量，就可以对其进行逆向工程。分析流量后，可推导出用于生成 `RC4` 密钥流的初始化向量，从而解密网络上发送的所有流量。幸运的是，IV\
  \ 攻击不再是现代网络的担忧。`WPA2` 和 `WPA3` 都不使用这种弱初始化向量，使 IV 攻击成为历史知识。\n\n### 设计网络\n\n为了易用性、性能和安全性设计您的\
  \ Wi-Fi 网络，需要仔细放置和配置无线接入点 (WAP)。调优和放置至关重要，因为无线接入点只有有限数量的信道可用，并且在彼此范围内使用相同信道的多个无线接入点会降低网络的性能和整体可用性。同时，组织通常不希望将信号扩展到不打算让网络覆盖的地方。这意味着您的设计可能需要包含限制无线信号超出建筑物或企业场所范围的\
  \ AP 放置选项。\n\n\n\n\n#### 无线网络设计与安全\n\n##### 站点勘测\n\n设计无线网络的一个重要部分是进行站点勘测。*站点勘测*涉及在整个设施或空间内移动，以确定现有网络的部署情况，并查看物理结构以寻找接入点的位置选项。在新建筑中，网络设计通常包含在设施的整体设计中。然而，由于大多数部署都在现有结构中，因此走遍现场进行勘测至关重要。\n\
  \n站点勘测工具在您行走时测试无线信号强度，允许您使用 GPS 匹配位置，并在平面图或地图上实际标记您的位置。它们随后显示无线信号所在位置、信号强度，以及每个接入点或设备所在的信道，形式为*热力图*。图\
  \ 13.3 显示了建筑物热力图的示例。请注意，接入点具有高信号区域，信号会逐渐衰减，且热力图并非完美的圆形。建筑结构和其他设备的干扰会影响无线信号的行为。\n\
  \n确定接入点将使用哪些信道也是此过程的一部分。在 2.4 GHz 频段中，每个信道宽 20 MHz，间隔 5 MHz。2.4 GHz Wi-Fi 部署有 11\
  \ 个信道，导致在分配的 100 MHz 空间内信道之间存在重叠，如图 13.3 所示。在大多数用例中，这意味着在可能控制空间信道使用的情况下，会使用信道 1、6\
  \ 和 11，以确保信道之间没有重叠，从而避免干扰。在人口稠密的城市地区或其他组织可能已有 Wi-Fi 部署的区域，将使用中的信道重叠到热力图上将有助于确定每个接入点应使用的信道。\n\
  \n图 13.4 显示了北美使用的 2.4 GHz 信道。日本、印度尼西亚和美国以外地区提供额外信道，这些区域除支持美国网络使用的 11 个信道外，还支持信道\
  \ 12 和 13。请注意信道之间的重叠，如果接入点在相互覆盖范围内使用重叠信道，可能会导致干扰。\n\n许多接入点在部署时会自动选择最佳信道。无线网络管理软件可以监控干扰和重叠问题，并利用其确定是否存在新的非法接入点或其他意外无线设备的相同能力来调整您的网络。这些更高级的企业级\
  \ Wi-Fi 控制器和管理工具还可以调整广播功率以避免干扰，甚至压制不需要的设备。\n\n![图 13.3 显示接入点可用无线信号的无线热力图](img/c13f003.png)\n\
  \n**图 13.3** 显示接入点可用无线信号的无线热力图\n\n弄清楚现有的接入点和其他设备，以及您打算部署无线网络的建筑物或空间中可能已有哪些可访问的网络，可能是一项挑战。幸运的是，Wi-Fi\
  \ 分析器软件可用于收集勘测和规划网络、创建热力图、识别在 2D 和 3D 模型中使用的最佳信道映射、进行速度测试以及执行无线客户端信息收集等所有所需数据。尽管每个分析器工具的功能和特性可能不同，但它们是网络工程师和安全专业人员用于评估无线网络的工具包中的关键部分。\n\
  \n![图 13.4 北美 2.4 GHz Wi-Fi 信道重叠图](img/c13f004.png)\n\n**图 13.4** 北美 2.4 GHz Wi-Fi\
  \ 信道重叠图\n\n##### 控制器与接入点安全\n\n企业网络依赖无线局域网 (WLAN) 控制器来帮助管理接入点和组织的无线网络。它们提供额外的智能和监控；允许软件定义无线网络；并可提供额外服务，如融合\
  \ Wi-Fi 和 5G 无线漫游。无线控制器可以作为硬件设备、云服务、虚拟机或软件包进行部署。\n\n并非所有组织都会部署无线控制器。中小型组织可能选择部署独立接入点以提供无线网络接入。\n\
  \n在这两种场景中，妥善保护控制器和接入点是无线网络安全的重要组成部分。与其他网络设备一样，控制器和 AP 都需要配置为安全状态：通过更改默认设置、禁用不安全的协议和服务、设置强密码、将其管理接口放置在隔离的\
  \ VLAN 或管理网络中进行保护，并确保定期打补丁和更新。此外，应开启并调整监控和日志记录，以确保重要信息和事件既记录在无线控制器或接入点上，也记录在中央管理软件或系统中。\n\
  \n更高级的 WLAN 控制器和接入点可能还具有高级安全功能，如威胁情报、入侵防御或其他集成能力。根据您的网络架构和安全设计，您可能希望利用这些能力，也可能选择禁用它们，因为您的网络基础设施在其他位置或使用其他工具实现了这些能力，或者它们不符合您部署它们的网络需求。\n\
  \n##### Wi-Fi 安全标准\n\nWi-Fi 网络依赖安全和认证标准来保持安全。事实上，现代无线设备如果未通过 WPA2 或 WPA3 等当前标准的认证，甚至无法显示\
  \ Wi-Fi 商标。\n\n*`WPA2`*（Wi-Fi Protected Access 2）是一种广泛部署和使用的标准，提供两种主要使用模式：\n\n*\
  \   **WPA-Personal**：使用预共享密钥，因此通常称为 `WPA-PSK`。这允许客户端在没有认证服务器基础设施的情况下进行认证。\n*   **WPA-Enterprise**：依赖\
  \ RADIUS 认证服务器，作为 802.1x 实现的一部分进行认证。因此，用户可以拥有唯一凭据并被单独识别。\n\n`WPA2` 引入了*计数器模式密码分组链消息认证码协议\
  \ (CCMP)*。`CCMP` 使用高级加密标准 (AES) 加密提供机密性，其加密强度远高于之前使用的 WEP 或有线等效隐私协议。除了机密性，`CCMP`\
  \ 还提供用户认证和访问控制能力。您会注意到它提供了用户认证，但不提供网络认证——这是 `WPA3` 中的一项重要新增功能。\n\n\n\n\n\n######\
  \ WPA3\n\n*WPA3* 是 WPA2 的替代品，自 2018 年中起，所有 Wi-Fi 设备都必须支持 WPA3。由于许多组织中存在大量不支持的设备，WPA3\
  \ 尚未在常规使用中得到广泛实施，但随着设备的更换，WPA3 部署将变得更加普遍。根据是用于个人模式还是企业模式，WPA3 在许多方面改进了 WPA2。\n\n\
  ####### WPA3-Personal\n\nWPA3-Personal 为基于密码的身份验证提供了额外保护，使用一种称为*Simultaneous Authentication\
  \ of Equals (SAE，对等实体同时认证)*的过程。SAE 取代了 WPA2 中使用的预共享密钥，并要求客户端和网络之间进行交互以验证双方。这种交互减慢了暴力破解攻击的速度，并使其不太可能成功。由于\
  \ SAE 意味着用户不必都使用相同的密码，实际上允许他们选择自己的密码，因此也有助于提高易用性。WPA3-Personal 还实现了完美前向保密，这确保了即使客户端的密码已被泄露，客户端与网络之间发送的流量仍然是安全的。\n\
  \n####### WPA3-Enterprise\n\nWPA3-Enterprise 提供比 WPA2 更强的加密，具有可选的 192 位模式，并增加了经认证的加密以及用于派生和认证密钥以及加密网络帧的额外控制。因此，WPA3\
  \ 相较于现有的 WPA2 网络提供了许多安全优势。\n\n#### 无线身份验证\n\n尽管网络使用的安全协议和标准很重要，但控制对网络本身的访问同样至关重要。组织在选择如何提供网络访问方面有多种选择。Security+\
  \ 考试大纲包含现代 Wi-Fi 网络中的三种主要身份验证类型：\n\n*   **开放网络**，不需要身份验证，但通常使用 `captive portal`（强制门户/网页认证）来收集想要使用网络的用户的某些信息。强制门户在允许访问网络之前将流量重定向到网站或注册页面。开放网络不提供加密，除非流量通过\
  \ HTTPS 等安全协议发送，否则用户数据将面临风险。\n*   **使用预共享密钥 (PSK)** 需要一个与想要使用网络的任何人共享的口令或密钥。这允许流量被加密，但不允许唯一地识别用户。\n\
  *   **企业身份验证** 依赖 RADIUS 服务器，并利用可扩展认证协议 (EAP) 进行身份验证。\n\n##### 无线身份验证协议\n\n`802.1x`\
  \ 是一种用于访问控制的 IEEE 标准，适用于有线和无线设备。在无线网络中，`802.1x` 用于与 RADIUS 服务器集成，允许企业用户进行身份验证并获得网络访问权限。根据关于用户的信息，可以采取额外的操作，例如将他们放入组或网络区域，或在用户通过身份验证后根据属性采取其他操作。\n\
  \nWi-Fi 网络依赖 IEEE `802.1x` 和各种版本的 EAP。当设备向 RADIUS 服务器进行身份验证时，EAP 作为 `802.1x` 认证过程的一部分被使用。正如其名称暗示的那样，EAP\
  \ 设计为可扩展的，因此存在许多 EAP 变体。以下是您应该了解的常见 EAP 变体：\n\n*   **Protected Extensible Authentication\
  \ Protocol (PEAP，受保护的可扩展认证协议)** 使用证书对服务器进行身份验证，并使用 TLS 隧道封装 EAP 以保持其安全。网络上的设备使用唯一的加密密钥，并实现了临时密钥完整性协议\
  \ (TKIP) 以定期替换密钥。\n*   **Flexible Authentication via Secure Tunneling Extensible\
  \ Authentication Protocol (EAP-FAST，通过安全隧道进行灵活认证的可扩展认证协议)** 是一种由思科开发的协议，改进了轻量级可扩展认证协议\
  \ (LEAP) 中的漏洞。EAP-FAST 专注于在设备漫游时提供更快的重新认证。EAP-FAST 通过使用共享密钥（对称密钥）进行重新认证，绕过了减慢 PEAP\
  \ 和 EAP-TLS 速度的公钥交换。EAP-FAST 可以使用预共享密钥或使用公钥认证建立的动态密钥。\n*   **Extensible Authentication\
  \ Protocol-Transport Layer Security (EAP-TLS，可扩展认证协议-传输层安全)** 实现了基于证书的身份验证以及设备和网络的相互认证。它在客户端和网络设备上都使用证书来生成密钥，然后用于通信。由于在大量客户端设备上部署和管理证书的挑战，EAP-TLS\
  \ 的使用频率较低。\n*   **EAP Tunneled Transport Layer Security (EAP-TTLS，隧道传输层安全可扩展认证协议)**\
  \ 扩展了 EAP-TLS，与 EAP-TLS 不同，它不要求客户端设备拥有证书即可创建安全会话。这消除了 EAP-TLS 为分发和管理终端证书所需的开销和管理工作，同时仍为设备提供\
  \ TLS 支持。EAP-TTLS 部署的一个顾虑是，EAP-TTLS 可能需要在某些设备上安装额外软件，而提供类似功能的 PEAP 则不需要。EAP-TTLS\
  \ 确实支持一些安全性较低的认证机制，这意味着有时可能会因特定要求而实施它。\n\n当组织希望协同工作时，RADIUS 服务器可以联合起来，允许来自其他组织的个人使用其母组织的账户和凭据向远程网络进行身份验证。这样联合\
  \ RADIUS 服务器要求作为联盟的一部分在 RADIUS 服务器之间建立信任。许多高等教育机构为无线网络提供名为 `eduroam` 的联合认证服务，允许来自任何\
  \ eduroam 机构的学生、教职员工在任何其他支持 eduroam 的组织进行身份验证并使用网络。当然，如果存在多个 RADIUS 域，RADIUS 服务器也可以在单个组织内联合。\n\
  \n### 管理安全移动设备\n\n组织使用各种各样的移动设备，范围从手机和平板电脑到更专业的设备。当您考虑组织应如何处理它们时，您需要为部署和管理模型进行规划，是否将使用移动设备管理工具，以及将实施哪些安全选项和设置。\n\
  \n#### 移动设备部署方法\n\n当组织使用移动设备时，一个重要的设计决策是将选择哪种部署和管理模型。最常见的选项是 BYOD（自带设备）；CYOD（自选设备）；COPE（公司所有、个人启用）；以及完全公司所有。\n\
  \n这些选项各有优缺点，如表 13.2 所述。\n\n这些选项归结为几个常见问题。首先，谁拥有、选择并支付设备及其连接计划的费用？其次，设备如何被管理和支持？第三，数据和应用程序如何被管理、保护和保障？\n\
  \nBYOD 将控制权交给最终用户，因为他们选择并管理自己的设备。在某些 BYOD 模型中，组织可能会使用有限的管理功能，例如远程擦除电子邮件或特定应用程序的能力，但\
  \ BYOD 的控制和管理模型在很大程度上基于用户。此选项为组织提供的安全性和监督要少得多。\n\n\n\n\n\n##### 移动设备部署模型\n\n######\
  \ CYOD（自选设备）\n\n在 CYOD 模型中，组织支付设备费用，通常也支付蜂窝网络套餐或其他连接费用。用户选择设备，有时从首选选项列表中选择，而不是自带他们想用的任何设备。在此类\
  \ CYOD 设计中，支持更容易，因为只会遇到有限数量的设备类型，这也可以使安全模型更容易建立。由于 CYOD 仍将设备留在用户手中，安全性和管理可能仍不那么标准化，尽管这可能会有所不同。\n\
  \n###### 部署选项对比\n\n**表 13.2** 移动设备部署和管理选项\n\n| | 谁拥有设备？ | 谁控制和维护设备 | 描述 |\n|---|---|---|---|\n\
  | **BYOD** (自带设备) | 用户 | 用户 | 用户自带个人拥有的设备。这提供了更多的用户自由和更低的组织成本，但风险更大，因为组织不控制、保护或管理该设备。\
  \ |\n| **CYOD** (自选设备) | 组织 | 用户 | 组织拥有设备，但允许用户选择并维护它。 |\n| **COPE** (企业拥有，个人启用)\
  \ | 组织 | 组织 | 企业提供的设备允许合理的个人使用，同时满足企业安全和控制需求。 |\n| 企业拥有 | 组织 | 组织 | 企业拥有提供最大的控制权，但灵活性最低。\
  \ |\n\n###### COPE（企业拥有，个人启用）\n\n在 COPE 模型中，设备归公司所有并由公司管理。COPE 认识到用户不太可能想随身携带两部手机，因此允许在企业设备上进行合理的个人使用。该模型允许组织更全面地控制设备，同时仍允许个人使用。\n\
  \n###### 完全企业拥有\n\n完全由企业拥有和管理的设备是受控程度最高的环境，通常更类似于带有完整控制和管理套件的企业 PC。这是选项中最不友好的，因为企业选择和管理的设备将满足企业需求，但通常缺乏更以最终用户为中心的设计的灵活性。\n\
  \n###### 实施考量\n\n尽管这些是常见的描述，但实际实施差异很大，每种解决方案之间的界限可能很模糊。这些不是硬性规定，而是组织移动设备部署模型的起点示例，可以帮助推动安全、管理和运营实践的讨论。在实际使用中，审视这些实践的最佳方式是将其视为基于组织需求、能力和实际使用情况的一个光谱的一部分。\n\
  \n###### 支持技术\n\n一项可以帮助使移动设备部署更安全的关键技术是使用 `virtual desktop infrastructure (VDI)`（虚拟桌面基础设施），允许相对低安全性的设备访问安全的托管环境。使用\
  \ `VDI` 允许设备用户连接到远程环境，执行操作，然后返回设备的正常使用。容器化工具也可以帮助将设备在工作和个人使用环境之间分隔开，允许在设备上运行工作容器或个人容器，而不会混合数据和访问权限。\n\
  \n#### 移动设备管理\n\n移动设备可能难以管理，特别是由于操作系统限制、硬件制造商之间的差异、运营商设置和操作系统版本。许多移动设备旨在供个人使用，没有更多面向业务的设备和软件通常拥有的广泛内置控制。当你加上各种各样的设备部署模型时，安全从业者在日益以移动设备为中心的环境中面临真正的挑战。\n\
  \n因此，当管理员和安全专业人员需要管理移动设备时，他们经常求助于 `mobile device management (MDM)`（移动设备管理）或 `unified\
  \ endpoint management (UEM)`（统一端点管理）工具。`MDM` 工具专门针对 Android 和 iOS 手机、平板电脑和其他类似系统等设备。`UEM`\
  \ 工具将移动设备、台式机和笔记本电脑以及许多其他类型的设备结合在一个管理平台中。\n\n第三类工具称为 `mobile application management\
  \ (MAM)`（移动应用程序管理）工具，专门关注部署到移动设备上的应用程序。常见功能包括应用程序交付、配置、更新和版本管理、性能监控和分析、日志记录和数据收集，以及与用户和身份验证相关的各种控制。尽管一些组织在使用\
  \ `MAM` 产品，但随着功能更全面的 `MDM` 和 `UEM` 工具接管市场以提供对移动设备的更多控制，它们变得不那么常见。\n\n无论你选择哪种类型的工具，你的组织都可以使用许多功能来确保移动设备及其包含的数据安全。虽然以下列表不是\
  \ `MDM`、`UEM` 和 `MAM` 工具中每个可用功能的完整列表，但你需要了解它们每一个，以及为什么你可能想要拥有它，以便为考试做好准备。\n\n#####\
  \ 关键 MDM/UEM/MAM 功能\n\n###### 应用程序管理\n\n应用程序管理功能对于允许企业控制应用程序非常重要。这些功能可能包括将特定应用程序部署到所有设备；限制可安装的应用程序；远程添加、删除或更改应用程序及其设置；或监控应用程序使用情况。\n\
  \n###### 内容管理\n\n内容管理（有时称为 `MCM`，即移动内容管理）确保对组织文件（包括移动设备上的文档和媒体）的安全访问和控制。移动设备部署的一个主要关注点是组织数据和个人数据在\
  \ `BYOD` 和共享使用设备上的混合。内容管理功能将业务数据锁定在受控空间中，然后帮助管理对该数据的访问。在许多情况下，这需要使用 `MDM` 在移动设备上的应用程序来访问和使用数据。\n\
  \n###### 远程擦除功能\n\n当设备丢失或被盗，或所有者不再受雇于组织时，会使用远程擦除功能。了解完全设备擦除与只能擦除部署到设备上的组织数据和应用程序的擦除工具之间的区别很重要。在个人拥有设备的环境中，如果使用远程擦除并擦除了设备，可能会产生责任和其他问题。同时，带有确认流程（让你在成功时知道）的远程擦除是帮助保护组织数据的重要组成部分。\n\
  \n###### 地理定位和地理围栏\n\n地理定位和地理围栏功能允许你利用手机的位置来决定其操作。一些组织可能只允许企业平板电脑在企业设施内使用，以减少在其建筑物外被盗或数据访问的可能性。其他组织可能希望设备在离开已知区域时自行擦除。除了我们在日常生活中习惯的地图和类似工具的许多地理定位用途外，地理定位还可以帮助定位丢失的设备。\n\
  \n###### 屏幕锁、密码和 PIN 码\n\n屏幕锁、密码和 PIN 码都是防止未经授权访问的正常设备安全模型的一部分。屏幕锁定时间设置是基本移动设备安全中最常设置的安全选项之一。就像台式机和笔记本电脑一样，移动设备管理工具还设置密码长度、复杂度以及密码或\
  \ PIN 码必须更改的频率等内容。\n\n###### 生物识别\n\n生物识别技术在现代设备上广泛可用，指纹和面部识别是最广泛采用和部署的。生物识别可以集成到移动设备管理功能中，以便你可以为特定设备部署用户的生物识别认证，并利用生物识别因素实现额外的安全性或易用性。\n\
  \n\n\n\n\n##### 上下文感知身份验证\n\n上下文感知身份验证超越了 PIN 码、密码和生物识别技术，以更好地反映用户行为。上下文可能包括位置、使用时间以及其他各种行为要素，这些要素可以决定用户是否应该能够登录。\n\
  \n##### 容器化\n\n容器化是处理设备上工作与个人使用场景分离的日益普遍的解决方案。使用安全容器来运行应用程序、存储数据，并以其他方式保持设备使用的独立性，可大大降低交叉污染和暴露的风险。在许多\
  \ MDM 模型中，应用程序使用封装器来运行，有助于保持它们的独立性和安全性。在其他模型中，则会根据需要运行完整的容器化环境。\n\n##### 存储分段\n\n\
  存储分段也可用于将个人数据和业务数据分开。这可能是单独的卷，甚至是需要特定应用程序、封装器或容器才能访问的单独加密卷。事实上，存储分段和容器化或封装技术通常结合使用，以更好地实现应用程序和分离。\n\
  \n##### 全设备加密 (FDE)\n\n全设备加密 (FDE) 仍然是确保被盗或丢失的设备不会导致数据泄露的最佳方式。当与远程擦除功能和强身份验证要求相结合时，FDE\
  \ 可以提供设备抵抗数据盗窃的最大可能性。\n\n##### 推送通知\n\n推送通知在这里似乎是个奇怪的入选项，但向设备发送消息在许多场景中都很有用。您可能需要提醒用户注意某个问题，或要求他们执行某项操作。或者您可能想与捡到丢失设备的人沟通，或告诉小偷该设备正在被追踪！因此，从中心位置发送消息的能力可以成为\
  \ MDM 或 UEM 系统中的一个有用工具。\n\n##### MDM 和 UEM 控制\n\nMDM 和 UEM 工具还为用户行为提供了一套丰富的控制。它们可以启用封闭或受管的第三方应用商店，或限制用户从操作系统或您部署的设备原生应用商店下载和使用的内容。它们还可以监控固件更新和版本，包括固件空中下载\
  \ (OTA) 更新是否已应用，以确保打补丁工作的发生。\n\n当然，用户可能会尝试通过为其设备获取 Root 权限或越狱来绕过这些控件，以便旁路加载（从 microSD\
  \ 卡手动安装或通过 USB 线缆安装）程序，甚至安装自定义固件。MDM 和 UEM 工具将通过检查已知良好的固件和软件来检测这些活动，并且它们可以对设备上安装的应用程序应用允许列表或阻止列表。\n\
  \n##### 服务和功能控制\n\n控制可以使用哪些服务和设备功能，甚至可以在哪里使用它们，也是许多组织依赖的一项功能。限制或禁止使用摄像头和麦克风以及 SMS、MMS\
  \ 和富通信服务 (RCS) 消息，有助于防止安全区域的数据泄露。限制外部媒体和 USB On-The-Go (OTG) 功能的使用（该功能允许设备充当 USB\
  \ 外部设备（如相机或存储设备）的主机）也有助于限制设备被滥用的可能性。MDM 和 UEM 工具通常还允许管理员控制照片和其他可能嵌入有关拍摄或创建位置的 GPS\
  \ 数据的文档的 GPS 标记功能。使用位置数据的能力可以是一个有用的隐私控制，也可能是组织文档流程的一部分要求。\n\n##### 无线连接控制\n\n管理员可能还想控制设备如何使用其无线连接。这可以采取限制设备可以连接到哪些\
  \ Wi-Fi 网络、阻止它们形成或加入自组无线网络，以及禁用网络共享和成为无线热点的能力的形式。蓝牙和 NFC 控制也有助于防止设备以不符合组织安全模型的方式被使用，例如用作支付方式或访问设备。\n\
  \n##### 运营商解锁\n\nSecurity+ 考试大纲中列出的执行和监控的最后一项是运营商解锁。`Carrier unlocking` 允许手机与其他蜂窝网络提供商一起使用。监控设备的运营商解锁状态不是常见的\
  \ MDM 功能，通常在运营商层面处理。\n\n##### 专用移动设备安全工具\n\n保护移动设备还涉及操作系统和硬件安全。Security+ 考试列出了两种特定的安全技术，它们是移动设备安全功能的具体示例。\n\
  \n###### microSD 硬件安全模块 (HSM)\n\n第一种是 microSD 硬件安全模块 (HSM)。就像本书其他地方讨论的硬件安全模块一样，microSD\
  \ HSM 是一种采用极小外形规格的硬件密钥管理和公钥基础设施 (PKI) 工具。事实上，此类 HSM 不仅以 microSD 卡的形式提供，还以 USB、SIM\
  \ 和其他外形规格提供。\n\n与其他 HSM 一样，这些设备提供密钥创建、备份和恢复以及管理服务，并支持公钥身份验证和其他加密工具。当然，这些设备本身并无用处，需要配合应用程序使用。\n\
  \n###### SEAndroid\n\n考试涉及的第二种特定技术是 SEAndroid。SEAndroid 是适用于 Android 设备的安全增强型 Linux\
  \ 版本。SEAndroid 提供了在 Android 设备上强制实施强制访问控制的能力。这意味着所有类型的 Android 进程都可以得到更好的隔离，从而限制漏洞利用，并有助于保护系统服务、系统和应用程序数据以及日志。\n\
  \n像许多安全系统一样，任何未明确允许的操作都会被拒绝——这是一种默认拒绝系统。SEAndroid 在强制模式下运行，该模式会记录发生的任何权限拒绝事件，并强制执行它们。SEAndroid\
  \ 允许在 Android 设备上实施广泛的策略。\n\n### 摘要\n\n构建安全网络始于了解组织可能选择部署的无线连接选项。虽然 Wi-Fi、蜂窝网络和蓝牙几乎无处不在，但其他技术如\
  \ RFID、红外和 NFC 也内置在设备和系统中。这些技术可以构建成点对点或点对多点网络，了解哪些技术在发挥作用以及它们如何连接设备，是设计网络的第一步。\n\
  \n一旦知道需要保护哪种无线技术，您必须了解针对无线技术和协议的常见攻击，以及针对网络的特定常见攻击。非法接入点、邪恶双生和解关联攻击是攻击 Wi-Fi 网络的方法，蓝牙窃取和蓝牙骚扰针对蓝牙。干扰攻击，或向网络发送大量流量使其无法通过，可针对大多数射频甚至红外网络实施。\n\
  \n考虑到技术和攻击，接下来进行网络设计，包括使用现场勘测来了解网络将要部署的环境。热力图显示信号传播，有助于设备放置。如何保护控制器和接入点也很重要，关注点范围从补丁和维护到通过受保护的通道或网络进行安全远程访问。\n\
  \n网络设计完成后，安全性和身份验证选项是设计的下一层。WPA2 和 WPA3 提供加密功能和部署模型，允许用户使用预共享密钥 (WPA2-PSK) 或唯一密码，以及连接到\
  \ RADIUS 服务器以允许使用组织凭据的企业模型。EAP 及其众多变体允许根据硬件支持和特定的身份验证需求进行选择。\n\n\n\n\n\n### 移动设备安全\n\
  \n最后，必须保障移动设备的安全。部署模式范围从允许用户自带设备的 BYOD 流程，到完全由企业拥有的模式，后者将为特定目的锁定的设备部署到最终用户手中。设备还需要被管理，这正是移动设备管理工具发挥作用的地方。它们提供广泛的功能，作为安全专业人员，你需要了解这些功能。\n\
  \n### 考试要点\n\n**现代企业依赖多种类型的无线连接。** 组织和个人有许多无线连接选项。设备可能通过蜂窝网络连接，这将网络控制权交给了蜂窝提供商。`Wi-Fi`\
  \ 广泛用于以高速将设备连接到组织网络，在提供企业安全协议的安全性的同时，允许轻松移动。`NFC` 和 `RFID` 提供短距离、相对低带宽的数据交换，用于支付、ID\
  \ 卡和库存标签等许多其他用途。红外线虽然在某些领域仍在使用，但由于其视线要求和在许多情况下的带宽限制，不太流行。\n\n**针对无线网络的常见攻击利用协议和人为行为中的漏洞。**\
  \ 邪恶双生伪装成合法网络，而流氓接入点是连接在您网络内部的设备，允许攻击者绕过您的安全边界。`Bluejacking` 向 `Bluetooth` 设备发送未经请求的消息，而\
  \ `bluesnarfing` 侧重于窃取联系人和其他数据。针对 `Wi-Fi` 的协议攻击可能导致取消关联，导致系统重新连接，并允许攻击者捕获有用数据或欺骗用户或系统连接到邪恶双生。`Jamming`\
  \ 攻击用噪声或不需要的信号淹没网络，导致中断或断开连接。\n\n**安全的无线网络设计考虑现有网络和物理空间。** 现场勘测包括使用工具对设施进行实地巡查，这些工具可以识别现有的无线网络和接入点以及信号强度和其他有助于绘制位置的详细信息。网络设计考虑信道间距、接入点放置，甚至在放置接入点时考虑建筑物的构成。\n\
  \n**加密和认证协议提供无线安全。** 现代 `Wi-Fi` 网络中同时使用 `WPA2` 和 `WPA3`。这些协议提供简单的认证模型（如 `WPA2` 的预共享密钥模式）和依赖\
  \ `RADIUS` 服务器使用组织凭据提供用户登录的企业认证模型。设备经常被配置为使用可扩展认证协议（`EAP`）的一种变体，该变体支持组织的安全需求，并受部署的无线设备支持。\n\
  \n**保护底层无线基础设施需要强大的网络设备管理和安全实践。** 除了这些协议之外，控制器和接入点必须受到保护。与其他网络设备一样，控制器和 `AP` 需要定期打补丁和更新，并必须安全配置。它们还必须具有受保护的管理接口，并应配置为记录和报告网络、其自身状态以及安全问题或潜在问题。\n\
  \n**管理移动设备依赖部署方法和管理工具。** 部署方法包括自带设备（`BYOD`）；自选设备（`CYOD`）；企业拥有、个人启用（`COPE`）；和企业拥有（`COBO`）。组织在选择部署模型时，需要评估每种方法的风险和收益。一旦做出决定，可以使用移动设备管理（`MDM`）或统一端点管理（`UEM`）工具以多种方式配置、保护、管理和控制设备，从部署应用程序到在设备丢失或被盗时安全擦除设备。您需要了解\
  \ `MDM` 和 `UEM` 产品的功能和局限性，以及它们可以管理的设备和操作系统。\n\n**专用移动安全技术可以提供专门的功能。** 专用硬件和软件可以为移动设备增加额外的功能和能力。考生需要熟悉移动硬件安全模块，包括那些使用\
  \ `microSD` 卡外形因子为移动设备提供加密功能的模块。`SEAndroid` 是用于 `Android` 的 `SELinux` 版本，允许 `Android`\
  \ 设备以类似于 `SELinux` 为其他 `Linux` 发行版提供的方式实现强制访问控制（`MAC`）功能。使用 `SEAndroid` 的 `Android`\
  \ 设备可以更有效地执行安全策略，包括默认拒绝策略以及文件系统和应用程序环境的分离。\n\n### 复习题\n\n1.  Alyssa 想要使用她的 `Android`\
  \ 手机存储和管理加密证书。她可以选择哪种解决方案使用安全硬件来实现此目的？\n\n    1.  `SEAndroid`\n    2.  **microSD\
  \ HSM**\n    3.  无线 `TPM`\n    4.  `MDM`\n\n2.  Fred 的公司采用 `BYOD` 模式发放设备。这意味着 Fred\
  \ 希望确保企业数据和应用程序与设备上的个人应用程序保持分离。哪种技术最适合满足这一需求？\n\n    1.  生物识别\n    2.  全设备加密\n \
  \   3.  上下文感知认证\n    4.  **容器化**\n\n3.  Michelle 向在公司工厂车间工作的员工部署了 `iPad`。她希望确保设备仅在工厂内工作，如果带回家则无法访问业务数据或服务。哪种解决方案最适合她的需求？\n\
  \n    1.  上下文感知认证\n    2.  **电子围栏**\n    3.  地理定位\n    4.  统一端点管理（`UEM`）\n\n4. \
  \ 哪种无线技术常用于门禁卡？\n\n    1.  `Wi-Fi`\n    2.  红外线\n    3.  蜂窝网络\n    4.  **`RFID`**\n\
  \n5.  在现场勘测期间，Chris 发现广播其组织 `SSID` 的接入点比预期的要多。他可能发现了哪种类型的无线攻击？\n\n    1.  相同双生\n\
  \    2.  备用接入点\n    3.  **邪恶双生**\n    4.  分裂 `SSID`\n\n6.  Daniel 知道 `WPA3` 增加了一种方法，以确保针对弱预共享密钥的暴力破解攻击不太可能成功。这项技术叫什么？\n\
  \n    1.  **`SAE`**\n    2.  `CCMP`\n    3.  `PSK`\n    4.  `WPS`\n\n7.  Isabelle\
  \ 需要选择将与其无线网络一起使用的 `EAP` 协议。她想使用一种安全协议，不要求客户端设备拥有证书，但确实要求双向认证。她应该使用哪种 `EAP` 协议？\n\
  \n    1.  `EAP-FAST`\n    2.  **`EAP-TTLS`**\n    3.  `PEAP`\n    4.  `EAP-TLS`\n\
  \n8.  Theresa 实施了一项技术，使员工使用的移动设备上个人用途的数据与公司数据保持分离。这个概念叫什么？\n\n    1.  存储分段\n   \
  \ 2.  多因素存储\n    3.  全设备加密\n    4.  **容器化**\n\n9.  什么标准允许将相机、键盘和闪存驱动器等 `USB` 设备插入移动设备并像平常一样使用？\n\
  \n    1.  `OG-USB`\n    2.  `USB-HSM`\n    3.  **`USB-OTG`**\n    4.  `RCS-USB`\n\
  \n10.  Madhuri 在她组织的手机上禁用了 `SMS`、`MMS` 和 `RCS`。她阻止了什么被发送？\n\n     1.  电话和短信\n  \
  \   2.  **短信和多媒体消息**\n     3.  短信和固件更新\n     4.  电话和多媒体消息\n\n11.  通过 `MDM` 工具禁用\
  \ `GPS` 标记，一些公司最常见的担忧是什么？\n\n     1.  保管链\n     2.  支持电子围栏的能力\n     3.  **隐私**\n\
  \     4.  上下文感知认证\n\n\n\n\n\n### 12. Bart 知道 Wi-Fi 设备之间有两种常见的连接方式。以下哪项最能描述 Ad hoc\
  \ 模式？\n\n1. 点对点\n2. NFC\n3. 点对多点\n4. RFID\n\n### 13. Susan 希望确保将手机丢失导致数据泄露的威胁降至最低。她应该实施哪两种技术来实现这一目标？\n\
  \n1. Wi-Fi 和 NFC\n2. 远程擦除和 FDE\n3. 容器化和 NFC\n4. 地理围栏和远程擦除\n\n### 14. 移动设备上部署最普遍的两种生物识别认证解决方案是什么？\n\
  \n1. 语音识别和人脸识别\n2. 指纹识别和步态识别\n3. 人脸识别和指纹识别\n4. 语音识别和指纹识别\n\n### 15. Alaina 实施了 WPA2，并对基础设施模式下的接入点使用企业级认证。她的网络使用什么加密协议？\n\
  \n1. WEP\n2. TKIP\n3. CCMP\n4. IV\n\n### 16. Jerome 希望允许客人使用其组织的无线网络，但不想提供预共享密钥。他可以部署什么解决方案，在允许用户访问其开放网络之前收集电子邮件地址或其他联系信息等信息？\n\
  \n1. WPS 捕获模式\n2. Kerberos\n3. WPA2\n4. 网关认证\n\n### 17. Amanda 想要创建一个视图，显示其建筑物的\
  \ Wi-Fi 信号强度和覆盖范围。这种视图叫什么？\n\n1. 信道叠加图\n2. PSK\n3. 热力图\n4. SSID 图表\n\n### 18. Laura\
  \ 想为她的小型企业部署 WPA2 安全无线网络，但她没有设置 RADIUS 服务器。如果她希望 Wi-Fi 经过加密，无线认证的最佳选择是什么？\n\n1.\
  \ EAP\n2. PSK\n3. EAP-TLS\n4. 带有网关认证的开放 Wi-Fi\n\n### 19. Gurvinder 想要选择一种移动设备部署方式，为员工提供设备，让他们能像使用个人设备一样使用，以最大限度地提高灵活性和易用性。他应该选择哪种部署模型？\n\
  \n1. CYOD\n2. COPE\n3. BYOD\n4. MOTD\n\n### 20. Octavia 发现她手机中的联系人列表已通过无线攻击被窃取。以下哪项是最可能的罪魁祸首？\n\
  \n1. 蓝杰克\n2. 恶仆攻击\n3. 蓝牙窃取\n4. 邪恶双子\n\n### 第 14 章：事件响应\n\n当出现问题时，组织需要一种响应事件的方式，以确保其影响受到限制，并能尽快恢复正常运营。这意味着你需要知道如何根据一系列事件或数据点识别事件，如何遏制事件，以及随后该怎么做。\n\
  \n在本章中，你将了解典型事件响应流程的组成部分，包括事件响应周期。事件响应不仅仅是如何阻止攻击者或清除他们的工具。它还包括准备和学习流程，以确保组织根据已解决的事件持续学习和改进。你还将了解事件响应团队、为应对事件可进行的演练类型，以及你可能需要制定的事件响应计划。掌握这些信息后，你将了解三种有助于将事件置于上下文中的常见模型：MITRE\
  \ ATT&CK 模型、钻石入侵分析模型和网络攻击链。\n\n掌握事件响应基础知识后，你的下一步将是探索事件响应数据和工具，重点关注安全信息和事件管理（`SIEM`）系统。你将探索\
  \ `SIEM` 工具的常见功能和用途，以及 `SIEM` 系统摄取和分析的日志和数据，以帮助事件响应人员。\n\n本章继续探讨缓解和恢复流程及工具。剧本和运行手册是响应人员最重要的两个要素，因为它们有助于在压力情况下指导响应，并确保组织提前规划好应对措施。安全编排、自动化和响应（`SOAR`）工具也常用于帮助指导恢复和响应。`SOAR`\
  \ 工具和手动技术有助于缓解和恢复流程，这些流程通常会重新配置端点安全解决方案，以确保组织在响应过程中保持安全。\n\n### 事件响应\n\n无论组织的安全防护多么强大，最终总会出问题。无论是涉及恶意行为者的直接攻击、恶意软件、内部威胁，甚至只是一个简单的错误，安全事件都是所有组织迟早会面临的现实。\n\
  \n因此，组织需要事件响应（`IR`）计划、流程和团队，以及相应的技术、技能和培训，以做出适当的响应。强大的事件响应流程不仅仅是一次性行动，也不仅仅是在紧急情况下才应用。相反，`IR`\
  \ 是一个持续的过程，它利用从每次安全事件中获得的经验教训来提高组织安全性。\n\n#### 事件响应流程\n\n大多数组织迈向成熟事件响应能力的第一步是了解事件响应流程以及每个阶段会发生什么。尽管组织使用的标签或步骤可能略有不同，步骤数量也可能不同，但基本概念保持不变。组织必须为事件做准备，在事件发生时识别事件，然后遏制并清除事件的痕迹。一旦事件被遏制，组织就可以着手恢复并恢复正常，然后确保从事件中吸取的教训融入到下一次事件发生时的准备工作中。\n\
  \n图 14.1 显示了 Security+ 考试大纲中描述的事件响应流程的六个步骤。\n\n![图 14.1 事件响应周期](img/c14f001.png)\n\
  \n**图 14.1** 事件响应周期\n\nSecurity+ 考试要求掌握的六个步骤如下：\n\n1. **准备。** 在此阶段，你需要构建响应事件所需的工具、流程和程序。这包括组建和培训事件响应团队、开展演练、记录响应计划和方法，以及获取、配置和操作安全工具及事件响应能力。\n\
  \n2. **识别。** 此阶段涉及审查事件以识别事故。你必须关注妥协指标，使用日志分析和安全监控能力，并为员工建立全面的感知和报告计划。\n\n3. **遏制。**\
  \ 一旦识别出事件，事件响应团队需要对其进行遏制，以防止进一步的问题或损害。遏制可能具有挑战性，如果在最初的识别工作中未识别出事件的某些要素，遏制可能就不彻底。\n\
  \n4. **根除。** 根除阶段涉及移除与事件相关的痕迹。在许多情况下，这将涉及从备份中重建或恢复系统和应用程序，而不仅仅是从系统中移除工具，因为证明系统已被彻底清理可能非常困难。彻底的根除和验证对于确保事件结束至关重要。\n\
  \n\n\n\n\n##### 5. 恢复\n\n恢复正常是恢复阶段的核心。这可能意味着将系统或服务重新上线，或采取其他作为恢复运营一部分的行动。恢复需要根除成功，但也涉及实施修复，以确保导致事件发生的任何安全弱点、缺陷或行为已得到补救，防止事件立即再次发生。\n\
  \n##### 6. 经验教训\n\n这些对于确保组织改进且不再犯同样的错误至关重要。它们可能像修补系统一样简单，也可能像需要重新设计权限结构和操作程序一样复杂。然后，经验教训被用于指导准备过程，循环周而复始。\n\
  \n尽管此列表可能使事件看起来总是按项目线性进行，但许多事件会随着额外发现的出现或恶意行为者采取额外行动，在各阶段之间来回移动。因此，你需要保持敏捷，并理解你可能并不处于你认为的那个阶段，或者在处理事件的组件时——甚至同时处理多个事件时——你可能需要同时在多个阶段中操作。\n\
  \n#### 为事件响应做准备\n\n在理解并定义组织的 IR 流程之后，下一步是确定谁将在组织的 IR 团队中，谁将负责 IR 流程，以及谁将领导 IR 团队。接下来，制定计划，然后通过演练来测试计划。\n\
  \n##### 事件响应团队\n\n建立 IR 团队涉及为团队寻找合适的成员。典型团队通常包括以下人员：\n\n*   一名管理层或组织领导层成员。该人员将负责为团队做决策，并充当组织通往高级管理层的主要渠道。理想情况下，团队应拥有资历足够深、能在紧急情况下为组织做决策的领导者。\n\
  *   信息安全员工很可能构成团队的核心，并将带来流程所需的专业 IR 和分析技能。由于遏制通常需要使用防火墙、入侵防御系统和其他安全工具等安全工具立即采取行动，信息安全团队还可以帮助加快\
  \ IR 流程。\n*   团队将需要技术专家，如系统管理员、开发人员或组织内各学科的其他人员。IR 团队的构成可能因事件性质而异，并非所有技术专家都会被卷入每一个事件。了解系统、软件和架构能在\
  \ IR 流程中产生巨大差异，熟悉度也有助于响应人员发现那些可能被不每天接触特定系统的人员遗漏的意外工件。\n*   沟通和公共关系员工对于确保内部和外部沟通得到妥善处理非常重要。不良沟通——甚至更糟，完全没有沟通——会使事件恶化或严重损害组织声誉。\n\
  *   法律和人力资源（HR）员工可能会参与部分但非所有事件。法律顾问可就法律问题、合同及类似事宜提供建议。如果员工涉入其中，特别是事件涉及内部人员或属于 HR\
  \ 相关调查时，可能需要 HR 介入。\n*   执法部门有时会被加入团队，但在大多数情况下，仅当特定问题或攻击需要他们介入时才会如此。\n\n无论组织团队的具体构成如何，你还需要确保团队成员接受过适当的培训。这可能意味着为安全专业人员和技术人员提供\
  \ IR 培训，也可能包括针对整个团队的演练和实践，以确保他们已准备好协同工作。\n\n##### 演练\n\n事件响应团队用于准备的演练主要有三种类型：\n\n\
  *   **桌面推演** 用于梳理流程。团队成员会获得一个场景，并被问及他们将如何响应、可能出现什么问题，以及为完成 IR 计划中分配给他们的任务需要做什么。桌面推演类似于头脑风暴会议，团队成员思考场景并记录其响应和整体\
  \ IR 计划的改进之处。\n*   **演练** 逐步引导团队经历一个事件。此演练有助于确保团队成员了解其角色以及 IR 流程，且响应所需的工具、访问权限和其他项目可用且可访问。演练是确保团队按预期响应的绝佳方式，且无需全面模拟的开销。\n\
  *   **模拟** 可包含多种类型的事件。演练可能模拟计划的单个功能或要素，或仅针对组织的特定部分。也可以全规模进行，让整个组织参与演练。重要的是以一种确保所有参与者都知道他们正在参与演练的方式来规划和执行模拟，以便在演练环境之外不采取任何行动。\n\
  \n##### 构建事件响应计划\n\n事件响应计划可包含多个子计划，以处理响应流程的各个阶段。你的组织可以选择将它们全部合并为一个大型文档，也可以将它们拆分，以便响应团队选择所需的组件。单个计划也可能由不同的团队管理或运行。\n\
  \n无论响应计划的结构如何，都需要定期审查和测试。一个过时的计划，或团队不熟悉的计划，其问题性不亚于完全没有计划。\n\n*   **沟通计划** 对事件响应流程至关重要。缺乏沟通、错误沟通或仅仅是不良沟通，都可能给组织及其开展业务的能力带来重大问题。同时，有问题的沟通也会使事件恶化，因为个人可能不知道发生了什么，或可能采取不当行动、流程。\n\
  \n\n\n\n\n#### 业务连续性、灾难恢复和 COOP\n\n*   **业务连续性 (BC) 计划**侧重于在发生不幸或事件时保持组织的功能正常运行。在\
  \ IR 流程的背景下，BC 计划可用于确保受事件影响的系统或服务能够继续运行，尽管 IR 流程可能需要进行更改。这可能涉及恢复或卸载服务的方法，或使用备用系统。业务连续性计划在较大事件中发挥着重要作用，而较小的事件可能不会以显著方式影响组织开展业务的能力。\n\
  \n*   **灾难恢复 (DR) 计划**定义了组织在灾难发生时将采取的流程和程序。与业务连续性计划不同，DR 计划侧重于可能摧毁设施、基础设施或以其他方式阻止组织正常运作的自然灾害和人为灾难。DR\
  \ 计划侧重于尽管发生灾难，仍能恢复或继续服务。\n\n除了这些类型的计划外，**运营连续性规划 (COOP)** 是美国联邦政府资助的一项计划，是国家连续性计划的一部分。COOP\
  \ 定义了政府机构需要满足的要求，以确保运营的连续性。这些要求包括：如何确保其基本职能、组织的继任顺序（以便员工知道谁将负责以及谁将执行必要职能）、如何授权委托、如何利用连续性设施进行灾难恢复，以及其他各种要求。COOP\
  \ 定义了联邦机构如何构建完整的灾难恢复和业务连续性计划。\n\n图 14.2 显示了联邦应急管理局 (FEMA) 定义的、作为 COOP 一部分的运营连续性的四个阶段。\n\
  \n#### 策略\n\n组织将策略定义为关于组织意图的正式声明。简而言之，它们解释了组织为何希望以特定方式运营，并定义了活动或计划的目的或目标等事项。**事件响应策略**通常作为构建\
  \ IR 能力的一部分而被定义。\n\n![图 14.2 联邦运营连续性规划阶段](img/c14f002.png)\n\n**图 14.2** 联邦运营连续性规划阶段\n\
  \n编写良好的事件响应策略将包含 IR 流程的重要组成部分。它们将明确团队及其运行所依据的授权。它们还将要求创建和维护事件处理和响应程序及实践，并可能定义组织使用的整体\
  \ IR 流程。在某些情况下，根据组织需求，它们还可能包含特定的沟通或合规要求。\n\nIR 策略并非组织为拥有完整的事件响应能力而依赖的唯一策略。事实上，组织通常拥有许多可能影响响应的\
  \ IT 策略。然而，Security+ 考试大纲重点关注一个特定的额外策略：**保留策略**。保留策略决定了你保留数据的时长以及如何处置数据。保留策略对事件响应人员很重要，因为它可能决定组织保留事件数据的时长、日志可用的时长，以及可能已保留哪些数据，因此如果系统或数据存储遭到入侵或泄露，哪些数据可能已暴露。\n\
  \n#### 攻击框架与识别攻击\n\n事件响应人员经常需要使用通用语言和术语来描述攻击和事件。攻击框架用于了解对手、记录技术并对战术进行分类。Security+\
  \ 考试大纲涵盖了三个主要框架：MITRE ATT&CK、钻石入侵分析模型和洛克希德·马丁的网络杀伤链。\n\n##### MITRE ATT&CK\n\nMITRE\
  \ 提供了 **ATT&CK**（Adversarial Tactics, Techniques, and Common Knowledge，对抗战术、技术和通用知识），即对手战术和技术的知识库。ATT&CK\
  \ 矩阵包含从初始访问到执行、持久化、权限提升和渗出的完整威胁生命周期的详细描述、定义和示例。在每一层级，它都列出了技术和组件，允许威胁评估建模利用通用的描述和知识。\n\
  \nATT&CK 矩阵包括攻击前矩阵、专注于 Windows、macOS、Linux 和云计算的企业矩阵，以及 iOS 和 Android 移动平台。它还包括缓解措施、威胁行为者组织、软件以及许多其他有用详情的详细信息。所有这些使\
  \ ATT&CK 成为本书作者所知的最全面的、免费可用的对手技术、战术和相关信息数据库。\n\n图 14.3 显示了一个 ATT&CK 技术定义的示例，针对通过元数据\
  \ API 对云实例的攻击。它提供了一个 ID 编号，以及分类详细信息，如战术、适用平台、所需用户权限、适用数据源、贡献者以及特定技术的修订级别。\n\nATT&CK\
  \ 框架是此处讨论的三种模型中最流行的，并在各种安全工具中得到了广泛支持，这意味着分析师最有可能在其组织中发现与 ATT&CK 相关的概念、标签和工具。您可以在\
  \ `attack.mitre.org` 找到完整的 ATT&CK 网站。\n\n##### 钻石入侵分析模型\n\n**钻石入侵分析模型**描述了一个序列：对手部署一种针对基础设施的能力，以攻击受害者。在该模型中，活动被称为事件，分析师在检测或发现事件时对顶点进行标记。该模型旨在通过沿着事件之间的边遵循关系，突出元素之间的关系，帮助分析师发现更多信息。\n\
  \n![图 14.3 MITRE 的 ATT&CK 框架针对云实例攻击的示例](img/c14f003.png)\n\n**图 14.3** MITRE 的 ATT&CK\
  \ 框架针对云实例攻击的示例\n\n钻石模型（图 14.4）使用许多特定术语：\n\n*   事件的**核心特征**，即对手、能力、基础设施和受害者（菱形的顶点）\n\
  *   **元特征**，即开始和结束时间戳、阶段、结果、方向、方法论和资源，用于按称为活动线程的序列对事件进行排序，以及根据其特征对事件进行分组\n*   **置信度值**，模型未对其定义，但分析师需根据自身工作确定\n\
  \n![图 14.4 钻石入侵分析模型](img/c14f004.png)\n\n**图 14.4** 钻石入侵分析模型\n\n钻石模型高度侧重于了解攻击者及其动机，然后利用这些元素之间的关系，使防御者既能理解威胁，又能思考可能需要获取或可能已拥有的其他数据或信息。\n\
  \n##### 网络杀伤链\n\n洛克希德·马丁的**网络杀伤链**是一个七步流程，如图 14.5 所示。\n\n![图 14.5 网络杀伤链](img/c14f005.png)\n\
  \n**图 14.5** 网络杀伤链\n\n以下是网络杀伤链的七个阶段：\n\n\n\n\n###### 网络攻击链阶段\n\n####### 侦察\n此阶段用于识别目标。攻击者正在规划攻击，并将收集关于目标的情报，包括开源情报以及通过扫描直接获取的目标数据。防御者必须收集关于侦察活动的数据，并根据该信息确定防御优先级。\n\
  \n####### 武器化\n此阶段涉及构建或以其他方式获取 `weaponizer`（武器化工具），它将恶意软件和漏洞利用组合成可投递给目标的载荷。这可能需要创建诱饵文档、选择合适的命令与控制（`C2`）工具以及处理其他细节。该模型强调了这样一个事实：防御者需要在此阶段进行完整的恶意软件分析，不仅要了解投放了什么载荷，还要了解武器化漏洞利用是如何制作的。防御者还应为武器化工具构建检测规则，查看恶意软件创建时间与使用时间的时间线对比，并收集文件和元数据，以帮助判断这些工具是广泛共享的，还是严格保密的，从而可能具有高度针对性。\n\
  \n####### 投递\n当攻击者直接针对目标部署工具，或通过依赖目标员工与其交互的方式发布工具（如电子邮件载荷、USB 存储棒，或通过他们访问的网站）时，即发生此阶段。此阶段的防御者必须观察攻击是如何投递的以及针对什么目标，然后推断攻击者意图达成的目的。日志保留至关重要，因为它有助于确定发生了什么，并协助攻击分析。\n\
  \n####### 利用\n此阶段利用软件、硬件或人为漏洞获取访问权限。它可能涉及零日漏洞利用，并可能使用攻击者触发的漏洞利用或受害者触发的漏洞利用。针对此阶段的防御侧重于用户意识、安全编码、漏洞扫描、渗透测试、端点加固以及类似活动，以确保组织拥有强大的安全态势和极小的攻击面。\n\
  \n####### 安装\n此阶段专注于为攻击者建立持久化后门访问。防御者必须监控持久化远程 Shell 或其他远程访问方法的典型工件。\n\n#######\
  \ 命令与控制（C2）\n`C2` 访问允许双向通信和对远程系统的持续控制。防御者将通过加固网络、部署检测能力以及进行持续研究，来寻求检测 `C2` 基础设施，以确保他们了解新的\
  \ `C2` 模型和技术。\n\n####### 目标行动\n当任务目标达成时，将发生最后阶段。攻击者将收集凭证、提升权限、在环境中横向移动和转移，并收集和窃取信息。他们还可能对系统或数据造成破坏。防御者必须建立事件响应剧本，检测攻击者的行动并捕获相关数据，响应警报，并评估攻击者造成的损害。\n\
  \n#### 事件响应数据与工具\n\n事件响应人员依赖各类数据开展工作。作为安全专业人员，你需要了解可能需要哪些类型的数据来进行调查，并确定发生了什么以及如何防止再次发生。\n\
  \n##### 安全信息与事件管理系统\n\n在许多组织中，核心安全监控工具是 `安全信息与事件管理 (SIEM)` 工具。`SIEM` 设备和软件具有广泛的安全功能，这些功能通常基于从多种来源收集和聚合日志数据的能力，然后利用这些数据执行关联和分析活动。这意味着组织会将数据输入（包括来自系统、网络安全设备、网络基础设施和许多其他来源的日志及其他有用信息）发送到\
  \ `SIEM` 进行摄取，与其拥有的其他数据进行比较，然后对数据应用规则、分析技术以及机器学习或人工智能。`SIEM` 系统可能包括审查和警报用户行为的能力，或执行情感分析，这是一个利用自然语言处理和其他文本分析工具查看文本以从文本数据中确定情绪的过程。\n\
  \n`SIEM` 设备的另一个数据输入是数据包捕获。从网络流量中捕获和分析原始数据包数据，或从其他数据源接收数据包捕获，对于事件分析非常有用，特别是在需要关于网络事件的具体信息时。将原始数据包数据与\
  \ `IDS` 或 `IPS` 事件、防火墙和 `WAF` 日志以及其他安全事件相关联，为安全从业者提供了一个强大的工具。\n\n`SIEM` 设备还提供警报、报告和响应功能，使组织能够了解何时需要处理问题，并跟踪该问题在其生命周期内的响应情况。这可能包括取证能力，也可能更侧重于工单和工作流流程来处理问题和事件。\n\
  \n###### SIEM 仪表板\n\n许多安全从业者看到的 `SIEM` 的第一部分是仪表板，如图 14.6 所示的 AlienVault `SIEM` 仪表板。仪表板可配置为显示组织或个人分析师认为最有用和最关键的信息，并且可以配置多个仪表板以显示特定视图和信息。仪表板的关键在于理解它们提供了所包含信息的高层级可视化表示。这有助于安全分析师快速识别潜在问题、异常模式和可能感兴趣或令人担忧的新趋势。\n\
  \n![图 14.6 AlienVault SIEM 默认仪表板](img/c14f006.png)\n\n**图 14.6** AlienVault SIEM\
  \ 默认仪表板\n\n`SIEM` 仪表板有许多重要组件，提供其显示的各个要素。这些包括收集并发送信息到 `SIEM` 的传感器、趋势和警报功能、关联引擎和规则，以及设置灵敏度和级别的方法。\n\
  \n### 传感器\n\n尽管设备可以直接将数据发送到 `SIEM`，但通常会部署传感器来收集额外数据。传感器通常是软件代理，尽管它们也可以是虚拟机甚至专用设备。传感器通常部署在云基础设施、远程数据中心或其他产生大量独特数据的环境中，或者现有能力无法满足数据获取需求、需要专用设备的位置。传感器为\
  \ `SIEM` 收集有用数据，并可能按原始形式转发，或在 `SIEM` 摄取前进行一些预处理以优化数据。选择传感器部署位置是网络和安全架构及设计工作的一部分，传感器必须像其他网络安全组件一样得到保护，防止遭受攻击和妥协。\n\
  \n###### 灵敏度与阈值\n\n组织可以产生海量数据，安全数据也不例外。分析师需要了解如何控制和限制 `SIEM` 产生的警报。为此，他们设置阈值、过滤规则，并使用其他管理\
  \ `SIEM` 灵敏度的方法。警报可设置为仅在事件发生特定次数时触发，或仅在影响特定高价值系统时触发。或者，警报可设置为仅触发一次，而不是成百上千次。无论您的\
  \ `SIEM` 如何处理灵敏度和阈值，配置和管理它们以确保仅在需要警报的项目上发送警报，有助于避免警报疲劳和误报。\n\n### 趋势\n\n\n\n查看趋势信息的能力是\
  \ SIEM 平台功能中极具价值的一部分。趋势可以指向一个开始出现的新问题、正在发生并蔓延的漏洞利用，或者仅仅是你组织中最流行的恶意软件是什么。在图 14.7\
  \ 中，你可以看到一个对恶意软件活动进行分类的示例，识别出检测频率最高的签名、最流行的恶意软件家族，以及其发送流量的去向。这有助于组织在新威胁浮出水面时识别它们。\n\
  \n![FIGURE 14.7 Trend analysis via a SIEM dashboard](img/c14f007.png)\n\n**图 14.7**\
  \ 通过 SIEM 仪表板进行趋势分析\n\n###### 警报和告警\n\n警报和告警是 SIEM 系统的重要组成部分。图 14.8 展示了 AlienVault\
  \ 演示系统的一个示例。请注意，告警按其时间和严重性进行分类，随后提供可深入探究的详细信息。恶意软件信标和感染等事件会被自动分类、确定优先级、标记源和目的地，并根据需要匹配给分析师进行调查。它们还显示诸如哪个传感器正在报告问题之类的信息。\n\
  \n![FIGURE 14.8 Alerts and alarms in the AlienVault SIEM](img/c14f008.png)\n\n**图\
  \ 14.8** AlienVault SIEM 中的警报和告警\n\n###### 关联与分析\n\n在调查事件时，单个数据点可能很有用，但将数据点与其他数据点进行匹配是大多数调查的关键部分。关联需要拥有诸如事件发生的时间、发生在什么系统上、涉及哪些用户账户以及其他有助于分析过程的详细信息等数据。SIEM\
  \ 允许你基于这些多个数据点搜索和过滤数据，以缩小与事件相关的信息范围。自动化关联与分析旨在匹配已知事件和妥指标（IOC），以构建一个完整的数据集供事件或事故审查和分析。正如你在\
  \ AlienVault SIEM 的屏幕截图中所见，你可以为数据添加标签和调查。尽管每个 SIEM 工具可能用略微不同的术语来称呼这些功能，但基本概念和能力保持不变。\n\
  \n###### 规则\n\nSIEM 的告警、警报和关联引擎的核心是驱动这些组件的规则集。图 14.9 展示了一个如何利用 SIEM 收集的信息构建告警规则的示例。规则条件可以使用逻辑来确定规则是否以及何时被激活，随后可基于规则触发动作。结果可能只是简单的警报，也可能是复杂的程序化动作，例如更改基础设施、启用或禁用防火墙规则，或触发其他防御措施。\n\
  \n![FIGURE 14.9 Rule configuration in AlienVault](img/c14f009.png)\n\n**图 14.9**\
  \ AlienVault 中的规则配置\n\n规则很重要，但也可能引发问题。构建不当的规则逻辑可能导致漏报事件，或造成误报或过于宽泛的检测。如果规则包含主动响应组件，错误触发的规则可能导致中断或其他基础设施问题。因此，规则需要被仔细构建、测试，并定期审查。虽然\
  \ SIEM 厂商通常提供默认规则和检测能力，但组织为其环境和系统设计的自定义规则是成功部署 SIEM 的关键。\n\n最后，SIEM 设备还遵循数据的整个生命周期。这意味着大多数都具备为每种数据类型设置保留期和数据生命周期的能力，并支持合规性要求。事实上，大多数\
  \ SIEM 设备都有预构建的规则或模块，旨在根据所需标准满足特定的合规性要求。\n\n####### 日志文件\n\n日志文件为事件响应人员提供有关已发生事件的信息。当然，这也使得日志文件成为攻击者的目标，因此事件响应人员需要确保他们使用的日志未被篡改，并且其中的时间戳和其他数据是正确的。一旦你确信正在处理的数据是可靠的，日志就能提供大量与事件相关的宝贵信息。\n\
  \n图 14.10 展示了 Windows 事件查看器，这是查看单个 Windows 系统日志最常用的方式之一。在许多企业环境中，特定日志或关键日志条目会被发送到安全的日志基础设施，以确保存在终端系统收集日志的可信副本。安全从业人员仍会审查本地日志，特别是因为组织中各终端的日志数据量巨大，通常不会为每个系统维护所有日志的完整副本。\n\
  \n![FIGURE 14.10 The Windows Event Viewer showing a security log with an audit event](img/c14f010.png)\n\
  \n**图 14.10** Windows 事件查看器显示包含审核事件的安全日志\n\nSecurity+ 考试大纲涵盖的事件响应人员常用的日志包括以下内容：\n\
  \n*   **系统日志**包括从服务更改到权限问题的所有内容。Windows 系统日志记录系统运行时生成的信息。\n*   **应用程序日志**在 Windows\
  \ 中包含应用程序的安装程序信息、应用程序生成的错误、许可证检查，以及应用程序生成并发送到应用程序日志的任何其他日志。\n*   **安全日志**在 Windows\
  \ 系统中存储有关登录失败和成功的信息，以及其他身份验证日志信息。Linux 系统的身份验证和安全日志存储在 `/var/log/auth.log` 和 `/var/log/secure`\
  \ 中。\n*   **漏洞扫描输出**是另一种可纳入事件分析活动的数据形式。扫描可提供关于攻击者可能瞄准的目标、服务变更，甚至攻击者在身后封堵漏洞导致的突然修补问题的线索。\n\
  *   **网络和安全设备日志**可包括路由器和交换机的配置更改、流量信息、网络流量，以及 **数据包分析器**（如 Wireshark）捕获的数据。\n* \
  \  **Web 日志**，如来自 Apache 和 Internet Information Services (IIS) 的日志，记录对 Web 服务器的请求及相关事件。这些日志有助于追踪访问了什么、何时访问的，以及发送请求的\
  \ IP 地址。由于请求会被记录，这些日志还有助于识别攻击，包括 SQL 注入和其他针对 Web 服务器和 Web 应用程序的特定攻击。\n*   **DNS\
  \ 日志**提供关于 DNS 查询的详细信息。这看似用处不大，但 DNS 日志可以显示攻击者收集信息的行为，根据系统的 DNS 请求提供哪些系统可能已被入侵的信息，并显示内部用户是否滥用组织资源。\n\
  *   **身份验证日志**可用于确定账户何时被登录，还可能显示权限使用、登录系统或位置、错误密码尝试，以及可关联到入侵和滥用的其他登录和使用详情。\n*  \
  \ **转储文件**，如 Windows 出现蓝屏死机时创建的内存转储，看似对事件响应没什么用处，但它们可能包含显示崩溃时内存和系统状态的信息。如果崩溃是由攻击者或漏洞利用导致的，或者系统上存在恶意软件或攻击工具，转储文件可能包含这些工件。\n\
  \n\n\nVoIP（IP 语音）、呼叫管理器日志以及会话发起协议（SIP）日志可以提供关于已拨打电话以及 VoIP 系统上其他事件的信息。\n\n安全从业人员将使用\
  \ SIEM 工具以及 `grep` 和 `tail` 等手动搜索工具来审查日志，查找可能与事件相关的特定日志条目。重要的 Windows 事件 ID 列表通常易于获取，许多\
  \ Linux 日志条目也可以通过其包含的文本轻松识别。\n\n###### 日志记录协议和工具\n\n除了知道如何查找和搜索日志外，您还需要知道日志如何发送到远程系统、使用哪些工具来收集和管理日志，以及如何获取日志。\n\
  \n传统的 Linux 日志通过 `syslog` 发送，客户端将消息发送给收集和存储日志的服务器。随着时间的推移，创建了其他 `syslog` 替代品以改进\
  \ `syslog` 的基本功能和能力。当需要速度时，用于日志处理的高速系统 `rsyslog` 是一个选择。它支持极高的消息速率、通过 TLS 进行安全日志记录、基于\
  \ TCP 的消息以及多种后端数据库选项。另一种替代方案是 `syslog-ng`，它提供增强的过滤功能、直接记录到数据库，并支持通过受 TLS 保护的 TCP\
  \ 发送日志。`rsyslog` 和 `syslog-ng` 等 `syslog` 替代品的增强功能意味着许多组织用这些选项之一替换其 `syslog` 基础设施。日志收集的最后一个选项是\
  \ NXLog，这是一个开源且商业支持的 `syslog` 集中化和聚合工具，可以解析和生成多种常见格式的日志文件，同时将日志发送到分析工具和 SIEM 解决方案。\n\
  \n无论您使用哪种日志记录系统，都必须在本地系统和中央日志记录及监控基础设施上做出关于保留的决策。要考虑运营需求；可能需要您收集的日志的可能场景；以及您需要满足的法律、合规性或其他要求。在许多情况下，组织选择根据其需求保留日志\
  \ 30、45、90 或 180 天，但某些情况甚至可能导致某些日志被保留一年或更长时间。保留伴随着硬件成本，如果您保留了可能不希望在法庭上披露的日志，还会面临潜在的法律挑战。\n\
  \n###### 超越日志：使用元数据\n\n日志条目并不是系统包含的唯一有用数据。作为系统操作、通信和其他活动正常组一部分生成的元数据也可用于事件响应。元数据是关于其他数据的数据——在系统和服务的情况下，元数据作为文件的一部分创建、嵌入在文档中、用于定义结构化数据，并包含在事务和网络通信中，以及您可以找到它的许多其他地方。\n\
  \nSecurity+ 考试大纲重点关注四种类型的元数据，但元数据分析背后的技术在许多情况下也可用于其他数据类型。您需要为考试考虑的四种元数据类型如下：\n\n\
  *   **电子邮件元数据**包括电子邮件中发现的标头和其他信息。电子邮件标头提供关于发件人、收件人、消息发送的日期和时间、电子邮件是否有附件、电子邮件经过哪些系统以及系统可能添加的其他标头标记的详细信息，包括反垃圾邮件和其他信息。\n\
  *   **移动设备元数据**是在手机和其他移动设备使用时收集的。它可以包括通话记录、短信和其他消息数据、数据使用情况、GPS 位置跟踪、基站信息以及通话详单中发现的其他详细信息。移动设备元数据非常强大，因为它记录了关于手机在一天中任何时间点所在位置的大量地理空间信息。\n\
  *   **Web 元数据**作为网站代码的一部分嵌入到网站中，但通常对普通用户不可见。它可以包括元标签、标头、Cookie 和其他信息，这些信息有助于搜索引擎优化、网站功能、广告和跟踪，或可能支持特定功能。\n\
  *   **文件元数据**在审查文件创建时间、创建方式、是否以及何时被修改、由谁修改、创建设备的 GPS 位置以及许多其他细节时，可以成为强大的工具。以下代码显示了使用\
  \ ExifTool (`exiftool.org`) 从单张照片中恢复的选定元数据。输出显示该照片是用数码相机拍摄的，相机插入了诸如拍摄日期、拍摄相机的具体型号、相机设置甚至固件版本等元数据。如果移动设备未设置从照片中移除该信息，它们也可能包含照片的\
  \ GPS 位置，从而导致更多信息泄露。\n\n```\nFile Size                    : 2.0 MB\nFile Modification\
  \ Date/Time  : 2009:11:28 14:36:02-05:00\nMake                         : Canon\n\
  Camera Model Name            : Canon PowerShot A610\nOrientation               \
  \   : Horizontal (normal)\nX Resolution                 : 180\nY Resolution    \
  \             : 180\nResolution Unit              : inches\nModify Date        \
  \          : 2009:08:22 14:52:16\nExposure Time                : 1/400\nF Number\
  \                     : 4.0\nDate/Time Original           : 2009:08:22 14:52:16\n\
  Create Date                  : 2009:08:22 14:52:16\nFlash                      \
  \  : Off, Did not fire\nCanon Firmware Version       : Firmware Version 1.00\n```\n\
  \n元数据通常用于取证和其他调查，大多数取证工具都具有内置的元数据查看功能。\n\n#### 缓解和恢复\n\n活动事件可能会在整个组织中造成中断。组织必须采取行动缓解事件，然后努力从中恢复，而不产生新的风险或漏洞。同时，组织可能希望保留事件数据和工件，以允许内部响应人员或执法部门进行取证分析。\n\
  \n##### 剧本\n\n剧本是旨在帮助事件响应团队在给定场景中采取正确行动的分步指南。组织为他们认为可能处理的每种事件或事件类型构建剧本，示例范围从高级持续性威胁到网络钓鱼攻击。剧本通常在事件响应周期的每个阶段都有阶段和步骤，以及一组关于何时激活剧本以及谁应该参与运行剧本的指南。\n\
  \n恶意软件感染识别阶段的剧本可能包括使用反恶意软件和防病毒软件、数据包捕获和网络流量分析来识别妥指标，然后是包含该阶段步骤的遏制阶段的前进路径。\n\n剧本考虑了行业最佳实践、组织策略、法律、法规和合规要求，以及组织结构和人员配置。它们还定义了何时完成，使组织能够恢复正常运营。\n\
  \n一套针对您的组织最可能遇到的事件类型编写良好、经过测试的剧本，是确保在压力情况下做出适当响应的最佳方法之一。能够参考经过深思熟虑和细心创建的步骤和流程，可以极大地改善事件响应流程的质量。\n\
  \n###### 运行手册\n\n\n\n\n###### 运行手册\n\n*运行手册* 是组织用于执行操作的操作程序指南。由于它们是程序指南，运行手册简化了可能支持事件响应的常见操作的决策过程，并且可以帮助指导和构建通信、恶意软件清除或扫描等任务的自动化。运行手册通常以行动为导向，因此可能会作为剧本流程的要素与剧本配对使用。\n\
  \n##### 安全编排、自动化与响应 (SOAR)\n\n管理多种安全技术可能具有挑战性，而利用这些平台和系统的信息来确定组织的安全态势和状态，需要整合不同的数据源。同时，管理安全运营并修复已识别的问题也是安全工作的重要组成部分。SOAR\
  \ 平台旨在满足这些需求。\n\n作为一种缓解和恢复工具，SOAR 平台允许您快速评估组织的攻击面、系统状态以及可能存在问题的位置。它们还允许自动化修复和恢复工作流。\n\
  \n##### 遏制、缓解和恢复技术\n\n在许多情况下，首要的缓解技术之一将是快速阻断受影响系统或设备上的事件起因。这意味着您可能需要重新配置端点安全解决方案：\n\
  \n*   **应用程序允许列表**（有时称为白名单），列出了允许存在于系统上的应用程序和文件，并阻止列表中没有的任何内容被安装或运行。\n*   **应用程序拒绝列表**\
  \ 或 **阻止列表**（有时称为黑名单），列出了不允许存在于系统上的应用程序或文件，并将阻止它们被安装或复制到系统上。\n*   **隔离解决方案**，可将文件放置在特定的安全区域。反恶意软件和防病毒软件通常提供将可疑或受感染文件隔离而非删除的选项，这有助于调查。\n\
  \n配置更改也是常见的修复和遏制手段。它们可能是解决导致事件发生的安全漏洞所必需的，或者可能需要隔离系统或网络。事实上，配置更改是遏制和修复工作中最常用的工具之一。它们需要被仔细跟踪和记录，因为响应人员仍可能犯错，并且在事件响应流程结束后，可能需要回滚更改以恢复正常功能。您为\
  \ Security+ 考试应考虑的具体配置更改如下：\n\n*   **防火墙规则更改**，无论是添加新防火墙规则、修改现有防火墙规则，还是在某些情况下删除防火墙规则。\n\
  *   **移动设备管理 (MDM) 更改**，包括应用新策略或更改策略；通过远程擦除设备进行响应；定位设备；或使用其他 MDM 功能协助 IR 流程。\n*\
  \   **数据丢失防护 (DLP) 工具更改**，可能侧重于防止数据离开组织，或检测新类型或分类的数据被发送或共享。在大多数 IR 流程中，DLP 更改可能是被动的，但\
  \ DLP 可用于帮助确保正在进行的事件有较低的几率造成更多的数据泄露。\n*   **内容过滤和 URL 过滤功能**，可用于确保无法浏览或访问特定站点。内容过滤和\
  \ URL 过滤有助于防止恶意软件“回连”或连接到 C2 站点，也可以防止用户响应网络钓鱼攻击和类似威胁。\n*   **更新或吊销证书**，如果证书遭到泄露，特别是攻击者访问了证书的私钥，则可能需要执行此操作。同时，从信任列表中移除证书也可以是一个有用的工具，特别是当上游服务提供商响应不及时，且其服务或系统存在安全顾虑时。\n\
  \n当然，还有许多其他您可能需要进行的配置更改。当您面临事件响应场景时，应考虑被攻击的目标是什么；是如何被攻击的；影响是什么；以及您可以应用哪些控制、配置更改和工具来首先遏制，然后修复问题。重要的是要记住您正在考虑的更改可能导致的运营影响和额外风险，并确保相关方知晓这些更改或参与决策，具体取决于情况的紧急程度。\n\
  \n有时，可能还需要采取更广泛的行动。可能需要移除系统、设备，甚至整个网络段或区域，以阻止事件进一步扩散，或者当无法快速识别事件源头时。以下技术支持此类活动：\n\
  \n*   **隔离** 将系统移至受保护的空间或网络，使其远离其他系统。隔离可以像将系统从网络中移除一样简单，也可以像将其移至隔离 VLAN 一样技术复杂，或者在虚拟机或云基础设施的情况下，可能需要将系统移至具有安全规则的环境中，在允许检查和调查的同时保持其隔离状态。\n\
  *   **遏制** 将系统保留在原地，但致力于防止进一步的恶意行为或攻击。网络层面的遏制通常通过防火墙规则或类似功能来实现，以限制系统可以发送或接收的流量。系统和应用层面的遏制如果不关闭系统或干扰系统的功能和状态，可能会更加困难，这会影响取证数据。因此，您关于遏制行动的决定可能会影响未来的调查工作。事件响应人员的目标可能与取证分析师不同，组织在某些情况下可能不得不在快速响应和取证数据之间做出快速抉择，判断哪个更重要。\n\
  *   **分段** 通常在事件发生前就已实施，旨在将具有不同功能或数据安全级别的系统放置在网络的不同区域或段中。分段也可以在虚拟和云环境中完成。从本质上讲，分段是利用安全、网络或物理机器边界在环境、系统、网络或其他组件之间建立分离的过程。事件响应人员可以选择将分段技术作为响应流程的一部分，以移动系统组或服务，从而专注于其他区域。您可以选择将受感染系统与网络其余部分分段隔离，或将关键系统移至受保护程度更高的段中，以帮助在活跃事件期间保护它们。\n\
  \n### 总结\n\n每个组织最终都会经历安全事件，制定可靠的事件响应计划并拥有一支清楚自己职责的团队，对于妥善处理事件至关重要。事件响应通常遵循一个包含准备、识别、遏制、根除、恢复和经验教训阶段的响应周期。虽然事件响应可能涉及所有这些阶段，但它们并不总是作为截然不同的元素来执行，根据相关事件的状态，组织和\
  \ IR 团队可能同时处于多个阶段。\n\n\n\n\n\n### 事件响应准备\n\n事件响应准备包括组建团队、制定政策和程序、开展演练，以及构建将支持事件响应需求的技术和信息收集基础设施。事件响应计划并非孤立存在。相反，它们伴随着沟通和利益相关者管理计划、业务连续性和灾难恢复计划，以及每个组织特有的其他详细响应流程。\n\
  \n### 攻击框架\n\n响应人员需要一种方式来谈论事件、攻击者、工具和技术。这就是攻击框架发挥作用的地方。**MITRE ATT&CK 框架**是一个非常完整的对手战术和技术知识库，并在信息安全领域的工具和系统中得到了广泛支持。**钻石入侵分析模型**是一个更简单的工具，它映射到菱形的四个顶点，允许分析师从一点移动到另一点，考虑他们已知和需要了解的要素。最后一个选项是**网络攻击链**，这是一个基于工具和技术的模型，有助于分析攻击如何发生并被利用。\n\
  \n### SIEM 和数据源\n\n许多组织事件响应计划中的关键组件是**安全信息和事件管理 (SIEM)** 工具。**SIEM** 工具集中化信息收集和分析，并提供仪表板和报告，使事件信息能够通过可视化、报告和手动分析以及自动化分析功能被查看和快速识别。它们配合使用\
  \ `syslog`、`syslog-ng` 或其他收集和集中日志的工具来构建日志基础设施，从而捕获用于事件分析的关键信息。同时，网络流量和流信息、文件和系统元数据以及其他工件也被需要分析系统或网络上发生了什么的响应人员所使用。\n\
  \n### 缓解与控制\n\n一旦事件被识别，响应人员必须对其进行缓解和控制。这涉及更改系统、设备和软件配置，以防止进一步问题并阻止事件。防火墙更改、使用 **MDM**\
  \ 和 **DLP** 等安全工具、应用程序允许列表和阻止列表或拒绝列表，以及其他技术可用于在事件初期就将其遏制。这些更改可以包含在运行手册和剧本中，这些手册记录了组织采取的行动，以及在行动前、中、后将遵循的选择和流程。\n\
  \n### 考试要点\n\n#### 事件响应周期与流程\n\n**事件响应周期和事件响应流程概述了如何响应事件。** Security+ 考试的事件响应周期包括准备、识别、遏制、根除、恢复和经验教训。响应流程可能不会一次只处于单一阶段，并且根据发现和进一步事件，阶段可能会前进或后退。事件响应团队由员工组成，包括管理层、安全人员、技术专家、沟通和公共关系人员，在某些情况下也可能包括法律、人力资源和执法人员。组织会举办桌面演练、演练走查和模拟演练等演习，让他们的团队练习事件响应。\n\
  \n#### 事件响应规划\n\n**规划对成功的事件响应至关重要。** 组织制定事件响应计划，以确保他们在事件发生期间知道该做什么，而不是在事件发生时才临时想办法。计划可能包括业务连续性计划，以确保业务能够继续运营，以及灾难恢复计划，以解决组织如何从重大灾难中恢复。沟通计划概述了谁需要接收沟通、谁将进行沟通以及何时进行沟通，确保关键沟通不被忽视。最后，**运营连续性规划\
  \ (COOP)** 由美国政府实施，以确保机构拥有详细计划，在发生中断或事件时继续运营。\n\n#### 用于分析的攻击框架\n\n**攻击框架帮助分析师识别和分类攻击。**\
  \ 攻击框架是可用于对攻击、攻击技术、流程和工具进行分类的工具。**MITRE ATT&CK 框架**将攻击分解为矩阵，这些矩阵映射到包含技术和组件的完整攻击生命周期。**钻石入侵分析模型**使用核心特征、元特征和置信度值，通过在菱形顶点之间移动来帮助分析师理解入侵。**网络攻击链**是一个七步流程，从侦察、武器化、投递、利用、安装、命令与控制，到目标行动，专注于攻击和漏洞利用。\n\
  \n#### 数据源与管理\n\n**用于事件响应的数据源和数据管理提供了对发生了什么的洞察，以及调查和检测工具。** 许多组织使用**安全事件和信息管理 (SIEM)**\
  \ 工具，通过仪表板、自动化分析和手动调查功能来收集和分析数据。漏洞扫描输出、系统配置数据、系统和设备日志以及其他组织数据等信息被摄入并分析，以提供对事件和事故的广泛洞察。`rsyslog`、`syslog-ng`、`syslog`\
  \ 和 `NXLog` 等日志工具都是日志基础设施中常见的工具，用于集中和管理日志。网络流量信息通过 `NetFlow`、`SFlow` 和数据包分析器等工具收集。它们提供关于带宽使用情况的有用信息，以及哪些系统进行了通信、使用的端口和协议、时间和日期，以及其他对事件分析有用的高层信息。除了日志和事件信息外，来自文件和其他位置的元数据也常用于事件调查和事件响应。\n\
  \n#### 缓解技术\n\n**缓解技术确保将事件的影响限制在最小范围内。** 事件响应人员使用各种技术来缓解和遏制事件。最常见的任务之一是更改端点安全解决方案以及设备的配置。这可能包括使用允许列表或阻止/拒绝列表、隔离文件或设备、进行防火墙更改、使用\
  \ **MDM** 或 **DLP** 工具、添加内容或 URL 过滤规则，或吊销或更新证书。在网络和基础设施层面，隔离、遏制和分段都被用来将涉及事件的系统与其他系统或网络分离开。**安全编排、自动化和响应\
  \ (SOAR)** 工具可用于管理和监控这些流程，并实现响应流程的自动化。\n\n### 复习题\n\n1.  下图显示了 Security+ 事件响应周期。缺少哪个项目？\n\
  \n    1.  规划\n    2.  报告\n    3.  监控\n    4.  准备\n\n    ![](img/c14uf002.png)\n\n\
  2.  Michael 希望直接记录日志到数据库，同时使用 TCP 和 TLS 来保护他的日志信息并确保其被接收。他应该使用什么工具？\n\n    1.  `syslog`\n\
  \    2.  `rsyslog`\n    3.  `syslog-ng`\n    4.  `journalctl`\n\n3.  哪个工具专门设计用于支持事件响应人员，允许跨组织进行统一的自动化响应？\n\
  \n    1.  IPS\n    2.  COOP\n    3.  SOAR\n    4.  IRC\n\n4.  Selah 正在遵循网络攻击链模型，并已完成投递阶段。根据攻击链，下一步是什么？\n\
  \n    1.  武器化\n    2.  利用\n    3.  安装\n    4.  目标行动\n\n5.  在大型繁忙网络中，SFlow 的主要顾虑是什么？\n\
  \n    1.  它可能允许针对收集器主机的缓冲区溢出攻击。\n    2.  SFlow 不适用于大型或复杂的网络。\n    3.  SFlow 给流收集器主机带来极大负载。\n\
  \n\n\n\n\n### 第 15 章：数字取证\n\n数字取证为组织提供了调查和分析工具及技术，以确定系统或设备上发生了什么。数字取证可能用于响应法律保全和电子取证要求、支持内部调查，或作为事件响应流程的一部分。数字取证在情报和反情报工作中甚至也发挥着作用。\n\
  \n在本章中，您将首先了解驱动取证工作的因素、提供高质量取证数据所需做的工作，以及云环境给这些流程带来的一些挑战。首先，您将了解法律保全、对方律师发出的保存和保留数据的通知，以及它们在电子取证流程中的作用。了解了一些您可能需要取证能力的原因后，您将探索取证数据获取，包括易失性顺序，它标识了面临最大丢失风险的取证工件，因此也确定了需要优先获取的要素。接下来，您将阅读如何确保获取的数据可在法庭上被采纳并作为有用证据，以及必须具备哪些工具和协议来处理从云服务提供商获取取证数据的需求。\n\
  \n本章的后半部分重点介绍取证工具，包括获取工具，如 `dd`、`FTK Imager` 和 `WinHex`。您将探索基本命令和实践，了解验证的重要性以及如何手动执行镜像验证。掌握镜像制作后，取证套件及关键取证套件功能是下一个主题，重点介绍\
  \ `Autopsy`，一款开源取证套件。最后，您将回顾取证报告需要包含的内容，以及取证在情报和反情报活动中所扮演角色的详细信息。\n\n### 数字取证概念\n\
  \n组织使用数字取证技术执行的任务范围广泛，从响应法律案件到进行内部调查和支持事件响应流程。作为安全专业人员，您需要了解数字取证背后的基本概念；数字取证的能力；以及组织为建立数字取证能力而采用的工具、流程和程序。\n\
  \n数字取证的一个关键要素是数字取证数据的获取和分析。这些数据可以是驱动器、文件、实时内存副本，以及我们在正常使用计算机和网络过程中创建的其他众多数字工件的形式。由于取证信息可能存在于许多不同的地方，规划取证信息收集对于拥有完整、完整的事件全貌至关重要。收集这些取证数据只是一个涉及仔细记录和详细分析的流程的开始。\n\
  \n在整个过程中，创建文档——包括您观察到的内容、从数据中得出的结论以及支持这些结论的证据——对于取得成功是必要的。您将记录时间线和事件序列，寻找关于发生了什么以及为什么发生的线索，并将使用时间戳、文件元数据、事件日志和大量线索来拼凑出一幅完整的图景。\n\
  \n## 练习题\n\n### 4. SFlow 仅对网络流量进行采样，这意味着部分细节将会丢失。\n\n### 6. Mark 拔掉了作为事件一部分的系统的网络连接，并在其以太网端口上贴上胶带，贴上一张写着“未经\
  \ IR 团队批准，请勿重新连接”的标签。如何最好地描述这种方法？\n\n1.  遏制\n2.  隔离\n3.  分段\n4.  划区\n\n### 7. 作为年度事件响应准备工作的一部分，Ben\
  \ 所在的组织逐步演练一个示例事件，以验证每个人在事件中的职责。这是什么类型的演练？\n\n1.  清单演练\n2.  模拟演练\n3.  桌面推演\n4. \
  \ 演练走查\n\n### 8. Madhuri 想要检查一张 PNG 格式的照片是否包含 GPS 坐标。如果照片中存在该信息，她可以在哪里找到？\n\n1.\
  \  附加在 PNG 后的 `location.txt` 文件中\n2.  在原始相机上\n3.  在照片的元数据中\n4.  在照片中作为隐写嵌入的数据字段\n\
