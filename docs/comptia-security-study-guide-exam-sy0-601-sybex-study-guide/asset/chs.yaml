  \n### 15. 哪种类型的安全解决方案为加密密钥的存储和管理提供硬件平台？\n\n1.  HSM\n2.  IPS\n3.  SIEM\n4.  SOAR\n\
  \n### 16. 哪种类型的密码学攻击试图强迫用户降低其与远程服务器通信时使用的加密级别？\n\n1.  生日攻击\n2.  频率分析\n3.  降级攻击\n\
  4.  彩虹表\n\n### 17. David 想要使用非对称加密算法给 Mike 发送一条消息。他应该使用哪个密钥来加密该消息？\n\n1.  David\
  \ 的公钥\n2.  David 的私钥\n3.  Mike 的公钥\n4.  Mike 的私钥\n\n### 18. 当 Mike 收到 David 为他加密的消息时，他应该使用哪个密钥来解密该消息？\n\
  \n1.  David 的公钥\n2.  David 的私钥\n3.  Mike 的公钥\n4.  Mike 的私钥\n\n### 19. 如果 David 希望对发送给\
  \ Mike 的消息进行数字签名，他会使用哪个密钥来创建数字签名？\n\n1.  David 的公钥\n2.  David 的私钥\n3.  Mike 的公钥\n\
  4.  Mike 的私钥\n\n### 20. 当 Mike 收到来自 David 的数字签名消息时，他应该使用哪个密钥来验证该数字签名？\n\n1.  David\
  \ 的公钥\n2.  David 的私钥\n3.  Mike 的公钥\n4.  Mike 的私钥\n\n---\n\n### 第 8 章：身份与访问管理\n\n\
  身份是现代组织中最重要的安全层之一。身份及其关联的账户，使组织能够控制谁有权访问其系统和服务；识别用户、系统和服务正在执行的操作；并控制这些账户拥有或不拥有的权限。所有这些意味着，精心设计的身份与访问管理架构及实施，对组织的运作至关重要。\n\
  \n本章首先介绍身份的概念，即关于主体的一组声明。身份通过认证过程进行声明，该过程证明该身份属于声明它的用户。随后，该用户根据与其用户账户关联的权利和特权被授权执行操作。您将了解认证方法、框架和技术，以及有关其实施和如何保护它们的关键细节。\n\
  \n在探讨完身份、认证和授权后，您将了解账户类型，包括用户、管理员、服务、来宾和共享账户。您还将了解账户策略如何用于管理和保护账户。最后，您将了解文件系统权限如何与账户协同工作，以控制用户可以读取、写入和执行哪些文件。\n\
  \n### 身份\n\n身份是关于主体的一组声明。主体通常是人、应用程序、设备或组织，但 `identity`（身份）最常见的应用对象是个人。身份通常与关于主体的信息相关联，包括对其身份使用至关重要的详细信息。这些信息包括属性，即关于主体的信息。属性可以包含广泛的信息，从姓名、年龄、位置或职位，到发色、瞳色或身高等身体特征。\n\
  \n当主体想要使用其身份时，他们需要使用多种常见方式之一来断言或声明身份：\n\n*   **用户名**，声明身份最常用的方式。重要的是要记住，用户名与身份相关联，本身**并非**一个认证因素。\n\
  *   **证书**，可存储在系统上，或与存储设备或安全令牌配对。\n*   **令牌**，一种物理设备，可生成代码、通过 USB 插入，或通过蓝牙或其他方式连接以呈现证书或其他信息。\n\
  *   **SSH 密钥**，身份的加密表示形式，可替代用户名和密码。\n*   **智能卡**使用嵌入式芯片。非接触式和物理芯片读取器兼容卡以及混合卡均已广泛部署，加密智能卡通常具备在卡片上直接生成密钥对的能力。\n\
  \n### 认证与授权\n\n当主体想要声明身份时，他们需要证明该身份属于他们自己。这意味着他们需要进行认证。认证技术（如认证协议、服务器和标准）旨在确保主体就是他们声称的那个人，确保认证过程保持安全可靠，并确保单点登录（SSO）等功能正常工作。\n\
  \n授权验证您有权访问的内容。两者结合时，认证和授权首先验证您是谁，然后根据您被授权使用的内容，允许您访问资源、系统或其他对象。\n\n#### 认证与授权技术\n\
  \n目前有大量认证和授权技术用于认证和授权。针对 Security+ 考试，您需要熟悉其中许多技术的基础知识，包括当前和历史技术。让我们来看看您需要了解的认证技术。\n\
  \n**可扩展认证协议（EAP）** 是一种常用于无线网络的认证框架。存在许多使用 EAP 框架的不同实现，包括厂商专有和开放方法，如 EAP-TLS、LEAP\
  \ 和 EAP-TTLS。这些协议中的每一个都使用该协议的消息传递标准来实现 EAP 消息。EAP 通常用于无线网络认证。\n\n**质询握手认证协议（CHAP）**\
  \ 是一种认证协议，旨在提供比 PAP（您将在本节后面读到）等协议更高的安全性。CHAP 使用加密质询和三次握手来发送凭据，如图 8.1 所示。\n\n![图\
  \ 8.1 CHAP 质询与响应序列](img/c08f001.png)\n\n**图 8.1** CHAP 质询与响应序列\n\nMicrosoft 推出了他们自己的\
  \ CHAP 版本，称为 MS-CHAP，但 MS-CHAP 第 1 版和第 2 版中发现的漏洞导致它在很大程度上被其他协议取代。\n\n**密码认证协议（PAP）**\
  \ 是一种以密码为中心的认证协议，常与点对点协议（PPP）配合使用以认证用户。尽管 PAP 仍出现在 Security+ 考试大纲中，但您不太可能在现代实现中使用\
  \ PAP，因为它已被 CHAP 和 EAP 实现所取代。\n\n\n\n\n##### 802.1X\n\n**802.1X** 是一种用于网络访问控制 (NAC)\
  \ 的 IEEE 标准，用于对想要连接到网络的设备进行身份验证。在 802.1X 系统中，请求者向验证器（如网络交换机、接入点或无线控制器）发送身份验证请求。这些控制器连接到身份验证服务器，通常通过\
  \ **RADIUS** 协议。**RADIUS** 服务器随后可能依赖后端目录，使用 **LDAP** 或 **Active Directory** 作为身份信息来源。图\
  \ 8.2 展示了一个使用 **EAP**、**RADIUS** 和 **LDAP** 的常见 802.1X 架构设计示例。\n\n![图 8.2 使用 EAP、RADIUS\
  \ 和 LDAP 的 802.1 身份验证架构](img/c08f002.png)\n\n**图 8.2** 使用 EAP、RADIUS 和 LDAP 的 802.1\
  \ 身份验证架构\n\n##### RADIUS（远程认证拨号用户服务）\n\n**RADIUS（远程认证拨号用户服务）** 是网络设备、无线网络和其他服务最常用的认证、授权和审计\
  \ (AAA) 系统之一。**RADIUS** 可以通过 **TCP** 或 **UDP** 运行，采用客户端-服务器模型。**RADIUS** 发送的密码通过共享密钥和\
  \ **MD5** 哈希进行混淆，这意味着其密码安全性不是很强。**RADIUS** 网络接入服务器与 **RADIUS** 服务器之间的流量通常使用 **IPSec**\
  \ 隧道或其他保护机制进行加密，以保护流量安全。\n\n##### 终端访问控制器访问控制系统 Plus (TACACS+)\n\n**终端访问控制器访问控制系统\
  \ Plus (TACACS+)** 是思科设计的 **TACACS**（终端访问控制器访问控制系统）的扩展。**TACACS+** 使用 **TCP** 流量提供认证、授权和审计服务。它提供完整的数据包加密以及细粒度的命令控制，允许根据需要保护单个命令。\n\
  \n##### Kerberos\n\n**Kerberos** 旨在不受信任的网络上运行，并使用身份验证来保护其认证流量。**Kerberos** 用户由三个主要元素组成：主体（通常是用户名）；实例（有助于区分相似的主体）；以及领域（由用户组组成）。领域通常由信任边界分隔，并拥有独立的\
  \ **Kerberos** 密钥分发中心 (**KDC**)。图 8-3 演示了基本的 **Kerberos** 认证流程。\n\n![图 8.3 Kerberos\
  \ 认证过程](img/c08f003.png)\n\n**图 8.3** Kerberos 认证过程\n\n当客户端想要使用 **Kerberos** 访问服务时，客户端会请求一张认证票据，即票据授予票据\
  \ (**TGT**)。认证服务器检查客户端的凭据，并使用票据授予服务 (**TGS**) 的密钥加密 **TGT** 作为响应返回。当客户端想要使用某项服务时，客户端将\
  \ **TGT** 发送给 **TGS**（通常也是 **KDC**），并包含其想要访问的资源名称。**TGS** 返回该服务的有效会话密钥，客户端向服务出示该密钥以访问它。\n\
  \n##### 基于互联网的认证技术\n\n基于互联网的系统通常依赖许多核心技术来实现认证和授权。这些技术包括：\n\n###### 安全断言标记语言 (SAML)\n\
  \n**安全断言标记语言 (SAML)** 是一种基于 **XML** 的开放标准，用于交换认证和授权信息。**SAML** 常用于 Web 应用程序的身份提供者和服务提供者之间。使用\
  \ **SAML** 意味着服务提供者可以接受来自一系列身份提供者的 **SAML** 断言，这使其成为联合环境（我们将在本章后面讨论）的常见解决方案。\n\n\
  ###### OpenID\n\n**OpenID** 是一种用于去中心化认证的开放标准。**OpenID** 身份提供者可以利用已建立的身份为第三方网站提供服务。一个常见的例子是许多网站提供的“使用\
  \ Google 登录”功能，但 Google 并不是主要 **OpenID** 身份提供者 (**IdP**) 的唯一例子。Microsoft、Amazon\
  \ 和许多其他组织也是 **OpenID** 身份提供者 (**IdP**)。依赖方 (**RP**) 将认证请求重定向到 **IdP**，然后接收带有断言的响应，断言因成功认证而证明用户就是他们声称的那个人，随后用户使用该用户的\
  \ **OpenID** 登录。\n\n###### OAuth\n\n**OAuth** 是许多网站使用的一种用于授权的开放标准。**OAuth** 为用户提供了一种方法，以确定向第三方应用程序和网站提供什么信息，而无需共享凭据。您可能在\
  \ Google Drive 插件请求访问您的文件或文件夹时体验过这一点，或者在使用 Web 会议工具请求访问 Google 日历及其所需或想要的权限列表以执行请求的功能时体验过。\n\
  \n这些技术是许多基于 Web 的 **SSO** 和联合实现的基础主要部分。\n\n##### 单点登录\n\n**单点登录 (SSO)** 系统允许用户使用单一身份登录，然后使用多个系统或服务而无需重新认证。**SSO**\
  \ 系统提供了显著优势，因为它们简化了用户与认证和授权系统的交互，但它们需要在现有的基于身份的安全边界数量上做出权衡。这意味着许多组织最终会为许多系统实施单点登录，但可能会为高安全环境要求额外的认证步骤或使用额外的特权账户。\n\
  \n**单点登录** 通常使用 **LDAP** 和 **Kerberos** 实现（如在 Windows 域和 Linux 基础设施中），或通过 **SAML**\
  \ 实现用于 Web 应用程序和联合服务。\n\n##### 联合身份\n\n在许多组织中，身份信息由 **身份提供者 (IdP)** 处理。身份提供者管理数字身份的生命周期，从创建、维护到最终在所支持的系统和服务中退役该身份。身份提供者通常是\
  \ **联合身份** 部署的一部分，它们与依赖方配对，依赖方信任身份提供者处理认证，然后依赖该认证来授予服务访问权限。联合身份常用于许多 Web 服务，但其他用途也是可能的。\n\
  \n以下是联合环境中常用的一些术语，您应该了解：\n\n*   主体，通常指用户\n*   **身份提供者 (IdP)**，通过 *证明* 过程提供身份和认证服务，在该过程中\
  \ **IdP** 验证用户就是他们声称的那个人\n*   **服务提供者 (SP)**，向身份已由身份提供者证明的用户提供服务\n\n此外，有时会使用 **依赖方\
  \ (RP)** 这一术语，其含义与服务提供者类似。**RP** 将要求来自 **IdP** 的认证和身份声明。\n\n### 目录服务\n\n**目录服务**\
  \ 用于网络中，以提供关于系统、用户和组织其他信息的信息。像 **轻量级目录访问协议 (LDAP)** 这样的目录服务通常作为身份管理基础设施的一部分部署，并提供关于组织的层次化组织信息。它们常用于提供用于电子邮件和其他联系信息的组织目录。图\
  \ 8.4 展示了 `Inc.com` 的 **LDAP** 目录层次结构示例，其中有两个组织单位 (**OU**)：安全和人力资源。每个单位都包含许多用通用名称\
  \ (**CN**) 标记的条目。除了图中显示的结构外，每个条目还将具有此简化图中未显示的附加信息，包括可分辨名称、电子邮件地址、电话号码、办公室位置和其他详细信息。\n\
  \n![图 8.4 LDAP 组织层次结构](img/c08f004.png)\n\n**图 8.4** LDAP 组织层次结构\n\n\n\n由于目录包含大量组织数据，并可能用于支持一系列服务（包括基于目录的身份验证），因此必须对其进行严格保护。同样的需求往往意味着目录服务器需要公开暴露，以便为需要访问目录信息的系统或业务合作伙伴提供服务。在这些情况下，可能需要额外的安全措施、更严格的访问控制，甚至完全独立的公共目录服务。\n\
  \n### 身份验证方法\n\n一旦你通过提供用户名或其他方式声明了身份，下一步就是证明该身份属于你。这一过程是身份验证过程的核心。\n\n使用密码仍然是最常见的身份验证手段，但密码存在许多缺陷。首先，也是最重要的一点是，密码很容易被窃取并被第三方利用。除非密码所有者对其进行更改，否则攻击者将一直能够使用该密码。密码也容易遭受暴力破解攻击，这使得有决心的攻击者若能花费足够时间自由尝试，最终便能闯入系统。这促使人们采用多因素认证，防止丢失或被盗的密码导致账户轻易被攻破。\n\
  \n#### 多因素认证\n\n确保单一受损因素（如密码）不会造成过度风险的一种方法是使用**多因素认证（MFA）**。多因素认证正变得广泛可用，事实上，它越来越多地成为更具安全意识的组织的默认选项。如今，在大多数情况下，被钓鱼的账号和密码不会使个人或组织面临潜在的数据泄露风险。\n\
  \n主要有三类因素：\n\n*   **知识因素**，包括密码、PIN 码或安全问题的答案。\n*   **拥有因素**，如智能卡、USB 或蓝牙令牌，或你持有的其他物品（如\
  \ 图 8.5 所示的 Titan 安全密钥）。\n\n    ![FIGURE 8.5 A Titan key USB security key](img/c08f005.png)\n\
  \n    **图 8.5** Titan 安全密钥 USB 密钥\n\n*   **固有因素**，依赖于正在进行身份验证的人员的身体特征。指纹、视网膜扫描、声纹，甚至你的打字速度和模式都包含在此类因素的选项中。\n\
  \nSecurity+ 考试大纲还描述了属性因素：\n\n*   **位置因素**，有时称为位置因素，基于你当前的位置。GPS、网络位置和其他数据可用于确保只有身处其应在之处的用户才能进行身份验证。\n\
  *   **行为因素**，用于 Windows 10 的图片密码功能或 Android 手机的手势密码。这是一种需要不同交互形式的知识因素。\n*   **特征因素**，可能是行为模式或类似特征。这些通常属于“固有因素”的一种形式，如打字速度或类似模式。\n\
  *   **熟人因素**，可包含来自他人的信任关系。\n\n与所有安全技术一样，多因素认证系统被新型攻击攻破只是时间问题。当前的攻击已聚焦于使用短信作为第二因素的系统的弱点，通过克隆手机或重定向通过\
  \ VoIP 系统发送的短信来实施。能够通过感染手机等类似技术窃取并快速使用第二因素的定向攻击，将成为攻击者攻破账户越来越必要的手段，因此在不久的将来将出现得更加频繁。\n\
  \n#### 一次性密码\n\n第二因素的常见实现方式是使用**一次性密码**。一次性密码是打击密码窃取和其他基于密码攻击的重要手段。顾名思义，一次性密码仅可使用一次。攻击者可能获取一次性密码，但无法继续使用它，这意味着暴力破解攻击将不断尝试识别一个不断变化的目标。尽管暴力破解攻击有可能在一次性密码有效期内随机匹配成功，但此类攻击成功的可能性微乎其微，且防止暴力破解的常见控制措施将使这种成功从根本上变得不可能。\n\
  \n一次性密码生成主要有两种模型。第一种是**基于时间的一次性密码（TOTP）**，它使用算法结合当前时间作为代码生成过程的一部分来推导一次性密码。**认证应用程序**（如\
  \ Google Authenticator）使用 TOTP，如 图 8.6 所示。该代码在设定的时间段内有效，随后转为下一个基于时间的代码，这意味着即使代码被泄露，也仅在相对较短的时间内有效。\n\
  \n![FIGURE 8.6 Google authenticator showing TOTP code generation](img/c08f006.png)\n\
  \n**图 8.6** Google Authenticator 显示 TOTP 代码生成\n\n图 8.6 展示了 Google Authenticator\
  \ 的示例，这是一种常见的免费基于应用程序的 TOTP 系统。代码在设定的时间段内有效，由右下角饼图的动画指示，在应用程序中，代码即将过期并被新代码替换时会变红。\n\
  \n另一种一次性密码生成模型是**基于 HMAC 的一次性密码（HOTP）**。HMAC 代表基于哈希的消息认证码。HOTP 使用令牌或 HOTP 代码生成应用程序与验证服务器共同使用的种子值，以及一个移动因子。对于按按钮工作的\
  \ HOTP 令牌，移动因子是一个计数器，该计数器也存储在令牌和服务器上。如图 8-7 所示的 PayPal 令牌等 HOTP 密码生成器，依赖按下按钮等事件来触发生成代码。由于代码是迭代的，可以从令牌最后一次已知使用时开始检查，向前迭代直到找到当前按下对应的代码。与\
  \ TOTP 解决方案一样，认证应用程序也可以实现 HOTP，其工作方式与硬件令牌实现相同。\n\n![FIGURE 8.7 An HOTP PayPal token](img/c08f007.png)\n\
  \n**图 8.7** HOTP PayPal 令牌\n\n除了应用程序和硬件令牌外，一次性密码系统的第三种常见实现是使用基于**短消息服务（SMS）**（即短信）的代码。在该模型中，当用户尝试进行身份验证时，会向其手机发送一条短信，然后他们输入该代码作为身份验证过程的额外因素。\n\
  \n在硬件令牌、软件令牌和短信均不适用的情况下，一些组织会实施基于电话呼叫的**推送通知**。推送通知是发送给用户以告知其事件（在本例中为身份验证尝试）的消息。如果用户通过按下键盘上的特定按钮等请求验证方式回应电话，则身份验证可以继续进行。电话呼叫作为身份验证因素存在诸多问题，包括速度较低（可能导致登录超时问题）、通过多种方式被劫持呼叫的可能性，以及因通话费用给实施组织带来的额外成本。\n\
  \n\n\n虽然按需动态生成的一次性密码更为常见，但有时也需要一种不需要设备或连接的一次性密码。在这种情况下，`static codes`（静态代码）仍然是一个有用的选项。静态代码与其他一次性密码一样也是通过算法生成的，但它们是预先生成的，通常打印出来或存储在安全的位置。这创造了一种新的风险模型：即打印它们的纸张可能被盗，或者如果它们是电子存储的，存储它们的文件可能会丢失或被访问。这相当于丢失了一个按键激活的令牌或一部未锁定的智能手机，因此如果静态代码没有得到妥善保管，它们可能会很危险。\n\
  \n#### 生物特征\n\n生物特征因素是“你是谁”因素的一个例子，它们依赖用户独特的生理特征来验证其身份。某些生物特征技术也算作 Security+ 考试大纲中描述的因素之一，因为它们属于“你表现出的东西”，如声纹或步态。一些最常见的生物特征技术包括以下内容：\n\
  \n*   `Fingerprints`（指纹），使用光学、超声波或电容式扫描仪检查指尖上脊和谷的独特模式。指纹扫描已在 Windows 中广泛部署（使用笔记本电脑上的指纹扫描仪），以及使用指纹读取器的\
  \ Android 和 Apple 设备中。\n*   `Retina scanning`（视网膜扫描）利用视网膜中血管的独特模式来区分用户。\n*   `Iris\
  \ recognition`（虹膜识别）系统使用模式识别和红外成像来唯一识别个人的眼睛。虹膜识别可以比视网膜扫描在更远的距离完成，使其在许多情况下更受青睐。\n\
  *   `Facial recognition`（面部识别）技术将特定特征与数据库中的原始图像进行匹配。面部识别广泛用于 Apple iPhone 的 FaceID，使其成为一种广泛部署的生物特征技术。\n\
  *   `Voice recognition`（语音识别）系统依靠用户声音本身的模式、节奏和声音来识别用户。\n*   `Vein recognition`（静脉识别），有时称为静脉匹配或血管技术，使用可以看到静脉模式的扫描仪，通常是用户手指的静脉。与指纹扫描仪不同，静脉扫描仪不需要接触用户，因此不太可能受到污垢或皮肤状况等因素的影响。\n\
  *   `Gait analysis`（步态分析）通过测量一个人的行走方式来识别他们。\n\n生物特征技术基于四个主要指标进行评估。第一是 I 类错误，即 `false\
  \ rejection`（误拒）率（FRR）。误拒错误意味着提交了合法的生物特征度量，但系统拒绝了它。II 类错误，或 `false acceptance`（误纳）错误，以误纳率（FAR）来衡量。当提交生物特征因素并被接受（但本不该被接受）时，就会发生这些错误。这些通过一种称为\
  \ `relative operating characteristic (ROC)`（相对工作特征曲线）的指标进行比较。ROC 将系统的 FRR 与 FAR\
  \ 进行比较，通常以图表形式呈现。对于大多数系统，随着降低误拒的可能性，误纳率会增加，确定系统准确性应设置在何处以最小化误纳并防止误拒，是生物特征系统配置中的一个重要要素。\n\
  \n该图表上 FAR 和 FRR 交叉的点称为 `crossover error rate`（交叉错误率）。图 8-8 显示了此类图表的一个简单示例。\n\n\
  ![FIGURE 8.8 FAR vs. FRR, with CRR shown](img/c08f008.png)\n\n**图 8.8** FAR 与 FRR\
  \ 对比，显示交叉错误率\n\n#### 基于知识的认证\n\n您可能遇到的另一种认证选项是 `knowledge-based authentication (KBA)`（基于知识的认证）。KBA\
  \ 经常以安全问题的形式用于密码重置。基于知识的认证问题也用于验证创建账户的用户，方法是动态生成账户请求者预期知道的问题。一个例子是在登录美国国税局（IRS）网站时，询问您上一年的纳税申报金额。国税局知道您应该已经知道此信息，而且极少数其他人应该知道。银行和其他机构将使用类似的问题，涉及抵押贷款余额、以前的地址或其他详细信息，以帮助验证您的身份。\n\
  \n在任何 KBA 实施中，重要的是他人无法轻易发现答案，答案是唯一的，并且答案是用户应该能够轻松记住或很可能知道的事情。密码问题越来越多地摒弃了询问您最喜欢的宠物或第一辆汽车等固定的特定问题，因为这些信息更有可能通过社交媒体或其他方法被找到。允许用户设置自己的问题或询问更冷门的信息是一个更安全的选项。\n\
  \n#### 管理认证\n\n管理密码和其他认证数据可能具有挑战性，尤其是当您运营一个拥有大量设备和账户的大型企业时。\n\n对于个人而言，提供高级别安全性的一种选择是\
  \ `password key`（密码密钥，通常称为安全密钥）。这些是支持一次性密码、用于安全证书的公钥加密以及 FIDO 和通用第二因子（U2F）等各种安全协议的硬件设备。它们有多种外形规格和不同类型的连接方式；大多数提供\
  \ USB 和/或蓝牙。\n\n`Password vaults`（密码保管库，通常称为密码管理器）是认证管理的另一种常见解决方案。它们是存储、管理和保护密码及其他信息的软件解决方案，允许用户使用强密码，而无需记住数十个甚至数百个单独的复杂密码。企业密码管理器应用程序在组织中广泛部署，以帮助管理服务器、应用程序和设备，它们还具有日志记录和审计等附加功能，以及管理工具以确保密码得到适当轮换并监控使用和滥用情况。\n\
  \n计算机还可以拥有内置或附加的安全模块，如 `Trusted Platform Module (TPM)`（可信平台模块）标准。TPM 模块或芯片具有内置的加密处理器，用于存储由系统所有者设置的密码保护的\
  \ RSA 密钥对。TPM 模块可以帮助防止未经授权的固件和软件更改，作为可信或安全启动过程的一部分，并且它们受操作系统支持，允许驱动器加密和其他基于加密的安全功能。虽然一些系统（包括许多企业级笔记本电脑）内置了\
  \ TPM 芯片，但它们也可以作为附加模块添加到支持它们的系统中。\n\n您应该了解的最后一个选项是使用 `hardware security modules\
  \ (HSMs)`（硬件安全模块）。HSMs 通常以独立的物理设备或计算机的插入式扩展卡的形式出现，集成了加密处理器，以安全地创建、存储和管理加密密钥；提供加密和解密服务；并以安全的方式执行其他加密处理。云提供商现在提供\
  \ HSM 即服务，允许以安全的方式将 HSM 添加到云基础设施中。\n\nHSM 设计的一个重要部分是设备本身的安全性，HSM 通常带有第三方安全认证，以证明它们已通过评估和验证，符合\
  \ FIPS-140 等标准，即美国政府的加密安全标准。\n\n### 账户\n\n声明身份并获得授权访问系统或服务需要一个账户。账户包含有关用户的信息，包括与账户关联的权利和权限等内容。\n\
  \n#### 账户类型\n\n\n\n##### 账户类型和访问控制方案\n\n账户类型繁多，但几乎所有类型都可以归纳为以下几种基本账户类型：\n\n*   **用户账户**，权限范围涵盖从对系统、设备或应用程序的基本访问，到拥有广泛权利和特权的高级用户。\n\
  *   **特权或管理账户**，如 Linux 和 Unix 系统上的 `root` 账户或 `wheel` 组成员，以及 Windows 默认的 `Administrator`\
  \ 账户。\n*   **共享和通用账户或凭证**，通常被安全策略所禁止。尽管共享账户可能很有用，但许多组织会构建委派功能，允许多个用户以相同方式或拥有相同权利行事，以避免共享账户问题，例如无法确定是谁登录了共享账户，或共享该账户的每个用户采取了什么操作。\n\
  *   **来宾账户**，提供给临时用户，通常具有非常有限的特权，但也很可能几乎没有（或完全没有）使用该账户用户的相关信息。\n*   **服务账户**，与应用程序和服务相关联。服务账户不应用于交互式登录，许多组织都制定了特定的安全策略来确保服务账户安全。\n\
  \n#### 账户策略和控制\n\n账户策略旨在提供控制，规定账户如何以及何时可以使用，控制密码复杂度、生命周期及其他细节。让我们探讨几个常见的账户策略设置，这些是你参加\
  \ Security+ 考试时需要准备实施的内容。\n\n**密码复杂度**决定了密码的组成。在 MFA（多因素认证）技术广泛实施之前，密码复杂度是最常用的控制措施之一，旨在防止简单密码被暴力破解。密码复杂度设置将规定密码可使用哪些字符、不可使用哪些字符、最小长度、是否可包含单词或包含特定禁用单词，以及决定密码复杂程度的任何相关设置。密码复杂度的权衡在于：要求额外的复杂度可能会降低用户记住密码的可能性，并可能在密码重置支持上花费额外的时间和金钱。复杂度还可能导致用户记录密码（可能存放在不安全的位置），或重复使用复杂密码，以免记忆过多密码。\n\
  \n**密码生命周期**也曾被普遍使用，尽管 MFA 的使用日益增加，导致许多组织不再要求定期更换密码。当密码是账户的唯一保护时，密码生命周期被视为一种限制密码在泄露后最大暴露时间的方法。这引发了关于生命周期与用户行为的各种实验，许多研究指出：要求更换越频繁，密码越有可能只是在旧密码基础上做微小更改。**密码历史记录**设置用于防止**密码重用**。基本的密码历史记录会跟踪管理员设定的特定迭代次数内的过往密码。更高级的密码历史记录系统可能能够识别密码是否与之前的条目过于相似，以确保未使用仅做微小更改的密码。\n\
  \n除了与密码相关的控制外，账户控制还可以利用登录过程中的其他信息。常见控制包括：\n\n*   **一天中的时间**，可防止员工在轮班结束后访问系统，从而潜在地减少攻击者在账户所有者不会察觉时利用账户的机会，或内部人员滥用特权。**基于时间的登录**对于轮班制或小时工更为常见。\n\
  *   **正在认证的系统的网络位置**。这有助于防止数据从错误的网络被访问，或通过确保系统仅从受保护网络内部进行认证来帮助维护信任边界。\n*   **地理位置数据**可用于仅允许来自地理围栏区域（基于预定\
  \ GPS 数据的位置）的登录。地理标记有时也会与此结合使用，以标记可在特定位置使用的特定数据或系统。地理信息还用于判断是否发生**不可能的旅行时间**问题，即用户从一个地点登录，随后又从另一个地点登录，两地距离足以确保用户不可能在给定时间内抵达新位置。此类技术可识别高风险登录，最有可能使用安全信息和事件管理（`SIEM`）工具或类似工具实现，这些工具能协调来自多个系统的数据。\n\
  \n尽管密码控制、地理位置和网络位置设置以及基于时间的控制都有助于确保用户以安全方式登录，但**账户审计**有助于确保账户得到良好管理、账户拥有适当的权限，且已实施适当的控制。账户审计（可能是手动或自动的）侧重于确保账户按预期配置，根据用户角色或组织针对该类账户或用户的规则和标准，拥有适当的权限和权利。\n\
  \n最后，当账户遇到问题时，账户可以被锁定或禁用。账户锁定通常是自动化的，基于错误的登录尝试。锁定可能需要人工干预，也可能在一段时间后自动解锁。经过设定时期后自动解锁的锁定称为**退避算法**，存在各种退避算法设计，旨在减缓或阻止暴力破解攻击者，同时仍允许合法用户有机会登录其账户，而无需联系支持部门。\n\
  \n在因泄露或生命周期变更（如离职或退休）或其他问题导致需要终止账户的情况下，禁用账户是一个重要选项。**禁用账户而非删除账户**可能令人担忧，因为它们可能仍保留特权，如果账户被有意或意外恢复，攻击者可能利用这些特权。因此，账户审计通常会审查禁用账户，以查看其是否得到妥善管理，以及组织是否有重新启用它们的习惯，或是否验证了重新启用的原因。\n\
  \n##### 特权访问管理\n\n**特权访问管理（PAM）**工具可用于处理本节前面提到的管理和特权账户。PAM 工具专注于通过帮助管理员仅指定角色或任务所需的最小特权集，来确保**最小权限**概念得以维持。PAM\
  \ 工具通常提供更详细、更细粒度的控制；增强的审计能力；以及对特权账户状态的额外可见性和报告。\n\n### 访问控制方案\n\n用户账户和账户控制固然重要，但系统还实施**访问控制方案**，以确定哪些用户、服务和程序可以访问它们托管的各种文件或其他对象。Security+\
  \ 考试涵盖许多常见的访问控制方案，我们接下来将进行探讨。\n\n**基于属性的访问控制（ABAC）**依赖于由用户属性驱动的策略。这允许基于属性组合的复杂规则集，授予用户与其拥有的属性相匹配的特定权利。由于属性可以在特定上下文中设置，这也意味着\
  \ ABAC 方案可以非常灵活。ABAC 策略的缺点是，由于其灵活性，管理起来也可能非常复杂。\n\n\n\n\n### 访问控制方案\n\n基于属性的访问控制方案对于应用安全非常有用，它们常用于拥有复杂用户角色和权限的企业系统中，这些角色和权限会因用户与系统交互的方式和角色而异。出于类似的原因，它们也用于数据库和内容管理系统、微服务以及\
  \ API。\n\n#### 基于角色的访问控制 (RBAC)\n\n**基于角色的访问控制 (RBAC)** 系统依赖于角色，这些角色随后与分配给这些角色的特权相匹配。这使得\
  \ RBAC 成为企业的热门选择，企业可以快速使用“收银员”或“数据库管理员”等角色对员工进行分类，并根据这些角色为用户提供对系统和数据的适当访问权限。RBAC\
  \ 系统归结为三条主要规则：\n\n*   **角色分配**，规定主体只能使用与其被分配角色相匹配的权限。\n*   **角色授权**，规定主体的活动角色必须经主体授权。这可以防止主体承担其不应具备的角色。\n\
  *   **权限授权**，规定主体只能使用其活动角色被允许使用的权限。\n\n这三条规则共同描述了如何在 RBAC 系统中应用权限。有了这三条规则，就可以构建角色层级，使得特定权限可以根据任何给定环境中的角色在适当的层级上可用。\n\
  \n#### 基于规则的访问控制\n\n**基于规则的访问控制**，有时也称为 RBAC（有时称为 RuBAC 以便将其与基于角色的访问控制区分开），是使用一组规则或访问控制列表\
  \ (ACL) 来应用的，这些规则或列表适用于各种对象或资源。当尝试访问某个对象时，系统会检查规则以确定是否允许访问。防火墙规则集是基于规则的访问控制的一个常见示例。\n\
  \n#### 强制访问控制 (MAC)\n\n**强制访问控制 (MAC)** 系统依赖操作系统来强制执行由安全策略管理员设置的控制。在 MAC 实现中，用户没有能力授予对文件的访问权限，或以其他方式更改集中设置的安全策略。MAC\
  \ 实现曾仅存在于政府和军事系统中，但现在它们可以在特定的高安全系统中找到，如 `SELinux`，以及 Windows 中的 `强制完整性控制 (MIC)`。总体而言，与自主访问控制相比，MAC\
  \ 实现仍然相对罕见。\n\n#### 自主访问控制 (DAC)\n\n**自主访问控制 (DAC)** 是一种许多人从自家 PC 就习惯了的访问控制方案。最常见的自主访问控制类型为文件和目录等对象分配所有者，然后允许所有者根据需要将权利和权限委派给这些对象。Linux\
  \ 文件权限提供了一个简单的示例。文件（或目录）的所有者可以设置适用于所有者、组或其他人的权限，并可以选择允许文件被读取、修改或执行。\n\n#### 具体的访问控制实现\n\
  \n除了访问控制方案外，Security+ 考试大纲还涵盖了两种你需要熟悉的具体访问控制系统实现：\n\n*   **特权访问管理** 是用于处理提升账户和权利的特权的一组控制、工具和流程。管理员、root\
  \ 或类似的高级账户需要被管理和保护。管理管理和特权账户通常始于确保强制执行最小权限，仅为用户和账户提供执行其工作所需的权利。PAM 解决方案可以部署来管理和控制这些账户，作为风险降低策略的一部分。\n\
  *   **条件访问** 描述了在允许访问数据、网络或其他资源之前，测试设备和用户安全状态的过程。Microsoft 已通过 `Active Directory`\
  \ 和 `Intune` 实施了条件访问控制，但其他控制方案也符合此描述。条件访问的优势在于，它不仅仅寻找权限来提供访问控制。相反，你需要既拥有访问对象的权限或权利，又拥有足够安全或受信任、能够访问该对象的系统或设备。\n\
  \n##### 文件系统权限\n\n对于 Security+ 考试的这一部分，你需要了解的最后一种访问控制类型是文件系统控制。文件系统控制决定哪些账户、用户、组或服务可以执行读取、写入和执行（运行）文件等操作。每个操作系统都有自己的一套文件系统权限和控制功能，你应确保熟悉\
  \ Linux 和 Windows 权限以应对考试。\n\n###### Linux 文件系统权限\n\nLinux 文件系统权限在文件列表中以字母 `drwxrwxrwx`\
  \ 显示，指示文件是否为目录，然后显示用户、组和其他（有时称为 world）权限。图 8.9 展示了其显示方式以及描述这些设置的数字表示的图表，该数字表示常用于使用\
  \ `chmod` Linux 命令更改权限时的简写。\n\n![图 8.9 Linux/Unix 文件权限](img/c08f009.png)\n\n**图\
  \ 8.9** Linux/Unix 文件权限\n\n###### Windows 文件系统权限\n\nWindows 文件权限可以使用命令行或 GUI 进行设置。图\
  \ 8.10 显示了使用 GUI 查看的文件属性。请注意，权限与 Linux 中设置的权限相似但不完全相同。Windows 提供完全控制（类似于 Linux 中的\
  \ `rwx` 或 `7`）。\n\n![图 8.10 Windows 文件权限](img/c08f010.png)\n\n**图 8.10** Windows\
  \ 文件权限\n\n修改权限允许查看以及更改文件或文件夹。读取和执行不允许修改或更改，但允许运行文件，而读取和写入则按预期工作。\n\n文件系统权限是系统的一个重要控制层，设置不当或不安全的权限经常被攻击者利用来获取数据并运行他们本不应运行的应用程序。事实上，我们在其他章节中探讨的攻击（如\
  \ Web 服务器上的目录遍历攻击）依赖于薄弱的文件系统权限，允许攻击者访问在妥善保护的系统上 Web 服务器本不应访问的文件。\n\n### 总结\n\n身份是组织安全的关键要素。认证是通过提供一个或多个因素（包括你知道的、你拥有的或你本身的特征）来证明你对身份的声称的过程。授权为经过认证的用户提供完成其角色所需的特权和权利。用户账户范围从来宾和普通用户到服务账户和特权管理账户。账户策略规定了每个账户的细节和要求，包括何时应锁定或禁用账户。\n\
  \n组织中部署了各种认证方法和技术。本地技术包括 `TACACs+`、`Kerberos`、`EAP`、`CHAP`、`802.1x`，常见的云认证和授权技术包括\
  \ `OAuth`、`OpenID` 和 `SAML`。单点登录允许用户登录一次并在许多系统中使用其身份，而联合身份认证使用身份提供者来认证用户，然后这些用户可以在各种服务提供者和信赖方位置使用这些身份，而无需在那里拥有不同的身份。当资源考量发挥作用时，会使用认证、授权和审计\
  \ (AAA) 系统（如 `RADIUS`），因为它们除了跟踪用户认证和授权外，还跟踪使用情况。\n\n\n\n\n### 多因素认证与访问控制\n\n多因素认证有助于限制密码相关的问题，例如密码窃取、重复使用和暴力破解攻击。生物识别认证利用指纹、视网膜扫描或面部识别等身体特征，已变得司空见惯，但了解它们错误地允许错误人员进入或拒绝合法用户的频率至关重要。\n\
  \n认证管理工具如密码保管库（或保险箱）、安全密钥和密码密钥，以及专用硬件设备如 `Trusted Platform Modules (TPM)` 和硬件安全模块\
  \ (`HSM`) 提供加密处理和存储，以保障系统安全。\n\n访问控制方案如基于属性的访问控制、自主访问控制、强制访问控制和基于角色的访问控制，都提供了确定主体可对客体执行哪些操作的方法。特权访问管理确保管理员用户得到妥善管理，而条件访问系统确保用户在使用其特权时是从安全的系统进行连接。\n\
  \n### 考试重点\n\n**身份标识是认证和授权的基础。** 用户通过认证过程声明身份标识。除了用户名，身份标识通常还通过证书、令牌、`SSH` 密钥或智能卡来声明，它们各自提供额外的功能或特性，有助于安全或其他有用功能。身份标识使用属性来描述用户，各种属性（如工作、职位，甚至个人特征）作为该用户身份标识的一部分存储。\n\
  \n**认证技术用于保护系统和服务。** 如今广泛使用各种认证技术。可扩展认证协议 (`EAP`) 正如其名所示旨在可修改，这意味着 `EAP` 实现被用于许多环境中。`Kerberos`、`CHAP`、`TACACS+`\
  \ 和 `802.1x` 都是你可能遇到的认证协议；`PAP` 不再广泛部署。`SAML`、`OAuth` 和 `OpenID` 对于网站以及云和互联网服务及提供商的认证和授权互操作至关重要。\n\
  \n**账户类型和账户策略决定用户能做什么。** 用户账户类型包括普通用户、来宾、管理员（特权）账户和服务账户。账户通过账户策略进行控制，这些策略决定密码复杂度、历史记录和重用，以及账户是否可在特定时间、从特定位置使用，或账户是否有其他要求。账户也可以通过在不再需要或可能不安全时禁用它们，或在认证失败时将其锁定来保护，以帮助防止暴力破解攻击。\n\
  \n**许多不同的认证方法和技术用于确保用户可以声明身份标识。** 一次性密码可能使用基于 `HOTP` 的迭代事件算法，或基于 `TOTP` 的时间算法，两者都可以通过硬件令牌或软件应用程序交付。一次性密码也经常通过\
  \ `SMS` 推送提供。生物识别作为“你是谁”因素，在移动设备和其他系统中越来越普遍，指纹和面部识别已得到广泛采用。作为安全专业人员，你需要了解广泛的认证因素，为什么在特定情况下可能选择或避免使用每一种，以及为什么多因素认证在许多环境中是一项关键的安全控制。\n\
  \n**访问控制方案决定账户拥有什么权限。** 重要的访问控制方案包括基于属性的访问控制 (`ABAC`)，它利用用户属性来确定用户应获得什么访问权限。基于角色的访问控制\
  \ (`RBAC`) 基于角色做决策，而基于规则的访问控制（有时也称为 `RBAC`）使用规则来控制访问。除了了解这些访问控制方案外，还应熟悉强制访问控制 (`MAC`)，它依赖系统管理员控制访问，以及自主访问控制\
  \ (`DAC`)，它允许用户对其拥有权限的文件和目录做出访问决策。条件访问控制哪些设备可以访问环境，通常基于其安全状态或其他要求。`PAM`（特权访问管理）专注于控制管理员账户。最后，考生还需要知道如何使用和应用常见的文件系统权限。\n\
