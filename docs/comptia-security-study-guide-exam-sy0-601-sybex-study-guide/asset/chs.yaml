  \ 决定证据是否可在法庭上使用。不可抵赖性 确保证据或材料能够关联到其发起者。\n\n#### 11\n**A.** 固件可能难以访问，但在某些情况下，内存取证技术和直接硬件接口访问都是可行的手段。固件通常不存储在磁盘上，而是存储在\
  \ BIOS 或 UEFI 芯片中。从系统中取出芯片将导致其无法运行，因此这不是首选方法。此外，许多芯片不可拆卸。关闭设备并启动至固件界面，对于大多数设备而言，并不提供复制固件的方法。尽管固件可能允许更新，但大多数不允许下载或复制。\n\
  \n#### 12\n**C.** 虽然使用技术手段可能很诱人，但当需要审查某人执行的操作时，面谈相关人员是最佳的切入点。Charles 可以面谈该员工，然后再采用技术手段验证其陈述。系统日志和事件日志可能包含一些线索，但正常系统不维护按键日志。事实上，最接近的常规元素是\
  \ Windows 和 Linux 都使用的命令日志，用于在需要时回调命令行输入。\n\n#### 13\n**B.** 复制完成后，应比较源驱动器和目标驱动器的哈希值，以确保复制成功。之后，可更新保管链文档，记录已创建副本，并将在分析过程中跟踪该副本，同时保存原件。在复制后擦除任一驱动器并非流程的一部分，尽管目标驱动器可在案件结束后擦除。\n\
  \n#### 14\n**B.** 对驱动器进行快速格式化会移除文件索引，但会将文件内容保留在驱动器上。恢复工具会在驱动器上查找这些文件，并利用元数据、文件头和其他线索将它们拼凑还原。\n\
  \n#### 15\n**B.** 合同通常包含审计权、管辖权选择和数据泄露通知时限条款，但很少包含对供应商系统或设备进行取证检查的权利。Naomi 可以考虑询问他们的事件响应流程，并索要之前与客户共享的泄露通知和事件文档示例。\n\
  \n#### 16\n**D.** 保管链记录谁持有物品、如何收集、存储在哪里及如何存储、如何保护或安全防护、谁收集的以及移交情况，但通常不包括物品如何运输，因为如果提供了其他数据，运输方式并不相关。\n\
  \n#### 17\n**A.** Autopsy 是此列表中唯一的开源取证套件。EnCase 和 FTK 都是商业工具，WinHex 也是商业工具，但不是取证套件。\n\
  \n#### 18\n**C.** 移除与法律保留相关的信息，正是法律保留旨在防止的行为。如果 Theresa 的组织故意清除或更改相关信息，可能会面临严重的法律麻烦。\n\
  \n#### 19\n**C.** 根据易失性顺序，备份是这些选项中最不易失的。备份将保留直到过期，在某些情况下可能是几天、几周甚至几个月。从最易失到最不易失，依次为：RAM、硬盘上的数据、远程日志，然后是备份。\n\
  \n#### 20\n**A.** 虽然校验和和哈希值都可用于验证消息完整性，但哈希值的冲突比校验和少，且能为文件提供唯一的指纹。校验和主要用作快速检查完整性是否保持的手段，而哈希值用于许多其他目的，例如在不保留原始密码的情况下进行安全密码验证。校验和无法用于证明取证镜像完全一致，但可用于确保你的操作未更改驱动器内容。\n\
  \n### 第 16 章：安全策略、标准与合规\n\n#### 1\n**B.** 此场景中的关键词是“单向”。这表明遵守该文档并非强制性的，因此 Joe 必定是在编写指南。策略、标准和程序都是强制性的。\n\
  \n#### 2\n**A.** PCI DSS 补偿控制必须“超出”其他 PCI DSS 要求。这明确禁止将用于满足某一要求的控制作为另一要求的补偿控制。\n\
  \n#### 3\n**C.** 《通用数据保护条例》（`GDPR`）实施了处理欧盟居民个人信息的隐私要求。《健康保险流通与责任法案》（`HIPAA`）包含影响医疗服务提供者、健康保险公司和医疗信息交换中心的安全和隐私规则。《家庭教育权利和隐私法案》（`FERPA`）适用于教育机构。《支付卡行业数据安全标准》（`PCI\
  \ DSS`）适用于信用卡和借记卡信息。\n\n#### 4\n**B.** NIST 网络安全框架中描述的五大安全功能是：识别、保护、检测、响应和恢复。\n\n\
  #### 5\n**C.** 国际标准化组织（`ISO`）发布 `ISO 27701`，涵盖隐私控制。`ISO 27001` 和 `ISO 27002` 涵盖网络安全，`ISO\
  \ 31000` 涵盖风险管理。\n\n#### 6\n**D.** 策略需要最高管理层（通常是 `CEO`）批准。其他文档通常可由其他管理者（如 `CISO`）批准。\n\
  \n#### 7\n**C.** 主服务协议（`MSAs`）为供应商与组织在较长时期内的合作提供一份总框架合同。`MSA` 通常包含详细的安全和隐私要求。每当组织与供应商启动新项目时，可创建一份工作说明书（`SOW`），其中包含项目特定细节并引用\
  \ `MSA`。\n\n\n\n\n\n## 练习题答案解析\n\n### 第 16 章：安全策略与合规（续）\n\n**8. B**  \n所有这些组织都制定安全标准和基准。然而，只有互联网安全中心（CIS）以制定涵盖各种软硬件的独立基准而闻名。\n\
  \n**9. C**  \n行为准则通常用作员工行为问题的底线保障，这些问题未被其他策略直接解决。\n\n**10. B**  \n安全策略通常不包含指令性的技术指导，例如要求使用特定加密算法。此类细节通常见于安全标准中。\n\
  \n**11. A**  \n审计师不评估控制措施的有效性，这意味着这是 Type 1 报告，而非 Type 2 报告。仅在 NDA 下共享意味着这是 SOC\
  \ 2 评估。\n\n**12. B**  \n组织的可接受使用策略（AUP）应包含什么构成公司资源允许和不允许使用的信息。该策略应包含指导 Tonya 后续步骤的信息。\n\
  \n**13. D**  \n支付卡行业数据安全标准（PCI DSS）提供了关于存储、处理和传输信用卡和借记卡信息的详细规则。PCI DSS 不是法律，而是适用于信用卡商户和服务提供商的合同义务。\n\
  \n**14. D**  \n数据保留策略概述了组织将维护哪些信息，以及不同类别的信息在销毁前将保留多长时间。\n\n**15. D**  \n强制休假旨在迫使个人离开办公室一段时间，以便在其缺席期间暴露欺诈活动。此处列出的其他控制措施（职责分离、最小权限和双人控制）旨在预防而非检测欺诈。\n\
  \n**16. D**  \n指南是安全策略框架中唯一可选的要素。遵守策略、标准和程序是强制性的。\n\n**17. D**  \n这些术语中的任何一个都可以合理地描述此项工作。然而，“审计”一词最能描述此工作，因为审查的正式性质以及是由董事会要求的。\n\
  \n**18. B**  \n标准描述了组织必须具备的具体安全控制。Allan 不会在高层策略文档中包含可接受的机制，而这些信息作为程序来说太笼统。指南不是强制性的，因此不适用于此场景。\n\
  \n**19. D**  \nNIST 网络安全框架旨在帮助组织描述其当前的网络安全状况、描述网络安全目标状态、识别并优先考虑改进机会、评估进度，并与利益相关者沟通风险。它不创建具体的技术要求。\n\
  \n**20. C**  \n安全策略例外请求通常不包括对策略的建议修订。例外是因特定技术和/或业务需求而产生的、有文档记录的偏离策略的行为。它们不改变原始策略，该策略对未被例外覆盖的系统仍然有效。\n\
  \n## 第 17 章：风险管理与隐私\n\n**1. C**  \n通过应用补丁，Jen 从服务器中移除了漏洞。这也消除了这一特定风险。Jen 无法控制攻击者试图访问其服务器的外部威胁。\n\
  \n**2. C**  \n安装 Web 应用防火墙降低了攻击到达 Web 服务器的概率。Web 应用中可能仍存在漏洞，外部攻击的威胁也未改变。成功的 SQL\
  \ 注入攻击的影响也不会因 Web 应用防火墙而改变。\n\n**3. C**  \n本案例中处于风险中的资产是客户数据库。失去对数据库的控制将导致 500,000\
  \ 美元的罚款，因此资产价值（AV）为 500,000 美元。\n\n**4. D**  \n攻击将导致数据库中存储的客户数据完全丢失，使暴露因子（EF）为 100%。\n\
  \n**5. C**  \n我们通过将资产价值（AV）（500,000 美元）和暴露因子（EF）（100%）相乘，计算出单次损失期望值（SLE）为 500,000\
  \ 美元。\n\n**6. A**  \nAziz 的威胁情报研究确定该威胁每年发生的可能性为 5%。这是年化发生率（ARO）为 0.05。\n\n**7. B**\
  \  \n我们通过将 SLE（500,000 美元）和 ARO（0.05）相乘，计算出年化损失期望值（ALE）为 25,000 美元。\n\n**8. C**\
  \  \n安装新控制或升级现有控制是降低风险概率或幅度的努力。这是风险缓解活动的一个例子。\n\n**9. B**  \n更改业务流程或活动以消除风险是风险规避的一个例子。\n\
  \n**10. D**  \n保险单通过将部分或全部财务风险从组织转移给保险公司，采用了风险转移策略。\n\n**11. A**  \n当组织决定不再采取进一步行动解决剩余风险时，他们选择的是风险接受策略。\n\
  \n**12. A**  \n根据 GDPR，数据保护官（DPO）是被指派直接负责执行组织隐私计划的个人。\n\n**13. A**  \n在本案例中，医生保持数据所有者角色。他们选择将数据处理外包给\
  \ Helen 的组织，使该组织成为数据处理者。\n\n**14. C**  \n恢复时间目标（RTO）是组织在系统修复前能容忍系统停机的时间长度。这是 Gene\
  \ 在此场景中确定的指标。\n\n**15. B**  \n这是一个棘手的问题，因为患者记录中可能包含所有这些类别的信息。然而，它们最有可能包含受保护的健康信息（PHI）。PHI\
  \ 也可被描述为个人可识别信息（PII）的一个子类别，但 PHI 是更好的描述。记录也可能包含支付卡信息（PCI）或个人财务信息（PFI），但可能性低于 PHI。\n\
  \n**16. C**  \n组织应仅将数据用于收集该数据时披露的目的。在本案例中，组织为技术支持目的收集数据，现将其用于营销目的。这违反了目的限制原则。\n\n\
  **17. C**  \nTop Secret（绝密）是美国分类体系中的最高级别，因此需要最高级别的安全控制。\n\n**18. A**  \n令牌化技术使用查找表，设计为可逆的。如果正确实施，掩码和哈希技术用无法还原为原始数据的值替换数据。碎纸销毁如果操作得当，会物理销毁数据，使其无法恢复。\n\
  \n**19. B**  \n数据控制者是决定处理个人信息的原因并指导处理该数据方法的实体。该术语主要用于欧洲法律，作为“数据所有者”一词的替代，以避免假设收集数据的任何人都对该数据拥有所有权。\n\
  \n**20. D**  \n剩余风险是组织实施了旨在缓解、规避和/或转移固有风险的控制措施后仍然存在的风险。\n\n---\n\n## 索引\n\n### A\n\
