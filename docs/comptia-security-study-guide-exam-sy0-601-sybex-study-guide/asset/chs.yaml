  \n#### 16\n**D.** Scott 实施了离线备份方案。他的备份检索时间会更长，因为它们位于远程设施，必须发回给他，但它们很可能幸存于其设施或数据中心发生的任何灾难。在线备份保持即时可访问，而近线备份的检索速度比在线备份慢但比离线备份快。安全备份不是行业术语。\n\
