  1.  允许列表工具\n2.  COOP（业务连续性计划）\n3.  SIEM\n4.  拒绝列表工具\n\n### 10. 以下哪项*不*属于 COOP 的四个阶段之一？\n\
  \n1.  就绪与准备\n2.  启动与迁移\n3.  业务连续性运行\n4.  文档记录与报告\n\n### 11. Ian 每晚都会从 SIEM 收到数百个误报警报，因为计划作业在其数据中心运行。他应该调整\
  \ SIEM 的哪项设置以降低误报率？\n\n1.  趋势分析\n2.  灵敏度\n3.  关联规则\n4.  仪表板配置\n\n### 12. IR 团队中哪位成员充当通往高级管理层的主要渠道？\n\
  \n1.  沟通与公共关系\n2.  信息安全\n3.  管理\n4.  技术专家\n\n### 13. Gwen 正在构建组织的文档和流程，并想要制定一份计划，规定如果数据中心烧毁组织该怎么办。哪种类型的计划通常涵盖此类场景？\n\
  \n1.  事件响应计划\n2.  业务连续性计划\n3.  灾难恢复计划\n4.  利益相关者管理计划\n\n### 14. Jim 想要查看描述 CentOS\
  \ Linux 系统上应用程序采取的操作的日志条目。他可以在系统上使用以下哪种工具来查看这些日志？\n\n1.  `logger`\n2.  syslog-ng\n\
  3.  journalctl\n4.  `tail`\n\n### 15. Megan 的组织将钻石入侵分析模型作为其事件响应流程的一部分。Megan 组织中的一名用户发现了一台受损系统。哪个核心特征能帮助她确定受损是如何发生的？\n\
  \n1.  对手\n2.  能力\n3.  基础设施\n4.  受害者\n\n### 16. Chris 为一台 Windows 系统开启了登录审核。哪个日志将显示这些记录？\n\
  \n1.  Windows 应用程序日志\n2.  Windows 安全日志\n3.  Windows 系统日志\n4.  以上全部\n\n### 17. Susan\
  \ 发现近六个月前其网络上发生了一起事件。在准备确定用于调查的有用数据时，哪项常见策略最有可能给她的调查带来困难？\n\n1.  配置标准\n2.  通信策略\n\
  3.  事件响应策略\n4.  保留策略\n\n### 18. Hitesh 想要保持系统在线，但在调查期间限制在其上发现的恶意软件的影响。他应该使用以下列表中的哪种方法？\n\
  \n1.  遏制\n2.  隔离\n3.  分段\n4.  黑洞路由\n\n### 19. 事件响应流程的哪个阶段利用妥协指标和日志分析作为事件回顾的一部分？\n\
  \n1.  准备\n2.  遏制\n3.  根除\n4.  识别\n\n### 20. Henry 想要检查服务是否由攻击者安装。他可以使用哪种常见的组织收集数据来查看系统上是否出现了新服务？\n\
  \n1.  组织内各系统的注册表转储\n2.  防火墙日志\n3.  漏洞扫描\n4.  流日志\n\n\n\n\n\n### 数字取证中的人为因素\n\n数字取证中的人为因素也可能很重要；对涉案人员的访谈可以提供重要线索。这意味着在某些情况下，你不能仅仅是一名技术取证专家——相反，你必须利用你对技术和人类行为的双重知识来完成你的取证工作。\n\
  \n#### 法律保全与电子取证\n\n在许多情况下，当诉讼正在进行或预期将会发生时，取证工作便随之开始。法律顾问可以发送**法律保全通知**或诉讼保全通知，这是一份通知，告知组织必须保留在正常运营过程中可能会被销毁或修改的数据和记录。各类备份、纸质文档和电子文件都必须得到保存。\n\
  \n法律保全通知通常是电子取证或**电子发现**流程的首要环节之一。发现程序允许法律案件的各方从对方及其他涉案方获取证据，而电子发现就是电子化的发现程序。除了法律案件，发现程序也常用于公共记录、《信息自由法》请求和调查。使用框架来审视电子发现会有所帮助，**电子发现参考模型\
  \ (EDRM)** 就是一个有用的模型。EDRM 模型通过九个阶段来描述发现程序：\n\n1.  **信息治理**：事前进行，以评估存在哪些数据，并允许对需要提供的数据进行范围界定和控制。\n\
  2.  **识别**：识别电子存储信息，以便了解拥有什么数据以及数据存储在何处。\n3.  **保全**：保全信息，确保其不被更改或销毁。\n4.  **收集**：收集信息，以便将其作为收集过程的一部分进行处理和管理。\n\
  5.  **处理**：处理数据以移除不需要或无关的信息，并通过格式化或整理使其做好审查和分析的准备。\n6.  **审查**：审查数据以确保其仅包含应有的内容，且不包含不应共享的信息。\n\
  7.  **分析**：分析信息以识别关键要素，如主题、术语、个人或组织。\n8.  **生成**：生成数据，向第三方或法律程序相关方提供信息。\n9.  **呈现**：呈现数据，既用于法庭作证，也用于与专家或相关方进行进一步分析。\n\
  \n这一过程中最重要且同时最具挑战性的要求之一，可能是电子信息的保全，特别是当法律保全或发现程序涵盖的数据频繁被组织内的用户使用或修改时。电子发现和法律保全支持工具可以提供帮助，它们具备为处于诉讼保全状态的用户或群组捕获数据的能力。这些工具通常带有桌面、移动设备和服务器代理，可收集数据、跟踪变更，并在整个法律保全时间范围内记录数据的适当处理情况。在频繁处于法律保全状态的组织中，CEO、总裁等常成为诉讼目标的高管，长期处于近乎持续的法律保全和发现状态并不罕见。\n\
  \n云运营使电子发现变得更加复杂。云供应商提供服务，但不会允许你在其云服务中植入侵入式的法律保全和发现代理。这意味着在采用云服务时，你必须解决如何应对这些服务的法律保全问题。像\
  \ **Google Vault** 这样的工具同时提供电子邮件归档和发现支持，帮助组织满足其发现要求。\n\n#### 实施数字取证\n\n取证数据是使用取证工具获取的，如磁盘和内存成像工具、镜像分析和时间线工具、可显示磁盘上数据内容和结构详细信息的低级编辑器，以及其他专用工具。Security+\
  \ 考试重点关注获取的关键方面，包括易失性顺序，以及如何以及为何从常见位置和设备获取数据的详细信息。\n\n##### 获取取证数据\n\n当取证从业者计划获取数据时，他们要审查的第一件事之一是**易失性顺序**。易失性顺序记录了因系统操作或正常进程而最可能丢失的数据。图\
  \ 15.1 展示了一个典型的易失性顺序图表。请注意，CPU 寄存器和缓存状态等频繁变化的信息排在首位，因此易失性最高；随后是路由信息、进程和内核统计信息。随着列表往下，每个项目迅速消失的可能性逐渐降低，备份数据最不可能发生变化。遵循易失性顺序进行获取——除非有令人信服且紧迫的理由偏离该列表——将使取证分析师最大程度地完整捕获数据。重要的是要记住，当系统关机或重启时，哪些项目会消失。一般来说，在该列表中，临时文件和交换空间位于第\
  \ 4 位会发生这种情况。能否恢复完整的临时文件和交换空间中的数据，取决于系统是如何关闭的，以及之后是否成功重启。\n\n![图 15.1 易失性顺序](img/c15f001.png)\n\
  \n**图 15.1** 易失性顺序\n\nSecurity+ 考试要求你熟悉针对以下取证目标获取信息的基本概念：\n\n*   **CPU 缓存和寄存器**极少作为常规取证工作的一部分被直接捕获。尽管可以使用专用硬件或软件捕获其中一些信息，但大多数调查不需要这种级别的细节。随着处理过程的进行，CPU\
  \ 缓存和寄存器在不断变化，因此具有极高的易失性。\n*   **临时性数据**，如进程表、内核统计信息、系统的 **ARP 缓存** 等，可以通过内存和磁盘获取相结合的方式捕获，但必须记住，捕获只能反映获取那一刻的时间点状态。如果事件发生在过去，这些数据可能无法反映事件发生时系统的状态。\n\
  *   **随机存取存储器 (RAM)** 的内容对调查和事件响应都非常有帮助。内存中可能包含加密密钥、来自应用程序的临时性数据，以及可能未写入磁盘但对调查有用的信息。\n\
  *   **交换空间和页面文件** 信息是用于补充物理内存的磁盘空间。与从 RAM 捕获信息非常相似，捕获交换空间和页面文件可以深入了解运行中的进程。由于系统会主动使用它，特别是在内存较小的机器上，它的变化速度也比磁盘上的许多文件要快。\n\
  *   **磁盘上的文件和数据** 变化较慢，但却是许多调查的主要焦点。重要的是要捕获整个磁盘，而不仅仅是复制文件，以便查看仍驻留在磁盘上的已删除文件和其他残留痕迹。\n\
  *   **操作系统** 本身可能包含有用信息。**Windows 注册表** 是分析的常见目标，因为 Windows 中的许多活动都会修改或更新注册表。\n\
  *   **设备**，如智能手机或平板电脑，也可能包含作为取证目标的数据。\n*   **固件** 是较少成为取证目标的工件，但如果固件作为事件的一部分被修改，或者固件可能包含取证相关数据，则知道如何从设备复制固件可能是必要的。固件通常可通过硬件接口（如串行电缆或直接\
  \ USB 连接）或通过内存取证技术访问。\n\n\n\n\n虚拟机快照是取证从业人员必须处理的日益常见的工件。\n\n网络流量和日志可以提供关于发送或接收了什么、何时发送或接收、通过什么端口和协议以及其他有用细节的详细信息或线索。\n\
  \n设备、打印输出、介质以及与调查相关的其他物品等工件都可以提供额外的有用取证数据。\n\n无论获得或处理哪种类型的取证数据，如果取证案件可能导致法律诉讼，保持*证据保管链*文档非常重要。事实上，一些组织无论案件如何都应用这些规则，以确保在必要时案件能得到支持。证据保管链表单是简单的签署和文档记录表单，如图\
  \ 15.2 所示。每次访问、传输或以其他方式处理驱动器、设备或工件时，都会按照表单所示进行记录。\n\n![图 15.2 证据保管链表单示例](img/c15f002.png)\n\
  \n**图 15.2 证据保管链表单示例**\n\n法庭案件中的证据通常具有法律可采性，前提是它被用来证明案件事实且不违反法律。要确定证据是否可采，会应用诸如证据的相关性和可靠性、证据是否合法获取、证据是否真实等标准。证据必须是可获得的最佳证据，且流程和程序应经得起法庭质疑。\n\
  \n除了这些要求外，数字取证的*可采性*还要求数据完整且未被篡改，并能证明在取证过程之前和期间一直保持未被篡改。取证分析师必须能够证明他们具备适当的技能、使用了适当的工具和技术，并以一种可靠且可通过可审计线索进行测试的方式记录了他们的行动。因此，如有必要，第三方必须能够重复他们的工作和发现。\n\
  \n###### 云取证\n\n尽管现场取证构成了传统取证工作的大部分，但向云服务的广泛迁移给取证分析师带来了新的挑战。除了需要支持取证发现需求的工具和能力外，组织越来越多地确保他们已与云提供商合作。除了组织必须考虑的关于从云提供商保留和生成数据能力的高层关注点外，Security+\
  \ 考试专门包含三个概念：\n\n*   **审计权条款**，它是云服务与组织之间合同的一部分。审计权条款提供直接审计云提供商的能力，或同意使用第三方审计机构的协议。许多云提供商使用标准合同，可能不同意为小型组织提供审计权条款。在这种情况下，他们可能会提供定期更新的第三方审计声明的访问权限，这可能符合您组织的需求。如果您有特定的审计要求，应尽可能在合同中解决它们，并决定如果无法进行审计，审计能力是否是贵组织决定采用云提供商服务的决定性因素。\n\
  \n*   **法规**和**管辖权**顾虑也是采用云服务的重要因素。法规要求可能因云服务提供商的运营地和总部所在地而异。涵盖您的数据、服务或基础设施的法律可能不是您所在地区、区域或国家的法律。此外，管辖权顾虑可能超出涵盖整个组织的法律范围。云提供商通常在世界各地设有站点，数据复制和其他服务要素意味着您的数据或服务可能存储或使用在同样广泛的位置。当地司法管辖区可能声称有权通过搜查令或其他法律手段访问该数据。对此有重大顾虑的组织通常通过合同条款、提供商提供的仅在特定区域或国家托管数据或系统的服务选择，以及技术控制（如自行处理加密密钥以确保知晓数据是否被访问）来解决此问题。\n\
  \n*   **数据泄露通知法律**，与其他法规要素一样，因国家而异，在美国各州之间也明显不同。合同通常涵盖通知客户前可经过的最长时间，确保您拥有满足需求的适当泄露通知条款可能很重要。一些供应商延迟数天、数周甚至数月通知，可能导致不知情的客户面临重大问题。\n\
  \n这些考虑因素意味着从云提供商获取取证数据的可能性不大。虽然您可能能够从日志或您在基础设施即服务提供商环境中维护的系统和基础设施中恢复取证数据，但服务本身的取证数据很少移交给客户。因此，使用云服务的组织必须制定计划来处理潜在事件和调查，而不依赖直接取证技术。\n\
  \n##### 采集工具\n\n获取驱动器或设备的取证副本需要一种能在比特级创建设备完整副本的工具。Security+ 考试涉及多种可获取磁盘映像的工具，包括`dd`、`FTK\
  \ Imager`和`WinHex`。\n\n在 Linux 中，`dd` 是一个命令行实用程序，允许您为取证或其他目的创建映像。`dd` 命令行接受输入，如输入位置（`if`）、输出位置（`of`）以及描述您想要执行操作的标志，例如尽管出错仍创建完整副本。\n\
  \n要将挂载为`/dev/sda`的驱动器复制到名为`example.img`的文件，可以执行如下命令：\n\n```\ndd if=/dev/sda of=example.img\
  \ conv=noerror,sync\n```\n\n其他设置通常有助于获得更好的性能，例如设置适合驱动器的块大小。如果您想将 `dd` 用于取证目的，值得投入额外时间学习如何使用针对您用于取证工作站的设备和接口的块大小设置来调整其性能。\n\
  \n`FTK Imager` 是一款用于创建取证映像的免费工具。它支持原始（`dd`）格式，以及 `SMART`（ASR Data 的 SMART 取证工具格式）、`E01`（EnCase）和\
  \ `AFF`（高级取证格式）等取证工具常用的格式。了解您需要为分析工具生成什么格式，以及是否可能需要多种格式的副本，在设计取证流程时非常重要。\n\n`FTK\
  \ Imager` 支持物理驱动器、逻辑驱动器、映像文件、文件夹以及多 CD/DVD 卷。在大多数情况下，取证采集可能来自物理或逻辑驱动器。图 15.3 显示了使用\
  \ `FTK Imager` 从物理驱动器完成映像创建的过程。注意匹配且经过验证的 MD5 和 SHA1 哈希值，以及确认没有坏块（这将表明潜在的数据丢失或驱动器问题）。\n\
  \n![图 15.3 FTK Imager 映像完成输出](img/c15f003.png)\n\n**图 15.3 FTK Imager 映像完成输出**\n\
  \n\n\n\n##### 获取实时内存\n\n除了驱动器成像工具外，取证分析师有时还会被要求捕获系统的实时内存。除了驱动器镜像，`FTK Imager` 还可以从系统捕获实时内存，如图\
  \ 15.4 所示。在这里，简单的 GUI 允许您选择文件的保存位置、文件名、是否包含用于虚拟内存的系统页面文件，以及是否以 `AD1` 原生 `FTK` 文件格式保存。\n\
  \n![图 15.4 FTK Imager 的内存捕获对话框](img/c15f004.png)\n\n**图 15.4** FTK Imager 的内存捕获对话框\n\
  \n除了 `FTK Imager` 和类似的取证成像工具外，Security+ 考试还包括 `memdump`，它是用于 Linux 内存取证的 Volatility\
  \ 框架的一部分。`Memdump` 是一个命令行工具，可以使用基于进程 ID 的简单命令来捕获 Linux 内存。\n\n考试大纲列出的最后一个工具是 `WinHex`，这是一个磁盘编辑工具，也可以以原始格式获取磁盘镜像，以及其自己的专用\
  \ `WinHex` 格式。`WinHex` 可用于直接从驱动器、内存、RAID 阵列和其他文件系统读取和修改数据。\n\n##### 获取网络取证数据\n\n\
  并非所有取证数据都能在磁盘或系统上找到。网络取证的作用日益重要，无论是针对传统的有线和无线网络、蜂窝网络还是其他网络。由于网络流量是短暂的，为取证调查捕获流量通常需要直接努力提前捕获和记录数据。如果网络流量没有被主动记录，防火墙日志、`IDS`\
  \ 和 `IPS` 日志、邮件服务器日志、认证日志以及其他次要来源等取证工件可能会提供关于设备何时在网络上、发送了什么流量以及将流量发送到何处的信息。\n\n\
  当取证检查员确实处理网络流量信息时，他们经常会使用像 `Wireshark` 这样的数据包分析器来查看捕获的网络流量。对数据包、流量流和元数据的深入分析可以提供关于网络行为和内容的详细信息。\n\
  \n用于网络安全设备的相同网络抽头、SPAN 端口和端口镜像也可用于网络取证，允许将网络流量的副本发送到收集服务器。虽然这很有用，但也可能导致海量数据。捕获所有或选定的网络流量是大多数组织为特定目的而保留的过程，而非常规做法。相反，大多数组织最终依赖日志、元数据、流量流信息和其他常见收集的网络信息来支持取证活动。\n\
  \n##### 从其他来源获取取证信息\n\n除了您迄今为止了解的取证获取类型外，还有两种特定类型的获取越来越常见。从虚拟机获取需要额外的规划。与服务器、台式机或笔记本电脑不同，虚拟机通常运行在共享环境中，移除该系统会导致多个其他服务和服务中断。同时，为整个底层虚拟化主机创建镜像将包含比正在进行的取证调查所需或适当的更多的数据和系统。幸运的是，虚拟机快照将提供取证分析师所需的信息，并且可以被捕获，然后使用可用工具导入到取证工具中。\n\
  \n**容器** 的使用显著增长，并为取证检查员带来了新的挑战。由于容器被设计为短暂的，且其资源通常是共享的，因此它们产生的取证工件比虚拟机或物理机少。事实上，虽然容器可以被暂停，但捕获它们并将其恢复到取证合规的状态可能具有挑战性。容器取证需要额外的规划，取证和事件响应工具正变得可用以支持这些需求。\n\
  \n##### 验证取证数据完整性\n\n一旦您获取了取证数据，就需要在开始取证分析之前确保您拥有一个完整、准确的副本。同时，记录数据的**来源**，并确保数据和过程不可抵赖（**不可抵赖性**），也很重要。\n\
  \n验证取证副本与原始副本匹配的最常用方法是创建副本的**哈希值**和原始驱动器的哈希值，然后进行比较。如果哈希值匹配，则取证副本与原始副本完全相同。虽然 `MD5`\
  \ 和 `SHA1` 在攻击者可能介入的场景中已基本淘汰，但它们对于快速哈希取证镜像仍然有用。提供两个驱动器的 `MD5` 或 `SHA1` 哈希值，以及所用过程和程序的文档，是建立副本来源的常见部分。哈希值和其他相关信息将作为案件的保管链和取证文档的一部分进行存储。\n\
  \n手动创建镜像文件或驱动器的哈希值只需将哈希工具指向它即可。以下是在 Linux 系统上挂载为 `/dev/sdb` 的驱动器和当前目录下的镜像文件的哈希示例。为输出选择的文件名是\
  \ `drive1.hash`，但可以是您选择的任何文件名。\n\n```\nmd5sum /dev/sdb > drive1.hash\n```\n\n或\n\
  \n```\nmd5sum image_file.img > drive1.hash\n```\n\n驱动器或镜像的哈希值也可以用作**校验和**，以确保其未被更改。只需重新哈希驱动器或镜像并比较生成的值，如果发生更改，哈希值将会不同，从而告知您是否发生了更改。\n\
  \n仔细记录案件是取证过程的关键部分，图 15.5 显示了像 `FTK Imager` 这样的工具如何内置对文档的支持。将镜像与案件编号关联，并包含创建文件的检查员详细信息，有助于取证文档记录。\n\
  \n![图 15.5 FTK Imager 的证据项文档](img/c15f005.png)\n\n**图 15.5** FTK Imager 的证据项文档\n\
  \n记录来源，即镜像或驱动器来自何处以及发生了什么，对于呈现取证分析至关重要。取证套件具有内置的文档记录流程来协助此项工作，但包括图片、书面笔记以及关于保管链、创建和分析取证镜像的过程和步骤的文档在内的手动流程，可以产生一套强有力的文档，以提供适当的来源信息。有了这样的文档，您可以帮助确保不当处理或流程不会导致镜像或过程被抵赖，从而导致法律诉讼失败或无法支持刑事或民事指控。\n\
  \n##### 数据恢复\n\n除了取证分析外，取证技术还可用于从驱动器和设备恢复数据。事实上，由于意外删除和系统问题或错误，文件恢复是组织的常见需求。\n\n\
  在许多情况下恢复数据的能力依赖于这样一个事实：从驱动器或设备删除文件是非破坏性的。换句话说，当文件被删除时，使空间可用的最快方法是简单地从驱动器的文件索引中删除文件的信息，并在需要时允许重用该空间。Windows\
  \ 中的快速格式化驱动器仅删除文件索引，而不是覆盖或擦除驱动器，其他操作系统的行为也类似。因此，使用恢复工具或手动方式恢复文件需要检查驱动器，根据文件头或元数据查找文件，然后恢复这些文件和文件片段。\n\
  \n\n\n\n\n### 数字取证：部分覆写、取证套件、报告与情报\n\n#### 部分覆写与松散空间\n\n在文件被部分覆写的情况下，仍有可能恢复文件的片段。文件以块为单位存储，块的大小取决于驱动器和操作系统。如果一个\
  \ 100 兆字节长的文件被删除，然后被一个 25 兆字节的文件部分覆写，那么原始文件的 75 兆字节内容仍有可能被恢复。\n\n当文件被故意删除以试图隐藏证据时，取证分析师依赖这一特性，他们将驱动器上的可用空间称为\
  \ `slack space`（松散空间/闲置空间）。松散空间分析对取证分析至关重要，因为它能提供关于驱动器上先前发生活动的大量数据。\n\n反取证技术和数据安全最佳实践在这种情况下是一致的，都建议覆写已删除的数据。安全删除工具内置于许多操作系统中，也可作为独立工具获取。如果文件已被安全删除并因此被覆写，假设工具运行成功，则几乎没有恢复的可能。\n\
  \n#### 取证套件与取证案例示例\n\nSecurity+ 考试涉及单一取证套件：`Autopsy`。`Autopsy` 是一款开源取证套件，功能广泛。使用像\
  \ `Autopsy` 这样的工具进行取证活动，通常始于创建一个新案例，录入调查人员信息、案件详情及其他对追踪调查至关重要的细节，随后将文件导入案例中。本示例使用了\
  \ NIST 计算机取证参考数据集 (CFReDS) 的“犀牛狩猎”磁盘竞赛镜像。“犀牛狩猎”包含一个小型镜像文件和三个可在 `Wireshark` 中查看的网络追踪文件。本示例重点关注磁盘镜像文件。首先，如图\
  \ 15.6 所示，您将选择要导入的文件类型。请注意，您可以导入多种数据源，包括原始磁盘、镜像和虚拟机。\n\n![图 15.6 选择要导入的镜像或数据类型](img/c15f006.png)\n\
  \n**图 15.6** 选择要导入的镜像或数据类型\n\n导入镜像后，您可以选择将针对该文件运行的模块（图 15.7）。模块提供额外的分析能力，但也需要运行时间。幸运的是，“犀牛狩猎”是一个小型镜像，但对于较大的镜像，禁用不必要的模块是一个良好的实践。\n\
  \n![图 15.7 Autopsy 中的摄入模块](img/c15f007.png)\n\n**图 15.7** Autopsy 中的摄入模块\n\n模块处理完文件后，您便可以使用\
  \ `Autopsy` 对其进行分析。模块有助于快速发现取证工件。事实上，当文件发现模块加载时，与该狩猎相关的犀牛图片之一会立即显示出来，同时显示的还有作为练习一部分插入镜像中的鳄鱼图片。图\
  \ 15.8 展示了发现工具找到的图片。\n\n尽管此类工具拥有许多功能，但时间线非常重要，`Autopsy` 的时间线功能允许您查看文件系统更改和事件发生的时间。如果您知道事件发生的时间，或者需要作为调查一部分查找事件，这将特别有用。一旦您知道某人活跃的时间或事件开始的时间，就可以查看该时间附近发生的更改。您还可以利用时间线识别活跃时段，这些时段发生的其他事件可能值得进一步审查。图\
  \ 15.9 展示了 `Autopsy` 时间线有助于发现的部分内容，显示了所选时间范围内的两处文件更改。对这些时间点的进一步调查很可能会揭示与案件相关的活动。\n\
  \n![图 15.8 使用 Autopsy 文件发现工具识别调查中的图片](img/c15f008.png)\n\n**图 15.8** 使用 Autopsy\
  \ 文件发现工具识别调查中的图片\n\n取证套件还有许多其他有用的功能，从分布式加密破解、哈希破解、隐写编码检测（以发现隐藏在图片中的数据），到许多其他超出 Security+\
  \ 考试范围的能力。\n\n![图 15.9 Autopsy 中的时间线分析以识别与调查相关的事件](img/c15f009.png)\n\n**图 15.9**\
  \ Autopsy 中的时间线分析以识别与调查相关的事件\n\n#### 报告\n\n尽管数字工件和证据的分析对取证流程很重要，但最终产出的报告才是关键成果。报告需要实用，并包含相关信息，而不必深究分析师在调查过程中可能发现的每一个技术细节和细微差别。\n\
  \n一份典型的取证报告将包括：\n\n*   取证调查及发现的摘要。\n*   取证流程大纲，包括所用工具以及对工具或流程所做的任何假设。\n*   一系列章节，详细说明针对每个设备或驱动器的发现。共享发现时准确性至关重要，结论必须有证据和适当的细节作为支撑。\n\
  *   比摘要更详细的建议或结论。\n\n取证从业者还可能提供一份包含完整分析细节的报告，作为其文档包的一部分。\n\n#### 数字取证与情报\n\n尽管大多数组织的数字取证工作主要用于法律案件、内部调查和事件响应，但数字取证在战略情报和反情报工作中也发挥着作用。分析对手行动和技术的能力，包括高级持续性威胁\
  \ (APT) 工具和流程的组件与行为，已成为国家防御和情报机构武器库中的关键工具。同时，当系统和设备被恢复或获取时，取证能力可用于情报行动，使取证从业者能够恢复数据并将其提供给情报组织进行分析。\n\
  \n传统取证从业者使用的许多工具，也是情报和反情报组织工具集的一部分。除了这些能力外，它们还需要破解加密的高级方法、分析软硬件的能力，以及从设计上旨在抵抗或完全阻止典型取证流程中篡改行为的系统和设备中恢复数据的能力。\n\
  \n### 摘要\n\n数字取证在法律案件、刑事调查、内部调查、事件响应和情报活动中发挥着作用。对大多数组织而言，法律保全、电子取证、内部调查和事件响应是最常见的用途。法律保全是对方律师发出的通知，要求保留可能与当前或待决案件相关的数据。使用像\
  \ `EDRM` 这样的取证模型有助于确保您的取证和保全流程规划周全且执行得当。\n\n取证数据获取具有时间敏感性，因此分析师必须了解系统的易失性顺序，该顺序标识了如果不优先保存，最有可能发生变化或丢失数据的目标。在整个获取过程和取证生命周期中，维护证据保管链有助于确保证据在法庭上具有可采性。\n\
  \n云服务给取证工作增加了额外的复杂性。除了可能导致无法进行直接取证调查的技术顾虑外，还需考虑合同和策略因素。许多组织现在在新第三方和云服务的合同流程中，评估审计权条款、监管和管辖权顾虑，以及数据泄露通知时限。\n\
  \n\n\n\n\n### 采集工具与取证套件\n\n采集工具和取证套件提供收集取证镜像和数据的能力，并利用强大的功能（如图像和文档的自动识别、时间线分析等）对其进行分析。哈希计算和验证可确保获取的镜像完好无损，而与源数据匹配有助于确保取证数据在法庭上具有可采性。\n\
  \n报告发生在取证分析的最后阶段，必须完整无缺，并记录针对取证证据得出的每个结论或陈述的推理依据。标准的取证报告格式有助于确保读者知道预期内容，并能轻松理解所呈现的信息。\n\
  \n取证技术的用途不仅限于调查和事件响应。它们在情报和反情报活动中也发挥着作用。情报机构可能会使用取证技术获取信息，或通过检查其他组织留下的工具和痕迹来对抗其活动。\n\
  \n### 考试要点\n\n**法律保留和电子取证驱动部分取证活动。** 组织面临法律诉讼，需要响应法律保留，这要求它们为正在进行或待决的案件保存和保护相关信息。电子取证流程也要求将取证数据和其他数据作为法律案件的一部分提供。组织必须建立相应的能力和技术，以适当的方式响应这些要求，从而避免在法庭上败诉。\n\
  \n**易失性顺序用于确定优先采集的内容。** 在取证采集过程中，不同的系统组件和资源被更改或丢失的可能性各不相同。因此，取证从业者参考易失性顺序来确定什么最易失、什么最不易失。`CPU\
  \ cache`（CPU 缓存）和寄存器通常最易失，其次是进程表、`ARP cache`（ARP 缓存）、内核统计数据等。接下来是系统 `RAM`；临时文件和交换空间、硬盘上的数据；远程日志；最后是备份，这些都属于易失性较低的数据。你的取证采集流程应考虑易失性顺序，并结合采集过程的具体情况来决定优先捕获的内容。\n\
  \n**必须在需要取证响应之前解决云环境问题。** 由于云环境通常托管在第三方基础设施中，直接进行取证的能力往往不可用。组织可能需要在合同中约定相关能力，包括审计权条款、监管和管辖权选择，以及数据泄露通知要求和时限。\n\
  \n**采集工具有很多选择，选择合适的工具需要结合技术需求和技能组合。** 镜像采集工具提供使用逐位复制方法复制磁盘和卷的能力，这将捕获完整的镜像，包括未使用的空间（即松散空间）。工具的复杂程度从内置的\
  \ Linux `dd` 实用程序，到可以处理驱动器和内存采集的免费工具如 `FTK Imager` 不等。商业工具 `WinHex` 除了采集功能外，还提供额外的驱动器分析功能。当需要采集网络数据时，`Wireshark`\
  \ 和其他网络分析器可发挥作用以捕获和分析数据。最后，采集虚拟机和容器可能需要专门的工具和实践，这些实践和程序需要在取证检查变得必要之前就被识别和演练，以确保工具和能力到位。\n\
  \n**取证套件提供的功能使调查更轻松、更完整。** 取证套件（如 `Autopsy`）提供管理和组织调查的工具，以及一套完整的工具集。这些工具通常包括摄入、分析和自动识别常见取证目标（如图像、Office\
  \ 文档、文本文件和类似痕迹）的能力。它们还提供时间线分析功能、协助报告和取证数据标记的工具，以及广泛的其他对取证检查有用的功能。虽然 `Autopsy` 只是一个例子，但市面上广泛提供具有高级功能的商业工具。\n\
  \n**验证获取的数据有助于保持其可采性。** 对驱动器和镜像进行哈希计算可确保获取的数据与其源匹配。尽管 `MD5` 和 `SHA1` 都存在问题，取证从业者仍普遍继续使用它们，因为对抗性技术在取证检查中很少出现。校验和可用于确保数据未被更改，但它们无法创建哈希值用于为取证痕迹提供的唯一指纹。\n\
  \n**取证报务必条理清晰、切中要害。** 取证分析并不在设备和驱动器的技术检查结束时终止。取证报告总结关键发现，然后解释流程、程序和工具，以及影响调查的任何局限性或假设。接下来，它们用适当的证据和细节详述取证发现，以解释结论是如何得出的。最后，它们给出比摘要更详细的建议或总体结论。\n\
  \n### 复习题\n\n1.  Cynthia 想要使用 Linux 命令行工具制作驱动器的精确副本。她应该使用什么命令？\n\n    1.  `df`\n\
  \    2.  `cp`\n    3.  `dd`\n    4.  `ln`\n\n2.  Greg 想要使用一种可直接编辑磁盘用于取证目的的工具。他可以从该列表中选择哪个商业工具？\n\
  \n    1.  `dd`\n    2.  `memdump`\n    3.  `WinHex`\n    4.  `df`\n\n3.  Gabby 想要捕获系统的页面文件。她将在哪里找到存储的页面文件？\n\
  \n    1.  在内存中\n    2.  在磁盘上\n    3.  在 CPU 寄存器中\n    4.  在设备固件中\n\n4.  以下哪项是包含\
  \ `memdump` 的内存取证工具包？\n\n    1.  `FTK Imager`\n    2.  `WinHex`\n    3.  `dd`\n\
  \    4.  `Volatility`\n\n5.  Charles 想要获取正在运行的虚拟机的取证副本。他应该使用什么技术来捕获镜像？\n\n    1.\
  \  在正在运行的机器内部运行 `dd`。\n    2.  从虚拟机宿主机使用 `FTK Imager`。\n    3.  使用虚拟机宿主机创建快照。\n\
  \    4.  在正在运行的机器内部使用 `WinHex` 创建副本。\n\n6.  Melissa 想要为取证目的捕获网络流量。她应该使用什么工具来捕获它？\n\
  \n    1.  取证套件\n    2.  `Wireshark`\n    3.  `dd`\n    4.  `WinHex`\n\n7.  Frank\
  \ 担心其取证数据的可采性。以下哪项不是他应关注的要素？\n\n    1.  取证源数据是否保持未被篡改\n    2.  做法和程序是否经得起专家审查\n\
  \    3.  证据是否与案件相关\n    4.  取证信息是否包含时间戳\n\n8.  记录证据保管或控制情况的文件叫什么？\n\n    1.  证据日志\n\
  \    2.  审计日志\n    3.  事件报告\n    4.  保管链\n\n9.  Isaac 正在对同一设施中同一事件中被攻破的两个系统进行取证分析。在分析过程中，他注意到该事件在一个系统上发生的时间似乎比另一个系统早几乎整整一小时。他最可能遇到的问题是什么？\n\
  \n    1.  攻击者花了一小时才到达第二个系统。\n    2.  一个系统设置了错误的时区。\n    3.  攻击者更改了系统时钟以干扰取证人员。\n\
  \    4.  取证工具错误地读取了时间戳。\n\n10. 什么法律概念根据位置决定涉及案件的执法机构？\n\n    1.  关联性\n    2.  不可抵赖性\n\
  \    3.  管辖权\n\n\n\n\n### 4. 可采性\n\n### 11. Michael 想要从一台正在运行的设备获取固件以进行分析。哪种方法最有可能成功？\n\
  \n1.  使用取证内存获取技术。\n2.  使用磁盘取证获取技术。\n3.  从系统中取出固件芯片。\n4.  关闭系统并引导至固件以将其复制到可移动设备。\n\
  \n### 12. Charles 需要了解某人在 PC 上执行的操作。什么是帮助他识别这些操作的最佳切入点？\n\n1.  查看系统日志。\n2.  查看事件日志。\n\
  3.  面谈该人员。\n4.  分析系统的击键日志。\n\n### 13. Maria 使用 `dd` 从硬盘获取了磁盘镜像，并希望确保其过程符合取证规范。完成复制后，她的下一步应该是什么？\n\
  \n1.  安全擦除源驱动器。\n2.  对比源驱动器和目标驱动器的哈希值。\n3.  安全擦除目标驱动器。\n4.  更新她的保管链文档。\n\n### 14.\
  \ Alex 拿到一个已被快速格式化的闪存介质设备，并被要求恢复数据。驱动器上将保留什么数据？\n\n1.  驱动器上将不保留任何数据。\n2.  文件将保留，但文件索引将不保留。\n\
  3.  文件索引将保留，但文件将消失。\n4.  文件和文件索引将保留在驱动器上。\n\n### 15. Naomi 正准备将其组织迁移到云服务，并希望确保已具备适当的合同条款。以下哪项不是她应包含的常见项目？\n\
  \n1.  审计权条款\n2.  取证检查权\n3.  管辖权选择\n4.  数据泄露通知时限\n\n### 16. Alaina 想要维护保管链文档并创建了一份表格。以下哪项不是保管链表格上的常见要素？\n\
  \n1.  物品标识编号\n2.  移交人签名\n3.  接收人签名\n4.  运输方式\n\n### 17. Henry 想要使用一套开源取证工具。他应该选择以下哪个工具？\n\
  \n1.  `Autopsy`\n2.  `EnCase`\n3.  `FTK`\n4.  `WinHex`\n\n### 18. Theresa 的组织收到了针对其文件和档案的法律保全通知。以下哪项*不是*她需要采取的行动？\n\
  \n1.  确保跟踪与案件相关的现有文档的更改，并能提供原始文档。\n2.  保留所有与案件相关的现有文档。\n3.  删除所有与案件相关的敏感文档。\n4.\
  \  防止包含与案件相关文件的备份按其正常计划被覆盖。\n\n### 19. Gurvinder 想要遵循易失性顺序来指导其取证数据获取。以下哪项易失性最低？\n\
  \n1.  `RAM`\n2.  硬盘上的数据\n3.  备份\n4.  远程日志\n\n### 20. 哈希和校验和的关键区别是什么？\n\n1.  两者都可验证完整性，但哈希还提供唯一的数字指纹。\n\
  2.  哈希可逆，校验和不可逆。\n3.  校验和提供比哈希更高的安全性。\n4.  校验和的消息冲突比哈希少。\n\n---\n\n### 第 16 章：安全策略、标准与合规\n\
  \n策略是任何网络安全计划的基础，它阐述了指导整个企业安全工作执行的原则和规则。通常，组织会基于行业团体（如美国国家标准与技术研究院 [`NIST`] 或国际标准化组织\
  \ [`ISO`]）制定的最佳实践框架来建立这些策略。在许多情况下，组织策略还受到监管机构施加的外部合规义务的影响和指导。在本章中，您将了解网络安全策略框架的重要要素。\n\
  \n### 理解策略文档\n\n组织的*信息安全策略框架*包含一系列文档，旨在描述组织的网络安全计划。这些文档的范围和复杂性差异很大，取决于组织的性质及其信息资源。这些框架通常包含四种不同类型的文档：\n\
  \n*   策略\n*   标准\n*   程序\n*   指南\n\n在本节其余部分中，您将了解每种文档类型之间的差异。但请记住，这些类别的定义在不同组织间差异很大，它们之间的界限模糊是非常常见的。虽然乍一看这似乎不正确，但这是安全理论遇到现实世界时的自然现象。只要文档达到了其预期目的，就无伤大雅。\n\
  \n#### 策略\n\n*策略*是管理意图的高层声明。遵守策略是强制性的。信息安全策略通常包含关于网络安全目标的广泛声明，包括以下内容：\n\n*   关于网络安全对组织重要性的声明\n\
  *   要求所有员工和承包商采取措施保护信息和信息系统的机密性、完整性和可用性\n*   关于组织创建和/或持有的信息所有权的声明\n*   指定首席信息安全官\
  \ (`CISO`) 或其他个人为负责网络安全事务的高管\n*   授权 `CISO` 制定实施策略的标准、程序和指南\n\n在许多组织中，制定策略的过程繁琐且需要高层批准，通常来自首席执行官\
  \ (`CEO`)。将策略声明保持在高层，使 `CISO` 具有灵活性，能够随业务和技术环境的变化调整具体的安全要求。例如，圣母大学的五页信息安全策略仅声明：\n\
  \n> 信息治理委员会将为每个高敏感数据元素创建处理标准。数据管管员可为其管辖的其他数据元素创建标准。这些信息处理标准将根据分类指定控制措施，以管理大学信息及相关资产的风险。大学所有个人均有责任遵守这些控制措施。\n\
  \n相比之下，联邦政府的医疗保险和医疗补助服务中心 (`CMS`) 拥有一份 95 页的信息安全策略。这份庞大的文件包含极其详细的要求，例如：\n\n> `CMS`\
  \ `CIO` 必须保存所有监控请求的记录，以及监控期间产生的任何其他汇总结果或文档。记录还必须通过记录搜索词和技术来反映监控的范围。从监控中收集的所有信息必须受到控制和保护，分发仅限于监控请求中指定的个人，以及\
  \ `CMS` 行政长官或 `CMS` `CIO` 特别指定的、有特定知情需求的其他个人。\n\n`CMS` 文件甚至还包含一张复杂的图表，描述了机构内个人担任的众多网络安全角色。该图表的节选见\
  \ 图 16.1。\n\n\n\n这种方法可能满足 CMS 的需求，但很难想象该文档的长期维护。冗长的安全策略往往很快就会过时，因为随着对个别要求必要的变更不断累积，员工厌倦了不断发布策略的新版本，导致这些变更被忽视。\n\
  \n![图 16.1 CMS 角色和职责图表摘录 ¶ 来源：医疗保险和医疗补助服务中心信息系统安全和隐私政策，2019 年 5 月 21 日。(www.cms.gov/Research-Statistics-Data-and-Systems/CMS-Information-Technology/InformationSecurity/Downloads/CMS-IS2P2.pdf)](img/c16f001.png)\n\
  \n**图 16.1** CMS 角色和职责图表摘录 ¶ *来源：* 医疗保险和医疗补助服务中心信息系统安全和隐私政策，2019 年 5 月 21 日。(`www.cms.gov/Research-Statistics-Data-and-Systems/CMS-Information-Technology/InformationSecurity/Downloads/CMS-IS2P2.pdf`)\n\
  \n组织通常在其信息安全策略库中包含以下文档：\n\n*   *信息安全策略*，为安全计划提供高层授权和指导。\n*   *可接受使用策略 (AUP)*，为网络和系统用户提供关于信息资源允许用途的明确指导。\n\
  *   *数据治理策略*，明确声明组织创建或使用的信息的所有权。\n*   *数据分类策略*，描述组织使用的分类结构以及用于正确分配数据分类的过程。\n*  \
  \ *数据保留策略*，概述组织将维护哪些信息，以及不同类别的工作成果在销毁前将保留多长时间。\n*   *凭据管理策略*，描述从配置、活跃使用到退役的账户生命周期。该策略应包含针对组织员工以及第三方承包商的具体要求。还应包含针对设备、服务账户和管理员/根账户使用的凭据的要求。\n\
  *   *密码策略*，规定密码长度、复杂度、重用及类似问题的要求。\n*   *持续监控策略*，描述组织的监控方法，并告知员工其在工作场所的活动将接受监控。\n\
  *   *行为准则/道德规范*，描述员工和关联方的预期行为，并涵盖策略中未专门解决的情况。\n*   *变更管理和变更控制策略*，描述组织将如何以管理网络安全和运营风险的方式审查、批准和实施对信息系统的拟议变更。\n\
  *   *资产管理*，描述组织将遵循的流程，用于将新资产（如计算机和移动设备）纳入清单、跟踪这些资产的全生命周期，并在其使用寿命结束时妥善处置。\n\n当你浏览这份清单时，你可能会注意到，所列的一些文档倾向于与我们对作为高层文档的策略的描述相冲突，并且似乎更适合下一节中标准的定义。这是一个合理的结论。CompTIA\
  \ 专门将这些项目作为信息安全策略的要素，而许多组织会将其中一些（如密码要求）移至标准文档中。\n\n### 标准\n\n*标准*提供了描述组织如何执行其信息安全策略的强制性要求。这些可能包括用于通用操作系统的特定配置设置、针对高度敏感信息必须实施的控制措施，或任何其他安全目标。标准通常在比策略更低的组织层级获得批准，因此可能会更频繁地变更。\n\
  \n例如，加州大学伯克利分校维护一份名为*电子信息最低安全标准*的详细文档，可在 `security.berkeley.edu/minimum-security-standards-electronic-information`\
  \ 在线获取。该文档将信息划分为四个不同的数据保护级别 (DPL)，然后使用详细矩阵描述不同级别数据所需的控制、可选的控制和不需要的控制。该矩阵的摘录见图 16.2。\n\
  \n该标准随后为这些要求中的每一项提供了详细描述，并定义了要求中使用的术语。例如，图 16.2 中的要求 3.1 仅写着“安全配置”。文档后面对此进行了扩展，写道“资源管理者必须根据行业标准，为硬件、软件和操作系统使用管理良好的安全配置。”它进一步将“管理良好”定义为包括以下内容：\n\
  \n![图 16.2 UC Berkeley 电子信息最低安全标准摘录 ¶ 来源：加州大学伯克利分校电子信息最低安全标准](img/c16f002.png)\n\
  \n**图 16.2** UC Berkeley 电子信息最低安全标准摘录 ¶ *来源：* 加州大学伯克利分校电子信息最低安全标准\n\n*   设备必须在部署前就已具备安全配置。\n\
  *   任何偏离既定安全配置的情况都必须经过变更管理流程批准并记录在案。必须存在一个流程，每年审查一次偏离既定安全配置的情况，以确定其持续的相关性。\n*  \
  \ 必须存在一个流程，定期检查设备的配置，并就任何变更向资源管理者发出警报。\n\n这种方法提供了一个易于读者浏览的文档层级，并根据需要提供对越来越详细信息的访问。另请注意，图\
  \ 16.2 中的许多要求行都提供了指向指南的链接。点击这些链接会进入针对受此策略约束的组织的建议，开头文字如下：\n\n> UC Berkeley 安全策略强制要求处理受保护数据的设备遵守电子信息最低安全标准。以下建议作为可选指南提供。\n\
  \n这是信息安全策略框架三个要素协同工作的完美例子。策略规定了安全计划的高层目标，并要求遵守标准，标准中包含所需安全控制的细节。指南为寻求遵守策略和标准的组织提供建议。\n\
  \n在某些情况下，组织可能在拥有公认标准的行业中运营，组织必须遵循这些标准，或选择遵循作为最佳实践。未能遵循行业最佳实践可能被视为疏忽，并可能给组织带来法律责任。本章后面讨论的标准框架中表达了许多此类行业标准。\n\
  \n#### 程序\n\n*程序*是个人和组织在特定情况下必须遵循的详细分步流程。程序类似于清单，确保实现安全目标的过程一致。组织可能会为构建新系统、向生产环境发布代码、响应安全事件以及许多其他任务创建程序。遵守程序是强制性的。\n\
  \n\n\n例如，Visa 发布了一份名为*《发生泄露时该怎么办》* (`usa.visa.com/dam/VCOM/download/merchants/cisp-what-to-do-if-compromised.pdf`)\
  \ 的文档，其中规定了怀疑信用卡泄露的商户必须遵循的强制性流程。尽管该文档标题中不包含“程序”一词，但其引言明确指出，该文档“确立了报告和应对疑似或已确认的泄露事件的程序和时间表”。该文档提供了涵盖事件响应以下领域的要求：\n\
  \n*   在三天内通知 Visa 发生的事件\n*   向 Visa 提供初步调查报告\n*   通知其他相关方\n*   向 Visa 提供泄露的支付账户数据\n\
  *   进行 PCI 取证调查\n*   进行独立调查\n*   保存证据\n\n这些部分中的每一部分都提供了详细信息，说明 Visa 期望商户如何处理事件响应活动。例如，取证调查部分描述了支付卡行业取证调查员\
  \ (PFI) 的使用，内容如下：\n\n> 发现账户数据泄露或收到独立取证调查通知后，实体必须：\n>\n> *   在五 (5) 个工作日内聘用 PFI（或签署合同）。\n\
  > *   自聘用 PFI（或签署合同）之日起十 (10) 个工作日内，向 Visa 提供初步取证（即预备）报告。\n> *   在审查完成后十 (10) 个工作日内，向\
  \ Visa 提供最终取证报告。\n\n这种措辞几乎不留解释空间。Visa 制定了清晰且强制性的程序，规定了商户必须采取的行动、应聘用的调查员类型，以及完成不同里程碑的时间表。\n\
  \n组织通常在其政策框架中包含以下程序：\n\n*   *监控程序*，描述组织将如何执行安全监控活动，包括可能使用持续监控技术\n*   *证据生成程序*，描述组织将如何响应传票、法院命令及其他要求出示数字证据的合法请求\n\
  *   *补丁程序*，描述对组织管辖范围内的应用程序和系统应用补丁的频率和流程\n\n当然，根据组织的运营需求，网络安全团队可能决定在其框架中包含许多其他类型的程序。\n\
  \n#### 指南\n\n*指南* 提供与特定概念、技术或任务相关的最佳实践和建议。遵守指南并非强制性的，指南旨在提供有益的建议。也就是说，指南的“可选性”可能因组织文化的不同而有很大差异。\n\
  \n2016 年 4 月，华盛顿州首席信息官 (CIO) 发布了一份 25 页的文档，提供关于州政府机构使用电子签名的指南。该文档并非旨在具有强制性，而是为寻求采用电子签名技术的机构提供建议。文档以目的部分开篇，概述了指南的三个目标：\n\
  \n1.  帮助机构确定其是否以及在何种程度上将实施电子记录和电子签名并依赖它们。\n2.  为机构提供可用于建立管辖其使用和接受数字签名的政策或规则的信息。\n\
  3.  根据州法律，为机构与首席信息官办公室 (OCIO) 共享其政策提供指导。\n\n前两个既定目标完全符合指南的功能。“帮助机构确定”和“为机构提供信息”等措辞在指南文档中很常见。它们没有任何强制性，事实上，指南明确指出华盛顿州法律“不强制要求任何州政府机构接受或要求电子签名或记录。”\n\
  \n第三个目标包含在指南中似乎有点奇怪。“提供指导”等措辞更常见于政策和程序中。浏览文档后发现，与该目标相关的文本在 25 页的文档中仅占一个段落：\n\n>\
  \ 首席信息官办公室在 `OCIO.wa.gov` 网站上维护一个页面，列出各机构电子签名和记录提交政策的链接。机构发布其政策后，应将链接和机构联系信息通过电子邮件发送至\
  \ OCIO 政策邮箱。该信息将在 5 个工作日内添加到该页面。机构负责在信息发生变更时通知 OCIO。\n\n读完这段文字，文本确实似乎明确概述了一个强制性程序，根据严格定义，这不适合包含在指南文档中。然而，起草该文档的委员会很可能认为，将这段解释性文本包含在相关指南中，比为一项相当琐碎和简单的任务单独起草一份程序文档，对读者来说方便得多。\n\
  \n#### 例外与补偿控制\n\n在采用新的安全政策、标准和程序时，组织还应提供一套针对这些规则的例外机制。不可避免地，会出现需要偏离要求的不可预见情况。政策框架应明确规定获得例外的具体要求，以及拥有批准例外权力的个人或委员会。\n\
  \n华盛顿州采用的例外流程要求申请人记录以下信息：\n\n*   需要例外的标准/要求\n*   不符合要求的原因\n*   例外的业务和/或技术理由\n* \
  \  例外的范围和持续时间\n*   与例外相关的风险\n*   缓解与例外相关风险的任何补充控制的描述\n*   达成合规的计划\n*   任何未缓解风险的识别\n\
  \n许多例外流程要求使用*补偿控制*来缓解与安全标准例外相关的风险。支付卡行业数据安全标准 (PCI DSS) 包含当今使用的最正式的补偿控制流程之一。它规定了补偿控制令人满意必须满足的三个标准：\n\
  \n1.  该控制必须满足原始要求的意图和严格程度。\n2.  该控制必须提供与原始要求相似的防御级别，使补偿控制足以抵消原始 PCI DSS 要求旨在防御的风险。\n\
  3.  该控制必须“超出”其他 PCI DSS 要求。\n\n例如，组织可能发现需要在特定机器上运行过时版本的操作系统，因为运行业务所需的软件仅能在该操作系统版本上运行。大多数安全政策会禁止使用过时的操作系统，因为它可能容易受到安全漏洞的影响。组织可以选择将该系统运行在一个隔离网络上，且仅具有极少或没有对其他系统的访问权限，作为一种补偿控制。\n\
  \n\n\n\n##### 补偿性控制\n\n其总体思路是，当组织无法满足原始控制要求时，补偿性控制会寻找替代手段来实现目标。尽管 PCI DSS 为补偿性控制提供了一个非常正式的流程，但使用补偿性控制是许多不同组织的常用策略，即使是那些不受\
  \ PCI DSS 约束的组织也是如此。补偿性控制平衡了这样一个事实：在任何情况下都无法实施每一项必需的安全控制，同时又要将风险管理到最大可行程度。\n\n在许多情况下，组织采用补偿性控制来应对安全要求的临时例外。在这些情况下，组织还应制定补救计划，旨在使组织重新符合原始控制的字面要求和精神实质。\n\
  \n### 人员管理\n\n组织的员工需要访问信息和系统以履行其指定的工作职能。随之而来的风险是，员工可能通过故意或意外的行为，成为网络安全事件的源头。遵循人员管理最佳实践的组织可以降低以员工为中心的安全风险的可能性和影响。\n\
  \n#### 最小权限\n\n`least privilege`（最小权限）原则规定，个人应仅被授予执行其工作职能所必需的最小权限集合。最小权限的概念很简单，但在实践中有时难以实施。它要求仔细关注执行特定工作所需的特权，并持续关注以避免安全问题。权限蔓延就是这些问题之一，当员工在组织内部从一个岗位调动到另一个岗位，积累了新的特权，但从未撤销与过往职责相关的特权时，就会发生这种情况。\n\
  \n### 职责分离\n\n组织可能会为极其敏感的工作职能实施 `separation of duties`（职责分离）。职责分离将两个不同的任务（当它们结合在一起时具有高度敏感性）分开，并制定一条规则：任何单个人不得拥有同时执行这两项任务所需的特权。\n\
  \n职责分离最常见的例子出现在会计领域。如果会计团队的个人决定挪用资金，他们会对组织构成风险。他们可能会通过在会计系统中创建一个由他们控制的公司名称的新供应商，然后通过正常的开支票流程向该供应商开具支票来实施盗窃。\n\
  \n组织可以通过识别创建新供应商和开具支票这两项权限结合使用时具有敏感性，并对它们实施职责分离来管理这种风险。在这种情况下，任何单个个人都不拥有同时创建新供应商和开具支票的权限。试图以这种方式窃取资金的会计员工现在需要勾结至少另一名员工，从而降低了欺诈活动的风险。\n\
  \n`Two-person control`（双人控制）是一个与职责分离相似的概念，但有一个重要区别：双人控制不是防止同一个人持有两项结合使用时敏感的不同特权，而是要求两人参与才能执行单一敏感操作。\n\
  \n#### 岗位轮换和强制休假\n\n组织还采取其他措施来降低单个员工实施欺诈活动的风险。其中两项做法侧重于通过将欺诈行为暴露给其他员工，在事后发现欺诈行为。\n\
  \n`Job rotation`（岗位轮换）做法将担任敏感角色的员工定期调动到组织中的其他职位。这项工作的动力在于，许多类型的欺诈都需要持续的隐瞒活动。如果一个人实施了欺诈，随后被调离原有岗位，由于权限的变化，他们可能无法继续那些隐瞒活动，而他们的替任者可能会自行发现欺诈。\n\
  \n`Mandatory vacations`（强制休假）通过强制员工每年休假一周或更长的连续时间，并在休假期间撤销其访问特权，起到类似的作用。\n\n####\
  \ 清洁桌面\n\n`Clean desk policies`（清洁桌面政策）旨在通过限制无人看管的员工桌面上遗留的纸质文件数量，保护敏感信息的机密性。实施清洁桌面政策的组织要求员工在离开工位前保管好所有文件和其他材料。\n\
  \n#### 入职和离职\n\n组织应为新员工入职时的 `onboarding`（入职）和员工被解雇或辞职时的 `offboarding`（离职）制定标准化流程。这些流程确保组织保持对其资产的控制，并有序地处理凭证和特权的授予与撤销。\n\
  \n新员工入职流程还应包括 `background checks`（背景调查），旨在发现任何犯罪活动或其他过往行为，这些行为可能表明潜在员工对组织构成未被发现的风险。\n\
  \n#### 保密协议\n\n保密协议（NDA）要求员工保护其在受雇过程中获得的任何机密信息。组织通常要求新员工入职时签署 NDA，并定期提醒员工其在 NDA\
  \ 下的责任。离职流程通常涉及离职面谈，其中包括最后提醒员工即使在与组织的隶属关系结束后，仍有责任遵守 NDA 的条款。\n\n### 社交媒体\n\n组织可以选择采用社交媒体政策来约束员工在社交媒体上的行为。组织进行的社交媒体分析可能包括对个人和专业账户的评估，因为这些活动可能对组织产生正面或负面的影响。组织应在社交媒体政策中明确其期望和做法。\n\
  \n#### 用户培训\n\n组织内的用户应定期接受安全意识培训，以确保他们了解与计算环境相关的风险，以及他们在将这些风险降至最低方面所扮演的角色。强有力的培训计划利用多种培训技术，包括使用\
  \ `computer-based training (CBT)`（基于计算机的培训）。\n\n并非每个用户都需要相同级别的培训。组织应使用 `role-based\
  \ training`（基于角色的培训），以确保个人根据其工作职责接受适当级别的培训。例如，系统管理员应接受详细且高度技术性的培训，而客户服务代表则需要较少的技术培训，并更多地关注他们在工作中可能遇到的社会工程学和借口攻击。\n\
  \n网络钓鱼攻击通常针对组织各个层级的用户，每个安全意识计划都应包含特定的反网络钓鱼活动，旨在帮助用户识别可疑请求并做出适当响应。这些活动通常涉及使用 `phishing\
  \ simulations`（网络钓鱼模拟），向用户发送伪造的网络钓鱼消息以测试他们的技能。点击模拟网络钓鱼消息的用户将被引导至一个培训计划，旨在帮助他们更好地识别欺诈性消息。\n\
  \n\n\n\n安全意识培训通常还包含 `gamification`（游戏化）元素，旨在使培训更加有趣，并帮助用户记住活动的核心信息。`Capture the\
  \ flag (CTF)`（夺旗赛）练习就是一个很好的例子。CTF 项目让技术人员相互对抗，尝试攻击系统并实现特定目标，例如窃取敏感文件。CTF 练习的参与者能够体会攻击者的技术，并学习如何更好地防御自己的系统以抵御类似攻击。\n\
  \n### 第三方风险管理\n\n组织面临的许多风险来自与其开展业务的第三方组织。这些风险可能源于组织供应链中某处产生的供应商关系，也可能源于其他业务合作伙伴关系。组织可以部署一些标准协议和实践来管理这些风险。常用的协议包括以下内容：\n\
  \n*   `Master service agreements (MSA)`（主服务协议）为供应商在较长时期内与组织开展的工作提供一份总括性合同。MSA 通常包含详细的安全和隐私要求。每当组织与供应商启动新项目时，可再创建一份\
  \ `statement of work (SOW)`（工作说明书），其中包含特定于项目的详细信息并引用 MSA。\n\n*   `Service level\
  \ agreements (SLA)`（服务级别协议）是书面合同，规定供应商将提供的服务条件，以及供应商未能满足 SLA 时客户可获得的补救措施。SLA 通常涵盖系统可用性、数据持久性和响应时间等问题。\n\
  \n*   `memorandum of understanding (MOU)`（谅解备忘录）是一份记录关系各方面内容的函件。MOU 是一种非正式机制，允许双方记录其关系以避免未来的误解。MOU\
  \ 通常用于内部服务提供商向同一公司不同业务单元的客户提供服务的情况。\n\n*   `Business partnership agreements (BPAs)`（业务合作伙伴协议）存在于两个组织同意以合作伙伴关系开展业务时。例如，如果两家公司联合开发和推广产品，BPA\
  \ 可能会规定每个合作伙伴的责任和利润分配。\n\n组织需要选择最适合其特定情况的协议类型。\n\n#### 终止供应商关系\n\n凡事皆有终结，第三方关系也不例外。组织应采取措施，确保在供应商关系结束或供应商停止组织所依赖的产品或服务时，能够有序过渡。这应包括双方将遵循的具体步骤，以便在供应商宣布产品\
  \ `end of life (EOL)`（生命周期结束）或服务 `end of service life (EOSL)`（服务生命周期结束）时实现有序过渡。如果组织自行决定停止使用该产品或服务，也可遵循这些相同步骤。\n\
  \n### 遵守法律法规\n\n由于网络安全缺陷对个人、政府和社会的潜在影响，世界各地的立法者和监管机构都对网络安全感兴趣。欧盟 (EU) 拥有广泛的数据保护法规，而美国的网络安全分析师则被迫应对覆盖不同行业和信息类别的零散安全法规拼凑而成的体系。\n\
  \n组织面临的一些主要信息安全法规包括：\n\n*   `Health Insurance Portability and Accountability Act\
  \ (HIPAA)`（健康保险流通与责任法案）包含影响美国医疗服务提供者、健康保险公司和医疗信息交换中心的安全和隐私规则。\n\n*   `Payment Card\
  \ Industry Data Security Standard (PCI DSS)`（支付卡行业数据安全标准）提供了关于信用卡和借记卡信息的存储、处理和传输的详细规则。PCI\
  \ DSS 不是法律，而是一项适用于全球信用卡商户和服务提供商的合同义务。\n\n*   `Gramm–Leach–Bliley Act (GLBA)`（格雷姆-里奇-比利雷法案）涵盖广义定义的美国金融机构。它要求这些机构拥有正式的安全计划，并指定一名对该计划负总责的个人。\n\
  \n*   `Sarbanes–Oxley (SOX) Act`（萨班斯-奥克斯利法案）适用于美国上市公司的财务记录，要求这些公司对存储和处理这些记录的 IT\
  \ 系统具有高度的保证。\n\n*   `General Data Protection Regulation (GDPR)`（通用数据保护条例）在全球范围内为欧盟居民的个人信息实施安全和隐私要求。\n\
  \n*   `Family Educational Rights and Privacy Act (FERPA)`（家庭教育权利和隐私法案）要求美国教育机构为学生教育记录实施安全和隐私控制。\n\
  \n*   各种 `data breach notification laws`（数据泄露通知法）描述了各州对遭受数据泄露的组织在通知受影响个人方面的要求。\n\
  \n请记住，这只是安全法规的简要列表。还有许多其他法律和义务适用于特定行业和数据类型。在为组织设计合规策略时，您应始终咨询组织的法律顾问和主题专家。您需要了解适用于您业务的各种国家、领地和州法律，且在解读和应用网络安全法规到您特定的业务和技术环境时，资深律师的建议至关重要。\n\
  \n### 采用标准框架\n\n从零开始开发网络安全计划是一项艰巨的任务。组织将拥有各种各样的控制目标和工具来实现这些目标。面临开发新安全计划或评估现有计划任务的团队，如果没有路线图，可能会发现很难覆盖大量领域。幸运的是，有几个标准安全框架可协助完成此任务，并为开发网络安全计划提供标准化方法。\n\
  \n##### NIST 网络安全框架\n\n美国国家标准与技术研究院 (NIST) 负责制定美国联邦政府各部门的网络安全标准。他们在此过程中产生的指导和标准文件通常广泛适用于私营部门，并常被非政府安全分析师引用，因为这些文件属于公共领域且质量通常非常高。\n\
  \n2018 年，NIST 发布了 1.1 版网络安全框架 (CSF)，旨在协助组织实现以下五个目标中的一个或多个：\n\n*   描述其当前的网络安全状况。\n\
  *   描述其网络安全的目标状态。\n*   在持续且可重复的流程背景下，识别并确定改进机会的优先级。\n*   评估向目标状态迈进的进度。\n*   在内部和外部利益相关者之间就网络安全风险进行沟通。\n\
  \nNIST 框架包含三个组件：\n\n*   框架核心（如 图 16.3 所示）是一组适用于所有行业和部门的五大安全功能：识别、保护、检测、响应和恢复。框架随后将这些功能细分为类别、子类别和信息性参考资料。图\
  \ 16.4 展示了该矩阵已完成形式的一个小片段，专门针对识别 (ID) 功能和资产管理类别。如果您想查看完整填充的矩阵，请参阅 NIST 文件 `Framework\
  \ for Improving Critical Infrastructure Cybersecurity`（改善关键基础设施网络安全框架）。\n\n\n\n\n\
  ##### NIST 网络安全框架\n\n框架实施评估组织在多大程度上能够满足网络安全目标。表 16.1 显示了框架实施层级及其标准。这种方法是*成熟度模型*的一个示例，它描述了组织在进步连续体上的当前和期望定位。在\
  \ NIST 成熟度模型中，组织被分配到四个成熟度模型层级之一。\n\n框架概况描述了特定组织可能如何处理框架核心所涵盖的安全功能。组织可能使用框架概况来描述其当前状态，然后使用单独的概况来描述其期望的未来状态。\n\
  \n![FIGURE 16.3 NIST Cybersecurity Framework Core Structure ¶ Source: Framework\
  \ for Improving Critical Infrastructure Cybersecurity, National Institute of Standards\
  \ and Technology (nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.04162018.pdf)](img/c16f003.png)\n\
  \n**图 16.3** NIST 网络安全框架核心结构 ¶ *来源：* 改进关键基础设施网络安全框架，美国国家标准与技术研究院 (`nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.04162018.pdf`)\n\
  \n![FIGURE 16.4 Asset Management Cybersecurity Framework ¶ Source: Framework for\
  \ Improving Critical Infrastructure Cybersecurity, National Institute of Standards\
  \ and Technology (nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.04162018.pdf)](img/c16f004.png)\n\
  \n**图 16.4** 资产管理网络安全框架 ¶ *来源：* 改进关键基础设施网络安全框架，美国国家标准与技术研究院 (`nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.04162018.pdf`)\n\
  \n**表 16.1** NIST 网络安全框架实施层级\n\n*来源：* 改进关键基础设施网络安全框架，美国国家标准与技术研究院\n\n| 层级 | 风险管理流程\
  \ | 集成风险管理计划 | 外部参与 |\n| --- | --- | --- | --- |\n| 第 1 层：部分 | 组织的网络安全风险管理实践未正式化，风险以临时且有时是被动的方式进行管理。\
  \ | 组织层面对网络安全风险的认识有限。由于经验各异或从外部来源获得的信息，组织以不规则、逐案的方式实施网络安全风险管理。 | 组织不了解其在更大生态系统中的角色，无论是就其依赖方还是被依赖方而言。\
  \ |\n| 第 2 层：风险知情 | 风险管理实践经管理层批准，但可能未确立为全组织范围的政策。 | 组织层面已具备网络安全风险意识，但尚未建立全组织范围的网络安全风险管理方法。\
  \ | 总体而言，组织了解其在更大生态系统中的角色，无论是就其自身的依赖方还是被依赖方而言，但不同时涵盖两者。 |\n| 第 3 层：可重复 | 组织的风险管理实践经正式批准并以政策形式表达。\
  \ | 存在全组织范围的网络安全风险管理方法。 | 组织了解其在更大生态系统中的角色、依赖方和被依赖方，并可能为社区对风险的更广泛理解做出贡献。 |\n| 第\
  \ 4 层：自适应 | 组织根据以往和当前的网络安全活动（包括吸取的教训和预测指标）调整其网络安全实践。 | 存在全组织范围的网络安全风险管理方法，该方法使用风险知情的政策、流程和程序来应对潜在的网络安全事件。\
  \ | 组织了解其在更大生态系统中的角色、依赖方和被依赖方，并为社区对风险的更广泛理解做出贡献。 |\n\nNIST 网络安全框架为组织提供了一种合理的方法，用于开发和评估其网络安全计划的状态。\n\
  \n##### NIST 风险管理框架\n\n除了 CSF，NIST 还发布了风险管理框架 (RMF)。RMF 是联邦机构的强制性标准，提供了一个正式化流程，联邦机构必须遵循该流程来选择、实施和评估基于风险的安全和隐私控制。图\
  \ 16.5 提供了 NIST RMF 流程的概览。更多详情请参阅 NIST SP 800-37《信息系统和组织风险管理框架》 (`nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-37r2.pdf`)\n\
  \n![FIGURE 16.5 NIST Risk Management Framework ¶ Source: FISMA Implementation Project\
  \ Risk Management Framework (RMF) Overview, National Institute of Standards and\
  \ Technology csrc.nist.gov/projects/risk-management/rmf-overview](img/c16f005.png)\n\
  \n**图 16.5** NIST 风险管理框架 ¶ *来源：* FISMA 实施项目风险管理框架 (RMF) 概览，美国国家标准与技术研究院 `csrc.nist.gov/projects/risk-management/rmf-overview`\n\
  \n#### ISO 标准\n\n*国际标准化组织 (ISO)* 发布了一系列标准，为网络安全和隐私提供最佳实践。在备考 Security+ 考试时，你应该熟悉四个特定的\
  \ ISO 标准：ISO 27001、ISO 27002、ISO 27701 和 ISO 31000。\n\n##### ISO 27001\n\n*ISO 27001*\
  \ 是一份标准文件，标题为“信息技术——安全技术——信息安全管理体系——要求”。该标准包含涵盖 14 个类别的控制目标：\n\n*   信息安全策略\n*  \
  \ 信息安全组织\n*   人力资源安全\n*   资产管理\n*   访问控制\n*   密码学\n*   物理和环境安全\n*   运营安全\n*   通信安全\n\
  *   系统获取、开发和维护\n*   供应商关系\n*   信息安全事件管理\n*   业务连续性管理的信息安全方面\n*   符合内部要求（如策略）和外部要求（如法律）\n\
  \nISO 27001 标准曾是最常用的信息安全标准，但在要求 ISO 合规的高度监管行业之外，其普及度正在下降。这些行业中的组织可以选择正式采用 ISO 27001\
  \ 并寻求*认证*计划，由外部评估机构验证其对标准的合规性，并认证其按照 ISO 27001 运行。\n\n##### ISO 27002\n\n*ISO 27002*\
  \ 标准超越了控制目标，描述了组织可为满足网络安全目标而实施的实际控制措施。ISO 设计这份补充文档是为了满足以下组织的需求：\n\n*   选择信息安全控制措施\n\
  *   实施信息安全控制措施\n*   制定信息安全管理指南\n\n##### ISO 27701\n\nISO 27001 和 ISO 27002 侧重于网络安全控制措施，而\
  \ *ISO 27701* 包含管理隐私控制措施的标准指南。ISO 将此文档视为其 ISO 27001 和 ISO 27002 安全标准的扩展。\n\n#####\
  \ ISO 31000\n\n*ISO 31000* 为风险管理计划提供指南。该文档不特定于网络安全或隐私，而是以通用方式涵盖风险管理，以便应用于任何风险。\n\
  \n#### 基准和安全配置指南\n\n\n\n\nNIST 和 ISO 框架是对网络安全和风险管理最佳实践的高层描述。它们不提供关于实际实施安全控制的实用指南。然而，政府机构、供应商和行业组织发布了各种基准和安全配置指南，帮助组织了解如何安全地操作常用平台，包括操作系统、Web\
  \ 服务器、应用服务器和网络基础设施设备。\n\n这些基准和配置指南深入到安全操作常用系统的细节。例如，图 16.6（下一页）显示了 Windows Server\
  \ 2019 安全配置基准的摘录。\n\n图 16.6 中显示的摘录来自 *Center for Internet Security (CIS)*，这是一个发布数百个常用平台基准的行业组织。为了让你了解所涉及的详细程度，图\
  \ 16.6 显示了一个包含 993 页的文档中的一页部分，该文档详细说明了 Windows Server 2019 的适当安全设置。\n\n### 安全控制验证与质量控制\n\
  \n质量控制程序验证组织是否已建立足够的安全控制，以及这些安全控制是否正常运行。每个安全计划都应包含定期进行内部安全控制测试的程序，并辅以对组织安全计划的正式评估。这些评估可能采取两种不同形式：审计和评估。\n\
  \n![FIGURE 16.6 Windows Server 2019 Security Benchmark Excerpt ¶ Source: Center\
  \ for Internet Security (CIS) (cisecurity.org/cis-benchmarks)](img/c16f006.png)\n\
  \n**图 16.6** Windows Server 2019 安全基准摘录 ¶ *来源：* Center for Internet Security (CIS)\
  \ (`cisecurity.org/cis-benchmarks`)\n\n**审计** 是代表第三方对组织安全计划或特定合规问题进行的正式审查。审计要求对控制进行严格、正式的测试，并产生审计师关于实体合规性的正式声明。审计可由内部审计小组应管理层要求进行，或由外部审计公司进行，通常应组织治理机构或监管机构的要求进行。\n\
  \n向其他组织提供服务的组织通常会聘请独立评估师，根据美国注册会计师协会 (AICPA) 的《鉴证业务准则第 18 号》(SSAE 18) 执行 *服务组织控制\
  \ (SOC)* 审计。SOC 评估有三个不同类别：\n\n*   **SOC 1 业务** 评估可能影响财务报告准确性的组织控制。\n*   **SOC 2\
  \ 业务** 评估影响存储在系统中信息的安全性（机密性、完整性和可用性）及隐私的组织控制。SOC 2 审计结果属机密，通常仅在签署 NDA 的情况下在组织外部共享。\n\
  *   **SOC 3 业务** 同样评估影响存储在系统中信息的安全性（机密性、完整性和可用性）及隐私的组织控制。但是，SOC 3 审计结果旨在公开披露。\n\n\
  除了三类 SOC 评估外，还有两种不同类型的 SOC 报告。两份报告均以管理层对已实施控制的描述开始。它们的区别在于审计师提供的意见范围：\n\n*   **类型\
  \ 1 报告** 提供审计师对管理层提供的描述及控制设计适用性的意见。\n*   **类型 2 报告** 进一步提供审计师对控制运行有效性的意见。即审计师实际确认控制正常运行。\n\
  \n**评估** 是通常由安全组织本身请求的、旨在流程改进的对安全控制的非正式审查。评估期间，评估师通常通过访谈员工并采信其陈述来收集信息，而非执行与审计相关的严格独立测试。\n\
  \n### 总结\n\n策略构成每个强大信息安全计划的基础。可靠的策略框架由策略、标准、程序和指南组成，它们协同工作以描述组织的安全控制环境。除了遵守内部制定的策略外，组织通常还必须遵守外部施加的合规义务。安全框架（如\
  \ NIST 网络安全框架和 ISO 27001）基于公认的行业最佳实践，为安全计划提供通用结构。组织应实施并测试安全控制，以实现基于组织业务和技术环境制定的安全控制目标。\n\
  \n### 考试要点\n\n**策略框架由策略、标准、程序和指南组成。** 策略是管理层对信息安全计划的高层意图陈述。标准描述策略的详细实施要求。程序提供执行安全活动的分步说明。遵守策略、标准和程序是强制性的。指南提供补充策略框架其他要素的可选建议。\n\
  \n**组织通常采用一套涵盖其安全计划不同领域的安全策略。** 安全计划中常用的策略包括信息安全策略、可接受使用策略、数据所有权策略、数据保留策略、账户管理策略和密码策略。任何组织采用的具体策略将取决于该组织的文化和业务需求。\n\
  \n**策略文档应包含例外处理流程。** 例外处理流程应说明获得安全策略例外所需的信息以及每个例外的批准权限。该流程还应描述补偿控制的要求，以缓解经批准的安全策略例外所带来的风险。\n\
  \n**组织面临各种安全合规要求。** 商家和信用卡服务提供商必须遵守支付卡行业数据安全标准 (PCI DSS)。处理欧盟居民个人信息的组织必须遵守欧盟通用数据保护条例\
  \ (GDPR)。所有组织都应熟悉影响其运营的国家、领地和州法律。\n\n**标准框架为构建和评估网络安全计划提供大纲。** 组织可以选择以 NIST 网络安全框架\
  \ (CSF) 或国际标准化组织 (ISO) 标准等框架为基础来建立其安全计划。美国联邦政府机构和承包商还应熟悉 NIST 风险管理框架 (RMF)。这些框架有时包含成熟度模型，允许组织评估其进展。某些框架还提供认证计划，对组织采用框架的进展进行独立评估。\n\
  \n\n\n**审计和评估监控对要求的遵从情况。** 审计是外部委托的、正式的审查，旨在评估组织实现其控制目标的能力。评估是对安全问题的审查，严谨程度较低，通常由\
  \ IT 员工执行或委托。向其他实体提供服务的组织可能希望根据 SSAE 18 标准进行服务组织控制（SOC）审计。\n\n### 复习题\n\n1.  Joe\
  \ 正在编写一份文档，向系统管理员解释他们遵守组织“加密所有笔记本电脑”要求的一种可能方式。Joe 正在编写哪类文档？\n\n    1.  策略\n    2.\
  \  指南\n    3.  程序\n    4.  标准\n\n2.  关于 PCI DSS 下的补偿控制，以下哪项陈述是不正确的？\n\n    1.  用于满足一项\
  \ PCI DSS 要求的控制措施，可用于补偿为满足另一项要求而缺失的控制措施。\n    2.  控制措施必须满足原始要求的意图。\n    3.  控制措施必须满足原始要求的严谨性。\n\
  \    4.  补偿控制必须提供与原始要求相似的防御级别。\n\n3.  哪部法律为处理欧盟居民个人信息的人员创设了隐私义务？\n\n    1.  HIPAA\n\
  \    2.  FERPA\n    3.  GDPR\n    4.  PCI DSS\n\n4.  以下哪项*不是* NIST 网络安全框架定义的五大核心安全功能之一？\n\
  \n    1.  识别\n    2.  遏制\n    3.  响应\n    4.  恢复\n\n5.  哪个 ISO 标准为隐私控制提供指导？\n\n\
  \    1.  27002\n    2.  27001\n    3.  27701\n    4.  31000\n\n6.  以下哪份文件通常必须由 CEO\
  \ 或同级高层管理人员批准？\n\n    1.  标准\n    2.  程序\n    3.  指南\n    4.  策略\n\n7.  Greg 希望创建一份框架协议，为其组织与供应商未来所有工作的安全条款和条件提供依据。Greg\
  \ 应该使用哪种类型的协议？\n\n    1.  BPA\n    2.  MOU\n    3.  MSA\n    4.  SLA\n\n8.  哪个组织以创建独立的安全基准而闻名，这些基准涵盖了来自许多不同供应商的硬件和软件平台？\n\
  \n    1.  Microsoft\n    2.  互联网安全中心\n    3.  云安全联盟\n    4.  Cisco\n\n9.  哪种类型的安全策略通常作为其他策略未涉及问题的兜底措施？\n\
  \n    1.  账户管理\n    2.  数据所有权\n    3.  行为准则\n    4.  持续监控\n\n10.  以下哪项通常*不会*出现在组织的信息安全策略中？\n\
  \n     1.  网络安全重要性声明\n     2.  要求使用 AES-256 加密\n     3.  授权委托\n     4.  负责高管的指定\n\
  \n11.  Darren 正在与一位独立审计师合作，制作一份审计报告，他将在 NDA 下与客户共享该报告，以证明他已建立适当的安全控制。审计师将*不*评估这些控制的有效性。Darren\
