  \n---\n\n## 第 9 章 弹性与物理安全\n\n构建弹性、安全的基础设施需要了解组织可能面临的风险。自然灾害和人为灾害、物理攻击，甚至事故都可能严重影响组织的运行能力。弹性是\
  \ CIA 三要素中可用性支柱的基础部分，本章将探讨弹性作为可用性关键组成部分的内容。\n\n在本章中，您将探索弹性设计的常见要素，范围涵盖地理和网络路径多样性及其作为重要考量因素的原因，到\
  \ RAID 阵列和备份等高可用性设计要素。您将了解各种技术，以确保数据不丢失且服务在故障发生时仍保持在线。\n\n接下来，您将了解响应和恢复控制，这些控制有助于确保组织能够保持在线并从问题中恢复。您将探讨热站点、冷站点和温站点；如何建立系统和设备的恢复顺序及其重要性；以及为何响应和恢复流程可能与日常运营有所不同。\n\
  \n物理安全既能提供更强的弹性，又能保护数据和系统。对系统、网络和设备的物理访问是绕过或克服安全控制最简单的方法之一，这使得物理安全成为安全组织的关键设计要素。在本章最后一节，您将了解常见的物理安全控制、设计要素和技术，范围涵盖从锁到传感器和灭火系统。您还将了解安全区域、安保人员的使用，以及反无人机系统等新兴关注点。\n\
  \n### 构建网络安全弹性\n\n在机密性、完整性和可用性的 CIA 三要素中，可用性的一个有时被忽视的要素是弹性。可用性是组织安全的关键部分，因为离线或不可用的系统无法满足业务需求。无论您的机密性和完整性控制多么强大，如果系统、网络和服务在需要时不可用，组织就会陷入困境。\n\
  \n在接下来的几页中，我们将探讨弹性系统设计中的关键概念和实践。并非每个组织或实现都会使用所有这些措施，甚至可能很多都不使用。每项控制都会增加复杂性和成本，因此，了解何时何地实施这些解决方案是网络安全从业者的一项重要技能。成本、维护要求、对组织面临风险的适用性以及其他因素，都是您在构建网络安全弹性时必须考量的因素。\n\
  \n构建弹性最常见的方法之一是通过**冗余**——换句话说，拥有不止一个系统、服务、设备或其他组件。在阅读这些解决方案时，请记住，为弹性进行设计需要思考弹性系统或服务所处的整个环境。电源、环境控制、硬件和软件故障、网络连接以及任何其他可能故障或中断的因素都必须进行评估。单点故障——单个设备、连接或其他要素的故障可能导致系统中断或停止运行的位置——必须被识别，并予以补偿或在设计中记录在案。\n\
  \n完成所有评估工作后，将创建一个设计，在业务需求、设计要求与选项、构建和运营环境的成本之间取得平衡。设计中常会根据评估和设计阶段中已识别风险的总体风险和发生可能性，在成本、复杂性、人员配置或其他限制方面做出妥协。\n\
  \n冗余设计的常见要素包括以下内容：\n\n*   **系统的地理分散**可确保单一灾难、攻击或故障无法使其瘫痪或摧毁。对于数据中心和其他设施，一个常用的经验法则是将数据中心至少相隔\
  \ 90 英里，以防止大多数常见自然灾害同时使两个（或更多）数据中心瘫痪。这也有助于确保设施不受电网问题、网络连接等类似问题的影响。\n\n*   **数据中心内服务器和其他设备的分离**也常用于避免单个机架成为故障点。因此，系统可能会被放置在两个或更多机架中，以防电源分配单元（PDU）单点故障，甚至像漏水滴入机架这样简单的问题。\n\
  \n*   **使用多网络路径（`multipath`）解决方案**可确保电缆切断或设备故障不会导致连接丢失。\n\n*   **冗余网络设备**，包括多个路由器、防火墙和入侵防御系统等安全设备，或其他安全设备，也常被实施以防止单点故障。以下是实施方法的示例：\n\
  \n    *   **负载均衡器**，使多个系统或服务显示为单一资源，既允许冗余，又能通过将负载分配到多个系统来提高处理负载的能力。负载均衡器也常用于允许系统升级，通过将流量从将要升级的系统重定向出去，待修补或升级完成后再恢复流量。\n\
  \n    *   **NIC 组合**，将多个网卡合并为单个虚拟网络连接。**冗余网络接口卡（NIC）**也用于在系统可用性很重要且无法合理使用多个系统的情况下确保连接。冗余\
  \ NIC 可能会连接到独立的网络路径以确保端到端可靠性，而 NIC 组合将连接到相同的网络设备，以便在 NIC 故障时提供保护，同时提供更大的带宽。\n\n\n\
  \n\n\n#### 电源保护\n\n通过使用**不间断电源（UPS）**系统提供电池或其他备用电源选项以应对短时断电；使用**发电机**系统提供长时断电时的电力；以及采用**双电源**或多电源硬件等设计元素，确保电源故障不会导致服务器瘫痪。**受管电源分配单元（PDU）**也被用于提供智能电源管理和对机架内及其他环境供电的远程控制。\n\
  \n#### 系统与存储冗余\n\n有助于确保磁盘、服务器或其他设备故障不会导致中断。\n\n#### 技术多样性\n\n是构建基础设施弹性的另一种方式。使用不同的供应商、加密解决方案、平台和控制措施，可以增加单次攻击或故障造成系统级或组织级影响的难度。使用不同技术存在实际成本，例如额外的培训、集成异构系统时的潜在问题，以及随着复杂性增加而上升的人为错误风险。\n\
  \n#### 存储弹性：备份与复制\n\n使用**廉价冗余磁盘阵列（RAID）**是一种常见解决方案，它利用多块磁盘将数据条带化（分布在各磁盘）或镜像（完全复制），并采用技术确保数据不损坏或丢失（奇偶校验）。RAID\
  \ 确保阵列在不丢失数据的情况下可处理一块或多块磁盘故障。表 9.1 展示了最常见的 RAID 方案及其优缺点。\n\n**表 9.1 RAID 级别、优点和缺点**\n\
  \n| RAID 说明 | 说明 | 优点 | 缺点 |\n| :--- | :--- | :--- | :--- |\n| RAID 0 – 条带化 | 数据分布在阵列中的所有驱动器上。\
  \ | 更好的 I/O 性能（速度），所有容量均被利用。 | 无容错能力——驱动器损坏将导致所有数据丢失。 |\n| RAID 1 – 镜像 | 所有数据完全复制到另一块或多块驱动器上。\
  \ | 从多块驱动器实现高读取速度，驱动器故障时数据仍可用。 | 存储相同数据量需要两倍的存储空间。 |\n| RAID 5 – 带奇偶校验的条带化 | 数据跨驱动器条带化，一块驱动器用于数据奇偶校验（校验和）。奇偶校验数据也分布在各驱动器上。\
  \ | 数据读取快，写入略慢。只要仅一块驱动器故障，即可重建驱动器。 | 一次只能容忍单块驱动器故障。驱动器损失后重建阵列可能缓慢并影响性能。 |\n| RAID\
  \ 6 – 带双重奇偶校验的条带化 | 类似 RAID 5，但额外的奇偶校验存储在另一块驱动器上。 | 类似 RAID 5，但允许多块驱动器同时故障。 | 写入性能比\
  \ RAID 5 慢，因需管理额外的奇偶校验数据。驱动器损失后重建阵列可能缓慢并影响性能。 |\n| RAID 10 – 镜像与条带化 | 数据跨两块或更多驱动器条带化，再镜像到相同数量的驱动器上。\
  \ | 结合了 RAID 0 和 RAID 1 的优缺点。 | 结合了 RAID 0 和 RAID 1 的优缺点。有时写作 RAID 1+0。 |\n\n除磁盘级保护外，备份和复制常用于确保数据丢失不影响组织。备份是实时存储系统的副本：**全量备份**复制整个设备或存储系统；**增量备份**捕获上次备份以来的变更，备份快但恢复慢；**差异备份**捕获上次全量备份以来的变更，恢复快但备份慢。每次都运行全量备份比增量备份占用更多空间，但增量备份需分层应用每组变更才能在完全恢复时还原为全量备份。因大多数故障非完全存储故障且多份全量备份空间成本高得多，多数组织选择实施增量备份，通常定期配合全量备份。\n\
  \n第三种备份类型是**快照**。快照在备份完成时捕获系统或设备的完整状态。快照常用于**虚拟机（VM）**，允许在快照时间点恢复机器状态。快照可用于克隆系统、回滚到补丁或升级安装前、或恢复到某事件发生前的系统状态。因实时获取，通常无显著性能影响即可在系统运行时捕获。同全量备份一样，快照可能占用大量空间，但大多数执行企业级快照的虚拟化系统配备压缩和去重技术以优化空间使用。\n\
  \n**镜像**概念类似快照，但通常指系统或服务器的完整副本，往往精确到驱动器位级。这意味着恢复的镜像与制作镜像那一刻的系统完全匹配。镜像是复杂配置服务器的首选备份方式，适用于需在短时间内克隆或恢复的场景。全量备份、快照和镜像含义可能相近，因此应明确所用技术、术语及其具体含义，以及在特定系统或架构中实施该技术的决策。\n\
  \n虚拟化系统和虚拟桌面基础设施（VDI）也使用镜像创建非持久化系统，基于“黄金主镜像”运行。非持久化系统关闭时黄金主镜像不被修改，确保下一用户获得相同的预期体验。\n\
  \n除上述备份类型外，还可复制单个文件以保留特定文件或目录。理想情况下，制作备份副本时应验证其与原文件一致。同其他备份方法一样，安全存放备份介质是确保备份安全可用的重要环节。\n\
  \n备份介质选择也是组织的重要决策。决策因素包括容量、可靠性、速度、成本、存储数据的预期寿命、磨损前的重复使用次数等，均影响组织选择的备份方案。常见选择包括：\n\
  \n*   **磁带**历来是大规模备份中单位容量成本最低的选项之一。磁带仍用于大型企业，常以磁带机器人系统形式出现，可利用少量驱动器和多个盒式存储槽加载存储大量磁带。\n\
  *   **磁盘**（磁性或固态硬盘形式）通常比同容量磁带贵但更快。磁盘常以大型阵列用于网络附属存储（NAS）设备或存储区域网络（SAN）。\n*   **光学介质**如蓝光光盘和\
  \ DVD，以及专用光学存储系统，在某些场景仍在使用，但因容量原因不常作为大规模备份工具。\n\n\n\n\n\nFlash media like microSD\
  \ cards and USB thumb drives continue to be used in many places for short-term copies\
  \ and even longer-term backups. Though they aren't frequently used at an enterprise\
  \ scale, they are important to note as a type of media that may be used for some\
  \ backups.\n\nThe decision between tape and disk storage at the enterprise level\
  \ also raises the question of whether backups will be `online`, and thus always\
  \ available, or if they will be `offline` backups and will need to be retrieved\
  \ from a storage location before they can be accessed. The advantage of online backups\
  \ is in quick retrieval and accessibility, whereas offline backups can be kept in\
  \ a secure location without power and other expense required for their active maintenance.\
  \ Offline backups are often used to ensure that an organization cannot have a total\
  \ data loss, whereas online backups help you respond to immediate issues and maintain\
  \ operations.\n\nYou may also encounter the term “nearline” backups—backup storage\
  \ that is not immediately available but that can be retrieved within a reasonable\
  \ period of time, usually without a human involved. Tape robots are a common example\
  \ of nearline storage, with backup tapes accessed and their contents provided on\
  \ demand by the robot.\n\nCloud backups like Amazon's Glacier and Google's Coldline\
  \ provide lower prices for slower access times and provide what is essentially offline\
  \ storage with a nearline access model. These long-term archival storage models\
  \ are used for data that is unlikely to be needed, and thus very slow and potentially\
  \ costly retrieval is acceptable as long as bulk storage is inexpensive and reliable.\n\
  \nSome organizations choose to utilize `off-site storage` for their backup media,\
  \ either at a site they own and operate or through a third-party service like Iron\
  \ Mountain, which specializes in storage of secure backups in environmentally controlled\
  \ facilities. Off-site storage, a form of geographic diversity, helps ensure that\
  \ a single disaster cannot destroy an organization's data entirely. As in our earlier\
  \ discussion of geographic diversity, distance considerations are also important\
  \ to ensure that a single regional disaster is unlikely to harm the off-site storage.\n\
  \nAlthough traditional backup methods have used on-site storage options like tape\
  \ drives, `storage area networks (SANs)`, and `network attached storage (NAS)` devices,\
  \ cloud and third-party off-site backup options have continued to become increasingly\
  \ common. A few important considerations come into play with cloud and off-site\
  \ third-party backup options:\n\n*   **Bandwidth requirements for both the backups\
  \ themselves and restoration time if the backup needs to be restored partially or\
  \ fully**. Organizations with limited bandwidth or locations with low bandwidth\
  \ are unlikely to be able to perform a timely restoration. This fact makes off-site\
  \ options less attractive if quick restoration is required, but they remain attractive\
  \ from a disaster recovery perspective to ensure that data is not lost completely.\n\
  *   **Time to retrieve files and cost to retrieve files**. Solutions like Amazon's\
  \ Glacier storage focus on low-cost storage but have higher costs for retrieval,\
  \ as well as slower retrieval times. Administrators need to understand storage tiering\
  \ for speed, cost, and other factors, but they must also take these costs and technical\
  \ capabilities into account when planning for the use of third-party and cloud backup\
  \ capabilities.\n*   **Reliability**. Many cloud providers have extremely high advertised\
  \ reliability rates for their backup and storage services, and these rates may actually\
  \ beat the expected durability of local tape or disk options.\n*   **New security\
  \ models required for backups**. Separation of accounts, additional controls, and\
  \ encryption of data in the remote storage location are all common considerations\
  \ for use of third-party services.\n\n### Response and Recovery Controls\n\nWhen\
  \ failures do occur, organizations need to respond and then recover. Response controls\
  \ are controls used to allow organizations to respond to an issue, whether it is\
  \ an outage, a compromise, or a disaster. Recovery controls and techniques focus\
  \ on returning to normal operations. Because of this, controls that allow a response\
  \ to compromise or other issues that put systems into a nontrusted or improperly\
  \ configured state are important to ensure that organizations maintain service availability.\
  \ The Security+ exam focuses on a handful of common response and recovery controls,\
  \ which you should make sure you are familiar with.\n\nAn important response control\
  \ in that list is the concept of `nonpersistence`. This means the ability to have\
  \ systems or services that are spun up and shut down as needed. Some systems are\
  \ configured to revert to a known state when they are restarted; this is common\
  \ in cloud environments where a code-defined system will be exactly the same as\
  \ any other created and run with that code. Reversion to a known state is also possible\
  \ by using snapshots in a virtualization environment or by using other tools that\
  \ track changes or that use a system image or build process to create a known state\
  \ at startup.\n\nOne response control is the ability to return to a last-known good\
  \ configuration. Windows systems build this in for the patching process, allowing\
  \ a return to a checkpoint before a patch was installed. Change management processes\
  \ often rely on a last-known good configuration checkpoint, via backups, snapshots,\
  \ or another technology, to handle misconfigurations, bad patches, or other issues.\n\
  \nWhen loads on systems and services become high or when components in an infrastructure\
  \ fail, organizations need a way to respond. High-availability solutions like those\
  \ we discussed earlier in the chapter, including load balancing, content distribution\
  \ networks, and clustered systems, provide the ability to respond to high-demand\
  \ scenarios as well as to failures in individual systems. `Scalability` is a common\
  \ design element and a useful response control for many systems in modern environments\
  \ where services are designed to scale across many servers instead of requiring\
  \ a larger server to handle more workload. You should consider two major categories\
  \ of scalability:\n\n*   **Vertical scalability** requires a larger or more powerful\
  \ system or device. Vertical scalability can help when all tasks or functions need\
  \ to be handled on the same system or infrastructure. Vertical scalability can be\
  \ very expensive to increase, particularly if the event that drives the need to\
  \ scale is not ongoing or frequent. There are, however, times when vertical scalability\
  \ is required, such as for every large memory footprint application that cannot\
  \ be run on smaller, less capable systems.\n*   **Horizontal scaling** uses smaller\
  \ systems or devices but adds more of them. When designed and managed correctly,\
  \ a horizontally scaled system can take advantage of the ability to transparently\
  \ add and remove more resources, allowing it to adjust as needs grow or shrink.\
  \ This approach also provides opportunities for transparent upgrades, patching,\
  \ and even incident response.\n\nMoves to the cloud and virtualization have allowed\
  \ scaling to be done more easily. Many environments support horizontal scaling with\
  \ software-defined services and systems that can scale at need to meet demand, while\
  \ also allowing safer patching capabilities and the ability to handle failed systems\
  \ by simply replacing them with another identical replacement as needed.\n\nNot\
  \ every environment can be built using horizontally scalable systems, and not every\
  \ software or hardware solution is well suited to those scenarios. At the same time,\
  \ natural and human-created disasters, equipment failures, and a host of other issues\
  \ can impact the ability of an organization to operate its facilities and datacenters.\n\
  \n\n\n\n\n### 站点弹性与物理安全控制\n\n#### 站点弹性\n\n当组织需要规划在其数据中心或其他托管基础设施的位置离线时如何运作时，会将站点弹性选项作为一种响应控制进行考量。*站点弹性*\
  \ 历来是组织的主要设计要素，对某些组织而言，它仍然是关键设计要素。用于站点弹性的灾难恢复站点主要有三种类型：\n\n*   **热站点** 拥有运行组织所需的所有基础设施和数据。因此，一些组织全天候运行它们，在多个站点之间分流流量和负载，以确保站点正常运行。这种方法还能确保在紧急情况下有员工到位。\n\
  *   **温站点** 拥有组织所需工作的部分或全部系统，但实时数据未就位。由于硬件成本，温站点维护费用高昂，但由于系统已就绪且大部分配置完成，它们可以缩短总恢复时间。它们在热站点和冷站点之间平衡了成本与能力。\n\
  *   **冷站点** 拥有空间、电力，通常还有网络连接，但未预置系统或数据。这意味着发生灾难时，组织虽有去处，但必须自行携带或采购系统。冷站点具有挑战性，因为某些灾难会阻碍硬件采购，且数据必须从灾难发生时存储数据的另一设施传输过来。然而，冷站点也是三种类型中维护成本最低的选项。\n\
  \n在上述每种场景中，都需要考虑 *恢复顺序*。恢复顺序决策在系统和服务对组织运营的关键性与其他基础设施就绪并运行以允许各组件上线、安全且正常运行的需求之间取得平衡。站点恢复顺序可能包含如下列表：\n\
  \n1.  恢复网络连接和堡垒主机或 Shell 主机。\n2.  恢复网络安全设备（防火墙、IPS）。\n3.  恢复存储和数据库服务。\n4.  恢复关键业务服务器。\n\
  5.  恢复日志记录和监控服务。\n6.  尽可能恢复其他服务。\n\n每个组织和基础设施设计都会根据对组织功能需求的关键性以及数据中心或服务运行环境中的依赖关系，做出略有不同的恢复顺序决策。\n\
  \n越来越多的设计利用云来替代现有恢复站点或与其协同工作。主要云基础设施供应商跨多个地理区域进行设计，且通常在一个区域内链接多个数据中心。这意味着组织无需投资热站点，而是可以在云托管环境中构建和部署基础设施，然后使用工具将环境复制到另一个区域，或者从一开始就设计（或重新设计）架构以利用多区域优势。由于云服务通常按使用量定价，设计和构建可按需在另一位置启动的基础设施，有助于应对容量规划和灾难恢复场景。\n\
  \n#### 物理安全控制\n\n安全从业者通常关注技术控制，但组织最重要的防线之一是其部署的物理控制集合。对系统、设施和网络的物理访问是绕过技术控制最简单的方式之一，无论是直接访问机器、窃取驱动器或设备，还是插入受信网络以绕过保护其免受外部世界侵害的多层网络安全控制。\n\
  \n### 站点安全\n\n防止物理访问的第一步是实施站点安全计划。站点安全会审视组织使用的整个设施，并根据与每个特定位置相关的威胁和风险实施安全计划。这意味着组织在不同位置使用的设施，或作为不同业务活动一部分的设施，通常会有不同的站点安全计划和控制措施。\n\
  \n一些组织使用 *工业伪装* 来帮助保护自身。常见示例是公司为呼叫中心选择的不起眼位置。与其让呼叫中心成为愤怒客户寻找的显眼地点，许多中心基本无标识且外观普通。虽然“通过隐匿实现安全”不是合法的技术控制，但在物理世界中，不易被注意到有助于防止许多原本可能发生的入侵。\n\
  \n许多设施将围栏作为第一道防线。*围栏* 既通过让设施看起来难以进入起到威慑作用，又作为实际的物理防御。高安全设施将使用多重围栏、顶部的刺铁丝或刀片刺绳及其他技术来增强围栏提供的安全性。围栏材料、高度、入口位置及设计等多种因素均纳入安全围栏的考量范围。\n\
  \n第二种常见的物理控制是设置挡车柱。挡车柱是如 图 9.1 所示的柱子或其他障碍物，用于防止车辆穿越某区域。挡车柱外观可能像柱子、石柱甚至花盆，但其目的始终如一：防止车辆进入。一些挡车柱设计为可拆卸甚至机械驱动，可根据需要升降。许多挡车柱设在入口前，以防止意外和利用车辆的蓄意袭击。\n\
  \n*照明* 在外部和内部安全中发挥作用。不留阴影或黑暗区域的明亮照明用于阻止入侵者，并让员工感到更安全。自动照明还能指示员工活动区域，让保安和其他员工知晓人员所在位置。\n\
  \n![图 9.1 挡车柱](img/c09f001.png)\n\n**图 9.1** 挡车柱\n\n在设施内部，物理安全像技术安全实现一样分层部署。可使用许多物理控制；Security+\
  \ 考试大纲包含考试所需熟悉的具体示例。接下来几页我们将探讨每个主题。\n\n*工牌* 在物理安全中可扮演多种角色。除了通过磁条和射频识别（RFID）访问系统用于入口访问控制外，工牌通常还包含照片和其他信息，可让人员和保安快速确定持卡人身份、应有的区域或访问权限，以及是员工还是访客。这也使工牌成为社会工程学攻击的目标，攻击者试图获取、复制或伪造工牌以绕过安检。工牌常与\
  \ *邻近读卡器* 配合使用，后者利用 RFID 查询工牌，无需将其插入或刷过磁条读卡器。\n\n\n\n\n\n##### 报警与报警系统\n\n*报警*和报警系统用于检测并警示问题，包括未授权访问、环境问题和火灾。报警系统可以是本地监控或远程监控，其复杂性和功能可能差异很大。正如基于计算机的系统发出的警报一样，过于频繁或频率过高的报警很可能会被员工忽视、禁用或绕过。事实上，一些渗透测试人员甚至会想办法让报警反复触发，这样当他们进行渗透测试并触发报警时，员工不会感到惊讶，也不会去调查渗透测试人员实际触发的那个报警！\n\
  \n##### 灭火系统\n\n*灭火系统*是安全系统的重要组成部分，通过降低灾难性火灾的可能性来增强弹性。最常见的灭火系统类型之一是喷淋系统。主要有四种类型，包括湿式喷淋系统，其中始终充满水；干式喷淋系统，平时为空，需要时才注水；预作用喷淋系统，当检测到潜在火灾时注水，随后在特定喷头被热量激活时释放水流；以及淹没式喷淋系统，平时为空且喷头敞开，激活后会覆盖整个区域。\n\
  \n基于水的喷淋系统并非常用的唯一灭火系统类型。气体灭火剂通过置换氧气、降低热量或阻止氧气与物质燃烧，常用于数据中心、金库和艺术博物馆等水可能不是可行或安全选择的区域。化学灭火剂（包括湿式和干式）也被使用；例如机库使用的泡沫灭火系统，以及家庭和其他场所使用的干粉灭火器。\n\
  \n##### 标识牌\n\n*标识牌*乍看之下可能不像是一种安全控制，但有效的标识牌可以发挥多种作用。它可以提醒授权人员他们身处安全区域，未经授权的人员不得进入，如发现应上报。标识也可作为威慑控制，例如写着“仅限授权人员”的标牌。然而，与许多其他威慑控制一样，标识只能防止那些可能随意违反标牌所示规则的人，无法阻止那些主动寻求绕过组织安全控制的人。\n\
  \n##### 门禁前室\n\n一些组织使用门禁前室（通常称为*人员锁*或*气闸*）作为一种手段，以确保只有授权人员才能进入安全区域，并防止攻击者利用“尾随”攻击进入不该去的地方。门禁前室是一对门，两者都需要某种形式的授权访问才能打开（参见\
  \ 图 9.2）。第一扇门在授权后打开并关闭，只有在其关闭后，想要进入的人员才能提供授权以打开第二扇门。这样，跟在后面的人（尾随）就会被发现，并推测会被要求离开或被上报。\n\
  \n![图 9.2 门禁前室](img/c09f002.png)\n\n**图 9.2** 门禁前室\n\n##### 锁\n\n*锁*是你将遇到的最常见的物理安全控制之一。常见部署的锁类型多种多样，从使用钥匙、按钮或其他密码输入机制的传统物理锁，到使用指纹等生物识别标识符的锁，再到连接计算机系统、配备读卡器或关联密码的电子机械锁。锁可用于保护空间和设备，或限制能够解锁它们的人员。线缆锁是确保计算机或其他硬件设备不被从某处移走的常用解决方案。\n\
  \n尽管锁被大量使用，但它们对大多数有决心的攻击者并非真正的威慑。如果攻击者有时间并能接触到锁，锁可能会被绕过、撬开或以其他方式破坏。因此，锁不被视为真正的物理安全控制。安全专业人士中有一句常见的话：“锁只能管住诚实的人。”\n\
  \n##### 保安\n\n在需要或有益于人工交互的区域会使用安保人员。保安能够做出技术控制系统无法做出的决策，并能通过提供检测和响应能力来发挥额外作用。保安通常安排在接待区、巡逻设施，或驻守在可访问摄像头和其他传感器的安保监控中心。\n\
  \n访客日志是配合安保人员常用的一种控制措施。保安可以验证个人身份，确保其仅进入应去的区域，并确保其已签署访客日志且签名与档案或身份证上的签名一致。虽然这些都可能被伪造，但警觉的安保人员能显著提高设施的安全性。\n\
  \n安保人员也带来自身的挑战；人可能会犯错，社会工程学攻击可能说服保安违反政策，甚至协助攻击者。保安成本相对较高，需要持续支付薪资，而技术安全控制通常只需较低的安装和维护成本。因此，在大多数组织中，保安仅在有特定需求利用其能力的地方部署。\n\
  \n##### 摄像头与传感器\n\n摄像头系统是常见的物理安全控制形式，允许安全从业者和其他人实时观察发生的情况，并录制区域视频供日后调查或其他原因使用。摄像头类型广泛，包括黑白、红外和彩色摄像头，每种类型适用于特定场景。除了摄像头类型，分辨率、是否配备变焦镜头、是否具备云台/俯仰/变焦（PTZ）功能，都是决定其预期用途效果及成本的因素。Security+\
  \ 考试重点关注两种摄像头功能：\n\n*   *动作识别*摄像头在检测到移动时激活。这类摄像头在移动相对不频繁的区域特别有用。动作识别摄像头有助于节省存储空间，通常具有缓冲区，当识别到移动时会检索缓冲内容，从而保留移动开始前几秒的视频；这样你就能看到发生的一切。\n\
  \n*   *物体检测*摄像头及类似技术可检测特定物体，或监视特定区域的变化。这类摄像头有助于确保物体未被移动，并能检测枪支或笔记本电脑等特定类型的物体。\n\n\
  另一种摄像头系统是闭路电视（CCTV），它在屏幕上显示摄像头捕捉的画面。一些 CCTV 系统也包含录制功能，随着技术融合，摄像头系统与 CCTV 系统的界限日益模糊。\n\
  \n摄像头并非组织和个人部署的唯一传感器系统类型。常见的传感器系统包括运动、噪音、湿度和温度检测传感器。运动和噪音传感器用作安全传感器，或根据占用情况开启/关闭环境控制系统。温度和湿度传感器有助于维护数据中心环境及其他需要精细环境控制的区域，也可用于其他监控目的。\n\
  \n##### 强化安全区域与安全区域\n\n\n\n\n\n#### 安全区域与数据销毁\n\n组织经常需要特定区域的安全性高于其其他空间或区域。数据中心是大多数组织最明显的安全区域之一，金库和保险箱也是如此，它们受到保护以确保未经授权的人员无法进入。金库通常为房间大小且就地建造，而保险箱则较小且便携，或者至少是可移动的。数据中心和金库通常设计有安全且冗余的环境控制、访问控制以及额外的安全措施，以确保其持续安全。\n\
  \n除了内置于数据中心的安全功能外，环境控制（包括使用`热通道`和`冷通道`）也关乎其安全容纳服务器和其他设备的能力。`热通道/冷通道`设计将进气口和排气口交替放置在相邻通道，以确保气流正常，使数据中心设计人员知道在哪里提供冷气以及在哪里处理排气。\n\
  \n在某些情况下，会实施双人完整性控制方案等管理控制来保护保险箱或金库。在双人控制方案中，两名受信任的员工必须协同工作以提供访问权限——使用双钥匙、密码或访问控制因素的两个部分。这一策略可能让你从许多军事电影中感到熟悉，在这些电影中，核武器只有在两个人同时插入钥匙并转动后才能发射。\n\
  \n物理控制（如`法拉第笼`）可为系统提供额外的隔离，它能屏蔽电磁场。`法拉第笼`是由导电网格构成的外壳，可分散无线设备信号的电荷，从而阻断信号。高安全设施可能被建造为`法拉第笼`，或者内部设有`法拉第笼`，以防止手机和其他电子及无线通信发生。`法拉第笼`有时也用于允许在内部测试无线设备，而不影响其他生产网络和设备。\n\
  \n网络安全在安全区域中也发挥作用，包括使用屏蔽子网（也常称为非军事区[`DMZ`]）。屏蔽子网可以是网络的逻辑或物理段，用于容纳可被外部世界或其他安全性较低的群体访问的系统。屏蔽子网依赖防火墙等网络安全设备提供分段，限制进出屏蔽子网的流量，从而保持高安全区域的安全。图\
  \ 9.3 展示了一个屏蔽子网的示例。\n\n![图 9.3 简单的屏蔽子网网络设计](img/c09f003.png)\n\n**图 9.3** 简单的屏蔽子网网络设计\n\
  \n组织使用的网络和其他电信线路也容易受到攻击。这就是`受保护的电缆分发`方案发挥作用的地方。如果组织担心攻击者窃听电缆或试图通过任何方式访问电缆，他们可能会部署各种电缆保护技术。尽管这些技术在大多数环境中相对罕见，但政府设施和其他极高安全级别的设施可能会使用锁具、安全电缆管道和槽道、防篡改密封，甚至能通过压力变化、屏蔽导电性变化或其他技术检测访问尝试的管道和电缆。\n\
  \n当网络安全不足时，可采用`气隙`设计。`气隙`设计物理隔离网络段，从而防止网络连接。`气隙隔离`的网络要求数据必须物理传输，通常在经过仔细检查和批准后才能进入安全区域。\n\
  \n#### 安全数据销毁\n\n当数据达到其生命周期末期时，销毁包含该数据的介质是一项重要的物理安全措施。安全数据销毁有助于防止数据泄露，包括垃圾箱搜寻等故意攻击，以及通过重复使用介质、系统或其他数据存储设备导致的无意丢失。表\
  \ 9.2 列出了纸质记录以及硬盘、磁带、基于闪存的设备甚至完整计算机等介质最常见的销毁选项。\n\n**表 9.2** 安全数据销毁选项\n\n| 销毁方法\
  \ | 说明 | 备注 |\n| --- | --- | --- |\n| **焚烧** | 通常在高温焚烧炉中进行。主要用于纸质记录，尽管某些焚烧炉可能支持电子设备。\
  \ | 通常通过第三方服务在场外进行；不留下可恢复的材料。 |\n| **粉碎** | 可在现场进行；使用工业粉碎机可处理纸张或设备。 | 传统碎纸机可能允许恢复文档，即使是交叉切割粉碎的文档。对于高安全环境，可能需要焚烧或制浆。\
  \ |\n| **制浆** | 将纸质文档分解为木浆，去除墨水。材料可回收。 | 彻底销毁文档以防止恢复。 |\n| **粉粹** | 将设备分解为极小碎片以防止恢复。\
  \ | 输出材料的大小决定了数据恢复的可能性；粉粹通常产生极小的材料碎片。 |\n| **消磁** | 从磁带和硬盘等传统磁性介质中磁性擦除数据。 | 仅对磁性介质有效；对固态硬盘、闪存介质、光学介质或纸张无效。\
  \ |\n\n物理销毁是确保数据销毁最安全的方式，但在商业环境中，非破坏性选项通常更受青睐，以便重复使用介质或设备。当潜在暴露风险较低，或残留数据暴露风险对组织而言并非重大关切时，可使用安全驱动器或介质擦除选项。\n\
  \n许多组织选择实施的用于安全销毁的最后一个选项是使用第三方解决方案。合同文档和设备销毁公司将取走敏感文档和介质并在其设施内粉碎，或在现场执行相同服务。组织可选择经过详尽记录的销毁流程，包括设备照片和按设备出具的销毁认证，具体取决于其安全需求。第三方销毁服务适合许多具有典型安全需求的组织，因为它们确保适当的销毁，而无需内部投资工具和时间来安全销毁介质和系统。\n\
  \n### 摘要\n\n构建弹性基础设施是确保系统和服务可用性的关键部分。冗余系统、网络及其他基础设施和能力有助于提供这种弹性。同时，地理分散、电源保护，甚至技术和供应商的多样性等技术，在保持组织在线和运行方面可发挥关键作用。\n\
  \n存储弹性可能涉及`RAID`，了解常见的`RAID`级别及其含义对安全分析师很有用。备份（无论是到磁带、磁盘还是第三方存储服务）有助于确保在系统或驱动器发生故障时数据不丢失。你应该了解完全备份、差异备份和增量备份的区别。快照（复制某一时间点的系统状态）和镜像（用于复制完整系统）也被用作备份和克隆系统的方式。\n\
  \n\n\n\n\n### 您如何应对中断或问题以及如何从中恢复，可能意味着快速恢复在线与长时间离线之间的区别。\n\n现代基础设施通常依赖非持久化系统，这些系统使用软件或镜像定义的原始版本来构建和扩展系统，并在不需要时将其关闭并销毁。最后已知的良好保存点和镜像也可用于恢复到事件或问题发生之前的时间点。\n\
  \n可扩展性可以是垂直的，即上线更大、更强大的系统或设备；也可以是水平的，即增加更多较小的系统。云和虚拟化环境的使用日益增加，意味着越来越多的基础设施被设计为利用水平可扩展性。水平可扩展的基础设施通常利用负载均衡器和其他工具将流量导向系统，从而允许升级、替换和移除可能存在问题的系统。\n\
  \n灾难恢复站点用于恢复运营，其中热站点已构建完毕并完全准备就绪，温站点等待数据和人员投入运营，冷站点提供电力和连接但需要付出巨大努力和部署技术才能上线。在任何恢复事件中，了解恢复顺序将有助于根据依赖关系和关键性，以合理的顺序将系统和服务恢复上线。\n\
  \n保持组织的物理安全也有助于保护它们。为了威慑潜在的恶意行为者同时保护组织，站点安全涉及使用工业伪装使设施不太可能成为目标，以及物理安全控制，如围栏、防撞柱、照明、工牌和入口访问系统、警报、灭火系统，甚至标识。即使是数据中心、机房和保险柜等区域也会接受额外的控制，以满足其更高的安全需求。\n\
  \n### 考试要点\n\n#### 冗余构建弹性。\n\n冗余系统、网络甚至数据中心是确保可用性的关键要素。冗余设计需要解决组织面临的风险和优先级，以确保在成本和能力之间做出最佳权衡。地理分散；多路径网络；负载均衡器；网卡组合；电源保护和冗余；RAID；备份；以及技术、系统和平台的多样性，都是构建和确保弹性的方法。\n\
  \n#### 当故障发生时，响应和恢复至关重要。\n\n故障不可避免，因此您需要知道如何响应。非持久化和最后已知的良好配置允许您返回到受信任或之前的状态。可扩展性，无论是通过更多系统实现水平扩展，还是通过更强大的系统实现垂直扩展，都能提供更多资源来处理负载。水平可扩展性允许您添加和移除更多系统或服务，从而提供额外的灵活性。拥有灾难恢复站点，如热、温或冷站点，或冗余的云或托管位置，可以帮助确保您的组织能更快地恢复运营。拥有预先确定的恢复顺序可提供指导，说明基于依赖性或对组织的重要性，什么需要优先恢复上线。\n\
  \n#### 物理安全控制是第一道防线。\n\n保护站点安全涉及使用工业伪装等技术，以及围栏、照明、警报、标识、防撞柱、访问控制门禁通道、摄像头和其他传感器等安全控制。通过使用锁、工牌和警卫确保只有获许可的人员才能进入，有助于防止未经授权的访问者。灭火和其他环境控制可使系统和设备免受自然灾害或人为灾害造成的风险。\n\
  \n#### 数据生命周期的终结可能需要安全销毁。\n\n当设备或介质报废时，可能需要安全销毁以防止数据丢失。存在多种技术，包括焚烧、粉碎或制浆纸质介质，或粉碎、粉碎消磁设备和磁性介质。使用适当的解决方案将有助于防止系统或介质报废或出售时数据泄露。第三方执行这些服务，并可提供销毁收据和其他文档，以确保销毁工作妥善完成，而无需组织自行维护该能力。\n\
  \n### 复习题\n\n1.  Naomi 想要部署一个工具，允许她水平扩展，同时也允许她在不干扰 Web 服务器流量的情况下修补系统。她应该部署哪种技术？\n\
  \n    1.  负载均衡器\n    2.  网卡组合\n    3.  地理分散\n    4.  多路径网络\n\n2.  Rick 执行了一次备份，捕获了自上次完全备份以来的更改。他执行的是哪种备份类型？\n\
