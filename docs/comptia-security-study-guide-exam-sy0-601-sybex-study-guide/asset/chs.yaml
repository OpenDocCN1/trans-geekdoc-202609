  \ 泄露\n    2.  拒绝\n    3.  篡改\n    4.  分配\n\n\n\n\n## 练习题\n\n### 10. Tony 正在审查其组织针对文件服务器遭受入侵的防御状况。他认为文件服务器的妥协可能会泄露信息，导致公司无法继续开展业务。哪个术语最能描述\
