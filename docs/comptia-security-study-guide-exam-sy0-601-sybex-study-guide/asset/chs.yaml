  \ SSH 时的典型顾虑，因为 SSH 实现了现代强加密。\n\n\n\n\n\n### 第 9 章：弹性与物理安全\n\n#### 19\n**C.** 一个人的姓名、年龄、位置、职位，甚至身高或发色等都是可能与个人身份相关联的属性。这些都不描述用于认证的生物特征因素，身份因素是你知道的东西、你本身的东西或你拥有的东西。账户权限决定了你能做什么，而不是这些属性。\n\
  \n#### 20\n**C.** Linux 用户可以更改谁可以读取、写入或执行他们拥有的文件和目录，这就是自主访问控制 (DAC)。强制访问控制 (MAC)\
  \ 将强制执行系统管理员设置的配置，而不赋予用户自行决定的权利。基于规则的访问控制 (RBAC) 和基于属性的访问控制 (ABAC) 不是为 Linux 文件系统设置权限的默认方法。\n\
  \n#### 1\n**A.** 负载均衡器将完美满足 Naomi 的需求。负载均衡器可以将流量分散到多个系统，同时允许将特定系统添加到正在使用的服务池中或从中移除。网卡组合用于增加带宽或为系统提供多个网络连接，地理多样性有助于确保单一灾难不会导致组织离线，多路径网络可防止单一网络路径中断导致停机。\n\
