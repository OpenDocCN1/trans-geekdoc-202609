  \ 5 和 6 是带奇偶校验的条带化，使用额外空间为数据提供校验和。\n\n#### 18\n**B.** Florian 可以使用气隙网络。气隙网络或系统是指未连接到其他系统或网络的网络或系统，要求手动复制数据和文件到其中。冷热通道用于数据中心的气流和热调节，受保护的电缆分发用于确保电缆无法在网络管理员或安全专业人员不知情的情况下被访问或窃听。\n\
  \n\n\n\n\n#### 19. B\n\n陷阱门使用一对门。当个人进入时，第一扇门必须关闭并锁定，然后第二扇门才能打开。这有助于防止尾随，因为进入的人会注意到任何跟随他们通过安全区域的人。法拉第笼用于阻挡电磁干扰（EMI），路障柱防止车辆通行，而气隙是网络或设备的物理隔离。\n\
  \n#### 20. C\n\n地理分散有助于确保单一自然灾害或人为灾害不会导致多个设施瘫痪。法律并不要求这种距离；延迟会随距离增加；虽然在某些情况下可能存在税务原因，但这通常不是安全专业人员关心的问题。\n\
  \n### 第 10 章：云与虚拟化安全\n\n#### 1. C\n\n这是向现有服务器添加额外容量的示例，也称为垂直扩展。Kevin 也可以通过添加额外的\
  \ Web 服务器来使用水平扩展。弹性涉及按需添加和移除容量的能力，虽然它确实描述了此场景，但不如垂直扩展描述得贴切。文中未提及提高服务器的可用性。\n\n####\
  \ 2. C\n\n类型 I 虚拟机监视器（Hypervisor），也称为裸金属虚拟机监视器，直接运行在物理硬件之上，因此不需要宿主操作系统。\n\n####\
  \ 3. D\n\n在 SaaS 环境中，云服务提供商承担实施安全控制的最大责任，而在 IaaS 环境中承担的责任最小。这是由于云计算共享责任模型下的责任划分所致。\n\
  \n#### 4. A\n\n云安全联盟（CSA）云控制矩阵（CCM）是一份参考文档，旨在帮助组织了解云安全控制的适当用法，并将这些控制映射到各种法规标准。NIST\
  \ SP 500-292 是云计算的参考模型，在高层面上运行。ISO 27001 是网络安全的通用标准，PCI DSS 是涉及处理信用卡交易的组织的法规要求。\n\
  \n#### 5. A\n\n这种方法可描述为客户端-服务器计算，但这是一个描述许多不同操作环境的通用术语。此处更好的术语是边缘计算，它涉及将计算能力放置在客户端，以允许其在将数据发送回云端之前执行预处理。雾计算是一个相关概念，它使用位于传感器物理邻近位置的\
  \ IoT 网关设备。\n\n#### 6. C\n\n云计算的关键特征之一是客户可以按需访问资源，且只需极少的服务提供商交互。云客户无需在每次想要预配资源时都联系销售代表，通常可以按自助服务的方式进行。\n\
  \n#### 7. B\n\nHelen 正在使用 IaaS 服务来创建她的薪资产品。然后她将该薪资服务作为 SaaS 解决方案提供给她的客户。\n\n####\
  \ 8. D\n\n混合云环境融合了公有云、私有云和/或社区云解决方案的元素。混合云需要使用将不同云产品统一为单一连贯平台的技术。\n\n#### 9. A\n\
  \n云中提供的客户关系管理（CRM）软件包将被归类为软件即服务（SaaS），因为它们不是基础设施组件。存储、网络和计算资源都是常见的 IaaS 产品。\n\n\
  #### 10. C\n\n基础设施即代码是指任何能自动完成云资源预配、管理和取消预配的方法。通过 JSON 或 YAML 定义资源属于 IaC，编写与 API\
  \ 交互的代码也是。通过 Web 界面预配资源属于手动操作，而非自动化，因此不属于 IaC。\n\n#### 11. D\n\n基于 API 的 CASB 解决方案通过提供商的\
  \ API 直接与云提供商交互。内联 CASB 解决方案拦截用户与提供商之间的请求。\"Outsider\"（外部人员）和 \"comprehensive\"\
  （综合型）不是 CASB 解决方案的类别。\n\n#### 12. C\n\n在 IaaS 环境（客户直接预配实例）和 PaaS 环境（客户请求支持其应用程序所需的服务器数量）中，客户通常都要为服务器实例付费。在\
  \ SaaS 环境中，客户通常不知道支持其使用的服务器实例数量。\n\n#### 13. A\n\n云提供商提供资源策略，客户可用于限制其账户用户可执行的操作。实施资源策略是一种良好的安全实践，可限制意外命令、账户泄露或恶意内部人员造成的损害。\n\
  \n#### 14. A\n\n云提供商提供 VPC 终端节点，允许使用云提供商的安全网络骨干将 VPC 相互连接。云传输网关进一步扩展了此模型，允许云 VPC\
  \ 与本地 VLAN 直接互连，以实现混合云操作。安全 Web 网关（SWG）为依赖云的组织提供应用安全层。硬件安全模块（HSM）是管理加密密钥并以高效方式执行加密操作的专用计算设备。\n\
  \n#### 15. D\n\n虚拟机（VM）逃逸漏洞是虚拟化环境中可能存在的最严重问题，特别是在虚拟主机运行不同安全级别的系统时。在逃逸攻击中，攻击者拥有对单个虚拟主机的访问权限，然后设法利用该访问权限侵入分配给不同虚拟机的资源。虚拟机监视器本应通过将虚拟机的访问权限限制为仅限分配给该机器的资源来防止此类访问。\n\
  \n#### 16. A\n\n云服务提供商提供的控制措施具有与提供商产品直接集成的优势，通常使其具有成本效益且用户友好。第三方解决方案通常成本更高，但它们带来了与多种云提供商集成的优势，便于管理多云环境。\n\
  \n#### 17. C\n\n云访问安全代理（CASB）专门针对这种情况设计：跨云提供商强制执行安全控制。安全 Web 网关（SWG）可能能够实现 Kira\
  \ 的目标，但难度会更大。安全组和资源策略是用于 IaaS 环境的控制措施。\n\n#### 18. D\n\n数据主权原则规定，数据受其被收集、存储或处理所在司法管辖区的法律限制。在本案例中，Howard\
  \ 需要评估所有三个司法管辖区的法律。\n\n#### 19. D\n\nBrenda 的公司以托管方式向客户提供技术服务，使其成为托管服务提供商（MSP）。然而，这项服务是安全服务，因此托管安全服务提供商（MSSP）更能准确描述这种情况。\n\
  \n#### 20. A\n\n这是公有云计算的一个示例，因为 Tony 使用的是公有云提供商 Microsoft Azure。Tony 将虚拟机的访问权限限制在其自己的组织内这一事实无关紧要，因为判断云模型的决定性因素是底层基础设施是否共享，而不是虚拟化资源是否共享。\n\
  \n### 第 11 章：端点安全\n\n#### 1. B\n\n带有 `-f` 标志的 Linux `tail` 命令将跟踪文件的变化，默认显示最后 10\
  \ 行。Charles 可以用它来监控日志文件的变化。`logger` 向 syslog 文件添加文本，`chmod` 更改权限，`head` 显示文件的前 10\
  \ 行，在 Linux 系统上通常是日志文件中最旧的条目。\n\n#### 2. C\n\n列出的服务包括：\n\n- 21 – FTP\n- 22 – SSH\n\
  - 23 – Telnet\n- 80 – HTTP\n- 443 – HTTPS\n\n\n\n\n\n#### 1. 安全协议\n\n在这些服务中，SSH\
  \ 和 HTTPS 是远程 Shell 访问和 HTTP 的安全选项。尽管安全模式 FTP (FTP/S) 可能运行在 TCP 21 上，但没有足够的信息可以确定，且如有必要，可使用\
  \ HTTPS 进行安全文件传输。因此，Naomi 的最佳选择是禁用所有三个可能不安全的协议：FTP、Telnet 和 HTTP。\n\n#### 2. DLP\
  \ 与数据分类\n\n使用 DLP 保护数据需要数据分类，以便 DLP 知道应保护哪些数据以及对其应用什么策略。定义数据生命周期有助于防止数据保留时间过长，并通过限制需要保护的数据量来提高数据安全性，但这不是\
  \ DLP 部署的必要部分。加密所有敏感数据可能意味着 DLP 无法识别它，且可能不适合其使用方式。使用创建者或所有者标记所有数据可能很有用，但不是 DLP 推广所必需的——相反，了解数据的分类更为重要。\n\
  \n#### 3. 蜂窝设备威胁\n\nSIM 卡物理被盗是蜂窝连接设备可能面临的威胁。使用集成 SIM 而非可拆卸 SIM，或使 SIM 卡在没有付出巨大努力的情况下难以或无法访问，可能会有所帮助。虽然克隆\
  \ SIM 卡以帮助破解一次性密码系统是一种真实存在的攻击，但 IoT 设备通常不使用蜂窝连接来呈现一次性密码，因为不涉及用户。窄带和基带答案在此场景中均不构成担忧。\n\
  \n#### 4. MFP 安全\n\nMFP（多功能打印机）可能包含来自复印或扫描的敏感数据；某些 MFP 具有内置硬盘或其他大容量存储，可长期保留数据。它们通常网络安全能力薄弱，使其在某些网络攻击中可作为反射器或放大器。幸运的是，如果\
  \ MFP 支持用于 Web 访问的 TLS 等协议，则它们支持合理安全的协议实现，以保障数据传输安全。\n\n#### 5. 应用程序控制\n\n允许列表应用程序将仅允许在系统上安装特定的许可程序。拒绝列表应用程序将阻止安装指定的应用程序。加固应用程序不是特定类别的工具，尽管加固脚本正在使用中，而\
  \ HIPS 是主机入侵防御系统。\n\n#### 6. EDR 系统\n\n端点检测和响应 (EDR) 系统为系统提供监控、检测和响应能力。EDR 系统从端点采集数据并将其发送到中央存储库，在那里可以对其进行分析以发现问题和妥指标\
  \ (IOC)，或用于事件响应活动。IAM 是身份和访问管理，FDE 是全盘加密，ESC 不是常用的安全首字母缩略词。\n\n#### 7. 片上系统\n\n\
  片上系统 (SoC) 是一种芯片，它将完整计算机的大部分功能构建在其中。事实上，大多数 SoC 都将 CPU、内存、输入/输出和存储作为芯片的一部分。将显示器添加到芯片中不太常见，但在智能手机、智能手表和其他设备中，添加\
  \ SoC 可访问并输出的显示器非常常见。\n\n#### 8. Windows 脚本环境\n\nPowerShell 是 Windows 系统的原生脚本环境。虽然可以安装\
  \ Python 和 Bash，但它们不是操作系统的自动组成部分。`CMD.exe` 将启动命令提示符，但它不是脚本环境。\n\n#### 9. 车辆网络\n\n\
  控制器局域网 (CAN) 是一种专用于车辆的标准，旨在允许微控制器、传感器和车辆的其他组件进行通信。Zigbee 是一种用于家庭自动化和类似短距离用途的无线协议，不适合在车辆中使用。窄带描述的是信道，而非总线类型，SoC\
  \ 总线是为本题编造的。\n\n#### 10. Arduino 安全\n\nArduino 是一种微控制器，由于默认形式的 Arduino 没有内置有线或无线网络，Hui\
  \ 应专注于设备的物理安全。\n\n#### 11. IP 地址方案\n\n组织应使用专门分配给该组织的 IP 地址，或 RFC 1918 地址（不可在互联网路由的地址）。这意味着不需要寻址方案来避免使用另一个组织的\
  \ IP 地址。IP 地址方案常用于在子网中工作时避免 IP 地址耗尽。相同的跟踪意味着它们在进行资产和系统清单时很有帮助，因为它们有助于将网络上的设备与已知的物理系统匹配。最后，为默认网关和其他常见网络组件一致地使用相同的\
  \ IP 地址，意味着支持人员不必在每个位置或网络中学习独特的配置。\n\n#### 12. SCADA 系统\n\nSCADA（数据采集与监视控制系统）是一种系统架构，它将数据采集和控制设备与通信方法及接口相结合，以监督复杂的工业和制造过程，就像公用事业中使用的那些一样。SIM（用户身份模块）是用于识别手机的小卡；HVAC\
  \ 代表供暖、通风和空调；AVAD 是为本题编造的。\n\n#### 13. 实时操作系统 (RTOS)\n\n实时操作系统 (RTOS) 是一种操作系统，旨在在数据馈送给操作系统时对其进行处理，而不是像运行其他进程和程序那样延迟处理。当进程或程序对延迟敏感（如果响应不立即发生可能会出现延迟）时，会使用实时操作系统。MFP\
  \ 是多功能打印机，HIPS 是主机入侵防御系统，SoC 是片上系统——这是硬件，可能运行 RTOS，但答案未提及 SoC 运行哪种类型的操作系统。\n\n####\
  \ 14. 嵌入式系统约束\n\n嵌入式系统有广泛的物理外形规格，使其能够放置在许多不同类型的系统和设备中。正如 Security+ 考试大纲所述，嵌入式系统的常见约束包括电源、计算、网络、加密、无法打补丁、认证、范围、成本和隐含信任。\n\
  \n#### 15. BitLocker 与驱动器加密\n\nJim 知道一旦启用 BitLocker 的机器启动，驱动器就会解锁并可被访问。如果机器关机时被盗，或驱动器本身从机器中被盗，他会最不担心，因为在这两种情况下数据都无法访问。\n\
  \n#### 16. 基于主机的 IDS 与 IPS\n\nOlivia 应安装基于主机的入侵检测系统。IDS 可以检测潜在攻击并进行报告，但没有能力阻止它们。基于主机的\
  \ IPS 可配置为仅报告攻击，但它确实具有内置能力可设置为阻止它们。防火墙可以阻止已知端口、协议或应用程序，但它们不检测攻击——尽管先进的现代防火墙模糊了防火墙与其他防御工具之间的界限。最后，数据丢失防护工具专注于防止数据泄露，而非阻止网络攻击。\n\
  \n#### 17. Raspberry Pi 与 Arduino 与 FPGA\n\nRaspberry Pi 原生支持 Linux，并拥有运行所述操作系统和服务所需的资源和硬件。Arduino\
  \ 是一种微控制器，更适合处理有限的一组传感器、执行器或类似硬件。FPGA 是一种特定类型的集成芯片，可编程以处理特定任务，但它不是一台完整的计算机。\n\n\
