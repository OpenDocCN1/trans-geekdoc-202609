  \ 是一次性密码技术类型，最后已知良好配置通常通过快照或其他技术保留，允许系统在出现错误补丁或配置更改等问题后返回已知良好状态。\n\n#### 7\n**D.**\
  \ 防撞柱是防止车辆接近或冲撞门或其他区域的物理安全控制措施。它们可能看起来像柱子、花盆或其他不起眼的物体。气隙是技术环境的物理隔离；热通道是数据中心系统排出热气的通道；与电影不同，机器人哨兵并不常见部署，在大多数当前情况下也无法阻止车辆。\n\
  \n#### 8\n**A.** 退磁仅适用于磁性介质，而 DVD 是光学介质。Amanda 可以刻录、粉碎或甚至撕碎 DVD，以确保数据被妥善销毁。\n\n\
  #### 9\n**C.** 法拉第笼可防止电磁辐射，用于阻挡无线信号和其他不需要的 EMI。人员互锁门用于防止尾随；法拉第笼不用于灭火；虽然法拉第笼可能会阻挡退磁机，但通常不用于此目的。\n\
  \n#### 10\n**A.** 双人控制专门旨在通过要求两个人采取特定行动来防止内部威胁。访客日志有助于确定谁可能被允许进入设施，但无法阻止内部威胁。气隙可防范基于网络的攻击，但内部人员可故意绕过气隙。如果内部人员被允许进入，接待人员会允许其进入设施，这也无法阻止内部威胁。\n\
  \n#### 11\n**C.** 运动检测摄像头可通过仅在检测到运动时录制来帮助节省视频存储空间。在数据中心等低使用率空间中，这意味着仅偶尔会进行录制。在使用更频繁的区域，对总空间占用的影响会较小，但仍可能有意义，尤其是在非工作时间。红外摄像头、人脸识别以及摄像头的水平旋转、垂直旋转和变焦\
  \ (PTZ) 能力是重要功能，但它们无助于节省存储空间。\n\n#### 12\n**C.** 从长远来看，保安可能是成本最高的物理安全控制措施之一，这使得保安成本成为指导何时何地雇佣保安的最重要决定因素之一。可靠性、培训和社会工程学风险都是保安可能存在的问题，但这些都不是决策过程的主要驱动因素。\n\
  \n#### 13\n**A.** 气隙是设备的物理隔离。通过实施气隙，Michelle 可以确保设备无法通过网络访问，从而防止已突破其网络边界安全的入侵者访问她负责保护的工业控制系统。法拉第笼阻挡电磁信号和辐射\
  \ (EMI)，冷通道是数据中心中冷空气被吸入系统的空调通道，屏蔽子网是放置处理不受信任流量的系统的位置。\n\n#### 14\n**C.** 围栏、照明和标志都有助于阻止潜在恶意行为者进入某区域，尽管坚定的对手会无视或绕过这三者。机器人哨兵出现在考试大纲中，但并非大多数组织的常见解决方案。\n\
