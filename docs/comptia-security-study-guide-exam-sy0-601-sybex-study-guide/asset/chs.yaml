  \ 来擦除磁带。\n\n---\n\n## 第 12 章 网络安全\n\n网络是组织的核心，负责传输数据并支持我们赖以开展业务的服务。这使它们成为攻击者的主要目标，也是防御架构和设计中的关键层。\n\
  \n在本章中，您将了解安全网络设计中的重要概念和要素，例如基于风险和安全要求的网络分段和区域划分。您还将探索保护措施，如端口安全、端口跨越和镜像以进行数据收集，以及如何使用\
  \ VPN 保护网络流量，即使在遍历不受信任的网络时也是如此。\n\n接下来，您将了解网络设备和安全设备。跳板机/跳板服务器、负载均衡器及其调度技术和功能模型、代理服务器、URL\
  \ 和内容过滤器，以及各种其他网络安全工具和选项构成了本章的中间部分。\n\n了解了设备和设计概念后，您将继续学习如何在管理层面上管理和保护网络，包括带外管理技术、访问控制列表和服务质量选项。您还将了解路由安全问题对安全专业人员和网络管理员的意义。随后，您将探索\
  \ DNS 安全、传输层安全的作用及其利用临时密钥实现完美前向保密的机制，以及监控在网络安全中的作用。最后，您将研究欺骗和中断策略，这些策略可以帮助您了解攻击者将在您的网络中尝试什么，以及当他们捕获并试图提取数据时如何检测他们。\n\
  \n在了解了管理工具之后，您将继续探索安全协议及其用途，包括用于实时流媒体、安全邮件和 Shell 访问的协议，以及各种其他选项。您将学习如何根据其服务端口和协议识别安全协议，它们能做什么和不能做什么，以及它们在现代网络中如何被频繁使用。\n\
  \n一旦涵盖了工具和技术，您将回顾常见的网络攻击，如中间人攻击、DNS 攻击、第 2 层攻击、分布式拒绝服务 (DDoS) 攻击和运营技术 DDoS 攻击，以及如何检测并有时阻止它们。\n\
  \n本章的最后一部分将向您介绍各种用于网络侦察和发现的重要工具，以及利用这些工具的技术。您将探索如何追踪数据包路由、收集有关系统和设备及其网络配置和流量模式的信息、扫描服务和漏洞、传输数据、收集开源情报，以及捕获和分析数据包和网络流量。\n\
  \n### 设计安全网络\n\n作为安全专业人员，您必须理解并能够实施企业网络中关键的设计和架构要素，以便妥善保护它们。您需要知道部署了哪些工具和系统以及原因，还要知道如何将它们作为分层安全设计的一部分进行部署。\n\
  \n大多数环境中的安全设计依赖于**纵深防御**的概念。换句话说，它们围绕多重控制构建，旨在确保单个控制（甚至多个控制）的失效不太可能导致安全漏洞。在备考时，请考虑如何使用这些组件构建有效的纵深防御设计，以及如何实施它们以确保故障或错误不会使组织面临更大的风险。\n\
  \n牢记纵深防御，了解网络也是分层构建的会有所帮助。开放系统互连 (OSI) 模型用于概念性地描述设备和软件如何通过网络协同工作。除了概念层面，设计人员还将使用在信任边界分离网络的设备创建安全区域，并部署适合每个安全区域的威胁和安全要求的保护措施。\n\
  \n#### 网络分段\n\n\n\n\n\n##### 网络分段与访问控制\n\n网络安全中最常见的概念之一是**网络分段**的理念。网络分段根据信任边界、功能需求或其他有助于组织实施控制或辅助功能的原因，将网络划分为逻辑或物理分组。许多技术和概念用于分段，但最常见的之一是使用**虚拟局域网（VLAN）**。VLAN\
  \ 在数据链路层建立一个被分段的广播域。交换机或其他设备利用 VLAN 标签创建 VLAN，使跨越多个网络设备（如交换机）的不同端口都能属于同一个 VLAN，而插在这些交换机上的其他系统则不在同一个广播域中。\n\
  \n许多网络设计概念描述了网络分段的具体实现：\n\n*   **DMZ（非军事区）**，是包含暴露于低信任区域的系统的网络区域。DMZ 通常用于容纳 Web\
  \ 服务器或其他面向互联网的设备，但也可描述信任级别不同的内部用途。\n*   **内部网**是为向员工或组织其他成员提供信息而建立的内部网络，通常受保护免受外部访问。\n\
  *   **外部网**是为外部访问而建立的网络，通常由合作伙伴或客户访问，而非面向大众公众。\n\n尽管许多网络设计过去假定威胁来自用于定义网络段的安全边界之外，但**零信任**网络的核心概念是：无论是内部还是外部的人员或系统，均不予信任。因此，零信任网络应在系统之间以及安全边界处都包含安全措施。\n\
  \n#### 网络访问控制\n\n网络分段有助于将网络划分为逻辑安全区域，但保护网络免受未授权访问同样重要。这就是**网络访问控制（NAC）**，有时称为网络准入控制，发挥作用的地方。NAC\
  \ 技术专注于确定系统或设备是否应被允许连接到网络。如果通过了准入要求，NAC 会将其置于适当的区域中。\n\n为完成此任务，NAC 可使用安装在计算机上的软件代理执行安全检查。或者该过程可能是无代理的，通过浏览器或其他方式运行，无需在本地安装软件。功能各异，软件代理通常能更深入地通过验证补丁级别、安全设置、杀毒软件版本及其他设置和细节来确定机器的安全状态，然后再准许系统接入网络。某些\
  \ NAC 解决方案还会跟踪用户行为，如果系统从事可疑行为，可将其从网络中移除。\n\n由于 NAC 能够验证系统的安全状态，它可以成为一种有效的策略执行工具。如果系统不满足安全目标，或存在问题，可将其置于隔离网络中。在那里对系统进行修复并重新检查，或者直接禁止其连接到网络。\n\
  \nNAC 检查可在设备被允许接入网络前（准入前）或连接后（准入后）进行。代理或无代理解决方案与准入前或准入后设计的组合，取决于安全目标和组织所选工具的技术能力。基于代理的\
  \ NAC 需要安装，因此增加了复杂性和维护工作，但提供了更深入的洞察和控制。无代理安装轻量级且易于处理，适用于机器可能不受集中管理或设备可能不支持 NAC 代理的用户。然而，无代理安装提供的细节较少。准入前\
  \ NAC 决策可将潜在危险系统拒之门外；准入后决策有助于响应，并防止失败的 NAC 接入尝试阻碍业务。\n\n#### 端口安全与端口级防护\n\n保护网络免受连接设备的威胁，不仅需要使用\
  \ NAC 验证其安全状态。许多防护措施专注于确保网络本身不因在其上传输的流量而陷入危险。\n\n**端口安全**是一项允许你限制单个端口上可使用的 MAC 地址数量的功能。这可防止许多可能的问题，包括\
  \ MAC（硬件）地址欺骗、内容可寻址存储器（CAM）表溢出，以及在某些情况下插入额外网络设备以扩展网络。尽管端口安全实现各异，但大多数端口安全功能允许你通过设置最大\
  \ MAC 地址数量来动态锁定端口，或静态锁定端口以仅允许特定 MAC 地址。虽然这种类型的 MAC 过滤不如 NAC 细致且提供的信息较少，但它依然有用。\n\
  \n由于欺骗 MAC 地址相对容易，不应依赖端口安全来防止不受信系统连接。尽管如此，配置端口安全有助于在 NAC 不可用或未使用时，防止攻击者轻易连接到网络。它还可防止原本可能发生的\
  \ CAM 表溢出攻击。\n\n除了端口安全，协议级防护是交换机和其他网络设备提供的重要安全功能。这些包括：\n\n*   **环路防护**专注于检测环路并禁用端口，以防止环路引发问题。生成树协议（STP）使用桥协议数据单元，以及思科的环回检测功能等防环实现，发送带有交换机标识符的帧，交换机随即监控这些帧以防止环路。虽然环路可以简单到一根网线两端插在同一交换机上，但环路也可能由插在不同交换机上的网线、反向插入的防火墙、多张网卡插在同一网络不同部分的设备，以及网络中发现的其他错误配置导致。\n\
  *   **广播风暴防护**，有时称为风暴控制，防止广播数据包在遍历网络时被放大。防止广播风暴依赖多项功能，如在将连接用户设备的端口上提供环路保护、在交换机上启用\
  \ STP 以确保检测并禁用环路，以及限制广播流量速率。\n*   **桥协议数据单元（BPDU）防护**通过防止不应发送 BPDU 消息的端口发送它们来保护\
  \ STP。它通常应用于将插入用户设备和服务器的交换机端口。连接交换机的端口不会开启 BPDU，因为它们可能需要发送 BPDU 消息，作为网络底层管理和控制的一部分，提供关于端口、地址、优先级和成本的信息。\n\
  *   **动态主机配置协议（DHCP）侦听**专注于防止流氓 DHCP 服务器向托管网络中的客户端分发 IP 地址。DHCP 侦听会丢弃任何不在受信服务器列表中的\
  \ DHCP 服务器发来的消息，但也可配置附加选项，如阻止源 MAC 与网卡硬件 MAC 不匹配的 DHCP 消息。最后一个安全选项是：如果释放或拒绝 DHCP\
  \ 提供的消息不是来自发出请求的同一端口，则丢弃该消息，防止攻击者导致 DHCP 提供或续约失败。\n\n\n\n\n这些保护措施看似是显而易见的选择，但网络管理员需要在网络中每个端口的实施管理成本和时间，以及安全设置影响服务时可能产生的意外影响之间取得平衡。实施选择必须考虑攻击发生的可能性、网络段或网络端口访问的受控程度，以及配置和维护所有必须设置的网络端口的难易程度。集中式网络管理工具以及动态和基于规则的管理功能可以减少维护和配置所需的时间，但初始设置和持续支持仍需要投入精力。\n\
  \n#### 端口跨接/端口镜像\n\n安全和网络专业人员依赖的最后一个端口级工具是使用 `交换机端口分析器 (SPAN)` 或 `端口镜像` 的能力。端口镜像将发送到一个交换机端口的所有流量的副本发送到另一个交换机端口以进行监控。SPAN\
  \ 可以做同样的事情，但也可以将来自多个端口的流量合并到单个端口进行分析。两者对于故障排除和监控都非常有用，包括为入侵检测系统等设备提供数据，这些设备需要观察网络流量以识别攻击。\n\
  \n#### 虚拟专用网络\n\n虚拟专用网络 (VPN) 是一种跨越公共网络创建虚拟网络链路的方式，使端点表现得就像在同一个网络上一样。虽然很容易将 VPN\
  \ 视为加密隧道，但加密并非 VPN 隧道的必要条件。\n\n现代网络中主要使用两种 VPN 技术。第一种是 IPSec VPN，它在第三层运行，需要客户端，并且可以在隧道模式或传输模式下运行。在隧道模式下，发送到\
  \ VPN 连接另一端的整个数据包受到保护。在传输模式下，IP 头部不受保护，但 IP 有效载荷受到保护。IPSec VPN 常用于站点到站点 VPN，以及需要传输不仅仅是\
  \ Web 和应用流量的 VPN。\n\n第二种常见的 VPN 技术是 SSL VPN（尽管它们在当前实现中实际上使用 TLS——此处沿用了以 SSL 代替 TLS\
  \ 的通用习惯）。SSL VPN 可以使用基于门户的方法（通常使用 HTML5），用户通过网页访问，然后通过该连接访问服务；或者它们可以提供类似 IPSec VPN\
  \ 的隧道模式。SSL VPN 很受欢迎，因为它们无需安装客户端或 IPSec VPN 通常所需的特定端点配置即可使用。SSL VPN 还提供了细分应用程序访问的能力，使其能够在无需额外复杂配置的情况下实现更细粒度的控制，而大多数\
  \ IPSec VPN 工具则需要使用不同的 VPN 名称或主机来创建安全段。\n\n除了 VPN 使用的底层技术外，还有一些实施决策是由 VPN 的用途和需要承载的流量决定的。\n\
  \n许多 VPN 实施的第一个决策点是 VPN 将用于远程访问，还是用作 `站点到站点 VPN`。远程访问 VPN 通常用于出差员工和其他远程工作者，而站点到站点\
  \ VPN 用于在两个或更多站点之间创建安全的网络通道。由于站点到站点 VPN 通常用于扩展组织的网络，因此它们经常是始终在线的 VPN，意味着它们始终保持连接和可用，并且如果发生故障，会自动尝试重新连接。远程访问\
  \ VPN 最常以按需模式使用，远程工作者在需要连接到特定资源或系统时，或需要受信任的网络连接时开启 VPN。\n\nVPN 实施的第二个重要决策是它们将是 `分隧道\
  \ VPN` 还是 `全隧道 VPN`。全隧道 VPN 将所有网络流量通过 VPN 隧道发送，使其在前往远程受信任网络的过程中保持安全。分隧道 VPN 仅将发往远程受信任网络上系统的流量通过\
  \ VPN 隧道发送。分隧道的优势在于为托管站点节省带宽，因为非发往该网络的流量将通过 VPN 用户连接的任何互联网服务提供商发送。然而，这意味着流量不受 VPN\
  \ 保护，也无法被监控。\n\n### 网络设备和安全工具\n\n作为网络设计的一部分，您应该考虑许多不同类型的网络设备。组织使用专用硬件设备、虚拟机和基于云的软件设备，以及开源和专有商业版本中的混合模型。\n\
  \n硬件设备具有专用构建的优势，可实现极高速度的流量处理能力或其他功能。软件和虚拟机设备可以轻松部署，并可根据需求进行扩展，而云设备可以根据需要动态创建、扩展和使用。无论底层系统如何，设备都为供应商提供了一种提供集成系统或设备的方式，该系统或设备可以通过已知方式部署和使用，相比于部署在客户自有服务器上的软件包或服务，能提供更受控的体验。\n\
  \n#### 跳板服务器和跳板盒\n\n管理员和其他员工需要在具有不同安全级别的安全区域中安全操作的方法。`跳板服务器`，有时称为跳板盒，是一种常见解决方案。跳板服务器是一个经过加固和监控的系统，用于提供这种访问。它通常配置有管理工作所需的工具，并经常通过\
  \ SSH、RDP 或其他远程桌面方法进行访问。跳板盒应配置为创建和维护安全的审计跟踪，并在单独的环境中保留副本，以便进行事件和问题调查。\n\n#### 负载均衡\n\
  \n负载均衡器用于将流量分发到多个系统、提供冗余，并便于升级和修补。它们通常用于 Web 服务基础设施，但其他类型的负载均衡器也可在许多网络中找到。负载均衡器通常呈现一个\
  \ `虚拟 IP (VIP)`，客户端在服务端口上向其发送服务请求。然后负载均衡器将这些请求分发给池或组中的服务器。\n\n负载均衡器常见的两种主要运行模式：\n\
  \n*   `主动/主动` 负载均衡器设计将负载分发给同时在线并使用的多个系统。\n*   `主动/被动` 负载均衡器设计在主动系统被移除或未能正确响应健康检查时，将备份或辅助系统上线。这种环境更可能作为灾难恢复或业务连续性环境的一部分，并且被动系统可能提供较少的功能以确保保留某些功能。\n\
  \n负载均衡器依赖各种 `调度` 或负载均衡算法来选择流量发送的位置。以下是一些最常见的选项：\n\n*   `轮询` 通过遍历列表将每个请求发送给服务器，每个服务器轮流接收流量。\n\
  *   `最少连接` 将流量发送给活动连接数最少的服务器。\n*   `基于代理的自适应平衡` 监控负载和影响服务器响应能力的其他因素，并根据代理的报告更新负载均衡器的流量分发。\n\
  *   `源 IP 哈希` 使用源 IP 的哈希值将流量分配给服务器。这本质上是一种使用客户端驱动输入的随机化算法。\n\n除了这些之外，加权算法还会考虑权重或评分。加权算法包括以下内容：\n\
  \n\n\n\n##### 负载均衡算法\n\n*   **加权最少连接**：使用最少连接算法，并结合每台服务器的预定权重值。\n*   **固定加权**：依赖每台服务器的预分配权重，通常基于能力或容量。\n\
  *   **加权响应时间**：将服务器的当前响应时间与权重值结合以分配流量。\n\n最后，负载均衡器可能需要建立持久会话。**持久性**意味着客户端和服务器在会话期间持续通信。这有助于服务器提供更流畅的体验，并保持关于客户端的一致信息，而不需要让整个负载均衡池都知道客户端的会话。当然，粘性会话也意味着负载将保持在会话开始时的那台服务器上，这需要谨慎，以防过多的长时间运行会话在单台服务器上运行，而所使用的负载均衡算法不监控这种情况。\n\
  \n持久性的使用、不同的服务器能力或可扩展架构的使用等因素，都可以驱动调度算法的选择。通过基于代理的自适应均衡算法等方法跟踪服务器利用率可能很有吸引力，但这比简单的轮询算法需要更多的基础设施和开销。\n\
  \n#### 代理服务器\n\n**代理服务器**接受并转发请求，集中处理请求，并允许对请求和响应采取行动。它们可以过滤或修改流量、缓存数据，并且由于它们集中了请求，因此可用于支持基于\
  \ IP 地址的访问限制或类似要求。代理服务器主要有两种类型：\n\n*   **正向代理**：位于客户端和服务器之间，接受来自客户端的请求并将其转发给服务器。由于正向代理隐藏了原始客户端，它们可以匿名化流量，或提供对可能因\
  \ IP 地址或地理位置而被阻止的资源的访问。它们也常用于允许访问图书馆订阅等资源。\n*   **反向代理**：位于服务器和客户端之间，用于帮助负载均衡和内容缓存。因此，客户端可以查询单个系统，但流量负载会分散到多个系统或站点。\n\
  \n#### 网络地址转换网关\n\n网络地址转换（NAT）允许将一组地址转换为一个或多个外部地址。通常，NAT 用于允许多个私有 IP 地址使用单个公共 IP\
  \ 地址访问互联网。**NAT 网关**是提供网络地址转换并跟踪数据包在传输过程中应发送到每个设备的设备。\n\nNAT 网关是常见的网络工具——事实上，它们以互联网路由器的形式存在于许多家庭中，该路由器提供一组私有\
  \ IP 地址，并使用 NAT 允许单个外部公共 IP 为路由器后的许多设备提供服务。\n\nNAT 网关常用于云基础设施即服务环境，其中私有地址用于内部网络。NAT\
  \ 网关服务可用于允许系统连接到互联网。由于 NAT 网关不允许外部系统发起入站连接，除非专门制定规则允许，因此它们可以在不给网关后面的系统带来额外风险的情况下允许安全的出站访问。\n\
  \n#### 内容/URL 过滤器\n\n**内容过滤器**是根据内容规则允许或阻止流量的设备或软件。这些规则可以像阻止特定 URL、域或主机一样简单，也可以很复杂，包含模式匹配、IP\
  \ 信誉和其他内置于过滤规则中的元素。与其他技术一样，它们可以配置允许列表或拒绝列表，以及基于其过滤的内容或流量运行的规则。\n\n代理通常具有内容过滤功能，但内容过滤和\
  \ URL 过滤也可以是其他网络设备和设备（如防火墙、网络安全设备、IPS 等）的一部分。\n\n#### 数据保护\n\n确保数据不会被提取或无意中从网络发送，这就是**数据丢失防护（DLP）**解决方案发挥作用的地方。DLP\
  \ 解决方案通常将系统上的代理与网络边界、电子邮件服务器和其他可能的数据渗漏点的过滤功能相结合。当组织担心敏感、专有或其他数据丢失或泄露时，DLP 解决方案是常见的选择。DLP\
  \ 系统可以使用模式匹配功能，或依赖标记，包括使用元数据来识别应标记的数据。DLP 系统采取的行动可以包括阻止流量、发送通知，或强制识别的数据被加密或以其他安全方式传输，而不是通过未加密或不安全的模式发送。\n\
  \n#### 入侵检测和入侵防御系统\n\n基于网络的**入侵检测系统（IDS）**和**入侵防御系统（IPS）**用于检测威胁，在 IPS 的情况下，还可以阻止它们。它们依赖以下三种不同的检测方法中的一种或多种来识别不需要的和潜在的恶意流量：\n\
  \n*   **基于特征的检测**：依赖已知的哈希或特征匹配来检测威胁。\n*   **启发式检测**，或**基于行为的检测**：寻找与威胁行为匹配的特定模式或动作集。\n\
  *   **基于异常的检测**：为组织或网络建立基线，然后在发生异常行为时标记。\n\n虽然 IPS 需要部署在可以与流量流交互以阻止威胁的直通位置，但 IDS\
  \ 和 IPS 也可以部署在被动模式下。被动模式可以检测威胁但无法采取行动——这意味着以被动部署方式放置的 IPS 实际上就是一个 IDS。图 12.1 展示了这些部署在简单网络中的样子。\n\
  \n```\n![FIGURE 12.1 Inline IPS vs. passive IDS deployment using a tap or SPAN port](img/c12f001.png)\n\
  ```\n\n**图 12.1** 使用 Tap 或 SPAN 端口的直通 IPS 与被动 IDS 部署对比\n\n与本章涵盖的许多其他设备一样，IDS 和 IPS\
  \ 的部署可以是硬件设备、基于软件的、虚拟机或云实例。选择它们的关键决策点包括吞吐量、检测方法、检测规则和更新的可用性、创建自定义过滤器和检测的能力，以及测试中对威胁的检测率。\n\
  \n#### 硬件安全模块\n\n**硬件安全模块（HSM）**可以作为网络设备部署，用于生成、安全存储和管理加密密钥。它们还可以处理加密处理，允许服务器将 CPU\
  \ 密集型任务卸载到专用的加密硬件。除了作为硬件设备可用外，HSM 还广泛作为云基础设施即服务产品的一部分提供，包括专用和虚拟选项。\n\n#### 数据收集\n\
  \n数据中心的许多组件依赖网络设备来获取数据。硬件和软件设备可以充当传感器，收集关于物理环境、网络流量或其他信息的数据，集中式服务和管理需要这些信息以确保组织的持续运营。由于从传感器获取的数据量可能巨大，因此通常也采用分层设计，使用数据收集器和聚合器来集中数据的子集。收集器和聚合器还可以提供预处理、去重或其他信息管理服务，以确保它们提供数据的中央管理和分析服务器不会不堪重负。\n\
  \n### 防火墙\n\n\n\n\n\n### 防火墙\n\n防火墙是网络设计中最常见的组件之一。它们以网络设备的形式部署，或部署在单个设备上，许多系统都实现了简单的防火墙或类防火墙功能。\n\
  \n*Security+* 考试大纲中包含两种基本类型的防火墙：\n\n*   **无状态防火墙**（有时称为包过滤器）根据源/目标 IP 和端口、协议以及可从数据包头部获取的其他信息等数据过滤每个数据包。它们是最基本类型的防火墙。\n\
  *   **有状态防火墙**（有时称为动态包过滤器）关注系统间流量的状态。它们可以对会话做出决策，一旦会话被批准即允许其继续，而无需检查每个数据包。它们在状态表中跟踪此信息，并利用收集到的信息查看整个流量流，而非单个数据包，从而提供更多上下文以做出安全决策。\n\
  \n除了有状态和无状态防火墙外，还有一些术语用于描述特定的防火墙技术。**下一代防火墙（NGFW）**设备远不止是简单的防火墙。事实上，在许多情况下，它们更准确地被描述为一体化网络安全设备。该通用术语用于描述包含一系列功能的网络安全设备，如深度包检测、IDS/IPS\
  \ 功能、防病毒和反恶意软件以及其他功能。\n\n最后，**Web 应用防火墙（WAF）**是一种安全设备，旨在拦截、分析 Web 流量并应用规则，包括数据库查询、API\
  \ 和其他 Web 应用工具等。在许多方面，如果将 WAF 视为防火墙与入侵防御系统的结合体，会更容易理解。它们对发送到 Web 服务器的流量进行更深度的检查，寻找攻击和攻击模式，然后根据所见应用规则。这使它们能够实时阻断攻击，甚至修改发送到\
  \ Web 服务器的流量，以移除查询或请求中潜在的危险元素。\n\n#### 统一威胁管理\n\n**统一威胁管理（UTM）**设备通常包含防火墙、IDS/IPS、反恶意软件、URL\
  \ 和邮件过滤及安全、数据丢失防护、VPN 以及安全监控和分析功能。UTM 和 NGFW 设备之间的界限可能令人困惑，随着双方都提供额外功能，市场持续缩小设备间的差距。\n\
  \nUTM 设备常部署在网络边界，特别是针对整个组织或部门。由于它们拥有广泛的安全功能，可以替代多个安全设备，同时提供单一界面进行管理和监控。它们通常还提供管理功能，可一次处理多个\
  \ UTM 设备，允许拥有多个站点或部门的组织部署 UTM 设备以保护各个区域，同时仍能集中管理和监控它们。\n\n### 网络安全、服务与管理\n\n以安全的方式管理网络，并利用网络设备内置的安全工具和功能，是设计安全网络的另一个关键要素。无论是通过\
  \ QoS 优先处理流量、提供路由安全，还是在现有网络架构之上实施安全协议，网络设备和系统都提供了多种选择。\n\n#### 带外管理\n\n必须保护网络设备或设备的管理界面访问，以防攻击者夺取控制权，并确保管理员在需要时能可靠地获得访问权限。只要可能，网络设计必须包含一种安全**带外管理**的方式。应存在一种单独的访问管理界面的方法。由于大多数设备现在通过网络连接进行管理，现代实现使用单独的管理\
  \ VLAN 或完全独立的物理网络进行管理。对管理界面的物理访问是带外管理的另一种选择，但在大多数情况下，物理访问仅用于紧急情况，因为前往网络设备现场通过 USB、串口或其他接口连接并管理它既耗时，又远不如基于网络的管理平面对管理员有用。\n\
  \n#### 访问控制列表\n\n当你想到访问控制时，首先想到的可能是带有防火墙规则的防火墙，但许多网络设备和设备也支持某种形式的访问控制列表（ACL）。ACL\
  \ 是一组用于过滤或控制网络流量的规则。ACL 可能包含的示例见 表 12.1。\n\n**表 12.1** 示例网络 ACL\n\n| 规则编号 | 协议 |\
  \ 端口 | 目标 | 允许/拒绝 | 备注 |\n| --- | --- | --- | --- | --- | --- |\n| 10 | TCP | 22\
  \ | 10.0.10.0/24 | 允许 | 允许 SSH |\n| 20 | TCP | 443 | 10.0.10.45 | 允许 | 发往 Web 服务器的入站\
  \ HTTPS |\n| 30 | ICMP | 所有 | 0.0.0.0/0 | 拒绝 | 阻止 ICMP |\n\n云服务也提供网络 ACL。VPC 和其他服务提供类防火墙规则，可限制或允许系统和服务间的流量。与防火墙规则一样，这些通常可以使用安全组或其他方法进行分组、标记和管理。\n\
  \n#### 服务质量\n\n确保应用程序、服务或网络流量获得优先级并能满足其设计用途的能力由**服务质量（QoS）**功能处理。用于 Wi-Fi 网络的 `802.11E`\
  \ 和用于有线网络的 `802.1Q`（或 `Dot1Q`）等 QoS 协议定义了流量如何被标记和优先处理，从而定义了如何管理服务质量。\n\n服务质量考虑了网络性能的多个重要要素：可用和使用中的带宽、流量延迟、延迟变化量（抖动）以及错误发生率。这些有助于提供\
  \ QoS 指标，允许根据基于应用程序、用户、端口、协议或 IP 地址的 QoS 规则对流量进行优先级排序和管理。\n\nQoS 为带宽和流量管理以及排队提供支持，以处理优先级较低且需要等待的数据包。它们还可以为优先流量提供成比例或保证的带宽。\n\
  \n所有这些意味着 QoS 可以成为一个重要的安全工具，因为它允许重要流量通过网络，即使网络正遭受攻击或因拥塞而受损。这也意味着配置不当的 QoS 可能对网络构成威胁。\n\
  \n#### 路由安全\n\n网络依赖路由协议来确定流量到达其他网络应采取的路径。常见协议包括 `BGP`、`RIP`、`OSPF`、`EIGRP` 等。针对路由的攻击可能导致中间人（中间人）攻击、因环路或流量发送延迟导致的中断、或流量丢弃。它们还可能导致网络拥塞，或导致路由器无法确定到达远程网络的路由。\n\
  \n尽管存在许多路由协议，但在考虑路由安全时，通过示例来理解会有所帮助。这些协议及其安全功能的示例包括：\n\n*   **BGP（边界网关协议）**内置安全性不强。事实上，BGP\
  \ 路由默认被接受，这偶尔会导致意外或故意的 BGP 劫持，即路由器宣告自己为一条路由，最终将互联网流量重定向至自身。若为故意所为，意味着流量可能被攻击者拦截。若为意外，可能破坏互联网的大部分区域，导致拒绝服务状况和延迟等问题。\n\
  \n\n\n\n\n### 安全协议\n\n#### 路由协议\n\n*   **开放最短路径优先 (OSPF)** 确实集成了一些安全特性，包括基于 MD5\
  \ 的认证，尽管它默认未开启。与其他经过认证的协议一样，OSPF 并不保护实际数据，但它确实验证数据是完整的，且来自预期的路由器。\n\n*   **增强型内部网关路由协议\
  \ (EIGRP)** 是一种思科专有协议，提供认证功能，有助于防止攻击者或其他人发送伪造的路由消息。\n\n网络管理员需要了解他们部署的路由协议，以及如何配置它们以尽可能防止更多问题。不幸的是，由于\
  \ BGP 缺乏安全性等问题，路由安全仍然是一项挑战。\n\n#### DNS\n\n**域名系统 (DNS)** 服务器和服务可能成为攻击者的诱人目标，因为系统依赖\
  \ DNS 来告知它们在尝试使用人类可读名称访问站点时将流量发送到何处。\n\nDNS 本身并非安全协议——事实上，与许多最初的互联网协议一样，它以未加密、无保护的状态传输，且内置无认证能力。幸运的是，可以使用\
  \ **域名系统安全扩展 (DNSSEC)** 来帮助弥补其中一些安全漏洞。DNSSEC 提供 DNS 数据的认证，允许验证 DNS 查询，即使它们未加密。\n\
  \n正确配置 DNS 服务器本身是 DNS 安全的关键组成部分。防止区域传输等技术，以及确保开启 DNS 日志记录并阻止对恶意域的 DNS 请求，是常见的 DNS\
  \ 安全技术。\n\n##### DNS 沉坑\n\n用于帮助防范 DNS 问题的一种工具是 **DNS 沉坑**。DNS 沉坑是一种 DNS 服务器，配置为对特定\
  \ DNS 查询提供错误答案。这允许管理员使恶意和不需要的域名解析到无害地址，并可记录这些查询以帮助识别受感染或被攻陷的系统。\n\n#### 安全套接字层/传输层安全\n\
  \n在传输过程中加密数据的能力是许多协议安全的关键。虽然脑海中浮现的第一个例子可能是通过 HTTPS 实现的安全 Web 流量，但 **传输层安全 (TLS)**\
  \ 广泛用于封装现代系统和网络中的各种协议。\n\nSecurity+ 考试的一个关键概念是在 TLS 中使用 **临时密钥**。在临时 Diffie-Hellman\
  \ 密钥交换中，每个连接都会接收一个唯一的临时密钥。这意味着即使密钥被泄露，过去发生的通信，或新会话中未来的通信也不会暴露。临时密钥用于提供 **完美前向保密**，这意味着即使用于密钥交换的秘密被泄露，通信本身也不会被泄露。\n\
  \n#### 监控服务和系统\n\n没有服务，系统和网络几乎无事可做。确保组织的服务在线且可访问需要监控和报告能力。虽然检查服务是否响应可能很简单，但验证服务是否按预期运行可能更复杂。\n\
  \n组织通常使用多层级的服务监控。第一层也是最简单的一层验证服务端口是否开放并响应。这种基本功能有助于识别重大问题，例如服务无法加载、崩溃或被防火墙规则阻止。\n\
  \n下一级监控要求与服务交互，并对有效响应的样子有所了解。这些事务需要额外的功能，并且可能还会使用验证性能和响应时间的指标。\n\n最后一级监控系统寻找可能故障的指标，并使用广泛的数据来识别潜在问题。\n\
  \n服务监控工具内置于许多运维监控工具、SIEM 设备和其他组织管理平台中。配置服务级监控可以为安全管理员提供对持续问题的洞察，因为服务故障或问题可能是事件的指标。\n\
  \n#### 文件完整性监视器\n\n构成网络的基础设施和系统是攻击者的目标，他们可能会更改配置文件、安装自己的服务，或以其他方式修改需要值得信赖的系统。检测这些更改并对其进行报告或将其恢复正常是\
  \ **文件完整性监视器** 的职责。虽然市场上有许多产品可以处理文件完整性监控，但最古老且最知名的之一是 **Tripwire**，这是一款拥有商业版和开源版本的文件完整性监控工具。\n\
  \n像 Tripwire 这样的文件完整性监控工具为文件创建签名或指纹，然后监控文件和文件系统中受监控文件的更改。它们集成了许多功能以允许修补或用户交互等正常行为，但重点关注意外和非预期的更改。文件完整性监视器可以成为系统安全设计的关键要素，但如果未仔细设置，配置和监控它也可能具有挑战性。由于文件在网络和系统上不断变化，文件完整性监视器可能会产生大量噪音，并需要时间和精力来设置和维护。\n\
  \n#### 欺骗与破坏\n\n最后一类网络相关工具是那些旨在捕获攻击者及其技术信息并破坏正在进行的攻击的工具。捕获攻击者信息可以为防御者提供关于其工具和流程的有用细节，并帮助防御者基于现实经验构建更好、更安全的网络。\n\
  \nSecurity+ 考试大纲中包含三种主要类型的信息收集工具。第一种也是最常见的是 **蜜罐** 的使用。蜜罐是故意配置为看似脆弱的系统，但实际上是经过大量仪表化和监控的系统，它们会记录攻击者的所有行为，并保留其使用的每个文件和命令的副本。它们看起来是合法的，并且可能包含诱人的虚假信息。与蜜罐非常相似，**蜜网**\
  \ 是为收集网络攻击信息而设置和仪表化的网络。本质上，蜜网是一组蜜罐，设置得更具说服力，并由于通过系统网络所需的各种系统和技术，能提供关于攻击者工具的更多细节。\n\
  \n与用于对抗研究的蜜网和蜜罐不同，**蜜文件** 用于入侵检测。蜜文件是一个故意设置的诱人目标文件，包含唯一的、可检测的数据，放置在攻击者若攻击成功可能会访问的区域。如果蜜文件中包含的数据被检测到离开网络，或稍后在网络外被发现，组织就知道系统已被攻破。\n\
  \n你需要了解的该类别中 Security+ 考试的最后一个概念是提供 **虚假遥测数据** 的做法。虚假遥测是欺骗工作的一部分，为攻击者提供额外目标。虚假遥测的概念非常类似于蜜文件——它为攻击者提供一个目标，要么误导他们，要么让你检测到对该信息的访问。\n\
  \n\n\n\n\n### 网络与安全协议\n\n网络通过在不同网络层运行的多种不同协议来传输流量。虽然可以通过为每个可能的系统使用加密通道来保护网络，但在大多数情况下，网络并不会加密每一个端到端的连接。因此，正确选择和实施安全协议对于纵深防御策略至关重要。安全协议有助于确保系统或网络遭到入侵时，不会导致网络流量进一步暴露。\n\
  \n#### 使用安全协议\n\n安全协议在网络和基础设施的许多部分都有其用武之地。安全专业人员需要能够为以下每种场景推荐合适的协议：\n\n*   **语音和视频**依赖许多常见协议。视频会议工具通常依赖\
  \ `HTTPS`，但会话发起协议（`SIP`）和实时传输协议（`RTP`）的安全版本分别以 `SIPS` 和 `SRTP` 的形式存在，它们也被用于确保通信流量的安全。\n\
  *   网络时间协议（`NTP`）的安全版本称为 `NTS`，但 `NTS` 尚未被广泛采用。正如你在本章将了解到的许多其他协议一样，`NTS` 依赖 `TLS`。与其他协议不同，`NTS`\
  \ 并不保护时间数据本身。相反，它专注于认证，以确保时间信息来自受信任的服务器且在传输过程中未被篡改。\n*   **电子邮件和 Web 流量**依赖许多安全选项，包括\
  \ `HTTPS`、`IMAPS`、`POPS`，以及域名消息认证、报告和一致性（`DMARC`）、域名密钥识别邮件（`DKIM`）和发件人策略框架（`SPF`）等安全协议。\n\
  *   文件传输协议（`FTP`）已在很大程度上被 `HTTPS` 文件传输以及 `SFTP` 或 `FTPS` 的组合所取代，具体取决于组织的偏好和需求。\n\
  *   目录服务（如 `LDAP`）可以迁移到 `LDAPS`，即 `LDAP` 的安全版本。\n*   **远程访问技术**——包括 Shell 访问，曾经通过\
  \ `telnet` 实现，现在几乎完全通过 `SSH` 完成——也可以得到保护。微软的 `RDP` 默认加密，但其他远程访问工具可能使用其他协议（包括 `HTTPS`）来确保其流量不被暴露。\n\
  *   **域名解析**仍然是一个安全挑战，长期以来的多次努力对 `DNS` 协议安全性的影响有限。\n*   **路由和交换协议安全**可能很复杂，边界网关协议（`BGP`）等协议缺乏内置安全功能。因此，`BGP`\
  \ 劫持攻击和其他路由攻击仍然可能发生。在许多情况下，组织无法依赖安全协议，需要围绕这一缺陷进行设计。\n*   使用 `DHCP` 进行**网络地址分配**不提供安全协议，针对\
  \ `DHCP` 攻击的网络保护依赖于检测和响应，而非安全协议。\n*   **订阅服务**（如云工具和类似服务）通常利用 `HTTPS`，但也可能为其特定用例提供其他安全协议。可能的订阅和服务类型种类繁多，这意味着如果可用选项存在，必须单独评估这些服务，架构和设计审查以及数据流审查都是保护订阅服务流量最佳实践的一部分。\n\
  \n上述可能的安全选项清单很长，但 `DHCP`、`NTP`、`BGP` 和 `DHCP` 缺乏安全协议这一显著事实表明，虽然安全协议是安全设计的有用组成部分，但它们只是设计过程的一部分。作为安全专业人员，你的评估应确定是否包含合适的安全协议选项、是否正在使用以及是否配置正确。即使正在使用安全协议，你还必须评估现有的其他安全层，以确定设计或实施是否具有适当的安全性，以应对使用过程中将面临的风险。\n\
  \n### 安全协议\n\nSecurity+ 考试重点关注许多常见协议，考生需要了解如何识别和实施它们。在阅读本节时，请考虑何时建议切换到安全协议、两种协议是否可能在环境中共存，以及如果实施该协议还需要考虑哪些额外因素。这些因素包括客户端配置要求、切换到备用端口、不同的客户端软件包、对可能无法直接监控加密流量的安全工具的影响等类似问题。\n\
  \n组织依赖各种各样的服务，其中许多服务的原始实现（如文件传输、远程 Shell 访问、电子邮件检索、Web 浏览等）均为明文实现，这使得流量很容易被捕获、分析和修改。这意味着这些服务所依赖的流量的机密性和完整性无法得到保证，从而促使这些协议的安全版本得以实施。安全分析师经常被要求识别不安全的服务，并推荐或协助实施安全替代方案。\n\
  \n表 12.2 列出了 Security+ 考试大纲中常见的协议及其安全替代方案。许多安全协议依赖 `TLS` 来保护流量，而其他协议则实现 `AES` 加密或使用其他技术来确保其传输数据的机密性和完整性。许多协议为安全版本使用不同的端口，但其他协议则依赖初始协商或服务请求来确定流量是否将被保护。\n\
  \n**表 12.2** 安全与非安全协议\n\n| 非安全协议 | 原始端口 | 安全协议选项 | 安全端口 | 备注 |\n| --- | --- | ---\
  \ | --- | --- |\n| `DNS` | `UDP/TCP 53` | `DNSSEC` | `UDP/TCP 53` | |\n| `FTP` |\
  \ `TCP 21 (and 20)` | `FTPS` | `TCP 21` 显式模式和 `990` 隐式模式 (`FTPS`) | 使用 `TLS` |\n\
  | `FTP` | `TCP 21 (and 20)` | `SFTP` | `TCP 22` (`SSH`) | 使用 `SSH` |\n| `HTTP` |\
  \ `TCP 80` | `HTTPS` | `TCP 443` | 使用 `TLS` |\n| `IMAP` | `TCP 143` | `IMAPS` |\
  \ `TCP 993` | 使用 `TLS` |\n| `LDAP` | `UDP and TCP 389` | `LDAPS` | `TCP 636` | 使用\
  \ `TLS` |\n| `POP3` | `TCP 110` | `POP3S` | `TCP 995` | 使用 `TLS` |\n| `RTP` | `UDP\
  \ 16384-32767` | `SRTP` | `UDP 5004` | |\n| `SNMP` | `UDP 161 and 162` | `SNMPv3`\
  \ | `UDP 161 and 162` | |\n| `Telnet` | `TCP 23` | `SSH` | `TCP 22` | |\n\n考生应识别出上述每一项：\n\
  \n*   **域名系统安全扩展**（`DNSSEC`）专注于确保 `DNS` 信息未被修改或篡改，但它不像此处列出的许多其他安全协议那样提供机密性。`DNSSEC`\
  \ 使用数字签名，允许查询 `DNSSEC` 服务器的系统验证服务器的签名是否与 `DNS` 记录匹配。`DNSSEC` 还可用于为 `IPSec` 密钥、`SSH`\
  \ 指纹和类似记录建立信任链。\n*   **简单网络管理协议第 3 版**（`SNMPv3`）通过提供消息源认证、消息完整性验证和通过加密实现的机密性，改进了\
  \ `SNMP` 的早期版本。它支持多个安全级别，但只有 `authPriv` 级别使用加密，这意味着不安全的 `SNMPv3` 实现仍然可能存在。仅使用 `SNMPv3`\
  \ 并不能自动使 `SNMP` 信息变得安全。\n\n\n\n\n### 安全协议\n\n*   **安全外壳协议** 是一种用于远程控制台访问设备的协议，是\
  \ Telnet 的安全替代方案。SSH 也常被用作隧道协议，或用于支持 SFTP 等其他用途。SSH 可以使用 SSH 密钥，用于身份验证。与许多基于证书或密钥的身份验证用法一样，缺少密码或使用弱密码，以及密钥管理不善，都会使\
  \ SSH 在实际使用中安全性大打折扣。\n\n*   **基于 SSL/TLS 的超文本传输协议** 在现代实现中依赖 TLS，但尽管如此，仍常被称为 SSL。与此处讨论的许多协议一样，底层的\
  \ HTTP 协议依赖 TLS 来为 HTTPS 实现提供安全性。\n\n*   **安全实时传输协议** 是实时传输协议的安全版本，后者是一种旨在通过网络提供音频和视频流的协议。SRTP\
  \ 使用加密和身份验证，试图降低成功攻击的可能性，包括重放攻击和拒绝服务攻击尝试。RTP 使用成对的协议，即 RTP 和 RTCP。RTCP 是控制协议，用于监控服务质量和流同步，RTCP\
  \ 也有一个安全的对应版本，即 SRTP。\n\n*   **安全轻量级目录访问协议** 是受 TLS 保护的 LDAP 版本，提供机密性和完整性保护。\n\n\
  ##### 电子邮件相关协议\n\n尽管许多组织已转向基于 Web 的电子邮件，但邮局协议 (POP) 和互联网消息访问协议 (IMAP) 等电子邮件协议仍在邮件客户端中使用。为两者实现\
  \ TLS 作为保护层的安全协议选项均已存在，从而催生了 **POPS** 和 **IMAPS** 的部署。\n\n**安全/多用途互联网邮件扩展** 提供了加密和签名\
  \ MIME 数据的能力，MIME 是用于电子邮件附件的格式。因此，电子邮件的内容和附件可以受到保护，同时为使用 S/MIME 发送的消息提供身份验证、完整性、不可抵赖性和机密性。\n\
  \n与此处讨论的许多其他协议不同，S/MIME 要求用户拥有证书，才能发送和接收受 S/MIME 保护的消息。需要本地生成的证书或来自公共证书颁发机构 (CA)\
  \ 的证书。这一要求增加了想要与其他个人安全通信的 S/MIME 用户的复杂性，因为证书管理和验证可能变得复杂。因此，尽管许多电子邮件提供商和工具广泛支持，S/MIME\
  \ 的使用频率较低。\n\n当然，相当一部分电子邮件是通过 Web 访问的，这实际上使 HTTPS 成为电子邮件访问最常用的安全协议。\n\n##### 文件传输协议\n\
  \n尽管通过 FTP 进行文件传输越来越少见，但 FTP 的安全版本确实存在且仍在使用。主要有两种选择：**FTPS**，它使用 TLS 实现 FTP；以及 **SFTP**，它利用\
  \ SSH 作为通道来执行类似 FTP 的文件传输。SFTP 经常被选用，因为它更容易穿越防火墙，因为它仅使用 SSH 端口，而 FTPS 可能需要额外的端口，具体取决于配置。\n\
  \n##### IPSec\n\nIPSec (Internet Protocol Security，互联网协议安全) 不仅仅是单一协议。事实上，IPSec 是一整套用于加密和认证\
  \ IP 流量的安全协议套件。Security+ 考试大纲重点关注该标准的两个组件：\n\n*   **认证头** 使用哈希和共享密钥来确保数据完整性，并通过认证发送的\
  \ IP 数据包来验证发送者。AH 可确保 IP 负载和头部受到保护。\n\n*   **封装安全载荷** 在传输模式或隧道模式下运行。在隧道模式下，它为整个数据包提供完整性和认证；在传输模式下，它仅保护数据包的负载。如果\
  \ ESP 与认证头一起使用，可能会给需要更改 IP 或端口信息的网络带来问题。\n\nIPSec 经常用于 VPN，在隧道模式下用于在两个位置之间创建安全的网络连接。\n\
  \n### 攻击与评估网络\n\nSecurity+ 考试要求你熟悉一些网络攻击技术和概念。在复习这些内容时，请思考在发现它们的场景中，你将如何识别、预防和响应它们。\n\
  \n#### 中间人攻击\n\n**中间人** 攻击（有时也称为中间人攻击 [MitM]）发生在攻击者导致本应发送给预期接收者的流量，通过攻击者控制的系统或设备进行中转时。一旦攻击者让流量流经该系统，他们就可以窃听，甚至随意篡改通信。图\
  \ 12.2 显示了中间人攻击成功后，流量流向如何从正常状态发生改变。\n\n![图 12.2 中间人攻击前后的通信](img/c12f002.png)\n\n\
  **图 12.2** 中间人攻击前后的通信\n\n中间人攻击可用于实施 **SSL 剥离**，这是一种在现代实现中移除 TLS 加密、以读取本应发送给可信端点的流量内容的攻击。典型的\
  \ SSL 剥离攻击分三个阶段发生：\n\n1.  用户发送网页的 HTTP 请求。\n2.  服务器响应重定向到该页面的 HTTPS 版本。\n3.  用户发送重定向页面的\
  \ HTTPS 请求，网站随之加载。\n\nSSL 剥离攻击在 HTTP 请求发生时利用中间人攻击，将后续通信重定向通过攻击者控制的系统，从而允许读取或可能修改通信。虽然\
  \ SSL 剥离攻击可在任何网络上实施，但最常见的实现方式之一是通过开放无线网络，攻击者可控制无线基础设施，从而修改通过其接入点和网络连接的流量。\n\n最后一种中间人攻击变体是基于浏览器的攻击（以前称为\
  \ **中间人浏览器** MitB 或 MiB）。这种攻击依赖于植入用户浏览器的木马。该木马随后能够访问和修改浏览器发送和接收的信息。由于浏览器接收并解密信息，基于浏览器的中间人攻击可以成功绕过\
  \ TLS 加密和其他浏览器安全功能，还可以访问具有打开会话的站点或浏览器已认证的站点，这使得 MitB 攻击成为攻击者的一个非常强大的选项。由于基于浏览器的中间人攻击需要安装木马，无论是作为浏览器插件还是代理，系统级安全防御（如反恶意软件工具、系统配置管理和监控功能）最适合防范此类攻击。\n\
  \n#### 域名系统攻击\n\n剥离加密并不是唯一能让恶意行为者窥探你流量的网络攻击类型。事实上，如果他们能控制流量发送到的系统，那就简单多了！这就是 DNS\
  \ 攻击发挥作用的地方。Security+ 考试大纲重点关注三种类型的 DNS 和域相关攻击，以及一个关键的安全和监控工具。\n\n\n\n\n##### 域名劫持\n\
  \n**域名劫持** 会更改域名的注册信息，既可能通过技术手段（如域名注册商的漏洞或对授权用户所属系统的控制），也可能通过非技术手段（如社会工程学）实施。域名劫持的最终结果是攻击者可以更改域名的设置和配置，从而拦截流量、收发电子邮件，或在冒充合法域名持有者的情况下采取其他行动。域名劫持并非获取域名用于恶意目的的唯一途径。事实上，许多域名最终落入非预期所有者手中，是因为它们未被妥善续费。如果你只是域名系统和服务的用户，检测域名劫持可能比较困难，但域名所有者可以利用域名注册商提供的安全工具和功能来保护和监控其域名。\n\
  \n##### DNS 投毒\n\n**DNS 投毒** 可通过多种方式实现。其中一种形式是旁路攻击的另一种变体，攻击者冒充权威 DNS 服务器提供 DNS 响应。DNS\
  \ 协议或实现中的漏洞也可能允许 DNS 投毒，但这类情况较为罕见。DNS 投毒还可能涉及对系统上 DNS 缓存的投毒。一旦恶意 DNS 条目进入系统缓存，系统将继续使用该信息，直到缓存被清除或更新。这意味着即使入侵防御系统（IPS）或其他安全设备发现并阻止了攻击，DNS\
  \ 投毒仍可能产生长期影响。DNS 缓存投毒可能被用户注意到，或被入侵检测系统（IDS）或 IPS 等网络防御设备检测到，但如果实施得当，则很难被发现。\n\n\
  ##### URL 重定向\n\n当域名劫持不可行且 DNS 无法被投毒时，攻击者的另一个选择是 **URL 重定向**。URL 重定向可呈现多种形式，具体取决于攻击者利用的漏洞，但最常见的一种是将备用\
  \ IP 地址插入系统的 `hosts` 文件中。当系统通过 DNS 查找站点时，会首先检查 `hosts` 文件，这使得被修改的 `hosts` 文件成为能够更改它的攻击者的有力工具。修改后的\
  \ `hosts` 文件可手动检查，也可由了解 `hosts` 文件是常见攻击目标的系统安全反恶意软件工具进行监控。在大多数组织中，大多数机器的 `hosts`\
  \ 文件永远不会从其默认状态被修改，这使得变更易于被发现。\n\n##### 域名信誉\n\n尽管 DNS 攻击可为恶意行为者提供攻击组织的途径，但你也可以利用\
  \ DNS 相关信息来帮助防御攻击。**域名信誉** 服务和工具提供关于域名是否为受信任的电子邮件发送者或是否发送大量垃圾邮件的信息。此外，个别组织可能会使用自己的电子邮件安全和反垃圾邮件工具，为电子邮件发送者分配域名信誉评分。\n\
  \n图 12.3 展示了 Cisco Talos 电子邮件信誉服务的示例。正如预期的那样，Gmail 拥有良好的信誉，但你也会注意到默认显示将位置显示为印度的服务。自动化系统并不总是拥有完全准确的数据，特别是对于\
  \ Gmail 这类复杂的跨国服务。\n\n![图 12.3 gmail.com 的信誉数据](img/c12f003.png)\n\n**图 12.3** `gmail.com`\
  \ 的信誉数据\n\n#### 第 2 层攻击\n\n攻击数据链路层对于拥有网络访问权限的攻击者来说是一种有效技术。与高层攻击不同，这些攻击需要对网络或网络上的系统具有本地访问权限，因为第\
  \ 2 层流量受本地广播域的限制。\n\nSecurity+ 考试大纲列出了三种你需要了解并可能需要识别的特定第 2 层攻击：\n\n*   **地址解析协议\
  \ (ARP) 投毒** 攻击向网络的默认网关发送恶意 ARP 数据包，意图更改网关维护的 MAC 地址到 IP 地址的映射关系。攻击者会发送 ARP 回复，声称目标机器的\
  \ IP 地址与其 MAC 地址关联，导致系统和网关将发往目标系统的流量发送到攻击者的系统。攻击者可利用此方法通过中继流量到目标系统来实施旁路攻击，或直接收集和使用接收到的流量。ARP\
  \ 投毒还可通过导致流量无法到达预期系统来制造拒绝服务。ARP 投毒可通过 Wireshark 等工具以及执行协议分析和网络监控的专用网络安全设备进行检测。\n\
  \n*   **媒体访问控制 (MAC) 泛洪** 通过向交换机发送大量 MAC 地址，填满存储端口与 MAC 地址映射关系的 CAM 表或 MAC 表。由于这些表空间有限，泛洪会导致默认行为：当目标未知时，将流量发送到所有端口以确保流量继续流动。攻击者随后可捕获该流量供己用。可通过使用端口安全来防止\
  \ MAC 泛洪，这会限制预期由工作站或设备使用的端口可学习的 MAC 地址数量。此外，NAC 或其他网络认证授权工具可将 MAC 地址与已知或已认证的系统进行匹配。\n\
  \n*   **MAC 克隆** 复制设备的媒体访问控制地址（硬件地址）。Linux `macchanger` 和 `iproute2` 等工具允许手动更改系统的\
  \ MAC 地址。攻击者可能选择这样做以绕过 MAC 地址受限的网络，或获取受 MAC 地址限制的访问权限。如果没有来自网络设备以外来源的系统额外信息，MAC\
  \ 克隆很难被检测到。网络准入控制 (NAC) 功能或其他机器认证和验证技术有助于识别呈现克隆或伪造 MAC 地址的系统。\n\n这些并非第 2 层唯一可实施的攻击。尽管\
  \ Security+ 考试不包含这些内容，但修改网络流量逻辑结构的生成树协议攻击、VLAN 跳跃和中继攻击以及 DHCP 欺骗也发生在第 2 层。\n\n####\
  \ 分布式拒绝服务攻击\n\n安全专业人员需要知道如何检测和识别分布式拒绝服务 (DDoS) 攻击。分布式拒绝服务攻击从多个位置、网络或系统发起，这使其难以阻止且难以检测。同时，DDoS\
  \ 的分布式特性意味着它可能对目标系统或网络投入大量资源，通过其规模之大潜在地压垮目标。\n\n##### 网络 DDoS\n\n分布式拒绝服务攻击最常见的形式之一是基于网络的\
  \ DDoS。恶意行为者通常利用大规模僵尸网络实施网络 DDoS 攻击，且存在提供 DDoS 攻击和类 DDoS 行为的商业服务，用于压力和负载测试。所有这些意味着组织需要制定计划来检测和处理网络\
  \ DDoS 攻击。\n\n在许多情况下，组织的互联网服务提供商 (ISP) 可能会提供 DDoS 防护服务，无论是默认提供还是作为额外的订阅选项。了解 ISP\
  \ 是否提供该功能以及在何种情况下会激活或可开启该功能，可能是组织的一项关键网络防御措施。如果 ISP 不提供 DDoS 防护，第二个选择是确保网络边界安全设备具备\
  \ DDoS 防护能力。\n\n\n\n###### 网络 DDoS 攻击与侦察工具\n\n####### 常见的网络 DDoS 攻击类型\n\n网络分布式拒绝服务攻击可分为两大类：基于流量的攻击和基于协议的攻击。\n\
  \n######## 基于流量的网络 DDoS 攻击\n\n基于流量的网络 DDoS 攻击侧重于海量流量导致拒绝服务状况。某些基于流量的 DDoS 攻击依赖放大技术，利用协议和服务中的缺陷或特性，产生比攻击者发送的流量大得多的流量。基于流量的攻击示例包括\
  \ UDP 和 ICMP 洪水攻击：\n\n*   **UDP 洪水攻击**利用了 UDP 不像 TCP 那样使用三次握手这一事实，因此只需发送大量流量，目标主机就会接收并尝试处理，从而执行\
  \ UDP 洪水攻击。由于 UDP 不受速率限制或其他保护，且不使用握手，因此攻击系统只需极少资源即可发动 UDP 洪水攻击。可使用具有 UDP 洪水检测规则或模块的\
  \ `IDSs` 和 `IPSs` 及其他网络防御设备来检测 UDP 洪水攻击。作为响应过程的一部分，可使用数据包分析器手动检测洪水攻击，但对实时攻击进行手动分析可能具有挑战性，且未必及时。\n\
  \n*   **ICMP 洪水攻击**（有时称为 ping 洪水攻击）发送大量 ICMP 数据包，每个数据包都请求响应。与 UDP 不同，许多现代操作系统对 ICMP\
  \ 进行了速率限制。ICMP 洪水攻击要求攻击方拥有比防御方更多的总带宽，这也是为什么可能会尝试通过 ICMP 发动分布式拒绝服务攻击。许多组织在网络入口处对\
  \ ping 进行速率限制或阻断，以防止此类攻击，它们也可能对安全区域之间的 ICMP 进行速率限制。与 UDP 洪水攻击非常相似，网络安全设备上的检测规则以及手动检测均可使用，但主动防御相对容易且部署非常普遍，尽管如果触及速率限制，可能会丢失一些\
  \ ICMP 流量。\n\n######## 基于协议的网络 DDoS 攻击\n\n基于协议的网络 DDoS 攻击侧重于网络所用的底层协议。\n\n*   **SYN\
  \ 洪水攻击**发送三次握手的第一步，但不响应返回的 `SYN-ACK`，从而耗尽 TCP 栈资源。这些攻击是最常见的现代基于协议的网络 DDoS 攻击之一。\n\
  *   **早期攻击**针对脆弱的 TCP 栈，采用如**死亡之 Ping** 等攻击，发送过大的 ping 数据包导致许多系统无法处理；以及 **Smurf\
  \ 攻击**，利用带有伪造发送者地址的 ICMP 广播消息，导致广播域内的系统向所谓的发送者发送流量，从而将其淹没。\n*   **分片数据包**、所有 TCP\
  \ 标志位均置 1 的数据包（**Christmas Tree** 或 **Xmas 攻击**），以及各种其他攻击，均利用了操作系统中网络实现的缺陷和局限性。\n\
  \n安全专业人员需知晓，网络协议的特性及这些协议的具体实现可能被用作攻击的一部分，并且他们可能需要识别这些攻击。\n\n图 12.4 显示了在 `Wireshark`\
  \ 中开启适当过滤器后看到的 SYN 洪水攻击。识别 SYN DDoS 通常意味着查看针对目标主机的流量，并注意到有大量 `SYN` 数据包被发送，但请求方未完成握手的其余部分。请注意，在该图中，单个系统正在发送\
  \ SYN 洪水；在真实的 DDoS 中，会显示多个系统作为流量来源。需要按目标系统进行过滤，并确保三次握手未完成，以验证 DDoS 攻击。\n\n![图 12.4\
  \ Wireshark 中显示的 SYN 洪水攻击](img/c12f004.png)\n\n**图 12.4** Wireshark 中显示的 SYN 洪水攻击\n\
  \n##### 运营技术 DDoS\n\n**运营技术 (OT)** 是控制建筑、工厂、发电厂及其他行业中设备和系统的软件和硬件。**物联网 (IoT)** 的增长导致更多设备具备网络功能，从而产生了一整套可通过网络攻击的新设备。由于\
  \ IoT 设备通常缺乏计算机和网络设备所具备的安全防护，且可用的处理器、内存和存储可能更有限，因此它们比网络上的其他设备更容易受到基于网络的 DDoS 攻击。\n\
  \n尽管 OT DDoS 攻击在 **Security+** 考试大纲中被列为一个独立主题，但大多数运营技术攻击将依赖我们已讨论的相同类型的网络和基于应用程序的\
  \ DDoS 攻击。安全从业者需牢记的一个关键要素是：OT 通常具有较少的报告、较少的管理和较少的内置安全功能，这意味着针对 OT 设备和系统的网络 DDoS\
  \ 和其他攻击的检测与响应，将需要使用外部设备和工具来处理。\n\n在没有额外安全工具的情况下，检测针对 OT 设备或网络的攻击，通常意味着注意到其无响应或似乎已从网络掉线。进一步调查可能会显示设备已崩溃，或虽在线但因不堪重负而不响应网络流量。此时，可启动传统的事件响应和网络事件调查技术。\n\
  \n由于 OT 和 IoT 设备总体上对潜在敌对网络的准备仍不足，设计和架构规划可能是保障其安全的关键控制措施。使用隔离的 `VLAN`、限制网络流量的入站和出站、防止未知设备添加到隔离的\
  \ `VLAN`、以及对这些网络进行监控检测，均是防止各类 OT 网络攻击的有用技术。\n\n#### 网络侦察与发现工具和技术\n\n**Security+**\
  \ 考试大纲列出了一长串特定的网络工具，你需要至少基本熟悉这些工具中的每一个的功能和用法。如果你以前没用过它们，请务必了解每个工具的作用、适用的操作系统，以及如何运行命令或使用该工具。你还应考虑如何利用该工具评估自己组织的安全性。\n\
  \n##### 路由、DNS 信息和路径\n\n当你想确定系统是否在线以及发送到该系统的流量延迟时，最简单的工具是 `ping`。`ping` 向目标主机发送\
  \ `ICMP` 回显请求数据包，并计算最小、最大和平均往返时间。正如你所料，你可以使用命令行标志来确定发送多少个 ping、载荷大小以及各种其他设置。最有用的标志之一是\
  \ `-t` 标志，它会持续发送 ping 直到被停止。运行 `ping -t` 可以显示系统是否突然停止响应，或系统的响应时间是否大幅波动。\n\n了解系统在互联网上的逻辑位置，以及流量从该系统到其他系统将采取的路由，在你试图了解网络拓扑或进行故障排除时也非常有用。Windows\
  \ 和基于 Linux/Unix 的系统都包含运行路由跟踪命令的功能，该命令将尝试验证系统之间的路由。\n\n\n\n\n#### 网络工具和实用程序\n\n\
  ##### Traceroute 和 Pathping\n\n在 Windows 中，该命令称为 `tracert`，而在 Linux 中称为 `traceroute`。这两个命令的功能非常相似。图\
  \ 12.5 显示了针对 `www.wiley.com` 的 Windows `tracert` 命令。Wiley 使用亚马逊提供的 CloudFront 内容分发系统来分发其网页，这意味着\
  \ Wiley 网站解析到一个 CloudFront 主机。前 11 跳中的每一跳都显示了流量经过的设备的主机名或 IP 地址。首先是一个家用路由器，然后显示各种\
  \ Time Warner Cable（`rr.com`）地址。第 12-23 跳无法解析，最后到达 CloudFront 目标。\n\n![图 12.5 www.wiley.com\
  \ 的示例 tracert](img/c12f005.png)\n\n**图 12.5** `www.wiley.com` 的示例 `tracert`\n\n\
  `traceroute` 与 `tracert` 在一个关键方面表现不同：`traceroute` 发送 UDP 数据包，而 Windows 上的 `tracert`\
  \ 发送 ICMP 数据包。这意味着您可能会收到路径上主机的不同响应。然而，每个测试过程的基本功能是相同的：生存时间 (TTL) 值从 1 开始设置，并随每个发送的数据包递增。路由器将\
  \ TTL 减 1，丢弃 TTL 为 0 的数据包，并针对这些数据包发回 ICMP 超时消息。这会告诉 `traceroute` 路径中每一步的路由器是哪个。您还会注意到显示了延迟信息，这有助于识别是否存在缓慢或有问题的链路。\n\
  \n`pathping` 是一种 Windows 工具，它也可以追踪到目标的路由，同时提供延迟和丢包信息。`pathping` 在一段时间内计算数据，而不是单次路径遍历，从而提供关于网络上可能发生情况的更多见解，但它可能会慢得多，因为每一跳都有\
  \ 25 秒的时间来收集统计数据。图 12.6 显示了针对 `www.wiley.com` 的 `pathping`。\n\n除了路径信息，技术人员通常还需要\
  \ DNS 信息。这就是 `nslookup` 和 `dig` 的用武之地。两者都可以执行 IP 地址查找以返回域名，或执行域名查找以返回 IP 地址。两者还可以查找特定的\
  \ DNS 信息，如 MX（邮件服务器）、A 记录和其他 DNS 记录。用户可以手动选择特定的 DNS 服务器或配置其他选项。\n\n![图 12.6 www.wiley.com\
  \ 的示例 pathping](img/c12f006.png)\n\n**图 12.6** `www.wiley.com` 的示例 `pathping`\n\n\
  在 Windows 上对 `www.wiley.com` 执行 `nslookup` 返回以下信息：\n\n```\nnslookup www.wiley.com\n\
  Server: UnKnown\nAddress: 192.168.1.1\n\nNon-authoritative answer:\nName:    d1x6jqndp2gdqp.cloudfront.net\n\
  Addresses: 52.85.77.112\n         52.85.77.80\n         52.85.77.16\n         52.85.77.121\n\
  Aliases: www.wiley.com\n```\n\nLinux 系统上的 `dig` 提供类似的信息，但细节更多：\n\n```\ndig wiley.com\n\
  \n; <<>> DiG 9.11.16-2-Debian <<>> wiley.com\n;; global options: +cmd\n;; Got answer:\n\
  ;; ->>HEADER<<- opcode: QUERY, status: NOERROR,\nid: 8548\n;; flags: qr rd ra; QUERY:\
  \ 1, ANSWER: 1,\nAUTHORITY: 0, ADDITIONAL: 1\n\n;; OPT PSEUDOSECTION:\n; EDNS: version:\
  \ 0, flags:; udp: 4096\n;; QUESTION SECTION:\n;wiley.com.                     IN\
  \       A\n\n;; ANSWER SECTION:\nwiley.com. 900                  IN       A    \
  \ 63.97.118.67\n\n;; Query time: 82 msec\n;; SERVER: 192.168.1.1#53(192.168.1.1)\n\
  ;; WHEN: Sun Aug 23 11:42:58 EDT 2020\n;; MSG SIZE rcvd: 54\n```\n\n您可能想知道为什么要选择使用\
  \ `dig` 而不是输出简单、清晰的 `nslookup`。`dig` 提供更多数据，您可以用它来执行诸如使用 `dig @server example.com\
  \ ns` 请求域的所有名称服务器，或使用 `dig @server example.com axfr` 执行区域传输等操作。这意味着当需要更强大的工具时，经常会使用\
  \ `dig`。\n\n##### 系统级网络信息\n\n收集关于系统的网络信息是技术人员的另一项常见任务。Security+ 考试重点关注四种常在本地系统上运行以收集其网络配置和状态信息的工具：\n\
  \n*   `ipconfig` (Windows) 和 `ifconfig` (Linux) 显示其运行所在主机的当前 TCP/IP 网络配置。这将包括系统上存在的接口、IPv4\
  \ 和 IPv6 IP 地址、与这些接口关联的 MAC 地址、连接速度、网络掩码、广播域以及关于连接的其他详细信息。这两个命令也可用于启用和禁用接口、刷新或释放\
  \ DHCP 地址以及控制网络接口。\n\n*   `netstat` 按协议提供网络统计信息，包括每个连接的本地地址和远程地址，以及 TCP 连接的状态。其他统计信息（如按进程\
  \ ID 列出的开放端口、网络接口列表和服务）在不同版本中的可用性各不相同。\n\n*   `arp` 提供关于本地主机 ARP 缓存的信息。在 Windows\
  \ 系统上，使用 `-a` 标志将显示系统上每个接口的当前 ARP 缓存，但在 Linux 系统上，相同的标志将显示 ARP 信息的另一种格式。`arp` 可用于从\
  \ ARP 表中添加和删除主机，并作为被动侦察工作的一部分。\n\n*   `route` 用于显示和修改系统的路由表。与此处列出的许多其他工具一样，`route`\
  \ 的功能和标志在 Windows 和 Linux 之间有所不同。尽管命令行有差异，但这两个工具都具有添加、显示和删除路由的相似底层功能。\n\n##### 端口和漏洞扫描\n\
  \n扫描系统、端口和漏洞是安全从业者和网络管理员的常见任务。发现设备、识别它们提供的服务以及存在的任何漏洞，对于防御者、渗透测试团队和攻击者来说都是必要的。许多工具可以执行这些功能，但\
  \ Security+ 考试重点关注两种常用工具和一类通用工具：`nmap`、Nessus 和 *IP 扫描器*。\n\n`nmap` 是一款非常流行的端口扫描工具，适用于\
  \ Windows 和 Linux。它可以扫描主机、服务、服务版本和操作系统，并可通过脚本提供额外功能。基本的 `nmap` 用法非常简单：`nmap [` *`主机名`*\
  \ 或 *`IP 地址`* `]` 将扫描一个系统或网络范围。其他标志可以控制扫描类型，包括 TCP 连接、SYN 和其他扫描类型、端口范围以及许多其他功能。\n\
  \n图 12.7 显示了对一个开放多种服务的示例系统的 `nmap` 扫描。您会立即注意到潜在的脆弱服务，如 FTP、两个数据库服务、IRC 以及各种其他有趣的服务。管理员可以使用端口扫描来识别意外的系统和服务，并检查他们可能无法直接访问的系统上的配置更改。\n\
  \n![图 12.7 来自系统的示例 nmap 扫描](img/c12f007.png)\n\n**图 12.7** 来自系统的示例 `nmap` 扫描\n\n\
  *Nessus* 是一款漏洞扫描工具。虽然 `nmap` 只会识别正在运行的服务的端口、协议和版本，但 Nessus 会尝试识别该服务是否存在漏洞，并提供这些漏洞的完整报告及有用信息，包括文档和修复程序的参考。Nessus\
  \ 的替代品（如开源的 OpenVAS 和商业工具 Rapid7 的 Nexpose）也常与 Nessus 一起部署，但 Security+ 考试大纲重点关注\
  \ Nessus。\n\n\n\n\nIP 扫描工具还有许多其他选择，范围从使用 `netcat` 测试开放端口的简单选项，到 Angry IP Scanner\
  \ 和 Spiceworks IP Scanner 等完整工具。还有许多其他工具存在，并且可能在你合作的组织中被使用。它们都基于相似的原则运行：它们尝试连接系统，然后连接到它们配置扫描的每个\
  \ IP 地址或系统上的每个端口，并报告发现的内容。\n\n###### 数据传输和通用工具\n\n`netcat` 常被称为网络界的“瑞士军刀”，因为它可用于多种用途。它也是一个非常小的程序，这意味着它可以轻松传输到可能需要\
  \ `netcat` 这类工具的系统上。`netcat` 可用于抓取横幅以确定服务类型等简单用途。它可以提供本地或远程 Shell，允许与服务建立原始连接，传输文件，并允许你与\
  \ Web 服务器交互。\n\n使用 `netcat` 连接服务非常简单：\n\n```\nnc [hostname] [port]\n```\n\n随后可以直接发出\
  \ SMTP 或 HTTP 等命令。\n\n`netcat` 既可以充当监听器，也可以充当客户端，从而允许执行 Shell 操作或文件传输。使用 `netcat`\
  \ 进行文件传输首先需要设置一个监听器：\n\n```\nnc -lvp [port] > /home/example/file.txt\n```\n\n然后使用\
  \ `netcat` 下载文件很简单：\n\n```\nnc [listener IP] [port] < /file/location/for/download/file.txt\n\
  ```\n\n`netcat` 用途广泛，意味着它可用于许多目的。你甚至可以用 `netcat` 进行端口扫描！\n\n`curl` 实用程序常见于 Linux\
  \ 系统，用于通过 URL 传输数据。这意味着它常被用于手动执行 HTTP `get` 等 HTTP 命令，或获取 HTTP 头部。它也可用于通过 FTP、FTPS\
  \ 和 SFTP 传输文件，以及用于各种使用 URL 的协议的通用目的。使用 HTTP `get` 检索页面的示例 `curl` 命令如下：\n\n```\n\
  curl --request GET https://www.example.com\n```\n\n此类别中的最后一个通用工具是 `hping`，一种用于组装和分析\
  \ TCP/IP 数据包的工具。渗透测试人员和安全分析师有时需要构建自定义数据包来测试问题或漏洞，或查看防火墙是否会正确响应。使用 `hping` 进行分析还可以提供操作系统指纹识别等信息，或根据数据包详情帮助推测系统上线时长。它适用于\
  \ Linux 和 Windows，使其成为在各种情况下都有用的工具。\n\n###### OSINT 和数据收集工具\n\n`theHarvester` 是一款开源情报收集工具，可利用\
  \ LinkedIn、Google、Bing 和百度等搜索引擎、PGP 服务器及其他来源，检索电子邮件账户、域名、用户名和其他详细信息。`theHarvester`\
  \ 可从命令行运行，并提供域名或 URL 以及要使用的搜索引擎。图 12.8 显示了我们的出版商 Wiley（Sybex 的母公司）的结果。Google 搜索提供主机列表，使用\
  \ LinkedIn 会返回员工姓名，其他搜索引擎可能提供额外数据。\n\n![FIGURE 12.8 theHarvester output for wiley.com](img/c12f008.png)\n\
  \n**图 12.8** `wiley.com` 的 `theHarvester` 输出\n\n收集情报的另一种方法是使用 `scanless`，这是一种利用第三方扫描器收集信息的端口扫描器。`scanless`\
  \ 工具利用 viewdns、yougetsignal 和 spiderip 等端口扫描器。`scanless` 随后使用这些工具运行端口扫描，而不会暴露运行扫描的系统作为扫描源。基本命令行很简单，返回的端口扫描数据非常类似于\
  \ `nmap` 扫描，输出取决于你选择的扫描工具：\n\n```\nscanless -s [chosen scanning site] -t target\n\
  ```\n\n重要的是要注意，`scanless` 将从组织外部运行，而非内部，因此结果看起来会与从受信任或安全边界内的工作站运行扫描时不同。\n\n列表中的下一个工具是\
  \ `Sn1per`，一款自动化扫描工具，它为渗透测试人员结合了多种工具，包括通过 WhoIs、DNS 和 ping 进行侦察；端口扫描和枚举；Metasploit\
  \ 和 `nmap` 自动化；以及暴力破解以尝试自动获取目标访问权限。`theHarvester` 专注于开源情报，而 `Sn1per` 旨在执行自动化渗透测试。\n\
  \nSecurity+ 考试大纲中用于信息收集的最后一个工具是 `DNSEnum`。该工具用于查找域的 DNS 服务器和条目，可指定查询特定 DNS 服务器，或默认使用运行该工具的系统所依赖的\
  \ DNS 服务器。图 12.9 显示了针对 `wiley.com` 的 `dnsenum` 命令。请注意，你可以看到主域名服务器、`wiley.com` 的主机地址，以及依赖\
  \ FireEye 云服务过滤邮件的 MX 服务器。正如通常从妥善保护的 DNS 服务器预期的那样，两个主域名服务器都拒绝允许 `DNSEnum` 执行区域传送。\n\
  \n此类信息收集工具可以帮助网络管理员和安全专业人员检查其自身网络的配置，也可以帮助渗透测试人员（或攻击者）收集有关目标的信息。作为安全专业人员，你应该了解这些工具及其提供的信息类型，以便选择合适的工具收集所需信息。\n\
  \n###### 数据包捕获和重放\n\n对于需要识别攻击、执行被动侦察，并在渗透测试期间记录其在网络上自身行动的安全专业人员来说，捕获和分析网络流量的能力非常重要。许多\
  \ Linux 和 Unix 系统默认提供 `tcpdump`，这是一款命令行数据包捕获工具。它可以使用各种过滤和输出选项捕获数据包。由于网络流量可能很大，使用\
  \ `tcpdump` 捕获到文件通常是个好主意。一个典型的 `tcpdump` 命令行，用于将 Linux 系统主网络接口上 TCP 端口 80 的流量捕获到\
  \ PCAP 文件，如下所示：\n\n```\ntcpdump -w capture.pcap -i eth0 tcp port 80\n```\n\n![FIGURE\
  \ 12.9 DNSEnum output for wiley.com](img/c12f009.png)\n\n**图 12.9** `DNSEnum` 输出\
  \ `wiley.com`\n\n你还可以按源和目标 IP 捕获数据包、从文件读取，并执行其他对安全从业者有用的操作。图 12.10 显示了使用 `tcpdump`\
  \ 捕获 `nmap` 对系统进行端口扫描期间流量片段的示例。请注意，`nmap` 会随机化扫描中的端口以避免线性扫描，但这样的捕获文件允许你快速注意到系统正在接收一系列连接，这些连接快速测试端口然后结束，而没有后续流量。\n\
  \n![FIGURE 12.10 tcpdump of a segment of nmap port scanning](img/c12f010.png)\n\n\
  **图 12.10** `nmap` 端口扫描片段的 `tcpdump` 捕获\n\n该图显示流量从 `10.0.2.15` 发送到 `10.0.2.4`，你可以看到包括\
  \ `21`、`22`、`135` 和 `445` 在内的各种被测试端口。`nmap` 以 ARP 请求开始，以获取关于 `10.0.2.4` 的信息。\n\n\
  \n\n虽然 `tcpdump` 是一个非常有用的工具，但在带有图形用户界面 (GUI) 的工具中捕获和分析数据包通常更有用。Wireshark 提供了 GUI\
  \ 以及广泛的过滤、协议分析和检查工具，使分析师能够以自动化或工具辅助的方式对网络流量执行更复杂的分析。图 12.11 显示了 Wireshark 捕获的同一网络端口扫描。请注意，流量经过颜色编码，数据按可排序的列对齐，并且\
  \ Wireshark 提供了各种工具，包括分析工具、统计工具，以及用于处理电话 (VoIP)、无线和其他数据包捕获的专用功能。\n\n![图 12.11 Wireshark\
  \ 捕获的 nmap 端口扫描片段](img/c12f011.png)\n\n**图 12.11** Wireshark 捕获的 `nmap` 端口扫描片段\n\
  \n来自 `tcpdump` 或 Wireshark 等工具的数据包捕获可以使用 `tcpreplay` 进行重放。默认情况下，它只会以捕获时的速度将流量发送回去，但\
  \ `tcpreplay` 可用于修改速度、拆分输出，或应用过滤器或修改。这些对于测试安全设备都非常有用。作为分析师，你可能会使用 `tcpreplay` 重放已知攻击，以检查新编写的\
  \ IPS 规则是否会触发，或者防火墙是否会阻止拒绝服务攻击。\n\n###### 沙箱\n\n与本节列出的其他工具不同，Security+ 考试提供的列表中的最后一个工具是\
  \ Cuckoo，更广为人知的是 Cuckoo Sandbox。Cuckoo Sandbox 是一种自动化恶意软件分析工具，可以通过多种高级方式分析恶意软件，从跟踪对系统组件和\
  \ API 的调用，到捕获和分析恶意软件发送的网络流量。由于 Cuckoo Sandbox 是自动化工具，一旦设置完成，你只需让它分析潜在的恶意软件，如 图 12.12\
  \ 所示。在该示例中，该文件被迅速识别为恶意软件，并获得了 10/10 的评分。\n\n![图 12.12 Cuckoo Sandbox 对恶意软件文件的分析](img/c12f012.png)\n\
  \n**图 12.12** Cuckoo Sandbox 对恶意软件文件的分析\n\n### 摘要\n\n安全专业人员需要了解企业安全网络中使用的关键安全概念，以及如何实施安全网络设计。网络分段和网络访问控制等关键要素确保系统和设备位于适当的安全区域中，并且只有期望的系统连接到网络。端口安全等保护措施可防止已连接机器发起的攻击影响网络，而\
  \ VPN 则通过公共或不受信任网络中的隧道连接网络和系统。\n\n许多安全工具都可作为安全设备和装置使用。通过跳板机进行安全访问，让管理员能够安全地跨越安全边界。负载均衡器、代理、NAT\
  \ 网关和内容过滤器都为网络设备提供保护，而防火墙、IDS 和 IPS 设备以及 DLP 工具则提供专注的安全功能。安全和设备管理设计选项包括带外管理技术、访问控制列表、服务质量功能、路由协议安全选项、DNS\
  \ 安全配置、广泛使用 TLS 和启用 TLS 的服务、监控工具，甚至包括用于捕获和分析攻击者工具及技术的工具。\n\n使用安全协议和服务代替不安全版本，以及了解每种协议和服务的局限性和实施要求也很重要。一旦攻击者进入网络，他们将尝试访问网络流量，安全协议将有助于确保攻击者拦截的流量不易被其访问。安全电子邮件、FTP、HTTP\
  \ 和 Secure Shell 等选项都是安全网络设计工具包的一部分。\n\n即使所有这些防御措施都已到位，你仍需能够识别多种攻击：中间人攻击、第 2 层攻击、DNS\
  \ 攻击和分布式拒绝服务攻击，包括运营技术攻击。这些攻击各自具有可识别的特征，范围从流量模式到交换机行为。\n\n成功分析、评估和防御网络需要一套广泛的工具。分析师必须了解可评估路由、路径和延迟的工具的用途和基本用法。你应该能够收集有关系统网络接口、流量统计、路由以及网络上其他本地系统的信息。端口和漏洞扫描工具也可以帮助评估网络，开源情报收集工具可以在不实际扫描目标网络的情况下提供详细信息。`netcat`\
  \ 和 `curl` 等实用程序有助于传输和获取数据；`hping`、`tcpdump` 和 Wireshark 允许你创建、捕获和分析数据包及网络流量。\n\n\
  ### 考试要点\n\n**网络安全的基础是安全设计。** 基于风险或安全要求划分不同的安全区域有助于保护网络。DMZ、内部网和外部网都是常见的网络分段选项，零信任网络将分段概念扩展到使每个系统都能自我防御。NAC\
  \ 可保护网络免受不受信任设备连接的影响，而端口安全和环路防护、广播风暴防护等端口级保护可确保恶意或配置错误的系统不会导致网络问题。端口跨越和镜像通过创建其他端口流量的副本来实现数据包捕获。VPN\
  \ 用于将网络流量通过隧道传输到另一位置，它们可以是加密的，也可以只是简单的隧道传输。\n\n**网络设备用于为网络和系统提供安全服务。** 网络设备有多种类型。跳板服务器和跳板机提供了一种安全的方式来访问另一安全区域中的系统。负载均衡器将负载分散到各个系统中，并可以使用不同的调度选项以及主动/主动或主动/被动设计等运行模式。代理服务器要么将一组客户端的连接集中转发到服务器，要么将一组服务器的连接集中转发到客户端，通常作为一种负载均衡策略。内容和\
  \ URL 过滤器根据规则限制可进出网络的信息，数据丢失防护系统监控以确保不应离开系统或网络的数据被识别并标记、安全发送或阻止。NAT 网关允许多个系统使用单个公共地址，同时防止未经特殊配置的入站连接。IDS\
  \ 和 IPS 设备根据恶意行为、签名或流量异常进行识别并采取行动。HSM 创建、存储和管理加密密钥和证书，也可用于卸载加密处理。传感器和收集器等数据收集设备有助于数据收集。防火墙用于构建安全区域，并放置在信任边界处。UTM\
  \ 设备将这些安全功能和能力中的许多结合到单个设备或系统中。\n\n\n\n\n### 网络安全服务与管理技术\n\n网络安全服务和管理技术有助于确保网络保持安全。带外管理将管理接口置于单独的\
  \ VLAN 或物理网络上，或要求直接连接，以帮助防止攻击者访问管理接口。访问控制列表用于网络设备，根据端口、协议或 IP 地址等信息阻止或允许特定流量。服务质量协议和设置可用于确定流量优先级，以确保重要流量能够通过网络，同时限制攻击和错误配置的影响。由于路由协议缺乏重要的安全功能，路由安全颇具挑战性。经过身份验证的路由协议确实存在，它们有助于限制针对路由协议的攻击所造成的某些影响。DNS\
  \ 安全也有限，但 DNSSEC 有助于验证 DNS 服务器和响应。必须正确配置 DNS 服务器，以防止区域传送和其他 DNS 攻击。TLS 广泛用于保护网络流量，充当许多其他协议的封装层。监控服务和系统有助于确保它们保持在线和可访问，但由于可生成的信息量巨大，且如果验证和监控未完全验证服务响应，则可能出现误报，因此需要谨慎操作。文件完整性监视器检查文件是否已更改，并可针对更改发出警报，或将现有文件恢复到更改前或删除前的状态。蜜罐和蜜网用于收集有关攻击者的信息，蜜文件和虚假遥测数据用于识别潜在的入侵以及从您环境中的系统收集信息的攻击者。\n\
  \n### 安全协议\n\n安全协议提供了安全发送和接收信息的方法。许多原始的互联网协议是不安全的——它们不提供加密或身份验证，并且可能被捕获、分析或修改。使用协议的安全版本或使用替代的安全服务和协议，是确保网络安全的重要组成部分。关键协议包括语音和视频协议（如\
  \ `SRTP`）；电子邮件协议（如 `IMAPS` 和 `POPS`）；以及安全协议（如 `DMARC`、`DKIM` 和 `SPF`）。文件传输可以通过 `SFTP`\
  \ 或 `FTPS` 完成，而不使用 `FTP`；目录服务可以从 `LDAP` 迁移到 `LDAPS`。某些协议没有那么多或那么完整的安全选项。事实上，`DNS`、路由和\
  \ `DHCP` 都缺乏安全通信选项。网络管理员在设计和运营网络时必须考虑到这些因素。\n\n### 用于网络评估的命令行工具\n\n安全专业人员必须知道如何使用命令行工具来收集网络和系统信息。命令行工具是您网络评估和管理工具包的重要组成部分。路由信息可以使用\
  \ `ping`、`tracert`、`traceroute` 和 `pathping` 来收集。DNS 信息由 `dig` 和 `nslookup` 提供。关于网络和流量的系统信息可以由\
  \ `ipconfig`、`ifconfig`、`netstat`、`arp` 和 `route` 提供。端口扫描通常涉及 `nmap` 和 `Nessus`，但也可以使用一系列其他工具，包括其他基于\
  \ IP 的扫描器。`netcat` 是许多安全专业人员使用的多功能工具，因为它体积小、可移植且功能广泛。`curl` 根据 URL 检索信息，`hping`\
  \ 允许进行数据包构造和分析。OSINT 工具如 `theHarvester`、`Sn1per` 和 `DNSEnum` 允许在不直接与目标系统通信的情况下收集信息。最后，数据包捕获工具如\
  \ `tcpdump` 和 `Wireshark` 允许在命令行或 GUI 环境中分析和审查流量，沙箱（如 `Cuckoo`）可用于在安全环境中测试恶意软件的存在。\n\
  \n### 复习题\n\n1.  SSL 剥离攻击寻找什么来执行中间人攻击？\n    1.  未加密的 HTTP 连接\n    2.  未受 DNSSEC\
  \ 保护的 DNS 查询\n    3.  未受保护的 ARP 请求\n    4.  以上全部\n\n2.  Ben 想要观察针对网络上多个系统的恶意行为。他设置了各种系统和工具，以便捕获攻击工具的副本并记录所有进行的攻击。他建立了什么？\n\
  \    1.  蜜罐\n    2.  熊陷阱\n    3.  蜜网\n    4.  粘性陷阱\n\n3.  Valerie 想要替换她在组织中发现仍在使用的\
  \ Telnet 访问。她应该使用哪种协议来替换它，它将运行在哪个端口上？\n    1.  SFTP，端口 21\n    2.  SSH，端口 22\n \
  \   3.  HTTPS，端口 443\n    4.  RDP，端口 3389\n\n4.  James 担心防止网络上的广播风暴。以下哪种解决方案**不是**防止其网络上广播风暴的有效方法？\n\
