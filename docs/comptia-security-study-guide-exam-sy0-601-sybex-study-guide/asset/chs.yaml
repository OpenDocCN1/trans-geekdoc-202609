  \n**6. B.** 地理围栏设置地理边界，可用作规则集的一部分。在本例中，Samantha 应将规则集设置为：当设备位于地理围栏区域之外时，阻止用户使用该设备。时间限制和基于时间的登录均是相关的账户策略，用于确保用户在不应工作的时间无法登录。这可以防止泄露凭证的重复使用和非工作时间内的内部威胁滥用。最后，不可能的旅行时间是一种地理登录数据用法，它记录登录发生的时间并将其与登录地点间的距离进行比较。如果时间不可能（例如，在中国登录\
  \ 5 分钟后又在美国登录），则可能会报告并阻止该登录。\n\n**7. B.** 图片密码要求用户点击图片上特定的、自定义的部分。这意味着点击这些点是“你能做的事”（Something\
  \ you can do）。“你所在的地方”涉及位置，“你表现出的特征”典型指个性特征，“你认识的人”涉及第三方，当某人无法以其他方式证明身份时，这对验证很有用！\n\
  \n**8. B.** 硬件安全模块（HSM）用于创建、安全存储和管理数字签名、加密密钥对及其他加密功能。它们不用于生物识别注册数据、启用联邦或生成一次性密码。\n\
  \n**9. C.** 基于角色的访问控制（RBAC）根据个人的角色设置权限，角色通常与其工作相关联。基于属性的访问控制（ABAC）通常匹配除工作角色以外的属性。自主访问控制（DAC）和强制访问控制（MAC）通常在操作系统层面实现。\n\
