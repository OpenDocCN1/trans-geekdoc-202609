  ## 第 17 章\n\n风险管理与隐私\n\n组织面临着种类繁多、几乎令人眼花缭乱的网络安全风险，范围涵盖从个人信息泄露导致的声誉和财务损失，到自然灾害引起的运营问题。风险管理学科旨在为识别和应对这些风险的过程带来秩序。在本章中，我们将探讨风险管理过程，并讨论一个与网络安全密切相关的风险类别：个人信息的隐私与保护。\n\
  \n### 分析风险\n\n我们生活在一个充满风险的世界中。如果你今天早上离开家开车去办公室，你会遇到大量风险。你可能遭遇车祸、火车延误，或在人行道上被自行车撞击。我们在潜意识里意识到这些风险，但不会因此而瘫痪。相反，我们会采取简单的预防措施，帮助管理那些我们认为最有可能扰乱我们生活的风险。\n\
  \n在`企业风险管理`（`ERM`）计划中，组织采用正式的方法进行风险分析，该方法从识别风险开始，继续确定每种风险的严重程度，然后采取一种或多种`风险管理`策略来应对每种风险。\n\
  \n在我们深入探讨风险评估过程之前，先定义几个在讨论中将用到的重要术语：\n\n*   `威胁` 是指任何可能对我们的信息或信息系统的机密性、完整性和/或可用性产生不利影响的潜在事件。\n\
  *   `漏洞` 是指我们的系统或控制中存在的弱点，可能被威胁利用。\n*   `风险` 发生在漏洞与可能利用该漏洞的威胁的交汇处。没有相应漏洞的威胁不构成风险，没有相应威胁的漏洞也不构成风险。\n\
  \n\n\n\n图 17.1 说明了威胁、漏洞和风险之间的这种关系。\n\n![图 17.1 风险存在于威胁与相应漏洞的交集处。](img/c17f001.png)\n\
  \n**图 17.1** 风险存在于威胁与相应漏洞的交集处。\n\n请考虑前面提到的在去上班途中沿人行道行走的例子。你在没有任何防护的情况下处于人行道上这一事实是一个漏洞。一辆在人行道上飞驰的自行车是一个威胁。这组因素结合的结果是你面临在人行道上被自行车撞击的风险。如果你将车停在大楼下的车库里，从而消除了该漏洞，你就不再面临那种特定威胁的风险。同样，如果城市竖起障碍物阻止自行车进入人行道，你也不再面临风险。\n\
  \n让我们考虑另一个源自网络安全领域的例子。组织会定期进行漏洞扫描，旨在识别其环境中潜在的漏洞。其中一次扫描可能会发现一台服务器向全世界暴露了 TCP 22 端口，允许攻击者进行暴力\
  \ SSH 尝试。暴露 22 端口使其面临暴力攻击的漏洞。拥有暴力扫描工具的攻击者构成了威胁。端口暴露与攻击者存在的结合构成了风险。\n\n在这种情况下，你无法消除攻击者，因此无法真正应对威胁，但你可以控制系统上运行的服务。如果你关闭\
  \ SSH 服务并关闭 22 端口，就能消除漏洞，从而也消除了风险。\n\n当然，我们并不总能完全消除风险，因为关闭服务并不总是可行的。我们可能会决定采取降低风险的行动。稍后在本章讨论风险管理策略时，我们将更多地谈论这些选项。\n\
  \n#### 风险识别\n\n*风险识别过程*要求识别运行环境中存在的威胁和漏洞。这些风险可能来自各种各样的来源，范围从黑客到飓风。在备考 Security+\
  \ 考试时，你应该熟悉考试目标中特别提到的以下风险类别：\n\n*   *外部风险*是指源自组织外部的风险。这是一个极其广泛的风险类别，包括网络安全对手、恶意代码和自然灾害等许多其他类型的风险。\n\
  \n*   *内部风险*是指源自组织内部的风险。它们包括恶意内部人员、授权用户的失误、设备故障和类似风险。\n\n*   *多方风险*是指影响多个组织的风险。例如，一个街区的停电是多方风险，因为它影响该街区的所有建筑。同样，SaaS\
  \ 提供商数据库的泄露也是多方风险，因为它会泄露该 SaaS 提供商许多不同客户的信息。\n\n*   *遗留系统*给组织带来了一种独特类型的风险。这些过时的系统通常不再接收安全更新，网络安全专业人员必须采取非常措施来保护它们免受无法修补的漏洞的侵害。\n\
  \n*   *知识产权 (IP) 盗窃*风险发生在公司拥有商业机密或其他专有信息时，一旦泄露，可能会损害组织的商业优势。\n\n*   *软件合规/许可*风险发生在组织从供应商处获得软件许可，并有意或无意地违反了使用限制，使客户面临财务和法律风险时。\n\
  \n#### 风险计算\n\n并非所有风险都是平等的。回到行人在街上行走的例子，被自行车撞击的风险比被陨石砸中的风险要令人担忧得多。这符合直觉，但让我们探讨一下得出该结论的潜在思维过程。这个过程称为*风险计算*。\n\
  \n当我们评估任何风险时，我们通过使用两个不同的因素来进行：\n\n*   *发生可能性*或概率，即风险发生的可能性。我们可以将其表示为威胁在特定时间段内（例如未来一年内）利用漏洞的百分比几率。\n\
  \n*   如果风险确实发生，其对组织造成的*影响*程度。我们可以将其表示为风险导致的财务成本，尽管还有其他可能的衡量标准。\n\n利用这两个因素，我们可以通过结合概率和影响程度，为每个风险分配一个概念上的分数。这导致许多风险分析师使用以下公式来表示风险的严重性：\n\
  \n*   风险严重性 = 可能性 × 影响\n\n重要的是要指出，这个公式并不总是必须按字面意思解释。虽然在某些风险评估过程中你可能最终会将这些值相乘，但最好从概念上将其理解为结合可能性和影响以确定风险的严重性。\n\
  \n当我们评估在街上被自行车或陨石撞击的风险时，可以使用这些因素来评估风险严重性。被自行车撞击的概率可能很高。那种事故的影响程度可能是中等的，这使我们愿意考虑采取措施降低风险。被陨石撞击显然会造成灾难性的影响程度，但此类事件发生的概率极低，这使我们只需承认该风险并继续前行，而无需改变行为。\n\
  \n某个行业面临的法律法规可能在确定风险影响方面发挥重要作用。例如，受欧盟 GDPR 约束的组织，如果发生影响欧盟居民个人信息的数据泄露，将面临巨额罚款。这些罚款的规模将显著计入隐私泄露风险的影响评估中。因此，组织必须随时了解影响其风险状况的法规。\n\
  \n#### 风险评估\n\n*风险评估*是一种正式的风险优先级排序方法，允许组织以结构化的方式进行审查。风险评估遵循两种不同的分析方法：\n\n*   *定量风险评估*在分析中使用数字数据，产生的评估结果允许非常直接地对风险进行优先级排序。\n\
  \n*   *定性风险评估*用主观判断和类别代替严格的数值分析，允许对难以量化的风险进行评估。\n\n当组织寻求向利益相关者清晰地传达风险因素时，它们通常会结合定量和定性风险评估的要素。让我们回顾一下这两种方法。\n\
  \n##### 定量风险评估\n\n大多数定量风险评估过程遵循类似的方法论，包括以下步骤：\n\n1.  **确定受风险影响资产的资产价值 (AV)。** 此*资产价值\
  \ (AV)*以美元或其他货币表示，可根据组织的偏好，使用资产的获取成本、替换成本或折旧成本来确定。\n\n\n\n\n\n###### 2. 确定风险发生的可能性\n\
  \n风险分析师咨询主题专家，并确定风险在给定年份内发生的可能性。这以风险每年预计发生的次数来表示，并描述为 `annualized rate of occurrence\
  \ (ARO)`（年化发生率）。预计每年发生两次的风险，其 ARO 为 2.0；而预计每一百年发生一次的风险，其 ARO 为 0.01。\n\n###### 3.\
  \ 确定风险实现时资产将遭受的损害程度\n\n这称为 `exposure factor (EF)`（暴露因子），以预期受损资产的百分比表示。会完全摧毁资产的风险，其暴露因子为\
  \ 100%；而会损坏一半资产的风险，其 EF 为 50%。\n\n###### 4. 计算单次损失期望值\n\n`single loss expectancy\
  \ (SLE)`（单次损失期望值）是指风险每次实现时预期造成的经济损失。它通过将 `AV`（资产价值）乘以 `EF`（暴露因子）来计算。\n\n###### 5.\
  \ 计算年化损失期望值\n\n`annualized loss expectancy (ALE)`（年化损失期望值）是指预期每年由某风险造成的损失金额。它通过将\
  \ `SLE`（单次损失期望值）和 `ARO`（年化发生率）相乘来计算。\n\n重要的是要注意，这些步骤评估的是单一风险的定量规模：即一种威胁和一种漏洞的组合。进行定量风险评估的组织会针对每一种威胁/漏洞组合重复此过程。\n\
  \n让我们通过一个定量风险评估的示例进行演练。假设您关注针对您的邮件服务器发起的拒绝服务（`DoS`）攻击所带来的风险。您的组织使用该服务器向客户发送推销产品的电子邮件。服务器每运行一小时可产生\
  \ 1,000 美元的销售额。在查阅威胁情报来源后，您认为 `DoS` 攻击每年可能发生三次，且在您能够控制局面之前将持续三小时。\n\n在这种情况下，资产不是服务器本身，因为服务器不会遭受物理损坏。资产是发送电子邮件的能力，您已经确定其价值为每小时\
  \ 1,000 美元。因此，服务器运行三小时的资产价值为 3,000 美元。\n\n您的威胁情报估计该风险每年将发生三次，使您的 `annualized rate\
  \ of occurrence`（年化发生率）为 3.0。\n\n在咨询邮件团队后，您认为服务器在 `DoS` 攻击期间将以 10% 的容量运行，因为仍有一些合法邮件能够发出。因此，您的\
  \ `exposure factor`（暴露因子）为 90%，因为 90% 的容量将被攻击消耗。\n\n您的 `single loss expectancy`（单次损失期望值）是通过将资产价值（3,000\
  \ 美元）乘以 `exposure factor`（90%）来计算的，以得出每次攻击期间的预期损失。这将得出 2,700 美元的 `SLE`。\n\n您的 `annualized\
  \ loss expectancy`（年化损失期望值）是 `SLE`（2,700 美元）和 `ARO`（3.0）的乘积，即 8,100 美元。\n\n组织可以利用定量风险评估得出的\
  \ `ALEs` 来确定补救活动的优先级，并确定在缓解风险的控制措施上投入的适当水平。例如，通常讲（至少从严格的财务角度来看），每年花费超过 `ALE` 来防范某项风险是不合理的。在前面的示例中，如果一项\
  \ `DoS` 防护服务能够阻止所有这些攻击，那么如果其成本低于每年 8,100 美元，购买它在财务上就是合理的。\n\n##### 定性风险评估\n\n定量技术非常适合评估财务风险和其他可以用数字术语清晰表达的风险。然而，许多风险不容易适用定量分析。例如，您如何用定量术语来描述声誉损害、公共卫生和安全或员工士气？您或许能推断出一些将这些问题与财务数据联系起来的线索，但底线是定量技术根本不适合评估这些风险。\n\
  \n定性风险评估技术旨在通过用主观判断替代目标数据，来克服定量技术的局限性。定性技术仍然使用相同的概率和幅度因子来评估风险的严重性，但使用主观类别来进行。例如，图\
  \ 17.2 展示了一个简单的定性风险评估，它在主观的低/中/高等级上评估几种风险的概率和幅度。风险根据主题专家做出的判断被放置在此图表上。\n\n虽然无法直接计算使用定性技术评估的风险的财务影响，但这种风险评估等级使风险优先级排序成为可能。例如，查看\
  \ 图 17.2 中的风险评估，我们可以确定该组织面临的最大风险是未加密设备被盗和鱼叉式网络钓鱼攻击。这两种风险都具有高概率和高影响幅度。如果我们正考虑投入资金为数据中心增加更好的物理安全，该风险评估告诉我们，将时间和金钱花在移动设备的全盘加密和安全电子邮件网关上可能会更有效。\n\
  \n![图 17.2 定性风险评估使用主观评级标准来评估概率和幅度。](img/c17f002.png)\n\n**图 17.2** 定性风险评估使用主观评级标准来评估概率和幅度。\n\
  \n### 风险管理\n\n手握完整的风险评估，组织便可将注意力转向应对这些风险。`Risk management`（风险管理）是系统性地应对组织面临风险的过程。风险评估在风险管理过程中发挥着两个重要作用：\n\
  \n*   风险评估为风险优先级排序提供指导，以便首先解决概率和幅度最高的风险。\n*   定量风险评估有助于确定风险的潜在影响是否足以证明采用风险管理方法所产生的成本是合理的。\n\
  \n风险管理人员应逐项梳理风险评估，并为评估中包含的每项风险确定适当的管理策略。他们有四种策略可供选择：`risk mitigation`（风险缓解）、`risk\
  \ avoidance`（风险规避）、`risk transference`（风险转移）和 `risk acceptance`（风险接受）。在接下来的几节中，我们将使用两个示例讨论这些策略中的每一种。\n\
  \n首先，我们讨论与员工笔记本电脑被盗相关的财务风险。在本例中，我们假设笔记本电脑不包含任何未加密的敏感信息。我们要管理的风险是丢失实际硬件造成的财务影响。\n\
  \n其次，我们讨论针对组织网站的分布式拒绝服务（`DDoS`）攻击相关的业务风险。\n\n我们使用这两个场景来帮助您了解在选择风险管理策略时可用的不同选项以及选择过程中涉及的权衡。\n\
  \n#### 风险缓解\n\n`Risk mitigation`（风险缓解）是应用安全控制以减少风险概率和/或幅度的过程。`Risk mitigation`（风险缓解）是最常见的风险管理策略，安全专业人员的绝大多数工作都围绕着通过设计、实施和管理安全控制来缓解风险展开。这些控制中的许多都涉及功能性、性能和安全性之间的工程权衡。\n\
  \n\n\n\n\n#### 风险缓解\n\n当你选择缓解风险时，可以应用一种安全控制或一系列安全控制。这些控制中的每一种都应降低风险发生的概率、风险发生后的影响程度，或两者兼降。\n\
  \n在第一个场景中，我们担心组织的笔记本电脑被盗。如果我们想缓解该风险，可以从多种安全控制中进行选择。例如，为笔记本电脑购买线缆锁可能会降低盗窃发生的概率。\n\
  \n![图 17.3 (a) 附着在设备上的 STOP 标签。(b) 试图移除 STOP 标签后设备上残留的痕迹。](img/c17f003.png)\n\n\
  **图 17.3** (a) 附着在设备上的 STOP 标签。(b) 试图移除 STOP 标签后设备上残留的痕迹。\n\n我们也可以选择购买设备注册服务，该服务为设备提供防篡改注册标签，如\
  \ **图 17.3** 所示的 STOP 标签。这些标签附着在设备上时，会向潜在窃贼提供显著警告，如 **图 17.3**(a) 所示。这起到了威慑盗窃的作用，从而降低了笔记本电脑首先被盗的概率。如果窃贼确实偷走了设备并移除了标签，会留下如\
  \ **图 17.3**(b) 所示的永久残留痕迹。任何发现该设备的人都会被指示联系注册供应商以获取指示，如果设备被归还，这将降低盗窃的潜在影响。\n\n在第二个场景中，针对组织网站的\
  \ DDoS 攻击，我们可以在多种缓解控制中进行选择。例如，我们可以简单地购买更多带宽和服务器容量，使我们能够吸收 DDoS 攻击的轰炸，从而降低攻击的影响。我们也可以选择购买第三方\
  \ DDoS 缓解服务，在流量首先到达我们的网络之前将其阻止，从而降低攻击发生的概率。\n\n##### 风险规避\n\n*风险规避* 是一种风险管理策略，我们通过改变业务实践来完全消除风险发生的可能性。风险规避乍看之下似乎是一种非常理想的方法。毕竟，谁不想消除组织面临的风险呢？然而，这有一个主要缺点。风险规避策略通常会对业务产生严重的不利影响。\n\
  \n例如，考虑本章前面讨论的笔记本电脑被盗风险。我们可以采用风险规避策略，通过不允许员工购买或使用笔记本电脑来完全消除该风险。这种方法笨重拙劣，并且由于对员工生产力产生负面影响，很可能会遭到员工和管理者的强烈反对。\n\
  \n同样，我们可以通过直接关闭网站来规避组织网站遭受 DDoS 攻击的风险。如果没有网站可供攻击，就不存在 DDoS 攻击影响网站的风险。但业务领导者极不可能接受关闭网站作为一种可行的方法。事实上，你可能会认为，为了规避\
  \ DDoS 攻击而被迫关闭网站，本身就是*终极*的拒绝服务攻击！\n\n##### 风险转移\n\n*风险转移* 将风险的部分影响从经历风险的组织转移给另一个实体。风险转移最常见的例子是购买涵盖该风险的保险单。购买保险时，客户向保险公司支付保费。作为交换，保险公司同意承担保单中指定风险造成的损失。\n\
  \n在笔记本电脑被盗的例子中，财产保险单可能涵盖该风险。如果员工的笔记本电脑被盗，保险单将提供资金以覆盖被盗设备的价值或更换设备的成本，具体取决于保险类型。\n\
  \n财产保险单不太可能涵盖 DDoS 攻击。事实上，许多普通商业保单排除所有网络安全风险。寻求针对此类攻击的保险覆盖的组织应购买*网络安全保险*，无论是作为单独的保单，还是作为现有商业保险单的附加条款。这种保险将偿还恢复运营成本的部分或全部，并且在攻击期间也可能涵盖收入损失。\n\
  \n##### 风险接受\n\n*风险接受* 是最后一种风险管理策略，归根结底是故意选择不采取其他任何风险管理策略，而是在面对风险时简单地继续正常运营。如果缓解风险的成本大于风险本身的影响，则可能采用风险接受方法。\n\
  \n在我们的笔记本电脑被盗示例中，我们可能会决定其他风险管理策略都不合适。例如，我们可能认为使用线缆锁是不必要的负担，而防盗追踪标签不太可能奏效，这使我们没有可行的风险缓解策略。业务领导者可能要求员工必须配备笔记本电脑设备，从而排除了风险规避。而笔记本电脑保险单的成本可能太高而无法证明其合理性。在这种情况下，我们可能会决定直接接受风险，并在盗窃发生时承担被盗设备的成本。这就是风险接受。\n\
  \n在 DDoS 风险的情况下，我们可能会进行类似的分析，并决定风险缓解和转移策略成本太高。如果我们继续运营该网站，可能会在接受 DDoS 攻击可能导致网站瘫痪这一风险的前提下进行。\n\
  \n### 风险分析\n\n当你致力于管理风险时，将实施旨在缓解这些风险的控制措施。有几个关键术语可用于描述风险的不同状态，在备考 Security+ 考试时你应该了解这些术语：\n\
  \n*   组织面临的*固有风险* 是在实施任何控制之前存在的原始风险水平。固有风险之所以得名，是因为它是组织业务固有的风险水平。\n*   *剩余风险* 是组织实施了旨在缓解、规避和/或转移固有风险的控制措施后仍然存在的风险。\n\
  *   组织的*风险偏好* 是其愿意作为经营成本而接受的风险水平。\n\n这三个概念通过组织管理风险的方式联系在一起。组织从其固有风险开始，然后实施风险管理策略以降低该风险水平。它将继续这样做，直到剩余风险达到或低于组织的风险偏好。\n\
  \n组织只有具备高度的风险意识，才能实施这些概念。它们必须了解面临的风险以及可以实施的管理这些风险的控制措施。它们还必须定期进行风险控制评估和自我评估，以确定这些控制措施是否继续有效运行。\n\
  \n当风险管理人员致力于跟踪和管理风险时，他们必须向其他风险专业人员和业务领导者传达结果。风险登记册是风险管理专业人员用来跟踪组织面临风险的主要工具。**图 17.4**\
  \ 显示了用于跟踪高等教育机构 IT 风险的风险登记册摘录。\n\n![图 17.4 风险登记册摘录 ¶ 来源：EDUCAUSE IT 风险登记册 (`library.educause.edu/resources/2015/10/it-risk-register`)](img/c17f004.png)\n\
  \n**图 17.4** 风险登记册摘录 ¶ 来源：EDUCAUSE IT 风险登记册 (`library.educause.edu/resources/2015/10/it-risk-register`)\n\
  \n\n\n\n\n风险登记册是一份冗长的文档，通常为业务领导者提供了过多的细节。在向高级领导者传达风险管理概念时，风险专业人员通常会使用 `risk matrix`（风险矩阵），或热力图，如\
  \ 图 17.5 所示。这种方法能快速汇总风险，并使高级领导者能够迅速聚焦于组织面临的最重大风险。\n\n![图 17.5 风险矩阵](img/c17f005.png)\n\
  \n**图 17.5** 风险矩阵\n\n### 灾难恢复规划\n\n无论我们实施多少控制措施，现实是灾难有时会袭击我们的组织并造成中断。`灾难恢复规划 (DRP)`\
  \ 是制定计划以在灾难面前尽快恢复运营的学科。灾难恢复规划过程为组织创建一份正式的、广泛的灾难恢复计划，并在需要时为关键业务职能制定具体的职能恢复计划。这些计划的目标是帮助组织在中断发生后尽快恢复正常运营。\n\
  \n#### 灾难类型\n\n任何类型的灾难都可能袭击组织。当我们第一次听到“灾难”一词时，往往会立即联想到飓风、洪水和其他自然环境灾难的图景。然而，灾难可能源于人为因素，并可能来自组织外部的力量，以及内部风险。从灾难恢复规划的角度来看，灾难是指任何有可能中断组织业务的事件。灾难的发生会触发组织灾难恢复计划的激活。\n\
  \n作为 DRP 过程的一部分，组织应对其每个设施进行现场风险评估。这些风险评估应旨在识别并确定灾难对设施构成的风险优先级，包括来自环境灾难和人为灾难的内部和外部风险。\n\
  \n#### 业务影响分析\n\n`业务影响分析 (BIA)` 是一项正式流程，旨在识别组织内的任务关键职能，并促进识别支持这些职能的关键系统。\n\n在 BIA\
  \ 过程中使用了四个关键指标，备考 Security+ 考试时你应该了解这些指标：\n\n*   `平均故障间隔时间 (MTBF)` 是系统可靠性的度量。它是两次系统故障之间预期经过的时间量。例如，如果\
  \ MTBF 为六个月，则平均而言，你可以预期系统每六个月会故障一次。\n\n*   `平均修复时间 (MTTR)` 是故障后将系统恢复到正常运行状态所需的平均时间。\n\
  \n*   `恢复时间目标 (RTO)` 是组织在系统修复前能够容忍系统停机的时间量。当修复时间少于 RTO 时，服务团队即达到了预期目标。\n\n*   `恢复点目标\
  \ (RPO)` 是组织在停机期间能够容忍丢失的数据量。\n\n这些指标中的每一个都允许组织评估不同风险对其运营的影响，以及其灾难恢复控制现状的可接受性。\n\n\
  当组织评估其环境状况时，应特别关注 `单点故障`。这些是指系统、设备或其他组件，一旦发生故障，就会导致中断。例如，如果服务器只有一个电源，该电源的故障会导致服务器宕机，使其成为一个单点故障。为服务器添加冗余电源可解决该单点故障。同样，如果该服务器是提供组织网页的唯一服务器，则该服务器就成为一个单点故障。添加第二台服务器组成集群可解决该单点故障。\n\
  \n### 隐私\n\n网络安全专业人员负责保护其管辖范围内所有信息的机密性、完整性和可用性。这包括个人可识别信息 (PII)，如果不当披露，将危及一个或多个个人的隐私。\n\
  \n当发生隐私泄露时，它们显然会对泄露中信息丢失的个人产生负面影响。这些个人可能会面临身份盗窃和其他个人风险。隐私泄露还会给失去个人信息控制权的企业带来组织层面的后果。这些后果可能包括声誉受损、罚款，以及重要知识产权\
  \ (IP) 的丢失，这些知识产权可能现在落入竞争对手手中。\n\n寻求将其隐私实践成文化的组织可能会采用 `隐私声明` 来概述其隐私承诺。在某些情况下，法律或法规可能要求组织采用隐私声明。此外，组织可能会在其与客户和其他利益相关者的协议条款中包含隐私声明。\n\
  \n#### 敏感信息清单\n\n组织通常处理许多不同类型的敏感和个人信息。管理这些敏感数据的第一步是建立组织维护的数据类型清单，以及存储、处理和传输这些数据的位置。\n\
  \n组织应在其清单中包含以下类型的信息：\n\n*   `个人可识别信息 (PII)` 包括唯一标识特定个人的任何信息，包括客户、员工和第三方。\n\n*  \
  \ `受保护健康信息 (PHI)` 包括医疗服务提供者和其他受《健康保险流通与责任法案》(HIPAA) 约束的组织所维护的医疗记录。\n\n*   `财务信息`\
  \ 包括组织维护的任何个人财务记录。\n\n*   组织维护的 `政府信息` 可能受其他规则约束，包括下一节讨论的数据分类要求。\n\n一旦组织拥有了此敏感信息的清单，就可以开始采取措施，确保其得到适当保护，防止丢失或被盗。\n\
  \n#### 信息分类\n\n`信息分类` 计划根据信息的敏感度以及信息意外披露时对组织的影响，将数据组织到不同类别中。例如，美国政府使用以下四个主要分类类别：\n\
  \n*   `绝密` 信息需要最高程度的保护。绝密信息的未经授权披露合理预期会对国家安全造成异常严重的损害。\n\n*   `机密` 信息需要高度的保护。机密信息的未经授权披露合理预期会对国家安全造成严重损害。\n\
  \n*   `秘密` 信息需要一定程度的保护。秘密信息的未经授权披露合理预期会对国家安全造成可识别的损害。\n\n*   `非密` 信息是指不符合其他类别分类标准的信息。此类别中的信息仍未经授权不得公开发布。\n\
  \n企业通常不对其机密信息级别使用相同的术语。相反，它们可能会使用更友好的术语，例如高度敏感、敏感、内部和公开。\n\n![图 17.6 用于标识美国政府机密信息的封面页](img/c17f006.png)\n\
  \n**图 17.6** 用于标识美国政府机密信息的封面页\n\n\n\n\n##### 数据分类与隐私\n\n数据分类使组织能够明确指定保护不同敏感级别信息所需的安全控制措施。例如，美国政府要求使用颜色鲜艳的封面页，如图\
  \ 17.6 所示，以识别印刷形式的机密信息。\n\n##### 数据角色与职责\n\n我们为保护数据所能做的最重要的事情之一，就是建立清晰的 `data ownership`（数据所有权）政策和程序。采用这种方法，组织会指定特定的高级管理人员作为不同数据类型的数据所有者。例如，人力资源副总裁可能是雇佣和薪资数据的数据所有者，而销售副总裁可能是客户信息的数据所有者。\n\
  \n清晰的数据所有权界线将数据的责任交到最了解关于该数据的决策对业务影响的高管手中。然而，他们并非孤立地做出所有这些决策。数据所有者会将部分职责委派给组织中的其他人，并依赖主题专家（如网络安全分析师和数据保护专家）的建议。\n\
  \n在备考 Security+ 考试时，你应该熟悉其他重要的数据隐私角色：\n\n*   **数据控制者** 是决定处理个人信息的原因并指导处理该数据方法的实体。该术语主要用于欧洲法律，旨在替代“数据所有者”这一术语，以避免产生“收集数据的任何人都拥有该数据的所有权利益”这一推定。\n\
  *   **数据管家** 是执行数据控制者意图并被控制者委派责任的个人。\n*   **数据保管者** 是不具备控制者或管家职责，但负责信息安全保管的个人或团队。例如，数据控制者可能将保护\
  \ PII 的责任委派给信息安全团队。在这种情况下，信息安全团队充当数据保管者。\n*   **数据处理者** 是代表数据控制者处理个人信息的服务提供商。例如，信用卡处理服务可能是零售商的数据处理者。零售商保留数据控制者的责任，但使用该服务作为数据处理者。\n\
  \n##### 信息生命周期\n\n数据保护应贯穿信息生命周期的所有阶段，从数据最初被收集时起，直到最终被处置时止。\n\n在数据生命周期的早期阶段，组织应实践\
  \ `data minimization`（数据最小化），即仅收集满足业务需求所必需的最少量信息。非必要的信息应立即丢弃，或者更好的是，首先就不收集。\n\n\
  只要信息仍在组织的管辖范围内，组织就应实践 `purpose limitation`（目的限制）。这意味着信息应仅用于最初收集时的目的，且该目的已获得数据主体的同意。\n\
  \n在生命周期结束时，组织应实施 `data retention`（数据保留）标准以指导数据生命周期的终结。数据仅应在为实现最初收集目的所必需的时间内保留。生命周期结束时，数据应被安全销毁。\n\
  \n##### 隐私增强技术\n\n如果我们无法从数据集中完全移除数据，通常可以将其转换为一种格式，使原始敏感信息实现匿名化。尽管真正的匿名化可能很难实现，但我们通常可以使用伪匿名化技术，例如去标识化。`de-identification`（去标识化）过程移除了将数据关联回个人的能力，从而降低其敏感性。\n\
  \n去标识化数据的一种替代方案是将其转换为无法检索原始信息的格式。这个过程称为 `data obfuscation`（数据混淆），我们有多种工具可协助实施。\n\
  \n*   **哈希** 使用哈希函数将数据集中的值转换为相应的哈希值。如果我们对数据元素应用强哈希函数，可以用哈希值替换文件中的原值。\n*   **令牌化**\
  \ 使用查找表用唯一标识符替换敏感值。例如，我们可能用一个随机生成的 10 位数字替换广为人知的值（如学生 ID）。然后我们维护一个查找表，以便在需要确定某人身份时将其转换回学生\
  \ ID。当然，如果使用这种方法，必须确保查找表的安全！\n*   **数据掩码** 通过用空白字符替换部分或全部敏感字段，对敏感信息进行部分遮盖。例如，我们可能用\
  \ X 或 * 替除信用卡号后四位以外的所有数字，使卡号不可读。\n\n尽管无法直接从哈希值反推原始值，但这种方法存在一个主要缺陷。如果有人拥有某字段的可能值列表，他们可以发起所谓的\
  \ `rainbow table attack`（彩虹表攻击）。在此攻击中，攻击者计算这些候选值的哈希值，然后检查这些哈希值是否存在于你的数据文件中。\n\n\
  例如，假设我们有一个文件，列出了我校所有挂科学生，但我们对他们的学生 ID 进行了哈希处理。如果攻击者拥有所有学生的名单，他们可以计算所有学生 ID 的哈希值，然后检查哪些哈希值出现在该列表中。因此，哈希应谨慎使用。\n\
  \n##### 隐私与数据泄露通知\n\n在不幸发生数据泄露时，组织应立即启动其网络安全事件响应计划。该事件响应计划的细节在第 14 章“事件响应”中有详细讨论，并应包含关键人员通知程序和严重事件升级程序。\n\
  \n根据国家和地区法律，组织在数据泄露发生后可能还负有发布公开通知和披露的责任。这种责任可能仅限于通知相关个人，在某些情况下，可能要求通知政府监管机构和/或新闻媒体。\n\
  \n在美国，每个州都有数据泄露通知法律，对触发通知的要求各不相同。欧盟的 GDPR 也包含泄露通知要求。美国缺乏要求对所有安全漏洞进行广泛通知的联邦法律，但确实有行业特定的法律和要求，在某些情况下要求进行通知。\n\
  \n总之，泄露通知要求因行业和司法管辖区而异，遭遇泄露的组织可能需要理清许多重叠的要求。因此，遭遇数据泄露的组织应咨询精通此领域的律师。\n\n### 摘要\n\
  \n网络安全工作的核心在于风险管理。在本章中，你学习了网络安全分析师用于识别、评估和管理各类风险的技术。你了解了风险缓解、风险规避、风险转移和风险接受的区别，以及何时适合使用每种策略。你还学习了灾难恢复规划流程如何帮助防止业务中断，以及安全专业人员在保护个人可识别信息隐私方面的作用。\n\
  \n### 考试要点\n\n\n\n\n### 风险识别与评估\n\n风险识别与评估有助于组织确定网络安全工作的优先级。网络安全分析师致力于识别其组织面临的所有风险，然后进行业务影响分析，根据风险发生的概率及其对组织的潜在影响程度来评估潜在风险等级。这项工作使安全专业人员能够对风险进行优先级排序，并向组织内的其他人员传达风险因素。\n\
  \n### 供应商作为外部风险来源\n\n供应商是外部风险的来源。组织应将自身系统评估作为风险评估实践的一部分，但也应进行供应链评估。执行供应商尽职调查可降低供应商处先前未被识别的风险对组织产生负面影响的可能性。硬件来源真实性技术可验证硬件在离开供应商场所后未被篡改。\n\
  \n### 风险管理策略\n\n组织可从多种风险管理策略中进行选择。\n\n- **风险规避** 策略通过改变业务实践来消除风险。\n- **风险缓解** 技术旨在降低风险的概率或影响程度。\n\
  - **风险转移** 方法将部分风险转移给第三方。\n- **风险接受** 承认风险的存在，尽管存在此风险，仍继续正常的业务运营。\n\n### 灾难恢复规划\n\
  \n灾难恢复规划构建弹性。当组织遭遇自然灾害或人为灾害导致正常运营中断时，灾难恢复计划将被激活。灾难恢复计划帮助组织快速恢复其信息和系统，并恢复正常运营。\n\n\
  ### 隐私控制\n\n隐私控制保护个人信息。处理敏感个人信息的组织应制定隐私计划，以保护该信息免遭滥用和未经授权的披露。该计划应涵盖个人可识别信息 (`PII`)、受保护的健康信息\
  \ (`PHI`)、财务信息，以及组织维护的可能影响个人隐私的其他记录。\n\n### 复习题\n\n1.  Jen 发现一台 Windows 服务器缺少补丁，这可能允许攻击者获得系统的远程控制权。在与经理协商后，她应用了该补丁。从风险管理的角度来看，她做了什么？\n\
  \n    1.  消除了威胁\n    2.  降低了威胁\n    3.  消除了漏洞\n    4.  降低了漏洞\n\n2.  你注意到针对组织运行的\
  \ Web 应用程序有大量 SQL 注入攻击，因此你安装了一个 Web 应用程序防火墙，在许多攻击到达服务器之前将其拦截。你如何改变了该风险的严重性？\n\n\
  \    1.  降低了影响程度\n    2.  消除了漏洞\n    3.  降低了概率\n    4.  消除了威胁\n\n3.  **第 3–7 题参考以下场景：**\n\
  \n    Aziz 负责管理一个电子商务网站，该网站每天为其公司产生 100,000 美元的收入。该网站使用的数据库包含公司客户的敏感信息。他预计该数据库一旦泄露，将导致公司面临\
