    # Preface


    Continuous health monitoring of civil structures is an effective approach to assess
    their health and safety. In most applications to structural health monitoring
    (SHM) grounded on contact-based sensors, long-term strategies contain a large
    volume of measured data from relatively dense sensor networks. Under such circumstances,
    the course of dimensionality from big data is one of the major challenges in SHM.
    Thanks to developments of satellite systems and the technology of remote sensing
    via synthetic aperture radar (SAR) images, it has been possible to take advantage
    of its capacities in health monitoring of civil structures via satellite images.
    The great advantage of a SAR-aided SHM method is the possibility of obtaining
    prior information or archived images concerning structures in their undamaged
    states. Furthermore, it is feasible to perform a long-term process using SAR images.
    Accordingly, one should extract displacement data from such images and analyze
    them. However, some issues restrict providing an adequate set of displacement
    points, in which case the SAR-aided SHM is confronted with the challenge of *small
    data*. On the other hand, the other major challenge in most of the long-term SHM
    is related to *environmental and/or operational changes* (EOCs). This issue is
    challenging because such variations can lead to unpredictable changes in civil
    structures similar to damage. Hence, serious false positives and false negatives
    emerge during the long-term monitoring process. This issue will be worse in the
    SAR-aided SHM when a small number of data is present. Because the false positives
    and false negatives are directly associated with economic and human issues, it
    is essential to consider all possible EOCs, visualize their variations in data,
    and remove them from displacement points.


    Therefore, the main objective of this book is to propose **novel hybrid unsupervised
    learning methods** for addressing the aforementioned challenges; that is, long-term
    SHM under small data and EOCs. Due to the importance of these issues, this study
    proposes **seven hybrid methods** under the concepts of artificial intelligence,
    data sampling, and probabilistic and statistical analyses. (1) The first method
    suggests a probabilistic hybrid unsupervised learner based on the ideas of unsupervised
    nearest neighbor searching (NNS) and extreme value theory (EVT) for SHM under
    relatively large data and EOCs. (2) The second technique called HMC-MD relies
    on a data augmentation approach based on Hamiltonian Monte Carlo (HMC)'
  - '[PAGE 6]


    sampling and feature discrimination through the well-known Mahalanobis distance
    (MD) in its squared version. The other methods contain three main parts including:
    (i) augmentation of small displacement data by either HMC sampling or slice sampling
    (SLS), (ii) normalization of augmented data for removing the EOCs, and (iii) detection
    of damage in terms of unsupervised feature discrimination via the MD metric. These
    methods are divided into two groups: (i) those are based on offline learning,
    and (ii) those rely upon online learning frameworks. (3) Third method called HMC-DAE-MD
    adds a data normalization approach to the proposed HMC-MD technique by exploiting
    a deep autoencoder (DAE). In this regard, a simple but effective iterative hyperparameter
    optimization is presented to choose the neuron sizes of the DAE hidden layers
    with an emphasis on mitigating the EOC effects. (4) The fourth method called HMC-UTSL-MD
    suggests an innovative unsupervised teacher-student learning (UTSL) algorithm
    by combining an undercomplete DAE and an overcomplete shallow autoencoder (AE).
    (5) The fifth method called HMC-DTL-MD presents a deep transfer learning (DTL)
    strategy by developing consecutive DAEs. All the mentioned methods rely upon offline
    learning within a fixed training period. (6, 7) In order to perform real-time
    SHM, the sixth and seventh methods, HMC-ODTL-EMD and SLS-ODTL-EMD, utilize the
    HMC and SLS to initially augment small data, subsequently develop an online deep
    transfer learning (ODLT) approach, and finally propose a novelty indicator or
    damage index by computing the Euclidean norm of Mahalanobis distance (EMD) values.
    In total, this book proposes several innovative methods including seven hybrid
    unsupervised learners as well as four hyperparameter optimization algorithms.
    The first two proposed techniques, NNS-EVT and HMC-MD, are validated by simulated
    numerical displacement data from a full-scale bridge known as the I-40 Bridge,
    located in the USA. The remaining techniques are verified by a set of real-world
    long-term displacement data points of the Tadcaster Bridge in the UK obtained
    from a small number of images of TerraSar-X. Results show that the proposed hybrid
    techniques can promisingly tackle the demanding issues in the SAR-aided SHM and
    these are influential tools for real-world problems.


    Milan, Italy

    Alireza Entezami

    Bahareh Behkamal

    Carlo De Michele'
