    ## 第 4 章

    从理论到现实：塔德卡斯特桥的先进结构健康监测方法


    ### 摘要

    结构健康监测（SHM）方法的实验验证是评估此类方法在损伤评估中精度和可靠性的关键过程，尤其是在长期监测方案中。本章通过使用位于英国塔德卡斯特的石砌桥（即塔德卡斯特桥）的一组位移响应，探讨了为应对小数据局限性而开发的拟议无监督学习方法（即
    HMC-DAE-MD、HMC-UTSL-MD、HMC-DTL-MD、HMC-ODTL-EMD 和 SLS-ODTL-EMD）的实际应用。由于该桥曾发生部分坍塌，因此它是验证拟议方法的适当案例研究。本章还说明了数据增广过程如何帮助更好地观察增广位移响应中的
    EOCs。


    ### 关键词

    坍塌前检测 • 石砌桥 • 小数据 • 数据增广 • 机器学习 • 无监督学习


    ### 4.1 塔德卡斯特桥：一座石砌桥


    拟议其他方法的实际应用基于英国塔德卡斯特塔德卡斯特桥宝贵的小位移数据集（Selvakumaran 等人，2018）。出于一些重要原因，我们相信该数据集为验证拟议方法提供了最佳条件。考虑该结构的主要动机是：(i)
    它呈现了真实结构中部分坍塌事件的实际条件，(ii) 样本位移数据来自连续长期监测计划，(iii) 与接触式传感器的安装类似，采用并分布了适当的目标点以提取位移点。


    该结构是一座著名的石砌桥，拥有七个桥墩，建于约1700年（即，根据文献证据，建于1698年至1699年之间）。该桥横跨英国北约克郡塔德卡斯特镇的“惠尔夫河”，连接塔德卡斯特与约克镇。该桥的交通特点是每个方向通行一条机动车道，两侧各设人行走廊。塔德卡斯特桥的主要尺寸包括长度约100米，宽度10米。塔德卡斯特桥的现有结构由不同时期的两座结构连接而成。此情景被考虑用于扩宽老桥。洪水是威胁塔德卡斯特桥安全与完整性的主要事件。


    由于该桥的历史形式以及未安装任何智能监测的 SHM 系统，曾通过潜水员进行目视检查以评估桥墩冲刷并观察河床变动。尽管如此，塔德卡斯特桥在 2015 年 12
    月 29 日因伊娃风暴引发的洪水后遭受了部分坍塌。图 4.1a, b 展示了该桥坍塌区域的实际照片。经过重大重建和加宽后，塔德卡斯特桥于 2017 年 2
    月 3 日重新开放交通。图 4.1c 展示了该桥的加固结构。近期，Selvakumaran 等人（2018）利用遥感技术并考虑少量 SAR 影像对该结构进行了连续长期
    SHM 研究。其研究的主要目标是从这些影像中提取位移样本并直接进行分析。由于结构中部分坍塌的发生通常较为罕见，塔德卡斯特桥是使用先进机器学习方法进一步开展
    SHM 研究的合适案例，这也是本研究所考虑的内容。


    在部分坍塌之前，拍摄了 2014 年 3 月 9 日至 2015 年 11 月 26 日期间的 45 张 TerraSAR-X SAR 影像，以在八个目标区域提取有限数量的位移，用于为期约一年的监测计划。最后一张影像属于
    2015 年 11 月 26 日，大约在部分坍塌前一个月。因此，提取的位移样本和本书中机器学习方法的输出可以显著帮助当局和桥梁所有者避免任何坍塌造成的灾难性和经济损失。通过应用
    SAR 影像，采用了 DInSAR 方法和小基线集（SBAS）技术，在标记为“P1”、“P2”、“P3”、“P4”、“P5”、“P6”、“P7”和“P8”的八个点上提取了
