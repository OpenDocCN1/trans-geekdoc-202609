    labor-intensive, but also illogical. This is because there is no justification
    to impose intentional damages on complex and vital civil structures in order to
    prepare limited and controlled damaged data (e.g., the SHM problems of the Z24
    and S101 Bridges Maeck and De Roeck 2003; Döhler et al. 2014). To cope with this
    limitation, in some case, one can construct the numerical model of the real structure
    and simulate various damage patterns to provide damaged data (Figueiredo et al.
    2019; Torzoni et al. 2022; Daneshvar et al. 2023a; Entezami et al. 2020c). However,
    the major obstacle to perform this approach pertains to the inevitable differences
    between the numerical and real modes due to idealization, simple assumptions,
    wrong modeling, and noisy data. In this case, finite element model updating is
    mandatory (Ereiz et al. 2022; Rezaiee-Pajand et al. 2021, 2020), which may impose
    additional challenges. Therefore, one can realize that unsupervised learning is
    a better solution to SHM of civil structures.


    Sensing technology is a broad field in SHM that contains various kinds of sensors
    and data acquisition systems from contact sensors (e.g., stain gages, accelerometers,
    optical fibers, etc.) (Wang et al. 2014b; a) to non-contact-based sensors (Feng
    and Feng 2018). Although the use of non-contact sensing technology via common
    and accessible devices (e.g., commercial cameras, video devices, smartphones,
    etc.) is prevalent in academic and industrial SHM activities (Sony et al. 2019;
    Dong and Catbas 2021), some limitations do not allow civil engineers and researchers
    to achieve reasonable outcomes. One of them is that this type of sensing technology
    cannot provide a simple routine for monitoring of large-scale structures. On the
    other hand, pre-collapse investigation of some vital structural systems such as
    bridges and dams constructed in large-scale areas may be problematic. This limitation
    become worse in continuous long-term SHM programs. Apart from these limitations,
    the great obstacle to easily apply non-contact sensors for SHM applications is
    the devoid of rich information about initial undamaged states of many constructed
