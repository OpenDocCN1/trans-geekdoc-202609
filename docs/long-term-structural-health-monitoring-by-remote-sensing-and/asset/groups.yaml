    major factors for their undesirable separability. On the other hand, in reality,
    any civil structure may encounter unpredictable excitation sources such as earthquake,
    strong wind, hurricane, typhoon, flood, etc. with different magnitudes, or a sequence/combination
    of these sources. Under such circumstances, structural damage can emerge leading
    to adverse changes in the structural performance and serviceability, and dramatically
    partial and global collapses (Li et al. 2016; Mesquita et al. 2016; Webb et al.
    2015; Modares and Waksmanski 2013; Deng et al. 2016; Chen 2017; Sassu et al. 2017;
    Alencar et al. 2019).


    In civil engineering, the practical process of evaluation of integrity and safety
    of civil structures is called structural health monitoring (SHM). This methodology
    is often based on equipping civil structures with various sensors, measuring useful
    data (i.e., vibration responses such as acceleration time histories or new responses
    such as images and videos), analyzing measured data, and implementing an SHM method
    (Gharehbaghi et al. 2022; Rizzo and Enshaeian 2021; Sun et al. 2020). The main
    tasks of this methodology include but are not limited to early alarming of damage
    occurrence or declaring a safe condition, localization of damaged areas after
    ensuring the occurrence of damage, recognition of damage type, and estimation
    of damage severity (Heravi et al. 2022; Esfehani et al. 2023; Entezami et al.
    2023b; Sarmadi et al. 2023c). After these tasks, the damaged areas should be repaired
    or replaced to enhance the structural performance and serviceability.


    A damaged structure can experience different damage patterns with various severity
    levels. Generally, these levels are classified as minor, moderate, and major cases.
    Regardless of minor damage, a damaged structure may sustain partial or global
    collapses under moderate and major damage patterns (Deng et al. 2016; Chen 2017;
    Abdelwahed 2019). Collapse in a civil structure is a phenomenon that all or parts
    of the structure may be destroyed by serious damages caused by natural hazards
    or fatigue loads so that the structure no longer operates and services normally.
    Human deaths and injuries as well as huge economic losses are two catastrophic
    consequences of the collapse phenomenon. Some tragedies caused by collapses occurred
    in Minnesota I-35W Bridge (Minneapolis, Minnesota, USA) with 13 deaths in 2007
    (Astaneh-Asl 2008), Morandi Bridge (Genova, Italy) with 43 deaths in 2018 (Rania
    et al. 2019), Champlain Towers South Condominium (Miami, USA) with 98 deaths in
    2021 (Kong and Smyl 2022), and Abadan Metropol Building (Abadan, Iran) with 31
    deaths in 2022.


