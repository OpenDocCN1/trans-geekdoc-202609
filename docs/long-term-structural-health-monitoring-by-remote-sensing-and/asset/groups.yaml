    +   * Applying interferometric methods such as InSAR, DInSAR, SqueeSAR, etc. to
    extracting displacement data points

    +   * Analyzing displacement data for SHM.¹


    # 1.2 Literature Review: Existing Knowledge and Existing Gaps


    In relation to the SAR-aided SHM applications, one can refer to the research conducted
    by Selvakumaran et al. (2018) who assessed the partial collapse in a masonry bridge
    caused by the scour of one of the bridge piers by utilizing 45 SAR images acquired
    from TerraSar-X. They directly analyzed the displacements from these images and
    predicted the occurrence of the partial collapse by finding anomalies in the displacement
    distribution. Milillo et al. (2019) carried out a research on evaluating the structural
    conditions of the Morandi Bridge before its partial collapse by applying relatively
    several SAR images from various satellites. They only observed displacements in
    the proximity of the damaged region and investigated the feasibility of alarming
    the partial collapse. Giordano et al. (2022) performed a long-term damage assessment
    strategy for evaluating possible damage in a historic iron bridge by using SAR
    images acquired by COSMO-SkyMed between 2011 and 2019. They emphasized the serious
    influences of the EOCs on displacement data of civil structures gained by SAR
    images. For this issue, the classical PCA method was applied to remove possible
    EOCs in the measured displacement data points and the control charts were considered
    for anomaly detection. They finally concluded that the removal of the EOCs from
    displacement data enabled them to detect the settlement of the bridge piers up
    to 2 mm. Biondi et al. (2020) proposed a vibration-based early damage warning
    method in terms of modal analysis by using SAR images without displacement sample
    extraction. In particular, they examined the possibility of their methodology
    on the Morandi Bridge. Farneti et al. (2022) conducted a long-term monitoring
    process on the Albiano-Magra Bridge in Italy, which was globally collapsed on
    April 2020, between 2015 and 2020 using a relatively large set of SAR images from
    COSMO-SkyMed. For this issue, they extracted two-dimensional displacement samples
    obtained from 121 SAR images in the ascending orbit from January 2013 to April
    2020 and 64 SAR images in the descending orbit between March 2015 to March 2020.
    Their major engineering goal was to quantify uncertainties in the two-dimensional
    displacement measurements gained by the InSAR techniques.


    ¹ In most cases, the research activities have focused on direct analyses of the
    displacements extracted from SAR images.'
