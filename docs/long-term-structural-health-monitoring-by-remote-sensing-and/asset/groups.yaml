    # 1.1 Introduction


    +   (1) Inappropriate design and construction;

    +   (2) Natural hazards such as earthquake, wind, flood, etc.;

    +   (3) Aging, material deterioration, erosion, fatigue, etc.;

    +   (4) Neglecting automated and continuous SHM;

    +   (5) Neglecting detecting and identifying minor or moderate damage patterns;

    +   (6) Inability of classical visual inspections to effectively monitor civil
    structures;

    +   (7) Less attention to automated monitoring schemes by new sensing technologies
    based on non-contact based sensors via optical cameras or satellites.


    On the other hand, the major reasons for a global collapse can be summarized as:


    +   (1) Extremely strong natural disasters such as earthquake, typhoon, flood,
    etc.;

    +   (2) Extraordinary loads applied to the civil structure;

    +   (3) Aging, material deterioration, erosion, fatigue, failure, etc.;

    +   (4) Neglecting automated and continues SHM.


    To avoid such catastrophic events, SHM provides a practical and effective technology
    to protect civil structures against any type of damage and collapse by taking
    advantages from advanced data-based techniques under the concepts of artificial
    intelligence and machine learning. In general, a data-based SHM strategy is decomposed
    into some preliminary steps including: (i) sensing and data acquisition systems,
    (ii) data transformation and storage, and (iii) initial data analysis. Subsequently,
    it is necessary to apply feature extraction tools for extracting damage-sensitive
    features (i.e., those are only dependent on the structural properties and damage
    information and not variability sources, noises, and outliers) and develop advanced
    computational/statistical models in the view of the concept of machine learning
    for decision-making or feature discrimination. This step sets out to firstly determine
    novelty indices or damage indicators of the training and test data points and
    subsequently differentiate the obtained indications of the damaged condition from
    the undamaged one through an alarming threshold.


    In general, a data-based SHM method is implemented in the training/baseline and
    monitoring/inspection phases (Ente zami et al. 2020d; Ente zami et al. 2021).
    The main objective is to learn an automated computational model via training data
    in the first phase and then assess the current structural condition in the second
    phase via test data and the learned model. According to the concept of machine
    learning, these steps can be carried out by supervised learning and unsupervised
    learning techniques. In the context of SHM, supervised learning refers to the
    technique that requires fully labeled data from both the normal/undamaged and
    damaged conditions. In other words, one needs to prepare damage-sensitive features
    of both conditions in order to learn a classifier (i.e., the computational model
    in supervised learning) for classifying new features (test samples) and predicting
    their labels. On the contrary, unsupervised learning depends only on the features
    of the normal conditions; hence, one attempts to evaluate the status of the current
    state of the structure using new features (test data) by a novelty (anomaly) detector
    (i.e., the computational model in unsupervised learning). An important note is
    that the preparation of fully labeled data in the problem of health monitoring
    of civil structures is not only difficult, time-consuming, and'
