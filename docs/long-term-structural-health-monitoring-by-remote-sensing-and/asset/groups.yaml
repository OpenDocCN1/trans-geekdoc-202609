    Regarding the other types of civil structures, Zhu et al. (2018) explored slow
    ground surface movements regarding building-type structures by extracting and
    interpreting information from InSAR images. In their research, the authors intended
    to directly analyze the persistent scatterer deformations in an effort to find
    anomalies for detecting potential instability risks affecting buildings and infrastructures.
    Macchiarulo et al. (2021) and Giardina et al. (2019) performed damage assessment
    analyses for identifying early signs of tunnelling-induced damage to adjacent
    buildings with different structures, foundations, and position relative to the
    tunnels by using SAR images from COSMO-SkyMed between 2011 and 2015. They extracted
    the vertical displacement/deformation samples from multi-temporal InSAR techniques
    and analyzed them in order to detect the settlement-type damage patterns. Cigna
    et al. (2014) exploited the InSAR methodology based on persistent scatterer interferometry
    (PSI) and the technology of remote sensing via SAR images of COSMO-SkyMed for
    deformation monitoring of historical buildings in the Historic Centre of Rome,
    Italy. Di Carlo et al. (2021) merged multi-temporal DInSAR products and historical
    survey data for health monitoring of building structures in Italy by applying
    SAR images of COSMO-SkyMed between 2011 and 2019. In their work, the authors aimed
    to follow three main tasks including: (i) the displacement extraction from SAR
    images collected over the city of Rome during 2011–2019, (ii) accurate three-dimensional
    geometrical modeling of the external volume of the buildings under monitoring
    and consistent positioning of the identified and investigated persistent scatterers,
    and (iii) analysis and interpretation of the displacement samples of some buildings
    for possible damage detection. They demonstrated that the analysis of displacements
    and mean deformation velocity values enables them to identify possible critical
    conditions for buildings to be monitored.


    In relation to dam structures, Bayık et al. (2021) conducted long-term SAR-aided
    SHM on the Atatürk Dam in Turkey by using different images from ERS, ENVISAT,
    and Sentinel-1. In their long-term monitoring study, the authors utilized 24 and
    33 images of ERS and ENVISAT in the descending orbit between 1992–1999 and 2003–2010,
    114 and 111 SAR images in both ascending and descending orbits between 2016–2019.
    As Sentinel-1 could provide images in both orbits, the main objective of their
    research was to estimate the surface displacements of the dam in the vertical
    and east–west directions by utilizing both line-of-sight displacements. Moreover,
    they studied the relationship between the measured displacements and water levels.
    As their results indicated, there was not considerable relation between these
    parameters and most of the variations in displacements occurred at the dam crest.
    Mura et al. (2018) exploited the remote sensing technology and DInSAR techniques
    for risk assessment and vulnerability analysis of some tailings dams in Brazil
    after a catastrophic collapse in a tailings dam in the vicinity of mining structures
    on November 2015 causing spilling around 32.6 million cubic meters of mining waste.
    In their research, the authors merged small baseline subset (SBAS) and persistent
    scatterer interferometry (PSI) to detect linear and nonlinear ground displacements
    in these structures. For this procedure, they used 48 SAR images from TerraSAR-X
    between 11 November 2015 to 15 May 2017. Miliello et al. (2016) carried out continuous
    long-term monitoring on a dam (i.e., the Pertusillo Dam in Italy) by 198 SAR images
