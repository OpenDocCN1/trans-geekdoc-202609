    ## 关于作者


    **阿利雷扎·恩特扎米教授**自2022年11月起一直是意大利米兰理工大学土木与环境工程系（DICA）的助理教授。他目前的职责还包括共同监督一个由欧洲空间局（ESA）资助的研究项目，该项目采用数据挖掘和机器学习技术，利用地球观测来监测大型基础设施的结构完整性。


    在以教职成员身份加入DICA系之前，他是ESA选拔的博士后研究员，自2021年5月起在米兰理工大学DICA系工作。2020年4月，他获得米兰理工大学结构、抗震和岩土工程博士学位，获*优异*学位。此外，他还拥有马什哈德费尔多西大学土木工程—结构方向博士学位，获Summa
    *最高优异*学位。2014年9月，他获得同一学科的理学硕士学位，来自马什哈德费尔多西大学，获*最高优异*学位。


    他在争取大量研究资金以及促进学术界与工业界合作方面有着卓越的历史记录。值得一提的是，他曾获欧洲空间局（ESA）颁发的三年制博士后奖学金。他还因一项关于结构健康监测问题的结构智能便携设备发明，在国际发明家协会支持的IWIS展览会上获得了两枚奖章。此外，欧盟委员会（EC）“地平线欧洲”计划已支持他的研究，该研究由NGI
    Enrichers和欧洲研究促进署（APRE）选中，以实施其获批的研究提案。


