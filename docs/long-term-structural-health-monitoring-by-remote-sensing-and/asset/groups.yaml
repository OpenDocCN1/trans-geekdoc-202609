    ### 类别II


    毫无疑问，可以宣布所提混合学习方法的重大创新与各种新颖的数据归一化算法相关。数据归一化的核心基于深层和浅层自编码器（AE），尤其是去噪自编码器（DAE）。作为第一项创新，名为HMC-MD的所提混合学习技术是通过添加具有三个隐藏层的欠完备DAE用于数据归一化而开发的。该过程的关键新颖之处在于提出一种超参数优化方法，以寻找欠完备DAE三个隐藏层的最优神经元数量，重点在于减轻EOC的负面影响。尽管交叉验证等不同的超参数优化算法可适用，但本书建议基于工程理由的一种新算法；即，移除或减轻EOC的影响。在此基础，该算法获得的超参数使欠完备DAE能够专门解决与EOC相关的挑战。专注于这一挑战，本书提出了基于教师-学生学习概念的另一种数据归一化方法。尽管这一概念广为人知，但我们开发了两种新的人工神经网络（ANN），以无监督学习方式创建教师和学生模型。第二种数据归一化方法的关键创新部分在于提出具有七个隐藏层的欠完备DAE作为教师模型和过完备浅层AE作为学生模型。换句话说，所提数据归一化方法创建了一种新颖的混合ANN策略。该方法的另一项创新是提出一种新的超参数优化方法，用于选择DAE七个隐藏层和浅层AE编码层的神经元数量。接下来，通过借鉴迁移学习的思想（Yang
