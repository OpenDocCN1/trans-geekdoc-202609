    # 2.2.1 Extreme Value Theory and Its Applications


    In statistics, the EVT offers a well-known and useful probabilistic technique
    for studying on unusual (rare) events and samples rather than usual ones. In other
    words, this technique intends to analyze and model extreme data samples in terms
    of maximum and minimum samples and rare events (Coles et al. 2001; Kotz and Nadarajah
    2000; Castillo 1988). In contrast to the central limit theory (CLT), which concentrates
    on the mean of randomly sampling data or the center of probability distributions,
    the fundamental principle of the EVT lies in the extreme samples and the tails
    of probability distributions. This makes sense that the most relevant statistics
    for modeling the right and left tails of a probability distribution include the
    maximum and minimum samples. The great advantage of the EVT is to only focus on
    a few assumptions about the distribution of data rather than the modeling of the
    whole data distribution.


    To model the extreme values, there are generally two techniques of block maxima
    (BM) under Fisher-Tippet theorem and peak-over-threshold (POT) under Balkema-de
    Haan-Pickands theorem (Résillat et al. 2018; Sarmadi and Yuen 2022; Sarmadi et
    al. 2023a). The first technique is based on dividing randomly sampling data into
    some blocks (segments) and choose the maximum or minimum sample of each block
    as the extreme value (Sarmadi and Yuen 2022; Sarmadi and Karamodin 2020). The
    second technique sets a threshold for selecting extreme (only maximum) samples
    (Sarmadi et al. 2023a, 2022). On this basis, the maximum data points over the
    threshold of interest are chosen as the main extreme values for the extreme value
    modeling. Given n random samples X1, ..., Xn, Fig. 2.1 illustrates the graphical
    representations of the BM and POT techniques, where the BM divides the sampling
    data into b blocks and the POT sets a threshold for the extreme sample selection.
    This means that both techniques require hyperparameters (i.e., the number of block
    b and the threshold level) that should be determined properly. Once the extreme
    values have been selected, one should consider an EVT distribution for modeling.
    Different applications of the extreme value theory to SHM estimation can be found
    in (Sarmadi and Yuen 2022; Sarmadi et al. 2023a) for anomaly detection and (Sarmadi
    and Karamodin 2020; Sarmadi et al. 2022; Sarmadi and Yuen 2021; Daneshvar and
    Sarmadi 2022; Entezami and Shariatmadar 2018) for threshold estimation.


    Because this research intends to take advantage of the EVT for feature discrimination,
    the term “extreme” refers to the maximum value. This is due to the fact that the
    occurrence of any abnormal change in a civil structure (damage) increases the
    deviation of an anomaly detector. In the context of SHM, the process of anomaly
    detection is based on finding maximum novelty indices. Hence, all extreme value
    models are based on the maximum values. Given the independent random data points
    (or variables) X1, ..., Xn, a general extreme value distribution sets out to model
    the statistical behavior of the maximum data in the following form:


    ```

    $$M_n = \max(X_1, ..., X_n)$$

    ```'
