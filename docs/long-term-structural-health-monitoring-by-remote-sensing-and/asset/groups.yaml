    systems, those are expensive and critical. This means that any erroneous decision
    on SHM by directly analyzing measured data may cause irreparable events such as
    human deaths and injuries and economic losses. Therefore, the direct application
    of small data is not a reliable and robust technique for SHM of prominent civil
    structures, especially in long-term monitoring.


    Apart from this limitation, most of the unsupervised learning methods are susceptible
    to erroneous results due to severe variability in data and damage-sensitive features
    regardless of the type of sensing and features. In reality, ambient and environmental
    changes are inevitable in every civil structure built in outdoor environments.
    Daily and seasonal temperature fluctuations, wind speed and direction changes,
    humidity and moisture variations, and excitation amplitude alternations are prevalent
    environmental variability conditions. Moreover, operational variations in outdoor
    and indoor environments significantly affect civil structures. Dead and live load
    alterations, excessive loading, sudden accidents and collisions, explosions, human
    and vehicle traffic are some common operational variability conditions (Farrar
    and Worden 2013: Chapter 12; Wang et al. 2022). Even though the EOCs are not adverse
    phenomena like structural damage, those can alter the mass, stiffness, and damping
    properties of a structural system, as well as its materials, geometry, connectivity,
    and responses.

