    ## 2.4 实时结构健康监测的前沿：拟议的在线混合学习方法


    先前提出的所有方法都基于充足训练样本的考虑。在 SAR 辅助结构健康监测问题中，由于可以在一定时间间隔内访问土木结构的先验信息（图像），先前提出的技术的学习过程是合理且可靠的。从机器学习的角度看，这种结构健康监测称为离线学习。应澄清，这种方法也适用于其他类型的结构健康监测方法。


    本节旨在提出一种基于在线学习理念的实时结构健康监测新方法。在机器学习中，在线学习旨在通过新数据更新机器或计算模型。在此基础上，感兴趣的机器或模型可以基于先前信息进行开发，在这种情况下，在线学习通过接收新训练数据来改进它。在某些情况下，在线学习策略被视为机器的初始步骤。对于结构健康监测应用，如果新信息属于未损伤结构状态，则应继续在线学习过程；否则，应停止该进程，并以最后更新的模型为基础进行进一步调查。在这方面，任何新信息都被视为测试数据。


    本节尝试提出两种混合方式的在线学习方法。在其他工作中，这些方法（即 HMC-ODTL-EMD 和 SLS-ODTL-EMD）包含数据增强、在线数据归一化和特征判别三个部分。拟议混合方法的第一步涉及数据增强。因此，HMC
    和 SLS 技术都用于增强小位移数据。因此，这些方法与其他拟议技术的主要区别在于通过 ODTL 算法进行在线数据归一化过程以及通过 EMD 进行特征判别。


    ### 2.4.1 在线深度迁移学习范式


    DAE 在 DTL 框架中的主要先决条件之一是使用充足（增强）的数据。换句话说，它基于离线学习策略。本节提出并讨论了基于在线学习理念的增强版 DTL。拟议的
    ODTL 算法由两个阶段组成。第一阶段是一个在线学习算法，直到停止条件终止该算法。相应地，该阶段声明学习过程中使用的新数据不属于未损伤结构状态，可能与损伤状态相关。换句话说，该算法报警异常变化的发生。因此，第二阶段开始调用第一阶段最后训练的
    DAE。为简单起见，拟议的 ODTL 算法的流程图如图 2.12 所示。


    ![](img/3d323f4db48c9242205a3db747902f6d_76_0.png)


    图 2.12 拟议 ODTL 方法的流程图


    更具体地说，拟议的 ODTL 方法首先应用第一幅图像的增强位移样本的第一个数据集。主要目标是训练具有三个连续隐藏层的 DAE 并获得最终残差矩阵。这一步类似于原始
    DTL 算法。因为第一步中只有一组增强数据点，它们既用作训练数据也用作验证数据。使用基于 MD 的新奇性检测器，计算这些数据集的距离值。自然地，两组数据提供相同的距离值。随后，训练集的
    MD 量用于估计阈值，该阈值被设为停止条件的度量。这里，阈值通过在 5% 显著性水平下使用训练点损伤指标的标准置信区间获得。相应地，计算验证数据中的误正率。请注意，第一阶段接收到的任何新数据都应被视为验证数据。确实，人们假设增强的验证数据（新信息）来自结构的健康状态。因此，它们的新奇性指标应低于阈值。


    如果误正率为零或可忽略，或其率小于预定义值（\(\beta\)），这意味着验证集与健康状态相关。在这种情况下，应将此类数据添加到先前的训练数据中，以更新先前的
    DAE。相反，如果误正率显著或其率大于 \(\beta\)，则在线学习过程终止，新数据应转移到下一阶段以用作测试数据。在这种情况下，此类数据包含结构的损伤信息。为简单起见，ODTL
    算法的过程可总结为：


    - (1) 如果误正率小于 \(\beta\)，这意味着关于验证数据和结构健康状态的前提是正确的。因此，应继续在线学习（ODTL 的第一阶段）。此外，计算验证数据的
    MD 值的欧几里得范数，以便在每个在线步骤中为实时结构健康监测获得一个结果（参见第 2.4.2 节）。


    - (2) 如果误正率大于 \(\beta\)，这意味着关于验证数据和结构健康状态的前提是不正确的。相应地，需要停止在线学习并开始 ODTL 的第二阶段，即在线损伤检测。在这方面，增强的验证数据被视为测试数据。相应地，调用第一阶段最后更新的
    DAE 以提取新的残差矩阵，并通过 EMD 计算新的新奇性指标。此过程对任何新数据继续进行。


    ### 2.4.2 实时结构健康监测的特征判别


    实时结构健康监测的最后一步是通过与先前拟议技术不同的新奇性检测器进行特征判别。除此问题外，另一个区别在于如何执行特征判别过程。在先前拟议的技术中，需要通过基于
    MD 的新奇性检测器计算所有训练点和测试点的新奇性指标，并将其与阈值进行比较。以不同的方式，拟议的在线混合学习方法在其算法中利用阈值；即在线学习和在线损伤检测。此外，从第一阶段转向第二阶段推断结构中存在异常变化。最终，两个阶段都通过在线方式计算残差数据点的
    MD 量的欧几里得范数，给出标量新奇性指标。


    设 \(\mathbf{E} = [\mathbf{e}_1, \dots, \mathbf{e}_n] \in \mathbb{R}^{p \times
    n}\) 表示由 ODTL 算法从一种结构状态（即一张卫星图像）获得的 \(n\) 个残差数据点的矩阵。要确定标量新奇性指标，只需估计 \(\mathbf{E}\)
    的均值向量和协方差矩阵，这里分别定义为 \(\mathbf{b_e} \in \mathbb{R}^p\) 和 \(\mathbf{C_e} \in \mathbb{R}^{p
    \times p}\)。\(\mathbf{E}\) 的每个列向量的 MD 量计算如下：


    \(d_{MD}(\mathbf{e}_i) = (\mathbf{e}_i - \mathbf{b_e})^T \mathbf{C_e}^{-1} (\mathbf{e}_i
    - \mathbf{b_e}), \quad \forall i = 1, \dots, n \quad (2.42)\)


    相应地，可以得到 \(n\) 个 MD 值 \(\{d_{MD}(\mathbf{e}_1), \dots d_{MD}(\mathbf{e}_n)\}\)。应用欧几里得范数，可以写成：


    \( d_E = \sqrt{(d_{MD}(\mathbf{e}_1))^2 + \dots + (d_{MD}(\mathbf{e}_n))^2} \quad
    (2.43) \)


    因此，\( d_E \) 是表示在线学习和在线损伤检测两个阶段中结构状态的唯一标量新奇性指标。这意味着第一阶段中的任何 \( d_E \) 值都声明结构处于未损伤状态，而第二阶段中的任何
    \( d_E \) 值都触发结构已损伤。这种在拟议在线混合技术中的特征判别是相对于先前拟议技术的主要改进。


    ## 2.5 本章总结


    本节充分讨论了本书中用于增强 SAR 辅助结构健康监测的主要拟议方法。这些方法包括两类数据：相对较大位移数据和小位移数据。对于第一类，这项工作基于 NNS
    和 EVT 的概念提出了一种新的概率机器学习方法。首先，详细描述了 EVT 的基本原理和理论基础以及所有可能的极值分布模型。随后，基于半参数分位数建模开发了一种
    NNS-EVT 方法的新算法，以建立用于结构健康监测的概率新奇性检测器。对于第二类，详细讨论了离线和在线方式的拟议混合学习方法。


    在本章中，可以推断出拟议的 NNS-EVT 方法具有良好的多样性，可用于开发许多用于结构健康监测的新奇性检测器。虽然本书考虑了一种基于半参数极值分布模型及其分位数函数的新奇性检测器来定义新奇性指标，但也可以利用其他（参数）极值分布，例如基于
    BM 技术的 GEVD 和基于 POT 技术的 GPD，来设计新的新奇性检测器。这意味着拟议的 NNS-EVT 方法通过与其他模型（即 GEVD 和 GPD）及技术（即
    BM 和 POT）的高适用性多样性，发展出一种通用方法。


    关于混合学习方法，可以得出结论：无监督 DAE 是设计各种数据归一化方法的一种强大而有效的方法。借助教师-学生学习、迁移学习、在线学习等先进机器学习算法，可以设计不同配置的
    DAE 用于数据归一化。此外，基于马尔可夫链蒙特卡罗算法的随机数据生成可为数据增强提供非参数策略。最后，当 EOCs 的挑战可解决时，基于统计距离度量（尤其是马氏距离）的非参数新奇性检测器可以是首选。


