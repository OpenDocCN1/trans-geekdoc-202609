    ## 2.3.2 基于深度自编码器的数据归一化


    在所提出的 HMC-DAE-MD 方法中，将基于 DAE 的数据归一化策略添加到先前提出的 HMC-MD 方法中，以增强其在减少 EOC 效应方面的性能。SHM
    中的数据归一化是一种消除由任何非损伤条件（即环境和操作条件，有时还有噪声条件）引起的数据变化水平的技术。在大多数情况下，人们试图使用训练数据构建计算/统计模型，该训练数据作为输入应用于该模型，然后将其作为模型输出进行预测。在此基础上，数据归一化旨在通过计算输入和输出之间的直接差异来执行残差提取过程。为了更好地说明
    HMC-MD 和 HMC-DAE-MD 之间的差异，图 2.4 描绘了这些方法的 SHM 一般流程图。应澄清的是，选择每种方法的主要依据取决于增广数据中变异条件的程度。在特征鉴别步骤中，MD
    度量在数据归一化后，要么采用真实的增广数据点，要么采用它们的残差样本（即归一化数据点）。从图 2.4 可以看出，该过程首先使用少量图像中的有限位移样本。在下一步，使用
    HMC 算法扩展这些样本，并生成一个更大的位移数据集。由于 EOC 强烈依赖于在 HMC-MD 和 HMC-DAE-MD 之间进行选择，因此实施了一项调查，以通过图形（例如，箱线图）或数值分析来识别增广数据中
    EOC 的水平。在 EOC 较低的情况下，可以忽略数据归一化。在这种情况下，扩展的数据被分解为训练集、验证集和测试集子集。


    使用增广训练数据点，估计其均值向量和协方差矩阵，并将其视为基于 MD 的新奇性检测器的主要元素。在这方面，将所有增广位移数据点应用于此检测器，以计算其距离量值（即新奇性指标），并在特征鉴别步骤中做出决策。在
    EOC 较高的情况下，需要使用由 DAE 开发并使用扩展训练集的数据归一化。因此，主要目标是通过计算 DAE 输入和输出（预测）之间的直接差异来执行残差提取。然后，训练好的
    DAE 被用于提取增广验证集和测试集的残差。相应地，可以得到新的训练集、验证集和测试数据集，这些数据集对 EOC 不敏感。最后，这些数据集被应用于基于 MD
    的新奇性检测器，以计算其距离量值。


    在考虑了增广训练集的新奇性指标或距离量值后，估计一个阈值，以对未知测试数据点做出最终决策。应当提到的是，由于训练集和验证集属于结构的未损伤状态，因此它们的标签是已知的。在这方面，主要尝试是根据结构的未知或当前状态对测试数据点进行分类。一旦阈值确定，训练集和验证集的新奇性指标应低于阈值，如图
    2.4 所示。另一方面，如果测试样本的任何新奇性指标超过阈值，HMC-MD 或 HMC-DAE-MD 将报警发生损伤；否则，结构仍然未损伤。


    ### 2.3.2.1 自编码器


    自编码器（AE）是非线性的无监督人工神经网络类别，主要旨在学习生成模型，以再生或重建无标签数据点（Charte et al. 2018; Liu et al.
    2017; Karhunen et al. 2015; Larochelle et al. 2009）。更具体地说，AE 通常被训练为将输入编码为某些表示，以便重建它们。在这方面，AE
    由编码器、编码层和解码器组成（Charte et al. 2018）。编码器和解码器是 AE 的两个关键部分。编码器旨在编码输入并将它们映射到新的特征空间。解码器使用编码数据重建输入。AE
    的巨大优势包括在传播过程中持续提取有用特征，并特别过滤掉无用特征（Liu et al. 2017）。然而，AE 的主要优点是过滤掉噪声数据或带有异常值的采样数据（Kramer
    1992）。出于这个原因，这种类型的人工神经网络是数据归一化的合适选择（Pathirage et al. 2018; Entezami et al. 2020）。


    ![](img/3d323f4db48c9242205a3db747902f6d_59_0.png)


    图 2.4 提出的混合无监督学习方法的流程图


    AE 的基本结构基于前馈神经网络。该结构可以设计为浅层或深层配置。浅层 AE 由输入层、编码层和输出层三层组成。由于使用了一个隐藏层，它是 AE 模型的最简单形式。在大多数情况下，更倾向于利用多个隐藏层来建模
    DAE。另一方面，浅层和深层 AE 都可以建模为欠完备和过完备配置。更准确地说，如果 AE 的隐藏层在神经元数量上小于输入层和输出层，则该策略形成欠完备网络。相反，如果隐藏层大于输入层和输出层，则
    AE 为过完备（Charte et al. 2018）。为简单起见，图 2.5 展示了 AE 的不同形式。图 2.5a,b 显示了在欠完备和过完备配置中具有一个隐藏层（即编码层）的浅层
    AE。相比之下，这些配置的 DAE 在图 2.5c,d 中呈现，两者都有 (2L + 1) 个隐藏层，包括 L 个映射层、一个编码层和 L 个反向映射层。


    最著名的 DAE 之一由三个隐藏层组成：映射层、编码层和反向映射层，如图 2.6 所示。在某些文献中，这种类型的 DAE 被称为自联结神经网络（Charte
    et al. 2018; Larochelle et al. 2009）。一旦选择了最佳的 AE 配置，就有必要优化或选择隐藏层的神经元大小，然后训练 AE。对于第二项任务，需要使用无标签训练数据点（即结构未损伤状态的增广位移样本），并将其应用于所选
    AE 的输入层。位于任何隐藏层中的神经元接收来自前一层的多个输入。该神经元计算这些输入的加权和，并最终利用一种称为激活函数的特定操作来生成或预测输出。线性、二进制、整流线性单元（ReLU）、逻辑、双曲正切（Tanh）和指数线性单元（SELU）是学习
    AE 时常用的激活函数。其中，基于逻辑和 Tanh 的 Sigmoid 函数无疑是 AE 中最流行的激活函数（Charte et al. 2018）。值得注意的是，DAE
    可以在不同的隐藏层使用不同的激活函数。


    在考虑具有一个隐藏层的最简单 AE 配置后，学习过程开始通过以下编码函数对输入的隐藏表示（即向量 x = [x1, ..., xp]^T）进行编码：


    ```

    h = s_1(W^{(1)}x + b^{(1)})\qquad (2.29)

    ```


    其中 h 表示编码层中 x 的代码或表示；W^(1) 和 b^(1) 分别指编码器权重矩阵和偏置向量。此外，s1 是编码器的激活函数。接下来，通过以下解码函数执行输入的重建：


    ```

    x̂ = s_2(W^{(2)}h + b^{(2)})\qquad (2.30)

    ```


    其中 x̂ 表示 AE 输出层上的重建数据；W^(2) 和 b^(2) 是解码器权重矩阵和偏置向量；s2 表示激活函数


