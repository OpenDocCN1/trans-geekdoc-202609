    ### 2.3.3.1 UTSL 的超参数优化


    所提 UTSL 方法由两个配置不同的 AE 网络组成。在这些神经网络中，唯一的超参数是欠完备 DAE 的七个隐藏层的神经元数量以及过完备浅层 AE 的单个编码层的神经元数量。最近，Entezami
    et al. (2020) 提出了一种基于受控网格搜索的有效算法，用于根据网络训练的重建误差和最终预测误差（FPE）函数来查找 AE 的神经元数量。受该技术启发，本研究利用赤池信息量准则（AIC）对教师模型和学生模型进行超参数优化。为此，表
    2.1 列出了欠完备 DAE 隐藏层的样本神经元数量。


    使用这些样本神经元，只需设计十个不同的欠完备 DAE 并实现所提 UTSL 算法的第一步（关于教师模型学习）并计算残差数据点之和即可。假设 \(N_{H_i}\)
    是第 \(i\) 个隐藏层的神经元数量，其中 \(i = 1, ..., 7\)。在此基础上，AIC 指标写成以下公式：


    \(AIC = \ln(\varepsilon) + \frac{2N_v}{pn}\) (2.35)


