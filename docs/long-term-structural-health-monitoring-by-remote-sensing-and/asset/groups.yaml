    accuracy and reliability of such methods for damage assessment, especially in
    long-term monitoring programs. In this chapter, real-world applications of the
    proposed unsupervised learning methods (i.e., HMC-DAE-MD, HMC-UTSL-MD, HMC-DTL-MD,
