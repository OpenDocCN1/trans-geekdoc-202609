    ## 1.1 引言


    - (1) 设计和施工不当；

    - (2) 地震、风、洪水等自然灾害；

    - (3) 老化、材料劣化、侵蚀、疲劳等；

    - (4) 忽视自动化和持续的 SHM；

    - (5) 忽视检测和识别轻微或中度损伤模式；

    - (6) 经典目视检查无法有效监测土木结构；

    - (7) 基于光学相机或卫星的非接触式传感器新感知技术在自动化监测方案中得到的关注较少。


    另一方面，导致全面倒塌的主要原因可以概括为：


    - (1) 地震、台风、洪水等极强自然灾害；

    - (2) 作用于土木结构的特殊荷载；

    - (3) 老化、材料劣化、侵蚀、疲劳、失效等；

    - (4) 忽视自动化和持续的 SHM。


    为避免此类灾难性事件，SHM 提供了一种实用且有效的技术，通过利用人工智能和机器学习理念下的先进基于数据的技术，保护土木结构免受任何类型的损伤和倒塌。通常，基于数据的
    SHM 策略分解为一些初步步骤，包括：(i) 感知与数据采集系统，(ii) 数据转换与存储，以及 (iii) 初始数据分析。随后，有必要应用特征提取工具来提取损伤敏感特征（即仅取决于结构特性和损伤信息，而不取决于变异源、噪声和离群点的那些特征），并从机器学习理念出发，开发用于决策或特征判别的先进计算/统计模型。此步骤首先旨在确定训练和测试数据点的新奇性指数或损伤指标，随后通过报警阈值将获得的损伤状态指示与未损伤状态区分开来。


    通常，基于数据的 SHM 方法在训练/基线和监测/检验阶段实施（Entezami et al. 2020d; Entezami et al. 2021）。主要目标是在第一阶段通过训练数据学习自动化计算模型，然后在第二阶段通过测试数据和学习到的模型评估当前结构状态。根据机器学习理念，这些步骤可以通过监督学习和无监督学习技术来实施。在
    SHM 语境下，监督学习是指需要来自正常/未损伤和损伤状态的完全标记数据的技术。换句话说，需要准备两种状态的损伤敏感特征，以便学习一个分类器（即监督学习中的计算模型），用于对新特征（测试样本）进行分类并预测其标签。相反，无监督学习仅依赖于正常状态的特征；因此，有人尝试使用新特征（测试数据）通过新奇性（异常）检测器（即无监督学习中的计算模型）来评估结构当前状态的状态。一个重要的注意是，土木结构健康监测问题中完全标记数据的准备不仅困难、耗时且劳动密集，而且也不合乎逻辑。这是因为没有理由对复杂且重要的土木结构施加人为损伤，以便准备有限且受控的损伤数据（例如，Z24
    和 S101 桥梁的 SHM 问题 Maeck and De Roeck 2003; Döhler et al. 2014）。为应对这一局限性，在某些情况下，可以构建真实结构的数值模型并模拟各种损伤模式以提供损伤数据（Figueiredo
    et al. 2019; Torzioni et al. 2022; Daneshvar et al. 2023a; Entezami et al. 2020c）。然而，实施该方法的主要障碍在于由于理想化、简单假设、错误建模和噪声数据，数值模态与真实模态之间不可避免的差异。在此情况下，有限元模型更新是强制性的（Ereiz
    et al. 2022; Rezaiee-Pajand et al. 2021, 2020），这可能会带来额外的挑战。因此，可以认识到，无监督学习是土木结构
    SHM 的更好解决方案。


    感知技术是 SHM 的一个广泛领域，包含从接触式传感器（例如，应变片、加速度计、光纤等）（Wang et al. 2014b; a）到非接触式传感器（Feng
    and Feng 2018）的各种传感器和数据采集系统。尽管通过常见且易于获取的设备（例如，商用相机、视频设备、智能手机等）使用非接触式感知技术在学术和工业
    SHM 活动中很普遍（Sony et al. 2019; Dong and Catbas 2021），但一些局限性不允许土木工程师和研究人员获得合理的结果。其中之一是，这种感知技术无法为大型结构的监测提供简单的常规流程。另一方面，对在大型区域建造的桥梁和水坝等一些重要结构系统进行倒塌前调查可能会出现问题。这一局限性在连续长期
    SHM 计划中会变得更糟。除了这些局限性，轻松将非接触式传感器应用于 SHM 应用的最大障碍是许多已建造的土木结构缺乏关于初始未损伤状态的丰富信息。尽管最优感知技术为检测表面损伤（例如，混凝土裂缝
    Kim et al. 2019; Kang et al. 2020; Dung and Anh 2019）和剥落（Cao et al. 2021; Dawood
    et al. 2017）、钢筋腐蚀（Yao et al. 2019）、疲劳裂缝（Dung et al. 2019; Kong and Li 2018; Xu
    et al. 2019）等带来了重要机遇，但一些重要的损伤模式并不简单可见。为应对这些局限性，从太空和卫星遥感获取的合成孔径雷达（SAR）图像为土木结构系统的健康评估带来了新技术。SAR
    辅助 SHM 的巨大好处包括但不限于：


    - 在广阔区域评估大型结构系统，无需担心传感器的放置、部署和安装

    - 获取土木结构未损伤状态的初始信息

    - 观察土木结构周围的广阔区域

    - 在云层和恶劣天气存在下捕获 SAR 图像

    - 通常，SAR 辅助 SHM 策略分为三个主要部分：

    - 选择卫星类型，如 Sentinel-1、COSMO-SkyMed、TerraSAR-X，根据不同的格式下载 SAR 产品，包括单视图复数（SLC）、地距离检测（GRD）、原始图像、波段、极化、顺序（即降轨或升轨）等

    - 应用干涉测量法，如 InSAR、DInSAR、SqueeSAR 等，提取位移数据点

    - 分析位移数据以进行 SHM。¹


    ## 1.2 文献综述：现有知识与现有不足


    关于 SAR 辅助 SHM 应用，可以参考 Selvakumaran et al. (2018) 进行的研究，他们利用从 TerraSAR-X 获取的 45
    张 SAR 图像评估了由桥墩冲刷引起的砖石桥局部倒塌。他们直接分析了这些图像中的位移，并通过在位移分布中发现异常来预测局部倒塌的发生。Milillo et
    al. (2019) 通过应用来自多颗卫星的若干 SAR 图像，对莫兰迪桥局部倒塌前的结构状况进行了评估。他们只观察了损伤区域附近的位移，并调查了预警局部倒塌的可行性。Giordano
    et al. (2022) 使用 2011 年至 2019 年间 COSMO-SkyMed 获取的 SAR 图像，对一座历史铁桥可能的损伤进行了长期损伤评估策略。他们强调了
    EOCs 对通过 SAR 图像获得的土木结构位移数据的严重影响。为此问题，经典 PCA 方法被应用于从测量的位移数据点中去除可能的 EOCs，并将控制图用于异常检测。他们最终得出结论，从位移数据中去除
    EOCs 使他们能够检测高达 2 毫米的桥墩沉降。Biondi et al. (2020) 提出了一种基于振动的早期损伤预警方法，使用 SAR 图像而无需位移样本提取，采用模态分析。特别是，他们在莫兰迪桥上检验了其方法学的可能性。Farneti
    et al. (2022) 在 2015 年至 2020 年间，利用来自 COSMO-SkyMed 的相对较大一组 SAR 图像，对意大利阿尔比亚诺-马格拉桥（该桥于
    2020 年 4 月全面倒塌）进行了长期监测过程。为此问题，他们提取了从 2013 年 1 月至 2020 年 4 月的升轨 121 张 SAR 图像以及
    2015 年 3 月至 2020 年 3 月的降轨 64 张 SAR 图像中获得的二维位移样本。他们的主要工程目标是量化通过 InSAR 技术获得的二维位移测量中的不确定性。


    ¹ 在大多数情况下，研究活动主要集中于对从 SAR 图像中提取的位移进行直接分析。


