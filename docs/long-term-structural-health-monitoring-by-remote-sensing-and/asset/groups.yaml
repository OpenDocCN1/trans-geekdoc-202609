    本在线学习方法的重大创新在于利用欠完备三隐藏层DAE开发了一种新型两阶段算法。该方法的另一项创新在于其学习和损伤检测机制与先前提出的所有基于离线学习策略的混合学习技术完全不同。就此而言，在线混合学习第一阶段的终止标志着损伤的发生，这为结构健康监测（SHM）带来了重大创新。


    ### 类别 III.


    结构健康监测（SHM）过程的根本目标是确定至少两种结构状态条件（即，未损伤状态与当前状态，后者可能为未损伤或已损伤）之间的差异。因此，应仅通过各种新奇性探测器（Sarmadi
    and Karamodin 2020; Sarmadi and Yuen 2021, 2022; Daneshvar and Sarmadi 2022; Entezami
    et al. 2020d; Bigoni and Hesthaven 2020; Turrisi et al. 2022）或统计距离度量（Deza and
    Deza 2013; Entezami 2021; Entezami and Shariatmadar 2018; Entezami et al. 2022d,
    e）来寻找这些条件之间的差异。这些方法的主要目的是产生具有区分度的新奇性指标或损伤指示器，以区分可能的损伤状态和未损伤状态。在考虑了相对较多的位移数据点后，本书最初提出了一种借助NNS、EVT和分位数建模的概率性新奇性探测器。该方法（NNS-EVT）的重大创新在于定义一种新的概率性新奇性指标，即来自某些极端样本的分位数值。该方法的一大好处是，可以通过使用各种极端值分布模型、其分位数值以及两种不同的极端值建模技术（即，块最大值法和超阈值峰值法）来开发不同的新奇性探测器。这意味着，尽管NNS-EVT为新奇性检测提供了单一算法，但可以将其与不同的极端值分布和框架结合使用。就小位移数据而言，尽管所提出的离线混合学习方法（即，HMC-MD、HMC-DAE-MD、HMC-UTSL-MD和HMC-DTL-MD）采用了经检验的马氏距离度量，但在线混合学习方法（即，HMC-ODTL-EMD和SLS-ODTL-EMD）提出了一种新的新奇性指标。关键创新在于从多变量距离度量中派生单变量距离值的机制。


    ## 1.5 本书组织


    本书的组织结构可概述如下。第2章全面讨论了所有拟议方法。在第3章中，所提议的NNS-EVT和HMC-MD技术通过一个全规模桥梁的数值模型进行了评估和验证。在这项数值研究中，位移数据由有限元方法模拟。为了验证其他拟议方法，第4章介绍了一个具有现实部分坍塌的真实世界土木结构。因此，使用从有限SAR图像中提取的小位移数据点，通过真实世界数据验证了所提议的混合学习方法。最终，本书的结论及一些进一步研究的建议在第5章中进行了说明。


    ## 1.6 章节摘要


    本章旨在介绍利用遥感技术和SAR图像对土木结构进行健康监测的方法。主要焦点是坍塌现象。在提及遥感辅助的SAR辅助SHM的优势后，详细讨论了该策略中的主要挑战和局限性。为了更好地解释，提出了编写本书的主要动机，这大大有助于读者更好地理解本书的目的和范围。接下来，简要介绍了所有拟议方法。最终，适当披露了本书的主要创新。通过本章讨论的这些描述和文献综述，可以得出结论：经典的SAR辅助SHM技术可能无法通过直接分析位移数据为大规模土木结构的损伤评估提供可靠框架。对于通过SAR图像进行的长期监测计划，开发强健的机器学习技术以缓解EOCs的负面影响是至关重要的。


