    ## 2.3.3 基于无监督教师-学生学习的数据归一化


    与之前的 HMC-DAE-MD 技术类似，所提出的 HMC-UTSL-MD 方法包含三个部分：通过 HMC 采样进行数据增强、通过新方法进行数据归一化，以及基于
    MD 的特征鉴别。由于第一部分和第三部分已有解释，本节主要关注用于数据归一化的无监督教师-学生学习（UTSL）方法。该方法的核心源于教师-学生学习概念，该概念由复杂模型（教师）和简单模型（学生）构建了一个两阶段学习框架。教师通常是一种复杂且严谨的方法，旨在为测量数据提供最佳表示学习，而学生利用教师的输出来促进学习过程或在不应用复杂模型的情况下继续其他任务（Mirzaei
    et al. 2020）。根据是否存在监督信息，任何教师-学生学习都可分为监督类和无监督类。与其他类型的学习算法类似，监督教师-学生学习技术由使用完全标记训练数据的监督机器组成，而无监督教师-学生学习方法由仅利用未标记数据的无监督机器组成。


    本节所提出的数据归一化方法基于无监督教师-学生学习框架。该方法利用不同的自编码器（AE）来开发教师模型和学生模型。在第一步中，考虑了具有七个隐藏层（L =
    3）的欠完备 DAE 来训练复杂的教师模型。图 2.8a 展示了此人工神经网络（ANN）及其配置。为此，需要使用增强训练数据（X）训练此深度 ANN，并在模型输出层对其进行重建（X̂）。教师学习的主要输出是输入与输出之间的残差矩阵（Eₓ）。随后，该矩阵作为新输入输入到学生模型。因此，在第二步中，设计了一个过完备浅层
    AE 来执行学生学习。图 2.8b 展示了学生模型及其配置。相应地，教师模型的残差矩阵（Eₓ）被输入到浅层 AE 的输入层以对其进行重建（Eₓ̄）。接下来，执行一个新的残差提取过程，从学生模型中获得新的残差矩阵
    Eₓ̅ = |Eₓ − Eₓ̄|。为求简洁，图 2.9 描绘了所提 UTSL 方法的图形流程图。


    尽管上述策略与增强训练数据相关，但有必要在增强测试数据（Z）上运行它们。主要区别在于，训练好的教师和学生模型仅用于确定测试数据的残差矩阵。这意味着在测试阶段不需要学习过程。在这种情况下，扩展的测试数据被输入到训练好的欠完备
    DAE 中，以尝试对其进行重建（Ẑ）并确定教师残差矩阵（E_z）。随后，该矩阵应用于训练好的过完备浅层 AE，以再次对其进行重建（E_z̄）。最后，学生残差矩阵
    E_z̅ = |E_z − E_z̄| 被提取为 UTSL 算法在测试/监测阶段的输出。在从增强训练集和测试集中提取学生残差矩阵后，将这些矩阵纳入基于 MD
    的新奇性检测器中进行特征鉴别（参见第 2.3.5 节）。


