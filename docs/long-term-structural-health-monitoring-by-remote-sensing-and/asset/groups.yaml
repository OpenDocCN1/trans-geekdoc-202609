    指编码层的神经元数量；\( p \) 和 \( n \) 是训练数据 \(\mathbf{X}\) 的大小；\(\varepsilon\) 是表示平均误差和的标量，定义如下：


    \(\varepsilon = \frac{\sum_{i=1}^n \sum_{j=1}^p (e_{xj} - \overline{e}_{xj})_i^2}{2pn}\)
    (2.36)


    在此公式中，标量值 \( e_{xj} \) 和 \( \overline{e}_{xj} \) 分别是残差矩阵 \(\mathbf{E_x}\) 和 \(\overline{\mathbf{E_x}}\)
    的第 \(j\) 行数据点。在考虑了隐藏层神经元的所有试验后，可以得到十个 AIC 值。最佳样本神经元集合是指导致最小 AIC 值的那一组。


    在选择最优神经元集合后，剩余的超参数是学生学习中浅层 AE 编码层的神经元数量。在此，应该指出的是，选择较小的神经元数量可能不会对学习过程产生积极影响。为解决此问题，神经元大小的下界应大于
    \( p \)，以便我们能够设计过完备浅层 AE。另一方面，非常大的神经元数量会带来过拟合问题的风险。因此，教师学习中关于欠完备 DAE 的最优神经元集合之和被设定为浅层
    AE 神经元大小的最优值；即，\( N_S = \sum_{i=1}^7 N_{H_i} \)。


    ## 2.3.4 基于深度迁移学习的数据归一化


    参数机器学习方法的主要挑战之一是其超参数选择。基于此，学习和/或决策过程可能耗时且复杂。为了开发一种高效且有效的 SAR 辅助 SHM 策略，本节提出了一种基于连续
    DAE 的新深度迁移学习（DTL）方法。从机器学习角度来看，迁移学习是通过从先前学习过的相关任务迁移知识来改进新任务的学习过程（Yang et al. 2020）。换句话说，在新领域中，无需实现源领域的相同步骤或估计新参数。相反，可以将源领域的全部或部分信息应用于新领域。一个著名的示例是将一些具有高通用性能的流行深度神经网络应用于其他工程领域（Gao
    and Mosalam 2018; Azimi and Pekcan 2020）。


    在考虑了机器学习中的这一概念后，HMC-DTL-MD 中数据归一化的基本原则是利用迁移学习概念，忽略对隐藏层神经元进行严格的超参数优化。所提 DTL 的关键思想是，一个具有预设神经元的欠完备三隐藏层
    DAE（L = 1）（参见图 2.6a），用于映射层、编码层和反映射层，足以在无需任何超参数优化的情况下消除 EOC 效应。换句话说，提出 DTL 的主要意图是忽略确定
    DAE 隐藏层的神经元。根据 Kramer 的建议（Kramer 1991; Figueiredo et al. 2011），采用包含 10、2 和 10
