    # 1.3 Motivations


    Based on the major challenges in SHM and its new technique via SAR images, this
    book aims to propose innovative methods to deal with these challenges and develop
    a more reliable and robust manner for long-term health monitoring of civil structures
    based on SAR images. Hence, one initially attempts to clarify the main motivations
    of this book and then discuss the proposed method.


    **Motivation I**: In most of the SAR-aided SHM applications, long-term monitoring
    is preferable to evaluating the stability and health of civil structural systems.
    Unlike vibration-based procedures for SHM, a limited number of displacement points
    can be extracted from a few SAR images during a long period of years (e.g., one,
    two, five, or even ten years). Although, this strategy can help civil engineers
    to observe variations in displacements and detect any abnormal condition in the
    structures, it is not an effective and robust way. Normally, the EOC is dominated
    in long-term SHM. Due to their direct and significant effects on structural behavior
    and responses, any change in displacement sample cannot be interpreted as an abnormal
    condition or a serious risk. It may be caused by the EOCs that are not naturally
    adverse situations. However, these conditions may lead to false positives that
    directly relate to the economic issue. On the other hand, minor damage may cause
    smaller changes in displacement data than the EOCs. In this case, it is difficult
    to detect minor damage. Accordingly, the decision-making tools (i.e., feature
    discrimination techniques) cannot precisely alarm the emergence of damage (i.e.,
    false negative or Type II), thereby gradually expanding and occurring major damage
    as partial and then global collapses. The other challenging issue is that the
    EOCs in small data obtained from a long-term monitoring strategy are often hidden
    or invisible. Therefore, in the first motivation, one attempts to propose an effective
    approach to extract or reveal the EOCs. For this purpose, it is suggested to augment
    or expand the small data by some Markov Chain Monte Carlo algorithms. Using the
    augmented or expanded data, it will be observed that the proposed methodology
    highly assists civil engineers in'
  - '[PAGE 28]


    understanding the behavior and responses of the structure with respect to the
    EOCs, particularly seasonal behavior in long-term monitoring.


    **Motivation II:** There is no doubt that the EOCs have significant influences
    on the structural responses and behavior. These can lead to either extra costs
    or time for detecting damage when the structure is in its normal or undamaged
    state (i.e., false positive or Type I error) or immense costs and human losses
    when the structure really suffered from damage but it is assumed to be undamaged
    (i.e., false negative or Type II error). On this basis, the removal of the EOCs
    from the main data for long-term SHM (i.e., time, frequency, or modal data, displacements,
    etc.) is a major challenging issue. Hence, it is indispensable to pay much more
    attention to this challenge for small data. For this problem, there are two tasks
    that should be considered and dealt with properly. First, it is necessary to remove
    or mitigate all possible EOCs from either small or expanded data. Second, one
    should increase the reliability of decision-making by decreasing the rates of
    false positives and false negatives as well as increasing damage detectability.
    For these tasks, this book proposes new methods based on machine learning, ANNs,
    and deep learning to remove any EOC from the augmented data.


    **Motivation III:** Most of the parametric machine learning methods are based
    on influential unknown parameters that directly affect their general performances.
    This means that any inaccurate choice or estimation of these parameters may lead
    to an incorrect learning process and imprecise results with large errors (e.g.,
    false positive or false negative). Accordingly, hyperparameter optimization is
    mandatory (Sarmadi 2021; Yang and Shami 2020). In some cases, the optimum choice
    of hyperparameters a parametric model (e.g., the neurons associated with hidden
    layers of an ANN) may be time-consuming and laborious, particularly if the hyperparameter
    optimization is based on a manual tuning approach. Although it seems that the
    optimization-based methods outperform the manual tuning techniques, the definition
    of an objective function for a particular problem (e.g., the removal of the EOC
    condition available in real or augmented data) may not be trivial. Hence, the
    development of an effective but fast machine learning method can be a major challenge
    in continuous SHM. To deal with this problem, this study aims to propose a deep
    transfer learning method to not only enhance the accuracy and reliability of feature
    discrimination but also make a simpler learning process than the common learning
    strategies under rigorous hyperparameter optimizations.


    **Motivation IV:** Despite the effectiveness of many SHM methods based on the
    offline learning framework, it may not suffice for performing a long-term monitoring
    scheme. As mentioned earlier, one cannot make sure that the structure is undamaged
    during the offline learning process. Furthermore, it is difficult to assume that
    the same variability conditions in the offline learning period emerge once again.
    The major limitation is that the learned model confronts new data with different
    variability pattens. To address these problems, this study sets out to design
    online hybrid learning algorithms.'
