    ## 图 2.3 拟议的 NNS-EVT 方法在监测阶段的主要步骤


    关于结构当前状态的指标。为了总结并做出最终决定，基线阶段和监测阶段获得的所有分位数值均收集到向量 q = [[qx1, ..., qxn], [qz1, ...,
    qzm]] 中。使用基线阶段获得的阈值，预期向量 q 的前 n 个样本位于阈值以下，表明结构处于未损伤状态；否则，超过阈值的每个分位数值均为误报误差。


    对于监测阶段的分位数值 |qz1|, ..., |qzm|，存在三种情况：


    - 如果每个分位数值 |qz1|, ..., |qzm| 均超过阈值，则需要报警损伤发生。

    - 在报警损伤发生且未对结构进行任何修复、改造和康复程序的情况下，任何低于报警阈值的分位数值均表明为漏报。

    - 如果分位数值 |qz1|, ..., |qzm| 均未超过阈值，则可以确认结构处于未损伤状态。


    ## 2.3 应对小数据挑战：拟议的混合学习方法


    除 HMC-MD 技术外，其他拟议的混合学习方法包含三个关键步骤：(i) 基于马尔可夫链蒙特卡罗算法（即 HMC 或 SLS）的数据增强，(ii) 基于 ANN
    的数据归一化，以及 (iii) 基于 MD 和 EMD 的特征鉴别。一旦小规模位移样本集被增强，扩展后的数据将被分解为训练子集和测试子集。这些子集可以直接应用于新奇度检测器（例如
    MD），或输入数据归一化工具（例如 DAE）或算法（例如 UTSL、DTL 和 ODTL）以消除任何变异性来源。关于 HMC-MD 技术，在 EOCs 水平较低的情况下不考虑数据归一化（Sarmadi
    2021）。


    ### 2.3.1 基于马尔可夫链蒙特卡罗的数据增强


    在统计学中，马尔可夫链蒙特卡罗方法是一类用于从概率分布中进行系统随机采样的概率算法。与能够从感兴趣的分布中绘制独立样本的蒙特卡罗采样技术不同，马尔可夫链蒙特卡罗方法可以绘制下一个样本依赖于现有样本的样本，称为马尔可夫链。顾名思义，马尔可夫链蒙特卡罗算法由蒙特卡罗和马尔可夫链两部分组成。在概率论中，蒙特卡罗是一种随机采样概率分布并近似所需量的方法。在此基础上，蒙特卡罗技术通常假设可以从目标分布中有效地绘制样本，在此情况下，从绘制的样本中，可以将求和或积分量估计为绘制样本的均值或方差。另一方面，马尔可夫链是生成随机样本序列的系统随机过程，其中当前样本在概率上依赖于前一个样本的值。在结合这两种方法论（即马尔可夫链和蒙特卡罗）的情况下，它允许我们通过构建包含蒙特卡罗样本的马尔可夫链来绘制高维分布的随机样本，该链保持样本之间的概率依赖。为此目的，只需构建一个包含所需分布作为其平衡分布的马尔可夫链，然后通过记录链中的状态来获得该分布的一个样本（Van
    Ravenzwaaij et al. 2018）。Entezami et al. (2022) 研究了数据增强在结构健康监测（SHM）中的成功性能，涉及少量异常指标的损伤定位和阈值估计。


    ### 2.3.1.1 哈密顿蒙特卡罗采样


    哈密顿蒙特卡罗采样是一种马尔可夫链蒙特卡罗技术，用于在直接采样过程不可行时从目标概率分布中获取一系列随机样本（Neal 2011）。该方法对应于带有哈密顿动力学演化的
    Metropolis–Hastings 算法的一个实例，该演化可以通过使用时间可逆且体积保持的数值积分器来模拟，以提供移动到新样本的方式。与 Metropolis–Hastings
    算法不同，HMC 方法通过执行移动到远处状态来减少连续采样状态之间的相关性，这些远处状态可以提供较高的接受概率，归功于模拟哈密顿动力学具有近似能量守恒特性。简单来说，相关性降低意味着需要较少的马尔可夫链样本来近似目标概率分布下的积分。


    假设 \( f(\mathbf{x}) \) 是待通过样本链 \( \{\mathbf{x}_0, \mathbf{x}_1, \mathbf{x}_2,
    ...\} \) 进行采样的目标分布。相应地，汉密尔顿方程写成如下形式：


    ```

    \frac{\mathrm{d}x_i}{\mathrm{d}t} = \frac{\partial H}{\partial w_i} \quad (2.22)

    \frac{\mathrm{d}w_i}{\mathrm{d}t} = \frac{\partial H}{\partial x_i} \quad (2.23)

    ```


    其中 \( x_i \) 和 \( w_i \) 分别表示参数和动量向量的第 \( i \) 个元素。此外，\( H \) 指哈密顿函数。假设 \( \mathbf{M}
    \) 是一个对称正定（质量）矩阵。在此基础上，哈密顿量表示如下：


    ```

    H(\mathbf{x}, \mathbf{w}) = U(\mathbf{x}) + \frac{1}{2}\mathbf{w}^T \mathbf{M}^{-1}
    \mathbf{w} \quad (2.24)

    ```


    其中


    ```

    U(\mathbf{x}) = - \ln f(\mathbf{x}) \quad (2.25)

    ```


    从公式 (2.25) 可以理解，HMC 算法下的采样方法依赖于与目标分布相关的对数函数。此外，该采样器利用跳蛙技术（Neal 2011），即非相互作用经典粒子运动的近似解，来确定任意时刻的参数和动量分量。为此目的，采样算法需要一个正整数作为跳蛙步数
    \( L \) 和一个正数作为步长 \( \Delta t \)。随后，它从均值为零且协方差等于质量矩阵 \( \mathbf{M} \) 的高斯分布中绘制随机高斯动量
    \( \mathbf{w}(0) \)。在下一步中，粒子在哈密顿动力学下运行时间 \( L\Delta t \)。应当指出，此过程通过跳蛙技术通过数值求解汉密尔顿方程来执行。在此方面，时间
    \(\Delta t\) 后的参数和动量向量如下给出：


    \(\mathbf{w}\left(t + \frac{\Delta t}{2}\right) = \mathbf{w}(t) - \frac{\Delta
    t}{2} \nabla U(\mathbf{x})|_{\mathbf{x}=\mathbf{x}(t)}\) (2.26)


    \(\mathbf{x}(t + \Delta t) = \mathbf{x}(t) - \Delta t \mathbf{M}^{-1} \mathbf{w}\left(t
    + \frac{\Delta t}{2}\right)\) (2.27)


    \(\mathbf{w}(t + \Delta t) = \mathbf{w}\left(t + \frac{\Delta t}{2}\right) - \frac{\Delta
    t}{2} \nabla U(\mathbf{x})|_{\mathbf{x}=\mathbf{x}(t+\Delta t)}\) (2.28)


    上述方程应分别对 \(\mathbf{x}(0)\) 和 \(\mathbf{w}(0)\) 应用 \(L\) 次，以确定 \(\mathbf{x}(L\Delta
    t)\) 和 \(\mathbf{w}(L\Delta t)\)。设 \(\mathbf{d} \in \mathbb{R}^{p \times 1}\)
    表示来自 SAR 图像的 \(p\) 个目标点的一组位移点。请注意，每个 \(\mathbf{d}\) 都等价于 \(\mathbf{x}\)。在此基础上，HMC
    采样器的根本目标是在 \(C\) 条链和 \(N\) 个样本数下预测向量 \(\mathbf{d}\)。这意味着 HMC 技术试图从目标分布（即本研究中的高斯分布）生成向量
    \(\mathbf{d}\) 的 \(N\) 个点，以在迭代算法的 \(C\) 条链下在新矩阵 \(\mathbf{D} \in \mathbb{R}^{p
    \times N}\) 中生成一组增量位移点。换句话说，对于第 \(j\) 条链和第 \(k\) 个样本，其中 \(j = 1, ..., C\) 且 \(k
