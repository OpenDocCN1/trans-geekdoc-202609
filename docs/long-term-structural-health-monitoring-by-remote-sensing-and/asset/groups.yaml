    ## 5.3 未来研究机会


    尽管本研究提出了各种机器学习方法，以在小位移数据和不可预测 EOCs 存在的情况下发展经典的 SAR 辅助 SHM，且这些方法能够呈现可靠和正确的结果，我们也为进一步的研究提出了一些建议。


    ### 5.3.1 基于生成对抗网络的数据增强


    在本书中，基于马尔可夫链蒙特卡洛概念的概率算法已被用于扩展小位移点。由于 Goodfellow 等人（2014）提出生成对抗网络（GANs），深度学习发生了革命性变革，建议通过各种
    GANs（Creswell 等人，2018）扩展数据增强过程。


    ### 5.3.2 新型机器学习算法下的数据归一化


    本书已验证，无论数据和结构的类型如何，EOCs 在现实世界的长期 SHM 项目中都是不可避免的。在此基础上，实施数据归一化以减轻或消除 EOCs 对基于 SHM
    的特征的所有影响至关重要。在本工作中，已尝试借助深层和浅层 DAEs 开发各种基于 DNN 的数据归一化算法。尽管一些机器学习算法（如无监督教师－学生学习、迁移学习和在线学习）已被纳入以提出这些算法，但仍有可能利用更多新颖的机器学习概念。因此，建议通过利用一些高级机器学习算法（如集成学习（Dietterich
    2000）、半监督学习（Schwenker and Trentin 2014）、主动学习（Settles 2012）、字典学习（Daneshvar 等人，2023）、元学习（Entezami
    等人，2023a）、多任务学习（Entezami 等人，2023b）、混合学习（Sarmadi 等人，2023）、经验学习（Entezami 等人，2022）以及基于稀疏、去噪、堆叠和变分配置的新型
    DAEs（Charte 等人，2018；Dong 等人，2018）来扩展数据归一化程序。


    另一方面，本书中提出的数据归一化技术需要一些超参数，这使它们成为数据归一化的参数化算法。为避免在超参数优化问题上遇到困难和挑战，建议利用一些新机器学习概念（如无监督特征选择（Solorio-Fernández
    等人，2020）和特征加权（Niño-Adan 等人，2021））开发非参数数据归一化方法。


    ### 5.3.3 面向实时 SHM 的增强在线学习


    尽管所提出的在线混合学习为实时 SHM 开辟了新方法论，但决策取决于一个关于停止在线学习阶段的假阳性错误率的预定义值。为增强该方法论，建议使用用于在线学习阶段停止条件的新性能评估指标来开发更稳健的算法。


    ### 5.3.4 损伤定位


    除了早期损伤检测问题之外，SHM 中另一个重要挑战是定位结构的损伤区域（Entezami 等人，2018；Heravi 等人，2022）。在这方面，提出损伤定位框架将非常合适。基于接触式感知技术的无监督损伤定位的主要局限之一是安装足够传感器以测量合适信息的限制（Entezami
    和 Shariatmadar，2019；Entezami 等人，2022）。遥感技术和 InSAR 技术的一大优点是为测量位移/变形数据提供分布式目标点，这些点可以作为虚拟接触式传感器（Behkamal
    等人，2023a, b）。因此，建议利用遥感技术获取的信息，提出用于定位损伤区域的无监督学习方法。


