    在此基础上，最后一个DAE的残差集（E_x）被提取为与未损坏状态相关的最终输出，用于特征歧视。对于实际的增强测试数据Z，七个训练有素的DAE被连续重复使用，以提取其残差样本（E_z1,
    ..., E_z6）。最后，第七个（最后一个）DAE的残差集（E_z7）被提取为关于监控（测试）阶段的最终输出，用于特征歧视。换句话说，残差矩阵E_x7和E_z7被插入基于MD的新奇性探测器中，以确定训练和测试数据点的新奇性指数。


