    # 3.5 Chapter Summary


    This chapter has presented the main results of the numerical study on the I-40
    Bridge. In this study, it has been attempted to simulate large and small displacement
    datasets obtained from SAR images at some target points on the structure. Subsequently,
    the proposed probabilistic unsupervised learning method NNS-EVT and hybrid learning
    method HMC-MD have been applied to detect various damage cases with different
    severity levels under large and small displacement data points. Both techniques
    have been successful in detecting the simulated damage cases in the I-40 Bridge.
    Although the proposed NNS-EVT method is suitable for SHM under different EOC conditions,
    due to taking advantage of the concept of NNS that is an effective approach to
    mitigating the EOCs (Sarmadi et al. 2021a, 2022, 2023; Sarmadi and Karamodin 2020;
    Entezami et al. 2018, 2020, 2023a, b, c; Entezami and Shariatmadar 2018; Esfehani
    et al. 2023; Heravi et al. 2022), the performance of the proposed HMC-MD method
    is not clear under these conditions. As the numerical study on the I-40 Bridge
    did not consider the EOCs in the simulated displacement samples, it is critical
    to assess HMC-MD in this issue. For the reason, the next chapter will evaluate
    this problem by using real-world small displacement data of a real structure.


