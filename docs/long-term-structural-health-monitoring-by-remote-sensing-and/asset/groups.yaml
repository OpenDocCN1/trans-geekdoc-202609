    # 1.2 Literature Review: Existing Knowledge and Existing Gaps


    both COSMO-SkyMed and TerraSAR-X between 2010 and 2015. The main objective was
    to use hydrostatic-seasonal-temporal and hydrostatic-temperature-temporal models
    to interpret the nonlinear deformation at the dam wall through the ground measurements
    together with SAR time-series analysis. In this regard, the authors could find
    that most of the deformation at the dam can be explained by taking into account
    only thermal seasonal dilation and hydrostatic pressure. Di Martire et al. (2014)
    proposed a new DInSAR technique for ground displacement monitoring of an embankment
    dam called the Conza Dam in Italy. The authors utilized 51 SAR images belonging
    to ENVIRonmental SATellite-Advanced Synthetic Aperture Radar (ENVISAT-ASAR) to
    extract the SAR-based ground displacements. Because the ground displacements recorded
    by a network of conventional ground-based sensors installed in the dam were also
    available, they could perform a comparative study in terms of statistical analysis
    to realize the superiority of remote sensing over the traditional contact-based
    sensing. Gama et al. (2020) exploited SBAS and PSI techniques for relatively short-term
    deformation monitoring of the Brumadinho Dam located in Brazil before its collapse
    via 21 SAR images of Sentinel-1 in the descending orbit from 03 March 2018 to
    22 January 2019. During such a relatively short-term monitoring program, the direct
    analysis of the 21 displacement samples regarding the crest, middle, and bottom
    sectors of the dam indicated serious variability, which was an alarm of an adverse
    change (collapse). Jänichen et al. (2022) implemented a study on long-term deformation
    monitoring of the Moehne gravity dam located in Germany and also the radial deformation
    of the dam. In their gravity, the authors exploited the PSI technique for extracting
    the deformation samples from SAR images of Sentinel-1 between 2015 and 2020. They
    concluded that the displacements or deformations of the dam followed a seasonal
    pattern and the PSI technique could achieve reasonable accuracy for health monitoring
    of the dam of interest.


    Due to the important influences of environmental and operational changes (EOCs)
    on civil structures, some authors studied these conditions by using SAR images.
    In this regard, Qin et al. (2017) assessed the impacts of air temperature on displacements
    of two arch bridges with different materials using several SAR images from COSMO-SkyMed,
    TerraSAR-X, and Sentinel 1. Haung et al. (2017) utilized 29 SAR images acquired
    by Sentinel 1 for the health monitoring of a long-term bridge by analyzing longitudinal
    displacement samples alongside thermal analysis under temperature fluctuations.
    Ma et al. (2019) analyzed the dynamic behavior of a high-speed railway bridge
    and investigated the feasibility of measuring settlement and uplift in the unit
    of millimeter by applying SAR images from COSMO-SkyMed. They also modeled the
    temperature variability and attempted to separate the thermal expansion and linear
    deformation. Schlögl et al. (2021) analyzed a relatively large displacement data
    samples of 719 SAR images from Sentinel-1 in both ascending and descending orbits
    regarding a side harbor bridge in Austria (i.e., called Seitenhafenbrücke). In
    their research, the authors performed structural deformation monitoring between
    October 2016 to October 2019 by using many post-processing tools such as cleaning
    and smoothing for reducing outliers in measured displacement samples and also
    seasonal trend decomposition for separating deformation trends from seasonal deformation.'
  - '[PAGE 22]


    Despite many successful applications of SAR-aided SHM on different civil structures,
    particularly bridges, this technology has its limitations and challenges (Behkamal
    et al. 2023a, b). One of these challenges is the impossibility of providing rich
    and adequate information (measurements) as same as vibration-based SHM (Entezami
    et al. 2022a, b). To put it another way, any vibration-based SHM may contain many
    contact- and non-contact vision-based sensors to measure vibration responses (e.g.,
    acceleration time histories or displacements from images or videos) in a long-term
    monitoring program. Under such circumstances, one can obtain huge volume of useful
    information and responses regarding the behavior of the structure under study.
    In contrast, this strategy is not feasible in SAR-aided SHM. For example, Sarmadi
    et al. (2021b) exploited 5956 natural frequencies of a three-span bridge to detect
    damage in a one-year monitoring scheme. Entezami et al. (2020a) applied the total
    of 1,010,880,000 time series data concerning a cable-style bridge for only 12
    days. Because the preparation of such large data is not often possible in SAR-aided
    SHM, the major challenge is the problem of small data. Simply speaking, even though
    one can implement a long-term monitoring program for SHM of civil structures via
    remote sensing, a limited number of SAR images are usually applied to find out
    displacement data points. On the other hand, extremely large sizes of SAR images
    due to covering wide areas in the unit of km, and memory space restrictions for
    collecting many images are other limitations of this process. The other key challenge
    of SAR-aided SHM pertains to directly analyzing displacements extracted from satellite
    images regarding bridges (Selvakumaran et al. 2018; Miliello et al. 2019, 2016;
    Qin et al. 2017, 2018), buildings (Zhu et al. 2018; Macchiarulo et al. 2021; Giardina
    et al. 2019; Cigna et al. 2014; Di Carlo et al. 2021), and dams (Bayik et al.
    2021; Mura et al. 2018; Miliello et al. 2016; Di Martire et al. 2014; Gama et
    al. 2020; Jänichen et al. 2022). An important note is that the direct utilization
    of measured data is not a robust way for SHM. Undoubtedly, apart from the size
    and complexity of civil structures compared with other structural systems, those
    are expensive and critical. This means that any erroneous decision on SHM by directly
    analyzing measured data may cause irreparable events such as human deaths and
    injuries and economic losses. Therefore, the direct application of small data
    is not a reliable and robust technique for SHM of prominent civil structures,
    especially in long-term monitoring.


    Apart from this limitation, most of the unsupervised learning methods are susceptible
    to erroneous results due to severe variability in data and damage-sensitive features
    regardless of the type of sensing and features. In reality, ambient and environmental
    changes are inevitable in every civil structure built in outdoor environment.
    Daily and seasonal temperature fluctuations, wind speed and direction changes,
    humidity and moisture variations, and excitation amplitude alternations are prevalent
    environmental variability conditions. Moreover, operational variations in outdoor
    and indoor environment significantly affect civil structures. Dead and live load
    alterations, excessive loading, sudden accidents and collisions, explosions, human
    and vehicle traffic are some common operational variability conditions (Farrar
    and Worden 2013: Chapter 12; Wang et al. 2022). Even though the EOCs are not adverse
    phenomena like structural damage, those can alter the mass, stiffness, and damping
    properties of a structural system, as well as its materials, geometry, connectivity,
    and responses'
