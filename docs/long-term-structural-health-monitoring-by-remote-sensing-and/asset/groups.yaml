    ## 第 1 章


    ### 结构健康监测中远程遥感的先驱


    **摘要** 最近，利用遥感技术对土木结构进行长期结构健康监测（SHM）已引起土木工程师日益关注。这是因为此类技术可以通过引入有用的产品（例如从适用于监测大范围内大型土木结构的某些卫星获取的合成孔径雷达（SAR）图像）来促进
    SHM。与传统的基于接触的和下一代基于视觉的传感器不同，通过空间基遥感进行的长期监测计划无法提供高维结构响应。基于此，使用少量 SAR 图像即可实施该计划。利用此类产品，可以提取土木结构不同区域的位移形式的结构响应，并监测响应以检测任何异常变化。由于长期监测过程基于结构位移响应的分析，其主要重点在于机器学习。在此过程中，环境和运行变化会严重影响数据驱动机器学习辅助技术的性能。由于
    SHM 对每个社会都至关重要，本章旨在通过 SAR 图像和机器学习，解释土木结构远程遥感健康监测的主要部分。


    **关键词** 结构健康监测 · 遥感 · 合成孔径雷达图像 · 环境与运行变化 · 机器学习


    ### 1.1 引言


    高层建筑、桥梁、水坝、离岸油田平台、医院、核电站、铁路和地铁系统等土木结构，由于对人类社会生活、交通网络、医疗服务、经济等方面产生重大影响，对每个社会都至关重要。大部分建造的设施是按照不同的规范和指南设计，并采用各种施工技术建造的，这些技术可能已过时。其中一些是在多年前或数十年前建造的，在这种情况下，老化和材料劣化是导致其不希望分离性的两个主要因素。另一方面，在现实中，任何土木结构都可能遇到地震、强风、飓风、台风、洪水等不同强度的不可预测激源，或者这些激源的序列/组合。在这种情况下，结构损坏可能会出现，导致结构性能和服役性发生不利变化，并引起剧烈的部分和全面倒塌（Li
    et al. 2016; Mesquita et al. 2016; Webb et al. 2015; Modares and Waksmanski 2013;
    Deng et al. 2016; Chen 2017; Sassu et al. 2017; Alencar et al. 2019）。


    在土木工程中，评估土木结构完整性和安全性的实际过程称为结构健康监测（SHM）。这种方法论通常基于在土木结构上安装各种传感器，测量有用数据（即，振动响应，如加速度时程或新响应，如图像和视频），分析测量数据，并实施
    SHM 方法（Gharehbaghi et al. 2022; Rizzo and Enshaeian 2021; Sun et al. 2020）。该方法论的主要任务包括但不限于损坏发生的早期预警或宣告安全状态，在确认损坏发生后定位损坏区域，识别损坏类型，以及估计损坏严重程度（Heravi
    et al. 2022; Esfehani et al. 2023; Entezami et al. 2023b; Sarmadi et al. 2023c）。完成这些任务后，应对损坏区域进行修复或更换，以提高结构性能和服役性。


    受损结构可能经历不同严重程度的多种损坏模式。通常，这些级别被分类为轻微、中度和严重情况。无论轻微损坏如何，受损结构在中度和严重损坏模式下可能会发生部分或全面倒塌（Deng
    et al. 2016; Chen 2017; Abdelwahed 2019）。土木结构中的倒塌是一种现象，即结构的全部或部分可能因自然灾害或疲劳荷载造成的严重损坏而被破坏，以至于结构不再正常运行和服务。人员死亡和伤亡以及巨大的经济损失是倒塌现象的两种灾难性后果。一些由倒塌引起的悲剧包括：2007
    年明尼苏达州 I-35W 大桥（美国明尼苏达州明尼阿波利斯）发生的 13 人死亡事件（Astaneh-Asl 2008）、2018 年摩兰迪大桥（意大利热那亚）发生的
    43 人死亡事件（Rania et al. 2019）、2021 年香普兰塔南公寓（美国迈阿密）发生的 98 人死亡事件（Kong and Smyl 2022），以及
    2022 年阿巴丹大都会大楼（伊朗阿巴丹）发生的 31 人死亡事件。


    土木结构中的倒塌可能发生在全面和部分条件下。在全面倒塌期间，整个结构被摧毁，造成更加惨重的死亡和伤亡，以及因重建被毁结构而导致的巨大经济损失。相比之下，部分倒塌导致较低程度的倒塌，很可能比全面倒塌造成更少的伤亡。在这种情况下，结构的一小部分或某些部分会倒塌；尽管如此，结构可能以某种方式保持其稳定性。在这种情况下，有可能通过修复或更换部分倒塌区域来保全结构的整体稳定性。部分倒塌的主要原因包括（Deng
