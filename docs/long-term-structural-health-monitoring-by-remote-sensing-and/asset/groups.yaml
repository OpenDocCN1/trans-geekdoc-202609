    ## 第2章

    先进的MIL方法：连接SAR图像与结构健康监测


    **摘要** 经典的SAR辅助SHM直接分析从SAR图像中获得的位移数据。虽然通过各种干涉测量技术从SAR图像中提取位移响应对于基于遥感的SHM至关重要，但直接使用和分析基于SAR的位移响应来监测和评估复杂和关键土木结构的损伤并不是一种可靠和有效的方法，尤其是在具有各种不确定性和测量数据变异性的长期监测中。在此基础上，本章提出了各种机器学习方法，用于环境和操作条件下的SHM以及从SAR图像中检索的不同尺寸的结构位移响应的无监督学习。对于大量位移数据，提出了一种创新的概率无监督学习方法。对于少量位移数据，本章提出了两种无监督混合学习方法，主要由三部分组成：用于扩展小位移响应规模的数据增强、用于消除环境和操作条件影响的数据归一化，以及异常检测。


    **关键词** 机器学习 · 无监督学习 · 混合学习 · 在线学习 · 数据归一化 · 马尔可夫链蒙特卡洛 · 异常检测


    ### 2.1 引言


    大部分基于遥感的SHM项目都基于从SAR图像中检索的结构位移的直接分析。尽管该策略简单高效，但在EOCs（Behkamal et al. 2023a, b）下，它可能不适合对重要和复杂的土木结构进行损伤评估。为解决该策略的主要局限性和不足，本书拟提出更严谨的土木结构健康监测方法，重点关注桥梁，使用与经典SAR辅助SHM技术相同的SAR图像和位移数据。在此基础上，根据位移数据的规模，本书针对相对大数据和小数据提出了两种创新的SHM方法。就此而言，所提出的NNS-EVT旨在通过考虑相对较大的位移集来评估土木结构的健康状况。尽管准备大量SAR图像可能会遇到大数据问题和存储限制，但一些研究利用许多图像进行SHM任务（Farneti
    et al. 2022; Bayik et al. 2021; Militello et al. 2016）。所提出的概率机器学习方法的巨大优势在于，通过新奇性指数或损伤指标，能够同时处理测量（位移/变形）数据的变异性和可靠特征歧视的挑战。因此，第2.2节介绍了该方法。所提出的概率方法的一个巨大优势是其能够基于不同极值分布开发各种异常检测器。然而，在本书中，所提出的方法基于EVT的半参数概念和半参数极值分布的分位数建模。


    对于图像数量少导致位移数据少的SAR辅助SHM应用，本书主要通过提出各种离线和在线混合学习方法来应对这一挑战，即：(i) HMC-MD，(ii) HMC-DAE-MD，(iii)
    HMC-UTSL-MD，(iv) HMC-DTL-MD，(v) HMC-ODLT-EMD，和 (vi) SLS-ODLT-EMD。相应地，第2.3节和第2.4节分别详细介绍了离线和在线混合学习方法，以及学习这些技术所需的一些超参数优化算法。


    ### 2.2 应对大数据挑战：一种概率无监督学习方法


    所提出的名为NNS-EVT的概率机器学习方法旨在当数据规模相对较大时执行长期SHM过程。该方法的主要元素包括基于NNS的特征选择方法以及基于极值机（EVM）和半参数EVT的新奇性检测器。特征选择方法基于最近邻搜索，用于选择最合适和相关的样本，称为代表性特征。因此，这一步骤可以被视为一种降维策略，也是一种数据归一化方法。所提出机器学习方法的第二个元素是提出一个新奇性检测器，以区别正常样本（关于结构的未损坏状态）和异常样本（关于可能的损坏状态）。在此方法中，通过考虑EVT、半参数极值分布和分位数建模的概念，提出了一种新颖的概率方法。


    #### 2.2.1 极值理论及其应用


    在统计学中，EVT提供了一种广为人知且有用的概率技术，用于研究不寻常（罕见）事件和样本，而非通常事件。换句话说，该技术旨在从最大和最小样本以及罕见事件（Coles
    et al. 2001; Kotz and Nadarajah 2000; Castillo 1988）方面分析和建模极端数据样本。与专注于随机抽样数据的均值或概率分布中心的中心极限定理（CLT）不同，EVT的基本原理在于极端样本和概率分布的尾部。这很合理，因为建模概率分布右尾和左尾最相关的统计量包括最大样本和最小样本。EVT的巨大优势在于只需关注关于数据分布的少数假设，而无需对整个数据分布进行建模。


    为了建模极端值，通常有两种技术：基于Fisher-Tippet定理的块最大值（BM）和基于Balkema-de Haan-Pickands定理的峰值超过阈值（POT）（Résillat
    et al. 2018; Sarmadi and Yuen 2022; Sarmadi et al. 2023a）。第一种技术基于将随机抽样数据分成若干块（段），并选择每个块的最大或最小样本作为极端值（Sarmadi
    and Yuen 2022; Sarmadi and Karamodin 2020）。第二种技术设置一个阈值来选择极端（仅最大）样本（Sarmadi et
    al. 2023a, 2022）。在此基础上，感兴趣阈值之上的最大数据点被选为极端值建模的主要极端值。给定n个随机样本X1, ..., Xn，图2.1说明了BM和POT技术的图形表示，其中BM将抽样数据分成b个块，POT设置一个阈值用于极端样本选择。这意味着两种技术都需要超参数（即块数b和阈值水平），这些参数应被正确确定。一旦选择了极端值，就应考虑一种EVT分布进行建模。关于极值理论在SHM估计中的不同应用，可参见（Sarmadi
    and Yuen 2022; Sarmadi et al. 2023a）用于异常检测，以及（Sarmadi and Karamodin 2020; Sarmadi
